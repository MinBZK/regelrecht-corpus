    text: |-
      na goedkeuring van het deskundigheidsprofiel door de minister, al dan niet in aangepaste vorm, verzoekt de minister
      de raad van toezicht potentiële kandidaten te selecteren en een niet-bindende concept-voordracht van minimaal één
      kandidaat voor de invulling van de vacature te doen;
    url: https://wetten.overheid.nl/BWBR0032371/2013-01-01#Artikel8
