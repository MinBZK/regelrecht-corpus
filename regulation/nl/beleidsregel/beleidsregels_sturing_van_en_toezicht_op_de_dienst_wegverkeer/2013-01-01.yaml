      nieuw lid van de raad van toezicht te doen;
    url: https://wetten.overheid.nl/BWBR0032371/2013-01-01#Artikel8
  - number: 8.1.e
    text: de minister besluit tot benoeming of gemotiveerd tot afwijzing van de kandidaat;
    url: https://wetten.overheid.nl/BWBR0032371/2013-01-01#Artikel8
  - number: 8.1.f
    text: |-
      in de brief waarmee het benoemingsbesluit wordt toegezonden aan de betrokkene worden nogmaals de verwachtingen van
      het ministerie ten aanzien van de organisatie geschetst en verwezen naar het gesprek.
    url: https://wetten.overheid.nl/BWBR0032371/2013-01-01#Artikel8
