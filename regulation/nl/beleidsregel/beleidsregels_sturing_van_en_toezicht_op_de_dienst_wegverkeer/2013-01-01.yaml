        artikel: '8'
        paragraaf: '3'
  - number: '10.1'
    text: |-
      De kostprijzen die ten grondslag liggen aan de tarieven conform het
      [artikel 4b, eerste lid, en tweede lid, onderdeel a][ref1], en [4q, van de wet][ref2], alsmede aan de tarieven
      voor andere opgedragen taken op basis van artikel 4b, tweede lid, onderdeel b, van de wet voor zover deze taken
      mede een andere basis hebben in of krachtens de [wet][ref3], worden op basis van bedrijfseconomisch aanvaardbare
      verdeelsleutels bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel4b
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel4q
      [ref3]: https://wetten.overheid.nl/BWBR0006622
    url: https://wetten.overheid.nl/BWBR0032371/2013-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 4b
      - id: ref2
        bwb_id: BWBR0006622
        artikel: 4q
      - id: ref3
        bwb_id: BWBR0006622
  - number: '10.2'
    text: 'De in het eerste lid bedoelde tarieven kunnen bestaan uit de volgende componenten:'
    url: https://wetten.overheid.nl/BWBR0032371/2013-01-01#Artikel10
  - number: 10.2.a
    text: kosten van de taak of het cluster van taken onder beschouwing;
    url: https://wetten.overheid.nl/BWBR0032371/2013-01-01#Artikel10
  - number: 10.2.b
    text: structurele overdekking ter dekking van kosten die niet of niet geheel worden getarifeerd;
    url: https://wetten.overheid.nl/BWBR0032371/2013-01-01#Artikel10
  - number: 10.2.c
    text: over- of onderdekking teneinde de vermogenspositie te wijzigen.
    url: https://wetten.overheid.nl/BWBR0032371/2013-01-01#Artikel10
  - number: '11.1'
    text: |-
      Bij andere, op basis van [artikel 4b, tweede lid, onderdeel b, van de wet][ref1] door de minister opgedragen taken,
      voor zover deze taken niet mede een andere basis hebben in of krachtens de [wet][ref2], geeft de minister bij
      het opdragen van die taken aan dat er prijzen voor die taken in rekening worden gebracht en aan welke eisen deze
      prijzen moeten voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel4b
      [ref2]: https://wetten.overheid.nl/BWBR0006622
    url: https://wetten.overheid.nl/BWBR0032371/2013-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 4b
      - id: ref2
        bwb_id: BWBR0006622
  - number: '11.2'
    text: Indien voor deze prijzen een wettelijke basis noodzakelijk is, zorgt de minister hiervoor.
    url: https://wetten.overheid.nl/BWBR0032371/2013-01-01#Artikel11
  - number: '12.1'
    text: |-
      De minister besteedt bij de beoordeling van het voorstel voor de tarieven en tariefwijzigingen van de dienst ten
      behoeve van de goedkeuring op grond van [artikel 17 van de Kaderwet][ref1] in ieder geval aandacht aan de volgende
      aspecten:


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel17
    url: https://wetten.overheid.nl/BWBR0032371/2013-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '17'
  - number: 12.1.a
    text: |-
      de voorgestelde tarieven per taak dan wel per cluster van taken, alsmede de wettelijke basis voor en de
      rechtmatigheid van die tarieven;
    url: https://wetten.overheid.nl/BWBR0032371/2013-01-01#Artikel12
  - number: 12.1.b
    text: de voorgestelde wijzigingen in het tarievenbeleid;
    url: https://wetten.overheid.nl/BWBR0032371/2013-01-01#Artikel12
  - number: 12.1.c
    text: |-
      de invloed van en consequenties voor de vermogenspositie op basis van het jaarverslag van het voorafgaande jaar, de
      geprognosticeerde realisatie van het lopende jaar en de begroting van het komende jaar;
    url: https://wetten.overheid.nl/BWBR0032371/2013-01-01#Artikel12
  - number: 12.1.d
    text: de mate van kostendekkendheid en de kostenontwikkeling per taak dan wel per cluster van taken;
    url: https://wetten.overheid.nl/BWBR0032371/2013-01-01#Artikel12
  - number: 12.1.e
    text: de invloed van efficiëntie-ontwikkelingen;
    url: https://wetten.overheid.nl/BWBR0032371/2013-01-01#Artikel12
  - number: 12.1.f
    text: de invloed van loon- en prijsontwikkelingen;
    url: https://wetten.overheid.nl/BWBR0032371/2013-01-01#Artikel12
  - number: 12.1.g
    text: |-
      de in [artikel 10, tweede lid][ref1], genoemde componenten van dit tarief;


      [ref1]: https://wetten.overheid.nl/BWBR0032371#Artikel10
    url: https://wetten.overheid.nl/BWBR0032371/2013-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0032371
        artikel: '10'
        paragraaf: '4'
  - number: 12.1.h
    text: de reactie van de gebruikers, zoals weergegeven door de dienst;
    url: https://wetten.overheid.nl/BWBR0032371/2013-01-01#Artikel12
  - number: 12.1.i
    text: departementsoverstijgende aangelegenheden;
    url: https://wetten.overheid.nl/BWBR0032371/2013-01-01#Artikel12
  - number: 12.1.j
    text: maatschappelijke belangen;
    url: https://wetten.overheid.nl/BWBR0032371/2013-01-01#Artikel12
  - number: 12.1.k
    text: ontwikkeling van de doelmatigheid;
    url: https://wetten.overheid.nl/BWBR0032371/2013-01-01#Artikel12
  - number: 12.1.l
    text: kostendekkendheid per taakcluster;
    url: https://wetten.overheid.nl/BWBR0032371/2013-01-01#Artikel12
  - number: 12.1.m
    text: vooruitzicht voor volgende jaren;
    url: https://wetten.overheid.nl/BWBR0032371/2013-01-01#Artikel12
  - number: 12.1.n
    text: consistentie tussen de tarieven;
    url: https://wetten.overheid.nl/BWBR0032371/2013-01-01#Artikel12
  - number: 12.1.o
    text: de wijze waarop de tarieven zich verhouden tot de tarieven van het jaar ervoor.
    url: https://wetten.overheid.nl/BWBR0032371/2013-01-01#Artikel12
  - number: '12.2'
    text: |-
      Om de minister in staat te stellen de beoordeling, bedoeld in het eerste lid, uit te voeren, voegt de dienst bij
      het in het eerste lid bedoelde voorstel een toelichting die aansluit op de [artikelen 10][ref1] en [11][ref2] en
      ingaat op de consequenties van het streven naar kostendekkendheid per taak of taakcluster.


      [ref1]: https://wetten.overheid.nl/BWBR0032371#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0032371#Artikel11
    url: https://wetten.overheid.nl/BWBR0032371/2013-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0032371
        artikel: '10'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0032371
        artikel: '11'
        paragraaf: '4'
  - number: '12.3'
    text: |-
      Om de minister in staat te stellen de rechtmatigheid van de tarieven als bedoeld in het eerste lid, onderdeel
      a, te beoordelen, vermeldt de dienst bij het in het eerste lid bedoelde voorstel bij ieder tarief de wettelijke
      grondslag.
    url: https://wetten.overheid.nl/BWBR0032371/2013-01-01#Artikel12
  - number: '12.4'
    text: |-
      De dienst informeert de minister bij voorgestelde tariefwijzigingen en tarieven voor nieuwe taken of clusters van
      taken inzake de mogelijk aan het voorstel gekoppelde gevoeligheden.
    url: https://wetten.overheid.nl/BWBR0032371/2013-01-01#Artikel12
  - number: '13.1'
    text: |-
      Ten behoeve van de goedkeuring van het besluit tot vaststelling van de begroting conform
      [artikel 29 van de Kaderwet][ref1] beoordeelt de minister de begroting, zoals die door de dienst aan de minister
      is aangeboden na instemming van de raad van toezicht, en besteedt hij daarbij in ieder geval aandacht aan de
      onderdelen a tot en met f in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel29
    url: https://wetten.overheid.nl/BWBR0032371/2013-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '29'
  - number: '13.2'
    text: |-
      De begroting bevat de navolgende elementen, waarbij ter vergelijking bij de onderdelen a, b en c tevens de
      gerealiseerde gegevens van het laatst afgesloten boekjaar, het lopende jaar, het komende begrotingsjaar en de vier
      volgende jaren worden vermeld:
    url: https://wetten.overheid.nl/BWBR0032371/2013-01-01#Artikel13
  - number: 13.2.a
    text: |-
      de begroting conform [artikel 27 van de Kaderwet][ref1], aangevuld met de kosten en opbrengsten, zowel met
      betrekking tot de gehele exploitatie als onderscheiden per taakcluster;


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel27
    url: https://wetten.overheid.nl/BWBR0032371/2013-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '27'
  - number: 13.2.b
    text: de begrote gecomprimeerde balans per ultimo van het begrotingsjaar;
    url: https://wetten.overheid.nl/BWBR0032371/2013-01-01#Artikel13
  - number: 13.2.c
    text: de wijze van financiering;
    url: https://wetten.overheid.nl/BWBR0032371/2013-01-01#Artikel13
  - number: 13.2.d
    text: een overzicht en bedrijfseconomische onderbouwing van investeringen van zwaarwegend belang;
    url: https://wetten.overheid.nl/BWBR0032371/2013-01-01#Artikel13
  - number: 13.2.e
    text: |-
      de belangrijkste risico’s voor de continuïteit en de kwaliteit van de taakuitvoering van de dienst, de wijze waarop
      deze risico’s zijn afgedekt alsmede de financiële consequenties daarvan;
    url: https://wetten.overheid.nl/BWBR0032371/2013-01-01#Artikel13
  - number: 13.2.f
    text: een toelichting op de onderdelen a tot en met e.
    url: https://wetten.overheid.nl/BWBR0032371/2013-01-01#Artikel13
  - number: '14.1'
    text: |-
      Ten behoeve van de goedkeuring van het financieel meerjarenbeleidsplan beoordeelt de minister het plan, zoals dat
      door de dienst aan de minister is aangeboden na instemming van de raad van toezicht, en besteedt hij daarbij in
      ieder geval aandacht aan de volgende aspecten:
    url: https://wetten.overheid.nl/BWBR0032371/2013-01-01#Artikel14
  - number: 14.1.a
    text: |-
      volledigheid van de elementen genoemd in artikel 5, tweede lid, van de Regeling sturing van en toezicht op de
      Dienst Wegverkeer;
    url: https://wetten.overheid.nl/BWBR0032371/2013-01-01#Artikel14
  - number: 14.1.b
    text: mate van op-/afbouw reserves;
    url: https://wetten.overheid.nl/BWBR0032371/2013-01-01#Artikel14
  - number: 14.1.c
    text: kostendekkendheid per taakcluster;
    url: https://wetten.overheid.nl/BWBR0032371/2013-01-01#Artikel14
  - number: 14.1.d
    text: (maximale) omvang van de voorzieningen;
    url: https://wetten.overheid.nl/BWBR0032371/2013-01-01#Artikel14
  - number: 14.1.e
    text: investeringen van zwaarwegend belang;
    url: https://wetten.overheid.nl/BWBR0032371/2013-01-01#Artikel14
  - number: 14.1.f
    text: het maatschappelijk draagvlak voor tariefstijgingen, zowel bij de burger als bij de branche;
    url: https://wetten.overheid.nl/BWBR0032371/2013-01-01#Artikel14
  - number: 14.1.g
    text: de wettelijke basis voor de tarieven en de onderbouwing van die tarieven;
    url: https://wetten.overheid.nl/BWBR0032371/2013-01-01#Artikel14
  - number: 14.1.h
    text: |-
      ontwikkelingen in de kwaliteit van de dienstverlening in relatie tot de ontwikkelingen in de bedrijfsvoering en de
      voorgestelde tarieven.
    url: https://wetten.overheid.nl/BWBR0032371/2013-01-01#Artikel14
  - number: '14.2'
    text: |-
      Indien de beoordeling door de minister daartoe aanleiding geeft, overlegt de minister met de dienst en past de
      dienst het financieel meerjarenbeleidsplan aan.
    url: https://wetten.overheid.nl/BWBR0032371/2013-01-01#Artikel14
  - number: '15.1'
    text: |-
      De minister stelt een risicoprofiel op mede op basis van de risicoanalyse van de dienst om risicogestuurd toezicht
      te kunnen houden. Het risicoprofiel wordt besproken met de dienst.
    url: https://wetten.overheid.nl/BWBR0032371/2013-01-01#Artikel15
  - number: '15.2'
    text: |-
      De minister maakt gebruik van kernprestatie-indicatoren. De kernprestatie-indicatoren komen tot stand in afstemming
      tussen dienst en minister mede op basis van het in het voorgaande lid genoemde risicoprofiel.
    url: https://wetten.overheid.nl/BWBR0032371/2013-01-01#Artikel15
  - number: '16'
    text: |-
      De minister vormt zich een oordeel over de kwaliteit van de taakuitoefening van de dienst. Daarbij baseert hij zich
      onder meer op:
    url: https://wetten.overheid.nl/BWBR0032371/2013-01-01#Artikel16
  - number: 16.a
    text: |-
      de bevindingen voortvloeiend uit de in [artikel 19, tweede lid, van de Kaderwet][ref1] bedoelde voorzieningen;


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel19
    url: https://wetten.overheid.nl/BWBR0032371/2013-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '19'
  - number: 16.b
    text: de regelmatig door de dienst gehouden klant- en medewerkerstevredenheidsonderzoeken;
    url: https://wetten.overheid.nl/BWBR0032371/2013-01-01#Artikel16
  - number: 16.c
    text: |-
      de kernprestatie-indicatoren zoals bedoeld in [artikel 15][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0032371#Artikel15
    url: https://wetten.overheid.nl/BWBR0032371/2013-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0032371
        artikel: '15'
        paragraaf: '5'
  - number: '17.1'
    text: |-
      Bij het toetsen van voorstellen tot taakopdrachten van een ander bestuursorgaan en voornemens van de dienst tot het
      verrichten van markt- en nevenactiviteiten als bedoeld in artikel 18 van de Regeling sturing van en toezicht op de
      Dienst Wegverkeer, besteedt de minister in ieder geval aandacht aan de volgende aspecten:
    url: https://wetten.overheid.nl/BWBR0032371/2013-01-01#Artikel17
  - number: 17.1.a
    text: |-
      de taken en markt- en nevenactiviteiten zijn verenigbaar met de reeds aan de dienst opgedragen taken en niet in
      strijd met overige wet- en regelgeving of rijksbeleid;
    url: https://wetten.overheid.nl/BWBR0032371/2013-01-01#Artikel17
  - number: 17.1.b
    text: |-
      er is voorzien in een kostendekkende financiering van de taken en markt- en nevenactiviteiten door de opdrachtgever
      of gebruikers.
    url: https://wetten.overheid.nl/BWBR0032371/2013-01-01#Artikel17
  - number: '17.2'
    text: |-
      Met het oog op de in het eerste lid bedoelde toetsing legt de dienst aan de minister een uitwerking en onderbouwing
      voor van het voorstel voor een nieuwe taak of voornemen tot een nieuwe marktactiviteit.
    url: https://wetten.overheid.nl/BWBR0032371/2013-01-01#Artikel17
  - number: '17.3'
    text: |-
      Voor zover het markactiviteiten betreft die niet voortvloeien uit een verzoek van een andere voorgenomen
      opdrachtgever onderzoekt de minister, in overleg met de dienst, de markteffecten met het oog op het voorkomen van
      verstoringen van marktverhoudingen.
    url: https://wetten.overheid.nl/BWBR0032371/2013-01-01#Artikel17
  - number: '17.4'
    text: |-
      Voor zover het markactiviteiten betreft die voortvloeien uit een verzoek van een andere voorgenomen opdrachtgever
      dan de minister onderzoekt die opdrachtgever, in overleg met de minister en met de dienst, de markteffecten met het
      oog op het voorkomen van verstoringen van marktverhoudingen.
    url: https://wetten.overheid.nl/BWBR0032371/2013-01-01#Artikel17
  - number: '17.5'
    text: |-
      De minister toetst tevens of het systeem van doorberekening van kosten van markt- en nevenactiviteiten aan afnemers
      voldoet aan de eisen van het [Besluit markt en overheid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0031654
    url: https://wetten.overheid.nl/BWBR0032371/2013-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0031654
  - number: '17.6'
    text: |-
      De minister integreert zijn beslissing over instemming met voorstellen en voornemens zoals bedoeld in het eerste
      en tweede lid in zijn beslissing over goedkeuring van de begroting, tarieven en financieel meerjarenbeleidsplan,
      indien die hem zijn voorgelegd in het voorstel voor de begroting, tarieven incl. het meerjarenbeleidsplan. In
      andere gevallen wordt een afzonderlijke instemmingsprocedure doorlopen.
    url: https://wetten.overheid.nl/BWBR0032371/2013-01-01#Artikel17
  - number: '18.1'
    text: |-
      De minister voert de evaluatie zoals bedoeld in [artikel 39 van de Kaderwet][ref1] uit conform de op het moment van
      evaluatie geldende evaluatierichtlijnen van de minister van Financiën.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel39
    url: https://wetten.overheid.nl/BWBR0032371/2013-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '39'
  - number: '18.2'
    text: |-
      De minister stelt de dienst in kennis van het verslag alvorens de minister het verslag aan de Staten-Generaal
      zendt, met het verzoek hierop te reageren binnen de bij het verzoek door de minister gestelde termijn.
    url: https://wetten.overheid.nl/BWBR0032371/2013-01-01#Artikel18
  - number: '18.3'
    text: |-
      De minister reageert op de visie van de dienst ten aanzien van het verslag en geeft daarbij in ieder geval aan in
      hoeverre de visie van de dienst is betrokken bij de finale besluitvorming.
    url: https://wetten.overheid.nl/BWBR0032371/2013-01-01#Artikel18
  - number: '19'
    text: 'Deze beleidsregels worden aangehaald als: Beleidsregels sturing van en toezicht op de Dienst Wegverkeer.'
    url: https://wetten.overheid.nl/BWBR0032371/2013-01-01#Artikel19
  - number: '20'
    text: Deze regels treden in werking met ingang van 1 januari 2013.
    url: https://wetten.overheid.nl/BWBR0032371/2013-01-01#Artikel20
