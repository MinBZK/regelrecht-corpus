preamble:
  text: |-
    Gelet op artikel 4:81 van de Algemene wet bestuursrecht en artikel 21 van de Kaderwet zelfstandige bestuursorganen;

    BESLUIT:
  url: https://wetten.overheid.nl/BWBR0032371/2013-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regels wordt verstaan onder: - *de dienst:* de Dienst Wegverkeer;
        - *de Kaderwet:* de [Kaderwet zelfstandige bestuursorganen][ref1];
        - *de wet:* de [Wegenverkeerswet 1994][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020495
      [ref2]: https://wetten.overheid.nl/BWBR0006622
    url: https://wetten.overheid.nl/BWBR0032371/2013-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0020495
      - id: ref2
        bwb_id: BWBR0006622
  - number: '2'
    text: |-
      Bij de goedkeuring van het bestuursreglement op grond van [artikel 11 Kaderwet][ref1] io.
      [artikel 4n van de wet][ref2] bekijkt de minister in ieder geval of ten aanzien van de hierna volgende onderwerpen
      bepalingen zijn opgenomen:


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel4n
    url: https://wetten.overheid.nl/BWBR0032371/2013-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: 4n
  - number: 2.a
    text: een nadere omschrijving van de taken van de leden van de directie;
    url: https://wetten.overheid.nl/BWBR0032371/2013-01-01#Artikel2
  - number: 2.b
    text: nadere bepaling van de bevoegdheden binnen de directie;
    url: https://wetten.overheid.nl/BWBR0032371/2013-01-01#Artikel2
  - number: 2.c
    text: de schriftelijke goedkeuring van diverse besluiten door de raad van toezicht;
    url: https://wetten.overheid.nl/BWBR0032371/2013-01-01#Artikel2
  - number: 2.d
    text: de besluitvorming in en buiten de vergadering;
    url: https://wetten.overheid.nl/BWBR0032371/2013-01-01#Artikel2
  - number: 2.e
    text: de notulen van de vergadering;
    url: https://wetten.overheid.nl/BWBR0032371/2013-01-01#Artikel2
  - number: 2.f
    text: het hebben en melden van nevenfuncties aan de raad van toezicht;
    url: https://wetten.overheid.nl/BWBR0032371/2013-01-01#Artikel2
  - number: 2.g
    text: de handelwijze in geval van tegenstrijdige belangen van een lid van de directie.
    url: https://wetten.overheid.nl/BWBR0032371/2013-01-01#Artikel2
  - number: '3.1'
    text: 'Bij de benoeming van een nieuw lid van de directie worden de volgende processtappen gevolgd:'
    url: https://wetten.overheid.nl/BWBR0032371/2013-01-01#Artikel3
  - number: 3.1.a
    text: de minister verzoekt de raad van toezicht een deskundigheidsprofiel op te stellen voor het nieuwe directielid;
    url: https://wetten.overheid.nl/BWBR0032371/2013-01-01#Artikel3
  - number: 3.1.b
    text: |-
      na goedkeuring van het deskundigheidsprofiel door de minister, al dan niet in aangepaste vorm, verzoekt de minister
      de raad van toezicht potentiële kandidaten te selecteren en een niet-bindende concept-voordracht van minimaal één
      kandidaat voor de invulling van de vacature te doen;
    url: https://wetten.overheid.nl/BWBR0032371/2013-01-01#Artikel3
  - number: 3.1.c
    text: |-
      na het akkoord van de minister op de concept-voordracht worden door de secretaris-generaal gesprekken met de
      kandida(a)t(en) gevoerd, waarin verwachtingen van de minister ten aanzien van de organisatie worden geschetst. Het
      gaat om voorziene ontwikkelingen in beleid en de verwachte bijdrage van de betreffende organisatie hieraan alsmede
      de bijdrage van het specifiek te benoemen lid. Evenzo kan hierin worden stilgestaan bij de onderlinge werkwijze
      en relatie;
    url: https://wetten.overheid.nl/BWBR0032371/2013-01-01#Artikel3
  - number: 3.1.d
    text: |-
      de secretaris-generaal stelt de raad van toezicht op de hoogte van zijn bevindingen en verzoekt de raad van
      toezicht een met de bevindingen van de secretaris-generaal rekening houdende, niet-bindende voordracht voor een
      nieuw lid van de directie te doen;
    url: https://wetten.overheid.nl/BWBR0032371/2013-01-01#Artikel3
  - number: 3.1.e
    text: de minister besluit tot benoeming of gemotiveerd tot afwijzing van de kandidaat;
    url: https://wetten.overheid.nl/BWBR0032371/2013-01-01#Artikel3
  - number: 3.1.f
    text: |-
      in de brief waarmee het benoemingsbesluit wordt toegezonden aan de betrokkene worden onder verwijzing naar het
      gesprek met de secretaris-generaal de verwachtingen van de minister ten aanzien van de organisatie geschetst.
    url: https://wetten.overheid.nl/BWBR0032371/2013-01-01#Artikel3
  - number: '3.2'
    text: Indien de minister besluit tot afwijzing van de kandidaat, wordt de procedure herhaald.
    url: https://wetten.overheid.nl/BWBR0032371/2013-01-01#Artikel3
  - number: '4.1'
    text: 'Bij de herbenoeming van een lid van de directie worden de volgende processtappen gevolgd:'
    url: https://wetten.overheid.nl/BWBR0032371/2013-01-01#Artikel4
  - number: 4.1.a
    text: de minister voert overleg met de raad van toezicht over de herbenoeming van een lid van de directie;
    url: https://wetten.overheid.nl/BWBR0032371/2013-01-01#Artikel4
  - number: 4.1.b
    text: |-
      de raad van toezicht doet een niet bindende voordracht voor de herbenoeming van het betreffende lid van de
      directie;
    url: https://wetten.overheid.nl/BWBR0032371/2013-01-01#Artikel4
  - number: 4.1.c
    text: de minister besluit tot herbenoeming van het betreffende lid van de directie of gemotiveerd tot afwijzing.
    url: https://wetten.overheid.nl/BWBR0032371/2013-01-01#Artikel4
  - number: '4.2'
    text: |-
      Indien uit het in het eerste lid, onderdeel a, genoemde overleg blijkt dat er bij de betrokkenen onvoldoende
      draagvlak bestaat voor de herbenoeming, of de minister besluit tot afwijzing, wordt de procedure van
      [artikel 3][ref1] gevolgd.


      [ref1]: https://wetten.overheid.nl/BWBR0032371#Artikel3
    url: https://wetten.overheid.nl/BWBR0032371/2013-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0032371
        artikel: '3'
        paragraaf: '2'
  - number: '5'
    text: |-
      Voorafgaand aan schorsing of ontslag van de leden van de directie informeert de minister de raad van toezicht over
      zijn voornemen.
    url: https://wetten.overheid.nl/BWBR0032371/2013-01-01#Artikel5
  - number: '6'
    text: |-
      Ten behoeve van het vaststellen van de bezoldiging van de directie conform
      [artikel 14, tweede lid, van de Kaderwet][ref1] verzoekt de minister de raad van toezicht
      om een voorstel voor de bezoldiging van de directie op te stellen, rekening houdend met de
      [Wet normering bezoldiging topfunctionarissen publieke en semipublieke sector][ref2]. De raad van toezicht kan
      binnen een door de minister vastgestelde marge jaarlijks een variabele component toekennen aan de directie,
      afhankelijk van de prestaties en de realisatie van vooraf tussen de raad van toezicht en de directie overeengekomen
      doelen. Die marge blijft binnen de grenzen die de Wet normering bezoldiging topfunctionarissen publieke en
      semipublieke sector stelt.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0032249
    url: https://wetten.overheid.nl/BWBR0032371/2013-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0032249
  - number: '7'
    text: |-
      Bij de goedkeuring van het reglement van de raad van toezicht op grond van
      [artikel 4l, zevende lid, van de wet][ref1] bekijkt de minister in ieder geval of ten aanzien van de hierna
      volgende onderwerpen bepalingen zijn opgenomen:


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel4l
    url: https://wetten.overheid.nl/BWBR0032371/2013-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 4l
  - number: 7.a
    text: een nadere omschrijving van de taken van de leden van de raad van toezicht;
    url: https://wetten.overheid.nl/BWBR0032371/2013-01-01#Artikel7
  - number: 7.b
    text: een nadere bepaling van de bevoegdheden van en binnen de raad van toezicht;
    url: https://wetten.overheid.nl/BWBR0032371/2013-01-01#Artikel7
  - number: 7.c
    text: de besluitvorming in en buiten de vergadering;
    url: https://wetten.overheid.nl/BWBR0032371/2013-01-01#Artikel7
  - number: 7.d
    text: de notulen van de vergadering;
    url: https://wetten.overheid.nl/BWBR0032371/2013-01-01#Artikel7
  - number: 7.e
    text: de handelwijze in geval van tegenstrijdige belangen van een lid van de raad van toezicht;
    url: https://wetten.overheid.nl/BWBR0032371/2013-01-01#Artikel7
  - number: 7.f
    text: de instelling en werkwijze van commissies zoals een auditcommissie.
    url: https://wetten.overheid.nl/BWBR0032371/2013-01-01#Artikel7
  - number: '8.1'
    text: 'Bij de benoeming van een nieuw lid van de raad van toezicht worden de volgende processtappen gevolgd:'
    url: https://wetten.overheid.nl/BWBR0032371/2013-01-01#Artikel8
