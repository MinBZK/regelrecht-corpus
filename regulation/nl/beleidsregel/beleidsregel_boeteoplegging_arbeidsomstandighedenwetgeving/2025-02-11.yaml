preamble:
  text: >-
    Gelet op de artikelen 33, eerste en tweede lid, en 34 van de Arbeidsomstandighedenwet;


    Besluit:
  url: https://wetten.overheid.nl/BWBR0032326/2025-02-11#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze beleidsregel wordt onderscheid gemaakt tussen drie typen overtredingen, te weten:

      a. een *zware overtreding* (*ZO*), oftewel een overtreding die in de bijlage als *ZO* is aangemerkt en waarvoor
      direct een boete wordt gegeven;

      b. een *overtreding met directe boete* (*ODB*), oftewel een overtreding die in de bijlage als *ODB* is aangemerkt
      en waarvoor direct een bestuurlijke boete wordt gegeven; en

      c. een overige overtreding (OO), oftewel een overtreding die in de bijlage als OO is aangemerkt en waarvoor
      eerst een waarschuwing of een kennisgeving van een eis tot naleving wordt gegeven, of een eis tot naleving wordt
      gesteld, en pas nadat dezelfde of een soortgelijke overtreding opnieuw wordt geconstateerd, wordt overgegaan tot
      boeteoplegging.

      2 Hiernaast geldt in deze beleidsregel als overtreding met directe boete de overtreding die de directe aanleiding
      is geweest voor een arbeidsongeval als bedoeld in [artikel 9, eerste lid, van de Arbeidsomstandighedenwet][ref1].

      3 a. Bij de berekening van een bestuurlijke boete als bedoeld in [artikel 33, eerste en tweede lid][ref2], en
      [artikel 34 van de Arbeidsomstandighedenwet][ref3] worden zeven categorieën normbedragen onderscheiden, te weten:

      1°. het 1e normbedrag € 340;

      2°. het 2e normbedrag € 750;

      3°. het 3e normbedrag € 1500;

      4°. het 4e normbedrag € 3000;

      5°. het 5e normbedrag € 4500;

      6°. het 6e normbedrag € 9000;

      7°. het 7e normbedrag € 13500;

      b. In afwijking van onderdeel a wordt voor het door een werkgever niet onverwijld melden van een arbeidsongeval
      als bedoeld in [artikel 9, eerste lid, van de Arbeidsomstandighedenwet][ref4] en waarbij de toezichthouder geen
      onderzoek meer kan verrichten, een boetenormbedrag opgenomen van € 50000.

      4 Overtredingen die meermalen voorkomen, kunnen maximaal drie keer in de berekening van de op te leggen
      bestuurlijke boete worden meegenomen.

      5 De totale bij een boetebeschikking op te leggen bestuurlijke boete bestaat, in geval er sprake is van meer dan
      één overtreding, uit de som van de per overtreding berekende boetebedragen.

      6 De bestuurlijke boete die per boetebeschikking aan een werknemer kan worden opgelegd, bedraagt maximaal € 450.

      7 In de bijlage bij deze beleidsregel is per artikel, artikellid of onderdeel daarvan, dat is
      aangemerkt als overtreding waarvoor een bestuurlijke boete kan worden opgelegd bij of krachtens de
      [Arbeidsomstandighedenwet][ref5], aangegeven welk categorie normbedrag zal worden opgelegd en om welk type
      overtreding het gaat.

      Tevens is in de bijlage aangegeven voor welke overtredingen een boete aan een werknemer kan worden opgelegd.

      8 De in het derde lid genoemde normbedragen zijn uitgangspunt voor de berekening van op te leggen bestuurlijke
      boetes voor bedrijven of instellingen met 500 of meer werknemers. Voor bedrijven of instellingen van geringere
      omvang geldt het volgende:

      a. bedrijven of instellingen met minder dan 5 werknemers betalen 10 procent;

      b. bedrijven of instellingen met 5 tot en met 9 werknemers betalen 20 procent;

      c. bedrijven of instellingen met 10 tot en met 39 werknemers betalen 30 procent;

      d. bedrijven of instellingen met 40 tot en met 99 werknemers betalen 50 procent;

      e. bedrijven of instellingen met 100 tot en met 249 werknemers betalen 60 procent;

      f. bedrijven of instellingen met 250 tot en met 499 werknemers betalen 80 procent.

      Een al dan niet op bedrijfsgrootte gecorrigeerd normbedrag is het uitgangsbedrag voor eventuele verdere
      boeteberekening.

      Bij overtredingen begaan door anderen dan de werkgever, te weten: de opdrachtgever, de ontwerpende partij en de
      uitvoerende partij bedoeld in [artikel 1.1, tweede lid, van het Arbeidsomstandighedenbesluit][ref6], wordt niet
      gecorrigeerd naar het aantal werknemers. Bij overtredingen begaan door werknemers, zelfstandigen en meewerkende
      werkgevers geldt als uitgangspunt voor de berekening van de op te leggen bestuurlijke boete een normbedrag dat is
      gecorrigeerd voor bedrijven of instellingen met minder dan 5 werknemers.

      Bij overtredingen begaan door bedrijfsartsen en deskundige personen als bedoeld in
      [artikel 14, eerste lid, van de Arbeidsomstandighedenwet][ref7], worden de in de bijlage, Tarieflijst, onderdeel
      Arbowet, bij artikel 14, tweede en derde lid, genoemde normbedragen gehanteerd voor de berekening van de op te
      leggen bestuurlijke boete.

      Bij overtredingen begaan door werknemers of zelfstandigen geldt als uitgangspunt voor de berekening van de op
      te leggen bestuurlijke boete een normbedrag dat is gecorrigeerd voor bedrijven of instellingen met minder dan 5
      werknemers of zelfstandigen.

      9 a. Voor de boeteberekening van overtredingen geconstateerd op locaties of in filialen, wordt als bedrijfs/
      instellingsgrootte het aantal werknemers van de gehele juridische eenheid gehanteerd;

      b. Voor een bestuurlijke boete die wordt opgelegd aan degene bij wie vrijwilligers werkzaam zijn wordt voor de
      bedrijfsgrootte uitgegaan van het aantal vrijwilligers dat ten tijde van de overtreding werkzaam was op de locatie
      waar de overtreding heeft plaatsgevonden. Indien bij degene bij wie vrijwilligers werkzaam zijn, ook werknemers
      werkzaam zijn, wordt voor de bedrijfsgrootte uitgegaan van het totaal aantal werknemers en vrijwilligers.

      10 Bij de berekening van de op te leggen bestuurlijke boete kunnen één of meer van de volgende factoren aan de orde
      zijn en leiden tot verhoging van het al dan niet op bedrijfsgrootte gecorrigeerde boetenormbedrag:

      a. bij een arbeidsongeval dat leidt tot de dood of uitzonderlijk ernstig blijvend letsel worden de
      boetenormbedragen voor de daaraan ten grondslag liggende overtreding of overtredingen vermenigvuldigd met vijf;

      b. bij een arbeidsongeval dat leidt tot blijvend letsel worden de boetenormbedragen van de daaraan ten grondslag
      liggende overtredingen met het volgende getal vermenigvuldigd:

      1°. bij ernstig blijvend letsel met vier;

      2°. bij matig blijvend letsel met drieënhalf;

      3°. bij licht blijvend letsel met drie;

      c. bij een arbeidsongeval dat leidt tot een ziekenhuisopname worden de boetenormbedragen voor de daaraan ten
      grondslag liggende overtreding of overtredingen met het volgende getal vermenigvuldigd, waarbij onder het begrip
      ‘nacht’ wordt verstaan het tijdvak gelegen tussen 24.00 en 06.00 uur;

      1°. bij een ziekenhuisopname van zeven nachten en meer met vier;

      2°. bij een ziekenhuisopname van twee nachten en meer, maar minder dan zeven nachten, met drieënhalf;

      3°. bij een ziekenhuisopname van minder dan twee nachten met drie;

      d. in aanvulling op de onderdelen b en c, wordt in het geval van een combinatie van de factoren ‘blijvend letsel’
      en ‘ziekenhuisopname’ de hoogst toepasselijke vermenigvuldigingsfactor toegepast;

      e. in het geval van een zware overtreding (ZO), wordt het boetenormbedrag vermenigvuldigd met twee;

      f. indien meer dan tien, respectievelijk meer dan vijftig werknemers aan een niet-administratieve overtreding zijn
      blootgesteld wordt het boetenormbedrag vermenigvuldigd met anderhalf, respectievelijk twee.

      11 Indien de werkgever aantoont dat hij inspanningen heeft verricht, gericht op het voorkomen van de overtreding in
      het concrete geval, kan dit leiden tot matiging van het al dan niet op bedrijfsgrootte gecorrigeerde normbedrag. De
      volgende inspanningen kunnen leiden tot een matiging van 25% per onderdeel:

      a. als de risico’s van de concrete werkzaamheden voldoende zijn geïnventariseerd en een veilige werkwijze is
      ontwikkeld die voldoet aan de vereisten van het bepaalde bij of krachtens de [Arbeidsomstandighedenwet][ref8];

      b. als de noodzakelijke randvoorwaarden zijn gecreëerd voor het toepassen van een veilige werkwijze;

      c. als er adequate instructies zijn gegeven;

      d. als er adequaat toezicht is gehouden.

      12 Indien de werkgever aantoont dat hij na de overtreding adequate maatregelen heeft genomen, kan dit leiden tot
      een boetematiging van 12,5%. Maatregelen zijn adequaat als zij:

      a. zijn gericht op het voorkomen van dezelfde of soortgelijke overtredingen; en

      b. zo snel mogelijk na de overtreding zijn genomen.

      13 Als werkgever in de zin van het elfde of twaalfde lid wordt mede begrepen degene bij wie vrijwilligers werkzaam
      zijn.

      14 Bij de vaststelling of sprake is van herhaling van dezelfde of soortgelijke overtredingen wordt bij zelfstandig
      opererende nevenvestigingen van rechtspersonen gehandeld alsof deze afzonderlijke ondernemingen zijn.

      15 Indien rechtspersonen langer dan zes aaneengesloten maanden op dezelfde bouwlocatie werkzaamheden verrichten,
      wordt die bouwlocatie beschouwd als nevenvestiging als bedoeld in het veertiende.

      16 Het veertiende en vijftiende lid zijn niet van toepassing op ernstige overtredingen, als bedoeld in
      [artikel 9.10a, derde lid, van het Arbeidsomstandighedenbesluit][ref9].

      17 In aanvulling op of in afwijking van de leden drie tot en met vijf en zeven tot en met twaalf, kan het bedrag
      van de boete worden verhoogd of verlaagd totdat deze evenredig is en daarmee passend en geboden.


