  - number: '3'
    text: |-
      1 De aanvraag door een ondernemer wordt ingediend met gebruikmaking van een formulier, overeenkomstig het model
      dat is opgenomen in de bij deze beleidsregel behorende [bijlage 1][ref1] en gaat vergezeld van de bescheiden,
      overeenkomstig hetgeen in het formulier is vermeld.

      2 In geval van een samenwerkingsverband als bedoeld in [artikel 2, eerste lid, onder b][ref2], dient een der
      deelnemers namens de overige deelnemers in het samenwerkingsverband de aanvraag voor het samenwerkingsverband
      in, met gebruikmaking van een formulier, overeenkomstig het model dat is opgenomen in de bij deze beleidsregel
      behorende [bijlage 2][ref3] en gaat de aanvraag vergezeld van bewijsstukken van het bestaan van dit
      samenwerkingsverband, alsmede de bescheiden, overeenkomstig hetgeen in het formulier is vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0018805
      [ref2]: https://wetten.overheid.nl/BWBR0018805#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0018805
