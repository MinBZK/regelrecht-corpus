  - number: '4'
    text: |-
      1 In 2005 zijn op grond van de Subsidieregeling pilot innovatievouchers 2005 tweede fase:

      a. 450 innovatievouchers beschikbaar voor ondernemers als bedoeld in [artikel 2, eerste lid, onder a][ref1];

      b. 150 innovatievouchers beschikbaar voor ondernemers als bedoeld in [artikel 2, eerste lid, onder b][ref2].

      2 Aanvragen dienen uiterlijk 16 december 2005 te zijn ontvangen door SenterNovem.

      3 De minister verdeelt de beschikbare innovatievouchers in de volgorde van ontvangst van de aanvragen, met dien
      verstande dat indien een aanvrager niet heeft voldaan aan enig voorschrift voor het in behandeling nemen van de
      aanvraag en met toepassing van [artikel 4:5 van de Algemene wet bestuursrecht][ref3] de gelegenheid heeft gehad de
      aanvraag aan te vullen, de dag waarop de aanvraag voldoet aan de voorschriften met betrekking tot de verdeling als
      datum van ontvangst geldt.

      4 Indien honorering van alle aanvragen die op één dag zijn ontvangen ertoe zou leiden dat het beschikbare aantal
      innovatievouchers zou worden overschreden, stelt de minister de onderlinge rangschikking van deze aanvragen vast
      door middel van loting.

      5 In het geval de aanvraag is ingediend op de in [artikel 3, tweede lid][ref4], aangegeven wijze en honorering van
      de aanvraag van dat samenwerkingsverband zou leiden tot overschrijding van het op grond van het eerste lid, onder
      b, beschikbare aantal innovatievouchers, worden de deelnemers in het desbetreffende samenwerkingsverband in de
      gelegenheid gesteld aan te geven of zij het aantal innovatievouchers zodanig wensen te verminderen, dat binnen het
      resterende aantal beschikbare innovatievouchers wordt gebleven. Indien de deelnemers in het samenwerkingsverband
      van deze gelegenheid geen gebruik maken of indien het resterende aantal innovatievouchers minder dan drie bedraagt,
      wordt de aanvraag van dat samenwerkingsverband afgewezen.

      6 Indien na afloop van de termijn, genoemd in het tweede lid, blijkt dat niet alle innovatievouchers voor
      een categorie ondernemers, bedoeld in het eerste lid, onder a of b, zijn verstrekt, worden de resterende
      innovatievouchers toegevoegd aan het beschikbare aantal vouchers voor de andere categorie ondernemers. Zij
      zullen, op de wijze als in dit artikel bepaald, worden verdeeld onder de ondernemers die reeds een aanvraag om
      een innovatievoucher hadden ingediend, maar voor wie eerder, na toepassing van het eerste tot en met vijfde lid,
      onvoldoende vouchers beschikbaar waren.


