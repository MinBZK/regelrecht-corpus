  - number: '1.2'
    text: De minister kan op aanvraag eenmalig financiële ondersteuning verstrekken aan een zorgmedewerker.
    url: https://wetten.overheid.nl/BWBR0048596/2024-06-15#Artikel1.2
  - number: 1.3.1
    text: |-
      Door het aanvragen van financiële ondersteuning op grond van deze beleidsregel doet de zorgmedewerker geen afstand
      van een lopende of een toekomstige aansprakelijkstelling.
    url: https://wetten.overheid.nl/BWBR0048596/2024-06-15#Artikel1.3
  - number: 1.3.2
    text: |-
      De Staat der Nederlanden erkent geen enkele aansprakelijkheid door verstrekking en uitbetaling van financiële
      ondersteuning uit hoofde van deze beleidsregel.
    url: https://wetten.overheid.nl/BWBR0048596/2024-06-15#Artikel1.3
  - number: 1.3.3
    text: |-
      Een aanvraag voor financiële ondersteuning wordt niet aangemerkt als aansprakelijkstelling of als stuiting van
      de verjaring.
    url: https://wetten.overheid.nl/BWBR0048596/2024-06-15#Artikel1.3
  - number: 1.4.1
    text: |-
      Een zorgaanbieder is een privaatrechtelijke rechtspersoon die, een organisatorisch verband van natuurlijke personen
      dat of een natuurlijke persoon die:
    url: https://wetten.overheid.nl/BWBR0048596/2024-06-15#Artikel1.4
  - number: 1.4.1.a
    text: |-
      bedrijfsmatig zorg verleent die wordt bekostigd op grond van een zorgverzekering als bedoeld in
      [artikel 1, onder d, van de Zorgverzekeringswet][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel1
    url: https://wetten.overheid.nl/BWBR0048596/2024-06-15#Artikel1.4
    references:
