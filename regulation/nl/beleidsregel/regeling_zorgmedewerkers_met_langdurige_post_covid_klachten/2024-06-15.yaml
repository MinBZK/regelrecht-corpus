articles:
  - number: '1.1'
    text: |-
      In deze beleidsregel wordt verstaan onder: - *AGB-code:* unieke Algemene GegevensBeheer-code van een zorgaanbieder
      zoals geregistreerd in het Algemene GegevensBeheer-register dat wordt beheerd door Vektis;
        - *arts:* een arts die als zodanig staat ingeschreven in het daarvoor ingestelde register, bedoeld in
      [artikel 3 van de Wet BIG][ref1];
        - *COVID-19:* de ziekte veroorzaakt door het coronavirus SARS-CoV-2;
        - *dienstverband:* een dienstverband als bedoeld in [artikel 2.1, eerste lid, onder a][ref2], van deze
      beleidsregel;
        - *financiële ondersteuning:* een bedrag van € 24.010 per zorgmedewerker;
        - *gewaarmerkt verzekeringsbericht:* een overzicht van het arbeidsverleden en
      de loongegevens betreffende de zorgmedewerker, verstrekt op de wijze bedoeld in
      [artikel 33c van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref3], voorzien van een waarmerk van
      het UWV;
        - *handelsregister:* handelsregister als bedoeld in [artikel 1, onder h, van de Handelsregisterwet 2007][ref4];
        - *justitiële inrichting:* een van de justitiële inrichtingen, genoemd in [bijlage 1][ref5];
        - *langdurige post-COVID klachten:* long-COVID zoals gedefinieerd door het Nederlands Centrum voor Beroepsziekten
      of langdurige klachten na COVID-19 zoals vastgelegd in de NHG-standaard M112 Langdurige klachten na COVID-19;
        - *Minister:* de Minister van Volksgezondheid, Welzijn en Sport;
        - *militair geneeskundige dienst:* de militair geneeskundige dienst, bedoeld in
      [artikel 1, eerste lid, onder f, van de Wet ambtenaren defensie][ref6];
        - *SBI-code:* code van de Standaard Bedrijfsindeling zoals gehanteerd door het Centraal Bureau voor de Statistiek
      waarmee de economische hoofd- of nevenactiviteit van een bedrijf wordt weergegeven in het handelsregister;
        - *tijdvak:* de periode van 1 maart 2020 tot en met 31 december 2020;
        - *UWV:* het Uitvoeringsinstituut werknemersverzekeringen, genoemd in
      [hoofdstuk 5 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref7];
        - *verlenging van de loondoorbetalingsplicht:* de verlenging van het tijdvak van de verplichte loondoorbetaling
      door het UWV tot ten hoogste 52 weken op grond van [artikel 25, negende lid, van de WIA][ref8];
        - *vrijwillige verlenging van de loondoorbetaling:* de vrijwillige verlenging van het tijdvak van de verplichte
      loondoorbetaling op grond van [artikel 24 van de WIA][ref9];
        - *Wet BIG:* [Wet op de beroepen in de individuele gezondheidszorg][ref10];
        - *WIA:* [Wet werk en inkomen naar arbeidsvermogen][ref11];
        - *WIA-beslissing:* de beslissing van het UWV op een aanvraag als bedoeld in [artikel 64 van de WIA][ref12];
        - *zorgaanbieder:* een zorgaanbieder als bedoeld in [artikel 1.4][ref13] van deze beleidsregel;
        - *zorgmedewerker:* een natuurlijk persoon die voldoet aan de voorwaarden, bedoeld in [artikel 2.1][ref14] van
      deze beleidsregel.


