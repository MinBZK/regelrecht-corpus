      [artikel 1 van de WIA][ref1], als rechtstreeks en objectief medisch vast te stellen gevolg van langdurige post-
      COVID klachten; of


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel1
    url: https://wetten.overheid.nl/BWBR0048596/2024-06-15#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '1'
  - number: 2.1.1.e.4°
    text: |-
      uiterlijk 1 juli 2023 voldoet aan hetgeen gesteld is onder 1°, 2° of 3° ingeval van vrijwillige verlenging van de
      loondoorbetaling of verlenging van de loondoorbetalingsplicht.
    url: https://wetten.overheid.nl/BWBR0048596/2024-06-15#Artikel2.1
  - number: 2.1.2
    text: |-
      Als de zorgmedewerker werkzaam was bij een justitiële inrichting stond deze, in aanvulling op het
      eerste lid, tijdens het tijdvak als arts of verpleegkundige ingeschreven in het register, bedoeld in
      [artikel 3 van de Wet BIG][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel3
    url: https://wetten.overheid.nl/BWBR0048596/2024-06-15#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '3'
  - number: 2.1.3
    text: |-
      De minister kan afwijken van het eerste lid, onder a, voor zover toepassing gelet op het belang dat de
      desbetreffende bepalingen beogen te beschermen, zal leiden tot een onbillijkheid van overwegende aard.
    url: https://wetten.overheid.nl/BWBR0048596/2024-06-15#Artikel2.1
  - number: 2.1.4
    text: |-
      De minister kan afwijken van de 104 weken, bedoeld in het eerste lid, onder e, als sprake is van wachttijd die is
      bepaald op grond van [artikel 23, derde lid, van de WIA][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel23
    url: https://wetten.overheid.nl/BWBR0048596/2024-06-15#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '23'
  - number: 2.1.5
    text: De minister kan afwijken van de datum, bedoeld in het eerste lid, onder e, onder 4°.
    url: https://wetten.overheid.nl/BWBR0048596/2024-06-15#Artikel2.1
  - number: 2.2.1
    text: |-
      Op deze beleidsregel is [artikel 4:25, tweede en derde lid, van de Algemene wet bestuursrecht][ref1] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0048596/2024-06-15#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 2.2.2
    text: |-
      Het beschikbare bedrag voor het verstrekken van financiële ondersteuning voor het kalenderjaar 2023 bedraagt
      € 33.000.000.
    url: https://wetten.overheid.nl/BWBR0048596/2024-06-15#Artikel2.2
  - number: 2.2.3
    text: |-
      Het beschikbare bedrag voor het verstrekken van financiële ondersteuning voor het kalenderjaar 2024 bedraagt
      € 21.000.000.
    url: https://wetten.overheid.nl/BWBR0048596/2024-06-15#Artikel2.2
  - number: 2.2.4
    text: |-
      De minister verdeelt het beschikbare bedrag op volgorde van binnenkomst van de aanvragen, met dien verstande dat
      wanneer de aanvrager krachtens [artikel 4:5 van de Algemene wet bestuursrecht][ref1] de gelegenheid heeft gehad de
      aanvraag aan te vullen, de dag en het tijdstip waarop de aanvraag is aangevuld als moment van ontvangst geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0048596/2024-06-15#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 2.3.1
    text: |-
      Een aanvraag voor financiële ondersteuning voor het kalenderjaar 2023 kan worden ingediend vanaf 25 september 2023
      om 9:00 uur en wordt uiterlijk 23 oktober 2023 om 12:00 uur door de minister ontvangen.
    url: https://wetten.overheid.nl/BWBR0048596/2024-06-15#Artikel2.3
  - number: 2.3.2
    text: |-
      Een aanvraag voor financiële ondersteuning voor het kalenderjaar 2024 kan worden ingediend vanaf 1 juli 2024 om
      9:00 uur en wordt uiterlijk 23 september 2024 om 12:00 uur door de Minister ontvangen.
    url: https://wetten.overheid.nl/BWBR0048596/2024-06-15#Artikel2.3
  - number: 2.3.3
    text: Voor de aanvraag wordt een door de minister vastgesteld formulier gebruikt.
    url: https://wetten.overheid.nl/BWBR0048596/2024-06-15#Artikel2.3
  - number: 2.3.4
    text: 'De aanvraag gaat vergezeld van:'
    url: https://wetten.overheid.nl/BWBR0048596/2024-06-15#Artikel2.3
  - number: 2.3.4.a
    text: een bewijs van dienstverband;
    url: https://wetten.overheid.nl/BWBR0048596/2024-06-15#Artikel2.3
  - number: 2.3.4.b
    text: een gewaarmerkt verzekeringsbericht;
    url: https://wetten.overheid.nl/BWBR0048596/2024-06-15#Artikel2.3
  - number: 2.3.4.c
    text: een kopie van de WIA-beslissing betreffende de zorgmedewerker;
    url: https://wetten.overheid.nl/BWBR0048596/2024-06-15#Artikel2.3
  - number: 2.3.4.d
    text: 'een document waaruit blijkt dat langdurige post-COVID klachten zijn geconstateerd, zijnde:'
    url: https://wetten.overheid.nl/BWBR0048596/2024-06-15#Artikel2.3
  - number: 2.3.4.d.1°
    text: |-
      het medisch onderzoeksverslag dat als verslag van het verzekeringsgeneeskundig onderzoek is gevoegd als bijlage bij
      de WIA-beslissing betreffende de zorgmedewerker; of
    url: https://wetten.overheid.nl/BWBR0048596/2024-06-15#Artikel2.3
  - number: 2.3.4.d.2°
    text: |-
      een door de Minister vastgesteld formulier met een verklaring die is voorzien van een ondertekening door een arts,
      waarin wordt bevestigd dat voor 1 juni 2023 bij de zorgmedewerker langdurige post-COVID klachten zijn geconstateerd
      en die is voorzien van toestemming om de juistheid van deze verklaring bij de desbetreffende arts te verifiëren; en
    url: https://wetten.overheid.nl/BWBR0048596/2024-06-15#Artikel2.3
  - number: 2.3.4.e
    text: desgevraagd overige inlichtingen en bewijsstukken, die noodzakelijk zijn voor de beoordeling van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0048596/2024-06-15#Artikel2.3
  - number: 2.3.5
    text: |-
      Als de zorgmedewerker werkzaam was op basis van een dienstverband bij een ander dan de zorgaanbieder waar de
      zorgmedewerker tijdens het tijdvak veelvuldig en intensief zorg heeft verleend aan patiënten met COVID-19 of nauw
      betrokken was bij deze zorgverlening, overlegt de zorgmedewerker een door de minister vastgesteld formulier met een
      verklaring die:
    url: https://wetten.overheid.nl/BWBR0048596/2024-06-15#Artikel2.3
  - number: 2.3.5.a
    text: is voorzien van een ondertekening door de leidinggevende van de zorgmedewerker;
    url: https://wetten.overheid.nl/BWBR0048596/2024-06-15#Artikel2.3
  - number: 2.3.5.b
    text: is ondertekend namens de zorgaanbieder waar de zorgmedewerker tijdens het tijdvak werkzaamheden heeft verricht;
    url: https://wetten.overheid.nl/BWBR0048596/2024-06-15#Artikel2.3
  - number: 2.3.5.c
    text: |-
      bevestigt dat de zorgmedewerker tijdens het tijdvak bij die zorgaanbieder veelvuldig en intensief zorg heeft
      verleend aan patiënten met COVID-19 of nauw betrokken was bij deze zorgverlening; en
    url: https://wetten.overheid.nl/BWBR0048596/2024-06-15#Artikel2.3
  - number: 2.3.5.d
    text: is voorzien van toestemming om de juistheid van deze verklaring bij die zorgaanbieder te verifiëren.
    url: https://wetten.overheid.nl/BWBR0048596/2024-06-15#Artikel2.3
  - number: 2.3.6
    text: |-
      Als de zorgmedewerker werkzaam is geweest bij de zorgaanbieder tijdens het tijdvak in een functie of beroep die
      niet in [bijlage 4][ref1] is opgenomen, overlegt de zorgmedewerker een door de minister vastgesteld formulier met
      een verklaring die:


      [ref1]: https://wetten.overheid.nl/BWBR0048596
    url: https://wetten.overheid.nl/BWBR0048596/2024-06-15#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0048596
  - number: 2.3.6.a
    text: is voorzien van een ondertekening door de leidinggevende van de zorgmedewerker;
    url: https://wetten.overheid.nl/BWBR0048596/2024-06-15#Artikel2.3
  - number: 2.3.6.b
    text: is ondertekend namens de zorgaanbieder waar de zorgmedewerker tijdens het tijdvak werkzaam was;
    url: https://wetten.overheid.nl/BWBR0048596/2024-06-15#Artikel2.3
  - number: 2.3.6.c
    text: |-
      bevestigt dat de zorgmedewerker tijdens het tijdvak veelvuldig en intensief zorg heeft verleend aan patiënten met
      COVID-19 of nauw betrokken was bij deze zorgverlening; en
    url: https://wetten.overheid.nl/BWBR0048596/2024-06-15#Artikel2.3
  - number: 2.3.6.d
    text: is voorzien van toestemming om de juistheid van deze verklaring bij die zorgaanbieder te verifiëren.
    url: https://wetten.overheid.nl/BWBR0048596/2024-06-15#Artikel2.3
  - number: 2.3.7
    text: |-
      Als de zorgmedewerker werkzaam was bij de militair geneeskundige dienst, overlegt de zorgmedewerker een door de
      minister vastgesteld formulier met een verklaring die:
    url: https://wetten.overheid.nl/BWBR0048596/2024-06-15#Artikel2.3
  - number: 2.3.7.a
    text: is voorzien van een ondertekening door een tekenbevoegde van de militair geneeskundige dienst;
    url: https://wetten.overheid.nl/BWBR0048596/2024-06-15#Artikel2.3
  - number: 2.3.7.b
    text: |-
      bevestigt dat de zorgmedewerker tijdens het tijdvak veelvuldig en intensieve zorg heeft verleend aan patiënten met
      COVID-19 of nauw betrokken was bij deze zorgverlening; en
    url: https://wetten.overheid.nl/BWBR0048596/2024-06-15#Artikel2.3
  - number: 2.3.7.c
    text: is voorzien van toestemming om de juistheid van deze verklaring bij de militair geneeskundige dienst te verifiëren.
    url: https://wetten.overheid.nl/BWBR0048596/2024-06-15#Artikel2.3
  - number: 2.3.8
    text: |-
      Als de zorgmedewerker werkzaam was bij een justitiële inrichting, overlegt de zorgmedewerker het nummer waarmee
      de zorgmedewerker tijdens het tijdvak als arts of verpleegkundige stond ingeschreven in het daarvoor ingestelde
      register, bedoeld in [artikel 3 van de Wet BIG][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel3
    url: https://wetten.overheid.nl/BWBR0048596/2024-06-15#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '3'
  - number: 2.3.9
    text: |-
      Als de zorgmedewerker werkzaam was bij een gemeentelijke gezondheidsdienst, overlegt de zorgmedewerker een door de
      Minister vastgesteld formulier met een verklaring die:
    url: https://wetten.overheid.nl/BWBR0048596/2024-06-15#Artikel2.3
  - number: 2.3.9.a
    text: is voorzien van een ondertekening door een tekenbevoegde van de gemeentelijke gezondheidsdienst;
    url: https://wetten.overheid.nl/BWBR0048596/2024-06-15#Artikel2.3
  - number: 2.3.9.b
    text: |-
      bevestigt dat de zorgmedewerker tijdens het tijdvak veelvuldig en intensieve zorg heeft verleend aan patiënten met
      COVID-19 of nauw betrokken was bij deze zorgverlening; en
    url: https://wetten.overheid.nl/BWBR0048596/2024-06-15#Artikel2.3
  - number: 2.3.9.c
    text: |-
      is voorzien van toestemming om de juistheid van deze verklaring bij de gemeentelijke gezondheidsdienst te
      verifiëren.
    url: https://wetten.overheid.nl/BWBR0048596/2024-06-15#Artikel2.3
  - number: 2.3.10
    text: |-
      Als de eerste ziektedag zoals vermeld in de WIA-beslissing na het tijdvak ligt, overlegt de zorgmedewerker een
      document waaruit blijkt dat de langdurige post-COVID klachten het gevolg zijn van een vermoedelijke COVID-19
      besmetting in het tijdvak.
    url: https://wetten.overheid.nl/BWBR0048596/2024-06-15#Artikel2.3
  - number: 2.3.11
    text: |-
      Als sprake is van vrijwillige verlenging van de loondoorbetaling of verlenging van de loondoorbetalingsplicht,
      overlegt de zorgmedewerker een kopie van het besluit van het UWV betreffende de zorgmedewerker tot verlenging van
      het tijdvak van de loondoorbetaling.
    url: https://wetten.overheid.nl/BWBR0048596/2024-06-15#Artikel2.3
  - number: 2.3.12
    text: |-
      De minister kan afwijken van het vierde lid als toepassing is gegeven aan het bepaalde in
      [artikel 2.1, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0048596#Artikel2
    url: https://wetten.overheid.nl/BWBR0048596/2024-06-15#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0048596
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.4.1
    text: |-
      De minister besluit binnen 13 weken na sluiting van het aanvraagtijdvak, bedoeld in
      [artikel 2.3, eerste lid][ref1], op een volledige aanvraag voor financiële ondersteuning.


      [ref1]: https://wetten.overheid.nl/BWBR0048596#Artikel2
    url: https://wetten.overheid.nl/BWBR0048596/2024-06-15#Artikel2.4
    references:
      - id: ref1
        bwb_id: BWBR0048596
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.4.2
    text: |-
      De Minister besluit binnen 13 weken na ontvangst van de aanvraag, bedoeld in [artikel 2.3, tweede lid][ref1], op
      een volledige aanvraag voor financiële ondersteuning.


      [ref1]: https://wetten.overheid.nl/BWBR0048596#Artikel2
    url: https://wetten.overheid.nl/BWBR0048596/2024-06-15#Artikel2.4
    references:
      - id: ref1
        bwb_id: BWBR0048596
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.4.3
    text: |-
      De minister betaalt het bedrag van financiële ondersteuning na het besluit, bedoeld in het eerste lid, in één keer
      uit.
    url: https://wetten.overheid.nl/BWBR0048596/2024-06-15#Artikel2.4
  - number: 3.1.1
    text: 'De minister kan een besluit tot toekenning van financiële ondersteuning intrekken als:'
    url: https://wetten.overheid.nl/BWBR0048596/2024-06-15#Artikel3.1
  - number: 3.1.1.a
    text: |-
      de aanvrager aan wie financiële ondersteuning is toegekend onjuiste of onvolledige informatie heeft verschaft,
      waardoor financiële ondersteuning ten onrechte is toegekend;
    url: https://wetten.overheid.nl/BWBR0048596/2024-06-15#Artikel3.1
  - number: 3.1.1.b
    text: |-
      het besluit tot toekenning van financiële ondersteuning anderszins onjuist was en de aanvrager dat wist, dan wel
      behoorde te weten.
    url: https://wetten.overheid.nl/BWBR0048596/2024-06-15#Artikel3.1
  - number: 3.1.2
    text: |-
      De minister vordert een bedrag dat als gevolg van een besluit als bedoeld in het eerste lid ten onrechte is
      uitbetaald terug van degene aan wie is uitbetaald.
    url: https://wetten.overheid.nl/BWBR0048596/2024-06-15#Artikel3.1
  - number: 3.2.1
    text: |-
      Deze beleidsregel treedt in werking met ingang van de dag na de datum van uitgifte van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0048596/2024-06-15#Artikel3.2
  - number: 3.2.2
    text: |-
      Deze beleidsregel vervalt met ingang van 1 januari 2026, met dien verstande dat deze van toepassing blijft op
      financiële ondersteuningen die voor die datum zijn aangevraagd of verstrekt.
    url: https://wetten.overheid.nl/BWBR0048596/2024-06-15#Artikel3.2
  - number: '3.3'
    text: 'Deze beleidsregel wordt aangehaald als: Regeling zorgmedewerkers met langdurige post-COVID klachten.'
    url: https://wetten.overheid.nl/BWBR0048596/2024-06-15#Artikel3.3
