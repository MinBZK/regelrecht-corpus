        artikel: '1'
  - number: 1.4.1.b
    text: |-
      een zorgaanbieder is als bedoeld in [artikel 1.1.1 van de Wet langdurige zorg][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0035917#Artikel1
