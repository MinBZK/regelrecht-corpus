    text: |-
      een aanstelling als militair ambtenaar als bedoeld in
      [artikel 1, eerste lid, onder a, onder 1, van de Wet ambtenaren defensie][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0001952#Artikel1
    url: https://wetten.overheid.nl/BWBR0048596/2024-06-15#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0001952
        artikel: '1'
  - number: 2.1.1.a.3°
    text: |-
      een aanstelling als burgerlijk ambtenaar als bedoeld in
      [artikel 1, eerste lid, onder a, onder 2, van de Wet ambtenaren defensie][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001952#Artikel1
    url: https://wetten.overheid.nl/BWBR0048596/2024-06-15#Artikel2.1
    references:
      - id: ref1
