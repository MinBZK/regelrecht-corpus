        artikel: '1'
  - number: 2.1.1.b
    text: |-
      in het tijdvak bij een zorgaanbieder veelvuldig en intensief zorg heeft verleend aan patiënten met COVID-19 of nauw
      betrokken was bij deze zorgverlening;
    url: https://wetten.overheid.nl/BWBR0048596/2024-06-15#Artikel2.1
  - number: 2.1.1.c
    text: in het tijdvak in het kader van het dienstverband gemeld heeft wegens ziekte niet te werken;
    url: https://wetten.overheid.nl/BWBR0048596/2024-06-15#Artikel2.1
  - number: 2.1.1.d
    text: langdurige post-COVID klachten heeft die voor 1 juni 2023 geconstateerd zijn door een arts;
    url: https://wetten.overheid.nl/BWBR0048596/2024-06-15#Artikel2.1
  - number: 2.1.1.e
    text: |-
      als gevolg van de klachten die hebben geleid tot de ziekmelding, bedoeld onder c, ten minste 104 weken ziek is met
      langdurige post-COVID klachten en na deze 104 weken:
    url: https://wetten.overheid.nl/BWBR0048596/2024-06-15#Artikel2.1
  - number: 2.1.1.e.1°
    text: |-
      volledig en duurzaam arbeidsongeschikt is als bedoeld in [artikel 4 van de WIA][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel4
    url: https://wetten.overheid.nl/BWBR0048596/2024-06-15#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '4'
  - number: 2.1.1.e.2°
    text: |-
      gedeeltelijk arbeidsgeschikt is als bedoeld in [artikel 5 van de WIA][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel5
    url: https://wetten.overheid.nl/BWBR0048596/2024-06-15#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '5'
  - number: 2.1.1.e.3°
    text: |-
