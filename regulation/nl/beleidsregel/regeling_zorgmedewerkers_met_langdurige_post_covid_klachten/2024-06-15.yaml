  - number: 2.1.1
    text: 'Een zorgmedewerker komt eenmaal in aanmerking voor financiële ondersteuning als deze:'
    url: https://wetten.overheid.nl/BWBR0048596/2024-06-15#Artikel2.1
  - number: 2.1.1.a
    text: |-
      in het tijdvak werkzaam was bij of werkzaamheden heeft verricht voor een zorgaanbieder in het kader van een
      dienstverband zijnde:
    url: https://wetten.overheid.nl/BWBR0048596/2024-06-15#Artikel2.1
  - number: 2.1.1.a.1°
    text: |-
      een arbeidsovereenkomst tussen werkgever en werknemer als bedoeld in
      [artikel 610, eerste lid, van Boek 7 van het Burgerlijk Wetboek][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel610
    url: https://wetten.overheid.nl/BWBR0048596/2024-06-15#Artikel2.1
    references:
