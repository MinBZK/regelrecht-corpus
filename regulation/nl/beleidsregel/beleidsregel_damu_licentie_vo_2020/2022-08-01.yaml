        bwb_id: BWBR0044212
  - number: '2'
    text: |-
      Het doel van deze regeling is om een DAMU-leerling op een DAMU-school in staat te stellen gedurende het vo-
      onderwijs deel te nemen aan een hbo-voortraject, met verlichting van een dubbele studielast en integratie van
      regulier en kunstonderwijs daar waar mogelijk.
    url: https://wetten.overheid.nl/BWBR0044030/2022-08-01#Artikel2
  - number: '3.1'
    text: |-
      De minister kan op verzoek van het bevoegd gezag van een school een DAMU-licentie verstrekken voor een periode van
      vier schooljaren.
    url: https://wetten.overheid.nl/BWBR0044030/2022-08-01#Artikel3
  - number: '3.2'
    text: |-
      Het aantal scholen met een DAMU-licentie bedraagt niet meer dan twaalf. De minister kan in uitzonderlijke gevallen
      van dit aantal afwijken indien leerlingendaling of schoolsplitsing hier aanleiding toe geeft.
    url: https://wetten.overheid.nl/BWBR0044030/2022-08-01#Artikel3
  - number: '3.3'
    text: |-
      Indien door toekenning van de ingediende aanvragen het aantal DAMU-scholen het maximum van 12 zou overschrijden, is
      de rangschikking voor toekenning als volgt:
    url: https://wetten.overheid.nl/BWBR0044030/2022-08-01#Artikel3
  - number: 3.3.a
    text: aanvragen voor verlenging van eerdere licenties hebben voorrang boven aanvragen voor een nieuwe licentie;
    url: https://wetten.overheid.nl/BWBR0044030/2022-08-01#Artikel3
  - number: 3.3.b
    text: |-
      aanvragen worden op volgorde van binnenkomst behandeld, met dien verstande, dat wanneer de aanvrager krachtens
      [artikel 4:5 van de Algemene wet bestuursrecht][ref1] de gelegenheid heeft gehad de aanvraag aan te vullen, de dag
      waarop de aanvulling door de minister is ontvangen, als datum van binnenkomst geldt;


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0044030/2022-08-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 3.3.c
    text: |-
      bij gelijktijdige binnenkomst van de aanvragen komt de school met het hoogste aantal DAMU-leerlingen als eerste in
      aanmerking voor een DAMU-licentie.
    url: https://wetten.overheid.nl/BWBR0044030/2022-08-01#Artikel3
  - number: '3.4'
    text: |-
      Een aanvraag van het bevoegd gezag van een school wordt in behandeling genomen indien is voldaan aan de vereisten
      in [artikel 4][ref1] en [5][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0044030#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0044030#Artikel5
    url: https://wetten.overheid.nl/BWBR0044030/2022-08-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0044030
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0044030
        artikel: '5'
  - number: '3.5'
    text: |-
      Scholen waar op het moment van de aanvraag of op het moment van besluiten de kwaliteit van het onderwijs zeer
      zwak is als bedoeld in [artikel 2.94, eerste en derde lid, van de wet][ref1] of door de inspectie ingevolge
      [artikel 11 van de Wet op het onderwijstoezicht][ref2] het onderwijs als onvoldoende is beoordeeld, komen niet in
      aanmerking voor een DAMU-licentie.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0013800#Artikel11
    url: https://wetten.overheid.nl/BWBR0044030/2022-08-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0013800
        artikel: '11'
  - number: '3.6'
    text: |-
      De aanvraag voor een DAMU-licentie wordt jaarlijks op uiterlijk 1 oktober ingediend. Aanvragen ingediend na deze
      datum worden in een volgend kalenderjaar in behandeling genomen.
    url: https://wetten.overheid.nl/BWBR0044030/2022-08-01#Artikel3
  - number: '3.7'
    text: Stichting DAMU adviseert de minister over de aanvraag op uiterlijk 1 december van het desbetreffende jaar.
    url: https://wetten.overheid.nl/BWBR0044030/2022-08-01#Artikel3
  - number: '3.8'
    text: De minister besluit over het verstrekken van een DAMU-licentie uiterlijk 1 februari van het volgende kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0044030/2022-08-01#Artikel3
  - number: '4'
    text: 'De aanvraag gaat vergezeld van de volgende documenten:'
    url: https://wetten.overheid.nl/BWBR0044030/2022-08-01#Artikel4
  - number: 4.a
    text: |-
      een verklaring van de school dat op de desbetreffende school een door de betrokken hogeschool goedgekeurde lijst
      met de namen en adressen van minimaal vijftien DAMU-leerlingen die toegelaten zijn tot het hbo-voortraject aanwezig
      is, waarbij de meest recente teldatum van 1 oktober voorafgaand aan de aanvraag voor deze telling leidend is;
    url: https://wetten.overheid.nl/BWBR0044030/2022-08-01#Artikel4
  - number: 4.b
    text: |-
      het schoolplan, met daarin een beleidsnotitie waaruit blijkt op welke wijze de school voldoet aan
      [artikel 5, onderdeel b][ref1], en hoe de school waar nodig zorg draagt voor flexibiliteit in de
      onderwijsprogramma’s, flexibiliteit bij het afleggen van toetsen en schoolexamens en centrale examens, en hoe de
      specifieke kunstvakken worden ingevuld, rekening houdend met de belangen van de betrokken DAMU-leerling; en


      [ref1]: https://wetten.overheid.nl/BWBR0044030#Artikel5
    url: https://wetten.overheid.nl/BWBR0044030/2022-08-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0044030
        artikel: '5'
  - number: 4.c
    text: een schriftelijke steunverklaring van de Vereniging Hogescholen voor de aanvraag van een DAMU-licentie.
    url: https://wetten.overheid.nl/BWBR0044030/2022-08-01#Artikel4
  - number: '5'
    text: |-
      De school, waarvoor het bevoegd gezag een aanvraag als bedoeld in [artikel 3][ref1] heeft ingediend, voldoet aan de
      volgende voorschriften:


      [ref1]: https://wetten.overheid.nl/BWBR0044030#Artikel3
    url: https://wetten.overheid.nl/BWBR0044030/2022-08-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0044030
        artikel: '3'
  - number: 5.a
    text: op de school zijn ten minste vijftien DAMU-leerlingen ingeschreven; en
    url: https://wetten.overheid.nl/BWBR0044030/2022-08-01#Artikel5
  - number: 5.b
    text: |-
      op de school is onderwijzend personeel aanwezig en aanspreekbaar op de afstemming van de werkzaamheden die verband
      houden met de DAMU-licentie en zij voorzien in de begeleiding van de DAMU-leerlingen.
    url: https://wetten.overheid.nl/BWBR0044030/2022-08-01#Artikel5
  - number: '6'
    text: Alleen een school met een DAMU-licentie mag zich profileren als een DAMU-school.
    url: https://wetten.overheid.nl/BWBR0044030/2022-08-01#Artikel6
  - number: '7.1'
    text: Het bevoegd gezag van een school die over een DAMU-licentie beschikt, kan een verzoek tot verlenging indienen.
    url: https://wetten.overheid.nl/BWBR0044030/2022-08-01#Artikel7
  - number: '7.2'
    text: |-
      Het bevoegd gezag dient op uiterlijk 1 oktober van het kalenderjaar, voorafgaande aan het kalenderjaar waarin de
      licentie expireert, een verzoek tot verlenging in.
    url: https://wetten.overheid.nl/BWBR0044030/2022-08-01#Artikel7
  - number: '7.3'
    text: |-
      Op de verlenging van de DAMU-licentie zijn de [artikelen 3][ref1], [4][ref2] en [5][ref3] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0044030#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0044030#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0044030#Artikel5
    url: https://wetten.overheid.nl/BWBR0044030/2022-08-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0044030
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0044030
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0044030
        artikel: '5'
  - number: '8.1'
    text: |-
      Indien de DAMU-leerling niet langer deelneemt aan het hbo-voortraject kan de leerling niet langer als DAMU-leerling
      worden aangemerkt. Vanaf dat moment neemt de leerling weer deel aan het reguliere onderwijsprogramma.
    url: https://wetten.overheid.nl/BWBR0044030/2022-08-01#Artikel8
  - number: '8.2'
    text: |-
      Indien het voor een leerling als bedoeld in het eerste lid redelijkerwijs niet mogelijk is om
      de gemiste vakonderdelen nog in te halen blijft een reeds geëffectueerde ontheffing op grond van
      [artikelen 9 tot en met 13][ref1] van kracht, evenals een reeds lopende spreiding van het examen op grond van
      [artikel 14][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0044030#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0044030#Artikel14
    url: https://wetten.overheid.nl/BWBR0044030/2022-08-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0044030
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0044030
        artikel: '14'
  - number: '9'
    text: |-
      Indien de DAMU-licentie niet wordt verlengd, behouden de betrokken leerlingen de onder de oorspronkelijke DAMU-
      licentie verkregen mogelijkheden aan die school. Indien dit niet mogelijk is, verzorgt de school een alternatief.
    url: https://wetten.overheid.nl/BWBR0044030/2022-08-01#Artikel9
  - number: '10'
    text: |-
      Het bevoegd gezag dat beschikt over een DAMU-licentie kan in afwijking van de [artikelen 2.14, tweede lid][ref1]
      en [2.33 van de wet][ref2], de DAMU-leerling in de eerste twee leerjaren ontheffing verlenen van de onderdelen
      van het onderwijsprogramma die betrekking hebben op de kerndoelen bewegen en sport, in onderdeel G van
      [bijlage 1, behorende bij artikel 2.1 van het Uitvoeringsbesluit WVO 2020][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0044212#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0045787
    url: https://wetten.overheid.nl/BWBR0044030/2022-08-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0044212
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0045787
  - number: '11'
    text: |-
      Het bevoegd gezag dat beschikt over een DAMU-licentie kan, in afwijking van [artikel 2.33 van de wet][ref1] en de
      [artikelen 2.15][ref2] en [3.4, eerste lid, van het Uitvoeringsbesluit WVO 2020][ref3], een DAMU-leerling, die de
      theoretische leerweg in het vmbo volgt, ontheffing verlenen voor:


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0045787#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0045787#Artikel3
    url: https://wetten.overheid.nl/BWBR0044030/2022-08-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0045787
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0045787
        artikel: '3'
  - number: 11.a
    text: lichamelijke opvoeding;
    url: https://wetten.overheid.nl/BWBR0044030/2022-08-01#Artikel11
  - number: 11.b
    text: maatschappijleer;
    url: https://wetten.overheid.nl/BWBR0044030/2022-08-01#Artikel11
  - number: 11.c
    text: een vak behorende tot de beeldende vorming, muziek, dans of drama.
    url: https://wetten.overheid.nl/BWBR0044030/2022-08-01#Artikel11
  - number: '12'
    text: |-
      Het bevoegd gezag dat beschikt over een DAMU-licentie kan, in afwijking van [artikel 2.33 van de wet][ref1],
      [paragraaf 3 van hoofdstuk 2][ref2] en [artikel 3.1, eerste lid van het Uitvoeringsbesluit WVO 2020][ref3], een
      DAMU-leerling in de havo ontheffing verlenen voor:


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0045787#Paragraaf3
      [ref3]: https://wetten.overheid.nl/BWBR0045787#Artikel3
    url: https://wetten.overheid.nl/BWBR0044030/2022-08-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0045787
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0045787
        artikel: '3'
  - number: 12.a
    text: lichamelijke opvoeding;
    url: https://wetten.overheid.nl/BWBR0044030/2022-08-01#Artikel12
  - number: 12.b
    text: maatschappijleer;
    url: https://wetten.overheid.nl/BWBR0044030/2022-08-01#Artikel12
  - number: 12.c
    text: culturele en kunstzinnige vorming; en
    url: https://wetten.overheid.nl/BWBR0044030/2022-08-01#Artikel12
  - number: 12.d
    text: |-
      een vak als bedoeld in de [artikelen 2.11][ref1] en [2.12 van het Uitvoeringsbesluit WVO 2020][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0045787#Artikel2
    url: https://wetten.overheid.nl/BWBR0044030/2022-08-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0045787
        artikel: '2'
  - number: '13'
    text: |-
      Het bevoegd gezag dat beschikt over een DAMU-licentie kan, in afwijking van [artikel 2.33 van de wet][ref1]
      en [paragraaf 2 van hoofdstuk 2 van de wet][ref2], en [artikel 3.1][ref3] dan wel
      [3.2 van het Uitvoeringsbesluit WVO 2020][ref4], een DAMU-leerling in het vwo ontheffing verlenen voor:


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0044212#Paragraaf2
      [ref3]: https://wetten.overheid.nl/BWBR0045787#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0045787#Artikel3
    url: https://wetten.overheid.nl/BWBR0044030/2022-08-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0044212
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0045787
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0045787
        artikel: '3'
  - number: 13.a
    text: lichamelijke opvoeding;
    url: https://wetten.overheid.nl/BWBR0044030/2022-08-01#Artikel13
  - number: 13.b
    text: maatschappijleer;
    url: https://wetten.overheid.nl/BWBR0044030/2022-08-01#Artikel13
  - number: 13.c
    text: culturele en kunstzinnige vorming; en
    url: https://wetten.overheid.nl/BWBR0044030/2022-08-01#Artikel13
  - number: 13.d
    text: |-
      een vak als bedoeld in [artikel 2.6][ref1] of [2.7 van het Uitvoeringsbesluit WVO 2020][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0045787#Artikel2
    url: https://wetten.overheid.nl/BWBR0044030/2022-08-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0045787
        artikel: '2'
  - number: '14.1'
    text: |-
      In uitzonderlijke gevallen kan het bevoegd gezag, dat beschikt over een DAMU-licentie, voor een DAMU-leerling
      beroep doen op [artikel 3.56 van het Uitvoeringsbesluit WVO 2020][ref1] voor het doen van gespreid examen.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel3
    url: https://wetten.overheid.nl/BWBR0044030/2022-08-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '3'
  - number: '14.2'
    text: |-
      Alleen een DAMU-leerling die in het laatste leerjaar wordt geconfronteerd met activiteiten in het kader van
      uitoefening van de dans of muziek, waardoor het niet mogelijk is het eindexamen in het laatste leerjaar volledig af
      te leggen, komt voor toepassing van [artikel 3.56 van het Uitvoeringsbesluit WVO 2020][ref1] in aanmerking.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel3
    url: https://wetten.overheid.nl/BWBR0044030/2022-08-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '3'
  - number: '15'
    text: De minister evalueert deze beleidsregel voor 1 januari 2025.
    url: https://wetten.overheid.nl/BWBR0044030/2022-08-01#Artikel15
  - number: '16'
    text: |-
      Voor een school die voorafgaand aan deze beleidsregel al beschikt over een gelijkwaardige licentie op grond
      van [Beleidsregel verstrekking DAMU-licentie VO][ref1], blijft deze behouden, tenzij de looptijd van de eerdere
      licentie is verstreken en niet tijdig een nieuwe licentie is aangevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0033513
    url: https://wetten.overheid.nl/BWBR0044030/2022-08-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0033513
  - number: '17'
    text: |-
      De [Beleidsregel verstrekking DAMU-licentie VO][ref1] wordt per 1 september 2020 ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0033513
    url: https://wetten.overheid.nl/BWBR0044030/2022-08-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0033513
  - number: 17a
    text: |-
      Deze beleidsregel is mede gebaseerd op [artikel 9.3 van de Wet voortgezet onderwijs 2020][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel9
    url: https://wetten.overheid.nl/BWBR0044030/2022-08-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '9'
  - number: '18'
    text: Deze beleidsregel treedt in werking met ingang van 1 september 2020.
