preamble:
  text: |-
    Gelet op de artikelen 25 en 29, zevende lid, van de Wet op het voortgezet onderwijs en artikel 4:81 van de Algemene
    wet bestuursrecht;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0044030/2022-08-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze beleidsregel wordt verstaan onder: - *bevoegd gezag:* bevoegd gezag als bedoeld in
      [artikel 1.1 van de wet][ref1];
        - *DAMU-leerling:* leerling die is toegelaten tot het hbo-voortraject en daardoor wordt beschouwd als toptalent op
      het gebied van dans of muziek;
        - *DAMU-licentie:* licentie van de minister aan het bevoegd gezag van een school waarin een aanvraag als bedoeld in
      [artikel 3][ref2] wordt ingewilligd;
        - *hbo-voortraject:* beroepsvoorbereidend traject voor vo-leerlingen, aangeboden door een hogeschool, dat
      voorafgaat aan een hbo-bachelor op het gebied van dansvakonderwijs of muziekvakonderwijs;
        - *minister:* Minister voor Basis- en Voortgezet Onderwijs en Media;
        - *school:* school of scholengemeenschap voor voortgezet onderwijs waar uit de openbare kas bekostigd onderwijs
      wordt verzorgd als bedoeld in de [artikelen 2.4][ref3], [2.5][ref4] en [2.6 van de wet][ref5];
        - *Stichting DAMU:* de stichting Dans- en Muziekscholen;
        - *wet:* [Wet voortgezet onderwijs 2020][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0044030#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0044212#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0044212#Artikel2
      [ref5]: https://wetten.overheid.nl/BWBR0044212#Artikel2
      [ref6]: https://wetten.overheid.nl/BWBR0044212
    url: https://wetten.overheid.nl/BWBR0044030/2022-08-01#Artikel1
    references:
