articles:
  - number: '1'
    text: |-
      Deze beleidsregel is van toepassing op alle overtredingen die als beboetbaar feit zijn aangemerkt bij of krachtens
      [artikel 77, eerste lid, van de Spoorwegwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel77
    url: https://wetten.overheid.nl/BWBR0035629/2014-10-15#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '77'
  - number: '2'
    text: |-
      Bij de vaststelling van de hoogte van de bestuurlijke boete ter zake van overtreding van een norm die zich
      richt tot een natuurlijke persoon, niet zijnde een onderneming, worden de bedragen gehanteerd, opgenomen in
      [bijlage 1][ref1], behorende bij deze beleidsregel.


      [ref1]: https://wetten.overheid.nl/BWBR0035629
    url: https://wetten.overheid.nl/BWBR0035629/2014-10-15#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0035629
  - number: '3'
    text: |-
      1 Bij de vaststelling van de hoogte van een bestuurlijke boete ter zake van een overtreding van een norm die zich
      richt tot een onderneming, worden de normbedragen gehanteerd zoals opgenomen in [bijlage 2][ref1], behorende bij
      deze beleidsregel.

      2 Het normbedrag, bedoeld in het eerste lid, wordt vermenigvuldigd met de bij de omzetcategorie van de onderneming
      horende factor.

      3 De categorie-indeling, bedoeld in het vorige lid, luidt als volgt:









                    Categorie I


                    ondernemingen met een omzet van minder dan € 100.000


                    Factor 0,25




                    Categorie II


                    Ondernemingen met een omzet van ten minste € 100.000 maar minder dan € 200.000


                    Factor 0,5




                    Categorie III


                    Ondernemingen met een omzet van ten minste € 200.000 maar minder dan € 500.000


                    Factor 1




                    Categorie IV


                    Ondernemingen met een omzet van ten minste € 500.000 maar minder dan € 1.000.000


                    Factor 2




                    Categorie V


                    Ondernemingen met een omzet van meer dan € 1.000.000


                    Factor 3






      4 De omzet in de zin van dit artikel is de omzet in het kalenderjaar voorafgaand aan de datum van overtreding.


      [ref1]: https://wetten.overheid.nl/BWBR0035629
    url: https://wetten.overheid.nl/BWBR0035629/2014-10-15#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0035629
  - number: '4'
    text: |-
      Het op grond van [artikel 2][ref1] en [3][ref2] vastgestelde boetebedrag wordt verhoogd met 50% als bedoeld
      in [artikel 80, derde lid, van de Spoorwegwet][ref3], indien de omstandigheden van het geval of de ernst van de
      overtreding daartoe aanleiding geven in het licht van de spoorwegveiligheid.


      [ref1]: https://wetten.overheid.nl/BWBR0035629#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0035629#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0015007#Artikel80
