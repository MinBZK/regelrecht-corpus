        bwb_id: BWBR0010788
        artikel: '19'
        hoofdstuk: II
        paragraaf: '2'
  - number: '21'
    text: |-
      1 Indien de heffingplichtige de verschuldigde bestemmingsheffing niet, niet tijdig of gedeeltelijk niet betaalt,
      dan legt de inspecteur een verzuimboete op van 100% van het gedeelte van de verschuldigde heffing dat niet betaald
      is. De verzuimboete bedraagt ten hoogste € 180.

      2 Indien de heffingplichtige de verschuldigde bestemmingsheffing alsnog betaalt, dan vermindert de inspecteur de
      boete overeenkomstig het derde lid als er sprake is van een eerste, een tweede of een volgend verzuim.

      Van een eerste verzuim is sprake indien de heffingplichtige in geen van de laatste vijf kalenderjaren, voorafgaande
      aan het kalenderjaar waarop de desbetreffende heffing betrekking heeft, in verzuim is geweest. Van een tweede,
      onderscheidenlijk volgend verzuim is sprake indien de heffingplichtige in één, onderscheidenlijk twee of meer van
      de laatste vijf kalenderjaren, voorafgaande aan het kalenderjaar waarop de desbetreffende heffing betrekking heeft,
      in verzuim is geweest. Een verzuim ten aanzien waarvan bij de heffingplichtige sprake is van afwezigheid van alle
      schuld wordt niet in aanmerking genomen.

      3 De inspecteur vermindert ingeval van:

      a. een eerste verzuim de verzuimboete tot op 10% van de verschuldigde heffing;

      b. een tweede verzuim de verzuimboete tot op 25% van de verschuldigde heffing;

      c. een volgend verzuim de verzuimboete tot op 100% van de verschuldigde heffing.

      4 Indien het bedrag van de verschuldigde heffing, vermeerderd met het ingevolge de vorige leden berekende
      boetebedrag, lager is dan € 11, legt de inspecteur in afwijking van de vorige leden geen verzuimboete op. Dit
      verzuim wordt wel in aanmerking genomen bij de berekening van het aantal verzuimen, bedoeld in het tweede lid.

      5 De inspecteur verlaagt de opgelegde verzuimboete naar evenredigheid bij vermindering of teruggaaf van de
      desbetreffende heffing. De verzuimboete wordt niet lager gesteld dan op € 11.
    url: https://wetten.overheid.nl/BWBR0010788/2002-01-01#Artikel21
  - number: '22'
    text: |-
      1 Onder opzet wordt mede verstaan voorwaardelijk opzet.

      2 Grove schuld is een in laakbaarheid aan opzet grenzende mate van verwijtbaarheid en omvat mede grove
      onachtzaamheid.
    url: https://wetten.overheid.nl/BWBR0010788/2002-01-01#Artikel22
  - number: '23'
    text: |-
      1 De inspecteur past bij het berekenen van het bedrag van de vergrijpboete de volgende percentages toe:

        - ingeval van grove schuld 50%;
        - ingeval van opzet 100%.

      2 Indien slechts een gedeelte van de verschuldigde belasting door opzet of grove schuld van de heffingplichtige
      te weinig is geheven of zou zijn geheven dan wel betaald, berekent de inspecteur de op te leggen boete over het
      desbetreffende aan opzet of grove schuld van de heffingplichtige toe te rekenen gedeelte.

      3 Het tweede lid vindt overeenkomstige toepassing indien meer dan één boetepercentage van toepassing is.
    url: https://wetten.overheid.nl/BWBR0010788/2002-01-01#Artikel23
  - number: '24'
    text: |-
      1 Indien de heffingplichtige met opzet geen aangifte van de varkensheffing heeft gedaan, of met opzet een onjuiste
      of onvolledige aangifte heeft gedaan, dan legt de inspecteur een vergrijpboete op.

      2 Indien geen aangifte is gedaan berekent de inspecteur de vergrijpboete op basis van het bedrag van de ambtshalve
      vastgestelde aanslag. Indien de aangifte onjuist of onvolledig is gedaan, berekent de inspecteur de vergrijpboete
      op basis van het bedrag van de aanslag dat is toe te rekenen aan de correcties ter zake van een of meer
      tekortkomingen in de aangifte die met opzet zijn gedaan.
    url: https://wetten.overheid.nl/BWBR0010788/2002-01-01#Artikel24
  - number: '25'
    text: |-
      1 Indien de aanslag tot een te laag bedrag is vastgesteld of anderszins een te lage varkensheffing is geheven, en
      dit aan opzet of grove schuld van de heffingplichtige is te wijten, dan legt de inspecteur een vergrijpboete op.

      2 De inspecteur berekent de vergrijpboete op basis van het bedrag van de navorderingsaanslag.
    url: https://wetten.overheid.nl/BWBR0010788/2002-01-01#Artikel25
  - number: '26'
    text: |-
      1 Indien de heffingplichtige een verschuldigde forfaitaire mineralenheffing, een verschuldigde verfijnde
      mineralenheffing, de verschuldigde heffing van intermediaire ondernemingen of de verschuldigde bestemmingsheffing
      niet, gedeeltelijk niet of niet tijdig betaalt, en dit aan opzet of grove schuld van de heffingplichtige is te
      wijten, dan legt de inspecteur een vergrijpboete op.

      2 De inspecteur berekent de vergrijpboete op basis van het bedrag van de naheffingsaanslag.

      3 Indien de heffingplichtige, voordat deze weet of redelijkerwijs moet vermoeden dat de inspecteur bekend is of
      zal worden met het feit dat te weinig belasting is betaald, schriftelijk kenbaar maakt aan de inspecteur dat en tot
      welk bedrag niet of gedeeltelijk niet is betaald, legt de inspecteur in zoverre in afwijking van het eerste lid,
      geen vergrijpboete op.
    url: https://wetten.overheid.nl/BWBR0010788/2002-01-01#Artikel26
  - number: '27'
    text: |-
      1 Indien aan de heffingplichtige ter zake van het niet voldoen aan verplichtingen verband houdende met een heffing
      als bedoeld in [artikel 1][ref1] ook in de vijf voorafgaande kalenderjaren een vergrijpboete is opgelegd, of de
      heffingplichtige voor die handeling strafrechtelijk is veroordeeld, past de inspecteur bij de berekening van het
      bedrag van de vergrijpboete ingeval van grove schuld, in afwijking van [artikel 23][ref2] een hoger percentage
      voor grove schuld toe, tot ten hoogste 75%. Met een veroordeling wordt gelijkgesteld het vervallen van het recht op
      strafvordering op de voet van de [artikelen 74][ref3] en [74a van het Wetboek van Strafrecht][ref4].

      2 Indien de vergrijpboete die in de vijf voorafgaande kalenderjaren is opgelegd naderhand vervalt wegens
      het ontbreken van opzet dan wel grove schuld, dan corrigeert de inspecteur de verhoging van de vergrijpboete
      ambtshalve.


