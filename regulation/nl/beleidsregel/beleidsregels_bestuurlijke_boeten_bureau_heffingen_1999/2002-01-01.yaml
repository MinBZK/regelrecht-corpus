  - number: '28'
    text: |-
      De inspecteur past bij de berekening van het bedrag van de vergrijpboete ingeval van grove schuld in afwijking van
      [artikel 23][ref1] een hoger percentage voor grove schuld toe, tot ten hoogste 100%, indien:

      a. de ernst van de gedraging naar aanleiding waarvan de vergrijpboete wordt opgelegd, daartoe aanleiding geeft; de
      inspecteur gaat hier in elk toe over indien sprake is van listigheid, valsheid of samenspanning;

      b. de gedraging naar aanleiding waarvan de vergrijpboete wordt opgelegd tot gevolg zou hebben gehad dat een
      omvangrijk of verhoudingsgewijs omvangrijk bedrag niet zou zijn betaald;

      c. de persoonlijke omstandigheden van de heffingplichtige of de wijze waarop of de omstandigheden waaronder de
      gedraging naar aanleiding waarvan de vergrijpboete wordt opgelegd heeft plaatsgevonden, daartoe aanleiding geven.


      [ref1]: https://wetten.overheid.nl/BWBR0010788#Artikel23
    url: https://wetten.overheid.nl/BWBR0010788/2002-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0010788
        artikel: '23'
        hoofdstuk: III
        paragraaf: '1'
  - number: '29'
    text: |-
      Tot de omstandigheden die aanleiding kunnen geven de op te leggen of opgelegde verzuim- of vergrijpboete te matigen
      behoren:

      a. het geval dat een wanverhouding bestaat tussen de ernst van de gedraging naar aanleiding waarvan de boete
      wordt opgelegd en de hoogte van de op te leggen boete, en het geval dat deze gedraging haar aanleiding vindt in
      omstandigheden die buiten de directe invloedssfeer van de heffingplichtige liggen;

      b. het geval dat de redelijke termijn, bedoeld in [artikel 6 van het Europees Verdrag tot bescherming van de
      rechten van de mens en de fundamentele vrijheden](onbekend), is over-schreden. In uitzonderlijke gevallen kan
      deze overschrijding leiden tot het vervallen van de boete. Bij de beoordeling van de vraag of de redelijke
      termijn is overschreden, wordt onder meer gelet op de ingewikkeldheid van de zaak, het processuele gedrag van de
      heffingplichtige en de wijze waarop de zaak door de inspecteur is behandeld.
    url: https://wetten.overheid.nl/BWBR0010788/2002-01-01#Artikel29
  - number: '30'
    text: De inspecteur past deze regels toe met ingang van de dag waarop dit besluit is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0010788/2002-01-01#Artikel30
  - number: '31'
    text: |-
      Het besluit van 17 december 1991, nr. J.9113365, houdende de verklaring van toepassing van de Leidraad
      administratieve boeten 1984 op de overschotheffing (Stcrt. 250) wordt ingetrokken, met dien verstande dat het van
      toepassing blijft op de oplegging van naheffingsaanslagen voor verschuldigde overschotheffingen als bedoeld in
      [artikel 13 van de Meststoffenwet][ref1], zoals dit artikel luidde vóór inwerkingtreding van artikel I van de wet
      van 2 mei 1997, houdende wijziging van de [Meststoffenwet][ref2] (Stb. 360).


