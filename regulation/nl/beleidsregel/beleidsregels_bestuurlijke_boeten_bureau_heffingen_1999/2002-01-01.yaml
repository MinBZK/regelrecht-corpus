        hoofdstuk: IV
  - number: '12'
    text: |-
      Indien de heffingplichtige niet binnen de in de wet gestelde termijn in bezwaar is gekomen tegen de
      boetebeschikking en redelijkerwijs niet kan worden geoordeeld dat de termijnoverschrijding aan hem of zijn
      gemachtigde kan worden toegerekend, verklaart de inspecteur hem ontvankelijk in zijn bezwaar.
    url: https://wetten.overheid.nl/BWBR0010788/2002-01-01#Artikel12
  - number: '13'
    text: |-
      Indien de inspecteur binnen vijf jaar na het tijdstip van overlijden van de heffingplichtige daarvan kennisneemt
      en hem geen verzoek heeft bereikt om de boetebeschikking te vernietigen, dan wel de boete te verminderen, past hij
      [artikel 67i, tweede en derde lid, van de Algemene wet inzake rijksbelastingen][ref1] ambtshalve toe.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel67i
    url: https://wetten.overheid.nl/BWBR0010788/2002-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 67i
  - number: '14'
    text: |-
      1 De kennisgeving van het voornemen een vergrijpboete op te leggen en van de gronden waarop dat voornemen berust,
      geschiedt schriftelijk.

      2 De inspecteur geeft de heffingplichtige een redelijke termijn waarbinnen hij de aangevoerde gronden kan
      betwisten.

      3 Indien de heffingplichtige de in de kennisgeving aangevoerde gronden mondeling wenst te betwisten, wordt hij door
      de inspecteur gehoord.

      4 [Artikel 11, vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0010788#Artikel11
    url: https://wetten.overheid.nl/BWBR0010788/2002-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0010788
        artikel: '11'
        hoofdstuk: I
        paragraaf: '1'
  - number: '15'
    text: |-
      De inspecteur houdt het opleggen van de vergrijpboete aan, zodra hij weet dat het feit ter zake waarvan de
      boete wordt opgelegd, onderwerp is of kan zijn van een opsporingsonderzoek dan wel van een strafrechtelijke
      vervolging. Indien de termijn waarbinnen de belastingaanslag en de boetebeschikking moeten zijn opgelegd, dreigt
      te verstrijken, treedt de inspecteur tijdig in overleg met de betrokken opsporingsautoriteiten om te bepalen of er
      definitief voor strafrechtelijke vervolging wordt gekozen dan wel of er alsnog een vergrijpboete wordt opgelegd.
    url: https://wetten.overheid.nl/BWBR0010788/2002-01-01#Artikel15
  - number: '16'
    text: |-
      1 Indien de heffingplichtige geen of niet tijdig aangifte doet van de varkensheffing, dan legt de inspecteur een
      verzuimboete op van 100% van de verschuldigde heffing zoals deze door de inspecteur ambtshalve is vastgesteld. De
      verzuimboete bedraagt ten hoogste € 1.125.

      2 Indien de heffingplichtige alsnog aangifte doet van de varkensheffing, dan vermindert de inspecteur de boete
      overeenkomstig het derde lid als er sprake is van een eerste, een tweede of een volgend verzuim.

      Van een eerste verzuim is sprake indien de heffingplichtige in geen van de laatste vijf kalenderjaren, voorafgaande
      aan het kalenderjaar waarop de desbetreffende heffing betrekking heeft, in verzuim is geweest.

      Van een tweede, onderscheidenlijk volgend verzuim is sprake indien de heffingplichtige in één, onderscheidenlijk
      twee of meer van de laatste vijf kalenderjaren, voorafgaande aan het kalenderjaar waarop de desbetreffende heffing
      betrekking heeft, in verzuim is geweest. Een verzuim ten aanzien waarvan bij de heffingplichtige sprake is van
      afwezigheid van alle schuld wordt niet in aanmerking genomen.

      3 De inspecteur vermindert ingeval van:

      a. een eerste verzuim de verzuimboete tot op 10% van de verschuldigde heffing;

      b. een tweede verzuim de verzuimboete tot op 25% van de verschuldigde heffing;

      c. een volgend verzuim de verzuimboete tot op 100% van de verschuldigde heffing.

      4 Indien de verschuldigde heffing, vermeerderd met het ingevolge de vorige leden berekende boetebedrag, lager
      is dan € 11, legt de inspecteur in afwijking van de vorige leden geen verzuimboete op. Dit verzuim wordt wel in
      aanmerking genomen bij de berekening van het aantal verzuimen, bedoeld in het tweede lid.

      5 De inspecteur verlaagt de opgelegde verzuimboete naar evenredigheid bij vermindering of teruggaaf van de
      desbetreffende heffing. De verzuimboete wordt niet lager gesteld dan op € 11.
    url: https://wetten.overheid.nl/BWBR0010788/2002-01-01#Artikel16
  - number: '17'
    text: |-
      Indien de heffingplichtige geen of niet tijdig aangifte doet van de forfaitaire mineralenheffingen, de verfijnde
      mineralenheffingen, de heffing van intermediaire onderneming of de bestemmingsheffing, dan legt de inspecteur per
      heffing waarvan de aangifte niet of niet tijdig is gedaan, een verzuimboete op van € 110.
    url: https://wetten.overheid.nl/BWBR0010788/2002-01-01#Artikel17
  - number: '18'
    text: |-
      1 Indien de heffingplichtige:

      a. een verschuldigde forfaitaire mineralenheffing;

      b. een verschuldigde verfijnde mineralenheffing;

      c. de verschuldigde heffing van intermediaire ondernemingen;

      niet, niet tijdig of gedeeltelijk niet betaalt, en van desbetreffende heffing ook geen, of niet tijdig aangifte
      heeft gedaan, dan legt de inspecteur, onverminderd [artikel 17][ref1], een verzuimboete op van 100% van het
      gedeelte van de desbetreffende verschuldigde heffing zoals deze door de inspecteur ambtshalve is vastgesteld, dat
      niet betaald is. De verzuimboete bedraagt ten hoogste € 4.500.

      2 Indien de heffingplichtige alsnog aangifte doet van de desbetreffende heffing, dan vermindert de inspecteur de
      boete overeenkomstig het derde lid als er sprake is van een eerste, een tweede of een volgend verzuim.

      Van een eerste verzuim is sprake indien de heffingplichtige in geen van de laatste vijf kalenderjaren, voorafgaande
      aan het kalenderjaar waarop de desbetreffende heffing betrekking heeft, in verzuim is geweest. Van een tweede,
      onderscheidenlijk volgend verzuim is sprake indien de heffingplichtige in één, onderscheidenlijk twee of meer van
      de laatste vijf kalenderjaren, voorafgaande aan het kalenderjaar waarop de desbetreffende heffing betrekking heeft,
      in verzuim is geweest. Een verzuim ten aanzien waarvan bij de heffingplichtige sprake is van afwezigheid van alle
      schuld wordt niet in aanmerking genomen.

      3 De inspecteur vermindert ingeval van:

      a. een eerste verzuim de verzuimboete tot op 10% van de verschuldigde heffing;

      b. een tweede verzuim de verzuimboete tot op 25% van de verschuldigde heffing;

      c. een volgend verzuim de verzuimboete tot op 100% van de verschuldigde heffing.

      4 Indien het bedrag van de verschuldigde heffing, vermeerderd met het ingevolge de vorige leden berekende
      boetebedrag, lager is dan € 11, legt de inspecteur in afwijking van de vorige leden geen verzuimboete op. Dit
      verzuim wordt wel in aanmerking genomen bij de berekening van het aantal verzuimen, bedoeld in het tweede lid.

      5 De inspecteur verlaagt de opgelegde verzuimboete naar evenredigheid bij vermindering of teruggaaf van de
      desbetreffende heffing. De verzuimboete wordt niet lager gesteld dan op € 11.


      [ref1]: https://wetten.overheid.nl/BWBR0010788#Artikel17
    url: https://wetten.overheid.nl/BWBR0010788/2002-01-01#Artikel18
    references:
