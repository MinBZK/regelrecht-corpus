  - number: '1'
    text: |-
      Dit besluit bevat beleidsregels die de inspecteur van het Bureau Heffingen toepast bij het opleggen van boeten
      overeenkomstig [hoofdstuk VIIIA van de Algemene wet inzake rijksbelastingen][ref1] bij de volgende heffingen:

        - de forfaitaire mineralenheffingen, bedoeld in [artikel 14 van de Meststoffenwet][ref2], onderscheiden in de
      heffing die wordt geheven naar de belastbare hoeveelheid meststoffen, uitgedrukt in kilogrammen fosfaat, en de
      heffing die wordt geheven naar de belastbare hoeveelheid meststoffen, uitgedrukt in kilogrammen stikstof;
        - de verfijnde mineralenheffingen, bedoeld in [artikel 22 van de Meststoffenwet][ref3], onderscheiden in de heffing
      die wordt geheven naar de belastbare hoeveelheid mineralen, uitgedrukt in kilogrammen fosfaat, en de heffing die
      wordt geheven naar de belastbare hoeveelheid mineralen, uitgedrukt in kilogrammen stikstof;
        - de heffing van intermediaire ondernemingen, bedoeld in [artikel 29 van de Meststoffenwet][ref4];
        - de bestemmingsheffing, bedoeld in [artikel 35 van de Meststoffenwet][ref5];
        - de varkensheffing, bedoeld in [artikel 91a van de Gezondheids- en welzijnswet voor dieren][ref6].


