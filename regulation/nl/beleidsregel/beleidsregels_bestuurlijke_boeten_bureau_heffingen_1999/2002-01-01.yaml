  - number: '9'
    text: |-
      De inspecteur onderzoekt bij het vaststellen van het bedrag van de boete op basis van de bepalingen van de
      [hoofdstukken II][ref1] of [III][ref2] of er sprake is van omstandigheden als bedoeld in [hoofdstuk IV][ref3], die
      aanleiding geven om het bedrag van de op te leggen boete te verlagen of te verhogen.


      [ref1]: https://wetten.overheid.nl/BWBR0010788#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0010788#HoofdstukIII
      [ref3]: https://wetten.overheid.nl/BWBR0010788#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0010788/2002-01-01#Artikel9
    references:
