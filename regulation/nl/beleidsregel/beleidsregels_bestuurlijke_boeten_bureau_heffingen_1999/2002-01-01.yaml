  - number: '19'
    text: |-
      1 Indien de heffingplichtige:

      a. een verschuldigde forfaitaire mineralenheffing;

      b. een verschuldigde verfijnde mineralenheffing;

      c. de verschuldigde heffing van intermediaire ondernemingen;

      niet, niet tijdig of gedeeltelijk niet betaalt, maar van desbetreffende heffing wel tijdig aangifte heeft gedaan,
      dan legt de inspecteur een verzuimboete op van ten hoogste € 4.500.

      2 De verzuimboete bedraagt ingeval van:

      a. een eerste verzuim 1% van het gedeelte van de verschuldigde heffing dat niet of niet tijdig is betaald;

      b. een tweede verzuim 5% van het gedeelte van de verschuldigde heffing dat niet of niet tijdig is betaald;

      c. een volgend verzuim 10% van het gedeelte van de verschuldigde heffing dat niet of niet tijdig is betaald.

      Van een eerste verzuim is sprake indien de heffingplichtige in geen van de laatste vijf kalenderjaren, voorafgaande
      aan het kalenderjaar waarop de desbetreffende heffing betrekking heeft, in verzuim is geweest. Van een tweede,
      onderscheidenlijk volgend verzuim is sprake indien de heffingplichtige in één, onderscheidenlijk twee of meer van
      de laatste vijf kalenderjaren, voorafgaande aan het kalenderjaar waarop de desbetreffende heffing betrekking heeft,
      in verzuim is geweest. Een verzuim ten aanzien waarvan bij de heffingplichtige sprake is van afwezigheid van alle
      schuld wordt niet in aanmerking genomen.

      3 Indien de verschuldigde heffing, vermeerderd met het ingevolge de vorige leden berekende boetebedrag, lager
      is dan€ 11, legt de inspecteur in afwijking van de vorige leden geen verzuimboete op. Dit verzuim wordt wel in
      aanmerking genomen bij de berekening van het aantal verzuimen, bedoeld in het tweede lid.

      4 De inspecteur verlaagt de opgelegde verzuimboete naar evenredigheid bij vermindering of teruggaaf van de
      desbetreffende heffing. De verzuimboete wordt niet lager gesteld dan op € 11.
    url: https://wetten.overheid.nl/BWBR0010788/2002-01-01#Artikel19
  - number: '20'
    text: |-
      1 Indien de heffingplichtige:

      a. een verschuldigde forfaitaire mineralenheffing;

      b. een verschuldigde verfijnde mineralenheffing;

      c. de verschuldigde heffing van intermediaire ondernemingen;

      niet, niet tijdig of gedeeltelijk niet betaalt doordat op de desbetreffende aangifte een te lage belastbare
      hoeveelheid is aangegeven, en het bedrag dat niet betaald is omvangrijk of verhoudingsgewijs omvangrijk is, dan
      legt de inspecteur, in afwijking van [artikel 19][ref1], een verzuimboete op van 10% van het gedeelte van de
      verschuldigde heffing dat niet betaald is. De verzuimboete bedraagt ten hoogste € 4.500.

      2 Indien de heffingplichtige, voordat deze weet of redelijkerwijs moet vermoeden dat de inspecteur bekend is
      zal worden met het feit dat op de aangifte te weinig belasting is aangegeven, schriftelijk kenbaar maakt aan de
      inspecteur dat en welk bedrag niet of gedeeltelijk niet betaald is, legt de inspecteur, in zoverre in afwijking van
      het eerste lid, een verzuimboete op van 5% van het gedeelte van de verschuldigde heffing dat niet betaald is, met
      een maximum van € 4.500.

      3 Indien het gedeelte van de verschuldigde heffing dat niet betaald is, vermeerderd met het ingevolge het eerste of
      het tweede lid berekende boetebedrag, lager is dan € 11, legt de inspecteur geen verzuimboete op.

      4 De inspecteur verlaagt de opgelegde verzuimboete naar evenredigheid bij vermindering of teruggaaf van de
      desbetreffende heffing. De verzuimboete wordt niet lager gesteld dan € 11.


      [ref1]: https://wetten.overheid.nl/BWBR0010788#Artikel19
