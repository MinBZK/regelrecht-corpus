  - number: '2'
    text: |-
      Een handelen of nalaten van een derde die voor of namens de heffingplichtige optreedt, wordt aan de
      heffingplichtige toegerekend.
    url: https://wetten.overheid.nl/BWBR0010788/2002-01-01#Artikel2
  - number: '3'
    text: |-
      1 De inspecteur legt geen verzuimboete op indien bij de heffingplichtige sprake is van afwezigheid van alle schuld.
      Indien de heffingplichtige bij bezwaar stelt en bewijst dat er sprake is van afwezigheid van alle schuld, dan
      vernietigt de inspecteur de boete.

      2 De inspecteur legt geen vergrijpboete op indien bij de heffingplichtige geen sprake is van opzet, en in
      voorkomend geval van grove schuld. De inspecteur stelt en bewijst de aanwezigheid van opzet of grove schuld.
    url: https://wetten.overheid.nl/BWBR0010788/2002-01-01#Artikel3
  - number: '4'
    text: |-
      1 De inspecteur maakt een keuze tussen het opleggen van een verzuimboete en het opleggen van een vergrijpboete
      indien de heffingplichtige:

      a. geen aangifte doet van de varkensheffing;

      b. niet, gedeeltelijk niet, of niet tijdig de verschuldigde forfaitaire mineralenheffingen, de verschuldigde
      verfijnde mineralenheffingen, de verschuldigde heffing van intermediaire ondernemingen of de verschuldigde
      bestemmingsheffing, betaalt.

      2 Een eenmaal opgelegde verzuimboetesluit het opleggen van een vergrijpboete voor hetzelfde feit uit. Een eenmaal
      opgelegde vergrijpboete sluit het opleggen van een verzuimboete voor hetzelfde feit uit.
    url: https://wetten.overheid.nl/BWBR0010788/2002-01-01#Artikel4
  - number: '5'
    text: |-
      1 De vaststelling van een belastingaanslag en de vaststelling van een met deze aanslag samenhangende
      boetebeschikking vinden in beginsel gelijktijdig plaats.

      Uitzonderingen daarop vormen in ieder geval de gevallen, bedoeld in de [artikelen 67e, derde lid][ref1], en
      [67f, vijfde lid, van de Algemene wet inzake rijksbelastingen][ref2].

      2 Een afzonderlijke boetebeschikking wordt in beginsel gegeven indien een boete wordt opgelegd terwijl geen
      belasting verschuldigd is, dan wel geen belastingaanslag wordt of kan worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel67e
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel67f
    url: https://wetten.overheid.nl/BWBR0010788/2002-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 67e
      - id: ref2
        bwb_id: BWBR0002320
        artikel: 67f
  - number: '6'
    text: |-
      1 Indien de heffingplichtige niet meer in rechte tegen een hem opgelegde boete op kan komen, gaat de inspecteur na
      ontvangst van een verzoek om de boete ambtshalve te verminderen na of de boete tot de juiste hoogte is vastgesteld.
      Indien het de inspecteur blijkt dat de boete tot een te hoog bedrag is vastgesteld, vermindert hij dit bedrag.

      2 De termijn waarbinnen de heffingplichtige kan verzoeken om vermindering van de boete bedraagt vijf jaar, te
      rekenen vanaf de dag nadat de boetebeschikking onherroepelijk is geworden.

      3 De inspecteur vermindert in elk geval ambtshalve een opgelegde boete indien deze als gevolg van een wijziging van
      de grondslag voor de berekening van de boete voor verlaging in aanmerking komt.
    url: https://wetten.overheid.nl/BWBR0010788/2002-01-01#Artikel6
  - number: '7'
    text: |-
      Voor de toepassing van dit besluit geldt als dag van betaling:

      a. bij betalingen via een bankinstelling: de datum van bijschrijving op de rekening van de ontvanger van het bureau
      heffingen;

      b. bij betaling op het postkantoor door storting op de girorekening van de ontvanger van het bureau heffingen: de
      datum waarop het bedrag is gestort;

      c. bij betalingen met een primacheque aan het loket van de ontvanger van het bureau heffingen: de werkdag na
      inlevering van de primacheque;

      d. bij contante betaling aan de kas van de ontvanger van het bureau heffingen: de datum waarop het bedrag aan het
      loket is betaald.
    url: https://wetten.overheid.nl/BWBR0010788/2002-01-01#Artikel7
  - number: '8'
    text: |-
      1 De aan de heffingplichtige in verband met het opleggen van een boete toekomende waarborgen gelden, met
      uitzondering van het inzagerecht, bedoeld in [artikel 67m van de Algemene wet inzake rijksbelastingen][ref1],
      vanaf het tijdstip waarop de inspecteur een handeling verricht waaraan de heffingplichtige in redelijkheid de
      gevolgtrekking kan verbinden dat aan hem wegens een bepaalde gedraging een boete is of zal worden opgelegd.

      2 Het inzagerecht, bedoeld in [artikel 67m van de Algemene wet inzake rijksbelastingen][ref2], geldt vanaf
      het moment waarop de inspecteur de heffingplichtige meedeelt dat een verzuimboete is opgelegd of hem ervan in
      kennis stelt dat een vergrijpboete zal worden opgelegd. Indien het voornemen tot het opleggen van een boete
      geheel of gedeeltelijk berust op gegevens over derden, worden de desbetreffende bescheiden, voorzover mogelijk,
      geanonimiseerd.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel67m
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel67m
    url: https://wetten.overheid.nl/BWBR0010788/2002-01-01#Artikel8
