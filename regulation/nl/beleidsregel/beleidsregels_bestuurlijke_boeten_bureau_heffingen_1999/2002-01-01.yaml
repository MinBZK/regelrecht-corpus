        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0010788
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0010788
        hoofdstuk: IV
  - number: '10'
    text: |-
      1 Er is sprake van een verhoor als bedoeld in [artikel 67l van de Algemene wet inzake rijksbelastingen][ref1],
      indien de inspecteur de heffingplichtige in een directe confrontatie ondervraagt in verband met zijn voornemen een
      boete op te leggen.

      2 Een verhoor vindt niet eerder plaats dan na schriftelijke oproep door de inspecteur. De inspecteur vermeldt in
      de oproep dat de heffingplichtige tijdens het verhoor niet tot antwoorden is verplicht. De inspecteur herhaalt dit
      vóór het daadwerkelijke verhoor aanvangt.

      3 De heffingplichtige verschijnt in persoon voor het verhoor, tenzij de inspecteur ermee instemt dat de
      heffingplichtige zich laat vertegenwoordigen.

      4 De inspecteur maakt na afloop van het verhoor een verslag waarin hij onder meer vermeldt of de heffingplichtige
      erop is gewezen dat hij niet tot antwoorden verplicht is. De heffingplichtige krijgt een afschrift van dat verslag.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel67l
    url: https://wetten.overheid.nl/BWBR0010788/2002-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 67l
  - number: '11'
    text: |-
      1 De in [artikel 67g, tweede lid, van de Algemene wet inzake rijksbelastingen][ref1] bedoelde mededeling geschiedt
      schriftelijk.

      2 Bij het opleggen van een verzuimboete vermeldt de mededeling het feit dat aanleiding heeft gegeven tot het
      opleggen van de boete, alsmede de voor de berekening van de boete gehanteerde uitgangspunten.

      3 Bij het opleggen van een vergrijpboete vermeldt de mededeling het feit dat aanleiding heeft gegeven tot het
      opleggen van de boete alsmede de feiten en omstandigheden op grond waarvan wordt aangenomen dat sprake is van opzet
      of grove schuld. In voorkomende gevallen vermeldt de mededeling tevens de bijzondere omstandigheden, bedoeld in
      [hoofdstuk IV][ref2], die tot een matiging of een verhoging van de boete hebben geleid.

      4 Indien de inspecteur weet dat noch de heffingplichtige, noch zijn gemachtigde de Nederlandse taal voldoende
      begrijpt, vult hij de mededeling aan met een vertaling daarvan, althans een korte weergave in een voor de
      heffingplichtige of zijn gemachtigde begrijpelijke taal.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel67g
      [ref2]: https://wetten.overheid.nl/BWBR0010788#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0010788/2002-01-01#Artikel11
    references:
