  - number: '2'
    text: |-
      De LOOT-licentie is een beschikking van de Minister die wordt verleend aan een bevoegd gezag om gedurende vier
      schooljaren te mogen afwijken van de inrichtings- en examenvoorschriften op de wijze zoals omschreven in de
      [artikelen 4 tot en met 9][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022802#Artikel4
    url: https://wetten.overheid.nl/BWBR0022802/2008-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0022802
        artikel: '4'
  - number: '3.1'
    text: Het bevoegd gezag kan een aanvraag voor een LOOT-licentie indienen bij Stichting LOOT.
    url: https://wetten.overheid.nl/BWBR0022802/2008-01-01#Artikel3
  - number: '3.2'
    text: |-
      De aanvraag, bedoeld in het eerste lid, dient ontvangen te zijn uiterlijk op 31 januari van enig jaar, zodat
      een eventuele toekenning op 1 augustus van datzelfde jaar kan plaatsvinden. Een aanvraag die na 31 januari wordt
      ontvangen, wordt afgewezen.
    url: https://wetten.overheid.nl/BWBR0022802/2008-01-01#Artikel3
  - number: '3.3'
    text: 'De aanvraag dient te voldoen aan de volgende criteria:'
    url: https://wetten.overheid.nl/BWBR0022802/2008-01-01#Artikel3
  - number: 3.3.a
    text: tenminste 40 LOOT-leerlingen,
    url: https://wetten.overheid.nl/BWBR0022802/2008-01-01#Artikel3
  - number: 3.3.b
    text: |-
      van het criterium onder a kan worden afgeweken door één school per provincie indien sprake is van tenminste 10
      LOOT-leerlingen en ter bewerkstelliging is van regionale spreiding en
    url: https://wetten.overheid.nl/BWBR0022802/2008-01-01#Artikel3
  - number: 3.3.c
    text: |-
      de aangevraagde LOOT-licentie mag niet leiden tot verlies van LOOT-leerlingen van meer dan 10% bij één van de
      omliggende scholen met een LOOT-licentie.
    url: https://wetten.overheid.nl/BWBR0022802/2008-01-01#Artikel3
  - number: '3.4'
    text: |-
      Stichting LOOT beoordeelt de aanvragen aan de hand van de criteria bedoeld in het derde lid en brengt voor 1 april
      van het betreffende kalenderjaar een advies uit aan de Minister.
    url: https://wetten.overheid.nl/BWBR0022802/2008-01-01#Artikel3
  - number: '3.5'
    text: |-
      De Minister beschikt binnen een maand na ontvangst van het advies van de Stichting LOOT op de aanvraag voor een
      LOOT-licentie.
    url: https://wetten.overheid.nl/BWBR0022802/2008-01-01#Artikel3
  - number: '4.1'
    text: |-
      Het bevoegd gezag dat beschikt over een LOOT-licentie mag voor LOOT-leerlingen afwijken van de
      normen voor onderwijstijd als gesteld in respectievelijk de [artikelen 10, tweede lid][ref1],
      [10b, tweede lid][ref2], [10d, tweede lid][ref3], [11c, eerste lid, onder b][ref4], [11f, onder b. ][ref5]en
      [12, vijfde lid van de WVO][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel10b
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel10d
      [ref4]: https://wetten.overheid.nl/BWBR0002399#Artikel11c
      [ref5]: https://wetten.overheid.nl/BWBR0002399#Artikel11f
      [ref6]: https://wetten.overheid.nl/BWBR0002399#Artikel12
    url: https://wetten.overheid.nl/BWBR0022802/2008-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 10b
      - id: ref3
        bwb_id: BWBR0002399
        artikel: 10d
      - id: ref4
        bwb_id: BWBR0002399
        artikel: 11c
      - id: ref5
        bwb_id: BWBR0002399
        artikel: 11f
      - id: ref6
        bwb_id: BWBR0002399
        artikel: '12'
  - number: '4.2'
    text: |-
      Het bevoegd gezag richt voor LOOT-leerlingen als bedoeld in het eerste lid een onderwijsprogramma in dat per
      leerjaar tenminste omvat: 850 klokuren onderwijstijd in de eerste twee leerjaren vmbo, havo en vwo, alsmede in het
      derde leerjaar havo/vwo, 800 klokuren onderwijstijd in het derde leerjaar vmbo, het vierde leerjaar havo en het
      vierde en vijfde leerjaar vwo, en 550 klokuren onderwijstijd in het vierde leerjaar vmbo, het vijfde leerjaar havo
      en het zesde leerjaar vwo.
    url: https://wetten.overheid.nl/BWBR0022802/2008-01-01#Artikel4
  - number: '5'
    text: |-
      Het bevoegd gezag mag in afwijking van [artikel 11c, eerste lid, onder a van de WVO][ref1] de LOOT-leerling in de
      eerste twee leerjaren, ontheffing verlenen van de onderdelen van het onderwijsprogramma die betrekking hebben op de
      kerndoelen Bewegen en sport bedoeld in [bijlage 1, onderdeel G, bij het Besluit kerndoelen onderbouw VO](onbekend).


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel11c
    url: https://wetten.overheid.nl/BWBR0022802/2008-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 11c
  - number: '6'
    text: |-
      Het bevoegd gezag mag afwijken van de bepalingen in de [artikelen 10, vijfde en zevende lid][ref1],
      [10b, vijfde en zevende lid][ref2], en [10d, vijfde en zevende lid, van de WVO][ref3] en van de bepalingen in de
      [artikelen 22, eerste lid][ref4], [23, eerste lid, onder a en c][ref5], [24, eerste lid, onder a en c][ref6] en
      [25, eerste lid, onder a, b en c van het Eindexamenbesluit][ref7] door een LOOT-leerling in het vmbo ontheffing te
      verlenen voor:


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel10b
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel10d
      [ref4]: https://wetten.overheid.nl/BWBR0004593#Artikel22
      [ref5]: https://wetten.overheid.nl/BWBR0004593#Artikel23
      [ref6]: https://wetten.overheid.nl/BWBR0004593#Artikel24
      [ref7]: https://wetten.overheid.nl/BWBR0004593#Artikel25
    url: https://wetten.overheid.nl/BWBR0022802/2008-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 10b
      - id: ref3
        bwb_id: BWBR0002399
        artikel: 10d
      - id: ref4
        bwb_id: BWBR0004593
        artikel: '22'
      - id: ref5
        bwb_id: BWBR0004593
        artikel: '23'
      - id: ref6
        bwb_id: BWBR0004593
        artikel: '24'
      - id: ref7
        bwb_id: BWBR0004593
        artikel: '25'
  - number: 6.a
    text: |-
      maatschappijleer, lichamelijke opvoeding en één van de vakken behorende tot de beeldende vorming, muziek, dans
      of drama;
    url: https://wetten.overheid.nl/BWBR0022802/2008-01-01#Artikel6
  - number: 6.b
    text: één of meer vakken of programmaonderdelen uit het vrije deel.
    url: https://wetten.overheid.nl/BWBR0022802/2008-01-01#Artikel6
  - number: '7'
    text: |-
      Het bevoegd gezag kan, in afwijking van [artikel 13][ref1] en [artikel 6d van de WVO][ref2],
      [artikel 26b van het Inrichtingsbesluit W.V.O][ref3] en [artikel 11, lid 1][ref4] dan wel
      [artikel 12, lid 1 van het Eindexamenbesluit][ref5] een LOOT-leerling in het vwo ontheffing verlenen voor:


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel6d
      [ref3]: https://wetten.overheid.nl/BWBR0005946#Artikel26b
      [ref4]: https://wetten.overheid.nl/BWBR0004593#Artikel11
      [ref5]: https://wetten.overheid.nl/BWBR0004593#Artikel12
    url: https://wetten.overheid.nl/BWBR0022802/2008-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '13'
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 6d
      - id: ref3
        bwb_id: BWBR0005946
        artikel: 26b
      - id: ref4
        bwb_id: BWBR0004593
        artikel: '11'
      - id: ref5
        bwb_id: BWBR0004593
        artikel: '12'
  - number: 7.a
    text: lichamelijke opvoeding;
    url: https://wetten.overheid.nl/BWBR0022802/2008-01-01#Artikel7
  - number: 7.b
    text: maatschappijleer, algemene natuurwetenschappen en culturele en kunstzinnige vorming;
    url: https://wetten.overheid.nl/BWBR0022802/2008-01-01#Artikel7
  - number: 7.c
    text: |-
      het keuzevak bedoeld in [artikel 11, lid 1, onder c][ref1] dan wel het keuzevak bedoeld in
      [artikel 12, lid 1, onder c van het Eindexamenbesluit][ref2] of het profielkeuzevak.


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0004593#Artikel12
    url: https://wetten.overheid.nl/BWBR0022802/2008-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0004593
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0004593
        artikel: '12'
  - number: '8'
    text: |-
      Het bevoegd gezag kan, in afwijking van [artikel 14][ref1] en [artikel 6d van de WVO][ref2],
      [artikel 26c van het Inrichtingsbesluit W.V.O.][ref3] en [artikel 13, lid 1 van het Eindexamenbesluit][ref4] een
      LOOT-leerling in het havo ontheffing verlenen voor:


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel6d
      [ref3]: https://wetten.overheid.nl/BWBR0005946#Artikel26c
      [ref4]: https://wetten.overheid.nl/BWBR0004593#Artikel13
    url: https://wetten.overheid.nl/BWBR0022802/2008-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 6d
      - id: ref3
        bwb_id: BWBR0005946
        artikel: 26c
      - id: ref4
        bwb_id: BWBR0004593
        artikel: '13'
  - number: 8.a
    text: lichamelijke opvoeding;
    url: https://wetten.overheid.nl/BWBR0022802/2008-01-01#Artikel8
  - number: 8.b
    text: maatschappijleer en culturele en kunstzinnige vorming;
    url: https://wetten.overheid.nl/BWBR0022802/2008-01-01#Artikel8
  - number: 8.c
    text: |-
      het keuzevak bedoeld in [artikel 13, lid 1, onder c van het Eindexamenbesluit][ref1] of het profielkeuzevak.


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel13
    url: https://wetten.overheid.nl/BWBR0022802/2008-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004593
        artikel: '13'
  - number: '9'
    text: |-
      De Minister staat toe dat het bevoegd gezag afwijkt van [artikel 37 van het Eindexamenbesluit][ref1] en staat toe
      dat een LOOT-leerling het eindexamen, voor een deel van de vakken in het ene schooljaar en voor het andere deel in
      het daarop volgende schooljaar aflegt.


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel37
    url: https://wetten.overheid.nl/BWBR0022802/2008-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0004593
        artikel: '37'
  - number: '10.1'
    text: |-
      Stichting LOOT beoordeelt na vier schooljaren de LOOT-licentie aan de hand van de criteria bedoeld in
      [artikel 3, het derde lid][ref1], en brengt voor 1 april van het betreffende kalenderjaar een advies uit aan de
      Minister over verlenging van de LOOT-licentie met vier schooljaren.


      [ref1]: https://wetten.overheid.nl/BWBR0022802#Artikel3
    url: https://wetten.overheid.nl/BWBR0022802/2008-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0022802
        artikel: '3'
  - number: '10.2'
    text: De Minister beschikt binnen een maand na ontvangst van het advies van de Stichting LOOT.
    url: https://wetten.overheid.nl/BWBR0022802/2008-01-01#Artikel10
  - number: '10.3'
    text: |-
      Indien het aantal LOOT-leerlingen gedurende de looptijd van de LOOT-licentie structureel minder dan 40 leerlingen
      bedraagt zal de Minister niet tot verlenging overgaan. De eerste volzin is niet van toepassing voor zover het
      betreft een licentie afgegeven ter voldoening aan het criterium onder [artikel 3, derde lid, onder b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022802#Artikel3
    url: https://wetten.overheid.nl/BWBR0022802/2008-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0022802
        artikel: '3'
  - number: '10.4'
    text: |-
      De bepalingen van de beschikking voor een LOOT-licentie blijven van toepassing op LOOT-leerlingen die op de datum
      van het verlopen van de LOOT-licentie nog niet de opleiding in het voortgezet onderwijs hebben afgesloten.
    url: https://wetten.overheid.nl/BWBR0022802/2008-01-01#Artikel10
  - number: '11'
    text: |-
      Indien het Olympisch Netwerk gedurende de looptijd van de LOOT-licentie de aanwijzing tot LOOT-leerling intrekt,
      dient die leerling vanaf dat moment aan het reguliere onderwijsprogramma deel te nemen.
    url: https://wetten.overheid.nl/BWBR0022802/2008-01-01#Artikel11
  - number: '12'
    text: |-
      Beschikkingen afgegeven vóór de inwerkingtreding van deze beleidsregel worden geacht te zijn afgegeven op grond van
      deze beleidsregel.
    url: https://wetten.overheid.nl/BWBR0022802/2008-01-01#Artikel12
  - number: '13'
    text: Deze regeling treedt in werking met ingang van 1 januari 2008.
    url: https://wetten.overheid.nl/BWBR0022802/2008-01-01#Artikel13
  - number: '14'
    text: 'Deze beleidsregel wordt aangehaald als: Beleidsregel VO-scholen met een LOOT-licentie.'
    url: https://wetten.overheid.nl/BWBR0022802/2008-01-01#Artikel14
