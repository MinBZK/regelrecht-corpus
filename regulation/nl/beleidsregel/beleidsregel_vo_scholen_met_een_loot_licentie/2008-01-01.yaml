preamble:
  text: |-
    Gelet op de artikelen 25 en 29, zesde lid, van de Wet op het voortgezet onderwijs;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0022802/2008-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze beleidsregel wordt verstaan onder: - school: uit ’s Rijks kas bekostigde school voor voortgezet onderwijs
      als bedoeld in [artikel 1 van de Wet op het voortgezet onderwijs][ref1];
        - bevoegd gezag: bevoegd gezag als bedoeld in [artikel 1 van de Wet op het voortgezet onderwijs][ref2];
        - Minister: Minister van Onderwijs, Cultuur en Wetenschap;
        - WVO: de [Wet op het voortgezet onderwijs][ref3];
        - Eindexamenbesluit: het [Eindexamenbesluit v.w.o.-h.a.v.o.-m.a.v.o.-v.b.o.][ref4];
        - Inrichtingsbesluit: het [Inrichtingsbesluit W.V.O.][ref5];
        - Stichting LOOT: de stichting Landelijk Overleg Onderwijs en Topsport;
        - Olympisch Netwerk: regionale samenwerking van lokale partijen welke zich inzetten voor de professionalisering van
      de sport;
        - LOOT-leerling: de leerling die als werkelijk schoolgaand staat ingeschreven bij de school en die door een
      Olympisch Netwerk of sportkoepel NOC*NSF als topsporter op tenminste toptalentniveau is aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0002399
      [ref4]: https://wetten.overheid.nl/BWBR0004593
      [ref5]: https://wetten.overheid.nl/BWBR0005946
    url: https://wetten.overheid.nl/BWBR0022802/2008-01-01#Artikel1
