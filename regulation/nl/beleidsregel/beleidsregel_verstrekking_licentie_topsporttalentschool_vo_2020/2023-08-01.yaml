        artikel: '3.56'
      - id: ref2
        bwb_id: BWBR0045787
        artikel: '3.56'
  - number: '16'
    text: |-
      1 De minister kan op aanvraag van het bevoegd gezag van een school, niet zijnde een Topsporttalentschool, waarbij
      een topsporttalentleerling is ingeschreven, voor de duur van het schooljaar waarin de aanvraag wordt gedaan,
      toestaan om de topsporttalentleerling ontheffingen te verlenen als bedoeld in de [artikelen 11 tot en met 14][ref1]
      of een beroep te doen op de mogelijkheid voor het doen van een gespreid examen als bedoeld in [artikel 15][ref2].

      2 Uit de aanvraag bedoeld in het eerste lid moet het volgende blijken:

      a. de topsporttalentleerling staat ingeschreven op een school van het bevoegd gezag;

      b. de topsporttalentleerling woont op meer dan 25 kilometer reisafstand van een Topsporttalentschool of is
      ingeschreven voor een schoolsoort als bedoeld in [artikel 2.1. van de wet][ref3] die niet wordt aangeboden op een
      nabijgelegen Topsporttalentschool;

      c. de school kan blijkens een positief advies van het Expertisecentrum de topsporttalentleerling een optimale
      combinatie tussen sport en onderwijs aanbieden; en

      d. de kwaliteit van het onderwijs van de schoolsoort waar de topsporttalentleerling bij de school staat
      ingeschreven is niet zeer zwak als bedoeld in [artikel 2.94, eerste en derde lid, van de wet][ref4] of door de
      inspectie ingevolge [artikel 11 van de Wet op het onderwijstoezicht][ref5] als onvoldoende beoordeeld.

      3 De aanvraag bedoeld in het eerste lid kan tot 1 oktober van het lopende schooljaar worden gedaan. De minister
      beslist binnen 26 weken na ontvangst van de aanvraag.

      4 Indien de topsporttalentleerling bedoeld in het eerste en tweede lid niet meer beschouwd kan worden als een
      topsporttalentleerling, is [artikel 9][ref6] van overeenkomstige toepassing.

      5 De minister kan afwijken van het tweede lid, onder b, als toepassing daarvan gelet op het belang van de
      topsporttalentleerling om sport en onderwijs optimaal te kunnen combineren, zal leiden tot een onbillijkheid van
      overwegende aard.


