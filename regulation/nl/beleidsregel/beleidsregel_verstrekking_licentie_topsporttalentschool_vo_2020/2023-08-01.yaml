  text: |-
    Gelet op de artikelen 25 en 29, zevende lid, van de Wet op het voortgezet onderwijs en artikel 4:81 van de Algemene
    wet bestuursrecht;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0044028/2023-08-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze beleidsregel wordt verstaan onder:

        - *bevoegd gezag:* bevoegd gezag als bedoeld in [artikel 1.1 van de wet][ref1];
        - *Expertisecentrum:* Expertisecentrum Voortgezet Onderwijs & Topsport;
        - *KNVB:* Koninklijke Nederlandse Voetbalbond;
        - *licentie Topsporttalentschool:* beschikking van de minister aan het bevoegd gezag van een school waarin een
      aanvraag als bedoeld in [artikel 3][ref2] wordt ingewilligd;
        - *minister:* Minister voor Primair en Voortgezet Onderwijs;
        - *NOC*NSF:* Nederlands Olympisch Comité*Nederlandse Sport Federatie;
        - *reisafstand:* reisafstand op basis van de snelste route met de auto van het woonadres van de
      topsporttalentleerlingen naar het vestigingsadres van de Topsporttalentschool, bepaald door gebruikmaking van de
      ANWB-autorouteplanner;
        - *school:* hoofdvestiging of nevenvestiging van een school of scholengemeenschap voor voortgezet onderwijs waar
      uit de openbare kas bekostigd onderwijs wordt verzorgd als bedoeld in de [artikelen 2.4][ref3], [2.5][ref4],
      [2.6][ref5] en [2.7 van de wet][ref6];
        - *topsporttalentleerlingen:* leerling waarvan is vastgesteld dat deze wordt beschouwd als talent of topsporter met
      een officiële talent-, of topsportstatus van het NOC*NSF of een beloftestatus van de KNVB;
        - *Topsporttalentschool:* school met een licentie Topsporttalentschool als bedoeld in [artikel 3][ref7];
        - *vmbo:* middelbaar algemeen voortgezet onderwijs [artikel 2.6 van de wet][ref8] en voorbereidend beroepsonderwijs
      [artikel 2.7 van de wet][ref9];
        - *wet:* [Wet voortgezet onderwijs 2020][ref10].


