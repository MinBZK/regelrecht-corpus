        bwb_id: BWBR0044028
        artikel: '5'
  - number: '7'
    text: Alleen een school met de licentie Topsporttalentschool kan zich profileren als een Topsporttalentschool.
    url: https://wetten.overheid.nl/BWBR0044028/2023-08-01#Artikel7
  - number: '8'
    text: |-
      Indien uit het advies van het Expertisecentrum als bedoeld in [artikel 6, tweede lid][ref1], volgt dat
      Topsporttalentschool niet meer aan de voorschriften voldoet kan de minister besluiten:

      a. tot intrekking van de licentie Topsporttalentschool;

      b. de Topsporttalentschool eenmalig twee jaar de tijd te geven om zich te verbeteren.


      [ref1]: https://wetten.overheid.nl/BWBR0044028#Artikel6
    url: https://wetten.overheid.nl/BWBR0044028/2023-08-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0044028
        artikel: '6'
  - number: '9'
    text: |-
      1 Indien het NOC*NSF of de KNVB oordeelt dat een betrokken leerling niet langer kan worden beschouwd als een
      topsporttalentleerling, neemt die leerling vanaf dat moment weer deel aan het reguliere onderwijsprogramma.

      2 Indien het voor de leerling als bedoeld in het eerste lid redelijkerwijs niet mogelijk is om
      de gemiste vakonderdelen nog in te halen, blijft een reeds geëffectueerde ontheffing op grond van
      [artikel 10 tot en met 14][ref1] van kracht, evenals een reeds lopende spreiding van het examen op grond van
      [artikel 15][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0044028#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0044028#Artikel15
    url: https://wetten.overheid.nl/BWBR0044028/2023-08-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0044028
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0044028
        artikel: '15'
  - number: '10'
    text: |-
      Indien de licentie Topsporttalentschool wordt ingetrokken, behouden de betrokken leerlingen de onder de
      oorspronkelijke licentie Topsporttalentschool verkregen mogelijkheden aan die school. Indien dit niet mogelijk is,
      verzorgt de school een alternatief.
    url: https://wetten.overheid.nl/BWBR0044028/2023-08-01#Artikel10
  - number: '11'
    text: |-
      Het bevoegd gezag dat beschikt over een licentie Topsporttalentschool kan in afwijking van
      de [artikelen 2.14, tweede lid][ref1], en [2.33 van de wet][ref2], de topsporttalentleerling
      in de eerste twee leerjaren ontheffing verlenen van de onderdelen van het onderwijsprogramma
      die betrekking hebben op de kerndoelen bewegen en sport, in onderdeel G van
      [bijlage 1, behorende bij artikel 2.1 van het Uitvoeringsbesluit WVO 2020][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2.14
      [ref2]: https://wetten.overheid.nl/BWBR0044212#Artikel2.33
      [ref3]: https://wetten.overheid.nl/BWBR0045787
    url: https://wetten.overheid.nl/BWBR0044028/2023-08-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '2.14'
      - id: ref2
        bwb_id: BWBR0044212
        artikel: '2.33'
      - id: ref3
        bwb_id: BWBR0045787
  - number: '12'
    text: |-
      Het bevoegd gezag dat beschikt over een licentie Topsporttalentschool kan, in afwijking van
      [artikel 2.33 van de wet][ref1] en de [artikelen 2.20][ref2], [2.22][ref3], [2.24][ref4], [2.26][ref5],
      [3.4, eerste lid, onder a en c][ref6], [3.5, eerste lid, onder a en c][ref7], [3.6, eerste lid, onder a en c][ref8]
      en [3.7, eerste lid, onder a en c, van het Uitvoeringsbesluit WVO 2020][ref9], een topsporttalentleerling in het
      vmbo ontheffing verlenen voor:

      a. lichamelijke opvoeding;

      b. maatschappijleer;

      c. één van de vakken behorende tot de beeldende vorming, muziek, dans of drama; en

      d. in de theoretische leerweg één vak uit het vrije deel als bedoeld in
      [artikel 2.17, eerste lid, onderdelen a en b, van het Uitvoeringsbesluit WVO 2020][ref10], in
      de gemengde leerweg één vak uit het vrije deel of twee beroepsgerichte keuzevakken als bedoeld
      in [artikel 2.26, onderdelen a, b en c van het Uitvoeringsbesluit WVO 2020][ref11] en in de
      basisberoepsgerichte- of kaderberoepsgerichte leerweg vier beroepsgerichte keuzevakken als bedoeld in
      [artikel 2.22, onderdeel a, van het Uitvoeringsbesluit WVO 2020][ref12].


