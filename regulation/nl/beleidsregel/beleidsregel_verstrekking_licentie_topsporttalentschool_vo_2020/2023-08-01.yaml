  - number: '15'
    text: |-
      1 In uitzonderlijke gevallen kan het bevoegd gezag, dat beschikt over een licentie Topsporttalentschool, voor een
      topsporttalentleerling beroep doen op [artikel 3.56 van het Uitvoeringsbesluit WVO 2020][ref1] voor het doen van
      gespreid examen.

      2 Alleen een topsporttalentleerling die in het laatste leerjaar wordt geconfronteerd met activiteiten in het kader
      van uitoefening van de sport, waardoor het niet mogelijk is het eindexamen in het laatste leerjaar volledig af te
      leggen, komt voor toepassing van [artikel 3.56 van het Uitvoeringsbesluit WVO 2020][ref2] in aanmerking.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel3.56
      [ref2]: https://wetten.overheid.nl/BWBR0045787#Artikel3.56
    url: https://wetten.overheid.nl/BWBR0044028/2023-08-01#Artikel15
    references:
