  - number: '14'
    text: |-
      Het bevoegd gezag dat beschikt over een licentie Topsporttalentschool kan, in afwijking van
      [artikel 2.33 van de wet][ref1], [paragraaf 2 van hoofdstuk 2][ref2] en [artikel 3.1][ref3] dan wel
      [3.2 van het Uitvoeringsbesluit WVO 2020][ref4], een topsporttalentleerling in het vwo ontheffing verlenen voor:

      a. lichamelijke opvoeding;

      b. maatschappijleer;

      c. culturele en kunstzinnige vorming; en

      d. een profielkeuzevak als bedoeld in [artikel 2.6 van het Uitvoeringsbesluit WVO 2020][ref5] of een keuzevak als
      bedoeld in [artikel 2.7 van het Uitvoeringsbesluit WVO 2020][ref6].


