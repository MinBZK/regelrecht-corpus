  - number: '2'
    text: |-
      Het doel van deze regeling is om sporttalenten met een officiële talent-, of topsportstatus van het NOC*NSF of
      een beloftestatus van de KNVB op een Topsporttalentschool in staat te stellen topsport en onderwijs zo optimaal
      mogelijk te combineren. De beleidsregel draagt bij aan het bevorderen van talentontwikkeling op het hoogst
      mogelijke sportniveau in het voortgezet onderwijs.
    url: https://wetten.overheid.nl/BWBR0044028/2023-08-01#Artikel2
  - number: '3'
    text: |-
      1 De minister kan op verzoek van het bevoegd gezag van een school een licentie Topsporttalentschool verstrekken.

      2 Een aanvraag van het bevoegd gezag van een school wordt in behandeling genomen indien is voldaan aan de vereisten
      in de [artikelen 4][ref1] en [5][ref2]. De Minister kan in uitzonderlijke gevallen van de genoemde aantallen in
      [artikel 5][ref3] afwijken indien leerlingendaling of schoolsplitsing hier aanleiding toe geeft.

      3 Scholen waar op het moment van de aanvraag of op het moment van besluiten de kwaliteit van het onderwijs zeer
      zwak is als bedoeld in [artikel 2.94, eerste en derde lid, van de wet][ref4] of door de inspectie ingevolge
      [artikel 11 van de Wet op het onderwijstoezicht][ref5] het onderwijs als onvoldoende is beoordeeld, komen niet in
      aanmerking voor een licentie Topsporttalentschool.

      4 De aanvraag voor een licentie Topsporttalentschool wordt op uiterlijk 1 oktober van het schooljaar ingediend.

      5 Het Expertisecentrum adviseert de minister over de aanvraag op uiterlijk 1 december van het desbetreffende jaar.

      6 De minister beslist binnen 26 weken na ontvangst van een aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0044028#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0044028#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0044028#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0044212#Artikel2.94
      [ref5]: https://wetten.overheid.nl/BWBR0013800#Artikel11
