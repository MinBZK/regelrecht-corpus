  - number: '4'
    text: |-
      De aanvraag gaat vergezeld van de volgende documenten:

      a. een verklaring van de school dat op de desbetreffende school een door het NOC*NSF of de KNVB goedgekeurde lijst
      met de namen en sport met talent-, of topsportniveau van de topsporttalentleerlingen aanwezig is;

      b. het schoolplan, met daarin een beleidsnotitie waaruit blijkt op welke wijze de school voldoet aan
      [artikel 5, onderdeel c][ref1], en hoe de school zorg draagt voor flexibiliteit in de onderwijsprogramma’s, en
      flexibiliteit bij het afleggen van toetsen en schoolexamens en centrale examens, rekening houdend met de belangen
      van de betrokken topsporttalentleerling.


      [ref1]: https://wetten.overheid.nl/BWBR0044028#Artikel5
    url: https://wetten.overheid.nl/BWBR0044028/2023-08-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0044028
        artikel: '5'
  - number: '5'
    text: |-
      De school, waarvoor het bevoegd gezag een aanvraag als bedoeld in [artikel 3][ref1] heeft ingediend, voldoet aan de
      volgende voorschriften:

      a. op de meest recente teldatum van 1 oktober die voorafgaat aan de aanvraag, zijn op de school ten minste
      35 topsporttalentleerlingen ingeschreven, waarbij per sport maximaal 15 leerlingen meetellen, tenzij:

      1°. deze voorwaarde tot gevolg heeft dat in een bepaalde provincie geen enkele licentie Topsporttalentschool
      kan worden verstrekt. In dat geval kan een licentie Topsporttalentschool worden verleend aan een school in die
      provincie waar ten minste tien topsporttalentleerlingen staan ingeschreven en maximaal één derde deel van die
      topsporttalentleerlingen dezelfde sport beoefent; of

      2°. het een school betreft met ten minste 20 topsporttalentleerlingen die onderwijs volgen in het vmbo en maximaal
      één derde van die topsporttalentleerlingen dezelfde sport beoefent;

      b. er is een samenwerkingsverband met tenminste drie sportbonden of verenigingen die op het hoogste landelijk
      niveau actief zijn;

      c. op de school is personeel aanwezig en aanspreekbaar op de afstemming van de werkzaamheden die verband houden
      met de licentie Topsporttalentschool en het voorzien in de begeleiding van de topsporttalentleerlingen, met als
      uitgangspunt dat het onderwijsniveau van deze leerlingen wordt behouden.


      [ref1]: https://wetten.overheid.nl/BWBR0044028#Artikel3
    url: https://wetten.overheid.nl/BWBR0044028/2023-08-01#Artikel5
    references:
