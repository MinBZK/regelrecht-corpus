  - number: '13'
    text: |-
      Het bevoegd gezag dat beschikt over een licentie Topsporttalentschool kan, in
      afwijking van [artikel 2.33 van de wet][ref1], [paragraaf 3 van hoofdstuk 2][ref2] en
      [artikel 3.3, eerste lid van het Uitvoeringsbesluit WVO 2020][ref3], een topsporttalentleerling in de havo
      ontheffing verlenen voor:

      a. lichamelijke opvoeding;

      b. maatschappijleer;

      c. culturele en kunstzinnige vorming; en

      d. een profielkeuzevak als bedoeld in [artikel 2.11 van het Uitvoeringsbesluit WVO 2020][ref4] of een keuzevak als
      bedoeld in [artikel 2.12 van het Uitvoeringsbesluit WVO 2020][ref5].


