        artikel: '3'
  - number: '6'
    text: |-
      1 Het Expertisecentrum visiteert een school met een licentie Topsporttalentschool elk derde jaar na de datum waarop
      de licentie Topsporttalentschool is verstrekt.

      2 Op basis van de visitaties adviseert het Expertisecentrum de minister of een school met een licentie
      Topsporttalentschool nog steeds voldoet aan de voorschriften, als bedoeld in [artikel 5][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0044028#Artikel5
    url: https://wetten.overheid.nl/BWBR0044028/2023-08-01#Artikel6
    references:
