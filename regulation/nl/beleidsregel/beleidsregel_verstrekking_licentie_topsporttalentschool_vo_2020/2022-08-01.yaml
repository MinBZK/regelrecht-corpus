        artikel: '3'
  - number: 12.a
    text: lichamelijke opvoeding;
    url: https://wetten.overheid.nl/BWBR0044028/2022-08-01#Artikel12
  - number: 12.b
    text: maatschappijleer;
    url: https://wetten.overheid.nl/BWBR0044028/2022-08-01#Artikel12
  - number: 12.c
    text: één van de vakken behorende tot de beeldende vorming, muziek, dans of drama; en
    url: https://wetten.overheid.nl/BWBR0044028/2022-08-01#Artikel12
  - number: 12.d
    text: |-
      in de theoretische leerweg één vak uit het vrije deel als bedoeld in
      [artikel 2.17, eerste lid, onderdelen a en b, van het Uitvoeringsbesluit WVO 2020][ref1], in
      de gemengde leerweg één vak uit het vrije deel of twee beroepsgerichte keuzevakken als bedoeld
      in [artikel 2.26, onderdelen a, b en c van het Uitvoeringsbesluit WVO 2020][ref2] en in de
      basisberoepsgerichte- of kaderberoepsgerichte leerweg vier beroepsgerichte keuzevakken als bedoeld in
      [artikel 2.22, onderdeel a, van het Uitvoeringsbesluit WVO 2020][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0045787#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0045787#Artikel2
    url: https://wetten.overheid.nl/BWBR0044028/2022-08-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0045787
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0045787
        artikel: '2'
  - number: '13'
    text: |-
      Het bevoegd gezag dat beschikt over een licentie Topsporttalentschool kan, in
      afwijking van [artikel 2.33 van de wet][ref1], [paragraaf 3 van hoofdstuk 2][ref2] en
      [artikel 3.1, eerste lid van het Uitvoeringsbesluit WVO 2020][ref3], een DAMU-leerling in de havo ontheffing
      verlenen voor:


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0045787#Paragraaf3
      [ref3]: https://wetten.overheid.nl/BWBR0045787#Artikel3
    url: https://wetten.overheid.nl/BWBR0044028/2022-08-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0045787
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0045787
        artikel: '3'
  - number: 13.a
    text: lichamelijke opvoeding;
    url: https://wetten.overheid.nl/BWBR0044028/2022-08-01#Artikel13
  - number: 13.b
    text: maatschappijleer;
    url: https://wetten.overheid.nl/BWBR0044028/2022-08-01#Artikel13
  - number: 13.c
    text: culturele en kunstzinnige vorming; en
    url: https://wetten.overheid.nl/BWBR0044028/2022-08-01#Artikel13
  - number: 13.d
    text: |-
      een vak als bedoeld in de [artikelen 2.11][ref1] en [2.12 van het Uitvoeringsbesluit WVO 2020][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0045787#Artikel2
    url: https://wetten.overheid.nl/BWBR0044028/2022-08-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0045787
        artikel: '2'
  - number: '14'
    text: |-
      Het bevoegd gezag dat beschikt over een licentie Topsporttalentschool kan, in afwijking van
      [artikel 2.33 van de wet][ref1] en [paragraaf 2 van hoofdstuk 2 van de wet][ref2], en artikel 3.1 dan wel
      [3.1 van het Uitvoeringsbesluit WVO 2020][ref3], een Loot-leerling in het vwo ontheffing verlenen voor:


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0044212#Paragraaf2
      [ref3]: https://wetten.overheid.nl/BWBR0045787#Artikel3
    url: https://wetten.overheid.nl/BWBR0044028/2022-08-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0044212
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0045787
        artikel: '3'
  - number: 14.a
    text: lichamelijke opvoeding;
    url: https://wetten.overheid.nl/BWBR0044028/2022-08-01#Artikel14
  - number: 14.b
    text: maatschappijleer;
    url: https://wetten.overheid.nl/BWBR0044028/2022-08-01#Artikel14
  - number: 14.c
    text: culturele en kunstzinnige vorming; en
    url: https://wetten.overheid.nl/BWBR0044028/2022-08-01#Artikel14
  - number: 14.d
    text: |-
      een vak als bedoeld in [artikel 2.6][ref1] of [2.7 van het Uitvoeringsbesluit WVO 2020][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0045787#Artikel2
    url: https://wetten.overheid.nl/BWBR0044028/2022-08-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0045787
        artikel: '2'
  - number: '15.1'
    text: |-
      In uitzonderlijke gevallen kan het bevoegd gezag, dat beschikt over een licentie Topsporttalentschool, voor een
      Loot-leerling beroep doen op [artikel 3.56 van het Uitvoeringsbesluit WVO 2020][ref1] voor het doen van gespreid
      examen.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel3
    url: https://wetten.overheid.nl/BWBR0044028/2022-08-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '3'
  - number: '15.2'
    text: |-
      Alleen een LOOT-leerling die in het laatste leerjaar wordt geconfronteerd met activiteiten in het kader van
      uitoefening van de sport, waardoor het niet mogelijk is het eindexamen in het laatste leerjaar volledig af te
      leggen, komt voor toepassing van [artikel 3.56 van het Uitvoeringsbesluit WVO 2020][ref1] in aanmerking.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel3
    url: https://wetten.overheid.nl/BWBR0044028/2022-08-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '3'
  - number: '16'
    text: De minister evalueert deze beleidsregel voor 1 januari 2025.
    url: https://wetten.overheid.nl/BWBR0044028/2022-08-01#Artikel16
  - number: '17.1'
    text: |-
      Een school die voorafgaand aan deze beleidsregel al beschikt over een gelijkwaardige licentie op grond van de
      [Beleidsregel verstrekking licentie Topsporttalentschool VO][ref1], blijft deze behouden.


      [ref1]: https://wetten.overheid.nl/BWBR0026643
    url: https://wetten.overheid.nl/BWBR0044028/2022-08-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0026643
  - number: '17.2'
    text: |-
      Reeds bestaande ontheffingen en vrijstellingen die op basis van de
      [Beleidsregel verstrekking licentie Topsporttalentschool VO][ref1] zijn verstrekt, blijven behouden.


      [ref1]: https://wetten.overheid.nl/BWBR0026643
    url: https://wetten.overheid.nl/BWBR0044028/2022-08-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0026643
  - number: '18'
    text: |-
      De [Beleidsregel verstrekking licentie Topsporttalentschool VO][ref1] wordt per 1 september 2020 ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0026643
    url: https://wetten.overheid.nl/BWBR0044028/2022-08-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0026643
  - number: 18a
    text: |-
      Deze beleidsregel is mede gebaseerd op [artikel 9.3 van de Wet voortgezet onderwijs 2020][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel9
    url: https://wetten.overheid.nl/BWBR0044028/2022-08-01#Artikel18a
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '9'
  - number: '19'
    text: Deze beleidsregel treedt in werking met ingang van 1 september 2020.
    url: https://wetten.overheid.nl/BWBR0044028/2022-08-01#Artikel19
  - number: '20'
    text: 'Deze beleidsregel wordt aangehaald als: Beleidsregel verstrekking licentie Topsporttalentschool VO 2020.'
