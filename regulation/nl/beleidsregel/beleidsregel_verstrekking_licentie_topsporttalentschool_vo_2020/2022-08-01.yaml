preamble:
  text: |-
    Gelet op de artikelen 25 en 29, zevende lid, van de Wet op het voortgezet onderwijs en artikel 4:81 van de Algemene
    wet bestuursrecht;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0044028/2022-08-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze beleidsregel wordt verstaan onder: - *bevoegd gezag:* bevoegd gezag als bedoeld in
      [artikel 1.1 van de wet][ref1];
        - *licentie Topsporttalentschool:* beschikking van de minister aan het bevoegd gezag van een school waarin een
      aanvraag als bedoeld in [artikel 3][ref2] wordt ingewilligd;
        - *Loot-leerling:* leerling waarvan is vastgesteld dat deze wordt beschouwd als talent of topsporter met een
      officiële talent-, of topsportstatus van NOC*NSF;
        - *minister:* Minister voor Basis- en Voortgezet Onderwijs en Media;
        - *NOC*NSF:* Nederlands Olympisch Comité*Nederlandse Sport Federatie;
        - *school:* school of scholengemeenschap voor voortgezet onderwijs waar uit de openbare kas bekostigd onderwijs
      wordt verzorgd als bedoeld in de [artikelen 2.4][ref3], [2.5][ref4] en [2.6 van de wet][ref5];
        - *Stichting LOOT:* Stichting Landelijk Overleg Onderwijs en Topsport;
        - *vmbo:* middelbaar algemeen voortgezet onderwijs [artikel 2.6 van de wet][ref6] en voorbereidend beroepsonderwijs
      [artikel 2.7 van de wet][ref7];
        - *wet:* [Wet voortgezet onderwijs 2020][ref8].


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel1
