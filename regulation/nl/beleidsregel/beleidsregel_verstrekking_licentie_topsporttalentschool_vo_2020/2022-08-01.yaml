  - number: '2'
    text: |-
      Het doel van deze regeling is om sporttalenten met een officiële talent-, of topsportstatus van NOC*NSF op een
      Topsporttalentschool in staat te stellen topsport en onderwijs zo optimaal mogelijk te combineren. De beleidsregel
      draagt bij aan het bevorderen van talentontwikkeling op het hoogst mogelijke sportniveau in het voortgezet
      onderwijs.
    url: https://wetten.overheid.nl/BWBR0044028/2022-08-01#Artikel2
  - number: '3.1'
    text: De minister kan op verzoek van het bevoegd gezag van een school een licentie Topsporttalentschool verstrekken.
    url: https://wetten.overheid.nl/BWBR0044028/2022-08-01#Artikel3
  - number: '3.2'
    text: |-
      Een aanvraag van het bevoegd gezag van een school wordt in behandeling genomen indien is voldaan aan de vereisten
      in de [artikelen 4][ref1] en [6][ref2]. De Minister kan in uitzonderlijke gevallen van de genoemde aantallen in
      [artikel 5][ref3] afwijken indien leerlingendaling of schoolsplitsing hier aanleiding toe geeft.


      [ref1]: https://wetten.overheid.nl/BWBR0044028#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0044028#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0044028#Artikel5
    url: https://wetten.overheid.nl/BWBR0044028/2022-08-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0044028
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0044028
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0044028
        artikel: '5'
  - number: '3.3'
    text: |-
      Scholen waar op het moment van de aanvraag of op het moment van besluiten de kwaliteit van het onderwijs zeer
      zwak is als bedoeld in [artikel 2.94, eerste en derde lid, van de wet][ref1] of door de inspectie ingevolge
      [artikel 11 van de Wet op het onderwijstoezicht][ref2] het onderwijs als onvoldoende is beoordeeld, komen niet in
      aanmerking voor een licentie Topsporttalentschool.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0013800#Artikel11
    url: https://wetten.overheid.nl/BWBR0044028/2022-08-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0013800
        artikel: '11'
  - number: '3.4'
    text: |-
      De aanvraag voor een licentie Topsporttalentschool wordt jaarlijks op uiterlijk 1 oktober ingediend. Aanvragen
      ingediend na deze datum worden in een volgend kalenderjaar in behandeling genomen.
    url: https://wetten.overheid.nl/BWBR0044028/2022-08-01#Artikel3
  - number: '3.5'
    text: Stichting LOOT adviseert de minister over de aanvraag op uiterlijk 1 december van het desbetreffende jaar.
    url: https://wetten.overheid.nl/BWBR0044028/2022-08-01#Artikel3
  - number: '3.6'
    text: |-
      De minister besluit over het verstrekken van een licentie Topsporttalentschool op uiterlijk 1 februari van het
      volgende kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0044028/2022-08-01#Artikel3
  - number: '4'
    text: 'De aanvraag gaat vergezeld van de volgende documenten:'
    url: https://wetten.overheid.nl/BWBR0044028/2022-08-01#Artikel4
  - number: 4.a
    text: |-
      een verklaring van de school dat op de desbetreffende school een door het NOC*NSF goedgekeurde lijst met de namen
      en sport met talent-, of topsportniveau van de Loot-leerlingen aanwezig is;
    url: https://wetten.overheid.nl/BWBR0044028/2022-08-01#Artikel4
  - number: 4.b
    text: |-
      het schoolplan, met daarin een beleidsnotitie waaruit blijkt op welke wijze de school voldoet aan
      [artikel 5, onderdeel c][ref1], en hoe de school zorg draagt voor flexibiliteit in de onderwijsprogramma’s, en
      flexibiliteit bij het afleggen van toetsen en schoolexamens en centrale examens, rekening houdend met de belangen
      van de betrokken Loot-leerling.


      [ref1]: https://wetten.overheid.nl/BWBR0044028#Artikel5
    url: https://wetten.overheid.nl/BWBR0044028/2022-08-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0044028
        artikel: '5'
  - number: '5'
    text: |-
      De school, waarvoor het bevoegd gezag een aanvraag als bedoeld in [artikel 3][ref1] heeft ingediend, voldoet aan de
      volgende voorschriften:


      [ref1]: https://wetten.overheid.nl/BWBR0044028#Artikel3
    url: https://wetten.overheid.nl/BWBR0044028/2022-08-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0044028
        artikel: '3'
  - number: 5.a
    text: |-
      op de meest recente teldatum van 1 oktober die voorafgaat aan de aanvraag, zijn op de school ten minste 35 Loot-
      leerlingen ingeschreven, waarbij per sport maximaal 15 leerlingen meetellen, tenzij:
    url: https://wetten.overheid.nl/BWBR0044028/2022-08-01#Artikel5
  - number: 5.a.1°
    text: |-
      deze voorwaarde tot gevolg heeft dat in een bepaalde provincie geen enkele licentie Topsporttalentschool kan worden
      verstrekt. In dat geval kan een licentie Topsporttalentschool worden verleend aan een school in die provincie waar
      ten minste tien Loot-leerlingen staan ingeschreven en maximaal één derde deel van die Loot-leerlingen dezelfde
      sport beoefent; of
    url: https://wetten.overheid.nl/BWBR0044028/2022-08-01#Artikel5
  - number: 5.a.2°
    text: |-
      het een school betreft met ten minste 20 Loot-leerlingen die onderwijs volgen in het vmbo en maximaal één derde van
      die Loot-leerlingen dezelfde sport beoefent;
    url: https://wetten.overheid.nl/BWBR0044028/2022-08-01#Artikel5
  - number: 5.b
    text: |-
      er is een samenwerkingsverband met tenminste drie sportbonden of verenigingen die op het hoogste landelijk niveau
      actief zijn;
    url: https://wetten.overheid.nl/BWBR0044028/2022-08-01#Artikel5
  - number: 5.c
    text: |-
      op de school is personeel aanwezig en aanspreekbaar op de afstemming van de werkzaamheden die verband houden met
      de licentie Topsporttalentschool en het voorzien in de begeleiding van de Loot-leerlingen, met als uitgangspunt dat
      het onderwijsniveau van deze leerlingen wordt behouden.
    url: https://wetten.overheid.nl/BWBR0044028/2022-08-01#Artikel5
  - number: '6.1'
    text: |-
      Stichting LOOT visiteert een school met een licentie Topsporttalentschool elk derde jaar na de datum waarop de
      licentie Topsporttalentschool is verstrekt.
    url: https://wetten.overheid.nl/BWBR0044028/2022-08-01#Artikel6
  - number: '6.2'
    text: |-
      Op basis van de visitaties adviseert Stichting LOOT de minister of een school met een licentie Topsporttalentschool
      nog steeds voldoet aan de voorschriften, bedoeld [artikel 5][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0044028#Artikel5
    url: https://wetten.overheid.nl/BWBR0044028/2022-08-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0044028
        artikel: '5'
  - number: '7'
    text: Alleen een school met de licentie Topsporttalentschool kan zich profileren als een Topsporttalentschool.
    url: https://wetten.overheid.nl/BWBR0044028/2022-08-01#Artikel7
  - number: '8'
    text: |-
      Indien uit het advies van Stichting LOOT als bedoeld in [artikel 6, tweede lid][ref1], volgt dat
      Topsporttalentschool niet meer aan de voorschriften voldoet kan de minister besluiten:


      [ref1]: https://wetten.overheid.nl/BWBR0044028#Artikel6
    url: https://wetten.overheid.nl/BWBR0044028/2022-08-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0044028
        artikel: '6'
  - number: 8.a
    text: tot intrekking van de licentie Topsporttalentschool;
    url: https://wetten.overheid.nl/BWBR0044028/2022-08-01#Artikel8
  - number: 8.b
    text: de Topsporttalentschool eenmalig twee jaar de tijd te geven om zich te verbeteren.
    url: https://wetten.overheid.nl/BWBR0044028/2022-08-01#Artikel8
  - number: '9.1'
    text: |-
      Indien NOC*NSF oordeelt dat een betrokken leerling niet langer kan worden beschouwd als een Loot-leerling, neemt
      die leerling vanaf dat moment weer deel aan het reguliere onderwijsprogramma.
    url: https://wetten.overheid.nl/BWBR0044028/2022-08-01#Artikel9
  - number: '9.2'
    text: |-
      Indien het voor de leerling als bedoeld in het eerste lid redelijkerwijs niet mogelijk is om de
      gemiste vakonderdelen nog in te halen, blijft Een reeds geëffectueerde ontheffing op grond van
      [artikel 10 tot en met 14][ref1] van kracht, evenals een reeds lopende spreiding van het examen op grond van
      [artikel 15][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0044028#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0044028#Artikel15
    url: https://wetten.overheid.nl/BWBR0044028/2022-08-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0044028
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0044028
        artikel: '15'
  - number: '10'
    text: |-
      Indien de licentie Topsporttalentschool wordt ingetrokken, behouden de betrokken leerlingen de onder de
      oorspronkelijke licentie Topsporttalentschool verkregen mogelijkheden aan die school. Indien dit niet mogelijk is,
      verzorgt de school een alternatief.
    url: https://wetten.overheid.nl/BWBR0044028/2022-08-01#Artikel10
  - number: '11'
    text: |-
      Het bevoegd gezag dat beschikt over een licentie Topsporttalentschool kan in afwijking van de
      [artikelen 2.14, tweede lid][ref1], en [2.33 van de wet][ref2], de Loot-leerling in de eerste twee leerjaren
      ontheffing verlenen van de onderdelen van het onderwijsprogramma die betrekking hebben op de kerndoelen bewegen en
      sport, in onderdeel G van [bijlage 1, behorende bij artikel 2.1 van het Uitvoeringsbesluit WVO 2020][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0044212#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0045787
    url: https://wetten.overheid.nl/BWBR0044028/2022-08-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0044212
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0045787
  - number: '12'
    text: |-
      Het bevoegd gezag dat beschikt over een licentie Topsporttalentschool kan, in afwijking van
      [artikel 2.33 van de wet][ref1] en de [artikelen 2.20][ref2], [2.22][ref3], [2.24][ref4], [2.26][ref5],
      [3.4, eerste lid, onder a en c][ref6], [3.5, eerste lid, onder a en c][ref7], [3.6, eerste lid, onder a en c][ref8]
      en [3.7, eerste lid, onder a en c, van het Uitvoeringsbesluit WVO 2020][ref9], een Loot-leerling in het vmbo
      ontheffing verlenen voor:


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0045787#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0045787#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0045787#Artikel2
      [ref5]: https://wetten.overheid.nl/BWBR0045787#Artikel2
      [ref6]: https://wetten.overheid.nl/BWBR0045787#Artikel3
      [ref7]: https://wetten.overheid.nl/BWBR0045787#Artikel3
      [ref8]: https://wetten.overheid.nl/BWBR0045787#Artikel3
      [ref9]: https://wetten.overheid.nl/BWBR0045787#Artikel3
    url: https://wetten.overheid.nl/BWBR0044028/2022-08-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '2'
