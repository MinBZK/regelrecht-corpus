  - number: '79.16'
    text: |-
      Als de Dienst Toeslagen, met gebruikmaking van de mogelijkheid in [artikel 25, derde lid, van de Awir][ref1],
      toeslagen aan een derde uitbetaalt, stopt zij hiermee in de volgende situaties:

      1. Op het moment dat de derde failliet is verklaard of hem surseance van betaling is verleend.

      2. Als het faillissement van de derde is aangevraagd of door de derde aangifte tot faillietverklaring is gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0018472#Artikel25
