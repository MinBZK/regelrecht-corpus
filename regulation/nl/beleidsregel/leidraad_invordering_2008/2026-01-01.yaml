  - number: 22bis.3
    text: |-
      Onder handelingen die worden verricht in de normale uitoefening van het bedrijf of beroep van de belastingschuldige
      worden verstaan vervangingsinvesteringen of andere handelingen die nadrukkelijk in het teken staan van de
      continuïteit van het bedrijf of beroep van de belastingschuldige zoals dat bedrijf ten tijde van die handeling
      wordt gevoerd respectievelijk het beroep wordt uitgeoefend. Handelingen die plaatsvinden met het oogmerk zekerheid
      uit te winnen of te versterken, vinden niet plaats in de normale uitoefening van het bedrijf of het beroep.
    url: https://wetten.overheid.nl/BWBR0024096/2026-01-01#Artikel22bis.3
  - number: 22bis.4
    text: |-
      In het geval de ontvanger na ontvangst van een mededeling besluit geen beslag te leggen, stelt hij de derde of de
      belastingschuldige daarvan zo spoedig mogelijk in kennis.

      Ten aanzien van de behandelingstermijn van de mededeling houdt de ontvanger zoveel als mogelijk rekening met de hem
      ter kennis gebrachte gerechtvaardigde belangen van de belastingschuldige en van derden.
    url: https://wetten.overheid.nl/BWBR0024096/2026-01-01#Artikel22bis.4
  - number: 22bis.5
    text: |-
      De derde of de belastingschuldige die voornemens is zijn rechten uit te oefenen, dan wel een andere handeling te
      verrichten of te laten verrichten in de zin van [artikel 22bis, tweede of derde lid, van de wet][ref1], kan in
      overleg treden met de ontvanger teneinde overeenstemming te bereiken over de afhandeling van de mededeling. Hierbij
      zijn de uitgangspunten als beschreven in de [artikelen 22bis.5.1. tot en met 22bis.5.3][ref2]. van deze leidraad
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel22bis
      [ref2]: https://wetten.overheid.nl/BWBR0024096#Artikel22bis
    url: https://wetten.overheid.nl/BWBR0024096/2026-01-01#Artikel22bis.5
    references:
