  - number: 22bis.2
    text: |-
      In afwijking van [artikel 22bis.1., eerste lid][ref1], geldt de mededelingsplicht voor de onder onderdeel B
      genoemde gevallen onverkort indien:

      a. ter zake van de financiering enige betalingsachterstand is ontstaan die ten tijde van het in
      [artikel 22bis, tweede lid, van de wet][ref2] bedoelde handelen meer dan vier maanden heeft voortgeduurd;

      b. de derde mede zekerheids- of eigendomsrechten op bodemzaken van de belastingschuldige heeft verworven welke
      niet uitsluitend strekken ter verzekering van vorderingen die voortvloeien uit de financiering van de verwerving
      (aankoopfinanciering) van de betreffende zaken;

      c. de aankoopfinanciering tot stand is gekomen na verloop van drie maanden na de initiële machtsverschaffing van de
      individuele bodemzaak aan de belastingschuldige; of

      d. ter zake van de bodemzaak een wederzijdse zekerheden-regeling is overeengekomen waarbij een derde-financier
      betrokken is.


      [ref1]: https://wetten.overheid.nl/BWBR0024096#Artikel22bis
      [ref2]: https://wetten.overheid.nl/BWBR0004770#Artikel22bis
