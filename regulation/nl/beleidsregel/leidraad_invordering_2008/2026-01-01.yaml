        artikel: 22bis
  - number: 22bis.5.1
    text: |-
      Op verzoek van de derde of de belastingschuldige die de mededeling heeft gedaan, kan de ontvanger afzien van het
      leggen van beslag c.q. de vervolging van een naar aanleiding van de mededeling gelegd beslag op de betreffende
      bodemzaken, tegen betaling van een geldsom. Daarbij gelden de volgende voorwaarden:

      a. de geldsom is niet direct of indirect afkomstig uit het vermogen van de belastingschuldige maar wordt
      gefinancierd door een derde;

      b. het beloop van de aangeboden geldsom is ten minste gelijk aan de executiewaarde van de betreffende bodemzaken;
      en

      c. de ontvanger behoudt zich het recht voor het restant van de belastingschuld in te vorderen met alle middelen
      rechtens.
    url: https://wetten.overheid.nl/BWBR0024096/2026-01-01#Artikel22bis.5.1
  - number: 22bis.5.2
    text: |-
      Op verzoek van de belastingschuldige of de derde die de mededeling heeft gedaan, kan de ontvanger afzien van het
      leggen van beslag c.q. de vervolging van een naar aanleiding van de mededeling gelegd beslag op de betreffende
      bodemzaken indien dit noodzakelijk is voor de instandhouding van de onderneming of van een deel van de onderneming.
      Wanneer de bedoelde instandhouding niet kan slagen zonder schuldsanering, is daarbij het bepaalde in de artikelen
      26.3 of 73.6 van deze leidraad van overeenkomstige toepassing. Waar op grond van deze artikelen zekerheidstelling
      wordt vereist, omvat die zekerheid tenminste de betreffende bodemzaken.
    url: https://wetten.overheid.nl/BWBR0024096/2026-01-01#Artikel22bis.5.2
  - number: 22bis.5.3
    text: |-
      Op verzoek van de belastingschuldige of de derde die de mededeling heeft gedaan, kan de ontvanger afzien van het
      leggen van beslag c.q. de vervolging van een naar aanleiding van de mededeling gelegd beslag op de betreffende
      bodemzaken indien dit noodzakelijk is voor de instandhouding van de onderneming of van een deel van de onderneming.
      Wanneer de bedoelde instandhouding niet kan slagen zonder dat voor een bepaalde periode uitstel van betaling wordt
      verleend, is daarbij het bepaalde in de artikelen 25.6.1. tot en met 25.6.2B. van deze leidraad van overeenkomstige
      toepassing. In elk geval is voor het uitstel zekerheidstelling vereist, welke zekerheid tenminste de betreffende
      bodemzaken omvat.
    url: https://wetten.overheid.nl/BWBR0024096/2026-01-01#Artikel22bis.5.3
  - number: 22bis.6
    text: |-
      Met betrekking tot de financieringsovereenkomsten die zijn gesloten voor 1 juli 2014 is
      [artikel 22bis.2, onderdeel b en d][ref1], van deze leidraad niet van toepassing als de derde
      schriftelijk afstand heeft gedaan van zijn eigendoms- of zekerheidsrechten vóór het in het in
      [artikel 22bis, tweede lid, van de wet][ref2] bedoelde mededelingsplichtige voornemen.


      [ref1]: https://wetten.overheid.nl/BWBR0024096#Artikel22bis
      [ref2]: https://wetten.overheid.nl/BWBR0004770#Artikel22bis
