articles:
  - number: 22bis.1
    text: |-
      1 De verplichting tot mededeling, bedoeld in [artikel 22bis, tweede of derde lid van de wet][ref1], geldt behoudens
      de in de wet genoemde gevallen bovendien niet indien de derde of belastingschuldige geen ander voornemen in de
      zin van artikel 22bis, tweede of derde lid van de wet heeft dan het afvoeren van een bodemzaak van de bodem van de
      belastingschuldige en:

      A. de bodemzaak in reële eigendom toebehoort aan de derde en om die reden op grond van artikel 22.9.1 van deze
      leidraad van de toepassing van het bodemrecht is ontheven. Waar op grond van artikel 22.9.1, laatste alinea, van
      deze leidraad, het bodemrecht niettemin kan worden toegepast, geldt de mededelingsverplichting onverkort. De vorige
      volzin is niet van toepassing als de fiscale eigendom binnen drie maanden na de initiële machtsverschaffing aan de
      belastingschuldige is overgegaan naar de lessor. Of;

      B. 1°. ter zake van de verwerving van die bodemzaak volledige of nagenoeg volledige financiering door de
      derde is overeengekomen (aankoopfinanciering) waarbij ten behoeve van die derde een pandrecht als bedoeld in
      [artikel 3:237, eerste lid, van het Burgerlijk Wetboek][ref2] op de betreffende bodemzaak is gevestigd, indien is
      voldaan aan de volgende voorwaarden:

      a. de verpanding een individuele bodemzaak betreft;

      b. de initiële vordering ter zake waarvan het pandrecht geldt, de aankoopsom of nagenoeg de aankoopsom van de
      individuele bodemzaak betreft;

      c. ter zake van de afbetaling van bedoelde vordering ten tijde van de verpanding een vast aantal termijnen
      is overeengekomen waarvan het beloop overeenkomt of nagenoeg overeenkomt met de economische levensduur van de
      bodemzaak; en

      d. het pandrecht van de derde-aankoopfinancier ten tijde van de vestiging ervan aantoonbaar een eerste pandrecht
      betreft dat ook tegen andere zekerheidshouders kan worden geldend gemaakt.

      Of;

      2°. ter zake van de verwerving van die bodemzaak een financieringsvorm(aankoopfinanciering) is overeengekomen
      waardoor de juridische eigendom van die zaak ten tijde van het in het genoemde lid bedoelde handelen verblijft
      bij of is voorbehouden aan de derde. De onder 1° genoemde cumulatieve voorwaarden a tot en met c zijn van
      overeenkomstige toepassing.

      2 Voor ‘de individuele bodemzaak’, ‘een individuele bodemzaak’, ‘die zaak’, ‘de bodemzaak’ of ‘die bodemzaak’
      zoals genoemd in het eerste lid, onderdeel B, kan gelezen worden ‘het samenstel van bodemzaken die samen één zaak
      vormen’.

      3 Voor ‘individuele bodemzaak’, ‘zaak’ of ‘bodemzaak’ zoals genoemd in het eerste lid, onderdeel B, kan gelezen
      worden ‘verschillende bodemzaken die gezamenlijk en gelijktijdig verworven en geleverd of verpand worden’.


