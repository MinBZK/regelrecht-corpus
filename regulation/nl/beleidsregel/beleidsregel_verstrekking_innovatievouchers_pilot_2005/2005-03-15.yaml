preamble:
  text: |-
    Gelet op de artikelen 1 en 2 van de Subsidieregeling pilot innovatievouchers 2005 en artikel 4:81 van de Algemene
    wet bestuursrecht;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0018052/2005-03-15#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze beleidsregel wordt verstaan onder een samenwerkingsverband: een geen rechtspersoonlijkheid bezittend
      verband, bestaande uit tenminste twee, niet in een groep verbonden, ondernemers.
    url: https://wetten.overheid.nl/BWBR0018052/2005-03-15#Artikel1
  - number: '2'
    text: |-
      1 De minister verstrekt op aanvraag een innovatievoucher aan:

      a. een ondernemer, die een kleine of middelgrote onderneming in stand houdt in de zin van [verordening (EG) nr.
      70/2001](32001R0070) van de Commissie van de Europese Gemeenschappen van 12 januari 2001 betreffende de toepassing
      van de artikelen 87 en 88 van het EG-Verdrag op staatssteun voor kleine en middelgrote ondernemingen (PbEG L 10) en
      die een kennisoverdrachtsproject wil laten uitvoeren;

      b. ondernemers als bedoeld in onderdeel a die deelnemer zijn in een samenwerkingsverband, die gezamenlijk een
      kennisoverdrachtsproject willen laten uitvoeren.

      2 Per ondernemer kan één innovatievoucher worden verstrekt.

      3 Een aan een ondernemer als bedoeld in het eerste lid, onder b, verstrekte innovatievoucher is uitsluitend geldig
      in combinatie met innovatievouchers van de overige deelnemers in dat samenwerkingsverband. Indien een ondernemer
      als bedoeld in het eerste lid, onder b, niet meer deelneemt aan dat samenwerkingsverband vervalt de geldigheid van
      zijn innovatievoucher.

      4 Geen innovatievoucher wordt verstrekt aan een ondernemer:

      a. die een onderneming in stand houdt als bedoeld in artikel 1, onder a, van [verordening (EG) nr. 69/2001]
      (32001R0069) van de Commissie van de Europese Gemeenschappen van 12 januari 2001 betreffende de toepassing van de
      artikelen 87 en 88 van het EG-verdrag op de de minimis-steun (PbEG L 10);

      b. aan wie door een of meer bestuursorganen in de drie aan de aanvraag voorafgaande jaren reeds € 92 500 of meer
      aan subsidie is verstrekt zonder goedkeuring van de Commissie van de Europese Gemeenschappen;

      c. die failliet is verklaard, aan wie surséance van betaling is verleend, ten aanzien van wie de
      schuldsaneringsregeling natuurlijke personen van toepassing is verklaard, of voor wie een verzoek daartoe bij de
      rechtbank is ingediend;

      d. die deel uitmaakt van een groep, indien reeds op grond van deze beleidsregel een innovatievoucher is verstrekt
      aan een andere ondernemer die deel uitmaakt van dezelfde groep;

      e. die een innovatievoucher heeft gekregen op grond van de [Beleidsregel verstrekking innovatievouchers 2004][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017163
    url: https://wetten.overheid.nl/BWBR0018052/2005-03-15#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0017163
  - number: '3'
    text: |-
      1 De aanvraag wordt ingediend met gebruikmaking van een formulier, overeenkomstig het model dat is opgenomen in
      de bij deze beleidsregel behorende bijlage en gaat vergezeld van de bescheiden, overeenkomstig hetgeen in het
      formulier is vermeld.

      2 Ingeval van een samenwerkingsverband als bedoeld in [artikel 2, eerste lid, onder b][ref1], dient een der
      deelnemers in het samenwerkingsverband, mede namens de overige deelnemers, de aanvragen van alle deelnemers
      in dat samenwerkingsverband in en gaat de aanvraag vergezeld van bewijsstukken van het bestaan van dit
      samenwerkingsverband, overeenkomstig hetgeen in het formulier is vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0018052#Artikel2
    url: https://wetten.overheid.nl/BWBR0018052/2005-03-15#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0018052
        artikel: '2'
  - number: '4'
    text: |-
      1 In 2005 zijn:

      a. 300 innovatievouchers beschikbaar voor ondernemers als bedoeld in [artikel 2, eerste lid, onder a][ref1];

      b. 100 innovatievouchers beschikbaar voor ondernemers als bedoeld in [artikel 2, eerste lid, onder b][ref2].

      2 Aanvragen dienen uiterlijk 13 mei 2005 te zijn ontvangen door SenterNovem.

      3 De minister verdeelt de beschikbare innovatievouchers in de volgorde van ontvangst van de aanvragen, met dien
      verstande dat indien een aanvrager niet heeft voldaan aan enig voorschrift voor het in behandeling nemen van de
      aanvraag en met toepassing van [artikel 4:5 van de Algemene wet bestuursrecht][ref3] de gelegenheid heeft gehad de
      aanvraag aan te vullen, de dag waarop de aanvraag voldoet aan de voorschriften met betrekking tot de verdeling als
      datum van ontvangst geldt.

      4 Indien honorering van alle aanvragen die op één dag zijn ontvangen ertoe zou leiden dat het beschikbare aantal
      innovatievouchers zou worden overschreden, stelt de minister de onderlinge rangschikking van deze aanvragen vast
      door middel van loting. In het geval van aanvragen, ingediend op de in [artikel 3, tweede lid][ref4], aangegeven
      wijze, worden ten behoeve van de loting alle aanvragen van de deelnemers in één samenwerkingsverband geacht op
      hetzelfde moment te zijn ingediend.

      5 In het geval de aanvraag is ingediend op de in [artikel 3, tweede lid][ref5], aangegeven wijze en honorering
      van de aanvragen van alle deelnemers in dat samenwerkingsverband zou leiden tot overschrijding van het op grond
      van het eerste lid, onder b, beschikbare aantal innovatievouchers, worden de deelnemers in het desbetreffende
      samenwerkingsverband in de gelegenheid gesteld aan te geven of zij de hoeveelheid aanvragen zodanig wensen te
      verminderen, dat binnen het resterende aantal beschikbare innovatievouchers wordt gebleven, mits dit laatste
      aantal groter is dan één. Indien de deelnemers in het samenwerkingsverband van deze gelegenheid geen gebruik maken
      of indien het resterende aantal innovatievouchers één bedraagt, worden de aanvragen van alle deelnemers in dat
      samenwerkingsverband afgewezen.

      6 Indien na afloop van de termijn, genoemd in het tweede lid, blijkt dat niet alle innovatievouchers voor
      een categorie ondernemers, bedoeld in het eerste lid, onder a of b, zijn verstrekt, worden de resterende
      innovatievouchers toegevoegd aan het beschikbare aantal vouchers voor de andere categorie ondernemers. Zij
      zullen, op de wijze als in dit artikel bepaald, worden verdeeld onder de ondernemers die reeds een aanvraag om
      een innovatievoucher hadden ingediend, maar voor wie eerder, na toepassing van het eerste tot en met vijfde lid,
      onvoldoende vouchers beschikbaar waren.


