  - number: '5'
    text: |-
      1 De minister geeft een beschikking binnen vier weken na ontvangst van de aanvraag.

      2 In afwijking van het eerste lid kan de minister de beslissing op aanvragen van ondernemers voor wie na toepassing
      van [artikel 4, eerste tot en met vijfde lid][ref1], onvoldoende innovatievouchers beschikbaar waren, aanhouden in
      afwachting van de toepassing van [artikel 4, zesde lid][ref2].


