preamble:
  text: |-
    Gelet op de artikelen 25 en 29, zesde lid, van de Wet op het voortgezet onderwijs en artikel 4:81 van de Algemene
    wet bestuursrecht.

    Besluit:
  url: https://wetten.overheid.nl/BWBR0033513/2013-08-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze beleidsregel wordt verstaan onder:

      a. *school:* openbare of uit ’s Rijks kas bekostigde dagschool voor voortgezet onderwijs als bedoeld in de
      [artikelen 7][ref1], [8][ref2], en [10 van de Wet op het voortgezet onderwijs][ref3];

      b. *zeer zwakke school en zwakke school:* school waar een aangepast toezichtarrangement
      geldt zoals beschreven in het voor dat jaar geldende toezichtskader als bedoeld in
      [artikel 13, eerste lid, van de Wet op het onderwijstoezicht][ref4];

      c. *bevoegd gezag:* bevoegd gezag als bedoeld in [artikel 1 van de wet][ref5];

      d. *minister:* Minister van Onderwijs, Cultuur en Wetenschap;

      e. *wet:* [Wet op het voortgezet onderwijs][ref6];

      f. *Stichting DAMU:* de stichting Dans- en Muziekscholen;

      g. *DAMU-school:* school die een licentie van de minister heeft ontvangen, dat aan DAMU-leerlingen op grond van de
      regeling ontheffing kan worden verleend;

      h. *HBO-voortraject:* cursus aangeboden door een hogeschool, aan vo leerlingen, die voorafgaat aan een hbo-bachelor
      op het gebied van dansvakonderwijs of muziekvakonderwijs;

      i. *DAMU-licentie:* beschikking van de minister aan een bevoegd gezag van een school waarin een aanvraag als
      bedoeld in [artikel 3][ref7] wordt ingewilligd;

      j. *DAMU-leerling:* leerling die is toegelaten tot het HBO-voortraject en daardoor wordt beschouwd als toptalent op
      het gebied van dans of muziek.


