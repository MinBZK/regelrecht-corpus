        bwb_id: BWBR0033513
        artikel: '5'
  - number: '7'
    text: |-
      Indien de DAMU-leerling niet langer deelneemt aan het HBO-voortraject en daardoor niet langer kan worden beschouwd
      als een DAMU-leerling, dient de desbetreffende leerling vanaf dat moment aan het reguliere onderwijsprogramma
      deel te nemen. Een reeds geëffectueerde ontheffing op grond van [artikel 9 tot en met 13][ref1] blijft van kracht,
      evenals een reeds lopende spreiding van het examen op grond van [artikel 14][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0033513#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0033513#Artikel14
    url: https://wetten.overheid.nl/BWBR0033513/2013-08-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0033513
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0033513
        artikel: '14'
  - number: '8'
    text: |-
      Indien de DAMU-licentie niet wordt verlengd, behouden de betrokken leerlingen de onder de oorspronkelijke
      DAMU-licentie verkregen mogelijkheden aan die school. Indien dit niet mogelijk is, is de school verplicht een
      alternatief te verzorgen.
    url: https://wetten.overheid.nl/BWBR0033513/2013-08-01#Artikel8
  - number: '9'
    text: |-
      1 Het bevoegd gezag dat beschikt over een DAMU-licentie kan voor DAMU-leerlingen afwijken van de normen voor
      onderwijstijd als gesteld in [artikel 6g van de WVO][ref1].

      2 Het bevoegd gezag, bedoeld in het eerste lid, richt in het eerste en tweede leerjaar van het vmbo, havo en vwo
      een onderwijsprogramma in dat per leerjaar ten minste 800 klokuren onderwijstijd omvat.

      3 Het bevoegd gezag, bedoeld in het eerste lid, richt in het derde leerjaar vmbo, derde, vierde leerjaar havo
      en het derde, vierde en vijfde leerjaar vwo een onderwijsprogramma in dat per leerjaar ten minste 800 klokuren
      onderwijstijd omvat.

      4 In afwijking van [artikel 6g, eerste lid, van de wet][ref2] richt het bevoegd gezag voor DAMU-leerlingen in het
      vierde leerjaar vmbo, het vijfde leerjaar havo en het zesde leerjaar vwo een onderwijsprogramma in dat ten minste
      500 klokuren onderwijstijd omvat.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel6g
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel6g
    url: https://wetten.overheid.nl/BWBR0033513/2013-08-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 6g
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 6g
  - number: '10'
    text: |-
      Het bevoegd gezag dat beschikt over een DAMU-licentie kan in afwijking van
      [artikel 11c, eerste lid, onder a, van de wet][ref1] de DAMU-leerling in de eerste twee leerjaren, ontheffing
      verlenen van de onderdelen van het onderwijsprogramma die betrekking hebben op de kerndoelen bewegen en sport,
      bedoeld in [bijlage 1, onderdeel G, bij het Besluit kerndoelen onderbouw VO](onbekend), onder voorwaarde dat de
      school zorg draagt voor een alternatieve adequate begeleiding op het gebied van de gezondheidsaspecten van beweging
      en houding in relatie tot het voortraject dansvakonderwijs of muziekvakonderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel11c
    url: https://wetten.overheid.nl/BWBR0033513/2013-08-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 11c
  - number: '11'
    text: |-
      Het bevoegd gezag dat beschikt over een DAMU-licentie kan afwijken van de bepalingen in
      de [artikelen 10, vijfde en zevende lid, van de wet][ref1] en van de bepalingen in de
      [artikelen 22, eerste lid, van het Eindexamenbesluit][ref2], door een DAMU-leerling, die de theoretische leerweg in
      het vmbo volgt, ontheffing te verlenen voor:

        - maatschappijleer en lichamelijke opvoeding.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0004593#Artikel22
    url: https://wetten.overheid.nl/BWBR0033513/2013-08-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0004593
        artikel: '22'
  - number: '12'
    text: |-
      Het bevoegd gezag dat beschikt over een DAMU-licentie kan, in afwijking van [artikel 14][ref1]
      en [artikel 6d van de wet][ref2], [artikel 26c van het Inrichtingsbesluit WVO][ref3] en
      [artikel 13, eerste lid, van het Eindexamenbesluit][ref4] een DAMU-leerling in het havo ontheffing verlenen voor:

        - lichamelijke opvoeding;
        - maatschappijleer en culturele en kunstzinnige vorming (CKV);
        - het keuzevak, bedoeld in [artikel 13, eerste lid, onder c, van het Eindexamenbesluit VO][ref5] of het
      profielkeuzevak, bedoeld in artikel 13, eerste lid, onder b, van het Eindexamenbesluit VO.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel6d
