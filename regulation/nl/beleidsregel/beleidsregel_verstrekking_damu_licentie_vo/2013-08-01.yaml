        bwb_id: BWBR0033513
        artikel: '4'
  - number: '4'
    text: |-
      De aanvraag gaat vergezeld van de volgende documenten:

      1. een verklaring van de VO-school dat op de administratie van de desbetreffende VO-school een door de hogeschool
      goedgekeurde lijst met de namen en adressen van de DAMU-leerlingen die toegelaten zijn tot het HBO-voortraject voor
      het huidige jaar aanwezig is;

      2. het schoolplan, met daarin een beleidsnotitie waaruit blijkt op welke wijze de school waar nodig zorg draagt
      voor flexibiliteit in de lesprogramma’s en voor flexibiliteit bij het afleggen van toetsen en examens, en hoe de
      specifieke kunstvakken worden ingevuld rekening houdend met de belangen van de betrokken DAMU-leerling;

      3. een schriftelijke steunverklaring van de HBO-raad voor de aanvraag van een DAMU-licentie.
    url: https://wetten.overheid.nl/BWBR0033513/2013-08-01#Artikel4
  - number: '5'
    text: |-
      De school, waarvoor het bevoegd gezag een aanvraag als bedoeld in [artikel 4][ref1] heeft ingediend, voldoet aan de
      volgende voorwaarden:

      a. op de school zijn ten minste 15 DAMU-leerlingen ingeschreven;

      b. op de school met de DAMU-licentie is onderwijzend personeel aanwezig en aanspreekbaar op de afstemming van de
      werkzaamheden die verband houden met de DAMU-licentie en dat voorziet in de begeleiding van de DAMU-leerlingen.


      [ref1]: https://wetten.overheid.nl/BWBR0033513#Artikel4
    url: https://wetten.overheid.nl/BWBR0033513/2013-08-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0033513
        artikel: '4'
  - number: '6'
    text: |-
      1 Het bevoegd gezag van een school die over een DAMU-licentie beschikt, kan een verzoek tot verlenging indienen.

      2 Een verzoek tot verlenging van de DAMU-licentie dient uiterlijk 1 oktober van het kalenderjaar, voorafgaande aan
      het kalenderjaar waarin de licentie expireert te worden ingediend.

      3 Op de verlenging van de DAMU-licentie zijn de [artikelen 3][ref1], [4][ref2] en [5][ref3] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0033513#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0033513#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0033513#Artikel5
    url: https://wetten.overheid.nl/BWBR0033513/2013-08-01#Artikel6
    references:
