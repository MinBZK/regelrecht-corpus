  - number: '15'
    text: |-
      1 Voor een school die voorafgaand aan deze beleidsregel al beschikt over een gelijkwaardige licentie op grond van
      één van de Raamregelingen genoemd in [artikel 17][ref1], kan deze gebruiken tot en met 31 juli 2014, daarna komt
      deze te vervallen.

      2 Een school als bedoeld in het eerste lid dient voor 1 oktober 2013 een aanvraag in te dienen, met dien verstande
      dat deze aanvraag wordt beschouwd als verlenging als bedoeld in [artikel 6][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0033513#Artikel17
