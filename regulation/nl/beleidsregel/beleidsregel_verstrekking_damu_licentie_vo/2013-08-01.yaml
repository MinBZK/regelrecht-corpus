        artikel: '3'
  - number: '2'
    text: |-
      Het doel van deze regeling is om een DAMU-leerling in staat te stellen gedurende het vo-onderwijs deel te nemen aan
      een HBO-voortraject, met verlichting van een dubbele studielast en integratie van regulier en kunstonderwijs daar
      waar mogelijk.
    url: https://wetten.overheid.nl/BWBR0033513/2013-08-01#Artikel2
  - number: '3'
    text: |-
      1 De minister kan op grond van een aanvraag van het bevoegd gezag van een school een DAMU-licentie verstrekken voor
      een periode van vier schooljaren.

      2 Een aanvraag voor een DAMU-licentie wordt ingediend bij de minister.

      3 Het aantal scholen met een DAMU-licentie bedraagt niet meer dan 12.

      4 Aanvragen voor een nieuwe DAMU-licentie worden op volgorde van binnenkomst behandeld, met dien verstande, dat
      wanneer de aanvrager krachtens [artikel 4:5 van de Algemene wet bestuursrecht][ref1] de gelegenheid heeft gehad de
      aanvraag aan te vullen, de dag waarop de aanvulling door de minister is ontvangen, als datum van binnenkomst geldt.

      5 Aanvragen voor verlenging van eerdere licenties hebben voorrang boven aanvragen voor een nieuwe licentie.

      6 Een aanvraag van het bevoegd gezag van een school dient te voldoen aan het gestelde in [artikel 4][ref2].

      7 Zeer zwakke en zwakke scholen komen niet in aanmerking voor een DAMU-licentie.

      8 De aanvraag voor een DAMU-licentie dient uiterlijk 1 oktober van een jaar te zijn ontvangen.

      9 De minister kan aan de Stichting DAMU advies vragen over de aanvraag.

      10 De Stichting DAMU geeft dan uiterlijk 1 december van het betreffende jaar advies.

      11 De minister besluit over het verstrekken van een DAMU-licentie uiterlijk 1 februari van het aansluitende jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0033513#Artikel4
    url: https://wetten.overheid.nl/BWBR0033513/2013-08-01#Artikel3
    references:
