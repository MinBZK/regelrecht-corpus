  - number: '14'
    text: |-
      1 In uitzonderlijke gevallen kan het bevoegd gezag, dat beschikt over een DAMU-licentie, voor een DAMU-leerling
      beroep doen op [artikel 59 van het Eindexamenbesluit][ref1].

      2 Alleen een DAMU-leerling die in het laatste leerjaar wordt geconfronteerd met activiteiten in het kader van
      uitoefening van de dans of muziek, waardoor buiten de wil om van de DAMU-leerling, het niet mogelijk is het
      eindexamen in het laatste schooljaar volledig af te leggen, komt hiervoor in aanmerking.


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel59
