  - number: '13'
    text: |-
      Het bevoegd gezag dat beschikt over een DAMU-licentie kan, in afwijking van [artikel 13][ref1]
      en [artikel 6d van de wet][ref2], [artikel 26b van het Inrichtingsbesluit WVO][ref3] en
      [artikel 11, eerste lid][ref4], dan wel [artikel 12, eerste lid, van het Eindexamenbesluit VO][ref5] een DAMU-
      leerling in het vwo ontheffing verlenen voor:

        - lichamelijke opvoeding;
        - maatschappijleer, algemene natuurwetenschappen en culturele en kunstzinnige vorming;
        - het keuzevak, bedoeld in [artikel 11, eerste lid, onder c][ref6], dan wel het keuzevak, bedoeld in
      [artikel 12, eerste lid, onder c, van het Eindexamenbesluit VO][ref7] of het profielkeuzevak, bedoeld in artikel
      11, eerste lid, onder b, dan wel het profielkeuzevak, bedoeld in artikel 12, eerste lid, onder b, van het
      Eindexamenbesluit VO.


