preamble:
  text: |-
    Gelet op de artikelen 1 en 2 van de Subsidieregeling pilot innovatievouchers 2004 en artikel 4:81 van de Algemene
    wet bestuursrecht;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0017163/2004-09-17#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 De minister verstrekt op aanvraag een innovatievoucher aan een ondernemer, die een kleine of middelgrote
      onderneming in stand houdt in de zin van [verordening (EG) nr. 70/2001](32001R0070) van de Commissie van de
      Europese Gemeenschappen van 12 januari 2001 betreffende de toepassing van de artikelen 87 en 88 van het EG-Verdrag
      op staatssteun voor kleine en middelgrote ondernemingen (PbEG L 10) en die een kennisoverdrachtsproject als bedoeld
      in de Subsidieregeling pilot innovatievouchers 2004 wil laten uitvoeren.

      2 Per ondernemer kan één innovatievoucher worden verstrekt.

      3 Geen innovatievoucher wordt verstrekt aan een ondernemer:

      a. die een onderneming in stand houdt als bedoeld in artikel 1, onder a, van [verordening (EG) nr. 69/2001]
      (32001R0069) van de Commissie van de Europese Gemeenschappen van 12 januari 2001 betref-fende de toepassing van de
      artikelen 87 en 88 van het EG-verdrag op de de minimis-steun (PbEG L 10);

      b. aan wie door een of meer bestuursorganen in de drie aan de aanvraag voorafgaande jaren reeds € 92 500 of meer
      aan subsidie is verstrekt zonder goedkeuring van de Commissie van de Europese Gemeenschappen;

      c. die failliet is verklaard, aan wie surséance van betaling is verleend, ten aanzien van wie de
      schuldsaneringsregeling natuurlijke personen van toepassing is verklaard, of voor wie een verzoek daartoe bij de
      rechtbank is ingediend.
    url: https://wetten.overheid.nl/BWBR0017163/2004-09-17#Artikel1
  - number: '2'
    text: |-
      De aanvraag wordt ingediend met gebruikmaking van een formulier, overeenkomstig het model dat is opgenomen in
      de bij deze beleidsregel behorende bijlage en gaat vergezeld van de bescheiden, overeenkomstig hetgeen in het
      formulier is vermeld.
    url: https://wetten.overheid.nl/BWBR0017163/2004-09-17#Artikel2
  - number: '3'
    text: |-
      1 In 2004 zijn 100 innovatievouchers beschikbaar.

      2 Aanvragen dienen uiterlijk 15 december 2004 te zijn ontvangen door SenterNovem.

      3 De minister verdeelt de beschikbare innovatievouchers in de volgorde van ontvangst van de aanvragen, met dien
      verstande dat indien een aanvrager niet heeft voldaan aan enig voorschrift voor het in behandeling nemen van de
      aanvraag en met toepassing van [artikel 4:5 van de Algemene wet bestuursrecht][ref1] de gelegenheid heeft gehad de
      aanvraag aan te vullen, de dag waarop de aanvraag voldoet aan de voorschriften met betrekking tot de verdeling als
      datum van ontvangst geldt.

      4 Indien honorering van alle aanvragen die op één dag zijn ontvangen ertoe zou leiden dat het beschikbare aantal
      van 100 innovatievouchers zou worden overschreden, stelt de minister de onderlinge rangschikking van deze aanvragen
      vast door middel van loting.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel45
    url: https://wetten.overheid.nl/BWBR0017163/2004-09-17#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:5
  - number: '4'
    text: De minister geeft een beschikking binnen vier weken na ontvangst van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0017163/2004-09-17#Artikel4
  - number: '5'
    text: Een in 2004 verstrekt innovatievoucher kan alleen in 2004 bij een kennisinstelling worden ingeleverd.
    url: https://wetten.overheid.nl/BWBR0017163/2004-09-17#Artikel5
  - number: '6'
    text: |-
      Deze beleidsregel treedt in werking met ingang van de datum van inwerkingtreding van de
      [Subsidieregeling pilot innovatievouchers 2004][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017162
