  - number: '1'
    text: |-
      Het [Voorschrift Algemene wet bestuursrecht 1997][ref1] en de [Leidraad Invordering 1990][ref2]
      zijn van overeenkomstige toepassing op de heffing en invordering van de heffingen van
      [Hoofdstuk IV van de Meststoffenwet][ref3] waarvan de heffing en invordering aan het Bureau Heffingen zijn
      opgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0008847
      [ref2]: https://wetten.overheid.nl/BWBR0004800
      [ref3]: https://wetten.overheid.nl/BWBR0004054#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0015976/2004-10-23#Artikel1
