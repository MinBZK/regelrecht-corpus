  - number: '3'
    text: |-
      Voor de toepassing van dit besluit wordt, in afwijking van
      [paragraaf 1.7, onderdeel 2, van het Voorschrift Algemene wet bestuursrecht 1997][ref1],
      de aangifte voorzover deze als een verzoek om verrekening als bedoeld in
      [artikel 43, vijfde lid, van de Meststoffenwet][ref2], wordt aangemerkt, beschouwd als een aanvraag in de zin van
      [artikel 1:3, derde lid, van de Algemene wet bestuursrecht][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0008847#Artikel1.7
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel43
