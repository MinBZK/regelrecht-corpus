  - number: '4'
    text: |-
      Voor de toepassing van dit besluit wordt [paragraaf 2.1 van het Voorschrift Algemene wet bestuursrecht 1997][ref1]
      als volgt gelezen:

      De [Awb][ref2] is van toepassing op besluiten van bestuursorganen. De inspecteur, de ontvanger, de directeur
      Financieel-economische Zaken van het Ministerie van LNV en de Minister van LNV zijn bestuursorgaan in de zin van de
      [Awb][ref3]. Organen van de rechterlijke macht en de wetgevende macht zijn geen bestuursorgaan.

      In [artikel 3, derde lid, van de Regeling uitvoering heffingen en verrekening Meststoffenwet][ref4] (Regeling van
      19 december 1997, Stcrt. 247) is de directeur van het Bureau Heffingen aangewezen als inspecteur en ontvanger van
      het bureau. Omdat de bevoegdheidsuitoefening binnen het Bureau Heffingen veelal plaatsvindt in mandaat, wijst de
      directeur ambtenaren van het Bureau Heffingen aan die namens hem de bevoegdheid van inspecteur onderscheidenlijk
      ontvanger uitoefenen. Dit is vastgelegd in mandaatbesluiten. Deze vermelden de ambtenaren die bevoegd zijn namens
      de inspecteur besluiten te nemen en die bevoegd zijn namens de ontvanger besluiten te nemen. Aan dezelfde ambtenaar
      wordt geen algemeen mandaat verleend voor de bevoegdheden van zowel de inspecteur als de ontvanger. Wel is het
      mogelijk dat voor een bepaald geval hierop een uitzondering wordt gemaakt door middel van het verlenen van een
      bijzonder mandaat.


      [ref1]: https://wetten.overheid.nl/BWBR0008847#Artikel2.1
      [ref2]: https://wetten.overheid.nl/BWBR0005537
      [ref3]: https://wetten.overheid.nl/BWBR0005537
