        hoofdstuk: IV
  - number: '2'
    text: |-
      Voor de toepassing van dit besluit wordt in het [Voorschrift Algemene wet bestuursrecht 1997][ref1] en de
      [Leidraad Invordering 1990][ref2] verstaan onder:

      a. minister: de Minister van Landbouw, Natuur en Voedselkwaliteit;

      b. staatssecretaris: de Minister van Landbouw, Natuur en Voedselkwaliteit;

      c. Belastingdienst: Bureau Heffingen;

      d. fiscus: Bureau Heffingen;

      e. regeling: [Regeling uitvoering heffingen en verrekening Meststoffenwet][ref3];

      f. directeur: de directeur Financieel-Economische Zaken van het Ministerie van Landbouw, Natuur en
      Voedselkwaliteit, bedoeld in [artikel 3 van de Regeling uitvoering heffingen en verrekening Meststoffenwet][ref4],
      met inbegrip van de ambtenaren aan wie ter zake van de bevoegdheid van de directeur mandaat is verleend
      door die directeur, en voor de toepassing van [artikel 26 Invorderingswet 1990][ref5] de directeur
      Financieel-Economische Zaken van het Ministerie van Landbouw, Natuur en Voedselkwaliteit, bedoeld in
      [artikel 28, tweede lid, onderdeel f, van de Uitvoeringsregeling Invorderingswet 1990][ref6];

      g. het Infobulletin van de FIOD: de Staatscourant;

      h. FIOD: AID;

      i. aanslagbiljet: naheffingsaanslag, tenzij uit de context anders blijkt;

      j. bedrijf: bedrijf als bedoeld in [artikel 1, aanhef, onderdeel j, van de Meststoffenwet][ref7];

      k. belastingaanslag: naheffingsaanslag, tenzij uit de context anders blijkt;

      l. belastingschuldige: degene op wiens naam het aanslagbiljet (mede) is gesteld;

      m. heffingen: de heffingen, bedoeld in [hoofdstuk IV van de Meststoffenwet][ref8], die van rijkswege door de
      minister worden geheven op grond van [artikel 41, eerste lid, van de Meststoffenwet][ref9];

      n. inspecteur: de inspecteur van het Bureau Heffingen, bedoeld in [artikel 42 van de Meststoffenwet][ref10] en
      [artikel 3 van de regeling][ref11], met inbegrip van de ambtenaren aan wie ter zake van de bevoegdheden van de
      inspecteur mandaat is verleend door de minister of door de inspecteur;

      o. ontvanger: de ontvanger van het Bureau Heffingen, bedoeld in [artikel 42 van de Meststoffenwet][ref12] en
      [artikel 3 van de regeling][ref13];

      p. ministerie, directoraat-generaal Belastingdienst, team Juridische Zaken: directeur;

      q. Voorschrift Awb 1997: de beleidsregels, bedoeld in [paragraaf 2][ref14], van dit besluit, tenzij uit de context
      anders blijkt.


