  - number: '5'
    text: |-
      Bij de toepassing van dit besluit blijft de laatste volzin van [paragraaf 5.5.5 van het Voorschrift Algemene wet
      bestuursrecht 1997](onbekend) buiten toepassing.
    url: https://wetten.overheid.nl/BWBR0015976/2004-10-23#Artikel5
  - number: 5a
    text: |-
      De ontvanger is te allen tijde belast met de leiding van de invordering waarover
      [paragraaf 1, achtste lid, van de Leidraad Invordering 1990][ref1] handelt, ook in de fase van de dwanginvordering.


      [ref1]: https://wetten.overheid.nl/BWBR0004800#Artikel1
    url: https://wetten.overheid.nl/BWBR0015976/2004-10-23#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0004800
        artikel: '1'
  - number: 5b
    text: |-
      Het conservatoir beslag en de versnelde invordering waarover
      [hoofdstuk I, artikel 3, paragraaf 2, eerste lid, van de Leidraad Invordering 1990][ref1] handelt, worden
      uitgevoerd door de Belastingdienst vanaf het moment van terhandstelling van het dwangbevel door de ontvanger aan
      de ontvanger van de Belastingdienst. Voorafgaand aan de dwanginvorderingsfase kunnen handelingen ten behoeve van
      conservatoir beslag en versnelde invordering plaatsvinden.


      [ref1]: https://wetten.overheid.nl/BWBR0004800#Artikel3
    url: https://wetten.overheid.nl/BWBR0015976/2004-10-23#Artikel5b
    references:
      - id: ref1
        bwb_id: BWBR0004800
        artikel: '3'
  - number: 5c
    text: |-
      Met betrekking tot de relatieve competentie waarover
      [hoofdstuk I, artikel 5, paragraaf 1, van de Leidraad Invordering 1990][ref1] handelt, zijn voor de toepassing van
      de Invorderingswet in het kader van de heffingen, nadere regels gesteld in de regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0004800#Artikel5
    url: https://wetten.overheid.nl/BWBR0015976/2004-10-23#Artikel5c
    references:
      - id: ref1
        bwb_id: BWBR0004800
        artikel: '5'
  - number: 5d
    text: |-
      Verrekening van verschuldigde bedragen waarover
      [hoofdstuk IV, artikel 24, paragraaf 1, vierde lid, van de Leidraad Invordering 1990][ref1] handelt, vindt niet
      plaats tussen verschuldigde bedragen aan heffingen en door de inspecteur van het Bureau Heffingen opgelegde
      bestuurlijke boeten met belastingschulden uit hoofde van de rijksbelastingen.


      [ref1]: https://wetten.overheid.nl/BWBR0004800#Artikel24
    url: https://wetten.overheid.nl/BWBR0015976/2004-10-23#Artikel5d
    references:
      - id: ref1
        bwb_id: BWBR0004800
        artikel: '24'
  - number: 5e
    text: |-
      1 Naast de in [hoofdstuk IV, artikel 25, paragraaf 1, tweede lid, van de Leidraad Invordering 1990][ref1] genoemde
      redenen om een verzoek tot uitstel van betaling in te dienen, kunnen ook bezwaren tegen een op grond van de
      [Meststoffenwet][ref2] door de inspecteur of ontvanger genomen beschikking leiden tot een verzoek tot uitstel van
      betaling. Het beleid is daarop zoveel mogelijk van overeenkomstige toepassing.

      Uitstel van betaling vindt uitsluitend plaats voor het bedrag van een aan de belastingschuldige
      opgelegde belastingaanslag, of een gedeelte daarvan. In de uitvoering van de heffingen, geregeld in
      [hoofdstuk IV van de Meststoffenwet][ref3] kan dit alleen een naheffingsaanslag zijn. Geen uitstel wordt
      verleend voor verschuldigde heffing die op aangifte moet worden voldaan. Wanneer de belastingschuldige
      zijn verzoek om uitstel van betaling bij de ontvanger indient binnen veertien dagen na dagtekening van
      de naheffingsaanslag en het verzoek door de ontvanger wordt gehonoreerd, kan de inspecteur de bij de
      naheffingsaanslag opgelegde bestuurlijke boete ingeval van verzachtende omstandigheden matigen op grond van
      [artikel 29 Beleidsregels bestuurlijke boeten Bureau Heffingen 1999][ref4].

      2 Een verzoek om uitstel van betaling wordt afgewezen op grond van de in
      [hoofdstuk IV, artikel 25, paragraaf 1, zesde lid, van de Leidraad Invordering 1990][ref5] genoemde gronden of
      ingeval niet tijdig aangifte is gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0004800#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0004054
      [ref3]: https://wetten.overheid.nl/BWBR0004054#HoofdstukIV
      [ref4]: https://wetten.overheid.nl/BWBR0010788#Artikel29
