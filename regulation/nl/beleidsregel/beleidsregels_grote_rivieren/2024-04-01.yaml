  - number: '3'
    text: |-
      1 In het rivierbed wordt, onverminderd het bepaalde in [artikel 7, eerste lid][ref1], toestemming gegeven voor:

      a. een eenmalige uitbreiding van ten hoogste tien procent van de bestaande bebouwing;

      b. het slopen en vervangen van bebouwing door bebouwing van gelijke omvang;

      c. tijdelijke activiteiten, anders dan evenementen die niet langer duren dan drie maanden, en

      d. overige activiteiten die naar aard en omvang vergelijkbaar zijn met activiteiten van ondergeschikt belang.

      2 Activiteiten van ondergeschikt belang als bedoeld in het eerste lid, onderdeel d, zijn:

      a. het voor een periode van ten hoogste zes maanden plaatsen en opslaan van bouwwerken, bouwborden, materiaal en
      materieel om een werk of onderhoud te kunnen uitvoeren in, op, boven, over of onder een oppervlaktewaterlichaam of
      een bijbehorend kunstwerk;

      b. evenementen die niet langer duren dan drie maanden;

      c. het plaatsen van een in- of uitstroomvoorziening, mits de in- of uitstroomsnelheid maximaal 0,3 m/s bedraagt;

      d. het plaatsen van een steiger, vlonder of aanmeervoorziening, inclusief de bijbehorende voorzieningen, voor zover
      deze gelegen zijn buiten de vaarweg en bestemd zijn voor niet-bedrijfsmatig gebruik, dan wel naar aard en omvang
      vergelijkbaar overig gebruik;

      e. het plaatsen van informatieborden, informatiezuilen, reclameborden, reclamezuilen, sport- en speeltoestellen,
      gedenktekens, kunstobjecten, vlaggenmasten, tuin- en straatmeubilair of in aard en omvang hiermee vergelijkbare
      objecten, waarvoor geen of een beperkte fundering vereist is;

      f. terreinophogingen van minder dan 50 m3 per kadastraal perceel;

      g. het plaatsen van visfuiken of visnetten;

      h. het uitvoeren van onderhoud en vervanging van bestaande objecten door objecten van vergelijkbare aard en omvang
      en op dezelfde locatie;

      i. het gelijkvloers op het maaiveldniveau aanbrengen van verhardingen en recreatieve voorzieningen, niet zijnde
      een bouwwerk;

      j. het plaatsen van kabels en leidingen mits:

      1° deze geen intrinsiek gevaarlijke stoffen transporteren;

      2° deze niet liggen, parallel of als kruising, in de veiligheidszone van een primaire of secundaire waterkering,
      een kunstwerk of een vaarweg, of

      3° deze niet aangelegd worden middels boring, waarbij lagen met verschillende stijghoogtes worden doorkruist;

      k. onderzoeken die niet langer duren dan zes maanden, en

      l. andere activiteiten die vanwege de aard, beperkte omvang of korte duur naar het oordeel van de beheerder geen
      nadelige invloed hebben op het waterstaatkundige beheer.


      [ref1]: https://wetten.overheid.nl/BWBR0020040#Artikel7
