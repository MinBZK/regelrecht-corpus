  - number: '4'
    text: |-
      Voor activiteiten in het gedeelte van het rivierbed waarop het bergend regime van toepassing is, wordt,
      onverminderd het bepaalde in [artikel 7, eerste en tweede lid][ref1], toestemming gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0020040#Artikel7
    url: https://wetten.overheid.nl/BWBR0020040/2024-04-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0020040
        artikel: '7'
  - number: '5'
    text: |-
      Voor de navolgende riviergebonden activiteiten in het gedeelte van het rivierbed waarop het stroomvoerend regime
      van toepassing is, wordt, onverminderd het bepaalde in [artikel 7, eerste en tweede lid][ref1], toestemming
      gegeven:

      a. de aanleg of wijziging van waterstaatkundige kunstwerken;

      b. de realisatie van voorzieningen voor een betere en veilige afwikkeling van de beroeps- en recreatievaart;

      c. de bouw of wijziging van waterkrachtcentrales;

      d. de vestiging of uitbreiding van overslagbedrijven of het realiseren van overslagfaciliteiten, uitsluitend voor
      zover de activiteit gekoppeld is aan het vervoer over de rivier;

      e. de aanleg of wijziging van scheepswerven en specifiek daaraan verbonden bedrijfsactiviteiten;

      f. de realisatie of verbetering van natuur;

      g. de verbetering van de waterkwaliteit;

      h. de uitbreiding of wijziging van bestaande steenfabrieken;

      i. de realisatie van voorzieningen die onlosmakelijk met de waterrecreatie of extensieve uiterwaardrecreatie zijn
      verbonden;

      j. de winning van oppervlaktedelfstoffen;

      k. de realisatie van voorzieningen die noodzakelijk zijn voor het agrarisch, landschappelijk of daarmee
      vergelijkbaar beheer van het rivierbed;

      l. het behoud of herstel van cultuurhistorische landschapselementen; of

      m. de realisatie van voorzieningen die noodzakelijk zijn voor het behoud van bekende of te verwachten
      archeologische monumenten.


      [ref1]: https://wetten.overheid.nl/BWBR0020040#Artikel7
    url: https://wetten.overheid.nl/BWBR0020040/2024-04-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0020040
        artikel: '7'
  - number: '6'
    text: |-
      Voor niet-riviergebonden activiteiten in het gedeelte van het rivierbed waarop het stroomvoerend regime van
      toepassing is, wordt geen toestemming gegeven, tenzij, onverminderd het bepaalde in [artikel 7][ref1], sprake
      is van:

      a. een groot openbaar belang en de activiteit niet redelijkerwijs buiten het rivierbed kan worden gerealiseerd;

      b. een zwaarwegend bedrijfseconomisch belang voor bestaande grondgebonden agrarische bedrijven en de activiteit
      redelijkerwijs niet buiten het rivierbed kan worden gerealiseerd;

      c. verduurzaming van de energievoorziening van bestaande activiteiten in het rivierbed; of

      d. opwekking van zonne- of windenergie en de activiteit niet redelijkerwijs buiten het rivierbed kan worden
      gerealiseerd.


      [ref1]: https://wetten.overheid.nl/BWBR0020040#Artikel7
    url: https://wetten.overheid.nl/BWBR0020040/2024-04-01#Artikel6
