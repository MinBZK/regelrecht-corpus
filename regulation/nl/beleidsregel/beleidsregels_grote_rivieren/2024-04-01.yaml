    text: |-
      1 De [artikelen 3 tot en met 7][ref1] zijn van toepassing op de waterstaatswerken in beheer bij het Rijk, voor
      zover aangegeven in bijlage 1 bij deze beleidsregels.

      2 De [artikelen 3 tot en met 7][ref2] zijn niet van toepassing op de in [bijlage 2][ref3] bij deze beleidsregels
      aangewezen activiteiten of locaties.


