articles:
  - number: '1'
    text: |-
      1 In deze beleidsregels wordt verstaan onder:

      a. toestemming: de toelaatbaarheid vanuit rivierkundig opzicht bezien, nodig voor het verkrijgen van een vergunning
      als bedoeld in [artikel 6.17 van het Besluit activiteiten leefomgeving][ref1];

      b. rivierbed: de oppervlakte begrensd ingevolge [artikel 2.13 van de Omgevingsregeling][ref2];

      c. bergend regime: het afwegingskader dat geldt op het gedeelte van het rivierbed aangegeven in bijlage 1 bij deze
      beleidsregels;

      d. stroomvoerend regime: het afwegingskader dat geldt op het gedeelte van het rivierbed aangegeven in bijlage 1 bij
      deze beleidsregels.

      2 Maatregelen, ingrepen, bouwen en soortgelijke begrippen worden voor de toepassing van deze beleidsregels als
      activiteit aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0041330#Artikel6.17
      [ref2]: https://wetten.overheid.nl/BWBR0045528#Artikel2.13
