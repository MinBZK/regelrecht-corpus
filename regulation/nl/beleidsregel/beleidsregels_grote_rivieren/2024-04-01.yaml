        artikel: '7'
  - number: '7'
    text: |-
      1 De toestemming, bedoeld in [artikel 3][ref1], wordt alleen gegeven indien:

      a. er sprake is van een zodanige situering en uitvoering van de activiteit dat het veilig functioneren van het
      waterstaatswerk gewaarborgd blijft;

      b. er geen sprake is van een feitelijke belemmering voor vergroting van de afvoercapaciteit, en

      c. er sprake is van een zodanige situering en uitvoering van de activiteit dat de waterstandsverhoging of de afname
      van het bergend vermogen zo gering mogelijk is.

      2 Het eerste lid is van overeenkomstige toepassing voor het geven van de toestemming, bedoeld in de
      [artikelen 4][ref2], [5][ref3] en [6, aanhef en de onderdelen a, b en c][ref4], met dien verstande dat de
      resterende waterstandseffecten of de afname van het bergend vermogen duurzaam worden gecompenseerd waarbij de
      financiering en de tijdige realisering van de maatregelen gezekerd zijn.

      3 Het eerste lid is van overeenkomstige toepassing voor het geven van de toestemming, bedoeld in
      [artikel 6, aanhef en onderdeel d][ref5], met dien verstande dat de vergunning zal worden verleend voor een
      bepaalde termijn en dat de resterende waterstandseffecten of de afname van het bergend vermogen ten minste voor
      de duur van die termijn duurzaam worden gecompenseerd waarbij de financiering en de tijdige realisering van de
      maatregelen gezekerd zijn.


