  - number: '8'
    text: De Beleidslijn ruimte voor de rivier (Stcrt. 1997, 87, p. 6) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0020040/2024-04-01#Artikel8
  - number: '9'
    text: |-
      Ten aanzien van een vergunning als bedoeld in [artikel 6.12 van het Waterbesluit][ref1] die vóór 1 juli 2018 in
      werking en onherroepelijk is en waaraan een toestemming als bedoeld in [artikel 3, aanhef en onderdeel b][ref2],
      ten grondslag ligt, blijft artikel 3, onderdeel b, van deze beleidsregels zoals dat luidde vóór 1 juli 2018 van
      toepassing voor wijzigingen van die vergunning.


