  - number: '2'
    text: |-
      1 Een aanvrager wordt aangewezen als organisatie die de belangen van de automobielbranche behartigt, indien de
      aanvrager voldoet aan de in het tweede, derde en vierde lid genoemde eisen.

      2 De aanvrager behartigt naar verwachting de belangen van ten minste 5% van de bedrijven in de automobielbranche.

      3 De aanvrager is een vereniging of stichting.

      4 Uit de statuten van de aanvrager blijkt dat de aanvrager tot doel heeft de belangen van de automobielbranche
      te behartigen.
    url: https://wetten.overheid.nl/BWBR0013041/2001-01-12#Artikel2
  - number: '3'
    text: |-
      1 Drie jaar na een aanwijzing als bedoeld in [artikel 2][ref1] beoordeelt de Minister of de organisatie die is
      aangewezen als organisatie die de belangen van de automobielbranche behartigt nog steeds aan de criteria, bedoeld
      in [artikel 2, derde en vierde lid][ref2], voldoet. Tevens beoordeelt de Minister of de aangewezen organisatie die
      is aangewezen de belangen van ten minste 5% van de bedrijven in de automobielbranche behartigt.

      2 Indien uit de beoordeling, bedoeld in het eerste lid, blijkt dat de aangewezen organisatie niet langer voldoet
      aan een van de criteria, bedoeld in [artikel 2, derde en vierde lid, of aan het eerste lid][ref3], dan wel indien
      blijkt dat de aangewezen organisatie niet heeft voldaan of niet voldoet aan haar wettelijke verplichtingen, wordt
      de aanwijzing ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0013041#Artikel2
