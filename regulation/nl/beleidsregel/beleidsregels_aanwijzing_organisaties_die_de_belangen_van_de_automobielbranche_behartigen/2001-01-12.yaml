preamble:
  text: |-
    Gelet op artikel 44, eerste lid, van de Wegenverkeerswet 1994, de artikelen 9, onderdeel d, en 14 van het
    Kentekenreglementen artikel 4:81 van de Algemene wet bestuursrecht;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0013041/2001-01-12#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze beleidsregels wordt verstaan onder:

      a. *de Minister:* de Minister van Verkeer en Waterstaat;

      b. *de automobielbranche:* het geheel van bedrijven dat gegevens uit het kentekenregister gebruikt en zich
      richt op de handel in en de reparatie van personenauto's, de import van nieuwe personenauto's, de handel in
      en de reparatie van bedrijfsauto's, de import van nieuwe bedrijfsauto's, de vervaardiging van rubberbanden, de
      vernieuwing van loopvlakken, de autofabricage, de carrosseriebouw, de vervaardiging van aanhangwagens en opleggers,
      de vervaardiging van auto-onderdelen en accessoires, de vervaardiging van motor- en bromfietsen, autodemontage, de
      groothandel in gebruikte banden, de auto-onderdelenservice, de autobandenservice, de reparatie van specifieke auto-
      onderdelen, carrosserieherstel, de groothandel en handel in auto-onderdelen, de groothandel en de handel in banden,
      de detailhandel in auto-onderdelen, de groothandel en de handel in motorfietsen en onderdelen, de detailhandel in
      en de reparatie van motorfietsen en onderdelen, de operational lease van personenauto's, de keuring en controle van
      machines en apparaten, en de vervaardiging van elektrische benodigdheden en elementen, bestemd voor deze voertuigen
      of onderdelen daarvan;

      c. *de aanvrager:* de organisatie die met het oog op de verstrekking van gegevens uit het kentekenregister als
      bedoeld in [artikel 44, eerste lid, van de Wegenverkeerswet 1994][ref1], met uitzondering van gegevens omtrent
      diefstal of verduistering van voertuigen, bij de Minister een aanvraag heeft ingediend om aangewezen te worden
      als organisatie die de belangen van de automobielbranche behartigt als bedoeld in [artikel 9, onder d][ref2], jo.
      [artikel 14 van het Kentekenreglement][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0006951#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0006951#Artikel14
    url: https://wetten.overheid.nl/BWBR0013041/2001-01-12#Artikel1
    references:
