  - number: '2'
    text: |-
      De Minister verstrekt op aanvraag een eenmalige tegemoetkoming aan:

      a. personen van wie de vermelding van het geslacht in de geboorteakte voor 1 juli 2014 is gewijzigd of voor wie
      een nieuwe geboorteakte is opgemaakt voor 1 juli 2014 in verband met de wijziging van het in de oude geboorteakte
      geregistreerde geslacht; of

      b. personen die voor 1 juli 2014 zijn gestart met een transitietraject leidende tot een transitie voor 1 juli 2016
      en de wijziging van de vermelding van het geslacht in de geboorteakte of het opmaken van een nieuwe geboorteakte
      voor 1 juli 2016.
    url: https://wetten.overheid.nl/BWBR0045577/2021-10-18#Artikel2
  - number: '3'
    text: De eenmalige tegemoetkoming bedraagt € 5.000 per persoon.
    url: https://wetten.overheid.nl/BWBR0045577/2021-10-18#Artikel3
  - number: '4'
    text: |-
      1 Een aanvraag voor een tegemoetkoming wordt ingediend bij DUS-I.

      2 Voor het indienen van de aanvraag wordt gebruik gemaakt van een aanvraagformulier dat op de website https://
      [www.dus-i.nl](onbekend) beschikbaar is gesteld.

      3 Een aanvraag kan vanaf 18 oktober 2021 tot en met 18 oktober 2023 worden ingediend.

      4 Een aanvrager is verplicht te verstrekken:

      a. de gegevens waarnaar in het aanvraagformulier wordt gevraagd;

      b. een niet ouder dan drie maanden zijnde gewaarmerkt afschrift van een geboorteakte waaruit blijkt dat de
      vermelding van het geslacht tussen 1 juli 1985 en 1 juli 2016 is gewijzigd of een gewaarmerkt afschrift van
      een in deze periode nieuw opgemaakte geboorteakte in verband met de wijziging van het in de oude geboorteakte
      geregistreerde geslacht; en

      c. desgevraagd overige inlichtingen en bewijsstukken, indien die noodzakelijk zijn voor de beoordeling van de
      aanvraag.

      5 Indien sprake is van een nieuw opgemaakte geboorteakte gaat de aanvraag tevens vergezeld van:

      a. een rechterlijke uitspraak waaruit blijkt dat de nieuwe geboorteakte is opgemaakt in verband met de wijziging
      van het in de oude geboorteakte geregistreerde geslacht;

      b. een door de Minister vastgesteld formulier voorzien van een verklaring van arts inhoudende dat de aanvrager
      voor 1 juli 2014 een transitie heeft ondergaan en een machtiging om de juistheid van deze verklaring bij de
      desbetreffende arts te verifiëren; of

      c. een machtiging aan DUS-I om een verklaring inhoudende dat de aanvrager voor 1 juli 2014 een transitie heeft
      ondergaan op te vragen bij een door de aanvrager aan te wijzen arts.

      6 Een aanvraag door een persoon als bedoeld onder [artikel 2, onder b][ref1], gaat tevens vergezeld van:

      a. een door de Minister vastgesteld formulier voorzien van een verklaring van een arts inhoudende dat de aanvrager
      voor 1 juli 2014 gestart is met een transitietraject leidende tot een transitie voor 1 juli 2016 en een machtiging
      aan DUS-I om de juistheid van deze verklaring bij de desbetreffende arts te verifiëren; of

      b. een machtiging aan DUS-I om een verklaring inhoudende dat de aanvrager voor 1 juli 2014 gestart is met een
      transitietraject leidende tot een transitie voor 1 juli 2016 op te vragen bij een door de aanvrager aan te wijzen
      arts.

      7 Een aanvraag die na 18 oktober 2023 wordt ontvangen, wordt afgewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0045577#Artikel2
    url: https://wetten.overheid.nl/BWBR0045577/2021-10-18#Artikel4
    references:
