        artikel: '2'
  - number: '5'
    text: |-
      1 De Minister beslist binnen 8 weken op een volledige aanvraag voor een tegemoetkoming.

      2 Indien de Minister besluit tot toekenning van een tegemoetkoming worden de kosten voor het aanvragen van een
      gewaarmerkt afschrift van de geboorteakte door de Minister vergoed.

      3 De Minister betaalt het bedrag van de tegemoetkoming en de vergoeding van de kosten van het aanvragen van een
      gewaarmerkt afschrift van de geboorteakte in één keer uit.
    url: https://wetten.overheid.nl/BWBR0045577/2021-10-18#Artikel5
  - number: '6'
    text: |-
      1 De Minister kan een besluit tot toekenning van een tegemoetkoming intrekken indien:

      a. de aanvrager aan wie een tegemoetkoming is toegekend onjuiste of onvolledige informatie heeft verschaft,
      waardoor een tegemoetkoming ten onrechte is toegekend; of

      b. het besluit tot toekenning van een tegemoetkoming anderszins onjuist was en de aanvrager dat wist, dan wel
      behoorde te weten.

      2 De Minister vordert een bedrag dat ten onrechte is uitbetaald terug van degene aan wie is uitbetaald.
    url: https://wetten.overheid.nl/BWBR0045577/2021-10-18#Artikel6
  - number: '7'
    text: Deze beleidsregel treedt in werking met ingang van 18 oktober 2021 en vervalt met ingang van 18 oktober 2024.
