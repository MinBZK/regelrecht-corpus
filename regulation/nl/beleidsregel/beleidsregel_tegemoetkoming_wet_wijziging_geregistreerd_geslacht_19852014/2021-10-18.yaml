    Handelende in overeenstemming met de Minister van Onderwijs, Cultuur en Wetenschap;

    Gelet op artikel 4:81 van de Algemene wet bestuursrecht;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0045577/2021-10-18#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze beleidsregel wordt verstaan onder:

        - *arts:* zorgverlener die als arts staat ingeschreven in het register, bedoeld in [artikel 3 van de Wet op de
      beroepen in de individuele gezondheidszorg](onbekend);
        - *DUS-I:* Dienst Uitvoering Subsidies aan Instellingen;
        - *Minister:* Minister voor Rechtsbescherming;
        - *tegemoetkoming:* eenmalige financiële bijdrage als gebaar ter erkenning van de grote gevolgen die
      personen hebben ondervonden die zijn overgegaan tot wijziging van de vermelding van het geslacht in de
      geboorteakte of die een nieuwe geboorteakte hebben laten opmaken in verband met de wijziging van het
      in de oude geboorteakte geregistreerde geslacht en daarvoor gehouden waren aan de voorschriften uit
      [artikel 28, eerste lid, van Boek 1 van het Burgerlijk Wetboek][ref1], zoals dit artikel luidde tussen 1 juli 1985
      en 1 juli 2014;
        - *transitie:* handelingen die voldoen aan de voorschriften uit
      [artikel 28, eerste lid, van Boek 1 van het Burgerlijk Wetboek][ref2], zoals dit artikel luidde tussen 1 juli 1985
      en 1 juli 2014 teneinde het in de geboorteakte vermelde geslacht te wijzigen of een nieuwe geboorteakte op laten
      te maken.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel28
