        artikel: 33a
  - number: '2'
    text: |-
      Deze beleidsregel is van toepassing op de belangenafweging bij de besluitvorming omtrent aanvragen tot verlening
      van vergunningen op grond van:

      a. [artikel 3 van de wet][ref1], voor zover de vergunning wordt verleend door de raad van bestuur en deze
      vergunning geen betrekking heeft op een incidenteel kansspel;

      b. [artikel 14a van de wet][ref2];

      c. [artikel 15 van de wet][ref3];

      d. [artikel 23 van de wet][ref4];

      e. [artikel 27a van de wet][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002469#Artikel14a
      [ref3]: https://wetten.overheid.nl/BWBR0002469#Artikel15
      [ref4]: https://wetten.overheid.nl/BWBR0002469#Artikel23
      [ref5]: https://wetten.overheid.nl/BWBR0002469#Artikel27a
    url: https://wetten.overheid.nl/BWBR0035632/2014-10-14#Artikel2
