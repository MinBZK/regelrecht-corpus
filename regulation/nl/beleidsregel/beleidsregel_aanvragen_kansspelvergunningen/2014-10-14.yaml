preamble:
  text: |-
    Gelet op artikel 21, eerste lid, van de Kaderwet zelfstandige bestuursorganen en artikelen 3, 14a, 15, 23 en 27a
    van de Wet op de kansspelen;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0035632/2014-10-14#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze beleidsregel wordt verstaan onder:

        - *wet:* [Wet op de kansspelen][ref1];
        - *raad van bestuur:* raad van bestuur als bedoeld in [artikel 33a van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002469
      [ref2]: https://wetten.overheid.nl/BWBR0002469#Artikel33a
    url: https://wetten.overheid.nl/BWBR0035632/2014-10-14#Artikel1
