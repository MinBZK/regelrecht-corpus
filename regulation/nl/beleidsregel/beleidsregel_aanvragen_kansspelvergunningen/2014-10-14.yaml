preamble:
  text: |-
    Gelet op artikel 21, eerste lid, van de Kaderwet zelfstandige bestuursorganen en artikelen 3, 14a, 15, 23 en 27a
    van de Wet op de kansspelen;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0035632/2014-10-14#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze beleidsregel wordt verstaan onder: - *wet:* [Wet op de kansspelen][ref1];
        - *raad van bestuur:* raad van bestuur als bedoeld in [artikel 33a van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002469
      [ref2]: https://wetten.overheid.nl/BWBR0002469#Artikel33a
    url: https://wetten.overheid.nl/BWBR0035632/2014-10-14#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002469
      - id: ref2
        bwb_id: BWBR0002469
        artikel: 33a
  - number: '2'
    text: |-
      Deze beleidsregel is van toepassing op de belangenafweging bij de besluitvorming omtrent aanvragen tot verlening
      van vergunningen op grond van:
    url: https://wetten.overheid.nl/BWBR0035632/2014-10-14#Artikel2
  - number: 2.a
    text: |-
      [artikel 3 van de wet][ref1], voor zover de vergunning wordt verleend door de raad van bestuur en deze vergunning
      geen betrekking heeft op een incidenteel kansspel;


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel3
    url: https://wetten.overheid.nl/BWBR0035632/2014-10-14#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: '3'
  - number: 2.b
    text: |-
      [artikel 14a van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel14a
    url: https://wetten.overheid.nl/BWBR0035632/2014-10-14#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 14a
  - number: 2.c
    text: |-
      [artikel 15 van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel15
    url: https://wetten.overheid.nl/BWBR0035632/2014-10-14#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: '15'
  - number: 2.d
    text: |-
      [artikel 23 van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel23
    url: https://wetten.overheid.nl/BWBR0035632/2014-10-14#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: '23'
  - number: 2.e
    text: |-
      [artikel 27a van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel27a
    url: https://wetten.overheid.nl/BWBR0035632/2014-10-14#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 27a
  - number: '3'
    text: |-
      De raad van bestuur zal in zijn belangenafweging bij de besluitvorming omtrent een aanvraag tot verlening van een
      vergunning als bedoeld in [artikel 2][ref1] de volgende belangen zwaar mee laten wegen:


      [ref1]: https://wetten.overheid.nl/BWBR0035632#Artikel2
    url: https://wetten.overheid.nl/BWBR0035632/2014-10-14#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0035632
        artikel: '2'
  - number: 3.a
    text: |-
      het belang om het bestaande loterijstelsel in Nederland intact te houden tot de introductie van nieuwe wet- en
      regelgeving hieromtrent;
    url: https://wetten.overheid.nl/BWBR0035632/2014-10-14#Artikel3
  - number: 3.b
    text: |-
      het belang om een vergunning als bedoeld in [artikel 2][ref1], die thans verleend is en die voor 1 januari 2017
      afloopt, tot voornoemde datum aan dezelfde vergunninghouder te verlenen;


      [ref1]: https://wetten.overheid.nl/BWBR0035632#Artikel2
    url: https://wetten.overheid.nl/BWBR0035632/2014-10-14#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0035632
        artikel: '2'
  - number: 3.c
    text: |-
      het belang om het huidige aantal verleende vergunningen als bedoeld in [artikel 2][ref1] tot 1 januari 2017
      ongewijzigd te laten.


      [ref1]: https://wetten.overheid.nl/BWBR0035632#Artikel2
    url: https://wetten.overheid.nl/BWBR0035632/2014-10-14#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0035632
        artikel: '2'
  - number: '4'
    text: |-
      Deze beleidsregel treedt in werking met ingang van de dag na de datum van uitgifte van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0035632/2014-10-14#Artikel4
  - number: '5'
    text: 'Deze beleidsregel wordt aangehaald als: Beleidsregel aanvragen kansspelvergunningen.'
    url: https://wetten.overheid.nl/BWBR0035632/2014-10-14#Artikel5
