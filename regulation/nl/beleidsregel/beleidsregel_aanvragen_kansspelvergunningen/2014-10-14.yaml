  - number: '3'
    text: |-
      De raad van bestuur zal in zijn belangenafweging bij de besluitvorming omtrent een aanvraag tot verlening van een
      vergunning als bedoeld in [artikel 2][ref1] de volgende belangen zwaar mee laten wegen:

      a. het belang om het bestaande loterijstelsel in Nederland intact te houden tot de introductie van nieuwe wet- en
      regelgeving hieromtrent;

      b. het belang om een vergunning als bedoeld in [artikel 2][ref2], die thans verleend is en die voor 1 januari 2017
      afloopt, tot voornoemde datum aan dezelfde vergunninghouder te verlenen;

      c. het belang om het huidige aantal verleende vergunningen als bedoeld in [artikel 2][ref3] tot 1 januari 2017
      ongewijzigd te laten.


      [ref1]: https://wetten.overheid.nl/BWBR0035632#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0035632#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0035632#Artikel2
