  - number: '5'
    text: |-
      Voor niet-riviergebonden activiteiten wordt geen toestemming gegeven, tenzij, onverminderd het bepaalde in
      [artikel 6][ref1], sprake is van:

      a. de aanleg van een voorziening van groot openbaar belang die redelijkerwijs niet buiten het rivierbed kan worden
      gerealiseerd;

      b. een activiteit met een bedrijfseconomisch belang voor een bestaand grondgebonden agrarisch bedrijf die
      redelijkerwijs niet buiten het rivierbed kan worden verricht;

      c. verduurzaming van de energievoorziening van een bestaande activiteit in het rivierbed; of

      d. de aanleg van een voorziening voor elektriciteitsopwekking door zonne- of windenergie die redelijkerwijs niet
      buiten het rivierbed kan worden gerealiseerd.


      [ref1]: https://wetten.overheid.nl/BWBR0050726#Artikel6
    url: https://wetten.overheid.nl/BWBR0050726/2026-07-01#Artikel5
