    text: |-
      Deze beleidsregel is van toepassing op de aanvragen voor een omgevingsvergunning voor een
      beperkingengebiedactiviteit, bedoeld in de [artikelen 6.17][ref1], [6.29][ref2], [6.35][ref3],
      [6.40][ref4], [6.54][ref5] en [6.58 van het Besluit activiteiten leefomgeving][ref6], in samenhang met
      [artikel 8.84, eerste lid, van het Besluit kwaliteit leefomgeving][ref7], voor beperkingengebiedactiviteiten met
      betrekking tot een oppervlaktewaterlichaam in beheer bij het Rijk, die worden verricht in een beperkingengebied in
      het rivierbed.


