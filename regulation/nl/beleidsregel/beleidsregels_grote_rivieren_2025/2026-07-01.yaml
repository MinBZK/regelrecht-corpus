    text: |-
      Ten aanzien van een vergunning als bedoeld in [artikel 6.12 van het Waterbesluit][ref1] die
      vóór 1 juli 2018 onherroepelijk was en waaraan een toestemming ten grondslag ligt als bedoeld in
      [artikel 3, aanhef en onderdeel b, van de Beleidsregels grote rivieren][ref2], zoals die luidden vóór 1 juli 2018,
      blijft dat artikelonderdeel van die beleidsregels van toepassing voor wijzigingen van die vergunning.


