        artikel: '6'
  - number: '6'
    text: |-
      1 Toestemming, als bedoeld in [artikel 3][ref1], wordt alleen gegeven indien:

      a. sprake is van een zodanige situering en uitvoering van de activiteit dat een veilig en doelmatig gebruik van de
      rivier gewaarborgd blijft;

      b. feitelijke belemmeringen voor de vergroting van de afvoercapaciteit van de rivier worden voorkomen;

      c. er sprake is van een zodanige situering en uitvoering van de activiteit dat een waterstandsverhoging of afname
      van het bergend vermogen van de rivier wordt voorkomen of zoveel mogelijk wordt beperkt; en

      d. resterende onvermijdbare waterstandsverhoging wordt gecompenseerd.

      2 Het eerste lid is van overeenkomstige toepassing voor het geven van toestemming als bedoeld in de
      [artikelen 4][ref2] en [5, aanhef en onderdelen a, b en c][ref3], met dien verstande dat resterende onvermijdbare
      waterstandsverhoging of afname van het bergend vermogen wordt gecompenseerd en de financiering en tijdige
      realisering van de compenserende maatregelen gezekerd zijn.

      3 Het eerste lid is van overeenkomstige toepassing voor het geven van toestemming als bedoeld in
      [artikel 5, aanhef en onderdeel d][ref4], met dien verstande dat de vergunning zal worden verleend voor een
      bepaalde termijn en resterende onvermijdbare waterstandsverhoging of afname van het bergend vermogen wordt
      gecompenseerd en de financiering en tijdige realisering van de compenserende maatregelen gezekerd zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0050726#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0050726#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0050726#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0050726#Artikel5
