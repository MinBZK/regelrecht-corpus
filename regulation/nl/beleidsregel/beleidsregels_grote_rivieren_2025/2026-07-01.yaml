  - number: '4'
    text: |-
      Onverminderd het bepaalde in [artikel 6, eerste en tweede lid][ref1], wordt toestemming gegeven voor de volgende
      activiteiten:

      a. de aanleg of wijziging van een waterstaatkundig kunstwerk;

      b. de aanleg van een voorziening voor een betere en veilige afwikkeling van de beroeps- of recreatievaart;

      c. de bouw of wijziging van een waterkrachtcentrale;

      d. de vestiging of uitbreiding van een overslagbedrijf of het realiseren van een overslagfaciliteit, als die
      activiteit is gekoppeld aan vervoer over de rivier;

      e. de aanleg of wijziging van een scheepswerf voor beroeps- of pleziervaartuigen en specifiek daaraan verbonden
      activiteiten als bedoeld in [artikel 3.144 van het Besluit activiteiten leefomgeving][ref2];

      f. de aanleg, het beheer of de verbetering van natuur;

      g. de verbetering van de waterkwaliteit;

      h. de uitbreiding of wijziging van een bestaande steenfabriek;

      i. de aanleg van een voorziening die onlosmakelijk met waterrecreatie of extensieve uiterwaardrecreatie is
      verbonden;

      j. de winning van oppervlaktedelfstoffen;

      k. de aanleg van een noodzakelijke voorziening voor het agrarisch, landschappelijk of daarmee vergelijkbaar beheer
      van het rivierbed;

      l. het behoud of herstel van landschappelijke elementen of cultureel erfgoed, in het bijzonder bekende of
      aantoonbaar te verwachten archeologische monumenten;

      m. de aanleg van een voorziening voor drinkwaterwinning en aquathermie.


      [ref1]: https://wetten.overheid.nl/BWBR0050726#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0041330#Artikel3.144
