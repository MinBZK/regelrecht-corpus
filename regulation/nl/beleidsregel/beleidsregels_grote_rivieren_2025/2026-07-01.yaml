    text: |-
      1 Onverminderd het bepaalde in [artikel 6, eerste lid][ref1], wordt in elk geval toestemming gegeven voor de
      volgende activiteiten:

      a. het slopen en vervangen van een bouwwerk door een bouwwerk van gelijke omvang, tenzij:

      1°. de gebruiksfunctie van het bouwwerk wijzigt naar woonfunctie of naar logiesfunctie; of

      2°. de gebruiksfunctie van het bouwwerk wijzigt van een functie ten behoeve van een riviergebonden activiteit naar
      een functie ten behoeve van een niet-riviergebonden activiteit;

      b. activiteiten die vanwege de aard en omvang naar het oordeel van de Minister van ondergeschikt belang zijn.

      2 Activiteiten als bedoeld in het eerste lid, onderdeel b, zijn in elk geval:

      a. een eenmalige uitbreiding van ten hoogste tien procent van het oppervlak en volume van een bouwwerk, tenzij:

      1°. de gebruiksfunctie van het bouwwerk wijzigt naar woonfunctie of naar logiesfunctie; of

      2°. de gebruiksfunctie van het bouwwerk wijzigt van een functie ten behoeve van een riviergebonden activiteit naar
      een functie ten behoeve van een niet-riviergebonden activiteit.

      b. het plaatsen van een in- of uitstroomvoorziening, mits de in- of uitstroomsnelheid maximaal 0,3 m/s bedraagt;

      c. het bouwen of in stand houden van een steiger, vlonder of aanmeervoorziening;

      3 Het bouwen van een bouwwerk met een woonfunctie of logiesfunctie is geen activiteit als bedoeld in het eerste
      lid, onderdeel b, tenzij het een eenmalige uitbreiding van ten hoogste tien procent van het oppervlak en volume van
      een bouwwerk met een woonfunctie of logiesfunctie betreft.

      4 Onverminderd het bepaalde in [artikel 6, eerste lid][ref2], kan toestemming worden gegeven voor tijdelijke en
      periodieke activiteiten. Of toestemming wordt gegeven voor deze activiteiten, hangt af van:

      a. de aard van de activiteit;

      b. de locatie waar de activiteit plaatsvindt;

      c. de periode waarin de activiteit plaatsvindt; en

      d. het rivierkundig effect van de activiteit.


      [ref1]: https://wetten.overheid.nl/BWBR0050726#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0050726#Artikel6
