articles:
  - number: '1'
    text: |-
      In deze beleidsregel wordt verstaan onder:

      a. *Minister:* Minister van Infrastructuur en Waterstaat;

      b. *periodieke activiteiten:* activiteiten die meerdere jaren achter elkaar uitsluitend in een bepaald deel of
      bepaalde delen van het jaar plaatsvinden met een maximum van in totaal zeven maanden per jaar;

      c. *rivierbed:* de oppervlakte begrensd op grond van [artikel 2.8, eerste lid, van de Omgevingsregeling][ref1];

      d. *beperkingengebied in het rivierbed:* de oppervlakte begrensd op grond van
      [artikel 2.8, tweede lid, van de Omgevingsregeling][ref2];

      e. *riviergebonden activiteiten:* activiteiten als bedoeld in [artikel 4][ref3];

      f. *tijdelijke activiteiten:* activiteiten die gedurende maximaal vijf jaar ononderbroken plaatsvinden;

      g. *toestemming:* toestemming vanuit rivierkundig oogpunt nodig voor het verkrijgen van een omgevingsvergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0045528#Artikel2.8
      [ref2]: https://wetten.overheid.nl/BWBR0045528#Artikel2.8
