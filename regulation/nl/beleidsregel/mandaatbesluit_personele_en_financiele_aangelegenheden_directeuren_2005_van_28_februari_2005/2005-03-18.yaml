preamble:
  text: |-
    Gelet op de Organisatieregeling van de plaats van de Immigratie- en Naturalisatiedienst binnen het Ministerie van
    Justitie d.d. 28 november 2002;

    Gelet op de Mandaatregeling Ministerie van Justitie 2002 van 28 november 2002;

    Gelet op de Mandaatregeling Directeuren-Generaal en plaatsvervangend Secretaris-Generaal van 28 november 2002;

    Gelet op de Mandaatregeling Directoraat-Generaal Internationale Aangelegenheden en Vreemdelingenzaken Justitie 2002
    van 29 november 2002;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0018061/2005-03-18#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. Hoofddirecteur IND: het hoofd van de Immigratie- en Naturalisatiedienst;

      b. plaatsvervangend Hoofddirecteur IND: het plaatsvervangend hoofd van de Immigratie- en Naturalisatiedienst;

      c. de directeuren: de directeur van de stafdirectie Uitvoeringsbeleid van de IND; de directeur van de stafdirectie
      Middelen en Control van de IND; de directeur van de stafdirectie Personeel, Organisatie en Informatie van de
      IND, tevens optredend in de hoedanigheid van directeur Bedrijfsvoering betreffende de onder de IND ressorterende
      dienstencentra werkzaam ten behoeve van de onderscheiden IND-locaties; de directeur Asiel van de IND; de directeur
      Regulier van de IND; de directeur Naturalisatie van de IND; de directeur Terugkeer van de IND; de directeur
      Procesvertegenwoordiging; de directeur van het Gemeenschappelijk Centrum ICT (GCICT); de directeur van het
      Gemeenschappelijk Centrum Kennis, Advies en Ontwikkeling (GCKAO);

      d. Hoofd BOH: het hoofd van het Bureau Ondersteuning Hoofddirectie van de IND.
    url: https://wetten.overheid.nl/BWBR0018061/2005-03-18#Artikel1
  - number: '2'
    text: |-
      1 De plaatsvervangend Hoofddirecteur IND is bevoegd personele- en financiële aangelegenheden die de IND betreffen,
      voor zover deze aangelegenheden naar aard of inhoud niet een zodanig gewicht hebben dat zij door de Hoofddirecteur
      IND behoren te worden afgedaan en voorzover niet doorgemandateerd aan de directeuren, respectievelijk Hoofd BOH,
      als bedoeld onder lid 2 van dit artikel, af te handelen.

      2 De directeuren en Hoofd BOH zijn, tenzij bij wettelijk voorschrift anders is bepaald of de aard van de
      bevoegdheid zich daartegen verzet, ten aanzien van de medewerkers werkzaam op de gebieden waarvoor de betreffende
      directeur, respectievelijk Hoofd BOH verantwoordelijkheid draagt, bevoegd om in naam van de Minister van Justitie
      besluiten te nemen, stukken af te doen en uitgaande brieven te ondertekenen betreffende:

      a. de inrichting van de organisatie (niet zijnde de kwalitatieve invulling) en de kwantitatieve invulling van de
      organieke formatie;

      b. de rechtspositie van individuele medewerkers.

      3 De stafdirecteur Personeel, Organisatie en Informatie is voorts in naam van de Minister van Justitie binnen de
      IND verantwoordelijk voor de ontwikkeling en uitvoering van het beleid gericht op het bevorderen van een zo groot
      mogelijke veiligheid, een zo goed mogelijke bescherming van de gezondheid en het welzijn in verband met de arbeid
      en het voldoen aan de overige verplichtingen die bij of krachtens de Arbeidsomstandighedenwet aan een werkgever
      zijn opgelegd.
    url: https://wetten.overheid.nl/BWBR0018061/2005-03-18#Artikel2
  - number: '3'
    text: |-
      1 Het mandaat als bedoeld in [artikel 2, tweede lid][ref1] omvat niet de bevoegdheid tot het nemen van besluiten
      waar het betreft het toekennen van schadevergoeding, het verlenen van ontslag, anders dan op aanvraag en het nemen
      van disciplinaire maatregelen ten aanzien van medewerkers als vermeld in het overzicht dat als bijlage 1 aan dit
      mandaat is gehecht. Evenmin betreft dit de bevoegdheid tot het nemen van enig ander besluit waar het gaat om in dit
      overzicht genoemde medewerkers, die werkzaam zijn in functies gewaardeerd op schaal 14.

      2 Het mandaat als bedoeld in [artikel 2, eerste en tweede lid][ref2], omvat niet de bevoegdheid tot het nemen van
      besluiten, indien deze worden genomen op grond van [artikel 99 van het Algemeen Rijksambtenarenreglement][ref3].

      3 Het mandaat als bedoeld in [artikel 2, tweede lid][ref4], omvat niet de bevoegdheid tot het nemen van besluiten,
      indien deze worden genomen op grond van [artikel 69 van het Algemeen Rijksambtenarenreglement][ref5], voor zover de
      schadevergoeding betrekking heeft op immateriële of materiële schade boven een bedrag van € 10.000 netto.

      4 Het mandaat als bedoeld in [artikel 2, tweede lid][ref6], omvat niet de bevoegdheid om te beslissen in bezwaar
      op door de in [artikel 1, sub c][ref7] van dit besluit genoemde directeuren, respectievelijk Hoofd BOH, genomen
      besluiten, met uitzondering van die besluiten op bezwaar betreffende bevoegdheden die zijn doorgemandateerd aan
      onder de desbetreffende directeuren ressorterende functionarissen.


