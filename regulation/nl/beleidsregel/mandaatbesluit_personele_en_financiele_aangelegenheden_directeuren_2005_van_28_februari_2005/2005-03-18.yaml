  - number: '4'
    text: |-
      In geval van beroep tegen een door de desbetreffende directeur, respectievelijk Hoofd BOH, genomen beslissing op
      bezwaar of een besluit van een onder die directeur, respectievelijk Hoofd BOH, ressorterende functionaris, is de
      directeur, respectievelijk Hoofd BOH, bevoegd om:

      a. in naam van de Minister van Justitie hoger beroep in te stellen tegen de uitspraak van de rechtbank, ter zake
      van die uitspraak een verzoek in te dienen tot het treffen van een voorlopige voorziening en of een verzoek in te
      dienen tot herziening van die uitspraak;

      b. als gemachtigde van de Minister van Justitie op te treden of een gemachtigde van de Minister van Justitie aan
      te wijzen.
    url: https://wetten.overheid.nl/BWBR0018061/2005-03-18#Artikel4
  - number: '5'
    text: |-
      1 De directeuren, respectievelijk Hoofd BOH, zijn, met inachtneming van het hiervoor bepaalde in [artikel 3][ref1],
      tot een maximum van € 300.000 en, in geval van het aangaan van verplichtingen boven € 15.000 na raadpleging
      van de afdeling Inkoop, bevoegd om financiële verplichtingen aan te gaan, met inachtneming van het in het
      managementcontract toegekende budget en, acht slaande op het bepaalde in lid 2, het aan hen toegekende deel van
      het projectenbudget.

      2 Het mandaat als bedoeld in lid 1 omvat niet de bevoegdheid tot het aangaan van verplichtingen voor het inhuren
      van externen op het gebied van ICT ten behoeve van ICT-projecten. Voor het inhuren van deze externen is de
      directeur GC ICT bevoegd om, met inachtneming van het projectenbudget, financiële verplichtingen aan te gaan.

      3 Het mandaat als bedoeld in lid 1 omvat voor de andere directeuren dan de directeur GCICT, respectievelijk
      Hoofd BOH, niet de bevoegdheid tot het aangaan van verplichtingen voor het aanschaffen van ICT-apparatuur en
      ICT- software. De directeur GCICT is bevoegd om in overleg met de directeur Bedrijfsvoering in verband met het
      door laatstgenoemde beheerde budget voor ICT-apparatuur en ICT-software, in het kader van de overeengekomen
      dienstverlening door GCICT aan de andere directies, respectievelijk BOH, de hierop betrekking hebbende financiële
      verplichtingen aan te gaan.

      4 Het mandaat als bedoeld in lid 1 omvat niet de bevoegdheid tot het aangaan van verplichtingen voor het huren van
      panden. Deze bevoegdheid blijft bij de hoofddirectie.

      5 Tot 1 januari 2007 is van de uitoefening van het mandaat als bedoeld in lid 1 het inhuren van externen voor
      interim management, organisatieadvies, communicatieadvies en voor beleidsadvies uitgesloten. Deze bevoegdheid
      blijft tot dat moment bij de hoofddirectie.


      [ref1]: https://wetten.overheid.nl/BWBR0018061#Artikel3
