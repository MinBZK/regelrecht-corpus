  - number: '6'
    text: |-
      De directeuren, respectievelijk Hoofd BOH, zijn bevoegd om facturen te accorderen, dat wil zeggen te tekenen voor
      belasting van het eigen budget.
    url: https://wetten.overheid.nl/BWBR0018061/2005-03-18#Artikel6
  - number: '7'
    text: |-
      De directeur M&C is bevoegd om betalingen te doen verrichten ten laste van de bankrekening van de IND. De
      bijbehorende autorisaties zijn toegekend aan de kasbeheerder van de IND en de plv. kasbeheerders (allen werkzaam
      bij de directie M&C).
    url: https://wetten.overheid.nl/BWBR0018061/2005-03-18#Artikel7
  - number: '8'
    text: |-
      1 De directeuren, respectievelijk Hoofd BOH, zijn bevoegd, met inachtneming van in lid 2 tot en met 4 van
      dit artikel genoemde voorwaarden, aan medewerkers van de IND mandaat te verlenen ten aanzien van de uit de
      [artikelen 5][ref1] en [6][ref2] voortvloeiende bevoegdheden. De bevoegdheden voortvloeiend uit [artikel 2][ref3]
      kunnen slechts worden gemandateerd aan de unitmanagers, respectievelijk afdelingshoofden, respectievelijk
      projectleiders, respectievelijk locatiemanagers, met dien verstande dat zij deze bevoegdheid niet uit kunnen
      oefenen ten aanzien van medewerkers op het niveau van salarisschaal 13 of hoger van bijlage B van het BBRA.

      2 De directeuren, respectievelijk Hoofd BOH, stellen, teneinde aan de uitoefening van de bevoegdheden voortvloeiend
      uit het financiële mandaat rechtskracht te verbinden, een competentietabel, incl. een handtekeningenregister, vast
      waarin de gemandateerde bevoegdheden per functionaris vastliggen. In de tabel wordt per functionaris aangegeven
      voor welke kostensoorten hij verplichtingen mag aangaan en/of mag tekenen voor belasting van het budget.

      Het handtekeningenregister dient door de directeuren door tussenkomst van de directeur Bedrijfsvoering ter
      beschikking te worden gesteld aan de afdelingen Financiën van de locale dienstencentra.

      3 De directeuren, respectievelijk Hoofd BOH, zijn bevoegd om bepaalde budgetten verbonden aan kostensoorten
      te verdelen over de units, respectievelijk afdelingen of bureaus, respectievelijk dienstencentra. Het
      budgethouderschap en de daarmee verbonden primaire verantwoordelijkheid blijft bij de directeuren. De directeuren,
      respectievelijk Hoofd BOH, leggen periodiek en in aansluiting op de P&C cyclus over de gerealiseerde uitgaven
      en kosten verantwoording af aan de hoofddirectie. De unitmanagers, respectievelijk de afdelingshoofden,
      respectievelijk locatiemanagers krijgen voor deze budgetten de bevoegdheid om financiële verplichtingen aan te gaan
      tot het aan hen toegekende totaalbedrag.

      4 Het verlenen van mandaat als bedoeld in lid 1 geschiedt onder de volgende voorwaarden:

        - Verleende mandaten worden niet verder gemandateerd.
        - De functionarissen aan wie mandaat verleend is mogen financiële verplichtingen aangaan tot maximaal € 10.000
      (per verplichting).
        - De functionarissen aan wie mandaat verleend is mogen facturen accorderen (tekenen voor budgetbelasting) tot
      maximaal € 10.000 per factuur.
        - Voor locatiemanagers geldt dat mandaat verleend wordt tot € 50.000 voor het aangaan van verplichtingen en tot €
      300.000 per te accorderen factuur voor leveringen binnen het kader van gesloten overeenkomsten.
        - Als een functionaris optreedt in zijn hoedanigheid als plaatsvervanger, heeft hij dezelfde bevoegdheden als de
      functionaris die hij vervangt. Dit geldt voor plv. HIND, plv. directeur, plv. UM, plv. LM, plv. PL.
        - De directeuren hebben de bevoegdheid om adjunct directeuren en hoofden AC in het kader van dit besluit aan te
      merken als plaatsvervangend directeur.
        - Een functionaris mag geen verplichtingen aangaan voor diensten die betrekking hebben op hemzelf. In voorkomende
      gevallen wordt de verplichting aangegaan door de betrokken direct leidinggevende.


