  - number: '4'
    text: |-
      1 Een ontheffing kan op verzoek van de werkgever maximaal driemaal worden verlengd, telkens met een periode
      van 6 weken. Bij het verzoek om verlenging wordt gebruik gemaakt van het verlengingsformulier dat is ingericht
      overeenkomstig [bijlage 4][ref1] bij deze bijzondere beleidsregels.

      2 Een ontheffing wordt slechts verlengd als de omzet in de twee maanden voorafgaand aan het verzoek tot verlenging
      nog altijd ten minste 30% lager is dan de omzet in de referentieperiode, bedoeld in [artikel 2, eerste lid][ref2].

      3 Bij ieder verzoek om verlenging wordt een geactualiseerde accountantsverklaring gevoegd waaruit blijkt dat wordt
      voldaan aan het tweede lid. [Artikel 2, vierde lid][ref3], is van toepassing.

      4 Een verzoek om verlenging leidt niet tot een uitbreiding van de ontheffing. Als de omzet is toegenomen wordt de
      ontheffing, met inachtneming van het tweede lid, dienovereenkomstig verlaagd.


