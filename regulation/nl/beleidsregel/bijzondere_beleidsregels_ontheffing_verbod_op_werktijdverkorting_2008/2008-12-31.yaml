articles:
  - number: '1'
    text: |-
      1 In plaats van beleidsregel 1 van de Beleidsregels ontheffing verbod van werktijdverkorting 2004 gelden deze
      bijzondere beleidsregels, indien een werkgever voor 15 januari 2009 wordt geconfronteerd met een acute en zware
      terugval in de omzet die een gevolg is van de financiële crisis 2008.

      2 Beleidsregel 2 van de Beleidsregels ontheffing verbod op werktijdverkorting 2004 is van toepassing.

      3 Deze bijzondere beleidsregels zijn van toepassing op een verzoek om ontheffing van het verbod, bedoeld in
      [artikel 8, derde lid, van het Buitengewoon Besluit Arbeidsverhoudingen 1945][ref1], gedaan door een werkgever voor
      15 januari 2009.

      4 In totaal worden op basis van deze bijzondere beleidsregel ontheffingen toegekend tot maximaal omgerekend 20.000
      werknemers met een dienstverband van 38 uur per week (maximaal voor 760.000 uren per week). Het bereiken van
      het in de vorige zin bedoelde maximum wordt bekend gemaakt op de website van het Ministerie van Sociale Zaken en
      Werkgelegenheid (www.szw.nl).

      5 Voor de toepassing van het vierde lid worden aanvragen in volgorde van tijdstip van ontvangst behandeld, waarbij
      alleen volledige aanvragen in behandeling worden genomen. Wanneer de werkgever in de gelegenheid is gesteld om zijn
      onvolledige aanvraag aan te vullen geldt als tijdstip van ontvangst het tijdstip van ontvangst van de volledige
      aanvraag. Indien volledige toekenning van een aanvraag zou leiden tot overschrijding van het maximum wordt de
      aanvraag tot het maximum toegekend. Indien op dezelfde dag meer aanvragen zijn binnen gekomen die leiden tot
      overschrijding van het maximum, zal door middel van loting de volgorde van behandeling worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002014#Artikel8
