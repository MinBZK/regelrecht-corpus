  - number: '3'
    text: |-
      1 Bij het verzoek om ontheffing, bedoeld in [artikel 2][ref1] voegt de werkgever een verklaring waaruit blijkt dat
      hij met zijn werknemers afspraken heeft gemaakt om zich gedurende de looptijd van de ontheffing in te spannen om:

      a. door middel van scholing de inzetbaarheid van de werknemers waarvoor ontheffing wordt gevraagd in zijn bedrijf
      of in het bedrijf van een andere werkgever te behouden of te verbeteren;

      b. het verrichten van arbeid in het bedrijf van een andere werkgever (detachering) mogelijk te maken.
      Bij dit laatste kan de werkgever gebruik maken van de diensten van het Centrum voor Werk en Inkomen en de
      mobiliteitscentra;

      c. het loon door te betalen voor zover de betrokken werknemers op grond van de criteria van de
      [Werkloosheidswet][ref2] geen aanspraak kunnen maken op een uitkering op grond van [die wet][ref3].

      2 Voorts wordt in de verklaring opgenomen, dat de werkgever zich zal inspannen al datgene te doen om de
      arbeidsverhouding met de werknemers voor wie gebruik is gemaakt van de ontheffing, na afloop daarvan, ten minste
      vier weken volledig in stand te houden.

      3 Als het verzoek om ontheffing 20 of meer werknemers betreft, blijkt tevens uit de verklaring dat de
      belanghebbende verenigingen van werknemers, en als die niet beschikbaar zijn een andere vertegenwoordiging van
      werknemers, met het verzoek om ontheffing van de werkgever instemmen. Als het verzoek minder dan 20 werknemers
      betreft, blijkt tevens uit de verklaring, bedoeld in het eerste lid, dat de werkgever overleg heeft gevoerd met een
      vertegenwoordiging van zijn werknemers.

      4 Bij de verklaringen, bedoeld in dit artikel, wordt gebruik gemaakt van het model dat is ingericht overeenkomstig
      [bijlage 3][ref4] bij deze bijzondere beleidsregels.


