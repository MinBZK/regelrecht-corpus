      1 Deze bijzondere beleidsregels treden in werking met ingang van de tweede dag na de dagtekening van de
      Staatscourant waarin deze worden geplaatst en vervallen met ingang van 15 januari 2009.

      2 In afwijking van het eerste lid blijven deze bijzondere beleidsregels van toepassing op de afwikkeling van
      ontheffingen die op grond van deze bijzondere beleidsregels zijn verleend en op verzoeken tot verlenging van
      ontheffingen als bedoeld in [artikel 4][ref1].


