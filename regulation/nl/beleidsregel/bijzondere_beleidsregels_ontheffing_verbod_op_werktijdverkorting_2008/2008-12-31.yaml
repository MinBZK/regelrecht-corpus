  - number: '2'
    text: |-
      1 Op verzoek van de werkgever wordt voor de duur van 6 weken een ontheffing als bedoeld in
      [artikel 8, derde lid, van het Buitengewoon Besluit Arbeidsverhoudingen 1945][ref1] voor de bij die ontheffing aan
      te wijzen werknemers verleend, indien de som van de omzet van de werkgever in twee maanden die liggen in de periode
      van 1 september 2008 tot 15 januari 2009 (periode 1) met ten minste 30% is afgenomen ten opzichte van de omzet in
      de twee direct daaraan voorafgaande maanden (referentieperiode).

      2 Indien er in dezelfde twee periodes als bedoeld in het eerste lid in 2007 respectievelijk 2008 eveneens sprake
      was van een omzetdaling in periode 1 ten opzichte van de referentieperiode, dan wordt het percentage van de daling
      in 2007 respectievelijk 2008 in mindering gebracht op het percentage van de daling in 2008 respectievelijk 2009.
      Het verschil tussen beide percentages moet ten minste 30 procentpunt bedragen om voor de ontheffing in aanmerking
      te komen.

      3 Bij het verzoek om ontheffing wordt gebruik gemaakt van het aanvraagformulier dat is ingericht overeenkomstig
      [bijlage 1][ref2] bij deze bijzondere beleidsregels.

      4 De daling van de omzet wordt aangetoond door middel van een accountantsverklaring die is afgegeven door een
      accountant als bedoeld in [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref3] en die is
      ingericht overeenkomstig het model van [bijlage 2][ref4] bij deze bijzondere beleidsregels.

      5 Het aandeel van de totale arbeidscapaciteit in arbeidsuren waarvoor aan de werkgever een ontheffing kan worden
      verleend, is ten hoogste gelijk aan het percentage dat voortvloeit uit de toepassing van het eerste lid.

      6 Aan een werkgever wordt op basis van deze bijzondere beleidsregels slechts eenmaal een ontheffing verleend, die
      overeenkomstig [artikel 4][ref5] kan worden verlengd.

      7 Bij de toepassing van deze bijzondere beleidsregels wordt uitgegaan van de werkgever die een rechtspersoon
      is, dan wel een natuurlijke persoon die als ondernemer wordt aangemerkt op grond van de [artikelen 3.4][ref6] of
      [3.5 van de Wet inkomstenbelasting 2001][ref7].


