  - number: '3'
    text: |-
      1 *De private activiteit is in lijn met de bekostigde wettelijke taak van de instelling.*

      De instelling kan dit desgevraagd aantonen op basis van bijvoorbeeld een projectplan waaruit blijkt dat de private
      activiteit op enigerlei wijze aansluit op of in verband staat met het onderwijs of het onderzoek waarvoor het
      bevoegd gezag bekostiging ontvangt.

      2 *De private activiteit waarin met publieke middelen wordt geïnvesteerd, levert aantoonbare meerwaarde op voor de
      bekostigde wettelijke taak.*

      Hiervan is bijvoorbeeld sprake wanneer een private activiteit waarin met publieke middelen is geïnvesteerd, tot
      gevolg heeft dat een onderwijsinstelling zijn relatie met werkgevers in de regio kan versterken, waardoor er meer
      stageplaatsen en/of leerwerkplaatsen beschikbaar komen. Een intensievere samenwerking met werkgevers in de regio
      kan ook leiden tot meer en beter inzicht in de behoeften van werkgevers zodat het onderwijs daarop kan worden
      aangepast. Contractonderwijs, in welke vorm dan ook, kan leiden tot een grotere deskundigheid van docenten, en
      wanneer die deskundigheid ook voor de bekostigde wettelijke taak kan worden benut, is er sprake van meerwaarde. Het
      is aan het bevoegd gezag dat met publieke middelen wil investeren in private activiteiten de gevraagde meerwaarde
      voor de bekostigde wettelijke taak te onderbouwen. Wanneer de investering louter is gericht op financieel gewin is
      er geen sprake van meerwaarde voor de bekostigde wettelijke taak.

      3 *Structurele overcapaciteit voor de bekostigde wettelijke taak die (mede) met publiek geld is gefinancierd moet
      worden afgestoten als dat mogelijk is. Dus overcapaciteit voor de bekostigde wettelijke taak die wordt ingezet voor
      private activiteiten is tijdelijk van aard.*

      Er moet sprake zijn van een capaciteit voor de bekostigde wettelijke taak (personeel en materieel) die is
      afgestemd op die bekostigde wettelijke taak. Restcapaciteit voortkomend uit de wettelijke taak kan worden ingezet
      voor private activiteiten als ten minste de integrale kostprijs in rekening wordt gebracht bij de afnemer. De
      restcapaciteit moet wel van tijdelijke aard zijn. Wanneer dat niet het geval is, dan moet deze – uiteraard voor
      zover mogelijk – worden afgestoten.

      4 *De investering is proportioneel.*

      De investering staat – ook in de tijd – in een redelijke verhouding tot de verwachte meerwaarde voor de bekostigde
      wettelijke taak.

      5 *De investering mag niet leiden tot oneerlijke concurrentie.*

      Het is niet toegestaan dat met het investeren van publieke middelen in private activiteiten, de mededinging wordt
      verstoord. Om deze reden geldt in elk geval als voorwaarde dat de bekostigde onderwijsinstelling de afnemer van
      de private activiteit die mede door een investering met publieke middelen tot stand is gekomen, ten minste de
      integrale kostprijs in rekening brengt.

      Sommige kosten hangen volledig samen met de activiteit en dienen geheel te worden meegenomen. Kostenposten die
      voor een deel samenhangen met de activiteit worden naar rato doorberekend. De berekeningswijze dient volgens
      bedrijfseconomische principes te worden opgesteld. Die berekening dient onderbouwd en gemotiveerd zijn.

      De integrale kostprijs wordt zowel vooraf (ex ante) als achteraf (ex post) berekend. De instelling berekent de
      zogenoemde voorcalculatorische kostprijs, gebaseerd op een realistische raming van de kosten en rekening houdend
      met prognoses inzake relevante ontwikkelingen betreffende de private activiteit en de effecten daarvan op de
      integrale kosten.

      Het doel van nacalculatie is het beoordelen of de voorcalculatie juist is geweest. Als uit nacalculatie blijkt
      dat de voorcalculatie niet juist en/of niet volledig is geweest, geeft dat aanleiding de kostprijs aan te
      passen. Daarmee zijn niet alleen de efficiency en de doelmatigheid van de bedrijfsvoering gediend (een gezonde
      bedrijfsvoering), maar het voorkomt ook dat de mededinging blijvend wordt verstoord.

      6 *Een positief resultaat uit private activiteiten waarin met publieke middelen is geïnvesteerd, wordt aan het
      publieke eigen vermogen toegevoegd.*

      Wanneer er sprake is van een private activiteit waarin geheel of gedeeltelijk met publieke middelen is
      gefinancierd, dan wordt een positief resultaat aan het publieke vermogen toegevoegd. Andersom geldt dat wanneer
      met een private activiteit waarin met publieke middelen is geïnvesteerd, een negatief financieel resultaat wordt
      behaald, dat negatieve resultaat ten laste mag worden gebracht van het publieke deel van het eigen vermogen.
      Daarbij geldt onverminderd het uitgangspunt dat private activiteiten niet ten koste mogen gaan van de bekostigde
      wettelijke taak en dat bij een negatief resultaat de gehele private activiteit opnieuw tegen het licht van de in
      deze beleidsregel genoemde voorwaarden moet worden gehouden. Tot slot is het niet toegestaan om publieke middelen
      aan te wenden om risico’s af te dekken, die voortkomen uit private activiteiten die geheel met private middelen
      zijn gefinancierd.

      7 *Over de investeringen met publieke middelen in private activiteiten wordt volledig en transparant verantwoording
      afgelegd in het bestuursverslag.*

      Het bevoegd gezag is verantwoordelijk voor een rechtmatige en doelmatige besteding van de publieke middelen
      en heeft een verantwoordingsplicht. Omdat de financiële risico’s van investeringen in private activiteiten
      groter zijn dan de risico’s bij besteding van publieke middelen ten behoeve van de bekostigde wettelijke taak,
      is extra zorgvuldigheid geboden. Risico’s die met private middelen zijn aangegaan, mogen immers geen negatieve
      invloed hebben op de bekostigde wettelijke taak. Van de instelling mag daarom worden verwacht dat zij volledig
      verantwoording aflegt en het intern toezicht zo organiseert dat zowel het college van bestuur als de raad van
      toezicht een duidelijke rol heeft bij het aangaan en het toezicht houden op private activiteiten. Het bevoegd
      gezag kan ervoor kiezen om die private activiteiten in een aparte rechtspersoon onder te brengen, maar is daar
      niet toe verplicht, zolang de financiële verantwoording maar volledig en transparant is. De inspectie kan eventueel
      onderzoeken of de instelling bij haar private activiteiten passende (risico-) beheersmaatregelen heeft getroffen en
      die ook adequaat toepast.

      De verantwoordingsplicht houdt in dat het bevoegd gezag in het bestuursverslag een overzicht geeft van de soort
      private activiteiten waarin met publieke middelen is geïnvesteerd.

      In het overzicht van de private activiteiten waarin met publieke middelen is geïnvesteerd, wordt per soort
      activiteit ten minste vermeld:

      − de omvang van de baten;

      − de omvang van de geïnvesteerde publieke middelen en de mutatie daarvan in het verslagjaar;

      − een beschrijving van het (risico-)beleid en beheer;

      − een beschrijving van de juridische en organisatorische inbedding van de soort private activiteit, inclusief een
      beschrijving van de verantwoordelijkheidstoebedeling;

      − een beschrijving van de meerwaarde van de soort private activiteit voor de bekostigde wettelijke taak.

      Het bevoegd gezag dient daarnaast op verzoek van de minister, dan wel op verzoek van de Inspectie van het
      Onderwijs, inzage te geven in álle specifieke private activiteiten, met name voor wat betreft de interne
      kostentoerekeningen (voor- en nacalculatie van de integrale kostprijs, inclusief een berekening van de risico-
      opslag op de geïnvesteerde publieke middelen). Dit onderdeel van de verantwoording hoeft niet te worden
      gepubliceerd in het bestuursverslag. In de nacalculatie wordt het resultaat op de private activiteit (zoals
      dat vervolgens wordt opgenomen in de jaarrekening) inzichtelijk gemaakt met een onderbouwing van de baten en
      (toegerekende) lasten.
