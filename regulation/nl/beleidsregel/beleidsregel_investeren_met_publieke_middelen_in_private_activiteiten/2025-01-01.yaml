articles:
  - number: '1'
    text: |-
      In deze beleidsregel wordt verstaan onder:

      a. *Bekostigde onderwijsinstelling:* een instelling als bedoeld in
      [artikel 1.1.1 van de Wet educatie en beroepsonderwijs][ref1] of een instelling voor hoger onderwijs als bedoeld in
      [artikel 1.8 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref2].

      b. *Bekostigde wettelijke taak:* de taak waarvoor de onderwijsinstelling op grond van de onderwijswetgeving wordt
      bekostigd. Overigens kunnen ook niet bij of krachtens de wet voorgeschreven activiteiten of voorzieningen die de
      toegankelijkheid en de kwaliteit van het bekostigde onderwijs bevorderen, tot de bekostigde wettelijke taak worden
      gerekend. Dan moeten die activiteiten of voorzieningen wel zijn gericht op de studenten die aan het bekostigd
      onderwijs deelnemen. En die studenten moeten vrijwillig, kosteloos of tegen een geringe niet-kostendekkende
      vergoeding, van die activiteiten of voorzieningen gebruik kunnen maken. Hierbij gaat het bijvoorbeeld om honours-
      programma’s, studium generale, of een bibliotheekvoorziening.

      c. *Bevoegd gezag:* het bevoegd gezag, bedoeld in
      [artikel 1.1.1 van de Wet educatie en beroepsonderwijs][ref3] dan wel het instellingsbestuur, bedoeld in
      [artikel 1.1, onder j, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref4].

      d. *Integrale kostprijs:* de integrale kostprijs als bedoeld in
      [artikel 25i, eerste lid, van de Mededingingswet][ref5]. Bij de vaststelling van de integrale kostprijs gaat het om
      álle kosten die samenhangen met de private activiteit. Dat zijn in ieder geval, maar niet uitsluitend:

        - ontwikkelkosten van de private activiteit, zoals de ontwikkelkosten van een niet-bekostigde opleiding, of van
      daarvan afgeleide varianten, al dan niet in modules;
        - personeelskosten;
        - kosten van dienstverlening door derden;
        - huisvestingskosten;
        - afschrijvings- en onderhoudskosten;
        - kostprijsverhogende belastingen, zoals btw en loonbelasting;
        - vermogenskosten vreemd vermogen, indien ten behoeve van de activiteit investeringen zijn gefinancierd met vreemd
      vermogen;
        - indirecte kosten;
        - een risico-opslag (wordt bij onderdeel i nader gedefinieerd).

      e. *Investeren van publieke middelen in private activiteiten:* het gebruiken van publieke middelen of mede met
      publieke middelen gefinancierde voorzieningen voor private activiteiten.

      f. *Onderwijswetgeving:* de onderwijswetten genoemd in
      [artikel 1, onder d, van de Wet op het onderwijstoezicht][ref6], alsmede de
      [Wet op de Nederlandse organisatie voor wetenschappelijk onderzoek][ref7].

      g. *Private activiteiten:* alle activiteiten die mede onder verantwoordelijkheid van het bevoegd gezag van een
      bekostigde onderwijsinstelling worden uitgevoerd, voor zover deze activiteiten op meer zijn gericht dan alleen de
      uitvoering van de bekostigde wettelijke taak.

      Niet-bekostigd onderwijs verzorgd door een bekostigde onderwijsinstelling is een private activiteit, met
      uitzondering van het onderwijs waarvoor op grond van [artikel 7.46 van de WHW][ref8] het instellingscollegegeld
      wordt berekend en het overdragen van kennis ten behoeve van de maatschappij. Ook wanneer een deelnemer aan
      bekostigd onderwijs daarnaast (extra) niet-bekostigd onderwijs afneemt, bijvoorbeeld op verzoek van een werkgever,
      is er voor wat betreft dat extra niet-bekostigde onderwijs sprake van een private activiteit.

      Het ontwikkelen van activiteiten en voorzieningen ten behoeve van beroepspraktijkvorming (BPV), moet worden
      aangemerkt als private activiteiten, wanneer uit die activiteiten ook economische voordelen voor derden kunnen
      voortvloeien. Voorbeelden hiervan zijn de reparatiewerkplaats, de kapsalon en de horecavoorziening waar ook anderen
      dan de docent of student binnen het kader van de bekostigde opleiding gebruik van kunnen maken.

      Private activiteiten hoeven niet altijd direct op het onderwijs betrekking te hebben. Ook onderzoeken in opdracht
      of op verzoek van derden kunnen worden aangemerkt als private activiteiten.

      Andere voorbeelden van private activiteiten (zonder volledig te willen zijn):

        - voorzieningen voor medewerkers en onderwijsdeelnemers, zoals huisvesting / logies; reisbureau; boekwinkel;
      horeca/catering; kopieer/printvoorziening. Daarbij kan het ook gaan om het ter beschikking stellen van ruimte voor
      een onderneming van een derde die de betreffende voorziening tegen een vergoeding mag exploiteren;
        - dienstverlening aan derden door de bekostigde instelling, zoals detachering, verhuur, laboratoriumdiensten,
      financiële diensten, ICT-diensten, reisbureau, HRM-diensten;
        - arbeidsbemiddeling, ondersteuning van startups (o.a. middels zogenoemde incubators), kennis-exploitatie,
      valorisatie, niet als onderdeel van de bekostigde wettelijke taken, maar in het verlengde daarvan, bij voorbeeld
      voor oud-studenten die hun bekostigde opleiding al hebben afgerond en/of oud-medewerkers, en waarbij veelal de
      betreffende oud-student of oud-medewerker dan wel een andere specifieke derde een economisch voordeel verkrijgt.

      h. *Publieke middelen:* de middelen verkregen ten laste van de rijksbegroting (zoals de rijksbijdrage of lumpsum)
      of anderszins uit hoofde van bij of krachtens de wet ingestelde heffingen verkregen middelen (zoals het lesgeld of
      het collegegeld), en de opbrengsten daarvan (zoals rente over op spaarrekeningen aangehouden publieke middelen),
      waarover een instelling de beschikking heeft gekregen om de bekostigde wettelijke taak te verrichten.

        - *Risico-opslag* Bij de berekening van de integrale kostprijs wordt een vergoeding voor het gebruik van het
      publieke eigen vermogen in rekening gebracht. Deze vergoeding is een compensatie voor de ongelijkheid die er is
      tussen bekostigde onderwijsinstellingen en private ondernemingen. Private ondernemingen die op een markt opereren
      lopen allerlei soorten risico’s en ze kunnen eventueel failliet gaan. Wanneer zij voor het doen van investeringen
      afhankelijk zijn van een lening, zullen kapitaalverschaffers daarom een bepaald rendement eisen op hun belegging
      (de lening die zij verstrekken). Het opnemen van een risico-opslag in de kostprijs heeft tot doel het creëren van
      zo gelijk mogelijke concurrentieverhoudingen tussen bekostigde onderwijsinstellingen als aanbieder van private
      diensten aan derden en andere, niet-bekostigde onderwijsinstellingen die gelijksoortige diensten aanbiedt. De
      hoogte van de risico-opslag is gelijk aan het rendement dat kapitaalverschaffers zouden eisen op een lening aan een
      private onderneming van dezelfde omvang.


