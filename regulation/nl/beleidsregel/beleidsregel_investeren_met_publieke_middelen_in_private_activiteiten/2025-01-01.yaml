  - number: '2'
    text: |-
      1 Deze beleidsregel heeft betrekking op de voorwaarden waaronder bekostigde HO- en MBO-instellingen met publieke
      middelen mogen investeren in private activiteiten.

      2 Deze beleidsregel en de voorwaarden zijn niet van toepassing op de activiteiten genoemd in de
      [Regeling beleggen, belenen en derivaten 2016][ref1], vanwege de voorschriften die in die regeling al worden
      gesteld.

      3 Deze beleidsregel en de voorwaarden zijn niet van toepassing op de besteding van subsidies, zoals bedoeld in
      [artikel 4:21 van de Algemene wet bestuursrecht][ref2]. Subsidies worden ook aangemerkt als publieke middelen,
      maar zij hebben een eigen wettelijk kader en een verantwoordingssystematiek die los staat van de wettelijke
      bekostigingsvoorschriften. Deze beleidsregel is daarom niet van toepassing op de besteding van subsidies door
      bekostigde HO- en MBO-instellingen.


      [ref1]: https://wetten.overheid.nl/BWBR0038059
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel421
