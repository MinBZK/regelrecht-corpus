---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: beleidsregel_verstrekking_licentie_topsporttalentschool_vo
regulatory_layer: BELEIDSREGEL
publication_date: '2020-08-31'
valid_from: '2014-12-23'
bwb_id: BWBR0026643
url: https://wetten.overheid.nl/BWBR0026643/2014-12-23
preamble:
  text: |-
    Gelet op de artikelen 25 en 29, zesde lid, van de Wet op het voortgezet onderwijs;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0026643/2014-12-23#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze beleidsregel wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0026643/2014-12-23#Artikel1
  - number: 1.a
    text: |-
      *school:* een openbare of uit een openbare kas bekostigde dagschool voor voortgezet onderwijs met uitzondering van
      een school voor praktijkonderwijs ;
    url: https://wetten.overheid.nl/BWBR0026643/2014-12-23#Artikel1
  - number: 1.b
    text: |-
      *zeer zwakke school en zwakke school:* is een school waar een aangepast toezichtarrangement geldt zoals beschreven
      in het Toezichtkader PO/VO 2009 als bedoeld in [artikel 13, eerste lid van de Wet op het Onderwijstoezicht][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel13
    url: https://wetten.overheid.nl/BWBR0026643/2014-12-23#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: '13'
  - number: 1.c
    text: |-
      *bevoegd gezag:* bevoegd gezag als bedoeld in [artikel 1 van de WVO][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel1
    url: https://wetten.overheid.nl/BWBR0026643/2014-12-23#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '1'
  - number: 1.d
    text: '*minister:* Minister van Onderwijs, Cultuur en Wetenschap;'
    url: https://wetten.overheid.nl/BWBR0026643/2014-12-23#Artikel1
  - number: 1.e
    text: |-
      *WVO:* de [Wet op het voortgezet onderwijs][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002399
    url: https://wetten.overheid.nl/BWBR0026643/2014-12-23#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002399
  - number: 1.f
    text: |-
      *Eindexamenbesluit:* het [Eindexamenbesluit v.w.o-h.a.v.o.-m.a.v.o.-v.m.b.o.][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004593
    url: https://wetten.overheid.nl/BWBR0026643/2014-12-23#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004593
  - number: 1.g
    text: |-
      *Inrichtingsbesluit:* het [Inrichtingsbesluit WVO][ref1].;


      [ref1]: https://wetten.overheid.nl/BWBR0005946
    url: https://wetten.overheid.nl/BWBR0026643/2014-12-23#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005946
  - number: 1.h
    text: '*stichting LOOT:* de stichting Landelijk Overleg Onderwijs en Topsport;'
    url: https://wetten.overheid.nl/BWBR0026643/2014-12-23#Artikel1
  - number: 1.i
    text: |-
      *Olympisch netwerk:* een door NOC*NSF erkend stedelijk of provinciaal samenwerkingsverband van sportorganisaties
      dat op basis van een alliantie-overeenkomst met NOC*NSF is gesloten;
    url: https://wetten.overheid.nl/BWBR0026643/2014-12-23#Artikel1
  - number: 1.j
    text: '*NOC*NSF:* het Nederlands Olympisch Comité*Nederlandse Sport Federatie;'
    url: https://wetten.overheid.nl/BWBR0026643/2014-12-23#Artikel1
  - number: 1.k
    text: |-
      *Licentie Topsporttalentschool:* een beschikking van de minister aan het bevoegd gezag van een school waarin een
      aanvraag als bedoeld in [artikel 2][ref1] wordt ingewilligd;


      [ref1]: https://wetten.overheid.nl/BWBR0026643#Artikel2
    url: https://wetten.overheid.nl/BWBR0026643/2014-12-23#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0026643
        artikel: '2'
  - number: 1.l
    text: |-
      *Loot-leerling:* een leerling waarvan is vastgesteld dat deze wordt beschouwd als topsporter op ten minste
      toptalentniveau door de NOC*NSF dan wel door het Olympisch Netwerk op basis van het statushandboek van de NOC*NSF.
    url: https://wetten.overheid.nl/BWBR0026643/2014-12-23#Artikel1
  - number: '2.1'
    text: |-
      De minister kan op grond van een aanvraag van het bevoegd gezag van een school een licentie Topsporttalentschool
      verstrekken.
    url: https://wetten.overheid.nl/BWBR0026643/2014-12-23#Artikel2
  - number: '2.2'
    text: Een aanvraag voor een licentie Topsporttalentschool wordt ingediend bij de minister.
    url: https://wetten.overheid.nl/BWBR0026643/2014-12-23#Artikel2
  - number: '2.3'
    text: |-
      Aanvragen voor een licentie Topsporttalentschool worden op volgorde van binnenkomst behandeld, met dien verstande,
      dat wanneer de aanvrager krachtens [artikel 4:5 van de Algemene wet bestuursrecht][ref1] de gelegenheid heeft gehad
      de aanvraag aan te vullen, de dag waarop de aanvulling door de minister is ontvangen, als datum van binnenkomst
      geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0026643/2014-12-23#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '2.4'
    text: Zeer zwakke en zwakke scholen komen niet in aanmerking voor een licentie Topsporttalentschool.
    url: https://wetten.overheid.nl/BWBR0026643/2014-12-23#Artikel2
  - number: '2.5'
    text: De aanvraag voor een licentie Topsporttalentschool dient uiterlijk 1 oktober van enig jaar te zijn ontvangen.
    url: https://wetten.overheid.nl/BWBR0026643/2014-12-23#Artikel2
  - number: '2.6'
    text: Stichting LOOT adviseert de minister over de aanvraag, uiterlijk 1 december van het desbetreffende jaar.
    url: https://wetten.overheid.nl/BWBR0026643/2014-12-23#Artikel2
  - number: '2.7'
    text: |-
      De minister besluit over het verstrekken van een licentie Topsporttalentschool uiterlijk 1 februari van het
      aansluitende jaar.
    url: https://wetten.overheid.nl/BWBR0026643/2014-12-23#Artikel2
  - number: '3'
    text: 'De aanvraag gaat vergezeld van de volgende documenten:'
    url: https://wetten.overheid.nl/BWBR0026643/2014-12-23#Artikel3
  - number: '3.1'
    text: |-
      Een door het Olympisch Netwerk of het NOC*NSF goedgekeurde lijst met de namen, adressen en talentniveau van de
      Loot-leerlingen.
    url: https://wetten.overheid.nl/BWBR0026643/2014-12-23#Artikel3
  - number: '3.2'
    text: |-
      Een beleidsnotitie waaruit blijkt op welke wijze de school zorg draagt voor flexibiliteit in de lesprogramma’s en
      voor flexibiliteit bij het afleggen van toetsen en examens, rekeninghoudend met de belangen van de betrokken Loot-
      leerling.
    url: https://wetten.overheid.nl/BWBR0026643/2014-12-23#Artikel3
  - number: '3.3'
    text: Het schoolplan.
    url: https://wetten.overheid.nl/BWBR0026643/2014-12-23#Artikel3
  - number: '3.4'
    text: |-
      Een schriftelijke steunverklaring van de Regionale Topsport Organisaties voor de aanvraag voor een licentie
      Topsporttalentschool.
    url: https://wetten.overheid.nl/BWBR0026643/2014-12-23#Artikel3
  - number: '4'
    text: |-
      De school, waarvoor het bevoegd gezag een aanvraag, bedoeld in [artikel 3][ref1], heeft ingediend dient te voldoen
      aan de volgende voorwaarden:.


      [ref1]: https://wetten.overheid.nl/BWBR0026643#Artikel3
    url: https://wetten.overheid.nl/BWBR0026643/2014-12-23#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0026643
        artikel: '3'
  - number: 4.a
    text: |-
      Op de school dienen tenminste 35 Loot-leerlingen ingeschreven te zijn, waarbij per sport maximaal 11 leerlingen
      meetellen. Hiervan kan worden afgeweken indien: - deze voorwaarde tot gevolg heeft dat in een bepaalde provincie
      geen enkele licentie Topsporttalentschool kan worden verstrekt. In dat geval kan een licentie Topsporttalentschool
      worden verleend aan een school die tenminste over 10 Loot-leerlingen beschikt in die provincie, waarbij maximaal
      één derde deel van de Loot-leerlingen beoefenaar is van dezelfde sport;
        - dan wel in het geval dat het een school betreft die beschikt over tenminste 20 Loot-leerlingen die onderwijs
      volgen in het VMBO, waarbij maximaal één derde van de Loot-leerlingen beoefenaar is van dezelfde sport;
    url: https://wetten.overheid.nl/BWBR0026643/2014-12-23#Artikel4
  - number: 4.b
    text: |-
      Er is een samenwerkingsverband met tenminste 3 sportbonden of verenigingen en die op het hoogste landelijk niveau
      actief zijn;
    url: https://wetten.overheid.nl/BWBR0026643/2014-12-23#Artikel4
  - number: 4.c
    text: |-
      Op de school met de licentie Topsporttalentschool is personeel aanwezig en aanspreekbaar op de afstemming van de
      werkzaamheden die verband houden met de licentie Topsporttalentschool en dat voorziet in de begeleiding van de
      Loot-leerlingen waarbij het uitgangspunt is het onderwijsniveau van deze leerlingen te behouden.
    url: https://wetten.overheid.nl/BWBR0026643/2014-12-23#Artikel4
  - number: '5.1'
    text: |-
      Stichting LOOT visiteert een school: - met een licentie Topsporttalentschool verstrekt op grond van deze
      beleidsregel, iedere keer na een periode van twee jaar te beginnen in het eerste kwartaal van het derde jaar na de
      datum waarop de licentie Topsporttalentschool is verstrekt;
        - die voorafgaand aan de inwerkingtreding van deze beleidsregel al beschikt over een licentie Topsporttalentschool,
      iedere keer na een periode van twee jaar te beginnen in het eerste kwartaal van het derde jaar na de datum waarop
      op grond van deze beleidsregel een licentie Topsporttalentschool, als bedoeld in [artikel 15][ref1], is verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0026643#Artikel15
    url: https://wetten.overheid.nl/BWBR0026643/2014-12-23#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0026643
        artikel: '15'
  - number: '5.2'
    text: |-
      Op basis van de visitaties adviseert stichting LOOT de minister of een school met een licentie Topsporttalentschool
      nog steeds voldoet aan de voorwaarden genoemd in [artikel 4][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0026643#Artikel4
    url: https://wetten.overheid.nl/BWBR0026643/2014-12-23#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0026643
        artikel: '4'
  - number: '6'
    text: |-
      De minister kan op basis van het advies van stichting LOOT bedoeld in [artikel 5][ref1] besluiten tot intrekking
      van de licentie Topsporttalentschool. De minister kan besluiten om een Topsporttalentschool die niet voldoet
      eenmalig twee jaar de tijd te geven om zich te verbeteren.


      [ref1]: https://wetten.overheid.nl/BWBR0026643#Artikel5
    url: https://wetten.overheid.nl/BWBR0026643/2014-12-23#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0026643
        artikel: '5'
  - number: '7'
    text: |-
      Indien het Olympisch netwerk of het NOC*NSF oordeelt dat een betrokken leerling niet langer kan worden beschouwd
      als een Loot-leerling, dient de desbetreffende leerling vanaf dat moment aan het reguliere onderwijsprogramma
      deel te nemen. Een reeds geëffectueerde ontheffing op grond van [artikel 9 tot en met 13][ref1] blijft van kracht,
      evenals een reeds lopende spreiding van het examen op grond van [artikel 14][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0026643#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0026643#Artikel14
    url: https://wetten.overheid.nl/BWBR0026643/2014-12-23#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0026643
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0026643
        artikel: '14'
  - number: '8'
    text: |-
      Indien met toepassing van [artikel 6][ref1] de licentie Topsporttalentschool wordt ingetrokken, behouden de
      betrokken leerlingen de onder de oorspronkelijke licentie Topsporttalentschool verkregen mogelijkheden aan die
      oorspronkelijke Topsporttalentschool.


      [ref1]: https://wetten.overheid.nl/BWBR0026643#Artikel6
    url: https://wetten.overheid.nl/BWBR0026643/2014-12-23#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0026643
        artikel: '6'
  - number: '9.1'
    text: |-
      Het bevoegd gezag dat beschikt over een licentie Topsporttalentschool kan voor Loot-leerlingen afwijken
      van de normen voor onderwijstijd als gesteld in respectievelijk de [artikelen 10, tweede lid][ref1],
      [10b, tweede lid][ref2], [10d, tweede lid][ref3], [11c, eerste lid, onder b][ref4], [11f, onder b][ref5]. en
      [12, vijfde lid van de Wet op het voortgezet onderwijs][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel10b
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel10d
      [ref4]: https://wetten.overheid.nl/BWBR0002399#Artikel11c
      [ref5]: https://wetten.overheid.nl/BWBR0002399#Artikel11f
      [ref6]: https://wetten.overheid.nl/BWBR0002399#Artikel12
    url: https://wetten.overheid.nl/BWBR0026643/2014-12-23#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 10b
      - id: ref3
        bwb_id: BWBR0002399
        artikel: 10d
      - id: ref4
        bwb_id: BWBR0002399
        artikel: 11c
      - id: ref5
        bwb_id: BWBR0002399
        artikel: 11f
      - id: ref6
        bwb_id: BWBR0002399
        artikel: '12'
  - number: '9.2'
    text: |-
      Het bevoegd gezag als bedoeld in het eerste lid richt een onderwijsprogramma per schoolsoort in dat tenminste 80%
      van de wettelijk vastgestelde onderwijstijd omvat.
    url: https://wetten.overheid.nl/BWBR0026643/2014-12-23#Artikel9
  - number: '10'
    text: |-
      Het bevoegd gezag dat beschikt over een licentie Topsporttalentschool kan in afwijking van
      [artikel 11c, eerste lid, onder a van de WVO][ref1] de Loot-leerling in de eerste twee leerjaren, ontheffing
      verlenen van de onderdelen van het onderwijsprogramma die betrekking hebben op de kerndoelen bewegen en sport
      bedoeld in [bijlage 1, onderdeel G, bij het Besluit kerndoelen onderbouw VO](onbekend).


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel11c
    url: https://wetten.overheid.nl/BWBR0026643/2014-12-23#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 11c
  - number: '11'
    text: |-
      Het bevoegd gezag dat beschikt over een licentie Topsporttalentschool kan afwijken van de
      bepalingen in de [artikelen 10, vijfde en zevende lid][ref1], [10b, vijfde en zevende lid][ref2], en
      [10d, vijfde en zevende lid, van de WVO][ref3] en van de bepalingen in de [artikelen 22, eerste lid][ref4],
      [23, eerste lid, onder a en c][ref5], [24, eerste lid, onder a en c][ref6] en
      [25, eerste lid, onder a en c van het Eindexamenbesluit][ref7] door een Loot-leerling in het vmbo ontheffing te
      verlenen voor: - maatschappijleer, lichamelijke opvoeding en één van de vakken behorende tot de beeldende vorming,
      muziek, dans of drama;
        - één of meer vakken of programmaonderdelen uit het vrije deel.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel10b
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel10d
      [ref4]: https://wetten.overheid.nl/BWBR0004593#Artikel22
      [ref5]: https://wetten.overheid.nl/BWBR0004593#Artikel23
      [ref6]: https://wetten.overheid.nl/BWBR0004593#Artikel24
      [ref7]: https://wetten.overheid.nl/BWBR0004593#Artikel25
    url: https://wetten.overheid.nl/BWBR0026643/2014-12-23#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 10b
      - id: ref3
        bwb_id: BWBR0002399
        artikel: 10d
      - id: ref4
        bwb_id: BWBR0004593
        artikel: '22'
      - id: ref5
        bwb_id: BWBR0004593
        artikel: '23'
      - id: ref6
        bwb_id: BWBR0004593
        artikel: '24'
      - id: ref7
        bwb_id: BWBR0004593
        artikel: '25'
  - number: '12'
    text: |-
      Het bevoegd gezag dat beschikt over een licentie Topsporttalentschool kan, in afwijking van [artikel 13][ref1]
      en [artikel 6d van de WVO][ref2], [artikel 26b van het Inrichtingsbesluit][ref3] en [artikel 11, lid 1][ref4] dan
      wel [artikel 12, lid 1 van het Eindexamenbesluit][ref5] een Loot-leerling in het vwo ontheffing verlenen voor: -
      lichamelijke opvoeding;
        - maatschappijleer, algemene natuurwetenschappen en culturele en kunstzinnige vorming;
        - het keuzevak bedoeld in [artikel 11, lid 1, onder c][ref6] dan wel het keuzevak bedoeld in
      [artikel 12, lid 1, onder c van het Eindexamenbesluit][ref7] of het profielkeuzevak.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel6d
      [ref3]: https://wetten.overheid.nl/BWBR0005946#Artikel26b
      [ref4]: https://wetten.overheid.nl/BWBR0004593#Artikel11
      [ref5]: https://wetten.overheid.nl/BWBR0004593#Artikel12
      [ref6]: https://wetten.overheid.nl/BWBR0004593#Artikel11
      [ref7]: https://wetten.overheid.nl/BWBR0004593#Artikel12
    url: https://wetten.overheid.nl/BWBR0026643/2014-12-23#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '13'
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 6d
      - id: ref3
        bwb_id: BWBR0005946
        artikel: 26b
      - id: ref4
        bwb_id: BWBR0004593
        artikel: '11'
      - id: ref5
        bwb_id: BWBR0004593
        artikel: '12'
      - id: ref6
        bwb_id: BWBR0004593
        artikel: '11'
      - id: ref7
        bwb_id: BWBR0004593
        artikel: '12'
  - number: '13'
    text: |-
      Het bevoegd gezag dat beschikt over een licentie Topsporttalentschool kan, in afwijking van
      [artikel 14][ref1] en [artikel 6d van de WVO][ref2], [artikel 26c van het Inrichtingsbesluit][ref3] en
      [artikel 13, lid 1 van het Eindexamenbesluit][ref4] een Loot-leerling in het havo ontheffing verlenen voor: -
      lichamelijke opvoeding;
        - maatschappijleer en culturele en kunstzinnige vorming;
        - het keuzevak bedoeld in [artikel 13, lid 1, onder c van het Eindexamenbesluit][ref5] of het profielkeuzevak.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel6d
      [ref3]: https://wetten.overheid.nl/BWBR0005946#Artikel26c
      [ref4]: https://wetten.overheid.nl/BWBR0004593#Artikel13
      [ref5]: https://wetten.overheid.nl/BWBR0004593#Artikel13
    url: https://wetten.overheid.nl/BWBR0026643/2014-12-23#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 6d
      - id: ref3
        bwb_id: BWBR0005946
        artikel: 26c
      - id: ref4
        bwb_id: BWBR0004593
        artikel: '13'
      - id: ref5
        bwb_id: BWBR0004593
        artikel: '13'
  - number: '14'
    text: |-
      In uitzonderlijke gevallen kan het bevoegd gezag, dat beschikt over een Topsporttalentschool, voor een Loot-
      leerling beroep doen op [artikel 59 van het Eindexamenbesluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel59
    url: https://wetten.overheid.nl/BWBR0026643/2014-12-23#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0004593
        artikel: '59'
  - number: '16'
    text: |-
      Deze beleidsregel treedt in werking met ingang van de dag na de dagtekening van de Staatscourant waarin zij wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0026643/2014-12-23#Artikel16
  - number: '18'
    text: De beleidsregel wordt voor 1 januari 2019 geëvalueerd.
    url: https://wetten.overheid.nl/BWBR0026643/2014-12-23#Artikel18
  - number: '19'
    text: |-
      Deze beleidsregel wordt aangehaald als: Beleidsregel verstrekking licentie Topsporttalentschool VO. Deze
      beleidsregel zal met de toelichting in de Staatscourant worden geplaatst en bekend worden gemaakt op de
