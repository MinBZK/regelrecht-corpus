  - number: 7.4 -4
    text: >-
      Ladders die bestemd zijn om door één persoon te worden belast, dienen tenminste te voldoen aan de Nederlandse norm
      NEN 2484:1989 "Draagbaar klimmaterieel Ladders en trappen. Termen, definities, eisen, beproevingsmethoden, gebruik
      en onderhoud", inclusief correctieblad C1:1990. Ladders die bestemd zijn om door meerdere personen gelijktijdig te
      worden gebruikt hebben een dienovereenkomstige veiligheid.
    url: https://wetten.overheid.nl/BWBR0013042/2006-03-22#Artikel7.4_-4
  - number: 7.4 -5
    text: |-
      Deze beleidsregel bestaat uit twee delen: l de uitgangspunten en II een uitwerking voor de veel voorkomende staande
      stalen steigers.

      1 Aan [artikel 7.4, van het Arbeidsomstandighedenbesluit][ref1] wordt voor wat betreft steigers voldaan, indien
      deze in overeenstemming zijn met het gestelde in de volgende normbladen, met dien verstande dat de hierna, onder
      2, genoemde afwijkingen daarop zijn toegestaan. a. NEN 6700:1991 "Technische grondslagen voor bouwconstructies.
      TGB 1990 – Algemene basiseisen", inclusief aanvulling A1:1997, b. NEN 6702:1991 Technische grondslagen voor
      bouwconstructies. TGB 1990 – Belastingen en vervormingen", inclusief aanvulling A1:1997, c. NEN 6710:1991
      "Technische grondslagen voor bouwconstructies. TGB 1990 – Alummium-constructies – Basiseisen en basisrekenregels
      voor overwegend statisch belaste constructies", inclusief aanvulling A1:1997, d. NEN 6760:1997 "Technische
      grondslagen voor bouwconstructies. TGB 1990 – Houtconstructies – Basiseisen – Eisen en bepalingsmethoden",
      e. NEN 6770:1997 "Technische grondslagen voor bouwconstructies. TGB 1990 – Staalconstructies – Basiseisen en
      basisrekenregels voor overwegend statisch belaste constructies", f. NEN 6771:2000, "Technische grondslagen voor
      bouwconstructies. TGB 1990 – Staalconstructies – Stabiliteit", g. NEN 6772:2000, "Technische grondslagen voor
      bouwconstructies. TGB 1990 – Staalconstructies – Verbindingen",

      2 Op de in het eerste iid genoemde normbladen zijn de volgende afwijkingen toegestaan: a. De in rekening te
      brengen veranderlijke verticale belasting op een vloer is tenminste gelijk aan de optredende belasting, doch
      met minder dan een gelijkmatig verdeelde belasting van 1.5 kN/m2 of een geconcentreerde last van 1.5 kN werkend
      op een vloeroppervlak van 0.50 x O 50 m indien dit voor enig onderdeel van de constructie ongunstiger is. Voor
      delen (plank, schot) van de steigervloer smaller dan 0.50 in mag de geconcentreerde last voor de berekening van
      dat vloerdeel evenredig worden verkleind echter met lager dan tot 1 kN b. Wat betreft het aantal vloeren voor
      de bepaling van de belasting wordt er gerekend met de aanwezigheid van tenminste twee belaste en drie onbelaste
      vloeren, tenzij vaststaat dat de werkelijke constructie minder belast is. c. De randbeveiliging (hekwerken en
      leuningen) voldoet aan het gestelde in [beleidsregel 3.16, Arbobesluit][ref2] (voorzieningen bij valgevaar). d.
      Ten aanzien van de windbelasting kan bij steigers die met langer dan 1,5 jaar worden gehandhaafd de in rekening
      te brengen winddruk met 15 % worden verminderd. Voor personen en materialen wordt gerekend met een totale door de
      wind getroffen hoogte van tenminste O,40 m, tenzij er op de betreffende punten al andere door de wind getroffen
      vlakken van 0,40 m of meer in rekening zijn gebracht. e. Voor de invloed van bouwfouten, ongewilde scheefstand,
      stoten, remkrachten e.d. wordt 2% van de nuttige belasting en van het eigen gewicht in rekening gebracht. f. De in
      rekening te brengen belasting is de ongunstigste combinatie van 1° of 2°: 1°. – 75 % van de veranderlijke belasting
      – de eigen massa – de windbelasting – de bijzondere invloeden 2°. – de veranderlijke belasting – de eigen massa –
      de bijzondere invloeden g. De belastingfactoren zijn tenminste 1,5 voor de eigen massa en 1.7 voor de veranderlijke
      belasting.

      De in deel l vermelde uitgangspunten zijn voor de veel gebruikte stalen steigers herleid tot de hierna vermelde
      regels, die bij naleving in de toepassing nadere berekening van dergelijke steigers overbodig maakt.

      3 Het basis-element van deze steigers vormt de stalen pijp met een buitendiameter van 48,3 mm en een wanddikte van
      3,2 mm, overeenkomstig het gestelde in Ontwerp NEN-EN 39:1996 "Stalen buizen voor toepassing in systeemsteigers.
      Technische leveringsvoorwaarden". Deze pijpen: a. hebben over de gehele lengte een ronde doorsnede en zijn op het
      oog beoordeeld recht; b. zijn vrij van scheuren, indeukingen, sterke roestvorming, interingen en andere gebreken en
      c. zijn niet koud vervormd, bijvoorbeeld door afplatten of buigen.

      4 De pijpen zijn onderling verbonden door koppelingen, vervaardigd van staal of smeedbaar gietijzer. Indien aan
      koppelingen is gelast, voldoen de lassen aan de waarde 3 van de International Institute of Welding-normen.

      5 Koppelingen, aangebracht op een pijp en in de lengterichting van die pijp belast met 15 kN, verschuiven met langs
      de pijp en veroorzaken geen beschadigingen. Pijpen steken altijd uit buiten een koppeling.

      6 Een laskoppeling verbindt twee pijpen in de lengterichting aan elkaar en vervormt niet bij een belasting van 9
      kN loodrecht op deze koppeling, aangebracht op de meest ongunstige plek, waarbij de pijpen er nog vast inzitten. De
      blijvende doorbuiging van de gekoppelde pijpen bedraagt na deze belasting niet meer dan 3 mm.

      7 Laskoppelingen worden niet op trek belast.

      8 Een kortelingkoppeling verbindt twee pijpen met één sluiting.

      9 Montagepennen worden samen gebruikt met laskoppelingen om staanders en liggers te verlengen en ze: a. hebben in
      het midden een kraag van tenminste 47 mm diameter; b. zijn vervaardigd van staal of smeedbaar gietijzer en passen
      met een speling van ten hoogste 10 mm in de pijpen. Ze hebben een lengte van ten minste 250 mm, tenzij ze één
      geheel vormen met een laskoppeling. In dat geval is de pen minstens even lang als de leskoppeling.

      10 Staanders rusten op voetplaten van staal of smeedbaar gietijzer. Voetplaten voldoen aan de volgende voorwaarden:
      a. ze zijn rond of vierkant en hebben ieder een oppervlakte van tenminste 225 cm2, b. een voetplaatoppervlak is
      tenminste 100cm2 groter voor elke volgende staander, die op dezelfde voetplaat steunt; c. de dikte van de voetplaat
      bedraagt tenminste 6 mm. d. zoveel mogelijk in het midden van de voetplaat is een stalen pen of pijp aangebracht
      met een lengte van tenminste 80 mm en een zodanige doorsnede, dat de staander er met een speling van ten hoogste 10
      mm overheen kan worden geschoven.

      11 Kortelingsteunen, vervaardigd van staal of smeedbaar gietijzer, hebben een draagvlak in het metsetwerk met een
      lengte van ten minste 10 cm, gemeten loodrecht op het muurvlak en een dragend oppervlak van tenminste 50cm2.

      12 Verankeringsspindels zijn vervaardigd van staal en zijn met langer dan 2 m, tenzij maatregelen zijn genomen om
      knikgevaar te voorkomen. De verstelmogelijkheid is ten hoogste 200 mm.

      13 Plankbeugels zijn vervaardigd van staal en zijn voorzien van lippen die om twee planken grijpen, waarbij elke
      lip tenminste 30 mm lang is.

      14 Steigerplanken hebben een dikte van tenminste 30 mm en zijn tenminste 200 mm breed. De einden der planken zijn
      tegen inscheuren beschermd. De houtkwaliteit van de planken komt overeen met die van standaardbouwhout volgens NEN
      5461:1999 "Kwaliteitseisen voor hout (KVH 2000); Gezaagd hout en paalhout – Algemeen gedeelte" en NEN 5466:1999
      "Kwaliteitseisen voor hout (KVH2000); Houtsoorten Europees vuren, Europees grenen en Europees lariks", inclusief
      aanvulling A1:2000 en correctieblad C1:2001.

      Deze constructie-aanwijzingen hebben betrekking op steigers tot 30 in hoogte en die van maximaal 3 vloeren zijn
      voorzien, waarvan slechts één vloer wordt belast. Er wordt onderscheid gemaakt in zware en lichte steigers.

      15 Zware steigers zijn bestemd voor bouwwerkzaamheden (zoals metselwerk) en tot op zekere hoogte voor opslag
      of vervoer van materialen voor directe verwerking in het bouwwerk tot een gelijkmatig verdeelde vloerbelasting
      van ten hoogste 3 kN/m2 of een geconcentreerde belasting van 3 kN op een oppervlak van 500 x 500 mm en een
      staanderbelasting van ten hoogste 6,0 kN. Zodra gebruik wordt gemaakt van pakketten metselstenen, tegels, hout
      of zodra er meer dan één belaste vloer aanwezig is, wordt de toelaatbare belasting overschreden en zal de steiger
      zwaarder zijn uitgevoerd dan in deze standaard uitvoering is beschreven

      16 Lichte steigers zijn uitsluitend bestemd voor werkzaamheden, die worden verricht met lichte gereedschappen,
      zonder opslag van bouwmaterialen of het vervoer daarvan tot een gelijkmatig verdeelde vloerbelasting van 1,5 kN/m2
      of tot een geconcentreerde belasting van 1,5 kN en een staanderbelasting van ten hoogste 6,0 kN.

      17 De zogenaamde reparatie- en onderhoudssteigers worden tot de lichte steigers gerekend. Een steiger is in zijn
      geheel of als zware of als lichte steiger uitgevoerd.

      18 Staanders zijn loodrecht of een weinig hellend naar de muur geplaatst. De staanders rusten op voetplaten, die
      tegen verzakken zijn verzekerd en zodanig onderstopt, dat ze over tenminste 95% van de oppervlakte dragen. De
      lengte van staanderpijpen is tenminste 4 m lang. Bij verlengde staanders hebben de onderste pijpen om de andere een
      lengteverschil van ten minste 1,5 m en mag de bovenste pijp korter zijn dan 4 m.

      19 De laskoppelingen van twee opeenvolgende verlengde staanders zijn niet tussen dezelfde liggers aangebracht.

      20 Ter plaatse van twee elkaar snijdende buitenvlakken van een steiger is een staander geplaatst. De afstand tussen
      de muur en de aan de muurzijde geplaatste staanders bedraagt bij zgn "dubbele" steigers ten hoogste 30 cm. Indien
      een of meer staanders niet op de grond steunen, is de steiger ter plaatse versterkt.

      21 De steigervloer is breed genoeg om naast opslag van materialen voldoende ruimte te bieden voor transport en het
      verrichten van werkzaamheden. Hierbij is voor een lichte steiger een nuttige breedte van tenminste 0,80 m en voor
      zware (metsel-) steigers van tenminste 1,20 m het uitgangspunt.

      22 Een steiger die alleen dient voor incidentele passage van personen of voor overwegend staand werk kan volstaan
      met een nuttige breedte van tenminste 0,60 m of met tenminste 0,80 m indien hierover materialen worden vervoerd.
      Wanneer op de loopbrug gebruik wordt gemaakt van transportmiddelen, dan is de loopbrug minimaal 0,40 m breder dan
      het breedste transportmiddel.

      23 De afstand tussen opeenvolgende staanders bedraagt bij zware steigers niet meer dan in tabel 1 en bij lichte
      steigers niet meer dan in tabel 2 is aangegeven.
