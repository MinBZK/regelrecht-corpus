  - number: 7.4 -3
    text: |-
      1 Vierwielige trekkers met een massa groter dan 800 kg zijn ter voldoening aan
      [artikel 7.4, eerste en tweede lid, van het Arbeidsomstandighedenbesluit,][ref1] ter bescherming van de bestuurder
      of meerijder(s) tegen het gevaar van kantelen of achter overslaan, uitgerust met een doelmatige veiligheids-cabine,
      -frame of -beugel.

      In geval zij zijn voorzien van een open veiligheidsframe of -beugel zijn zij tevens uitgerust met
      veiligheidsgordels voor de zitplaatsen van bestuurder en meerijder(s);

      2 De doelmatigheid van een veiligheidscabine, -frame of -beugel kan worden aangetoond, indien:

      a. de sterkte, de inrichting en de bevestiging op de trekker met goed gevolg is beproefd volgens de OECD-normen
      "OECD Standaard codes voor het officieel beproeven van landbouw en bosbouwtrekkers. Codes 1 tot en met 8", 1995 en

      b. ten aanzien daarvan:

      1°. een EEG-goedkeuringsmerk is toegekend ingevolge de richtlijnen betreffende kantel-beveiligingsinnchtingen
      op landbouw of bosbouwtrekkers op wielen 77/536 EEG(PbEG L 220), laatstelijk gewijzigd bij [richtlijn 89/680]
      (31989L0680) EEG (PbEG L 398) en 79/622 EEG (PbEG L 179), laatstelijk gewijzigd bij [richtlijn 88/413](31988L0413)
      (PbEO L 200) of

      2°. een certificaat of merk van goedkeuring werd afgegeven ingevolge de [Warenwet][ref2].

      3 Aan de doelmatigheid wordt tevens voldaan door beveiligingsmiddelen van het type:

      a. uitgevoerd volgens tekening van de Arbeidsinspectie nr 15653 ("Beugel voor kuilhooprijden"), registratienummer
      van de Arbeidsinspectie 001; of

      b. fabrikaat Sirocco B.V. systeem "Binger Seilzug", registratienummer van de Arbeidsinspectie 002;l of

      c. fabrikaat Georg Fritzmeier KG, veiligheidsframe 66, veiligheidsbeugel 77, 77H, 77K, 87 en 88, registratienummer
      van de Arbeidsinspectie 003; of

      d. fabrikaat Firma Adoif Sebald Maschinenbau, systeem "Sebald-Sicherheitsbugel zur Nachrustung", registratienummer
      van de Arbeidsinspectie 004.

      4 Ter voldoening aan het gestelde in [artikel 7.4, derde lid, van het Arbeidsomstandighedenbesluit][ref3] zijn de
      in het eerste lid van deze beleidsregel bedoelde trekkers uitgerust met een laag aankoppelpunt om het gevaar voor
      achteroverslaan te voorkomen.


