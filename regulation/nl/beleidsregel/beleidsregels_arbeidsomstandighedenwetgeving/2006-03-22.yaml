      b. Indien sprake is van meer dan één slachtoffer wordt het boetebedrag als volgt verhoogd:

      1°. in geval van twee slachtoffers wordt het boetebedrag met anderhalf vermenigvuldigd,

      2°. bij drie of meer slachtoffers wordt het boetebedrag met twee vermenigvuldigd, met dien verstande dat het
      boetebedrag per beboetbaar feit de per categorie vastgestelde maximale bedragen (€ 4.500 of € 11.250) niet
      overschrijdt.

      c. Indien sprake is van één slachtoffer wordt het boetebedrag verlaagd door het met driekwart te vermenigvuldigen
      als voldaan wordt aan de volgende drie voorwaarden:

      1°. in de boetebeschikking wordt één beboetbaar feit vermeld,

      2°. in de twee jaar voorafgaand aan het arbeidsongeval heeft zich geen ander arbeidsongeval voorgedaan als bedoeld
      in [artikel 1, derde lid, onderdeel i, van de Arbowet 1998][ref13] in het bedrijf of de instelling, dan wel,
      wanneer het gaat om een bedrijf of instelling met meerdere locaties of filialen, op de betreffende locatie of in
      het betreffende filiaal van het bedrijf of de instelling.

      3°. het beboetbare feit dat de directe aanleiding is geweest voor het arbeidsongeval kan mede aan het slachtoffer
      verweten worden. Hiervan is sprake als het slachtoffer zich, tegen de instructies van de werkgever in, niet aan de
      bij of krachtens de [Arbowet 1998][ref14] opgelegde verplichtingen heeft gehouden.

      9 Indien blijkt dat er bij een beboetbaar feit sprake is van bijzondere omstandigheden, kan van deze beleidsregel
      worden afgeweken. In dat geval wordt het belang van toepassing van de beleidsregel afgewogen tegen de gevolgen
      die onverkorte toepassing van de beleidsregel voor de belanghebbende zou hebben. Er kan worden besloten tot het
      niet opleggen of verlagen van een boete voor een bepaald feit. Als bijzondere omstandigheden kunnen genoemd worden
      overmachtsituaties, nieuwe feiten en/of evidente fouten.


