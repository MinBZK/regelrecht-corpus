      1 In deze beleidsregel wordt verstaan onder:

      a. verontreinigde grond en verontreinigd grondwater: grond die en grondwater dat op basis van de
      __REF000___________________________________________________________________________________________________________
      ________________________________________________(Stcrt. 2000, 39) als zodanig wordt gekenmerkt;

      b. MAC-waarde: de wettelijke grenswaarde of bij het ontbreken daarvan, de bestuurlijke grenswaarde of, bij
      het ook ontbreken van een bestuurlijke grenswaarde, de door de werkgever zelf vastgestelde waarde, bedoeld in
      [beleidsregel 4.2 -1][ref2];

      c. een vluchtige stof of vluchtige verontreiniging: een stof of verontreiniging met een kookpunt lager dan 350 oC
      én een dampspanning (uitgedrukt in millibar bij 20 oC), groter dan éénduizendste van de MACwaarde van die stof of
      verontreiniging (met andere woorden, indien 103 P > MAC);

      d. serpentijnasbest: stoffen die het vezelachtige silicaat chrysotiel bevatten;

      e. amfiboolasbest: stoffen die de vezelachtige silicaten crocidoliet, amosiet, actinoliet, anthofylliet of
      tremoliet bevatten.

      2 In deze beleidsregel wordt, in aanvulling op de in het eerste lid, onder a, genoemde circulaire, onder
      verontreinigde grond of verontreinigd grondwater tevens verstaan: grond of grondwater waarin zich asbest bevindt in
      een concentratie, hoger dan de gewogen norm van 100 mg/kg droge stof (serpentijnasbestconcentratie, vermeerderd met
      tien maal de amfiboolasbestconcentratie).

      3 In deze beleidsregel wordt, in aanvulling op de in het eerste lid, onder a, genoemde circulaire, onder
      verontreinigde grond tevens verstaan: grond waarvan het gehalte steenachtige of andere materialen meer dan 20-
      volumeprocenten bedraagt.

      4 Onder het doeltreffend vaststellen van de mate van blootstelling aan stoffen die gevaar voor de gezondheid
      of veiligheid kunnen opleveren door middel van metingen of andere methodes dan metingen, als bedoeld in
      [artikel 4.2, derde lid, van het Arbeidsomstandighedenbesluit][ref3], wordt, bij het werken

      a. in of met verontreinigd grondwater, of

      b. in of met verontreinigde grond waarin de concentratie van één of meer stoffen de interventiewaarde ‘I’ zoals
      vermeld in de circulaire, bedoeld in het eerste lid, onder a, overschrijdt, of

      c. in of met verontreinigde grond waarin de concentratie van geen enkele stof de genoemde interventiewaarde ‘I’
      overschrijdt, maar waarbij de som van de quotiënten, samengesteld uit de concentratie van de verschillende stoffen
      in de grond (in mg/kg) als teller, en de MAC-waarde van die stoffen (in mg/m3) als noemer, groter is dan 20.000.
      Met andere woorden:












