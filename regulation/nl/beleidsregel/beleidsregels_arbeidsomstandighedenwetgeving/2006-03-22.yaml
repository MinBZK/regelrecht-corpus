  - number: '6.8'
    text: >-
      1 Bij overschrijding van de grens van 85 dB(A) op de arbeidsplaats kan beperking van het equivalente geluidsniveau
      op de arbeidsplaats tot een waarde van maximaal 85 dB(A) door maatregelen aan de bron in termen van technische
      haalbaarheid in redelijkheid niet worden gevergd wanneer de geluidsproductie van de machines die het geluid
      veroorzaken overeenkomt met de algemeen erkende stand van de lawaaibestrijdingstechniek in de bedrijfstak en
      de stand van de techniek in algemene zin. Daaraan wordt voldaan door machines die in vergelijking met andere,
      overigens vergelijkbare machines op de markt behoren tot de stilste 20% bij de onderlinge vergelijking van de
      geluidsproductie van machines dienen de door de fabrikant verstrekte gegevens als uitgangspunt. De methode om vast
      te stellen of machines aan genoemde voorwaarden voldoen is vastgelegd in de norm NEN-EN-ISO 11689:1997 "Akoestiek.
      Procedure voor de vergelijking van geluidsemissie-gegevens van machines en apparaten".


      2 In specifieke situaties waarin toepassing van machines die beantwoorden aan de stand van de
      lawaaibestrijdingstechniek op grond van operationele of economische overwegingen met haalbaar is, geldt dat alleen
      machines gebruikt kunnen worden waarvan de geluidsproductie zover is teruggebracht als met gebruikmaking van
      algemeen gangbare voorzieningen voor lawaaibestrijding mogelijk is.


      3 De werkgever vervangt machines waarvan de geluidsproductie niet beantwoordt aan bovengenoemde criteria wanneer de
      economische levensduur is verstreken. Zolang de economische levensduur nog niet is verstreken, beperkt de werkgever
      op grond van het derde en vierde lid de geluidsoverdracht naar de arbeidsplaats en de blootstelling aan schadelijk
      geluid van de betrokken werknemers zoveel als mogelijk is met gebruikmaking van de algemeen gangbare voorzieningen
      voor lawaaibestrijding.


      4 De plicht tot vervanging van machines waarvan de geluidsproductie op grond van eerder genoemde criteria te
      hoog is, geldt in beginsel voor alle arbeidssituaties waarin het equivalente geluidsniveau op de arbeidsplaats
      hoger is dan 85 dB(A). Wanneer de totale blootstelingsduur echter zodanig kort is dat het geluidsdosisniveau van
      de betrokken werknemer(s) gedurende een representatieve werkdag (overeenkomstig NEN 3419:1992 "Ergonomie. Meting
      van geluid op de arbeidsplaats. Uitgebreid onderzoek"), met hoger is dan 80 dB(A), kan vervanging van lawaaiige
      machines in redelijkheid niet worden gevergd.


      5 Beperking van het geluidsniveau op de arbeidsplaats als gevolg van het verrichten van werkzaamheden tot ten
      hoogste 85 dB(A) kan in redelijkheid niet worden gevergd wanneer genoemde grens wordt overschreden ondanks het
      feit dat betreffende werkzaamheden worden uitgevoerd overeenkomstig de algemeen erkende stand van de techniek of,
      wanneer dat op grond van operationele of economische haalbaarheid niet mogelijk is, als bij de uitvoering van de
      betreffende werkzaamheden de algemeen gangbare voorzieningen voor lawaaibestrijding worden toegepast.


      6 Wanneer het geluidsniveau op de arbeidsplaats door lawaaibestrijding aan de bron door toepassing van de stand van
      de techniek of van de algemeen gangbare voorzieningen voor lawaaibestrijding in redelijkheid niet tot beneden 85
      dB(A) kan worden teruggebracht, beperkt de werkgever de geluidsoverdracht naar de arbeidsplaats met gebruikmaking
      van de algemeen gangbare voorzieningen voor lawaaibestrijding zodanig dat het geluidsniveau waaraan de berokken
      werknemers zijn blootgesteld zoveel mogelijk tot beneden 85 dB(A) wordt gereduceerd.


      7 Beperking van het geluidsniveau op de arbeidsplaats tot beneden 85 dB(A) door het treffen van voorzieningen
      ter beperking van de geluidsoverdracht kan in redelijkheid met worden gevergd wanneer toepassing van de algemeen
      gangbare voorzieningen voor lawaaibestrijding ontoereikend is om dit resultaat te bereiken.


      8 De werkgever voorkomt vergroting van het gevaar bij gebruik van gehoorbeschermingsmiddelen door de volgende
      voorzorgen in acht te nemen: a. de gehoorbeschermers bieden een voldoende maar niet overmatige geluiddemping;
      b. akoestische waarschuwingssignalen zijn zodanig dat zij ook bij gebruik van gehoorbeschermers duidelijk
      hoorbaar zijn; c. in gevallen dat richtinghoren van overwegend belang is voor de veiligheid, biedt de werkgever
      gehoorbeschermers aan die dit richtinghoren zo weinig mogelijk in negatieve zin beïnvloeden.


      9 In situaties waarvoor deze maatregelen ontoereikend zijn om ongevallen te voorkomen, neemt de werkgever
      aanvullende maatregelen, zoals: a. akoestische gevaarsignalering aanpassen danwel aanvullen met lichtsignalen,
      bijvoorbeeld zwaailichten; b. het toepassen van draadloze communicatiemiddelen, ingebouwd in de te gebruiken
      gehoorbeschermingsmiddelen; hierbij ziet de werkgever erop toe dat het geluidsniveau in de gehoorgang met hoger is
      dan 80 dB(A) of, als dit technisch niet mogelijk is, met hoger dan 85 dB(A).


      10 Gehoorbeschermers worden afgestemd op de omstandigheden ter plaatse door met name de volgende factoren
      mee in overweging te nemen: a. de klimaatomstandigheden op de arbeidsplaats; b. de aard van de uit te voeren
      werkzaamheden; c. de hoeveelheid vrije ruimte op de arbeidsplaats; d. de eventuele noodzaak gehoorbeschermers te
      gebruiken in combinatie met andere persoonlijke beschermingsmiddelen.


      11 Afstemming van gehoorbeschermers op de ergonomische eisen en de vereisten met betrekking tot de gezondheid van
      de werknemer geschiedt door rekening te houden met de volgerde zaken: a. het draagcomfort van de gehoorbeschermers;
      b. de persoonlijke voorkeur van de werknemers voor een bepaald type gehoorbeschermers; c. medische aspecten die een
      beletsel kunnen vormen voor het gebruik van bepaalde typen gehoorbeschermers.


      12 De werkgever zorgt ervoor dat de aangeboden gehoorbeschermers geschikt zijn voor de drager door de gebruikers
      een keuze te bieden uit verschillende typen gehoorbeschermers die alle voldoende demping bieden voor de situatie
      waarin de gehoorbeschermers worden gebruikt.


      13 De werkgever selecteert gehoorbeschermers die een demping van het geluid op de arbeidsplaats bieden tot
      een equivalent geluidsniveau van ten hoogste 80 danwel 85 dB(A) aan de hand van de norm NEN-EN 458:1994
      "Gehoorbeschermers – Aanbevelingen voor keuze, gebruik, verzorging en onderhoud. Praktijkrichtlijn".
    url: https://wetten.overheid.nl/BWBR0013042/2006-03-22#Artikel6.8
  - number: '6.9'
    text: >-
      De werkgever treft zodanige technische en organisatorische maatregelen dat voor de werknemers die bijzondere
      taken uitvoeren het geluidsexpositieniveau, gemiddeld over een periode van een week, niet hoger is dan 85 dB(A).
      De werkgever controleert of hieraan wordt voldaan door het weekgemiddeide rechtstreeks te meten met daartoe
      geëigende apparatuur (bijv geluidsdosismeter of datalogger), of door het weekgemiddeide te berekenen overeenkomstig
      de aanwijzingen die daarvoor worden gegeven in de Nederlandse norm NEN 3419:1992 "Ergonomie. Meting van geluid
      op de arbeidsplaats. Uitgebreid onderzoek". Beperking van het geluidsexpositieniveau tot maximaal 85 dB(A) kan
      in redelijkheid niet worden gevergd wanneer het geluidsniveau op de plaatsen waar de bijzondere taken worden
      uitgevoerd overeenkomt met de stand van de techniek voor de betrokken geluidsbronnen en wanneer er bovendien sprake
      is van bijzondere omstandigheden die een beroep op de redelijkerwijs-clausule rechtvaardigen.
