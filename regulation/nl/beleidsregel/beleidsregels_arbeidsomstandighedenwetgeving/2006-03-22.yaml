  - number: '6.15'
    text: |-
      1 De werkinstructie, bedoeld in [artikel 6.15, eerste lid, onder a. van het Arbeidsomstandighedenbesluit,][ref1]
      wordt als deugdelijk aangemerkt indien bij de weergave van de veiligheidsvoorzieningen en de noodprocedures ten
      minste aandacht is besteed aan:

      a. Verantwoordelijkheden en bevoegdheden

      b. Materieel en onderhoud

      c. Duikprocedures

      d. Inschakeling reserveduiker

      e. Voorzieningen en procedures voor situaties die afwijken van de algemeen voorkomende werksituaties

      f. Richtlijnen voor decompressie

      g. Ongevalsmelding en medische hulp

      h. Samenstelling en gebruik van de EHBO-uitrusting.

      2 Het aan de werknemers ter beschikking te stellen materieel als bedoeld in
      [artikel 6.15, eerste lid, onder b, van het Arbeidsomstandighedenbesluit][ref2] bestaat ten minste uit:

      a. voorzieningen waarmee de ploegleider en de duikers met elkaar kunnen communiceren, waartoe in elk geval wordt
      gerekend een seinlijn van voldoende sterkte voor iedere duiker, indien de aard van de arbeid het gebruik van een
      seinlijn toelaat;

      b. voorzieningen waarmee de duiker op veilige wijze in en uit de vloeistof kan komen, waarin duikarbeid wordt
      verricht;

      c. een voorziening waardoor de ploegleider voortdurend op de hoogte kan zijn van de diepte waarop de duiker zich
      bevindt;

      d. indien de duiklocatie niet of onvoldoende verlicht is, een aan de duiker bevestigde voorziening die de positie
      van de duiker bij verblijf aan de oppervlakte aangeeft, alsmede verlichting van de plaats vanwaar wordt gedoken;

      e. voorzieningen om de lichaamstemperatuur van de duiker op peil te houden, indien het gevaar bestaat dat die
      temperatuur te veel daalt of stijgt;

      f. een duiksysteem (waaronder ten minste een duikklok), indien wordt gedoken naar een diepte van 50 meter of meer;

      g. een voorziening die tijdens duikarbeid het ademgas aan de duiker toevoert;

      h. een voorziening om bij het duiken met oppervlakteademgasvoorziening (SSE) bij het gebruik van ademgas anders
      dan lucht, de kwaliteit van het ademgas aan de oppervlakte permanent te bewaken, alsmede een alarmsysteem dat een
      afwijking van de vereiste samenstelling onmiddellijk meldt.

      3 Met betrekking tot het ter beschikking te stellen ademgas als bedoeld in
      [artikel 6.15, eerste lid, onder b][ref3], wordt het volgende in acht genomen.

      a. Er is sprake van voldoende ademgas wanneer de duiker gebruik kan maken van een zodanige hoeveelheid reserve-
      ademgas dat hij in geval van nood de duik op veilige wijze kan afbreken.

      b. Bij gebruik van individuele onafhankelijke ademgasvoorziening – zoals bij scuba duikers – wordt, ter
      vaststelling van de voor een bepaalde activiteit geschikte kwaliteit ademgas, bij het gebruik van ademgas anders
      dan lucht net vóór aanvang van een duik de samenstelling van het gasmengsel gecontroleerd.

      4 Voor de in [artikel 6.15, eerste lid, onder c][ref4], juncto
      [artikel 6.16, zevende lid, van het Arbeidsomstandighedenbesluit][ref5] bedoelde persoon die de werknemers medisch
      kan begeleiden geldt ten minste het volgende:

      a. Wanneer deze duikmedische begeleider een lid is van de duikploeg, mag hij niet zelf duiken noch mag hij in de
      voorafgaande 12 uur dieper dan 9 meter gedoken hebben.

      b. Uitsluitend ingeval de duikploeg uit 2 personen mag bestaan (ingevolge [artikel 6.16, vierde lid][ref6]) kan de
      duikmedische begeleider als ploegleider en reserveduiker optreden, het onder a genoemde 12-uurscriterium vervalt
      dan.

      5 De eerste-hulpuitrusting is adequaat als bedoeld in [artikel 6.15, eerste lid, onder d][ref7], indien:

      a. deze wordt vastgesteld in overeenstemming met de arts bedoeld in [artikel 6.15, tweede lid][ref8], en een door
      deze arts op schrift gestelde verklaring van de vastgestelde inhoud is bijgevoegd;

      b. een zuurstofkoffer daarvan deel uitmaakt.

      6 Onder de hierna te noemen omstandigheden is sprake van een voorzienbare kans dat de duikers in moeilijkheden
      raken, bedoeld in [artikel 6.16, vierde lid, van het Arbeidsomstandighedenbesluit][ref9]:

      a. de reserveduiker kan duikuitrusting niet zelf aantrekken;

      b. slecht zicht, te weten: op minder dan 1 meter zijn personen of voorwerpen niet duidelijk zichtbaar;

      c. onmogelijkheid vrij op te stijgen;

      d. aanwezigheid obstakels;

      e. betreding van holle ruimten.

      7 Een geschikte compressiekamer als bedoeld in [artikel 6.18, eerste lid][ref10], voldoet aan de eisen die
      onafhankelijke classificatiebureaus stellen. Zij heeft in ieder geval de volgende voorzieningen:

      a. de constructie is zodanig dat deze de benodigde decompressiedruk ruimschoots kan weerstaan;

      b. aan de compressiekamer kan ademhalingsgas worden toegevoerd voor therapeutische recompressie;

      c. de temperatuur in een compressiekamer is zodanig dat zij een optimale decompressie waarborgt;

      d. in de compressiekamer bevindt zich een brandblusinstallatie, die onder overdruk bruikbaar is;

      e. vanuit de compressiekamer is voortdurend telefonisch contact mogelijk met de persoon die de werknemers adequaat
      medisch begeleiden kan, bedoeld in [artikel 6.15, eerste lid, onder c][ref11].

      8 Ten aanzien personen die arbeid verrichten bestaande uit de instructie van sportduikers, bedoeld in
      [artikel 6.13, derde lid, van het Arbeidsomstandighedenbesluit][ref12] en leerlingen en studenten als bedoeld in
      [artikel 6.31, van het Arbeidsomstandighedenbesluit][ref13] zijn niet van toepassing:

      a. de materieeleisen, bedoeld in het tweede lid, de onderdelen a, c, d, f en h. Wel gelden de materieeleisen zoals
      gebruikelijk in de sportduikwereld;

      b. de eisen aan de eerste-hulpuitrusting, bedoeld in het vijfde lid, onderdelen a en b. Wel is ten minste een
      eerste-hulpuitrusting aanwezig zoals voorgeschreven door de Nederlandse Onderwatersportbond.


