  - number: 4.4 -4
    text: |-
      Ten aanzien van de aanwezigheid van of het werken met cyaanverbindingen, respectievelijk waterstoffluoride worden
      de volgende voorzieningen adequaat geacht ter beperking van de gevolgen van een ongewilde gebeurtenis als bedoeld
      in [artikel 4.4, vierde lid, van het Arbeidsomstandighedenbesluit][ref1].

      1 Indien gewerkt wordt met of in aanwezigheid van cyaanverbindingen

      a. is een protocol aanwezig waarin aangegeven is wie de eerste levensreddende handelingen verricht en hoe de
      verdere medische noodhulp is geregeld, dit zal in de regel de behandelende arts in het dichtstbijzijnde ziekenhuis
      zijn,

      b. is de in het protocol aangewezen behandelende arts deskundig op het gebied van de behandeling van
      cyanidevergiftigingen,

      c. is een speciale EHBO-kit aanwezig met daarin de noodzakelijke antidotes naar de laatste stand van de medische
      wetenschap, die in voldoende mate aanwezig dienen te zijn voor de adequate bestrijding van de vergiftiging van alle
      mogelijke slachtoffers door cyanides. Deze EHBO-kit wordt meegegeven aan het ambulancepersoneel ten behoeve van de
      behandelende arts. De medicamenten in deze kit worden tijdig ververst. Dit onderdeel c geldt niet voor zeeschepen.

      d. is, met uitzondering van situaties waarbij de stof in de vorm van lading wordt vervoerd over de weg, per spoor
      of per binnenvaartschip, een cylinder 100% zuurstof met beademingsdeel aanwezig.

      2 Indien gewerkt wordt met of in aanwezigheid van fluorwaterstof (HF):

      a. is een protocol aanwezig waarin aangegeven is wie bij een incidentele blootstelling van personen aan
      waterstoffluoride medicamenten mag toedienen en hoe de verdere medische noodhulp is geregeld,

      b. is de in het protocol aangewezen persoon deskundig op het gebied van de behandeling van
      waterstoffluorideblootstelling,

      c. is in een speciale EHBO-kit een voldoende hoeveelheid calciumgluconaat 10%, een hoeveelheid 2,5%
      calciumgluconaat hydrogel voor applicatie op de huid en calciumgluconaat 10% oplossing voor het indruppelen van de
      ogen, op de arbeidsplaats aanwezig om beschadiging door waterstoffluoride van de huid of de ogen van alle mogelijke
      slachtoffers adequaat te bestrijden.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4.4
    url: https://wetten.overheid.nl/BWBR0013042/2006-03-22#Artikel4.4_-4
