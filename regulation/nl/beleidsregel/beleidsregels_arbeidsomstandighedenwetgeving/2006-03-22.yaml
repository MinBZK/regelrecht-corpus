  - number: '3.6'
    text: |-
      1 Maatregelen ten behoeve van een veilige ontvluchting van gebouwen in noodsituaties, worden aangemerkt als
      doeltreffend in de zin van [artikel 3.6, eerste lid, van het Arbeidsomstandighedenbesluit][ref1] wanneer deze in
      overeenstemming zijn met de door het Ministerie van Binnenlandse Zaken uitgegeven brandbeveiligingsconcepten.

      2 Voor het aantal de plaats en de afmetingen van de beschikbare vluchtwegen- en nooduitgangen in gebouwen als
      bedoeld in het [tweede lid van artikel 3.6][ref2], geeft het [Bouwbesluit][ref3] (Woningwet) voorschriften.
      Bedrijfsgebouwen die aan de eisen van het [Bouwbesluit][ref4] voor te bouwen gebouwen voldoen, voldoen aan de eisen
      van het [tweede lid van artikel 3.6][ref5]. Voor bestaande gebouwen worden deze eisen naar redelijkheid toegepast.

      3 In aanvulling op het [Bouwbesluit][ref6] zijn voor werkruimten waarin activiteiten plaatsvinden met een verhoogd
      risico, twee uitgangen vereist. De uitgangen liggen tenminste 5 meter uiteen en bij voorkeur in tegenovergestelde
      wanden.

      Ramen, luiken en dergelijke niet voor normaal gebruik bestemde uitgangen, kunnen een alternatieve gelegenheid tot
      ontkoming bieden, mits het verlaten van de ruimte langs die weg gemakkelijk en veilig kan geschieden.

      4 Voor arbeidsplaatsen in ruimten, die geen deel uitmaken van een gebouw, zijn twee onafhankelijke vluchtwegen
      beschikbaar. Indien de plaats, constructie en inrichting van een vluchtweg een veilige ontkoming waarborgt, kan
      worden volstaan met één vluchtweg.


