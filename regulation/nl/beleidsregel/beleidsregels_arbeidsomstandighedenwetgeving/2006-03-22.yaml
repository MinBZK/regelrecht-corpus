  - number: 4.18 -1
    text: |-
      Maatregelen als bedoeld in [artikel 4.18, eerste tot en met derde lid, van het Arbeidsomstandighedenbesluit][ref1]
      zijn niet doeltreffend als

      1. het blootstellingsniveau van een kankerverwekkende stof met een niet-genotoxisch
      werkingsmechanisme de wettelijke grenswaarde voor die stof, zoals opgenomen in de
      [bijlage VII van de Arbeidsomstandighedenregeling][ref2], overschrijdt;

      2. het blootstellingsniveau van een kankerverwekkende stof met een genotoxisch werkingsmechanisme de wettelijke
      grenswaarde voor die stof, zoals opgenomen in de [bijlage VII van de Arbeidsomstandighedenregeling][ref3],
      overschrijdt. Bovendien moet een zo laag mogelijk blootstellingsniveau worden nagestreefd;

      3. huidcontact aanwezig is of mogelijk blijkt met kankerverwekkende stoffen waarvoor een huidnotatie is vastgesteld
      zoals opgenomen in de lijst van grenswaarden in [bijlage VII van de Arbeidsomstandighedenregeling][ref4], of die
      kankerverwekkend zijn voor de huid. In dergelijke situaties worden doelmatige persoonlijke huidbeschermingsmiddelen
      gedragen als bedoeld in [artikel 4.18, vierde lid, van het Arbeidsomstandighedenbesluit][ref5].

      4. huidcontact aanwezig is of mogelijk blijkt met kankerverwekkende stoffen, die voldoen aan de criteria voor
      toekenning van de volgende gevaarszinnen en veiligheidsaanbevelingen (R- en S-zinnen):

      a. R21: "Schadelijk bij aanraking met de huid"

      b. R24: "Vergiftig bij aanraking met de huid"

      c. R27: "Zeer vergiftig bij aanraking met de huid"

      d. R34: "Veroorzaakt brandwonden"

      e. R35: "Veroorzaakt ernstige brandwonden"

      f. R38: "Irriterend voor de huid"

      g. R43: "Kan overgevoeligheid veroorzaken bij contact met de huid"

      h. S36: "Draag geschikte beschermende kleding"

      i. S37: "Draag geschikte handschoenen"

      In dergelijke situaties worden doelmatige persoonlijke huidbeschermingsmiddelen gedragen, als bedoeld in
      [artikel 4.18, vierde lid, van het Arbeidsomstandighedenbesluit][ref6].

      5. oogcontact aanwezig is of mogelijk blijkt met kankerverwekkende stoffen, die voldoen aan de criteria voor
      toekenning van de volgende gevaarszinnen en veiligheidsaanbevelingen (R- en S-zinnen):

      a. R34: "Veroorzaakt brandwonden"

      b. R35: "Veroorzaakt ernstige brandwonden"

      c. R36: "Irriterend voor de ogen"

      d. R41: "Gevaar voor ernstig oogletsel"

      e. S39: "Een beschermingsmiddel voor de ogen/voor het gezicht dragen"

      In dergelijke situaties worden doelmatige persoonlijke oog- of gezichtsbeschermingsmiddelen gedragen, als bedoeld
      in [artikel 4.18, vierde lid, van het Arbeidsomstandighedenbesluit][ref7].


