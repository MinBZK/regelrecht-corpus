  - number: '7.13'
    text: |-
      1 Een bedieningssysteem is veilig, als bedoeld in
      [ artikel 7.13 eerste lid, van het Arbeidsomstandighedenbesluit][ref1] indien het:

      a. voldoet aan het gestelde in NEN-EN 954-1:1997 "Veiligheid van machines – Onderdelen van besturingssystemen met
      een veiligheidsfunctie – Deel 1: Algemene ontwerpbeginselen",

      b. zodanig is uitgevoerd dat bediening steeds mogelijk blijft in situaties waarbij het bedieningssysteem niet,
      zoals voorgeschreven in [artikel 7.13, vijfde lid van het Arbeidsomstandighedenbesluit][ref2] buiten de gevaarlijke
      zone kan worden geplaatst.

      Verplaatsbare bedieningssystemen, waardoor bedienend personeel een gevaarlijke zone van een arbeidsmiddel met enig
      lichaamsdeel kan bereiken of kan binnengaan vereisen nadere maatregelen om dat tegen te gaan.

      2 In specifieke situaties, zoals bij het instellen van machines met verwijderde/overbrugde beveiligingen binnen of
      nabij de gevaarlijke zone zijn (aanvullende) constructieve aanpassingen aan het arbeidsmiddel nodig in relatie tot
      of in combinatie met het bedieningssysteem.

      Deze beleidsregel is niet van toepassing op transportmiddelen die zijn uitgesloten van de werkingssfeer van het op
      de [Warenwet][ref3] gebaseerde [Warenwetbesluit machines][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel7.13
