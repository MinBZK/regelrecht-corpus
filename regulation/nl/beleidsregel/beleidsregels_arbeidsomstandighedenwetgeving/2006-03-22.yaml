  - number: '7.34'
    text: |-
      Onder een terzake deskundig persoon in de zin van
      [artikel 7.34, eerste en tweede lid, van het Arbeidsomstandighedenbesluit][ref1] wordt verstaan een persoon die
      beschikt over aantoonbare specifieke deskundigheid op het terrein van:

      1 het lezen en begrijpen van montage-, demontage- en ombouwschema's van het betreffende type steiger;

      2 het veilig opbouwen, afbreken of ombouwen van het betreffende type steiger;

      3 kennis van de risico's en de te nemen preventieve maatregelen in verband met het vallen van hoogte, vallende
      voorwerpen, invloed van veranderende weersomstandigheden op de steiger-constructie, toelaatbare belastingen en
      ieder ander risico dat de betreffende werkzaamheden met zich meebrengt.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel7.34
    url: https://wetten.overheid.nl/BWBR0013042/2006-03-22#Artikel7.34
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '7.34'
  - number: '8.2'
    text: |-
      Onverminderd het gestelde met betrekking tot de keuze en beoordeling van persoonlijke
      beschermingsmiddelen in andere van toepassing zijnde beleidsregels wordt aan het gestelde in
      [artikel 8.2, onder a, b en c, van het Arbeidsomstandighedenbesluit][ref1] voldaan indien de keuze en beoordeling
      van persoonlijke beschermingsmiddelen zijn uitgevoerd in overeenstemming met de betreffende leidraad uit de serie
      V/E/3, uitgebracht door de Commissie van de Europese Gemeenschappen, zoals opgenomen in de 'Gids persoonlijke
      beschermingsmiddelen' van het Nederlands Normalisatie-instituut (NNI) Delft 1999.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel8.2
