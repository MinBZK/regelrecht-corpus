  - number: '3.9'
    text: |-
      1 Om aan het gestelde in [artikel.3.9][ref1] en [artikel 3 7, vijfde lid, van het Arbeidsomstandighedenbesluit][ref2]
      te voldoen bedraagt de vertichtingssterkte van de noodverhchtingsinstallatie op arbeidsplaatsen en op vluchtwegen
      minimaal 1 lux op vloerhoogte vanaf 15 seconden na het uitvallen van de normale elektriciteit tot een uur daarna.

      2 Indien bij uitval van de normale verlichting werkzaamheden moeten worden verricht (of dringende handelingen bij
      calamiteiten), dan levert de noodverlichtingsinstallatie zoveel licht dat deze werkzaamheden zonder bezwaar kunnen
      worden uitgevoerd.

      3 in ruimten zonder daglichttoetreding is altijd noodverlichting aanwezig, indien zich in deze ruimten personen
      kunnen ophouden.

      Deze beleidsregel is niet van toepassing aan boord van schepen. Voor schepen gelden de bepalingen met betrekking
      tot noodverlichting zoals opgenomen in de schepenwetgeving.


