  - number: '3.16'
    text: |-
      1 Het tegengaan van valgevaar bij het verrichten van arbeid door het aanbrengen van doelmatige hekwerken, leuningen
      e.d. (de zgn randbeveiliging) als bedoeld in [artikel 3.16, eerste lid, van het Arbeidsomstandighedenbesluit][ref1]
      is in ieder geval noodzakelijk indien het valgevaar 2,5 m of meer is indien de arbeid wordt verricht op statische
      arbeidsplaatsen en bij ieder valgevaar indien arbeid wordt verricht op arbeidsplaatsen, die daarbij in beweging
      zijn of kunnen komen.

      2 Voor arbeidsplaatsen op pluklorries, die voor 1-1-1992 in gebruik zijn genomen in champignon-kwekerijen of
      kassen, wordt randbeveiliging aangebracht bij valgevaar van 1,20 m of meer.

      3 Het tegengaan van valgevaar bij montage van liften in liftschachten vanaf een montageplatform of vanaf een
      bewegende vloer is in overeenstemming met het gestelde in [artikel 3.16, eerste lid][ref2] indien wordt voldaan aan
      de eisen voor bewegende vloeren in liftschachten, zoals werden gepubliceerd in Mededeling 236, derde kwartaal 1992
      van het Liftinstituut.

      4 Indien het valgevaar vanaf statische constructies gepaard gaat met risicoverhogende omstandigheden, zoals het
      gevaar te vallen op of langs uitstekende delen, de aanwezigheid van verkeer, het vallen in water e.d., dan wordt
      randbeveiliging ook aangebracht bij geringer valgevaar, afhankelijk van de toename van het risico.

      5 Ter bepaling van het optredende valgevaar wordt bij schuine werkvlakken uitgegaan van het hoogste punt dat kan
      worden betreden.

      6 Hekwerken cq. randbeveiligmgen worden als doelmatig aangemerkt indien:

      a. ten aanzien van de constructie

      1°. zij aan de bovenzijde zijn voorzien van een stevige leuning op tenminste 1,0 m boven het werkvlak,

      2°. zij bij open constructies aan de onderzijde aansluitend op het werkvlak zijn voorzien van een kantplank van
      15 cm hoog, indien uitsteeksels het aansluiten verhinderen, is hierop enige afwijking (15 cm) toegestaan, mits
      in overeenstemming met het gestelde in [artikel 3.17][ref3] maatregelen zijn genomen die voorkomen, dat personen
      kunnen worden getroffen door voorwerpen, die door de aldus ontstane opening(-en) vallen of rollen en

      3°. in open constructies de openingen zodanig beperkt blijven, dat een kubus met zijden van 47 cm de openingen niet
      kan passeren.

      b. ten aanzien van de sterkte

      1°. zij niet bezwijken bij een op de meest ongunstige plaats aangebrachte neerwaartse belasting van 1,25 kN
      danwel de vervorming ten gevolge van die belasting van dien aard is dat de functionaliteit van het hekwerk c.q. de
      randbeveiliging gewaarborgd blijft,

      2°. zij zijdelings niet meer dan 3,5 cm doorbuigen en niet worden verplaatst bij een horizontale belasting van 0,3
      kN en

      3°. zij in functie blijven (niet uit een aanwezige bevestiging worden getild) bij een opwaarts gerichte belasting
      van 0,3 kN.

      7 Hekwerken cq. randbeveiligingen kunnen bij niet schuine werkvlakken achterwege blijven, indien de arbeid op meer
      dan 4,0 m afstand van de rand van het werkvlak wordt uitgevoerd en de arbeidszone alsmede de weg daar naar toe
      duidelijk gemarkeerd zijn Indien de arbeidszone en de weg daar naar toe tevens zijn afgezet, kan deze afstand tot
      2,0 m beperkt worden.

      8 Werkvloeren zijn altijd gesloten of dichtgelegd. Voor afwateringsdoeleinden e.d. zijn geringe openingen
      toegestaan, die door een kubus met zijden van 8 cm met kunnen worden gepasseerd.

      9 Onder "het verrichten van arbeid waarbij valgevaar bestaat" wordt ook verstaan het zich begeven naar de
      arbeidsplaats. Doelmatige voorzieningen hiervoor kunnen ladders zijn, mits deze bij klimhoogten van 10 m of meer op
      maximale afstanden van 7,50 m zijn onderbroken door rustbordessen.

      Ladders steken tenminste 1 meter uit boven de gewenste sta- of overstaphoogte. Op het te betreden vlak is aan
      weerszijden van de toegang randbeveiliging aangebracht over een lengte van 4,0 m of sluit de toegang aan op de
      aanwezige randbeveiliging.

      10 Onder "arbeid die op veilige wijze op een ladder, trap of dergelijke kan worden verricht , wordt in
      overeenstemming met het gestelde in [artikel 3.16, tweede lid][ref4], verstaan arbeid die wordt verricht vanaf
      stabiel opgestelde staande ladders tot werkhoogten van 10,0 m of arbeid die verricht wordt vanaf permanent
      aangebrachte hangladders tot hoogten van 20,0 m, mits daarbij de te overbruggen verticale afstand niet meer dan
      10.0 m bedraagt

      11 Onder arbeid als bedoeld in [artikel 3.16, tweede lid, van het Arbeidsomstandighedenbesluit][ref5] wordt
      met verstaan arbeid verricht met een niet-permanent aangebrachte hangsteiger of hangladder of de zogenaamde
      (handbediende) klassieke bootsmanstoel. Bij arbeid met deze of soortgelijke middelen, waarbij kabels, touwen en
      dergelijke worden gebruikt, worden voorzieningen getroffen overeenkomstig het gestelde in artikel 3.16, derde lid.

      Deze beleidsregel is niet van toepassing aan boord van schepen. Voor schepen gelden de voorschriften voor de
      voorzieningen bij valgevaar zoals die in de schepenwetgeving zijn opgenomen.


