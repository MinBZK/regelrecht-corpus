      1 Onder een adequaat uitgeruste wasserij als bedoeld in
      [artikel 4.51, eerste lid, van het Arbeidsomstandighedenbesluit][ref1] wordt verstaan: een wasserij die beschikt
      over onder meer de volgende procedures en voorzieningen teneinde blootstelling van het personeel aan asbest te
      voorkomen:

      a. het gebruik van zakken die in de wasmachine oplossen of een procedure waarbij de zakken uitsluitend onder water
      worden geopend;

      b. er zijn procedures en voorzieningen om de kans op ongewilde besmetting teniet te doen;

      c. besmet alfvalwater wordt gefilterd alvorens het wordt afgevoerd.

      2 Onder doelmatige sanitaire voorzieningen als bedoeld in
      [artikel 4.20, vierde lid, van het Arbeidsomstandighedenbesluit][ref2] worden, voor wat betreft het werken met
      asbest, afhankelijk van de werkzaamheden de volgende faciliteiten en procedures voor ontsmettmg van werknemers
      verstaan:

      a. Bij werkzaamheden waarvoor op grond van de [Arbeidsomstandighedenregeling, paragraaf 4.7][ref3], vrijstelling
      is verleend van een aantal voorschriften uit [hoofdstuk 4 afdeling 5 van het Arbeidsomstandighedenbesluit,][ref4]
      volstaat de zogenaamde éentraps-ontsmettingsprocedure. Dit houdt in dat:

      1°. volstaan kan worden met alleen een douchefaciliteit op de locatie van de asbestverwijdering.

      2°. de werkkleding niet wordt uitgetrokken voor het douchen,

      3°. de beschermende kleding in deze situaties af speelbaar is en

      4°. ook bij werkonderbrekingen (pauzes) gebruik wordt gemaakt van de douche.

      Deze verplichting geldt, op grond van de eerdergenoemde vrijstellingsregeling, niet bij de verwijdering van
      asbesthoudende water- gas- en rioolleidingen in het buitenmilieu.

      b. Bij overige (sloop)werkzaamheden moet een drietraps-ontsmettingsprocedure worden gevolgd. Deze
      ontsmettingsprocedure dient toegepast te worden indien de ruimte waaruit het asbest wordt verwijderd afgeschermd
      is van andere ruimten of van de buitenlucht. Onder deze procedure wordt verstaan het doorlopen van een
      ontsmettingsprocedure in een decontammatie-unit die uit drie compartimenten bestaat waarbij:

      1°. In het eerste compartiment de beschermende werkkleding wordt uitgetrokken, terwijl men de
      ademhalingsbescherming blijft dragen,

      2°. In het tweede compartiment douches staan opgesteld. De ademhalingsbeschermingsmiddelen worden eerst afgespoeld
      alvorens ze worden afgenomen.

      3°. In het derde compartiment, de schone ruimte, schone kleding wordt aangetrokken.

      c. Bij de onder b genoemde drietraps-ontsmettingsprocedure tevens het volgende in acht genomen wordt:

      1°. Het eerste compartiment van de ontsmettingsvoorziening grenst bij voorkeur aan de ruimte waar het asbest wordt
      verwijderd.

      2°. Indien de drietrapsontsmettingsvoorziening met aansluitend is gelegen aan de ruimte waaruit de asbest wordt
      verwijderd, is deze voorzien van een lucht- ventilatiestroom in de richting van het schone naar het vuile deel van
      de voorziening.

      3°. Ter voorkoming van besmetting van de tussenliggende schone ruimten trekken personen die zich van de ruimte
      waar asbest wordt verwijderd naar de ontsmettingsruimte begeven een schone overall over de besmette werkkleding en
      laarzen aan.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4.51
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel4.20
      [ref3]: https://wetten.overheid.nl/BWBR0008587#Paragraaf4.7
