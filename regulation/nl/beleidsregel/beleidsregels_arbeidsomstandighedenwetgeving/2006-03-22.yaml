  - number: '7.7'
    text: |-
      1 Het gevaar van bewegende delen van een arbeidsmiddel, bedoeld in
      [artikel 7.7, eerste lid, van het Arbeidsomstandighedenbesluit,][ref1] is aanwezig, tenzij:

      a. de snelheid en de aandrijvende krachten van de bewegende delen zodanig gering zijn, dat hierdoor geen letsel
      kan ontstaan;

      b. het gevaar onbereikbaar is gemaakt door voor de bovenste en de onderste ledematen veiligheidsafstanden te
      creëren overeenkomstig de norm NEN-EN 294:1994 "Veiligheid van machines, veiligheidsafstanden ter voorkoming van
      het bereiken van gevaarlijke zones met de bovenste ledematen", respectievelijk de norm NEN-EN 811:1996 "Veiligheid
      van machines, veiligheidsafstanden ter voorkoming van het bereiken van gevaarlijke zones met de onderste
      ledematen", of

      c. er bij knelgevaar bij naar elkaar toe dan wel langs elkaar heen bewegende delen zodanige ruimte vrij blijft, dat
      wordt voldaan aan de norm NEN-EN 349:1994 "Veiligheid van machines minimum afstanden ter voorkoming van het bekneld
      raken van menselijke lichaamsdelen".

      2 Schermen of beveiligingsinrichtingen, die ter naleving van
      [artikel 7.7, eerste lid, van het Arbeidsomstandighedenbesluit][ref2] worden aangebracht, voldoen aan
      [artikel 7.7, tweede tot en met zesde lid][ref3], indien zij in overeenstemming zijn met de betreffende bepalingen
      van de normen:

      a. NEN-EN 292-1:1994 "Veiligheid van machines, Basisbegrippen, algemene ontwerpbeginselen Deel 1:
      Basisterminologie, methodologie",

      b. NEN-EN 292-2:1996 "Veiligheid van machines, Basisbegrippen, algemene ontwerpbeginselen Deel 2: Technische
      beginselen en beschrijvingen",

      c. NEN-EN 574:1997 "Veiligheid van machines, tweehandenbediening",

      d. NEN-EN 953:1998 'Veiligheid van machines, algemene eisen voor het ontwerp en de constructie van afschermingen
      (vast, beweegbaar)",

      e. NEN-EN 999:1998 "Veiligheid van machines. De plaatsing van beveiligingsinrichtingen in verband met
      naderingssnelheden van lichaamsdelen".

      Deze beleidsregel is niet van toepassing op transportmiddelen die zijn uitgesloten van de werkingssfeer van het op
      de [Warenwet][ref4] gebaseerde [Warenwetbesluit machines][ref5].


