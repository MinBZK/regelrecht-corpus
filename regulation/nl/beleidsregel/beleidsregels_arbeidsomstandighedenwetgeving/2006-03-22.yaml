  - number: 4.18-5
    text: |-
      Bij blootstelling aan cytostatica in ziekenhuizen wordt aan de in
      [artikel 4.18, eerste tot en met vierde lid, van het Arbeidsomstandighedenbesluit][ref1] opgenomen verplichtingen
      voldaan indien adequate arbeidsmiddelen dan wel werkmethoden worden toegepast of persoonlijke beschermingsmiddelen
      worden gebruikt overeenkomstig het in [bijlage 14][ref2] bij deze beleidsregels gestelde.

      *(Deze beleidsregel is in werking getreden op 1 juni 2001)*


