  - number: '5.11'
    text: >-
      Het arbeidsgezondheidskundig onderzoek aan ogen en gezichtsvermogen omvat minimaal een anamnese, een
      gezichtsscherpte- en een accommodatiemeting. In aan vulling daarop vindt er een beoordeling van de werkplek plaats.
      Een oftalmologisch onderzoek wordt uitgevoerd als oogklachten of gezichtsstoornissen niet op een eenvoudige manier
      met optische correctiemiddelen te verhelpen zijn.
    url: https://wetten.overheid.nl/BWBR0013042/2006-03-22#Artikel5.11
  - number: '6.1'
    text: >-
      1 Er is sprake van een behaaglijk en gelijkmatig klimaat indien bij toepassing van de norm NEN-EN-ISO 7730:1996
      "Gematigde thermische binnenomstandigheden. Bepalingen van de PMV- en de PPD-waarde en specificaties van de
      voorwaarden voor thermische behaaglijkheid", de PMV-waarde tussen – 0,5 en + 0,5 ligt, of indien minder dan 10 %
      van de werknemers klachten over het klimaat kenbaar maakt. Een overschrijding van die grenzen gedurende 10% van de
      verblijfstijd is acceptabel.


      2 Indien de aard van het werk of de aard van de arbeidsplaats het werken bij een hoge omgevingstemperatuur
      noodzakelijk maakt, leiden de klimatologische omstandigheden met tot overschrijding van de referentiewaarden
      genoemd in:


      a. bijlage A van de norm NEN-ISO 7243:1989 "Hete omgevingsomstandigheden – Bepaling van de externe warmtebelasting
      van werkende mensen, gebaseerd op de WBGT-index (wet bulb globe temperature)", inclusief correctieblad C1:1996, en


      b. bijlage C van de norm NEN-ISO 7933:1990 "Hete klimaatomstandigheden – Analytische bepaling en interpretatie van
      de warmte-belasting met behulp van de berekening van de vereiste zweetproductie".


      3 Indien de aard van het werk of de aard van de arbeidsplaats het werken bij een lage omgevingstemperatuur
      noodzakelijk maakt, voldoet het klimaat aan de norm NVN-ISO/TR 11079:1996 "Beoordeling van koude
      klimaatomstandigheden. Bepaling van de vereiste warmte-isolatie van kleding", rekening houdend met de koude-
      beschermende kleding die de werknemer draagt.


      4 Bij overschrijding van de referentiewaarden in de bovengenoemde normen dient de werkgever de thermische belasting
      op de betreffende arbeidsplaats met behulp van passende maatregelen te verminderen, zo veel mogelijk in eerste
      aanleg bij de bron van de thermische belasting.


      Deze beleidsregel is niet van toepassing aan boord van zeeschepen.
    url: https://wetten.overheid.nl/BWBR0013042/2006-03-22#Artikel6.1
  - number: '6.2'
    text: >-
      1 Voor kantoorruimten geldt een minimale luchtverversing van 30 m 3/uur per persoon, en voor lesruimten in het
      basisonderwijs, overeenkomstig NEN 1089:1986 "Ventilatie van schoolgebouwen. Eisen", een minimale luchtverversing
      van 20 m3/uur per persoon.


      2 Voor overige ruimten waarin lichte arbeid wordt verricht geldt een minimale luchtverversing van 25 m3 /uur per
      persoon.


      Deze beleidsregel is niet van toepassing aan boord van zeeschepen en luchtvaartuigen of indien de eisen van
      verkeersveiligheid (Wegvervoer) zich ertegen verzetten.
    url: https://wetten.overheid.nl/BWBR0013042/2006-03-22#Artikel6.2
  - number: '6.3'
    text: >-
      Arbeidsplaatsen en de directe toegangen daartoe zijn gedurende de aanwezigheid van de werknemers voldoende en
      doelmatig verlicht door daglicht, door kunstlicht of door beide, indien is voldaan aan de Nederlandse norm NEN
      3087:1997 "Visuele ergonomie in relatie tot verlichting – Principes en toepassingen".
    url: https://wetten.overheid.nl/BWBR0013042/2006-03-22#Artikel6.3
  - number: '6.4'
    text: |-
      1 Aan het gestelde in [artikel 6.4, eerste of tweede lid][ref1], kan in ieder geval in redelijkheid niet worden
      voldaan, wanneer:

      a. de aard van de werkzaamheden zich tegen toetreding van daglicht verzet, of

      b. de functie van de ruimte zich tegen toetreding van daglicht verzet, of

      c. de omvang van de ruimte het aanbrengen van voldoende lichtopeningen niet toelaat, of

      d. de plaats van de ruimte het aanbrengen van voldoende lichtopeningen met toelaat.

      2 Bij de beoordeling of in redelijkheid met aan [artikel 6.4, eerste of tweede lid][ref2], kan worden voldaan,
      wordt mede in overweging genomen dat:

      a. het belang van daglicht zwaarder weegt naar gelang er sprake is van plaatsgebonden arbeid die in geringe mate
      contacten met zich meebrengt,

      b. het belang van daglicht in een ruimte minder zwaar weegt naar mate de in die ruimte gelegen werkplek door
      daglicht wordt verlicht.

      3 Besloten ruimten, van elkaar gescheiden door wanden die voor meer dan de helft uit helder, doorzichtig materiaal
      bestaan, worden voor de toepassing van [artikel 6.4, eerste of tweede lid][ref3], als een ruimte beschouwd.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel6.4
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel6.4
      [ref3]: https://wetten.overheid.nl/BWBR0008498#Artikel6.4
    url: https://wetten.overheid.nl/BWBR0013042/2006-03-22#Artikel6.4
