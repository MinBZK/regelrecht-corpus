  - number: 4.9 -3
    text: |-
      Bij het ter beschikking stellen van persoonlijke beschermingsmiddelen ais bedoeld in [artikel 4.8b][ref1] en
      [artikel 4.9 achtste lid, van het Arbeidsomstandighedenbesluit][ref2], ter bescherming van werknemers tegen
      mhalatoire blootstelling aan stoffen wordt het volgende in acht genomen.

      1. Om te beoordelen of een persoonlijke beschermingsmiddel als bedoeld in
      [artikel 4.9 achtste lid van het Arbeidsomstandighedenbesluit][ref3] geschikt is om de inhalatoire blootstelling
      aan stoffen tot een voldoende laag niveau te beperken, wordt voor de vaststelling van de blootstellingsreductie bij
      gebruik van een middel uitgegaan van de door de leverancier opgegeven nominale protectiefactor (NPF) in relatie tot
      arbeidsbelasting en belastbaarheid van de betrokken werknemers.

      2. Een ademhalingsbeschermingsmiddel met een systeem dat de omgevingslucht filtert is met geschikt indien de gas-
      of dampconcentratie van de te filteren stof in de omgevingslucht hoger is dan 1 volumeprocent.

      3. Bij blootstelling aan inert zwevend stof met een MAC-waarde van 10 milligram per kubieke meter lucht wordt een
      P1SL filtertype die voldoet aan de norm NEN-EN 143 2000 "Ademhalingsbeschermingsmiddelen. Deeltjesfilters Eisen
      beproeving merking", toegepast of een filter met vergelijkbare NPF ingeval van blootstelling aan dampen of gassen.

      4. Bij blootstelling aan stoffen met een wettelijke grenswaarde of een MAC-waarde tussen 0,1 en 10 milligram per
      kubieke meter lucht wordt minimaal een P2SL filtertype die voldoet aan voornoemde norm NEN-EN 143, toegepast of een
      filter met vergelijkbare NPF ingeval van blootstelling aan dampen of gassen.

      5. Bij blootstelling aan stoffen met een wettelijke grenswaarde of een MAC-waarde kleiner dan 0,1 milligram per
      kubieke meter lucht wordt mmimaal een P3SL filtertype die voldoet aan voornoemde norm NEN-EN 143, toegepast of een
      filter met vergelijkbare NPF ingeval van blootstelling aan dampen of gassen.

      6. Half- en kwartgelaatsmaskers met filter(systemen) die de omgevingslucht filteren zijn ongeschikt voor
      bescherming tegen stoffen met een wettelijke grenswaarde of een MAC-waarde kleiner dan 0,1 milligram per kubieke
      meter lucht.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4.8b
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel4.9
      [ref3]: https://wetten.overheid.nl/BWBR0008498#Artikel4.9
