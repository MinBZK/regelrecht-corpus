  - number: 7.3 -3
    text: >-
      1 Er wordt zodanig hijs- en hefgereedschap gebruikt, dat lasten er met ongewild van kunnen loskomen en dat
      het hijs- en hefgereedschap niet kan losraken van de kraan, ook met wanneer de last tijdens het hijsen ergens
      (ongewild) tegen stoot of wordt tegengehouden.


      Haken worden hiertoe als regel gesloten uitgevoerd om te voorkomen dat aangehaakte hijs- en hefgereedschappen zoais
      stroppen lengen, hijsbanden enz. ongewild los van de haak kunnen komen.


      2 Indien dit door de aard van de last niet kan worden voorkomen, worden doelmatige uitvalbeveiligingen toegepast of
      wordt voorkomen dat personen door een vallende last of een deel daarvan kunnen worden geraakt.


      3 Leidingen of kabels van vacuumhefgereedschap, hefmagneten en dergelijke zijn beschermd tegen beschadiging bij
      uitval van de energie-toevoer of bij afname van het hefverrnogen zijn waarborgen gerealiseerd, waardoor het vallen
      van de last of delen daarvan geen risico's tot gevolg heeft. Indien dit niet kan worden gewaarborgd, wordt de
      hijshoogte beperkt tot maximaal 1,5 meter of wordt de zone, waarboven zich lasten kunnen bevinden, ontruimd en
      afgezet.
    url: https://wetten.overheid.nl/BWBR0013042/2006-03-22#Artikel7.3_-3
  - number: 7.3 -4
    text: |-
      Voor machines en vergelijkbare arbeidsmiddelen wordt aan het gestelde in
      [artikel 7.3, eerste lid van het Arbeidsomstandighedenbesluit][ref1] voldaan indien de risico-inventarisatie en
      -evaluatie is uitgevoerd volgens NEN-EN 1050:1997 "Veiligheid van machines. Principes voor de risicobeoordeling".

      Deze beleidsregel is niet van toepassing op transportmiddelen die zijn uitgesloten van de werkingssfeer van het op
      de [Warenwet][ref2] gebaseerde [Warenwetbesluit machines][ref3].


