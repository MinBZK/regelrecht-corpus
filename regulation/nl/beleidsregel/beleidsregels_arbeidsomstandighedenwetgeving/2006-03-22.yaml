      11 Omstandigheidsfactor voor opslag.

      In of aan installaties voor opslag kunnen voorzieningen zijn getroffen die tot doel hebben de opgeslagen stof
      onder opslagcondities te houden. (Bijvoorbeeld een warmtewisselaar, roerwerk, circulatiesysteem, doseersysteem).
      Het in gebruik hebben van een dergelijke voorziening heeft niet tot gevolg dat de installatie voor opslag als een
      installatie voor bewerking bezien moet worden. De toe te kennen omstandigheidsfactor blijft 0,01.


