  - number: 5.2 -2
    text: |-
      Aan het bepaalde in [artikel 5.2 van het Arbeidsomstandighedenbesluit][ref1] wordt voor wat betreft arbeid in een
      kinderdagverblijf voldaan als het volgende in acht wordt genomen.

      1. Werkplekken zijn zodanig ingericht en er is zodanig meubilair aanwezig, dat zowel zittende als staande arbeid
      zo veel mogelijk op volwassenenhoogte en in een goede houding wordt verricht. Hierbij worden de volgende maten
      gehanteerd.

      a. De werkhoogte bij een aankleedtafel inclusief kussen is ten minste instelbaar tussen 90 en 105 cm

      b. De hoogte van de bovenkant van een bedmatras van een hoog bed ligt tussen 85 en 110 cm.

      c. De hoogte van de bodem van een hoge box ligt tussen 85 en 100 cm boven vloerniveau.

      d. De vrije werkruimte bedraagt minimaal

      1°. 60 cm bij een bed;

      2°. 80 cm bij een stapelbed;

      3°. 80 cm bij een aankleedtafel;

      4°. 100 cm in een toiletruimte.

      e. De plint bij een aankleedtafel wijkt mimmaai 10 cm terug van de voorzijde van de tafel.

      2. Tillen en dragen van kinderen wordt zo veel mogelijk voorkomen.

      3. In het vertrek zijn veilige hulpmiddelen beschikbaar waarmee kinderen zelfstandig op volwassenenhoogte kunnen
      komen.

      4. Kinderen die meer wegen dan 23 kg worden niet getild.

      5. Reiken met geheven armen duurt niet langer dan 3 minuten aaneengesloten.

      6. Werken met een gebogen rug (al dan niet in combinatie met hurken knielen of zitten) duurt niet langer dan 4
      minuten aaneengesloten.

      7. Zitten op de vloer tijdens de arbeid duurt niet langer dan vier minuten aaneengesloten of, indien een juiste
      rugsteun of ander hulpmiddel wordt gebruikt, niet langer dan 15 minuten.

      8. Hurken en knielen tijdens de arbeid wordt tot een minimum beperkt, maar duurt voor beide houdingen gezamenlijk
      niet langer dan 15 minuten per dag.

      Voor kinderdagverblijven welke reeds werden geëxploiteerd op 23 juli 2000 treedt deze beleidsregel in werking met
      ingang van 1 januari 2004.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel5.2
    url: https://wetten.overheid.nl/BWBR0013042/2006-03-22#Artikel5.2_-2
