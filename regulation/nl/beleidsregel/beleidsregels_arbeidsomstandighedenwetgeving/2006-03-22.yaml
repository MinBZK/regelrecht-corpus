  - number: 4.4 -10
    text: |-
      Ten aanzien van de opslag en toepassing van vloeibare stikstof worden de volgende
      voorzieningen adequaat geacht ter vermijding van een ongewilde gebeurtenis als bedoeld in
      [artikel 4.4, eerste tot en met derde lid. van het Arbeidsomstandighedenbesluit][ref1],
      danwel ter beperking van de gevolgen van een ongewilde gebeurtenis als bedoeld in
      [artikel 4.4 vierde lid, van het Arbeidsomstandighedenbesluit][ref2].

      1 In betreedbare ruimten waar vloeibare stikstof wordt opgeslagen of toegepast, waaronder begrepen het vullen,
      leegmaken of verwijderen van reservoirs of installaties, wordt het zuurstofgehalte permanent gemeten met een vast
      opgestelde detector in de volgende situaties:

      a. in ruimten kleiner dan 100 m3 inhoud waar de luchtverversing van de totale inhoud van de ruimte minder dan vier
      keer per uur bedraagt;

      b. in ruimten groter dan 100 m3 inhoud waar de luchtverversing van de totale inhoud van de ruimte minder dan twee
      keer per uur bedraagt.

      2 Indien in situaties als bedoeld in het eerste lid een stationaire meting redelijkerwijs met uitvoerbaar is wordt
      voordat de ruimte wordt betreden alsmede tijdens het verblijf in die ruimte het zuurstofgehalte gemeten met een
      draagbare detector.

      3 De detectoren bedoeld in het eerste en tweede lid zijn voorzien van CE-markering en hebben.

      a. een vooralarm dat in werking treedt wanneer de zuurstofconcentratie in de ruimte 19 volumeprocent bedraagt;

      b. een hoofdalarm dat in werking treedt wanneer de zuurstofconcentratie in de ruimte lager is dan 18 volumeprocent.

      4 Bij een zuurstofconcentratie van 18 volumeprocent of lager worden maatregelen getroffen om de toegang
      tot de ruinte te beletten dan wel wordt de ruimte alleen betreden met gebruik van onafhankelijke
      ademhalingsbeschermingsmiddelen.

      5 De goede werking van de detector blijft gewaarborgd door middel van periodiek onderhoud en deskundige controle.

      6 Deze beleidsregel is niet van toepassing voor ruimten waarin de aanwezige hoeveelheid vloeibare stikstof minder
      dan 3,0 kg bedraagt.

      *(Deze beleidsregel is in werking getreden op 1 maart 2001 en aangepast middels het onderhavige besluit)*


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4.4
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel4.4
