  - number: 4.9 -5
    text: |-
      Bij blootstelling aan inhalatie anesthetica in ziekenhuizen wordt aan de in
      [artikel 4.9 eerste lid van het Arbeidsomstandighedenbesluit][ref1] opgenomen verplichting tot het nemen
      van doeltreffende maatregelen voldaan, indien adequate arbeidsmiddelen dan wel werkmethoden worden toegepast
      overeenkomstig het in [bijlage 11][ref2] bij deze beleidsregels gestelde.

      *(Deze beleidsregel is in werking getreden op 1 juni 2001)*


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4.9
      [ref2]: https://wetten.overheid.nl/BWBR0013042
    url: https://wetten.overheid.nl/BWBR0013042/2006-03-22#Artikel4.9_-5
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4.9'
      - id: ref2
        bwb_id: BWBR0013042
  - number: '4.16'
    text: |-
      1 Om te beoordelen of een persoonlijke beschermingsmiddel als bedoeld in
      [artikel 4.18, vierde lid, van het Arbeidsomstandighedenbesluit][ref1] geschikt is om de inhalatoire blootstelling
      aan kankerverwekkende stoffen tot een voldoende laag niveau te beperken, wordt voor de vaststelling van de
      blootstellingsreductie bij gebruik van een middel uitgegaan van de door de leverancier opgegeven nominale
      protectiefactor (NPF) in relatie tot arbeidsbelasting en belastbaarheid van de betrokken werknemers.

      2 Bij blootstelling aan kankerverwekkende stoffen met een genotoxisch werkingsmechanisme dient
      minimaal een volgelaatsmasker met P3SL stoffilterkwaliteit, die voldoet aan de norm NEN-EN 143:2000
      "Ademhalingsbeschermingsmiddelen. Deeltjesfilters. Eisen, beproeving, merking", of een filter met equivalente NPF
      bij damp of gasvormige blootstelling gedragen te worden.

      3 Het gebruik van ademhalingsbeschermmgmiddelen met filter(systemen) die de omgevingslucht filteren zijn met
      toegestaan indien de gas- of dampconcentratie in de omgevingslucht hoger is dan 1 volumeprocent.

      4 Deze beleidsregel is niet van toepassing bij blootstelling aan asbest. Ten aanzien van doeltreffende persoonlijke
      beschermingsmiddelen bij blootstelling aan asbest wordt gehandeld overeenkomstig het in [beleidsregel 4.18-3][ref2]
      gestelde.

      5 Deze beleidsregel is niet van toepassing bij blootstelling aan respirabel kwarts in de bouwnijverheid. Ten
      aanzien van doeltreffende ademhalingsbeschermingsmiddelen bij blootstelling aan respirabel kwarts in deze sector,
      wordt gehandeld overeenkomstig het in [beleidsregel 4.18-4][ref3] gestelde.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4.18
      [ref2]: https://wetten.overheid.nl/BWBR0013042#Artikel4.18_-3
      [ref3]: https://wetten.overheid.nl/BWBR0013042#Artikel4.18_-4
    url: https://wetten.overheid.nl/BWBR0013042/2006-03-22#Artikel4.16
