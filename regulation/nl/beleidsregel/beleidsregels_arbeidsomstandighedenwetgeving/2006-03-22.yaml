  - number: 4.2b
    text: |-
      Onder het machtnemen van de grootst mogelijke zorgvuldigheid ordelijkheid en zindelijkheid op plaatsen waar
      stoffen, die een gevaar voor de veiligheid en gezondheid kunnen opleveren aanwezig zijn, wordt verstaan:

      1. De werkgever stelt regels en procedures vast voor het omgaan met bedoelde stoften, reiniging van de werkplek en
      persoonlijke hygiëne waaraan werknemers zich dienen te houden. De werkgever draagt zorg voor de taaktoedeling en
      het toezicht ten aanzien van het naleven van deze procedures en regels.

      2. De werkgever richt voorzieningen in en verstrekt middelen aan werknemers voor een optimale hygiëne op plaatsen
      waar bedoelde stoffen aanwezig zijn bij het verstrekken van middelen gaat het onder andere om het beschikbaar
      stellen van geschikte werkkleding. De werkgever stelt zo vaak als op grond van de blootstellingsbeoordeling als
      bedoeld in [artikel 4.2 van het Arbeidsomstandighedenbesluit][ref1] noodzakelijk is, maar tenminste eenmaal per
      week schone werkkleding beschikbaar en draagt zorg voor de reiniging van vervuilde kleding.

      3. Werk- en opslagruimten, waar gevaar bestaat op verspreiding van bedoelde stoffen, installaties en
      arbeidsmiddelen die met bedoelde stoffen worden verontreinigd, worden zo schoon mogelijk gehouden.

      4. In werk en opslagruimten waar gevaar van verspreiding bestaat van bedoelde stoffen, wordt niet gegeten, gerookt
      of gedronken en wordt geen voedsel bewaard.

      5. Afval dat bedoelde stoffen bevat wordt regelmatig van de werkplek verwijderd.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4.2
