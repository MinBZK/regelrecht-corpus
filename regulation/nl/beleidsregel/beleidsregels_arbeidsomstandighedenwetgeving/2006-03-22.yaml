  - number: 4.4 -9
    text: |-
      Ten aanzien van de opslag of toepassing van kooldioxide worden de volgende voorzieningen
      adequaat geacht ter vermijding van een ongewilde gebeurtenis als bedoeld in
      [artikel 4.4, eerste tot en met derde lid, van het Arbeidsomstandighedenbesluit][ref1],
      danwel ter beperking van de gevolgen van een ongewilde gebeurtenis als bedoeld in
      [artikel 4.4, vierde lid, van het Arbeidsomstandighedenbesluit][ref2].

      1 In betreedbare ruimten waar kooldioxide wordt opgeslagen of toegepast, waaronder begrepen arbeid aan of
      verwijderen van reservoirs, installaties of andere verpakkingen waarin zich kooldioxide bevindt, wordt het
      kooldioxidegehalte permanent gemeten met een vast opgestelde detector in de volgende situaties:

      a. in ruimten kleiner dan 100 m3 inhoud waar de luchtverversing van de totale inhoud van de ruimte minder dan vier
      keer per uur bedraagt;

      b. in ruimten groter dan 100 m3 inhoud waar de luchtverversing van de totale inhoud van de ruimte minder dan twee
      keer per uur bedraagt.

      2 Indien ventilatie wordt toegepast vindt afzuiging dicht bij de bodem (op ca 25 cm boven de bodem) plaats.

      3 Indien in situaties als bedoeld in het eerste lid een stationaire meting redelijkerwijs niet uitvoerbaar is wordt
      voordat de ruimte wordt betreden alsmede tijdens het verblijf in die ruimte het kooldioxidegehalte gemeten met een
      draagbare detector.

      4 De detectoren, bedoeld in het eerste en tweede lid, zijn voorzien van CE-markering en hebben.

      a. een vooralarm dat in werking treedt wanneer de kooldioxideconcentratie in de ruimte 30 000 mg/m3 (1,5
      volumeprocent) bedraagt,

      b. een hoofdalarm dat in werking treedt wanneer de kooldioxideconcentratie in de ruimte 55 000 mg/m3 (3,0
      volumeprocent) bedraagt.

      5 Bij overschrijding van een kooldioxideconcentratie van 55 000 mg/m3 worden maatregelen getroffen om de
      toegang tot de ruimte te beletten dan wel wordt de ruimte alleen betreden met gebruik van onafhankelijke
      ademhalingsbeschermingsmiddelen.

      6 De goede werking van de detectoren, bedoeld in het eerste en tweede lid, is gewaarborgd door middel van periodiek
      onderhoud en deskundige controle.

      7 Deze beleidsregel is niet van toepassing op

      a. ruimten waarin de aanwezige hoeveelheid kooldioxide minder dan 3,0 kg bedraagt en

      b. kooldioxide in kleine draagbare brandblusapparaten tot 20 kg totale massa

      *(Deze beleidsregel is in werking getreden op 1 maart 2001 en aangepast middels het onderhavige besluit)*


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4.4
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel4.4
