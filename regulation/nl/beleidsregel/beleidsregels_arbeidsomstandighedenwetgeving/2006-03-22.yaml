  - number: '1.42'
    text: >-
      1 De verplichting van de werkgever om de arbeid van een zwangere werknemer en werknemer tijdens lactatie zodanig te
      organiseren dat de arbeid voor die werknemer geen gevaren met zich kan brengen voor haar veiligheid en gezondheid
      en geen terugslag kan veroorzaken op de zwangerschap of lactatie, houdt ten minste in dat:


      a. de zwangere werknemer bij de arbeid niet wordt blootgesteld aan lichaamstrillingen of schokken met een
      versnelling van meer dan 0,25 m/s²;


      b. de zwangere werknemer bij de arbeid niet wordt blootgesteld aan equivalente geluidsniveaus boven de 80 dB(A) en
      piekgeluiden boven 200 Pa;


      c. de zwangere werknemer niet wordt blootgesteld aan klimaatomstandigheden, die kunnen worden beschouwd als
      onbehaaglijk;


      d. de noodzaak tot bukken, hurken of knielen bij de arbeid voor de zwangere werknemer zoveel mogelijk wordt
      voorkomen. In de laatste drie maanden mogen zwangere werknemers niet worden verplicht dagelijks meer dan eenmaal
      per uur te hurken, knielen, bukken of staande voetpedalen te bedienen;


      e. de noodzaak tot handmatig tillen van gewichten bij de arbeid door de zwangere of pas bevallen werknemer tot drie
      maanden na de bevalling zoveel mogelijk wordt beperkt en, als er toch handmatig gewichten getild worden:


      1°. het in één handeling te tillen gewicht gedurende de gehele zwangerschap en de periode tot drie maanden na de
      bevalling minder dan 10 kilogram bedraagt;


      2°. vanaf de twintigste week van de zwangerschap gewichten van meer dan 5 kilogram niet meer dan 10 keer per dag
      worden getild;


      3°. vanaf de dertigste week van de zwangerschap gewichten van meer dan 5 kilogram niet meer dan 5 keer per dag
      worden getild;


      f. de zwangere werknemer of werknemer tijdens lactatie bij de arbeid niet wordt blootgesteld aan stoffen die de
      gezondheid van henzelf en/of hun (ongeboren) kind kunnen schaden;


      g. de zwangere werknemer niet wordt verplicht, om in direct contact te komen met een ultrasonore trillingsbron.
      Voor ultrasonore luchttrillingen met frequenties boven 20 kHz geldt als voorlopige grenswaarde 110 dB(A) per
      tertsband.


      2 Klimaatomstandigheden worden beschouwd als onbehaaglijk als bedoeld in het eerste lid, onder c wanneer het
      predicted percentage of dissatisfied (PPD) bepaald op basis van NEN-EN-ISO 7730: 1996 "Gematigde thermische
      bmnenomstandigheden Bepalingen van de PMV- en de PPD-waarde en specificaties van de voorwaarden voor thermische
      behaaghjkheid", meer bedraagt dan 20%.


      3 Tot de stoffen bedoeld in het eerste lid, onder f, worden in elk geval gerekend:


      a. stoffen die de gezondheid schade kunnen toebrengen via een zogenaamd genotoxisch werkingsmechanisme en
      die via de moeder het ongeboren kind of de zuigeling kunnen bereiken, waaronder alle mutagene en vrijwel alle
      kankerverwekkende stoffen,


      b. stoffen die, via een niet-genotoxisch werkingsmechanisme door blootstelling van de moeder de gezondheid van het
      ongeboren kind of de zuigeling kunnen schaden.
