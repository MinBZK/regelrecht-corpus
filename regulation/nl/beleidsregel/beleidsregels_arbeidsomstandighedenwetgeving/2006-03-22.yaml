  - number: 4.4 -8
    text: |-
      Ten aanzien van het in open of gesloten spuitcabines of spuitwanden verspuiten van verf die zeer licht
      ontvlambare, licht ontvlambare en ontvlambare oplosmiddelen bevat, worden de volgende voorzieningen
      adequaat geacht ter vermijding van het gevaar van een ongewilde gebeurtenis als bedoeld in
      [artikel 4.4, tweede lid, van het Arbeidsomstandighedenbesluit][ref1], dan wel ter beperking van de gevolgen van
      een ongewilde gebeurtenis als bedoeld in [artikel 4.4, vierde lid van het Arbeidsomstandighedenbesluit][ref2].

      1 Technische voorzieningen

      a. Spuitcabines en spuitwanden zijn vervaardigd van onbrandbare materialen.

      b. Luchtfilters, verffilters voor plafonds, wanden en vloeren zijn vervaardigd van onbrandbaar materiaal.

      c. Luchtkanalen zijn gemaakt van onbrandbaar materiaal volgens NEN 6064:1991 "Bepaling van de onbrandbaarheid van
      bouwmaterialen", inclusief aanvulling A1 1997.

      d. In spuitcabines waar met tweecomponentenverven en nitrocelluloselakken wordt gespoten zijn geen hete voorwerpen
      of apparaten aanwezig met een oppervlaktetemperatuur hoger dan 80°C.

      e. De elektrische installatie voldoet aan de voorschriften voor ruimten met brandgevaar, zoals aangegeven is in de
      volgende onderdelen van NEN 1010 "Veiligheidsbepalingen voor laagspanningsinstallaties".

      - NEN 1010-3:1996, "Algemene kenmerken", Bijlage CA 32, Indeling van uitwendige invloeden, in samenhang met
      - NEN 1010-4:1996, "Beschermingsmaatregelen", Hoofdstuk 482, Bescherming tegen brand, en
      - NEN 1010-7:2000, "Aanvullende en bijzondere bepalingen", Rubriek 875 2, Ruimten met brandgevaar

      f. Ruimteverwarming in spuitcabines vindt uitsluitend plaats door middel van heetwaterverwarming, lage druk
      stoomverwarming, elektrische apparatuur met een maximale oppervlaktetemperatuur van 200°C dan wel hete lucht
      verkregen van een gas- of olie gestookte luchtverwarmer, waarbij

      1°. de regelinstallatie voor de verwarming buiten de spuitcabine is geïnstalleerd,

      2°. de verbrandingslucht voor de gas- of olie gestookte luchtverwarmer geen gevaarlijke concentratie van brandbare
      oplosmiddelen bevat.

      g. In een spuitcabine is per 200 m2 tenminste één poederblustoestel van ten minste 6 kg poeder aanwezig met een
      minimum van 2 blustoestellen. Deze zijn duidelijk zichtbaar opgehangen en te allen tijde goed bereikbaar.

      h. Gesloten spuitcabines zijn voorzien van tenminste twee zelfsluitende vluchtdeuren die naar buiten draaiend zijn
      uitgevoerd en die zover mogelijk van elkaar zijn aangebracht.

      i. Open en gesloten spuitcabines zijn uitgerust met een afzuiginstallatie met een voldoende capaciteit voor het
      betreffende proces teneinde te voorkomen dat de concentraties van brandbare dampen in die ruimten hoger worden dan
      20% van de onderste explosiegrens van het dampmengsel van de betreffende stoffen.

      j. Open en gesloten spuitcabines zijn uitgerust met eigen afzuiginstallaties die onderling niet zijn doorverbonden.
      De toe te voeren lucht, ter vervanging van de afgezogen lucht, is schoon en op kamertemperatuur. De verse lucht
      wordt verdeeld over een zo groot mogelijk oppervlak toegevoerd.

      k. Ten aanzien van elektrostatische spuitinstallaties worden tevens de volgende voorzieningen getroffen

      1°. Alle objecten in een elektrostatische spuitinstallatie alsmede die installatie zelf, zijn geaard en met elkaar
      doorverbonden.

      2°. De handgreep van het spuitpistool van een elektrostatische handspuitinstallatie is geaard en zodanig uitgevoerd
      dat de spuiter continu een goede elektrische verbinding met de geaarde handgreep houdt ter voorkoming van oplading
      van het lichaam van de spuiter.

      2 Organisatorische voorzieningen

      a. Het aanmaken van verf met zeer licht ontvlambare, licht ontvlambare en ontvlambare oplosmiddelen vindt plaats
      buiten de spuitcabine in een geschikte verfaanmaakruimte.

      b. Verffilters worden tijdig vernieuwd en op de juiste wijze op zo kort mogelijke termijn afgevoerd.

      c. Er wordt niet gerookt en open vuur of andere ontstekingsbronnen zijn vermeden in spuitruimten.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4.4
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel4.4
