    text: |-
      Aan het bepaalde in de [artikelen 5.3][ref1] en [5.4 van het Arbeidsomstandighedenbesluit][ref2] wordt voor wat
      betreft arbeid in kappersbedrijven, als bedoeld in [beleidsregel 4.3a, eerste lid][ref3], voldaan als het volgende
      in acht wordt genomen.

      1 a. De zittinghoogte van de pompstoel is op eenvoudige wijze traploos instelbaar zodat het verrichten van
      vaktechnische handelingen steeds op de ergonomisch juiste hoogte kan geschieden. Het instelbereik van de zitting
      loopt tenminste van 45 tot 59 centimeter boven de vloer.

      b. Bij het verrichten van vaktechnische handelingen bij kinderen tussen 1.15 en 1.60 meter dient gebruik gemaakt te
      kunnen worden van een stoelverhoger op de pompstoel. Bij het verrichten van vaktechnische handelingen bij kinderen
      van 1.15 meter en kleiner dient gebruik gemaakt te kunnen worden van een kinderstoel.

      c. Een stoelverhoger verhoogt de zittinghoogte van de pompstoel met minimaal 20 centimeter.

      d. Een kinderstoel is in hoogte instelbaar en heeft een zittinghoogte van minimaal 79 centimeter vanaf de vloer.

      e. De buitenafmetingen van de pompstoel en kinderstoel zijn zodanig dat de horizontale afstand van de kapper tot
      het hoofd van de klant maximaal 30 centimeter bedraagt.

      f. Aan de zijkanten van de pompstoel is de vrije werkruimte minimaal 70 centimeter. In die gevallen waarin deze
      afstand van minimaal 70 centimeter tussen pompstoel en muur niet bereikt kan worden, kan een kleinere afstand tot
      minimaal 50 centimeter volstaan, indien de kapper door draaiing van de pompstoel toch de vereiste vrije werkruimte
      kan bereiken. Aan de achterzijde van de pompstoel is de vrije werkruimte minimaal 100 centimeter.

      g. De pompstoel is voorzien van een gesloten rond onderstel met een diameter van tenminste 39 centimeter of een
      sterpoot met minimaal vijf tenen, met een hart-pootafstand of hart-wielafstand tussen 24 en 37 centimeter.

      h. De pompstoel draait minimaal 45 graden op de poot.

      i. De hoogte van de rugleuning is maximaal 50 cm, gemeten vanaf de zitting.

      j. De rugleuning is niet voorzien van een hoofdsteun, uitgezonderd bij de vaktechnische handelingen scheren en
      baardknippen.

      2 a. Alle kappers die in de kapsalon gelijktijdig wassen of vaktechnische handelingen verrichten, zijn in de
      gelegenheid om een kappersfiets te gebruiken.

      b. De kappersfiets is voorzien van een zitting in de vorm van een fietszadel of ponyzadel.

      c. De kappersfiets is niet voorzien van een rugleuning.

      d. Om de juiste werkhoogte en werkhouding te bereiken is een kappersfiets op eenvoudige wijze traploos instelbaar.
      Het instelbereik van de zitting loopt tenminste van 60 tot 80 centimeter boven de vloer. Indien de optimale
      instelhoogte niet bereikt kan worden met behulp van een ponyzadel, dan maakt de kapper gebruik van een kappersfiets
      met fietszadel.

      e. De zitting van de kappersfiets is draaibaar ten opzichte van het onderstel.

      f. Een kappersfiets die niet is uitgevoerd voor montage op de vloer achter de pompstoel, is voorzien van een
      sterpoot met minimaal vijf tenen, met een hart-wielafstand tussen 24 en 37 centimeter. Indien de kappersfiets
      uitgevoerd is voor montage op de vloer achter de pompstoel, dan is de kappersfiets in beide richtingen in een hoek
      van minimaal 135 graden om de pompstoel draaibaar.

      3 a. De lengte van de wasbak tussen de neksteun en de achterzijde is maximaal 43 centimeter. Bij wasbakken met een
      holle voorzijde bedraagt deze lengte maximaal 45 centimeter.

      b. Onder de wasbak is de diepte van de knieruimte minimaal 24 centimeter en de diepte van de voetruimte minimaal
      42 centimeter, gemeten vanaf de achterzijde van de wasbak. Als die diepten niet bereikt kunnen worden achter
      het onderstel, is de breedte van het onderstel maximaal 30 centimeter, zodat de kapper de voeten en benen ter
      weerszijden van het onderstel kan plaatsen.

      c. Aan de achterzijde van de wasbak is de vrije werkruimte minimaal 50 centimeter.

      4 De schaar is voorzien van een (eventueel verwijderbare) pinksteun. De pinksteun is dusdanig geplaatst
      respectievelijk kan dusdanig geplaatst worden, dat een neutrale stand (de vier vingers liggen nagenoeg op één lijn)
      van de hand wordt bereikt.

      5 a. Het takenpakket van de kapper geeft de kapper voldoende afwisseling in het werk. De afwisseling bestaat uit
      het regelmatig kunnen wisselen tussen taken en het regelmatig kunnen aannemen van andere werkhoudingen. Onder
      regelmatig wordt verstaan: tenminste ieder uur vijf minuten.

      b. Het werk is zodanig georganiseerd dat de kapper na circa 2 uur werk 10 minuten pauze heeft.

      6 a. Voor het bepaalde in het eerste en derde lid geldt het volgende:

      * Voor een pompstoel en wasbak aangeschaft na 31-12-2006 is het bepaalde direct van toepassing.

      * Voor een pompstoel en wasbak die is aangeschaft vóór 1-1-2007 treedt het bepaalde op 1-1-2014 in werking.

      b. Voor het bepaalde in het tweede en vierde lid geldt het volgende:

      * Voor een kappersfiets en schaar die is aangeschaft vóór de datum van inwerkingtreding van deze beleidsregel
      treedt het bepaalde op 1-1-2007 in werking.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel5.3
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel5.4
      [ref3]: https://wetten.overheid.nl/BWBR0013042#Artikel4.3a
