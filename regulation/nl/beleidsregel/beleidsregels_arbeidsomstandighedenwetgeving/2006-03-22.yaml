    text: |-
      1 Aan het gestelde in [artikel 4.19, onder a van het Arbeidsomstandighedenbesluit][ref1] wordt voldaan als
      mondeling en schriftelijk voorlichting en onderricht wordt gegeven over:

      a. de gevaren van desbetreffende kankerverwekkende en mutagene stoffen en de werkzaamheden ermee;

      b. het veilig omgaan met deze stoffen;

      c. hoe blootstelling zoveel mogelijk kan worden voorkomen;

      d. hoe bij calamiteiten dient te worden gehandeld, een en ander conform de in
      [artikel 4.6a van het Arbeidsomstandighedenbesluit][ref2] bedoelde procedure;

      e. het voorkomen op de lijst van blootgestelde werknemers en het recht op inzage;

      f. het arbeidsgezondheidskundig onderzoek. De voorlichting en instructie worden tenminste een keer per jaar
      herhaald.

      2 Aan het gestelde in [artikel 4.19, onder c, van het Arbeidsomstandighedenbesluit][ref3] wordt voldaan
      als gevarenzones duidelijk zijn afgebakend en de toegangen tot een gevarenzone zijn gemarkeerd met een
      doodshoofdsymbool dat met betrekking tot de vormgeving voldoet aan het gestelde in of krachtens [artikel 8.4][ref4]
      en dat voorzien is van de tekst "kankerverwekkende stoffen. Verboden voor onbevoegden".

