        bwb_id: BWBR0008498
        artikel: '5.4'
  - number: 5.4 -2
    text: |-
      Een zitgelegenheid bij kassawerk in zelfbedieningswinkels is doelmatig in de zin van
      [artikel 5.4 van het Arbeidsomstandighedenbesluit][ref1] wanneer het hiernavolgende in acht genomen wordt:

      1. Onder kassawerk in zelfbedieningswinkels worden de afrekenhandelingen van een werknemer verstaan, alsmede
      de daaraan gerelateerde ondersteunende en voorbereidende taken op de kassawerkplek. Klanten selecteren
      in zulke winkels (ten minste voor een deel) zelf de koopwaar, waarna zij die ter afrekening aanbieden.
      Onder de zelfbedieningswinkels vallen in dit verband zowel de winkels in de levensmiddelen- als in de
      nietlevensmiddelenhandel: supermarkten, warenhuizen en speciaalzaken.

      2. Bij kassawerk in zelfbedieningswinkels is sprake van een doelmatige zitgelegenheid als

      a. van de stoel de rugleuning en de zittinghoogte instelbaar zijn,

      b. de stoel voldoet aan de norm NEN-EN 1335-1:2000 ‘Kantoormeubelen - Kantoorstoelen - Deel 1: Afmetingen -
      Bepaling van afmetingen’,

      c. de hoogte van de zitting minimaal instelbaar is tussen 20 en 30 centimeter onder de werkhoogte,

      d. de stoel gepolsterd is of bekleed of zodanig geconstrueerd van kunststof dat het warmte vasthoudt, stroef is en
      voldoende ventilatie mogelijk maakt,

      e. de stoel, indien deze is voorzien van wielen of glijders:

      1) niet hinderlijk wegrijdt of -glijdt tijdens zittende werkzaamheden aan de kassa,

      2) gemakkelijk opzij gezet kan worden als de werknemer staat te werken achter de kassa,

      3) niet dreigt om te vallen bij extreme lichaamshoudingen van de werknemer,

      4) de verplaatsbaarheid van de stoel geen belemmering vormt bij het uitvoeren van de kassafunctie.

      3. Een stasteun voldoet in dit verband niet als een doelmatige zitgelegenheid.

      4. Het meubel waarin kassawerk wordt verricht, biedt voldoende bewegingsvrijheid en beschermt de werknemer tegen
      aanrijding door eventueel aanwezige winkelwagens. Hieraan wordt voldaan wanneer:

      a. ten behoeve van de bewegingsvrijheid van benen en voeten er een vrije ruimte onder het werkblad aanwezig
      is van ten minste 70 centimeter hoog en 60 centimeter breed en diep, afgezien van de voor het werk beschikbare
      voetensteun. Bij die 60 centimeter breedte is de dikte van het werkblad nergens meer dan 11 centimeter,

      b. de vloer van het kassameubel thermisch is geïsoleerd,

      c. het kassameubel geen scherpe kanten of uitstekende delen bevat die de werknemer tijdens het werk kunnen
      verwonden,

      d. in het kassameubel geen losliggende kabels of snoeren aanwezig zijn,

      e. de oppervlakte van de toegepaste materialen in het kassameubel geen hinderlijke reflecties oplevert.

      5. Het kassameubel is zodanig ingericht dat:

      a. indien een transportband voor de aanvoer van de koopwaar zorgt, de werknemer zo dicht bij de
      aanvoertransportband zit dat deze de koopwaar binnen een horizontaal bereik van 30 centimeter, gerekend vanaf de
      schouders, kan verplaatsen,

      b. de geldlade en (indien aanwezig) de voorziening om anti-diefstalbeveiligingen te verwijderen zich bevinden
      binnen een horizontaal bereik van 30 centimeter, gerekend vanaf de schouder,

      c. overige voorzieningen die de werknemer regelmatig nodig heeft bij het afrekenen (bonprinter, toetsenbord,
      een vals geld-detector, opbergplaatsen voor papiergeld en cheques, zegels, zegelboekjes en de meest gangbare
      inpakmaterialen), zijn geplaatst binnen een horizontaal bereik van 45 centimeter, gerekend vanaf de schouders van
      de werknemer,

      d. de hoogte waarop de onder a t/m c genoemde voorzieningen zich bevinden maximaal 10 centimeter afwijkt van de
      werkhoogte,

      e. ten opzichte van de kijkrichting van de werknemer die recht voor zich afrekenhandelingen uitvoert, de hoek met
      de richting van de aanvoerband niet meer dan 60 graden bedraagt.

      6. De werknemer heeft de beschikking over een voetensteun indien dat voor het bereiken van een goede
      lichaamshouding gevergd wordt. Deze is minimaal 45 cm breed en 35 cm diep en is eenvoudig in hoogte instelbaar
      in minimaal 3 standen met onderling gelijke afstand. Het totale instelbereik van de voetensteun omvat in ieder
      geval het verticale traject tussen 35 en 47 centimeter onder de bovenzijde van de zitting. Een stang of balk als
      voetensteun is onvoldoende.

      7. De werkgever zorgt voor aanpassing van het meubilair of relevante delen ervan ten behoeve van werknemers die qua
      lichamelijke eigenschappen sterk afwijken van de andere werknemers.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel5.4
