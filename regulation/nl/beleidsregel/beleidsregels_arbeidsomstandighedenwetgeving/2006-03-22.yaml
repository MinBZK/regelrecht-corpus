  - number: '2.21'
    text: |-
      1 Aan [artikel 2.21, eerste lid, van het Arbeidsomstandighedenbesluit][ref1] wordt voldaan als met goed gevolg
      ten minste een opleiding is afgerond die gebaseerd is op het in het Brandbeveiligingsconcept Bedrijfshulpverlening
      gepubliceerde opleidingsprofiel.

      2 Om de twee jaar worden per aangewezen werknemer ten minste 8 uur besteed aan herhalingscursussen en oefeningen
      of andere activiteiten als bedoeld in [artikel 2.22 van het Arbeidsomstandighedenbesluit][ref2]. Hiervan wordt een
      registratie bijgehouden.

      3 Als uit de risico-inventarisatie en -evaluatie, bedoeld in
      [ artikel 5 van de Arbeidsomstandighedenwet 1998,][ref3] blijkt dat bijzondere risico's aanwezig zijn, dan worden
      door één of meer bedrijfshulpverleners aanvullende opleidingen gevolgd. Dat zal met name het geval zijn voor de
      specialisaties eerste hulp en brandbestrijding.

      4 Op basis van de uitkomst van de risico-inventarisatie en -evaluatie, bedoeld in
      [artikel 5 van de Arbeidsomstandighedenwet 1998][ref4], kan van het gestelde onder 1 worden afgeweken. Dat kan
      bijvoorbeeld het geval zijn bij arbeid, die alleen of zonder vaste werkplek wordt verricht buiten het verband van
      een ploeg of buiten een bedrijf of inrichting. In dat geval kan worden volstaan met een (eenvoudige) schriftelijke
      instructie.


