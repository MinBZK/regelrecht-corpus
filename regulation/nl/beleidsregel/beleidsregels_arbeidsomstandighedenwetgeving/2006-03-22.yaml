  - number: 5.3 -1
    text: |-
      Aan het bepaalde in [artikel 5.3, eerste lid, van het Arbeidsomstandighedenbesluit][ref1] wordt voor wat betreft
      tillen op bouwplaatsen als bedoeld in [artikel 1.1, tweede lid onder a, van het Arbeidsomstandighedenbesluit][ref2]
      voldaan als het volgende in acht wordt genomen.

      1 Handmatig tillen wordt zoveel als redelijkerwijs mogelijk is vermeden of beperkt.

      2 Het maximale gewicht dat door één persoon met de handen wordt getild bedraagt 25 kilogram.

      3 Als de bewegingsruimte dit toelaat bedraagt het maximale gewicht dat door twee personen samen met de handen wordt
      getild 50 kilogram.

      4 De punten 2 en 3 zijn tot 1 januari 2007 niet van toepassing op werkzaamheden in de installatie- en
      isolatiebranche, de meubelindustrie, de sector afbouw en onderhoud en de timmerindustrie voor wat betreft het
      stellen van trappen.

      5 Dakrollen zwaarder dan 25 kilogram worden mechanisch getransporteerd. In situaties waarin dat technisch of
      organisatorisch niet mogelijk is, worden dakrollen, mits niet zwaarder dan 35 kilogram, handmatig getransporteerd –
      in afwijking van punt 2 – tot een maximum van 5 rollen per persoon per dag.

      6 Wanneer het in nieuwbouwsituaties (gedeeltelijk) onmogelijk is het transport van zware materialen voor
      liftinstallaties van de aanvoerplaats naar de liftschacht met transporthulpmiddelen te verrichten, zijn voor dat
      gedeelte van het transporttraject tot uiterlijk 1 juli 2007 de punten 2 en 3 niet van toepassing.

      7 Straatstenen zwaarder dan 4 kilogram worden niet handmatig verwerkt.

      8 Stoeptegels zwaarder dan 9,5 kilogram worden niet handmatig verwerkt.

      9 Er wordt alleen zonder mechanische tilhulpmiddelen gemetseld en gelijmd als – de vrije werkruimte tenminste 0,60
      meter bedraagt; – de diepte van het stavlak van een metselconsole tenminste 0,40 meter bedraagt; – de elementen
      lichter zijn dan 14 kilogram; – de elementen van 4 tot 14 kilogram tweehandig worden getild en worden verwerkt
      tot maximaal 1,50 meter boven en niet beneden het stavlak en – de elementen lichter dan 4 kilogram worden verwerkt
      tot maximaal 1.70 meter en vanaf tenminste 0,20 meter boven het stavlak, met uitzondering van – het van binnenuit
      metselen of lijmen direct onder en vanaf een verdiepingsvloer of – het metselen of lijmen vanaf het maaiveld.

      10 Betonstaal en gereedschap voor de verwerking hiervan zwaarder dan – 17 kilogram worden niet met één hand getild;
      – 20 kilogram worden niet getild vanaf minder dan 50 cm boven de grond.

      11 Steigerelementen zwaarder dan 23 kilogram worden niet door één persoon handmatig getild en getransporteerd.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel5.3
