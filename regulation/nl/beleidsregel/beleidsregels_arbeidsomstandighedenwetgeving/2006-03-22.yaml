  - number: 4.3a
    text: |-
      1 In deze beleidsregel wordt verstaan onder kappersbedrijf: een onderneming waar bedrijfsmatig het hoofdhaar van
      mannen, vrouwen of kinderen wordt geknipt of anderszins wordt behandeld.

      2 Ter preventie van huid- en luchtwegklachten wordt bij arbeid in kappersbedrijven aan de
      verplichtingen, bedoeld in [artikel 4.3a, aanhef en onder a, b en d tot en met f][ref1], respectievelijk
      [artikel 4.9 van het Arbeidsomstandighedenbesluit][ref2], tot het nemen van preventieve, respectievelijk
      doeltreffende maatregelen voldaan, indien producten en werkmethoden worden toegepast, als bedoeld in
      [bijlage 10][ref3] bij deze beleidsregels en de inrichting van de kapsalon tenminste aan de volgende eisen voldoet:

      a. Er is een aparte productbereidingsruimte aanwezig die aan minimaal 3 zijden met een wand van de overige
      ruimte is afgescheiden. De scheidingswanden zijn tenminste manshoog, tenzij gerichte afzuiging wordt toegepast.
      De scheidingswanden aan beide zijkanten van de werkruimte zijn dieper dan de diepte van het werkblad. De
      ruimte is ingericht voor het bereiden of mengen van cosmetische producten. In deze ruimte is minimaal één
      gemakkelijk toegankelijke wastafel met stromend water aanwezig die alleen gebruikt wordt bij werkzaamheden in de
      productbereidingsruimte. De werkvlakken en wanden zijn vlak, glad, goed reinigbaar en niet poreus. Eten, drinken,
      roken en bewaren of bereiden van voedsel of dranken in deze ruimte is niet toegestaan.

      b. In aanvulling op de onder a genoemde wastafel, is in de kapsalon minimaal één wasgelegenheid met stromend water
      aanwezig waar de handen kunnen worden gereinigd. Er zijn middelen aanwezig om de handen te drogen en te verzorgen.

      3 Het tweede lid, onder a, is tot 1 november 2006 niet van toepassing op kapsalons die voor de datum van
      inwerkingtreding van deze beleidsregel in gebruik zijn genomen, behoudens indien de kapsalon na deze laatste datum
      is heringericht of verbouwd.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4.3a
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel4.9
