  - number: '6.7'
    text: |-
      1 De werkgever inventariseert het geluid op de arbeidsplaats, als bedoeld in
      [artikel 6.7, eerste lid, van het Arbobesluit][ref1] middels metingen overeenkomstig de Nederlandse norm NEN
      3419:1992 "Ergonomie. Meting van geluid op de arbeidsplaats. Uitgebreid onderzoek", wanneer tijdens de uitvoering
      van enigerlei werkzaamheid het geluidsniveau de schadegrens van 80 dB(A) overschrijdt. Metingen kunnen achterwege
      blijven wanneer uit andere bron voldoende nauwkeurige gegevens beschikbaar zijn over de geluidsniveaus van
      voorkomende werkzaamheden.

      In situaties waarin overschrijding van de grens van 80 dB(A) bij een eerste beoordeling niet ondubbelzinnig valt
      vast te stellen, geven steekproefmetingen overeenkomstig de Nederlandse norm NEN 3418:1992 "Ergonomie. Meting van
      geluid op de arbeidsplaats. Oriënterende meetmethode", daarover uitsluitsel.

      2 De werkgever of de deskundige dienst in zijn opdracht voert de inventariserende geluidsmetingen, als
      bedoeld in [artikel 6.7, tweede lid][ref2], uit overeenkomstig de Nederlandse norm NEN 3419. Dit waarborgt
      de representativiteit van de meetresultaten voor de blootstelling aan geluid op de arbeidsplaats gedurende de
      dagelijkse arbeidstijd.

      3 Toepassing van de norm NEN 3419 voor het meten van geluid op de arbeidsplaats waarborgt dat de bij de
      meting gebruikte methoden en apparaten zijn aangepast aan de desbetreffende omstandigheden als genoemd in
      [artikel 6.7, derde lid][ref3].

      4 De registratie van de meetresultaten, genoemd in [artikel 6.7, vijfde lid][ref4], is zodanig dat daarin de
      gegevens zijn terug te vinden die noodzakelijk zijn voor de evaluatie van het risico als gevolg van het geluid op
      de arbeidsplaats:

      a. de geluidsniveaus tijdens de diverse werkzaamheden,

      b. de gemiddelde dagelijkse blootstellingsduur en

      c. het aantal blootgestelden,

      een en ander overeenkomstig de norm NEN 3419.

      5 In de toelichting bij het verslag van de metingen wordt aangegeven welke conclusies de werkgever verbindt aan de
      bevindingen voor wat betreft de prioriteitstelling bij het ondernemen van acties ter eliminering of vermindering
      van de geconstateerde risico's.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel6.7
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel6.7
      [ref3]: https://wetten.overheid.nl/BWBR0008498#Artikel6.7
      [ref4]: https://wetten.overheid.nl/BWBR0008498#Artikel6.7
