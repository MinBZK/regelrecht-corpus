        artikel: '4.4'
  - number: 4.4 -5
    text: |-
      1 Ter vermijding van het gevaar voor een ongewilde gebeurtenis als bedoeld in
      [artikel 4.4 eerste tot en met derde lid, van het Arbeidsomstandighedenbesluit][ref1] worden bij werkzaamheden die
      tot gevolg hebben dat de hierna onder a tot en met d genoemde stoffen buiten de verpakking of het reservoir kunnen
      treden de volgende voorzieningen adequaat geacht.

      a. Ten aanzien van stoffen die

      - voldoen aan de criteria voor indeling in één of meer van de categorieën "ontplofbaar", "zeer licht ontvlambaar",
      "licht ontvlambaar" en "ontvlambaar", bedoeld in [artikel 34 van de Wet milieugevaarlijke stoffen][ref2], of
      - door verhoogde druk verhoogde temperatuur, door hun reactiviteit met water waarbij brandbare gassen worden
      ontwikkeld, of door zelfontbrandmg gevaar voor brand of explosie kunnen opleveren.

      wordt het volgende in acht genomen

      1°. Reservoirs waaraan bedoelde werkzaamheden worden verricht zijn geaard om de opbouw van statische lading te
      voorkomen bij het vullen of aftappen. Alle bij het vullen of aftappen te gebruiken vaatwerk en hulpmiddelen zijn
      tijdens het vullen of aftappen onderling en aan aarde elektrisch geleidend verbonden. Speciale aandacht wordt
      besteed aan leidingen en vaten van slecht geleidende materialen en aan geïsoleerd liggende goede geleiders.

      2°. Kleding, schoeisel en persoonlijke beschermingsmiddelen van werknemers die bedoelde werkzaamheden verrichten
      veroorzaken geen statische oplading.

      3°. Open vuur en andere ontstekingsbronnen worden vermeden. Alleen vonkvrij gereedschap wordt toegepast.

      b. In werkruimten waar bedoelde werkzaamheden worden verricht met stoffen die voldoen aan de criteria voor indeling
      in een of meer van de categorieën "ontplofbaar" "zeer licht ontvlambaar", "licht ontvlambaar" en "ontvlambaar",
      bedoeld in [artikel 34 van de Wet milieugevaarlijke stoffen][ref3], vindt verwarming alleen plaats door middel
      van warmwaterverwarming, lage druk-stoomverwarming of hete luchtverwarming met behulp van een luchtverwarmer. De
      oppervlakte-temperatuur van de toegepaste verwarming mag met hoger zijn dan 200°C. De branderinstallatie is buiten
      de werkruimte opgesteld.

      c. Ten aanzien van stoffen die door hun reactiviteit met water waarbij brandbare gassen worden ontwikkeld gevaar
      voor brand of explosie kunnen opleveren wordt voorkomen dat ongecontroleerd contact met de open lucht ontstaat.
      Het op enigerlei wijze ongecontroleerd optreden van contact met water van deze stoffen wordt voorkomen. Voor het
      blussen van een eventuele brand van deze stoffen is een speciaal brandblusmiddel aanwezig dat met reageert met de
      bedoelde stoffen.

      d. Ten aanzien van stoffen die door zelfontbranding gevaar voor de veiligheid of de gezondheid kunnen opleveren
      wordt de inhoud van voorraadvaten, hetzij gekoeld hetzij, geïnertiseerd door een geschikt inert middel. Het
      vaatwerk wordt onmiddellijk na het vullen gesloten. Het overlappen gebeurt in gesloten systemen die geïnertiseerd
      of gekoeld zijn.

      2 Ter beperking van de gevolgen van een ongewilde gebeurtenis als bedoeld in
      [artikel 4.4 vierde lid van het Arbeidsomstandighedenbesluit][ref4] worden bij werkzaamheden die tot gevolg hebben
      dat de hierna, onder a en b genoemde stoffen buiten de verpakking of het reservoir worden gebracht de volgende
      voorzieningen adequaat geacht.

      a. In werkruimten waar gewerkt wordt met stoffen die voldoen aan de criteria voor indeling in een of meer van
      de categorieën "ontplofbaar" "zeer licht ontvlambaar' "licht ontvlambaar", "ontvlambaar", "vergiftig" "zeer
      vergiftig", "bijtend" en "sensibiliserend", bedoeld in [artikel 34 van de Wet milieugevaarlijke stoffen][ref5], of
      stoffen die door verhoogde temperatuur, door hun reactiviteit met water waarbij brandbare gassen worden ontwikkeld,
      of door zelfontbranding gevaar voor brand of explosie kunnen opleveren, zijn een nood- en oogdouche aanwezig die te
      allen tijde goed bereikbaar zijn Daarbij wordt het volgende in acht genomen.

      1°. De nooddouche is aangesloten op het waterleidingnet,

      2°. De capaciteit van de nooddouche bedraagt minimaal 80 l/min,

      3°. Voor oogdouches geldt dat de oogspoelvoorziening doelmatig moet zijn en dat, afhankelijk van de situatie
      gebruik kan worden gemaakt van een op de waterleiding aangesloten oogdouche of van een oogspoelfles. In het
      algemeen is een oogspoelvoorziening doelmatig indien,

      - deze voldoende snel bereikbaar is in geval van een ongeval,
      - deze eenvoudig bedienbaar is,
      - zo nodig beide ogen voldoende lang gespoeld kunnen worden,
      - de ogen zodanig kunnen worden gespoeld dat deze wel snel worden gereinigd, maar niet worden beschadigd.

      b. In werkruimten waar bedoelde werkzaamheden worden verricht met brandbare vaste stoffen, met ontplofbare stoffen,
      met zeer licht ontvlambare, licht ontvlambare dan wel ontvlambare vloeistoffen, met stoffen die met water brandbare
      gassen ontwikkelen, of met stoffen die door zelfontbranding gevaar voor de veiligheid of de gezondheid opleveren,
      zijn tenminste twee draagbare blustoestellen aanwezig met een voor de te blussen stoffen geschikt blusmiddel met
      een inhoud van 6 kg blusmiddel of een bluscapaciteit vergelijkbaar met 6 kg blusmiddel. Deze blustoestellen zijn
      duidelijk zichtbaar opgehangen en te allen tijde goed bereikbaar.

      3 Onder strikt noodzakelijk voor de bedrijfsvoering als bedoeld in
      [artikel 4.4, zesde lid, van het Arbeidsomstandighedenbesluit][ref6] wordt verstaan dat in de werkruimte
      van een stof die voldoet aan de criteria voor indeling in één of meer van de categorieën "ontplofbaar,
      "zeer licht ontvlambaar", "licht ontvlambaar", "ontvlambaar", "giftig", "irriterend" en "bijtend" bedoeld in
      [artikel 34 van de Wet milieugevaarlijke stoffen][ref7], van stoffen die met water brandbare gassen ontwikkelen
      en van stoffen die voor zelfontbranding vatbaar zijn, geen grotere hoeveelheid aanwezig is dan voldoende voor de
      productie gedurende één werkdag.

      4 De indeling van gebieden waar explosieve atmosferen kunnen heersen, in gevarenzones als bedoeld in
      [artikel 3.5d, vijfde lid, van het Arbeidsomstandighedenbesluit][ref8], vindt plaats overeenkomstig NPR 7910-1,
      Richtlijn voor het indelen van gevarenzones bij gasontploffingsgevaar en NPR 7910-2, Richtlijn voor het indelen van
      gevarenzones bij stofontploffingsgevaar.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4.4
      [ref2]: https://wetten.overheid.nl/BWBR0003892#Artikel34
      [ref3]: https://wetten.overheid.nl/BWBR0003892#Artikel34
