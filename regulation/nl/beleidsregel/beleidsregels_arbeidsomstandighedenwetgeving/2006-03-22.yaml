  - number: 4.18 -3
    text: |-
      1 Onder persoonlijke beschermingsmiddelen als bedoeld in [artikel 4.18, vierde lid][ref1], en
      [artikel 4.47, derde lid, onder a, van het Arbeidsomstandighedenbesluit,][ref2] die de betrokken werknemers
      doeltreffend beschermen tegen blootstelling aan asbeststof als bedoeld in [artikel 4.46, vijfde lid][ref3], en
      [artikel 4.47, eerste lid][ref4], wordt verstaan een volgelaatsmasker of overdrukpak met externe luchttoevoer via
      een compressor met luchtzuiveringsunit, welke voldoen aan de normen:

      a. NEN-EN 137:1993 "Ademhalingsbeschermingsmiddelen. Onafhankelijk persluchttoestel. Eisen, beproeving, merken",

      b. NEN-EN 139:1995 "Ademhalingsbeschermingsmiddelen. Slangentoestel geschikt voor ademlucht voor gebruik met een
      volgelaatmasker", inclusief correctieblad C1:1997.

      2 Indien op basis van de resultaten van de risico-iventarisatie en -evaluatie het om veiligheidsredenen niet
      mogelijk is om de in het eerste lid genoemde typen ademhalingsbeschermingsmiddelen te gebruiken, kan in dergelijke
      situaties een volgelaatmasker met aanblaasunit en P3SL-filter en voorfilter worden toegepast, welke voldoen aan
      de normen:

      a. NEN-EN 136:1998 "Ademhalingsbeschermingsmiddelen. Volgelaatmaskers. Eisen, beproevingsmethoden merken",

      b. NEN-EN 143:2000 "Ademhalingsbeschermingsmiddelen. Deeltjesfilters. Eisen, beproevingmerking",

      c. NEN-EN 12942:1998 "Ademhalingsbeschermingsmiddelen. Aangedreven filters gecombineerd met volgelaatmaskers,
      halfgelaatmaskers of kwartgelaatmaskers – Eisen beproeving, merken".


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4.18
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel4.47
      [ref3]: https://wetten.overheid.nl/BWBR0008498#Artikel4.46
      [ref4]: https://wetten.overheid.nl/BWBR0008498#Artikel4.47
    url: https://wetten.overheid.nl/BWBR0013042/2006-03-22#Artikel4.18_-3
