  - number: 4.18 -4
    text: |-
      1 Aan het bepaalde in [artikel 4.16, tweede en derde lid][ref1] en
      [artikel 4.18, eerste tot en met vierde lid, van het Arbeidsomstandighedenbesluit,][ref2] wordt voor
      wat betreft het voorkomen dan wel beperken van blootstelling aan kristallijn respirabel kwarts in de
      bouwnijverheid voldaan wanneer adequate arbeidsmiddelen dan wel werkmethoden worden toegepast overeenkomstig
      het in [tabel 1 van bijlage 13][ref3] bij deze beleidsregel gestelde en waar nodig aanvullende
      ademhalingsbeschermingsmiddelen worden gebruikt waarbij het gestelde in [tabel 2 van bijlage 13][ref4] bij deze
      beleidsregel in acht genomen wordt.

      2 Gasbeton en zandkalksteenblokken worden niet gezaagd, deze worden met een blokkenschaar op maat geknipt.

      3 Bij de hierna vermelde werkzaamheden, niet in [tabel 1 van bijlage 13][ref5] genoemd, worden in ieder geval
      ademhalingsbeschermingsmiddelen ter beschikking gesteld en gedragen: het aanbrengen van spuitbeton, koppensnellen,
      droog-gritstralen, nat-olivinezandstralen, nat-gritstralen en vacuumstralen.

      4 De keuze en het gebruik van het juiste type ademhalingsbescherming worden bepaald door de hoogte
      van de blootstelling aan kwartsstof en de gebruiksomstandigheden. Daarbij wordt in acht genomen dat
      het ademhalingsbeschermingsmiddel geschikt is wanneer de daaraan toegekende protectiefactor, als
      genoemd in [tabel 2 en de daarbij behorende onderdelen a. tot en met g. van bijlage 13][ref6] bij deze
      beleidsregel, toereikend is om de blootstelling aan kwartsstof te reduceren tot onder de op grond van
      [artikel 4.20 van de Arbeidsomstandighedenregeling][ref7] vastgestelde wettelijke grenswaarde voor kristallijn
      respirabel kwarts.

      *(Deze beleidsregel is in werking getreden op 1 januari 2001)*


