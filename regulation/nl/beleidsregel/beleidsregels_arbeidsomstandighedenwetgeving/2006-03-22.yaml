  - number: '4.113'
    text: |-
      1 Maatregelen als bedoeld in [artikel 4.113 van het Arbeidsomstandighedenbesluit][ref1] zijn in elk geval niet
      doeltreffend als de concentraties van stoffen in de ademzone van thuiswerkers de voor die stoffen vastgestelde
      wettelijke of bestuurlijke grenswaarden overschrijden. De bestuurlijke grenswaarden zijn gedefinieerd in
      beleidsregel 4.2-1. Daarnaast wordt het volgende in acht genomen worden:

      a. Als voor de desbetreffende stof geen wettelijke of bestuurlijke grenswaarde is vastgesteld, geldt dat
      overschrijding van een door de werkgever vast te stellen grenswaarde, die naar de huidige stand van wetenschap en
      inzicht als een veilige blootstellingsgrens kan worden beschouwd, strijdig is met het bepaalde in dit lid.

      b. Bij blootstelling aan stoffen waarvan bekend is dat de afzonderlijke componenten dezelfde toxische werking
      hebben op eenzelfde orgaansysteem, geldt de zogenaamde additieregel, als bedoeld in [bijlage 7][ref2] bij deze
      beleidsregels, voor het vaststellen van de waarde die met mag worden overschreden.

      2 Het ter beschikking stellen van persoonlijke ademhalingsbeschermingsmiddelen ingeval van voorzienbare
      overschrijding van de in het eerste lid bedoelde waarde is geen doeltreffende maatregel als bedoeld in
      [artikel 4.113 van het Arbeidsomstandighedenbesluit][ref3].

      3 Maatregelen als bedoeld in [artikel 4.113 van het Arbeidsomstandighedenbesluit][ref4] zijn met doeltreffend als
      huidcontact aanwezig is of mogelijk blijkt met stoffen waarvoor een huidnotatie is vastgesteld, zoals opgenomen
      in de lijst van wettelijke grenswaarden in [bijlage VI bij de Arbeidsomstandighedenregeling][ref5], dan wel in de
      lijst van bestuurlijke grenswaarden in [bijlage 6][ref6] van deze beleidsregels. In dergelijke situaties worden
      doelmatige persoonlijke huidbeschermingsmiddelen gedragen.

      4 Maatregelen als bedoeld in [artikel 4.113 van het Arbeidsomstandighedenbesluit][ref7] zijn met doeltreffend als
      huidcontact aanwezig is of mogelijk blijkt met stoffen, die voldoen aan de criteria voor toekenning van de volgende
      gevaarszinnen en veiligheidsaanbevelingen (R- en S-zinnen):

      a. R21: "Schadelijk bij aanraking met de huid"

      b. R24: "Vergiftig bij aanraking met de huid"

      c. R27: "Zeer vergiftig bij aanraking met de huid"

      d. R34: "Veroorzaakt brandwonden"

      e. R35: "Veroorzaakt ernstige brandwonden"

      f. R38: "Irriterend voor de huid"

      g. R43: "Kan overgevoeligheid veroorzaken bij contact met de huid"

      h. S36: "Draag geschikte beschermende kleding"

      i. S37: "Draag geschikte handschoenen"

      In dergelijke situaties worden doelmatige persoonlijke huidbeschermingsmiddelen gedragen.

      5 Maatregelen als bedoeld in [artikel 4.113 van het Arbeidsomstandighedenbesluit][ref8] zijn niet doeltreffend als
      oogcontact aanwezig is of mogelijk blijkt met stoffen, die voldoen aan de criteria voor toekenning van de volgende
      gevaarszinnen en veiligheidsaanbevelingen.

      a. R34: "Veroorzaakt brandwonden"

      b. R35: "Veroorzaakt ernstige brandwonden"

      c. R36: "Irriterend voor de ogen"

      d. R41: "Gevaar voor ernstig oogletsel"

      e. S39: "Een beschermingsmiddel voor de ogen/voor het gezicht dragen".

      In dergelijke situaties worden doelmatige persoonlijke oog- of gezichtbeschermingsmiddelen gedragen.


