  - number: 5.4 -1b
    text: |-
      Als bij staand werk een stasteun ter beschikking is gesteld is deze doelmatig in de zin van
      [artikel 5.4, tweede lid, van het Arbeidsomstandighedenbesluit][ref1] als de vrije been- en voetruimte resp. 24 en
      42 cm is, het hoogteverstelbereik (met gasveer) tussen 65 en 90 cm ligt, het steunvlak minimaal 20x20 cm bedraagt,
      de hoek ten opzichte van de verticaal 20 tot 30 graden naar voren is gekanteld en bij een kruispoot met wielen de
      wielen geremd zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel5.4
    url: https://wetten.overheid.nl/BWBR0013042/2006-03-22#Artikel5.4_-1b
