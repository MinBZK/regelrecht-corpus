        artikel: '7.20'
  - number: '7.21'
    text: |-
      Onder afdoende technische maatregelen als bedoeld in
      [artikel 7.21, eerste lid, van het Arbeidsomstandighedenbesluit][ref1] worden een der volgende oplossingen
      verstaan:

      a. De aanwezigheid van tenminste 0,5 m vrije afstand tussen de omtrek van het dak van een der liftkooien
      en uitstekende delen naast de baan van die liftkooi, behalve ter plaatse van de leisloffen en de
      bevestigingsconstructies daarvan, of

      b. Een vaste scheidingswand die over de gehele schachthoogte is aangebracht, of

      c. Een blokkeerschakelaar op het kooidak van de lift waaraan wordt gewerkt en waarmee de aangrenzende lift(en)
      buiten bedrijf kan (kunnen) worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel7.21
    url: https://wetten.overheid.nl/BWBR0013042/2006-03-22#Artikel7.21
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '7.21'
  - number: '7.22'
    text: |-
      1 Onder incidentele werkzaamheden van korte duur als bedoeld in
      [artikel 7.22, tweede lid, van het Arbeidsomstandighedenbesluit][ref1] worden werkzaamheden verstaan, die jaarlijks
      hooguit enkele malen worden verricht en die per keer niet langer duren dan ongeveer vier uur.

      2 Toepassing van andere meer geëigende middelen om moeilijk bereikbare plaatsen te bereiken als bedoeld in
      [artikel 7.22, tweede lid, van het Arbeidsomstandighedenbesluit][ref2] kan redelijkerwijs niet worden verlangd
      indien het:

      a. kortstondige werkzaamheden betreft waarvoor het aanbrengen en verwijderen van meer geëigende arbeidsmiddelen
      onevenredig hoge kosten zou veroorzaken, of

      b. werkzaamheden betreft met een spoedeisend karakter waarbij het oponthoud benodigd voor het aanbrengen van meer
      geëigende arbeidsmiddelen grotere risico's zou veroorzaken, dan de risico's die aan het werken in een werkbak zijn
      verbonden.

      3 Een werkbak is vervaardigd, ingericht, toegerust en bevestigd als bedoeld in
      [artikel 7.22, derde lid, onder a, van het Arbeidsomstandighedenbesluit][ref3] wanneer de volgende bepalingen zijn
      in acht genomen:

      a. De werkbak is berekend en wordt voor de eerste ingebruikneming beproefd op 1,25 maal de maximaal toelaatbare
      werklast. Als gevolg van de beproeving doet zich geen blijvende vervorming voor. Van deze beproeving kan een
      schriftelijk bewijs worden overgelegd.

      b. De werkbak heeft een gesloten constructie tot tenminste 1,0 m hoogte, of de werkbak is voorzien van een leuning
      op 1,0 m hoogte, een voetstootlijst en een knieregel. De voetstootlijst van een werkbak bestemd voor gebruik met
      een hijskraan is 0,4 m hoog.

      c. Voor iedere persoon, die in de werkbak aanwezig kan zijn, is binnen de binnenste begrenzing van de werkbak een
      stevige handgreep aangebracht op minimaal 1,0 m hoogte.

      d. Bij hijskranen wordt de werkbak opgehangen aan een kraanhaak middels een viersprong, waarvan de spreidhoek
      tussen de overhoekse parten maximaal 60° bedraagt.

      e. Het vloeroppervlak van de werkbak heeft een voldoende afmeting. Deze bedraagt voor een eénpersoonsbak inwendig
      minimaal 0,6 x 0,9 m, voor een tweepersoonsbak minimaal 0,6 x 1,2 m en voor een driepersoonsbak minimaal 0,6 x 1,8
      m, of is zoveel groter als in de werkbak aanwezige materialen of gereedschappen noodzakelijk maken om eenzelfde
      netto oppervlak te verkrijgen.

      f. In de werkbak bestemd voor gebruik met een hijskraan is op alle plaatsen een vrije stahoogte van tenminste 2,0
      m.

      g. De constructie, inrichting en ophanging van de werkbak is zodanig, dat geen knelgevaar voor personen aanwezig is
      tussen de werkbak en het toegepaste hijsgereedschap bij hefwerktuigen zoals vorkheftrucks is de werkbak daartoe aan
      de zijde van het hefwerktuig over de hele breedte tot een hoogte van minimaal 1,75 m voorzien van een scherm, dat
      voldoet aan het gestelde in beleidsregel [Arbobesluit 7.7][ref4].

      h. Aan de buitenzijde zijn duidelijk en onuitwisbaar de toelaatbare werklast, de eigen massa en het toelaatbare
      aantal personen aangegeven.

      i. De werkbak wordt afhankelijk van het gebruik, doch in ieder geval jaarlijks, onderzocht op goede staat en wordt
      zo nodig hersteld. Van een en ander wordt aantekening gehouden.

      j. Werkbakken bevestigd op hefwerktuigen zoals vorkheftrucks zijn voorzien van een bedieningsorgaan (vrijgeef-
      knop), dat bij bediening de hef- en daalbeweging vrijgeeft.

      k. De bevestiging van de werkbak op het hefwerktuig is geborgd.

      4 Een werkbak verkeert in een goede staat van onderhoud als bedoeld in
      [artikel 7.22, derde lid, onder a, van het Arbeidsomstandighedenbesluit][ref5] wanneer daarbij de volgende
      bepalingen zijn in acht genomen:

      a. Steeds direct voorafgaand aan het gebruik worden gecontroleerd:

      1°. de toestand en de goede werking van de hijskabel, de hijshaak en het toegepaste hijs-gereedschap,

      2°. de bevestiging van de hijskabel aan de trommel en aan de wartel c.q. de hijshaak,

      3°. de soepele werking van de wartel en

      4°. de bevestiging van de werkbak aan de hijshaak.

      b. De controles worden gedocumenteerd en zijn op het werkterrein verifieerbaar.

      c. De hijskabel wordt iedere drie maanden geïnspecteerd of zoveel vaker als noodzakelijk is om een veilig gebruik
      te waarborgen.

      5 Een werkbak hangend aan een hijskraan wordt gebruikt als bedoeld in
      [artikel 7.22, derde lid, onder a, van het Arbeidsomstandighedenbesluit][ref6] wanneer daarbij de volgende
      bepalingen worden in acht genomen:

      a. Met een mobiele hijskraan, waaraan een bemande werkbak is bevestigd, wordt niet gereden.

      b. Met een op een kraanbaan rijdende hijskraan met bemande werkbak wordt alleen met kruipsnelheid (max 2,5 km/
      h) gereden.

      c. Tussen de kraanmachinist en de personen in de werkbak bestaat waar mogelijk steeds rechtstreeks visueel contact
      en er wordt tussen hen altijd een onbelemmerde communicatie instandgehouden tijdens het verblijf in de werkbak.
      De kraanmachinist en de personen in de werkbak zijn hierover vooraf genstrueerd en zij hebben duidelijke afspraken
      gemaakt over de communicatie tijdens het verblijf in de werkbak. Vanuit de werkbak worden de aanwijzingen aan de
      kraanmachinist steeds door een en dezelfde persoon gegeven.

      d. Werkbakken worden nooit gebruikt bij windsnelheden boven 13,8 m/s (windkracht 6 Beaufort) noch bij windsnelheden
      die hoger zijn dan voor de hijskraan in normaal bedrijf toelaatbaar is..

      e. De machinist verlaat de hijskraan niet en verricht tegelijkertijd geen andere werkzaamheden, zolang er een
      bemande werkbak in zijn hijskraan hangt

      f. De werkbak wordt uitsluitend met geringe snelheid en zonder schokken of stoten verplaatst.

      g. In de werkbak bevinden zich niet meer personen en/of lasten dan waarvoor de werkbak bestemd is.

      h. De personen in de werkbak dragen allen een valbeveiliging die aan de werkbak aangelijnd is.

      i. Het betreden en verlaten van de werkbak geschiedt uitsluitend wanneer deze op een vaste ondergrond is afgezet.

      6 Een werkbak bevestigd aan of op het hefmechanisme van een hefwerktuig zoals een vorkheftruck wordt gebruikt
      als bedoeld in [artikel 7.22, derde lid, onder a, van het Arbeidsomstandighedenbesluit][ref7] wanneer daarbij de
      volgende bepalingen worden in acht genomen:

      a. De werkbak wordt tijdens gebruik slechts met geringe snelheid en zonder haperen geheven.

      b. Met een werkbak die meer dan 0,2 m is geheven wordt bij het positioneren van de werkbak alleen met kruipsnelheid
      (maximaal 2,5 km/uur) gereden.

      c. De totale massa van werkbak met inhoud bedraagt niet meer dan 50% van de maximaal toegestane belasting van het
      hefwerktuig in zijn meest ongunstige stand.

      d. De bestuurder verlaat het hefwerktuig niet en verricht tegelijkertijd geen andere werkzaamheden, zolang de
      bemande werkbak in geheven positie verkeert.

      e. De veiligheidscoefficient tegen kantelen van het hefwerktuig bedraagt tenminste 1,5 bij de meest ongunstige
      positie van de werkbak met volle belasting.

      7 Hijs- en hefwerktuigen, die in combinatie met een werkbak worden gebruikt, zijn voldoende toegerust als bedoeld
      in [artikel 7.22, derde lid, onder b, van het Arbeidsomstandighedenbesluit][ref8] indien naast de overigens voor
      deze werktuigen geldende wettelijke bepalingen de hierna vermelde bepalingen zijn in acht genomen:

      a. ten aanzien van hijskranen:

      1°. Het bij het verplaatsen van de werkbak gebruikte hijswerk is uitgerust met zgn automatische remmen, die niet
      kunnen worden uitgeschakeld. Dalen van de werkbak door middel van een vrije val is niet mogelijk.

      2°. De belasting door de volbelaste werkbak van de hijskraan en het hijsgereedschap bedraagt niet méér dan één
      kwart (25%) van de toelaatbare bedrijfslast gerekend naar de hijs-tabel(len) van de kraan, respectievelijk van
      de toelaatbare werklast van het hijsgereedschap. In afwijking van de vorige volzin bedraagt van vast-opgestelde
      en van op permanente kraanbanen opgestelde hijskranen de belasting van de delen, die niet tot de kabel of
      het hijsgereedschap behoren, niet meer dan driekwart (75%) van de nominale belasting waarvoor deze delen zijn
      ontworpen.

      3°. Kraanbaangebonden hijskranen zijn voorzien van meelopende, om de railkop grijpende railklauwen, die mogelijk
      kantelen van de kraan verhinderen.

      b. ten aanzien van werkbakken bevestigd aan of op het hefmechanisme van een hefwerktuig zoals een vorkheftruck:

      1°. Het hefwerktuig is voorzien van een inrichting, die alle bewegingsfuncties blokkeert, met uitzondering van de
      rijd- en de neigfunctie.

      2°. De in het hefmechanisme van het hefwerktuig toegepaste kabels en kettingen zijn tenminste dubbel uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel7.22
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel7.22
      [ref3]: https://wetten.overheid.nl/BWBR0008498#Artikel7.22
      [ref4]: https://wetten.overheid.nl/BWBR0008498#Artikel7.7
      [ref5]: https://wetten.overheid.nl/BWBR0008498#Artikel7.22
      [ref6]: https://wetten.overheid.nl/BWBR0008498#Artikel7.22
      [ref7]: https://wetten.overheid.nl/BWBR0008498#Artikel7.22
      [ref8]: https://wetten.overheid.nl/BWBR0008498#Artikel7.22
    url: https://wetten.overheid.nl/BWBR0013042/2006-03-22#Artikel7.22
