  - number: 7.3 -2
    text: |-
      Aan het gestelde in [artikel 7.3][ref1] wordt met betrekking tot het gebruik van afkort(cirkel-) zagen met een
      radiale arm voor handmatig afkorten en in verstek zagen van aluminium voldaan indien deze, in vergelijking met
      dezelfde machines waarmee uitsluitend hout of kunststof wordt verwerkt, zijn uitgevoerd met de volgende bijzondere
      voorzieningen:

      a. een speciaal zaagblad met een negatieve snijhoek;

      b. een ondersteuning voor het werkstuk, die zodanig bemeten is, dat het zaagblad zich altijd binnen de omtrek van
      deze ondersteuning bevindt;

      c. een hoge aanslag op de ondersteuning voor het werkstuk, waar het zaagblad in de uitgangspositie geheel achter
      verdwijnt,

      d. een afscherming achter de aanslag waardoor aanraking van het zaagblad in zijn uitgangspositie is voorkomen;

      e. een mechanisme, dat ervoor zorgt, dat het zaagblad bij het loslaten van de handgreep in de uitgangspositie
      terugkeert;

      f. een opspaninrichting waarmee het werkstuk wordt vastgezet;

      g. een snelheidsbegrenzer die alleen een geleidelijke horizontale beweging van het zaagblad mogelijk maakt;

      h. een zodanige beperking van de machine, dat evenwijdig zagen aan de aanslag niet mogelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel7.3
