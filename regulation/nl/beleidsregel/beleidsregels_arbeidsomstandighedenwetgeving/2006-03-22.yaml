  - number: 4.4 -3
    text: |-
      Ten aanzien van het verladen van natriumhypochlorietoplossingen in water worden de volgende voorzieningen
      voldoende adequaat geacht ter voorkoming van het gevaar op een ongewilde gebeurtenis, als bedoeld in
      [artikel 4.4, tweede lid, van het Arbeidsomstandighedenbesluit][ref1] aansluitpunten voor laad- en losslangen zijn
      voorzien van een in wit polypropyleen uitgevoerde koppeling met linkse spoed (de zogenaamde KNZ-koppelmg).

      Deze beleidsregel is niet van toepassing aan boord van schepen.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4.4
