  - number: '3.4'
    text: |-
      Aan de verplichtingen, bedoeld in [artikel 3.4 van het Arbeidsomstandighedenbesluit][ref1], is voldaan indien voor
      de verschillende elektrische installaties de navolgende nationale normen zijn toegepast:

      a. "Veiligheidsbepalingen voor laagspanningsinstallaties", bestaande uit de onderdelen:

      - NEN 1010-0:2000, "Voorwoord en introductie";
      - NEN 1010-1:1996, "Onderwerp, toepassingsgebied en fundamentele uitgangspunten";
      - NEN 1010-2:1996. "Termen en definities";
      - NEN 1010-3:1996, "Algemene kenmerken";
      - NEN 1010-4:1996, "Beschermingsmaatregelen";
      - NEN 1010-5:1996, "Keuze en installatie van elektrisch materieel";
      - NEN 1010-6:1997, "Inspectie";
      - NEN 1010-7:2000, "Aanvullende en bijzondere bepalingen".

      b. NEN 1041:1982 "Veiligheidsbepalingen voor hoogspanningsinstallaties", inclusief aanvulling A1:1991, voor
      elektrische installaties bij wisselspanning met een waarde van meer dan 1000 Volt en bij gelijkspanning met een
      waarde van meer dan 1500 Volt;

      c. NEN 3134:1992 "Veihgheidsbepalmgen voor laagspanningsinstallaties in medisch gebruikte ruimten, 3e druk, maart
      1992";

      d. NEN 3140:1998, "Bedrijfsvoering van elektrische installaties, Aanvullende Nederlandse bepalingen voor
      laagspanningsinstallaties";

      e. NEN 3840:1998, "Bedrijfsvoering van elektrische installaties. Aanvullende Nederlandse bepalingen voor
      hoogspanningsinstallaties";

      f. NEN 5237:1995 "Veiligheidsbepalingen voor elektrische schrikdraadinstallaties;

      g. NEN-EN 50110-1:1998, "Bedrijfsvoering van elektrische installaties, Algemene bepalingen", zulks met inachtneming
      van NEN-EN 50110-2:1998 "Bedrijfsvoering van elektrische installaties, Nationale bijlagen" Bij de vaststelling van
      procedures voor de bedrijfsvoering en het onderhoud van elektrische installaties hebben de nationale voorschriften
      genoemd in NEN-EN 50110-2 onderdeel 15 "Netherlands (NL)", voorrang boven de bepalingen zoals opgenomen in § 6 3
      "Onder spanning werken" en § 6 4 "Werken in de nabijheid van actieve delen" van NEN-EN 50110-1;

      h. NEN-EN 50281-1-2(nl) 1998, "Elektrische toestellen voor gebruik in de aanwezigheid van ontbrandbare stof – Deel
      1-2 Elektrische toestellen beschermd door omhulsels – Keuze, installatie en onderhoud;

      i. NEN-EN-IEC 60079-14 2001(nl),"Elektrisch materieel voor plaatsen waar gasontploffingsgevaar kan heersen. Deel 14
      Elektrische installaties in gevaarlijke gebieden (anders dan mijnen)".


