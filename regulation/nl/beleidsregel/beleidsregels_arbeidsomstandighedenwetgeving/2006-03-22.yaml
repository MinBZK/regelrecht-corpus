  - number: '4.60'
    text: |-
      Onder het bewerken of verwerken van zandsteen dat noodzakelijk is voor het behoud van monumenten als bedoeld in de
      Monumentenwet 1988 als bedoeld in [artikel 4.60, tweede lid, onder a, van het Arbeidsomstandighedenbesluit,][ref1]
      wordt verstaan:

      1. het uitvoeren van herstelwerkzaamheden in de vorm van het bewerken of verwerken van *bestaande* zandsteen-
      elementen in een monumentl;

      2. het gebruik van *nieuwe* zandsteen onder de volgende voorwaarden:

      a. De nieuwe zandsteen is van dezelfde soort als de verwijderde zandsteen.

      b. De hoeveelheid nieuwe zandsteen bedraagt met meer dan de hoeveelheid verwijderde zandsteen.

      c. De nieuwe zandsteen wordt in het zicht aangebracht.

      d. De toepassing van nieuwe zandsteen is noodzakelijk in verband met de eigenschappen van de steen, zowel ten
      aanzien van zichtbare verweringsaspecten als van verstoring in het watertransport.

      e. Er is sprake van het behoud van een architectonische eenheid, die destijds als één bouwfase is gerealiseerd en
      nagenoeg geheel uit zandsteen bestaat.

      f. In geval van een "lappendeken" van verschillende steensoorten wordt geen nieuwe zandsteen toegepast, tenzij de
      betreffende zandstenen onderdelen een zelfstandige architectonische eenheid vormen.

      g. Beschilderde zandsteen wordt niet door nieuwe zandsteen vervangen, tenzij de eigenschappen van de steen in
      het betreffende object, toepassing van andere steensoorten onmogelijk maken in verband met verstoring in het
      watertransport.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4.60
    url: https://wetten.overheid.nl/BWBR0013042/2006-03-22#Artikel4.60
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4.60'
  - number: 4.87-1
    text: |-
      1 De maatregelen, bedoeld in [artikel 4.87 van het Arbeidsomstandighedenbesluit][ref1], zijn ten aanzien van het
      voorkomen of beperken van de blootstelling aan legionellabacteriën bij het in bedrijf nemen en houden van een
      koeltoren die water in aërosolvorm in de lucht kan brengen, doeltreffend indien:

      a. het ontstaan en de verspreiding van waternevel zoveel mogelijk worden beperkt;

      b. de stilstand van water in leidingen, reservoirs en appendages zoveel mogelijk wordt vermeden;

      c. de installatie en het water in de installatie schoon blijven;

      d. vermeerdering van legionellabacteriën zo veel mogelijk wordt beperkt door toepassing van
      waterbehandelingstechnieken;

      e. een juiste en veilige werking van de installatie conform de processpecificaties wordt gewaarborgd.

      2 De maatregelen, bedoeld in het eerste lid, zijn opgenomen in een legionella-beheersplan, dat onderdeel vormt
      van het plan van aanpak, bedoeld in [artikel 5 van de Arbeidsomstandighedenwet 1998][ref2], en dat naast deze
      maatregelen in ieder geval bevat:

      a. een tekening of schema met de actuele indeling van de installatie of het systeem, inclusief de onderdelen die
      tijdelijk buiten gebruik zijn;

      b. een beschrijving van de juiste en veilige werking van het systeem;

      c. een beschrijving van alle uit te voeren controles, inclusief de controle op de aanwezigheid van legionella,
      zodat de effectiviteit van het beheersplan en de regelmaat van die controles zijn gewaarborgd;

      d. een aanduiding van de waarden van de fysische, chemische en microbiologische parameters inclusief de
      concentratie aan legionellabacteriën in de installatie waarbij maatregelen ter verbetering zullen worden getroffen,
      alsmede een beschrijving van die maatregelen;

      e. een beschrijving van de maatregelen die worden genomen bij calamiteiten;

      f. een beschrijving van de maatregelen die worden getroffen om werknemers die betrokken zijn bij het onderhoud en
      beheer, dan wel in de nabijheid van de koeltoren werkzaamheden verrichten, doeltreffend te beschermen.

      3 In het legionella-beheersplan, bedoeld in het tweede lid, wordt aantekening gemaakt van de
      onderhoudswerkzaamheden die worden verricht, de wijzigingen in de installatie of onderhoud, de uitkomsten van alle
      controles die worden uitgevoerd, alsmede bijzonderheden over de werking van de installatie, bedoeld in het eerste
      lid. Deze aantekeningen worden ten minste drie jaar bewaard.

      4 De maatregelen, bedoeld in [artikel 4.87 van het Arbeidsomstandighedenbesluit][ref3], zijn ten aanzien van het
      voorkomen of beperken van de blootstelling aan legionellabacteriën bij het in bedrijf nemen en houden van:

      a. een luchtbevochtigingsinstallatie anders dan een stoombevochtiger;

      b. een waterinstallatie die water in aërosolvorm in de lucht kan brengen, niet zijnde een collectieve
      watervoorziening als bedoeld in artikel 1, eerste lid, onder g, of een collectief leidingnet als bedoeld in
      [artikel 1, eerste lid, onder h, van de Waterleidingwet][ref4], doeltreffend, indien het water in deze installatie
      minder dan 100 kolonievormende eenheden legionellabacteriën per liter bevat. Het nemen en analyseren van monsters
      ter controle van de aanwezigheid van legionellabacteriën geschiedt overeenkomstig NEN 6265 of een gelijkwaardige
      methode.

      5 Indien uit de risico-inventarisatie en -evaluatie, bedoeld in
      [artikel 5 van de Arbeidsomstandighedenwet 1998][ref5] en [artikel 4.85 van het Arbeidsomstandighedenbesluit][ref6],
      blijkt dat niet voortdurend kan worden voldaan aan het gestelde in het vierde lid, worden een of meer van de
      volgende maatregelen genomen:

      a. watertemperaturen die bevorderlijk zijn voor de vermeerdering van legionellabacteriën worden voorkomen;

      b. de stilstand van water in leidingen, reservoirs en appendages wordt zoveel mogelijk vermeden;

      c. het gebruik van materialen die bacteriën en andere micro-organismen kunnen bevatten of een voedingsbodem zijn
      voor legionellabacteriën wordt zoveel mogelijk beperkt;

      d. de installatie en het water in de installatie worden schoongehouden;

      e. waterbehandelingstechnieken worden toegepast die de vermeerdering van legionellabacteriën beperken.

      6 De maatregelen, bedoeld in het vierde en vijfde lid, zijn opgenomen in een legionella-beheersplan dat onderdeel
      vormt van het plan van aanpak, bedoeld in [artikel 5 van de Arbeidsomstandighedenwet 1998][ref7], en dat naast deze
      maatregelen in ieder geval bevat:

      a. een tekening of schema met de actuele indeling van de installatie, inclusief de onderdelen die tijdelijk buiten
      gebruik zijn;

      b. een beschrijving van de juiste en veilige werking van de installatie;

      c. een beschrijving van alle uit te voeren controles, inclusief de controle op de aanwezigheid van legionella,
      zodat de effectiviteit van het beheersplan en de regelmaat van die controles zijn gewaarborgd;

      d. een beschrijving van de maatregelen die worden genomen indien de concentratie aan legionellabacteriën in de
      installatie hoger is dan de waarde, bedoeld in het vierde lid;

      e. een beschrijving van de maatregelen die worden getroffen om werknemers die betrokken zijn bij het onderhoud en
      beheer van de installatie doeltreffend te beschermen.

      7 In het legionella-beheersplan, bedoeld in het zesde lid, wordt aantekening gemaakt van de onderhoudswerkzaamheden
      die worden verricht, de wijzigingen in de installatie of onderhoud, de uitkomsten van alle controles die worden
      uitgevoerd, alsmede bijzonderheden over de werking van de installatie, bedoeld in het vierde lid. De aantekeningen
      worden ten minste drie jaar bewaard. Voor een installatie aan boord van een schip is het beheersplan ter inzage aan
      boord van dat schip.


