      10 Gecompliceerde mengsels Bepaling van de factor O.

      a. Indien sprake is van een mengsel van een groot aantal stoffen met verschillende kookpunten, is het vaak niet
      doenlijk de berekening voor elke stof afzonderlijk uit te voeren (te denken valt aan aardolieproducten) In die
      gevallen kan voor het kookpunt van het mengsel het zogenaamde 10% punt aangehouden worden (de temperatuur waarbij
      tien procent van het mengsel bij een standaard- testmethode overgedestilleerd is).

      b. Voor gevaarlijke stoffen die zijn verdund met een ongevaarlijk oplosmiddel, bijvoorbeeld ammoniak in water,
      zoutzuur in water of alcohol in water, moet uitsluitend de in de installatie aanwezige hoeveelheid gevaarlijke
      stof, los van het oplosmiddel beschouwd worden.

      c. De factor O mag in een dergelijk geval tussen de grenzen 0,1 en 10 worden afgestemd op het onder de
      procescondities te verwachten dampgenererend vermogen bij de ontsnapping van de oplossing. De factor wordt berekend
      door de partiële dampspanning van de gevaarlijke stof boven de oplossing bij de procestemperatuur, te delen door
      de atmosferische druk bij de berekening van de factor moet deze op een geheel getal afgerond worden indien het
      resultaat tussen één en tien ligt en op een decimaal indien het resultaat kleiner dan één is, met dien verstande
      dat de ondergrens 0,1 is bij de voorbeelden in de toelichting bij deze beleidsregel is een dergelijk geval
      uitgewerkt.

      d. Bij een procestemperatuur beneden 25°C wordt O voor vloeistoffen als volgt verhoogd:









                        procestemperatuur:


                        25°C tot –25°C


                        O + 0





                        –25°C tot –75°C


                        O + 1





                        –75°C tot –125°C


                        O + 2





                        –125°C tot –175°C


                        O + 3






      met dien verstande dat de resulterende O maximaal 10 bedraagt.

      e. De totale omstandigheidsfactor O is gelijk aan het product van de factor voor opslag (O), de factor voor
      omhulling (O) en de procesfactor (O).

      11 Omstandigheidsfactor voor opslag.

      In of aan installaties voor opslag kunnen voorzieningen zijn getroffen die tot doel hebben de opgeslagen stof onder
      opslagcondittes te houden (bijv. een warmtewisselaar, roerwerk circulatiesysteem, doseersysteem). Het ingebruik
      hebben van een dergelijke voorziening heeft met tot gevolg dat de installatie voor opslag als een installatie voor
      bewerking bezien moet worden. De toe te kennen omstandigheidsfactor blijft 0,01.

      12 Deze beleidsregel is van toepassing indien op grond van
      [artikel 9.34 van het Arbeidsomstandighedenbesluit][ref14]__REF001_________________________________________________
