  - number: 4.4 -7
    text: |-
      Ten aanzien van de blootstelling van werknemers aan chemische of inerte blusmiddelen van automatische
      brandblusinstallaties worden de volgende voorzieningen adequaat geacht ter vermijding van een ongewilde
      gebeurtenis als bedoeld in [artikel 4.4, eerste lid, van het Arbeidsomstandighedenbesluit][ref1]. Om passend te
      zijn in de zin van [artikel 3.8, eerste lid, van het Arbeidsomstandighedenbesluit][ref2] voldoen automatische
      brandblusinstallaties in ieder geval aan deze beleidsregel.

      1 Bij elke toegang tot door bedoelde installaties beveiligde ruimten is een rechthoekig wit bord met rode rand
      aanwezig waarop in zwarte letters de volgende tekst is weergegeven "AUTOMATISCHE BRANDBLUSINSTALLATIE bij brand of
      alarm de ruimte onmiddellijk verlaten". De afmetingen van het bord zijn vermeld in NEN 3011:1986 "Veihgheidskleuren
      en tekens".

      2 Bij brandblusinstallaties met kooldioxide als blusgas wordt het volgende in acht genomen:

      a. Ruimten waar een dergelijke installatie in werking gaat treden worden onmiddellijk verlaten.

      b. Een optisch en akoestisch signaal waarschuwt voor inwerkingtreding van de installatie.

      c. Een vertraging van minimaal 30 seconden is ingebouwd tussen het tijdstip van alarmering en het vrijkomen van
      het blusmiddel.

      d. Zodanige vluchtvoorzieningen zijn aanwezig in de betreffende ruimten dat werknemers deze ruimten kunnen verlaten
      voor het begin van het uitstromen van de blusstof.

      e. Aan de buitenzijde van deze ruimten bevmdt zich een schakelaar waarmee de brandblusinstallaties handmatig kan
      worden geblokkeerd.

      f. Tenminste twee persluchtademhalingstoestellen zijn aanwezig in de onmiddellijke nabijheid van de met bedoelde
      installaties beveiligde ruimten.

      g. Geen andere werknemers dan personen als bedoeld in
      [artikel 15, eerste lid, van de Arbeidsomstandighedenwet 1998][ref3] betreden een ruimte waar een kooldioxide
      blusinstallatie in werking is getreden. Deze personen maken gebruik van een persluchtademhalingtoestel.

      3 Bij brandblusinstallaties met mertgas als blusgas wordt het volgende in acht genomen:

      a. Ruimten waar een dergelijke installatie in werking treedt, worden onmiddellijk verlaten.

      b. Zodanige vluchtvoorzieningen zijn aanwezig in de betreffende ruimten dat de werknemers deze ruimten binnen 1
      minuut na het begin van het uitstromen van de blusstof hebben kunnen verlaten.

      c. Een optisch en akoestisch signaal waarschuwt voor inwerkingtreding van de installatie.

      d. Ruimten beveiligd met bedoelde installaties waarin tijdens de blussing het zuurstofpercentage lager kan worden
      dan 10 volumeprocenten worden gelijkgesteld aan ruimten met kooldioxide blusinstallaties.

      e. Tenminste twee persluchtademhalingstoestellen zijn aanwezig in de onmiddellijke nabijheid van de met bedoelde
      installaties beveiligde ruimten.

      f. Geen andere werknemers dan personen als bedoeld in
      [artikel 15, eerste lid, van de Arbeidsomstandighedenwet 1998][ref4] betreden een ruimte waar een mertgas
      blusinstallatie in werking is getreden. Deze personen maken gebruik van een persluchtademhalingtoestel.

      4 Bij brandblusinstallaties met halonen en fluorkoolwaterstoffen (chemische blusmiddelen) wordt het volgende in
      acht genomen:

      a. Ruimten waar bedoelde installatie voorzien van Halon 1211 of Halon 1301 als blusmiddel in een concentratie
      groter dan 10% in werking treedt, worden onmiddellijk verlaten.

      b. Een optisch en akoestisch signaal waarschuwt voor inwerkingtreding van de installatie.

      c. Halonen en fluorkoolwaterstoffen worden alleen als blusmiddelen in bedoelde systemen toegepast als de
      installatie beoogt oppervlaktebranden te bestrijden en de blustijd even lang is als de uitstroomtijd van het
      blusgas uit de bluscylinders.

      d. Aan de buitenzijde van deze ruimten bevindt zich een schakelaar waarmee de brandblusinstallatie handmatig kan
      worden geblokkeerd.


