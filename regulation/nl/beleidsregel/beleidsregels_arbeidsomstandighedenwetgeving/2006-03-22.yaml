  - number: 4.9 -2
    text: |-
      Bij schadelijke of hinderlijke blootstelling aan rook als gevolg van lassen, gutsen, plasmasnijden
      en solderen van metaal, wordt voldaan aan [artikel 4.8b, eerste, derde en vierde lid][ref1],
      [artikel 4.9, eerste tot en met derde lid en het vijfde tot en met negende lid][ref2], [artikelen 4.16][ref3],
      [4.17][ref4], [4.18][ref5], juncto [hoofdstuk 8, afdeling 1 van het Arbeidsomstandighedenbesluit][ref6], indien de
      ‘Praktijkrichtlijn, beschrijving van doeltreffende maatregelen bij blootstelling aan rook en/of gassen afkomstig
      van lassen en/of verwante processen’ (13 maart 2002), in acht wordt genomen.


