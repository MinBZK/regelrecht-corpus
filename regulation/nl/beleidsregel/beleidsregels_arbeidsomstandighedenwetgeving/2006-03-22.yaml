  - number: '7.9'
    text: |-
      Werknemers komen in de onmiddellijke nabijheid van een arbeidsmiddel als bedoeld in[ artikel 7.9][ref1], wanneer
      de afstand van lichaamsdelen tot oppervlakken met een zeer hoge of zeer lage temperatuur kleiner is dan de
      minimum afstanden genoemd in NEN-EN 294:1994 "Veiligheid van machines – Veiligheidsafstanden ter voorkoming van
      het bereiken van gevaarlijke zones met de bovenste ledematen-", of NEN-EN 811:1996 "Veiligheid van machines –
      Veihgheidsafstanden ter voorkoming van het bereiken van gevaarlijke zones met de onderste ledematen".

      Indien de kans op aanraking, aldus gedefinieerd, niet kan worden voorkomen mogen de oppervlakte temperaturen niet
      hoger zijn dan de toelaatbare grenswaarde van NEN-EN 563:1997 "Veiligheid van machines. Temperaturen van aan te
      raken oppervlakken Ergonomische gegevens om temperatuur-grenswaarden voor hete oppervlakken vast te stellen" en
      niet lager zijn dan –20°C.

      Deze beleidsregel is niet van toepassing op transportmiddelen die zijn uitgesloten van de werkingssfeer van het op
      de [Warenwet][ref2] gebaseerde [Warenwetbesluit machines][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel7.9
      [ref2]: https://wetten.overheid.nl/BWBR0001969
      [ref3]: https://wetten.overheid.nl/BWBR0005577
