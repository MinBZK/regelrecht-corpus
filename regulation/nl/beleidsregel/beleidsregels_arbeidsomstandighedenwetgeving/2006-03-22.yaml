  - number: '3.40'
    text: |-
      Aan de verplichting ingevolge [artikel 3.40, onder c][ref1], om kogelwerend en slagvast materiaal, dat tenminste
      voor een deel doorzichtig is, te gebruiken, voor de kassawerkplek in benzinestations, die geopend zijn tussen
      21.00 uur en 06.00 uur, wordt ten aanzien van het doorzichtig materiaal voldaan indien een materiaal/glassoort is
      gebruikt die voldoet aan de eisen voor kogelwerendheid klasse BR4NS volgens NEN-EN 1063: 2000, ‘Glas voor gebouwen
      - Beveiligingsbeglazing - Beproeven en classificatie van de weerstand tegen een kogelaanval’, en aan de eisen
      voor slagvastheid klasse P6B volgens NEN-EN 356: 1999, ‘Glas in gebouwen - Beveiligingsbeglazing - Beproeven en
      classificatie van de weerstand tegen manuele aanval’. In het doorzichtig materiaal zijn geen openingen aanwezig. De
      specificaties zijn alleen voor bevoegde ogen duidelijk zichtbaar aangegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel3.40
    url: https://wetten.overheid.nl/BWBR0013042/2006-03-22#Artikel3.40
