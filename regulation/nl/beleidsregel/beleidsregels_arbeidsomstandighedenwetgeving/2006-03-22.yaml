  - number: 4.18 -2
    text: |-
      Bij de roetmeting in het kader van de APK-keuring van dieselmotoren wordt aan de verplichtingen, bedoeld in
      [artikel 4.18, eerste en tweede lid][ref1], en [artikel 6.8 van het Arbeidsomstandighedenbesluit][ref2] voldaan
      indien de aanwijzingen in de Praktijkrichtlijn roetmeting, welke als [bijlage 12][ref3] bij deze beleidsregels is
      gevoegd, worden gevolgd.

      *(Deze beleidsregel is in werking getreden op 23 juli 2000)*


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4.18
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel6.8
      [ref3]: https://wetten.overheid.nl/BWBR0013042
