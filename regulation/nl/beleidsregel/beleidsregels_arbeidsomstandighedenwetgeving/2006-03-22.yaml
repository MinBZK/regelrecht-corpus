      7 Op basis van het gestelde in [artikel 2.4, tweede lid, van het Arbeidsomstandighedenbesluit][ref8] is een lijst
      van grenswaarden van toxische stoffen opgesteld, welke is opgenomen als [bijlage 4][ref9] bij deze beleidsregels.
      Tevens is een lijst van explosieve stoffen vastgesteld, welke is opgenomen als [bijlage 5a][ref10] bij deze
      beleidsregels. De lijsten zijn niet limitatief. Ze kunnen worden aangevuld dan wel gewijzigd indien meer of betere
      gegevens bekend worden. Het kan daadoor voorkomen dat een installatie op het moment van aanvulling van de lijst
      ARIE-plichtig wordt. De verplichting tot het opstellen van een ARIE is dan gekoppeld aan het tijdstip waarop de
      desbetreffende stof met de bijbehorende grenswaarde voor het eerst op de lijst verschijnt’.

      8 Als de procestemperatuur bedoeld in [artikel 2.5, onder e en f, van het Arbeidsomstandighedenbesluit][ref11]
      gelijk is aan de omgevingstemperatuur, wordt een temperatuur van 25 °C aangehouden.

      9 De in [artikel 2.5 van het Arbeidsomstandighedenbesluit][ref12] omschreven omstandigheidsfactoren kunnen als
      volgt in tabelvorm samengevat worden:












