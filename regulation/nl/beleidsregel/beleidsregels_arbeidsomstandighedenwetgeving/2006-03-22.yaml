        artikel: 7.17b
  - number: '7.20'
    text: |-
      1 De beproeving, het onderzoek en de beoordeling van hijs- en hefgereedschappen voldoen aan het gestelde in
      [artikel 7.20, zesde tot en met achtste lid, van het Arbeidsomstandighedenbesluit,][ref1] indien zij geschieden
      overeenkomstig van toepassing zijnde nationale of internationale normalisatie normen.

      2 De Nederlandse normen die hierbij van belang zijn worden vermeld in NEN-bundel 12:1989 "Normen voor
      hijsgereedschappen en staalkabels" en in de Nederlandse praktijkrichtlijn NPR 1823:1989 "Hijsgereedschappen,
      hijswerktutgen en staalkabels. Overzicht van normen", die tevens in NEN-bundel 12 is opgenomen.

      3 Bewijsstukken als bedoeld in het negende lid van [artikel 7.20][ref2] voldoen indien daarop tenminste de gemeten
      waarden en beoordelingsresultaten zijn vermeld van alle aspecten waarvoor de gehanteerde norm beproeving, onderzoek
      of beoordeling verlangt.

      4 De bewijsstukken zijn gewaarmerkt door de personen, die het beoordelingsresultaat hebben vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel7.20
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel7.20
    url: https://wetten.overheid.nl/BWBR0013042/2006-03-22#Artikel7.20
