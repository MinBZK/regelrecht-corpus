  - number: 4.4 -6
    text: |-
      Ten aanzien van het gebruik en de opslag van chemicaliën in zweminrichtingen en de werkzaamheden die daarmee
      verband houden worden de volgende voorzieningen adequaat geacht ter voorkoming van het gevaar op een ongewilde
      gebeurtenis als bedoeld in [artikel 4.4, eerste tot en met derde lid, van het Arbeidsomstandighedenbesluit][ref1],
      danwel ter beperking van de gevolgen van een ongewilde gebeurtenis als bedoeld in
      [artikel 4.4, vierde lid van het Arbeidsomstandighedenbesluit][ref2]:

      1. Reservoirs voor natriumhypochlorietoplossing en zuren zijn geplaatst in lekbakken die tenminste de inhoud van
      het grootste reservoir kunnen bevatten, waarbij

      a. binnen één lekbak slecht één stof wordt opgeslagen al of met in meerdere reservoirs,

      b. de lekbak bestendig is tegen de inwerking van de betreffende opgeslagen stof

      2. De werkgever beschikt over een noodprocedure in het kader van de bedrijfshulpverlening als bedoeld in
      [artikel 2.18 van het Arbeidsomstandighedenbesluit][ref3] voor het geval dat door contact van natriumhypochloriet
      met een zuur of zuurvormende stof chloorgas in een ruimte vrijkomt. In deze procedure worden noodmaatregelen,
      verantwoordelijkheden en taken vastgelegd.

      3. Indien in een ruimte waar natriumhypochloriet en zuren opgeslagen zijn chloorgas aanwezig is wordt deze ruimte

      a. onmiddellijk verlaten en

      b. door niemand anders van het bedrijf dan een bedrijfshulpverlener, voorzien van een perslucht-masker,
      herbetreden. Daarbij is een tweede persoon stand-by om te kunnen alarmeren als de bedrijfshulpverlener in de ruimte
      met chloorgas iets overkomt.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4.4
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel4.4
      [ref3]: https://wetten.overheid.nl/BWBR0008498#Artikel2.18
