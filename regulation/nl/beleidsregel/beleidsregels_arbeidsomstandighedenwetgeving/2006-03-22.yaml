  - number: 4.6 -2
    text: |-
      Maatregelen gericht op het veilig kunnen betreden en kunnen verlaten van een ruimte als bedoeld in
      [artikel 4.6, tweede en derde lid, van het Arbeidsomstandighedenbesluit][ref1] worden als doeltreffend aangemerkt
      indien daarbij rekening is gehouden met de uitkomsten van het onderzoek bedoeld in [artikel 4.6, eerste lid][ref2],
      en de volgende punten daarbij worden in acht genomen.

      1. Alvorens iemand de ruimte betreedt wordt ervoor gezorgd dat de luchtverversing adequaat is zodat het ontstaan
      van het gevaar, bedoeld in [artikel 4.6, eerste lid][ref3], in de ruimte wordt voorkomen. Wanneer er kans is op
      een explosieve atmosfeer wordt voor de luchtverversing explosieveilige apparatuur toegepast. Wanneer het gevaar,
      bedoeld in [artikel 4.6, eerste lid][ref4], in de ruimte niet kan worden voorkomen wordt bij betreding gebruik
      gemaakt van onafhankelijke ademhalingsbeschermingsmiddelen waarvan de luchttoevoer onafhankelijk is van de
      atmosfeer in de ruimte.

      2. Om te voorkomen dat een dergelijke ruimte door onbevoegden wordt betreden zijn de
      toegangen tot die ruimte voorzien van het waarschuwingsbord "Gevaar", zoals beschreven in
      [bijlage XIA bij de Arbeidsomstandighedenregeling][ref5], met daaronder duidelijk zichtbaar de tekst "Niet betreden
      besloten ruimte".

      3. Wanneer uit het onderzoek vooraf blijkt dat de werkzaamheden kunnen aanvangen, worden de werkzaamheden
      zo ingericht dat door toepassing van luchtverversing het ontstaan van een gevaarlijke atmosfeer tijdens de
      werkzaamheden zoveel mogelijk wordt tegengegaan. Alle leidingen die op de besloten ruimte zijn aangesloten,
      zijn afgeblind door middel van goed zichtbare blind- of steekflenzen of zodanig losgekoppeld, dat geen gassen of
      vloeistoffen vanuit de leidingen in de ruimte kunnen komen

      4. Bij het werken in bedoelde ruimte is een persoon buiten de ruimte aanwezig die meteen kan optreden wanneer de
      gevaren zich daadwerkelijk voordoen

      5. Wanneer er sprake is van gevaar voor brand en/of explosie worden vonkvrije gereedschappen gebruikt en
      arbeidsmiddelen toegepast die voldoen aan de eisen neergelegd in het op de [Warenwet][ref6] gebaseerde
      [Warenwetbesluit explosieveilig materieel][ref7]. Werk waarbij vonken of hete oppervlakken kunnen ontstaan wordt
      alleen uitgevoerd wanneer de concentratie van de brandbare stoffen in de atmosfeer ter plekke lager is dan 10
      volumeprocent van de LEL (lower explosion limit) van de betreffende stof(fen).

      6. Indien er gevaar bestaat voor het vlam vatten van stoffen of voorwerpen die tot ontbranding kunnen overgaan
      worden de plaatsen binnen de bedoelde ruimte waar met open vuur wordt gewerkt eerst zorgvuldig van deze stoffen
      of voorwerpen ontdaan en worden de werkzaamheden met open vuur alleen verricht als adequate brandblusmiddelen van
      voldoende capaciteit aanwezig zijn.

      7. De werkgever beschikt over een noodprocedure in het kader van de bedrijfshulpverlening als bedoeld in
      [artikel 2.18 van het Arbeidsomstandighedenbesluit][ref8] voor het geval zich in bedoelde ruimten de in
      [artikel 4.6, eerste lid][ref9], genoemde gevaren daadwerkelijk voordoen. In deze procedure worden noodmaatregelen,
      verantwoordelijkheden en taken vastgelegd.

      Als een onderdeel van deze procedure geldt in ieder geval dat bij het werken in bedoelde ruimte altijd een persoon
      buiten de ruimte aanwezig is die ter plekke toezicht houdt en meteen kan optreden wanneer de gevaren zich voordoen.

      8. Personen die bedoelde ruimte betreden dragen een reddingsgordel. Deze gordel is voorzien van een voldoende lange
      en sterke reddingslijn die bestendig is tegen de stoffen die in de besloten ruimte aanwezig zijn. Deze lijn wordt
      in de nabijheid van de toegang van de ruimte deugdelijk vastgezet.

      9. In afwijking van het in punt 8 gestelde geldt voor moeilijk toegankelijke of kleine besloten ruimten
      dat, wanneer de beoordeling in het kader van de inventarisatie en evaluatie van risico's bedoeld in de
      [Arbeidsomstandighedenwet 1998][ref10], daartoe leidt, andere hulpmiddelen toegepast danwel andere maatregelen
      getroffen kunnen worden om de veiligheid van de persoon die de besloten ruimte betreedt te verzekeren.


