  - number: '5.1'
    text: |-
      Aan ergonomische eisen als bedoeld in [artikel 5.1 van de Arbeidsomstandighedenregeling][ref1] voor apparatuur en
      meubilair in gebruik bij het verrichten van beeldschermwerk wordt voldaan wanneer naast dan wel ter uitvoering van
      de in dat artikel genoemde eisen het navolgende in acht wordt genomen:

      1. Om onnodige vermoeiing van de ogen te voorkomen bevinden toetsenbord, document en beeldscherm zich op ongeveer
      gelijke kijkafstand. Bij administratief beeldschermwerk kan de werknemer de kijkafstand naar behoefte wijzigen,
      in ieder geval zodanig dat de werknemer recht voor het beeldscherm kan zitten en de kijkafstand ten minste 50
      centimeter bedraagt. In werksituaties waarbij de werknemer overwegend naar het document kijkt, kan de werknemer
      het document op een documenthouder recht voor zich plaatsen. Bij administratief beeldschermwerk voldoet een
      beeldschermwerktafel aan de norm NEN 2449:1990 "Ergonomie Ergonomische criteria voor kantoortafels. Eisen voor
      afmetingen en uitvoering Beproevingsmethoden " waarbij in plaats van de instelbaarheid in hoogte ook van een tafel
      met een vaste werkhoogte gebruik kan worden gemaakt, mits deze vaste werkhoogte tussen 74 en 76 centimeter ligt.

      2. In regelkamers ligt de werkhoogte (vanaf het vloeroppervlak tot aan de bovenzijde van het werkvlak) tussen
      72 en 76 centimeter, of de werkhoogte is tussen deze hoogten instelbaar bij de zitplaats van de werknemer is het
      werkblad, inclusief een eventuele draagconstructie in ieder geval met dikker dan 5 centimeter. De vrije ruimte
      voor de benen op een werkplek in een regelkamer is minimaal 60 centimeter breed, 60 centimeter diep, gemeten vanaf
      de voorzijde van het werkvlak, en 70 centimeter hoog. Op het werkvlak is er naast de bedieningsmiddelen een vrije
      ruimte van minimaal 30 x 30 centimeter beschikbaar waarop de werknemer documenten en naslagwerken kan raadplegen.
      Het beeldscherm kan zo worden opgesteld dat de kijkafstand niet minder dan 50 centimeter bedraagt.

      3. Indien grafisch tekenwerk wordt verricht is een werktafel vereist met twee afzonderlijke werkvlakken een
      beeldschermwerkvlak waarop het beeldscherm staat en een bedienwerkvlak met daarop de bedieningsmiddelen.
      Het bedienwerkvlak is in hoogte instelbaar tussen 62 en 82 centimeter en biedt de benen van de werknemer een
      vrije ruimte van minimaal 70 centimeter diep en 60 breed. Het bedienwerkvlak zelf is daarbij niet dikker dan 5
      centimeter, inclusief een eventuele draagconstructie.

      4. Een stoel die bij beeldschermwerk wordt gebruikt, voldoet aan de norm NEN-EN 1335-1:2000, ‘Kantoormeubelen -
      Kantoorstoelen - Deel 1: Afmetingen - Bepaling van afmetingen’, met de aanduiding ‘type A’.

      5. Indien de werksituatie een voetensteun vereist, dan zorgt de werkgever daarvoor. Deze voldoet aan de norm DIN
      4556:1983 "Büromöbel Fußstützen fur Büroarbeitsplatz, Anforderungen, Maße",

      6. Indien bij administratief beeldschermwerk met documenten wordt gewerkt is een documenthouder vereist. Deze
      voldoet aan de eisen van de Nederlandse Praktijkrichtlijn NPR 1813:2000 "Ergonomische uitgangspunten voor
      kantoormeubelen en aanwijzingen voor het gebruik. Toelichting bij NEN 1812 en NEN 2449". Voor de documenthouder
      geldt bovendien dat deze stabiel is en niet trilt tijdens het gebruik van het toetsenbord.

      7. De beeldschermapparatuur voldoet aan de specificaties in de norm NEN-ISO 9241-3:1997 "Ergonomische eisen voor
      kantoorarbeid met beeldschermen Deel 3: eisen voor het beeldscherm" Het toetsenbord is een los component van
      het beeldschermapparaat. De dikte ervan bedraagt in het midden (ter hoogte van de letterreeks a, s, d, f) niet
      meer dan 4 centimeter. De gemiddelde hellingshoek van de bovenzijde van het toetsenbord ligt tussen 5 en 25°. De
      onderzijde van het toetsenbord is stroef. De toetsen van het toetsenbord zijn bij administratief beeldschermwerk
      gerangschikt volgens de qwerty-indeling, en uitgevoerd conform NEN 2294:1986 "Toetsenborden voor schrijfmachines en
      gegevensverwerkingsapparatuur".

      8. Als bij de bediening van de apparatuur een muis wordt gebruikt, zijn de afmetingen van het bijbehorende werkvlak
      toereikend om de cursor over het gehele scherm te bewegen. De inrichting houdt rekening met rechts- en Iinkshandige
      bediening. De lengte van een verbindingssnoer is afgestemd op zowel links- als rechtshandig gebruik van de muis.

      9. Als bij de bediening van de apparatuur een stuurknuppel of een rolbal wordt gebruikt, is de werkplek uitgerust
      met een ondersteuningsmogelijkheid voor de onderarm, en is deze in een ontspannen lichaamshouding goed bereikbaar
      voor de dominante hand van de werknemer. Het werkvlak daarbij is horizontaal of nagenoeg horizontaal bij ontspannen
      schoudergordel bevindt dit werkvlak zich maximaal 10 centimeter onder het niveau van de ellebogen van de werknemer
      bij tweehandige bediening van een rolbal bevindt deze zich midden voor de werknemer op een afstand van 20 tot 40
      centimeter, gemeten vanaf de voorkant van het werkvlak.

      10. Als de bediening van de apparatuur plaatsvindt aan de hand van een aanraakscherm of een lichtpen, bevindt het
      gehele scherm zich onder handbereik, dat wil zeggen binnen een straal van 45 centimeter, gemeten vanaf de voorkant
      van het werkvlak. Een grafisch tablet, indien aanwezig, is niet dikker dan 2 centimeter, waarbij deze geplaatst is
      onder een hoek van 15° recht voor het beeldscherm. Het grafisch tablet heeft een mat oppervlak in een lichte tint.


