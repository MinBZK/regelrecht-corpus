  - number: 4.87-2
    text: >-
      Instellingen waarvan de werknemers kans lopen op accidenteel bloedcontact met humaan bloed hanteren een post-
      expositie protocol voor accidenteel bloedcontact dat voldoet aan algemeen geldende inzichten op dit gebied
      en waarin met name aandacht wordt besteed aan mogelijke besmetting met hepatitis B of C en het humane
      immunodeficientie virus (HIV).
    url: https://wetten.overheid.nl/BWBR0013042/2006-03-22#Artikel4.87-2
  - number: '4.91'
    text: |-
      1 Werknemers werkzaam in medische en paramedische beroepen die kans lopen intensief met humaan bloed in contact te
      komen, worden door de werkgever in de gelegenheid gesteld zich te laten vaccineren tegen hepatitis B.

      2 Onder de in het eerste lid genoemde werknemers worden in elk geval verstaan:

      a. artsen, verpleegkundigen en paramedici die regelmatig met humaan bloed of met ander met humaan bloed
      verontreinigd patientenmateriaal in contact komen;

      b. patholoog-anatomen en hun medewerkers, die met niet gefixeerd potentieel besmet materiaal werken;

      c. werknemers op hemodialyse-afdelingen, die rechtstreeks bij de patiëntenzorg of bij de techniek van de
      hemodialyseprocedure betrokken zijn, inclusief werknemers in het technisch onderhoud;

      d. werknemers in diagnostische en researchlaboratoria, die geregeld met humaan bloed of humane bloedproducten in
      aanraking komen;

      e. verloskundigen en kraamverzorgsters;

      f. tandartsen, mondhygienisten, tandartsassistenten en indirect bij de tandheelkundige patiëntenzorg betrokkenen,
      die kans lopen te worden besmet.

      3 Werknemers die proefdieren verzorgen in laboratoria waar met het hepatitis B virus gewerkt wordt, worden door de
      werkgever in de gelegenheid gesteld zich te laten vaccineren tegen hepatitis B.

      4 Werknemers in ziekenhuizen die schoonmaakwerkzaamheden verrichten of afval verwijderen worden door de werkgever
      in de gelegenheid gesteld zich te laten vaccineren tegen hepatitis B wanneer een gerede kans op besmetting bestaat.

      5 Werknemers die niet-gefixeerd, potentieel besmet pathologisch materiaal vervoeren worden door de werkgever in de
      gelegenheid gesteld zich te laten vaccineren tegen hepatitis B wanneer een gerede kans op besmetting bestaat.

      6 Van werknemers die ingeënt zijn tegen hepatitis B wordt een vaccinatiekaart opgesteld waarop minimaal
      de datum van vaccinatie en de antistoftiters (na vaccinatie of na tussentijdse controle) met de datum van
      bepaling staan vermeld. De gevaccineerde werknemer ontvangt een afschrift van de vaccinatiegegevens. De
      vaccinatiekaart wordt op verzoek beschikbaar gesteld aan een daartoe aangewezen ambtenaar als bedoeld in
      [artikel 24, eerste lid, van de wet][ref1] en wordt tenminste vijftien jaar bewaard door de instelling.

      7 Er wordt een registratie gevoerd van werknemers die zijn gevaccineerd tegen hepatitis B.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel24
