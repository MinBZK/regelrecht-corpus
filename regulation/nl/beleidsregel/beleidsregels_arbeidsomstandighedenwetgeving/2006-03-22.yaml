  - number: 5.2 -1
    text: |-
      Aan het bepaalde in [artikel 5.2][ref1] en [5.6 van het Arbeidsomstandighedenbesluit][ref2] wordt voor wat betreft
      arbeid aan of met trekkenwanden in theaters voldaan als het volgende in acht wordt genomen en terzake doeltreffende
      voorlichting aan de werknemers wordt gegeven overeenkomstig het bepaalde in [artikel 5.5, eerste lid][ref3].

      1. Er zijn maximaal 20 handbediende trekken per trekkenwand.

      2. Per trek is het te belasten gewicht nooit zwaarder dan 75 kg.

      3. De kluitenstang is zodanig geconstrueerd dat deze niet meer dan 75 kg aan kluiten kan bevatten.

      4. Het kluitgewicht is nooit zwaarder dan 6 kg.

      5. Voor het verplaatsen van kluiten worden kluitentafels gebruikt.

      6. Hulplieren bij handbediende trekken worden alleen gebruikt als de hulplier aangrijpt op de kluitenstang.

      7. De werknemer die de werkzaamheden aan de trekkenwand verricht is in het bezit van het certificaat "Opleiding
      trekkenwand".

      8. Voor theaters waar uitvoering van het in deze beleidsregel gestelde vóór 1 januari 2004 om financiële redenen
      niet haalbaar blijkt, kan door de regionaal directeur van de Arbeidsinspectie een later tijdstip van uitvoering,
      doch met later dan 1 januari 2007, worden vastgesteld. Hierbij geldt de voorwaarde dat vóór 1 juli 2001 een plan
      van aanpak voor de mechanisatie van de trekkenwand wordt ingediend waarin wordt aangetoond dat:

      a. een besluit genomen is over aanpassing van de trekkenwand;

      b. de financiering voor aanpassing van de trekkenwand is zekergesteld en

      c. met de leverancier afspraken zijn gemaakt over de periode waarin de aanpassing van de trekkenwand zal
      plaatsvinden.

      Deze beleidsregel treedt in werking met ingang van 1 januari 2004 tenzij de regionaal directeur van de
      Arbeidsinspectie ermee heeft ingestemd dat de voorzieningen op een later tijdstip, doch uiterlijk voor 1 januari
      2007, worden gerealiseerd.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel5.2
