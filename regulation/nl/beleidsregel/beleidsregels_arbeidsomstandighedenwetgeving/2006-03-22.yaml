    text: |-
      1 Een hijskraan is een werktuig, ingericht en bestemd voor het hijsen en verplaatsen van vrijhangende lasten.

      2 Hijskranen, die voor 1 januari 1995 voor de eerste maal in Nederland in gebruik
      genomen werden en die niet voorzien zijn van een CE-markering overeenkomstig het op de
      [Warenwet][ref1] gebaseerde [Warenwetbesluit machines][ref2] voldoen aan het gestelde in
      [artikel 7.4 van het Arbeidsomstandighedenbesluit,][ref3] indien de volgende NEN-normen in acht zijn genomen:

      a. NEN 2017:1973 "Hijskranen. Algemene bepalingen",

      b. NEN 2018:1983 "Hijskranen. Belastingen en belastingcombmaties", inclusief aanvulling A1 1988,

      c. NEN 2019:1976 "Hijskranen. Het metalen geraamte", inclusief aanvulling A1 1986,

      d. NEN 2020:1994 "Hijskranen. De mechanische uitrusting" inclusief aanvulling A1 1997

      e. NEN 2021:1994 "Hijskranen. De elektrische uitrusting",

      f. NEN 2022:1976 "Hijskranen. Stabiliteit (Veiligheid tegen kantelen)" inclusief correctieblad C2:1989,

      g. NEN 2023:1994 "Hijskranen. Constructieve eisen in verband met de veiligheid", inclusief correctieblad C1:1994,

      h. NEN 2024:1973 "Hijskranen .Documenten, inbedrijfstelling, bedrijfsvoering en onderhoud",

      i. NEN 2026:1979 "Mobiele kranen. Algemene bepalingen Documenten, inbedrijfstelling, bedrijfsvoering en onderhoud",
      inclusief aanvulling A2:1993,

      j. NEN 2028:1982 "Hijskranen Automatische begrenzingsinrichtingen", inclusief aanvulling A1:1990,

      k. NEN 3508:1988 "Staalkabels, schijven en trommels voor hijs- en transport-doeleinden; Aanwijzingen voor keuze
      en ontwerp".

      3 Een werktuig dat met primair ontworpen is als hijskraan, maar met enige aanpassing hijswerkzaamheden kan
      verrichten, zoals een grondverzetmachine of een vorkheftruck, dient, indien daarmee hijswerkzaamheden worden
      uitgevoerd, voor wat betreft het hijsgedeelte te voldoen aan [artikel 7.4][ref4]. Hiervan kan worden afgeweken
      indien de aard van de werkzaamheden dit toelaat en het veiligheidsniveau niet wordt verlaagd.

      4 Deze beleidsregel is niet van toepassing op hijswerktuigen aan boord van schepen, daarvoor gelden de bepalingen
      van internationale verdragen op het gebied van scheepvaart zoals van IMO-en ILO-verdragen (respectievelijk
      International Marine Orgamsation en International Labour Organisation).


