      1 Aan het gestelde in [artikel 7.3][ref1] wordt met betrekking tot het gebruik van handbediende hogedruk reinigers
      voldaan indien bij werkzaamheden met deze hogedrukreinigers Tabel l wordt aangehouden.

      2 Onder een hogedruk reiniger wordt in dit verband een toestel verstaan:

      a. met een maximum werkdruk van 250 bar of meer of

      b. waarvan de opbrengst uitgedrukt in het product van de maximale werkdruk in bar en de hoeveelheid te verspuiten
      vloeistof in liters per minuut, groter is dan 5000.

      3 Tabel l is samengesteld uit de volgende delen:

      a. Werkomstandigheden. Deze zijn in oplopende zwaarte in 3 categorieën ingedeeld:

      1°. Standaardwerkzaamheden;

      2°. Werken in omsloten ruimten;

      3°. Bijzondere werkomstandigheden.

      b. Extra beveiligings- en/of hulpmiddelen. Dit betreft met name een tweehandenbediening op het spuitpistool als
      beveligingsmiddel tegen het ongewild getroffen worden door de vloeistofstraal en een schoudersteun als hulpmiddel
      ter opvanging van de reactiekracht.

      c. Reactiekracht van het spuitpistool. De maximaal toegestane reactiekracht bedraagt 250 N.

      d. De lengte van de lans. De gangbare lanslengte bedraagt 75 cm. Bij kortere lanslengten neemt de kans getroffen te
      worden door de waterstraal toe.

      Een lans met een lengte kleiner dan 50 cm wordt met gebruikt

      4 Waar in de tabel sprake is van "Geen extra maatregelen" wordt bedoeld dat de in deze beleidsregel behandelde
      extra maatregelen niet behoeven te worden getroffen.

      5 Waar sprake is van "Niet toepassen" wordt bedoeld dat de genoemde maatregelen als regel onvoldoende zijn om in de
      aangegeven situaties de risico's voldoende te beperken.


