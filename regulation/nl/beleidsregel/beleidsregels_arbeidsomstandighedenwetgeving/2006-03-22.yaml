  - number: '33'
    text: |-
      1 Bij de berekening van een boete als bedoeld in [artikel 33, eerste en tweede lid][ref1], en
      [artikel 34 van de Arbowet 1998][ref2] worden voor alle beboetbare feiten de normbedragen gehanteerd van de
      ‘Tarieflijst boetenormbedragen bestuurlijke boete’ welke als [bijlage 1][ref3] bij deze beleidsregels is gevoegd.
      Bij de toepassing hiervan wordt onderscheid gemaakt tussen

      a. feiten waarvoor eerst een waarschuwing wordt gegeven of een eis wordt gesteld en pas in tweede instantie, nadat
      is geconstateerd dat de betreffende tekortkoming niet is opgeheven, wordt overgegaan tot boeteoplegging.

      b. ernstige beboetbare feiten zoals genoemd in de lijst welke is opgenomen als [bijlage 2][ref4] bij deze
      beleidsregels;

      c. direct beboetbare feiten zoals genoemd in de lijst welke is opgenomen als [bijlage 3][ref5] bij deze
      beleidsregels;

      2 De in bijlage 1 genoemde normbedragen zijn uitgangspunt voor de berekening van op te leggen boetes voor bedrijven
      of instellingen met 250 of meer werknemers. Voor bedrijven of instellingen van geringere omvang worden de volgende
      uitgangspunten gehanteerd voor de berekening van op te leggen boetes:

      a. een vijfde van het normbedrag voor bedrijven of instellingen met minder dan 10 werknemers;

      b. een derde van het normbedrag voor bedrijven of instellingen met 10 tot en met 49 werknemers;

      c. tweederde van het normbedrag voor bedrijven of instellingen met 50 tot en met 249 werknemers.

      Een al dan niet op bedrijfsgrootte gecorrigeerd normbedrag is het uitgangsbedrag voor eventuele
      verdere boeteberekening. Voor beboetbare feiten begaan door anderen dan de werkgever, bedoeld in
      [artikel 16, achtste lid, van de Arbowet 1998][ref6], te weten de opdrachtgever, de ontwerpende partij en de
      uitvoerende partij, bedoeld in [artikel 1.1, tweede lid, van het Arbeidsomstandighedenbesluit][ref7], vindt geen
      correctie op het aantal werknemers plaats, maar zijn de in [bijlage 1][ref8] genoemde normbedragen uitgangspunt
      voor de berekening van de op te leggen boete.

      3 Voor de boeteberekening van beboetbare feiten geconstateerd op locaties of in filialen, wordt als
      bedrijfs-/⁠instellingsgrootte het aantal werknemers van de gehele juridische eenheid gehanteerd.

      4 Bij de berekening van de op te leggen boete kunnen één of meer van de volgende factoren aan de orde zijn en
      achtereenvolgens leiden tot verhoging van het al dan niet op bedrijfsgrootte gecorrigeerde normbedrag:

      a. In geval van ernstige beboetbare feiten zoals genoemd in [bijlage 2][ref9] wordt het normbedrag met twee
      vermenigvuldigd;

      b. Indien meer dan tien, respectievelijk meer dan vijftig werknemers aan een niet-administratief beboetbaar feit
      zijn blootgesteld, wordt het al dan niet op grond a. verhoogde normbedrag met anderhalf, respectievelijk twee,
      vermenigvuldigd;

      c. Beboetbare feiten die meermalen voorkomen, kunnen maximaal drie keer in de berekening van de op te leggen boete
      worden meegenomen;

      d. Indien sprake is van recidive van een beboetbaar feit wordt de op te leggen boete met anderhalf vermenigvuldigd.

      5 De totale bij een boetebeschikking op te leggen boete bestaat, in geval er sprake is van meerdere beboetbare
      feiten, uit de som van de per feit berekende boetebedragen.

      6 De boete die per boetebeschikking aan een werkgever (rechtspersoon of een natuurlijk persoon), of anderen dan de
      werkgever, bedoeld in het tweede lid van deze beleidsregel, kan worden opgelegd bedraagt

      a. minimaal € 113;

      b. maximaal € 45.000.

      7 Feiten waarvoor ook een werknemer beboet kan worden zijn in de [bijlagen 1 tot en met 3][ref10] gemarkeerd met
      een asterisk achter het boetenormbedrag. De boete die per boetebeschikking aan een werknemer kan worden opgelegd
      bedraagt maximaal € 225.

      8 Bij een arbeidsongeval dat ernstig letsel of de dood ten gevolge heeft, als bedoeld in
      [artikel 9, eerste lid, van de Arbowet 1998][ref11], worden vaste boetebedragen opgelegd waarbij de volgende
      criteria worden gehanteerd.

      a. Afhankelijk van de categorie-indeling, bedoeld in [artikel 34, vierde lid, van de Arbowet 1998][ref12], van
      het beboetbare feit dat de directe aanleiding is geweest voor het arbeidsongeval en afhankelijk van het aantal
      werknemers van het bedrijf of de instelling gelden de volgende bedragen per werkgever:











