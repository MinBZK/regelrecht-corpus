articles:
  - number: '8'
    text: >-
      1 De verplichting van de werkgever om er voor te zorgen dat een werknemer doeltreffend wordt voorgelicht en dat aan
      werknemers doeltreffend onderricht wordt verstrekt houdt mede in dat specifieke voorlichting en onderricht wordt
      gegeven aan zwangere werknemers en werknemers tijdens lactatie.


      2 De werkgever geeft een zwangere werknemer voorlichting over de risico's van haar werk voor haarzelf en haar
      (ongeboren) kind en de genomen maatregelen om deze risico's te voorkomen Bij deze voorlichting wordt ook aandacht
      besteed aan de rustruimte binnen het bedrijf. Deze voorlichting vindt plaats binnen twee weken nadat de zwangere
      werknemer aan de werkgever gemeld heeft zwanger te zijn.


      3 Tevens geeft de werkgever voorlichting aan de werknemer vóór het bevallingsverlof over de risico's van het
      werk voor de pas bevallen werknemer en de genomen maatregelen om deze risico's te voorkomen. Deze voorlichting
      betreft ook informatie inzake risico's van het werk voor kwaliteit en kwantiteit van de borstvoeding en de genomen
      maatregelen om deze risico's te voorkomen.
