  - number: 7.4 -2
    text: |-
      Aan [artikel 7.4, van het Arbeidsomstandighedenbesluit][ref1] wordt voor wat betreft hijs- en hefgereedschap
      voldaan als:

      1. de volgende NEN-normen in acht zijn genomen:

      a. NEN-EN 1492-1:2000, Hijsbanden – Veiligheid – Deel 1: Vlakke geweven hijsbanden, gemaakt van kunststofvezels,
      voor algemeen gebruik.

      b. NEN-EN 1492-2:2000, Hijsbanden – Veiligheid – Deel 2. Ronde hijsbanden, gemaakt van kunststofvezels, voor
      algemeen gebruik.

      c. NEN 3359:1986 "Kettingwerk van staal voor hijs- en transportdoeleinden. Eisen voor het vervaardigen, beproeven,
      controleren en certificeren",

      d. NEN 3360:1986 "Niet-gekalibreerde kortschalmige stalen kettingen voor hijs- en transport-doeleinden. Eisen en
      beproevingsmethoden",

      d. NEN 3508:1988 "Staalkabels, schijven en trommels voor hijs- en transportdoeleinden. Aanwijzingen voor keuze
      en ontwerp",

      f. NEN 3575:1981 "Staalkabels Kabel – Karakteristieken en leveringsvoorwaarden",

      2. knopen of boutklemmen niet worden toegepast bij de constructie van stroppen en lengen;

      3. hijsjukken met verstelbare hijspunten in hun verschillende standen worden geborgd;

      4. de instelling van het vacuüm van vacuumhefgereedschap niet door een eenvoudige ingreep of op een andere
      ongewilde wijze veranderd kan worden. De grootte van het vacuüm moet tijdens bedrijf zichtbaar zijn voor de
      bedieningsman.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel7.4
