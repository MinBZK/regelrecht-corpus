  - number: 4.9 -4
    text: |-
      1 In deze beleidsregel wordt verstaan onder:

      a. verontreinigde grond en verontreinigd grondwater: grond die en grondwater dat op basis van de
      __REF000___________________________________________________________________________________________________________
      ________________________________________________ (Stcrt 2000, 39) als zodanig wordt gekenmerkt;

      b. MAC-waarde: de wettelijke grenswaarde of bij het ontbreken daarvan, de bestuurlijke grenswaarde, of bij
      het ook ontbreken van een bestuurlijke grenswaarde, de door de werkgever zelf vastgestelde waarde, bedoeld in
      [beleidsregel 4.2 -1][ref2];

      c. een vluchtige stof of vluchtige verontreiniging: een stof of verontreiniging met een kookpunt lager dan 350 °C
      én een dampspanning (uitgedrukt in millibar bij 20 °C), groter dan éénduizendste van de MAC-waarde van die stof of
      verontreiniging (met andere woorden, indien 103 P > MAC);

      d. serpentijnasbest: stoffen die de vezelachtige silicaat chrysotiel bevat;

      e. amfiboolasbest: stoffen die de vezelachtige silicaten crocidoliet, amosiet, actinoliet, anthofylliet of
      tremoliet bevatten.

      2 In deze beleidsregel wordt, in aanvulling op de in het eerste lid, onder a, genoemde circulaire, onder
      verontreinigde grond of verontreinigd grondwater tevens verstaan: grond of grondwater waarin zich asbest bevindt in
      een concentratie, hoger dan de gewogen norm van 100 mg/kg droge stof (serpentijnasbestconcentratie, vermeerderd met
      tien maal de amfiboolasbestconcentratie).

      3 In deze beleidsregel wordt, in aanvulling op de onder a genoemde circulaire, onder verontreinigde grond tevens
      verstaan: grond, waarvan het gehalte steenachtige of andere materialen meer dan 20-volumeprocenten bedraagt.

      4 Bij werkzaamheden in of met verontreinigde grond waarbij de verontreiniging zodanig
      is dat de werkzaamheden, volgens de in [beleidsregel 4.2 -2][ref3], tweede lid, bedoelde
      systematiek, niet ingedeeld behoeven te worden in een risicoklasse, wordt in ieder geval onder
      doeltreffende maatregelen als bedoeld in [artikel 4.9, eerste tot en met achtste lid][ref4],
      [artikel 4.18][ref5] en [artikel 4.19 van het Arbeidsomstandighedenbesluit][ref6], dan wel
      voorzieningen ter voorkoming of beperking van de gevolgen van ongewilde gebeurtenissen als bedoeld in
      [artikel 4.4, eerste tot en met vierde lid, van het Arbeidsomstandighedenbesluit][ref7], het volgende verstaan:

      a. binnen de verontreinigde zone worden beschermende werkkleding en persoonlijke beschermingsmiddelen gedragen die
      bestaan uit, of minimaal dezelfde bescherming bieden als:

      1° een goed sluitende overall met rits zonder zakken of openingen;

      2° bouwveiligheidslaarzen/-schoenen;

      3° handschoenen van voldoende sterkte en ondoordringbaar voor aanwezige verontreinigingen;

      b. wasgelegenheden en doucheruimten als bedoeld in
      [artikel 3.23, eerste en tweede lid, van het Arbeidsomstandighedenbesluit][ref8] zijn aanwezig buiten de
      verontreinigde zone.

      5 Bij werkzaamheden in of met verontreinigde grond of verontreinigd grondwater waarop
      [beleidsregel 4.2 - 2, tweede lid][ref9], van toepassing is en op grond daarvan de werkzaamheden zijn ingedeeld in
      klasse 0T en 0F, zijn maatregelen doeltreffend als bedoeld in [artikel 4.9, eerste tot en met achtste lid][ref10],
      [artikel 4.18][ref11] en [artikel 4.19 van het Arbeidsomstandighedenbesluit][ref12] dan wel worden
      voorzieningen ter voorkoming of beperking van de gevolgen van ongewilde gebeurtenissen als bedoeld in
      [artikel 4.4, eerste tot en met vierde lid, van het Arbeidsomstandighedenbesluit][ref13] adequaat geacht indien de
      volgende aanvullende maatregelen worden getroffen:

      a. de maatregelen zoals hiervoor genoemd in het vierde lid, onder a;

      b. alvorens de werkzaamheden te beginnen is een draaiboek voor de werkzaamheden opgesteld, waarin onder andere
      een omschrijving van het werk, een globaal tijdschema, een lijst van verontreinigingen, (de argumentatie voor) de
      indeling in risicoklassen, de taakverdeling en de beschermende maatregelen zijn opgenomen;

      c. tijdens de werkzaamheden met grond die of grondwater dat verontreinigd is met kankerverwekkende
      stoffen, waaronder asbest, of mutagene stoffen als bedoeld in de [afdelingen 2][ref14] en
      [5 van hoofdstuk 4 van het Arbobesluit][ref15], wordt voldaan aan [artikel 4.15, eerste lid][ref16] en
      [artikel 4.53][ref17], indien een logboek wordt bijgehouden, waarin dagelijks aantekening wordt gehouden van de
      gevallen waarin wordt afgeweken van het draaiboek en de reden hiervoor, de resultaten van uitgevoerde luchtmetingen
      en een overzicht van de personen die de locatie hebben bezocht;

      d. de plaats waar met verontreinigd grond(water) wordt gewerkt is afgebakend door middel van een hekwerk;

      e. binnen de verontreinigde zone worden bij de hierna te noemen situaties de volgende voorgeschreven beschermende
      werkkleding en persoonlijke beschermingsmiddelen gedragen die bestaan uit, of minimaal dezelfde bescherming bieden
      als:

      1° bij schoonspoelen of schoonborstelen van materieel vloeistofdichte overkleding, gelaatsscherm en een masker met
      stoffilter klasse P2 of P3;

      2° indien contact mogelijk is met verontreinigd grondwater, natte grond of de vloeibare verontreiniging zelf,
      overkleding van vloeistofdicht materiaal;

      3° in gevallen dat men verontreinigd water in het gezicht kan krijgen, oog- of gezichtsbescherming;

      f. het type, de kwaliteit en het aantal van de onder a en e bedoelde beschermingsmiddelen worden vastgesteld door
      een deskundige;

      g. cabines van grondverzetwerktuigen en van transportmiddelen die op het werkterrein blijven, zijn voorzien van
      een overdrukfilter- en klimaatregelingsinstallatie met stof- en koolfilters met een zodanige filterkwaliteit
      en -capaciteit dat de MAC-waarden van stoffen in de cabineruimte niet worden overschreden. Bij de keuze voor de
      filterkwaliteit en capaciteit wordt tevens rekening gehouden met de risicoklasse van de werkzaamheden;

      h. toiletten, urinoirs, wasbakken en ontspannings-, kleed-, was- en
      doucheruimten als bedoeld in [artikel 3.22, tweede en vierde lid][ref18],
      [artikel 3.23, eerste en tweede lid][ref19], [artikel 3.24, derde lid][ref20] en
      [artikel 4.20, eerste, derde en vierde lid, van het Arbeidsomstandighedenbesluit][ref21] bevinden zich op de
      grens van de verontreinigde zone; de ruimte waar de persoonlijke kleding en het schoeisel gedurende de werkdag
      worden bewaard, wordt door middel van de doucheruimte duidelijk gescheiden van de ruimte waar de werkkleding wordt
      bewaard.

      6 Indien de werkzaamheden met verontreinigde grond of verontreinigd grondwater zijn ingedeeld in klasse 1T, worden
      alle in het vijfde lid voor klasse 0T en 0F genoemde maatregelen getroffen, aangevuld met de volgende maatregelen:

      a. indien gewerkt wordt in of met grond die of grondwater dat vluchtige verontreinigingen bevat, worden regelmatig
      indicatieve metingen verricht van die vluchtige stoffen waarvan in relatie met de MAC-waarde voor die vluchtige
      stoffen, verhoudingsgewijs de hoogste concentraties worden verwacht. De meetfrequentie is aan de volgende
      voorwaarden gebonden:

      1° er wordt ten minste tweemaal per dag gemeten (kort na aanvang van de werkzaamheden) op plaatsen waar (het meest
      intensief) wordt gewerkt;

      2° in aanvulling op het onder 1° gestelde wordt extra gemeten:

      i. wanneer (ongebruikelijke) geuren worden waargenomen, of

      ii. wanneer op diepte wordt gewerkt telkens bij het begin van de werkzaamheden en tijdens intensieve werkzaamheden
      nog een enkele keer ter controle, of

      iii. wanneer in diepe en smalle sleuven wordt gewerkt, wordt zeer vaak of continue gemeten;

      b. indien het meetresultaat van een bepaalde stof hoger is dan 20% van de MAC-waarde wordt die (groep van) stoffen
      gemeten volgens de meetstrategie behorende bij klasse 2T.

      7 Indien de werkzaamheden met verontreinigde grond of verontreinigd grondwater zijn ingedeeld in klasse 2T,
      worden alle in het vijfde lid voor klasse 0T en 0F genoemde maatregelen getroffen en aangevuld met de volgende
      maatregelen:

      a. een deskundige op het terrein van de arbeidshygiëne of veiligheidskunde als bedoeld in
      [artikel 2.7, eerste lid, van het Arbeidsomstandighedenbesluit][ref22] wordt betrokken bij de voorbereiding van
      de werkzaamheden;

      b. alle op het werk aanwezige personen dragen handschoenen;

      c. indien gewerkt wordt in of met grond die of grondwater dat vluchtige verontreinigingen bevat, worden regelmatig
      indicatieve metingen verricht van die vluchtige stoffen waarvan in relatie tot de MAC-waarde voor die vluchtige
      stoffen, verhoudingsgewijs de hoogste concentraties worden verwacht; de frequentie van de metingen op plaatsen waar
      gewerkt wordt is als volgt:

      1° ten minste 4 keer per halve werkdag (voor en tijdens het werk) op die plaatsen waar de natuurlijke ventilatie
      beperkt is door de diepe ligging of door andere omstandigheden;

      2° 4 keer per halve werkdag indien de windsnelheid op een representatieve plek op maaiveldniveau regelmatig beneden
      de 1 m/s ligt;

      3° 2 keer per halve werkdag indien de gemiddelde windsnelheid op dezelfde plek gemeten tussen de 1 en 3 m/s ligt;

      4° 1 keer per halve werkdag bij een gemiddelde windsnelheid groter dan 3 m/s;

      d. indien het meetresultaat van een bepaalde stof hoger is dan 20% van de MAC-waarde, wordt die (groep van) stoffen
      gemeten volgens de meetstrategie behorende bij klasse 3T;

      e. de metingen worden uitgevoerd door iemand met voldoende kennis van en vaardigheid met het uitvoeren en
      interpreteren van de metingen;

      f. als het werk is ingedeeld in klasse 2T én klasse 1F of 2F, zijn de transportmiddelen die het vervoer van
      de verontreinigde grond verzorgen voorzien van een overdrukfilter- en klimaatregelingsinstallatie met stof- en
      koolfilters, zoals bedoeld voor werken voertuigen die op het werkterrein blijven.

      8 Indien de werkzaamheden met verontreinigde grond of verontreinigd grondwater zijn ingedeeld in klasse 3T,
      worden alle in het vijfde lid voor klasse 0T en 0F genoemde maatregelen getroffen en aangevuld met de volgende
      maatregelen:

      a. een deskundige op het terrein van de arbeidshygiëne of veiligheidskunde als bedoeld in
      [artikel 2.7, eerste lid, van het Arbeidsomstandighedenbesluit][ref23] wordt betrokken bij de voorbereiding en
      uitvoering van de werkzaamheden; de deskundige of diens, onder zijn verantwoordelijkheid opererende en door hem
      voldoende deskundig geachte plaatsvervanger, is tijdens de werkzaamheden permanent aanwezig;

      b. deze deskundige geeft voorlichting en onderricht aan werknemers, advies en ondersteuning bij het opstellen
      van het draaiboek, en geeft advies en ondersteuning bij de uitvoering van de werkzaamheden; bij werkzaamheden met
      grond die of grondwater dat verontreinigd is met kankerverwekkende stoffen, waaronder asbest, of mutagene stoffen
      als bedoeld in de [afdelingen 2][ref24] en [5 van hoofdstuk 4 van het Arbobesluit][ref25], houdt de deskundige
      dagelijks het logboek bij, als bedoeld in het vijfde lid, onderdeel c;

      c. door of onder toezicht van deze deskundige of diens plaatsvervanger wordt met continu registrerende apparatuur
      de kwaliteit van de omgevingslucht bewaakt; het meten van de concentraties vluchtige stoffen in de omgevingslucht,
      wordt permanent of zeer frequent uitgevoerd, naar inzicht van de deskundige;

      d. de transportmiddelen die de verontreinigde grond vervoeren, zijn voorzien van een overdrukfilter- en
      klimaatregelingsinstallatie met stofen koolfilters, overeenkomstig de werk- en voertuigen die het werkterrein niet
      verlaten;

      e. bij werkzaamheden in of met verontreinigde grond of grondwater, waarbij de verontreiniging uit asbest bestaat in
      een concentratie, hoger dan de gewogen norm op het niveau van 100 mg/kg droge stof (serpentijnasbestconcentratie,
      vermeerderd met tien maal de amfiboolasbestconcentratie), zijn tevens de voorschriften bedoeld in
      [artikel 4.45][ref26], [artikel 4.49][ref27] en [4.55, eerste lid, onderdeel d][ref28], [4.56][ref29] en
      [artikel 4.57 van het Arbeidsomstandighedenbesluit][ref30], van overeenkomstige toepassing, met dien verstande dat:

      1° het voorkomen of beperken van de blootstelling, als bedoeld in [artikel 4.18, derde lid][ref31], kan worden
      uitgevoerd door het vochtig houden van de verontreinigde grond en bodem, resulterend in een vochtgehalte van
      minimaal 10%;

      2° de meting, bedoeld in [artikel 4.55, eerste lid, onderdeel d][ref32], wordt uitgevoerd in de vorm van een
      visuele inspectie, als bedoeld in [beleidsregel 4.55][ref33].

      9 Indien de werkzaamheden met verontreinigde grond of verontreinigd grondwater zijn ingedeeld in klasse 1F, worden
      alle in het vijfde lid voor klasse 0T en 0F genoemde maatregelen getroffen, aangevuld met de volgende:

      a. er wordt voor zorggedragen dat er geen open vuur is;

      b. permanent op het werk aanwezig materieel is uitgerust met vonkenvangers op de uitlaten;

      c. ter plaatse van de werkzaamheden zijn brandblusmiddelen beschikbaar.

      10 Indien de werkzaamheden met verontreinigde grond of verontreinigd grondwater (al dan niet tijdelijk) zijn
      ingedeeld in klasse 2F, worden alle voor klasse 1F geldende maatregelen als bedoeld in het negende lid getroffen en
      aangevuld met de volgende maatregelen:

      a. een deskundige op het terrein van de veiligheidskunde als bedoeld in
      [artikel 2.7, eerste lid, van het Arbeidsomstandighedenbesluit][ref34] wordt betrokken bij de voorbereiding en
      uitvoering van de werkzaamheden; deze deskundige geeft advies en verleent ondersteuning bij het opstellen van
      de brand- en explosieparagraaf van het draaiboek en bij de daadwerkelijke uitvoering van de werkzaamheden; bij
      werkzaamheden met grond die of grondwater dat verontreinigd is met kankerverwekkende of mutagene stoffen als
      bedoeld in [afdeling 2 van hoofdstuk 4 van het Arbobesluit][ref35], houdt de deskundige dagelijks het logboek bij,
      als bedoeld in het vijfde lid, onderdeel c;

      b. indien de werkzaamheden in of met verontreinigde grond of verontreinigd grondwater zijn ingedeeld in de
      klasse 2F, worden met een explosiemeter frequent of permanent metingen uitgevoerd naar de concentraties van de
      desbetreffende stoffen;

      c. indien uit deze permanente metingen blijkt dat de concentratie ontvlambare stoffen in de lucht de grens van
      10% van de onderste explosiegrens voor een van die stoffen overschrijdt, wordt het werk onmiddellijk gestaakt en
      wordt de locatie onmiddellijk verlaten, tenzij naar het inzicht van de deskundige, bedoeld in onderdeel a, bepaalde
      werkzaamheden nog kunnen worden uitgevoerd.

      11 Indien de werkzaamheden zijn ingedeeld in zowel een T klasse als een F klasse, is het zwaarste regime bepalend
      voor de wijze waarop en de frequentie waarmee de concentraties van stoffen worden gemeten.


