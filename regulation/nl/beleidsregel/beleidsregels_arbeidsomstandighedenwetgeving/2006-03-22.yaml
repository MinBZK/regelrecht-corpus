      7 Op basis van het gestelde in [artikel 2.4, tweede lid][ref9], is een lijst van grenswaarden van toxische
      stoffen opgesteld, welke is opgenomen als [bijlage 4][ref10] bij deze beleidsregels. Tevens is een lijst van
      explosieve stoffen vastgesteld, welke is opgenomen als [bijlage 5][ref11] bij deze beleidsregels. De lijsten
      zijn niet limitatief. Ze kunnen worden aangevuld dan wel gewijzigd indien meer of betere gegevens bekend worden.
      Het kan daardoor voorkomen dat een installatie op het moment van aanvulling van de lijst AVR-plichtig wordt. De
      verplichting tot het opstellen van een AVR is dan gekoppeld aan het tijdstip waarop de desbetreffende stof met de
      bijbehorende grenswaarde voor het eerst op de lijst verschijnt.

      8 Als de procestemperatuur bedoeld in [artikel 2.5, onder e en f][ref12], gelijk is aan de omgevingstemperatuur,
      wordt een temperatuur van 25 °C aangehouden.

