  - number: '3.5'
    text: |-
      Aan de verplichtingen als bedoeld in [artikel 3.5 van het Arbeidsomstandighedenbesluit][ref1] is voldaan indien
      tijdens elektrotechnische werkzaamheden en bedieningswerkzaamheden, een van de navolgende normen is toegepast:

      a. NEN-EN 50110-1:1998, "Bedrijfsvoering van elektrische installaties, Algemene bepalingen", zulks met inachtneming
      van NEN-EN 50110-2:1998, "Bedrijfsvoering van elektrische installaties, Nationale bijlagen" bij de vaststelling van
      procedures voor de bedrijfsvoering en het onderhoud van elektrische installaties hebben de nationale voorschriften
      genoemd in NEN-EN 50110-2, onderdeel 15' "Netherlands (NL)", voorrang boven de bepalingen zoals opgenomen in § 6 3
      "Onder spanning werken" en § 6 4 "Werken in de nabijheid van actieve delen" van NEN-EN 50110-1;

      b. NEN 3140 1998, "Bedrijfsvoering van elektrische installaties, Aanvullende Nederlandse bepalingen voor
      laagspanningsinstallaties";

      c. NEN 3840-1998, "Bedrijfsvoering van elektrische installaties, Aanvullende Nederlandse bepalingen voor
      hoogspanningsinstallaties".


