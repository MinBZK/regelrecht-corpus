  - number: 5.4 -3
    text: |-
      Een zitgelegenheid bij baliewerk is doelmatig in de zin van [artikel 5.4 van het Arbeidsomstandighedenbesluit][ref1]
      wanneer het hiernavolgende in acht genomen wordt:

      1. Onder baliewerk worden werkzaamheden verstaan aan een voorziening die ingericht is voor direct contact met
      klanten of bezoekers. Administratieve handelingen, verstrekken van informatie, verrichten van transacties en
      doorverwijzen staan bij zulke werkzaamheden centraal.

      2. Er is sprake van een doelmatige zitgelegenheid als

      a. van de stoel de rugleuning en de zittinghoogte verstelbaar zijn,

      b. de stoel voldoet aan de norm NEN-EN 1335-1:2000 ‘Kantoormeubelen - Kantoorstoelen - Deel 1: Afmetingen -
      Bepaling van afmetingen’ met de aanduiding ‘type A’,

      c. het hoogte-insteltraject van de stoel is aangepast aan de hoogte van de balie en

      d. de stoel is voorzien van wielen of glijders, waarbij van belang is dat:

      1) de stoel niet hinderlijk wegrijdt of - glijdt tijdens zittende werkzaamheden aan de balie,

      2) de stoel gemakkelijk opzij gezet kan worden als de werknemer staat te werken achter de balie en

      3) de stoel niet dreigt om te vallen bij extreme lichaamshoudingen van de werknemer.

      3. Bij baliewerk in combinatie met beeldschermwerk in de zin van
      [artikel 5.12 van het Arbeidsomstandighedenbesluit][ref2] is sprake van een doelmatige zitgelegenheid als de stoel
      voorzien is van verstelbare armsteunen.

      4. Het meubel waarin baliewerk wordt verricht, biedt voldoende bewegingsvrijheid voor de werknemer. Er is een vrije
      ruimte onder het werkblad aanwezig van ten minste 70 centimeter hoog en 60 centimeter breed en diep, afgezien van
      de voor het werk beschikbare voetensteun. Bij die 60 centimeter breedte is de dikte van het werkblad nergens meer
      dan 5 centimeter.

      5. De inrichting van de balie maakt het mogelijk dat de werknemer en bezoekers elkaar op gelijke ooghoogte aan
      kunnen kijken. Hieraan wordt voldaan wanneer:

      a. de zittinghoogte van de stoel van de werknemer over een traject verstelbaar is van 49 -61 cm, 59 - 71 cm of een
      traject daartussen, waarbij de werkhoogte van de werknemer dienovereenkomstig is aangepast, of

      b. de vloer aan de zijde van de werknemer is verhoogd met 10 tot 20 centimeter en de overgang naar deze
      vloerverhoging goed is gemarkeerd, of

      c. de balie aan bezoekerszijde voorzien is van een stoel, waarvan bezoekers geregeld gebruik maken.

      6. De werknemer heeft de beschikking over een voetensteun indien dat voor het bereiken van een goede
      lichaamshouding nodig is. Deze is minimaal 45 cm breed en 35 cm diep en is eenvoudig in hoogte instelbaar in
      minimaal 3 standen met onderling gelijke afstand. Het totale instelbereik van de voetensteun omvat in ieder
      geval het verticale traject tussen 35 en 47 centimeter onder de bovenzijde van de zitting. Een stang of balk als
      voetensteun is onvoldoende.

      7. Hulpmiddelen die regelmatig worden gebruikt zijn zo geplaatst dat de werknemer bij dat gebruik niet
      noodgedwongen hoeft te verzitten of een gebogen houding hoeft aan te nemen. Deze zijn geplaatst binnen een
      horizontaal bereik van 45 centimeter, gerekend vanaf de schouders van de werknemer. De plaatsing is bovendien op
      een hoogte die maximaal 10 centimeter afwijkt van de werkhoogte.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel5.4
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel5.12
