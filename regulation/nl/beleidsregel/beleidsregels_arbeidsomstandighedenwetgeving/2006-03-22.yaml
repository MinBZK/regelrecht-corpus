      Aan het gestelde in bovenvermelde artikelen wordt ten aanzien van buisrailsystemen in kassen bestemd voor gebruik
      in combinatie met buisrailwagens met een werkhoogte van meer dan 1,80 meter voldaan als de punten 3 t/m 6 in
      combinatie met punt 1 of punt 2 in acht worden genomen:

      1. Buisrailsystemen die gebruikt worden in combinatie met buisrailwagens waarvan de gegevens noodzakelijk voor
      veilig gebruik genoemd in 2.1, geheel of gedeeltelijk ontbreken.

      1.1 Het buisrailsysteem is zodanig ingericht dat de stabiliteit van de buisrailwagens waarvoor het buisrailsysteem
      bestemd is, niet in gevaar wordt gebracht. Daartoe worden:

      a) buisrailsteunen toegepast overeenkomstig of tenminste gelijkwaardig aan de volgende specificaties: stalen
      onderplaat 1,5 mm dik met verstijvingsprofilering, breedte onderplaat minimaal 115 mm en lengte zodanig dat
      onderplaat tenminste 70 mm uitsteekt buiten de twee opstaande steunen die de buizen dragen.

