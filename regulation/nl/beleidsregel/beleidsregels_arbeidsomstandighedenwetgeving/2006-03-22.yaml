  - number: '3.13'
    text: |-
      1 Aan het gestelde in [artikel 3.13, zesde en zevende lid, van het Arbeidsomstandighedenbesluit][ref1], dat
      automatische deuren en hekken zodanig functioneren dat zij geen gevaar opleveren, wordt voldaan indien:

      a. beveiligingen worden toegepast, die beweging van de deur of het hek verhinderen, wanneer personen hierdoor
      kunnen worden geraakt, of

      b. beveiligingen worden toegepast, die bij aanraking de beweging van de deur of van het hek stoppen of omkeren, of

      c. de aandrijfkracht van de deur of het hek zodanig beperkt is dat de kracht waarmee het sluiten kan worden
      tegengegaan kleiner is dan 150 N. Tevens is – gemeten met een drukopriemer met een veerconstante van 25000 N/m – de
      drukkracht (stoot) van een bewegend deurblad of hek niet meer dan 750 N bij een resterende opening groter dan 0,25
      m en niet meer dan 500 N bij een resterende opening gelijk of kleiner dan 0.25 m. Hierbij geldt dat slipkoppelingen
      die zijn aangebracht ter begrenzing van de knelkracht niet als doelmatig worden aangemerkt.

      2 Doorgangen als bedoeld in [artikel 3.13, achtste lid, van het Arbeidsomstandighedenbesluit][ref2] worden als
      veilig voor voetgangers aangemerkt, indien zij

      a. bij eenrichtingverkeer tenminste 0,6 m breder zijn dan het breedst beladen voertuig, dat van de doorgang gebruik
      maakt, of

      b. bij tweerichtingsverkeer tenminste 0,9 m breder zijn dan tweemaal de breedte van het breedst beladen voertuig,
      waarvoor de doorgang bestemd is.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel3.13
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel3.13
