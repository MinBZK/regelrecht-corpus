  - number: '4.3'
    text: |-
      1 De stoffen bedoeld in [artikel 4.3, derde lid, van het Arbeidsomstandighedenbesluit][ref1] zijn stoffen waarop
      [artikel 34 van de Wms][ref2] niet van toepassing is, maar die

      a. als ze zouden worden afgeleverd, krachtens de [Wms][ref3] geëtiketteerd moeten worden, of

      b. expliciet zijn uitgezonderd van de etiketteringsverplichting van de [Wms][ref4] maar wel

      1°. de fysisch-chemische of toxicologische eigenschappen bezitten op grond waarvan ze kunnen worden ingedeeld
      in één of meer gevaarscategorieën die genoemd worden in [artikel 34 van de Wms][ref5], uitgezonderd de categorie
      "milieugevaarlijk", of

      2°. voldoen aan de criteria voor toekenning van bijzondere aanduidingen die de [Wms][ref6] in het kader van
      etiketteringsvoorschriften kent. Het betreft de preparaten vermeld in bijlage V bij [Richtlijn 1999/45/EG]
      (31999L0045) (Pb L 200), zoals opgenomen in [bijlage 9][ref7] bij deze beleidsregels.

      2 Aan de aanduiding op het etiket van de naam en de aard van de gevaren van een stof, zoals bedoeld in
      [artikel 4.3 derde lid, van het Arbeidsomstandighedenbesluit][ref8] wordt voldaan als daarvoor de indeling van
      de stof in gevaarscategorieën zoals genoemd in [artikel 34 van de Wms][ref9] wordt gehanteerd en gebruik gemaakt
      wordt van standaardaanduidingen, een en ander volgens de voorschriften die de [Wms][ref10] in het kader van de
      etikettering stelt. Deze aanduidingen omvatten tenminste

      a. de naam van de gevaarlijke stof en de relevante gevaarlijke bestanddelen,

      b. gevaarssymbolen en gevaarsbenamingen,

      c. waarschuwingszinnen

      3 In aanvulling op hetgeen in het tweede lid ten aanzien van de indeling in gevaarscategorieëen van de [Wms][ref11]
      wordt gesteld, geldt dat een stof niet alleen in de gevaarscategorie "sensibiliserend" wordt ingedeeld als de
      desbetreffende indelingscriteria van de [Wms][ref12] daartoe aanleiding geven, maar ook als onderzoeksresultaten
      met die stof voldoen aan de criteria van de [Wms][ref13].

      4 In afwijking van hetgeen in het tweede lid wordt gesteld geldt dat voor voedings- en genotmiddelen, diervoeders,
      geneesmiddelen, diergeneesmiddelen en cosmetica die aanwezig zijn in een vorm waarop de etiketteringsplicht van de
      [Wms][ref14] niet van toepassing is, de voor die middelen uit andere wetten voortvloeiende informatievoorziening
      ter bescherming van de gebruiker bij aflevering aan derden voldoet.

      5 Onder het opvallend en goed leesbaar aanbrengen van de naam en de aard van de gevaren van de stof op het etiket
      als bedoeld in [artikel 4.3, derde lid, van het Arbeidsomstandighedenbesluit][ref15] wordt verstaan dat ten
      aanzien van de aanduidingen de voorschriften van de [Wms][ref16] betreffende de taal, vormgeving, bevestiging en
      meervoudige verpakking worden gevolgd.

      6 In afwijking van hetgeen in het tweede lid van deze beleidsregel is vermeld hoeven op laboratoriumhulpmiddelen
      die voor steeds wisselende chemicaliën worden gebruikt, niet steeds alle voor de werkpleketikettering
      verplichte aanduidingen aangebracht te worden In dit geval wordt aan de verplichting als bedoeld in
      [artikel 4.3, derde lid, van het Arbeidsomstandighedenbesluit][ref17] voldaan als voor een enkelvoudige stof de
      officiële stofnaam, en voor een meervoudige stof de gangbare benaming of de gevaarlijke bestanddelen op de bedoelde
      hulpmiddelen worden aangebracht. Deze aanduidingen zijn niet verplicht wanneer hulpmiddelen alleen gebruikt worden
      voor kortdurende handelingen.

      7 In afwijking van hetgeen in het tweede lid van deze beleidsregel is vermeld, wordt in het geval van opslag
      van stoffen in grotere hoeveelheden in speciale opslagruimten aan de verplichting tot het opvallend en
      goed leesbaar aanbrengen van de naam en de aard van de gevaren van de stof op het etiket, als bedoeld in
      [artikel 4.3, derde lid, van het Arbeidsomstandighedenbesluit][ref18], voldaan wanneer voor meerdere identieke
      verpakkingen door middel van een etiket-afdruk (bijvoorbeeld op een bord) opvallend en goed leesbaar de krachtens
      genoemde besluiten verplichte aanduidingen aangebracht zijn. Deze aanduidingen worden zodanig aangebracht dat
      voor elke afzonderlijk opgeslagen verpakking te allen tijde ter plekke duidelijk is dat de aanduidingen op de
      betreffende verpakking van toepassing zijn. Wanneer stoffen uitsluitend voor de verkoop zijn opgeslagen kan
      worden volstaan met het aanbrengen van de aanduidingen welke krachtens de [Wms][ref19] of andere regelgeving bij
      aflevering in Nederland verplicht zijn.

      8 In afwijking van hetgeen in het tweede lid van deze beleidsregel is vermeld, wordt in geval van het
      vervoer en het laden en lossen van gevaarlijke stoffen aan de verplichting tot het opvallend en goed
      leesbaar aanbrengen van de naam en de aard van de gevaren van de stof op het etiket, als bedoeld in
      [artikel 4.3, derde lid, van het Arbeidsomstandighedenbesluit][ref20], voldaan als de vervoerders (chauffeurs en
      bijrijders) en de laders en lossers tijdens hun werkzaamheden ter plekke beschikken over de gegevens welke op grond
      van het tweede lid van deze beleidsregel op het etiket zouden moeten zijn vermeld. Het in het tweede lid gestelde
      vindt geen toepassing voor die gevallen waarop de [Wet vervoer gevaarlijke stoffen][ref21] van toepassing is.


