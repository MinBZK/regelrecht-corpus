  - number: 4.32a
    text: |-
      1 Onder bestanddelen van woningen of andere gebouwen worden mede begrepen alle objecten die daarin aanwezig
      zijn en die door hun aard, vorm, gewicht of afmetingen redelijkerwijs niet uit de desbetreffende woningen
      of andere gebouwen kunnen worden verwijderd ten behoeve van het uitvoeren van handelingen als bedoeld in
      [artikel 4.32a, eerste lid, onder b][ref1].

      2 Onder bestanddelen van woningen of andere gebouwen worden met mede begrepen objecten dte worden vervaardigd
      hersteld of onderhouden in het kader van een productieproces onderscheidenlijk reparatie of onderhoud, voor zover
      de handelingen, bedoeld in het eerste lid, worden verricht op een daartoe adequaat ingerichte arbeidsplaats.


