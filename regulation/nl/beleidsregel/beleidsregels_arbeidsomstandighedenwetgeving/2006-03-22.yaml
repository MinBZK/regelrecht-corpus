      , of

      d. in of met verontreinigde grond waarin of waarop asbest aanwezig is, het volgende verstaan. De werkzaamheden
      met of in de verontreinigde grond of het verontreinigde grondwater worden op basis van de erin aanwezige stoffen,
      hun gevaarseigenschappen en de mogelijkheid van blootstelling eraan, beoordeeld op de wijze zoals beschreven in
      [bijlage 8][ref4] bij deze beleidsregels. Dit leidt tot indeling van de werkzaamheden in of met deze verontreinigde
      grond of dit verontreinigde grondwater in één van de vier risicoklassen voor giftigheid (0T, 1T, 2T en 3T) en/of in
      één van de drie risicoklassen voor brandbaarheid (0F, 1F en 2F).

      5 Ten aanzien van de vaststelling van de concentratie asbest in grond met een gehalte steenachtige of andere
      materialen van maximaal 20-volumeprocenten, wordt de meetmethode, bedoeld in Ontwerp-NEN 5707, versie 2002, of een
      gelijkwaardige methode gehanteerd.

      6 Ten aanzien van de vaststelling van de concentratie asbest in grond met een gehalte steenachtige of andere
      materialen van meer dan 20-volumeprocenten, worden de meetmethoden, bedoeld in NEN 5897, versie 2002, normontwerp-
      NEN 5896, uitgave 1999 of een gelijkwaardige methode gehanteerd.


