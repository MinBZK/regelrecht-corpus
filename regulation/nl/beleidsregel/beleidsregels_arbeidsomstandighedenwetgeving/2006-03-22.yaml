  - number: '4.45'
    text: |-
      Aan de verplichting om grond, bagger, puin, puingranulaat, water of afvalstoffen of materialen, verontreinigd
      met asbest of crocidoliet, af te voeren in een daartoe geschikte en gesloten verpakking, bedoeld in de
      [artikelen 4.45 tweede lid, onderdeel c][ref1], en [artikel 4.56, derde lid][ref2] en aan de verplichting om de
      concentratie asbest in de lucht zo laag mogelijk te houden, zoals bedoeld in [artikel 4.45, eerste lid][ref3] en in
      [artikel 6.2][ref4], wordt voldaan, indien het volgende in acht wordt genomen.

      1 Het verpakken en het afvoeren van hechtgebonden of niet-hechtgebonden asbest- of crocidoliethoudende grond,
      bagger, puin, puingranulaat, water of asbest- of crocidoliethoudende afvalstoffen of materialen, niet ontstaan
      bij selectieve sloop of verwijdering van asbestbevattende materialen uit gebouwen, apparaten, installaties,
      transportmiddelen en constructies met uitzondering van wegen, waterkeringen, dijken, ophogingen van geluids(wallen)
      e.d., dient zodanig te zijn dat deze asbesthoudende materialen niet in de omgeving vrijkomen. Hieraan wordt voldaan
      indien:

      a. ten behoeve van het wegvervoer, de vrachtwagen van het type kipper, voorzien is van een lekdichte laadruimte met
      een stofdicht afsluitsysteem in de vorm van hydraulisch aangedreven kleppen met rubberen afdichting welke vanuit de
      cabine worden bediend;

      b. ten behoeve van het vervoer over het spoor, de laadruimte van de wagon, lek- en stofdicht is uitgevoerd;

      c. ten behoeve van het vervoer over het water, het vaartuig is voorzien van een lek- en stofdichte, afsluitbare
      laadruimte.

      2 De afsluiting van de laadruimte, bedoeld in het eerste lid, is zodanig robuust, dat ingeval van calamiteiten geen
      lading verloren gaat.

      3 De concentratie hechtgebonden asbest of crocidoliet in grond, bagger, puin, puingranulaat, water of asbestof
      crocidoliethoudende afvalstoffen of materialen, is lager dan 10 gram per kilogram droge stof.

      4 De concentratie niet-hechtgebonden asbest of crocidoliet in grond, bagger, puin, puingranulaat, water of asbestof
      crocidoliethoudende afvalstoffen of materialen, is lager dan 1 gram per kilogram droge stof.

      5 Het gehalte hechtgebonden en niethechtgebonden asbest of crocidoliet in grond en in andere vergelijkbare
      materialen wordt bepaald volgens normontwerp-NEN 5707, uitgave 2001. Het gehalte hechtgebonden en niet-
      hechtgebonden asbest of crocidoliet in puin, puingranulaat en in andere vergelijkbare steenachtige materialen,
      wordt bepaald volgens normontwerp-NEN 5897, uitgave 1999 of normontwerp-NEN 5896, uitgave 1999.

      6 Er worden zodanige maatregelen aan de bron getroffen tijdens het laden, lossen en het vervoer van asbest- of
      crocidoliethoudende grond, bagger, puin, puingranulaat, water of asbest- of crocidoliethoudende afvalstoffen
      of materialen, dat verstuiving of aërosolvorming visueel niet waarneembaar is. Hieraan wordt onder andere
      voldaan indien het vochtgehalte (via vernevelen) van de genoemde bulkmaterialen minimaal 10% bedraagt, waardoor
      verspreiding van de te vervoeren bulkmaterialen wordt voorkomen. Ingeval van het lossen van bagger, wordt het
      gebruik van de zogenoemde bakkenzuiger achterwege gelaten.

      7 De cabine en andere arbeidsplaatsen van het voer- en vaartuig zijn voorzien van een overdrukfilter- en
      klimaatregelingsinstallatie, die het binnentreden van asbest- of crocidoliethoudend stof of aërosol in de
      cabine via de ventilatielucht voorkomt. De overdruk bedraagt minimaal 100 Pascal en maximaal 300 Pascal. Het
      debiet bedraagt, afhankelijk van de lekdichtheid, minimaal 12,5 en maximaal 120 kubieke meter lucht per uur. De
      installatie is voorzien van een controlesysteem dat storingen signaleert.

      8 Voordat de vrachtwagen het werkterrein en het losterrein verlaat, wordt aanhangende vervuiling verwijderd door
      de vrachtwagen aan de buitenzijde nat te reinigen. Het werkwater wordt opgevangen en gefilterd alvorens het water
      wordt hergebruikt of geloosd.

      9 Restanten hechtgebonden of niethechtgebonden asbest-, crocidoliethoudende grond, bagger, puin, puingranulaat,
      water of asbest- of crocidoliethoudende afvalstoffen en materialen, worden na het legen van de laadruimte,
      zorgvuldig hieruit verwijderd, bij voorkeur via nat reinigen, voordat deze voor opslag of vervoer van asbest- of
      crocidolietvrije materialen en producten wordt gebruikt.

      10 De beschreven reinigingswerkzaamheden, bedoeld in de leden acht en negen, dienen plaats te vinden onder
      dezelfde arbeidsbeschermende maatregelen als die, die van toepassing zijn bij het ontgraven, baggeren of op
      een andere wijze verzamelen van hechtgebonden of niet-hechtgebonden asbest-, crocidoliethoudende grond, bagger,
      puin, puingranulaat, water of asbest- of crocidoliethoudende afvalstoffen en materialen. In dit verband zijn
      [beleidsregels 4.2 -2][ref5] en [4.9 -4][ref6] eveneens van toepassing.

      11 Tijdens het laden en het lossen verblijft de chauffeur van de vrachtwagen in de cabine, waarvan de ramen en
      deuren geheel zijn gesloten.

      12 De chauffeur, machinist of schipper stelt zich op grond van de vervoersdocumenten op de hoogte van de aard en
      samenstelling van de vracht die wordt vervoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4.45
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel4.56
