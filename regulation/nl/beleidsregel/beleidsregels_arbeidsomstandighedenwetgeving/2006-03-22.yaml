  - number: '6.14'
    text: |-
      1 De beoordeling van de in [artikel 6.14 van het Arbeidsomstandighedenbesluit][ref1] bedoelde geschiktheid om
      caissonarbeid te verrichten vindt voor elke inschutting plaats door de in [artikel 6.15, eerste lid onder c][ref2],
      bedoelde medische begeleider.

      2 De werkinstructie wordt als deugdelijk aangemerkt als bedoeld in
      [artikel 6.15, eerste lid, onder a, van het Arbeidsomstandighedenbesluit][ref3] indien bij de weergave van de
      veiligheidsvoorzieningen en de noodprocedures ten minste aandacht is besteed aan:

      a. Verantwoordelijkheden en bevoegdheden.

      b. Materieel en onderhoud.

      c. Uitrusting van werkkamer, schutsluizen en compressiekamer.

      d. Luchtdruk, temperatuur, luchtverversing en luchtzuiverheid in werkkamer, schutsluizen en compressiekamer.

      e. Luchtpompen en (nood)energievoorziening.

      f. Gebruik van elektriciteit.

      g. Communicatie.

      h. Voorzieningen en procedures, in ieder geval ten aanzien van het in- en uitschutten, en de decompressie- en de
      behandelingstabellen.

      i. Voorzieningen en procedures voor situaties die afwijken van de algemeen voorkomende werksituaties.

      j. Noodprocedures die ten minste voorschrijven dat de caissonarbeid onmiddellijk wordt gestaakt zodra de reserve-
      apparatuur voor het instandhouden van de overdruk of de noodenergie-voorziening in werking treedt.

      k. Ongevalsmelding en medische hulp.

      l. Samenstelling en gebruik van de EHBO-uitrusting.

      m. Gedragsregels ten aanzien van rusttijd en vliegen na het verrichten van caissonarbeid.

      n. Voorlichting en onderricht.

      In bijlage 15 bij deze beleidsregels wordt voor een aantal onderwerpen een mogelijk nadere uitwerking gegeven.

      3 De caisson, inclusief de werkkamer, schutsluizen en compressiekamer, genoemd in het tweede lid, onder c en d, is
      een arbeidsplaats als bedoeld in [artikel 1, derde lid, onder g, van de Arbeidsomstandighedenwet 1998][ref4] waarop
      de bepalingen uit [hoofdstuk 3 van het Arbeidsomstandighedenbesluit][ref5] van toepassing zijn.

      4 De werkkamer, bedoeld in het tweede lid, onder c en d:

      a. is, zo blijkt uit berekeningen, voldoende stabiel, sterk en lucht- en waterdicht, en

      b. heeft, met uitzondering van de aanvangssituatie, zodanige afmetingen dat de werknemers zich er rechtop in kunnen
      bewegen.

      5 Aan de verplichting om met inachtneming van de stand van de techniek en rekening houdend met de specifiek te
      verrichten arbeid deugdelijk en in goede staat verkerend materieel ter beschikking te stellen, als bedoeld in
      [artikel 6.15, eerste lid, onder b, van het Arbeidsomstandighedenbesluit,][ref6] wordt voldaan als ten minste het
      volgende materieel ter beschikking wordt gesteld dat voldoet aan de daarbij vermelde voorschriften.

      a. Op een caisson zijn twee afzonderlijke personenschutsluizen aanwezig, tenzij dat praktisch uitgesloten is.

      b. In de personenschacht is een takelinstallatie aanwezig waarmee een gewonde op een brancard of in een hijsbroek
      via de schutsluis naar buiten kan worden gebracht.

      c. De personenschutsluis en personenschacht zijn – blijkens keuring en beproeving – voldoende sterk en luchtdicht.

      d. De personenschutsluis voldoet tevens aan de volgende criteria:

      1°. de inlaatopening van de inrichting voor luchtverversing is zodanig geplaatst of beschut, dat de luchtverversing
      geen hinder kan veroorzaken;

      2°. de voor deze ruimte bestemde lucht wordt direct vanuit de hoofdpersleiding aangevoerd,

      3°. de toestellen ter regeling van de luchtdruk in deze ruimte zijn – met uitzondering van de verzegelde
      noodinrichting aldaar – gedurende het schutten van personen buiten hun bereik;

      4°. automatisch registrerende toestellen leggen het verloop van de luchtdruk in een personenschutsluis vast;

      5°. de hoogte is zodanige dat eenieder daarin rechtop kan staan;

      6°. er is apparatuur aanwezig die de ruimte kan verwarmen;

      7°. de constructie van de deuren is zodanig dat deze uitsluitend open kunnen naar de zijde van de hoogste druk;

      8°. hij is voorzien van een venster met een doorzichtige ruit;

      9°. in de ruimte is een verzegelde noodinrichting aanwezig die hen die worden ingeschut, in staat stelt zichzelf in
      noodsituaties uit te schutten;

      10°. de toegang tot de ruimte is voorzien van een platform dat ten minste 1 meter breed is en dat door een leuning
      is beveiligd;

      11°. indien hij boven water is opgesteld, bedraagt de afstand tussen het laagste punt van de toegang tot de
      personenschutsluis en de waterspiegel ten minste 1 meter.

      12°. indien hij onder de waterspiegel is opgesteld, blijkt uit de risico-inventarisatie en –evaluatie, bedoeld in
      [artikel 5 van de Arbeidsomstandighedenwet 1998][ref7], welke veiligheidsmaatregelen zijn genomen om indringing van
      water in de personenschutsluis te voorkomen.

      e. In een personenschutsluis zijn een uitschuttijdentabel, een uurwerk, een manometer en een thermometer
      beschikbaar.

      f. Voor personen en materialen zijn afzonderlijke schutsluizen en afzonderlijke schachten nodig, tenzij de
      werkgever aantoont dat in de werkkamer slechts licht gereedschap nodig is. In dat geval mag het gereedschap via de
      personenschutsluis worden aan- en afgevoerd.

      g. De materialenschutsluis en -schacht zijn – blijkens keuring en beproeving – voldoende sterk en luchtdicht.

      h. Van een materialenschutsluis zijn de binnen- en buitendeuren – indien zij opengaan naar de zijde van de laagste
      druk – zodanig gekoppeld, dat de ene deur slechts open kan als de andere dicht is.

      i. Een werkkamer, personenschutsluis of pompkamer staat door middel van telefoon of een ander akoestisch systeem in
      verbinding met de toezichthouders die zich buiten die ruimten bevinden;

      j. Een werkkamer, personenschutsluis, personenschacht of compressiekamer is door middel van elektrische apparatuur
      verlicht.

      k. Waterdichte elektrische zaklantaarns voor alle caissonwerkers, met een minimum van drie zaklantaarns, zijn
      voorhanden in een waterdicht geconstrueerde kist in de werkkamer.

      l. Met betrekking tot de overdrukinstallatie en installatie voor de luchtzuiverheid wordt het volgende in acht
      genomen:

      1°. De installatie die verantwoordelijk is voor het opbouwen en in stand houden van de overdruk en voor de
      ventilatie is in tweevoud aanwezig.

      2°. Als een luchtpomp of luchtleiding onklaar raakt, kan onmiddellijk een andere luchtpomp of luchtleiding in
      werking treden.

      3°. Ook andere inrichtingen waarvan het falen gevaar oplevert voor degenen die onder overdruk verkeren, zijn steeds
      in reserve en kunnen het werk direct overnemen.

      4°. De persluchtleiding heeft bij de luchtpompen een afsluiter.

      5°. De persluchtleiding bevat een zelfwerkende terugslagklep daar waar de leiding een werkkamer of een
      personenschutsluis binnengaat.

      6°. Op een gemakkelijk bereikbare plaats zit een veiligheidsklep die er voor zorgt dat de luchtdruk in de werkkamer
      de vereiste luchtdruk met niet meer dan 0,5. 105 Pa overschrijdt.

      7°. Er zijn voorzieningen aanwezig die de juiste luchtdruk, luchtverversing, luchtzuiverheid en, zo mogelijk, de
      temperatuur in werkkamer en schutsluizen waarborgen.

      m. Een onafhankelijke noodenergievoorziening (noodstroomaggregaat) is aanwezig om onder alle omstandigheden
      de overdruk in stand te kunnen houden en de verlichting in werkkamer, personenschutsluis, personenschacht of
      compressiekamer te kunnen laten branden.

      6 De duikmedische begeleider als bedoeld in
      [artikel 6.15, eerste lid, onder c, van het Arbeidsomstandighedenbesluit][ref8] houdt in het kader van een adequate
      medische begeleiding onder meer toezicht op het in- en uitschutten, en wel zodanig dat hij in staat is de in en uit
      te schutten personen te observeren.

      7 De eerste-hulpuitrusting is adequaat als bedoeld
      in,[artikel 6.15, eerste lid, onder d, van het Arbeidsomstandighedenbesluit][ref9] indien:

      a. deze wordt vastgesteld in overeenstemming met de arts bedoeld in [artikel 6.15, tweede lid][ref10], en een door
      deze arts op schrift gestelde verklaring van de vastgestelde inhoud is bijgevoegd;

      b. een zuurstofkoffer daarvan deel uitmaakt.

      8 Een werkplan is deugdelijk als bedoeld in [artikel 6.19, tweede lid, van het Arbeidsomstandighedenbesluit,][ref11]
      indien het ten minste bevat:

      a. een opgave van de plaats waar de arbeid zal worden verricht en van het tijdstip waarop deze zal aanvangen;

      b. een opgave van het vermoedelijke aantal werknemers dat op het gehele werk werkzaam zal zijn en van het aantal
      werknemers dat onder hogere dan atmosferische luchtdruk zal werken;

      c. een volledig overzicht van het werk met tekeningen.

      9 Een geschikte compressiekamer als bedoeld in
      [artikel 6.20, eerste lid, van het Arbeidsomstandighedenbesluit][ref12] voldoet aan de eisen die onafhankelijke
      classificatiebureaus stellen. Zij heeft in ieder geval de volgende voorzieningen:

      a. de constructie is zodanig dat deze de benodigde decompressiedruk ruimschoots kan weerstaan:

      b. aan de compressiekamer kan ademhalingsgas worden toegevoerd voor therapeutische recompressie;

      c. de temperatuur in een compressiekamer is zodanig dat zij een optimale decompressie waarborgt;

      d. in de compressiekamer bevindt zich een brandblusinstallatie, die onder overdruk bruikbaar is;

      e. vanuit de compressiekamer is voortdurend telefonisch contact mogelijk met de persoon die de werknemers adequaat
      medisch begeleiden kan, bedoeld in [artikel 6.15, eerste lid, onder c. van het Arbeidsomstandighedenbesluit][ref13].


