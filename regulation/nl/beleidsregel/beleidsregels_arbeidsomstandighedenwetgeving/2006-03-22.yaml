  - number: '4.54'
    text: |-
      De melding als bedoeld in [artikel 4.54, derde lid, van het Arbeidsomstandighedenbesluit][ref1] wordt als tijdig
      beschouwd, als de melding van de in dit artikel genoemde gegevens schriftelijk wordt gedaan uiterlijk 7 dagen vóór
      het tijdstip dat met de werkzaamheden wordt begonnen. In afwijking daarvan kan bij spoedgevallen worden volstaan
      met een melding met een uiterste termijn van 48 uur. Als asbest onverwachts wordt aangetroffen tijdens een sloop
      of bij calamiteiten kan worden volstaan met een onmiddellijke melding. Indien dit laatste betekent dat de melding
      buiten kantooruren zou moeten plaatsvinden, dient deze te geschieden direct bij het begin van de eerstvolgende
      werkdag.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4.54
    url: https://wetten.overheid.nl/BWBR0013042/2006-03-22#Artikel4.54
