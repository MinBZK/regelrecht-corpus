  - number: 4.2 -1
    text: |-
      1 Aan de verplichting tot het bepalen van de gevaren van de blootstelling, bedoeld in
      [artikel 4.2, eerste lid, van het Arbeidsomstandighedenbesluit][ref1], wordt voor wat betreft de blootstelling via
      inademingslucht voldaan als de werkgever het vastgestelde blootstellingsniveau van een stof toetst aan de voor die
      stof vastgestelde bestuurlijke grenswaarde, volgens de methodiek beschreven in NEN-EN 689:1995 "Werkplekatmosfeer.
      Leidraad voor de beoordeling van de blootstelling bij inademing van chemische stoffen voor de vergelijking met de
      grenswaarden en de meetstrategie". De desbetreffende bestuurlijke grenswaarden zijn opgenomen in [bijlage 6][ref2]
      bij deze beleidsregels. Als voor de desbetreffende stof geen grenswaarde van overheidswege is vastgesteld, volstaat
      toetsing volgens diezelfde systematiek aan een door de werkgever vast te stellen waarde, die naar de huidige
      stand van wetenschap en inzicht als een veilige blootstellingsgrens kan worden beschouwd bij blootstelling aan
      een combinatie van stoffen waarvan bekend is dat de afzonderlijke componenten dezelfde toxische werking hebben op
      eenzelfde orgaansysteem, geldt bij toetsing de zogenaamde additieregel, als bedoeld in [bijlage 7][ref3] bij deze
      beleidsregels, voor het vaststellen van de waarde waaraan wordt getoetst.

      2 Aan de verplichting tot beoordeling van de aard van de blootstelling, als bedoeld in
      [artikel 4.2, tweede lid, van het Arbeidsomstandighedenbesluit][ref4], wordt voldaan als de werkgever over die
      stoffen welke door blootstelling aan werknemers schade aan hun gezondheid of hinder kunnen veroorzaken, de volgende
      gegevens vastlegt:

      a. de identiteit van de stof,

      b. de aard van de gevaren,

      c. de wijze van mogelijke blootstelling en

      d. het werk of de werkwijze die met de blootstelling verband houdt.

      3 Als de beoordeling van de mate van de blootstelling, zoals bedoeld in
      [artikel 4.2, derde lid, van het Arbeidsomstandighedenbesluit][ref5], door middel van een schatting wordt
      uitgevoerd, voldoet de werkgever aan het gestelde in dit lid alleen als hij deze schatting door middel van een
      berekening kwantitatief goed kan onderbouwen en schriftelijk heeft weergegeven bij de bepaling of een schatting van
      de mate van blootstelling in een gegeven blootstellingssituatie volstaat dienen de randvoorwaarden zoals genoemd in
      NEN-EN 689 in acht te worden genomen.

      4 Als de beoordeling van de mate van de blootstelling, zoals bedoeld in
      [artikel 4.2, vierde lid, van het Arbeidsomstandighedenbesluit][ref6], door middel van metingen wordt uitgevoerd,
      voldoet de werkgever aan het gestelde in dit lid als de toetsing plaatsvindt volgens een voor dat doel geschikte
      genormaliseerde methode. Dit kan zowel een gevalideerde Nederlandse als buitenlandse methode zijn.

      5 Als ten aanzien van asbest de beoordeling van de mate en duur van de blootstelling, bedoeld in
      [artikel 4.2, vierde lid, van het Arbeidsomstandighedenbesluit][ref7], door middel van metingen wordt uitgevoerd,
      voldoet de werkgever aan het gestelde in dit lid als hij metingen verricht conform de voorschriften in
      [artikel 4.50, tweede en zevende tot en met negende lid, van het Arbeidsomstandighedenbesluit][ref8].

      De meetresultaten moeten in ieder geval voldoende onderbouwd kunnen aantonen of en bij welke omstandigheden één
      van de actieniveaus als genoemd in [artikel 4.44 van het Arbeidsomstandighedenbesluit][ref9] vermoedelijk wordt
      overschreden.

      6 Als ten aanzien van asbest bij de beoordeling van de aard van de blootstelling, bedoeld in
      [artikel 4.2, tweede lid, van het Arbeidsomstandighedenbesluit][ref10], twijfel bestaat over het type
      asbestmateriaal waaraan blootstelling plaatsvindt, gaat de werkgever er bij de beoordeling van de risico’s en
      toetsing van de actie- en grenswaarden van uit dat het desbetreffende materiaal uit crocidoliet bestaat.


