  - number: 5.4 -1a
    text: |-
      Een zitgelegenheid is doelmatig in de zin van [artikel 5.4, eerste lid, van het Arbeidsomstandighedenbesluit][ref1]
      als aan de volgende voorwaarden is voldaan:

      1. Alle regelmatig voorkomende werkzaamheden zijn binnen het werkbereik van de handen en het zichtgebied van de
      individuele werknemer gebracht. De werkhoogte is aangepast aan de werkzaamheden en de individuele werknemer. De
      werknemer heeft de beschikking over een voetensteun indien dat voor het bereiken van een goede lichaamshouding
      gevergd wordt. Deze is minimaal 45 cm breed en 35 cm diep en is eenvoudig in hoogte instelbaar in minimaal
      3 standen met onderling gelijke afstand. Het totale instelbereik van de voetensteun omvat in ieder geval het
      verticale traject tussen 35 en 47 centimeter onder de bovenzijde van de zitting. Een stang of balk als voetensteun
      is onvoldoende.

      2. Ten behoeve van de bewegingsvrijheid van benen en voeten is een vrije ruimte onder het werkblad aanwezig van
      ten minste 70 centimeter hoog en 60 centimeter breed en diep. Voor werkzaamheden in kantoren bedraagt de minimale
      diepte ten behoeve van de benen en voeten respectievelijk 65 en 80 centimeter.

      3. Indien kantoorwerkzaamheden worden verricht:

      a. is er ten behoeve van de werknemer een zitgelegenheid beschikbaar die aan de norm NEN-EN 1335-1:2000
      ‘Kantoormeubelen - Kantoorstoelen - Deel 1: Afmetingen - Bepaling van afmetingen’ voldoet, met de aanduiding ‘type
      A’;

      b. zorgt de werkgever voor een stoel met aangepaste maatvoering of verstelmogelijkheden in de gevallen dat de
      verstelmogelijkheden van deze stoel voor een werknemer niet toereikend zijn;

      c. voldoet de werktafel aan de norm NEN 2441:2002 ‘Ergonomie - Ergonomische criteria voor zit-statafels voor
      kantoorwerk - Eisen voor afmetingen en uitvoering - Beproevingsmethoden’ of aan de norm NEN 2449:1990 ‘Ergonomie.
      Ergonomische criteria voor kantoortafels. Eisen voor afmetingen en uitvoering, Beproevingsmethoden’, waarbij in
      plaats van de tafel met hoogteinstelbaarheid ook van een tafel met een vaste werkhoogte gebruik kan worden gemaakt,
      mits deze vaste werkhoogte tussen 74 en 76 centimeter ligt.

      4. Bij andere werkzaamheden dan kantoorwerkzaamheden die zittend kunnen worden verricht, is een zitgelegenheid
      beschikbaar die aan de norm NEN-EN 1335-1:2000 ‘Kantoormeubelen - Kantoorstoelen - Deel 1: Afmetingen - Bepaling
      van afmetingen’ voldoet. Als de situatie dat vereist, heeft zo’n zitgelegenheid tevens gunstige eigenschappen ten
      aanzien van hygiëne, stroefheid en ventilatie van het materiaal.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel5.4
