  - number: 7.17b
    text: |-
      Aan het gestelde in [artikel 7.I7b, tweede lid onder b van het Arbeidsomstandighedenbesluit][ref1] wordt voldaan
      indien mobiele arbeidsmiddelen met elektrische aandrijving zijn uitgerust met een inrichting die onafhankelijk
      van het bedieningsorgaan automatisch het stroomcircuit van de rijmotor onderbreekt wanneer de bestuurder het
      arbeidsmiddel verlaat. De inrichting mag werken met een vertraging van maximaal 3 seconden.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel7.17b
    url: https://wetten.overheid.nl/BWBR0013042/2006-03-22#Artikel7.17b
