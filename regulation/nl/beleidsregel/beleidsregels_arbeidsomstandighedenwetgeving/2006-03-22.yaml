      24 Voor liggers gelden de volgende voorwaarden: a. liggers zijn door kruiskoppelingen bevestigd aan de binnenzijde
      van de staanders; b. de onderlinge vertikale afstand van de liggers bedraagt bij toepassing van bovenstaande
      tabellen maximaal 2 m; c. bij grotere afstanden is de constructie aangepast op basis van berekeningen volgens deel
      l (Uitgangspunten) en zijn in de meeste gevallen leuningen, hekwerken en dergelijke verhoogd al naar de aard van
      de te verrichten werkzaamheden. d. De onderste ligger is noogstens 0,25 m boven de onderste ondersteuning van de
      staanders aangebracht. e. Lassen van twee opeenvolgende liggers zijn niet tussen dezelfde staanders aangebracht.
      Bij verdere opbouw van de steiger wordt geen ligger verwijderd.

      25 Koppelbuizen zijn aanwezig op iedere kruising van een ligger en een staander en zijn aan beide zijden door
      koppelingen vastgezet. Ter ondersteuning van de werkvloer zijn tussen de verbindingsbuizen kortelingen aangebracht,
      die aan de buitenste ligger zijn bevestigd. De afstand tussen kortelingen of tussen een korteling en een koppelbuis
      is zoveel mogelijk gelijk. Het minimum aantal toe te passen kortelingen tussen de staanders is aangegeven in de
      tabellen 1 en 2.

      26 Voor zogenaamde enkele steigers geldt dat kortelingen onder een geringe, naar het bouwwerk aflopende helling
      zijn gelegd en zij in het metselwerk over een lengte van ten minste 10 cm zijn ondersteund of zijn voorzien van een
      kortelingsteun. Bij een enkele steiger zijn de onderliggers bij de kruising met een staander verbonden aan direct
      in het metselwerk dragende kortelingen zonder kortelingsteunen.

      27 Steigers zijn verankerd door elk steigervlak te koppelen aan balklagen, voldoende verhard metselwerk of andere
      vaste delen van het bouwwerk, overeenkomstig het in afbeelding 1 aangegeven patroon. Van dit patroon kan worden
      afgeweken bij uitvoeringsproblemen, mits de vaste stand van de steiger blijft gewaarborgd en het knikgevaar van
      staanders is voorkomen, bijvoorbeeld door het aanbrengen van schoorverbanden.

      28 De eerste en de laatste staander zijn altijd verankerd evenals de bovenzijde daarvan. Hoekstaanders van twee
      elkaar snijdende steigervlakken blijven daarbij buiten beschouwing. Bij dubbele steigers wordt zowel het binnenste
      als het buitenste steigervlak afzonderlijk verankerd. Verankeringen zijn horizontaal gekoppeld aan de liggers of de
      staanders, zo dicht mogelijk bij de knooppunten. Verankeringen kunnen als korteling worden gebruikt.

      29 Bij het gebruik van verankeringsspindels in kozijnen of andere openingen zijn deze omgeven door verhard
      metselwerk of beton. De vuistukken tussen verankeringsspindels en het metselwerk of het beton bestaan uit materiaal
      dat een nagenoeg constante spanning in de spindels waarborgt. Hout of ander krimpgevoelig materiaal behoort hier
      niet toe. Verankeringen worden niet aan ingemetselde kortelingsteunen bevestigd.

      30 Verankeringen kunnen ieder de volgende horizontale krachten opnemen: a. evenwijdig aan het bouwwerk: 1,7kN; b.
      loodrecht op het bouwwerk: 2,5 kN. Bij open skeletachtige bouwwerken en steigerhoogtes van meer dan 15 m bedraagt
      deze waarde 5,0 kN.

      31 Om schranken van de steigerconstructie tegen te gaan is het buitenvlak van de steiger over de gehele hoogte
      voorzien van schoren. a. Een steigervlak telt maximaal zes opeenvolgende ongeschoorde staanders. b. Bij steigers
      hoger dan 10 m zijn alle staanders in een steigervlak met elkaar verbonden middels doorlopende elkaar kruisende
      schoren. c. De schoren worden gekoppeld aan iedere staander die zij kruisen, zo dicht mogelijk bij de knooppunten
      van staanders en liggers. d. Verlengen van doorlopende schoren geschiedt door zogenaamde parallelkoppelingen.
      Schoren worden gelijktijdig met het opbouwen van de steiger aangebracht.

      32 Werkvloeren zijn over de gehele breedte zo dichtgelegd, dat doorvallen van materialen en gereedschappen niet
      mogelijk is. a. Indien twee steigervlakken elkaar snijden – bijvoorbeeld op een hoek van een bouwwerk – loopt elke
      werkvloer door tot deze rust op de ligger van het andere (buitenste) steigervlak. b. Het opwaaien, opwippen en
      verschuiven van de steigerplanken wordt voorkomen. c. Van metalen werkvloeren is de draagkracht door een berekening
      aangetoond. d. Onder werkvloeren boven 6 m hoogte is op maximaal 2,5 m daaronder een dichtgelegde schrikvloer
      aangebracht van dezelfde breedte en constructie als de werkvloer. e. De afstand tussen de werkvloer en het bouwwerk
      bedraagt ten hoogste 10 cm, tenzij de aard van de werkzaamheden zich hiertegen verzet. f. Werkvloerplanken die
      tussen staanders eindigen, zijn stuik tegen elkaar gelegd, waarbij de uiteinden elk afzonderlijk is ondersteund. De
      afstand tussen deze ondersteuningen is maximaal 0,30 m.

      33 Bij een werkvloer boven ingangen of boven plaatsen waar wordt gewerkt of waar regelmatig verkeer plaatsvindt,
      is een vangschot aangebracht onder een hoek van 45 graden, dat tenminste 0,75 m uitsteekt buiten de vloer waar
      voorwerpen vanaf kunnen vallen (of zoveel meer als in verband met plaatselijke omstandigheden noodzakelijk is)
      en dat is samengesteld uit aaneensluitende planken van tenminste 2 cm dikte. Op plaatsen waar dat nodig is, is
      aansluitend aan het vangschot een doelmatige afdekking aangebracht.

      34 Loopbruggen die onder een helling groter dan 1:4 met het horizontale vlak liggen, zijn over de volle breedte
      voorzien van looplatten die zekerheid bieden tegen uitglijden. Voor zover van toepassing, gelden voor loopbruggen
      dezelfde voorschriften als voor werkvloeren.

      35 Alle metalen delen van stalen steigers zijn verbonden met een beschermingsleiding (aardleiding), wanneer zich
      op, langs, aan of boven de steigers elektrische kabels of leidingen bevinden, die kunnen zijn aangesloten op een
      onder spanning staand elektriciteitsnet.

      36 De hiervoor beschreven "standaard" steigers zijn niet geschikt om hijswerktuigen op of aan te bevestigen.
      Bouwliften worden aan het bouwwerk zelf verankerd. Indien door omstandigheden een hijswerktuig op of aan een
      steiger is bevestigd, is deze daarop aangepast. Dit geldt ook voor ieder ander gebruik dat de steiger extra belast,
      zoals het toepassen van zeilen etc.


