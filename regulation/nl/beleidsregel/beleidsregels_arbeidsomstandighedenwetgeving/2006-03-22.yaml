  - number: 2-2
    text: |-
      1 Bij de uitwerking van de begripsomschrijving van een installatie voor bewerking, als bedoeld in
      [artikel 2.2, aanhef en onder g, van het Arbeidsomstandighedenbesluit][ref1] namelijk het stelsel van vaten,
      apparaten en leidingen dat ten aanzien van de omsloten gevaarlijke stof als één geheel is te beschouwen, wordt, in
      volgorde van belangrijkheid, het volgende drietal elementen betrokken.

      a. De procesmatige afbakening. Bij procesmatige afbakening, passend in de begripsomschrijving ‘installatie voor
      bewerking’, wordt zoveel mogelijk aaneengesloten bij de definitie van proces, zijnde een samenhangend geheel van
      een of meer bewerkingen en/of reacties, waaraan stof(fen) word(t)(en) onderworpen. Voor de aanwijzing wordt de
      totale hoeveelheid gevaarlijke stof welke zich in de afgebakende installatie bevindt berekend.

      b. De organisatorische afbakening. Geeft het criterium ‘procesmatige afbakening’ onvoldoende duidelijkheid, dan
      wordt de organisatorische afbakening toegepast. De afgebakende installatie bevat alleen procesapparatuur die wordt
      bediend door uitvoerend personeel behorende tot één organisatorische eenheid.

      c. De ruimtelijke afbakening. Geeft het criterium ‘organisatorische afbakening’ vervolgens onvoldoende
      duidelijkheid, dan wordt de ruimtelijke afbakening toegepast. Bij de afbakening van installaties voor bewerking
      wordt rekening gehouden met de ruimterijke ligging van de processen ten opzichte van elkaar. De processtappen
      bevinden zich binnen een herkenbare ruimtelijke begrenzing van de installatie voor bewerking, dat wil zeggen in de
      onmiddellijke nabijheid van elkaar.

      2 In [artikel 2.2 van het Arbeidsomstandighedenbesluit][ref2] is aangegeven dat een installatie voor
      verlading wordt aangemerkt als een installatie voor bewerking. De hoeveelheid gevaarlijke stof die zich in een
      transporteenheid bevindt wordt echter niet in de totale hoeveelheid meegenomen, tenzij de transporteenheid zich
      binnen de ruimtelijke grenzen van de afgebakende installatie bevindt. Indien de transporteenheid zich buiten de
      ruimtelijke grenzen van de afgebakende installatie bevindt, dient deze te worden aangemerkt als een installatie
      voor opslag.

      3 De afbakening van een installatie voor bewerking, zoals bedoeld in
      [artikel 2.2 onder g, van het Arbeidsomstandighedenbesluit][ref3] kan bij complexe procesinstallatie
      met een veelheid aan productieprocessen problemen geven. De nadere uitwerking moet aan die problemen
      tegemoet komen. Doel is dat de Aanvullende risico-inventarisatie en -evaluatie (ARIE) een goede en op de
      praktijk gerichte beschrijving vormt, die recht doet aan de doelstellingen van de regelgeving, bedoeld in
      [afdeling 2 van hoofdstuk 2 van het Arbeidsomstandighedenbesluit][ref4] het ARIE-besluit.

      4 Voor de opslag van gevaarlijke stoffen in verpakkingseenheden (zakken, drums, flessen enz.) als bedoeld in
      [artikel 2.2, onder h, van het Arbeidsomstandighedenbesluit][ref5] dient voor wat betreft de aanwijzing de totale
      hoeveelheid gevaarlijke stof in de zich op één plaats bevindende eenheden van verpakking beschouwd te worden. Bij
      het samenstellen van de ARIE kan ervoor gekozen worden de beschrijving van verschillende opslaginstallaties te
      combineren. Voor een tankpark kan dan met één set scenario’s worden volstaan. De verschillende risico’s moeten wel
      duidelijk beschreven blijven.

      5 Het uitgangspunt van de aanwijzing, als bedoeld in [artikel 2.3, van het Arbeidsomstandighedenbesluit][ref6]
      is de vergelijking van de gecorrigeerde hoeveelheid gevaarlijke stof in de installatie met de grenswaarde van die
      stof. Hierbij gelden de volgende voorwaarden:

      a. De installatie is aangewezen als met betrekking tot enige gevarensoort geldt:

      - Q x O ≥ G, of anders geschreven A ≥ 1, waarbij A = (Q x O) / G Q = de hoeveelheid in de installatie aanwezige
      stof (of groep van stoffen) [kg]; O = de totale omstandigheidsfactor [-]; G = de grenswaarde van de stof (of groep
      van stoffen) [kg]; en A = aanwijzingsgetal [-].

      b. Bij mengsels van stoffen moeten de per stof berekende aanwijzingsgetallen per categorie (brandbaar, extreem
      toxisch en toxisch) gesommeerd worden. Omdat alleen bij mengsels van toxische stoffen sprake kan zijn van
      verschillende grenswaarden geldt die bepaling in de praktijk alleen daarvoor.

      c. Bij ontplofbare stoffen (onder deze categorie zijn ook mengsels begrepen) schuilt, anders dan bij de hiervoor
      vermelde categorieÎn van gevaarlijke stoffen, het gevaar in de stof zelf, in die zin, dat de stof niet eerst vrij
      hoeft te komen alvorens het gevaar voor de werknemer manifest kan worden. Voor deze groep van stoffen zijn de
      heersende omstandigheden dan ook niet relevant en worden geen omstandigheidsfactoren in rekening gebracht.

      6 Bij de afleiding van grenswaarden voor toxische stoffen, als bedoeld in
