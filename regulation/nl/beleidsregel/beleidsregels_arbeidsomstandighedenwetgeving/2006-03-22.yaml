  - number: 4.4 -2
    text: |-
      Ten aanzien van de opslag van gevaarlijke stoffen in emballage en de werkzaamheden die daarmee verband houden
      worden de volgende voorzieningen adequaat geacht ter vermijding van het gevaar op een ongewilde gebeurtenis zoals
      omschreven in [artikel 4.4, eerste tot en met derde lid, van het Arbeidsomstandighedenbesluit][ref1], dan wel ter
      beperking van de gevolgen van een ongewilde gebeurtenis zoals omschreven in [artikel 4.4, vierde lid][ref2].

      Gevaarlijke stoffen in verpakkingen worden opgeslagen conform de voorschriften met betrekking tot de
      arbeidsomstandigheden in de volgende richtlijnen van de Commissie voor de preventie van rampen door gevaarlijke
      stoffen CPR 15-1 "Opslag gevaarlijke stoffen in emballage, opslag van vloeistoffen en vaste stoffen (0-10 ton)
      en CPR 15-2 "Opslag gevaarlijke stoffen chemtscne afvalstoffen en bestrijdingsmiddelen in emballage, opslag grote
      hoeveelheden vanaf 10 ton".


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4.4
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel4.4
    url: https://wetten.overheid.nl/BWBR0013042/2006-03-22#Artikel4.4_-2
