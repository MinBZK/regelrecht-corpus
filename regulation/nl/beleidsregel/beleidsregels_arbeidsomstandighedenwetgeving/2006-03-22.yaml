      1.2 De buisrailsteunen zijn vast verbonden met de buizen.

      1.3 Het buisrailsysteem is aangelegd op een vlakke bodem. De scheefstand van het buisrailsysteem gemeten op de
      buizen mag niet meer bedragen dan 2º.

      1.4 De grond waarop het buisrailsysteem is gefundeerd is voldoende draagkrachtig.

      1.5 Het stabiliteitsgedrag van de buisrailwagen in de gebruikssituatie wordt onderzocht nadat het buisrailsysteem
      is aangelegd en als de buisrailwagen in combinatie met het buisrailsysteem voor de eerste maal in gebruik wordt
      genomen. Het onderzoek wordt uitgevoerd in de voor het kantelgevaar meest ongunstige opstelling. Daartoe wordt
      de buisrailwagen opgesteld op een deel van het buisrailsysteem dat ten behoeve van de beproeving 2,5º zijwaarts
      hellend is aangelegd, met het platform in de hoogst geheven stand, waarop zich een proeflast van 100 kg bevindt,
      en waarop een kracht van 110 N wordt uitgeoefend, die aangrijpt op 1,10 meter boven het platform en horizontaal
      werkzaam is in de kantelrichting.

      Het zwaartepunt van de proeflast bevindt zich horizontaal gemeten vanaf de binnenkant van het hekwerk op 100
      mm, aan de lage kant van de hellende opstelling. De stabiliteit is voldoende als de buisrailwagen de beproeving
      gedurende 60 seconden weerstaat zonder te kantelen.

      De uitvoering van het onderzoek vindt plaats door een deskundige natuurlijke persoon, rechtspersoon of instelling.
      Een schriftelijk bewijs van de uitgevoerde beproeving is op de arbeidsplaats aanwezig.

      2. Buisrailsystemen die gebruikt worden in combinatie met buisrailwagens, waarvan alle gegevens noodzakelijk voor
      veilig gebruik beschikbaar zijn.

      2.1 Het buisrailsysteem is ingericht conform de specificaties die door de fabrikant van de te gebruiken
      buisrailwagen zijn aangegeven in de gebruiksaanwijzing. De volgende specificaties zijn in elk geval vermeld: de
      vereiste eigenschappen met betrekking tot het draagvermogen van de grond waarop het buisrailsysteem gefundeerd
      wordt, de toelaatbare scheefstand van het buisrailsysteem, de spoorbreedte, de gegevens van de buis (diameter,
      wanddikte en materiaalsoort en -sterkte), de afstand tussen buisrailsteunen en de uitvoering van de buisrailsteunen
      (minimum afmetingen van de onderplaat).

      2.2 De buisrailsteunen zijn vast verbonden met de buizen.

      2.3 Het stabiliteitsgedrag van de buisrailwagen in de gebruikssituatie wordt onderzocht nadat het buisrailsysteem
      is aangelegd en als de buisrailwagen in combinatie met het buisrailsysteem voor de eerste maal in gebruik wordt
      genomen. Het gestelde in 1.5 is hierbij van toepassing. De uitvoering van het onderzoek vindt plaats door een
      deskundige natuurlijke persoon, rechtspersoon of instelling. Indien de fabrikant van de buisrailwagen verdergaand
      onderzoek van het stabiliteitsgedrag in de gebruikssituatie voorschrijft, wordt dat uitgevoerd conform de
      voorschriften van de fabrikant van de buisrailwagen.

      Een schriftelijk bewijs van de uitgevoerde beproeving of beproevingen is bij de arbeidsplaats aanwezig.

      3. De buisrailwagens

      3.1 Het gevaar van vallen met de buisrailwagen is tegengegaan door het gebruik van buisrailwagens die zijn
      uitgevoerd met doelmatige scheefstandssignalering.

      3.2 Het gevaar te vallen vanaf het platform van de buisrailwagen is tegengegaan door hekwerk langs de omtrek
      van het platform. Het hekwerk is uitgevoerd met een bovenleuning op tenminste 1.10 meter boven het platform met
      halverwege een tussenleuning. Indien de horizontale afstand tussen de bovenleuningen van beide lange zijden van het
      platform, niet groter is dan 0,5 meter, mag volstaan worden met een bovenleuning bij de lange zijden op minimaal
      0,9 meter boven het platform met halverwege een tussenleuning. De leuningen bij de korte zijden van het platform
      moeten in dat geval een hoogte hebben van tenminste 1.10 meter over tenminste 2/3 deel van de lengte van de korte
      zijde van het platform.

      3.3 Op buisrailwagens is een opschrift aangebracht met de maximum toegestane belastingen.

      4. De specificaties van het buisrailsysteem en de gegevens die van belang zijn voor een veilig gebruik van het
      buisrailsysteem zijn schriftelijk vastgelegd.

      5. Zo vaak als nodig is in verband met de eigenschappen van het buisrailsysteem, van de fundatie en van de
      buisrailwagen en de omstandigheden die deze eigenschappen nadelig kunnen beïnvloeden, wordt gecontroleerd of de
      voorzieningen en genomen maatregelen nog adequaat functioneren. Geconstateerde gebreken worden zo snel mogelijk
      hersteld. Nadat een buisrailsysteem opnieuw is aangelegd en voordat dit opnieuw in gebruik wordt genomen wordt
      het stabiliteitsgedrag van de buisrailwagen onderzocht in de gebruikssituatie in de voor het kantelgevaar meest
      ongunstige opstelling. Het gestelde in 1.5 is daarbij van toepassing.

      6. Aangetoond kan worden dat de fundatie, het buisrailsysteem en de buisrailwagen voldoen aan de punten 3, 4 en 5
      in combinatie met punt 1 of punt 2.
