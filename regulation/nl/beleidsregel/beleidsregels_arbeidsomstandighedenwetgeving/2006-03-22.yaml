  - number: 4.6 -1
    text: |-
      1 Er is sprake van een zodanige mate van blootstelling aan stoffen in een ruimte dat gevaar
      voor verstikking, bedwelming of vergiftiging dan wel brand of explosie als bedoeld in
      [artikel 4.6 eerste lid van het Arbeidsomstandighedenbesluit][ref1] bestaat indien in ieder geval in die ruimte:

      a. de concentratie aan zuurstof lager is dan 18 volumeprocent en als deze hoger is dan 21 volumeprocent, of

      b. de concentratie van brandbare of explosieve gassen of dampen hoger is dan 10 volumeprocent van de onderste
      explosiegrens, of

      c. de concentratie van een stof de bestuurlijke of wettelijke grenswaarde voor die stof overschrijdt.

      Voor de scheepvaart geldt de Bekendmaking aan de Scheepvaart nr 313/1996 voor de bepaling van de luchtkwaliteit (1
      volumeprocent Lower Explosion Limit en 21 volumeprocent zuurstof).

      2 Adequaat onderzoek als bedoeld in [artikel 4.6, eerste lid, van het Arbeidsomstandighedenbesluit][ref2] houdt in
      dat voor het betreden van de ruimte in deze ruimte met geschikte meetapparatuur wordt vastgesteld of de feitelijke
      situatie zodanig is dat gevaren voor brand, explosie, vergiftiging, verstikking of bedwelming niet zullen optreden.
      Dit wordt vastgesteld door achtereenvolgens:

      a. bepaling van het zuurstofgehalte als de kans op verstikking of van een met zuurstof verrijkte atmosfeer bestaat;

      b. bepaling van de samenstelling van het mengsel dat een risico vormt ten aanzien van brand en/of explosie en
      vergelijking van de waarde met de explosiegrenzen van de desbetreffende stof(fen);

      c. bepaling van de concentraties van aanwezige stoffen wanneer de kans op vergiftiging of bedwelming bestaat
      en vergelijking van de gemeten waarden met wettelijke of bestuurlijke grenswaarden voor deze stoffen zoals
      gepubliceerd in de "Nationale MAC-lijst".

      3 Gedurende de werkzaamheden worden frequente herhalingsmetingen uitgevoerd van de aanwezige stoffen en zuurstof
      indien de kans op brand, explosie, vergiftiging, verstikking of bedwelming in de ruimte of nabij de toegang van de
      ruimte tijdens de werkzaamheden blijft bestaan of vergroot wordt.

      4 Het onderzoek wordt uitgevoerd door personen, die zowel op de hoogte zijn van de gevaren van bedoelde ruimten als
      van de van toepassing zijnde meetmethoden en zodanig dat de resultaten eenduidig en betrouwbaar zijn. De resultaten
      worden schriftelijk vastgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4.6
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel4.6
