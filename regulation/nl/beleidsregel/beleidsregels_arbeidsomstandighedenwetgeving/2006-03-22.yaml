  - number: 4.4 -1
    text: |-
      Ten aanzien van de opslag, het gebruik en het transport van gascylinders worden de volgende voorzieningen
      adequaat geacht ter vermijding van het gevaar op een ongewilde gebeurtenis zoals omschreven in
      [artikel 4.4, eerste tot en met derde lid, van het Arbeidsomstandighedenbesluit][ref1], dan wel ter beperking van
      de gevolgen van een ongewilde gebeurtenis zoals omschreven in [artikel 4.4, vierde lid][ref2].

      a. Gascylinders worden tijdens stationaire opslag, gebruik en verplaatsing deugdelijk vastgezet in al of met
      verplaatsbare rekken of tegen een muur om beschadiging te voorkomen.

      b. De gascylinders zijn in goede technische staat. Beschadigde gascylinders worden niet in gebruik genomen.

      c. De afsluiters van gascylinders zijn doelmatig beschermd tegen beschadigingen die bij een val van de cylinder
      tijdens het vervoer of het stapelen het vrijkomen van gas zouden kunnen veroorzaken.

      d. Gascylinders worden beschermd tegen verwarming, verhitting of nadelige weersinvloeden

      e. Batterijen van gascylinders die brandbare, vergiftige, verstikking veroorzakende of zuurstof verrijkende gassen
      bevatten, worden niet op de arbeidsplaats opgesteld. De ruimten waar batterijen van gascylinders zijn opgesteld
      die brandbare, vergiftige, verstikking veroorzakende of zuurstof verrijkende gassen bevatten zijn alleen van buiten
      af betreedbaar.

      f. De opstelruimte waarin zich gascylinders of batterijen van gascylinders bevinden die brandbare,
      vergiftige, verstikking veroorzakende of zuurstof verrijkende gassen bevatten, is voldoende geventileerd
      op de buitenlucht Hieraan wordt voldaan door natuurlijke ventilatie via twee openingen van tenminste
      10 dm2 die diametraal ten opzichte van elkaar aanwezig zijn, of door mechanische ventilatie. Deze
      ruimten zijn aan de buitenzijde bij de toegangen gekenmerkt met een gevaarssymbool als bedoeld in
      [artikel 8.15 van de Arbeidsomstandighedenregeling][ref3] (ondertekst "brandbare gassen roken en open vuur
      verboden", "vergiftige, bedwelmende, verstikking veroorzakende gassen", "zuurstof verrijkende gassen roken en open
      vuur verboden" voor zover van toepassing).

      g. Gascylinders waarvan de keuringstermijn is verstreken worden niet meer gebruikt of opgeslagen.

      h. In de nabijheid van kelders, souterrains, putten, rioleringen en andere ruimten beneden het maaiveld worden geen
      gascylinders opgeslagen

      i. In de nabijheid van batterijen van gascylinders is op een gemakkelijk bereikbare plaats beschermd tegen
      weersinvloeden, een droogpoederblustoestel met een inhoud van tenminste 6 kg bluspoeder of een CO-blustoestel met
      een blusequivalent van 6 kg poeder aanwezig.

      j. Karweiflesjes voor propaan butaan of mengsels daarvan hebben maximaal een inhoud van 3 liter en worden tot
      maximaal 80% gevuld.

      k. bij gascilinders voor tot vloeistof verdichte gassen wordt de hoogst toelaatbare vullingsgraad gehanteerd die
      gelijk is aan 0,95 x dichtheid van de vtoeistoffase bij 50°C m kg/l.

      l. Gascylinders voor brandbevorderende gassen, zoals zuurstof, worden gescheiden opgeslagen van gascylinders voor
      brandbare gassen

      m. De aansluiting van een zuurstofcylinder op een leidinggsysteem is zodanig dat geen andere gascylinders dan die
      bestemd voor zuurstof op deze leiding kunnen worden aangesloten.

      n. Brandbare pakkingen en smeervet voor afsluiters bestemd voor gascylinders voor zuurstof worden niet gebruikt.

      o. Leidingen en appendages zijn bestand tegen de gassen waarmee zij in aanraking komen.

      p. Voor leidingen en appendages die met acetyleen in aanraking kunnen komen wordt geen koper gebruikt, bij gebruik
      van legeringen bevatten deze niet meer dan 63% koper.

      q. Batterijen van gascylinders met brandbevorderende gassen zoals zuurstof worden met in een ruimte opgesteld of
      opgeslagen met gascylinders van acetyleen of andere brandbare gassen.

      r. Gascylinders met extreem toxische stoffen, zoals arsine en fosfine, worden in aparte ruimten opgeslagen.

      s. Gascylinders met extreem toxische stoffen zijn uitgerust met twee onafhankelijke inblokafsluiters tijdens
      tussen-opslag en tijdens gebruik.

      t. Gascylinders worden gekeurd volgens de voorschriften die gegeven zijn in de
      [Regeling vervoer over land van gevaarlijke stoffen 1997][ref4] (VLG) (Stcrt 29-11-1996. nr 235). Bijlage A,
      randnummers 2214 t/m 2217(beproeving toegelaten houders) en randnummer 2218 (beproevingsdruk vullingsgraad).


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4.4
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel4.4
      [ref3]: https://wetten.overheid.nl/BWBR0008587#Artikel8.15
      [ref4]: https://wetten.overheid.nl/BWBR0010054
