  - number: '7'
    text: |-
      Tenzij bij ministeriële regeling anders wordt bepaald, wordt de vergoeding door degene die de vergoeding is
      verschuldigd, bij vooruitbetaling voldaan.
    url: https://wetten.overheid.nl/BWBR0010334/2022-05-13#Artikel7
  - number: 7a
    text: |-
      Aan een krachtens dit besluit vast te stellen ministeriele regeling kan terugwerkende kracht worden verleend tot
      een bij die regeling te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0010334/2022-05-13#Artikel7a
