  - number: '5'
    text: |-
      1 Bij ministeriële regeling wordt de hoogte van de vergoeding per categorie of subcategorie van gelijksoortige
      werkzaamheden of diensten vastgesteld op basis van de geraamde kosten die per categorie of per subcategorie zijn
      toegerekend als bedoeld in [artikel 4][ref1].

      2 Bij de regeling worden de bedragen en de jaarlijkse bijdrage, bedoeld in
      [artikel 2, tweede lid, onder a tot en met c][ref2], afzonderlijk vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0010334#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0010334#Artikel2
