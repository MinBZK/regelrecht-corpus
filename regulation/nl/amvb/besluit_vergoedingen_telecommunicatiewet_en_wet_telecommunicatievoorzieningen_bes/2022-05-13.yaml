  - number: '4'
    text: |-
      1 Categorieën als bedoeld in [artikel 3, eerste lid, onder a en b][ref1], zijn werkzaamheden of diensten als
      bedoeld in de [wet][ref2] of de [Wtv BES][ref3] met betrekking tot:

      a. het gebruik van frequentieruimte voor:

      1°. elektronische communicatienetwerken en elektronische communicatiediensten;

      2°. omroep;

      3°. straalverbindingen;

      4°. frequentiegebruik waarvoor een meld- en registratieverplichting geldt,

      b. apparaten en radioapparaten als bedoeld in [hoofdstuk 10 van de wet][ref4],

      c. de aanwijzing van instellingen als bedoeld in [artikel 18.17a, eerste lid, van de wet][ref5],

      d. de categorieën, bedoeld in [artikel 31 Wtv BES][ref6].

      2 Bij ministeriële regeling kunnen per categorie, bedoeld in het eerste lid, subcategorieën van gelijksoortige
      werkzaamheden of diensten worden vastgesteld en kunnen andere categorieën van gelijksoortige werkzaamheden of
      diensten worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0010334#Artikel3
