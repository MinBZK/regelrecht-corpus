  - number: '2'
    text: |-
      1 De vergoeding dient ter dekking van de kosten van de werkzaamheden of diensten die ingevolge het bepaalde bij of
      krachtens de [wet][ref1] of de [Wtv BES][ref2] door Onze Minister worden verricht.

      2 De vergoeding bestaat uit:

      a. een bedrag dat verband houdt met de eenmalig gemaakte uitvoeringskosten van het verrichten van werkzaamheden
      of diensten in het kader van de aan Onze Minister bij of krachtens de [wet][ref3] of de [Wtv BES][ref4] opgedragen
      taak; of

      b. een bedrag dat verband houdt met de kosten, anders dan die genoemd onder a, van het verrichten van werkzaamheden
      of diensten in het kader van de aan Onze Minister bij of krachtens de [wet][ref5] of de [Wtv BES][ref6] opgedragen
      taak; of

      c. een jaarlijkse bijdrage als bedoeld in [artikel 16.1, derde of vierde lid, van de wet][ref7].

      3 De bedragen, bedoeld in het tweede lid, worden voor de duur van een jaar of voor onbepaalde tijd vastgesteld.

      4 Het bedrag en de jaarlijkse bijdrage, bedoeld in het tweede lid, onder b en c, zijn jaarlijks verschuldigd en
      worden jaarlijks in rekening gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0009950
