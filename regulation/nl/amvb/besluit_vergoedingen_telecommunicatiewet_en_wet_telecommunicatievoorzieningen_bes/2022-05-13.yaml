        artikel: '16.1'
  - number: '3'
    text: |-
      1 Ter zake van de kosten, bedoeld in [artikel 2, eerste lid][ref1], gelden als uitgangspunten dat:

      a. de directe kosten rechtstreeks worden toegerekend aan categorieën van gelijksoortige werkzaamheden of diensten;

      b. de indirecte kosten worden toegerekend aan categorieën van gelijksoortige werkzaamheden of diensten naar rato
      van hun beslag op de onderscheiden werkzaamheden of diensten;

      c. deze kosten, voor zover het kosten op grond van de [wet][ref2] betreft op bedrijfseconomische wijze worden
      berekend door middel van een door Onze Minister toe te passen kostencalculatiemodel dat zodanig is ingericht
      dat daaruit op elk moment op eenduidige en inzichtelijke wijze de kosten van de desbetreffende categorieën van
      gelijksoortige werkzaamheden of diensten kunnen worden afgeleid.

      2 Onze Minister maakt het kostencalculatiemodel, bedoeld in het eerste lid, onderdeel c, bekend op een door hem te
      bepalen wijze.

      3 Voorzover de kosten bestaan uit afschrijvingskosten, worden deze kosten door middel van evenredige afschrijving
      op de aanschafwaarden van de investeringsgoederen per kalenderjaar geraamd op basis van de economische levensduur.

      4 Bij ministeriële regeling kan worden bepaald dat voor de toepassing van
      [artikel 2, tweede lid, onderdeel a][ref3], geen onderscheid wordt gemaakt tussen uitvoeringskosten voor het
      inwilligen van een aanvraag, uitvoeringskosten voor het geheel of gedeeltelijk afwijzen van een aanvraag of
      uitvoeringskosten die gemaakt zijn ter behandeling van een aanvraag die wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0010334#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0009950
      [ref3]: https://wetten.overheid.nl/BWBR0010334#Artikel2
