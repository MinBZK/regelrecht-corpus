    text: |-
      Onverminderd [artikel 2, eerste tot en met derde lid][ref1], kan in afwijking van de
      [artikelen 2, vierde lid][ref2], [3][ref3], [4][ref4] en [5][ref5], bij ministeriële regeling een vergoeding
      worden vastgesteld, voorzover noodzakelijk ter dekking van onvoorziene kosten van werkzaamheden of diensten als
      bedoeld in [artikel 2, eerste lid][ref6].


