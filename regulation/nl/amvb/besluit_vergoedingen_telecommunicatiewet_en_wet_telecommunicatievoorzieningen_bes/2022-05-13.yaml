articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

        - aanbieder: onderneming die openbare elektronische communicatiediensten, openbare elektronische
      communicatienetwerken of bijbehorende faciliteiten aanbiedt;
        - vergoeding: vergoeding, bedoeld in [artikel 16.1 van de wet][ref1] of [artikel 31 van de Wtv BES][ref2];
        - wet: [Telecommunicatiewet][ref3];
        - Wtv BES: [Wet telecommunicatievoorzieningen BES][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel16.1
      [ref2]: https://wetten.overheid.nl/BWBR0028469#Artikel31
      [ref3]: https://wetten.overheid.nl/BWBR0009950
      [ref4]: https://wetten.overheid.nl/BWBR0028469
