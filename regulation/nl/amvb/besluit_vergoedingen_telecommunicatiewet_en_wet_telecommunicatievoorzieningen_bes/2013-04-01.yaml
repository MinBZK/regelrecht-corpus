  - number: 5a
    text: |-
      1 Bij de vaststelling van de hoogte van de vergoeding ter zake van het toezicht door de Autoriteit Consument en
      Markt ten aanzien van openbare elektronische communicatiediensten, openbare elektronische communicatienetwerken en
      bijbehorende faciliteiten worden de volgende verdeelsleutels gebruikt:

      a. voor de vergoeding die verschuldigd is door aanbieders wier omzet meer bedraagt dan een bij ministeriële
      regeling te bepalen grensbedrag: de formule

      b. voor de vergoeding die verschuldigd is door aanbieders wier omzet ten hoogste het in onderdeel a bedoelde
      grensbedrag bedraagt: de formule

      waarbij

      A voorstelt: de omzet van de aanbieder wiens omzet meer bedraagt dan het grensbedrag;

      B voorstelt: het totaal van de omzetten A;

      C voorstelt: het bedrag dat wordt berekend door vermenigvuldiging van het aantal aanbieders waarvan de omzet ten
      hoogste het grensbedrag en ten minste een bij ministeriële regeling te bepalen minimum bedraagt, met de helft van
      de som van dit minimum en het grensbedrag;

      n voorstelt: het aantal aanbieders waarvan de omzet ten hoogste het grensbedrag en ten minste een bij ministeriële
      regeling te bepalen minimum bedraagt.

      2 De hoogte van de vergoeding wordt op nihil gesteld indien de aanbieder aan de Autoriteit Consument en Markt een
      onderbouwde opgave over zijn omzet heeft gedaan op grond waarvan naar het oordeel van de Autoriteit Consument en
      Markt aannemelijk is dat de omzet minder bedraagt dan het in het eerste lid bedoelde minimum.
    url: https://wetten.overheid.nl/BWBR0010334/2013-04-01#Artikel5a
  - number: 5b
    text: |-
      1 De berekening van de omzet geschiedt op de voet van het bepaalde in
      [artikel 377, zesde lid, van Boek 2 van het Burgerlijk Wetboek][ref1] voor de netto-omzet.

      2 Indien een aanbieder behoort tot een groep van ondernemingen als bedoeld in
      [artikel 24b van Boek 2 van het Burgerlijk Wetboek][ref2] worden voor de berekening van de omzet van die aanbieder
      de omzetten van alle tot die groep behorende ondernemingen opgeteld. Bij deze berekening worden transacties tussen
      de tot die groep behorende ondernemingen buiten beschouwing gelaten.

      3 Indien een aanbieder door de Autoriteit Consument en Markt is geregistreerd op grond van
      [artikel 2.1, vierde lid, van de wet][ref3] in verband met het verrichten van activiteiten die voorheen werden
      verricht door één of meer andere aanbieders waarvan de registratie is beëindigd, vindt de berekening van de omzet
      plaats met inachtneming van de omzet van die aanbieder of aanbieders overeenkomstig bij ministeriële regeling te
      stellen regels.

      4 Voor gevallen waarin berekening van de omzet niet mogelijk is omdat de desbetreffende activiteiten zijn verweven
      met andere activiteiten, kan bij ministeriële regeling worden bepaald dat bij de berekening nader vermelde
      opbrengsten geheel of gedeeltelijk buiten beschouwing kunnen blijven.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel377
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel24b
      [ref3]: https://wetten.overheid.nl/BWBR0009950#Artikel2.1
