    text: |-
      1 De vergoeding dient ter dekking van de kosten van de werkzaamheden of diensten die ingevolge het bepaalde bij of
      krachtens de [wet][ref1] door Onze Minister of de Autoriteit Consument en Markt worden verricht.

      2 De vergoeding bestaat uit:

      a. een bedrag dat verband houdt met de kosten van het verrichten van werkzaamheden of diensten in het kader van de
      aan Onze Minister of de Autoriteit Consument en Markt bij of krachtens de [wet][ref2] opgedragen uitvoeringstaak;
      of

      b. een bedrag dat verband houdt met de kosten van het verrichten van werkzaamheden of diensten in het kader van de
      aan Onze Minister of de Autoriteit Consument en Markt bij of krachtens de [wet][ref3] opgedragen toezichthoudende
      taak; of

      c. een jaarlijkse bijdrage als bedoeld in [artikel 16.1, vierde of vijfde lid, van de wet][ref4].

      3 De vergoeding wordt per kalenderjaar vastgesteld.

      4 Het bedrag, bedoeld in het tweede lid, onder a, wordt eenmaal in rekening gebracht.

      5 Het bedrag en de jaarlijkse bijdrage, bedoeld in het tweede lid, onder b en c, zijn per kalenderjaar verschuldigd
      en worden eens per kalenderjaar in rekening gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0009950
      [ref2]: https://wetten.overheid.nl/BWBR0009950
      [ref3]: https://wetten.overheid.nl/BWBR0009950
