  - number: '5'
    text: |-
      1 Bij ministeriële regeling wordt de hoogte van de vergoeding per categorie of per subcategorie van gelijksoortige
      werkzaamheden of diensten vastgesteld:

      a. op basis van de geraamde kosten die per categorie of per subcategorie zijn toegerekend als bedoeld in
      [artikel 4][ref1]; en

      b. naar rato van de verdeelsleutel die is bepaald in [artikel 5a, eerste lid][ref2], onderscheidenlijk naar rato
      van de verdeelsleutel die per categorie of per subcategorie wordt vastgesteld bij ministeriële regeling.

      2 Bij de regeling worden de bedragen en de jaarlijkse bijdrage, bedoeld in
      [artikel 2, tweede lid, onder a tot en met c][ref3], afzonderlijk vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0010334#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0010334#Artikel5a
      [ref3]: https://wetten.overheid.nl/BWBR0010334#Artikel2
