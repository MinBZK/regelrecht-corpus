  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Verkeer en Waterstaat van 18 november 1998, nr. HDTP/98/3612/CG,
    Hoofddirectie Telecommunicatie en Post;

    Gelet op hoofdstuk 3 en de artikelen 16.1, eerste, vierde en vijfde lid, en 20.17 van de Telecommunicatiewet,
    alsmede op artikel 13a, vierde lid, van de Postwet;

    De Raad van State gehoord (advies van 29 januari 1999, no.W09.98.0533);

    Gezien het nader rapport van de Staatssecretaris van Verkeer en Waterstaat van 8 maart 1999, nr. DGTP/99/233/CG,
    Directoraat-Generaal Telecommunicatie en Post;

    Hebben goedgevonden en verstaan:
