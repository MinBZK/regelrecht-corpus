  - number: 5c
    text: |-
      1 Bij de toepassing van de verdeelsleutels, bedoeld in [artikel 5a, eerste lid][ref1], wordt uitgegaan van de omzet
      die is gerealiseerd in het kalenderjaar dat twee jaar voorafgaat aan het kalenderjaar waarvoor de vergoeding wordt
      vastgesteld.

      2 Een aanbieder als bedoeld in [artikel 5a, eerste lid, onder a][ref2], verstrekt jaarlijks vóór
      1 september de Autoriteit Consument en Markt een opgave van de omzet die is gerealiseerd in het
      voorafgaande kalenderjaar, onder bijvoeging van een verklaring van een accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref3], dat de opgave voldoet aan het eerste lid en
      aan de [artikelen 5a][ref4] en [5b][ref5].

      3 De aanbieder kan voor de in het tweede lid bedoelde opgave volstaan met een opgave van de netto-omzet die
      op grond van [artikel 377, derde lid, onder a, van Boek 2 van het Burgerlijk Wetboek][ref6] is vermeld in de
      jaarrekening, onder bijvoeging van een kopie van de jaarrekening en van de accountantsverklaring, bedoeld in
      [artikel 393, vijfde lid, van Boek 2 van het Burgerlijk Wetboek][ref7].

      4 Op verzoek van de Autoriteit Consument en Markt verstrekt een aanbieder als bedoeld in
      [artikel 5a, eerste lid, onder b][ref8], een opgave van de omzet die is gerealiseerd in het voorafgaande
      kalenderjaar, onder bijvoeging van een verklaring als bedoeld in het tweede lid. Het derde lid is van
      overeenkomstige toepassing.

      5 Indien de aanbieder aan de in het tweede of vierde lid bedoelde verplichting niet tijdig heeft voldaan of
      een kennelijk onjuiste of onvolledige opgave heeft gedaan en dit verzuim niet heeft hersteld na daartoe door de
      Autoriteit Consument en Markt in de gelegenheid te zijn gesteld, kan de Autoriteit Consument en Markt een schatting
      doen van zijn omzet en op basis daarvan de vergoeding voor de aanbieder vaststellen.

      6 Bij ministeriële regeling kunnen nadere regels worden gesteld over de opgave van de omzet door de aanbieder en
      over de verklaring van de accountant.


