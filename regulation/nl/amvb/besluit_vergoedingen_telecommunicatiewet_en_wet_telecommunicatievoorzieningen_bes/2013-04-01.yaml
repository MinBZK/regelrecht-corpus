    text: |-
      Tenzij bij ministeriële regeling anders wordt bepaald, wordt de vergoeding door degene die de vergoeding is
      verschuldigd, bij vooruitbetaling voldaan.
    url: https://wetten.overheid.nl/BWBR0010334/2013-04-01#Artikel7
  - number: '10'
    text: |-
      1 Degene die de Autoriteit Consument en Markt verzoekt een geschil als bedoeld in [artikel 12.9 van de wet][ref1]
      te beslechten, is ter bestrijding van de kosten aan de Autoriteit Consument en Markt een vergoeding verschuldigd
      van € 133,00.

      2 De hoogte van de vergoeding, bedoeld in het eerste lid, kan bij ministeriële regeling worden gewijzigd voorzover
      de consumentenprijsindex daartoe aanleiding geeft.

      3 De Autoriteit Consument en Markt wijst de aanvrager, bedoeld in het eerste lid, op het verschuldigd zijn van het
      bedrag en deelt hem mee dat het verschuldigde bedrag binnen vier weken na de dagtekening van haar mededeling moet
      zijn betaald. Indien het bedrag niet binnen deze termijn is betaald, wordt de aanvraag niet in behandeling genomen,
      tenzij redelijkerwijs niet kan worden geoordeeld dat de aanvrager in verzuim is geweest.

      4 De [artikelen 2 tot en met 7][ref2] zijn niet van toepassing op de in dit artikel bedoelde vergoeding.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel12.9
      [ref2]: https://wetten.overheid.nl/BWBR0010334#Artikel2
