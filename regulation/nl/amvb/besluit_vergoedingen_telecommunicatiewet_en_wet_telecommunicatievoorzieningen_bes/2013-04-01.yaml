  - number: '3'
    text: |-
      1 Ter zake van de kosten, bedoeld in [artikel 2, eerste lid][ref1], gelden als uitgangspunten dat:

      a. deze kosten worden geraamd voor het kalenderjaar waarvoor de vergoeding geldt;

      b. de directe kosten rechtstreeks worden toegerekend aan categorieën van gelijksoortige werkzaamheden of diensten;

      c. de indirecte kosten worden toegerekend aan categorieën van gelijksoortige werkzaamheden of diensten naar rato
      van hun beslag op de onderscheiden werkzaamheden of diensten;

      d. deze kosten op bedrijfseconomische wijze worden berekend door middel van een door Onze Minister
      onderscheidenlijk de Autoriteit Consument en Markt toe te passen kostencalculatiemodel dat zodanig is ingericht
      dat daaruit op elk moment op eenduidige en inzichtelijke wijze de kosten van de desbetreffende categorieën van
      gelijksoortige werkzaamheden of diensten kunnen worden afgeleid.

      2 Onze Minister en de Autoriteit Consument en Markt maken het kostencalculatiemodel, bedoeld in het eerste lid,
      onder d, bekend op een door Onze Minister te bepalen wijze.

      3 Voorzover de kosten bestaan uit afschrijvingskosten, worden deze kosten door middel van evenredige afschrijving
      op de aanschafwaarden van de investeringsgoederen per kalenderjaar geraamd op basis van de economische levensduur.


      [ref1]: https://wetten.overheid.nl/BWBR0010334#Artikel2
    url: https://wetten.overheid.nl/BWBR0010334/2013-04-01#Artikel3
