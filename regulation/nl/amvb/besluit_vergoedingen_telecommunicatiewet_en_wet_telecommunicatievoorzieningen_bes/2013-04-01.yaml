  - number: '4'
    text: |-
      1 Categorieën als bedoeld in [artikel 3, eerste lid, onder b en c][ref1], zijn, voorzover het betreft werkzaamheden
      of diensten van Onze Minister, werkzaamheden of diensten met betrekking tot:

      a. het gebruik van frequentieruimte, bedoeld in [§ 3.3][ref2] en [§ 3.5 van de wet][ref3], voor:

      1°. vaste verbindingen,

      2°. mobiele communicatie,

      3°. mobiele openbare telefonie en semafonie,

      4°. radiodeterminatie,

      5°. radiozendamateurs,

      6°. omroep.

      b. randapparaten en radiozendapparaten en overige apparaten als bedoeld in [hoofdstuk 10 van de wet][ref4],

      c. de aanwijzing van certificatie-organisaties als bedoeld in [artikel 18.16, van de wet][ref5],

      d. de aanwijzing van instellingen als bedoeld in [artikel 18.17, tweede lid, van de wet][ref6].

      2 Categorieën als bedoeld in [artikel 3, eerste lid, onder b en c][ref7], zijn, voor zover het betreft
      werkzaamheden of diensten van de Autoriteit Consument en Markt, werkzaamheden of diensten met betrekking tot:

      a. nummers;

      b. diensten van certificatiedienstverleners;

      c. openbare elektronische communicatiediensten en openbare elektronische communicatienetwerken en bijbehorende
      faciliteiten.

      3 Bij ministeriële regeling kunnen per categorie, bedoeld in het eerste en tweede lid, subcategorieën van
      gelijksoortige werkzaamheden of diensten worden vastgesteld en kunnen andere categorieën van gelijksoortige
      werkzaamheden of diensten worden vastgesteld.


