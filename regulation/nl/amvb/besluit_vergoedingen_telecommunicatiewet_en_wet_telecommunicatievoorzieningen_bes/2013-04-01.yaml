articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. wet: [Telecommunicatiewet][ref1];

      b. vergoeding: vergoeding, bedoeld in [artikel 16.1 van de wet][ref2];

      c. aanbieder: onderneming die openbare elektronische communicatiediensten, openbare elektronische
      communicatienetwerken of bijbehorende faciliteiten aanbiedt;

      d. omzet: omzet die een aanbieder realiseert uit het in Nederland leveren van openbare elektronische
      communicatiediensten, openbare elektronische communicatienetwerken en bijbehorende faciliteiten en die wordt
      berekend overeenkomstig [artikel 5b][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0009950
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel16.1
      [ref3]: https://wetten.overheid.nl/BWBR0010334#Artikel5b
