  - number: '16'
    text: |-
      1 Indien de verplichtingen van een aanbieder die verbonden zijn aan een aanwijzing op grond van de
      [artikelen 6.4][ref1] of [7.2 van de wet][ref2] zoals die luidden voor de inwerkingtreding van de
      [Wet implementatie Europees regelgevingskader voor de elektronische communicatiesector 2002][ref3], gedurende het
      kalenderjaar maar vóór 15 november komen te vervallen als gevolg van de inwerkingtreding van besluiten als bedoeld
      in [artikel 19.4 van de wet][ref4], en indien de aanbieder voor dat jaar een vergoeding had betaald voor het
      toezicht op deze verplichtingen, vindt naar rato compensatie plaats voor de periode vanaf het tijdstip dat de aan
      de aanwijzing verbonden verplichtingen vervallen tot en met 31 december van het desbetreffende jaar.

      2 Indien de omstandigheden die zijn bedoeld in het eerste lid, zich voordoen en indien de Autoriteit Consument
      en Markt op grond van [artikel 6a.2, van de wet][ref5] een besluit neemt om verplichtingen op te leggen aan één
      of meer aanbieders met een aanmerkelijke marktmacht onderscheidenlijk om één of meer aanbieders aan te wijzen
      als aanbieder met een aanmerkelijke marktmacht, wordt bij ministeriële regeling een vergoeding vastgesteld voor
      de werkzaamheden of diensten die de Autoriteit Consument en Markt verricht in het kader van het toezicht ten
      aanzien van deze aanbieder of aanbieders, die slechts betrekking heeft op de periode vanaf het tijdstip van
      inwerkingtreding van de regeling tot en met 31 december van het desbetreffende jaar.

      3 De Autoriteit Consument en Markt stelt ten aanzien van de in het eerste lid bedoelde aanbieder het bedrag van de
      compensatie vast. Indien de aanbieder op grond van het tweede lid een vergoeding is verschuldigd, kan de Autoriteit
      Consument en Markt het compensatiebedrag verrekenen met deze vergoeding.


