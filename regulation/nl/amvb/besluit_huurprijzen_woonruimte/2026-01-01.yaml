    text: |-
      1 Bij de beoordeling van de redelijkheid van de in rekening te brengen huurprijs ingevolge
      [artikel 12, eerste lid][ref1], of [artikel 16, eerste lid, van de Uitvoeringswet huurprijzen woonruimte][ref2]
      neemt de huurcommissie in aanmerking of zich met betrekking tot de woonruimte een of meer van de omstandigheden,
      bedoeld in [bijlage II][ref3] van dit besluit, voordoen. Daarbij wordt door de huurcommissie ten laagste als de in
      rekening te brengen huurprijs die zij redelijk acht, vermeld:

      a. indien zich een omstandigheid voordoet als bedoeld in [bijlage II, onder 1, categorie A][ref4], van dit besluit:
      20% van de overeengekomen huurprijs;

      b. indien zich een omstandigheid voordoet als bedoeld in [bijlage II, onder 1, categorie B][ref5], van dit besluit:
      30% van de overeengekomen huurprijs;

      c. indien zich een omstandigheid voordoet als bedoeld in [bijlage II, onder 1, categorie C][ref6], van dit besluit:
      40% van de overeengekomen huurprijs.

      2 Teneinde huurder en verhuurder inzicht te bieden in het beleid van de huurcommissie inzake de in het eerste lid
      bedoelde categorieën en de daarbij behorende verlaging van de in rekening te brengen huurprijs die de huurcommissie
      doorgaans redelijk zal achten, stellen het bestuur en de zittingsvoorzitters op basis van door hen geformuleerde
      regels een geschrift op, genaamd gebrekenboek. Het gebrekenboek is openbaar en ligt bij de huurcommissie ter
      inzage.

      3 In het gebrekenboek, bedoeld in het tweede lid, wordt voor ieder van de in
      [bijlage II, onder 1, categorieën A, B en C][ref7], van dit besluit bedoelde omstandigheden aangegeven welke de
      door de huurcommissie ten laagste uit te spreken in rekening te brengen huurprijs zal zijn.

      4 Indien de huurcommissie de in [bijlage II, onder 1][ref8], van dit besluit beschreven categorieën heeft
      onderverdeeld naar de mate van de ernst waarin de bewoonbaarheid naar haar oordeel wordt geschaad, is het derde lid
      op die onderverdeling van overeenkomstige toepassing.

      5 Indien zich tegelijkertijd twee of meer omstandigheden voordoen als bedoeld in
      [bijlage II, onder 1, categorieën A, B en C][ref9], van dit besluit wordt voor de toepassing van het eerste
      lid door de huurcommissie ten laagste als de in rekening te brengen huurprijs die zij redelijk acht, vermeld de
      huurprijs, behorend bij de omstandigheid waarvan door het bestuur en de zittingsvoorzitters in het gebrekenboek de
      laagste in rekening te brengen huurprijs is aangegeven.


