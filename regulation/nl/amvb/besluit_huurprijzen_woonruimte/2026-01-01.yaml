articles:
  - number: '1'
    text: |-
      1 In dit besluit wordt onder de zittingsvoorzitters verstaan: de zittingsvoorzitters, bedoeld in
      [artikel 3a, tweede lid, van de Uitvoeringswet huurprijzen woonruimte][ref1].

      2 Onder een woonruimte welke een zelfstandige woning vormt, wordt een woonruimte verstaan als bedoeld in
      [artikel 7:234 van het Burgerlijk Wetboek][ref2], welke wordt bewoond door maximaal twee personen of welke wordt
      bewoond door drie of meer personen die een duurzame gemeenschappelijke huishouding hebben. Onder woonruimte welke
      een zelfstandige woning vormt, wordt in dit besluit niet mede begrepen een woonwagen of een combinatie van een
      standplaats en een woonwagen.

      3 Onder woonruimte welke niet een zelfstandige woning vormt, wordt in dit besluit niet mede begrepen een
      standplaats.

      4 Wanneer een huurder van een woonruimte, zijnde één of twee personen of meer personen, die een duurzame
      gemeenschappelijke huishouding hebben een deel van die woonruimte onderverhuurt aan één ander huishouden, geldt in
      afwijking van het tweede lid, dat het gedeelte dat de hoofdhuurder bewoont een zelfstandige woning blijft vormen,
      indien:

      a. de gehele woning gedurende een aaneengesloten periode van twee jaar, voorafgaand aan de onderverhuring, slechts
      door het eerst genoemde huishouden is bewoond; en,

      b. het inwonende huishouden een huurovereenkomst heeft voor het gehuurde met de hoofdhuurder.


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel3a
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel234
