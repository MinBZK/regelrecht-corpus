  - number: '2'
    text: |-
      1 Het bedrag, bedoeld in [artikel 3, tweede lid, van de Uitvoeringswet huurprijzen woonruimte][ref1], is de in
      de ministeriële regeling, bedoeld in [artikel 12, eerste lid][ref2], genoemde huurprijsgrens, behorende bij de
      kwaliteit voor een woonruimte met 186 punten.

      2 Een woonruimte met een waardering die bij aanvang van de huurovereenkomst boven de grens ligt, bedoeld in het
      eerste lid, komt tot beëindiging van de huurovereenkomst, niet door een mindering van punten voor de WOZ-waarde
      onder de grens, bedoeld in het eerste lid, te vallen.


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003237#Artikel12
