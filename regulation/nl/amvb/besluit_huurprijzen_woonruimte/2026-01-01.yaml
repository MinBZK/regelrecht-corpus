  - number: '4'
    text: |-
      1 Het bedrag van de bij wijze van voorschot aan de Staat verschuldigde vergoeding, bedoeld in
      [artikel 7, eerste lid, van de Uitvoeringswet huurprijzen woonruimte][ref1], en het bedrag van de vergoeding,
      bedoeld in dat lid, wordt vastgesteld op:

      a. indien de verzoeker dan wel de partij die niet de verzoeker is een huurder is: € 25,

      dan wel

      b. indien de verzoeker dan wel de partij die niet de verzoeker is een verhuurder is: € 500.

      2 Indien de huurcommissie in drie achtereenvolgende kalenderjaren onderscheidenlijk tweemaal, driemaal of viermaal
      of meer op een verzoek uitspraak heeft gedaan en daarbij, gelet op de strekking van het verzoekschrift, heeft
      geoordeeld dat de verhuurder de in het ongelijk gestelde partij is, wordt in het eerste lid, onderdeel b, voor
      € 500 onderscheidenlijk € 700, € 1.400, en € 1.750 gelezen.

      3 Het bedrag van de aan de Staat verschuldigde vergoeding, bedoeld in
      [artikel 7a, eerste lid, van de Uitvoeringswet huurprijzen woonruimte][ref2], wordt vastgesteld op € 100.


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0014315#Artikel7a
