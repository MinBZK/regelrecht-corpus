  - number: '5'
    text: |-
      1 De in [artikel 10, eerste lid, van de Uitvoeringswet huurprijzen woonruimte][ref1] bedoelde waardering van de
      kwaliteit van woonruimte vindt plaats:

      a. voor woonruimte, welke een zelfstandige woning vormt, overeenkomstig het in [bijlage I][ref2], onder A, van dit
      besluit vervatte waarderingsstelsel en de daarbij gegeven toelichting;

      b. voor een woonruimte, welke niet een zelfstandige woning vormt, overeenkomstig het in [bijlage I][ref3], onder B,
      van dit besluit vervatte waarderingsstelsel en de daarbij gegeven toelichting en de bij bijlage I, onder A, gegeven
      toelichting voor zover deze mede op bijlage I, onder B, van toepassing is;

      c. voor een woonwagen of een standplaats overeenkomstig het in [bijlage I][ref4], onder C, van dit besluit vervatte
      waarderingsstelsel en de daarbij gegeven toelichting.

      2 De huurcommissie, het college van burgemeester en wethouders en de rechter kan, indien de aard van de woonruimte
      daartoe aanleiding geeft, de kwaliteit van woonruimte beoordelen in afwijking van het in het eerste lid bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel10
