  - number: 8a
    text: |-
      1 De maximale huurprijsgrens wordt met 35% vermeerderd indien de woonruimte bestaat uit of deel uitmaakt van
      een rijksmonument als bedoeld in [artikel 1.1 van de Erfgoedwet][ref1] en de huurovereenkomst betreffende die
      woonruimte is afgesloten na het tijdstip van inwerkingtreding van de [Wet betaalbare huur][ref2].

      2 Indien de woonruimte bestaat uit of deel uitmaakt van een rijksmonument als bedoeld in
      [artikel 1.1 van de Erfgoedwet][ref3] en de huurovereenkomst betreffende die woonruimte is afgesloten voor het
      tijdstip van inwerkingtreding van de [Wet betaalbare huur][ref4], wordt de waardering voor een zelfstandige
      woonruimte in [bijlage I][ref5], onder A, met 50 punten vermeerderd en de waardering voor een onzelfstandige
      woonruimte in bijlage I, onder B, met 10 punten vermeerderd.

      3 De maximale huurprijsgrens wordt met 15% vermeerderd indien de woonruimte bestaat uit of deel uitmaakt van een
      door het college van burgemeester en wethouders aangewezen gemeentelijk monument of een door gedeputeerde staten
      aangewezen provinciaal monument.

      4 De maximale huurprijsgrens, behorende bij de kwaliteit van een middeldure huurwoonruimte als bedoeld in
      [artikel 1 van de Huisvestingswet 2014][ref6], wordt met 10% vermeerderd indien die woonruimte na 1 juli 2024 voor
      het eerst in gebruik wordt genomen als woonruimte en de bouw van deze woonruimte, of de verbouw van een ruimte
      met een andere gebruiksfunctie dan een woonfunctie naar een woonruimte met een woonfunctie, voor 1 januari 2028 is
      gestart. De vermeerdering geldt voor twintig jaar vanaf de dag van ingebruikname.

      5 De maximale huurprijsgrens wordt met 5% vermeerderd indien:

      a. die woonruimte behoort tot een rijksbeschermd stads- of dorpsgezicht als bedoeld in
      [artikel 2.34, vierde lid, van de Omgevingswet][ref7],

      b. de woonruimte behoort tot een woning die is gebouwd voor 1965; en

      c. de woonruimte niet bestaat of deel uitmaakt van een rijksmonument als bedoeld in
      [artikel 1.1 van de Erfgoedwet][ref8] of van een door het college van burgemeester en wethouders aangewezen
      gemeentelijk monument of een door gedeputeerde staten aangewezen provinciaal monument.

      6 Voor het bepalen of een woonruimte onder de in [artikel 7:247 van het Burgerlijk Wetboek][ref9] genoemde grens
      valt, wordt gerekend met de huurprijsgrens die geldt voor de woonruimte voordat de huurprijsvermeerdering, bedoeld
      in het eerste, derde, vierde of vijfde lid is toegepast.

      7 De vermeerdering, bedoeld in het eerste, derde, vierde of vijfde lid, wordt toegepast op de krachtens
      [artikel 10, eerste lid, van de Uitvoeringswet huurprijzen woonruimte][ref10] geldende maximale huurprijsgrens.


