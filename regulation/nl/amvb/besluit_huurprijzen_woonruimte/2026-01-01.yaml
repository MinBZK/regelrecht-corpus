    text: |-
      1 Bij ministeriële regeling worden de maximale huurprijsgrenzen vastgesteld.

      2 Bij ministeriële regeling worden elk jaar op 1 januari de op 31 december daaraan
      voorafgaande krachtens dit besluit geldende maximale huurprijsgrenzen gewijzigd overeenkomstig
      [artikel 27, eerste lid, van de Wet op de huurtoeslag][ref1], met dien verstande dat de op basis daarvan berekende
      bedragen naar boven worden afgerond op hele eurocenten.


