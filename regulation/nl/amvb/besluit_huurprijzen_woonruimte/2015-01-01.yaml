---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_huurprijzen_woonruimte
regulatory_layer: AMVB
publication_date: '2006-11-02'
valid_from: '2015-01-01'
bwb_id: BWBR0003237
url: https://wetten.overheid.nl/BWBR0003237/2015-01-01
preamble:
  text: |-
    Wij Juliana, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Op de voordracht van de Staatssecretaris van Volkshuisvesting en Ruimtelijke Ordening, drs. M.P.A. van Dam, van 7
    september 1977, nr. 0902932, Centrale Afdeling Juridische Zaken;

    Gelet op de artikelen 7, eerste lid, 9, eerste lid, 10, vierde lid, 15, eerste en tweede lid, en 18, vierde lid,
    van de Huurprijzenwet woonruimte (Wet van 18 januari 1979, Stb. 1979, 15);

    De Raad van State gehoord, advies van 22 november 1978, nr. 13;

    Gezien het nader rapport van de Staatssecretaris van Volkshuisvesting en Ruimtelijke Ordening van 12 april 1979,
    nr. 0221927, Centrale Afdeling Juridische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0003237/2015-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In dit besluit wordt onder het bestuur en de zittingsvoorzitters verstaan: het bestuur en de zittingsvoorzitters,
      bedoeld in [artikel 3a, tweede lid, van de Uitvoeringswet huurprijzen woonruimte][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel3a
    url: https://wetten.overheid.nl/BWBR0003237/2015-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0014315
        artikel: 3a
  - number: '1.2'
    text: |-
      Onder woonruimte welke een zelfstandige woning vormt, wordt in dit besluit niet mede begrepen een woonwagen of een
      combinatie van een standplaats en een woonwagen.
    url: https://wetten.overheid.nl/BWBR0003237/2015-01-01#Artikel1
  - number: '1.3'
    text: Onder woonruimte welke niet een zelfstandige woning vormt, wordt in dit besluit niet mede begrepen een standplaats.
    url: https://wetten.overheid.nl/BWBR0003237/2015-01-01#Artikel1
  - number: '2'
    text: |-
      Het bedrag, bedoeld in [artikel 3, tweede lid, van de Uitvoeringswet huurprijzen woonruimte][ref1], is gelijk aan
      het bedrag, bedoeld in [artikel 13, eerste lid, onder a, van de Wet op de huurtoeslag][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0008659#Artikel13
    url: https://wetten.overheid.nl/BWBR0003237/2015-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0014315
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0008659
        artikel: '13'
  - number: '4.1'
    text: |-
      Het bedrag van de bij wijze van voorschot aan de Staat verschuldigde vergoeding, bedoeld in
      [artikel 7, eerste lid, van de Uitvoeringswet huurprijzen woonruimte][ref1], en het bedrag van de vergoeding,
      bedoeld in dat lid, wordt vastgesteld op:


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel7
    url: https://wetten.overheid.nl/BWBR0003237/2015-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0014315
        artikel: '7'
  - number: 4.1.a
    text: 'indien de verzoeker dan wel de partij die niet de verzoeker is een huurder is: € 25,'
    url: https://wetten.overheid.nl/BWBR0003237/2015-01-01#Artikel4
  - number: 4.1.b
    text: 'indien de verzoeker dan wel de partij die niet de verzoeker is een verhuurder is: € 450, dan wel'
    url: https://wetten.overheid.nl/BWBR0003237/2015-01-01#Artikel4
  - number: 4.1.c
    text: |-
      indien de verzoeker dan wel de partij die niet de verzoeker is een verhuurder is die op basis van de krachtens
      [artikel 7, eerste lid, van de Uitvoeringswet huurprijzen woonruimte][ref1] verstrekte gegevens, aantoont dat hij
      een natuurlijke persoon is: € 25.


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel7
    url: https://wetten.overheid.nl/BWBR0003237/2015-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0014315
        artikel: '7'
  - number: '4.2'
    text: |-
      Het bedrag van de aan de Staat verschuldigde vergoeding, bedoeld in
      [artikel 7a, eerste lid, van de Uitvoeringswet huurprijzen woonruimte][ref1], wordt vastgesteld op € 100.


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel7a
    url: https://wetten.overheid.nl/BWBR0003237/2015-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0014315
        artikel: 7a
  - number: 4a
    text: |-
      Het bedrag van de aan de Staat verschuldigde vergoeding, bedoeld in
      [artikel 8 van de Uitvoeringswet huurprijzen woonruimte][ref1], wordt vastgesteld op:


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel8
    url: https://wetten.overheid.nl/BWBR0003237/2015-01-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0014315
        artikel: '8'
  - number: 4a.a
    text: 'indien de verzoeker dan wel de partij die niet de verzoeker is een huurder is: € 25,'
    url: https://wetten.overheid.nl/BWBR0003237/2015-01-01#Artikel4a
  - number: 4a.b
    text: 'indien de verzoeker dan wel de partij die niet de verzoeker is een verhuurder is: € 450, dan wel'
    url: https://wetten.overheid.nl/BWBR0003237/2015-01-01#Artikel4a
  - number: 4a.c
    text: |-
      indien de verzoeker dan wel de partij die niet de verzoeker is een verhuurder is die op basis van de krachtens
      [artikel 8 van de Uitvoeringswet huurprijzen woonruimte][ref1] verstrekte gegevens, aantoont dat hij een
      natuurlijke persoon is: € 25.


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel8
    url: https://wetten.overheid.nl/BWBR0003237/2015-01-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0014315
        artikel: '8'
  - number: '5.1'
    text: |-
      De in [artikel 10, eerste lid, van de Uitvoeringswet huurprijzen woonruimte][ref1] bedoelde waardering van de
      kwaliteit van woonruimte vindt plaats:


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel10
    url: https://wetten.overheid.nl/BWBR0003237/2015-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0014315
        artikel: '10'
  - number: 5.1.a
    text: |-
      voor woonruimte, welke een zelfstandige woning vormt, overeenkomstig het in [bijlage I, onder A][ref1], van dit
      besluit vervatte waarderingsstelsel en de daarbij gegeven toelichting.


      [ref1]: https://wetten.overheid.nl/BWBR0003237
    url: https://wetten.overheid.nl/BWBR0003237/2015-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003237
  - number: 5.1.b
    text: |-
      voor een woonwagen of een standplaats overeenkomstig het in [bijlage I, onder C][ref1], van dit besluit vervatte
      waarderingsstelsel en de daarbij gegeven toelichting;


      [ref1]: https://wetten.overheid.nl/BWBR0003237
    url: https://wetten.overheid.nl/BWBR0003237/2015-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003237
  - number: 5.1.c
    text: |-
      voor woonruimte, welke niet een zelfstandige woning vormt, overeenkomstig het in [bijlage I, onder B][ref1], van
      dit besluit vervatte waarderingsstelsel en de bij [bijlage I, onder A][ref2], gegeven toelichting voorzover deze
      mede op [bijlage I, onder B][ref3], van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0003237
      [ref2]: https://wetten.overheid.nl/BWBR0003237
      [ref3]: https://wetten.overheid.nl/BWBR0003237
    url: https://wetten.overheid.nl/BWBR0003237/2015-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003237
      - id: ref2
        bwb_id: BWBR0003237
      - id: ref3
        bwb_id: BWBR0003237
  - number: '5.2'
    text: |-
      De huurcommissie kan, indien de aard van de woonruimte daartoe aanleiding geeft, de kwaliteit van woonruimte
      beoordelen in afwijking van het in het eerste lid bepaalde.
    url: https://wetten.overheid.nl/BWBR0003237/2015-01-01#Artikel5
  - number: '6.1'
    text: |-
      Bij de beoordeling van de redelijkheid van de in rekening te brengen huurprijs ingevolge
      [artikel 12, eerste lid][ref1], of [artikel 16, eerste lid, van de Uitvoeringswet huurprijzen woonruimte][ref2]
      neemt de huurcommissie in aanmerking of zich met betrekking tot de woonruimte een of meer van de omstandigheden,
      bedoeld in [bijlage II][ref3] van dit besluit, voordoen. Daarbij wordt door de huurcommissie ten laagste als de in
      rekening te brengen huurprijs die zij redelijk acht, vermeld:


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0014315#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0003237
    url: https://wetten.overheid.nl/BWBR0003237/2015-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0014315
        artikel: '12'
      - id: ref2
        bwb_id: BWBR0014315
        artikel: '16'
      - id: ref3
        bwb_id: BWBR0003237
  - number: 6.1.a
    text: |-
      indien zich een omstandigheid voordoet als bedoeld in [bijlage II, onder 1, categorie A][ref1], van dit besluit:
      20% van de overeengekomen huurprijs;


      [ref1]: https://wetten.overheid.nl/BWBR0003237
    url: https://wetten.overheid.nl/BWBR0003237/2015-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0003237
  - number: 6.1.b
    text: |-
      indien zich een omstandigheid voordoet als bedoeld in [bijlage II, onder 1, categorie B][ref1], van dit besluit:
      30% van de overeengekomen huurprijs;


      [ref1]: https://wetten.overheid.nl/BWBR0003237
    url: https://wetten.overheid.nl/BWBR0003237/2015-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0003237
  - number: 6.1.c
    text: |-
      indien zich een omstandigheid voordoet als bedoeld in [bijlage II, onder 1, categorie C][ref1], van dit besluit:
      40% van de overeengekomen huurprijs.


      [ref1]: https://wetten.overheid.nl/BWBR0003237
    url: https://wetten.overheid.nl/BWBR0003237/2015-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0003237
  - number: '6.2'
    text: |-
      Teneinde huurder en verhuurder inzicht te bieden in het beleid van de huurcommissie inzake de in het eerste lid
      bedoelde categorieën en de daarbij behorende verlaging van de in rekening te brengen huurprijs die de huurcommissie
      doorgaans redelijk zal achten, stellen het bestuur en de zittingsvoorzitters op basis van door hen geformuleerde
      regels een geschrift op, genaamd gebrekenboek. Het gebrekenboek is openbaar en ligt bij de huurcommissie ter
      inzage.
    url: https://wetten.overheid.nl/BWBR0003237/2015-01-01#Artikel6
  - number: '6.3'
    text: |-
      In het gebrekenboek, bedoeld in het tweede lid, wordt voor ieder van de in
      [bijlage II, onder 1, categorieën A, B en C][ref1], van dit besluit bedoelde omstandigheden aangegeven welke de
      door de huurcommissie ten laagste uit te spreken in rekening te brengen huurprijs zal zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0003237
    url: https://wetten.overheid.nl/BWBR0003237/2015-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0003237
  - number: '6.4'
    text: |-
      Indien de huurcommissie de in [bijlage II, onder 1][ref1], van dit besluit beschreven categorieën heeft
      onderverdeeld naar de mate van de ernst waarin de bewoonbaarheid naar haar oordeel wordt geschaad, is het derde lid
      op die onderverdeling van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003237
    url: https://wetten.overheid.nl/BWBR0003237/2015-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0003237
  - number: '6.5'
    text: |-
      Indien zich tegelijkertijd twee of meer omstandigheden voordoen als bedoeld in
      [bijlage II, onder 1, categorieën A, B en C][ref1], van dit besluit wordt voor de toepassing van het eerste
      lid door de huurcommissie ten laagste als de in rekening te brengen huurprijs die zij redelijk acht, vermeld de
      huurprijs, behorend bij de omstandigheid waarvan door het bestuur en de zittingsvoorzitters in het gebrekenboek de
      laagste in rekening te brengen huurprijs is aangegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0003237
    url: https://wetten.overheid.nl/BWBR0003237/2015-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0003237
  - number: 8a
    text: |-
      De huurprijs van een woonruimte wordt vermeerderd met 15% van de maximale huurprijsgrens, behorende bij de
      kwaliteit van die woonruimte, indien:
    url: https://wetten.overheid.nl/BWBR0003237/2015-01-01#Artikel8a
  - number: 8a.a
    text: |-
      deze behoort tot een beschermd stads- en dorpsgezicht als bedoeld in
      [artikel 1, onder g, van de Monumentenwet 1988][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel1
    url: https://wetten.overheid.nl/BWBR0003237/2015-01-01#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0004471
        artikel: '1'
  - number: 8a.b
    text: |-
      deze niet bestaat uit of deel uitmaakt van een beschermd monument als bedoeld in
      [artikel 1, onder d, van die wet][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel1
    url: https://wetten.overheid.nl/BWBR0003237/2015-01-01#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0004471
        artikel: '1'
  - number: 8a.c
    text: deze is gebouwd voor 1945 en
    url: https://wetten.overheid.nl/BWBR0003237/2015-01-01#Artikel8a
  - number: 8a.d
    text: |-
      door de verhuurder noodzakelijkerwijs gelden zijn besteed voor de instandhouding van de monumentale waarde van
      die woonruimte.
    url: https://wetten.overheid.nl/BWBR0003237/2015-01-01#Artikel8a
  - number: '12.1'
    text: Bij ministeriële regeling worden de maximale huurprijsgrenzen vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003237/2015-01-01#Artikel12
  - number: '12.2'
    text: |-
      Bij ministeriële regeling worden elk jaar op 1 juli de op 30 juni daaraan voorafgaande krachtens dit besluit
      geldende maximale huurprijsgrenzen geïndexeerd met het inflatiepercentage, met dien verstande dat de op basis
      daarvan berekende bedragen naar boven worden afgerond op hele eurocenten.
    url: https://wetten.overheid.nl/BWBR0003237/2015-01-01#Artikel12
  - number: '13'
    text: Bij ministeriële regeling kunnen nadere voorschriften worden gegeven omtrent de uitvoering van dit besluit.
    url: https://wetten.overheid.nl/BWBR0003237/2015-01-01#Artikel13
  - number: '14.1'
    text: Dit besluit kan worden aangehaald als Besluit huurprijzen woonruimte.
    url: https://wetten.overheid.nl/BWBR0003237/2015-01-01#Artikel14
  - number: '14.2'
    text: Het treedt in werking op een door Ons te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0003237/2015-01-01#Artikel14
