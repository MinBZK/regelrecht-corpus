  - number: '12'
    text: |-
      1 Bij ministeriële regeling worden de maximale huurprijsgrenzen vastgesteld.

      2 Bij ministeriële regeling worden elk jaar op 1 juli de op 30 juni daaraan voorafgaande krachtens dit besluit
      geldende maximale huurprijsgrenzen geïndexeerd met het inflatiepercentage, met dien verstande dat de op basis
      daarvan berekende bedragen naar boven worden afgerond op hele eurocenten.
    url: https://wetten.overheid.nl/BWBR0003237/2021-07-01#Artikel12
  - number: '13'
    text: Bij ministeriële regeling kunnen nadere voorschriften worden gegeven omtrent de uitvoering van dit besluit.
    url: https://wetten.overheid.nl/BWBR0003237/2021-07-01#Artikel13
  - number: '14'
    text: |-
      1 Dit besluit kan worden aangehaald als Besluit huurprijzen woonruimte.

      2 Het treedt in werking op een door Ons te bepalen tijdstip.
