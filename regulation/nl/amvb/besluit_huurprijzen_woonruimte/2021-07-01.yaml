  - number: 8a
    text: |-
      De maximale huurprijsgrens, behorende bij de kwaliteit van een woonruimte, wordt met 15% vermeerderd, indien:

      a. die woonruimte behoort tot een beschermd stads- en dorpsgezicht als bedoeld in
      [artikel 1, onder g, van de Monumentenwet 1988][ref1],

      b. die woonruimte niet bestaat uit of deel uitmaakt van een rijksmonument als bedoeld in
      [artikel 1.1 van de Erfgoedwet][ref2],

      c. die woonruimte is gebouwd voor 1945, en

      d. door de verhuurder noodzakelijkerwijs gelden zijn besteed voor de instandhouding van de monumentale waarde van
      die woonruimte.


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0037521#Artikel1.1
    url: https://wetten.overheid.nl/BWBR0003237/2021-07-01#Artikel8a
