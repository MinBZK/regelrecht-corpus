    Wij Juliana, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Op de voordracht van de Staatssecretaris van Volkshuisvesting en Ruimtelijke Ordening, drs. M.P.A. van Dam, van 7
    september 1977, nr. 0902932, Centrale Afdeling Juridische Zaken;

    Gelet op de artikelen 7, eerste lid, 9, eerste lid, 10, vierde lid, 15, eerste en tweede lid, en 18, vierde lid,
    van de Huurprijzenwet woonruimte (Wet van 18 januari 1979, Stb. 1979, 15);

