articles:
  - number: '1'
    text: |-
      1 In dit besluit wordt onder de zittingsvoorzitters verstaan: de zittingsvoorzitters, bedoeld in
      [artikel 3a, tweede lid, van de Uitvoeringswet huurprijzen woonruimte][ref1].

      2 Onder woonruimte welke een zelfstandige woning vormt, wordt in dit besluit niet mede begrepen een woonwagen of
      een combinatie van een standplaats en een woonwagen.

      3 Onder woonruimte welke niet een zelfstandige woning vormt, wordt in dit besluit niet mede begrepen een
      standplaats.


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel3a
