        artikel: '8'
  - number: '5'
    text: |-
      1 De in [artikel 10, eerste lid, van de Uitvoeringswet huurprijzen woonruimte][ref1] bedoelde waardering van de
      kwaliteit van woonruimte vindt plaats:

      a. voor woonruimte, welke een zelfstandige woning vormt, overeenkomstig het in [bijlage I, onder A][ref2], van dit
      besluit vervatte waarderingsstelsel en de daarbij gegeven toelichting.

      b. voor een woonwagen of een standplaats overeenkomstig het in [bijlage I, onder C][ref3], van dit besluit vervatte
      waarderingsstelsel en de daarbij gegeven toelichting;

      c. voor woonruimte, welke niet een zelfstandige woning vormt, overeenkomstig het in [bijlage I, onder B][ref4], van
      dit besluit vervatte waarderingsstelsel en de bij [bijlage I, onder A][ref5], gegeven toelichting voorzover deze
      mede op [bijlage I, onder B][ref6], van toepassing is.

      2 De huurcommissie kan, indien de aard van de woonruimte daartoe aanleiding geeft, de kwaliteit van woonruimte
      beoordelen in afwijking van het in het eerste lid bepaalde.


