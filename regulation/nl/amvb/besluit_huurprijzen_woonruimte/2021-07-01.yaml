  - number: '4'
    text: |-
      1 Het bedrag van de bij wijze van voorschot aan de Staat verschuldigde vergoeding, bedoeld in
      [artikel 7, eerste lid, van de Uitvoeringswet huurprijzen woonruimte][ref1], en het bedrag van de vergoeding,
      bedoeld in dat lid, wordt vastgesteld op:

      a. indien de verzoeker dan wel de partij die niet de verzoeker is een huurder is: € 25,

      dan wel

      b. indien de verzoeker dan wel de partij die niet de verzoeker is een verhuurder is: € 300.

      2 Indien de huurcommissie in drie achtereenvolgende kalenderjaren tweemaal onderscheidenlijk driemaal of meer op
      een verzoek als bedoeld in de [artikelen 7: 249][ref2] en [7: 258, derde lid, van het Burgerlijk Wetboek][ref3]
      uitspraak heeft gedaan en daarbij, gelet op de strekking van het verzoekschrift, heeft geoordeeld dat de
      verhuurder de in het ongelijk gestelde partij is, wordt in het eerste lid, onderdeel b, voor € 300 gelezen € 700
      onderscheidenlijk € 1.400.

      3 Het bedrag van de aan de Staat verschuldigde vergoeding, bedoeld in
      [artikel 7a, eerste lid, van de Uitvoeringswet huurprijzen woonruimte][ref4], wordt vastgesteld op € 100.


