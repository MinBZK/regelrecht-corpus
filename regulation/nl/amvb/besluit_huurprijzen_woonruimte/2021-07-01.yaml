  - number: '2'
    text: |-
      Het bedrag, bedoeld in [artikel 3, tweede lid, van de Uitvoeringswet huurprijzen woonruimte][ref1], is gelijk aan
      het bedrag, bedoeld in [artikel 13, eerste lid, onder a, van de Wet op de huurtoeslag][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel3
