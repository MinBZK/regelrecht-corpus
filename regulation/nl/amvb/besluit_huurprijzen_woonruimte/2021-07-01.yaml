  - number: 4a
    text: |-
      Het bedrag van de aan de Staat verschuldigde vergoeding, bedoeld in
      [artikel 8 van de Uitvoeringswet huurprijzen woonruimte][ref1], wordt vastgesteld op:

      a. indien de verzoeker dan wel de partij die niet de verzoeker is een huurder is: € 25,

      dan wel

      b. indien de verzoeker dan wel de partij die niet de verzoeker is een verhuurder is: € 300.


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel8
    url: https://wetten.overheid.nl/BWBR0003237/2021-07-01#Artikel4a
