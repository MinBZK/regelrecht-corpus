  - number: '4'
    text: |-
      1 Een hygiënecode wordt op initiatief van de opstellers ervan:

      a. besproken in het Regulier Overleg Warenwet; en

      b. vervolgens ter goedkeuring voorgelegd aan Onze Minister.

      2 Onze Minister keurt een hygiënecode goed indien die hygiënecode:

      a. is opgesteld in overeenstemming met artikel 8, eerste lid, onder b, van verordening EG) 852/2004;

      b. bruikbaar is voor de sector waarop die code betrekking heeft;

      c. waar mogelijk en zinvol ter verificatie van de procesbeheersing is voorzien van microbiologische richtwaarden,
      gerelateerd aan de kritische controlepunten, bedoeld in artikel 5, tweede lid, van [verordening (EG) 852/2004]
      (32004R0852); en

      d. als leidraad kan dienen voor de naleving van artikel 3, artikel 4, of artikel 5, van [verordening (EG) 852/2004]
      (32004R0852) in de betrokken sector of voor de betrokken levensmiddelen.

      3 In afwijking van het tweede lid keurt Onze Minister van Economische Zaken, Landbouw en Innovatie een hygiënecode
      goed die:

      a. betrekking heeft op de primaire productie en de in bijlage I van [verordening (EG) 852/2004](32004R0852)
      bedoelde, daarmee verband houdende bewerkingen;

      b. is opgesteld in overeenstemming met artikel 8, eerste lid, onder c, van [verordening (EG) 852/2004](32004R0852);

      c. bruikbaar is voor de sector waarop die code betrekking heeft; en

      d. als leidraad kan dienen voor de naleving van artikel 3, artikel 4, en artikel 5, van [verordening (EG) 852/2004]
      (32004R0852) in de betrokken sector of voor de betrokken levensmiddelen.

      4 Een in het tweede lid bedoelde goedkeuring kan, voor zover die goedkeuring betrekking heeft op één of meer van
      de permanente procedures, bedoeld in artikel 5, eerste lid, van [verordening (EG) 852/2004](32004R0852), worden
      ingetrokken indien de desbetreffende procedure niet is herzien en waar nodig aangepast overeenkomstig artikel 5,
      tweede lid, laatste alinea, van [verordening (EG) 852/2004](32004R0852).

      5 Onze Minister of Onze Minister van Economische Zaken, Landbouw en Innovatie, neemt een in het tweede en vierde
      lid onderscheidenlijk het derde en vierde lid bedoeld besluit, gehoord het advies van de Nederlandse Voedsel- en
      Warenautoriteit.

      6 Het vierde en vijfde lid zijn van overeenkomstige toepassing op een hygiënecode die
      vóór de inwerkingtreding van dit besluit is opgesteld en goedgekeurd op de voet van
      [artikel 31, eerste, tweede en derde lid, van de Warenwetregeling Hygiëne van levensmiddelen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007080#Artikel31
