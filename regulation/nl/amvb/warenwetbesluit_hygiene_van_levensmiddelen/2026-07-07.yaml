preamble:
  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Op de voordracht van Onze Minister van Volksgezondheid, Welzijn en Sport van 22 juni 2005, VGP/VL 2593195, gedaan
    in overeenstemming met Onze Ministers van Landbouw, Natuur en Voedselkwaliteit, en van Economische Zaken;


    Gelet op:


    – richtlijn nr. 96/3/Euratom, EGKS, EG van de Commissie van de Europese Gemeenschappen van 26 januari 1996 (PbEG
    L 21) inzake een afwijking van enkele bepalingen van richtlijn 93/43/EEG van de Raad inzake levensmiddelenhygiëne
    voor het bulkvervoer van vloeibare oliën en vetten over zee;


    – richtlijn nr. 98/28/EG van de Commissie van de Europese Gemeenschappen van 29 april 1998 (PbEG L 140) inzake
    een afwijking van enkele bepalingen van richtlijn 93/43/EEG van de Raad inzake levensmiddelenhygiëne voor het
    bulkvervoer over zee van ruwe suiker;


    – richtlijn nr. 2004/41/EG van het Europees Parlement en de Raad van de Europese Unie van 21 april 2004 (PbEU L
    157 en L 195) houdende intrekking van bepaalde richtlijnen inzake levensmiddelenhygiëne en tot vaststelling van
    gezondheidsvoorschriften voor de productie en het in de handel brengen van bepaalde voor menselijke consumptie
    bestemde producten van dierlijke oorsprong, en tot wijziging van de richtlijnen 89/662/EEG en 92/118/EEG van de
    Raad en van beschikking 95/408/EG van de Raad;


    – verordening (EG) nr. 852/2004 van het Europees Parlement en de Raad van de Europese Unie van 29 april 2004 inzake
    levensmiddelenhygiëne (PbEU L 139 en L 226);


    – verordening (EG) nr. 853/2004 van het Europees Parlement en de Raad van de Europese Unie van 29 april 2004
    houdende vaststelling van specifieke hygiënevoorschriften voor levensmiddelen van dierlijke oorsprong (PbEU L 139
    en L 226);


    – verordening (EG) nr. 854/2004 van het Europees Parlement en de Raad van de Europese Unie van 29 april 2004
    houdende vaststelling van specifieke voorschriften voor de organisatie van de officiële controles van voor
    menselijke consumptie bestemde producten van dierlijke oorsprong (PbEU L 139 en L 226);


    – verordening (EG) nr. 882/2004 van het Europees Parlement en de Raad van de Europese Unie van 29 april 2004 inzake
    officiële controles op de naleving van de wetgeving inzake diervoeders en levensmiddelen en de voorschriften inzake
    diergezondheid en dierenwelzijn (PbEU L 165 en L 191); en


    – de artikelen 4, eerste en tweede lid, 5, 6, 8, eerste lid, 9, 11, 12, 13, onder a, 14 en 22, eerste lid, van
    de Warenwet;


    De Raad van State gehoord (advies van 2 september 2005, no. W13.05.0264/III);


    Gezien het nader rapport van Onze Minister van Volksgezondheid, Welzijn en Sport van 27 september 2005, VGP/
    VL 2619723, uitgebracht in overeenstemming met Onze Ministers van Landbouw, Natuur en Voedselkwaliteit, en van
    Economische Zaken;


    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0018823/2026-07-07#ArtikelAanhef
articles:
  - number: '1'
    text: >-
      1 In dit besluit wordt verstaan onder:


      a. *verordening (EG) 852/2004*: [verordening (EG) nr. 852/2004](32004R0852) van het Europees Parlement en de Raad
      van de Europese Unie van 29 april 2004 inzake levensmiddelenhygiëne (PbEU L 139 en L 226);


      b. *hygiënecode*: een in Nederland opgestelde nationale gids voor goede praktijken inzake hygiëne en de toepassing
      van HACCP-beginselen als bedoeld in artikel 7 van [verordening (EG) 852/2004](32004R0852);


      c. *richtlijn 98/28/EG*: [richtlijn nr. 98/28/EG](31998L0028) van de Commissie van de Europese Gemeenschappen van
      29 april 1998 (PbEG L 140) inzake een afwijking van enkele bepalingen van [richtlijn 93/43/EEG](31993L0043) van de
      Raad inzake levensmiddelenhygiëne voor het bulkvervoer over zee van ruwe suiker;


      d. *verordening (EG) 853/2004*: [verordening (EG) nr. 853/2004](32004R0853) van het Europees Parlement en de
      Raad van de Europese Unie van 29 april 2004 houdende vaststelling van specifieke hygiënevoorschriften voor
      levensmiddelen van dierlijke oorsprong (PbEU L 139 en L 226);


      e. *verordening (EU) 2017/625*: Verordening (EU) 2017/625 van het Europees Parlement en de Raad van 15 maart
      2017 betreffende officiële controles en andere officiële activiteiten die worden uitgevoerd om de toepassing
      van de levensmiddelen- en diervoederwetgeving en van de voorschriften inzake diergezondheid, dierenwelzijn,
      plantgezondheid en gewasbeschermingsmiddelen te waarborgen, tot wijziging van de [Verordeningen (EG) nr. 999/2001]
      (32001R0999), [(EG) nr. 396/2005](32005R0396), [(EG) nr. 1069/2009](32009R1069), [(EG) nr. 1107/2009](32009R1107),
      (EU) [nr. 1151/2012](32012R1151), (EU) [nr. 652/2014](32014R0652), (EU) [2016/429](32329R2016) en (EU) [2016/2031]
      (32031R2016) van het Europees Parlement en de Raad, de Verordeningen [(EG) nr. 1/2005](32005R0001) en [(EG) nr.
      1099/2009](32009R1099) van de Raad en de Richtlijnen [98/58/EG](31958R0098), [1999/74/EG](31974R1999), [2007/43/
      EG](31943R2007), [2008/119/EG](32019R2008) en [2008/120/EG](32020R2008) van de Raad, en tot intrekking van de
      Verordeningen [(EG) nr. 854/2004](32004R0854) en [(EG) nr. 882/2004](32004R0882) van het Europees Parlement en
      de Raad, de Richtlijnen [89/608/EEG](32508R0089), [89/662/EEG](32562R0089), [90/425/EEG](32325R0090), [91/496/
      EEG](32396R0091), [96/23/EG](31923R0096), [96/93/EG](31993R0096) en [97/78/EG](31978R0097) van de Raad en Besluit
      [92/438/EEG](32338R0092) van de Raad (verordening officiële controles) (PbEU 2017, L 95);


      f. *verordening (EG) 2073/2005*: [verordening (EG) nr. 2073/2005](32005R2073) van de Commissie van de Europese
      Gemeenschappen van 15 november 2005 inzake microbiologische criteria voor levensmiddelen (PbEU L 338).


      2 Dit besluit is niet van toepassing op:


      a. de exploitanten van slachthuizen, bedoeld in bijlage II, secties II en III, van [verordening (EG) 853/2004]
      (32004R0853);


      b. de exploitanten van inrichtingen, bedoeld in artikel 2, eerste lid, onder c, van [verordening (EG) 852/2004]
      (32004R0852), waar uitsluitend handelingen worden verricht ten aanzien van levende dieren en vers vlees van:


      1°. als landbouwhuisdier gehouden hoefdieren;


      2°. pluimvee en lagomorfen;


      3°. gekweekt wild; of


      4°. vrij wild;


      als bedoeld in bijlage III, secties I tot en met IV, van [verordening (EG) 853/2004](32004R0853);


      c. de officiële controles van vers vlees en daarmee verband houdende bepalingen, bedoeld in artikel 17 en 18,
      eerste tot en met vijfde lid, zevende lid, onderdelen a tot en met f, h tot en met k, achtste lid, onderdelen a, c,
      d en e, en negende lid, van verordening (EU) 2017/625; en


      d. de officiële controles op de naleving van de wetgeving inzake diervoeders, diergezondheid en dierenwelzijn,
      bedoeld in verordening (EU) 2017/625.
