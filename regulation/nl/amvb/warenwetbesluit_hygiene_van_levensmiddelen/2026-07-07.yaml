  - number: 8a
    text: |-
      1 De exploitant, bedoeld in [artikel 8, tweede lid][ref1], zorgt ervoor dat op de recipiënten met rauwe melk of
      rauwe room bestemd voor rechtstreekse menselijke consumptie, met uitzondering van de melktank, de datum en het
      tijdstip van winning van de rauwe melk of rauwe room worden vermeld.

      2 De exploitant, bedoeld in [artikel 8, tweede lid][ref2], zorgt ervoor dat op de verpakkingen van rauwe melk en
      rauwe room bestemd voor rechtstreekse menselijke consumptie of in de directe omgeving van deze producten als ze pas
      bij aflevering worden verpakt, duidelijk leesbaar de volgende vermelding wordt vermeld:

      a. indien het rauwe melk of rauwe biest betreft: RAUWE MELK / BIEST * GEBRUIKEN OP DE DAG VAN AANKOOP * GEEF
      SCHADELIJKE BACTERIËN GEEN KANS * KOKEN VOOR GEBRUIK AANBEVOLEN;

      b. indien het rauwe room betreft: RAUWE ROOM * GEBRUIKEN OP DE DAG VAN AANKOOP * GEEF SCHADELIJKE BACTERIËN GEEN
      KANS * KOKEN VOOR GEBRUIK AANBEVOLEN.

      3 In afwijking van het tweede lid is de vermelding «GEBRUIKEN OP DE DAG VAN AANKOOP» niet verplicht indien de
      verpakking is voorzien van een datum van minimale houdbaarheid of een uiterste consumptiedatum.


