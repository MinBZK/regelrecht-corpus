  - number: '6'
    text: >-
      In afwijking van artikel 4, tweede lid, van [verordening (EG) 852/2004](32004R0852):


      a. mag het bulkvervoer in zeeschepen van vloeibare oliën of vetten die zullen worden gebruikt voor menselijke
      consumptie, geschieden met inachtneming van Verordening (EU) nr. 579/2014 van de Commissie van 28 mei 2014 inzake
      een afwijking van enkele bepalingen van bijlage II bij Verordening (EG) nr. 852/2004 van het Europees Parlement en
      de Raad wat betreft het vervoer van vloeibare oliën en vetten over zee (PbEU 2014, L 160);


      b. mag het bulkvervoer over zee van ruwe suiker die zonder een volledig en effectief raffinageproces te hebben
      ondergaan niet bestemd is voor gebruik als eetwaar of ingrediënt van een levensmiddel, geschieden met inachtneming
      van [richtlijn 98/28/EG](31998L0028).
    url: https://wetten.overheid.nl/BWBR0018823/2026-07-07#Artikel6
  - number: '7'
    text: |-
      1 De rechtstreekse levering, door de producent, van kleine hoeveelheden primaire producten aan de eindverbruiker of
      de plaatselijke detailhandel die rechtstreeks aan de eindverbruiker levert, bedoeld in:

      a. artikel 1, tweede lid, onder c, van [verordening (EG) 852/2004](32004R0852); en

      b. artikel 1, derde lid, onder c, van [verordening (EG) 853/2004](32004R0853);

      geschiedt op zindelijke wijze en zodanig dat:

      1°. geen verontreiniging plaats kan hebben met zodanige hoeveelheden van stoffen dat zij uit het oogpunt van
      de gezondheid van de mens schadelijk kunnen zijn, of met organismen of virussen die onder redelijkerwijze te
      verwachten omstandigheden schadelijk kunnen zijn of worden; en

      2°. onder 1° bedoelde organismen zich niet zodanig kunnen vermeerderen of zodanige toxinen kunnen vormen dat zij
      uit het oogpunt van de gezondheid van de mens schadelijk kunnen zijn of worden.

      2 Met betrekking tot het eerste lid kan een hygiënecode worden opgesteld. In dat geval
      zijn [artikel 4, eerste lid, tweede lid, onder a, b en d, vierde en vijfde lid][ref1], en
      [artikel 5, eerste en tweede lid][ref2], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018823#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0018823#Artikel5
