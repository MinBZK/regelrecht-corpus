  - number: '5'
    text: |-
      1 De exploitant van een levensmiddelenbedrijf wordt bij controle door een met het toezicht op de naleving van
      [verordening (EG) 852/2004](32004R0852) belaste ambtenaar, vóóraf door die ambtenaar in de gelegenheid gesteld
      te kennen te geven of door dat bedrijf gebruik wordt gemaakt van de voor zijn sector van de levensmiddelenbranche
      vastgestelde en goedgekeurde hygiënecode, bedoeld in [artikel 4][ref1].

      2 De exploitant van een levensmiddelenbedrijf, die gebruik maakt van de hygiënecode, bedoeld in het eerste lid:

      a. voldoet aan de artikelen 3, 4 of 5 van [verordening (EG) 852/2004](32004R0852), bedoeld in
      [artikel 4, tweede lid, onder d][ref2], indien hij handelt volgens de voorschriften in die hygiënecode die daarop
      betrekking hebben;

      b. voldoet niet aan de artikelen 3, 4 of 5 van [verordening (EG) 852/2004](32004R0852), bedoeld in
      [artikel 4, tweede lid, onder d][ref3], indien hij niet handelt volgens de voorschriften in die hygiënecode die
      daarop betrekking hebben.

      3 Het eerste en tweede lid zijn van overeenkomstige toepassing op het gebruik van:

      a. een hygiënecode die vóór de inwerkingtreding van dit besluit is opgesteld en goedgekeurd op de voet van
      [artikel 31, eerste, tweede en derde lid, van de Warenwetregeling Hygiëne van levensmiddelen][ref4];

      b. communautaire gidsen als bedoeld in artikel 9 van [verordening (EG) 852/2004](32004R0852).


