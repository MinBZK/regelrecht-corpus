  - number: '8'
    text: |-
      1 Rauwe melk en rauwe room bestemd voor rechtstreekse menselijke consumptie worden uitsluitend op het bedrijf waar
      deze producten zijn gewonnen aan de consument geleverd of aan de plaatselijke detailhandel die rechtstreeks aan de
      consument levert.

      2 De exploitant van een bedrijf waar rauwe melk en rauwe room worden gewonnen mag deze producten ter plaatse aan de
      consument leveren:

      a. indien de rauwe melk en rauwe room ongekoeld worden geleverd: binnen twee uur na het winnen;

      b. indien de rauwe melk en rauwe room onmiddellijk na het winnen gekoeld worden tot een temperatuur van ten hoogste
      4 °C en tot het moment van levering op die temperatuur worden bewaard: binnen 72 uur na het winnen.

      3 De exploitant, bedoeld in het tweede lid, mag rauwe melk en rauwe room in diepgevroren staat ter plaatse aan de
      consument leveren of verzenden:

      a. indien de rauwe melk en rauwe room binnen 24 uur na het winnen diepgevroren worden tot een temperatuur van ten
      hoogste - 18 °C en tot het moment van levering of verzending op die temperatuur worden bewaard; en

      b. indien verzending zodanig gebeurt, dat de temperatuur van het product tijdens transport constant blijft of tot
      ten hoogste - 15 °C oploopt.

      4 Het derde lid is van overeenkomstige toepassing op de levering of verzending van rauwe melk en rauwe room in
      diepgevroren staat aan de plaatselijke detailhandel indien deze producten bestemd zijn voor rechtstreekse levering
      aan de consument.

      5 Rauwe melk en rauwe room bestemd voor rechtstreekse menselijke consumptie, voldoen aan:

      a. de in de bijlage genoemde criteria; en

      b. de criteria, genoemd in
      [artikel 4, eerste lid, van het Warenwetbesluit Bereiding en behandeling van levensmiddelen][ref1].

      6 De exploitant, bedoeld in het tweede lid, laat rauwe melk minimaal tweemaal per maand op het totaal aeroob
      kiemgetal bij 30 °C onderzoeken.

      7 Het onderzoek, bedoeld in het zesde lid, vindt plaats aan het eind van de bewaartermijn van de melk, doch
      uiterlijk 72 uur na productie. Dit onderzoek mag eerder plaatsvinden als aannemelijk wordt gemaakt dat het
      kiemgetal ook aan het einde van de bewaartermijn aan het criterium, genoemd in de bijlage, zal voldoen.

      8 De exploitant, bedoeld in het tweede lid, laat rauwe melk minimaal eenmaal per maand op Salmonella, Campylobacter
      en Shiga-toxine producerende E. coli (STEC) onderzoeken. De frequentie van dit onderzoek kan worden gehalveerd als
      de resultaten gedurende zes maanden achter elkaar voldoen aan de criteria, bedoeld in het vijfde lid.

      9 De exploitant bewaart de gegevens van de onderzoeken, bedoeld in het zesde en achtste lid, gedurende twee jaren
      en houdt het ter beschikking van de toezichthouder.

      10 De exploitant, bedoeld in het tweede lid, die een activiteit, genoemd in het eerste lid uitvoert, doet
      daarvan melding aan Onze Minister en aan Onze Minister van Landbouw, Visserij, Voedselzekerheid en Natuur.
      De melding wordt gedaan door middel van een door Onze Minister van Landbouw, Visserij, Voedselzekerheid en
      Natuur beschikbaar gesteld elektronisch formulier. Onze Minister van Landbouw, Visserij, Voedselzekerheid en
      Natuur verstrekt de gegevens van de melding aan degenen die ingevolge de [artikelen 25, eerste lid][ref2], en
      [25a, eerste lid, van de Warenwet][ref3] belast zijn met het toezicht op de naleving van de regels gesteld bij
      dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0005758#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0001969#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0001969#Artikel25a
