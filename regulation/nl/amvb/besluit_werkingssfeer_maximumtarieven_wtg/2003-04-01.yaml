articles:
  - number: '1'
    text: |-
      1 Als categorieën van organen van gezondheidszorg als bedoeld in [artikel 17][ref1], worden aangewezen de volgende
      categorieën van organen voor gezondheidszorg:

      a. de navolgende instellingen:

      1. kraamcentra,

      2. gezondheidscentra,

      2a. zelfstandige behandelcentra die als zodanig een vergunning ingevolge het bepaalde bij of krachtens de
      [Wet ziekenhuisvoorzieningen][ref2] hebben verkregen;

      2b. instellingen, niet behorende tot de onder 1 tot en met 29a bedoelde categorieën en niet behorend tot de
      instellingen, bedoeld in de [artikelen 2 tot en met 4 van het Besluit werkingssfeer WTG 1992][ref3], in het kader
      waarvan prestaties worden geleverd door meerdere beroepsbeoefenaren als bedoeld onder b, onderdeel 5, welke met
      zelfstandige behandelcentra als bedoeld in 2a gelijk zijn te stellen, en die geen medisch-specialistische zorg
      verlenen als waarop bij of krachtens de [Ziekenfondswet][ref4] aanspraak bestaat, ongeacht de wijze waarop de
      kosten daarvan worden vergoed;

      3. instellingen, niet behorende tot de in [artikel 1, onder A, nummers 1 tot en met 31][ref5] bedoelde categorieën
      en niet behorend tot de instellingen, bedoeld in de [artikelen 2 en 3 van het Besluit werkingssfeer WTG 1992][ref6],
      in het kader waarvan prestaties worden geleverd door beroepsbeoefenaren als bedoeld onder *b* of personen als
      bedoeld onder *c* en waarvan de werkzaamheden uitsluitend of in hoofdzaak daarop zijn gericht;

      4. instellingen, niet behorende tot de in [artikel 1, onder A, nummers 1 tot en met 32][ref7]
      bedoelde categorieën en niet behorend tot de instellingen, bedoeld in de
      [artikelen 2 en 3 van het Besluit werkingssfeer WTG 1992][ref8], voor zover er prestaties worden geleverd door
      beroepsbeoefenaren als bedoeld onder *b* of personen als bedoeld onder *c*;

      b. de navolgende personen:

      1. huisartsen,

      2. tandartsen,

      3. tandarts-specialisten voor mondziekten en kaakchirurgie,

      4. tandarts-specialisten in de dentomaxillaire orthopaedie,

      5. medisch specialisten, te onderscheiden naar categorieën van specialismen overeenkomstig het onderscheid
      zoals dat wordt gemaakt in het specialistenregister van de Koninklijke Nederlandse Maatschappij tot bevordering
      der Geneeskunst, zoals dat register luidt op het tijdstip van het goedkeuren of vaststellen van een tarief of
      maximumtarief door het College tarieven gezondheidszorg voor de desbetreffende categorie van specialismen,

      6. verloskundigen,

      7. fysiotherapeuten,

      8. oefentherapeuten Mensendieck en César,

      9. logopedisten;

      c. de navolgende personen of instellingen die:

      1. farmaceutische hulp verlenen als bedoeld in
      [artikel 9 van het Verstrekkingenbesluit ziekenfondsverzekering][ref9],

      2. niet met verblijf gepaard gaande huishoudelijke verzorging, persoonlijke verzorging, verpleging of
      ondersteunende begeleiding leveren anders dan op grond van de [artikelen 3][ref10], [4][ref11], [5][ref12]
      of [6 van het Besluit zorgaanspraken AWBZ][ref13].

      2 De aanwijzing in het eerste lid van personen en instellingen die niet met verblijf gepaard gaande huishoudelijke
      verzorging, persoonlijke verzorging, verpleging of ondersteunende begeleiding leveren anders dan op grond
      van de [artikelen 3][ref14], [4][ref15], [5][ref16], of [6 van het Besluit zorgaanspraken AWBZ][ref17], is
      niet van toepassing voor zover die verzorging, verpleging of begeleiding wordt gefinancierd op basis van
      [artikel 1p, eerste lid, onder a en f, van de Ziekenfondswet][ref18].


