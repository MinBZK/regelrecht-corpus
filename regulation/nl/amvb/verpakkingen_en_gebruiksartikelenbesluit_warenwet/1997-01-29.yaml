        artikel: '3'
  - number: '5'
    text: |-
      1 Onze Ministers van Volksgezondheid, Welzijn en Sport, van Landbouw, Natuurbeheer en Visserij en van Economische
      Zaken tezamen kunnen omtrent de bij [artikel 2, eerste lid, onder ][ref1], gestelde eisen nadere regelen stellen.

      2 Voor de beoordeling of de waren in dit besluit bedoeld voldoen aan de bij of krachtens dit besluit gestelde
      eisen moet worden gebruik gemaakt van de ter zake door Onze Ministers van Volksgezondheid, Welzijn en Sport, van
      Landbouw, Natuurbeheer en Visserij en van Economische Zaken tezamen vastgestelde onderzoekingsmethoden.


      [ref1]: https://wetten.overheid.nl/BWBR0003267#Artikel2
    url: https://wetten.overheid.nl/BWBR0003267/1997-01-29#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003267
        artikel: '2'
  - number: '6'
    text: >-
      Dit besluit is niet van toepassing op


      a. verpakkingen uitsluitend bestaande uit eetwaar;


      b. op de korst van kaas aangebrachte bedekkingsmiddelen die niet van de korst kunnen worden gescheiden;


      c. op vleeswaren of fruit aangebrachte bedekkingsmiddelen die niet hiervan kunnen worden gescheiden;


      d. natuurprodukten die als zodanig worden gebruikt als verpakking of bestemd zijn voor dat gebruik;


      e. antiquiteiten.
    url: https://wetten.overheid.nl/BWBR0003267/1997-01-29#Artikel6
  - number: '9'
    text: >-
      1 Dit besluit kan worden aangehaald als Verpakkingen- en gebruiksartikelenbesluit (Warenwet).


      2 Het treedt in werking op een door Ons te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0003267/1997-01-29#Artikel9
