  - number: '4'
    text: |-
      1 De in [artikel 3, eerste en tweede lid][ref1], bedoelde aanduidingen moeten goed zichtbaar, duidelijk leesbaar en
      onuitwisbaar zijn aangebracht

      - hetzij op de verpakking of het gebruiksartikel,
      - hetzij op een op de verpakking of het gebruiksartikel aangebracht etiket,
      - hetzij, ingeval zij zijn verpakt, op het voorwerp waarin zij zijn verpakt dan wel op een daarop aangebracht
      etiket.

      2 Indien verpakkingen of gebruiksartikelen kennelijk bestemd zijn om aan particulieren te worden afgeleverd, mag
      het aanbrengen, bedoeld in het eerste lid, geschieden op een bord dat duidelijk zichtbaar is voor de koper en dat
      zich bevindt in de onmiddellijke nabijheid van de verpakking onderscheidenlijk het gebruiksartikel;

      de aanduiding, bedoeld in [artikel 3, eerste lid, onder ][ref2], mag alleen op deze wijze worden aangegeven,
      indien om technische redenen de aanduiding op de verpakking, het gebruiksartikel of het etiket niet kan worden
      aangebracht.

      3 Indien verpakkingen of gebruiksartikelen kennelijk bestemd zijn om aan anderen dan particulieren te worden
      afgeleverd, mag het aanbrengen, bedoeld in het eerste lid, geschieden op de begeleidende bescheiden.


      [ref1]: https://wetten.overheid.nl/BWBR0003267#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003267#Artikel3
    url: https://wetten.overheid.nl/BWBR0003267/1997-01-29#Artikel4
