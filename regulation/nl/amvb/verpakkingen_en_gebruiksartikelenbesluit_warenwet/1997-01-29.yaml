preamble:
  text: >-
    Wij Juliana, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.


    Op de voordracht van Onze Minister van Volksgezondheid en Milieuhygiëne van 21 juni 1979, DG Vgz/VA, nr. 146454,
    van Onze Minister van Landbouw en Visserij en van de Staatssecretaris van Economische Zaken, Th. M. Hazekamp;


    Overwegende, dat het gewenst is, zulks mede ter uitvoering van de beschikking van het Comité van Ministers van
    de Benelux Economische Unie van 31 augustus 1973 betreffende de vervaardiging, het verhandelen en het gebruik
    van voorwerpen en stoffen, bestemd om in aanraking te worden gebracht met voedingswaren en stoffen, M(73/17)
    (Benelux publikatieblad 1973-4) en van de Richtlijn van de Raad van de Europese Gemeenschappen van 23 november
    1976 betreffende de onderlinge aanpassing van de wetgevingen der Lid-Staten inzake materialen en voorwerpen bestemd
    om met levensmiddelen in aanraking te komen (76/893/EEG) (Pb. E.G. L 340), met betrekking tot verpakkingen en
    gebruiksartikelen een regeling vast te stellen;


    Gelet op de artikelen 1, 14, 14a, 16 en 16a van de Warenwet (Stb. 1935, 793);


    Gezien het advies van de Adviescommissie Warenwet van 21 januari 1974, nr. 11929 (17) 15;


    De Raad van State gehoord (advies van 25 juli 1979, nr. 19);


    Gezien het nader rapport van Onze Minister van Volksgezondheid en Milieuhygiëne van 6 september 1979, DG Vgz/VA,
    nr. 146897, van Onze Minister van Landbouw en Visserij en van voornoemde Staatssecretaris van Economische Zaken;


    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0003267/1997-01-29#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder

      a. *verpakkingen:* artikelen die

      1°. worden gebruikt voor het verpakken, het anderszins geheel of gedeeltelijk omhullen dan wel het op enige wijze
      aanbieden van eet- of drinkwaren, hetzij in rechtstreekse aanraking met die waren, hetzij zodanig dat onder normale
      omstandigheden stoffen aan die waren kunnen worden afgegeven;

      2°. zijn bestemd voor gebruik overeenkomstig het onder 1° bepaalde;

      b. *gebruiksartikelen:* gebruiksartikelen, bedoeld in [artikel 1 van de Warenwet][ref1], die

      1°. worden gebruikt in rechtstreekse aanraking met eet- of drinkwaren;

      2°. zijn bestemd voor gebruik overeenkomstig het onder 1° bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0001969#Artikel1
    url: https://wetten.overheid.nl/BWBR0003267/1997-01-29#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001969
        artikel: '1'
  - number: '2'
    text: |-
      1 Verpakkingen en gebruiksartikelen moeten voldoen aan de volgende eisen:

      a. zij moeten zijn vervaardigd uit materialen die op grond van hun uit het oogpunt van volksgezondheid goede
      hoedanigheid zijn aangewezen door Onze Ministers van Volksgezondheid, Welzijn en Sport, van Landbouw, Natuurbeheer
      en Visserij en van Economische Zaken tezamen zulks onder het stellen van regelen omtrent de stoffen, waaruit die
      materialen zijn vervaardigd;

      b. zij mogen niet zijn vervaardigd uit één of meer grond- en hulpstoffen zodanig dat zij uit het oogpunt van
      volksgezondheid gevaar opleveren of kunnen opleveren;

      c. zij mogen niet zodanige hoeveelheden stoffen aan eet- of drinkwaren afgeven of kunnen afgeven, dat die waren
      gevaar opleveren of kunnen opleveren voor de volksgezondheid dan wel op onaanvaardbare wijze veranderen voor wat
      betreft de samenstelling, geur, smaak, kleur en consistentie;

      d. zij moeten zich in zindelijke staat bevinden.

      2 De eisen, bedoeld in het eerste lid, zijn eveneens van toepassing op eet- en drinkgerei en artikelen, bestemd om
      te worden gebruikt voor het voeden van zuigelingen en kleuters, alsmede op artikelen die worden gebruikt of zijn
      bestemd voor het verpakken van waren als bedoeld onder 1° en 15° van het Besluit van 26 maart 1921 (*Stb.* 638).

      3 Onverminderd het in het eerste lid, onder *c*, bepaalde worden stoffen, afkomstig van de in het eerste lid, onder
      *a*, bedoelde materialen niet gerekend tot

      - de in eet- of drinkwaren aanwezige stoffen voor zover deze aan die waren zijn afgegeven door een verpakking
      bedoeld in [artikel 1, onder ][ref1], een gebruiksartikel, bedoeld in [artikel 1, onder ][ref2], of eet- en
      drinkgerei,
      - de in de waren als bedoeld onder 1° en 15° van het Besluit van 26 maart 1921 (*Stb.* 638), aanwezige stoffen voor
      zover deze aan die waren zijn afgegeven door de artikelen gebruikt voor het verpakken daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0003267#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0003267#Artikel1
    url: https://wetten.overheid.nl/BWBR0003267/1997-01-29#Artikel2
    references:
      - id: ref1
