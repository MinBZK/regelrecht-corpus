        artikel: '1'
  - number: '3'
    text: |-
      1 Verpakkingen als bedoeld in [artikel 1, onder ][ref1], of gebruiksartikelen als bedoeld in
      [artikel 1, onder ][ref2], moeten zijn voorzien van de volgende aanduidingen:

      a. hetzij de aanduiding "voor levensmiddelen" of "voor eet- en drinkwaren",

      - hetzij een aanduiding, aangevende het gebruik, zoals "wijnfles", "soeplepel" of "koffiemachine",
      - hetzij een door Onze Ministers van Volksgezondheid, Welzijn en Sport, van Landbouw, Natuurbeheer en Visserij en
      van Economische Zaken te zamen vastgesteld symbool, alsmede

      b. - hetzij de naam of de handelsnaam en het adres of de plaats van vestiging,
      - hetzij het handelsmerk,

      van de fabrikant of de verwerker dan wel van een verkoper die is gevestigd binnen het gebied, waarop het Verdrag
      tot oprichting van de Europese Economische Gemeenschap dan wel de Overeenkomst betreffende de Europese Economische
      Ruimte van toepassing is.

      2 Verpakkingen of gebruiksartikelen, bedoeld in het eerste lid, moeten indien bij het gebruik daarvan bijzondere
      voorwaarden in acht moeten worden genomen, zijn voorzien van een gebruiksaanwijzing, gesteld in de Nederlandse
      taal.

      3 Het in het eerste lid, onder *a*, bepaalde geldt niet ten aanzien van verpakkingen of gebruiksartikelen, waarvan
      de bestemming, bedoeld in [artikel 1, onder ][ref3], duidelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0003267#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0003267#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0003267#Artikel1
    url: https://wetten.overheid.nl/BWBR0003267/1997-01-29#Artikel3
