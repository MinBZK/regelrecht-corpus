        artikel: '6'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0019511
        artikel: '3'
        paragraaf: '1'
  - number: '8'
    text: |-
      1 De saneringswerkzaamheden vangen aan uiterlijk twaalf maanden nadat het bevoegd gezag de melding, bedoeld in
      [artikel 6][ref1], heeft ontvangen.

      2 De melding vervalt indien de saneringswerkzaamheden niet binnen de termijn van twaalf maanden zijn aangevangen.

      3 Degene die saneert dan wel degene die de sanering feitelijk uitvoert, meldt de datum van aanvang van de
      saneringswerkzaamheden binnen een bij ministeriële regeling te bepalen termijn schriftelijk aan het bevoegd gezag.


      [ref1]: https://wetten.overheid.nl/BWBR0019511#Artikel6
    url: https://wetten.overheid.nl/BWBR0019511/2013-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0019511
        artikel: '6'
        paragraaf: '2'
  - number: '9'
    text: |-
      Bij ministeriële regeling kunnen per categorie van uniforme saneringen regels worden gesteld omtrent:

      a. de wijze waarop de saneringswerkzaamheden worden uitgevoerd;

      b. het verstrekken van gegevens tijdens de sanering aan het bevoegd gezag en de termijn waarbinnen deze gegevens
      worden verstrekt;

      c. de milieukundige begeleiding;

      d. de in het kader van de milieukundige begeleiding verzamelde gegevens over de saneringsuitvoering.
    url: https://wetten.overheid.nl/BWBR0019511/2013-07-01#Artikel9
  - number: '10'
    text: |-
      1 Degene die saneert dan wel degene die de sanering feitelijk uitvoert, meldt wijzigingen ten opzichte van de
      gegevens verstrekt bij de melding, bedoeld in [artikel 6][ref1] schriftelijk aan het bevoegd gezag.

      2 Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent de melding van de wijzigingen. Deze regels
      hebben onder meer betrekking op:

      a. de wijze waarop de wijzigingen worden gemeld;

      b. de termijn waarbinnen de wijzigingen worden gemeld.


      [ref1]: https://wetten.overheid.nl/BWBR0019511#Artikel6
    url: https://wetten.overheid.nl/BWBR0019511/2013-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0019511
        artikel: '6'
        paragraaf: '2'
  - number: '11'
    text: |-
      1 De datum van voltooiing van de sanering dient binnen een bij ministeriële regeling vast te stellen termijn na
      beëindiging van de saneringswerkzaamheden aan het bevoegd gezag schriftelijk te worden gemeld.

      2 De termijn, bedoeld in het eerste lid, kan per categorie van uniforme saneringen verschillen.
    url: https://wetten.overheid.nl/BWBR0019511/2013-07-01#Artikel11
  - number: '12'
    text: |-
      In afwijking van [artikel 39c van de wet][ref1], gelden voor saneringen als bedoeld in
      [artikel 2, eerste lid][ref2], de [artikelen 13][ref3] en [14][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel39c
      [ref2]: https://wetten.overheid.nl/BWBR0019511#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0019511#Artikel13
      [ref4]: https://wetten.overheid.nl/BWBR0019511#Artikel14
    url: https://wetten.overheid.nl/BWBR0019511/2013-07-01#Artikel12
