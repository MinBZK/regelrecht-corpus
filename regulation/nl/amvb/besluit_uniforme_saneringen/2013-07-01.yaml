articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. *wet*: de [Wet bodembescherming][ref1];

      b. *bevoegd gezag*: gedeputeerde staten en daarmee op grond van [artikel 88 van de wet][ref2]
      gelijkgestelde bestuursorganen, dan wel Onze Minister van Verkeer en Waterstaat in gevallen als bedoeld in
      [artikel 63a, eerste lid, van de wet][ref3];

      c. *saneringslocatie*: het gedeelte van het grondgebied van het geval van verontreiniging van een land- of
      waterbodem waarop de melding, bedoeld in [artikel 6][ref4] betrekking heeft;

      d. *terugsaneerwaarde*: de getalsmatige invulling van het concentratieniveau voor stoffen in de bodem dat met een
      sanering moet worden gerealiseerd;

      e. *isolatielaag*: een leeflaag of een andere duurzame aaneengesloten afdeklaag.


      [ref1]: https://wetten.overheid.nl/BWBR0003994
      [ref2]: https://wetten.overheid.nl/BWBR0003994#Artikel88
      [ref3]: https://wetten.overheid.nl/BWBR0003994#Artikel63a
      [ref4]: https://wetten.overheid.nl/BWBR0019511#Artikel6
