        artikel: '9'
        paragraaf: '3'
  - number: '14'
    text: |-
      1 Het verslag, bedoeld in [artikel 13][ref1], behoeft de instemming van het bevoegd gezag, dat slechts met het
      verslag instemt indien de sanering voldoet aan het bepaalde bij of krachtens [artikel 4][ref2].

      2 Het bevoegd gezag beslist met betrekking tot de instemming binnen acht weken na de indiening van het verslag.

      3 In afwijking van het eerste lid behoeft het verslag geen instemming indien het betrekking heeft op een sanering
      behorende tot een bij ministeriële regeling aangewezen categorie uniforme saneringen.


      [ref1]: https://wetten.overheid.nl/BWBR0019511#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0019511#Artikel4
    url: https://wetten.overheid.nl/BWBR0019511/2013-07-01#Artikel14
    references:
