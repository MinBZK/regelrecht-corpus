  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 13 juli
    2005, nr. MJZDJZ2005159565, Directie Juridische Zaken, Afdeling Wetgeving, gedaan mede namens de Staatssecretaris
    van Verkeer en Waterstaat;

    Gelet op artikel 39b van de Wet bodembescherming;

    De Raad van State gehoord (advies van 8 september 2005, nr. W08.05.0360/V);

    Gezien het nader rapport van de Staatssecretaris van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van
    30 januari 2006, nr. DJZ 2005202055, Directie Juridische Zaken, Afdeling Wetgeving, uitgebracht mede namens de
    Staatssecretaris van Verkeer en Waterstaat;

    Hebben goedgevonden en verstaan:
