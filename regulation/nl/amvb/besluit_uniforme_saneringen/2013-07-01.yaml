  - number: '2'
    text: |-
      1 Dit besluit is van toepassing op een sanering die behoort tot een krachtens [artikel 39b van de wet][ref1] bij
      ministeriële regeling aangewezen categorie van uniforme saneringen, indien met betrekking tot die sanering een
      voornemen kenbaar is gemaakt overeenkomstig [artikel 39b, derde lid, van de wet][ref2].

      2 Degene die de bodem saneert, alsmede degene die de sanering feitelijk uitvoert, voeren de sanering uit
      overeenkomstig de regels gesteld bij of krachtens dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel39b
      [ref2]: https://wetten.overheid.nl/BWBR0003994#Artikel39b
    url: https://wetten.overheid.nl/BWBR0019511/2013-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003994
        artikel: 39b
      - id: ref2
        bwb_id: BWBR0003994
        artikel: 39b
  - number: '3'
    text: |-
      1 Degene die saneert, maakt in geval van een landbodem gebruik van een saneringsaanpak bestaande uit:

      a. het verplaatsen van verontreinigde grond;

      b. het saneren van verontreinigde grond door middel van een open ontgraving;

      c. het aanbrengen van een isolatielaag;

      d. het saneren van verontreinigd grondwater;

      e. een combinatie van a, b, c of d.

      2 Degene die saneert, maakt in geval van een waterbodem gebruik van een saneringsaanpak bestaande uit:

      a. het verplaatsen van verontreinigd sediment;

      b. het ontgraven of baggeren van verontreinigd sediment;

      c. het aanbrengen van een isolatielaag;

      d. een combinatie van a, b of c.

      3 Bij ministeriële regeling worden nadere regels gesteld omtrent de saneringsaanpak.
    url: https://wetten.overheid.nl/BWBR0019511/2013-07-01#Artikel3
  - number: '4'
    text: |-
      1 Bij ministeriële regeling worden per categorie uniforme saneringen regels gesteld omtrent aspecten van de
      sanering, waartoe onder meer behoren:

      a. de grootte van de verontreinigde bodemoppervlakte van de saneringslocatie;

      b. de aard en omvang van de verontreinigingen;

      c. de hoeveelheid, kwaliteit en afvoerbestemming van bij de sanering vrijkomende verontreinigde grond, grondwater
      en baggerspecie;

      d. de hoeveelheid en kwaliteit van de aan te voeren grond of baggerspecie.

      2 Bij ministeriële regeling worden in geval van een landbodem per categorie uniforme saneringen regels gesteld
      omtrent het saneringsresultaat, waartoe onder meer kunnen behoren:

      a. de dikte, aard, constructie en kwaliteit van de aan te brengen isolatielaag;

      b. de terugsaneerwaarde.

      3 Bij ministeriële regeling worden in geval van een waterbodem per categorie uniforme saneringen regels gesteld
      omtrent het saneringsresultaat, waartoe onder meer kunnen behoren:

      a. de dikte, aard, constructie en kwaliteit van de aan te brengen isolatielaag;

      b. de kwaliteit van de waterbodem na het ontgraven of baggeren van het verontreinigde sediment.
    url: https://wetten.overheid.nl/BWBR0019511/2013-07-01#Artikel4
  - number: '5'
    text: |-
      1 Voorafgaand aan de melding, bedoeld in [artikel 6][ref1], wordt onderzoek gedaan met betrekking tot de kwaliteit
      van de bodem van de saneringslocatie.

      2 Bij ministeriële regeling worden per categorie van uniforme saneringen nadere regels gesteld met betrekking tot
      het bodemonderzoek, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0019511#Artikel6
    url: https://wetten.overheid.nl/BWBR0019511/2013-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0019511
        artikel: '6'
        paragraaf: '2'
  - number: '6'
    text: |-
      1 Degene die het voornemen heeft te saneren overeenkomstig dit besluit verstrekt bij de melding, bedoeld in
      [artikel 39b, derde lid, van de wet][ref1] in ieder geval met betrekking tot de saneringslocatie aan het bevoegd
      gezag gegevens over:

      a. de van toepassing zijnde categorie van uniforme saneringen, bedoeld in [artikel 2][ref2];

      b. de van toepassing zijnde saneringsaanpak, bedoeld in [artikel 3][ref3];

      c. de invulling van de te realiseren aspecten van de sanering en het saneringsresultaat, bedoeld in
      [artikel 4][ref4];

      d. het uitgevoerde bodemonderzoek, bedoeld in [artikel 5][ref5].

      2 De gegevens, bedoeld in het eerste lid, onder d, betreffen, afhankelijk van de categorie van uniforme saneringen,
      onder meer gegevens omtrent:

      a. het vroegere, huidige en toekomstige gebruik;

      b. de bodemopbouw en geohydrologische situatie;

      c. de aard en omvang van de verontreinigingen van de saneringslocatie;

      d. de verspreiding van verontreinigende stoffen uit de bovengrond;

      e. de kwaliteit van de af te voeren grond.

      3 Bij ministeriële regeling kunnen per categorie van uniforme saneringen nadere regels worden gesteld omtrent de te
      verstrekken gegevens.

      4 De gegevens worden verstrekt op een formulier waarvan het model bij ministeriële regeling wordt vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel39b
      [ref2]: https://wetten.overheid.nl/BWBR0019511#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0019511#Artikel3
