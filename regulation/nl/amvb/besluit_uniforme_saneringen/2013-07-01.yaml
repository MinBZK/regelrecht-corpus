  - number: '16'
    text: |-
      Dit besluit is niet van toepassing op saneringen waarvoor, voor het tijdstip van inwerkingtreding van dit besluit,
      overeenkomstig [artikel 39 van de wet][ref1] is ingestemd met een daarop betrekking hebbend saneringsplan.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel39
    url: https://wetten.overheid.nl/BWBR0019511/2013-07-01#Artikel16
