  - number: 6a
    text: |-
      Een kennisgeving als bedoeld in [artikel 39b, derde lid, van de wet][ref1], wordt achterwege gelaten indien de
      melding, bedoeld in [artikel 6][ref2], een sanering betreft waarbij zich de in [artikel 7, eerste lid][ref3],
      bedoelde omstandigheden voordoen.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel39b
      [ref2]: https://wetten.overheid.nl/BWBR0019511#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0019511#Artikel7
    url: https://wetten.overheid.nl/BWBR0019511/2013-07-01#Artikel6a
