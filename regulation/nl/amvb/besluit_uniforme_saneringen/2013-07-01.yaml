  - number: '13'
    text: |-
      1 Na de uitvoering van de sanering doet degene die de landbodem of waterbodem heeft gesaneerd daarvan binnen acht
      weken na beëindiging van de saneringswerkzaamheden schriftelijk verslag aan het bevoegd gezag.

      2 Het verslag bevat de volgende gegevens:

      a. de vermelding van de gerealiseerde aspecten van de sanering en het saneringsresultaat, bedoeld in
      [artikel 4][ref1], en

      b. de in het kader van de milieukundige begeleiding verzamelde gegevens, bedoeld in [artikel 9][ref2].

      3 Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent de te verstrekken gegevens, waarbij
      per categorie uniforme saneringen kan worden bepaald dat de vermelding van gegevens, bedoeld in het tweede lid,
      achterwege kan blijven.

      4 Het verslag wordt verstrekt op een formulier waarvan het model bij ministeriële regeling wordt vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0019511#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0019511#Artikel9
    url: https://wetten.overheid.nl/BWBR0019511/2013-07-01#Artikel13
    references:
      - id: ref1
