        artikel: '7'
        paragraaf: '3'
  - number: '7'
    text: |-
      1 Met de sanering kan worden begonnen nadat vijf werkdagen zijn verstreken vanaf de datum van ontvangst van de
      melding, bedoeld in [artikel 6][ref1], indien de volgende omstandigheden zich voordoen:

      a. toegepast wordt de saneringsaanpak verplaatsen van verontreinigde grond, bedoeld in
      [artikel 3, eerste en tweede lid, onder a][ref2];

      b. het verplaatsen betreft het tijdelijk uitplaatsen van grond, waarbij de grond na ontgraving weer wordt
      teruggebracht in het profiel van ontgraving;

      c. de bodem is tot ontgravingsdiepte verontreinigd, en

      d. er is geen isolatielaag op de saneringslocatie aanwezig.

      2 Bij ministeriële regeling worden nadere regels gesteld omtrent de saneringsaanpak in de omstandigheden, genoemd
      in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0019511#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0019511#Artikel3
    url: https://wetten.overheid.nl/BWBR0019511/2013-07-01#Artikel7
    references:
      - id: ref1
