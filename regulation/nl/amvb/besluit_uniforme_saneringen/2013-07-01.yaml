        artikel: '4'
        paragraaf: '1'
  - number: '15'
    text: |-
      1 In afwijking van [artikel 39d van de wet][ref1], behoeft met betrekking tot saneringen als bedoeld in
      [artikel 2, eerste lid][ref2], geen nazorgplan als bedoeld in [dat artikel][ref3] te worden ingediend.

      2 De eigenaar, erfpachter of gebruiker van de saneringslocatie waar het aanbrengen van een isolatielaag, bedoeld in
      [artikel 3, eerste en tweede lid, onder c][ref4], heeft plaatsgevonden:

      a. treft de noodzakelijke maatregelen gericht op het in stand houden en onderhouden alsmede waar nodig het
      herstellen, verbeteren of vervangen van de isolatielaag, en

      b. neemt de noodzakelijke beperkingen in het gebruik van de bodem of het watersysteem in acht.

      3 Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent de maatregelen en beperkingen, bedoeld in
      het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel39d
      [ref2]: https://wetten.overheid.nl/BWBR0019511#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0003994#Artikel39d
      [ref4]: https://wetten.overheid.nl/BWBR0019511#Artikel3
