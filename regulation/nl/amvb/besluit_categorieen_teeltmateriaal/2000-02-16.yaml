  text: >-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.


    Op de voordracht van Onze Minister van Landbouw en Visserij van 15 februari 1967, no. J. 505, Directie Juridische
    en Bedrijfsorganisatorische Zaken;


    Gelet op artikel 84, van de Zaaizaad- en Plantgoedwet;


    De Raad van State gehoord (advies van 8 maart 1967, no. 50);


    Gezien het nader rapport van Onze voornoemde Minister van 29 maart 1967, no. J. 809, Directie Juridische en
    Bedrijfsorganisatorische Zaken;


    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0002570/2000-02-16#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In dit besluit en de daarop berustende bepalingen wordt

      - onder "kweker" mede verstaan de instandhouder van het ras;
      - onder "N.A.K." verstaan: Stichting Nederlandse Algemene Keuringsdienst voor zaaizaad en pootgoed van
      landbouwgewassen;
      - onder "waarmerken" verstaan: voorzien, door of onder toezicht van de N.A.K., van de krachtens
      [artikel 93 van de Zaaizaad- en Plantgoedwet][ref1] vastgestelde geldige merken, tekenen, bewijsstukken en plombes;
      - onder "de wet" verstaan: de [Zaaizaad- en Plantgoedwet][ref2].

      2 In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      zaad dat

      a. is voortgebracht onder de verantwoordelijkheid van de kweker door middel van stelselmatige instandhouding met
      betrekking tot het ras;

      b. is bestemd voor de voortbrenging van prebasiszaad dan wel basiszaad;

      c. is goedgekeurd door de N.A.K. als prebasiszaad en ten bewijze daarvan is gewaarmerkt, en

      d. is aangeboden in de hiervoor bestemde verpakkingen.

      *van vlas*

      1. Van de eerste vermeerdering: zaad dat

      a. rechtstreeks afkomstig is van prebasiszaad of van zaad van een aan het prebasiszaad voorafgaande generatie en
      dat is voortgebracht onder de verantwoordelijkheid van de kweker door middel van stelselmatige instandhouding met
      betrekking tot het ras;

      b. is bestemd voor de voortbrenging van basiszaad van de tweede vermeerdering dan wel gecertificeerd zaad en

      c. is goedgekeurd door de N.A.K. als basiszaad van de eerste vermeerdering (basiszaad superelite) en ten bewijze
      daarvan is gewaarmerkt.

      2. Van de tweede vermeerdering: zaad dat

      a. rechtstreeks afkomstig is van basiszaad van de eerste vermeerdering, van prebasiszaad of van zaad van een aan
      het prebasiszaad voorafgaande generatie en dat is voortgebracht onder de verantwoordelijkheid van de kweker door
      middel van stelselmatige instandhouding met betrekking tot het ras;

      b. is bestemd voor de voortbrenging van gecertificeerd zaad en

      c. is goedgekeurd door de N.A.K. als basiszaad van de tweede vermeerdering (basiszaad elite) en ten bewijze daarvan
      is gewaarmerkt.

      *van bieten:* zaad dat

      a. al dan niet afkomstig is van prebasiszaad en dat is voortgebracht onder verantwoordelijkheid van de kweker door
      middel van stelselmatige instandhouding met betrekking tot het ras;

      b. is bestemd voor de voortbrenging van gecertificeerd zaad en

      c. is goedgekeurd door de N.A.K. als basiszaad en ten bewijze daarvan is gewaarmerkt.

      *van mais*

      1. van vrij bestoven rassen: zaad dat

      a. is voortgebracht onder de verantwoordelijkheid van de kweker door middel van stelselmatige instandhouding met
      betrekking tot het ras;

      b. is bestemd voor de voortbrenging van gecertificeerd zaad van dit ras, van een inteelt-rassenhybride of een
      rassenhybride en

      c. is goedgekeurd door de N.A.K. als basiszaad en ten bewijze daarvan is gewaarmerkt.

      2. zaad van ingeteelde lijnen dat is goedgekeurd door de N.A.K. als basiszaad en ten bewijze daarvan is
      gewaarmerkt.

      3. van enkele hybriden: zaad dat bestemd is voor de voortbrenging van dubbele hybriden, drieweghybriden of
      inteelthybriden en dat is goedgekeurd door de N.A.K. als basiszaad en ten bewijze daarvan is gewaarmerkt.

      *van de overige krachtens artikel 87 van de wet aangewezen gewassen:* zaad dat

      a. rechtstreeks afkomstig is van prebasiszaad of van zaad van een aan het prebasiszaad voorafgaande generatie en
      dat is voortgebracht onder de verantwoordelijkheid van de kweker door middel van stelselmatige instandhouding met
      betrekking tot het ras of, indien het een landras betreft, is voortgebracht binnen een nauwkeurig afgebakend gebied
      van oorsprong;

      b. is bestemd voor de voortbrenging van gecertificeerd zaad en

      c. is goedgekeurd door de N.A.K. als basiszaad en ten bewijze daarvan is gewaarmerkt.

      *van gerst, haver, tarwe, lupine, wikke, kapucijner, landbouwerwt en veldboon*

      1. van de eerste vermeerdering: zaad dat

      a. rechtstreeks afkomstig is van basiszaad of van prebasiszaad;

      b. is bestemd voor de voortbrenging van gecertificeerd zaad van de tweede vermeerdering dan wel voor de
      voortbrenging van een gewas en

      c. is goedgekeurd door de N.A.K. als gecertificeerd zaad van de eerste vermeerdering en ten bewijze daarvan is
      gewaarmerkt.

      2. van de tweede vermeerdering: zaad dat

      a. rechtstreeks afkomstig is van gecertificeerd zaad van de eerste vermeerdering, van basiszaad of van
      prebasiszaad;

      b. is bestemd voor de voortbrenging van een gewas en

      c. is goedgekeurd door de N.A.K. als gecertificeerd zaad van de tweede vermeerdering en ten bewijze daarvan is
      gewaarmerkt.

      *van vlas*

      1. van de eerste vermeerdering: zaad dat

      a. rechtstreeks afkomstig is van basiszaad of van prebasiszaad;

      b. is bestemd voor de voortbrenging van gecertificeerd zaad van de tweede vermeerdering dan wel voor de
      voortbrenging van een gewas en

      c. is goedgekeurd door de N.A.K. als gecertificeerd zaad van de eerste vermeerdering en ten bewijze daarvan is
      gewaarmerkt.

      2. van de tweede vermeerdering: zaad dat

      a. rechtstreeks afkomstig is van gecertificeerd zaad van de eerste vermeerdering, van basiszaad of van
      prebasiszaad;

      b. is bestemd voor de voortbrenging van gecertificeerd zaad van de derde vermeerdering dan wel voor de
      voortbrenging van een gewas en

      c. is goedgekeurd door de N.A.K. als gecertificeerd zaad van de tweede vermeerdering en ten bewijze daarvan is
      gewaarmerkt.

      3. van de derde vermeerdering: zaad dat

      a. rechtstreeks afkomstig is van gecertificeerd zaad van de eerste of tweede vermeerdering, van basiszaad of van
      prebasiszaad;

      b. is bestemd voor de voortbrenging van een gewas en

      c. is goedgekeurd door de N.A.K. als gecertificeerd zaad van de derde vermeerdering en ten bewijze daarvan is
      gewaarmerkt.

      *van bieten:* zaad dat

      a. rechtstreeks afkomstig is van basiszaad dan wel van prebasiszaad;

      b. bestemd is voor de voortbrenging van bieten en

      c. is goedgekeurd door de N.A.K. als gecertificeerd zaad en ten bewijze daarvan is gewaarmerkt.

      *van de overige krachtens artikel 87 van de wet aangewezen gewassen:* zaad dat

      a. rechtstreeks afkomstig is van basiszaad of van prebasiszaad;

      b. is bestemd voor de voortbrenging van een gewas en

      c. is goedgekeurd door de N.A.K. als gecertificeerd zaad en ten bewijze daarvan is gewaarmerkt.

      knollen van aardappel die:

      a. zijn voortgebracht volgens de regels voor de stelselmatige instandhouding met betrekking tot het ras en de
      gezondheidstoestand;

      b. vooral zijn bestemd voor de voortbrenging van basispootgoed;

      c. zijn goedgekeurd door de N.A.K. als prebasispootgoed en ten bewijze daarvan zijn gewaarmerkt, en

      d. zijn aangeboden in de hiervoor bestemde verpakkingen.

      knollen van aardappel die

      a. zijn voortgebracht volgens de regels voor de stelselmatige instandhouding met betrekking tot het ras en de
      gezondheidstoestand;

      b. vooral bestemd zijn voor de voortbrenging van gecertificeerd pootgoed en

      c. zijn goedgekeurd door de N.A.K. als basispootgoed en ten bewijze daarvan zijn gewaarmerkt.

      knollen van aardappel die

      a. rechtstreeks afkomstig zijn van basispootgoed, van gecertificeerd pootgoed of van pootgoed van een aan het
      basispootgoed voorafgaand stadium, waarvan is gebleken dat het aan de eisen voor basispootgoed voldoet;

      b. vooral bestemd zijn voor de voortbrenging van andere aardappelen dan pootaardappelen en

      c. zijn goedgekeurd door de N.A.K. als gecertificeerd pootgoed en ten bewijze daarvan zijn gewaarmerkt.

      zaad dat soortecht is en dat is goedgekeurd door de N.A.K. als handelszaad en ten bewijze daarvan is gewaarmerkt.

      3 De in het tweede lid bedoelde goedkeuring en waarmerking zijn niet vereist indien het ingevoerd teeltmateriaal
      betreft, dat is voorzien van geldige bewijsstukken en plombes of andere sluitingen van een met de officiële
      goedkeuring van het betrokken teeltmateriaal belaste keuringsinstelling van een andere Lid-Staat van de Europese
      Gemeenschappen, dan wel van een keuringsinstelling van een andere staat die partij is bij de Overeenkomst
      betreffende de Europese Economische Ruimte, die is aangewezen bij een beslissing van een daartoe bevoegd orgaan van
      de Europese Gemeenschappen omtrent de gelijkwaardigheid van in een derde land geoogst teeltmateriaal.

      4 Indien de in het tweede lid bedoelde goedkeuring voor een beperkte tijdsduur is verleend, is na het
      verstrijken van die tijdsduur teeltmateriaal niet goedgekeurd in de zin van dat lid. De in het derde lid bedoelde
      bewijsstukken, plombes of andere sluitingen zijn slechts geldig voor de mogelijk daarbij aangegeven tijdsduur.


