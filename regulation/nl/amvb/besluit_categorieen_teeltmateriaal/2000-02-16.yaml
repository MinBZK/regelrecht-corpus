  - number: '2'
    text: >-
      1 Van rassen, behorende tot de krachtens artikel 87 van de wet aangewezen landbouwgewassen mogen, onverminderd de
      ter zake krachtens artikel 91 van die wet gegeven voorschriften, uitsluitend de volgende categorieën teeltmateriaal
      in het verkeer gebracht, verder verhandeld en uitgevoerd worden:


      a. prebasiszaad onderscheidenlijk prebasispootgoed;


      b. basiszaad onderscheidenlijk basispootgoed;


      c. gecertificeerd zaad onderscheidenlijk gecertificeerd pootgoed;


      d. niet bewerkt teeltmateriaal dat in de handel wordt gebracht met het oog op de bewerking, voor zover de
      identiteit van dit zaad wordt gewaarborgd en het is goedgekeurd door de N.A.K. en ten bewijze daarvan is
      gewaarmerkt;


      e. kleine hoeveelheden teeltmateriaal voor wetenschappelijke of kweekdoeleinden.


      2 Van groenvoedergewassen mag, zolang Onze Minister van Landbouw en Visserij of het Produktschap voor
      Landbouwzaaizaden niet het tegendeel bepaalt, bovendien handelszaad in het verkeer gebracht, verder verhandeld en
      uitgevoerd worden.


      3 Onze Minister van Landbouw en Visserij of het Produktschap voor Landbouwzaaizaden kan bepalen, dat andere dan
      de in het eerste lid genoemde categorieën teeltmateriaal in het verkeer gebracht, verder verhandeld en uitgevoerd
      mogen worden.


      4 Onze Minister van Landbouw en Visserij oefent de hem bij het tweede en derde lid gegeven bevoegdheden slechts
      uit, voor zover het Produktschap voor Landbouwzaaizaden ter zake geen voorziening treft.
    url: https://wetten.overheid.nl/BWBR0002570/2000-02-16#Artikel2
  - number: '3'
    text: >-
      1 Prebasiszaad, onderscheidenlijk basiszaad, mag slechts worden voortgebracht en in het verkeer gebracht door de
      houder van het kwekersrecht of door de voor het ras aangewezen instandhouders.


      2 Het bepaalde in het eerste lid is van overeenkomstige toepassing op gecertificeerd zaad van hybride-maïs.
    url: https://wetten.overheid.nl/BWBR0002570/2000-02-16#Artikel3
  - number: '4'
    text: |-
      1 Dit besluit kan worden aangehaald als "Besluit Categorieën Teeltmateriaal".

      2 Het treedt in werking met ingang van het tijdstip, waarop de [Zaaizaad- en Plantgoedwet][ref1] in werking treedt.


