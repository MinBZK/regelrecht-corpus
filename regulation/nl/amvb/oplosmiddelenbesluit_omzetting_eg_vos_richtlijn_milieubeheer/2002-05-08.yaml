---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: oplosmiddelenbesluit_omzetting_eg_vos_richtlijn_milieubeheer
regulatory_layer: AMVB
publication_date: '2010-05-12'
valid_from: '2002-05-08'
bwb_id: BWBR0012337
url: https://wetten.overheid.nl/BWBR0012337/2002-05-08
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer, van 3 juli 2000,
    nr. MJZ2000075276, Centrale Directie Juridische Zaken, Afdeling Wetgeving;

    Gelet op Richtlijn nr. 1999/13/EG van de Raad van de Europese Unie van 11 maart 1999 inzake de beperking van de
    emissie van vluchtige organische stoffen ten gevolge van het gebruik van organische oplosmiddelen bij bepaalde
    werkzaamheden en in installaties (PbEG L 85) en op artikel 8.44 van de Wet milieubeheer;

    De Raad van State gehoord (advies van 28 september 2000, nr. W08.00.0268/V);

    Gezien het nader rapport van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 13 maart
    2001, nr. MJZ2001027745, Centrale Directie Juridische Zaken, Afdeling Wetgeving;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0012337/2002-05-08#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0012337/2002-05-08#Artikel1
  - number: 1.1.a
    text: |-
      richtlijn: [richtlijn nr. 1999/13/EG](31999L0013) van de Raad van de Europese Unie van 11 maart 1999 inzake de
      beperking van de emissie van vluchtige organische stoffen ten gevolge van het gebruik van organische oplosmiddelen
      bij bepaalde werkzaamheden en in installaties (PbEG L 85), naar de tekst zoals deze bij die richtlijn is
      vastgesteld;
    url: https://wetten.overheid.nl/BWBR0012337/2002-05-08#Artikel1
  - number: 1.1.b
    text: |-
      wet: [Wet milieubeheer][ref1];

      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0012337/2002-05-08#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003245
  - number: 1.1.c
    text: |-
      installatie: vaste technische eenheid waarbinnen een of meer van de activiteiten, genoemd in [bijlage I][ref1],
      plaatsvinden en alle andere daar rechtstreeks mee samenhangende activiteiten die technisch verband houden met de
      binnen die eenheid verrichte activiteiten en van invloed kunnen zijn op emissies;


      [ref1]: https://wetten.overheid.nl/BWBR0012337
    url: https://wetten.overheid.nl/BWBR0012337/2002-05-08#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0012337
  - number: 1.1.d
    text: |-
      bestaande installatie: een installatie in bedrijf binnen een inrichting waarvoor vóór de inwerkingtreding van
      dit besluit vergunning als bedoeld in [artikel 8.1 van de wet][ref1], is verleend of die is gemeld overeenkomstig
      [artikel 8.41 van de wet][ref2] of waarvoor naar het oordeel van het bevoegd gezag een volledige aanvraag om een
      vergunning is ingediend, mits de installatie uiterlijk een jaar na de inwerkingtreding van dit besluit in gebruik
      wordt genomen;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0012337/2002-05-08#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '8'
  - number: 1.1.e
    text: |-
      kleine installatie: een installatie met de laagste drempelwaarde van de punten 1, 3, 4, 5, 8, 10, 13, 16 of 17 van
      [bijlage IIa][ref1] of, voor de andere activiteiten van [bijlage IIa][ref2], die minder dan 10 ton oplosmiddel per
      jaar verbruikt;


      [ref1]: https://wetten.overheid.nl/BWBR0012337
      [ref2]: https://wetten.overheid.nl/BWBR0012337
    url: https://wetten.overheid.nl/BWBR0012337/2002-05-08#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0012337
      - id: ref2
        bwb_id: BWBR0012337
  - number: 1.1.f
    text: 'belangrijke wijziging:'
    url: https://wetten.overheid.nl/BWBR0012337/2002-05-08#Artikel1
  - number: 1.1.f.1°
    text: |-
      voor een kleine installatie: een verandering van de nominale capaciteit die leidt tot een toename van de emissies
      van vluchtige organische stoffen met meer dan 25%, alsmede elke verandering die naar de mening van het bevoegd
      gezag aanzienlijke negatieve gevolgen voor de menselijke gezondheid of het milieu kan hebben;
    url: https://wetten.overheid.nl/BWBR0012337/2002-05-08#Artikel1
  - number: 1.1.f.2°
    text: |-
      voor alle andere installaties: een verandering van de nominale capaciteit die leidt tot een toename van de emissies
      van vluchtige organische stoffen met meer dan 10%, alsmede elke verandering die naar de mening van het bevoegd
      gezag aanzienlijke negatieve gevolgen voor de menselijke gezondheid of het milieu kan hebben;
    url: https://wetten.overheid.nl/BWBR0012337/2002-05-08#Artikel1
  - number: 1.1.g
    text: |-
      vergunning: vergunning als bedoeld in [artikel 8.1 van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0012337/2002-05-08#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
  - number: 1.1.h
    text: 'bevoegd gezag: het bestuursorgaan dat bevoegd is een vergunning voor de betrokken inrichting te verlenen;'
    url: https://wetten.overheid.nl/BWBR0012337/2002-05-08#Artikel1
  - number: 1.1.i
    text: 'emissie: uitstoot van vluchtige organische stoffen uit een installatie in het milieu;'
    url: https://wetten.overheid.nl/BWBR0012337/2002-05-08#Artikel1
  - number: 1.1.j
    text: |-
      diffuse emissies: emissies, in een andere vorm dan van afgassen, van vluchtige organische stoffen in lucht,
      bodem of water alsmede, tenzij anders vermeld in [bijlage IIa][ref1], oplosmiddelen die zich in enig product
      bevinden, waaronder begrepen de niet opgevangen emissies die via ramen, deuren, ventilatiekanalen, ontluchtingen en
      soortgelijke openingen in het milieu terechtkomen;


      [ref1]: https://wetten.overheid.nl/BWBR0012337
    url: https://wetten.overheid.nl/BWBR0012337/2002-05-08#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0012337
  - number: 1.1.k
    text: |-
      afgassen: de uiteindelijke uitworp in de lucht van gassen met vluchtige organische stoffen of andere
      verontreinigende stoffen uit een afgaskanaal of uit nabehandelingsapparatuur, waarbij het volumetrisch debiet wordt
      uitgedrukt in kubieke meters per uur bij normale omstandigheden;
    url: https://wetten.overheid.nl/BWBR0012337/2002-05-08#Artikel1
  - number: 1.1.l
    text: 'totale emissie: de som van diffuse emissies en emissies van afgassen;'
    url: https://wetten.overheid.nl/BWBR0012337/2002-05-08#Artikel1
  - number: 1.1.m
    text: |-
      emissiegrenswaarde: de massa van de vluchtige organische stoffen, uitgedrukt als bepaalde specifieke parameters,
      concentratie, percentage of niveau van een emissie, berekend in normale omstandigheden (N) die gedurende een of
      meer periodes niet overschreden mogen worden;
    url: https://wetten.overheid.nl/BWBR0012337/2002-05-08#Artikel1
  - number: 1.1.n
    text: |-
      stof: chemisch element en zijn verbindingen, die in de natuur voorkomen of door de industrie worden geproduceerd,
      in vaste of vloeibare of gasvorm;
    url: https://wetten.overheid.nl/BWBR0012337/2002-05-08#Artikel1
  - number: 1.1.o
    text: 'preparaat: mengsel of oplossing, bestaande uit twee of meer stoffen;'
    url: https://wetten.overheid.nl/BWBR0012337/2002-05-08#Artikel1
  - number: 1.1.p
    text: |-
      organische verbinding: verbinding die ten minste het element koolstof bevat en daarnaast een of meer van de
      volgende elementen: waterstof, halogenen, zuurstof, zwavel, fosfor, silicium of stikstof, met uitzondering van
      koolstofoxiden, anorganische carbonaten en bicarbonaten;
    url: https://wetten.overheid.nl/BWBR0012337/2002-05-08#Artikel1
  - number: 1.1.q
    text: |-
      vluchtige organische stof (VOS): organische verbinding die bij 293,15 K een dampspanning van 0,01 kPa of meer heeft
      of onder de specifieke gebruiksomstandigheden een vergelijkbare vluchtigheid heeft, waarbij voor de toepassing van
      dit besluit de fractie creosoot die deze dampspanning overschrijdt bij 293,15 K, als een VOS geldt;
    url: https://wetten.overheid.nl/BWBR0012337/2002-05-08#Artikel1
  - number: 1.1.r
    text: |-
      organisch oplosmiddel: vluchtige organische verbinding die alleen of in combinatie met andere stoffen en zonder een
      chemische verandering te ondergaan wordt gebruikt om grondstoffen, producten of afvalmaterialen op te lossen of als
      schoonmaakmiddel om verontreinigingen op te lossen, dan wel als verdunner, als dispergeermiddel, om de viscositeit
      aan te passen, om de oppervlaktespanning aan te passen, als weekmaker of als conserveermiddel;
    url: https://wetten.overheid.nl/BWBR0012337/2002-05-08#Artikel1
  - number: 1.1.s
    text: |-
      gehalogeneerd organisch oplosmiddel: organisch oplosmiddel dat ten minste één broom-, chloor-, fluor-, of
      iodiumatoom per molecule bevat;
    url: https://wetten.overheid.nl/BWBR0012337/2002-05-08#Artikel1
  - number: 1.1.t
    text: |-
      coating: preparaat, met inbegrip van alle voor een juist gebruik benodigde organische oplosmiddelen of preparaten,
      die organische oplosmiddelen bevatten, dat wordt gebruikt om op een oppervlak voor een decoratief, beschermend of
      ander functioneel effect te zorgen;
    url: https://wetten.overheid.nl/BWBR0012337/2002-05-08#Artikel1
  - number: 1.1.u
    text: |-
      kleefstof: preparaat, met inbegrip van alle voor een juist gebruik benodigde organische oplosmiddelen of
      preparaten, die organische oplosmiddelen bevatten, dat wordt gebruikt om afzonderlijke delen van een product samen
      te kleven;
    url: https://wetten.overheid.nl/BWBR0012337/2002-05-08#Artikel1
  - number: 1.1.v
    text: |-
      inkt: preparaat, met inbegrip van alle voor een juist gebruik benodigde organische oplosmiddelen of preparaten,
      die organische oplosmiddelen bevatten, dat bij een drukactiviteit wordt gebruikt om een tekst of afbeelding op een
      oppervlak af te drukken;
    url: https://wetten.overheid.nl/BWBR0012337/2002-05-08#Artikel1
  - number: 1.1.w
    text: 'lak: een doorzichtige coating;'
    url: https://wetten.overheid.nl/BWBR0012337/2002-05-08#Artikel1
  - number: 1.1.x
    text: |-
      verbruik: de totale input van organische oplosmiddelen per twaalf maanden in een installatie, verminderd met
      eventuele VOS die voor hergebruik wordt teruggewonnen;
    url: https://wetten.overheid.nl/BWBR0012337/2002-05-08#Artikel1
  - number: 1.1.y
    text: |-
      input: de hoeveelheid organische oplosmiddelen en de hoeveelheid daarvan in preparaten die tijdens het uitoefenen
      van een activiteit worden gebruikt, met inbegrip van de gerecycleerde oplosmiddelen, binnen en buiten de
      installatie, die telkens worden meegerekend wanneer zij worden gebruikt om de activiteit uit te oefenen;
    url: https://wetten.overheid.nl/BWBR0012337/2002-05-08#Artikel1
  - number: 1.1.z
    text: |-
      hergebruik van organische oplosmiddelen: het gebruik van uit een installatie teruggewonnen organische oplosmiddelen
      voor elk technisch of commercieel doel, met inbegrip van het gebruik als brandstof maar met uitzondering van het
      verwijderen van deze teruggewonnen organische oplosmiddelen als afval;
    url: https://wetten.overheid.nl/BWBR0012337/2002-05-08#Artikel1
  - number: 1.1.aa
    text: 'massastroom: hoeveelheid vrijgekomen VOS, uitgedrukt in de eenheid van massa per uur;'
    url: https://wetten.overheid.nl/BWBR0012337/2002-05-08#Artikel1
  - number: 1.1.ab
    text: |-
      nominale capaciteit: massa van de organische oplosmiddelen die een installatie gemiddeld over één dag maximaal als
      input gebruikt, als de installatie onder normale bedrijfsomstandigheden bij de ontwerpoutput functioneert;
    url: https://wetten.overheid.nl/BWBR0012337/2002-05-08#Artikel1
  - number: 1.1.ac
    text: |-
      normaal bedrijf: alle perioden waarin een installatie of een activiteit in bedrijf is, met uitzondering van het
      opstarten, stilleggen en het onderhoud van apparatuur;
    url: https://wetten.overheid.nl/BWBR0012337/2002-05-08#Artikel1
  - number: 1.1.ad
    text: 'normale omstandigheden: een temperatuur van 273,15 K en een druk van 101,3 kPa;'
    url: https://wetten.overheid.nl/BWBR0012337/2002-05-08#Artikel1
  - number: 1.1.ae
    text: |-
      gemiddelde over 24 uur: rekenkundig gemiddelde van alle valide waarden die gedurende een periode van 24 uur bij
      normaal bedrijf zijn geregistreerd;
    url: https://wetten.overheid.nl/BWBR0012337/2002-05-08#Artikel1
  - number: 1.1.af
    text: |-
      opstarten en stilleggen: activiteiten die worden uitgevoerd wanneer een activiteit, een deel van de installatie
      of een reservoir in of buiten bedrijf wordt gesteld of in of uit de onbelaste toestand wordt gebracht, waarbij
      regelmatig oscillerende activiteitenfasen niet als opstarten of stilleggen gelden;
    url: https://wetten.overheid.nl/BWBR0012337/2002-05-08#Artikel1
  - number: 1.1.ag
    text: |-
      risicozinnen: de bijzondere, aan het gebruik van een stof, die behoort tot een categorie als bedoeld in
      [artikel 34, tweede lid, van de Wet milieugevaarlijke stoffen][ref1], verbonden gevaren als bedoeld in
      [artikel 2 van de Nadere regels verpakking en aanduiding milieugevaarlijke stoffen en preparaten][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0004284#Artikel2
    url: https://wetten.overheid.nl/BWBR0012337/2002-05-08#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003892
        artikel: '34'
      - id: ref2
        bwb_id: BWBR0004284
        artikel: '2'
  - number: '1.2'
    text: |-
      Onder een bestaande installatie als bedoeld in het eerste lid, onder d, wordt mede verstaan het deel van de
      installatie, dat een belangrijke wijziging heeft ondergaan, of na een belangrijke wijziging voor het eerst onder
      dit besluit valt, mits de totale emissies van de gehele installatie niet hoger zijn dan is toegestaan, indien dat
      deel een nieuwe installatie zou zijn.
    url: https://wetten.overheid.nl/BWBR0012337/2002-05-08#Artikel1
  - number: '2'
    text: |-
      Dit besluit is van toepassing op vergunningplichtige inrichtingen die behoren tot een of meer van de categorieën
      van inrichtingen, die zijn genoemd in [bijlage I van het Inrichtingen- en vergunningenbesluit milieubeheer][ref1],
      voor zover zich in de inrichting een installatie, een bestaande installatie of een kleine installatie bevindt.


      [ref1]: https://wetten.overheid.nl/BWBR0005829
    url: https://wetten.overheid.nl/BWBR0012337/2002-05-08#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005829
  - number: '3.1'
    text: |-
      Degene die een inrichting drijft, draagt er zorg voor dat de installatie die zich in die inrichting bevindt, ten
      minste voldoet aan:
    url: https://wetten.overheid.nl/BWBR0012337/2002-05-08#Artikel3
  - number: 3.1.a
    text: |-
      de in [bijlage IIa][ref1] bepaalde emissiegrenswaarden voor afgassen en diffuse-emissiegrenswaarden of aan de
      totale emissiegrenswaarden en overige voorschriften, of


      [ref1]: https://wetten.overheid.nl/BWBR0012337
    url: https://wetten.overheid.nl/BWBR0012337/2002-05-08#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0012337
  - number: 3.1.b
    text: |-
      aan de eisen van het in [bijlage IIb][ref1] beschreven reductieprogramma.


      [ref1]: https://wetten.overheid.nl/BWBR0012337
    url: https://wetten.overheid.nl/BWBR0012337/2002-05-08#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0012337
  - number: '3.2'
    text: Voor diffuse emissies gelden diffuse-emissiegrenswaarden voor installaties als emissiegrenswaarde.
    url: https://wetten.overheid.nl/BWBR0012337/2002-05-08#Artikel3
  - number: '3.3'
    text: |-
      Indien degene die een inrichting drijft, ten genoegen van het bevoegd gezag aantoont dat de grenswaarde, bedoeld
      in het tweede lid, technisch en economisch niet haalbaar is, kan dat gezag voor de installatie een afwijkende
      grenswaarde vaststellen, mits er geen aanmerkelijke gevaren voor de menselijke gezondheid of het milieu zijn te
      verwachten en er ten genoegen van het bevoegd gezag wordt aangetoond dat er gebruik wordt gemaakt van de beste
      beschikbare techniek. Wanneer het bevoegd gezag van deze bevoegdheid gebruik maakt, zendt het een afschrift van het
      desbetreffende besluit aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0012337/2002-05-08#Artikel3
  - number: '3.4'
    text: |-
      Voor activiteiten waarbij de vrijkomende VOS niet beheerst kan worden afgevangen en uitgestoten, kan worden
      afgeweken van de emissiegrenswaarden van [bijlage IIa][ref1], voor zover deze mogelijkheid uitdrukkelijk in die
      bijlage is genoemd. In dat geval wordt het reductieprogramma van [bijlage IIb][ref2] gevolgd.


      [ref1]: https://wetten.overheid.nl/BWBR0012337
      [ref2]: https://wetten.overheid.nl/BWBR0012337
    url: https://wetten.overheid.nl/BWBR0012337/2002-05-08#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0012337
      - id: ref2
        bwb_id: BWBR0012337
  - number: '3.5'
    text: |-
      Indien degene die een inrichting drijft, in een geval als bedoeld in het vierde lid, ten genoegen van het bevoegd
      gezag aantoont dat het volgen van het reductieprogramma technisch en economisch niet haalbaar is, kan dat gezag
      voor de installatie afwijken van het reductieprogramma. In dat geval wordt ten genoegen van het bevoegd gezag
      aangetoond dat gebruik wordt gemaakt van de beste beschikbare techniek. Wanneer het bevoegd gezag van deze
      bevoegdheid gebruik maakt, zendt het een afschrift van het desbetreffende besluit aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0012337/2002-05-08#Artikel3
  - number: '3.6'
    text: |-
      Voor een installatie die het reductieprogramma niet volgt, voldoet alle emissieverminderende apparatuur die na de
      datum van inwerkingtreding van dit besluit wordt aangebracht, aan bijlage IIa.
    url: https://wetten.overheid.nl/BWBR0012337/2002-05-08#Artikel3
  - number: '4.1'
    text: |-
      Degene die een inrichting drijft, draagt er zorg voor dat de installatie waarin twee of meer activiteiten worden
      verricht die elk de drempelwaarden van [bijlage IIa][ref1] overschrijden, voldoet:


      [ref1]: https://wetten.overheid.nl/BWBR0012337
    url: https://wetten.overheid.nl/BWBR0012337/2002-05-08#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0012337
  - number: 4.1.a
    text: |-
      ten aanzien van de stoffen, genoemd in het tweede tot en met het vierde lid, voor elke activiteit afzonderlijk aan
      de in die leden vermelde eisen, en
    url: https://wetten.overheid.nl/BWBR0012337/2002-05-08#Artikel4
  - number: 4.1.b
    text: 'ten aanzien van de andere stoffen:'
    url: https://wetten.overheid.nl/BWBR0012337/2002-05-08#Artikel4
  - number: 4.1.b.1°
    text: |-
      voor elke activiteit afzonderlijk aan [artikel 3, eerste lid][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0012337#Artikel3
    url: https://wetten.overheid.nl/BWBR0012337/2002-05-08#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0012337
        artikel: '3'
        paragraaf: '2'
  - number: 4.1.b.2°
    text: |-
      aan een waarde voor de totale emissies, die niet hoger is dan bij toepassing van het onder 1° gestelde het geval
      zou zijn.
    url: https://wetten.overheid.nl/BWBR0012337/2002-05-08#Artikel4
  - number: '4.2'
    text: |-
      Stoffen of preparaten, waaraan een of meer van de risicozinnen R45, R46, R49, R60 en R61 is of zijn
      toegekend of die behoren te zijn voorzien van deze zinnen wegens hun gehalte aan VOS die krachtens
      [artikel 2 van de Nadere regels verpakking en aanduiding milieugevaarlijke stoffen en preparaten][ref1] als
      kankerverwekkend, mutageen of giftig voor de voortplanting zijn ingedeeld, worden, voor zover mogelijk en rekening
      houdend met door de Europese Commissie krachtens artikel 7, eerste lid, van de richtlijn gepubliceerde richtsnoeren
      met betrekking tot het gebruik van vluchtige organische stoffen en mogelijke vervangingsproducten daarvoor, binnen
      zo kort mogelijke tijd vervangen door minder schadelijke stoffen of preparaten.


      [ref1]: https://wetten.overheid.nl/BWBR0004284#Artikel2
    url: https://wetten.overheid.nl/BWBR0012337/2002-05-08#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0004284
        artikel: '2'
  - number: '4.3'
    text: |-
      Voor de uitstoot van de VOS, bedoeld in het tweede lid, waarbij de massastroom van de stoffen waarvoor de in dat
      lid bedoelde etikettering verplicht is, in totaal 10 g/uur of meer bedraagt, wordt een emissiegrenswaarde van 2 mg/
      Nm3 in acht genomen. De emissiegrenswaarde geldt voor de totale massa van de betrokken stoffen.
    url: https://wetten.overheid.nl/BWBR0012337/2002-05-08#Artikel4
  - number: '4.4'
    text: |-
      Voor de uitstoot van gehalogeneerde VOS, waaraan de risicozin R40 is toegekend, waarbij de massastroom van
      de stoffen waarvoor de vermelding van R40 verplicht is, in totaal 100 g/uur of meer bedraagt, wordt een
      emissiegrenswaarde van 20 mg/Nm3 in acht genomen. De emissiegrenswaarde geldt voor de totale massa van de betrokken
      stoffen.
    url: https://wetten.overheid.nl/BWBR0012337/2002-05-08#Artikel4
  - number: '4.5'
    text: |-
      De uitstoot van VOS, bedoeld in het tweede of vierde lid, wordt beheerst afgevangen en uitgestoten, voor zover dit
      technisch en economisch haalbaar is, om de volksgezondheid en het milieu te beschermen.
    url: https://wetten.overheid.nl/BWBR0012337/2002-05-08#Artikel4
  - number: '4.6'
    text: |-
      Bij uitstoot van VOS waaraan na de inwerkingtreding van dit besluit een van de risicozinnen, genoemd in het tweede
      of vierde lid, wordt toegekend of die van deze zinnen behoren te zijn voorzien, worden de emissiegrenswaarden,
      genoemd in onderscheidenlijk het derde en vierde lid, zo snel mogelijk in acht genomen.
    url: https://wetten.overheid.nl/BWBR0012337/2002-05-08#Artikel4
  - number: '5'
    text: 'Degene die een inrichting drijft waarin zich een bestaande installatie bevindt, draagt zorg voor:'
    url: https://wetten.overheid.nl/BWBR0012337/2002-05-08#Artikel5
  - number: 5.a
    text: |-
      het voldoen van die installatie uiterlijk op 31 oktober 2007 aan de[ artikelen 3][ref1] en [4][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0012337#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0012337#Artikel4
    url: https://wetten.overheid.nl/BWBR0012337/2002-05-08#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0012337
        artikel: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0012337
        artikel: '4'
        paragraaf: '2'
  - number: 5.b
    text: |-
      het aanmelden van de inrichting bij het bevoegd gezag uiterlijk op 31 oktober 2005, indien hij gebruik wil maken
      van het reductieprogramma van [bijlage IIb][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012337
    url: https://wetten.overheid.nl/BWBR0012337/2002-05-08#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0012337
  - number: '6.1'
    text: |-
      Degene die een inrichting drijft, neemt alle passende voorzorgsmaatregelen om de emissies van VOS bij het starten
      en stilleggen van de installatie tot een minimum te beperken.
    url: https://wetten.overheid.nl/BWBR0012337/2002-05-08#Artikel6
  - number: '6.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing op degene die een inrichting drijft waarin zich een bestaande
      installatie bevindt, met ingang van de dag waarop die installatie voldoet aan de[ artikelen 3][ref1] en [4][ref2],
      doch uiterlijk op 31 oktober 2007.


      [ref1]: https://wetten.overheid.nl/BWBR0012337#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0012337#Artikel4
    url: https://wetten.overheid.nl/BWBR0012337/2002-05-08#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0012337
        artikel: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0012337
        artikel: '4'
        paragraaf: '2'
  - number: '7'
    text: 'Een bestaande installatie die werkt met nabehandelingsapparatuur en voldoet aan de emissiegrenswaarden van:'
    url: https://wetten.overheid.nl/BWBR0012337/2002-05-08#Artikel7
  - number: 7.a
    text: 50 mg C/Nm3, bij verbranding, of
    url: https://wetten.overheid.nl/BWBR0012337/2002-05-08#Artikel7
  - number: 7.b
    text: |-
      150 mg C/Nm3, bij elke andere nabehandelingsapparatuur, is vrijgesteld van de emissiegrenswaarden voor afgassen,
      genoemd in de tabel van [bijlage IIa][ref1], tot 1 april 2013, mits de totale emissies van de gehele installatie
      niet groter zijn dan het geval zou zijn indien aan de eisen van die tabel zou zijn voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0012337
    url: https://wetten.overheid.nl/BWBR0012337/2002-05-08#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0012337
  - number: '8.1'
    text: |-
      Het reductieprogramma, bedoeld in [bijlage IIb][ref1], ontslaat degene die een inrichting drijft, die stoffen als
      bedoeld in [artikel 4, tweede tot en met vierde lid][ref2], uitwerpt, niet van de plicht dat een installatie aan de
      eisen van die leden voldoet.


      [ref1]: https://wetten.overheid.nl/BWBR0012337
      [ref2]: https://wetten.overheid.nl/BWBR0012337#Artikel4
    url: https://wetten.overheid.nl/BWBR0012337/2002-05-08#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0012337
      - id: ref2
        bwb_id: BWBR0012337
        artikel: '4'
        paragraaf: '2'
  - number: '8.2'
    text: |-
      Het reductieprogramma, bedoeld in [bijlage IIb][ref1], noch [artikel 7][ref2] ontslaat degene die
      een inrichting drijft waarin zich een bestaande installatie bevindt, die stoffen als bedoeld in
      [artikel 4, tweede tot en met vierde lid][ref3], uitwerpt, van de plicht dat die installatie aan de eisen van
      die leden voldoet met ingang van de dag waarop het reductieprogramma en [artikel 7][ref4] op die installatie van
      toepassing is, doch uiterlijk op 31 oktober 2007.


      [ref1]: https://wetten.overheid.nl/BWBR0012337
      [ref2]: https://wetten.overheid.nl/BWBR0012337#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0012337#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0012337#Artikel7
    url: https://wetten.overheid.nl/BWBR0012337/2002-05-08#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0012337
      - id: ref2
        bwb_id: BWBR0012337
        artikel: '7'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0012337
        artikel: '4'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0012337
        artikel: '7'
        paragraaf: '2'
  - number: '9.1'
    text: |-
      Ter voldoening aan de [artikelen 3 tot en met 8][ref1], kan het bevoegd gezag bij nadere eis stellen dat een
      installatie voldoet aan voorschriften van de Nederlandse emissierichtlijn.


      [ref1]: https://wetten.overheid.nl/BWBR0012337#Artikel3
    url: https://wetten.overheid.nl/BWBR0012337/2002-05-08#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0012337
        artikel: '3'
        paragraaf: '2'
  - number: '9.2'
    text: |-
      Bij ministeriële regeling worden nadere voorschriften gegeven omtrent de van toepassing zijnde Nederlandse
      emissierichtlijn.
    url: https://wetten.overheid.nl/BWBR0012337/2002-05-08#Artikel9
  - number: '10.1'
    text: |-
      Degene die een inrichting drijft, is verplicht een afgaskanaal waarop nabehandelingsapparatuur is aangesloten en
      dat aan de uitlaatzijde gemiddeld in totaal meer dan 10 kilogram organische koolstof per uur uitwerpt, doorlopend
      te controleren of aan de emissiegrenswaarden wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0012337/2002-05-08#Artikel10
  - number: '10.2'
    text: |-
      In andere gevallen dan bedoeld in het eerste lid, is degene die een inrichting drijft, verplicht periodiek metingen
      uit te voeren, waarbij gedurende elke meting ten minste drie meetresultaten worden geregistreerd.
    url: https://wetten.overheid.nl/BWBR0012337/2002-05-08#Artikel10
  - number: '10.3'
    text: |-
      Bij ministeriële regeling worden nadere voorschriften gegeven omtrent het meten en de beoordeling van
      meetresultaten.
    url: https://wetten.overheid.nl/BWBR0012337/2002-05-08#Artikel10
  - number: '10.4'
    text: |-
      Metingen ter controle op de naleving van de emissiegrenswaarden zijn niet vereist indien nabehandelingsapparatuur
      niet noodzakelijk is om te voldoen aan dit besluit.
    url: https://wetten.overheid.nl/BWBR0012337/2002-05-08#Artikel10
  - number: '10.5'
    text: 'Bij doorlopende metingen is aan de emissiegrenswaarden voldaan indien:'
    url: https://wetten.overheid.nl/BWBR0012337/2002-05-08#Artikel10
  - number: 10.5.a
    text: |-
      geen van de gemiddelden onder normale omstandigheden gedurende 24 uur normaal bedrijf hoger is dan de
      emissiegrenswaarden, en
    url: https://wetten.overheid.nl/BWBR0012337/2002-05-08#Artikel10
  - number: 10.5.b
    text: geen van de uurgemiddelden onder normale omstandigheden hoger is dan 1,5 maal de emissiegrenswaarden.
    url: https://wetten.overheid.nl/BWBR0012337/2002-05-08#Artikel10
  - number: '10.6'
    text: 'Bij periodieke metingen is aan de emissiegrenswaarden voldaan indien bij die meting:'
    url: https://wetten.overheid.nl/BWBR0012337/2002-05-08#Artikel10
  - number: 10.6.a
    text: het gemiddelde van alle meetresultaten onder normale omstandigheden niet hoger is dan de emissiegrenswaarden, en
    url: https://wetten.overheid.nl/BWBR0012337/2002-05-08#Artikel10
  - number: 10.6.b
    text: geen van de uurgemiddelden onder normale omstandigheden hoger is dan 1,5 maal de emissiegrenswaarden.
    url: https://wetten.overheid.nl/BWBR0012337/2002-05-08#Artikel10
  - number: '10.7'
    text: |-
      Of aan de emissiegrenswaarden, bedoeld in [artikel 4, derde of vierde lid][ref1], wordt voldaan, wordt
      gecontroleerd op basis van de som van de massaconcentraties van de verschillende betrokken VOS. In alle andere
      gevallen wordt, indien in [bijlage IIa][ref2] niet anders is bepaald, gecontroleerd op basis van de totale massa
      organische koolstof die wordt uitgestoten.


      [ref1]: https://wetten.overheid.nl/BWBR0012337#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0012337
    url: https://wetten.overheid.nl/BWBR0012337/2002-05-08#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0012337
        artikel: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0012337
  - number: '10.8'
    text: |-
      Het eerste tot en met het zevende lid zijn van overeenkomstige toepassing op een bestaande installatie met ingang
      van de dag waarop die installatie voldoet aan de[ artikelen 3][ref1] en [4][ref2], doch uiterlijk op 31 oktober
      2007.


      [ref1]: https://wetten.overheid.nl/BWBR0012337#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0012337#Artikel4
    url: https://wetten.overheid.nl/BWBR0012337/2002-05-08#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0012337
        artikel: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0012337
        artikel: '4'
        paragraaf: '2'
  - number: '11.1'
    text: |-
      Degene die een inrichting drijft, voert een oplosmiddelenboekhouding aan de hand waarvan ten genoegen van het
      bevoegd gezag wordt aangetoond dat is voldaan aan:
    url: https://wetten.overheid.nl/BWBR0012337/2002-05-08#Artikel11
  - number: 11.1.a
    text: de emissiegrenswaarden voor afgassen, de diffuse- en totale emissie- grenswaarden,
    url: https://wetten.overheid.nl/BWBR0012337/2002-05-08#Artikel11
  - number: 11.1.b
    text: |-
      de eisen van het reductieprogramma krachtens [bijlage IIb][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0012337
    url: https://wetten.overheid.nl/BWBR0012337/2002-05-08#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0012337
  - number: 11.1.c
    text: |-
      [artikel 3, vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012337#Artikel3
    url: https://wetten.overheid.nl/BWBR0012337/2002-05-08#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0012337
        artikel: '3'
        paragraaf: '2'
  - number: '11.2'
    text: |-
      Bij ministeriële regeling kunnen voorschriften worden gegeven omtrent de inrichting van de
      oplosmiddelenboekhouding.
    url: https://wetten.overheid.nl/BWBR0012337/2002-05-08#Artikel11
  - number: '11.3'
    text: |-
      Het eerste en het tweede lid zijn van overeenkomstige toepassing op een bestaande installatie met ingang van de dag
      waarop die installatie aan de[ artikelen 3][ref1] en [4][ref2] voldoet, doch uiterlijk op 31 oktober 2007.


      [ref1]: https://wetten.overheid.nl/BWBR0012337#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0012337#Artikel4
    url: https://wetten.overheid.nl/BWBR0012337/2002-05-08#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0012337
        artikel: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0012337
        artikel: '4'
        paragraaf: '2'
  - number: '12'
    text: |-
      Degene die een inrichting drijft, is verplicht na een belangrijke wijziging ten genoegen van het bevoegd gezag aan
      te tonen dat aan de bij of krachtens dit besluit gegeven voorschriften wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0012337/2002-05-08#Artikel12
  - number: '13.1'
    text: |-
      Indien uit metingen of controles blijkt dat de installatie niet meer voldoet aan de bij of krachtens dit besluit
      gegeven voorschriften, stelt degene die de inrichting drijft het bevoegd gezag daarvan terstond op de hoogte en
      neemt terstond maatregelen om ervoor te zorgen dat op een zo kort mogelijke termijn weer aan die voorschriften
      wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0012337/2002-05-08#Artikel13
  - number: '13.2'
    text: |-
      Indien het eerste lid van toepassing is en er sprake is van een direct gevaar voor de menselijke gezondheid en
      zolang niet gewaarborgd kan worden dat overeenkomstig het eerste lid weer aan de eisen wordt voldaan, schort degene
      die de inrichting drijft verdere uitoefening van de activiteit op.
    url: https://wetten.overheid.nl/BWBR0012337/2002-05-08#Artikel13
  - number: '14.1'
    text: |-
      Degene die een inrichting drijft, verstrekt op verzoek van het bevoegd gezag de gegevens die het nodig heeft om na
      te gaan of aan dit besluit wordt voldaan. Tot die gegevens behoren in elk geval de resultaten van de controles en
      metingen, bedoeld in [artikel 10, eerste en tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012337#Artikel10
    url: https://wetten.overheid.nl/BWBR0012337/2002-05-08#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0012337
        artikel: '10'
        paragraaf: '3'
  - number: '14.2'
    text: |-
      Het eerste lid is niet van toepassing op degene die een inrichting drijft, indien hij de in dat lid bedoelde
      gegevens reeds verstrekt in het milieuverslag, bedoeld in [artikel 12.4 van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel12
    url: https://wetten.overheid.nl/BWBR0012337/2002-05-08#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '12'
  - number: '14.3'
    text: |-
      Bij ministeriële regeling kunnen nadere voorschriften worden gegeven omtrent het verstrekken van gegevens die het
      bevoegd gezag nodig heeft om na te gaan of aan dit besluit wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0012337/2002-05-08#Artikel14
  - number: '15'
    text: |-
      Het bevoegd gezag verstrekt de gegevens, bedoeld in de [ artikelen 13][ref1] en [14][ref2], op diens verzoek aan
      Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0012337#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0012337#Artikel14
    url: https://wetten.overheid.nl/BWBR0012337/2002-05-08#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0012337
        artikel: '13'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0012337
        artikel: '14'
        paragraaf: '5'
  - number: '16'
    text: Dit besluit treedt in werking met ingang van 1 april 2001.
    url: https://wetten.overheid.nl/BWBR0012337/2002-05-08#Artikel16
  - number: '17'
    text: 'Dit besluit wordt aangehaald als: Oplosmiddelenbesluit omzetting EG-VOS-Richtlijn milieubeheer.'
    url: https://wetten.overheid.nl/BWBR0012337/2002-05-08#Artikel17
