articles:
  - number: '1'
    text: |-
      In dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder: - *belastingentrepot:* belastingentrepot
      als bedoeld in [artikel 1a, eerste lid, van de Wet op de accijns][ref1];
        - *bemeterd leverpunt:* punt voor levering van gasvormige brandstof of elektriciteit voorzien van een
      voertuigaansluiting of een vaartuigaansluiting en een meter die de hoeveelheid van de levering meet;
        - *directe lijn:* directe lijn als bedoeld in [artikel 1.1 van de Energiewet][ref2];
        - *dubbeltellingverificateur:* verificateur als bedoeld in [artikel 9.7.4.8, tweede lid, van de wet][ref3];
        - *dubbeltellingverificatie:* verificatie als bedoeld in [artikel 9.7.4.8, tweede lid, van de wet][ref4];
        - *dubbeltellingverklaring:* verklaring als bedoeld in [artikel 9.7.4.8, tweede lid, van de wet][ref5];
        - *hernieuwbare brandstofeenheid bijlage-IX-B:* hernieuwbare brandstofeenheid bijlage-IX-B als bedoeld in
      [artikel 9.7.3.1 van de wet][ref6];
        - *hernieuwbare brandstofeenheid conventioneel:* hernieuwbare brandstofeenheid conventioneel als bedoeld in
      [artikel 9.7.3.1 van de wet][ref7];
        - *hernieuwbare brandstofeenheid geavanceerd:* hernieuwbare brandstofeenheid geavanceerd als bedoeld in
      [artikel 9.7.3.1 van de wet][ref8];
        - *hernieuwbare brandstofeenheid overig:* hernieuwbare brandstofeenheid overig als bedoeld in
      [artikel 9.7.3.1 van de wet][ref9];
        - *inboekverificateur:* verificateur als bedoeld in [artikel 9.7.4.12, eerste lid, van de wet][ref10];
        - *inboekverificatie:* verificatie als bedoeld in [artikel 9.7.4.12, eerste lid, van de wet][ref11];
        - *inboekverificatieverklaring:* verklaring als bedoeld in [artikel 9.7.4.12, eerste lid, van de wet][ref12];
        - *massabalans van hernieuwbare brandstoffen:* een boekhouding die een getrouwe weergave geeft van de in- en
      uitgaande stromen en voorraad van hernieuwbare brandstoffen van een onderneming, al dan niet op een opslaglocatie
      gedurende een bepaalde periode, bedoeld in artikel 30 van de richtlijn hernieuwbare energie en uitgevoerd
      overeenkomstig artikel 19 van [verordening (EU) 2022/996](32022R0996), als onderdeel van een door de inboeker
      gehanteerd vrijwillig systeem;
        - *materiële afwijking:* onjuistheid die, afzonderlijk of in combinatie met andere onjuistheden, de gestelde
      materialiteitsgrens overschrijdt;
        - *materialiteitsgrens:* kwantitatieve drempel of grenswaarde waarboven onjuistheden, afzonderlijk of in combinatie
      met andere onjuistheden, door de verificateur als materieel worden beschouwd;
        - *opslaglocatie:* een opslagtank op land of op water met een vast adres, als onderdeel van een
      accijnsgoederenplaats als bedoeld in [artikel 1a, eerste lid, van de Wet op de accijns][ref13] voor minerale oliën
      of belasting-entrepot voor minerale oliën;
        - *Raad voor Accreditatie:* Raad voor Accreditatie als bedoeld in
      [artikel 1, onderdeel e, van de Wet aanwijzing nationale accreditatie-instantie][ref14];
        - *redelijke mate van zekerheid:* een hoge, maar niet absolute, mate van zekerheid ten aanzien van de vraag of
      de in de dubbeltellingverklaring verantwoorde biobrandstof of de in de inboekverificatieverklaring verantwoorde
      inboekingen in het register vrij zijn van materiële onjuistheden;
        - *rekeninghouder:* onderneming die beschikt over een rekening als bedoeld in [artikel 9.7.5.3 van de wet][ref15];
        - *soort hernieuwbare energie:* de soorten hernieuwbare energie, bedoeld in
      [artikel 9.7.4.1, eerste lid, van de wet][ref16];
        - *van landbouw, aquacultuur, visserij of bosbouw afkomstige afvalstoffen en residuen:* afvalstoffen en residuen
      die rechtstreeks afkomstig zijn uit de landbouw, de aquacultuur, visserij en de bosbouw, en die geen afvalstoffen
      of residuen van aanverwante bedrijfstakken of verwerking omvatten;
        - *vrijwillig systeem:* door de Europese Commissie erkend vrijwillig systeem voor het certificeren dat een
      hernieuwbare brandstof voldoet aan de broeikasgasemissiereductiecriteria, bedoeld in artikel 30, vierde lid, van de
      richtlijn hernieuwbare energie;
        - *wet:* [Wet milieubeheer][ref17].


