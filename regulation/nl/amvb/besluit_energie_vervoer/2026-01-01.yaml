    text: |-
      de leverancier tot eindverbruik over het kalenderjaar waarin zijn levering tot eindverbruik opgeteld minder is dan
      500.000 liter;
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel2
  - number: 2.1.b
    text: zijn levering tot eindverbruik aan zeevaart en binnenvaart;
