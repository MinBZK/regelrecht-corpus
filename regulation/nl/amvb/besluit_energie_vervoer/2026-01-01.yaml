      Indien het aantal hernieuwbare brandstofeenheden bijlage IX-B op een rekening minder dan nul is, worden
      bijgeschreven hernieuwbare brandstofeenheden bijlage IX-B, overig en geavanceerd in deze volgorde afgeschreven.
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel6
  - number: '6.3'
    text: |-
      Indien het aantal hernieuwbare brandstofeenheden overig op een rekening minder dan nul is, worden bijgeschreven
      hernieuwbare brandstofeenheden overig en geavanceerd in deze volgorde afgeschreven.
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel6
  - number: '6.4'
    text: |-
      Indien het aantal hernieuwbare brandstofeenheden geavanceerd op een rekening minder dan nul is, worden
      bijgeschreven hernieuwbare brandstofeenheden geavanceerd afgeschreven.
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel6
  - number: '7.1'
    text: |-
      Vloeibare biobrandstof die aan de Nederlandse markt geleverd wordt, kan slechts worden ingeboekt in het register
      door een onderneming die:
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel7
  - number: 7.1.a
    text: |-
      houder is van een vergunning voor een accijnsgoederenplaats als bedoeld in
      [artikel 1a, eerste lid, van de Wet op de accijns][ref1] voor minerale oliën;


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel1a
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: 1a
  - number: 7.1.b
    text: |-
      geregistreerd geadresseerde is als bedoeld in [artikel 1a, eerste lid, van de Wet op de accijns][ref1] voor
      minerale oliën; of


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel1a
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: 1a
  - number: 7.1.c
    text: importeur is.
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel7
  - number: '7.2'
    text: |-
      De onderneming, genoemd in het eerste lid, die vanaf een andere dan zijn eigen accijnsgoederenplaats levert
      aan de Nederlandse markt, voert een massabalanssysteem als bedoeld in artikel 30, eerste lid, van de richtlijn
      hernieuwbare energie over de accijnsgoederenplaats of belastingentrepot.
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel7
  - number: '7.3'
    text: |-
      Vloeibare biobrandstof die wordt ingeboekt in het register, voldoet aan de duurzaamheids- en
      broeikasgasemissiereductiecriteria, bedoeld in artikel 29, tweede tot en met zevende lid en tiende lid, van de
      richtlijn hernieuwbare energie.
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel7
  - number: '7.4'
    text: |-
      In afwijking van het derde lid voldoet vloeibare biobrandstof die vervaardigd is uit niet van landbouw,
      aquacultuur, visserij of bosbouw afkomstige afvalstoffen en residuen, ook indien deze afvalstoffen en
      residuen in een product zijn verwerkt alvorens ze verder wordt verwerkt in een vloeibare biobrandstof, aan de
      broeikasgasemissiereductiecriteria, bedoeld in artikel 29, tiende lid, van de richtlijn hernieuwbare energie.
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel7
  - number: '7.5'
    text: Voor vloeibare biobrandstof die wordt ingeboekt in het register is geen exploitatiesubsidie betaald.
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel7
  - number: '7.6'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld voor het aantonen, bedoeld in
      [artikel 9.7.1.1, onderdeel «leveren aan de Nederlandse markt»][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
  - number: '8.1'
    text: |-
      Gasvormige biobrandstof die aan vervoer in Nederland wordt geleverd met behulp van het transmissie- of
      distributiesysteem voor gas, bedoeld in [artikel 1.1 van de Energiewet][ref1], kan slechts worden ingeboekt in het
      register door een onderneming die aangeslotene is als bedoeld in artikel 1.1 van die wet en die:


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel1
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '1'
  - number: 8.1.a
    text: |-
      een aansluiting heeft als bedoeld in [artikel 1.1 van die wet][ref1], die uitsluitend bestemd is voor de levering
      van gas aan vervoer in Nederland en gekoppeld is aan een bemeterd leverpunt; of


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel1
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '1'
  - number: 8.1.b
    text: |-
      over een bemeterd leverpunt beschikt, voorzien van een geregeld meetinstrument als bedoeld in
      [artikel 1 van de Metrologiewet][ref1], met een geldige conformiteitsbeoordeling als bedoeld in
      [artikel 6 van die wet][ref2] en voorzien van de voor dat meetinstrument voorgeschreven merktekens als bedoeld in
      [artikel 8 van die wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0019517#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0019517#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0019517#Artikel8
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0019517
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0019517
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0019517
        artikel: '8'
  - number: '8.2'
    text: |-
      Gasvormige biobrandstof die aan vervoer in Nederland geleverd wordt met behulp van een directe lijn, kan slechts
      worden ingeboekt in het register door de onderneming die gasvormige biobrandstof) levert met behulp van een
      bemeterd leverpunt.
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel8
  - number: '8.3'
    text: |-
      Gasvormige biobrandstof die wordt ingeboekt in het register voldoet aan de duurzaamheids- en
      broeikasgasemissiereductiecriteria, bedoeld in artikel 29, tweede tot en met zevende lid en tiende lid, van de
      richtlijn hernieuwbare energie.
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel8
  - number: '8.4'
    text: |-
      In afwijking van het derde lid voldoet gasvormige biobrandstof die vervaardigd is uit niet van landbouw,
      aquacultuur, visserij of bosbouw afkomstige afvalstoffen en residuen, ook indien deze afvalstoffen en
      residuen in een product zijn verwerkt alvorens ze verder wordt verwerkt in een gasvormige biobrandstof, aan de
      broeikasgasemissiereductiecriteria, bedoeld in artikel 29, tiende lid, van de richtlijn hernieuwbare energie.
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel8
  - number: '8.5'
    text: Voor gasvormige biobrandstof die wordt ingeboekt in het register is geen exploitatiesubsidie betaald.
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel8
  - number: '9.1'
    text: |-
      Vloeibare hernieuwbare brandstof die aan vervoer in Nederland geleverd wordt, kan slechts worden ingeboekt in het
      register door een onderneming die:
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel9
  - number: 9.1.a
    text: |-
      houder is van een vergunning voor een accijnsgoederenplaats als bedoeld in
      [artikel 1a, eerste lid, van de Wet op de accijns][ref1] voor minerale oliën;


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel1a
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: 1a
  - number: 9.1.b
    text: |-
      geregistreerde geadresseerde is als bedoeld in [artikel 1a, eerste lid, van de Wet op de accijns][ref1] voor
      minerale oliën; of


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel1a
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: 1a
  - number: 9.1.c
    text: importeur is.
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel9
  - number: '9.2'
    text: 'De in te boeken vloeibare hernieuwbare brandstof:'
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel9
  - number: 9.2.a
    text: |-
      bevond zich direct voorafgaand aan de levering aan de Nederlandse markt op een opslaglocatie van de inboeker die
      door het door hem gehanteerde vrijwillige systeem is gecertificeerd, dan wel op een andere opslaglocatie voor zover
      die certificering zich over die locatie uitstrekt; en
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel9
  - number: 9.2.b
    text: |-
      voldoet aan de broeikasgasemissiereductiedrempels, bedoeld in artikel 25, tweede lid, van de richtlijn hernieuwbare
      energie.
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel9
  - number: '9.3'
    text: |-
      De onderneming, genoemd in het eerste lid, voert een massabalans van hernieuwbare brandstoffen over zijn
      opslaglocatie, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel9
  - number: 9a.1
    text: |-
      Gasvormige hernieuwbare brandstof die als waterstof aan vervoer in Nederland geleverd wordt, kan slechts worden
      ingeboekt in het register door een onderneming die gecertificeerd is door een vrijwillig systeem en die beschikt
      over een vergunning bij of krachtens de [Omgevingswet][ref1] voor de ontvangst, de opslag en de verkoop van
      waterstof en die beschikt over een bemeterd leverpunt.


      [ref1]: https://wetten.overheid.nl/BWBR0037885
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0037885
  - number: 9a.2
    text: |-
      In afwijking van het eerste lid kan gasvormige hernieuwbare brandstof die als waterstof geleverd wordt aan
      binnenschepen en zeeschepen worden ingeboekt in het register door een onderneming die gecertificeerd is door
      een vrijwillig systeem en die de gasvormige hernieuwbare brandstof produceert en levert met behulp van een
      waterstofcontainer.
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel9a
  - number: 9a.3
    text: |-
      Gasvormige hernieuwbare brandstof die wordt ingeboekt in het register voldoet aan de
      broeikasgasemissiereductiedrempels, bedoeld in artikel 25, tweede lid, van de richtlijn hernieuwbare energie.
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel9a
  - number: '10.1'
    text: |-
      Elektriciteit die geleverd wordt aan de bestemmingen, bedoeld in
      [artikel 9.7.4.1, eerste lid, onderdeel e, van de wet][ref1], kan slechts worden ingeboekt in het register door een
      onderneming die aangeslotene is als bedoeld in [artikel 1.1 van de Energiewet][ref2] en die:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0050714#Artikel1
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0050714
        artikel: '1'
  - number: 10.1.a
    text: |-
      een aansluiting heeft als bedoeld in [artikel 1.1 van die wet][ref1] die, dan wel een allocatiepunt, niet zijnde
      een primair allocatiepunt als bedoeld in artikel 1.1 van die wet dat, uitsluitend bestemd is voor de levering van
      elektriciteit aan die bestemmingen en gekoppeld is aan een bemeterd leverpunt;


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel1
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '1'
  - number: 10.1.b
    text: |-
      beschikt over een bemeterd leverpunt, voorzien van een geregeld meetinstrument als bedoeld in
      [artikel 1 van de Metrologiewet][ref1], met een geldige conformiteitsbeoordeling als bedoeld in
      [artikel 6 van die wet][ref2] en voorzien van de voor dat meetinstrument voorgeschreven merktekens als bedoeld in
      [artikel 8 van die wet][ref3]; of


      [ref1]: https://wetten.overheid.nl/BWBR0019517#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0019517#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0019517#Artikel8
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0019517
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0019517
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0019517
        artikel: '8'
  - number: 10.1.c
    text: |-
      een aansluiting heeft als bedoeld in [artikel 1, eerste lid, onderdeel b, van die wet][ref1] die uitsluitend
      bestemd is voor de levering van elektriciteit aan die bestemmingen en die als onderneming openbaar vervoersdiensten
      aanbiedt.


      [ref1]: https://wetten.overheid.nl/BWBR0019517#Artikel1
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0019517
        artikel: '1'
  - number: '10.2'
    text: |-
      Elektriciteit die geleverd wordt aan de bestemmingen als bedoeld in
      [artikel 9.7.4.1, eerste lid, onderdeel e, van de wet][ref1], met behulp van een directe lijn, kan slechts worden
      ingeboekt in het register door een onderneming die elektriciteit levert met behulp van een bemeterd leverpunt.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
  - number: '10.3'
    text: |-
      In afwijking van het eerste lid kan elektriciteit die geleverd wordt aan binnenvaartschepen worden ingeboekt in het
      register door een onderneming die de elektriciteit levert met behulp van een accupakket of elektrolyt.
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel10
  - number: '10.4'
    text: |-
      Voor elektriciteit als bedoeld in het tweede lid, die wordt opgewekt met biomassabrandstoffen als bedoeld in
      artikel 2, zevenentwintigste lid, van de richtlijn hernieuwbare energie, voldoen bedoelde biomassabrandstoffen aan
      de duurzaamheids- en broeikasgasemissiereductiecriteria, bedoeld in artikel 29, tweede tot en met zevende lid en
      tiende lid, en aan de efficiëntie-eisen, bedoeld in artikel 29, elfde lid, van die richtlijn.
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel10
  - number: '10.5'
    text: |-
      Voor de elektriciteit als bedoeld in het tweede lid die wordt ingeboekt in het register is geen exploitatiesubsidie
      betaald.
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel10
  - number: '10.6'
    text: 'Bij ministeriële regeling kunnen regels worden gesteld over:'
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel10
  - number: 10.6.a
    text: elektriciteit die geleverd wordt met behulp van een directe lijn als bedoeld in het tweede lid;
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel10
  - number: 10.6.b
    text: het aantonen van geleverde elektriciteit met behulp van een accupakket of elektrolyt als bedoeld in het derde lid;
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel10
  - number: 10.6.c
    text: |-
      het aantonen of de geleverde elektriciteit tot een aanvullende hernieuwbare energieproductiecapaciteit heeft
      geleid.
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel10
  - number: '12.1'
    text: |-
      De energie-inhoud van de biobrandstof die is geproduceerd uit grondstoffen als bedoeld in
      [artikel 9.7.4.6, eerste lid, onderdeel b, of onderdeel c, van de wet][ref1], wordt bij inboeking in het register
      vermenigvuldigd met een bij ministeriële regeling te bepalen factor.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
  - number: '12.2'
    text: |-
      De energie-inhoud van bij ministeriële regeling aangewezen soorten hernieuwbare brandstof wordt bij inboeking in
      het register vermenigvuldigd met een bij ministeriële regeling te bepalen factor, onder bij ministeriële regeling
      te stellen voorwaarden.
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel12
  - number: '13.1'
    text: |-
      Het bestuur van de emissieautoriteit kan met toepassing van [artikel 9.7.4.11, eerste lid, van de wet][ref1] het
      bijschrijven van hernieuwbare brandstofeenheden voor ten hoogste vier weken opschorten. Het bestuur doet van de
      opschorting onverwijld mededeling aan de inboeker.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
  - number: '13.2'
    text: |-
      Het bestuur van de emissieautoriteit beslist binnen de termijn, bedoeld in het eerste lid, over de bijschrijving
      van de hernieuwbare brandstofeenheden. Indien niet binnen die termijn is beslist, schrijft het bestuur de
      hernieuwbare brandstofeenheden bij op de rekening van de inboeker.
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel13
  - number: '13.3'
    text: |-
      De termijn, bedoeld in het eerste lid, kan eenmaal met ten hoogste vier weken worden verlengd. Het tweede lid is
      van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel13
  - number: '14.1'
    text: |-
      De gevolgen van een ambtshalve vaststelling als bedoeld in [artikel 9.7.4.13, eerste lid, van de wet][ref1], worden
      verrekend met het saldo van het lopende kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
  - number: '14.2'
    text: |-
      [Artikel 5][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0040922#Artikel5
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0040922
        artikel: '5'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: '15.1'
    text: |-
      Onze Minister keurt op aanvraag van de verificateur, bedoeld in de [artikelen 19][ref1] en [22][ref2], een
      verificatieprotocol, of wijzigingen daarvan, goed.


      [ref1]: https://wetten.overheid.nl/BWBR0040922#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0040922#Artikel22
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0040922
        artikel: '19'
        hoofdstuk: '1'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0040922
        artikel: '22'
        hoofdstuk: '1'
        paragraaf: '4'
  - number: '15.2'
    text: |-
      Onze Minister verleent goedkeuring aan het verificatieprotocol, of wijzigingen daarvan, indien hij een
      gerechtvaardigd vertrouwen heeft dat de verklaringen, bedoeld in de [artikelen 20][ref1] en [23][ref2], op een
      juiste wijze tot stand komen.


      [ref1]: https://wetten.overheid.nl/BWBR0040922#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0040922#Artikel23
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0040922
        artikel: '20'
        hoofdstuk: '1'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0040922
        artikel: '23'
        hoofdstuk: '1'
        paragraaf: '4'
  - number: '15.3'
    text: |-
      Onze Minister beslist binnen twaalf weken na ontvangst van een aanvraag als bedoeld in het eerste lid. De termijn
      kan eenmaal met ten hoogste vier weken worden verlengd.
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel15
  - number: '15.4'
    text: |-
      De goedkeuring geldt voor de duur van een door onze Minister te bepalen termijn van ten hoogste vijf kalenderjaren,
      met inbegrip van het kalenderjaar waarin de goedkeuring is gegeven.
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel15
  - number: '19'
    text: |-
      De dubbeltellingverificateur voert de verificatiewerkzaamheden op een onbevangen en onpartijdige wijze uit, werkt
      overeenkomstig een goedgekeurd verificatieprotocol als bedoeld in [artikel 15][ref1] en is voor het onderdeel
      dubbeltelling van het werkveld hernieuwbare energie vervoer:


      [ref1]: https://wetten.overheid.nl/BWBR0040922#Artikel15
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0040922
        artikel: '15'
        hoofdstuk: '1'
        paragraaf: '4'
  - number: 19.a
    text: geaccrediteerd of tijdelijk geaccrediteerd onder beperkende voorwaarden door de Raad voor Accreditatie;
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel19
  - number: 19.b
    text: |-
      geaccrediteerd of tijdelijk geaccrediteerd onder beperkende voorwaarden door een nationale accreditatie-instantie
      als bedoeld in artikel 4, eerste lid, van verordening (EG) nr. 765/2008 van het Europees Parlement en de Raad van
      de Europese Unie van 9 juli 2008 tot vaststelling van de eisen inzake accreditatie en markttoezicht betreffende het
      verhandelen van producten en tot intrekking van [verordening (EEG) 339/93](31993R0339) (PbEU 2008, L 218).
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel19
  - number: '20.1'
    text: |-
      De dubbeltellingverificateur verkrijgt een redelijke mate van zekerheid dat de in de dubbeltellingverklaring
      verantwoorde biobrandstof geen materiële afwijkingen bevat. De dubbeltellingverificateur verzamelt hiervoor
      toereikende controle-informatie en zorgt voor een aanvaardbaar laag controlerisico.
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel20
  - number: '20.2'
    text: |-
      De dubbeltellingverificateur toetst met een materialiteitsgrens van twee procent de aard van de gebruikte grondstof
      in relatie tot de dubbeltelling van de biobrandstof, alsmede de totale hoeveelheid gebruikte grondstof in relatie
      tot de hoeveelheid geproduceerde dubbel tellende biobrandstof waarop de dubbeltellingverklaring betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel20
  - number: '20.3'
    text: |-
      De dubbeltellingverificateur trekt onverwijld een verklaring in die is afgegeven in strijd met de eisen, bedoeld in
      [artikel 9.7.4.8, eerste lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
  - number: '21'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld over de dubbeltellingverificatie.
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel21
  - number: '22.1'
    text: |-
      De inboekverificateur voert de verificatiewerkzaamheden op een onbevangen en onpartijdige wijze uit, werkt
      overeenkomstig een goedgekeurd verificatieprotocol als bedoeld in [artikel 15][ref1] en is voor het onderdeel
      inboeken van het werkveld hernieuwbare energie vervoer:


      [ref1]: https://wetten.overheid.nl/BWBR0040922#Artikel15
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0040922
        artikel: '15'
        hoofdstuk: '1'
        paragraaf: '4'
  - number: 22.1.a
    text: geaccrediteerd of tijdelijk geaccrediteerd onder beperkende voorwaarden door de Raad voor Accreditatie, of
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel22
  - number: 22.1.b
    text: |-
      geaccrediteerd of tijdelijk geaccrediteerd onder beperkende voorwaarden door een nationale accreditatie-instantie
      als bedoeld in artikel 4, eerste lid, van verordening (EG) nr. 765/2008 van het Europees Parlement en de Raad van
      de Europese Unie van 9 juli 2008 tot vaststelling van de eisen inzake accreditatie en markttoezicht betreffende het
      verhandelen van producten en tot intrekking van [Verordening (EEG) 339/93](31993R0339) (PbEU 2008, L 218).
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel22
  - number: '22.2'
    text: |-
      Het bestuur van de emissieautoriteit kan een instelling als bedoeld in het eerste lid die voldoet aan de eisen,
      gesteld in dat lid, opnemen in het register.
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel22
  - number: '23.1'
    text: |-
      De inboekverificateur verkrijgt een redelijke mate van zekerheid dat de in de inboekverificatieverklaring
      verantwoorde inboekingen in het register geen materiële afwijking bevatten.
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel23
  - number: '23.2'
    text: |-
      De inboekverificateur toetst met een materialiteitsgrens van twee procent van de totale hoeveelheid ingeboekte
      hernieuwbare energie per geleverde soort hernieuwbare energie waarop de verificatieverklaring betrekking heeft:
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel23
  - number: 23.2.a
    text: |-
      de hoeveelheid ingeboekte hernieuwbare energie naar energie-inhoud in verhouding tot de aantoonbaar geleverde
      hoeveelheid hernieuwbare energie;
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel23
  - number: 23.2.b
    text: de overname van de kenmerken van en gegevens over de ingeboekte hernieuwbare energie; en
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel23
  - number: 23.2.c
    text: |-
      de levering aan de bestemmingen, bedoeld in [artikel 9.7.4.1, eerste lid, van de wet][ref1], zoals die blijkt uit
      de bedrijfsadministratie.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
  - number: '23.3'
    text: Indien de inboekverificateur geen inboekverificatieverklaring afgeeft, stelt hij een rapport van bevindingen op.
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel23
  - number: '24'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld over de inboekverificatie.
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel24
  - number: '25'
    text: |-
      Als categorie als bedoeld in [artikel 9.7.5.3, derde lid, van de wet][ref1] worden aangewezen:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
  - number: 25.a
    text: |-
      ondernemingen die houder zijn van een vergunning voor een accijnsgoederenplaats als bedoeld in
      [artikel 1a, eerste lid, van de Wet op de accijns][ref1] voor minerale oliën;


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel1a
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: 1a
  - number: 25.b
    text: publiekrechtelijke rechtspersonen.
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel25
  - number: '26'
    text: |-
      Aan de eisen, bedoeld in [artikel 9.7.5.4, eerste lid, van de wet][ref1] is in elk geval niet voldaan indien de
      aanvrager niet:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
  - number: 26.a
    text: heeft aangetoond de voor de aangevraagde rekening vereiste hoedanigheid te bezitten;
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel26
  - number: 26.b
    text: de vereiste gegevens heeft overgelegd.
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel26
  - number: '27'
    text: |-
      Een vermoeden van fraude of misbruik van een rekening als bedoeld in [artikel 9.7.5.4 van de wet][ref1] bestaat in
      elk geval, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
  - number: 27.a
    text: |-
      de handelingen met betrekking tot de rekening afwijken van het gebruikelijke patroon van handelingen met betrekking
      tot die rekening;
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel27
  - number: 27.b
    text: derden zich mogelijk toegang tot de rekening hebben verschaft, of
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel27
  - number: 27.c
    text: de rekeninghouder een vermoeden van fraude of misbruik heeft geuit.
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel27
  - number: '28.1'
    text: 'Het bestuur van de emissieautoriteit kan een rekening in elk geval ambtshalve opheffen indien:'
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel28
  - number: 28.1.a
    text: de rekeninghouder niet langer de hoedanigheid bezit op basis waarvan hij een rekening heeft gekregen;
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel28
  - number: 28.1.b
    text: ondanks herhaalde kennisgevingen de gronden voor de blokkering niet binnen een redelijke termijn zijn opgeheven;
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel28
  - number: 28.1.c
    text: gedurende twaalf maanden geen activiteit is geweest op de rekening.
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel28
  - number: '28.2'
    text: |-
      Een rekening met inboekfaciliteit of een rekening met uitsluitend overboekfaciliteit kan op verzoek van de
      rekeninghouder worden opgeheven.
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel28
  - number: '28.3'
    text: |-
      Een rekening wordt niet opgeheven als op de rekeninghouder nog een verplichting rust als bedoeld in de
      [artikelen 9.7.2.5, vijfde lid][ref1], of [9.7.4.13, vijfde lid, van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '9'
  - number: '29.1'
    text: |-
      Het gedeelte, bedoeld in [artikel 9.7.5.6, eerste lid, van de wet][ref1], komt overeen met ten hoogste 1.000
      hernieuwbare brandstofeenheden of, indien toepassing van het tweede of derde lid leidt tot meer dan 1.000
      hernieuwbare brandstofeenheden, het in dat lid genoemde percentage. Indien een onderneming zowel leverancier tot
      eindverbruik als inboeker is, geldt de voor die onderneming gunstigste bepaling.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
  - number: '29.2'
    text: |-
      Voor de leverancier tot eindverbruik bedraagt het gedeelte, bedoeld in
      [artikel 9.7.5.6, eerste lid, van de wet][ref1], ten hoogste 10 procent van het aantal hernieuwbare
      brandstofeenheden dat hij verschuldigd is over het kalenderjaar dat direct voorafgaat aan de datum, bedoeld in
      artikel 9.7.5.6, eerste lid, van de wet.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
  - number: '29.3'
    text: |-
      Voor de inboeker bedraagt het gedeelte, bedoeld in [artikel 9.7.5.6, eerste lid, van de wet][ref1], ten hoogste
      4 procent van het aantal hernieuwbare brandstofeenheden dat door het bestuur van de emissieautoriteit op zijn
      rekening is bijgeschreven voor hernieuwbare energie die hij heeft geleverd in het kalenderjaar dat direct
      voorafgaat aan de datum, bedoeld in artikel 9.7.5.6, eerste lid, van de wet.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
  - number: '29.4'
    text: |-
      Voor de toepassing van het eerste tot en met derde lid, wordt het aantal hernieuwbare brandstofeenheden gespaard in
      de volgende volgorde:
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel29
  - number: 29.4.a
    text: hernieuwbare brandstofeenheden geavanceerd;
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel29
  - number: 29.4.b
    text: hernieuwbare brandstofeenheden overig;
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel29
  - number: 29.4.c
    text: hernieuwbare brandstofeenheden bijlage IX-B;
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel29
  - number: 29.4.d
    text: hernieuwbare brandstofeenheden conventioneel.
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel29
  - number: '30'
    text: |-
      Het bestuur van de emissieautoriteit rapporteert over het laatst verstreken kalenderjaar jaarlijks aan Onze
      Minister:
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel30
  - number: 30.a
    text: de totale energie-inhoud per ingeboekte soort hernieuwbare energie;
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel30
  - number: 30.b
    text: |-
      de aard en herkomst van de grondstof van de totale hoeveelheid ingeboekte vloeibare en gasvormige biobrandstof,
      alsmede de gehanteerde duurzaamheidsystemen.
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel30
  - number: '31'
    text: |-
      Het overzicht, bedoeld in [artikel 9.7.4.7, eerste lid, van de wet][ref1], vermeldt met betrekking tot het gedeelte
      van het kalenderjaar of het kalenderjaar waarop het overzicht betrekking heeft:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
  - number: 31.a
    text: het aantal per soort op rekeningen in het register bijgeschreven hernieuwbare brandstofeenheden;
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel31
  - number: 31.b
    text: het aantal per soort in dat kalenderjaar gespaarde hernieuwbare brandstofeenheden;
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel31
  - number: 31.c
    text: |-
      het aantal op 1 mei afgeschreven hernieuwbare brandstofeenheden van rekeningen van publiekrechtelijke
      rechtspersonen.
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel31
  - number: '32'
    text: |-
      Het overzicht, bedoeld in [artikel 9.7.4.14, eerste lid, van de wet][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
  - number: 32.a
    text: wordt langs elektronische weg bekendgemaakt;
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel32
  - number: 32.b
    text: heeft betrekking op het laatste kalenderjaar dat is verstreken voor de datum van openbaarmaking, en
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel32
  - number: 32.c
    text: |-
      vermeldt in afzonderlijke overzichten de aard van de grondstoffen, de herkomst van de grondstoffen en de
      gehanteerde duurzaamheidsystemen.
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel32
  - number: '33'
    text: |-
      In dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder: - *hernieuwbare brandstofeenheid:*
      hernieuwbare brandstofeenheid als bedoeld in [artikel 9.7.3.1 van de wet][ref1];
        - *LPG:* vloeibaar gemaakt petroleumgas als bedoeld in [artikel 26, zesde lid, van de Wet op de accijns][ref2] en
      minerale oliën die op grond van [artikel 28, met uitzondering van het tweede en zesde lid, van die wet][ref3] voor
      het tarief van vloeibaar gemaakt petroleumgas aan de accijns onderworpen zijn;
        - *rekeninghouder:* onderneming die beschikt over een rekening als bedoeld in [artikel 9.8.4.3 van de wet][ref4];
        - *wet:* [Wet milieubeheer][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel26
      [ref3]: https://wetten.overheid.nl/BWBR0005251#Artikel28
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Artikel9
      [ref5]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0005251
        artikel: '26'
      - id: ref3
        bwb_id: BWBR0005251
        artikel: '28'
      - id: ref4
        bwb_id: BWBR0003245
        artikel: '9'
      - id: ref5
        bwb_id: BWBR0003245
  - number: '34'
    text: |-
      De in [titel 9.8 van de wet][ref1] opgenomen bepalingen met betrekking tot de rapportageplichtige zijn niet van
      toepassing op de rapportageplichtige over het kalenderjaar waarin zijn uitslag tot vervoersverbruik opgeteld minder
      is dan 500.000 liter, kilogram of Nm3.


      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0003245
  - number: '35'
    text: |-
      Het percentage, bedoeld in [artikel 9.8.2.1, eerste lid, van de wet][ref1] bedraagt zes procent voor elk
      kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
  - number: '36.1'
    text: |-
      Een ambtshalve vaststelling als bedoeld in [artikel 9.8.2.4, eerste of tweede lid, van de wet][ref1],
      wordt gemaakt op basis van een redelijke inschatting, waarbij het bestuur van de emissieautoriteit zich
      in ieder geval baseert op de gegevens van de rijksbelastingdienst over de uitslag tot verbruik, bedoeld in
      [artikel 2 van de Wet op de accijns][ref2], van benzine, diesel en LPG.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel2
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0005251
        artikel: '2'
  - number: '36.2'
    text: |-
      De gevolgen van een ambtshalve vaststelling als bedoeld in
      [artikel 9.8.2.4, eerste of tweede lid, van de wet][ref1], worden verrekend met het saldo van het lopende
      kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
  - number: '37.1'
    text: |-
      Bij de afschrijving, bedoeld in [artikel 9.8.2.5, eerste lid, onderdeel b, van de wet][ref1], wordt
      het aantal per soort hernieuwbare brandstofeenheden afgeschreven, volgens de volgorde, bedoeld in
      [artikel 5, eerste lid, onderdelen b tot en met e][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0040922#Artikel5
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0040922
        artikel: '5'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: '37.2'
    text: |-
      [Artikel 5, tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0040922#Artikel5
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0040922
        artikel: '5'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: '38'
    text: |-
      [Artikel 6][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0040922#Artikel6
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0040922
        artikel: '6'
        hoofdstuk: '1'
        paragraaf: '3'
  - number: '42'
    text: |-
      Bij ministeriële regeling worden regels gesteld over het tijdstip van de jaarlijkse vaststelling en de berekening
      van de broeikasgasemissiereductiebijdrage van hernieuwbare brandstofeenheden.
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel42
  - number: '43'
    text: |-
      Aan de eisen, bedoeld in [artikel 9.8.4.4, eerste lid, van de wet][ref1] is in elk geval niet voldaan indien de
      aanvrager niet:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
  - number: 43.a
    text: heeft aangetoond de voor de aangevraagde rekening vereiste hoedanigheid te bezitten;
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel43
  - number: 43.b
    text: de vereiste gegevens heeft overgelegd.
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel43
  - number: '44'
    text: |-
      Een vermoeden van fraude of misbruik van een rekening als bedoeld in [artikel 9.8.4.4 van de wet][ref1] bestaat in
      elk geval, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
  - number: 44.a
    text: |-
      de handelingen met betrekking tot de rekening afwijken van het gebruikelijke patroon van handelingen met betrekking
      tot die rekening;
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel44
  - number: 44.b
    text: derden zich mogelijk toegang tot de rekening hebben verschaft, of
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel44
  - number: 44.c
    text: de rekeninghouder een vermoeden van fraude of misbruik heeft geuit.
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel44
  - number: '45.1'
    text: |-
      Het bestuur van de emissieautoriteit kan een rekening als bedoeld in [artikel 9.8.4.4 van de wet][ref1] in elk
      geval ambtshalve opheffen indien:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
  - number: 45.1.a
    text: de rekeninghouder niet langer de hoedanigheid bezit op basis waarvan hij een rekening heeft gekregen;
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel45
  - number: 45.1.b
    text: ondanks herhaalde kennisgevingen de gronden voor de blokkering niet binnen een redelijke termijn zijn opgeheven;
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel45
  - number: 45.1.c
    text: gedurende twaalf maanden geen activiteit is geweest op de rekening.
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel45
  - number: '45.2'
    text: |-
      Een rekening wordt niet opgeheven als op de rekeninghouder nog een verplichting rust als bedoeld in
      [artikel 9.8.2.5, vijfde lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
  - number: '46.1'
    text: |-
      Het gedeelte, bedoeld in [artikel 9.8.4.6, eerste lid, van de wet][ref1], komt overeen met ten hoogste 1.000
      hernieuwbare brandstofeenheden.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
  - number: '46.2'
    text: |-
      Voor de toepassing van het eerste lid, is [artikel 29, vierde lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0040922#Artikel29
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0040922
        artikel: '29'
        hoofdstuk: '1'
        paragraaf: '5'
  - number: '47'
    text: |-
      Het bestuur van de emissieautoriteit rapporteert over het laatst verstreken kalenderjaar jaarlijks aan Onze
      Minister de soorten en de totale hoeveelheid gerapporteerde benzine, diesel en beter fossiele brandstof.
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel47
  - number: '50'
    text: |-
      Het [Besluit hernieuwbare energie vervoer 2015][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0035839
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0035839
  - number: '52'
    text: 'Dit besluit wordt aangehaald als: Besluit energie vervoer.'
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel52
  - number: '53'
    text: |-
      De artikelen van dit besluit treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel53
