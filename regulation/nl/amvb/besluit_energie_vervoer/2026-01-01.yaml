  - number: 2.1.c
    text: |-
      zijn levering tot eindverbruik van dierlijke bijproducten die hij op locatie gebruikt als brandstof voor
      verwarming.
    url: https://wetten.overheid.nl/BWBR0040922/2026-01-01#Artikel2
  - number: '2.2'
    text: |-
