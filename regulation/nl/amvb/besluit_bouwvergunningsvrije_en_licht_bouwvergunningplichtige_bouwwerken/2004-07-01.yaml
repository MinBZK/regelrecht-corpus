  - number: '7'
    text: |-
      Criteria als bedoeld in [artikel 12a, eerste lid, van de wet][ref1] ten aanzien van het bouwen, bedoeld in
      [artikel 4][ref2], beschrijven de welstand uitputtend en hebben uitsluitend betrekking op de plaatsing, de vorm, de
      maatvoering, het materiaalgebruik en de kleur.


