  - number: '6'
    text: |-
      Een lichte bouwvergunning is voorts vereist voor het bouwen:

      a. bedoeld in [artikel 43, eerste lid, onderdelen a en b, van de wet][ref1], indien dat plaatsvindt:

      1°. in, op, aan of bij een monument als bedoeld in de [Monumentenwet 1988][ref2] of een monument als bedoeld in een
      provinciale of gemeentelijke monumentenverordening, of

      2°. in een beschermd stads- of dorpsgezicht als bedoeld in de [Monumentenwet 1988][ref3];

      b. van een balkon, mits de bruto-oppervlakte minder is dan 2 m2;

      c. van een vloerafscheiding op een balkon of dakterras;

      d. van een zonwering bij andere gebouwen dan woningen en woongebouwen;

      e. van een op de grond staande reclamezuil.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel43
