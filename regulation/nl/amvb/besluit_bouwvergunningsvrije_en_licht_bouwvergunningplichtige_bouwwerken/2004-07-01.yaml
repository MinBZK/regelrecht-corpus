      Behoudens in gevallen als bedoeld in [artikel 4][ref1], wordt als bouwen van beperkte betekenis als bedoeld in
      [artikel 43, eerste lid, onderdeel c, van de wet][ref2] aangemerkt:

      a. het bouwen van een op de grond staande aan- of uitbouw van één bouwlaag aan een bestaande woning of een bestaand
      woongebouw, die strekt tot vergroting van het woongenot, mits voldaan wordt aan de volgende kenmerken:

      1°. gebouwd aan:

      a) de oorspronkelijke achtergevel op meer dan 1 m van de weg of het openbaar groen, of

      b) een niet naar de weg of het openbaar groen gekeerde oorspronkelijke zijgevel op meer dan 1 m van het voorerf en
      meer dan 1 m van het naburige erf,

      2°. niet hoger dan:

      a) 4 m, gemeten vanaf het aansluitend terrein,

      b) 0,25 m boven de vloer van de eerste verdieping van die woning of dat woongebouw, en

      c) de woning of het woongebouw,

      3°. gebouwd binnen de breedte van de gevel waaraan de aan- of uitbouw wordt gebouwd,

      4°. minder dan 2,5 m diep,

      5°. zij- of achtererf door dat bouwen voor niet meer dan 50% bebouwd, en

      6°. niet gebouwd aan een woning of woongebouw als bedoeld in [artikel 45, eerste lid, van de wet][ref3], aan een
      woonwagen als bedoeld in [artikel 1, eerste lid, onderdeel e, van de wet][ref4] of aan een woning of woongebouw die
      of dat niet voor permanente bewoning is bestemd;

      b. het bouwen van een op de grond staand bijgebouw van één bouwlaag of een op de grond staande overkapping van één
      bouwlaag bij een bestaande woning of bestaand woongebouw, dat of die strekt tot vergroting van het woongenot, mits
      voldaan wordt aan de volgende kenmerken:

      1°. gebouwd op:

      a) het achtererf op meer dan 1 m van de weg of het openbaar groen, of

      b) een niet naar de weg of het openbaar groen gekeerd zijerf op meer dan 1 m van het voorerf, en

      c) indien de bruto-oppervlakte van het bijgebouw of de overkapping meer is dan 10 m2: meer dan 1 m van het naburige
      erf,

      2°. niet hoger dan 3 m, gemeten vanaf het aansluitend terrein,

      3°. zij- of achtererf door dat bouwen voor niet meer dan 50% bebouwd,

      4°. de totale bruto-oppervlakte van de op het erf aanwezige bouwvergunningsvrij gebouwde bijgebouwen en
      overkappingen minder dan 30 m2, en

      5°. niet gebouwd bij een woning of woongebouw als bedoeld in [artikel 45, eerste lid, van de wet][ref5], bij een
      woonwagen als bedoeld in [artikel 1, eerste lid, onderdeel e, van de wet][ref6] of bij een woning of woongebouw die
      of dat niet voor permanente bewoning is bestemd;

      c. het veranderen van een kozijn, kozijninvulling, luik of gevelpaneel van een bestaande woning, bestaand
      woongebouw of een bij een bestaande woning of een bestaand woongebouw behorend bijgebouw, mits voldaan wordt aan de
      volgende kenmerken:

      1°. niet aangebracht in de voorgevel van een woning of woongebouw of een naar de weg of het openbaar groen gekeerde
      zijgevel van een woning of woongebouw, en

      2°. de bestaande gevelopening wijzigt niet;

      d. het bouwen van een dakkapel op een bestaand gebouw, mits voldaan wordt aan de volgende kenmerken:

      1°. gebouwd op het achterdakvlak of een niet naar de weg of het openbaar groen gekeerd zijdakvlak,

      2°. afstand tot de voorgevel meer dan 1 m,

      3°. voorzien van een plat dak,

      4°. zijwanden ondoorzichtig,

      5°. hoogte, gemeten vanaf de voet van de dakkapel, minder dan 1,5 m,

      6°. onderzijde meer dan 0,5 m en minder dan 1 m boven de dakvoet,

      7°. bovenzijde meer dan 0,5 m onder de daknok,

      8°. zijkanten meer dan 0,5 m van de zijkanten van het dakvlak, en

      9°. niet gebouwd op een woning of woongebouw als bedoeld in [artikel 45, eerste lid, van de wet][ref7], op een
      woonwagen als bedoeld in [artikel 1, eerste lid, onderdeel e, van de wet][ref8] of op een woning of woongebouw die
      of dat niet voor permanente bewoning is bestemd;

      e. het bouwen van een erf- of perceelafscheiding, mits voldaan wordt aan de volgende kenmerken:

      1°. niet hoger dan 1 m, of

      2°. niet hoger dan 2 m en gebouwd:

      a) op een erf of perceel waarop reeds een gebouw staat,

      b) meer dan 1 m achter de voorgevelrooilijn, en

      c) meer dan 1 m van de weg of het openbaar groen.


