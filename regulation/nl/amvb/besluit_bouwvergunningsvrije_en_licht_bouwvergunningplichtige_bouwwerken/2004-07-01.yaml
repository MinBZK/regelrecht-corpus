    text: |-
      1 In dit besluit wordt verstaan onder:

      achtererf: gedeelte van het erf dat aan de achterzijde van het gebouw is gelegen;

      antennedrager: antennemast of andere constructie bedoeld voor de bevestiging van een antenne;

      antenne-installatie: installatie bestaande uit een antenne, een antennedrager, de bedrading en de al dan niet in
      een techniekkast opgenomen apparatuur, met de daarbij behorende bevestigingsconstructie;

      daknok: hoogste punt van een schuin dak;

      dakvoet: laagste punt van een schuin dak;

      eerste verdieping: tweede bouwlaag van de woning of het woongebouw, een souterrain of kelder niet daaronder
      begrepen;

      erf: al dan niet bebouwde perceel, of een gedeelte daarvan, dat direct is gelegen bij een gebouw en dat in
      feitelijk opzicht is ingericht ten dienste van het gebruik van dat gebouw, en, voorzover een bestemmingsplan van
      toepassing is, de bestemming deze inrichting niet verbiedt;

      voorerf: gedeelte van het erf dat aan voorkant van het gebouw is gelegen;

      voorgevelrooilijn: voorgevelrooilijn als bedoeld in het bestemmingsplan dan wel de gemeentelijke bouwverordening;

      weg: weg als bedoeld in [artikel 1, eerste lid, onder b, van de Wegenverkeerswet 1994][ref1];

      wet: [Woningwet][ref2];

      zijerf: gedeelte van het erf dat aan de zijkant van het gebouw is gelegen.

      2 Tenzij anders bepaald, worden de in dit besluit genoemde:

      a. afstanden loodrecht gemeten, en

      b. maten buitenwerks gemeten.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005181
