  - number: '3'
    text: |-
      1 Behoudens in gevallen als bedoeld in [artikel 5][ref1] wordt als bouwen van beperkte betekenis als bedoeld in
      [artikel 43, eerste lid, onderdeel c, van de wet][ref2] voorts aangemerkt:

      a. het bouwen van een dakraam in een bestaand gebouw, mits voldaan wordt aan de volgende kenmerken:

      1°. onderzijde meer dan 0,5 m boven de dakvoet,

      2°. bovenzijde meer dan 0,5 m onder de daknok, en

      3°. zijkanten meer dan 0,5 m van de zijkanten van het dakvlak;

      b. het bouwen van een bouwwerk van beperkte omvang op een erf, mits voldaan wordt aan de volgende kenmerken:

      1°. hoogte, gemeten vanaf het aansluitend terrein, minder dan 1 m,

      2°. bruto-oppervlakte minder dan 2 m2, en

      3°. voor-, zij- of achtererf voor niet meer dan 50% bebouwd;

      c. het bouwen van een collector voor warmteopwekking op of aan een bouwwerk ten behoeve van de warmtevoorziening
      van het gebruik van dat bouwwerk of van op hetzelfde perceel gelegen andere bouwwerken, mits voldaan wordt aan de
      volgende kenmerken:

      1°. bij plaatsing:

      a) op een schuin dakvlak:

      1) binnen het vlak van het dak,

      2) in of direct op het dakvlak, en

      3) hellingshoek gelijk aan hellingshoek dakvlak,

      b) op een plat dakvlak:

      1) afstand tot dakranden ten minste gelijk aan hoogte collector, en

      2) hellingshoek ten hoogste 35°, en

      2°. indien de collector niet een geheel vormt met de installatie voor het opslaan van het water: die installatie in
      dat bouwwerk is geplaatst;

      d. het bouwen van een paneel voor de opwekking van elektriciteit uit daglicht op of aan een bouwwerk ten behoeve
      van de elektriciteitsvoorziening van het gebruik van dat bouwwerk of van op hetzelfde perceel gelegen andere
      bouwwerken, mits voldaan wordt aan de volgende kenmerken:

      1°. bij plaatsing:

      a) op een schuin dakvlak:

      1) binnen het vlak van het dak,

      2) in of direct op het dakvlak, en

      3) hellingshoek gelijk aan hellingshoek dakvlak,

      b) op een plat dakvlak:

      1) afstand tot dakranden ten minste gelijk aan hoogte paneel, en

      2) hellingshoek ten hoogste 35°, en

      2°. indien het paneel niet een geheel vormt met de installatie voor het omzetten van de opgewekte elektriciteit:
      die installatie in dat bouwwerk is geplaatst;

      e. het bouwen van een antenne-installatie ten behoeve van mobiele telecommunicatie, mits voldaan wordt aan de
      volgende kenmerken:

      1°. bij bouwen op of aan een bouwwerk:

      a) de hoogte van de antenne, met antennedrager, gemeten vanaf de voet, minder is dan 0,5 m, en de techniekkast:

      1) inpandig of ondergronds is geplaatst,

      2) op de grond is geplaatst en kleiner is dan 0,2 m3, of

      3) op een plat dak is geplaatst, kleiner is dan 0,2 m3 en meer dan 1 m achter de dakrand is geplaatst, of

      b) de hoogte van de antenne, met antennedrager, gemeten vanaf de voet, of indien bevestigd aan een gevel van een
      gebouw, gemeten vanaf het punt waarop de antenne, met antennedrager, het dakvlak kruist, minder is dan 5 m, en:

      1) de antenne, met antennedrager, geplaatst is op een hoogte van meer dan 9 m, gemeten vanaf het bij het bouwwerk
      aansluitende terrein,

      2) de techniekkast:

        - inpandig of ondergronds is geplaatst, of
        - op een plat dak is geplaatst, kleiner is dan 2 m3 en meer dan 1 m achter de dakrand is geplaatst,

      3) de bedrading in of direct langs de antennedrager of inpandig is aangebracht, dan wel in een kabelgoot, mits deze
      kabelgoot meer dan 1 m achter de voorgevel is geplaatst, en

      4) de antennedrager bij plaatsing op het dak van een gebouw:

        - aan of bij een op het dak aanwezig object is geplaatst,
        - in het midden van het dak is geplaatst, of
        - elders op het dak is geplaatst, mits de afstand in m tot de voorgevel van het bouwwerk ten minste gelijk is aan:
      18 gedeeld door de hoogte waarop de antenne, met antennedrager, is geplaatst, gemeten vanaf het bij het gebouw
      aansluitende terrein tot aan de voet van de antenne, met antennedrager, of

      2°. bij bouwen op of aan een hoogspanningsmast, wegportaal, reclamezuil, lichtmast, windmolen, sirenemast, een niet
      van een bouwwerk deel uitmakende schoorsteen, of op een bouwvergunningplichtige antenne-installatie:

      a) de hoogte van de antenne, met antennedrager, gemeten vanaf de voet minder is dan 5 m,

      b) de antenne is geplaatst op een hoogte van meer dan 3 m, gemeten vanaf het bij het bouwwerk aansluitende terrein,
      en

      c) de techniekkast:

      1) inpandig of ondergronds is geplaatst, of

      2) op de grond is geplaatst en kleiner is dan 2 m3;

      f. het bouwen van een andere antenne-installatie dan bedoeld in onderdeel e van dit lid en in onderdeel c van het
      derde lid van dit artikel, mits voldaan wordt aan de volgende kenmerken:

      1°. de antenne-installatie achter het voorerf is geplaatst,

      2°. indien het een schotelantenne betreft:

      a) de doorsnede van de antenne minder is dan 2 m, en

      b) de hoogte van de antenne, met antennedrager, gemeten vanaf de voet, minder is dan 3 m, of

      3°. indien het een andere antenne betreft dan bedoeld onder 2°: de hoogte van de antenne, met antennedrager,
      gemeten vanaf de voet, of indien deze is bevestigd aan de gevel, gemeten vanaf het punt waarop de antenne, met
      antennedrager, het dakvlak kruist, minder is dan 5 m;

      g. het bouwen van een container voor het inzamelen van huishoudelijke afvalstoffen als bedoeld in
      [artikel 1.1, eerste lid, van de Wet milieubeheer][ref3], mits voldaan wordt aan de volgende kenmerken:

      1°. de hoogte van de container, gemeten vanaf het aansluitend terrein, minder is dan 2 m, en

      2°. indien de container bovengronds wordt geplaatst: de bruto-oppervlakte minder is dan 4 m2;

      h. het bouwen van een gebouw ten behoeve van een op het openbaar net aangesloten nutsvoorziening, het
      telecommunicatieverkeer, het openbaar vervoer of het wegverkeer, mits voldaan wordt aan de volgende kenmerken:

      1°. de hoogte, gemeten vanaf het aansluitend terrein, minder is dan 3 m, en

      2°. de bruto-oppervlakte minder is dan 15 m2;

      i. het bouwen van een rolhek, luik of rolluik bij andere gebouwen dan woningen en woongebouwen, mits voldaan wordt
      aan de volgende kenmerken:

      1°. het rolhek, luik of rolluik aan de binnenzijde van de uitwendige scheidingsconstructie is geplaatst, en

      2°. voor ten minste 90% uit glasheldere doorkijkopeningen bestaat;

      j. het bouwen van een magazijnstelling die uitsluitend steunt op een vloer van het gebouw waarin zij wordt
      geplaatst, mits voldaan wordt aan de volgende kenmerken:

      1°. de hoogte, gemeten vanaf de voet, meer is dan 3 m maar minder dan 8,5 m, en

      2°. de magazijnstelling niet is voorzien van een verdiepingsvloer of loopbrug;

      k. het aanbrengen van een verandering van niet-ingrijpende aard aan een bestaand bouwwerk, mits voldaan wordt aan
      de volgende kenmerken:

      1°. de verandering geen betrekking heeft op de draagconstructie van dat bouwwerk,

      2°. de bebouwde oppervlakte niet wordt uitgebreid, en

      3°. het bestaande niet-wederrechtelijke gebruik wordt gehandhaafd.

      2 Behoudens in gevallen als bedoeld in [artikel 5][ref4] wordt als bouwen van beperkte betekenis als bedoeld in
      [artikel 43, eerste lid, onderdeel c, van de wet][ref5] voorts aangemerkt het bouwen van:

      a. een speeltoestel, als bedoeld in
      [artikel 1, onderdeel c, van het Warenwetbesluit attractie en speeltoestellen][ref6], mits de hoogte, gemeten vanaf
      de voet, minder is dan 3 m;

      b. tuinmeubilair, mits de hoogte, gemeten vanaf de voet, minder is dan 2 m.

      3 Behoudens in gevallen als bedoeld in [artikel 5, eerste lid][ref7], wordt als bouwen van beperkte betekenis als
      bedoeld in [artikel 43, eerste lid, onderdeel c, van de wet][ref8] voorts aangemerkt het bouwen van:

      a. a. bouwwerken, geen gebouw zijnde, op, over, onder of bij een weg of railweg, dan wel in, onder of bij een
      water, voor zover het betreft:

      1º. bouwwerken ten behoeve van verkeersregeling, verkeersgeleiding, wegaanduiding, verlichting of tolheffing,

      2º. bovenleidingen met de bijbehorende draagconstructies of seinpalen,

      3º. elektriciteitskastjes of centrale-antenne-inrichtingskastjes,

      4º. ondergrondse buis- en leidingstelsels ten behoeve van perceelsaansluitingen,

      5º. andere naar aard en omvang met de onder 1°, 2°, 3° of 4° genoemde bouwwerken vergelijkbare bouwwerken ten
      behoeve van het openbaar vervoer, het verkeer, de waterhuishouding, de drinkwatervoorziening, de riolering, de
      energievoorziening of de telecommunicatie;

      b. een antenne-installatie met bijbehorend opstelpunt ten behoeve van de C2000-infrastructuur voor de mobiele
      communicatie door hulpverleningsdiensten;

      c. een elektronische sirene ten behoeve van het waarschuwen van de bevolking bij calamiteiten of de dreiging
      daarvan, alsmede de daarbij behorende bevestigingsconstructie;

      d. straatmeubilair;

      e. een zonwering, rolhek of rolluik bij woningen en woongebouwen;

      f. een afscheiding tussen balkons of dakterrassen.


