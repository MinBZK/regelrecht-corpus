  - number: '9'
    text: |-
      [Artikel 40, eerste lid, van de wet][ref1] blijft buiten toepassing ten aanzien van het bouwen waarmee reeds
      was aangevangen voor de inwerkingtreding van de [artikelen 2][ref2], [3][ref3], [4][ref4], [5][ref5] en
      [6 van dit besluit][ref6], indien op het tijdstip waarmee met dat bouwen is begonnen, geen bouwvergunning was
      vereist.


