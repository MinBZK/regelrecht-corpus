  - number: '5'
    text: |-
      1 Een lichte bouwvergunning is voorts vereist voor het bouwen, bedoeld in [artikel 3][ref1], indien dat
      plaatsvindt:

      a. in, op, aan of bij een monument als bedoeld in de [Monumentenwet 1988][ref2] of een monument als bedoeld in een
      provinciale of gemeentelijke monumentenverordening, of

      b. in een beschermd stads- of dorpsgezicht als bedoeld in de [Monumentenwet 1988][ref3].

      2 Een lichte bouwvergunning is voorts vereist voor het bouwen van een in de aanhef van een geletterd onderdeel van
      [artikel 3, eerste lid][ref4], bedoeld bouwwerk dat niet voldoet aan de in dat onderdeel gegeven kenmerken, met
      dien verstande dat:

      a. van het bouwwerk, bedoeld in de aanhef van onderdeel b:

      1°. de hoogte, gemeten vanaf het aansluitend terrein, minder is dan 3 m, en

      2°. de bruto-oppervlakte minder is dan 5 m2;

      b. van de bouwwerken, bedoeld in de aanhef van de onderdelen e en f, de hoogte, gemeten vanaf de voet van de
      antenne, of indien de antenne is geplaatst op een antennedrager, gemeten vanaf de voet van de antennedrager, minder
      is dan 40 m;

      c. van het bouwwerk, bedoeld in de aanhef van onderdeel h:

      1°. de hoogte, gemeten vanaf het aansluitend terrein, minder is dan 5 m, en

      2°. de bruto-oppervlakte minder is dan 50 m2.

      3 Een lichte bouwvergunning is voorts vereist voor het bouwen van een in [artikel 3, tweede lid][ref5], bedoeld
      bouwwerk dat hoger is dan in dat lid is aangegeven, met dien verstande dat de hoogte, gemeten vanaf het aansluitend
      terrein, minder is dan 5 m.


