preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Onderwijs, Cultuur en Wetenschap van 18 augustus 2004, nr. WJZ/ 2004/
    33830 (3778), directie Wetgeving en Juridische Zaken, gedaan mede namens Onze Minister van Landbouw, Natuur en
    Voedselkwaliteit;

    Gelet op de artikelen 10b5, tweede lid, 77, derde en vierde lid, 77a, 84, 106 en 110a, derde lid, van de Wet
    op het voortgezet onderwijs en artikel XV van de Wet van 28 november 2002 houdende wijziging van de Wet op de
    expertisecentra, de Wet op het primair onderwijs en de Wet op het voortgezet onderwijs in verband met de invoering
    van een leerlinggebonden budget en de vorming van regionale expertisecentra (Stb. 2002, 631);

    De Raad van State gehoord (advies van 2 september 2004, nr. WO5.04.0415/III);

    Gezien het nader rapport van Onze Minister van Onderwijs, Cultuur en Wetenschap van 12 januari 2005, nr.
    WJZ/2004/54611 (3778), directie Wetgeving en Juridische Zaken, uitgebracht mede namens Onze Minister van Landbouw,
    Natuur en Voedselkwaliteit;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0017910/2005-04-06#ArtikelAanhef
articles:
  - number: IV
    text: |-
      In afwijking van
      [artikel 8 van het Besluit RVC's, regionaal zorgbudget en praktijkscholen met declaratiebekostiging][ref1] geldt
      de aanvraag voor een zorgbudget die door of namens de bevoegde gezagsorganen van de scholen behorend tot een
      samenwerkingsverband is gedaan voor het schooljaar 2005/ 06 eveneens als aanvraag voor een zorgbudget voor het
      kalenderjaar 2006.


      [ref1]: https://wetten.overheid.nl/BWBR0015137#Artikel8
    url: https://wetten.overheid.nl/BWBR0017910/2005-04-06#ArtikelIV
    references:
      - id: ref1
        bwb_id: BWBR0015137
        artikel: '8'
  - number: V
    text: |-
      Het tijdstip, bedoeld in [artikel IIa van de Wet van 26 juni 2003][ref1] (Stb. 292), is 1 januari 2006.


      [ref1]: https://wetten.overheid.nl/BWBR0015280#ArtikelIIa
    url: https://wetten.overheid.nl/BWBR0017910/2005-04-06#ArtikelV
    references:
      - id: ref1
        bwb_id: BWBR0015280
        artikel: IIa
  - number: VI
    text: |-
      In afwijking van [artikel 15e van het Bekostigingsbesluit W.V.O.](onbekend) omvat de rijksbijdrage voor het jaar
      2006 een bij ministeriële regeling vast te stellen bedrag per leer-werkovereenkomst, gesloten tussen 15 april 2004
      en 1 augustus 2005.
    url: https://wetten.overheid.nl/BWBR0017910/2005-04-06#ArtikelVI
  - number: VII.1
    text: 'Dit besluit treedt in werking:'
    url: https://wetten.overheid.nl/BWBR0017910/2005-04-06#ArtikelVII
  - number: VII.1.a
    text: |-
      wat de [artikelen I, met uitzondering van onderdeel J,][ref1][II][ref2], [III][ref3] en [IV][ref4] betreft,
      op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen of onderdelen daarvan
      verschillend kan worden vastgesteld, waarbij tevens kan worden bepaald dat het besluit voor wat betreft
      [artikel II, onderdeel C, onder 3, onderdeel b][ref5], en [artikel II, onderdeel E, onder 3][ref6], terugwerkt tot
      en met 1 augustus 2003, en


