      1 De in [artikel 2, vijfde lid, onderdeel ][ref1] bedoelde aantallen dieren worden, indien het betreft varkens,
      kippen, runderen of kalkoenen, bepaald en opgegeven aan de hand van de bezetting op 31 december 1986.

      2 In afwijking van het bepaalde in het eerste lid, kan, indien de bezetting op 31 december 1986 geen getrouw beeld
      geeft van de gebruikelijke bezetting op het bedrijf, onverminderd een opgave van de bezetting op die datum, een
      bezetting op een ander tijdstip gedurende 1986 worden opgegeven.

      3 De bezetting op 31 december 1986 dient door de mestproducent te kunnen worden gestaafd met bewijsstukken. De
      andere bezetting dient overeen te komen met de gebruikelijke bezetting en door de mestproducent te kunnen worden
      gestaafd met bewijsstukken.


      [ref1]: https://wetten.overheid.nl/BWBR0004061#Artikel2
