  - number: '7'
    text: |-
      1 Degene, die vóór 1 januari 1986 een verzoek om een andere heffingvrije hoeveelheid heeft ingediend in het kader
      van de Beschikking superheffing (*Stcrt.* 1984, 79) of de Beschikking superheffing 1985 (*Stcrt.* 1985, 118), dan
      wel degene, die een verzoek om een andere heffingvrije hoeveelheid heeft ingediend in het kader van de Beschikking
      superheffing bijzondere opvolgingssituaties (*Stcrt.* 1985, 109), de Beschikking aanvulling superheffing (*Stcrt.*
      1986, 65) of de Beschikking superheffing bedrijfsopvolgingssituaties onderbezetting (*Stcrt.* 1986, 92), kan,
      indien de beslissing tot toewijzing van de andere heffingvrije hoeveelheid na 31 december 1985 is genomen, Onze
      Minister verzoeken de hoeveelheid dierlijke meststoffen als bedoeld in [artikel 2, vijfde lid, onderdeel ][ref1]
      in afwijking van de in [artikel 2, eerste lid][ref2], bedoelde opgave, met toepassing van het tweede lid vast te
      stellen.

      2 De afwijkende hoeveelheid wordt vastgesteld door de hoeveelheid dierlijke meststoffen die voortvloeit uit
      de heffingvrije hoeveelheid melk waarop betrokkene op 31 december 1986 aanspraak heeft, in voorkomend geval
      vermeerderd met de na 31 december 1986 toegewezen extra heffingvrije hoeveelheid, te delen door 5.500, de
      uitkomst van deze deling te vermenigvuldigen met 50 kilogram fosfaat en de uitkomst van deze vermenigvuldiging
      te vermeerderen met de hoeveelheid dierlijke meststoffen die voortvloeit uit het op 31 december 1985 op het
      bedrijf aanwezige aantal dieren van de diersoorten varkens, kalkoenen, kippen en runderen met uitzondering van
      de diercategorieën melk- en kalfkoeien, vrouwelijk jongvee jonger dan één jaar en vrouwelijk jongvee één jaar en
      ouder.

      3 Het verzoek dient te worden gedaan binnen een door Onze Minister vast te stellen termijn op een volledig en naar
      waarheid ingevuld door Onze Minister vastgesteld formulier op de daarbij aangegeven wijze en onder overlegging van
      de daarbij verzochte bescheiden.

      4 In afwijking van het bepaalde in het tweede lid, kan, indien het aantal dieren op 31 december 1985 geen getrouw
      beeld geeft van het gebruikelijk aantal op het bedrijf, een aantal op een ander tijdstip gedurende 1985 worden
      opgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0004061#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0004061#Artikel2
    url: https://wetten.overheid.nl/BWBR0004061/1992-02-01#Artikel7
