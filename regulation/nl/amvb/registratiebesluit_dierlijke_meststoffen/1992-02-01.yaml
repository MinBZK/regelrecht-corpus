  - number: 7a
    text: |-
      1 Voor degene aan wie op grond van de Beschikking superheffing SLOM-deelnemers (*Stcrt.* 1989, 94) een specifieke
      referentiehoeveelheid melk is toegewezen, wordt de overeenkomstig de [artikelen 2][ref1] en [3][ref2] bepaalde
      hoeveelheid dierlijke meststoffen afkomstig van rundvee zoals deze hoeveelheid in voorkomend geval is gewijzigd
      door toepassing van [artikel 9][ref3], vermeerderd met de overeenkomstig het tweede lid te bepalen bijzondere
      hoeveelheid.

      2 De in het eerste lid bedoelde bijzondere hoeveelheid dierlijke meststoffen wordt vastgesteld door de toegewezen
      specifieke referentiehoeveelheid melk, te delen door 5 500 en de uitkomst van deze deling te vermenigvuldigen met
      50 kilogram fosfaat.

      3 De in het eerste en tweede lid bedoelde bijzondere hoeveelheid dierlijke meststoffen geldt voor betrokkene
      slechts voor de duur van de toewijzing van de specifieke referentiehoeveelheid melk en vermindert, indien artikel
      6, derde lid, van de Beschikking superheffing SLOM-deelnemers van toepassing is, voor betrokkene met een aan de
      vermindering van de specifieke referentiehoeveelheid melk evenredig gedeelte.

      4 Ter uitvoering van dit artikel kunnen desgevraagd door of namens Onze Minister binnen de daartoe gestelde termijn
      nadere gegevens worden verlangd.


      [ref1]: https://wetten.overheid.nl/BWBR0004061#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0004061#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0004061#Artikel9
