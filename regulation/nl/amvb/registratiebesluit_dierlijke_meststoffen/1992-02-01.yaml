  - number: '9'
    text: |-
      Indien blijkt dat de in de formulieren als bedoeld in [artikel 2, eerste, tweede en derde lid][ref1], gedane opgave
      in strijd met de voorschriften van dit besluit of artikel 14, vijfde lid, van de wet is gedaan, kan Onze Minister
      de opgave dienovereenkomstig aanpassen.


