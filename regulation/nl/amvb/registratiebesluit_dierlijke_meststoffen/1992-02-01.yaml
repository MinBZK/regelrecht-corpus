    text: |-
      De in [artikel 2, vijfde lid, onderdeel ][ref1] bedoelde hoeveelheid dierlijke meststoffen wordt uitgedrukt in
      kilogrammen fosfaat en bepaald aan de hand van:

      a. de door Onze Minister ingevolge artikel 8, tweede lid, van de wet, vastgestelde omvang van de mestproduktie
      per dier;

      b. de aantallen en aanwezigheid van de in [artikel 3][ref2] bedoelde dieren.


