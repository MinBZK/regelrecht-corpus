    text: |-
      1 Degene, die tot het tijdstip waarop de Regeling verbod voedsel- en slachtafvallen (varkens) (*Stcrt.*
      1986, 66) in werking is getreden in het bezit was van een geldige vergunning als bedoeld in de Beschikking
      Voedsel- en slachtafvallen 1972 (*Stcrt.* 1972, 65) en voorts kan aantonen dat hij onmiddellijk voorafgaande
      aan de inwerkingtreding van genoemde regeling ten minste 60% van zijn fiscaal onzuiver inkomen, berekend op
      jaarbasis, heeft verkregen uit het houden van varkens van de diercategorie vleesvarken die gevoederd werden
      met voedsel- of slachtafvallen, kan Onze Minister verzoeken de hoeveelheid dierlijke meststoffen als bedoeld in
      [artikel 2, vijfde lid, onderdeel ][ref1], in afwijking van de in [artikel 2, eerste lid][ref2], bedoelde opgave
      met toepassing van het tweede lid vast te stellen.

      2 De afwijkende hoeveelheid bedraagt de hoeveelheid zoals die voortvloeit uit het op 7 april 1986 op het bedrijf
      van de verzoeker aanwezige aantal dieren van de ingevolge artikel 1, eerste lid, van de wet aangewezen diersoorten,
      waarbij het aantal varkens van de diercategorie vleesvarken met drie wordt vermenigvuldigd met dien verstande dat
      het totale aantal vleesvarkens na vermenigvuldiging niet groter zal zijn dan 1.200.

      3 Het verzoek dient te worden gedaan binnen een door Onze Minister vast te stellen termijn op een volledig en naar
      waarheid ingevuld door Onze Minister vastgesteld formulier op de daarbij aangewezen wijze en onder overlegging van
      de daarbij verzochte bescheiden.

      4 In afwijking van het bepaalde in het tweede lid, kan, indien het aantal dieren op 7 april 1986 geen getrouw
      beeld geeft van het gebruikelijk aantal op het bedrijf, een aantal op een ander tijdstip gedurende het tijdvak
      aanvangende op 1 januari 1986 en eindigende op 6 april 1986 worden opgegeven.


