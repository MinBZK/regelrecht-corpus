  - number: '2'
    text: |-
      1 Producenten van dierlijke meststoffen zijn verplicht een door Onze Minister vastgesteld formulier volledig en
      naar waarheid in te vullen en dit ondertekend voor 1 februari 1987 te doen toekomen aan de districtsbureauhouder.

      2 In afwijking van het bepaalde in het eerste lid is de producent van dierlijke meststoffen die in 1986 jongvee ter
      opfok heeft aangenomen verplicht om een door Onze Minister vastgesteld formulier volledig en naar waarheid in te
      vullen en dit vóór 1 mei 1989 te doen toekomen aan het Bureau.

      3 In afwijking van het bepaalde in het eerste en tweede lid, zijn de producenten van dierlijke meststoffen, op
      wier bedrijf dierlijke meststoffen worden geproduceerd, afkomstig van eenden, vossen, nertsen, konijnen, schapen
      of geiten, verplicht om een door Onze Minister vastgesteld formulier volledig en naar waarheid in te vullen en dit
      vóór 1 maart 1992 te doen toekomen aan het Bureau.

      4 In afwijking in zoverre van de [artikelen 1, tweede lid][ref1], en [2, derde lid][ref2], is een ieder die door of
      vanwege Onze Minister een formulier toegezonden heeft gekregen, verplicht dit formulier volledig en naar waarheid
      in te vullen en dit vóór 1 maart 1992 te doen toekomen aan het Bureau.

      5 De in het eerste, tweede en derde lid bedoelde formulieren hebben onder meer betrekking op:

      a. de in de aanwezige, daartoe bestemde en daarvoor geschikte ruimten - daaronder begrepen de op het land aanwezige
      dieren - gehouden aantallen van de ingevolge artikel 1, eerste lid, van de wet, aangewezen diersoorten;

      b. de hoeveelheid dierlijke meststoffen die op het bedrijf als geheel als naar aangewezen diersoort en - categorie
      geproduceerd wordt;

      c. de tot het bedrijf behorende oppervlakte landbouwgrond per 31 december 1986, dan wel, indien het een opgave
      van uitsluitend eenden, vossen, nertsen, konijnen, schapen of geiten betreft, of een opgave als bedoeld in
      [artikel 3][ref3] per 31 december 1991.

      6 In afwijking van het in het vijfde lid bepaalde, heeft het formulier, indien het een producent van dierlijke
      meststoffen betreft die eerder een opgave heeft gedaan als bedoeld in het eerste of tweede lid, resulterend in
      een mestproduktie boven de in [artikel 14, eerste lid, van de Meststoffenwet][ref4] (*Stb.* 1986, 598) bedoelde
      hoeveelheid, en die tevens eenden, vossen, nertsen, konijnen, schapen of geiten houdt, uitsluitend betrekking op
      de in het vijfde lid, onderdeel *a* en *b,* bedoelde gegevens, voor zover deze gegevens eenden, vossen, nertsen,
      konijnen, schapen of geiten betreffen.


      [ref1]: https://wetten.overheid.nl/BWBR0004061#Artikel1
