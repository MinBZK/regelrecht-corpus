preamble:
  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Op de voordracht van Onze Minister van Landbouw en Visserij van 3 oktober 1986, No. J. 6793, Directie Juridische en
    Bedrijfsorganisatorische Zaken, handelende in overeenstemming met Onze Minister van Volkshuisvesting, Ruimtelijke
    Ordening en Milieubeheer;


    Gehoord het Landbouwschap, het Produktschap voor Vee en Vlees, het Produktschap voor Pluimvee en Eieren en het
    Produktschap voor Zuivel;


    Overwegende, dat het noodzakelijk is voorschriften ter registratie van de produktie aan dierlijke meststoffen
    vast te stellen in verband met de in de Meststoffenwet (Stb. 1986, 598) opgenomen regelen ter voorkoming van een
    onverantwoorde uitbreiding daarvan;


    Gelet op artikel 6 van de Meststoffenwet (Stb. 1986, 598);


    De Raad van State gehoord (advies van 24 november 1986, No. W 11.86.0534);


    Gezien het nader rapport van Onze Minister van Landbouw en Visserij van 11 december 1986, No. J. 9055,
    Directie Juridische en Bedrijfsorganisatorische Zaken, uitgebracht in overeenstemming met Onze Minister van
    Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer;


    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0004061/1992-02-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In dit besluit en daarop berustende bepalingen wordt verstaan onder:

      wet: [Meststoffenwet][ref1] (*Stb.* 1986, 598);

      jongvee: runderen tot een leeftijd van twee jaren, die bestemd zijn om als fok- of gebruiksvee te worden gehouden;

      producent van dierlijke meststoffen: degene die door het houden van dieren, uitscharing van rundvee of schapen of
      tijdelijke onderbrenging ter opfok van jongvee of ter weiding van schapen elders, dierlijke meststoffen produceert;

      bedrijf: het geheel van produktie-eenheden bestaande uit een of meer gebouwen of gedeelten daarvan en de daarbij
      behorende landbouwgrond, uitsluitend of onder meer dienende tot de uitoefening van de landbouw;

      districtsbureauhouder: districtsbureauhouder ressorterend onder de directeur Landbouw, Natuur en Openluchtrecreatie
      in de provincie in wiens werkgebied het bedrijf van de producent van dierlijke meststoffen is gelegen;

      het Bureau: het Bureau Heffingen te Assen.

      2 Met uitzondering van het in [artikel 2, vierde lid][ref2], bepaalde is dit besluit niet van toepassing op degenen
      die dierlijke meststoffen produceren in een hoeveelheid van 125 kilogram fosfaat of minder per jaar per bedrijf.

      3 Voor de toepassing van dit besluit wordt onder het houden van dieren niet verstaan het ter inscharing aannemen
      van rundvee.

      4 Voor de toepassing van het bij of krachtens dit besluit bepaalde wordt geen rekening gehouden met handelingen
      waarvan op grond van de omstandigheid dat zij geen wezenlijke verandering van feitelijke verhoudingen hebben
      ten doel gehad of waarvan op grond van andere bepaalde feiten en omstandigheden moet worden aangenomen dat zij
      achterwege gebleven zouden zijn indien daarmede niet de toepassing van dit besluit of de wet voor het vervolg
      geheel of ten dele onmogelijk zou worden gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0004054
      [ref2]: https://wetten.overheid.nl/BWBR0004061#Artikel2
    url: https://wetten.overheid.nl/BWBR0004061/1992-02-01#Artikel1
