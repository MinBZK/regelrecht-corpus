  - number: 3e
    text: |-
      1 In afwijking van het bepaalde in [artikel 2, eerste lid][ref1], dient de producent van dierlijke meststoffen
      door wie dierlijke meststoffen worden geproduceerd, afkomstig van eenden, vossen, nertsen, konijnen, schapen of
      geiten, indien hij geen opgave als bedoeld in [artikel 2, eerste en tweede lid][ref2], heeft gedaan, maar door
      hem wel tevens dierlijke meststoffen worden geproduceerd afkomstig van varkens, kippen, runderen of kalkoenen
      tot ten hoogste de hoeveelheid, bedoeld in [artikel 14, eerste lid, van de Meststoffenwet][ref3], op het in
      [artikel 2, derde lid][ref4], bedoelde formulier naast de eenden, vossen, nertsen, konijnen, schapen en geiten ook
      de per 31 december 1991 door hem gehouden varkens, kippen, runderen en kalkoenen op te geven.

      2 In afwijking van het bepaalde in [artikel 2, eerste lid][ref5], dient de producent van dierlijke meststoffen
      door wie dierlijke meststoffen worden geproduceerd, afkomstig van eenden, vossen, nertsen, konijnen, schapen of
      geiten, indien eerder ingevolge [artikel 2, eerste en tweede lid][ref6], opgave is gedaan van de op het bedrijf
      gehouden varkens, kippen, runderen of kalkoenen, resulterend in een mestproduktie beneden de hoeveelheid, bedoeld
      in [artikel 14, eerste lid, van de Meststoffenwet][ref7], op het in [artikel 2, derde lid][ref8], bedoelde
      formulier naast de eenden, vossen, nertsen, konijnen, schapen en geiten, ook de per 31 december 1991 door hem
      gehouden varkens, kippen, runderen en kalkoenen op te geven, voor zover deze aantallen dieren resulteren in een
      mestproduktie die groter is dan de geregistreerde produktie per 31 december 1986, doch die niet groter is dan de
      produktie, bedoeld in [artikel 14, eerste lid, van de Meststoffenwet][ref9].

      3 Het [tweede en derde lid van artikel 3][ref10] zijn van overeenkomstige toepassing.


