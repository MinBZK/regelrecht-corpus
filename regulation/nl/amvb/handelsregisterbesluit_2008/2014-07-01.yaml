        artikel: '19'
  - number: '4'
    text: |-
      1 De Kamer onderzoekt of een opgave afkomstig is van iemand die tot het doen ervan bevoegd is, en of de opgave
      juist is, tenzij in Nederland of een andere lidstaat van de Europese Unie of van de Europese Economische Ruimte
      reeds onderzoek naar gelijkwaardige eisen is verricht en hieruit blijkt dat de opgave aan de eisen voldoet.

      2 De Kamer kan bij een onderzoek nadere bewijsstukken vragen.

      3 Indien de Kamer ervan overtuigd is dat de opgave is gedaan door iemand die tot het doen ervan bevoegd is en van
      oordeel is dat de opgave juist is, gaat zij onverwijld over tot inschrijving.
    url: https://wetten.overheid.nl/BWBR0024067/2014-07-01#Artikel4
  - number: '5'
    text: |-
      1 De Kamer weigert om tot inschrijving over te gaan indien zij er niet van overtuigd is dat de opgave afkomstig is
      van een tot opgave bevoegd persoon.

      2 De Kamer kan weigeren om tot inschrijving over te gaan indien:

      a. de opgave strijdig is met een wettelijk voorschrift, het recht, de openbare orde of de goede zeden;

      b. de opgave innerlijk strijdig of onvolledig is;

      c. de opgave strijdig is met de reeds over de onderneming of rechtspersoon opgenomen gegevens;

      d. de opgave strijdig is met gegevens uit een ander basisregister;

      e. de Kamer gerede twijfel heeft over de juistheid van de opgave.

      3 Indien de Kamer degene die de opgave doet in de gelegenheid heeft gesteld de opgave aan te vullen of te wijzigen,
      stelt zij indien nodig de opgave weer ter beschikking van degene die de opgave heeft gedaan.
    url: https://wetten.overheid.nl/BWBR0024067/2014-07-01#Artikel5
  - number: '6'
    text: |-
      1 Tot het doen van een opgave ter inschrijving in het handelsregister van alle gegevens betreffende de onderneming
      of rechtspersoon is verplicht:

      a. de bestuurder van een publiekrechtelijke rechtspersoon;

      b. de bestuurder van een rechtspersoon, bedoeld in [artikelen 24 tot en met 26][ref1];

      c. de beheerder in Nederland, bedoeld in [artikel 24, derde lid][ref2], [25, derde lid, onderdeel b][ref3], en
      [26, derde lid, onderdeel b][ref4];

      d. de bewindvoerder, bedoeld in [artikel 37, eerste lid, onder a][ref5].

      2 Tot het doen van een opgave ter inschrijving van de volgende gegevens is verplicht:

      a. betreffende de aankondigingen krachtens [artikel 390 van Boek 1 van het Burgerlijk Wetboek][ref6], hij die met
      de bekendmaking ervan is belast;

      b. betreffende de aankondigingen ingevolge de [Wet op het financieel toezicht][ref7], hij die met de bekendmaking
      ervan in de Staatscourant is belast;

      c. betreffende het bedrag van het geplaatste kapitaal, bedoeld in [artikel 22, tweede lid][ref8],
      en [25, derde lid onderdeel c en vierde lid][ref9], de houder van het register, bedoeld in
      [artikel 1:107 van de Wet op het financieel toezicht][ref10], indien de daartoe verplichte personen een melding
      hebben gedaan op grond van [artikel 5:34 van de Wet op het financieel toezicht][ref11];

      d. betreffende de ontbinding van een vennootschap of rechtspersoon en betreffende de voltooiing van de vereffening
      van een Europees economisch samenwerkingsverband of van een vennootschap of rechtspersoon als bedoeld in de
      [artikelen 24][ref12], [25][ref13] en [26][ref14], de vereffenaar van een ontbonden vennootschap of rechtspersoon;

      e. betreffende een uitspraak als bedoeld in [artikel 37][ref15] en [39, eerste lid][ref16], de griffier van het
      rechtscollege dat de uitspraak heeft gedaan.


