  - number: '54'
    text: |-
      De artikelen van dit besluit treden in werking op een bij koninklijk besluit te bepalen tijdstip dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0024067/2014-07-01#Artikel54
  - number: '55'
    text: |-
      Dit besluit wordt aangehaald als: Handelsregisterbesluit met vermelding van het jaartal van het Staatsblad waarin
      het zal worden geplaatst.
    url: https://wetten.overheid.nl/BWBR0024067/2014-07-01#Artikel55
