  - number: '52'
    text: |-
      1 Als rechtspersonen en vennootschappen, bedoeld in [artikel 24, eerste lid, van de wet][ref1], worden aangewezen:

      a. de Europese coöperatieve vennootschap;

      b. de vennootschappen, bedoeld in [artikelen 24][ref2] en [25][ref3];

      c. de vennootschappen bedoeld in [artikel 17][ref4], voor zover de niet-commanditaire vennoten daarvan
      kapitaalvennootschappen naar buitenlands recht zijn.

      2 Als gegevens en bescheiden, bedoeld in [artikel 24, derde lid, van de wet][ref5], worden aangewezen, alle
      gegevens ten aanzien waarvan geen publicatieplicht geldt op grond van een bindend besluit van de Raad van de
      Europese Unie of de Europese Commissie.


      [ref1]: https://wetten.overheid.nl/BWBR0021777#Artikel24
