preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op voordracht van de Staatssecretaris van Economische Zaken van 12 februari 2008 nr. WJZ/8012689;

    Gelet op artikelen 6, derde lid, 8, onderdeel b, 17, eerste lid, 18, achtste lid, 19, eerste lid, 20, vierde lid,
    23, 24, derde lid, 24, 25, vierde lid, onderdeel c, 38, tweede lid en 39 van de Handelsregisterwet 2007;

    De Raad van State gehoord (advies van 14 maart 2008, nr. W10.02.0067/III)

    Gezien het nader rapport van de Staatssecretaris van Economische Zaken van 13 juni 2008 WJZ8066664;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0024067/2014-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. *wet:* de [Handelsregisterwet 2007][ref1];

      b. *werkzame personen:* de al dan niet in dienst van de betrokken onderneming werkzame werknemers, de meewerkende
      eigenaren en de meewerkende gezinsleden van een eigenaar, steeds voorzover zij doorgaans ten minste 15 uur per week
      werkzaam zijn;

      c. *verordening 1435/2003:* de [verordening (EG) nr. 1435/2003](32003R1435) van de Raad van de Europese Unie van 22
      juli 2003 betreffende het statuut van de Europese coöperatieve vennootschap (SCE) (PbEU L 207);

      d. *richtlijn 68/151/EEG:* [richtlijn (EEG) nr. 68/151](31968L0151) van de Raad van de Europese Gemeenschappen van
      9 maart 1968 met betrekking tot de openbaarmakingsvereisten voor bepaalde soorten ondernemingen (PbEG 1968 L 65);

      e. *melding:* een melding als bedoeld in [artikel 32, eerste of tweede lid, van de wet][ref2];

      f. *persoonlijke gegevens:*

      1°. indien deze betrekking hebben op een natuurlijk persoon, de gegevens, genoemd in
      [artikel 10, tweede lid van de wet][ref3], de geslachtsaanduiding en de handtekening;

      2°. indien deze betrekking hebben op een rechtspersoon naar Nederlands recht, het nummer genoemd in
      [artikel 12, onderdeel a, van de wet][ref4], de naam en het bezoekadres;

      3°. indien deze betrekking hebben op een rederij, maatschap, vennootschap onder firma of commanditaire vennootschap
      naar Nederlands recht, het nummer genoemd in [artikel 10, derde lid onderdeel a, van de wet][ref5], de naam en
      het bezoekadres;

      4°. indien deze betrekking hebben op een rechtspersoon of vennootschap naar buitenlands recht, de naam, het
      bezoekadres, het nummer waaronder de rechtspersoon of vennootschap in het buitenlandse register is ingeschreven, de
      naam van dat register en de plaats en het land waar het register wordt gehouden.

      2 In dit besluit en de daarop berustende bepalingen wordt mede verstaan onder:

      a. handtekening: een elektronische handtekening als bedoeld in
      [artikel 15a, vierde lid, van Boek 3 van het Burgerlijk Wetboek][ref6];

      b. commissaris: een lid van een toezichthoudend orgaan.


