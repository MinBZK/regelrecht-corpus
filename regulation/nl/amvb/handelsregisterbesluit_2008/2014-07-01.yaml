      1 In geval van wijziging van de oprichtingsovereenkomst van een Europees economisch samenwerkingsverband en van de
      statuten van een rechtspersoon als bedoeld in de [artikelen 24 tot en met 26][ref1] wordt gedeponeerd:

      a. een authentiek afschrift van de notariële akte die van de wijziging is opgemaakt of, indien van de wijziging
      geen notariële akte is opgemaakt, een door een opgaveplichtige gewaarmerkt afschrift van de wijziging;

      b. een doorlopende tekst van de oprichtingsovereenkomst en van de statuten zoals die tengevolge van de aangebrachte
      wijziging luiden.

      2 Deze bescheiden zijn in de Nederlandse, Duitse, Engelse of Franse taal.


