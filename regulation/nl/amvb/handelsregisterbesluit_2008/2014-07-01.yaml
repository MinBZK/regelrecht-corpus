      1 In het handelsregister worden over een vereniging met volledige rechtsbevoegdheid, coöperatie of onderlinge
      waarborgmaatschappij opgenomen:

      a. de persoonlijke gegevens van iedere bestuurder en commissaris en de datum waarop hij in en uit functie
      is getreden en of hij bevoegd is de rechtspersoon alleen of gezamenlijk handelend met een of meer anderen te
      vertegenwoordigen;

      b. de persoonlijke gegevens van anderen dan de bestuurders aan wie de statuten bevoegdheid tot vertegenwoordiging
      toekennen, en de inhoud van de bevoegdheid.

      2 In het handelsregister wordt opgenomen dat de statuten van een coöperatie of onderlinge waarborgmaatschappij
      beantwoorden aan de [artikelen 63f tot en met 63j van Boek 2 van het Burgerlijk Wetboek][ref1], indien zulks het
      geval is.

      3 Indien een vereniging zonder volledige rechtsbevoegdheid in het handelsregister wordt ingeschreven, worden de
      gegevens bedoeld in het eerste lid in het handelsregister opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel63f
