  - number: '10'
    text: |-
      In het handelsregister worden indien degene aan wie een onderneming toebehoort is ingeschreven in een buitenlands
      register voor ondernemingen, opgenomen, het registratienummer uit dat register, de naam van het register en de
      plaats en het land waar het register gehouden wordt.
    url: https://wetten.overheid.nl/BWBR0024067/2014-07-01#Artikel10
  - number: '11'
    text: |-
      In het handelsregister worden over een onderneming opgenomen:

      a. het aantal werkzame personen, onderverdeeld naar vestiging, op de eerste werkdag na 30 april van enig
      kalenderjaar;

      b. een korte aanduiding van de uitgeoefende activiteit of activiteiten;

      c. de naam van de berichtenbox van het centraal loket, bedoeld in
      [artikel 5, eerste lid, onderdeel a, onder 2° van de Dienstenwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel5
    url: https://wetten.overheid.nl/BWBR0024067/2014-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '5'
  - number: 11a
    text: |-
      1 Een onderneming zonder vestiging in Nederland kan worden ingeschreven in het handelsregister, indien de
      activiteiten van de onderneming in Nederland zelfstandig zouden kwalificeren als een onderneming in de zin van
      [artikel 2][ref1].

      2 In het handelsregister wordt over een onderneming zonder vestiging in Nederland het adres opgenomen waarop degene
      aan wie de onderneming toebehoort fysiek bereikbaar is.


      [ref1]: https://wetten.overheid.nl/BWBR0024067#Artikel2
    url: https://wetten.overheid.nl/BWBR0024067/2014-07-01#Artikel11a
    references:
      - id: ref1
        bwb_id: BWBR0024067
        artikel: '2'
        hoofdstuk: '1'
  - number: '12'
    text: |-
      1 Indien een onderneming één of meer gevolmachtigde handelsagenten heeft die in Nederland werkzaam zijn, dan worden
      hun persoonlijke gegevens en de inhoud van hun volmacht in het handelsregister opgenomen.

      2 In het handelsregister kunnen gegevens over overige gevolmachtigden van een onderneming worden opgenomen. In dat
      geval worden hun persoonlijke gegevens en de inhoud van hun volmacht opgenomen.
    url: https://wetten.overheid.nl/BWBR0024067/2014-07-01#Artikel12
  - number: '13'
    text: |-
      In het handelsregister worden over een onderneming die toebehoort aan een rechtspersoon in oprichting opgenomen, de
      persoonlijke gegevens van ieder die handelt namens deze rechtspersoon in oprichting.
    url: https://wetten.overheid.nl/BWBR0024067/2014-07-01#Artikel13
  - number: '14'
    text: |-
      In het handelsregister kunnen gegevens over gevolmachtigden van een rechtspersoon worden opgenomen. In dat geval
      worden hun persoonlijke gegevens en de inhoud van hun volmacht opgenomen.
    url: https://wetten.overheid.nl/BWBR0024067/2014-07-01#Artikel14
  - number: '15'
    text: |-
      1 In het handelsregister worden over een rechtspersoon opgenomen:

      a. een korte aanduiding van de uitgeoefende activiteit of activiteiten;

      b. het postadres.

      2 In het handelsregister worden over een rechtspersoon waaraan geen onderneming toebehoort en die geen vestiging
      heeft, opgenomen:

      a. het bezoekadres;

      b. het telefoonnummer, het faxnummer, het e-mailadres en het internetadres;

      c. de naam van de berichtenbox van het centraal loket, bedoeld in
      [artikel 5, eerste lid, onderdeel a, onder 2° van de Dienstenwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel5
    url: https://wetten.overheid.nl/BWBR0024067/2014-07-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '5'
  - number: '16'
    text: |-
      In het handelsregister worden indien een onderneming toebehoort aan een natuurlijk persoon de handtekening en de
      geslachtsaanduiding van deze persoon opgenomen.
    url: https://wetten.overheid.nl/BWBR0024067/2014-07-01#Artikel16
  - number: '17'
    text: |-
      In het handelsregister worden over een vennootschap onder firma, een commanditaire vennootschap of een maatschap
      opgenomen:

      a. van iedere maat of niet-commanditaire vennoot, de datum van zijn toetreding en uittreding en

      1° indien deze een natuurlijk persoon is, de geslachtsaanduiding en de handtekening;

      2° indien deze een rechtspersoon of vennootschap naar Nederlands recht is, het bezoekadres;

      3° indien deze een rechtspersoon of vennootschap naar buitenlands recht is, het bezoekadres, het nummer waaronder
      de rechtspersoon of vennootschap in het buitenlandse register is ingeschreven, de naam van dat register en de
      plaats en het land waar het register wordt gehouden;

      b. de duur waarvoor de vennootschap of maatschap is aangegaan.
    url: https://wetten.overheid.nl/BWBR0024067/2014-07-01#Artikel17
  - number: '18'
    text: |-
      In het handelsregister worden over een commanditaire vennootschap, naast de gegevens van [artikel 17][ref1],
      opgenomen:

      a. het aantal commanditaire vennoten;

      b. het geldbedrag en de waarde van de goederen die de commanditaire vennoten gezamenlijk aan de vennootschap ter
      beschikking hebben gesteld of overeengekomen zijn ter beschikking te zullen stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0024067#Artikel17
    url: https://wetten.overheid.nl/BWBR0024067/2014-07-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0024067
        artikel: '17'
        hoofdstuk: '4'
        paragraaf: '4'
  - number: '19'
    text: |-
      In het handelsregister wordt voorts over een vennootschap onder firma, een commanditaire vennootschap of een
      maatschap opgenomen al hetgeen de overeenkomst bevat ter bepaling van de rechten van derden.
    url: https://wetten.overheid.nl/BWBR0024067/2014-07-01#Artikel19
  - number: '20'
    text: |-
      In het handelsregister worden over een rederij opgenomen:

      a. van ieder lid van de rederij, de datum van zijn toetreding en uittreding en

      1° indien deze een natuurlijk persoon is, de geslachtsaanduiding en de handtekening;

      2° indien deze een rechtspersoon of vennootschap naar Nederlands recht is, het bezoekadres;

      3° indien deze een rechtspersoon of vennootschap naar buitenlands recht is, het bezoekadres, het nummer waaronder
      de rechtspersoon of vennootschap in het buitenlandse register is ingeschreven, de naam van dat register en de
      plaats en het land waar het register wordt gehouden;

      b. de persoonlijke gegevens van de boekhouder, de datum waarop hij bij de rederij als zodanig in en uit functie
      is getreden;

      c. de bevoegdheid van de boekhouder om de rederij te vertegenwoordigen.
    url: https://wetten.overheid.nl/BWBR0024067/2014-07-01#Artikel20
  - number: '22'
    text: |-
      1 In het handelsregister worden over een naamloze vennootschap, een besloten vennootschap met beperkte
      aansprakelijkheid, een Europese naamloze vennootschap of een Europese coöperatieve vennootschap opgenomen:

      a. de persoonlijke gegevens van iedere bestuurder en commissaris, van ieder lid van het besturend orgaan, of van
      ieder lid van het leidinggevende orgaan, de datum waarop hij bij de vennootschap als zodanig in en uit functie
      is getreden en of hij bevoegd is de vennootschap alleen of gezamenlijk handelend met een of meer anderen te
      vertegenwoordigen;

      b. de persoonlijke gegevens van anderen dan de bestuurders aan wie de statuten de bevoegdheid tot
      vertegenwoordiging toekennen en de inhoud van de bevoegdheid;

      c. het geplaatste kapitaal en het gestorte deel ervan;

      d.

      e. de persoonlijke gegevens met uitzondering van de handtekening van de houder van alle aandelen in het kapitaal
      van de vennootschap of van een deelgenoot in een huwelijksgemeenschap dan wel een gemeenschap van een geregistreerd
      partnerschap waartoe alle aandelen in het kapitaal van de vennootschap behoren, de aandelen gehouden door de
      vennootschap of haar dochtermaatschappijen niet meegeteld;

      f. indien zulks het geval is, dat de statuten van de vennootschap beantwoorden aan de
      [artikelen 158 tot en met 161][ref1] en [164][ref2] of de [artikelen 268 tot en met 271][ref3] en
      [274 van boek 2 van het Burgerlijk Wetboek][ref4].

      2 Indien een vennootschap als bedoeld in het eerste lid een beleggingsmaatschappij met veranderlijk kapitaal
      als bedoeld in [artikel 76a van Boek 2 van het Burgerlijk Wetboek][ref5] is, wordt het bedrag opgegeven van het
      ingeschreven kapitaal op de eerste werkdag na 30 april. Tussentijds kunnen in het handelsregister wijzigingen van
      het ingeschreven kapitaal worden opgegeven.

      3 In het handelsregister wordt over een naamloze vennootschap, een Europese naamloze vennootschap en een Europese
      coöperatieve vennootschap opgenomen:

      a. het maatschappelijk kapitaal en wordt het bedrag van het geplaatste kapitaal en het gestorte deel ervan, bedoeld
      in het eerste lid, onderdeel c, onderverdeeld naar soort, indien er verschillende soorten aandelen zijn;

      b. indien niet volgestorte aandelen zijn uitgegeven, de persoonlijke gegevens met uitzondering van de handtekening
      van de houders van zulke aandelen, met vermelding van het aandelenbezit van iedere houder en van het daarop
      gestorte bedrag.

      4 In het handelsregister wordt opgenomen of een bestuurder al dan niet uitvoerend is.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel158
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel164
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Artikel268
      [ref4]: https://wetten.overheid.nl/BWBR0003045#Artikel274
      [ref5]: https://wetten.overheid.nl/BWBR0003045#Artikel76a
