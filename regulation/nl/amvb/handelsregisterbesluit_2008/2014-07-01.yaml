  - number: '2'
    text: |-
      1 Van een onderneming is sprake indien een voldoende zelfstandig optredende organisatorische eenheid van één of
      meer personen bestaat waarin door voldoende inbreng van arbeid of middelen, ten behoeve van derden diensten of
      goederen worden geleverd of werken tot stand worden gebracht met het oogmerk daarmee materieel voordeel te behalen.

      2 Van een onderneming is geen sprake indien er naar het oordeel van de Kamer onvoldoende omvang van activiteiten of
      omzet is.
    url: https://wetten.overheid.nl/BWBR0024067/2014-07-01#Artikel2
  - number: '3'
    text: |-
      1 Voor het doen van een opgave ter inschrijving in het handelsregister bij de Kamer wordt gebruik gemaakt van een
      door de Kamer vastgesteld formulier dat kosteloos verkrijgbaar is.

      2 De Kamer kan ermee instemmen dat een opgave op andere wijze geschiedt dan in het eerste lid bepaald.

      3 Voor zover de Kamer niet op grond van de [Dienstenwet][ref1] of [artikel 19 van de wet][ref2] zorg draagt
      voor de mogelijkheid tot elektronische uitwisseling van gegevens en bescheiden, draagt de Kamer er zorg voor dat
      gegevens en bescheiden langs elektronische weg ontvangen kunnen worden indien voor die gegevens en bescheiden een
      plicht tot neerlegging bestaat op grond van richtlijn nr. 68/151/EEG van de Raad van de Europese Gemeenschappen
      van 9 maart 1968 strekkende tot het coördineren van de waarborgen, welke in de Lid-Staten worden verlangd van de
      vennootschappen in de zin van de tweede alinea van artikel 58 van het Verdrag, om de belangen te beschermen zowel
      van de deelnemers in deze vennootschappen als van derden, zulks ten einde die waarborgen gelijkwaardig te maken
      (PbEG L 65).

      4 Een wijziging van de richtlijn, genoemd in het derde lid, gaat voor de toepassing van het bij of krachtens dit
      besluit bepaalde gelden met ingang van de dag waarop aan de betrokken wijzigingsrichtlijn uitvoering moet zijn
      gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0026759
      [ref2]: https://wetten.overheid.nl/BWBR0021777#Artikel19
    url: https://wetten.overheid.nl/BWBR0024067/2014-07-01#Artikel3
