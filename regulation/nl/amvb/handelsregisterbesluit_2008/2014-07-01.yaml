  - number: '23'
    text: |-
      1 In het handelsregister worden over een Europees economisch samenwerkingsverband opgenomen:

      a. de persoonlijke gegevens van iedere bestuurder en commissaris en de datum waarop hij in en uit functie is
      getreden, en of hij bevoegd is het samenwerkingsverband alleen of gezamenlijk handelend met een of meer anderen
      te vertegenwoordigen;

      b. indien een beding is gemaakt als bedoeld in artikel 26, tweede lid, tweede alinea, van [verordening 2137/85]
      (31985R2137), de inhoud van dat beding;

      c. indien een bestuurder niet een natuurlijke persoon is, de persoonlijke gegevens van een ieder die als
      vertegenwoordiger in de zin van artikel 19, tweede lid, van [verordening 2137/85](31985R2137) is aangewezen en de
      datum waarop hij als vertegenwoordiger is aangewezen.

      2 Bij het handelsregister wordt gedeponeerd een authentiek afschrift of een door een opgaveplichtige gewaarmerkt
      afschrift van de oprichtingsovereenkomst in de Nederlandse, Duitse, Engelse of Franse taal.
    url: https://wetten.overheid.nl/BWBR0024067/2014-07-01#Artikel23
  - number: '24'
    text: |-
      1 Indien een in Nederland gevestigde onderneming of een in Nederland gelegen nevenvestiging van een buiten
      Nederland gevestigde onderneming toebehoort aan een vennootschap als bedoeld in [richtlijn 68/151/EEG](31968L0151),
      opgericht naar het recht van een andere staat dan Nederland en die staat partij is bij de Overeenkomst betreffende
      de Europese Economische Ruimte, zijn de [artikelen 15][ref1], [22][ref2] en [23][ref3] niet van toepassing.

      2 In het handelsregister wordt over een vennootschap als bedoeld in het eerste lid opgenomen, de persoonlijke
      gegevens van iedere bestuurder en commissaris, de datum waarop hij in en uit functie is getreden en of hij bevoegd
      is de vennootschap alleen of handelend met een of meer anderen te vertegenwoordigen.

      3 In het handelsregister worden over de in het eerste lid bedoelde onderneming of nevenvestiging opgenomen,
      de persoonlijke gegevens van de bij de onderneming of de hoofdnederzetting werkzame beheerder of een andere
      vergelijkbare gevolmachtigde, zijn functie en de datum waarop hij bij de onderneming of de hoofdnederzetting als
      zodanig in en uit functie is getreden en de inhoud van zijn volmacht.

      4 Bij het handelsregister wordt gedeponeerd een authentiek afschrift of een door een opgaveplichtige gewaarmerkt
      afschrift van de oprichtingsakte van de vennootschap en van de statuten, indien deze in een afzonderlijke akte zijn
      opgenomen in de Nederlandse, Duitse, Engelse of Franse taal.

      5 Bij het handelsregister wordt telkens het meest recente exemplaar van de boekhoudbescheiden van de vennootschap
      gedeponeerd, voor zover en in de vorm waarin de vennootschap deze in het land van haar statutaire zetel openbaar
      moet maken, in de Nederlandse, Duitse, Engelse of Franse taal.


      [ref1]: https://wetten.overheid.nl/BWBR0024067#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0024067#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0024067#Artikel23
