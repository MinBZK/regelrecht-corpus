        bwb_id: BWBR0021777
        artikel: '6'
  - number: '33'
    text: |-
      Als gegevens als bedoeld in [artikel 17, eerste lid, onderdeel c, van de wet][ref1], worden voor publiekrechtelijke
      rechtspersonen aangewezen:

      a. de statutaire zetel, bedoeld in [artikel 12, onderdeel c, van de wet][ref2];

      b. de datum van aanvang, bedoeld in [artikel 12, onderdeel d][ref3], of [artikel 13, onderdeel b, van de wet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0021777#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0021777#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0021777#Artikel12
      [ref4]: https://wetten.overheid.nl/BWBR0021777#Artikel13
