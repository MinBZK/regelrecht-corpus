  - number: '34'
    text: |-
      In het handelsregister worden over een onderneming die toebehoort aan een publiekrechtelijke rechtspersoon
      opgenomen, de naam van iedere bestuurder en ieder lid van het toezichthoudend orgaan, of hij bevoegd is de
      rechtspersoon te vertegenwoordigen en de inhoud van deze bevoegdheid.
    url: https://wetten.overheid.nl/BWBR0024067/2014-07-01#Artikel34
  - number: '35'
    text: |-
      In het handelsregister worden over een vestiging opgenomen:

      a. het telefoonnummer, het faxnummer, het e-mailadres en het internetadres;

      b. een korte aanduiding van de uitgeoefende activiteit of activiteiten.
    url: https://wetten.overheid.nl/BWBR0024067/2014-07-01#Artikel35
  - number: 35a
    text: |-
      Over een bestuurder of een gevolmachtigde of een andere functionaris die niet een natuurlijk persoon is en die
      niet is ingeschreven in het handelsregister kan een door de Kamer toe te kennen uniek nummer worden opgenomen.
      De Belastingdienst verstrekt daartoe op verzoek van de Kamer de bij hem bekende nummers van deze gevolmachtigden
      of functionarissen.
    url: https://wetten.overheid.nl/BWBR0024067/2014-07-01#Artikel35a
  - number: '36'
    text: |-
      1 Indien een minderjarige, aan wie een onderneming toebehoort, die niet-commanditair vennoot of lid van een rederij
      is, handlichting heeft verkregen, worden in het handelsregister opgenomen, de datum waarop de handlichting is
      verkregen en de bevoegdheden die de minderjarige daarbij zijn toegekend.

      2 Bij de opgave ter inschrijving wordt de datum van uitgave en het nummer van de Staatscourant overgelegd waarin de
      rechterlijke beschikking inzake de handlichting is openbaar gemaakt, of een authentiek afschrift van de beschikking
      met vermelding van de dagtekening en het nummer van die Staatscourant.
    url: https://wetten.overheid.nl/BWBR0024067/2014-07-01#Artikel36
  - number: '37'
    text: |-
      In geval van onderbewindstelling als bedoeld in [titel 18][ref1] of [titel 19 van Boek 1][ref2] of
      [titel 5, afdeling 7, van Boek 4 van het Burgerlijk Wetboek][ref3], [artikel 8, onder b][ref4], of
      [29, eerste lid, onder b, van de Wet op de economische delicten][ref5] van een onderneming, een aandeel in een
      vennootschap of in een rederij worden in het handelsregister opgenomen:

      a. de persoonlijke gegevens van de bewindvoerder en de datum waarop hij in en uit functie is getreden;

      b. de rechterlijke beslissingen inzake zijn bevoegdheid als bedoeld in de [artikelen 437, tweede lid][ref6], en
      [441, tweede lid, onderdeel f, en derde lid, van Boek 1 van het Burgerlijk Wetboek][ref7];

      c. de omstandigheid of het bewind is ingesteld in het belang van de rechthebbende, in het belang van een
      ander dan de rechthebbende, dan wel zowel in het belang van de rechthebbende als een of meer anderen of
      in een gemeenschappelijk belang zoals bedoeld in [artikel 167 van Boek 4 Burgerlijk Wetboek][ref8], de
      bevoegdheden van de bewindvoerder zoals geregeld in de uiterste wil overeenkomstig [artikel 171 lid 1][ref9]
      en de rechterlijke beslissing inzake de bevoegdheid van de bewindvoerder als bedoeld in
      [artikel 171 lid 2 van Boek 4 Burgerlijk Wetboek][ref10];

      d. de aanvang en het einde van het bewind.


      [ref1]: https://wetten.overheid.nl/BWBR0002656
      [ref2]: https://wetten.overheid.nl/BWBR0002656
      [ref3]: https://wetten.overheid.nl/BWBR0002761#Afdeling7
      [ref4]: https://wetten.overheid.nl/BWBR0002063#Artikel8
      [ref5]: https://wetten.overheid.nl/BWBR0002063#Artikel29
