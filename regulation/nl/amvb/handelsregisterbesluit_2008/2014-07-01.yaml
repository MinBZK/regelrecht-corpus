  - number: '41'
    text: |-
      Alle aankondigingen die ingevolge de [Wet op het financieel toezicht][ref1] in de Staatscourant worden opgenomen,
      worden tevens opgenomen in het handelsregister.


      [ref1]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0024067/2014-07-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0020368
  - number: '42'
    text: |-
      In het handelsregister worden over de melding en het onderzoek alle gegevens opgenomen die de Kamer noodzakelijk
      acht voor het functioneren van het register.
    url: https://wetten.overheid.nl/BWBR0024067/2014-07-01#Artikel42
  - number: '43'
    text: |-
      De persoonlijke gegevens van natuurlijke personen, met uitzondering van de handtekening, worden overgenomen uit de
      basisregistratie personen, met inbegrip van de datum waarop wijzigingen van die gegevens zijn ingegaan.
    url: https://wetten.overheid.nl/BWBR0024067/2014-07-01#Artikel43
  - number: '44'
    text: |-
      De gegevens die worden overgenomen uit de basisregistratie personen verschillen ten hoogste 72 uur met de gegevens
      in die basisregistratie.
    url: https://wetten.overheid.nl/BWBR0024067/2014-07-01#Artikel44
  - number: '45'
    text: |-
      1 De melding wordt gedaan door middel van een bij ministeriële regeling vastgesteld formulier.

      2 De melding bevat ten minste:

      a. het unieke nummer, bedoeld in [artikel 12, onderdeel a, van de wet][ref1], van de rechtspersoon die de melding
      doet;

      b. de naam, het telefoonnummer en het correspondentieadres van een contactpersoon voor de melding;

      c. voorzover bekend, alle op de melding betrekking hebbende unieke nummers bedoeld in
      [artikel 9 tot en met 14 van de wet][ref2];

      d. het gegeven waarop de melding betrekking heeft;

      e. indien mogelijk een indicatie van het juiste gegeven met onderbouwende stukken;

      f. de datum van de melding en de datum van de constatering van de vermoedelijke onjuistheid van het gegeven.

      3 Indien de melding betrekking heeft op een onderneming of rechtspersoon die niet in het register is opgenomen
      wordt dat op het formulier aangegeven.

      4 Indien de melding betrekking heeft op een gegeven dat is overgenomen uit een ander basisregister, zendt de Kamer
      de melding binnen één werkdag door aan de beheerder van dat register.


      [ref1]: https://wetten.overheid.nl/BWBR0021777#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0021777#Artikel9
    url: https://wetten.overheid.nl/BWBR0024067/2014-07-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0021777
        artikel: '12'
      - id: ref2
        bwb_id: BWBR0021777
        artikel: '9'
  - number: '46'
    text: |-
      Een aantekening, dat een gegeven in onderzoek is, wordt geplaatst bij het gegeven waarop de melding betrekking
      heeft.
    url: https://wetten.overheid.nl/BWBR0024067/2014-07-01#Artikel46
  - number: '47'
    text: |-
      De Kamer informeert het bestuursorgaan dat een melding heeft gedaan over:

      a. het besluit dat de Kamer neemt naar aanleiding van de melding;

      b. het feit dat tegen het onder a bedoelde besluit bezwaar is gemaakt en de beslissing op dat bezwaar;

      c. het feit dat beroep is ingediend en de onherroepelijk geworden rechterlijke uitspraak in dat beroep.
    url: https://wetten.overheid.nl/BWBR0024067/2014-07-01#Artikel47
  - number: '48'
    text: |-
      Als gegevens als bedoeld in [artikel 38, tweede lid, van de wet][ref1] worden de in [hoofdstuk 4][ref2] genoemde
      gegevens aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0021777#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0024067#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0024067/2014-07-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0021777
        artikel: '38'
      - id: ref2
        bwb_id: BWBR0024067
        hoofdstuk: '4'
  - number: '49'
    text: |-
      Indien bij rechterlijke uitspraak hetgeen in het handelsregister is opgenomen geheel of gedeeltelijk onrechtmatig
      is verklaard, doet de Kamer op verzoek van een belanghebbende daarvan aantekening in het register.
    url: https://wetten.overheid.nl/BWBR0024067/2014-07-01#Artikel49
  - number: '50'
    text: |-
      Als gegevens bedoeld in [artikel 25, vierde lid, onderdeel c, van de wet][ref1], worden alle gegevens aangewezen
      over een onderneming of rechtspersoon die voor het eerst is opgenomen in het handelsregister zonder een opgave door
      een daartoe bevoegd persoon, zolang de handtekening van degene die tot het doen van opgave verplicht is, niet in
      het handelsregister is opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0021777#Artikel25
    url: https://wetten.overheid.nl/BWBR0024067/2014-07-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0021777
        artikel: '25'
  - number: '51'
    text: |-
      1 Het adres van een:

      a. bestuurder, gewezen bestuurder,

      b. commissaris of gewezen commissaris,

      c. gevolmachtigde of gewezen gevolmachtigde,

      d. enig aandeelhouder of gewezen enig aandeelhouder,

      e. houder of gewezen houder van niet volgestorte aandelen,

      f. vereffenaar of gewezen vereffenaar of

      g. beheerder of gewezen beheerder, bedoeld in [artikel 24, derde lid][ref1],
      [artikel 25, derde lid, onder b][ref2], of [artikel 26, derde lid, onder b][ref3]

      van een rechtspersoon kan niet worden ingezien, behalve door bestuursorganen, als bedoeld in
      [artikel 1:1, eerste lid, onderdeel a, van de Algemene wet bestuursrecht][ref4], advocaten, deurwaarders,
      notarissen en de in [artikel 28, derde lid, van de wet][ref5] genoemde organisaties.

      2 Het eerste lid is niet van toepassing op bestuurders van verenigingen zonder volledige
      rechtsbevoegdheid, verenigingen van eigenaars en overige privaatrechtelijke rechtspersonen, bedoeld in
      [artikel 6, eerste lid, onderdeel b, van de wet][ref6].

      3 Het adres van een natuurlijk persoon kan op zijn verzoek worden afgeschermd tegen inzage door anderen dan
      bestuursorganen, als bedoeld in [artikel 1:1, eerste lid, onderdeel a, van de Algemene wet bestuursrecht][ref7],
      advocaten, deurwaarders, notarissen en de in [artikel 28, derde lid, van de wet][ref8] genoemde organisaties,
      indien:

      a. er sprake is van een waarschijnlijke dreiging;

      b. het woonadres in het handelsregister niet kan worden ingezien met betrekking tot een andere onderneming;

      c. betrokkene niet beschikt over een openbaar telefoonnummer;

      d. deze persoon zelf maatregelen heeft genomen om de bekendheid van zijn adres te verminderen, en

      e. het belang van afscherming zwaarder weegt dan de rechtszekerheid in het economisch verkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0024067#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0024067#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0024067#Artikel26
