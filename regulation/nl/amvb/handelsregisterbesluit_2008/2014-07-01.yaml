  - number: '26'
    text: |-
      1 Indien een in Nederland gevestigde onderneming of een in Nederland gelegen nevenvestiging van een buiten
      Nederland gevestigde onderneming toebehoort aan een vennootschap of rechtspersoon opgericht naar het recht van een
      ander land dan Nederland, niet zijnde een vennootschap als bedoeld in de [artikelen 24][ref1] en [25][ref2], zijn
      de [artikelen 15][ref3] en [18 tot en met 23][ref4] niet van toepassing.

      2 In het handelsregister worden over de in het eerste lid bedoelde vennootschap of rechtspersoon opgenomen:

      a. de persoonlijke gegevens van iedere vennoot, bestuurder en commissaris van de vennootschap of rechtspersoon, de
      datum waarop hij bij de vennootschap of rechtspersoon als zodanig in en uit functie is getreden, of hij bevoegd is
      de vennootschap of rechtspersoon alleen of gezamenlijk met een of meer anderen te vertegenwoordigen en de inhoud
      van zijn bevoegdheid;

      b. onder het recht van welk land de vennootschap of rechtspersoon valt.

      3 In het handelsregister worden over de in het eerste lid bedoelde onderneming of nevenvestiging opgenomen:

      a. indien de hoofdvestiging van de onderneming buiten Nederland is gelegen, het post- en bezoekadres van de
      hoofdvestiging van de onderneming en hetgeen ingevolge de wetgeving van het desbetreffende land omtrent de
      onderneming in het register aldaar wordt opgenomen of op andere wijze wordt openbaar gemaakt;

      b. de persoonlijke gegevens van de bij de onderneming of de hoofdnederzetting werkzame beheerder of een andere
      dergelijke gevolmachtigde, zijn functie, de datum waarop hij bij de onderneming of de hoofdnederzetting als zodanig
      in en uit functie is getreden en de inhoud van zijn volmacht.

      4 [Artikel 24, vierde lid][ref5], voor zover het een rechtspersoon betreft, en vijfde lid, zijn van overeenkomstige
      toepassing.

      5 In afwijking van het tweede lid, onderdeel a, worden over een rechtspersoon met meer dan 20 vennoten, niet de
      in dat lid genoemde gegevens opgenomen over de vennoten die niet aan de Nederlandse vestiging van de rechtspersoon
      zijn verbonden.


