  - number: '25'
    text: |-
      1 Indien een in Nederland gevestigde onderneming of een in Nederland gelegen nevenvestiging van een buiten
      Nederland gevestigde onderneming toebehoort aan een vennootschap opgericht naar het recht van een staat die geen
      partij is bij de Overeenkomst betreffende de Europese Economische Ruimte, met een rechtsvorm die vergelijkbaar is
      met een vennootschap als bedoeld in [richtlijn 68/151/EEG](31968L0151), zijn de [artikelen 15][ref1], [22][ref2] en
      [23][ref3] niet van toepassing.

      2 In het handelsregister worden over een vennootschap als bedoeld in het eerste lid opgenomen:

      a. de persoonlijke gegevens van iedere bestuurder en commissaris van de vennootschap, de datum waarop hij bij de
      vennootschap als zodanig in en uit functie is getreden, of hij bevoegd is de vennootschap alleen of gezamenlijk
      handelend met een of meer anderen te vertegenwoordigen en de inhoud van zijn bevoegdheid;

      b. onder het recht van welk land de vennootschap valt.

      3 In het handelsregister worden over de in het eerste lid bedoelde onderneming of nevenvestiging opgenomen:

      a. indien de hoofdvestiging van de onderneming buiten Nederland is gelegen, het post- en bezoekadres van de
      hoofdvestiging van de onderneming;

      b. de persoonlijke gegevens van de bij de onderneming of de hoofdnederzetting werkzame beheerder of een andere
      vergelijkbare gevolmachtigde, zijn functie en de datum waarop hij bij de onderneming of de hoofdnederzetting als
      zodanig in en uit functie is getreden, en de inhoud van zijn volmacht;

      c. het bedrag van het geplaatste kapitaal van de vennootschap op de eerste werkdag na 30 april van de vennootschap.

      4 In aanvulling op de opgave, bedoeld in het derde lid, onder c, kunnen in het handelsregister tussentijds
      wijzigingen van het ingeschreven kapitaal worden opgegeven.

      5 [Artikel 24, vierde en vijfde lid][ref4], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0024067#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0024067#Artikel22
