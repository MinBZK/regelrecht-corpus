  - number: '38'
    text: |-
      In geval van curatele van degene aan wie een onderneming toebehoort, van een vennoot of lid
      van een rederij, worden in het handelsregister opgenomen alle aankondigingen die krachtens
      [artikel 390 van Boek 1 van het Burgerlijk Wetboek][ref1] in de Staatscourant worden opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel390
    url: https://wetten.overheid.nl/BWBR0024067/2014-07-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '390'
  - number: '39'
    text: |-
      In het handelsregister worden opgenomen:

      a. de rechterlijke uitspraak houdende faillietverklaring, verlening van surseance van betaling of het van
      toepassing verklaren van de schuldsaneringsregeling natuurlijke personen betreffende degene die als eigenaar van
      een onderneming, als vennoot of als lid van een rederij in het handelsregister is ingeschreven of betreffende een
      ingeschreven rechtspersoon;

      b. de vernietiging van een zodanige uitspraak;

      c. het einde van het faillissement, de surseance van betaling of de toepassing van de schuldsaneringsregeling
      natuurlijke personen;

      d. in geval van faillietverklaring, verlening van surseance van betaling of het van toepassing verklaren van de
      schuldsaneringsregeling natuurlijke personen: de naam en het adres van de rechter-commissaris, en van de curator of
      de bewindvoerder.
    url: https://wetten.overheid.nl/BWBR0024067/2014-07-01#Artikel39
  - number: '40'
    text: |-
      1 In het handelsregister wordt de ontbinding van een vennootschap of rechtspersoon opgenomen, onder vermelding van
      datum van de ontbinding, de persoonlijke gegevens, de bevoegdheid van ieder der vereffenaars en de datum waarop hij
      vereffenaar is geworden.

      2 Indien de ontbinding een vennootschap betreft als bedoeld in [artikel 24][ref1] worden in het handelsregister
      opgenomen de bevoegdheden van de vereffenaars, indien die in het land waar de vennootschap is gevestigd
      openbaar gemaakt moeten worden. Indien de ontbinding een vennootschap of rechtspersoon als bedoeld in de
      [artikelen 25][ref2] en [26][ref3] betreft, worden mede opgenomen de bevoegdheden van de vereffenaars.

      3 De voltooiing van de vereffening van een Europees economisch samenwerkingsverband of van een vennootschap of
      rechtspersoon als bedoeld in de [artikelen 24][ref4], [25][ref5] en [26][ref6], wordt in het handelsregister
      opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0024067#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0024067#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0024067#Artikel26
      [ref4]: https://wetten.overheid.nl/BWBR0024067#Artikel24
