  - number: '7'
    text: |-
      Bij de opgave ter inschrijving van een Europese naamloze vennootschap, een Europees economisch samenwerkingsverband
      en een Europese coöperatieve vennootschap worden tevens gegevens en bewijsstukken overgelegd waaruit blijkt
      dat voldaan is aan de voorwaarden voor inschrijving ingevolge [verordening 2137/85](31985R2137), [verordening
      2157/2001](32001R2157) en [verordening 1435/2003](32003R1435).
    url: https://wetten.overheid.nl/BWBR0024067/2014-07-01#Artikel7
  - number: '8'
    text: |-
      1 In het handelsregister wordt een kerkgenootschap als bedoeld in
      [artikel 2 van Boek 2 van het Burgerlijk Wetboek][ref1], dat geen deel uitmaakt van een organisatie als bedoeld in
      [artikel 6, derde lid, van de wet][ref2], ingeschreven.

      2 In het handelsregister wordt een kerkgenootschap als bedoeld in
      [artikel 2, van Boek 2, van het Burgerlijk Wetboek][ref3], dat deel uitmaakt van een organisatie als bedoeld in
      [artikel 6, derde lid, van de wet][ref4], die geen rechtspersoonlijkheid heeft, ingeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel2
