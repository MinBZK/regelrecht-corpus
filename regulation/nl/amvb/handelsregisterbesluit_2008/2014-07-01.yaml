  - number: '32'
    text: |-
      In het handelsregister worden over overige privaatrechtelijke rechtspersonen als bedoeld in
      [artikel 6, eerste lid, onderdeel b, van de wet][ref1] opgenomen:

      a. de persoonlijke gegevens van ieder lid van het besturend en toezichthoudend orgaan en de datum waarop hij in en
      uit functie is getreden, of hij bevoegd is de rechtspersoon alleen of gezamenlijk handelend met een of meer anderen
      te vertegenwoordigen en de inhoud van deze bevoegdheid;

      b. de persoonlijke gegevens van anderen dan de bestuurders aan wie de statuten of reglementen bevoegdheid tot
      vertegenwoordiging toekennen, en de inhoud van de bevoegdheid;

      c. de oprichtingsakte of statuten, waaruit de rechtspersoonlijkheid blijkt.


      [ref1]: https://wetten.overheid.nl/BWBR0021777#Artikel6
    url: https://wetten.overheid.nl/BWBR0024067/2014-07-01#Artikel32
