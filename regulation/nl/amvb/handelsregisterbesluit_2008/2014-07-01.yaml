  - number: '9'
    text: |-
      1 Een wijziging van hetgeen in het handelsregister is opgenomen, wordt opgegeven met vermelding van de datum waarop
      de wijziging is ingegaan.

      2 De Kamer vermeldt zo mogelijk de datum waarop de wijziging is ingegaan indien tot wijziging wordt besloten op
      grond van de [artikelen 34 tot en met 36 van de wet][ref1].

      3 In het handelsregister wordt, indien een gegeven geen derdenwerking heeft ingevolge [artikel 50][ref2], een
      aantekening opgenomen dat het gegeven geen derdenwerking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0021777#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0024067#Artikel50
    url: https://wetten.overheid.nl/BWBR0024067/2014-07-01#Artikel9
