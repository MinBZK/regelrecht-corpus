    text: |-
      In het handelsregister worden over een stichting opgenomen:

      a. de persoonlijke gegevens van iedere bestuurder en ieder lid van het toezichthoudend orgaan en de datum
      waarop hij bij de stichting als zodanig in en uit functie is getreden, of hij bevoegd is de stichting alleen of
      gezamenlijk handelend met een of meer anderen te vertegenwoordigen;

      b. de persoonlijke gegevens van anderen dan de bestuurders aan wie de statuten bevoegdheid tot vertegenwoordiging
      toekennen, en de inhoud van de bevoegdheid.
    url: https://wetten.overheid.nl/BWBR0024067/2014-07-01#Artikel29
  - number: '30'
    text: |-
      In het handelsregister worden over een vereniging van eigenaars opgenomen:

      a. de persoonlijke gegevens van iedere bestuurder en de datum waarop hij in en uit functie is getreden, en de
      inhoud van zijn bevoegdheid de vereniging te vertegenwoordigen.

      b. een authentiek afschrift van de notariële akte, dan wel een authentiek uittreksel van de notariële akte
      bevattende de statuten;

      c. een authentiek afschrift van de notariële akte van wijziging en de gewijzigde statuten.
    url: https://wetten.overheid.nl/BWBR0024067/2014-07-01#Artikel30
  - number: '31'
    text: |-
      1 In het handelsregister wordt over een organisatie met rechtspersoonlijkheid waarvan een of meer
      kerkgenootschappen deel uitmaken als bedoeld in [artikel 6, derde lid van de wet][ref1] opgenomen:

      a. het post- en bezoekadres;

      b. het telefoonnummer, het faxnummer, het e-mailadres en het internetadres.

      2 In het handelsregister worden over een kerkgenootschap, als bedoeld in
      [artikel 8, eerste dan wel tweede lid][ref2], opgenomen:

      a. het post- en bezoekadres;

      b. het telefoonnummer, het faxnummer, het e-mailadres en het internetadres;

      3 Als gegevens, als bedoeld in [artikel 17, eerste lid, onderdeel c, van de wet][ref3] worden voor
      kerkgenootschappen en lichamen, in de zin van [artikel 2 van Boek 2 van het Burgerlijk Wetboek][ref4] aangewezen:

      a. de statutaire zetel, bedoeld in [artikel 12, onderdeel c, van de wet][ref5];

      b. de datum van aanvang, bedoeld in [artikel 12, onderdeel d, van de wet][ref6];

      c. de datum van aanvang, bedoeld in [artikel 13, onderdeel b, van de wet][ref7];

      d. de gegevens, bedoeld in [artikel 13, onderdeel c][ref8], en [artikel 14 van de wet][ref9].

      4 In het handelsregister kunnen over een kerkgenootschap of een zelfstandig onderdeel daarvan, in de zin van
      [artikel 2 van Boek 2 van het Burgerlijk Wetboek][ref10] worden opgenomen:

      a. de naam;

      b. het post- en bezoekadres;

      c. het telefoonnummer, het faxnummer, het e-mailadres en het internetadres;

      d. de gegevens, genoemd in het derde lid.


