preamble:
  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Op de voordracht van Onze Minister van Landbouw en Visserij van 1 februari 1988, Nr. J. 34, Directie Juridische en
    Bedrijfsorganisatorische Zaken;


    Gelet op artikel 91, vierde lid, van de Zaaizaad- en Plantgoedwet (Stb. 1966, 455);


    Gehoord het Landbouwschap, het Produktschap voor Siergewassen, de Nederlandse Tuinbouwraad, de Vereniging van
    Nederlandse Tuinbouw studiegroepen, De Nederlandse Bond van Boomkwekers, de Bond van Plantenhandelaren en de
    Stichting Nederlandse Algemene Keuringsdienst voor Boomkwekerijgewassen;


    Overwegende dat het wenselijk is regelen te stellen met betrekking tot het bedrijfsmatig in het verkeer brengen en
    verder verhandelen van teeltmateriaal van bepaalde boomkwekerijgewassen;


    De Raad van State gehoord (advies van 15 april 1988, Nr. W11.88.0048);


    Gezien het nader rapport van Onze Minister van Landbouw en Visserij van 27 mei 1988, Nr. J. 4742, Directie
    Juridische en Bedrijfsorganisatorische Zaken;


    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0004347/2000-02-16#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In dit besluit wordt verstaan onder:

      a. Onze Minister: Onze Minister van Landbouw, Natuurbeheer en Visserij;

      b. Naktuinbouw: Stichting Nederlandse Algemene Kwaliteitsdienst Tuinbouw te Roelofarendsveen;

      c. Naktuinbouw-document: schriftelijk bewijsstuk, ingericht overeenkomstig een door Onze Minister vastgesteld
      model, waarin wordt aangegeven dat het betrokken teeltmateriaal door de Naktuinbouw is goedgekeurd dan wel met
      toestemming van de Naktuinbouw in het verkeer gebracht en verder verhandeld mag worden;

      d. EEG-richtlijnen:

      1e. [richtlijn nr. 66/404/EEG](31966L0404) van de Raad van de Europese Gemeenschappen van 14 juni 1966 betreffende
      het in de handel brengen van bosbouwkundig teeltmateriaal (PbEG L 125);

      2e. [richtlijn nr. 70/458/EEG](31970L0458) van de Raad van de Europese Gemeenschappen van 29 september 1970
      betreffende het in de handel brengen van groentezaad (*PbEG* L 225);

      3e. [richtlijn nr. 71/161/EEG](31971L0161) van de Raad van de Europese Gemeenschappen van 30 maart 1971 betreffende
      de normen voor de uitwendige kwaliteit van bosbouwkundig teeltmateriaal dat binnen de Gemeenschap in de handel
      wordt gebracht (PbEG L 87);

      4e. [richtlijn nr. 92/33/EEG](31992L0033) van de Raad van de Europese Gemeenschappen van 28 april 1992 betreffende
      het in de handel brengen van teeltmateriaal en plantgoed van groentegewassen, met uitzondering van zaad (*PbEG*
      L 157);

      5e. [richtlijn nr. 92/34/EEG](31992L0034) van de Raad van de Europese Gemeenschappen van 28 april 1992 betreffende
      het in de handel brengen van teeltmateriaal van fruitgewassen, alsmede van fruitgewassen die voor de fruitteelt
      worden gebruikt (PbEG L 157);

      6e. [richtlijn nr. 98/56/EG](31998L0056) van de Raad van de Europese Unie van 20 juli 1998 betreffende het in de
      handel brengen van teeltmateriaal van siergewassen (PbEG L 226);

      e. derde land: gebied waarop het EG-verdrag niet van toepassing is of een gebied waarop de Overeenkomst betreffende
      de Europese Economische Ruimte niet van toepassing is.

      2 Een wijziging van de EEG-richtlijnen gaat voor de toepassing van [artikel 2, tweede lid][ref1], gelden met ingang
      van de dag waarop aan de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0004347#Artikel2
    url: https://wetten.overheid.nl/BWBR0004347/2000-02-16#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004347
        artikel: '2'
  - number: '2'
    text: |-
      1 Het bezit met het oog op verkoop, het aanbieden voor verkoop, het bedrijfsmatig in het verkeer brengen,
      verder verhandelen, invoeren, uitvoeren en ten uitvoer aanbieden van teeltmateriaal van de in het
      [Aansluitingsbesluit Naktuinbouw][ref1] genoemde gewassen alsmede het doen verrichten van deze handelingen is
      verboden.

      2 Het bepaalde in het eerste lid geldt niet indien dat materiaal:

      a. voor zover in Nederland voortgebracht, voldoet aan de eisen gesteld bij door Onze Minister goedgekeurde
      voorschriften van de Naktuinbouw met betrekking tot de gezondheid, rasechtheid, raszuiverheid, uitwendige
      kwaliteit, kiemkracht en andere hoedanigheden, sortering, classificering, etikettering en verpakking en ten
      bewijze daarvan wordt begeleid door een geldig Naktuinbouw-document dan wel de verpakking is voorzien van een
      voorgeschreven etiket of aanduiding;

      b. voor zover voortgebracht of in het verkeer gebracht in een andere lid-staat van de Europese Unie dan wel
      voorgebracht in een staat die partij is bij de overeenkomst inzake de Europese Economische Ruimte, voldoet aan
      de bij of krachtens de EEG-richtlijnen gestelde eisen en ten bewijze daarvan wordt begeleid door een officieel
      document of de verpakking is voorzien van een bij of krachtens de EEG-richtlijnen voorgeschreven etiket of
      aanduiding, dan wel voldoet aan in die staat geldende gelijkwaardige voorschriften ten aanzien van in onderdeel a
      genoemde kenmerken;

      c. voor zover ingevoerd vanuit een derde land, door de Naktuinbouw vrij is bevonden van tekortkomingen waardoor
      het niet zou voldoen aan de in onderdeel a genoemde eisen en wordt begeleid door een officieel document of de
      verpakking is voorzien van een bij of krachtens de EEG-richtlijnen voorgeschreven etiket of aanduiding;

      d. indien het een genetisch gemodificeerd organisme betreft, als zodanig in de verkoopcatalogus wordt vermeld.

      3 Het in het eerste en tweede lid bepaalde is niet van toepassing op hem die ter zake van de in dat lid bedoelde
      behandelingen is aangesloten bij de Naktuinbouw en die zich daarbij heeft onderworpen aan de door die instelling
      met betrekking tot die handelingen vastgestelde en door de minister goedgekeurde regelen.


      [ref1]: https://wetten.overheid.nl/BWBR0002566
    url: https://wetten.overheid.nl/BWBR0004347/2000-02-16#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002566
  - number: '3'
    text: >-
      1 De keuring, waaronder wordt begrepen herkeuring, van teeltmateriaal en de afgifte van documenten geschiedt door
      de Naktuinbouw overeenkomstig de door de minister goedgekeurde voorschriften van die keuringsinstelling.


      2 Onverminderd de weigering tot goedkeuring of afgifte van documenten op grond van de in het eerste lid bedoelde
      voorschriften, wordt niet tot het nemen van een keuringsbeslissing of tot de afgifte van documenten overgegaan
      indien aan de Naktuinbouw onvoldoende gegevens ter beschikking staan omtrent de herkomst en hoedanigheid van
      het teeltmateriaal of omtrent de grootte van de verworven partij, waaruit het teeltmateriaal is afgezonderd,
      onderscheidenlijk de grootte van de af te leveren partij.
    url: https://wetten.overheid.nl/BWBR0004347/2000-02-16#Artikel3
  - number: '4'
    text: |-
      1 Hij die teeltmateriaal van de in het [Aansluitingsbesluit Naktuinbouw][ref1] genoemde gewassen bezit met het oog
      op verkoop, aanbiedt voor verkoop, bedrijfsmatig in het verkeer brengt, verder verhandelt, invoert, uitvoert en ten
      uitvoer aanbiedt alsmede deze handelingen daarmee doet verrichten dient een volledige administratie ten aanzien van
      deze handelingen met teeltmateriaal bij te houden.

      2 Deze administratie dient zodanig te zijn ingericht dat op eenvoudige wijze kan worden nagegaan op welke
      tijdstippen, in welke hoeveelheid en van respectievelijk aan welke bedrijven en welk teeltmateriaal werd verworven
      respectievelijk geleverd.

      3 Hij die zaden van de in het [Aansluitingsbesluit Naktuinbouw][ref2] genoemde gewassen bezit met het oog op
      verkoop, aanbiedt voor verkoop, bedrijfsmatig in het verkeer brengt, verder verhandelt, invoert, uitvoert en ter
      uitvoer aanbiedt alsmede deze handelingen daarmee doet verrichten, neemt van elk van de te verhandelen partij
      monsters volgens aanwijzingen gesteld bij door Onze Minister goedgekeurde voorschriften van de Naktuinbouw,
      bewaart deze monsters tenminste gedurende een periode van twee jaar ordelijk en behoorlijk en houdt de monsters ter
      beschikking van de Naktuinbouw.

      4 Van elk monster staat door een blijvende aanduiding, geplaatst op of aan de verpakking, steeds vast van welke
      partij het is getrokken. Indien het een mengpartij betreft dan is eveneens aangegeven uit welke partijen en in
      welke verhouding de mengpartij is samengesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002566
      [ref2]: https://wetten.overheid.nl/BWBR0002566
    url: https://wetten.overheid.nl/BWBR0004347/2000-02-16#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002566
      - id: ref2
        bwb_id: BWBR0002566
  - number: '5'
    text: |-
      De Naktuinbouw stelt aan belanghebbende op aanvraag de in [artikel 2][ref1] en 3 bedoelde voorschriften ter
      beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0004347#Artikel2
    url: https://wetten.overheid.nl/BWBR0004347/2000-02-16#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0004347
        artikel: '2'
  - number: '6'
    text: |-
      Een belanghebbende kan tegen een besluit als bedoeld in [artikel 3, tweede lid][ref1], beroep instellen bij Onze
      Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0004347#Artikel3
    url: https://wetten.overheid.nl/BWBR0004347/2000-02-16#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0004347
        artikel: '3'
  - number: '7'
    text: >-
      1 Onze Minister kan vrijstelling en op aanvraag, ontheffing verlenen aan hetgeen bij of krachtens dit besluit is
      geregeld.


      2 Aan vrijstellingen en ontheffingen, bedoeld in het eerste lid, kunnen voorschriften worden verbonden. Zij kunnen
      onder beperkingen worden verleend.
    url: https://wetten.overheid.nl/BWBR0004347/2000-02-16#Artikel7
  - number: '8'
    text: >-
      Dit besluit treedt in werking met ingang van de twintigste dag na de datum van uitgifte van het *Staatsblad* waarin
      het wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0004347/2000-02-16#Artikel8
  - number: '9'
    text: 'Dit besluit wordt aangehaald als: Besluit verhandeling teeltmateriaal tuinbouwgewassen.'
    url: https://wetten.overheid.nl/BWBR0004347/2000-02-16#Artikel9
