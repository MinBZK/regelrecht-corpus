  - number: '6'
    text: |-
      1 Voor de toepassing van [artikel 11, eerste lid, aanhef en onderdeel b, van de WWIK][ref1], wordt op de omzet en
      het bruto-inkomen verworven over de periode van twaalf kalendermaanden onmiddellijk voorafgaand aan de 13e, 25e of
      37e uitkeringsmaand de volgende beroepskosten in mindering gebracht:

      a. de vaste kosten, afgeleid uit de jaarrekening van het kalenderjaar onmiddellijk voorafgaande aan het
      kalenderjaar waarin de betreffende eis wordt getoetst;

      b. de variabele kosten, afgeleid uit de jaarrekening van het kalenderjaar onmiddellijk voorafgaande aan het
      kalenderjaar waarin de betreffende eis wordt getoetst, naar het percentage dat zij uitmaken van de in die
      jaarrekening opgenomen omzet.

      2 Indien de kunstenaar geen jaarrekening kan overleggen over het kalenderjaar onmiddellijk voorafgaande aan het
      kalenderjaar waarin de betreffende eis wordt getoetst, dan wel aantoont dat de toepassing van het eerste lid geen
      recht doet aan de werkelijke kosten over de van toepassing zijnde periode, bedoeld in het eerste lid, wordt de
      opgave van de kunstenaar in aanmerking genomen, voorzover deze naar het oordeel van het college aannemelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0017837#Artikel11
    url: https://wetten.overheid.nl/BWBR0017838/2009-01-01#Artikel6
