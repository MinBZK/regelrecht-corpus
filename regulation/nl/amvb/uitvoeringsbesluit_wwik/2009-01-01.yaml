        artikel: '11'
  - number: '7'
    text: |-
      1 Voor de toepassing van de [artikelen 15][ref1] en [16 van de WWIK][ref2] wordt over de omzet of bruto-inkomsten
      van de kunstenaar een bedrag van € 3.408,– als beroepskosten in aanmerking genomen.

      2 Indien bij de toepassing van het eerste lid het bruto-inkomen van de kunstenaar uitkomt op een negatief bedrag,
      wordt het inkomen op nihil gesteld.

      3 Indien in de situatie, bedoeld in het tweede lid, de kunstenaar aantoont dat de werkelijke beroepskosten de omzet
      en het bruto-inkomen overstijgen, worden in afwijking van het tweede lid, de resterende meerkosten in mindering
      gebracht op het bruto-inkomen van zijn echtgenoot.

      4 Indien de kunstenaar aantoont dat zijn werkelijke beroepskosten hoger zijn dan het in het eerste lid genoemde
      bedrag worden deze werkelijke kosten in aanmerking genomen bij de omzet of het bruto-inkomen van de kunstenaar en
      het bruto-inkomen van zijn echtgenoot.

      5 Bij de toepassing van [artikel 16, derde lid, van de WWIK][ref3], worden het bedrag, bedoeld in het eerste
      lid, en de werkelijke beroepskosten, bedoeld in het derde en vierde lid, verlaagd naar evenredigheid van de in
      aanmerking te nemen periode, bedoeld in [artikel 16, derde lid, van de WWIK][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0017837#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0017837#Artikel16
