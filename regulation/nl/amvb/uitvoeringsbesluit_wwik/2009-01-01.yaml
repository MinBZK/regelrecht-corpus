    text: |-
      Dit besluit treedt met uitzondering van de [artikelen 22][ref1] en [27][ref2] in werking met ingang van 1 januari
      2005. [Artikel 22][ref3] treedt in werking met ingang van 1 april 2005. [Artikel 27][ref4] treedt in werking op een
      bij koninklijk besluit te bepalen tijdstip.


