  - number: '8'
    text: |-
      1 De weigering, bedoeld in [artikel 22, eerste lid, van de WWIK][ref1], wordt vastgesteld op:

      a. vijf procent van de uitkering gedurende een maand bij gedragingen als bedoeld in
      [artikel 22, eerste lid, onderdeel c of e, van de WWIK][ref2];

      b. tien procent van de uitkering gedurende een maand bij gedragingen als bedoeld in
      [artikel 22, eerste lid, onderdelen a, b of d, van de WWIK][ref3].

      2 De periode van weigering van de uitkering, bedoeld in het eerste lid, wordt verdubbeld, indien de kunstenaar, of
      zijn echtgenoot, zich binnen twaalf maanden na de vorige als verwijtbaar aangemerkte gedragingen opnieuw schuldig
      maakt aan verwijtbare gedragingen als bedoeld in [artikel 22, eerste lid, van de WWIK][ref4]. Geen verdubbeling
      vindt plaats indien de eerdere weigering betrekking heeft op gedragingen als bedoeld in het eerste lid, onderdeel
      b, en de nieuwe verwijtbare gedragingen worden aangemerkt als gedragingen als bedoeld in het eerste lid, onderdeel
      a.


      [ref1]: https://wetten.overheid.nl/BWBR0017837#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0017837#Artikel22
