    text: |-
      De voorwaarden, bedoeld in de [artikelen 12][ref1] en [13][ref2], worden in elk geval verbonden aan de geldlening
      onder verband van hypotheek of verpanding, bedoeld in [artikel 13, eerste lid, van de WWIK][ref3], en opgenomen in
      de hypotheekakte of de akte tot verpanding.


      [ref1]: https://wetten.overheid.nl/BWBR0017838#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0017838#Artikel13
