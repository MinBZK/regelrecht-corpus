  - number: '2'
    text: |-
      De beoordeling of de kunstenaar gedurende de periode, bedoeld
      in [artikel 8, aanhef en onderdeel b, van de WWIK][ref1] dan wel
      [artikel 11, eerste lid, aanhef en onderdeel c, van de WWIK][ref2] als kunstenaar werkzaam is geweest, betreft
      de periode van twaalf kalendermaanden onmiddellijk voorafgaande aan de kalendermaand waarin uitkering wordt
      aangevraagd, dan wel waarin het onderzoek plaatsvindt, bedoeld in [artikel 11 van de WWIK][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0017837#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0017837#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0017837#Artikel11
    url: https://wetten.overheid.nl/BWBR0017838/2009-01-01#Artikel2
