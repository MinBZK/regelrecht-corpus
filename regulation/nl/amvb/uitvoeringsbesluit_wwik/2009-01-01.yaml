  - number: '13'
    text: |-
      1 Indien door toepassing van [artikel 12, derde of vierde lid][ref1], na afloop van de aflossingsperiode van tien
      jaar de geldlening nog niet is afgelost, is vanaf dat moment maandelijks rente verschuldigd over het nog niet
      afgeloste deel van de geldlening.

      2 De rente, bedoeld in het eerste lid, is de wettelijke rente, verminderd met drie procent.

      3 Indien de kunstenaar naar het oordeel van het college de rente geheel of gedeeltelijk kan betalen, doch niet
      kan aflossen, wordt een betaling eerst tot ten hoogste het bedrag van de verschuldigde maandrente aangemerkt als
      aflossing en wordt de rente die daardoor niet wordt betaald bijgeschreven bij het nog niet afgeloste deel van de
      geldlening.

      4 Indien de kunstenaar naar het oordeel van het college geen rente kan betalen wordt de verschuldigde rente
      bijgeschreven bij het nog niet afgeloste deel van de geldlening.

      5 Over een bijgeschreven rentevordering is geen rente verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0017838#Artikel12
    url: https://wetten.overheid.nl/BWBR0017838/2009-01-01#Artikel13
