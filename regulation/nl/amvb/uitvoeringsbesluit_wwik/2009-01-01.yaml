  - number: '27'
    text: |-
      1 De kunstenaar die in of voor het jaar 2004 een uitkering heeft ontvangen op grond van de [WIK][ref1], heeft in
      het jaar 2005 recht op uitkering op grond van de [WWIK][ref2], indien hij in het jaar 2004 een omzet of bruto-
      inkomen uit kunst van € 1.089,– heeft verworven.

      2 Voor de kunstenaar aan wie op grond van het eerste lid uitkering is verleend en de kunstenaar die voorafgaand
      aan de inwerkingtreding van de [WWIK][ref3] uitkering op grond van de [WIK][ref4] is verleend, geldt dat de
      beoordeling van het recht op uitkering in het daaropvolgende jaar plaatsvindt overeenkomstig het bepaalde in
      [artikel 11, eerste lid, van de WWIK][ref5], zijnde niet meer dan in [voornoemd artikel][ref6] genoemd bedrag van
      € 2.800,–.

      3 Voor de kunstenaar die na de beoordeling van het bruto-inkomen, bedoeld in het eerste en tweede lid,
      recht op uitkering heeft, geldt voor de volgende beoordelingsperiode van twaalf kalendermaanden, bedoeld in
      [artikel 11, eerste lid, aanhef en onderdeel b, van de WWIK][ref7] de naast hogere inkomenseis, bedoeld in
      [voornoemd artikel][ref8].

      4 Voor de kunstenaar, bedoeld in het eerste lid, geldt dat het in het eerste lid genoemde bedrag naar evenredigheid
      wordt verlaagd indien de kunstenaar gedurende een gedeelte van het kalenderjaar, doch ten minste gedurende een
      aaneengesloten periode van vier weken, wegens ziekte of deelname aan beroepskwalificerende scholingsactiviteiten
      geen werkzaamheden als kunstenaar heeft verricht.

      5 Voor het vaststellen van de periode van ziekte, bedoeld in het vierde lid, worden perioden van ziekte
      samengeteld, indien zij elkaar met een onderbreking van minder dan vier weken opvolgen.

      6 In afwijking van het eerste lid wordt voor de kunstenaar, bedoeld in
      [artikel 8, aanhef en onderdeel c, van de WWIK][ref9], het bedrag bedoeld in het eerste lid op nihil gesteld,
      indien het jaar 2004 het eerste kalenderjaar is waarin uitkering werd verleend op grond van de [WIK][ref10].


