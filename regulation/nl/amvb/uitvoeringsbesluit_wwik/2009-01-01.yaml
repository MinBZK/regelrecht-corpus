        artikel: '11'
  - number: '3'
    text: |-
      1 Voor kunstenaars aan wie nog niet eerder uitkering op grond van de [WIK][ref1] of de [WWIK][ref2] is verleend,
      bedraagt het bruto-inkomen, bedoeld in [artikel 8, aanhef en onderdeel b, van de WWIK][ref3], na vermindering met
      de in aanmerking te nemen beroepskosten, bedoeld in [artikel 17 van de WWIK][ref4], € 1.200,–.

      2 Voor de toepassing van het eerste lid wordt onder de in aanmerking te nemen beroepskosten, bedoeld in
      [artikel 17 van de WWIK][ref5], verstaan de directe kosten die uitsluitend kunnen worden toegerekend aan het met
      werkzaamheden als kunstenaar verworven inkomen in de periode van twaalf kalendermaanden onmiddellijk voorafgaande
      aan de kalendermaand waarin uitkering wordt aangevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0009344
      [ref2]: https://wetten.overheid.nl/BWBR0017837
      [ref3]: https://wetten.overheid.nl/BWBR0017837#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0017837#Artikel17
      [ref5]: https://wetten.overheid.nl/BWBR0017837#Artikel17
