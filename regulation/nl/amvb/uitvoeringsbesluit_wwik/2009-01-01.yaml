        artikel: '13'
  - number: '12'
    text: |-
      1 De aflossing van de geldlening onder verband van hypotheek of verpanding vangt aan na de periode van tien jaar,
      bedoeld in [artikel 19, tweede lid, van de WWIK][ref1], of zoveel eerder als de termijn van vier jaar, bedoeld in
      [artikel 19, eerste lid, van de WWIK][ref2], is verstreken.

      2 De aflossing van de geldlening onder verband van hypotheek of verpanding vindt maandelijks plaats gedurende ten
      hoogste tien jaar.

      3 Het college stelt het maandbedrag van de aflossing vast aan de hand van het inkomen, bedoeld in
      [paragraaf 3.4 van de Wet werk en bijstand][ref3], en de noodzakelijke, voor rekening van de kunstenaar en zijn
      gezin komende, bijzondere bestaanskosten. Indien de omstandigheden daartoe aanleiding geven, wijzigt het college
      het maandbedrag van de aflossing.

      4 Bij een inkomen van de kunstenaar en zijn gezin als bedoeld in het derde lid dat niet uitgaat boven de van
      toepassing zijnde bijstandsnorm, bedoeld in de [paragrafen 3.2][ref4] en[ 3.3 van de Wet werk en bijstand][ref5],
      wordt geen aflossing gevergd.

      5 Indien de kunstenaar en zijn gezin tijdens de aflossingsperiode van tien jaar schuldig nalatig zijn in het
      voldoen van de vastgestelde aflossing, is het nog niet afgeloste deel van de geldlening terstond opeisbaar en is
      daarover tevens de wettelijke rente verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0017837#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0017837#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0015703#Paragraaf3.4
      [ref4]: https://wetten.overheid.nl/BWBR0015703#Paragraaf3.2
      [ref5]: https://wetten.overheid.nl/BWBR0015703#Paragraaf3.3
    url: https://wetten.overheid.nl/BWBR0017838/2009-01-01#Artikel12
