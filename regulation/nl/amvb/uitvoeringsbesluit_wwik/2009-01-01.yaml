        artikel: '17'
  - number: '4'
    text: |-
      1 De in [artikel 11, eerste lid, aanhef en onderdeel b, van de WWIK][ref1] genoemde bedragen worden naar
      evenredigheid verlaagd, indien de kunstenaar geen werkzaamheden als kunstenaar heeft verricht gedurende een
      gedeelte van de periode van twaalf kalendermaanden onmiddellijk voorafgaand aan respectievelijk de dertiende,
      vijfentwintigste of zevenendertigste uitkeringsmaand wegens ziekte of deelname aan door de adviserende instelling
      of het college aangeboden beroepskwalificerende scholing van tenminste een aaneengesloten periode van vier weken.

      2 Voor het vaststellen van de periode van ziekte, bedoeld in het eerste lid, worden perioden van ziekte
      samengeteld, indien zij elkaar met een onderbreking van minder dan vier weken opvolgen.

      3 Het college kan de kunstenaar die, als gevolg van op de ontwikkeling van de beroepspraktijk gerichte
      activiteiten die het verwerven van inkomen hebben belemmerd, niet kan voldoen aan de eis, bedoeld in
      [artikel 11, eerste lid, aanhef en onderdeel b, van de WWIK][ref2], gedurende de totale looptijd van de
      [WWIK][ref3] eenmalig op zijn verzoek ontheffing van die eis verlenen. De kunstenaar doet hiertoe zo spoedig
      mogelijk een met redenen omkleed verzoek aan het college.

      4 De ontheffing, bedoeld in het derde lid, wordt niet verleend, indien het niet hebben voldaan aan de van
      toepassing zijnde eis, bedoeld in [artikel 11, aanhef en eerste lid, onderdeel b, van de WWIK][ref4], het gevolg is
      van het naar het oordeel van het college onverantwoord handelen of nalaten van de kunstenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0017837#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0017837#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0017837
      [ref4]: https://wetten.overheid.nl/BWBR0017837#Artikel11
