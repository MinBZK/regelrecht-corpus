  - number: '9'
    text: |-
      1 Indien de kunstenaar beschikt over een in eigendom bewoonde woning met bijbehorend erf die tevens voor de
      uitoefening van het beroep wordt gebruikt, wordt voor de toepassing van [artikel 7, vijfde lid, van de WWIK][ref1],
      de vermogenswaarde vastgesteld op een bedrag gelijk aan 20% van de waarde in het economisch verkeer van de woning
      met het bijbehorend erf verminderd met de daarop drukkende schulden. Op de vaststelling van de waarde van de woning
      met bijbehorend erf is [artikel 10][ref2] van toepassing.

      2 Indien de kunstenaar beschikt over bezittingen anders dan de in eigendom bewoonde woning met bijbehorend erf, die
      tevens voor de uitoefening van het beroep worden gebruikt, wordt 50% van de waarde in het economisch verkeer van
      de bezittingen verminderd met de daarop drukkende schulden aangemerkt als vermogen noodzakelijk voor de uitoefening
      van het beroep van kunstenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0017837#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0017838#Artikel10
