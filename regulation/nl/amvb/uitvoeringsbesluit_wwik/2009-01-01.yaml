  - number: '10'
    text: |-
      1 Voor de toekenning van de waarde van de woning met bijbehorend erf, bedoeld in
      [artikel 13, vijfde lid, van de WWIK][ref1], wordt uitgegaan van de waarde die is toegekend op grond van de
      [Wet waardering onroerende zaken][ref2].

      2 In afwijking van het eerste lid kan de waarde van de woning met bijbehorend erf, bedoeld in
      [artikel 13, vijfde lid, van de WWIK][ref3], worden vastgesteld door een taxateur die door het college in
      overeenstemming met de kunstenaar wordt aangewezen.


