  - number: '5'
    text: |-
      De kunstenaar wiens uitkering op grond van [artikel 11, eerste lid, aanhef en onderdeel b, van de WWIK][ref1]
      is beëindigd en die uitkering aanvraagt, heeft na afloop van de periode, bedoel in
      [artikel 10, vijfde lid, van de WWIK][ref2], recht op uitkering als wordt voldaan aan de van toepassing zijnde
      eis, bedoeld in [artikel 11, eerste lid, aanhef en onderdeel b, van de WWIK][ref3] over de twaalf kalendermaanden
      onmiddellijk voorafgaande aan de kalendermaand waarin uitkering wordt aangevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0017837#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0017837#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0017837#Artikel11
