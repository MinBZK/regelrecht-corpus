    text: |-
      In dit besluit wordt verstaan onder:

      a. WIK: [Wet inkomensvoorziening kunstenaars][ref1], zoals deze luidde op 31 december 2004;

      b. WWIK: [Wet werk en inkomen kunstenaars][ref2];

      c. uitkering: uitkering op grond van de [WWIK][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0009344
      [ref2]: https://wetten.overheid.nl/BWBR0017837
      [ref3]: https://wetten.overheid.nl/BWBR0017837
