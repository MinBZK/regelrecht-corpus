  - number: '15'
    text: |-
      Aan de kunstenaar of langstlevende echtgenoot, bedoeld in [artikel 14, eerste lid][ref1], wordt, telkens na afloop
      van een kalenderjaar, een opgave verstrekt van de stand van de geldlening en van de rentevorderingen.


      [ref1]: https://wetten.overheid.nl/BWBR0017838#Artikel14
