---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: uitvoeringsbesluit_wik
regulatory_layer: AMVB
publication_date: '2004-12-29'
valid_from: '2004-01-01'
bwb_id: BWBR0009674
url: https://wetten.overheid.nl/BWBR0009674/2004-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Sociale Zaken en Werkgelegenheid van 10 december 1997, nr. 97.005930;

    Gelet op de artikelen 4, onder b,6, eerste lid, onder b, 9, vierde lid, 16, vierde lid, 17, zesde lid, en 19,
    vijfde lid, van de Wet inkomensvoorziening kunstenaars;

    De Raad van State gehoord (advies van 24 december 1997, nr. W12.97.0776);

    Gezien het nader rapport van Onze Minister van Sociale Zaken en Werkgelegenheid van 2 juni, Directie
    Bijstandszaken, nr. BZ/VOL/98/11.576;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0009674/2004-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0009674/2004-01-01#Artikel1
  - number: 1.a
    text: |-
      WIK: [Wet inkomensvoorziening kunstenaars][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009344
    url: https://wetten.overheid.nl/BWBR0009674/2004-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009344
  - number: 1.b
    text: |-
      uitkering: de uitkering op grond van de [WIK][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009344
    url: https://wetten.overheid.nl/BWBR0009674/2004-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009344
  - number: 1.c
    text: |-
      inlichtingenverplichting: de verplichting, bedoeld in [artikel 15, tweede lid, onderdeel c, van de WIK][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009344#Artikel15
    url: https://wetten.overheid.nl/BWBR0009674/2004-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009344
        artikel: '15'
  - number: 1.d
    text: |-
      fraudebedrag: het brutobedrag dat ten onrechte als uitkering is verleend als gevolg van het niet of niet behoorlijk
      nakomen van de inlichtingenverplichting.
    url: https://wetten.overheid.nl/BWBR0009674/2004-01-01#Artikel1
  - number: '2.1'
    text: |-
      Het bruto-inkomen of de bruto-omzet, bedoeld in de [artikelen 4, onderdeel b][ref1], en
      [6, eerste lid, onderdeel b, van de WIK][ref2], bedraagt € 1 089, dat door de kunstenaar:


      [ref1]: https://wetten.overheid.nl/BWBR0009344#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0009344#Artikel6
    url: https://wetten.overheid.nl/BWBR0009674/2004-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0009344
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0009344
        artikel: '6'
  - number: 2.1.a
    text: |-
      die uitkering aanvraagt, moet zijn verworven in het kalenderjaar voorafgaande aan het jaar waarin de uitkering
      wordt aangevraagd;
    url: https://wetten.overheid.nl/BWBR0009674/2004-01-01#Artikel2
  - number: 2.1.b
    text: |-
      aan wie uitkering is verleend, telkens moet zijn verworven in het kalenderjaar voorafgaande aan het jaar waarin de
      uitkering wordt ontvangen.
    url: https://wetten.overheid.nl/BWBR0009674/2004-01-01#Artikel2
  - number: '2.2'
    text: |-
      Het in het eerste lid genoemde bedrag wordt naar evenredigheid verlaagd indien de kunstenaar gedurende een gedeelte
      van het kalenderjaar, doch ten minste gedurende een aaneengesloten periode van 28 dagen, wegens ziekte of deelname
      aan beroepskwalificerende scholingsactiviteiten geen werkzaamheden als kunstenaar heeft verricht.
    url: https://wetten.overheid.nl/BWBR0009674/2004-01-01#Artikel2
  - number: '2.3'
    text: |-
      Voor het vaststellen van de periode van ziekte, bedoeld in het tweede lid, worden perioden van ziekte samengeteld,
      indien zij elkaar met een onderbreking van minder dan vier weken opvolgen.
    url: https://wetten.overheid.nl/BWBR0009674/2004-01-01#Artikel2
  - number: '2.4'
    text: |-
      In afwijking van het eerste lid, onderdeel b, wordt voor de kunstenaar, bedoeld in
      [artikel 4, onderdeel c, van de WIK][ref1], het bedrag, bedoeld in het eerste lid, in het eerste kalenderjaar
      waarin uitkering is verleend op nihil gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0009344#Artikel4
    url: https://wetten.overheid.nl/BWBR0009674/2004-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0009344
        artikel: '4'
  - number: '3.1'
    text: |-
      De als beroepskosten in aanmerking te nemen normbedragen, bedoeld in [artikel 10a van de WIK][ref1], worden gesteld
      op:


      [ref1]: https://wetten.overheid.nl/BWBR0009344#Artikel10a
    url: https://wetten.overheid.nl/BWBR0009674/2004-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0009344
        artikel: 10a
  - number: 3.1.a
    text: € 4 538 per jaar voor een scheppend kunstenaar;
    url: https://wetten.overheid.nl/BWBR0009674/2004-01-01#Artikel3
  - number: 3.1.b
    text: € 2 269 per jaar voor een andere dan een scheppend kunstenaar.
    url: https://wetten.overheid.nl/BWBR0009674/2004-01-01#Artikel3
  - number: '3.2'
    text: |-
      De in het eerste lid genoemde berdragen worden naar evenredigheid verlaagd indien de kunstenaar slechts gedurende
      een gedeelte van een kalenderjaar recht op uitkering heeft.
    url: https://wetten.overheid.nl/BWBR0009674/2004-01-01#Artikel3
  - number: '4'
    text: |-
      Burgemeester en wethouders nemen bij de toepassing van [artikel 16, eerste lid, van de WIK][ref1] de bepalingen van
      dit besluit in acht, onverminderd [artikel 16, tweede en derde lid, van de WIK][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009344#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0009344#Artikel16
    url: https://wetten.overheid.nl/BWBR0009674/2004-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0009344
        artikel: '16'
      - id: ref2
        bwb_id: BWBR0009344
        artikel: '16'
  - number: '5'
    text: |-
      De gedragingen, bedoeld in de [artikelen 15][ref1] en [16 van de WIK][ref2], worden onderscheiden in de volgende
      categorieën:


      [ref1]: https://wetten.overheid.nl/BWBR0009344#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0009344#Artikel16
    url: https://wetten.overheid.nl/BWBR0009674/2004-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0009344
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0009344
        artikel: '16'
  - number: '5.1'
    text: 'eerste categorie:'
    url: https://wetten.overheid.nl/BWBR0009674/2004-01-01#Artikel5
  - number: 5.1.a
    text: |-
      het zich niet als kunstenaar doen inschrijven bij de Centrale organisatie werk en inkomen, genoemd in
      [hoofdstuk 4 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1], dan wel de inschrijving niet of
      niet tijdig doen verlengen;


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0009674/2004-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0013060
        hoofdstuk: '4'
  - number: 5.1.b
    text: |-
      het niet binnen de door burgemeester en wethouders daartoe gestelde termijn aan de inlichtingenverplichting
      voldoen;
    url: https://wetten.overheid.nl/BWBR0009674/2004-01-01#Artikel5
  - number: '5.2'
    text: 'tweede categorie:'
    url: https://wetten.overheid.nl/BWBR0009674/2004-01-01#Artikel5
  - number: 5.2.a
    text: |-
      het niet voldoen aan een verplichting die door burgemeester en wethouders met toepassing van
      [artikel 15, eerste lid, van de WIK][ref1] aan de uitkering verbonden is;


      [ref1]: https://wetten.overheid.nl/BWBR0009344#Artikel15
    url: https://wetten.overheid.nl/BWBR0009674/2004-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0009344
        artikel: '15'
  - number: 5.2.b
    text: het zich niet naar vermogen inspannen om met werkzaamheden als kunstenaar zelfstandig in het bestaan te voorzien.
    url: https://wetten.overheid.nl/BWBR0009674/2004-01-01#Artikel5
  - number: '6.1'
    text: |-
      De weigering, bedoeld in [artikel 16, eerste lid, van de WIK][ref1], wordt vastgesteld op:


      [ref1]: https://wetten.overheid.nl/BWBR0009344#Artikel16
    url: https://wetten.overheid.nl/BWBR0009674/2004-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0009344
        artikel: '16'
  - number: 6.1.a
    text: vijf procent van de uitkering gedurende een maand bij gedragingen van de eerste categorie;
    url: https://wetten.overheid.nl/BWBR0009674/2004-01-01#Artikel6
  - number: 6.1.b
    text: tien procent van de uitkering gedurende een maand bij gedragingen van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0009674/2004-01-01#Artikel6
  - number: '6.2'
    text: |-
      De periode van weigering van de uitkering, genoemd in het eerste lid, wordt verdubbeld, indien de belanghebbende
      zich binnen twaalf maanden na de vorige als verwijtbaar aangemerkte gedraging opnieuw schuldig maakt aan een
      verwijtbare gedraging uit dezelfde of een hogere categorie.
    url: https://wetten.overheid.nl/BWBR0009674/2004-01-01#Artikel6
  - number: 10a.1
    text: |-
      Indien de kunstenaar beschikt over een in eigendom bewoonde woning met bijbehorend erf die tevens voor de
      uitoefening van het beroep wordt gebruikt, wordt voor de toepassing van [artikel 2, tweede lid, van de WIK][ref1],
      de vermogenswaarde vastgesteld op een bedrag gelijk aan 20% van de waarde in het economisch verkeer van de woning
      of het bijbehorend erf verminderd met de daarop drukkende schulden. Op de vaststelling van de waarde van de woning
      met bijbehorend erf is [artikel 10b][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009344#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0009674#Artikel10b
    url: https://wetten.overheid.nl/BWBR0009674/2004-01-01#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0009344
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0009674
        artikel: 10b
        paragraaf: 4b
  - number: 10a.2
    text: |-
      Indien de kunstenaar beschikt over bezittingen anders dan de in eigendom bewoonde woning met bijbehorend
      erf, die tevens voor de uitoefening van het beroep worden gebruikt, wordt voor de toepassing van
      [artikel 2, tweede lid van de WIK][ref1], de vermogenswaarde vastgesteld op een bedrag gelijk aan 50% van de waarde
      in het economisch verkeer van de bezittingen verminderd met de daarop drukkende schulden.


      [ref1]: https://wetten.overheid.nl/BWBR0009344#Artikel2
    url: https://wetten.overheid.nl/BWBR0009674/2004-01-01#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0009344
        artikel: '2'
  - number: 10b
    text: |-
      De vaststelling van de waarde van de woning met bijbehorend erf als bedoeld in
      [artikel 8, vijfde lid, van de WIK][ref1], vindt plaats door een taxateur die door burgemeester en wethouders in
      overeenstemming met de kunstenaar wordt aangewezen of door een gemeentelijk taxateur.


      [ref1]: https://wetten.overheid.nl/BWBR0009344#Artikel8
    url: https://wetten.overheid.nl/BWBR0009674/2004-01-01#Artikel10b
    references:
      - id: ref1
        bwb_id: BWBR0009344
        artikel: '8'
  - number: 10c.1
    text: |-
      Aan de geldlening onder verband van hypotheek, bedoeld in [artikel 8, tweede lid, van de WIK][ref1], worden in elk
      geval de voorwaarden, genoemd in de [artikelen 10d][ref2] en [10e][ref3], verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0009344#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0009674#Artikel10d
      [ref3]: https://wetten.overheid.nl/BWBR0009674#Artikel10e
    url: https://wetten.overheid.nl/BWBR0009674/2004-01-01#Artikel10c
    references:
      - id: ref1
        bwb_id: BWBR0009344
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0009674
        artikel: 10d
        paragraaf: 4b
      - id: ref3
        bwb_id: BWBR0009674
        artikel: 10e
        paragraaf: 4b
  - number: 10c.2
    text: |-
      De in het eerste lid bedoelde voorwaarden worden tezamen met de gebruikelijke bedingen opgenomen in de
      hypotheekakte.
    url: https://wetten.overheid.nl/BWBR0009674/2004-01-01#Artikel10c
  - number: 10d.1
    text: |-
      De aflossing van de geldlening onder verband van hypotheek vangt aan na de periode van tien jaar, bedoeld
      in [artikel 13, tweede lid, van de WIK][ref1], of zoveel eerder als de termijn van vier jaar, bedoeld in
      [artikel 13, eerste lid, van de WIK][ref2] is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0009344#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0009344#Artikel13
    url: https://wetten.overheid.nl/BWBR0009674/2004-01-01#Artikel10d
    references:
      - id: ref1
        bwb_id: BWBR0009344
        artikel: '13'
      - id: ref2
        bwb_id: BWBR0009344
        artikel: '13'
  - number: 10d.2
    text: |-
      De aflossing van de geldlening onder verband van hypotheek vindt maandelijks plaats gedurende ten hoogste tien
      jaar.
    url: https://wetten.overheid.nl/BWBR0009674/2004-01-01#Artikel10d
  - number: 10d.3
    text: Het maandbedrag van de aflossing wordt telkens voor een periode van een jaar vastgesteld.
    url: https://wetten.overheid.nl/BWBR0009674/2004-01-01#Artikel10d
  - number: 10d.4
    text: |-
      Bij een inkomen van de belanghebbende en zijn gezin als bedoeld in [artikel 31 van de Wet werk en bijstand][ref1]
      dat niet uitgaat boven de van toepassing zijnde bijstandsnorm, bedoeld in de [paragrafen 3.1][ref2], [3.2][ref3] en
      [3.3][ref4] van genoemde wet, wordt geen aflossing gevergd.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Paragraaf3.1
      [ref3]: https://wetten.overheid.nl/BWBR0015703#Paragraaf3.2
      [ref4]: https://wetten.overheid.nl/BWBR0015703#Paragraaf3.3
    url: https://wetten.overheid.nl/BWBR0009674/2004-01-01#Artikel10d
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '31'
      - id: ref2
        bwb_id: BWBR0015703
        paragraaf: '3.1'
      - id: ref3
        bwb_id: BWBR0015703
        paragraaf: '3.2'
      - id: ref4
        bwb_id: BWBR0015703
        paragraaf: '3.3'
  - number: 10d.5
    text: |-
      Indien de omstandigheden daartoe aanleiding geven stellen burgemeester en wethouders, zo nodig tussentijds, het
      maandbedrag van de aflossing op een lager dan wel hoger bedrag vast.
    url: https://wetten.overheid.nl/BWBR0009674/2004-01-01#Artikel10d
  - number: 10d.6
    text: |-
      Bij de beoordeling van de omstandigheden als bedoeld in het vijfde lid wordt rekening gehouden met noodzakelijke,
      voor eigen rekening van de belanghebbende en zijn gezin komende, bijzondere bestaanskosten. Deze worden in
      mindering gebracht op het inkomen van de belanghebbende.
    url: https://wetten.overheid.nl/BWBR0009674/2004-01-01#Artikel10d
  - number: 10d.7
    text: |-
      Indien de belanghebbende en zijn gezin tijdens de aflossingsperiode van tien jaar schuldig nalatig is in het
      voldoen van de vastgestelde aflossing, is het nog niet afgeloste deel van de geldlening terstond opeisbaar en is
      daarover tevens de wettelijke rente verschuldigd.
    url: https://wetten.overheid.nl/BWBR0009674/2004-01-01#Artikel10d
  - number: 10e.1
    text: |-
      Indien door toepassing van [artikel 10d, derde tot en met vijfde lid][ref1], na afloop van de aflossingsperiode van
      tien jaar een deel van de geldlening nog niet is afgelost, is vanaf dat moment maandelijks rente verschuldigd over
      het nog niet afgeloste deel van de geldlening.


      [ref1]: https://wetten.overheid.nl/BWBR0009674#Artikel10d
    url: https://wetten.overheid.nl/BWBR0009674/2004-01-01#Artikel10e
    references:
      - id: ref1
        bwb_id: BWBR0009674
        artikel: 10d
        paragraaf: 4b
  - number: 10e.2
    text: De rente, bedoeld in het eerste lid, is de wettelijke rente, verminderd met drie procent.
    url: https://wetten.overheid.nl/BWBR0009674/2004-01-01#Artikel10e
  - number: 10e.3
    text: |-
      Indien de belanghebbende naar het oordeel van burgemeester en wethouders de rente geheel of gedeeltelijk kan
      betalen, doch niet kan aflossen, wordt een betaling eerst tot ten hoogste het bedrag van de verschuldigde
      maandrente aangemerkt als aflossing en wordt de rente die daardoor niet wordt betaald bijgeschreven bij het nog
      niet afgeloste deel van de geldlening.
    url: https://wetten.overheid.nl/BWBR0009674/2004-01-01#Artikel10e
  - number: 10e.4
    text: |-
      Indien de belanghebbende naar het oordeel van burgemeester en wethouders geen rente kan betalen wordt de
      verschuldigde rente bijgeschreven bij het nog niet afgeloste deel van de geldlening.
    url: https://wetten.overheid.nl/BWBR0009674/2004-01-01#Artikel10e
  - number: 10e.5
    text: Over een bijgeschreven rentevordering is geen rente verschuldigd.
    url: https://wetten.overheid.nl/BWBR0009674/2004-01-01#Artikel10e
  - number: 10f.1
    text: |-
      Bij verkoop of bij vererving van de woning, en indien het een echtpaar betreft bij vererving na overlijden
      van de langstlevende echtgenoot, wordt het nog niet afgeloste deel van de geldlening, alsmede de op grond van
      [artikel 10e, vierde lid][ref1], bijgeschreven rente, terstond afgelost.


      [ref1]: https://wetten.overheid.nl/BWBR0009674#Artikel10e
    url: https://wetten.overheid.nl/BWBR0009674/2004-01-01#Artikel10f
    references:
      - id: ref1
        bwb_id: BWBR0009674
        artikel: 10e
        paragraaf: 4b
  - number: 10f.2
    text: |-
      Bij verkoop van de woning kunnen burgemeester en wethouders wegens bijzondere omstandigheden van medische of
      sociale aarde van de belanghebbende dan wel wegens werkaanvaarding elders als belanghebbende, na toepassing van
      het eerste lid, besluiten tot het verlenen van een nieuwe geldlening eveneens onder verband van hypotheek voor de
      aankoop van een andere woning, tot ten hoogste het bedrag van de ingevolge het eerste lid afgeloste geldlening,
      onder de voorwaarde dat belanghebbende het na aflossing vrijgekomen vermogen met inbegrip van het in het derde lid
      bedoelde bedrag volledig inzet voor de aankoop van de andere woning.
    url: https://wetten.overheid.nl/BWBR0009674/2004-01-01#Artikel10f
  - number: 10f.3
    text: |-
      Bij verkoop van de woning tegen een prijs overeenkomstig de waarde in het economisch verkeer bij vrije oplevering
      komt, voorzover de opbrengst daartoe toereikend is, aan de belanghebbende in ieder geval het bedrag toe dat op
      grond van [artikel 2a, eerste lid, onder b, van de WIK][ref1], bij de vaststelling van de geldlening op de waarde
      van de woning in mindering is gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0009344#Artikel2a
    url: https://wetten.overheid.nl/BWBR0009674/2004-01-01#Artikel10f
    references:
      - id: ref1
        bwb_id: BWBR0009344
        artikel: 2a
  - number: 10f.4
    text: |-
      Indien bij de verkoop van de woning op basis van de waarde in het economisch verkeer bij vrije oplevering het voor
      de afrekening beschikbare bedrag lager is dan het resterende bedrag van de geldlening en van de rentevordering,
      wordt het verschil kwijtgescholden.
    url: https://wetten.overheid.nl/BWBR0009674/2004-01-01#Artikel10f
  - number: 10g
    text: |-
      Aan de belanghebbende wordt telkens na afloop van een kalenderjaar een opgave verstrekt van de stand van de
      geldlening en van de rentevorderingen.
    url: https://wetten.overheid.nl/BWBR0009674/2004-01-01#Artikel10g
  - number: 10h
    text: |-
      Het bedrag, bedoeld in [artikel 8, vierde lid][ref1], is gelijk aan twaalf maal het bedrag voor gehuwden, bedoeld
      in [artikel 9, eerste lid, onder c, van de WIK][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009344#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0009344#Artikel9
    url: https://wetten.overheid.nl/BWBR0009674/2004-01-01#Artikel10h
    references:
      - id: ref1
        bwb_id: BWBR0009344
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0009344
        artikel: '9'
  - number: '11'
    text: |-
