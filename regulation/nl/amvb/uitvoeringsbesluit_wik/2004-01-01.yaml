  - number: 11a.1
    text: |-
      De verplichtingen van burgemeester en wethouders, die samenhangen met de uitvoering van de [WIK][ref1], gaan
      voor zover die betrekking hebben op activiteiten, waarmee voor de inwerkingtreding van het Besluit van 3 december
      2003 (Stb. 509) tot wijziging van het Uitvoeringsbesluit WIK in verband met het terugbrengen van het aantal
      centrumgemeenten alsmede technische wijziging van een aantal andere besluiten in verband met de inwerkingtreding
      van de Wet werk en bijstand een aanvang is gemaakt en die na die datum worden voortgezet, over naar burgemeester en
      wethouders van de gemeente met toepassing van voornoemd besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0009344
    url: https://wetten.overheid.nl/BWBR0009674/2004-01-01#Artikel11a
    references:
      - id: ref1
        bwb_id: BWBR0009344
  - number: 11a.2
    text: |-
      Aanvragen en de daaruit voortvloeiende verplichtingen die op de dag van inwerkingtreding van het in het eerste lid
      bedoelde besluit aanhangig zijn bij een gemeente die met toepassing van voornoemd besluit niet meer als gemeente
      is aangewezen die verantwoordelijk is voor de uitvoering van de [WIK][ref1] worden in afwijking van het eerste lid
      afgehandeld door de gemeente die voor inwerkingtreding van genoemd besluit verantwoordelijk was voor de uitvoering
      van de [WIK][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009344
      [ref2]: https://wetten.overheid.nl/BWBR0009344
    url: https://wetten.overheid.nl/BWBR0009674/2004-01-01#Artikel11a
    references:
      - id: ref1
        bwb_id: BWBR0009344
      - id: ref2
        bwb_id: BWBR0009344
  - number: 11a.3
    text: |-
      Aanvragen en de daaruit voortvloeiende verplichtingen, bedoeld in het tweede lid, die na een periode van 13
      weken na inwerkingtreding van het in het eerste lid bedoelde besluit nog aanhangig zijn bij een gemeente die voor
      inwerkingtreding van voornoemd besluit verantwoordelijk was voor de uitvoering van de [WIK][ref1] gaan in de stand
      waarin zij zich dan bevinden over op de gemeente die na inwerkingtreding van genoemd besluit verantwoordelijk is
      voor de uitvoering van de [WIK][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009344
      [ref2]: https://wetten.overheid.nl/BWBR0009344
    url: https://wetten.overheid.nl/BWBR0009674/2004-01-01#Artikel11a
    references:
      - id: ref1
        bwb_id: BWBR0009344
      - id: ref2
        bwb_id: BWBR0009344
  - number: 11a.4
    text: |-
      Het tweede en derde lid zijn van overeenkomstige toepassing op bij burgemeester en wethouders aanhangige
      bezwaarschriften.
    url: https://wetten.overheid.nl/BWBR0009674/2004-01-01#Artikel11a
  - number: '12'
    text: Dit besluit treedt in werking met ingang van een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0009674/2004-01-01#Artikel12
  - number: '13'
    text: 'Dit besluit wordt aangehaald als: Uitvoeringsbesluit WIK.'
    url: https://wetten.overheid.nl/BWBR0009674/2004-01-01#Artikel13
