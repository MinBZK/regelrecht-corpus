      Gedurende twaalf maanden na het tijdstip van inwerkingtreding van dit besluit kan de opslag van stoffen zonder een
      opslagplan als bedoeld in [artikel 26][ref1] worden voortgezet.


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel26
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel172
    references:
