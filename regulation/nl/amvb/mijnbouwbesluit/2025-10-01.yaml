        artikel: '115'
        hoofdstuk: '7'
        paragraaf: '7.2'
  - number: '119.2'
    text: |-
      De [artikelen 109][ref1], [110][ref2] en [115 tot en met 118][ref3] zijn van overeenkomstige toepassing in geval
      van het gebruik van boorgaten als bedoeld in [artikel 49, eerste lid, onderdeel e, van de wet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel109
      [ref2]: https://wetten.overheid.nl/BWBR0014394#Artikel110
      [ref3]: https://wetten.overheid.nl/BWBR0014394#Artikel115
      [ref4]: https://wetten.overheid.nl/BWBR0014168#Artikel49
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel119
