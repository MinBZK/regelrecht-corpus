  - number: '104.1'
    text: |-
      Onze Minister kan de beheerder aanwijzingen geven met betrekking tot de staat waarin de pijpleiding wordt
      achtergelaten.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel104
  - number: '104.2'
    text: |-
      Onze Minister kan de beheerder verplichten de ligging van de achtergelaten pijpleiding periodiek te controleren en
      kan zo nodig herstelmaatregelen voorschrijven.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel104
  - number: '105.1'
    text: Een kabel bezit zodanige eigenschappen en wordt zodanig aangelegd dat er geen schade wordt veroorzaakt.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel105
  - number: '105.2'
    text: De ligging van een kabel is zodanig dat er geen schade wordt veroorzaakt.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel105
  - number: '105.3'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld omtrent de eigenschappen, de aanleg en de ligging van een
      kabel.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel105
  - number: '106'
    text: |-
      De [artikelen 94 tot en met 104][ref1] zijn van overeenkomstige toepassing op een kabel, met dien verstande
      dat waar in de genoemde artikelen wordt verwezen naar [artikel 93][ref2] in plaats daarvan gelezen wordt:
      [artikel 105][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel94
      [ref2]: https://wetten.overheid.nl/BWBR0014394#Artikel93
      [ref3]: https://wetten.overheid.nl/BWBR0014394#Artikel105
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel106
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: '94'
        hoofdstuk: '6'
        paragraaf: '6.2'
      - id: ref2
