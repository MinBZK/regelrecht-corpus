        bwb_id: BWBR0002747
        artikel: 35b
  - number: 84b.3
    text: |-
      De exploitant van een productie-installatie voldoet aan de maatregelen die zijn vastgesteld in het rapport inzake
      grote gevaren voor de betreffende installatie.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel84b
  - number: 84b.4
    text: Het rapport inzake grote gevaren is aanwezig op het mijnbouwwerk.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel84b
  - number: 84b.5
    text: Bij ministeriële regeling worden regels gesteld over de overige informatie, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel84b
  - number: 84c.1
    text: |-
      Een rapport inzake grote gevaren voor een niet-productie-installatie bevat naast de documenten bedoeld in [artikel
      45g van de wet](onbekend), de volgende gegevens:
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel84c
  - number: 84c.1.a
    text: |-
      een veiligheids- en gezondheidsdocument, bedoeld in [artikel 2.42][ref1] en
      [2.42f van het Arbeidsomstandighedenbesluit][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel2
