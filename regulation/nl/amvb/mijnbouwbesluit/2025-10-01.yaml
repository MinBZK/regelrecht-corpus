  - number: '165.2'
    text: |-
      Indien een uitvoerder voor de afloop van de in het eerste lid bedoelde termijn een aanvraag om een vergunning
      als bedoeld in [artikel 22][ref1] bij Onze Minister heeft ingediend en niet voor de afloop van die termijn de
      beslissing van Onze Minister onherroepelijk vaststaat, kan het gebruik van ontplofbare stoffen worden voortgezet
      tot het laatstbedoelde tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel22
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel165
