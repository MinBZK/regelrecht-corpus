      [ref7]: https://wetten.overheid.nl/BWBR0002320#HoofdstukVA
      [ref8]: https://wetten.overheid.nl/BWBR0014168#Artikel73
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel181
