  - number: 84d.1.d
    text: een analyse van de doeltreffendheid van de respons op olielekken.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel84d
  - number: 84d.2
    text: |-
      Bij het opstellen van het intern rampenplan als bedoeld in het eerste lid wordt rekening gehouden met de
      risicobeoordeling van zware ongevallen die tijdens het opstellen van het meest recente rapport inzake grote gevaren
      is uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel84d
  - number: 84d.3
    text: Bij ministeriële regeling worden nadere regels gesteld over een intern rampenplan.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel84d
  - number: 84d.4
    text: |-
      Een exploitant van een productie-installatie of een eigenaar van een niet-productie-installatie stelt bij een zwaar
      ongeval het intern rampenplan onverwijld in werking.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel84d
  - number: 84d.5
    text: |-
      Een exploitant van een productie-installatie of een eigenaar van een niet-productie-installatie beschikt over de
      noodzakelijke apparatuur en deskundigheid ter uitvoering van het intern rampenplan.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel84d
  - number: 84e.1
    text: |-
      Een regeling voor onafhankelijke verificatie voor boorgatactiviteiten als bedoeld in artikel 45l van de wet,
      waarborgt op onafhankelijke wijze dat het ontwerp en de controlemaatregelen voor de boorgaten te allen tijde
      geschikt zijn voor de verwachte boorgatomstandigheden.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel84e
  - number: 84e.2
    text: Een onafhankelijke verificateur dient voldoende onafhankelijk en deskundig te zijn.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel84e
  - number: 84e.3
    text: |-
      Bij ministeriële regeling worden ten aanzien van de regeling als bedoeld in het eerste lid nadere regels gesteld
      over de selectie van de onafhankelijke verificateur, over het ontwerp van de regeling alsmede welke informatie moet
      worden voorgelegd over de regeling.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel84e
  - number: 84f.1
    text: |-
      Een regeling voor onafhankelijke verificatie voor installaties als bedoeld in [artikel 45l van de wet](onbekend),
      waarborgt op onafhankelijke wijze dat de veiligheids- en milieukritische elementen die worden vermeld in de
      risicobeoordeling voor de installatie als beschreven in het rapport inzake grote gevaren, geschikt zijn en dat de
      planning van inspecties en testen van de veiligheids- en milieukritische elementen geschikt en bijgewerkt zijn en
      verlopen zoals voorzien.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel84f
  - number: 84f.2
    text: Een onafhankelijke verificateur dient voldoende onafhankelijk en deskundig te zijn.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel84f
  - number: 84f.3
    text: |-
      De regeling voor onafhankelijke verificatie wordt voor een productie-installatie getroffen voordat het ontwerp
      is voltooid.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel84f
  - number: 84f.4
    text: |-
      De regeling voor onafhankelijke verificatie wordt voor een niet- productie-installatie getroffen voordat de
      activiteiten worden gestart.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel84f
  - number: 84f.5
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld over de selectie van de onafhankelijke verificateur, over
      het ontwerp van de regeling alsmede welke informatie moet worden voorgelegd over de regeling.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel84f
  - number: 84g.1
    text: |-
      Een eigenaar van een niet-productie-installatie en een exploitant van een productie-installatie nemen binnen
      een bij ministeriële regeling vast te stellen termijn op basis van het advies van de onafhankelijke verificateur
      passende maatregelen en reageren op het advies van de onafhankelijke verificateur.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel84g
  - number: 84g.2
    text: |-
      Een eigenaar van een niet-productie-installatie en een exploitant van een productie-installatie stellen het
      Staatstoezicht op de Mijnen in kennis van het advies van de onafhankelijke verificateur en de reactie op het
      advies, binnen een bij ministeriële regeling vast te stellen termijn.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel84g
  - number: 84h
    text: |-
      Deze paragraaf is van toepassing op mijnbouwwerken die gebruikt worden voor de opsporing of winning van
      koolwaterstoffen.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel84h
