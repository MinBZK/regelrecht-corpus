        hoofdstuk: '10'
        paragraaf: '10.2'
  - number: '164.2'
    text: |-
      Vergunningen als bedoeld in de [artikelen 1][ref1] en [28, tweede lid, van het Groevenreglement 1947][ref2] voor
      andere doeleinden dan ontginning van kalksteen gelden als vergunningen als bedoeld in [artikel 151][ref3], met
      dien verstande dat op het tijdstip van inwerkingtreding van dit besluit de voorschriften of beperkingen verbonden
      aan deze vergunningen vervallen voor zover deze geen betrekking hebben op de gesteentemechanische veiligheid van
      de groeve.


      [ref1]: https://wetten.overheid.nl/BWBR0002025#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002025#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0014394#Artikel151
