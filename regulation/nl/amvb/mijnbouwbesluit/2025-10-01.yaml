  - number: '175.2'
    text: |-
      Een boorregister en een boorprofiel als bedoeld in [artikel 25][ref1] respectievelijk
      [34, tweede lid, van het Mijnreglement 1964][ref2] of in [artikel 64 van het Mijnreglement continentaal plat][ref3]
      gelden als een boorregister en een boorprofiel als bedoeld in [artikel 75, eerste lid][ref4], respectievelijk
      [109, eerste lid, onderdeel a][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0002474#Artikel25
