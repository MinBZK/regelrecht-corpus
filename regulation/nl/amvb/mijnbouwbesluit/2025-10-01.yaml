preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Economische Zaken van 30 augustus 2002, nr. WJZ 02042889;

    Gelet op bijlage 14, deel II, bij het op 7 december 1944 te Chicago tot stand gekomen Verdrag inzake de
    internationale burgerluchtvaart (Stb. 1947, 165), het op 30 november 1990 te Londen tot stand gekomen
    Internationaal Verdrag inzake de voorbereiding op, de bestrijding van en de samenwerking bij olieverontreiniging
    (Trb. 1992, 1), het op 22 september 1992 te Parijs tot stand gekomen Verdrag inzake de bescherming van het mariene
    milieu in het noordoostelijk deel van de Atlantische Oceaan (Trb. 1993, 141), het op 2 november 1973 te Londen tot
    stand gekomen Internationaal Verdrag ter voorkoming van verontreiniging door schepen (Trb. 1978, 188), de artikelen
    1, onderdelen n en o, 19, 25, 35, derde lid, 39, 41, eerste lid, 43, tweede lid, 49, 52, eerste lid, 123, vijfde
    lid, 130, 135, vierde lid, onderdeel a, vijfde en zevende lid, 136, eerste lid, 139, tweede lid, 141, tweede lid,
    151 en 190 van de Mijnbouwwet, alsmede artikel 99, tweede lid, van de Wet bodembescherming;

    De Raad van State gehoord (advies van 22 oktober 2002, nr. W10.02.0387/II);

    Gezien het nader rapport van de Staatssecretaris van Economische Zaken van 3 december 2002, nr. WJZ 02057343;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#ArtikelAanhef
