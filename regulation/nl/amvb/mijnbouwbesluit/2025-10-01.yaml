  - number: '176.2'
    text: |-
      Gedurende vier maanden na het tijdstip van inwerkingtreding van dit besluit kan een mijnbouwinstallatie zonder een
      verwijderingsplan als bedoeld in [artikel 60][ref1] buiten gebruik worden gesteld en verwijderd, met dien verstande
      dat gedurende die periode de [artikelen 137a][ref2] en [137b van het Mijnreglement 1964][ref3] respectievelijk de
      [artikelen 68 tot en met 70 van het Mijnreglement continentaal plat][ref4] van toepassing blijven op het buiten
      gebruik stellen en verwijderen van de mijnbouwinstallatie.


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel60
      [ref2]: https://wetten.overheid.nl/BWBR0002474#Artikel137a
      [ref3]: https://wetten.overheid.nl/BWBR0002474#Artikel137b
      [ref4]: https://wetten.overheid.nl/BWBR0002564#Artikel68
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel176
