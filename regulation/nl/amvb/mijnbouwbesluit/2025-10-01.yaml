    text: |-
      de bevindingen en opmerkingen van de onafhankelijke verificateur en de reactie van de exploitant en de door hem
      genomen maatregelen ten gevolge daarvan;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel84j
  - number: 84j.1.f
    text: overige informatie.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel84j
  - number: 84j.2
    text: |-
      De exploitant voldoet in geval van een boorgatactiviteit aan de maatregelen die zijn vastgesteld in de kennisgeving
      van de boorgatactiviteit.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel84j
  - number: 84j.3
    text: Bij ministeriële regeling worden nadere regels gesteld over de kennisgeving.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel84j
  - number: 84k.1
    text: 'Een kennisgeving, bedoeld in [artikel 45p van de wet](onbekend), bevat de volgende informatie:'
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel84k
  - number: 84k.1.a
    text: |-
      een op basis van [artikel 2.42][ref1] en [2.42f van het Arbeidsomstandighedenbesluit][ref2] op te stellen
      veiligheids- en gezondheidsdocument voor gelijktijdig uit te voeren werkzaamheden;


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel2
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel84k
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '2'
  - number: 84k.1.b
    text: overige informatie.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel84k
  - number: 84k.2
    text: Bij ministeriële regeling worden nadere regels gesteld over de kennisgeving.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel84k
  - number: 84l.1
    text: |-
      Een exploitant van een productie-installatie en eigenaren van niet-productie-installaties voldoen aan de
      maatregelen die zijn vastgesteld in de kennisgevingen als bedoeld in de [artikelen 84j][ref1] en [84k][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel84j
      [ref2]: https://wetten.overheid.nl/BWBR0014394#Artikel84k
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel84l
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: 84j
        hoofdstuk: '5'
        paragraaf: 5.4.1b
        afdeling: '5.4'
      - id: ref2
        bwb_id: BWBR0014394
        artikel: 84k
        hoofdstuk: '5'
        paragraaf: 5.4.1b
        afdeling: '5.4'
  - number: 84l.2
    text: |-
      Een exploitant van een voorgenomen productie-installatie houdt rekening met de opmerkingen van het Staatstoezicht
      op de mijnen ten aanzien van de kennisgeving van het ontwerp voor deze installatie, in het rapport inzake grote
      gevaren voor de productie-installatie.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel84l
  - number: 84m
    text: Deze paragraaf is van toepassing op mijnbouwwerken.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel84m
  - number: '85.1'
    text: |-
      Een uitvoerder of een uitvoerder aardwarmte draagt er zorg voor dat er een rampenbestrijdingsplan is voor elk
      mijnbouwwerk dat in gebruik is ten behoeve van de opsporing, winning of opslag van stoffen of de opsporing of
      winning van aardwarmte.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel85
  - number: '85.2'
    text: |-
      Een rampenbestrijdingsplan met betrekking tot een voor de winning of opslag bestemd mijnbouwwerk wordt ten minste
      iedere vijf jaar herzien.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel85
  - number: '85.3'
    text: |-
      Het rampenbestrijdingsplan wordt voor de eerste maal ten minste vier weken voor de aanvang van de opsporing,
      winning of opslag, ingediend bij het Staatstoezicht op de mijnen en, in het geval, bedoeld in het tweede lid,
      onverwijld na de herziening.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel85
  - number: '86.1'
    text: |-
      Een rampenbestrijdingsplan bevat een beschrijving van de maatregelen en voorzieningen die worden getroffen ter
      bestrijding of ter beperking van de gevolgen van voorvallen op een mijnbouwwerk dan wel in de omgeving daarvan,
      die een ernstig gevaar opleveren voor het milieu of voor zover van toepassing voor de veiligheid van de scheepvaart
      of visserij.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel86
  - number: '86.2'
    text: 'Onder de maatregelen en de voorzieningen, bedoeld in het eerste lid, wordt in ieder geval verstaan:'
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel86
  - number: 86.2.a
    text: de werkzaamheden die worden verricht ter bestrijding van een voorval als bedoeld in het eerste lid;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel86
  - number: 86.2.b
    text: de aanwezige materialen en bestrijdingsmiddelen die daarbij worden gebruikt;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel86
  - number: 86.2.c
    text: wie of welke instelling is belast met de in onderdeel a bedoelde werkzaamheden, en
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel86
  - number: 86.2.d
    text: wie belast is met het toezicht op het feitelijk verrichten van de in onderdeel a bedoelde werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel86
  - number: '87.1'
    text: |-
      Indien zich een voorval als bedoeld in [artikel 86, eerste lid][ref1], voordoet op een mijnbouwwerk, wordt
      onmiddellijk uitvoering gegeven aan het rampenbestrijdingsplan.


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel86
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: '86'
        hoofdstuk: '5'
        paragraaf: 5.4.2
        afdeling: '5.4'
  - number: '87.2'
    text: |-
      Zodra daartoe de mogelijkheid bestaat, meldt de uitvoerder of de uitvoerder aardwarmte het voorval aan de
      inspecteur-generaal der mijnen en bij een voorval op een mijnbouwinstallatie, aan het Kustwachtcentrum.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel87
  - number: '88.1'
    text: |-
      Indien zich een voorval als bedoeld in [artikel 86, eerste lid][ref1], voordoet in de omgeving van een
      mijnbouwwerk, meldt de uitvoerder of de uitvoerder aardwarmte het voorval onmiddellijk aan de inspecteur-generaal
      der mijnen en bij een voorval op een mijnbouwinstallatie, aan het Kustwachtcentrum.


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel86
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel88
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: '86'
        hoofdstuk: '5'
        paragraaf: 5.4.2
        afdeling: '5.4'
  - number: '88.2'
    text: |-
      De uitvoerder verleent of de uitvoerder aardwarmte en de houder van een startvergunning aardwarmte of een
      vervolgvergunning aardwarmte verlenen op aanwijzing van Onze Minister zoveel mogelijk hulp en bijstand bij het
      bestrijden van het voorval of het beperken van de gevolgen ervan.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel88
  - number: 88a
    text: |-
      De exploitant van een productie-installatie die in Nederland is gevestigd of diens dochteronderneming doet op
      verzoek van het Staatstoezicht op de mijnen verslag over de omstandigheden van elk zwaar ongeval dat zich buiten de
      Europese Unie heeft voltrokken en waar deze bij betrokken is geweest.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel88a
  - number: '89'
    text: |-
      De werkzaamheden ter bestrijding van voorvallen als bedoeld in [artikel 86, eerste lid][ref1], of ter beperking
      van de gevolgen ervan geschieden onder toezicht van een daartoe aangewezen deskundig persoon en door vakkundig
      personeel, dat daartoe voldoende geoefend en geïnstrueerd is.


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel86
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: '86'
        hoofdstuk: '5'
        paragraaf: 5.4.2
        afdeling: '5.4'
  - number: '90'
    text: |-
      Onze Minister kan bepalen dat een of meer door hem aangewezen uitvoerders of uitvoerders aardwarmte al dan niet
      gezamenlijk op daarbij aangegeven plaatsen en in een daarbij aangegeven omvang voor onmiddellijk gebruik ter
      beschikking hebben vaartuigen, helikopters of ander materieel ter bestrijding van voorvallen als bedoeld in
      [artikel 86, eerste lid][ref1], of ter beperking van de gevolgen ervan.


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel86
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: '86'
        hoofdstuk: '5'
        paragraaf: 5.4.2
        afdeling: '5.4'
  - number: '91'
    text: |-
      Onze Minister kan ten aanzien van het bestrijden van een voorval als bedoeld in [artikel 86, eerste lid][ref1], of
      het beperken van de gevolgen ervan:


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel86
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: '86'
        hoofdstuk: '5'
        paragraaf: 5.4.2
        afdeling: '5.4'
  - number: 91.a
    text: |-
      aanwijzingen geven op welke wijze de desbetreffende werkzaamheden worden verricht en welke bestrijdingsmiddelen
      daarbij worden aangewend;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel91
  - number: 91.b
    text: |-
      bepalen dat de desbetreffende werkzaamheden worden opgedragen aan een ter zake deskundige en daarin
      gespecialiseerde instelling.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel91
  - number: '92'
    text: 'In dit hoofdstuk wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel92
  - number: 92.a
    text: 'pijpleiding:'
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel92
  - number: 92.a.1°
    text: |-
      leiding die twee of meer mijnbouwwerken met elkaar verbindt ten behoeve van het vervoer van stoffen, te rekenen
      vanaf de eerste isolatieafsluiter van het mijnbouwwerk;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel92
  - number: 92.a.2°
    text: |-
      andere leiding dan bedoeld onder 1°, aan te wijzen door Onze Minister, die een mijnbouwwerk verbindt met een ander
      werk ten behoeve van het vervoer van stoffen te rekenen vanaf de eerste isolatieafsluiter van het mijnbouwwerk;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel92
  - number: 92.b
    text: |-
      kabel: leiding, gelegen in de territoriale zee of het continentaal plat, tussen twee of meer mijnbouwinstallaties
      of tussen een mijnbouwinstallatie en een ander werk, aangewezen door Onze Minister, ten behoeve van het vervoer van
      elektriciteit of elektronische signalen;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel92
  - number: 92.c
    text: 'de ligging: het traject, de diepte en de stabiliteit;'
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel92
  - number: 92.d
    text: |-
      beheerder: degene voor wiens rekening en risico een pijpleiding of kabel wordt aangelegd, gebruikt dan wel in stand
      gehouden;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel92
  - number: 92.e
    text: |-
      vergunning: vergunning als bedoeld in [artikel 94][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel94
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: '94'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: '93.1'
    text: |-
      Een pijpleiding bestaat uit pijpen die voldoende sterk zijn en op doelmatige wijze met elkaar zijn verbonden. De
      pijpleiding is tegen corrosie en uitwendige krachten beschermd.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel93
  - number: '93.2'
    text: De ligging van de pijpleiding is zodanig dat geen schade wordt veroorzaakt of zoveel mogelijk voorkomen.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel93
  - number: '93.3'
    text: |-
      De eigenschappen, de aanleg, de ligging en het onderhoud van de pijpleiding voldoen aan bij ministeriële regeling
      te stellen eisen.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel93
  - number: '94.1'
    text: |-
      Het is verboden zonder vergunning van Onze Minister een pijpleiding in de territoriale zee of op het
      continentaal plat aan te leggen. Indien de pijpleiding zal worden aangelegd in een gebied als bedoeld in de
      [artikelen 7.67, onderdeel b, onder 1°][ref1], of 7.67, onderdeel b, onder 2°, van het Besluit activiteiten
      leefomgeving wordt de vergunning verleend door Onze Minister in overeenstemming met Onze Minister van Defensie
      respectievelijk Onze Minister van Infrastructuur en Milieu.


      [ref1]: https://wetten.overheid.nl/BWBR0041330#Artikel7
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0041330
        artikel: '7'
  - number: '94.2'
    text: |-
      De vergunning wordt geweigerd indien de pijpleiding niet voldoet aan de bij of krachtens [artikel 93][ref1]
      gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel93
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: '93'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: '94.3'
    text: |-
      De vergunning kan onder beperkingen worden verleend en daaraan kunnen voorschriften worden verbonden in verband met
      risico op schade.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel94
  - number: '94.4'
    text: |-
      Indien de vergunning betrekking heeft op een project voor het aanleggen van een pijpleiding waarvoor
      op grond van [artikel 16.43 van de Omgevingswet][ref1] een milieueffectrapport moet worden gemaakt, is
      [afdeling 16.4 van die wet][ref2] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Afdeling16.4
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0037885
        artikel: '16'
      - id: ref2
        bwb_id: BWBR0037885
        afdeling: '16.4'
  - number: '95'
    text: |-
      [Artikel 94][ref1] is van overeenkomstige toepassing op een pijpleiding waarvan het aanleggen zal plaatsvinden in
      of op een ander gebied dan bedoeld in het [eerste lid, eerste volzin, van dat artikel][ref2], en waarvoor op grond
      van [artikel 16.43 van de Omgevingswet][ref3] een milieueffectrapport moet worden gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel94
      [ref2]: https://wetten.overheid.nl/BWBR0014394#Artikel94
      [ref3]: https://wetten.overheid.nl/BWBR0037885#Artikel16
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: '94'
        hoofdstuk: '6'
        paragraaf: '6.2'
      - id: ref2
        bwb_id: BWBR0014394
        artikel: '94'
        hoofdstuk: '6'
        paragraaf: '6.2'
      - id: ref3
        bwb_id: BWBR0037885
        artikel: '16'
  - number: '96.1'
    text: |-
      Onze Minister beslist over de aanvraag om een vergunning binnen acht weken na ontvangst van de
      aanvraag en, in geval [artikel 94, vierde lid][ref1], of [95][ref2] van toepassing is, binnen de in
      [artikel 3:18 van de Algemene wet bestuursrecht][ref3] gestelde termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel94
      [ref2]: https://wetten.overheid.nl/BWBR0014394#Artikel95
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: '94'
        hoofdstuk: '6'
        paragraaf: '6.2'
      - id: ref2
        bwb_id: BWBR0014394
        artikel: '95'
        hoofdstuk: '6'
        paragraaf: '6.2'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '96.2'
    text: |-
      Met toepassing van [artikel 28, eerste lid, laatste zinsnede, van de Dienstenwet][ref1] is
      [paragraaf 4.1.3.3. van de Algemene wet bestuursrecht][ref2] niet van toepassing op de aanvraag om een vergunning
      als bedoeld in [artikel 94, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
      [ref3]: https://wetten.overheid.nl/BWBR0014394#Artikel94
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
      - id: ref3
        bwb_id: BWBR0014394
        artikel: '94'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: '97.1'
    text: |-
      Een pijpleiding wordt niet voor de eerste maal in gebruik genomen, dan nadat Onze Minister de beheerder op diens
      verzoek heeft meegedeeld daarmee in te stemmen.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel97
  - number: '97.2'
    text: |-
      De beheerder doet het verzoek, bedoeld in het eerste lid, uiterlijk twee weken voordat hij de pijpleiding in
      gebruik wil nemen. Daarbij verstrekt de beheerder aan Onze Minister:
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel97
  - number: 97.2.a
    text: |-
      een verklaring van een onafhankelijke deskundige, waarin wordt beoordeeld of de eigenschappen en de aanleg van de
      pijpleiding voldoen aan de bij of krachtens [artikel 93][ref1] gestelde eisen, en


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel93
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel97
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: '93'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 97.2.b
    text: |-
      gegevens waaruit blijkt dat de ligging van de pijpleiding die is aangelegd in de territoriale zee of het
      continentaal plat voldoet aan de bij of krachtens [artikel 93][ref1] gestelde eisen en, voor zover van toepassing,
      aan de desbetreffende vergunningvoorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel93
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel97
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: '93'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: '97.3'
    text: |-
      De instemming tot ingebruikname is van rechtswege gegeven, indien Onze Minister niet binnen twee weken na ontvangst
      van het verzoek de in het eerste lid bedoelde mededeling heeft gedaan, tenzij zich een geval voordoet als bedoeld
      in [artikel 98][ref1]. De instemming van rechtswege wordt voor de mogelijkheid van bezwaar en beroep gelijkgesteld
      met een besluit als bedoeld in [artikel 1:3, eerste lid, van de Algemene wet bestuursrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel98
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel1
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel97
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: '98'
        hoofdstuk: '6'
        paragraaf: '6.3'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '1'
  - number: '98.1'
    text: |-
      Indien de feitelijke ligging van een pijpleiding die is aangelegd in de territoriale zee of het continentaal plat
      afwijkt van de ligging zoals deze in de vergunning is aangegeven, verstrekt de beheerder aan Onze Minister de
      gegevens van de feitelijke ligging ervan binnen vier weken na de aanleg van de pijpleiding. Indien er kennelijk
      geen risico op schade is, kan Onze Minister de vergunning dienovereenkomstig wijzigen.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel98
  - number: '98.2'
    text: |-
      Op de voorbereiding van de beschikking tot aanpassing als bedoeld in het eerste lid is
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel98
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: '99.1'
    text: |-
      Gedurende het gebruik of de instandhouding van een pijpleiding onderzoekt de beheerder periodiek de eigenschappen,
      en tevens de ligging van de pijpleiding voor zover deze is aangelegd in de territoriale zee of het continentaal
      plat, aan de hand van de bij of krachtens [artikel 93][ref1] gestelde eisen en, voor zover van toepassing, aan de
      desbetreffende vergunningvoorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel93
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: '93'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: '99.2'
    text: |-
      De beheerder verstrekt slechts die resultaten van het onderzoek aan de inspecteur-generaal der mijnen, waarbij
      afwijkingen worden geconstateerd van de eisen, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel99
  - number: '99.3'
    text: |-
      Op aanwijzing van Onze Minister kan de frequentie van het onderzoek worden verhoogd in verband met het risico op
      schade.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel99
  - number: '99.4'
    text: |-
      Onze Minister kan op aanvraag van de beheerder besluiten de frequentie van het onderzoek te verminderen tot een bij
      dat besluit aan te geven niveau.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel99
  - number: '99.5'
    text: 'Bij ministeriële regeling kunnen regels worden gesteld omtrent:'
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel99
  - number: 99.5.a
    text: de inhoud en wijze waarop het onderzoek plaatsvindt;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel99
  - number: 99.5.b
    text: de frequentie waarmee het in het eerste lid bedoelde onderzoek plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel99
  - number: '100.1'
    text: |-
      Indien lekkage van een pijpleiding wordt geconstateerd, neemt de beheerder onmiddellijk alle passende maatregelen
      ter voorkoming of beperking van de schade.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel100
  - number: '100.2'
    text: |-
      De beheerder stelt de pijpleiding, of het betrokken deel ervan, onmiddellijk buiten gebruik en maakt deze drukvrij
      als de lekkage risico op schade oplevert. De nodige herstelwerkzaamheden worden zo spoedig mogelijk verricht.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel100
  - number: '100.3'
    text: |-
      De beheerder maakt onmiddellijk melding van een lekkage aan de inspecteur-generaal der mijnen en indien de
      pijpleiding op het continentaal plat of in de territoriale zee ligt, tevens aan het Kustwachtcentrum.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel100
  - number: '100.4'
    text: 'De beheerder verstrekt de inspecteur-generaal der mijnen zo spoedig mogelijk gegevens omtrent:'
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel100
  - number: 100.4.a
    text: de oorzaken van de lekkage en de omstandigheden waaronder deze zich heeft voorgedaan;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel100
  - number: 100.4.b
    text: de eventuele ten gevolge van de lekkage vrijgekomen stoffen, alsmede hun eigenschappen;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel100
  - number: 100.4.c
    text: andere gegevens die van belang zijn om de aard en de ernst van de lekkage te kunnen beoordelen;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel100
  - number: 100.4.d
    text: |-
      de maatregelen die zijn genomen of worden overwogen om de gevolgen van de lekkage te voorkomen, te beperken of
      ongedaan te maken;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel100
  - number: 100.4.e
    text: de maatregelen die worden overwogen om te voorkomen dat een zodanige lekkage zich nogmaals kan voordoen.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel100
  - number: '100.5'
    text: |-
      Dit artikel is van overeenkomstige toepassing in gevallen waarbij schade of een risico op schade ontstaat op andere
      wijze dan in het eerste lid bedoeld.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel100
  - number: '101.1'
    text: |-
      Een herstelde pijpleiding, of het betrokken deel ervan, wordt niet eerder opnieuw in gebruik genomen, dan nadat
      Onze Minister aan de beheerder op diens verzoek heeft medegedeeld daarmee in te stemmen.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel101
  - number: '101.2'
    text: |-
      De [artikelen 97, tweede en derde lid][ref1], en [98][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel97
      [ref2]: https://wetten.overheid.nl/BWBR0014394#Artikel98
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel101
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: '97'
        hoofdstuk: '6'
        paragraaf: '6.3'
      - id: ref2
        bwb_id: BWBR0014394
        artikel: '98'
        hoofdstuk: '6'
        paragraaf: '6.3'
  - number: '102'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld omtrent het tijdelijk buiten gebruik stellen van een
      pijpleiding.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel102
  - number: '103.1'
    text: |-
      Onze Minister maakt bij een besluit als bedoeld in [artikel 45, tweede lid, van de wet ][ref1]een afweging van
      belangen aan de hand van de volgende criteria:


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel45
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel103
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '45'
  - number: 103.1.a
    text: de doelmatigheid van het gebruik van de ruimte;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel103
  - number: 103.1.b
    text: de gevolgen voor het milieu;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel103
  - number: 103.1.c
    text: de veiligheid op zee en land en
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel103
  - number: 103.1.d
    text: de doelmatigheid van de kosten.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel103
  - number: '103.2'
    text: |-
      Onze Minister kan bij het overwegen tot het nemen van een besluit als bedoeld in
      [artikel 45, tweede lid, van de wet][ref1], over een pijpleiding op land het criterium, bedoeld in het eerste lid,
      onder a, achterwege laten, indien het besluit een pijpleiding betreft die is aangelegd vóór de inwerkingtreding van
      dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel45
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel103
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '45'
  - number: '103.3'
    text: Bij ministeriële regeling worden nadere regels gesteld over de toepassing van de criteria.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel103
  - number: 103a
    text: |-
