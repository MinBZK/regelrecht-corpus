    text: |-
      Een eigenaar van een niet-productie-installatie raadpleegt een ondernemingsraad als bedoeld in
      [artikel 2 van de Wet op de ondernemingsraden][ref1] of een personeelsvertegenwoordiging als bedoeld in
      [artikel 35b van de Wet op de ondernemingsraden][ref2] bij het opstellen van het rapport inzake grote gevaren
      voor een niet-productie-installatie. Bij het ontbreken van een ondernemingsraad of personeelsvertegenwoordiging,
      voert een eigenaar overleg met de belanghebbende werknemers. Over het rapport wordt tevens overleg gevoerd met de
      werknemers van andere werkgevers, die op basis van een langlopende overeenkomst tot aanneming van werk mede in het
      bedrijf of de inrichting werkzaam zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0002747#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002747#Artikel35b
