  - number: '120'
    text: 'In dit hoofdstuk wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel120
  - number: 120.a
    text: |-
      bijdrage: bijdrage als bedoeld in [artikel 135, vierde lid, onderdeel a, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel135
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel120
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '135'
  - number: 120.b
    text: |-
      fonds: Waarborgfonds mijnbouwschade als bedoeld in [artikel 135, eerste lid, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel135
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel120
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '135'
  - number: 120.c
    text: |-
      mijnbouwactiviteiten: activiteiten als bedoeld in [artikel 134, eerste lid, onderdeel a, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel134
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel120
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '134'
  - number: 120.d
    text: |-
      mijnbouwondernemer: persoon als bedoeld in [artikel 134, eerste lid, onderdeel b, van de wet][ref1] of diens
      rechtsopvolger;


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel134
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel120
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '134'
  - number: 120.e
    text: |-
      schadevergoeding: schadevergoeding als bedoeld in [artikel 137 van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel137
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel120
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '137'
  - number: 120.f
    text: |-
      verkenningsonderzoek: onderzoek als bedoeld in [artikel 1, onderdeel d, van de wet][ref1], met uitzondering
      van onderzoek door of in opdracht van een mijnbouwondernemer die behoort tot een van de eerste drie in
      [artikel 121, tweede lid][ref2], genoemde sectoren.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0014394#Artikel121
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel120
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0014394
        artikel: '121'
        hoofdstuk: '8'
        paragraaf: '8.2'
  - number: '121.1'
    text: Het vermogen van het fonds bedraagt per 1 januari van elk kalenderjaar ten minste € 250 000.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel121
  - number: '121.2'
    text: |-
      De sectoren, genoemd in onderstaande tabel, dragen overeenkomstig de in die tabel genoemde bedragen bij aan de
      vorming van het initiële vermogen van het fonds.






                    *Sector*


                    *Aandeel*






                    Olie- en gaswinning


                    € 125 000




                    Zoutwinning


                    €  75 000




                    Opslag van stoffen


                    €  50 000




                    Verkenningsonderzoek


                    €    0
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel121
  - number: '121.3'
    text: |-
      Indien op 1 januari van enig kalenderjaar het vermogen waarover het fonds beschikt minder bedraagt dan het vermogen
      waarover het fonds op grond van het eerste lid dient te beschikken, wordt het tekort, voor zover niet veroorzaakt
      door de op een mijnbouwondernemer verhaalbare voorschotten, door de in het tweede lid genoemde sectoren aangevuld.
      Het aandeel van iedere sector wordt bepaald naar evenredigheid van de schadevergoedingen die in het voorafgaande
      kalenderjaar ten laste van het fonds zijn betaald in verband met de mijnbouwactiviteiten van de tot die sectoren
      behorende mijnbouwondernemers.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel121
  - number: '121.4'
    text: |-
      Indien in een sector geen mijnbouwondernemers meer zijn die een bijdrage kan worden opgelegd, wordt het aandeel van
      die sector in het vermogen van het fonds gelijkelijk verdeeld over de andere sectoren.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel121
  - number: '122.1'
    text: |-
      De bijdrage die een mijnbouwondernemer, behorende tot een van de eerste drie in [artikel 121, tweede lid][ref1],
      genoemde sectoren, verschuldigd is, omvat een bedrag ter dekking van het aandeel van de sector in het tekort,
      berekend overeenkomstig artikel 121, derde lid. De mijnbouwondernemers die tot dezelfde sector behoren, doen
      Onze Minister voor 1 maart gezamenlijk een gemotiveerd voorstel toekomen omtrent het in de eerste volzin genoemde
      bedrag. Hierbij wordt rekening gehouden met:


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel121
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel122
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: '121'
        hoofdstuk: '8'
        paragraaf: '8.2'
  - number: 122.1.a
    text: de aard en omvang van de mijnbouwactiviteiten van elke mijnbouwondernemer in de vijf voorafgaande kalenderjaren;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel122
  - number: 122.1.b
    text: |-
      de uitkeringen die in de vijf voorafgaande kalenderjaren ten laste van het fonds in verband met de
      mijnbouwactiviteiten van elke mijnbouwondernemer zijn gedaan.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel122
  - number: '122.2'
    text: |-
      Onze Minister stelt voor 1 april de bijdrage voor elke mijnbouwondernemer vast, met inachtneming van het voorstel,
      bedoeld in het eerste lid, tenzij dat voorstel naar zijn oordeel niet voldoet aan de derde volzin van dat lid, dan
      wel het algemeen belang zich tegen dit voorstel verzet. Indien Onze Minister afwijkt van het voorstel, is de derde
      volzin van het eerste lid van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel122
  - number: '122.3'
    text: |-
      Indien de mijnbouwondernemers die tot dezelfde sector behoren niet voor 1 maart een voorstel overleggen, stelt
      Onze Minister voor 1 april de bijdrage ambtshalve vast. De eerste en de derde volzin van het eerste lid zijn van
      overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel122
  - number: '123'
    text: |-
      [Artikel 122][ref1] is van overeenkomstige toepassing op de verdeling van het aandeel van een sector in de
      eenmalige vorming van het initiële vermogen van het fonds, bedoeld in [artikel 121, tweede lid][ref2], over de
      mijnbouwondernemers die tot die sector behoren, met dien verstande dat voor onderdeel b van het tweede lid wordt
      gelezen de hoogte van de schadevergoedingen die elke mijnbouwondernemer in de vijf kalenderjaren voorafgaande aan
      de inwerkingtreding van de wet aan natuurlijke personen heeft betaald in verband met zijn mijnbouwactiviteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel122
      [ref2]: https://wetten.overheid.nl/BWBR0014394#Artikel121
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: '122'
        hoofdstuk: '8'
        paragraaf: '8.3'
      - id: ref2
        bwb_id: BWBR0014394
        artikel: '121'
        hoofdstuk: '8'
        paragraaf: '8.2'
  - number: '124.1'
    text: |-
      De bijdrage die een mijnbouwondernemer, behorende tot de laatste in [artikel 121, tweede lid][ref1], genoemde
      sector, verschuldigd is, omvat een bedrag ter dekking van het aandeel van de sector in een tekort, berekend
      overeenkomstig artikel 121, derde lid. Het in de eerste volzin genoemde bedrag wordt bepaald door het aandeel
      van de sector in het tekort te verdelen over de mijnbouwondernemers die in het voorafgaande kalenderjaar
      verkenningsonderzoek hebben verricht, naar evenredigheid van het aantal onderzoeken dat ieder van hen in dat jaar
      heeft verricht. Onze Minister stelt de bijdrage voor 1 april vast.


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel121
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel124
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: '121'
        hoofdstuk: '8'
        paragraaf: '8.2'
  - number: '124.2'
    text: |-
      Indien in het voorafgaande kalenderjaar geen verkenningsonderzoek is verricht, is de bijdrage verschuldigd
      door de mijnbouwondernemers die in het aan dat kalenderjaar voorafgaande tijdvak van vijf kalenderjaren
      verkenningsonderzoek hebben verricht. De tweede en derde volzin van het eerste lid zijn van overeenkomstige
      toepassing.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel124
  - number: '126.1'
    text: Onze Minister stelt bij beschikking de verschuldigde bijdrage vast.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel126
  - number: '126.2'
    text: Bij ministeriële regeling kunnen regels worden gesteld omtrent de wijze waarop de betaling wordt gedaan.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel126
  - number: '129'
    text: |-
      Onverminderd [artikel 4:2 van de Algemene wet bestuursrecht][ref1], bevat een verzoek om schadevergoeding ten
      minste:


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel129
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 129.a
    text: naam en adres van de desbetreffende mijnbouwondernemer;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel129
  - number: 129.b
    text: een opgave van de plaats en tijdstip van de mijnbouwactiviteiten;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel129
  - number: 129.c
    text: een opgave van de aard en omvang van de zaakschade;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel129
  - number: 129.d
    text: een redelijke specificatie van het schadebedrag; en
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel129
  - number: 129.e
    text: |-
      indien het een verzoek om schadevergoeding betreft, een opgave waaruit blijkt dat zich één van de omstandigheden,
      genoemd in [artikel 137, onderdelen a of b, van de wet][ref1] voordoet, alsmede een opgave van de in onderdeel c
      bedoelde vergoedingen van de schade uit anderen hoofde.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel137
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel129
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '137'
  - number: '130'
    text: |-
      Het fonds tekent op het verzoekschrift de datum van ontvangst aan en zendt de verzoeker onverwijld een
      ontvangstbevestiging, waarop die datum is vermeld.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel130
  - number: '131'
    text: Onze Minister beslist op het verzoek binnen zes weken na ontvangst daarvan.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel131
  - number: '132.1'
    text: |-
      Het bepaalde bij of krachtens de [Comptabiliteitswet 2001][ref1] is van overeenkomstige toepassing op de financiële
      middelen van het fonds, tenzij dit naar het oordeel van Onze Minister en Onze Minister van Financiën niet mogelijk
      of zinvol is.


      [ref1]: https://wetten.overheid.nl/BWBR0013891
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel132
    references:
      - id: ref1
        bwb_id: BWBR0013891
  - number: '132.2'
    text: |-
      De informatie over de jaarlijkse begroting en de jaarlijkse balanspositie per 31 december van het fonds wordt
      opgenomen in de begroting en het departementale jaarverslag van het Ministerie van Economische Zaken bij het
      daarvoor meest in aanmerking komende beleidsartikel, als ware het fonds een begrotingsreserve als bedoeld in
      [artikel 5, vierde lid, van de Comptabiliteitswet 2001][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel5
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel132
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '5'
  - number: '132.3'
    text: De tijdelijk niet-benodigde middelen van het fonds worden in rekening-courant bij 's Rijks schatkist aangehouden.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel132
  - number: '133'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent de inrichting en de administratie van het
      fonds, alsmede het op die inrichting en administratie uit te oefenen toezicht.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel133
  - number: '134'
    text: |-
      In dit hoofdstuk wordt verstaan onder vergunning: opsporingsvergunning, winningsvergunning, startvergunning
      aardwarmte, vervolgvergunning aardwarmte of opslagvergunning.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel134
  - number: '135.1'
    text: |-
      Op aanvraag van de houder van een vergunning splitst Onze Minister de vergunning in twee of meer vergunningen voor
      twee of meer gebieden.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel135
  - number: '135.2'
    text: |-
      Aan de op grond van het eerste lid te verlenen vergunningen worden de beperkingen en voorschriften verbonden die
      zijn verbonden aan de te splitsen vergunning.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel135
  - number: '135.3'
    text: |-
      De op grond van het eerste lid te verlenen vergunningen gelden tezamen voor hetzelfde gebied als waarvoor de te
      splitsen vergunning geldt.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel135
  - number: '135.4'
    text: |-
      Het tijdvak waarvoor de op grond van het eerste lid te verlenen vergunningen gelden, eindigt op het tijdstip waarop
      het tijdvak van de te splitsen vergunning zou zijn geëindigd.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel135
  - number: '136'
    text: |-
      Een aanvraag om splitsing wordt niet ingewilligd indien dat ertoe leidt dat een voorkomen van delfstoffen of
      aardwarmte dan wel een voorkomen voor het opslaan van stoffen in het oorspronkelijke vergunningsgebied zich door
      deze splitsing in twee of meer verschillende vergunningsgebieden zal bevinden.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel136
  - number: 136a.1
    text: |-
      Op een aanvraag als bedoeld in [artikel 143, achtste lid, eerste volzin, van de wet][ref1] van de houder van een
      winningsvergunning wijzigt Onze Minister de winningsvergunning door van het gebied waarop die vergunning betrekking
      heeft, af te splitsen een gebiedsdeel dat de vergunninghouder wil doen overgaan op een ander en verleent Onze
      Minister aan deze vergunninghouder een winningsvergunning voor het afgesplitste gebiedsdeel.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel143
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel136a
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '143'
  - number: 136a.2
    text: |-
      De op grond van het eerste lid verleende winningsvergunning voor een afgesplitst gebiedsdeel geldt tezamen met
      de winningsvergunning waarvan dat deel is afgesplitst voor hetzelfde gebied als waarvoor de winningsvergunning
      voorafgaand aan de afsplitsing geldt.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel136a
  - number: 136a.3
    text: |-
      Het tijdvak waarvoor de op grond van het eerste lid te verlenen vergunning geldt, eindigt op het tijdstip waarop
      het tijdvak van de winningsvergunning waarvan dat deel is afgesplitst eindigt.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel136a
  - number: 136b
    text: |-
      Een aanvraag om afsplitsing van een winningsvergunning wordt niet ingewilligd indien dat ertoe leidt dat een
      voorkomen van delfstoffen of aardwarmte dan wel een voorkomen voor het opslaan van stoffen in het oorspronkelijke
      vergunningsgebied zich door deze afsplitsing in twee of meer verschillende vergunningsgebieden zal bevinden.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel136b
  - number: '137.1'
    text: |-
      Op gezamenlijke aanvraag van de houders van twee of meer vergunningen voegt Onze Minister de vergunningen samen tot
      een vergunning voor een gebied.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel137
  - number: '137.2'
    text: |-
      Aan de op grond van het eerste lid te verlenen vergunning worden de voorschriften en beperkingen verbonden die zijn
      verbonden aan de samen te voegen vergunningen.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel137
  - number: '137.3'
    text: |-
      De op grond van het eerste lid te verlenen vergunning geldt voor hetzelfde gebied als waarvoor de samen te voegen
      vergunningen tezamen gelden.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel137
  - number: '137.4'
    text: |-
      Het tijdvak waarvoor de op grond van het eerste lid te verlenen vergunning geldt, eindigt op het tijdstip waarop
      het tijdvak zou eindigen van die samen te voegen vergunning waarvan het tijdvak het eerst zou zijn geëindigd.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel137
  - number: '138.1'
    text: |-
      Vergunningen voor opsporen, winnen of opslaan van bepaalde stoffen worden uitsluitend samengevoegd met vergunningen
      voor opsporen, winnen onderscheidenlijk opslaan van dezelfde stoffen.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel138
  - number: '138.2'
    text: |-
      Startvergunningen aardwarmte en vervolgvergunningen aardwarmte worden uitsluitend samengevoegd met
      startvergunningen aardwarmte onderscheidenlijk vervolgvergunningen aardwarmte.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel138
  - number: '138.3'
    text: |-
      Vergunningen voor opsporen van CO-complexen worden uitsluitend samengevoegd met vergunningen voor opsporen van
      CO-complexen.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel138
  - number: '140'
    text: |-
      Een aanvraag om samenvoeging van twee of meerdere vergunningen wordt slechts ingewilligd, indien de voorwaarden
      van de desbetreffende totstandgekomen overeenkomsten, bedoeld in [artikel 81, onderdeel d][ref1], respectievelijk
      artikel 81, onderdeel e, respectievelijk [artikel 86a, eerste lid, van de wet][ref2], gelijkluidend zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel81
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel86a
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel140
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '81'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: 86a
  - number: '141.1'
    text: |-
      Een aanvraag om splitsing of samenvoeging van opsporings- of winningsvergunningen, startvergunningen aardwarmte
      of vervolgvergunningen aardwarmte kan mede worden geweigerd: a. in het belang van het doelmatig en voortvarend
      opsporen en winnen; b. in het geval van een opsporings- of winningsvergunning indien deze in overwegende mate
      strekt tot vermindering van de afdrachten, bedoeld in [hoofdstuk 5 van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel141
    references:
      - id: ref1
        bwb_id: BWBR0014168
        hoofdstuk: '5'
  - number: '141.2'
    text: |-
      Een aanvraag om splitsing of samenvoeging van opslagvergunningen kan mede worden geweigerd indien deze in
      overwegende mate strekt tot vermindering van de afdrachten, bedoeld in [hoofdstuk 5 van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel141
    references:
      - id: ref1
        bwb_id: BWBR0014168
        hoofdstuk: '5'
  - number: '141.3'
    text: 'Een aanvraag om afsplitsing van winningsvergunningen kan mede worden geweigerd:'
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel141
  - number: 141.3.a
    text: in het belang van het doelmatig en voortvarend winnen;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel141
  - number: 141.3.b
    text: |-
      indien deze in overwegende mate strekt tot vermindering van de afdrachten, bedoeld in
      [artikel 147, tweede lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel147
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel141
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '147'
  - number: '142.1'
    text: |-
      Met toepassing van [paragraaf 9.2][ref1] verleende vergunningen vervangen met ingang van het tijdstip waarop
      zij in werking treden, de te splitsen vergunning. De te splitsen vergunning vervalt op het tijdstip waarop de met
      toepassing van [paragraaf 9.2][ref2] verleende vergunningen onherroepelijk worden.


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Hoofdstuk9
      [ref2]: https://wetten.overheid.nl/BWBR0014394#Hoofdstuk9
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel142
    references:
      - id: ref1
        bwb_id: BWBR0014394
        hoofdstuk: '9'
        paragraaf: '9.2'
      - id: ref2
        bwb_id: BWBR0014394
        hoofdstuk: '9'
        paragraaf: '9.2'
  - number: '142.2'
    text: |-
      De met toepassing van [paragraaf 9.3][ref1] verleende vergunning vervangt met ingang van het tijdstip waarop
      zij in werking treedt, de samen te voegen vergunningen. De samen te voegen vergunningen vervallen op het tijdstip
      waarop de met toepassing van [paragraaf 9.3][ref2] verleende vergunning onherroepelijk wordt.


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Hoofdstuk9
      [ref2]: https://wetten.overheid.nl/BWBR0014394#Hoofdstuk9
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel142
    references:
      - id: ref1
        bwb_id: BWBR0014394
        hoofdstuk: '9'
        paragraaf: '9.3'
      - id: ref2
        bwb_id: BWBR0014394
        hoofdstuk: '9'
        paragraaf: '9.3'
  - number: '143.1'
    text: |-
      Indien ten aanzien van de te splitsen vergunning of één van de samen te voegen vergunningen een overeenkomst
      als bedoeld in [artikel 81, onderdeel d][ref1], respectievelijk artikel 81, onderdeel e, respectievelijk
      [artikel 86a, eerste lid, van de wet][ref2] tot stand is gekomen, verleent de in artikel 81, onderdeel a, bedoelde
      vennootschap en de vergunninghouders van de op grond van [artikel 135][ref3] of [137][ref4] te verlenen vergunning
      of vergunningen medewerking aan de totstandkoming van een overeenkomst waarvan de voorwaarden gelijkluidend zijn
      aan die van eerder bedoelde overeenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel81
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel86a
      [ref3]: https://wetten.overheid.nl/BWBR0014394#Artikel135
      [ref4]: https://wetten.overheid.nl/BWBR0014394#Artikel137
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel143
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '81'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: 86a
      - id: ref3
        bwb_id: BWBR0014394
        artikel: '135'
        hoofdstuk: '9'
        paragraaf: '9.2'
      - id: ref4
        bwb_id: BWBR0014394
        artikel: '137'
        hoofdstuk: '9'
        paragraaf: '9.3'
  - number: '143.2'
    text: De in het eerste lid laatstbedoelde overeenkomst behoeft de instemming van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel143
  - number: '143.3'
    text: |-
      Tot het tijdstip waarop de instemming wordt verleend, verricht de vergunninghouder geen winningswerkzaamheden.
      Tot dat tijdstip behoeven besluiten als bedoeld in de [artikelen 91, onderdeel c][ref1], en
      [97, tweede lid, van de wet][ref2] de instemming van de aangewezen vennootschap.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel91
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel97
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel143
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '91'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '97'
  - number: '143.4'
    text: |-
      [Paragraaf 4.1.3.3 van de Algemene wet bestuursrecht][ref1] is van toepassing op het verzoek tot instemming,
      bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel143
    references:
      - id: ref1
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: 143a.1
    text: |-
      Voor zover het niet verenigbaar is met het bij of krachtens de wet bepaalde om aan de winningsvergunning voor een
      afgesplitst gebiedsdeel de beperkingen en voorschriften te verbinden, die zijn verbonden aan de winningsvergunning
      waarvan dat gebiedsdeel is afgesplitst, kan Onze Minister aan de winningsvergunning voor het afgesplitste
      gebiedsdeel aangepaste voorschriften en beperkingen verbinden.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel143a
  - number: 143a.2
    text: 'Onze Minister kan voorschriften en beperkingen aanpassen als bedoeld in het eerste lid, mede met het oog op:'
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel143a
  - number: 143a.2.a
    text: |-
      het planmatig beheer of gebruik van delfstoffen, aardwarmte en andere natuurlijke rijkdommen, waaronder grondwater
      met het oog op de winning van drinkwater;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel143a
  - number: 143a.2.b
    text: mogelijkheden tot het opslaan van stoffen.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel143a
  - number: '144'
    text: |-
      De wijze waarop een aanvraag om splitsing, afsplitsing of samenvoeging geschiedt en de gegevens en de bescheiden,
      welke daarbij worden overgelegd, geschiedt bij ministeriële regeling te stellen regels.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel144
  - number: '145'
    text: 'In dit hoofdstuk wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel145
  - number: 145.a
    text: |-
      het winnen van kalksteen: het met gebruikmaking van een boorgat, tunnel, schacht of ander ondergronds werk
      onttrekken van kalksteen aan de ondergrond;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel145
  - number: 145.b
    text: 'groeve: ondergrondse ruimte ontstaan door het winnen van kalksteen;'
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel145
  - number: 145.c
    text: |-
      gedeputeerde staten: gedeputeerde staten van de provincie waarin een groeve geheel of voor het grootste deel is
      gelegen.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel145
  - number: '146.1'
    text: Het is verboden zonder vergunning van gedeputeerde staten kalksteen te winnen.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel146
  - number: '146.2'
    text: Een vergunning kan slechts worden geweigerd ter bescherming van de veiligheid met het oog op instorting.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel146
  - number: '146.3'
    text: |-
      Gedeputeerde staten kunnen in het belang van de veiligheid met het oog op instorting aan een vergunning
      voorschriften verbinden of een vergunning onder beperkingen verlenen.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel146
  - number: '147.1'
    text: |-
      In een vergunning als bedoeld in [artikel 146][ref1] wordt bepaald voor welk tijdvak en welk gebied zij geldt. Het
      tijdvak waarvoor de vergunning geldt, kan op aanvraag van de vergunninghouder worden verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel146
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel147
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: '146'
        hoofdstuk: '10'
        paragraaf: '10.2'
  - number: '147.2'
    text: 'In de vergunning kunnen in ieder geval voorschriften worden gesteld of beperkingen opgenomen omtrent:'
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel147
  - number: 147.2.a
    text: de wijze van winning;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel147
  - number: 147.2.b
    text: de ligging, hoogte en breedte van de tunnels, schachten of andere ondergrondse werken;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel147
  - number: 147.2.c
    text: de afmeting van de pilaren;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel147
  - number: 147.2.d
    text: de maatregelen bij het aantreffen van aardpijpen;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel147
  - number: 147.2.e
    text: de maatregelen bij het kruisen van tunnels, schachten of andere ondergrondse werken, en
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel147
  - number: 147.2.f
    text: |-
      de wijze waarop en frequentie waarmee metingen naar de gesteentemechanische veiligheid van de groeve worden gedaan
      en de resultaten daarvan worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel147
  - number: '149'
    text: |-
      Indien een vergunning als bedoeld in [artikel 146][ref1] wordt overgedragen of anders dan door overdracht overgaat
      op een andere natuurlijke persoon of rechtspersoon, doet deze persoon binnen vier weken na de verkrijging ervan
      mededeling aan gedeputeerde staten.


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel146
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel149
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: '146'
        hoofdstuk: '10'
        paragraaf: '10.2'
  - number: '150.1'
    text: |-
      De houder van een vergunning als bedoeld in [artikel 146][ref1] verstrekt jaarlijks aan gedeputeerde staten een
      geactualiseerde kaart van de groeve.


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel146
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel150
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: '146'
        hoofdstuk: '10'
        paragraaf: '10.2'
  - number: '150.2'
    text: Bij ministeriële regeling kunnen regels worden gesteld omtrent de in het eerste lid bedoelde kaart.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel150
  - number: '151.1'
    text: |-
      Het is verboden zonder vergunning van gedeputeerde staten een groeve, die niet langer in gebruik is voor het winnen
      van kalksteen, voor een ander doeleinde te gebruiken of daaraan enige wijziging aan te brengen.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel151
  - number: '151.2'
    text: |-
      [Artikel 146, tweede en derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel146
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel151
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: '146'
        hoofdstuk: '10'
        paragraaf: '10.2'
  - number: '152.1'
    text: |-
      In een vergunning als bedoeld in [artikel 151][ref1] wordt bepaald voor welk doeleinde, welk tijdvak en welk gebied
      zij geldt. Het tijdvak waarvoor de vergunning geldt, kan op aanvraag van de vergunninghouder worden verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel151
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel152
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: '151'
        hoofdstuk: '10'
        paragraaf: '10.3'
  - number: '152.2'
    text: 'In de vergunning kunnen in ieder geval voorschriften worden gesteld of beperkingen opgenomen omtrent:'
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel152
  - number: 152.2.a
    text: |-
      de maatregelen ter voorkoming dat gedeelten van de groeve, die buiten het vergunningsgebied vallen, worden
      betreden;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel152
  - number: 152.2.b
    text: |-
      de wijze waarop en frequentie waarmee de metingen naar de gesteentemechanische veiligheid van de groeve worden
      gedaan en de resultaten daarvan worden verstrekt, en
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel152
  - number: 152.2.c
    text: |-
      de plaatsen van de groeve waaraan wijzigingen worden aangebracht, de omvang van die wijzigingen en de wijze waarop
      deze tot stand worden gebracht.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel152
  - number: '153'
    text: |-
      Het verbod van [artikel 146, eerste lid][ref1], is niet van toepassing op wijziging van een groeve voor het gebruik
      voor een ander doeleinde.


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel146
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel153
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: '146'
        hoofdstuk: '10'
        paragraaf: '10.2'
  - number: '154'
    text: |-
      [Artikel 149][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel149
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel154
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: '149'
        hoofdstuk: '10'
        paragraaf: '10.2'
  - number: '155'
    text: Het is verboden in een groeve ontplofbare stoffen voorhanden te hebben of te gebruiken.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel155
  - number: '156.1'
    text: Een groeve is zo ingericht en van beveiligingen voorzien dat gevaar voor instorting zoveel mogelijk is uitgesloten.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel156
  - number: '156.2'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent de inrichting en beveiligingen.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel156
  - number: '157.1'
    text: |-
      De houder van een vergunning als bedoeld in de [artikelen 146][ref1] en [151][ref2] neemt bij het winnen van
      kalksteen respectievelijk het gebruik voor een ander doeleinde alle nodige maatregelen ter voorkoming van
      instorting van een groeve, alsmede ter beperking van de gevolgen van een instorting.


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel146
      [ref2]: https://wetten.overheid.nl/BWBR0014394#Artikel151
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel157
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: '146'
        hoofdstuk: '10'
        paragraaf: '10.2'
      - id: ref2
        bwb_id: BWBR0014394
        artikel: '151'
        hoofdstuk: '10'
        paragraaf: '10.3'
  - number: '157.2'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent de in het eerste lid bedoelde maatregelen.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel157
  - number: '158'
    text: |-
      De houder van een vergunning als bedoeld in de [artikelen 146][ref1] en [151][ref2] verricht periodiek metingen
      naar de gesteentemechanische veiligheid van een groeve en verstrekt daarvan de resultaten aan gedeputeerde staten.


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel146
      [ref2]: https://wetten.overheid.nl/BWBR0014394#Artikel151
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel158
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: '146'
        hoofdstuk: '10'
        paragraaf: '10.2'
      - id: ref2
        bwb_id: BWBR0014394
        artikel: '151'
        hoofdstuk: '10'
        paragraaf: '10.3'
  - number: '159.1'
    text: |-
      Wanneer de veiligheid van een groeve wordt bedreigd door instortingsgevaar, doet de houder van een vergunning als
      bedoeld in de [artikelen 146][ref1] en [151][ref2] hiervan onmiddellijk mededeling aan gedeputeerde staten.


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel146
      [ref2]: https://wetten.overheid.nl/BWBR0014394#Artikel151
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel159
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: '146'
        hoofdstuk: '10'
        paragraaf: '10.2'
      - id: ref2
        bwb_id: BWBR0014394
        artikel: '151'
        hoofdstuk: '10'
        paragraaf: '10.3'
  - number: '159.2'
    text: De houder van de vergunning doet onmiddellijk mededeling van een instorting aan gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel159
  - number: '160.1'
    text: |-
      De houder van een vergunning als bedoeld in de [artikelen 146][ref1] en [151][ref2] doet tijdig van het voornemen
      tot het buitengebruik stellen van een groeve, of een gedeelte ervan, mededeling aan gedeputeerde staten. De houder
      verstrekt daarbij een geactualiseerde kaart van de groeve.


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel146
      [ref2]: https://wetten.overheid.nl/BWBR0014394#Artikel151
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel160
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: '146'
        hoofdstuk: '10'
        paragraaf: '10.2'
      - id: ref2
        bwb_id: BWBR0014394
        artikel: '151'
        hoofdstuk: '10'
        paragraaf: '10.3'
  - number: '160.2'
    text: |-
      Bij het buiten gebruik stellen van de groeve, of een gedeelte ervan, worden alle nodige maatregelen genomen ter
      beperking van het gevaar voor instorting.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel160
  - number: '160.3'
    text: De toegangen tot de groeve worden behoorlijk afgesloten.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel160
  - number: '161'
    text: |-
      Indien een groeve tijdelijk buiten gebruik wordt gesteld, is [artikel 160, eerste en derde lid][ref1], van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel160
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel161
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: '160'
        hoofdstuk: '10'
        paragraaf: '10.5'
  - number: 161a.1
    text: |-
      De bedragen, verschuldigd op grond van [artikel 133, eerste lid, van de wet][ref1] zijn vaste bedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel133
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel161a
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '133'
  - number: 161a.2
    text: |-
      De bedragen, bedoeld in [artikel 133, eerste lid, onderdeel a, van de wet][ref1] worden in rekening gebracht voor
      het op aanvraag verlenen, wijzigen, intrekken of beoordelen van:


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel133
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel161a
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '133'
  - number: 161a.2.a
    text: |-
      een besluit als bedoeld in de [artikelen 6][ref1], [24b][ref2] en [24d van de wet][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel24b
      [ref3]: https://wetten.overheid.nl/BWBR0014168#Artikel24d
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel161a
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: 24b
      - id: ref3
        bwb_id: BWBR0014168
        artikel: 24d
  - number: 161a.2.b
    text: |-
      een instemming met een winningsplan, een verwijderingsplan, of een rapport dan wel een beoordeling van een
      melding als bedoeld in de [artikelen 34, derde lid][ref1], [44, eerste lid][ref2], [44a, eerste lid][ref3],
      [44c, derde lid][ref4], respectievelijk [artikel 44, eerste lid, van de wet][ref5] en een ontheffing als bedoeld
      [artikel 44b, eerste lid, van de wet][ref6];


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel44
      [ref3]: https://wetten.overheid.nl/BWBR0014168#Artikel44a
      [ref4]: https://wetten.overheid.nl/BWBR0014168#Artikel44c
      [ref5]: https://wetten.overheid.nl/BWBR0014168#Artikel44
      [ref6]: https://wetten.overheid.nl/BWBR0014168#Artikel44b
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel161a
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '34'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '44'
      - id: ref3
        bwb_id: BWBR0014168
        artikel: 44a
      - id: ref4
        bwb_id: BWBR0014168
        artikel: 44c
      - id: ref5
        bwb_id: BWBR0014168
        artikel: '44'
      - id: ref6
        bwb_id: BWBR0014168
        artikel: 44b
  - number: 161a.2.c
    text: |-
      een maatwerkvoorschrift als bedoeld in [artikel 4.5 van de Omgevingswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel4
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel161a
    references:
      - id: ref1
        bwb_id: BWBR0037885
        artikel: '4'
  - number: 161a.2.d
    text: |-
      een omgevingsvergunning als bedoeld in [artikel 5.1 van de Omgevingswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel5
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel161a
    references:
      - id: ref1
        bwb_id: BWBR0037885
        artikel: '5'
  - number: 161a.2.e
    text: |-
      een vergunning als bedoeld in de [artikelen 22, eerste lid][ref1], en [94, eerste lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0014394#Artikel94
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel161a
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: '22'
        hoofdstuk: '2'
        paragraaf: '2.4'
      - id: ref2
        bwb_id: BWBR0014394
        artikel: '94'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: 161a.2.f
    text: |-
      een instemming als bedoeld in [artikel 55, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel55
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel161a
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: '55'
        hoofdstuk: '5'
        paragraaf: 5.2.2
        afdeling: '5.2'
  - number: 161a.2.g
    text: |-
      een ontheffing, instemming of beoordeling van een melding krachtens dit besluit of een
      krachtens dit besluit vastgestelde ministeriële regeling, die betrekking heeft op een productie-
      installatie, een niet-productie-installatie, een pijpleiding, een gastransportnet als bedoeld in
      [artikel 1, eerste lid, onderdeel d, van de Gaswet][ref1] of een mijnbouwwerk bedoeld voor het opsporen of winnen
      van aardwarmte;


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel1
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel161a
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '1'
  - number: 161a.2.h
    text: |-
      een melding als bedoeld in [artikel 2.7 van het Besluit activiteiten leefomgeving][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0041330#Artikel2
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel161a
    references:
      - id: ref1
        bwb_id: BWBR0041330
        artikel: '2'
  - number: 161a.2.i
    text: |-
      een toestemming als bedoeld in [artikel 2.7 van het Besluit activiteiten leefomgeving][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0041330#Artikel2
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel161a
    references:
      - id: ref1
        bwb_id: BWBR0041330
        artikel: '2'
  - number: 161a.2.j
    text: |-
      gegevens en bescheiden als bedoeld in de [artikelen 4.1117][ref1], [6.47a][ref2] en
      [7.69 van het Besluit activiteiten leefomgeving][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0041330#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0041330#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0041330#Artikel7
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel161a
    references:
      - id: ref1
        bwb_id: BWBR0041330
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0041330
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0041330
        artikel: '7'
  - number: 161a.2.k
    text: |-
      een instemming met de aanwijzing van de uitvoerder aardwarmte als bedoeld in
      [artikel 24z, derde lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel24z
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel161a
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: 24z
  - number: 161a.3
    text: |-
      De bedragen die krachtens [artikel 133, eerste lid, onderdeel b, van de wet][ref1] in rekening worden gebracht
      voor de uitvoering van taken door de inspecteur-generaal der mijnen en de bedragen die krachtens het eerste lid in
      rekening worden gebracht worden onderscheiden:


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel133
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel161a
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '133'
  - number: 161a.3.a
    text: |-
      per exploitant, eigenaar, verzoeker, aanvrager of houder van een zoekgebied aardwarmte, een startvergunning
      aardwarmte of een vervolgvergunning aardwarmte, of netbeheerder, waarbij een onderscheid kan worden gemaakt tussen
      actieve en niet-actieve exploitanten of eigenaren;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel161a
  - number: 161a.3.b
    text: per activiteit, en
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel161a
  - number: 161a.3.c
    text: |-
      afhankelijk van de locatie op land of op zee, de eigenschappen en de grootte van de productie-
      installatie, de niet-productie-installatie, de pijpleiding, het gastransportnet, bedoeld in
      [artikel 1, eerste lid, onderdeel d, van de Gaswet][ref1] of het mijnbouwwerk bedoeld voor het opsporen of winnen
      van aardwarmte.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel1
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel161a
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '1'
  - number: 161a.4
    text: |-
      Onze Minister brengt de bedragen in rekening en verzendt een beschikking daartoe aan de desbetreffende exploitant,
      eigenaar verzoeker, aanvrager of houder van een zoekgebied aardwarmte, een startvergunning aardwarmte of een
      vervolgvergunning aardwarmte, of netbeheerder.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel161a
  - number: '162.1'
    text: |-
      Van de aan een opsporingvergunning als bedoeld in [artikel 143, eerste lid, onderdeel b, van de wet][ref1]
      verbonden voorschriften vervallen die voorschriften die overeenkomen met het bepaalde in de volgende met een
      Romeinse cijfer aangeduide artikelen van het koninklijk besluit tot uitvoering van artikel 12 van de Mijnwet
      continentaal plat van 27 januari 1967 (Stb. 24):


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel143
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel162
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '143'
  - number: 162.1.a
    text: artikel II, uitgezonderd artikel 21, eerste lid,
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel162
  - number: 162.1.b
    text: artikel IX, en
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel162
  - number: 162.1.c
    text: artikel X.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel162
  - number: '162.2'
    text: |-
      Van de aan de in het eerste lid bedoelde opsporingvergunning verbonden voorschriften vervallen die voorschriften
      die overeenkomen met het bepaalde in de volgende met een Romeinse cijfer aangeduide artikelen van het koninklijk
      besluit tot uitvoering van artikel 12 van de Mijnwet continentaal plat van 6 februari 1976 (Stb. 102):
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel162
  - number: 162.2.a
    text: '[artikel II](onbekend), uitgezonderd [artikel 21, eerste lid](onbekend),'
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel162
  - number: 162.2.b
    text: '[artikel IX](onbekend),'
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel162
  - number: 162.2.c
    text: artikel X, en
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel162
  - number: 162.2.d
    text: artikel Xa.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel162
  - number: '162.3'
    text: |-
      Van de aan de in het eerste lid bedoelde opsporingvergunning verbonden
      voorschriften vervallen die voorschriften die overeenkomen met het bepaalde in
      [artikel 2.1 van het Besluit vergunningen koolwaterstoffen continentaal plat 1996][ref1] (Stb. 212).


      [ref1]: https://wetten.overheid.nl/BWBR0007962#Artikel2
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel162
    references:
      - id: ref1
        bwb_id: BWBR0007962
        artikel: '2'
  - number: '162.4'
    text: |-
      Van de aan de in het eerste lid bedoelde opsporingvergunning verbonden voorschriften vervallen die voorschriften
