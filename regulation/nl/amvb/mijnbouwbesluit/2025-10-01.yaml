  - number: 84i.2
    text: Bij ministeriële regeling worden nadere regels gesteld over de kennisgeving.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel84i
  - number: 84j.1
    text: 'Een kennisgeving als bedoeld in [artikel 45n van de wet](onbekend), bevat de volgende informatie:'
