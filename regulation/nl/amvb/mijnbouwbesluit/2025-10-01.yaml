  - number: '176.1'
    text: |-
      Gedurende vier maanden na het tijdstip van inwerkingtreding van dit besluit kan een mijnbouwwerk als bedoeld
      in [artikel 34][ref1] zonder een sluitingsplan als bedoeld in [artikel 39][ref2] geheel of gedeeltelijk
      buiten gebruik worden gesteld, met dien verstande dat gedurende die periode de [artikelen 136][ref3] en
      [138 tot en met 143 van het Mijnreglement 1964][ref4] van toepassing blijven op het geheel of gedeeltelijk buiten
      gebruik stellen van het mijnbouwwerk.


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0014394#Artikel39
      [ref3]: https://wetten.overheid.nl/BWBR0002474#Artikel136
      [ref4]: https://wetten.overheid.nl/BWBR0002474#Artikel138
