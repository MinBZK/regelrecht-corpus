  - number: '197'
    text: 'Dit besluit wordt aangehaald als: Mijnbouwbesluit.'
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel197
  - number: '198'
    text: |-
      Dit besluit treedt in werking op het tijdstip waarop de [Mijnbouwwet][ref1] in werking treedt, met dien verstande
      dat [artikel 4][ref2] in werking treedt op 1 januari van het kalenderjaar dat volgt op het kalenderjaar waarin die
      wet in werking is getreden.


      [ref1]: https://wetten.overheid.nl/BWBR0014168
      [ref2]: https://wetten.overheid.nl/BWBR0014394#Artikel4
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel198
