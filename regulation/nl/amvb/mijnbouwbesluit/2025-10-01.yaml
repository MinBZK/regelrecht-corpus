        paragraaf: '8.3'
      - id: ref3
        bwb_id: BWBR0014394
        artikel: '124'
        hoofdstuk: '8'
        paragraaf: '8.3'
  - number: '180'
    text: |-
      Een voor het tijdstip van de inwerkingtreding van dit besluit verleende ontheffing op grond van het
      [Lozingenbesluit bodembescherming][ref1] blijft na dat tijdstip van kracht, met inbegrip van alle daaraan verbonden
      voorschriften en beperkingen.


      [ref1]: https://wetten.overheid.nl/BWBR0009092
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel180
    references:
      - id: ref1
        bwb_id: BWBR0009092
  - number: '181'
    text: |-
      In afwijking van de [artikelen 146, eerste lid, derde volzin][ref1], voor zover de verschuldigdheid is
      ontstaan voor de inwerkingtreding van [de wet][ref2], en [155, tweede lid, van de wet][ref3] blijven op
      de heffing en invordering van een bonus, een oppervlakterecht, een cijns of een aandeel in de winst de
      [artikelen 72][ref4], voor zover daarbij [artikel 11, derde en vierde lid][ref5], [artikel 20, derde lid][ref6], en
      [hoofdstuk VA van de Algemene wet inzake rijksbelastingen][ref7] van overeenkomstige toepassing zijn verklaard, en
      [73 van de wet][ref8] buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel146
      [ref2]: https://wetten.overheid.nl/BWBR0014168
      [ref3]: https://wetten.overheid.nl/BWBR0014168#Artikel155
