      - id: ref3
        bwb_id: BWBR0014394
        artikel: '116'
        hoofdstuk: '7'
        paragraaf: '7.2'
  - number: '178'
    text: |-
      Een zekerheid die is gesteld voor het tijdstip van inwerkingtreding van dit besluit voor de nakoming van hetgeen
      verschuldigd zal worden, ingeval Onze Minister bestuursdwang toepast ter handhaving van de bij of krachtens de
      [Mijnwet continentaal plat][ref1] gestelde verplichtingen ten aanzien van het verwijderen of achterlaten, dan
      wel het na verwijderen slopen of hergebruiken van niet meer in gebruik zijnde mijnbouwinstallaties, berust op
      [artikel 47 van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002504
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel47
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel178
    references:
      - id: ref1
        bwb_id: BWBR0002504
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '47'
  - number: '179.1'
    text: |-
      De staat verstrekt het fonds, bedoeld in [artikel 135, eerste lid, van de wet][ref1] het eerste jaar na de
      inwerkingtreding van [de wet][ref2] alle geldelijke middelen die het fonds nodig heeft om aan zijn verplichtingen
      in dat jaar te kunnen voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel135
      [ref2]: https://wetten.overheid.nl/BWBR0014168
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel179
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '135'
      - id: ref2
        bwb_id: BWBR0014168
  - number: '179.2'
    text: |-
      Het fonds betaalt de geldelijke middelen, bedoeld in het eerste lid, terug aan de staat in het jaar dat volgt
      op het jaar van inwerkingtreding van [de wet][ref1], onmiddellijk nadat het de bijdragen heeft ontvangen die de
      mijnbouwondernemers op grond van de [artikelen 122][ref2] en [124][ref3], in het eerstgenoemde jaar verschuldigd
      zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0014168
      [ref2]: https://wetten.overheid.nl/BWBR0014394#Artikel122
      [ref3]: https://wetten.overheid.nl/BWBR0014394#Artikel124
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel179
    references:
