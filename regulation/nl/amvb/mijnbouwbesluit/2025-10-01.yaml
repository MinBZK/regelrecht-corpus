      Vergunningen als bedoeld in de [artikelen 1][ref1] en [28, tweede lid, van het Groevenreglement 1947][ref2] voor
      ontginning van kalksteen gelden als vergunningen als bedoeld in [artikel 146][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002025#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002025#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0014394#Artikel146
