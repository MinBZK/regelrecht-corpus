      een werkplan als bedoeld in [artikel 4][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0002474#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0002564#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0014168
