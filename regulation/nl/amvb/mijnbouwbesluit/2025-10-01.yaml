  - number: 84i.1.a
    text: |-
      een op basis van [artikel 2.42f van het Arbeidsomstandighedenbesluit][ref1] op te stellen veiligheids- en
      gezondheidsdocument voor een voorgenomen installatie;


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2
