    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '3'
  - number: 84d.1.b
    text: |-
      een op grond van [artikel 2.42f van het Arbeidsomstandighedenbesluit][ref1], op te stellen brandbestrijdingsplan;


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2
