        artikel: '93'
        hoofdstuk: '6'
        paragraaf: '6.1'
      - id: ref3
        bwb_id: BWBR0014394
        artikel: '105'
        hoofdstuk: '6'
        paragraaf: '6.5'
  - number: '107'
    text: |-
      Op een samenstel van een pijpleiding en een kabel zijn de [paragrafen 5.1.4][ref1], [5.2.3][ref2] en
      [6.1 tot en met 6.5][ref3] voor pijpleidingen, respectievelijk kabels, op land, respectievelijk in oppervlaktewater
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0014394#Hoofdstuk5
      [ref3]: https://wetten.overheid.nl/BWBR0014394#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0014394
        hoofdstuk: '5'
        paragraaf: 5.1.4
        afdeling: '5.1'
      - id: ref2
        bwb_id: BWBR0014394
        hoofdstuk: '5'
        paragraaf: 5.2.3
        afdeling: '5.2'
      - id: ref3
        bwb_id: BWBR0014394
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: '108.1'
    text: |-
      Degene in wiens opdracht verkenningsonderzoek wordt verricht, dan wel, bij afwezigheid van een opdrachtgever,
      degene die het verkenningsonderzoek verricht, dan wel een latere verkrijger van gegevens uit het
      verkenningsonderzoek, verstrekt Onze Minister de volgende gegevens:
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel108
  - number: 108.1.a
    text: de resultaten van verricht geofysisch onderzoek;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel108
  - number: 108.1.b
    text: de resultaten van verricht geochemisch onderzoek, of
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel108
  - number: 108.1.c
    text: de resultaten van verricht geologisch onderzoek.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel108
  - number: '108.2'
    text: |-
      Bij ministeriële regeling wordt bepaald welke gegevens, binnen welke termijn en in welke gevallen aan Onze Minister
      worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel108
  - number: '109.1'
    text: |-
      De uitvoerder verstrekt Onze Minister de volgende gegevens die bij het aanleggen, gebruiken, onderhouden, repareren
      en buiten gebruik stellen van het boorgat zijn verkregen:
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel109
  - number: 109.1.a
    text: het profiel van het boorgat;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel109
  - number: 109.1.b
    text: de resultaten van in een boorgat verrichte geofysische, geochemische en geologische metingen;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel109
  - number: 109.1.c
    text: |-
      de resultaten van verrichte geofysische, geochemische en geologische metingen aan materiaal afkomstig uit een
      boorgat, en
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel109
  - number: 109.1.d
    text: de resultaten van verrichte productie- of injectietesten.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel109
  - number: '109.2'
    text: De gegevens, bedoeld in het eerste lid, worden per boorgat verstrekt.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel109
  - number: '109.3'
    text: De uitvoerder verstrekt de gegevens, bedoeld in het eerste lid, binnen twaalf weken nadat deze zijn verkregen.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel109
  - number: '110.1'
    text: |-
      De uitvoerder verstrekt Onze Minister een representatief deel van uit een boorgat verkregen gesteentemonsters, die
      bij het aanleggen van een boorgat zijn verkregen. De uitvoerder verstrekt de monsters binnen twaalf weken nadat
      deze zijn verkregen.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel110
  - number: '110.2'
    text: |-
      De uitvoerder bewaart gedurende twaalf weken een representatief deel van uit een boorgat verkregen vloeistof-
      en gasmonsters, die bij het opsporen van delfstoffen zijn verkregen. Op verzoek van Onze Minister verstrekt de
      uitvoerder een representatief deel van de monsters.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel110
  - number: '110.3'
    text: Onze Minister kan op verzoek van de uitvoerder ontheffing verlenen van de in het eerste lid genoemde verplichting.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel110
  - number: '111.1'
    text: |-
      De uitvoerder verstrekt Onze Minister per kalendermaand de volgende gegevens die bij het winnen van delfstoffen
      zijn verkregen:
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel111
  - number: 111.1.a
    text: 'per boorgat: de gewonnen hoeveelheden en soorten delfstoffen;'
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel111
  - number: 111.1.b
    text: 'per vergunningsgebied: de hoeveelheden en soorten afgevoerde delfstoffen;'
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel111
  - number: 111.1.c
    text: 'per mijnbouwwerk: de hoeveelheden en soorten verbruikte delfstoffen;'
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel111
  - number: 111.1.d
    text: 'per mijnbouwwerk: de hoeveelheden en soorten vernietigde delfstoffen;'
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel111
  - number: 111.1.e
    text: 'per boorgat: de gewonnen hoeveelheden andere stoffen, dan delfstoffen;'
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel111
  - number: 111.1.f
    text: 'per boorgat: de ten behoeve van de winning in de ondergrond gebrachte hoeveelheden stoffen.'
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel111
  - number: '111.2'
    text: |-
      De uitvoerder verstrekt de gegevens, bedoeld in het eerste lid, binnen vier weken na afloop van de betreffende
      kalendermaand.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel111
  - number: '112.1'
    text: |-
      De uitvoerder verstrekt Onze Minister per kalendermaand de volgende gegevens die bij het ondergronds opslaan van
      stoffen zijn verkregen:
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel112
  - number: 112.1.a
    text: 'per voorkomen: de hoeveelheden en soorten stoffen die zijn opgeslagen;'
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel112
  - number: 112.1.b
    text: 'per voorkomen: de hoeveelheden en soorten stoffen die zijn teruggehaald en afgevoerd;'
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel112
  - number: 112.1.c
    text: 'per mijnbouwwerk: de hoeveelheden en soorten stoffen die zijn teruggehaald en verbruikt, en'
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel112
  - number: 112.1.d
    text: 'per mijnbouwwerk: de hoeveelheden en soorten stoffen die zijn teruggehaald en vernietigd.'
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel112
  - number: '112.2'
    text: |-
      De uitvoerder verstrekt de gegevens, bedoeld in het eerste lid, binnen vier weken na afloop van de desbetreffende
      kalendermaand.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel112
  - number: '113.1'
    text: |-
      De uitvoerder verstrekt Onze Minister per voorkomen, waarin koolwaterstoffen zijn aangetroffen, jaarlijks voor
      1 maart de volgende gegevens:
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel113
  - number: 113.1.a
    text: de door de uitvoerder voor het voorkomen gebezigde naam;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel113
  - number: 113.1.b
    text: de opsporings- of winningsvergunning of opsporings- of winningsvergunningen waaronder het voorkomen is gelegen;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel113
  - number: 113.1.c
    text: een structuurkaart;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel113
  - number: 113.1.d
    text: het vermoedelijke jaar van aanvang van de winning, indien nog geen winning plaatsvindt;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel113
  - number: 113.1.e
    text: de hoeveelheid aangetoonde winbare delfstoffen per 1 januari van het verslagjaar;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel113
  - number: 113.1.f
    text: de verwachte jaarlijks te winnen hoeveelheden delfstoffen, tot het moment waarop de winning wordt beëindigd;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel113
  - number: 113.1.g
    text: eventueel gebruik van het voorkomen voor opslag;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel113
  - number: 113.1.h
    text: de reservoirdruk, voor zover bekend;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel113
  - number: 113.1.i
    text: het feitelijk gebruik van de in het voorkomen aanwezige boorgaten, en
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel113
  - number: 113.1.j
    text: |-
      de gegevens, bedoeld in [artikel 24, eerste lid, onderdelen b, c en k][ref1], voor zover de gegevens wezenlijk
      afwijken van het ingediende winningsplan.


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel24
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel113
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: '24'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '113.2'
    text: |-
      De uitvoerder verstrekt Onze Minister daarnaast jaarlijks de verwachte hoeveelheden winbare delfstoffen per
      vermoedelijk voorkomen in het vergunningsgebied dat niet door middel van opsporing is aangetoond, alsmede de
      daarbij behorende structuurkaarten.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel113
  - number: '114.1'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent de gegevens, bedoeld in de
      [artikelen 108][ref1] en [110][ref2] alsmede de wijze waarop deze worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel108
      [ref2]: https://wetten.overheid.nl/BWBR0014394#Artikel110
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel114
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: '108'
        hoofdstuk: '7'
        paragraaf: '7.1'
      - id: ref2
        bwb_id: BWBR0014394
        artikel: '110'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: '114.2'
    text: |-
      Bij ministeriële regeling worden nadere regels worden gesteld omtrent de gegevens, bedoeld in de
      [artikelen 109][ref1] en [111 tot en met 113][ref2] alsmede de wijze waarop deze worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel109
      [ref2]: https://wetten.overheid.nl/BWBR0014394#Artikel111
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel114
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: '109'
        hoofdstuk: '7'
        paragraaf: '7.1'
      - id: ref2
        bwb_id: BWBR0014394
        artikel: '111'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: '115.1'
    text: |-
      De in [artikel 123, tweede lid, van de wet][ref1] bedoelde instellingen beheren de op grond van [](onbekend)
      [paragraaf 7.1.][ref2] verstrekte gegevens zorgvuldig. De instellingen zijn verplicht de gegevens in goede,
      geordende en toegankelijke staat te brengen en te bewaren.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel123
      [ref2]: https://wetten.overheid.nl/BWBR0014394#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel115
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '123'
      - id: ref2
        bwb_id: BWBR0014394
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: '115.2'
    text: Bij ministeriële regeling kunnen omtrent het eerste lid nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel115
  - number: '116.1'
    text: |-
      De gegevens, bedoeld in de [artikelen 111][ref1], [112][ref2] en [113, eerste lid, onderdelen a en b][ref3], zijn
      openbaar, zodra vier weken zijn verstreken na het tijdstip waarop de gegevens zijn verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel111
      [ref2]: https://wetten.overheid.nl/BWBR0014394#Artikel112
      [ref3]: https://wetten.overheid.nl/BWBR0014394#Artikel113
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel116
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: '111'
        hoofdstuk: '7'
        paragraaf: '7.1'
      - id: ref2
        bwb_id: BWBR0014394
        artikel: '112'
        hoofdstuk: '7'
        paragraaf: '7.1'
      - id: ref3
        bwb_id: BWBR0014394
        artikel: '113'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: '116.2'
    text: |-
      Op de gegevens en de monsters, bedoeld in de [artikelen 108 tot en met 110][ref1], is
      [artikel 5.1, eerste lid, onderdeel c, van de Wet open overheid][ref2] van toepassing, totdat vijf jaren zijn
      verstreken na het tijdstip waarop de gegevens zijn verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel108
      [ref2]: https://wetten.overheid.nl/BWBR0045754#Artikel5
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel116
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: '108'
        hoofdstuk: '7'
        paragraaf: '7.1'
      - id: ref2
        bwb_id: BWBR0045754
        artikel: '5'
  - number: '116.3'
    text: |-
      In afwijking van het tweede lid is [artikel 5.1, eerste lid, onderdeel c, van de Wet open overheid][ref1] van
      toepassing op de gegevens, bedoeld in [artikel 108, eerste lid, onderdeel a][ref2], totdat een termijn van tien
      jaren is verstreken, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0045754#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0014394#Artikel108
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel116
    references:
      - id: ref1
        bwb_id: BWBR0045754
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0014394
        artikel: '108'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: 116.3.a
    text: |-
      het verkenningsonderzoek niet is uitgevoerd door of in opdracht van een uitvoerder die voor het desbetreffende
      gebied over een vergunning beschikt om delfstoffen op te sporen, te winnen of op te slaan en
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel116
  - number: 116.3.b
    text: |-
      de resultaten gedurende de termijn van tien jaren, bedoeld in de aanhef, tegen een redelijke vergoeding voor
      eenieder ter beschikking worden gesteld.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel116
  - number: '116.4'
    text: |-
      Op de gegevens, bedoeld in [artikel 113, eerste lid, onderdelen c tot en met j][ref1], is
      [artikel 5.1, eerste lid, onderdeel c, van de Wet open overheid][ref2] van toepassing, totdat tien jaren zijn
      verstreken na het tijdstip waarop de gegevens zijn verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel113
      [ref2]: https://wetten.overheid.nl/BWBR0045754#Artikel5
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel116
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: '113'
        hoofdstuk: '7'
        paragraaf: '7.1'
      - id: ref2
        bwb_id: BWBR0045754
        artikel: '5'
  - number: '117'
    text: |-
      Onze Minister kan, zolang de termijnen van [artikel 116][ref1] niet zijn verlopen, de in dat artikel bedoelde
      gegevens ter beschikking stellen aan de Mijnraad en de in [artikel 81, onderdeel a, van de wet][ref2] bedoelde
      vennootschap, voor zover deze gegevens worden gebruikt voor de volgende doeleinden:


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel116
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel81
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel117
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: '116'
        hoofdstuk: '7'
        paragraaf: '7.2'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '81'
  - number: 117.a
    text: |-
      het adviseren van Onze Minister inzake verkenningsonderzoek, het opsporen of winnen van delfstoffen of aardwarmte
      en het opslaan van stoffen in de ondergrond;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel117
  - number: 117.b
    text: |-
      het ten behoeve van Onze Minister maken van reserveramingen en prognoses van delfstoffen, aardwarmte en
      opslagpotentieel van de ondergrond;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel117
  - number: 117.c
    text: het in opdracht van Onze Minister systematisch karteren van de ondergrond.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel117
  - number: '118.1'
    text: |-
      De gegevens, bedoeld in [artikel 116][ref1], worden na afloop van de aldaar genoemde termijnen ter inzage gelegd op
      de plaats van beheer.


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel116
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel118
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: '116'
        hoofdstuk: '7'
        paragraaf: '7.2'
  - number: '118.2'
    text: |-
      Onze Minister verstrekt op verzoek tegen kostprijs aan derden afschrift van de gegevens, bedoeld in het eerste lid.
      Monsters worden uitsluitend ter inzage gelegd.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel118
  - number: '118.3'
    text: |-
      Bij de vaststelling van de kostprijs worden niet de kosten van inzameling, verwerving en kwaliteitsbehoud
      verdisconteerd.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel118
  - number: '119.1'
    text: |-
      De [artikelen 109 tot en met 111][ref1] en [115 tot en met 118][ref2] zijn van overeenkomstige toepassing in geval
      van opsporing of winning van aardwarmte, met dien verstande dat de houder van de startvergunning aardwarmte of
      vervolgvergunning aardwarmte de persoon is die de gegevens, bedoeld in de artikelen 109, 110 en 111, verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel109
      [ref2]: https://wetten.overheid.nl/BWBR0014394#Artikel115
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel119
    references:
      - id: ref1
