  - number: '177'
    text: |-
      Gegevens, bescheiden en monsters als bedoeld in de [artikelen 108 tot en met 110][ref1], waarop
      [artikel 10, eerste lid, onderdeel c, van de Wet openbaarheid van bestuur][ref2] van toepassing is, en aan
      Onze Minister zijn verstrekt voor het tijdstip van inwerkingtreding van dit besluit, verliezen in afwijking van
      [artikel 116, tweede lid][ref3], hun vertrouwelijk karakter niet dan nadat tien jaren zijn verstreken met ingang
      van het tijdstip waarop de uitvoerder de betreffende gegevens, bescheiden en monsters of degene die de bedoelde
      onderwerpen heeft verstrekt, heeft verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel108
      [ref2]: https://wetten.overheid.nl/BWBR0005252#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0014394#Artikel116
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel177
