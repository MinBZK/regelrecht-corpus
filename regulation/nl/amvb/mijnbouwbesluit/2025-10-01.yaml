    text: |-
      inspecteur-generaal der mijnen: inspecteur-generaal der mijnen als bedoeld in
      [artikel 126, tweede lid, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel126
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '126'
  - number: 1.g
    text: |-
      veiligheids- en milieukritische elementen: onderdelen van een installatie, met inbegrip van computerprogramma’s,
      die tot doel hebben zware ongevallen te voorkomen of de gevolgen ervan te beperken, of waarvan het uitvallen een
      zwaar ongeval zou kunnen veroorzaken of substantieel zou kunnen bijdragen tot het ontstaan van een zwaar ongeval;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel1
  - number: 1.g
    text: |-
      brijn: water met een verhoogde mineralenconcentratie dat overblijft na de onttrekking van water aan gewonnen brak
      grondwater;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel1
  - number: 1.h
    text: |-
      Kustwacht: een door Onze Minister van Infrastructuur en Waterstaat en Onze Minister van Defensie opgerichte
      organisatie die door deze ministers als Kustwacht is aangeduid;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel1
  - number: 1.i
    text: |-
      Kustwachtcentrum: het voor de uitvoering van kustwachttaken opgerichte coördinatiecentrum en maritiem
      informatieknooppunt ten behoeve van het doel van de Kustwacht;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel1
  - number: 1.j
    text: 'stimuleren: het bewerken van een voorkomen om de productiviteit of injectiviteit te verbeteren.'
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel1
  - number: '2.1'
    text: |-
      Als mijnbouwwerk als bedoeld in [artikel 1, onderdeel n, van de wet][ref1] worden aangewezen:


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel1
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '1'
  - number: 2.1.a
    text: |-
      boorgaten, bestemd voor de opsporing en winning van delfstoffen of aardwarmte of voor de opslag van stoffen, voor
      zover deze geen onderdeel uitmaken van de werken, genoemd in de onderdelen b tot en met e, en niet geheel buiten
      gebruik zijn gesteld;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel2
  - number: 2.1.b
    text: werken voor het opsporen of winnen van delfstoffen of aardwarmte;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel2
  - number: 2.1.c
    text: 'werken voor het opslaan van stoffen en het terughalen van opgeslagen stoffen met uitzondering van:'
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel2
  - number: 2.1.c.1°
    text: water ten behoeve van het opslaan van warmte of koude op een diepte van ten hoogste van 500 meter;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel2
  - number: 2.1.c.2°
    text: |-
      water ten behoeve van openbare drinkwatervoorziening als bedoeld in de [Drinkwaterwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0026338
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0026338
  - number: 2.1.c.3°
    text: |-
      grondwater en brijn dat zonder toevoeging van stoffen wordt teruggevoerd in hetzelfde gebied waarin het is gewonnen
      naar een diepte van ten hoogste 500 meter;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel2
  - number: 2.1.d
    text: werken voor het bewerken van gewonnen delfstoffen of aardwarmte voor het punt van aflevering aan de afnemer;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel2
  - number: 2.1.e
    text: |-
      werken voor het bewerken van stoffen voorafgaande aan de opslag ervan dan wel voor het bewerken van opgeslagen en
      teruggehaalde stoffen voor het punt van aflevering aan de afnemer;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel2
  - number: 2.1.f
    text: |-
      werken voor het meten en registreren van in de onderdelen d en e genoemde stoffen of aardwarmte voor het punt van
      aflevering aan de afnemer;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel2
  - number: 2.1.g
    text: |-
      werken voor het bevorderen van het transport van in de onderdelen d en e genoemde stoffen of aardwarmte voor het
      punt van aflevering aan de afnemer;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel2
  - number: 2.1.h
    text: |-
      werken voor het verblijf van bij mijnbouwactiviteiten betrokken personen die verankerd zijn in of aanwezig zijn
      boven de bodem van oppervlaktewater.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel2
  - number: '2.2'
    text: |-
      Indien boorgaten of werken als bedoeld in het eerste lid, onderdelen a tot en met h, fysiek met elkaar zijn
      verbonden, wordt het geheel als een mijnbouwwerk beschouwd.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel2
  - number: '3.1'
    text: Bij het verrichten van mijnbouwactiviteiten worden maatregelen genomen ter voorkoming van schade.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel3
  - number: '3.2'
    text: |-
      Indien bij het verrichten van mijnbouwactiviteiten ernstige schade dreigt te ontstaan of is ontstaan, wordt hiervan
      onmiddellijk mededeling gedaan aan de inspecteur-generaal der mijnen.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel3
  - number: '4.1'
    text: |-
      De uitvoerder of de uitvoerder aardwarmte stelt een werkplan vast waarin alle in een vergunningsgebied uit te
      voeren mijnbouwactiviteiten staan vermeld.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel4
  - number: '4.2'
    text: |-
      Het werkplan is een jaarlijks voortschrijdend vijfjarenplan. De uitvoerder of de uitvoerder aardwarmte dient het
      plan in bij de inspecteur-generaal der mijnen binnen vier weken na verlening van een vergunning als bedoeld in
      [artikel 6][ref1], [24b][ref2] of [25 van de wet][ref3] en vervolgens jaarlijks voor 1 november van het jaar,
      voorafgaand aan het eerste kalenderjaar waarop het plan betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel24b
      [ref3]: https://wetten.overheid.nl/BWBR0014168#Artikel25
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: 24b
      - id: ref3
        bwb_id: BWBR0014168
        artikel: '25'
  - number: '4.3'
    text: |-
      Ingrijpende afwijkingen van de in het eerste kalenderjaar opgenomen mijnbouwactiviteiten waarop het desbetreffende
      werkplan betrekking heeft, worden tenminste vier weken voor de verrichting van de desbetreffende activiteit ter
      kennis gebracht van de inspecteur-generaal der mijnen.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel4
  - number: '4.4'
    text: Bij ministeriële regeling worden nadere regels gesteld omtrent de inhoud van het werkplan.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel4
  - number: '5'
    text: |-
      De bescheiden en de gegevens, bedoeld bij of krachtens dit besluit, worden door een uitvoerder, een houder van
      een toewijzing zoekgebied aardwarmte, een startvergunning aardwarmte of een vervolgvergunning aardwarmte, een
      onderzoeker als bedoeld in [artikel 9][ref1], een beheerder als bedoeld in [artikel 92, onderdeel d][ref2], en
      een vergunninghouder als bedoeld in de [artikelen 152][ref3] en [157][ref4] op deugdelijke wijze opgesteld en
      bijgehouden. Zij worden, voor zover bij of krachtens dit besluit niet anders is bepaald, gedurende ten minste een
      jaar bewaard.


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0014394#Artikel92
      [ref3]: https://wetten.overheid.nl/BWBR0014394#Artikel152
      [ref4]: https://wetten.overheid.nl/BWBR0014394#Artikel157
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0014394
        artikel: '92'
        hoofdstuk: '6'
        paragraaf: '6.1'
      - id: ref3
        bwb_id: BWBR0014394
        artikel: '152'
        hoofdstuk: '10'
        paragraaf: '10.3'
      - id: ref4
        bwb_id: BWBR0014394
        artikel: '157'
        hoofdstuk: '10'
        paragraaf: '10.4'
  - number: '6.1'
    text: |-
      Tot de in [artikel 130 van de wet][ref1] bedoelde gevallen en wijze van vervoer worden gerekend:


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel130
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '130'
  - number: 6.1.a
    text: vervoer dat plaatsvindt tussen 07.00 en 20.00 uur;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel6
  - number: 6.1.b
    text: vervoer met een helikopter, met dien verstande dat ten hoogste aanspraak wordt gemaakt op vier plaatsen.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel6
  - number: '6.2'
    text: |-
      Indien bij het verrichten van mijnbouwactiviteiten ernstige schade dreigt te ontstaan of is ontstaan, kan op
      aanwijzing van de inspecteur-generaal der mijnen het in het eerste lid, onderdeel a, bedoelde vervoer plaatsvinden
      tussen 0.00 uur en 24.00 uur.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel6
  - number: '6.3'
    text: |-
      De houder van een vergunning als bedoeld in [artikel 6][ref1] of [25 van de wet][ref2] dan wel degene die
      een verkenningsonderzoek uitvoert of voornemens is uit te voeren, voorziet ambtenaren als bedoeld in de
      [artikelen 129][ref3] en [131 van de wet][ref4], in de bij ministeriële regeling omschreven gevallen van transport,
      een verblijfplaats, maaltijden en andere benodigdheden.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0014168#Artikel129
      [ref4]: https://wetten.overheid.nl/BWBR0014168#Artikel131
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '25'
      - id: ref3
        bwb_id: BWBR0014168
        artikel: '129'
      - id: ref4
        bwb_id: BWBR0014168
        artikel: '131'
  - number: '7.1'
    text: |-
      Bij ministeriële regeling worden regels gesteld omtrent de wijze waarop een melding of een aanvraag om een
      vergunning, ontheffing of instemming bij of krachtens de wet geschiedt en omtrent de gegevens en de bescheiden,
      welke daarbij worden overgelegd.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel7
  - number: '7.2'
    text: |-
      Als na een melding of het verlenen van een vergunning, ontheffing, of instemming wijzigingen optreden in de
      gegevens en bescheiden die zijn overgelegd, stelt degene die de melding heeft gedaan, respectievelijk de houder van
      de vergunning, ontheffing, of instemming, degene aan wie de gegevens of bescheiden zijn overgelegd, in kennis van
      de wijzigingen.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel7
  - number: '7.3'
    text: 'Een ontheffing of vergunning kan worden gewijzigd of ingetrokken, indien:'
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel7
  - number: 7.3.a
    text: |-
      de bij de aanvraag verstrekte gegevens of bescheiden zodanig onjuist of onvolledig blijken, dat op de aanvraag een
      andere beslissing zou zijn genomen, als bij de beoordeling daarvan de juiste omstandigheden volledig bekend waren
      geweest,
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel7
  - number: 7.3.b
    text: |-
      de omstandigheden op grond waarvan de ontheffing of vergunning werd verleend, zich zodanig hebben gewijzigd, dat
      op de aanvraag een andere beslissing zou zijn genomen, als bij de beoordeling daarvan de gewijzigde omstandigheden
      aanwezig waren geweest,
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel7
  - number: 7.3.c
    text: de ontheffing of vergunning vanwege het risico op schade niet gehandhaafd kan blijven, of
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel7
  - number: 7.3.d
    text: aan de ontheffing of vergunning verbonden beperkingen of voorschriften niet worden nageleefd.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel7
  - number: '7.4'
    text: |-
      Een ontheffing of vergunning kan op verzoek van de houder worden gewijzigd of ingetrokken voor zover het gevaar van
      risico op schade zich daartegen niet verzet.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel7
  - number: '7.5'
    text: Dit artikel is van overeenkomstige toepassing op andere bij of krachtens dit besluit te nemen besluiten.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel7
  - number: '8.1'
    text: |-
      Indien bij mijnbouwactiviteiten op het continentaal plat een archeologisch monument als bedoeld
      in [artikel 1.1 van de Erfgoedwet][ref1] of een vermoedelijk archeologisch monument wordt gevonden
      of een archeologische vondst als bedoeld in artikel 1.1 van de Erfgoedwet wordt aangetroffen,
      is [artikel 5.10 van de Erfgoedwet][ref2] van toepassing en zijn de [artikelen 19.9][ref3] en
      [15.1, eerste lid, aanhef en onder k, van de Omgevingswet][ref4], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0037521#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0037521#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0037885#Artikel19
      [ref4]: https://wetten.overheid.nl/BWBR0037885#Artikel15
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0037521
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0037521
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0037885
        artikel: '19'
      - id: ref4
        bwb_id: BWBR0037885
        artikel: '15'
  - number: '8.2'
    text: |-
      De uitvoerder onderscheidenlijk de beheerder stelt de onderzoeksgegevens, bedoeld in [artikel 48][ref1],
      onderscheidenlijk de gegevens voortvloeiend uit onderzoek naar de aanleg en ligging van een pijpleiding als
      bedoeld in [artikel 92, onderdeel a][ref2], ter beschikking aan Onze Minister van Onderwijs, Cultuur en Wetenschap,
      voor zover die gegevens informatie kunnen verschaffen over de aanwezigheid van archeologische monumenten dan wel
      vermoedelijke archeologische monumenten in of op de bodem van de territoriale zee of het continentaal plat.


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0014394#Artikel92
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: '48'
        hoofdstuk: '5'
        paragraaf: 5.2.2
        afdeling: '5.2'
      - id: ref2
        bwb_id: BWBR0014394
        artikel: '92'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: '9.1'
    text: |-
      Dit hoofdstuk is van toepassing op verkenningsonderzoek dat plaatsvindt met gebruikmaking van kunstmatig opgewekte
      trillingen.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel9
  - number: '9.2'
    text: |-
      In dit hoofdstuk wordt verstaan onder onderzoeker: degene in wiens opdracht het verkenningsonderzoek wordt
      verricht, dan wel, bij afwezigheid van een opdrachtgever, degene die het verkenningsonderzoek verricht.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel9
  - number: '10.1'
    text: |-
      Tenminste vier weken voor de aanvang van een verkenningsonderzoek op land, verstrekt de onderzoeker aan de
      inspecteur-generaal der mijnen:
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel10
  - number: 10.1.a
    text: gegevens omtrent de wijze waarop het verkenningsonderzoek zal worden verricht;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel10
  - number: 10.1.b
    text: |-
      een kaart waarop is aangegeven het gebied waarin en de lijnen waarlangs het verkenningsonderzoek zal worden
      verricht en de naam van de opdrachtnemer;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel10
  - number: 10.1.c
    text: de data waarop het verkenningsonderzoek zal worden verricht.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel10
  - number: '10.2'
    text: |-
      De onderzoeker doet de inspecteur-generaal der mijnen onmiddellijk mededeling van wijzigingen in de in het eerste
      lid bedoelde gegevens.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel10
  - number: '11'
    text: Deze paragraaf is van toepassing op een verkenningsonderzoek in oppervlaktewater.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel11
  - number: '12.1'
    text: |-
      Bij het verrichten van een verkenningsonderzoek worden maatregelen genomen ter voorkoming van storende
      geluidseffecten op zeezoogdieren.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel12
  - number: '12.2'
    text: Bij ministeriële regeling worden regels gesteld omtrent de in het eerste lid bedoelde maatregelen.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel12
  - number: '21'
    text: Het is verboden in oppervlaktewater ontplofbare stoffen te gebruiken voor verkenningsonderzoek.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel21
  - number: '22.1'
    text: |-
      Het is verboden zonder vergunning van Onze Minister met gebruik van ontplofbare stoffen verkenningsonderzoek te
      verrichten anders dan in oppervlaktewater.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel22
  - number: '22.2'
    text: |-
      Een vergunning kan onder beperkingen worden verleend en daaraan kunnen voorschriften worden verbonden. Die
      voorschriften kunnen in ieder geval betrekking hebben op: a. aard, aanduiding en hoeveelheid van de te gebruiken
      ontplofbare stoffen; b. wijze van gebruik van de onder a bedoelde stoffen; c. maatregelen die worden genomen ter
      voorkoming van schade, en d. de periode waarin gebruik kan worden gemaakt van de onder a bedoelde stoffen.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel22
  - number: '22.3'
    text: Een vergunning wordt slechts geweigerd in het belang van het milieu of de veiligheid.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel22
  - number: '23.1'
    text: 'De onderzoeker draagt ervoor zorg dat een verkenningsonderzoek waarbij ontplofbare stoffen worden gebruikt:'
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel23
  - number: 23.1.a
    text: op zodanige wijze wordt verricht dat de veiligheid van derden niet in gevaar wordt gebracht;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel23
  - number: 23.1.b
    text: op zodanige wijze wordt verricht dat schade aan het milieu zoveel mogelijk wordt voorkomen dan wel beperkt;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel23
  - number: 23.1.c
    text: |-
      in voorkomend geval tijdig voor de aanvang ervan wordt aangemeld bij burgemeester en wethouders van de gemeente
      waarin het onderzoek zal plaatsvinden;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel23
  - number: 23.1.d
    text: |-
      op zodanige afstand tot gebouwen, kunstwerken, openbare werken en andere zaken wordt verricht dat schade daaraan
      wordt voorkomen, en
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel23
  - number: 23.1.e
    text: de niet tot ontploffing gekomen stoffen onschadelijk worden gemaakt of afgevoerd.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel23
  - number: '23.2'
    text: Bij ministeriële regeling worden nadere regels gesteld omtrent het gebruik van ontplofbare stoffen.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel23
  - number: '24.1'
    text: |-
      Het winningsplan, bedoeld in [artikel 34, eerste lid, van de wet][ref1] voor de winning van koolwaterstoffen bevat:


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel34
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '34'
  - number: 24.1.a
    text: |-
      een beschrijving van de verwachte hoeveelheid en de samenstelling van de aanwezige koolwaterstoffen, onderverdeeld
      naar reservoirlaag en reservoircompartiment;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel24
  - number: 24.1.b
    text: |-
      een opgaaf van de gegevens met betrekking tot de structuur van het voorkomen, onderverdeeld naar reservoirlaag en
      reservoircompartiment, met bijbehorende geologische, geofysische en petrofysische studies en de daarbij gehanteerde
      onzekerheidsanalyses;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel24
  - number: 24.1.c
    text: |-
      een beschrijving van een wijze van winning die niet in strijd is met de bij of krachtens dit besluit geldende
      wettelijke voorschriften inzake winning van koolwaterstoffen;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel24
  - number: 24.1.d
    text: een beschrijving van het mijnbouwwerk en de ligging ervan;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel24
  - number: 24.1.e
    text: een opgaaf van het aantal boorgaten dat bij de winning wordt gebruikt;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel24
  - number: 24.1.f
    text: een opgaaf van de volgorde en het tijdsbestek van het maken van de boorgaten;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel24
  - number: 24.1.g
    text: een opgaaf van de ligging, lengte en diameter van de verbuizing van de boorgaten;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel24
  - number: 24.1.h
    text: een opgaaf van de plaats en wijze waarop de koolwaterstoffen in de verbuizing treden;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel24
  - number: 24.1.i
    text: |-
      een opgaaf van de samenstelling en hoeveelheden van de stoffen, die jaarlijks onvermijdelijk bij de winning van
      koolwaterstoffen meekomen;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel24
  - number: 24.1.j
    text: |-
      een opgaaf van de hoeveelheden gewonnen koolwaterstoffen die jaarlijks bij de winning wordt gebruikt, afgeblazen
      of afgefakkeld;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel24
  - number: 24.1.k
    text: |-
      een opgaaf van de samenstelling en hoeveelheden delfstoffen en andere stoffen die jaarlijks bij de winning in de
      ondergrond worden teruggebracht;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel24
  - number: 24.1.l
    text: |-
      een opgaaf van de jaarlijkse kosten van de winning, onderverdeeld in kosten voor investeringen, onderhoud,
      bedrijfvoering, en de kosten van het verlaten en verwijderen van mijnbouwwerken;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel24
  - number: 24.1.m
    text: een kaart met daarop de contouren van de verwachte uiteindelijke mate van bodemdaling;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel24
  - number: 24.1.n
    text: een overzicht met het verloop van de verwachte mate van bodemdaling in de tijd;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel24
  - number: 24.1.o
    text: een opgaaf van de onzekerheid omtrent de verwachte mate van bodemdaling als bedoeld in de onderdelen m en n;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel24
  - number: 24.1.p
    text: een risico-analyse omtrent bodemtrillingen als gevolg van de winning;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel24
  - number: 24.1.q
    text: een beschrijving van de mogelijke omvang en verwachte aard van de schade door bodembeweging;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel24
  - number: 24.1.r
    text: een beschrijving van de maatregelen die worden genomen om bodembeweging te voorkomen of te beperken, en
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel24
  - number: 24.1.s
    text: een beschrijving van de maatregelen die worden genomen om schade door bodembeweging te voorkomen of te beperken.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel24
  - number: '24.2'
    text: |-
      In het winningsplan, bedoeld in het eerste lid, wordt per onderdeel toegelicht welke overwegingen bij de gemaakte
      keuze van belang zijn geweest, voor zover relevant.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel24
  - number: '25.1'
    text: |-
      Het winningsplan, bedoeld in [artikel 34, eerste lid, van de wet][ref1], voor de winning van zout bevat:


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel34
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '34'
  - number: 25.1.a
    text: |-
      een beschrijving van de structuur van de zoutlaag waaruit gewonnen wordt en de ligging van de zoutlaag ten
      opzichte van andere aardlagen, met bijbehorende geologische, geofysische en rheomorfologische studies en de daarbij
      gehanteerde onzekerheidsanalyses;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel25
  - number: 25.1.b
    text: een opgaaf van de verwachte hoeveelheid te winnen pekel en zout en de samenstelling van het te winnen zout;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel25
  - number: 25.1.c
    text: een beschrijving van de ligging en de vorm van de holruimte tijdens en na de winning;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel25
  - number: 25.1.d
    text: een opgaaf van de gesteentemechanische berekeningen van de stabiliteit van de holruimte tijdens en na de winning;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel25
  - number: 25.1.e
    text: een opgaaf van de hoeveelheden stoffen die jaarlijks bij de winning worden geïnjecteerd, en
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel25
  - number: 25.1.f
    text: een beschrijving van de wijze waarop de holruimte na beëindiging van de winning buiten gebruik wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel25
  - number: '25.2'
    text: |-
      [Artikel 24, eerste lid, onderdelen c tot en met g, en l tot en met s][ref1], en [artikel 24, tweede lid][ref2],
      zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0014394#Artikel24
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: '24'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0014394
        artikel: '24'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '26.1'
    text: |-
      Voor het opslaan van stoffen als bedoeld in [artikel 39, eerste lid, van de wet][ref1] bevat een desbetreffend
      plan:


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel39
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '39'
  - number: 26.1.a
    text: een beschrijving van de hoeveelheid en de samenstelling van de stoffen die worden opgeslagen;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel26
  - number: 26.1.b
    text: |-
      een opgaaf van de gegevens met betrekking tot de structuur van het voorkomen en de ligging van het voorkomen ten
      opzichte van andere aardlagen, met bijbehorende geologische, geofysische en petrofysische studies en de daarbij
      gehanteerde onzekerheidsanalyses;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel26
  - number: 26.1.c
    text: een opgaaf van de stoffen die worden gebruikt bij het in de ondergrond brengen van de stoffen;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel26
  - number: 26.1.d
    text: |-
      een inventarisatie van de risico's ten aanzien van de verspreiding van de stoffen die in de ondergrond worden
      opgeslagen, het optreden van chemische processen in de ondergrond en de aantasting van de in de ondergrond
      aanwezige reservoirs met delfstoffen of de samenstelling van deze delfstoffen;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel26
  - number: 26.1.e
    text: een inventarisatie van maatregelen die worden getroffen om de risico's, bedoeld in onderdeel d, te voorkomen;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel26
  - number: 26.1.f
    text: een beschrijving van de wijze waarop het voorkomen na beëindiging van de opslag wordt achtergelaten, en
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel26
  - number: 26.1.g
    text: een risico-analyse omtrent bodembeweging als gevolg van de opslag.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel26
  - number: '26.2'
    text: |-
      [Artikel 24, eerste lid, onderdelen d tot en met g, en onderdelen l, q, r en s][ref1], alsmede
      [artikel 24, tweede lid][ref2], zijn van overeenkomstige toepassing, met dien verstande dat het
      [eerste lid, onderdeel g, en de onderdelen q, r en s][ref3] niet van toepassing zijn op voorkomens die gelegen zijn
      aan de zeezijde van de lijn die in de [bijlage bij de wet](onbekend) is vastgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0014394#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0014394#Artikel24
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: '24'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0014394
        artikel: '24'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref3
        bwb_id: BWBR0014394
        artikel: '24'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '26.3'
    text: |-
      Dit artikel is niet van toepassing indien [§ 3.5][ref1] van dit besluit van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0014394
        hoofdstuk: '3'
        paragraaf: '3.5'
  - number: '27'
    text: |-
      In geval de opslag van stoffen van tijdelijke aard is, bevat het plan voor het opslaan van stoffen als bedoeld in
      [artikel 26][ref1], tevens:


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel26
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: '26'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 27.a
    text: |-
      beschrijving van de wijze waarop de stoffen die zijn opgeslagen, worden teruggehaald en van de stoffen die daarbij
      gebruikt worden, en
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel27
  - number: 27.b
    text: |-
      opgaaf van de samenstelling en hoeveelheden van de andere stoffen dan de opgeslagen stoffen die met het terughalen
      van de opgeslagen stoffen onvermijdelijk aan de bodem worden onttrokken.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel27
  - number: '28'
    text: |-
      De in [artikel 25, tweede lid, van de wet][ref1] bedoelde categorieën van gevallen, waarvoor het verbod om stoffen
      op te slaan zonder vergunning niet geldt, zijn het opslaan van:


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel25
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '25'
  - number: 28.a
    text: |-
      stoffen ten behoeve van het afwenden van het onmiddellijk dreigende gevaar van een onbeheerste uitstroming van
      stoffen uit de ondergrond;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel28
  - number: 28.b
    text: 'stoffen die gebruikt worden voor:'
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel28
  - number: 28.b.1°
    text: het opsporen en winnen van delfstoffen en aardwarmte;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel28
  - number: 28.b.2°
    text: |-
      het opslaan van stoffen, waarvoor een vergunning op basis van [artikel 25 van de wet][ref1] vereist is, of


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel25
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '25'
  - number: 28.b.3°
    text: |-
      het aanleggen van een boorgat dieper dan 500 meter beneden de oppervlakte van de aardbodem, buiten de in de
      onderdelen 1° en 2° bedoelde gevallen;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel28
  - number: 28.c
    text: |-
      stoffen die met de activiteiten, genoemd in onderdeel b, onder 1°, 2° en 3°, onvermijdelijk boven de oppervlakte
      meekomen, en worden teruggebracht in hetzelfde of een vergelijkbaar voorkomen als waaruit deze afkomstig zijn;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel28
  - number: 28.d
    text: hemelwater dat is gevallen op het mijnbouwwerk en het terrein eromheen;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel28
  - number: 28.e
    text: water dat wordt gebruikt voor het opslaan van warmte of koude op een diepte van ten hoogste 500 meter;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel28
  - number: 28.f
    text: |-
      water ten behoeve van openbare drinkwatervoorziening als bedoeld in de [Drinkwaterwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0026338
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0026338
  - number: 28.g
    text: |-
      grondwater en brijn dat zonder toevoeging van stoffen wordt teruggevoerd in hetzelfde gebied waarin het is gewonnen
      naar een diepte van ten hoogste 500 meter.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel28
  - number: '29'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent de inhoud van het winningsplan, bedoeld in
      de [artikelen 24][ref1] en [25][ref2], en het plan voor het opslaan van stoffen als bedoeld in [artikelen 26][ref3]
      en [27][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0014394#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0014394#Artikel26
      [ref4]: https://wetten.overheid.nl/BWBR0014394#Artikel27
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: '24'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0014394
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref3
        bwb_id: BWBR0014394
        artikel: '26'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref4
        bwb_id: BWBR0014394
        artikel: '27'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 29a
    text: |-
      In deze paragraaf wordt verstaan onder: - *lekkage:* het weglekken van CO uit het CO-opslagvoorkomen;
        - *significant risico:* een combinatie van een waarschijnlijkheid van het zich voordoen van schade en een omvang
      van schade die niet kan worden genegeerd;
        - *significante onregelmatigheid:* een onregelmatigheid bij de injectie- of opslagwerkzaamheden of in de toestand
      van het CO-opslagcomplex zelf die het risico van lekkage doet ontstaan of een risico voor het milieu of de
      volksgezondheid oplevert;
        - *richtlijn nr. 2009/31/EG:* richtlijn nr. 2009/31/EG van het Europees Parlement en de Raad van 23 april 2009
      betreffende de geologische opslag van kooldioxide en tot wijziging van richtlijn 85/337/EEG van de Raad, de
      richtlijnen 2000/60/EG, 2001/80/EG, 2004/35/EG, 2006/12/EG en 2008/1/EG en verordening (EG) nr. 1013/2006 (PbEG L
      140) van het Europese Parlement en de Raad.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29a
  - number: 29b
    text: 'Bij ministeriële regeling kunnen voor een vergunning voor permanent opslaan van CO regels worden gesteld omtrent:'
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29b
  - number: 29b.a
    text: het tijdvak van injectie van CO en het gebied;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29b
  - number: 29b.b
    text: de ligging en begrenzing van het opslagvoorkomen en het gebied van het opslagcomplex;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29b
  - number: 29b.c
    text: gegevens met betrekking tot de hydraulische eenheid;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29b
  - number: 29b.d
    text: voorschriften voor het opslagproces;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29b
  - number: 29b.e
    text: de totale hoeveelheid CO die overeenkomstig de vergunning ten hoogste kan worden opgeslagen;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29b
  - number: 29b.f
    text: de grenswaarden van de druk van de opgeslagen CO;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29b
  - number: 29b.g
    text: de maximum toelaatbare snelheid en druk bij injectie van CO en de maximaal toelaatbare druk van het opgeslagen CO.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29b
  - number: 29c.1
    text: |-
      Onze Minister verbindt aan de vergunning voor permanent opslaan van CO het voorschrift risicobeheer als bedoeld in
      [artikel 31d, eerste lid, onderdeel h, van de wet][ref1], op te nemen in een risicobeheerplan.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel31d
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29c
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: 31d
  - number: 29c.2
    text: |-
      Het risicobeheerplan bevat ten minste een beschrijving van maatregelen te nemen om het risico van een significante
      onregelmatigheid en de mogelijke gevolgen daarvan zoveel mogelijk te beperken en voldoet aan Bijlage I, fase 3.3.
      van de richtlijn nr. 2009/31/EG.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29c
  - number: 29d.1
    text: |-
      Onze Minister verbindt aan de vergunning voor permanent opslaan van CO het voorschrift corrigerende maatregelen als
      bedoeld in [artikel 31d, eerste lid, onderdeel k, van de wet][ref1] uit te voeren volgens een plan.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel31d
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29d
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: 31d
  - number: 29d.2
    text: |-
      Het plan bevat ten minste een beschrijving van maatregelen om tijdens de injectie van CO en gedurende de verdere
      opslag significante onregelmatigheden te corrigeren of lekken te dichten teneinde lekkage te voorkomen of te doen
      ophouden.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29d
  - number: 29e.1
    text: |-
      De uitvoerder neemt onmiddellijk passende maatregelen op basis van het plan, bedoeld in [artikel 29d][ref1], zodra
      zich een lekkage of significante onregelmatigheid voordoet.


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel29d
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29e
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: 29d
        hoofdstuk: '3'
        paragraaf: '3.5'
  - number: 29e.2
    text: |-
      Zodra zich een significante onregelmatigheid of lekkage voordoet, meldt de uitvoerder dit onmiddellijk bij de
      inspecteur-generaal der mijnen en verstrekt hem zo spoedig mogelijk gegevens over:
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29e
  - number: 29e.2.a
    text: de oorzaken van de significante onregelmatigheid of lekkage;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29e
  - number: 29e.2.b
    text: de aard en de ernst van de gevolgen van de significante onregelmatigheid of lekkage;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29e
  - number: 29e.2.c
    text: |-
      de maatregelen die zijn genomen of worden overwogen om de significante onregelmatigheid of lekkage te voorkomen, te
      beperken of ongedaan te maken;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29e
  - number: 29e.2.d
    text: |-
      de maatregelen die worden overwogen om te voorkomen dat een significante onregelmatigheid of een lekkage zich
      nogmaals kan voordoen.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29e
  - number: 29e.3
    text: |-
      In geval van een lekkage of significante onregelmatigheid die een lekkagerisico inhoudt, stelt de uitvoerder de
      Nederlandse emissieautoriteit daarvan onmiddellijk op de hoogte.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29e
  - number: 29f.1
    text: |-
      Onze Minister verbindt aan de vergunning voor permanent opslaan van CO het voorschrift monitoring als bedoeld in
      [artikel 31d, eerste lid, onderdeel i, van de wet][ref1] uit te voeren volgens het monitoringsplan.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel31d
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29f
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: 31d
  - number: 29f.2
    text: 'Het monitoringsplan omvat de wijze van de monitoring van:'
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29f
  - number: 29f.2.a
    text: de injectiefaciliteiten,
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29f
  - number: 29f.2.b
    text: het opslagcomplex en
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29f
  - number: 29f.2.c
    text: |-
      het milieu in de directe nabijheid van het opslagcomplex, en is in overeenstemming met Bijlage II, onderdeel 1.1.,
      van de richtlijn nr. 2009/31/EG.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29f
  - number: 29f.3
    text: |-
      Het monitoringsplan heeft betrekking op de periode die aanvangt op het tijdstip van inwerkingtreding van een
      vergunning voor het permanent opslaan van CO en eindigt op het tijdstip waarop de vergunning op grond van
      [artikel 31j van de wet][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel31j
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29f
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: 31j
  - number: 29f.4
    text: |-
      De keuze van de monitoringstechnologie in het monitoringsplan wordt gebaseerd op de beste praktijken die bij het
      opstellen van de ontwerp-vergunning beschikbaar zijn.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29f
  - number: 29f.5
    text: |-
      Voorts wordt aan de vergunning het voorschrift verbonden het monitoringsplan drie maanden voor aanvang
      van de injectie van CO te actualiseren en om de vijf jaar te actualiseren op basis van wijzigingen in het
      beoordeelde lekkagerisico, wijzigingen in de beoordeelde risico’s voor het milieu en de volksgezondheid, nieuwe
      wetenschappelijk kennis en verbeteringen inzake de beste beschikbare techniek. Het geactualiseerde monitoringsplan
      wordt ter goedkeuring voorgelegd aan Onze Minister. De monitoring wordt uitgevoerd volgens het goedgekeurde
      monitoringsplan.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29f
  - number: 29g.1
    text: |-
      Het document, bedoeld in [artikel 31i, tweede lid, van de wet][ref1] met betrekking tot afsluiting bevat ten
      minste:


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel31i
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29g
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: 31i
  - number: 29g.1.1°
    text: 'voor zover het mijnbouwwerken, niet zijnde mijnbouwinstallaties, betreft:'
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29g
  - number: 29g.1.1°.a
    text: een werkprogramma voor het buiten gebruik stellen van de boorgaten;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29g
  - number: 29g.1.1°.b
    text: een beschrijving van de wijze waarop bij het mijnbouwwerk behorend materiaal zal worden afgevoerd;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29g
  - number: 29g.1.1°.c
    text: een beschrijving van op het mijnbouwwerk aanwezige afvalstoffen en de bestemming ervan;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29g
  - number: 29g.1.1°.d
    text: een beschrijving van de maatregelen die worden genomen ter voorkoming van schade;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29g
  - number: 29g.1.1°.e
    text: |-
      een beschrijving van de maatregelen die worden genomen om het terrein waarop het mijnbouwwerk is opgericht in de
      oorspronkelijke staat terug te brengen.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29g
  - number: 29g.1.2°
    text: 'voor zover het mijnbouwinstallaties betreft:'
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29g
  - number: 29g.1.2°.a
    text: een werkprogramma voor het buiten gebruik stellen van de boorgaten;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29g
  - number: 29g.1.2°.b
    text: |-
      de wijze waarop het verwijderen van de mijnbouwinstallatie en van schroot en ander materiaal als bedoeld in
      [artikel 44, vierde lid, van de wet][ref1] plaats zal vinden;


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel44
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29g
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '44'
  - number: 29g.1.2°.c
    text: |-
      de wijze waarop zal worden aangetoond dat de plaats waarop de mijnbouwinstallatie op de zeebodem stond vrij van
      schroot en ander materiaal is;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29g
  - number: 29g.1.2°.d
    text: de wijze waarop de mijnbouwinstallatie en het schroot en ander materiaal zal worden afgevoerd;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29g
  - number: 29g.1.2°.e
    text: de eindbestemming van de mijnbouwinstallatie, de onderdelen ervan en schroot en ander materiaal en
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29g
  - number: 29g.1.2°.f
    text: de op de mijnbouwinstallatie aanwezige afvalstoffen en andere stoffen en de eindbestemming daarvan.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29g
  - number: 29g.2
    text: Voorts bevat het plan gegevens omtrent de tijdstippen waarop de onderdelen van de afsluiting worden uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29g
  - number: 29h.1
    text: |-
      Onze Minister verbindt aan de vergunning voor permanent opslaan van CO het voorschrift activiteiten ter voorkoming
      of beperking van schade door bodembeweging als bedoeld in [artikel 31d, eerste lid, onderdeel l, van de wet][ref1]
      uit te voeren volgens een plan.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel31d
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29h
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: 31d
  - number: 29h.2
    text: 'Het plan omvat ten minste:'
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29h
  - number: 29h.2.a
    text: een kaart met daarop de contouren van de verwachte uiteindelijke mate van bodemdaling of -stijging,
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29h
  - number: 29h.2.b
    text: een overzicht met het verloop van de verwachte mate van bodemdaling of -stijging in de tijd,
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29h
  - number: 29h.2.c
    text: een opgaaf van de onzekerheid omtrent de verwachte mate van bodembeweging als bedoeld in de onderdelen b en c,
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29h
  - number: 29h.2.d
    text: een risico-analyse omtrent bodemtrillingen als gevolg van de opslag,
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29h
  - number: 29h.2.e
    text: een beschrijving van de mogelijk omvang en verwachte aard van de schade door bodembeweging,
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29h
  - number: 29h.2.f
    text: een beschrijving van de maatregelen die worden genomen om bodembeweging te voorkomen of te beperken, en
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29h
  - number: 29h.2.g
    text: een beschrijving van de maatregelen die worden genomen om schade door bodembeweging te voorkomen of te beperken.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29h
  - number: 29h.3
    text: |-
      Dit artikel is niet van toepassing op opslagvoorkomens die gelegen zijn aan de zeezijde van de lijn die in de
      [bijlage bij de wet ](onbekend)is vastgelegd.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29h
  - number: 29i.1
    text: |-
      Het is verboden bij het permanent opslaan van CO en het transporteren van CO door een transportnetwerk als bedoeld
      in [artikel 32, eerste lid, van de wet ][ref1]naast CO andere stoffen op te slaan en te transporteren dan:


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel32
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29i
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '32'
  - number: 29i.1.a
    text: incidentele aanverwante stoffen, afkomstig uit de CO-bron of het afvang- of injectieproces,
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29i
  - number: 29i.1.b
    text: stoffen die nodig zijn voor transport of opslag in het opslagvoorkomen of
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29i
  - number: 29i.1.c
    text: |-
      spoorelementen die aan het CO zijn toegevoegd als hulpmiddel bij het monitoren en het controleren van de beweging
      van CO binnen het CO-opslagcomplex.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29i
  - number: 29i.2
    text: |-
      De concentratie van de stoffen, bedoeld in het eerste lid, onderdelen a tot en met c, mag geen niveaus
      overschrijden die de integriteit van het opslagvoorkomen of het relevante transportnetwerk in het gedrang brengen
      of een significant risico voor het milieu of de volksgezondheid vormen.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29i
  - number: 29i.3
    text: |-
      Het CO en de stoffen, bedoeld in het eerste lid, onderdelen a tot en met c, worden niet eerder opgeslagen dan nadat
      de uitvoerder heeft vastgesteld dat deze voldoen aan het tweede lid.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29i
  - number: 29j.1
    text: |-
      De vergunning bepaalt het bedrag waarvoor financiële zekerheid wordt gesteld voor het jaar waarin injectie volgens
      de aanvraag zal aanvangen en voor elk van de daaropvolgende vier jaren. Het bedrag voor het vierde jaar blijft voor
      opvolgende jaren van toepassing zolang het niet is aangepast.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29j
  - number: 29j.2
    text: 'Het bedrag wordt per jaar vastgesteld op het totaal van:'
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29j
  - number: 29j.2.a
    text: |-
      een raming van de kosten van verwerving van broeikasgasemissierechten als bedoeld in
      [artikel 1.1 van de Wet milieubeheer][ref1], uitgaande van emissie als gevolg van ongecontroleerde uitstroom van CO
      gedurende de laatste drie maanden van het desbetreffende jaar;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel1
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29j
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '1'
  - number: 29j.2.b
    text: |-
      een raming van de kosten van de uitvoering van het risicobeheerplan, genoemd in [artikel 29c][ref1], uitgaande van
      uitvoering gedurende twee jaar;


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel29c
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29j
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: 29c
        hoofdstuk: '3'
        paragraaf: '3.5'
  - number: 29j.2.c
    text: |-
      een raming van de kosten van het nemen van de maatregel of maatregelen uit het plan met betrekking tot corrigerende
      maatregelen, bedoeld in [artikel 29d][ref1], uitgaande van de meest ingrijpende in het plan voorziene maatregel
      of maatregelen;


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel29d
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29j
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: 29d
        hoofdstuk: '3'
        paragraaf: '3.5'
  - number: 29j.2.d
    text: |-
      een raming van de tot intrekking van de vergunning nog te maken kosten van uitvoering van het monitoringsplan,
      genoemd in [artikel 29f][ref1], uitgaande van intrekking van de vergunning twintig jaar na afsluiting;


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel29f
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29j
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: 29f
        hoofdstuk: '3'
        paragraaf: '3.5'
  - number: 29j.2.e
    text: |-
      een raming van de kosten van uitvoering van het afsluitingsplan, bedoeld in [artikel 29g][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel29g
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29j
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: 29g
        hoofdstuk: '3'
        paragraaf: '3.5'
  - number: 29j.2.f
    text: |-
      een raming van de financiële bijdrage, bedoeld in [artikel 31j, eerste lid, onderdeel d, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel31j
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29j
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: 31j
  - number: 29j.3
    text: |-
      De vorm waarin de zekerheid wordt gesteld behoeft de voorafgaande instemming van Onze Minister. De
      vergunninghouder doet hiertoe ten minste zes maanden voordat de zekerheid gesteld zal worden een
      aanvraag. Met toepassing van [artikel 28, eerste lid, laatste zinsnede, van de Dienstenwet][ref1] is
      [paragraaf 4.1.3.3. van de Algemene wet bestuursrecht][ref2] niet van toepassing op de aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29j
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: 29j.4
    text: |-
      Onze Minister stemt in indien de zekerheid  in zodanige vorm is gesteld dat naar het oordeel van Onze Minister
      vaststaat dat de Staat daarmee gedurende de gehele periode alle verplichtingen, bedoeld in het tweede lid, zo nodig
      ook zelf kan nakomen ten laste van de vergunninghouder. Onder financiële zekerheid in dit artikel wordt eveneens
      verstaan een uit oogpunt van zekerheid voor de Staat gelijkwaardige voorziening.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29j
  - number: 29j.5
    text: |-
      Voor aanvang van injectie van CO toont de vergunninghouder Onze Minister aan dat de zekerheid in overeenstemming
      met de [wet ][ref1]en dit artikel is gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0014168
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29j
    references:
      - id: ref1
        bwb_id: BWBR0014168
  - number: 29j.6
    text: |-
      Onverminderd [artikel 31h, eerste lid, onder d, van de wet][ref1], beziet Onze Minister op de voet van het tweede
      lid telkens na vijf jaar gerekend vanaf verlening van de vergunning de hoogte van het bedrag voor de eerstkomende
      vijf jaar. Het bedrag dat voor het laatste jaar in de vergunning is vastgesteld blijft voor opvolgende jaren van
      toepassing zolang het niet is aangepast. De vergunninghouder verstrekt Onze Minister uiterlijk drie maanden voor
      afloop van een vijfjaarstermijn de voor de ramingen, bedoeld in het tweede lid, benodigde gegevens vergezeld van
      adequate cijfermatige onderbouwing en toelichting.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel31h
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29j
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: 31h
  - number: 29j.7
    text: |-
      De vergunninghouder staakt injectie van CO zodra voortgaande injectie zou leiden tot een hoeveelheid opgeslagen CO
      die meer dan 15% hoger is dan de hoeveelheid die betrokken is in de raming, bedoeld in het tweede lid onder a, voor
      de vaststelling van de hoogte van het bedrag waarvoor op dat moment zekerheid is gesteld.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29j
  - number: 29j.8
    text: |-
      Onze Minister kan bij ministeriële regeling nadere maatstaven voor raming van kosten als bedoeld in het tweede
      lid vaststellen.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29j
  - number: 29k
    text: 'De uitvoerder verstrekt Onze Minister jaarlijks voor 1 april:'
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29k
  - number: 29k.a
    text: |-
      de resultaten van de monitoring van het opgeslagen CO over het daaraan voorafgaande kalenderjaar met vermelding van
      de gebruikte technologie,
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29k
  - number: 29k.b
    text: het bewijs dat financiële zekerheid of een gelijkwaardige voorziening is gesteld en aangehouden en
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29k
  - number: 29k.c
    text: wijzigingen in de financiële en technische mogelijkheden van de vergunninghouder.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29k
  - number: 29l.1
    text: |-
      Indien de uitvoerder een verzoek doet om het intrekken van een vergunning voor permanent opslaan van CO als bedoeld
      in [artikel 31j van de wet][ref1] overlegt hij aan Onze Minister:


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel31j
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29l
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: 31j
  - number: 29l.1.a
    text: gegevens waaruit blijkt dat het opgeslagen CO volledig en permanent ingesloten blijft,
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29l
  - number: 29l.1.b
    text: |-
      een voorstel voor een financiële bijdrage als bedoeld in [artikel 31j, eerste lid, onderdeel d, van de wet][ref1]
      die de uitvoerder zal betalen bij de intrekking van de vergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel31j
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29l
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: 31j
  - number: 29l.2
    text: |-
      De financiële bijdrage, bedoeld in het eerste lid, houdt rekening met de in bijlage I van de richtlijn 2009/31/
      EG van het Europees Parlement en de Raad van 23 april 2009 betreffende de geologische opslag van kooldioxide en
      tot wijziging van richtlijn 85/337/EEG van de Raad, de richtlijnen 2000/60/EG, 2001/80/EG, 2004/35/EG, 2006/12/
      EG en 2008/1/EG en verordening (EG) nr. 1013/2006 (PbEG L 140) van het Europese Parlement en de Raad bedoelde
      parameters en elementen inzake de voorgeschiedenis van de opslag van CO die relevant zijn voor het bepalen van de
      verplichtingen die na de overdracht gelden en dekt tenminste de geraamde monitoringskosten voor een periode van 30
      jaar na het intrekken van de vergunning.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29l
  - number: 29m
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de
      [artikelen 29c tot en met 29h, tweede lid][ref1], en [29i tot en met 29l][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel29c
      [ref2]: https://wetten.overheid.nl/BWBR0014394#Artikel29i
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29m
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: 29c
        hoofdstuk: '3'
        paragraaf: '3.5'
      - id: ref2
        bwb_id: BWBR0014394
        artikel: 29i
        hoofdstuk: '3'
        paragraaf: '3.5'
  - number: 29n
    text: |-
      In dit hoofdstuk wordt verstaan onder: - *startvergunning:* een startvergunning aardwarmte;
        - *toewijzing zoekgebied:* een toewijzing zoekgebied aardwarmte;
        - *vervolgvergunning:* een vervolgvergunning aardwarmte.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29n
  - number: 29o.1
    text: |-
      Onze Minister betrekt bij de beoordeling van een aanvraag voor een toewijzing zoekgebied in verband met het zicht
      op de financiering van de opsporing en winning in ieder geval de financiële omstandigheden van de aanvrager.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29o
  - number: 29o.2
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld over de grond, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29o
  - number: 29p.1
    text: 'Onze Minister betrekt bij de beoordeling van een aanvraag voor een startvergunning in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29p
  - number: 29p.1.a
    text: |-
      in verband met onaanvaardbare risico’s voor de veiligheid van omwonenden in hoeverre wordt voldaan aan de norm
      voor het lokaal persoonlijk risico van maximaal 1 op de 100.000 per jaar dat een individu mag lopen in of nabij
      de verschillende bouwwerken waar dat individu verblijft, als gevolg van bodemtrilling door de opsporing en winning
      van aardwarmte;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29p
  - number: 29p.1.b
    text: 'in verband met de financiële mogelijkheden van de aanvrager:'
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29p
  - number: 29p.1.b.1°
    text: de financiële omstandigheden van de aanvrager;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29p
  - number: 29p.1.b.2°
    text: |-
      de wijze waarop de aanvrager voornemens is de kosten voor de opsporing en winning van aardwarmte en de daarbij
      behorende aansprakelijkheden en de kosten voor het geheel of gedeeltelijk buiten gebruik stellen van een boorgat
      tijdens of na afloop van de looptijd van de startvergunning te dragen;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29p
  - number: 29p.1.b.3°
    text: |-
      afspraken tussen de aanvrager en de uitvoerder aardwarmte over het dragen van de kosten voor de bij de opsporing en
      winning behorende aansprakelijkheden, indien deze zijn gemaakt.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29p
  - number: 29p.2
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld over de gronden, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29p
  - number: 29q.1
    text: 'Onze Minister kan een aanvraag voor een startvergunning geheel of gedeeltelijk afwijzen:'
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29q
  - number: 29q.1.a
    text: |-
      indien het ontwerp van de put geen dubbele verbuizing bevat ter hoogte van de zoet en brak waterlagen, tenzij is
      aangetoond dat een alternatief ontwerp de putintegriteit ten minste even goed borgt als een dubbele verbuizing;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29q
  - number: 29q.1.b
    text: |-
      indien de aanvrager niet over een beheerssysteem en beheersplan voor de putintegriteit beschikt dat voldoet aan bij
      ministeriële regeling gestelde regels;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29q
  - number: 29q.1.c
    text: indien de integriteit van de afsluitende aardlagen niet voldoende is geborgd.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29q
  - number: 29q.2
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld inzake de gronden, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29q
  - number: 29r
    text: |-
      [Afdeling 3.4 van de Algemene wet bestuursrecht][ref1] is van toepassing op de voorbereiding van een besluit inzake
      een aanvraag voor een vervolgvergunning, indien ten opzichte van de startvergunning voorschriften of beperkingen
      zouden moeten worden verbonden met betrekking tot het beperken van het gevolg, effect of risico als bedoeld in
      [artikel 24ag, eerste lid, van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel24ag
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29r
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: 24ag
  - number: 29s.1
    text: 'Onze Minister betrekt bij de beoordeling van een aanvraag voor een vervolgvergunning in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29s
  - number: 29s.1.a
    text: |-
      in verband met onaanvaardbare risico’s voor de veiligheid van omwonenden in hoeverre wordt voldaan aan de norm
      voor het lokaal persoonlijk risico van maximaal 1 op de 100.000 per jaar dat een individu mag lopen in of nabij de
      verschillende bouwwerken waar dat individu verblijft, als gevolg van bodemtrilling door de winning van aardwarmte;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29s
  - number: 29s.1.b
    text: 'in verband met de financiële mogelijkheden van de aanvrager:'
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29s
  - number: 29s.1.b.1°
    text: de financiële omstandigheden van de aanvrager;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29s
  - number: 29s.1.b.2°
    text: |-
      de wijze waarop de aanvrager voornemens is de kosten voor de winning van aardwarmte en de daarbij behorende
      aansprakelijkheden en de kosten voor het geheel of gedeeltelijk buiten gebruik stellen van een boorgat tijdens of
      na afloop van de looptijd van de vervolgvergunning te dragen;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29s
  - number: 29s.1.b.3°
    text: |-
      afspraken tussen de aanvrager en de uitvoerder aardwarmte over het dragen van de kosten voor de bij de winning
      behorende aansprakelijkheden, indien deze zijn gemaakt.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29s
  - number: 29s.2
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld over de gronden, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29s
  - number: 29t.1
    text: 'Onze Minister kan een aanvraag voor een vervolgvergunning geheel of gedeeltelijk afwijzen:'
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29t
  - number: 29t.1.a
    text: |-
      indien de put geen dubbele verbuizing bevat ter hoogte van de zoet en brak waterlagen, tenzij is aangetoond dat een
      alternatieve inrichting van de put de putintegriteit ten minste even goed borgt als een dubbele verbuizing;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29t
  - number: 29t.1.b
    text: |-
      indien de aanvrager niet over een operationeel beheerssysteem en beheersplan voor de putintegriteit beschikt dat
      voldoet aan bij ministeriële regeling gestelde regels;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29t
  - number: 29t.1.c
    text: indien de integriteit van de afsluitende aardlagen niet voldoende is geborgd.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29t
  - number: 29t.2
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld inzake de gronden, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29t
  - number: 29u.1
    text: |-
      Onze Minister verbindt aan een startvergunning of vervolgvergunning voorschriften of beperkingen die betrekking
      hebben op:
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29u
  - number: 29u.1.a
    text: de injectiedruk;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29u
  - number: 29u.1.b
    text: de injectietemperatuur;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29u
  - number: 29u.1.c
    text: het debiet;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29u
  - number: 29u.1.d
    text: het berekenen en beperken van scheurgroei in de afsluitende aardlagen;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29u
  - number: 29u.1.e
    text: |-
      het beheerssysteem en beheersplan voor de putintegriteit, bedoeld in de [artikelen 29q][ref1] en [29t][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel29q
      [ref2]: https://wetten.overheid.nl/BWBR0014394#Artikel29t
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29u
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: 29q
        hoofdstuk: 3a
        paragraaf: 3a.1
      - id: ref2
        bwb_id: BWBR0014394
        artikel: 29t
        hoofdstuk: 3a
        paragraaf: 3a.1
  - number: 29u.1.f
    text: het gebruik van mijnbouwhulpstoffen, indien van toepassing.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29u
  - number: 29u.2
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld inzake de gronden, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29u
  - number: 29v.1
    text: |-
      Onze Minister bepaalt in een vergunning die betrekking heeft op aardlagen die zich geheel of gedeeltelijk bevinden
      onder een gebied dat is aangewezen voor de winning van drinkwater uit grondwater, het bedrag waarvoor financiële
      zekerheid ter dekking van de aansprakelijkheid voor de schade door verontreiniging van grondwater of bodem in
      verband met de opsporing en winning van aardwarmte wordt gesteld voor:
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29v
  - number: 29v.1.a
    text: |-
      het jaar waarin de opsporing volgens de aanvraag voor de startvergunning zal aanvangen en voor het daaropvolgende
      jaar, indien het een startvergunning betreft;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29v
  - number: 29v.1.b
    text: |-
      het jaar waarin de vervolgvergunning wordt verleend en voor elk van de daaropvolgende vier jaren, indien het een
      vervolgvergunning betreft.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29v
  - number: 29v.2
    text: 'Het bedrag wordt per jaar vastgesteld op het totaal van:'
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29v
  - number: 29v.2.a
    text: |-
      een raming van de kosten voor de monitoring en reactieve maatregelen met betrekking tot de beheersing van de
      putintegriteit;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29v
  - number: 29v.2.b
    text: |-
      een raming van de kosten voor het nemen van maatregelen voor de borging van de integriteit van de afsluitende
      aardlagen.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29v
  - number: 29v.3
    text: |-
      Onze Minister bepaalt in de vergunning de vorm waarin de financiële zekerheid wordt gesteld. De financiële
      zekerheid wordt in zodanige vorm gesteld dat naar het oordeel van Onze Minister vaststaat dat de Staat daarmee
      gedurende de periode waarvoor zekerheid wordt gesteld, alle verplichtingen, bedoeld in het tweede lid, zo nodig ook
      zelf kan nakomen ten laste van de vergunninghouder.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29v
  - number: 29v.4
    text: |-
      De houder van een startvergunning toont voor aanvang van de opsporing van aardwarmte aan Onze Minister aan dat de
      financiële zekerheid in overeenstemming met dit artikel is gesteld.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29v
  - number: 29v.5
    text: |-
      De houder van een vervolgvergunning toont binnen zes maanden na de datum van het verlenen van de vervolgvergunning
      aan Onze Minister aan dat de financiële zekerheid in overeenstemming met dit artikel is gesteld en houdt het bedrag
      dat voor het laatste jaar in de startvergunning is vastgesteld, in stand tot dit moment.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29v
  - number: 29v.6
    text: |-
      Onverminderd [artikel 24ab, tweede lid, onderdeel b, onder 3°, van de wet][ref1] blijft het bedrag dat voor
      het laatste jaar in de startvergunning is vastgesteld, van toepassing voor opvolgende jaren gedurende de periode
      waarvoor de startvergunning geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel24ab
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29v
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: 24ab
  - number: 29v.7
    text: |-
      Onverminderd [artikel 24ao, tweede lid, onderdeel b, onder 3°, van de wet][ref1] beziet Onze Minister op de
      voet van het tweede lid telkens na vijf jaar gerekend vanaf de datum van het verlenen van de vervolgvergunning
      de hoogte van het bedrag per jaar voor de eerstkomende vijf jaar. Het bedrag dat voor het laatste jaar in de
      vervolgvergunning is vastgesteld blijft voor opvolgende jaren van toepassing zolang het niet is aangepast. De
      vergunninghouder verstrekt Onze Minister uiterlijk drie maanden voor afloop van een vijfjaarstermijn de voor de
      ramingen, bedoeld in het tweede lid, benodigde gegevens vergezeld van een adequate cijfermatige onderbouwing en
      toelichting.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel24ao
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29v
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: 24ao
  - number: 29v.8
    text: |-
      De vergunninghouder verstrekt ten minste elk jaar aan Onze Minister het bewijs dat financiële zekerheid is gesteld
      en aangehouden.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29v
  - number: 29v.9
    text: |-
      Onze Minister kan bij ministeriële regeling nadere maatstaven voor de raming van de kosten, bedoeld in het tweede
      lid, vaststellen.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29v
  - number: 29w.1
    text: |-
      Onze Minister kan aan een startvergunning of vervolgvergunning voorschriften of beperkingen verbinden die
      betrekking hebben op:
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29w
  - number: 29w.1.a
    text: de seismische risicoanalyse;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29w
  - number: 29w.1.b
    text: het meten, registreren en melden van bodembeweging als gevolg van de opsporing of winning van aardwarmte;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29w
  - number: 29w.1.c
    text: de wijze van handelen in geval van bodembeweging als gevolg van de opsporing of winning van aardwarmte.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29w
  - number: 29w.2
    text: |-
      Onze Minister kan aan een startvergunning of vervolgvergunning in verband met de financiële mogelijkheden van de
      aanvrager voorschriften of beperkingen verbinden die betrekking hebben op:
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29w
  - number: 29w.2.a
    text: de financiële omstandigheden van de aanvrager;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29w
  - number: 29w.2.b
    text: |-
      de wijze waarop de aanvrager voornemens is de kosten voor de opsporing of winning van aardwarmte en de daarbij
      behorende aansprakelijkheden en de kosten voor het geheel of gedeeltelijk buiten gebruik stellen van een boorgat
      tijdens of na afloop van de looptijd van de betreffende vergunning te dragen;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29w
  - number: 29w.2.c
    text: |-
      financiële zekerheden die gesteld dienen te worden ter dekking van de kosten voor de bij de opsporing of winning
      en de daarbij behorende aansprakelijkheden, anders dan de zekerheden, bedoeld in de [artikelen 46][ref1] en
      [47 van de wet][ref2], en [artikel 29v][ref3]. Deze voorschriften of beperkingen kunnen in ieder geval betrekking
      hebben op:


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel47
      [ref3]: https://wetten.overheid.nl/BWBR0014394#Artikel29v
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29w
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '46'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '47'
      - id: ref3
        bwb_id: BWBR0014394
        artikel: 29v
        hoofdstuk: 3a
        paragraaf: 3a.1
  - number: 29w.2.c.1°
    text: de vorm en de omvang van de financiële zekerheden;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29w
  - number: 29w.2.c.2°
    text: het tijdstip van het stellen van financiële zekerheden;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29w
  - number: 29w.2.c.3°
    text: het melden van wijzigingen in de financiële zekerheden;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29w
  - number: 29w.2.d
    text: |-
      het melden van afspraken, of wijzigingen daarvan, tussen de aanvrager en de uitvoerder aardwarmte over het dragen
      van de kosten voor de bij de opsporing of winning behorende aansprakelijkheden, indien deze zijn gemaakt.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29w
  - number: 29w.3
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld inzake de gronden, bedoeld in het eerste en tweede
      lid.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29w
  - number: 29x.1
    text: |-
      Indien meer aanvragen voor een toewijzing zoekgebied die zouden kunnen worden toegewezen, zijn ingediend,
      rangschikt Onze Minister een aanvraag hoger naarmate:
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29x
  - number: 29x.1.a
    text: |-
      de aanvraag beter past binnen provinciale of gemeentelijke beleidsplannen ten aanzien van aardwarmte voor het
      betreffende gebied;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29x
  - number: 29x.1.b
    text: de realistisch te verwachten hoeveelheid te winnen aardwarmte groter is;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29x
  - number: 29x.1.c
    text: de aanvrager al eerder is gestart met winning van aardwarmte in een gebied dat grenst aan het betreffende gebied;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29x
  - number: 29x.1.d
    text: de aanvrager over ervaring met de ontwikkeling van aardwarmteactiviteiten of andere mijnbouwactiviteiten beschikt;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29x
  - number: 29x.1.e
    text: de kwaliteit van de aanvraag beter is.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29x
  - number: 29x.2
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld over de onderlinge weging van de rangschikkingscriteria,
      bedoeld in het eerste lid, en kunnen nadere regels worden gesteld over de procedure van de rangschikking en de
      rangschikkingscriteria.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29x
  - number: 29y.1
    text: |-
      Indien meer aanvragen voor een startvergunning die zouden kunnen worden toegewezen, zijn ingediend, rangschikt Onze
      Minister een aanvraag hoger naarmate:
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29y
  - number: 29y.1.a
    text: |-
      de aanvraag beter past binnen provinciale of gemeentelijke beleidsplannen ten aanzien van aardwarmte voor het
      betreffende gebied;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29y
  - number: 29y.1.b
    text: de realistisch te verwachten hoeveelheid te winnen aardwarmte groter is;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29y
  - number: 29y.1.c
    text: de aanvrager al eerder is gestart met winning van aardwarmte in een gebied dat grenst aan het betreffende gebied;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29y
  - number: 29y.1.d
    text: de kwaliteit van de aanvraag beter is.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29y
  - number: 29y.2
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld over de onderlinge weging van de rangschikkingscriteria,
      bedoeld in het eerste lid, en kunnen nadere regels worden gesteld over de procedure van de rangschikking en de
      rangschikkingscriteria.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29y
  - number: 29z.1
    text: |-
      Een aanvraag om instemming met de aanwijzing van de uitvoerder aardwarmte als bedoeld in
      [artikel 24z, vierde lid, van de wet][ref1] bevat een beschrijving van de technische en financiële capaciteiten van
      de uitvoerder aardwarmte.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel24z
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29z
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: 24z
  - number: 29z.2
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld over de aanvraag om instemming.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29z
  - number: 29aa.1
    text: |-
      Onze Minister weigert instemming met de aanwijzing van een uitvoerder aardwarmte, bedoeld in
      [artikel 24z, derde lid, van de wet][ref1], indien de technische of financiële capaciteiten van de uitvoerder
      niet toereikend zijn voor een goede uitvoering van de feitelijke werkzaamheden met betrekking tot de
      mijnbouwactiviteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel24z
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29aa
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: 24z
  - number: 29aa.2
    text: |-
      Onze Minister betrekt bij de beoordeling van de technische capaciteiten van de uitvoerder aardwarmte in ieder
      geval:
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29aa
  - number: 29aa.2.a
    text: de ervaring met mijnbouwactiviteiten waarover de uitvoerder aardwarmte beschikt;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29aa
  - number: 29aa.2.b
    text: de kennis over mijnbouwactiviteiten waarover de uitvoerder aardwarmte beschikt;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29aa
  - number: 29aa.2.c
    text: |-
      de verantwoordelijkheidszin, waarvan de uitvoerder aardwarmte eerder blijk heeft gegeven bij feitelijke
      werkzaamheden met betrekking tot mijnbouwactiviteiten onder een eerdere vergunning.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29aa
  - number: 29aa.3
    text: |-
      Onze Minister betrekt bij de beoordeling van de financiële capaciteiten van de uitvoerder aardwarmte in ieder
      geval:
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29aa
  - number: 29aa.3.a
    text: de financiële omstandigheden van de uitvoerder aardwarmte;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29aa
  - number: 29aa.3.b
    text: |-
      afspraken tussen de aanvrager van de startvergunning of de houder van de startvergunning of vervolgvergunning
      en de uitvoerder aardwarmte over het dragen van de kosten voor de bij de opsporing of winning behorende
      aansprakelijkheden, indien deze zijn gemaakt.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29aa
  - number: 29aa.4
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld over de gronden, bedoeld in het tweede en derde lid.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29aa
  - number: 29ab.1
    text: |-
      Onze Minister kan aan de instemming met de uitvoerder aardwarmte voorschriften of beperkingen verbinden die
      betrekking hebben op:
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29ab
  - number: 29ab.1.a
    text: de financiële omstandigheden van de uitvoerder aardwarmte;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29ab
  - number: 29ab.1.b
    text: |-
      financiële zekerheden die gesteld dienen te worden ter dekking van de kosten voor de opsporing of winning en de
      daarbij behorende aansprakelijkheden. Deze voorschriften of beperkingen kunnen betrekking hebben op:
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29ab
  - number: 29ab.1.b.1°
    text: de vorm en de omvang van de financiële zekerheden;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29ab
  - number: 29ab.1.b.2°
    text: het tijdstip van het stellen van financiële zekerheden;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29ab
  - number: 29ab.1.b.3°
    text: het melden van wijzigingen in de financiële zekerheden;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29ab
  - number: 29ab.1.c
    text: |-
      het melden van afspraken, of wijzigingen daarvan, tussen de aanvrager van de startvergunning of de houder van
      de startvergunning of vervolgvergunning en de uitvoerder aardwarmte over het dragen van de kosten voor de bij de
      opsporing of winning behorende aansprakelijkheden, indien deze zijn gemaakt.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29ab
  - number: 29ab.2
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld over de instemming.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29ab
  - number: 29ac
    text: |-
      In deze paragraaf wordt verstaan onder: - *overeenkomst:* een overeenkomst als bedoeld in
      [artikel 86a, eerste lid, van de wet][ref1], die een overeenkomst van samenwerking is;
        - *de vennootschap:* de vennootschap, bedoeld in [artikel 82, tweede lid, van de wet][ref2];
        - *vergunninghouder:* de houder van een toewijzing zoekgebied, startvergunning of vervolgvergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel86a
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel82
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29ac
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: 86a
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '82'
  - number: 29ad
    text: |-
      In de overeenkomst worden bepalingen die ertoe strekken dat ten behoeve van de voorgenomen opsporings- en
      winningswerkzaamheden wordt samengewerkt, opgenomen, waarbij:
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29ad
  - number: 29ad.a
    text: |-
      de vennootschap voor 20% belang neemt, tenzij met de vergunninghouder een hoger percentage van ten hoogste 40%
      wordt overeengekomen;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29ad
  - number: 29ad.b
    text: de vergunninghouder het resterende belang neemt;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29ad
  - number: 29ad.c
    text: |-
      de waarde van de werken die door het doen van de in [artikel 29ag, onderdeel a][ref1], bedoelde investeringen tot
      stand zijn gekomen en de opbrengst van de winning van aardwarmte in verhouding tot ieders belang in de samenwerking
      toebehoren aan de vergunninghouder en de vennootschap;


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel29ag
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29ad
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: 29ag
        hoofdstuk: 3a
        paragraaf: 3a.3
  - number: 29ad.d
    text: |-
      de vergunninghouder en de vennootschap ten behoeve van de samenwerking, in verhouding tot ieders belang
      in de samenwerking, de middelen verstrekken die bestemd zijn voor het doen van de uitgaven, bedoeld in
      [artikel 29ag, onderdeel a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel29ag
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29ad
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: 29ag
        hoofdstuk: 3a
        paragraaf: 3a.3
  - number: 29ad.e
    text: op de overeenkomst Nederlands recht van toepassing is.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29ad
  - number: 29ae
    text: |-
      In de overeenkomst wordt het bedrag vastgesteld van de door de houder van de toewijzing zoekgebied reeds gemaakte
      kosten die naar redelijkheid kunnen worden toegeschreven aan activiteiten en investeringen ten behoeve van de
      voorgenomen opsporings- en winningswerkzaamheden.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29ae
  - number: 29af
    text: 'In de overeenkomst worden bepalingen opgenomen die de vergunninghouder ertoe verplichten:'
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29af
  - number: 29af.a
    text: |-
      de voor hem uit de vergunning voortvloeiende rechten uit te oefenen ten behoeve van de samenwerking en
      overeenkomstig de gezamenlijke besluiten die met inachtneming van [artikel 29ah][ref1] zijn genomen door de
      vergunninghouder en de vennootschap;


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel29ah
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29af
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: 29ah
        hoofdstuk: 3a
        paragraaf: 3a.3
  - number: 29af.b
    text: |-
      zijn kennis en ervaring op het gebied van opsporing, winning en afzet van aardwarmte aan de samenwerking ten goede
      te doen komen.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29af
  - number: 29ag
    text: 'In de overeenkomst worden bepalingen opgenomen die de vennootschap ertoe verplichten:'
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29ag
  - number: 29ag.a
    text: |-
      aan de vergunninghouder te vergoeden het percentage, gelijk aan het belang van de vennootschap in de samenwerking,
      van de uitgaven van de vergunninghouder die in overeenstemming met [artikel 29ah][ref1] zijn goedgekeurd of in
      overeenstemming zijn met een goedgekeurd jaarlijks investerings- en financieringsplan;


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel29ah
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29ag
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: 29ah
        hoofdstuk: 3a
        paragraaf: 3a.3
  - number: 29ag.b
    text: niet te beletten dat besluiten van de vergunninghouder gebaseerd worden op normale commerciële overwegingen;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29ag
  - number: 29ag.c
    text: |-
      zijn stem bij de besluitvorming volgens [artikel 29ah][ref1] uit te brengen op grond van transparantie, objectieve
      en niet-discriminerende beginselen;


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel29ah
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29ag
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: 29ah
        hoofdstuk: 3a
        paragraaf: 3a.3
  - number: 29ag.d
    text: |-
      aan de houder van de toewijzing zoekgebied terstond te vergoeden het percentage, gelijk aan het belang van de
      vennootschap in de samenwerking, van het bedrag, bedoeld in [artikel 29ae][ref1], vermeerderd met een enkelvoudige
      rente, waarvan het percentage gelijk is aan dat van de wettelijke rente, over een tijdvak van ten hoogste vijf
      jaar, te rekenen vanaf het tijdstip waarop de desbetreffende kosten zijn gemaakt;


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel29ae
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29ag
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: 29ae
        hoofdstuk: 3a
        paragraaf: 3a.3
  - number: 29ag.e
    text: |-
      de informatie als bedoeld in [artikel 29ai, eerste lid, onderdeel d][ref1], die de vennootschap voornemens is
      openbaar te maken, ter goedkeuring voor te leggen aan de vergunninghouder waarbij de vergunninghouder binnen een in
      de overeenkomst overeengekomen termijn bezwaar kan maken tegen openbaarmaking van die informatie.


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel29ai
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29ag
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: 29ai
        hoofdstuk: 3a
        paragraaf: 3a.3
  - number: 29ah
    text: 'In de overeenkomst worden bepalingen opgenomen die ertoe strekken dat:'
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29ah
  - number: 29ah.a
    text: |-
      een gezamenlijk besluit van de vergunninghouder en de vennootschap wordt genomen in een vergadering, waarin de
      vergunninghouder en de vennootschap zich door een schriftelijk gevolmachtigde kunnen laten vertegenwoordigen;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29ah
  - number: 29ah.b
    text: |-
      een gezamenlijk besluit van de vergunninghouder en de vennootschap, in afwijking van onderdeel a, buiten
      vergadering kan worden genomen, mits de vergunninghouder en de vennootschap hier beide mee instemmen en dit
      gebeurt bij een gezamenlijke schriftelijke verklaring of bij een gelijkluidende schriftelijke verklaring van de
      vergunninghouder en de vennootschap, door deze of hun gevolmachtigde vertegenwoordigers ondertekend;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29ah
  - number: 29ah.c
    text: |-
      de vergunninghouder en de vennootschap bij gezamenlijke besluiten een stem hebben in verhouding tot ieders belang
      in de samenwerking;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29ah
  - number: 29ah.d
    text: |-
      een gezamenlijk besluit van de vergunninghouder en de vennootschap, waarbij in afwijking van onderdeel c de
      vergunninghouder en de vennootschap elk een beslissende stem hebben, vereist is voor:
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29ah
  - number: 29ah.d.1°
    text: het jaarlijkse investerings- en financieringsplan;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29ah
  - number: 29ah.d.2°
    text: |-
      activiteiten en aanschaffingen die niet in het jaarlijkse investerings- en financieringsplan zijn opgenomen, en
      die een bedrag van € 500 000 te boven gaan of die 10% of meer van het totale bedrag van de in dat plan opgenomen
      uitgaven bedragen, indien het gaat om een bedrag van minder dan € 500 000;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29ah
  - number: 29ah.d.3°
    text: |-
      de meerjarenplanning ten aanzien van de voorgenomen opsporings- en winningswerkzaamheden binnen het
      vergunningsgebied;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29ah
  - number: 29ah.d.4°
    text: het aangaan, wijzigen of beëindigen van duurzame samenwerking met derden ter zake van opsporing en winning;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29ah
  - number: 29ah.d.5°
    text: het aangaan en wijzigen van verplichtingen tot levering van aardwarmte;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29ah
  - number: 29ah.d.6°
    text: het voortbestaan van de opsporings- of winningswerkzaamheden.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29ah
  - number: 29ai.1
    text: 'In de overeenkomst worden in verband met de kennisdeling en -borging bepalingen opgenomen met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29ai
  - number: 29ai.1.a
    text: de totstandkoming van het putontwerp;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29ai
  - number: 29ai.1.b
    text: de keuze voor de locatie van boorgaten;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29ai
  - number: 29ai.1.c
    text: |-
      het vastleggen en verstrekken van informatie omtrent de organisatie en de uitvoering van de opsporings- en
      winningswerkzaamheden;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29ai
  - number: 29ai.1.d
    text: |-
      de aanwijzing van de informatie die de vennootschap overeenkomstig [artikel 29ag, onderdeel e][ref1], ter
      goedkeuring aan de vergunninghouder dient voor te leggen, voordat deze openbaar wordt gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel29ag
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29ai
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: 29ag
        hoofdstuk: 3a
        paragraaf: 3a.3
  - number: 29ai.2
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld inzake de onderwerpen, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29ai
  - number: 29aj
    text: |-
      De vergunninghouder neemt geen besluit, inhoudende bij wie opdrachten worden geplaatst voor leveringen, voor
      het uitvoeren van werken of voor het verrichten van diensten, indien aannemelijk is dat dit besluit leidt tot
      financieel nadeel voor de vennootschap.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29aj
  - number: 29ak.1
    text: |-
      Onze Minister kan ambtshalve of op gemotiveerd verzoek van de vennootschap of de houder van de toewijzing
      zoekgebied bepalen dat de verplichting, bedoeld in [artikel 86a, eerste lid, van de wet][ref1] niet geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel86a
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29ak
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: 86a
  - number: 29ak.2
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld over het verzoek, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel29ak
  - number: '30.1'
    text: |-
      De uitvoerder verricht metingen naar bodembeweging ten gevolge van het winnen van delfstoffen als bedoeld in
      [artikel 41 van de wet][ref1]. De metingen worden verricht overeenkomstig een meetplan.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel41
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '41'
  - number: '30.2'
    text: De uitvoerder dient het meetplan in bij Onze Minister voor ieder voorkomen waaruit wordt gewonnen.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel30
  - number: '30.3'
    text: Het meetplan behoeft de instemming van Onze Minister alvorens met de winning wordt aangevangen.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel30
  - number: '30.4'
    text: |-
      Onze Minister beslist over het meetplan binnen acht weken na indiening ervan. De instemming is van rechtswege
      gegeven, indien Onze Minister niet binnen de instemmingstermijn een beslissing heeft genomen. De instemming
      van rechtswege wordt voor de mogelijkheid van bezwaar en beroep gelijkgesteld met een besluit als bedoeld in
      [artikel 1:3, eerste lid, van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel1
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '1'
  - number: '30.5'
    text: Onze Minister kan de instemming onder beperkingen geven en aan zijn instemming voorschriften verbinden.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel30
  - number: '30.6'
    text: |-
      Het meetplan beslaat de termijn van de winning en de daarop volgende dertig jaren. De uitvoerder actualiseert het
      meetplan gedurende de periode van winning en de daarop volgende vijf jaren jaarlijks en verstrekt daarvan voor
      1 november afschrift aan Onze Minister. Onze Minister kan de uitvoerder een aanwijzing geven omtrent de tijdstippen
      waarop en de plaatsen waar gemeten wordt.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel30
  - number: '30.7'
    text: 'Het meetplan bevat tenminste een beschrijving van:'
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel30
  - number: 30.7.a
    text: de tijdstippen waarop de metingen worden verricht;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel30
  - number: 30.7.b
    text: de plaatsen waar gemeten wordt, en
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel30
  - number: 30.7.c
    text: de meetmethoden.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel30
  - number: '30.8'
    text: Een van de tijdstippen, bedoeld in het zevende lid, onderdeel a, ligt voor de aanvang van de winning.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel30
  - number: '30.9'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent het meetplan.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel30
  - number: '31.1'
    text: De uitvoerder draagt ervoor zorg dat de metingen op een zorgvuldige en betrouwbare wijze plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel31
  - number: '31.2'
    text: |-
      De uitvoerder overlegt de resultaten van de eerste meting, bedoeld in [artikel 30, achtste lid][ref1], uiterlijk
      twee weken voor de aanvang van de winning aan de inspecteur-generaal der mijnen.


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel30
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: '30'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '31.3'
    text: |-
      De uitvoerder overlegt de resultaten van de metingen alsmede een analyse van die resultaten twaalf weken na het
      verrichten van de metingen aan de inspecteur-generaal der mijnen.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel31
  - number: '31.4'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent de inhoud van en de wijze van verstrekking
      van de meetresultaten en de analyse daarvan.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel31
  - number: '32'
    text: |-
      De [artikelen 30][ref1] en [31][ref2] zijn van overeenkomstige toepassing op de opslag van stoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0014394#Artikel31
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: '30'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref2
        bwb_id: BWBR0014394
        artikel: '31'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '33.1'
    text: |-
      In geval van zoutwinning en opslag van stoffen in een door zoutwinning ontstane holruimte bevat het meetplan,
      bedoeld in [artikel 30, eerste lid][ref1], tevens een beschrijving van:


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel30
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: '30'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 33.1.a
    text: de tijdstippen waarop metingen in de holruimte worden uitgevoerd, en
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel33
  - number: 33.1.b
    text: de methode die voor het uitvoeren van holruimtemetingen wordt gebruikt.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel33
  - number: '33.2'
    text: |-
      De uitvoerder overlegt de resultaten van de metingen, alsmede op de metingen gebaseerde holruimtekaarten en
      holruimtedoorsneden uiterlijk twaalf weken na het verrichten van de metingen aan de inspecteur-generaal der mijnen.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel33
  - number: '33.3'
    text: De holruimtekaarten en holruimtedoorsneden worden onverwijld bijgewerkt, zodra nieuwe gegevens beschikbaar komen.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel33
  - number: '33.4'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent de in het tweede lid bedoelde kaarten en
      doorsneden.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel33
  - number: '34'
    text: Deze afdeling is van toepassing op mijnbouwwerken, uitgezonderd mijnbouwinstallaties.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel34
  - number: '35.1'
    text: |-
      Een voor de winning bestemd mijnbouwwerk is voorzien van meetapparatuur waarmee de hoeveelheden delfstoffen of
      aardwarmte die worden gewonnen, verbruikt, vernietigd of afgevoerd kunnen worden berekend.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel35
  - number: '35.2'
    text: |-
      Een voor de opslag bestemd mijnbouwwerk is voorzien van apparatuur voor het meten van de hoeveelheden stoffen die
      in de ondergrond worden gebracht, daaruit worden teruggehaald, verbruikt, vernietigd of afgevoerd.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel35
  - number: '35.3'
    text: |-
      Onze Minister kan ontheffing verlenen van het eerste en tweede lid op een daartoe strekkende aanvraag waarbij mede
      wordt aangegeven op welke andere wijze gegevens als bedoeld in het eerste en tweede lid worden verkregen.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel35
  - number: '35.4'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld omtrent het aantal metingen, de soort metingen en de te
      gebruiken meetapparatuur.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel35
  - number: '36'
    text: |-
      Een mijnbouwwerk is zodanig afgescheiden van de omgeving en ten aanzien van de toegangen zijn zodanige maatregelen
      genomen dat het niet vrijelijk kan worden betreden door onbevoegden. Het terrein wordt op passende wijze bewaakt.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel36
  - number: '37.1'
    text: 'Het oprichten van een mijnbouwwerk geschiedt op veilige afstand tot:'
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel37
  - number: 37.1.a
    text: opstallen, welke geen deel uitmaken van een mijnbouwwerk en waarin open vuur wordt of kan worden gebruikt;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel37
  - number: 37.1.b
    text: openbare wegen;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel37
  - number: 37.1.c
    text: spoorwegen;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel37
  - number: 37.1.d
    text: kunstwerken, of
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel37
  - number: 37.1.e
    text: licht brandbare gewassen.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel37
  - number: '37.2'
    text: |-
      De uitvoerder of de uitvoerder aardwarmte draagt er zorg voor dat het zorgsysteem, bedoeld in [artikel 2.42e van
      het Arbeidsomstandighedenbesluit](onbekend), en het document, bedoeld in [artikel 2.42f van dat besluit](onbekend),
      mede betrekking hebben op de veiligheid.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel37
  - number: '37.3'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld omtrent de veilige afstanden, het zorgsysteem en het
      document.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel37
  - number: '38.1'
    text: |-
      Het is verboden op een mijnbouwwerk aardgas af te blazen of af te fakkelen in de open lucht dan wel andere
      verontreinigende stoffen uit te stoten.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel38
  - number: '38.2'
    text: |-
      Het eerste lid geldt niet indien het afblazen of affakkelen van aardgas dan wel de uitstoot van andere
      verontreinigende stoffen onvermijdelijk is voor een normale bedrijfsvoering in het mijnbouwwerk. In dat geval
      worden alle maatregelen getroffen om schade ten gevolge van het afblazen of affakkelen van aardgas dan wel de
      uitstoot van andere verontreinigende stoffen zoveel mogelijk te voorkomen dan wel te beperken.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel38
  - number: '38.3'
    text: |-
      Bij ministeriële regeling kunnen in het belang van de bescherming van het milieu regels worden gesteld omtrent de
      in het tweede lid bedoelde maatregelen.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel38
  - number: '39'
    text: |-
      De houder van een vergunning als bedoeld in de [artikelen 6][ref1], [24b][ref2] en [25 van de wet][ref3] is
      niet gehouden een melding als bedoeld in [artikel 44, eerste lid, van de wet][ref4] te doen in het geval het
      mijnbouwwerk voor een periode van maximaal een jaar buiten werking is, als gevolg van:


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel24b
      [ref3]: https://wetten.overheid.nl/BWBR0014168#Artikel25
      [ref4]: https://wetten.overheid.nl/BWBR0014168#Artikel44
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: 24b
      - id: ref3
        bwb_id: BWBR0014168
        artikel: '25'
      - id: ref4
        bwb_id: BWBR0014168
        artikel: '44'
  - number: 39.a
    text: het uitvoeren van reparatie, onderhoud of aanpassingen van de bovengrondse installaties;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel39
  - number: 39.b
    text: |-
      het uitvoeren van een werkprogramma als bedoeld in [artikel 74, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel74
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: '74'
        hoofdstuk: '5'
        paragraaf: 5.3.2
        afdeling: '5.3'
  - number: 39.c
    text: het doen van onderzoek na een ongeluk of incident;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel39
  - number: 39.d
    text: het doen van onderzoek naar de mogelijkheden en effecten van de opsporing, winning of opslag;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel39
  - number: 39.e
    text: |-
      het niet kunnen uitvoeren van werkzaamheden door een van buiten komende oorzaak, waaronder het tijdelijk niet
      beschikbaar zijn van ondersteunende installaties, pijpleidingen, kabels, personeel, materialen, grondstoffen,
      hulpstoffen, diensten van derden die noodzakelijk zijn voor het in werking houden van het mijnbouwwerk of het niet
      tijdig kunnen beschikken over de benodigde vergunningen of toestemmingen.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel39
  - number: '40.1'
    text: |-
      Een mijnbouwwerk als bedoeld in [artikel 2, eerste lid, onderdelen a tot en met g][ref1], dat een
      gedeelte is van een mijnbouwwerk als bedoeld in artikel 2, tweede lid, is een geval als bedoeld in
      [artikel 44, vijfde lid, van de wet][ref2], voor de toepassing van artikel 44, eerste lid, van de wet, tenzij:


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel44
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: '2'
        hoofdstuk: '1'
        paragraaf: '1.1'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '44'
  - number: 40.1.a
    text: |-
      Onze Minister voor dat mijnbouwwerk een aanvraag om een wijziging van een vergunning als bedoeld in
      [artikel 40, tweede lid, van de wet][ref1], of een verandering van een omgevingsvergunning als bedoeld in
      [artikel 5.1 van de Omgevingswet][ref2] heeft ontvangen;


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Artikel5
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '40'
      - id: ref2
        bwb_id: BWBR0037885
        artikel: '5'
  - number: 40.1.b
    text: 'de inspecteur-generaal der mijnen voor dat mijnbouwwerk:'
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel40
  - number: 40.1.b.1°
    text: |-
      een werkprogramma voor het buiten gebruik stellen van een boorgat als bedoeld in [artikel 74, eerste lid][ref1],
      heeft ontvangen;


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel74
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: '74'
        hoofdstuk: '5'
        paragraaf: 5.3.2
        afdeling: '5.3'
  - number: 40.1.b.2°
    text: |-
      een rapport over een essentiële wijziging of een ontmanteling als bedoeld in de [artikelen 45e][ref1] en
      [45i van de wet][ref2] heeft ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel45e
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel45i
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: 45e
      - id: ref2
        bwb_id: BWBR0014168
        artikel: 45i
  - number: '40.2'
    text: |-
      De inspecteur-generaal der mijnen informeert Onze Minister over de ontvangst van een werkprogramma of een rapport
      als bedoeld in het eerste lid, onderdeel b, onder 1°, respectievelijk 2°.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel40
  - number: 40a.1
    text: |-
      De houder van een vergunning als bedoeld in de [artikelen 6][ref1], [24b][ref2] en [25 van de wet][ref3] overlegt
      voor een mijnbouwwerk als bedoeld in[ artikel 40, eerste lid][ref4], een verwijderingsplan als bedoeld in
      [artikel 44, derde lid, van de wet][ref5], tenzij:


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel24b
      [ref3]: https://wetten.overheid.nl/BWBR0014168#Artikel25
      [ref4]: https://wetten.overheid.nl/BWBR0014394#Artikel40
      [ref5]: https://wetten.overheid.nl/BWBR0014168#Artikel44
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel40a
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: 24b
      - id: ref3
        bwb_id: BWBR0014168
        artikel: '25'
      - id: ref4
        bwb_id: BWBR0014394
        artikel: '40'
        hoofdstuk: '5'
        paragraaf: 5.1.4
        afdeling: '5.1'
      - id: ref5
        bwb_id: BWBR0014168
        artikel: '44'
  - number: 40a.1.a
    text: |-
      Onze Minister voor dat mijnbouwwerk een vergunning als bedoeld in [artikel 40, eerste lid, onderdeel a][ref1],
      heeft verstrekt of


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel40
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel40a
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: '40'
        hoofdstuk: '5'
        paragraaf: 5.1.4
        afdeling: '5.1'
  - number: 40a.1.b
    text: |-
      naar het oordeel van de inspecteur-generaal der mijnen voor dat mijnbouwwerk met een werkprogramma of een rapport
      als bedoeld in [artikel 40, eerste lid, onderdeel b, onder 1°, respectievelijk 2°][ref1], in de verwijdering van
      het mijnbouwwerk is voorzien.


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel40
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel40a
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: '40'
        hoofdstuk: '5'
        paragraaf: 5.1.4
        afdeling: '5.1'
  - number: 40a.2
    text: |-
      De inspecteur-generaal der mijnen informeert Onze Minister over het oordeel, bedoeld in het eerste lid, onderdeel
      b.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel40a
  - number: 40b.1
    text: |-
      Bij de melding, bedoeld in [artikel 44, eerste lid, van de wet][ref1] vermeldt de houder van een vergunning als
      bedoeld in de [artikelen 6][ref2], [24b][ref3] en [25 van de wet][ref4] in ieder geval:


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0014168#Artikel24b
      [ref4]: https://wetten.overheid.nl/BWBR0014168#Artikel25
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel40b
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '44'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0014168
        artikel: 24b
      - id: ref4
        bwb_id: BWBR0014168
        artikel: '25'
  - number: 40b.1.a
    text: de locatie van het mijnbouwwerk;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel40b
  - number: 40b.1.b
    text: de datum waarop het mijnbouwwerk buiten werking is gesteld;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel40b
  - number: 40b.1.c
    text: de wijze waarop het mijnbouwwerk buiten werking is gesteld;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel40b
  - number: 40b.1.d
    text: |-
      in het geval van een mijnbouwwerk voor zoutwinning welke maatregelen zijn genomen om de holruimte te monitoren
      vanuit een analyse in een systeembenadering van de risico’s van dat mijnbouwwerk;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel40b
  - number: 40b.1.e
    text: |-
      bij een mijnbouwwerk anders dan een mijnbouwwerk voor zoutwinning, welke maatregelen noodzakelijk zijn aan de hand
      van de specifieke risico’s van dat mijnbouwwerk.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel40b
  - number: 40b.2
    text: Van de melding, bedoeld in het eerste lid, wordt door Onze Minister mededeling gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel40b
  - number: 40c.1
    text: |-
      De aanvraag tot instemming met een verwijderingsplan als bedoeld in [artikel 44a, eerste lid van de wet][ref1]
      bevat ten minste een beschrijving van:


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel44a
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel40c
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: 44a
  - number: 40c.1.a
    text: |-
      de aanduiding, locatie, aard en functie van het mijnbouwwerk ten tijde van de aanvraag om instemming met het
      verwijderingsplan;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel40c
  - number: 40c.1.b
    text: |-
      de activiteiten, bedoeld in [artikel 74, eerste lid][ref1], die hebben geleid tot wijziging van de inrichting van
      het boorgat;


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel74
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel40c
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: '74'
        hoofdstuk: '5'
        paragraaf: 5.3.2
        afdeling: '5.3'
  - number: 40c.1.c
    text: de afspraken met de eigenaar van het terrein waarop het mijnbouwwerk is opgericht en andere belanghebbenden;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel40c
  - number: 40c.1.d
    text: |-
      de methode en een schatting van de kosten van het buiten gebruik stellen van een boorgat en het verwijderen van de
      bovengrondse installaties;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel40c
  - number: 40c.1.e
    text: de staat waarin het ondergrondse deel van het mijnbouwwerk wordt achtergelaten;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel40c
  - number: 40c.1.f
    text: |-
      de datum van indiening van het werkprogramma voor het buiten gebruik stellen van een boorgat en de planning van
      de uitvoering;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel40c
  - number: 40c.1.g
    text: het schoon en veilig achterlaten of verwijderen van kabels en pijpleidingen;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel40c
  - number: 40c.1.h
    text: de wijze waarop de materialen die bij het mijnbouwwerk behoren, worden afgevoerd en de bestemming ervan;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel40c
  - number: 40c.1.i
    text: |-
      de op het mijnbouwwerk aanwezige afvalstoffen als bedoeld in
      [artikel 1.1, eerste lid, van de Wet milieubeheer][ref1] en de bestemming ervan;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel1
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel40c
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '1'
  - number: 40c.1.j
    text: |-
      de risico’s van een mijnbouwwerk dat is gebruikt voor de winning van zout na verwijdering van de bovengrondse
      installaties en het buiten gebruik stellen van het boorgat aan de hand van een analyse van deze risico’s in een
      systeembenadering en de bij dat mijnbouwwerk te nemen beheersmaatregelen, waaronder een beschrijving van een uit te
      voeren monitoring, indien:
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel40c
  - number: 40c.1.j.1°
    text: die beheersmaatregelen nodig zijn in het belang van de veiligheid of het milieu en
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel40c
  - number: 40c.1.j.2°
    text: |-
      deze risico’s of beheersmaatregelen niet zijn beschreven in een winningsplan als bedoeld in
      [artikel 34, eerste lid][ref1], een opslagplan als bedoeld in [artikel 39, eerste lid, van de wet][ref2], of een
      meetplan als bedoeld in [artikel 30, derde lid][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel39
      [ref3]: https://wetten.overheid.nl/BWBR0014394#Artikel30
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel40c
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: '34'
        hoofdstuk: '5'
        paragraaf: 5.1.1
        afdeling: '5.1'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '39'
      - id: ref3
        bwb_id: BWBR0014394
        artikel: '30'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 40c.1.k
    text: |-
      de maatregelen die worden genomen om het terrein waarop het mijnbouwwerk is opgericht en de bodem van het terrein
      zoveel mogelijk in de oorspronkelijke staat terug te brengen of in het geval het terrein of de bodem niet in de
      oorspronkelijke staat worden teruggebracht, de toestand waarin het terrein na uitvoering van het verwijderingsplan
      wordt achtergelaten;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel40c
  - number: 40c.1.l
    text: het beoogde gebruik van het terrein; en
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel40c
  - number: 40c.1.m
    text: |-
      in geval van een gedeeltelijke verwijdering van het mijnbouwwerk voor welk doel het mijnbouwwerk wordt hergebruikt
      en een beschrijving daarvan.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel40c
  - number: 40c.2
    text: |-
      Het verwijderingsplan vermeldt binnen welke perioden de beschreven werkzaamheden beginnen en eindigen en kan in een
      fasering van de verwijdering voorzien.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel40c
  - number: 40c.3
    text: |-
      In afwijking van het eerste lid, aanhef, kan bij het overleggen van informatie als bedoeld in het eerste lid,
      onderdelen a tot en met k, worden volstaan met een verwijzing naar informatie die is of wordt overgelegd bij
      een aanvraag om een vergunning, een melding of de naleving van een verplichting tot het overleggen van gegevens
      en bescheiden krachtens de wet, respectievelijk de [Omgevingswet][ref1], in het geval die informatie de
      relevante feiten bevat of zal bevatten die nodig zijn voor een besluit tot instemming met het verwijderingsplan,
      respectievelijk een besluit tot instemming met het verwijderingsplan onder het stellen van voorwaarden of
      voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0037885
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel40c
    references:
      - id: ref1
        bwb_id: BWBR0037885
  - number: 40c.4
    text: Onze Minister beslist binnen dertien weken na het overleggen van een verwijderingsplan over de instemming.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel40c
  - number: 40c.5
    text: Van de instemming, bedoeld in het eerste lid, wordt door Onze Minister mededeling gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel40c
  - number: 40c.6
    text: |-
      Met toepassing van [artikel 28, eerste lid, laatste zinsnede, van de Dienstenwet][ref1] is
      [paragraaf 4.1.3.3. van de Algemene wet bestuursrecht][ref2] niet van toepassing op een aanvraag tot instemming met
      een verwijderingsplan.


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel40c
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: 40d.1
    text: |-
      Onze Minister kan aan de houder van een vergunning als bedoeld in de [artikelen 6][ref1], [24b][ref2] en [25][ref3]
      van de wet een instemming met een verwijderingsplan, bedoeld in [artikel 44a, eerste lid, van de wet][ref4]
      weigeren, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel24b
      [ref3]: https://wetten.overheid.nl/BWBR0014168#Artikel25
      [ref4]: https://wetten.overheid.nl/BWBR0014168#Artikel44a
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel40d
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: 24b
      - id: ref3
        bwb_id: BWBR0014168
        artikel: '25'
      - id: ref4
        bwb_id: BWBR0014168
        artikel: 44a
  - number: 40d.1.a
    text: |-
      het verwijderingsplan onvoldoende voorziet in een beschrijving van werkzaamheden, methode en kosten van de
      verwijdering die nodig zijn gedurende de periode van uitvoering van het verwijderingsplan, waaronder monitoring;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel40d
  - number: 40d.1.b
    text: het verwachte resultaat van de uitvoering van het verwijderingsplan onvoldoende is beschreven;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel40d
  - number: 40d.1.c
    text: het mijnbouwwerk in aanmerking komt voor hergebruik;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel40d
  - number: 40d.1.d
    text: |-
      het mijnbouwwerk niet in aanmerking komt voor het in de aanvraag beschreven gedeeltelijk hergebruik als
      mijnbouwwerk;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel40d
  - number: 40d.1.e
    text: |-
      in het geval van hergebruik het bevoegd gezag, bedoeld in [artikel 44a, tweede lid, van de wet][ref1], voor zover
      het hergebruik betreft, geen verklaring van geen bedenkingen heeft gegeven;


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel44a
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel40d
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: 44a
  - number: 40d.1.f
    text: |-
      naar het oordeel van het bevoegde gezag krachtens de [Omgevingswet][ref1] het voorstel tot onderzoeken of saneren
      van de bodem niet voldoet;


      [ref1]: https://wetten.overheid.nl/BWBR0037885
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel40d
    references:
      - id: ref1
        bwb_id: BWBR0037885
  - number: 40d.1.g
    text: de bestemming van de af te voeren materialen en afvalstoffen onduidelijk is;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel40d
  - number: 40d.1.h
    text: de planning van de uitvoering van de verwijdering niet duidelijk is of voorziet in een onredelijk lange termijn;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel40d
  - number: 40d.1.i
    text: 'de verwijdering van een mijnbouwwerk voor de winning van zout leidt tot:'
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel40d
  - number: 40d.1.i.1°
    text: |-
      meer bodembeweging, dan blijkt uit een beschrijving als bedoeld in
      [artikel 35, eerste lid, onder f, van de wet][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel35
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel40d
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '35'
  - number: 40d.1.i.2°
    text: |-
      een andere wijze van het buiten gebruik stellen van een holruimte dan blijkt uit een beschrijving als bedoeld in
      [artikel 25, eerste lid, onder f][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel25
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel40d
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 40d.2
    text: 'Onze Minister kan een instemming ambtshalve geheel of gedeeltelijk wijzigen of intrekken, indien:'
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel40d
  - number: 40d.2.a
    text: |-
      het bevoegde gezag, bedoeld in het eerste lid, onderdelen e en f, tot een afwijzend oordeel komt over het geheel of
      gedeeltelijk hergebruik van het mijnbouwwerk;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel40d
  - number: 40d.2.b
    text: |-
      het bevoegde gezag krachtens de wet geen vergunning verstrekt voor het opsporen, winnen, of opslaan van
      delfstoffen, aardwarmte, respectievelijk stoffen;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel40d
  - number: 40d.2.c
    text: |-
      de houder van een vergunning de instemming voor het geheel of een gedeelte van het verwijderingsplan niet langer
      nodig heeft; of
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel40d
  - number: 40d.2.d
    text: de houder van een vergunning niet overeenkomstig de instemming handelt of heeft gehandeld.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel40d
  - number: 40e.1
    text: |-
      Onze Minister kan aan de houder van een vergunning als bedoeld in de [artikelen 6][ref1], [24b][ref2] en
      [25 van de wet][ref3] een tijdelijke ontheffing als bedoeld in [artikel 44b, eerste lid, van de wet][ref4]
      verlenen, indien het mijnbouwwerk:


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel24b
      [ref3]: https://wetten.overheid.nl/BWBR0014168#Artikel25
      [ref4]: https://wetten.overheid.nl/BWBR0014168#Artikel44b
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel40e
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: 24b
      - id: ref3
        bwb_id: BWBR0014168
        artikel: '25'
      - id: ref4
        bwb_id: BWBR0014168
        artikel: 44b
  - number: 40e.1.a
    text: |-
      nodig is voor het gebruik van een ander mijnbouwwerk als bedoeld in
      [artikel 2, eerste lid, onderdelen a tot en met h][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel2
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel40e
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: '2'
        hoofdstuk: '1'
        paragraaf: '1.1'
  - number: 40e.1.b
    text: |-
      doelmatiger kan worden verwijderd of hergebruikt, indien de houder van een vergunning het mijnbouwwerk tezamen met
      een ander mijnbouwwerk verwijdert of hergebruikt;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel40e
  - number: 40e.1.c
    text: |-
      in aanmerking komt voor geheel of gedeeltelijk hergebruik als onderzoek is of wordt verricht naar de geschiktheid
      voor opsporing of winning van delfstoffen of aardwarmte of de opslag van stoffen;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel40e
  - number: 40e.1.d
    text: 'redelijkerwijs rendabel opnieuw in gebruik genomen kan worden na:'
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel40e
  - number: 40e.1.d.1°
    text: |-
      verbetering van de omstandigheden op de markt voor koolwaterstoffen, andere delfstoffen, aardwarmte,
      respectievelijk de opslag van stoffen;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel40e
  - number: 40e.1.d.2°
    text: |-
      een technische innovatie voor de winning van koolwaterstoffen, andere delfstoffen, aardwarmte, respectievelijk de
      opslag van stoffen; of
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel40e
  - number: 40e.1.e
    text: in aanmerking komt voor een ander hergebruik dan het exploiteren van een mijnbouwwerk.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel40e
  - number: 40e.2
    text: |-
      Onze Minister vraagt advies over een aanvraag om ontheffing van de verplichting tot verwijderen als bedoeld in
      [artikel 44, tweede lid, van de wet ][ref1]voor het opnieuw in gebruik nemen:


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel44
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel40e
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '44'
  - number: 40e.2.a
    text: |-
      als bedoeld in het eerste lid, onderdeel d, voor de winning van koolwaterstoffen, aardwarmte en de opslag van CO
      aan de vennootschap, bedoeld in [artikel 82, eerste lid, van de wet][ref1] en


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel82
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel40e
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '82'
  - number: 40e.2.b
    text: |-
      als bedoeld in het eerste lid, onderdeel d, onder 2°, tevens aan de Nederlandse Organisatie voor toegepast-
      natuurwetenschappelijk onderzoek TNO als bedoeld in [artikel 3 van de TNO-wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003906#Artikel3
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel40e
    references:
      - id: ref1
        bwb_id: BWBR0003906
        artikel: '3'
  - number: 40e.3
    text: |-
      Onze Minister kan de ontheffing voor hergebruik van het mijnbouwwerk voor een periode van maximaal vijf jaar
      verlenen.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel40e
  - number: 40e.4
    text: Onze Minister kan de ontheffing telkens voor een periode van maximaal vijf jaar verlengen.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel40e
  - number: 40e.5
    text: |-
      Met toepassing van [artikel 28, eerste lid, laatste zinsnede, van de Dienstenwet][ref1] is
      [paragraaf 4.1.3.3. van de Algemene wet bestuursrecht][ref2] niet van toepassing op een aanvraag om een ontheffing.


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel40e
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: 40e.6
    text: |-
      Onze Minister kan, onverminderd [artikel 7, derde lid][ref1], een ontheffing ambtshalve geheel of gedeeltelijk
      wijzigen of intrekken, indien de houder van een vergunning:


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel7
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel40e
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: '7'
        hoofdstuk: '1'
        paragraaf: '1.2'
  - number: 40e.6.a
    text: de ontheffing niet langer nodig heeft om in een hergebruik van het mijnbouwwerk te kunnen voorzien;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel40e
  - number: 40e.6.b
    text: niet overeenkomstig de ontheffing handelt of heeft gehandeld.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel40e
  - number: 40f.1
    text: |-
      Onze Minister kan aan de houder van een vergunning als bedoeld in de [artikelen 6][ref1], [24b][ref2] en
      [25 van de wet][ref3] een instemming met een rapport over de verwijdering, bedoeld in artikel 44c, derde lid, van
      de wet weigeren als het rapport:


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel24b
      [ref3]: https://wetten.overheid.nl/BWBR0014168#Artikel25
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel40f
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: 24b
      - id: ref3
        bwb_id: BWBR0014168
        artikel: '25'
  - number: 40f.1.a
    text: onvoldoende informatie bevat;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel40f
  - number: 40f.1.b
    text: het mijnbouwwerk niet is verwijderd overeenkomstig het verwijderingsplan waarmee is ingestemd; of
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel40f
  - number: 40f.1.c
    text: niet is verwijderd overeenkomstig de voorschriften die aan de instemming zijn verbonden.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel40f
  - number: 40f.2
    text: |-
      Met toepassing van [artikel 28, eerste lid, laatste zinsnede, van de Dienstenwet][ref1] is
      [paragraaf 4.1.3.3. van de Algemene wet bestuursrecht][ref2] niet van toepassing op een aanvraag tot instemming met
      het rapport over de verwijdering.


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel40f
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: 40g
    text: |-
      Bij ministeriële regeling worden regels gesteld over de inhoud van het nazorgplan, bedoeld in
      [artikel 52g, derde lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel52g
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel40g
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: 52g
  - number: '41'
    text: Deze afdeling is van toepassing op mijnbouwinstallaties.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel41
  - number: '42.1'
    text: |-
      [Artikel 35][ref1] is van overeenkomstige toepassing op mijnbouwinstallaties die boven oppervlaktewater uitsteken.


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel35
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: '35'
        hoofdstuk: '5'
        paragraaf: 5.1.1
        afdeling: '5.1'
  - number: '42.2'
    text: |-
      [Artikel 37, tweede en derde lid][ref1], is van overeenkomstige toepassing op mijnbouwinstallaties.


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel37
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: '37'
        hoofdstuk: '5'
        paragraaf: 5.1.2
        afdeling: '5.1'
  - number: '43'
    text: Deze paragraaf heeft betrekking op mijnbouwinstallaties die boven oppervlaktewater uitsteken.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel43
  - number: '46'
    text: Bij het plaatsen van een mijnbouwinstallatie worden maatregelen genomen ter voorkoming van schade.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel46
  - number: '47'
    text: |-
      Het plaatsen van een mijnbouwinstallatie gebeurt zodanig dat in de zeebodem aanwezige leidingen en kabels niet
      worden beschadigd.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel47
  - number: '48.1'
    text: 'Voorafgaande aan het plaatsen van een mijnbouwinstallatie verricht de uitvoerder onderzoek naar:'
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel48
  - number: 48.1.a
    text: |-
      de gesteldheid van de bodem waar de mijnbouwinstallatie geplaatst zal worden met het oog op de stabiliteit van de
      installatie, en
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel48
  - number: 48.1.b
    text: |-
      de aanwezigheid van obstakels in de onmiddellijke omgeving van de locatie waar de mijnbouwinstallatie geplaatst
      zal worden.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel48
  - number: '48.2'
    text: De uitvoerder meldt twee weken voor de uitvoering van het onderzoek dit voornemen aan de directeur Kustwacht.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel48
  - number: '49.1'
    text: |-
      Onmiddellijk na het plaatsen van de mijnbouwinstallatie, verstrekt de uitvoerder aan de inspecteur-generaal der
      mijnen nauwkeurige gegevens omtrent de locatie van de mijnbouwinstallatie.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel49
  - number: '49.2'
    text: |-
      In het geval een bestaande productie-installatie de Nederlandse wateren binnenkomt of verlaat, stelt de exploitant
      van de productie-installatie de inspecteur-generaal der mijnen binnen een bij ministeriële regeling vast te stellen
      termijn, die in ieder geval vóór de datum waarop de productie-installatie de Nederlandse wateren binnenkomt of
      verlaat ligt, hiervan op de hoogte.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel49
  - number: '50.1'
    text: |-
      Een mijnbouwinstallatie is voldoende sterk om de als gevolg van windsterkte, golfslag, zeestroming en gebruik van
      de installatie te verwachten krachten te weerstaan.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel50
  - number: '50.2'
    text: Een mijnbouwinstallatie mag niet verzakken, verschuiven of afdrijven.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel50
  - number: '50.3'
    text: Een mijnbouwinstallatie is met het oog op het landen van helikopters veilig geplaatst.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel50
  - number: '51.1'
    text: Een mijnbouwinstallatie is voorzien van een helikopterdek.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel51
  - number: '51.2'
    text: 'Het helikopterdek:'
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel51
  - number: 51.2.a
    text: is voldoende groot voor het gebruik door helikopters;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel51
  - number: 51.2.b
    text: is voorzien van markering en apparatuur voor het landen en stijgen van helikopters;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel51
  - number: 51.2.c
    text: is geschikt voor het parkeren van helikopters;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel51
  - number: 51.2.d
    text: ligt vrij ten opzichte van andere delen van de mijnbouwinstallatie, en
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel51
  - number: 51.2.e
    text: is vrij van obstakels en brandbare stoffen.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel51
  - number: '51.3'
    text: |-
      De uitvoerder overlegt aan Onze Minister van Infrastructuur en Milieu een gedetailleerde tekening van het
      helikopterdek en een tekening van de mijnbouwinstallatie waarop het helikopterdek is aangegeven.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel51
  - number: '51.4'
    text: |-
      Het helikopterdek wordt slechts gebruikt na instemming door Onze Minister van Infrastructuur en Milieu. Instemming
      wordt slechts geweigerd op grond van de eisen van het tweede lid. De instemming geldt voor een periode van maximaal
      drie jaar.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel51
  - number: '51.5'
    text: |-
      Onze Minister kan ontheffing verlenen van het eerste lid. De ontheffing kan onder
      beperkingen worden verleend of daaraan kunnen voorschriften worden verbonden. Met
      toepassing van [artikel 28, eerste lid, laatste zinsnede, van de Dienstenwet][ref1] is
      [paragraaf 4.1.3.3. van de Algemene wet bestuursrecht][ref2] niet van toepassing op de aanvraag om een ontheffing.


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: '51.6'
    text: |-
      Bij regeling van Onze Minister van Infrastructuur en Milieu worden nadere regels gesteld omtrent de in het tweede
      lid genoemde eisen.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel51
  - number: '52.1'
    text: 'Een mijnbouwinstallatie is ter waarborging van de veiligheid voorzien van:'
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel52
  - number: 52.1.a
    text: herkenningstekens,
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel52
  - number: 52.1.b
    text: geluidsbakens,
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel52
  - number: 52.1.c
    text: lichtbakens, en
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel52
  - number: 52.1.d
    text: 'voor zover Onze Minister van Infrastructuur en Milieu zulks bepaalt: elektronische bakens of radarreflectoren.'
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel52
  - number: '52.2'
    text: |-
      De mijnbouwinstallatie is voorts voorzien van communicatiemiddelen waarmee onder alle omstandigheden verbinding
      mogelijk is met de vaste wal en met vaartuigen, die voor verkenning, opsporing of winning in gebruik zijn.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel52
  - number: '52.3'
    text: |-
      Een mijnbouwinstallatie is verder voorzien van apparatuur waarmee meteorologisch en oceanografische waarnemingen
      worden verricht, voor zover Onze Minister van Infrastructuur en Milieu zulks bepaalt.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel52
  - number: '52.4'
    text: 'De in het eerste lid, onderdeel a, bedoelde herkenningstekens:'
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel52
  - number: 52.4.a
    text: |-
      bestaan voor een voor de winning bestemde mijnbouwinstallatie uit de indicatie van het vergunningsgebied waarin
      de mijnbouwinstallatie is geplaatst met daaraan een toevoeging, waardoor een unieke aanduiding ontstaat; die
      aanduiding is eenmalig en kan niet gewijzigd worden;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel52
  - number: 52.4.b
    text: |-
      zijn voor een voor de opsporing gebruikte mijnbouwinstallatie een unieke aanduiding die in het internationaal
      verkeer wordt gebruikt.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel52
  - number: '52.5'
    text: |-
      De ononderbroken werking van de in het eerste lid, onderdelen b en c, bedoelde licht- en geluidsbakens is
      gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel52
  - number: '52.6'
    text: |-
      Onze Minister van Infrastructuur en Milieu kan ontheffing verlenen van de in het eerste lid, onderdelen b en
      c, bedoelde verplichtingen. De ontheffing kan onder beperkingen worden verleend of daaraan kunnen voorschriften
      worden verbonden. Met toepassing van [artikel 28, eerste lid, laatste zinsnede, van de Dienstenwet][ref1] is
      [paragraaf 4.1.3.3. van de Algemene wet bestuursrecht][ref2] niet van toepassing op de aanvraag om een ontheffing.


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: '52.7'
    text: |-
      Op verzoek van Onze Minister van Infrastructuur en Milieu toont de uitvoerder aan dat de desbetreffende apparatuur,
      bedoeld in het eerste lid, voldoet aan de bij of krachtens dit artikel gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel52
  - number: '52.8'
    text: |-
      Bij ministeriële regeling, in overeenstemming met Onze Minister van Infrastructuur en Milieu, worden regels
      gesteld omtrent de in het eerste lid bedoelde herkenningstekens, bakens, reflectoren, de in het tweede lid bedoelde
      communicatiemiddelen en de in het derde lid genoemde apparatuur en waarnemingen, alsmede het verstrekken van de
      daarmee verkregen gegevens aan Onze Minister van Infrastructuur en Milieu.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel52
  - number: '53.1'
    text: |-
      De uitvoerder is verplicht de technische integriteit van een voor de winning of opslag bestemde mijnbouwinstallatie
      te onderzoeken. De uitvoerder stelt daartoe iedere vijf jaar een onderzoeksprogramma op.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel53
  - number: '53.2'
    text: |-
      Het onderzoeksprogramma beschrijft voor elk jaar welke onderdelen van de mijnbouwinstallatie op welke wijze worden
      onderzocht op de technische integriteit.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel53
  - number: '53.3'
    text: |-
      Bij ministeriële regeling worden regels gesteld omtrent de inhoud van het onderzoeksprogramma en de in het tweede
      lid bedoelde jaarlijkse onderzoeken.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel53
  - number: '53.4'
    text: |-
      De uitvoerder verstrekt Onze Minister het onderzoeksprogramma voor het eerst samen met de verklaringen, bedoeld in
      artikel 53a, eerste lid, onderdelen a en b.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel53
  - number: 53a.1
    text: |-
      De uitvoerder verstrekt aan de inspecteur-generaal der mijnen uiterlijk twee dagen voordat een voor de winning of
      opslag bestemde mijnbouwinstallatie in gebruik wordt genomen:
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel53a
  - number: 53a.1.a
    text: |-
      een verklaring van een onafhankelijke deskundige dat de technische integriteit van de mijnbouwinstallatie
      gewaarborgd is gezien het ontwerp, de bouw en de plaatsing;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel53a
  - number: 53a.1.b
    text: |-
      een verklaring van een onafhankelijke deskundige dat het onderzoeksprogramma, bedoeld in [artikel 53][ref1], voor
      de mijnbouwinstallatie voldoet.


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel53
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel53a
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: '53'
        hoofdstuk: '5'
        paragraaf: 5.2.2
        afdeling: '5.2'
  - number: 53a.2
    text: |-
      Nadat de mijnbouwinstallatie in gebruik is genomen verstrekt de uitvoerder voorts de in het eerste lid bedoelde
      gegevens telkens een maand voor de afloop van een periode van vijf jaar, waarvan de eerste periode ingaat op de
      eerste dag van de maand die volgt op die van de ingebruikneming.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel53a
  - number: 53a.3
    text: Bij ministeriële regeling kunnen regels worden gesteld omtrent de in het eerste lid bedoelde verklaringen.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel53a
  - number: '54.1'
    text: |-
      Indien de sterkte of stabiliteit van een mijnbouwinstallatie wordt of dreigt te worden aangetast, doet de
      uitvoerder hiervan onmiddellijk mededeling aan de inspecteur-generaal der mijnen.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel54
  - number: '54.2'
    text: |-
      In geval van een voor de opsporing bestemde mijnbouwinstallatie treft de uitvoerder onmiddellijk passende
      maatregelen en doet daarvan mededeling aan de inspecteur-generaal der mijnen.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel54
  - number: '54.3'
    text: |-
      In geval van een voor de winning bestemde mijnbouwinstallatie treft de uitvoerder onmiddellijk passende
      herstelmaatregelen. Na herstel van de installatie verstrekt de uitvoerder de inspecteur-generaal der mijnen een
      verklaring van een onafhankelijke deskundige, waarin de sterkte en stabiliteit van de installatie wordt beoordeeld.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel54
  - number: '55.1'
    text: |-
      Het is verboden zonder instemming van Onze Minister een uitsluitend voor de winning bestemde mijnbouwinstallatie
      te plaatsen. Het verzoek tot instemming wordt uiterlijk acht weken voor aanvang van de beoogde plaatsing van de
      mijnbouwinstallatie ingediend.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel55
  - number: '55.2'
    text: |-
      De instemming wordt geweigerd indien de mijnbouwinstallatie niet voldoet aan de eisen en normen, vastgelegd in de
      [artikelen 46][ref1], [47][ref2], [50][ref3], [51][ref4] en [52][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0014394#Artikel47
      [ref3]: https://wetten.overheid.nl/BWBR0014394#Artikel50
      [ref4]: https://wetten.overheid.nl/BWBR0014394#Artikel51
      [ref5]: https://wetten.overheid.nl/BWBR0014394#Artikel52
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: '46'
        hoofdstuk: '5'
        paragraaf: 5.2.2
        afdeling: '5.2'
      - id: ref2
        bwb_id: BWBR0014394
        artikel: '47'
        hoofdstuk: '5'
        paragraaf: 5.2.2
        afdeling: '5.2'
      - id: ref3
        bwb_id: BWBR0014394
        artikel: '50'
        hoofdstuk: '5'
        paragraaf: 5.2.2
        afdeling: '5.2'
      - id: ref4
        bwb_id: BWBR0014394
        artikel: '51'
        hoofdstuk: '5'
        paragraaf: 5.2.2
        afdeling: '5.2'
      - id: ref5
        bwb_id: BWBR0014394
        artikel: '52'
        hoofdstuk: '5'
        paragraaf: 5.2.2
        afdeling: '5.2'
  - number: '55.3'
    text: |-
      De instemming kan slechts worden geweigerd in verband met risico op schade of in verband met de opwekking van
      elektriciteit.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel55
  - number: '55.4'
    text: |-
      De instemming kan onder beperkingen worden verleend en daaraan kunnen voorschriften worden verbonden in verband met
      risico op schade of in verband met de opwekking van elektriciteit.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel55
  - number: '55.5'
    text: |-
      De instemming is van rechtswege gegeven, indien Onze Minister over een verzoek tot instemming niet binnen acht
      weken na ontvangst heeft beslist. De instemming van rechtswege wordt voor de mogelijkheid van bezwaar en beroep
      gelijkgesteld met een besluit als bedoeld in [artikel 1:3, eerste lid, van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel1
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '1'
  - number: '55.6'
    text: |-
      Op een voor de opsporing bestemde mijnbouwinstallatie, voorzover deze wordt geplaatst op een alleen voor opsporing
      bestemde locatie, is het eerste tot en met vijfde lid van overeenkomstige toepassing, met dien verstande dat in
      plaats van een instemmingstermijn van acht weken telkens wordt gelezen een termijn van twee weken.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel55
  - number: '55.7'
    text: |-
      De uitvoerder doet uiterlijk drie dagen voor de beoogde datum van de plaatsing van een voor de opsporing bestemde
      mijnbouwinstallatie op een voor winning bestemde locatie schriftelijk mededeling hiervan aan de inspecteur-generaal
      der mijnen. Bij de mededeling wordt een verklaring van een onafhankelijke deskundige overgelegd dat de technische
      integriteit van de te plaatsen mijnbouwinstallatie gewaarborgd is. Overlegging van deze verklaring is niet vereist
      indien deze niet ouder is dan vijf jaar en de verklaring reeds eerder is verstrekt.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel55
  - number: '55.8'
    text: |-
      Op een geheel of gedeeltelijk voor de opslag bestemde mijnbouwinstallatie is het eerste tot en met vierde lid van
      overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel55
  - number: '56.1'
    text: |-
      Bij het verzoek om instemming als bedoeld in [artikel 55, eerste lid][ref1], worden in ieder geval overgelegd:


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel55
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: '55'
        hoofdstuk: '5'
        paragraaf: 5.2.2
        afdeling: '5.2'
  - number: 56.1.a
    text: gegevens omtrent de aanwezigheid van leidingen en kabels in de nabijheid van de beoogde plaats van plaatsing;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel56
  - number: 56.1.b
    text: |-
      gegevens omtrent de gesteldheid van de bodem en de aanwezigheid van obstakels als bedoeld in [artikel 48][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel48
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: '48'
        hoofdstuk: '5'
        paragraaf: 5.2.2
        afdeling: '5.2'
  - number: 56.1.c
    text: |-
      bij een voor de winning of opslag bestemde mijnbouwinstallatie: het ontwerp van de dragende constructie alsmede
      een beschrijving van de wijze van plaatsing en een opgave van de herkenningstekens, geluidsbakens, lichtbakens en,
      voor zover Onze Minister van Infrastructuur en Milieu zulks bepaalt, elektronische bakens of radarreflectoren van
      de mijnbouwinstallatie;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel56
  - number: 56.1.d
    text: |-
      bij een voor de opsporing bestemde mijnbouwinstallatie op een voor de opsporing bestemde locatie: een verklaring
      van een onafhankelijke deskundige dat de technische integriteit van de mijnbouwinstallatie gewaarborgd is, met dien
      verstande dat:
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel56
  - number: 56.1.d.1°
    text: |-
      overlegging niet noodzakelijk is indien de verklaring niet ouder is dan vijf jaar en de verklaring reeds eerder
      is verstrekt;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel56
  - number: 56.1.d.2°
    text: |-
      [artikel 53a, tweede lid][ref1], van overeenkomstige toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel53a
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: 53a
        hoofdstuk: '5'
        paragraaf: 5.2.2
        afdeling: '5.2'
  - number: 56.1.e
    text: |-
      bij een voor de winning of opslag bestemde mijnbouwinstallatie: een verklaring van een onafhankelijke deskundige
      dat naar zijn voorlopige oordeel de te plaatsen mijnbouwinstallatie voldoet aan [artikel 50][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel50
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: '50'
        hoofdstuk: '5'
        paragraaf: 5.2.2
        afdeling: '5.2'
  - number: '56.2'
    text: Bij ministeriële regeling kunnen regels worden gesteld omtrent de in de onderdelen d en e bedoelde verklaring.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel56
  - number: '57'
    text: Deze paragraaf heeft betrekking op mijnbouwinstallaties die boven het oppervlaktewater uitsteken.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel57
  - number: '58'
    text: |-
      De houder van een vergunning als bedoeld in de [artikelen 6][ref1] en [25 van de wet][ref2] is niet gehouden een
      melding als bedoeld in [artikel 44, eerste lid, van de wet][ref3] te doen in het geval de mijnbouwinstallatie voor
      een periode van maximaal een jaar buiten werking is, als gevolg van:


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0014168#Artikel44
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '25'
      - id: ref3
        bwb_id: BWBR0014168
        artikel: '44'
  - number: 58.a
    text: |-
      het uitvoeren van reparatie, onderhoud of aanpassingen van het gedeelte van de mijnbouwinstallatie boven de
      waterbodem;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel58
  - number: 58.b
    text: |-
      het uitvoeren van een werkprogramma als bedoeld in [artikel 74, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel74
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: '74'
        hoofdstuk: '5'
        paragraaf: 5.3.2
        afdeling: '5.3'
  - number: 58.c
    text: het doen van onderzoek na een ongeluk of een incident;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel58
  - number: 58.d
    text: |-
      het doen van onderzoek naar de mogelijkheden en effecten van de opsporing, winning of opslag in een gemeentelijk
      ingedeeld gebied;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel58
  - number: 58.e
    text: |-
      het niet kunnen uitvoeren van werkzaamheden door een van buiten komende oorzaak, waaronder het tijdelijk niet
      beschikbaar zijn van ondersteunende installaties, pijpleidingen, kabels, personeel, materialen, grondstoffen,
      hulpstoffen, of diensten van derden die noodzakelijk zijn voor het in werking houden van het mijnbouwwerk of het
      niet tijdig kunnen beschikken over de benodigde vergunningen of toestemmingen.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel58
  - number: '59.1'
    text: |-
      Een mijnbouwwerk als bedoeld in [artikel 2, eerste lid, onderdelen a tot en met g][ref1], dat verbonden is aan of
      onderdeel is van een mijnbouwinstallatie als bedoeld in [artikel 1, onderdeel o, van de wet][ref2] is een geval
      als bedoeld in [artikel 44, vijfde lid, van de wet][ref3], voor de toepassing van artikel 44, eerste lid, van de
      wet, tenzij:


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0014168#Artikel44
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: '2'
        hoofdstuk: '1'
        paragraaf: '1.1'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0014168
        artikel: '44'
  - number: 59.1.a
    text: |-
      Onze Minister voor dat mijnbouwwerk een aanvraag om een wijziging van een vergunning als bedoeld in
      [artikel 40, tweede lid, van de wet][ref1], of een verandering van een omgevingsvergunning als bedoeld in
      [artikel 5.1 van de Omgevingswet][ref2] heeft ontvangen;


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Artikel5
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '40'
      - id: ref2
        bwb_id: BWBR0037885
        artikel: '5'
  - number: 59.1.b
    text: 'de inspecteur-generaal der mijnen voor dat mijnbouwwerk:'
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel59
  - number: 59.1.b.1°
    text: |-
      een werkprogramma voor het buiten gebruik stellen van een boorgat als bedoeld in [artikel 74, eerste lid][ref1],
      heeft ontvangen;


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel74
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: '74'
        hoofdstuk: '5'
        paragraaf: 5.3.2
        afdeling: '5.3'
  - number: 59.1.b.2°
    text: |-
      een rapport over een essentiële wijziging of een ontmanteling als bedoeld in de [artikelen 45e][ref1] en
      [45i van de wet][ref2] heeft ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel45e
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel45i
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: 45e
      - id: ref2
        bwb_id: BWBR0014168
        artikel: 45i
  - number: '59.2'
    text: |-
      De inspecteur-generaal der mijnen informeert Onze Minister over de ontvangst van een werkprogramma of een rapport
      als bedoeld in het eerste lid, onderdeel b, onder 1°, respectievelijk 2°.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel59
  - number: '60.1'
    text: |-
      De houder van een vergunning als bedoeld in de [artikelen 6][ref1] en [25 van de wet][ref2] overlegt
      voor een mijnbouwwerk als bedoeld in [artikel 59, eerste lid][ref3], een verwijderingsplan als bedoeld in
      [artikel 44, derde lid, van de wet][ref4], tenzij:


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0014394#Artikel59
      [ref4]: https://wetten.overheid.nl/BWBR0014168#Artikel44
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '25'
      - id: ref3
        bwb_id: BWBR0014394
        artikel: '59'
        hoofdstuk: '5'
        paragraaf: 5.2.3
        afdeling: '5.2'
      - id: ref4
        bwb_id: BWBR0014168
        artikel: '44'
  - number: 60.1.a
    text: |-
      Onze Minister voor dat mijnbouwwerk een vergunning als bedoeld in [artikel 59, eerste lid, onderdeel a][ref1],
      heeft verstrekt of


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel59
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: '59'
        hoofdstuk: '5'
        paragraaf: 5.2.3
        afdeling: '5.2'
  - number: 60.1.b
    text: |-
      naar het oordeel van de inspecteur-generaal der mijnen voor dat mijnbouwwerk met een werkprogramma of een rapport
      als bedoeld in [artikel 59, eerste lid, onderdeel b, onder 1°, respectievelijk 2°][ref1], in de verwijdering van
      het mijnbouwwerk is voorzien.


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel59
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: '59'
        hoofdstuk: '5'
        paragraaf: 5.2.3
        afdeling: '5.2'
  - number: '60.2'
    text: |-
      De inspecteur-generaal der mijnen informeert Onze Minister over het oordeel, bedoeld in het eerste lid, onderdeel
      b.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel60
  - number: '61.1'
    text: |-
      Bij de melding, bedoeld in [artikel 44, eerste lid, van de wet][ref1] vermeldt de houder van een vergunning als
      bedoeld in de [artikelen 6][ref2] en [25 van de wet][ref3] in ieder geval:


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0014168#Artikel25
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '44'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0014168
        artikel: '25'
  - number: 61.1.a
    text: de locatie van de mijnbouwinstallatie;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel61
  - number: 61.1.b
    text: de datum waarop het mijnbouwwerk buiten werking is gesteld;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel61
  - number: 61.1.c
    text: de wijze waarop het mijnbouwwerk buiten werking is gesteld;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel61
  - number: 61.1.d
    text: |-
      op welke wijze derden waarvan apparatuur als bedoeld in [artikel 52, derde lid][ref1], op de mijnbouwinstallatie
      aanwezig is, zijn geïnformeerd.


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel52
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: '52'
        hoofdstuk: '5'
        paragraaf: 5.2.2
        afdeling: '5.2'
  - number: '61.2'
    text: Van de melding, bedoeld in het eerste lid, wordt door Onze Minister openbaar kennis gegeven in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel61
  - number: '62.1'
    text: |-
      De aanvraag tot instemming met een verwijderingsplan als bedoeld in [artikel 44a, eerste lid, van de wet][ref1]
      bevat ten minste een beschrijving van:


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel44a
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: 44a
  - number: 62.1.a
    text: |-
      de aanduiding, locatie, aard en functie van de mijnbouwinstallatie, waaronder apparatuur van derden, ten tijde van
      de aanvraag om instemming met het verwijderingsplan;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel62
  - number: 62.1.b
    text: |-
      de activiteiten, bedoeld in [artikel 74, eerste lid][ref1], die hebben geleid tot wijziging van de inrichting van
      het boorgat;


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel74
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: '74'
        hoofdstuk: '5'
        paragraaf: 5.3.2
        afdeling: '5.3'
  - number: 62.1.c
    text: de afspraken met de eigenaar van de waterbodem en andere belanghebbenden;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel62
  - number: 62.1.d
    text: |-
      de methode en een schatting van de kosten van het buiten gebruik stellen van een boorgat en het verwijderen van
      de mijnbouwinstallatie;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel62
  - number: 62.1.e
    text: de staat waarin het ondergrondse deel van het mijnbouwwerk wordt achtergelaten;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel62
  - number: 62.1.f
    text: |-
      de datum van indiening van het werkprogramma voor het buiten gebruik stellen van een boorgat en de planning van
      de uitvoering;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel62
  - number: 62.1.g
    text: het schoon en veilig achterlaten of verwijderen van kabels en pijpleidingen;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel62
  - number: 62.1.h
    text: de wijze waarop de materialen die bij het mijnbouwwerk behoren, worden afgevoerd en de bestemming ervan;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel62
  - number: 62.1.i
    text: |-
      de op de mijnbouwinstallatie aanwezige afvalstoffen als bedoeld in
      [artikel 1.1, eerste lid, van de Wet milieubeheer en de bestemming][ref1] ervan;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel1
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '1'
  - number: 62.1.j
    text: de maatregelen die worden genomen ter voorkoming van waterverontreiniging;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel62
  - number: 62.1.k
    text: |-
      de maatregelen die worden genomen om de waterbodem waarop de mijnbouwinstallatie is opgericht zoveel mogelijk in
      de oorspronkelijke staat terug te brengen of in het geval de waterbodem niet in de oorspronkelijke staat wordt
      teruggebracht, de toestand waarin de waterbodem na uitvoering van het verwijderingsplan wordt achtergelaten;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel62
  - number: 62.1.l
    text: het beoogde gebruik van de waterbodem; en
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel62
  - number: 62.1.m
    text: |-
      in geval van een gedeeltelijke verwijdering van het mijnbouwwerk voor welk doel het mijnbouwwerk wordt hergebruikt
      en een beschrijving daarvan.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel62
  - number: '62.2'
    text: |-
      Het verwijderingsplan vermeldt binnen welke perioden de beschreven werkzaamheden beginnen en eindigen en kan in een
      fasering van de verwijdering voorzien.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel62
  - number: '62.3'
    text: |-
      In afwijking van het eerste lid, aanhef, kan bij het overleggen van informatie als bedoeld in het eerste lid,
      onderdelen a tot en met k, worden volstaan met een verwijzing naar informatie die is of wordt overgelegd bij
      een aanvraag om een vergunning, een melding of de naleving van een verplichting tot het overleggen van gegevens
      en bescheiden krachtens de wet, respectievelijk de [Omgevingswet][ref1], in het geval die informatie de
      relevante feiten bevat of zal bevatten die nodig zijn voor een besluit tot instemming met het verwijderingsplan,
      respectievelijk een besluit tot instemming met het verwijderingsplan onder het stellen van voorwaarden of
      voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0037885
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0037885
  - number: '62.4'
    text: Onze Minister beslist binnen dertien weken na het overleggen van een verwijderingsplan over de instemming.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel62
  - number: '62.5'
    text: Van de instemming, bedoeld in het eerste lid, wordt door Onze Minister mededeling gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel62
  - number: '62.6'
    text: |-
      Met toepassing van [artikel 28, eerste lid, laatste zinsnede, van de Dienstenwet][ref1] is
      [paragraaf 4.1.3.3. van de Algemene wet bestuursrecht][ref2] niet van toepassing op de instemming met een
      verwijderingsplan.


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: 62a.1
    text: |-
      Onze Minister kan aan de houder van een vergunning als bedoeld in de [artikelen 6][ref1] en [25 van de wet][ref2]
      een instemming met een verwijderingsplan, bedoeld in artikel [44a, eerste lid, van de wet][ref3] weigeren, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0014168#Artikel44a
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel62a
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '25'
      - id: ref3
        bwb_id: BWBR0014168
        artikel: 44a
  - number: 62a.1.a
    text: |-
      het verwijderingsplan onvoldoende voorziet in een beschrijving van de werkzaamheden, methode en kosten van de
      verwijdering die nodig zijn gedurende de periode van uitvoering van het verwijderingsplan, waaronder monitoring;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel62a
  - number: 62a.1.b
    text: het verwachte resultaat van de uitvoering van het verwijderingsplan onvoldoende is beschreven;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel62a
  - number: 62a.1.c
    text: het mijnbouwwerk in aanmerking komt voor hergebruik;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel62a
  - number: 62a.1.d
    text: het mijnbouwwerk niet in aanmerking komt voor een gedeeltelijk hergebruik als mijnbouwwerk;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel62a
  - number: 62a.1.e
    text: |-
      in het geval van hergebruik het bevoegde gezag, bedoeld in [artikel 44a, tweede lid, van de wet][ref1], niet heeft
      verklaard dat het bevoegde gezag daartegen, voor zover het hergebruik betreft, geen bedenkingen heeft;


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel44a
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel62a
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: 44a
  - number: 62a.1.f
    text: |-
      naar het oordeel van het bevoegd gezag krachtens de [Omgevingswet][ref1] het voorstel tot onderzoeken of saneren
      van de bodem niet voldoet;


      [ref1]: https://wetten.overheid.nl/BWBR0037885
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel62a
    references:
      - id: ref1
        bwb_id: BWBR0037885
  - number: 62a.1.g
    text: de bestemming van de af te voeren materialen en afvalstoffen onduidelijk is; of
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel62a
  - number: 62a.1.h
    text: de planning van de uitvoering van de verwijdering niet duidelijk is of voorziet in een onredelijk lange termijn.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel62a
  - number: 62a.2
    text: 'Onze Minister kan een instemming ambtshalve geheel of gedeeltelijk wijzigen of intrekken, indien:'
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel62a
  - number: 62a.2.a
    text: |-
      het bevoegde gezag, bedoeld in het eerste lid, onderdelen e en f, krachtens wetten als bedoeld in die onderdelen
      tot een afwijzend oordeel komt over het geheel of gedeeltelijk hergebruik van het mijnbouwwerk;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel62a
  - number: 62a.2.b
    text: |-
      het bevoegde gezag krachtens de wet geen vergunning verstrekt voor het opsporen, winnen, of opslaan van
      delfstoffen, aardwarmte, respectievelijk stoffen;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel62a
  - number: 62a.2.c
    text: |-
      de houder van een vergunning de instemming voor het geheel of een gedeelte van het verwijderingsplan niet langer
      nodig heeft; of
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel62a
  - number: 62a.2.d
    text: de houder van een vergunning niet overeenkomstig de instemming handelt of heeft gehandeld.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel62a
  - number: 62b.1
    text: |-
      Onze Minister kan de houder van een vergunning als bedoeld in de [artikelen 6][ref1] en [25 van de wet][ref2]
      een tijdelijke ontheffing als bedoeld in [artikel 44b, eerste lid, van de wet][ref3], verlenen, indien de
      mijnbouwinstallatie of het mijnbouwwerk, bedoeld in [artikel 59, eerste lid][ref4]:


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0014168#Artikel44b
      [ref4]: https://wetten.overheid.nl/BWBR0014394#Artikel59
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel62b
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '25'
      - id: ref3
        bwb_id: BWBR0014168
        artikel: 44b
      - id: ref4
        bwb_id: BWBR0014394
        artikel: '59'
        hoofdstuk: '5'
        paragraaf: 5.2.3
        afdeling: '5.2'
  - number: 62b.1.a
    text: |-
      nodig is voor het gebruik van een ander mijnbouwwerk als bedoeld in
      [artikel 2, eerste lid, onderdelen a tot en met h][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel2
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel62b
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: '2'
        hoofdstuk: '1'
        paragraaf: '1.1'
  - number: 62b.1.b
    text: |-
      doelmatiger kan worden verwijderd of hergebruikt, indien de houder van een vergunning het mijnbouwwerk tezamen met
      een ander mijnbouwwerk verwijdert of hergebruikt;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel62b
  - number: 62b.1.c
    text: |-
      in aanmerking komt voor geheel of gedeeltelijk hergebruik als onderzoek is of wordt verricht naar de geschiktheid
      voor opsporing of winning van delfstoffen of aardwarmte of de opslag van stoffen;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel62b
  - number: 62b.1.d
    text: 'redelijkerwijs rendabel opnieuw in gebruik genomen kan worden na:'
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel62b
  - number: 62b.1.d.1°
    text: |-
      verbetering van de omstandigheden op de markt voor koolwaterstoffen, andere delfstoffen, aardwarmte,
      respectievelijk de opslag van stoffen;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel62b
  - number: 62b.1.d.2°
    text: |-
      een technische innovatie voor de winning van koolwaterstoffen, andere delfstoffen, aardwarmte, respectievelijk de
      opslag van stoffen; of
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel62b
  - number: 62b.1.e
    text: in aanmerking komt voor een ander hergebruik dan het exploiteren van een mijnbouwwerk.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel62b
  - number: 62b.2
    text: |-
      Onze Minister vraagt advies over een aanvraag om ontheffing van de verplichting tot verwijderen als bedoeld in
      [artikel 44, tweede lid, van de wet][ref1] voor het opnieuw in gebruik nemen:


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel44
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel62b
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '44'
  - number: 62b.2.a
    text: |-
      als bedoeld in het eerste lid, onderdeel d, voor de winning van koolwaterstoffen, aardwarmte en de opslag van CO
      aan de vennootschap, bedoeld in [artikel 82, eerste lid, van de wet][ref1] en


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel82
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel62b
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '82'
  - number: 62b.2.b
    text: |-
      als bedoeld in het eerste lid, onderdeel d, onder 2°, tevens aan de Nederlandse Organisatie voor toegepast-
      natuurwetenschappelijk onderzoek TNO als bedoeld in artikel 3 van de TNO-wet.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel62b
  - number: 62b.3
    text: |-
      Onze Minister kan de ontheffing voor hergebruik van de mijnbouwinstallatie voor een periode van maximaal vijf jaar
      verlenen.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel62b
  - number: 62b.4
    text: Onze Minister kan de ontheffing telkens voor een periode van maximaal vijf jaar verlengen.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel62b
  - number: 62b.5
    text: |-
      Met toepassing van [artikel 28, eerste lid, laatste zinsnede, van de Dienstenwet][ref1] is
      [paragraaf 4.1.3.3. van de Algemene wet bestuursrecht][ref2] niet van toepassing op de ontheffing.


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel62b
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: 62b.6
    text: |-
      Onze Minister kan, onverminderd [artikel 7, derde lid][ref1], een ontheffing ambtshalve geheel of gedeeltelijk
      wijzigen of intrekken, indien de houder van een vergunning:


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel7
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel62b
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: '7'
        hoofdstuk: '1'
        paragraaf: '1.2'
  - number: 62b.6.a
    text: de ontheffing niet langer nodig heeft om in een hergebruik van het mijnbouwwerk te kunnen voorzien;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel62b
  - number: 62b.6.b
    text: niet overeenkomstig de ontheffing handelt of heeft gehandeld.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel62b
  - number: 62c.1
    text: |-
      Onze Minister kan de houder van een vergunning als bedoeld in de [artikelen 6][ref1] en [25 van de wet][ref2] een
      instemming met een rapport over de verwijdering, bedoeld in [artikel 44c, derde lid, van de wet][ref3] weigeren als
      het rapport:


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0014168#Artikel44c
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel62c
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '25'
      - id: ref3
        bwb_id: BWBR0014168
        artikel: 44c
  - number: 62c.1.a
    text: onvoldoende informatie bevat;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel62c
  - number: 62c.1.b
    text: de mijnbouwinstallatie niet is verwijderd overeenkomstig het verwijderingsplan waarmee is ingestemd; of
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel62c
  - number: 62c.1.c
    text: niet is verwijderd overeenkomstig de voorschriften die aan de instemming zijn verbonden.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel62c
  - number: 62c.2
    text: |-
      Met toepassing van [artikel 28, eerste lid, laatste zinsnede, van de Dienstenwet][ref1] is
      [paragraaf 4.1.3.3. van de Algemene wet bestuursrecht][ref2] niet van toepassing op het besluit tot instemming met
      het rapport over de verwijdering.


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel62c
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: '63.1'
    text: |-
      Een geheel onder oppervlaktewater gelegen mijnbouwinstallatie is voorzien van een beschermingsconstructie ter
      voorkoming van schade.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel63
  - number: '63.2'
    text: |-
      De beschermingsconstructie is voldoende sterk en wordt stevig geplaatst om de als gevolg van zeestroming, ankers en
      vistuig te verwachten krachten te weerstaan.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel63
  - number: '63.3'
    text: |-
      Onze Minister kan ontheffing verlenen van het eerste lid. De ontheffing kan onder beperkingen worden verleend of
      daaraan kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel63
  - number: '63.4'
    text: |-
      Met toepassing van [artikel 28, eerste lid, laatste zinsnede, van de Dienstenwet][ref1] is
      [paragraaf 4.1.3.3. van de Algemene wet bestuursrecht][ref2] niet van toepassing op de aanvraag om een ontheffing
      als bedoeld in het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: '64.1'
    text: |-
      De [artikelen 46 tot en met 49][ref1] en [paragraaf 5.2.3][ref2] zijn van overeenkomstige toepassing op een
      mijnbouwinstallatie als bedoeld in [artikel 63, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0014394#Hoofdstuk5
      [ref3]: https://wetten.overheid.nl/BWBR0014394#Artikel63
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: '46'
        hoofdstuk: '5'
        paragraaf: 5.2.2
        afdeling: '5.2'
      - id: ref2
        bwb_id: BWBR0014394
        hoofdstuk: '5'
        paragraaf: 5.2.3
        afdeling: '5.2'
      - id: ref3
        bwb_id: BWBR0014394
        artikel: '63'
        hoofdstuk: '5'
        paragraaf: 5.2.4
        afdeling: '5.2'
  - number: '64.2'
    text: |-
      Als de inspecteur-generaal der mijnen voor een mijnbouwwerk als bedoeld in
      [artikel 2, eerste lid, onderdeel a][ref1], een werkprogramma voor het buiten gebruik
      stellen van een boorgat als bedoeld in [artikel 74, eerste lid][ref2], heeft ontvangen, is
      [artikel 44, eerste, tweede en derde lid, van de wet][ref3] niet van toepassing, indien het boorgat naar het
      oordeel van de inspecteur-generaal der mijnen in overeenstemming met het werkprogramma buiten gebruik is gesteld.
      De inspecteur-generaal der mijnen informeert Onze Minister over het oordeel.


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0014394#Artikel74
      [ref3]: https://wetten.overheid.nl/BWBR0014168#Artikel44
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: '2'
        hoofdstuk: '1'
        paragraaf: '1.1'
      - id: ref2
        bwb_id: BWBR0014394
        artikel: '74'
        hoofdstuk: '5'
        paragraaf: 5.3.2
        afdeling: '5.3'
      - id: ref3
        bwb_id: BWBR0014168
        artikel: '44'
  - number: '65'
    text: |-
      De uitvoerder doet acht weken voor plaatsing van een mijnbouwinstallatie als bedoeld in
      [artikel 63, eerste lid][ref1], mededeling aan de inspecteur-generaal der mijnen. Bij de mededeling worden het
      ontwerp van de constructie, de gegevens bedoeld in [artikel 56, eerste lid, onderdelen a en b][ref2], alsmede een
      beschrijving van de wijze van plaatsing gevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel63
      [ref2]: https://wetten.overheid.nl/BWBR0014394#Artikel56
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: '63'
        hoofdstuk: '5'
        paragraaf: 5.2.4
        afdeling: '5.2'
      - id: ref2
        bwb_id: BWBR0014394
        artikel: '56'
        hoofdstuk: '5'
        paragraaf: 5.2.2
        afdeling: '5.2'
  - number: '67.1'
    text: |-
      Bij het aanleggen, uitbreiden, wijzigen, gebruiken, testen, repareren en buiten gebruik stellen van een boorgat
      alsmede het stimuleren van een voorkomen via een boorgat worden maatregelen genomen ter voorkoming van schade.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel67
  - number: '67.2'
    text: |-
      Het aanleggen, uitbreiden, wijzigen, testen, repareren en buiten gebruik stellen van een boorgat alsmede het
      stimuleren van een voorkomen via een boorgat geschiedt onder verantwoordelijkheid en in aanwezigheid van de
      uitvoerder of de uitvoerder aardwarmte. Het gebruiken van een boorgat geschiedt onder verantwoordelijkheid van
      de uitvoerder.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel67
  - number: '68'
    text: |-
      De activiteiten, bedoeld in [artikel 67, eerste lid][ref1], worden slechts verricht indien de desbetreffende
      stoffen uit de ondergrondse formaties onder controle worden gehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel67
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: '67'
        hoofdstuk: '5'
        paragraaf: 5.3.1
        afdeling: '5.3'
  - number: '69.1'
    text: Een boorgat wordt voorzien van een geschikte verbuizing.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel69
  - number: '69.2'
    text: |-
      Elke serie van de in het eerste lid bedoelde verbuizing wordt over voldoende afstand gecementeerd en daarna op
      deugdelijkheid getest.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel69
  - number: '69.3'
    text: De eerste serie van de verbuizing wordt onmiddellijk nadat deze is gecementeerd deugdelijk afgesloten.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel69
  - number: '70'
    text: |-
      De uitvoerder of de uitvoerder aardwarmte draagt tijdens de werkzaamheden ten behoeve van het aanleggen, repareren
      en buiten gebruik stellen van een boorgat er zorg voor dat:
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel70
  - number: 70.a
    text: een boorgat ter afsluiting wordt voorzien van beveiligingen;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel70
  - number: 70.b
    text: de deugdelijkheid van de beveiligingen periodiek wordt getest, en
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel70
  - number: 70.c
    text: bij het boorgat betrokken personen periodiek deelnemen aan oefeningen in het gebruik van beveiligingen.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel70
  - number: '71'
    text: |-
      Een boorgat wordt niet eerder voor winning van delfstoffen, winning van aardwarmte of opslag van stoffen in
      gebruik genomen dan nadat het daartoe deugdelijk is ingericht en afgewerkt, alsmede ter afsluiting van deugdelijke
      beveiligingen is voorzien.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel71
  - number: '72.1'
    text: 'Een boorgat wordt niet eerder buiten werking gesteld dan nadat:'
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel72
  - number: 72.1.a
    text: voldoende maatregelen zijn genomen ter voorkoming van schade, en
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel72
  - number: 72.1.b
    text: |-
      de delfstofhoudende lagen en de delfstofafzettingen, voor zover daaraan door water schade kan worden toegebracht,
      waterdicht zijn afgesloten.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel72
  - number: '72.2'
    text: |-
      Het eerste lid is niet van toepassing op het buiten gebruik stellen van een boorgat dat is gebruikt voor het
      permanent opslaan van CO.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel72
  - number: 72a
    text: |-
      Het buiten gebruik stellen van een boorgat heeft tot doel om het boorgat permanent af te sluiten door zones met
      stromingspotentieel te isoleren.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel72a
  - number: '73'
    text: 'Bij ministeriële regeling worden regels gesteld over:'
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel73
  - number: 73.a
    text: |-
      beveiligingen en oefeningen in het gebruik van beveiligingen, bedoeld in [artikel 70][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel70
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: '70'
        hoofdstuk: '5'
        paragraaf: 5.3.1
        afdeling: '5.3'
  - number: 73.b
    text: |-
      de inrichting van een boorgat en de beveiliging ervan, bedoeld in [artikel 71][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel71
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: '71'
        hoofdstuk: '5'
        paragraaf: 5.3.1
        afdeling: '5.3'
  - number: 73.c
    text: |-
      het buiten gebruik stellen van een boorgat als bedoeld in [artikel 72a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel72a
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: 72a
        hoofdstuk: '5'
        paragraaf: 5.3.1
        afdeling: '5.3'
  - number: 73a
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over het buiten werking stellen van een boorgat, bedoeld
      in [artikel 72][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel72
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel73a
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: '72'
        hoofdstuk: '5'
        paragraaf: 5.3.1
        afdeling: '5.3'
  - number: '74.1'
    text: |-
      Het aanleggen, uitbreiden, wijzigen, onderhouden, repareren en buiten gebruik stellen van een boorgat alsmede
      het stimuleren van een voorkomen via een boorgat geschiedt overeenkomstig een door de uitvoerder of de uitvoerder
      aardwarmte opgesteld werkprogramma.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel74
  - number: '74.2'
    text: |-
      De uitvoerder of de uitvoerder aardwarmte informeert de inspecteur-generaal der mijnen ten minste zeven dagen voor
      het tijdstip waarop met onderhoudswerkzaamheden van een boorgat wordt aangevangen.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel74
  - number: '74.3'
    text: |-
      Het eerste lid is niet van toepassing op het buiten gebruik stellen van een boorgat dat is gebruikt voor het
      permanent opslaan van CO.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel74
  - number: '75.1'
    text: Bij het aanleggen van een boorgat is een boorregister op het desbetreffende mijnbouwwerk aanwezig.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel75
  - number: '75.2'
    text: Het boorregister wordt voortdurend bijgewerkt.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel75
  - number: '75.3'
    text: |-
      De uitvoerder of de houder van een startvergunning aardwarmte of een vervolgvergunning aardwarmte bewaart het
      boorregister gedurende ten minste vijf jaar nadat het mijnbouwwerk buiten gebruik is gesteld.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel75
  - number: '76.1'
    text: |-
      De uitvoerder of de uitvoerder aardwarmte maakt dagelijks een rapport op van het aanleggen, uitbreiden, wijzigen,
      repareren of buiten gebruik stellen van een boorgat alsmede het stimuleren van een voorkomen via een boorgat en
      brengt het rapport onmiddellijk ter kennis van de inspecteur-generaal der mijnen.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel76
  - number: '76.2'
    text: |-
      De uitvoerder of de uitvoerder aardwarmte brengt binnen vier weken na het voltooien van de in het eerste lid
      bedoelde activiteiten een desbetreffend eindrapport ter kennis van de inspecteur-generaal der mijnen.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel76
  - number: '77'
    text: 'Bij ministeriële regeling worden regels dan wel nadere regels gesteld omtrent:'
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel77
  - number: 77.a
    text: |-
      de inhoud van het in [artikel 74][ref1] bedoelde werkprogramma, voor zover het betreft het aanleggen, uitbreiden,
      wijzigen, repareren of buiten gebruik stellen van een boorgat alsmede het stimuleren van een voorkomen via een
      boorgat, en het tijdstip waarop het werkprogramma aan de inspecteur-generaal der mijnen wordt gezonden alsmede de
      gegevens en bescheiden die daarbij worden overgelegd;


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel74
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: '74'
        hoofdstuk: '5'
        paragraaf: 5.3.2
        afdeling: '5.3'
  - number: 77.b
    text: |-
      de inhoud van de in [artikel 76][ref1] bedoelde rapporten en de wijze waarop deze rapporten ter kennis van de
      inspecteur-generaal der mijnen worden gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel76
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: '76'
        hoofdstuk: '5'
        paragraaf: 5.3.2
        afdeling: '5.3'
  - number: '78'
    text: Deze paragraaf is van toepassing op mijnbouwinstallaties.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel78
  - number: '79'
    text: 'In deze paragraaf en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel79
  - number: 79.a
    text: |-
      lozen: het al dan niet opzettelijk in oppervlaktewater doen terecht- of vrijkomen van stoffen, zoals door storten,
      pompen, doen wegvloeien of doen ontsnappen;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel79
  - number: 79.b
    text: |-
      stoffen: chemische elementen en hun verbindingen, zoals deze voorkomen in de natuur of door toedoen van de mens
      worden voortgebracht;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel79
  - number: 79.c
    text: 'preparaten: mengsels of oplossingen van stoffen;'
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel79
  - number: 79.d
    text: 'olie: minerale olie in elke vorm;'
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel79
  - number: 79.e
    text: 'oliehoudend mengsel: mengsel, dat olie in welk gehalte dan ook bevat;'
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel79
  - number: 79.f
    text: 'sanitair afval:'
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel79
  - number: 79.f.1°
    text: spoelwater en ander afval, afkomstig van toiletten en wasruimtes;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel79
  - number: 79.f.2°
    text: spoelwater, afkomstig uit verblijven voor de voorlopige verzorging van gewonden en zieken;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel79
  - number: 79.f.3°
    text: ander afvalwater, indien vermengd met spoelwater als bedoeld onder 1° of 2°;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel79
  - number: 79.g
    text: |-
      vuilnis: etensresten, alle soorten huishoudelijke afvalstoffen en vast afval, voortvloeiende uit de
      bedrijfsvoering.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel79
  - number: '80.1'
    text: Het is verboden olie, een oliehoudend mengsel, sanitair afval en vuilnis vanaf een mijnbouwinstallatie te lozen.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel80
  - number: '80.2'
    text: 'Het eerste lid geldt niet ten aanzien van het lozen van:'
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel80
  - number: 80.2.a
    text: |-
      een oliehoudend mengsel in de gevallen en op de wijze als bepaald bij ministeriële regeling van Onze Minister, in
      overeenstemming met Onze Minister van Infrastructuur en Milieu;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel80
  - number: 80.2.b
    text: 'sanitair afval:'
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel80
  - number: 80.2.b.1°
    text: vanaf een mijnbouwinstallatie waarop niet meer dan tien personen aanwezig plegen te zijn;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel80
  - number: 80.2.b.2°
    text: |-
      vanaf een niet als een geheel verplaatsbare mijnbouwinstallatie, waarop meer dan 50 personen aanwezig plegen te
      zijn of een als een geheel verplaatsbare mijnbouwinstallatie, indien dit afval is afgebroken door middel van een
      biologisch zuiveringssysteem;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel80
  - number: 80.2.b.3°
    text: |-
      vanaf een andere mijnbouwinstallatie dan bedoeld onder 1° en 2°, indien dit afval is behandeld door middel van een
      mechanisch vermalingssysteem;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel80
  - number: 80.2.c
    text: |-
      vuilnis, voor zover bestaande uit etensresten, in de gevallen en op de wijze als door Onze Minister, in
      overeenstemming met Onze Minister van Infrastructuur en Milieu, aangegeven.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel80
  - number: '80.3'
    text: 'Het eerste lid geldt evenmin, indien het lozen:'
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel80
  - number: 80.3.a
    text: noodzakelijk is om de veiligheid van de installatie te verzekeren dan wel om mensenlevens te redden;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel80
  - number: 80.3.b
    text: |-
      het gevolg is van schade aan de installatie of aan de uitrusting daarvan, indien na het ontstaan van de schade of
      na de ontdekking van de lozing alle redelijke maatregelen zijn getroffen om de verdere lozing te voorkomen of tot
      een minimum te beperken.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel80
  - number: '80.4'
    text: |-
      Bij ministeriële regeling van Onze Minister worden, in overeenstemming met Onze Minister van Infrastructuur en
      Milieu, nadere regels gesteld met betrekking tot de in het tweede en derde lid bedoelde lozingen omtrent:
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel80
  - number: 80.4.a
    text: het meten en registreren van toegestane lozingen van oliehoudende mengsels;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel80
  - number: 80.4.b
    text: de controle op het oliegehalte van de toegestane lozingen van oliehoudende mengsels.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel80
  - number: '81.1'
    text: |-
      Op een mijnbouwinstallatie worden met betrekking tot het met het normale gebruik van de installatie samenhangende
      of daaruit voortvloeiende lozingen van andere dan in [artikel 80][ref1] genoemde stoffen of andere verontreinigende
      dan wel schadelijke stoffen zodanige maatregelen genomen dat verontreiniging van oppervlaktewater zoveel mogelijk
      wordt voorkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel80
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: '80'
        hoofdstuk: '5'
        paragraaf: 5.4.1
        afdeling: '5.4'
  - number: '81.2'
    text: Het is verboden stoffen of preparaten te lozen als bedoeld in het derde lid, onderdeel a.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel81
  - number: '81.3'
    text: |-
      Bij ministeriële regeling van Onze Minister worden, in overeenstemming met Onze Minister van Infrastructuur en
      Milieu, welke uitsluitend strekt ter uitvoering van een voor Nederland verbindend verdrag of een voor Nederland
      verbindend besluit van een volkenrechtelijke organisatie:
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel81
  - number: 81.3.a
    text: de in het tweede lid bedoelde stoffen of preparaten aangewezen;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel81
  - number: 81.3.b
    text: 'regels gesteld die slechts kunnen inhouden:'
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel81
  - number: 81.3.b.1°
    text: |-
      voorschriften inzake de bewerking die stoffen of preparaten voor lozing moeten ondergaan, de te lozen hoeveelheden
      ervan, en de plaats en de wijze van lozing;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel81
  - number: 81.3.b.2°
    text: voorschriften omtrent het melden, meten en registreren van stoffen of preparaten die worden geloosd.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel81
  - number: '82.1'
    text: |-
      De uitvoerder neemt onmiddellijk passende maatregelen in geval van lozingen waardoor nadelige gevolgen voor het
      milieu zijn ontstaan of dreigen te ontstaan als bedoeld in de [artikelen 80][ref1] en [81][ref2]. De bedoelde
      passende maatregelen houden in het voorkomen, bestrijden of beperken van de bedoelde nadelige gevolgen.


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel80
      [ref2]: https://wetten.overheid.nl/BWBR0014394#Artikel81
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: '80'
        hoofdstuk: '5'
        paragraaf: 5.4.1
        afdeling: '5.4'
      - id: ref2
        bwb_id: BWBR0014394
        artikel: '81'
        hoofdstuk: '5'
        paragraaf: 5.4.1
        afdeling: '5.4'
  - number: '82.2'
    text: De uitvoerder meldt het voorval zo spoedig mogelijk aan het Kustwachtcentrum en de inspecteur-generaal der mijnen.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel82
  - number: '82.3'
    text: |-
      De uitvoerder verstrekt de inspecteur-generaal der mijnen zo spoedig mogelijk gegevens, zodra deze bekend zijn,
      omtrent:
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel82
  - number: 82.3.a
    text: de oorzaken van het voorval en de omstandigheden waaronder het voorval zich heeft voorgedaan;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel82
  - number: 82.3.b
    text: de ten gevolge van het voorval vrijgekomen stoffen, alsmede hun eigenschappen;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel82
  - number: 82.3.c
    text: |-
      andere gegevens die van belang zijn om de aard en de ernst van de gevolgen voor het milieu van het voorval te
      kunnen beoordelen;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel82
  - number: 82.3.d
    text: |-
      de maatregelen die zijn genomen of worden overwogen om de gevolgen van het voorval te voorkomen, te beperken of
      ongedaan te maken;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel82
  - number: 82.3.e
    text: de maatregelen die worden overwogen om te voorkomen dat een zodanig voorval zich nogmaals kan voordoen.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel82
  - number: '82.4'
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld omtrent de in het tweede lid bedoelde melding en de
      gegevens, bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel82
  - number: '83.1'
    text: |-
      Bij ministeriële regeling van Onze Minister worden, in overeenstemming met Onze Minister van Infrastructuur en
      Milieu, ter voorkoming van verontreiniging van oppervlaktewater regels gesteld omtrent het gebruik van bepaalde
      stoffen of preparaten op een mijnbouwinstallatie.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel83
  - number: '83.2'
    text: Het is verboden stoffen of preparaten te gebruiken als bedoeld in het derde lid, onderdeel a.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel83
  - number: '83.3'
    text: |-
      Bij ministeriële regeling van Onze Minister worden, in overeenstemming met de in het eerste lid genoemde minister,
      welke uitsluitend strekt ter uitvoering van een voor Nederland verbindend verdrag of een voor Nederland verbindend
      besluit van een volkenrechtelijke organisatie:
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel83
  - number: 83.3.a
    text: de in het tweede lid bedoelde stoffen of preparaten aangewezen;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel83
  - number: 83.3.b
    text: 'regels gesteld die slechts kunnen inhouden:'
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel83
  - number: 83.3.b.1°
    text: voorschriften inzake de te gebruiken hoeveelheden stof of preparaten en de wijze van gebruik;
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel83
  - number: 83.3.b.2°
    text: voorschriften omtrent het melden, meten en registreren van stoffen of preparaten die worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel83
  - number: '84.1'
    text: |-
      Het is verboden op een mijnbouwinstallatie aardgas af te blazen of af te fakkelen in de open lucht dan wel andere
      verontreinigende stoffen uit te stoten.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel84
  - number: '84.2'
    text: |-
      Het eerste lid geldt niet indien het afblazen of affakkelen van aardgas dan wel de uitstoot van andere
      verontreinigende stoffen onvermijdelijk is voor een normale bedrijfsvoering in het mijnbouwwerk. In dat geval
      worden alle maatregelen getroffen om schade ten gevolge van het afblazen of affakkelen van aardgas dan wel de
      uitstoot van andere verontreinigende stoffen zoveel mogelijk te voorkomen dan wel te beperken.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel84
  - number: '84.3'
    text: Bij ministeriële regeling kunnen regels worden gesteld omtrent de in het tweede lid bedoelde maatregelen.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel84
  - number: 84a
    text: |-
      Deze paragraaf is van toepassing op mijnbouwwerken die gebruikt worden voor de opsporing of winning van
      koolwaterstoffen.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel84a
  - number: 84b.1
    text: |-
      Een rapport inzake grote gevaren voor een productie-installatie bevat naast de documenten bedoeld in [artikel 45c
      van de wet](onbekend), de volgende gegevens:
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel84b
  - number: 84b.1.a
    text: |-
      een veiligheids- en gezondheidsdocument, bedoeld in [artikel 2.42][ref1] en
      [2.42f van het Arbeidsomstandighedenbesluit][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel2
