      van inwerkingtreding van de [Mijnbouwwet][ref2] gedurende zes maanden als een vergunning als bedoeld in
      [artikel 22][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002474#Artikel168
      [ref2]: https://wetten.overheid.nl/BWBR0014168
