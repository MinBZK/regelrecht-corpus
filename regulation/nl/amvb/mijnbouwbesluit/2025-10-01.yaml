      of [59, eerste lid, van het Mijnreglement continentaal plat][ref2] en een werkprogramma
      als bedoeld in de [artikelen 32b, tweede lid, van het Mijnreglement 1964][ref3]
      of [63b, tweede lid, van het Mijnreglement continentaal plat][ref4] gelden als een werkprogramma als bedoeld in
      [artikel 74][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0002474#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0002564#Artikel59
      [ref3]: https://wetten.overheid.nl/BWBR0002474#Artikel32b
