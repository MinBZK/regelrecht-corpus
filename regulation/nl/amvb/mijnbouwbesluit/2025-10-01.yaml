      - id: ref3
        bwb_id: BWBR0014394
        artikel: '30'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '173.2'
    text: |-
      Indien een uitvoerder voor de afloop van de in het eerste lid bedoelde termijn een aanvraag om instemming
      als bedoeld in [artikel 30][ref1] bij Onze Minister heeft ingediend en niet voor de afloop van die termijn de
      beslissing van Onze Minister onherroepelijk vaststaat, kan het gebruik van het meetregister worden voortgezet tot
      het laatstbedoelde tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel30
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel173
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: '30'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '174.1'
    text: |-
      Een ontheffing als bedoeld in [artikel 40, vierde lid, van het Mijnreglement continentaal plat](onbekend) geldt als
      een in [artikel 51, vijfde lid][ref1], bedoelde ontheffing.


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel51
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel174
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: '51'
        hoofdstuk: '5'
        paragraaf: 5.2.2
        afdeling: '5.2'
  - number: '174.2'
    text: |-
      Een verklaring als bedoeld in [36ja, eerste lid, van het Mijnreglement 1964][ref1] of [40, derde lid, van het
      Mijnreglement continentaal plat](onbekend) blijft geldig tot het tijdstip waarop de geldigheid van de verklaring
      verloopt.


      [ref1]: https://wetten.overheid.nl/BWBR0002474#Artikel36ja
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel174
    references:
      - id: ref1
        bwb_id: BWBR0002474
        artikel: 36ja
  - number: '174.3'
    text: |-
      Een ontheffing als bedoeld in de [artikelen 36k, vijfde lid][ref1], en
      [36l, zesde lid, van het Mijnreglement 1964][ref2] of [41, vierde lid][ref3], en
      [42, vijfde lid, van het Mijnreglement continentaal plat][ref4] geldt als een in [artikel 52, zesde lid][ref5],
      bedoelde ontheffing.


      [ref1]: https://wetten.overheid.nl/BWBR0002474#Artikel36k
      [ref2]: https://wetten.overheid.nl/BWBR0002474#Artikel36l
      [ref3]: https://wetten.overheid.nl/BWBR0002564#Artikel41
