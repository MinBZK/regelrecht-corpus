        artikel: '26'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '172.2'
    text: |-
      Indien een houder van een opslagvergunning voor de afloop van de in het eerste lid bedoelde termijn een opslagplan
      bij Onze Minister heeft ingediend en niet voor de afloop van die termijn de beslissing van Onze Minister
      onherroepelijk vaststaat, kan de opslag in elk geval worden voortgezet tot het laatstbedoelde tijdstip.
    url: https://wetten.overheid.nl/BWBR0014394/2025-10-01#Artikel172
  - number: '173.1'
    text: |-
      Een meetregister als bedoeld in [artikel 134 van het Mijnreglement 1964][ref1] geldt met ingang van het
      tijdstip van inwerkingtreding van de [Mijnbouwwet][ref2] gedurende zes maanden als een meetplan als bedoeld in
      [artikel 30][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002474#Artikel134
      [ref2]: https://wetten.overheid.nl/BWBR0014168
      [ref3]: https://wetten.overheid.nl/BWBR0014394#Artikel30
