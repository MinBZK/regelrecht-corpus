  - number: '63'
    text: |-
      1 Een geheel onder oppervlaktewater gelegen mijnbouwinstallatie is voorzien van een beschermingsconstructie ter
      voorkoming van schade.

      2 De beschermingsconstructie is voldoende sterk en wordt stevig geplaatst om de als gevolg van zeestroming, ankers
      en vistuig te verwachten krachten te weerstaan.

      3 Onze Minister kan ontheffing verlenen van het eerste lid. De ontheffing kan onder beperkingen worden verleend of
      daaraan kunnen voorschriften worden verbonden.

      4 Met toepassing van [artikel 28, eerste lid, laatste zinsnede, van de Dienstenwet][ref1] is
      [paragraaf 4.1.3.3. van de Algemene wet bestuursrecht][ref2] niet van toepassing op de aanvraag om een ontheffing
      als bedoeld in het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel63
