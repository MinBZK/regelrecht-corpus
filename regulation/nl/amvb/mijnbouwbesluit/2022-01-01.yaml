  - number: 62b
    text: |-
      1 Onze Minister kan de houder van een vergunning als bedoeld in de [artikelen 6][ref1] en [25 van de wet][ref2]
      een tijdelijke ontheffing als bedoeld in [artikel 44b, eerste lid, van de wet][ref3], verlenen, indien de
      mijnbouwinstallatie of het mijnbouwwerk, bedoeld in [artikel 59, eerste lid][ref4]:

      a. nodig is voor het gebruik van een ander mijnbouwwerk als bedoeld in
      [artikel 2, eerste lid, onderdelen a tot en met h][ref5];

      b. doelmatiger kan worden verwijderd of hergebruikt, indien de houder van een vergunning het mijnbouwwerk tezamen
      met een ander mijnbouwwerk verwijdert of hergebruikt;

      c. in aanmerking komt voor geheel of gedeeltelijk hergebruik als onderzoek is of wordt verricht naar de
      geschiktheid voor opsporing of winning van delfstoffen of aardwarmte of de opslag van stoffen;

      d. redelijkerwijs rendabel opnieuw in gebruik genomen kan worden na:

      1°. verbetering van de omstandigheden op de markt voor koolwaterstoffen, andere delfstoffen, aardwarmte,
      respectievelijk de opslag van stoffen;

      2°. een technische innovatie voor de winning van koolwaterstoffen, andere delfstoffen, aardwarmte, respectievelijk
      de opslag van stoffen; of

      e. in aanmerking komt voor een ander hergebruik dan het exploiteren van een mijnbouwwerk.

      2 Onze Minister vraagt advies over een aanvraag om ontheffing van de verplichting tot verwijderen als bedoeld in
      [artikel 44, tweede lid, van de wet][ref6] voor het opnieuw in gebruik nemen:

      a. als bedoeld in het eerste lid, onderdeel d, voor de winning van koolwaterstoffen, aardwarmte en de opslag van CO
      aan de vennootschap, bedoeld in [artikel 82, eerste lid, van de wet][ref7] en

      b. als bedoeld in het eerste lid, onderdeel d, onder 2°, tevens aan de Nederlandse Organisatie voor toegepast-
      natuurwetenschappelijk onderzoek TNO als bedoeld in artikel 3 van de TNO-wet.

      3 Onze Minister kan de ontheffing voor hergebruik van de mijnbouwinstallatie voor een periode van maximaal vijf
      jaar verlenen.

      4 Onze Minister kan de ontheffing telkens voor een periode van maximaal vijf jaar verlengen.

      5 Met toepassing van [artikel 28, eerste lid, laatste zinsnede, van de Dienstenwet][ref8] is
      [paragraaf 4.1.3.3. van de Algemene wet bestuursrecht][ref9] niet van toepassing op de ontheffing.

      6 Onze Minister kan, onverminderd [artikel 7, derde lid][ref10], een ontheffing ambtshalve geheel of gedeeltelijk
      wijzigen of intrekken, indien de houder van een vergunning:

      a. de ontheffing niet langer nodig heeft om in een hergebruik van het mijnbouwwerk te kunnen voorzien;

      b. niet overeenkomstig de ontheffing handelt of heeft gehandeld.


