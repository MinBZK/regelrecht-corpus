  - number: '98'
    text: |-
      1 Indien de feitelijke ligging van een pijpleiding die is aangelegd in de territoriale zee of het continentaal
      plat afwijkt van de ligging zoals deze in de vergunning is aangegeven, verstrekt de beheerder aan Onze Minister
      de gegevens van de feitelijke ligging ervan binnen vier weken na de aanleg van de pijpleiding. Indien er kennelijk
      geen risico op schade is, kan Onze Minister de vergunning dienovereenkomstig wijzigen.

      2 Op de voorbereiding van de beschikking tot aanpassing als bedoeld in het eerste lid is
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel98
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: '99'
    text: |-
      1 Gedurende het gebruik of de instandhouding van een pijpleiding onderzoekt de beheerder periodiek de
      eigenschappen, en tevens de ligging van de pijpleiding voor zover deze is aangelegd in de territoriale zee of
      het continentaal plat, aan de hand van de bij of krachtens [artikel 93][ref1] gestelde eisen en, voor zover van
      toepassing, aan de desbetreffende vergunningvoorschriften.

      2 De beheerder verstrekt slechts die resultaten van het onderzoek aan de inspecteur-generaal der mijnen, waarbij
      afwijkingen worden geconstateerd van de eisen, bedoeld in het eerste lid.

      3 Op aanwijzing van Onze Minister kan de frequentie van het onderzoek worden verhoogd in verband met het risico
      op schade.

      4 Onze Minister kan op aanvraag van de beheerder besluiten de frequentie van het onderzoek te verminderen tot een
      bij dat besluit aan te geven niveau.

      5 Bij ministeriële regeling kunnen regels worden gesteld omtrent:

      a. de inhoud en wijze waarop het onderzoek plaatsvindt;

      b. de frequentie waarmee het in het eerste lid bedoelde onderzoek plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel93
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel99
