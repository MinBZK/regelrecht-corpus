  - number: 62c
    text: |-
      1 Onze Minister kan de houder van een vergunning als bedoeld in de [artikelen 6][ref1] en [25 van de wet][ref2] een
      instemming met een rapport over de verwijdering, bedoeld in [artikel 44c, derde lid, van de wet][ref3] weigeren als
      het rapport:

      a. onvoldoende informatie bevat;

      b. de mijnbouwinstallatie niet is verwijderd overeenkomstig het verwijderingsplan waarmee is ingestemd; of

      c. niet is verwijderd overeenkomstig de voorschriften die aan de instemming zijn verbonden.

      2 Met toepassing van [artikel 28, eerste lid, laatste zinsnede, van de Dienstenwet][ref4] is
      [paragraaf 4.1.3.3. van de Algemene wet bestuursrecht][ref5] niet van toepassing op het besluit tot instemming met
      het rapport over de verwijdering.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel25
