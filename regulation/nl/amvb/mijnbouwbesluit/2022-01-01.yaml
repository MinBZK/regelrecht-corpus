  - number: '5'
    text: |-
      De bescheiden en de gegevens, bedoeld bij of krachtens dit besluit, worden door een uitvoerder, een onderzoeker als
      bedoeld in [artikel 9][ref1], een beheerder als bedoeld in [artikel 92, onderdeel d][ref2], en een vergunninghouder
      als bedoeld in de [artikelen 152][ref3] en [157][ref4] op deugdelijke wijze opgesteld en bijgehouden. Zij worden,
      voor zover bij of krachtens dit besluit niet anders is bepaald, gedurende ten minste een jaar bewaard.


