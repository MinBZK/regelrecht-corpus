  - number: '6'
    text: |-
      1 Tot de in [artikel 130 van de wet][ref1] bedoelde gevallen en wijze van vervoer worden gerekend:

      a. vervoer dat plaatsvindt tussen 07.00 en 20.00 uur;

      b. vervoer met een helikopter, met dien verstande dat ten hoogste aanspraak wordt gemaakt op vier plaatsen.

      2 Indien bij het verrichten van mijnbouwactiviteiten ernstige schade dreigt te ontstaan of is ontstaan, kan op
      aanwijzing van de inspecteur-generaal der mijnen het in het eerste lid, onderdeel a, bedoelde vervoer plaatsvinden
      tussen 0.00 uur en 24.00 uur.

      3 De houder van een vergunning als bedoeld in [artikel 6][ref2] of [25 van de wet][ref3] dan wel degene
      die een verkenningsonderzoek uitvoert of voornemens is uit te voeren, voorziet ambtenaren als bedoeld in de
      [artikelen 129][ref4] en [131 van de wet][ref5], in de bij ministeriële regeling omschreven gevallen van transport,
      een verblijfplaats, maaltijden en andere benodigdheden.


