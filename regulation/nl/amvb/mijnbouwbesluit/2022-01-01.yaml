  - number: 84m
    text: Deze paragraaf is van toepassing op mijnbouwwerken.
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel84m
  - number: '85'
    text: |-
      1 Een uitvoerder draagt er zorg voor dat er een rampenbestrijdingsplan is voor elk mijnbouwwerk dat in gebruik is
      ten behoeve van de opsporing, winning of opslag van stoffen.

      2 Een rampenbestrijdingsplan met betrekking tot een voor de winning of opslag bestemd mijnbouwwerk wordt ten minste
      iedere vijf jaar herzien.

      3 Het rampenbestrijdingsplan wordt voor de eerste maal ten minste vier weken voor de aanvang van de opsporing,
      winning of opslag, ingediend bij het Staatstoezicht op de mijnen en, in het geval, bedoeld in het tweede lid,
      onverwijld na de herziening.
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel85
  - number: '86'
    text: |-
      1 Een rampenbestrijdingsplan bevat een beschrijving van de maatregelen en voorzieningen die worden getroffen ter
      bestrijding of ter beperking van de gevolgen van voorvallen op een mijnbouwwerk dan wel in de omgeving daarvan,
      die een ernstig gevaar opleveren voor het milieu of voor zover van toepassing voor de veiligheid van de scheepvaart
      of visserij.

      2 Onder de maatregelen en de voorzieningen, bedoeld in het eerste lid, wordt in ieder geval verstaan:

      a. de werkzaamheden die worden verricht ter bestrijding van een voorval als bedoeld in het eerste lid;

      b. de aanwezige materialen en bestrijdingsmiddelen die daarbij worden gebruikt;

      c. wie of welke instelling is belast met de in onderdeel a bedoelde werkzaamheden, en

      d. wie belast is met het toezicht op het feitelijk verrichten van de in onderdeel a bedoelde werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel86
  - number: '87'
    text: |-
      1 Indien zich een voorval als bedoeld in [artikel 86, eerste lid][ref1], voordoet op een mijnbouwwerk, wordt
      onmiddellijk uitvoering gegeven aan het rampenbestrijdingsplan.

      2 Zodra daartoe de mogelijkheid bestaat, meldt de uitvoerder het voorval aan de inspecteur-generaal der mijnen en
      bij een voorval op een mijnbouwinstallatie, aan het Kustwachtcentrum.


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel86
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: '86'
        hoofdstuk: '5'
        paragraaf: 5.4.2
        afdeling: '5.4'
  - number: '88'
    text: |-
      1 Indien zich een voorval als bedoeld in [artikel 86, eerste lid][ref1], voordoet in de omgeving van een
      mijnbouwwerk, meldt de uitvoerder het voorval onmiddellijk aan de inspecteur-generaal der mijnen en bij een voorval
      op een mijnbouwinstallatie, aan het Kustwachtcentrum.

      2 De uitvoerder verleent op aanwijzing van Onze Minister zoveel mogelijk hulp en bijstand bij het bestrijden van
      het voorval of het beperken van de gevolgen ervan.


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel86
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel88
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: '86'
        hoofdstuk: '5'
        paragraaf: 5.4.2
        afdeling: '5.4'
  - number: 88a
    text: |-
      De exploitant van een productie-installatie die in Nederland is gevestigd of diens dochteronderneming doet op
      verzoek van het Staatstoezicht op de mijnen verslag over de omstandigheden van elk zwaar ongeval dat zich buiten de
      Europese Unie heeft voltrokken en waar deze bij betrokken is geweest.
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel88a
  - number: '89'
    text: |-
      De werkzaamheden ter bestrijding van voorvallen als bedoeld in [artikel 86, eerste lid][ref1], of ter beperking
      van de gevolgen ervan geschieden onder toezicht van een daartoe aangewezen deskundig persoon en door vakkundig
      personeel, dat daartoe voldoende geoefend en geïnstrueerd is.


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel86
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: '86'
        hoofdstuk: '5'
        paragraaf: 5.4.2
        afdeling: '5.4'
  - number: '90'
    text: |-
      Onze Minister kan bepalen dat een of meer door hem aangewezen uitvoerders al dan niet gezamenlijk op
      daarbij aangegeven plaatsen en in een daarbij aangegeven omvang voor onmiddellijk gebruik ter beschikking
      hebben vaartuigen, helikopters of ander materieel ter bestrijding van voorvallen als bedoeld in
      [artikel 86, eerste lid][ref1], of ter beperking van de gevolgen ervan.


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel86
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: '86'
        hoofdstuk: '5'
        paragraaf: 5.4.2
        afdeling: '5.4'
  - number: '91'
    text: |-
      Onze Minister kan ten aanzien van het bestrijden van een voorval als bedoeld in [artikel 86, eerste lid][ref1], of
      het beperken van de gevolgen ervan:

      a. aanwijzingen geven op welke wijze de desbetreffende werkzaamheden worden verricht en welke bestrijdingsmiddelen
      daarbij worden aangewend;

      b. bepalen dat de desbetreffende werkzaamheden worden opgedragen aan een ter zake deskundige en daarin
      gespecialiseerde instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel86
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: '86'
        hoofdstuk: '5'
        paragraaf: 5.4.2
        afdeling: '5.4'
  - number: '92'
    text: |-
      In dit hoofdstuk wordt verstaan onder:

      a. pijpleiding:

      1°. leiding die twee of meer mijnbouwwerken met elkaar verbindt ten behoeve van het vervoer van stoffen, te rekenen
      vanaf de eerste isolatieafsluiter van het mijnbouwwerk;

      2°. andere leiding dan bedoeld onder 1°, aan te wijzen door Onze Minister, die een mijnbouwwerk verbindt met
      een ander werk ten behoeve van het vervoer van stoffen te rekenen vanaf de eerste isolatieafsluiter van het
      mijnbouwwerk;

      b. kabel: leiding, gelegen in de territoriale zee of het continentaal plat, tussen twee of meer
      mijnbouwinstallaties of tussen een mijnbouwinstallatie en een ander werk, aangewezen door Onze Minister, ten
      behoeve van het vervoer van elektriciteit of elektronische signalen;

      c. de ligging: het traject, de diepte en de stabiliteit;

      d. beheerder: degene voor wiens rekening en risico een pijpleiding of kabel wordt aangelegd, gebruikt dan wel in
      stand gehouden;

      e. vergunning: vergunning als bedoeld in [artikel 94][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel94
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: '94'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: '93'
    text: |-
      1 Een pijpleiding bestaat uit pijpen die voldoende sterk zijn en op doelmatige wijze met elkaar zijn verbonden. De
      pijpleiding is tegen corrosie en uitwendige krachten beschermd.

      2 De ligging van de pijpleiding is zodanig dat geen schade wordt veroorzaakt of zoveel mogelijk voorkomen.

      3 De eigenschappen, de aanleg, de ligging en het onderhoud van de pijpleiding voldoen aan bij ministeriële regeling
      te stellen eisen.
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel93
  - number: '94'
    text: |-
      1 Het is verboden zonder vergunning van Onze Minister een pijpleiding in de territoriale zee of op het continentaal
      plat aan te leggen. Indien de pijpleiding zal worden aangelegd in een gebied als bedoeld in [artikel 44][ref1]
      of [45][ref2] wordt de vergunning verleend door Onze Minister in overeenstemming met Onze Minister van Defensie
      respectievelijk Onze Minister van Infrastructuur en Milieu.

      2 De vergunning wordt geweigerd indien de pijpleiding niet voldoet aan de bij of krachtens [artikel 93][ref3]
      gestelde eisen.

      3 De vergunning kan onder beperkingen worden verleend en daaraan kunnen voorschriften worden verbonden in verband
      met risico op schade.

      4 Indien de vergunning betrekking heeft op een pijpleiding waarvoor op grond van het
      [Besluit milieueffectrapportage][ref4] het maken van een milieueffectrapport verplicht is, zijn:

      a. [hoofdstuk 7][ref5] en [afdeling 13.2 van de Wet milieubeheer][ref6] van overeenkomstige toepassing, en

      b. [afdeling 3.4 van de Algemene wet bestuursrecht][ref7] van toepassing op de voorbereiding van het besluit
      omtrent de aanvraag om een vergunning.


