  - number: 29j
    text: |-
      1 De vergunning bepaalt het bedrag waarvoor financiële zekerheid wordt gesteld voor het jaar waarin injectie
      volgens de aanvraag zal aanvangen en voor elk van de daaropvolgende vier jaren. Het bedrag voor het vierde jaar
      blijft voor opvolgende jaren van toepassing zolang het niet is aangepast.

      2 Het bedrag wordt per jaar vastgesteld op het totaal van:

      a. een raming van de kosten van verwerving van broeikasgasemissierechten als bedoeld in
      [artikel 1.1 van de Wet milieubeheer][ref1], uitgaande van emissie als gevolg van ongecontroleerde uitstroom van CO
      gedurende de laatste drie maanden van het desbetreffende jaar;

      b. een raming van de kosten van de uitvoering van het risicobeheerplan, genoemd in [artikel 29c][ref2], uitgaande
      van uitvoering gedurende twee jaar;

      c. een raming van de kosten van het nemen van de maatregel of maatregelen uit het plan met betrekking tot
      corrigerende maatregelen, bedoeld in [artikel 29d][ref3], uitgaande van de meest ingrijpende in het plan voorziene
      maatregel of maatregelen;

      d. een raming van de tot intrekking van de vergunning nog te maken kosten van uitvoering van het monitoringsplan,
      genoemd in [artikel 29f][ref4], uitgaande van intrekking van de vergunning twintig jaar na afsluiting;

      e. een raming van de kosten van uitvoering van het afsluitingsplan, bedoeld in [artikel 29g][ref5];

      f. een raming van de financiële bijdrage, bedoeld in [artikel 31j, eerste lid, onderdeel d, van de wet][ref6].

      3 De vorm waarin de zekerheid wordt gesteld behoeft de voorafgaande instemming van Onze Minister.
      De vergunninghouder doet hiertoe ten minste zes maanden voordat de zekerheid gesteld zal worden een
      aanvraag. Met toepassing van [artikel 28, eerste lid, laatste zinsnede, van de Dienstenwet][ref7] is
      [paragraaf 4.1.3.3. van de Algemene wet bestuursrecht][ref8] niet van toepassing op de aanvraag.

      4 Onze Minister stemt in indien de zekerheid  in zodanige vorm is gesteld dat naar het oordeel van Onze Minister
      vaststaat dat de Staat daarmee gedurende de gehele periode alle verplichtingen, bedoeld in het tweede lid, zo nodig
      ook zelf kan nakomen ten laste van de vergunninghouder. Onder financiële zekerheid in dit artikel wordt eveneens
      verstaan een uit oogpunt van zekerheid voor de Staat gelijkwaardige voorziening.

      5 Voor aanvang van injectie van CO toont de vergunninghouder Onze Minister aan dat de zekerheid in overeenstemming
      met de [wet ][ref9]en dit artikel is gesteld.

      6 Onverminderd [artikel 31h, eerste lid, onder d, van de wet][ref10], beziet Onze Minister op de voet van het
      tweede lid telkens na vijf jaar gerekend vanaf verlening van de vergunning de hoogte van het bedrag voor de
      eerstkomende vijf jaar. Het bedrag dat voor het laatste jaar in de vergunning is vastgesteld blijft voor opvolgende
      jaren van toepassing zolang het niet is aangepast. De vergunninghouder verstrekt Onze Minister uiterlijk drie
      maanden voor afloop van een vijfjaarstermijn de voor de ramingen, bedoeld in het tweede lid, benodigde gegevens
      vergezeld van adequate cijfermatige onderbouwing en toelichting.

      7 De vergunninghouder staakt injectie van CO zodra voortgaande injectie zou leiden tot een hoeveelheid opgeslagen
      CO die meer dan 15% hoger is dan de hoeveelheid die betrokken is in de raming, bedoeld in het tweede lid onder a,
      voor de vaststelling van de hoogte van het bedrag waarvoor op dat moment zekerheid is gesteld.

      8 Onze Minister kan bij ministeriële regeling nadere maatstaven voor raming van kosten als bedoeld in het tweede
      lid vaststellen.


