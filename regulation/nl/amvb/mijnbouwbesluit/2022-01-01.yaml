    text: |-
      1 Van de aan een opsporingvergunning als bedoeld in [artikel 143, eerste lid, onderdeel b, van de wet][ref1]
      verbonden voorschriften vervallen die voorschriften die overeenkomen met het bepaalde in de volgende met een
      Romeinse cijfer aangeduide artikelen van het koninklijk besluit tot uitvoering van artikel 12 van de Mijnwet
      continentaal plat van 27 januari 1967 (Stb. 24):

      a. artikel II, uitgezonderd artikel 21, eerste lid,

      b. artikel IX, en

      c. artikel X.

      2 Van de aan de in het eerste lid bedoelde opsporingvergunning verbonden voorschriften vervallen die voorschriften
      die overeenkomen met het bepaalde in de volgende met een Romeinse cijfer aangeduide artikelen van het koninklijk
      besluit tot uitvoering van artikel 12 van de Mijnwet continentaal plat van 6 februari 1976 (Stb. 102):

      a. [artikel II](onbekend), uitgezonderd [artikel 21, eerste lid](onbekend),

      b. [artikel IX](onbekend),

      c. artikel X, en

      d. artikel Xa.

      3 Van de aan de in het eerste lid bedoelde opsporingvergunning verbonden
      voorschriften vervallen die voorschriften die overeenkomen met het bepaalde in
      [artikel 2.1 van het Besluit vergunningen koolwaterstoffen continentaal plat 1996][ref2] (Stb. 212).

      4 Van de aan de in het eerste lid bedoelde opsporingvergunning verbonden voorschriften vervallen die voorschriften
      die overeenkomen met het bepaalde in de volgende artikelen van de Regeling vergunningen koolwaterstoffen
      continentaal plat 1996 (Stcrt. 93):

      a. artikel 4.1, uitgezonderd het in artikel 4.2 opgenomen voorschrift,

      b. artikel 4.12,

      c. artikel 4.14, en

      d. artikel 4.16.

      5 De voorschriften die krachtens artikel 4.1 van de Regeling vergunningen en concessies delfstoffen Nederlands
      territoir 1996 aan een vergunning als bedoeld in [artikel 143, eerste lid, onderdeel a, van de wet][ref3] zijn
      verbonden, vervallen.

      6 De aan de in het eerste lid bedoelde opsporingsvergunning verbonden voorschriften die betrekking hebben op het
      lozen vanaf een mijnbouwinstallatie vervallen.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel143
      [ref2]: https://wetten.overheid.nl/BWBR0007962#Artikel2.1
      [ref3]: https://wetten.overheid.nl/BWBR0014168#Artikel143
