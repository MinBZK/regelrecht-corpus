        artikel: '53'
        hoofdstuk: '5'
        paragraaf: 5.2.2
        afdeling: '5.2'
  - number: '54'
    text: |-
      1 Indien de sterkte of stabiliteit van een mijnbouwinstallatie wordt of dreigt te worden aangetast, doet de
      uitvoerder hiervan onmiddellijk mededeling aan de inspecteur-generaal der mijnen.

      2 In geval van een voor de opsporing bestemde mijnbouwinstallatie treft de uitvoerder onmiddellijk passende
      maatregelen en doet daarvan mededeling aan de inspecteur-generaal der mijnen.

      3 In geval van een voor de winning bestemde mijnbouwinstallatie treft de uitvoerder onmiddellijk passende
      herstelmaatregelen. Na herstel van de installatie verstrekt de uitvoerder de inspecteur-generaal der mijnen een
      verklaring van een onafhankelijke deskundige, waarin de sterkte en stabiliteit van de installatie wordt beoordeeld.
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel54
  - number: '55'
    text: |-
      1 Het is verboden zonder instemming van Onze Minister een uitsluitend voor de winning bestemde mijnbouwinstallatie
      te plaatsen. Het verzoek tot instemming wordt uiterlijk acht weken voor aanvang van de beoogde plaatsing van de
      mijnbouwinstallatie ingediend.

      2 De instemming wordt geweigerd indien de mijnbouwinstallatie niet voldoet aan de eisen en normen, vastgelegd in de
      [artikelen 46][ref1], [47][ref2], [50][ref3], [51][ref4] en [52][ref5].

      3 De instemming kan slechts worden geweigerd in verband met risico op schade of in verband met de opwekking van
      elektriciteit.

      4 De instemming kan onder beperkingen worden verleend en daaraan kunnen voorschriften worden verbonden in verband
      met risico op schade of in verband met de opwekking van elektriciteit.

      5 De instemming is van rechtswege gegeven, indien Onze Minister over een verzoek tot instemming niet binnen acht
      weken na ontvangst heeft beslist. De instemming van rechtswege wordt voor de mogelijkheid van bezwaar en beroep
      gelijkgesteld met een besluit als bedoeld in [artikel 1:3, eerste lid, van de Algemene wet bestuursrecht][ref6].

      6 Op een voor de opsporing bestemde mijnbouwinstallatie, voorzover deze wordt geplaatst op een alleen voor
      opsporing bestemde locatie, is het eerste tot en met vijfde lid van overeenkomstige toepassing, met dien verstande
      dat in plaats van een instemmingstermijn van acht weken telkens wordt gelezen een termijn van twee weken.

      7 De uitvoerder doet uiterlijk drie dagen voor de beoogde datum van de plaatsing van een voor de opsporing bestemde
      mijnbouwinstallatie op een voor winning bestemde locatie schriftelijk mededeling hiervan aan de inspecteur-generaal
      der mijnen. Bij de mededeling wordt een verklaring van een onafhankelijke deskundige overgelegd dat de technische
      integriteit van de te plaatsen mijnbouwinstallatie gewaarborgd is. Overlegging van deze verklaring is niet vereist
      indien deze niet ouder is dan vijf jaar en de verklaring reeds eerder is verstrekt.

      8 Op een geheel of gedeeltelijk voor de opslag bestemde mijnbouwinstallatie is het eerste tot en met vierde lid van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel46
