        bwb_id: BWBR0014168
        artikel: '47'
  - number: '179'
    text: |-
      1 De staat verstrekt het fonds, bedoeld in [artikel 135, eerste lid, van de wet][ref1] het eerste jaar na de
      inwerkingtreding van [de wet][ref2] alle geldelijke middelen die het fonds nodig heeft om aan zijn verplichtingen
      in dat jaar te kunnen voldoen.

      2 Het fonds betaalt de geldelijke middelen, bedoeld in het eerste lid, terug aan de staat in het jaar dat volgt
      op het jaar van inwerkingtreding van [de wet][ref3], onmiddellijk nadat het de bijdragen heeft ontvangen die de
      mijnbouwondernemers op grond van de [artikelen 122][ref4] en [124][ref5], in het eerstgenoemde jaar verschuldigd
      zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel135
