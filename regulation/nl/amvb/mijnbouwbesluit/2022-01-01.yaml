  - number: '28'
    text: |-
      De in [artikel 25, tweede lid, van de wet][ref1] bedoelde categorieën van gevallen, waarvoor het verbod om stoffen
      op te slaan zonder vergunning niet geldt, zijn het opslaan van:

      a. stoffen ten behoeve van het afwenden van het onmiddellijk dreigende gevaar van een onbeheerste uitstroming van
      stoffen uit de ondergrond;

      b. stoffen die gebruikt worden voor:

      1°. het opsporen en winnen van delfstoffen en aardwarmte;

      2°. het opslaan van stoffen, waarvoor een vergunning op basis van [artikel 25 van de wet][ref2] vereist is, of

      3°. het aanleggen van een boorgat dieper dan 500 meter beneden de oppervlakte van de aardbodem, buiten de in de
      onderdelen 1° en 2° bedoelde gevallen;

      c. stoffen die met de activiteiten, genoemd in onderdeel b, onder 1°, 2° en 3°, onvermijdelijk boven de oppervlakte
      meekomen, en worden teruggebracht in hetzelfde of een vergelijkbaar voorkomen als waaruit deze afkomstig zijn;

      d. hemelwater dat is gevallen op het mijnbouwwerk en het terrein eromheen;

      e. water dat wordt gebruikt voor het opslaan van warmte of koude op een diepte van ten hoogste 500 meter;

      f. water ten behoeve van openbare drinkwatervoorziening als bedoeld in de [Drinkwaterwet][ref3];

      g. grondwater en brijn dat zonder toevoeging van stoffen wordt teruggevoerd in hetzelfde gebied waarin het is
      gewonnen naar een diepte van ten hoogste 500 meter.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0026338
