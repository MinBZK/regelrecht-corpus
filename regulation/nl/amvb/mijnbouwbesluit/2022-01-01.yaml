      aanvraag en, in geval [artikel 94, vierde lid][ref1], of [95][ref2] van toepassing is, binnen de in
      [artikel 3:18 van de Algemene wet bestuursrecht][ref3] gestelde termijn.

      2 Met toepassing van [artikel 28, eerste lid, laatste zinsnede, van de Dienstenwet][ref4] is
      [paragraaf 4.1.3.3. van de Algemene wet bestuursrecht][ref5] niet van toepassing op de aanvraag om een vergunning
