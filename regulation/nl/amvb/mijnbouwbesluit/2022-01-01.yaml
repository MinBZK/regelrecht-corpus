  - number: '34'
    text: Deze afdeling is van toepassing op mijnbouwwerken, uitgezonderd mijnbouwinstallaties.
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel34
  - number: '35'
    text: |-
      1 Een voor de winning bestemd mijnbouwwerk is voorzien van meetapparatuur waarmee de hoeveelheden delfstoffen of
      aardwarmte die worden gewonnen, verbruikt, vernietigd of afgevoerd kunnen worden berekend.

      2 Een voor de opslag bestemd mijnbouwwerk is voorzien van apparatuur voor het meten van de hoeveelheden stoffen die
      in de ondergrond worden gebracht, daaruit worden teruggehaald, verbruikt, vernietigd of afgevoerd.

      3 Onze Minister kan ontheffing verlenen van het eerste en tweede lid op een daartoe strekkende aanvraag waarbij
      mede wordt aangegeven op welke andere wijze gegevens als bedoeld in het eerste en tweede lid worden verkregen.

      4 Bij ministeriële regeling kunnen regels worden gesteld omtrent het aantal metingen, de soort metingen en de te
      gebruiken meetapparatuur.
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel35
  - number: '36'
    text: |-
      Een mijnbouwwerk is zodanig afgescheiden van de omgeving en ten aanzien van de toegangen zijn zodanige maatregelen
      genomen dat het niet vrijelijk kan worden betreden door onbevoegden. Het terrein wordt op passende wijze bewaakt.
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel36
  - number: '37'
    text: |-
      1 Het oprichten van een mijnbouwwerk geschiedt op veilige afstand tot:

      a. opstallen, welke geen deel uitmaken van een mijnbouwwerk en waarin open vuur wordt of kan worden gebruikt;

      b. openbare wegen;

      c. spoorwegen;

      d. kunstwerken, of

      e. licht brandbare gewassen.

      2 De uitvoerder draagt er zorg voor dat het zorgsysteem, bedoeld in [artikel 2.42e van het
      Arbeidsomstandighedenbesluit](onbekend), en het document, bedoeld in [artikel 2.42f van dat besluit](onbekend),
      mede betrekking hebben op de veiligheid.

      3 Bij ministeriële regeling kunnen regels worden gesteld omtrent de veilige afstanden, het zorgsysteem en het
      document.
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel37
  - number: '38'
    text: |-
      1 Het is verboden op een mijnbouwwerk aardgas af te blazen of af te fakkelen in de open lucht dan wel andere
      verontreinigende stoffen uit te stoten.

      2 Het eerste lid geldt niet indien het afblazen of affakkelen van aardgas dan wel de uitstoot van andere
      verontreinigende stoffen onvermijdelijk is voor een normale bedrijfsvoering in het mijnbouwwerk. In dat geval
      worden alle maatregelen getroffen om schade ten gevolge van het afblazen of affakkelen van aardgas dan wel de
      uitstoot van andere verontreinigende stoffen zoveel mogelijk te voorkomen dan wel te beperken.

      3 Bij ministeriële regeling kunnen in het belang van de bescherming van het milieu regels worden gesteld omtrent de
      in het tweede lid bedoelde maatregelen.
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel38
  - number: '39'
    text: |-
      De houder van een vergunning als bedoeld in de [artikelen 6][ref1] en [25 van de wet][ref2] is niet gehouden een
      melding als bedoeld in [artikel 44, eerste lid, van de wet][ref3] te doen in het geval het mijnbouwwerk voor een
      periode van maximaal een jaar buiten werking is, als gevolg van:

      a. het uitvoeren van reparatie, onderhoud of aanpassingen van de bovengrondse installaties;

      b. het uitvoeren van een werkprogramma als bedoeld in [artikel 74, eerste lid][ref4];

      c. het doen van onderzoek na een ongeluk of incident;

      d. het doen van onderzoek naar de mogelijkheden en effecten van de opsporing, winning of opslag;

      e. het niet kunnen uitvoeren van werkzaamheden door een van buiten komende oorzaak, waaronder het tijdelijk niet
      beschikbaar zijn van ondersteunende installaties, pijpleidingen, kabels, personeel, materialen, grondstoffen,
      hulpstoffen, diensten van derden die noodzakelijk zijn voor het in werking houden van het mijnbouwwerk of het niet
      tijdig kunnen beschikken over de benodigde vergunningen of toestemmingen.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel6
