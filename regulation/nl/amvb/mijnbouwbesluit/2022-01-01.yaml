  - number: '125'
    text: |-
      Indien een voorschot ten laste van het fonds is toegekend en nadien in een overeenkomst als bedoeld in
      [artikel 900 van Boek 7 van het Burgerlijk Wetboek][ref1] of bij onherroepelijke rechterlijke uitspraak wordt
      vastgesteld dat geen aanspraak op schadevergoeding bestaat dan wel de schadevergoeding op een lager bedrag
      wordt vastgesteld dan het bedrag dat als voorschot is uitgekeerd, betaalt het fonds het bedrag, dat als
      voorschot is uitgekeerd, dan wel het verschil tussen dat bedrag en het toegekende schadebedrag terug aan de
      betrokken mijnbouwondernemer onverwijld nadat degene aan wie het voorschot was toegekend dit, overeenkomstig
      [artikel 140, tweede lid, van de wet][ref2] aan het fonds heeft terugbetaald.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel900
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel140
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel125
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '900'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '140'
  - number: '126'
    text: |-
      1 Onze Minister stelt bij beschikking de verschuldigde bijdrage vast.

      2 Bij ministeriële regeling kunnen regels worden gesteld omtrent de wijze waarop de betaling wordt gedaan.
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel126
  - number: '129'
    text: |-
      Onverminderd [artikel 4:2 van de Algemene wet bestuursrecht][ref1], bevat een verzoek om schadevergoeding
      onderscheidenlijk om een voorschot ten minste:

      a. naam en adres van de desbetreffende mijnbouwondernemer;

      b. een opgave van de plaats en tijdstip van de mijnbouwactiviteiten;

      c. een opgave van de aard en omvang van de zaakschade;

      d. een redelijke specificatie van het schadebedrag;

      e. indien het een verzoek om schadevergoeding betreft, een opgave waaruit blijkt dat zich één van de
      omstandigheden, genoemd in [artikel 137, onderdelen a of b, van de wet][ref2] voordoet, alsmede een opgave van de
      in onderdeel c bedoelde vergoedingen van de schade uit anderen hoofde, en

      f. indien het een verzoek om een voorschot betreft, een opgave waaruit blijkt dat de omstandigheden, genoemd in
      [artikel 140, eerste lid, onderdelen a en b, van de wet][ref3] zich voordoen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel137
      [ref3]: https://wetten.overheid.nl/BWBR0014168#Artikel140
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel129
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:2
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '137'
      - id: ref3
        bwb_id: BWBR0014168
        artikel: '140'
  - number: '130'
    text: |-
      Het fonds tekent op het verzoekschrift de datum van ontvangst aan en zendt de verzoeker onverwijld een
      ontvangstbevestiging, waarop die datum is vermeld.
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel130
  - number: '131'
    text: Onze Minister beslist op het verzoek binnen zes weken na ontvangst daarvan.
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel131
  - number: '132'
    text: |-
      1 Het bepaalde bij of krachtens de [Comptabiliteitswet 2001][ref1] is van overeenkomstige toepassing op de
      financiële middelen van het fonds, tenzij dit naar het oordeel van Onze Minister en Onze Minister van Financiën
      niet mogelijk of zinvol is.

      2 De informatie over de jaarlijkse begroting en de jaarlijkse balanspositie per 31 december van het fonds wordt
      opgenomen in de begroting en het departementale jaarverslag van het Ministerie van Economische Zaken bij het
      daarvoor meest in aanmerking komende beleidsartikel, als ware het fonds een begrotingsreserve als bedoeld in
      [artikel 5, vierde lid, van de Comptabiliteitswet 2001][ref2].

      3 De tijdelijk niet-benodigde middelen van het fonds worden in rekening-courant bij 's Rijks schatkist aangehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0013891
      [ref2]: https://wetten.overheid.nl/BWBR0013891#Artikel5
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel132
    references:
      - id: ref1
        bwb_id: BWBR0013891
      - id: ref2
        bwb_id: BWBR0013891
        artikel: '5'
  - number: '133'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent de inrichting en de administratie van het
      fonds, alsmede het op die inrichting en administratie uit te oefenen toezicht.
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel133
  - number: '134'
    text: 'In dit hoofdstuk wordt verstaan onder vergunning: opsporingsvergunning, winningsvergunning of opslagvergunning.'
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel134
  - number: '135'
    text: |-
      1 Op aanvraag van de houder van een vergunning splitst Onze Minister de vergunning in twee of meer vergunningen
      voor twee of meer gebieden.

      2 Aan de op grond van het eerste lid te verlenen vergunningen worden de beperkingen en voorschriften verbonden die
      zijn verbonden aan de te splitsen vergunning.

      3 De op grond van het eerste lid te verlenen vergunningen gelden tezamen voor hetzelfde gebied als waarvoor de te
      splitsen vergunning geldt.

      4 Het tijdvak waarvoor de op grond van het eerste lid te verlenen vergunningen gelden, eindigt op het tijdstip
      waarop het tijdvak van de te splitsen vergunning zou zijn geëindigd.
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel135
  - number: '136'
    text: |-
      Een aanvraag om splitsing wordt niet ingewilligd indien dat ertoe leidt dat een voorkomen van delfstoffen of
      aardwarmte dan wel een voorkomen voor het opslaan van stoffen in het oorspronkelijke vergunningsgebied zich door
      deze splitsing in twee of meer verschillende vergunningsgebieden zal bevinden.
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel136
  - number: 136a
    text: |-
      1 Op een aanvraag als bedoeld in [artikel 143, achtste lid, eerste volzin, van de wet][ref1] van de houder van een
      winningsvergunning wijzigt Onze Minister de winningsvergunning door van het gebied waarop die vergunning betrekking
      heeft, af te splitsen een gebiedsdeel dat de vergunninghouder wil doen overgaan op een ander en verleent Onze
      Minister aan deze vergunninghouder een winningsvergunning voor het afgesplitste gebiedsdeel.

      2 De op grond van het eerste lid verleende winningsvergunning voor een afgesplitst gebiedsdeel geldt tezamen met
      de winningsvergunning waarvan dat deel is afgesplitst voor hetzelfde gebied als waarvoor de winningsvergunning
      voorafgaand aan de afsplitsing geldt.

      3 Het tijdvak waarvoor de op grond van het eerste lid te verlenen vergunning geldt, eindigt op het tijdstip waarop
      het tijdvak van de winningsvergunning waarvan dat deel is afgesplitst eindigt.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel143
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel136a
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '143'
  - number: 136b
    text: |-
      Een aanvraag om afsplitsing van een winningsvergunning wordt niet ingewilligd indien dat ertoe leidt dat een
      voorkomen van delfstoffen of aardwarmte dan wel een voorkomen voor het opslaan van stoffen in het oorspronkelijke
      vergunningsgebied zich door deze afsplitsing in twee of meer verschillende vergunningsgebieden zal bevinden.
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel136b
  - number: '137'
    text: |-
      1 Op gezamenlijke aanvraag van de houders van twee of meer vergunningen voegt Onze Minister de vergunningen samen
      tot een vergunning voor een gebied.

      2 Aan de op grond van het eerste lid te verlenen vergunning worden de voorschriften en beperkingen verbonden die
      zijn verbonden aan de samen te voegen vergunningen.

      3 De op grond van het eerste lid te verlenen vergunning geldt voor hetzelfde gebied als waarvoor de samen te voegen
      vergunningen tezamen gelden.

      4 Het tijdvak waarvoor de op grond van het eerste lid te verlenen vergunning geldt, eindigt op het tijdstip waarop
      het tijdvak zou eindigen van die samen te voegen vergunning waarvan het tijdvak het eerst zou zijn geëindigd.
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel137
  - number: '138'
    text: |-
      1 Vergunningen voor opsporen, winnen of opslaan van bepaalde stoffen worden uitsluitend samengevoegd met
      vergunningen voor opsporen, winnen onderscheidenlijk opslaan van dezelfde stoffen.

      2 Vergunningen voor opsporen en winnen van aardwarmte worden uitsluitend samengevoegd met vergunningen voor
      opsporen onderscheidenlijk winnen van aardwarmte.

      3 Vergunningen voor opsporen van CO-complexen worden uitsluitend samengevoegd met vergunningen voor opsporen van
      CO-complexen.
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel138
  - number: '140'
    text: |-
      Een aanvraag om samenvoeging van twee of meerdere vergunningen wordt slechts ingewilligd, indien de voorwaarden
      van de desbetreffende totstandgekomen overeenkomsten, bedoeld in [artikel 81, onderdeel d][ref1], respectievelijk
      artikel 81, onderdeel e, van de wet, gelijkluidend zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel81
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel140
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '81'
  - number: '141'
    text: |-
      1 Een aanvraag om splitsing of samenvoeging van opsporings- of winningsvergunningen kan mede worden geweigerd:

      a. in het belang van het doelmatig en voortvarend opsporen en winnen;

      b. indien deze in overwegende mate strekt tot vermindering van de afdrachten, bedoeld in
      [hoofdstuk 5 van de wet][ref1].

      2 Een aanvraag om splitsing of samenvoeging van opslagvergunningen kan mede worden geweigerd indien deze in
      overwegende mate strekt tot vermindering van de afdrachten, bedoeld in [hoofdstuk 5 van de wet][ref2].

      3 Een aanvraag om afsplitsing van winningsvergunningen kan mede worden geweigerd:

      a. in het belang van het doelmatig en voortvarend winnen;

      b. indien deze in overwegende mate strekt tot vermindering van de afdrachten, bedoeld in
      [artikel 147, tweede lid, van de wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Hoofdstuk5
      [ref3]: https://wetten.overheid.nl/BWBR0014168#Artikel147
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel141
    references:
      - id: ref1
        bwb_id: BWBR0014168
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0014168
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0014168
        artikel: '147'
  - number: '142'
    text: |-
      1 Met toepassing van [paragraaf 9.2][ref1] verleende vergunningen vervangen met ingang van het tijdstip waarop
      zij in werking treden, de te splitsen vergunning. De te splitsen vergunning vervalt op het tijdstip waarop de met
      toepassing van [paragraaf 9.2][ref2] verleende vergunningen onherroepelijk worden.

      2 De met toepassing van [paragraaf 9.3][ref3] verleende vergunning vervangt met ingang van het tijdstip waarop
      zij in werking treedt, de samen te voegen vergunningen. De samen te voegen vergunningen vervallen op het tijdstip
      waarop de met toepassing van [paragraaf 9.3][ref4] verleende vergunning onherroepelijk wordt.


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Hoofdstuk9
      [ref2]: https://wetten.overheid.nl/BWBR0014394#Hoofdstuk9
      [ref3]: https://wetten.overheid.nl/BWBR0014394#Hoofdstuk9
      [ref4]: https://wetten.overheid.nl/BWBR0014394#Hoofdstuk9
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel142
    references:
      - id: ref1
        bwb_id: BWBR0014394
        hoofdstuk: '9'
        paragraaf: '9.2'
      - id: ref2
        bwb_id: BWBR0014394
        hoofdstuk: '9'
        paragraaf: '9.2'
      - id: ref3
        bwb_id: BWBR0014394
        hoofdstuk: '9'
        paragraaf: '9.3'
      - id: ref4
        bwb_id: BWBR0014394
        hoofdstuk: '9'
        paragraaf: '9.3'
  - number: '143'
    text: |-
      1 Indien ten aanzien van de te splitsen vergunning of één van de samen te voegen vergunningen een overeenkomst
      als bedoeld in [artikel 81, onderdeel d][ref1], respectievelijk artikel 81, onderdeel e, van de wet tot stand is
      gekomen, verleent de in artikel 81, onderdeel a, bedoelde vennootschap en de vergunninghouders van de op grond van
      [artikel 135][ref2] of [137][ref3] te verlenen vergunning of vergunningen medewerking aan de totstandkoming van een
      overeenkomst waarvan de voorwaarden gelijkluidend zijn aan die van eerder bedoelde overeenkomst.

      2 De in het eerste lid laatstbedoelde overeenkomst behoeft de instemming van Onze Minister.

      3 Tot het tijdstip waarop de instemming wordt verleend, verricht de vergunninghouder geen winningswerkzaamheden.
      Tot dat tijdstip behoeven besluiten als bedoeld in de [artikelen 91, onderdeel c][ref4], en
      [97, tweede lid, van de wet][ref5] de instemming van de aangewezen vennootschap.

      4 [Paragraaf 4.1.3.3 van de Algemene wet bestuursrecht][ref6] is van toepassing op het verzoek tot instemming,
      bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel81
      [ref2]: https://wetten.overheid.nl/BWBR0014394#Artikel135
      [ref3]: https://wetten.overheid.nl/BWBR0014394#Artikel137
      [ref4]: https://wetten.overheid.nl/BWBR0014168#Artikel91
      [ref5]: https://wetten.overheid.nl/BWBR0014168#Artikel97
      [ref6]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel143
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '81'
      - id: ref2
