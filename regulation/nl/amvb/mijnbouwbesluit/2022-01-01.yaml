  - number: '53'
    text: |-
      1 De uitvoerder is verplicht de technische integriteit van een voor de winning of opslag bestemde
      mijnbouwinstallatie te onderzoeken. De uitvoerder stelt daartoe iedere vijf jaar een onderzoeksprogramma op.

      2 Het onderzoeksprogramma beschrijft voor elk jaar welke onderdelen van de mijnbouwinstallatie op welke wijze
      worden onderzocht op de technische integriteit.

      3 Bij ministeriële regeling worden regels gesteld omtrent de inhoud van het onderzoeksprogramma en de in het tweede
      lid bedoelde jaarlijkse onderzoeken.

      4 De uitvoerder verstrekt Onze Minister het onderzoeksprogramma voor het eerst samen met de verklaringen, bedoeld
      in artikel 53a, eerste lid, onderdelen a en b.
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel53
  - number: 53a
    text: |-
      1 De uitvoerder verstrekt aan de inspecteur-generaal der mijnen uiterlijk twee dagen voordat een voor de winning of
      opslag bestemde mijnbouwinstallatie in gebruik wordt genomen:

      a. een verklaring van een onafhankelijke deskundige dat de technische integriteit van de mijnbouwinstallatie
      gewaarborgd is gezien het ontwerp, de bouw en de plaatsing;

      b. een verklaring van een onafhankelijke deskundige dat het onderzoeksprogramma, bedoeld in [artikel 53][ref1],
      voor de mijnbouwinstallatie voldoet.

      2 Nadat de mijnbouwinstallatie in gebruik is genomen verstrekt de uitvoerder voorts de in het eerste lid bedoelde
      gegevens telkens een maand voor de afloop van een periode van vijf jaar, waarvan de eerste periode ingaat op de
      eerste dag van de maand die volgt op die van de ingebruikneming.

      3 Bij ministeriële regeling kunnen regels worden gesteld omtrent de in het eerste lid bedoelde verklaringen.


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel53
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel53a
    references:
