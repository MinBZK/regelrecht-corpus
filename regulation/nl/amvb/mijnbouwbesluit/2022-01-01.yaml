        artikel: '45'
  - number: 103a
    text: |-
      Als een in gemeentelijk ingedeeld gebied gelegen pijpleiding op land of in oppervlaktewater buiten werking
      is als bedoeld in [artikel 45, eerste lid, van de wet][ref1] is [paragraaf 5.1.4][ref2], respectievelijk
      [paragraaf 5.2.3][ref3], van overeenkomstige toepassing, met dien verstande dat de beheerder:

      a. bij een melding overeenkomstig [artikel 40b][ref4], respectievelijk [artikel 61][ref5], de volgende informatie
      overlegt:

      1°. de periode, waarin de pijpleiding is aangelegd;

      2°. de overeenkomst met de grondeigenaar;

      3°. de relevante feiten voor een afweging van belangen als bedoeld in [artikel 103][ref6];

      b. bij een aanvraag om instemming met een verwijderingsplan in afwijking van
      [artikel 40c, eerste lid, aanhef][ref7], ten minste een beschrijving overlegt als bedoeld in artikel 40c, eerste
      lid, onder a, c, d, g, h, i, k, l en m;

      c. bij een aanvraag om instemming met een verwijderingsplan in afwijking van [artikel 62, eerste lid, aanhef][ref8],
      ten minste een beschrijving overlegt als bedoeld in artikel 62, eerste lid, onder a, c, d, g tot en met m.


