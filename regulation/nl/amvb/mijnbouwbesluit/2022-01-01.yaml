  - number: '124'
    text: |-
      1 De bijdrage die een mijnbouwondernemer, behorende tot de laatste in [artikel 121, tweede lid][ref1], genoemde
      sector, verschuldigd is, omvat een bedrag ter grootte van de voorschotten die in het voorafgaande kalenderjaar ten
      laste van het fonds zijn betaald in verband met zijn verkenningsonderzoeken.

      2 Het bedrag, bedoeld in het eerste lid, wordt verhoogd met een bedrag ter dekking van het aandeel van de sector
      in een tekort, berekend overeenkomstig [artikel 121, derde lid][ref2]. Het in de eerste volzin als laatste genoemde
      bedrag wordt bepaald door het aandeel van de sector in het tekort te verdelen over de mijnbouwondernemers die in
      het voorafgaande kalenderjaar verkenningsonderzoek hebben verricht, naar evenredigheid van het aantal onderzoeken
      dat ieder van hen in dat jaar heeft verricht. Onze Minister stelt de bijdrage voor 1 april vast.

      3 Indien in het voorafgaande kalenderjaar geen verkenningsonderzoek is verricht, is de bijdrage verschuldigd
      door de mijnbouwondernemers die in het aan dat kalenderjaar voorafgaande tijdvak van vijf kalenderjaren
      verkenningsonderzoek hebben verricht. De tweede en derde volzin van het tweede lid zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel121
      [ref2]: https://wetten.overheid.nl/BWBR0014394#Artikel121
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel124
