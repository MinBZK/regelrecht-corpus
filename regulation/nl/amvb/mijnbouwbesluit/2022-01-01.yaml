  - number: '31'
    text: |-
      1 De uitvoerder draagt ervoor zorg dat de metingen op een zorgvuldige en betrouwbare wijze plaatsvinden.

      2 De uitvoerder overlegt de resultaten van de eerste meting, bedoeld in [artikel 30, achtste lid][ref1], uiterlijk
      twee weken voor de aanvang van de winning aan de inspecteur-generaal der mijnen.

      3 De uitvoerder overlegt de resultaten van de metingen alsmede een analyse van die resultaten twaalf weken na het
      verrichten van de metingen aan de inspecteur-generaal der mijnen.

      4 Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent de inhoud van en de wijze van verstrekking
      van de meetresultaten en de analyse daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel30
