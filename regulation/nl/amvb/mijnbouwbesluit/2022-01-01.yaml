      1 Gedurende twaalf maanden na het tijdstip van inwerkingtreding van dit besluit kan de opslag van stoffen zonder
      een opslagplan als bedoeld in [artikel 26][ref1] worden voortgezet.

      2 Indien een houder van een opslagvergunning voor de afloop van de in het eerste lid bedoelde termijn een
      opslagplan bij Onze Minister heeft ingediend en niet voor de afloop van die termijn de beslissing van Onze Minister
      onherroepelijk vaststaat, kan de opslag in elk geval worden voortgezet tot het laatstbedoelde tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel26
