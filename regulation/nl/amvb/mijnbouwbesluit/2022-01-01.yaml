  - number: '7'
    text: |-
      1 Bij ministeriële regeling worden regels gesteld omtrent de wijze waarop een melding of een aanvraag om een
      vergunning, ontheffing of instemming bij of krachtens de wet geschiedt en omtrent de gegevens en de bescheiden,
      welke daarbij worden overgelegd.

      2 Als na een melding of het verlenen van een vergunning, ontheffing, of instemming wijzigingen optreden in de
      gegevens en bescheiden die zijn overgelegd, stelt degene die de melding heeft gedaan, respectievelijk de houder van
      de vergunning, ontheffing, of instemming, degene aan wie de gegevens of bescheiden zijn overgelegd, in kennis van
      de wijzigingen.

      3 Een ontheffing of vergunning kan worden gewijzigd of ingetrokken, indien:

      a. de bij de aanvraag verstrekte gegevens of bescheiden zodanig onjuist of onvolledig blijken, dat op de aanvraag
      een andere beslissing zou zijn genomen, als bij de beoordeling daarvan de juiste omstandigheden volledig bekend
      waren geweest,

      b. de omstandigheden op grond waarvan de ontheffing of vergunning werd verleend, zich zodanig hebben gewijzigd, dat
      op de aanvraag een andere beslissing zou zijn genomen, als bij de beoordeling daarvan de gewijzigde omstandigheden
      aanwezig waren geweest,

      c. de ontheffing of vergunning vanwege het risico op schade niet gehandhaafd kan blijven, of

      d. aan de ontheffing of vergunning verbonden beperkingen of voorschriften niet worden nageleefd.

      4 Een ontheffing of vergunning kan op verzoek van de houder worden gewijzigd of ingetrokken voor zover het gevaar
      van risico op schade zich daartegen niet verzet.

      5 Dit artikel is van overeenkomstige toepassing op andere bij of krachtens dit besluit te nemen besluiten.
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel7
