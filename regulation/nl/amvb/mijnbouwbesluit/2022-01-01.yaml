  - number: '108'
    text: |-
      1 Degene in wiens opdracht verkenningsonderzoek wordt verricht, dan wel, bij afwezigheid van een
      opdrachtgever, degene die het verkenningsonderzoek verricht, dan wel een latere verkrijger van gegevens uit het
      verkenningsonderzoek, verstrekt Onze Minister de volgende gegevens:

      a. de resultaten van verricht geofysisch onderzoek;

      b. de resultaten van verricht geochemisch onderzoek, of

      c. de resultaten van verricht geologisch onderzoek.

      2 Bij ministeriële regeling wordt bepaald welke gegevens, binnen welke termijn en in welke gevallen aan Onze
      Minister worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel108
  - number: '109'
    text: |-
      1 De uitvoerder verstrekt Onze Minister de volgende gegevens die bij het aanleggen, gebruiken, onderhouden,
      repareren en buiten gebruik stellen van het boorgat zijn verkregen:

      a. het profiel van het boorgat;

      b. de resultaten van in een boorgat verrichte geofysische, geochemische en geologische metingen;

      c. de resultaten van verrichte geofysische, geochemische en geologische metingen aan materiaal afkomstig uit een
      boorgat, en

      d. de resultaten van verrichte productie- of injectietesten.

      2 De gegevens, bedoeld in het eerste lid, worden per boorgat verstrekt.

      3 De uitvoerder verstrekt de gegevens, bedoeld in het eerste lid, binnen twaalf weken nadat deze zijn verkregen.
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel109
  - number: '110'
    text: |-
      1 De uitvoerder verstrekt Onze Minister een representatief deel van uit een boorgat verkregen gesteentemonsters,
      die bij het aanleggen van een boorgat zijn verkregen. De uitvoerder verstrekt de monsters binnen twaalf weken nadat
      deze zijn verkregen.

      2 De uitvoerder bewaart gedurende twaalf weken een representatief deel van uit een boorgat verkregen vloeistof-
      en gasmonsters, die bij het opsporen van delfstoffen zijn verkregen. Op verzoek van Onze Minister verstrekt de
      uitvoerder een representatief deel van de monsters.

      3 Onze Minister kan op verzoek van de uitvoerder ontheffing verlenen van de in het eerste lid genoemde
      verplichting.
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel110
  - number: '111'
    text: |-
      1 De uitvoerder verstrekt Onze Minister per kalendermaand de volgende gegevens die bij het winnen van delfstoffen
      zijn verkregen:

      a. per boorgat: de gewonnen hoeveelheden en soorten delfstoffen;

      b. per vergunningsgebied: de hoeveelheden en soorten afgevoerde delfstoffen;

      c. per mijnbouwwerk: de hoeveelheden en soorten verbruikte delfstoffen;

      d. per mijnbouwwerk: de hoeveelheden en soorten vernietigde delfstoffen;

      e. per boorgat: de gewonnen hoeveelheden andere stoffen, dan delfstoffen;

      f. per boorgat: de ten behoeve van de winning in de ondergrond gebrachte hoeveelheden stoffen.

      2 De uitvoerder verstrekt de gegevens, bedoeld in het eerste lid, binnen vier weken na afloop van de betreffende
      kalendermaand.
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel111
  - number: '112'
    text: |-
      1 De uitvoerder verstrekt Onze Minister per kalendermaand de volgende gegevens die bij het ondergronds opslaan van
      stoffen zijn verkregen:

      a. per voorkomen: de hoeveelheden en soorten stoffen die zijn opgeslagen;

      b. per voorkomen: de hoeveelheden en soorten stoffen die zijn teruggehaald en afgevoerd;

      c. per mijnbouwwerk: de hoeveelheden en soorten stoffen die zijn teruggehaald en verbruikt, en

      d. per mijnbouwwerk: de hoeveelheden en soorten stoffen die zijn teruggehaald en vernietigd.

      2 De uitvoerder verstrekt de gegevens, bedoeld in het eerste lid, binnen vier weken na afloop van de desbetreffende
      kalendermaand.
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel112
  - number: '113'
    text: |-
      1 De uitvoerder verstrekt Onze Minister per voorkomen, waarin koolwaterstoffen zijn aangetroffen, jaarlijks voor
      1 maart de volgende gegevens:

      a. de door de uitvoerder voor het voorkomen gebezigde naam;

      b. de opsporings- of winningsvergunning of opsporings- of winningsvergunningen waaronder het voorkomen is gelegen;

      c. een structuurkaart;

      d. het vermoedelijke jaar van aanvang van de winning, indien nog geen winning plaatsvindt;

      e. de hoeveelheid aangetoonde winbare delfstoffen per 1 januari van het verslagjaar;

      f. de verwachte jaarlijks te winnen hoeveelheden delfstoffen, tot het moment waarop de winning wordt beëindigd;

      g. eventueel gebruik van het voorkomen voor opslag;

      h. de reservoirdruk, voor zover bekend;

      i. het feitelijk gebruik van de in het voorkomen aanwezige boorgaten, en

      j. de gegevens, bedoeld in [artikel 24, eerste lid, onderdelen b, c en k][ref1], voor zover de gegevens wezenlijk
      afwijken van het ingediende winningsplan.

      2 De uitvoerder verstrekt Onze Minister daarnaast jaarlijks de verwachte hoeveelheden winbare delfstoffen per
      vermoedelijk voorkomen in het vergunningsgebied dat niet door middel van opsporing is aangetoond, alsmede de
      daarbij behorende structuurkaarten.


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel24
