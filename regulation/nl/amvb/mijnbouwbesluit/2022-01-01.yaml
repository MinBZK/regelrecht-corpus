  - number: 143a
    text: |-
      1 Voor zover het niet verenigbaar is met het bij of krachtens de wet bepaalde om aan de winningsvergunning voor een
      afgesplitst gebiedsdeel de beperkingen en voorschriften te verbinden, die zijn verbonden aan de winningsvergunning
      waarvan dat gebiedsdeel is afgesplitst, kan Onze Minister aan de winningsvergunning voor het afgesplitste
      gebiedsdeel aangepaste voorschriften en beperkingen verbinden.

      2 Onze Minister kan voorschriften en beperkingen aanpassen als bedoeld in het eerste lid, mede met het oog op:

      a. het planmatig beheer of gebruik van delfstoffen, aardwarmte en andere natuurlijke rijkdommen, waaronder
      grondwater met het oog op de winning van drinkwater;

      b. mogelijkheden tot het opslaan van stoffen.
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel143a
  - number: '144'
    text: |-
      De wijze waarop een aanvraag om splitsing, afsplitsing of samenvoeging geschiedt en de gegevens en de bescheiden,
      welke daarbij worden overgelegd, geschiedt bij ministeriële regeling te stellen regels.
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel144
  - number: '145'
    text: |-
      In dit hoofdstuk wordt verstaan onder:

      a. het winnen van kalksteen: het met gebruikmaking van een boorgat, tunnel, schacht of ander ondergronds werk
      onttrekken van kalksteen aan de ondergrond;

      b. groeve: ondergrondse ruimte ontstaan door het winnen van kalksteen;

      c. gedeputeerde staten: gedeputeerde staten van de provincie waarin een groeve geheel of voor het grootste deel
      is gelegen.
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel145
  - number: '146'
    text: |-
      1 Het is verboden zonder vergunning van gedeputeerde staten kalksteen te winnen.

      2 Een vergunning kan slechts worden geweigerd ter bescherming van de veiligheid met het oog op instorting.

      3 Gedeputeerde staten kunnen in het belang van de veiligheid met het oog op instorting aan een vergunning
      voorschriften verbinden of een vergunning onder beperkingen verlenen.
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel146
  - number: '147'
    text: |-
      1 In een vergunning als bedoeld in [artikel 146][ref1] wordt bepaald voor welk tijdvak en welk gebied zij geldt.
      Het tijdvak waarvoor de vergunning geldt, kan op aanvraag van de vergunninghouder worden verlengd.

      2 In de vergunning kunnen in ieder geval voorschriften worden gesteld of beperkingen opgenomen omtrent:

      a. de wijze van winning;

      b. de ligging, hoogte en breedte van de tunnels, schachten of andere ondergrondse werken;

      c. de afmeting van de pilaren;

      d. de maatregelen bij het aantreffen van aardpijpen;

      e. de maatregelen bij het kruisen van tunnels, schachten of andere ondergrondse werken, en

      f. de wijze waarop en frequentie waarmee metingen naar de gesteentemechanische veiligheid van de groeve worden
      gedaan en de resultaten daarvan worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel146
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel147
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: '146'
        hoofdstuk: '10'
        paragraaf: '10.2'
  - number: '149'
    text: |-
      Indien een vergunning als bedoeld in [artikel 146][ref1] wordt overgedragen of anders dan door overdracht overgaat
      op een andere natuurlijke persoon of rechtspersoon, doet deze persoon binnen vier weken na de verkrijging ervan
      mededeling aan gedeputeerde staten.


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel146
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel149
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: '146'
        hoofdstuk: '10'
        paragraaf: '10.2'
  - number: '150'
    text: |-
      1 De houder van een vergunning als bedoeld in [artikel 146][ref1] verstrekt jaarlijks aan gedeputeerde staten een
      geactualiseerde kaart van de groeve.

      2 Bij ministeriële regeling kunnen regels worden gesteld omtrent de in het eerste lid bedoelde kaart.


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel146
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel150
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: '146'
        hoofdstuk: '10'
        paragraaf: '10.2'
  - number: '151'
    text: |-
      1 Het is verboden zonder vergunning van gedeputeerde staten een groeve, die niet langer in gebruik is voor het
      winnen van kalksteen, voor een ander doeleinde te gebruiken of daaraan enige wijziging aan te brengen.

      2 [Artikel 146, tweede en derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel146
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel151
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: '146'
        hoofdstuk: '10'
        paragraaf: '10.2'
  - number: '152'
    text: |-
      1 In een vergunning als bedoeld in [artikel 151][ref1] wordt bepaald voor welk doeleinde, welk tijdvak en welk
      gebied zij geldt. Het tijdvak waarvoor de vergunning geldt, kan op aanvraag van de vergunninghouder worden
      verlengd.

      2 In de vergunning kunnen in ieder geval voorschriften worden gesteld of beperkingen opgenomen omtrent:

      a. de maatregelen ter voorkoming dat gedeelten van de groeve, die buiten het vergunningsgebied vallen, worden
      betreden;

      b. de wijze waarop en frequentie waarmee de metingen naar de gesteentemechanische veiligheid van de groeve worden
      gedaan en de resultaten daarvan worden verstrekt, en

      c. de plaatsen van de groeve waaraan wijzigingen worden aangebracht, de omvang van die wijzigingen en de wijze
      waarop deze tot stand worden gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel151
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel152
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: '151'
        hoofdstuk: '10'
        paragraaf: '10.3'
  - number: '153'
    text: |-
      Het verbod van [artikel 146, eerste lid][ref1], is niet van toepassing op wijziging van een groeve voor het gebruik
      voor een ander doeleinde.


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel146
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel153
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: '146'
        hoofdstuk: '10'
