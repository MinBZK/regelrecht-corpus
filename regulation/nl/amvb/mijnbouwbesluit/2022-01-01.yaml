  - number: 84l
    text: |-
      1 Een exploitant van een productie-installatie en eigenaren van niet-productie-installaties voldoen aan de
      maatregelen die zijn vastgesteld in de kennisgevingen als bedoeld in de [artikelen 84j][ref1] en [84k][ref2].

      2 Een exploitant van een voorgenomen productie-installatie houdt rekening met de opmerkingen van het Staatstoezicht
      op de mijnen ten aanzien van de kennisgeving van het ontwerp voor deze installatie, in het rapport inzake grote
      gevaren voor de productie-installatie.


