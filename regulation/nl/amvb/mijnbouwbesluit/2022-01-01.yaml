        paragraaf: '6.1'
  - number: '100'
    text: |-
      1 Indien lekkage van een pijpleiding wordt geconstateerd, neemt de beheerder onmiddellijk alle passende maatregelen
      ter voorkoming of beperking van de schade.

      2 De beheerder stelt de pijpleiding, of het betrokken deel ervan, onmiddellijk buiten gebruik en maakt deze
      drukvrij als de lekkage risico op schade oplevert. De nodige herstelwerkzaamheden worden zo spoedig mogelijk
      verricht.

      3 De beheerder maakt onmiddellijk melding van een lekkage aan de inspecteur-generaal der mijnen en indien de
      pijpleiding op het continentaal plat of in de territoriale zee ligt, tevens aan het Kustwachtcentrum.

      4 De beheerder verstrekt de inspecteur-generaal der mijnen zo spoedig mogelijk gegevens omtrent:

      a. de oorzaken van de lekkage en de omstandigheden waaronder deze zich heeft voorgedaan;

      b. de eventuele ten gevolge van de lekkage vrijgekomen stoffen, alsmede hun eigenschappen;

      c. andere gegevens die van belang zijn om de aard en de ernst van de lekkage te kunnen beoordelen;

      d. de maatregelen die zijn genomen of worden overwogen om de gevolgen van de lekkage te voorkomen, te beperken of
      ongedaan te maken;

      e. de maatregelen die worden overwogen om te voorkomen dat een zodanige lekkage zich nogmaals kan voordoen.

      5 Dit artikel is van overeenkomstige toepassing in gevallen waarbij schade of een risico op schade ontstaat op
      andere wijze dan in het eerste lid bedoeld.
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel100
  - number: '101'
    text: |-
      1 Een herstelde pijpleiding, of het betrokken deel ervan, wordt niet eerder opnieuw in gebruik genomen, dan nadat
      Onze Minister aan de beheerder op diens verzoek heeft medegedeeld daarmee in te stemmen.

      2 De [artikelen 97, tweede en derde lid][ref1], en [98][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel97
      [ref2]: https://wetten.overheid.nl/BWBR0014394#Artikel98
