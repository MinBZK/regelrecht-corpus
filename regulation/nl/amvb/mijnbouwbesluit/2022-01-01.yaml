  - number: 40d
    text: |-
      1 Onze Minister kan aan de houder van een vergunning als bedoeld in de [artikelen 6][ref1] en [25][ref2] van de wet
      een instemming met een verwijderingsplan, bedoeld in [artikel 44a, eerste lid, van de wet][ref3] weigeren, indien:

      a. het verwijderingsplan onvoldoende voorziet in een beschrijving van werkzaamheden, methode en kosten van de
      verwijdering die nodig zijn gedurende de periode van uitvoering van het verwijderingsplan, waaronder monitoring;

      b. het verwachte resultaat van de uitvoering van het verwijderingsplan onvoldoende is beschreven;

      c. het mijnbouwwerk in aanmerking komt voor hergebruik;

      d. het mijnbouwwerk niet in aanmerking komt voor het in de aanvraag beschreven gedeeltelijk hergebruik als
      mijnbouwwerk;

      e. in het geval van hergebruik het bevoegd gezag, bedoeld in [artikel 44a, tweede lid, van de wet][ref4], voor
      zover het hergebruik betreft, geen verklaring van geen bedenkingen heeft gegeven;

      f. naar het oordeel van het bevoegde gezag krachtens de [Waterwet][ref5], de
      [Wet algemene bepalingen omgevingsrecht][ref6] of de [Wet bodembescherming][ref7] het voorstel tot onderzoeken of
      saneren van de bodem niet voldoet;

      g. de bestemming van de af te voeren materialen en afvalstoffen onduidelijk is;

      h. de planning van de uitvoering van de verwijdering niet duidelijk is of voorziet in een onredelijk lange termijn;

      i. de verwijdering van een mijnbouwwerk voor de winning van zout leidt tot:

      1°. meer bodembeweging, dan blijkt uit een beschrijving als bedoeld in
      [artikel 35, eerste lid, onder f, van de wet][ref8]; of

      2°. een andere wijze van het buiten gebruik stellen van een holruimte dan blijkt uit een beschrijving als bedoeld
      in [artikel 25, eerste lid, onder f][ref9].

      2 Onze Minister kan een instemming ambtshalve geheel of gedeeltelijk wijzigen of intrekken, indien:

      a. het bevoegde gezag, bedoeld in het eerste lid, onderdelen e en f, tot een afwijzend oordeel komt over het geheel
      of gedeeltelijk hergebruik van het mijnbouwwerk;

      b. het bevoegde gezag krachtens de wet geen vergunning verstrekt voor het opsporen, winnen, of opslaan van
      delfstoffen, aardwarmte, respectievelijk stoffen;

      c. de houder van een vergunning de instemming voor het geheel of een gedeelte van het verwijderingsplan niet langer
      nodig heeft; of

      d. de houder van een vergunning niet overeenkomstig de instemming handelt of heeft gehandeld.


