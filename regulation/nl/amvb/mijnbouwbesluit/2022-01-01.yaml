    text: |-
      1 Bij de melding, bedoeld in [artikel 44, eerste lid, van de wet][ref1] vermeldt de houder van een vergunning als
      bedoeld in de [artikelen 6][ref2] en [25 van de wet][ref3] in ieder geval:

      a. de locatie van het mijnbouwwerk;

      b. de datum waarop het mijnbouwwerk buiten werking is gesteld;

      c. de wijze waarop het mijnbouwwerk buiten werking is gesteld;

      d. in het geval van een mijnbouwwerk voor zoutwinning welke maatregelen zijn genomen om de holruimte te monitoren
      vanuit een analyse in een systeembenadering van de risico’s van dat mijnbouwwerk;

      e. bij een mijnbouwwerk anders dan een mijnbouwwerk voor zoutwinning, welke maatregelen noodzakelijk zijn aan de
      hand van de specifieke risico’s van dat mijnbouwwerk.

      2 Van de melding, bedoeld in het eerste lid, wordt door Onze Minister mededeling gedaan in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel6
