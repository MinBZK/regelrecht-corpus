  - number: '30'
    text: |-
      1 De uitvoerder verricht metingen naar bodembeweging ten gevolge van het winnen van delfstoffen of aardwarmte als
      bedoeld in [artikel 41 van de wet][ref1]. De metingen worden verricht overeenkomstig een meetplan.

      2 De uitvoerder dient het meetplan in bij Onze Minister voor ieder voorkomen waaruit wordt gewonnen.

      3 Het meetplan behoeft de instemming van Onze Minister alvorens met de winning wordt aangevangen.

      4 Onze Minister beslist over het meetplan binnen acht weken na indiening ervan. De instemming is van rechtswege
      gegeven, indien Onze Minister niet binnen de instemmingstermijn een beslissing heeft genomen. De instemming
      van rechtswege wordt voor de mogelijkheid van bezwaar en beroep gelijkgesteld met een besluit als bedoeld in
      [artikel 1:3, eerste lid, van de Algemene wet bestuursrecht][ref2].

      5 Onze Minister kan de instemming onder beperkingen geven en aan zijn instemming voorschriften verbinden.

      6 Het meetplan beslaat de termijn van de winning en de daarop volgende dertig jaren. De uitvoerder actualiseert
      het meetplan gedurende de periode van winning en de daarop volgende vijf jaren jaarlijks en verstrekt daarvan voor
      1 november afschrift aan Onze Minister. Onze Minister kan de uitvoerder een aanwijzing geven omtrent de tijdstippen
      waarop en de plaatsen waar gemeten wordt.

      7 Het meetplan bevat tenminste een beschrijving van:

      a. de tijdstippen waarop de metingen worden verricht;

      b. de plaatsen waar gemeten wordt, en

      c. de meetmethoden.

      8 Een van de tijdstippen, bedoeld in het zevende lid, onderdeel a, ligt voor de aanvang van de winning.

      9 Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent het meetplan.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel41
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel13
