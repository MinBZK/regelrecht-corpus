  - number: '64'
    text: |-
      1 De [artikelen 44 tot en met 49][ref1] en [paragraaf 5.2.3][ref2] zijn van overeenkomstige toepassing op een
      mijnbouwinstallatie als bedoeld in [artikel 63, eerste lid][ref3].

      2 Als de inspecteur-generaal der mijnen voor een mijnbouwwerk als bedoeld in artikel 2, eerste lid, onderdeel a,
      een werkprogramma voor het buiten gebruik stellen van een boorgat als bedoeld in [artikel 74, eerste lid][ref4],
      heeft ontvangen, is [artikel 44, eerste, tweede en derde lid, van de wet][ref5] niet van toepassing, indien het
      boorgat naar het oordeel van de inspecteur-generaal der mijnen in overeenstemming met het werkprogramma buiten
      gebruik is gesteld. De inspecteur-generaal der mijnen informeert Onze Minister over het oordeel.


