      1 Van de aan een winningsvergunning als bedoeld in [artikel 143, tweede lid, onderdeel c, van de wet][ref1]
      verbonden voorschriften vervallen die voorschriften die overeenkomen met het bepaalde in de volgende met een
      Romeinse cijfer aangeduide artikelen van het koninklijk besluit tot uitvoering van artikel 12 van de Mijnwet
      continentaal plat van 27 januari 1967 (Stb. 24):

      a. artikel III, onderdeel a,

      b. artikel III, onderdeel b, uitgezonderd artikel 31, eerste lid,

      c. artikel V, uitgezonderd de artikelen 6 en 7,

      d. artikel VIII,

      e. artikel IX, en

      f. artikel X.

      2 Van de aan de in het eerste lid bedoelde winningsvergunning verbonden voorschriften vervallen die voorschriften
      die overeenkomen met het bepaalde in de volgende met een Romeinse cijfer aangeduide artikelen van het koninklijk
      besluit tot uitvoering van artikel 12 van de Mijnwet continentaal plat van 6 februari 1976 (Stb. 102):

      a. artikel III, onderdeel a,

      b. artikel III, onderdeel b, uitgezonderd artikel 31, eerste lid,

      c. artikel V, uitgezonderd de artikelen 6 en 7,

      d. artikel VIII,

      e. artikel IX,

      f. artikel X, en

      g. artikel Xa.

      3 Van de aan de in het eerste lid bedoelde winningsvergunning verbonden
      voorschriften vervallen die voorschriften die overeenkomen met het bepaalde in
      [artikel 3.1 van het Besluit vergunningen koolwaterstoffen continentaal plat 1996][ref2] (Stb. 212).

      4 Van de aan de in het eerste lid bedoelde winningsvergunning verbonden voorschriften vervallen die voorschriften
      die overeenkomen met het bepaalde in de volgende artikelen van de Regeling vergunningen continentaal plat 1996
      (Stcrt. 93):

      a. artikel 5.1,

      b. artikel 5.7,

      c. artikel 5.8, en

      d. artikel 5.9.

      5 De voorschriften die krachtens artikel 5.1 van de Regeling vergunningen en concessies delfstoffen Nederlands
      territoir 1996 aan een vergunning als bedoeld in [artikel 143, tweede lid, onderdeel a, van de wet][ref3] zijn
