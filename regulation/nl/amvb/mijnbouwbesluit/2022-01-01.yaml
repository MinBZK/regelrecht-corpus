      1 Een mijnbouwwerk als bedoeld in [artikel 2, eerste lid, onderdelen a tot en met g][ref1], dat een
      gedeelte is van een mijnbouwwerk als bedoeld in artikel 2, tweede lid, is een geval als bedoeld in
      [artikel 44, vijfde lid, van de wet][ref2], voor de toepassing van artikel 44, eerste lid, van de wet, tenzij:

      a. Onze Minister voor dat mijnbouwwerk een aanvraag om een wijziging van een vergunning als bedoeld in
      [artikel 40, tweede lid, van de wet][ref3], of een verandering van een omgevingsvergunning als bedoeld in
      [artikel 2.1 van de Wet algemene bepalingen omgevingsrecht][ref4] heeft ontvangen;

      b. de inspecteur-generaal der mijnen voor dat mijnbouwwerk:

      1°. een werkprogramma voor het buiten gebruik stellen van een boorgat als bedoeld in
      [artikel 74, eerste lid][ref5], heeft ontvangen;

      2°. een rapport over een essentiële wijziging of een ontmanteling als bedoeld in de [artikelen 45e][ref6] en
      [45i van de wet][ref7] heeft ontvangen.

      2 De inspecteur-generaal der mijnen informeert Onze Minister over de ontvangst van een werkprogramma of een rapport
      als bedoeld in het eerste lid, onderdeel b, onder 1°, respectievelijk 2°.


