  - number: '102'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld omtrent het tijdelijk buiten gebruik stellen van een
      pijpleiding.
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel102
  - number: '103'
    text: |-
      1 Onze Minister maakt bij een besluit als bedoeld in [artikel 45, tweede lid, van de wet ][ref1]een afweging van
      belangen aan de hand van de volgende criteria:

      a. de doelmatigheid van het gebruik van de ruimte;

      b. de gevolgen voor het milieu;

      c. de veiligheid op zee en land en

      d. de doelmatigheid van de kosten.

      2 Onze Minister kan bij het overwegen tot het nemen van een besluit als bedoeld in
      [artikel 45, tweede lid, van de wet][ref2], over een pijpleiding op land het criterium, bedoeld in het eerste lid,
      onder a, achterwege laten, indien het besluit een pijpleiding betreft die is aangelegd vóór de inwerkingtreding van
      dit artikel.

      3 Bij ministeriële regeling worden nadere regels gesteld over de toepassing van de criteria.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel45
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel103
    references:
