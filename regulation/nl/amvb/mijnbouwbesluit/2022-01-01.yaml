        artikel: 2.42f
  - number: 84k
    text: |-
      1 Een kennisgeving, bedoeld in [artikel 45p van de wet](onbekend), bevat de volgende informatie:

      a. een op basis van [artikel 2.42][ref1] en [2.42f van het Arbeidsomstandighedenbesluit][ref2] op te stellen
      veiligheids- en gezondheidsdocument voor gelijktijdig uit te voeren werkzaamheden;

      b. overige informatie.

      2 Bij ministeriële regeling worden nadere regels gesteld over de kennisgeving.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2.42
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel2.42f
