  - number: '46'
    text: Bij het plaatsen van een mijnbouwinstallatie worden maatregelen genomen ter voorkoming van schade.
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel46
  - number: '47'
    text: |-
      Het plaatsen van een mijnbouwinstallatie gebeurt zodanig dat in de zeebodem aanwezige leidingen en kabels niet
      worden beschadigd.
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel47
  - number: '48'
    text: |-
      1 Voorafgaande aan het plaatsen van een mijnbouwinstallatie verricht de uitvoerder onderzoek naar:

      a. de gesteldheid van de bodem waar de mijnbouwinstallatie geplaatst zal worden met het oog op de stabiliteit van
      de installatie, en

      b. de aanwezigheid van obstakels in de onmiddellijke omgeving van de locatie waar de mijnbouwinstallatie geplaatst
      zal worden.

      2 De uitvoerder meldt twee weken voor de uitvoering van het onderzoek dit voornemen aan de directeur Kustwacht.
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel48
  - number: '49'
    text: |-
      1 Onmiddellijk na het plaatsen van de mijnbouwinstallatie, verstrekt de uitvoerder aan de inspecteur-generaal der
      mijnen nauwkeurige gegevens omtrent de locatie van de mijnbouwinstallatie.

      2 In het geval een bestaande productie-installatie de Nederlandse wateren binnenkomt of verlaat, stelt de
      exploitant van de productie-installatie de inspecteur-generaal der mijnen binnen een bij ministeriële regeling
      vast te stellen termijn, die in ieder geval vóór de datum waarop de productie-installatie de Nederlandse wateren
      binnenkomt of verlaat ligt, hiervan op de hoogte.
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel49
  - number: '50'
    text: |-
      1 Een mijnbouwinstallatie is voldoende sterk om de als gevolg van windsterkte, golfslag, zeestroming en gebruik van
      de installatie te verwachten krachten te weerstaan.

      2 Een mijnbouwinstallatie mag niet verzakken, verschuiven of afdrijven.

      3 Een mijnbouwinstallatie is met het oog op het landen van helikopters veilig geplaatst.
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel50
  - number: '51'
    text: |-
      1 Een mijnbouwinstallatie is voorzien van een helikopterdek.

      2 Het helikopterdek:

      a. is voldoende groot voor het gebruik door helikopters;

      b. is voorzien van markering en apparatuur voor het landen en stijgen van helikopters;

      c. is geschikt voor het parkeren van helikopters;

      d. ligt vrij ten opzichte van andere delen van de mijnbouwinstallatie, en

      e. is vrij van obstakels en brandbare stoffen.

      3 De uitvoerder overlegt aan Onze Minister van Infrastructuur en Milieu een gedetailleerde tekening van het
      helikopterdek en een tekening van de mijnbouwinstallatie waarop het helikopterdek is aangegeven.

      4 Het helikopterdek wordt slechts gebruikt na instemming door Onze Minister van Infrastructuur en Milieu.
      Instemming wordt slechts geweigerd op grond van de eisen van het tweede lid. De instemming geldt voor een periode
      van maximaal drie jaar.

      5 Onze Minister kan ontheffing verlenen van het eerste lid. De ontheffing kan onder
      beperkingen worden verleend of daaraan kunnen voorschriften worden verbonden. Met
      toepassing van [artikel 28, eerste lid, laatste zinsnede, van de Dienstenwet][ref1] is
      [paragraaf 4.1.3.3. van de Algemene wet bestuursrecht][ref2] niet van toepassing op de aanvraag om een ontheffing.

      6 Bij regeling van Onze Minister van Infrastructuur en Milieu worden nadere regels gesteld omtrent de in het tweede
      lid genoemde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: '52'
    text: |-
      1 Een mijnbouwinstallatie is ter waarborging van de veiligheid voorzien van:

      a. herkenningstekens,

      b. geluidsbakens,

      c. lichtbakens, en

      d. voor zover Onze Minister van Infrastructuur en Milieu zulks bepaalt: elektronische bakens of radarreflectoren.

      2 De mijnbouwinstallatie is voorts voorzien van communicatiemiddelen waarmee onder alle omstandigheden verbinding
      mogelijk is met de vaste wal en met vaartuigen, die voor verkenning, opsporing of winning in gebruik zijn.

      3 Een mijnbouwinstallatie is verder voorzien van apparatuur waarmee meteorologisch en oceanografische waarnemingen
      worden verricht, voor zover Onze Minister van Infrastructuur en Milieu zulks bepaalt.

      4 De in het eerste lid, onderdeel a, bedoelde herkenningstekens:

      a. bestaan voor een voor de winning bestemde mijnbouwinstallatie uit de indicatie van het vergunningsgebied waarin
      de mijnbouwinstallatie is geplaatst met daaraan een toevoeging, waardoor een unieke aanduiding ontstaat; die
      aanduiding is eenmalig en kan niet gewijzigd worden;

      b. zijn voor een voor de opsporing gebruikte mijnbouwinstallatie een unieke aanduiding die in het internationaal
      verkeer wordt gebruikt.

      5 De ononderbroken werking van de in het eerste lid, onderdelen b en c, bedoelde licht- en geluidsbakens is
      gewaarborgd.

      6 Onze Minister van Infrastructuur en Milieu kan ontheffing verlenen van de in het eerste lid, onderdelen b en
      c, bedoelde verplichtingen. De ontheffing kan onder beperkingen worden verleend of daaraan kunnen voorschriften
      worden verbonden. Met toepassing van [artikel 28, eerste lid, laatste zinsnede, van de Dienstenwet][ref1] is
      [paragraaf 4.1.3.3. van de Algemene wet bestuursrecht][ref2] niet van toepassing op de aanvraag om een ontheffing.

      7 Op verzoek van Onze Minister van Infrastructuur en Milieu toont de uitvoerder aan dat de desbetreffende
      apparatuur, bedoeld in het eerste lid, voldoet aan de bij of krachtens dit artikel gestelde eisen.

      8 Bij ministeriële regeling, in overeenstemming met Onze Minister van Infrastructuur en Milieu, worden regels
      gesteld omtrent de in het eerste lid bedoelde herkenningstekens, bakens, reflectoren, de in het tweede lid bedoelde
      communicatiemiddelen en de in het derde lid genoemde apparatuur en waarnemingen, alsmede het verstrekken van de
      daarmee verkregen gegevens aan Onze Minister van Infrastructuur en Milieu.


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel52
