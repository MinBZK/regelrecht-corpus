    text: |-
      De uitvoerder verstrekt Onze Minister jaarlijks voor 1 april:

      a. de resultaten van de monitoring van het opgeslagen CO over het daaraan voorafgaande kalenderjaar met vermelding
      van de gebruikte technologie,

      b. het bewijs dat financiële zekerheid of een gelijkwaardige voorziening is gesteld en aangehouden en

      c. wijzigingen in de financiële en technische mogelijkheden van de vergunninghouder.
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel29k
  - number: 29l
    text: |-
      1 Indien de uitvoerder een verzoek doet om het intrekken van een vergunning voor permanent opslaan van CO als
      bedoeld in [artikel 31j van de wet][ref1] overlegt hij aan Onze Minister:

      a. gegevens waaruit blijkt dat het opgeslagen CO volledig en permanent ingesloten blijft,

      b. een voorstel voor een financiële bijdrage als bedoeld in [artikel 31j, eerste lid, onderdeel d, van de wet][ref2]
      die de uitvoerder zal betalen bij de intrekking van de vergunning.

      2 De financiële bijdrage, bedoeld in het eerste lid, houdt rekening met de in bijlage I van de richtlijn 2009/31/
      EG van het Europees Parlement en de Raad van 23 april 2009 betreffende de geologische opslag van kooldioxide en
      tot wijziging van richtlijn 85/337/EEG van de Raad, de richtlijnen 2000/60/EG, 2001/80/EG, 2004/35/EG, 2006/12/
      EG en 2008/1/EG en verordening (EG) nr. 1013/2006 (PbEG L 140) van het Europese Parlement en de Raad bedoelde
      parameters en elementen inzake de voorgeschiedenis van de opslag van CO die relevant zijn voor het bepalen van de
      verplichtingen die na de overdracht gelden en dekt tenminste de geraamde monitoringskosten voor een periode van 30
      jaar na het intrekken van de vergunning.


