  - number: '56'
    text: |-
      1 Bij het verzoek om instemming als bedoeld in [artikel 55, eerste lid][ref1], worden in ieder geval overgelegd:

      a. gegevens omtrent de aanwezigheid van leidingen en kabels in de nabijheid van de beoogde plaats van plaatsing;

      b. gegevens omtrent de gesteldheid van de bodem en de aanwezigheid van obstakels als bedoeld in [artikel 48][ref2];

      c. bij een voor de winning of opslag bestemde mijnbouwinstallatie: het ontwerp van de dragende constructie alsmede
      een beschrijving van de wijze van plaatsing en een opgave van de herkenningstekens, geluidsbakens, lichtbakens en,
      voor zover Onze Minister van Infrastructuur en Milieu zulks bepaalt, elektronische bakens of radarreflectoren van
      de mijnbouwinstallatie;

      d. bij een voor de opsporing bestemde mijnbouwinstallatie op een voor de opsporing bestemde locatie: een verklaring
      van een onafhankelijke deskundige dat de technische integriteit van de mijnbouwinstallatie gewaarborgd is, met dien
      verstande dat:

      1°. overlegging niet noodzakelijk is indien de verklaring niet ouder is dan vijf jaar en de verklaring reeds eerder
      is verstrekt;

      2°. [artikel 53a, tweede lid][ref3], van overeenkomstige toepassing is;

      e. bij een voor de winning of opslag bestemde mijnbouwinstallatie: een verklaring van een onafhankelijke deskundige
      dat naar zijn voorlopige oordeel de te plaatsen mijnbouwinstallatie voldoet aan [artikel 50][ref4].

      2 Bij ministeriële regeling kunnen regels worden gesteld omtrent de in de onderdelen d en e bedoelde verklaring.


