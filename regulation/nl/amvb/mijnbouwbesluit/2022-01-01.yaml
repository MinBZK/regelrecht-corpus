  - number: 103b
    text: |-
      Als een in niet gemeentelijk ingedeeld gebied gelegen pijpleiding buiten werking is als bedoeld in
      [artikel 45, eerste lid, van de wet][ref1] is [paragraaf 5.2.3][ref2] van overeenkomstige toepassing, met dien
      verstande dat de beheerder:

      a. bij een melding overeenkomstig [artikel 61][ref3] de volgende informatie overlegt:

