    text: |-
      1 Dit hoofdstuk is van toepassing op verkenningsonderzoek dat plaatsvindt met gebruikmaking van kunstmatig
      opgewekte trillingen.

      2 In dit hoofdstuk wordt verstaan onder onderzoeker: degene in wiens opdracht het verkenningsonderzoek wordt
      verricht, dan wel, bij afwezigheid van een opdrachtgever, degene die het verkenningsonderzoek verricht.
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel9
  - number: '10'
    text: |-
      1 Tenminste vier weken voor de aanvang van een verkenningsonderzoek, verstrekt de onderzoeker aan de inspecteur-
      generaal der mijnen:

      a. gegevens omtrent de wijze waarop het verkenningsonderzoek zal worden verricht;

      b. een kaart waarop is aangegeven het gebied waarin en de lijnen waarlangs het verkenningsonderzoek zal worden
      verricht en de naam van de opdrachtnemer;

      c. de data waarop het verkenningsonderzoek zal worden verricht;

      d. indien bij het verkenningsonderzoek op zee gebruik gemaakt zal worden van vaartuigen: de namen, nationaliteit en
      registratiekenmerken van die vaartuigen;

      e. indien het verkenningsonderzoek wordt verricht in oppervlaktewater dat matig of druk wordt bevaren als bedoeld
      in [artikel 16][ref1], respectievelijk [artikel 17][ref2]:

      1°. informatie over de bekwaamheid en ervaring van de persoon die contact houdt met de overige scheepvaart in en om
      het onderzoeksgebied;

      2°. informatie over het vaartuig en de uitrusting van het vaartuig met betrekking tot radar-, navigatie- en
      telecommunicatieapparatuur, waarop de persoon, bedoeld onder 1°, zich bevindt, en

      f. indien het verkenningsonderzoek wordt verricht in oppervlaktewater dat druk wordt bevaren wordt tevens
      informatie als bedoeld in onderdeel e verstrekt over de persoon en de vaartuigen die de persoon, bedoeld in
      onderdeel e, onder 1°, bijstaan.

      2 In afwijking van het eerste lid, aanhef, kan de informatie, bedoeld in het eerste lid, onderdelen e en f, na
      instemming van Onze Minister op een later tijdstip voorafgaande aan het verkenningsonderzoek worden verstrekt.

      3 De onderzoeker doet de inspecteur-generaal der mijnen onmiddellijk mededeling van wijzigingen in de in het eerste
      lid bedoelde gegevens.

      4 Indien een onderzoeker het verkenningsonderzoek in oppervlaktewater uitvoert, kan de inspecteur-generaal der
      mijnen een onderzoeker verplichten door de inspecteur-generaal aangewezen ambtenaren te vervoeren met een daartoe
      geschikt vervoermiddel naar door deze ambtenaren aan te duiden plaatsen waar een verkenningsonderzoek wordt of zal
      worden uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0014394#Artikel17
