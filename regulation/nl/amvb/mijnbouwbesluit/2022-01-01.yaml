      1 Toestemming om verkenningsonderzoek in te stellen op de delen van het continentaal plat als bedoeld in de
      artikelen 4.12 tot en met 4.17 van de Regeling vergunningen koolwaterstoffen continentaal plat 1996 geldt als een
      vergunning als bedoeld in de [artikelen 18][ref1] en [20][ref2].

      2 Toestemming om opsporingsonderzoek of winningsonderzoek te verrichten op de delen van het continentaal
      plat als bedoeld in de artikelen 4.12 tot en met 4.17 respectievelijk de artikelen 5.7 tot en met 5.10 van
      de Regeling vergunningen koolwaterstoffen continentaal plat 1996 geldt als een ontheffing als bedoeld in de
      [artikelen 44][ref3] en [45][ref4].

      3 Het tweede lid is van overeenkomstige toepassing op een in de territoriale zee of het continentaal plat gelegen
      mijnbouwinstallatie als bedoeld in [artikel 63][ref5].


