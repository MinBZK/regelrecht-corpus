      - id: ref2
        bwb_id: BWBR0014394
        artikel: '151'
        hoofdstuk: '10'
        paragraaf: '10.3'
  - number: '160'
    text: |-
      1 De houder van een vergunning als bedoeld in de [artikelen 146][ref1] en [151][ref2] doet tijdig van het voornemen
      tot het buitengebruik stellen van een groeve, of een gedeelte ervan, mededeling aan gedeputeerde staten. De houder
      verstrekt daarbij een geactualiseerde kaart van de groeve.

      2 Bij het buiten gebruik stellen van de groeve, of een gedeelte ervan, worden alle nodige maatregelen genomen ter
      beperking van het gevaar voor instorting.

      3 De toegangen tot de groeve worden behoorlijk afgesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel146
      [ref2]: https://wetten.overheid.nl/BWBR0014394#Artikel151
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel160
