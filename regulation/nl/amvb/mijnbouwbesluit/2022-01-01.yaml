      1 Indien bij mijnbouwactiviteiten op het continentaal plat een archeologisch monument als bedoeld
      in [artikel 1.1 van de Erfgoedwet][ref1] of een vermoedelijk archeologisch monument wordt gevonden
      of een archeologische vondst als bedoeld in artikel 1.1 van de Erfgoedwet wordt aangetroffen, is
      [artikel 5.10 van de Erfgoedwet][ref2] van toepassing en zijn de [artikelen 56][ref3], [58, eerste lid][ref4], en
      [59 van de Monumentenwet 1988][ref5], zoals die [wet][ref6] luidde voor inwerkingtreding van de [Erfgoedwet][ref7],
      van overeenkomstige toepassing.

      2 De uitvoerder onderscheidenlijk de beheerder stelt de onderzoeksgegevens, bedoeld in [artikel 48][ref8],
      onderscheidenlijk de gegevens voortvloeiend uit onderzoek naar de aanleg en ligging van een pijpleiding als
      bedoeld in [artikel 92, onderdeel a][ref9], ter beschikking aan Onze Minister van Onderwijs, Cultuur en Wetenschap,
      voor zover die gegevens informatie kunnen verschaffen over de aanwezigheid van archeologische monumenten dan wel
      vermoedelijke archeologische monumenten in of op de bodem van de territoriale zee of het continentaal plat.


