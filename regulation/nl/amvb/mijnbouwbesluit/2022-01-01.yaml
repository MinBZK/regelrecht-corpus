  - number: '97'
    text: |-
      1 Een pijpleiding wordt niet voor de eerste maal in gebruik genomen, dan nadat Onze Minister de beheerder op diens
      verzoek heeft meegedeeld daarmee in te stemmen.

      2 De beheerder doet het verzoek, bedoeld in het eerste lid, uiterlijk twee weken voordat hij de pijpleiding in
      gebruik wil nemen. Daarbij verstrekt de beheerder aan Onze Minister:

      a. een verklaring van een onafhankelijke deskundige, waarin wordt beoordeeld of de eigenschappen en de aanleg van
      de pijpleiding voldoen aan de bij of krachtens [artikel 93][ref1] gestelde eisen, en

      b. gegevens waaruit blijkt dat de ligging van de pijpleiding die is aangelegd in de territoriale zee of het
      continentaal plat voldoet aan de bij of krachtens [artikel 93][ref2] gestelde eisen en, voor zover van toepassing,
      aan de desbetreffende vergunningvoorschriften.

      3 De instemming tot ingebruikname is van rechtswege gegeven, indien Onze Minister niet binnen twee weken na
      ontvangst van het verzoek de in het eerste lid bedoelde mededeling heeft gedaan, tenzij zich een geval voordoet
      als bedoeld in [artikel 98][ref3]. De instemming van rechtswege wordt voor de mogelijkheid van bezwaar en beroep
      gelijkgesteld met een besluit als bedoeld in [artikel 1:3, eerste lid, van de Algemene wet bestuursrecht][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel93
      [ref2]: https://wetten.overheid.nl/BWBR0014394#Artikel93
      [ref3]: https://wetten.overheid.nl/BWBR0014394#Artikel98
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel13
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel97
