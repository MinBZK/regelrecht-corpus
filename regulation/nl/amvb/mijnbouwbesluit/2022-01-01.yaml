  - number: '26'
    text: |-
      1 Voor het opslaan van stoffen als bedoeld in [artikel 39, onderdeel b, van de wet][ref1] bevat een desbetreffend
      plan:

      a. een beschrijving van de hoeveelheid en de samenstelling van de stoffen die worden opgeslagen;

      b. een opgaaf van de gegevens met betrekking tot de structuur van het voorkomen en de ligging van het voorkomen
      ten opzichte van andere aardlagen, met bijbehorende geologische, geofysische en petrofysische studies en de daarbij
      gehanteerde onzekerheidsanalyses;

      c. een opgaaf van de stoffen die worden gebruikt bij het in de ondergrond brengen van de stoffen;

      d. een inventarisatie van de risico's ten aanzien van de verspreiding van de stoffen die in de ondergrond worden
      opgeslagen, het optreden van chemische processen in de ondergrond en de aantasting van de in de ondergrond
      aanwezige reservoirs met delfstoffen of de samenstelling van deze delfstoffen;

      e. een inventarisatie van maatregelen die worden getroffen om de risico's, bedoeld in onderdeel d, te voorkomen;

      f. een beschrijving van de wijze waarop het voorkomen na beëindiging van de opslag wordt achtergelaten, en

      g. een risico-analyse omtrent bodembeweging als gevolg van de opslag.

      2 [Artikel 24, eerste lid, onderdelen d tot en met g, en onderdelen l, q, r en s][ref2], alsmede
      [artikel 24, tweede lid][ref3], zijn van overeenkomstige toepassing, met dien verstande dat het
      [eerste lid, onderdeel g, en de onderdelen q, r en s][ref4] niet van toepassing zijn op voorkomens die gelegen zijn
      aan de zeezijde van de lijn die in de [bijlage bij de wet](onbekend) is vastgelegd.

      3 Dit artikel is niet van toepassing indien [§ 3.5][ref5] van dit besluit van toepassing is.


