  - number: 84e
    text: |-
      1 Een regeling voor onafhankelijke verificatie voor boorgatactiviteiten als bedoeld in artikel 45l van de wet,
      waarborgt op onafhankelijke wijze dat het ontwerp en de controlemaatregelen voor de boorgaten te allen tijde
      geschikt zijn voor de verwachte boorgatomstandigheden.

      2 Een onafhankelijke verificateur dient voldoende onafhankelijk en deskundig te zijn.

      3 Bij ministeriële regeling worden ten aanzien van de regeling als bedoeld in het eerste lid nadere regels gesteld
      over de selectie van de onafhankelijke verificateur, over het ontwerp van de regeling alsmede welke informatie moet
      worden voorgelegd over de regeling.
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel84e
  - number: 84f
    text: |-
      1 Een regeling voor onafhankelijke verificatie voor installaties als bedoeld in [artikel 45l van de wet](onbekend),
      waarborgt op onafhankelijke wijze dat de veiligheids- en milieukritische elementen die worden vermeld in de
      risicobeoordeling voor de installatie als beschreven in het rapport inzake grote gevaren, geschikt zijn en dat de
      planning van inspecties en testen van de veiligheids- en milieukritische elementen geschikt en bijgewerkt zijn en
      verlopen zoals voorzien.

      2 Een onafhankelijke verificateur dient voldoende onafhankelijk en deskundig te zijn.

      3 De regeling voor onafhankelijke verificatie wordt voor een productie-installatie getroffen voordat het ontwerp
      is voltooid.

      4 De regeling voor onafhankelijke verificatie wordt voor een niet- productie-installatie getroffen voordat de
      activiteiten worden gestart.

      5 Bij ministeriële regeling worden nadere regels gesteld over de selectie van de onafhankelijke verificateur, over
      het ontwerp van de regeling alsmede welke informatie moet worden voorgelegd over de regeling.
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel84f
  - number: 84g
    text: |-
      1 Een eigenaar van een niet-productie-installatie en een exploitant van een productie-installatie nemen binnen
      een bij ministeriële regeling vast te stellen termijn op basis van het advies van de onafhankelijke verificateur
      passende maatregelen en reageren op het advies van de onafhankelijke verificateur.

      2 Een eigenaar van een niet-productie-installatie en een exploitant van een productie-installatie stellen het
      Staatstoezicht op de Mijnen in kennis van het advies van de onafhankelijke verificateur en de reactie op het
      advies, binnen een bij ministeriële regeling vast te stellen termijn.
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel84g
  - number: 84h
    text: |-
      Deze paragraaf is van toepassing op mijnbouwwerken die gebruikt worden voor de opsporing of winning van
      koolwaterstoffen.
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel84h
  - number: 84i
    text: |-
      1 Een kennisgeving als bedoeld in [artikel 45m van de wet](onbekend), bevat de volgende informatie:

      a. een op basis van [artikel 2.42f van het Arbeidsomstandighedenbesluit][ref1] op te stellen veiligheids- en
      gezondheidsdocument voor een voorgenomen installatie;

      b. overige informatie.

      2 Bij ministeriële regeling worden nadere regels gesteld over de kennisgeving.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2.42f
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel84i
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: 2.42f
  - number: 84j
    text: |-
      1 Een kennisgeving als bedoeld in [artikel 45n van de wet](onbekend), bevat de volgende informatie:

      a. gegevens van het ontwerp van de boorgat;

      b. de voorgestelde boorgatactiviteiten;

      c. het werkprogramma, bedoeld in [artikel 74][ref1];

      d. een op basis van [artikel 2.42][ref2] en [2.42f van het Arbeidsomstandighedenbesluit][ref3] op te stellen
      veiligheids- en gezondheidsdocument voor werkzaamheden;

      e. de bevindingen en opmerkingen van de onafhankelijke verificateur en de reactie van de exploitant en de door hem
      genomen maatregelen ten gevolge daarvan;

      f. overige informatie.

      2 De exploitant voldoet in geval van een boorgatactiviteit aan de maatregelen die zijn vastgesteld in de
      kennisgeving van de boorgatactiviteit.

      3 Bij ministeriële regeling worden nadere regels gesteld over de kennisgeving.


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel74
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel2.42
      [ref3]: https://wetten.overheid.nl/BWBR0008498#Artikel2.42f
