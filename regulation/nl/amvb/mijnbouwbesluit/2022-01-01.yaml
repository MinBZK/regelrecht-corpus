    text: |-
      1 Een meetregister als bedoeld in [artikel 134 van het Mijnreglement 1964][ref1] geldt met ingang van het
      tijdstip van inwerkingtreding van de [Mijnbouwwet][ref2] gedurende zes maanden als een meetplan als bedoeld in
      [artikel 30][ref3].

      2 Indien een uitvoerder voor de afloop van de in het eerste lid bedoelde termijn een aanvraag om instemming
      als bedoeld in [artikel 30][ref4] bij Onze Minister heeft ingediend en niet voor de afloop van die termijn de
      beslissing van Onze Minister onherroepelijk vaststaat, kan het gebruik van het meetregister worden voortgezet tot
      het laatstbedoelde tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0002474#Artikel134
