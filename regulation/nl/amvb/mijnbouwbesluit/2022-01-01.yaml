  - number: '65'
    text: |-
      De uitvoerder doet acht weken voor plaatsing van een mijnbouwinstallatie als bedoeld in
      [artikel 63, eerste lid][ref1], mededeling aan de inspecteur-generaal der mijnen. Bij de mededeling worden het
      ontwerp van de constructie, de gegevens bedoeld in [artikel 56, eerste lid, onderdelen a en b][ref2], alsmede een
      beschrijving van de wijze van plaatsing gevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel63
      [ref2]: https://wetten.overheid.nl/BWBR0014394#Artikel56
