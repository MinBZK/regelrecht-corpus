      1 Bij het verrichten van mijnbouwactiviteiten worden maatregelen genomen ter voorkoming van schade.

      2 Indien bij het verrichten van mijnbouwactiviteiten ernstige schade dreigt te ontstaan of is ontstaan, wordt
      hiervan onmiddellijk mededeling gedaan aan de inspecteur-generaal der mijnen.
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel3
  - number: '4'
    text: |-
      1 De uitvoerder stelt een werkplan vast waarin alle in een vergunningsgebied uit te voeren mijnbouwactiviteiten
      staan vermeld.

      2 Het werkplan is een jaarlijks voortschrijdend vijfjarenplan. De uitvoerder dient het plan in bij de inspecteur-
      generaal der mijnen binnen vier weken na verlening van een vergunning als bedoeld in [artikel 6][ref1]
      of [25 van de wet][ref2] en vervolgens jaarlijks voor 1 november van het jaar, voorafgaand aan het eerste
      kalenderjaar waarop het plan betrekking heeft.

      3 Ingrijpende afwijkingen van de in het eerste kalenderjaar opgenomen mijnbouwactiviteiten waarop het
      desbetreffende werkplan betrekking heeft, worden tenminste vier weken voor de verrichting van de desbetreffende
      activiteit ter kennis gebracht van de inspecteur-generaal der mijnen.

      4 Bij ministeriële regeling worden nadere regels gesteld omtrent de inhoud van het werkplan.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel25
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel4
