  - number: '57'
    text: Deze paragraaf heeft betrekking op mijnbouwinstallaties die boven het oppervlaktewater uitsteken.
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel57
  - number: '58'
    text: |-
      De houder van een vergunning als bedoeld in de [artikelen 6][ref1] en [25 van de wet][ref2] is niet gehouden een
      melding als bedoeld in [artikel 44, eerste lid, van de wet][ref3] te doen in het geval de mijnbouwinstallatie voor
      een periode van maximaal een jaar buiten werking is, als gevolg van:

      a. het uitvoeren van reparatie, onderhoud of aanpassingen van het gedeelte van de mijnbouwinstallatie boven de
      waterbodem;

      b. het uitvoeren van een werkprogramma als bedoeld in [artikel 74, eerste lid][ref4];

      c. het doen van onderzoek na een ongeluk of een incident;

      d. het doen van onderzoek naar de mogelijkheden en effecten van de opsporing, winning of opslag in een gemeentelijk
      ingedeeld gebied;

      e. het niet kunnen uitvoeren van werkzaamheden door een van buiten komende oorzaak, waaronder het tijdelijk niet
      beschikbaar zijn van ondersteunende installaties, pijpleidingen, kabels, personeel, materialen, grondstoffen,
      hulpstoffen, of diensten van derden die noodzakelijk zijn voor het in werking houden van het mijnbouwwerk of het
      niet tijdig kunnen beschikken over de benodigde vergunningen of toestemmingen.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel6
