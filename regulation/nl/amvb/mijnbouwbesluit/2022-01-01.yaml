  - number: '18'
    text: |-
      1 Het is verboden zonder vergunning van Onze Minister, in overeenstemming met Onze Minister van Infrastructuur en
      Milieu, verkenningsonderzoek te verrichten in of boven de delen van de territoriale zee en het continentaal plat
      die worden gebruikt als ankergebieden nabij aanloophavens en bij ministeriële regeling zijn aangegeven.

      2 Een vergunning kan onder beperkingen worden verleend en daaraan kunnen voorschriften worden verbonden.

      3 Een vergunning wordt slechts geweigerd in het belang van de scheepvaart.
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel18
  - number: '19'
    text: |-
      1 Het is verboden zonder vergunning van Onze Minister, in overeenstemming met Onze Minister van Defensie,
      verkenningsonderzoek te verrichten in of boven de delen van oppervlaktewater die worden gebruikt als oefen- en
      schietgebied en bij ministeriële regeling zijn aangegeven.

      2 Een vergunning kan onder beperkingen worden verleend en daaraan kunnen voorschriften worden verbonden.

      3 Een vergunning wordt slechts geweigerd in het belang van de landsverdediging.
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel19
  - number: '20'
    text: |-
      Het is verboden verkenningsonderzoek te verrichten in gebieden die deel uit maken van de territoriale zee en het
      continentaal plat, die bij ministeriële regeling zijn aangewezen als aanloopgebied Hoek van Holland.
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel20
  - number: '21'
    text: Het is verboden in oppervlaktewater ontplofbare stoffen te gebruiken voor verkenningsonderzoek.
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel21
  - number: '22'
    text: |-
      1 Het is verboden zonder vergunning van Onze Minister met gebruik van ontplofbare stoffen verkenningsonderzoek te
      verrichten anders dan in oppervlaktewater.

      2 Een vergunning kan onder beperkingen worden verleend en daaraan kunnen voorschriften worden verbonden. Die
      voorschriften kunnen in ieder geval betrekking hebben op:

      a. aard, aanduiding en hoeveelheid van de te gebruiken ontplofbare stoffen;

      b. wijze van gebruik van de onder a bedoelde stoffen;

      c. maatregelen die worden genomen ter voorkoming van schade, en

      d. de periode waarin gebruik kan worden gemaakt van de onder a bedoelde stoffen.

      3 Een vergunning wordt slechts geweigerd in het belang van het milieu of de veiligheid.
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel22
  - number: '23'
    text: |-
      1 De onderzoeker draagt ervoor zorg dat een verkenningsonderzoek waarbij ontplofbare stoffen worden gebruikt:

      a. op zodanige wijze wordt verricht dat de veiligheid van derden niet in gevaar wordt gebracht;

      b. op zodanige wijze wordt verricht dat schade aan het milieu zoveel mogelijk wordt voorkomen dan wel beperkt;

      c. in voorkomend geval tijdig voor de aanvang ervan wordt aangemeld bij burgemeester en wethouders van de gemeente
      waarin het onderzoek zal plaatsvinden;

      d. op zodanige afstand tot gebouwen, kunstwerken, openbare werken en andere zaken wordt verricht dat schade daaraan
      wordt voorkomen, en

      e. de niet tot ontploffing gekomen stoffen onschadelijk worden gemaakt of afgevoerd.

      2 Bij ministeriële regeling worden nadere regels gesteld omtrent het gebruik van ontplofbare stoffen.
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel23
  - number: '24'
    text: |-
      1 Het winningsplan, bedoeld in [artikel 34, eerste lid, van de wet][ref1] voor de winning van koolwaterstoffen
      bevat:

      a. een beschrijving van de verwachte hoeveelheid en de samenstelling van de aanwezige koolwaterstoffen,
      onderverdeeld naar reservoirlaag en reservoircompartiment;

      b. een opgaaf van de gegevens met betrekking tot de structuur van het voorkomen, onderverdeeld naar reservoirlaag
      en reservoircompartiment, met bijbehorende geologische, geofysische en petrofysische studies en de daarbij
      gehanteerde onzekerheidsanalyses;

      c. een beschrijving van een wijze van winning die niet in strijd is met de bij of krachtens dit besluit geldende
      wettelijke voorschriften inzake winning van koolwaterstoffen;

      d. een beschrijving van het mijnbouwwerk en de ligging ervan;

      e. een opgaaf van het aantal boorgaten dat bij de winning wordt gebruikt;

      f. een opgaaf van de volgorde en het tijdsbestek van het maken van de boorgaten;

      g. een opgaaf van de ligging, lengte en diameter van de verbuizing van de boorgaten;

      h. een opgaaf van de plaats en wijze waarop de koolwaterstoffen in de verbuizing treden;

      i. een opgaaf van de samenstelling en hoeveelheden van de stoffen, die jaarlijks onvermijdelijk bij de winning van
      koolwaterstoffen meekomen;

      j. een opgaaf van de hoeveelheden gewonnen koolwaterstoffen die jaarlijks bij de winning wordt gebruikt, afgeblazen
      of afgefakkeld;

      k. een opgaaf van de samenstelling en hoeveelheden delfstoffen en andere stoffen die jaarlijks bij de winning in de
      ondergrond worden teruggebracht;

      l. een opgaaf van de jaarlijkse kosten van de winning, onderverdeeld in kosten voor investeringen, onderhoud,
      bedrijfvoering, en de kosten van het verlaten en verwijderen van mijnbouwwerken;

      m. een kaart met daarop de contouren van de verwachte uiteindelijke mate van bodemdaling;

      n. een overzicht met het verloop van de verwachte mate van bodemdaling in de tijd;

      o. een opgaaf van de onzekerheid omtrent de verwachte mate van bodemdaling als bedoeld in de onderdelen m en n;

      p. een risico-analyse omtrent bodemtrillingen als gevolg van de winning;

      q. een beschrijving van de mogelijke omvang en verwachte aard van de schade door bodembeweging;

      r. een beschrijving van de maatregelen die worden genomen om bodembeweging te voorkomen of te beperken, en

      s. een beschrijving van de maatregelen die worden genomen om schade door bodembeweging te voorkomen of te beperken.

      De onderdelen m tot en met s zijn niet van toepassing op voorkomens die gelegen zijn aan de zeezijde van de lijn,
      bedoeld in [artikel 1, eerste lid, van de Wet grenzen Nederlandse territoriale zee][ref2].

      2 In het winningsplan, bedoeld in het eerste lid, wordt per onderdeel toegelicht welke overwegingen bij de gemaakte
      keuze van belang zijn geweest, voor zover relevant.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0003748#Artikel1
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '34'
      - id: ref2
        bwb_id: BWBR0003748
        artikel: '1'
  - number: '25'
    text: |-
      1 Het winningsplan, bedoeld in [artikel 34, eerste lid, van de wet][ref1], voor de winning van zout bevat:

      a. een beschrijving van de structuur van de zoutlaag waaruit gewonnen wordt en de ligging van de zoutlaag ten
      opzichte van andere aardlagen, met bijbehorende geologische, geofysische en rheomorfologische studies en de daarbij
      gehanteerde onzekerheidsanalyses;

      b. een opgaaf van de verwachte hoeveelheid te winnen pekel en zout en de samenstelling van het te winnen zout;

      c. een beschrijving van de ligging en de vorm van de holruimte tijdens en na de winning;

      d. een opgaaf van de gesteentemechanische berekeningen van de stabiliteit van de holruimte tijdens en na de
      winning;

      e. een opgaaf van de hoeveelheden stoffen die jaarlijks bij de winning worden geïnjecteerd, en

      f. een beschrijving van de wijze waarop de holruimte na beëindiging van de winning buiten gebruik wordt gesteld.

      2 [Artikel 24, eerste lid, onderdelen c tot en met g, en l tot en met s][ref2], en [artikel 24, tweede lid][ref3],
      zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0014394#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0014394#Artikel24
