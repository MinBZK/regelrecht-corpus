  - number: 29a
    text: |-
      In deze paragraaf wordt verstaan onder:

        - *lekkage:* het weglekken van CO uit het CO-opslagvoorkomen;
        - *significant risico:* een combinatie van een waarschijnlijkheid van het zich voordoen van schade en een omvang
      van schade die niet kan worden genegeerd;
        - *significante onregelmatigheid:* een onregelmatigheid bij de injectie- of opslagwerkzaamheden of in de toestand
      van het CO-opslagcomplex zelf die het risico van lekkage doet ontstaan of een risico voor het milieu of de
      volksgezondheid oplevert;
        - *richtlijn nr. 2009/31/EG:* richtlijn nr. 2009/31/EG van het Europees Parlement en de Raad van 23 april 2009
      betreffende de geologische opslag van kooldioxide en tot wijziging van richtlijn 85/337/EEG van de Raad, de
      richtlijnen 2000/60/EG, 2001/80/EG, 2004/35/EG, 2006/12/EG en 2008/1/EG en verordening (EG) nr. 1013/2006 (PbEG L
      140) van het Europese Parlement en de Raad.
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel29a
  - number: 29b
    text: |-
      Bij ministeriële regeling kunnen voor een vergunning voor permanent opslaan van CO regels worden gesteld omtrent:

      a. het tijdvak van injectie van CO en het gebied;

      b. de ligging en begrenzing van het opslagvoorkomen en het gebied van het opslagcomplex;

      c. gegevens met betrekking tot de hydraulische eenheid;

      d. voorschriften voor het opslagproces;

      e. de totale hoeveelheid CO die overeenkomstig de vergunning ten hoogste kan worden opgeslagen;

      f. de grenswaarden van de druk van de opgeslagen CO;

      g. de maximum toelaatbare snelheid en druk bij injectie van CO en de maximaal toelaatbare druk van het opgeslagen
      CO.
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel29b
  - number: 29c
    text: |-
      1 Onze Minister verbindt aan de vergunning voor permanent opslaan van CO het voorschrift risicobeheer als bedoeld
      in [artikel 31d, eerste lid, onderdeel h, van de wet][ref1], op te nemen in een risicobeheerplan.

      2 Het risicobeheerplan bevat ten minste een beschrijving van maatregelen te nemen om het risico van een
      significante onregelmatigheid en de mogelijke gevolgen daarvan zoveel mogelijk te beperken en voldoet aan Bijlage
      I, fase 3.3. van de richtlijn nr. 2009/31/EG.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel31d
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel29c
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: 31d
  - number: 29d
    text: |-
      1 Onze Minister verbindt aan de vergunning voor permanent opslaan van CO het voorschrift corrigerende maatregelen
      als bedoeld in [artikel 31d, eerste lid, onderdeel k, van de wet][ref1] uit te voeren volgens een plan.

      2 Het plan bevat ten minste een beschrijving van maatregelen om tijdens de injectie van CO en gedurende de verdere
      opslag significante onregelmatigheden te corrigeren of lekken te dichten teneinde lekkage te voorkomen of te doen
      ophouden.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel31d
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel29d
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: 31d
  - number: 29e
    text: |-
      1 De uitvoerder neemt onmiddellijk passende maatregelen op basis van het plan, bedoeld in [artikel 29d][ref1],
      zodra zich een lekkage of significante onregelmatigheid voordoet.

      2 Zodra zich een significante onregelmatigheid of lekkage voordoet, meldt de uitvoerder dit onmiddellijk bij de
      inspecteur-generaal der mijnen en verstrekt hem zo spoedig mogelijk gegevens over:

      a. de oorzaken van de significante onregelmatigheid of lekkage;

      b. de aard en de ernst van de gevolgen van de significante onregelmatigheid of lekkage;

      c. de maatregelen die zijn genomen of worden overwogen om de significante onregelmatigheid of lekkage te voorkomen,
      te beperken of ongedaan te maken;

      d. de maatregelen die worden overwogen om te voorkomen dat een significante onregelmatigheid of een lekkage zich
      nogmaals kan voordoen.

      3 In geval van een lekkage of significante onregelmatigheid die een lekkagerisico inhoudt, stelt de uitvoerder de
      Nederlandse emissieautoriteit daarvan onmiddellijk op de hoogte.


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel29d
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel29e
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: 29d
        hoofdstuk: '3'
        paragraaf: '3.5'
  - number: 29f
    text: |-
      1 Onze Minister verbindt aan de vergunning voor permanent opslaan van CO het voorschrift monitoring als bedoeld in
      [artikel 31d, eerste lid, onderdeel i, van de wet][ref1] uit te voeren volgens het monitoringsplan.

      2 Het monitoringsplan omvat de wijze van de monitoring van:

      a. de injectiefaciliteiten,

      b. het opslagcomplex en

      c. het milieu in de directe nabijheid van het opslagcomplex, en is in overeenstemming met Bijlage II, onderdeel
      1.1., van de richtlijn nr. 2009/31/EG.

      3 Het monitoringsplan heeft betrekking op de periode die aanvangt op het tijdstip van inwerkingtreding van
      een vergunning voor het permanent opslaan van CO en eindigt op het tijdstip waarop de vergunning op grond van
      [artikel 31j van de wet][ref2] wordt ingetrokken.

      4 De keuze van de monitoringstechnologie in het monitoringsplan wordt gebaseerd op de beste praktijken die bij het
      opstellen van de ontwerp-vergunning beschikbaar zijn.

      5 Voorts wordt aan de vergunning het voorschrift verbonden het monitoringsplan drie maanden voor aanvang
      van de injectie van CO te actualiseren en om de vijf jaar te actualiseren op basis van wijzigingen in het
      beoordeelde lekkagerisico, wijzigingen in de beoordeelde risico’s voor het milieu en de volksgezondheid, nieuwe
      wetenschappelijk kennis en verbeteringen inzake de beste beschikbare techniek. Het geactualiseerde monitoringsplan
      wordt ter goedkeuring voorgelegd aan Onze Minister. De monitoring wordt uitgevoerd volgens het goedgekeurde
      monitoringsplan.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel31d
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel31j
