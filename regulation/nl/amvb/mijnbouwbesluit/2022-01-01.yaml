  - number: '121'
    text: |-
      1 Het vermogen van het fonds bedraagt per 1 januari van elk kalenderjaar ten minste € 250 000.

      2 De sectoren, genoemd in onderstaande tabel, dragen overeenkomstig de in die tabel genoemde bedragen bij aan de
      vorming van het initiële vermogen van het fonds.








                    *Sector*


                    *Aandeel*






                    Olie- en gaswinning


                    € 125 000




                    Zoutwinning


                    €  75 000




                    Opslag van stoffen


                    €  50 000




                    Verkenningsonderzoek


                    €    0






      3 Indien op 1 januari van enig kalenderjaar het vermogen waarover het fonds beschikt minder bedraagt dan het
      vermogen waarover het fonds op grond van het eerste lid dient te beschikken, wordt het tekort, voor zover niet
      veroorzaakt door de op een mijnbouwondernemer verhaalbare voorschotten, door de in het tweede lid genoemde sectoren
      aangevuld. Het aandeel van iedere sector wordt bepaald naar evenredigheid van de schadevergoedingen die in het
      voorafgaande kalenderjaar ten laste van het fonds zijn betaald in verband met de mijnbouwactiviteiten van de tot
      die sectoren behorende mijnbouwondernemers.

      4 Indien in een sector geen mijnbouwondernemers meer zijn die een bijdrage kan worden opgelegd, wordt het aandeel
      van die sector in het vermogen van het fonds gelijkelijk verdeeld over de andere sectoren.
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel121
  - number: '122'
    text: |-
      1 De bijdrage die een mijnbouwondernemer, behorende tot een van de eerste drie in [artikel 121, tweede lid][ref1],
      genoemde sectoren, verschuldigd is, omvat een bedrag ter grootte van de voorschotten die in het voorafgaande
      kalenderjaar ten laste van het fonds in verband met zijn mijnbouwactiviteiten zijn betaald.

      2 Het bedrag, bedoeld in het eerste lid, wordt verhoogd met een bedrag ter dekking van het aandeel van de sector in
      het tekort, berekend overeenkomstig [artikel 121, derde lid][ref2]. De mijnbouwondernemers die tot dezelfde sector
      behoren, doen Onze Minister voor 1 maart gezamenlijk een gemotiveerd voorstel toekomen omtrent het in de eerste
      volzin als laatste genoemde bedrag. Hierbij wordt rekening gehouden met:

      a. de aard en omvang van de mijnbouwactiviteiten van elke mijnbouwondernemer in de vijf voorafgaande kalenderjaren;

      b. de uitkeringen die in de vijf voorafgaande kalenderjaren ten laste van het fonds in verband met de
      mijnbouwactiviteiten van elke mijnbouwondernemer zijn gedaan.

      3 Onze Minister stelt voor 1 april de bijdrage voor elke mijnbouwondernemer vast, met inachtneming van het
      voorstel, bedoeld in het tweede lid, tenzij dat voorstel naar zijn oordeel niet voldoet aan de derde volzin van dat
      lid, dan wel het algemeen belang zich tegen dit voorstel verzet. Indien Onze Minister afwijkt van het voorstel, is
      de derde volzin van het tweede lid van overeenkomstige toepassing.

      4 Indien de mijnbouwondernemers die tot dezelfde sector behoren niet voor 1 maart een voorstel overleggen, stelt
      Onze Minister voor 1 april de bijdrage ambtshalve vast. Het eerste lid en de eerste en de derde volzin van het
      tweede lid zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel121
      [ref2]: https://wetten.overheid.nl/BWBR0014394#Artikel121
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel122
