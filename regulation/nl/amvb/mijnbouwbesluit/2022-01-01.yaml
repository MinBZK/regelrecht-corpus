  - number: '11'
    text: Deze paragraaf is van toepassing op een verkenningsonderzoek in oppervlaktewater.
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel11
  - number: '12'
    text: |-
      1 Bij het verrichten van een verkenningsonderzoek worden maatregelen genomen ter voorkoming van storende
      geluidseffecten op zeezoogdieren.

      2 Bij ministeriële regeling worden regels gesteld omtrent de in het eerste lid bedoelde maatregelen.
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel12
  - number: '13'
    text: |-
      De onderzoeker informeert het Kustwachtcentrum dagelijks over de voortgang van een verkenningsonderzoek in het
      gebied waarin het onderzoek wordt verricht, voor zover dat gebied is gelegen binnen de territoriale zee of het
      continentaal plat, onder vermelding van in ieder geval op welk tijdstip van de dag het onderzoek zal aanvangen en
      waarop het onderzoek zal worden gestaakt.
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel13
  - number: '14'
    text: |-
      Het is verboden zonder toestemming van een door Onze Minister van Infrastructuur en Milieu aan te wijzen bevoegde
      autoriteit verkenningsonderzoek te verrichten, indien het zicht vanaf het verkenningsvaartuig minder is dan de
      lengte van de bij het onderzoek te gebruiken of gebruikte kabels.
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel14
  - number: '15'
    text: |-
      1 Het is verboden verkenningsonderzoek te verrichten met gebruikmaking van kabels met een lengte van meer dan 1500
      meter en met kabels die in de breedte meer dan 150 meter van elkaar verwijderd zijn.

      2 Het verbod geldt niet indien het verkenningsvaartuig wordt begeleid door een ander vaartuig dat tot taak heeft de
      overige scheepvaart in en om het onderzoeksgebied op veilige afstand te houden en daartoe is uitgerust met radar-,
      navigatie- en telecommunicatieapparatuur en voldoende pyrotechnische middelen.

      3 Bij ministeriële regeling kunnen, in overeenstemming met Onze Minister van Infrastructuur en Milieu, nadere
      regels worden gesteld omtrent de in het tweede lid bedoelde uitrusting.
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel15
  - number: '16'
    text: |-
      1 Het is verboden verkenningsonderzoek te verrichten in of boven de delen van de territoriale zee en het
      continentaal plat die matig worden bevaren en bij ministeriële regeling zijn aangegeven.

      2 Het verbod geldt niet indien:

      a. zich aan boord van het verkenningsvaartuig een persoon bevindt die contact houdt met de overige scheepvaart in
      en om het onderzoeksgebied in het belang van de veiligheid van de scheepvaart, en

      b. het vaartuig waarop de in onderdeel a bedoelde persoon zich bevindt, is uitgerust met radar-, navigatie- en
      telecommunicatieapparatuur, bestemd voor de begeleiding van en de communicatie met de overige scheepvaart in en om
      het onderzoeksgebied.

      3 Bij ministeriële regeling kunnen, in overeenstemming met Onze Minister van Infrastructuur en Milieu, regels
      worden gesteld omtrent de vereiste bekwaamheid en ervaring van de in het tweede lid, onderdeel a, bedoelde persoon,
      alsmede nadere regels omtrent de in het tweede lid, onderdeel b, bedoelde uitrusting.
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel16
  - number: '17'
    text: |-
      1 Het is verboden verkenningsonderzoek te verrichten in of boven de delen van de territoriale zee en het
      continentaal plat die druk worden bevaren en bij ministeriële regeling zijn aangegeven.

      2 Het verbod geldt niet indien:

      a. is voldaan aan de bij of krachtens [artikel 16, tweede en derde lid][ref1], gestelde regels;

      b. het verkenningsvaartuig wordt begeleid door ten minste twee vaartuigen die tot taak hebben de persoon, bedoeld
      in [artikel 16, tweede lid, onderdeel a][ref2], bij te staan bij de begeleiding of het op afstand houden van
      de overige scheepvaart en daartoe zijn uitgerust met radar-, navigatie- en telecommunicatieapparatuur alsmede
      voldoende pyrotechnische middelen.

      3 Op de in het tweede lid, onderdeel b, bedoelde uitrusting is [artikel 15, derde lid][ref3], van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0014394#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0014394#Artikel15
