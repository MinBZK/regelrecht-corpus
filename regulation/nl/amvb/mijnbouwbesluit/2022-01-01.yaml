  - number: '67'
    text: |-
      1 Bij het aanleggen, uitbreiden, wijzigen, gebruiken, testen, repareren en buiten gebruik stellen van een boorgat
      alsmede het stimuleren van een voorkomen via een boorgat worden maatregelen genomen ter voorkoming van schade.

      2 Het aanleggen, uitbreiden, wijzigen, testen, repareren en buiten gebruik stellen van een boorgat alsmede het
      stimuleren van een voorkomen via een boorgat geschiedt onder verantwoordelijkheid en in aanwezigheid van de
      uitvoerder. Het gebruiken van een boorgat geschiedt onder verantwoordelijkheid van de uitvoerder.
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel67
  - number: '68'
    text: |-
      De activiteiten, bedoeld in [artikel 67, eerste lid][ref1], worden slechts verricht indien de desbetreffende
      stoffen uit de ondergrondse formaties onder controle worden gehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel67
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: '67'
        hoofdstuk: '5'
        paragraaf: 5.3.1
        afdeling: '5.3'
  - number: '69'
    text: |-
      1 Een boorgat wordt voorzien van een geschikte verbuizing.

      2 Elke serie van de in het eerste lid bedoelde verbuizing wordt over voldoende afstand gecementeerd en daarna op
      deugdelijkheid getest.

      3 De eerste serie van de verbuizing wordt onmiddellijk nadat deze is gecementeerd deugdelijk afgesloten.
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel69
  - number: '70'
    text: |-
      De uitvoerder draagt tijdens de werkzaamheden ten behoeve van het aanleggen, repareren en buiten gebruik stellen
      van een boorgat er zorg voor dat:

      a. een boorgat ter afsluiting wordt voorzien van beveiligingen;

      b. de deugdelijkheid van de beveiligingen periodiek wordt getest, en

      c. bij het boorgat betrokken personen periodiek deelnemen aan oefeningen in het gebruik van beveiligingen.
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel70
  - number: '71'
    text: |-
      Een boorgat wordt niet eerder voor winning van delfstoffen of opslag van stoffen in gebruik genomen dan nadat het
      daartoe deugdelijk is ingericht en afgewerkt, alsmede ter afsluiting van deugdelijke beveiligingen is voorzien.
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel71
  - number: '72'
    text: |-
      1 Een boorgat wordt niet eerder buiten werking gesteld dan nadat:

      a. voldoende maatregelen zijn genomen ter voorkoming van schade, en

      b. de delfstofhoudende lagen en de delfstofafzettingen, voor zover daaraan door water schade kan worden
      toegebracht, waterdicht zijn afgesloten.

      2 Het eerste lid is niet van toepassing op het buiten gebruik stellen van een boorgat dat is gebruikt voor het
      permanent opslaan van CO.
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel72
  - number: 72a
    text: |-
      Het buiten gebruik stellen van een boorgat heeft tot doel om het boorgat permanent af te sluiten door zones met
      stromingspotentieel te isoleren.
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel72a
  - number: '73'
    text: |-
      Bij ministeriële regeling worden regels gesteld over:

      a. beveiligingen en oefeningen in het gebruik van beveiligingen, bedoeld in [artikel 70][ref1];

      b. de inrichting van een boorgat en de beveiliging ervan, bedoeld in [artikel 71][ref2];

      c. het buiten gebruik stellen van een boorgat als bedoeld in [artikel 72a][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel70
      [ref2]: https://wetten.overheid.nl/BWBR0014394#Artikel71
      [ref3]: https://wetten.overheid.nl/BWBR0014394#Artikel72a
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: '70'
        hoofdstuk: '5'
        paragraaf: 5.3.1
        afdeling: '5.3'
      - id: ref2
        bwb_id: BWBR0014394
        artikel: '71'
        hoofdstuk: '5'
        paragraaf: 5.3.1
        afdeling: '5.3'
      - id: ref3
        bwb_id: BWBR0014394
        artikel: 72a
        hoofdstuk: '5'
        paragraaf: 5.3.1
        afdeling: '5.3'
  - number: 73a
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over het buiten werking stellen van een boorgat, bedoeld
      in [artikel 72][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel72
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel73a
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: '72'
        hoofdstuk: '5'
        paragraaf: 5.3.1
        afdeling: '5.3'
  - number: '74'
    text: |-
      1 Het aanleggen, uitbreiden, wijzigen, onderhouden, repareren en buiten gebruik stellen van een boorgat alsmede
      het stimuleren van een voorkomen via een boorgat geschiedt overeenkomstig een door de uitvoerder opgesteld
      werkprogramma.

      2 De uitvoerder informeert de inspecteur-generaal der mijnen ten minste zeven dagen voor het tijdstip waarop met
      onderhoudswerkzaamheden van een boorgat wordt aangevangen.

      3 Het eerste lid is niet van toepassing op het buiten gebruik stellen van een boorgat dat is gebruikt voor het
      permanent opslaan van CO.
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel74
  - number: '75'
    text: |-
      1 Bij het aanleggen van een boorgat is een boorregister op het desbetreffende mijnbouwwerk aanwezig.

      2 Het boorregister wordt voortdurend bijgewerkt.

      3 De uitvoerder bewaart het boorregister gedurende ten minste vijf jaar nadat het mijnbouwwerk buiten gebruik is
      gesteld.
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel75
  - number: '76'
    text: |-
      1 De uitvoerder maakt dagelijks een rapport op van het aanleggen, uitbreiden, wijzigen, repareren of buiten gebruik
      stellen van een boorgat alsmede het stimuleren van een voorkomen via een boorgat en brengt het rapport onmiddellijk
      ter kennis van de inspecteur-generaal der mijnen.

      2 De uitvoerder brengt binnen vier weken na het voltooien van de in het eerste lid bedoelde activiteiten een
      desbetreffend eindrapport ter kennis van de inspecteur-generaal der mijnen.
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel76
  - number: '77'
    text: |-
      Bij ministeriële regeling worden regels dan wel nadere regels gesteld omtrent:

      a. de inhoud van het in [artikel 74][ref1] bedoelde werkprogramma, voor zover het betreft het aanleggen,
      uitbreiden, wijzigen, repareren of buiten gebruik stellen van een boorgat alsmede het stimuleren van een voorkomen
      via een boorgat, en het tijdstip waarop het werkprogramma aan de inspecteur-generaal der mijnen wordt gezonden
      alsmede de gegevens en bescheiden die daarbij worden overgelegd;

      b. de inhoud van de in [artikel 76][ref2] bedoelde rapporten en de wijze waarop deze rapporten ter kennis van de
      inspecteur-generaal der mijnen worden gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel74
      [ref2]: https://wetten.overheid.nl/BWBR0014394#Artikel76
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel77
