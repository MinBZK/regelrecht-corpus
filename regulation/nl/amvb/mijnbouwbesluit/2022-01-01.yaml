  - number: '123'
    text: |-
      Het [tweede, derde en vierde lid van artikel 122][ref1] zijn van overeenkomstige toepassing op de verdeling
      van het aandeel van een sector in de eenmalige vorming van het initiële vermogen van het fonds, bedoeld in
      [artikel 121, tweede lid][ref2], over de mijnbouwondernemers die tot die sector behoren, met dien verstande dat
      voor onderdeel b van het tweede lid wordt gelezen de hoogte van de schadevergoedingen die elke mijnbouwondernemer
      in de vijf kalenderjaren voorafgaande aan de inwerkingtreding van de wet aan natuurlijke personen heeft betaald in
      verband met zijn mijnbouwactiviteiten.


