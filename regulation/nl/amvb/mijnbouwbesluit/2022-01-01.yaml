      1 Gedurende vier maanden na het tijdstip van inwerkingtreding van dit besluit kan een mijnbouwwerk als bedoeld
      in [artikel 34][ref1] zonder een sluitingsplan als bedoeld in [artikel 39][ref2] geheel of gedeeltelijk
      buiten gebruik worden gesteld, met dien verstande dat gedurende die periode de [artikelen 136][ref3] en
      [138 tot en met 143 van het Mijnreglement 1964][ref4] van toepassing blijven op het geheel of gedeeltelijk buiten
      gebruik stellen van het mijnbouwwerk.

      2 Gedurende vier maanden na het tijdstip van inwerkingtreding van dit besluit kan een mijnbouwinstallatie
      zonder een verwijderingsplan als bedoeld in [artikel 60][ref5] buiten gebruik worden gesteld en verwijderd, met
      dien verstande dat gedurende die periode de [artikelen 137a][ref6] en [137b van het Mijnreglement 1964][ref7]
      respectievelijk de [artikelen 68 tot en met 70 van het Mijnreglement continentaal plat][ref8] van toepassing
      blijven op het buiten gebruik stellen en verwijderen van de mijnbouwinstallatie.


