  - number: '62'
    text: |-
      1 De aanvraag tot instemming met een verwijderingsplan als bedoeld in [artikel 44a, eerste lid, van de wet][ref1]
      bevat ten minste een beschrijving van:

      a. de aanduiding, locatie, aard en functie van de mijnbouwinstallatie, waaronder apparatuur van derden, ten tijde
      van de aanvraag om instemming met het verwijderingsplan;

      b. de activiteiten, bedoeld in [artikel 74, eerste lid][ref2], die hebben geleid tot wijziging van de inrichting
      van het boorgat;

      c. de afspraken met de eigenaar van de waterbodem en andere belanghebbenden;

      d. de methode en een schatting van de kosten van het buiten gebruik stellen van een boorgat en het verwijderen van
      de mijnbouwinstallatie;

      e. de staat waarin het ondergrondse deel van het mijnbouwwerk wordt achtergelaten;

      f. de datum van indiening van het werkprogramma voor het buiten gebruik stellen van een boorgat en de planning van
      de uitvoering;

      g. het schoon en veilig achterlaten of verwijderen van kabels en pijpleidingen;

      h. de wijze waarop de materialen die bij het mijnbouwwerk behoren, worden afgevoerd en de bestemming ervan;

      i. de op de mijnbouwinstallatie aanwezige afvalstoffen als bedoeld in
      [artikel 1.1, eerste lid, van de Wet milieubeheer en de bestemming][ref3] ervan;

      j. de maatregelen die worden genomen ter voorkoming van waterverontreiniging;

      k. de maatregelen die worden genomen om de waterbodem waarop de mijnbouwinstallatie is opgericht zoveel mogelijk
      in de oorspronkelijke staat terug te brengen of in het geval de waterbodem niet in de oorspronkelijke staat wordt
      teruggebracht, de toestand waarin de waterbodem na uitvoering van het verwijderingsplan wordt achtergelaten;

      l. het beoogde gebruik van de waterbodem; en

      m. in geval van een gedeeltelijke verwijdering van het mijnbouwwerk voor welk doel het mijnbouwwerk wordt
      hergebruikt en een beschrijving daarvan.

      2 Het verwijderingsplan vermeldt binnen welke perioden de beschreven werkzaamheden beginnen en eindigen en kan in
      een fasering van de verwijdering voorzien.

      3 In afwijking van het eerste lid, aanhef, kan bij het overleggen van informatie als bedoeld in het eerste lid,
      onderdelen a tot en met k, worden volstaan met een verwijzing naar informatie die is of wordt overgelegd bij een
      aanvraag om een vergunning, een melding of de naleving van een verplichting tot het overleggen van gegevens en
      bescheiden krachtens de wet, de Waterwet, de Wet algemene bepalingen omgevingsrecht, de [Wet milieubeheer][ref4],
      respectievelijk de [Wet bodembescherming][ref5], in het geval die informatie de relevante feiten bevat of zal
      bevatten die nodig zijn voor een besluit tot instemming met het verwijderingsplan, respectievelijk een besluit tot
      instemming met het verwijderingsplan onder het stellen van voorwaarden of voorschriften.

      4 Onze Minister beslist binnen dertien weken na het overleggen van een verwijderingsplan over de instemming.

      5 Van de instemming, bedoeld in het eerste lid, wordt door Onze Minister mededeling gedaan in de Staatscourant.

      6 Met toepassing van [artikel 28, eerste lid, laatste zinsnede, van de Dienstenwet][ref6] is
      [paragraaf 4.1.3.3. van de Algemene wet bestuursrecht][ref7] niet van toepassing op de instemming met een
      verwijderingsplan.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel44a
