      1 Vergunningen als bedoeld in de [artikelen 1][ref1] en [28, tweede lid, van het Groevenreglement 1947][ref2] voor
      ontginning van kalksteen gelden als vergunningen als bedoeld in [artikel 146][ref3].

      2 Vergunningen als bedoeld in de [artikelen 1][ref4] en [28, tweede lid, van het Groevenreglement 1947][ref5] voor
      andere doeleinden dan ontginning van kalksteen gelden als vergunningen als bedoeld in [artikel 151][ref6], met
      dien verstande dat op het tijdstip van inwerkingtreding van dit besluit de voorschriften of beperkingen verbonden
      aan deze vergunningen vervallen voor zover deze geen betrekking hebben op de gesteentemechanische veiligheid van
      de groeve.

      3 Gedeputeerde staten kunnen aan de vergunningen, bedoeld in het eerste en tweede lid, beperkingen en voorschriften
      verbinden als bedoeld in [artikel 147][ref7] respectievelijk [152][ref8].


