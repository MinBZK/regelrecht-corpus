  - number: '61'
    text: |-
      1 Bij de melding, bedoeld in [artikel 44, eerste lid, van de wet][ref1] vermeldt de houder van een vergunning als
      bedoeld in de [artikelen 6][ref2] en [25 van de wet][ref3] in ieder geval:

      a. de locatie van de mijnbouwinstallatie;

      b. de datum waarop het mijnbouwwerk buiten werking is gesteld;

      c. de wijze waarop het mijnbouwwerk buiten werking is gesteld;

      d. op welke wijze derden waarvan apparatuur als bedoeld in [artikel 52, derde lid][ref4], op de mijnbouwinstallatie
      aanwezig is, zijn geïnformeerd.

      2 Van de melding, bedoeld in het eerste lid, wordt door Onze Minister openbaar kennis gegeven in de Staatscourant.


