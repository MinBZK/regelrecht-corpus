  - number: 29i
    text: |-
      1 Het is verboden bij het permanent opslaan van CO en het transporteren van CO door een transportnetwerk als
      bedoeld in [artikel 32, eerste lid, van de wet ][ref1]naast CO andere stoffen op te slaan en te transporteren dan:

      a. incidentele aanverwante stoffen, afkomstig uit de CO-bron of het afvang- of injectieproces,

      b. stoffen die nodig zijn voor transport of opslag in het opslagvoorkomen of

      c. spoorelementen die aan het CO zijn toegevoegd als hulpmiddel bij het monitoren en het controleren van de
      beweging van CO binnen het CO-opslagcomplex.

      2 De concentratie van de stoffen, bedoeld in het eerste lid, onderdelen a tot en met c, mag geen niveaus
      overschrijden die de integriteit van het opslagvoorkomen of het relevante transportnetwerk in het gedrang brengen
      of een significant risico voor het milieu of de volksgezondheid vormen.

      3 Het CO en de stoffen, bedoeld in het eerste lid, onderdelen a tot en met c, worden niet eerder opgeslagen dan
      nadat de uitvoerder heeft vastgesteld dat deze voldoen aan het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel32
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel29i
