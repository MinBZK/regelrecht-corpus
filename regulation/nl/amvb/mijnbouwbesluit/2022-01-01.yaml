    text: |-
      1 De gegevens, bedoeld in de [artikelen 111][ref1], [112][ref2] en [113, eerste lid, onderdelen a en b][ref3], zijn
      openbaar, zodra vier weken zijn verstreken na het tijdstip waarop de gegevens zijn verstrekt.

      2 Op de gegevens en de monsters, bedoeld in de [artikelen 108 tot en met 110][ref4], is
      [artikel 10, eerste lid, onderdeel c, van de Wet openbaarheid van bestuur][ref5] van toepassing, totdat vijf jaren
      zijn verstreken na het tijdstip waarop de gegevens zijn verstrekt.

      3 In afwijking van het tweede lid is [artikel 10, eerste lid, onder c, van de Wet openbaarheid van bestuur][ref6]
      van toepassing op de gegevens, bedoeld in [artikel 108, eerste lid, onderdeel a][ref7], totdat een termijn van tien
      jaren is verstreken, indien:

      a. het verkenningsonderzoek niet is uitgevoerd door of in opdracht van een uitvoerder die voor het desbetreffende
      gebied over een vergunning beschikt om delfstoffen op te sporen, te winnen of op te slaan en

      b. de resultaten gedurende de termijn van tien jaren, bedoeld in de aanhef, tegen een redelijke vergoeding voor
      eenieder ter beschikking worden gesteld.

      4 Op de gegevens, bedoeld in [artikel 113, eerste lid, onderdelen c tot en met j][ref8], is
      [artikel 10, eerste lid, onderdeel c, van de Wet openbaarheid van bestuur][ref9] van toepassing, totdat tien jaren
      zijn verstreken na het tijdstip waarop de gegevens zijn verstrekt.


