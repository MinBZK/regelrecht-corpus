    text: |-
      In dit hoofdstuk wordt verstaan onder:

      a. bijdrage: bijdrage als bedoeld in [artikel 135, vierde lid, onderdeel a, van de wet][ref1];

      b. fonds: Waarborgfonds mijnbouwschade als bedoeld in [artikel 135, eerste lid, van de wet][ref2];

      c. mijnbouwactiviteiten: activiteiten als bedoeld in [artikel 113, onderdeel b, van de wet][ref3];

      d. mijnbouwondernemer: persoon als bedoeld in [artikel 113, onderdeel c, van de wet][ref4] of diens rechtsopvolger;

      e. schadevergoeding: schadevergoeding als bedoeld in [artikel 137 van de wet][ref5];

      f. verkenningsonderzoek: onderzoek als bedoeld in [artikel 1, onderdeel d, van de wet][ref6], met uitzondering
      van onderzoek door of in opdracht van een mijnbouwondernemer die behoort tot een van de eerste drie in
      [artikel 121, tweede lid][ref7], drie genoemde sectoren;

      g. voorschot: voorschot als bedoeld in [artikel 140 van de wet][ref8].


