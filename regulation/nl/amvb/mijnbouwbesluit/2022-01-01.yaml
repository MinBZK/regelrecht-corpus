  - number: '155'
    text: Het is verboden in een groeve ontplofbare stoffen voorhanden te hebben of te gebruiken.
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel155
  - number: '156'
    text: |-
      1 Een groeve is zo ingericht en van beveiligingen voorzien dat gevaar voor instorting zoveel mogelijk is
      uitgesloten.

      2 Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent de inrichting en beveiligingen.
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel156
  - number: '157'
    text: |-
      1 De houder van een vergunning als bedoeld in de [artikelen 146][ref1] en [151][ref2] neemt bij het winnen
      van kalksteen respectievelijk het gebruik voor een ander doeleinde alle nodige maatregelen ter voorkoming van
      instorting van een groeve, alsmede ter beperking van de gevolgen van een instorting.

      2 Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent de in het eerste lid bedoelde maatregelen.


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel146
      [ref2]: https://wetten.overheid.nl/BWBR0014394#Artikel151
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel157
