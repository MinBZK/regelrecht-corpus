  - number: '78'
    text: Deze paragraaf is van toepassing op mijnbouwinstallaties.
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel78
  - number: '79'
    text: |-
      In deze paragraaf en de daarop berustende bepalingen wordt verstaan onder:

      a. lozen: het al dan niet opzettelijk in oppervlaktewater doen terecht- of vrijkomen van stoffen, zoals door
      storten, pompen, doen wegvloeien of doen ontsnappen;

      b. stoffen: chemische elementen en hun verbindingen, zoals deze voorkomen in de natuur of door toedoen van de mens
      worden voortgebracht;

      c. preparaten: mengsels of oplossingen van stoffen;

      d. olie: minerale olie in elke vorm;

      e. oliehoudend mengsel: mengsel, dat olie in welk gehalte dan ook bevat;

      f. sanitair afval:

      1°. spoelwater en ander afval, afkomstig van toiletten en wasruimtes;

      2°. spoelwater, afkomstig uit verblijven voor de voorlopige verzorging van gewonden en zieken;

      3°. ander afvalwater, indien vermengd met spoelwater als bedoeld onder 1° of 2°;

      g. vuilnis: etensresten, alle soorten huishoudelijke afvalstoffen en vast afval, voortvloeiende uit de
      bedrijfsvoering.
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel79
  - number: '80'
    text: |-
      1 Het is verboden olie, een oliehoudend mengsel, sanitair afval en vuilnis vanaf een mijnbouwinstallatie te lozen.

      2 Het eerste lid geldt niet ten aanzien van het lozen van:

      a. een oliehoudend mengsel in de gevallen en op de wijze als bepaald bij ministeriële regeling van Onze Minister,
      in overeenstemming met Onze Minister van Infrastructuur en Milieu;

      b. sanitair afval:

      1°. vanaf een mijnbouwinstallatie waarop niet meer dan tien personen aanwezig plegen te zijn;

      2°. vanaf een niet als een geheel verplaatsbare mijnbouwinstallatie, waarop meer dan 50 personen aanwezig plegen
      te zijn of een als een geheel verplaatsbare mijnbouwinstallatie, indien dit afval is afgebroken door middel van een
      biologisch zuiveringssysteem;

      3°. vanaf een andere mijnbouwinstallatie dan bedoeld onder 1° en 2°, indien dit afval is behandeld door middel van
      een mechanisch vermalingssysteem;

      c. vuilnis, voor zover bestaande uit etensresten, in de gevallen en op de wijze als door Onze Minister, in
      overeenstemming met Onze Minister van Infrastructuur en Milieu, aangegeven.

      3 Het eerste lid geldt evenmin, indien het lozen:

      a. noodzakelijk is om de veiligheid van de installatie te verzekeren dan wel om mensenlevens te redden;

      b. het gevolg is van schade aan de installatie of aan de uitrusting daarvan, indien na het ontstaan van de schade
      of na de ontdekking van de lozing alle redelijke maatregelen zijn getroffen om de verdere lozing te voorkomen of
      tot een minimum te beperken.

      4 Bij ministeriële regeling van Onze Minister worden, in overeenstemming met Onze Minister van Infrastructuur en
      Milieu, nadere regels gesteld met betrekking tot de in het tweede en derde lid bedoelde lozingen omtrent:

      a. het meten en registreren van toegestane lozingen van oliehoudende mengsels;

      b. de controle op het oliegehalte van de toegestane lozingen van oliehoudende mengsels.
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel80
  - number: '81'
    text: |-
      1 Op een mijnbouwinstallatie worden met betrekking tot het met het normale gebruik van de installatie samenhangende
      of daaruit voortvloeiende lozingen van andere dan in [artikel 80][ref1] genoemde stoffen of andere verontreinigende
      dan wel schadelijke stoffen zodanige maatregelen genomen dat verontreiniging van oppervlaktewater zoveel mogelijk
      wordt voorkomen.

      2 Het is verboden stoffen of preparaten te lozen als bedoeld in het derde lid, onderdeel a.

      3 Bij ministeriële regeling van Onze Minister worden, in overeenstemming met Onze Minister van Infrastructuur en
      Milieu, welke uitsluitend strekt ter uitvoering van een voor Nederland verbindend verdrag of een voor Nederland
      verbindend besluit van een volkenrechtelijke organisatie:

      a. de in het tweede lid bedoelde stoffen of preparaten aangewezen;

      b. regels gesteld die slechts kunnen inhouden:

      1°. voorschriften inzake de bewerking die stoffen of preparaten voor lozing moeten ondergaan, de te lozen
      hoeveelheden ervan, en de plaats en de wijze van lozing;

      2°. voorschriften omtrent het melden, meten en registreren van stoffen of preparaten die worden geloosd.


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel80
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: '80'
        hoofdstuk: '5'
        paragraaf: 5.4.1
        afdeling: '5.4'
  - number: '82'
    text: |-
      1 De uitvoerder neemt onmiddellijk passende maatregelen in geval van lozingen waardoor nadelige gevolgen voor
      het milieu zijn ontstaan of dreigen te ontstaan als bedoeld in de [artikelen 80][ref1] en [81][ref2]. De bedoelde
      passende maatregelen houden in het voorkomen, bestrijden of beperken van de bedoelde nadelige gevolgen.

      2 De uitvoerder meldt het voorval zo spoedig mogelijk aan het Kustwachtcentrum en de inspecteur-generaal der
      mijnen.

      3 De uitvoerder verstrekt de inspecteur-generaal der mijnen zo spoedig mogelijk gegevens, zodra deze bekend zijn,
      omtrent:

      a. de oorzaken van het voorval en de omstandigheden waaronder het voorval zich heeft voorgedaan;

      b. de ten gevolge van het voorval vrijgekomen stoffen, alsmede hun eigenschappen;

      c. andere gegevens die van belang zijn om de aard en de ernst van de gevolgen voor het milieu van het voorval te
      kunnen beoordelen;

      d. de maatregelen die zijn genomen of worden overwogen om de gevolgen van het voorval te voorkomen, te beperken of
      ongedaan te maken;

      e. de maatregelen die worden overwogen om te voorkomen dat een zodanig voorval zich nogmaals kan voordoen.

      4 Bij ministeriële regeling worden nadere regels gesteld omtrent de in het tweede lid bedoelde melding en de
      gegevens, bedoeld in het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel80
      [ref2]: https://wetten.overheid.nl/BWBR0014394#Artikel81
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: '80'
        hoofdstuk: '5'
        paragraaf: 5.4.1
        afdeling: '5.4'
      - id: ref2
        bwb_id: BWBR0014394
        artikel: '81'
        hoofdstuk: '5'
        paragraaf: 5.4.1
        afdeling: '5.4'
  - number: '83'
    text: |-
      1 Bij ministeriële regeling van Onze Minister worden, in overeenstemming met Onze Minister van Infrastructuur en
      Milieu, ter voorkoming van verontreiniging van oppervlaktewater regels gesteld omtrent het gebruik van bepaalde
      stoffen of preparaten op een mijnbouwinstallatie.

      2 Het is verboden stoffen of preparaten te gebruiken als bedoeld in het derde lid, onderdeel a.

      3 Bij ministeriële regeling van Onze Minister worden, in overeenstemming met de in het eerste lid genoemde
      minister, welke uitsluitend strekt ter uitvoering van een voor Nederland verbindend verdrag of een voor Nederland
      verbindend besluit van een volkenrechtelijke organisatie:

      a. de in het tweede lid bedoelde stoffen of preparaten aangewezen;

      b. regels gesteld die slechts kunnen inhouden:

      1°. voorschriften inzake de te gebruiken hoeveelheden stof of preparaten en de wijze van gebruik;

      2°. voorschriften omtrent het melden, meten en registreren van stoffen of preparaten die worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel83
  - number: '84'
    text: |-
      1 Het is verboden op een mijnbouwinstallatie aardgas af te blazen of af te fakkelen in de open lucht dan wel andere
      verontreinigende stoffen uit te stoten.

      2 Het eerste lid geldt niet indien het afblazen of affakkelen van aardgas dan wel de uitstoot van andere
      verontreinigende stoffen onvermijdelijk is voor een normale bedrijfsvoering in het mijnbouwwerk. In dat geval
      worden alle maatregelen getroffen om schade ten gevolge van het afblazen of affakkelen van aardgas dan wel de
      uitstoot van andere verontreinigende stoffen zoveel mogelijk te voorkomen dan wel te beperken.

      3 Bij ministeriële regeling kunnen regels worden gesteld omtrent de in het tweede lid bedoelde maatregelen.
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel84
  - number: 84a
    text: |-
      Deze paragraaf is van toepassing op mijnbouwwerken die gebruikt worden voor de opsporing of winning van
      koolwaterstoffen.
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel84a
  - number: 84b
    text: |-
      1 Een rapport inzake grote gevaren voor een productie-installatie bevat naast de documenten bedoeld in [artikel 45c
      van de wet](onbekend), de volgende gegevens:

      a. een veiligheids- en gezondheidsdocument, bedoeld in [artikel 2.42][ref1] en
      [2.42f van het Arbeidsomstandighedenbesluit][ref2];

      b. een intern rampenplan, bedoeld in [artikel 84d][ref3];

      c. overige informatie.

      2 Een exploitant van een productie-installatie raadpleegt een ondernemingsraad als bedoeld in
      [artikel 2 van de Wet op de ondernemingsraden][ref4] of een personeelsvertegenwoordiging als bedoeld in
      [artikel 35b van de Wet op de ondernemingsraden][ref5] bij het opstellen van het rapport inzake grote gevaren
      voor een productie-installatie. Bij het ontbreken van een ondernemingsraad of personeelsvertegenwoordiging, voert
      een exploitant van een productie-installatie overleg met de belanghebbende werknemers. Over het rapport wordt
      tevens overleg gevoerd met de werknemers van andere werkgevers, die op basis van een langlopende overeenkomst tot
      aanneming van werk mede in het bedrijf of de inrichting werkzaam zijn.

      3 De exploitant van een productie-installatie voldoet aan de maatregelen die zijn vastgesteld in het rapport inzake
      grote gevaren voor de betreffende installatie.

      4 Het rapport inzake grote gevaren is aanwezig op het mijnbouwwerk.

      5 Bij ministeriële regeling worden regels gesteld over de overige informatie, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2.42
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel2.42f
      [ref3]: https://wetten.overheid.nl/BWBR0014394#Artikel84d
      [ref4]: https://wetten.overheid.nl/BWBR0002747#Artikel2
      [ref5]: https://wetten.overheid.nl/BWBR0002747#Artikel35b
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel84b
