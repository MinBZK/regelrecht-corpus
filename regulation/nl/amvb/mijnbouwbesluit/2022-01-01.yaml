      2°. de overeenkomst met de grondeigenaar;

      3°. de relevante feiten voor een afweging van belangen als bedoeld in [artikel 103][ref4];

      b. bij een aanvraag om instemming met een verwijderingsplan in afwijking van [artikel 62, eerste lid, aanhef,][ref5]
