  - number: '27'
    text: |-
      In geval de opslag van stoffen van tijdelijke aard is, bevat het plan voor het opslaan van stoffen als bedoeld in
      [artikel 26][ref1], tevens:

      a. beschrijving van de wijze waarop de stoffen die zijn opgeslagen, worden teruggehaald en van de stoffen die
      daarbij gebruikt worden, en

      b. opgaaf van de samenstelling en hoeveelheden van de andere stoffen dan de opgeslagen stoffen die met het
      terughalen van de opgeslagen stoffen onvermijdelijk aan de bodem worden onttrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel26
