    text: |-
      1 Als mijnbouwwerk als bedoeld in [artikel 1, onderdeel n, van de wet][ref1] worden aangewezen:

      a. boorgaten, bestemd voor de opsporing en winning van delfstoffen of aardwarmte of voor de opslag van stoffen,
      voor zover deze geen onderdeel uitmaken van de werken, genoemd in de onderdelen b tot en met e, en niet geheel
      buiten gebruik zijn gesteld;

      b. werken voor het opsporen of winnen van delfstoffen of aardwarmte;

      c. werken voor het opslaan van stoffen en het terughalen van opgeslagen stoffen met uitzondering van:

      1°. water ten behoeve van het opslaan van warmte of koude op een diepte van ten hoogste van 500 meter;

      2°. water ten behoeve van openbare drinkwatervoorziening als bedoeld in de [Drinkwaterwet][ref2];

      3°. grondwater en brijn dat zonder toevoeging van stoffen wordt teruggevoerd in hetzelfde gebied waarin het is
      gewonnen naar een diepte van ten hoogste 500 meter;

      d. werken voor het bewerken van gewonnen delfstoffen of aardwarmte voor het punt van aflevering aan de afnemer;

      e. werken voor het bewerken van stoffen voorafgaande aan de opslag ervan dan wel voor het bewerken van opgeslagen
      en teruggehaalde stoffen voor het punt van aflevering aan de afnemer;

      f. werken voor het meten en registreren van in de onderdelen d en e genoemde stoffen of aardwarmte voor het punt
      van aflevering aan de afnemer;

      g. werken voor het bevorderen van het transport van in de onderdelen d en e genoemde stoffen of aardwarmte voor het
      punt van aflevering aan de afnemer;

      h. werken voor het verblijf van bij mijnbouwactiviteiten betrokken personen die verankerd zijn in of aanwezig zijn
      boven de bodem van oppervlaktewater.

      2 Indien boorgaten of werken als bedoeld in het eerste lid, onderdelen a tot en met h, fysiek met elkaar zijn
      verbonden, wordt het geheel als een mijnbouwwerk beschouwd.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0026338
