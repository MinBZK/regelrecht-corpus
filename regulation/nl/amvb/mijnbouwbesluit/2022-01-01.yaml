      1 In geval van zoutwinning en opslag van stoffen in een door zoutwinning ontstane holruimte bevat het meetplan,
      bedoeld in [artikel 30, eerste lid][ref1], tevens een beschrijving van:

      a. de tijdstippen waarop metingen in de holruimte worden uitgevoerd, en

      b. de methode die voor het uitvoeren van holruimtemetingen wordt gebruikt.

      2 De uitvoerder overlegt de resultaten van de metingen, alsmede op de metingen gebaseerde holruimtekaarten en
      holruimtedoorsneden uiterlijk twaalf weken na het verrichten van de metingen aan de inspecteur-generaal der mijnen.

      3 De holruimtekaarten en holruimtedoorsneden worden onverwijld bijgewerkt, zodra nieuwe gegevens beschikbaar komen.

      4 Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent de in het tweede lid bedoelde kaarten en
      doorsneden.


