  - number: 84d
    text: |-
      1 Een intern rampenplan bevat de volgende gegevens:

      a. een noodplan als bedoeld in [artikel 3.37v van het Arbeidsomstandighedenbesluit][ref1];

      b. een op grond van [artikel 2.42f van het Arbeidsomstandighedenbesluit][ref2], op te stellen
      brandbestrijdingsplan;

      c. een rampenbestrijdingsplan als bedoeld in [artikel 85][ref3];

      d. een analyse van de doeltreffendheid van de respons op olielekken.

      2 Bij het opstellen van het intern rampenplan als bedoeld in het eerste lid wordt rekening gehouden met de
      risicobeoordeling van zware ongevallen die tijdens het opstellen van het meest recente rapport inzake grote gevaren
      is uitgevoerd.

      3 Bij ministeriële regeling worden nadere regels gesteld over een intern rampenplan.

      4 Een exploitant van een productie-installatie of een eigenaar van een niet-productie-installatie stelt bij een
      zwaar ongeval het intern rampenplan onverwijld in werking.

      5 Een exploitant van een productie-installatie of een eigenaar van een niet-productie-installatie beschikt over de
      noodzakelijke apparatuur en deskundigheid ter uitvoering van het intern rampenplan.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel3.37
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel2.42f
      [ref3]: https://wetten.overheid.nl/BWBR0014394#Artikel85
