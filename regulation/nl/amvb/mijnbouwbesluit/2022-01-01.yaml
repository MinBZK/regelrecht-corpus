  - number: 62a
    text: |-
      1 Onze Minister kan aan de houder van een vergunning als bedoeld in de [artikelen 6][ref1] en [25 van de wet][ref2]
      een instemming met een verwijderingsplan, bedoeld in artikel [44a, eerste lid, van de wet][ref3] weigeren, indien:

      a. het verwijderingsplan onvoldoende voorziet in een beschrijving van de werkzaamheden, methode en kosten van de
      verwijdering die nodig zijn gedurende de periode van uitvoering van het verwijderingsplan, waaronder monitoring;

      b. het verwachte resultaat van de uitvoering van het verwijderingsplan onvoldoende is beschreven;

      c. het mijnbouwwerk in aanmerking komt voor hergebruik;

      d. het mijnbouwwerk niet in aanmerking komt voor een gedeeltelijk hergebruik als mijnbouwwerk;

      e. in het geval van hergebruik het bevoegde gezag, bedoeld in [artikel 44a, tweede lid, van de wet][ref4], niet
      heeft verklaard dat het bevoegde gezag daartegen, voor zover het hergebruik betreft, geen bedenkingen heeft;

      f. naar het oordeel van het bevoegd gezag krachtens de Waterwet, de Wet algemene bepalingen omgevingsrecht of de
      Wet bodembescherming het voorstel tot onderzoeken of saneren van de bodem niet voldoet;

      g. de bestemming van de af te voeren materialen en afvalstoffen onduidelijk is; of

      h. de planning van de uitvoering van de verwijdering niet duidelijk is of voorziet in een onredelijk lange termijn.

      2 Onze Minister kan een instemming ambtshalve geheel of gedeeltelijk wijzigen of intrekken, indien:

      a. het bevoegde gezag, bedoeld in het eerste lid, onderdelen e en f, krachtens wetten als bedoeld in die onderdelen
      tot een afwijzend oordeel komt over het geheel of gedeeltelijk hergebruik van het mijnbouwwerk;

      b. het bevoegde gezag krachtens de wet geen vergunning verstrekt voor het opsporen, winnen, of opslaan van
      delfstoffen, aardwarmte, respectievelijk stoffen;

      c. de houder van een vergunning de instemming voor het geheel of een gedeelte van het verwijderingsplan niet langer
      nodig heeft; of

      d. de houder van een vergunning niet overeenkomstig de instemming handelt of heeft gehandeld.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0014168#Artikel44a
      [ref4]: https://wetten.overheid.nl/BWBR0014168#Artikel44a
