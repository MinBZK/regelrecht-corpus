  - number: 161a
    text: |-
      1 De bedragen, verschuldigd op grond van [artikel 133, eerste lid, van de wet][ref1] zijn vaste bedragen.

      2 De bedragen, bedoeld in [artikel 133, eerste lid, onderdeel a, van de wet][ref2] worden in rekening gebracht voor
      het op aanvraag verlenen, wijzigen of intrekken van:

      a. een vergunning als bedoeld in [artikel 6, eerste lid, onderdelen a en b, van de wet][ref3];

      b. een instemming met een winningsplan, een verwijderingsplan, of een rapport dan wel een beoordeling van een
      melding als bedoeld in de [artikelen 34, derde lid][ref4], [44, eerste lid][ref5], [44a, eerste lid][ref6],
      [44c, derde lid][ref7], respectievelijk [artikel 44, eerste lid, van de wet][ref8] en een ontheffing als bedoeld
      [artikel 44b, eerste lid, van de wet][ref9];

      c. een omgevingsvergunning als bedoeld in
      [artikel 2.1, eerste lid, van de Wet algemene bepalingen omgevingswet][ref10] met betrekking tot een inrichting of
      mijnbouwwerk als bedoeld in [artikel 3.3, vierde lid, van het Besluit omgevingsrecht][ref11];

      d. een vergunning en ontheffing als bedoeld in [artikel 40, tweede lid, eerste volzin][ref12], respectievelijk,
      [artikel 43, vierde lid, van de wet][ref13];

      e. een vergunning als bedoeld in [artikel 94, eerste lid][ref14];

      f. een instemming als bedoeld in de [artikelen 39, tweede lid][ref15], en [55, eerste lid][ref16];

      g. een ontheffing krachtens dit besluit of een krachtens dit besluit vastgestelde ministeriële regeling,
      die betrekking heeft op een productie-installatie, een niet-productie-installatie, een pijpleiding of een
      gastransportnet als bedoeld in [artikel 1, eerste lid, onderdeel d, van de Gaswet][ref17];

      h. een instemming als bedoeld in [artikel 5a, eerste lid, van het Besluit algemene regels milieu mijnbouw][ref18];

      i. een melding als bedoeld in de [artikelen 7][ref19] en [8 van het Besluit algemene regels milieu mijnbouw][ref20];

      j. een maatwerkvoorschrift als bedoeld in [artikel 1.2 van het Activiteitenbesluit milieubeheer][ref21].

      3 De bedragen die krachtens [artikel 133, eerste lid, onderdeel b, van de wet][ref22] in rekening worden gebracht
      voor de uitvoering van taken door de inspecteur-generaal der mijnen en de bedragen die krachtens het eerste lid in
      rekening worden gebracht worden onderscheiden:

      a. per exploitant, eigenaar of netbeheerder, waarbij een onderscheid kan worden gemaakt tussen actieve en niet-
      actieve exploitanten of eigenaren;

      b. per activiteit, en

      c. afhankelijk van de locatie op land of op zee, de eigenschappen en de grootte van de productie-
      installatie, de niet-productie-installatie, de pijpleiding of het gastransportnet, bedoeld in
      [artikel 1, eerste lid, onderdeel d, van de Gaswet][ref23].

      4 Onze Minister brengt de bedragen in rekening en verzendt een beschikking daartoe aan de desbetreffende
      exploitant, eigenaar of netbeheerder.


