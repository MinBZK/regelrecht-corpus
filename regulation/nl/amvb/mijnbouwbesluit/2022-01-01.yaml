  - number: 45a
    text: |-
      1 Het is verboden een mijnbouwinstallatie, daaronder mede begrepen een veiligheidszone als bedoeld
      in [artikel 43 van de wet][ref1], te plaatsen in een gebied, dat is aangewezen in een kavelbesluit
      of een voorbereidingsbesluit als bedoeld in de [artikelen 3, eerste lid][ref2], respectievelijk
      [9, eerste lid, van de Wet windenergie op zee][ref3].

      2 Onze Minister kan ontheffing verlenen van het verbod. De ontheffing kan onder beperkingen worden verleend of
      daaraan kunnen voorschriften worden verbonden.

      3 Een ontheffing wordt slechts geweigerd in het belang van de elektriciteitsopwekking of de veiligheid.

      4 Met toepassing van [artikel 28, eerste lid, laatste zinsnede, van de Dienstenwet][ref4] is
      [paragraaf 4.1.3.3 van de Algemene wet bestuursrecht][ref5] niet van toepassing op de aanvraag om een ontheffing
      als bedoeld in het tweede lid.


