    text: |-
      Onze Minister kan, zolang de termijnen van [artikel 116][ref1] niet zijn verlopen, de in dat artikel
      bedoelde gegevens ter beschikking stellen aan de Mijnraad, de Technische commissie bodembeweging en de in
      [artikel 81, onderdeel a, van de wet][ref2] bedoelde vennootschap bedoelde vennootschap, voor zover deze gegevens
      worden gebruikt voor de volgende doeleinden:

      a. het adviseren van Onze Minister inzake verkenningsonderzoek, het opsporen of winnen van delfstoffen of
      aardwarmte en het opslaan van stoffen in de ondergrond;

      b. het ten behoeve van Onze Minister maken van reserveramingen en prognoses van delfstoffen, aardwarmte en
      opslagpotentieel van de ondergrond;

      c. het in opdracht van Onze Minister systematisch karteren van de ondergrond.


