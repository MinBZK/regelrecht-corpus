        paragraaf: '10.3'
  - number: '158'
    text: |-
      De houder van een vergunning als bedoeld in de [artikelen 146][ref1] en [151][ref2] verricht periodiek metingen
      naar de gesteentemechanische veiligheid van een groeve en verstrekt daarvan de resultaten aan gedeputeerde staten.


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel146
      [ref2]: https://wetten.overheid.nl/BWBR0014394#Artikel151
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel158
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: '146'
        hoofdstuk: '10'
        paragraaf: '10.2'
      - id: ref2
        bwb_id: BWBR0014394
        artikel: '151'
        hoofdstuk: '10'
        paragraaf: '10.3'
  - number: '159'
    text: |-
      1 Wanneer de veiligheid van een groeve wordt bedreigd door instortingsgevaar, doet de houder van een vergunning als
      bedoeld in de [artikelen 146][ref1] en [151][ref2] hiervan onmiddellijk mededeling aan gedeputeerde staten.

      2 De houder van de vergunning doet onmiddellijk mededeling van een instorting aan gedeputeerde staten.


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel146
      [ref2]: https://wetten.overheid.nl/BWBR0014394#Artikel151
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel159
