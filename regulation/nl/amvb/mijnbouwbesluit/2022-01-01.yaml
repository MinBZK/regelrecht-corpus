  - number: '43'
    text: Deze paragraaf heeft betrekking op mijnbouwinstallaties die boven oppervlaktewater uitsteken.
    url: https://wetten.overheid.nl/BWBR0014394/2022-01-01#Artikel43
  - number: '44'
    text: |-
      1 Het is verboden een mijnbouwinstallatie, daaronder mede begrepen een veiligheidszone als bedoeld in
      [artikel 43 van de wet][ref1], te plaatsen in gebieden die worden gebruikt als oefen- en schietgebied en bij
      ministeriële regeling zijn aangegeven.

      2 Onze Minister kan in overeenstemming met Onze Minister van Defensie ontheffing verlenen van het verbod. De
      ontheffing kan onder beperkingen worden verleend of daaraan kunnen voorschriften worden verbonden.

      3 Een ontheffing wordt slechts geweigerd in het belang van de landsverdediging of veiligheid.

      4 Met toepassing van [artikel 28, eerste lid, laatste zinsnede, van de Dienstenwet][ref2] is
      [paragraaf 4.1.3.3 van de Algemene wet bestuursrecht][ref3] niet van toepassing op de aanvraag om een ontheffing
      als bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0026759#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
