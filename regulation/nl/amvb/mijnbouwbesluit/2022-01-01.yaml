  - number: 84c
    text: |-
      1 Een rapport inzake grote gevaren voor een niet-productie-installatie bevat naast de documenten bedoeld in
      [artikel 45g van de wet](onbekend), de volgende gegevens:

      a. een veiligheids- en gezondheidsdocument, bedoeld in [artikel 2.42][ref1] en
      [2.42f van het Arbeidsomstandighedenbesluit][ref2];

      b. een intern rampenplan, bedoeld in [artikel 84d][ref3];

      c. overige informatie.

      2 Een eigenaar van een niet-productie-installatie raadpleegt een ondernemingsraad als bedoeld in
      [artikel 2 van de Wet op de ondernemingsraden][ref4] of een personeelsvertegenwoordiging als bedoeld in
      [artikel 35b van de Wet op de ondernemingsraden][ref5] bij het opstellen van het rapport inzake grote gevaren
      voor een niet-productie-installatie. Bij het ontbreken van een ondernemingsraad of personeelsvertegenwoordiging,
      voert een eigenaar overleg met de belanghebbende werknemers. Over het rapport wordt tevens overleg gevoerd met de
      werknemers van andere werkgevers, die op basis van een langlopende overeenkomst tot aanneming van werk mede in het
      bedrijf of de inrichting werkzaam zijn.

      3 De eigenaar van een niet-productie-installatie voldoet aan de maatregelen die zijn vastgesteld in het rapport
      inzake grote gevaren voor de betreffende installatie.

      4 Het rapport inzake grote gevaren is aanwezig op het mijnbouwwerk.

      5 Bij ministeriële regeling worden regels gesteld over de overige informatie, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2.42
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel2.42f
      [ref3]: https://wetten.overheid.nl/BWBR0014394#Artikel84d
      [ref4]: https://wetten.overheid.nl/BWBR0002747#Artikel2
      [ref5]: https://wetten.overheid.nl/BWBR0002747#Artikel35b
