$id: besluit_inventarisatie_broeikasgassen_wlv
regulatory_layer: AMVB
publication_date: '2020-10-28'
valid_from: '2015-01-01'
bwb_id: BWBR0019246
url: https://wetten.overheid.nl/BWBR0019246/2015-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 1 oktober
    2004, nr. MJZ2004094821, Directie Juridische Zaken, Afdeling Wetgeving;

    Gelet op artikel 4, eerste lid, van het Raamverdrag van de Verenigde Naties inzake klimaatverandering, artikel 5,
    eerste en tweede lid, van het Protocol van Kyoto bij voornoemd verdrag, artikel 3, eerste lid, en artikel 4, vierde
    lid, van beschikking nr. 280/2004/EG van het Europees Parlement en de Raad van de Europese Unie van 11 februari
    2004 betreffende een bewakingssysteem voor de uitstoot van broeikasgassen in de Gemeenschap en de uitvoering van
    het Protocol van Kyoto (PbEU L 49) en artikel 59, eerste lid, van de Wet inzake de luchtverontreiniging;

    De Raad van State gehoord (advies van 22 november 2004, nr. W08.04.0486/V);

    Gezien het nader rapport van de Staatssecretaris van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 7
    december 2005, nr. DJZ 2005211699, Directie Juridische Zaken, Afdeling Wetgeving;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0019246/2015-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'Voor de toepassing van de bij of krachtens dit besluit gegeven voorschriften wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0019246/2015-01-01#Artikel1
  - number: 1.a
    text: |-
      Verdrag: het op 9 mei 1992 te New York tot stand gekomen Raamverdrag van de Verenigde Naties inzake
      Klimaatverandering (Trb. 1992, 189);
    url: https://wetten.overheid.nl/BWBR0019246/2015-01-01#Artikel1
  - number: 1.b
    text: |-
      Protocol: het op 11 december 1997 te Kyoto tot stand gekomen Protocol van Kyoto bij het Verdrag (Trb. 1998, 170, en
      1999, 110);
    url: https://wetten.overheid.nl/BWBR0019246/2015-01-01#Artikel1
  - number: 1.c
    text: |-
      nationale emissie-inventaris: inventaris als bedoeld in artikel 4, eerste lid, onder a, van het Verdrag, van
      nationale antropogene emissies per bron en verwijdering per put van broeikasgassen, die niet vallen onder het
      Protocol van Montreal betreffende stoffen die de ozonlaag afbreken (Trb. 1988, 11);
    url: https://wetten.overheid.nl/BWBR0019246/2015-01-01#Artikel1
  - number: 1.d
    text: |-
      nationaal inventarisatiesysteem: geheel van institutionele, juridische en procedurele voorzieningen als bedoeld in
      artikel 5, eerste lid, van het Protocol, die in Nederland worden getroffen om de nationale emissie-inventaris op te
      stellen, te archiveren en openbaar te maken.
    url: https://wetten.overheid.nl/BWBR0019246/2015-01-01#Artikel1
  - number: '2.1'
    text: Er is een nationaal inventarisatiesysteem.
    url: https://wetten.overheid.nl/BWBR0019246/2015-01-01#Artikel2
  - number: '2.2'
    text: Onze Minister is verantwoordelijk voor het nationaal inventarisatiesysteem en de nationale emissie-inventaris.
    url: https://wetten.overheid.nl/BWBR0019246/2015-01-01#Artikel2
  - number: '2.3'
    text: |-
      Onze Minister wijst een organisatie aan die het beheer van het nationaal inventarisatiesysteem voert en zorg draagt
      voor het jaarlijks opstellen, archiveren en openbaar maken van de nationale emissie-inventaris.
    url: https://wetten.overheid.nl/BWBR0019246/2015-01-01#Artikel2
  - number: '3'
    text: |-
      Het opstellen van de nationale emissie-inventaris geschiedt overeenkomstig de methoderapporten inzake
      broeikasgassen, opgesteld door het Rijksinstituut voor Volksgezondheid en Milieu, gepubliceerd op een bij
      ministeriële regeling aan te wijzen website.
    url: https://wetten.overheid.nl/BWBR0019246/2015-01-01#Artikel3
  - number: '4'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin het wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0019246/2015-01-01#Artikel4
  - number: '5'
    text: 'Dit besluit wordt aangehaald als: Besluit inventarisatie broeikasgassen Wlv.'
    url: https://wetten.overheid.nl/BWBR0019246/2015-01-01#Artikel5
