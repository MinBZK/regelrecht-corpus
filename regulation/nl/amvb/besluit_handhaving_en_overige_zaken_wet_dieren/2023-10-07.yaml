  - number: '4.12'
    text: |-
      Indien bij ministeriële regeling onder toepassing van [artikel 7.1 van de wet][ref1] is bepaald dat een besluit
      tot verlening van een vergunning, erkenning, toestemming, toelating, registratie, bewijs van vakbekwaamheid,
      goedkeuring, vrijstelling, ontheffing, algemeen verbindend verklaring of certificering is vereist, kunnen bij die
      ministeriële regeling regels worden gesteld over de gevallen waarin een besluit als bedoeld in die regeling wordt
      geschorst of ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel7
    url: https://wetten.overheid.nl/BWBR0032334/2023-10-07#Artikel4.12
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '7'
  - number: '6.1'
    text: |-
      De artikelen van dit besluit treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0032334/2023-10-07#Artikel6.1
  - number: '6.2'
    text: 'Dit besluit wordt aangehaald als: Besluit handhaving en overige zaken Wet dieren.'
    url: https://wetten.overheid.nl/BWBR0032334/2023-10-07#Artikel6.2
