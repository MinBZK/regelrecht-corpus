  - number: '4.9'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld voor de uitvoering van niet-bindende onderdelen
      van een op verordening (EU) nr. 2016/429 of op verordening (EU) nr. 2017/625 gebaseerde gedelegeerde
      handeling of uitvoeringshandeling, voor zover die niet-bindende onderdelen onderwerpen betreffen, bedoeld
      in de [artikelen 2.2, tiende lid][ref1], [2.3, vierde lid][ref2], [2.4, tweede of derde lid][ref3],
      [2.5, tweede lid][ref4], [2.6, tweede of derde lid][ref5], [2.7, tweede lid][ref6], [2.8, vierde lid][ref7],
      [2.10, derde lid][ref8], [2.15, tweede of vierde lid][ref9], [2.16, tweede lid][ref10], [2.20, tweede lid][ref11],
      [2.22, tweede lid][ref12], [3.1, tweede lid][ref13], [3.2, tweede lid][ref14], [4.8, vierde lid]
      (onbekend), [7.2, eerste tot en met derde lid][ref15], [7.3, derde lid][ref16], [7.4, eerste lid][ref17],
      [7.6, eerste lid][ref18], [7.8][ref19], of [10.2 van de Wet dieren][ref20].


