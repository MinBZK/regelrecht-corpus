preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Economische Zaken, Landbouw en Innovatie van 12 juli 2012 ,
    nr. 283318, Directie Wetgeving en Juridische Zaken;

    Gelet op de artikelen 7.8, eerste lid, 8.8 en 10.8 van de Wet dieren en artikel 1:1, zesde lid, van de Algemene
    douanewet;

    De Afdeling advisering van de Raad van State gehoord (advies van 7 september 2012, nr. W15.12.0296/IV);

    Gezien het nader rapport van de Staatssecretaris van Economische Zaken, Landbouw en Innovatie van 31 oktober 2012,
    nr. WJZ / 12339223, Directie Wetgeving en Juridische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0032334/2023-10-07#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder: - *Raad:* Raad voor dierenaangelegenheden,
      bedoeld in [artikel 10.8 van de wet][ref1];
        - *wet:* [Wet dieren][ref2];
        - *verordening (EU) nr. 2017/625:* verordening (EU) 2017/625 van het Europees Parlement en de Raad van 15 maart
      2017 betreffende officiële controles en andere officiële activiteiten die worden uitgevoerd om de toepassing
      van de levensmiddelen- en diervoederwetgeving en van de voorschriften inzake diergezondheid, dierenwelzijn,
      plantgezondheid en gewasbeschermingsmiddelen te waarborgen, tot wijziging van de [Verordeningen (EG) nr. 999/2001]
      (32001R0999), [(EG) nr. 396/2005](32005R0396), [(EG) nr. 1069/2009](32009R1069), [(EG) nr. 1107/2009](32009R1107),
      (EU) [nr. 1151/2012](32012R1151), (EU) [nr. 652/2014](32014R0652), (EU) [2016/429](32329R2016) en (EU) [2016/2031]
      (32031R2016) van het Europees Parlement en de Raad, de Verordeningen [(EG) nr. 1/2005](32005R0001) en [(EG) nr.
      1099/2009](32009R1099) van de Raad en de Richtlijnen [98/58/EG](31958R0098), [1999/74/EG](31974R1999), [2007/43/
      EG](31943R2007), [2008/119/EG](32019R2008) en [2008/120/EG](32020R2008) van de Raad, en tot intrekking van de
      Verordeningen [(EG) nr. 854/2004](32004R0854) en [(EG) nr. 882/2004](32004R0882) van het Europees Parlement en
      de Raad, de Richtlijnen [89/608/EEG](32508R0089), [89/662/EEG](32562R0089), [90/425/EEG](32325R0090), [91/496/
      EEG](32396R0091), [96/23/EG](31923R0096), [96/93/EG](31993R0096) en [97/78/EG](31978R0097) van de Raad en Besluit
      [92/438/EEG](32338R0092) van de Raad (verordening officiële controles) (Pb EU 2017 L 95);
        - *verordening (EU) nr. 2016/429:* verordening (EU) 2016/429 van het Europees Parlement en de Raad van 9 maart 2016
      betreffende overdraagbare dierziekten en tot wijziging en intrekking van bepaalde handelingen op het gebied van
      diergezondheid («diergezondheidswetgeving») (PbEU 2016, L 84).


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0030250
    url: https://wetten.overheid.nl/BWBR0032334/2023-10-07#Artikel1.1
    references:
      - id: ref1
