        bwb_id: BWBR0030250
  - number: '2.1'
    text: |-
      In dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder: - *overtreder:* overtreder als bedoeld in
      [artikel 8.6, eerste lid, onderdeel b, van de wet][ref1];
        - *overtreding:* overtreding als bedoeld in [artikel 8.6, eerste lid, onderdeel a, van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0030250#Artikel8
    url: https://wetten.overheid.nl/BWBR0032334/2023-10-07#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0030250
        artikel: '8'
  - number: 2.2.1
    text: |-
      De hoogte van de bestuurlijke boete die Onze Minister aan een overtreder voor een overtreding kan opleggen wordt
      overeenkomstig de volgende boetecategorieën vastgesteld:
    url: https://wetten.overheid.nl/BWBR0032334/2023-10-07#Artikel2.2
  - number: 2.2.1.a
    text: 'categorie 1: € 500;'
    url: https://wetten.overheid.nl/BWBR0032334/2023-10-07#Artikel2.2
  - number: 2.2.1.b
    text: 'categorie 2: € 1500;'
    url: https://wetten.overheid.nl/BWBR0032334/2023-10-07#Artikel2.2
  - number: 2.2.1.c
    text: 'categorie 3: € 2500;'
    url: https://wetten.overheid.nl/BWBR0032334/2023-10-07#Artikel2.2
  - number: 2.2.1.d
    text: 'categorie 4: € 5000;'
    url: https://wetten.overheid.nl/BWBR0032334/2023-10-07#Artikel2.2
  - number: 2.2.1.e
    text: 'categorie 5: € 10.000 of, indien dat meer is, 10% van de jaaromzet.'
    url: https://wetten.overheid.nl/BWBR0032334/2023-10-07#Artikel2.2
  - number: 2.2.2
    text: |-
      Indien de hoogte van de krachtens het derde lid aangewezen boetecategorie door het met de overtreding te behalen
      economische voordeel aanmerkelijk wordt overschreden, kan Onze Minister een bestuurlijke boete opleggen van ten
      hoogste categorie 5, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0032334/2023-10-07#Artikel2.2
  - number: 2.2.3
    text: |-
      Bij ministeriële regeling worden de bepalingen waarvoor in geval van overtreding een bestuurlijke boete kan worden
      opgelegd, ingedeeld overeenkomstig de daarbij aangewezen boetecategorie.
    url: https://wetten.overheid.nl/BWBR0032334/2023-10-07#Artikel2.2
  - number: 2.2.4
    text: |-
      In de regeling, bedoeld in het derde lid, kan worden bepaald dat de hoogte van de bestuurlijke boete voor een
      overtreding wordt vastgesteld op het bedrag behorende bij de naasthogere boetecategorie ten opzichte van de
      categorie, bedoeld in het derde lid, indien bij de betreffende gedraging een in die regeling vastgesteld percentage
      dieren van het totaal aantal betrokken dieren was betrokken op een in die regeling aangewezen wijze.
    url: https://wetten.overheid.nl/BWBR0032334/2023-10-07#Artikel2.2
  - number: '2.3'
    text: |-
      Indien de risico’s of de gevolgen van een overtreding voor de volksgezondheid, diergezondheid, dierenwelzijn of
      milieu:
    url: https://wetten.overheid.nl/BWBR0032334/2023-10-07#Artikel2.3
  - number: 2.3.a
    text: |-
      gering zijn of ontbreken, wordt het bedrag, bedoeld in [artikel 2.2, eerste lid][ref1], gehalveerd;


      [ref1]: https://wetten.overheid.nl/BWBR0032334#Artikel2
    url: https://wetten.overheid.nl/BWBR0032334/2023-10-07#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0032334
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.3.b
    text: |-
      ernstig zijn, wordt het bedrag, bedoeld in [artikel 2.2, eerste lid][ref1], verdubbeld.


      [ref1]: https://wetten.overheid.nl/BWBR0032334#Artikel2
    url: https://wetten.overheid.nl/BWBR0032334/2023-10-07#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0032334
        artikel: '2'
        hoofdstuk: '2'
  - number: '2.4'
    text: |-
      Indien een overtreding is begaan anders dan in de uitoefening van een beroep of bedrijf, wordt het voor die
      overtreding op grond van de [artikelen 2.2][ref1] en [2.3][ref2] op te leggen boetebedrag gehalveerd.


      [ref1]: https://wetten.overheid.nl/BWBR0032334#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032334#Artikel2
    url: https://wetten.overheid.nl/BWBR0032334/2023-10-07#Artikel2.4
    references:
      - id: ref1
        bwb_id: BWBR0032334
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0032334
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.5.1
    text: |-
      Indien ten tijde van het begaan van een overtreding nog geen vijf jaren zijn verstreken sinds een eerder aan de
      overtreder opgelegde bestuurlijke boete voor eenzelfde overtreding onherroepelijk is geworden, is de bestuurlijke
      boete gelijk aan de som van de op grond van de [artikelen 2.2][ref1], [2.3][ref2] en [2.4][ref3] voor de
      overtreding op te leggen bestuurlijke boete en de voor die eerdere overtreding opgelegde bestuurlijke boete.


      [ref1]: https://wetten.overheid.nl/BWBR0032334#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032334#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0032334#Artikel2
    url: https://wetten.overheid.nl/BWBR0032334/2023-10-07#Artikel2.5
    references:
      - id: ref1
        bwb_id: BWBR0032334
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0032334
        artikel: '2'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0032334
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.5.2
    text: |-
      Bij ministeriële regeling kunnen overtredingen worden aangewezen die soortgelijk zijn aan daarbij aangewezen andere
      overtredingen.
    url: https://wetten.overheid.nl/BWBR0032334/2023-10-07#Artikel2.5
  - number: 2.5.3
    text: Op krachtens het tweede lid aangewezen overtredingen is het eerste lid van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0032334/2023-10-07#Artikel2.5
  - number: 3.1.1
    text: De Raad bestaat uit een voorzitter en ten hoogste 49 andere leden.
    url: https://wetten.overheid.nl/BWBR0032334/2023-10-07#Artikel3.1
  - number: 3.1.2
    text: |-
      De leden brengen hun kennis en ervaring op persoonlijke titel in en treden niet op als vertegenwoordiger van een
      specifieke belangengroep.
    url: https://wetten.overheid.nl/BWBR0032334/2023-10-07#Artikel3.1
  - number: 3.1.3
    text: De leden worden benoemd voor een periode van vier jaar.
    url: https://wetten.overheid.nl/BWBR0032334/2023-10-07#Artikel3.1
  - number: 3.1.4
    text: |-
      Na afloop van de benoemingsperiode, bedoeld in het tweede lid, kunnen de leden eenmaal worden herbenoemd voor de in
      dat lid bedoelde termijn.
    url: https://wetten.overheid.nl/BWBR0032334/2023-10-07#Artikel3.1
  - number: 3.1.5
    text: 'De leden kunnen door Onze Minister:'
    url: https://wetten.overheid.nl/BWBR0032334/2023-10-07#Artikel3.1
  - number: 3.1.5.a
    text: op hun verzoek worden ontslagen;
    url: https://wetten.overheid.nl/BWBR0032334/2023-10-07#Artikel3.1
  - number: 3.1.5.b
    text: |-
      in overeenstemming met Onze Minister van Volksgezondheid, Welzijn en Sport, om zwaarwegende reden worden geschorst
      en ontslagen.
    url: https://wetten.overheid.nl/BWBR0032334/2023-10-07#Artikel3.1
  - number: 3.2.1
    text: Onze Minister benoemt de secretaris en de adjunct-secretaris van de Raad.
    url: https://wetten.overheid.nl/BWBR0032334/2023-10-07#Artikel3.2
  - number: 3.2.2
    text: De secretaris en de adjunct-secretaris zijn niet tevens lid van de Raad.
    url: https://wetten.overheid.nl/BWBR0032334/2023-10-07#Artikel3.2
  - number: 3.2.3
    text: |-
      Voor de uitoefening van hun taak zijn de secretaris en de adjunct-secretaris uitsluitend verantwoording schuldig
      aan de Raad.
    url: https://wetten.overheid.nl/BWBR0032334/2023-10-07#Artikel3.2
  - number: 3.3.1
    text: 'De voorzitter roept de Raad bijeen:'
    url: https://wetten.overheid.nl/BWBR0032334/2023-10-07#Artikel3.3
  - number: 3.3.1.a
    text: zo dikwijls als hij dit nodig acht, maar in ieder geval twee keer per jaar;
    url: https://wetten.overheid.nl/BWBR0032334/2023-10-07#Artikel3.3
  - number: 3.3.1.b
    text: |-
      indien ten minste vijf leden een daartoe strekkend, schriftelijk en met redenen omkleed verzoek bij de voorzitter
      hebben ingediend.
    url: https://wetten.overheid.nl/BWBR0032334/2023-10-07#Artikel3.3
  - number: 3.3.2
    text: |-
      Na een verzoek als bedoeld in het eerste lid, onderdeel b, roept de voorzitter de Raad bijeen binnen één maand
      nadat het verzoek door de voorzitter is ontvangen.
    url: https://wetten.overheid.nl/BWBR0032334/2023-10-07#Artikel3.3
  - number: 3.4.1
    text: |-
      De Raad voert op verzoek van Onze Minister of uit eigen beweging overleg over de in [artikel 10.8 van de wet][ref1]
      bedoelde vraagstukken.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel10
    url: https://wetten.overheid.nl/BWBR0032334/2023-10-07#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '10'
  - number: 3.4.2
    text: |-
      De voorzitter kan met het oog op een overleg over een bepaald onderwerp uit de leden van de Raad een forum
      samenstellen en anderen dan leden van de Raad uitnodigen voor deelname aan dat overleg.
    url: https://wetten.overheid.nl/BWBR0032334/2023-10-07#Artikel3.4
  - number: 3.4.3
    text: De Raad stelt een verslag op van een gevoerd overleg.
    url: https://wetten.overheid.nl/BWBR0032334/2023-10-07#Artikel3.4
  - number: 3.4.4
    text: |-
      Het verslag wordt ter kennis gebracht van Onze Minister. Indien het verslag mede het belang van de volksgezondheid
      raakt, wordt dit ook ter kennis gebracht aan Onze Minister van Volksgezondheid, Welzijn en Sport.
    url: https://wetten.overheid.nl/BWBR0032334/2023-10-07#Artikel3.4
  - number: 3.5.1
    text: De Raad stelt zijn werkwijze nader vast in een reglement.
    url: https://wetten.overheid.nl/BWBR0032334/2023-10-07#Artikel3.5
  - number: 3.5.2
    text: Het reglement, bedoeld in het eerste lid, wordt na vaststelling toegezonden aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0032334/2023-10-07#Artikel3.5
  - number: '3.6'
    text: |-
      De Raad stelt jaarlijks voor zijn werkzaamheden in het komende begrotingsjaar een ontwerpbegroting op en legt deze
      voor 1 april voor aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0032334/2023-10-07#Artikel3.6
  - number: '3.7'
    text: De Raad doet jaarlijks voor 1 april schriftelijk verslag van zijn werkzaamheden aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0032334/2023-10-07#Artikel3.7
  - number: '4.1'
    text: |-
      Onze Minister zendt binnen drie jaar na de inwerkingtreding van dit besluit een verslag aan de Staten-Generaal over
      de doeltreffendheid en de effecten van [hoofdstuk 2][ref1] in de praktijk.


      [ref1]: https://wetten.overheid.nl/BWBR0032334#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0032334/2023-10-07#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0032334
        hoofdstuk: '2'
  - number: '4.2'
    text: |-
      De Raad brengt iedere zes jaren een rapport uit aan Onze Minister waarin de taakvervulling van de Raad aan een
      onderzoek wordt onderworpen.
    url: https://wetten.overheid.nl/BWBR0032334/2023-10-07#Artikel4.2
  - number: '4.3'
    text: |-
      Indien een overtreding is begaan voor het tijdstip van inwerkingtreding van dit besluit en als gevolg van die
      inwerkingtreding, in samenhang met de op dit besluit gebaseerde regels, een andere bestuurlijke boete kan worden
      opgelegd dan de bestuurlijke boete die voor die overtreding kon worden opgelegd op grond van de voor dat tijdstip
      geldende regels, worden de voor de overtreder gunstigste bepalingen toegepast.
    url: https://wetten.overheid.nl/BWBR0032334/2023-10-07#Artikel4.3
  - number: '4.4'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over de intrekking van een beoordeling van een nationale
      gids voor goede praktijken als bedoeld in [artikel 8.44, tweede lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel8
    url: https://wetten.overheid.nl/BWBR0032334/2023-10-07#Artikel4.4
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '8'
  - number: '4.5'
    text: Onze Minister is bevoegd besluiten te nemen als bedoeld in artikel 35, derde lid, van verordening (EU) 2017/625.
    url: https://wetten.overheid.nl/BWBR0032334/2023-10-07#Artikel4.5
  - number: '4.6'
    text: Onze Minister is de coördinerende instantie, bedoeld in artikel 4, tweede lid, onder b, verordening (EU) 2017/625.
    url: https://wetten.overheid.nl/BWBR0032334/2023-10-07#Artikel4.6
  - number: '4.7'
    text: |-
      Op een besluit dat vanwege een geconstateerde niet-naleving is genomen en dat is gebaseerd of mede gebaseerd
      op artikel 19, eerste lid, of artikel 54, eerste en tweede lid, van verordening (EU) nr. 882/2004 van het
      Europees Parlement en de Raad van 29 april 2004 inzake officiële controles op de naleving van de wetgeving inzake
      diervoeders en levensmiddelen en de voorschriften inzake diergezondheid en dierenwelzijn (PbEU 2004, L 165),
      dat is genomen voor 14 december 2019 en waartegen bezwaar is gemaakt, of beroep is ingesteld, wordt besloten met
      toepassing van die verordening zoals die luidde voor 14 december 2019.
    url: https://wetten.overheid.nl/BWBR0032334/2023-10-07#Artikel4.7
  - number: '4.8'
    text: |-
      Onze Minister is bevoegd besluiten te nemen ter uitvoering van aan een lidstaat gerichte bindende en niet-
      bindende onderdelen van verordening (EU) nr. 2016/429 of verordening (EU) nr. 2017/625 of op één van die
      verordening gebaseerde gedelegeerde handeling of uitvoeringshandeling, voor zover die bindende en niet-bindende
      onderdelen onderwerpen betreffen, bedoeld in de [artikelen 2.2, tiende lid][ref1], [2.3, vierde lid][ref2],
      [2.4, tweede of derde lid][ref3], [2.5, tweede lid][ref4], [2.6, tweede of derde lid][ref5],
      [2.7, tweede lid][ref6], [2.8, vierde lid][ref7], [2.10, derde lid][ref8], [2.15, tweede of vierde lid][ref9],
      [2.16, tweede lid][ref10], [2.20, tweede lid][ref11], [2.22, tweede lid][ref12], [3.1, tweede lid][ref13],
      [3.2, tweede lid][ref14], 4.8, vierde lid, [7.2, eerste tot en met derde lid][ref15], [7.3, derde lid][ref16],
      [7.4, eerste lid][ref17], [7.6, eerste lid][ref18], [7.8][ref19], of [10.2 van de Wet dieren][ref20].


