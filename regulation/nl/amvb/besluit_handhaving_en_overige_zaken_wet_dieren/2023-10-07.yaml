  - number: 4.10.1
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over laboratoria waar en de wijze waarop
      laboratoriumanalyses, -tests, en -diagnoses plaatsvinden ten behoeve van:
    url: https://wetten.overheid.nl/BWBR0032334/2023-10-07#Artikel4.10
  - number: 4.10.1.a
    text: officiële controles of andere officiële activiteiten als bedoeld in artikel 2 van verordening (EU) nr. 2017/625;
    url: https://wetten.overheid.nl/BWBR0032334/2023-10-07#Artikel4.10
  - number: 4.10.1.b
    text: de afgifte van certificaten voor het buiten Nederland brengen van dieren of dierlijke producten;
    url: https://wetten.overheid.nl/BWBR0032334/2023-10-07#Artikel4.10
  - number: 4.10.1.c
    text: |-
      verrichten van onderzoek naar de aanwezigheid van ziekteverwekkers, dierziekten, zoönosen en ziekteverschijnselen;
      of
    url: https://wetten.overheid.nl/BWBR0032334/2023-10-07#Artikel4.10
  - number: 4.10.1.d
    text: |-
      het toezicht op de naleving van de bij of krachtens de [Wet dieren][ref1] gestelde voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0030250
    url: https://wetten.overheid.nl/BWBR0032334/2023-10-07#Artikel4.10
    references:
      - id: ref1
        bwb_id: BWBR0030250
  - number: 4.10.2
    text: |-
      Een laboratorium voert laboratoriumanalyses, -tests en -diagnoses uit als bedoeld in het eerste lid, aanhef, en
      onder b, c of d, indien het is erkend door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0032334/2023-10-07#Artikel4.10
  - number: 4.10.3
    text: 'De regels, bedoeld in het eerste lid, kunnen onder meer betrekking hebben op:'
    url: https://wetten.overheid.nl/BWBR0032334/2023-10-07#Artikel4.10
  - number: 4.10.3.a
    text: |-
      de meldingen van uitkomsten van uitgevoerde laboratoriumanalyses, -tests, en -diagnoses aan Onze Minister of een
      door Onze Minister aangewezen instantie;
    url: https://wetten.overheid.nl/BWBR0032334/2023-10-07#Artikel4.10
  - number: 4.10.3.b
    text: de monitoring van de werkzaamheden waarvoor het laboratorium is erkend; of
    url: https://wetten.overheid.nl/BWBR0032334/2023-10-07#Artikel4.10
  - number: 4.10.3.c
    text: het rapporteren over uitgevoerde laboratoriumanalyses, -tests, en -diagnoses aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0032334/2023-10-07#Artikel4.10
  - number: 4.10.4
    text: |-
      Onze Minister wijst instanties aan die de monitoring, bedoeld in het derde lid, onderdeel b, uitvoeren. Bij
      ministeriële regeling kunnen regels worden gesteld over de uitvoering van de monitoring.
    url: https://wetten.overheid.nl/BWBR0032334/2023-10-07#Artikel4.10
  - number: 4.10.5
    text: |-
      Bij ministeriële regeling worden regels gesteld over de gevallen waarin een erkenning wordt geschorst of
      ingetrokken.
    url: https://wetten.overheid.nl/BWBR0032334/2023-10-07#Artikel4.10
  - number: '4.11'
    text: |-
      Onze Minister is bevoegd besluiten te nemen ter uitvoering van aan een lidstaat gerichte bindende onderdelen van
      verordening (EU) nr. 2019/4 of verordening (EU) nr. 2019/6 of een op die verordeningen gebaseerde gedelegeerde
      handeling of uitvoeringshandeling, voor zover die bindende onderdelen onderwerpen betreffen, bedoeld in
      de [artikelen 2.2, tiende lid][ref1], [2.20, tweede lid][ref2], [7.2, eerste tot en met derde lid][ref3],
      [7.3, derde lid][ref4], [7.4, eerste lid][ref5], [7.6, eerste lid][ref6], [7.8][ref7], of
      [10.2 van de Wet dieren][ref8].


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0030250#Artikel2
