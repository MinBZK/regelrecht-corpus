    U78569;

    Gelet op artikel 190 van de Provinciewet en artikel 186 van de Gemeentewet;

    De Raad van State gehoord (advies van 4 december 2002, nr. W04.02.0300/1);

    Gezien het nader rapport van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties van 13 januari 2003, nr.
    FO2002/U100707

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel1
  - number: 1.1.a
    text: 'uitzettingen: alle uitgezette middelen;'
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel1
  - number: 1.1.b
    text: |-
      verbonden partij: een privaatrechtelijke of publiekrechtelijke organisatie waarin de provincie onderscheidenlijk
      gemeente een bestuurlijk en een financieel belang heeft;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel1
  - number: 1.1.c
    text: |-
      financieel belang: een aan de verbonden partij ter beschikking gesteld bedrag dat niet verhaalbaar is indien de
      verbonden partij failliet gaat onderscheidenlijk het bedrag waarvoor aansprakelijkheid bestaat indien de verbonden
      partij haar verplichtingen niet nakomt;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel1
  - number: 1.1.d
    text: |-
      bestuurlijk belang: zeggenschap, hetzij uit hoofde van vertegenwoordiging in het bestuur hetzij uit hoofde van
      stemrecht;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel1
  - number: 1.1.e
    text: |-
      deelneming: een participatie in een besloten of naamloze vennootschap, waarin de provincie onderscheidenlijk
      gemeente aandelen heeft;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel1
  - number: 1.1.f
    text: 'CBS: Centraal bureau voor de statistiek;'
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel1
  - number: 1.1.g
    text: |-
      rentetypische looptijd; als gedefinieerd in de [Wet fido, artikel 1, onder b][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011987#Artikel1
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0011987
        artikel: '1'
  - number: 1.1.h
    text: 'vaste schuld: het gezamenlijk bedrag van:'
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel1
  - number: 1.1.h.1°
    text: de schuld uit hoofde van geldleningen met een oorspronkelijke rentetypische looptijd van één jaar of langer, en
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel1
  - number: 1.1.h.2°
    text: de voor een termijn van één jaar of langer ontvangen waarborgsommen;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel1
  - number: 1.1.i
    text: |-
      netto-vlottende schuld; als gedefinieerd in de [Wet fido, artikel 1, onder e][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011987#Artikel1
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0011987
        artikel: '1'
  - number: 1.1.j
    text: |-
      EMU-saldo: het geraamde onderscheidenlijk gerealiseerde saldo van de ontvangsten en uitgaven van een provincie
      onderscheidenlijk een gemeente, berekend op transactiebasis en overeenkomstig de voorschriften van het Europese
      systeem van nationale en regionale rekeningen in de Europese Unie;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel1
  - number: 1.1.k
    text: |-
      niet-effectieve positie: situatie waarin de onderliggende waarde en looptijd van een financieel derivaat niet
      overeenkomt met de financieringsbehoefte waar het derivaat betrekking op heeft;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel1
  - number: 1.1.l
    text: |-
      overheadkosten: alle kosten die samenhangen met de sturing en ondersteuning van de medewerkers in het primaire
      proces;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel1
  - number: 1.1.m
    text: |-
      bouwgrond in exploitatie: gronden in eigendom van een provincie onderscheidenlijk een gemeente, waarvoor
      provinciale staten onderscheidenlijk de raad een grondexploitatiepcomplex en een grondexploitatiebegroting heeft
      vastgesteld;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel1
  - number: 1.1.n
    text: |-
      taakvelden: eenheden waarin de programma’s, bedoeld in [artikel 8, tweede lid][ref1], of de eenheden in overzichten
      en bedragen in het programmaplan, bedoeld in artikel 8, eerste lid, onderdelen b tot en met e zijn onderverdeeld;


      [ref1]: https://wetten.overheid.nl/BWBR0014606#Artikel8
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0014606
        artikel: '8'
        hoofdstuk: II
  - number: 1.1.o
    text: 'economische categorieën: eenheden waarin de baten en lasten van activiteiten binnen een taakveld worden uitgedrukt;'
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel1
  - number: 1.1.p
    text: |-
      investeringen met economisch nut: investeringen die verhandelbaar zijn en kunnen bijdragen aan het genereren van
      middelen.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel1
  - number: '1.2'
    text: |-
      In dit besluit wordt onder verbonden partij mede verstaan een Europese groepering voor territoriale samenwerking
      als bedoeld in artikel 1 van verordening (EG) nr. 1082/2006 van het Europees Parlement en de Raad van de Europese
      Unie van 5 juli 2006 betreffende een Europese groepering voor territoriale samenwerking (EGTS) (PbEU L 210) waarin
      de provincie onderscheidenlijk gemeente een bestuurlijk en een financieel belang heeft.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel1
  - number: '2.1'
    text: |-
      Voor de begroting, de meerjarenraming, de jaarstukken en de uitvoeringsinformatie wordt een stelsel van baten en
      lasten gehanteerd.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel2
  - number: '2.2'
    text: |-
      De baten en de lasten van het begrotingsjaar worden in de begroting, de jaarstukken en de uitvoeringsinformatie
      opgenomen, onverschillig of zij tot inkomsten of uitgaven in dat jaar leiden, onderscheidenlijk hebben geleid.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel2
  - number: '2.3'
    text: De baten en lasten worden geraamd dan wel verantwoord tot hun brutobedrag.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel2
  - number: '2.4'
    text: |-
      Onder de baten en lasten worden ook begrepen de over het eigen vermogen en de voorzieningen berekende bespaarde
      rente.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel2
  - number: '2.5'
    text: |-
      Onder baten en lasten wordt ook begrepen de heffing van de vennootschapsbelasting. Deze heffing wordt geraamd en
      verantwoord op basis van de fiscale grondslag.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel2
  - number: '3.1'
    text: |-
      De begroting, de meerjarenraming, de jaarstukken en de uitvoeringsinformatie geven volgens normen die voor
      gemeenten en provincies als aanvaardbaar worden beschouwd een zodanig inzicht dat een verantwoord oordeel kan
      worden gevormd over de financiële positie en over de baten en de lasten. In het bijzonder provinciale staten en de
      raad moeten in staat zijn zich een zodanig oordeel te vormen.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel3
  - number: '3.2'
    text: |-
      De begroting, de meerjarenraming en de uitvoeringsinformatie geven duidelijk en stelselmatig de omvang van alle
      geraamde baten en lasten, alsmede het saldo ervan weer. De begroting geeft tevens duidelijk en stelselmatig inzicht
      in de financiële positie.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel3
  - number: '3.3'
    text: |-
      De jaarstukken en de uitvoeringsinformatie geven getrouw, duidelijk en stelselmatig de baten en lasten van het
      begrotingsjaar, alsmede het saldo ervan weer. De jaarrekening geeft tevens een getrouw, duidelijk en stelselmatig
      inzicht in de financiële positie aan het einde van het begrotingsjaar.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel3
  - number: '4.1'
    text: De indeling van de begroting en de jaarstukken is identiek.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel4
  - number: '4.2'
    text: |-
      Indien de indeling van de begroting, de meerjarenraming, de jaarstukken en de uitvoeringsinformatie afwijkt van die
      van het voorafgaande begrotingsjaar worden in de toelichting de verschillen aangegeven en worden de redenen die tot
      de afwijking hebben geleid uiteengezet.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel4
  - number: '5'
    text: Verbonden partijen worden niet geconsolideerd in de begroting en jaarstukken.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel5
  - number: '7.1'
    text: 'De begroting bestaat ten minste uit:'
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel7
  - number: 7.1.a
    text: de beleidsbegroting;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel7
  - number: 7.1.b
    text: de financiële begroting.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel7
  - number: '7.2'
    text: 'De beleidsbegroting bestaat ten minste uit:'
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel7
  - number: 7.2.a
    text: het programmaplan;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel7
  - number: 7.2.b
    text: de paragrafen.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel7
  - number: '7.3'
    text: 'De financiële begroting bestaat ten minste uit:'
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel7
  - number: 7.3.a
    text: het overzicht van baten en lasten en de toelichting;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel7
  - number: 7.3.b
    text: de uiteenzetting van de financiële positie en de toelichting;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel7
  - number: 7.3.c
    text: de bijlage met het overzicht van de geraamde baten en lasten per taakveld.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel7
  - number: '8.1'
    text: 'Het programmaplan bevat:'
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel8
  - number: 8.1.a
    text: de te realiseren programma's;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel8
  - number: 8.1.b
    text: een overzicht van de algemene dekkingsmiddelen;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel8
  - number: 8.1.c
    text: een overzicht van de kosten van overhead;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel8
  - number: 8.1.d
    text: het bedrag voor de heffing voor de vennootschapsbelasting, en
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel8
  - number: 8.1.e
    text: het bedrag voor onvoorzien.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel8
  - number: '8.2'
    text: Een programma is een samenhangend geheel van activiteiten.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel8
  - number: '8.3'
    text: 'Het programmaplan bevat per programma:'
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel8
  - number: 8.3.a
    text: |-
      de doelstelling, in het bijzonder de beoogde maatschappelijke effecten, ten minste toegelicht aan de hand van de
      bij ministeriële regeling vast te stellen beleidsindicatoren;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel8
  - number: 8.3.b
    text: |-
      de wijze waarop ernaar gestreefd zal worden die effecten te bereiken, en de betrokkenheid hierbij van verbonden
      partijen;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel8
  - number: 8.3.c
    text: de raming van baten en lasten.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel8
  - number: '8.4'
    text: |-
      De provincie onderscheidenlijk gemeente kan de baten en lasten per programma verdelen in de onderdelen baten en
      lasten voor prioriteiten en voor overig.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel8
  - number: '8.5'
    text: 'Het overzicht algemene dekkingsmiddelen bevat ten minste:'
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel8
  - number: 8.5.a
    text: lokale heffingen, waarvan de besteding niet gebonden is;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel8
  - number: 8.5.b
    text: algemene uitkeringen;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel8
  - number: 8.5.c
    text: dividend;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel8
  - number: 8.5.d
    text: saldo van de financieringsfunctie;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel8
  - number: 8.5.e
    text: overige algemene dekkingsmiddelen.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel8
  - number: '8.6'
    text: Het bedrag voor onvoorzien wordt geraamd voor de begroting in zijn geheel of per programma.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel8
  - number: '9.1'
    text: |-
      In de begroting worden in afzonderlijke paragrafen de beleidslijnen vastgelegd met betrekking tot relevante
      beheersmatige aspecten, alsmede tot de lokale heffingen.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel9
  - number: '9.2'
    text: |-
      De begroting bevat ten minste de volgende paragrafen, tenzij het desbetreffende aspect bij de provincie
      onderscheidenlijk gemeente niet aan de orde is:
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel9
  - number: 9.2.a
    text: lokale heffingen;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel9
  - number: 9.2.b
    text: weerstandsvermogen en risicobeheersing;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel9
  - number: 9.2.c
    text: onderhoud kapitaalgoederen;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel9
  - number: 9.2.d
    text: financiering;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel9
  - number: 9.2.e
    text: bedrijfsvoering;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel9
  - number: 9.2.f
    text: verbonden partijen;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel9
  - number: 9.2.g
    text: grondbeleid.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel9
  - number: '10'
    text: 'De paragraaf betreffende de lokale heffingen bevat ten minste:'
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel10
  - number: 10.a
    text: de geraamde inkomsten;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel10
  - number: 10.b
    text: het beleid ten aanzien van de lokale heffingen;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel10
  - number: 10.c
    text: |-
      een overzicht op hoofdlijnen van de diverse heffingen, waarin inzichtelijk wordt gemaakt hoe bij de berekening
      van tarieven van heffingen, die hoogstens kostendekkend mogen zijn, wordt bewerkstelligd dat de geraamde baten de
      ter zake geraamde lasten niet overschrijden, wat de beleidsuitgangspunten zijn die ten grondslag liggen aan deze
      berekeningen en hoe deze uitgangspunten bij de tariefstelling worden gehanteerd;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel10
  - number: 10.d
    text: een aanduiding van de lokale lastendruk;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel10
  - number: 10.e
    text: een beschrijving van het kwijtscheldingsbeleid.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel10
  - number: '11.1'
    text: 'Het weerstandsvermogen bestaat uit de relatie tussen:'
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel11
  - number: 11.1.a
    text: |-
      de weerstandscapaciteit, zijnde de middelen en mogelijkheden waarover de provincie onderscheidenlijk gemeente
      beschikt of kan beschikken om niet begrote kosten te dekken;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel11
  - number: 11.1.b
    text: |-
      alle risico's waarvoor geen maatregelen zijn getroffen en die van materiële betekenis kunnen zijn in relatie tot de
      financiële positie.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel11
  - number: '11.2'
    text: 'De paragraaf betreffende het weerstandsvermogen en risicobeheersing bevat ten minste:'
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel11
  - number: 11.2.a
    text: een inventarisatie van de weerstandscapaciteit;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel11
  - number: 11.2.b
    text: een inventarisatie van de risico's;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel11
  - number: 11.2.c
    text: het beleid omtrent de weerstandscapaciteit en de risico's;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel11
  - number: 11.2.d
    text: 'een kengetal voor de:'
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel11
  - number: 11.2.d.1a°
    text: netto schuldquote;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel11
  - number: 11.2.d.1b°
    text: netto schuldquote gecorrigeerd voor alle verstrekte leningen;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel11
  - number: 11.2.d.2°
    text: solvabiliteitsratio;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel11
  - number: 11.2.d.3°
    text: grondexploitatie;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel11
  - number: 11.2.d.4°
    text: structurele exploitatieruimte; en
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel11
  - number: 11.2.d.5°
    text: belastingcapaciteit.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel11
  - number: 11.2.e
    text: een beoordeling van de onderlinge verhouding tussen de kengetallen in relatie tot de financiële positie.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel11
  - number: '11.3'
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld over de wijze waarop de kengetallen, genoemd in het tweede
      lid, onderdeel d, door provincies en gemeenten worden vastgesteld en in de begroting en het jaarverslag worden
      opgenomen.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel11
  - number: '12.1'
    text: 'De paragraaf betreffende het onderhoud van kapitaalgoederen bevat ten minste de volgende kapitaalgoederen:'
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel12
  - number: 12.1.a
    text: wegen;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel12
  - number: 12.1.b
    text: riolering;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel12
  - number: 12.1.c
    text: water;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel12
  - number: 12.1.d
    text: groen;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel12
  - number: 12.1.e
    text: gebouwen.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel12
  - number: '12.2'
    text: 'Van de kapitaalgoederen, bedoeld in het eerste lid, wordt aangegeven:'
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel12
  - number: 12.2.a
    text: het beleidskader;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel12
  - number: 12.2.b
    text: de uit het beleidskader voortvloeiende financiële consequenties;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel12
  - number: 12.2.c
    text: de vertaling van de financiële consequenties in de begroting.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel12
  - number: '13'
    text: |-
      De paragraaf betreffende de financiering bevat in ieder geval de beleidsvoornemens ten aanzien van het risicobeheer
      van de financieringsportefeuille en geeft inzicht in de rentelasten, het renteresultaat, de wijze waarop rente aan
      investeringen, grondexploitaties en taakvelden wordt toegerekend en de financieringsbehoefte.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel13
  - number: '14'
    text: |-
      De paragraaf betreffende de bedrijfsvoering geeft ten minste inzicht in de stand van zaken en de beleidsvoornemens
      ten aanzien van de bedrijfsvoering.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel14
  - number: '15.1'
    text: 'De paragraaf betreffende de verbonden partijen bevat ten minste:'
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel15
  - number: 15.1.a
    text: de visie op en de beleidsvoornemens omtrent verbonden partijen;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel15
  - number: 15.1.b
    text: 'de lijst van verbonden partijen, die wordt onderverdeeld in:'
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel15
  - number: 15.1.b.1°
    text: gemeenschappelijke regelingen;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel15
  - number: 15.1.b.2°
    text: vennootschappen en coöperaties;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel15
  - number: 15.1.b.3°
    text: stichtingen en verenigingen, en,
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel15
  - number: 15.1.b.4°
    text: overige verbonden partijen;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel15
  - number: 15.1.c
    text: de lijst van verbonden partijen.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel15
  - number: '15.2'
    text: 'In de lijst van verbonden partijen wordt ten minste de volgende informatie opgenomen:'
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel15
  - number: 15.2.a
    text: |-
      de wijze waarop de provincie onderscheidenlijk de gemeente een belang heeft in de verbonden partij en het openbaar
      belang dat ermee gediend wordt;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel15
  - number: 15.2.b
    text: |-
      het belang dat de provincie onderscheidenlijk de gemeente in de verbonden partij heeft aan het begin en de
      verwachte omvang aan het einde van het begrotingsjaar;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel15
  - number: 15.2.c
    text: |-
      de verwachte omvang van het eigen vermogen en het vreemd vermogen van de verbonden partij aan het begin en aan het
      einde van het begrotingsjaar;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel15
  - number: 15.2.d
    text: de verwachte omvang van het financiële resultaat van de verbonden partij in het begrotingsjaar;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel15
  - number: 15.2.e
    text: |-
      de eventuele risico’s, als bedoeld in [artikel 11, eerste lid, onderdeel b][ref1], van de verbonden partij voor de
      financiële positie van de provincie onderscheidenlijk gemeente.


      [ref1]: https://wetten.overheid.nl/BWBR0014606#Artikel11
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0014606
        artikel: '11'
        hoofdstuk: II
  - number: '16'
    text: 'De paragraaf betreffende het grondbeleid bevat ten minste:'
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel16
  - number: 16.a
    text: |-
      een visie op het grondbeleid in relatie tot de realisatie van de doelstellingen van de programma's die zijn
      opgenomen in de begroting;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel16
  - number: 16.b
    text: een aanduiding van de wijze waarop de provincie onderscheidenlijk gemeente het grondbeleid uitvoert;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel16
  - number: 16.c
    text: een actuele prognose van de te verwachten resultaten van de totale grondexploitatie;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel16
  - number: 16.d
    text: een onderbouwing van de geraamde winstneming;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel16
  - number: 16.e
    text: de beleidsuitgangspunten omtrent de reserves voor grondzaken in relatie tot de risico's van de grondzaken.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel16
  - number: '17'
    text: 'Het overzicht van baten en lasten in de begroting bevat:'
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel17
  - number: 17.a
    text: |-
      per programma, of per programmaonderdeel als bedoeld in artikel 8, vierde lid, de raming van de baten en lasten en
      het saldo;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel17
  - number: 17.b
    text: |-
      het overzicht van de geraamde algemene dekkingsmiddelen, de geraamde kosten van de overhead, het geraamde bedrag
      van de heffing voor de vennootschapsbelasting en het geraamde bedrag voor onvoorzien;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel17
  - number: 17.c
    text: het geraamde totaal saldo van baten en lasten, volgend uit de onderdelen a en b;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel17
  - number: 17.d
    text: de beoogde toevoegingen en onttrekkingen aan reserves per programma;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel17
  - number: 17.e
    text: het geraamde resultaat, volgend uit de onderdelen c en d.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel17
  - number: '18'
    text: |-
      In de besluiten tot wijziging van de begroting wordt per programma en, indien aanwezig, per programmaonderdeel, de
      mutatie en het nieuwe geraamde bedrag vastgesteld.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel18
  - number: '19'
    text: 'De toelichting op het overzicht van baten en lasten bevat ten minste:'
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel19
  - number: 19.a
    text: |-
      het gerealiseerde bedrag van het voorvorig begrotingsjaar, het geraamde bedrag van het vorig begrotingsjaar na
      wijziging en het geraamde bedrag van het begrotingsjaar;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel19
  - number: 19.b
    text: |-
      de gronden waarop de ramingen zijn gebaseerd en, in geval van aanmerkelijk verschil met de raming, respectievelijk
      de realisatie, van het vorig, respectievelijk voorvorig, begrotingsjaar de oorzaken van het verschil;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel19
  - number: 19.c
    text: |-
      een overzicht van de geraamde incidentele baten en lasten per programma, waarbij per programma ten minste de
      belangrijkste posten afzonderlijk worden gespecificeerd en de overige posten als een totaalbedrag kunnen worden
      opgenomen;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel19
  - number: 19.d
    text: een overzicht van de beoogde structurele toevoegingen en onttrekkingen aan de reserves.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel19
  - number: '20.1'
    text: 'De uiteenzetting van de financiële positie bevat:'
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel20
  - number: 20.1.a
    text: |-
      een raming voor het begrotingsjaar van de financiële gevolgen van het bestaande en nieuw beleid dat in de
      programma’s is opgenomen;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel20
  - number: 20.1.b
    text: |-
      een geprognosticeerde begin- en eindbalans van het begrotingsjaar, die ten minste de posten bevat om het EMU-saldo
      te kunnen berekenen, en
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel20
  - number: 20.1.c
    text: |-
      het EMU-saldo over het vorig begrotingsjaar en de berekening van het geraamde bedrag over het begrotingsjaar
      alsmede het jaar volgend op het begrotingsjaar.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel20
  - number: '20.2'
    text: 'Afzonderlijke aandacht wordt ten minste besteed aan:'
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel20
  - number: 20.2.a
    text: de jaarlijks terugkerende arbeidskosten gerelateerde verplichtingen van vergelijkbaar volume;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel20
  - number: 20.2.b
    text: |-
      de investeringen; onderscheiden in investeringen met een economisch nut en investeringen in de openbare ruimte met
      een maatschappelijk nut;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel20
  - number: 20.2.c
    text: de financiering;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel20
  - number: 20.2.d
    text: de stand en het gespecificeerde verloop van de reserves;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel20
  - number: 20.2.e
    text: de stand en het gespecificeerde verloop van de voorzieningen.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel20
  - number: '21'
    text: |-
      De toelichting op de uiteenzetting van de financiële positie bevat ten minste de gronden waarop de ramingen
      zijn gebaseerd en de motivering daarvan en een toelichting op belangrijke ontwikkelingen ten opzichte van de
      uiteenzetting van de financiële positie van het vorig begrotingsjaar.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel21
  - number: '22.1'
    text: |-
      De meerjarenraming bevat voor de drie jaren volgend op het begrotingsjaar een geprognosticeerde begin- en
      eindbalans en een raming van de financiële gevolgen, waaronder de baten en de lasten van het bestaande en het
      nieuwe beleid dat in de programma's is opgenomen.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel22
  - number: '22.2'
    text: |-
      [Artikel 20, tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014606#Artikel20
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0014606
        artikel: '20'
        hoofdstuk: II
  - number: '23'
    text: 'De toelichting op de meerjarenraming bevat ten minste:'
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel23
  - number: 23.a
    text: |-
      de gronden waarop de ramingen zijn gebaseerd en de motivering daarvan, en een toelichting op belangrijke
      ontwikkelingen ten opzichte van de meerjarenraming van het vorig begrotingsjaar;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel23
  - number: 23.b
    text: |-
      een overzicht per jaar van de geraamde incidentele baten en lasten per programma, waarbij per programma ten minste
      de belangrijkste posten afzonderlijk worden gespecificeerd en de overige posten als een totaalbedrag kunnen worden
      opgenomen;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel23
  - number: 23.c
    text: een overzicht per jaar van de beoogde structurele toevoegingen en onttrekkingen aan de reserves;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel23
  - number: 23.d
    text: de ontwikkeling van het EMU-saldo voor de drie jaren volgend op het begrotingsjaar.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel23
  - number: '24.1'
    text: 'De jaarstukken bestaan ten minste uit:'
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel24
  - number: 24.1.a
    text: het jaarverslag;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel24
  - number: 24.1.b
    text: de jaarrekening.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel24
  - number: '24.2'
    text: 'Het jaarverslag bestaat ten minste uit:'
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel24
  - number: 24.2.a
    text: de programmaverantwoording;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel24
  - number: 24.2.b
    text: de paragrafen.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel24
  - number: '24.3'
    text: 'De jaarrekening bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel24
  - number: 24.3.a
    text: het overzicht van baten en lasten in de jaarrekening en de toelichting;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel24
  - number: 24.3.b
    text: de balans en de toelichting;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel24
  - number: 24.3.c
    text: de bijlage met de verantwoordingsinformatie over specifieke uitkeringen;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel24
  - number: 24.3.d
    text: een bijlage met het overzicht van de gerealiseerde baten en lasten per taakveld.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel24
  - number: '25.1'
    text: 'De programmaverantwoording bestaat ten minste uit:'
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel25
  - number: 25.1.a
    text: |-
      de verantwoording over de realisatie van de programma's en de overzichten van de algemene dekkingsmiddelen en de
      kosten van overhead;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel25
  - number: 25.1.b
    text: het bedrag voor de heffing voor de vennootschapsbelasting, en
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel25
  - number: 25.1.c
    text: geeft daarnaast inzicht in het gebruik van het geraamde bedrag voor onvoorzien.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel25
  - number: '25.2'
    text: 'De programmaverantwoording biedt per programma inzicht in:'
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel25
  - number: 25.2.a
    text: |-
      de mate waarin de doelstellingen zijn gerealiseerd ten minste toegelicht aan de hand van de bij ministeriële
      regeling vast te stellen beleidsindicatoren;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel25
  - number: 25.2.b
    text: de wijze waarop getracht is de beoogde maatschappelijke effecten te bereiken;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel25
  - number: 25.2.c
    text: de gerealiseerde baten en lasten.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel25
  - number: '26'
    text: |-
      Het jaarverslag bevat de paragrafen die ingevolge [artikel 9][ref1] in de begroting zijn opgenomen. Ze bevatten de
      verantwoording van hetgeen in de overeenkomstige paragrafen in de begroting is opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0014606#Artikel9
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0014606
        artikel: '9'
        hoofdstuk: II
  - number: '27.1'
    text: 'Het overzicht van baten en lasten in de jaarrekening bevat:'
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel27
  - number: 27.1.a
    text: |-
      per programma, of per programmaonderdeel als bedoeld in [artikel 8, vierde lid][ref1], de gerealiseerde baten en
      lasten en het saldo daarvan;


      [ref1]: https://wetten.overheid.nl/BWBR0014606#Artikel8
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0014606
        artikel: '8'
        hoofdstuk: II
  - number: 27.1.b
    text: |-
      het overzicht van de gerealiseerde algemene dekkingsmiddelen, de gerealiseerde kosten van de overhead en het bedrag
      van de heffing voor de vennootschapsbelasting;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel27
  - number: 27.1.c
    text: het gerealiseerde totaal saldo van baten en lasten, volgend uit de onderdelen a en b;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel27
  - number: 27.1.d
    text: de werkelijke toevoegingen en onttrekkingen aan reserves;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel27
  - number: 27.1.e
    text: het gerealiseerde resultaat, volgend uit de onderdelen c en d.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel27
  - number: '27.2'
    text: |-
      Het overzicht van baten en lasten in de jaarrekening bevat van de onderdelen genoemd in het eerste lid ook de
      ramingen uit de begroting voor en na wijziging.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel27
  - number: '28'
    text: 'De toelichting op het overzicht van baten en lasten in de jaarrekening bevat ten minste:'
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel28
  - number: 28.a
    text: |-
      voor alle onderdelen van [artikel 27, eerste lid][ref1], een analyse van de afwijkingen tussen de begroting na
      wijziging en de jaarstukken;


      [ref1]: https://wetten.overheid.nl/BWBR0014606#Artikel27
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0014606
        artikel: '27'
        hoofdstuk: IV
  - number: 28.b
    text: een overzicht van de aanwending van het bedrag voor onvoorzien;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel28
  - number: 28.c
    text: |-
      een overzicht van de incidentele baten en lasten per programma, waarbij per programma ten minste de belangrijkste
      posten afzonderlijk worden gespecificeerd en de overige posten als een totaalbedrag kunnen worden opgenomen;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel28
  - number: 28.d
    text: een overzicht van de structurele toevoegingen en onttrekkingen aan de reserves;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel28
  - number: 28.e
    text: |-
      de informatie, bedoeld in de [artikelen 4.1, eerste en tweede lid][ref1], en
      __REF001___________________________________________________________________________________________________________
      _________.


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0032249#Artikel4
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0032249
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0032249
        artikel: '4'
  - number: '29'
    text: |-
      Het overzicht van baten en lasten in de jaarrekening wordt vastgesteld met inachtneming van hetgeen omtrent de
      financiële positie op de balansdatum is gebleken tussen het moment van opmaken van de jaarstukken en het tijdstip
      van vaststelling daarvan, voor zover deze aanvullende informatie onontbeerlijk is voor het in [artikel 3][ref1]
      bedoelde inzicht.


      [ref1]: https://wetten.overheid.nl/BWBR0014606#Artikel3
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0014606
        artikel: '3'
        hoofdstuk: I
  - number: '30'
    text: |-
      In de balans worden naast de cijfers per balansdatum tevens de cijfers van de balans van het vorige begrotingsjaar
      opgenomen.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel30
  - number: '31'
    text: |-
      Op de balans worden de activa onderscheiden in vaste en vlottende activa, al naar gelang zij zijn bestemd om de
      uitoefening van de werkzaamheid van de provincie onderscheidenlijk gemeente al dan niet duurzaam te dienen.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel31
  - number: '32'
    text: Op de balans worden de passiva onderscheiden in vaste en vlottende passiva.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel32
  - number: '33'
    text: Onder de vaste activa worden afzonderlijk opgenomen de immateriële, de materiële en de financiële vaste activa.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel33
  - number: '34'
    text: 'In de balans worden onder de immateriële vaste activa afzonderlijk opgenomen:'
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel34
  - number: 34.a
    text: kosten verbonden aan het sluiten van geldleningen en het saldo van agio en disagio;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel34
  - number: 34.b
    text: kosten van onderzoek en ontwikkeling voor een bepaald actief;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel34
  - number: 34.c
    text: bijdragen aan activa in eigendom van derden.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel34
  - number: '35.1'
    text: 'In de balans worden onder de materiële vaste activa afzonderlijk opgenomen:'
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel35
  - number: 35.1.a
    text: investeringen met een economisch nut;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel35
  - number: 35.1.b
    text: investeringen met een economisch nut, waarvoor ter bestrijding van de kosten een heffing kan worden geheven;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel35
  - number: 35.1.c
    text: investeringen in de openbare ruimte met een maatschappelijk nut.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel35
  - number: '35.2'
    text: Van de materiële vaste activa wordt aangegeven welke in erfpacht zijn uitgegeven.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel35
  - number: '36'
    text: 'In de balans worden onder de financiële vaste activa afzonderlijk opgenomen:'
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel36
  - number: 36.a
    text: 'kapitaalverstrekkingen aan:'
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel36
  - number: 36.a.1
    text: deelnemingen;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel36
  - number: 36.a.2
    text: gemeenschappelijke regelingen;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel36
  - number: 36.a.3
    text: overige verbonden partijen;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel36
  - number: 36.b
    text: 'leningen aan:'
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel36
  - number: 36.b.1
    text: |-
      openbare lichamen als bedoeld in [artikel 1, onderdeel a, van de Wet financiering decentrale overheden][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011987#Artikel1
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0011987
        artikel: '1'
  - number: 36.b.2
    text: woningbouwcorporaties;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel36
  - number: 36.b.3
    text: deelnemingen;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel36
  - number: 36.b.4
    text: overige verbonden partijen;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel36
  - number: 36.c
    text: overige langlopende leningen;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel36
  - number: 36.d
    text: uitzettingen in ’s Rijks schatkist met een rentetypische looptijd van één jaar of langer;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel36
  - number: 36.e
    text: uitzettingen in de vorm van Nederlands schuldpapier met een rentetypische looptijd van één jaar of langer;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel36
  - number: 36.f
    text: overige uitzettingen met een rentetypische looptijd van één jaar of langer.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel36
  - number: '37'
    text: |-
      Onder de vlottende activa worden afzonderlijk opgenomen de voorraden, de uitzettingen met een rentetypische
      looptijd korter dan één jaar, de liquide middelen en de overlopende activa.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel37
  - number: '38'
    text: 'In de balans worden onder de voorraden afzonderlijk opgenomen:'
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel38
  - number: 38.a
    text: grond- en hulpstoffen;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel38
  - number: 38.b
    text: onderhanden werk, waaronder bouwgronden in exploitatie;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel38
  - number: 38.c
    text: gereed product en handelsgoederen;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel38
  - number: 38.d
    text: vooruitbetalingen.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel38
  - number: '39'
    text: |-
      In de balans worden onder de uitzettingen met een rentetypische looptijd korter dan één jaar afzonderlijk
      opgenomen:
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel39
  - number: 39.a
    text: vorderingen op openbare lichamen;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel39
  - number: 39.b
    text: |-
      verstrekte kasgeldleningen aan openbare lichamen als bedoeld in
      [artikel 1, onderdeel a, van de Wet financiering decentrale overheden][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011987#Artikel1
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0011987
        artikel: '1'
  - number: 39.c
    text: overige verstrekte kasgeldleningen;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel39
  - number: 39.d
    text: uitzettingen in ’s Rijks schatkist met een rentetypische looptijd korter dan één jaar;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel39
  - number: 39.e
    text: rekening-courantverhouding met het Rijk;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel39
  - number: 39.f
    text: rekening-courantverhoudingen met niet-financiële instellingen;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel39
  - number: 39.g
    text: uitzettingen in de vorm van Nederlands schuldpapier met een rentetypische looptijd korter dan één jaar;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel39
  - number: 39.h
    text: overige vorderingen;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel39
  - number: 39.i
    text: overige uitzettingen.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel39
  - number: '40'
    text: In de balans worden onder de liquide middelen de kas- en banksaldi opgenomen.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel40
  - number: 40a.1
    text: 'In de balans worden onder de overlopende activa afzonderlijk opgenomen:'
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel40a
  - number: 40a.1.a
    text: |-
      de van Europese en Nederlandse overheidslichamen nog te ontvangen voorschotbedragen die ontstaan door
      voorfinanciering op uitkeringen met een specifiek bestedingsdoel;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel40a
  - number: 40a.1.b
    text: overige nog te ontvangen bedragen en de vooruitbetaalde bedragen die ten laste van volgende begrotingsjaren komen.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel40a
  - number: 40a.2
    text: 'De voorschotten, bedoeld in het eerste lid, onderdeel a, worden uitgesplitst naar de nog te ontvangen bedragen van:'
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel40a
  - number: 40a.2.1°
    text: Europese overheidslichamen;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel40a
  - number: 40a.2.2°
    text: het Rijk, en
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel40a
  - number: 40a.2.3°
    text: overige Nederlandse overheidslichamen.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel40a
  - number: 40b
    text: |-
      Aan de actiefzijde van de balans wordt buiten de balanstelling het bedrag opgenomen waarvan het recht bestaat op
      verliescompensatie krachtens de [Wet op de vennootschapsbelasting 1969][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002672
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel40b
    references:
      - id: ref1
        bwb_id: BWBR0002672
  - number: '41'
    text: |-
      Onder de vaste passiva worden afzonderlijk opgenomen het eigen vermogen, de voorzieningen en de vaste schulden, met
      een rentetypische looptijd van één jaar of langer.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel41
  - number: '42.1'
    text: |-
      Het eigen vermogen bestaat uit de reserves en het gerealiseerde resultaat volgend uit het overzicht van baten en
      lasten in de jaarrekening.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel42
  - number: '42.2'
    text: Het in het eerste lid bedoelde resultaat wordt afzonderlijk opgenomen als onderdeel van het eigen vermogen.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel42
  - number: '43.1'
    text: 'In de balans worden de reserves onderscheiden naar:'
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel43
  - number: 43.1.a
    text: de algemene reserve;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel43
  - number: 43.1.b
    text: de bestemmingsreserves.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel43
  - number: '43.2'
    text: |-
      Een bestemmingsreserve is een reserve waaraan provinciale staten respectievelijk de raad een bepaalde bestemming
      heeft gegeven.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel43
  - number: '44.1'
    text: 'Voorzieningen worden gevormd wegens:'
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel44
  - number: 44.1.a
    text: verplichtingen en verliezen waarvan de omvang op de balansdatum onzeker is, doch redelijkerwijs te schatten;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel44
  - number: 44.1.b
    text: |-
      op de balansdatum bestaande risico's ter zake van bepaalde te verwachten verplichtingen of verliezen waarvan de
      omvang redelijkerwijs is te schatten;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel44
  - number: 44.1.c
    text: |-
      kosten die in een volgend begrotingsjaar zullen worden gemaakt, mits het maken van die kosten zijn oorsprong
      mede vindt in het begrotingsjaar of in een voorafgaand begrotingsjaar en de voorziening strekt tot gelijkmatige
      verdeling van lasten over een aantal begrotingsjaren;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel44
  - number: 44.1.d
    text: |-
      de bijdragen aan toekomstige vervangingsinvesteringen, waarvoor een heffing wordt geheven als bedoeld in
      [artikel 35, eerste lid, onder b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014606#Artikel35
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0014606
        artikel: '35'
        hoofdstuk: IV
        paragraaf: 4.5.3
  - number: '44.2'
    text: |-
      Tot de voorzieningen worden ook gerekend van derden verkregen middelen die specifiek besteed moeten worden, met
      uitzondering van de voorschotbedragen, bedoeld in [artikel 49, onderdeel b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014606#Artikel49
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0014606
        artikel: '49'
        hoofdstuk: IV
        paragraaf: 4.5.6
  - number: '44.3'
    text: |-
      Voorzieningen worden niet gevormd voor jaarlijks terugkerende arbeidskosten gerelateerde verplichtingen van
      vergelijkbaar volume.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel44
  - number: '45'
    text: Rentetoevoegingen aan voorzieningen zijn niet toegestaan.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel45
  - number: '46'
    text: 'In de balans worden onder de vaste schulden afzonderlijk opgenomen:'
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel46
  - number: 46.a
    text: obligatieleningen;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel46
  - number: 46.b
    text: 'onderhandse leningen van:'
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel46
  - number: 46.b.1
    text: binnenlandse pensioenfondsen en verzekeringsinstellingen;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel46
  - number: 46.b.2
    text: binnenlandse banken en overige financiële instellingen;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel46
  - number: 46.b.3
    text: binnenlandse bedrijven;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel46
  - number: 46.b.4
    text: |-
      openbare lichamen als bedoeld in [artikel 1, onderdeel a, van de Wet financiering decentrale overheden][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011987#Artikel1
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0011987
        artikel: '1'
  - number: 46.b.5
    text: overige binnenlandse sectoren;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel46
  - number: 46.b.6
    text: buitenlandse instellingen, fondsen, banken, bedrijven en overige sectoren;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel46
  - number: 46.c
    text: door derden belegde gelden;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel46
  - number: 46.d
    text: waarborgsommen;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel46
  - number: 46.e
    text: vooruitontvangen bedragen met een rentetypische looptijd van één jaar of langer.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel46
  - number: '47'
    text: |-
      Onder de vlottende passiva worden afzonderlijk opgenomen de netto-vlottende schulden, met een rentetypische
      looptijd korter dan één jaar en de overlopende passiva.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel47
  - number: '48'
    text: 'In de balans worden onder de netto-vlottende schulden afzonderlijk opgenomen:'
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel48
  - number: 48.a
    text: |-
      kasgeldleningen aangegaan bij openbare lichamen als bedoeld in
      [artikel 1, onderdeel a, van de Wet financiering decentrale overheden][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011987#Artikel1
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0011987
        artikel: '1'
  - number: 48.b
    text: overige kasgeldleningen;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel48
  - number: 48.c
    text: banksaldi;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel48
  - number: 48.d
    text: overige schulden.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel48
  - number: '49.1'
    text: 'In de balans worden onder de overlopende passiva afzonderlijk opgenomen:'
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel49
  - number: 49.1.a
    text: |-
      verplichtingen die in het begrotingsjaar zijn opgebouwd en die in een volgend begrotingsjaar tot betaling komen,
      met uitzondering van jaarlijks terugkerende arbeidskosten gerelateerde verplichtingen van vergelijkbaar volume;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel49
  - number: 49.1.b
    text: |-
      de van de Europese en Nederlandse overheidslichamen ontvangen voorschotbedragen voor uitkeringen met een specifiek
      bestedingsdoel die dienen ter dekking van lasten van volgende begrotingsjaren;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel49
  - number: 49.1.c
    text: overige vooruit ontvangen bedragen die ten bate van het volgende begrotingsjaar komen.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel49
  - number: '49.2'
    text: De voorschotten, bedoeld in het eerste lid, onderdeel b, worden uitgesplitst naar de ontvangen bedragen van;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel49
  - number: 49.2.1°
    text: Europese overheidslichamen;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel49
  - number: 49.2.2°
    text: het Rijk, en
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel49
  - number: 49.2.3°
    text: overige Nederlandse overheidslichamen.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel49
  - number: '50'
    text: |-
      Aan de passiefzijde van de balans wordt buiten de balanstelling opgenomen het bedrag waartoe aan natuurlijke en
      rechtspersonen borgstellingen of garantstellingen zijn verstrekt.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel50
  - number: '51'
    text: In de toelichting op de balans wordt aangegeven volgens welke methoden de afschrijvingen worden berekend.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel51
  - number: '52.1'
    text: 'In de toelichting op de balans worden onder de materiële vaste activa afzonderlijk opgenomen:'
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel52
  - number: 52.1.a
    text: gronden en terreinen;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel52
  - number: 52.1.b
    text: woonruimten;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel52
  - number: 52.1.c
    text: bedrijfsgebouwen;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel52
  - number: 52.1.d
    text: grond-, weg- en waterbouwkundige werken;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel52
  - number: 52.1.e
    text: vervoermiddelen;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel52
  - number: 52.1.f
    text: machines, apparaten en installaties;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel52
  - number: 52.1.g
    text: overige materiële vaste activa.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel52
  - number: '52.2'
    text: |-
      In de toelichting op de balans wordt het verloop van de activa, als bedoeld in het eerste lid, gedurende het
      begrotingsjaar, in een sluitend overzicht weergegeven. Daaruit blijken, voor zover van toepassing:
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel52
  - number: 52.2.a
    text: de boekwaarde aan het begin van het begrotingsjaar;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel52
  - number: 52.2.b
    text: de investeringen of desinvesteringen;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel52
  - number: 52.2.c
    text: de afschrijvingen;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel52
  - number: 52.2.d
    text: bijdragen van derden direct gerelateerd aan een actief;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel52
  - number: 52.2.e
    text: afwaarderingen wegens duurzame waardeverminderingen;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel52
  - number: 52.2.f
    text: de boekwaarde aan het einde van het begrotingsjaar.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel52
  - number: 52a.1
    text: |-
      In de toelichting op de balans wordt per uitkering met een specifiek bestedingsdoel het verloop gedurende het
      jaar van de ontvangen voorschotbedragen, bedoeld in [artikel 49, onderdeel b][ref1], in een overzicht weergegeven.
      Daaruit blijken:


      [ref1]: https://wetten.overheid.nl/BWBR0014606#Artikel49
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel52a
    references:
      - id: ref1
        bwb_id: BWBR0014606
        artikel: '49'
        hoofdstuk: IV
        paragraaf: 4.5.6
  - number: 52a.1.a
    text: het saldo aan het begin van het begrotingsjaar;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel52a
  - number: 52a.1.b
    text: de ontvangen bedragen;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel52a
  - number: 52a.1.c
    text: de vrijgevallen bedragen of de terugbetalingen;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel52a
  - number: 52a.1.d
    text: het saldo aan het einde van het begrotingsjaar.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel52a
  - number: 52a.2
    text: |-
      In de toelichting op de balans wordt per uitkering met een specifiek bestedingsdoel het verloop gedurende het
      jaar van de nog te ontvangen voorschotbedragen, bedoeld in [artikel 40a, onderdeel a][ref1], in een overzicht
      weergegeven. Daaruit blijken:


      [ref1]: https://wetten.overheid.nl/BWBR0014606#Artikel40a
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel52a
    references:
      - id: ref1
        bwb_id: BWBR0014606
        artikel: 40a
        hoofdstuk: IV
        paragraaf: 4.5.4
  - number: 52a.2.a
    text: het saldo aan het begin van het begrotingsjaar;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel52a
  - number: 52a.2.b
    text: de toevoegingen;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel52a
  - number: 52a.2.c
    text: de ontvangen bedragen;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel52a
  - number: 52a.2.d
    text: het saldo aan het einde van het begrotingsjaar.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel52a
  - number: 52b
    text: |-
      De aard en omvang van de aangebrachte dan wel geraamde waardeverminderingen van de leningen en vorderingen,
      bedoeld in [artikel 63, achtste lid][ref1], van de vaste activa, bedoeld in [artikel 65, eerste lid][ref2], en
      van de deelnemingen en voorraden, bedoeld in [artikel 65, tweede lid][ref3], worden in de toelichting op de balans
      opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0014606#Artikel63
      [ref2]: https://wetten.overheid.nl/BWBR0014606#Artikel65
      [ref3]: https://wetten.overheid.nl/BWBR0014606#Artikel65
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel52b
    references:
      - id: ref1
        bwb_id: BWBR0014606
        artikel: '63'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0014606
        artikel: '65'
        hoofdstuk: V
      - id: ref3
        bwb_id: BWBR0014606
        artikel: '65'
        hoofdstuk: V
  - number: 52c
    text: 'In de toelichting op de balans wordt vermeld:'
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel52c
  - number: 52c.a
    text: het drempelbedrag voor het begrotingsjaar waarover verantwoording wordt afgelegd; en
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel52c
  - number: 52c.b
    text: |-
      voor ieder kwartaal van dat jaar, het bedrag aan middelen, bedoeld in
      [artikel 2, vierde lid, van de Wet financiering decentrale overheden][ref1], dat in het kader van het drempelbedrag
      door de provincie onderscheidenlijk de gemeente buiten ’s Rijks schatkist is aangehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0011987#Artikel2
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel52c
    references:
      - id: ref1
        bwb_id: BWBR0011987
        artikel: '2'
  - number: 52d.1
    text: |-
      In de toelichting op de balans wordt ten aanzien van de bouwgronden in exploitatie voor het totaal van de in
      exploitatie zijnde complexen aangegeven:
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel52d
  - number: 52d.1.a
    text: de boekwaarde aan het begin van het begrotingsjaar;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel52d
  - number: 52d.1.b
    text: de vermeerderingen en verminderingen in het begrotingsjaar;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel52d
  - number: 52d.1.c
    text: de boekwaarde aan het einde van het begrotingsjaar;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel52d
  - number: 52d.1.d
    text: de geraamde nog te maken kosten met een onderbouwing;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel52d
  - number: 52d.1.e
    text: de geraamde opbrengsten met een onderbouwing;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel52d
  - number: 52d.1.f
    text: |-
      het geraamde eindresultaat en de berekeningswijze die hiervoor is gehanteerd met een onderbouwing en de aannames
      die eraan ten grondslag liggen.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel52d
  - number: 52d.2
    text: De gegevens, bedoeld in het eerste lid, zijn gebaseerd op een waardering per complex.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel52d
  - number: '53'
    text: In de toelichting op de balans wordt vermeld;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel53
  - number: 53.a
    text: |-
      de niet in de balans opgenomen belangrijke financiële verplichtingen waaraan de provincie of de gemeente voor
      toekomstige jaren is verbonden, en
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel53
  - number: 53.b
    text: 'indien de provincie of de gemeente financiële derivaten hanteert, per derivaat:'
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel53
  - number: 53.b.1°
    text: de naam en rating van de financiële onderneming waarbij het derivaat is afgesloten;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel53
  - number: 53.b.2°
    text: |-
      het type en de belangrijkste kenmerken van het derivaat en de hoogte en de looptijd van de financieringsbehoefte
      waaraan het derivaat kan worden toegerekend, en
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel53
  - number: 53.b.3°
    text: |-
      in het geval van een niet-effectieve positie, als bedoeld in [artikel 1, eerste lid, onderdeel k][ref1], in welk
      opzicht daarvan sprake is, de maatregelen die zijn genomen om die positie ongedaan te maken en de termijn die
      daarvoor naar verwachting nodig is.


      [ref1]: https://wetten.overheid.nl/BWBR0014606#Artikel1
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0014606
        artikel: '1'
        hoofdstuk: I
  - number: '54.1'
    text: |-
      In de toelichting op de balans worden de aard en reden van elke reserve en de toevoegingen en onttrekkingen daaraan
      toegelicht.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel54
  - number: '54.2'
    text: 'Per reserve wordt het verloop gedurende het jaar in een overzicht weergegeven. Daaruit blijken:'
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel54
  - number: 54.2.a
    text: het saldo aan het begin van het begrotingsjaar;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel54
  - number: 54.2.b
    text: de toevoegingen of onttrekkingen uit hoofde van het voorgaande boekjaar;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel54
  - number: 54.2.c
    text: de toevoegingen of onttrekkingen bij het overzicht van baten en lasten in de jaarrekening;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel54
  - number: 54.2.d
    text: de verminderingen in verband met afschrijvingen op activa waarvoor een specifieke bestemmingsreserve is gevormd;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel54
  - number: 54.2.e
    text: het saldo aan het einde van het begrotingsjaar.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel54
  - number: '55.1'
    text: |-
      In de toelichting op de balans worden de aard en reden van de voorzieningen, bedoeld in [artikel 44][ref1] en de
      wijzigingen daarin toegelicht.


      [ref1]: https://wetten.overheid.nl/BWBR0014606#Artikel44
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0014606
        artikel: '44'
        hoofdstuk: IV
        paragraaf: 4.5.5
  - number: '55.2'
    text: 'Per voorziening wordt het verloop gedurende het jaar in een overzicht weergegeven. Daaruit blijken:'
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel55
  - number: 55.2.a
    text: het saldo aan het begin van het begrotingsjaar;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel55
  - number: 55.2.b
    text: de toevoegingen;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel55
  - number: 55.2.c
    text: ten gunste van de rekening van baten en lasten vrijgevallen bedragen;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel55
  - number: 55.2.d
    text: de aanwendingen;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel55
  - number: 55.2.e
    text: saldo aan het einde van het begrotingsjaar.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel55
  - number: '56'
    text: |-
      In de toelichting op de balans wordt de rentelast voor het begrotingsjaar vermeld van alle vaste schulden, genoemd
      in [artikel 46][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014606#Artikel46
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0014606
        artikel: '46'
        hoofdstuk: IV
        paragraaf: 4.5.5
  - number: '57.1'
    text: |-
      In de toelichting op de balans worden de borgstellingen, bedoeld in [artikel 50][ref1], gespecificeerd naar de aard
      van de geldleningen.


      [ref1]: https://wetten.overheid.nl/BWBR0014606#Artikel50
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0014606
        artikel: '50'
        hoofdstuk: IV
        paragraaf: 4.5.6
  - number: '57.2'
    text: 'Per specificatie wordt vermeld:'
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel57
  - number: 57.2.a
    text: het oorspronkelijk bedrag van de gewaarborgde geldlening;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel57
  - number: 57.2.b
    text: het percentage van het leningbedrag waarvoor borgstelling is verleend;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel57
  - number: 57.2.c
    text: het restantbedrag van de lening bij aanvang van het begrotingsjaar;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel57
  - number: 57.2.d
    text: het restantbedrag van de lening aan het eind van het begrotingsjaar.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel57
  - number: '57.3'
    text: |-
      In de toelichting op de balans wordt een specificatie opgenomen van de garantstellingen als bedoeld in
      [artikel 50][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014606#Artikel50
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0014606
        artikel: '50'
        hoofdstuk: IV
        paragraaf: 4.5.6
  - number: '57.4'
    text: |-
      In de toelichting wordt ook opgenomen het totaalbedrag van de betalingen die inzake de borg- en garantstelling zijn
      gedaan tot en met het eind van het begrotingsjaar.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel57
  - number: '58'
    text: |-
      [Artikel 29][ref1] is van overeenkomstige toepassing op de balans.


      [ref1]: https://wetten.overheid.nl/BWBR0014606#Artikel29
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0014606
        artikel: '29'
        hoofdstuk: IV
  - number: 58a.1
    text: |-
      Bij de jaarrekening is een bijlage gevoegd waarin verantwoordingsinformatie over specifieke uitkeringen wordt
      verstrekt op basis van indicatoren.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel58a
  - number: 58a.2
    text: |-
      Onze Minister stelt, in overeenstemming met Onze Minister wie het aangaat, bij ministeriële regeling een model
      vast voor de in het eerste lid bedoelde bijlage en bepaalt daarbij over welke specifieke uitkeringen daarin
      verantwoordingsinformatie wordt opgenomen en welke indicatoren worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel58a
  - number: '59.1'
    text: Alle investeringen worden geactiveerd.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel59
  - number: '59.2'
    text: In afwijking van het eerste lid worden kunstvoorwerpen met een cultuur-historische waarde niet geactiveerd.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel59
  - number: '60'
    text: 'Kosten van onderzoek en ontwikkeling voor een bepaald actief kunnen worden geactiveerd indien:'
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel60
  - number: 60.a
    text: het voornemen bestaat het actief te gebruiken of te verkopen;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel60
  - number: 60.b
    text: de technische uitvoerbaarheid om het actief te voltooien vaststaat;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel60
  - number: 60.c
    text: het actief in de toekomst economisch of maatschappelijk nut zal genereren en;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel60
  - number: 60.d
    text: de uitgaven die aan het actief zijn toe te rekenen betrouwbaar kunnen worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel60
  - number: '61'
    text: 'Bijdragen aan activa in eigendom van derden kunnen worden geactiveerd, indien:'
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel61
  - number: 61.a
    text: er sprake is van een investering door een derde;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel61
  - number: 61.b
    text: de investering bijdraagt aan de publieke taak;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel61
  - number: 61.c
    text: de derde zich heeft verplicht tot het daadwerkelijk investeren, op een wijze zoals is overeengekomen en;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel61
  - number: 61.d
    text: |-
      de bijdrage kan worden teruggevorderd, indien de derde in gebreke blijft of de provincie onderscheidenlijk gemeente
      anders recht kan doen gelden op de activa die samenhangen met de investering.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel61
  - number: '62.1'
    text: Alle vaste activa worden voor het bedrag van de investering geactiveerd.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel62
  - number: '62.2'
    text: |-
      In afwijking van het eerste lid worden de bijdragen van derden die in directe relatie staan met het actief op de
      waardering daarvan in mindering gebracht.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel62
  - number: '62.3'
    text: |-
      In afwijking van het eerste lid moeten de voorzieningen, bedoeld in [artikel 44, eerste lid, onder d][ref1], in
      mindering gebracht worden op de investeringen, bedoeld in [artikel 35, eerste lid, onder b][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0014606#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0014606#Artikel35
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0014606
        artikel: '44'
        hoofdstuk: IV
        paragraaf: 4.5.5
      - id: ref2
        bwb_id: BWBR0014606
        artikel: '35'
        hoofdstuk: IV
        paragraaf: 4.5.3
  - number: '63.1'
    text: Activa worden gewaardeerd op basis van de verkrijgings- of vervaardigingsprijs.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel63
  - number: '63.2'
    text: De verkrijgingsprijs omvat de inkoopprijs en de bijkomende kosten.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel63
  - number: '63.3'
    text: |-
      De vervaardigingsprijs omvat de aanschaffingskosten van de gebruikte grond- en hulpstoffen en de overige kosten,
      welke rechtstreeks aan de vervaardiging kunnen worden toegerekend. In de vervaardigingsprijs kunnen voorts worden
      opgenomen een redelijk deel van de indirecte kosten en de rente over het tijdvak dat aan de vervaardiging van het
      actief kan worden toegerekend; in dat geval vermeldt de toelichting dat deze rente is geactiveerd.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel63
  - number: '63.4'
    text: |-
      Voor in erfpacht uitgegeven gronden geldt de uitgifteprijs van eerste uitgifte als verkrijgingsprijs. Gronden in
      eeuwigdurende erfpacht worden gewaardeerd tegen registratiewaarde.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel63
  - number: '63.5'
    text: |-
      Van activa waarvan de bestemming verandert, wordt de actuele waarde van de nieuwe bestemming in de toelichting op
      de balans opgenomen.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel63
  - number: '63.6'
    text: |-
      In afwijking van het eerste lid is waardering tegen actuele waarde toegestaan voor de activa van de Nazorgfondsen
      bedoeld in [artikel 15.47 van de Wet milieubeheer][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel15
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '15'
  - number: '63.7'
    text: |-
      Passiva worden gewaardeerd tegen de nominale waarde, met uitzondering van voorzieningen die tegen contante waarde
      zijn gewaardeerd.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel63
  - number: '63.8'
    text: Eventuele voorzieningen wegens oninbaarheid worden met de boekwaarde van leningen en vorderingen verrekend.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel63
  - number: '64.1'
    text: De afschrijvingen geschieden onafhankelijk van het resultaat van het boekjaar.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel64
  - number: '64.2'
    text: |-
      Slechts om gegronde redenen mogen de afschrijvingen geschieden op andere grondslagen dan die welke in het
      voorafgaande begrotingsjaar zijn toegepast. De reden van de verandering wordt in de toelichting op de balans
      uiteengezet. Tevens wordt inzicht gegeven in haar betekenis voor de financiële positie en voor de baten en de
      lasten aan de hand van aangepaste cijfers voor het begrotingsjaar of voor het voorafgaande begrotingsjaar.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel64
  - number: '64.3'
    text: |-
      Op vaste activa met een beperkte gebruiksduur wordt jaarlijks afgeschreven volgens een stelsel dat is afgestemd op
      de verwachte toekomstige gebruiksduur.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel64
  - number: '64.4'
    text: |-
      In afwijking van het derde lid is de afschrijvingsduur voor de immateriële vaste activa, bedoeld in
      [artikel 34 onder a][ref1], maximaal gelijk aan de looptijd van de lening.


      [ref1]: https://wetten.overheid.nl/BWBR0014606#Artikel34
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0014606
        artikel: '34'
        hoofdstuk: IV
        paragraaf: 4.5.3
  - number: '64.5'
    text: |-
      In afwijking van het derde lid is de afschrijvingsduur voor de immateriële vaste activa, bedoeld in
      [artikel 34 onder b][ref1], ten hoogste vijf jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0014606#Artikel34
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0014606
        artikel: '34'
        hoofdstuk: IV
        paragraaf: 4.5.3
  - number: '64.6'
    text: |-
      Voor bijdragen aan de activa in eigendom van derden, bedoeld in [artikel 34, onderdeel c][ref1], is de
      afschrijvingsduur maximaal gelijk aan die van de activa waarvoor de bijdrage aan derden wordt verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0014606#Artikel34
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0014606
        artikel: '34'
        hoofdstuk: IV
        paragraaf: 4.5.3
  - number: '65.1'
    text: |-
      Naar verwachting duurzame waardeverminderingen van vaste activa worden onafhankelijk van het resultaat van het
      boekjaar in aanmerking genomen.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel65
  - number: '65.2'
    text: |-
      Voorraden en deelnemingen worden tegen de marktwaarde gewaardeerd indien de marktwaarde lager is dan de
      verkrijgings- of vervaardigingsprijs.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel65
  - number: '65.3'
    text: |-
      Een actief dat buiten gebruik wordt gesteld wordt afgewaardeerd op het moment van buitengebruikstelling, indien de
      restwaarde lager is dan de boekwaarde.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel65
  - number: '66.1'
    text: |-
      De door gedeputeerde staten onderscheidenlijk het college van burgemeester en wethouders vast te stellen
      uitvoeringsinformatie bestaat:
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel66
  - number: 66.1.a
    text: uit een totaaloverzicht van de geraamde baten en lasten per taakveld, ten tijde van de begroting;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel66
  - number: 66.1.b
    text: uit een totaaloverzicht van de gerealiseerde baten en lasten per taakveld, ten tijde van de jaarstukken;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel66
  - number: 66.1.c
    text: het verdelingsprincipe waarmee de taakvelden over de programma’s zijn verdeeld.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel66
  - number: '66.2'
    text: |-
      De raming onderscheidenlijk realisatie van het totaaloverzicht van de baten en lasten per taakveld is integraal en
      omvat dezelfde totaalbedragen als de begroting onderscheidenlijk de jaarstukken.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel66
  - number: '66.3'
    text: |-
      Voor het overzicht met de gerealiseerde baten en lasten worden hetzelfde verdelingsprincipe en dezelfde indeling
      gebruikt als voor het overzicht met de ramingen.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel66
  - number: '66.4'
    text: De voor de uitvoeringsinformatie te gebruiken taakvelden worden bij ministeriële regeling vastgesteld.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel66
  - number: '71.1'
    text: |-
      Gedeputeerde staten onderscheidenlijk het college van burgemeester en wethouders verstrekken aan Onze Minister en
      het CBS de volgende informatie voor derden :
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel71
  - number: 71.1.a
    text: |-
      de uitvoeringsinformatie, bedoeld in [artikel 66, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0014606#Artikel66
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0014606
        artikel: '66'
        hoofdstuk: VI
  - number: 71.1.b
    text: de economische categorieën per taakveld;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel71
  - number: 71.1.c
    text: de balansmutaties verbijzonderd naar economische categorie;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel71
  - number: 71.1.d
    text: |-
      de ontwikkelingen per kwartaal van de balansstanden van de bij ministeriële regeling vast te stellen activa en
      passiva;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel71
  - number: 71.1.e
    text: |-
      het aan de hand van een door het CBS beschikbaar gesteld model berekende EMU-saldo over het vorig begrotingsjaar,
      het geraamde bedrag over het begrotingsjaar en het geraamde bedrag over het jaar volgend op het begrotingsjaar;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel71
  - number: 71.1.f
    text: de actuele begroting;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel71
  - number: 71.1.g
    text: |-
      de kengetallen als bedoeld in [artikel 11, tweede lid, onder d][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0014606#Artikel11
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0014606
        artikel: '11'
        hoofdstuk: II
  - number: 71.1.h
    text: |-
      de bij ministeriële regeling vast te stellen beleidsindicatoren, waarvan gemeenten onderscheidenlijk provincies
      bronhouder zijn.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel71
  - number: '71.2'
    text: 'Bij ministeriële regeling wordt geregeld welke informatie, bedoeld in het eerste lid, wordt verstrekt:'
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel71
  - number: 71.2.a
    text: ten tijde van het opstellen van de begroting vóór 15 november van het jaar voorafgaand aan het begrotingsjaar;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel71
  - number: 71.2.b
    text: ten tijde van het opstellen van de jaarrekening vóór 15 juli van het jaar volgend op het begrotingsjaar; en,
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel71
  - number: 71.2.c
    text: gedurende het begrotingsjaar per kwartaal, binnen een maand na afloop van het betreffende kwartaal.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel71
  - number: '71.3'
    text: |-
      Het CBS toetst of de informatie voor derden tijdig en op de juiste wijze is verstrekt en kwalitatief op orde is.
      De resultaten daarvan worden medegedeeld aan gedeputeerde staten onderscheidenlijk het college van burgemeester en
      wethouders en Onze Minister.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel71
  - number: '71.4'
    text: |-
      Bij belangrijke wijzigingen in de administratie kan Onze Minister een accountantsverklaring aan gedeputeerde staten
      onderscheidenlijk het college van burgemeester en wethouders vragen.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel71
  - number: '71.5'
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld over de te verstrekken informatie voor derden en de wijze
      waarop dit geschiedt.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel71
  - number: '75.1'
    text: Er is een commissie voor het Besluit begroting en verantwoording provincies en gemeenten.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel75
  - number: '75.2'
    text: |-
      De commissie draagt zorg voor een eenduidige uitvoering en toepassing van dit besluit, en voor een visie ten
      aanzien van rechtmatigheid in de controleverklaring van gemeenten, gemeenschappelijke regelingen, waterschappen en
      provincies. De commissie draagt daartoe ten minste zorg voor:
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel75
  - number: 75.2.a
    text: een document dat de eenduidige interpretatie van dit besluit bevordert;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel75
  - number: 75.2.b
    text: |-
      het onderhouden van de Kadernota rechtmatigheid voor het geven van een visie ten aanzien van rechtmatigheid in
      de controleverklaring;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel75
  - number: 75.2.c
    text: de beantwoording van vragen.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel75
  - number: '75.3'
    text: 'De commissie bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel75
  - number: 75.3.a
    text: één onafhankelijk voorzitter;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel75
  - number: 75.3.b
    text: één secretaris;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel75
  - number: 75.3.c
    text: drie leden werkzaam als financieel ambtenaar bij gemeenten;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel75
  - number: 75.3.d
    text: twee leden werkzaam bij een provincie;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel75
  - number: 75.3.e
    text: twee leden werkzaam bij of voor de waterschappen;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel75
  - number: 75.3.f
    text: twee leden werkzaam bij het Ministerie van Binnenlandse Zaken en Koninkrijksrelaties;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel75
  - number: 75.3.g
    text: een lid werkzaam bij het Ministerie van Infrastructuur en Milieu;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel75
  - number: 75.3.h
    text: één lid werkzaam bij het Ministerie van Financiën;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel75
  - number: 75.3.i
    text: één lid werkzaam bij het CBS;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel75
  - number: 75.3.j
    text: |-
      twee leden werkzaam in de provinciale of gemeentelijke accountancy, waarvan één verbonden aan een van de vier
      grootste gemeenten;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel75
  - number: 75.3.k
    text: één lid werkzaam als gemeentesecretaris;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel75
  - number: 75.3.l
    text: één lid werkzaam als raadsgriffier of statengriffier;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel75
  - number: 75.3.m
    text: één lid werkzaam bij de Vereniging van Nederlandse Gemeenten.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel75
  - number: '75.4'
    text: |-
      De leden van de commissie hebben op persoonlijke titel zitting in de commissie en nemen deel aan de vergaderingen
      zonder last.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel75
  - number: '75.5'
    text: Onze Minister benoemt en ontslaat de voorzitter, bedoeld in het derde lid, onder a.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel75
  - number: '75.6'
    text: |-
      De voorzitter benoemt de leden, bedoeld in het derde lid, onder b tot en met m. De benoeming geschiedt op
      voordracht van:
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel75
  - number: 75.6.a
    text: |-
      de Vereniging van Nederlandse Gemeenten voor twee van de leden, bedoeld in het derde lid, onder c, en het lid,
      bedoeld in het derde lid, onder m;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel75
  - number: 75.6.b
    text: |-
      de Vereniging Federatie van Algemene Middelenmanagers bij de Overheid voor één van de leden, bedoeld in het derde
      lid, onder c;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel75
  - number: 75.6.c
    text: het Interprovinciaal Overleg voor de leden, bedoeld in het derde lid onder d;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel75
  - number: 75.6.d
    text: de Unie van Waterschappen voor de leden, bedoeld in het derde lid, onder e;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel75
  - number: 75.6.e
    text: Onze Minister voor de secretaris en voor de leden, bedoeld in het derde lid, onder f;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel75
  - number: 75.6.f
    text: Onze Minister van Infrastructuur en Milieu voor het lid, bedoeld in het derde lid, onder g;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel75
  - number: 75.6.g
    text: Onze Minister van Financiën voor het lid, bedoeld in het derde lid, onder h;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel75
  - number: 75.6.h
    text: het CBS voor het lid, bedoeld in het derde lid, onder i;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel75
  - number: 75.6.i
    text: het Nederlandse Beroepsorganisatie van Accountants voor de leden, bedoeld in het derde lid onder j;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel75
  - number: 75.6.j
    text: de Vereniging van Gemeentesecretarissen voor het lid, bedoeld in het derde lid onder k;
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel75
  - number: 75.6.k
    text: de Vereniging van Griffiers voor het lid, bedoeld in het derde lid onder l.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel75
  - number: '75.7'
    text: In overleg met de commissie kan de voorzitter een adviseur aanstellen.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel75
  - number: '75.8'
    text: |-
      Het lidmaatschap van de commissie vervalt zodra een lid niet langer werkzaam is op het terrein, aangegeven in het
      derde lid, dan wel een instantie als genoemd in het zesde lid, onder a tot en met k, een andere persoon voordraagt
      als lid aan de voorzitter van de commissie.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel75
  - number: '76.1'
    text: |-
      In afwijking van [artikel 63, eerste lid][ref1], worden activa, die op 31 december 1994 tegen actuele waarde zijn
      gewaardeerd, volgens de op dat moment aanwezige boekwaarde voor de rest van de periode afgeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0014606#Artikel63
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0014606
        artikel: '63'
        hoofdstuk: V
  - number: '76.2'
    text: |-
      In afwijking van [artikel 62, eerste lid][ref1], worden alle activa waar voor 31 december 2003 reserves op in
      mindering zijn gebracht op de waarde volgens de op 31 december 2003 aanwezige boekwaarde voor de rest van de
      periode afgeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0014606#Artikel62
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0014606
        artikel: '62'
        hoofdstuk: V
  - number: 76a.1
    text: |-
      De [artikelen 40a][ref1], [52a][ref2] en [52b][ref3] zijn niet van toepassing op de begrotingswijzigingen, de
      jaarstukken, de uitvoeringsinformatie en de informatie voor derden en de daarbij behorende toelichtingen voor het
      begrotingsjaar 2007.


      [ref1]: https://wetten.overheid.nl/BWBR0014606#Artikel40a
      [ref2]: https://wetten.overheid.nl/BWBR0014606#Artikel52a
      [ref3]: https://wetten.overheid.nl/BWBR0014606#Artikel52b
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel76a
    references:
      - id: ref1
        bwb_id: BWBR0014606
        artikel: 40a
        hoofdstuk: IV
        paragraaf: 4.5.4
      - id: ref2
        bwb_id: BWBR0014606
        artikel: 52a
        hoofdstuk: IV
        paragraaf: 4.5.7
      - id: ref3
        bwb_id: BWBR0014606
        artikel: 52b
        hoofdstuk: IV
        paragraaf: 4.5.7
  - number: 76a.2
    text: |-
      Op de begrotingswijzigingen, de jaarstukken, de uitvoeringsinformatie en de informatie voor derden en de
      daarbij behorende toelichtingen voor het begrotingsjaar 2007, zijn de [artikelen 2, vierde lid][ref1],
      [19][ref2], [43][ref3], [44, tweede lid][ref4], [49][ref5], [55, eerste lid][ref6], [63, achtste lid][ref7],
      [64, derde lid][ref8], van toepassing zoals deze golden op 9 juli 2007.


      [ref1]: https://wetten.overheid.nl/BWBR0014606#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0014606#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0014606#Artikel43
      [ref4]: https://wetten.overheid.nl/BWBR0014606#Artikel44
      [ref5]: https://wetten.overheid.nl/BWBR0014606#Artikel49
      [ref6]: https://wetten.overheid.nl/BWBR0014606#Artikel55
      [ref7]: https://wetten.overheid.nl/BWBR0014606#Artikel63
      [ref8]: https://wetten.overheid.nl/BWBR0014606#Artikel64
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel76a
    references:
      - id: ref1
        bwb_id: BWBR0014606
        artikel: '2'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0014606
        artikel: '19'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0014606
        artikel: '43'
        hoofdstuk: IV
        paragraaf: 4.5.5
      - id: ref4
        bwb_id: BWBR0014606
        artikel: '44'
        hoofdstuk: IV
        paragraaf: 4.5.5
      - id: ref5
        bwb_id: BWBR0014606
        artikel: '49'
        hoofdstuk: IV
        paragraaf: 4.5.6
      - id: ref6
        bwb_id: BWBR0014606
        artikel: '55'
        hoofdstuk: IV
        paragraaf: 4.5.7
      - id: ref7
        bwb_id: BWBR0014606
        artikel: '63'
        hoofdstuk: V
      - id: ref8
        bwb_id: BWBR0014606
        artikel: '64'
        hoofdstuk: V
  - number: 76a.3
    text: |-
      Gemeenten die meerjarige specifieke uitkeringen ontvangen, waarvan de meerjarige uitkeringsperiode vóór 1-1-2007
      aanving, kunnen hierover verantwoording afleggen op grond van de [artikelen 44, tweede lid][ref1], [49][ref2] en
      [55, eerste lid][ref3] zoals deze golden op 9 juli 2007.


      [ref1]: https://wetten.overheid.nl/BWBR0014606#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0014606#Artikel49
      [ref3]: https://wetten.overheid.nl/BWBR0014606#Artikel55
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel76a
    references:
      - id: ref1
        bwb_id: BWBR0014606
        artikel: '44'
        hoofdstuk: IV
        paragraaf: 4.5.5
      - id: ref2
        bwb_id: BWBR0014606
        artikel: '49'
        hoofdstuk: IV
        paragraaf: 4.5.6
      - id: ref3
        bwb_id: BWBR0014606
        artikel: '55'
        hoofdstuk: IV
        paragraaf: 4.5.7
  - number: '77'
    text: |-
      Het [Besluit comptabiliteitsvoorschriften 1995][ref1] wordt ingetrokken, met dien verstande dat het voor de
      begrotingswijzigingen, de jaarrekening en het jaarverslag over het jaar 2003 nog van kracht blijft.


      [ref1]: https://wetten.overheid.nl/BWBR0006654
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0006654
  - number: '78'
    text: |-
      Dit besluit treedt in werking per 1 februari 2003, met dien verstande dat de begroting, meerjarenraming, de
      jaarstukken, de uitvoeringsinformatie en de informatie voor derden en de daarbij behorende toelichtingen met ingang
      van de begroting voor het begrotingsjaar 2004 voldoen aan de bepalingen van dit besluit.
    url: https://wetten.overheid.nl/BWBR0014606/2025-01-01#Artikel78
  - number: '79'
    text: 'Dit besluit wordt aangehaald als: Besluit begroting en verantwoording provincies en gemeenten.'
