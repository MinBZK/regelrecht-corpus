    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties van 1 juli 2002, nr. FO2002/
    U78569;

    Gelet op artikel 190 van de Provinciewet en artikel 186 van de Gemeentewet;

    De Raad van State gehoord (advies van 4 december 2002, nr. W04.02.0300/1);

    Gezien het nader rapport van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties van 13 januari 2003, nr.
    FO2002/U100707

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0014606/2014-07-26#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In dit besluit wordt verstaan onder:

      a. uitzettingen: alle uitgezette middelen;

      b. verbonden partij: een privaatrechtelijke of publiekrechtelijke organisatie waarin de provincie onderscheidenlijk
      gemeente een bestuurlijk en een financieel belang heeft;

      c. financieel belang: een aan de verbonden partij ter beschikking gesteld bedrag dat niet verhaalbaar is indien de
      verbonden partij failliet gaat onderscheidenlijk het bedrag waarvoor aansprakelijkheid bestaat indien de verbonden
      partij haar verplichtingen niet nakomt;

      d. bestuurlijk belang: zeggenschap, hetzij uit hoofde van vertegenwoordiging in het bestuur hetzij uit hoofde van
      stemrecht;

      e. deelneming: een participatie in een besloten of naamloze vennootschap, waarin de provincie onderscheidenlijk
      gemeente aandelen heeft;

      f. CBS: Centraal bureau voor de statistiek;

      g. rentetypische looptijd; als gedefinieerd in de [Wet fido, artikel 1, onder b][ref1];

      h. vaste schuld: het gezamenlijk bedrag van:

      1°. de schuld uit hoofde van geldleningen met een oorspronkelijke rentetypische looptijd van één jaar of langer, en

      2°. de voor een termijn van één jaar of langer ontvangen waarborgsommen;

      i. netto-vlottende schuld; als gedefinieerd in de [Wet fido, artikel 1, onder e][ref2];

      j. EMU-saldo: het vorderingsaldo van de sector overheid op transactiebasis. Het EMU-saldo wordt berekend
      overeenkomstig het Europees systeem van nationale en regionale rekeningen in de gemeenschap, ingevoerd bij
      Verordening (EG) nr. 2223/96 van de Raad van de Europese Unie van 25 juni 1996 inzake het Europees systeem van
      nationale en regionale rekeningen in de Gemeenschap.

      2 In dit besluit wordt onder verbonden partij mede verstaan een Europese groepering voor territoriale samenwerking
      als bedoeld in artikel 1 van verordening (EG) nr. 1082/2006 van het Europees Parlement en de Raad van de Europese
      Unie van 5 juli 2006 betreffende een Europese groepering voor territoriale samenwerking (EGTS) (PbEU L 210) waarin
      de provincie onderscheidenlijk gemeente een bestuurlijk en een financieel belang heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0011987#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0011987#Artikel1
