  - number: '63'
    text: |-
      1 Activa worden gewaardeerd op basis van de verkrijgings- of vervaardigingsprijs.

      2 De verkrijgingsprijs omvat de inkoopprijs en de bijkomende kosten.

      3 De vervaardigingsprijs omvat de aanschaffingskosten van de gebruikte grond- en hulpstoffen en de overige kosten,
      welke rechtstreeks aan de vervaardiging kunnen worden toegerekend. In de vervaardigingsprijs kunnen voorts worden
      opgenomen een redelijk deel van de indirecte kosten en de rente over het tijdvak dat aan de vervaardiging van het
      actief kan worden toegerekend; in dat geval vermeldt de toelichting dat deze rente is geactiveerd.

      4 Voor in erfpacht uitgegeven gronden geldt de uitgifteprijs van eerste uitgifte als verkrijgingsprijs. Gronden in
      eeuwigdurende erfpacht worden gewaardeerd tegen registratiewaarde.

      5 Van activa waarvan de bestemming verandert, wordt de actuele waarde van de nieuwe bestemming in de toelichting op
      de balans opgenomen.

      6 In afwijking van het eerste lid is waardering tegen actuele waarde toegestaan voor de activa van de Nazorgfondsen
      bedoeld in [artikel 15.47 van de Wet milieubeheer][ref1].

      7 Passiva worden gewaardeerd tegen de nominale waarde, met uitzondering van voorzieningen die tegen contante waarde
      zijn gewaardeerd.

      8 Eventuele voorzieningen wegens oninbaarheid worden met de boekwaarde van leningen en vorderingen verrekend.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel15.47
    url: https://wetten.overheid.nl/BWBR0014606/2014-07-26#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '15.47'
  - number: '64'
    text: |-
      1 De afschrijvingen geschieden onafhankelijk van het resultaat van het boekjaar.

      2 Slechts om gegronde redenen mogen de afschrijvingen geschieden op andere grondslagen dan die welke in het
      voorafgaande begrotingsjaar zijn toegepast. De reden van de verandering wordt in de toelichting op de balans
      uiteengezet. Tevens wordt inzicht gegeven in haar betekenis voor de financiële positie en voor de baten en de
      lasten aan de hand van aangepaste cijfers voor het begrotingsjaar of voor het voorafgaande begrotingsjaar.

      3 Op vaste activa met een beperkte gebruiksduur, waaronder begrepen de financiële vaste activa, bedoeld in
      [artikel 36, onderdeel g][ref1], wordt jaarlijks afgeschreven volgens een stelsel dat is afgestemd op de verwachte
      toekomstige gebruiksduur.

      4 In afwijking van het eerste en het derde lid kan er op de activa, bedoeld in [artikel 59, vierde lid][ref2],
      extra worden afgeschreven.

      5 In afwijking van het derde lid is de afschrijvingsduur voor de immateriële vaste activa, bedoeld in
      [artikel 34 onder a][ref3], maximaal gelijk aan de looptijd van de lening.

      6 In afwijking van het derde lid is de afschrijvingsduur voor de immateriële vaste activa, bedoeld in
      [artikel 34 onder b][ref4], ten hoogste vijf jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0014606#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0014606#Artikel59
      [ref3]: https://wetten.overheid.nl/BWBR0014606#Artikel34
      [ref4]: https://wetten.overheid.nl/BWBR0014606#Artikel34
    url: https://wetten.overheid.nl/BWBR0014606/2014-07-26#Artikel64
