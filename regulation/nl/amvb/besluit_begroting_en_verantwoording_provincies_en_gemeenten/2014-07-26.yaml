  - number: '65'
    text: |-
      1 Naar verwachting duurzame waardeverminderingen van vaste activa worden onafhankelijk van het resultaat van het
      boekjaar in aanmerking genomen.

      2 Voorraden en deelnemingen worden tegen de marktwaarde gewaardeerd indien de marktwaarde lager is dan de
      verkrijgings- of vervaardigingsprijs.

      3 Een actief dat buiten gebruik wordt gesteld wordt afgewaardeerd op het moment van buitengebruikstelling, indien
      de restwaarde lager is dan de boekwaarde.
    url: https://wetten.overheid.nl/BWBR0014606/2014-07-26#Artikel65
  - number: '66'
    text: |-
      1 De uitvoeringsinformatie bestaat uit:

      a. de productenraming en toelichting ten tijde van de begroting;

      b. de productenrealisatie en toelichting ten tijde van de jaarstukken.

      2 De productenraming respectievelijk productenrealisatie bevat:

      a. de uitwerking van de programma's in producten;

      b. de geraamde respectievelijk gerealiseerde baten, lasten en het saldo per product;

      c. het verdelingsprincipe waarmee de producten over de programma's zijn verdeeld.

      3 De productenraming respectievelijk productenrealisatie is integraal en omvat dezelfde totaalbedragen als de
      begroting respectievelijk de jaarstukken.

      4 Producten zijn eenheden waarin de programma's zijn onderverdeeld.

      5 De indeling van en de verdelingsprincipes behorende bij de productenrealisatie zijn identiek aan die van de
      productenraming.
    url: https://wetten.overheid.nl/BWBR0014606/2014-07-26#Artikel66
  - number: '67'
    text: |-
      1 De toelichting op de productenraming bestaat ten minste uit een overzicht van kapitaallasten.

      2 De toelichting op de productenrealisatie bestaat ten minste uit:

      a. een overzicht van kapitaallasten;

      b. de toelichting op onderhanden werk inzake grondexploitatie, bedoeld in
      [artikel 38, onder a, onder 1 en onder b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014606#Artikel38
    url: https://wetten.overheid.nl/BWBR0014606/2014-07-26#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0014606
        artikel: '38'
        hoofdstuk: IV
        paragraaf: 4.5.4
  - number: '68'
    text: |-
      In het overzicht van de kapitaallasten wordt de volgende informatie gegeven:

      a. de afschrijvingen;

      b. de toegerekende rente.
    url: https://wetten.overheid.nl/BWBR0014606/2014-07-26#Artikel68
  - number: '70'
    text: |-
      1 In de toelichting op het onderhanden werk inzake grondexploitatie wordt voor het totaal van de in exploitatie
      zijnde complexen aangegeven:

      a. de boekwaarde aan het begin van het begrotingsjaar;

      b. de vermeerderingen in het begrotingsjaar;

      c. de verminderingen in het begrotingsjaar;

      d. de boekwaarde aan het einde van het begrotingsjaar;

      e. de geraamde nog te maken kosten en een onderbouwing hiervan;

      f. de geraamde opbrengsten en een onderbouwing hiervan;

      g. het geraamde eindresultaat;

      h. een uiteenzetting van de wijze waarop eventuele nadelige resultaten worden opgevangen.

      2 Van de nog niet in exploitatie genomen gronden wordt de gemiddelde boekwaarde per m2 vermeld.
    url: https://wetten.overheid.nl/BWBR0014606/2014-07-26#Artikel70
  - number: '71'
    text: |-
      1 Uit de productenraming wordt de volgende informatie voor derden gegenereerd:

      a. een conversietabel producten – programma's waarin wordt aangegeven:

      1. welke producten onder welk programma vallen, inclusief de verdeelsleutel;

      2. wat de baten, de lasten en het saldo per product zijn;

      b. een conversietabel producten – functies, waarin wordt aangegeven:

      1. de baten en lasten volgens de functionele indeling;

      2. per functie de producten die er aan zijn toegerekend;

      3. het verdelingsprincipe waarmee de producten over de functies zijn verdeeld;

      2 De functionele indeling wordt bij ministeriële regeling vastgesteld.

      3 Aan de hand van een door het CBS beschikbaar gesteld model wordt als informatie voor derden gegenereerd de
      berekening van het aandeel van de gemeente, de provincie of de gemeenschappelijke regeling in het EMU-saldo, over
      het vorig begrotingsjaar, de berekening van het geraamde bedrag over het begrotingsjaar en de berekening van het
      geraamde bedrag over het jaar volgend op het begrotingsjaar.

      4 De informatie bedoeld in het eerste en het derde lid wordt voor 15 november van het jaar voorafgaand aan het
      begrotingsjaar, aan Onze Minister onderscheidenlijk gedeputeerde staten en het CBS gezonden.
    url: https://wetten.overheid.nl/BWBR0014606/2014-07-26#Artikel71
  - number: '72'
    text: |-
      1 Uit de productenrealisatie wordt de volgende informatie voor derden gegenereerd:

      a. een conversietabel producten – programma's waarin wordt aangegeven:

      1. welke producten onder welk programma vallen, inclusief de verdeelsleutel;

      2. wat de baten, de lasten en het saldo per product zijn;

      b. verdelingsinformatie bestaande uit:

      1. de baten en lasten, kostenplaatsen en balansmutaties volgens de verdelingsmatrix;

      2. per functie de producten die er aan zijn toegerekend;

      3. het verdelingsprincipe waarmee de producten over de functies zijn verdeeld.

      2 De verdelingsmatrix wordt bij ministeriële regeling vastgesteld.

      3 De informatie bedoeld in het eerste lid wordt voor 15 juli van het jaar, volgend op het begrotingsjaar,
      ondertekend door gedeputeerde staten onderscheidenlijk het college aan Onze Minister onderscheidenlijk gedeputeerde
      staten en het CBS gezonden.

      4 Het CBS toetst de informatie bedoeld in het eerste lid, onder b, onder 1, op plausibiliteit en stuurt de
      resultaten daarvan op naar gedeputeerde staten onderscheidenlijk het college.

      5 Bij de informatie bedoeld in het eerste lid betreffende het begrotingsjaar 2004 wordt een accountantsverklaring
      gevraagd. Bij belangrijke wijzigingen in de administratie kan Onze Minister onderscheidenlijk gedeputeerde staten
      een accountantsverklaring aan gedeputeerde staten onderscheidenlijk het college vragen.
    url: https://wetten.overheid.nl/BWBR0014606/2014-07-26#Artikel72
  - number: '73'
    text: |-
      Indien de informatie voor derden niet voldoende inzicht biedt kan Onze Minister een deelverantwoording over een
      afzonderlijk deel van de provincie onderscheidenlijk gemeente vragen.
    url: https://wetten.overheid.nl/BWBR0014606/2014-07-26#Artikel73
  - number: '74'
    text: |-
      1 Ieder kwartaal wordt de volgende informatie voor derden verstrekt:

      a. de baten en lasten, kostenplaatsen en balansmutaties volgens de verdelingsmatrix, als bedoeld in artikel 72,
      tweede lid;

      b. de stand van zaken betreffende de volgende activa:

      1. de financiële vaste activa, als bedoeld in [artikel 36, onder a tot en met f][ref1];

      2. de uitzettingen, als bedoeld in [artikel 39][ref2];

      3. de liquide middelen, als bedoeld in [artikel 40][ref3];

      4. de overlopende activa;

      c. de stand van zaken betreffende de volgende passiva:

      1. de vaste schulden, als bedoeld en onderverdeeld in [artikel 46][ref4];

      2. de netto-vlottende schulden, als bedoeld en onderverdeeld in [artikel 48][ref5];

      3. de overlopende passiva.

      2 De informatie genoemd in het eerste lid wordt, ondertekend door gedeputeerde staten onderscheidenlijk het
      college, binnen één maand na afloop van het kwartaal gezonden aan het CBS.

      3 Het CBS toetst de informatie bedoeld in het eerste lid op plausibiliteit en stuurt de resultaten daarvan op naar
      gedeputeerde staten onderscheidenlijk het college.


      [ref1]: https://wetten.overheid.nl/BWBR0014606#Artikel36
