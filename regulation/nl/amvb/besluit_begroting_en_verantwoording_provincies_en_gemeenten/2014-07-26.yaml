        artikel: '1'
  - number: '2'
    text: |-
      1 Voor de begroting, de meerjarenraming, de jaarstukken, de productenraming en de productenrealisatie wordt een
      stelsel van baten en lasten gehanteerd.

      2 De baten en de lasten van het begrotingsjaar worden in de begroting, de jaarstukken, de productenraming en de
      productenrealisatie opgenomen, onverschillig of zij tot inkomsten of uitgaven in dat jaar leiden, onderscheidenlijk
      hebben geleid.

      3 De baten en lasten worden geraamd dan wel verantwoord tot hun brutobedrag.

      4 Onder de baten en lasten worden ook begrepen de over het eigen vermogen en de voorzieningen berekende bespaarde
      rente.
    url: https://wetten.overheid.nl/BWBR0014606/2014-07-26#Artikel2
  - number: '3'
    text: |-
      1 De begroting, de meerjarenraming, de jaarstukken en de productenraming en de productenrealisatie geven volgens
      normen die voor gemeenten en provincies als aanvaardbaar worden beschouwd een zodanig inzicht dat een verantwoord
      oordeel kan worden gevormd over de financiële positie en over de baten en de lasten. In het bijzonder provinciale
      staten en de raad moeten in staat zijn zich een zodanig oordeel te vormen.

      2 De begroting, de meerjarenraming, de productenraming en de toelichtingen geven duidelijk en stelselmatig de
      omvang van alle geraamde baten en lasten, alsmede het saldo ervan weer. De begroting geeft tevens duidelijk en
      stelselmatig inzicht in de financiële positie.

      3 De jaarstukken, de productenrealisatie en de toelichtingen geven getrouw, duidelijk en stelselmatig de baten en
      lasten van het begrotingsjaar, alsmede het saldo ervan weer. De jaarrekening geeft tevens een getrouw, duidelijk en
      stelselmatig inzicht in de financiële positie aan het einde van het begrotingsjaar.
    url: https://wetten.overheid.nl/BWBR0014606/2014-07-26#Artikel3
  - number: '4'
    text: |-
      1 De indeling van de begroting en de jaarstukken is identiek.

      2 Indien de indeling van de begroting, de meerjarenraming, de jaarstukken, de productenraming en de
      productenrealisatie afwijkt van die van het voorafgaande begrotingsjaar worden in de toelichting de verschillen
      aangegeven en worden de redenen die tot de afwijking hebben geleid uiteengezet.
    url: https://wetten.overheid.nl/BWBR0014606/2014-07-26#Artikel4
  - number: '5'
    text: Verbonden partijen worden niet geconsolideerd in de begroting en jaarstukken.
    url: https://wetten.overheid.nl/BWBR0014606/2014-07-26#Artikel5
  - number: '7'
    text: |-
      1 De begroting bestaat ten minste uit:

      a. de beleidsbegroting;

      b. de financiële begroting.

      2 De beleidsbegroting bestaat ten minste uit:

      a. het programmaplan;

      b. de paragrafen.

      3 De financiële begroting bestaat ten minste uit:

      a. het overzicht van baten en lasten en de toelichting;

      b. de uiteenzetting van de financiële positie en de toelichting.
    url: https://wetten.overheid.nl/BWBR0014606/2014-07-26#Artikel7
  - number: '8'
    text: |-
      1 Het programmaplan bevat de te realiseren programma's, het overzicht van algemene dekkingsmiddelen en het bedrag
      voor onvoorzien.

      2 Een programma is een samenhangend geheel van activiteiten.

      3 Het programmaplan bevat per programma:

      a. de doelstelling, in het bijzonder de beoogde maatschappelijke effecten;

      b. de wijze waarop ernaar gestreefd zal worden die effecten te bereiken;

      c. de raming van baten en lasten.

      4 De provincie onderscheidenlijk gemeente kan de baten en lasten per programma verdelen in de onderdelen baten en
      lasten voor prioriteiten en voor overig.

      5 Het overzicht algemene dekkingsmiddelen bevat ten minste:

      a. lokale heffingen, waarvan de besteding niet gebonden is;

      b. algemene uitkeringen;

      c. dividend;

      d. saldo van de financieringsfunctie;

      e. overige algemene dekkingsmiddelen.

      6 Het bedrag voor onvoorzien wordt geraamd voor de begroting in zijn geheel of per programma.
    url: https://wetten.overheid.nl/BWBR0014606/2014-07-26#Artikel8
  - number: '9'
    text: |-
      1 In de begroting worden in afzonderlijke paragrafen de beleidslijnen vastgelegd met betrekking tot relevante
      beheersmatige aspecten, alsmede tot de lokale heffingen.

      2 De begroting bevat ten minste de volgende paragrafen, tenzij het desbetreffende aspect bij de provincie
      onderscheidenlijk gemeente niet aan de orde is:

      a. lokale heffingen;

      b. weerstandsvermogen en risicobeheersing;

      c. onderhoud kapitaalgoederen;

      d. financiering;

      e. bedrijfsvoering;

      f. verbonden partijen;

      g. grondbeleid.
    url: https://wetten.overheid.nl/BWBR0014606/2014-07-26#Artikel9
  - number: '10'
    text: |-
      De paragraaf betreffende de lokale heffingen bevat ten minste:

      a. de geraamde inkomsten;

      b. het beleid ten aanzien van de lokale heffingen;

      c. een overzicht op hoofdlijnen van de diverse heffingen;

      d. een aanduiding van de lokale lastendruk;

      e. een beschrijving van het kwijtscheldingsbeleid.
    url: https://wetten.overheid.nl/BWBR0014606/2014-07-26#Artikel10
  - number: '11'
    text: |-
      1 Het weerstandsvermogen bestaat uit de relatie tussen:

      a. de weerstandscapaciteit, zijnde de middelen en mogelijkheden waarover de provincie onderscheidenlijk gemeente
      beschikt of kan beschikken om niet begrote kosten te dekken;

      b. alle risico's waarvoor geen maatregelen zijn getroffen en die van materiële betekenis kunnen zijn in relatie tot
      de financiële positie.

      2 De paragraaf betreffende het weerstandsvermogen en risicobeheersing bevat ten minste:

      a. een inventarisatie van de weerstandscapaciteit;

      b. een inventarisatie van de risico's;

      c. het beleid omtrent de weerstandscapaciteit en de risico's.
    url: https://wetten.overheid.nl/BWBR0014606/2014-07-26#Artikel11
  - number: '12'
    text: |-
      1 De paragraaf betreffende het onderhoud van kapitaalgoederen bevat ten minste de volgende kapitaalgoederen:

      a. wegen;

      b. riolering;

      c. water;

      d. groen;

      e. gebouwen.

      2 Van de kapitaalgoederen, bedoeld in het eerste lid, wordt aangegeven:

      a. het beleidskader;

      b. de uit het beleidskader voortvloeiende financiële consequenties;

      c. de vertaling van de financiële consequenties in de begroting.
    url: https://wetten.overheid.nl/BWBR0014606/2014-07-26#Artikel12
  - number: '13'
    text: |-
      De paragraaf betreffende de financiering bevat in ieder geval de beleidsvoornemens ten aanzien van het risicobeheer
      van de financieringsportefeuille.
    url: https://wetten.overheid.nl/BWBR0014606/2014-07-26#Artikel13
  - number: '14'
    text: |-
      De paragraaf betreffende de bedrijfsvoering geeft ten minste inzicht in de stand van zaken en de beleidsvoornemens
      ten aanzien van de bedrijfsvoering.
    url: https://wetten.overheid.nl/BWBR0014606/2014-07-26#Artikel14
  - number: '15'
    text: |-
      1 De paragraaf betreffende de verbonden partijen bevat ten minste:

      a. de visie op verbonden partijen in relatie tot de realisatie van de doelstellingen die zijn opgenomen in de
      begroting;

      b. de beleidsvoornemens omtrent verbonden partijen;

      c. de lijst van verbonden partijen.

      2 In de lijst van verbonden partijen wordt ten minste de volgende informatie opgenomen:

      a. de naam en de vestigingsplaats;

      b. het openbaar belang dat op deze wijze behartigd wordt;

      c. het belang dat de provincie onderscheidenlijk de gemeente in de verbonden partij heeft aan het begin en de
      verwachte omvang aan het einde van het begrotingsjaar;

      d. de verwachte omvang van het eigen vermogen en het vreemd vermogen van de verbonden partij aan het begin en aan
      het einde van het begrotingsjaar;

      e. de verwachte omvang van het financiële resultaat van de verbonden partij in het begrotingsjaar.
    url: https://wetten.overheid.nl/BWBR0014606/2014-07-26#Artikel15
  - number: '16'
    text: |-
      De paragraaf betreffende het grondbeleid bevat ten minste:

      a. een visie op het grondbeleid in relatie tot de realisatie van de doelstellingen van de programma's die zijn
      opgenomen in de begroting;

      b. een aanduiding van de wijze waarop de provincie onderscheidenlijk gemeente het grondbeleid uitvoert;

      c. een actuele prognose van de te verwachten resultaten van de totale grondexploitatie;

      d. een onderbouwing van de geraamde winstneming;

      e. de beleidsuitgangspunten omtrent de reserves voor grondzaken in relatie tot de risico's van de grondzaken.
    url: https://wetten.overheid.nl/BWBR0014606/2014-07-26#Artikel16
  - number: '17'
    text: |-
      Het overzicht van baten en lasten in de begroting bevat:

      a. per programma, of per programmaonderdeel als bedoeld in artikel 8, vierde lid, de raming van de baten en lasten
      en het saldo;

      b. het overzicht van de geraamde algemene dekkingsmiddelen en het geraamde bedrag voor onvoorzien;

      c. het geraamde totaal saldo van baten en lasten, volgend uit de onderdelen a en b;

      d. de beoogde toevoegingen en onttrekkingen aan reserves per programma;

      e. het geraamde resultaat, volgend uit de onderdelen c en d.
    url: https://wetten.overheid.nl/BWBR0014606/2014-07-26#Artikel17
  - number: '18'
    text: |-
      In de besluiten tot wijziging van de begroting wordt per programma en, indien aanwezig, per programmaonderdeel, de
      mutatie en het nieuwe geraamde bedrag vastgesteld.
    url: https://wetten.overheid.nl/BWBR0014606/2014-07-26#Artikel18
  - number: '19'
    text: |-
      De toelichting op het overzicht van baten en lasten bevat ten minste:

      a. het gerealiseerde bedrag van het voorvorig begrotingsjaar, het geraamde bedrag van het vorig begrotingsjaar na
      wijziging en het geraamde bedrag van het begrotingsjaar;

      b. de gronden waarop de ramingen zijn gebaseerd en, in geval van aanmerkelijk verschil met de raming,
      respectievelijk de realisatie, van het vorig, respectievelijk voorvorig, begrotingsjaar de oorzaken van het
      verschil;

      c. een overzicht van de geraamde incidentele baten en lasten per programma, waarbij per programma ten minste de
      belangrijkste posten afzonderlijk worden gespecificeerd en de overige posten als een totaalbedrag kunnen worden
      opgenomen;

      d. een overzicht van de beoogde structurele toevoegingen en onttrekkingen aan de reserves;

      e. de berekening van het aandeel van de gemeente, de provincie of de gemeenschappelijke regeling in het EMU-saldo,
      over het vorig begrotingsjaar, de berekening van het geraamde bedrag over het begrotingsjaar en de berekening van
      het geraamde bedrag over het jaar volgend op het begrotingsjaar.
    url: https://wetten.overheid.nl/BWBR0014606/2014-07-26#Artikel19
  - number: '20'
    text: |-
      1 De uiteenzetting van de financiële positie bevat een raming voor het begrotingsjaar van de financiële gevolgen
      van het bestaande en het nieuwe beleid dat in de programma's is opgenomen.

      2 Afzonderlijke aandacht wordt ten minste besteed aan:

      a. de jaarlijks terugkerende arbeidskosten gerelateerde verplichtingen van vergelijkbaar volume;

      b. de investeringen; onderscheiden in investeringen met een economisch nut en investeringen in de openbare ruimte
      met een maatschappelijk nut;

      c. de financiering;

      d. de stand en het gespecificeerde verloop van de reserves;

      e. de stand en het gespecificeerde verloop van de voorzieningen.
    url: https://wetten.overheid.nl/BWBR0014606/2014-07-26#Artikel20
  - number: '21'
    text: |-
      De toelichting op de uiteenzetting van de financiële positie bevat ten minste de gronden waarop de ramingen
      zijn gebaseerd en de motivering daarvan en een toelichting op belangrijke ontwikkelingen ten opzichte van de
      uiteenzetting van de financiële positie van het vorig begrotingsjaar.
    url: https://wetten.overheid.nl/BWBR0014606/2014-07-26#Artikel21
  - number: '22'
    text: |-
      1 De meerjarenraming bevat een raming van de financiële gevolgen voor de drie jaren volgend op het begrotingsjaar,
      waaronder de baten en de lasten van het bestaande en het nieuwe beleid dat in de programma's is opgenomen.

      2 [Artikel 20, tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014606#Artikel20
    url: https://wetten.overheid.nl/BWBR0014606/2014-07-26#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0014606
        artikel: '20'
        hoofdstuk: II
  - number: '23'
    text: |-
      De toelichting op de meerjarenraming bevat ten minste:

      a. de gronden waarop de ramingen zijn gebaseerd en de motivering daarvan, en een toelichting op belangrijke
      ontwikkelingen ten opzichte van de meerjarenraming van het vorig begrotingsjaar;

      b. een overzicht per jaar van de geraamde incidentele baten en lasten per programma, waarbij per programma ten
      minste de belangrijkste posten afzonderlijk worden gespecificeerd en de overige posten als een totaalbedrag kunnen
      worden opgenomen;

      c. een overzicht per jaar van de beoogde structurele toevoegingen en onttrekkingen aan de reserves.
    url: https://wetten.overheid.nl/BWBR0014606/2014-07-26#Artikel23
  - number: '24'
    text: |-
      1 De jaarstukken bestaan ten minste uit:

      a. het jaarverslag;

      b. de jaarrekening.

      2 Het jaarverslag bestaat ten minste uit:

      a. de programmaverantwoording;

      b. de paragrafen.

      3 De jaarrekening bestaat uit:

      a. het overzicht van baten en lasten in de jaarrekening en de toelichting;

      b. de balans en de toelichting;

      c. de bijlage met de verantwoordingsinformatie over specifieke uitkeringen.
    url: https://wetten.overheid.nl/BWBR0014606/2014-07-26#Artikel24
  - number: '25'
    text: |-
      1 De programmaverantwoording bestaat ten minste uit de verantwoording over de realisatie van de programma's en het
      overzicht van algemene dekkingsmiddelen. Daarnaast wordt inzicht gegeven in het gebruik van het geraamde bedrag
      voor onvoorzien.

      2 De programmaverantwoording biedt per programma inzicht in:

      a. de mate waarin de doelstellingen zijn gerealiseerd;

      b. de wijze waarop getracht is de beoogde maatschappelijke effecten te bereiken;

      c. de gerealiseerde baten en lasten.
    url: https://wetten.overheid.nl/BWBR0014606/2014-07-26#Artikel25
  - number: '26'
    text: |-
      Het jaarverslag bevat de paragrafen die ingevolge [artikel 9][ref1] in de begroting zijn opgenomen. Ze bevatten de
      verantwoording van hetgeen in de overeenkomstige paragrafen in de begroting is opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0014606#Artikel9
    url: https://wetten.overheid.nl/BWBR0014606/2014-07-26#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0014606
        artikel: '9'
        hoofdstuk: II
  - number: '27'
    text: |-
      1 Het overzicht van baten en lasten in de jaarrekening bevat:

      a. per programma, of per programmaonderdeel als bedoeld in [artikel 8, vierde lid][ref1], de gerealiseerde baten en
      lasten en het saldo daarvan;

      b. het overzicht van de gerealiseerde algemene dekkingsmiddelen;

      c. het gerealiseerde totaal saldo van baten en lasten, volgend uit de onderdelen a en b;

      d. de werkelijke toevoegingen en onttrekkingen aan reserves;

      e. het gerealiseerde resultaat, volgend uit de onderdelen c en d.

      2 Het overzicht van baten en lasten in de jaarrekening bevat van de onderdelen genoemd in het eerste lid ook de
      ramingen uit de begroting voor en na wijziging.


      [ref1]: https://wetten.overheid.nl/BWBR0014606#Artikel8
    url: https://wetten.overheid.nl/BWBR0014606/2014-07-26#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0014606
        artikel: '8'
        hoofdstuk: II
  - number: '28'
    text: |-
      De toelichting op het overzicht van baten en lasten in de jaarrekening bevat ten minste:

      a. voor alle onderdelen van [artikel 27, eerste lid][ref1], een analyse van de afwijkingen tussen de begroting na
      wijziging en de jaarstukken;

      b. een overzicht van de aanwending van het bedrag voor onvoorzien;

      c. een overzicht van de incidentele baten en lasten per programma, waarbij per programma ten minste de
      belangrijkste posten afzonderlijk worden gespecificeerd en de overige posten als een totaalbedrag kunnen worden
      opgenomen;

      d. een overzicht van de structurele toevoegingen en onttrekkingen aan de reserves;

      e. de informatie, bedoeld in de [artikelen 4.1, eerste en tweede lid][ref2], en
