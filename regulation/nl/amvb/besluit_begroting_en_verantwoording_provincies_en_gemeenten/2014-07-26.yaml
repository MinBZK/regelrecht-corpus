  - number: '75'
    text: |-
      1 Er is een commissie voor het Besluit begroting en verantwoording provincies en gemeenten.

      2 De commissie draagt zorg voor een eenduidige uitvoering en toepassing van dit besluit, en voor een visie ten
      aanzien van rechtmatigheid in de controleverklaring van gemeenten, gemeenschappelijke regelingen, waterschappen en
      provincies. De commissie draagt daartoe ten minste zorg voor:

      a. een document dat de eenduidige interpretatie van dit besluit bevordert;

      b. het onderhouden van de Kadernota rechtmatigheid voor het geven van een visie ten aanzien van rechtmatigheid in
      de controleverklaring;

      c. de beantwoording van vragen.

      3 De commissie bestaat uit:

      a. één onafhankelijk voorzitter;

      b. één secretaris;

      c. drie leden werkzaam als financieel ambtenaar bij gemeenten;

      d. twee leden werkzaam bij een provincie;

      e. twee leden werkzaam bij of voor de waterschappen;

      f. twee leden werkzaam bij het Ministerie van Binnenlandse Zaken en Koninkrijksrelaties;

      g. één lid werkzaam bij het Ministerie van Financiën;

      h. één lid werkzaam bij het CBS;

      i. twee leden werkzaam in de provinciale of gemeentelijke accountancy, waarvan één verbonden aan een van de vier
      grootste gemeenten;

      j. één lid werkzaam als gemeentesecretaris;

      k. één lid werkzaam als raadsgriffier of statengriffier.

      4 De leden van de commissie hebben op persoonlijke titel zitting in de commissie en nemen deel aan de vergaderingen
      zonder last.

      5 Onze Minister benoemt en ontslaat de voorzitter, bedoeld in het derde lid, onder a.

      6 De voorzitter benoemt de leden, bedoeld in het derde lid, onder b tot en met k. De benoeming geschiedt op
      voordracht van:

      a. de Vereniging van Nederlandse Gemeenten voor de secretaris en voor twee van de leden, bedoeld in het derde lid,
      onder c;

      b. de Vereniging Federatie van Algemene Middelenmanagers bij de Overheid voor één van de leden, bedoeld in het
      derde lid, onder c;

      c. het Interprovinciaal Overleg voor de leden, bedoeld in het derde lid onder d;

      d. de Unie van Waterschappen voor de leden, bedoeld in het derde lid, onder e;

      e. Onze Minister voor de leden, bedoeld in het derde lid, onder f;

      f. Onze Minister van Financiën voor het lid, bedoeld in het derde lid, onder g;

      g. het CBS voor het lid, bedoeld in het derde lid, onder h;

      h. het Koninklijk Nederlands Instituut van Registeraccountants voor de leden, bedoeld in het derde lid onder i;

      i. de Vereniging van Gemeentesecretarissen voor het lid, bedoeld in het derde lid onder j;

      j. de Vereniging van Griffiers voor het lid, bedoeld in het derde lid, onderdeel k.

      Bij het besluit tot benoeming houdt de voorzitter rekening met in de commissie noodzakelijke kennis en ervaring.

      7 In overleg met de commissie kan de voorzitter een adviseur aanstellen.

      8 Het lidmaatschap van de commissie vervalt zodra een lid niet langer werkzaam is op het terrein, aangegeven in het
      derde lid, dan wel een instantie als genoemd in het zesde lid, onder a tot en met j, een andere persoon voordraagt
      als lid aan de voorzitter van de commissie.
    url: https://wetten.overheid.nl/BWBR0014606/2014-07-26#Artikel75
  - number: '76'
    text: |-
      1 In afwijking van [artikel 63, eerste lid][ref1], worden activa, die op 31 december 1994 tegen actuele waarde zijn
      gewaardeerd, volgens de op dat moment aanwezige boekwaarde voor de rest van de periode afgeschreven.

      2 In afwijking van [artikel 62, eerste lid][ref2], worden alle activa waar voor 31 december 2003 reserves op
      in mindering zijn gebracht op de waarde volgens de op 31 december 2003 aanwezige boekwaarde voor de rest van de
      periode afgeschreven.


