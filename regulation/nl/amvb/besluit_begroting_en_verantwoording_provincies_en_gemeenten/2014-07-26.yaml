  - number: '29'
    text: |-
      Het overzicht van baten en lasten in de jaarrekening wordt vastgesteld met inachtneming van hetgeen omtrent de
      financiële positie op de balansdatum is gebleken tussen het moment van opmaken van de jaarstukken en het tijdstip
      van vaststelling daarvan, voor zover deze aanvullende informatie onontbeerlijk is voor het in [artikel 3][ref1]
      bedoelde inzicht.


      [ref1]: https://wetten.overheid.nl/BWBR0014606#Artikel3
    url: https://wetten.overheid.nl/BWBR0014606/2014-07-26#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0014606
        artikel: '3'
        hoofdstuk: I
  - number: '30'
    text: |-
      In de balans worden naast de cijfers per balansdatum tevens de cijfers van de balans van het vorige begrotingsjaar
      opgenomen.
    url: https://wetten.overheid.nl/BWBR0014606/2014-07-26#Artikel30
  - number: '31'
    text: |-
      Op de balans worden de activa onderscheiden in vaste en vlottende activa, al naar gelang zij zijn bestemd om de
      uitoefening van de werkzaamheid van de provincie onderscheidenlijk gemeente al dan niet duurzaam te dienen.
    url: https://wetten.overheid.nl/BWBR0014606/2014-07-26#Artikel31
  - number: '32'
    text: Op de balans worden de passiva onderscheiden in vaste en vlottende passiva.
    url: https://wetten.overheid.nl/BWBR0014606/2014-07-26#Artikel32
  - number: '33'
    text: Onder de vaste activa worden afzonderlijk opgenomen de immateriële, de materiële en de financiële vaste activa.
    url: https://wetten.overheid.nl/BWBR0014606/2014-07-26#Artikel33
  - number: '34'
    text: |-
      In de balans worden onder de immateriële vaste activa afzonderlijk opgenomen:

      a. kosten verbonden aan het sluiten van geldleningen en het saldo van agio en disagio;

      b. kosten van onderzoek en ontwikkeling voor een bepaald actief.
    url: https://wetten.overheid.nl/BWBR0014606/2014-07-26#Artikel34
  - number: '35'
    text: |-
      1 In de balans worden onder de materiële vaste activa afzonderlijk opgenomen:

      a. investeringen met een economisch nut;

      b. investeringen met een economisch nut, waarvoor ter bestrijding van de kosten een heffing kan worden geheven;

      c. investeringen in de openbare ruimte met een maatschappelijk nut.

      2 Van de materiële vaste activa wordt aangegeven welke in erfpacht zijn uitgegeven.
    url: https://wetten.overheid.nl/BWBR0014606/2014-07-26#Artikel35
  - number: '36'
    text: |-
      In de balans worden onder de financiële vaste activa afzonderlijk opgenomen:

      a. kapitaalverstrekkingen aan:

      1. deelnemingen;

      2. gemeenschappelijke regelingen;

      3. overige verbonden partijen;

      b. leningen aan:

      1. openbare lichamen als bedoeld in [artikel 1, onderdeel a, van de Wet financiering decentrale overheden][ref1];

      2. woningbouwcorporaties;

      3. deelnemingen;

      4. overige verbonden partijen;

      c. overige langlopende leningen;

      d. uitzettingen in ’s Rijks schatkist met een rentetypische looptijd van één jaar of langer;

      e. uitzettingen in de vorm van Nederlands schuldpapier met een rentetypische looptijd van één jaar of langer;

      f. overige uitzettingen met een rentetypische looptijd van één jaar of langer;

      g. bijdragen aan activa in eigendom van derden.


      [ref1]: https://wetten.overheid.nl/BWBR0011987#Artikel1
    url: https://wetten.overheid.nl/BWBR0014606/2014-07-26#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0011987
        artikel: '1'
  - number: '37'
    text: |-
      Onder de vlottende activa worden afzonderlijk opgenomen de voorraden, de uitzettingen met een rentetypische
      looptijd korter dan één jaar, de liquide middelen en de overlopende activa.
    url: https://wetten.overheid.nl/BWBR0014606/2014-07-26#Artikel37
  - number: '38'
    text: |-
      In de balans worden onder de voorraden afzonderlijk opgenomen:

      a. grond- en hulpstoffen gespecificeerd naar:

      1. niet in exploitatie genomen bouwgronden;

      2. overige grond- en hulpstoffen;

      b. onderhanden werk, waaronder bouwgronden in exploitatie;

      c. gereed product en handelsgoederen;

      d. vooruitbetalingen.
    url: https://wetten.overheid.nl/BWBR0014606/2014-07-26#Artikel38
  - number: '39'
    text: |-
      In de balans worden onder de uitzettingen met een rentetypische looptijd korter dan één jaar afzonderlijk
      opgenomen:

      a. vorderingen op openbare lichamen;

      b. verstrekte kasgeldleningen aan openbare lichamen als bedoeld in
      [artikel 1, onderdeel a, van de Wet financiering decentrale overheden][ref1];

      c. overige verstrekte kasgeldleningen;

      d. uitzettingen in ’s Rijks schatkist met een rentetypische looptijd korter dan één jaar;

      e. rekening-courantverhouding met het Rijk;

      f. rekening-courantverhoudingen met niet-financiële instellingen;

      g. uitzettingen in de vorm van Nederlands schuldpapier met een rentetypische looptijd korter dan één jaar;

      h. overige vorderingen;

      i. overige uitzettingen.


      [ref1]: https://wetten.overheid.nl/BWBR0011987#Artikel1
    url: https://wetten.overheid.nl/BWBR0014606/2014-07-26#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0011987
        artikel: '1'
  - number: '40'
    text: In de balans worden onder de liquide middelen de kas- en banksaldi opgenomen.
    url: https://wetten.overheid.nl/BWBR0014606/2014-07-26#Artikel40
  - number: 40a
    text: |-
      In de balans worden onder de overlopende activa afzonderlijk opgenomen:

      a. de van Europese en Nederlandse overheidslichamen nog te ontvangen voorschotbedragen die ontstaan door
      voorfinanciering op uitkeringen met een specifiek bestedingsdoel;

      b. overige nog te ontvangen bedragen en de vooruitbetaalde bedragen die ten laste van volgende begrotingsjaren
      komen.
    url: https://wetten.overheid.nl/BWBR0014606/2014-07-26#Artikel40a
  - number: '41'
    text: |-
      Onder de vaste passiva worden afzonderlijk opgenomen het eigen vermogen, de voorzieningen en de vaste schulden, met
      een rentetypische looptijd van één jaar of langer.
    url: https://wetten.overheid.nl/BWBR0014606/2014-07-26#Artikel41
  - number: '42'
    text: |-
      1 Het eigen vermogen bestaat uit de reserves en het gerealiseerde resultaat volgend uit het overzicht van baten en
      lasten in de jaarrekening.

      2 Het in het eerste lid bedoelde resultaat wordt afzonderlijk opgenomen als onderdeel van het eigen vermogen.
    url: https://wetten.overheid.nl/BWBR0014606/2014-07-26#Artikel42
  - number: '43'
    text: |-
      1 In de balans worden de reserves onderscheiden naar:

      a. de algemene reserve;

      b. de bestemmingsreserves.

      2 Een bestemmingsreserve is een reserve waaraan provinciale staten respectievelijk de raad een bepaalde bestemming
      heeft gegeven.
    url: https://wetten.overheid.nl/BWBR0014606/2014-07-26#Artikel43
  - number: '44'
    text: |-
      1 Voorzieningen worden gevormd wegens:

      a. verplichtingen en verliezen waarvan de omvang op de balansdatum onzeker is, doch redelijkerwijs te schatten;

      b. op de balansdatum bestaande risico's ter zake van bepaalde te verwachten verplichtingen of verliezen waarvan de
      omvang redelijkerwijs is te schatten;

      c. kosten die in een volgend begrotingsjaar zullen worden gemaakt, mits het maken van die kosten zijn oorsprong
      mede vindt in het begrotingsjaar of in een voorafgaand begrotingsjaar en de voorziening strekt tot gelijkmatige
      verdeling van lasten over een aantal begrotingsjaren;

      d. de bijdragen aan toekomstige vervangingsinvesteringen, waarvoor een heffing wordt geheven als bedoeld in
      [artikel 35, eerste lid, onder b][ref1].

      2 Tot de voorzieningen worden ook gerekend van derden verkregen middelen die specifiek besteed moeten worden, met
      uitzondering van de voorschotbedragen, bedoeld in [artikel 49, onderdeel b][ref2].

      3 Voorzieningen worden niet gevormd voor jaarlijks terugkerende arbeidskosten gerelateerde verplichtingen van
      vergelijkbaar volume.


      [ref1]: https://wetten.overheid.nl/BWBR0014606#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0014606#Artikel49
    url: https://wetten.overheid.nl/BWBR0014606/2014-07-26#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0014606
        artikel: '35'
        hoofdstuk: IV
        paragraaf: 4.5.3
      - id: ref2
        bwb_id: BWBR0014606
        artikel: '49'
        hoofdstuk: IV
        paragraaf: 4.5.6
  - number: '45'
    text: Rentetoevoegingen aan voorzieningen zijn niet toegestaan.
    url: https://wetten.overheid.nl/BWBR0014606/2014-07-26#Artikel45
  - number: '46'
    text: |-
      In de balans worden onder de vaste schulden afzonderlijk opgenomen:

      a. obligatieleningen;

      b. onderhandse leningen van:

      1. binnenlandse pensioenfondsen en verzekeringsinstellingen;

      2. binnenlandse banken en overige financiële instellingen;

      3. binnenlandse bedrijven;

      4. openbare lichamen als bedoeld in [artikel 1, onderdeel a, van de Wet financiering decentrale overheden][ref1];

      5. overige binnenlandse sectoren;

      6. buitenlandse instellingen, fondsen, banken, bedrijven en overige sectoren;

      c. door derden belegde gelden;

      d. waarborgsommen.


      [ref1]: https://wetten.overheid.nl/BWBR0011987#Artikel1
    url: https://wetten.overheid.nl/BWBR0014606/2014-07-26#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0011987
        artikel: '1'
  - number: '47'
    text: |-
      Onder de vlottende passiva worden afzonderlijk opgenomen de netto-vlottende schulden, met een rentetypische
      looptijd korter dan één jaar en de overlopende passiva.
    url: https://wetten.overheid.nl/BWBR0014606/2014-07-26#Artikel47
  - number: '48'
    text: |-
      In de balans worden onder de netto-vlottende schulden afzonderlijk opgenomen:

      a. kasgeldleningen aangegaan bij openbare lichamen als bedoeld in
      [artikel 1, onderdeel a, van de Wet financiering decentrale overheden][ref1];

      b. overige kasgeldleningen;

      c. banksaldi;

      d. overige schulden.


      [ref1]: https://wetten.overheid.nl/BWBR0011987#Artikel1
    url: https://wetten.overheid.nl/BWBR0014606/2014-07-26#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0011987
        artikel: '1'
  - number: '49'
    text: |-
      In de balans worden onder de overlopende passiva afzonderlijk opgenomen:

      a. verplichtingen die in het begrotingsjaar zijn opgebouwd en die in een volgend begrotingsjaar tot betaling komen,
      met uitzondering van jaarlijks terugkerende arbeidskosten gerelateerde verplichtingen van vergelijkbaar volume;

      b. de van de Europese en Nederlandse overheidslichamen ontvangen voorschotbedragen voor uitkeringen met een
      specifiek bestedingsdoel die dienen ter dekking van lasten van volgende begrotingsjaren;

      c. overige vooruit ontvangen bedragen die ten bate van volgende begrotingsjaren komen.
    url: https://wetten.overheid.nl/BWBR0014606/2014-07-26#Artikel49
  - number: '50'
    text: |-
      Aan de passiefzijde van de balans wordt buiten de balanstelling opgenomen het bedrag waartoe aan natuurlijke en
      rechtspersonen borgstellingen of garantstellingen zijn verstrekt.
    url: https://wetten.overheid.nl/BWBR0014606/2014-07-26#Artikel50
  - number: '51'
    text: |-
      In de toelichting op de balans wordt aangegeven volgens welke methoden de afschrijvingen worden berekend. Ook
      wordt aangegeven welke investeringen in de openbare ruimte met een maatschappelijk nut worden geactiveerd, welke
      afschrijvingstermijn hiervoor wordt voorzien en welke reserves hiervoor naar verwachting beschikbaar zullen zijn.
    url: https://wetten.overheid.nl/BWBR0014606/2014-07-26#Artikel51
  - number: '52'
    text: |-
      1 In de toelichting op de balans worden onder de materiële vaste activa afzonderlijk opgenomen:

      a. gronden en terreinen;

      b. woonruimten;

      c. bedrijfsgebouwen;

      d. grond-, weg- en waterbouwkundige werken;

      e. vervoermiddelen;

      f. machines, apparaten en installaties;

      g. overige materiële vaste activa.

      2 In de toelichting op de balans wordt het verloop van de activa, als bedoeld in het eerste lid, gedurende het
      begrotingsjaar, in een sluitend overzicht weergegeven. Daaruit blijken, voor zover van toepassing:

      a. de boekwaarde aan het begin van het begrotingsjaar;

      b. de investeringen of desinvesteringen;

      c. de afschrijvingen;

      d. bijdragen van derden direct gerelateerd aan een actief;

      e. afwaarderingen wegens duurzame waardeverminderingen;

      f. de boekwaarde aan het einde van het begrotingsjaar.
    url: https://wetten.overheid.nl/BWBR0014606/2014-07-26#Artikel52
  - number: 52a
    text: |-
      1 In de toelichting op de balans wordt per uitkering met een specifiek bestedingsdoel het verloop gedurende het
      jaar van de ontvangen voorschotbedragen, bedoeld in [artikel 49, onderdeel b][ref1], in een overzicht weergegeven.
      Daaruit blijken:

      a. het saldo aan het begin van het begrotingsjaar;

      b. de ontvangen bedragen;

      c. de vrijgevallen bedragen of de terugbetalingen;

      d. het saldo aan het einde van het begrotingsjaar.

      2 In de toelichting op de balans wordt per uitkering met een specifiek bestedingsdoel het verloop gedurende het
      jaar van de nog te ontvangen voorschotbedragen, bedoeld in [artikel 40a, onderdeel a][ref2], in een overzicht
      weergegeven. Daaruit blijken:

      a. het saldo aan het begin van het begrotingsjaar;

      b. de toevoegingen;

      c. de ontvangen bedragen;

      d. het saldo aan het einde van het begrotingsjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0014606#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0014606#Artikel40a
    url: https://wetten.overheid.nl/BWBR0014606/2014-07-26#Artikel52a
    references:
      - id: ref1
        bwb_id: BWBR0014606
        artikel: '49'
        hoofdstuk: IV
        paragraaf: 4.5.6
      - id: ref2
        bwb_id: BWBR0014606
        artikel: 40a
        hoofdstuk: IV
        paragraaf: 4.5.4
  - number: 52b
    text: |-
      De aard en omvang van de aangebrachte dan wel geraamde waardeverminderingen van de leningen en vorderingen,
      bedoeld in [artikel 63, achtste lid][ref1], van de vaste activa, bedoeld in [artikel 65, eerste lid][ref2], en
      van de deelnemingen en voorraden, bedoeld in [artikel 65, tweede lid][ref3], worden in de toelichting op de balans
      opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0014606#Artikel63
      [ref2]: https://wetten.overheid.nl/BWBR0014606#Artikel65
      [ref3]: https://wetten.overheid.nl/BWBR0014606#Artikel65
    url: https://wetten.overheid.nl/BWBR0014606/2014-07-26#Artikel52b
    references:
      - id: ref1
        bwb_id: BWBR0014606
        artikel: '63'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0014606
        artikel: '65'
        hoofdstuk: V
      - id: ref3
        bwb_id: BWBR0014606
        artikel: '65'
        hoofdstuk: V
  - number: 52c
    text: |-
      In de toelichting op de balans wordt vermeld:

      a. het drempelbedrag voor het begrotingsjaar waarover verantwoording wordt afgelegd; en

      b. voor ieder kwartaal van dat jaar, het bedrag aan middelen, bedoeld in
      [artikel 2, vierde lid, van de Wet financiering decentrale overheden][ref1], dat in het kader van het drempelbedrag
      door de provincie onderscheidenlijk de gemeente buiten ’s Rijks schatkist is aangehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0011987#Artikel2
    url: https://wetten.overheid.nl/BWBR0014606/2014-07-26#Artikel52c
    references:
      - id: ref1
        bwb_id: BWBR0011987
        artikel: '2'
  - number: '53'
    text: |-
      In de toelichting op de balans worden de niet in de balans opgenomen belangrijke financiële verplichtingen vermeld
      waaraan de provincie of de gemeente voor toekomstige jaren is verbonden.
    url: https://wetten.overheid.nl/BWBR0014606/2014-07-26#Artikel53
  - number: '54'
    text: |-
      1 In de toelichting op de balans worden de aard en reden van elke reserve en de toevoegingen en onttrekkingen
      daaraan toegelicht.

      2 Per reserve wordt het verloop gedurende het jaar in een overzicht weergegeven. Daaruit blijken:

      a. het saldo aan het begin van het begrotingsjaar;

      b. de toevoegingen of onttrekkingen uit hoofde van het voorgaande boekjaar;

      c. de toevoegingen of onttrekkingen bij het overzicht van baten en lasten in de jaarrekening;

      d. de verminderingen in verband met afschrijvingen op activa waarvoor een specifieke bestemmingsreserve is gevormd;

      e. het saldo aan het einde van het begrotingsjaar.
    url: https://wetten.overheid.nl/BWBR0014606/2014-07-26#Artikel54
  - number: '55'
    text: |-
      1 In de toelichting op de balans worden de aard en reden van de voorzieningen, bedoeld in [artikel 44][ref1] en de
      wijzigingen daarin toegelicht.

      2 Per voorziening wordt het verloop gedurende het jaar in een overzicht weergegeven. Daaruit blijken:

      a. het saldo aan het begin van het begrotingsjaar;

      b. de toevoegingen;

      c. ten gunste van de rekening van baten en lasten vrijgevallen bedragen;

      d. de aanwendingen;

      e. saldo aan het einde van het begrotingsjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0014606#Artikel44
    url: https://wetten.overheid.nl/BWBR0014606/2014-07-26#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0014606
        artikel: '44'
        hoofdstuk: IV
        paragraaf: 4.5.5
  - number: '56'
    text: |-
      In de toelichting op de balans wordt de rentelast voor het begrotingsjaar vermeld van alle vaste schulden, genoemd
      in [artikel 46][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014606#Artikel46
    url: https://wetten.overheid.nl/BWBR0014606/2014-07-26#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0014606
        artikel: '46'
        hoofdstuk: IV
        paragraaf: 4.5.5
  - number: '57'
    text: |-
      1 In de toelichting op de balans worden de borgstellingen, bedoeld in [artikel 50][ref1], gespecificeerd naar de
      aard van de geldleningen.

      2 Per specificatie wordt vermeld:

      a. het oorspronkelijk bedrag van de gewaarborgde geldlening;

      b. het percentage van het leningbedrag waarvoor borgstelling is verleend;

      c. het restantbedrag van de lening bij aanvang van het begrotingsjaar;

      d. het restantbedrag van de lening aan het eind van het begrotingsjaar.

      3 In de toelichting op de balans wordt een specificatie opgenomen van de garantstellingen als bedoeld in
      [artikel 50][ref2].

      4 In de toelichting wordt ook opgenomen het totaalbedrag van de betalingen die inzake de borg- en garantstelling
      zijn gedaan tot en met het eind van het begrotingsjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0014606#Artikel50
      [ref2]: https://wetten.overheid.nl/BWBR0014606#Artikel50
    url: https://wetten.overheid.nl/BWBR0014606/2014-07-26#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0014606
        artikel: '50'
        hoofdstuk: IV
        paragraaf: 4.5.6
      - id: ref2
        bwb_id: BWBR0014606
        artikel: '50'
        hoofdstuk: IV
        paragraaf: 4.5.6
  - number: '58'
    text: |-
      [Artikel 29][ref1] is van overeenkomstige toepassing op de balans.


      [ref1]: https://wetten.overheid.nl/BWBR0014606#Artikel29
    url: https://wetten.overheid.nl/BWBR0014606/2014-07-26#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0014606
        artikel: '29'
        hoofdstuk: IV
  - number: 58a
    text: |-
      1 Bij de jaarrekening is een bijlage gevoegd waarin verantwoordingsinformatie over specifieke uitkeringen wordt
      verstrekt op basis van indicatoren.

      2 Onze Minister stelt, in overeenstemming met Onze Minister wie het aangaat, bij ministeriële regeling een model
      vast voor de in het eerste lid bedoelde bijlage en bepaalt daarbij over welke specifieke uitkeringen daarin
      verantwoordingsinformatie wordt opgenomen en welke indicatoren worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0014606/2014-07-26#Artikel58a
  - number: '59'
    text: |-
      1 Alle investeringen met een economisch nut worden geactiveerd.

      2 Investeringen hebben een economisch nut indien ze verhandelbaar zijn en/of indien ze kunnen bijdragen aan het
      genereren van middelen.

      3 In afwijking van het eerste lid worden kunstvoorwerpen met een cultuur-historische waarde niet geactiveerd.

      4 Investeringen in de openbare ruimte met een maatschappelijk nut kunnen worden geactiveerd.
    url: https://wetten.overheid.nl/BWBR0014606/2014-07-26#Artikel59
  - number: '60'
    text: |-
      Kosten van onderzoek en ontwikkeling voor een bepaald actief kunnen worden geactiveerd indien:

      a. het voornemen bestaat het actief te gebruiken of te verkopen;

      b. de technische uitvoerbaarheid om het actief te voltooien vaststaat;

      c. het actief in de toekomst economisch of maatschappelijk nut zal genereren en;

      d. de uitgaven die aan het actief zijn toe te rekenen betrouwbaar kunnen worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0014606/2014-07-26#Artikel60
  - number: '61'
    text: |-
      Bijdragen aan activa in eigendom van derden kunnen worden geactiveerd, indien:

      a. er sprake is van een investering door een derde;

      b. de investering bijdraagt aan de publieke taak;

      c. de derde zich heeft verplicht tot het daadwerkelijk investeren, op een wijze zoals is overeengekomen en;

      d. de bijdrage kan worden teruggevorderd, indien de derde in gebreke blijft of de provincie onderscheidenlijk
      gemeente anders recht kan doen gelden op de activa die samenhangen met de investering.
    url: https://wetten.overheid.nl/BWBR0014606/2014-07-26#Artikel61
  - number: '62'
    text: |-
      1 Alle vaste activa worden voor het bedrag van de investering geactiveerd.

      2 In afwijking van het eerste lid kunnen bijdragen van derden die in directe relatie staan met een actief op de
      waardering daarvan in mindering worden gebracht.

      3 In afwijking van het eerste lid kunnen reserves in mindering worden gebracht op investeringen, als bedoeld in
      [artikel 59, het vierde lid][ref1].

      4 In afwijking van het eerste lid moeten de voorzieningen, bedoeld in [artikel 44, eerste lid, onder d][ref2], in
      mindering gebracht worden op de investeringen, bedoeld in [artikel 35, eerste lid, onder b][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0014606#Artikel59
      [ref2]: https://wetten.overheid.nl/BWBR0014606#Artikel44
      [ref3]: https://wetten.overheid.nl/BWBR0014606#Artikel35
    url: https://wetten.overheid.nl/BWBR0014606/2014-07-26#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0014606
        artikel: '59'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0014606
        artikel: '44'
        hoofdstuk: IV
        paragraaf: 4.5.5
