  - number: 76a.3
    text: |-
      Gemeenten die meerjarige specifieke uitkeringen ontvangen, waarvan de meerjarige uitkeringsperiode vóór 1-1-2007
      aanving, kunnen hierover verantwoording afleggen op grond van de [artikelen 44, tweede lid][ref1], [49][ref2] en
      [55, eerste lid][ref3] zoals deze golden op 9 juli 2007.


      [ref1]: https://wetten.overheid.nl/BWBR0014606#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0014606#Artikel49
