preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties van 1 juli 2002, nr. FO2002/
    U78569;

    Gelet op artikel 190 van de Provinciewet en artikel 186 van de Gemeentewet;

    De Raad van State gehoord (advies van 4 december 2002, nr. W04.02.0300/1);

    Gezien het nader rapport van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties van 13 januari 2003, nr.
    FO2002/U100707

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel1
  - number: 1.a
    text: 'uitzettingen: alle uitgezette middelen;'
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel1
  - number: 1.b
    text: |-
      verbonden partij: een privaatrechtelijke of publiekrechtelijke organisatie waarin de provincie onderscheidenlijk
      gemeente een bestuurlijk en een financieel belang heeft;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel1
  - number: 1.c
    text: |-
      financieel belang: een aan de verbonden partij ter beschikking gesteld bedrag dat niet verhaalbaar is indien de
      verbonden partij failliet gaat onderscheidenlijk het bedrag waarvoor aansprakelijkheid bestaat indien de verbonden
      partij haar verplichtingen niet nakomt;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel1
  - number: 1.d
    text: |-
      bestuurlijk belang: zeggenschap, hetzij uit hoofde van vertegenwoordiging in het bestuur hetzij uit hoofde van
      stemrecht;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel1
  - number: 1.e
    text: |-
      deelneming: een participatie in een besloten of naamloze vennootschap, waarin de provincie onderscheidenlijk
      gemeente aandelen heeft;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel1
  - number: 1.f
    text: 'CBS: Centraal bureau voor de statistiek;'
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel1
  - number: 1.g
    text: |-
      rentetypische looptijd; als gedefinieerd in de [Wet fido, artikel 1, onder b][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011987#Artikel1
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0011987
        artikel: '1'
  - number: 1.h
    text: |-
      vaste schuld; als gedefinieerd in de [Wet fido, artikel 1, onder d][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011987#Artikel1
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0011987
        artikel: '1'
  - number: 1.i
    text: |-
      netto-vlottende schuld; als gedefinieerd in de [Wet fido, artikel 1, onder e][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011987#Artikel1
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0011987
        artikel: '1'
  - number: 1.j
    text: |-
      EMU-saldo: het vorderingsaldo van de sector overheid op transactiebasis. Het EMU-saldo wordt berekend
      overeenkomstig het Europees systeem van nationale en regionale rekeningen in de gemeenschap, ingevoerd bij
      Verordening (EG) nr. 2223/96 van de Raad van de Europese Unie van 25 juni 1996 inzake het Europees systeem van
      nationale en regionale rekeningen in de Gemeenschap.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel1
  - number: '2.1'
    text: |-
      Voor de begroting, de meerjarenraming, de jaarstukken, de productenraming en de productenrealisatie wordt een
      stelsel van baten en lasten gehanteerd.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel2
  - number: '2.2'
    text: |-
      De baten en de lasten van het begrotingsjaar worden in de begroting, de jaarstukken, de productenraming en de
      productenrealisatie opgenomen, onverschillig of zij tot inkomsten of uitgaven in dat jaar leiden, onderscheidenlijk
      hebben geleid.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel2
  - number: '2.3'
    text: De baten en lasten worden geraamd dan wel verantwoord tot hun brutobedrag.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel2
  - number: '2.4'
    text: |-
      Onder de baten en lasten worden ook begrepen de over het eigen vermogen en de voorzieningen berekende bespaarde
      rente.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel2
  - number: '3.1'
    text: |-
      De begroting, de meerjarenraming, de jaarstukken en de productenraming en de productenrealisatie geven volgens
      normen die voor gemeenten en provincies als aanvaardbaar worden beschouwd een zodanig inzicht dat een verantwoord
      oordeel kan worden gevormd over de financiële positie en over de baten en de lasten. In het bijzonder provinciale
      staten en de raad moeten in staat zijn zich een zodanig oordeel te vormen.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel3
  - number: '3.2'
    text: |-
      De begroting, de meerjarenraming, de productenraming en de toelichtingen geven duidelijk en stelselmatig de
      omvang van alle geraamde baten en lasten, alsmede het saldo ervan weer. De begroting geeft tevens duidelijk en
      stelselmatig inzicht in de financiële positie.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel3
  - number: '3.3'
    text: |-
      De jaarstukken, de productenrealisatie en de toelichtingen geven getrouw, duidelijk en stelselmatig de baten en
      lasten van het begrotingsjaar, alsmede het saldo ervan weer. De jaarrekening geeft tevens een getrouw, duidelijk en
      stelselmatig inzicht in de financiële positie aan het einde van het begrotingsjaar.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel3
  - number: '4.1'
    text: De indeling van de begroting en de jaarstukken is identiek.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel4
  - number: '4.2'
    text: |-
      Indien de indeling van de begroting, de meerjarenraming, de jaarstukken, de productenraming en de
      productenrealisatie afwijkt van die van het voorafgaande begrotingsjaar worden in de toelichting de verschillen
      aangegeven en worden de redenen die tot de afwijking hebben geleid uiteengezet.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel4
  - number: '5'
    text: Verbonden partijen worden niet geconsolideerd in de begroting en jaarstukken.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel5
  - number: '6.1'
    text: |-
      De verordening, bedoeld in [artikel 87 van de Gemeentewet][ref1], kan bepalen dat deelgemeenten niet worden
      geïntegreerd in de begroting en de jaarstukken.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel87
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '87'
  - number: '6.2'
    text: 'Indien toepassing wordt gegeven aan het eerste lid:'
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel6
  - number: 6.2.a
    text: |-
      is dit besluit op de begroting, de begrotingswijzigingen, de meerjarenraming, de jaarstukken, de productenraming en
      de productenrealisatie van de deelgemeenten van toepassing;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel6
  - number: 6.2.b
    text: |-
      worden de deelgemeenten in de begroting, de begrotingswijzigingen, de meerjarenraming, de jaarstukken, de
      productenraming en de productenrealisatie van de gemeente als verbonden partijen beschouwd.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel6
  - number: '7.1'
    text: 'De begroting bestaat ten minste uit:'
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel7
  - number: 7.1.a
    text: de beleidsbegroting;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel7
  - number: 7.1.b
    text: de financiële begroting.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel7
  - number: '7.2'
    text: 'De beleidsbegroting bestaat ten minste uit:'
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel7
  - number: 7.2.a
    text: het programmaplan;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel7
  - number: 7.2.b
    text: de paragrafen.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel7
  - number: '7.3'
    text: 'De financiële begroting bestaat ten minste uit:'
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel7
  - number: 7.3.a
    text: het overzicht van baten en lasten en de toelichting;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel7
  - number: 7.3.b
    text: de uiteenzetting van de financiële positie en de toelichting.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel7
  - number: '8.1'
    text: |-
      Het programmaplan bevat de te realiseren programma's, het overzicht van algemene dekkingsmiddelen en het bedrag
      voor onvoorzien.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel8
  - number: '8.2'
    text: Een programma is een samenhangend geheel van activiteiten.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel8
  - number: '8.3'
    text: 'Het programmaplan bevat per programma:'
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel8
  - number: 8.3.a
    text: de doelstelling, in het bijzonder de beoogde maatschappelijke effecten;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel8
  - number: 8.3.b
    text: de wijze waarop ernaar gestreefd zal worden die effecten te bereiken;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel8
  - number: 8.3.c
    text: de raming van baten en lasten.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel8
  - number: '8.4'
    text: |-
      De provincie onderscheidenlijk gemeente kan de baten en lasten per programma verdelen in de onderdelen baten en
      lasten voor prioriteiten en voor overig.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel8
  - number: '8.5'
    text: 'Het overzicht algemene dekkingsmiddelen bevat ten minste:'
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel8
  - number: 8.5.a
    text: lokale heffingen, waarvan de besteding niet gebonden is;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel8
  - number: 8.5.b
    text: algemene uitkeringen;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel8
  - number: 8.5.c
    text: dividend;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel8
  - number: 8.5.d
    text: saldo van de financieringsfunctie;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel8
  - number: 8.5.e
    text: saldo tussen de compensabele BTW en de uitkering uit het BTW-compensatiefonds;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel8
  - number: 8.5.f
    text: overige algemene dekkingsmiddelen.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel8
  - number: '8.6'
    text: Het bedrag voor onvoorzien wordt geraamd voor de begroting in zijn geheel of per programma.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel8
  - number: '9.1'
    text: |-
      In de begroting worden in afzonderlijke paragrafen de beleidslijnen vastgelegd met betrekking tot relevante
      beheersmatige aspecten, alsmede tot de lokale heffingen.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel9
  - number: '9.2'
    text: |-
      De begroting bevat ten minste de volgende paragrafen, tenzij het desbetreffende aspect bij de provincie
      onderscheidenlijk gemeente niet aan de orde is:
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel9
  - number: 9.2.a
    text: lokale heffingen;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel9
  - number: 9.2.b
    text: weerstandsvermogen;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel9
  - number: 9.2.c
    text: onderhoud kapitaalgoederen;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel9
  - number: 9.2.d
    text: financiering;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel9
  - number: 9.2.e
    text: bedrijfsvoering;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel9
  - number: 9.2.f
    text: verbonden partijen;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel9
  - number: 9.2.g
    text: grondbeleid.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel9
  - number: '10'
    text: 'De paragraaf betreffende de lokale heffingen bevat ten minste:'
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel10
  - number: 10.a
    text: de geraamde inkomsten;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel10
  - number: 10.b
    text: het beleid ten aanzien van de lokale heffingen;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel10
  - number: 10.c
    text: een overzicht op hoofdlijnen van de diverse heffingen;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel10
  - number: 10.d
    text: een aanduiding van de lokale lastendruk;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel10
  - number: 10.e
    text: een beschrijving van het kwijtscheldingsbeleid.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel10
  - number: '11.1'
    text: 'Het weerstandsvermogen bestaat uit de relatie tussen:'
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel11
  - number: 11.1.a
    text: |-
      de weerstandscapaciteit, zijnde de middelen en mogelijkheden waarover de provincie onderscheidenlijk gemeente
      beschikt of kan beschikken om niet begrote kosten te dekken;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel11
  - number: 11.1.b
    text: |-
      alle risico's waarvoor geen maatregelen zijn getroffen en die van materiële betekenis kunnen zijn in relatie tot de
      financiële positie.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel11
  - number: '11.2'
    text: 'De paragraaf betreffende het weerstandsvermogen bevat ten minste:'
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel11
  - number: 11.2.a
    text: een inventarisatie van de weerstandscapaciteit;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel11
  - number: 11.2.b
    text: een inventarisatie van de risico's;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel11
  - number: 11.2.c
    text: het beleid omtrent de weerstandscapaciteit en de risico's.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel11
  - number: '12.1'
    text: 'De paragraaf betreffende het onderhoud van kapitaalgoederen bevat ten minste de volgende kapitaalgoederen:'
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel12
  - number: 12.1.a
    text: wegen;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel12
  - number: 12.1.b
    text: riolering;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel12
  - number: 12.1.c
    text: water;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel12
  - number: 12.1.d
    text: groen;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel12
  - number: 12.1.e
    text: gebouwen.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel12
  - number: '12.2'
    text: 'Van de kapitaalgoederen, bedoeld in het eerste lid, wordt aangegeven:'
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel12
  - number: 12.2.a
    text: het beleidskader;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel12
  - number: 12.2.b
    text: de uit het beleidskader voortvloeiende financiële consequenties;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel12
  - number: 12.2.c
    text: de vertaling van de financiële consequenties in de begroting.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel12
  - number: '13'
    text: |-
      De paragraaf betreffende de financiering bevat in ieder geval de beleidsvoornemens ten aanzien van het risicobeheer
      van de financieringsportefeuille.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel13
  - number: '14'
    text: |-
      De paragraaf betreffende de bedrijfsvoering geeft ten minste inzicht in de stand van zaken en de beleidsvoornemens
      ten aanzien van de bedrijfsvoering.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel14
  - number: '15'
    text: 'De paragraaf betreffende de verbonden partijen bevat ten minste:'
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel15
  - number: 15.a
    text: |-
      de visie op verbonden partijen in relatie tot de realisatie van de doelstellingen die zijn opgenomen in de
      begroting;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel15
  - number: 15.b
    text: de beleidsvoornemens omtrent verbonden partijen.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel15
  - number: '16'
    text: 'De paragraaf betreffende het grondbeleid bevat ten minste:'
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel16
  - number: 16.a
    text: |-
      een visie op het grondbeleid in relatie tot de realisatie van de doelstellingen van de programma's die zijn
      opgenomen in de begroting;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel16
  - number: 16.b
    text: een aanduiding van de wijze waarop de provincie onderscheidenlijk gemeente het grondbeleid uitvoert;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel16
  - number: 16.c
    text: een actuele prognose van de te verwachten resultaten van de totale grondexploitatie;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel16
  - number: 16.d
    text: een onderbouwing van de geraamde winstneming;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel16
  - number: 16.e
    text: de beleidsuitgangspunten omtrent de reserves voor grondzaken in relatie tot de risico's van de grondzaken.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel16
  - number: '17'
    text: 'Het overzicht van baten en lasten bevat:'
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel17
  - number: 17.a
    text: per programma, of per programmaonderdeel, de raming van de baten en lasten en het saldo;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel17
  - number: 17.b
    text: het overzicht van de geraamde algemene dekkingsmiddelen en het geraamde bedrag voor onvoorzien;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel17
  - number: 17.c
    text: het geraamde resultaat voor bestemming, volgend uit de onderdelen a en b;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel17
  - number: 17.d
    text: de beoogde toevoegingen en onttrekkingen aan reserves per programma;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel17
  - number: 17.e
    text: het geraamde resultaat na bestemming, volgend uit de onderdelen c en d.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel17
  - number: '18'
    text: |-
      In de besluiten tot wijziging van de begroting wordt per programma en, indien aanwezig, per programmaonderdeel, de
      mutatie en het nieuwe geraamde bedrag vastgesteld.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel18
  - number: '19'
    text: 'De toelichting op het overzicht van baten en lasten bevat ten minste:'
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel19
  - number: 19.a
    text: |-
      het gerealiseerde bedrag van het voorvorig begrotingsjaar, het geraamde bedrag van het vorig begrotingsjaar na
      wijziging en het geraamde bedrag van het begrotingsjaar;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel19
  - number: 19.b
    text: |-
      de gronden waarop de ramingen zijn gebaseerd en, in geval van aanmerkelijk verschil met de raming, respectievelijk
      de realisatie, van het vorig, respectievelijk voorvorig, begrotingsjaar de oorzaken van het verschil;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel19
  - number: 19.c
    text: een overzicht van de geraamde incidentele baten en lasten;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel19
  - number: 19.d
    text: |-
      de berekening van het aandeel van de gemeente, de provincie of de gemeenschappelijke regeling in het EMU-saldo,
      over het vorig begrotingsjaar, de berekening van het geraamde bedrag over het begrotingsjaar en de berekening van
      het geraamde bedrag over het jaar volgend op het begrotingsjaar.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel19
  - number: '20.1'
    text: |-
      De uiteenzetting van de financiële positie bevat een raming voor het begrotingsjaar van de financiële gevolgen van
      het bestaande en het nieuwe beleid dat in de programma's is opgenomen.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel20
  - number: '20.2'
    text: 'Afzonderlijke aandacht wordt ten minste besteed aan:'
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel20
  - number: 20.2.a
    text: de jaarlijks terugkerende arbeidskosten gerelateerde verplichtingen van vergelijkbaar volume;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel20
  - number: 20.2.b
    text: |-
      de investeringen; onderscheiden in investeringen met een economisch nut en investeringen in de openbare ruimte met
      een maatschappelijk nut;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel20
  - number: 20.2.c
    text: de financiering;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel20
  - number: 20.2.d
    text: de stand en het verloop van de reserves;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel20
  - number: 20.2.e
    text: de stand en het verloop van de voorzieningen.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel20
  - number: '21'
    text: |-
      De toelichting op de uiteenzetting van de financiële positie bevat ten minste de gronden waarop de ramingen zijn
      gebaseerd en een toelichting op belangrijke ontwikkelingen ten opzichte van de uiteenzetting van de financiële
      positie van het vorig begrotingsjaar.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel21
  - number: '22.1'
    text: |-
      De meerjarenraming bevat een raming van de financiële gevolgen voor de drie jaren volgend op het begrotingsjaar,
      waaronder de baten en de lasten van het bestaande en het nieuwe beleid dat in de programma's is opgenomen.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel22
  - number: '22.2'
    text: |-
      [Artikel 20, tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014606#Artikel20
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0014606
        artikel: '20'
        hoofdstuk: II
  - number: '23'
    text: |-
      De toelichting op de meerjarenraming bevat ten minste de gronden waarop de ramingen zijn gebaseerd en een
      toelichting op belangrijke ontwikkelingen ten opzichte van de meerjarenraming van het vorig begrotingsjaar.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel23
  - number: '24.1'
    text: 'De jaarstukken bestaan ten minste uit:'
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel24
  - number: 24.1.a
    text: het jaarverslag;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel24
  - number: 24.1.b
    text: de jaarrekening.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel24
  - number: '24.2'
    text: 'Het jaarverslag bestaat ten minste uit:'
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel24
  - number: 24.2.a
    text: de programmaverantwoording;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel24
  - number: 24.2.b
    text: de paragrafen.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel24
  - number: '24.3'
    text: 'De jaarrekening bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel24
  - number: 24.3.a
    text: de programmarekening en de toelichting;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel24
  - number: 24.3.b
    text: de balans en de toelichting;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel24
  - number: 24.3.c
    text: de bijlage met de verantwoordingsinformatie over specifieke uitkeringen.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel24
  - number: '25.1'
    text: |-
      De programmaverantwoording bestaat ten minste uit de verantwoording over de realisatie van de programma's en het
      overzicht van algemene dekkingsmiddelen. Daarnaast wordt inzicht gegeven in het gebruik van het geraamde bedrag
      voor onvoorzien.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel25
  - number: '25.2'
    text: 'De programmaverantwoording biedt per programma inzicht in:'
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel25
  - number: 25.2.a
    text: de mate waarin de doelstellingen zijn gerealiseerd;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel25
  - number: 25.2.b
    text: de wijze waarop getracht is de beoogde maatschappelijke effecten te bereiken;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel25
  - number: 25.2.c
    text: de gerealiseerde baten en lasten.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel25
  - number: '26'
    text: |-
      Het jaarverslag bevat de paragrafen die ingevolge [artikel 9][ref1] in de begroting zijn opgenomen. Ze bevatten de
      verantwoording van hetgeen in de overeenkomstige paragrafen in de begroting is opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0014606#Artikel9
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0014606
        artikel: '9'
        hoofdstuk: II
  - number: '27.1'
    text: 'De programmarekening bevat:'
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel27
  - number: 27.1.a
    text: de gerealiseerde baten en lasten per programma;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel27
  - number: 27.1.b
    text: het overzicht van de gerealiseerde algemene dekkingsmiddelen;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel27
  - number: 27.1.c
    text: het gerealiseerde resultaat voor bestemming, volgend uit de onderdelen a en b;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel27
  - number: 27.1.d
    text: de werkelijke toevoegingen en onttrekkingen aan reserves;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel27
  - number: 27.1.e
    text: het gerealiseerde resultaat na bestemming, volgend uit de onderdelen c en d.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel27
  - number: '27.2'
    text: |-
      De programmarekening bevat van de onderdelen genoemd in het eerste lid ook de ramingen uit de begroting voor en
      na wijziging.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel27
  - number: '28'
    text: 'De toelichting op de programmarekening bevat ten minste:'
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel28
  - number: 28.a
    text: |-
      voor alle onderdelen van [artikel 27, eerste lid][ref1], een analyse van de afwijkingen tussen de begroting na
      wijziging en de programmarekening;


      [ref1]: https://wetten.overheid.nl/BWBR0014606#Artikel27
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0014606
        artikel: '27'
        hoofdstuk: IV
  - number: 28.b
    text: een overzicht van de aanwending van het bedrag voor onvoorzien;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel28
  - number: 28.c
    text: een overzicht van de incidentele baten en lasten;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel28
  - number: 28.d
    text: |-
      de informatie, bedoeld in
      [artikel 6, eerste en tweede lid, van de Wet openbaarmaking uit publieke middelen gefinancierde topinkomens][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019562#Artikel6
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0019562
        artikel: '6'
  - number: '29'
    text: |-
      De programmarekening wordt vastgesteld met inachtneming van hetgeen omtrent de financiële positie op de balansdatum
      is gebleken tussen het moment van opmaken van de programmarekening en het tijdstip van vaststelling daarvan, voor
      zover deze aanvullende informatie onontbeerlijk is voor het in [artikel 3][ref1] bedoelde inzicht.


      [ref1]: https://wetten.overheid.nl/BWBR0014606#Artikel3
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0014606
        artikel: '3'
        hoofdstuk: I
  - number: '30'
    text: |-
      In de balans worden naast de cijfers per balansdatum tevens de cijfers van de balans van het vorige begrotingsjaar
      opgenomen.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel30
  - number: '31'
    text: |-
      Op de balans worden de activa onderscheiden in vaste en vlottende activa, al naar gelang zij zijn bestemd om de
      uitoefening van de werkzaamheid van de provincie onderscheidenlijk gemeente al dan niet duurzaam te dienen.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel31
  - number: '32'
    text: Op de balans worden de passiva onderscheiden in vaste en vlottende passiva.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel32
  - number: '33'
    text: Onder de vaste activa worden afzonderlijk opgenomen de immateriële, de materiële en de financiële vaste activa.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel33
  - number: '34'
    text: 'In de balans worden onder de immateriële vaste activa afzonderlijk opgenomen:'
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel34
  - number: 34.a
    text: kosten verbonden aan het sluiten van geldleningen en het saldo van agio en disagio;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel34
  - number: 34.b
    text: kosten van onderzoek en ontwikkeling voor een bepaald actief.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel34
  - number: '35.1'
    text: 'In de balans worden onder de materiële vaste activa afzonderlijk opgenomen:'
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel35
  - number: 35.1.a
    text: investeringen met een economisch nut;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel35
  - number: 35.1.b
    text: investeringen in de openbare ruimte met een maatschappelijk nut.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel35
  - number: '35.2'
    text: Van de materiële vaste activa wordt aangegeven welke in erfpacht zijn uitgegeven.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel35
  - number: '36'
    text: 'In de balans worden onder de financiële vaste activa afzonderlijk opgenomen:'
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel36
  - number: 36.a
    text: 'kapitaalverstrekkingen aan:'
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel36
  - number: 36.a.1
    text: deelnemingen;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel36
  - number: 36.a.2
    text: gemeenschappelijke regelingen;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel36
  - number: 36.a.3
    text: overige verbonden partijen;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel36
  - number: 36.b
    text: 'leningen aan:'
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel36
  - number: 36.b.1
    text: woningbouwcorporaties;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel36
  - number: 36.b.2
    text: deelnemingen;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel36
  - number: 36.b.3
    text: overige verbonden partijen;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel36
  - number: 36.c
    text: overige langlopende leningen;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel36
  - number: 36.d
    text: overige uitzettingen met een rentetypische looptijd van één jaar of langer;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel36
  - number: 36.e
    text: bijdragen aan activa in eigendom van derden.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel36
  - number: '37'
    text: |-
      Onder de vlottende activa worden afzonderlijk opgenomen de voorraden, de uitzettingen met een rentetypische
      looptijd korter dan één jaar, de liquide middelen en de overlopende activa.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel37
  - number: '38'
    text: 'In de balans worden onder de voorraden afzonderlijk opgenomen:'
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel38
  - number: 38.a
    text: 'grond- en hulpstoffen gespecificeerd naar:'
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel38
  - number: 38.a.1
    text: niet in exploitatie genomen bouwgronden;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel38
  - number: 38.a.2
    text: overige grond- en hulpstoffen;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel38
  - number: 38.b
    text: onderhanden werk, waaronder bouwgronden in exploitatie;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel38
  - number: 38.c
    text: gereed product en handelsgoederen;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel38
  - number: 38.d
    text: vooruitbetalingen.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel38
  - number: '39'
    text: |-
      In de balans worden onder de uitzettingen met een rentetypische looptijd korter dan één jaar afzonderlijk
      opgenomen:
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel39
  - number: 39.a
    text: vorderingen op openbare lichamen;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel39
  - number: 39.b
    text: verstrekte kasgeldleningen;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel39
  - number: 39.c
    text: rekening-courantverhoudingen met niet-financiële instellingen;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel39
  - number: 39.d
    text: overige vorderingen;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel39
  - number: 39.e
    text: overige uitzettingen.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel39
  - number: '40'
    text: In de balans worden onder de liquide middelen de kas-, bank- en girosaldi opgenomen.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel40
  - number: 40a
    text: 'In de balans worden onder de overlopende activa afzonderlijk opgenomen:'
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel40a
  - number: 40a.a
    text: |-
      de van Europese en Nederlandse overheidslichamen nog te ontvangen voorschotbedragen die ontstaan door
      voorfinanciering op uitkeringen met een specifiek bestedingsdoel;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel40a
  - number: 40a.b
    text: overige nog te ontvangen bedragen en de vooruitbetaalde bedragen die ten laste van volgende begrotingsjaren komen.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel40a
  - number: '41'
    text: |-
      Onder de vaste passiva worden afzonderlijk opgenomen het eigen vermogen, de voorzieningen en de vaste schulden, met
      een rentetypische looptijd van één jaar of langer.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel41
  - number: '42.1'
    text: Het eigen vermogen bestaat uit de reserves en het resultaat na bestemming volgend uit de programmarekening.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel42
  - number: '42.2'
    text: Het in het eerste lid bedoelde resultaat wordt afzonderlijk opgenomen als onderdeel van het eigen vermogen.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel42
  - number: '43.1'
    text: 'In de balans worden de reserves onderscheiden naar:'
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel43
  - number: 43.1.a
    text: de algemene reserve;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel43
  - number: 43.1.b
    text: de bestemmingsreserves.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel43
  - number: '43.2'
    text: |-
      Een bestemmingsreserve is een reserve waaraan provinciale staten respectievelijk de raad een bepaalde bestemming
      heeft gegeven.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel43
  - number: '44.1'
    text: 'Voorzieningen worden gevormd wegens:'
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel44
  - number: 44.1.a
    text: verplichtingen en verliezen waarvan de omvang op de balansdatum onzeker is, doch redelijkerwijs te schatten;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel44
  - number: 44.1.b
    text: |-
      op de balansdatum bestaande risico's ter zake van bepaalde te verwachten verplichtingen of verliezen waarvan de
      omvang redelijkerwijs is te schatten;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel44
  - number: 44.1.c
    text: |-
      kosten die in een volgend begrotingsjaar zullen worden gemaakt, mits het maken van die kosten zijn oorsprong
      mede vindt in het begrotingsjaar of in een voorafgaand begrotingsjaar en de voorziening strekt tot gelijkmatige
      verdeling van lasten over een aantal begrotingsjaren.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel44
  - number: '44.2'
    text: |-
      Tot de voorzieningen worden ook gerekend van derden verkregen middelen die specifiek besteed moeten worden, met
      uitzondering van de voorschotbedragen, bedoeld in [artikel 49, onderdeel b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014606#Artikel49
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0014606
        artikel: '49'
        hoofdstuk: IV
        paragraaf: 4.5.6
  - number: '44.3'
    text: |-
      Voorzieningen worden niet gevormd voor jaarlijks terugkerende arbeidskosten gerelateerde verplichtingen van
      vergelijkbaar volume.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel44
  - number: '45'
    text: Rentetoevoegingen aan voorzieningen zijn niet toegestaan.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel45
  - number: '46'
    text: 'In de balans worden onder de vaste schulden afzonderlijk opgenomen:'
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel46
  - number: 46.a
    text: obligatieleningen;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel46
  - number: 46.b
    text: 'onderhandse leningen van:'
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel46
  - number: 46.b.1
    text: binnenlandse pensioenfondsen en verzekeringsinstellingen;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel46
  - number: 46.b.2
    text: binnenlandse banken en overige financiële instellingen;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel46
  - number: 46.b.3
    text: binnenlandse bedrijven;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel46
  - number: 46.b.4
    text: overige binnenlandse sectoren;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel46
  - number: 46.b.5
    text: buitenlandse instellingen, fondsen, banken, bedrijven en overige sectoren;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel46
  - number: 46.c
    text: door derden belegde gelden;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel46
  - number: 46.d
    text: waarborgsommen.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel46
  - number: '47'
    text: |-
      Onder de vlottende passiva worden afzonderlijk opgenomen de netto-vlottende schulden, met een rentetypische
      looptijd korter dan één jaar en de overlopende passiva.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel47
  - number: '48'
    text: 'In de balans worden onder de netto-vlottende schulden afzonderlijk opgenomen:'
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel48
  - number: 48.a
    text: kasgeldleningen;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel48
  - number: 48.b
    text: bank- en girosaldi;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel48
  - number: 48.c
    text: overige schulden.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel48
  - number: '49'
    text: 'In de balans worden onder de overlopende passiva afzonderlijk opgenomen:'
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel49
  - number: 49.a
    text: |-
      verplichtingen die in het begrotingsjaar zijn opgebouwd en die in een volgend begrotingsjaar tot betaling komen,
      met uitzondering van jaarlijks terugkerende arbeidskosten gerelateerde verplichtingen van vergelijkbaar volume;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel49
  - number: 49.b
    text: |-
      de van de Europese en Nederlandse overheidslichamen ontvangen voorschotbedragen voor uitkeringen met een specifiek
      bestedingsdoel die dienen ter dekking van lasten van volgende begrotingsjaren;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel49
  - number: 49.c
    text: overige vooruit ontvangen bedragen die ten bate van volgende begrotingsjaren komen.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel49
  - number: '50'
    text: |-
      Aan de passiefzijde van de balans wordt buiten de balanstelling opgenomen het bedrag waartoe aan natuurlijke en
      rechtspersonen borgstellingen of garantstellingen zijn verstrekt.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel50
  - number: '51'
    text: |-
      In de toelichting op de balans wordt aangegeven volgens welke methoden de afschrijvingen worden berekend. Ook
      wordt aangegeven welke investeringen in de openbare ruimte met een maatschappelijk nut worden geactiveerd, welke
      afschrijvingstermijn hiervoor wordt voorzien en welke reserves hiervoor naar verwachting beschikbaar zullen zijn.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel51
  - number: '52.1'
    text: 'In de toelichting op de balans worden onder de materiële vaste activa afzonderlijk opgenomen:'
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel52
  - number: 52.1.a
    text: gronden en terreinen;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel52
  - number: 52.1.b
    text: woonruimten;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel52
  - number: 52.1.c
    text: bedrijfsgebouwen;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel52
  - number: 52.1.d
    text: grond-, weg- en waterbouwkundige werken;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel52
  - number: 52.1.e
    text: vervoermiddelen;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel52
  - number: 52.1.f
    text: machines, apparaten en installaties;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel52
  - number: 52.1.g
    text: overige materiële vaste activa.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel52
  - number: '52.2'
    text: |-
      In de toelichting op de balans wordt het verloop van de activa, als bedoeld in het eerste lid, gedurende het
      begrotingsjaar, in een sluitend overzicht weergegeven. Daaruit blijken, voor zover van toepassing:
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel52
  - number: 52.2.a
    text: de boekwaarde aan het begin van het begrotingsjaar;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel52
  - number: 52.2.b
    text: de investeringen of desinvesteringen;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel52
  - number: 52.2.c
    text: de afschrijvingen;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel52
  - number: 52.2.d
    text: bijdragen van derden direct gerelateerd aan een actief;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel52
  - number: 52.2.e
    text: afwaarderingen wegens duurzame waardeverminderingen;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel52
  - number: 52.2.f
    text: de boekwaarde aan het einde van het begrotingsjaar.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel52
  - number: 52a.1
    text: |-
      In de toelichting op de balans wordt per uitkering met een specifiek bestedingsdoel het verloop gedurende het
      jaar van de ontvangen voorschotbedragen, bedoeld in [artikel 49, onderdeel b][ref1], in een overzicht weergegeven.
      Daaruit blijken:


      [ref1]: https://wetten.overheid.nl/BWBR0014606#Artikel49
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel52a
    references:
      - id: ref1
        bwb_id: BWBR0014606
        artikel: '49'
        hoofdstuk: IV
        paragraaf: 4.5.6
  - number: 52a.1.a
    text: het saldo aan het begin van het begrotingsjaar;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel52a
  - number: 52a.1.b
    text: de toevoegingen;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel52a
  - number: 52a.1.c
    text: de vrijgevallen bedragen;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel52a
  - number: 52a.1.d
    text: het saldo aan het einde van het begrotingsjaar.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel52a
  - number: 52a.2
    text: |-
      In de toelichting op de balans wordt per uitkering met een specifiek bestedingsdoel het verloop gedurende het
      jaar van de nog te ontvangen voorschotbedragen, bedoeld in [artikel 40a, onderdeel a][ref1], in een overzicht
      weergegeven. Daaruit blijken:


      [ref1]: https://wetten.overheid.nl/BWBR0014606#Artikel40a
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel52a
    references:
      - id: ref1
        bwb_id: BWBR0014606
        artikel: 40a
        hoofdstuk: IV
        paragraaf: 4.5.4
  - number: 52a.2.a
    text: het saldo aan het begin van het begrotingsjaar;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel52a
  - number: 52a.2.b
    text: de toevoegingen;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel52a
  - number: 52a.2.c
    text: de ontvangen bedragen;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel52a
  - number: 52a.2.d
    text: het saldo aan het einde van het begrotingsjaar.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel52a
  - number: 52b
    text: |-
      De aard en omvang van de aangebrachte dan wel geraamde waardeverminderingen van de leningen en vorderingen,
      bedoeld in [artikel 63, achtste lid][ref1], van de vaste activa, bedoeld in [artikel 65, eerste lid][ref2], en
      van de deelnemingen en voorraden, bedoeld in [artikel 65, tweede lid][ref3], worden in de toelichting op de balans
      opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0014606#Artikel63
      [ref2]: https://wetten.overheid.nl/BWBR0014606#Artikel65
      [ref3]: https://wetten.overheid.nl/BWBR0014606#Artikel65
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel52b
    references:
      - id: ref1
        bwb_id: BWBR0014606
        artikel: '63'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0014606
        artikel: '65'
        hoofdstuk: V
      - id: ref3
        bwb_id: BWBR0014606
        artikel: '65'
        hoofdstuk: V
  - number: '53'
    text: |-
      In de toelichting op de balans worden de niet in de balans opgenomen belangrijke financiële verplichtingen vermeld
      waaraan de provincie of de gemeente voor toekomstige jaren is verbonden.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel53
  - number: '54.1'
    text: |-
      In de toelichting op de balans worden de aard en reden van elke reserve en de toevoegingen en onttrekkingen daaraan
      toegelicht.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel54
  - number: '54.2'
    text: 'Per reserve wordt het verloop gedurende het jaar in een overzicht weergegeven. Daaruit blijken:'
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel54
  - number: 54.2.a
    text: het saldo aan het begin van het begrotingsjaar;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel54
  - number: 54.2.b
    text: de toevoegingen of onttrekkingen via de resultaatbestemming bij de programmarekening;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel54
  - number: 54.2.c
    text: de toevoegingen of onttrekkingen uit hoofde van de bestemming van het resultaat van het voorgaande boekjaar;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel54
  - number: 54.2.d
    text: de verminderingen in verband met afschrijvingen op activa waarvoor een specifieke bestemmingsreserve is gevormd;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel54
  - number: 54.2.e
    text: het saldo aan het einde van het begrotingsjaar.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel54
  - number: '55.1'
    text: |-
      In de toelichting op de balans worden de aard en reden van de voorzieningen, bedoeld in [artikel 44][ref1] en de
      wijzigingen daarin toegelicht.


      [ref1]: https://wetten.overheid.nl/BWBR0014606#Artikel44
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0014606
        artikel: '44'
        hoofdstuk: IV
        paragraaf: 4.5.5
  - number: '55.2'
    text: 'Per voorziening wordt het verloop gedurende het jaar in een overzicht weergegeven. Daaruit blijken:'
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel55
  - number: 55.2.a
    text: het saldo aan het begin van het begrotingsjaar;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel55
  - number: 55.2.b
    text: de toevoegingen;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel55
  - number: 55.2.c
    text: ten gunste van de rekening van baten en lasten vrijgevallen bedragen;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel55
  - number: 55.2.d
    text: de aanwendingen;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel55
  - number: 55.2.e
    text: saldo aan het einde van het begrotingsjaar.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel55
  - number: '56'
    text: |-
      In de toelichting op de balans wordt de rentelast voor het begrotingsjaar vermeld van alle vaste schulden, genoemd
      in [artikel 46][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014606#Artikel46
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0014606
        artikel: '46'
        hoofdstuk: IV
        paragraaf: 4.5.5
  - number: '57.1'
    text: |-
      In de toelichting op de balans worden de borgstellingen, bedoeld in [artikel 50][ref1], gespecificeerd naar de aard
      van de geldleningen.


      [ref1]: https://wetten.overheid.nl/BWBR0014606#Artikel50
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0014606
        artikel: '50'
        hoofdstuk: IV
        paragraaf: 4.5.6
  - number: '57.2'
    text: 'Per specificatie wordt vermeld:'
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel57
  - number: 57.2.a
    text: het oorspronkelijk bedrag van de gewaarborgde geldlening;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel57
  - number: 57.2.b
    text: het percentage van het leningbedrag waarvoor borgstelling is verleend;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel57
  - number: 57.2.c
    text: het restantbedrag van de lening bij aanvang van het begrotingsjaar;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel57
  - number: 57.2.d
    text: het restantbedrag van de lening aan het eind van het begrotingsjaar.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel57
  - number: '57.3'
    text: |-
      In de toelichting op de balans wordt een specificatie opgenomen van de garantstellingen als bedoeld in
      [artikel 50][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014606#Artikel50
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0014606
        artikel: '50'
        hoofdstuk: IV
        paragraaf: 4.5.6
  - number: '57.4'
    text: |-
      In de toelichting wordt ook opgenomen het totaalbedrag van de betalingen die inzake de borg- en garantstelling zijn
      gedaan tot en met het eind van het begrotingsjaar.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel57
  - number: '58'
    text: |-
      [Artikel 29][ref1] is van overeenkomstige toepassing op de balans.


      [ref1]: https://wetten.overheid.nl/BWBR0014606#Artikel29
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0014606
        artikel: '29'
        hoofdstuk: IV
  - number: 58a.1
    text: |-
      Bij de jaarrekening is een bijlage gevoegd waarin verantwoordingsinformatie over specifieke uitkeringen wordt
      verstrekt op basis van indicatoren.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel58a
  - number: 58a.2
    text: |-
      Onze Minister stelt, in overeenstemming met Onze Minister wie het aangaat, bij ministeriële regeling een model
      vast voor de in het eerste lid bedoelde bijlage en bepaalt daarbij over welke specifieke uitkeringen daarin
      verantwoordingsinformatie wordt opgenomen en welke indicatoren worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel58a
  - number: '59.1'
    text: Alle investeringen met een economisch nut worden geactiveerd.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel59
  - number: '59.2'
    text: |-
      Investeringen hebben een economisch nut indien ze verhandelbaar zijn en/of indien ze kunnen bijdragen aan het
      genereren van middelen.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel59
  - number: '59.3'
    text: In afwijking van het eerste lid worden kunstvoorwerpen met een cultuur-historische waarde niet geactiveerd.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel59
  - number: '59.4'
    text: Investeringen in de openbare ruimte met een maatschappelijk nut kunnen worden geactiveerd.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel59
  - number: '60'
    text: 'Kosten van onderzoek en ontwikkeling voor een bepaald actief kunnen worden geactiveerd indien:'
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel60
  - number: 60.a
    text: het voornemen bestaat het actief te gebruiken of te verkopen;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel60
  - number: 60.b
    text: de technische uitvoerbaarheid om het actief te voltooien vaststaat;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel60
  - number: 60.c
    text: het actief in de toekomst economisch of maatschappelijk nut zal genereren en;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel60
  - number: 60.d
    text: de uitgaven die aan het actief zijn toe te rekenen betrouwbaar kunnen worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel60
  - number: '61'
    text: 'Bijdragen aan activa in eigendom van derden kunnen worden geactiveerd, indien:'
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel61
  - number: 61.a
    text: er sprake is van een investering door een derde;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel61
  - number: 61.b
    text: de investering bijdraagt aan de publieke taak;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel61
  - number: 61.c
    text: de derde zich heeft verplicht tot het daadwerkelijk investeren, op een wijze zoals is overeengekomen en;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel61
  - number: 61.d
    text: |-
      de bijdrage kan worden teruggevorderd, indien de derde in gebreke blijft of de provincie onderscheidenlijk gemeente
      anders recht kan doen gelden op de activa die samenhangen met de investering.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel61
  - number: '62.1'
    text: Alle vaste activa worden voor het bedrag van de investering geactiveerd.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel62
  - number: '62.2'
    text: |-
      In afwijking van het eerste lid mogen bijdragen van derden die in directe relatie staan met een actief op de
      waardering daarvan in mindering worden gebracht.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel62
  - number: '62.3'
    text: |-
      In afwijking van het eerste lid mogen reserves in mindering worden gebracht op investeringen, als bedoeld in
      [artikel 59, het vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014606#Artikel59
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0014606
        artikel: '59'
        hoofdstuk: V
  - number: '63.1'
    text: Activa worden gewaardeerd op basis van de verkrijgings- of vervaardigingsprijs.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel63
  - number: '63.2'
    text: De verkrijgingsprijs omvat de inkoopprijs en de bijkomende kosten.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel63
  - number: '63.3'
    text: |-
      De vervaardigingsprijs omvat de aanschaffingskosten van de gebruikte grond- en hulpstoffen en de overige kosten,
      welke rechtstreeks aan de vervaardiging kunnen worden toegerekend. In de vervaardigingsprijs kunnen voorts worden
      opgenomen een redelijk deel van de indirecte kosten en de rente over het tijdvak dat aan de vervaardiging van het
      actief kan worden toegerekend; in dat geval vermeldt de toelichting dat deze rente is geactiveerd.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel63
  - number: '63.4'
    text: |-
      Voor in erfpacht uitgegeven gronden geldt de uitgifteprijs van eerste uitgifte als verkrijgingsprijs. Gronden in
      eeuwigdurende erfpacht worden gewaardeerd tegen registratiewaarde.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel63
  - number: '63.5'
    text: |-
      Van activa waarvan de bestemming verandert, wordt de actuele waarde van de nieuwe bestemming in de toelichting op
      de balans opgenomen.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel63
  - number: '63.6'
    text: |-
      In afwijking van het eerste lid is waardering tegen actuele waarde toegestaan voor de activa van de Nazorgfondsen
      bedoeld in [artikel 15.47 van de Wet milieubeheer][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel15
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '15'
  - number: '63.7'
    text: |-
      Passiva worden gewaardeerd tegen de nominale waarde, met uitzondering van voorzieningen die tegen contante waarde
      zijn gewaardeerd.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel63
  - number: '63.8'
    text: Eventuele voorzieningen wegens oninbaarheid worden met de boekwaarde van leningen en vorderingen verrekend.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel63
  - number: '64.1'
    text: De afschrijvingen geschieden onafhankelijk van het resultaat van het boekjaar.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel64
  - number: '64.2'
    text: |-
      Slechts om gegronde redenen mogen de afschrijvingen geschieden op andere grondslagen dan die welke in het
      voorafgaande begrotingsjaar zijn toegepast. De reden van de verandering wordt in de toelichting op de balans
      uiteengezet. Tevens wordt inzicht gegeven in haar betekenis voor de financiële positie en voor de baten en de
      lasten aan de hand van aangepaste cijfers voor het begrotingsjaar of voor het voorafgaande begrotingsjaar.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel64
  - number: '64.3'
    text: |-
      Op vaste activa met een beperkte gebruiksduur, waaronder begrepen de financiële vaste activa, bedoeld in
      [artikel 36, onderdeel e][ref1], wordt jaarlijks afgeschreven volgens een stelsel dat is afgestemd op de verwachte
      toekomstige gebruiksduur.


      [ref1]: https://wetten.overheid.nl/BWBR0014606#Artikel36
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0014606
        artikel: '36'
        hoofdstuk: IV
        paragraaf: 4.5.3
  - number: '64.4'
    text: |-
      In afwijking van het eerste en het derde lid kan er op de activa, bedoeld in [artikel 59, vierde lid][ref1], extra
      worden afgeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0014606#Artikel59
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0014606
        artikel: '59'
        hoofdstuk: V
  - number: '64.5'
    text: |-
      In afwijking van het derde lid is de afschrijvingsduur voor de immateriële vaste activa, bedoeld in
      [artikel 34 onder a][ref1], maximaal gelijk aan de looptijd van de lening.


      [ref1]: https://wetten.overheid.nl/BWBR0014606#Artikel34
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0014606
        artikel: '34'
        hoofdstuk: IV
        paragraaf: 4.5.3
  - number: '64.6'
    text: |-
      In afwijking van het derde lid is de afschrijvingsduur voor de immateriële vaste activa, bedoeld in
      [artikel 34 onder b][ref1], ten hoogste vijf jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0014606#Artikel34
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0014606
        artikel: '34'
        hoofdstuk: IV
        paragraaf: 4.5.3
  - number: '65.1'
    text: |-
      Naar verwachting duurzame waardeverminderingen van vaste activa worden onafhankelijk van het resultaat van het
      boekjaar in aanmerking genomen.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel65
  - number: '65.2'
    text: |-
      Voorraden en deelnemingen worden tegen de marktwaarde gewaardeerd indien de marktwaarde lager is dan de
      verkrijgings- of vervaardigingsprijs.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel65
  - number: '65.3'
    text: |-
      Een actief dat buiten gebruik wordt gesteld wordt afgewaardeerd op het moment van buitengebruikstelling, indien de
      restwaarde lager is dan de boekwaarde.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel65
  - number: '66.1'
    text: 'De uitvoeringsinformatie bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel66
  - number: 66.1.a
    text: de productenraming en toelichting ten tijde van de begroting;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel66
  - number: 66.1.b
    text: de productenrealisatie en toelichting ten tijde van de jaarstukken.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel66
  - number: '66.2'
    text: 'De productenraming respectievelijk productenrealisatie bevat:'
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel66
  - number: 66.2.a
    text: de uitwerking van de programma's in producten;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel66
  - number: 66.2.b
    text: de geraamde respectievelijk gerealiseerde baten, lasten en het saldo per product;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel66
  - number: 66.2.c
    text: het verdelingsprincipe waarmee de producten over de programma's zijn verdeeld.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel66
  - number: '66.3'
    text: |-
      De productenraming respectievelijk productenrealisatie is integraal en omvat dezelfde totaalbedragen als de
      begroting respectievelijk de jaarstukken.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel66
  - number: '66.4'
    text: Producten zijn eenheden waarin de programma's zijn onderverdeeld.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel66
  - number: '66.5'
    text: |-
      De indeling van en de verdelingsprincipes behorende bij de productenrealisatie zijn identiek aan die van de
      productenraming.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel66
  - number: '67.1'
    text: De toelichting op de productenraming bestaat ten minste uit een overzicht van kapitaallasten.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel67
  - number: '67.2'
    text: 'De toelichting op de productenrealisatie bestaat ten minste uit:'
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel67
  - number: 67.2.a
    text: een overzicht van kapitaallasten;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel67
  - number: 67.2.b
    text: een lijst van verbonden partijen;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel67
  - number: 67.2.c
    text: de toelichting op onderhanden werk inzake grondexploitatie, bedoeld in artikel 38, onder a, onder 1 en onder b.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel67
  - number: '68'
    text: 'In het overzicht van de kapitaallasten wordt de volgende informatie gegeven:'
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel68
  - number: 68.a
    text: de afschrijvingen;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel68
  - number: 68.b
    text: de toegerekende rente.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel68
  - number: '69'
    text: 'In de lijst van verbonden partijen wordt ten minste de volgende informatie verstrekt over verbonden partijen:'
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel69
  - number: 69.a
    text: de naam en de vestigingsplaats;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel69
  - number: 69.b
    text: het openbaar belang dat op deze wijze behartigd wordt;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel69
  - number: 69.c
    text: |-
      de veranderingen die zich hebben voorgedaan gedurende het begrotingsjaar in het belang dat de gemeente
      onderscheidenlijk provincie in de verbonden partij heeft;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel69
  - number: 69.d
    text: |-
      het eigen vermogen en het vreemd vermogen van de verbonden partij aan het begin en aan het einde van het
      begrotingsjaar;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel69
  - number: 69.e
    text: het resultaat van de verbonden partij.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel69
  - number: '70.1'
    text: |-
      In de toelichting op het onderhanden werk inzake grondexploitatie wordt voor het totaal van de in exploitatie
      zijnde complexen aangegeven:
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel70
  - number: 70.1.a
    text: de boekwaarde aan het begin van het begrotingsjaar;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel70
  - number: 70.1.b
    text: de vermeerderingen in het begrotingsjaar;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel70
  - number: 70.1.c
    text: de verminderingen in het begrotingsjaar;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel70
  - number: 70.1.d
    text: de boekwaarde aan het einde van het begrotingsjaar;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel70
  - number: 70.1.e
    text: de geraamde nog te maken kosten en een onderbouwing hiervan;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel70
  - number: 70.1.f
    text: de geraamde opbrengsten en een onderbouwing hiervan;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel70
  - number: 70.1.g
    text: het geraamde eindresultaat;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel70
  - number: 70.1.h
    text: een uiteenzetting van de wijze waarop eventuele nadelige resultaten worden opgevangen.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel70
  - number: '70.2'
    text: Van de nog niet in exploitatie genomen gronden wordt de gemiddelde boekwaarde per m2 vermeld.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel70
  - number: '71.1'
    text: 'Uit de productenraming wordt de volgende informatie voor derden gegenereerd:'
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel71
  - number: 71.1.a
    text: 'een conversietabel producten – programma''s waarin wordt aangegeven:'
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel71
  - number: 71.1.a.1
    text: welke producten onder welk programma vallen, inclusief de verdeelsleutel;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel71
  - number: 71.1.a.2
    text: wat de baten, de lasten en het saldo per product zijn;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel71
  - number: 71.1.b
    text: 'een conversietabel producten – functies, waarin wordt aangegeven:'
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel71
  - number: 71.1.b.1
    text: de baten en lasten volgens de functionele indeling;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel71
  - number: 71.1.b.2
    text: per functie de producten die er aan zijn toegerekend;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel71
  - number: 71.1.b.3
    text: het verdelingsprincipe waarmee de producten over de functies zijn verdeeld;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel71
  - number: '71.2'
    text: De functionele indeling wordt bij ministeriële regeling vastgesteld.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel71
  - number: '71.3'
    text: |-
      De informatie bedoeld in het eerste lid wordt voor 15 november van het jaar voorafgaand aan het begrotingsjaar, aan
      Onze Minister onderscheidenlijk gedeputeerde staten en het CBS gezonden.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel71
  - number: '72.1'
    text: 'Uit de productenrealisatie wordt de volgende informatie voor derden gegenereerd:'
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel72
  - number: 72.1.a
    text: 'een conversietabel producten – programma''s waarin wordt aangegeven:'
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel72
  - number: 72.1.a.1
    text: welke producten onder welk programma vallen, inclusief de verdeelsleutel;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel72
  - number: 72.1.a.2
    text: wat de baten, de lasten en het saldo per product zijn;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel72
  - number: 72.1.b
    text: 'verdelingsinformatie bestaande uit:'
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel72
  - number: 72.1.b.1
    text: de baten en lasten, kostenplaatsen en balansmutaties volgens de verdelingsmatrix;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel72
  - number: 72.1.b.2
    text: per functie de producten die er aan zijn toegerekend;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel72
  - number: 72.1.b.3
    text: het verdelingsprincipe waarmee de producten over de functies zijn verdeeld.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel72
  - number: '72.2'
    text: De verdelingsmatrix wordt bij ministeriële regeling vastgesteld.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel72
  - number: '72.3'
    text: |-
      De informatie bedoeld in het eerste lid wordt voor 15 juli van het jaar, volgend op het begrotingsjaar, ondertekend
      door gedeputeerde staten onderscheidenlijk het college aan Onze Minister onderscheidenlijk gedeputeerde staten en
      het CBS gezonden.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel72
  - number: '72.4'
    text: |-
      Het CBS toetst de informatie bedoeld in het eerste lid, onder b, onder 1, op plausibiliteit en stuurt de resultaten
      daarvan op naar gedeputeerde staten onderscheidenlijk het college.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel72
  - number: '72.5'
    text: |-
      Bij de informatie bedoeld in het eerste lid betreffende het begrotingsjaar 2004 wordt een accountantsverklaring
      gevraagd. Bij belangrijke wijzigingen in de administratie kan Onze Minister onderscheidenlijk gedeputeerde staten
      een accountantsverklaring aan gedeputeerde staten onderscheidenlijk het college vragen.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel72
  - number: '73'
    text: |-
      Indien de informatie voor derden niet voldoende inzicht biedt kan Onze Minister een deelverantwoording over een
      afzonderlijk deel van de provincie onderscheidenlijk gemeente vragen.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel73
  - number: '74.1'
    text: 'Ieder kwartaal wordt de volgende informatie voor derden verstrekt:'
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel74
  - number: 74.1.a
    text: |-
      de baten en lasten, kostenplaatsen en balansmutaties volgens de verdelingsmatrix, als bedoeld in artikel 72, tweede
      lid;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel74
  - number: 74.1.b
    text: 'de stand van zaken betreffende de volgende activa:'
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel74
  - number: 74.1.b.1
    text: |-
      de financiële vaste activa, als bedoeld in [artikel 36, onder a tot en met d][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0014606#Artikel36
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0014606
        artikel: '36'
        hoofdstuk: IV
        paragraaf: 4.5.3
  - number: 74.1.b.2
    text: |-
      de uitzettingen, als bedoeld in [artikel 39][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0014606#Artikel39
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0014606
        artikel: '39'
        hoofdstuk: IV
        paragraaf: 4.5.4
  - number: 74.1.b.3
    text: |-
      de liquide middelen, als bedoeld in [artikel 40][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0014606#Artikel40
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0014606
        artikel: '40'
        hoofdstuk: IV
        paragraaf: 4.5.4
  - number: 74.1.b.4
    text: de overlopende activa;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel74
  - number: 74.1.c
    text: 'de stand van zaken betreffende de volgende passiva:'
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel74
  - number: 74.1.c.1
    text: |-
      de vaste schulden, als bedoeld en onderverdeeld in [artikel 46][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0014606#Artikel46
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0014606
        artikel: '46'
        hoofdstuk: IV
        paragraaf: 4.5.5
  - number: 74.1.c.2
    text: |-
      de netto-vlottende schulden, als bedoeld en onderverdeeld in [artikel 48][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0014606#Artikel48
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0014606
        artikel: '48'
        hoofdstuk: IV
        paragraaf: 4.5.6
  - number: 74.1.c.3
    text: de overlopende passiva.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel74
  - number: '74.2'
    text: |-
      De informatie genoemd in het eerste lid wordt, ondertekend door gedeputeerde staten onderscheidenlijk het college,
      binnen één maand na afloop van het kwartaal gezonden aan het CBS.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel74
  - number: '74.3'
    text: |-
      Het CBS toetst de informatie bedoeld in het eerste lid op plausibiliteit en stuurt de resultaten daarvan op naar
      gedeputeerde staten onderscheidenlijk het college.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel74
  - number: '75.1'
    text: Er is een commissie voor het Besluit begroting en verantwoording provincies en gemeenten.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel75
  - number: '75.2'
    text: |-
      De commissie draagt zorg voor een eenduidige uitvoering en toepassing van dit besluit. De commissie draagt daartoe
      ten minste zorg voor:
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel75
  - number: 75.2.a
    text: een document dat de eenduidige interpretatie bevordert;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel75
  - number: 75.2.b
    text: de beantwoording van vragen.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel75
  - number: '75.3'
    text: 'De commissie bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel75
  - number: 75.3.a
    text: één onafhankelijk voorzitter;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel75
  - number: 75.3.b
    text: één secretaris;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel75
  - number: 75.3.c
    text: drie leden werkzaam als financieel ambtenaar bij gemeenten;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel75
  - number: 75.3.d
    text: één lid werkzaam bij de Vereniging van Nederlandse Gemeenten;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel75
  - number: 75.3.e
    text: twee leden werkzaam bij een provincie;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel75
  - number: 75.3.f
    text: één lid werkzaam bij het Ministerie van Financiën;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel75
  - number: 75.3.g
    text: één lid werkzaam bij het CBS;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel75
  - number: 75.3.h
    text: één lid werkzaam in de provinciale of gemeentelijke accountancy;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel75
  - number: 75.3.i
    text: één lid werkzaam als gemeentesecretaris;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel75
  - number: 75.3.j
    text: één lid werkzaam als raadsgriffier of statengriffier;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel75
  - number: 75.3.k
    text: één lid werkzaam als inspecteur bij de Inspectie Financiën Lokale en provinciale Overheden.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel75
  - number: '75.4'
    text: |-
      De leden van de commissie hebben op persoonlijke titel zitting in de commissie en nemen deel aan de vergaderingen
      zonder last.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel75
  - number: '75.5'
    text: |-
      Onze Minister benoemt en ontslaat de voorzitter, bedoeld in het derde lid, onder a, wijst een secretaris aan uit
      een van zijn ambtenaren en voorziet in het secretariaat.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel75
  - number: '75.6'
    text: |-
      De voorzitter benoemt de leden, bedoeld in het derde lid, onder c tot en met k. De benoeming geschiedt op
      voordracht van:
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel75
  - number: 75.6.a
    text: |-
      de Vereniging van Nederlandse Gemeenten voor twee van de leden, bedoeld in het derde lid onder c en voor het lid,
      bedoeld in het derde lid onder d;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel75
  - number: 75.6.b
    text: |-
      de Vereniging Federatie van Algemene Middelenmanagers bij de Overheid voor één van de leden, bedoeld in het derde
      lid onder c;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel75
  - number: 75.6.c
    text: het Interprovinciaal Overleg voor de leden, bedoeld, in het derde lid onder e;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel75
  - number: 75.6.d
    text: de Minister van Financiën voor het lid, bedoeld in het derde lid onder f;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel75
  - number: 75.6.e
    text: het CBS voor het lid, bedoeld in het derde lid onder g;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel75
  - number: 75.6.f
    text: de Vereniging van Gemeentesecretarissen voor het lid, bedoeld in het derde lid onder i;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel75
  - number: 75.6.g
    text: de Vereniging van Griffiers voor het lid, bedoeld in het derde lid, onderdeel j;
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel75
  - number: 75.6.h
    text: Onze Minister voor het lid, bedoeld in het derde lid onder k.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel75
  - number: '75.7'
    text: |-
      Het lidmaatschap van de commissie vervalt zodra een lid niet langer werkzaam is op het terrein, aangegeven in het
      derde lid, dan wel een instanties als genoemd in het zesde lid onder a tot en met g, een andere persoon voordraagt
      als lid aan de voorzitter van de commissie.
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel75
  - number: '76.1'
    text: |-
      In afwijking van [artikel 63, eerste lid][ref1], worden activa, die op 31 december 1994 tegen actuele waarde zijn
      gewaardeerd, volgens de op dat moment aanwezige boekwaarde voor de rest van de periode afgeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0014606#Artikel63
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0014606
        artikel: '63'
        hoofdstuk: V
  - number: '76.2'
    text: |-
      In afwijking van [artikel 62, eerste lid][ref1], worden alle activa waar voor 31 december 2003 reserves op in
      mindering zijn gebracht op de waarde volgens de op 31 december 2003 aanwezige boekwaarde voor de rest van de
      periode afgeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0014606#Artikel62
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0014606
        artikel: '62'
        hoofdstuk: V
  - number: 76a.1
    text: |-
      De [artikelen 40a][ref1], [52a][ref2] en [52b][ref3] zijn niet van toepassing op de begrotingswijzigingen, de
      jaarstukken, de uitvoeringsinformatie en de informatie voor derden en de daarbij behorende toelichtingen voor het
      begrotingsjaar 2007.


      [ref1]: https://wetten.overheid.nl/BWBR0014606#Artikel40a
      [ref2]: https://wetten.overheid.nl/BWBR0014606#Artikel52a
      [ref3]: https://wetten.overheid.nl/BWBR0014606#Artikel52b
    url: https://wetten.overheid.nl/BWBR0014606/2007-08-17#Artikel76a
    references:
      - id: ref1
        bwb_id: BWBR0014606
        artikel: 40a
        hoofdstuk: IV
        paragraaf: 4.5.4
      - id: ref2
        bwb_id: BWBR0014606
        artikel: 52a
        hoofdstuk: IV
        paragraaf: 4.5.7
      - id: ref3
        bwb_id: BWBR0014606
        artikel: 52b
        hoofdstuk: IV
        paragraaf: 4.5.7
  - number: 76a.2
    text: |-
      Op de begrotingswijzigingen, de jaarstukken, de uitvoeringsinformatie en de informatie voor derden en de
      daarbij behorende toelichtingen voor het begrotingsjaar 2007, zijn de [artikelen 2, vierde lid][ref1],
      [19][ref2], [43][ref3], [44, tweede lid][ref4], [49][ref5], [55, eerste lid][ref6], [63, achtste lid][ref7],
      [64, derde lid][ref8], van toepassing zoals deze golden op 9 juli 2007.


      [ref1]: https://wetten.overheid.nl/BWBR0014606#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0014606#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0014606#Artikel43
      [ref4]: https://wetten.overheid.nl/BWBR0014606#Artikel44
