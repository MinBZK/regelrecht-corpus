  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 14 juli 2008,
    BJZ2008069974, Directie Bestuurlijke en Juridische Zaken, Afdeling Wetgeving;

    Gelet op artikel 5.16a, eerste en tweede lid, van de Wet milieubeheer;

    De Raad van State gehoord (advies van 14 augustus 2008, No. W08.08.0289/IV);

    Gezien het nader rapport van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 25
    november 2008, BJZ2008111820, Directie Bestuurlijke en Juridische Zaken, Afdeling Wetgeving;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0025181/2015-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder: - *gebouw:* gebouw als bedoeld in
      [artikel 1, eerste lid, van de Woningwet][ref1], met inbegrip van de daarbij behorende terreinen;
        - *provinciale weg:* autoweg als bedoeld in [artikel 1 van het Reglement verkeersregels en verkeerstekens 1990][ref2]
      of andere voor motorvoertuigen bestemde weg, voorzover in beheer bij een provincie;
        - *rijksweg:* autoweg of autosnelweg als bedoeld in
      [artikel 1 van het Reglement verkeersregels en verkeerstekens 1990][ref3], voor zover in beheer bij het Rijk;
        - *uitoefening van een bevoegdheid of toepassing van een wettelijk voorschrift:* uitoefening van een bevoegdheid of
      toepassing van een wettelijk voorschrift als bedoeld in [artikel 5.16, eerste lid, van de wet][ref4];
        - *wet:* [Wet milieubeheer.][ref5]


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0004825#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0004825#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0025181/2015-07-01#Artikel1
    references:
      - id: ref1
