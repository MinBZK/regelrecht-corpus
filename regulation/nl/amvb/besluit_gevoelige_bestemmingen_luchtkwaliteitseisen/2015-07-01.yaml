        artikel: '5'
      - id: ref5
        bwb_id: BWBR0003245
  - number: '2.1'
    text: |-
      Indien de uitoefening van een bevoegdheid of toepassing van een wettelijk voorschrift betrekking heeft op een geval
      dat behoort tot een bij [artikel 3][ref1] aangewezen categorie waarvan de locatie geheel of gedeeltelijk is of zal
      zijn gelegen op een afstand van:


      [ref1]: https://wetten.overheid.nl/BWBR0025181#Artikel3
    url: https://wetten.overheid.nl/BWBR0025181/2015-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0025181
        artikel: '3'
        paragraaf: '2'
  - number: 2.1.a
    text: minder dan 300 meter vanaf de rand van een rijksweg, of
    url: https://wetten.overheid.nl/BWBR0025181/2015-07-01#Artikel2
  - number: 2.1.b
    text: minder dan 50 meter vanaf de rand van een provinciale weg,
    url: https://wetten.overheid.nl/BWBR0025181/2015-07-01#Artikel2
  - number: '2.2'
    text: |-
      Bij de uitvoering van dit besluit blijven op de [voorschriften 2.1a en 4.2 van bijlage 2 van de wet][ref1]
      berustende bepalingen buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0025181/2015-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003245
  - number: '3.1'
    text: |-
      Als categorieën van gevallen, bedoeld in [artikel 2][ref1], worden aangewezen gebouwen, geheel of gedeeltelijk
      bestemd of in gebruik:


      [ref1]: https://wetten.overheid.nl/BWBR0025181#Artikel2
    url: https://wetten.overheid.nl/BWBR0025181/2015-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0025181
        artikel: '2'
        paragraaf: '2'
  - number: 3.1.a
    text: ten behoeve van basisonderwijs, voortgezet onderwijs of overig onderwijs aan minderjarigen;
    url: https://wetten.overheid.nl/BWBR0025181/2015-07-01#Artikel3
  - number: 3.1.b
    text: ten behoeve van kinderopvang;
    url: https://wetten.overheid.nl/BWBR0025181/2015-07-01#Artikel3
  - number: 3.1.c
    text: als verzorgingstehuis, verpleegtehuis of bejaardentehuis;
    url: https://wetten.overheid.nl/BWBR0025181/2015-07-01#Artikel3
  - number: 3.1.d
    text: ten behoeve van een combinatie van functies als genoemd onder a, b of c.
    url: https://wetten.overheid.nl/BWBR0025181/2015-07-01#Artikel3
  - number: '3.2'
    text: |-
      De aanwijzing, bedoeld in het eerste lid, is van toepassing op nieuw te bouwen gebouwen alsmede op bestaande
      gebouwen indien deze worden uitgebreid of een functiewijziging ondergaan.
    url: https://wetten.overheid.nl/BWBR0025181/2015-07-01#Artikel3
  - number: '3.3'
    text: |-
      Indien de uitoefening van een bevoegdheid of toepassing van een wettelijk voorschrift als bedoeld in
      [artikel 2, eerste lid][ref1], betrekking heeft op de uitbreiding van een bestaand gebouw of op de uitbreiding
      van een door dat gebouw vervulde functie als bedoeld in het eerste lid is in afwijking van [artikel 2][ref2] een
      eenmalige toename van ten hoogste tien procent van het rechtens toegestane aantal personen dat op de desbetreffende
      locatie verblijft, toegestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0025181#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0025181#Artikel2
    url: https://wetten.overheid.nl/BWBR0025181/2015-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0025181
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0025181
        artikel: '2'
        paragraaf: '2'
  - number: '4'
    text: |-
      Bij ministeriële regeling kunnen, indien dat in het bijzonder noodzakelijk is voor een goede uitvoering van dit
      besluit, nadere regels worden gegeven omtrent de in dit besluit geregelde onderwerpen.
    url: https://wetten.overheid.nl/BWBR0025181/2015-07-01#Artikel4
  - number: '5'
    text: |-
      Dit besluit is niet van toepassing op een besluit dat met toepassing van [artikel 5.16 van de wet][ref1] is
      genomen vóór de inwerkingtreding van dit besluit, noch op de ter uitvoering daarvan strekkende besluiten, overige
      rechtshandelingen en feitelijke handelingen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel5
    url: https://wetten.overheid.nl/BWBR0025181/2015-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '5'
  - number: '6.1'
    text: |-
      Dit besluit, met uitzondering van [artikel 2, tweede lid][ref1], treedt in werking met ingang van de dag na de
      datum van uitgifte van het Staatsblad waarin het wordt geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0025181#Artikel2
    url: https://wetten.overheid.nl/BWBR0025181/2015-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0025181
        artikel: '2'
        paragraaf: '2'
  - number: '6.2'
    text: |-
      [Artikel 2, tweede lid][ref1], treedt in werking op het tijdstip waarop het bij koninklijke boodschap van 9
      september 2008 ingediende voorstel van wet tot wijziging van de Wet milieubeheer (implementatie en derogatie
      luchtkwaliteitseisen) (Kamerstukken II 2008/2009, 31 589, nr. 2), na tot wet te zijn verheven, in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0025181#Artikel2
    url: https://wetten.overheid.nl/BWBR0025181/2015-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0025181
        artikel: '2'
        paragraaf: '2'
  - number: '7'
    text: 'Dit besluit wordt aangehaald als: Besluit gevoelige bestemmingen (luchtkwaliteitseisen).'
    url: https://wetten.overheid.nl/BWBR0025181/2015-07-01#Artikel7
