preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Op de voordracht van Onze Minister van Economische Zaken van 25 maart 1964, no. 564/254, W.J.A./Mijnwezen;

    Gelet op artikel 9, eerste en derde lid, van de Mijnwet 1903 (Stb. 1904, 73);

    De Raad van State gehoord (advies van 6 mei 1964, no. 33);

    Gezien het nader rapport van Onze voornoemde Minister van 18 december 1964, no. S64/1230, W.J.A./Mijnwezen;

    Hebben goedgevonden en verstaan de volgende regeling vast te stellen:
  url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Voor de toepassing van het bij of krachtens dit reglement bepaalde wordt verstaan onder: *mijnwerk:* een geheel
      van werken, inrichtingen en terreinen als in [artikel 9, eerste lid, van de Mijnwet 1903][ref1] (*Stb.* 1904,
      73) bedoeld, met uitzondering van boorwerken; *ondergrondse werken:* de tot mijnwerken behorende onder de grond
      gelegen werken en inrichtingen, alsmede de beneden de oppervlakte gelegen toegangen tot die werken en inrichtingen;
      *bovengrondse werken:* de tot mijnwerken behorende overige werken en inrichtingen, alsmede de tot mijnwerken
      behorende terreinen; *schacht:* een hellende of verticale verbinding van de oppervlakte met de tot een mijnwerk
      behorende onder de grond gelegen werken en inrichtingen; *opbraak:* een verticale verbinding in de ondergrondse
      werken, die niet aan de oppervlakte uitmondt en die kan dienen voor vervoer; *tussenschacht:* een opbraak,
      waarin ingevolge dit reglement personenvervoer geoorloofd is; *boorwerk:* een geheel van werken, bestemd tot de
      machinale vervaardiging, de instandhouding en het gebruik van een of meer gaten in de aardbodem ten behoeve van
      het winnen of, door middel van het naar de oppervlakte voeren van grondmonsters, opsporen van delfstoffen als in
      [artikel 9, eerste lid, van de Mijnwet 1903][ref2] bedoeld, alsmede de bij die werken behorende inrichtingen en
      terreinen; *mijnbouwinstallatie:*


      [ref1]: https://wetten.overheid.nl/BWBR0001870#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0001870#Artikel9
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001870
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0001870
        artikel: '9'
  - number: 1.a
    text: |-
      een op of boven de bodem van een oppervlaktewater geplaatste inrichting voor het door middel van een diepboring
      instellen van een mijnbouwkundig onderzoek of het winnen van delfstoffen;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel1
  - number: 1.b
    text: |-
      een samenstel van op of boven de bodem van een oppervlaktewater geplaatste inrichtingen, waarvan er tenminste één
      aan de onder *a* gegeven omschrijving voldoet;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel1
  - number: '2'
    text: |-
      Indien uit de bewoordingen van een bepaling niet kan worden opgemaakt of deze geldt voor bovengrondse werken,
      ondergrondse werken, boorwerken of mijnbouwkundige onderzoekingen, wordt dit bepaald door de opschriften
      van hoofdstuk, paragraaf en afdeling, waarin de bepaling is opgenomen. Bevatten ook deze opschriften geen
      uitdrukkelijke aanduiding, dan geldt de bepaling algemeen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel2
  - number: '3'
    text: |-
      Indien een voorschrift in dit reglement een der termen: "veilig", "doelmatig" en "voldoende" inhoudt, kan Onze
      Minister terzake nadere regelen stellen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel3
  - number: '5.1'
    text: Ontheffingen worden uitsluitend verleend op een daartoe strekkende aanvraag.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel5
  - number: '5.2'
    text: Ontheffingen en vergunningen kunnen onder beperkingen of voorwaarden worden verleend.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel5
  - number: '5.3'
    text: 'Een ontheffing of vergunning kan worden ingetrokken, indien:'
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel5
  - number: 5.3.a
    text: |-
      de te harer verkrijging verstrekte gegevens zodanig onjuist of onvolledig blijken, dat de ontheffing of de
      vergunning niet zou zijn verleend als bij de beslissing de juiste omstandigheden volledig bekend waren geweest;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel5
  - number: 5.3.b
    text: |-
      de omstandigheden, op grond waarvan zij werd verleend, zich zodanig hebben gewijzigd, dat de ontheffing of de
      vergunning niet zou zijn verleend als op het tijdstip van de beslissing de gewijzigde omstandigheden aanwezig waren
      geweest;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel5
  - number: 5.3.c
    text: zij met het oog op gevaar voor lichamelijke schade niet gehandhaafd kan blijven;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel5
  - number: 5.3.d
    text: blijkt, dat aan een of meer voorwaarden, waaronder zij is verleend, niet wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel5
  - number: '6'
    text: |-
      De in dit reglement voorziene beschikkingen, waarbij aanwijzingen worden gegeven voor bijzondere gevallen, bepalen,
      indien nodig, de termijn, waarbinnen de uitvoering moet zijn aangevangen, alsmede de termijn, waarbinnen zij moet
      zijn voltooid.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel6
  - number: '7'
    text: |-
      Voor zover in dit reglement niet anders is bepaald, worden aanvragen om ontheffing of vergunning dan wel tot het
      nemen van enige andere in dit reglement voorziene beslissing tot Onze Minister gericht, doch ingediend bij de
      Inspecteur-Generaal der Mijnen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel7
  - number: 7a
    text: |-
      Ter bescherming van de veiligheid en de gezondheid van de arbeiders tijdens alle werkzaamheden dient elke bemande
      arbeidsplaats te allen tijde onder toezicht te staan van een verantwoordelijke persoon die voldoende hoedanigheden
      en bekwaamheden bezit om deze functie te vervullen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel7a
  - number: '8.1'
    text: |-
      Voor zover in dit reglement niet anders is bepaald, zijn de bestuurders van een mijnonderneming verplicht zorg
      te dragen voor de naleving in hun onderneming van de bij en krachtens dit reglement gegeven voorschriften en
      regelen. Zij dienen op gezette tijden de maatregelen die zijn genomen inzake de veiligheid en de gezondheid van de
      arbeiders, met inbegrip van het in artikel 14*g* bedoelde veiligheids- en gezondheidszorgsysteem, te onderzoeken om
      ervoor te zorgen dat de daarop betrekking hebbende bepalingen van dit besluit worden nageleefd.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel8
  - number: '8.2'
    text: |-
      Gelijke verplichting rust op personen in dienst van de onderneming, voor zover dezen door de bestuurders zijn
      belast met de zorg voor de naleving van die voorschriften en regelen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel8
  - number: '8.3'
    text: |-
      De bestuurders en de in het tweede lid bedoelde toezichthoudende personen worden geacht aan hun in het eerste
      onderscheidenlijk tweede lid bedoelde verplichting te hebben voldaan, wanneer zij de nodige instructies hebben
      gegeven, de nodige middelen hebben verschaft en het redelijkerwijs te vorderen toezicht hebben gehouden om
      de naleving van de voorschriften en regelen te verzekeren. De instructies moeten voor de betrokken arbeiders
      begrijpelijk zijn.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel8
  - number: '8.4'
    text: |-
      Voor elke arbeidsplaats moeten schriftelijke instructies worden opgesteld ter bepaling van de in acht te nemen
      regels ter garantie van de veiligheid en de gezondheid van de arbeiders en het veilig gebruik van materieel. Deze
      instructies moeten aanwijzingen bevatten betreffende het gebruik van noodapparatuur en de wijze waarop moet worden
      opgetreden ingeval zich op of nabij de arbeidsplaats een noodsituatie voordoet. Een ieder is verplicht hem gegeven
      instructies als in dit en het derde lid bedoeld op te volgen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel8
  - number: '8.5'
    text: |-
      Ter bescherming van de veiligheid en de gezondheid van de arbeiders moeten doelmatige voorzieningen in verband met
      voorlichting, opleiding, scholing en herscholing worden getroffen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel8
  - number: '8.6'
    text: |-
      Onverminderd de verplichting tot naleving van de bij en krachtens dit reglement gegeven voorschriften en regelen,
      die zich rechtstreeks tot hem richten, is een ieder verplicht tot elk handelen en elk nalaten, waardoor de naleving
      van de overige bij en krachtens dit reglement gegeven voorschriften en regelen kan worden verzekerd, voor zover dat
      handelen of nalaten redelijkerwijs van hem kan worden verwacht.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel8
  - number: 8a
    text: |-
      De kosten die zijn verbonden aan de naleving van de regels die bij of krachtens de bepalingen van dit besluit
      inzake de veiligheid, de hygiëne en de gezondheid op het werk zijn gesteld worden niet ten laste gebracht van door
      de mijnonderneming of de in artikel 12, eerste lid, bedoelde andere onderneming tewerkgestelde personen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel8a
  - number: 9a.1
    text: |-
      Arbeidsplaatsen moeten zodanig worden ontworpen, gebouwd, ingericht, bediend, gecontroleerd en onderhouden, dat
      zij aan de te verwachten omgevingskrachten weerstand kunnen bieden. Zij dienen een constructie en een stevigheid te
      hebben die zijn afgestemd op het gebruik dat ervan wordt gemaakt.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel9a
  - number: 9a.2
    text: |-
      Arbeidsplaatsen moeten volgens ergonomische beginselen worden ontworpen en gebouwd, waarbij ermee rekening wordt
      gehouden dat de arbeiders de werkzaamheden op hun werkplek kunnen volgen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel9a
  - number: 9a.3
    text: |-
      Arbeidsplaatsen moeten zodanig zijn ingericht, dat zij een afdoende bescherming tegen risico’s bieden. Zij moeten
      schoon worden gehouden en alle gevaarlijke stoffen moeten op zodanige wijze worden verwijderd of beveiligd dat zij
      de veiligheid en de gezondheid van de arbeiders niet in gevaar kunnen brengen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel9a
  - number: 9a.4
    text: |-
      Bij de inrichting van de arbeidsplaatsen moet in voorkomend geval met gehandicapte arbeiders rekening worden
      gehouden. Dit geldt met name voor deuren, verbindingswegen, trappen, doucheruimten, wasruimten, toiletten en
      werkplekken die rechtstreeks door gehandicapte arbeiders worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel9a
  - number: 9b.1
    text: |-
      De arbeiders of hun vertegenwoordigers worden ingelicht over de aard van de arbeid en de daaraan verbonden
      mogelijke risico’s en over de maatregelen die met betrekking tot de veiligheid en de gezondheid op de
      arbeidsplaatsen worden getroffen ter voorkoming of beperking van deze risico's. De informatie moet voor de
      betrokken arbeiders begrijpelijk zijn.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel9b
  - number: 9b.2
    text: |-
      De in het eerste lid bedoelde voorlichting richt zich onder meer op de beschermings- en preventiemaatregelen en
      -activiteiten, zowel voor de mijnonderneming in het algemeen als voor elk type werkplek en elke soort functie
      afzonderlijk, en op de maatregelen die krachtens de artikelen 176, 279 en 281, derde lid, zijn genomen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel9b
  - number: 9c.1
    text: |-
      De bestuurders van een mijnonderneming of in artikel 12, eerste lid, bedoelde andere onderneming wijzen een
      of meer arbeiders aan die zich met de activiteiten op het gebied van de bescherming tegen en de preventie van
      beroepsrisico’s op de mijn- of boorwerken of bij mijnbouwkundige onderzoekingen zullen bezighouden, behoudens het
      bepaalde in het derde lid.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel9c
  - number: 9c.2
    text: |-
      De aangewezen arbeiders mogen geen nadeel ondervinden van hun activiteiten op het gebied van de bescherming tegen
      en de preventie van beroepsrisico's. Zij moeten, ten einde de uit dit reglement voortvloeiende verplichtingen te
      kunnen nakomen, over voldoende tijd beschikken.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel9c
  - number: 9c.3
    text: |-
      Indien de mogelijkheden op de mijn- of boorwerken of bij mijnbouwkundige onderzoekingen onvoldoende zijn om deze
      beschermings- en preventieactiviteiten te organiseren, moet een beroep gedaan worden op deskundige personen of
      diensten van buiten de onderneming.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel9c
  - number: 9c.4
    text: |-
      Indien een beroep gedaan wordt op deskundigen als bedoeld in het derde lid, moeten de betrokken personen of
      diensten worden geïnformeerd over de factoren, waarvan bekend is of vermoed wordt dat zij van invloed zijn op
      de veiligheid en de gezondheid van de arbeiders, en toegang hebben tot alle in artikel 12, tweede lid, bedoelde
      informatie.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel9c
  - number: 9c.5
    text: 'In alle gevallen moeten:'
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel9c
  - number: 9c.5.a
    text: de aangewezen arbeiders over de benodigde capaciteiten en middelen beschikken,
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel9c
  - number: 9c.5.b
    text: |-
      de in het derde lid bedoelde personen of diensten de nodige bekwaamheden hebben en over de nodige personele en
      professionele middelen beschikken en
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel9c
  - number: 9c.5.c
    text: |-
      de aangewezen arbeiders en de geraadpleegde personen of diensten voldoende in aantal zijn om de beschermings-
      en preventieactiviteiten op zich te nemen, afhankelijk van de grootte van de mijn- of boorwerken en de risico’s
      waaraan de arbeiders zijn blootgesteld, en afhankelijk van de verdeling van de risico’s over het gehele mijn- of
      boorwerk.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel9c
  - number: 9c.6
    text: |-
      De in dit artikel bedoelde bescherming tegen en preventie van risico’s voor de veiligheid en de gezondheid kan
      worden opgedragen aan de veiligheidsdienst, bedoeld in artikel 144, en de bedrijfsgeneeskundige dienst, bedoeld in
      artikel 223. De diensten moeten voor zover nodig samenwerken.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel9c
  - number: 9c.7
    text: Onze Minister kan nadere regelen stellen ter zake van het in het eerste en vijfde lid bepaalde.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel9c
  - number: '10.1'
    text: |-
      De bestuurders van een mijnonderneming zijn verplicht aan de Inspecteur-Generaal der Mijnen onverwijld schriftelijk
      opgave te doen van de naam en de functie van de personen, die zij hebben belast met de zorg voor de naleving van de
      bij en krachtens dit reglement gegeven voorschriften en regelen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel10
  - number: '10.2'
    text: |-
      De bestuurders dienen voorts, ten aanzien van elk tot hun onderneming behorend mijn- of boorwerk, jaarlijks in de
      maand januari aan de Inspecteur-Generaal der Mijnen schriftelijk opgave te doen van de naam en de functie van de
      personen, die op 1 januari van het betrokken jaar een leidinggevende of toezichthoudende functie bij dat mijn- of
      boorwerk vervulden.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel10
  - number: '10.3'
    text: |-
      De bestuurders zijn verplicht aan de Inspecteur-Generaal der Mijnen onverwijld een exemplaar toe te zenden van de
      algemene schriftelijke instructies, die zij aan het personeel hunner onderneming hebben gegeven ter verzekering van
      de naleving van de bij en krachtens dit reglement gegeven voorschriften en regelen betreffende de veiligheid, de
      gezondheid en de arbeid.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel10
  - number: '11.1'
    text: |-
      Bij elke bemande arbeidsplaats moet een voldoende aantal arbeiders beschikbaar zijn die de voor de uitvoering van
      de hun opgedragen taken vereiste bekwaamheden, ervaring en opleiding dienen te bezitten. Onze Minister kan nadere
      regelen stellen ter zake van het in de eerste volzin bepaalde.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel11
  - number: '11.2'
    text: |-
      Werkzaamheden, van welker goede uitvoering de veiligheid of de gezondheid van de op of in een mijnwerk, op een
      boorwerk of bij mijnbouwkundige onderzoekingen tewerkgestelde personen in belangrijke mate afhankelijk is, mogen
      slechts worden opgedragen aan daarvoor lichamelijk en geestelijk geschikte, zomede betrouwbare personen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel11
  - number: '11.3'
    text: |-
      Blijkt een persoon, aan wie werkzaamheden als in het tweede lid bedoeld zijn opgedragen, aan een der aldaar
      genoemde eisen niet of niet langer te voldoen, dan moet hij onverwijld van die werkzaamheden worden ontheven.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel11
  - number: '11.4'
    text: |-
      Degenen, die op of in een mijnwerk, op een boorwerk of bij mijnbouwkundige onderzoekingen een leidinggevende of
      toezichthoudende functie vervullen, moeten zich in de Nederlandse taal kunnen uitdrukken. Zij moeten de bepalingen
      van dit reglement kunnen lezen en begrijpen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel11
  - number: '11.5'
    text: Onze Minister kan in bijzondere gevallen van het in het vierde lid bepaalde ontheffing verlenen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel11
  - number: 11a.1
    text: |-
      De arbeiders moeten voldoende worden getraind in het uitvoeren van de handelingen die in noodgevallen moeten worden
      verricht.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel11a
  - number: 11a.2
    text: |-
      Arbeiders die werkzaam zijn op mijnbouwinstallaties moeten, onverminderd het bepaalde in het eerste lid, ook worden
      getraind in het uitvoeren van de handelingen die op een specifieke arbeidsplaats moeten worden verricht. De in de
      eerste volzin bedoelde handelingen moeten voor de desbetreffende arbeidsplaats nader worden omschreven in het in
      artikel 14*f* bedoelde veiligheids- en gezondheidsdocument.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel11a
  - number: 11a.3
    text: |-
      Arbeiders die werkzaam zijn op mijnbouwinstallaties moeten worden getraind in de toepassing van
      overlevingstechnieken.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel11a
  - number: '12.1'
    text: |-
      De bestuurders van een mijnonderneming zijn verplicht aan de Inspecteur-Generaal der Mijnen onverwijld opgave
      te doen van andere ondernemingen, die op of in een tot die mijnonderneming behorend mijnwerk, op een tot
      die mijnonderneming behorend boorwerk of bij mijnbouwkundige onderzoekingen, die door of in opdracht van die
      mijnonderneming worden uitgevoerd, werkzaamheden verrichten en van de aard dezer werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel12
  - number: '12.2'
    text: |-
      De bestuurders zijn verplicht vóór de aanvang van werkzaamheden als in het eerste lid bedoeld de bestuurders van de
      andere ondernemingen in kennis te stellen:
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel12
  - number: 12.2.a
    text: |-
      van de bij en krachtens dit reglement gegeven voorschriften en regelen betreffende de veiligheid, de gezondheid en
      de arbeid, die met het oog op de te verrichten werkzaamheden van belang kunnen zijn;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel12
  - number: 12.2.b
    text: |-
      van alle bijzonderheden, die in verband met de uitvoering der te verrichten werkzaamheden uit een oogpunt van
      veiligheid en gezondheid van belang zijn.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel12
  - number: '12.3'
    text: |-
      De in artikel 8, eerste en tweede lid, bedoelde verplichting geldt niet ten opzichte van personen, die op tot
      een mijnonderneming behorende bovengrondse werken of boorwerken of bij mijnbouwkundige onderzoekingen, door of
      in opdracht van een mijnonderneming verricht, als bestuurder van of in dienst van een andere onderneming in het
      bedrijf van deze andere onderneming werkzaam zijn.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel12
  - number: '12.4'
    text: |-
      In de gevallen, waarin het derde lid toepassing vindt, zijn het eerste onderscheidenlijk tweede lid, zomede het
      derde lid van artikel 8 van overeenkomstige toepassing op de bestuurders van de betrokken andere onderneming en
      op personen in dienst van die onderneming, voor zover zij door die bestuurders zijn belast met de zorg voor de
      naleving van de bij en krachtens dit reglement gegeven voorschriften en regelen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel12
  - number: '13'
    text: |-
      Werkzaamheden op of in een mijnwerk, op een boorwerk of bij mijnbouwkundige onderzoekingen mogen, in geval zij aan
      een andere onderneming worden opgedragen, uitsluitend opgedragen worden aan ondernemingen, waarvan redelijkerwijs
      mag worden verwacht, dat zij de opgedragen arbeid naar behoren zullen verrichten.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel13
  - number: '14.1'
    text: |-
      Bij een onderneming, waartoe een of meer mijn- of boorwerken behoren of die mijnbouwkundige onderzoekingen
      verricht, moeten op doelmatige plaatsen de volgende bescheiden aanwezig zijn:
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel14
  - number: 14.1.a
    text: |-
      een mijnboek, waarin de bij en krachtens artikel 325, eerste lid, aangewezen ambtenaren aantekening houden van hun
      bezoeken, alsmede van de opmerkingen, waartoe het bij die bezoeken geconstateerde aanleiding heeft gegeven;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel14
  - number: 14.1.b
    text: |-
      een personenregister, waarin omtrent degenen, die op of in een mijnwerk, op een boorwerk of bij een mijnbouwkundige
      onderzoeking te werk zijn gesteld, worden vermeld:
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel14
  - number: 14.1.b.1°
    text: |-
      naam, voorletters, nationaliteit, nummer van een document als bedoeld in
      [artikel 1 van de Wet op de identificatieplicht][ref1] en geboortedatum;


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: 14.1.b.2°
    text: |-
      functie, datum van aankomst op en datum van vertrek van het mijnwerk, het boorwerk of de mijnbouwkundige
      onderzoeking;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel14
  - number: 14.1.b.3°
    text: bezit van bewijs van geneeskundig onderzoek alsmede de vervaldatum hiervan;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel14
  - number: 14.1.b.4°
    text: bezit van bij of krachtens dit reglement gevorderde opleidings- en trainingsbewijzen alsmede de vervaldata hiervan;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel14
  - number: 14.1.b.5°
    text: datum en tijdstip van de laatste wijziging van het register.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel14
  - number: 14.1.c
    text: 'bescheiden, waarin omtrent de onder *b* bedoelde personen is vermeld:'
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel14
  - number: 14.1.c.1°
    text: |-
      voor zover zij in de ondergrondse werken werkzaam zijn: op welke plaats of plaatsen zij zijn tewerkgesteld en welke
      soort werkzaamheden zij verrichten;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel14
  - number: 14.1.c.2°
    text: |-
      voor zover zij niet in de ondergrondse werken werkzaam zijn: bij welke afdeling of dienst of bij welk bureau zij
      zijn tewerkgesteld en welke werkzaamheden zij verrichten, tenzij een en ander reeds uit de omschrijving van de
      ingevolge *b*, onder 2°, vermelde functie blijkt.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel14
  - number: '14.2'
    text: |-
      Onze Minister kan met betrekking tot door hem aangewezen personen of groepen van personen, die op of in een
      mijnwerk, op een boorwerk of bij mijnbouwkundige onderzoekingen zijn tewerkgesteld, doch niet in dienst van de
      betrokken mijnonderneming zijn, van het in het eerste lid onder *b* en *c* bepaalde ontheffing verlenen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel14
  - number: 14a
    text: |-
      De bestuurders van een mijnonderneming of in artikel 12, eerste lid, bedoelde andere onderneming zijn verplicht te
      zorgen voor de veiligheid en de gezondheid van de arbeiders inzake alle met het werk verbonden aspecten.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel14a
  - number: 14b.1
    text: |-
      De nodige maatregelen dienen te worden getroffen ter bescherming van de veiligheid en de gezondheid van de
      arbeiders, met inbegrip van de maatregelen ter preventie van beroepsrisico's, voor informatie en opleiding alsmede
      voor de organisatie en de benodigde middelen. Deze maatregelen moeten worden aangepast, ten einde rekening te
      houden met gewijzigde omstandigheden en streven naar verbetering van bestaande situaties.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel14b
  - number: 14b.2
    text: 'Rekening houdend met de betrokken werkzaamheden:'
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel14b
  - number: 14b.2.a
    text: |-
      dienen de risico’s voor de veiligheid en de gezondheid van de arbeiders geëvalueerd te worden, met inbegrip van de
      keuze van de werkuitrusting, de chemische stoffen of preparaten en de inrichting van de arbeidsplaatsen; op grond
      van deze evaluatie en voor zover nodig moeten de preventieactiviteiten en de gebruikte werk- en produktiemethoden:
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel14b
  - number: 14b.2.a.1°
    text: een betere bescherming van de veiligheid en de gezondheid van de arbeiders verzekeren;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel14b
  - number: 14b.2.a.2°
    text: |-
      geïntegreerd worden in het geheel van de activiteiten van de mijnonderneming of in artikel 12, eerste lid, bedoelde
      andere onderneming en betrekking hebben op alle niveaus;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel14b
  - number: 14b.2.b
    text: |-
      dient, wanneer een arbeider met de uitvoering van een taak belast wordt, de bekwaamheid van de betrokken arbeider
      op het gebied van veiligheid en gezondheidsbescherming in aanmerking genomen te worden;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel14b
  - number: 14b.2.c
    text: |-
      dient ervoor gezorgd te worden dat over de planning en invoering van nieuwe technologieën overleg wordt gepleegd
      met de arbeiders of hun vertegenwoordigers, wat betreft de gevolgen voor de veiligheid en de gezondheid van de
      arbeiders van de keuzen inzake uitrusting, de arbeidsomstandigheden en de invloed van de omgevingsfactoren op het
      werk;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel14b
  - number: 14b.2.d
    text: |-
      dienen de nodige maatregelen genomen te worden opdat alleen arbeiders die passende instructies hebben gekregen tot
      de zones met ernstige en specifieke gevaren toegang hebben.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel14b
  - number: 14ba.1
    text: |-
      Onverminderd artikel 14*b* dienen de bestuurders van de betrokken ondernemingen waarin een of meer arbeiders
      beneden 18 jaar werkzaam zijn, maatregelen te treffen ter verzekering van hun veiligheid en gezondheid op grond van
      een beoordeling van de risico’s waaraan de bedoelde arbeiders bij hun arbeid blootgesteld worden. Deze beoordeling
      dient plaats te vinden voor de arbeiders met hun arbeid beginnen en wanneer de arbeidsomstandigheden zich
      ingrijpend wijzigen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel14ba
  - number: 14ba.2
    text: 'De beoordeling van de risico’s heeft vooral betrekking op:'
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel14ba
  - number: 14ba.2.a
    text: de uitrusting en de inrichting van arbeidsomgeving en arbeidsplaats;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel14ba
  - number: 14ba.2.b
    text: de aard, de intensiteit en de duur van de blootstelling aan fysische, biologische en chemische agentia;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel14ba
  - number: 14ba.2.c
    text: |-
      de ordening, de keuze en het gebruik van werkuitrusting, met name agentia, machines, apparatuur en toestellen, en
      de bediening daarvan;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel14ba
  - number: 14ba.2.d
    text: het geheel van werkzaamheden in het bedrijf of de inrichting en de organisatie daarvan; en
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel14ba
  - number: 14ba.2.e
    text: het opleidingsniveau van de in het eerste lid bedoelde arbeiders en de aan hen te geven voorlichting.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel14ba
  - number: 14ba.3
    text: |-
      De in de voorgaande leden bedoelde beoordeling van risico’s heeft met name betrekking op arbeid die voor de in het
      eerste lid bedoelde arbeiders specifieke risico’s met zich meebrengt, te weten:
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel14ba
  - number: 14ba.3.a
    text: |-
      arbeid die schadelijke blootstelling meebrengt aan de in punt I van de bijlage, bedoeld in artikel 7, tweede
      lid, van [richtlijn nr. 94/33/EG](31994L0033) van de Raad van de Europese Unie van 22 juni 1994 betreffende de
      bescherming van jongeren op het werk (PbEG L 216) genoemde fysische, biologische en chemische agentia; en
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel14ba
  - number: 14ba.3.b
    text: de in punt II van de onder *a* bedoelde bijlage genoemde procédés en werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel14ba
  - number: 14ba.4
    text: |-
      Een wijziging van de bijlage, genoemd in het derde lid, gaat voor de toepassing van het Mijnreglement 1964 gelden
      met ingang van de dag waarop aan het betrokken wijzigingsbesluit van de Raad van de Europese Unie of de Commissie
      van de Europese Gemeenschappen uitvoering moet zijn gegeven, tenzij bij besluit van Onze Minister, dat in de
      Staatscourant wordt bekendgemaakt, een ander tijdstip wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel14ba
  - number: 14c
    text: |-
      Bij de tenuitvoerlegging van de in artikel 14*b*, eerste lid, bedoelde maatregelen worden de volgende algemene
      preventieprincipes in acht genomen:
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel14c
  - number: 14c.a
    text: het voorkomen van risico's;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel14c
  - number: 14c.b
    text: het evalueren van risico’s die niet kunnen worden voorkomen;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel14c
  - number: 14c.c
    text: de bestrijding van de risico’s bij de bron;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel14c
  - number: 14c.d
    text: |-
      de aanpassing van het werk aan de mens, met name wat betreft de inrichting van de arbeidsplaats en de keuze van
      werkuitrusting en werk- en produktiemethoden, met name om monotone arbeid en tempogebonden arbeid draaglijker te
      maken en de nadelige gevolgen daarvan voor de gezondheid te beperken;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel14c
  - number: 14c.e
    text: het rekening houden met de ontwikkeling van de techniek;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel14c
  - number: 14c.f
    text: de vervanging van wat gevaarlijk is door dat wat niet gevaarlijk of minder gevaarlijk is;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel14c
  - number: 14c.g
    text: |-
      de planning van de preventie met het oog op een samenhangend geheel dat de volgende aspecten in de preventie
      integreert: techniek, organisatie van het werk, arbeidsomstandigheden, sociale betrekkingen en invloed van de
      omgevingsfactoren op het werk;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel14c
  - number: 14c.h
    text: |-
      het geven van voorrang aan maatregelen inzake collectieve bescherming boven maatregelen inzake individuele
      bescherming;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel14c
  - number: 14c.i
    text: het verstrekken van passende instructies aan de arbeiders.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel14c
  - number: 14d
    text: |-
      Ter verzekering van de veiligheid en de gezondheid van de arbeiders worden de nodige maatregelen getroffen om
      ervoor te zorgen dat:
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel14d
  - number: 14d.a
    text: |-
      de arbeidsplaatsen zodanig worden ontworpen, gebouwd, uitgerust, in bedrijf gesteld, gebruikt en onderhouden dat
      arbeiders hun werk kunnen verrichten zonder gevaar voor hun veiligheid of gezondheid of de veiligheid of gezondheid
      van andere arbeiders;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel14d
  - number: 14d.b
    text: wanneer bemande arbeidsplaatsen in gebruik zijn, toezicht wordt uitgeoefend door een verantwoordelijke persoon;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel14d
  - number: 14d.c
    text: |-
      werkzaamheden waaraan een bijzonder risico is verbonden uitsluitend aan vakbekwaam personeel worden opgedragen en
      overeenkomstig de verstrekte instructies worden uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel14d
  - number: 14d.d
    text: alle veiligheidsinstructies voor alle betrokken arbeiders begrijpelijk zijn;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel14d
  - number: 14d.e
    text: passende eerste-hulpvoorzieningen ter beschikking worden gesteld;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel14d
  - number: 14d.f
    text: met regelmatige tussenpozen de nodige veiligheidsoefeningen worden gehouden.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel14d
  - number: 14e
    text: 'De bestuurders van een mijnonderneming of in artikel 12, eerste lid, bedoelde andere onderneming moeten:'
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel14e
  - number: 14e.a
    text: |-
      beschikken over een evaluatie van de risico’s voor de veiligheid en de gezondheid op het werk met inbegrip van de
      risico’s voor de groepen arbeiders met bijzondere risico's;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel14e
  - number: 14e.b
    text: |-
      de te nemen beschermende maatregelen en, indien nodig, de te gebruiken beschermingsmiddelen vaststellen, en dit
      schriftelijk vastleggen;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel14e
  - number: 14e.c
    text: |-
      een lijst bijhouden van arbeidsongevallen die voor een arbeider hebben geleid tot een arbeidsongeschiktheid van
      meer dan één werkdag.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel14e
  - number: 14f.1
    text: |-
      De bestuurders van een mijnonderneming of in artikel 12, eerste lid, bedoelde andere onderneming dienen voor
      de bij ministeriële regeling te omschrijven boorwerken, installaties en werkzaamheden een veiligheids- en
      gezondheidsdocument op te stellen en bij te houden, dat de materie, geregeld bij of krachtens de artikelen 9*b*,
      14*b*, 14*ba*, 14*c* en 14*e*, bestrijkt.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel14f
  - number: 14f.2
    text: 'Uit een veiligheids- en gezondheidsdocument moet met name blijken dat:'
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel14f
  - number: 14f.2.a
    text: de risico’s voor de arbeiders op de arbeidsplaats zijn bepaald en geëvalueerd;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel14f
  - number: 14f.2.b
    text: |-
      afdoende maatregelen zullen worden genomen om te voldoen aan het bij en krachtens de in het eerste lid van dit
      artikel genoemde artikelen bepaalde;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel14f
  - number: 14f.2.c
    text: het ontwerp, gebruik en onderhoud, de bouw en verwijdering van de arbeidsplaatsen en de uitrusting veilig zijn.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel14f
  - number: 14f.3
    text: |-
      Een veiligheids- en gezondheidsdocument moet vóór de aanvang van het werk worden opgesteld en worden herzien
      wanneer een arbeidsplaats belangrijke wijzigingen, uitbreidingen of verbouwingen heeft ondergaan.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel14f
  - number: 14f.4
    text: |-
      Een veiligheids- en gezondheidsdocument wordt zonodig bijgewerkt door vermelding van de maatregelen die zijn
      getroffen om herhaling te voorkomen van ernstige bedrijfsongevallen of bedrijfsongevallen met dodelijke afloop, dan
      wel van situaties die een ernstig gevaar vormen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel14f
  - number: 14g
    text: |-
      De bestuurders van een mijnonderneming of in artikel 12, eerste lid, bedoelde andere onderneming moeten een
      veiligheids- en gezondheidszorgsysteem opstellen. Dit systeem omvat het geheel van beleid, organisatie, planning,
      uitvoering, monitoring, evaluatie, doorlichting en verbetering dat wordt gehanteerd voor de beheersing van de
      veiligheid en de gezondheid.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel14g
  - number: 14h.1
    text: |-
      Onverminderd het bepaalde in artikel 14*f* dient uit een veiligheids- en gezondheidsdocument te blijken dat alle
      nodige maatregelen zijn genomen om de veiligheid en gezondheid van de arbeiders zowel in normale situaties als in
      noodsituaties te beschermen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel14h
  - number: 14h.2
    text: 'Hiertoe moet het document het volgende bevatten:'
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel14h
  - number: 14h.2.a
    text: |-
      een opgave van de aan de arbeidsplaats verbonden specifieke risicobronnen, met inbegrip van elke activiteit op
      die plaats, die ongevallen kunnen teweegbrengen met ernstige gevolgen voor de veiligheid en de gezondheid van de
      betrokken arbeiders;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel14h
  - number: 14h.2.b
    text: een evaluatie van de risico’s van de onder *a* bedoelde specifieke bronnen;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel14h
  - number: 14h.2.c
    text: |-
      het bewijs dat afdoende voorzorgsmaatregelen zijn genomen om onder *a* bedoelde ongevallen te vermijden, de
      uitbreiding van ongevallen te beperken en de arbeidsplaats in noodsituaties op een doelmatige en beheerste wijze te
      kunnen evacueren;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel14h
  - number: 14h.2.d
    text: |-
      het bewijs dat er een veiligheids- en gezondheidszorgsysteem als bedoeld in artikel 14*g* gehanteerd wordt dat
      adequaat is om de voorschriften die betrekking hebben op de veiligheid en de bescherming van de gezondheid van de
      arbeiders, bij of krachtens dit reglement bepaald, zowel in gewone situaties als in noodsituaties na te leven.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel14h
  - number: 14h.3
    text: |-
      Bij de planning en de tenuitvoerlegging van alle in artikel 14*d*, onder *a*, bedoelde fasen dienen de in het
      desbetreffende veiligheids- en gezondheidsdocument vermelde procedures en uitvoeringsbepalingen in acht te worden
      genomen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel14h
  - number: 14h.4
    text: |-
      De verschillende ondernemingen die verantwoordelijk zijn voor de verschillende arbeidsplaatsen werken in voorkomend
      geval samen bij het opstellen van de veiligheids- en gezondheidsdocumenten als bedoeld in artikel 14*f* en het
      voorbereiden van de maatregelen die nodig zijn om de veiligheid en de gezondheid van de arbeiders te garanderen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel14h
  - number: 14i.1
    text: |-
      Wanneer er arbeiders van verschillende ondernemingen op een zelfde arbeidsplaats aanwezig zijn, moeten de
      bestuurders van die ondernemingen, onverminderd de andere bepalingen van dit reglement, samenwerken bij de
      uitvoering van de maatregelen inzake veiligheid, hygiëne en gezondheid en elkaar wederzijds alsmede hun arbeiders
      of hun vertegenwoordigers van de beroepsrisico’s op de hoogte stellen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel14i
  - number: 14i.2
    text: |-
      De bestuurders van de betrokken mijnonderneming moeten de uitvoering van alle maatregelen inzake veiligheid
      en gezondheid van de arbeiders coördineren. Zij preciseren in het in artikel 14*f* bedoelde veiligheids- en
      gezondheidsdocument het doel, de maatregelen en de wijze van uitvoering van deze coördinatie.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel14i
  - number: 14j.1
    text: 'De bestuurders van een mijnonderneming of in artikel 12, eerste lid, bedoelde andere onderneming moeten:'
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel14j
  - number: 14j.1.a
    text: |-
      alle arbeiders die blootgesteld zijn of kunnen worden aan een ernstig of onmiddellijk gevaar zo spoedig mogelijk in
      kennis stellen van dat gevaar en van de getroffen of te treffen beschermingsmaatregelen;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel14j
  - number: 14j.1.b
    text: |-
      maatregelen nemen en de arbeiders instructies geven ten einde hun toe te staan, in geval van een niet te
      vermijden, ernstig en onmiddellijk gevaar, hun activiteit stop te zetten of zich in veiligheid te stellen door de
      arbeidsplaats onmiddellijk te verlaten;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel14j
  - number: 14j.1.c
    text: |-
      zich er, behalve in uitzonderlijke, naar behoren gemotiveerde gevallen van onthouden de arbeiders te verzoeken hun
      werk te hervatten in een werksituatie waarin nog een ernstig en onmiddellijk gevaar bestaat.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel14j
  - number: 14j.2
    text: |-
      De arbeider die, in geval van een niet te vermijden, ernstig en onmiddellijk gevaar zijn werkplek of
      een gevaarlijke zone verlaat, mag daar geen nadeel van ondervinden en moet worden beschermd tegen alle
      ongerechtvaardigde nadelige gevolgen daarvan.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel14j
  - number: 14j.3
    text: |-
      De in het eerste lid bedoelde bestuurders zorgen ervoor dat elke arbeider, wanneer een ernstig en onmiddellijk
      gevaar voor zijn eigen veiligheid of die van anderen dreigt en het onmogelijk is contact op te nemen met de
      bevoegde hiërarchieke chef, rekening houdend met zijn technische kennis en middelen, de nodige doeltreffende
      maatregelen kan nemen om de gevolgen van een dergelijk gevaar te voorkomen. Hun optreden mag dan voor hem geen
      enkel nadeel met zich brengen, tenzij hij ondoordacht heeft gehandeld of zich schuldig heeft gemaakt aan grove
      nalatigheid.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel14j
  - number: 14k
    text: Onze Minister kan nadere regelen stellen ter zake van het in de artikelen 14*a* tot en met 14*j* bepaalde.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel14k
  - number: '15'
    text: |-
      De bescheiden, voorzien in het bij of krachtens dit reglement bepaalde, moeten op voldoend duidelijke wijze
      worden opgesteld, doelmatig worden ingericht, doelmatig worden bijgehouden en, behoudens voor wat de in artikel
      14 bedoelde betreft, op door Onze Minister goedgekeurde plaatsen aanwezig zijn. Zij moeten, voor zover bij of
      krachtens dit reglement niet anders is bepaald, gedurende tenminste één jaar ter beschikking blijven.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel15
  - number: '17.1'
    text: |-
      Een uittreksel uit dit reglement en de ter uitvoering daarvan gegeven nadere regelen, waarin zijn opgenomen de
      bepalingen, welke naar het oordeel van Onze Minister voor bepaalde op of in een mijnwerk, op een boorwerk of bij
      mijnbouwkundige onderzoekingen tewerkgestelde personen of groepen van personen in het bijzonder van belang zijn,
      moet bij indiensttreding, tewerkstelling of indeling bij een dergelijke groep aan die personen worden uitgereikt,
      tenzij blijkt dat zij reeds in het bezit van zodanig uittreksel zijn.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel17
  - number: '17.2'
    text: |-
      Indien zodanig uittreksel wordt uitgereikt aan werknemers, die de Nederlandse taal niet beheersen, dient het in een
      voor hen begrijpelijke taal te zijn gesteld.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel17
  - number: '18.1'
    text: De toegang tot mijn- en boorwerken is aan onbevoegden verboden.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel18
  - number: '18.2'
    text: |-
      Bij elke toegang tot mijn- of boorwerken moet duidelijk zijn aangegeven, dat de toegang ingevolge het eerste lid
      van het onderhavige artikel is verboden.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel18
  - number: '18.3'
    text: |-
      Het is aan personen, die niet voldoende bekend zijn met plaats, werken of inrichtingen, verboden zich zonder
      bevoegd geleide op de bovengrondse werken, in de ondergrondse werken of op boorwerken op te houden.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel18
  - number: 18a.1
    text: |-
      Wanneer de veiligheid en de gezondheid van de arbeiders dat vereisen, is toestemming vereist voor de uitvoering van
      gevaarlijke werkzaamheden en voor de uitvoering van gewoonlijk ongevaarlijke werkzaamheden die in combinatie met
      andere activiteiten ernstige risico’s met zich mee kunnen brengen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel18a
  - number: 18a.2
    text: |-
      De toestemming moet door de bestuurders van de betrokken mijnonderneming of in artikel 12, eerste lid, bedoelde
      andere onderneming worden gegeven voor de aanvang van de werkzaamheden en daarbij dient te worden aangegeven aan
      welke voorwaarden moet worden voldaan en welke voorzorgsmaatregelen moeten worden genomen voor, tijdens en na de
      werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel18a
  - number: 18a.3
    text: Onze Minister kan regelen stellen ter zake van het in het eerste en tweede lid bepaalde.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel18a
  - number: 18b
    text: |-
      De bestuurders van de betrokken mijnonderneming of in artikel 12, eerste lid, bedoelde andere onderneming
      raadplegen over vraagstukken die betrekking hebben op de veiligheid en de gezondheid op het werk de betrokken
      arbeiders of hun vertegenwoordigers en geven hun het recht tot evenwichtige deelneming aan de behandeling daarvan
      en tot het doen van voorstellen daaromtrent.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel18b
  - number: 18c
    text: |-
      De arbeiders, of hun vertegenwoordigers, met een specifieke taak op het gebied van de bescherming van de veiligheid
      en de gezondheid van de arbeiders hebben toegang tot alle nodige informatie betreffende, en worden vooraf tijdig
      geraadpleegd over:
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel18c
  - number: 18c.a
    text: alle maatregelen die van wezenlijke invloed kunnen zijn op de veiligheid en de gezondheid;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel18c
  - number: 18c.b
    text: |-
      de aanwijzing van personen als bedoeld in de artikelen 9*c*, eerste lid, 176, eerste lid, onder *c*, 279, eerste
      lid, onder *d*, en 281, vierde lid, en van activiteiten als bedoeld in artikel 9*c*, eerste lid.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel18c
  - number: 18c.c
    text: de toepassing van de artikelen 9*b*, tweede lid, 12, tweede lid, 14*e* en 278;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel18c
  - number: 18c.d
    text: het aantal en de opleiding van de onder *b* bedoelde personen en het materiaal waarover zij kunnen beschikken;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel18c
  - number: 18c.e
    text: de van de beschermings- en preventieactiviteiten van de Inspecteur-Generaal der Mijnen afkomstige informatie;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel18c
  - number: 18c.f
    text: |-
      het eventuele beroep dat overeenkomstig artikel 9*c*, derde lid, wordt gedaan op deskundige personen of diensten
      van buiten de onderneming.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel18c
  - number: 18c.g
    text: de opzet en organisatie van de in artikel 8, vijfde lid, bedoelde voorzieningen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel18c
  - number: 18d
    text: |-
      De in artikel 18*c*, aanhef, bedoelde arbeidersvertegenwoordigers hebben het recht de in artikel 18*b* bedoelde
      bestuurders te verzoeken passende maatregelen te nemen en hun in die zin voorstellen te doen, om alle risico’s voor
      de arbeiders te ondervangen of de bronnen van gevaar uit te schakelen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel18d
  - number: 18e
    text: |-
      De in artikel 18*c*, aanhef, bedoelde arbeiders en vertegenwoordigers mogen geen nadeel ondervinden van hun in de
      artikelen 18*c* en 18 *d* bedoelde activiteiten.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel18e
  - number: 18f
    text: |-
      De in artikel 18*b* bedoelde bestuurders dienen de arbeidersvertegenwoordigers met een specifieke taak op het
      gebied van de bescherming van de veiligheid en de gezondheid van de arbeiders gedurende voldoende tijd met behoud
      van loon vrij te stellen van werk en de nodige middelen ter beschikking te stellen om het deze vertegenwoordigers
      mogelijk te maken de uit dit reglement voortvloeiende rechten en taken uit te oefenen respectievelijk te vervullen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel18f
  - number: 18g.1
    text: |-
      De arbeiders of hun vertegenwoordigers hebben het recht om zich tot de Inspecteur-Generaal der Mijnen te wenden,
      indien zij menen dat de door de in artikel 18*b* bedoelde bestuurders genomen maatregelen en ingezette middelen
      niet toereikend zijn om de veiligheid en de gezondheid op het werk te verzekeren.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel18g
  - number: 18g.2
    text: |-
      Tijdens bezoeken en inspecties door toezichthoudende ambtenaren van het Staatstoezicht op de Mijnen moeten de
      arbeidersvertegenwoordigers in de gelegenheid worden gesteld hun opmerkingen aan hen voor te leggen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel18g
  - number: '19'
    text: Mijn- en boorwerken moeten zodanig zijn ingericht, dat wordt voldaan aan de eis van goed en veilig werk.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel19
  - number: 19a.1
    text: |-
      Wanneer de veiligheid en de gezondheid van de arbeiders dat vereisen, moet iedere bemande arbeidsplaats worden
      uitgerust met:
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel19a
  - number: 19a.1.a
    text: |-
      een audiovisueel systeem waarmee een alarmmelding zo nodig kan worden doorgestuurd naar elk bemand deel van de
      arbeidsplaats;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel19a
  - number: 19a.1.b
    text: |-
      een luidsprekersysteem dat duidelijk kan worden gehoord in alle delen van de installatie waar zich vaak arbeiders
      ophouden.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel19a
  - number: 19a.2
    text: |-
      Op mijnbouwinstallaties moeten de in het eerste lid bedoelde systemen in geval van nood operationeel kunnen
      blijven. Het akoestisch systeem moet worden aangevuld met communicatiesystemen die niet afhankelijk zijn van
      kwetsbare stroomvoorzieningsinstallaties.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel19a
  - number: 19a.3
    text: Op passende plaatsen moet alarm kunnen worden gegeven.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel19a
  - number: '20.1'
    text: |-
      De aan een ontginning voorafgaande werkzaamheden, alsook de ontginning zelve mogen niet anders geschieden dan
      overeenkomstig een aan de Inspecteur-Generaal der Mijnen toegezonden doelmatig, schriftelijk werkplan.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel20
  - number: '20.2'
    text: |-
      Een werkplan kan zich niet uitstrekken over meer dan één kalenderjaar; het moet tenminste 30 dagen vóór het begin
      der betrokken werkzaamheden of ontginning en overigens vóór 1 december van het aan het betrokken kalenderjaar
      voorafgaande jaar in het bezit zijn van de Inspecteur-Generaal der Mijnen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel20
  - number: '20.3'
    text: |-
      Een werkplan moet op verlangen van de Inspecteur-Generaal der Mijnen door tekeningen te zijnen genoegen worden
      toegelicht.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel20
  - number: '21.1'
    text: |-
      Ingrijpende wijzigingen worden in een werkplan niet aangebracht, dan nadat hiervan schriftelijk mededeling is
      gedaan aan de Inspecteur-Generaal der Mijnen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel21
  - number: '21.2'
    text: |-
      Indien onvoorziene omstandigheden een voorafgaande schriftelijke mededeling als in het eerste lid bedoeld niet
      toelaten, moet de Inspecteur-Generaal der Mijnen van de wijziging ten spoedigste telefonisch of anderszins
      mondeling in kennis worden gesteld, welke kennisgeving onverwijld schriftelijk moet worden bevestigd.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel21
  - number: '22'
    text: |-
      Wanneer de uitvoering van een werkplan gevaar voor de veiligheid kan opleveren, moet dit op verlangen en ten
      genoegen van Onze Minister worden gewijzigd.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel22
  - number: '23.1'
    text: |-
      Plaatsen, waar arbeid wordt of moet worden verricht of waar arbeiders, al dan niet in verband met hun arbeid,
      aanwezig plegen te zijn, moeten bereikt kunnen worden en verlaten kunnen worden via vluchtwegen en nooduitgangen
      die via de kortste weg leiden naar de open lucht, een veiligheidszone, een veilig verzamelpunt of een veilig
      evacuatiestation.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel23
  - number: '23.2'
    text: |-
      De in het eerste lid bedoelde plaatsen alsmede de wegen en doorgangen tot het bereiken en verlaten van die plaatsen
      moeten voldoende ruim zijn en worden vrij gehouden van al hetgeen de arbeid of de doorgang kan belemmeren of
      aanleiding kan geven tot ongevallen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel23
  - number: '23.3'
    text: Bij gevaar moeten alle werkplekken snel en optimaal veilig door de arbeiders kunnen worden ontruimd.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel23
  - number: '23.4'
    text: |-
      Het aantal, de locatie en de afmetingen van de vluchtwegen en de nooduitgangen zijn afhankelijk van het gebruik,
      de uitrusting en de afmetingen van de arbeidsplaatsen, alsmede van het maximum aantal personen dat zich op deze
      plaatsen kan ophouden.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel23
  - number: '23.5'
    text: |-
      De woon- en verblijfsruimten moeten ten minste twee afzonderlijke nooduitgangen hebben, die zover mogelijk van
      elkaar zijn gelegen en uitkomen in een veiligheidszone, een veilig verzamelpunt of een veilig evacuatiestation.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel23
  - number: '23.6'
    text: |-
      Bij het uitvallen van de verlichting moeten de vluchtwegen en nooduitgangen die verlichting behoeven met een
      voldoende sterke noodverlichting zijn uitgerust.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel23
  - number: '23.7'
    text: Voor zover daartoe aanleiding bestaat, moeten voorzieningen zijn getroffen tegen glijden, struikelen of vallen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel23
  - number: 23a.1
    text: |-
      Wegen met inbegrip van trappen, vaste ladders en laadplatforms, moeten zodanig berekend, gedimensioneerd en gelegen
      zijn dat zij gemakkelijk, veilig en overeenkomstig hun bestemming kunnen worden gebruikt en de arbeiders die in de
      buurt van die wegen werken, geen enkel risico lopen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel23a
  - number: 23a.2
    text: |-
      Bij het bepalen van de afmetingen van voor verkeer van personen of goederen bestemde wegen, moet uitgegaan worden
      van het mogelijke aantal gebruikers en het soort werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel23a
  - number: 23a.3
    text: Wanneer op wegen transportmiddelen worden gebruikt, moet een veilige afstand overblijven voor voetgangers.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel23a
  - number: 23a.4
    text: |-
      De voor voertuigen bestemde wegen moeten op voldoende afstand van deuren, poorten, doorgangen voor voetgangers,
      gangen en trappen liggen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel23a
  - number: 23a.5
    text: |-
      Het tracé van de verkeers- en toegangswegen dient duidelijk te zijn afgebakend om de bescherming van de arbeiders
      te kunnen garanderen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel23a
  - number: 23b.1
    text: |-
      Plaats, aantal en afmetingen van deuren en poorten en de materialen waarvan zij zijn vervaardigd, moeten worden
      bepaald door de aard en het gebruik van de betrokken lokalen of ruimten.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel23b
  - number: 23b.2
    text: |-
      Deuren van nooduitgangen moeten naar buiten kunnen worden geopend of, wanneer dit niet mogelijk is, schuifdeuren
      zijn.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel23b
  - number: 23b.3
    text: |-
      Deuren op het traject van vluchtwegen moeten gemarkeerd zijn. Zij mogen niet op slot zijn of op zodanige wijze
      gesloten zijn dat zij niet gemakkelijk en onmiddellijk kunnen worden geopend door iedereen die ze in geval van nood
      zou moeten gebruiken.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel23b
  - number: 23b.4
    text: |-
      Klapdeuren en -poorten moeten transparant zijn of van transparante panelen zijn voorzien. Op de transparante deuren
      moet op ooghoogte een signalering zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel23b
  - number: 23b.5
    text: |-
      Wanneer de transparante of lichtdoorlatende oppervlakken van deuren en poorten niet van veiligheidsmateriaal zijn
      vervaardigd en als het gevaar bestaat dat werknemers gewond raken als een deur of een poort breekt, moeten deze
      oppervlakken tegen indrukken worden beveiligd.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel23b
  - number: 23b.6
    text: |-
      Schuifdeuren moeten voorzien zijn van een veiligheidssysteem waardoor zij niet uit hun rails kunnen lopen of
      onverwacht kunnen omvallen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel23b
  - number: 23b.7
    text: |-
      Deuren en poorten die naar boven toe opengaan, moeten voorzien zijn van een veiligheidssysteem waardoor zij niet
      onverwacht kunnen terugvallen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel23b
  - number: 23b.8
    text: |-
      In de onmiddellijke nabijheid van poorten die hoofdzakelijk voor het verkeer van voertuigen zijn bestemd moeten
      zich, tenzij de doorgang voor voetgangers veilig is, deuren voor voetgangers bevinden die duidelijk zichtbaar zijn
      gesignaleerd en voortdurend vrij moeten blijven.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel23b
  - number: 23b.9
    text: |-
      Automatische deuren en poorten moeten zodanig functioneren dat zij voor de arbeiders geen risico’s opleveren. Zij
      moeten zijn uitgerust met gemakkelijk herkenbare en toegankelijke noodstopvoorzieningen en moeten ook met de hand
      kunnen worden geopend, tenzij ze bij een energiestoring automatisch opengaan.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel23b
  - number: 23b.10
    text: |-
      Wanneer kettingen of soortgelijke voorzieningen worden gebruikt om te verhinderen dat een bepaalde ruimte wordt
      betreden, moeten de kettingen of soortgelijke voorzieningen goed zichtbaar zijn en op doelmatige wijze worden
      voorzien van verbods- of waarschuwingsborden.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel23b
  - number: '24.1'
    text: |-
      Werklokalen, wacht- en schaftlokalen, was-, bad- en kleedlokalen, kantoren en andere ruimten, waarin personen
      plegen aanwezig te zijn, moeten verlaten kunnen worden door twee uitgangen, die zich zo mogelijk aan tegenover
      elkaar liggende zijden van de ruimte moeten bevinden.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel24
  - number: '24.2'
    text: |-
      In gebouwen, waarin geen door de inrichting, de bouwwijze of de ligging van het gebouw dan wel door de aard of
      de wijze van bewerking, verwerking of bewaring van de daarin aanwezige stoffen verhoogd gevaar voor brand, snelle
      bedwelming, vergiftiging of huidverbranding bestaat, kan in afwijking van het in het eerste lid bepaalde met één
      uitgang worden volstaan voor een ruimte als in dat lid bedoeld:
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel24
  - number: 24.2.a
    text: |-
      waarin in de regel niet meer dan 25 personen aanwezig zijn en waarvan de vloer hetzij minder dan 2,50 meter
      boven, hetzij minder dan 1,50 meter beneden de begane grond buiten het gebouw, waarvan de ruimte deel uitmaakt, is
      gelegen, mits de uitgang een buitenuitgang is;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel24
  - number: 24.2.b
    text: |-
      waarin in de regel niet meer dan 10 personen aanwezig zijn, mits de uitgang leidt naar tenminste twee afzonderlijke
      wegen, waarlangs de begane grond buiten het gebouw kan worden bereikt;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel24
  - number: 24.2.c
    text: |-
      welke deel uitmaakt van een gebouw, waarin in de regel niet meer dan 25 personen aanwezig zijn, wanneer in de
      ruimte een tweede uitgang niet kan worden aangebracht, mits een doelmatige gelegenheid tot ontkoming aanwezig
      is, of - wanneer ook deze niet kan worden tot stand gebracht - over een doelmatige mogelijkheid tot redding wordt
      beschikt.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel24
  - number: '24.3'
    text: |-
      De in het eerste lid en in het tweede lid, onder *a* en *c*, bedoelde uitgangen moeten elk langs een afzonderlijke
      weg naar de begane grond buiten het gebouw leiden.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel24
  - number: '24.4'
    text: |-
      Met betrekking tot gebouwen van brandwerende constructie, waarin geen licht brandbare, aan zelfontbranding
      onderhevige of ontplofbare stoffen worden bewerkt, verwerkt of bewaard, mag van het in het derde lid bepaalde
      worden afgeweken, mits van eenzelfde weg in de regel niet meer dan 100 personen gebruik behoeven te maken.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel24
  - number: '24.5'
    text: |-
      De in het eerste lid bedoelde ruimten en de daarbij behorende uitgangen en wegen moeten zodanig zijn ingericht en
      zich in zodanige staat bevinden, dat de in de ruimte aanwezige personen te allen tijde voldoende snel en op veilige
      wijze kunnen ontkomen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel24
  - number: '24.6'
    text: Onze Minister kan van het in het eerste en het derde lid bepaalde ontheffing verlenen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel24
  - number: '24.7'
    text: Het in de voorgaande leden bepaalde geldt niet ten aanzien van mijnbouwinstallaties.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel24
  - number: 24a
    text: |-
      Ramen, bovenlichtvoorzieningen en voorzieningen voor luchtverversing die geopend, geregeld of beveiligd
      kunnen worden, moeten op zodanige wijze geconstrueerd zijn dat deze handelingen op veilige wijze kunnen worden
      uitgevoerd. In geopende stand mogen zij geen gevaar opleveren voor de arbeiders. Ramen, bovenlichtvoorzieningen en
      voorzieningen voor luchtverversing moeten zonder gevaar kunnen worden schoongemaakt.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel24a
  - number: 24b.1
    text: |-
      De oppervlakte, de hoogte en het luchtvolume van de werkruimten moeten toereikend zijn om de arbeiders in staat te
      stellen hun werk zonder gevaar voor veiligheid en gezondheid uit te voeren.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel24b
  - number: 24b.2
    text: |-
      De afmetingen van het vrije oppervlak van de werkplek moeten zodanig zijn dat de arbeider bij zijn taakuitoefening
      over voldoende bewegingsvrijheid beschikt en zijn werk op veilige wijze kan uitvoeren.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel24b
  - number: '25'
    text: Op een boorwerk dient op een doelmatige plaats een doelmatig boorregister aanwezig te zijn.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel25
  - number: '26'
    text: |-
      Een boorinstallatie, met alles wat daartoe behoort, moet in veilige en deugdelijke staat verkeren en geschikt zijn
      voor het doel, waarvoor zij wordt aangewend.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel26
  - number: '27.1'
    text: |-
      Een diepboring mag niet anders geschieden dan overeenkomstig een aan de Inspecteur-Generaal der Mijnen toegezonden
      doelmatig, schriftelijk boorprogramma. Dit programma moet vergezeld gaan van een opgave van naam, voornamen,
      beroep en woonplaats van de leider der werkzaamheden. In geval deze in het buitenland woonachtig is, dient zijn
      verblijfplaats in Nederland te worden opgegeven.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel27
  - number: '27.2'
    text: |-
      Het boorprogramma moet tenminste vier weken vóór de aanvang der betrokken werkzaamheden in het bezit zijn van de
      Inspecteur-Generaal der Mijnen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel27
  - number: '27.3'
    text: De artikelen 20, derde lid, 21 en 22 zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel27
  - number: '28'
    text: |-
      Diepboringen mogen niet worden aangevangen en door Onze Minister aan te wijzen onderdelen van boorwerken mogen niet
      worden tot stand gebracht of in stand gehouden binnen door hem te bepalen afstanden van:
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel28
  - number: 28.a
    text: |-
      opstallen, welke geen deel uitmaken van een boorwerk en waarin zich een stookplaats of een andere inrichting tot
      het maken van open vuur bevindt;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel28
  - number: 28.b
    text: openbare wegen;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel28
  - number: 28.c
    text: spoorwegen;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel28
  - number: 28.d
    text: licht brandbare gewassen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel28
  - number: '29.1'
    text: |-
      Bij een diepboring moeten doelmatige maatregelen worden genomen om de verstoring van de aangetroffen geologische
      formaties zoveel mogelijk te beperken.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel29
  - number: '29.2'
    text: |-
      Onze Minister kan van het in het eerste lid bepaalde ontheffing verlenen, indien de voortgang van een diepboring of
      de winning van delfstoffen zulks noodzakelijk maakt of daardoor kan worden bespoedigd.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel29
  - number: '30'
    text: 'Bij een diepboring moeten doelmatige maatregelen worden genomen:'
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel30
  - number: 30.a
    text: ter voorkoming van een onnodig verloren gaan van delfstoffen;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel30
  - number: 30.b
    text: |-
      ter vermijding van het binnendringen van vloeistoffen of gassen in geologische formaties, waardoor de winning van
      delfstoffen zou kunnen worden geschaad.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel30
  - number: '31.1'
    text: |-
      Ten aanzien van door Onze Minister aan te wijzen diepboringen moet na het inbouwen en cementeren van elke serie
      der verbuizing omtrent de deugdelijkheid daarvan door middel van doelmatige persproeven zekerheid zijn verkregen,
      alvorens de diepboring wordt voortgezet of in produktie gebracht.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel31
  - number: '31.2'
    text: |-
      Bij een diepboring als in het eerste lid bedoeld moet na het inbouwen van de eerste serie der verbuizing worden
      zorg gedragen voor een veilige afsluiting.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel31
  - number: '32'
    text: |-
      Indien bij een diepboring een andere delfstof wordt aangetroffen dan die welke doel van de diepboring is, moeten de
      boorwerkzaamheden op zodanige wijze worden verricht, dat in het belang van de bescherming van delfstoffen voldoende
      gegevens omtrent het betrokken delfstofvoorkomen worden verkregen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel32
  - number: 32a.1
    text: |-
      Een bij een diepboring behorend boorgat mag niet ten behoeve van het winnen van delfstoffen in gebruik worden
      genomen dan nadat het daartoe deugdelijk is ingericht en afgewerkt, zomede van doeltreffende beveiligingen ter
      afsluiting is voorzien.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel32a
  - number: 32a.2
    text: |-
      Onze Minister kan ten aanzien van door hem aangewezen boorgaten nadere regelen stellen met betrekking tot de
      inrichting, afwerking en beveiligingen als in het eerste lid bedoeld.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel32a
  - number: 32b.1
    text: |-
      Werkzaamheden in een bestaand boorgat, dan wel aan de inrichting, afwerking of beveiligingen als in artikel 32*a*,
      eerste lid, bedoeld, zoals nodig in verband met reparatie of onderhoud, moeten op doeltreffende wijze geschieden.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel32b
  - number: 32b.2
    text: |-
      Tenzij de onmiddellijke uitvoering in het belang van de veiligheid van de op de betrokken mijnbouwinstallatie
      of het betrokken boorwerk werkzame personen noodzakelijk is, mogen bepaalde door Onze Minister aan te wijzen
      werkzaamheden als in het eerste lid bedoeld, ten aanzien van door hem daarbij aangegeven boorgaten, niet anders
      geschieden dan overeenkomstig een aan de Inspecteur-Generaal der Mijnen toegezonden doelmatig schriftelijk
      werkprogramma.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel32b
  - number: 32b.3
    text: |-
      Het werkprogramma moet zo tijdig mogelijk, doch in ieder geval niet later dan vier weken vóór de aanvang van de
      betrokken werkzaamheden in het bezit zijn van de Inspecteur-Generaal der Mijnen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel32b
  - number: 32b.4
    text: De artikelen 20, derde lid, 21, 22 en 27, eerste lid, tweede en derde volzin, zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel32b
  - number: '33.1'
    text: |-
      Van het verloop van een diepboring en van werkzaamheden, aangewezen krachtens artikel 32*b*, tweede lid, ten
      aanzien van een daarbij aangegeven boorgat moet dagelijks een kort verslag worden opgemaakt, hetwelk onverwijld
      en op doelmatige wijze ter kennis van de Inspecteur-Generaal der Mijnen dient te worden gebracht. Het verslag moet
      voldoende gegevens bevatten ten einde het verloop van de boring of de werkzaamheden te kunnen volgen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel33
  - number: '33.2'
    text: |-
      Voorts moet van het verloop als in het eerste lid bedoeld maandelijks een rapport worden opgemaakt, hetwelk
      binnen 7 dagen na afloop van de betrokken maand in afschrift aan de Inspecteur-Generaal der Mijnen dient te worden
      toegezonden. Het rapport moet voldoende gegevens bevatten ten einde het verloop van de boring of de werkzaamheden
      te kunnen volgen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel33
  - number: '34.1'
    text: |-
      Van staking, beëindiging of hervatting van een diepboring moet binnen 7 dagen mededeling worden gedaan aan de
      Inspecteur-Generaal der Mijnen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel34
  - number: '34.2'
    text: |-
      Na beëindiging van een diepboring moeten aan de Inspecteur-Generaal der Mijnen zo spoedig mogelijk een nauwkeurig
      boorprofiel, alsmede voldoende uit de diepboring verkregen andere gegevens, die van belang kunnen zijn voor de
      veiligheid en de bescherming van delfstoffen, worden toegezonden.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel34
  - number: '35'
    text: |-
      Doelmatige maatregelen moeten worden genomen om te voorkomen, dat de winning van delfstoffen, waarvan de
      aanwezigheid is aangetoond of wordt vermoed, wordt belemmerd of geschaad.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel35
  - number: '36'
    text: De afvoer van gassen, vloeistoffen en vaste stoffen moet op doelmatige wijze geschieden.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel36
  - number: 36a.1
    text: |-
      Van het voornemen om een mijnbouwinstallatie op of boven de bodem van een oppervlaktewater te plaatsen moet
      tenminste twee weken voordat met de desbetreffende werkzaamheden wordt aangevangen schriftelijk mededeling worden
      gedaan aan de Inspecteur-Generaal der Mijnen, onder opgave van:
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel36a
  - number: 36a.1.a
    text: |-
      de ligging van de plaats, waar de mijnbouwinstallatie zal worden geplaatst, uitgedrukt in coördinaten volgens het
      stelsel van de Rijksdriehoeksmeting;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel36a
  - number: 36a.1.b
    text: de aard en de afmetingen van de mijnbouwinstallatie;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel36a
  - number: 36a.1.c
    text: de datum, waarop met de desbetreffende werkzaamheden zal worden aangevangen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel36a
  - number: 36a.2
    text: |-
      Van het voornemen om een mijnbouwinstallatie op of boven de bodem van een oppervlaktewater te plaatsen moet
      bovendien tenminste twee weken voordat met de desbetreffende werkzaamheden wordt aangevangen, onder opgave van de
      in het eerste lid bedoelde gegevens, schriftelijk mededeling worden gedaan:
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel36a
  - number: 36a.2.a
    text: |-
      indien de installatie zal worden geplaatst op of boven de bodem van de territoriale zee of van een ander
      oppervlaktewater, ten aanzien waarvan Onze Minister van Defensie het oppertoezicht over de betonning en bebakening
      uitoefent, aan het Hoofd van de Afdeling Hydrografie van het Ministerie van Defensie en de Directeur-Generaal van
      Loodswezen, Betonning, Bebakening en Verlichting;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel36a
  - number: 36a.2.b
    text: |-
      indien de installatie zal worden geplaatst op of boven de bodem van een ander oppervlaktewater dan onder *a*
      bedoeld, aan de Directeur-Generaal van de Rijkswaterstaat.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel36a
  - number: 36a.3
    text: |-
      Van wijziging van de in het eerste lid bedoelde gegevens dient onverwijld schriftelijk mededeling te worden gedaan
      aan degenen, aan wie ingevolge het eerste en tweede lid mededeling is gedaan.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel36a
  - number: 36a.4
    text: |-
      Zodra een mijnbouwinstallatie op of boven de bodem van een oppervlaktewater is geplaatst, moet met gebruikmaking
      van doelmatige apparatuur, door het verrichten van voldoende metingen of andere waarnemingen, een voldoend
      nauwkeurige plaatsbepaling van de installatie worden verricht. Het resultaat hiervan moet onverwijld schriftelijk
      worden medegedeeld aan degenen, aan wie ingevolge het eerste en tweede lid mededeling is gedaan. De mededeling aan
      het Hoofd van de Afdeling Hydrografie van het Ministerie van Defensie onderscheidenlijk aan de Directeur-Generaal
      van de Rijkswaterstaat dient vergezeld te gaan van voldoende op de verrichte waarnemingen betrekking hebbende
      gegevens.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel36a
  - number: 36a.5
    text: |-
      Het in artikel 134, eerste lid, ten aanzien van gegevens, die voor het vervaardigen van kaarten hebben gediend,
      bepaalde is van overeenkomstige toepassing op gegevens, welke verkregen zijn door waarnemingen als in het vierde
      lid bedoeld.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel36a
  - number: 36b.1
    text: |-
      Bij het plaatsen van een mijnbouwinstallatie op of boven de bodem van een oppervlaktewater moeten voldoende
      maatregelen worden genomen ter voorkoming van het optreden van gevaar, met inbegrip van gevaar voor de veiligheid
      en de gezondheid van de arbeiders.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel36b
  - number: 36b.2
    text: |-
      De voorbereiding van de plaatsing van mijnbouwinstallaties moet zodanig worden uitgevoerd dat de veiligheid en de
      stabiliteit ervan gewaarborgd zijn.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel36b
  - number: 36c.1
    text: |-
      Een mijnbouwinstallatie moet ten opzichte van de te verwachten windsterkte, golven en stroming van het water,
      alsook zo nodig met het oog op het aanleggen van vaartuigen of het landen van hefschroefvliegtuigen of andere
      luchtvaartuigen veilig zijn geplaatst, verankerd of op andere doelmatige wijze op haar plaats worden gehouden.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel36c
  - number: 36d.1
    text: |-
      Een mijnbouwinstallatie moet voldoende sterk zijn om bij de maximaal toelaatbare belasting de op grond van
      windsterkte, golfslag en stroming van het water te verwachten krachten te weerstaan.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel36d
  - number: 36d.2
    text: |-
      De bestuurders van een mijnonderneming of in artikel 12, eerste lid, bedoelde andere onderneming, waarbij een
      of meer mijnbouwinstallaties in gebruik zijn, dienen ten aanzien van elk van die installaties te beschikken over
      een door een ter zake deskundige en door Onze Minister als zodanig erkende instelling of onderneming afgegeven
      verklaring, inhoudende dat de installatie aan het bij en krachtens het eerste lid bepaalde voldoet.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel36d
  - number: 36d.3
    text: 'Door Onze Minister aangewezen mijnbouwinstallaties moeten:'
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel36d
  - number: 36d.3.a
    text: |-
      regelmatig, volgens een doelmatig schema over een door Onze Minister aan te geven aantal jaren, zomede
      overeenkomstig een jaarlijks inspectieplan, achtereenvolgens op de staat van onderhoud en de sterkte van de
      onderscheiden onderdelen der installatie aan een doelmatige inspectie worden onderworpen;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel36d
  - number: 36d.3.b
    text: |-
      telkens na verloop van het aantal jaren als onder *a* bedoeld, binnen een door Onze Minister aan te geven termijn,
      aan een voldoende en doelmatig algeheel onderzoek betreffende de staat van onderhoud en de sterkte der installatie
      worden onderworpen; Onze Minister kan bepalen, dat het onderzoek moet worden verricht door een ter zake deskundige
      instelling of onderneming.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel36d
  - number: 36d.4
    text: |-
      Van een schema en een plan als in het derde lid, onder *a*, bedoeld dient tijdig een exemplaar aan de Inspecteur-
      Generaal der Mijnen te worden overgelegd. Indien Onze Minister van oordeel is dat een inspectieplan niet aan
      redelijk te stellen eisen voldoet, moet dit op zijn verlangen en tot zijn genoegen worden gewijzigd.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel36d
  - number: 36d.5
    text: |-
      Van een inspectie of onderzoek als in het derde lid bedoeld moet zo spoedig mogelijk na de voltooiing daarvan een
      doelmatig rapport worden opgesteld, van welk rapport onverwijld een exemplaar aan de Inspecteur-Generaal der Mijnen
      dient te worden toegezonden.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel36d
  - number: 36d.6
    text: |-
      Nadat een onderzoek als in het derde lid, onder *b*, bedoeld is voltooid, dienen de betrokken bestuurders te
      beschikken over een nieuwe, onverwijld na die voltooiing door een in het tweede lid bedoelde instelling of
      onderneming afgegeven verklaring, inhoudende dat de installatie aan het bij en krachtens het eerste lid bepaalde
      voldoet.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel36d
  - number: 36d.7
    text: |-
      Een verklaring als in het tweede of zesde lid bedoeld moet in afschrift aan de Inspecteur-Generaal der Mijnen
      worden overgelegd.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel36d
  - number: 36da.1
    text: |-
      Indien een mijnbouwinstallatie ten gevolge van een kracht als in artikel 36*d*, eerste lid, bedoeld, dan wel door
      aanvaring of anderszins beschadigd is of naar redelijk vermoeden beschadigd kan zijn moet zo spoedig mogelijk
      een doelmatig onderzoek worden ingesteld ter vaststelling van de beschadiging of vermoedelijke beschadiging;
      Onze Minister kan bepalen, dat het onderzoek moet worden verricht door een ter zake deskundige instelling of
      onderneming.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel36da
  - number: 36da.2
    text: |-
      Van het instellen van een onderzoek als in het eerste lid bedoeld dient onverwijld schriftelijk mededeling te
      worden gedaan aan de Inspecteur-Generaal der Mijnen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel36da
  - number: 36da.3
    text: |-
      Van het resultaat van een onderzoek als in het eerste lid bedoeld dient onverwijld schriftelijk mededeling te
      worden gedaan aan de Inspecteur-Generaal der Mijnen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel36da
  - number: 36db.1
    text: |-
      Indien een mijnbouwinstallatie of een daartoe behorende inrichting als bedoeld in artikel 1, onder *b*, ten gevolge
      van beschadiging of anderszins niet meer voldoet aan het bij of krachtens artikel 36*d*, eerste lid, bepaalde moet
      zij, tenzij de installatie of inrichting in haar geheel wordt verwijderd, na het zo nodig treffen van voorlopige
      voorzieningen, zo spoedig mogelijk op doelmatige wijze worden hersteld onderscheidenlijk moeten ten aanzien daarvan
      doelmatige voorzieningen worden getroffen, een en ander zodanig dat zij weder aan het bij en krachtens genoemd lid
      bepaalde voldoet.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel36db
  - number: 36db.2
    text: |-
      Werkzaamheden krachtens het eerste lid mogen niet anders geschieden dan overeenkomstig een aan de Inspecteur-
      Generaal der Mijnen toegezonden doelmatig schriftelijk werkprogramma.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel36db
  - number: 36db.3
    text: |-
      Zodanig programma moet vergezeld gaan van een opgave van naam, voornamen, beroep en woon- of verblijfplaats van de
      leider der werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel36db
  - number: 36db.4
    text: |-
      Het werkprogramma moet zo tijdig mogelijk, doch als regel niet later dan 24 uur vóór de aanvang der betrokken
      werkzaamheden, in het bezit zijn van de Inspecteur-Generaal der Mijnen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel36db
  - number: 36db.5
    text: De artikelen 20, derde lid, 21 en 22 zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel36db
  - number: 36dc.1
    text: |-
      Zodra werkzaamheden krachtens artikel 36*db*, eerste lid, zijn voltooid moet de betrokken mijnbouwinstallatie of
      inrichting door een ter zake deskundige instelling of onderneming aan een in artikel 36*d*, derde lid, onder b,
      bedoeld onderzoek worden onderworpen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel36dc
  - number: 36dc.2
    text: Artikel 36*d*, vijfde, zesde en zevende lid, is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel36dc
  - number: 36e.1
    text: |-
      De bestuurders van een mijnonderneming of in artikel 12, eerste lid, bedoelde andere onderneming, waarbij een of
      meer op of boven de bodem van de territoriale zee, een zeegat, een open zeeboezem of het IJsselmeer geplaatste
      mijnbouwinstallaties in gebruik zijn, dienen zich met het oog op de toepassing van het tweede en derde lid te
      verzekeren van de bijstand van het Koninklijk Nederlands Meteorologisch Instituut of een andere op meteorologisch
      en oceanografisch gebied deskundige instelling, die door Onze Minister als zodanig is erkend.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel36e
  - number: 36e.2
    text: |-
      Bij het op of boven de bodem van een oppervlaktewater als in het eerste lid bedoeld plaatsen en bij het vandaar
      verwijderen van een mijnbouwinstallatie, alsmede met betrekking tot aldaar geplaatste bemande mijnbouwinstallaties
      dienen met het oog op de veiligheid van personen, die bij dat plaatsen of verwijderen werkzaam zijn, alsmede van de
      personen, die op de mijnbouwinstallatie werkzaam zijn of zullen zijn, bij het in het eerste lid bedoelde instituut
      of de daar bedoelde instelling voldoende meteorologische en oceanografische inlichtingen te worden ingewonnen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel36e
  - number: 36e.3
    text: |-
      Met het oog op de veiligheid moeten op, aan of in de onmiddellijke nabijheid van een op of boven de bodem
      van de territoriale zee geplaatste bemande mijnbouwinstallatie op doelmatige plaatsen voldoende en doelmatige
      meteorologische en oceanografische waarnemingen worden verricht met gebruikmaking van door Onze Minister
      goedgekeurde apparatuur. Bij het verzoek om goedkeuring moet een terzake door het in het eerste lid bedoelde
      instituut of de daar bedoelde instelling uitgebracht advies worden overgelegd.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel36e
  - number: 36e.4
    text: |-
      De in het derde lid bedoelde waarnemingen moeten worden verricht en de daar bedoelde apparatuur moet worden
      onderhouden door of onder toezicht van een terzake deskundig persoon.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel36e
  - number: 36e.5
    text: |-
      De gegevens, welke bij de in het derde lid bedoelde waarnemingen worden verkregen, moeten worden aangetekend in een
      register. Aan het in het eerste lid bedoelde instituut moet van die gegevens op doelmatige wijze mededeling worden
      gedaan en het register of een gewaarmerkt afschrift daarvan ter inzage worden afgegeven, een en ander op door het
      instituut te bepalen tijdstippen. Indien de bijstand wordt verleend door een andere instelling als in het eerste
      lid bedoeld, geldt bovendien een overeenkomstige verplichting ten behoeve van die instelling. Zodanige instelling
      stelt bedoelde tijdstippen niet vast dan na overleg met het instituut.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel36e
  - number: 36e.6
    text: Onze Minister kan van het in de voorgaande leden bepaalde ontheffing verlenen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel36e
  - number: 36f
    text: |-
      Een mijnbouwinstallatie moet zodanig zijn geconstrueerd, ingericht en worden onderhouden, dat wordt voldaan aan de
      eis van goed en veilig werk.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel36f
  - number: 36g.1
    text: |-
      De dekken van een mijnbouwinstallatie moeten door een doelmatige verschansing of een doelmatig relingwerk zijn
      omgeven.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel36g
  - number: 36g.2
    text: Langs trappen en loopgangen moet een doelmatige bescherming zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel36g
  - number: 36h
    text: De dekken van een mijnbouwinstallatie moeten zodanig zijn ingericht, dat overkomend water voldoende kan afvloeien.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel36h
  - number: 36i.1
    text: |-
      Op een mijnbouwinstallatie moeten verblijven en vrije dekruimten, waar personen, al dan niet in verband met hun
      arbeid, plegen aanwezig te zijn, zomede de doorgangen en andere verbindingen tot het bereiken en verlaten van die
      plaatsen, te allen tijde, met vermijding van doorgangen door ruimten, waarin machines, ketels, tanks, drukvaten en
      dergelijke zijn opgesteld, behoorlijk bereikbaar zijn.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel36i
  - number: 36i.2
    text: |-
      Verblijven op een mijnbouwinstallatie, waar personen buiten hun arbeidstijden plegen aanwezig te zijn, mogen niet
      in rechtstreekse verbinding staan met besloten ruimten, waarin machines, ketels, tanks, drukvaten en dergelijke
      zijn opgesteld.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel36i
  - number: 36i.3
    text: |-
      Tussen de in het tweede lid bedoelde verblijven en de inschepingsplaats, waar reddingsmiddelen en ander materieel
      voor het uitvoeren van reddingswerk worden gereed gehouden, moeten voldoende doelmatige verbindingen aanwezig zijn,
      door middel waarvan de betrokken personen onverwijld op veilige wijze die plaats kunnen bereiken.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel36i
  - number: 36i.4
    text: |-
      Een machinekamer op een mijnbouwinstallatie moet tenminste twee tegenover elkaar gelegen uitgangen met voldoende
      trap- of ladderverbindingen vanaf de vloer van die machinekamer hebben.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel36i
  - number: 36i.5
    text: Onze Minister kan van het in het eerste en vierde lid bepaalde ontheffing verlenen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel36i
  - number: 36j.1
    text: |-
      Hefschroefvliegtuigen of andere luchtvaartuigen mogen slechts op een mijnbouwinstallatie landen of daarvan
      opstijgen, indien daarvoor een doelmatig ingericht dek beschikbaar is, met gebruikmaking waarvan dit veilig kan
      geschieden.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel36j
  - number: 36j.2
    text: |-
      Op een op of boven de bodem van een oppervlaktewater als in artikel 36*a*, tweede lid, onder *a*, bedoeld dan wel
      van een andere door Onze Minister aangewezen oppervlaktewater geplaatste bemande mijnbouwinstallatie moet een dek
      als in het eerste lid bedoeld aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel36j
  - number: 36j.3
    text: |-
      Het is verboden om zonder een verklaring als bedoeld in artikel 36*ja*, eerste lid, van een zodanig dek gebruik
      te maken.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel36j
  - number: 36j.4
    text: Onze Minister kan van het in het tweede lid bepaalde ontheffing verlenen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel36j
  - number: 36ja.1
    text: |-
      De bestuurders van een mijnonderneming of in artikel 12, eerste lid, bedoelde andere onderneming, waarbij
      een of meer mijnbouwinstallaties in gebruik zijn, waarop een dek als bedoeld in artikel 36*j*, eerste lid,
      aanwezig is, dienen ten aanzien van elk van die installaties te beschikken over een door de Directeur-Generaal
      Rijksluchtvaartdienst afgegeven verklaring, inhoudende dat het dek op die installatie aan het bij en krachtens
      artikel 36*j*, eerste lid, bepaalde voldoet. De geldigheid van de verklaring verloopt 14 maanden na de dag waarop
      de verklaring is afgegeven.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel36ja
  - number: 36ja.2
    text: |-
      Een dek als bedoeld in artikel 36*j*, eerste lid, moet eenmaal per jaar op de staat van onderhoud en het veilig
      gebruik aan een doelmatige inspectie worden onderworpen. Deze inspectie wordt uitgevoerd door een ter zake
      deskundige en door Onze Minister in overeenstemming met Onze Minister van Verkeer en Waterstaat als zodanig erkende
      instelling of onderneming. Onze Minister kan, in overeenstemming met Onze Minister van Verkeer en Waterstaat,
      bij nadere regelen vaststellen aan welke voorwaarden een instelling of onderneming moet voldoen om erkenning als
      bedoeld in de vorige volzin te verkrijgen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel36ja
  - number: 36ja.3
    text: |-
      De door een erkende instelling of onderneming als bedoeld in het tweede lid uit te voeren inspectie moet geschieden
      overeenkomstig een tevoren aan de Directeur-Generaal Rijksluchtvaartdienst overgelegd inspectieplan. Indien de
      Directeur-Generaal Rijksluchtvaartdienst van oordeel is, dat een inspectieplan niet aan redelijk te stellen eisen
      voldoet, moet dit op zijn verlangen en tot zijn genoegen worden gewijzigd.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel36ja
  - number: 36ja.4
    text: |-
      Van een inspectie als in het tweede lid bedoeld moet zo spoedig mogelijk na de voltooiing daarvan een doelmatig
      rapport worden opgesteld, van welk rapport onverwijld een exemplaar aan de Inspecteur-Generaal der Mijnen en aan de
      Directeur-Generaal Rijksluchtvaartdienst dient te worden toegezonden. De erkende instelling of onderneming, bedoeld
      in het tweede lid, adviseert de Directeur-Generaal Rijksluchtvaartdienst voor de afgifte van de in het eerste lid
      bedoelde verklaring.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel36ja
  - number: 36ja.5
    text: |-
      Nadat een inspectie als in het tweede lid bedoeld is voltooid, geeft de Directeur-Generaal Rijksluchtvaartdienst
      aan de betrokken bestuurders onverwijld een nieuwe verklaring af, inhoudende dat het dek aan het bij en krachtens
      artikel 36*j*, eerste lid, bepaalde voldoet.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel36ja
  - number: 36ja.6
    text: |-
      Onze Minister kan, in overeenstemming met Onze Minister van Verkeer en Waterstaat, bij nadere regelen bepalen, dat
      voor de afgifte van de eerste verklaring voor een bepaalde mijnbouwinstallatie in die regelen aan te geven gegevens
      aan de Directeur-Generaal Rijksluchtvaartdienst moeten worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel36ja
  - number: 36ja.7
    text: |-
      Een verklaring als in het eerste of vijfde lid bedoeld moet in afschrift aan de Inspecteur-Generaal der Mijnen
      worden overgelegd.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel36ja
  - number: 36jb.1
    text: |-
      Op een mijnbouwinstallatie, waarop een dek als bedoeld in artikel 36*j*, eerste lid, aanwezig is, moet een
      doelmatig ingericht register over de verrichtingen met hefschroefvliegtuigen aanwezig zijn en worden bijgehouden.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel36jb
  - number: 36jb.2
    text: |-
      Indien de verrichtingen met hefschroefvliegtuigen worden geleid vanaf een andere mijnbouwinstallatie dan die waarop
      het in het eerste lid bedoelde dek aanwezig is, mag, in afwijking van het eerste lid, het register aanwezig zijn en
      worden bijgehouden op de mijnbouwinstallatie waar vanaf de verrichtingen worden geleid.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel36jb
  - number: 36k.1
    text: |-
      Een op of boven de bodem van een oppervlaktewater als in artikel 36*a*, tweede lid, onder *a*, bedoeld geplaatste
      mijnbouwinstallatie moet van zonsondergang tot zonsopkomst van de volgende lichten zijn voorzien:
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel36k
  - number: 36k.1.a
    text: |-
      een of meer witte lichten van zodanige sterkte, dat de veiligheid zoveel mogelijk is gewaarborgd, en welke zodanig
      zijn ingericht en gaplaatst, dat ongeacht vanuit welke richting de installatie wordt genaderd, tenminste één licht
      zichtbaar is; deze lichten moeten synchroon branden en dienen een karakter te hebben, dat overeenkomt met dat van
      de Morse-letter U, met een periode van 15 seconden, verdeeld als volgt: helder ½ seconde, duister ½ seconde, helder
      ½ seconde, duister ½ seconde, helder 1½ seconde, duister 11½ seconde;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel36k
  - number: 36k.1.b
    text: |-
      indien de mijnbouwinstallatie een grootste horizontale afmeting heeft van meer dan 15 meter, op de uiteinden van
      de installatie vaste, rondom zichtbare, witte lichten van zodanige sterkte, dat de omtrek van die installatie op
      zodanige afstand kan worden waargenomen, dat het gevaar voor aanvaring zoveel mogelijk wordt voorkomen, tenzij de
      onder *a* bedoelde lichten op die uiteinden zijn geplaatst;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel36k
  - number: 36k.1.c
    text: |-
      indien de mijnbouwinstallatie een hoogte heeft van meer dan 30 meter boven gemiddeld hoog water, op het hoogste
      punt van de installatie een vast, rood licht van een sterkte van tenminste 10 candelas, dat zichtbaar is vanuit
      ieder punt boven de horizon, en indien de installatie hoger is dan 45 meter, bovendien halverwege tussen genoemd
      licht en het wateroppervlak een zodanig aantal vaste, rode lichten van dezelfde sterkte, dat vanuit ieder punt
      boven de horizon tenminste één daarvan zichtbaar is.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel36k
  - number: 36k.2
    text: |-
      Een op of boven de bodem van een oppervlaktewater als in artikel 36*a*, tweede lid, onder *b*, bedoeld geplaatste
      mijnbouwinstallatie moet van zonsondergang tot zonsopkomst zijn voorzien van door Onze Minister aan te geven
      lichten.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel36k
  - number: 36k.3
    text: |-
      Onze Minister kan nadere regelen stellen ten aanzien van de inrichting, sterkte en plaatsing van de lichten,
      bedoeld in het eerste lid, onder *a* en *b*, zomede ten aanzien van de inrichting van de lichten, bedoeld in het
      eerste lid onder *c*.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel36k
  - number: 36k.4
    text: |-
      De in het eerste en tweede lid bedoelde lichten moeten zodanig zijn ingericht, worden gevoed en worden onderhouden,
      dat hun ononderbroken werking is gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel36k
  - number: 36k.5
    text: Onze Minister kan van het in het eerste en tweede lid bepaalde ontheffing verlenen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel36k
  - number: 36l.1
    text: |-
      Een op of boven de bodem van de territoriale zee geplaatste mijnbouwinstallatie en een door Onze Minister
      aangewezen, andere mijnbouwinstallatie moeten zijn voorzien:
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel36l
  - number: 36l.1.a
    text: |-
      van een of meer apparaten, waarmede geluidssignalen kunnen worden gegeven van zodanige sterkte, dat de veiligheid
      zoveel mogelijk is gewaarborgd, en welke zodanig zijn ingericht en geplaatst, dat ongeacht vanuit welke richting de
      installatie wordt genaderd, het geluidssignaal hoorbaar is;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel36l
  - number: 36l.1.b
    text: van een radarreflector, indien Onze Minister zulks verlangt.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel36l
  - number: 36l.2
    text: |-
      Indien de meteorologische zichtbaarheid minder is dan 3,7 kilometer, moet met de apparaten, bedoeld in het eerste
      lid, onder *a*, een geluidssignaal worden gegeven, waarvan het karakter overeenkomt met dat van de Morse-letter U,
      met een periode van 30 seconden, verdeeld als volgt: signaal 3/4 seconde, stilte 1 seconde, signaal 3/4 seconde,
      stilte 1 seconde, signaal 2½ seconde, stilte 24 seconden.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel36l
  - number: 36l.3
    text: |-
      Onze Minister kan ten aanzien van door hem aangewezen andere mijnbouwinstallaties als in het eerste lid bedoeld
      bepalen, dat:
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel36l
  - number: 36l.3.a
    text: |-
      met de apparaten, bedoeld in het eerste lid, onder *a*, in plaats van een geluidssignaal als in het tweede lid
      bedoeld een door hem aangegeven geluidssignaal moet worden gegeven;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel36l
  - number: 36l.3.b
    text: |-
      een geluidssignaal slechts behoeft te worden gegeven, indien de meteorologische zichtbaarheid minder bedraagt dan
      een door hem aangegeven afstand.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel36l
  - number: 36l.4
    text: |-
      Onze Minister kan nadere regelen stellen ten aanzien van de inrichting, sterkte en plaatsing van de apparaten,
      bedoeld in het eerste lid, onder *a*.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel36l
  - number: 36l.5
    text: |-
      De in het eerste lid, onder *a*, bedoelde apparaten moeten zodanig worden gevoed en onderhouden, dat hun
      ononderbroken werking is gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel36l
  - number: 36l.6
    text: Onze Minister kan van het in het eerste lid, onder *a*, bepaalde ontheffing verlenen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel36l
  - number: 36m.1
    text: |-
      De bestuurders van een mijnonderneming of in artikel 12, eerste lid, bedoelde andere onderneming moeten voor elke
      bij die onderneming in gebruik zijnde mijnbouwinstallatie in het bezit zijn van een verklaring, waaruit blijkt, dat
      ten tijde, dat zij werd afgegeven, was voldaan aan de bij en krachtens artikel 36*k*, zomede artikel 36*l*, indien
      dit artikel op de installatie van toepassing is, gegeven voorschriften. In een zodanige verklaring kan worden
      bepaald, dat zij slechts geldig is tot een daarin aangegeven tijdstip.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel36m
  - number: 36m.2
    text: 'De in het eerste lid bedoelde verklaring wordt afgegeven:'
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel36m
  - number: 36m.2.a
    text: |-
      voor op of boven de bodem van een oppervlaktewater als in artikel 36*a*, tweede lid, onder *a*, bedoeld geplaatste
      mijnbouwinstallaties door de Directeur van de technische dienst van ’s Rijks Kustverlichting;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel36m
  - number: 36m.2.b
    text: voor andere mijnbouwinstallaties door de Directeur-Generaal van de Rijkswaterstaat.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel36m
  - number: 36m.3
    text: |-
      Ter verkrijging van de in het eerste lid bedoelde verklaring dienen aan degene, die bevoegd is de verklaring af te
      geven, de door deze te bepalen gegevens te worden verstrekt. Tevens dient aan hem, indien hij zulks verlangt, de
      desbetreffende apparatuur of een kenmerkend monster daarvan voor onderzoek op een door hem te bepalen plaats ter
      beschikking te worden gesteld.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel36m
  - number: 36m.4
    text: Onze Minister kan van het in het eerste lid bepaalde ontheffing verlenen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel36m
  - number: 36n.1
    text: |-
      Op het boven het wateroppervlak uitstekende deel van een mijnbouwinstallatie, welke op of boven de bodem van een
      oppervlaktewater als in artikel 36*a*, tweede lid, onder *a*, bedoeld is geplaatst, moeten op doelmatige plaatsen
      door Onze Minister vastgestelde doelmatige herkenningstekens op voldoend duidelijke wijze zijn aangebracht.
      Tenminste een van deze herkenningstekens moet, ongeacht vanuit welke richting de installatie wordt genaderd,
      zichtbaar zijn, zowel bij dag als bij nacht.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel36n
  - number: 36n.2
    text: Onze Minister kan van het in het eerste lid bepaalde ontheffing verlenen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel36n
  - number: 36o.1
    text: |-
      Een op of boven de bodem van een oppervlaktewater als in artikel 36*a*, tweede lid, onder *a*, bedoeld
      geplaatste bemande mijnbouwinstallatie moet zijn voorzien van doelmatige communicatiemiddelen, waarmede onder
      alle omstandigheden verbinding met de vaste wal en met vaartuigen of luchtvaartuigen, welke ten dienste van het
      mijnbouwkundig onderzoek door middel van een boorwerk of het winnen van delfstoffen in gebruik zijn, mogelijk is.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel36o
  - number: 36o.2
    text: |-
      Op een op of boven de bodem van een oppervlaktewater als in artikel 36*a*, tweede lid, onder *a*, bedoeld
      geplaatste mijnbouwinstallatie, niet zijnde een bemande mijnbouwinstallatie, mogen geen personen aanwezig zijn,
      tenzij zij kunnen beschikken over een doelmatig communicatiemiddel.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel36o
  - number: 36o.3
    text: |-
      De op een mijnbouwinstallatie ten behoeve van mijnbouwkundig onderzoek door middel van een boorwerk of het winnen
      van delfstoffen aanwezige communicatiemiddelen moeten door voldoende deskundig personeel worden bediend en op
      doelmatige wijze worden gebruikt. Dit personeel moet op doelmatige wijze een radiodagboek bijhouden.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel36o
  - number: 36p
    text: |-
      Het plaatsen van materieel of materialen op een mijnbouwinstallatie moet zodanig geschieden, dat de ten gevolge
      daarvan optredende krachten en spanningen zonder bezwaar in de constructie van de installatie kunnen worden
      opgenomen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel36p
  - number: 36q.1
    text: 'Doelmatige maatregelen moeten worden genomen om:'
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel36q
  - number: 36q.1.a
    text: |-
      de evacuatiestations en de veilige verzamelpunten te beschermen tegen warmte en rook, en, zoveel mogelijk, tegen de
      gevolgen van explosies;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel36q
  - number: 36q.1.b
    text: de vluchtroutes van en naar de evacuatiestations en verzamelpunten te allen tijde bruikbaar te laten blijven;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel36q
  - number: 36q.1.c
    text: |-
      de evacuatiestations en de veilige verzamelpunten gemakkelijk bereikbaar te laten zijn vanuit de
      verblijfsaccommodatie en de werkruimten.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel36q
  - number: 36q.2
    text: |-
      De in het eerste lid bedoelde maatregelen moeten zodanig zijn dat ze de arbeiders lang genoeg bescherming bieden
      om, indien nodig, in alle veiligheid een evacuatie- en reddingsoperatie te kunnen organiseren en uitvoeren.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel36q
  - number: 36q.3
    text: |-
      Wanneer de veiligheid en de gezondheid van de arbeiders dat vereisen, moet een van de in het eerste lid bedoelde
      beschermde plaatsen zijn voorzien van afstandsbedieningssystemen voor noodgevallen zoals bedoeld in artikel 152*a*
      en van een communicatiesysteem waarmee een verbinding met de vaste wal en met hulpdiensten kan worden onderhouden.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel36q
  - number: '37.1'
    text: |-
      Het is verboden binnen 50 meter afstand van het dekterrein steenkool uit de lagen te verwijderen, of steengangen,
      galerijen of andere werken aan te leggen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel37
  - number: '37.2'
    text: Onze Minister kan van het in het eerste lid bepaalde ontheffing verlenen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel37
  - number: '37.3'
    text: |-
      Een aanvraag om ontheffing moet, behoudens in geval van onvoorziene omstandigheden, worden ingediend tenminste acht
      weken voordat met de werkzaamheden in het betrokken veldgedeelte een aanvang wordt gemaakt.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel37
  - number: '38.1'
    text: |-
      Tegen de grenzen van ieder mijnveld moet een grensmuur van tenminste 10 meter dikte onaangetast blijven; indien in
      een mijnveld meerdere mijnwerken aanwezig zijn, moet tussen de ondergrondse werken daarvan een muur van tenminste
      20 meter dikte onaangetast blijven.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel38
  - number: '38.2'
    text: |-
      Onze Minister kan voor bijzondere gevallen een grensmuur of muur van grotere dikte dan in het eerste lid genoemd
      voorschrijven.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel38
  - number: '38.3'
    text: Onze Minister kan van het in het eerste lid bepaalde ontheffing verlenen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel38
  - number: '38.4'
    text: |-
      Een aanvraag om ontheffing moet, behoudens in geval van onvoorziene omstandigheden, worden ingediend tenminste acht
      weken voordat met de werkzaamheden in het betrokken deel van de grensmuur of muur een aanvang wordt gemaakt.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel38
  - number: '39'
    text: |-
      De ondergrondse werken moeten veilig worden aangelegd en uitgevoerd. Zij moeten zolang zij in gebruik zijn in
      voldoend veilige toestand worden gehouden.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel39
  - number: '40.1'
    text: Voor alle ondergrondse winningsplaatsen moeten tijdig vóór de inbedrijfstelling bestekken worden opgesteld.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel40
  - number: '40.2'
    text: |-
      Aan de Inspecteur-Generaal der Mijnen moeten overeenkomstig door Onze Minister te stellen nadere regelen gegevens
      worden verstrekt betreffende de methoden van winning, ondersteuning en opvulling.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel40
  - number: '40.3'
    text: |-
      Van het aantrekken van een pijler of simpel, dan wel van het weer in bedrijf nemen van een pijler of simpel,
      die tenminste acht weken buiten bedrijf is geweest, moet tijdig tevoren aan de Inspecteur-Generaal der Mijnen
      schriftelijk mededeling worden gedaan. Indien dit niet mogelijk is, moet hem ten spoedigste telefonisch of
      anderzins mondeling mededeling worden gedaan, welke mededeling onverwijld schriftelijk moet worden bevestigd.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel40
  - number: '41'
    text: |-
      De winningsplaatsen moeten zó ver van elkaar verwijderd blijven, dat gevaar voor in een winningsplaats aanwezige
      personen tengevolge van werkzaamheden in een andere winningplaats voldoende wordt vermeden.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel41
  - number: '42'
    text: |-
      In de ondergrondse werken moeten zodanige voorzieningen worden getroffen, dat de waterafvoer voldoende is verzekerd
      en dat de voetpaden en de rails niet onder water staan.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel42
  - number: '43.1'
    text: |-
      Voldoende maatregelen moeten worden genomen en doelmatige instructies moeten worden uitgevaardigd ter verzekering
      van een veilig verkeer en vervoer.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel43
  - number: '43.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing op het op en van mijnbouwinstallaties brengen van materieel, van
      materialen en van personen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel43
  - number: '43.3'
    text: |-
      Voor het spoorweg- en wegvervoer moet een reglement worden vastgesteld, dat moet worden goedgekeurd door Onze
      Minister. De in het eerste lid bedoelde instructies moeten, voor zover zij op dat vervoer betrekking hebben en van
      blijvende aard zijn, in dat reglement worden opgenomen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel43
  - number: '44.1'
    text: |-
      Spoor-, rail- en kabelbanen, lier- en andere transportinrichtingen, met alles wat daartoe behoort, en het rollend
      materieel moeten zodanig zijn ingericht en worden onderhouden, dat de veiligheid voldoende is gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel44
  - number: '44.2'
    text: Doelmatige maatregelen moeten worden genomen tegen de gevaren, welke hun gebruik kan opleveren.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel44
  - number: '45'
    text: De besturing en de bediening van het rollend materieel moeten door voldoend deskundig personeel geschieden.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel45
  - number: '47'
    text: |-
      Van alle bij het verkeer of vervoer voorgekomen bijzondere gebeurtenissen, die op de veiligheid van invloed kunnen
      zijn of zijn geweest, moet onverwijld mededeling worden gedaan aan de Inspecteur-Generaal der Mijnen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel47
  - number: '48.1'
    text: De ondergrondse werken moeten door tenminste twee schachten met de oppervlakte zijn verbonden.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel48
  - number: '48.2'
    text: |-
      Tenminste twee schachten moeten zijn ingericht voor het personenvervoer, met dien verstande dat de intrekkende
      schacht moet zijn ingericht voor het vervoer van personen uit haar laagste transportverdieping en alle hoger
      gelegen verdiepingen. Zodanige doelmatige voorzieningen moeten worden getroffen, dat alle in de ondergrondse
      werken aanwezige personen in geval van stoornis van het vervoer in één schacht steeds door een andere veilig de
      oppervlakte kunnen bereiken.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel48
  - number: '48.3'
    text: De schachten moeten over de gehele diepte een voldoende doorsnede hebben.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel48
  - number: '48.4'
    text: |-
      Alvorens wordt overgegaan tot de aanleg van nieuwe schachten, moet de onderlinge afstand dezer schachten, zomede de
      afstand tot bestaande schachten, worden goedgekeurd door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel48
  - number: '48.5'
    text: |-
      Behalve de in het eerste lid bedoelde schachten, moet een andere door Onze Minister goedgekeurde verbinding
      aanwezig zijn, die het mogelijk maakt in noodgevallen de ondergrondse werken te verlaten.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel48
  - number: '48.6'
    text: Onze Minister kan van het in het eerste, het tweede en het vijfde lid bepaalde ontheffing verlenen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel48
  - number: '49.1'
    text: |-
      Een schacht moet, voor zover de aard van de doorsneden gesteentelagen dat nodig maakt, door voldoende bekleding en
      voldoende voorzorgsmaatregelen bij de ontginning zijn beveiligd.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel49
  - number: '49.2'
    text: |-
      Een schacht, de schachtbekleding en alle tot een schacht behorende inrichtingen moeten in voldoende staat van
      onderhoud verkeren.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel49
  - number: '50.1'
    text: |-
      Schachten, tussenschachten en andere opbraken moeten van de bodem tot de uitmonding zijn voorzien van vaste,
      stevige ladders.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel50
  - number: '50.2'
    text: De ladders moeten op doelmatige wijze zijn geplaatst.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel50
  - number: '50.3'
    text: |-
      Het is verboden materiaal of materieel over de ladders mede te voeren, tenzij dit voor herstellings- of
      meetwerkzaamheden in de betrokken schacht of in de betrokken tussenschacht of andere opbraak nodig is.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel50
  - number: '50.4'
    text: Onze Minister kan van het in het eerste lid bepaalde ontheffing verlenen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel50
  - number: '51.1'
    text: |-
      De toegangen tot de afdelingen van schachten en van tussenschachten en andere opbraken moeten voldoende beveiligd
      zijn.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel51
  - number: '51.2'
    text: |-
      De afdeling van schachten en van tussenschachten en andere opbraken, waarin zich de in artikel 50 bedoelde ladders
      bevinden, moet een voldoende doorsnede hebben, doelmatig zijn ingericht en van de overige afdelingen op voldoende
      wijze zijn gescheiden.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel51
  - number: '51.3'
    text: |-
      In schachten en in tussenschachten en andere opbraken en in hun omgeving mogen losse voorwerpen niet worden
      geplaatst dan in geval van noodzaak en alsdan uitsluitend op veilige wijze.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel51
  - number: '52'
    text: |-
      De wijze van delven, de bekleding, de indeling en de beveiliging van schachten, alsmede voorgenomen belangrijke
      wijzigingen van die bekleding, indeling of beveiliging moeten, nadat de plannen daartoe zijn vastgesteld, zo
      tijdig schriftelijk ter kennis van de Inspecteur-Generaal der Mijnen worden gebracht, dat deze zich daarvan vóór de
      aanvang der werkzaamheden een inzicht kan vormen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel52
  - number: '53.1'
    text: |-
      Van elke schacht moet op een schaal, die niet kleiner dan 1 : 100 mag zijn, een langsdoorsnede worden vervaardigd,
      waarop zijn aangegeven de aard van:
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel53
  - number: 53.1.a
    text: de doorsneden gesteentelagen;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel53
  - number: 53.1.b
    text: de schachtbekleding;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel53
  - number: 53.1.c
    text: de voorwerpen, die vast in de schacht zijn geplaatst;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel53
  - number: 53.1.d
    text: |-
      de hoogteligging ten opzichte van het Normaal Amsterdams Peil van het maaiveld, van de grens van dekterrein en
      steenkolenterrein, van de doorsneden kolenlagen en kolenriffels en van de verdiepingen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel53
  - number: '53.2'
    text: |-
      Wanneer de Inspecteur-Generaal der Mijnen zulks nodig acht, moet de langsdoorsnede door dwarsdoorsneden worden
      verduidelijkt.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel53
  - number: '53.3'
    text: |-
      Ingrijpende wijzigingen van de schachtbekleding en van de in het eerste lid onder *c* bedoelde voorwerpen moeten
      telkens, met opgave van de datum der wijziging, ten spoedigste op deze tekeningen worden aangegeven.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel53
  - number: '53.4'
    text: |-
      Van elke schacht moeten langsdoorsneden worden vervaardigd, waarop in twee onderling loodrecht op elkaar
      staande richtingen de afwijkingen van de schacht uit de verticale richting staan aangegeven. Onze Minister kan
      bepalen, dat langsdoorsneden moeten worden verduidelijkt door doelmatige gegevens betreffende vervormingen van
      de schachtbekleding.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel53
  - number: '53.5'
    text: |-
      Aan de Inspecteur-Generaal der Mijnen moet desverlangd een exemplaar van de in het eerste en het vierde lid
      bedoelde tekeningen worden toegezonden, welke tekeningen zo nodig jaarlijks moeten worden bijgewerkt.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel53
  - number: '54'
    text: |-
      Het is aan personen beneden 21 jaar verboden arbeid te verrichten als hersteller in schachten of in tussenschachten
      of andere opbraken.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel54
  - number: '55'
    text: Schachten, tussenschachten en andere opbraken moeten regelmatig op doelmatige wijze worden geïnspecteerd.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel55
  - number: '56.1'
    text: |-
      Voldoende maatregelen moeten worden genomen en doelmatige instructies moeten worden uitgevaardigd ter verzekering
      van een veilig vervoer in schachten en in tussenschachten en andere opbraken.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel56
  - number: '56.2'
    text: |-
      Voor bedoeld vervoer moet een reglement worden vastgesteld, dat moet worden goedgekeurd door Onze Minister. De
      in het eerste lid bedoelde instructies moeten, voor zover zij van blijvende aard zijn, in dat reglement worden
      opgenomen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel56
  - number: '57.1'
    text: Tijdens personenvervoer mag met dezelfde ophaalinstallatie geen materiaal of materieel worden vervoerd.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel57
  - number: '57.2'
    text: Tijdens het vervoer van personen mag op dezelfde kooi-etage geen materiaal of materieel worden vervoerd.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel57
  - number: '57.3'
    text: |-
      Het in de voorgaande leden bepaalde geldt niet voor het vervoeren van klein gereedschap, voor zover zulks op
      doelmatige wijze geschiedt.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel57
  - number: '58.1'
    text: |-
      Het is de arbeiders verboden anders dan op de door of vanwege de bestuurders van de mijnonderneming voorgeschreven
      wijze en langs de door of vanwege dezen voorgeschreven weg in de ondergrondse werken af te dalen of deze te
      verlaten. Zij moeten zich bij het afdalen in of verlaten van die werken ordelijk gedragen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel58
  - number: '58.2'
    text: Het is verboden, anders dan in geval van nood, de ondergrondse werken langs de ladders te verlaten.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel58
  - number: '58.3'
    text: Onze Minister kan van het in het tweede lid bepaalde ontheffing verlenen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel58
  - number: '59'
    text: |-
      De bestuurders van een mijnonderneming kunnen bepalen, dat de ophaalinstallaties in schachten en tussenschachten -
      buiten het geval van nood - slechts gedurende de door hen vastgestelde tijden voor personenvervoer en voor vervoer
      van personen beschikbaar zijn. De bij en krachtens artikel 325, eerste lid, aangewezen ambtenaren zijn evenwel
      bevoegd te allen tijde van bedoelde ophaalinstallaties gebruik te maken.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel59
  - number: '60.1'
    text: Het is verboden een ophaalinstallatie in een schacht in gebruik te nemen zonder vergunning van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel60
  - number: '60.2'
    text: |-
      Het is verboden een ophaalinstallatie voor personenvervoer in een tussenschacht in gebruik te nemen zonder
      vergunning van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel60
  - number: '61'
    text: |-
      Onverminderd de voorwaarden, waaronder een vergunning als in artikel 60 bedoeld is verleend, gelden bij
      personenvervoer in schachten en tussenschachten met betrekking tot elke ophaalinstallatie de volgende bepalingen:
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel61
  - number: 61.a
    text: 'de ophaalmachine moet zijn voorzien:'
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel61
  - number: 61.a.1
    text: |-
      als de snelheid 6 meter of meer per seconde bedraagt: van een doelmatige snelheidsregelinrichting, snelheidsmeter,
      tachograaf, diepte-aanwijzer en meervoudig bedienbare reminstallatie;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel61
  - number: 61.a.2
    text: |-
      als de snelheid 2 of meer, doch minder dan 6 meter per seconde bedraagt: van een doelmatige
      snelheidsregelinrichting of een op de snelheid doelmatig reagerende veiligheidsinrichting, zomede van een
      doelmatige snelheidsmeter, diepte-aanwijzer en meervoudig bedienbare reminstallatie;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel61
  - number: 61.a.3
    text: |-
      als de snelheid minder dan 2 meter per seconde bedraagt: van een doelmatige snelheidsmeter, diepte-aanwijzer en
      reminstallatie;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel61
  - number: 61.b
    text: |-
      de kooien moeten zodanig zijn ingericht, dat de zich daarin bevindende personen tijdens het vervoer doelmatig zijn
      beveiligd tegen aanraking met in de schacht of tussenschacht aanwezige, alsmede tegen vallende of wegvliegende
      voorwerpen;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel61
  - number: 61.c
    text: |-
      doelmatige automatisch werkende inrichtingen moeten aanwezig zijn, die een te hoog ophalen of te diep zakken van de
      kooien voorkomen;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel61
  - number: 61.d
    text: |-
      boven de hoogste en beneden de laagste bedrijfsstand van de kooien moet voldoende vrije ruimte zijn om een
      doelmatige werking van de onder *c* bedoelde inrichtingen te waarborgen;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel61
  - number: 61.e
    text: |-
      de ophaalmachine, de kooien, de kabels, de seintoestellen en alle andere delen der ophaalinstallatie moeten op
      door Onze Minister te bepalen tijdstippen op doelmatige wijze door in het bijzonder daarmede belaste personen op
      deugdelijkheid worden onderzocht;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel61
  - number: 61.f
    text: |-
      de verbindingsstukken, waarmede de kooi aan de kabel is bevestigd, moeten op door Onze Minister te bepalen
      tijdstippen worden vervangen door andere verbindingsstukken, waarvan hem de deugdelijkheid op voldoende wijze is
      aangetoond.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel61
  - number: '62.1'
    text: |-
      Het totale gewicht der personen, die met een kooi worden vervoerd, mag niet meer bedragen dan 60% van de bij het
      vervoer van goederen gebruikelijke last; het gewicht van een persoon wordt daarbij gesteld op 75 kg.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel62
  - number: '62.2'
    text: |-
      Personen, die met een kooi worden vervoerd, moeten ieder een plaatsruimte van tenminste 0,2 m2 te hunner
      beschikking hebben, wanneer zij staande worden vervoerd; worden zij niet staande vervoerd, dan moet deze
      plaatsruimte tenminste 0,3 m2 bedragen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel62
  - number: '63.1'
    text: |-
      De bediening van een ophaalmachine moet op veilige wijze geschieden door met die taak belaste en daartoe voldoend
      geïnstrueerde personen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel63
  - number: '63.2'
    text: Het is aan personen beneden 21 jaar verboden een ophaalmachine te bedienen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel63
  - number: '64.1'
    text: |-
      Onverminderd de voorwaarden, waaronder een vergunning als in artikel 60 bedoeld is verleend, gelden met betrekking
      tot ophaalinstallaties in schachten en in tussenschachten en andere opbraken de volgende bepalingen:
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel64
  - number: 64.1.a
    text: bij elke ophaalinstallatie moet een doelmatige seininrichting aanwezig zijn;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel64
  - number: 64.1.b
    text: |-
      in schachten, in tussenschachten met tussenverdiepingen en in andere opbraken met tussenverdiepingen moet bij elke
      ophaalinstallatie een doelmatige alarmseininstallatie aanwezig zijn;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel64
  - number: 64.1.c
    text: |-
      bij elke ophaalinstallatie moet ten behoeve van onderhoudswerkzaamheden een doelmatige schachthamer of een ander
      doelmatig communicatiemiddel aanwezig zijn, bij het in werking stellen waarvan de normale seininrichting - echter
      niet de alarmseininrichting - buiten bedrijf moet worden gesteld;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel64
  - number: 64.1.d
    text: |-
      wanneer de kooi zich ter hoogte van een verdieping bevindt, mag de ophaalmachine niet in werking worden gesteld,
      voordat bij de machine het sein daartoe is ontvangen, tenzij door een daartoe bevoegd persoon maatregelen zijn
      genomen om de veiligheid op andere wijze te verzekeren;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel64
  - number: 64.1.e
    text: |-
      bij twijfel omtrent de bedoeling van een sein mag de ophaalmachine niet in werking worden gesteld en moet
      onmiddellijk herhaling van het sein worden gevraagd.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel64
  - number: '64.2'
    text: |-
      In de schachten en tussenschachten moet, wanneer met de kooi meer dan een verdieping kan worden bereikt, naast
      de in het eerste lid bedoelde seininrichtingen en communicatiemiddelen nog een ander doelmatig communicatiemiddel
      aanwezig zijn, dat een directe verbinding mogelijk maakt tussen de plaatsen van waaruit kan worden geseind, alsmede
      tussen de losvloer en de ophaalmachinekamer.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel64
  - number: '65'
    text: |-
      Elektrische seininrichtingen in schachten en in tussenschachten en andere opbraken moeten zodanig zijn uitgevoerd,
      dat:
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel65
  - number: 65.a
    text: |-
      het sein, met uitzondering van seinen, gegeven met een communicatiemiddel als in artikel 64, eerste lid, onder *c*,
      bedoeld, ook op de plaats van afgifte kan worden waargenomen;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel65
  - number: 65.b
    text: een gelijktijdig seinen met een en dezelfde seininrichting van verschillende verdiepingen af niet mogelijk is;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel65
  - number: 65.c
    text: op de plaats van ontvangst van een sein geen twijfel kan bestaan omtrent de plaats van afgifte daarvan.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel65
  - number: '66'
    text: |-
      Onze Minister kan met betrekking tot en ten behoeve van de constructie, de uitvoering, het onderhoud en de controle
      van seininrichtingen in schachten en in tussenschachten en andere opbraken nadere regelen stellen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel66
  - number: '67'
    text: |-
      Het is verboden seininrichtingen in schachten of tussenschachten in gebruik te nemen zonder vergunning van Onze
      Minister.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel67
  - number: '68.1'
    text: |-
      Onverminderd het in de artikelen 64 en 65 bepaalde en onverminderd de voorwaarden, waaronder een vergunning als in
      artikel 67 bedoeld is verleend, gelden met betrekking tot ophaalinstallaties en seininrichtingen in schachten de
      volgende bepalingen:
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel68
  - number: 68.1.a
    text: doelmatige voorzieningen moeten worden getroffen met betrekking tot het begin en het einde van het personenvervoer;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel68
  - number: 68.1.b
    text: |-
      bij personenvervoer mag de ophaalmachine slechts in beweging kunnen worden gesteld, wanneer alle schachtdeuren van
      de plaatsen, vanwaar personen worden vervoerd, gesloten zijn;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel68
  - number: 68.1.c
    text: de seininrichtingen moeten elektrische seininrichtingen zijn;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel68
  - number: 68.1.d
    text: de seinen, welke bij de ophaalmachine aankomen, moeten worden geregistreerd.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel68
  - number: '68.2'
    text: |-
      Onze Minister kan voor schachten, waarin geen regelmatig vervoer plaatsvindt, van het in het eerste lid onder *b,
      c* en *d* bepaalde ontheffing verlenen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel68
  - number: '69.1'
    text: |-
      De betekenis van de seinen moet in de ophaalmachinekamer, op de losvloer, aan het maaiveld en bij iedere laadplaats
      zijn aangegeven op duidelijke wijze en leesbaar vanaf de plaats, waar de seinen worden gegeven of ontvangen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel69
  - number: '69.2'
    text: 'Het sein 1 slag betekent uitsluitend: "halt", het sein 2 slagen: "op" en het sein 3 slagen: "neer".'
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel69
  - number: '69.3'
    text: De betekenis der overige seinen behoeft de goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel69
  - number: '70.1'
    text: |-
      De bediening van de seininrichting van schachten en tussenschachten moet op veilige wijze geschieden door daartoe
      bevoegde personen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel70
  - number: '70.2'
    text: |-
      Bevoegd zijn de seingever en, bij afwezigheid van deze, de toezichthoudende personen, alsmede andere personen, die
      na voldoende instructie door de bestuurders van de betrokken mijnonderneming met het bedienen van de seininrichting
      zijn belast.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel70
  - number: '70.3'
    text: Het is aan personen beneden 21 jaar verboden een seininrichting van schachten of tussenschachten te bedienen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel70
  - number: '70.4'
    text: |-
      De in het eerste en het tweede lid bedoelde personen moeten waken tegen onbevoegd gebruik van de seininrichting en
      zorgen voor handhaving van de hierop betrekking hebbende voorschriften.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel70
  - number: '71.1'
    text: |-
      Wanneer een of meer personen zich in de ondergrondse werken bevinden, moet bovengronds nabij de schacht steeds een
      seingever aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel71
  - number: '71.2'
    text: |-
      Gedurende het personenvervoer in een schacht of tussenschacht moet aan de laadplaats, waarheen of vanwaar dit
      vervoer plaats vindt, een seingever aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel71
  - number: '71.3'
    text: |-
      Gedurende het vervoer van personen in een schacht of tussenschacht moet, wanneer er zich bij de personen, die
      tegelijk in een kooi worden vervoerd, geen bevindt, die tot seinen bevoegd is, aan de laadplaats, waarheen of
      vanwaar het vervoer plaats vindt, een tot seinen bevoegd persoon aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel71
  - number: '71.4'
    text: Onze Minister kan van het in het eerste lid bepaalde ontheffing verlenen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel71
  - number: '72.1'
    text: Op ieder mijnwerk moeten een schachtboek en een kabelboek aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel72
  - number: '72.2'
    text: |-
      In het schachtboek moeten de uitkomsten van de ingevolge de artikelen 55 en 61 gehouden inspecties en
      onderzoekingen en voorts van alle door Onze Minister voorgeschreven inspecties worden ingeschreven en ondertekend.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel72
  - number: '72.3'
    text: 'Het kabelboek moet voor iedere kabel bevatten de vermelding van:'
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel72
  - number: 72.3.a
    text: de herkomst en de door de fabrikant opgegeven breukbelasting;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel72
  - number: 72.3.b
    text: de dikte (bij bandkabels de breedte en de dikte);
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel72
  - number: 72.3.c
    text: het materiaal, het aantal strengen, het aantal draden in iedere streng buiten de hartdraden en de dikte der draden;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel72
  - number: 72.3.d
    text: het gewicht per meter in kilogrammen;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel72
  - number: 72.3.e
    text: de datum van het onderzoek der draagkracht vóór de ingebruikstelling;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel72
  - number: 72.3.f
    text: de datum van oplegging, van verkorting en van onderzoek der draden;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel72
  - number: 72.3.g
    text: de datum van buitenwerkingstelling;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel72
  - number: 72.3.h
    text: de reden van buitenwerkingstelling;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel72
  - number: 72.3.i
    text: alle bij het gebruik voorgekomen bijzondere gebeurtenissen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel72
  - number: '73.1'
    text: |-
      Met het toezicht op het vervoer door de schachten, alsmede op het onderhoud van de schachten en van de daarin voor
      het vervoer aanwezige inrichtingen moeten een of meer opzichters zijn belast.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel73
  - number: '73.2'
    text: |-
      Met het toezicht op het vervoer door tussenschachten en andere opbraken, alsmede op het onderhoud van
      tussenschachten en andere opbraken en van de daarin voor het vervoer aanwezige inrichtingen moeten een of meer
      leden van het toezichthoudend personeel zijn belast.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel73
  - number: '74.1'
    text: |-
      Het is verboden bunkers, kokers of de voor vervoer bestemde afdelingen van schachten of van tussenschachten of
      andere opbraken te betreden.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel74
  - number: '74.2'
    text: |-
      Het in het eerste lid bepaalde geldt niet voor personen, die in de bunker, koker of afdeling werkzaamheden moeten
      verrichten, mits deze worden verricht op uitdrukkelijke last van de ter plaatse verantwoordelijke opzichter en
      onder toepassing van door deze aan te geven doelmatige voorzorgsmaatregelen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel74
  - number: '74.3'
    text: |-
      Gedurende werkzaamheden in bunkers of kokers dan wel in of onder voor vervoer bestemde afdelingen van schachten
      en van tussenschachten of andere opbraken, mag in de bunker, koker, schacht, tussenschacht of andere opbraak geen
      vervoer plaats hebben, tenzij doelmatige maatregelen zijn genomen om de arbeiders tegen in beweging zijnde of
      vallende voorwerpen te beveiligen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel74
  - number: '75.1'
    text: |-
      Van alle in schachten en tussenschachten bij het vervoer voorgekomen gebeurtenissen, waardoor het normale
      gebruik van de ophaalinstallatie wordt verhinderd, zomede van ernstige beschadigingen van de ophaalmachine,
      schachtbetimmeringen, seintoestellen, geleidingen, kabels, kooien en dergelijke, moet onverwijld worden kennis
      gegeven aan de Inspecteur-Generaal der Mijnen. De beschadigde delen moeten bewaard blijven tot een bij of krachtens
      artikel 325, eerste lid, aangewezen ambtenaar deze heeft vrijgegeven.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel75
  - number: '75.2'
    text: |-
      Van belangrijke gebeurtenissen in andere opbraken dan tussenschachten, zoals het breken van kabels, instortingen,
      ernstige beschadigingen van ophaalinstallaties of schachtbetimmeringen, alsmede van andere beschadigingen, waardoor
      de opbraak voor tenminste 2 dagen geheel of gedeeltelijk buiten gebruik is geraakt of vermoedelijk buiten gebruik
      zal blijven, moet onverwijld worden kennis gegeven aan de Inspecteur-Generaal der Mijnen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel75
  - number: '76.1'
    text: |-
      Op iedere verdieping, waar winning plaats vindt, moeten tenminste twee doelmatige verbindingen met de oppervlakte
      aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel76
  - number: '76.2'
    text: |-
      In de ondergrondse werken moeten op een voldoend aantal doelmatig gekozen plaatsen doelmatige middelen tot
      communicatie met de oppervlakte aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel76
  - number: '76.3'
    text: Onze Minister kan van het in het eerste lid bepaalde ontheffing verlenen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel76
  - number: '77.1'
    text: |-
      De ondergrondse werken moeten zodanig zijn ingericht en de arbeid moet zodanig worden verricht, dat de arbeiders in
      de gelegenheid zijn de werkpunten ogenblikkelijk te verlaten en op veilige wijze de hoofdwegen te bereiken.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel77
  - number: '77.2'
    text: De winningsplaatsen moeten elk twee afzonderlijke vluchtwegen hebben.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel77
  - number: '77.3'
    text: |-
      Op hoekpunten van hoofdsteengangen, afdelingssteengangen en grondgalerijen moeten doelmatige wegwijzers zijn
      aangebracht.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel77
  - number: '77.4'
    text: |-
      De nummers van de tussenschachten en andere opbraken moeten op de betrokken laad- en losvloeren op voldoend
      duidelijke wijze zijn vermeld.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel77
  - number: '77.5'
    text: Onze Minister kan van het in het tweede lid bepaalde ontheffing verlenen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel77
  - number: '78.1'
    text: |-
      Alle gedeelten van de ondergrondse werken, welke niet voldoen aan de eisen voor het verkeer gesteld, moeten op
      doelmatige wijze zijn afgesloten; waar dit met het oog op het vervoer niet mogelijk is, moet aan de toegangen op in
      het oog vallende en duidelijke wijze worden bekend gemaakt, dat het verboden is de plaats te betreden.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel78
  - number: '78.2'
    text: |-
      Het is verboden zonder uitdrukkelijke last van een verantwoordelijke toezichthoudende persoon voor het verkeer
      afgesloten gedeelten der ondergrondse werken of gedeelten, aan de toegang waarvan een bekendmaking als in het
      eerste lid bedoeld is aangebracht, te betreden.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel78
  - number: '78.3'
    text: Het is verboden afsluitingen te openen of bekendmakingen of waarschuwingstekens te verwijderen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel78
  - number: '79.1'
    text: |-
      Vervoerswegen en voetpaden moeten zodanig zijn ingericht en worden onderhouden, dat de veiligheid voldoende is
      gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel79
  - number: '79.2'
    text: De doorsnede van de vervoerswegen moet zodanig zijn, dat het vervoer veilig kan geschieden.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel79
  - number: '79.3'
    text: |-
      Vervoerswegen mogen niet voor verkeer worden gebruikt, tenzij voldoende ruimte voor een veilig verkeer aanwezig is,
      of - wanneer aan deze eis niet kan worden voldaan - de veiligheid van het verkeer door toepassing van doelmatige
      middelen op andere wijze is gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel79
  - number: '80.1'
    text: |-
      Wissels en luchtdeuren in vervoerswegen, waar intensief vervoer plaats heeft, en op andere, door Onze Minister
      aangegeven, plaatsen moeten zodanig zijn ingericht, dat zij op afstand kunnen worden omgelegd onderscheidenlijk
      geopend. Het omleggen en het openen moeten zodanig kunnen geschieden, dat de bestuurder van een locomotief deze
      niet behoeft te verlaten.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel80
  - number: '80.2'
    text: |-
      Op afstand bedienbare luchtdeuren mogen niet op andere wijze worden bediend en moeten zodanig zijn ingericht, dat,
      voordat de luchtdeur wordt geopend, de aandacht hierop wordt gevestigd.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel80
  - number: '81.1'
    text: |-
      Bij kruisingen en splitsingen van vervoerswegen, bij toegangen en uitgangen van emplacementen en zo nodig in
      vervoerswegen, waar intensief vervoer plaats vindt, moeten doelmatige veiligheidsmaatregelen worden genomen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel81
  - number: '81.2'
    text: |-
      Hindernissen in vervoerswegen, zomede werkpunten in de onmiddellijke nabijheid daarvan moeten op doelmatige wijze
      worden aangeduid.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel81
  - number: '81.3'
    text: |-
      Bij kruisingen en splitsingen van vervoerswegen dan wel van vervoerswegen en voetpaden moeten voldoende maatregelen
      worden genomen om veilig vervoer en verkeer te waarborgen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel81
  - number: '82.1'
    text: |-
      Wanneer een voetpad zo steil helt, dat het verkeer daarover moeilijk of gevaarlijk is, moeten doelmatige
      voorzieningen worden getroffen, zodat het verkeer veilig kan geschieden. Helt een voetpad meer dan 45°, dan moeten
      op doelmatige wijze veilige ladders en rustvloeren zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel82
  - number: '82.2'
    text: |-
      Wanneer naast of op een voetpad als in het eerste lid bedoeld ook vervoer plaats vindt, moeten met het oog daarop
      ten aanzien van het verkeer doelmatige veiligheidsmaatregelen worden genomen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel82
  - number: '83'
    text: In pijlers moet een doelmatig voetpad aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel83
  - number: '84.1'
    text: |-
      Het is verboden de voor vervoer bestemde afdeling van een hellende galerij of van een hellende steengang, waarin
      discontinuvervoer plaats heeft, te betreden.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel84
  - number: '84.2'
    text: |-
      Het in het eerste lid bepaalde geldt niet voor personen, die in de afdeling werkzaamheden moeten verrichten, indien
      voldoende maatregelen te hunner beveiliging zijn genomen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel84
  - number: '84.3'
    text: Onze Minister kan ten behoeve van het verkeer van het in het eerste lid bepaalde ontheffing verlenen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel84
  - number: '85.1'
    text: |-
      Spoor-, rail- en kabelbanen, lier- en andere transportinrichtingen, niet zijnde ophaalinrichtingen, met alles wat
      daartoe behoort, en het rollend materieel moeten zodanig zijn ingericht en worden onderhouden, dat de veiligheid
      voldoende is gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel85
  - number: '85.2'
    text: Doelmatige maatregelen moeten worden genomen tegen de gevaren, welke hun gebruik kan opleveren.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel85
  - number: '86.1'
    text: Het personenvervoer per trein mag uitsluitend geschieden met doelmatig, speciaal voor dat doel, ingerichte wagens.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel86
  - number: '86.2'
    text: |-
      In vervoerswegen, waar een rijdraadnet aanwezig is en waar de rijdraad tijdens het vervoer onder spanning staat,
      moeten deze wagens overdekt zijn.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel86
  - number: '86.3'
    text: |-
      Het vervoer van personen kan plaats hebben met goederentreinen; Onze Minister kan hieromtrent nadere regelen
      stellen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel86
  - number: '87'
    text: |-
      Personenvervoer en vervoer van personen zijn uitsluitend toegestaan, indien Onze Minister voor de
      transportinrichting of het transportmiddel, waarmede en, voor zover betreft personenvervoer, voor het traject,
      waarop dit vervoer zal plaats hebben, vergunning daartoe heeft verleend.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel87
  - number: '88.1'
    text: |-
      Locomotieven en andere voertuigen met eigen drijfkracht moeten voldoen aan door Onze Minister te stellen eisen
      inzake veiligheid en doelmatigheid.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel88
  - number: '88.2'
    text: |-
      Het is verboden andere locomotieven en andere voertuigen met eigen drijfkracht te gebruiken dan die, welke door
      Onze Minister, op grond van het voldoen aan de krachtens het eerste lid gestelde eisen, zijn goedgekeurd.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel88
  - number: '89'
    text: |-
      Het vervoer met behulp van locomotieven en andere voertuigen met stroomafnemers is verboden, tenzij Onze Minister
      daartoe vergunning heeft verleend. Een vergunning wordt uitsluitend verleend voor een bepaald traject.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel89
  - number: '90'
    text: |-
      Bij mechanisch vervoer mag de aandrijfinrichting niet worden ingeschakeld of de vervoersinrichting niet in
      beweging worden gesteld dan nadat voldoende maatregelen zijn getroffen, die gevaar voor personen als gevolg van dat
      inschakelen onderscheidenlijk in beweging stellen voorkomen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel90
  - number: '91'
    text: |-
      Het vervoer moet worden gestaakt, zodra aan de vervoersinrichting of de vervoersweg gebreken, die gevaar voor
      personen kunnen veroorzaken, worden bemerkt.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel91
  - number: '92'
    text: |-
      De bediening van inrichtingen van vervoer moet op veilige wijze geschieden door deskundige en daartoe voldoend
      geïnstrueerde personen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel92
  - number: '93.1'
    text: Doelmatige instructies moeten worden uitgevaardigd ter verzekering van een veilig vervoer.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel93
  - number: '93.2'
    text: |-
      Met betrekking tot het railvervoer moet een reglement worden vastgesteld, dat moet worden goedgekeurd door Onze
      Minister. De in het eerste lid bedoelde instructies moeten, voor zover zij op dat vervoer betrekking hebben en van
      blijvende aard zijn, in dat reglement worden opgenomen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel93
  - number: '94'
    text: |-
      Onverminderd het in artikel 75 bepaalde, moet van alle bij het verkeer of vervoer voorgekomen bijzondere
      gebeurtenissen, die op de veiligheid van invloed kunnen zijn of zijn geweest, onverwijld mededeling worden gedaan
      aan de Inspecteur-Generaal der Mijnen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel94
  - number: '95'
    text: Het vervoer van materieel met behulp van handkracht moet op veilige wijze geschieden.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel95
  - number: '96'
    text: |-
      Het gebruik van trekdieren in de ondergrondse werken is toegestaan; Onze Minister kan hieromtrent nadere regelen
      stellen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel96
  - number: '97.1'
    text: |-
      Ter plaatse waar arbeid wordt verricht moet een verlichting aanwezig zijn, welke voor deze arbeid voldoende en
      doelmatig is. Er moet, voor zover mogelijk, voldoende daglicht kunnen binnenkomen en er dienen, rekening houdend
      met de klimatologische omstandigheden, de nodige voorzieningen voor een adequate kunstverlichting aanwezig te
      zijn om de veiligheid en de gezondheid van de arbeiders te beschermen. De verlichtingsinstallaties in werkruimten
      en verbindingswegen moeten zodanig zijn aangebracht dat de verlichting geen ongevallenrisico’s voor de arbeiders
      oplevert.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel97
  - number: '97.2'
    text: |-
      Portalen, gangen, trappen en andere toegangswegen, was-, bad- en kleedgelegenheden, magazijnen, bergplaatsen en
      terreinen moeten op tijden, dat arbeiders, die niet uitsluitend belast zijn met bewaking, daarvan gebruik moeten
      maken, voor dat gebruik voldoende en doelmatig zijn verlicht.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel97
  - number: '97.3'
    text: In wacht- en schaftlokalen, alsmede in loonhallen moet een voldoende en doelmatige verlichting aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel97
  - number: '97.4'
    text: |-
      Privaten en urinoirs moeten zodanig zijn verlicht, dat zij behoorlijk zijn te gebruiken en dat goed kan worden
      waargenomen of zij in zindelijke staat verkeren.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel97
  - number: '97.5'
    text: |-
      Arbeidsplaatsen waar arbeiders bij het uitvallen van de kunstverlichting aan bijzondere risico’s zijn blootgesteld,
      moeten met een doelmatige en voldoende sterke noodverlichting zijn uitgerust.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel97
  - number: '97.6'
    text: Het in het tweede en derde lid bepaalde geldt niet ten aanzien van mijnbouwinstallaties.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel97
  - number: 97a.1
    text: |-
      Verlichtingsinstallaties moeten zodanig ontworpen zijn dat operationele bedieningsruimten, vluchtwegen,
      inschepingszones en gevaarlijke zones verlicht blijven.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel97a
  - number: 97a.2
    text: |-
      Wanneer arbeidsplaatsen slechts bij gelegenheid bemand zijn, geldt hetgeen in het eerste lid is voorgeschreven
      slechts voor de duur van de aanwezigheid van de arbeiders.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel97a
  - number: '98'
    text: |-
      Op de losvloer aan de schachtmond moet, voor zover de toegang tot de plaats niet is afgesloten, een voldoende en
      doelmatige verlichting aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel98
  - number: 98a.1
    text: |-
      Portalen, trappen, loopgangen en andere doorgangen, was-, bad- en kleedgelegenheden, magazijnen, bergplaatsen,
      inschepingsplaatsen en vrije dekruimten op een mijnbouwinstallatie moeten op tijden, dat personen daarvan gebruik
      moeten maken, voor dat gebruik voldoende en doelmatig zijn verlicht.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel98a
  - number: 98a.2
    text: |-
      Portalen, trappen, loopgangen en andere doorgangen, zomede inschepingsplaatsen en vrije dekruimten op een bemande
      mijnbouwinstallatie moeten voortdurend voldoende en doelmatig zijn verlicht.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel98a
  - number: 98a.3
    text: |-
      In recreatie-, schaft- en slaapverblijven op een mijnbouwinstallatie moet een voldoende en doelmatige verlichting
      aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel98a
  - number: '99.1'
    text: |-
      De zich in de nabijheid van een schacht bevindende hoofdschakelruimten voor hoge spanning, machinekamers,
      locomotiefloodsen en magazijnen, de los- en laadplaatsen van schachten en tussenschachten, de steengangen en
      hellingen, voor zover daarin intensief verkeer en vervoer plaats heeft, en de mechanische pijlers moeten voldoende
      en doelmatig zijn verlicht.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel99
  - number: '99.2'
    text: |-
      Andere tot de ondergrondse werken behorende ruimten of plaatsen moeten, voor zover zij door Onze Minister daartoe
      zijn aangewezen, voldoende en doelmatig zijn verlicht.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel99
  - number: '99.3'
    text: Onze Minister kan van het in het eerste lid bepaalde ontheffing verlenen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel99
  - number: '100'
    text: |-
      Locomotieven en andere, door Onze Minister aangewezen, voertuigen moeten van een doelmatige verlichting zijn
      voorzien.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel100
  - number: '101'
    text: |-
      Als lampen ten behoeve van individuele verlichting mogen alleen worden gebruikt lampen, welke voldoen aan door Onze
      Minister daarvoor te stellen eisen inzake veiligheid en doelmatigheid.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel101
  - number: '102.1'
    text: |-
      Het is verboden zonder lamp als in artikel 101 bedoeld in de ondergrondse werken af te dalen of aldaar te
      verblijven.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel102
  - number: '102.2'
    text: |-
      Onze Minister kan voor bepaalde mijnwerken of gedeelten van zodanige werken van het in het eerste lid bepaalde
      ontheffing verlenen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel102
  - number: '103.1'
    text: |-
      Op ieder mijnwerk moet een aantal lampen als in artikel 101 bedoeld aanwezig zijn, dat tenminste gelijk is aan het
      totale aantal voor ondergronds ingeschreven personen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel103
  - number: '103.2'
    text: |-
      Een voldoende aantal zodanige lampen moet bovendien op doelmatig gelegen plaatsen steeds voor onmiddellijk gebruik
      als reservelampen gereed worden gehouden.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel103
  - number: '104.1'
    text: |-
      Op de bovengrondse werken moeten doelmatig ingerichte lokalen voor het bewaren en onderhouden van de draagbare
      lampen aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel104
  - number: '104.2'
    text: Met de leiding van de werkzaamheden in de lokalen moet een voldoend bekwaam en betrouwbaar persoon zijn belast.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel104
  - number: '104.3'
    text: |-
      Met het uitgeven en in ontvangst nemen van en de controle op de lampen moet tenminste één speciaal daartoe
      aangewezen voldoend bekwaam persoon zijn belast, met dien verstande dat bij zelfbediening voldoende maatregelen
      moeten zijn genomen om een ordelijk uit de rekken nemen en daarin terugplaatsen van de lampen te verzekeren.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel104
  - number: '104.4'
    text: |-
      Voldoende maatregelen moeten worden genomen om te verzekeren, dat alleen deugdelijke lampen voor gebruik
      beschikbaar zijn.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel104
  - number: '104.5'
    text: |-
      De lampen moeten door de gebruikers in persoon worden afgehaald, zodanig dat steeds kan worden nagegaan aan wie een
      bepaalde lamp ter beschikking is gesteld. De lampen moeten door de gebruikers in persoon worden ingeleverd. Dezen
      moeten zich bij het in ontvangst nemen van een lamp ervan overtuigen, of de lamp in onbeschadigde toestand verkeert
      en goed gesloten is; beschadigde of niet goed gesloten lampen moeten terstond worden ingeleverd.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel104
  - number: '105.1'
    text: Lampen mogen alleen bovengronds en slechts door bevoegde personen worden geopend.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel105
  - number: '105.2'
    text: |-
      In de ondergrondse werken aanwezige open of defect geraakte lampen moeten zo spoedig mogelijk op veilige wijze
      daaruit worden verwijderd.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel105
  - number: '105.3'
    text: |-
      Het is verboden gereedschappen tot het openen van lampen in de ondergrondse werken mede te voeren of bij zich te
      hebben.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel105
  - number: '106.1'
    text: |-
      Bij de keuze, de installatie, de ingebruikneming, de werking en het onderhoud van werktuigen, werktuigdelen,
      drijfwerken, gereedschappen, leidingen, ketels, reservoirs en andere toestellen moet rekening gehouden worden met
      de veiligheid en gezondheid van de arbeiders.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel106
  - number: '106.2'
    text: |-
      Wanneer de apparatuur zich bevindt in een zone waar brand- of explosiegevaar als gevolg van de ontbranding
      van gassen, dampen of vluchtige vloeistoffen bestaat of kan bestaan, moet zij aangepast zijn aan gebruik in
      een dergelijke zone. Indien nodig moet zij worden voorzien van afdoende beschermingsmiddelen en systemen ter
      beveiliging bij defecten.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel106
  - number: '106.3'
    text: |-
      De mechanische apparatuur en installaties moeten de nodige sterkte bezitten, vrij zijn van zichtbare gebreken en
      geschikt zijn voor het gebruik waarvoor zij zijn bestemd.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel106
  - number: '106.4'
    text: |-
      Er moet een doelmatig plan worden opgesteld voor het systematisch inspecteren, het onderhouden en, in voorkomend
      geval, het beproeven van de apparatuur en installaties. Onderhoud, inspectie en beproeving van enig onderdeel
      van de apparatuur en installaties moet door een daartoe aangewezen deskundig persoon worden uitgevoerd. Er moeten
      doelmatige inspectie- en beproevingsrapporten worden opgesteld en naar behoren worden bijgehouden.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel106
  - number: '107.1'
    text: |-
      Werktuigen en drijfwerken moeten zodanig zijn ingericht, opgesteld en beschut en zodanig worden gebruikt, dat het
      gevaar, hetwelk zij kunnen opleveren, zoveel mogelijk wordt voorkomen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel107
  - number: '107.2'
    text: |-
      Werktuigen, waarvan de onderdelen door snijden, knellen of pletten, door hun grote snelheid of op andere wijze
      gevaar kunnen opleveren, of bij het gebruik waarvan gevaar bestaat voor het afvliegen van vonken, splinters,
      schilfers of dergelijke kleine delen, moeten zijn voorzien van zodanige toestellen of beschuttingen, dat gevaar
      zoveel mogelijk wordt voorkomen. Zo nodig moeten doelmatige hulp- en beschuttingsmiddelen beschikbaar zijn, welke
      bij het verrichten van werkzaamheden, waarvoor deze middelen bestemd zijn, op doelmatige wijze moeten worden
      gebruikt.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel107
  - number: '107.3'
    text: |-
      De gevaar veroorzakende delen van een werkstuk, dat ter bewerking door een werktuig in beweging wordt gehouden,
      moeten zo nodig en zo mogelijk doelmatig zijn beschut.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel107
  - number: '107.4'
    text: |-
      Ter verzekering van het veilig tornen en op gang brengen en het onverwijld en met zekerheid stilzetten van
      werktuigen en drijfwerken en ter voorkoming van overschrijding van veilige snelheden daarvan, moeten zo nodig
      doelmatige inrichtingen zijn aangebracht en worden gebruikt, waarschuwingstekens of -seinen worden gegeven en alle
      verder nodige maatregelen worden genomen om gevaar zoveel mogelijk te voorkomen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel107
  - number: '107.5'
    text: |-
      Indien het verrichten van werkzaamheden aan of in de nabijheid van een in beweging zijnd deel van een werktuig of
      drijfwerk gevaar kan opleveren, moeten zij bij stilstand daarvan worden verricht. In geval de aard van het bedrijf
      dit niet toelaat, mogen de werkzaamheden slechts worden verricht met gebruikmaking van zodanige hulpmiddelen en
      onder toepassing van zodanige veiligheidsmaatregelen, dat het gevaar zoveel mogelijk wordt voorkomen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel107
  - number: '108.1'
    text: |-
      Een hijs- of hefwerktuig moet zodanig zijn ingericht, opgesteld, beveiligd en zo nodig verankerd of vastgezet,
      dat het gevaar van een onverwacht in beweging komen, kantelen, beschadigen en dergelijke zoveel mogelijk wordt
      voorkomen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel108
  - number: '108.2'
    text: |-
      Een hijs- of hefwerktuig moet zijn voorzien van een doelmatige inrichting, waardoor het dalen van de last te allen
      tijde kan worden stopgezet, zo nodig de snelheid van het dalen kan worden geregeld en onverhoeds dalen van de last
      wordt belet.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel108
  - number: '108.3'
    text: |-
      Een met een hijs- of hefwerktuig te verplaatsen last mag niet zwaarder zijn dan een veilig gebruik van dat werktuig
      toelaat. Met betrekking tot de werkbelasting moet rekening worden gehouden met de omstandigheden, waaronder een
      hijs- of hefwerktuig wordt gebruikt; zij moet op een doelmatige plaats onuitwisbaar en duidelijk leesbaar zijn
      aangegeven.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel108
  - number: '109.1'
    text: |-
      Onverminderd het elders in dit reglement met betrekking tot ophaalinstallaties bepaalde, moet een door een
      krachtwerktuig gedreven hijs- of hefwerktuig, voordat het in gebruik wordt genomen, aan een deskundig onderzoek
      worden onderworpen. Zodanig onderzoek moet regelmatig worden herhaald.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel109
  - number: '109.2'
    text: De bij elk onderzoek verkregen gegevens moeten op doelmatige wijze schriftelijk worden vastgelegd en bewaard.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel109
  - number: '109.3'
    text: |-
      Onze Minister kan tijdstippen bepalen, waarop het herhaalde onderzoek moet plaats vinden. Hij kan voorts bepalen,
      dat door hem aangewezen hijs- of hefwerktuigen van dit onderzoek zijn uitgezonderd.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel109
  - number: 109a
    text: De bediening van een hijs- of hefwerktuig moet door voldoende deskundig personeel geschieden.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel109a
  - number: '110.1'
    text: |-
      Een lift, met alles wat daartoe behoort, moet op doelmatige wijze zijn beschut en zodanig zijn ingericht en
      beveiligd, dat het gevaar, dat personen vallen of bekneld geraken of geraakt worden door vallende voorwerpen,
      zoveel mogelijk wordt voorkomen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel110
  - number: '110.2'
    text: 'Met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel110
  - number: 110.2.a
    text: het vervoeren van personen en goederen met een lift,
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel110
  - number: 110.2.b
    text: het maximaal in een liftkooi toelaatbare aantal personen en toelaatbaar gewicht aan goederen,
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel110
  - number: 110.2.c
    text: het plaatsen en vastzetten van een last op de vloer van een liftkooi en
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel110
  - number: 110.2.d
    text: |-
      het gebruik van goederenliften door personen, moeten zodanig doelmatige voorzieningen zijn getroffen, dat gevaar
      zoveel mogelijk wordt voorkomen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel110
  - number: 110a.1
    text: |-
      In dit artikel wordt onder «lift» en «veiligheidscomponenten» verstaan hetgeen daaronder wordt verstaan in het
      [Besluit liften][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008212
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel110a
    references:
      - id: ref1
        bwb_id: BWBR0008212
  - number: 110a.2
    text: |-
      De artikelen 106 tot en met 110, 111, 112 en 116 zijn niet van toepassing op liften en veiligheidscomponenten
      waarop het [Besluit liften][ref1] van toepassing is voor zover deze bepalingen eisen stellen met betrekking tot
      het ontwerp, de vervaardigingswijze of de eigenschappen van liften of veiligheidscomponenten of daarop aangebrachte
      vermeldingen als bedoeld in [artikel 5 van het Besluit liften][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008212
      [ref2]: https://wetten.overheid.nl/BWBR0008212#Artikel5
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel110a
    references:
      - id: ref1
        bwb_id: BWBR0008212
      - id: ref2
        bwb_id: BWBR0008212
        artikel: '5'
  - number: '111.1'
    text: |-
      Kettingwerk, staaldraadkabels en touwen moeten voldoen aan de eis van goed en veilig werk en in goede staat van
      onderhoud verkeren. Zij moeten zodanig worden gebruikt, dat gevaar zoveel mogelijk wordt voorkomen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel111
  - number: '111.2'
    text: |-
      Het inkorten en verlengen van kettingwerk, staaldraadkabels en touwen, zomede het bevestigen daarvan aan een
      hefwerktuig, last of ander voorwerp moeten op deugdelijke wijze geschieden.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel111
  - number: '112.1'
    text: |-
      Stookinrichtingen, stoomketels, vaten en dergelijke, waarin zich gassen, dampen of vloeistoffen bevinden of
      kunnen bevinden, moeten zodanig zijn ingericht, opgesteld en beschut en zodanig worden gebruikt, dat gevaar zoveel
      mogelijk wordt voorkomen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel112
  - number: '112.2'
    text: |-
      Installaties, toestellen en leidingen, waarin zich vloeistoffen of gassen bevinden, moeten zodanig zijn ingericht,
      aangegelegd en beschut en zodanig worden gebruikt, dat gevaar zoveel mogelijk wordt voorkomen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel112
  - number: 112a.1
    text: |-
      In dit artikel wordt onder "drukvat" verstaan hetgeen daaronder wordt verstaan in het
      [Besluit drukvaten van eenvoudige vorm][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005627
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel112a
    references:
      - id: ref1
        bwb_id: BWBR0005627
  - number: 112a.2
    text: |-
      De artikelen 106 en 112 zijn niet van toepassing op drukvaten voor zover deze bepalingen eisen stellen met
      betrekking tot het ontwerp, de vervaardigingswijze of de eigenschappen van drukvaten of daarop aangebrachte
      vermeldingen als bedoeld in [artikel 4 van het Besluit drukvaten van eenvoudige vorm][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005627#Artikel4
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel112a
    references:
      - id: ref1
        bwb_id: BWBR0005627
        artikel: '4'
  - number: 112b.1
    text: |-
      In dit artikel wordt onder «drukapparatuur», «samenstellen» en «druksystemen» verstaan hetgeen daaronder wordt
      verstaan in het [Besluit drukapparatuur][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010586
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel112b
    references:
      - id: ref1
        bwb_id: BWBR0010586
  - number: 112b.2
    text: |-
      De artikelen 106 en 112 zijn niet van toepassing op drukapparatuur, samenstellen en druksystemen, voor zover
      deze bepalingen eisen stellen met betrekking tot het ontwerp, de vervaardigingswijze, de eigenschappen en de
      ingebruikneming van drukapparatuur, samenstellen en druksystemen of daarop aangebrachte vermeldingen als bedoeld in
      [artikel 5 van het Besluit drukapparatuur][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010586#Artikel5
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel112b
    references:
      - id: ref1
        bwb_id: BWBR0010586
        artikel: '5'
  - number: '113'
    text: |-
      Het bij de arbeid tijdelijk buiten werking stellen of terzijde leggen van werktuigen, gereedschappen of andere
      voorwerpen moet zodanig geschieden, dat gevaar zoveel mogelijk wordt voorkomen. In het bijzonder moeten zo
      nodig maatregelen worden genomen tegen een onverwacht weer op gang komen van door een krachtwerktuig aangedreven
      werktuigen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel113
  - number: 113a.1
    text: |-
      In dit artikel wordt onder "machine" en "veiligheidscomponent" verstaan hetgeen daaronder wordt verstaan in het
      [Besluit machines][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005884
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel113a
    references:
      - id: ref1
        bwb_id: BWBR0005884
  - number: 113a.2
    text: |-
      De artikelen 106 tot en met 110 en 112 zijn niet van toepassing op machines en veiligheidscomponenten
      voor zover deze bepalingen eisen stellen met betrekking tot het ontwerp, de vervaardigingswijze of de
      eigenschappen van machines of veiligheidscomponenten of daarop aangebrachte vermeldingen als bedoeld in
      [artikel 4 van het Besluit machines][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005884#Artikel4
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel113a
    references:
      - id: ref1
        bwb_id: BWBR0005884
        artikel: '4'
  - number: 113b.1
    text: |-
      In dit artikel wordt onder "explosieveilig materieel" verstaan hetgeen daaronder wordt verstaan in het
      [Besluit explosieveilig materieel][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007497
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel113b
    references:
      - id: ref1
        bwb_id: BWBR0007497
  - number: 113b.2
    text: |-
      De artikelen 106 tot en met 110, 112, 114 en 116 zijn niet van toepassing op explosieveilig materieel
      voor zover deze bepalingen eisen stellen met betrekking tot het ontwerp, de vervaardigingswijze of
      de eigenschappen van explosieveilig materieel of daarop aangebrachte vermeldingen als bedoeld in
      [artikel 4 van het Besluit explosieveilig materieel][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007497#Artikel4
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel113b
    references:
      - id: ref1
        bwb_id: BWBR0007497
        artikel: '4'
  - number: 113c.1
    text: |-
      In dit artikel wordt onder «apparaat» verstaan hetgeen daaronder wordt verstaan in de Wet op de
      telecommunicatievoorzieningen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel113c
  - number: 113c.2
    text: |-
      De artikelen 106 tot en met 110, 112, 114 en 116 zijn niet van toepassing op apparaten voorzover deze bepalingen
      eisen stellen als bedoeld in artikel 3 van het Besluit elektromagnetische compatibiliteit met betrekking tot de
      elektromagnetische compatibiliteit van apparaten.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel113c
  - number: '114.1'
    text: |-
      Elektrische installaties en onderdelen daarvan moeten zodanig worden ingericht en aangelegd en elektrische
      machines, transformatoren, schakel- en verdeelinrichtingen, zomede elektrische toestellen en elektrische leidingen
      en bijbehoren van deze leidingen moeten zodanig worden geconstrueerd, samengesteld, beveiligd en beschermd,
      dat zoveel mogelijk wordt voorkomen, dat bij gebruik of bediening, alsmede bij herstellings-, onderhouds-,
      onderzoekings-, meet- of controlewerkzaamheden gevaar, met inbegrip van gevaar voor de veiligheid en de gezondheid
      van arbeiders, optreedt.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel114
  - number: '114.2'
    text: |-
      Bij het aanleggen, uitbreiden, wijzigen, herstellen, onderhouden, onderzoeken, meten en controleren van elektrische
      installaties of onderdelen daarvan moeten de nodige voorzieningen worden getroffen om zoveel mogelijk te voorkomen,
      dat gevaar voor het ontstaan van brand of ontploffing of voor verwonding van personen optreedt, of dat een
      gevaarlijke stroomovergang op personen plaats heeft.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel114
  - number: '114.3'
    text: |-
      Wanneer de apparatuur zich bevindt in een zone waar brand- of explosiegevaar als gevolg van de ontbranding van
      gassen, dampen of vluchtige vloeistoffen bestaat of kan bestaan, moet zij zijn aangepast aan het gebruik in
      een dergelijke zone. Indien nodig moet zij worden voorzien van afdoende beschermingsmiddelen en systemen ter
      beveiliging bij defecten.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel114
  - number: '114.4'
    text: |-
      De elektrotechnische apparatuur en installaties moeten voldoende kracht en vermogen hebben voor het gebruik
      waarvoor zij zijn bestemd.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel114
  - number: '114.5'
    text: |-
      Er moet een doelmatig plan worden opgesteld voor het systematisch inspecteren, het onderhouden en, in voorkomend
      geval, het beproeven van de apparatuur en installaties. Onderhoud, inspectie en beproeving van enig onderdeel
      van de apparatuur en installaties moet door een daartoe aangewezen deskundig persoon worden uitgevoerd. Er moeten
      doelmatige inspectie- en beproevingsrapporten worden opgesteld en naar behoren worden bijgehouden.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel114
  - number: '114.6'
    text: |-
      Onze Minister kan ter bevordering van een goede uitvoering van het in de voorgaande leden bepaalde nadere regelen
      stellen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel114
  - number: '115'
    text: |-
      Naar gelang van de aard en de mate van het ontploffingsgevaar kan Onze Minister de boven- en ondergrondse werken,
      boorwerken en mijnbouwkundige onderzoekingen of delen van die werken en onderzoekingen indelen in gevarenklassen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel115
  - number: '116.1'
    text: |-
      Onze Minister kan in het belang van het voorkomen van het optreden van ontploffingsgevaar bepalen, dat in of op een
      mijnwerk, op een boorwerk of in of op een deel van zodanig werk aanwezige of bij een mijnbouwkundig onderzoek of
      bij een deel daarvan gebruikte elektrische machines, transformatoren, schakel- en verdeelinrichtingen, elektrische
      toestellen of elektrische leidingen en bijbehoren van deze leidingen, in verband met de indeling krachtens artikel
      115 van dat werk, dat onderzoek of dat deel daarvan in een bepaalde gevarenklasse, moeten zijn voorzien van een
      geldig, in overeenstemming met hem vastgesteld, merkteken, ten bewijze van de afgifte van een certificaat van
      goedkeuring.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel116
  - number: '116.2'
    text: |-
      Het certificaat van goedkeuring moet zijn afgegeven door een daartoe door Onze Minister aangewezen instelling of
      onderneming. Het certificaat moet inhouden, dat het betrokken materieel, blijkens een door de afgever verrichte
      keuring, ten tijde van de afgifte voldeed aan het bij en krachtens artikel 114 bepaalde.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel116
  - number: '116.3'
    text: |-
      Bij een aanwijzing krachtens het tweede lid kunnen voorwaarden worden gesteld; zij kan te allen tijde worden
      ingetrokken of gewijzigd.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel116
  - number: '116.4'
    text: |-
      Onze Minister kan merktekens en certificaten, die in het buitenland op elektrisch materieel zijn aangebracht
      onderscheidenlijk daarvoor zijn afgegeven, met de krachtens het eerste lid vastgestelde merktekens en de krachtens
      het tweede lid afgegeven certificaten gelijkstellen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel116
  - number: '116.5'
    text: |-
      In door Onze Minister aangewezen gevallen kan worden volstaan met keuring van een of meer het type materieel
      kenmerkende monsters. Ten aanzien van het monster is alsdan het in het tweede lid bepaalde van overeenkomstige
      toepassing. Het krachtens het eerste lid vastgestelde merkteken mag op elektrisch materieel, dat geheel
      overeenkomstig het monster, waarvoor een certificaat is afgegeven, is vervaardigd, zonder nadere keuring worden
      aangebracht.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel116
  - number: '116.6'
    text: |-
      Onze Minister kan ter bevordering van een goede uitvoering van het in de voorgaande leden bepaalde nadere regelen
      stellen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel116
  - number: '117'
    text: |-
      Op verlangen van de Inspecteur-Generaal der Mijnen moet een certificaat van goedkeuring voor elektrisch materieel
      aan deze worden overgelegd.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel117
  - number: '118.1'
    text: |-
      Voor het in de ondergrondse werken aanleggen, uitbreiden of wijzigen van elektrische installaties, waarvan de
      nominale spanning een door Onze Minister te bepalen grens overschrijdt, is een vergunning van deze vereist.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel118
  - number: '118.2'
    text: |-
      Bij de aanvraag om vergunning wordt een door Onze Minister te bepalen aantal exemplaren van een doelmatig schema
      overgelegd, volgens hetwelk de installatie zal worden aangelegd, uitgebreid of gewijzigd.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel118
  - number: '118.3'
    text: |-
      Wanneer elektrische installaties in de ondergrondse werken worden aangelegd, uitgebreid of gewijzigd, zonder dat
      daarvoor een vergunning als in het eerste lid bedoeld is vereist, moet, indien Onze Minister zulks verlangt, een
      door hem bepaald aantal exemplaren van een voldoende uitgewerkt schema aan de Inspecteur-Generaal der Mijnen worden
      overgelegd.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel118
  - number: '119'
    text: |-
      Uiterlijk op 1 maart van ieder kalenderjaar moet aan de Inspecteur-Generaal der Mijnen een door Onze Minister te
      bepalen aantal exemplaren worden overgelegd van een voldoende uitgewerkt schema van het geheel van die elektrische
      installaties in de tot ieder mijnwerk behorende ondergrondse werken, waarvan de nominale spanningen de krachtens
      artikel 118, eerste lid, bepaalde grens overschrijden. Het schema moet de toestand op enig tijdstip tussen 15 en 31
      december van het voorafgaande kalenderjaar weergeven.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel119
  - number: '120'
    text: |-
      Onze Minister kan, wanneer in de ondergrondse werken plaatselijk gevaar bestaat voor het vrijkomen van grote
      hoeveelheden mijngas of kolenstof, het gebruik van elektriciteit daar ter plaatse verbieden of beperken.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel120
  - number: '121.1'
    text: 'Bij een onderneming, waartoe een mijnwerk voor de ontginning van steenkolen behoort, moeten aanwezig zijn:'
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel121
  - number: 121.1.a
    text: |-
      kaarten van de oppervlakte, al dan niet op doorzichtig materiaal getekend, waarop de ligging van het mijnveld met
      de daarbinnen gelegen gebouwen en andere opstallen, spoor-, land- en waterwegen, hoofdtransportleidingen en andere
      belangrijke objecten ten genoegen van de Inspecteur-Generaal der Mijnen zijn aangegeven, benevens alle binnen het
      mijnveld gelegen vaste meetpunten, alsmede de bovengrondse boringen en de mijnwerkgrenzen;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel121
  - number: 121.1.b
    text: |-
      een hoofdgrondplan, waarop van alle in ontginning zijnde of geweest zijnde lagen zijn aangegeven alle
      grondgalerijen en horizontaal steenwerk op de verschillende verdiepingen, de schachten, de tussenschachten en
      andere opbraken, veiligheidspijlers, grensmuren en muren met de coördinaten van de daarbij behorende grenspunten,
      en voorts alles wat verder met het oog op de veiligheid van belang kan worden geacht;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel121
  - number: 121.1.c
    text: |-
      een laagplan, waarop van elke in ontginning zijnde of geweest zijnde laag zijn aangegeven de daarop betrekking
      hebbende werken, de boringen naar het dekterrein, de grens van het mijnwerk en de veiligheidspijlers, en waarop
      mede zijn aangegeven de ontginningswerken in het aangrenzende mijnwerk, die op dezelfde laag betrekking hebben,
      voor zover zij zijn gelegen binnen een afstand van 100 meter van de gemeenschappelijke grens van de betrokken
      mijnwerken;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel121
  - number: 121.1.d
    text: |-
      een kaart van de oppervlakte van het carboon, waarop alle boringen naar het dekterrein op voldoend duidelijke wijze
      zijn aangegeven;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel121
  - number: 121.1.e
    text: |-
      een hoofddoorsnede van het geheel der ondergrondse werken, genomen loodrecht op de gemiddelde richting der lagen en
      zo mogelijk door de as der hoofdschacht, alsmede een voldoende aantal hulpdoorsneden;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel121
  - number: 121.1.f
    text: een verzameling van de profielen van alle ondergronds uitgevoerde geologische boringen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel121
  - number: '121.2'
    text: |-
      Op een hoofdgrondplan moet de ligging van de in het eerste lid onder *e* bedoelde doorsneden op voldoend duidelijke
      wijze zijn aangegeven.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel121
  - number: '121.3'
    text: |-
      Op een hoofdgrondplan mag maximaal een door Onze Minister te bepalen aantal verdiepingen worden aangegeven. Hij kan
      voorschrijven, dat door hem aangewezen gegevens als in het eerste lid onder *b* bedoeld, niet op dit plan, maar op
      een of meer van de in dat lid onder *c* bedoelde plannen worden vermeld.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel121
  - number: '121.4'
    text: |-
      Indien twee mijnvelden aan elkander grenzen, zijn de bestuurders van de betrokken mijnondernemingen verplicht
      elkander halfjaarlijks voldoend duidelijke gegevens te verstrekken inzake hun ontginningswerken binnen een afstand
      van 100 meter van de gemeenschappelijke grens.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel121
  - number: '121.5'
    text: |-
      Indien Onze Minister zulks verlangt, moeten aan de Inspecteur-Generaal der Mijnen doorsneden van opbraken en
      steengangen worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel121
  - number: '122.1'
    text: 'Bij een onderneming, waartoe een boorwerk voor de ontginning van bitumina behoort, moeten aanwezig zijn:'
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel122
  - number: 122.1.a
    text: kaarten van de oppervlakte als in artikel 121, eerste lid, onder *a*, bedoeld;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel122
  - number: 122.1.b
    text: doelmatige profielen van elke diepboring.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel122
  - number: '122.2'
    text: |-
      Het in het eerste lid onder *b* bepaalde is van overeenkomstige toepassing op een onderneming, waartoe een boorwerk
      voor de opsporing van bitumina behoort.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel122
  - number: '123.1'
    text: |-
      Bij een onderneming, waartoe een boorwerk voor de ontginning van steenzout of de winning van zout uit zouthoudend
      bodemwater behoort, moeten aanwezig zijn:
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel123
  - number: 123.1.a
    text: |-
      kaarten van de oppervlakte als in artikel 121, eerste lid, onder *a*, bedoeld, waarop de winplaatsen voor water
      zijn aangegeven;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel123
  - number: 123.1.b
    text: doelmatige profielen van elke diepboring.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel123
  - number: '123.2'
    text: |-
      Het in het eerste lid onder *b* bepaalde is van overeenkomstige toepassing op een onderneming, waartoe een boorwerk
      voor de opsporing van steenzout of zouthoudend bodemwater behoort.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel123
  - number: '124'
    text: 'Bij een onderneming, waartoe een mijnwerk voor de ontginning van bruinkolen behoort, moeten aanwezig zijn:'
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel124
  - number: 124.a
    text: kaarten van de oppervlakte als in artikel 121, eerste lid, onder *a*, bedoeld;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel124
  - number: 124.b
    text: |-
      een laagplan, aangevende de begrenzing van de plaats gehad hebbende en de stand van de aan de gang zijnde
      ontginningswerken, welk plan moet zijn aangevuld met doorsneden, waarvan de ligging is vastgesteld in overleg met
      de Inspecteur-Generaal der Mijnen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel124
  - number: '125.1'
    text: |-
      Kaarten, plannen en doorsneden moeten op materiaal van duurzame kwaliteit worden vervaardigd. De schaal en de ter
      verduidelijking op die bescheiden aan te brengen gegevens worden door Onze Minister in overleg met de bestuurders
      van de betrokken mijnonderneming vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel125
  - number: '125.2'
    text: |-
      Op de in de artikelen 121-124 bedoelde kaarten en plannen moeten, voor zover zij hiervoor in aanmerking komen,
      evenwijdig met de zijden, coördinatenlijnen worden aangebracht, waarvan de onderlinge afstand een afstand van 100
      meter of een veelvoud van 100 meter voorstelt.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel125
  - number: '126.1'
    text: |-
      Op de plannen moet aan alle galerijen op één verdieping en aan de ontginningswerken, gelegen boven en behorende
      tot deze verdieping, een kleur worden gegeven, welke duidelijk verschilt van de kleuren van de aangrenzende
      verdiepingen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel126
  - number: '126.2'
    text: |-
      Op de in artikel 121 bedoelde kaarten en plannen moet, voor zover zij betrekking hebben op de ondergrondse werken,
      de hoogteligging dezer werken ten opzichte van het Normaal Amsterdams Peil duidelijk en voldoende nauwkeurig worden
      aangegeven. De ligging van het oppervlak van het carboon moet zo nauwkeurig mogelijk worden aangegeven.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel126
  - number: '126.3'
    text: Onze Minister kan van het in het eerste lid bepaalde ontheffing verlenen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel126
  - number: '127'
    text: |-
      De ontgonnen gedeelten moeten ten genoegen van de Inspecteur-Generaal der Mijnen op de plannen worden aangegeven,
      waarbij de data van de metingen moeten worden vermeld.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel127
  - number: '128.1'
    text: |-
      Onze Minister bepaalt welke van de in de artikelen 121-124 bedoelde kaarten, plannen, doorsneden en profielen in
      duplo moeten worden vervaardigd; één exemplaar van deze in duplo vervaardigde bescheiden moet berusten bij het
      Staatstoezicht op de Mijnen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel128
  - number: '128.2'
    text: |-
      De kaarten, plannen, doorsneden en profielen, welke bij het Staatstoezicht op de Mijnen berusten, moeten elke 6
      maanden door de zorg van de bestuurders worden bijgewerkt. Onze Minister kan in bijzondere gevallen een kortere
      termijn vaststellen. Het bijwerken mag niet langer duren dan één maand.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel128
  - number: '128.3'
    text: |-
      In geval bij het Staatstoezicht op de Mijnen berustende kaarten, plannen, doorsneden of profielen geheel of
      gedeeltelijk door nieuwe worden vervangen, blijven de vervangen exemplaren bij die dienst berusten.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel128
  - number: '128.4'
    text: |-
      In geval een mijnwerk of een boorwerk wordt verlaten, moeten de door Onze Minister aan te wijzen kaarten, plannen,
      doorsneden en profielen, voor zover de bescheiden voor de betrokken mijnonderneming niet meer van belang zijn, aan
      het Staatstoezicht op de Mijnen worden toegezonden. Zij worden in het archief opgelegd.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel128
  - number: '129.1'
    text: |-
      Het vervaardigen en bijwerken van kaarten, plannen, doorsneden en profielen dient met voldoende nauwkeurigheid te
      geschieden door of vanwege een daartoe door de bestuurders van de betrokken mijnonderneming aangewezen mijnmeter,
      of, voor zover het betreft de ontginning van bruinkolen dan wel de opsporing of ontginning van bitumina of zout,
      door of vanwege een terzake deskundig persoon.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel129
  - number: '129.2'
    text: |-
      De aldus vervaardigde of bijgewerkte bescheiden moeten door de betrokken mijnmeter of de betrokken deskundige
      persoon, zomede door de bestuurders van de betrokken mijnonderneming zijn ondertekend en door de Inspecteur-
      Generaal der Mijnen zijn gewaarmerkt. Deze laatste is bevoegd ook andere kaarten en plannen te waarmerken.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel129
  - number: '129.3'
    text: |-
      Een mijnmeter of een deskundig persoon als in het eerste lid bedoeld is verplicht alle hem bij de uitoefening
      van zijn taak gebleken misstanden onmiddellijk ter kennis van de bestuurders van de betrokken mijnonderneming te
      brengen en deze kennisgeving schriftelijk te bevestigen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel129
  - number: '130'
    text: |-
      Wanneer Onze Minister in kaarten, plannen, doorsneden of profielen onnauwkeurigheden, fouten of nalatigheden heeft
      aangetroffen, moeten de door hem aangegeven veranderingen en aanvullingen binnen een door hem vastgestelde termijn
      worden aangebracht.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel130
  - number: '131'
    text: |-
      Op ondernemingen, waartoe behoort een mijn- of boorwerk voor de ontginning van andere dan de in de artikelen 121-
      124 genoemde delfstoffen, zijn de artikelen 121-130, naar gelang van de wijze van ontginning van de betrokken
      delfstof, van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel131
  - number: '132.1'
    text: |-
      Ten dienste van het vervaardigen en bijwerken van kaarten, plannen, doorsneden en profielen als in de vorige
      paragraaf bedoeld moeten voldoende opmetingen worden verricht.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel132
  - number: '132.2'
    text: Regelmatig moet een voldoende aantal waterpassingen en lengtemetingen worden uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel132
  - number: '133.1'
    text: |-
      Alle metingen moeten met voldoende nauwkeurigheid worden uitgevoerd en voor zover mogelijk worden aangepast aan het
      stelsel van de Rijksdriehoeksmeting.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel133
  - number: '133.2'
    text: |-
      Met de mogelijkheid van onnauwkeurigheid bij metingen moet in de nabijheid van de grens van het mijnveld en van de
      dekterreingrens voldoende rekening worden gehouden.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel133
  - number: '133.3'
    text: |-
      Wanneer de ontginning een plaats is genaderd, welke onaangetast moet blijven, moeten de ontginningswerken met
      voldoende frequentie worden opgemeten.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel133
  - number: '133.4'
    text: |-
      Zodra blijkt, dat, anders dan op grond van een krachtens artikel 37, tweede lid, of artikel 38, derde lid,
      verleende ontheffing, de bij artikel 37, eerste lid, bepaalde afstand van het dekterrein is overschreden of de bij
      of krachtens artikel 38, eerste of tweede lid, bepaalde grensmuur of muur is aangetast, moet daarvan onverwijld
      schriftelijk mededeling worden gedaan aan de Inspecteur-Generaal der Mijnen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel133
  - number: '134.1'
    text: |-
      De gegevens van de opmetingen, die voor de vervaardiging van kaarten, plannen, doorsneden en profielen hebben
      gediend, de gegevens betreffende bovengrondse waterpassingen en lengtemetingen, benevens die gegevens, welke
      nodig zijn om te allen tijde de stand van de ontginningswerken te kunnen reconstrueren, moeten in registers worden
      vermeld.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel134
  - number: '134.2'
    text: De Inspecteur-Generaal der Mijnen is bevoegd meetregisters te waarmerken.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel134
  - number: '134.3'
    text: |-
      De artikelen 128, vierde lid, en 130 zijn van overeenkomstige toepassing op meetregisters en in verband met
      opmetingen gemaakte berekeningen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel134
  - number: '135.1'
    text: |-
      Het is verboden geplaatste meettekens te beschadigen. Verplaatsen of verwijderen van meettekens mag alleen
      geschieden met voorkennis van de ter plaatse verantwoordelijke, overeenkomstig artikel 8, tweede lid, met toezicht
      belaste mijnmeter onderscheidenlijk van de bij de plaatsing van die tekens betrokken, krachtens artikel 129, eerste
      lid, aangewezen persoon.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel135
  - number: '135.2'
    text: |-
      In geval een opmeting vanwege de Inspecteur-Generaal der Mijnen wordt verricht, zijn de bestuurders van de
      betrokken mijnonderneming verplicht de nodige hulp te verschaffen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel135
  - number: '136'
    text: |-
      Het is verboden een mijnwerk, een boorwerk of een terrein, waar een mijnbouwkundig onderzoek werd of wordt
      verricht, te verlaten, voordat voldoende maatregelen zijn genomen ter voorkoming van het optreden van gevaar.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel136
  - number: '137.1'
    text: |-
      Alvorens een bij een diepboring behorend boorgat wordt verlaten, moeten de delfstofhoudende lagen en de
      delfstofafzettingen, voor zover daaraan door water schade kan worden toegebracht, waterdicht zijn afgesloten; de
      plaats van een dergelijk boorgat moet aan de hand van de krachtens artikel 128, vierde lid, of 134, derde lid,
      aangewezen bescheiden kunnen worden nagegaan.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel137
  - number: '137.2'
    text: |-
      Van het verlaten van een boorgat als in het eerste lid bedoeld moet binnen 14 dagen schriftelijk mededeling worden
      gedaan aan de Inspecteur-Generaal der Mijnen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel137
  - number: 137a.1
    text: |-
      Van het voornemen om een mijnbouwinstallatie te verwijderen moet tenminste 24 uur voordat met de desbetreffende
      werkzaamheden wordt aangevangen mededeling worden gedaan:
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel137a
  - number: 137a.1.a
    text: aan de Inspecteur-Generaal der Mijnen;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel137a
  - number: 137a.1.b
    text: |-
      indien de mijnbouwinstallatie is geplaatst op of boven de bodem van een oppervlaktewater als in artikel 36a, tweede
      lid, onder *a*, bedoeld, aan het Hoofd van de Afdeling Hydrografie van het Ministerie van Defensie.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel137a
  - number: 137a.2
    text: |-
      Van het voornemen om een door Onze Minister aangewezen, niet als een geheel verplaatsbare mijnbouwinstallatie te
      verwijderen moet bovendien tenminste een bij de aanwijzing te bepalen aantal dagen voordat met de desbetreffende
      werkzaamheden wordt aangevangen mededeling worden gedaan:
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel137a
  - number: 137a.2.a
    text: |-
      indien de mijnbouwinstallatie is geplaatst op of boven de bodem van een oppervlaktewater als in artikel 36*a*,
      tweede lid, onder *a*, bedoeld, aan de Directeur-Generaal van Loodswezen, Betonning, Bebakening en Verlichting;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel137a
  - number: 137a.2.b
    text: |-
      indien de mijnbouwinstallatie is geplaatst op of boven de bodem van een oppervlaktewater als in artikel 36*a*,
      tweede lid, onder *b*, bedoeld, aan de Directeur-Generaal van de Rijkswaterstaat.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel137a
  - number: 137a.3
    text: |-
      Bij een mededeling als in het eerste of tweede lid bedoeld moeten worden opgegeven de ligging van de plaats, waar
      de mijnbouwinstallatie is geplaatst, uitgedrukt in coördinaten volgens het stelsel van de Rijksdriehoeksmeting, en
      het tijdstip, waarop met de desbetreffende werkzaamheden zal worden aangevangen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel137a
  - number: 137a.4
    text: |-
      Zodra een mijnbouwinstallatie is verwijderd, moet daarvan onverwijld schriftelijk mededeling worden gedaan aan
      degene, aan wie ingevolge het eerste en tweede lid mededeling is gedaan. Bij deze mededeling moet worden opgegeven
      de ligging van de plaats, waar de mijnbouwinstallatie was geplaatst, uitgedrukt in coördinaten volgens het stelsel
      van de Rijksdriehoeksmeting.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel137a
  - number: 137b
    text: |-
      Bij het verwijderen van een mijnbouwinstallatie moeten voldoende maatregelen worden genomen ter voorkoming van het
      optreden van gevaar.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel137b
  - number: '138'
    text: |-
      Wanneer de ondergrondse werken in hun geheel of een belangrijk gedeelte daarvan voor langer dan zes maanden worden
      verlaten, moet hiervan, zo mogelijk tenminste een maand tevoren, schriftelijk mededeling worden gedaan aan de
      Inspecteur-Generaal der Mijnen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel138
  - number: '139'
    text: |-
      Het is verboden enig gedeelte van de ondergrondse werken te verlaten, voordat dit is opgemeten en in tekening
      gebracht en de metingen in het meetregister zijn vermeld.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel139
  - number: '140'
    text: |-
      Wanneer in strijd met het in artikel 139 bepaalde is gehandeld, kan Onze Minister bevelen de door hem aangewezen
      verlaten gedeelten van de ondergrondse werken, voor zover deze ontoegankelijk zijn, weder toegankelijk te maken
      voor het alsnog doen verrichten van metingen als in dat artikel bedoeld.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel140
  - number: '141'
    text: |-
      De artikelen 139 en 140 zijn niet van toepassing indien langer verblijf ter plaatse gevaar oplevert; alsdan moet
      het nog niet opgemeten gedeelte van de ondergrondse werken onmiddellijk na het verlaten zo nauwkeurig mogelijk op
      de betrokken plannen worden aangegeven, mede op grond van gegevens van personen, die het laatst ter plaatse waren,
      en moet van het een en ander melding worden gemaakt in het meetregister.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel141
  - number: '142.1'
    text: |-
      Alvorens een gedeelte van de ondergrondse werken wordt verlaten, moeten voldoende maatregelen zijn genomen
      in het belang van de luchtverversing en om het uittreden van gevaarlijke gassen en het optreden van water- of
      drijfzanddoorbraken te voorkomen, en, indien gevaar voor broei aanwezig is, voldoende maatregelen om het optreden
      hiervan te voorkomen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel142
  - number: '142.2'
    text: |-
      Tijdelijk of voorgoed verlaten gedeelten, die nog toegankelijk zijn, moeten voldoende worden geventileerd of anders
      zodanig worden afgesloten, dat zij niet zonder het gebruiken van geweld kunnen worden betreden.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel142
  - number: '142.3'
    text: Het is aan onbevoegden verboden de afsluitingen te verbreken of de betrokken gedeelten te betreden.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel142
  - number: 142a.1
    text: |-
      Het voorgoed verlaten van de ondergrondse werken mag niet anders geschieden dan overeenkomstig een bij de
      in artikel 138 bedoelde mededeling aan de Inspecteur-Generaal der Mijnen toegezonden doelmatig schriftelijk
      sluitingsplan, waarin zijn aangegeven de maatregelen, welke zullen worden getroffen ter voldoening aan het bij en
      krachtens artikel 136 bepaalde.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel142a
  - number: 142a.2
    text: De artikelen 20, derde lid, 21 en 22 zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel142a
  - number: 142b
    text: |-
      Indien de ondergrondse werken voorgoed worden verlaten en die werken grenzen aan de ondergrondse werken van een
      ander mijnwerk, moeten:
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel142b
  - number: 142b.a
    text: |-
      de bestuurders van de betrokken mijnonderneming aan de bestuurders van de mijnonderneming, waartoe het aangrenzende
      mijnwerk behoort, doelmatige hoogtelijn-plannen verstrekken, waaruit kan worden afgeleid het gevaar voor water- of
      drijfzanddoorbraken, dat door het verlaten van de desbetreffende ondergrondse werken voor de ondergrondse werken
      van het aangrenzende mijnwerk kan ontstaan;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel142b
  - number: 142b.b
    text: |-
      de in het in artikel 142a, eerste lid, bedoelde sluitingsplan aan te geven maatregelen, voor zover betrekking
      hebbend op het voorkomen van gevaar als onder *a* bedoeld, zijn vastgesteld na onderling overleg tussen de
      bestuurders van de betrokken mijnondernemingen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel142b
  - number: 142c
    text: |-
      Zodra de ondergrondse werken zijn verlaten, moet aan de Inspecteur-Generaal der Mijnen een rapport inzake de in
      verband met het verlaten uitgevoerde werkzaamheden worden toegezonden, onder overlegging van voldoende gegevens,
      die voor de veiligheid van belang kunnen zijn.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel142c
  - number: 142d.1
    text: |-
      Indien de ondergrondse werken voor een belangrijk gedeelte voorgoed worden verlaten, zijn de artikelen
      142*a*-142*c* van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel142d
  - number: 142d.2
    text: |-
      In zodanig geval dienen in het sluitingsplan als bedoeld in artikel 142*a* tevens te worden aangegeven de
      maatregelen, welke zullen worden getroffen ter voldoening aan het bij en krachtens artikel 142 bepaalde.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel142d
  - number: '143'
    text: |-
      Buiten gebruik gestelde schachten moeten op doelmatige wijze zijn afgesloten; de plaats van een dergelijke schacht
      moet aan de hand van de krachtens artikel 128, vierde lid, of 134, derde lid, aangewezen bescheiden kunnen worden
      nagegaan.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel143
  - number: 143a.1
    text: |-
      Van het voornemen om buiten de terreinen van boorwerken een pijpleiding, bestemd voor het vervoeren van de gewonnen
      delfstoffen, dan wel een door Onze Minister aangewezen andere met de winning van delfstoffen verband houdende
      pijpleiding te leggen moet, ten minste twaalf weken voordat met de desbetreffende werkzaamheden wordt aangevangen,
      schriftelijk mededeling worden gedaan aan Onze Minister en de Inspecteur-Generaal der Mijnen, onder opgave van:
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel143a
  - number: 143a.1.a
    text: |-
      de ligging van het traject, waarlangs de pijpleiding zal worden gelegd, uitgedrukt in coördinaten volgens het
      stelsel van de Rijksdriehoeksmeting;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel143a
  - number: 143a.1.b
    text: de diameter van de pijpleiding en de minimale diepte, waarop zij in de bodem zal komen te liggen;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel143a
  - number: 143a.1.c
    text: de datum, waarop met de desbetreffende werkzaamheden zal worden aangevangen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel143a
  - number: 143a.2
    text: |-
      Van het voornemen om een pijpleiding als in het eerste lid bedoeld in een oppervlaktewater te leggen moet
      gelijktijdig met de in het eerste lid bedoelde mededeling bovendien, onder opgave van de in dat lid bedoelde
      gegevens, schriftelijk mededeling worden gedaan:
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel143a
  - number: 143a.2.a
    text: |-
      indien de pijpleiding zal worden gelegd op of in de bodem van een oppervlaktewater als in artikel 36*a*, tweede
      lid, onder *a*, bedoeld, aan het Hoofd van de Afdeling Hydrografie van het Ministerie van Defensie en de Directeur-
      Generaal van Loodswezen, Betonning, Bebakening en Verlichting;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel143a
  - number: 143a.2.b
    text: |-
      indien de pijpleiding zal worden gelegd op of in de bodem van een oppervlaktewater als in artikel 36*a*, tweede
      lid, onder *b*, bedoeld, aan de Directeur-Generaal van de Rijkswaterstaat.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel143a
  - number: 143a.3
    text: |-
      Een mededeling als in de voorgaande leden bedoeld moet vergezeld gaan van een doelmatige kaart, waarop de ligging
      van het traject, waarlangs de pijpleiding zal worden gelegd, en de minimale diepte, waarop zij in de bodem zal
      komen te liggen, op voldoend duidelijke wijze zijn aangegeven.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel143a
  - number: 143a.4
    text: |-
      Van wijziging van de in het eerste lid bedoelde gegevens dient onverwijld schriftelijk mededeling te worden gedaan
      aan degenen, aan wie ingevolge het eerste en tweede lid mededeling is gedaan.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel143a
  - number: 143b
    text: |-
      Wanneer het leggen van een pijpleiding als in artikel 143*a* bedoeld gevaar kan opleveren, kan Onze Minister bij
      een ten hoogste acht weken na de ontvangst door hem van de in artikel 143*a*, eerste lid, bedoelde mededeling aan
      de bestuurders van de betrokken mijnonderneming of in artikel 12, eerste lid, bedoelde andere onderneming toe te
      zenden beschikking bepalen, dat het leggen van die pijpleiding niet mag plaatsvinden dan langs een traject en op
      een minimale diepte in de bodem, zomede op een wijze, welke bij die beschikking zijn aangegeven.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel143b
  - number: 143c.1
    text: |-
      Bij het leggen van een pijpleiding, bestemd voor het vervoeren van de gewonnen delfstoffen, dan wel van een door
      Onze Minister aangewezen andere met de winning van delfstoffen verband houdende pijpleiding moeten voldoende
      maatregelen worden genomen ter voorkoming van het optreden van gevaar.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel143c
  - number: 143c.2
    text: |-
      Ten aanzien van het in of op de bodem van een oppervlaktewater als in artikel 36*e*, eerste lid, bedoeld leggen van
      een pijpleiding als in het eerste lid bedoeld is artikel 36*e*, eerste, tweede en zesde lid, van overeenkomstige
      toepassing.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel143c
  - number: 143d.1
    text: |-
      Pijpleidingen als in artikel 143*c*, eerste lid, bedoeld moeten bestaan uit voldoende sterke pijpen, die op
      doelmatige wijze onderling zijn verbonden.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel143d
  - number: 143d.2
    text: De pijpleidingen moeten doelmatig tegen corrosie en voldoende tegen uitwendige krachten zijn beschermd.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel143d
  - number: 143d.3
    text: |-
      Ten aanzien van de pijpleidingen moeten ook overigens voldoende maatregelen worden genomen ter voorkoming van het
      optreden van gevaar.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel143d
  - number: 143e.1
    text: |-
      Een pijpleiding als in artikel 143*c*, eerste lid, bedoeld moet, tijdig voordat zij in gebruik wordt genomen, door
      een terzake deskundige instelling of onderneming op doelmatige wijze worden onderzocht op haar deugdelijkheid.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel143e
  - number: 143e.2
    text: |-
      Indien de pijpleiding in of op de bodem van een oppervlaktewater als in artikel 36*e*, eerste lid, bedoeld is
      gelegd, moet:
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel143e
  - number: 143e.2.a
    text: |-
      het in het eerste lid van dit artikel bedoelde onderzoek bovendien zijn gericht op de nauwkeurige vaststelling van
      het traject, waarlangs zij is gelegen, en, voor zover de leiding in de bodem van het oppervlaktewater is gelegen,
      de diepte waarop zij daarin ligt;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel143e
  - number: 143e.2.b
    text: |-
      de pijpleiding binnen door Onze Minister aangegeven termijnen periodiek, alsmede tussentijds, indien en voor zover
      hij zulks verlangt, door een terzake deskundige instelling of onderneming op doelmatige wijze worden onderzocht:
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel143e
  - number: 143e.2.b.1°
    text: |-
      indien zij op de bodem van het oppervlaktewater is gelegd, ter vaststelling van mogelijke afwijkingen van
      haar ligging ten opzichte van het traject, zoals opgegeven ingevolge artikel 143*a*, eerste lid, onder *a*, of
      aangegeven krachtens artikel 143*b*, dan wel toegestaan krachtens artikel 143*f*, tweede lid;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel143e
  - number: 143e.2.b.2°
    text: |-
      indien zij in de bodem van het oppervlaktewater is gelegd, ter vaststelling van haar mogelijk ondiepere ligging
      daarin dan opgegeven ingevolge artikel 143*a*, eerste lid, onder *b*, of aangegeven krachtens artikel 143*b*, dan
      wel toegestaan krachtens artikel 143*f*, tweede lid.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel143e
  - number: 143e.3
    text: |-
      Indien en voor zover bij een onderzoek krachtens het tweede lid, onder *b*, 2°, een ondiepere ligging van de
      pijpleiding als daar bedoeld wordt geconstateerd en zij door die ondiepere ligging gevaar kan opleveren, moet dat
      onderzoek mede zijn gericht op mogelijke afwijkingen van de ligging der pijpleiding ten opzichte van het traject
      als in dat lid, onder *b*, 1°, bedoeld.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel143e
  - number: 143e.4
    text: |-
      Ten minste twee weken voordat met een onderzoek ingevolge het eerste of tweede lid wordt aangevangen moet aan de
      Inspecteur-Generaal der Mijnen schriftelijk worden medegedeeld door welke instelling of onderneming het onderzoek
      zal worden verricht.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel143e
  - number: 143e.5
    text: |-
      Van ieder ingevolge het eerste of tweede lid verricht onderzoek moet een doelmatig rapport worden opgesteld,
      waarvan binnen een door Onze Minister te bepalen termijn aan hem en de Inspecteur-Generaal der Mijnen een
      afschrift dient te worden toegezonden, zomede, indien de pijpleiding op of in de bodem van een oppervlaktewater
      als in artikel 36*a*, tweede lid, onder *a* of *b*, bedoeld is gelegen, aan het Hoofd van de Afdeling Hydrografie
      van het Ministerie van Defensie en de Directeur-Generaal van Loodswezen, Betonning, Bebakening en Verlichting
      onderscheidenlijk de Directeur-Generaal van de Rijkswaterstaat.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel143e
  - number: 143f.1
    text: 'Het is verboden een pijpleiding als in artikel 143c, eerste lid, bedoeld in gebruik te nemen, indien:'
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel143f
  - number: 143f.1.a
    text: zij niet deugdelijk is en daardoor gevaar kan opleveren;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel143f
  - number: 143f.1.b
    text: |-
      zij in of op de bodem van een oppervlaktewater is gelegd en haar ligging afwijkt van die van het traject of haar
      ligging in de bodem ondieper is dan de diepte daarin, zoals opgegeven ingevolge artikel 143*a*, eerste lid, onder
      *a*, onderscheidenlijk *b*, dan wel aangegeven krachtens artikel 143*b*, en zij daardoor gevaar kan opleveren.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel143f
  - number: 143f.2
    text: Onze Minister kan van het eerste lid, onder *b*, ontheffing verlenen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel143f
  - number: 143f.3
    text: |-
      Indien alsnog blijkt dat de pijpleiding als in het eerste lid, onder *b*, bedoeld gevaar kan opleveren doordat zij
      niet deugdelijk is, dan wel doordat haar ligging afwijkt van die van het traject of haar ligging in de bodem van
      het oppervlaktewater ondieper is dan de diepte daarin, zoals opgegeven ingevolge artikel 143*a*, eerste lid, onder
      *a*, onderscheidenlijk *b*, of aangegeven krachtens artikel 143*b*, dan wel toegestaan krachtens het tweede lid van
      dit artikel, kan Onze Minister maatregelen voorschrijven ter opheffing of beperking van het gevaar.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel143f
  - number: 143g
    text: |-
      Zodra lekkage van een pijpleiding als in artikel 143*c*, eerste lid, bedoeld wordt geconstateerd, moet deze
      zoveel mogelijk worden beperkt en moeten, tenzij de pijpleiding buiten gebruik wordt gesteld, onverwijld de nodige
      herstelwerkzaamheden worden uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel143g
  - number: '144.1'
    text: 'Bij elke mijnonderneming moeten een of meer doelmatig georganiseerde veiligheidsdiensten zijn belast met:'
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel144
  - number: 144.1.a
    text: het overwegen en voorbereiden van maatregelen, die met betrekking tot de veiligheid dienen te worden genomen;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel144
  - number: 144.1.b
    text: het doen van voorstellen daaromtrent aan de bestuurders;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel144
  - number: 144.1.c
    text: het toezien op de uitvoering van de door of vanwege de bestuurders terzake genomen beslissingen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel144
  - number: '144.2'
    text: Onze Minister kan van het in het eerste lid bepaalde ontheffing verlenen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel144
  - number: '145.1'
    text: |-
      Het is verboden op of in een mijn- of op een boorwerk alcoholhoudende drank mede te nemen, bij zich te hebben of
      te gebruiken.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel145
  - number: '145.2'
    text: |-
      Een persoon, die onder invloed van alcoholhoudende drank verkeert, moet de toegang tot een mijn- of een boorwerk
      worden ontzegd; indien hij zich reeds aldaar bevindt, moet hij onmiddellijk van dat werk worden verwijderd.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel145
  - number: '145.3'
    text: |-
      Voor de toepassing van de voorgaande leden wordt met alcoholhoudende drank gelijkgesteld elke stof, door het
      gebruik waarvan iemands geestelijke of lichamelijke gesteldheid zodanig wordt beïnvloed, dat daardoor gevaar voor
      de veiligheid kan ontstaan.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel145
  - number: '145.4'
    text: Onze Minister kan van het in het eerste lid bepaalde ontheffing verlenen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel145
  - number: '146'
    text: |-
      Wanneer de algemene veiligheid dan wel de veiligheid op of in een mijnwerk, op een boorwerk of op een terrein, waar
      mijnbouwkundige onderzoekingen worden verricht, op enige wijze wordt bedreigd, alsmede wanneer een of meer personen
      zich in levensgevaar bevinden of bevonden hebben, zomede wanneer instortingen of andere belangrijke voorvallen
      hebben plaats gehad, die de veiligheid in gevaar hebben gebracht of hadden kunnen brengen, moet hiervan onverwijld
      mededeling worden gedaan aan de Inspecteur-Generaal der Mijnen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel146
  - number: '147'
    text: |-
      Wanneer naar het oordeel van Onze Minister hetzij voor de algemene veiligheid, hetzij voor de veiligheid op
      of in een mijnwerk of op een boorwerk of op een terrein, waar mijnbouwkundige onderzoekingen worden verricht,
      gevaar bestaat, kan hij maatregelen ter afwending van dat gevaar voorschrijven, de bestuurders van de betrokken
      mijnonderneming - behoudens in geval van onmiddellijk dreigend gevaar - gehoord.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel147
  - number: 147a.1
    text: |-
      In dit artikel wordt onder "veiligheids- of gezondheidssignalering" verstaan hetgeen daaronder wordt verstaan in
      het [Arbeidsomstandighedenbesluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008498
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel147a
    references:
      - id: ref1
        bwb_id: BWBR0008498
  - number: 147a.2
    text: |-
      Bij werkzaamheden bij, op of in een mijnwerk of een boorwerk of bij mijnbouwkundige onderzoekingen is
      [hoofdstuk 8][ref1], [afdeling 2 van het Arbeidsomstandighedenbesluit](onbekend), van overeenkomstige toepassing,
      met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel147a
    references:
      - id: ref1
        bwb_id: BWBR0008498
        hoofdstuk: '8'
  - number: 147a.2.a
    text: |-
      de bestuurders van de betrokken mijnonderneming of in artikel 12, eerste lid, bedoelde andere onderneming in de
      plaats treden van de werkgever;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel147a
  - number: 147a.2.b
    text: |-
      de personen die werkzaam zijn bij, op of in een mijnwerk of een boorwerk of bij mijnbouwkundige onderzoekingen in
      de plaats treden van de werknemers.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel147a
  - number: 147a.3
    text: |-
      Personen die werkzaam zijn bij, op of in een mijnwerk of een boorwerk of bij mijnbouwkundige onderzoekingen
      of hun vertegenwoordigers dienen te worden geïnformeerd over alle ten aanzien van de veiligheids- of
      gezondheidssignalering op het werk te nemen maatregelen. Personen die werkzaam zijn bij, op of in een
      mijnwerk of een boorwerk of bij mijnbouwkundige onderzoekingen dienen voorts ten aanzien van de veiligheids-
      of gezondheidssignalering op het werk een passende opleiding te krijgen, met name in de vorm van nauwkeurige
      instructies. Deze opleiding dient in het bijzonder betrekking te hebben op de betekenis van de signalering, met
      name wanneer daarbij woorden worden gebruikt, en op de te volgen algemene en specifieke handelwijzen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel147a
  - number: 147a.4
    text: |-
      De ondernemingsraad of, bij het ontbreken daarvan, de betrokken personen worden geraadpleegd omtrent en nemen deel
      aan de behandeling van de onderwerpen betreffende veiligheids- of gezondheidssignalering.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel147a
  - number: 147a.5
    text: |-
      Bij de uitvoering van de bij het tweede lid van overeenkomstige toepassing verklaarde
      [afdeling 2 van hoofdstuk 8 van het Arbeidsomstandighedenbesluit][ref1] gaan de bestuurders van de betrokken
      mijnonderneming of in artikel 12, eerste lid, bedoelde andere onderneming uit van elke krachtens het Mijnreglement
      1964 verrichte risico-evaluatie.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Afdeling2
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel147a
    references:
      - id: ref1
        bwb_id: BWBR0008498
        afdeling: '2'
  - number: 147a.6
    text: |-
      Onze Minister kan ter bevordering van een goede uitvoering van het tweede tot en met vijfde lid nadere regels
      stellen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel147a
  - number: 147b.1
    text: |-
      Zones waar een bijzonder risico bestaat, moeten worden afgebakend en er moeten doelmatige waarschuwingsborden
      worden geplaatst.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel147b
  - number: 147b.2
    text: |-
      Arbeidsplaatsen waar door de aard van het werk gevarenzones, met inbegrip van valgevaar voor arbeiders of gevaar
      voor vallende voorwerpen, voorkomen, moeten zoveel mogelijk zijn uitgerust met voorzieningen die moeten beletten
      dat arbeiders deze zones zonder toestemming betreden.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel147b
  - number: 147b.3
    text: Er moeten doelmatige maatregelen worden getroffen om de arbeiders die de gevarenzone mogen betreden te beschermen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel147b
  - number: 147b.4
    text: De gevarenzones moeten duidelijk zichtbaar worden aangegeven.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel147b
  - number: 147b.5
    text: Onze Minister kan nadere regelen stellen ter zake van het in de voorgaande leden bepaalde.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel147b
  - number: '148.1'
    text: |-
      Het tewerkstellen van één enkele arbeider op een afgelegen werkpunt is slechts toegestaan, indien voor de
      veiligheid van deze arbeider op doelmatige wijze wordt gewaakt.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel148
  - number: '148.2'
    text: |-
      Wanneer arbeiders aanwezig zijn op arbeidsplaatsen die normaliter niet zijn bemand, moet er een doelmatig
      communicatiesysteem zijn.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel148
  - number: '149'
    text: |-
      Wanneer twee of meer arbeiders tot een groep verenigd arbeid verrichten, moet een van hen zijn aangewezen, teneinde
      toe te zien op al hetgeen nodig is om gevaar voor ongevallen te keren en de vereiste maatregelen te nemen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel149
  - number: '150.1'
    text: Iedere arbeider moet zich vóór de aanvang van zijn werkzaamheden van de veiligheid op zijn werkpunt overtuigen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel150
  - number: '150.2'
    text: |-
      Bij onmiddellijk dreigend gevaar moet het werk terstond worden gestaakt en de werkplaats zo nodig worden verlaten
      en moet van een en ander onverwijld mededeling worden gedaan aan de ter plaatse verantwoordelijke toezichthoudende
      persoon. Waar personen in gevaar zijn moet het nodige worden verricht tot afwending van het gevaar.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel150
  - number: '150.3'
    text: |-
      De voorman van elke groep moet aan de voorman van de daaropvolgende groep alle bijzonderheden mededelen, die in
      zijn werktijd zijn voorgevallen of waargenomen, voor zover deze op de veiligheid van invloed kunnen zijn. Zo nodig
      moet deze mededeling ter plaatse van het voorvallen of waarnemen der bijzonderheden geschieden.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel150
  - number: '150.4'
    text: |-
      In geval een mededeling als bedoeld in het derde lid niet kan geschieden vóór het overnemen van de arbeid
      door de eerstvolgende groep, moeten de desbetreffende bijzonderheden worden medegedeeld aan de ter plaatse
      verantwoordelijke toezichthoudende persoon, die ervoor zorg draagt, dat zij tijdig ter kennis van de voorman van
      eerderbedoelde groep worden gebracht.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel150
  - number: '150.5'
    text: |-
      Het derde en het vierde lid zijn van overeenkomstige toepassing op personen, die zelfstandig op een werkpunt
      werkzaam zijn.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel150
  - number: '151.1'
    text: Op elke arbeidsplaats en voor elke activiteit moeten veilige werkmethoden worden toegepast.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel151
  - number: '151.2'
    text: |-
      Een ieder is verplicht bij het verrichten van arbeid de zorgvuldigheid te betrachten, die noodzakelijk is, ten
      einde het optreden van gevaar te voorkomen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel151
  - number: '151.3'
    text: |-
      Doelmatige veiligheidsapparatuur moet steeds gebruiksklaar en in goede staat worden gehouden. Bij het onderhoud
      daarvan dient naar behoren rekening te worden gehouden met de uitgeoefende activiteiten.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel151
  - number: 151a.1
    text: |-
      Op alle normaliter bemande arbeidsplaatsen moeten op gezette tijden veiligheidsoefeningen worden gehouden die er op
      gericht zijn:
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel151a
  - number: 151a.1.a
    text: |-
      arbeiders, aan wie in noodgevallen concrete taken worden opgedragen waarbij noodapparatuur moet worden gebruikt,
      gehanteerd of bediend, hierin te trainen en hun bekwaamheid ter zake te controleren.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel151a
  - number: 151a.1.b
    text: |-
      alle bij de oefeningen gebruikte noodapparatuur te controleren, schoon te maken, en zonodig opnieuw op te laden
      of te vervangen en alle gebruikte draagbare apparatuur opnieuw naar de plaats te brengen waar zij zich normaliter
      bevindt.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel151a
  - number: 151a.2
    text: |-
      Op alle normaliter bemande arbeidsplaatsen die zich bevinden op mijnbouwinstallaties moeten tevens op gezette
      tijden veiligheidsoefeningen worden gehouden die erop gericht zijn na te gaan of de reddingsvaartuigen
      gebruiksklaar zijn.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel151a
  - number: 151a.3
    text: |-
      Door Onze Minister aangewezen personen moeten in voldoende mate zijn geoefend in het verrichten van bepaalde, door
      hem aan te geven, werkzaamheden of handelingen ter voorkoming of opheffing van gevaar. Onze Minister kan tevens
      aanwijzingen geven aangaande de registratie van de aangewezen personen en van de door hen gehouden oefeningen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel151a
  - number: '152.1'
    text: |-
      Een arbeider, die werkzaamheden verricht, waarbij kennelijk gevaar bestaat, dat zijn kleren of hoofdhaar door
      enig deel van een drijfwerk of werktuig worden gegrepen, moet de beschikking hebben over doelmatige kleding en
      doelmatige hoofdbedekking.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel152
  - number: '152.2'
    text: |-
      Op een plaats, waar kennelijk gevaar bestaat voor verwonding, moet een ieder de beschikking hebben over doelmatige
      beveiligings- of hulpmiddelen en over zodanige en van zodanige stof vervaardigde kleding en andere middelen, dat
      bij gebruik van het een en ander het gevaar zoveel mogelijk is afgewend.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel152
  - number: '152.3'
    text: |-
      De in de voorgaande leden bedoelde kleding en middelen moeten overeenkomstig hun bestemming worden gedragen en
      gebruikt.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel152
  - number: 152a.1
    text: |-
      Wanneer de veiligheid en de gezondheid van de arbeiders dat vereisen, moet bepaalde apparatuur in geval van nood
      vanaf geschikte locaties op afstand kunnen worden bediend.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel152a
  - number: 152a.2
    text: |-
      De in het eerste lid bedoelde apparatuur moet systemen omvatten voor het isoleren en afblazen van putten,
      installaties en pijpleidingen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel152a
  - number: 152a.3
    text: |-
      Ten behoeve van de afstandsbediening als bedoeld in het eerste lid moeten er controleposten op geschikte locaties
      zijn die in geval van nood kunnen worden gebruikt, indien nodig met inbegrip van controleposten op veilige
      verzamelpunten en in evacuatiestations.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel152a
  - number: 152a.4
    text: |-
      De in het eerste lid bedoelde apparatuur moet ten minste systemen omvatten voor ventilatie, het in noodgevallen
      afsluiten van apparatuur die een ontbranding zou kunnen veroorzaken, het voorkomen van het ontsnappen van
      ontvlambare vloeistoffen en gassen, brandbeveiliging en putbewaking.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel152a
  - number: '153.1'
    text: |-
      Gebouwen en andere opstallen, alsmede vaartuigen en andere drijvende inrichtingen, met alles wat daartoe behoort,
      moeten in zodanige toestand verkeren, dat zij geen gevaar kunnen veroorzaken.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel153
  - number: '153.2'
    text: |-
      Het herstellen, het onderhouden, het wijzigen, het uitbreiden en het slopen van gebouwen of constructie- of
      kunstwerken dienen op veilige wijze te geschieden. Daarbij moeten zo nodig voldoende maatregelen worden genomen
      om het instorten, omvallen of breken van gebouwen of constructie- of kunstwerken, of van de toegepaste stut-
      en hulpconstructies, te voorkomen en om de arbeiders zoveel mogelijk tegen ongevallen als gevolg daarvan te
      beschermen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel153
  - number: '153.3'
    text: |-
      Een steiger of stelling, met alles wat daartoe behoort, moet voldoen aan de eis van goed en veilig werk. Zij moet
      voorts zodanig zijn bevestigd en samengesteld, dat bij normaal gebruik geen der onderdelen zich kan verplaatsen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel153
  - number: '153.4'
    text: |-
      Vloeren, trappen, ladders, klimijzers, bordessen, gaanderijen, steigers, stellingen, afdekkingen van
      vloeropeningen, putdeksels, loopbruggen en glij-, loop- en kruiplanken moeten zijn vervaardigd van deugdelijk
      materiaal en in goede staat van onderhoud verkeren. Zij moeten voldoende breed en voldoende sterk zijn in verband
      met de belasting, waaraan zij zullen worden onderworpen. Zij moeten zodanig zijn gemaakt, dat geen onderdeel in
      sterke mate of ten opzichte van een ander onderdeel ongelijkmatig kan doorbuigen. Voor zover zij gevaar opleveren,
      moeten daartegen doelmatige voorzieningen zijn getroffen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel153
  - number: '153.5'
    text: |-
      Een heistelling, met alles wat daartoe behoort, moet voldoen aan de eis van goed en veilig werk en in goede staat
      van onderhoud verkeren.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel153
  - number: '153.6'
    text: |-
      Het ontwerpen, berekenen en construeren van constructiewerken en van stut- en hulpconstructies moet vakkundig
      en met zorg geschieden en wel zodanig, dat deze constructiewerken, stut- en hulpconstructies voldoen aan de eis
      van goed en veilig werk. Een volledig overzicht moet worden opgesteld van de ongunstigste in de constructies
      berekende krachten en spanningen en van de wijze, waarop de krachten op de ondersteuningen worden overgebracht.
      Laatstgenoemde krachten moeten door de ondersteuningen kunnen worden opgenomen, zonder bezwaar voor het gehele
      bouwwerk.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel153
  - number: '153.7'
    text: |-
      Vloeren van ruimten moeten vrij zijn van hobbels, putten of gevaarlijke hellingen; zij moeten vast, stabiel en
      slipvrij zijn.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel153
  - number: '153.8'
    text: |-
      Transparante of lichtdoorlatende wanden in ruimten of in de omgeving van werkplekken en wegen moeten duidelijk
      zijn gemarkeerd en van veiligheidsmaterialen zijn vervaardigd of op zodanige wijze van die werkplekken en wegen
      zijn afgescheiden dat de arbeiders niet met deze wanden in aanraking kunnen komen en ook niet gewond kunnen raken
      wanneer deze breken.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel153
  - number: '153.9'
    text: |-
      Toegang tot daken die zijn vervaardigd van materialen die niet voldoende weerstand bieden is slechts toegestaan,
      indien uitrusting wordt verstrekt waardoor het betrokken werk veilig kan worden uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel153
  - number: '154.1'
    text: |-
      Voor het verrichten van arbeid, waarbij het gevaar bestaat van een hoogte van 2,50 meter of meer te vallen, of
      gevaar voor bedwelming, verstikking, vergiftiging, verbranding of verdrinking als gevolg van een val, moet een
      doelmatige steiger, stelling of werkvloer dan wel een doelmatig bordes zijn aangebracht, tenzij het arbeid betreft,
      welke op voldoend veilige wijze staande op een ladder kan worden verricht. Indien genoemde voorzieningen niet of
      slechts ten dele kunnen worden getroffen, moet tot afwending van het gevaar gebruik worden gemaakt van doelmatige
      veiligheidsgordels, vangnetten of dergelijke, tenzij het gebruik hiervan uit een oogpunt van veiligheid niet
      dienstig is.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel154
  - number: '154.2'
    text: |-
      Bij werkzaamheden in bunkers, kokers of dergelijke ruimten, waar gevaar bestaat te worden bedolven onder instortend
      materiaal of gevaar voor afstorten, moeten zij, die deze werkzaamheden verrichten, met behulp van doelmatige
      veiligheidsgordels op veilige wijze zijn aangebonden en moet een voldoende aantal personen aanwezig zijn om hen in
      geval van gevaar buiten die ruimten te kunnen brengen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel154
  - number: '154.3'
    text: |-
      Bij het maken van groeven, sleuven, tunnels, gangen, kuilen en putten moeten doelmatige voorzorgsmaatregelen
      worden genomen en doelmatige hulpmiddelen worden gebruikt, welke voldoende waarborgen geven tegen het gevaar voor
      verzakken, afkalven, verschuiven of instorten.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel154
  - number: '154.4'
    text: |-
      Bij het storten of afgraven van grond, mergel, gesteente, veen, kunstmest, delfstoffen, afval en dergelijke
      moeten doelmatige voorzorgsmaatregelen worden genomen en doelmatige hulpmiddelen worden gebruikt, welke voldoende
      waarborgen geven tegen het gevaar van verzakken, afkalven, verschuiven, instorten of afstorten.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel154
  - number: '154.5'
    text: |-
      Het plaatsen, opstapelen en van stapel nemen van voorwerpen of stoffen moet zodanig geschieden, dat onverhoeds
      omvallen of verzakken van de voorwerpen, de stoffen of de stapel zoveel mogelijk wordt voorkomen; zo nodig moeten
      tegen onverhoeds omvallen of verzakken doelmatige voorzorgsmaatregelen worden genomen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel154
  - number: '154.6'
    text: |-
      Tegen het gevaar te worden getroffen door vallende of wegvliegende voorwerpen moeten doelmatige
      voorzorgsmaatregelen worden genomen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel154
  - number: '155.1'
    text: |-
      Het is verboden een ruimte, die geen natuurlijke of kunstmatige ventilatie heeft of die moeilijk toegankelijk
      is, zoals een put, riool, gashouder of reservoir, dan wel een andere min of meer besloten ruimte, te betreden of
      daarin te verblijven, tenzij door of vanwege de bestuurders van de betrokken mijnonderneming daartoe schriftelijk
      toestemming is verleend. Aan deze toestemming worden zodanige voorwaarden verbonden, dat de veiligheid voldoende
      is gewaarborgd. Het geschrift, dat de toestemming bevat, moet berusten bij de ter plaatse verantwoordelijke
      toezichthoudende persoon.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel155
  - number: '155.2'
    text: |-
      Alvorens toestemming als in het eerste lid bedoeld wordt verleend, moet uit een doelmatig onderzoek zijn gebleken,
      dat in de betrokken ruimte, boven de veilig toelaatbare concentratie, geen stof aanwezig is of gevaarlijke of
      schadelijke gassen of dampen voorkomen, dan wel de lucht aldaar uit anderen hoofde voor inademing niet ongeschikt
      is. Doelmatige maatregelen moeten worden genomen, teneinde te voorkomen, dat tijdens het verblijf in de ruimte,
      boven de veilig toelaatbare concentratie, zich stof ontwikkelt of verspreidt of gevaarlijke of schadelijke gassen
      of dampen zich ontwikkelen of verspreiden, dan wel de lucht uit anderen hoofde voor inademing ongeschikt wordt.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel155
  - number: '155.3'
    text: |-
      Wanneer aan het in het tweede lid gestelde vereiste voor het verlenen van toestemming redelijkerwijs niet kan
      worden voldaan en het betreden van een ruimte als in het eerste lid bedoeld, waarin, boven de veilig toelaatbare
      concentratie, stof aanwezig kan zijn of gevaarlijke of schadelijke gassen of dampen kunnen voorkomen, dan wel de
      lucht uit anderen hoofde voor inademing ongeschikt kan zijn, niettemin noodzakelijk is, mag toestemming desondanks
      worden verleend, doch onder de voorwaarde, dat van doelmatige beschermingsmiddelen wordt gebruik gemaakt.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel155
  - number: '155.4'
    text: |-
      Bij verblijf in een ruimte als in het eerste lid bedoeld moeten een voldoende aantal personen en doelmatige
      middelen in de onmiddellijke nabijheid van de ruimte aanwezig zijn om de daarin aanwezige persoon of personen in
      geval van gevaar onverwijld buiten de ruimte te kunnen brengen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel155
  - number: '156'
    text: |-
      Het is verboden diepboringen te verrichten, waardoor de veiligheid in of op een bestaand mijn- of boorwerk kan
      worden bedreigd.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel156
  - number: '157.1'
    text: De terreinen van boorwerken dienen goed zichtbaar te zijn afgescheiden van de omgeving.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel157
  - number: '157.2'
    text: |-
      Aardolie- en aardgasputten, welke door in de produktieve laag of lagen heersende drukken spuitend produceren of
      kunnen produceren, zomede door Onze Minister aan te wijzen andere onderdelen van boorwerken, moeten doelmatig
      worden beveiligd; zij moeten, tenzij Onze Minister ontheffing verleent, doelmatig worden omrasterd, verlicht en
      bewaakt.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel157
  - number: '157.3'
    text: De bij de produktie van aardolie of aardgas gebruikte inrichtingen moeten doelmatig en veilig zijn samengesteld.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel157
  - number: '158.1'
    text: In door Onze Minister te bepalen gevallen mogen diepboringen slechts op veilige afstand van elkaar worden verricht.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel158
  - number: '158.2'
    text: |-
      Diepboringen mogen niet worden verricht en door Onze Minister aan te wijzen onderdelen van boorwerken mogen
      niet worden tot stand gebracht of in stand gehouden binnen een door hem te bepalen afstand van onderdelen van
      boorwerken, waar zich een stookplaats of een andere inrichting voor het maken van open vuur bevindt.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel158
  - number: '158.3'
    text: |-
      Doelmatige maatregelen moeten worden genomen ter verzekering van de veiligheid der bij een diepboring en in de
      nabijheid daarvan aanwezige personen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel158
  - number: '158.4'
    text: |-
      Indien opsporing of winning van aardolie of aardgas doel van een diepboring is of indien enige aanwijzing bestaat,
      dat aardolie of aardgas bij een diepboring kan worden aangetroffen, moeten doelmatige maatregelen worden genomen,
      teneinde de bij de diepboring betrokken personen op de hoogte te brengen van de gevaren, aan de aanwezigheid van
      aardolie en aardgas verbonden.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel158
  - number: '158.5'
    text: |-
      Een nog niet voltooide diepboring, waarbij een aardolie- of aardgashoudende laag is aangeboord en waarop tijdelijk
      niet wordt gewerkt, moet voldoende worden bewaakt.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel158
  - number: '158.6'
    text: Onze Minister kan van het in het vijfde lid bepaalde ontheffing verlenen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel158
  - number: '159'
    text: |-
      Indien een diepboring wordt verricht of door Onze Minister aan te wijzen onderdelen van boorwerken aanwezig zijn
      in dan wel binnen door hem te bepalen afstanden van een oppervlaktewater, waarop scheepvaart plaats vindt, welke
      de veiligheid van het boorwerk in gevaar kan brengen, moeten doelmatige maatregelen worden getroffen ter voorkoming
      van dat gevaar.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel159
  - number: '160'
    text: |-
      De ondergrondse werken en de daarin aanwezige inrichtingen moeten in veilige toestand verkeren. De aldaar
      toegepaste werkwijzen moeten voldoen aan de eis van goed en veilig werk.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel160
  - number: '161'
    text: Er moeten voldoende maatregelen worden genomen tegen als gevolg van de winning optredende gevaren.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel161
  - number: 161a
    text: |-
      Indien in de ondergrondse werken werkzaamheden moeten worden verricht binnen een afstand van 100 meter van verlaten
      ondergrondse werken of van een verlaten gedeelte van ondergrondse werken, moeten doelmatige maatregelen worden
      genomen in het belang van de veiligheid.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel161a
  - number: '162'
    text: |-
      Bij het verrichten van boringen van de ondergrondse werken naar het dekterrein moeten voldoende maatregelen worden
      genomen tegen water- en drijfzanddoorbraken.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel162
  - number: '163.1'
    text: |-
      Wanneer de mogelijkheid te voorzien is, dat tengevolge van het voortdrijven van een werkplaats een verbinding
      wordt tot stand gebracht met een ruimte, die water dan wel gevaarlijke of voor de gezondheid schadelijke gassen
      kan bevatten, of wanneer gevaar voor een waterdoorbraak of voor uitstroming van gevaarlijke of voor de gezondheid
      schadelijke gassen uit anderen hoofde te duchten is, moet worden voorgeboord en moeten doelmatige maatregelen
      worden genomen ter verzekering van de veiligheid en de gezondheid, een en ander onverminderd het in de artikelen
      162, 164 en 194 bepaalde.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel163
  - number: '163.2'
    text: Ten aanzien van een waterreservoir moeten voldoende maatregelen ter voorkoming van doorbraken worden genomen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel163
  - number: '163.3'
    text: |-
      De plaatsen, waar waterdoorbraken of gasuitstromingen hebben plaats gevonden, moeten op de mijnplannen, welke
      daarvoor in aanmerking komen, onderscheidenlijk met het teken (W) of het teken (G) worden aangegeven.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel163
  - number: '164'
    text: |-
      Naderen de werkzaamheden oude werken, storingen of waterhoudende gedeelten, dan moet tijdig worden voorgeboord en
      moeten tijdig voldoende maatregelen worden genomen ter voorkoming van gevaar.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel164
  - number: '165.1'
    text: |-
      Bij werkzaamheden in schachten, in tussenschachten of andere opbraken of in bunkers of kokers, alsmede bij de
      aanleg daarvan, moeten doelmatige werkvloeren of steigers worden aangebracht en doelmatige voorzieningen tegen
      afstorten worden getroffen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel165
  - number: '165.2'
    text: |-
      Zijn de werkzaamheden echter van korte duur, dan kan worden volstaan met het veilig gebruiken van doelmatige
      gordels.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel165
  - number: '165.3'
    text: |-
      Bij werkzaamheden als in het eerste lid bedoeld moeten tevens doelmatige maatregelen worden genomen om de arbeiders
      tegen vallende voorwerpen te beveiligen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel165
  - number: '166.1'
    text: |-
      Hellingen, bunkers en kokers moeten zodanig zijn ingericht en worden onderhouden, dat de veiligheid voldoende is
      gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel166
  - number: '166.2'
    text: Ten aanzien van hun toegangen en openingen moeten doelmatige veiligheidsmaatregelen worden genomen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel166
  - number: 166a
    text: |-
      Voor de toepassing van het bij of krachtens dit hoofdstuk, zomede van het bij of krachtens de artikelen 229 en
      229*a* bepaalde wordt onder het verrichten van werkzaamheden onder water of onder druk verstaan het verrichten van
      werkzaamheden, daaronder begrepen het in verband met het verrichten van werkzaamheden verblijven:
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel166a
  - number: 166a.a
    text: |-
      in een inrichting onder water, welke kunstmatig wordt geventileerd of waarin het voor ademhaling bestemde gasmensel
      wordt geregenereerd, dan wel
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel166a
  - number: 166a.b
    text: onder een druk, die hoger is dan de atmosferische druk.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel166a
  - number: 166b
    text: |-
      Dit hoofdstuk geldt uitsluitend ten aanzien van het verrichten van werkzaamheden onder water of onder druk in
      verband met mijnbouwkundige onderzoekingen of de winning van delfstoffen in oppervlaktewateren.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel166b
  - number: 166c.1
    text: |-
      Het is verboden duikuitrustingen, dan wel caissons of andere inrichtingen voor het verrichten van werkzaamheden
      onder water of onder druk zonder vergunning van Onze Minister te gebruiken.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel166c
  - number: 166c.2
    text: |-
      Uitrustingen en inrichtingen als in het eerste lid bedoeld moeten, met alles wat daartoe behoort, zodanig zijn
      ingericht en worden onderhouden, dat de veiligheid voldoende is gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel166c
  - number: 166c.3
    text: |-
      Tegen de gevaren, welke het gebruik van die uitrustingen en inrichtingen kan opleveren, moeten doelmatige
      voorzorgsmaatregelen worden genomen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel166c
  - number: 166d.1
    text: |-
      Het is verboden werkzaamheden onder water of onder druk te verrichten, tenzij de veiligheid van de daarbij
      betrokken personen in redelijke mate is gewaarborgd en nadelige of schadelijke invloeden voor de gezondheid van die
      personen in redelijke mate worden voorkomen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel166d
  - number: 166d.2
    text: |-
      Onze Minister kan ter bevordering van een goede uitvoering van het eerste lid nadere regelen stellen, welke onder
      meer betrekking hebben op:
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel166d
  - number: 166d.2.a
    text: |-
      de maximale diepte, waarop en de maximale druk, waaronder de werkzaamheden onder water of onder druk mogen worden
      verricht, afhankelijk van de gebruikte uitrustingen of inrichtingen, zomede van de samenstelling van het voor
      ademhaling bestemde gasmengsel en de mogelijkheid tot verversing of regeneratie daarvan;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel166d
  - number: 166d.2.b
    text: |-
      de wijze van compressie en decompressie bij het verrichten van werkzaamheden en het verblijven onder een druk, die
      hoger is dan de atmosferische druk;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel166d
  - number: 166d.2.c
    text: de samenstelling, de zuiverheid en de temperatuur van het voor ademhaling bestemde gasmengsel;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel166d
  - number: 166d.2.d
    text: de meting en controle van het voor ademhaling bestemde gasmengsel en de wijze van verversing daarvan;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel166d
  - number: 166d.2.e
    text: de hoeveelheid van het voor ademhaling bestemde gasmengsel, welke in reserve moet zijn;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel166d
  - number: 166d.2.f
    text: |-
      de aanwezigheid, toestand en plaats van reserve-apparatuur voor verversing, zuivering en regeneratie van het voor
      ademhaling bestemde gasmengsel;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel166d
  - number: 166d.2.g
    text: het gebruik van elektriciteit;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel166d
  - number: 166d.2.h
    text: de verlichting.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel166d
  - number: 166e.1
    text: |-
      Het is verboden werkzaamheden onder water of onder druk langer te verrichten dan gedurende een met het oog op de
      veiligheid en de gezondheid van de bij die werkzaamheden betrokken personen ten hoogste verantwoorde tijdsduur, te
      bepalen door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel166e
  - number: 166e.2
    text: |-
      Tussen twee perioden, waarin werkzaamheden onder een druk, die hoger is dan de atmosferische druk, worden verricht,
      moeten de bij die werkzaamheden betrokken personen tenminste een met het oog op hun gezondheid voldoende tijd
      onder normale atmosferische omstandigheden vertoeven; onmiddellijk na het verrichten van zodanige werkzaamheden
      moeten zij gedurende een door Onze Minister te bepalen tijd op een plaats aanwezig zijn, waar zo nodig doelmatige
      maatregelen kunnen worden genomen ter voorkoming of bestrijding van met het verrichten van werkzaamheden onder druk
      verband houdende ziekteverschijnselen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel166e
  - number: 166f
    text: |-
      Het verrichten van werkzaamheden onder water of onder druk moet onder toezicht van een daartoe door de bestuurders
      van de betrokken mijnonderneming aangewezen deskundig persoon geschieden door personen, die voldoende ervaring en
      deskundigheid bezitten om zodanige werkzaamheden te verrichten.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel166f
  - number: 166g.1
    text: |-
      Een persoon, belast met het verrichten van werkzaamheden onder water of onder druk, mag zodanige werkzaamheden
      uitsluitend verrichten, wanneer uit de uitslag van een geneeskundig onderzoek als in artikel 229 bedoeld blijkt,
      dat het verrichten van die werkzaamheden op medische gronden toelaatbaar is. Indien uit de uitslag van het
      geneeskundig onderzoek blijkt, dat het verrichten van werkzaamheden onder water of onder druk slechts onder de
      daarin aangegeven beperkende voorschriften toelaatbaar is, moeten deze voorschriften in acht worden genomen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel166g
  - number: 166g.2
    text: |-
      Indien uit de uitslag van het geneeskundig onderzoek blijkt, dat een in het eerste lid bedoelde persoon
      werkzaamheden onder water of onder druk niet of slechts onder beperkende voorschriften mag verrichten, wordt deze
      uitslag aan de onderzochte persoon en aan de Inspecteur-Generaal der Mijnen medegedeeld.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel166g
  - number: 166g.3
    text: |-
      De onderzochte persoon kan binnen 14 dagen, nadat hij van de hem gedane mededeling kennis heeft kunnen nemen,
      schriftelijk aan Onze Minister om een nader geneeskundig onderzoek verzoeken. Met dit onderzoek worden belast een
      of meer door Onze Minister aan te wijzen andere artsen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel166g
  - number: 166h
    text: Het is aan een persoon beneden 18 jaar verboden werkzaamheden onder water of onder druk te verrichten.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel166h
  - number: 166i.1
    text: |-
      Alvorens met het verrichten van werkzaamheden onder water of onder druk wordt aangevangen moeten voldoende
      voorzorgsmaatregelen zijn genomen voor het zo nodig verlenen van hulp aan en het zo nodig redden van de bij die
      werkzaamheden betrokken personen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel166i
  - number: 166i.2
    text: |-
      Tijdens het verrichten van werkzaamheden onder water of onder druk moet ter plaatse van die werkzaamheden een
      voldoende aantal voldoend deskundige en ervaren personen aanwezig zijn ter beveiliging van de personen, die
      de werkzaamheden verrichten, zomede voldoende geneeskundig personeel of geneeskundig hulppersoneel, indien dat
      personeel niet voldoende snel bereikbaar is of voldoende snel ter plaatse aanwezig kan zijn.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel166i
  - number: 166i.3
    text: |-
      Voorts moeten tijdens het verrichten van werkzaamheden onder water of onder druk ter plaatse van die werkzaamheden
      voldoende en doelmatig reddingsmateriaal, zomede voldoende en doelmatige middelen voor het verlenen van eerste hulp
      voorradig zijn.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel166i
  - number: 166j.1
    text: |-
      Tijdens het verrichten van werkzaamheden onder water of onder druk moet de plaats, waar die werkzaamheden worden
      verricht, voldoende duidelijk zichtbaar zijn aangegeven.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel166j
  - number: 166j.2
    text: |-
      Indien werkzaamheden onder water of onder druk vanaf een vaartuig worden verricht, moet dit vaartuig zodanig zijn
      verankerd, dat het zich niet kan verplaatsen, dan wel op andere doelmatige wijze ter plaatse worden gehouden.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel166j
  - number: 166k
    text: |-
      Het is verboden bij het verrichten van werkzaamheden onder water of onder druk zonder vergunning van Onze Minister
      elektrisch te lassen of te snijden.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel166k
  - number: 166l
    text: |-
      Een ieder, die met het verrichten van werkzaamheden onder water of onder druk is belast, dan wel direct bij het
      verrichten van die werkzaamheden is betrokken, moet in het bezit zijn van een door Onze Minister goedgekeurde
      schriftelijke instructie, vermeldende hetgeen bij die werkzaamheden behoort te worden nagekomen of nagelaten in het
      belang van de veiligheid en ter voorkoming van lichamelijke schade.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel166l
  - number: 166m.1
    text: |-
      Van werkzaamheden onder water of onder druk moet aantekening worden gehouden in een register, onder vermelding van
      door Onze Minister vastgestelde gegevens.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel166m
  - number: 166m.2
    text: |-
      Personen, die belast zijn met het verrichten van werkzaamheden onder een hogere dan de atmosferische druk, moeten
      in door Onze Minister aangegeven gevallen een door hem vastgesteld bewijs van deelneming aan die werkzaamheden
      gedurende door hem bepaalde tijden bij zich dragen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel166m
  - number: '167.1'
    text: |-
      Het vervoer, het laden, het lossen en het zich ontdoen van ontplofbare stoffen of van andere gevaarlijke stoffen
      in de zin van het Reglement Gevaarlijke Stoffen (*Stb.* 1968, 207) moeten onder toezicht van een daartoe aangewezen
      deskundig persoon op veilige en doelmatige wijze geschieden door personen, die voldoende met de gevaren van die
      stoffen bekend zijn.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel167
  - number: '167.2'
    text: |-
      Het is verboden zich van gevaarlijke stoffen als in het eerste lid bedoeld te ontdoen zonder tijdig voorafgaande,
      doelmatige kennisgeving aan de Inspecteur-Generaal der Mijnen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel167
  - number: '168.1'
    text: |-
      Het is verboden ontplofbare stoffen of ontstekingsmiddelen te gebruiken, die niet door Onze Minister zijn
      goedgekeurd.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel168
  - number: '168.2'
    text: |-
      Het is voorts verboden ontplofbare stoffen of ontstekingsmiddelen te gebruiken op de bovengrondse werken, op een
      boorwerk of bij mijnbouwkundige onderzoekingen van de oppervlakte af, tenzij Onze Minister daartoe vergunning heeft
      verleend.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel168
  - number: '168.3'
    text: Ontplofbare stoffen en ontstekingsmiddelen moeten doelmatig en op veilige wijze worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel168
  - number: '169.1'
    text: |-
      Voldoende maatregelen moeten worden genomen, dat alleen deugdelijke ontplofbare stoffen en ontstekingsmiddelen voor
      gebruik ter beschikking worden gesteld.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel169
  - number: '169.2'
    text: |-
      Onze Minister bepaalt voor elke soort ontplofbare stof en voor elke soort ontsteker de maximale tijdsduur van
      opslag.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel169
  - number: '169.3'
    text: |-
      Ontplofbare stoffen en ontstekers, welke niet meer deugdelijk zijn of waarvoor de krachtens het tweede lid bepaalde
      tijdsduur is verstreken, moeten op veilige wijze worden verwijderd en zo nodig vernietigd.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel169
  - number: '169.4'
    text: |-
      De Inspecteur-Generaal der Mijnen kan op of in een mijnwerk, op een boorwerk of bij een mijnbouwkundig onderzoek
      aanwezige ontplofbare stoffen en ontstekers doen onderzoeken. De hiervoor nodige monsters moeten gratis te zijner
      beschikking worden gesteld.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel169
  - number: '170.1'
    text: |-
      Het is verboden zonder vergunning van Onze Minister in de ondergrondse werken een magazijn voor ontplofbare stoffen
      of ontstekers aan te leggen, in te richten of in gebruik te nemen en in gebruik te houden.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel170
  - number: '170.2'
    text: |-
      Bij de aanvrage om vergunning voor het aanleggen van een magazijn moeten duidelijke tekeningen worden overgelegd,
      waaruit de ligging en de inrichting van het magazijn blijken, alsmede een opgave van de hoeveelheden en soorten
      ontplofbare stoffen of ontstekers, welke in het magazijn zullen worden opgeborgen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel170
  - number: '170.3'
    text: |-
      Het in het tweede lid bepaalde is van overeenkomstige toepassing op aanvragen om vergunning voor het inrichten, in
      gebruik nemen of in gebruik houden van een magazijn.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel170
  - number: '170.4'
    text: |-
      Het is aan andere personen dan hen, die belast zijn met de uitgifte of het vervoer van of het toezicht op
      ontplofbare stoffen en ontstekers, verboden een magazijn als in het eerste lid bedoeld te betreden.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel170
  - number: '171.1'
    text: 'De uitgifte van ontplofbare stoffen en ontstekers mag uitsluitend geschieden:'
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel171
  - number: 171.1.a
    text: door daartoe aangewezen betrouwbare personen of door doelmatige zelfbediening;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel171
  - number: 171.1.b
    text: aan personen, die tot schieten bevoegd zijn.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel171
  - number: '171.2'
    text: De uitgifte moet op veilige en doelmatige wijze plaats hebben.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel171
  - number: '171.3'
    text: Van de uitgifte moet aantekening worden gehouden in een register.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel171
  - number: '172'
    text: |-
      Het medenemen van ontplofbare stoffen en ontstekers uit een magazijn en het overbrengen naar de werkpunten en
      omgekeerd, zomede het bewaren bij de werkpunten, moeten op veilige en doelmatige wijze geschieden.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel172
  - number: '173.1'
    text: Het is aan anderen dan de daartoe aangewezen personen verboden schietwerkzaamheden te verrichten.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel173
  - number: '173.2'
    text: |-
      Aangewezen mogen uitsluitend worden personen, die voldoende betrouwbaarheid en geschiktheid bezitten en die tevens
      met goed gevolg een examen hebben afgelegd, dat in het bijzonder op de door hen te verrichten schietwerkzaamheden
      betrekking had.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel173
  - number: '173.3'
    text: |-
      De Inspecteur-Generaal der Mijnen moet in de gelegenheid worden gesteld een door hem aangewezen ambtenaar van het
      Staatstoezicht op de Mijnen bij het examen tegenwoordig te doen zijn.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel173
  - number: '173.4'
    text: |-
      Aan de Inspecteur-Generaal der Mijnen moet opgave worden gedaan van door Onze Minister bepaalde gegevens over de
      tot het verrichten van schietwerkzaamheden aangewezen personen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel173
  - number: '173.5'
    text: |-
      Op elk mijn- en elk boorwerk, zomede bij elk mijnbouwkundig onderzoek moet tenminste één voldoende geïnstrueerd en
      deskundig persoon met de dagelijkse controle op de schietwerkzaamheden zijn belast.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel173
  - number: '174'
    text: Voor en na het afvuren van ladingen moeten doelmatige veiligheidsmaatregelen worden genomen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel174
  - number: '175.1'
    text: Alle nodige doelmatige maatregelen moeten worden genomen ter voorkoming van brand- en ontploffingsgevaar.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel175
  - number: '175.2'
    text: |-
      Wanneer arbeidsplaatsen worden ontworpen, gebouwd, uitgerust, in bedrijf gesteld, bediend of onderhouden, moeten
      doelmatige maatregelen worden genomen om brand op te sporen en te bestrijden, alsmede om te voorkomen dat brand en
      ontploffing zich verbreiden vanuit de bronnen die in het veiligheids- en gezondheidsdocument worden genoemd.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel175
  - number: '175.3'
    text: |-
      Op mijnbouwinstallaties moeten zonodig brandbarrières worden aangebracht met het oog op de afscheiding van zones
      waar brandrisico bestaat.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel175
  - number: '175.4'
    text: |-
      Er moet een brand- en explosiepreventieplan worden opgesteld met gedetailleerde gegevens over de vereiste
      apparatuur en de vereiste maatregelen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel175
  - number: '175.5'
    text: |-
      Doelmatige maatregelen moeten worden genomen voor het evalueren van de aanwezigheid en het meten van de
      concentratie van potentieel explosieve stoffen in de atmosfeer.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel175
  - number: '175.6'
    text: |-
      Wanneer de veiligheid en de gezondheid van de arbeiders dat vereisen, moet bewakingsapparatuur voor het
      automatisch en continu registreren van de gasconcentraties op bepaalde plaatsen, automatische alarminstallaties
      en voorzieningen voor de automatische afsluiting van de stroomtoevoer naar elektrische installaties en voor het
      automatisch stopzetten van verbrandingsmotoren worden aangebracht.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel175
  - number: '175.7'
    text: Van automatische metingen moeten de meetwaarden worden geregistreerd en bewaard.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel175
  - number: '175.8'
    text: |-
      Op mijnbouwinstallaties moeten branddetectie- en brandbeschermingssystemen, inrichtingen voor brandblussing
      of branddoving en alarmsystemen zijn afgeschermd tegen ongelukken en wel op zodanige wijze dat hun functies in
      noodgevallen operationeel blijven. Zo nodig dienen dergelijke systemen in dubbele uitvoering te zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel175
  - number: '176.1'
    text: |-
      Op mijn- en boorwerken moeten op door of vanwege de bestuurders van de betrokken mijnonderneming, aan te wijzen
      plaatsen aanwezig zijn:
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel176
  - number: 176.1.a
    text: een voldoende aantal doelmatige en voor onmiddellijk gebruik gereed zijnde brandblusmiddelen;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel176
  - number: 176.1.b
    text: een voldoende aantal doelmatige branddetectoren en alarmsystemen;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel176
  - number: 176.1.c
    text: |-
      een of meer doelmatig samengestelde groepen van in het gebruik van brandblusmiddelen als onder *a* bedoeld voldoend
      geoefende personen;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel176
  - number: 176.1.d
    text: een doelmatig register van die personen en de door hen gehouden oefeningen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel176
  - number: '176.2'
    text: |-
      Aan de Inspecteur-Generaal der Mijnen dient jaarlijks een op het volgende kalenderjaar betrekking hebbend
      brandbestrijdingsplan voor alle tot de betrokken mijnonderneming behorende mijn- of boorwerken te worden
      toegezonden; het moet tenminste 14 dagen vóór de aanvang van het betrokken kalenderjaar in zijn bezit zijn.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel176
  - number: '176.3'
    text: |-
      In geval in de loop van enig kalenderjaar met de aanleg van een mijn- of boorwerk wordt begonnen, dient tijdig
      tevoren een op dat jaar en dat werk betrekking hebbend brandbestrijdingsplan aan de Inspecteur-Generaal der Mijnen
      te worden toegezonden.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel176
  - number: '176.4'
    text: |-
      Onze Minister bepaalt, welke gegevens in een brandbestrijdingsplan moeten zijn vermeld. In ieder geval moeten
      gedetailleerde gegevens zijn vermeld over de te nemen maatregelen om het ontstaan en de uitbreiding van branden te
      voorkomen, branden op te sporen en te bestrijden.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel176
  - number: '176.5'
    text: |-
      Onze Minister kan voor een door hem aangewezen mijn- of boorwerk van het in het eerste lid bepaalde ontheffing
      verlenen; hij kan daarbij goedkeuren, dat bepaalde mijnondernemingen voor de uitvoering van het in dat lid bepaalde
      een gemeenschappelijke brandbestrijdingsdienst vormen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel176
  - number: 176a
    text: |-
      Niet-automatische brandbestrijdingsmiddelen moeten gemakkelijk bereikbaar en te bedienen zijn en zo nodig tegen
      beschadiging zijn beveiligd.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel176a
  - number: '177.1'
    text: |-
      Met betrekking tot het opstellen, bewaren en vervoeren van flessen en andere vaten, die gassen in samengeperste,
      tot vloeistof verdichte of onder druk in vloeistof opgeloste toestand bevatten, en de op die flessen en andere
      vaten te gebruiken afsluiters en andere appendages moeten ter voorkoming van gevaar voldoende voorzieningen zijn
      getroffen en doelmatige maatregelen zijn genomen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel177
  - number: '177.2'
    text: Bedoelde flessen en andere vaten moeten van een voldoende aanduiding betreffende hun inhoud zijn voorzien.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel177
  - number: '178'
    text: |-
      Op of nabij een plaats en in of nabij een ruimte, waar ontplofbare of licht ontvlambare stoffen kunnen ontstaan of
      kunnen worden verkregen, behandeld, verwerkt, gebezigd, vervoerd of opgeslagen, moeten doelmatige en in goede staat
      van onderhoud verkerende middelen voor brandblussing of branddoving beschikbaar zijn, die telkens na verloop van
      ten hoogste een jaar op hun bruikbaarheid moeten worden onderzocht.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel178
  - number: '179.1'
    text: Het is verboden met vuur en ontplofbare of licht ontvlambare stoffen op niet veilige wijze om te gaan.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel179
  - number: '179.2'
    text: |-
      Ten aanzien van een plaats of een ruimte, waar stoffen, voor welke verhoogd brandgevaar bestaat, worden verkregen,
      behandeld, verwerkt, gebezigd, vervoerd of opgeslagen, moeten doelmatige maatregelen worden genomen ter voorkoming
      van brand.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel179
  - number: '179.3'
    text: |-
      Ten aanzien van een plaats of een ruimte, waar stoffen, die direct of indirect gevaar voor ontploffing kunnen
      veroorzaken, worden verkregen, behandeld, verwerkt, gebezigd, vervoerd of opgeslagen, en ten aanzien van de naaste
      omgeving daarvan, moeten doelmatige maatregelen worden genomen ter voorkoming van ontploffing. Deze stoffen mogen
      aldaar niet in een grotere hoeveelheid voorhanden worden gehouden dan voor de goede gang van het werk is vereist en
      bij een werkpunt niet in grotere hoeveelheid dan voor het gebruik op één dag nodig is.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel179
  - number: '179.4'
    text: |-
      Uitsluitend bij noodzakelijke werkzaamheden van tijdelijke aard mag op plaatsen of in ruimten als in het tweede
      of het derde lid bedoeld en in de naaste omgeving daarvan open vuur worden gebruikt, doch dan is voor deze
      werkzaamheden in elk afzonderlijk geval een schriftelijke toestemming van de bedrijfsleiding vereist, waarin
      doelmatige veiligheidsmaatregelen moeten zijn aangegeven.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel179
  - number: '179.5'
    text: |-
      Het is verboden op plaatsen of in ruimten als in het tweede of het derde lid bedoeld en in de naaste omgeving
      daarvan te roken.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel179
  - number: '179.6'
    text: |-
      De krachtens artikel 3, met betrekking tot de in het tweede en derde lid bedoelde maatregelen, door Onze Minister
      vastgestelde nadere regelen moeten onder meer betrekking hebben op:
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel179
  - number: 179.6.a
    text: de wijze van verlichting;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel179
  - number: 179.6.b
    text: het aanwezig hebben van gereedschap, apparaten, werktuigen, voertuigen of onderdelen daarvan;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel179
  - number: 179.6.c
    text: |-
      het bij zich hebben van rookmateriaal, rookgereedschap, lucifers, aanstekers of andere middelen om vuur te
      verwekken.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel179
  - number: '179.7'
    text: |-
      Onze Minister kan van het in het tweede, derde en vierde lid bepaalde ontheffing verlenen, alsook met betrekking
      tot het aldaar bepaalde nadere regelen stellen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel179
  - number: '180'
    text: 'Een acetyleenontwikkelaar moet zodanig zijn opgesteld en worden bediend, dat:'
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel180
  - number: 180.a
    text: |-
      noch in de ruimte, waarin deze zich bevindt, noch in andere ruimten acetyleengas zich in die mate kan ophopen, dat
      met de lucht een explosief mengsel kan worden gevormd;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel180
  - number: 180.b
    text: ontsteking van eventueel ontsnapt gas met zekerheid wordt voorkomen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel180
  - number: '181'
    text: |-
      De door Onze Minister daartoe aangewezen onderdelen van bovengrondse werken en boorwerken dienen doelmatig te zijn
      geaard of anderszins tegen blikseminslag te zijn beveiligd.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel181
  - number: '182.1'
    text: |-
      Onverminderd het elders in dit reglement bepaalde, moeten gebouwen en opstallen, die onmiddellijk aan de
      schachtmond grenzen of ten opzichte daarvan zodanig zijn gelegen, dat bij brand in die gebouwen of opstallen
      rook of schadelijke gassen of dampen in de ondergrondse werken zouden kunnen geraken, van onbrandbaar materiaal
      vervaardigd en van een voldoend brandwerende constructie zijn.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel182
  - number: '182.2'
    text: |-
      In gebouwen en opstallen als in het eerste lid bedoeld en op terreinen met een overeenkomstige ligging mogen
      geen stoffen worden bewaard, die licht ontvlambaar of zeer gemakkelijk brandbaar zijn, of die, al dan niet bij
      verhitting, voor de gezondheid schadelijke gassen of dampen afgeven. Dergelijke gebouwen en opstallen mogen zonder
      vergunning van Onze Minister niet door middel van open vuur worden verwarmd.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel182
  - number: '183.1'
    text: |-
      Een schacht moet aan of nabij de mond te allen tijde onmiddellijk voldoende brandwerend en voldoende
      luchtafsluitend kunnen worden gesloten.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel183
  - number: '183.2'
    text: |-
      Wanneer brand uitbreekt of een andere oorzaak optreedt, waardoor rook, schadelijke gassen of schadelijke dampen een
      schacht zouden kunnen bereiken, moeten terstond doelmatige maatregelen worden genomen om de veiligheid van de in de
      ondergrondse werken verblijvende personen zo afdoende mogelijk te verzekeren.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel183
  - number: '183.3'
    text: Onze Minister kan voor schachten in aanleg van het in het eerste lid bepaalde ontheffing verlenen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel183
  - number: '184.1'
    text: |-
      Het is verboden op de bovengrondse werken, binnen een afstand van drie meter van de schacht of in de schachtbok, te
      roken of aldaar open vuur te gebruiken.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel184
  - number: '184.2'
    text: |-
      Onze Minister kan in bijzondere gevallen voor bepaalde plaatsen van het in het eerste lid bepaalde, voor wat
      betreft het gebruik van open vuur, ontheffing verlenen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel184
  - number: '185.1'
    text: Tegen het ontstaan van brand in een stort moeten voldoende voorzorgsmaatregelen worden genomen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel185
  - number: '185.2'
    text: Het is verboden gloeiende as of slakken op of nabij een stort te brengen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel185
  - number: '185.3'
    text: Een brandende stort moet doelmatig worden omheind en van waarschuwingsborden worden voorzien.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel185
  - number: '185.4'
    text: |-
      Van het in brand geraken van een stort moet onverwijld mededeling worden gedaan aan de Inspecteur-Generaal der
      Mijnen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel185
  - number: '186.1'
    text: |-
      De bekleding van schachten en van tussenschachten en andere opbraken, benevens alle daarin aanwezige
      ondersteuningen en inrichtingen, met uitzondering van de geleidingsbomen en keerbalken voor de onderkabel, moeten
      brandvrij zijn.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel186
  - number: '186.2'
    text: 'Onze Minister kan van het in het eerste lid bepaalde ontheffing verlenen:'
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel186
  - number: 186.2.a
    text: ten behoeve van herstelwerkzaamheden in tussenschachten of andere opbraken;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel186
  - number: 186.2.b
    text: voor opbraken, die niet hoger zijn dan 10 meter.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel186
  - number: '186.3'
    text: |-
      Indien zodanige ontheffing is verleend met betrekking tot de bekleding van tussenschachten of andere opbraken,
      moet de steengang onderscheidenlijk de steen- of grondgalerij, waarin de betrokken tussenschacht of andere opbraak
      is gelegen, over een door Onze Minister te bepalen afstand brandvrij worden ondersteund en bekleed of anderszins
      voldoende tegen brand worden beveiligd.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel186
  - number: '186.4'
    text: |-
      In geval de bekleding van een tussenschacht of andere opbraak of daarin aanwezige ondersteuningen of inrichtingen
      bij het in werking treden van dit reglement niet voldoen aan het in het eerste lid bepaalde, is dit tot een door
      Onze Minister te bepalen tijdstip daarop niet van toepassing. In dit geval is het bij of krachtens het derde lid
      bepaalde tot dat tijdstip daarop van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel186
  - number: '187.1'
    text: |-
      De laadplaatsen van schachten, de steengangen, welke naar schachten leiden, en alle andere open ruimten nabij
      schachten moeten over een afstand van 100 meter, gerekend van de schacht af en gemeten langs de as van de betrokken
      ondergrondse werken, brandvrij zijn ondersteund en bekleed.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel187
  - number: '187.2'
    text: Op een voldoende aantal doelmatig gekozen plaatsen moeten brandvrije zones van voldoende lengte zijn ingericht.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel187
  - number: '187.3'
    text: |-
      Voldoende maatregelen moeten worden genomen om het ontstaan en in voorkomend geval het zich uitbreiden van een
      brand te voorkomen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel187
  - number: '188.1'
    text: |-
      Het is verboden opvullingsmateriaal, waarvan gevaar voor brand door broeiïng of zelfontbranding te duchten is, in
      de ondergrondse werken te gebruiken.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel188
  - number: '188.2'
    text: |-
      In tot zelfontbranding geneigde lagen moet het gevaar voor brand door doelmatige inrichting van de ontginning
      zoveel mogelijk worden afgewend en moeten ter opsporing van mogelijk aanwezige broei- of brandhaarden voldoende
      maatregelen worden genomen. Plaatsen, waar zich zelfontbranding of broei heeft voorgedaan, dienen op de daarvoor in
      aanmerking komende mijnplannen met het teken (B) te worden aangeduid.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel188
  - number: '188.3'
    text: Artikel 179, tweede en derde lid, is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel188
  - number: '189'
    text: |-
      Het is verboden in de ondergrondse werken te roken, zomede rookmateriaal, rookgereedschap, lucifers of aanstekers
      mede te nemen of bij zich te hebben.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel189
  - number: '190.1'
    text: Het is verboden open vuur te gebruiken in de ondergrondse werken.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel190
  - number: '190.2'
    text: |-
      Onze Minister kan in bijzondere gevallen voor bepaalde plaatsen van het in het eerste lid bepaalde ontheffing
      verlenen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel190
  - number: '191.1'
    text: |-
      Ondergrondse werken of gedeelten van ondergrondse werken, waarin kolenstof optreedt, dat aanleiding kan geven tot
      een kolenstofontploffing, moeten op doelmatige wijze worden beveiligd.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel191
  - number: '191.2'
    text: Elke luchtafdeling, in de zin van artikel 206, moet afzonderlijk doelmatig worden beveiligd.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel191
  - number: '192'
    text: |-
      Ten aanzien van mijnwerken of gedeelten daarvan, die bijzondere gevaren voor mijngas- of kolenstofontploffingen of
      voor zelfontbranding opleveren, moeten doelmatige maatregelen worden genomen ter afwending van die gevaren en ter
      beperking van de gevolgen daarvan.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel192
  - number: '193.1'
    text: |-
      Zodra een kolenstof- of mijngasontploffing of een mijngasontbranding, hoe gering ook, heeft plaats gevonden, dan
      wel een andere ontbranding, welke met de ter plaatse ter beschikking staande middelen niet terstond kon worden
      gedoofd, moet het werk ter plaatse, voor zover niet bestaande in reddingswerkzaamheden, worden gestaakt en moeten
      de uittrekkende luchtwegen van het betrokken deel van de ondergrondse werken geheel worden ontruimd.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel193
  - number: '193.2'
    text: De Inspecteur-Generaal der Mijnen moet onverwijld van de ontploffing of ontbranding in kennis worden gesteld.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel193
  - number: '194.1'
    text: Doelmatige maatregelen moeten worden genomen om gasuitbarstingen zoveel mogelijk te voorkomen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel194
  - number: '194.2'
    text: |-
      Zodra een gasuitbarsting heeft plaats gevonden, moet het werk ter plaatse, voor zover niet bestaande in
      reddingswerkzaamheden, worden gestaakt en moeten de uittrekkende luchtwegen van het betrokken deel van de
      ondergrondse werken op doelmatige wijze worden gecontroleerd.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel194
  - number: '194.3'
    text: Artikel 193, tweede lid, is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel194
  - number: '195'
    text: |-
      De luchtverversing moet zodanig zijn, dat tenminste 3 m3 verse lucht per man en per minuut aan de ondergrondse
      werken wordt toegevoerd.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel195
  - number: '196.1'
    text: |-
      De hoeveelheid verse lucht, die aan ieder deel van de ondergrondse werken wordt toegevoerd, moet tenminste 2 m3 per
      man en per minuut bedragen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel196
  - number: '196.2'
    text: |-
      Onze Minister kan in bijzondere gevallen voor door hem aangewezen mijnwerken of gedeelten van mijnwerken een hoger
      minimum vaststellen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel196
  - number: '197.1'
    text: |-
      Wanneer de natuurlijke luchtverversing niet voldoende voorziet in de behoefte aan verse lucht als in artikel 195
      omschreven, moet zij worden versterkt door tenminste één doelmatige hoofdventilator met doelmatige en veilige
      energievoorziening.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel197
  - number: '197.2'
    text: |-
      In geval het eerste lid toepassing vindt, moet tevens een doelmatige reserve-hoofdventilator met doelmatige en
      veilige energievoorziening zijn opgesteld.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel197
  - number: '197.3'
    text: |-
      Een hoofdventilator moet zijn voorzien van een drukmeter, alsmede - behoudens indien deze hoofdventilator onder
      voortdurend toezicht staat - van een installatie, welke het stilstaan doet blijken.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel197
  - number: '197.4'
    text: |-
      Ondergronds geplaatste ventilatoren, welke dienen om de doorgaande luchtstroom te versterken, moeten doelmatig
      zijn opgesteld.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel197
  - number: '197.5'
    text: Onze Minister kan van het in het tweede lid bepaalde ontheffing verlenen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel197
  - number: '198.1'
    text: |-
      De hoeveelheid lucht en de snelheid van de luchtstroom moeten zodanig zijn, dat het vrijkomende mijngas zo snel
      mogelijk voldoende wordt verdund en afgevoerd.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel198
  - number: '198.2'
    text: |-
      Het meer dan 10° doen dalen van de luchtstroom is alleen toegestaan met inachtneming van door Onze Minister te
      stellen nadere regelen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel198
  - number: '199'
    text: |-
      Wanneer in een deel van de ondergrondse werken zich plaatselijk mijngas heeft verzameld in een hogere concentratie
      dan het krachtens artikel 200 voor dat deel geldende percentage, moet de ter plaatse verantwoordelijke
      toezichthoudende persoon hiervan terstond in kennis worden gesteld. Deze moet maatregelen nemen om het mijngas op
      veilige wijze afdoende te verwijderen of te isoleren.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel199
  - number: '200.1'
    text: |-
      Wanneer in een deel van de ondergrondse werken de hoedanigheid van de lucht door bijmenging van mijngas zodanig
      wordt beïnvloed, dat het mijngasgehalte in de doorgaande luchtstroom regelmatig hoger is dan 1 ½%, moet alle arbeid
      ter plaatse worden gestaakt en het betrokken deel der ondergrondse werken worden verlaten.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel200
  - number: '200.2'
    text: |-
      In afwijking van het in het eerste lid bepaalde, mogen werkzaamheden tot verbetering van de luchtverversing worden
      voortgezet, mits doelmatige maatregelen ter verzekering van de veiligheid en de gezondheid zijn genomen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel200
  - number: '200.3'
    text: |-
      Van het staken van de arbeid ingevolge het eerste lid moet aan de Inspecteur-Generaal der Mijnen onverwijld worden
      kennis gegeven.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel200
  - number: '200.4'
    text: |-
      De normale werkzaamheden mogen niet worden hervat, voordat de toestand naar het oordeel van de bedrijfsleiding
      afdoende is verbeterd.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel200
  - number: '200.5'
    text: |-
      Onze Minister kan in bijzondere gevallen voor een door hem aangewezen deel van de ondergrondse werken van het in
      het eerste lid bepaalde ontheffing verlenen, echter uitsluitend onder de voorwaarde, dat de arbeid ter plaatse
      wordt gestaakt en het betrokken deel wordt verlaten, in geval het mijngasgehalte in de doorgaande luchtstroom
      regelmatig hoger is dan een bij de desbetreffende beschikking vast te stellen percentage van ten hoogste 2%.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel200
  - number: '201.1'
    text: |-
      Wanneer in verschillende delen van de ondergrondse werken het mijngasgehalte in de doorgaande luchtstroom
      regelmatig hoger is dan het krachtens artikel 200 geldende percentage, moet stelselmatige afzuiging worden
      toegepast, indien daarvan redelijkerwijs verbetering is te verwachten.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel201
  - number: '201.2'
    text: Het afzuigen van het mijngas moet op veilige wijze met behulp van een doelmatige installatie geschieden.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel201
  - number: '201.3'
    text: Het motorisch gedeelte van deze installatie moet bovengronds zijn opgesteld.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel201
  - number: '201.4'
    text: Onze Minister kan van het in het eerste en het derde lid bepaalde ontheffing verlenen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel201
  - number: '202.1'
    text: |-
      Wanneer in een deel van de ondergrondse werken de hoedanigheid van de lucht, anders dan door bijmenging van
      mijngas, zo slecht wordt, dat het leven of de gezondheid van het personeel wordt bedreigd, moet alle arbeid ter
      plaatse worden gestaakt en het betrokken deel van de ondergrondse werken worden verlaten.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel202
  - number: '202.2'
    text: Artikel 200, tweede, derde en vierde lid, is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel202
  - number: '203'
    text: Schadelijke gassen moeten worden afgevoerd met inachtneming van door Onze Minister te stellen nadere regelen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel203
  - number: '204.1'
    text: |-
      Wanneer in een deel van de ondergrondse werken de aanwezigheid van mijngas wordt geconstateerd in een hogere
      concentratie dan het krachtens artikel 200 voor dat deel geldende percentage, dan wel een voor de gezondheid
      schadelijke concentratie van een ander gas of een ontoelaatbaar gebrek aan zuurstof, mag dit deel der werken niet
      meer worden betreden, voordat door de ter plaatse verantwoordelijke toezichthoudende persoon doelmatige maatregelen
      zijn genomen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel204
  - number: '204.2'
    text: Hetzelfde geldt, wanneer omstandigheden als in het eerste lid bedoeld redelijkerwijs moeten worden aangenomen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel204
  - number: '205.1'
    text: |-
      Hoofdluchtwegen en luchtwegen moeten in goede toestand worden gehouden en voortdurend begaanbaar zijn. Hiertoe
      moeten, onverminderd het in artikel 213, eerste lid, bepaalde:
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel205
  - number: 205.1.a
    text: hoofdluchtwegen een doorsnede hebben van tenminste 2 m2;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel205
  - number: 205.1.b
    text: luchtwegen een doorsnede hebben van tenminste 1 m2.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel205
  - number: '205.2'
    text: |-
      Indien voor de doorgaande luchtverversing van een deel van de ondergrondse werken gebruik wordt gemaakt van andere
      luchtverbindingen dan in het eerste lid genoemd, moeten deze doelmatig zijn.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel205
  - number: '206.1'
    text: |-
      Met de winning mag niet worden aangevangen, voordat de betrokken plaats is opgenomen in het systeem van een
      luchtafdeling en ten behoeve van de winning afzonderlijke luchtwegen of andere luchtverbindingen voor de aan- en
      afvoer van de lucht zijn aangelegd.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel206
  - number: '206.2'
    text: |-
      Onder een luchtafdeling wordt verstaan een onderdeel van het hoofdluchtverversingssysteem, waardoor lucht stroomt,
      die van een intrekkende hoofdluchtstroom aftakt en zich weer verenigt met een uittrekkende hoofdluchtstroom.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel206
  - number: '206.3'
    text: Luchtafdelingen moeten gescheiden blijven.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel206
  - number: '206.4'
    text: Onze Minister kan van het in het eerste lid bepaalde ontheffing verlenen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel206
  - number: '207.1'
    text: Het is verboden in een luchtafdeling op meer dan een winningsplaats tegelijk winning te doen plaats vinden.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel207
  - number: '207.2'
    text: |-
      Onze Minister kan bepalen, dat in een luchtafdeling ten hoogste een door hem vastgesteld aantal personen werkzaam
      mag zijn.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel207
  - number: '207.3'
    text: Onze Minister kan van het in het eerste lid bepaalde ontheffing verlenen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel207
  - number: '208.1'
    text: |-
      Zolang in een deel van de ondergrondse werken geen luchtverversing plaats vindt, moet de toegang tot dat deel op
      doelmatige wijze zijn versperd.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel208
  - number: '208.2'
    text: |-
      Indien in een deel van de ondergrondse werken de luchtverversing definitief wordt gestaakt, moeten voldoende
      maatregelen worden genomen, teneinde te voorkomen, dat de luchtverversing in de overige delen van die werken op een
      voor de veiligheid en gezondheid nadelige wijze wordt beïnvloed.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel208
  - number: '209'
    text: |-
      Kortsluiting tussen een intrekkende en een uittrekkende luchtstroom, waardoor een deel van de ondergrondse werken
      van luchtverversing kan worden verstoken, moet door doelmatige afscheiding worden voorkomen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel209
  - number: '210.1'
    text: |-
      Elke wijziging, die in de luchtverversing tot stand wordt gebracht, moet aan alle betrokken verantwoordelijke
      toezichthoudende personen tijdig worden medegedeeld.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel210
  - number: '210.2'
    text: |-
      Het is de arbeiders verboden zonder uitdrukkelijke last van de ter plaatse verantwoordelijke toezichthoudende
      persoon iets te doen, waardoor de luchtverversing in haar geheel of in een deel van de ondergrondse werken
      verandering kan ondergaan.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel210
  - number: '210.3'
    text: |-
      Indien arbeiders onregelmatigheden in de luchtverversing, de aanwezigheid van mijngas of een ander schadelijk
      gas, of een gebrek aan zuurstof constateren, moeten zij daarvan onmiddellijk aan de ter plaatse verantwoordelijke
      toezichthoudende persoon mededeling doen, onder opgaaf van de plaats waar en de tijd waarop de constatering
      geschiedde. Laatstbedoelde persoon moet naar die omstandigheden, zomede naar op andere wijze te zijner kennis
      gekomen gelijke omstandigheden terstond een onderzoek instellen en van een geconstateerde onregelmatigheid in de
      luchtverversing of aanwezigheid van mijngas of een ander schadelijk gas, dan wel van een geconstateerd gebrek aan
      zuurstof onverwijld de bedrijfsleiding in kennis stellen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel210
  - number: '211.1'
    text: |-
      Op alle werkpunten en in alle andere voor personen toegankelijke gedeelten van de ondergrondse werken, die
      niet voldoende door de doorgaande luchtstroom van verse lucht worden voorzien, moet een doelmatige secundaire
      luchtverversing tot stand worden gebracht.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel211
  - number: '211.2'
    text: |-
      Opzettelijke onderbreking van de secundaire luchtverversing mag slechts plaats vinden op last van de ter plaatse
      verantwoordelijke toezichthoudende persoon en onder het nemen van doelmatige maatregelen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel211
  - number: '211.3'
    text: |-
      Niet-opzettelijke onderbreking van de secundaire luchtverversing moet onmiddellijk aan de ter plaatse
      verantwoordelijke toezichthoudende persoon worden gemeld. Deze moet onverwijld doelmatige maatregelen nemen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel211
  - number: '212.1'
    text: |-
      Inrichtingen, welke dienen om secundaire luchtverversing op een plaats tot stand te brengen of de luchtstroom te
      versterken, moeten zodanig zijn geconstrueerd en aangebracht, dat de op die plaats gebruikte en daarvan afgevoerde
      lucht niet nogmaals voor luchtverversing daarheen kan worden gevoerd.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel212
  - number: '212.2'
    text: Onze Minister kan van het in het eerste lid bepaalde ontheffing verlenen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel212
  - number: '213.1'
    text: |-
      De snelheid van de luchtstroom mag in pijlers niet groter zijn dan 6 meter per seconde en in hoofdluchtwegen en
      luchtwegen, die voor het geregeld vervoer of verkeer dienen, niet groter dan 8 meter per seconde.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel213
  - number: '213.2'
    text: Onze Minister kan van het in het eerste lid bepaalde ontheffing verlenen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel213
  - number: '214.1'
    text: In de hoofdluchtwegen en in de deelstromen moet een voldoende aantal doelmatige luchtmeetstations worden aangelegd.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel214
  - number: '214.2'
    text: |-
      Ter bepaling van de samenstelling van de lucht moeten voldoende luchtmonsters worden genomen, die op doelmatige
      wijze moeten worden geanalyseerd. Onze Minister kan bepalen, waar en wanneer deze luchtmonsters moeten worden
      genomen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel214
  - number: '215'
    text: |-
      Indien de beïnvloeding van de hoedanigheid van de lucht door bijmenging van mijngas of een ander gas of de snelheid
      van de luchtstroom daartoe naar het oordeel van Onze Minister aanleiding geeft, dienen doelmatige voorzieningen te
      worden getroffen ten aanzien van het gebruik van elektriciteit en van verbrandingsmotoren.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel215
  - number: '216.1'
    text: |-
      De verantwoordelijke toezichthoudende persoon van elke afdeling moet steeds over een veiligheidslamp met vlam of
      een ander doelmatig meetapparaat kunnen beschikken. Hij moet een onderzoek naar de aanwezigheid van mijngas, andere
      daar te verwachten schadelijke gassen en een mogelijk gebrek aan zuurstof instellen, zo dikwijls hem dit wordt
      opgedragen of hem dit nodig lijkt.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel216
  - number: '216.2'
    text: |-
      Voor elk werkpunt dient voorts nog een persoon te zijn aangewezen, die de nodige geschiktheid bezit tot het
      instellen van een onderzoek als in het eerste lid bedoeld. Het in dat lid bepaalde is te zijnen aanzien van
      overeenkomstige toepassing met dien verstande, dat hij in elk geval een onderzoek moet instellen, zodra hij het
      werkpunt betreedt.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel216
  - number: '216.3'
    text: |-
      Onverminderd het in de artikelen 200, 202 en 210, derde lid, bepaalde, moet de in het tweede lid bedoelde persoon
      een door hem geconstateerde abnormale concentratie van mijngas of ander schadelijk gas of een geconstateerd gebrek
      aan zuurstof ten spoedigste melden aan de ter plaatse verantwoordelijke toezichthoudende persoon, onder opgave
      van plaats en tijd, waarop deze werden geconstateerd. De toezichthoudende persoon moet van zodanige mededeling
      onverwijld kennis geven aan de bedrijfsleiding.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel216
  - number: '217.1'
    text: |-
      Veiligheidslampen met vlam mogen slechts worden gebruikt voor het onderzoek naar gassen. Deze lampen moeten voldoen
      aan door Onze Minister te stellen eisen inzake veiligheid en doelmatigheid.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel217
  - number: '217.2'
    text: Onze Minister stelt nadere regelen inzake het gebruik van deze lampen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel217
  - number: '217.3'
    text: De artikelen 104 en 105 zijn met betrekking tot lampen als in het eerste lid bedoeld mede van toepassing.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel217
  - number: '217.4'
    text: |-
      Onze Minister kan voor lampen als in het eerste lid bedoeld van het bij artikel 104, vijfde lid, eerste en tweede
      volzin, bepaalde ontheffing verlenen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel217
  - number: '218'
    text: |-
      Van de veiligheidslampen met vlam moet een voldoende aantal op doelmatig gekozen plaatsen voor onmiddellijk gebruik
      gereed in reserve worden gehouden.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel218
  - number: '219.1'
    text: |-
      Om de drie maanden moeten alle veiligheidslampen met vlam door een daartoe aangewezen lid van het toezichthoudend
      personeel, niet behorende tot het personeel van de lampisterie, aan een nauwkeurig onderzoek worden onderworpen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel219
  - number: '219.2'
    text: |-
      Van dit onderzoek moet binnen 2 dagen aantekening geschieden in een daarvoor bestemd register, onder afzonderlijke
      vermelding van de lampen, die ondeugdelijk zijn bevonden.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel219
  - number: '220'
    text: |-
      Op elk mijnwerk moeten met de dagelijkse controle op de luchtverversing als hun hoofdtaak zijn belast een of meer
      personen, die in deze controle voldoende geïnstrueerd en deskundig zijn.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel220
  - number: '221'
    text: |-
      Op elk mijnwerk moet bovengronds een zelfregistrerende barometer aanwezig zijn. De verantwoordelijke
      toezichthoudende personen van de ondergrondse werken moeten in de gelegenheid zijn zich van de barometerstand op de
      hoogte te houden.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel221
  - number: '222.1'
    text: |-
      Op elk mijnwerk moeten in door Onze Minister goedgekeurde vorm aanwezig zijn een luchtplan, een luchtregister
      en een luchtstamboom of een staat van luchtafdelingen. Bij het luchtplan moeten aanwezig zijn plannen, waarop de
      plaatsen, waar zich luchtmeetstations, transformatorkamers of telefoontoestellen bevinden, zijn aangegeven en die
      voorts de gegevens bevatten, welke Onze Minister verder nodig acht.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel222
  - number: '222.2'
    text: |-
      Het luchtplan moet een voldoend duidelijke verzameling zijn van de afzonderlijke horizontale projecties der
      verschillende lagen en verdiepingen, waarop de gehele loop van de lucht door de ondergrondse werken is aangegeven.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel222
  - number: '222.3'
    text: |-
      Het luchtregister moet de nodige gegevens bevatten, waaruit kan blijken of aan de voorschriften, vervat in de
      artikelen 195, 196, 214 en 254, eerste en tweede lid, is voldaan, benevens de stroken der in artikel 221 bedoelde
      zelfregistrerende barometers; het moet tevens de tijd, de plaats van de monsterneming en de uitkomsten van de
      gemaakte luchtanalyses vermelden.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel222
  - number: '222.4'
    text: |-
      Ten spoedigste moeten bovendien in het luchtregister worden aangetekend de onregelmatigheden in de luchtverversing,
      de aanwezigheid van en het geconstateerde percentage mijngas, de aanwezigheid van andere schadelijke gassen of een
      gebrek aan zuurstof, bedoeld in de artikelen 193, eerste lid, 194, tweede lid, 199, 200, eerste lid, 202, eerste
      lid, 204, 210, derde lid, en 216, derde lid, onder vermelding van voldoende nadere gegevens.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel222
  - number: '222.5'
    text: |-
      De luchtstamboom en de staat van luchtafdelingen moeten in overzichtelijke vorm de door Onze Minister aangewezen
      gegevens bevatten.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel222
  - number: '222.6'
    text: |-
      Aan de Inspecteur-Generaal der Mijnen moet een exemplaar van het luchtplan, alsmede van de luchtstamboom of van de
      staat van luchtafdelingen worden verstrekt. Zo dikwijls hij dit wenst, moeten deze exemplaren worden bijgewerkt.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel222
  - number: '223.1'
    text: |-
      De bestuurders van een mijnonderneming moeten daaraan een bedrijfsgeneeskundige dienst verbinden, tenzij een
      zodanige dienst reeds daaraan verbonden is, en in beide gevallen die dienst daaraan verbonden houden.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel223
  - number: '223.2'
    text: 'Aan het in het eerste lid bepaalde kan mede worden voldaan:'
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel223
  - number: 223.2.a
    text: |-
      door het oprichten en instandhouden van een bedrijfsgeneeskundige dienst tezamen met een of meer andere
      mijnondernemingen,
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel223
  - number: 223.2.b
    text: |-
      door aansluiting en aangesloten blijven bij een bestaande bedrijfsgeneeskundige dienst, verbonden aan een of meer
      andere mijnondernemingen,
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel223
  - number: 223.2.c
    text: |-
      door het oprichten en instandhouden, met toestemming van Onze Minister, van een bedrijfsgeneeskundige dienst
      tezamen met een of meer andere ondernemingen dan mijnondernemingen,
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel223
  - number: 223.2.d
    text: |-
      door aansluiting en aangesloten blijven, met toestemming van Onze Minister, bij een bestaande bedrijfsgeneeskundige
      dienst, verbonden aan een of meer andere ondernemingen dan mijnondernemingen,
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel223
  - number: '223.3'
    text: |-
      Een bedrijfsgeneeskundige dienst als in het tweede lid bedoeld wordt geacht aan de betrokken mijnondernemingen
      verbonden te zijn.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel223
  - number: '223.4'
    text: Onze Minister kan van het in het eerste lid bepaalde ontheffing verlenen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel223
  - number: '223.5'
    text: |-
      Het beheer van een bedrijfsgeneeskundige dienst kan worden opgedragen aan een rechtspersoon, mits deze niet beoogt
      winst te maken en geen ander doel heeft dan de bevordering van de preventieve gezondheidszorg en het verrichten
      van werkzaamheden als in artikel 227, tweede lid, bedoeld, en mits in het bestuur van deze rechtspersoon een
      of meer vertegenwoordigers zitting hebben van de werknemers, die werkzaam zijn in de mijnonderneming of de
      mijnondernemingen, waaraan de bedrijfsgeneeskundige dienst is of wordt verbonden.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel223
  - number: '223.6'
    text: |-
      Onze Minister kan regelen stellen met betrekking tot de eisen waaraan een bedrijfsgeneeskundige dienst moet
      voldoen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel223
  - number: '223.7'
    text: |-
      Onze Minister kan regelen stellen met betrekking tot het bijhouden en verstrekken van statistische gegevens,
      alsmede omtrent het uitbrengen van verslagen van bedrijfsgeneeskundige diensten.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel223
  - number: '224.1'
    text: |-
      Een bedrijfsgeneeskundige dienst als in artikel 223, eerste lid, of tweede lid, onder *a*, bedoeld behoeft
      erkenning door Onze Minister; de erkenning wordt uitsluitend verleend op een daartoe strekkende aanvraag.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel224
  - number: '224.2'
    text: |-
      De erkenning kan worden verleend met een beperking ten aanzien van haar geldingsduur dan wel worden geweigerd,
      indien:
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel224
  - number: 224.2.a
    text: |-
      gegronde vrees bestaat, dat de bedrijfsgeneeskundige dienst een of meer der in artikel 226, onder *a*, *b*, *d-i*,
      *k* en *l*, bedoelde taken niet of niet doeltreffend zal vervullen;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel224
  - number: 224.2.b
    text: de bedrijfsgeneeskundige dienst andere taken vervult dan in de artikelen 226 en 227, tweede lid, bedoeld;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel224
  - number: 224.2.c
    text: de bedrijfsgeneeskundige dienst niet voldoet aan het bij de artikelen 223, 225 en 227 bepaalde.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel224
  - number: '224.3'
    text: |-
      Ingeval van een omstandigheid als in het tweede lid bedoeld kan Onze Minister een verleende erkenning ten aanzien
      van haar verdere geldingsduur beperken dan wel intrekken.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel224
  - number: '225.1'
    text: |-
      De aan een bedrijfsgeneeskundige dienst verbonden bedrijfsartsen en assistent-bedrijfsartsen zijn verplicht tot
      geheimhouding tegenover hun werkgevers en tegenover de betrokken bestuurders van alle gegevens omtrent personen en
      omstandigheden, welke zij op grond van hun geheimhoudingsplicht niet aan derden mogen bekend maken.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel225
  - number: '225.2'
    text: |-
      De verplichting tot geheimhouding van de in het eerste lid bedoelde gegevens rust mede op het geneeskundige en
      administratieve personeel van bedrijfsgeneeskundige diensten.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel225
  - number: '226'
    text: |-
      De bedrijfsgeneeskundige dienst bevordert, in verband met de arbeid en het arbeidsmilieu in de mijnonderneming of
      de mijnondernemingen, waaraan hij is verbonden, de maatregelen, welke een doeltreffende preventieve gezondheidszorg
      in die onderneming of ondernemingen verzekeren. Dienovereenkomstig omvat zijn taak:
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel226
  - number: 226.a
    text: het verrichten van geneeskundig onderzoek bij het indiensttreden van de arbeider;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel226
  - number: 226.b
    text: |-
      het verrichten van een geneeskundig onderzoek als in artikel 229 bedoeld, zomede van een geneeskundige controle
      krachtens een andere regeling als in het zesde lid van dat artikel bedoeld;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel226
  - number: 226.c
    text: het verrichten van geneeskundig onderzoek van arbeiders, anders dan onder *a* en *b* bedoeld;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel226
  - number: 226.d
    text: het doen van aanbevelingen tot het voorkomen van beroepsziekten;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel226
  - number: 226.e
    text: het medewerken aan het bestrijden van ongevallen;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel226
  - number: 226.f
    text: het medewerken aan revalidatie in het bedrijf;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel226
  - number: 226.g
    text: |-
      het medewerken aan het weren en bestrijden van schadelijke invloeden, waaraan de arbeider in verband met zijn
      arbeid kan zijn blootgesteld, zoals van schadelijke gassen, dampen, nevels, stralingen, schadelijke stof,
      schadelijk of hinderlijk geluid dan wel andere schadelijke of hinderlijke trillingen;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel226
  - number: 226.h
    text: |-
      het houden van toezicht aangaande de omstandigheden, waaronder de arbeid wordt verricht, zoals temperatuur,
      vochtigheid, luchtbeweging, verlichting, lawaai, zindelijkheid en het optreden van stof;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel226
  - number: 226.i
    text: |-
      het houden van toezicht aangaande schadelijke invloeden, welke de arbeider kan ondervinden door de aard van zijn
      arbeid, zijn werktijden, zijn arbeidsmilieu of het arbeidstempo, zoals invloeden tengevolge van ploegenarbeid,
      stukwerk, of het automatiseren van het produktieproces;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel226
  - number: 226.j
    text: het medewerken aan het bevorderen van goede arbeidsverhoudingen in de mijnonderneming;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel226
  - number: 226.k
    text: het houden van een bedrijfsgeneeskundig spreekuur;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel226
  - number: 226.l
    text: |-
      het verlenen van eerste hulp bij ongevallen of ziekte, het doen van aanbevelingen tot het organiseren van de
      eerste-hulpdienst en tot het plaatsen van het aan deze dienst verbonden personeel, alsmede het opleiden en het
      instrueren van dit personeel;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel226
  - number: 226.m
    text: het medewerken aan het verrichten van arbeidsanalyse;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel226
  - number: 226.n
    text: het medewerken aan het bestrijden van ziekteverzuim;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel226
  - number: 226.o
    text: het optreden als medisch adviseur van sociale fondsen en instellingen;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel226
  - number: 226.p
    text: |-
      het doen van andere aanbevelingen en het verrichten van andere werkzaamheden, die aan het in dit artikel gestelde
      doel dienstbaar kunnen zijn.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel226
  - number: '227.1'
    text: |-
      Een bedrijfsgeneeskundige dienst geeft bij het uitoefenen van de in artikel 226 omschreven taak geen adviezen
      en past geen behandelingen toe, welke treden in de verhouding van de patiënt tot zijn huisarts; hij onthoudt
      zich na het constateren van een ziekte of afwijking van verrichtingen, welke behoren tot het terrein, waarop
      consultatiebureaus en soortgelijke instellingen van gezondheidszorg plegen werkzaam te zijn.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel227
  - number: '227.2'
    text: 'Het in het eerste lid bepaalde geldt niet:'
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel227
  - number: 227.2.a
    text: |-
      voor zover een huisarts, een consultatiebureau of een instelling als in dat lid bedoeld een verzoek deed tot het
      behandelen van de patiënt en deze daartegen geen bezwaar heeft;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel227
  - number: 227.2.b
    text: |-
      indien en zolang een patiënt door weersomstandigheden of anderszins niet van een mijnbouwinstallatie naar de vaste
      wal kan worden vervoerd;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel227
  - number: 227.2.c
    text: |-
      indien een bedrijfsgeneeskundige dienst aan een persoon, die werkzaam is in een mijnonderneming, waaraan die
      dienst is verbonden, eerste hulp bij een ongeval of een beroepsziekte heeft verleend, ten aanzien van de verdere
      genees- of heelkundige behandeling met betrekking tot dat ongeval of die ziekte, in gevallen, waarin de patiënt met
      zodanige behandeling instemt en hij ten gevolge van het ongeval of de ziekte:
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel227
  - number: 227.2.c.1°
    text: zijn arbeid niet heeft onderbroken, of
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel227
  - number: 227.2.c.2°
    text: |-
      zijn arbeid heeft onderbroken, doch ambulant blijft en de behandeling van het letsel of de ziekte naar verwachting
      van de bedrijfsgeneeskundige dienst een door Onze Minister te bepalen termijn van ten hoogste vijf weken, welke
      termijn naar gelang van de aard van het uitgeoefende bedrijf kan verschillen, niet zal overschrijden;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel227
  - number: 227.2.d
    text: |-
      indien in gevallen als bedoeld onder *c*, 2°, na de daarbedoelde termijn nog behoefte aan behandeling blijkt te
      bestaan en de patiënt en diens huisarts met voortzetting van de behandeling door de bedrijfsgeneeskundige dienst
      instemmen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel227
  - number: '227.3'
    text: |-
      Een bedrijfsgeneeskundige dienst mag verdere genees- of heelkundige behandeling als in het tweede lid, onder
      *c*, bedoeld slechts verstrekken, indien daartoe op een desbetreffende aanvraag door Onze Minister toestemming is
      verleend. Zodanige toestemming wordt verleend, indien aan de bedrijfsgeneeskundige dienst een zodanig aantal ter
      zake bekwame artsen en geneeskundige hulpkrachten is verbonden en hij kan beschikken over een zodanige huisvesting
      en outillage, dat bedoelde behandeling op verantwoorde wijze kan geschieden.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel227
  - number: '227.4'
    text: 'Een toestemming als in het derde lid bedoeld wordt niet verleend dan onder de voorwaarden:'
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel227
  - number: 227.4.a
    text: |-
      dat de bedrijfsgeneeskundige dienst in gevallen als bedoeld in het tweede lid onder *c*, 2°, zodra met de verdere
      genees- of heelkundige behandeling van een persoon is begonnen, de huisarts van de betrokken persoon daarvan in
      kennis moet stellen, onder opgave van de aard van het letsel of de beroepsziekte van die persoon;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel227
  - number: 227.4.b
    text: |-
      dat de bedrijfsgeneeskundige dienst dag en nacht beschikbaar moet zijn voor het met gebruikmaking van die
      toestemming verstrekken van genees- en heelkundige behandeling;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel227
  - number: 227.4.c
    text: |-
      dat in lokalen voor de voorlopige verzorging van gewonden en zieken, in schaftlokalen en op plaatsen, waar het
      loon pleegt te worden uitbetaald, een duidelijk leesbare kennisgeving op een voor een ieder waarneembare plaats
      moet zijn opgehangen, vermeldende dat een persoon, die door een bedrijfsongeval of een beroepsziekte is getroffen,
      te allen tijde bevoegd is om zich na de verlening van eerste hulp verder te doen behandelen door een door hemzelf
      gekozen, niet aan de bedrijfsgeneeskundige dienst verbonden, arts.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel227
  - number: '227.5'
    text: |-
      Een toestemming als in het derde lid bedoeld kan door Onze Minister worden ingetrokken, indien de betrokken
      bedrijfsgeneeskundige dienst de in het tweede lid, onder *c*, bedoelde behandeling niet meer op doeltreffende wijze
      verstrekt of kan verstrekken, dan wel indien een voorwaarde als in het vierde lid bedoeld niet wordt nagekomen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel227
  - number: '228.1'
    text: |-
      De gezondheid van arbeiders beneden 18 jaar dient minimaal eens per jaar geneeskundig te worden onderzocht,
      indien uit de beoordeling van risico's, bedoeld in artikel 14*ba*, eerste lid, is gebleken dat hun veiligheid, hun
      lichamelijke of geestelijke gezondheid of hun ontwikkeling gevaar loopt.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel228
  - number: '228.2'
    text: |-
      Het geneeskundig onderzoek dient te worden verricht door de aan de betrokken mijnonderneming verbonden
      bedrijfsgeneeskundige dienst, dan wel, indien artikel 223, vierde lid, toepassing heeft gevonden, door een of meer
      artsen, die terzake deskundig zijn.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel228
  - number: '229.1'
    text: 'Personen, die worden belast met het verrichten van:'
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel229
  - number: 229.1.a
    text: werkzaamheden van andere dan incidentele aard in de ondergrondse werken, of
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel229
  - number: 229.1.b
    text: |-
      werkzaamheden op een mijnbouwinstallatie, waarbij zij tezamen met een of meer anderen langer dan 72 uur
      ononderbroken op zodanige installatie zullen doorbrengen,
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel229
  - number: '229.2'
    text: 'Personen, die worden belast met het verrichten van:'
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel229
  - number: 229.2.a
    text: |-
      werkzaamheden onder water of onder druk, verband houdend met mijnbouwkundige onderzoekingen of de winning van
      delfstoffen in oppervlaktewateren, of
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel229
  - number: 229.2.b
    text: |-
      andere, door Onze Minister, op grond van de bijzondere gevaren voor de gezondheid van de daarmede belaste personen,
      aangewezen werkzaamheden,
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel229
  - number: '229.3'
    text: |-
      Voor een persoon van 21 jaar of ouder, die wordt belast met het verrichten van werkzaamheden als in het eerste lid,
      onder *a*, bedoeld, en voor een persoon, die wordt belast met het verrichten van werkzaamheden als in het eerste
      lid, onder *b*, of het tweede lid, onder *b*, bedoeld, ten aanzien van wie door bijzondere omstandigheden een
      voorafgaand geneeskundig onderzoek als in die leden bedoeld, in verband met de geregelde gang van de bedrijfsarbeid
      bezwaarlijk of onmogelijk is, kan het onderzoek plaats hebben, nadat hij met de desbetreffende werkzaamheden
      is belast, mits redelijkerwijs kan worden aangenomen: ten aanzien van een persoon, die wordt belast met het
      verrichten van werkzaamheden als in het eerste lid, onder *a*, bedoeld, dat zijn geestelijke of lichamelijke
      gesteldheid geen gevaar voor de gezondheid of de veiligheid van anderen kan opleveren en dat de te verrichten
      werkzaamheden geen nadelige gevolgen voor zijn gezondheid zullen opleveren; ten aanzien van een persoon, die wordt
      belast met het verrichten van werkzaamheden als in het eerste lid, onder *b*, bedoeld, dat zijn geestelijke of
      lichamelijke gesteldheid geen gevaar voor de gezondheid of de veiligheid van anderen kan opleveren; ten aanzien
      van een persoon, die wordt belast met het verrichten van werkzaamheden als in het tweede lid, onder *b*, bedoeld,
      dat de te verrichten werkzaamheden geen nadelige gevolgen voor zijn gezondheid zullen opleveren. In een geval
      als vorenbedoeld moet het onderzoek zo spoedig als zulks mogelijk is plaats vinden. Het onderzoek kan achterwege
      blijven, indien het niet heeft kunnen plaats vinden gedurende de tijd, dat de betrokken persoon met het verrichten
      van de werkzaamheden was belast.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel229
  - number: '229.4'
    text: |-
      Het in het eerste en tweede lid bedoelde geneeskundige onderzoek moet periodiek worden herhaald en wel ten aanzien
      van personen, belast met het verrichten van: werkzaamheden als in het eerste lid, onder *a*, bedoeld: voor wat
      betreft personen beneden 21 jaar, telkens binnen ten hoogste één jaar en, voor wat betreft personen van 21 jaar
      of ouder, telkens binnen ten hoogste twee jaren; werkzaamheden als in het eerste lid, onder *b*, bedoeld: telkens
      binnen ten hoogste twee jaren; werkzaamheden als in het tweede lid, onder *a*, bedoeld: telkens binnen ten hoogste
      één jaar, onverminderd het in het zevende onderscheidenlijk achtste lid bepaalde; werkzaamheden als in het tweede
      lid, onder *b*, bedoeld: telkens binnen een door Onze Minister te bepalen termijn.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel229
  - number: '229.5'
    text: |-
      Onze Minister kan in bijzondere gevallen bepalen, dat personen, belast met het verrichten van werkzaamheden als
      in het eerste lid bedoeld, tussentijds moeten worden onderworpen aan een geneeskundig onderzoek, gericht op de
      gevaren, welke hun geestelijke of lichamelijke gesteldheid voor de gezondheid of de veiligheid van anderen kan
      opleveren.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel229
  - number: '229.6'
    text: |-
      Onze Minister kan in afwijking van het in het eerste en vierde lid bepaalde, op verzoek van de bestuurders van de
      betrokken mijnonderneming in overeenstemming met de betrokken vakorganisaties, ten aanzien van de geneeskundige
      controle van personen van 18, 19 of 20 jaar, die worden of zijn belast met het verrichten van werkzaamheden als in
      het eerste lid, onder *a*, bedoeld, een andere tenminste gelijkwaardige regeling vaststellen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel229
  - number: '229.7'
    text: |-
      Onze Minister kan voorschrijven, dat het periodieke geneeskundige onderzoek van personen, belast met het verrichten
      van werkzaamheden als in het tweede lid, onder *a*, bedoeld, afhankelijk van de frequentie waarmede, de diepte
      waarop of de druk waaronder die werkzaamheden moeten worden verricht, telkens binnen een kortere, door hem te
      bepalen, termijn moet plaats vinden.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel229
  - number: 229a.1
    text: |-
      Een geneeskundig onderzoek als in artikel 229 bedoeld of een geneeskundige controle krachtens een andere
      regeling als in artikel 229, zesde lid, bedoeld wordt verricht door de aan de betrokken mijnonderneming verbonden
      bedrijfsgeneeskundige dienst, dan wel, indien artikel 223, vierde lid, toepassing heeft gevonden, door een of meer
      artsen, die terzake deskundig zijn. Indien aan een mijnonderneming een bedrijfsgeneeskundige dienst is verbonden,
      kan een geneeskundig onderzoek als in artikel 229 bedoeld in door Onze Minister aangewezen gevallen tevens worden
      verricht door een of meer niet aan die dienst verbonden artsen, die terzake deskundig zijn.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel229a
  - number: 229a.2
    text: |-
      Onze Minister kan, met afwijking van het in het eerste lid bepaalde, artsen aanwijzen voor het verrichten van het
      geneeskundige onderzoek of de geneeskundige controle als in dat lid bedoeld.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel229a
  - number: 229a.3
    text: |-
      Het in artikel 229, eerste lid, bedoelde geneeskundige onderzoek en, indien medisch noodzakelijk, het in artikel
      229, vierde of vijfde lid, bedoelde geneeskundige onderzoek van personen, die zijn belast met het verrichten van
      werkzaamheden als in het eerste lid van dat artikel bedoeld, moeten onder meer een radiografisch onderzoek van de
      longen omvatten.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel229a
  - number: 229a.4
    text: |-
      Met betrekking tot het geneeskundige onderzoek van personen, die worden of zijn belast met het verrichten van
      werkzaamheden als in artikel 229, tweede lid, onder *a*, bedoeld, stelt Onze Minister eisen betreffende:
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel229a
  - number: 229a.4.a
    text: de gegevens, welke bij het onderzoek moeten worden overgelegd;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel229a
  - number: 229a.4.b
    text: de wijze, waarop het onderzoek moet worden uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel229a
  - number: 229a.4.c
    text: |-
      de wijze van beoordeling van de geschiktheid of ongeschiktheid van personen voor het verrichten van werkzaamheden
      onder water of onder druk;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel229a
  - number: 229a.4.d
    text: |-
      de wijze van registratie, verwerking en bewaring, alsmede de tijdsduur van bewaring van de uit het onderzoek
      verkregen gegevens.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel229a
  - number: '230.1'
    text: |-
      Onze Minister kan een onderzoek doen instellen naar de gezondheidstoestand van alle personen, tewerkgesteld op
      of in een mijnwerk, op een boorwerk of bij mijnbouwkundige onderzoekingen, of van door hem aangewezen groepen van
      die personen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel230
  - number: '230.2'
    text: |-
      De bestuurders van de betrokken ondernemingen en de personen, tot wie een onderzoek krachtens het eerste lid zich
      uitstrekt, zijn verplicht aan dat onderzoek hun medewerking te verlenen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel230
  - number: '231.1'
    text: |-
      Onze Minister kan voorschrijven, dat de bestuurders van een onderneming de personen in dienst van deze onderneming,
      die zijn tewerkgesteld op of in een mijnwerk, op een boorwerk of bij mijnbouwkundige onderzoekingen, moeten doen
      voorlichten omtrent de gevaren van bepaalde ziekten.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel231
  - number: '231.2'
    text: |-
      De bestuurders van de betrokken ondernemingen zijn verplicht naar vermogen en op doelmatige wijze ervoor zorg te
      dragen, dat de middelen om vorenbedoelde ziekten te voorkomen en te bestrijden worden toegepast.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel231
  - number: '231.3'
    text: |-
      De in het eerste lid bedoelde personen zijn verplicht de middelen om de in dat lid bedoelde ziekten te bestrijden
      op doelmatige wijze toe te passen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel231
  - number: '232.1'
    text: Op de bovengrondse werken moet op een voldoende aantal doelmatig gekozen plaatsen goed drinkwater aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel232
  - number: '232.2'
    text: |-
      In de ondergrondse werken moet, waar zulks naar het oordeel van Onze Minister in verband met klimatologische
      omstandigheden nodig is, op een voldoende aantal doelmatig gekozen plaatsen goed drinkwater aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel232
  - number: '232.3'
    text: |-
      Onze Minister kan voorschrijven, dat op een boorwerk op een voldoende aantal doelmatig gekozen plaatsen goed
      drinkwater aanwezig moet zijn.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel232
  - number: 232a.1
    text: |-
      Op een bemande mijnbouwinstallatie moet op een voldoende aantal doelmatig gekozen plaatsen goed drinkwater aanwezig
      zijn.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel232a
  - number: 232a.2
    text: |-
      Indien personen aanwezig zijn op een mijnbouwinstallatie, niet zijnde een bemande mijnbouwinstallatie, moeten zij
      over goed drinkwater kunnen beschikken.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel232a
  - number: 232a.3
    text: |-
      De aanvoer, de bereiding, de bewaring en de distributie van drinkwater op een mijnbouwinstallatie moeten op
      doelmatige wijze geschieden.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel232a
  - number: 232a.4
    text: |-
      Op een bemande mijnbouwinstallatie moet een doelmatig register worden bijgehouden waarin gegevens betreffende de
      kwaliteit van het drinkwater alsmede betreffende handelingen en gebeurtenissen, die van invloed zijn of kunnen zijn
      op de kwaliteit van het drinkwater, worden vastgelegd.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel232a
  - number: 232a.5
    text: De kwaliteit van drinkwater moet regelmatig worden onderzocht.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel232a
  - number: 232a.6
    text: Onze Minister kan nadere regelen stellen ter uitvoering van het in de voorgaande leden bepaalde.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel232a
  - number: '233.1'
    text: |-
      Op de bovengrondse werken moet op een voldoende aantal doelmatig gekozen plaatsen een voldoende aantal doelmatige
      privaten en urinoirs beschikbaar zijn.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel233
  - number: '233.2'
    text: |-
      In de ondergrondse werken moet op een voldoende aantal doelmatig gekozen plaatsen een voldoende aantal doelmatige
      privaten beschikbaar zijn.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel233
  - number: '233.3'
    text: |-
      Onze Minister kan voorschrijven, dat op een boorwerk op een voldoende aantal doelmatig gekozen plaatsen een
      voldoende aantal doelmatige privaten en urinoirs beschikbaar moet zijn.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel233
  - number: '233.4'
    text: |-
      De privaten en urinoirs moeten zodanig zijn geplaatst, ingericht en worden onderhouden, dat stank zoveel mogelijk
      wordt vermeden; zij dienen regelmatig te worden gereinigd en zo nodig op doelmatige wijze te worden ontsmet.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel233
  - number: '233.5'
    text: |-
      Een privaat mag slechts voor één der beide seksen toegankelijk zijn en moet zo nodig zijn voorzien van een
      duidelijk waarneembare vermelding, voor welke sekse het toegankelijk is.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel233
  - number: '233.6'
    text: Het is verboden andere plaatsen dan privaten als zodanig te gebruiken.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel233
  - number: '234.1'
    text: |-
      Het bewerken van voorwerpen, waarbij zand of een andere stof, welke kwarts of een andere vorm van kristallijn
      silicium-dioxyde bevat, die voorwerpen met grote snelheid treft, is verboden.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel234
  - number: '234.2'
    text: |-
      Het in het eerste lid bepaalde geldt niet ten aanzien van bewerkingen, waardoor een laag materiaal op voorwerpen
      wordt aangebracht, alsmede niet ten aanzien van het bewerken van bougies, voor zover dit geschiedt in toestellen,
      welke zodanig zijn ingericht, dat zich van daaruit geen stof kan verspreiden.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel234
  - number: '234.3'
    text: Onze Minister kan van het in het eerste lid bepaalde ontheffing verlenen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel234
  - number: 234a.1
    text: |-
      In dit artikel wordt onder "asbest", "crocidoliet", "asbesthoudende produkten" en "crocidoliethoudende produkten"
      verstaan hetgeen daaronder wordt verstaan in het [Arbeidsomstandighedenbesluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008498
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel234a
    references:
      - id: ref1
        bwb_id: BWBR0008498
  - number: 234a.2
    text: |-
      Bij werkzaamheden bij, op of in een mijnwerk of een boorwerk of bij mijnbouwkundige onderzoekingen is het bij en
      krachtens [hoofdstuk 4, afdeling 5 van het Arbeidsomstandighedenbesluit][ref1] van overeenkomstige toepassing, met
      dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Afdeling5
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel234a
    references:
      - id: ref1
        bwb_id: BWBR0008498
        afdeling: '5'
  - number: 234a.2.a
    text: |-
      de bij en krachtens [artikel 325, eerste lid][ref1], van dit besluit aangewezen ambtenaren in de plaats treden van
      de ambtenaren, bedoeld in [artikel 24 van de Arbeidsomstandighedenwet 1998][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0002474#Artikel325
      [ref2]: https://wetten.overheid.nl/BWBR0010346#Artikel24
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel234a
    references:
      - id: ref1
        bwb_id: BWBR0002474
        artikel: '325'
        hoofdstuk: XVIII
      - id: ref2
        bwb_id: BWBR0010346
        artikel: '24'
  - number: 234a.2.b
    text: |-
      de bestuurders van de betrokken mijnonderneming of in [artikel 12, eerste lid][ref1], bedoelde andere onderneming
      in de plaats treden van de werkgever;


      [ref1]: https://wetten.overheid.nl/BWBR0002474#Artikel12
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel234a
    references:
      - id: ref1
        bwb_id: BWBR0002474
        artikel: '12'
        hoofdstuk: I
  - number: 234a.2.c
    text: |-
      de personen die werkzaam zijn bij, op of in een mijnwerk of een boorwerk of bij mijnbouwkundige onderzoekingen in
      de plaats treden van de werknemers;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel234a
  - number: 234a.2.d
    text: |-
      het in [artikel 4.52 van het Arbeidsomstandighedenbesluit][ref1] bedoelde medisch onderzoek in afwijking van
      het derde lid van dat artikel moet worden uitgevoerd door de in [artikel 223, eerste lid][ref2], bedoelde
      bedrijfsgeneeskundige dienst, dan wel, bij het ontbreken van een dergelijke dienst, door een ter zake deskundige
      arts.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0002474#Artikel223
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel234a
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0002474
        artikel: '223'
        hoofdstuk: XIII
        afdeling: '1'
  - number: 234a.3
    text: |-
      Voorts zijn, met inachtneming van het tweede lid, onder a, b, c en d, vrijstellingen, door Onze Minister van
      Sociale Zaken en Werkgelegenheid op grond van [artikel 30, eerste lid, van de Arbeidsomstandighedenwet 1998][ref1]
      verleend van de bij of krachtens [hoofdstuk 4, afdeling 5 van het Arbeidsomstandighedenbesluit][ref2] vastgestelde
      voorschriften, van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Afdeling5
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel234a
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '30'
      - id: ref2
        bwb_id: BWBR0008498
        afdeling: '5'
  - number: 234a.4
    text: |-
      Onze Minister kan ontheffing verlenen van de bij het tweede lid van overeenkomstige toepassing verklaarde
      voorschriften, met inachtneming van het in het [Arbeidsomstandighedenbesluit][ref1] omtrent de verlening van
      ontheffingen bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0008498
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel234a
    references:
      - id: ref1
        bwb_id: BWBR0008498
  - number: 234a.5
    text: |-
      Personen, die arbeid verrichten waarbij gevaar voor blootstelling aan asbeststof of crocidolietstof bestaat,
      alsmede personen, die asbest of asbesthoudende produkten dan wel crocidoliet of crocidoliethoudende produkten
      slopen of verwijderen, moeten overeenkomstig een schriftelijk plan doelmatige voorlichting en doelmatig onderricht
      ontvangen over door Onze Minister bij ministeriële regeling aan te wijzen onderwerpen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel234a
  - number: 234a.6
    text: |-
      Indien is aangetoond of redelijkerwijs het vermoeden bestaat dat iemand ten gevolge van de in de aanhef van
      het tweede lid bedoelde werkzaamheden aan asbestose of mesothelioom lijdt, wordt dit zo spoedig mogelijk aan de
      Inspecteur-Generaal der Mijnen medegedeeld.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel234a
  - number: 234a.7
    text: Onze Minister kan ter bevordering van een goede uitvoering van het tweede lid nadere regels stellen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel234a
  - number: 234b.1
    text: |-
      In dit artikel wordt onder "lood" verstaan hetgeen daaronder wordt verstaan in het
      [Arbeidsomstandighedenbesluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008498
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel234b
    references:
      - id: ref1
        bwb_id: BWBR0008498
  - number: 234b.2
    text: |-
      Bij werkzaamheden bij, op of in een mijnwerk of een boorwerk of bij mijnbouwkundige onderzoekingen is het bij en
      krachtens [hoofdstuk 4][ref1], [afdeling 7 van het Arbeidsomstandighedenbesluit](onbekend), van overeenkomstige
      toepassing, met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel234b
    references:
      - id: ref1
        bwb_id: BWBR0008498
        hoofdstuk: '4'
  - number: 234b.2.a
    text: |-
      de bestuurders van de betrokken mijnonderneming of in artikel 12, eerste lid, bedoelde andere onderneming in de
      plaats treden van de werkgever en
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel234b
  - number: 234b.2.b
    text: |-
      de personen die werkzaam zijn bij, op of in een mijnwerk of een boorwerk of bij mijnbouwkundige onderzoekingen in
      de plaats treden van de werknemers;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel234b
  - number: 234b.2.c
    text: |-
      de in artikel 223, eerste lid, bedoelde bedrijfsgeneeskundige dienst, dan wel een terzake
      deskundige arts als bedoeld in artikel 229*a*, eerste lid, in de plaats treedt van de in
      [artikel 4.74 van het Arbeidsomstandighedenbesluit][ref1] bedoelde dienst.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel234b
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
  - number: 234b.3
    text: |-
      Voorts zijn, met inachtneming van het tweede lid, onder *a*, *b* en *c*, vrijstellingen, door Onze Minister van
      Sociale Zaken en Werkgelegenheid op grond van [artikel 30, eerste lid, van de Arbeidsomstandighedenwet 1998][ref1]
      verleend van de bij of krachtens [hoofdstuk 4][ref2], [afdeling 7 van het Arbeidsomstandighedenbesluit](onbekend)
      vastgestelde voorschriften, van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel234b
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '30'
      - id: ref2
        bwb_id: BWBR0008498
        hoofdstuk: '4'
  - number: 234b.4
    text: |-
      Personen, die arbeid verrichten waarbij gevaar van blootstelling aan lood bestaat, alsmede hun vertegenwoordigers
      in het bedrijf of de vestiging, moeten doelmatige voorlichting ontvangen over door Onze Minister bij ministeriële
      regeling aan te wijzen onderwerpen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel234b
  - number: 234b.5
    text: Onze Minister kan ter bevordering van een goede uitvoering van het tweede lid nadere regels stellen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel234b
  - number: 234c.1
    text: |-
      In dit artikel wordt onder "kankerverwekkende stof" verstaan hetgeen daaronder wordt verstaan in het
      [Arbeidsomstandighedenbesluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008498
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel234c
    references:
      - id: ref1
        bwb_id: BWBR0008498
  - number: 234c.2
    text: |-
      Bij werkzaamheden bij, op of in een mijnwerk of een boorwerk of bij mijnbouwkundige onderzoekingen is het bij en
      krachtens [hoofdstuk 4][ref1], [afdeling 2 van het Arbeidsomstandighedenbesluit](onbekend), van overeenkomstige
      toepassing, met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel234c
    references:
      - id: ref1
        bwb_id: BWBR0008498
        hoofdstuk: '4'
  - number: 234c.2.a
    text: de Inspecteur-Generaal der Mijnen in de plaats treedt van het districtshoofd;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel234c
  - number: 234c.2.b
    text: |-
      de bestuurders van de betrokken mijnonderneming of in artikel 12, eerste lid, bedoelde andere onderneming in de
      plaats treden van de werkgever;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel234c
  - number: 234c.2.c
    text: |-
      de personen die werkzaam zijn bij, op of in een mijnwerk of een boorwerk of bij mijnbouwkundige onderzoekingen in
      de plaats treden van de werknemers;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel234c
  - number: 234c.2.d
    text: |-
      bij de in [artikel 4.14, eerste lid, van het Arbeidsomstandighedenbesluit][ref1] bedoelde beoordeling bijzondere
      aandacht wordt besteed aan de eventuele gevolgen voor de veiligheid of de gezondheid van bijzonder kwetsbare
      risicogroepen en aan de wenselijkheid de betrokken personen niet te werk te stellen op plaatsen waar zij in contact
      kunnen komen met kankerverwekkende stoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel234c
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
  - number: 234c.3
    text: |-
      Voorts zijn, met inachtneming van het tweede lid, onder *a*, *b* en *c*, vrijstellingen, door Onze Minister van
      Sociale Zaken en Werkgelegenheid op grond van [artikel 30, eerste lid, van de Arbeidsomstandighedenwet 1998][ref1]
      verleend van de bij of krachtens [hoofdstuk 4][ref2], [afdeling 2 van het Arbeidsomstandighedenbesluit](onbekend)
      vastgestelde voorschriften, van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel234c
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '30'
      - id: ref2
        bwb_id: BWBR0008498
        hoofdstuk: '4'
  - number: 234c.4
    text: |-
      Personen, die arbeid verrichten waarbij gevaar voor blootstelling aan kankerverwekkende stoffen bestaat, moeten
      een voldoende en tevens doelmatige opleiding op basis van alle beschikbare gegevens krijgen met name in de vorm
      van voorlichting en instructies. Deze opleiding moet worden aangepast aan de ontwikkeling van de risico’s en
      aan het ontstaan van nieuwe risico’s en, indien nodig, op gezette tijden worden herhaald. Onze Minister kan bij
      ministeriële regeling bepalen waarop deze opleiding in ieder geval betrekking moet hebben.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel234c
  - number: 234c.5
    text: |-
      De ondernemingsraad of de personeelsvertegenwoordiging, of bij het ontbreken daarvan, de betrokken personen worden
      geraadpleegd en hebben medezeggenschap omtrent de materie die onder het tweede lid, onder *d*, valt.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel234c
  - number: 234c.6
    text: |-
      Indien is aangetoond of redelijkerwijs het vermoeden bestaat dat een persoon aan kanker lijdt als een gevolg van
      blootstelling aan een kankerverwekkende stof op het werk, moet hiervan zo spoedig mogelijk mededeling worden gedaan
      aan de Inspecteur-Generaal der Mijnen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel234c
  - number: 234c.7
    text: Onze Minister kan ter bevordering van een goede uitvoering van het tweede lid nadere regelen stellen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel234c
  - number: '235'
    text: |-
      Vaste, vloeibare en gasvormige stoffen, die giftig of bijtend zijn of anderszins gevaar kunnen opleveren, moeten op
      veilige wijze worden bewaard, vervoerd, verwerkt en gebruikt.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel235
  - number: '236.1'
    text: |-
      Aan personen, die bij hun werkzaamheden blootstaan aan voor de gezondheid schadelijke invloeden, moet zo mogelijk
      de beschikking worden gegeven over doelmatige kleding en doelmatige middelen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel236
  - number: '236.2'
    text: De in het eerste lid bedoelde kleding en middelen moeten overeenkomstig hun bestemming worden gedragen en gebruikt.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel236
  - number: 236a.1
    text: |-
      Op plaatsen, waar personen in verband met door hen te verrichten arbeid moeten verblijven, dient het geluidsniveau
      te worden beoordeeld en, indien nodig, gemeten ten einde de arbeidsplaatsen te bepalen waar personen aan niveaus
      van schadelijk geluid kunnen worden blootgesteld.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel236a
  - number: 236a.2
    text: |-
      De beoordeling en de meting, bedoeld in het eerste lid, moeten geprogrammeerd en op een kundige wijze worden
      uitgevoerd en moeten representatief zijn voor de blootstelling aan geluid op de arbeidsplaats gedurende de
      dagelijkse arbeidstijd. De beoordeling en de meting moeten met passende tussenpozen worden herhaald, doch in
      elk geval indien er voor het geluid op de arbeidsplaats relevante veranderingen plaatsvinden in de arbeid of de
      omstandigheden waaronder deze arbeid wordt verricht en indien er redenen zijn om aan te nemen, dat de uitgevoerde
      beoordeling of meting onjuist is.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel236a
  - number: 236a.3
    text: |-
      De bij de meting gebruikte methoden en apparaten moeten aan de desbetreffende omstandigheden zijn aangepast. Met
      name moet daarbij worden gelet op de kenmerken van het te meten geluid en de omgevingsfactoren. De meetmethode en
      het meetapparaat dienen op elkaar te zijn afgestemd. De gebruikte methoden en apparaten moeten geschikt zijn om
      te bepalen of de krachtens de artikelen 236*b*, 236*c* en 236*e* vastgestelde niveaus van schadelijk geluid al dan
      niet worden overschreden.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel236a
  - number: 236a.4
    text: |-
      De ondernemingsraad of, bij het ontbreken daarvan, de betrokken personen wordt de gelegenheid gegeven een oordeel
      over de wijze van beoordeling en meting kenbaar te maken. De ondernemingsraad of, bij het ontbreken daarvan, de
      betrokken personen krijgen op hun verzoek uitleg over de betekenis van de meetresultaten.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel236a
  - number: 236a.5
    text: |-
      De resultaten van de ingevolge dit artikel uitgevoerde beoordelingen en metingen moeten in een doelmatig
      register en gedurende ten minste 10 jaren worden bewaard. De resultaten worden, voorzien van een toelichting,
      ter kennis gebracht van de ondernemingsraad of, bij het ontbreken daarvan, van de betrokken werkzame personen.
      De bedrijfsgeneeskundige dienst, bedoeld in artikel 223, dan wel, indien artikel 223, vierde lid, toepassing
      heeft gevonden, de desbetreffende arts, heeft toegang tot de resultaten van de ingevolge dit artikel uitgevoerde
      beoordelingen en metingen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel236a
  - number: 236a.6
    text: Onze Minister kan ter uitvoering van dit artikel nadere regelen stellen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel236a
  - number: 236b.1
    text: |-
      Werktuigen, werktuigdelen, drijfwerken, gereedschappen, ketels en andere toestellen, met alles wat daartoe behoort,
      moeten van zodanige constructie zijn, zodanig zijn ingericht, opgesteld of ondersteund zijn en zodanig worden
      onderhouden, dat zij bij het in werking zijn geen schadelijk geluid veroorzaken, tenzij zulks redelijkerwijs niet
      kan worden gevergd.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel236b
  - number: 236b.2
    text: |-
      Het verrichten van werkzaamheden moet zodanig geschieden dat daarbij geen schadelijk geluid wordt veroorzaakt,
      tenzij zulks redelijkerwijs niet kan worden gevergd.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel236b
  - number: 236b.3
    text: |-
      Indien de uitzondering, vervat in de laatste zinsnede van het eerste of tweede lid, van toepassing is, moeten
      overeenkomstig een programma doelmatige voorzieningen zijn aangebracht, waardoor zoveel mogelijk wordt voorkomen
      dat schadelijk geluid heerst in een ruimte waarin personen arbeid verrichten, tenzij zulks redelijkerwijs niet kan
      worden gevergd.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel236b
  - number: 236b.4
    text: |-
      In gevallen waarin voorzieningen, aangebracht ingevolge het derde lid, de daar bedoelde personen onvoldoende
      bescherming bieden tegen het schadelijk geluid en in gevallen waarin het aanbrengen van vorenbedoelde voorzieningen
      redelijkerwijs niet kan worden gevergd, moeten overeenkomstig een programma doeltreffende maatregelen genomen zijn
      om de blootstellingsduur alsmede het aantal personen die aan schadelijk geluid worden blootgesteld zo veel mogelijk
      te beperken.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel236b
  - number: 236b.5
    text: |-
      Onze Minister kan met betrekking tot mijnbouwkundig werk één of meer niveaus vaststellen, waarboven geluid voor de
      toepassing van het eerste tot en met vierde lid wordt geacht schadelijk te zijn in de zin van die leden.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel236b
  - number: 236b.6
    text: |-
      De betrokken personen en, indien aanwezig, de ondernemingsraad worden in kennis gesteld van de redenen waarom de
      in de laatste zinsnede van het eerste, tweede en derde lid vervatte uitzonderingen van toepassing zijn, van de
      ingevolge het derde lid aangebrachte voorzieningen en van de ingevolge het vierde lid genomen maatregelen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel236b
  - number: 236c.1
    text: |-
      In gevallen, waarin personen kunnen worden blootgesteld aan een door Onze Minister voor de toepassing van dit
      artikellid vastgesteld schadelijk geluidsniveau, moeten doelmatige gehoorbeschermingsmiddelen in voldoende aantal
      worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel236c
  - number: 236c.2
    text: |-
      Onze Minister kan de niveaus van schadelijk geluid vaststellen waarboven door personen gehoorbeschermingsmiddelen
      moeten worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel236c
  - number: 236c.3
    text: |-
      De gehoorbeschermingsmiddelen, bedoeld in het eerste en tweede lid, dienen een demping van het geluid te bieden
      tot het in het eerste lid bedoelde niveau. Indien een zodanige demping technisch niet mogelijk is, moet door
      de gehoorbeschermingsmiddelen ten minste een demping van het geluid worden geboden tot beneden het krachtens
      het tweede lid vastgestelde niveau van schadelijk geluid. De gehoorbeschermingsmiddelen moeten in goede staat
      verkeren en zindelijk worden gehouden. De betrokken personen wordt de gelegenheid gegeven een oordeel over de
      keuze van de soort gehoorbeschermingsmiddelen kenbaar te maken. Het ongevalsrisico verbonden aan het gebruik van
      gehoorbeschermingsmiddelen moet zoveel als redelijkerwijs mogelijk is door doelmatige maatregelen zijn beperkt.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel236c
  - number: 236c.4
    text: |-
      De plaatsen waar overschrijding van ten minste één van de krachtens het tweede lid vastgestelde niveaus van
      schadelijk geluid kan worden verwacht, dienen duidelijk te zijn afgebakend en te zijn gemarkeerd door signalen.
      Alleen personen die beroepshalve of uit hoofde van hun functie deze plaatsen moeten betreden, mogen daar worden
      toegelaten.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel236c
  - number: 236c.5
    text: |-
      Personen, waarvan waarschijnlijk is dat ze worden blootgesteld aan een van de door Onze Minister voor de toepassing
      van dit artikellid vastgesteld niveaus van schadelijk geluid, krijgen zo nodig een opleiding over:
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel236c
  - number: 236c.5.a
    text: de mogelijke gevaren voor het gehoor als gevolg van blootstelling aan geluid;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel236c
  - number: 236c.5.b
    text: de bestaande regelgeving met betrekking tot geluid en de op grond van deze regelgeving genomen maatregelen;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel236c
  - number: 236c.5.c
    text: |-
      de gevallen waarin gehoorbeschermingsmiddelen ter beschikking moeten worden gesteld alsmede de gevallen waarin en
      wijze waarop gehoorbeschermingsmiddelen moeten worden gebruikt;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel236c
  - number: 236c.5.d
    text: |-
      de inhoud en betekenis van een periodiek te herhalen audiometrisch onderzoek en de gevallen waarin aan werknemers
      de gelegenheid moet worden geboden om een dergelijk onderzoek te ondergaan.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel236c
  - number: 236d
    text: |-
      In gevallen waarin personen die bijzondere taken uitvoeren in verband met het uitvoeren van deze taken moeten
      verblijven op plaatsen waar het niveau van het geluid van dag tot dag sterk varieert en het redelijkerwijze
      niet kan worden gevergd dat de in artikel 236*b*, derde en vierde lid, bedoelde voorzieningen en maatregelen
      aangebracht, onderscheidenlijk genomen worden, gelden de volgende voorschriften:
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel236d
  - number: 236d.a
    text: |-
      het gemiddelde niveau van het geluid, berekend of gemeten over een periode van een week, mag de voor artikel
      236*b*, vijfde lid, vastgestelde niveau van schadelijk geluid niet overschrijden, tenzij zulks redelijkerwijze niet
      kan worden gevergd.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel236d
  - number: 236d.b
    text: |-
      met regelmatige tussenpozen, doch in elk geval indien er voor het geluid op de arbeidsplaats relevante
      veranderingen plaatsvinden in de arbeid of de omstandigheden waaronder deze arbeid wordt verricht, moet worden
      gecontroleerd of nog wordt voldaan aan het in onderdeel *a* genoemde voorschrift.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel236d
  - number: 236e.1
    text: |-
      Personen die worden blootgesteld aan een door Onze Minister voor de toepassing van dit artikel vastgesteld niveau
      van schadelijk geluid moeten in de gelegenheid worden gesteld een audiometrisch onderzoek te ondergaan dat erop
      gericht is de gehoorfunctie van de betrokken persoon zoveel mogelijk in stand te houden.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel236e
  - number: 236e.2
    text: |-
      Het audiometrisch onderzoek, bedoeld in het eerste lid, moet worden uitgevoerd door de bedrijfsgeneeskundige
      dienst, bedoeld in artikel 223, dan wel, indien artikel 223, vierde lid, toepassing heeft gevonden, door een arts
      die terzake deskundig is.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel236e
  - number: 236e.3
    text: |-
      Zolang de blootstelling aan het in het eerste lid bedoelde niveau van schadelijk geluid duurt, moeten de betrokken
      personen met tussenpozen van vier jaren opnieuw in de gelegenheid worden gesteld om een audiometrisch onderzoek als
      bedoeld in het eerste en tweede lid te ondergaan, dan wel met kortere tussenpozen indien dit naar het oordeel van
      de dienst of de arts, bedoeld in het tweede lid, noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel236e
  - number: 236e.4
    text: |-
      Aan de dienst of de arts, bedoeld in het tweede lid, moet inzage gegeven worden in het in artikel 236*a*, vijfde
      lid, bedoelde register en moet de gelegenheid worden geboden om te adviseren over de te nemen persoonlijke
      beschermende dan wel preventieve maatregelen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel236e
  - number: 236e.5
    text: De resultaten van het audiometrisch onderzoek moeten gedurende ten minste tien jaar worden bewaard.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel236e
  - number: 236e.6
    text: |-
      De betrokken personen moeten in kennis worden gesteld van de resultaten van elk audiometrisch onderzoek dat zij
      overeenkomstig dit artikel hebben ondergaan.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel236e
  - number: 236f.1
    text: |-
      In dit artikel wordt onder "beeldscherm" en "werkplek" verstaan hetgeen daaronder wordt verstaan in het
      [Arbeidsomstandighedenbesluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008498
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel236f
    references:
      - id: ref1
        bwb_id: BWBR0008498
  - number: 236f.2
    text: |-
      Bij werkzaamheden bij, op of in een mijnwerk of een boorwerk of bij mijnbouwkundige onderzoekingen is
      [hoofdstuk 5][ref1], [afdeling 2 van het Arbeidsomstandighedenbesluit](onbekend) van overeenkomstige toepassing,
      met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel236f
    references:
      - id: ref1
        bwb_id: BWBR0008498
        hoofdstuk: '5'
  - number: 236f.2.a
    text: |-
      de bestuurders van de betrokken mijnonderneming of in artikel 12, eerste lid, bedoelde andere onderneming in de
      plaats treden van de werkgever;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel236f
  - number: 236f.2.b
    text: |-
      de personen die werkzaam zijn bij, op of in een mijnwerk of een boorwerk of bij mijnbouwkundige onderzoekingen in
      de plaats treden van de werknemers;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel236f
  - number: 236f.2.c
    text: |-
      het in [artikel 5.11 van het Arbeidsomstandighedenbesluit][ref1] bedoelde onderzoek moet in afwijking van
      het vijfde lid van dat artikel worden uitgevoerd door de in artikel 223, eerste lid, van dit besluit bedoelde
      bedrijfsgeneeskundige dienst, dan wel, bij het ontbreken van een dergelijke dienst, door een terzake deskundige
      arts.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel5
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel236f
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '5'
  - number: 236f.3
    text: |-
      Voorts zijn, met inachtneming van het tweede lid, vrijstellingen, door Onze Minister van Sociale Zaken en
      Werkgelegenheid op grond van [artikel 30, eerste lid, van de Arbeidsomstandighedenwet 1998][ref1] verleend van
      de bij of krachtens [hoofdstuk 5][ref2], [afdeling 2 van het Arbeidsomstandighedenbesluit](onbekend) vastgestelde
      voorschriften, van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel236f
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '30'
      - id: ref2
        bwb_id: BWBR0008498
        hoofdstuk: '5'
  - number: 236f.4
    text: |-
      De in het tweede lid, onder *b*, bedoelde personen moeten worden voorgelicht over voorschriften inzake veiligheid
      en gezondheid bij het werken met beeldschermen. De ondernemingsraad of de personeelsvertegenwoordiging, of bij het
      ontbreken daarvan, de betrokken personen moeten op de hoogte worden gesteld van alle maatregelen betreffende de
      veiligheid en de gezondheid, die met toepassing van dit artikel worden genomen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel236f
  - number: 236f.5
    text: |-
      Aan de in het tweede lid, onder *b*, bedoelde personen moet bovendien een opleiding worden gegeven betreffende
      de wijze van gebruik van beeldschermen, alvorens zij hiermee beginnen te werken en voorts telkens wanneer de
      organisatie van de werkplek ingrijpend wordt gewijzigd.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel236f
  - number: 236f.6
    text: |-
      Onze Minister kan ter bevordering van een goede uitvoering van het tweede, vierde en vijfde lid nadere regels
      stellen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel236f
  - number: 236f.7
    text: |-
      De ondernemingsraad of de personeelsvertegenwoordiging, of bij het ontbreken daarvan, de betrokken personen worden
      geraadpleegd en hebben medezeggenschap omtrent te nemen maatregelen inzake veiligheid en gezondheid bij het werken
      met beeldschermen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel236f
  - number: '237.1'
    text: |-
      Gebouwen en andere opstallen moeten, tenzij de aard van het bedrijf zulks niet toelaat, zodanig zijn ingericht
      en worden onderhouden, dat de daarin aanwezige personen doelmatig beschut zijn tegen hinderlijke of schadelijke
      invloeden van het buitenklimaat.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel237
  - number: '237.2'
    text: |-
      Ramen, bovenlichtvoorzieningen en glazen wanden moeten zodanig geconstrueerd zijn dat, rekening houdend met het
      soort werk en de aard van de arbeidsplaats, overmatig zonlicht op de arbeidsplaats wordt vermeden.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel237
  - number: '237.3'
    text: |-
      De arbeidsplaatsen waar feitelijk werkplekken zijn ingericht moeten voldoende thermisch geïsoleerd zijn, rekening
      houdend met de aard van de werkzaamheden en van de lichamelijke activiteit van de arbeiders.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel237
  - number: '237.4'
    text: |-
      De temperatuur in de werkruimten moet gedurende de arbeidstijd zijn afgestemd op het menselijk organisme, rekening
      houdend met de werkmethoden en de door de arbeiders te leveren lichamelijke inspanningen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel237
  - number: '238.1'
    text: In een lokaal, waarin personen arbeid plegen te verrichten, mag de temperatuurindex niet hoger zijn dan 29.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel238
  - number: '238.2'
    text: |-
      Wanneer echter de temperatuurindex van de buitenlucht 18 of minder is, mag in zodanig lokaal de temperatuurindex
      niet hoger zijn dan 22.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel238
  - number: '238.3'
    text: |-
      Onze Minister kan in bijzondere gevallen van het in de voorgaande leden bepaalde ontheffing verlenen. Van het in
      het tweede lid bepaalde kan hij bovendien ontheffing verlenen, indien eisen van specifiek bedrijfstechnische aard
      daartoe aanleiding geven.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel238
  - number: '239.1'
    text: In een lokaal, waarin personen arbeid plegen te verrichten, mag de temperatuurindex niet lager zijn dan 12.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel239
  - number: '239.2'
    text: |-
      Indien om redenen van specifiek bedrijfstechnische aard aan het in het eerste lid bepaalde niet kan worden voldaan,
      moet het lokaal tot zodanige temperatuur zijn verwarmd als de aard van het daarin uitgeoefende bedrijf toelaat
      en moet de arbeider ter plaatse, waar hij zijn arbeid uitsluitend of in hoofdzaak verricht, voldoende warmte zijn
      gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel239
  - number: '239.3'
    text: Onze Minister kan van het in de voorgaande leden bepaalde ontheffing verlenen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel239
  - number: '240.1'
    text: |-
      Het in de artikelen 238 en 239 bepaalde is niet van toepassing, indien in een lokaal, waarin personen arbeid plegen
      te verrichten, de droge luchttemperatuur en de stralingstemperatuur meer dan 5° C verschillen of de luchtsnelheid
      meer dan één meter per seconde bedraagt.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel240
  - number: '240.2'
    text: |-
      In de in het eerste lid bedoelde gevallen bepaalt Onze Minister, welk klimaat toelaatbaar is, zomede welke
      maatregelen moeten worden genomen tot het tegengaan van schadelijke klimaatinvloeden en, zo nodig, tot het
      tegengaan van nadelige gevolgen van sterke warmtestraling.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel240
  - number: '241'
    text: |-
      Doelmatige metingen moeten worden verricht om te kunnen beoordelen of aan het bij of krachtens de artikelen 238-240
      bepaalde wordt voldaan. Onze Minister kan bepalen, waar en wanneer deze metingen moeten worden verricht.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel241
  - number: '242.1'
    text: |-
      De lucht in een lokaal, waarin personen plegen aanwezig te zijn, moet voldoende en op doelmatige wijze worden
      ververst onder vermijding van hinderlijke tocht.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel242
  - number: '242.2'
    text: |-
      In een lokaal, waarin personen arbeid plegen te verrichten, moet ervoor worden gezorgd dat, rekening houdend met de
      werkmethoden en de lichamelijke activiteit van de arbeiders, voldoende reine lucht aanwezig is.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel242
  - number: '242.3'
    text: |-
      Indien een luchtverversingsinstallatie wordt gebruikt, moet deze altijd gebruiksklaar zijn. Storingen moeten door
      een controlesysteem worden gemeld als dat noodzakelijk is voor de gezondheid van de arbeiders.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel242
  - number: '242.4'
    text: |-
      Indien airconditioningsinstallaties of mechanische ventilatie-installaties worden gebruikt moeten die op zodanige
      wijze functioneren dat de arbeiders niet aan hinderlijke tocht worden blootgesteld.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel242
  - number: '242.5'
    text: |-
      Elke ongerechtigheid die via verontreiniging van de ingeademde lucht een onmiddellijk gevaar kan meebrengen voor de
      gezondheid van de arbeiders, moet snel worden verwijderd.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel242
  - number: '242.6'
    text: |-
      De temperatuur van ontspanningruimten, ruimten voor het personeel in avond- en nachtdienst, sanitaire ruimten,
      kantines en eerstehulpruimten moet op de specifieke bestemming van deze ruimten zijn afgestemd.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel242
  - number: '243.1'
    text: |-
      Een persoon, die niet werkzaam is in een lokaal als in de artikelen 238-240 bedoeld, moet ter plaatse waar hij
      arbeid verricht voldoende beschut zijn tegen:
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel243
  - number: 243.1.a
    text: de schadelijke invloeden van het klimaat, als de temperatuurindex op die plaats hoger dan 29 is;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel243
  - number: 243.1.b
    text: de nadelige en schadelijke invloeden van koude.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel243
  - number: '243.2'
    text: |-
      Indien een persoon niet voldoende kan worden beschut tegen invloeden als in het eerste lid bedoeld, kan Onze
      Minister aanwijzingen geven met betrekking tot de tijd, gedurende welke deze persoon op de betrokken plaats arbeid
      mag verrichten, alsmede met betrekking tot de tijd, gedurende welke aan hem extra rust moet worden gegeven.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel243
  - number: '244'
    text: |-
      Wanneer een persoon aan grote temperatuurwisselingen is blootgesteld, moeten doelmatige maatregelen worden genomen,
      teneinde hem tegen de nadelige invloeden daarvan te beschutten.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel244
  - number: '245'
    text: |-
      Een persoon, wiens werkzaamheden hem blootstellen aan aanraking met koude of natte oppervlakken, aan bespatting
      door water of aan regen, moet wanneer daarvan nadelige invloeden kunnen worden verwacht, tegen deze invloeden
      voldoende worden beschut.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel245
  - number: '246.1'
    text: |-
      Een lokaal met aanhorigheden of een overdekte plaats, waar personen plegen aanwezig te zijn, moet vrij zijn van
      grond- en rioolwater en met de zich aldaar bevindende inventaris zindelijk en zoveel mogelijk vrij van stof worden
      gehouden. Het oppervlak van vloeren, muren en plafonds van de ruimten moeten van zodanige aard zijn dat zij kunnen
      worden schoongemaakt en onderhouden ten einde passende hygiënische omstandigheden te verkrijgen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel246
  - number: '246.2'
    text: |-
      In een lokaal, waarin water wordt gebruikt, moet dit op doelmatige wijze kunnen afvloeien. Afval en vuilnis moeten
      zo spoedig mogelijk en op doelmatige wijze worden verwijderd.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel246
  - number: '247.1'
    text: 'Schafttijden mogen niet worden doorgebracht:'
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel247
  - number: 247.1.a
    text: op door Onze Minister aangewezen besloten plaatsen;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel247
  - number: 247.1.b
    text: op andere besloten plaatsen, waar alsdan de bedrijfsarbeid wordt verricht.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel247
  - number: '247.2'
    text: Onze Minister kan van het in het eerste lid onder *b* bepaalde ontheffing verlenen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel247
  - number: 247a.1
    text: |-
      Wanneer de veiligheid of de gezondheid van de arbeiders, met name wegens de aard van de werkzaamheden of de
      omvang van het personeelsbestand, dat vereisen, moeten de arbeiders de beschikking hebben over een doelmatige en
      gemakkelijk toegankelijke verblijfsaccommodatie of recreatieverblijf.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel247a
  - number: 247a.2
    text: Onze Minister kan nadere regelen stellen ter zake van het in het eerste lid bepaalde.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel247a
  - number: 247b.1
    text: |-
      Op een bemande mijnbouwinstallatie moet een voldoende aantal naar de seksen der gebruikers gescheiden
      doelmatige slaapverblijven met voldoende doelmatige slaapplaatsen aanwezig zijn, alsmede een doelmatig eet- en
      recreatieverblijf.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel247b
  - number: 247b.2
    text: |-
      De in het eerste lid bedoelde verblijven mogen noch geheel noch gedeeltelijk aan hun bestemming worden onttrokken.
      Zij moeten in zindelijke toestand worden gehouden, zomede doelmatig worden geventileerd en voldoende zijn verwarmd.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel247b
  - number: 247b.3
    text: |-
      De toegang tot elk der slaapverblijven moet zijn voorzien van een duidelijk waarneembare aanduiding van de sekse
      der gebruikers, voor welke het bestemd is.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel247b
  - number: 247b.4
    text: Onze Minister kan van het tweede lid, eerste volzin, ontheffing verlenen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel247b
  - number: '248.1'
    text: |-
      Op de bovengrondse werken moet, een doelmatige was-, bad- en kleedgelegenheid aanwezig zijn, waar tevens kleding
      en schoeisel kunnen worden verwisseld, bewaard en gedroogd. Deze gelegenheid moet voldoende zijn voor de sterkst
      bezette ploeg.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel248
  - number: '248.2'
    text: |-
      Indien de plaats van de was-, bad- en kleedgelegenheid naar het oordeel van Onze Minister voor personen op de
      bovengrondse werken, wier arbeid wassen, baden of verwisseling van kleding wenselijk maakt, niet doelmatig is,
      moet op een of meer door of vanwege de bestuurders van de betrokken mijnonderneming, onder goedkeuring van Onze
      Minister, aangewezen plaatsen voor die personen een doelmatige was- of bad- en kleedgelegenheid aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel248
  - number: '248.3'
    text: |-
      Indien Onze Minister zulks nodig oordeelt, moet voor personen op boorwerken of bij mijnbouwkundige onderzoekingen
      op door of vanwege de bestuurders van de betrokken mijnonderneming of, in artikel 12, eerste lid, bedoelde,
      andere onderneming, onder goedkeuring van Onze Minister, aangewezen plaatsen voldoende en doelmatige was-, bad- en
      kleedgelegenheid aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel248
  - number: '248.4'
    text: |-
      De in het eerste, het tweede en het derde lid bedoelde gelegenheden moeten in zindelijke toestand worden gehouden,
      zomede doelmatig geventileerd worden en voldoende verwarmd zijn.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel248
  - number: '248.5'
    text: |-
      In de in het eerste, tweede en derde lid bedoelde was- en badgelegenheden moet voldoende zuiver warm en koud
      stromend water aanwezig zijn. Het gebruikte water moet onmiddellijk kunnen wegvloeien.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel248
  - number: '248.6'
    text: |-
      Onze Minister kan voorschrijven, dat bepaalde personen of groepen van personen na het beëindigen der werkzaamheden
      van een gelegenheid als in het eerste, het tweede of het derde lid bedoeld gebruik moeten maken.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel248
  - number: '248.7'
    text: |-
      Een gelegenheid als in het eerste, het tweede of het derde lid bedoeld mag niet gelijktijdig voor beide seksen
      toegankelijk zijn, tenzij deze zodanig is ingericht, dat ieder zich gescheiden van personen van de andere sekse kan
      wassen, baden en uit- en aankleden.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel248
  - number: '248.8'
    text: Het is verboden gelijktijdig met een ander van één badcel gebruik te maken.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel248
  - number: '248.9'
    text: |-
      De inrichting van de in het eerste, het tweede en het derde lid bedoelde gelegenheden moet zodanig zijn, dat
      personen beneden 18 jaar zich gescheiden van de ouderen kunnen uit- en aankleden en afzonderlijk kunnen baden.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel248
  - number: 248a.1
    text: |-
      Een persoon, belast met het verrichten van werkzaamheden als in artikel 229, eerste lid, onder *b*, bedoeld, mag
      zodanige werkzaamheden niet verrichten, indien uit de uitslag van een geneeskundig onderzoek blijkt, dat zijn
      geestelijke of lichamelijke gesteldheid gevaar voor de gezondheid of de veiligheid van anderen kan opleveren.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel248a
  - number: 248a.2
    text: |-
      Indien uit de uitslag van een geneeskundig onderzoek blijkt, dat de geestelijke of lichamelijke gesteldheid van de
      onderzochte persoon gevaar voor de gezondheid of de veiligheid van anderen kan opleveren, wordt deze uitslag aan
      die persoon en aan de Inspecteur-Generaal der Mijnen medegedeeld.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel248a
  - number: 248a.3
    text: |-
      De onderzochte persoon kan binnen 14 dagen, nadat hij van de hem gedane mededeling kennis heeft kunnen nemen,
      schriftelijk aan Onze Minister om een nader geneeskundig onderzoek verzoeken. Met dit onderzoek worden belast:
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel248a
  - number: 248a.3.a
    text: |-
      indien aan de betrokken mijnonderneming een bedrijfsgeneeskundige dienst is verbonden en het geneeskundige
      onderzoek, bedoeld in het tweede lid, door een of meer aan die dienst verbonden bedrijfsartsen is verricht,
      zo mogelijk een of meer door Onze Minister aan te wijzen andere aan de betrokken bedrijfsgeneeskundige dienst
      verbonden bedrijfsartsen, dan wel,
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel248a
  - number: 248a.3.b
    text: |-
      indien bedoeld geneeskundig onderzoek niet door een of meer aan zodanige dienst verbonden bedrijfsartsen is
      verricht of de aanwijzing van andere aan de betrokken bedrijfsgeneeskundige dienst verbonden bedrijfsartsen niet
      mogelijk is, een of meer door Onze Minister aan te wijzen andere artsen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel248a
  - number: '249.1'
    text: |-
      Het ontstaan en de verspreiding van schadelijke of hinderlijke gassen, dampen of nevels of van schadelijk of
      hinderlijk stof in een ruimte of op een plaats, waar personen plegen aanwezig te zijn, moeten worden voorkomen.
      Waar dit niet mogelijk is moeten doelmatige maatregelen worden genomen tot afvoer daarvan. Het afvoersysteem moet
      in staat zijn schadelijke stoffen in de atmosfeer te verdunnen zonder risico’s voor de arbeiders.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel249
  - number: '249.2'
    text: |-
      Indien personen, ondanks ingevolge het eerste lid genomen maatregelen, blootstaan aan de invloed van schadelijke of
      hinderlijke gassen, dampen of nevels of van schadelijk of hinderlijk stof, moeten zij op doelmatige wijze daartegen
      worden beschermd.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel249
  - number: '249.3'
    text: |-
      Met het oog op de uitvoering van het eerste en het tweede lid kan Onze Minister voor de concentratie van gassen,
      dampen, nevels en stof grenswaarden vaststellen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel249
  - number: '249.4'
    text: |-
      Doelmatige metingen moeten worden verricht om te kunnen beoordelen of aan het eerste en het tweede lid, met
      inachtneming van het krachtens het derde lid bepaalde, is voldaan. Onze Minister kan bepalen, waar en wanneer deze
      metingen moeten worden verricht.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel249
  - number: '249.5'
    text: |-
      Doelmatige maatregelen moeten worden genomen voor het evalueren van de aanwezigheid en het meten van de
      concentratie van schadelijke stoffen in de atmosfeer.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel249
  - number: '249.6'
    text: |-
      Wanneer de veiligheid en de gezondheid van de arbeiders dat vereisen, moet bewakingsapparatuur voor het
      automatisch en continu registreren van de gasconcentraties op bepaalde plaatsen, automatische alarminstallaties
      en voorzieningen voor de automatische afsluiting van de stroomtoevoer naar elektrische installaties en voor het
      automatisch stopzetten van verbrandingsmotoren worden aangebracht.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel249
  - number: '249.7'
    text: Van automatische metingen moeten de meetwaarden worden geregistreerd en bewaard.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel249
  - number: 249a.1
    text: |-
      In zones waar personen kunnen worden blootgesteld aan een atmosfeer die schadelijk is voor de gezondheid moet een
      voldoende aantal doelmatige ademhalings- en reanimatieapparaten ter beschikking zijn. In dergelijke gevallen moet
      ervoor worden gezorgd dat er op de arbeidsplaats voldoende personen ter beschikking staan die deze apparatuur
      kunnen bedienen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel249a
  - number: 249a.2
    text: De in het eerste lid bedoelde apparatuur moet naar behoren worden opgeslagen en onderhouden.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel249a
  - number: 249a.3
    text: |-
      Wanneer zwavelwaterstof of andere toxische gassen in de atmosfeer aanwezig zijn of kunnen zijn, moet op het
      desbetreffende bovengrondse werk of boorwerk een beschermingsplan aanwezig zijn met gedetailleerde gegevens over de
      beschikbare apparatuur en de preventieve maatregelen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel249a
  - number: '250.1'
    text: |-
      Op de bovengrondse werken moet bij elke schachtinstallatie, welke voor personenvervoer wordt gebruikt, een ruimte
      aanwezig zijn, waar het personeel, beschut tegen ongunstige weersinvloeden en hinderlijke tocht, het tijdstip van
      afdalen kan afwachten.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel250
  - number: '250.2'
    text: |-
      Op de bovengrondse werken moet een doelmatig lokaal aanwezig zijn, dat het aantal personen kan bevatten, hetwelk
      voor het aldaar ontvangen van loon of kennisnemen van instructies wordt samengeroepen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel250
  - number: '250.3'
    text: |-
      Op de bovengrondse werken moet een doelmatig lokaal aanwezig zijn, waarin de schafttijden kunnen worden
      doorgebracht.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel250
  - number: '250.4'
    text: |-
      Onze Minister kan voorschrijven, dat bij een boorwerk doelmatige lokalen als in het tweede en het derde lid
      bedoeld, zomede doelmatige verblijven, waar personen zo nodig kunnen overnachten, aanwezig moeten zijn.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel250
  - number: '250.5'
    text: |-
      De in de voorgaande leden bedoelde ruimten, lokalen en verblijven moeten in zindelijke toestand worden gehouden,
      zomede doelmatig geventileerd worden en voldoende verwarmd zijn.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel250
  - number: '251.1'
    text: |-
      Aan een persoon, belast met het verrichten van werkzaamheden als in artikel 229, eerste lid, onder *a*, bedoeld,
      wordt de toegang tot de ondergrondse werken geweigerd, indien uit de uitslag van een geneeskundig onderzoek
      blijkt, dat zijn geestelijke of lichamelijke gesteldheid gevaar voor de gezondheid of de veiligheid van anderen
      kan opleveren.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel251
  - number: '251.2'
    text: Artikel 248*a*, tweede en derde lid, is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel251
  - number: '252.1'
    text: |-
      Aan een persoon, bij wie bij een geneeskundig onderzoek mijnwormeieren zijn aangetroffen, wordt de toegang tot de
      ondergrondse werken geweigerd, zolang de bestuurders van de betrokken mijnonderneming niet in het bezit zijn van
      een na dat onderzoek afgegeven geneeskundige verklaring, waaruit blijkt, dat de betrokken persoon met goed gevolg
      een genezingskuur heeft ondergaan.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel252
  - number: '252.2'
    text: |-
      Onze Minister kan in bijzondere gevallen voor een bepaalde termijn van het in het eerste lid bepaalde ontheffing
      verlenen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel252
  - number: 252a.1
    text: |-
      Een persoon beneden 21 jaar mag slechts zijn of worden belast met werkzaamheden in de ondergrondse werken, indien
      de bestuurders van de betrokken mijnonderneming in het bezit zijn van een geneeskundige verklaring, afgegeven bij
      het laatstgehouden geneeskundige onderzoek, bedoeld in artikel 229, of bij de laatstgehouden geneeskundige controle
      krachtens een andere regeling als in artikel 229, zesde lid, bedoeld, waaruit blijkt, dat hij geschikt is voor het
      verrichten van zodanige werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel252a
  - number: 252a.2
    text: |-
      In geval een geneeskundige verklaring als in het eerste lid bedoeld niet wordt afgegeven, wordt de onderzochte
      persoon en de Inspecteur-Generaal der Mijnen daarvan mededeling gedaan. In zodanig geval is artikel 248*a*, derde
      lid, van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel252a
  - number: '253.1'
    text: |-
      Voor personen, die hun werkzaamheden geheel of grotendeels moeten verrichten op een plaats, waar de effectieve
      temperatuur 28 °C of hoger is, mag het ononderbroken verblijf in de ondergrondse werken, in de zin van artikel 282,
      niet langer duren dan 6 uur.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel253
  - number: '253.2'
    text: |-
      Personen beneden 21 jaar mogen geen werkzaamheden verrichten op een plaats in de ondergrondse werken, waar de
      effectieve temperatuur 28 °C of hoger is.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel253
  - number: '253.3'
    text: |-
      Op een plaats in de ondergrondse werken, waar de effectieve temperatuur 32 °C of hoger is, mogen zich geen personen
      bevinden buiten het geval van nood of dreigend gevaar.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel253
  - number: '253.4'
    text: Onze Minister kan in bijzondere gevallen van het in het derde lid bepaalde ontheffing verlenen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel253
  - number: '254.1'
    text: |-
      In de in artikel 214 bedoelde luchtmeetstations moeten tenminste eenmaal in de veertien dagen de droge
      luchttemperatuur, de natte luchttemperatuur en de snelheid van de luchtstroom worden gemeten ter bepaling van de
      effectieve temperatuur. Indien en zolang deze laatste 27 °C of hoger blijkt te zijn, moeten de metingen dagelijks
      worden verricht.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel254
  - number: '254.2'
    text: |-
      Indien Onze Minister zulks verlangt, moeten metingen overeenkomstig het in het eerste lid bepaalde eveneens worden
      verricht op door hem aan te wijzen andere plaatsen in de ondergrondse werken.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel254
  - number: '254.3'
    text: |-
      Indien Onze Minister zulks verlangt, moeten de bestuurders van de betrokken mijnonderneming de Inspecteur-Generaal
      der Mijnen onverwijld schriftelijk in kennis stellen van de gevallen, waarin een effectieve temperatuur van 27 °C
      of hoger is waargenomen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel254
  - number: '255.1'
    text: |-
      Het ontstaan van steen- of kolenstof en het vrijkomen daarvan in de lucht moeten met doelmatige middelen worden
      tegengegaan. In de lucht vrijgekomen schadelijk of hinderlijk stof moet met doelmatige middelen worden bestreden.
      Doelmatige maatregelen moeten worden genomen om de arbeiders tegen de nadelige gevolgen van inademing van steen- of
      kolenstof te beschermen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel255
  - number: '255.2'
    text: |-
      Met het oog op de uitvoering van het eerste lid kan Onze Minister voor de concentratie van stof grenswaarden
      vaststellen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel255
  - number: '255.3'
    text: |-
      De concentratie en de samenstelling van steen- of kolenstof moeten bij alle ondergrondse werkpunten op doelmatig
      gekozen tijdstippen en volgens doelmatige methoden worden gemeten en daarna worden onderzocht.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel255
  - number: '255.4'
    text: |-
      De uitkomsten van het onderzoek en de omstandigheden waaronder het is verricht moeten op doelmatige wijze worden
      geregistreerd, verwerkt en bewaard.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel255
  - number: '255.5'
    text: |-
      Op elk mijnwerk moet tenminste één deskundig persoon worden belast met de leiding van de in het derde en het vierde
      lid bedoelde werkzaamheden en met de controle op de maatregelen, welke ingevolge het bij het eerste lid bepaalde
      zijn genomen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel255
  - number: '255.6'
    text: |-
      Elke in de ondergrondse werken werkzame persoon moet medewerken aan de uitvoering van de ingevolge het eerste lid
      genomen maatregelen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel255
  - number: '255.7'
    text: |-
      Onze Minister kan verlangen, dat aan de Inspecteur-Generaal der Mijnen periodiek een doelmatige opgave wordt gedaan
      van hetgeen ingevolge het bij het eerste, het derde en het vierde lid bepaalde is verricht, alsmede van de namen
      der ingevolge het vijfde lid aangewezen personen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel255
  - number: '256'
    text: |-
      Voor personen, die, ondanks de in artikel 236, eerste lid, bedoelde kleding en middelen, onvoldoende beschermd zijn
      tegen water, mag het ononderbroken verblijf in de ondergrondse werken, in de zin van artikel 282, niet langer duren
      dan 6 uur.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel256
  - number: '278.1'
    text: |-
      Eenmaal per kalenderweek moet aan de Inspecteur-Generaal der Mijnen opgave worden gedaan van de ongevallen, welke
      in de voorafgaande kalenderweek, in verband met de uitoefening van het bedrijf, aan personen zijn overkomen. Onze
      Minister stelt de vorm van de opgave vast.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel278
  - number: '278.2'
    text: |-
      Onverminderd het in het eerste lid bepaalde, moet, indien een ongeval de dood van een persoon of letsel, dat een
      persoon vermoedelijk gedurende omstreeks 8 weken of langer voor de arbeid ongeschikt doet zijn, ten gevolge heeft
      gehad, hiervan onverwijld worden kennis gegeven aan de Inspecteur-Generaal der Mijnen. In zodanig geval moet,
      voor zover dit zonder gevaar mogelijk is, alles ter plaatse in dezelfde toestand worden gelaten, totdat een bij of
      krachtens artikel 325, eerste lid, aangewezen ambtenaar toestemming tot opruiming heeft gegeven. Getuigen moeten
      ter beschikking worden gesteld op het door die ambtenaar bepaalde tijdstip.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel278
  - number: '278.3'
    text: |-
      Van alle bij het gebruik, het vervoer of de opslag van ontplofbare stoffen opgetreden voorvallen, die de veiligheid
      in gevaar hadden kunnen brengen of hebben gebracht, moet onverwijld worden kennis gegeven aan de Inspecteur-
      Generaal der Mijnen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel278
  - number: '278.4'
    text: |-
      Onze Minister kan verlangen, dat aan de Inspecteur-Generaal der Mijnen opgave wordt gedaan van andere dan in de
      voorgaande leden bedoelde ongevallen en voorvallen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel278
  - number: 278a
    text: |-
      Wanneer de veiligheid en de gezondheid van de arbeiders dat vereisen, moeten verzamelpunten worden vastgesteld,
      moet een verlaatrol worden bijgehouden en moeten de hiervoor noodzakelijke maatregelen worden getroffen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel278a
  - number: '279.1'
    text: |-
      Op de bovengrondse werken, zomede op boorwerken moeten op geschikte en gemakkelijk bereikbare plaatsen aanwezig
      zijn:
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel279
  - number: 279.1.a
    text: |-
      een voldoende aantal doelmatige, voor onmiddellijk gebruik gereed zijnde en in voldoend gereinigde toestand
      verkerende toestellen, die het mogelijk maken door te dringen in een atmosfeer, waarin verstikkende of giftige
      gassen aanwezig zijn of in een met radioactieve stof besmette atmosfeer;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel279
  - number: 279.1.b
    text: |-
      een voldoende hoeveelheid doelmatig, voor onmiddellijk gebruik gereed zijnd en in voldoend gereinigde toestand
      verkerend ander materieel, nodig voor het ondergronds en bovengronds uitvoeren van reddingswerk;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel279
  - number: 279.1.c
    text: |-
      een voldoende aantal voor onmiddellijk gebruik gereed zijnde doelmatige reddingmiddelen om de mijnbouwinstallatie
      of het boorwerk zo nodig onverwijld en op veilige wijze te kunnen verlaten;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel279
  - number: 279.1.d
    text: |-
      een of meer doelmatig samengestelde groepen van in het gebruik van reddingsmiddelen als onder *a*, *b* en *c*
      bedoeld voldoend geoefende personen;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel279
  - number: 279.1.e
    text: een doelmatig register van die personen en van de door hen gehouden oefeningen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel279
  - number: '279.2'
    text: |-
      Wanneer evacuatie moet geschieden langs moeilijke vluchtwegen of via plaatsen waar de lucht niet of mogelijk niet
      ingeademd kan worden, moet zelfreddingsapparatuur voor onmiddellijk gebruik op de werkplek ter beschikking van de
      arbeiders staan.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel279
  - number: '279.3'
    text: |-
      Tot het houden van oefeningen moet een doelmatige ruimte beschikbaar zijn, die met rook en verstikkende gassen kan
      worden gevuld.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel279
  - number: '279.4'
    text: |-
      Aan de Inspecteur-Generaal der Mijnen dient jaarlijks een op het volgende kalenderjaar betrekking hebbend doelmatig
      reddingsplan voor alle tot de betrokken mijnonderneming behorende mijn- of boorwerken te worden toegezonden; het
      moet tenminste 14 dagen vóór de aanvang van het betrokken kalenderjaar in zijn bezit zijn.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel279
  - number: '279.5'
    text: |-
      In geval in de loop van enig kalenderjaar met de aanleg van een mijn- of boorwerk wordt begonnen, dient tijdig
      tevoren een op dat jaar en dat werk betrekking hebbend doelmatig reddingsplan aan de Inspecteur-Generaal der Mijnen
      te worden toegezonden.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel279
  - number: '279.6'
    text: |-
      Onze Minister bepaalt, welke gegevens in een reddingsplan moeten zijn vermeld. Het reddingsplan dat betrekking
      heeft op een mijnbouwinstallatie moet een noodplan omvatten voor gevallen waarin iemand overboord valt of de
      arbeidsplaats moet worden geëvacueerd. Het noodplan, dat moet zijn gebaseerd op het in artikel 14*f* bedoelde
      veiligheids- en gezondheidsdocument, moet voorzien in het gebruik van bijstandsboten (standby vessels) en
      helikopters en moet criteria bevatten voor de capaciteit en de reactietijd daarvan. De vereiste reactietijd moet in
      het veiligheids- en gezondheidsdocument van elke installatie zijn vermeld.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel279
  - number: '279.7'
    text: |-
      Onze Minister kan voor een door hem aangewezen mijn- of boorwerk van het in het eerste en het tweede lid bepaalde
      ontheffing verlenen; hij kan daarbij goedkeuren, dat bepaalde mijnondernemingen voor de uitvoering van het in die
      leden bepaalde een gemeenschappelijke reddingsdienst vormen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel279
  - number: 279a.1
    text: |-
      Op een mijnbouwinstallatie moet voor elk veilig verzamelpunt een lijst worden opgesteld, bijgehouden en ter plaatse
      worden aangeplakt met de namen van de arbeiders voor wie dat verzamelpunt is bestemd.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel279a
  - number: 279a.2
    text: |-
      Een lijst met de namen van de arbeiders die in geval van nood speciale taken hebben moet worden opgesteld en
      bijgehouden en moet op doelmatige plaatsen worden aangeplakt. De namen van deze arbeiders moeten eveneens worden
      vermeld in de schriftelijke instructies, bedoeld in artikel 8, vierde lid.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel279a
  - number: 279b
    text: |-
      De in artikel 279, zesde lid, bedoelde bijstandsboten moeten doelmatig zijn ontworpen en uitgerust en moeten
      voldoen aan de eisen in verband met evacuatie en redding.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel279b
  - number: '280.1'
    text: |-
      Werkzaamheden in een atmosfeer, waarin verstikkende of giftige gassen aanwezig zijn, of in een met radioactieve
      stof besmette atmosfeer mogen slechts worden verricht door terzake voldoend ervaren personen, die met toestellen
      als in artikel 279, eerste lid, bedoeld zijn uitgerust.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel280
  - number: '280.2'
    text: |-
      Bij het inzetten van een reddingsploeg moet een voldoend toegeruste vervangingsploeg gereed staan dan wel
      onmiddellijk daarna gereed gesteld worden.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel280
  - number: '280.3'
    text: |-
      Voldoende maatregelen moeten worden genomen ter verzekering van de veiligheid en de gezondheid van de met
      reddingswerkzaamheden belaste personen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel280
  - number: '281.1'
    text: |-
      Er moeten een of meer eerste-hulpposten worden ingericht overeenkomstig de omvang van het mijn- of boorwerk of van
      de installatie en de aard van de uitgevoerde werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel281
  - number: '281.2'
    text: |-
      De eerste-hulpposten moeten zijn voorzien van de nodige uitrusting, installaties en geneesmiddelen, en moeten
      gemakkelijk met draagbaren kunnen worden betreden. In deze ruimten moeten duidelijk zichtbare instructies voor
      eerste hulp bij ongevallen worden aangeplakt.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel281
  - number: '281.3'
    text: |-
      Op alle plaatsen waar de werkomstandigheden dat vereisen moet eerste-hulpmateriaal aanwezig zijn. Dit materiaal
      moet duidelijk gesignaleerd, en gemakkelijk bereikbaar zijn.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel281
  - number: '281.4'
    text: |-
      Er moet een voldoende aantal gespecialiseerde arbeiders aanwezig zijn om in alle omstandigheden eerste hulp te
      kunnen verlenen of in voorkomend geval een medische handeling uit te voeren onder de leiding van een arts die
      al dan niet lijfelijk aanwezig kan zijn. Deze arbeiders moeten worden getraind in het gebruik van de aanwezige
      eerstehulpuitrusting.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel281
  - number: '282.1'
    text: |-
      Voor de toepassing van het bij of krachtens dit hoofdstuk bepaalde wordt verstaan onder: *arbeiders:* mannelijke
      en vrouwelijke personen, die, al of niet geregeld, arbeid verrichten; zwangere vrouw: de vrouwelijke arbeider die
      zwanger is en de desbetreffende mijnonderneming of in artikel 12, eerste lid, bedoelde andere onderneming hiervan
      in kennis heeft gesteld; vrouw tijdens de lactatie: de vrouwelijke arbeider die haar kind borstvoeding geeft en de
      desbetreffende mijnonderneming of in artikel 12, eerste lid, bedoelde andere onderneming hiervan in kennis heeft
      gesteld; *verblijf in de ondergrondse werken:* een verblijf in de ondergrondse werken in verband met de arbeid.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel282
  - number: '282.2'
    text: |-
      Voor de toepassing van het bij of krachtens dit hoofdstuk bepaalde wordt als woonachtig in het buitenland beschouwd
      degene die niet ingevolge het bij en krachtens de [Wet gemeentelijke basisadministratie persoonsgegevens][ref1]
      bepaalde als ingezetene in een basisadministratie persoonsgegevens behoort te zijn ingeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0006723
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel282
    references:
      - id: ref1
        bwb_id: BWBR0006723
  - number: '290.1'
    text: 'Een arbeider beneden 18 jaar mag geen arbeid verrichten:'
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel290
  - number: 290.1.a
    text: |-
      waarbij hij ingevolge artikel 236, tweede lid, in verband met het gevaar, dat een schadelijke stof in het organisme
      wordt opgenomen, verplicht zou zijn tot het dragen en gebruiken van beschermende kleding en middelen;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel290
  - number: 290.1.b
    text: |-
      waarbij het gevaar bestaat, dat een schadelijke stof bij verwaarlozing van de persoonlijke hygiëne via de mond in
      het organisme wordt opgenomen;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel290
  - number: 290.1.c
    text: |-
      waarbij de installatie, die gebruikt, of de werkwijze, die gevolgd moet worden, zodanig is dat gemakkelijk een
      onjuiste handeling kan worden verricht, die verspreiding van een schadelijke stof teweegbrengt in een mate, dat
      onmiddellijk gevaar voor het leven of de gezondheid ontstaat;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel290
  - number: 290.1.d
    text: |-
      waarbij gevaar bestaat van verspreiding van benzeen of van een stof, welke op de lichaamscellen een soortgelijke
      uitwerking heeft als ioniserende stralen;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel290
  - number: 290.1.e
    text: |-
      waarbij het gevaar bestaat, dat hij in aanraking komt met stoffen, die door hun chemische of fysische werking een
      acute beschadiging van de huid of de ogen veroorzaken, ook indien deswege het bij of krachtens artikel 236 bepaalde
      ten aanzien van hem geldt;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel290
  - number: 290.1.f
    text: |-
      waarbij het gevaar bestaat, dat hij op schadelijke wijze wordt blootgesteld aan stoffen die erfelijke genetische
      veranderingen veroorzaken, stoffen die tijdens de zwangerschap schadelijke gevolgen hebben voor de foetus of die
      voor de mens anderszins schadelijke chronische werking hebben;.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel290
  - number: 290.1.g
    text: |-
      waarbij kennelijk of naar door Onze Minister is verklaard, het gevaar bestaat, dat een schadelijke stof in zodanige
      mate in het organisme wordt opgenomen, dat een nadelige invloed op de gezondheid is te duchten.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel290
  - number: '290.2'
    text: |-
      Het in het eerste lid bepaalde geldt niet, indien een daar bedoelde stof een bestrijdingsmiddel is in de zin van de
      [Bestrijdingsmiddelenwet 1962][ref1] (*Stb.* 288).


      [ref1]: https://wetten.overheid.nl/BWBR0002380
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel290
    references:
      - id: ref1
        bwb_id: BWBR0002380
  - number: 290a.1
    text: 'Een arbeider beneden 18 jaar mag geen arbeid verrichten:'
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel290a
  - number: 290a.1.a
    text: |-
      in de ondergrondse werken, voor zover de arbeid bestaat in werkzaamheden, aangewezen krachtens artikel 229, tweede
      lid, onder *b*;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel290a
  - number: 290a.1.b
    text: |-
      bestaande in door Onze Minister nader aangegeven werkzaamheden, waarbij het geluidsniveau in de gehoorgang zodanig
      is, dat er gevaar bestaat voor schade aan het gehoororgaan;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel290a
  - number: 290a.1.c
    text: |-
      met of aan gereedschappen of werktuigen, door welke zodanige trillingen op lichaamsorganen of orgaansystemen worden
      overgebracht, dat gevaar bestaat dat deze worden beschadigd;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel290a
  - number: 290a.1.d
    text: die wegens extreme koude of hitte de gezondheid in gevaar brengt.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel290a
  - number: 290a.2
    text: |-
      Onze Minister kan gereedschappen of werktuigen aanwijzen, welke in ieder geval worden beschouwd als gereedschappen
      of werktuigen, bedoeld in het eerste lid, onder *c*.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel290a
  - number: 290b
    text: 'Een arbeider beneden 18 jaar mag geen arbeid verrichten:'
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel290b
  - number: 290b.a
    text: |-
      welke meebrengt, dat hij veelvuldig zware lasten moet heffen of dragen, of dat hij gedurende langere tijd achtereen
      ongunstige werkhoudingen moet aannemen;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel290b
  - number: 290b.b
    text: |-
      welke door de daarbij gevergde inspanning tot een belastingsgraad leidt, die ten aanzien van hem onaanvaardbaar is
      te achten;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel290b
  - number: 290b.c
    text: |-
      bestaande in machinegebonden werkzaamheden, waaronder begrepen werkzaamheden aan de lopende band, waarbij hij
      regelmatig terugkerende handelingen moet verrichten op tijdstippen, welke door de machine zodanig worden bepaald,
      dat kennelijk of naar door Onze Minister is verklaard, de binding van de arbeider aan het arbeidsproces schadelijk
      is voor zijn gezondheid of lichamelijke ontwikkeling.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel290b
  - number: 290c.1
    text: 'Een arbeider beneden 18 jaar mag geen arbeid verrichten:'
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel290c
  - number: 290c.1.a
    text: |-
      aan of in de nabijheid van een machine of een werktuig, waarvan de bewegende delen gevaar opleveren, tenzij een
      doeltreffende beveiliging is aangebracht, waarvan de werking geheel onafhankelijk is van degene, die de machine of
      het werktuig bedient;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel290c
  - number: 290c.1.b
    text: |-
      aan of met een machine of een werktuig, waarvan de werking, ook indien de vereiste beveiliging daarop aanwezig is,
      bijzonder gevaar oplevert, een en ander als door Onze Minister nader omschreven;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel290c
  - number: 290c.1.c
    text: |-
      bestaande in het aanzetten van machines of werktuigen, welke bij het in beweging komen gevaar voor anderen
      opleveren;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel290c
  - number: 290c.1.d
    text: |-
      bestaande in het bedienen van hijskranen, goederenbouwliften, stapelaars, motorisch aangedreven takels, of andere
      door Onze Minister aangewezen hijs- of hefwerktuigen, het geven van signalen aan hen, die zodanige werktuigen
      bedienen, dan wel in het aanslaan of losmaken van lasten;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel290c
  - number: 290c.1.e
    text: bestaande in het bedienen van heftrucks of mechanische schoppen;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel290c
  - number: 290c.1.f
    text: |-
      bestaande in het bedienen van wissels, dan wel het rangeren, voortduwen, voorttrekken, aankoppelen of afkoppelen
      van spoorwegmaterieel;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel290c
  - number: 290c.1.g
    text: bestaande in het aan- of afkoppelen van aanhangwagens of werktuigen;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel290c
  - number: 290c.1.h
    text: waarbij gevaar bestaat voor een val, die ernstig letsel of verdrinking met zich kan brengen;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel290c
  - number: 290c.1.i
    text: bij het heien of het opstellen, verplaatsen, verstellen of strijken van een heistelling;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel290c
  - number: 290c.1.j
    text: |-
      bestaande in sloopwerkzaamheden, waarbij gevaar bestaat ernstig gewond te worden door vallend, verschuivend of
      wegspringend materiaal;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel290c
  - number: 290c.1.k
    text: waarbij gevaar bestaat te worden bedolven;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel290c
  - number: 290c.1.l
    text: |-
      bestaande in het aanbrengen of verwijderen van stutten, stempels of ander ondersteuningsmateriaal, dan wel het
      daaraan verrichten van herstel- of onderhoudswerkzaamheden;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel290c
  - number: 290c.1.m
    text: bestaande in het besturen of bedienen van grondverzetmachines of in het besturen van trekkers;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel290c
  - number: 290c.1.n
    text: |-
      bestaande in het vellen van bomen van zodanige afmetingen, dat bij de val daarvan op een persoon gevaar bestaat
      voor ernstig letsel;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel290c
  - number: 290c.1.o
    text: |-
      bestaande in het laden, lossen of verplaatsen van zware bomen, buizen, balken, heipalen, bouwsegmenten of andere
      omvangrijke en zware lasten, dan wel in het hierbij behulpzaam zijn, indien het gevaar bestaat, dat de last daarbij
      losschiet, gaat glijden of rollen of andere niet onder controle te houden bewegingen gaat maken;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel290c
  - number: 290c.1.p
    text: |-
      in een ruimte als bedoeld in artikel 155, eerste lid, indien door de beslotenheid van die ruimte het uitoefenen van
      toezicht of het verlenen van hulp bij ongevallen ernstig wordt bemoeilijkt.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel290c
  - number: 290c.2
    text: |-
      Onze Minister kan werkzaamheden aanwijzen, welke in ieder geval worden beschouwd als arbeid, bedoeld in het eerste
      lid, onder h.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel290c
  - number: 290d.1
    text: |-
      Een arbeider beneden 18 jaar mag geen arbeid verrichten met, aan of in de nabijheid van een elektrische installatie
      met ongeïsoleerde onderdelen, waarop een wisselspanning van meer dan 42 volt of een gelijkspanning van meer dan 110
      volt staat of waarbij gevaar bestaat voor het optreden van zodanige spanning.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel290d
  - number: 290d.2
    text: 'Het eerste lid geldt niet, indien:'
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel290d
  - number: 290d.2.a
    text: de ongeïsoleerde onderdelen op deugdelijke wijze aan aanraking zijn onttrokken, of
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel290d
  - number: 290d.2.b
    text: aanraking van bedoelde onderdelen geen schadelijke gevolgen kan hebben.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel290d
  - number: 290d.3
    text: |-
      Apparatuur voor elektrisch lassen of snijden van metalen wordt niet beschouwd als een installatie, bedoeld in het
      eerste lid.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel290d
  - number: 290e
    text: 'Een arbeider beneden 18 jaar mag geen arbeid verrichten:'
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel290e
  - number: 290e.a
    text: |-
      aan of in de nabijheid van toestellen, leidingen, ketels of reservoirs, waarbij het gevaar bestaat, dat daarin een
      explosief mengsel aanwezig is;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel290e
  - number: 290e.b
    text: op of in de nabijheid van plaatsen, waar gevaar bestaat voor het ontstaan van een explosief mengsel;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel290e
  - number: 290e.c
    text: |-
      met of in de nabijheid van een stof, waarbij het gevaar bestaat, dat zij ten gevolge van, onder invloed van of bij
      warmte, wrijving, vuur, een vonk, een slag of een stoot plotseling een chemische reactie geeft, waarbij binnen zeer
      korte tijd grote hoeveelheden gas of warmte vrijkomen;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel290e
  - number: 290e.d
    text: |-
      met een stof, die bij aanraking met water brandgevaar oplevert of een gas ontwikkelt, dan wel die aan
      zelfontbranding onderhevig is;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel290e
  - number: 290e.e
    text: |-
      met een oxydatiemiddel of een organische peroxydverbinding, voor zover bij deze arbeid brand- of explosiegevaar
      aanwezig is;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel290e
  - number: 290e.f
    text: bij opslag, vervoer of gebruik van ontplofbare stoffen of ontstekingsmiddelen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel290e
  - number: 290f.1
    text: |-
      Een arbeider beneden 18 jaar mag geen arbeid verrichten, welke naar het oordeel van Onze Minister een uitgesproken
      negatieve invloed uitoefent op zijn ontwikkeling door:
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel290f
  - number: 290f.1.a
    text: de eenzijdigheid van de werkzaamheden,
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel290f
  - number: 290f.1.b
    text: een omstandigheid die visueel, door stank of anderszins weerzin opwekt,
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel290f
  - number: 290f.1.c
    text: |-
      een ongunstige omstandigheid met betrekking tot het binnenklimaat of de verlichting in de ruimte, waarin de arbeid
      wordt verricht,
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel290f
  - number: 290f.1.d
    text: de eenzaamheid, waarin de arbeid wordt verricht,
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel290f
  - number: 290f.1.e
    text: een niet passend groepsverband, of
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel290f
  - number: 290f.1.f
    text: de aard van het beloningssysteem.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel290f
  - number: 290f.2
    text: |-
      Een arbeider beneden 18 jaar mag geen arbeid verrichten op een mijnbouwinstallatie, tenzij hij de voor hem geldende
      rusttijden op de vaste wal kan doorbrengen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel290f
  - number: 290g
    text: |-
      De bij de artikelen 290, eerste lid, 290*a*, eerste lid, 290*b*, 290*c*, eerste lid, 290*d*, eerste lid, en 290*e*
      gestelde verboden gelden niet voor arbeid, die voor een arbeider beneden 18 jaar volstrekt noodzakelijk is in het
      kader van een bij of krachtens een wet geregelde beroepsopleiding, dan wel een voor de toepassing van dit artikel
      door Onze Minister daarmee gelijkgestelde beroepsopleiding, indien daarbij in voldoende mate deskundig toezicht
      wordt uitgeoefend door de in artikel 9*c*, eerste lid, bedoelde arbeiders of de in artikel 9*c*, derde lid,
      bedoelde deskundigen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel290g
  - number: 291a.1
    text: |-
      Voor alle werkzaamheden, waarbij zich een specifiek risico kan voordoen van blootstelling aan de agentia, procédés
      of arbeidsomstandigheden als bedoeld in bijlage I van de [richtlijn nr. 92/85/EEG](31992L0085) van de Raad van
      de Europese Gemeenschappen van 19 oktober 1992 inzake de tenuitvoerlegging van maatregelen ter bevordering van
      de verbetering van de veiligheid en de gezondheid op het werk van werkneemsters tijdens de zwangerschap, na de
      bevalling en tijdens de lactatie (*PbEG* L 348), moeten de aard, de mate en de duur van de blootstelling van
      zwangere vrouwen en vrouwen tijdens de lactatie worden geëvalueerd, ten einde:
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel291a
  - number: 291a.1.a
    text: |-
      ieder risico voor de veiligheid of de gezondheid, alsmede iedere verstoring van de zwangerschap of de lactatie van
      de betrokken vrouwen te kunnen beoordelen en
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel291a
  - number: 291a.1.b
    text: te kunnen vaststellen welke maatregelen moeten worden genomen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel291a
  - number: 291a.2
    text: |-
      Een wijziging van bijlage I van de in het eerste lid bedoelde richtlijn treedt voor de toepassing van dit artikel
      in werking met ingang van de dag waarop aan de betrokken wijziging uiterlijk uitvoering moet zijn gegeven.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel291a
  - number: 291a.3
    text: |-
      De door de Europese Commissie op basis van artikel 3, eerste lid, van de in het eerste lid bedoelde richtlijn
      vastgestelde richtsnoeren dienen als leidraad voor de evaluatie te worden gebruikt, zodra deze in de
      *Staatscourant* zijn gepubliceerd.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel291a
  - number: 291a.4
    text: |-
      De ondernemingsraad of, bij het ontbreken daarvan, de betrokken personen worden geïnformeerd over de resultaten van
      de in het eerste lid bedoelde evaluatie en over alle maatregelen op het gebied van de veiligheid en de gezondheid
      op het werk.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel291a
  - number: 291b.1
    text: |-
      Indien uit de resultaten van de in artikel 291*a*, eerste lid, bedoelde evaluatie een risico voor de veiligheid
      of de gezondheid of een verstoring van de zwangerschap of de lactatie van een zwangere vrouw of een vrouw
      tijdens de lactatie blijkt, moeten de nodige maatregelen worden genomen opdat door tijdelijke aanpassing van de
      arbeidsomstandigheden en/of werktijden van de betrokken vrouw de blootstelling van deze vrouw aan dit risico wordt
      vermeden.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel291b
  - number: 291b.2
    text: |-
      Indien nakoming van het eerste lid redelijkerwijs niet kan worden gevergd, worden de betrokken vrouw tijdelijk
      andere werkzaamheden gegeven.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel291b
  - number: 291b.3
    text: |-
      Indien nakoming van het tweede lid redelijkerwijs niet kan worden gevergd, wordt de betrokken vrouw tijdelijk
      vrijgesteld van het verrichten van arbeid.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel291b
  - number: 291c.1
    text: |-
      Een zwangere vrouw mag niet worden verplicht om werkzaamheden onder water of onder druk te verrichten. Artikel
      166*a* is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel291c
  - number: 291c.2
    text: |-
      Een zwangere vrouw mag niet worden verplicht werkzaamheden te verrichten met de biologische agentia toxoplasma en
      rubeolavirus, tenzij aangetoond kan worden dat zij door immunisatie voldoende tegen deze agentia is beschermd.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel291c
  - number: 291c.3
    text: |-
      Een zwangere vrouw en een vrouw tijdens de lactatie mogen niet worden verplicht werkzaamheden met lood en
      loodderivaten te verrichten, indien deze door het menselijk organisme kunnen worden opgenomen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel291c
  - number: 291c.4
    text: |-
      Onverminderd het bepaalde in de artikelen 298, 310, eerste lid, onder *c*, en 315 mogen een zwangere vrouw en een
      vrouw tijdens de lactatie niet worden verplicht werkzaamheden te verrichten tussen 23 uur en 6 uur.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel291c
  - number: 291c.5
    text: Artikel 291*b* is van overeenkomstige toepassing op de in het eerste, tweede en derde lid genoemde situaties.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel291c
  - number: 291d.1
    text: |-
      Aan een zwangere vrouw of een vrouw tijdens de lactatie moet behoorlijk gelegenheid worden gegeven om onder
      doelmatige omstandigheden in liggende positie te kunnen rusten.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel291d
  - number: 291d.2
    text: Aan een vrouw tijdens de lactatie moet behoorlijk gelegenheid worden gegeven haar kind te zogen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel291d
  - number: '311.1'
    text: |-
      Personen beneden 18 jaar mogen geen arbeid verrichten, behoudens dat personen van 16 jaar en ouder arbeid mogen
      verrichten in opleidingsverband, indien voor hen de leerplicht ingevolge § 2 van de [Leerplichtwet 1969][ref1]
      is geëindigd en ten aanzien van hen geen vrijstelling van de in § 2 van de [Leerplichtwet 1969][ref2] bedoelde
      verplichting, verleend op grond van artikel 5 of 15 van die wet, geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0002628
      [ref2]: https://wetten.overheid.nl/BWBR0002628
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel311
    references:
      - id: ref1
        bwb_id: BWBR0002628
      - id: ref2
        bwb_id: BWBR0002628
  - number: '311.2'
    text: |-
      Een zwangere vrouw mag niet worden verplicht werkzaamheden in ondergrondse mijnen te verrichten. Artikel 291*b* is
      van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel311
  - number: '312'
    text: 'Houwersarbeid mag zelfstandig slechts worden verricht door een arbeider, die:'
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel312
  - number: 312.a
    text: de leeftijd van 21 jaar heeft bereikt, en
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel312
  - number: 312.b
    text: tenminste 3 jaar in mijnen ondergronds werkzaam is geweest, waarvan tenminste 1 jaar als hulphouwer.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel312
  - number: '313.1'
    text: |-
      Een onervaren arbeider mag arbeid, die voor hem uit hoofde van zijn onervarenheid gevaren medebrengt, niet
      verrichten, zonder dat doelmatige voorzorgsmaatregelen voor zijn beveiliging tegen die gevaren zijn genomen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel313
  - number: '313.2'
    text: |-
      Hij mag alleen onder voldoend ervaren geleide in de ondergrondse werken afdalen, zich naar de plaats van zijn
      arbeid begeven en vandaar terugkeren.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel313
  - number: '315'
    text: Een arbeider beneden 18 jaar mag niet in de ondergrondse werken verblijven tussen 22 en 6 uur.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel315
  - number: '316.1'
    text: |-
      Een arbeider mag niet langer dan 8 uur ononderbroken en niet langer dan 46 uur per kalenderweek in de ondergrondse
      werken verblijven.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel316
  - number: '316.2'
    text: |-
      Het in artikel 283, eerste lid, bedoelde verblijf op zondag in de ondergrondse werken van een in nachtdienst
      werkzame arbeider wordt voor de berekening van het totaal van de verblijftijd geacht te behoren tot de verblijftijd
      van de voorafgaande kalenderweek.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel316
  - number: '316.3'
    text: |-
      Voor de toepassing van het eerste lid wordt voor schachtseingevers, alsmede voor machinisten en seingevers van door
      Onze Minister aangewezen tussenschachten, de voor hun aflossing nodige tijd niet medegerekend.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel316
  - number: '316.4'
    text: |-
      Onze Minister kan vergunning verlenen de verblijftijd van bepaalde categorieën van arbeiders te verlengen met de
      tijd, nodig voor het beëindigen van hun werkzaamheden, voor zover dit onontbeerlijk voor de geregelde gang van
      zaken in de ondergrondse werken is, en voor zover deze werkzaamheden in verband met de aard daarvan niet gedurende
      de normale verblijftijd kunnen worden verricht.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel316
  - number: '317.1'
    text: |-
      Een arbeider wordt geacht in de ondergrondse werken te verblijven telkens van het tijdstip, waarop hij wordt
      neergelaten tot dat, waarop hij wordt opgehaald, behoudens het in het tweede lid bepaalde.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel317
  - number: '317.2'
    text: |-
      Een arbeider, behorende tot een ploeg, wordt geacht in de ondergrondse werken te verblijven telkens van het begin
      van het neerlaten van de ploeg tot het begin van het ophalen daarvan.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel317
  - number: '317.3'
    text: |-
      Arbeiders, behorende tot een ploeg, moeten zoveel mogelijk in dezelfde volgorde worden opgehaald als waarin zij
      zijn neergelaten.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel317
  - number: '317.4'
    text: |-
      Het ophalen van een ploeg mag slechts, indien daarvoor dringende redenen aanwezig zijn, langer duren dan het
      neerlaten, doch in geen geval meer dan 15 minuten langer.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel317
  - number: '320'
    text: |-
      Aan een arbeider, die langer dan 5 uur ononderbroken in de ondergrondse werken verblijft, moet voldoende
      gelegenheid tot persoonlijke verzorging worden gegeven.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel320
  - number: '322.1'
    text: |-
      Mijnbouwkundige onderzoekingen, anders dan door middel van een boorwerk, mogen slechts op veilige wijze worden
      verricht.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel322
  - number: '322.2'
    text: |-
      Tenminste twee weken voordat onderzoekingen als in het eerste lid bedoeld worden aangevangen, moet aan de
      Inspecteur-Generaal der Mijnen schriftelijk mededeling zijn gedaan van de volgende gegevens:
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel322
  - number: 322.2.a
    text: het doel en de wijze van onderzoek;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel322
  - number: 322.2.b
    text: het gebied, waarin en de lijnen, waarlangs de waarnemingen zullen worden verricht;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel322
  - number: 322.2.c
    text: de tijdruimte, waarin de werkzaamheden zullen worden verricht;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel322
  - number: 322.2.d
    text: |-
      naam, voornamen, beroep en woonplaats van de leider der werkzaamheden en, indien ontplofbare stoffen worden
      gebruikt, van de verantwoordelijke schietmeester.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel322
  - number: '322.3'
    text: |-
      De in het tweede lid bedoelde mededeling moet vergezeld gaan van een kaart of schetstekening, waarop het in dat
      lid, onder *b*, bedoelde gebied, zomede de daarbedoelde lijnen zijn aangegeven.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel322
  - number: '322.4'
    text: |-
      Ten aanzien van het in het tweede lid onder *d* bepaalde is artikel 27, eerste lid, laatste volzin, van
      overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel322
  - number: '322.5'
    text: |-
      Van wijzigingen in de in het tweede lid bedoelde gegevens moet onverwijld schriftelijk mededeling worden gedaan aan
      de Inspecteur-Generaal der Mijnen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel322
  - number: 322a.1
    text: |-
      Van het verloop van mijnbouwkundige onderzoekingen als bedoeld in artikel 322, eerste lid, moet wekelijks een
      rapport worden opgemaakt. Het rapport moet voldoende gegevens bevatten ten einde het verloop van de mijnbouwkundige
      onderzoekingen te kunnen volgen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel322a
  - number: 322a.2
    text: |-
      Binnen zeven dagen na de afsluiting van ieder weekrapport moet een afschrift daarvan worden toegezonden aan de
      Inspecteur-Generaal der Mijnen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel322a
  - number: '323'
    text: |-
      Op mijnbouwkundige onderzoekingen als bedoeld in artikel 322, eerste lid, zijn de artikelen 18, 145, 156, 158,
      derde lid, en 179 van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel323
  - number: 323a.1
    text: |-
      De in artikel 322, tweede lid, bedoelde mededeling dient, indien de mijnbouwkundige onderzoekingen in een
      oppervlaktewater zullen worden verricht, tevens de volgende gegevens bevatten:
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel323a
  - number: 323a.1.a
    text: |-
      indien de onderzoekingen met gebruikmaking van vaartuigen zullen worden verricht, de namen, nationaliteit en
      registratiekenmerken van die vaartuigen;
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel323a
  - number: 323a.1.b
    text: |-
      indien de onderzoekingen met gebruikmaking van luchtvaartuigen zullen worden verricht, de aard en de
      nationaliteits- en registratiekenmerken van die luchtvaartuigen, zomede de plaatsen, waar zij zullen worden
      gestationeerd en vanwaar de vluchten zullen worden ondernomen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel323a
  - number: 323a.2
    text: Artikel 322, vijfde lid, is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel323a
  - number: 323b.1
    text: |-
      Bij mijnbouwkundige onderzoekingen in een oppervlaktewater, anders dan door middel van een boorwerk, gebruikte
      vaartuigen en luchtvaartuigen moeten zijn voorzien van doelmatige communicatiemiddelen, waarmede onder alle
      omstandigheden verbinding tussen die vaartuigen en luchtvaartuigen onderling mogelijk is.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel323b
  - number: 323b.2
    text: |-
      Aan boord van elk der bij de onderzoekingen betrokken vaartuigen of luchtvaartuigen dienen de in het eerste
      lid bedoelde communicatiemiddelen zodanig te zijn ingericht of zodanig te worden gebruikt, dat de andere bij
      de onderzoekingen betrokken vaartuigen of luchtvaartuigen tijdens de duur van de werkzaamheden onverwijld een
      verbinding met dat vaartuig of luchtvaartuig tot stand kunnen brengen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel323b
  - number: '324.1'
    text: Er is een Staatstoezicht op de Mijnen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel324
  - number: '324.2'
    text: Aan het hoofd daarvan staat de Inspecteur-Generaal der Mijnen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel324
  - number: '324.3'
    text: Onze Minister kan aan de Inspecteur-Generaal der Mijnen adviseurs toevoegen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel324
  - number: '324.4'
    text: Onze Minister wijst een plaatsvervanger van de Inspecteur-Generaal der Mijnen aan.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel324
  - number: '325.1'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens de [Mijnwet 1903][ref1] zijn belast de
      Inspecteur-Generaal der Mijnen en de andere bij besluit van Onze Minister op voorstel van de Inspecteur-Generaal
      der Mijnen aangewezen ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0001870
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel325
    references:
      - id: ref1
        bwb_id: BWBR0001870
  - number: '325.2'
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel325
  - number: '326.1'
    text: |-
      Alvorens hun ambt te aanvaarden, leggen de Inspecteur-Generaal der Mijnen in handen van Onze Minister, en de
      krachtens artikel 325, eerste lid, aangewezen ambtenaren in handen van de Inspecteur-Generaal der Mijnen, de eed
      of de belofte af, inhoudende, dat zij ijverig, nauwgezet en onpartijdig de plichten zullen nakomen, welke hun ambt
      medebrengt.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel326
  - number: '326.2'
    text: |-
      De in het eerste lid bedoelde ambtenaren nemen middellijk noch onmiddellijk deel in een onderneming, waartoe een
      mijn- of een boorwerk in Nederland behoort of die in Nederland mijnbouwkundige onderzoekingen verricht.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel326
  - number: '327'
    text: |-
      Met de opsporing van overtredingen van de bij of krachtens de [Mijnwet 1903][ref1] gestelde voorschriften en
      voorwaarden en van artikel 5 der wet van 21 april 1810 (*Bulletin des Lois* no. 285) zijn belast de bij en
      krachtens artikel 325, eerste lid, aangewezen ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0001870
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel327
    references:
      - id: ref1
        bwb_id: BWBR0001870
  - number: '328'
    text: |-
      Het is verboden aan de in artikel 324, derde lid, bedoelde adviseurs de toegang tot de in
      [artikel 12, eerste lid, van de Mijnwet 1903][ref1] genoemde werken en inrichtingen of het gebruik van de daarin
      bedoelde toestellen te weigeren.


      [ref1]: https://wetten.overheid.nl/BWBR0001870#Artikel12
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel328
    references:
      - id: ref1
        bwb_id: BWBR0001870
        artikel: '12'
  - number: '329.1'
    text: |-
      De bestuurders van een mijnonderneming of, in artikel 12, eerste lid, bedoelde, andere onderneming zijn verplicht
      aan de in artikel 324, derde lid, bedoelde adviseurs desgevraagd en zo nodig ter plaatse alle inlichtingen te
      verstrekken, die dezen naar hun redelijk oordeel voor de vervulling van hun taak behoeven.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel329
  - number: '329.2'
    text: Gelijke verplichting rust op personen in dienst van een onderneming als in het eerste lid bedoeld.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel329
  - number: '329.3'
    text: |-
      De bestuurders van een mijnonderneming zijn verplicht de maatregelen te nemen, die de bij en krachtens artikel
      325, eerste lid, aangewezen ambtenaren in het belang van het onderzoek bij ongevallen noodzakelijk achten. Zij
      kunnen zich daaromtrent tot Onze Minister wenden, die de beslissing van de ambtenaar onverwijld bevestigt, wijzigt
      of intrekt.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel329
  - number: '331'
    text: |-
      Onze Minister stelt voor de Inspecteur-Generaal der Mijnen, zomede voor de krachtens artikel 325, eerste lid,
      aangewezen ambtenaren instructies vast.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel331
  - number: '355'
    text: Het Mijnreglement 1939 (*Stb.* 568) en het Electrotechnisch Mijnreglement 1947 (*Stb.* H 152) worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel355
  - number: '356.1'
    text: |-
      Alle ingevolge het Mijnreglement 1939 en het Electrotechnisch Mijnreglement 1947 gestelde regelen, verleende
      vergunningen en ontheffingen, gestelde voorwaarden en gegeven andere beslissingen, welke niet voor het
      inwerkingtreden van het onderhavige besluit zijn ingetrokken of vervallen, worden, behoudens voor zover de
      handhaving onverenigbaar is met de bepalingen van dat besluit, geacht ingevolge dat besluit te zijn gesteld,
      verleend of gegeven.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel356
  - number: '356.2'
    text: |-
      Voor zover de handhaving van ingevolge het Mijnreglement 1939 of het Electrotechnisch Mijnreglement 1947 gestelde
      regelen, verleende vergunningen en ontheffingen, gestelde voorwaarden en gegeven andere beslissingen onverenigbaar
      is met de bepalingen van het onderhavige besluit, blijven daarop de bepalingen van die reglementen van toepassing
      tot een door Onze Minister te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel356
  - number: '358'
    text: |-
      Dit besluit kan worden aangehaald onder de titel Mijnreglement, met vermelding van het jaar, waarin het is tot
      stand gekomen.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel358
  - number: '359'
    text: |-
      Dit besluit treedt in werking met ingang van de tweede dag na de datum van uitgifte van het *Staatsblad*, waarin
      het wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0002474/2002-01-01#Artikel359
