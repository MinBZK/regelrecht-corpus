  - number: '4.21'
    text: |-
      1 Een saneringsprogramma als bedoeld in [artikel 4.18][ref1] bevat:

      a. de resultaten van het akoestisch onderzoek dat is voorafgegaan aan de melding, bedoeld in
      [artikel 4.18, eerste lid][ref2], of van het akoestisch onderzoek, bedoeld in artikel 4.18, tweede lid;

      b. een of meer kaarten met bijbehorende verklaring als bedoeld in het tweede lid, een lijst met adressen van de
      betrokken woningen en andere geluidsgevoelige gebouwen, alsmede het trajectnummer van het spoorweggedeelte of de
      combinatie van spoorweggedeelten, waarvan de geluidsbelasting wordt ondervonden;

      c. een beschrijving van de maatregelen, bedoeld in [artikel 4.19, eerste lid, onder a en b][ref3], die in
      aanmerking komen, en van het effect van de maatregelen op de geluidsbelasting in het maatgevende jaar, vanwege de
      spoorweg, van de gevel van betrokken woningen en andere geluidsgevoelige gebouwen;

      d. voor zover toepassing van de in [artikel 4.19, eerste lid, onder a en b][ref4], bedoelde – in het
      saneringsprogramma opgenomen – maatregelen niet leidt tot beperking van de geluidsbelasting, vanwege de spoorweg,
      tot 55 dB, een beschrijving van de bezwaren van stedenbouwkundige, verkeerskundige, landschappelijke of financiële
      aard tegen de toepassing van verdergaande maatregelen;

      e. zo nodig een verklaring dat door middel van geluidwerende maatregelen als bedoeld in
      [artikel 4.19, eerste lid, onder c][ref5], zal worden voldaan aan [artikel 4.25][ref6];

      f. voor zover van toepassing, een beschrijving van de maatregelen, bedoeld in
      [artikel 4.19, eerste lid, onder d][ref7], alsmede een onderbouwing van de keuze;

      g. voor zover met toepassing van [artikel 4.19, tweede lid][ref8], naar het oordeel van burgemeester en wethouders
      of de spoorwegexploitant andere dan meer primaire maatregelen in aanmerking komen, een beschrijving van de redenen
      daarvoor;

      h. een beschrijving van de mogelijkheden om uit een oogpunt van doelmatigheid en kostenbeheersing de te treffen
      maatregelen al dan niet gezamenlijk uit te voeren met andere werken;

      i. een globale indicatie van de geluidsbelasting, vanwege andere geluidsbronnen als bedoeld in de
      [artikelen 40][ref9], [52][ref10], [74][ref11] en [108 van de wet][ref12] en [artikel 1.4a][ref13] of vanwege het
      luchthavenluchtverkeer, bedoeld in [artikel 1.1 van de Wet luchtvaart][ref14];

      j. een globale indicatie van de kosten van de te treffen maatregelen;

      k. het tijdstip waarop met de uitvoering van de maatregelen kan worden begonnen, alsmede de verwachte duur van de
      uitvoering van de maatregelen.

      2 De kaart of kaarten, bedoeld in het eerste lid, onder b, geven in elk geval aan:

      a. de zone, bedoeld in [artikel 1.4][ref15], langs de spoorweg of spoorwegen en de ligging van de betrokken
      woningen en andere geluidsgevoelige gebouwen;

      b. bronmaatregelen of overdrachtsmaatregelen, en

      c. voor zover hiervan sprake is, de ligging van de betrokken woningen en andere geluidsgevoelige gebouwen binnen:

      1°. een geluidszone rond een industrieterrein;

      2°. een geluidszone langs een weg;

      3°. een andere geluidszone, of

      4°. een met het oog op de geluidsbelasting vastgesteld beperkingengebied als bedoeld in
      [hoofdstuk 8, titel 8A.6][ref16] of [artikel 10.17 van de Wet luchtvaart][ref17].

      3 [Artikel 3.8, vierde lid][ref18], is van overeenkomstige toepassing.


