        bwb_id: BWBR0004739
        artikel: '13'
  - number: 4.24.4
    text: |-
      Indien met toepassing van de [artikelen 4.11][ref1] of [4.15][ref2] met betrekking tot een gevel van een in aanbouw
      zijnd of aanwezig ander geluidsgevoelig gebouw een hogere geluidsbelasting dan 53 dB als de ten hoogste toelaatbare
      is vastgesteld, treffen burgemeester en wethouders met betrekking tot de geluidwering van die gevel maatregelen om
      te bevorderen dat de geluidsbelasting, vanwege de spoorweg, bij gesloten ramen:


      [ref1]: https://wetten.overheid.nl/BWBR0020445#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020445#Artikel4
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel4.24
    references:
