      [80 van de wet][ref3], onderscheidenlijk in de [artikelen 4.3][ref4] of [4.5][ref5];


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel77
      [ref3]: https://wetten.overheid.nl/BWBR0003227#Artikel80
      [ref4]: https://wetten.overheid.nl/BWBR0020445#Artikel4
      [ref5]: https://wetten.overheid.nl/BWBR0020445#Artikel4
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel5.4
    references:
      - id: ref1
