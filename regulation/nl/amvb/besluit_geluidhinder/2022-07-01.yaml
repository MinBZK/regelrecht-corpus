  - number: '2.5'
    text: |-
      [Artikel 111b, eerste lid, aanhef en onder a, van de wet][ref1] is met betrekking tot andere geluidsgevoelige
      gebouwen van overeenkomstige toepassing, met dien verstande dat de met overeenkomstige toepassing van artikel 111b,
      eerste lid, aanhef en onder a, van de wet door burgemeester en wethouders te treffen maatregelen bevorderen, dat de
      geluidsbelasting, vanwege het industrieterrein,

      a. binnen de verblijfsruimten, genoemd in [artikel 1.1, eerste lid, onderdeel d, onder 1° tot en met 3°][ref2],
      35 dB(A) niet te boven zal gaan, en

      b. binnen de verblijfsruimten, genoemd in [artikel 1.1, eerste lid, onderdeel d, onder 4° en 5°][ref3], 40 dB(A)
      niet te boven zal gaan.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel111b
      [ref2]: https://wetten.overheid.nl/BWBR0020445#Artikel1.1
      [ref3]: https://wetten.overheid.nl/BWBR0020445#Artikel1.1
