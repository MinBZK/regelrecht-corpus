  - number: 1.4a
    text: |-
      1 Een spoorweg die is aangegeven op de geluidplafondkaart, heeft een zone die zich uitstrekt vanaf de as van de
      spoorweg tot de breedte naast de spoorweg, gemeten vanuit de buitenste spoorstaaf, als aangegeven in onderstaande
      tabel, afhankelijk van de hoogte van het geluidproductieplafond op het betrokken referentiepunt.








                    Hoogte geluidproductieplafond


                    Breedte zone (in meters)






                    Kleiner dan 56 dB


                    100




                    Gelijk aan of groter dan 56 dB en kleiner dan 61 dB


                    200




                    Gelijk aan of groter dan 61 dB en kleiner dan 66 dB


                    300




                    Gelijk aan of groter dan 66 dB en kleiner dan 71 dB


                    600




                    Gelijk aan of groter dan 71 dB en kleiner dan 74 dB


                    900




                    Gelijk aan of groter dan 74 dB


                    1200






      2 Indien zich langs een spoorweg als bedoeld in het eerste lid een zone bevindt met verschillende breedten, geldt
      voor de aansluiting van de verschillende zonedelen dat het breedste zonedeel over een afstand gelijk aan een derde
      van de breedte van dat zonedeel, gemeten vanaf het laatste referentiepunt, behorende bij het breedste zonedeel, nog
      langs de spoorweg doorloopt en met een loodlijn aansluit op de smallere zone.

      3 Aan de uiteinden van een spoorweg als bedoeld in het eerste lid loopt de zone door over een afstand gelijk aan de
      breedte van de zone ter hoogte van het einde van de spoorweg. De zone loopt door langs een lijn die is gelegen in
      het verlengde van de spooras. Zij behoudt de breedte die zij had ter hoogte van het einde van de spoorweg.

      4 Indien bij een deel van een spoorweg als bedoeld in het eerste lid een afschermende voorziening staat, die is
      opgenomen in het register, bedoeld in [artikel 11.25 van de Wet milieubeheer][ref1], is de breedte van de zone
      langs het deel en aan de kant van de spoorweg waar de voorziening staat, in afwijking van het eerste lid gelijk aan
      de breedte van het breedste zonedeel direct naast de uiteinden van de afschermende voorziening.

      5 De ruimte onder en boven de spoorweg behoort tot de zone, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel11.25
