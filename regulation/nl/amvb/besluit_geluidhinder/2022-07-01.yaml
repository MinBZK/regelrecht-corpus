      1 De [artikelen 89][ref1], [90][ref2] en [98 van de wet][ref3] zijn met betrekking tot andere geluidsgevoelige
      gebouwen van overeenkomstige toepassing, met dien verstande dat:

      a. het op te stellen saneringsprogramma maatregelen bevat die de geluidsbelasting vanwege de weg zoveel
      mogelijk beperken tot 48 dB op de gevel van andere geluidsgevoelige gebouwen en om zo nodig te voldoen aan
      [artikel 3.10, tweede lid][ref4];

      b. de met overeenkomstige toepassing van [artikel 90, tweede lid, van de wet][ref5] door Onze Minister vast te
      stellen ten hoogste toelaatbare waarde voor de geluidsbelasting, vanwege de weg, niet hoger mag worden vastgesteld
      dan:

      1°. 68 dB voor onderwijsgebouwen, ziekenhuizen of verpleeghuizen, en

      2°. 58 dB voor verzorgingshuizen, psychiatrische inrichtingen en kinderdagverblijven.

      2 Met betrekking tot andere geluidsgevoelige gebouwen is [artikel 3.5, eerste en derde lid][ref6], van
      overeenkomstige toepassing.


