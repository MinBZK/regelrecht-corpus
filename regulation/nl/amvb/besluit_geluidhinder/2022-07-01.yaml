      a. een penitentiaire inrichting als bedoeld in [artikel 3, eerste lid, van de Penitentiaire inrichtingenwet][ref2];

      b. een justitiële jeugdinrichting als bedoeld in
      [artikel 3a van de Beginselenwet justitiële jeugdinrichtingen][ref3];

      c. een instelling als bedoeld in [artikel 1 van de Beginselenwet verpleging ter beschikking gestelden][ref4].


