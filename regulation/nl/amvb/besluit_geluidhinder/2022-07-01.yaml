  - number: 5.3.1
    text: |-
      Behoudens bij toepassing van [artikel 4.7][ref1] kan een verzoek als bedoeld in
      [artikel 110a, derde lid, van de wet][ref2] met betrekking tot een zone langs een spoorweg als bedoeld in
      [artikel 1.4][ref3] en, voor zover het de aanleg van nog niet geprojecteerde woningen, andere geluidsgevoelige
      gebouwen en geluidsgevoelige terreinen betreft, als bedoeld in [artikel 1.4a][ref4], worden gedaan door:


      [ref1]: https://wetten.overheid.nl/BWBR0020445#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel110a
      [ref3]: https://wetten.overheid.nl/BWBR0020445#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0020445#Artikel1
