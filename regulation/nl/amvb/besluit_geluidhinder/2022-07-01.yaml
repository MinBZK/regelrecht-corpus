        bwb_id: BWBR0003227
        artikel: '85'
      - id: ref2
        bwb_id: BWBR0020445
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.1.2
        afdeling: '3.1'
  - number: 3.10.1.a
    text: |-
      binnen de verblijfsruimten, genoemd in [artikel 1.1, eerste lid, onderdeel d, onder 1° tot en met 3°][ref1], 28
      dB niet te boven zal gaan, en


      [ref1]: https://wetten.overheid.nl/BWBR0020445#Artikel1
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel3.10
    references:
      - id: ref1
        bwb_id: BWBR0020445
        artikel: '1'
        hoofdstuk: '1'
  - number: 3.10.1.b
    text: |-
      binnen de verblijfsruimten, genoemd in [artikel 1.1, eerste lid, onderdeel d, onder 4° en 5°][ref1], 33 dB niet
      te boven zal gaan.


      [ref1]: https://wetten.overheid.nl/BWBR0020445#Artikel1
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel3.10
    references:
      - id: ref1
        bwb_id: BWBR0020445
        artikel: '1'
        hoofdstuk: '1'
  - number: 3.10.2
    text: |-
      Indien met betrekking tot de gevels van andere geluidsgevoelige gebouwen waarvan de geluidsbelasting vanwege de
      weg op 1 maart 1986 hoger was dan 55 dB(A), met toepassing van [artikel 3.4][ref1] of [artikel 3.6][ref2], juncto
      [artikel 90 van de wet][ref3] een hogere geluidsbelasting dan 48 dB, vanwege de weg als de ten hoogste toelaatbare
      is vastgesteld, treffen burgemeester en wethouders met betrekking tot de geluidwering van die gevels maatregelen om
      te bevorderen dat de geluidsbelasting, vanwege die weg, bij gesloten ramen,


      [ref1]: https://wetten.overheid.nl/BWBR0020445#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020445#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0003227#Artikel90
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel3.10
    references:
      - id: ref1
        bwb_id: BWBR0020445
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.1.2
        afdeling: '3.1'
      - id: ref2
        bwb_id: BWBR0020445
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.1.3
        afdeling: '3.1'
      - id: ref3
        bwb_id: BWBR0003227
        artikel: '90'
  - number: 3.10.2.a
    text: |-
