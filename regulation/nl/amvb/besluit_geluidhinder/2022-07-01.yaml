  - number: 4.5.1
    text: |-
      Vanwege de spoorwegexploitant wordt binnen de toekomstige zone van de spoorweg, bedoeld in [artikel 1.4][ref1], een
      akoestisch onderzoek ingesteld van de in [artikel 4.3][ref2] omschreven strekking.


      [ref1]: https://wetten.overheid.nl/BWBR0020445#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0020445#Artikel4
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel4.5
    references:
