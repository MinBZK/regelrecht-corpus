  - number: '4.7'
    text: |-
      1 Tot wijziging van een spoorweg met betrekking waartoe een melding is gedaan als bedoeld in
      [artikel 4.18, eerste lid][ref1], wordt niet overgegaan dan nadat Onze Minister met betrekking tot de in die
      bepaling bedoelde woningen of andere geluidsgevoelige gebouwen binnen de zone van die spoorweg, bedoeld in
      [artikel 1.4][ref2], uitvoering heeft gegeven aan [artikel 4.23, tweede en derde lid][ref3].

      2 Onze Minister stelt in een geval als bedoeld in het eerste lid met in achtneming van de [artikelen 4.13][ref4] en
      [4.14][ref5] ook voor de gevel van andere dan de in dat lid bedoelde woningen en andere geluidsgevoelige gebouwen
      en aan de grens van andere dan de in dat lid bedoelde geluidsgevoelige terreinen binnen de zone van die spoorweg,
      bedoeld in [artikel 1.4][ref6], de ten hoogste toelaatbare waarde van de geluidsbelasting vanwege de spoorweg vast.

      3 Onze Minister stelt in een geval als bedoeld in het tweede lid tevens voor elk van de daarvoor in aanmerking
      komende gevallen maatregelen vast die strekken tot het terugbrengen van de geluidsbelasting, vanwege de spoorweg,
      van de gevel van de betrokken woningen, andere geluidsgevoelige gebouwen, onderscheidenlijk aan de grens van
      geluidsgevoelige terreinen, tot de bij het besluit, bedoeld in het tweede lid, vastgestelde waarde.

      4 In geval van het eerste, tweede en derde lid zijn de [artikelen 110a, zevende lid, van de wet][ref7] en
      [4.4 tot en met 4.6][ref8] niet van toepassing.

      5 In afwijking van het eerste lid, indien toepassing wordt gegeven aan [artikel 4.26][ref9]:

      a. is [artikel 4.18][ref10] niet van toepassing, en

      b. worden in afwijking van [artikel 4.23, tweede en derde lid][ref11], de in die leden bedoelde maatregelen en ten
      hoogste toelaatbare waarden vastgesteld als onderdeel van een tracébesluit, en blijft in het tweede lid de zinsnede
      «na ontvangst van zodanig saneringsprogramma» buiten toepassing.


