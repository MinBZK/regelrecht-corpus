  - number: '3.4'
    text: |-
      1 Voor de ten hoogste toelaatbare geluidsbelasting van de gevel van andere geluidsgevoelige gebouwen kan een hogere
      dan de ingevolge [artikel 3.3, eerste tot en met derde lid][ref1], geldende waarde worden vastgesteld, met dien
      verstande dat de verhoging 5 dB niet te boven mag gaan.

      2 Indien voor het betrokken andere geluidsgevoelige gebouw eerder bij of krachtens de [wet][ref2] een hogere waarde
      voor de ten hoogste toelaatbare geluidsbelasting is vastgesteld of indien de heersende waarde 53 dB niet te boven
      gaat, wordt de krachtens het eerste lid vast te stellen waarde niet hoger vastgesteld dan:

      1°. 58 dB voor andere geluidsgevoelige gebouwen in buitenstedelijk gebied;

      2°. 63 dB voor andere geluidsgevoelige gebouwen in stedelijk gebied.

      3 Voor andere dan de in het tweede lid bedoelde andere geluidsgevoelige gebouwen wordt de krachtens het eerste lid
      vast te stellen waarde niet hoger vastgesteld dan 68 dB.

      4 In afwijking van het tweede en derde lid wordt de krachtens het eerste lid vast te stellen waarde
      voor andere geluidsgevoelige gebouwen met betrekking waartoe eerder bij of krachtens de [wet][ref3],
      de [Experimentenwet Stad en Milieu][ref4], de [Interimwet stad-en-milieubenadering][ref5] of de
      [Spoedwet wegverbreding][ref6] een hogere waarde is vastgesteld dan de krachtens het eerste tot en met derde lid
      ten hoogste toelaatbare waarde, niet hoger vastgesteld dan die eerder vastgestelde waarde.

      5 Voor de ten hoogste toelaatbare geluidsbelasting aan de grens van geluidsgevoelige terreinen, kan een hogere dan
      de ingevolge [artikel 3.3, vierde juncto eerste tot en met derde lid][ref7], geldende waarde worden vastgesteld,
      met dien verstande dat:

      a. de verhoging 5 dB niet te boven mag gaan, en

      b. de waarde niet hoger mag worden vastgesteld dan 53 dB.


      [ref1]: https://wetten.overheid.nl/BWBR0020445#Artikel3.3
