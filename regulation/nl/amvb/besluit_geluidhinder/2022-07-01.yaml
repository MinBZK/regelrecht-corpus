articles:
  - number: '1.1'
    text: |-
      1 In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. etmaalwaarde van het equivalente geluidsniveau in dB(A) met betrekking tot een spoorweg: hoogste van de volgende
      drie waarden:

      1. waarde van het equivalente geluidsniveau over de periode 07.00–19.00 uur (dag),

      2. met 5 dB(A) verhoogde waarde van het equivalente geluidsniveau over de periode 19.00–23.00 uur (avond),

      3. met 10 dB(A) verhoogde waarde van het equivalente geluidsniveau over de periode 23.00–07.00 uur (nacht);

      b. saneringsprogramma: programma van maatregelen als bedoeld in [artikel 4.18, eerste lid][ref1];

      c. spoorwegexploitant: beheerder als bedoeld in [artikel 1, eerste lid, van de Spoorwegwet][ref2], beheerder
      als bedoeld in de [artikel 1 van de Wet lokaal spoor][ref3], spoorwegbeheerder als bedoeld in [artikel 1 van het
      Besluit bijzondere spoorwegen](onbekend), dan wel de opdrachtgever tot aanleg, wijziging of vervanging van een
      hoofdspoorweg of bijzondere spoorweg als bedoeld artikel 1, eerste lid, van de Spoorwegwet, of een lokale spoorweg
      als bedoeld in artikel 1 van de Wet lokaal spoor;

      d. verblijfsruimten:

      1°. leslokalen en theorielokalen van onderwijsgebouwen;

      2°. onderzoeks- en behandelingsruimten van ziekenhuizen en verpleeghuizen;

      3°. onderzoeks-, behandelings-, recreatie-, en conversatieruimten, alsmede woon- en slaapruimten van
      verzorgingshuizen, psychiatrische inrichtingen en kinderdagverblijven;

      4°. theorievaklokalen van onderwijsgebouwen;

      5°. ruimten voor patiëntenhuisvesting, alsmede recreatie- en conversatieruimten van ziekenhuizen en verpleeghuizen;

      e. wet: [Wet geluidhinder][ref4];

      f. wijziging van een spoorweg: wijziging met betrekking tot een aanwezige spoorweg, die verandering brengt in
      de omstandigheden welke ingevolge de regels die gelden bij de vaststelling van de geluidsbelasting vanwege die
      spoorweg in acht genomen moeten worden en waarvan uit akoestisch onderzoek blijkt dat de berekende geluidsbelasting
      vanwege de spoorweg in het toekomstig maatgevende jaar zonder het treffen van maatregelen hoger zal zijn dan
      63 dB of, indien die berekende geluidsbelasting vanwege de spoorweg in het toekomstig maatgevende jaar 63 dB of
      lager zal zijn maar hoger dan een in dit besluit aangegeven geluidsbelasting, uit het onderzoek blijkt dat de
      geluidsbelasting vanwege de spoorweg in het toekomstig maatgevende jaar zonder het treffen van maatregelen ten
      opzichte van de geluidsbelasting voorafgaand aan de wijziging zal toenemen met ten minste 3 dB.

      2 In afwijking van het eerste lid, onderdeel f, wordt onder wijziging van een spoorweg in dit besluit en de daarop
      berustende bepalingen niet verstaan de afzonderlijke omstandigheid die bestaat uit:

      a. een wijziging van de intensiteit, de verkeerssnelheid of een combinatie van beiden in het toekomstig maatgevende
      jaar van door Onze Minister te bepalen categorieën spoorvoertuigen op een bepaald spoorweggedeelte of een
      combinatie van spoorweggedeelten als gevolg waarvan de geluidemissie van de betreffende spoorgedeelten of de
      combinatie daarvan onafgerond niet meer dan 1,0 dB toeneemt ten opzichte van de gemiddelde geluidemissie, bepaald
      volgens bij ministeriële regeling te stellen regels, van de drie jaren voorafgaand aan de wijziging;

      b. een horizontale verplaatsing van de spoorstaven over een afstand kleiner dan twee meter;

      c. een verticale verplaatsing van de spoorstaven over een afstand kleiner dan één meter, dan wel

      d. het ter vervanging aanbrengen van een baanconstructie, die, bepaald met inachtneming van [artikel 4.8][ref5],
      niet meer geluid emitteert dan de te vervangen constructie.


