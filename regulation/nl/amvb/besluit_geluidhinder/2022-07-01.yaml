  - number: '3.7'
    text: |-
      1 Een saneringsprogramma als bedoeld in [artikel 89, eerste lid, van de wet][ref1] kan uitsluitend maatregelen
      bevatten die strekken tot:

      a. vermindering van het geluid, veroorzaakt door het verkeer op de weg;

      b. vermindering van de geluidsoverdracht van de weg naar de betrokken woningen of andere geluidsgevoelige gebouwen;

      c. het aanbrengen van geluidwerende maatregelen aan de betrokken woningen of andere geluidsgevoelige gebouwen, of

      d. onttrekking aan de bestemming van een of meer van de betrokken woningen of andere geluidsgevoelige gebouwen.

      2 Maatregelen als bedoeld in het eerste lid, onder b, onder c, onderscheidenlijk onder d, komen eerst in aanmerking
      voor opneming in het saneringsprogramma, voor zover de toepassing van de in het eerste lid, onder a, onder a en
      b, onderscheidenlijk onder a, b en c genoemde maatregelen onvoldoende doeltreffend zal zijn dan wel overwegende
      bezwaren ontmoet van stedenbouwkundige, verkeerskundige, landschappelijke of financiële aard.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel89
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel3.7
