        artikel: '89'
  - number: '3.8'
    text: |-
      1 Een saneringsprogramma als bedoeld in [artikel 89, eerste lid, van de wet][ref1] bevat:

      a. de resultaten van het akoestisch onderzoek op grond van [artikel 88, eerste lid, van de wet][ref2];

      b. een of meer kaarten met bijbehorende verklaring als bedoeld in het vierde lid, een lijst met de adressen van de
      betrokken woningen of andere geluidsgevoelige gebouwen alsmede de naam en de verkeersfunctie van de weg waarvan de
      geluidsbelasting wordt ondervonden;

      c. een beschrijving van de maatregelen als bedoeld in [artikel 3.7, eerste lid, aanhef, en onder a en b][ref3], die
      naar het oordeel van burgemeester en wethouders in aanmerking komen, en van het effect van deze maatregelen op de
      geluidsbelasting, vanwege de weg, van de gevel van de betrokken woningen of andere geluidsgevoelige gebouwen;

      d. voor zover toepassing van de in [artikel 3.7, eerste lid, aanhef en onder a en b][ref4], bedoelde – in het
      saneringsprogramma opgenomen – maatregelen niet leidt tot beperking van de geluidsbelasting, vanwege de weg
      van de gevel van woningen of andere geluidsgevoelige gebouwen tot 48 dB, een beschrijving van de bezwaren van
      stedenbouwkundige, verkeerskundige, landschappelijke of financiële aard tegen de toepassing van verdergaande
      maatregelen en voorzover van toepassing de te treffen maatregelen;

      e. zo nodig een verklaring dat door middel van maatregelen als bedoeld in [artikel 3.7, eerste lid, onder c][ref5],
      zal worden voldaan aan [artikel 111b, derde lid, van de wet][ref6], onderscheidenlijk [artikel 3.10][ref7];

      f. voor zover van toepassing, een beschrijving van de maatregelen, bedoeld in
      [artikel 3.7, eerste lid, onder d][ref8], alsmede een onderbouwing van deze keuze;

      g. voor zover van de in de [artikel 3.7, eerste lid][ref9], bedoelde alfabetische rangorde van maatregelen is
      afgeweken, een beschrijving van de redenen waarom is afgeweken;

      h. een beschrijving van de mogelijkheden om de uitvoering van de te treffen maatregelen te faseren, in welk geval
      bij een combinatie van maatregelen de volgorde wordt aangegeven;

      i. een beschrijving van de mogelijkheden om uit een oogpunt van doelmatigheid en kostenbeheersing de te treffen
      maatregelen al dan niet gezamenlijk uit te voeren met andere werken;

      j. de resultaten van het onderzoek, bedoeld in [artikel 110f, eerste lid, van de wet][ref10];

      k. een indicatie van de kosten van de te treffen maatregelen;

      l. het tijdstip waarop met de uitvoering van de maatregelen kan worden begonnen, alsmede de verwachte duur van de
      uitvoering van de maatregelen.

      2 In aanvulling op de in het het eerste lid bedoelde informatie, bevat een saneringsprogramma, dat ingevolge
      [artikel 98 van de wet][ref11] wordt vastgesteld:

      a. de resultaten van het akoestisch onderzoek op grond van [artikel 77 van de wet][ref12];

      b. een beschrijving van de invloed van de uitvoering van de reconstructie op de aard en omvang van de voorgestelde
      maatregelen;

      c. een indicatie van de verdeling van de kosten van de te treffen maatregelen over de maatregelen samenhangend met
      de sanering en de maatregelen ten gevolge van de reconstructie van de weg;

      d. het tijdstip waarop naar verwachting met de uitvoering van de reconstructie kan worden begonnen, alsmede de
      verwachte duur van de uitvoering;

      e. indien de maatregelen niet gelijktijdig met de uitvoering van de reconstructie zullen worden uitgevoerd,
      het tijdstip waarop met de uitvoering van de maatregelen zal worden begonnen, alsmede de verwachte duur van de
      uitvoering ervan.

      3 De kaart of de kaarten, bedoeld in het eerste lid, onder b, geven in elk geval aan:

      a. de zone langs de weg of wegen en de ligging van de betrokken woningen of andere geluidsgevoelige gebouwen;

      b. bronmaatregelen of overdrachtsmaatregelen, en

      c. voor zover hiervan sprake is, de ligging van de betrokken woningen of andere geluidsgevoelige gebouwen binnen:

      1°. een geluidszone rond een industrieterrein,

      2°. een geluidszone langs een spoorweg,

      3°. een andere geluidszone, of

      4°. een met het oog op de geluidsbelasting vastgesteld beperkingengebied als bedoeld in
      [hoofdstuk 8, titel 8A.6][ref13] of [artikel 10.17 van de Wet luchtvaart][ref14].

      4 De kaart of kaarten, bedoeld in het derde lid, worden ingericht met inachtneming van de volgende voorschriften:

      a. de kaarten worden getekend op een duidelijke ondergrond;

      b. de begrenzing van het gebied waarop het plan betrekking heeft, wordt met een duidelijke lijn op de kaarten
      aangegeven;

      c. de kaarten worden vervaardigd op een schaal van ten minste 1 op 10 000, tenzij de omvang van het gebied of de
      aard van het plan een andere schaal noodzakelijk maakt;

      d. uit de kaarten moet blijken de aansluiting van het in het plan begrepen gebied aan het daaromheen gelegen
      gebied;

      e. voor zover in het plan gronden zijn begrepen waarvan de bestemming in de naaste toekomst voor verwezenlijking
      in aanmerking komt, worden deze gedeelten vervat in één of meer kaarten op een schaal van ten minste 1 op 2500,
      waarop voorts de kadastrale grenzen, sectie en nummers van de in deze gedeelten van het plan begrepen percelen
      zijn aangegeven;

      f. indien een bestemmingsplan uit meerdere kaarten bestaat, moet uit een overzichtskaart de aansluiting van de
      kaarten onderling en de aansluiting aan het daaromheen gelegen gebied blijken;

      g. op de kaarten worden de schaal en de noordpijl aangegeven;

      h. op de kaarten worden de bestaande gebouwen en de namen van de belangrijkste wegen, straten en waterwegen
      aangegeven.

      De kaarten moeten op duidelijke en overzichtelijke wijze worden uitgevoerd. Zij moeten voorts van duurzaam
      materiaal vervaardigd worden en goed vermenigvuldigbaar zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel89
