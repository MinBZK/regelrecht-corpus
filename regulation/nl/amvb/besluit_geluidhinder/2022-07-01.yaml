  - number: '5.4'
    text: |-
      1 Het verzoek om een hogere waarde als bedoeld in [artikel 110a, derde lid, van de wet][ref1] en het ontwerp van
      een verzoek bevatten ten minste:

      a. de verzochte hogere waarde;

      b. de redenen die aan het verzoek ten grondslag liggen;

      c. de resultaten van het akoestisch onderzoek, bedoeld in de [artikelen 42][ref2], [77][ref3] of
      [80 van de wet][ref4], onderscheidenlijk in de [artikelen 4.3][ref5] of [4.5][ref6];

      d. een verklaring dat maatregelen zullen worden getroffen indien de geluidsbelasting vanwege het industrieterrein,
      vanwege de weg of vanwege de spoorweg, binnen de woning of andere geluidsgevoelige gebouwen bij gesloten ramen meer
      bedraagt dan de waarde, bedoeld in de [artikelen 111b][ref7] en [112 van de wet][ref8], onderscheidenlijk in de
      [artikelen 2.4][ref9], [2.5][ref10], [3.10][ref11], [4.24][ref12] en [4.25][ref13].

      2 Het verzoek gaat vergezeld van een of meer kaarten met bijbehorende verklaring. Met betrekking tot deze
      kaart of kaarten is [artikel 3.8, vierde lid][ref14], van overeenkomstige toepassing. De kaart of kaarten geven
      bovendien de ligging weer van aanwezige of toekomstige geluidszones als bedoeld in de [artikelen 40][ref15],
      [52][ref16], [74][ref17] en [108 van de wet][ref18] en [artikel 1.4a][ref19], alsmede de met het oog op
      de geluidsbelasting vastgestelde beperkingengebieden als bedoeld in [hoofdstuk 8, titel 8A.6][ref20] of
      [artikel 10.17 van de Wet luchtvaart][ref21] en de in die zones of beperkingengebieden voorkomende gebieden,
      aangewezen overeenkomstig [artikel 1.2, tweede lid, onder b, van de Wet milieubeheer][ref22], voor zover de
      woningen, andere geluidsgevoelige gebouwen of geluidsgevoelige terreinen waarop het verzoek betrekking heeft,
      binnen zodanige zones of gebieden zijn of worden gesitueerd.

      3 Degene die op grond van [artikel 110a van de wet][ref23] of [artikel 4.16][ref24] bevoegd is tot het vaststellen
      van een hogere waarde kan van de verzoeker nadere toelichting, tekeningen en kaarten verlangen, indien hij deze
      noodzakelijk acht voor de beoordeling van het verzoek.


