  - number: '2.4'
    text: |-
      Indien door de toepassing van de [artikelen 47, tweede lid][ref1], [54][ref2], [59][ref3], [65][ref4] of
      [66 van de wet][ref5] voor de gevel van één of meer in aanbouw zijnde of aanwezige gebouwen binnen een zone
      rond een industrieterrein een hogere geluidsbelasting dan 50 dB(A) als toelaatbaar is aangemerkt, treffen
      burgemeester en wethouders met betrekking tot de geluidwering van die gevel maatregelen om te bevorderen dat de
      geluidsbelasting, vanwege het industrieterrein,

      a. binnen de verblijfsruimten, genoemd in [artikel 1.1, eerste lid, onderdeel d, onder 1° tot en met 3°][ref6],
      30 dB(A) niet te boven zal gaan, en

      b. binnen de verblijfsruimten, genoemd in [artikel 1.1, eerste lid, onderdeel d, onder 4° en 5°][ref7], 35 dB(A)
      niet te boven zal gaan.


