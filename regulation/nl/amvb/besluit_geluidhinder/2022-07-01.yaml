        afdeling: '4.1'
  - number: 5.4.1.d
    text: |-
      een verklaring dat maatregelen zullen worden getroffen indien de geluidsbelasting vanwege het industrieterrein,
      vanwege de weg of vanwege de spoorweg, binnen de woning of andere geluidsgevoelige gebouwen bij gesloten ramen meer
      bedraagt dan de waarde, bedoeld in de [artikelen 111b][ref1] en [112 van de wet][ref2], onderscheidenlijk in de
      [artikelen 2.4][ref3], [2.5][ref4], [3.10][ref5], [4.24][ref6] en [4.25][ref7].


