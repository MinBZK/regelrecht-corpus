        paragraaf: 4.2.1
        afdeling: '4.2'
  - number: 4.6.2
    text: Het besluit wordt in afschrift aan de spoorwegexploitant toegezonden.
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel4.6
  - number: 4.7.1
    text: |-
      Tot wijziging van een spoorweg met betrekking waartoe een melding is gedaan als bedoeld in
      [artikel 4.18, eerste lid][ref1], wordt niet overgegaan dan nadat Onze Minister met betrekking tot de in die
      bepaling bedoelde woningen of andere geluidsgevoelige gebouwen binnen de zone van die spoorweg, bedoeld in
      [artikel 1.4][ref2], uitvoering heeft gegeven aan [artikel 4.23, tweede en derde lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0020445#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020445#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0020445#Artikel4
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel4.7
    references:
