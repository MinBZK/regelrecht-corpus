    text: |-
      Indien de vaststelling of herziening van het bestemmingsplan of van een wijzigings- of uitwerkingsplan of de
      vergunning bedoeld in [artikel 4.2][ref1], betrekking heeft op een wijziging van een spoorweg, wordt tevens
      akoestisch onderzoek ingesteld naar de heersende waarde.


      [ref1]: https://wetten.overheid.nl/BWBR0020445#Artikel4
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel4.3
    references:
