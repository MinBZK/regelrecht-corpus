  - number: '4.10'
    text: |-
      Voor de ten hoogste toelaatbare geluidsbelasting vanwege een spoorweg, van de gevel van woningen kan een hogere dan
      de in [artikel 4.9, eerste lid][ref1], genoemde waarde worden vastgesteld, met dien verstande dat deze waarde 68 dB
      niet te boven mag gaan.


      [ref1]: https://wetten.overheid.nl/BWBR0020445#Artikel4
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel4.10
    references:
      - id: ref1
        bwb_id: BWBR0020445
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.2.1
        afdeling: '4.2'
  - number: '4.11'
    text: |-
      Voor de ten hoogste toelaatbare geluidsbelasting vanwege een spoorweg, van de gevel van andere geluidsgevoelige
      gebouwen kan een hogere dan de in [artikel 4.9, tweede lid][ref1], genoemde waarde worden vastgesteld, met dien
      verstande dat deze waarde 68 dB niet te boven mag gaan.


      [ref1]: https://wetten.overheid.nl/BWBR0020445#Artikel4
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel4.11
    references:
      - id: ref1
        bwb_id: BWBR0020445
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.2.1
        afdeling: '4.2'
  - number: '4.12'
    text: |-
      Voor de ten hoogste toelaatbare geluidsbelasting vanwege een spoorweg aan de grens van geluidsgevoelige terreinen
      kan een hogere dan de in [artikel 4.9, derde lid][ref1], genoemde waarde worden vastgesteld, met dien verstande dat
      deze waarde 63 dB niet te boven mag gaan.


      [ref1]: https://wetten.overheid.nl/BWBR0020445#Artikel4
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel4.12
    references:
      - id: ref1
        bwb_id: BWBR0020445
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.2.1
        afdeling: '4.2'
  - number: 4.13.1
    text: |-
      Behoudens het tweede en derde lid is de ten hoogste toelaatbare geluidsbelasting vanwege een te wijzigen spoorweg
      van de gevel van woningen binnen de zone van die spoorweg, bedoeld in [artikel 1.4][ref1], 55 dB.


      [ref1]: https://wetten.overheid.nl/BWBR0020445#Artikel1
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel4.13
    references:
      - id: ref1
        bwb_id: BWBR0020445
        artikel: '1'
        hoofdstuk: '1'
  - number: 4.13.2
    text: |-
      Indien eerder bij of krachtens de [wet][ref1] of de [Interimwet stad-en-milieubenadering][ref2] een hogere waarde
      voor de ten hoogste toelaatbare geluidsbelasting, vanwege de te wijzigen spoorweg, van de gevel van woningen is
      vastgesteld dan 55 dB en de heersende geluidsbelasting hoger is dan 55 dB, geldt de laagste van de volgende twee
      waarden als de ten hoogste toelaatbare:


      [ref1]: https://wetten.overheid.nl/BWBR0003227
      [ref2]: https://wetten.overheid.nl/BWBR0019466
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel4.13
    references:
      - id: ref1
        bwb_id: BWBR0003227
      - id: ref2
        bwb_id: BWBR0019466
  - number: 4.13.2.a
    text: de waarde van de geluidsbelasting op het tijdstip waarop met de wijziging een aanvang wordt gemaakt;
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel4.13
  - number: 4.13.2.b
    text: de eerder vastgestelde waarde.
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel4.13
  - number: 4.13.3
    text: |-
      Indien niet eerder bij of krachtens de [wet][ref1] of de [Interimwet stad-en-milieubenadering][ref2] een hogere
      waarde voor de ten hoogste toelaatbare geluidsbelasting vanwege de te wijzigen spoorweg van de gevel van woningen
      binnen de zone van die spoorweg, bedoeld in [artikel 1.4][ref3], is vastgesteld dan 55 dB en de heersende
      geluidsbelasting hoger is dan 55 dB, geldt als de ten hoogste toelaatbare geluidsbelasting, vanwege de te wijzigen
      spoorweg, van de gevel van die woningen de laagste van de volgende waarden:


      [ref1]: https://wetten.overheid.nl/BWBR0003227
      [ref2]: https://wetten.overheid.nl/BWBR0019466
      [ref3]: https://wetten.overheid.nl/BWBR0020445#Artikel1
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel4.13
    references:
      - id: ref1
        bwb_id: BWBR0003227
      - id: ref2
        bwb_id: BWBR0019466
      - id: ref3
        bwb_id: BWBR0020445
        artikel: '1'
        hoofdstuk: '1'
  - number: 4.13.3.a
    text: de waarde van de geluidsbelasting op 1 juli 1987;
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel4.13
  - number: 4.13.3.b
    text: de waarde van de geluidsbelasting op het tijdstip waarop met de wijziging een aanvang wordt gemaakt.
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel4.13
  - number: 4.13.4
    text: |-
      Het eerste lid is niet van toepassing op woningen ten aanzien waarvan met toepassing van
      [artikel 2.12, eerste lid, onder a, onder 2° of 3°, van de Wet algemene bepalingen omgevingsrecht][ref1]
      een omgevingsvergunning is verleend waarbij voor de duur van ten hoogste tien jaar is afgeweken van het
      bestemmingsplan.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel4.13
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
  - number: 4.14.1
    text: |-
      Voor de ten hoogste toelaatbare geluidsbelasting vanwege een spoorweg van de gevel van woningen kan een hogere
      waarde dan de ingevolge [artikel 4.13][ref1] geldende waarde worden vastgesteld, met dien verstande dat deze waarde
      71 dB niet te boven mag gaan.


      [ref1]: https://wetten.overheid.nl/BWBR0020445#Artikel4
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel4.14
    references:
      - id: ref1
        bwb_id: BWBR0020445
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.2.2
        afdeling: '4.2'
  - number: 4.14.2
    text: |-
      Indien reeds eerder een hogere waarde voor de ten hoogste toelaatbare geluidsbelasting is vastgesteld dan de in het
      eerste lid bedoelde waarde, dan is de in dat lid bedoelde waarde, die eerder vastgestelde waarde.
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel4.14
  - number: 4.15.1
    text: |-
      De [artikelen 4.13][ref1] en [4.14][ref2] zijn van overeenkomstige toepassing op andere geluidsgevoelige gebouwen,
      met dien verstande dat in [artikel 4.13][ref3] in plaats van «55 dB» telkens wordt gelezen: 53 dB.


      [ref1]: https://wetten.overheid.nl/BWBR0020445#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020445#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0020445#Artikel4
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel4.15
    references:
      - id: ref1
        bwb_id: BWBR0020445
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.2.2
        afdeling: '4.2'
      - id: ref2
        bwb_id: BWBR0020445
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.2.2
        afdeling: '4.2'
      - id: ref3
        bwb_id: BWBR0020445
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.2.2
        afdeling: '4.2'
  - number: 4.15.2
    text: |-
      De [artikelen 4.13][ref1] en [4.14][ref2] zijn van overeenkomstige toepassing aan de grens van geluidsgevoelige
      terreinen, met dien verstande dat in [artikel 4.14, eerste lid][ref3], in plaats van «71 dB» wordt gelezen: 63 dB.


      [ref1]: https://wetten.overheid.nl/BWBR0020445#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020445#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0020445#Artikel4
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel4.15
    references:
      - id: ref1
        bwb_id: BWBR0020445
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.2.2
        afdeling: '4.2'
      - id: ref2
        bwb_id: BWBR0020445
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.2.2
        afdeling: '4.2'
      - id: ref3
        bwb_id: BWBR0020445
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.2.2
        afdeling: '4.2'
  - number: 4.16.1
    text: |-
      Bij besluit als bedoeld in [artikel 4.23, tweede lid][ref1], wordt de ten hoogste toelaatbare geluidsbelasting,
      vanwege een spoorweg, van de gevel van woningen, andere geluidsgevoelige gebouwen en aan de grens van
      geluidsgevoelige terreinen vastgesteld, met dien verstande dat deze waarde behoudens het tweede en derde lid
      voor zover het betreft woningen en geluidsgevoelige terreinen, de waarde 63 dB en voor zover het betreft andere
      geluidsgevoelige gebouwen de waarde 58 dB, niet te boven mag gaan.


      [ref1]: https://wetten.overheid.nl/BWBR0020445#Artikel4
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel4.16
    references:
      - id: ref1
        bwb_id: BWBR0020445
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '4.3'
  - number: 4.16.2
    text: |-
      Indien overwegende bezwaren bestaan van stedenbouwkundige, verkeerskundige, landschappelijke of financiële aard
      tegen de toepassing van maatregelen gericht op het terugbrengen van de geluidsbelasting, vanwege de spoorweg, van
      de gevel van de woningen, andere geluidsgevoelige gebouwen of aan de grens van geluidsgevoelige terreinen, kan bij
      een besluit als bedoeld in het eerste lid een hogere waarde dan de in dat lid bedoelde waarden worden vastgesteld,
      met dien verstande dat deze waarde 71 dB voor woningen en geluidsgevoelige terreinen, onderscheidenlijk 66 dB voor
      andere geluidsgevoelige gebouwen, niet te boven mag gaan.
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel4.16
  - number: 4.16.3
    text: |-
      Onze Minister kan bij een besluit als bedoeld in het eerste lid een hogere dan de in het tweede lid bedoelde waarde
      vaststellen, in gevallen waarin:
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel4.16
  - number: 4.16.3.a
    text: |-
      toepassing van maatregelen die strekken tot vermindering van het geluid, veroorzaakt door het verkeer op de
      spoorweg niet mogelijk is;
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel4.16
  - number: 4.16.3.b
    text: |-
      toepassing van maatregelen die strekken tot vermindering van de geluidsoverdracht van de spoorweg
      naar de betrokken woningen niet mogelijk is of duurder zal zijn dan de maximale bijdrage die volgens
      [bijlage A, tabel 5, van de Subsidieregeling sanering verkeerslawaai][ref1] voor een woning mogelijk is;


      [ref1]: https://wetten.overheid.nl/BWBR0020731
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel4.16
    references:
      - id: ref1
        bwb_id: BWBR0020731
  - number: 4.16.3.c
    text: |-
      het onttrekken aan de bestemming van de betrokken woningen binnen het bedrag, bedoeld in onderdeel b, niet mogelijk
      is, en
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel4.16
  - number: 4.16.3.d
    text: |-
      koppeling van het treffen van maatregelen aan andere activiteiten niet kan leiden tot het terugbrengen van de
      geluidsbelasting, vanwege de spoorweg, tot de in het tweede lid of dit lid genoemde waarde binnen het bedrag,
      bedoeld in onderdeel b.
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel4.16
  - number: 4.18.1
    text: |-
      Behoudens het derde lid stellen burgemeester en wethouders met inachtneming van de
      [artikelen 4.20 tot en met 4.23][ref1] een programma van maatregelen op, die naar hun oordeel in aanmerking komen
      om de geluidsbelasting, vanwege de spoorweg, van de gevel van de voor 1 januari 2007 aan Onze Minister gemelde
      woningen en andere geluidsgevoelige gebouwen, zoveel mogelijk te beperken tot 55 dB en om zo nodig te voldoen aan
      [artikel 4.25][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020445#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020445#Artikel4
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel4.18
    references:
      - id: ref1
        bwb_id: BWBR0020445
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '4.3'
      - id: ref2
        bwb_id: BWBR0020445
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '4.4'
  - number: 4.18.2
    text: |-
      In een geval als bedoeld in [artikel 4.7][ref1] wordt vanwege de spoorwegexploitant een akoestisch onderzoek
      ingesteld van de in [artikel 4.3][ref2] omschreven strekking.


      [ref1]: https://wetten.overheid.nl/BWBR0020445#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020445#Artikel4
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel4.18
    references:
      - id: ref1
        bwb_id: BWBR0020445
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.1.3
        afdeling: '4.1'
      - id: ref2
        bwb_id: BWBR0020445
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.1.1
        afdeling: '4.1'
  - number: 4.18.3
    text: |-
      In een geval als bedoeld in [artikel 4.7][ref1] stelt de spoorwegexploitant een saneringsprogramma op, met dien
      verstande dat dit saneringsprogramma tevens de resultaten van het in het tweede lid bedoelde akoestisch onderzoek
      bevat en mede betrekking heeft op andere binnen de zone van de spoorweg, bedoeld in [artikel 1.4][ref2], gelegen
      woningen en andere geluidsgevoelige gebouwen.


      [ref1]: https://wetten.overheid.nl/BWBR0020445#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020445#Artikel1
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel4.18
    references:
      - id: ref1
        bwb_id: BWBR0020445
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.1.3
        afdeling: '4.1'
      - id: ref2
        bwb_id: BWBR0020445
        artikel: '1'
        hoofdstuk: '1'
  - number: 4.18.4
    text: |-
      Het eerste lid is niet van toepassing op woningen en andere
      geluidsgevoelige gebouwen ten aanzien waarvan met toepassing van
      [artikel 2.12, eerste lid, onder a, onder 2° of 3°, van de Wet algemene bepalingen omgevingsrecht][ref1]
      een omgevingsvergunning is verleend waarbij voor de duur van ten hoogste tien jaar is afgeweken van het
      bestemmingsplan.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel4.18
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
  - number: 4.19.1
    text: |-
      Een saneringsprogramma als bedoeld in [artikel 4.18][ref1] kan uitsluitend de volgende maatregelen bevatten:


      [ref1]: https://wetten.overheid.nl/BWBR0020445#Artikel4
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel4.19
    references:
      - id: ref1
        bwb_id: BWBR0020445
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '4.3'
  - number: 4.19.1.a
    text: geluidreducerende maatregelen aan een spoorweg;
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel4.19
  - number: 4.19.1.b
    text: |-
      maatregelen die de geluidsoverdracht van een spoorweg naar woningen en andere geluidsgevoelige gebouwen
      verminderen;
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel4.19
  - number: 4.19.1.c
    text: geluidwerende maatregelen aan de gevel van de betrokken woningen of andere geluidsgevoelige gebouwen;
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel4.19
  - number: 4.19.1.d
    text: onttrekking aan de bestemming van één of meer van de betrokken woningen.
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel4.19
  - number: 4.19.2
    text: |-
      Maatregelen als bedoeld in het eerste lid, onder b, onder c, onderscheidenlijk onder d, komen eerst in aanmerking
      voor opneming in het saneringsprogramma, voor zover de toepassing van de in het eerste lid, onder a, genoemde
      maatregelen, onderscheidenlijk de in het eerste lid, onder a en b, dan wel onder a, b en c, genoemde maatregelen
      onvoldoende doeltreffend zal zijn, dan wel overwegende bezwaren ontmoeten van stedenbouwkundige, verkeerskundige,
      landschappelijke of financiële aard.
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel4.19
  - number: '4.20'
    text: |-
      Op de voorbereiding van een saneringsprogramma als bedoeld in [artikel 4.18][ref1] is de in
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref2] geregelde procedure van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020445#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel4.20
    references:
      - id: ref1
        bwb_id: BWBR0020445
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '4.3'
      - id: ref2
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: 4.21.1
    text: |-
      Een saneringsprogramma als bedoeld in [artikel 4.18][ref1] bevat:


      [ref1]: https://wetten.overheid.nl/BWBR0020445#Artikel4
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel4.21
    references:
      - id: ref1
        bwb_id: BWBR0020445
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '4.3'
  - number: 4.21.1.a
    text: |-
      de resultaten van het akoestisch onderzoek dat is voorafgegaan aan de melding, bedoeld in
      [artikel 4.18, eerste lid][ref1], of van het akoestisch onderzoek, bedoeld in artikel 4.18, tweede lid;


      [ref1]: https://wetten.overheid.nl/BWBR0020445#Artikel4
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel4.21
    references:
      - id: ref1
        bwb_id: BWBR0020445
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '4.3'
  - number: 4.21.1.b
    text: |-
      een of meer kaarten met bijbehorende verklaring als bedoeld in het tweede lid, een lijst met adressen van de
      betrokken woningen en andere geluidsgevoelige gebouwen, alsmede het trajectnummer van het spoorweggedeelte of de
      combinatie van spoorweggedeelten, waarvan de geluidsbelasting wordt ondervonden;
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel4.21
  - number: 4.21.1.c
    text: |-
      een beschrijving van de maatregelen, bedoeld in [artikel 4.19, eerste lid, onder a en b][ref1], die in aanmerking
      komen, en van het effect van de maatregelen op de geluidsbelasting in het maatgevende jaar, vanwege de spoorweg,
      van de gevel van betrokken woningen en andere geluidsgevoelige gebouwen;


      [ref1]: https://wetten.overheid.nl/BWBR0020445#Artikel4
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel4.21
    references:
      - id: ref1
        bwb_id: BWBR0020445
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '4.3'
  - number: 4.21.1.d
    text: |-
      voor zover toepassing van de in [artikel 4.19, eerste lid, onder a en b][ref1], bedoelde – in het
      saneringsprogramma opgenomen – maatregelen niet leidt tot beperking van de geluidsbelasting, vanwege de spoorweg,
      tot 55 dB, een beschrijving van de bezwaren van stedenbouwkundige, verkeerskundige, landschappelijke of financiële
      aard tegen de toepassing van verdergaande maatregelen;


      [ref1]: https://wetten.overheid.nl/BWBR0020445#Artikel4
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel4.21
    references:
      - id: ref1
        bwb_id: BWBR0020445
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '4.3'
  - number: 4.21.1.e
    text: |-
      zo nodig een verklaring dat door middel van geluidwerende maatregelen als bedoeld in
      [artikel 4.19, eerste lid, onder c][ref1], zal worden voldaan aan [artikel 4.25][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0020445#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020445#Artikel4
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel4.21
    references:
      - id: ref1
        bwb_id: BWBR0020445
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '4.3'
      - id: ref2
        bwb_id: BWBR0020445
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '4.4'
  - number: 4.21.1.f
    text: |-
      voor zover van toepassing, een beschrijving van de maatregelen, bedoeld in
      [artikel 4.19, eerste lid, onder d][ref1], alsmede een onderbouwing van de keuze;


      [ref1]: https://wetten.overheid.nl/BWBR0020445#Artikel4
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel4.21
    references:
      - id: ref1
        bwb_id: BWBR0020445
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '4.3'
  - number: 4.21.1.g
    text: |-
      voor zover met toepassing van [artikel 4.19, tweede lid][ref1], naar het oordeel van burgemeester en wethouders
      of de spoorwegexploitant andere dan meer primaire maatregelen in aanmerking komen, een beschrijving van de redenen
      daarvoor;


      [ref1]: https://wetten.overheid.nl/BWBR0020445#Artikel4
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel4.21
    references:
      - id: ref1
        bwb_id: BWBR0020445
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '4.3'
  - number: 4.21.1.h
    text: |-
      een beschrijving van de mogelijkheden om uit een oogpunt van doelmatigheid en kostenbeheersing de te treffen
      maatregelen al dan niet gezamenlijk uit te voeren met andere werken;
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel4.21
  - number: 4.21.1.i
    text: |-
      een globale indicatie van de geluidsbelasting, vanwege andere geluidsbronnen als bedoeld in de
      [artikelen 40][ref1], [52][ref2], [74][ref3] en [108 van de wet][ref4] en [artikel 1.4a][ref5] of vanwege het
      luchthavenluchtverkeer, bedoeld in [artikel 1.1 van de Wet luchtvaart][ref6];


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel52
      [ref3]: https://wetten.overheid.nl/BWBR0003227#Artikel74
      [ref4]: https://wetten.overheid.nl/BWBR0003227#Artikel108
      [ref5]: https://wetten.overheid.nl/BWBR0020445#Artikel1
      [ref6]: https://wetten.overheid.nl/BWBR0005555#Artikel1
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel4.21
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '40'
      - id: ref2
        bwb_id: BWBR0003227
        artikel: '52'
      - id: ref3
        bwb_id: BWBR0003227
        artikel: '74'
      - id: ref4
        bwb_id: BWBR0003227
        artikel: '108'
      - id: ref5
        bwb_id: BWBR0020445
        artikel: '1'
        hoofdstuk: '1'
      - id: ref6
        bwb_id: BWBR0005555
        artikel: '1'
  - number: 4.21.1.j
    text: een globale indicatie van de kosten van de te treffen maatregelen;
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel4.21
  - number: 4.21.1.k
    text: |-
      het tijdstip waarop met de uitvoering van de maatregelen kan worden begonnen, alsmede de verwachte duur van de
      uitvoering van de maatregelen.
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel4.21
  - number: 4.21.2
    text: 'De kaart of kaarten, bedoeld in het eerste lid, onder b, geven in elk geval aan:'
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel4.21
  - number: 4.21.2.a
    text: |-
      de zone, bedoeld in [artikel 1.4][ref1], langs de spoorweg of spoorwegen en de ligging van de betrokken woningen en
      andere geluidsgevoelige gebouwen;


      [ref1]: https://wetten.overheid.nl/BWBR0020445#Artikel1
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel4.21
    references:
      - id: ref1
        bwb_id: BWBR0020445
        artikel: '1'
        hoofdstuk: '1'
  - number: 4.21.2.b
    text: bronmaatregelen of overdrachtsmaatregelen, en
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel4.21
  - number: 4.21.2.c
    text: 'voor zover hiervan sprake is, de ligging van de betrokken woningen en andere geluidsgevoelige gebouwen binnen:'
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel4.21
  - number: 4.21.2.c.1°
    text: een geluidszone rond een industrieterrein;
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel4.21
  - number: 4.21.2.c.2°
    text: een geluidszone langs een weg;
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel4.21
  - number: 4.21.2.c.3°
    text: een andere geluidszone, of
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel4.21
  - number: 4.21.2.c.4°
    text: |-
      een met het oog op de geluidsbelasting vastgesteld beperkingengebied als bedoeld in [hoofdstuk 8, titel 8A.6][ref1]
      of [artikel 10.17 van de Wet luchtvaart][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005555
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel10
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel4.21
    references:
      - id: ref1
        bwb_id: BWBR0005555
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '10'
  - number: 4.21.3
    text: |-
      [Artikel 3.8, vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020445#Artikel3
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel4.21
    references:
      - id: ref1
        bwb_id: BWBR0020445
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.2'
  - number: '4.22'
    text: |-
      Onze Minister stelt bij ministeriële regeling nadere regels vast met betrekking tot de vormgeving en inrichting van
      een saneringsprogramma als bedoeld in [artikel 4.18][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020445#Artikel4
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel4.22
    references:
      - id: ref1
        bwb_id: BWBR0020445
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '4.3'
  - number: 4.23.1
    text: |-
      Burgemeester en wethouders, onderscheidenlijk de spoorwegexploitant leggen het ingevolge [artikel 4.18][ref1]
      opgestelde saneringsprogramma onverwijld voor aan Onze Minister en zenden tegelijkertijd, indien van toepassing,
      een afschrift van dit saneringsprogramma aan de spoorwegexploitant.


      [ref1]: https://wetten.overheid.nl/BWBR0020445#Artikel4
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel4.23
    references:
      - id: ref1
        bwb_id: BWBR0020445
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '4.3'
  - number: 4.23.2
    text: |-
      Onze Minister stelt na ontvangst van zodanig saneringsprogramma, met inachtneming van de [artikel 4.16][ref1] de
      ten hoogste toelaatbare waarde van de geluidsbelasting, vanwege de spoorweg, van de gevel van de woningen of andere
      geluidsgevoelige gebouwen vast waarop het saneringsprogramma betrekking heeft. Onze Minister doet van zijn besluit
      mededeling aan burgemeester en wethouders en de spoorwegexploitant.


      [ref1]: https://wetten.overheid.nl/BWBR0020445#Artikel4
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel4.23
    references:
      - id: ref1
        bwb_id: BWBR0020445
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.2.3
        afdeling: '4.2'
  - number: 4.23.3
    text: |-
      Onze Minister stelt ten aanzien van elk van de daarvoor in aanmerking komende gevallen maatregelen vast die
      strekken tot het terugbrengen van de geluidsbelasting, vanwege de spoorweg, van de gevel van de betrokken
      woningen en andere geluidsgevoelige gebouwen, tot het bij het besluit, bedoeld in het tweede lid, vastgestelde
      waarde. De maatregelen strekken tevens, afhankelijk van de hoogte van deze waarde, tot het terugbrengen van
      de geluidsbelasting, vanwege de spoorweg, binnen de woning of het andere geluidsgevoelige gebouw tot de in
      [artikel 4.25][ref1] bedoelde waarde.


      [ref1]: https://wetten.overheid.nl/BWBR0020445#Artikel4
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel4.23
    references:
      - id: ref1
        bwb_id: BWBR0020445
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '4.4'
  - number: 4.24.1
    text: |-
      Indien met toepassing van de [artikelen 4.10][ref1], [4.13][ref2] of [4.14][ref3] met betrekking tot een gevel van
      een in aanbouw zijnde of aanwezige woning een hogere geluidsbelasting dan 55 dB vanwege de weg als de ten hoogste
      toelaatbare is vastgesteld, treffen burgemeester en wethouders met betrekking tot de geluidwering van die gevel
      maatregelen om te bevorderen dat de geluidsbelasting, vanwege de spoorweg, binnen de woning bij gesloten ramen 35
      dB niet te boven zal gaan.


      [ref1]: https://wetten.overheid.nl/BWBR0020445#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020445#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0020445#Artikel4
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel4.24
    references:
      - id: ref1
        bwb_id: BWBR0020445
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.2.1
        afdeling: '4.2'
      - id: ref2
        bwb_id: BWBR0020445
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.2.2
        afdeling: '4.2'
      - id: ref3
        bwb_id: BWBR0020445
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.2.2
        afdeling: '4.2'
  - number: 4.24.2
    text: |-
      Indien de geluidsbelasting van de gevel van een woning op 1 juli 1987 hoger was dan 65 dB(A) onderscheidenlijk
      van de gevel van een ander geluidsgevoelig gebouw hoger was dan 60 dB(A) en voor die woning of dat ander
      geluidsgevoelig gebouw eerder een hogere waarde voor de geluidsbelasting is vastgesteld bij of krachtens de wet
      en met betrekking tot de woning toepassing is gegeven aan de [artikelen 4.13][ref1] of [4.14][ref2], treffen
      burgemeester en wethouders, in afwijking van het eerste lid, met betrekking tot de geluidwering van de gevels van
      de betrokken woning maatregelen om te bevorderen dat de geluidsbelasting, vanwege de spoorweg, binnen de woning
      bij gesloten ramen ten hoogste de waarde bedraagt die ten tijde van de vaststelling van de eerste hogere waarde ten
      hoogste toelaatbaar was.


      [ref1]: https://wetten.overheid.nl/BWBR0020445#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020445#Artikel4
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel4.24
    references:
      - id: ref1
        bwb_id: BWBR0020445
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.2.2
        afdeling: '4.2'
      - id: ref2
        bwb_id: BWBR0020445
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.2.2
        afdeling: '4.2'
  - number: 4.24.3
    text: |-
      Het tweede lid is van overeenkomstige toepassing voor woningen waarbij maatregelen aan de gevel zijn getroffen ter
      uitvoering van [artikel 13, zesde lid, van het Subsidiebesluit openbare lichamen milieubeheer][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004739#Artikel13
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel4.24
    references:
