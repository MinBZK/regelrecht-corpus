  - number: '1.4'
    text: |-
      1 Een spoorweg die is aangegeven op de kaart, bedoeld in [artikel 106 van de wet][ref1], heeft een zone die zich
      uitstrekt vanaf de as van de spoorweg tot de breedte aan weerszijden van de spoorweg, gemeten vanuit de buitenste
      spoorstaaf, als aangegeven op die kaart.

      2 De ruimte boven en onder de spoorweg behoort tot de zone, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel106
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel1.4
