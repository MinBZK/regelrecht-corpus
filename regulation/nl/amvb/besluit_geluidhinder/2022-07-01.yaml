  - number: 4.3.2
    text: |-
      Indien wordt overwogen toepassing te geven aan de [artikelen 4.10 tot en met 4.12][ref1], [4.14][ref2] en
      [4.15][ref3] juncto [4.14][ref4] heeft het akoestisch onderzoek tevens betrekking op de doeltreffendheid van de
      maatregelen om te voldoen aan de vast te stellen hogere waarden voor de ten hoogste toelaatbare geluidsbelasting.


