      de geluidsbelasting die door woningen, andere geluidsgevoelige gebouwen of geluidsgevoelige terreinen binnen
      de toekomstige zone vanwege de spoorweg zou worden ondervonden, zonder de invloed van maatregelen die de
      geluidsbelasting beperken;
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel4.3
  - number: 4.3.1.b
    text: |-
      de doeltreffendheid van de in aanmerking komende maatregelen om te voorkomen dat de in de toekomst vanwege
      de spoorweg optredende geluidsbelasting van de onder a bedoelde objecten de waarden die ingevolge de
      [artikelen 4.9][ref1], [4.13][ref2] en [4.15][ref3], juncto [4.13][ref4] als de ten hoogste toelaatbaar worden
      aangemerkt, te boven zou gaan.


      [ref1]: https://wetten.overheid.nl/BWBR0020445#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020445#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0020445#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0020445#Artikel4
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel4.3
