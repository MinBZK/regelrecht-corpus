        artikel: '4'
        hoofdstuk: '4'
        afdeling: '4.5'
  - number: 4.7.5.a
    text: |-
      is [artikel 4.18][ref1] niet van toepassing, en


      [ref1]: https://wetten.overheid.nl/BWBR0020445#Artikel4
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel4.7
    references:
      - id: ref1
        bwb_id: BWBR0020445
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '4.3'
  - number: 4.7.5.b
    text: |-
      worden in afwijking van [artikel 4.23, tweede en derde lid][ref1], de in die leden bedoelde maatregelen en ten
      hoogste toelaatbare waarden vastgesteld als onderdeel van een tracébesluit, en blijft in het tweede lid de zinsnede
      «na ontvangst van zodanig saneringsprogramma» buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020445#Artikel4
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel4.7
    references:
