  - number: '4.16'
    text: |-
      1 Bij besluit als bedoeld in [artikel 4.23, tweede lid][ref1], wordt de ten hoogste toelaatbare geluidsbelasting,
      vanwege een spoorweg, van de gevel van woningen, andere geluidsgevoelige gebouwen en aan de grens van
      geluidsgevoelige terreinen vastgesteld, met dien verstande dat deze waarde behoudens het tweede en derde lid
      voor zover het betreft woningen en geluidsgevoelige terreinen, de waarde 63 dB en voor zover het betreft andere
      geluidsgevoelige gebouwen de waarde 58 dB, niet te boven mag gaan.

      2 Indien overwegende bezwaren bestaan van stedenbouwkundige, verkeerskundige, landschappelijke of financiële aard
      tegen de toepassing van maatregelen gericht op het terugbrengen van de geluidsbelasting, vanwege de spoorweg, van
      de gevel van de woningen, andere geluidsgevoelige gebouwen of aan de grens van geluidsgevoelige terreinen, kan bij
      een besluit als bedoeld in het eerste lid een hogere waarde dan de in dat lid bedoelde waarden worden vastgesteld,
      met dien verstande dat deze waarde 71 dB voor woningen en geluidsgevoelige terreinen, onderscheidenlijk 66 dB voor
      andere geluidsgevoelige gebouwen, niet te boven mag gaan.

      3 Onze Minister kan bij een besluit als bedoeld in het eerste lid een hogere dan de in het tweede lid bedoelde
      waarde vaststellen, in gevallen waarin:

      a. toepassing van maatregelen die strekken tot vermindering van het geluid, veroorzaakt door het verkeer op de
      spoorweg niet mogelijk is;

      b. toepassing van maatregelen die strekken tot vermindering van de geluidsoverdracht van de spoorweg
      naar de betrokken woningen niet mogelijk is of duurder zal zijn dan de maximale bijdrage die volgens
      [bijlage A, tabel 5, van de Subsidieregeling sanering verkeerslawaai][ref2] voor een woning mogelijk is;

      c. het onttrekken aan de bestemming van de betrokken woningen binnen het bedrag, bedoeld in onderdeel b, niet
      mogelijk is, en

      d. koppeling van het treffen van maatregelen aan andere activiteiten niet kan leiden tot het terugbrengen van
      de geluidsbelasting, vanwege de spoorweg, tot de in het tweede lid of dit lid genoemde waarde binnen het bedrag,
      bedoeld in onderdeel b.


      [ref1]: https://wetten.overheid.nl/BWBR0020445#Artikel4.23
      [ref2]: https://wetten.overheid.nl/BWBR0020731
