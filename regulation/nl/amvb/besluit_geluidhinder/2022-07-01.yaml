        bwb_id: BWBR0020445
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0020445
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.1.1
        afdeling: '4.1'
  - number: 4.5.2
    text: |-
      De resultaten van het ingestelde onderzoek worden door de spoorwegexploitant aan burgemeester en wethouders
      overgelegd, tezamen met een beschrijving van de maatregelen die naar zijn oordeel nodig zijn voor het in
      [artikel 4.6][ref1] omschreven doel.


      [ref1]: https://wetten.overheid.nl/BWBR0020445#Artikel4
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel4.5
    references:
      - id: ref1
        bwb_id: BWBR0020445
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.1.2
        afdeling: '4.1'
  - number: 4.6.1
    text: |-
      Binnen drie maanden nadat de resultaten van het in [artikel 4.5][ref1] bedoelde onderzoek zijn verkregen, nemen
      burgemeester en wethouders een besluit als bedoeld in [artikel 4.4][ref2], bepalende welke maatregelen nodig
      zijn om te voorkomen dat de geluidsbelasting die de spoorweg binnen de zone, bedoeld in [artikel 1.4][ref3], zal
      veroorzaken, de waarden die ingevolge de [artikelen 4.9 tot en met 4.15][ref4] als ten hoogste toelaatbaar worden
      aangemerkt, te boven zou gaan.


      [ref1]: https://wetten.overheid.nl/BWBR0020445#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020445#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0020445#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0020445#Artikel4
