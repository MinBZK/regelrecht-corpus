  - number: '4.2'
    text: |-
      [Artikel 4.1, eerste en tweede lid][ref1], is van overeenkomstige toepassing
      op het verlenen van een omgevingsvergunning waarbij voor een termijn langer
      dan tien jaar van het bestemmingsplan wordt afgeweken met toepassing van
      [artikel 2.12, eerste lid, onder a, onder 2° en 3°, van de Wet algemene bepalingen omgevingsrecht][ref2], die
      geheel of gedeeltelijk betrekking heeft op gronden behorende tot een zone als bedoeld in [artikel 1.4][ref3] of
      [artikel 1.4a][ref4].


