  - number: 4.25.1
    text: |-
      Indien Onze Minister toepassing heeft gegeven aan het [artikel 4.16, tweede of derde lid][ref1], treffen
      burgemeester en wethouders de in het tweede lid beschreven maatregelen, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0020445#Artikel4
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel4.25
    references:
      - id: ref1
        bwb_id: BWBR0020445
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.2.3
        afdeling: '4.2'
  - number: 4.25.1.a
    text: |-
      ten minste één geluidsgevoelige ruimte binnen een woning, onderscheidenlijk ten minste één verblijfsruimte als
      genoemd in [artikel 1.1, eerste lid, onderdeel d, onder 4° en 5°][ref1], binnen een ander geluidsgevoelig gebouw
      een geluidsbelasting ondervindt van meer dan 43 dB, of


      [ref1]: https://wetten.overheid.nl/BWBR0020445#Artikel1
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel4.25
    references:
      - id: ref1
        bwb_id: BWBR0020445
        artikel: '1'
        hoofdstuk: '1'
  - number: 4.25.1.b
    text: |-
      ten minste één verblijfsruimte als genoemd in [artikel 1.1, eerste lid, onderdeel d, onder 1° tot en met 3°][ref1],
      binnen een ander geluidsgevoelig gebouw een geluidsbelasting ondervindt van meer dan 38 dB.


      [ref1]: https://wetten.overheid.nl/BWBR0020445#Artikel1
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel4.25
    references:
      - id: ref1
        bwb_id: BWBR0020445
        artikel: '1'
        hoofdstuk: '1'
  - number: 4.25.2
    text: |-
      De maatregelen ter uitvoering van het eerste lid hebben betrekking op de geluidwering van de gevel en bevorderen
      dat de geluidsbelasting bij gesloten ramen:
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel4.25
  - number: 4.25.2.a
    text: |-
      in het eerste lid, onder a, bedoelde geval in geluidsgevoelige ruimten binnen de woning, onderscheidenlijk in
      verblijfsruimten als genoemd in [artikel 1.1, eerste lid, onderdeel d, onder 4° en 5°][ref1], binnen het andere
      geluidsgevoelige gebouw, 38 dB, dan wel een door burgemeester en wethouders doelmatig geoordeelde hogere waarde van
      ten hoogste 43 dB, niet te boven zal gaan;


      [ref1]: https://wetten.overheid.nl/BWBR0020445#Artikel1
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel4.25
    references:
