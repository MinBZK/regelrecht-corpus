  - number: '4.24'
    text: |-
      1 Indien met toepassing van de [artikelen 4.10][ref1], [4.13][ref2] of [4.14][ref3] met betrekking tot een gevel
      van een in aanbouw zijnde of aanwezige woning een hogere geluidsbelasting dan 55 dB vanwege de weg als de ten
      hoogste toelaatbare is vastgesteld, treffen burgemeester en wethouders met betrekking tot de geluidwering van die
      gevel maatregelen om te bevorderen dat de geluidsbelasting, vanwege de spoorweg, binnen de woning bij gesloten
      ramen 35 dB niet te boven zal gaan.

      2 Indien de geluidsbelasting van de gevel van een woning op 1 juli 1987 hoger was dan 65 dB(A) onderscheidenlijk
      van de gevel van een ander geluidsgevoelig gebouw hoger was dan 60 dB(A) en voor die woning of dat ander
      geluidsgevoelig gebouw eerder een hogere waarde voor de geluidsbelasting is vastgesteld bij of krachtens de wet
      en met betrekking tot de woning toepassing is gegeven aan de [artikelen 4.13][ref4] of [4.14][ref5], treffen
      burgemeester en wethouders, in afwijking van het eerste lid, met betrekking tot de geluidwering van de gevels van
      de betrokken woning maatregelen om te bevorderen dat de geluidsbelasting, vanwege de spoorweg, binnen de woning
      bij gesloten ramen ten hoogste de waarde bedraagt die ten tijde van de vaststelling van de eerste hogere waarde ten
      hoogste toelaatbaar was.

      3 Het tweede lid is van overeenkomstige toepassing voor woningen waarbij maatregelen aan de gevel zijn getroffen
      ter uitvoering van [artikel 13, zesde lid, van het Subsidiebesluit openbare lichamen milieubeheer][ref6].

      4 Indien met toepassing van de [artikelen 4.11][ref7] of [4.15][ref8] met betrekking tot een gevel van een in
      aanbouw zijnd of aanwezig ander geluidsgevoelig gebouw een hogere geluidsbelasting dan 53 dB als de ten hoogste
      toelaatbare is vastgesteld, treffen burgemeester en wethouders met betrekking tot de geluidwering van die gevel
      maatregelen om te bevorderen dat de geluidsbelasting, vanwege de spoorweg, bij gesloten ramen:

      a. binnen de verblijfsruimten, genoemd in [artikel 1.1, eerste lid, onderdeel d, onder 1° tot en met 3°][ref9],
      28 dB niet te boven zal gaan, en

      b. binnen de verblijfsruimten, genoemd in [artikel 1.1, eerste lid, onderdeel d, onder 4° en 5°][ref10], 33 dB
      niet te boven zal gaan.


