      gebouwen, met dien verstande dat in [artikel 4.13][ref3] in plaats van «55 dB» telkens wordt gelezen: 53 dB.

      2 De [artikelen 4.13][ref4] en [4.14][ref5] zijn van overeenkomstige toepassing aan de grens van geluidsgevoelige
      terreinen, met dien verstande dat in [artikel 4.14, eerste lid][ref6], in plaats van «71 dB» wordt gelezen: 63 dB.


