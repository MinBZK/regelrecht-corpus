  - number: 1.2.5
    text: |-
      In afwijking van het eerste lid, onderdeel f, wordt een kinderdagverblijf voor de toepassing van het
      [Activiteitenbesluit milieubeheer][ref1] gedurende drie jaar na inwerkingtreding van dat lid niet aangemerkt als
      ander geluidsgevoelig gebouw.


      [ref1]: https://wetten.overheid.nl/BWBR0022762
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel1.2
    references:
      - id: ref1
        bwb_id: BWBR0022762
  - number: 1.2.6
    text: |-
      In afwijking van het derde lid, onderdeel b, wordt een ligplaats in het water, bestemd om door een woonschip
      te worden ingenomen, voor de toepassing van het [Activiteitenbesluit milieubeheer][ref1] gedurende drie jaar na
      inwerkingtreding van dat lid niet aangemerkt als geluidsgevoelig terrein.


      [ref1]: https://wetten.overheid.nl/BWBR0022762
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel1.2
    references:
      - id: ref1
        bwb_id: BWBR0022762
  - number: 1.2.7
    text: |-
      In afwijking van het eerste lid, onderdeel f, wordt een kinderdagverblijf, dat op het tijdstip van inwerkingtreding
      van dat onderdeel als zodanig is bestemd en is gelegen binnen de bestaande zone van een industrieterrein, voor
      de toepassing van [artikel 2.14, eerste lid, onderdeel c, van de Wet algemene bepalingen omgevingsrecht][ref1]
      gedurende drie jaar na inwerkingtreding van dat onderdeel niet aangemerkt als ander geluidsgevoelig gebouw.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel1.2
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
  - number: 1.2.8
    text: |-
      In afwijking van het derde lid, onderdeel b, worden een ligplaats in het water, bestemd om door een
      woonschip te worden ingenomen, die op het tijdstip van inwerkingtreding van dat onderdeel als zodanig
      is bestemd en is gelegen binnen de bestaande zone van een industrieterrein, alsmede een ligplaats in
      het water, bestemd om door een woonschip te worden ingenomen, die op dat tijdstip in een gemeentelijke
      verordening was aangewezen om door een woonschip te worden ingenomen en na dat tijdstip als zodanig
      is bestemd en is gelegen binnen de bestaande zone van een industrieterrein, voor de toepassing van
      [artikel 2.14, eerste lid, onderdeel c, van de Wet algemene bepalingen omgevingsrecht][ref1] niet aangemerkt als
      geluidsgevoelig terrein tot het tijdstip waarop het bij koninklijke boodschap van 16 juni 2014 ingediende voorstel
      van wet houdende regels over het beschermen en benutten van de fysieke leefomgeving (Omgevingswet) tot wet wordt
      verheven en in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel1.2
    references:
