  - number: '1.2'
    text: |-
      1 Als ander geluidsgevoelig gebouw als bedoeld in [artikel 1 van de wet][ref1] worden aangewezen:

      a. een onderwijsgebouw;

      b. een ziekenhuis;

      c. een verpleeghuis;

      d. een verzorgingstehuis;

      e. een psychiatrische inrichting;

      f. een kinderdagverblijf.

      2 De aanwijzing als ander geluidsgevoelig gebouw in het eerste lid, onderdelen a tot en met f, geldt niet voor de
      delen van een gebouw die een andere bestemming hebben dan genoemd in [artikel 1.1, onderdeel d][ref2].

      3 Als geluidsgevoelig terrein als bedoeld in [artikel 1 van de wet][ref3] worden aangewezen:

      a. een standplaats als bedoeld in [artikel 1, onderdeel j, van de Wet op de huurtoeslag][ref4], en

      b. een ligplaats in het water, bestemd om door een woonschip te worden ingenomen.

      4

      5 In afwijking van het eerste lid, onderdeel f, wordt een kinderdagverblijf voor de toepassing van het
      [Activiteitenbesluit milieubeheer][ref5] gedurende drie jaar na inwerkingtreding van dat lid niet aangemerkt als
      ander geluidsgevoelig gebouw.

      6 In afwijking van het derde lid, onderdeel b, wordt een ligplaats in het water, bestemd om door een woonschip
      te worden ingenomen, voor de toepassing van het [Activiteitenbesluit milieubeheer][ref6] gedurende drie jaar na
      inwerkingtreding van dat lid niet aangemerkt als geluidsgevoelig terrein.

      7 In afwijking van het eerste lid, onderdeel f, wordt een kinderdagverblijf, dat
      op het tijdstip van inwerkingtreding van dat onderdeel als zodanig is bestemd en is
      gelegen binnen de bestaande zone van een industrieterrein, voor de toepassing van
      [artikel 2.14, eerste lid, onderdeel c, van de Wet algemene bepalingen omgevingsrecht][ref7] gedurende drie jaar na
      inwerkingtreding van dat onderdeel niet aangemerkt als ander geluidsgevoelig gebouw.

      8 In afwijking van het derde lid, onderdeel b, worden een ligplaats in het water, bestemd om door een
      woonschip te worden ingenomen, die op het tijdstip van inwerkingtreding van dat onderdeel als zodanig
      is bestemd en is gelegen binnen de bestaande zone van een industrieterrein, alsmede een ligplaats in
      het water, bestemd om door een woonschip te worden ingenomen, die op dat tijdstip in een gemeentelijke
      verordening was aangewezen om door een woonschip te worden ingenomen en na dat tijdstip als zodanig
      is bestemd en is gelegen binnen de bestaande zone van een industrieterrein, voor de toepassing van
      [artikel 2.14, eerste lid, onderdeel c, van de Wet algemene bepalingen omgevingsrecht][ref8] niet aangemerkt als
      geluidsgevoelig terrein tot het tijdstip waarop het bij koninklijke boodschap van 16 juni 2014 ingediende voorstel
      van wet houdende regels over het beschermen en benutten van de fysieke leefomgeving (Omgevingswet) tot wet wordt
      verheven en in werking treedt.


