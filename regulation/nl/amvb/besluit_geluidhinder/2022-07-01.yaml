        artikel: '5.4'
        hoofdstuk: '5'
  - number: '6.1'
    text: |-
      Dit hoofdstuk is van toepassing op woningen of andere geluidsgevoelige gebouwen die voor het van overheidswege
      aanbrengen van geluidwerende voorzieningen in aanmerking worden genomen.
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel6.1
  - number: '6.2'
    text: |-
      1 Het bevoegd gezag kan burgemeester en wethouders van de gemeente of gemeenten waarin de woningen of andere
      geluidsgevoelige gebouwen zijn gelegen, verzoeken met betrekking tot die woningen of gebouwen in elk geval de
      volgende gegevens te verstrekken:

      a. namen en adressen van eigenaren en bewoners;

      b. kadastrale gegevens;

      c. gegevens uit de registratie tot de onroerende-zaakbelasting die de bestemming van de woning betreffen;

      d. tekeningen van woningen of andere geluidsgevoelige gebouwen;

      e. verstrekte bouwvergunningen.

      2 Het bevoegd gezag kan burgemeester en wethouders van de gemeente of gemeenten waarin de woningen of andere
      geluidsgevoelige gebouwen zijn gelegen, voorts verzoeken met betrekking tot die woningen of gebouwen de gegevens te
      verstrekken waaruit blijkt of:

      a. de verwachting bestaat dat zij binnen vijf jaar na de door het bevoegd gezag aangegeven datum zullen worden
      onteigend of dat de bewoning of het gebruik om andere redenen binnen die termijn zal worden gestaakt;

      b. zij niet voor permanente bewoning bestemd zijn of daar niet voor worden gebruikt;

      c. in geval van andere geluidsgevoelige gebouwen, zij niet als zodanig bestemd zijn of zij daar niet voor worden
      gebruikt;

      d. zij behoren tot de categorieën woonwagens of woonschepen.
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel6.2
  - number: '6.3'
    text: |-
      De eigenaren en bewoners van de woningen of andere geluidsgevoelige gebouwen worden schriftelijk op de hoogte
      gesteld dat van overheidswege wordt overwogen geluidwerende voorzieningen aan te brengen.
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel6.3
  - number: '6.4'
    text: |-
      1 Aan de eigenaren van de woningen of andere geluidsgevoelige gebouwen wordt verzocht binnen drie weken na de in
      [artikel 6.3][ref1] bedoelde schriftelijke mededeling, schriftelijk toestemming te verlenen tot het uitvoeren van
      een akoestisch en bouwtechnisch onderzoek.

      2 Indien de in het eerste lid bedoelde toestemming niet volledig, niet binnen de gestelde termijn of niet voor
      de gehele woning of het ander geluidsgevoelige gebouw is verleend, wordt de betreffende eigenaren schriftelijk
      meegedeeld dat geen akoestisch en bouwtechnisch onderzoek kan worden uitgevoerd, tenzij deze schriftelijke
      toestemming binnen twee weken alsnog wordt verleend.

      3 Indien ook de in het tweede lid bedoelde toestemming niet volledig, niet binnen de gestelde termijn of niet voor
      de gehele woning of het andere geluidsgevoelige gebouw is verleend, wordt de betreffende eigenaren schriftelijk
      meegedeeld dat geen geluidwerende voorzieningen worden aangebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0020445#Artikel6.3
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel6.4
    references:
      - id: ref1
        bwb_id: BWBR0020445
        artikel: '6.3'
        hoofdstuk: '6'
  - number: '6.5'
    text: |-
      Indien de in [artikel 6.4, eerste of tweede lid][ref1], bedoelde toestemming is verleend, stelt het bevoegd gezag
      een akoestisch en bouwtechnisch onderzoek in. Het onderzoek resulteert in ieder geval in:

      a. een opgave van de geluidsgevoelige ruimten;

      b. een inventarisatie van de benodigde bouwtechnische gegevens;

      c. een opgave van de benodigde geluidwerende voorzieningen;

      d. een raming van de kosten voor de overheid, en

      e. een raming van de eventuele kosten voor de eigenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0020445#Artikel6.4
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel6.5
    references:
      - id: ref1
        bwb_id: BWBR0020445
        artikel: '6.4'
        hoofdstuk: '6'
  - number: '6.6'
    text: |-
      1 De eigenaren van de woningen of andere geluidsgevoelige gebouwen ten aanzien waarvan uit het in
      [artikel 6.5][ref1] bedoelde onderzoek blijkt dat de volgende extra voorzieningen moeten worden getroffen, worden
      hiervan door het bevoegd gezag schriftelijk op de hoogte gesteld:

      a. extra voorzieningen met betrekking tot het in overeenstemming brengen van de woning met de
      geluidweringvoorschriften ingevolge de [Woningwet 1962][ref2] of de [Woningwet][ref3];

      b. extra voorzieningen met betrekking tot het in overeenstemming brengen van de woning met de technische
      bouwvoorschriften die bij of krachtens het [Bouwbesluit 2012][ref4] inzake bestaande bouw worden gesteld, voor
      zover het betreft geluidsgevoelige ruimten of de bereikbaarheid daarvan;

      c. extra voorzieningen met betrekking tot het in overeenstemming brengen van het andere geluidsgevoelige gebouw
      met de technische bouwvoorschriften die bij of krachtens het [Bouwbesluit 2012][ref5] inzake bestaande bouw worden
      gesteld, voor zover het betreft geluidsgevoelige ruimten of de bereikbaarheid daarvan;

      d. voorzieningen met betrekking tot het opheffen van gebreken en van achterstallig onderhoud;

      e. voorzieningen met betrekking tot het in overeenstemming brengen van de woning of het andere geluidsgevoelige
      gebouw met de mate van geluidwering die is behaald vanwege van rijkswege aangebrachte geluidwerende voorzieningen
      waarvan is gebleken dat deze zijn verwijderd of waarvan anderszins de werking ervan teniet is gedaan.

      2 Aan de betreffende eigenaren wordt verzocht binnen drie weken na ontvangst van deze schriftelijke mededeling,
      schriftelijk te verklaren dat zij zich verplichten, om binnen een door het bevoegd gezag gestelde termijn,
      voorafgaand aan het aanbrengen van de geluidwerende voorzieningen de extra voorzieningen, bedoeld in het eerste
      lid, aan te brengen, tenzij toepassing wordt gevraagd van [artikel 6.7, eerste lid][ref6].

      3 Indien de in het tweede lid bedoelde schriftelijke verklaring niet volledig, niet binnen de gestelde termijn
      of niet voor de gehele woning is verleend, wordt de betreffende eigenaren schriftelijk meegedeeld dat geen
      geluidwerende voorzieningen worden aangebracht, tenzij de schriftelijke verklaring binnen twee weken alsnog wordt
      afgegeven.

      4 Indien de verklaring ook binnen de in het derde lid gestelde termijn niet volledig, niet binnen de gestelde
      termijn of niet voor de gehele woning is afgegeven, wordt de betreffende eigenaren schriftelijk meegedeeld dat geen
      geluidwerende voorzieningen worden aangebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0020445#Artikel6.5
      [ref2]: https://wetten.overheid.nl/BWBR0002379
      [ref3]: https://wetten.overheid.nl/BWBR0005181
      [ref4]: https://wetten.overheid.nl/BWBR0030461
      [ref5]: https://wetten.overheid.nl/BWBR0030461
      [ref6]: https://wetten.overheid.nl/BWBR0020445#Artikel6.7
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel6.6
    references:
      - id: ref1
        bwb_id: BWBR0020445
        artikel: '6.5'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0002379
      - id: ref3
        bwb_id: BWBR0005181
      - id: ref4
        bwb_id: BWBR0030461
      - id: ref5
        bwb_id: BWBR0030461
      - id: ref6
        bwb_id: BWBR0020445
        artikel: '6.7'
        hoofdstuk: '6'
  - number: '6.7'
    text: |-
      1 Bij het afgeven van de verklaring, bedoeld in [artikel 6.6, tweede lid][ref1], kan de eigenaar verzoeken dat het
      treffen van de extra voorzieningen, bedoeld in [artikel 6.6, eerste lid][ref2], en het van overheidswege aanbrengen
      van geluidwerende voorzieningen, gelijktijdig plaatsvindt. Aan dit verzoek wordt gevolg gegeven.

      2 Bij toepassing van het eerste lid blijven de kosten van het aanbrengen van de extra voorzieningen, bedoeld in
      [artikel 6.6, eerste lid][ref3], voor rekening van de betreffende eigenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0020445#Artikel6.6
