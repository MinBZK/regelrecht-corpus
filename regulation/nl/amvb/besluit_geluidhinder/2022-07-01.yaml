    text: De ruimte onder en boven de spoorweg behoort tot de zone, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel1.4a
  - number: '1.5'
    text: |-
      Indien [artikel 110f van de wet][ref1] van toepassing is, geeft het bevoegd gezag slechts toepassing aan de
      [artikelen 110a][ref2], [110b][ref3] en [110c van de wet][ref4] voorzover de gecumuleerde geluidsbelastingen na
      de correctie op grond van [artikel 110f van de wet][ref5] niet leiden tot een naar zijn oordeel onaanvaardbare
      geluidsbelasting.


