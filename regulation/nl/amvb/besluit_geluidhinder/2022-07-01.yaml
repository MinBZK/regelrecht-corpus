        bwb_id: BWBR0020445
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.1.2
        afdeling: '3.1'
  - number: 3.4.5.a
    text: de verhoging 5 dB niet te boven mag gaan, en
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel3.4
  - number: 3.4.5.b
    text: de waarde niet hoger mag worden vastgesteld dan 53 dB.
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel3.4
  - number: 3.5.1
    text: |-
      Onze Minister kan voor de ten hoogste toelaatbare geluidsbelasting, vanwege een weg, van de gevels van woningen
      binnen de zone van die weg een hogere dan de in [artikel 90, tweede lid, van de wet][ref1] genoemde waarde
      vaststellen in gevallen waarin toepassing van maatregelen, gericht op het terugbrengen van de geluidsbelasting
      tot die waarde, onvoldoende doeltreffend zal zijn dan wel overwegende bezwaren ontmoet van stedenbouwkundige,
      verkeerskundige, landschappelijke of financiële aard.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel90
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '90'
  - number: 3.5.2
    text: |-
      Onze Minister kan voor de ten hoogste toelaatbare geluidsbelasting, vanwege een weg, van de gevels van woningen
      binnen de zone van die weg een hogere dan de in [artikel 90, derde lid, van de wet][ref1] genoemde waarde
      vaststellen, in gevallen waarin:


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel90
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '90'
