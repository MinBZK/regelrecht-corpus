  - number: 3.1.1
    text: |-
      In geval van aanleg van een weg is de ten hoogste toelaatbare geluidsbelasting, vanwege die weg, van de gevel van
      andere geluidsgevoelige gebouwen en aan de grens van geluidsgevoelige terreinen binnen de zone van die weg, 48 dB.
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel3.1
  - number: 3.1.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing op nog niet aanwezige andere geluidgevoelige gebouwen en
      geluidsgevoelige terreinen, indien deze worden geprojecteerd binnen de zone van een weg.
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel3.1
  - number: 3.2.1
    text: |-
      Een krachtens [artikel 85 van de wet][ref1] vast te stellen hogere waarde dan de in [artikel 3.1][ref2] genoemde
      waarde voor de ten hoogst toelaatbare geluidsbelasting, vanwege een weg, mag niet hoger worden vastgesteld dan:


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel85
      [ref2]: https://wetten.overheid.nl/BWBR0020445#Artikel3
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel3.2
    references:
