        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.2.3
        afdeling: '4.2'
  - number: '5.5'
    text: |-
      Bij het ambtshalve vaststellen van een hogere waarde als bedoeld in [artikel 110a, derde lid, van de wet][ref1] is
      [artikel 5.4, eerste en tweede lid][ref2], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel110a
      [ref2]: https://wetten.overheid.nl/BWBR0020445#Artikel5
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel5.5
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: 110a
      - id: ref2
        bwb_id: BWBR0020445
        artikel: '5'
        hoofdstuk: '5'
  - number: '6.1'
    text: |-
      Dit hoofdstuk is van toepassing op woningen of andere geluidsgevoelige gebouwen die voor het van overheidswege
      aanbrengen van geluidwerende voorzieningen in aanmerking worden genomen.
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel6.1
  - number: 6.2.1
    text: |-
      Het bevoegd gezag kan burgemeester en wethouders van de gemeente of gemeenten waarin de woningen of andere
      geluidsgevoelige gebouwen zijn gelegen, verzoeken met betrekking tot die woningen of gebouwen in elk geval de
      volgende gegevens te verstrekken:
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel6.2
  - number: 6.2.1.a
    text: namen en adressen van eigenaren en bewoners;
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel6.2
  - number: 6.2.1.b
    text: kadastrale gegevens;
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel6.2
  - number: 6.2.1.c
    text: gegevens uit de registratie tot de onroerende-zaakbelasting die de bestemming van de woning betreffen;
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel6.2
  - number: 6.2.1.d
    text: tekeningen van woningen of andere geluidsgevoelige gebouwen;
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel6.2
  - number: 6.2.1.e
    text: verstrekte bouwvergunningen.
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel6.2
  - number: 6.2.2
    text: |-
      Het bevoegd gezag kan burgemeester en wethouders van de gemeente of gemeenten waarin de woningen of andere
      geluidsgevoelige gebouwen zijn gelegen, voorts verzoeken met betrekking tot die woningen of gebouwen de gegevens te
      verstrekken waaruit blijkt of:
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel6.2
  - number: 6.2.2.a
    text: |-
      de verwachting bestaat dat zij binnen vijf jaar na de door het bevoegd gezag aangegeven datum zullen worden
      onteigend of dat de bewoning of het gebruik om andere redenen binnen die termijn zal worden gestaakt;
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel6.2
  - number: 6.2.2.b
    text: zij niet voor permanente bewoning bestemd zijn of daar niet voor worden gebruikt;
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel6.2
  - number: 6.2.2.c
    text: |-
      in geval van andere geluidsgevoelige gebouwen, zij niet als zodanig bestemd zijn of zij daar niet voor worden
      gebruikt;
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel6.2
  - number: 6.2.2.d
    text: zij behoren tot de categorieën woonwagens of woonschepen.
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel6.2
  - number: '6.3'
    text: |-
      De eigenaren en bewoners van de woningen of andere geluidsgevoelige gebouwen worden schriftelijk op de hoogte
      gesteld dat van overheidswege wordt overwogen geluidwerende voorzieningen aan te brengen.
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel6.3
  - number: 6.4.1
    text: |-
      Aan de eigenaren van de woningen of andere geluidsgevoelige gebouwen wordt verzocht binnen drie weken na de in
      [artikel 6.3][ref1] bedoelde schriftelijke mededeling, schriftelijk toestemming te verlenen tot het uitvoeren van
      een akoestisch en bouwtechnisch onderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0020445#Artikel6
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel6.4
    references:
      - id: ref1
        bwb_id: BWBR0020445
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.4.2
    text: |-
      Indien de in het eerste lid bedoelde toestemming niet volledig, niet binnen de gestelde termijn of niet voor
      de gehele woning of het ander geluidsgevoelige gebouw is verleend, wordt de betreffende eigenaren schriftelijk
      meegedeeld dat geen akoestisch en bouwtechnisch onderzoek kan worden uitgevoerd, tenzij deze schriftelijke
      toestemming binnen twee weken alsnog wordt verleend.
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel6.4
  - number: 6.4.3
    text: |-
      Indien ook de in het tweede lid bedoelde toestemming niet volledig, niet binnen de gestelde termijn of niet voor
      de gehele woning of het andere geluidsgevoelige gebouw is verleend, wordt de betreffende eigenaren schriftelijk
      meegedeeld dat geen geluidwerende voorzieningen worden aangebracht.
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel6.4
  - number: '6.5'
    text: |-
      Indien de in [artikel 6.4, eerste of tweede lid][ref1], bedoelde toestemming is verleend, stelt het bevoegd gezag
      een akoestisch en bouwtechnisch onderzoek in. Het onderzoek resulteert in ieder geval in:


      [ref1]: https://wetten.overheid.nl/BWBR0020445#Artikel6
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel6.5
    references:
      - id: ref1
        bwb_id: BWBR0020445
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.5.a
    text: een opgave van de geluidsgevoelige ruimten;
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel6.5
  - number: 6.5.b
    text: een inventarisatie van de benodigde bouwtechnische gegevens;
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel6.5
  - number: 6.5.c
    text: een opgave van de benodigde geluidwerende voorzieningen;
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel6.5
  - number: 6.5.d
    text: een raming van de kosten voor de overheid, en
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel6.5
  - number: 6.5.e
    text: een raming van de eventuele kosten voor de eigenaar.
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel6.5
  - number: 6.6.1
    text: |-
      De eigenaren van de woningen of andere geluidsgevoelige gebouwen ten aanzien waarvan uit het in [artikel 6.5][ref1]
      bedoelde onderzoek blijkt dat de volgende extra voorzieningen moeten worden getroffen, worden hiervan door het
      bevoegd gezag schriftelijk op de hoogte gesteld:


      [ref1]: https://wetten.overheid.nl/BWBR0020445#Artikel6
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel6.6
    references:
      - id: ref1
        bwb_id: BWBR0020445
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.6.1.a
    text: |-
      extra voorzieningen met betrekking tot het in overeenstemming brengen van de woning met de
      geluidweringvoorschriften ingevolge de [Woningwet 1962][ref1] of de [Woningwet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0002379
      [ref2]: https://wetten.overheid.nl/BWBR0005181
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel6.6
    references:
      - id: ref1
        bwb_id: BWBR0002379
      - id: ref2
        bwb_id: BWBR0005181
  - number: 6.6.1.b
    text: |-
      extra voorzieningen met betrekking tot het in overeenstemming brengen van de woning met de technische
      bouwvoorschriften die bij of krachtens het [Bouwbesluit 2012][ref1] inzake bestaande bouw worden gesteld, voor
      zover het betreft geluidsgevoelige ruimten of de bereikbaarheid daarvan;


      [ref1]: https://wetten.overheid.nl/BWBR0030461
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel6.6
    references:
      - id: ref1
        bwb_id: BWBR0030461
  - number: 6.6.1.c
    text: |-
      extra voorzieningen met betrekking tot het in overeenstemming brengen van het andere geluidsgevoelige gebouw met
      de technische bouwvoorschriften die bij of krachtens het [Bouwbesluit 2012][ref1] inzake bestaande bouw worden
      gesteld, voor zover het betreft geluidsgevoelige ruimten of de bereikbaarheid daarvan;


      [ref1]: https://wetten.overheid.nl/BWBR0030461
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel6.6
    references:
      - id: ref1
        bwb_id: BWBR0030461
  - number: 6.6.1.d
    text: voorzieningen met betrekking tot het opheffen van gebreken en van achterstallig onderhoud;
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel6.6
  - number: 6.6.1.e
    text: |-
      voorzieningen met betrekking tot het in overeenstemming brengen van de woning of het andere geluidsgevoelige gebouw
      met de mate van geluidwering die is behaald vanwege van rijkswege aangebrachte geluidwerende voorzieningen waarvan
      is gebleken dat deze zijn verwijderd of waarvan anderszins de werking ervan teniet is gedaan.
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel6.6
  - number: 6.6.2
    text: |-
      Aan de betreffende eigenaren wordt verzocht binnen drie weken na ontvangst van deze schriftelijke mededeling,
      schriftelijk te verklaren dat zij zich verplichten, om binnen een door het bevoegd gezag gestelde termijn,
      voorafgaand aan het aanbrengen van de geluidwerende voorzieningen de extra voorzieningen, bedoeld in het eerste
      lid, aan te brengen, tenzij toepassing wordt gevraagd van [artikel 6.7, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020445#Artikel6
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel6.6
    references:
      - id: ref1
        bwb_id: BWBR0020445
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.6.3
    text: |-
      Indien de in het tweede lid bedoelde schriftelijke verklaring niet volledig, niet binnen de gestelde termijn
      of niet voor de gehele woning is verleend, wordt de betreffende eigenaren schriftelijk meegedeeld dat geen
      geluidwerende voorzieningen worden aangebracht, tenzij de schriftelijke verklaring binnen twee weken alsnog wordt
      afgegeven.
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel6.6
  - number: 6.6.4
    text: |-
      Indien de verklaring ook binnen de in het derde lid gestelde termijn niet volledig, niet binnen de gestelde
      termijn of niet voor de gehele woning is afgegeven, wordt de betreffende eigenaren schriftelijk meegedeeld dat geen
      geluidwerende voorzieningen worden aangebracht.
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel6.6
  - number: 6.7.1
    text: |-
      Bij het afgeven van de verklaring, bedoeld in [artikel 6.6, tweede lid][ref1], kan de eigenaar verzoeken dat het
      treffen van de extra voorzieningen, bedoeld in [artikel 6.6, eerste lid][ref2], en het van overheidswege aanbrengen
      van geluidwerende voorzieningen, gelijktijdig plaatsvindt. Aan dit verzoek wordt gevolg gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0020445#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0020445#Artikel6
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel6.7
    references:
      - id: ref1
        bwb_id: BWBR0020445
        artikel: '6'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0020445
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.7.2
    text: |-
      Bij toepassing van het eerste lid blijven de kosten van het aanbrengen van de extra voorzieningen, bedoeld in
      [artikel 6.6, eerste lid][ref1], voor rekening van de betreffende eigenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0020445#Artikel6
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel6.7
    references:
      - id: ref1
        bwb_id: BWBR0020445
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.8.1
    text: |-
      De eigenaren van de woningen of andere geluidsgevoelige gebouwen, die op basis van het in [artikel 6.5][ref1]
      bedoelde akoestisch en bouwtechnisch onderzoek voor het van overheidswege aanbrengen van geluidwerende
      voorzieningen in aanmerking komen, ontvangen:


      [ref1]: https://wetten.overheid.nl/BWBR0020445#Artikel6
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel6.8
    references:
      - id: ref1
        bwb_id: BWBR0020445
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.8.1.a
    text: een aanbod met betrekking tot de aan te brengen geluidwerende voorzieningen en
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel6.8
  - number: 6.8.1.b
    text: |-
      indien toepassing wordt gevraagd van [artikel 6.6, eerste lid][ref1], een voorstel voor een overeenkomst met
      betrekking tot het aanbrengen van de extra voorzieningen, bedoeld in [artikel 6.6, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020445#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0020445#Artikel6
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel6.8
    references:
      - id: ref1
        bwb_id: BWBR0020445
        artikel: '6'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0020445
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.8.2
    text: |-
      Tevens wordt de betreffende eigenaren meegedeeld wanneer de geluidwerende voorzieningen naar verwachting zullen
      worden aangebracht.
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel6.8
  - number: 6.8.3
    text: |-
      Indien geen toepassing wordt gegeven aan [artikel 6.7, eerste lid][ref1], wordt het aanbod, bedoeld in het eerste
      lid, onder a, gedaan onder de voorwaarde dat de extra voorzieningen door de eigenaar worden aangebracht binnen de
      door het bevoegd gezag gestelde termijn, voorafgaand aan het aanbrengen van de geluidwerende voorzieningen.


      [ref1]: https://wetten.overheid.nl/BWBR0020445#Artikel6
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel6.8
    references:
      - id: ref1
        bwb_id: BWBR0020445
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.8.4
    text: |-
      De eigenaren van de woningen of andere geluidsgevoelige gebouwen, die op basis van het in [artikel 6.5][ref1]
      bedoelde akoestisch en bouwtechnisch onderzoek voor het van overheidswege aanbrengen van geluidwerende
      voorzieningen niet in aanmerking komen, worden hiervan schriftelijk op de hoogte gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0020445#Artikel6
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel6.8
    references:
      - id: ref1
        bwb_id: BWBR0020445
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.9.1
    text: |-
      Aan de eigenaren, bedoeld in [artikel 6.8, eerste lid][ref1], wordt verzocht binnen twee weken na het
      onherroepelijk worden van het aanbod en, indien van toepassing, de overeenkomst, door middel van ondertekening
      schriftelijk te verklaren dat:


      [ref1]: https://wetten.overheid.nl/BWBR0020445#Artikel6
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel6.9
    references:
      - id: ref1
        bwb_id: BWBR0020445
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.9.1.a
    text: |-
      zij voor alle geluidsgevoelige ruimten waar het aanbod betrekking op heeft, instemmen met de voorgestelde
      geluidwerende voorzieningen en toestemming geven tot het aanbrengen van de voorgestelde geluidwerende
      voorzieningen;
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel6.9
  - number: 6.9.1.b
    text: |-
      zij zich verbinden tot het aanbrengen van de extra voorzieningen, bedoeld in [artikel 6.6, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020445#Artikel6
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel6.9
    references:
      - id: ref1
        bwb_id: BWBR0020445
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.9.1.c
    text: |-
      indien toepassing is verzocht van [artikel 6.7, eerste lid][ref1], zij zich verbinden tot het betalen van de kosten
      die verband houden met het gelijktijdig aanbrengen van de extra voorzieningen.


      [ref1]: https://wetten.overheid.nl/BWBR0020445#Artikel6
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel6.9
    references:
      - id: ref1
        bwb_id: BWBR0020445
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.9.2
    text: |-
      Indien de in het eerste lid bedoelde ondertekening niet binnen de gestelde termijn heeft plaatsgevonden, wordt de
      betreffende eigenaren schriftelijk meegedeeld dat geen geluidwerende voorzieningen worden aangebracht, tenzij de
      ondertekening binnen twee weken na ontvangst van deze mededeling alsnog plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel6.9
  - number: 6.9.3
    text: |-
      Indien de verklaring ook niet binnen de in het tweede lid gestelde termijn heeft plaatsgevonden, wordt de
      betreffende eigenaren schriftelijk meegedeeld dat geen geluidwerende voorzieningen worden aangebracht.
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel6.9
  - number: 6.9.4
    text: |-
      Indien de eigenaar of de bewoner van de woning of het andere geluidsgevoelige gebouw zijn medewerking aan het
      akoestisch en bouwtechnisch onderzoek of het treffen van maatregelen onthoudt, wordt de eigenaar meegedeeld dat
      geen geluidwerende voorzieningen worden aangebracht.
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel6.9
  - number: '6.10'
    text: |-
      Na ontvangst van het ondertekende aanbod en, indien van toepassing, de ondertekende overeenkomst, besluit het
      bevoegd gezag tot het aanbrengen van de geluidwerende voorzieningen.
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel6.10
  - number: '7.1'
    text: |-
      Een melding krachtens [artikel 25, eerste lid, van het Besluit geluidhinder spoorwegen][ref1] zoals dat luidde voor
      het tijdstip van inwerkingtreding van dit besluit geldt als melding krachtens [artikel 4.17, eerste lid][ref2], van
      dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0004137#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0020445#Artikel4
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel7.1
    references:
      - id: ref1
        bwb_id: BWBR0004137
        artikel: '25'
      - id: ref2
        bwb_id: BWBR0020445
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '4.3'
  - number: '7.2'
    text: 'Ingetrokken worden:'
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel7.2
  - number: 7.2.a
    text: |-
      het [Besluit grenswaarden binnen zones rond industrieterreinen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003508
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel7.2
    references:
      - id: ref1
        bwb_id: BWBR0003508
  - number: 7.2.b
    text: |-
      het [Besluit grenswaarden binnen zones langs wegen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003459
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel7.2
    references:
      - id: ref1
        bwb_id: BWBR0003459
  - number: 7.2.c
    text: |-
      het [Besluit geluidhinder spoorwegen][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0004137
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel7.2
    references:
      - id: ref1
        bwb_id: BWBR0004137
  - number: 7.2.d
    text: |-
      het [Saneringsbesluit geluidhinder wegverkeer 1998][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009370
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel7.2
    references:
      - id: ref1
        bwb_id: BWBR0009370
  - number: '7.3'
    text: Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel7.3
  - number: '7.4'
    text: 'Dit besluit wordt aangehaald als: Besluit geluidhinder.'
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel7.4
