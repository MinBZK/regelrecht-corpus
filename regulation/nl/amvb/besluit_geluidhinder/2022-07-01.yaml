  - number: '4.8'
    text: |-
      1 Bij aanleg of vervanging van een spoorweg of een gedeelte van een spoorweg draagt de spoorwegexploitant ervoor
      zorg dat de geluidsemissie vanwege de nieuwe baanconstructie niet hoger wordt dan van een overeenkomstige spoorbaan
      waarvan de constructie bestaat uit langgelast spoor op houten dwarsliggers.

      2 Op verzoek van de spoorwegexploitant kan Onze Minister ontheffing verlenen van het eerste lid, indien toepassing
      van dat lid stuit op overwegende bezwaren van technische of financiële aard.
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel4.8
  - number: '4.9'
    text: |-
      1 Behoudens [artikel 4.10][ref1] is de ten hoogste toelaatbare geluidsbelasting, vanwege een spoorweg, van de gevel
      van woningen 55 dB, in geval van:

      a. aanleg van deze spoorweg, voor zover de woningen zijn gelegen binnen de zone van die spoorweg, bedoeld in
      [artikel 1.4][ref2];

      b. nog niet geprojecteerde woningen, voor zover de woningen zijn gelegen binnen de zone van die spoorweg, bedoeld
      in [artikel 1.4][ref3] of [artikel 1.4a][ref4].

      2 Behoudens [artikel 4.11][ref5] is de ten hoogste toelaatbare geluidsbelasting, vanwege een spoorweg, van de gevel
      van andere geluidsgevoelige gebouwen 53 dB, in geval van:

      a. aanleg van deze spoorweg, voor zover de andere geluidsgevoelige gebouwen zijn gelegen binnen de zone van die
      spoorweg, bedoeld in [artikel 1.4][ref6];

      b. nog niet geprojecteerde andere geluidsgevoelige gebouwen, voor zover de andere geluidsgevoelige gebouwen zijn
      gelegen binnen de zone van die spoorweg, bedoeld in [artikel 1.4][ref7] of [artikel 1.4a][ref8].

      3 Behoudens [artikel 4.12][ref9] is de ten hoogste toelaatbare geluidsbelasting, vanwege een spoorweg, aan de grens
      van geluidsgevoelige terreinen 55 dB, in geval van:

      a. aanleg van deze spoorweg, voor zover de geluidsgevoelige terreinen zijn gelegen binnen de zone van die spoorweg,
      bedoeld in [artikel 1.4][ref10];

      b. nog niet geprojecteerde geluidsgevoelige terreinen, voor zover de geluidsgevoelige terreinen zijn gelegen binnen
      de zone van die spoorweg, bedoeld in [artikel 1.4][ref11] of [artikel 1.4a][ref12].


