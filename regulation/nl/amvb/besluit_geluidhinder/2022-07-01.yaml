    text: |-
      toepassing van maatregelen die strekken tot vermindering van het geluid, veroorzaakt door het verkeer op de weg
      niet mogelijk is;
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel3.5
  - number: 3.5.2.b
    text: |-
      toepassing van maatregelen die strekken tot vermindering van de geluidsoverdracht van de weg naar
      de betrokken woningen niet mogelijk is of duurder zal zijn dan de maximale bijdrage die volgens
      [bijlage A, tabel 4, van de Subsidieregeling sanering verkeerslawaai][ref1] voor een woning mogelijk is;


      [ref1]: https://wetten.overheid.nl/BWBR0020731
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0020731
  - number: 3.5.2.c
    text: |-
      het onttrekken aan de bestemming van de betrokken woningen binnen het bedrag, bedoeld in onderdeel b, niet mogelijk
      is, en
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel3.5
  - number: 3.5.2.d
    text: |-
      koppeling van het treffen van maatregelen aan andere activiteiten niet kan leiden tot het terugbrengen van de
      geluidsbelasting, vanwege de weg, tot de in [artikel 90, derde lid, van de wet][ref1] genoemde waarde binnen het
      bedrag, bedoeld in onderdeel b.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel90
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '90'
  - number: 3.5.3
    text: |-
      Indien [artikel 110f, eerste lid, van de wet][ref1] van toepassing is, geeft Onze Minister slechts toepassing
      aan het eerste of tweede lid voor zover de gecumuleerde geluidsbelastingen na correctie op grond van
      [artikel 110f, derde lid, van de wet][ref2], niet leiden tot een naar zijn oordeel onaanvaardbare geluidsbelasting.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel110f
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel110f
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: 110f
      - id: ref2
        bwb_id: BWBR0003227
        artikel: 110f
  - number: 3.6.1
    text: |-
      De [artikelen 89][ref1], [90][ref2] en [98 van de wet][ref3] zijn met betrekking tot andere geluidsgevoelige
      gebouwen van overeenkomstige toepassing, met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel89
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel90
      [ref3]: https://wetten.overheid.nl/BWBR0003227#Artikel98
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel3.6
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '89'
      - id: ref2
        bwb_id: BWBR0003227
        artikel: '90'
      - id: ref3
        bwb_id: BWBR0003227
        artikel: '98'
  - number: 3.6.1.a
    text: |-
      het op te stellen saneringsprogramma maatregelen bevat die de geluidsbelasting vanwege de weg zoveel
      mogelijk beperken tot 48 dB op de gevel van andere geluidsgevoelige gebouwen en om zo nodig te voldoen aan
      [artikel 3.10, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020445#Artikel3
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel3.6
    references:
      - id: ref1
        bwb_id: BWBR0020445
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.3'
  - number: 3.6.1.b
    text: |-
      de met overeenkomstige toepassing van [artikel 90, tweede lid, van de wet][ref1] door Onze Minister vast te stellen
      ten hoogste toelaatbare waarde voor de geluidsbelasting, vanwege de weg, niet hoger mag worden vastgesteld dan:


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel90
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel3.6
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '90'
  - number: 3.6.1.b.1°
    text: 68 dB voor onderwijsgebouwen, ziekenhuizen of verpleeghuizen, en
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel3.6
  - number: 3.6.1.b.2°
    text: 58 dB voor verzorgingshuizen, psychiatrische inrichtingen en kinderdagverblijven.
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel3.6
  - number: 3.6.2
    text: |-
      Met betrekking tot andere geluidsgevoelige gebouwen is [artikel 3.5, eerste en derde lid][ref1], van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020445#Artikel3
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel3.6
    references:
      - id: ref1
        bwb_id: BWBR0020445
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.1.3
        afdeling: '3.1'
  - number: 3.7.1
    text: |-
      Een saneringsprogramma als bedoeld in [artikel 89, eerste lid, van de wet][ref1] kan uitsluitend maatregelen
      bevatten die strekken tot:


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel89
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel3.7
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '89'
  - number: 3.7.1.a
    text: vermindering van het geluid, veroorzaakt door het verkeer op de weg;
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel3.7
  - number: 3.7.1.b
    text: vermindering van de geluidsoverdracht van de weg naar de betrokken woningen of andere geluidsgevoelige gebouwen;
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel3.7
  - number: 3.7.1.c
    text: het aanbrengen van geluidwerende maatregelen aan de betrokken woningen of andere geluidsgevoelige gebouwen, of
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel3.7
  - number: 3.7.1.d
    text: onttrekking aan de bestemming van een of meer van de betrokken woningen of andere geluidsgevoelige gebouwen.
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel3.7
  - number: 3.7.2
    text: |-
      Maatregelen als bedoeld in het eerste lid, onder b, onder c, onderscheidenlijk onder d, komen eerst in aanmerking
      voor opneming in het saneringsprogramma, voor zover de toepassing van de in het eerste lid, onder a, onder a en
      b, onderscheidenlijk onder a, b en c genoemde maatregelen onvoldoende doeltreffend zal zijn dan wel overwegende
      bezwaren ontmoet van stedenbouwkundige, verkeerskundige, landschappelijke of financiële aard.
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel3.7
  - number: 3.8.1
    text: |-
      Een saneringsprogramma als bedoeld in [artikel 89, eerste lid, van de wet][ref1] bevat:


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel89
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel3.8
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '89'
  - number: 3.8.1.a
    text: |-
      de resultaten van het akoestisch onderzoek op grond van [artikel 88, eerste lid, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel88
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel3.8
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '88'
  - number: 3.8.1.b
    text: |-
      een of meer kaarten met bijbehorende verklaring als bedoeld in het vierde lid, een lijst met de adressen van de
      betrokken woningen of andere geluidsgevoelige gebouwen alsmede de naam en de verkeersfunctie van de weg waarvan de
      geluidsbelasting wordt ondervonden;
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel3.8
  - number: 3.8.1.c
    text: |-
      een beschrijving van de maatregelen als bedoeld in [artikel 3.7, eerste lid, aanhef, en onder a en b][ref1], die
      naar het oordeel van burgemeester en wethouders in aanmerking komen, en van het effect van deze maatregelen op de
      geluidsbelasting, vanwege de weg, van de gevel van de betrokken woningen of andere geluidsgevoelige gebouwen;


      [ref1]: https://wetten.overheid.nl/BWBR0020445#Artikel3
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel3.8
    references:
      - id: ref1
        bwb_id: BWBR0020445
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.2'
  - number: 3.8.1.d
    text: |-
      voor zover toepassing van de in [artikel 3.7, eerste lid, aanhef en onder a en b][ref1], bedoelde – in het
      saneringsprogramma opgenomen – maatregelen niet leidt tot beperking van de geluidsbelasting, vanwege de weg
      van de gevel van woningen of andere geluidsgevoelige gebouwen tot 48 dB, een beschrijving van de bezwaren van
      stedenbouwkundige, verkeerskundige, landschappelijke of financiële aard tegen de toepassing van verdergaande
      maatregelen en voorzover van toepassing de te treffen maatregelen;


      [ref1]: https://wetten.overheid.nl/BWBR0020445#Artikel3
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel3.8
    references:
      - id: ref1
        bwb_id: BWBR0020445
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.2'
  - number: 3.8.1.e
    text: |-
      zo nodig een verklaring dat door middel van maatregelen als bedoeld in [artikel 3.7, eerste lid, onder c][ref1],
      zal worden voldaan aan [artikel 111b, derde lid, van de wet][ref2], onderscheidenlijk [artikel 3.10][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0020445#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel111b
      [ref3]: https://wetten.overheid.nl/BWBR0020445#Artikel3
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel3.8
    references:
      - id: ref1
        bwb_id: BWBR0020445
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.2'
      - id: ref2
        bwb_id: BWBR0003227
        artikel: 111b
      - id: ref3
        bwb_id: BWBR0020445
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.3'
  - number: 3.8.1.f
    text: |-
      voor zover van toepassing, een beschrijving van de maatregelen, bedoeld in
      [artikel 3.7, eerste lid, onder d][ref1], alsmede een onderbouwing van deze keuze;


      [ref1]: https://wetten.overheid.nl/BWBR0020445#Artikel3
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel3.8
    references:
      - id: ref1
        bwb_id: BWBR0020445
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.2'
  - number: 3.8.1.g
    text: |-
      voor zover van de in de [artikel 3.7, eerste lid][ref1], bedoelde alfabetische rangorde van maatregelen is
      afgeweken, een beschrijving van de redenen waarom is afgeweken;


      [ref1]: https://wetten.overheid.nl/BWBR0020445#Artikel3
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel3.8
    references:
      - id: ref1
        bwb_id: BWBR0020445
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '3.2'
  - number: 3.8.1.h
    text: |-
      een beschrijving van de mogelijkheden om de uitvoering van de te treffen maatregelen te faseren, in welk geval bij
      een combinatie van maatregelen de volgorde wordt aangegeven;
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel3.8
  - number: 3.8.1.i
    text: |-
      een beschrijving van de mogelijkheden om uit een oogpunt van doelmatigheid en kostenbeheersing de te treffen
      maatregelen al dan niet gezamenlijk uit te voeren met andere werken;
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel3.8
  - number: 3.8.1.j
    text: |-
      de resultaten van het onderzoek, bedoeld in [artikel 110f, eerste lid, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel110f
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel3.8
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: 110f
  - number: 3.8.1.k
    text: een indicatie van de kosten van de te treffen maatregelen;
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel3.8
  - number: 3.8.1.l
    text: |-
      het tijdstip waarop met de uitvoering van de maatregelen kan worden begonnen, alsmede de verwachte duur van de
      uitvoering van de maatregelen.
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel3.8
  - number: 3.8.2
    text: |-
      In aanvulling op de in het het eerste lid bedoelde informatie, bevat een saneringsprogramma, dat ingevolge
      [artikel 98 van de wet][ref1] wordt vastgesteld:


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel98
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel3.8
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '98'
  - number: 3.8.2.a
    text: |-
      de resultaten van het akoestisch onderzoek op grond van [artikel 77 van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel77
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel3.8
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '77'
  - number: 3.8.2.b
    text: |-
      een beschrijving van de invloed van de uitvoering van de reconstructie op de aard en omvang van de voorgestelde
      maatregelen;
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel3.8
  - number: 3.8.2.c
    text: |-
      een indicatie van de verdeling van de kosten van de te treffen maatregelen over de maatregelen samenhangend met de
      sanering en de maatregelen ten gevolge van de reconstructie van de weg;
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel3.8
  - number: 3.8.2.d
    text: |-
      het tijdstip waarop naar verwachting met de uitvoering van de reconstructie kan worden begonnen, alsmede de
      verwachte duur van de uitvoering;
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel3.8
  - number: 3.8.2.e
    text: |-
      indien de maatregelen niet gelijktijdig met de uitvoering van de reconstructie zullen worden uitgevoerd, het
      tijdstip waarop met de uitvoering van de maatregelen zal worden begonnen, alsmede de verwachte duur van de
      uitvoering ervan.
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel3.8
  - number: 3.8.3
    text: 'De kaart of de kaarten, bedoeld in het eerste lid, onder b, geven in elk geval aan:'
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel3.8
  - number: 3.8.3.a
    text: de zone langs de weg of wegen en de ligging van de betrokken woningen of andere geluidsgevoelige gebouwen;
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel3.8
  - number: 3.8.3.b
    text: bronmaatregelen of overdrachtsmaatregelen, en
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel3.8
  - number: 3.8.3.c
    text: 'voor zover hiervan sprake is, de ligging van de betrokken woningen of andere geluidsgevoelige gebouwen binnen:'
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel3.8
  - number: 3.8.3.c.1°
    text: een geluidszone rond een industrieterrein,
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel3.8
  - number: 3.8.3.c.2°
    text: een geluidszone langs een spoorweg,
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel3.8
  - number: 3.8.3.c.3°
    text: een andere geluidszone, of
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel3.8
  - number: 3.8.3.c.4°
    text: |-
      een met het oog op de geluidsbelasting vastgesteld beperkingengebied als bedoeld in [hoofdstuk 8, titel 8A.6][ref1]
      of [artikel 10.17 van de Wet luchtvaart][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005555
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel10
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel3.8
    references:
      - id: ref1
        bwb_id: BWBR0005555
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '10'
  - number: 3.8.4
    text: 'De kaart of kaarten, bedoeld in het derde lid, worden ingericht met inachtneming van de volgende voorschriften:'
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel3.8
  - number: 3.8.4.a
    text: de kaarten worden getekend op een duidelijke ondergrond;
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel3.8
  - number: 3.8.4.b
    text: |-
      de begrenzing van het gebied waarop het plan betrekking heeft, wordt met een duidelijke lijn op de kaarten
      aangegeven;
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel3.8
  - number: 3.8.4.c
    text: |-
      de kaarten worden vervaardigd op een schaal van ten minste 1 op 10 000, tenzij de omvang van het gebied of de aard
      van het plan een andere schaal noodzakelijk maakt;
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel3.8
  - number: 3.8.4.d
    text: uit de kaarten moet blijken de aansluiting van het in het plan begrepen gebied aan het daaromheen gelegen gebied;
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel3.8
  - number: 3.8.4.e
    text: |-
      voor zover in het plan gronden zijn begrepen waarvan de bestemming in de naaste toekomst voor verwezenlijking
      in aanmerking komt, worden deze gedeelten vervat in één of meer kaarten op een schaal van ten minste 1 op 2500,
      waarop voorts de kadastrale grenzen, sectie en nummers van de in deze gedeelten van het plan begrepen percelen
      zijn aangegeven;
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel3.8
  - number: 3.8.4.f
    text: |-
      indien een bestemmingsplan uit meerdere kaarten bestaat, moet uit een overzichtskaart de aansluiting van de kaarten
      onderling en de aansluiting aan het daaromheen gelegen gebied blijken;
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel3.8
  - number: 3.8.4.g
    text: op de kaarten worden de schaal en de noordpijl aangegeven;
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel3.8
  - number: 3.8.4.h
    text: |-
      op de kaarten worden de bestaande gebouwen en de namen van de belangrijkste wegen, straten en waterwegen
      aangegeven.
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel3.8
  - number: '3.9'
    text: |-
      Onze Minister stelt bij ministeriële regeling nadere regels vast met betrekking tot de vormgeving en inrichting van
      een saneringsprogramma als bedoeld in [artikel 89, eerste lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel89
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel3.9
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '89'
  - number: 3.10.1
    text: |-
      Indien met toepassing van [artikel 85 van de wet][ref1] of [artikel 3.4][ref2] met betrekking tot een gevel van
      een in aanbouw zijnd of aanwezig ander geluidsgevoelig gebouw een hogere geluidsbelasting dan 48 dB vanwege de
      weg als de ten hoogste toelaatbare is vastgesteld, treffen burgemeester en wethouders behoudens het derde lid met
      betrekking tot de geluidwering van die gevel maatregelen om te bevorderen dat de geluidsbelasting, vanwege die weg,
      bij gesloten ramen,


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel85
      [ref2]: https://wetten.overheid.nl/BWBR0020445#Artikel3
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel3.10
    references:
