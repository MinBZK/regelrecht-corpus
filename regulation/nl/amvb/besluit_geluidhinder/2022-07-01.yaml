  - number: '4.13'
    text: |-
      1 Behoudens het tweede en derde lid is de ten hoogste toelaatbare geluidsbelasting vanwege een te wijzigen spoorweg
      van de gevel van woningen binnen de zone van die spoorweg, bedoeld in [artikel 1.4][ref1], 55 dB.

      2 Indien eerder bij of krachtens de [wet][ref2] of de [Interimwet stad-en-milieubenadering][ref3] een hogere waarde
      voor de ten hoogste toelaatbare geluidsbelasting, vanwege de te wijzigen spoorweg, van de gevel van woningen is
      vastgesteld dan 55 dB en de heersende geluidsbelasting hoger is dan 55 dB, geldt de laagste van de volgende twee
      waarden als de ten hoogste toelaatbare:

      a. de waarde van de geluidsbelasting op het tijdstip waarop met de wijziging een aanvang wordt gemaakt;

      b. de eerder vastgestelde waarde.

      3 Indien niet eerder bij of krachtens de [wet][ref4] of de [Interimwet stad-en-milieubenadering][ref5] een
      hogere waarde voor de ten hoogste toelaatbare geluidsbelasting vanwege de te wijzigen spoorweg van de gevel van
      woningen binnen de zone van die spoorweg, bedoeld in [artikel 1.4][ref6], is vastgesteld dan 55 dB en de heersende
      geluidsbelasting hoger is dan 55 dB, geldt als de ten hoogste toelaatbare geluidsbelasting, vanwege de te wijzigen
      spoorweg, van de gevel van die woningen de laagste van de volgende waarden:

      a. de waarde van de geluidsbelasting op 1 juli 1987;

      b. de waarde van de geluidsbelasting op het tijdstip waarop met de wijziging een aanvang wordt gemaakt.

      4 Het eerste lid is niet van toepassing op woningen ten aanzien waarvan met toepassing van
      [artikel 2.12, eerste lid, onder a, onder 2° of 3°, van de Wet algemene bepalingen omgevingsrecht][ref7]
      een omgevingsvergunning is verleend waarbij voor de duur van ten hoogste tien jaar is afgeweken van het
      bestemmingsplan.


