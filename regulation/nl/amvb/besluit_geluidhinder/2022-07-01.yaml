  - number: '5.3'
    text: |-
      1 Behoudens bij toepassing van [artikel 4.7][ref1] kan een verzoek als bedoeld in
      [artikel 110a, derde lid, van de wet][ref2] met betrekking tot een zone langs een spoorweg als bedoeld in
      [artikel 1.4][ref3] en, voor zover het de aanleg van nog niet geprojecteerde woningen, andere geluidsgevoelige
      gebouwen en geluidsgevoelige terreinen betreft, als bedoeld in [artikel 1.4a][ref4], worden gedaan door:

      a. burgemeester en wethouders van de gemeente waarin de woningen, de andere geluidsgevoelige gebouwen of de
      geluidsgevoelige terreinen gesitueerd zijn of worden, waarvoor de hogere waarde verzocht wordt;

      b. burgemeester en wethouders van de gemeente waarin de spoorweg gesitueerd is of wordt, waarvoor de hogere waarde
      verzocht wordt;

      c. de spoorwegexploitant, indien het betreft de aanleg of wijziging van een spoorweg.

      2 Bij toepassing van [artikel 4.7][ref5] wordt een verzoek als bedoeld in het eerste lid gedaan door de
      spoorwegexploitant.


      [ref1]: https://wetten.overheid.nl/BWBR0020445#Artikel4.7
