  - number: 4.9.2
    text: |-
      Behoudens [artikel 4.11][ref1] is de ten hoogste toelaatbare geluidsbelasting, vanwege een spoorweg, van de gevel
      van andere geluidsgevoelige gebouwen 53 dB, in geval van:


      [ref1]: https://wetten.overheid.nl/BWBR0020445#Artikel4
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel4.9
