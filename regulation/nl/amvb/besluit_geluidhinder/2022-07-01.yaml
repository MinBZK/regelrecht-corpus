  - number: '4.4'
    text: |-
      Tot aanleg of wijziging van een spoorweg, anders dan op grondslag van een overeenkomstig [artikel 4.1][ref1] of
      [4.3][ref2] vastgesteld of herzien bestemmingsplan of een vergunning als bedoeld in [artikel 4.2][ref3], wordt,
      indien binnen de aanwezige of toekomstige zone, bedoeld in [artikel 1.4][ref4], woningen, andere geluidsgevoelige
      gebouwen of geluidsgevoelige terreinen aanwezig, in aanbouw of geprojecteerd zijn, niet overgegaan dan in
      overeenstemming met een vergunning van burgemeester en wethouders krachtens [artikel 4.6, eerste lid][ref5],
      genomen naar aanleiding van een door de spoorwegexploitant aan burgemeester en wethouders gedane mededeling van
      zijn voornemen en na een overeenkomstig [artikel 4.5][ref6] ingesteld onderzoek.


