  - number: '4.18'
    text: |-
      1 Behoudens het derde lid stellen burgemeester en wethouders met inachtneming van de
      [artikelen 4.20 tot en met 4.23][ref1] een programma van maatregelen op, die naar hun oordeel in aanmerking komen
      om de geluidsbelasting, vanwege de spoorweg, van de gevel van de voor 1 januari 2007 aan Onze Minister gemelde
      woningen en andere geluidsgevoelige gebouwen, zoveel mogelijk te beperken tot 55 dB en om zo nodig te voldoen aan
      [artikel 4.25][ref2].

      2 In een geval als bedoeld in [artikel 4.7][ref3] wordt vanwege de spoorwegexploitant een akoestisch onderzoek
      ingesteld van de in [artikel 4.3][ref4] omschreven strekking.

      3 In een geval als bedoeld in [artikel 4.7][ref5] stelt de spoorwegexploitant een saneringsprogramma op, met dien
      verstande dat dit saneringsprogramma tevens de resultaten van het in het tweede lid bedoelde akoestisch onderzoek
      bevat en mede betrekking heeft op andere binnen de zone van de spoorweg, bedoeld in [artikel 1.4][ref6], gelegen
      woningen en andere geluidsgevoelige gebouwen.

      4 Het eerste lid is niet van toepassing op woningen en andere
      geluidsgevoelige gebouwen ten aanzien waarvan met toepassing van
      [artikel 2.12, eerste lid, onder a, onder 2° of 3°, van de Wet algemene bepalingen omgevingsrecht][ref7]
      een omgevingsvergunning is verleend waarbij voor de duur van ten hoogste tien jaar is afgeweken van het
      bestemmingsplan.


