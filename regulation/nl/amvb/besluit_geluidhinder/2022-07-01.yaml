  - number: '2.2'
    text: |-
      Een krachtens de [artikelen 47, tweede lid][ref1], [54][ref2] of [59 van de wet][ref3] vast te stellen hogere
      waarde dan de in [artikel 2.1][ref4] genoemde waarde voor de ten hoogst toelaatbare geluidsbelasting vanwege het
      industrieterrein, mag niet hoger worden vastgesteld dan:

      a. 60 dB(A) voor onderwijsgebouwen, ziekenhuizen of verpleeghuizen;

      b. 55 dB(A) voor verzorgingshuizen, psychiatrische inrichtingen en kinderdagverblijven;

      c. 55 dB(A) voor geluidsgevoelige terreinen.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel54
      [ref3]: https://wetten.overheid.nl/BWBR0003227#Artikel59
      [ref4]: https://wetten.overheid.nl/BWBR0020445#Artikel2.1
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel2.2
