    text: |-
      aanleg van deze spoorweg, voor zover de andere geluidsgevoelige gebouwen zijn gelegen binnen de zone van die
      spoorweg, bedoeld in [artikel 1.4][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020445#Artikel1
