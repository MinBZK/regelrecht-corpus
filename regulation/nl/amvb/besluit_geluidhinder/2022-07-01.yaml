  - number: '7.2'
    text: |-
      Ingetrokken worden:

      a. het [Besluit grenswaarden binnen zones rond industrieterreinen][ref1];

      b. het [Besluit grenswaarden binnen zones langs wegen][ref2];

      c. het [Besluit geluidhinder spoorwegen][ref3], en

      d. het [Saneringsbesluit geluidhinder wegverkeer 1998][ref4].


