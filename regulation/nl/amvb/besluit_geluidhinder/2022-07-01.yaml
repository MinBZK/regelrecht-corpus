      [artikelen 110a][ref2], [110b][ref3] en [110c van de wet][ref4] voorzover de gecumuleerde geluidsbelastingen na
      de correctie op grond van [artikel 110f van de wet][ref5] niet leiden tot een naar zijn oordeel onaanvaardbare
      geluidsbelasting.


