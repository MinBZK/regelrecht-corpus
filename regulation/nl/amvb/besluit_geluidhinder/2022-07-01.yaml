  - number: 4.8.1
    text: |-
      Bij aanleg of vervanging van een spoorweg of een gedeelte van een spoorweg draagt de spoorwegexploitant ervoor
      zorg dat de geluidsemissie vanwege de nieuwe baanconstructie niet hoger wordt dan van een overeenkomstige spoorbaan
      waarvan de constructie bestaat uit langgelast spoor op houten dwarsliggers.
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel4.8
  - number: 4.8.2
    text: |-
      Op verzoek van de spoorwegexploitant kan Onze Minister ontheffing verlenen van het eerste lid, indien toepassing
      van dat lid stuit op overwegende bezwaren van technische of financiële aard.
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel4.8
  - number: 4.9.1
    text: |-
      Behoudens [artikel 4.10][ref1] is de ten hoogste toelaatbare geluidsbelasting, vanwege een spoorweg, van de gevel
      van woningen 55 dB, in geval van:


      [ref1]: https://wetten.overheid.nl/BWBR0020445#Artikel4
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel4.9
    references:
