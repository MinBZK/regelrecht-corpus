    text: |-
      burgemeester en wethouders van de gemeente waarin de woningen, de andere geluidsgevoelige gebouwen of de
      geluidsgevoelige terreinen gesitueerd zijn of worden, waarvoor de hogere waarde verzocht wordt;
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel5.3
  - number: 5.3.1.b
    text: |-
      burgemeester en wethouders van de gemeente waarin de spoorweg gesitueerd is of wordt, waarvoor de hogere waarde
      verzocht wordt;
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel5.3
  - number: 5.3.1.c
    text: de spoorwegexploitant, indien het betreft de aanleg of wijziging van een spoorweg.
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel5.3
  - number: 5.3.2
    text: |-
      Bij toepassing van [artikel 4.7][ref1] wordt een verzoek als bedoeld in het eerste lid gedaan door de
      spoorwegexploitant.


      [ref1]: https://wetten.overheid.nl/BWBR0020445#Artikel4
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel5.3
