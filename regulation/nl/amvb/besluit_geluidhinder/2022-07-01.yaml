  - number: '2.3'
    text: |-
      De [artikelen 62][ref1] en [63 van de wet][ref2] zijn met betrekking tot andere geluidsgevoelige
      gebouwen van overeenkomstige toepassing, met dien verstande dat de met overeenkomstige toepassing van
      [artikel 63, tweede lid, van de wet][ref3] door Onze Minister vast te stellen ten hoogste toelaatbare waarde voor
      de geluidsbelasting, vanwege het industrieterrein, niet hoger mag worden vastgesteld dan:

      a. 65 dB(A) voor onderwijsgebouwen, ziekenhuizen of verpleeghuizen, en

      b. 60 dB(A) voor verzorgingshuizen, psychiatrische inrichtingen en kinderdagverblijven.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel62
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel63
      [ref3]: https://wetten.overheid.nl/BWBR0003227#Artikel63
