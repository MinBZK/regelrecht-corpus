    text: |-
      aanleg van deze spoorweg, voor zover de woningen zijn gelegen binnen de zone van die spoorweg, bedoeld in
      [artikel 1.4][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020445#Artikel1
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel4.9
