  - number: '6.8'
    text: |-
      1 De eigenaren van de woningen of andere geluidsgevoelige gebouwen, die op basis van het in [artikel 6.5][ref1]
      bedoelde akoestisch en bouwtechnisch onderzoek voor het van overheidswege aanbrengen van geluidwerende
      voorzieningen in aanmerking komen, ontvangen:

      a. een aanbod met betrekking tot de aan te brengen geluidwerende voorzieningen en

      b. indien toepassing wordt gevraagd van [artikel 6.6, eerste lid][ref2], een voorstel voor een overeenkomst met
      betrekking tot het aanbrengen van de extra voorzieningen, bedoeld in [artikel 6.6, eerste lid][ref3].

      2 Tevens wordt de betreffende eigenaren meegedeeld wanneer de geluidwerende voorzieningen naar verwachting zullen
      worden aangebracht.

      3 Indien geen toepassing wordt gegeven aan [artikel 6.7, eerste lid][ref4], wordt het aanbod, bedoeld in het eerste
      lid, onder a, gedaan onder de voorwaarde dat de extra voorzieningen door de eigenaar worden aangebracht binnen de
      door het bevoegd gezag gestelde termijn, voorafgaand aan het aanbrengen van de geluidwerende voorzieningen.

      4 De eigenaren van de woningen of andere geluidsgevoelige gebouwen, die op basis van het in [artikel 6.5][ref5]
      bedoelde akoestisch en bouwtechnisch onderzoek voor het van overheidswege aanbrengen van geluidwerende
      voorzieningen niet in aanmerking komen, worden hiervan schriftelijk op de hoogte gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0020445#Artikel6.5
      [ref2]: https://wetten.overheid.nl/BWBR0020445#Artikel6.6
      [ref3]: https://wetten.overheid.nl/BWBR0020445#Artikel6.6
      [ref4]: https://wetten.overheid.nl/BWBR0020445#Artikel6.7
      [ref5]: https://wetten.overheid.nl/BWBR0020445#Artikel6.5
