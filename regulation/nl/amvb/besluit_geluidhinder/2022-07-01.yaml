        bwb_id: BWBR0020445
        artikel: '1'
        hoofdstuk: '1'
  - number: 4.25.2.b
    text: |-
      in het eerste lid, onder b, bedoelde geval in verblijfsruimten als genoemd in
      [artikel 1.1, eerste lid, onderdeel d, onder 4° en 5°][ref1], binnen het andere geluidsgevoelige gebouw 33 dB,
      dan wel een door burgemeester en wethouders geoordeelde hogere waarde van ten hoogste 38 dB, niet te boven zal
      gaan.


      [ref1]: https://wetten.overheid.nl/BWBR0020445#Artikel1
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel4.25
    references:
