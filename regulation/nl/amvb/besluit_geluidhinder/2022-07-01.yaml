  - number: '4.19'
    text: |-
      1 Een saneringsprogramma als bedoeld in [artikel 4.18][ref1] kan uitsluitend de volgende maatregelen bevatten:

      a. geluidreducerende maatregelen aan een spoorweg;

      b. maatregelen die de geluidsoverdracht van een spoorweg naar woningen en andere geluidsgevoelige gebouwen
      verminderen;

      c. geluidwerende maatregelen aan de gevel van de betrokken woningen of andere geluidsgevoelige gebouwen;

      d. onttrekking aan de bestemming van één of meer van de betrokken woningen.

      2 Maatregelen als bedoeld in het eerste lid, onder b, onder c, onderscheidenlijk onder d, komen eerst in aanmerking
      voor opneming in het saneringsprogramma, voor zover de toepassing van de in het eerste lid, onder a, genoemde
      maatregelen, onderscheidenlijk de in het eerste lid, onder a en b, dan wel onder a, b en c, genoemde maatregelen
      onvoldoende doeltreffend zal zijn, dan wel overwegende bezwaren ontmoeten van stedenbouwkundige, verkeerskundige,
      landschappelijke of financiële aard.


      [ref1]: https://wetten.overheid.nl/BWBR0020445#Artikel4.18
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel4.19
