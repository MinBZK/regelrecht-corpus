        artikel: '1'
        hoofdstuk: '1'
      - id: ref3
        bwb_id: BWBR0020445
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '4.3'
  - number: 4.7.2
    text: |-
      Onze Minister stelt in een geval als bedoeld in het eerste lid met in achtneming van de [artikelen 4.13][ref1] en
      [4.14][ref2] ook voor de gevel van andere dan de in dat lid bedoelde woningen en andere geluidsgevoelige gebouwen
      en aan de grens van andere dan de in dat lid bedoelde geluidsgevoelige terreinen binnen de zone van die spoorweg,
      bedoeld in [artikel 1.4][ref3], de ten hoogste toelaatbare waarde van de geluidsbelasting vanwege de spoorweg vast.


      [ref1]: https://wetten.overheid.nl/BWBR0020445#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020445#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0020445#Artikel1
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel4.7
    references:
