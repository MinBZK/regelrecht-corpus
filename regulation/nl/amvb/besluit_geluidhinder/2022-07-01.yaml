  - number: '6.9'
    text: |-
      1 Aan de eigenaren, bedoeld in [artikel 6.8, eerste lid][ref1], wordt verzocht binnen twee weken na het
      onherroepelijk worden van het aanbod en, indien van toepassing, de overeenkomst, door middel van ondertekening
      schriftelijk te verklaren dat:

      a. zij voor alle geluidsgevoelige ruimten waar het aanbod betrekking op heeft, instemmen met de voorgestelde
      geluidwerende voorzieningen en toestemming geven tot het aanbrengen van de voorgestelde geluidwerende
      voorzieningen;

      b. zij zich verbinden tot het aanbrengen van de extra voorzieningen, bedoeld in [artikel 6.6, eerste lid][ref2];

      c. indien toepassing is verzocht van [artikel 6.7, eerste lid][ref3], zij zich verbinden tot het betalen van de
      kosten die verband houden met het gelijktijdig aanbrengen van de extra voorzieningen.

      2 Indien de in het eerste lid bedoelde ondertekening niet binnen de gestelde termijn heeft plaatsgevonden, wordt
      de betreffende eigenaren schriftelijk meegedeeld dat geen geluidwerende voorzieningen worden aangebracht, tenzij de
      ondertekening binnen twee weken na ontvangst van deze mededeling alsnog plaatsvindt.

      3 Indien de verklaring ook niet binnen de in het tweede lid gestelde termijn heeft plaatsgevonden, wordt de
      betreffende eigenaren schriftelijk meegedeeld dat geen geluidwerende voorzieningen worden aangebracht.

      4 Indien de eigenaar of de bewoner van de woning of het andere geluidsgevoelige gebouw zijn medewerking aan het
      akoestisch en bouwtechnisch onderzoek of het treffen van maatregelen onthoudt, wordt de eigenaar meegedeeld dat
      geen geluidwerende voorzieningen worden aangebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0020445#Artikel6.8
      [ref2]: https://wetten.overheid.nl/BWBR0020445#Artikel6.6
      [ref3]: https://wetten.overheid.nl/BWBR0020445#Artikel6.7
