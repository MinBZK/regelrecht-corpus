  - number: '3.1'
    text: |-
      1 In geval van aanleg van een weg is de ten hoogste toelaatbare geluidsbelasting, vanwege die weg, van de gevel van
      andere geluidsgevoelige gebouwen en aan de grens van geluidsgevoelige terreinen binnen de zone van die weg, 48 dB.

      2 Het eerste lid is van overeenkomstige toepassing op nog niet aanwezige andere geluidgevoelige gebouwen en
      geluidsgevoelige terreinen, indien deze worden geprojecteerd binnen de zone van een weg.
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel3.1
  - number: '3.2'
    text: |-
      1 Een krachtens [artikel 85 van de wet][ref1] vast te stellen hogere waarde dan de in [artikel 3.1][ref2] genoemde
      waarde voor de ten hoogst toelaatbare geluidsbelasting, vanwege een weg, mag niet hoger worden vastgesteld dan:

      a. 58 dB voor andere geluidsgevoelige gebouwen in buitenstedelijk gebied;

      b. 63 dB voor andere geluidsgevoelige gebouwen in stedelijk gebied;

      c. 53 dB voor geluidsgevoelige terreinen.

      2 Het eerste lid is van overeenkomstige toepassing op nog niet aanwezige andere geluidsgevoelige gebouwen en
      geluidsgevoelige terreinen indien deze worden geprojecteerd binnen de zone van een weg, met dien verstande dat de
      waarde niet hoger mag worden vastgesteld dan 53 dB voor andere geluidsgevoelige gebouwen in buitenstedelijk gebied.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel85
      [ref2]: https://wetten.overheid.nl/BWBR0020445#Artikel3.1
