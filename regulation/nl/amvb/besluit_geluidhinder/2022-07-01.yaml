  - number: '1.6'
    text: |-
      1 Bij de bepaling van de geluidsbelasting vanwege een industrieterrein, vanwege een weg of vanwege een spoorweg,
      van de gevel van onderwijsgebouwen en kinderdagverblijven wordt de waarde van de geluidsbelasting over de periode
      19.00–23.00 uur (avond) of de periode 23.00–07.00 uur (nacht) buiten beschouwing gelaten, voor zover deze gebouwen
      in de betrokken periode niet overeenkomstig hun bestemming worden gebruikt.

      2 De geluidsbelasting L vanwege een industrieterrein, vanwege een weg of vanwege een spoorweg is niet van
      toepassing ten aanzien van de gevel van onderwijsgebouwen en kinderdagverblijven, voor zover deze gebouwen in de
      betrokken periode niet overeenkomstig hun bestemming worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel1.6
  - number: '2.1'
    text: |-
      Behoudens de [artikelen 65][ref1] en [66 van de wet][ref2] en [artikel 2.2][ref3] is de ten hoogste toelaatbare
      geluidsbelasting, vanwege het industrieterrein, van de gevel van andere geluidsgevoelige gebouwen binnen de zone
      van dat industrieterrein en aan de grens van binnen de zone van dat industrieterrein gelegen geluidsgevoelige
      terreinen 50 dB(A).


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel65
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel66
      [ref3]: https://wetten.overheid.nl/BWBR0020445#Artikel2.2
