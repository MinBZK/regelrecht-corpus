  - number: '4.14'
    text: |-
      1 Voor de ten hoogste toelaatbare geluidsbelasting vanwege een spoorweg van de gevel van woningen kan een hogere
      waarde dan de ingevolge [artikel 4.13][ref1] geldende waarde worden vastgesteld, met dien verstande dat deze waarde
      71 dB niet te boven mag gaan.

      2 Indien reeds eerder een hogere waarde voor de ten hoogste toelaatbare geluidsbelasting is vastgesteld dan de in
      het eerste lid bedoelde waarde, dan is de in dat lid bedoelde waarde, die eerder vastgestelde waarde.


