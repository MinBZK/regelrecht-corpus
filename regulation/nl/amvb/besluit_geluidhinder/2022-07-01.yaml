  - number: 5.4.2
    text: |-
      Het verzoek gaat vergezeld van een of meer kaarten met bijbehorende verklaring. Met betrekking tot deze kaart
      of kaarten is [artikel 3.8, vierde lid][ref1], van overeenkomstige toepassing. De kaart of kaarten geven
      bovendien de ligging weer van aanwezige of toekomstige geluidszones als bedoeld in de [artikelen 40][ref2],
      [52][ref3], [74][ref4] en [108 van de wet][ref5] en [artikel 1.4a][ref6], alsmede de met het oog op
      de geluidsbelasting vastgestelde beperkingengebieden als bedoeld in [hoofdstuk 8, titel 8A.6][ref7] of
      [artikel 10.17 van de Wet luchtvaart][ref8] en de in die zones of beperkingengebieden voorkomende gebieden,
      aangewezen overeenkomstig [artikel 1.2, tweede lid, onder b, van de Wet milieubeheer][ref9], voor zover de
      woningen, andere geluidsgevoelige gebouwen of geluidsgevoelige terreinen waarop het verzoek betrekking heeft,
      binnen zodanige zones of gebieden zijn of worden gesitueerd.


