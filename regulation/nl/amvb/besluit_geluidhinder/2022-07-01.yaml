  - number: '4.3'
    text: |-
      1 Bij het voorbereiden van de vaststelling of herziening van een bestemmingsplan of van een wijzigings- of
      uitwerkingsplan dat geheel of gedeeltelijk betrekking heeft op gronden behorende tot een zone als bedoeld
      in [artikel 1.4][ref1] of [artikel 1.4a][ref2] of bij de voorbereiding van een besluit als bedoeld in
      [artikel 4.2][ref3], wordt vanwege burgemeester en wethouders, onderscheidenlijk gedeputeerde staten of Onze
      Minister een akoestisch onderzoek ingesteld naar:

      a. de geluidsbelasting die door woningen, andere geluidsgevoelige gebouwen of geluidsgevoelige terreinen
      binnen de toekomstige zone vanwege de spoorweg zou worden ondervonden, zonder de invloed van maatregelen die de
      geluidsbelasting beperken;

      b. de doeltreffendheid van de in aanmerking komende maatregelen om te voorkomen dat de in de toekomst
      vanwege de spoorweg optredende geluidsbelasting van de onder a bedoelde objecten de waarden die ingevolge de
      [artikelen 4.9][ref4], [4.13][ref5] en [4.15][ref6], juncto [4.13][ref7] als de ten hoogste toelaatbaar worden
      aangemerkt, te boven zou gaan.

      2 Indien wordt overwogen toepassing te geven aan de [artikelen 4.10 tot en met 4.12][ref8], [4.14][ref9] en
      [4.15][ref10] juncto [4.14][ref11] heeft het akoestisch onderzoek tevens betrekking op de doeltreffendheid van de
      maatregelen om te voldoen aan de vast te stellen hogere waarden voor de ten hoogste toelaatbare geluidsbelasting.

      3 Indien de vaststelling of herziening van het bestemmingsplan of van een wijzigings- of uitwerkingsplan of de
      vergunning bedoeld in [artikel 4.2][ref12], betrekking heeft op een wijziging van een spoorweg, wordt tevens
      akoestisch onderzoek ingesteld naar de heersende waarde.


