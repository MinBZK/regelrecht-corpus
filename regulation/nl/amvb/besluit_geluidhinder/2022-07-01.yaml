  - number: 4.9.3
    text: |-
      Behoudens [artikel 4.12][ref1] is de ten hoogste toelaatbare geluidsbelasting, vanwege een spoorweg, aan de grens
      van geluidsgevoelige terreinen 55 dB, in geval van:


      [ref1]: https://wetten.overheid.nl/BWBR0020445#Artikel4
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel4.9
