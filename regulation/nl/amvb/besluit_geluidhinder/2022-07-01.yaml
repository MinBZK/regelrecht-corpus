  - number: '4.1'
    text: |-
      1 Bij de vaststelling of herziening van een bestemmingsplan of van een wijzigings- of uitwerkingsplan dat
      geheel of gedeeltelijk betrekking heeft op gronden, behorende tot een zone als bedoeld in [artikel 1.4][ref1] of
      [artikel 1.4a][ref2], worden ter zake van de geluidsbelasting, vanwege de spoorweg waarlangs de zone ligt, van
      de gevel van woningen, andere geluidsgevoelige gebouwen en aan de grens van geluidsgevoelige terreinen binnen
      die zone, de waarden in acht genomen die ingevolge de [artikelen 4.9][ref3], [4.13][ref4] en [4.15][ref5] juncto
      [4.13][ref6] als de ten hoogste toelaatbare worden aangemerkt.

      2 In afwijking van het eerste lid worden bij de vaststelling of herziening van een bestemmingsplan of van een
      wijzigings- of uitwerkingsplan hogere waarden in acht genomen, voor zover:

      a. met toepassing van de [artikelen 4.10 tot en met 4.12][ref7], [4.14][ref8] en [4.15][ref9] juncto [4.14][ref10],
      voor de vaststelling of herziening van het bestemmingsplan zodanige waarden zijn vastgesteld, dan wel

      b. zodanige waarden noodzakelijk zijn als gevolg van een vaststelling of herziening van het plan in afwijking
      van het ontwerp, zoals dit ter inzage heeft gelegen, welke waarden redelijkerwijs met toepassing van de
      [artikelen 4.10 tot en met 4.12][ref11], [4.14][ref12] en [4.15][ref13] juncto [4.14][ref14], zullen worden
      vastgesteld.

      3 Tenzij bij de vaststelling of herziening van een bestemmingsplan of van een wijzigings- of uitwerkingsplan als
      bedoeld in het eerste lid wordt voorzien in de wijziging van een spoorweg, blijft dit artikel buiten toepassing,
      indien op het tijdstip van die vaststelling of herziening de spoorweg reeds aanwezig of in aanleg is, met
      betrekking tot de daarbij in het plan opgenomen woningen of andere geluidsgevoelige gebouwen en geluidsgevoelige
      terreinen die op dat tijdstip reeds aanwezig of in aanbouw zijn.

      4 Voorschriften als bedoeld in [artikel 3.37 van de Wet ruimtelijke ordening][ref15] kunnen mede worden gegeven met
      inachtneming van de ingevolge de [artikelen 4.9 tot en met 4.15][ref16] geldende waarden.


