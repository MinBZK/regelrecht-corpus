  - number: '5.1'
    text: |-
      1 Een verzoek als bedoeld in [artikel 110a, derde lid, van de wet][ref1] kan met betrekking tot een zone rond een
      industrieterrein worden gedaan door:

      a. degene die het beheer voert over het industrieterrein waarvoor de hogere waarde verzocht wordt;

      b. de Kamer van Koophandel.

      2 In het geval van een industrieterrein van regionaal belang dat is aangewezen bij provinciale milieuverordening,
      kan een verzoek als bedoeld in het eerste lid tevens worden gedaan door:

      a. burgemeester en wethouders van de gemeente waarin de woningen, de andere geluidsgevoelige gebouwen of
      geluidsgevoelige terreinen gesitueerd zijn of worden, waarvoor de hogere waarde verzocht wordt;

      b. burgemeester en wethouders van de gemeente waarin het industrieterrein gesitueerd is of wordt, waarvoor de
      hogere waarde verzocht wordt.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel110a
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel5.1
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: 110a
  - number: '5.2'
    text: |-
      Een verzoek als bedoeld in [artikel 110a, derde lid, van de wet][ref1] kan met betrekking tot een zone langs een
      weg worden gedaan door de wegaanlegger, of indien het verzoek gedaan wordt in het kader van de toepassing van
      [artikel 3.4][ref2] of de [artikelen 79][ref3] en [99 van de wet][ref4], of – indien het betreft de aanleg of
      reconstructie van een rijksweg die niet op de geluidplafondkaart is aangegeven – in het kader van de toepassing van
      [artikel 76, eerste lid, van de wet][ref5], door de wegbeheerder.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel110a
      [ref2]: https://wetten.overheid.nl/BWBR0020445#Artikel3.4
