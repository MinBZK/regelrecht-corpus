  - number: '3.5'
    text: |-
      1 Onze Minister kan voor de ten hoogste toelaatbare geluidsbelasting, vanwege een weg, van de gevels van woningen
      binnen de zone van die weg een hogere dan de in [artikel 90, tweede lid, van de wet][ref1] genoemde waarde
      vaststellen in gevallen waarin toepassing van maatregelen, gericht op het terugbrengen van de geluidsbelasting
      tot die waarde, onvoldoende doeltreffend zal zijn dan wel overwegende bezwaren ontmoet van stedenbouwkundige,
      verkeerskundige, landschappelijke of financiële aard.

      2 Onze Minister kan voor de ten hoogste toelaatbare geluidsbelasting, vanwege een weg, van de gevels van woningen
      binnen de zone van die weg een hogere dan de in [artikel 90, derde lid, van de wet][ref2] genoemde waarde
      vaststellen, in gevallen waarin:

      a. toepassing van maatregelen die strekken tot vermindering van het geluid, veroorzaakt door het verkeer op de weg
      niet mogelijk is;

      b. toepassing van maatregelen die strekken tot vermindering van de geluidsoverdracht van de weg
      naar de betrokken woningen niet mogelijk is of duurder zal zijn dan de maximale bijdrage die volgens
      [bijlage A, tabel 4, van de Subsidieregeling sanering verkeerslawaai][ref3] voor een woning mogelijk is;

      c. het onttrekken aan de bestemming van de betrokken woningen binnen het bedrag, bedoeld in onderdeel b, niet
      mogelijk is, en

      d. koppeling van het treffen van maatregelen aan andere activiteiten niet kan leiden tot het terugbrengen van de
      geluidsbelasting, vanwege de weg, tot de in [artikel 90, derde lid, van de wet][ref4] genoemde waarde binnen het
      bedrag, bedoeld in onderdeel b.

      3 Indien [artikel 110f, eerste lid, van de wet][ref5] van toepassing is, geeft Onze Minister slechts
      toepassing aan het eerste of tweede lid voor zover de gecumuleerde geluidsbelastingen na correctie op grond van
      [artikel 110f, derde lid, van de wet][ref6], niet leiden tot een naar zijn oordeel onaanvaardbare geluidsbelasting.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel90
