  - number: '4.5'
    text: |-
      1 Vanwege de spoorwegexploitant wordt binnen de toekomstige zone van de spoorweg, bedoeld in [artikel 1.4][ref1],
      een akoestisch onderzoek ingesteld van de in [artikel 4.3][ref2] omschreven strekking.

      2 De resultaten van het ingestelde onderzoek worden door de spoorwegexploitant aan burgemeester en wethouders
      overgelegd, tezamen met een beschrijving van de maatregelen die naar zijn oordeel nodig zijn voor het in
      [artikel 4.6][ref3] omschreven doel.


