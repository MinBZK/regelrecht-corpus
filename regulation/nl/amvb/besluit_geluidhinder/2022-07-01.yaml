  - number: 5.4.3
    text: |-
      Degene die op grond van [artikel 110a van de wet][ref1] of [artikel 4.16][ref2] bevoegd is tot het vaststellen
      van een hogere waarde kan van de verzoeker nadere toelichting, tekeningen en kaarten verlangen, indien hij deze
      noodzakelijk acht voor de beoordeling van het verzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel110a
      [ref2]: https://wetten.overheid.nl/BWBR0020445#Artikel4
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel5.4
    references:
