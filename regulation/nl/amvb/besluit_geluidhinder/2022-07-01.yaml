    text: |-
      Tenzij bij de vaststelling of herziening van een bestemmingsplan of van een wijzigings- of uitwerkingsplan als
      bedoeld in het eerste lid wordt voorzien in de wijziging van een spoorweg, blijft dit artikel buiten toepassing,
      indien op het tijdstip van die vaststelling of herziening de spoorweg reeds aanwezig of in aanleg is, met
      betrekking tot de daarbij in het plan opgenomen woningen of andere geluidsgevoelige gebouwen en geluidsgevoelige
      terreinen die op dat tijdstip reeds aanwezig of in aanbouw zijn.
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel4.1
  - number: 4.1.4
    text: |-
      Voorschriften als bedoeld in [artikel 3.37 van de Wet ruimtelijke ordening][ref1] kunnen mede worden gegeven met
      inachtneming van de ingevolge de [artikelen 4.9 tot en met 4.15][ref2] geldende waarden.


