      nog niet geprojecteerde geluidsgevoelige terreinen, voor zover de geluidsgevoelige terreinen zijn gelegen binnen de
      zone van die spoorweg, bedoeld in [artikel 1.4][ref1] of [artikel 1.4a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020445#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0020445#Artikel1
