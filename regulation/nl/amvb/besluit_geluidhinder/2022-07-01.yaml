  - number: 4.7.3
    text: |-
      Onze Minister stelt in een geval als bedoeld in het tweede lid tevens voor elk van de daarvoor in aanmerking
      komende gevallen maatregelen vast die strekken tot het terugbrengen van de geluidsbelasting, vanwege de spoorweg,
      van de gevel van de betrokken woningen, andere geluidsgevoelige gebouwen, onderscheidenlijk aan de grens van
      geluidsgevoelige terreinen, tot de bij het besluit, bedoeld in het tweede lid, vastgestelde waarde.
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel4.7
  - number: 4.7.4
    text: |-
      In geval van het eerste, tweede en derde lid zijn de [artikelen 110a, zevende lid, van de wet][ref1] en
      [4.4 tot en met 4.6][ref2] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel110a
      [ref2]: https://wetten.overheid.nl/BWBR0020445#Artikel4
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel4.7
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: 110a
      - id: ref2
        bwb_id: BWBR0020445
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.1.2
        afdeling: '4.1'
  - number: 4.7.5
    text: |-
      In afwijking van het eerste lid, indien toepassing wordt gegeven aan [artikel 4.26][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0020445#Artikel4
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel4.7
    references:
