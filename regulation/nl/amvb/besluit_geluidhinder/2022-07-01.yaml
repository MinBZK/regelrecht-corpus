  - number: '3.9'
    text: |-
      Onze Minister stelt bij ministeriële regeling nadere regels vast met betrekking tot de vormgeving en inrichting van
      een saneringsprogramma als bedoeld in [artikel 89, eerste lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel89
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel3.9
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '89'
  - number: '3.10'
    text: |-
      1 Indien met toepassing van [artikel 85 van de wet][ref1] of [artikel 3.4][ref2] met betrekking tot een gevel van
      een in aanbouw zijnd of aanwezig ander geluidsgevoelig gebouw een hogere geluidsbelasting dan 48 dB vanwege de
      weg als de ten hoogste toelaatbare is vastgesteld, treffen burgemeester en wethouders behoudens het derde lid met
      betrekking tot de geluidwering van die gevel maatregelen om te bevorderen dat de geluidsbelasting, vanwege die weg,
      bij gesloten ramen,

      a. binnen de verblijfsruimten, genoemd in [artikel 1.1, eerste lid, onderdeel d, onder 1° tot en met 3°][ref3],
      28 dB niet te boven zal gaan, en

      b. binnen de verblijfsruimten, genoemd in [artikel 1.1, eerste lid, onderdeel d, onder 4° en 5°][ref4], 33 dB
      niet te boven zal gaan.

      2 Indien met betrekking tot de gevels van andere geluidsgevoelige gebouwen waarvan de geluidsbelasting vanwege de
      weg op 1 maart 1986 hoger was dan 55 dB(A), met toepassing van [artikel 3.4][ref5] of [artikel 3.6][ref6], juncto
      [artikel 90 van de wet][ref7] een hogere geluidsbelasting dan 48 dB, vanwege de weg als de ten hoogste toelaatbare
      is vastgesteld, treffen burgemeester en wethouders met betrekking tot de geluidwering van die gevels maatregelen om
      te bevorderen dat de geluidsbelasting, vanwege die weg, bij gesloten ramen,

      a. binnen verblijfsruimten als bedoeld in [artikel 1.1, eerste lid, onderdeel d, onder 1° tot en met 3°][ref8],
      38 dB niet te boven zal gaan, en

      b. binnen verblijfsruimten als bedoeld in [artikel 1.1, eerste lid, onderdeel d, onder 4° en 5°][ref9], 43 dB
      niet te boven zal gaan.


