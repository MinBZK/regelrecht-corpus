  - number: '4.26'
    text: |-
      Indien de aanleg of wijziging van een spoorweg waarop de [Tracéwet][ref1] van toepassing is, leidt
      tot aanleg, reconstructie of wijziging van een weg of spoorweg, en daartoe binnen het tracé een hogere
      waarde vereist is voor de ten hoogste toelaatbare geluidsbelasting vanwege die weg of spoorweg, is
      [artikel 104a, eerste, vierde en vijfde lid, van de wet][ref2] van overeenkomstige toepassing, met dien verstande
      dat in het eerste lid in plaats van «zijn de [artikelen 79][ref3] en [99, eerste lid,][ref4]» wordt gelezen: is
      [artikel 4.4][ref5] van het Besluit geluidhinder.


      [ref1]: https://wetten.overheid.nl/BWBR0006147
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel104a
      [ref3]: https://wetten.overheid.nl/BWBR0003227#Artikel79
      [ref4]: https://wetten.overheid.nl/BWBR0003227#Artikel99
      [ref5]: https://wetten.overheid.nl/BWBR0020445#Artikel4.4
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel4.26
