        bwb_id: BWBR0003227
        artikel: '85'
      - id: ref2
        bwb_id: BWBR0020445
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.1.1
        afdeling: '3.1'
  - number: 3.2.1.a
    text: 58 dB voor andere geluidsgevoelige gebouwen in buitenstedelijk gebied;
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel3.2
  - number: 3.2.1.b
    text: 63 dB voor andere geluidsgevoelige gebouwen in stedelijk gebied;
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel3.2
  - number: 3.2.1.c
    text: 53 dB voor geluidsgevoelige terreinen.
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel3.2
  - number: 3.2.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing op nog niet aanwezige andere geluidsgevoelige gebouwen en
      geluidsgevoelige terreinen indien deze worden geprojecteerd binnen de zone van een weg, met dien verstande dat de
      waarde niet hoger mag worden vastgesteld dan 53 dB voor andere geluidsgevoelige gebouwen in buitenstedelijk gebied.
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel3.2
  - number: 3.3.1
    text: |-
      Behoudens het tweede en derde lid is in geval van reconstructie van een weg de ten hoogste toelaatbare
      geluidsbelasting vanwege die weg, van de gevel van andere geluidsgevoelige gebouwen binnen de zone van die weg
      48 dB.
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel3.3
  - number: 3.3.2
    text: |-
      Indien eerder bij of krachtens de [wet][ref1], de [Experimentenwet Stad en Milieu][ref2], de
      [Interimwet stad-en-milieubenadering][ref3] of de [Spoedwet wegverbreding][ref4] een hogere waarde voor de ten
      hoogste toelaatbare geluidsbelasting, vanwege de te reconstrueren weg, van de gevel van andere geluidsgevoelige
      gebouwen binnen de zone van die weg, is vastgesteld dan 48 dB en de heersende waarde hoger is dan 48 dB, geldt de
      laagste van de volgende twee waarden als de ten hoogste toelaatbare:


      [ref1]: https://wetten.overheid.nl/BWBR0003227
      [ref2]: https://wetten.overheid.nl/BWBR0010041
      [ref3]: https://wetten.overheid.nl/BWBR0019466
      [ref4]: https://wetten.overheid.nl/BWBR0015158
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0003227
      - id: ref2
        bwb_id: BWBR0010041
      - id: ref3
        bwb_id: BWBR0019466
      - id: ref4
        bwb_id: BWBR0015158
  - number: 3.3.2.a
    text: de heersende waarde;
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel3.3
  - number: 3.3.2.b
    text: de eerder vastgestelde waarde.
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel3.3
  - number: 3.3.3
    text: |-
      Indien de weg op 1 januari 2007 aanwezig, in aanleg of geprojecteerd was en niet eerder een hogere waarde voor de
      ten hoogste toelaatbare geluidsbelasting vanwege die weg is vastgesteld dan 48 dB, en de heersende waarde hoger is
      dan 48 dB, geldt als de ten hoogste toelaatbare geluidsbelasting vanwege de te reconstrueren weg, van de gevel van
      andere geluidsgevoelige gebouwen binnen de zone die op 1 januari 2007 aanwezig, in aanbouw of geprojecteerd waren
      de heersende waarde.
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel3.3
  - number: 3.3.4
    text: |-
      Het eerste tot en met derde lid zijn niet van toepassing op andere
      geluidsgevoelige gebouwen ten aanzien waarvan met toepassing van
      [artikel 2.12, eerste lid, onder a, onder 2° of 3°, van de Wet algemene bepalingen omgevingsrecht][ref1]
      een omgevingsvergunning is verleend waarbij voor de duur van ten hoogste tien jaar is afgeweken van het
      bestemmingsplan.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
  - number: 3.3.5
    text: Het eerste tot en met vierde lid is van overeenkomstige toepassing aan de grens van geluidsgevoelige terreinen.
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel3.3
  - number: 3.4.1
    text: |-
      Voor de ten hoogste toelaatbare geluidsbelasting van de gevel van andere geluidsgevoelige gebouwen kan een hogere
      dan de ingevolge [artikel 3.3, eerste tot en met derde lid][ref1], geldende waarde worden vastgesteld, met dien
      verstande dat de verhoging 5 dB niet te boven mag gaan.


      [ref1]: https://wetten.overheid.nl/BWBR0020445#Artikel3
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0020445
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.1.2
        afdeling: '3.1'
  - number: 3.4.2
    text: |-
      Indien voor het betrokken andere geluidsgevoelige gebouw eerder bij of krachtens de [wet][ref1] een hogere waarde
      voor de ten hoogste toelaatbare geluidsbelasting is vastgesteld of indien de heersende waarde 53 dB niet te boven
      gaat, wordt de krachtens het eerste lid vast te stellen waarde niet hoger vastgesteld dan:


      [ref1]: https://wetten.overheid.nl/BWBR0003227
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0003227
  - number: 3.4.2.1°
    text: 58 dB voor andere geluidsgevoelige gebouwen in buitenstedelijk gebied;
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel3.4
  - number: 3.4.2.2°
    text: 63 dB voor andere geluidsgevoelige gebouwen in stedelijk gebied.
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel3.4
  - number: 3.4.3
    text: |-
      Voor andere dan de in het tweede lid bedoelde andere geluidsgevoelige gebouwen wordt de krachtens het eerste lid
      vast te stellen waarde niet hoger vastgesteld dan 68 dB.
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel3.4
  - number: 3.4.4
    text: |-
      In afwijking van het tweede en derde lid wordt de krachtens het eerste lid vast te stellen waarde
      voor andere geluidsgevoelige gebouwen met betrekking waartoe eerder bij of krachtens de [wet][ref1],
      de [Experimentenwet Stad en Milieu][ref2], de [Interimwet stad-en-milieubenadering][ref3] of de
      [Spoedwet wegverbreding][ref4] een hogere waarde is vastgesteld dan de krachtens het eerste tot en met derde lid
      ten hoogste toelaatbare waarde, niet hoger vastgesteld dan die eerder vastgestelde waarde.


      [ref1]: https://wetten.overheid.nl/BWBR0003227
      [ref2]: https://wetten.overheid.nl/BWBR0010041
      [ref3]: https://wetten.overheid.nl/BWBR0019466
      [ref4]: https://wetten.overheid.nl/BWBR0015158
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0003227
      - id: ref2
        bwb_id: BWBR0010041
      - id: ref3
        bwb_id: BWBR0019466
      - id: ref4
        bwb_id: BWBR0015158
  - number: 3.4.5
    text: |-
      Voor de ten hoogste toelaatbare geluidsbelasting aan de grens van geluidsgevoelige terreinen, kan een hogere dan de
      ingevolge [artikel 3.3, vierde juncto eerste tot en met derde lid][ref1], geldende waarde worden vastgesteld, met
      dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0020445#Artikel3
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel3.4
    references:
