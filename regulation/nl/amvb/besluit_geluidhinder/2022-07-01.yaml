  - number: '4.25'
    text: |-
      1 Indien Onze Minister toepassing heeft gegeven aan het [artikel 4.16, tweede of derde lid][ref1], treffen
      burgemeester en wethouders de in het tweede lid beschreven maatregelen, indien:

      a. ten minste één geluidsgevoelige ruimte binnen een woning, onderscheidenlijk ten minste één verblijfsruimte als
      genoemd in [artikel 1.1, eerste lid, onderdeel d, onder 4° en 5°][ref2], binnen een ander geluidsgevoelig gebouw
      een geluidsbelasting ondervindt van meer dan 43 dB, of

      b. ten minste één verblijfsruimte als genoemd in
      [artikel 1.1, eerste lid, onderdeel d, onder 1° tot en met 3°][ref3], binnen een ander geluidsgevoelig gebouw een
      geluidsbelasting ondervindt van meer dan 38 dB.

      2 De maatregelen ter uitvoering van het eerste lid hebben betrekking op de geluidwering van de gevel en bevorderen
      dat de geluidsbelasting bij gesloten ramen:

      a. in het eerste lid, onder a, bedoelde geval in geluidsgevoelige ruimten binnen de woning, onderscheidenlijk in
      verblijfsruimten als genoemd in [artikel 1.1, eerste lid, onderdeel d, onder 4° en 5°][ref4], binnen het andere
      geluidsgevoelige gebouw, 38 dB, dan wel een door burgemeester en wethouders doelmatig geoordeelde hogere waarde van
      ten hoogste 43 dB, niet te boven zal gaan;

      b. in het eerste lid, onder b, bedoelde geval in verblijfsruimten als genoemd in
      [artikel 1.1, eerste lid, onderdeel d, onder 4° en 5°][ref5], binnen het andere geluidsgevoelige gebouw 33 dB,
      dan wel een door burgemeester en wethouders geoordeelde hogere waarde van ten hoogste 38 dB, niet te boven zal
      gaan.


      [ref1]: https://wetten.overheid.nl/BWBR0020445#Artikel4.16
