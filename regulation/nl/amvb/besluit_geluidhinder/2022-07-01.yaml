  - number: 1.6.1
    text: |-
      Bij de bepaling van de geluidsbelasting vanwege een industrieterrein, vanwege een weg of vanwege een spoorweg,
      van de gevel van onderwijsgebouwen en kinderdagverblijven wordt de waarde van de geluidsbelasting over de periode
      19.00–23.00 uur (avond) of de periode 23.00–07.00 uur (nacht) buiten beschouwing gelaten, voor zover deze gebouwen
      in de betrokken periode niet overeenkomstig hun bestemming worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0020445/2022-07-01#Artikel1.6
  - number: 1.6.2
    text: |-
      De geluidsbelasting L vanwege een industrieterrein, vanwege een weg of vanwege een spoorweg is niet van toepassing
      ten aanzien van de gevel van onderwijsgebouwen en kinderdagverblijven, voor zover deze gebouwen in de betrokken
      periode niet overeenkomstig hun bestemming worden gebruikt.
