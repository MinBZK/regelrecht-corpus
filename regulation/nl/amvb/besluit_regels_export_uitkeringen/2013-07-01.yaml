preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Sociale Zaken en Werkgelegenheid, J.F. Hoogervorst van 8 december
    1999, Directie Sociale Verzekeringen, nr. SV/GSV/99/78348;

    Gelet op de artikelen 19a, vierde lid, van de Ziektewet, 20, vijfde lid, en 43b, tweede lid, van de Wet op de
    arbeidsongeschiktheidsverzekering, 7a, vijfde lid, en 19a, tweede lid, van de Wet arbeidsongeschiktheidsverzekering
    zelfstandigen, 8a, vierde lid, en 9a, derde lid, van de Algemene Ouderdomswet, 7b, vierde lid, van de Algemene
    Kinderbijslagwet, 32a, vijfde lid, en 32b, vierde lid, van de Algemene nabestaandenwet;

    De Raad van State gehoord (advies van 16 december 1999, nr. W12.99.0609/IV);

    Gezien het nader rapport van de Staatssecretaris van Sociale Zaken en Werkgelegenheid, J. F. Hoogervorst van 21
    december 1999, Directie Sociale Verzekeringen, nr. SV/GSV/99/81589;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0011049/2013-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Voor de toepassing van dit besluit wordt onder werkzaamheden die in het algemeen belang worden verricht verstaan
      werkzaamheden verricht door degene die:

      a. in dienstbetrekking staat tot een Nederlandse publiekrechtelijke rechtspersoon dan wel uit anderen hoofde loon
      geniet van een zodanige rechtspersoon;

      b. is uitgezonden om werkzaamheden te verrichten voor door de Minister van Sociale Zaken en Werkgelegenheid
      in overeenstemming met de Minister voor Ontwikkelingssamenwerking aan te wijzen organisaties voor
      ontwikkelingssamenwerking;

      c. werkzaam is bij een door de Minister van Sociale Zaken en Werkgelegenheid, de Minister van Volksgezondheid,
      Welzijn en Sport en de Minister van Binnenlandse Zaken en Koninkrijksrelaties aan te wijzen volkenrechtelijke
      organisatie;

      d. werkzaamheden verricht die worden bekostigd door het Rijk en die tevens in opdracht van het Rijk worden verricht
      in het kader van een wettelijke taakomschrijving of ter uitvoering van een internationaal verdrag dan wel een
      daarmee gelijk te stellen overeenkomst of een besluit van een volkenrechtelijke organisatie.
    url: https://wetten.overheid.nl/BWBR0011049/2013-07-01#Artikel1
  - number: '2'
    text: |-
      De persoon die verzekerd is op grond van de [Ziektewet][ref1] uit hoofde van een dienstbetrekking tot het
      verrichten van werkzaamheden in het algemeen belang en zijn in hetzelfde land wonende gezinslid hebben recht op
      ziekengeld op grond van de Ziektewet.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0011049/2013-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0001888
  - number: '3'
    text: |-
      De verzekerde, bedoeld in [artikel 19 van de Wet op de arbeidsongeschiktheidsverzekering][ref1], of zijn in
      hetzelfde land wonende gezinslid heeft recht op toekenning van arbeidsongeschiktheidsuitkering dan wel van die
      verzekerde of zijn in hetzelfde land wonende gezinslid wordt de arbeidsongeschiktheidsuitkering niet ingetrokken,
      indien de verzekerde werkzaamheden in het algemeen belang verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel19
    url: https://wetten.overheid.nl/BWBR0011049/2013-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '19'
  - number: 3a
    text: |-
      Voor de verzekerde, bedoeld in [artikel 45, eerste lid, van de Wet werk en inkomen naar arbeidsvermogen][ref1], of
      zijn in hetzelfde land wonende gezinslid ontstaat of herleeft het recht op een uitkering op grond van die wet dan
      wel eindigt een dergelijke uitkering niet, indien de verzekerde werkzaamheden in het algemeen belang verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel45
    url: https://wetten.overheid.nl/BWBR0011049/2013-07-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '45'
  - number: '4'
    text: |-
      Een verzekerde als bedoeld in de [artikelen 7a, eerste lid][ref1], onderscheidenlijk
      [19a, eerste lid, van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref2] of zijn in hetzelfde land
      wonende gezinslid heeft recht op arbeidsongeschiktheidsuitkering dan wel voor die verzekerde of zijn in hetzelfde
      land wonende gezinslid eindigt het recht op arbeidsongeschiktheidsuitkering niet indien de verzekerde werkzaamheden
      in het algemeen belang verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel7a
      [ref2]: https://wetten.overheid.nl/BWBR0008656#Artikel19a
    url: https://wetten.overheid.nl/BWBR0011049/2013-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: 7a
      - id: ref2
        bwb_id: BWBR0008656
        artikel: 19a
  - number: '5'
    text: |-
      1 De pensioengerechtigde, bedoeld in [artikel 8a, eerste lid, van de Algemene Ouderdomswet][ref1] heeft recht op
      een toeslag indien deze pensioengerechtigde werkzaamheden in het algemeen belang verricht.

      2 Een pensioengerechtigde als bedoeld in
      [artikel 9, eerste lid, onderdelen a of c, van de Algemene Ouderdomswet][ref2] die niet in Nederland woont en
      werkzaamheden in het algemeen belang verricht heeft recht op ouderdomspensioen alsof hij in Nederland woont.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel8a
      [ref2]: https://wetten.overheid.nl/BWBR0002221#Artikel9
    url: https://wetten.overheid.nl/BWBR0011049/2013-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: 8a
      - id: ref2
        bwb_id: BWBR0002221
        artikel: '9'
  - number: '6'
    text: |-
      De verzekerde, bedoeld in [artikel 7b, eerste lid, van de Algemene Kinderbijslagwet][ref1], heeft recht op
      kinderbijslag, indien hij werkzaamheden in het algemeen belang verricht en het eigen kind, het aangehuwde kind of
      het pleegkind woont in hetzelfde land, Nederland of een land waarin op grond van een verdrag of een besluit van een
      volkenrechtelijke organisatie recht op kinderbijslag kan bestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel7b
    url: https://wetten.overheid.nl/BWBR0011049/2013-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: 7b
  - number: '7'
    text: |-
      1 Voor de nabestaande, bedoeld in [artikel 32a, eerste lid, van de Algemene nabestaandenwet,][ref1] ontstaat recht
      op nabestaandenuitkering, indien de nabestaande werkzaamheden in het algemeen belang verricht.

      2 Voor het kind, bedoeld in [artikel 32a, eerste lid, van de Algemene nabestaandenwet][ref2], ontstaat recht op
      wezenuitkering, indien het kind werkzaamheden in het algemeen belang verricht.

      3 Voor de nabestaande, bedoeld in [artikel 32b, eerste lid, van de Algemene nabestaandenwet][ref3], eindigt niet
      het recht op nabestaandenuitkering, indien de nabestaande werkzaamheden in het algemeen belang verricht.

      4 Voor het kind, bedoeld in [artikel 32b, eerste lid, van de Algemene nabestaandenwet][ref4], eindigt het recht op
      wezenuitkering niet, indien het kind werkzaamheden in het algemeen belang verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel32a
      [ref2]: https://wetten.overheid.nl/BWBR0007795#Artikel32a
      [ref3]: https://wetten.overheid.nl/BWBR0007795#Artikel32b
      [ref4]: https://wetten.overheid.nl/BWBR0007795#Artikel32b
    url: https://wetten.overheid.nl/BWBR0011049/2013-07-01#Artikel7
    references:
      - id: ref1
