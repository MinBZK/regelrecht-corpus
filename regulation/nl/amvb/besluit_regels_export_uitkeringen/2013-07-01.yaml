      1 Dit besluit treedt in werking met ingang van 1 januari 2000.

      2 Indien het Staatsblad waarin dit besluit wordt geplaatst wordt uitgegeven na 31 december 1999, treedt het in
      werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin het wordt geplaatst, en werkt het
      terug tot en met 1 januari 2000.
