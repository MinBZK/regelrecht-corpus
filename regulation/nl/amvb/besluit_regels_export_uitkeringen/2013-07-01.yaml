      - id: ref4
        bwb_id: BWBR0007795
        artikel: 32b
  - number: '8'
    text: |-
      De verzekerde, bedoeld in [artikel 19a van de Ziektewet][ref1], heeft recht op ziekengeld op grond van de
      [Ziektewet][ref2], indien deze verzekerde in Curaçao, Sint Maarten, Aruba of in de openbare lichamen Bonaire, Sint
      Eustatius of Saba woont.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel19a
      [ref2]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0011049/2013-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: 19a
      - id: ref2
        bwb_id: BWBR0001888
  - number: '9'
    text: |-
      De verzekerde, bedoeld in [artikel 19 van de Wet op de arbeidsongeschiktheidsverzekering][ref1],
      heeft recht op toekenning van de arbeidsongeschiktheidsuitkering dan wel van die verzekerde wordt de
      arbeidsongeschiktheidsuitkering niet ingetrokken, indien deze verzekerde in Curaçao, Sint Maarten, Aruba of in de
      openbare lichamen Bonaire, Sint Eustatius of Saba woont.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel19
    url: https://wetten.overheid.nl/BWBR0011049/2013-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '19'
  - number: 9a
    text: |-
      Voor de verzekerde, bedoeld in [artikel 45, eerste lid, van de Wet werk en inkomen naar arbeidsvermogen][ref1],
      ontstaat of herleeft het recht op een uitkering op grond van [die wet][ref2] dan wel eindigt een dergelijke
      uitkering niet, indien de verzekerde in Curaçao, Sint Maarten, Aruba of in de openbare lichamen Bonaire, Sint
      Eustatius of Saba woont.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0019057
    url: https://wetten.overheid.nl/BWBR0011049/2013-07-01#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '45'
      - id: ref2
        bwb_id: BWBR0019057
  - number: '10'
    text: |-
      Een verzekerde als bedoeld in de [artikelen 7a, eerste lid][ref1], onderscheidenlijk
      [19a, eerste lid, van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref2] heeft recht op
      arbeidsongeschiktheidsuitkering dan wel voor die verzekerde eindigt het recht op arbeidsongeschiktheidsuitkering
      niet indien de verzekerde in Curaçao, Sint Maarten, Aruba of in de openbare lichamen Bonaire, Sint Eustatius of
      Saba woont.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel7a
      [ref2]: https://wetten.overheid.nl/BWBR0008656#Artikel19a
    url: https://wetten.overheid.nl/BWBR0011049/2013-07-01#Artikel10
