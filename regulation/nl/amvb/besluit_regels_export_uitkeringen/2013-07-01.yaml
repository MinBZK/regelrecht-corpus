      - id: ref2
        bwb_id: BWBR0002221
        artikel: '9'
  - number: '12'
    text: |-
      De verzekerde, bedoeld in [artikel 7b, eerste lid, van de Algemene Kinderbijslagwet][ref1], heeft recht
      op kinderbijslag, indien hij dan wel het eigen kind, het aangehuwde kind of het pleegkind in Curaçao, Sint
      Maarten, Aruba of in de openbare lichamen Bonaire, Sint Eustatius of Saba woont dan wel in Nederland, of een land
      waarin op grond van een verdrag of een besluit van een volkenrechtelijke organisatie recht op kinderbijslag kan
      bestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel7b
    url: https://wetten.overheid.nl/BWBR0011049/2013-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: 7b
  - number: '13'
    text: |-
      1 Voor de nabestaande, bedoeld in [artikel 32a, eerste lid, van de Algemene nabestaandenwet][ref1], ontstaat recht
      op nabestaandenuitkering, indien de nabestaande in Curaçao, Sint Maarten, Aruba of in de openbare lichamen Bonaire,
      Sint Eustatius of Saba woont.

      2 Voor het kind, bedoeld in [artikel 32a, eerste lid, van de Algemene nabestaandenwet][ref2], ontstaat recht op
      wezenuitkering, indien het kind in Curaçao, Sint Maarten, Aruba of in de openbare lichamen Bonaire, Sint Eustatius
      of Saba woont.

      3 Voor de nabestaande, bedoeld in [artikel 32b, eerste lid, van de Algemene nabestaandenwet][ref3], eindigt
      niet het recht op nabestaandenuitkering, indien de nabestaande in Curaçao, Sint Maarten, Aruba of in de openbare
      lichamen Bonaire, Sint Eustatius of Saba woont.

      4 Voor het kind, bedoeld in [artikel 32b, eerste lid, van de Algemene nabestaandenwet][ref4], eindigt het recht
      op wezenuitkering niet, indien het kind in Curaçao, Sint Maarten, Aruba of in de openbare lichamen Bonaire, Sint
      Eustatius of Saba woont.


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel32a
