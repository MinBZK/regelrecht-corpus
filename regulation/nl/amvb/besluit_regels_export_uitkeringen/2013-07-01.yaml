  - number: '11'
    text: |-
      1 De pensioengerechtigde, bedoeld in [artikel 8a, eerste lid, van de Algemene Ouderdomswet][ref1] heeft recht op
      een toeslag indien deze pensioengerechtigde in Curaçao, Sint Maarten, Aruba of in de openbare lichamen Bonaire,
      Sint Eustatius of Saba woont.

      2 Een pensioengerechtigde als bedoeld in
      [artikel 9, eerste lid, onderdelen a of c, van de Algemene Ouderdomswet][ref2] die in Curaçao, Sint Maarten, Aruba
      of in de openbare lichamen Bonaire, Sint Eustatius of Saba woont heeft recht op ouderdomspensioen alsof hij in
      Nederland woont.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel8a
      [ref2]: https://wetten.overheid.nl/BWBR0002221#Artikel9
    url: https://wetten.overheid.nl/BWBR0011049/2013-07-01#Artikel11
