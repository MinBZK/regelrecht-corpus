    text: |-
      In afwijking van [artikel 7b, eerste lid, van de Algemene Kinderbijslagwet][ref1], heeft de verzekerde, bedoeld in
      dat artikel, recht op kinderbijslag, indien hij werkzaamheden in het algemeen belang verricht en het eigen kind,
      het aangehuwde kind of het pleegkind woont in hetzelfde land, Nederland of een land waarin op grond van een verdrag
      of een besluit van een volkenrechtelijke organisatie recht op kinderbijslag kan bestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel7b
    url: https://wetten.overheid.nl/BWBR0011049/2012-11-05#Artikel6
