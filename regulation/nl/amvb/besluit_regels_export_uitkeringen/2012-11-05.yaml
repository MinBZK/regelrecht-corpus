  - number: 15a
    text: |-
      In afwijking van [artikel 43, aanhef en onderdeel e][ref1], in samenhang met [paragraaf 6.1][ref2] of
      [7.1 van de Wet werk en inkomen naar arbeidsvermogen][ref3], ontstaat of herleeft het recht op een uitkering op
      grond van die wet dan wel eindigt een dergelijke uitkering niet, indien de verzekerde op Aruba woont.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Paragraaf6.1
      [ref3]: https://wetten.overheid.nl/BWBR0019057#Paragraaf7.1
    url: https://wetten.overheid.nl/BWBR0011049/2012-11-05#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '43'
      - id: ref2
        bwb_id: BWBR0019057
        paragraaf: '6.1'
      - id: ref3
        bwb_id: BWBR0019057
        paragraaf: '7.1'
  - number: '16'
    text: |-
      In afwijking van de [artikelen 7a, eerste lid][ref1], en
      [19a, eerste lid, van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref2], heeft de verzekerde,
      bedoeld in die artikelen, recht op arbeidsongeschiktheidsuitkering dan wel eindigt het recht op
      arbeidsongeschiktheidsuitkering niet, indien deze verzekerde op Aruba woont.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel7a
      [ref2]: https://wetten.overheid.nl/BWBR0008656#Artikel19a
    url: https://wetten.overheid.nl/BWBR0011049/2012-11-05#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: 7a
      - id: ref2
        bwb_id: BWBR0008656
        artikel: 19a
  - number: '17.1'
    text: |-
      In afwijking van [artikel 8a, eerste lid, van de Algemene Ouderdomswet][ref1], heeft de pensioengerechtigde,
      bedoeld in [artikel 8, eerste lid, van de Algemene Ouderdomswet][ref2], recht op een toeslag, indien deze
      pensioengerechtigde op Aruba woont.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel8a
      [ref2]: https://wetten.overheid.nl/BWBR0002221#Artikel8
    url: https://wetten.overheid.nl/BWBR0011049/2012-11-05#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: 8a
      - id: ref2
        bwb_id: BWBR0002221
        artikel: '8'
  - number: '17.2'
    text: |-
      In afwijking van [artikel 9a, eerste lid, van de Algemene Ouderdomswet][ref1], heeft de pensioengerechtigde,
      bedoeld in [artikel 9, eerste lid, onderdelen a en c, van de Algemene Ouderdomswet][ref2], recht op
      ouderdomspensioen alsof hij in Nederland woont, indien hij op Aruba woont.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel9a
      [ref2]: https://wetten.overheid.nl/BWBR0002221#Artikel9
    url: https://wetten.overheid.nl/BWBR0011049/2012-11-05#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: 9a
      - id: ref2
        bwb_id: BWBR0002221
        artikel: '9'
  - number: '18'
    text: |-
      In afwijking van [artikel 7b, eerste lid, van de Algemene Kinderbijslagwet][ref1], heeft de verzekerde, bedoeld
      in dat artikel, recht op kinderbijslag, indien hij dan wel het eigen kind, het aangehuwde kind of het pleegkind
      op Aruba woont dan wel in Nederland, of een land waarin op grond van een verdrag of een besluit van een
      volkenrechtelijke organisatie recht op kinderbijslag kan bestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel7b
    url: https://wetten.overheid.nl/BWBR0011049/2012-11-05#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: 7b
  - number: '19.1'
    text: |-
      In afwijking van [artikel 32a, eerste lid, van de Algemene nabestaandenwet][ref1], ontstaat voor:


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel32a
    url: https://wetten.overheid.nl/BWBR0011049/2012-11-05#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: 32a
  - number: 19.1.a
    text: de nabestaande, bedoeld in dat artikel, recht op nabestaandenuitkering, indien de nabestaande op Aruba woont;
    url: https://wetten.overheid.nl/BWBR0011049/2012-11-05#Artikel19
  - number: 19.1.b
    text: |-
      de nabestaande, bedoeld in dat artikel, recht op halfwezenuitkering, indien de nabestaande of de halfwees op Aruba
      woont dan wel in Nederland, of een land waarin op grond van een verdrag of een besluit van een volkenrechtelijke
      organisatie recht op halfwezenuitkering kan bestaan;
    url: https://wetten.overheid.nl/BWBR0011049/2012-11-05#Artikel19
  - number: 19.1.c
    text: het kind, bedoeld in dat artikel, recht op wezenuitkering, indien het kind op Aruba woont.
    url: https://wetten.overheid.nl/BWBR0011049/2012-11-05#Artikel19
  - number: '19.2'
    text: |-
      In afwijking van [artikel 32b, eerste lid, van de Algemene nabestaandenwet][ref1], eindigt het recht op:


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel32b
    url: https://wetten.overheid.nl/BWBR0011049/2012-11-05#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: 32b
  - number: 19.2.a
    text: nabestaandenuitkering niet, indien de nabestaande op Aruba woont;
    url: https://wetten.overheid.nl/BWBR0011049/2012-11-05#Artikel19
  - number: 19.2.b
    text: |-
      halfwezenuitkering niet, indien de nabestaande of de halfwees op Aruba woont dan wel in Nederland, of een land
      waarin op grond van een verdrag of een besluit van een volkenrechtelijke organisatie recht op halfwezenuitkering
      kan bestaan;
    url: https://wetten.overheid.nl/BWBR0011049/2012-11-05#Artikel19
  - number: 19.2.c
    text: wezenuitkering niet, indien het kind op Aruba woont.
    url: https://wetten.overheid.nl/BWBR0011049/2012-11-05#Artikel19
  - number: '20.1'
    text: |-
