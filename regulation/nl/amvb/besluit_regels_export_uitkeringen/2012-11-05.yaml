        artikel: '8'
  - number: '5.2'
    text: |-
      In afwijking van [artikel 9a, eerste lid, van de Algemene Ouderdomswet][ref1], heeft de pensioengerechtigde,
      bedoeld in [artikel 9, eerste lid, onderdelen a en c, van de Algemene Ouderdomswet][ref2], recht op
      ouderdomspensioen alsof hij in Nederland woont, indien hij werkzaamheden in het algemeen belang verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel9a
      [ref2]: https://wetten.overheid.nl/BWBR0002221#Artikel9
