        paragraaf: '6.1'
      - id: ref3
        bwb_id: BWBR0019057
        paragraaf: '7.1'
  - number: '4'
    text: |-
      In afwijking van de [artikelen 7a, eerste lid][ref1], en
      [19a, eerste lid, van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref2], heeft de verzekerde,
      die werkzaamheden in het algemeen belang verricht, of zijn in hetzelfde land wonende gezinslid, recht op
      arbeidsongeschiktheidsuitkering dan wel eindigt het recht op arbeidsongeschiktheidsuitkering niet.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel7a
      [ref2]: https://wetten.overheid.nl/BWBR0008656#Artikel19a
    url: https://wetten.overheid.nl/BWBR0011049/2012-11-05#Artikel4
