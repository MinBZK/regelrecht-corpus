    url: https://wetten.overheid.nl/BWBR0011049/2012-11-05#Artikel7
  - number: 7.2.d
    text: het recht op wezenuitkering niet, indien het kind werkzaamheden in het algemeen belang verricht.
    url: https://wetten.overheid.nl/BWBR0011049/2012-11-05#Artikel7
