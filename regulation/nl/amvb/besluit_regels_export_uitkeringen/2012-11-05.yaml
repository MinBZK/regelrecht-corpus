        artikel: 19a
  - number: '5.1'
    text: |-
      In afwijking van [artikel 8a, eerste lid, van de Algemene Ouderdomswet][ref1], heeft de pensioengerechtigde,
      bedoeld in [artikel 8, eerste lid, van de Algemene Ouderdomswet][ref2], recht op een toeslag, indien hij
      werkzaamheden in het algemeen belang verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel8a
      [ref2]: https://wetten.overheid.nl/BWBR0002221#Artikel8
    url: https://wetten.overheid.nl/BWBR0011049/2012-11-05#Artikel5
