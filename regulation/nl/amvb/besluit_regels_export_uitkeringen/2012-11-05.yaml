  - number: '22.1'
    text: Dit besluit treedt in werking met ingang van 1 januari 2000.
    url: https://wetten.overheid.nl/BWBR0011049/2012-11-05#Artikel22
  - number: '22.2'
    text: |-
      Indien het Staatsblad waarin dit besluit wordt geplaatst wordt uitgegeven na 31 december 1999, treedt het in
      werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin het wordt geplaatst, en werkt het
      terug tot en met 1 januari 2000.
    url: https://wetten.overheid.nl/BWBR0011049/2012-11-05#Artikel22
  - number: '23'
    text: 'Dit besluit wordt aangehaald als: Besluit afwijkende regels beperking export uitkeringen.'
    url: https://wetten.overheid.nl/BWBR0011049/2012-11-05#Artikel23
