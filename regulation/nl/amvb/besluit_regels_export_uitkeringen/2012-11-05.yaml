preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Sociale Zaken en Werkgelegenheid, J.F. Hoogervorst van 8 december
    1999, Directie Sociale Verzekeringen, nr. SV/GSV/99/78348;

    Gelet op de artikelen 19a, vierde lid, van de Ziektewet, 20, vijfde lid, en 43b, tweede lid, van de Wet op de
    arbeidsongeschiktheidsverzekering, 7a, vijfde lid, en 19a, tweede lid, van de Wet arbeidsongeschiktheidsverzekering
    zelfstandigen, 8a, vierde lid, en 9a, derde lid, van de Algemene Ouderdomswet, 7b, vierde lid, van de Algemene
    Kinderbijslagwet, 32a, vijfde lid, en 32b, vierde lid, van de Algemene nabestaandenwet;

    De Raad van State gehoord (advies van 16 december 1999, nr. W12.99.0609/IV);

    Gezien het nader rapport van de Staatssecretaris van Sociale Zaken en Werkgelegenheid, J. F. Hoogervorst van 21
    december 1999, Directie Sociale Verzekeringen, nr. SV/GSV/99/81589;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0011049/2012-11-05#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Voor de toepassing van dit besluit wordt onder werkzaamheden die in het algemeen belang worden verricht verstaan
      werkzaamheden verricht door degene die:
    url: https://wetten.overheid.nl/BWBR0011049/2012-11-05#Artikel1
  - number: 1.a
    text: |-
      in dienstbetrekking staat tot een Nederlandse publiekrechtelijke rechtspersoon dan wel uit anderen hoofde loon
      geniet van een zodanige rechtspersoon;
    url: https://wetten.overheid.nl/BWBR0011049/2012-11-05#Artikel1
  - number: 1.b
    text: |-
      is uitgezonden om werkzaamheden te verrichten voor door de Minister van Sociale Zaken en Werkgelegenheid
      in overeenstemming met de Minister voor Ontwikkelingssamenwerking aan te wijzen organisaties voor
      ontwikkelingssamenwerking;
    url: https://wetten.overheid.nl/BWBR0011049/2012-11-05#Artikel1
  - number: 1.c
    text: |-
      werkzaam is bij een door de Minister van Sociale Zaken en Werkgelegenheid, de Minister van Volksgezondheid, Welzijn
      en Sport en de Minister van Binnenlandse Zaken en Koninkrijksrelaties aan te wijzen volkenrechtelijke organisatie;
    url: https://wetten.overheid.nl/BWBR0011049/2012-11-05#Artikel1
  - number: 1.d
    text: |-
      werkzaamheden verricht die worden bekostigd door het Rijk en die tevens in opdracht van het Rijk worden verricht in
      het kader van een wettelijke taakomschrijving of ter uitvoering van een internationaal verdrag dan wel een daarmee
      gelijk te stellen overeenkomst of een besluit van een volkenrechtelijke organisatie.
    url: https://wetten.overheid.nl/BWBR0011049/2012-11-05#Artikel1
  - number: '2'
    text: |-
      [Artikel 19a, eerste lid, van de Ziektewet][ref1] is niet van toepassing op de persoon die verzekerd is op grond
      van die wet uit hoofde van een dienstbetrekking tot het verrichten van werkzaamheden in het algemeen belang en
      zijn, in hetzelfde land wonende, gezinslid.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel19a
    url: https://wetten.overheid.nl/BWBR0011049/2012-11-05#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: 19a
  - number: '3'
    text: |-
      In afwijking van de [artikelen 20, eerste lid][ref1], en
      [43b, eerste lid, van de Wet op de arbeidsongeschiktheidsverzekering][ref2], heeft de verzekerde, die
      werkzaamheden in het algemeen belang verricht, of zijn in hetzelfde land wonende gezinslid, recht op toekenning van
      arbeidsongeschiktheidsuitkering dan wel wordt de arbeidsongeschiktheidsuitkering niet ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel43b
    url: https://wetten.overheid.nl/BWBR0011049/2012-11-05#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '20'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: 43b
  - number: 3a
    text: |-
      In afwijking van [artikel 43, aanhef en onderdeel e][ref1], in samenhang met [paragraaf 6.1][ref2] of
      [7.1 van de Wet werk en inkomen naar arbeidsvermogen][ref3], ontstaat of herleeft het recht op een uitkering
      op grond van die wet dan wel eindigt een dergelijke uitkering niet voor de verzekerde die werkzaamheden in het
      algemeen belang verricht, of zijn in hetzelfde land wonende gezinslid.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Paragraaf6.1
      [ref3]: https://wetten.overheid.nl/BWBR0019057#Paragraaf7.1
    url: https://wetten.overheid.nl/BWBR0011049/2012-11-05#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '43'
      - id: ref2
