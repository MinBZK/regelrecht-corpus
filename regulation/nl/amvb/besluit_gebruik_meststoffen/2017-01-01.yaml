  - number: 2a
    text: |-
      1 In afwijking van [artikel 2, vierde lid][ref1], is het toegestaan op overige grond compost te gebruiken bij wijze
      van eenmalige gift in een hoeveelheid van ten hoogste 200 ton droge stof per hectare, indien tenminste voorafgaande
      aan het gebruik een melding daarvan aan Onze Minister van Economische Zaken heeft plaatsgevonden.

      2 De in het eerste lid bedoelde melding bevat:

      a. naam en adres van de gebruiker;

      b. een kadastrale of topografische aanduiding van het desbetreffende perceel alsmede een opgave van de oppervlakte
      ervan;

      c. naam en adres van de leverancier van het product; en

      d. de te gebruiken hoeveelheid.

      3 Met het in het eerste lid bedoelde gebruik mag eerst worden aangevangen, zodra een bevestiging van ontvangst van
      de melding door de gebruiker is ontvangen.

      4 Bij ministeriële regeling kunnen regels worden gesteld over de wijze waarop de melding wordt gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0009066#Artikel2
    url: https://wetten.overheid.nl/BWBR0009066/2017-01-01#Artikel2a
