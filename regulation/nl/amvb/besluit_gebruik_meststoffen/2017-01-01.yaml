  - number: 1c
    text: |-
      1 Voordat op landbouwgrond zuiveringsslib wordt gebruikt, wordt de bodem bemonsterd en geanalyseerd.

      2 Bij ministeriële regeling kunnen regels worden gesteld inzake de in het eerste lid bedoelde bemonstering en
      analyse, die onder meer betrekking kunnen hebben op de methode van bemonstering en analyse, de frequentie waarin
      de bemonstering en analyse moeten plaatsvinden, de bevoegdheid tot het verrichten van de bemonstering en analyse,
      alsmede het bewaren en overleggen van de analyseresultaten.
    url: https://wetten.overheid.nl/BWBR0009066/2017-01-01#Artikel1c
  - number: 1d
    text: |-
      Het is verboden zuiveringsslib te gebruiken:

      a. op weideland: gedurende de periode van beweiding;

      b. op grond die wordt gebruikt voor de teelt van voedergewassen: minder dan drie weken voor de oogst;

      c. op grond die wordt gebruikt voor groente- of fruitaanplant, met uitzondering van fruitbomen: gedurende de
      groeiperiode van de groente onderscheidenlijk het fruit;

      d. op grond die is bestemd voor de teelt van groenten of vruchten, die gewoonlijk in rechtstreeks contact met de
      bodem staan en rauw worden geconsumeerd: minder dan tien maanden voor de oogst alsmede tijdens de oogst.
    url: https://wetten.overheid.nl/BWBR0009066/2017-01-01#Artikel1d
  - number: '2'
    text: |-
      1 Het is verboden dierlijke meststoffen, herwonnen fosfaten, compost of overige organische meststoffen te gebruiken
      op natuurterrein of op overige grond.

      2 Het in het eerste lid gesteld verbod geldt niet voor het gebruik van dierlijke meststoffen of compost op
      natuurterrein waarop een beheer wordt gevoerd, indien aan het beheer beperkingen zijn verbonden ten aanzien van de
      gebruikte hoeveelheid dierlijke meststoffen of compost en het gebruik daarmee in overeenstemming is.

      3 Het in het eerste lid gesteld verbod geldt niet voor het gebruik van dierlijke meststoffen of compost op
      natuurterrein, indien op dat terrein geen beheer wordt gevoerd waaraan beperkingen ten aanzien van de gebruikte
      hoeveelheid dierlijke meststoffen zijn verbonden en ten minste aan één van de volgende voorwaarden is voldaan:

      a. het totaal van de gebruikte hoeveelheid dierlijke meststoffen en compost, uitgedrukt in kilogrammen fosfaat, is
      niet groter dan 20 kilogram fosfaat per hectare per jaar;

      b. het natuurterrein is grasland en het totaal van de daarop gebruikte hoeveelheid dierlijke meststoffen en
      compost, uitgedrukt in kilogrammen fosfaat en stikstof, is niet groter dan 70 kilogram fosfaat, onderscheidenlijk
      170 kilogram stikstof per hectare per jaar.

      4 Het in het eerste lid gestelde verbod is niet van toepassing op overige grond indien ten minste aan één van de
      volgende voorwaarden is voldaan:

      a. het totaal van de gebruikte hoeveelheid dierlijke meststoffen, compost, herwonnen fosfaten en overige organische
      meststoffen die uitsluitend zijn geproduceerd uit materialen van plantaardige herkomst, uitgedrukt in kilogrammen
      fosfaat, is niet groter dan 20 kilogram fosfaat per hectare per jaar;

      b. de overige grond is grasland of bouwland en het totaal van de daarop gebruikte hoeveelheid dierlijke
      meststoffen, compost, herwonnen fosfaten en overige organische meststoffen die uitsluitend zijn geproduceerd uit
      materialen van plantaardige herkomst, uitgedrukt in kilogrammen fosfaat en stikstof, is niet groter dan 80 kilogram
      fosfaat, onderscheidenlijk 170 kilogram stikstof per hectare per jaar.

      5 Bij de bepaling van de in het derde en vierde lid bedoelde hoeveelheid meststoffen wordt de hoeveelheid fosfaat
      in compost slechts voor het krachtens [artikel 12, vijfde lid, van de Meststoffenwet][ref1] bepaalde deel in
      aanmerking genomen.


