  - number: 4a
    text: |-
      1 Het is verboden in de periode van 16 september tot en met 31 januari stikstofkunstmest te gebruiken op bouwland
      en op grasland.

      2 Het in het eerste lid gestelde verbod is niet van toepassing op bouwland dat gelijkmatig is beteeld met een
      vollegrondsgroente.

      3 Het in het eerste lid gestelde verbod is in de periode van 16 september tot en met 15 oktober niet van
      toepassing op bouwland waarop uitsluitend fruitteelt wordt uitgeoefend of op bouwland dat gelijkmatig is beteeld
      met winterkoolzaad of dat gelijkmatig is beteeld met zaad behorend tot rassen van de grassoorten rietzwenkgras,
      roodzwenkgras of veldbeemdgras, ten behoeve van een tweede of latere zaadoogst in het daaropvolgende jaar.

      4 Het in het eerste lid gestelde verbod is niet van toepassing op het gebruik van ureum op bouwland waarop
      uitsluitend fruitteelt wordt uitgeoefend.

      5 Het in het eerste lid gestelde verbod is in de periode van 16 januari tot en met 31 januari niet van toepassing
      op bouwland dat gelijkmatig is beteeld met hyacinten of tulpen.
    url: https://wetten.overheid.nl/BWBR0009066/2017-01-01#Artikel4a
  - number: 4b
    text: |-
      1 Het is verboden op grasland de graszode te vernietigen.

      2 Het in het eerste lid gestelde verbod is niet van toepassing:

      a. in de periode van 1 februari tot en met 15 september op grasland, gelegen op kleigrond of veengrond;

      b. in de periode van 1 februari tot en met 31 mei op grasland, gelegen op zand- of lössgrond, indien direct
      aansluitend op de vernietiging van de graszode op de desbetreffende grond de teelt van gras aanvangt; en

      c. in de periode van 1 februari tot en met 10 mei op grasland, gelegen op zand- of lössgrond, indien direct
      aansluitend op de vernietiging van de graszode op de desbetreffende grond de teelt van een bij ministeriële
      regeling aangewezen relatief stikstofbehoeftig gewas aanvangt.

      3 Het in het eerste lid gestelde verbod is niet van toepassing in de periode van 1 juni tot en met 15 juli, indien
      in de desbetreffende grond direct aansluitend op het vernietigen van de graszode, maar uiterlijk op 16 juli, een
      of meerdere bij ministeriële regeling aangewezen gewassen worden geteeld ten behoeve van een vervolgteelt waarvoor
      aaltjesbeheersing nodig is en deze vervolgteelt uiterlijk in het volgende voorjaar wordt geplant of gezaaid.
      Bij ministeriële regeling worden regels gesteld over de teeltperiode en de toegestane bewerkingsmethoden van de
      gewassen, die per gewas kunnen verschillen.

      4 Het gebruik van stikstofhoudende meststoffen op de grond, beteeld met de in het tweede lid en derde lid bedoelde
      gewassen, vindt slechts plaats voorzover uit een representatief grondmonster blijkt dat de aanwezige hoeveelheid
      stikstof, rekening houdend met de minerale stikstof en met de toevoer van stikstof door netto-mineralisatie van
      voorraden organische stikstof in de bodem, onvoldoende is om te voldoen aan de behoefte van het desbetreffende
      gewas. Het representatieve grondmonster wordt genomen, bemonsterd en geanalyseerd door een laboratorium dat
      blijkens accreditatie door Raad voor Accreditatie te Utrecht aantoonbaar voldoet aan de norm NEN-EN-ISO/IEC 17025.

      5 Het in het eerste lid gestelde verbod is in de periode van 16 september tot en met 30 november niet van
      toepassing op grasland, indien direct na de vernietiging van de graszode in de desbetreffende grond tulp, krokus,
      iris of muscari wordt geplant.

      6 Het in het eerste lid gestelde verbod is in de periode van 1 november tot en met 31 december niet van toepassing
      op grasland, gelegen op kleigrond, indien na de vernietiging van de graszode als eerstvolgend gewas een ander gewas
      dan gras wordt geplant of gezaaid.

      7 Het in het eerste lid gestelde verbod is niet van toepassing op het vernietigen van de graszode op grasland als
      onderdeel van kavelinrichtingswerken die worden verricht na vaststelling van een plan van toedeling, op basis van:

      a. een landinrichtingsplan dat is vastgesteld overeenkomstig
      [artikelen 73 tot en met 83 van de Landinrichtingswet][ref1], waarin is voorzien in herverkaveling als bedoeld in
      [hoofdstuk VII van de Landinrichtingswet][ref2],

      b. een herinrichtingsplan dat is vastgesteld overeenkomstig de
      [artikelen 16 tot en met 20 van de Herinrichtingswet Oost-Groningen en de Gronings-Drentse Veenkoloniën][ref3],
      waarin is voorzien in herverkaveling als bedoeld in
      __REF001___________________________________________________________________________________________________________
      _____,

      c. een plan van voorzieningen dat is vastgesteld overeenkomstig de
      [artikelen 39 tot en met 44 van de Reconstructiewet Midden-Delfland][ref5],

      d. een reconstructieplan dat is vastgesteld overeenkomstig
      [hoofdstuk 2 van de Reconstructiewet concentratiegebieden][ref6], waarin is voorzien in herverkaveling als bedoeld
      in [hoofdstuk 3, titel 6 van de Reconstructiewet concentratiegebieden][ref7], of

      e. een inrichtingsplan dat is vastgesteld overeenkomstig de
      [artikelen 17 tot en met 20 van de Wet inrichting landelijk gebied][ref8].

      8 Het in het eerste lid gestelde verbod is niet van toepassing op grasland indien de
      graszode wordt vernietigd ten behoeve van de aanleg en onderhoud van een net als bedoeld in
      [artikel 20, tweede lid, van Boek 5 van het Burgerlijk Wetboek][ref9].

      9 Het in het eerste lid gestelde verbod is vanaf 1 juni niet van toepassing op grasland op zandgrond of lössgrond
      indien de graszode wordt vernietigd om schade aan het grasland te herstellen en wordt voldaan aan de volgende
      eisen:

      a. de beschadiging van het grasland is veroorzaakt door droogte of door vraat van dieren die in de graszode leven;

      b. de verwachte grasopbrengst zonder herinzaai is naar verwachting tenminste 25% lager dan in een jaar zonder vraat
      of droogte;

      c. de totale oppervlakte beschadigd grasland bedraagt tenminste 5% van de oppervlakte grasland die bij het bedrijf
      in gebruik is;

      d. een geregistreerd schade-expert bevestigt in een op het bedrijf te bewaren rapport dat is voldaan aan de onder a
      tot en met c genoemde voorwaarden;

      e. het voornemen om de graszode te vernietigen wordt minimaal zeven werk dagen voorafgaand aan de daadwerkelijke
      vernietiging, maar uiterlijk op 31 augustus van het betreffende jaar en na gereedkomen van het onder d bedoelde
      rapport, gemeld bij Onze Minister van Economische Zaken;

      f. op de betreffende percelen grasland vindt herinzaai van gras plaats binnen zeven werkdagen na de vernietiging
      van de graszode, maar uiterlijk op 15 september van het betreffende jaar.

      10 Met toepassing van [artikel 28, eerste lid, laatste zinsnede, van de Dienstenwet][ref10] is
      [paragraaf 4.1.3.3 van de Algemene wet bestuursrecht][ref11] niet van toepassing op de aanvraag tot accreditatie
      als bedoeld in het vierde lid.


