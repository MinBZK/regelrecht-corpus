  - number: '5'
    text: |-
      1 Het is verboden dierlijke meststoffen, zuiveringsslib of een mengsel met deze meststoffen te gebruiken op
      grasland, bouwland of niet-beteelde grond, tenzij de dierlijke meststoffen of het zuiveringsslib emissiearm worden
      aangewend.

      2 Het in het eerste lid gestelde verbod is in de periode van 1 maart tot en met 31 mei niet van toepassing op het
      gebruik van drijfmest afkomstig van runderen ter voorkoming van schade aan gewassen door winderosie op bouwland
      gelegen op zandgrond in veenkoloniaal gebied of op Texel en indien op het perceel een gewas is ingezaaid, geplant
      of gepoot.

      3 Het in het eerste lid gestelde verbod is niet van toepassing op het gebruik van vaste dierlijke meststoffen
      onderscheidenlijk steekvast zuiveringsslib op grond waarop gras wordt geteeld of waarop uitsluitend fruitteelt
      wordt uitgeoefend, tenzij de grond een hellingspercentage heeft van 7 of meer.
    url: https://wetten.overheid.nl/BWBR0009066/2017-01-01#Artikel5
  - number: '6'
    text: |-
      Het is verboden dierlijke meststoffen, stikstofkunstmest, zuiveringsslib, compost, herwonnen fosfaten, overige
      organische meststoffen of een mengsel met deze meststoffen te gebruiken anders dan door een zo gelijkmatig
      mogelijke verspreiding over het perceel waarop de meststoffen worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0009066/2017-01-01#Artikel6
  - number: 6a
    text: |-
      1 Het is verboden dierlijke meststoffen, stikstofkunstmest, zuiveringsslib, compost, herwonnen fosfaten, overige
      organische meststoffen of een mengsel met deze meststoffen te gebruiken op grond met een hellingspercentage van 7
      of meer indien de desbetreffende grond is aangetast door geulenerosie.

      2 Voor de toepassing van het eerste lid wordt onder geulenerosie verstaan: de versnelde afvoer van bodemmateriaal
      door oppervlakkig afstromend water, waarbij geulen van meer dan 30 centimeter diepte zijn ontstaan.
    url: https://wetten.overheid.nl/BWBR0009066/2017-01-01#Artikel6a
  - number: 6b
    text: |-
      1 Het is verboden dierlijke meststoffen, zuiveringsslib, compost, herwonnen fosfaten, overige organische
      meststoffen of een mengsel met deze meststoffen te gebruiken op niet-beteelde grond met een hellingspercentage van
      7 of meer.

      2 Het in het eerste lid gestelde verbod geldt niet voor niet-beteelde grond met een hellingspercentage van minder
      dan 18 indien deze grond uiterlijk acht dagen na het gebruik van de dierlijke meststoffen gelijkmatig is ingezaaid
      met een ander gewas dan maïs, aardappelen of bieten.

      3 De in het tweede lid genoemde uitzondering voor maïs, aardappelen of bieten geldt niet voor een perceel met
      een aaneengesloten lengte van ten hoogste 300 meter dat aan beide einden over de volle breedte door een duidelijk
      waarneembare kavelgrens is afgebakend, dan wel over de volle breedte wordt begrensd door grond die gelijkmatig is
      bedekt met een ander gewas dan maïs, aardappelen of bieten over een aaneengesloten lengte van ten minste 100 meter.

      4 Voor de toepassing van het derde lid wordt verstaan onder:

      a. lengte van een perceel: zijde van een perceel die de grootste hoek vormt met de hoofdrichting van de
      hoogtelijnen;

      b. breedte van een perceel: zijde van een perceel, die de kleinste hoek vormt met de hoofdrichting van de
      hoogtelijnen.
    url: https://wetten.overheid.nl/BWBR0009066/2017-01-01#Artikel6b
  - number: 6c
    text: Het is verboden stikstofkunstmest te gebruiken op niet-beteelde grond met een hellingspercentage van 7 of meer.
    url: https://wetten.overheid.nl/BWBR0009066/2017-01-01#Artikel6c
  - number: 6d
    text: |-
      Het verboden dierlijke meststoffen, stikstofkunstmest, zuiveringsslib, compost, herwonnen fosfaten, overige
      organische meststoffen of een mengsel met deze meststoffen te gebruiken op bouwland met een hellingspercentage van
      18 of meer.
    url: https://wetten.overheid.nl/BWBR0009066/2017-01-01#Artikel6d
  - number: '7'
    text: |-
      1 Onze Minister van Economische Zaken kan in overeenstemming met Onze Minister, op aanvraag en gehoord de
      Technische commissie bodem, ten behoeve van onderzoek ontheffing verlenen van de in de [artikelen 4][ref1],
      [4a][ref2], [4b][ref3], [5][ref4], [6][ref5], [6b][ref6] en [6d][ref7] gestelde verboden, op basis van een
      ingediend onderzoeksplan.

      2 Een ontheffing kan slechts worden verleend indien naar het oordeel van Onze Ministers:

        - de ontheffing noodzakelijk is voor het te verrichten onderzoek,
        - het onderzoeksplan voldoende duidelijk en onderbouwd is,
        - het voldoende aannemelijk is dat het onderzoek daadwerkelijk zal leiden tot het in het onderzoeksplan
      geformuleerde onderzoeksresultaat,
        - het onderzoek voldoende innovatief is,
        - het onderzoek voldoende beperkt in duur en omvang is, en
        - het belang van de bescherming van de bodem zich niet verzet tegen de ontheffing.


