        artikel: '2'
        paragraaf: '2'
  - number: '3'
    text: |-
      1 Het is verboden dierlijke meststoffen, stikstofkunstmest, zuiveringsslib, herwonnen fosfaten of een mengsel
      met deze meststoffen te gebruiken indien de bodem geheel of gedeeltelijk is bevroren of geheel of gedeeltelijk is
      bedekt met sneeuw.

      2 Het in het eerste lid gestelde verbod is niet van toepassing op het gebruik van vaste mest op grasland waarop
      een beheer wordt gevoerd, indien het gebruik van vaste mest onderdeel is van het op het desbetreffende grasland van
      toepassing zijnde beheersregime.

      3 Het in het eerste lid gestelde verbod is, voor zover het betreft het gebruik indien de bodem
      geheel of gedeeltelijk is bevroren, niet van toepassing op het gebruik van stikstofkunstmest
      op kleigrond waarop graan wordt geteeld, mits in het algemeen weerbericht, bedoeld in
      [artikel 3, eerste lid, onderdeel a, van de Wet taken meteorologie en seismologie][ref1], voor de desbetreffende
      regio van het land is voorspeld dat de maximumtemperatuur op de dag waarop de meststoffen worden gebruikt ten
      minste 5° Celsius bedraagt en dat de minimumtemperatuur gedurende het etmaal volgend op die dag ten minste 0°
      Celsius bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0037074#Artikel3
    url: https://wetten.overheid.nl/BWBR0009066/2023-02-15#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0037074
        artikel: '3'
  - number: 3a
    text: |-
      Het is verboden dierlijke meststoffen, stikstofkunstmest, zuiveringsslib, compost, herwonnen fosfaten, overige
      organische meststoffen of een mengsel met deze meststoffen te gebruiken indien de bovenste bodemlaag met water
      verzadigd is.
    url: https://wetten.overheid.nl/BWBR0009066/2023-02-15#Artikel3a
  - number: 3b
    text: |-
      1 Het is verboden in de periode van 1 september tot en met 31 januari dierlijke meststoffen, stikstofkunstmest,
      zuiveringsslib, compost, herwonnen fosfaten, overige organische meststoffen of een mengsel met deze meststoffen te
      gebruiken indien de bodem tegelijkertijd wordt bevloeid, beregend of geïnfiltreerd.

      2 Voor de toepassing van het eerste lid wordt onder infiltreren verstaan: aanvoeren van water op of onder het
      grondoppervlak door middel van een buizen- of slangenstelsel.
    url: https://wetten.overheid.nl/BWBR0009066/2023-02-15#Artikel3b
  - number: '4'
    text: |-
      1 Het is verboden in de periode van 1 september tot en met 31 januari vaste mest of steekvast zuiveringsslib te
      gebruiken.

      2 Het in het eerste lid gestelde verbod is niet van toepassing op:

      a. grasland, gelegen op kleigrond of veengrond:

      1°. in de periode van 1 september tot en met 15 september;

      2°. in de periode van 1 december tot en met 31 januari, indien het vaste strorijke mest betreft;

      b. bouwland, gelegen op kleigrond of veengrond;

      c. bouwland, gelegen op zandgrond of lössgrond, indien op de desbetreffende grond bomen worden geteeld, voor zover
      het gebruik direct voorafgaand aan de aanplant van de bomen plaatsvindt;

      d. grasland en bouwland, gelegen op zandgrond of lössgrond, in de periode van 1 januari tot en met 31 januari,
      indien het vaste strorijke mest betreft.

      3 Het is verboden in de periode van 1 augustus tot en met 15 maart drijfmest of vloeibaar zuiveringsslib te
      gebruiken.

      4 Het in het derde lid gestelde verbod is niet van toepassing op:

      a. grasland, in de periode van 1 augustus tot en met 31 augustus en in de periode van 16 februari tot en met
      15 maart;

      b. bouwland, in de periode van 1 augustus tot en met 15 september, indien:

      1°. uiterlijk op 15 september op de desbetreffende grond winterkoolzaad voor zaadwinning in het daaropvolgende jaar
      wordt gezaaid,

      2°. uiterlijk op 15 september op de desbetreffende grond een bij ministeriële regeling aangewezen gewas wordt
      ingezaaid of geplant dat niet eerder dan acht weken na de datum van inzaaien of planten wordt vernietigd, of

      3°. in de desbetreffende grond in het daarop aansluitende najaar bloembollen worden geplant;

      c. bouwland, in de periode van 16 februari tot en met 15 maart, indien op de desbetreffende grond in hetzelfde
      kalenderjaar een bij ministeriële regeling aangewezen gewas wordt ingezaaid, geplant of gepoot.

      5 Het in het eerste en derde lid gestelde verbod is niet van toepassing op het gebruik van zuiveringsslib dat niet
      meer dan 70 gram stikstof per kilogram droge stof bevat, indien:

      a. het zuiveringsslib door de producent of namens hem door tussenkomst van ten hoogste één vervoerder rechtstreeks
      aan de gebruiker is afgeleverd;

      b. het zuiveringsslib wordt gebruikt op de dag waarop het aan de gebruiker is afgeleverd; en

      c. het zuiveringsslib, nadat overeenkomstig de krachtens
      [artikel 21, eerste lid, onderdeel d, van het Uitvoeringsbesluit Meststoffenwet][ref1] gestelde regels, de
      samenstelling ervan is bepaald, niet is gemengd met ander zuiveringsslib of andere stoffen.

      6 De landbouwer meldt de grond, bedoeld in het vierde lid, onderdeel c, en de voorgenomen teelt van een gewas als
      bedoeld in dat onderdeel, uiterlijk de dag voorafgaand aan het gebruik van drijfmest of vloeibaar zuiveringsslib
      in de periode van 16 februari tot en met 15 maart aan Onze Minister van Landbouw, Natuur en Voedselkwaliteit met
      gebruikmaking van een door die minister beschikbaar gesteld middel.

      7

      8 Onverminderd het zesde lid bevat de daar bedoelde melding de volgende gegevens:

      a. naam en adres van de gebruiker van de grond; en

      b. een kadastrale of topografische aanduiding van de grond alsmede een opgave van de oppervlakte ervan.

      9

      10

      11

      12 Bij ministeriële regeling kan het gebruik van dierlijke meststoffen of zuiveringsslib in de periode van
      1 augustus tot 15 augustus, dan wel in de periode van 1 september tot 15 september indien het het gebruik van
      drijfmest of vloeibaar zuiveringsslib op grasland, gelegen op kleigrond of veengrond betreft, van het bij die
      regeling te bepalen jaar en in het bij die regeling te bepalen gebied worden toegestaan, indien naar het oordeel
      van Onze Minister, de Technische commissie bodem gehoord:

      a. daarvoor een landbouwkundige noodzaak bestaat; en

      b. dit in het desbetreffende gebied door extreme weersomstandigheden is gerechtvaardigd.


