        bwb_id: BWBR0009066
        artikel: 4b
        paragraaf: '3'
  - number: '10'
    text: |-
      Op overeenkomsten inzake aan het beheer van natuurterrein verbonden beperkingen ten aanzien van de gebruikte
      hoeveelheid dierlijke meststoffen die zijn gesloten voor 1 januari 2020 en die nadien niet zijn gewijzigd of
      verlengd, is [artikel 2, tweede lid][ref1], van toepassing zoals dat luidde onmiddellijk voorafgaand aan 1 januari
      2020.


      [ref1]: https://wetten.overheid.nl/BWBR0009066#Artikel2
