  - number: 8a
    text: |-
      1 Op zand- en lössgronden wordt na de teelt van maïs:

      a. direct aansluitend en uiterlijk op 1 oktober van het desbetreffende jaar een bij ministeriële regeling
      aangewezen gewas geteeld, of

      b. uiterlijk op 31 oktober een bij ministeriële regeling aangewezen gewas geteeld als hoofdteelt voor het volgende
      jaar.

      2 In afwijking van het eerste lid, onderdeel a, wordt na de teelt van maïs overeenkomstig de biologische
      productiemethode en maïs, niet zijnde snijmaïs, direct aansluitend en uiterlijk op 31 oktober van het
      desbetreffende jaar een bij ministeriële regeling aangewezen gewas geteeld.

      3 De gewassen, bedoeld in het eerste lid, onderdelen a en b, en tweede lid, worden niet vernietigd voor 1 februari
      van het volgende jaar.

      4 De landbouwer meldt de teelt van een aangewezen gewas als bedoeld in het eerste lid, onderdeel b, uiterlijk op
      1 oktober aan Onze Minister van Landbouw, Natuur en Voedselkwaliteit met gebruikmaking van een door die minister
      beschikbaar gesteld middel.
    url: https://wetten.overheid.nl/BWBR0009066/2023-02-15#Artikel8a
  - number: 8b
    text: |-
      1 Op landbouwgrond, gelegen op zand- of lössgrond, wordt per aaneengesloten periode van vier kalenderjaren,
      gerekend vanaf 1 januari 2023, ten minste in één kalenderjaar en uiterlijk in het vierde kalenderjaar, op de
      desbetreffende grond een bij ministeriële regeling aangewezen gewas geteeld.

      2 Aan de verplichting, bedoeld in het eerste lid, kan elke landbouwer die op de desbetreffende grond landbouw
      uitoefent voldoen, maar indien daaraan gedurende de eerste drie kalenderjaren van een periode als bedoeld in
      het eerste lid niet is voldaan, berust de verplichting op elke landbouwer die in het vierde kalenderjaar op de
      desbetreffende grond landbouw uitoefent.

      3 Het eerste lid is niet van toepassing:

      a. voor teelten van gewassen die meer dan vier jaar onafgebroken op een perceel staan; of

      b. voor de teelt van gewassen overeenkomstig de biologische productiemethode.
    url: https://wetten.overheid.nl/BWBR0009066/2023-02-15#Artikel8b
  - number: '9'
    text: |-
      Met een laboratorium dat representatieve grondmonsters als bedoeld in [artikel 4b, vierde lid][ref1], analyseert,
      wordt gelijk gesteld een vergelijkbare instelling, gevestigd in een andere lidstaat van de Europese Unie, dan
      wel in een andere staat die partij is bij een daartoe strekkend Verdrag dat Nederland bindt, die een verklaring
      verstrekt op basis van onderzoekingen die voldoen aan een kwaliteitsborgingniveau dat tenminste gelijkwaardig is
      aan het niveau dat met de nationale onderzoekingen wordt nagestreefd.


      [ref1]: https://wetten.overheid.nl/BWBR0009066#Artikel4b
    url: https://wetten.overheid.nl/BWBR0009066/2023-02-15#Artikel9
    references:
