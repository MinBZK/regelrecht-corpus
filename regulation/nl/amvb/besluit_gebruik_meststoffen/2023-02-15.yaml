  - number: '11'
    text: Dit besluit treedt in werking met ingang van een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0009066/2023-02-15#Artikel11
  - number: '12'
    text: 'Dit besluit wordt aangehaald als: Besluit gebruik meststoffen.'
