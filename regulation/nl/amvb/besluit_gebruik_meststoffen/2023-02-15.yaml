  - number: 1a
    text: |-
      1 Het is verboden meststoffen te gebruiken.

      2 Onverminderd de overige bepalingen in dit besluit geldt het in het eerste lid gestelde verbod niet indien
      de meststoffen voldoen aan de bij of krachtens [hoofdstuk III van het Uitvoeringsbesluit Meststoffenwet][ref1]
      gestelde regels.

      3 Indien het meststoffen betreft ten aanzien waarvan in de krachtens
      [artikel 21, eerste lid, onderdeel h, van het Uitvoeringsbesluit Meststoffenwet][ref2], gestelde regels is bepaald
      dat de [artikelen 11][ref3], [14][ref4] en [15 van dat besluit][ref5] geheel of gedeeltelijk niet van toepassing
      zijn, geldt het in het eerste lid bedoelde verbod, in zoverre in afwijking van het tweede lid, niet indien
      de gebruikte hoeveelheid van die meststoffen niet groter is dan de bij ministeriële regeling vast te stellen
      hoeveelheid.


      [ref1]: https://wetten.overheid.nl/BWBR0019031#HoofdstukIII
      [ref2]: https://wetten.overheid.nl/BWBR0019031#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0019031#Artikel11
      [ref4]: https://wetten.overheid.nl/BWBR0019031#Artikel14
      [ref5]: https://wetten.overheid.nl/BWBR0019031#Artikel15
