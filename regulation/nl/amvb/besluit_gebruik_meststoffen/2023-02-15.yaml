  - number: '8'
    text: |-
      1 Gedeputeerde staten kunnen voor de periode van 1 tot en met 15 september ten behoeve van experimenten met het
      gebruik van dierlijke meststoffen op bouwland of niet-beteelde grond, gelegen op zand- of lössgrond, of ten behoeve
      van experimenten met het gebruik van compost, zuiveringsslib, herwonnen fosfaten of overige organische meststoffen
      op bouwland, gelegen op zand- of lössgrond, op aanvraag, ontheffing verlenen van het in [artikel 4][ref1] gestelde
      verbod, op basis van een ingediend voorstel voor een experiment.

      2 De ontheffing kan slechts worden verleend na kennisgeving door gedeputeerde staten aan Onze Minister van de in
      het eerste lid bedoelde aanvraag en nadat Onze Minister ter zake de Technische commissie bodem heeft gehoord.

      3 [Artikel 7, derde lid][ref2], is van overeenkomstige toepassing.


