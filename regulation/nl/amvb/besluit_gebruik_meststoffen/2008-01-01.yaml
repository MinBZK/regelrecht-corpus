        artikel: '2'
        paragraaf: '2'
  - number: '3'
    text: |-
      1 Het is verboden dierlijke meststoffen, stikstofkunstmest, zuiveringsslib of een mengsel met deze meststoffen te
      gebruiken indien de bodem geheel of gedeeltelijk is bevroren of geheel of gedeeltelijk is bedekt met sneeuw.

      2 Het in het eerste lid gestelde verbod is niet van toepassing op het gebruik van vaste mest op grasland waarop
      een beheer wordt gevoerd, indien het gebruik van vaste mest onderdeel is van het op het desbetreffende grasland van
      toepassing zijnde beheersregime.
    url: https://wetten.overheid.nl/BWBR0009066/2008-01-01#Artikel3
  - number: 3a
    text: |-
      Het is verboden dierlijke meststoffen, stikstofkunstmest, zuiveringsslib, compost, overige organische meststoffen
      of een mengsel met deze meststoffen te gebruiken indien de bovenste bodemlaag met water verzadigd is.
    url: https://wetten.overheid.nl/BWBR0009066/2008-01-01#Artikel3a
  - number: 3b
    text: |-
      1 Het is verboden in de periode van 1 september tot en met 31 januari dierlijke meststoffen, stikstofkunstmest,
      zuiveringsslib, compost, overige organische meststoffen of een mengsel met deze meststoffen te gebruiken indien de
      bodem tegelijkertijd wordt bevloeid, beregend of geïnfiltreerd.

      2 Voor de toepassing van het eerste lid wordt onder infiltreren verstaan: aanvoeren van water op of onder het
      grondoppervlak door middel van een buizen- of slangenstelsel.
    url: https://wetten.overheid.nl/BWBR0009066/2008-01-01#Artikel3b
  - number: '4'
    text: |-
      1 Het is verboden in de periode van 1 september tot en met 31 januari dierlijke meststoffen, zuiveringsslib of een
      mengsel met deze meststoffen te gebruiken.

      2 Het in het eerste lid gestelde verbod is in de periode van 1 tot en met 15 september niet van toepassing op
      grasland, gelegen op kleigrond of veengrond.

      3 Het in het eerste lid gestelde verbod is niet van toepassing op het gebruik van vaste dierlijke meststoffen
      onderscheidenlijk steekvast zuiveringsslib op bouwland, gelegen op kleigrond of veengrond.

      4 Het in het eerste lid gestelde verbod is niet van toepassing op het gebruik van drijfmest onderscheidenlijk
      vloeibaar zuiveringsslib op bouwland, gelegen op kleigrond, in de periode van:

      a. 1 september 2005 tot en met 30 november 2005;

      b. 1 september 2006 tot en met 15 november 2006;

      c. 1 september 2007 tot en met 31 oktober 2007;

      d. 1 september 2008 tot en met 15 oktober 2008;

      e. 1 september tot en met 15 september in de jaren 2009 en volgende.

      5 Het in het eerste lid gestelde verbod is niet van toepassing op het gebruik van drijfmest onderscheidenlijk
      vloeibaar zuiveringsslib op bouwland, gelegen op veengrond, in de periode van 1 september tot en met 15 september.

      6 Het in het eerste lid gestelde verbod is niet van toepassing op het gebruik van zuiveringsslib dat niet meer dan
      70 gram stikstof per kilogram droge stof bevat, indien:

      a. het zuiveringsslib door de producent of namens hem door tussenkomst van ten hoogste één vervoerder rechtstreeks
      aan de gebruiker is afgeleverd;

      b. het zuiveringsslib wordt gebruikt op de dag waarop het aan de gebruiker is afgeleverd; en

      c. het zuiveringsslib, nadat overeenkomstig de krachtens
      [artikel 21, eerste lid, onderdeel d, van het Uitvoeringsbesluit Meststoffenwet][ref1] gestelde regels, de
      samenstelling ervan is bepaald, niet is gemengd met ander zuiveringsslib of andere stoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel21
