  - number: 1b
    text: |-
      1 Het is verboden zuiveringsslib en overige organische meststoffen te gebruiken.

      2 Het in het eerste lid gestelde verbod geldt niet voor het gebruik van overige organische meststoffen op
      landbouwgrond.

      3 Het in het eerste lid gestelde verbod geldt niet voor het gebruik van zuiveringsslib op percelen landbouwgrond
      waarvan overeenkomstig de krachtens [artikel 1c][ref1] gestelde regels is vastgesteld dat een of meer van de in de
      bodem aanwezige stoffen de in [bijlage III][ref2] opgenomen toetsingswaarden niet overschrijden, en voor zover:

      a. indien het vloeibaar zuiveringslib betreft, de gebruikte hoeveelheid niet groter is dan:

      i. twee ton droge stof per hectare per jaar op bouwland; of

      ii. één ton droge stof per hectare per jaar op grasland; of

      b. indien het steekvast zuiveringslib betreft, de gebruikte hoeveelheid niet groter is dan:

      i. vier ton droge stof per hectare per twee jaren op bouwland; of

      ii. twee ton droge stof per hectare per twee jaren op grasland.

      4 Gedurende de in het derde lid bedoelde perioden blijft het grondgebruik voor het desbetreffende aantal hectaren
      ongewijzigd.

      5 In zoverre in afwijking van de aanhef van het derde lid, geldt het in het eerste lid gestelde verbod
      niet voor het gebruik van zuiveringsslib op percelen landbouwgrond waarvan overeenkomstig de krachtens
      [artikel 16 van het Besluit kwaliteit en gebruik overige organische meststoffen][ref3] gestelde regels, zoals
      deze luidden op het tijdstip waarop dit artikel in werking is getreden, is vastgesteld dat een of meer van de in
      de bodem aanwezige stoffen de in [bijlage III][ref4] opgenomen toetsingswaarden niet overschrijden, voor zover de
      geldigheidsduur van deze vaststelling niet is overschreden.


      [ref1]: https://wetten.overheid.nl/BWBR0009066#Artikel1c
