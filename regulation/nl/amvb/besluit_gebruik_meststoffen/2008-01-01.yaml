preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Landbouw, Natuurbeheer en Visserij van 25 juni 1997, No. J. 975376, gedaan
    mede namens Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer;

    Gelet op de artikelen 6, 7, 15 en 65 van de Wet bodembescherming;

    De Raad van State gehoord (advies van 14 oktober 1997, nr. W11.97.0391);

    Gezien het nader rapport van Onze Minister van Landbouw, Natuurbeheer en Visserij van 20 november 1997, No. J.
    9712655, uitgebracht mede namens Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0009066/2008-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In dit besluit en de daarop berustende bepalingen wordt verstaan onder grond, meststoffen,
      bedrijf, landbouwgrond, fosfaat, hectare, veengrond, zand- of lössgrond en kleigrond hetgeen
      daaronder wordt verstaan in [artikel 1, eerste lid, van de Meststoffenwet][ref1], wordt verstaan
      onder zuiveringsslib, compost en overige organische meststoffen hetgeen daaronder wordt verstaan in
      [artikel 1, eerste lid, van het Uitvoeringsbesluit Meststoffenwet][ref2] en wordt verstaan onder:

      a. *dierlijke meststoffen*: uitwerpselen van dieren, daaronder begrepen de geheel of gedeeltelijk verteerde maag-
      of darminhoud van deze dieren en mengsels van strooisel met de uitwerpselen, alsook producten daarvan;

      b. *gebruiken van meststoffen*: meststoffen op of in de bodem brengen;

      c. *grasland*: grond die voor ten minste 50 procent is beteeld met gras dat blijkens het gebruik van de grond is
      bestemd om te worden gebruikt als veevoer door beweiding van de grond met dieren of door de winning van het gewas
      voor vervoedering aan dieren;

      d. *bouwland*: grond waarop ten minste een deel van het jaar een gewas wordt geteeld, niet zijnde grasland;

      e. *natuurterrein*: grond met een houtopstand die de hoofdfunctie natuur heeft, heideveld, ven, hoogveenterrein,
      zandverstuiving, duinterrein, kwelder, schor, gors, slik, riet- en ruigtland, griend en laagveenmoeras, alsmede
      grasland of bouwland dat de hoofdfunctie natuur heeft;

      f. *beheer*: beheer, gericht op de instandhouding van natuurwaarden, dat

      1°. is vastgesteld krachtens de [Natuurbeschermingswet 1998][ref3],

      2°. geldt als voorwaarde voor de verlening van een subsidie op grond van de [Kaderwet LNV-subsidies][ref4], of

      3°. tot stand is gekomen met instemming van Onze Minister van Landbouw, Natuur en Voedselkwaliteit;

      g. *overige grond*: andere grond dan natuurterrein en dan landbouwgrond die tot een bedrijf behoort;

      h. *stikstofkunstmest*: anorganische meststoffen als bedoeld in
      [artikel 1, eerste lid, onderdeel j, van het Uitvoeringsbesluit Meststoffenwet][ref5], die meer dan 0,5
      gewichtsprocenten van de droge stof aan stikstof bevatten;

      i. *vaste mest*: dierlijke meststoffen die niet verpompbaar zijn;

      j. *drijfmest*: dierlijke meststoffen die verpompbaar zijn;

      k. *steekvast zuiveringsslib*: zuiveringsslib dat niet verpompbaar is;

      l. *vloeibaar zuiveringsslib*: zuiveringsslib dat verpompbaar is;

      m. *fruitteelt*: bedrijfsmatige teelt op bouwland van vruchten, bestemd voor menselijke consumptie en groeiend aan
      houtige gewassen;

      n. *emissiearm aanwenden*: gebruiken overeenkomstig de voorschriften die voor de desbetreffende situatie zijn
      opgenomen in de bij dit besluit behorende [bijlage I][ref6];

      o. *veenkoloniaal bouwplan*: bouwplan met de teelt van fabrieksaardappelen ten behoeve van de zetmeelindustrie
      met een teeltfrequentie van ten minste éénmaal per drie jaar, met dien verstande dat geen sprake is van een
      veenkoloniaal bouwplan in de periode dat op de desbetreffende grond bloembollen worden geteeld of gras wordt
      geteeld;

      p. *hellingspercentage*: quotiënt van het hoogteverschil en de horizontale afstand, uitgedrukt in procenten,
      volgens de in [bijlage II][ref7] bij dit besluit aangegeven meetmethode;

      q. *niet-beteelde grond*: grond waarvan niet kan worden waargenomen dat deze gelijkmatig met een gewas is bedekt.

      2 Voor de toepassing van [artikel 1b, derde lid][ref8], is de situatie op 15 mei van het jaar waarin zuiveringsslib
      wordt gebruikt, bepalend voor de vraag of sprake is van bouwland of grasland, met dien verstande dat indien op 15
      mei van het desbetreffende jaar landbouwgrond niet wordt beteeld, deze grond wordt aangemerkt als bouwland, tenzij
      de grond het gehele jaar niet wordt beteeld, in welk geval de grond wordt aangemerkt als overige grond.

      3 Voor de toepassing van [artikel 4b][ref9] wordt onder grasland verstaan: grond die voor ten minste 50 procent uit
      gras bestaat dat is of wordt gebruikt voor beweiding met dieren of voor de winning van het gewas voor vervoedering
      aan dieren.

      4 Voor de toepassing van de [artikelen 4][ref10], [4a][ref11], [5][ref12] en [6d][ref13] wordt onder bouwland
      niet verstaan grond waarop tuinbouw in glasopstanden wordt uitgeoefend, of waarop een anderszins bedekte teelt
      plaatsvindt.

      5 Dit besluit berust, voor zover het de [artikelen 4b][ref14], [6a][ref15], [6b][ref16], [6c][ref17], [6d][ref18]
      en [8a][ref19] betreft, mede op de [artikelen 10][ref20] en [11 van de Wet bodembescherming][ref21].


