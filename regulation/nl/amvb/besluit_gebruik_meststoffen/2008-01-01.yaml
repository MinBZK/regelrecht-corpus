  - number: 8a
    text: |-
      1 Op zand- en lössgronden wordt na de teelt van maïs direct aansluitend een bij ministeriële regeling aangewezen
      gewas geteeld.

      2 De gewassen die na maïs worden geteeld, bedoeld in het eerste lid, mogen niet worden vernietigd voor 1 februari
      van het daarop volgende jaar.
    url: https://wetten.overheid.nl/BWBR0009066/2008-01-01#Artikel8a
  - number: '9'
    text: |-
      Met een laboratorium als bedoeld in [artikel 4b, derde lid][ref1], wordt gelijk gesteld een vergelijkbare
      instelling, gevestigd in een andere lidstaat van de Europese Unie, dan wel in een andere staat die partij is
      bij een daartoe strekkend Verdrag dat Nederland bindt, die een verklaring verstrekt op basis van onderzoekingen
      die voldoen aan een kwaliteitsborgingniveau dat tenminste gelijkwaardig is aan het niveau dat met de nationale
      onderzoekingen wordt nagestreefd.


