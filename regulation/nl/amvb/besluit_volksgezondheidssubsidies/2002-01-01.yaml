        artikel: '32'
        hoofdstuk: VI
        paragraaf: '1'
  - number: '2'
    text: |-
      1 Activiteiten waarvoor subsidies kunnen worden verstrekt zijn activiteiten die gericht zijn op, dan wel liggen op
      het terrein van:

      a. bevordering en instandhouding van de zorgverlening van de lichamelijke gezondheidssituatie;

      b. medische ethiek;

      c. extramurale zorg;

      d. ambulancehulpverlening en ziekenvervoer;

      e. ziekenhuiszorg en topzorg;

      f. orgaandonatie;

      g. zorgvoorziening gehandicapten;

      h. geneesmiddelenvoorziening;

      i. medische hulpmiddelen en bloedtransfusiezaken;

      j. geestelijke gezondheidszorg;

      k. verslavingszorg, behoudens voorzover de [Welzijnswet 1994][ref1] van toepassing is;

      l. maatschappelijke opvang, behoudens voorzover de [Welzijnswet 1994][ref2] van toepassing is;

      m. voeding en veterinair beleid;

      n. gezondheidsbevordering en ziektepreventie;

      o. consumentenveiligheid en omgevingsrisico's;

      p. patiëntenbeleid;

      q. chronische ziekten;

      r. zorgvoorziening ouderen.

      2 Subsidies kunnen ten behoeve van de in het eerste lid genoemde terreinen afzonderlijk dan wel ten behoeve van
      meerdere beleidsterreinen gezamenlijk met het oog op een samenhangend beleid dan wel samenhangende beleidsthema's
      verstrekt worden, alsmede ten behoeve van het algemeen beleid op het terrein van de gezondheidsbevordering,
      gezondheidsbescherming en gezondheidszorg.

      3 Bij ministeriële regeling kunnen de activiteiten, bedoeld in de voorgaande leden, nader worden omschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0006705
      [ref2]: https://wetten.overheid.nl/BWBR0006705
    url: https://wetten.overheid.nl/BWBR0009696/2002-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006705
      - id: ref2
        bwb_id: BWBR0006705
  - number: 2a
    text: |-
      Dit besluit is van toepassing op de verstrekking van subsidies en uitkeringen voor activiteiten als bedoeld in
      [artikel 2][ref1], tenzij daarvoor bij een algemene maatregel van bestuur of ministeriële regeling als bedoeld in
      [artikel 3 van de wet][ref2], andere regels zijn gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0009696#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0009455#Artikel3
    url: https://wetten.overheid.nl/BWBR0009696/2002-01-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0009696
        artikel: '2'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0009455
        artikel: '3'
  - number: '3'
    text: |-
      1 Een subsidie of een uitkering ten laste van een begroting die nog niet is vastgesteld, wordt verleend onder de
      voorwaarde, bedoeld in [artikel 4:34, eerste lid, van de Algemene wet bestuursrecht][ref1].

      2 Subsidies en uitkeringen worden slechts verstrekt voorzover Onze Minister van oordeel is dat de verstrekking past
      in de hoofdlijnen van zijn beleid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel434
    url: https://wetten.overheid.nl/BWBR0009696/2002-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:34
  - number: '4'
    text: |-
      1 Subsidie wordt voorts slechts verstrekt indien:

      a. naar het oordeel van Onze Minister mag worden verwacht dat de met de subsidiëring beoogde doeleinden zullen
      worden bereikt en

      b. de aanvrager:

      1°. naar het oordeel van Onze Minister de behoefte aan subsidie heeft aangetoond en

      2°. aannemelijk heeft gemaakt dat de financiële middelen met inbegrip van subsidie voldoende zullen zijn om de
      voorgenomen activiteiten uit te voeren.

      2 Het eerste lid, onder b, is niet van toepassing op rechtspersonen krachtens publiekrecht ingesteld.
    url: https://wetten.overheid.nl/BWBR0009696/2002-01-01#Artikel4
  - number: '5'
    text: |-
      1 Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de wijze waarop het bedrag van een
      subsidie of een uitkering wordt berekend.

      2 Bij ministeriële regeling kan worden voorzien in de vaststelling van een subsidieplafond en de regeling van de
      wijze van verdeling.
    url: https://wetten.overheid.nl/BWBR0009696/2002-01-01#Artikel5
  - number: '6'
    text: |-
      1 De instelling die voor haar activiteiten of een gedeelte daarvan in een jaar een instellingssubsidie
      verlangt, dient uiterlijk dertien weken vóór de aanvang van het desbetreffende jaar een subsidieaanvraag in.
      De aanvraag wordt onderbouwd met een activiteitenplan en een begroting van de instelling en gaat, indien de
      liquiditeitsbehoefte niet regelmatig gespreid is over het jaar, vergezeld van een liquiditeitsprognose.

      2 In het activiteitenplan worden de aard en de omvang van de voorgenomen activiteiten beschreven. Daarbij wordt
      aangegeven welke doelstelling de instelling met de activiteiten nastreeft, op welke wijze zij zullen worden
      uitgevoerd en voor welke doelgroep zij zijn bestemd.

      3 De begroting geeft inzicht in de baten en lasten van de activiteiten in dat jaar. Daarbij wordt uitgegaan van het
      prijspeil en van het niveau van de kosten van de arbeidsvoorwaarden op het moment van indiening van de aanvraag.
      De begroting is voorzien van een postgewijze toelichting. In geval van een privaatrechtelijke rechtspersoon
      bevat de begroting tevens zowel de baten en lasten van de instelling als geheel als de baten en lasten van elk te
      onderscheiden onderdeel van de instelling.

      4 De liquiditeitsprognose geeft gemotiveerd inzicht in het verloop van de liquiditeitsbehoefte van de activiteiten
      per kalenderkwartaal.

      5 Onze Minister kan ontheffing verlenen van de in het eerste lid genoemde aanvraagtermijn.
    url: https://wetten.overheid.nl/BWBR0009696/2002-01-01#Artikel6
  - number: '7'
    text: |-
      1 Bij de aanvraag van een instellingssubsidie door een privaatrechtelijke rechtspersoon worden tevens overgelegd:

      a. een afschrift van de oprichtingsakte of de statuten;

      b. een afschrift waaruit de inschrijving van de instelling in het geldende openbaar register blijkt;

      c. een volledig overzicht van de financiële toestand van de instelling op het tijdstip van de aanvraag en

      d. indien de aanvraag is ondertekend door een of meer andere personen dan de personen die op grond van de statuten
      bevoegd zijn de instelling te vertegenwoordigen: een afschrift van de volmacht op grond waarvan de aanvraag door
      die andere persoon of personen is ondertekend.

      2 Voorzover de aanvrager voor dezelfde begrote uitgaven tevens subsidie of een andere financiële bijdrage heeft
      aangevraagd bij een of meer andere bestuursorganen of organisaties, doet hij daarvan mededeling in de aanvraag,
      onder vermelding van de stand van zaken met betrekking tot de beoordeling van die aanvraag of aanvragen.

      3 Overlegging van de in het eerste lid bedoelde afschriften kan achterwege blijven, indien de aanvrager er
      redelijkerwijs van uit kan gaan dat deze gegevens aan Onze Minister bekend zijn.
    url: https://wetten.overheid.nl/BWBR0009696/2002-01-01#Artikel7
  - number: '8'
    text: |-
      1 Onze Minister kan projectsubsidies verlenen die zich uitstrekken over meer dan een kalenderjaar.

      2 De natuurlijke persoon of rechtspersoon die subsidie voor een bepaald project verlangt, dient ten minste dertien
      weken vóór de aanvang van het project een aanvraag in. De aanvraag wordt onderbouwd met een projectplan en een
      begroting en gaat vergezeld van een liquiditeitsprognose.

      3 In het projectplan worden de aard en de omvang van de voorgenomen activiteiten beschreven. Daarbij wordt
      aangegeven welke doelstelling de aanvrager met de activiteiten nastreeft en op welke wijze die zullen worden
      uitgevoerd.

      4 De begroting geeft inzicht in de baten en lasten van het project. De begroting is voorzien van een postgewijze
      toelichting. Daarbij wordt uitgegaan van het prijspeil en van het niveau van de kosten van de arbeidsvoorwaarden op
      het moment van indiening van de aanvraag.

      5 De liquiditeitsprognose geeft gemotiveerd inzicht in het verloop van de liquiditeitsbehoefte van de activiteiten
      per maand. De liquiditeitsprognose kan achterwege blijven als de liquiditeitsbehoefte regelmatig gespreid is over
      de duur van het project.

      6 In afwijking van het tweede lid kan Onze Minister bepalen dat aanvragen voor projecten op bepaalde terreinen vóór
      een of meer door hem vastgestelde data worden ingediend.

      7 Onze Minister kan ontheffing verlenen van de in het tweede of zesde lid bedoelde aanvraagtermijn.
    url: https://wetten.overheid.nl/BWBR0009696/2002-01-01#Artikel8
  - number: '9'
    text: |-
      1 Bij de aanvraag van de subsidie door een privaatrechtelijke rechtspersoon worden tevens overgelegd:

      a. een afschrift van de oprichtingsakte of de statuten;

      b. een afschrift waaruit de inschrijving van de instelling in het geldende openbaar register blijkt;

      c. indien de aanvraag is ondertekend door een of meer andere personen dan de personen die op grond van de statuten
      bevoegd zijn de instelling te vertegenwoordigen: een afschrift van de volmacht op grond waarvan de aanvraag door
      die andere persoon of personen is ondertekend.

      2 Onze Minister kan een aanvrager of een categorie aanvragers tevens verplichten tot het overleggen van een
      volledig overzicht van de financiële toestand van de instelling op het tijdstip van de aanvraag.

      3 Voorzover de aanvrager voor dezelfde begrote uitgaven tevens subsidie of een andere financiële bijdrage heeft
      aangevraagd bij een of meer andere bestuursorganen, doet hij daarvan mededeling in de aanvraag, onder vermelding
      van de stand van zaken met betrekking tot de beoordeling van die aanvraag of aanvragen.

      4 Overlegging van in het eerste lid bedoelde afschriften kan achterwege blijven, indien de aanvrager er
      redelijkerwijs van uit kan gaan dat deze gegevens aan Onze Minister bekend zijn.

      5 Het tweede lid is niet van toepassing indien een rechtspersoon krachtens publiekrecht ingesteld, een
      projectsubsidie aanvraagt.
    url: https://wetten.overheid.nl/BWBR0009696/2002-01-01#Artikel9
  - number: '10'
    text: |-
      Onze Minister geeft een beschikking op een aanvraag binnen dertien weken na ontvangst van de aanvraag. Met het oog
      op de onderlinge afweging van aanvragen kan bij ministeriële regeling worden bepaald dat op aanvragen wordt beslist
      na een of meer bepaalde data in een kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0009696/2002-01-01#Artikel10
  - number: '11'
    text: |-
      1 Nadat een subsidieaanvraag is ingediend, kan Onze Minister voorschotten verlenen. Daarbij wordt rekening gehouden
      met de liquiditeitsbehoefte.

      2 Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de bevoorschotting.

      3 Indien de subsidieaanvraag te laat wordt ingediend en Onze Minister de aanvraag desondanks in behandeling neemt,
      kan hij het verlenen van voorschotten evenredig later doen plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0009696/2002-01-01#Artikel11
  - number: '12'
    text: |-
      1 Bij de verlening van een subsidie kan Onze Minister bepalen dat het subsidiebedrag door hem wordt bijgesteld,
      rekening houdend met de ontwikkeling van het prijspeil of de ontwikkeling in de kosten van de arbeidsvoorwaarden.

      2 Met het oog op de toepassing van het eerste lid kan Onze Minister bij de verlening van de subsidie tevens
      bepalen welk deel van het subsidiebedrag in aanmerking zal worden genomen voor een bijstelling in verband met de
      ontwikkeling van het prijspeil, onderscheidenlijk van de kosten van de arbeidsvoorwaarden.

      3 Indien een subsidie met toepassing van het eerste lid wordt bijgesteld, kan de bevoorschotting overeenkomstig
      worden gewijzigd.
    url: https://wetten.overheid.nl/BWBR0009696/2002-01-01#Artikel12
  - number: '13'
    text: |-
      1 De subsidieontvanger zorgt ervoor dat:

      a. de doeleinden gesteld in het activiteitenplan dan wel het projectplan op doelmatige wijze worden nagestreefd;

      b. de werkzaamheden op een zodanige manier worden geregeld dat een goed beleid en beheer worden gevoerd en

      c. de subsidie op doelmatige wijze wordt gebruikt voor de doeleinden waarvoor deze wordt verleend.
    url: https://wetten.overheid.nl/BWBR0009696/2002-01-01#Artikel13
  - number: '14'
    text: |-
      De subsidieontvanger zorgt er voorts voor dat:

      a. de administratie op overzichtelijke en doelmatige wijze wordt gevoerd;

      b. de administratie een juist, volledig en actueel beeld geeft van het functioneren van de instelling;

      c. van alle ontvangsten en uitgaven deugdelijke bewijsstukken waaruit de aard en de omvang van de geleverde
      goederen of van de verrichte diensten duidelijk blijken, aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0009696/2002-01-01#Artikel14
  - number: '15'
    text: |-
      1 Bij instellingen die een instellingssubsidie ontvangen, is het boekjaar gelijk aan het kalenderjaar.

      2 Bij ministeriële regeling kan vrijstelling worden verleend van het eerste lid.

      3 Onze Minister kan ontheffing verlenen van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0009696/2002-01-01#Artikel15
  - number: '16'
    text: |-
      De subsidieontvanger doet zo spoedig mogelijk schriftelijk mededeling aan Onze Minister van omstandigheden die van
      belang kunnen zijn voor een beslissing tot wijziging, intrekking of vaststelling van de subsidie. Daarbij worden de
      relevante stukken overgelegd.
    url: https://wetten.overheid.nl/BWBR0009696/2002-01-01#Artikel16
  - number: '17'
    text: |-
      1 De privaatrechtelijke rechtspersoon die een instellingssubsidie ontvangt, verzekert haar roerende en
      onroerende zaken op afdoende wijze tegen het risico van diefstal en brand alsmede tegen het risico van wettelijke
      aansprakelijkheid tegenover derden.

      2 De ontvanger van een instellingssubsidie verzekert voor vrijwilligers die werkzaamheden verrichten in het kader
      van de gesubsidieerde activiteiten, hun wettelijke aansprakelijkheid.

      3 Onze Minister kan op aanvraag ontheffing verlenen van het eerste of tweede lid.

      4 Onze Minister kan het eerste of tweede lid van overeenkomstige toepassing verklaren op de ontvanger van een
      projectsubsidie.
    url: https://wetten.overheid.nl/BWBR0009696/2002-01-01#Artikel17
  - number: '18'
    text: |-
      De subsidieontvanger stelt na afloop van de periode of het project waarvoor subsidie is verleend een verslag
      vast dat inzicht geeft in de aard, duur en omvang van de in het kader van de subsidiëring verrichte activiteiten.
      Het verslag vergelijkt de verrichte activiteiten met de in het activiteitenplan, onderscheidenlijk projectplan,
      voorgenomen activiteiten.
    url: https://wetten.overheid.nl/BWBR0009696/2002-01-01#Artikel18
  - number: '19'
    text: |-
      1 Indien een gesubsidieerde activiteit leidt tot een publicatie, kan Onze Minister bepalen dat de subsidieontvanger
      er zorg voor draagt dat bij de publicatie wordt aangegeven wie de uitvoerder en subsidiënt van het project zijn
      geweest.

      2 Indien een subsidie gericht is of mede gericht is op de totstandkoming van een werk als bedoeld
      in [artikel 10, onder 1°, van de Auteurswet 1912][ref1], draagt de subsidieontvanger er zorg voor
      auteursrechthebbende te zijn ter zake van dat werk.

      3 De subsidieontvanger vrijwaart de Staat der Nederlanden voor aanspraken van derden ter zake van alle schade die
      zij lijden ten gevolge van de door of vanwege de subsidieontvanger verrichte publicaties.


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel10
    url: https://wetten.overheid.nl/BWBR0009696/2002-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: '10'
  - number: '20'
    text: |-
      Aan de subsidie kunnen verplichtingen als bedoeld in [artikel 4:39 van de Algemene wet bestuursrecht][ref1] worden
      verbonden. Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot deze verplichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel439
    url: https://wetten.overheid.nl/BWBR0009696/2002-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:39
  - number: '21'
    text: |-
      1 Onze Minister kan bepalen dat de subsidieontvanger in de gevallen genoemd in
      [artikel 4:41, tweede lid, van de Algemene wet bestuursrecht][ref1], een door hem te bepalen vergoeding voor
      vermogensvorming is verschuldigd.

      2 Bij de bepaling van de hoogte van de vergoeding wordt uitgegaan van de waarde van de goederen en andere
      vermogensbestanddelen op het tijdstip waarop de vergoeding verschuldigd wordt, met dien verstande dat in geval
      van ontvangst van schadevergoeding voor verlies of beschadiging van zaken, wordt uitgegaan van het bedrag dat
      als schadevergoeding door de instelling wordt ontvangen. Indien het onroerende zaken betreft, geschiedt de
      waardebepaling door één of drie onafhankelijke deskundigen.

      3 Toepassing van het eerste lid blijft achterwege indien de activiteiten van de subsidieontvanger, na toestemming
      van Onze Minister, door een andere rechtspersoon worden voortgezet en de activa tegen boekwaarde aan die andere
      rechtspersoon in eigendom zijn overgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel441
    url: https://wetten.overheid.nl/BWBR0009696/2002-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:41
  - number: '22'
    text: |-
      1 De vergoeding die de instelling betaalt aan een organisatie die zich de ondersteuning van één of meer
      gesubsidieerde instellingen ten doel stelt, voor door die organisatie aan de instelling ter beschikking gestelde
      goederen, is niet hoger dan het bedrag dat op grond van de verkrijgingsprijs of vervaardigingsprijs verminderd
      met de ontvangen investeringssubsidies en bestemmingsgiften berekend wordt, rekening houdend met de geldende
      afschrijvingspercentages.

      2 De vergoeding die de instelling betaalt aan een organisatie die zich de ondersteuning van één of meer
      gesubsidieerde instellingen ten doel stelt, voor door die organisatie aan de instelling geleverde diensten, is
      indien het diensten betreft die in het algemeen door soortgelijke instellingen in eigen beheer worden verricht,
      niet hoger dan het bedrag dat gelijk is aan de kosten die de instelling zou hebben gehad bij het verrichten van de
      diensten in eigen beheer.

      3 De vergoeding die de instelling betaalt aan een organisatie die zich de ondersteuning van één of meer
      gesubsidieerde instellingen ten doel stelt, voor door die organisatie aan de instelling geleverde diensten,
      andere dan de in het tweede lid bedoelde diensten, is niet hoger dan het bedrag dat voor het doen verrichten van
      dergelijke diensten door andere organisaties gebruikelijk kan worden geacht.
    url: https://wetten.overheid.nl/BWBR0009696/2002-01-01#Artikel22
  - number: '23'
    text: |-
      De subsidieontvanger die aan derden goederen ter beschikking stelt of voor derden diensten verricht, brengt
      daarvoor een vergoeding in rekening die ten minste kostendekkend is, tenzij het derden betreft voor wie de
      gesubsidieerde activiteiten bestemd zijn. Onze Minister kan ook andere gevallen aanwijzen waarin de bepaling niet
      geldt.
    url: https://wetten.overheid.nl/BWBR0009696/2002-01-01#Artikel23
  - number: '24'
    text: |-
      1 De subsidieontvanger verstrekt aan de door Onze Minister aangewezen ambtenaren of andere personen op hun verzoek
      alle bescheiden en inlichtingen die noodzakelijk zijn voor een juiste vervulling van hun taak. De bescheiden
      worden op één adres getoond en de inlichtingen, op verzoek, schriftelijk verstrekt. Indien de instelling slechts
      kan voldoen aan deze verplichting door inbreuk te maken op het recht van enig persoon op bescherming van zijn
      persoonlijke levenssfeer, verstrekt de instelling de verlangde gegevens op zodanige wijze dat deze niet tot
      personen herleidbaar zijn.

      2 Ook anderszins wordt zoveel mogelijk medewerking verleend teneinde de door Onze Minister aangewezen ambtenaren of
      andere personen in staat te stellen hun taak op een juiste wijze te vervullen.

      3 De subsidieontvanger werkt mee aan door of namens Onze Minister ingestelde onderzoekingen die erop zijn gericht
      Onze Minister inlichtingen te verschaffen ten behoeve van de ontwikkeling van het beleid.
    url: https://wetten.overheid.nl/BWBR0009696/2002-01-01#Artikel24
  - number: '25'
    text: |-
      Indien bij Onze Minister het vermoeden is gerezen dat [artikel 22][ref1] niet is nageleefd, spant de
      subsidieontvanger zich desgevraagd in de jaarrekening van de desbetreffende organisatie over te leggen.


      [ref1]: https://wetten.overheid.nl/BWBR0009696#Artikel22
    url: https://wetten.overheid.nl/BWBR0009696/2002-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0009696
        artikel: '22'
        hoofdstuk: IV
  - number: '26'
    text: |-
      1 Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent aan de verlening van bepaalde categorieën
      subsidies te verbinden verplichtingen.

      2 Onze Minister kan tevens bij de subsidieverlening verplichtingen opleggen die strekken tot verwezenlijking van
      het doel van de subsidie.
    url: https://wetten.overheid.nl/BWBR0009696/2002-01-01#Artikel26
  - number: '27'
    text: |-
      1 Binnen vier maanden na afloop van de periode of het project waarvoor subsidie is verleend, dient de
      subsidieontvanger een aanvraag in voor de subsidievaststelling.

      2 De aanvraag voor de subsidievaststelling gaat vergezeld van:

      a. het verslag, bedoeld in [artikel 18][ref1];

      b. een subsidiedeclaratie;

      c. de jaarrekening en

      d. indien de aanvraag is ondertekend door een of meer andere personen dan de personen die op grond van de statuten
      bevoegd zijn de instelling te vertegenwoordigen: een afschrift van de volmacht op grond waarvan de aanvraag door
      die andere persoon of personen is ondertekend.

      3 Een subsidiedeclaratie kan achterwege blijven indien de daarmee te verstrekken informatie reeds in de in te
      zenden jaarrekening is opgenomen.

      4 De jaarrekening behoeft, tenzij bij de subsidieverlening anders is bepaald, niet te worden ingezonden, indien het
      gaat om:

      a. een projectsubsidie, of

      b. een subsidie aan een rechtspersoon krachtens publiekrecht ingesteld.

      5 Bij ministeriële regeling kan vrijstelling worden verleend van de in het eerste lid genoemde aanvraagtermijn

      6 Onze Minister kan ontheffing verlenen van de in het eerste lid genoemde aanvraagtermijn.


      [ref1]: https://wetten.overheid.nl/BWBR0009696#Artikel18
    url: https://wetten.overheid.nl/BWBR0009696/2002-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0009696
        artikel: '18'
        hoofdstuk: IV
  - number: '28'
    text: |-
      De subsidiedeclaratie geeft een zodanig inzicht dat een verantwoord oordeel kan worden gevormd omtrent de
      aanwending en de besteding van de subsidie door de instelling en geeft de nodige informatie om de subsidie
      vast te stellen. De subsidiedeclaratie sluit aan op de indeling van de bij de subsidieaanvraag ingediende
      begroting. Belangrijke verschillen tussen declaratie en begroting worden toegelicht. In de subsidiedeclaratie van
      instellingssubsidies wordt de aansluiting tussen de subsidiedeclaratie en de jaarrekening toegelicht.
    url: https://wetten.overheid.nl/BWBR0009696/2002-01-01#Artikel28
  - number: '29'
    text: |-
      1 De [afdelingen 2 tot en met 8 van Titel 9 van Boek 2 van het Burgerlijk Wetboek](onbekend) zijn van
      overeenkomstige toepassing op de jaarrekening, met dien verstande dat de winst- en verliesrekening vervangen wordt
      door een exploitatierekening; op deze rekening zijn de bepalingen omtrent de winst- en verliesrekening zoveel
      mogelijk van overeenkomstige toepassing. Bepalingen omtrent winst en verlies zijn van overeenkomstige toepassing op
      het exploitatiesaldo.

      2 De grondslag voor de waardering van activa en passiva is de verkrijgings- of vervaardigingsprijs verminderd met
      de ontvangen investeringssubsidies en bestemmingsgiften.

      3 Onze Minister kan bepalen dat bepalingen van de in het eerste lid bedoelde Titel of onderdelen daarvan niet van
      toepassing zijn op bepaalde instellingen of categorieën instellingen.
    url: https://wetten.overheid.nl/BWBR0009696/2002-01-01#Artikel29
  - number: '30'
    text: |-
      1 De jaarrekening en de subsidiedeclaratie zijn ieder afzonderlijk voorzien van een verklaring van een accountant
      als bedoeld in [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1].

      2 De jaarrekening of de subsidiedeclaratie gaat vergezeld van een rapportage omtrent de naleving van de
      subsidiebepalingen door de subsidieontvanger, opgesteld door de accountant overeenkomstig een door Onze Minister
      vast te stellen protocol.

      3 De subsidieontvanger draagt er zorg voor dat de accountant meewerkt aan door of namens de departementale
      accountantsdienst in te stellen onderzoeken naar de door de accountant verrichte (controle)werkzaamheden. De
      daaraan verbonden kosten worden geacht te zijn begrepen in de subsidie.

      4 In geval van een instellingssubsidie zijn het eerste en tweede lid niet van toepassing indien het totaal van de
      door Onze Minister verleende subsidies met betrekking tot dat jaar minder dan €  125 000 bedraagt.

      5 In geval van een projectsubsidie zijn, tenzij bij de subsidieverlening anders is bepaald, het eerste en tweede
      lid niet van toepassing indien de subsidie minder dan € 125 000 bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0009696/2002-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '31'
    text: |-
      Binnen zes maanden na ontvangst van de aanvraag, bedoeld in [artikel 27][ref1], geeft Onze Minister een beschikking
      tot vaststelling van de subsidie.


      [ref1]: https://wetten.overheid.nl/BWBR0009696#Artikel27
    url: https://wetten.overheid.nl/BWBR0009696/2002-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0009696
        artikel: '27'
        hoofdstuk: V
        paragraaf: '1'
  - number: '32'
    text: |-
      Uitkeringen aan provincies en gemeenten ten behoeve van het door het desbetreffende openbaar lichaam te voeren
      beleid op het terrein van de volksgezondheid worden door Onze Minister toegekend met inachtneming van de
      [artikelen 33 tot en met 42][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009696#Artikel33
    url: https://wetten.overheid.nl/BWBR0009696/2002-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0009696
        artikel: '33'
        hoofdstuk: VI
        paragraaf: '2'
  - number: '33'
    text: |-
      1 De aanvraag voor een uitkering, anders dan ten behoeve van een project, wordt uiterlijk dertien weken vóór de
      aanvang van het desbetreffende kalenderjaar ingediend.

      2 Bij de aanvraag wordt aangegeven welke activiteiten met behulp van de uitkering zullen worden gesubsidieerd,
      welke doelen daarmee worden nagestreefd en welke kosten met de activiteiten zullen zijn gemoeid.

      3 Onze Minister kan ontheffing verlenen van de in de eerste lid genoemde aanvraagtermijn.
    url: https://wetten.overheid.nl/BWBR0009696/2002-01-01#Artikel33
  - number: '34'
    text: |-
      1 Onze Minister kan voor projecten uitkeringen verlenen die zich uitstrekken over meer dan één kalenderjaar.

      2 Een aanvraag van een uitkering ten behoeve van een project wordt uiterlijk dertien weken vóór de aanvang van de
      periode waarop deze betrekking heeft, ingediend. [Artikel 33, tweede en derde lid][ref1], is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009696#Artikel33
    url: https://wetten.overheid.nl/BWBR0009696/2002-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0009696
        artikel: '33'
        hoofdstuk: VI
        paragraaf: '2'
  - number: '35'
    text: |-
      1 Onze Minister geeft een beschikking op de aanvraag binnen dertien weken na ontvangst van de aanvraag. Met het oog
      op de onderlinge afweging van aanvragen kan bij ministeriële regeling worden bepaald dat op aanvragen wordt beslist
      op of na een of meer bepaalde data in een kalenderjaar.

      2 Indien de beslissing een verlening inhoudt, wordt het bedrag van de uitkering vermeld dan wel de wijze waarop dit
      wordt bepaald en welk bedrag ten hoogste zal worden verleend.

      3 De [artikelen 4:48][ref1] en [4:50 van de Algemene wet bestuursrecht][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel448
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel450
    url: https://wetten.overheid.nl/BWBR0009696/2002-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:48
      - id: ref2
        bwb_id: BWBR0005537
        artikel: 4:50
  - number: '36'
    text: |-
      Nadat een aanvraag voor een uitkering is ingediend, kan Onze Minister voorschotten verlenen.
      [Artikel 11, tweede en derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009696#Artikel11
    url: https://wetten.overheid.nl/BWBR0009696/2002-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0009696
        artikel: '11'
        hoofdstuk: III
  - number: '37'
    text: |-
      1 Bij de verlening van een uitkering kan Onze Minister bepalen dat het uitkeringsbedrag door hem wordt bijgesteld,
      rekening houdend met de ontwikkeling van het prijspeil of de ontwikkeling in de kosten van de arbeidsvoorwaarden.

      2 Met het oog op de toepassing van het eerste lid kan Onze Minister bij de verlening van de uitkering tevens
      bepalen welk deel van het uitkeringsbedrag in aanmerking zal worden genomen voor een bijstelling in verband met de
      ontwikkeling van het prijspeil, onderscheidenlijk van de kosten van de arbeidsvoorwaarden.

      3 Indien een uitkering met toepassing van het eerste lid wordt bijgesteld, kan de bevoorschotting overeenkomstig
      worden gewijzigd.
    url: https://wetten.overheid.nl/BWBR0009696/2002-01-01#Artikel37
  - number: '38'
    text: |-
      De provincie of gemeente doet zo spoedig mogelijk schriftelijk mededeling aan Onze Minister van omstandigheden die
      van belang kunnen zijn voor een beslissing tot wijziging, intrekking of vaststelling van een uitkering. Daarbij
      worden de relevante stukken overgelegd.
    url: https://wetten.overheid.nl/BWBR0009696/2002-01-01#Artikel38
  - number: '39'
    text: |-
      Binnen zes maanden na afloop van het jaar waarin een uitkering is verstrekt, zendt de provincie of gemeente een
      schriftelijk verslag aan Onze Minister over de activiteiten waarvoor een uitkering is verstrekt.
    url: https://wetten.overheid.nl/BWBR0009696/2002-01-01#Artikel39
  - number: '40'
    text: |-
      1 De provincie of gemeente verstrekt aan de door Onze Minister aangewezen ambtenaren of andere personen op
      diens verzoek alle bescheiden en inlichtingen die noodzakelijk zijn voor een juiste vervulling van hun taak. De
      bescheiden worden op één adres getoond en de inlichtingen, op verzoek, schriftelijk verstrekt. Indien de provincie
      of gemeente slechts kan voldoen aan deze verplichting door inbreuk te maken op het recht van enig persoon op
      bescherming van zijn persoonlijke levenssfeer, verstrekt de provincie of gemeente de verlangde gegevens op zodanige
      wijze dat deze niet tot personen herleidbaar zijn.

      2 Ook anderszins wordt zoveel mogelijk medewerking verleend teneinde de door Onze Minister aangewezen ambtenaren of
      andere personen in staat te stellen hun taak op een juiste wijze te vervullen.

      3 De provincie of gemeente werkt mee aan door of namens Onze Minister ingestelde onderzoekingen die erop zijn
      gericht Onze Minister inlichtingen te verschaffen ten behoeve van de ontwikkeling van het beleid.
    url: https://wetten.overheid.nl/BWBR0009696/2002-01-01#Artikel40
  - number: 40a
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent de aan de verlening van bepaalde categorieën
      van uitkeringen te verbinden verplichtingen.
    url: https://wetten.overheid.nl/BWBR0009696/2002-01-01#Artikel40a
  - number: '41'
    text: |-
      1 Binnen tien maanden na afloop van het kalenderjaar waarvoor een uitkering is verstrekt of in geval van een
      meerjarige uitkering binnen tien maanden na afloop van het laatste kalenderjaar waarvoor de uitkering is verstrekt,
      legt de provincie of gemeente een verantwoording over, waaruit blijkt of de activiteiten waarvoor de uitkering was
      bestemd, zijn uitgevoerd.

      2 Indien de uitkering bestaat uit een vergoeding van werkelijk gemaakte kosten blijkt uit de verantwoording tevens
      in hoeverre de verleende uitkering is besteed ten behoeve van het doel waarvoor zij was bestemd.

      3 Indien de uitkering meer bedraagt dan € 125 000, is de verantwoording voorzien van een verklaring van een
      accountant als bedoeld in [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1].

      4 Indien de in het eerste en tweede lid bedoelde gegevens voldoende blijken uit de vastgestelde jaarrekening
      van de provincie of gemeente, kan worden volstaan met de toezending van die jaarrekening en de daarbij behorende
      verslagen.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0009696/2002-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '42'
    text: |-
      Binnen zes maanden na ontvangst van een verantwoording als bedoeld in [artikel 41, eerste of tweede lid][ref1],
      of de jaarrekening, bedoeld in [artikel 41, vierde lid][ref2], geeft Onze Minister een beschikking tot
      vaststelling van de uitkering. De [artikelen 4:46][ref3], [4:49][ref4], [4:52][ref5], [4:56][ref6] en
      [4:57 van de Algemene wet bestuursrecht][ref7] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009696#Artikel41
      [ref2]: https://wetten.overheid.nl/BWBR0009696#Artikel41
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel446
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel449
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel452
      [ref6]: https://wetten.overheid.nl/BWBR0005537#Artikel456
      [ref7]: https://wetten.overheid.nl/BWBR0005537#Artikel457
    url: https://wetten.overheid.nl/BWBR0009696/2002-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0009696
        artikel: '41'
        hoofdstuk: VI
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0009696
        artikel: '41'
        hoofdstuk: VI
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: 4:46
      - id: ref4
        bwb_id: BWBR0005537
        artikel: 4:49
      - id: ref5
        bwb_id: BWBR0005537
        artikel: 4:52
      - id: ref6
        bwb_id: BWBR0005537
        artikel: 4:56
      - id: ref7
        bwb_id: BWBR0005537
        artikel: 4:57
  - number: '43'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld ten aanzien van de inrichting en de wijze van
      indiening van aanvragen, het activiteitenplan, het projectplan, de begroting, de liquiditeitsprognose, de
      administratie, de jaarrekening, de subsidiedeclaratie, verslagen, de verantwoording en de verklaring van de
      accountant.
    url: https://wetten.overheid.nl/BWBR0009696/2002-01-01#Artikel43
  - number: '44'
    text: |-
      Onze Minister kan, gelet op het belang dat dit besluit beoogt te beschermen, artikelen buiten toepassing laten of
      daarvan afwijken voorzover strikte toepassing leidt tot een onbillijkheid van overwegende aard.
    url: https://wetten.overheid.nl/BWBR0009696/2002-01-01#Artikel44
  - number: '45'
    text: |-
      Dit besluit is niet van toepassing op subsidies en uitkeringen die voor de inwerkingtreding van dit besluit zijn
      verleend of vastgesteld.
    url: https://wetten.overheid.nl/BWBR0009696/2002-01-01#Artikel45
  - number: '46'
    text: Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0009696/2002-01-01#Artikel46
  - number: '47'
    text: 'Dit besluit wordt aangehaald als: Besluit volksgezondheidssubsidies.'
    url: https://wetten.overheid.nl/BWBR0009696/2002-01-01#Artikel47
