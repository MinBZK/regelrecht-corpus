  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Volksgezondheid, Welzijn en Sport van 24 maart 1998, DWJZ-U-98534;

    Gelet op artikel 3 van de Kaderwet volksgezondheidssubsidies;

    De Raad van State gehoord (advies van 15 mei 1998, No.W13.98. 0117);

    Gezien het nader rapport van Onze Minister van Volksgezondheid, Welzijn en Sport van 3 juni 1998, DWJZ-U-98749;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0009696/2002-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. de wet: de [Kaderwet volksgezondheidssubsidies][ref1];

      b. instelling: een privaatrechtelijke rechtspersoon met volledige rechtsbevoegdheid, dan wel een rechtspersoon
      krachtens publiekrecht ingesteld;

      c. project: een activiteit op het terrein van de volksgezondheid met een incidenteel karakter;

      d. instellingssubsidie: een subsidie aan een instelling in de kosten van haar structurele activiteiten of een
      gedeelte daarvan;

      e. projectsubsidie: een subsidie in de kosten van een project;

      f. uitkering: een specifieke uitkering als bedoeld in [artikel 32][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009455
      [ref2]: https://wetten.overheid.nl/BWBR0009696#Artikel32
    url: https://wetten.overheid.nl/BWBR0009696/2002-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009455
      - id: ref2
