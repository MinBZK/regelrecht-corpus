---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_aanvang_tenuitvoerlegging_straffen_en_maatregelen
regulatory_layer: AMVB
publication_date: '2019-12-24'
valid_from: '2005-10-01'
bwb_id: BWBR0018691
url: https://wetten.overheid.nl/BWBR0018691/2005-10-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Justitie van 16 juni 2005, nr. 5357232/05/6;

    Gelet op artikel 558a, derde lid, van het Wetboek van Strafvordering;

    De Raad van State gehoord (advies van 7 juli 2005, nr. W03.05.0231/I);

    Gezien het nader rapport van Onze Minister van Justitie van 18 augustus 2005, nr. 5365118/05/6;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0018691/2005-10-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      Ten behoeve van de beoordeling of een gratieverzoek opschortende werking heeft als bedoeld in
      [artikel 558a, derde lid, van het Wetboek van Strafvordering][ref1], wordt als aanvangsdatum van de
      tenuitvoerlegging van een straf of maatregel aangemerkt de handeling van de bevoegde instantie zoals deze in
      de [artikelen 2 tot en met 5][ref2] nader wordt aangeduid, gericht op het ten uitvoer leggen van de straf of
      maatregel.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel558a
      [ref2]: https://wetten.overheid.nl/BWBR0018691#Artikel2
    url: https://wetten.overheid.nl/BWBR0018691/2005-10-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 558a
      - id: ref2
        bwb_id: BWBR0018691
        artikel: '2'
  - number: '1.2'
    text: |-
      Onder vrijheidsstraf wordt verstaan: gevangenisstraf, hechtenis, militaire detentie en jeugddetentie. Onder
      vrijheidsstraf wordt mede verstaan de tenuitvoerlegging van een voorwaardelijke vrijheidsstraf of van het
      voorwaardelijke deel van een vrijheidsstraf.
    url: https://wetten.overheid.nl/BWBR0018691/2005-10-01#Artikel1
  - number: '2'
    text: 'Met betrekking tot de tenuitvoerlegging van hoofdstraffen wordt onderscheiden:'
    url: https://wetten.overheid.nl/BWBR0018691/2005-10-01#Artikel2
  - number: 2.a
    text: 'de vrijheidsstraf, waarvan de tenuitvoerlegging aanvangt:'
    url: https://wetten.overheid.nl/BWBR0018691/2005-10-01#Artikel2
  - number: 2.a.1°
    text: |-
      op de datum van de dagtekening van de aan de veroordeelde gerichte mededeling met de datum waarop hij zich moet
      melden bij de penitentiaire inrichting, of
    url: https://wetten.overheid.nl/BWBR0018691/2005-10-01#Artikel2
  - number: 2.a.2°
    text: |-
      op de eenendertigste dag na verzending van de aan de onder 1° bedoelde mededeling voorafgaande vooraankondiging,
      indien de veroordeelde daarop niet reageert, of
    url: https://wetten.overheid.nl/BWBR0018691/2005-10-01#Artikel2
  - number: 2.a.3°
    text: |-
      op de datum van het uitvaardigen van een arrestatiebevel jegens de veroordeelde ten aanzien van wie het openbaar
      ministerie de zelfmeldprocedure niet toepast, of
    url: https://wetten.overheid.nl/BWBR0018691/2005-10-01#Artikel2
  - number: 2.a.4°
    text: op de datum van de registratie in het opsporingsregister van de veroordeelde zonder vaste woon- of verblijfplaats.
    url: https://wetten.overheid.nl/BWBR0018691/2005-10-01#Artikel2
  - number: 2.b
    text: |-
      de taakstraf, welke aanvangt op de datum van de dagtekening van de aan de veroordeelde gerichte oproep voor het
      eerste gesprek bij de reclassering;
    url: https://wetten.overheid.nl/BWBR0018691/2005-10-01#Artikel2
  - number: 2.c
    text: |-
      de geldboete, welke aanvangt op de datum van de dagtekening van de optisch leesbare acceptgiro met de mededeling
      van de dag of dagen waarop de betaling uiterlijk moet geschieden.
    url: https://wetten.overheid.nl/BWBR0018691/2005-10-01#Artikel2
  - number: '3'
    text: 'Met betrekking tot de tenuitvoerlegging van bijkomende straffen wordt onderscheiden:'
    url: https://wetten.overheid.nl/BWBR0018691/2005-10-01#Artikel3
  - number: 3.a
    text: 'de ontzetting van bepaalde rechten, waarvan de tenuitvoerlegging aanvangt:'
    url: https://wetten.overheid.nl/BWBR0018691/2005-10-01#Artikel3
  - number: 3.a.1°
    text: |-
      indien het de ontzegging van de rijbevoegdheid betreft, op de datum waarop aan de veroordeelde in persoon, volgens
      de [artikelen 587][ref1] en [588 van het Wetboek van Strafvordering][ref2], een schrijven is uitgereikt of


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel587
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel588
    url: https://wetten.overheid.nl/BWBR0018691/2005-10-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '587'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '588'
  - number: 3.a.2°
    text: |-
      indien het de overige ontzetting van bepaalde rechten betreft, op de datum van het onherroepelijk worden van het
      vonnis of arrest.
    url: https://wetten.overheid.nl/BWBR0018691/2005-10-01#Artikel3
  - number: 3.b
    text: |-
      de verbeurdverklaring, waarvan de tenuitvoerlegging aanvangt op de datum van het onherroepelijk worden van het
      vonnis of arrest;
    url: https://wetten.overheid.nl/BWBR0018691/2005-10-01#Artikel3
  - number: 3.c
    text: |-
      de openbaarmaking van de rechterlijke uitspraak, waarvan de tenuitvoerlegging aanvangt op de datum van het
      onherroepelijk worden van het vonnis of arrest.
    url: https://wetten.overheid.nl/BWBR0018691/2005-10-01#Artikel3
  - number: '4'
    text: |-
      Met betrekking tot straffen, krachtens een rechterlijke beslissing in een vreemde staat opgelegd en in Nederland
      ten uitvoer te leggen, zoals bedoeld in [artikel 558, tweede lid, van het Wetboek van Strafvordering][ref1], wordt
      onderscheiden:


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel558
    url: https://wetten.overheid.nl/BWBR0018691/2005-10-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '558'
  - number: 4.a
    text: |-
      de tenuitvoerlegging van [artikel 43 van de Wet overdracht tenuitvoerlegging strafvonnissen][ref1], welke aanvangt
      op het moment van aankomst van de veroordeelde op Nederlands grondgebied;


      [ref1]: https://wetten.overheid.nl/BWBR0004028#Artikel43
    url: https://wetten.overheid.nl/BWBR0018691/2005-10-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0004028
        artikel: '43'
  - number: 4.b
    text: |-
      de tenuitvoerlegging naar aanleiding van een ongegrondverklaring van een bezwaarschrift ingediend krachtens
      [artikel 35 van de Wet overdracht tenuitvoerlegging strafvonnissen][ref1], welke aanvangt op de datum van
      dagtekening van de optisch leesbare acceptgiro met de mededeling van de dag of dagen waarop de betaling uiterlijk
      moet geschieden;


      [ref1]: https://wetten.overheid.nl/BWBR0004028#Artikel35
    url: https://wetten.overheid.nl/BWBR0018691/2005-10-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0004028
        artikel: '35'
  - number: 4.c
    text: |-
      de tenuitvoerlegging van een gevangenisstraf die door het Internationaal Strafhof is opgelegd wegens een
      misdrijf gericht tegen de rechtspleging van het Strafhof en waarvan de tenuitvoerlegging in Nederland geschiedt
      overeenkomstig [artikel 67][ref1] of [68 van de Uitvoeringswet Internationaal Strafhof][ref2], welke aanvangt op
      het moment van overdracht van de veroordeelde aan de Nederlandse autoriteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0013796#Artikel67
      [ref2]: https://wetten.overheid.nl/BWBR0013796#Artikel68
    url: https://wetten.overheid.nl/BWBR0018691/2005-10-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0013796
        artikel: '67'
      - id: ref2
        bwb_id: BWBR0013796
        artikel: '68'
  - number: '5'
    text: 'Met betrekking tot de tenuitvoerlegging van voor gratie vatbare maatregelen wordt onderscheiden:'
    url: https://wetten.overheid.nl/BWBR0018691/2005-10-01#Artikel5
  - number: 5.a
    text: terbeschikkingstelling met verpleging van overheidswege, waarvan de tenuitvoerlegging aanvangt
    url: https://wetten.overheid.nl/BWBR0018691/2005-10-01#Artikel5
  - number: 5.a.1°
    text: |-
      op de datum van de dagtekening van de last tot tenuitvoerlegging van het veroordelend vonnis of arrest, bedoeld in
      [artikel 564 van het Wetboek van Strafvordering][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel564
    url: https://wetten.overheid.nl/BWBR0018691/2005-10-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '564'
  - number: 5.a.2°
    text: |-
      op de datum van afgifte van het bevel tot gevangenneming, bedoeld in
      [artikel 65 van het Wetboek van Strafvordering][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel65
    url: https://wetten.overheid.nl/BWBR0018691/2005-10-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '65'
  - number: 5.b
    text: |-
      plaatsing in een inrichting voor stelselmatige daders, waarvan de tenuitvoerlegging aanvangt op de datum van het
      uitvaardigen van een last tot tenuitvoerlegging van een bevel tot vrijheidsbeneming of veroordelend vonnis of
      arrest, bedoeld in [artikel 564 van het Wetboek van Strafvordering][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel564
    url: https://wetten.overheid.nl/BWBR0018691/2005-10-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '564'
  - number: 5.c
    text: |-
      onttrekking aan het verkeer, waarvan de tenuitvoerlegging aanvangt op de datum van het onherroepelijk worden van
      het vonnis of arrest;
    url: https://wetten.overheid.nl/BWBR0018691/2005-10-01#Artikel5
  - number: 5.d
    text: |-
      ontneming van het wederrechtelijk verkregen voordeel, waarvan de tenuitvoerlegging aanvangt op de datum van de
      dagtekening van de optisch leesbare acceptgiro met de mededeling van de dag of dagen waarop de betaling uiterlijk
      moet geschieden.
    url: https://wetten.overheid.nl/BWBR0018691/2005-10-01#Artikel5
  - number: '6'
    text: Dit besluit treedt in werking op 1 oktober 2005.
    url: https://wetten.overheid.nl/BWBR0018691/2005-10-01#Artikel6
  - number: '7'
    text: 'Dit besluit wordt aangehaald als: Besluit aanvang tenuitvoerlegging straffen en maatregelen.'
    url: https://wetten.overheid.nl/BWBR0018691/2005-10-01#Artikel7
