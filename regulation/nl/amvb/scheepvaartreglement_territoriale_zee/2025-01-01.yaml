---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: scheepvaartreglement_territoriale_zee
regulatory_layer: AMVB
publication_date: '1996-03-28'
valid_from: '2025-01-01'
bwb_id: BWBR0007914
url: https://wetten.overheid.nl/BWBR0007914/2025-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Verkeer en Waterstaat van 12 juli 1995, nr. S/J 13.399/95, Directoraat-
    Generaal Scheepvaart en Maritieme Zaken;

    Gelet op de artikelen 4, eerste, en derde lid, 12, 18, 31, tiende lid, en 36 van de Scheepvaartverkeerswet;

    De Raad van State gehoord (advies van 11 september 1995, nr. W09.95.0353);

    Gezien het nader rapport van Onze Minister van Verkeer en Waterstaat van 19 februari 1996, nr. S/J-96000464,
    Directoraat-Generaal Scheepvaart en Maritieme Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0007914/2025-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      Onverminderd de Internationale Bepalingen ter voorkoming van aanvaringen op zee, 1972
      (*Trb.* 1974, 51), zoals gewijzigd, is dit besluit van toepassing in het gedeelte
      van de territoriale zee dat zeewaarts is gelegen van de lijn, zoals beschreven in
      __REF000___________________________________________________________________________________________________________
      _____________________________________________________________________, behoudens dat gedeelte van de territoriale
      zee dat gemeentelijk is ingedeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0004644#Artikel4
    url: https://wetten.overheid.nl/BWBR0007914/2025-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004644
        artikel: '4'
  - number: '1.2'
    text: |-
      Het eerste lid is, voor wat de uitzondering van de toepasselijkheid in het gemeentelijk ingedeelde deel van de
      territoriale zee betreft, niet van toepassing ten aanzien van:
    url: https://wetten.overheid.nl/BWBR0007914/2025-01-01#Artikel1
  - number: 1.2.a
    text: |-
      de verkeerstekens die zijn opgenomen in de bij dit besluit behorende [bijlage 2][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007914
    url: https://wetten.overheid.nl/BWBR0007914/2025-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007914
  - number: 1.2.b
    text: een aanloopgebied.
    url: https://wetten.overheid.nl/BWBR0007914/2025-01-01#Artikel1
  - number: '2'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0007914/2025-01-01#Artikel2
  - number: 2.a
    text: 'bevoegde autoriteit: de als zodanig door Onze Minister voor een bepaald gebied aangewezen persoon;'
    url: https://wetten.overheid.nl/BWBR0007914/2025-01-01#Artikel2
  - number: 2.b
    text: |-
      bijzonder transport: een schip of ander drijvend voorwerp dat in zodanige staat verkeert, of een zodanig bijzonder
      karakter heeft, dat ernstige kans bestaat dat het bij de vaart de veiligheid van de scheepvaart in gevaar brengt of
      schade aan de werken veroorzaakt, dan wel zinkt of lading verliest;
    url: https://wetten.overheid.nl/BWBR0007914/2025-01-01#Artikel2
  - number: 2.c
    text: |-
      klein schip: een schip waarvan de lengte minder dan 20 m bedraagt, waartoe als de lengte wordt aangemerkt de
      afstand van de voorkant van het voorste tot de achterkant van het achterste deel van de romp, zonder de boegspriet,
      de papegaaistok en het trimvlak, zulks met uitzondering van: - een schip dat meer dan 12 passagiers mag vervoeren,
        - een veerpont,
        - een vissersschip,
        - een sleepboot;
    url: https://wetten.overheid.nl/BWBR0007914/2025-01-01#Artikel2
  - number: 2.d
    text: |-
      aanloopgebied: een gebied als omschreven in de bij dit besluit behorende [bijlage 1][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007914
    url: https://wetten.overheid.nl/BWBR0007914/2025-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0007914
  - number: 2.e
    text: |-
      territoriale zee, behoudens de aanloopgebieden: de Nederlandse territoriale zee, behoudens de in de bij dit besluit
      behorende [bijlage 1][ref1] omschreven aanloopgebieden;


      [ref1]: https://wetten.overheid.nl/BWBR0007914
    url: https://wetten.overheid.nl/BWBR0007914/2025-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0007914
  - number: 2.f
    text: 'exploitant: de eigenaar, rompbevrachter of ieder ander die de zeggenschap heeft over het gebruik van een schip;'
    url: https://wetten.overheid.nl/BWBR0007914/2025-01-01#Artikel2
  - number: 2.g
    text: |-
      [richtlijn nr. 2002/59/EG](32002L0059): [richtlijn nr. 2002/59/EG](32002L0059) van het Europees Parlement en
      de Raad van de Europese Unie van 27 juni 2002 betreffende de invoering van een communautair monitoring- en
      informatiesysteem voor de zeescheepvaart en tot intrekking van [Richtlijn 93/75/EEG](31993L0075) van de Raad (PbEG
      L 208);
    url: https://wetten.overheid.nl/BWBR0007914/2025-01-01#Artikel2
  - number: 2.h
    text: |-
      een zeeschip dat bepaalde gevaarlijke of schadelijke stoffen vervoert: elk vrachtschip, iedere olie-, chemicaliën-,
      of gastanker, of een passagiersschip, waarmee wordt vervoerd een gevaarlijke stof als bedoeld in artikel 3,
      onderdeel g, of een schadelijke stof als bedoeld in artikel 3, onderdeel h, van [richtlijn nr. 2002/59/EG]
      (32002L0059);
    url: https://wetten.overheid.nl/BWBR0007914/2025-01-01#Artikel2
  - number: 2.i
    text: |-
      routeringssysteem: een systeem bestaande uit een of meer routes of routeringsmaatregelen, gericht op het
      verminderen van gevaar voor scheepsongevallen, met inbegrip van verkeersscheidingsstelsels, vaarwegen voor
      tweerichtingsverkeer, aanbevolen koerslijnen, gebieden die dienen te worden gemeden, zones voor kustverkeer,
      rotondes, voorzorgsgebieden en diepwaterroutes.
    url: https://wetten.overheid.nl/BWBR0007914/2025-01-01#Artikel2
  - number: 2a
    text: |-
      Een wijziging van [richtlijn nr. 2002/59/EG](32002L0059) gaat voor de toepassing van dit reglement gelden met
      ingang van de dag waarop aan de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven, tenzij bij ministerieel
      besluit, dat in de Staatscourant wordt bekendgemaakt, een ander tijdstip wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0007914/2025-01-01#Artikel2a
  - number: '3'
    text: |-
      De kapitein is verantwoordelijk voor de naleving van de bepalingen van dit besluit, tenzij uit de desbetreffende
      bepaling anderszins blijkt.
    url: https://wetten.overheid.nl/BWBR0007914/2025-01-01#Artikel3
  - number: '4'
    text: |-
      Ook bij het ontbreken van uitdrukkelijke voorschriften in dit besluit, worden alle voorzorgsmaatregelen genomen die
      volgens goede zeemanschap zijn geboden, teneinde met name te voorkomen dat door of vanaf het schip:
    url: https://wetten.overheid.nl/BWBR0007914/2025-01-01#Artikel4
  - number: 4.a
    text: het leven van personen in gevaar wordt gebracht;
    url: https://wetten.overheid.nl/BWBR0007914/2025-01-01#Artikel4
  - number: 4.b
    text: |-
      schade wordt veroorzaakt aan andere schepen of aan drijvende voorwerpen, dan wel waterstaatswerken,
      kustverdedigingen, of andere werken en inrichtingen van welke aard ook; of
    url: https://wetten.overheid.nl/BWBR0007914/2025-01-01#Artikel4
  - number: 4.c
    text: de veiligheid of het vlotte verloop van de scheepvaart in gevaar wordt gebracht.
    url: https://wetten.overheid.nl/BWBR0007914/2025-01-01#Artikel4
  - number: '5.1'
    text: |-
      De kapitein van een zeeschip dat bepaalde gevaarlijke of schadelijke stoffen vervoert of een zeeschip met een
      bruto-tonnage als bedoeld in de [Meetbrievenwet 1981][ref1] van 300 of meer, meldt zich voordat hij de Nederlandse
      territoriale zee binnenvaart op het bij ministeriële regeling aangewezen marifoonkanaal aan de bevoegde autoriteit.


      [ref1]: https://wetten.overheid.nl/BWBR0003378
    url: https://wetten.overheid.nl/BWBR0007914/2025-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003378
  - number: '5.2'
    text: |-
      De kapitein van een schip, bedoeld in het eerste lid, en van ieder ander schip dat is uitgerust met een marifoon,
      luistert in een aanloopgebied uit en neemt, indien nodig, op het eerste lid bedoelde marifoonkanaal aan ter plaatse
      gevoerde communicatie deel.
    url: https://wetten.overheid.nl/BWBR0007914/2025-01-01#Artikel5
  - number: 5a.1
    text: |-
      Bij ministeriële regeling kunnen voor in die regeling vermelde categorieën schepen in de Nederlandse territoriale
      zee, overeenkomstig richtlijnen en criteria van de Internationale Maritieme Organisatie, routeringssystemen en
      meldingssystemen worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0007914/2025-01-01#Artikel5a
  - number: 5a.2
    text: |-
      Degene die een schip voert maakt gebruik van de op grond van het eerste lid vastgestelde routeringssystemen en
      voldoet daarbij aan de voorschriften van de op grond van dat lid vastgestelde meldingssystemen.
    url: https://wetten.overheid.nl/BWBR0007914/2025-01-01#Artikel5a
  - number: '6'
    text: 'Van een schip wordt zo spoedig mogelijk aan de bevoegde autoriteit medegedeeld dat het:'
    url: https://wetten.overheid.nl/BWBR0007914/2025-01-01#Artikel6
  - number: 6.a
    text: aan de grond is geraakt of gezonken;
    url: https://wetten.overheid.nl/BWBR0007914/2025-01-01#Artikel6
  - number: 6.b
    text: |-
      in aanraking is gekomen met een ander schip en daarbij schade van betekenis is ontstaan of zich persoonlijke
      ongevallen hebben voorgedaan;
    url: https://wetten.overheid.nl/BWBR0007914/2025-01-01#Artikel6
  - number: 6.c
    text: een boei, baken of waterstaatswerk heeft aangevaren, verplaatst of beschadigd;
    url: https://wetten.overheid.nl/BWBR0007914/2025-01-01#Artikel6
  - number: 6.d
    text: in een toestand verkeert waardoor de manoeuvreerbaarheid of de veiligheid nadelig wordt beïnvloed; of
    url: https://wetten.overheid.nl/BWBR0007914/2025-01-01#Artikel6
  - number: 6.e
    text: voorwerpen of stoffen heeft verloren of dreigt te verliezen, die het scheepvaartverkeer in gevaar kunnen brengen.
    url: https://wetten.overheid.nl/BWBR0007914/2025-01-01#Artikel6
  - number: '7.1'
    text: |-
      Een bijzonder transport dan wel een schip door middel waarvan werkzaamheden worden verricht, vaart niet dan met
      toestemming van de bevoegde autoriteit.
    url: https://wetten.overheid.nl/BWBR0007914/2025-01-01#Artikel7
  - number: '7.2'
    text: |-
      In afwijking van het eerste lid vaart een bijzonder transport dan wel een schip door middel waarvan werkzaamheden
      worden verricht, dat zich zowel in een aanloopgebied als in de territoriale zee begeeft, niet dan met toestemming
      van de bevoegde autoriteit voor de territoriale zee, behoudens de aanloopgebieden.
    url: https://wetten.overheid.nl/BWBR0007914/2025-01-01#Artikel7
  - number: '7.3'
    text: |-
      Het verlenen of onthouden van toestemming als bedoeld in het tweede lid geschiedt in overeenstemming met de
      bevoegde autoriteit van het aanloopgebied waarin het bijzonder transport dan wel het schip door middel waarvan de
      werkzaamheden worden verricht vaart.
    url: https://wetten.overheid.nl/BWBR0007914/2025-01-01#Artikel7
  - number: '8'
    text: |-
      Een schip gaat in een aanloopgebied niet voor anker, dan na daartoe van de bevoegde autoriteit toestemming te
      hebben verkregen.
    url: https://wetten.overheid.nl/BWBR0007914/2025-01-01#Artikel8
  - number: '9'
    text: Een schip meert niet af aan een verkeersteken.
    url: https://wetten.overheid.nl/BWBR0007914/2025-01-01#Artikel9
  - number: '11'
    text: Verkeersaanwijzingen worden opgevolgd.
    url: https://wetten.overheid.nl/BWBR0007914/2025-01-01#Artikel11
  - number: '12.1'
    text: |-
      Een sportevenement, een festiviteit of een ander evenement, oefeningen en trainingen daaronder begrepen, alsmede
      een praktijktest met vergaand geautomatiseerd varen, waarbij een of meer schepen zijn betrokken of waarbij zich
      personen anders dan op een schip te water bevinden, vindt niet plaats, tenzij dat minimaal 6 weken van te voren bij
      de bevoegde autoriteit is gemeld.
    url: https://wetten.overheid.nl/BWBR0007914/2025-01-01#Artikel12
  - number: '12.2'
    text: |-
      Een activiteit als bedoeld in het eerste lid die de veiligheid van de scheepvaart in gevaar kan brengen, vindt niet
      plaats, tenzij daartoe toestemming van de bevoegde autoriteit is verkregen.
    url: https://wetten.overheid.nl/BWBR0007914/2025-01-01#Artikel12
  - number: '12.3'
    text: |-
      In afwijking van het tweede lid geschiedt een in het eerste lid bedoelde activiteit, die zowel in een aanloopgebied
      als in de territoriale zee plaatsvindt, niet dan met toestemming van de bevoegde autoriteit voor de territoriale
      zee, behoudens de aanloopgebieden.
    url: https://wetten.overheid.nl/BWBR0007914/2025-01-01#Artikel12
  - number: '12.4'
    text: |-
      Het verlenen of onthouden van toestemming als bedoeld in het derde lid geschiedt in overeenstemming met de bevoegde
      autoriteit van het aanloopgebied waarin de in het eerste lid bedoelde activiteit plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0007914/2025-01-01#Artikel12
  - number: '13'
    text: |-
      Een schip wordt niet geladen, gelost, of gebunkerd, tenzij daartoe door de bevoegde autoriteit toestemming is
      verleend.
    url: https://wetten.overheid.nl/BWBR0007914/2025-01-01#Artikel13
  - number: '15'
    text: |-
      De bij dit besluit behorende [bijlage 2][ref1] vermeldt de verkeerstekens ter markering van het vaarwater of van
      obstakels daarin.


      [ref1]: https://wetten.overheid.nl/BWBR0007914
    url: https://wetten.overheid.nl/BWBR0007914/2025-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0007914
  - number: '16.1'
    text: Een bekendmaking met dezelfde strekking als een verkeersteken inhoudende een gebod of verbod wordt opgevolgd.
    url: https://wetten.overheid.nl/BWBR0007914/2025-01-01#Artikel16
  - number: '16.2'
    text: |-
      Met een verkeersteken ter markering, of met een bekendmaking met dezelfde strekking als een verkeersteken
      inhoudende een aanbeveling of inlichting, wordt rekening gehouden.
    url: https://wetten.overheid.nl/BWBR0007914/2025-01-01#Artikel16
  - number: '17.1'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de deelname aan het scheepvaartverkeer
      door schepen in de Eurogeul, de Maasgeul en de IJgeul, die een in die regeling vastgestelde diepgang hebben.
    url: https://wetten.overheid.nl/BWBR0007914/2025-01-01#Artikel17
  - number: '17.2'
    text: 'De in het eerste lid bedoelde regels kunnen slechts voorschriften inhouden aangaande:'
    url: https://wetten.overheid.nl/BWBR0007914/2025-01-01#Artikel17
  - number: 17.2.a
    text: de toegelaten afmetingen van een schip;
    url: https://wetten.overheid.nl/BWBR0007914/2025-01-01#Artikel17
  - number: 17.2.b
    text: de bouw, de uitrusting, het motorvermogen en de manoeuvreerbaarheid van een schip;
    url: https://wetten.overheid.nl/BWBR0007914/2025-01-01#Artikel17
  - number: 17.2.c
    text: de grootste snelheid waarmede mag worden gevaren;
    url: https://wetten.overheid.nl/BWBR0007914/2025-01-01#Artikel17
  - number: 17.2.d
    text: de meteorologische omstandigheden waaronder mag worden gevaren; of
    url: https://wetten.overheid.nl/BWBR0007914/2025-01-01#Artikel17
  - number: 17.2.e
    text: |-
      de minimale waterdiepte onder de kiel en in verband daarmee het tijdstip waarop een schip zich op een bepaalde
      plaats mag bevinden.
    url: https://wetten.overheid.nl/BWBR0007914/2025-01-01#Artikel17
  - number: 17a.1
    text: |-
      Een schip neemt niet deel aan de scheepvaart indien het zodanig is beladen, dat het inzinkt tot over het vlak door
      de onderkant van de inzinkingsmerken, dan wel indien het zodanig is beladen, dat het een geringer vrijboord heeft
      dan blijkens de afgegeven certificaten is toegestaan.
    url: https://wetten.overheid.nl/BWBR0007914/2025-01-01#Artikel17a
  - number: 17a.2
    text: |-
      Een schip neemt niet deel aan de scheepvaart indien door de wijze van belading de stabiliteit in gevaar wordt
      gebracht.
    url: https://wetten.overheid.nl/BWBR0007914/2025-01-01#Artikel17a
  - number: '18'
    text: |-
      In geval van gevaarlijke ijsgang kan de bevoegde autoriteit verlangen dat schepen die zich in het betrokken gebied
      bevinden en die een haven of terminal willen binnen- of uitvaren of een ankerplaats willen verlaten, met documenten
      kunnen aantonen dat zij aan sterkte- en vermogenseisen voldoen die op de ijsgang in het betrokken gebied zijn
      afgestemd.
    url: https://wetten.overheid.nl/BWBR0007914/2025-01-01#Artikel18
  - number: '19'
    text: |-
      Aan een toestemming als bedoeld in de [artikelen 7, eerste en tweede lid][ref1], [8][ref2],
      [12, tweede en derde lid][ref3], en [13][ref4], kunnen voorschriften worden verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0007914#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007914#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0007914#Artikel12
      [ref4]: https://wetten.overheid.nl/BWBR0007914#Artikel13
    url: https://wetten.overheid.nl/BWBR0007914/2025-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0007914
        artikel: '7'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0007914
        artikel: '8'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0007914
        artikel: '12'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0007914
        artikel: '13'
        paragraaf: '2'
  - number: '20'
    text: |-
      Overtreding van de bij of krachtens dit besluit vastgestelde regels, alsmede overtreding van de aan toestemming
      verbonden voorschriften, is een strafbaar feit.
    url: https://wetten.overheid.nl/BWBR0007914/2025-01-01#Artikel20
  - number: '27'
    text: Het Bijzonder reglement Rotterdamse Waterweg wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0007914/2025-01-01#Artikel27
  - number: '28'
    text: |-
      Het Besluit van 11 augustus 1934, houdende regeling van het Bestuur over de betonning, bebakening, kust- en
      oeverlichten langs de zeekusten, in de zeegaten, op de benedenrivieren en het IJsselmeer van het Koninkrijk der
      Nederlanden (*Stb.*138), wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0007914/2025-01-01#Artikel28
  - number: '29'
    text: Het Besluit informatieverstrekking schepen met bepaalde stoffen wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0007914/2025-01-01#Artikel29
  - number: '30'
    text: |-
      Na inwerkingtreding van [artikel 22, onderdeel D][ref1], van dit besluit, berust de bekendmaking aan de Scheepvaart
      Scheldemond «Marifoonblokindeling» van de Rijkshavenmeester Westerschelde van 4 november 1994, nr. Bass 134/94
      (*Stcrt.* 216) op [artikel 51, eerste, en tweede lid, van het Scheepvaartreglement Westerschelde 1990][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007914#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0005393#Artikel51
    url: https://wetten.overheid.nl/BWBR0007914/2025-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0007914
        artikel: '22'
        paragraaf: '7'
      - id: ref2
        bwb_id: BWBR0005393
        artikel: '51'
  - number: '31'
    text: |-
      De [artikelen 1 tot en met 20][ref1], [artikel 23, onderdeel A, 2°, en onderdeel B][ref2], en de
      [artikelen 27 tot en met 29][ref3], treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor
      de verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld. De [artikelen 21][ref4],
      [22][ref5], [23, onderdeel A, 1°][ref6], en [24 tot en met 26][ref7] treden in werking met ingang van de dag na de
      datum van uitgifte van het *Staatsblad* waarin dit besluit wordt geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0007914#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007914#Artikel23
