  - number: '27'
    text: Het Bijzonder reglement Rotterdamse Waterweg wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0007914/2007-11-23#Artikel27
  - number: '28'
    text: |-
      Het Besluit van 11 augustus 1934, houdende regeling van het Bestuur over de betonning, bebakening, kust- en
      oeverlichten langs de zeekusten, in de zeegaten, op de benedenrivieren en het IJsselmeer van het Koninkrijk der
      Nederlanden (*Stb.*138), wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0007914/2007-11-23#Artikel28
  - number: '29'
    text: Het Besluit informatieverstrekking schepen met bepaalde stoffen wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0007914/2007-11-23#Artikel29
  - number: '30'
    text: |-
      Na inwerkingtreding van [artikel 22, onderdeel D][ref1], van dit besluit, berust de bekendmaking aan de Scheepvaart
      Scheldemond «Marifoonblokindeling» van de Rijkshavenmeester Westerschelde van 4 november 1994, nr. Bass 134/94
      (*Stcrt.* 216) op [artikel 51, eerste, en tweede lid, van het Scheepvaartreglement Westerschelde 1990][ref2].


