        artikel: '4'
      - id: ref2
        bwb_id: BWBR0007914
  - number: '2'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. bevoegde autoriteit: de als zodanig door Onze Minister voor een bepaald gebied aangewezen persoon;

      b. bijzonder transport: een schip of ander drijvend voorwerp dat in zodanige staat verkeert, of een zodanig
      bijzonder karakter heeft, dat ernstige kans bestaat dat het bij de vaart de veiligheid van de scheepvaart in gevaar
      brengt of schade aan de werken veroorzaakt, dan wel zinkt of lading verliest;

      c. klein schip: een schip waarvan de lengte minder dan 20 m bedraagt, waartoe als de lengte wordt aangemerkt de
      afstand van de voorkant van het voorste tot de achterkant van het achterste deel van de romp, zonder de boegspriet,
      de papegaaistok en het trimvlak, zulks met uitzondering van:

        - een schip dat meer dan 12 passagiers mag vervoeren,
        - een veerpont,
        - een vissersschip,
        - een sleepboot;

      d. aanloopgebied: een gebied als omschreven in de bij dit besluit behorende [bijlage 1][ref1];

      e. territoriale zee, behoudens de aanloopgebieden: de Nederlandse territoriale zee, behoudens de in de bij dit
      besluit behorende [bijlage 1][ref2] omschreven aanloopgebieden;

      f. exploitant: de eigenaar, rompbevrachter of ieder ander die de zeggenschap heeft over het gebruik van een schip;

      g. [richtlijn nr. 2002/59/EG](32002L0059): [richtlijn nr. 2002/59/EG](32002L0059) van het Europees Parlement
      en de Raad van de Europese Unie van 27 juni 2002 betreffende de invoering van een communautair monitoring- en
      informatiesysteem voor de zeescheepvaart en tot intrekking van [Richtlijn 93/75/EEG](31993L0075) van de Raad (PbEG
      L 208);

      h. een zeeschip dat bepaalde gevaarlijke of schadelijke stoffen vervoert: elk vrachtschip, iedere olie-,
      chemicaliën-, of gastanker, of een passagiersschip, waarmee wordt vervoerd een gevaarlijke stof als bedoeld in
      artikel 3, onderdeel g, of een schadelijke stof als bedoeld in artikel 3, onderdeel h, van [richtlijn nr. 2002/59/
      EG](32002L0059);

      i. routeringssysteem: een systeem bestaande uit een of meer routes of routeringsmaatregelen, gericht op het
      verminderen van gevaar voor scheepsongevallen, met inbegrip van verkeersscheidingsstelsels, vaarwegen voor
      tweerichtingsverkeer, aanbevolen koerslijnen, gebieden die dienen te worden gemeden, zones voor kustverkeer,
      rotondes, voorzorgsgebieden en diepwaterroutes.


      [ref1]: https://wetten.overheid.nl/BWBR0007914
      [ref2]: https://wetten.overheid.nl/BWBR0007914
    url: https://wetten.overheid.nl/BWBR0007914/2007-11-23#Artikel2
    references:
