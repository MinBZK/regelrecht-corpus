  - number: '20'
    text: |-
      Overtreding van de bij of krachtens de [artikelen 4][ref1], [5, eerste tot en met zesde lid en tiende lid][ref2],
      [5a, tweede lid][ref3], [6][ref4], [7, eerste en tweede lid][ref5], [8][ref6], [9][ref7], [10][ref8],
      [11][ref9], [12, eerste, tweede en derde lid][ref10], [13][ref11], [16][ref12], [17][ref13], en
      [18, eerste lid][ref14], gestelde regels, alsmede overtreding van de aan toestemming verbonden voorschriften, is
      een strafbaar feit.


