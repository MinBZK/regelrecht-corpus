  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Verkeer en Waterstaat van 12 juli 1995, nr. S/J 13.399/95, Directoraat-
    Generaal Scheepvaart en Maritieme Zaken;

    Gelet op de artikelen 4, eerste, en derde lid, 12, 18, 31, tiende lid, en 36 van de Scheepvaartverkeerswet;

    De Raad van State gehoord (advies van 11 september 1995, nr. W09.95.0353);

    Gezien het nader rapport van Onze Minister van Verkeer en Waterstaat van 19 februari 1996, nr. S/J-96000464,
    Directoraat-Generaal Scheepvaart en Maritieme Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0007914/2007-11-23#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Onverminderd de Internationale Bepalingen ter voorkoming van aanvaringen op zee,
      1972 (*Trb.* 1974, 51), zoals gewijzigd, is dit besluit van toepassing in het gedeelte
      van de territoriale zee dat zeewaarts is gelegen van de lijn, zoals beschreven in
      __REF000___________________________________________________________________________________________________________
      _____________________________________________________________________, behoudens dat gedeelte van de territoriale
      zee dat gemeentelijk is ingedeeld.

      2 Het eerste lid is, voor wat de uitzondering van de toepasselijkheid in het gemeentelijk ingedeelde deel van de
      territoriale zee betreft, niet van toepassing ten aanzien van:

      a. de verkeerstekens die zijn opgenomen in de bij dit besluit behorende [bijlage 2][ref2];

      b. een aanloopgebied.


      [ref1]: https://wetten.overheid.nl/BWBR0004644#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0007914
    url: https://wetten.overheid.nl/BWBR0007914/2007-11-23#Artikel1
    references:
      - id: ref1
