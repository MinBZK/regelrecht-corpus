        bwb_id: BWBR0007914
  - number: 2a
    text: |-
      Een wijziging van [richtlijn nr. 2002/59/EG](32002L0059) gaat voor de toepassing van dit reglement gelden met
      ingang van de dag waarop aan de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven, tenzij bij ministerieel
      besluit, dat in de Staatscourant wordt bekendgemaakt, een ander tijdstip wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0007914/2007-11-23#Artikel2a
  - number: '3'
    text: |-
      De kapitein is verantwoordelijk voor de naleving van de bepalingen van dit besluit, tenzij uit de desbetreffende
      bepaling anderszins blijkt.
    url: https://wetten.overheid.nl/BWBR0007914/2007-11-23#Artikel3
  - number: '4'
    text: |-
      Ook bij het ontbreken van uitdrukkelijke voorschriften in dit besluit, worden alle voorzorgsmaatregelen genomen die
      volgens goede zeemanschap zijn geboden, teneinde met name te voorkomen dat door of vanaf het schip:

      a. het leven van personen in gevaar wordt gebracht;

      b. schade wordt veroorzaakt aan andere schepen of aan drijvende voorwerpen, dan wel waterstaatswerken,
      kustverdedigingen, of andere werken en inrichtingen van welke aard ook; of

      c. de veiligheid of het vlotte verloop van de scheepvaart in gevaar wordt gebracht.
    url: https://wetten.overheid.nl/BWBR0007914/2007-11-23#Artikel4
  - number: '5'
    text: |-
      1 Een zeeschip dat bepaalde gevaarlijke of schadelijke stoffen vervoert of een zeeschip met een bruto-tonnage als
      bedoeld in de [Meetbrievenwet 1981][ref1] van 300 of meer, vaart geen in Nederland gelegen haven, ankerplaats, of
      een in de Nederlandse territoriale zee gelegen laad- of losinrichting binnen, voordat de kapitein, de exploitant of
      de agent aan de bevoegde autoriteit van de eerste bestemming in Nederland de bij ministeriële regeling vastgestelde
      gegevens heeft gemeld omtrent het schip, de positie, het tijdstip van aankomst en vertrek daarvan, de daarmee
      vervoerde lading, het aantal personen aan boord en de uit te voeren reis, op een bij die regeling bepaalde wijze.

      2 De in het eerste lid bedoelde melding geschiedt:

      a. door een zeeschip dat bepaalde gevaarlijke of schadelijke stoffen vervoert:

      1°. indien de bestemming bij de afvaart uit de haven van bevrachting bekend was, bij die afvaart, of

      2°. indien de bestemming bij de afvaart uit de haven van bevrachting nog niet bekend was of tijdens de reis wordt
      gewijzigd, zodra deze bekend is;

      b. door een zeeschip met een bruto-tonnage als bedoeld in de [Meetbrievenwet 1981][ref2] van 300 of meer dat geen
      bepaalde gevaarlijke of schadelijke stoffen vervoert:

      1°. ten minste vierentwintig uur voor aankomst, of

      2°. indien de bestemming bij de afvaart uit de vorige haven bekend was en de reisduur minder dan vierentwintig uur
      bedraagt, uiterlijk op het tijdstip waarop het schip de vorige haven verlaat, of

      3°. indien de bestemming bij de afvaart uit de vorige haven nog niet bekend was of tijdens de reis wordt gewijzigd,
      zodra deze bekend is.

      3 Onverminderd het eerste lid, vaart een schip als bedoeld in dat lid, de Nederlandse territoriale zee niet binnen,
      tenzij de kapitein de bij ministeriële regeling vastgestelde gegevens heeft gemeld aan de bevoegde autoriteit van
      het aanloopgebied waarnaar het schip op weg is, op het voor het aanloopgebied voorgeschreven marifoonkanaal.

      4 De kapitein, de exploitant of de agent van een zeeschip dat bepaalde gevaarlijke of schadelijke stoffen vervoert,
      deelt voor de afvaart van dat schip van een in de Nederlandse territoriale zee gelegen ankerplaats of laad- of
      losinrichting met een andere bestemming dan een in Nederland gelegen haven, ankerplaats, laad- of losinrichting
      of wachtplaats, aan de bevoegde autoriteit van het desbetreffende aanloopgebied de bij ministeriële regeling
      vastgestelde gegevens mede omtrent het schip, het tijdstip van vertrek daarvan, de daarmee vervoerde lading, het
      aantal personen aan boord en de uit te voeren reis, op een bij die regeling bepaalde wijze.

      5 Een schip als bedoeld in het eerste lid, luistert in een aanloopgebied uit en neemt, indien nodig, op het
      voorgeschreven marifoonkanaal aan ter plaatse gevoerde communicatie deel.

      6 Het vijfde lid is van overeenkomstige toepassing op ieder schip dat is uitgerust met een marifoon.

      7 De bevoegde autoriteit kan ontheffing verlenen van de in het eerste en vierde lid bedoelde meldingsplichten met
      betrekking tot een zeeschip als bedoeld in die leden, dat in lijndienst vaart tussen twee in Nederland gelegen
      havens of tussen een in Nederland gelegen haven en een haven gelegen in een andere staat, als wordt voldaan aan de
      voorschriften, bedoeld in artikel 15, eerste lid, onderdelen a en b, van richtlijn nr. 2002/59/EG.

      8 De bevoegde autoriteit trekt de ontheffing in wanneer niet meer wordt voldaan aan de voorschriften, bedoeld in
      het zevende lid.

      9 Het eerste en vierde lid zijn niet van toepassing op:

      a. een oorlogsschip, een ander marineschip of een ander schip in eigendom of in dienst van de overheid dat voor
      niet-commerciële doeleinden wordt gebruikt;

      b. een historisch schip of een replica daarvan, met inbegrip van een schip dat ontworpen is om traditionele
      vaardigheden en zeemanschap aan te moedigen en te bevorderen, dat als levend cultuurmonument volgens de
      traditionele beginselen van zeemanschap en techniek wordt bestuurd;

      c. een vissersschip;

      d. een pleziervaartuig met een lengte van minder dan 45 meter.

      10 De kapitein of exploitant van een schip dat behoort tot een bij ministeriële regeling vast te stellen categorie
      schepen meldt aan de bevoegde instantie de bij die regeling vast te stellen gegevens op een bij die regeling vast
      te stellen tijdstip voordat met het schip een in Nederland gelegen haven, een in de Nederlandse territoriale zee
      gelegen offshore-installatie of een ankerplaats ter hoogte van die haven of offshore-installatie wordt aangedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0003378
      [ref2]: https://wetten.overheid.nl/BWBR0003378
    url: https://wetten.overheid.nl/BWBR0007914/2007-11-23#Artikel5
