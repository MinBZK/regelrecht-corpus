  - number: 5a
    text: |-
      1 Bij ministeriële regeling kunnen voor in die regeling vermelde categorieën schepen in de Nederlandse territoriale
      zee, overeenkomstig richtlijnen en criteria van de Internationale Maritieme Organisatie, routeringssystemen en
      meldingssystemen worden vastgesteld.

      2 Degene die een schip voert maakt gebruik van de op grond van het eerste lid vastgestelde routeringssystemen en
      voldoet daarbij aan de voorschriften van de op grond van dat lid vastgestelde meldingssystemen.
    url: https://wetten.overheid.nl/BWBR0007914/2007-11-23#Artikel5a
  - number: '6'
    text: |-
      Van een schip wordt zo spoedig mogelijk aan de bevoegde autoriteit medegedeeld dat het:

      a. aan de grond is geraakt of gezonken;

      b. in aanraking is gekomen met een ander schip en daarbij schade van betekenis is ontstaan of zich persoonlijke
      ongevallen hebben voorgedaan;

      c. een boei, baken of waterstaatswerk heeft aangevaren, verplaatst of beschadigd;

      d. in een toestand verkeert waardoor de manoeuvreerbaarheid of de veiligheid nadelig wordt beïnvloed; of

      e. voorwerpen of stoffen heeft verloren of dreigt te verliezen, die het scheepvaartverkeer in gevaar kunnen
      brengen.
    url: https://wetten.overheid.nl/BWBR0007914/2007-11-23#Artikel6
  - number: '7'
    text: |-
      1 Een bijzonder transport dan wel een schip door middel waarvan werkzaamheden worden verricht, vaart niet dan met
      toestemming van de bevoegde autoriteit.

      2 In afwijking van het eerste lid vaart een bijzonder transport dan wel een schip door middel waarvan werkzaamheden
      worden verricht, dat zich zowel in een aanloopgebied als in de territoriale zee begeeft, niet dan met toestemming
      van de bevoegde autoriteit voor de territoriale zee, behoudens de aanloopgebieden.

      3 Het verlenen of onthouden van toestemming als bedoeld in het tweede lid geschiedt in overeenstemming met de
      bevoegde autoriteit van het aanloopgebied waarin het bijzonder transport dan wel het schip door middel waarvan de
      werkzaamheden worden verricht vaart.
    url: https://wetten.overheid.nl/BWBR0007914/2007-11-23#Artikel7
  - number: '9'
    text: Een schip meert niet af aan een verkeersteken.
    url: https://wetten.overheid.nl/BWBR0007914/2007-11-23#Artikel9
  - number: '11'
    text: Verkeersaanwijzingen worden opgevolgd.
    url: https://wetten.overheid.nl/BWBR0007914/2007-11-23#Artikel11
  - number: '12'
    text: |-
      1 Een sportevenement, een festiviteit of een ander evenement, oefeningen en trainingen daaronder begrepen, waarbij
      een of meer schepen zijn betrokken of waarbij zich personen anders dan op een schip te water bevinden, vindt niet
      plaats, tenzij dat minimaal 6 weken van te voren bij de bevoegde autoriteit is gemeld.

      2 Een activiteit als bedoeld in het eerste lid die de veiligheid van de scheepvaart in gevaar kan brengen, vindt
      niet plaats, tenzij daartoe toestemming van de bevoegde autoriteit is verkregen.

      3 In afwijking van het tweede lid geschiedt een in het eerste lid bedoelde activiteit, die zowel in een
      aanloopgebied als in de territoriale zee plaatsvindt, niet dan met toestemming van de bevoegde autoriteit voor de
      territoriale zee, behoudens de aanloopgebieden.

      4 Het verlenen of onthouden van toestemming als bedoeld in het derde lid geschiedt in overeenstemming met de
      bevoegde autoriteit van het aanloopgebied waarin de in het eerste lid bedoelde activiteit plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0007914/2007-11-23#Artikel12
  - number: '13'
    text: |-
      Een schip wordt niet geladen, gelost, of gebunkerd, tenzij daartoe door de bevoegde autoriteit toestemming is
      verleend.
    url: https://wetten.overheid.nl/BWBR0007914/2007-11-23#Artikel13
  - number: '15'
    text: |-
      De bij dit besluit behorende [bijlage 2][ref1] vermeldt de verkeerstekens ter markering van het vaarwater of van
      obstakels daarin.


      [ref1]: https://wetten.overheid.nl/BWBR0007914
    url: https://wetten.overheid.nl/BWBR0007914/2007-11-23#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0007914
  - number: '16'
    text: |-
      1 Een bekendmaking met dezelfde strekking als een verkeersteken inhoudende een gebod of verbod wordt opgevolgd.

      2 Met een verkeersteken ter markering, of met een bekendmaking met dezelfde strekking als een verkeersteken
      inhoudende een aanbeveling of inlichting, wordt rekening gehouden.
    url: https://wetten.overheid.nl/BWBR0007914/2007-11-23#Artikel16
  - number: '17'
    text: |-
      1 Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de deelname aan het scheepvaartverkeer
      door:

      a. schepen in de Eurogeul en de Maasgeul, met een diepgang van 174 decimeter (57 voet) of meer;

      b. schepen in de IJgeul, met een diepgang van 137 decimeter (45 voet) of meer.

      2 De in het eerste lid bedoelde regels kunnen slechts voorschriften inhouden aangaande:

      a. de toegelaten afmetingen van een schip;

      b. de bouw, de uitrusting, het motorvermogen en de manoeuvreerbaarheid van een schip;

      c. de grootste snelheid waarmede mag worden gevaren;

      d. de meteorologische omstandigheden waaronder mag worden gevaren; of

      e. de minimale waterdiepte onder de kiel en in verband daarmee het tijdstip waarop een schip zich op een bepaalde
      plaats mag bevinden.
    url: https://wetten.overheid.nl/BWBR0007914/2007-11-23#Artikel17
  - number: '19'
    text: |-
      Aan een toestemming als bedoeld in de [artikelen 7, eerste en tweede lid][ref1], [8][ref2],
      [12, tweede en derde lid][ref3], en [13][ref4], kunnen voorschriften worden verbonden.


