  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Onderwijs, Cultuur en Wetenschap, van 13 juni 2012, nr. WJZ/409362
    (10146), directie Wetgeving en Juridische Zaken;

    Gelet op artikel 34, derde lid, van de Monumentenwet 1988;

    De Afdeling advisering van de Raad van State gehoord (advies van 9 augustus 2012, nr. W05.12.0209/I);

    Gezien het nader rapport van de Staatssecretaris van Onderwijs, Cultuur en Wetenschap, van 14 september 2012, nr.
    WJZ/433457 (10146), directie Wetgeving en Juridische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0032036/2013-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder: - *eigenaar:* natuurlijke persoon of
      rechtspersoon die het recht van eigendom of een ander zakelijk recht heeft op een beschermd monument,
        - *normaal onderhoud:* noodzakelijke reguliere werkzaamheden die gericht zijn op het behoud van monumentale waarde,
        - *restauratie:* werkzaamheden die het normale onderhoud te boven gaan en noodzakelijk zijn voor het herstel van
      het beschermde monument,
        - *zelfstandig onderdeel:* 1°. deel van een beschermd monument dat is aan te merken als een zelfstandige
      bouwkundige eenheid, 2°. deel van een beschermd monument dat is aan te merken als een toren van een kerkgebouw,
      3°. alle delen gezamenlijk van een beschermd monument, zijnde een aanleg zoals een park- of tuinaanleg, die aan één
      eigenaar behoren, en niet het gehele beschermde monument omvatten, of 4°. alle delen gezamenlijk van een beschermd
      archeologisch monument, die aan één eigenaar behoren, en niet het gehele beschermde monument omvatten.
    url: https://wetten.overheid.nl/BWBR0032036/2013-01-01#Artikel1
  - number: '2.1'
    text: |-
      Onze minister draagt er zorg voor dat een eigenaar van een beschermd monument een lening kan verkrijgen ter
      financiering van de kosten van de instandhouding van het beschermd monument of een zelfstandig onderdeel.
    url: https://wetten.overheid.nl/BWBR0032036/2013-01-01#Artikel2
  - number: '2.2'
    text: 'Bij die lening geldt dat:'
    url: https://wetten.overheid.nl/BWBR0032036/2013-01-01#Artikel2
  - number: 2.2.a
    text: de lening kan worden verstrekt met als zekerheid het recht van hypotheek op het beschermd monument,
    url: https://wetten.overheid.nl/BWBR0032036/2013-01-01#Artikel2
  - number: 2.2.b
    text: |-
      de drukkende onderhoudskosten zoals die door de Belastingdienst worden gehanteerd, als grondslag dienen voor het
      bepalen van de hoogte van de lening,
    url: https://wetten.overheid.nl/BWBR0032036/2013-01-01#Artikel2
  - number: 2.2.c
    text: |-
      het maximumbedrag per lening en de voorwaarden waaronder de lening wordt verstrekt, worden bekendgemaakt in de
      Staatscourant,
    url: https://wetten.overheid.nl/BWBR0032036/2013-01-01#Artikel2
  - number: 2.2.d
    text: |-
      voor een eigenaar die recht op fiscale aftrek van onderhoudskosten heeft, de lening maximaal 70% van de
      vastgestelde drukkende onderhoudskosten bedraagt,
    url: https://wetten.overheid.nl/BWBR0032036/2013-01-01#Artikel2
  - number: 2.2.e
    text: |-
      voor een eigenaar die geen recht op fiscale aftrek van onderhoudskosten kan genieten, de lening maximaal 100% van
      de voor de hoogte van de lening door de Belastingdienst fictief vastgestelde drukkende onderhoudskosten bedraagt,
      en
    url: https://wetten.overheid.nl/BWBR0032036/2013-01-01#Artikel2
  - number: 2.2.f
    text: |-
      Onze minister een bedrag kan vaststellen dat gedurende een bepaald tijdvak ten hoogste beschikbaar is voor de
      verstrekking van leningen.
    url: https://wetten.overheid.nl/BWBR0032036/2013-01-01#Artikel2
  - number: '2.3'
    text: |-
      Provincies, gemeenten, waterschappen en openbare lichamen die zijn ingesteld met toepassing van de
      [Wet gemeenschappelijke regelingen][ref1], komen niet in aanmerking voor een lening.


      [ref1]: https://wetten.overheid.nl/BWBR0003740
    url: https://wetten.overheid.nl/BWBR0032036/2013-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003740
  - number: '2.4'
    text: 'Een lening wordt niet verstrekt indien:'
    url: https://wetten.overheid.nl/BWBR0032036/2013-01-01#Artikel2
  - number: 2.4.a
    text: |-
      deze voor dezelfde werkzaamheden wordt gevraagd waarvoor op grond van dit besluit subsidie aan de eigenaar is
      verleend, en
    url: https://wetten.overheid.nl/BWBR0032036/2013-01-01#Artikel2
  - number: 2.4.b
    text: |-
      de uitvoering van de werkzaamheden waarvoor de lening wordt gevraagd, in dezelfde periode plaatsvindt als de
      periode waarvoor de subsidie is verleend.
    url: https://wetten.overheid.nl/BWBR0032036/2013-01-01#Artikel2
  - number: '2.5'
    text: |-
      Onze minister kan de eigenaar die geen recht op fiscale aftrek van onderhoudskosten heeft, verplichten een
      verklaring van de Belastingdienst te overleggen, waarin is vastgesteld dat geen aftrek mogelijk is.
    url: https://wetten.overheid.nl/BWBR0032036/2013-01-01#Artikel2
  - number: '3.1'
    text: |-
      Onze minister kan aan de eigenaar van een beschermd monument of zelfstandig onderdeel op aanvraag meerjarige
      subsidie verstrekken voor het normale onderhoud van dat beschermd monument of zelfstandig onderdeel.
    url: https://wetten.overheid.nl/BWBR0032036/2013-01-01#Artikel3
  - number: '3.2'
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld over de verstrekking van subsidie als bedoeld in dit
      artikel.
    url: https://wetten.overheid.nl/BWBR0032036/2013-01-01#Artikel3
  - number: '4.1'
    text: |-
      Onze minister kan aan de eigenaar van een beschermd monument of zelfstandig onderdeel op aanvraag subsidie
      verstrekken voor de restauratie van dat beschermd monument of zelfstandig onderdeel.
    url: https://wetten.overheid.nl/BWBR0032036/2013-01-01#Artikel4
  - number: '4.2'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld over de verstrekking van subsidie als bedoeld in
      dit artikel.
    url: https://wetten.overheid.nl/BWBR0032036/2013-01-01#Artikel4
  - number: '5.1'
    text: |-
      Een subsidie ten laste van een begroting die nog niet is vastgesteld, wordt verleend onder de voorwaarde, bedoeld
      in [artikel 4:34, eerste lid, van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0032036/2013-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '5.2'
    text: |-
      In geval van het niet vervullen van de voorwaarde, bedoeld in
      [artikel 4:34, eerste lid, van de Algemene wet bestuursrecht][ref1], worden de op grond van dit besluit verleende
      subsidiebedragen verlaagd tot het bedrag van de subsidie dat na de vaststelling of goedkeuring van de begroting ter
      beschikking staat, een en ander naar rato van het aantal subsidieaanvragers aan wie subsidie is verleend en van de
      hoogte van de verleende subsidiebedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0032036/2013-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '6.1'
    text: Onze minister kan een of meer subsidieplafonds vaststellen voor de verstrekking van subsidies.
    url: https://wetten.overheid.nl/BWBR0032036/2013-01-01#Artikel6
  - number: '6.2'
    text: |-
      Indien Onze minister een subsidieplafond vaststelt, wordt tegelijkertijd vermeld op welke wijze het beschikbare
      bedrag wordt verdeeld.
    url: https://wetten.overheid.nl/BWBR0032036/2013-01-01#Artikel6
  - number: '7'
    text: |-
      Onverminderd [artikel 4:35 van de Algemene wet bestuursrecht][ref1], wordt ten behoeve van een beschermd monument
      of zelfstandig onderdeel in ieder geval geen subsidie verleend indien:


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0032036/2013-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 7.a
    text: voor de werkzaamheden waarvoor subsidie wordt gevraagd, een lening op grond van dit besluit is verstrekt, en
    url: https://wetten.overheid.nl/BWBR0032036/2013-01-01#Artikel7
  - number: 7.b
    text: de werkzaamheden waarvoor de lening is verstrekt, nog niet zijn afgerond.
    url: https://wetten.overheid.nl/BWBR0032036/2013-01-01#Artikel7
  - number: '8'
    text: |-
      Het [Besluit rijkssubsidiëring instandhouding monumenten 2011][ref1] wordt ingetrokken.


