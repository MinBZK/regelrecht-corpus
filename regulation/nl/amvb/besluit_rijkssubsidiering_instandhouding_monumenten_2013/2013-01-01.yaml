    url: https://wetten.overheid.nl/BWBR0032036/2013-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006058
  - number: '9.2'
    text: |-
      Indien de uitkomst van een bestuursrechtelijke procedure de minister voorschrijft een nieuw besluit te nemen, wordt
      dit genomen overeenkomstig de regeling op grond waarvan het bestreden besluit is genomen.
    url: https://wetten.overheid.nl/BWBR0032036/2013-01-01#Artikel9
  - number: '9.3'
    text: |-
      De rechten en verplichtingen die krachtens een beschikking op grond van een in het eerste lid genoemd besluit
      gelden, blijven gelden voor zover bij of krachtens dit besluit niet anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0032036/2013-01-01#Artikel9
  - number: '9.4'
    text: |-
      Aanwijzingen op grond van [artikel 37 van het Besluit rijkssubsidiëring instandhouding monumenten][ref1] of
      [artikel 33 van het Besluit rijkssubsidiëring instandhouding monumenten 2011][ref2] vervallen.


      [ref1]: https://wetten.overheid.nl/BWBR0019439#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0028785#Artikel33
    url: https://wetten.overheid.nl/BWBR0032036/2013-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0019439
        artikel: '37'
      - id: ref2
        bwb_id: BWBR0028785
        artikel: '33'
  - number: '9.5'
    text: |-
      Onze minister kan toestaan dat het afleggen van rekening en verantwoording van subsidie,
      verleend op grond van het [Besluit rijkssubsidiëring instandhouding monumenten][ref1] of het
      [Besluit rijkssubsidiëring instandhouding monumenten 2011][ref2], geschiedt overeenkomstig dit besluit.


