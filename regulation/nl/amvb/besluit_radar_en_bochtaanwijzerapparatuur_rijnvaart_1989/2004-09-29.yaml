preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Verkeer en Waterstaat van 4 september 1989, nr. RVR 31508, Hoofddirectie van
    de Waterstaat, Hoofdafdeling Bestuurlijke en Juridische Zaken;

    Gelet op de Herziene Rijnvaartakte van 17 oktober 1868 (Trb. 1955, 161 en 1964, 83) en op de door de Centrale
    Commissie voor de Rijnvaart aangenomen resoluties (protocollen 1989-II-33, 1989-II-34 en 1989-II-35);

    Gelet op de Scheepvaartverkeerswet (Stb. 1988, 352);

    De Raad van State gehoord (advies van 3 november 1989, nr. W09.89.0531);

    Gezien het nader rapport van Onze Minister van Verkeer en Waterstaat van 14 november 1989, nr. RVR 44139,
    Hoofddirectie van de Waterstaat, Hoofdafdeling Bestuurlijke en Juridische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0004653/2004-09-29#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Voor de Rijn in Nederland met inbegrip van de Waal en de Lek zijn van kracht de Voorschriften omtrent de minimum
      eisen en de keuringsvoorwaarden voor radarinstallaties voor de Rijnvaart, die zijn gevoegd bij dit besluit.

      2 Typen van radarapparatuur die voor de Rijnvaart zijn goedgekeurd met inachtneming van de resolutie van de
      Centrale Commissie voor de Rijnvaart van 23 april 1969 (protocol 1969-II-18) worden met ingang van 1 januari 2000
      niet meer in een schip ingebouwd. Is de goedkeuring geschied voor 1 januari 1990, dan is het gebruik van deze
      radarapparatuur tot 1 januari 2010 aan boord van een schip toegestaan indien een geldige verklaring omtrent inbouw
      en functioneren daarvan aanwezig is.

      3 Onze Minister van Verkeer en Waterstaat is de bevoegde autoriteit voor Nederland bedoeld in de in het eerste lid
      vermelde voorschriften, tenzij door hem anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0004653/2004-09-29#Artikel1
  - number: '2'
    text: |-
      1 Voor de Rijn in Nederland met inbegrip van de Waal en de Lek zijn van kracht de Voorschriften omtrent de minimum
      eisen en de keuringsvoorwaarden voor bochtaanwijzers voor de Rijnvaart, die zijn gevoegd bij dit besluit.

      2 Typen van bochtaanwijzers die voor de Rijnvaart zijn goedgekeurd met inachtneming van de resolutie van de
      Centrale Commissie voor de Rijnvaart van 23 april 1969 (protocol 1969-II-18) worden met ingang van 1 januari 2000
      niet meer in een schip ingebouwd. Is de goedkeuring geschied voor 1 januari 1990, dan is het gebruik van deze
      bochtaanwijzers tot 1 januari 2010 aan boord van een schip toegestaan indien een geldige verklaring omtrent inbouw
      en functioneren daarvan aanwezig is.

      3 Onze Minister van Verkeer en Waterstaat is de bevoegde autoriteit voor Nederland bedoeld in de in het eerste lid
      vermelde voorschriften, tenzij door hem anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0004653/2004-09-29#Artikel2
  - number: '3'
    text: |-
      1 De inbouw of vervanging, alsmede de reparatie en het onderhoud van radarinstallaties en bochtaanwijzers mogen
      slechts worden uitgevoerd door bedrijven, die door de bevoegde autoriteit als zijnde in overeenstemming met
      [artikel 1][ref1] zijn erkend.

      2 De erkenning kan aan een door de bevoegde autoriteit te bepalen termijn worden gebonden, en kan door deze worden
      ingetrokken indien de voorwaarden als bedoeld in [artikel 1][ref2] niet langer vervuld zijn.

      3 De bevoegde autoriteit deelt per omgaande aan de Centrale Commissie voor de Rijnvaart mede welke bedrijven zijn
      erkend.


      [ref1]: https://wetten.overheid.nl/BWBR0004653#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0004653#Artikel1
