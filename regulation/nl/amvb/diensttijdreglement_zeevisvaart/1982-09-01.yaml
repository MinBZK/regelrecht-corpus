$id: diensttijdreglement_zeevisvaart
regulatory_layer: AMVB
publication_date: '2013-12-19'
valid_from: '1982-09-01'
bwb_id: BWBR0003995
url: https://wetten.overheid.nl/BWBR0003995/1982-09-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Verkeer en Waterstaat, mede namens Onze Minister van Onderwijs en
    Wetenschappen van 10 januari 1983, nr. PJ/S20132, Directoraat-Generaal Scheepvaart en Maritieme Zaken;

    Gelet op de artikelen 4, 5 en 6 van de Wet op de Zeevischvaartdiploma's 1935, (Stb. 455);

    De Raad van State gehoord (advies van 6 april 1983, nr. W09.83.0034b/26.3.13);

    Gezien het nader rapport van Onze voornoemde Minister, mede namens Onze Minister van Onderwijs en Wetenschappen van
    15 mei 1986, nr. PJ/S30929, Directoraat-Generaal Scheepvaart en Maritieme Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0003995/1982-09-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      De begripsbepalingen, genoemd in artikel 1 van de Wet op de Zeevischvaartdiploma's 1935 (*Stb.* 455) zijn van
      toepassing.
    url: https://wetten.overheid.nl/BWBR0003995/1982-09-01#Artikel1
  - number: '2.1'
    text: |-
      Voor de toelating als schipper op een zeevissersvaartuig met een lengte tussen de loodlijnen van minder dan 45
      meter is, behalve het voor de uitoefening van die functie voorgeschreven diploma, vereist het bewijs dat, na
      verkrijging van het diploma voor de zeevisvaart SW VI, aan boord van zeevissersvaartuigen een diensttijd is behaald
      van onderscheidenlijk:
    url: https://wetten.overheid.nl/BWBR0003995/1982-09-01#Artikel2
  - number: 2.1.a
    text: ten minste één jaar voor de vaart in vaargebied I;
    url: https://wetten.overheid.nl/BWBR0003995/1982-09-01#Artikel2
  - number: 2.1.b
    text: ten minste twee jaren voor de vaart in vaargebied II;
    url: https://wetten.overheid.nl/BWBR0003995/1982-09-01#Artikel2
  - number: 2.1.c
    text: ten minste drie jaren voor de vaart in onbeperkt vaargebied.
    url: https://wetten.overheid.nl/BWBR0003995/1982-09-01#Artikel2
  - number: '2.2'
    text: |-
      Voor de toelating als schipper op een zeevissersvaartuig met een lengte tussen de loodlijnen van 45 meter of meer
      is, behalve het voor de uitoefening van die functie voorgeschreven diploma, vereist het bewijs dat, na verkrijging
      van het diploma voor de zeevisvaart SW VI, aan boord van zeevissersvaartuigen een diensttijd is behaald van ten
      minste drie jaren.
    url: https://wetten.overheid.nl/BWBR0003995/1982-09-01#Artikel2
  - number: '3'
    text: |-
      De persoon, bedoeld in artikel 6, onder *b*, van de Wet op de Zeevischvaartdiploma's 1935 (*Stb.* 455), dient in
      het bezit te zijn van het bewijs dat, na verkrijging van het diploma voor de zeevisvaart SW VI, een diensttijd
      van ten minste twee jaren is behaald aan boord van zeevissersvaartuigen met een lengte tussen de loodlijnen van 24
      meter of meer.
    url: https://wetten.overheid.nl/BWBR0003995/1982-09-01#Artikel3
  - number: '4'
    text: |-
      Op aanvraag van de belanghebbende en na overlegging van door Onze Minister nader aan te duiden administratieve
      bescheiden, worden de krachtens dit besluit vereiste bewijzen van diensttijd door het Hoofd van de
      Scheepvaartinspectie afgegeven.
    url: https://wetten.overheid.nl/BWBR0003995/1982-09-01#Artikel4
  - number: '5'
    text: Het Diensttijdreglement Zeevisvaart (besluit van 20 december 1947, *Stb.* H 442) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0003995/1982-09-01#Artikel5
  - number: '6'
    text: |-
      Dit besluit treedt in werking met ingang van de tweede dag na de datum van uitgifte van het *Staatsblad* waarin het
      wordt geplaatst en werkt terug tot en met 1 september 1982.
    url: https://wetten.overheid.nl/BWBR0003995/1982-09-01#Artikel6
  - number: '7'
    text: Dit besluit kan worden aangehaald als "Diensttijdreglement zeevisvaart".
    url: https://wetten.overheid.nl/BWBR0003995/1982-09-01#Artikel7
