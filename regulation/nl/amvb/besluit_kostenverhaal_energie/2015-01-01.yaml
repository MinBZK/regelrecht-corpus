preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Economische Zaken van 15 december 2000, nr. WJZ 00079040;

    Gelet op de artikelen 85 van de Elektriciteitswet 1998 en 64 van de Gaswet;

    De Raad van State gehoord (advies van 25 januari 2001, nr. W10.00.0620/II);

    Gezien het nader rapport van Onze Minister van Economische Zaken van 20 juni 2001, nr. WJZ 01031748;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0012621/2015-01-01#ArtikelAanhef
articles:
  - number: '2.1'
    text: |-
      De bedragen die verschuldigd zijn op grond van [artikel 85, eerste lid, van de Elektriciteitswet 1998][ref1] of
      [artikel 64, eerste lid, van de Gaswet][ref2] zijn vaste bedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel85
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel64
    url: https://wetten.overheid.nl/BWBR0012621/2015-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '85'
      - id: ref2
        bwb_id: BWBR0011440
        artikel: '64'
  - number: '2.2'
    text: |-
      De bedragen, bedoeld in het eerste lid, kunnen verschillen voor de verschillende in
      [artikel 85, eerste lid, van de Elektriciteitswet 1998][ref1] of [artikel 64, eerste lid, van de Gaswet][ref2]
      bedoelde beschikkingen.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel85
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel64
    url: https://wetten.overheid.nl/BWBR0012621/2015-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '85'
      - id: ref2
        bwb_id: BWBR0011440
        artikel: '64'
  - number: '2.3'
    text: De bedragen, bedoeld in het eerste lid, worden bij ministeriële regeling vastgesteld.
    url: https://wetten.overheid.nl/BWBR0012621/2015-01-01#Artikel2
  - number: '2.4'
    text: |-
      Onze Minister brengt de bedragen, bedoeld in het eerste lid, in rekening en verzendt een beschikking daartoe
      tegelijk met de bekendmaking van de betreffende in [artikel 85, eerste lid, van de Elektriciteitswet 1998][ref1] of
      [artikel 64, eerste lid, van de Gaswet][ref2] bedoelde beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel85
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel64
    url: https://wetten.overheid.nl/BWBR0012621/2015-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '85'
      - id: ref2
        bwb_id: BWBR0011440
        artikel: '64'
  - number: '2.5'
    text: |-
      In afwijking van het vierde lid brengt de Autoriteit Consument en Markt de bedragen
      in rekening, voor zover zij namens Onze Minister beschikkingen neemt als bedoeld in
      [artikel 85, eerste lid, van de Elektriciteitswet 1998][ref1] of [artikel 64, eerste lid, van de Gaswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel85
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel64
    url: https://wetten.overheid.nl/BWBR0012621/2015-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '85'
      - id: ref2
        bwb_id: BWBR0011440
        artikel: '64'
  - number: '5.1'
    text: |-
      De bedragen, bedoeld in [artikel 2][ref1], die worden gefactureerd door Onze Minister, worden door Onze Minister
      geïnd en aan Onze Minister betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0012621#Artikel2
    url: https://wetten.overheid.nl/BWBR0012621/2015-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0012621
        artikel: '2'
  - number: '5.2'
    text: |-
      De bedragen, bedoeld in [artikel 2][ref1], die worden gefactureerd door de Autoriteit Consument en Markt, worden
      door de Autoriteit geïnd en aan de Autoriteit betaald. De Autoriteit draagt deze bedragen af aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0012621#Artikel2
    url: https://wetten.overheid.nl/BWBR0012621/2015-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0012621
        artikel: '2'
  - number: '9'
    text: Het Besluit kostenverhaal Elektriciteitswet 1998 wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0012621/2015-01-01#Artikel9
  - number: '10'
    text: Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0012621/2015-01-01#Artikel10
  - number: '11'
    text: 'Dit besluit wordt aangehaald als: Besluit kostenverhaal energie.'
    url: https://wetten.overheid.nl/BWBR0012621/2015-01-01#Artikel11
