  url: https://wetten.overheid.nl/BWBR0005335/2014-05-14#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      De aanmelding, bedoeld in [artikel 9, tweede lid, van de Algemene Wet Bijzondere Ziektekosten][ref1], geschiedt
      door inlevering van een volledig ingevuld en door of namens de verzekerde ondertekend formulier.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel9
    url: https://wetten.overheid.nl/BWBR0005335/2014-05-14#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '9'
  - number: '2'
    text: |-
      1 Het Zorginstituut stelt het model vast van het aanmeldingsformulier.

      2 Het Zorginstituut kan voor door hem aan te wijzen groepen van verzekerden afzonderlijke modellen vaststellen.

      3 Het Zorginstituut kan modellen vaststellen van het inschrijvingsbewijs als bedoeld in [artikel 5][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005335#Artikel5
    url: https://wetten.overheid.nl/BWBR0005335/2014-05-14#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005335
        artikel: '5'
  - number: 2a
    text: |-
      Het Zorginstituut kan regels stellen inzake de technische specificaties waaraan een inschrijvingsbewijs als bedoeld
      in [artikel 5][ref1] moet voldoen als gebruik wordt gemaakt van een magneetstripkaart of een chipkaart.


      [ref1]: https://wetten.overheid.nl/BWBR0005335#Artikel5
    url: https://wetten.overheid.nl/BWBR0005335/2014-05-14#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0005335
        artikel: '5'
  - number: '4'
    text: De zorgverzekeraar beoordeelt of degene die ingeschreven is, verzekerd is.
    url: https://wetten.overheid.nl/BWBR0005335/2014-05-14#Artikel4
  - number: '5'
    text: |-
      De zorgverzekeraar verstrekt de verzekerde terstond na diens inschrijving een bewijs daarvan, dat hij, desverlangd,
      bij het tot gelding brengen van zijn aanspraak op zorg, overlegt.
    url: https://wetten.overheid.nl/BWBR0005335/2014-05-14#Artikel5
  - number: '7'
    text: |-
      Indien het Zorginstituut met toepassing van [artikel 35, derde lid, van de Zorgverzekeringswet][ref1]
      aan zorgverzekeraars de in dat lid bedoelde mededeling heeft gedaan, geldt
      slechts de oudste inschrijving bij een zorgverzekeraar als inschrijving ingevolge
      [artikel 9, eerste lid, van de Algemene Wet Bijzondere Ziektekosten][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0002614#Artikel9
    url: https://wetten.overheid.nl/BWBR0005335/2014-05-14#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '35'
      - id: ref2
        bwb_id: BWBR0002614
        artikel: '9'
  - number: '8'
    text: |-
      1 De inschrijving, bedoeld in [artikel 9, eerste lid, van de Algemene Wet Bijzondere Ziektekosten][ref1], geldt
      zolang de zorgverzekering van de verzekerde, bedoeld in [artikel 1, onderdeel d, van de Zorgverzekeringswet][ref2]
      voortduurt.

      2 De inschrijving, bedoeld in [artikel 9, tweede lid, van de Algemene Wet Bijzondere Ziektekosten][ref3], geldt één
      kalenderjaar. Indien een inschrijving anders dan per 1 januari tot stand is gekomen, geldt de inschrijving tot en
      met 31 december van het volgende kalenderjaar.

      3 De inschrijving, bedoeld in het tweede lid, wordt na verloop van de in dat lid bedoelde termijn, alsmede
      telkens na verloop van de overeenkomstig dit lid verlengde termijn, verlengd met één kalenderjaar, tenzij de
      verzekerde vóór de dag waarop die termijn is verstreken, schriftelijk heeft meegedeeld na afloop van die termijn de
      inschrijving niet te willen verlengen.

      4 De zorgverzekeraar kan schriftelijk een termijn vaststellen die de verzekerde in acht moet nemen bij het doen van
      een mededeling als bedoeld in het derde lid. Deze termijn bedraagt ten hoogste twee maanden.

      5 In afwijking van het tweede en derde lid beëindigt een zorgverzekeraar de inschrijving van een verzekerde met
      ingang van de dag waarop [artikel 9, eerste lid, van de Algemene Wet Bijzondere Ziektekosten][ref4] ten aanzien
      van de verzekerde toepassing heeft gevonden of bij of krachtens de wet inschrijving bij die zorgverzekeraar niet of
      niet langer is toegestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0002614#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0002614#Artikel9
    url: https://wetten.overheid.nl/BWBR0005335/2014-05-14#Artikel8
