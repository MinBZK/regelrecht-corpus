  - number: '13'
    text: Het Zorginstituut kan met betrekking tot hetgeen in dit besluit is bepaald nadere regelen stellen.
    url: https://wetten.overheid.nl/BWBR0005335/2014-05-14#Artikel13
  - number: '15'
    text: Het Inschrijvingsbesluit Bijzondere Ziektekostenverzekering (*Stb.* 1968, 12) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0005335/2014-05-14#Artikel15
  - number: '16'
    text: |-
      Dit besluit treedt in werking op het tijdstip waarop artikel I, onderdelen A, in zijn geheel, en F, van de
      [Wet stelselwijziging ziektekostenverzekering tweede fase][ref1] (*Stb.* 1991, 587) in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0005282
    url: https://wetten.overheid.nl/BWBR0005335/2014-05-14#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0005282
  - number: '17'
    text: Dit besluit kan worden aangehaald als Inschrijvingsbesluit bijzondere ziektekostenverzekering 1992.
    url: https://wetten.overheid.nl/BWBR0005335/2014-05-14#Artikel17
