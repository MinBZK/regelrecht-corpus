preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 17 maart 2008,
    nr. DJZ2008026208, Directie Juridische Zaken, Afdeling Wetgeving, gedaan in overeenstemming met Onze Minister van
    Binnenlandse Zaken en Koninkrijksrelaties;

    Gelet op richtlijn nr. 2006/21/EG van het Europees Parlement en de Raad van de Europese Unie van 15 maart 2006
    (PbEU L 102) betreffende het beheer van afval van de winningsindustrieën en houdende wijziging van Richtlijn
    nr. 2004/35/EG, de artikelen 8.45, 8.48, derde lid, en 17.5a, tweede lid, van de Wet milieubeheer, artikel 24
    van de Wet milieugevaarlijke stoffen, de artikelen 4a, eerste lid, 10a, derde lid, en 10b, vierde lid, van de
    Wet rampen en zware ongevallen en de artikelen 2a, eerste lid, en 2d, eerste lid, van de Wet verontreiniging
    oppervlaktewateren;

    De Raad van State gehoord (advies van 25 april 2008, nr. W08.08.0099/IV);

    Gezien het nader rapport van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 13
    mei 2008, nr. BJZ2008044787, Directie Bestuurlijke en Juridische Zaken, Afdeling Wetgeving, uitgebracht in
    overeenstemming met Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0023903/2015-07-08#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder: *behandeling:* biologische,
      chemische, fysische, mechanische of thermische processen, of een combinatie daarvan, die op mineralen
      worden uitgevoerd met de bedoeling het mineraal te extraheren, uitgezonderd het smelten en de uitvoering van
      thermische productieprocessen of metallurgische processen op mineralen; *beschikking afvalkarakterisering:*
      beschikking nr. 2009/360/EG van de Commissie van de Europese Gemeenschappen van 30 april 2009 tot aanvulling
      van de technische voorschriften voor de afvalkarakterisering die zijn vastgesteld in Richtlijn 2006/21/
      EG van het Europese Parlement en de Raad betreffende het beheer van afval van winningsindustrieën (PbEU L
      110); *beschikking indeling afvalvoorzieningen:* beschikking nr. 2009/337/EG van de Commissie van de Europese
      Gemeenschappen van 20 april 2009 tot vaststelling van de criteria voor de indeling van afvalvoorzieningen
      overeenkomstig bijlage III bij Richtlijn 2006/21/EG van het Europees Parlement en de Raad betreffende het
      beheer van afval van winningsindustrieën (PbEU L 102); *beschikking inert afval:* beschikking nr. 2009/359/
      EG van de Commissie van de Europese Gemeenschappen van 30 april 2009 tot aanvulling van de definitie van inert
      afval ter uitvoering van artikel 22, lid 1, onder f, van Richtlijn 2006/21/EG van het Europees Parlement en de
      Raad betreffende het beheer van afval van winningsindustrieën (PbEU L 110); *gevaarlijke stof:* bij of krachtens
      het [Besluit verpakking en aanduiding milieugevaarlijke stoffen en preparaten][ref1] in een categorie als
      bedoeld in [artikel 9.2.3.1, tweede lid, van de wet][ref2] ingedeelde stof of preparaat; *inerte afvalstoffen:*
      onbrandbare afvalstoffen die geen significante fysische, chemische of biologische veranderingen ondergaan en die
      voldoen aan de criteria, bedoeld in artikel 1, eerste en tweede lid, van de beschikking inert afval, of die als
      zodanig zijn aangewezen bij regeling van Onze Minister; *mineraal:* een van nature voorkomende afzetting in de
      aardkorst van een organische of anorganische stof, uitgezonderd water; *percolaat:* vloeistof die uit de gestorte
      afvalstoffen komt of daarmee in contact is geweest; *rehabilitatie:* herstel in de oorspronkelijke toestand of
      gebruiksmogelijkheden van het landschap, de bodem, beschermde soorten, natuurlijke habitats of zoetwatersystemen,
      welke toestand een nadelige invloed heeft ondervonden van een afvalvoorziening; *richtlijn 2006/11/EG:*
      [richtlijn nr. 2006/11/EG](32006L0011) van het Europees Parlement en de Raad van 15 februari 2006 betreffende
      de verontreiniging veroorzaakt door bepaalde gevaarlijke stoffen die in het aquatisch milieu van de Gemeenschap
      worden geloosd (PbEU L 64); *vergunning:* omgevingsvergunning voor een inrichting of een vergunning als bedoeld in
      [artikel 6.2 van de Waterwet][ref3]; *wet:* [Wet milieubeheer][ref4]; *zwaar ongeval:* gebeurtenis als bedoeld in
      [artikel 1, eerste lid, van het Besluit risico’s zware ongevallen 2015][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0004220
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0025458#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0003245
      [ref5]: https://wetten.overheid.nl/BWBR0036791#Artikel1
    url: https://wetten.overheid.nl/BWBR0023903/2015-07-08#Artikel1
