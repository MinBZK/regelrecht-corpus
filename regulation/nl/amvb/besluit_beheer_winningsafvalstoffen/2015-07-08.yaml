  - number: 1a
    text: |-
      Dit besluit berust mede op de [artikelen 6.6][ref1] en [6.20, tweede lid, van de Waterwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0025458#Artikel6
    url: https://wetten.overheid.nl/BWBR0023903/2015-07-08#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0025458
        artikel: '6'
  - number: '2.1'
    text: 'Dit besluit is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0023903/2015-07-08#Artikel2
  - number: 2.1.a
    text: |-
      de injectie van water en de herinjectie van opgepompt grondwater als bedoeld in artikel 11, derde lid, onderdeel j,
      eerste en tweede gedachtestreepje, van de kaderrichtlijn water, voor zover dat krachtens dat artikel is toegestaan;
    url: https://wetten.overheid.nl/BWBR0023903/2015-07-08#Artikel2
  - number: 2.1.b
    text: |-
      het storten van niet-gevaarlijke, niet-inerte winningsafvalstoffen, tenzij de genoemde categorieën
      winningsafvalstoffen worden gestort in een afvalvoorziening categorie A.
    url: https://wetten.overheid.nl/BWBR0023903/2015-07-08#Artikel2
  - number: '2.2'
    text: |-
      Tenzij de opslag plaatsvindt in een afvalvoorziening categorie A of in een afvalvoorziening voor in het
      afvalbeheersplan als gevaarlijk afval gekarakteriseerd afval, zijn dit besluit en de [titels 8.3][ref1] en
      [17.1A van de wet][ref2] niet van toepassing op de opslag van:


      [ref1]: https://wetten.overheid.nl/BWBR0003245
      [ref2]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0023903/2015-07-08#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003245
      - id: ref2
        bwb_id: BWBR0003245
  - number: 2.2.a
    text: niet-gevaarlijke, niet inerte winningsafvalstoffen, gedurende een periode van één jaar;
    url: https://wetten.overheid.nl/BWBR0023903/2015-07-08#Artikel2
  - number: 2.2.b
    text: niet-gevaarlijk afval afkomstig uit prospectie, gedurende een periode van drie jaar;
    url: https://wetten.overheid.nl/BWBR0023903/2015-07-08#Artikel2
  - number: 2.2.c
    text: niet-verontreinigde grond;
    url: https://wetten.overheid.nl/BWBR0023903/2015-07-08#Artikel2
  - number: 2.2.d
    text: afval uit de winning, behandeling en opslag van turf;
    url: https://wetten.overheid.nl/BWBR0023903/2015-07-08#Artikel2
  - number: 2.2.e
    text: inert winningsafval.
    url: https://wetten.overheid.nl/BWBR0023903/2015-07-08#Artikel2
  - number: '2.3'
    text: |-
      Dit besluit is met uitzondering van [hoofdstuk I, paragraaf 5][ref1], niet van toepassing op een door bovengrondse
      of ondergrondse winning ontstane uitgegraven ruimte, waarin met het oog op rehabilitatie- of bouwdoeleinden
      winningsafvalstoffen worden teruggeplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0023903#HoofdstukI
    url: https://wetten.overheid.nl/BWBR0023903/2015-07-08#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0023903
        hoofdstuk: I
        paragraaf: '5'
  - number: '3.1'
    text: |-
      Het winningsafvalbeheersplan bevat gegevens betreffende de preventie of beperking tot een minimum, behandeling,
      nuttige toepassing en verwijdering van winningsafvalstoffen, rekening houdend met het beginsel van duurzame
      ontwikkeling.
    url: https://wetten.overheid.nl/BWBR0023903/2015-07-08#Artikel3
  - number: '3.2'
    text: 'Het winningsafvalbeheersplan heeft tot doel:'
    url: https://wetten.overheid.nl/BWBR0023903/2015-07-08#Artikel3
  - number: 3.2.a
    text: |-
      het ontstaan van afvalstoffen, alsook de schadelijkheid ervan zoveel mogelijk te voorkomen of te beperken, door
      aandacht te schenken aan:
    url: https://wetten.overheid.nl/BWBR0023903/2015-07-08#Artikel3
  - number: 3.2.a.1°
    text: |-
      afvalbeheer in de ontwerpfase en bij de keuze van de methode die wordt gebruikt voor de winning en behandeling
      van mineralen;
    url: https://wetten.overheid.nl/BWBR0023903/2015-07-08#Artikel3
  - number: 3.2.a.2°
    text: |-
      de veranderingen die de winningsafvalstoffen kunnen ondergaan met betrekking tot een vergroting van de oppervlakte
      en de blootstelling aan bovengrondse omstandigheden;
    url: https://wetten.overheid.nl/BWBR0023903/2015-07-08#Artikel3
  - number: 3.2.a.3°
    text: |-
      terugplaatsing van winningsafvalstoffen in de uitgegraven ruimten na extractie van mineralen, voor zover dit
      technisch en economisch haalbaar en vanuit milieuoogpunt verantwoord is, overeenkomstig de huidige milieunormen en,
      waar van toepassing, overeenkomstig de voorschriften van dit besluit;
    url: https://wetten.overheid.nl/BWBR0023903/2015-07-08#Artikel3
  - number: 3.2.a.4°
    text: |-
      het weer aanbrengen van de bovenste grondlaag na de sluiting van de afvalvoorziening of, als dit praktisch niet
      haalbaar is, hergebruik of recycling van de bovenste grondlaag elders;
    url: https://wetten.overheid.nl/BWBR0023903/2015-07-08#Artikel3
  - number: 3.2.a.5°
    text: het gebruik van minder gevaarlijke stoffen voor de behandeling van mineralen;
    url: https://wetten.overheid.nl/BWBR0023903/2015-07-08#Artikel3
  - number: 3.2.b
    text: |-
      de nuttige toepassing van winningsafvalstoffen door middel van recycling, voorbereiding van hergebruik of
      terugwinning van dergelijke afvalstoffen te bevorderen waar dat vanuit milieuoogpunt verantwoord is overeenkomstig
      de huidige milieunormen en de voorschriften van dit besluit;
    url: https://wetten.overheid.nl/BWBR0023903/2015-07-08#Artikel3
  - number: 3.2.c
    text: |-
      op de korte en de lange termijn de veilige opslag van de afvalstoffen te waarborgen, in het bijzonder door reeds
      in de ontwerpfase het beheer tijdens de bedrijfsuitoefening en de fase na de sluiting van een afvalvoorziening in
      overweging te nemen en door een ontwerp te kiezen:
    url: https://wetten.overheid.nl/BWBR0023903/2015-07-08#Artikel3
  - number: 3.2.c.1°
    text: |-
      waarvoor weinig en, zo mogelijk, uiteindelijk geen monitoring, controle en beheer van de gesloten afvalvoorziening
      nodig is;
    url: https://wetten.overheid.nl/BWBR0023903/2015-07-08#Artikel3
  - number: 3.2.c.2°
    text: dat negatieve gevolgen op de lange termijn voor het milieu voorkomt of althans zoveel mogelijk beperkt, en
    url: https://wetten.overheid.nl/BWBR0023903/2015-07-08#Artikel3
  - number: 3.2.c.3°
    text: |-
      dat de geotechnische stabiliteit op lange termijn van dammen of hopen die zich verheffen boven het voorheen
      bestaande bodemoppervlak waarborgt.
    url: https://wetten.overheid.nl/BWBR0023903/2015-07-08#Artikel3
  - number: '3.3'
    text: |-
      Het winningsafvalbeheersplan verstrekt voldoende informatie om het bevoegd gezag in staat te stellen te beoordelen
      in hoeverre degene die de afvalvoorziening drijft, in staat is de in het tweede lid genoemde doelstellingen van het
      plan te bereiken en zijn verplichtingen die voortvloeien uit dit besluit na te leven. In het plan wordt met name
      toegelicht hoe via het gekozen alternatief en de gekozen methode voor de winning en behandeling van mineralen, de
      doelstellingen, bedoeld in het tweede lid, onderdeel a, worden verwezenlijkt.
    url: https://wetten.overheid.nl/BWBR0023903/2015-07-08#Artikel3
  - number: '3.4'
    text: 'Het winningsafvalbeheersplan bevat ten minste:'
    url: https://wetten.overheid.nl/BWBR0023903/2015-07-08#Artikel3
  - number: 3.4.a
    text: |-
      een karakterisering van de winningsafvalstoffen overeenkomstig bijlage II bij de richtlijn beheer winningsafval, de
      artikelen 1 en 2 van de beschikking afvalkarakterisering, alsmede artikel 2 van de beschikking inert afval en een
      verklaring van de geschatte totale hoeveelheid winningsafvalstoffen die tijdens de bedrijfsuitoefening zal worden
      geproduceerd;
    url: https://wetten.overheid.nl/BWBR0023903/2015-07-08#Artikel3
  - number: 3.4.b
    text: |-
      een beschrijving van de werkzaamheden die deze afvalstoffen voortbrengen, en van eventuele daaropvolgende
      behandelingen die de afvalstoffen zullen ondergaan;
    url: https://wetten.overheid.nl/BWBR0023903/2015-07-08#Artikel3
  - number: 3.4.c
    text: |-
      een beschrijving van de wijze waarop het milieu en de gezondheid van de mens nadelige effecten
      kunnen ondervinden als gevolg van het storten van deze afvalstoffen en de preventieve maatregelen
      die zullen worden genomen om de gevolgen voor het milieu tijdens de exploitatie en na de
      sluiting zoveel mogelijk te beperken, met inbegrip van de onderdelen waarnaar wordt verwezen in
      [artikel 4.10, tweede lid, onderdelen a, b, d en e, van de Regeling omgevingsrecht][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0027471#Artikel4
    url: https://wetten.overheid.nl/BWBR0023903/2015-07-08#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0027471
        artikel: '4'
  - number: 3.4.d
    text: |-
      de voorgestelde controle- en monitoringsprocedures uit hoofde van
      [artikel 4.10, tweede lid, onderdeel c, van de Regeling omgevingsrecht][ref1] en voor zover van toepassing,
      [artikel 12][ref2], in verbinding met [artikel 8.49 van de wet][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0027471#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0023903#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0023903/2015-07-08#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0027471
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0023903
        artikel: '12'
        hoofdstuk: I
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '8'
  - number: 3.4.e
    text: |-
      het voorgestelde plan voor sluiting, inclusief de rehabilitatie, de procedures voor het onderhoud na de sluiting en
      de monitoring overeenkomstig [artikel 8.49 van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0023903/2015-07-08#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
  - number: 3.4.f
    text: |-
      maatregelen om de verslechtering van de waterkwaliteit te voorkomen, overeenkomstig de kaderrichtlijn water en om
      bodem- en luchtverontreiniging uit hoofde van [artikel 10][ref1] zoveel mogelijk te voorkomen of te beperken;


      [ref1]: https://wetten.overheid.nl/BWBR0023903#Artikel10
    url: https://wetten.overheid.nl/BWBR0023903/2015-07-08#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0023903
        artikel: '10'
        hoofdstuk: I
        paragraaf: '3'
  - number: 3.4.g
    text: een overzicht van de bestaande toestand van het milieu dat door de afvalvoorziening zal worden aangetast.
    url: https://wetten.overheid.nl/BWBR0023903/2015-07-08#Artikel3
  - number: '3.5'
    text: |-
      Indien het winningsafvalbeheersplan betrekking heeft op een afvalvoorziening categorie A, bevat dit plan tevens een
      document waaruit ten genoegen van het bevoegd gezag blijkt dat door degene die de afvalvoorziening drijft:
    url: https://wetten.overheid.nl/BWBR0023903/2015-07-08#Artikel3
  - number: 3.5.a
    text: |-
      preventiebeleid voor zware ongevallen overeenkomstig onderdeel 1 van bijlage I bij de richtlijn beheer
      winningsafval is vastgesteld,
    url: https://wetten.overheid.nl/BWBR0023903/2015-07-08#Artikel3
  - number: 3.5.b
    text: |-
      een veiligheidsbeheerssysteem overeenkomstig onderdeel 1 van bijlage I bij de richtlijn beheer winningsafval is
      ingevoerd, en
    url: https://wetten.overheid.nl/BWBR0023903/2015-07-08#Artikel3
  - number: 3.5.c
    text: een intern noodplan is ingevoerd.
    url: https://wetten.overheid.nl/BWBR0023903/2015-07-08#Artikel3
  - number: '3.6'
    text: 'Het interne noodplan, bedoeld in het vijfde lid, onder c, heeft tot doel:'
    url: https://wetten.overheid.nl/BWBR0023903/2015-07-08#Artikel3
  - number: 3.6.a
    text: |-
      zware ongevallen en andere voorvallen te beperken en te beheersen teneinde de effecten ervan tot een minimum te
      beperken, in het bijzonder het beperken van schade aan de gezondheid van de mens en aan het milieu;
    url: https://wetten.overheid.nl/BWBR0023903/2015-07-08#Artikel3
  - number: 3.6.b
    text: |-
      maatregelen uit te voeren die noodzakelijk zijn om de gezondheid van mens en milieu te beschermen tegen de effecten
      van zware ongevallen en andere voorvallen;
    url: https://wetten.overheid.nl/BWBR0023903/2015-07-08#Artikel3
  - number: 3.6.c
    text: de nodige informatie te verstrekken aan het betrokken publiek, aan het bevoegd gezag en de betrokken diensten;
    url: https://wetten.overheid.nl/BWBR0023903/2015-07-08#Artikel3
  - number: 3.6.d
    text: zorg te dragen voor de rehabilitatie na een zwaar ongeval.
    url: https://wetten.overheid.nl/BWBR0023903/2015-07-08#Artikel3
  - number: '4.1'
    text: 'Het bevoegd gezag verbindt aan de vergunning voorschriften, inhoudende de verplichting:'
    url: https://wetten.overheid.nl/BWBR0023903/2015-07-08#Artikel4
  - number: 4.1.a
    text: |-
      dat het winningsafvalbeheersplan wordt gewijzigd in geval van ingrijpende wijzigingen in de exploitatie van de
      afvalvoorziening of in de gestorte afvalstoffen;
    url: https://wetten.overheid.nl/BWBR0023903/2015-07-08#Artikel4
  - number: 4.1.b
    text: dat het winningsafvalbeheersplan elke vijf jaar wordt herzien;
    url: https://wetten.overheid.nl/BWBR0023903/2015-07-08#Artikel4
  - number: 4.1.c
    text: dat een wijziging of herziening van het winningsafvalbeheersplan aan het bevoegd gezag wordt gemeld.
    url: https://wetten.overheid.nl/BWBR0023903/2015-07-08#Artikel4
  - number: '4.2'
    text: |-
      In het eerste lid, onder a, wordt onder een ingrijpende wijziging verstaan: een wijziging in de structuur of de
      exploitatie van een afvalvoorziening die, naar het oordeel van het bevoegd gezag, belangrijke negatieve gevolgen
      kan hebben voor de menselijke gezondheid of het milieu.
    url: https://wetten.overheid.nl/BWBR0023903/2015-07-08#Artikel4
  - number: '5.1'
    text: |-
      In een vergunning wordt door het bevoegd gezag aangegeven of een afvalvoorziening is ingedeeld in categorie A
      overeenkomstig de in bijlage III bij de richtlijn beheer winningsafval bedoelde criteria, alsmede overeenkomstig de
      criteria, bedoeld in de artikelen 1 tot en met 9 van de beschikking indeling afvalvoorzieningen.
    url: https://wetten.overheid.nl/BWBR0023903/2015-07-08#Artikel5
  - number: '5.2'
    text: |-
      Indien degene die de afvalvoorziening drijft, van oordeel is dat die afvalvoorziening niet in categorie A behoeft
      te worden ingedeeld, verstrekt hij bij de aanvraag:
    url: https://wetten.overheid.nl/BWBR0023903/2015-07-08#Artikel5
  - number: 5.2.a
    text: zodanige gegevens of beschrijvingen dat deze classificatie ten genoegen van het bevoegd gezag wordt aangetoond;
    url: https://wetten.overheid.nl/BWBR0023903/2015-07-08#Artikel5
  - number: 5.2.b
    text: een identificatie van mogelijke gevaren in geval van een ongeval.
    url: https://wetten.overheid.nl/BWBR0023903/2015-07-08#Artikel5
  - number: '6'
    text: |-
      Het bevoegd gezag verbindt aan de vergunning voorschriften ten aanzien van de vakbekwaamheid van degene die de
      afvalvoorziening drijft en ten aanzien van de technische ontwikkeling en de opleiding van de in de afvalvoorziening
      werkzame personen.
    url: https://wetten.overheid.nl/BWBR0023903/2015-07-08#Artikel6
  - number: '7.1'
    text: 'Het bevoegd gezag verbindt aan de vergunning voorschriften, inhoudende de verplichting:'
    url: https://wetten.overheid.nl/BWBR0023903/2015-07-08#Artikel7
  - number: 7.1.a
    text: |-
      dat de afvalvoorziening overeenkomstig het bij de aanvraag overgelegd en door het bevoegd gezag goedgekeurd ontwerp
      wordt aangelegd of gebouwd;
    url: https://wetten.overheid.nl/BWBR0023903/2015-07-08#Artikel7
  - number: 7.1.b
    text: |-
      dat na de oplevering van de afvalvoorziening en vóór de ingebruikneming daarvan aan het bevoegd gezag een
      opleveringsrapportage wordt overgelegd, waarin in elk geval zijn opgenomen:
    url: https://wetten.overheid.nl/BWBR0023903/2015-07-08#Artikel7
  - number: 7.1.b.1°
    text: de wijze waarop de directievoering op de aanleg of bouw heeft plaatsgevonden;
    url: https://wetten.overheid.nl/BWBR0023903/2015-07-08#Artikel7
  - number: 7.1.b.2°
    text: |-
      de tijdens het werk ten opzichte van het bestek doorgevoerde afwijkingen en de op die afwijkingen betrekking
      hebbende revisietekeningen;
    url: https://wetten.overheid.nl/BWBR0023903/2015-07-08#Artikel7
  - number: 7.1.b.3°
    text: |-
      een door een deskundige met aantoonbare expertise uitgevoerde controle op de deugdelijkheid en fysische stabiliteit
      van de opgeleverde afvalvoorziening en of wordt voldaan aan de voorschriften die aan de vergunning zijn verbonden.
    url: https://wetten.overheid.nl/BWBR0023903/2015-07-08#Artikel7
  - number: '7.2'
    text: Het eerste lid is van overeenkomstige toepassing bij een verandering van de afvalvoorziening.
    url: https://wetten.overheid.nl/BWBR0023903/2015-07-08#Artikel7
  - number: '8.1'
    text: 'Het bevoegd gezag verbindt aan de vergunning voorschriften, inhoudende de verplichting:'
    url: https://wetten.overheid.nl/BWBR0023903/2015-07-08#Artikel8
  - number: 8.1.a
    text: |-
      dat de afvalvoorziening op een zodanige wijze wordt beheerd en onderhouden dat de fysische stabiliteit is verzekerd
      en verontreiniging of besmetting van bodem, lucht, oppervlaktewaterlichamen of grondwater en schade aan het
      landschap zoveel mogelijk wordt voorkomen, dan wel zoveel mogelijk wordt beperkt, voor zover zij niet kunnen worden
      voorkomen;
    url: https://wetten.overheid.nl/BWBR0023903/2015-07-08#Artikel8
  - number: 8.1.b
    text: |-
      dat verontreinigd water of percolaat wordt opgevangen, verzameld en gezuiverd of afgevoerd op een zodanige wijze
      dat geen gevaar bestaat voor verontreiniging van de bodem of het grondwater;
    url: https://wetten.overheid.nl/BWBR0023903/2015-07-08#Artikel8
  - number: 8.1.c
    text: dat erosie door water of wind wordt tegengegaan, voor zover dat technisch mogelijk en economisch haalbaar is;
    url: https://wetten.overheid.nl/BWBR0023903/2015-07-08#Artikel8
  - number: 8.1.d
    text: |-
      tot periodieke monitoring en inspectie van de afvalvoorziening door binnen de inrichting werkzame personen, die
      beschikken over de voor die werkzaamheden benodigde vakbekwaamheid, om te verzekeren dat de voorziening voldoet aan
      de voorschriften die aan de vergunning zijn verbonden;
    url: https://wetten.overheid.nl/BWBR0023903/2015-07-08#Artikel8
  - number: 8.1.e
    text: |-
      tot het treffen van maatregelen indien de resultaten van die monitoring en de inspectie wijzen op instabiliteit of
      verontreiniging van het water of de bodem.
    url: https://wetten.overheid.nl/BWBR0023903/2015-07-08#Artikel8
  - number: '8.2'
    text: |-
      Het bevoegd gezag verbindt voorts aan de vergunning het voorschrift, inhoudende de verplichting dat de gegevens
      van de monitoring en inspecties, samen met de vergunningdocumentatie, worden bewaard om de passende overdracht van
      informatie te verzekeren in het geval de vergunning zal gaan gelden voor een ander dan de vergunninghouder.
    url: https://wetten.overheid.nl/BWBR0023903/2015-07-08#Artikel8
  - number: '9.1'
    text: |-
      Het bevoegd gezag verbindt aan de vergunning voorschriften, inhoudende de verplichting dat degene die de
      afvalvoorziening drijft, ten minste eenmaal per jaar op basis van verzamelde gegevens een verslag toezendt aan het
      bevoegd gezag:
    url: https://wetten.overheid.nl/BWBR0023903/2015-07-08#Artikel9
  - number: 9.1.a
    text: om aan te tonen dat aan de voorschriften van de vergunning wordt voldaan, en
    url: https://wetten.overheid.nl/BWBR0023903/2015-07-08#Artikel9
  - number: 9.1.b
    text: om de kennis van het gedrag van de afvalstoffen en de afvalvoorziening te vergroten.
    url: https://wetten.overheid.nl/BWBR0023903/2015-07-08#Artikel9
  - number: '9.2'
    text: |-
      Naar aanleiding van dit verslag kan het bevoegd gezag degene die de afvalvoorziening drijft, verplichten de
      gegevens, op basis waarvan het verslag is opgesteld, te laten valideren door een onafhankelijke deskundige.
    url: https://wetten.overheid.nl/BWBR0023903/2015-07-08#Artikel9
  - number: '10.1'
    text: 'Het bevoegd gezag verbindt aan de vergunning voorschriften, inhoudende de verplichting dat:'
    url: https://wetten.overheid.nl/BWBR0023903/2015-07-08#Artikel10
  - number: 10.1.a
    text: |-
      overeenkomstig het bepaalde bij de kaderrichtlijn water, verslechtering van de toestand van het water wordt
      voorkomen, onder meer door:
    url: https://wetten.overheid.nl/BWBR0023903/2015-07-08#Artikel10
  - number: 10.1.a.1°
    text: |-
      de potentiële percolaatvorming te evalueren, met inbegrip van de verontreinigde bestanddelen van het percolaat,
      vanuit de gestorte afvalstoffen zowel tijdens de bedrijfsuitoefening als tijdens de fase na de sluiting van de
      afvalvoorziening, en de waterbalans van de afvalvoorziening te bepalen;
    url: https://wetten.overheid.nl/BWBR0023903/2015-07-08#Artikel10
  - number: 10.1.a.2°
    text: |-
      te voorkomen, dan wel zoveel mogelijk te beperken, voor zover dit niet kan worden voorkomen, dat percolaat wordt
      gegenereerd en oppervlaktewaterlichamen, grondwater of de bodem door de afvalstoffen worden verontreinigd;
    url: https://wetten.overheid.nl/BWBR0023903/2015-07-08#Artikel10
  - number: 10.1.a.3°
    text: |-
      het verontreinigde water en percolaat van de afvalvoorziening te verzamelen en te behandelen totdat wordt voldaan
      aan de van toepassing zijnde normen van lozing ervan;
    url: https://wetten.overheid.nl/BWBR0023903/2015-07-08#Artikel10
  - number: 10.1.b
    text: |-
      degene die de afvalvoorziening drijft, de noodzakelijke maatregelen neemt om stof- en gasemissies zoveel mogelijk
      te voorkomen, dan wel zoveel mogelijk te beperken, voor zover deze emissies niet kunnen worden voorkomen;
    url: https://wetten.overheid.nl/BWBR0023903/2015-07-08#Artikel10
  - number: 10.1.c
    text: |-
      indien winningsafvalstoffen worden teruggeplaatst in een afvalvoorziening die na de sluiting mag volstromen, degene
      die deze afvalvoorziening drijft:
    url: https://wetten.overheid.nl/BWBR0023903/2015-07-08#Artikel10
  - number: 10.1.c.1°
    text: |-
      de noodzakelijke maatregelen treft om verslechtering van de toestand van het water en bodemverontreiniging zoveel
      mogelijk te voorkomen dan wel zoveel mogelijk te beperken, voor zover dit niet kan worden voorkomen;
    url: https://wetten.overheid.nl/BWBR0023903/2015-07-08#Artikel10
  - number: 10.1.c.2°
    text: |-
      het bevoegd gezag voorziet van de informatie die noodzakelijk is om te verzekeren dat wordt voldaan aan [richtlijn
      2006/11/EG](32006L0011), het [Activiteitenbesluit milieubeheer][ref1] en de kaderrichtlijn water.


      [ref1]: https://wetten.overheid.nl/BWBR0022762
    url: https://wetten.overheid.nl/BWBR0023903/2015-07-08#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0022762
  - number: '10.2'
    text: |-
      Het bevoegd gezag kan van de verplichting, bedoeld in het eerste lid, onder a, onderdelen 2° of 3°, afwijken indien
      op basis van een beoordeling van de milieurisico’s en rekening houdend met [richtlijn 2006/11/EG](32006L0011), het
      [Activiteitenbesluit milieubeheer][ref1] en de kaderrichtlijn water, wordt vastgesteld dat:


      [ref1]: https://wetten.overheid.nl/BWBR0022762
    url: https://wetten.overheid.nl/BWBR0023903/2015-07-08#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0022762
  - number: 10.2.a
    text: het verzamelen en behandelen van percolaat niet nodig is, of
    url: https://wetten.overheid.nl/BWBR0023903/2015-07-08#Artikel10
  - number: 10.2.b
    text: de afvalvoorziening geen potentieel gevaar voor de bodem, het grondwater of een oppervlaktewaterlichaam vormt.
    url: https://wetten.overheid.nl/BWBR0023903/2015-07-08#Artikel10
  - number: '10.3'
    text: |-
      Aan een vergunning als bedoeld in [artikel 6.2 van de Waterwet][ref1] voor het storten van winningsafvalstoffen
      in een ontvangend waterlichaam, niet zijnde een waterlichaam dat is aangelegd voor de verwijdering van
      winningsafvalstoffen, wordt de verplichting verbonden dat degene die de afvalvoorziening drijft:


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel6
    url: https://wetten.overheid.nl/BWBR0023903/2015-07-08#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '6'
  - number: 10.3.a
    text: voldoet aan de toepasselijke voorschriften van [richtlijn 2006/11/EG](32006L0011) en de kaderrichtlijn water;
    url: https://wetten.overheid.nl/BWBR0023903/2015-07-08#Artikel10
  - number: 10.3.b
    text: |-
      het bevoegd gezag voorziet van de informatie die noodzakelijk is om te verzekeren dat wordt voldaan aan de onder a
      bedoelde voorschriften.
    url: https://wetten.overheid.nl/BWBR0023903/2015-07-08#Artikel10
  - number: '11'
    text: |-
      Het bevoegd gezag verbindt aan een vergunning voor een afvalvoorziening categorie A voorschriften, inhoudende de
      verplichting dat degene die de afvalvoorziening drijft:
    url: https://wetten.overheid.nl/BWBR0023903/2015-07-08#Artikel11
  - number: 11.a
    text: |-
      bij de exploitatie en het onderhoud van de afvalvoorziening het in [artikel 3, vijfde lid][ref1], bedoelde
      preventiebeleid uitvoert om een zwaar ongeval te voorkomen;


      [ref1]: https://wetten.overheid.nl/BWBR0023903#Artikel3
    url: https://wetten.overheid.nl/BWBR0023903/2015-07-08#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0023903
        artikel: '3'
        hoofdstuk: I
        paragraaf: '2'
  - number: 11.b
    text: |-
      overeenkomstig het in [artikel 3, vijfde lid][ref1], bedoelde interne noodplan in geval van een dergelijk ongeval
      onmiddellijk maatregelen treft om nadelige gevolgen voor de gezondheid van mens of milieu, met inbegrip van de
      grensoverschrijdende gevolgen, zoveel mogelijk te voorkomen of te beperken;


      [ref1]: https://wetten.overheid.nl/BWBR0023903#Artikel3
    url: https://wetten.overheid.nl/BWBR0023903/2015-07-08#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0023903
        artikel: '3'
        hoofdstuk: I
        paragraaf: '2'
  - number: 11.c
    text: 'een veiligheidsmanager aanstelt, die verantwoordelijk is voor:'
    url: https://wetten.overheid.nl/BWBR0023903/2015-07-08#Artikel11
  - number: 11.c.1°
    text: |-
      de invoering en werking van het in [artikel 3, vijfde lid][ref1], bedoelde veiligheidsbeheerssysteem;


      [ref1]: https://wetten.overheid.nl/BWBR0023903#Artikel3
    url: https://wetten.overheid.nl/BWBR0023903/2015-07-08#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0023903
        artikel: '3'
        hoofdstuk: I
        paragraaf: '2'
  - number: 11.c.2°
    text: de uitvoering van en het periodieke toezicht op het preventiebeleid voor zware ongevallen.
    url: https://wetten.overheid.nl/BWBR0023903/2015-07-08#Artikel11
  - number: '12'
    text: |-
      Het bevoegd gezag verbindt aan een vergunning als bedoeld in
      [artikel 5, derde lid, van het Besluit bodemkwaliteit][ref1] voor het met het oog op rehabilitatie- of
      bouwdoeleinden terugplaatsen van winningsafvalstoffen in een bij bovengrondse of ondergrondse winning ontstane
      uitgegraven ruimte voorschriften, inhoudende de verplichting dat degene die de winningsafstoffen terugplaatst, de
      passende maatregelen, bedoeld in artikel 10, eerste lid, van de richtlijn beheer winningsafval, neemt.


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel5
    url: https://wetten.overheid.nl/BWBR0023903/2015-07-08#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '5'
  - number: '16.1'
    text: |-
      Een wijziging van bijlage I, onderdeel 1, bijlage II of bijlage III bij de richtlijn beheer winningsafval gaat voor
      de toepassing van dit besluit gelden met ingang van de dag waarop aan de betrokken wijzigingsrichtlijn gevolg moet
      zijn gegeven.
    url: https://wetten.overheid.nl/BWBR0023903/2015-07-08#Artikel16
  - number: '16.2'
    text: |-
      Indien dit ter uitvoering van de richtlijn beheer winningsafval noodzakelijk is, kan Onze Minister het bevoegd
      gezag verzoeken met betrekking tot de afvalvoorzieningen waarvoor het bevoegd is de vergunning te verlenen, aan hem
      de bij het verzoek aangegeven gegevens te zenden binnen een daarin aangegeven termijn.
    url: https://wetten.overheid.nl/BWBR0023903/2015-07-08#Artikel16
  - number: '16.3'
    text: Het bevoegd gezag zendt de in het tweede lid bedoelde gegevens aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0023903/2015-07-08#Artikel16
  - number: '16.4'
    text: |-
      Dit besluit berust met ingang van 1 juni 2008 mede op [artikel 9.2.2.1 van de Wet milieubeheer][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0023903/2015-07-08#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
  - number: '17'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin het wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0023903/2015-07-08#Artikel17
  - number: '18'
    text: 'Dit besluit wordt aangehaald als: Besluit beheer winningsafvalstoffen.'
    url: https://wetten.overheid.nl/BWBR0023903/2015-07-08#Artikel18
