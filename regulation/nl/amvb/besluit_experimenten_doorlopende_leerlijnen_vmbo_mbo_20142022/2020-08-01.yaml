  - number: 6a
    text: |-
      1 In afwijking van [artikelen 6g, derde en vierde lid][ref1], en [6g1, eerste en tweede lid, van de WVO][ref2]
      en [artikel 7.2.7, derde lid, onderdelen b, c en d, van de WEB][ref3], zorgen de bevoegde gezagsorganen ervoor
      dat het onderwijsprogramma van een vakmanschaproute of beroepsroute die eindigt met een beroepsopleiding in de
      beroepsopleidende leerweg, afhankelijk van de in [artikel 6][ref4] voorgeschreven studieduur, voldoet aan het
      tweede lid, onderdelen a, b, c of d.

      2 Het onderwijsprogramma omvat bij een leerroute van:

      a. drie volledige studiejaren ten minste 3.000 klokuren, bestaande uit ten minste 2.400 begeleide onderwijsuren en
      ten minste 250 klokuren aan beroepspraktijkvorming;

      b. vier volledige studiejaren ten minste 4.000 klokuren, bestaande uit ten minste 2.950 begeleide onderwijsuren en
      ten minste 450 klokuren aan beroepspraktijkvorming;

      c. vijf volledige studiejaren ten minste 5.000 klokuren, bestaande uit ten minste 3.500 begeleide onderwijsuren en
      ten minste 900 klokuren aan beroepspraktijkvorming, of

      d. zes volledige studiejaren ten minste 6.000 klokuren, bestaande uit ten minste 4.050 begeleide onderwijsuren en
      ten minste 1.350 klokuren aan beroepspraktijkvorming.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel6g
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel6g1
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel7.2.7
      [ref4]: https://wetten.overheid.nl/BWBR0033984#Artikel6
    url: https://wetten.overheid.nl/BWBR0033984/2020-08-01#Artikel6a
