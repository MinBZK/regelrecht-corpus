  - number: '5'
    text: |-
      1 Een vakmanschaproute of beroepsroute wordt aangeboden als één programmatisch geheel voor de leerlingen op de
      locaties van de school en de instelling.

      2 Bij de inrichting van het programmatisch geheel kan, afhankelijk van de leerweg in het vmbo die onderdeel uitmaakt
      van de experimentele leerroute, worden afgeweken van de [artikelen 10, zevende lid, onderdelen a en b][ref1],
      [10b, zesde lid, en zevende lid, onderdeel a][ref2], en [10d, zevende lid, onderdelen a, b en c, van de WVO][ref3].

      3 De school of instelling waar de leerling is ingeschreven, is gedurende de experimentele leerroute
      verantwoordelijk voor die leerling en het vervullen van de bijbehorende wettelijke verplichtingen, met uitzondering
      van in ieder geval de volgende situaties:

      a. het afleggen van een examen bij of het verkrijgen van een diploma van de andere onderwijsinstelling,

      b. het volgen van onderwijs, verzorgd door de andere onderwijsinstelling op de locatie van die instelling.

      4 Bij de toepassing van [artikel 8.1.3 van de WEB][ref4] is in elk geval vastgelegd:

      a. het onderwijsprogramma van de vakmanschaproute of beroepsroute met het daarbij behorende aantal uren
      onderwijstijd, en

      b. de wijze waarop uitvoering wordt gegeven aan de terugvaloptie, bedoeld in [artikel 11][ref5].

      5 Ten aanzien van de in dit experiment deelnemende leerlingen jonger dan 16 jaar wordt onderwijs verzorgd met
      inachtneming van de volgende vereisten:

      a. het onderwijs wordt ingericht volgens het onderwijsprogramma, bedoeld in [artikel 6a][ref6], en

      b. de beroepspraktijkvorming, bedoeld in de [artikelen 7.2.8][ref7] en [7.2.9 van de WEB][ref8], omvat uitsluitend
      het verrichten van lichte arbeid van geschikte aard.

      6 Resultaten door de leerling behaald onder de verantwoordelijkheid van het andere bevoegd gezag dan de school
      of instelling waar de leerling is ingeschreven, worden verwerkt op een wijze die aansluit bij de verwerking van
      resultaten op de school of instelling van het verantwoordelijke bevoegd gezag.

      7 In aanvulling op [artikelen 10][ref9], [10b][ref10] en [10d van de WVO][ref11] en
      [artikel 7.2.7 van de WEB][ref12] ontvangt de leerling gedurende het experiment adequate loopbaanoriëntatie en
      begeleiding.

      8 Als extra vak als bedoeld in [artikel 10b, negende lid, onderdeel d, van de WVO][ref13] kan de technologieroute
      het vak informatietechnologie omvatten.


