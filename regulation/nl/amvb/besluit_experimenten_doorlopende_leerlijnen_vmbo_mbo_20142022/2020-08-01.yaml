preamble:
  text: >-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.


    Op de voordracht van Onze Minister van Onderwijs, Cultuur en Wetenschap, van 3 juli 2013, nr. WJZ/522606(4913),
    directie Wetgeving en Juridische Zaken, gedaan mede namens de Staatssecretaris van Onderwijs, Cultuur en
    Wetenschap, en de Staatssecretaris van Economische Zaken;


    Gelet op artikel 11a.1, eerste, tweede en zevende lid, van de Wet educatie en beroepsonderwijs en artikel 118t,
    eerste, tweede en zevende lid, van de Wet op het voortgezet onderwijs;


    De Afdeling advisering van de Raad van State gehoord (advies van 7 augustus 2013, nr. W05.13.0197/I);


