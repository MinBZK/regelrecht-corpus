  - number: '2'
    text: |-
      1 De volgende experimenten worden ingericht als doorlopende leerlijn vanaf het derde leerjaar van het vmbo tot en
      met een diploma beroepsonderwijs:

      a. vakmanschaproute: voor de leerling die:

      1°. start in de basisberoepsgerichte of kaderberoepsgerichte leerweg en die in een aanverwant opleidingsdomein in
      het beroepsonderwijs wordt opgeleid tot een diploma basisberoepsopleiding, of

      2°. start in de kaderberoepsgerichte leerweg en die in een aanverwant opleidingsdomein in het beroepsonderwijs
      wordt opgeleid tot een diploma vakopleiding;

      b. beroepsroute: voor de leerling die start in de kaderberoepsgerichte, gemengde of theoretische leerweg en die in
      een aanverwant opleidingsdomein in het beroepsonderwijs wordt opgeleid tot een diploma middenkaderopleiding.

      2 Het doel van de experimenten is te onderzoeken of door het inrichten van doorlopende leerlijnen van vmbo
      naar mbo en daarbij af te wijken van hetgeen in de [WVO][ref1] is geregeld betreffende onderwijstijd en de
      inrichting van de leerwegen in het vmbo en af te wijken van hetgeen in de [WEB][ref2] is geregeld betreffende
      studieduur en inrichting van de beroepsopleidingen, waarbij de leerlijn doorloopt tot en met de afsluiting van een
      basisberoepsopleiding, vakopleiding of middenkaderopleiding:

      1°. de doorstroming van leerlingen van het voorbereidend beroepsonderwijs en het middelbaar algemeen voortgezet
      onderwijs naar het middelbaar beroepsonderwijs verbeterd kan worden,

      2°. meer leerlingen van de gemengde en theoretische leerweg kiezen voor een leerroute vmbo naar beroepsonderwijs,

      3°. de programmatische aansluiting van de leerwegen op het beroepsonderwijs verbeterd kan worden,

      4°. het onderwijsproces doelmatiger georganiseerd kan worden,

      5°. voor zover mogelijk de opleidingsduur kan worden verkort,

      6°. het aantal voortijdig schoolverlaters verder terug kan worden gedrongen, en

      7°. de aansluiting van het beroepsonderwijs op de arbeidsmarkt kan worden verbeterd en voor de technologieroute:
      een bijdrage wordt geleverd aan het tekort aan technisch opgeleide mensen op de arbeidsmarkt in de technieksector.

      3 De artikelen uit de [WVO][ref3] en de [WEB][ref4] en de bij en krachtens deze wetten vastgestelde voorschriften
      zijn van toepassing op de experimenten tenzij bij dit besluit daarvan wordt afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0002399
      [ref2]: https://wetten.overheid.nl/BWBR0007625
