  - number: '4'
    text: |-
      1 In de samenwerkingsovereenkomst, bedoeld in [artikel 3, tweede lid, onder a][ref1], zijn in elk geval afspraken
      opgenomen over:

      a. het wederzijds gebruik van faciliteiten,

      b. de vorm van samenwerking, waaronder in ieder geval de inrichting van de bestuurlijke verantwoordelijkheid en de
      organisatorische alsmede onderwijskundige inrichting van het experiment,

      c. de inhoud van de terugvaloptie, bedoeld in [artikel 11][ref2],

      d. de wijze waarop klachten worden afgehandeld,

      e. het profiel en het aanverwant opleidingsdomein waarin het experiment wordt aangeboden,

      f. de wijze waarop het bedrijfsleven zal worden betrokken bij de selectie van kwalificaties die binnen het
      betreffende opleidingsdomein zullen worden aangeboden,

      g. de wijze waarop het bedrijfsleven overigens wordt betrokken bij de opzet van het experiment,

      h. in geval van overdracht van een deel van de bekostiging met toepassing van [artikel 10][ref3], de omvang en de
      bestemming van de over te dragen middelen.

      2 Het eerste lid is van overeenkomstige toepassing op een interne regeling als bedoeld in
      [artikel 3, vijfde lid, onderdeel b][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0033984#Artikel3
