    nr. WJZ/539863 (4913), directie Wetgeving en Juridische Zaken, uitgebracht mede namens de Staatssecretaris van
    Onderwijs, Cultuur en Wetenschap, en de Staatssecretaris van Economische Zaken;


    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0033984/2020-08-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In dit besluit wordt verstaan onder:

      a. *Onze Minister:* Onze Minister van Onderwijs, Cultuur en Wetenschap;

      b. *WVO:* [Wet op het voortgezet onderwijs][ref1];

      c. *WEB:* [Wet educatie en beroepsonderwijs][ref2];

      d. *vmbo:* voorbereidend middelbaar beroepsonderwijs als bedoeld [artikel 21 van de WVO][ref3];

      e. *theoretische leerweg:* leerweg in het vmbo als bedoeld in [artikel 10, eerste lid, van de WVO][ref4];

      f. *basisberoepsgerichte leerweg:* leerweg in het vmbo als bedoeld in [artikel 10b, eerste lid, van de WVO][ref5];

      g. *kaderberoepsgerichte leerweg:* leerweg in het vmbo als bedoeld in [artikel 10b, eerste lid, van de WVO][ref6];

      h. *gemengde leerweg:* leerweg in het vmbo als bedoeld in [artikel 10d, eerste lid, van de WVO][ref7];

      i. *beroepsonderwijs:* middelbaar beroepsonderwijs in de basisberoepsopleiding, vakopleiding of
      middenkaderopleiding als bedoeld in [artikel 7.2.2., eerste lid, onderdelen b, c en d, van de WEB][ref8];

      j. *basisberoepsopleiding:* basisberoepsopleiding als bedoeld in
      [artikel 7.2.2, eerste lid, onder b, van de WEB][ref9];

      k. *middenkaderopleiding:* middenkaderopleiding als bedoeld in
      [artikel 7.2.2, eerste lid, onder d, van de WEB][ref10];

      l. *instelling:* instelling als bedoeld in [artikel 1.1.1, onder b, van de WEB][ref11];

      m. *school:* school als bedoeld in [artikel 1 van de WVO][ref12];

      n. *bevoegd gezag:* bevoegd gezag als bedoeld in [artikel 1 van de WVO][ref13] respectievelijk
      [artikel 1.1.1, onder w, van de WEB][ref14];

      o. *vakmanschaproute:* experimentele leerroute als bedoeld in [artikel 2, eerste lid, onderdeel a][ref15];

      p. *technologieroute:* beroepsroute specifiek gericht op doorstroming vanuit:

      1°. de sector techniek of landbouw, als bedoeld in [artikel 10, derde lid][ref16], [10b, derde lid][ref17], of
      [10d derde lid, van de WVO][ref18], zoals die artikelen luidden op 31 juli 2016;

      2°. het profiel techniek of landbouw, genoemd in [artikel 10, derde lid, van de WVO][ref19]; of

      3°. een van de profielen, genoemd in [artikel 10b, derde lid, onderdelen a tot en met e en i][ref20], of
      [10d, derde lid, onderdelen a tot en met e en i, van de WVO][ref21],

      naar een aanverwant opleidingsdomein in het beroepsonderwijs;

      q. *profiel:* profiel als bedoeld in [artikel 10, derde lid, 10b, derde lid][ref22], of
      [10d, derde lid, van de WVO][ref23];

      r. *agrarisch opleidingscentrum:* agrarisch opleidingscentrum als bedoeld in [artikel 1.3.3 van de WEB][ref24];

      s. *verticale scholengemeenschap:* scholengemeenschap als bedoeld in [artikel 2.6 van de WEB][ref25];

      t. *opleidingsdomein:* opleidingsdomein, vastgesteld op grond van [artikel 7.2.5a van de WEB][ref26];

      u. *experiment:* experiment als bedoeld in [artikel 2, eerste lid][ref27];

      v. *beroepsroute:* experimentele leerroute als bedoeld in [artikel 2, eerste lid, onderdeel b][ref28];

      w. *vakopleiding:* beroepsopleiding als bedoeld in [7.2.2., eerste lid, onderdeel c, van de WEB][ref29].

      2 In dit besluit wordt onder «leerling» mede verstaan «student» als bedoeld in de [WEB][ref30], wordt
      onder «studiejaar» als bedoeld in [artikel 1.1.1., onderdeel r, van de WEB][ref31], mede verstaan:
      «schooljaar» als bedoeld in de [WVO][ref32], en heeft het begrip «begeleide onderwijsuren» als bedoeld in
      [artikel 7.2.7, zesde lid, van de WEB][ref33] mede betrekking op onderwijstijd voor een leerling in het eerste en
      tweede studiejaar van een experimentele leerroute.


