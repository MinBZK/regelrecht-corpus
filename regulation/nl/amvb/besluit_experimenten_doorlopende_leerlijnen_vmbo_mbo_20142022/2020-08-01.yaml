  - number: '7'
    text: |-
      1 Het bevoegd gezag kan uitsluitend voor wat betreft een vakmanschaproute die opleidt tot een diploma
      basisberoepsopleiding als bedoeld in [artikel 2, eerste lid, onderdeel a, subonderdeel 1][ref1],
      in afwijking van de [artikelen 23, eerste lid, onderdelen b en c][ref2], en
      [24, eerste lid, onderdelen b en c, van het Eindexamenbesluit VO][ref3], besluiten vakken uit het profieldeel,
      bedoeld in [artikel 10b, zesde lid, van de WVO][ref4] en beroepsgerichte keuzevakken als bedoeld in het zevende
      lid, onderdeel a, van dat artikel, geen onderdeel te laten zijn van het eindexamen.

      2 In afwijking van [artikel 37, tweede en derde lid, van het Eindexamenbesluit VO][ref5] wordt
      ten minste het gemeenschappelijk deel van het eindexamen, bedoeld in [artikelen 23][ref6] en
      [24 van het Eindexamenbesluit VO][ref7] afgerond:

      a. voordat het examen van de basisberoepsopleiding is afgerond, en

      b. uiterlijk in het derde leerjaar van de vakmanschaproute die opleidt tot een diploma basisberoepsopleiding,
      bedoeld in [artikel 2, eerste lid, onderdeel a, subonderdeel 1][ref8].

      3 Onverminderd [artikel 17 van het Examen- en kwalificatiebesluit beroepsopleidingen WEB][ref9], kan de kandidaat
      die niet is geslaagd voor het eindexamen vmbo in de basisberoepsgerichte of kaderberoepsgerichte leerweg, bedoeld
      in [artikelen 23][ref10], [24][ref11] en [49 van het Eindexamenbesluit VO][ref12], binnen de vakmanschaproute de
      basisberoepsopleiding alleen met goed gevolg afronden indien:

      a. het gekozen kunstvak en lichamelijke opvoeding zijn beoordeeld als «voldoende» of «goed», en voor het vak
      maatschappijleer als eindcijfer 6 of meer is behaald, en

      b. hij voor het eindexamen in de vakken Nederlandse taal en Engelse taal ten minste een eindcijfer 5 en een
      eindcijfer 6 heeft behaald.

      4 Het bevoegd gezag reikt de leerling in elk geval een cijferlijst uit wanneer de kandidaat een examen in een vak
      met goed gevolg heeft afgelegd. Een cijferlijst wordt verstrekt indien [artikel 11][ref13] van toepassing is.

      5 Leerlingen die het examen van de basisberoepsopleiding die onderdeel uitmaakt van de vakmanschaproute met goed
      gevolg afsluiten, ontvangen:

      a. een diploma van de basisberoepsopleiding als bedoeld in [artikel 7.4.6 van de WEB][ref14]; en

      b. indien het vierde lid van toepassing is: een cijferlijst van de vakken waarin de leerling examen vmbo heeft
      gedaan.


