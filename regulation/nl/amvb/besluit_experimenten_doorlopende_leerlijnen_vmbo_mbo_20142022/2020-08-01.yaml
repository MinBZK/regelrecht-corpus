  - number: '8'
    text: |-
      1 In afwijking van [artikel 37, tweede en derde lid, van het Eindexamenbesluit VO][ref1] wordt het eindexamen,
      bedoeld in [artikelen 22][ref2], [24][ref3] en [25 van het Eindexamenbesluit VO][ref4] afgerond:

      a. voordat het examen van de middenkaderopleiding is afgerond, en

      b. uiterlijk in het vierde leerjaar van de beroepsroute.

      2 Leerlingen die het examen van de middenkaderopleiding die onderdeel uitmaakt van de beroepsroute met goed gevolg
      afsluiten, ontvangen een diploma van de middenkaderopleiding als bedoeld in [artikel 7.4.6 van de WEB][ref5]. Een
      cijferlijst wordt verstrekt indien [artikel 11][ref6] van toepassing is en indien de kandidaat een examen in een
      vak met goed gevolg heeft afgelegd.


