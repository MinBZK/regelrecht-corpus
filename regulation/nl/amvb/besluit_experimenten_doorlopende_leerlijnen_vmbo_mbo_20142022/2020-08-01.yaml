  - number: '3'
    text: |-
      1 Het bevoegd gezag van een school en het bevoegd gezag van een instelling dienen gezamenlijk een aanvraag tot
      toestemming in bij Onze Minister om deel te nemen aan een experiment. Beide gezagsorganen ondertekenen de aanvraag.

      2 De aanvraag, bedoeld in het eerste lid, omvat:

      a. een samenwerkingsovereenkomst tussen het bevoegd gezag van de school en het bevoegd gezag van de instelling,

      b. de adviezen van de medezeggenschapsraad van de school, alsmede van de studentenraad en ondernemingsraad van de
      instelling en in voorkomend geval van haar ouderraad omtrent de aanvraag, bedoeld in het eerste lid,

      c. een projectplan, dat ten minste beschrijft:

      1°. de gezamenlijke visie en ambitie ten aanzien van het experiment, en

      2°. een zo concreet mogelijke uitwerking van het experiment, waaronder een organisatieplan waarin is beschreven
      op welke wijze de leerroute zal worden georganiseerd, alsmede hoe het onderwijs als één programmatisch geheel zal
      worden aangeboden.

      3 In de aanvraag worden het profiel of de profielen en het aanverwante opleidingsdomein genoemd, waarop de
      leerroute betrekking heeft.

      4 De aanvraag kan slechts betrekking hebben op één experiment, met dien verstande dat meerdere aanvragen kunnen
      worden ingediend.

      5 Indien sprake is van een aanvraag die ziet op het voorbereidend beroepsonderwijs en het middelbaar
      beroepsonderwijs, verzorgd door een agrarisch opleidingscentrum of een verticale scholengemeenschap wordt de
      aanvraag:

      a. ingediend door het bevoegd gezag van de instelling, en

      b. in afwijking van het tweede lid, onder a, ingediend met een interne regeling in plaats van een
      samenwerkingsovereenkomst.

      6 De deelname van de school aan een experiment ziet slechts op het toegestane onderwijsaanbod dat in het voorgaande
      schooljaar daadwerkelijk werd verzorgd.

      7 De deelname van de instelling aan een experiment ziet slechts op het onderwijsaanbod dat in het voorgaande
      studiejaar daadwerkelijk werd verzorgd.

      8 Voor een experiment komt niet in aanmerking:

      a. een beroepsopleiding aan een instelling die naar oordeel van Onze Minister van onvoldoende kwaliteit is of ten
      aanzien waarvan toepassing is gegeven aan [artikel 6.1.4][ref1] of [artikel 6.1.5b, van de WEB][ref2],

      b. een leerweg waar de inspectie op grond van [artikel 23a1 van de WVO][ref3] van oordeel is dat de leerresultaten
      ernstig of langdurig tekortschieten, of

      c. een beroepsopleiding die onderdeel uitmaakt van het experiment in de zin van het
      [Besluit experiment beroepsopleiding gecombineerde leerwegen bol-bbl][ref4].

      9 Deelname is slechts mogelijk indien ten tijde van de aanvraag sprake is van een samenwerking tussen de school en
      de instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel6.1.4
