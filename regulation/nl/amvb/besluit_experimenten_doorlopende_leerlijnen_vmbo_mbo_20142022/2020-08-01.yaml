  - number: 6b
    text: |-
      1 In afwijking van [artikelen 6g, derde en vierde lid][ref1], en [6g1, eerste en tweede lid, van de WVO][ref2]
      en [artikel 7.2.7, vierde lid, eerste volzin][ref3], en onverminderd [artikel 8.1.1, derde lid, van de WEB][ref4]
      zorgen de bevoegde gezagsorganen ervoor dat het onderwijsprogramma van de vakmanschaproute of beroepsroute die
      eindigt met een beroepsopleiding in de beroepsbegeleidende leerweg, afhankelijk van de voorgeschreven studieduur,
      bedoeld in [artikel 6][ref5], voldoet aan het tweede lid, onderdeel a, b, c of d:

      2 Het onderwijsprogramma omvat bij een leerroute van:

      a. drie volledige studiejaren ten minste 2.850 klokuren, waarvan ten minste 2.200 begeleide onderwijsuren en ten
      minste 610 klokuren aan beroepspraktijkvorming;

      b. vier volledige studiejaren 3.700 klokuren, waarvan ten minste 2.400 begeleide onderwijsuren en ten minste 1.220
      klokuren aan beroepspraktijkvorming;

      c. vijf volledige studiejaren ten minste 4.550 klokuren, waarvan en minste 2.600 begeleide onderwijsuren en ten
      minste 1.830 klokuren aan beroepspraktijkvorming;

      d. zes volledige studiejaren ten minste 5.400 klokuren, waarvan ten minste 2.800 begeleide onderwijsuren en ten
      minste 2.300 klokuren aan beroepspraktijkvorming.


