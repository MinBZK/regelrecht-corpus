        artikel: '3'
  - number: '13'
    text: |-
      1 Indien Onze Minister een besluit neemt als bedoeld in [artikel 109a van de WVO][ref1] of
      [artikel 6.1.4 van de WEB][ref2], en ten aanzien van de daar bedoelde schoolsoorten, leerweg of beroepsopleiding
      een experiment loopt,

      a. trekt hij bij dat besluit tevens de toestemming voor het experiment in,

      b. wordt toepassing gegeven aan [artikel 11][ref3], en

      c. wordt het experiment terstond beëindigd.

      2 Indien het bevoegd gezag van de school of instelling het experiment voortijdig beëindigt, trekt Onze Minister op
      aanvraag of ambtshalve de toestemming voor het experiment in.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel109a
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel6.1.4
