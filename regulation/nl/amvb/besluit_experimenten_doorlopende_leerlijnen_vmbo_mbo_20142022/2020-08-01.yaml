  - number: '6'
    text: |-
      De bevoegde gezagsorganen richten het onderwijsprogramma van een experimentele leerroute in met
      inachtneming van de in de onderdelen a, b, c en d vermelde studieduur. In afwijking van de volledige
      cursus- en studieduur, genoemd in de [artikelen 9][ref1] en [10a van de WVO][ref2] respectievelijk
      [artikel 7.2.4a, derde lid, onderdelen b, c, en d, van de WEB][ref3], bedraagt de studieduur van een experimentele
      leerroute vanaf het derde leerjaar van het vmbo:

      a. voor een vakmanschaproute als bedoeld in [artikel 2, eerste lid, onderdeel a, subonderdeel 1][ref4], die opleidt
      tot een diploma basisberoepsopleiding ten minste drie en ten hoogste vier volledige studiejaren;

      b. voor een vakmanschaproute als bedoeld in [artikel 2, eerste lid, onderdeel a, subonderdeel 2][ref5], die opleidt
      tot een diploma vakopleiding ten minste vier en ten hoogste vijf volledige studiejaren;

      c. voor een beroepsroute die opleidt tot een diploma middenkaderopleiding ten minste vier en ten hoogste vijf
      volledige studiejaren, of

      d. voor een beroepsroute die opleidt tot een diploma middenkaderopleiding, waarbij sprake is van een verlengde
      middenkaderopleiding als bedoeld in [artikel 7.2.4a, vierde lid, van de WEB][ref6]: ten minste vijf en ten hoogste
      zes volledige studiejaren.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel10a
