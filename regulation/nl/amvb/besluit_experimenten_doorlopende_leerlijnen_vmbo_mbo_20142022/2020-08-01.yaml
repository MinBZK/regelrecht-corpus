    text: Het bevoegd gezag werkt mee aan de monitoring van de experimenten door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0033984/2020-08-01#Artikel14
  - number: '15'
    text: |-
      1 De experimenten starten met ingang van 1 augustus 2014 en eindigen met ingang van 1 augustus 2022.

      2 In afwijking van het eerste lid kunnen de experimenten houdende de vakmanschaproute, bedoeld in
      [artikel 2, eerste lid, onderdeel a, subonderdeel 2][ref1], en de beroepsroute, anders dan de technologieroute,
      starten met ingang van 1 augustus 2016.

      3 Indien op 1 mei 2022 geen voorstel van wet is ingediend als bedoeld in de
      [artikelen 118t, vierde lid, van de Wet op het voortgezet onderwijs][ref2] en
      [11a.1, vierde lid, van de Wet educatie en beroepsonderwijs][ref3] wordt voor wat betreft de leerlingen die dan nog
      in een doorlopende leerroute aanwezig zijn, toepassing gegeven aan [artikel 11][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0033984#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel118t
