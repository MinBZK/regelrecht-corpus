  - number: '1.2'
    text: |-
      In dit besluit wordt onder leerling als bedoeld in de [WVO][ref1] mede verstaan deelnemer als bedoeld in de
      [WEB][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002399
      [ref2]: https://wetten.overheid.nl/BWBR0007625
    url: https://wetten.overheid.nl/BWBR0033984/2014-08-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002399
      - id: ref2
        bwb_id: BWBR0007625
  - number: '2.1'
    text: 'De volgende experimenten worden ingericht:'
    url: https://wetten.overheid.nl/BWBR0033984/2014-08-01#Artikel2
  - number: 2.1.a
    text: |-
      het experiment houdende de vakmanschaproute, waarbij de leerling vanaf het derde leerjaar van het vmbo in de
      basisberoepsgerichte leerweg of de kaderberoepsgerichte leerweg, een leerroute volgt die opleidt tot een diploma
      basisberoepsopleiding.
    url: https://wetten.overheid.nl/BWBR0033984/2014-08-01#Artikel2
  - number: 2.1.b
    text: |-
      het experiment houdende de technologieroute, waarbij de leerling vanaf het derde leerjaar van het vmbo in de
      gemengde leerweg of de theoretische leerweg, een leerroute volgt die opleidt tot een diploma middenkaderopleiding.
    url: https://wetten.overheid.nl/BWBR0033984/2014-08-01#Artikel2
  - number: '2.2'
    text: |-
      Het doel van de experimenten, is te onderzoeken of door het afwijken van wat er in de [WVO][ref1] is geregeld
      betreffende de in het eerste lid bedoelde leerwegen en het inrichten van deze leerwegen als leerroute met een
      basisberoepsopleiding respectievelijk middenkaderopleiding:


      [ref1]: https://wetten.overheid.nl/BWBR0002399
    url: https://wetten.overheid.nl/BWBR0033984/2014-08-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002399
  - number: 2.2.1°
    text: |-
      de doorstroming van leerlingen van het voorbereidend beroepsonderwijs en het middelbaar algemeen voortgezet
      onderwijs naar het middelbaar beroepsonderwijs verbeterd kan worden,
    url: https://wetten.overheid.nl/BWBR0033984/2014-08-01#Artikel2
  - number: 2.2.2°
    text: meer leerlingen van de gemengde en theoretische leerweg kiezen voor een leerroute vmbo naar beroepsonderwijs,
    url: https://wetten.overheid.nl/BWBR0033984/2014-08-01#Artikel2
  - number: 2.2.3°
    text: de programmatische aansluiting van de leerwegen op het beroepsonderwijs verbeterd kan worden,
    url: https://wetten.overheid.nl/BWBR0033984/2014-08-01#Artikel2
  - number: 2.2.4°
    text: het onderwijsproces doelmatiger georganiseerd kan worden,
    url: https://wetten.overheid.nl/BWBR0033984/2014-08-01#Artikel2
  - number: 2.2.5°
    text: voor zover mogelijk de opleidingsduur kan worden verkort,
    url: https://wetten.overheid.nl/BWBR0033984/2014-08-01#Artikel2
  - number: 2.2.6°
    text: het aantal voortijdig schoolverlaters verder terug kan worden gedrongen, en
    url: https://wetten.overheid.nl/BWBR0033984/2014-08-01#Artikel2
  - number: 2.2.7°
    text: |-
      voor de technologieroute: een bijdrage wordt geleverd aan het tekort aan technisch opgeleide mensen op de
      arbeidsmarkt in de technieksector.
    url: https://wetten.overheid.nl/BWBR0033984/2014-08-01#Artikel2
  - number: '2.3'
    text: |-
      De artikelen uit de [WVO][ref1] en de [WEB][ref2] en de bij en krachtens deze wetten vastgestelde voorschriften
      zijn van toepassing op de experimenten tenzij bij dit besluit daarvan wordt afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0002399
      [ref2]: https://wetten.overheid.nl/BWBR0007625
    url: https://wetten.overheid.nl/BWBR0033984/2014-08-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002399
      - id: ref2
        bwb_id: BWBR0007625
  - number: '3.1'
    text: |-
      Het bevoegd gezag van een school en het bevoegd gezag van een instelling dienen gezamenlijk een aanvraag tot
      toestemming in bij Onze Minister om deel te nemen aan een experiment.
    url: https://wetten.overheid.nl/BWBR0033984/2014-08-01#Artikel3
  - number: '3.2'
    text: 'De aanvraag, bedoeld in het eerste lid, omvat:'
    url: https://wetten.overheid.nl/BWBR0033984/2014-08-01#Artikel3
  - number: 3.2.a
    text: een samenwerkingsovereenkomst tussen het bevoegd gezag van de school en het bevoegd gezag van de instelling,
    url: https://wetten.overheid.nl/BWBR0033984/2014-08-01#Artikel3
  - number: 3.2.b
    text: het advies van de medezeggenschapsraad van de deelnemende school,
    url: https://wetten.overheid.nl/BWBR0033984/2014-08-01#Artikel3
  - number: 3.2.c
    text: |-
      een door de deelnemende bevoegde gezagen ondertekend projectplan waarin wordt beschreven op welke wijze nadere
      invulling wordt gegeven aan het experiment,
    url: https://wetten.overheid.nl/BWBR0033984/2014-08-01#Artikel3
  - number: 3.2.d
    text: een organisatieplan waarin aangegeven is op welke wijze de samenwerking wordt georganiseerd, en
    url: https://wetten.overheid.nl/BWBR0033984/2014-08-01#Artikel3
  - number: 3.2.e
    text: de gezamenlijke visie en ambitie ten aanzien van een experiment.
    url: https://wetten.overheid.nl/BWBR0033984/2014-08-01#Artikel3
  - number: '3.3'
    text: In de aanvraag worden de sector of sectoren en een aanverwante opleidingsdomein genoemd.
    url: https://wetten.overheid.nl/BWBR0033984/2014-08-01#Artikel3
  - number: '3.4'
    text: De aanvraag kan slechts betrekking hebben op één experiment.
    url: https://wetten.overheid.nl/BWBR0033984/2014-08-01#Artikel3
  - number: '3.5'
    text: |-
      Indien sprake is van een aanvraag die ziet op het voorbereidend beroepsonderwijs en het middelbaar
      beroepsonderwijs, verzorgd door een agrarisch opleidingscentrum of een verticale scholengemeenschap wordt de
      aanvraag:
    url: https://wetten.overheid.nl/BWBR0033984/2014-08-01#Artikel3
  - number: 3.5.a
    text: ingediend door het bevoegd gezag van de instelling, en
    url: https://wetten.overheid.nl/BWBR0033984/2014-08-01#Artikel3
  - number: 3.5.b
    text: |-
      in afwijking van het tweede lid, onder a, ingediend met een interne regeling in plaats van een
      samenwerkingsovereenkomst.
    url: https://wetten.overheid.nl/BWBR0033984/2014-08-01#Artikel3
  - number: '3.6'
    text: |-
      De deelname van de school aan een experiment ziet slechts op het toegestane onderwijsaanbod dat in het voorgaande
      schooljaar daadwerkelijk werd verzorgd.
    url: https://wetten.overheid.nl/BWBR0033984/2014-08-01#Artikel3
  - number: '3.7'
    text: |-
      De deelname van de instelling aan een experiment ziet slechts op het onderwijsaanbod dat in het voorgaande
      studiejaar daadwerkelijk werd verzorgd.
    url: https://wetten.overheid.nl/BWBR0033984/2014-08-01#Artikel3
  - number: '3.8'
    text: 'Voor een experiment komt niet in aanmerking:'
    url: https://wetten.overheid.nl/BWBR0033984/2014-08-01#Artikel3
  - number: 3.8.a
    text: |-
      een beroepsopleiding aan een instelling die naar oordeel van Onze Minister van onvoldoende kwaliteit is of ten
      aanzien waarvan toepassing is gegeven aan [artikel 6.1.4][ref1] of [artikel 6.1.5b, van de WEB][ref2], of


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel6
    url: https://wetten.overheid.nl/BWBR0033984/2014-08-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '6'
  - number: 3.8.b
    text: |-
      een leerweg waar de inspectie op grond van [artikel 23a1 van de WVO][ref1] van oordeel is dat de leerresultaten
      ernstig of langdurig tekortschieten.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel23a1
    url: https://wetten.overheid.nl/BWBR0033984/2014-08-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 23a1
  - number: '3.9'
    text: |-
      Deelname is slechts mogelijk indien ten tijde van de aanvraag sprake is van een samenwerking tussen de school en
      de instelling.
    url: https://wetten.overheid.nl/BWBR0033984/2014-08-01#Artikel3
  - number: '4.1'
    text: |-
      In de samenwerkingsovereenkomst, bedoeld in [artikel 3, tweede lid, onder a][ref1], zijn in elk geval afspraken
      opgenomen over:


      [ref1]: https://wetten.overheid.nl/BWBR0033984#Artikel3
    url: https://wetten.overheid.nl/BWBR0033984/2014-08-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0033984
        artikel: '3'
  - number: 4.1.a
    text: het wederzijds gebruik van faciliteiten,
    url: https://wetten.overheid.nl/BWBR0033984/2014-08-01#Artikel4
  - number: 4.1.b
    text: |-
      de vorm van samenwerking, waaronder in ieder geval de inrichting van de bestuurlijke verantwoordelijkheid en de
      organisatorische alsmede onderwijskundige inrichting van het experiment,
    url: https://wetten.overheid.nl/BWBR0033984/2014-08-01#Artikel4
  - number: 4.1.c
    text: |-
      de inhoud van de terugvaloptie, bedoeld in [artikel 11][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0033984#Artikel11
    url: https://wetten.overheid.nl/BWBR0033984/2014-08-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0033984
        artikel: '11'
  - number: 4.1.d
    text: de wijze waarop klachten worden afgehandeld,
    url: https://wetten.overheid.nl/BWBR0033984/2014-08-01#Artikel4
  - number: 4.1.e
    text: 'indien het de vakmanschaproute betreft:'
    url: https://wetten.overheid.nl/BWBR0033984/2014-08-01#Artikel4
  - number: 4.1.e.1°
    text: in welk opleidingsdomein de vakmanschaproute wordt aangeboden, en
    url: https://wetten.overheid.nl/BWBR0033984/2014-08-01#Artikel4
  - number: 4.1.e.2°
    text: |-
      de selectie van kwalificaties die binnen het betreffende opleidingsdomein als uitkomst van het overleg met
      leerlingen, ouders en bedrijfsleven, wordt aangeboden,
    url: https://wetten.overheid.nl/BWBR0033984/2014-08-01#Artikel4
  - number: 4.1.f
    text: 'indien het de technologieroute betreft:'
    url: https://wetten.overheid.nl/BWBR0033984/2014-08-01#Artikel4
  - number: 4.1.f.1°
    text: in welk opleidingsdomein de technologieroute wordt aangeboden, en
    url: https://wetten.overheid.nl/BWBR0033984/2014-08-01#Artikel4
  - number: 4.1.f.2°
    text: |-
      de selectie van kwalificaties die binnen het betreffende opleidingsdomein als uitkomst van het overleg met
      leerlingen, ouders en bedrijfsleven, wordt aangeboden, en
    url: https://wetten.overheid.nl/BWBR0033984/2014-08-01#Artikel4
  - number: 4.1.g
    text: de wijze waarop het bedrijfsleven wordt betrokken bij de opzet van het experiment,
    url: https://wetten.overheid.nl/BWBR0033984/2014-08-01#Artikel4
  - number: 4.1.h
    text: |-
      in geval van overdracht van een deel van de bekostiging met toepassing van [artikel 10][ref1], de omvang en de
      bestemming van de over te dragen middelen.


      [ref1]: https://wetten.overheid.nl/BWBR0033984#Artikel10
    url: https://wetten.overheid.nl/BWBR0033984/2014-08-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0033984
        artikel: '10'
  - number: '4.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing op een interne regeling als bedoeld in
      [artikel 3, vijfde lid, onderdeel b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0033984#Artikel3
    url: https://wetten.overheid.nl/BWBR0033984/2014-08-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0033984
        artikel: '3'
  - number: '5.1'
    text: |-
      In de vakmanschaproute worden het derde en vierde leerjaar van de basisberoepsgerichte en de kaderberoepsgerichte
      leerweg in het vmbo, in afwijking van [artikel 10b, zevende lid, onderdeel a, van de WVO][ref1], en een
      basisberoepsopleiding met een aansluitend kwalificatiedossier als één programmatisch geheel aangeboden aan
      leerlingen van de basisberoepsgerichte en kaderberoepsgerichte leerweg op de locatie van deze school of van de
      instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10b
    url: https://wetten.overheid.nl/BWBR0033984/2014-08-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10b
  - number: '5.2'
    text: |-
      In afwijking van [artikel 10b, zevende lid, onder b, van de WVO][ref1], kan het onderwijs in de vakken en andere
      programmaonderdelen binnen de vakmanschaproute mede beroepsonderwijs in de basisberoepsopleiding omvatten.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10b
    url: https://wetten.overheid.nl/BWBR0033984/2014-08-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10b
  - number: '5.3'
    text: Het beroepsonderwijs in de vakmanschaproute wordt verzorgd onder verantwoordelijkheid van de instelling.
    url: https://wetten.overheid.nl/BWBR0033984/2014-08-01#Artikel5
  - number: '5.4'
    text: |-
      Bij de toepassing van [artikel 8.1.3 van de WEB][ref1] is in elk geval vastgelegd:


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8
    url: https://wetten.overheid.nl/BWBR0033984/2014-08-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '8'
  - number: 5.4.a
    text: het onderwijsprogramma van de vakmanschaproute met het daarbij behorende aantal uren onderwijstijd, en
    url: https://wetten.overheid.nl/BWBR0033984/2014-08-01#Artikel5
  - number: 5.4.b
    text: |-
      de wijze waarop uitvoering wordt gegeven aan de terugvaloptie, bedoeld in [artikel 11][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0033984#Artikel11
    url: https://wetten.overheid.nl/BWBR0033984/2014-08-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0033984
        artikel: '11'
  - number: '5.5'
    text: |-
      Ten aanzien van de in dit experiment deelnemende leerlingen jonger dan 16 jaar wordt onderwijs verzorgd met
      inachtneming van de volgende vereisten:
    url: https://wetten.overheid.nl/BWBR0033984/2014-08-01#Artikel5
  - number: 5.5.a
    text: |-
      het onderwijs wordt ingericht overeenkomstig de beroepsopleidende leerweg, bedoeld in
      [artikel 7.2.2, tweede lid, onder a, van de WEB][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0033984/2014-08-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
  - number: 5.5.b
    text: |-
      de beroepspraktijkvorming, bedoeld in de [artikelen 7.2.8][ref1] en [7.2.9 van de WEB][ref2], omvat uitsluitend het
      verrichten van lichte arbeid van geschikte aard.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0033984/2014-08-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '7'
  - number: '5.6'
    text: |-
      Resultaten door de leerling behaald onder de verantwoordelijkheid van het andere bevoegd gezag dan de school
      of instelling waar de leerling is ingeschreven, worden verwerkt op een wijze die aansluit bij de verwerking van
      resultaten op de school of instelling van het verantwoordelijke bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0033984/2014-08-01#Artikel5
  - number: '5.7'
    text: |-
      In aanvulling op [artikel 10b van de WVO][ref1] en [artikel 7.2.7 van de WEB][ref2] ontvangt de leerling gedurende
      het experiment adequate loopbaanoriëntatie en begeleiding.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10b
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0033984/2014-08-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10b
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '7'
  - number: '6.1'
    text: |-
      In de technologieroute worden het derde en vierde leerjaar van de gemengde of theoretische leerweg in afwijking
      van de [artikelen 10, zevende lid][ref1], en [10d, zevende lid, van de WVO][ref2], en een middenkaderopleiding
      met een aansluitend kwalificatiedossier als één programmatisch geheel aangeboden aan leerlingen van de gemengde en
      theoretische leerweg op de locatie van de school of van de instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel10d
    url: https://wetten.overheid.nl/BWBR0033984/2014-08-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 10d
  - number: '6.2'
    text: |-
      De technologieroute omvat, voor zover het betreft de gemengde leerweg, de sector techniek of landbouw, bedoeld in
      [artikel 10d, derde lid, onder a respectievelijk d, van de WVO][ref1], en beroepsopleidingen met een aansluitend
      kwalificatiedossier, bedoeld in [artikel 7.2.4, tweede lid, van de WEB][ref2], in het betreffende opleidingsdomein.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10d
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0033984/2014-08-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10d
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '7'
  - number: '6.3'
    text: |-
      Als extra vak als bedoeld in de [artikelen 10, negende lid][ref1], en [10d, negende lid, van de WVO][ref2], kan de
      technologieroute het vak informatietechnologie omvatten.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel10d
    url: https://wetten.overheid.nl/BWBR0033984/2014-08-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 10d
  - number: '6.4'
    text: |-
      In afwijking van de [artikelen 10][ref1] en [10d van de WVO][ref2], omvat het onderwijs binnen de technologieroute
      mede beroepsonderwijs in de middenkaderopleiding.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel10d
    url: https://wetten.overheid.nl/BWBR0033984/2014-08-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 10d
  - number: '6.5'
    text: |-
      [Artikel 5, derde tot en met zevende lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0033984#Artikel5
    url: https://wetten.overheid.nl/BWBR0033984/2014-08-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0033984
        artikel: '5'
  - number: '7.1'
    text: |-
      Het bevoegd gezag kan, in afwijking van de [artikelen 23, eerste lid, onderdelen b en c][ref1], en
      [24, eerste lid, onderdelen b en c, van het Eindexamenbesluit VO][ref2], besluiten vakken uit het sectordeel,
      bedoeld in artikel 10b, zesde lid, en het afdelingsvak, intrasectoraal of intersectoraal programma, geen onderdeel
      te laten zijn van het eindexamen.


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0004593#Artikel24
    url: https://wetten.overheid.nl/BWBR0033984/2014-08-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0004593
        artikel: '23'
      - id: ref2
        bwb_id: BWBR0004593
        artikel: '24'
  - number: '7.2'
    text: |-
      In afwijking van [artikel 37, tweede en derde lid][ref1], en
      [artikel 46, vierde en vijfde lid, van het Eindexamenbesluit VO][ref2] wordt het eindexamen, bedoeld in
      [artikelen 23][ref3] en [24 van het Eindexamenbesluit VO][ref4] afgerond:


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0004593#Artikel46
      [ref3]: https://wetten.overheid.nl/BWBR0004593#Artikel23
      [ref4]: https://wetten.overheid.nl/BWBR0004593#Artikel24
    url: https://wetten.overheid.nl/BWBR0033984/2014-08-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0004593
        artikel: '37'
      - id: ref2
        bwb_id: BWBR0004593
        artikel: '46'
      - id: ref3
        bwb_id: BWBR0004593
        artikel: '23'
      - id: ref4
        bwb_id: BWBR0004593
        artikel: '24'
  - number: 7.2.a
    text: voordat het examen van de basisberoepsopleiding is afgerond, en
    url: https://wetten.overheid.nl/BWBR0033984/2014-08-01#Artikel7
  - number: 7.2.b
    text: uiterlijk in het derde leerjaar van de vakmanschaproute.
    url: https://wetten.overheid.nl/BWBR0033984/2014-08-01#Artikel7
  - number: '7.3'
    text: |-
      Onverminderd [artikel 17 van het Examen- en kwalificatiebesluit beroepsopleidingen WEB][ref1], kan de kandidaat
      die niet is geslaagd voor het eindexamen vmbo in de basisberoepsgerichte of kaderberoepsgerichte leerweg, bedoeld
      in [artikelen 23][ref2], [24][ref3] en [49 van het Eindexamenbesluit VO][ref4], binnen de vakmanschaproute de
      basisberoepsopleiding alleen met goed gevolg afronden indien:


      [ref1]: https://wetten.overheid.nl/BWBR0027963#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0004593#Artikel23
      [ref3]: https://wetten.overheid.nl/BWBR0004593#Artikel24
      [ref4]: https://wetten.overheid.nl/BWBR0004593#Artikel49
    url: https://wetten.overheid.nl/BWBR0033984/2014-08-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0027963
        artikel: '17'
      - id: ref2
        bwb_id: BWBR0004593
        artikel: '23'
      - id: ref3
        bwb_id: BWBR0004593
        artikel: '24'
      - id: ref4
        bwb_id: BWBR0004593
        artikel: '49'
  - number: 7.3.a
    text: |-
      de vakken culturele en kunstzinnige vorming en lichamelijke opvoeding van het gemeenschappelijk deel, zijn
      beoordeeld als «voldoende» of «goed», en
    url: https://wetten.overheid.nl/BWBR0033984/2014-08-01#Artikel7
  - number: 7.3.b
    text: 'hij voor het eindexamen in:'
    url: https://wetten.overheid.nl/BWBR0033984/2014-08-01#Artikel7
  - number: 7.3.b.1°
    text: |-
      de vakken Nederlandse taal en Engelse taal het eindcijfer 5 of meer en het eindcijfer 6 of meer heeft behaald en
      hij voor de rekentoets het eindcijfer 6 of meer heeft behaald, of voor
    url: https://wetten.overheid.nl/BWBR0033984/2014-08-01#Artikel7
  - number: 7.3.b.2°
    text: |-
      de rekentoets als eindcijfer 5 heeft behaald en voor zowel de vakken Nederlandse taal en Engelse taal als
      eindcijfer 6 of meer heeft behaald.
    url: https://wetten.overheid.nl/BWBR0033984/2014-08-01#Artikel7
  - number: '7.4'
    text: |-
      Het bevoegd gezag reikt de leerling in elk geval een cijferlijst uit wanneer de kandidaat de rekentoets of een
      examen in een vak met goed gevolg heeft afgelegd. Een cijferlijst wordt verstrekt indien [artikel 11][ref1] van
      toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0033984#Artikel11
    url: https://wetten.overheid.nl/BWBR0033984/2014-08-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0033984
        artikel: '11'
  - number: '7.5'
    text: |-
      Leerlingen die het examen van de basisberoepsopleiding die onderdeel uitmaakt van de vakmanschaproute met goed
      gevolg afsluiten, ontvangen:
    url: https://wetten.overheid.nl/BWBR0033984/2014-08-01#Artikel7
  - number: 7.5.a
    text: |-
      een diploma van de basisberoepsopleiding als bedoeld in [artikel 7.4.6 van de WEB][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0033984/2014-08-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
  - number: 7.5.b
    text: |-
      indien het vierde lid van toepassing is: een cijferlijst van de vakken en de rekentoets waarin de leerling examen
      vmbo heeft gedaan.
    url: https://wetten.overheid.nl/BWBR0033984/2014-08-01#Artikel7
  - number: '8.1'
    text: |-
      In afwijking van [artikel 37, tweede en derde lid][ref1], en
      [artikel 46, vierde en vijfde lid, van het Eindexamenbesluit VO][ref2] wordt het eindexamen, bedoeld in
      [artikelen 22][ref3] en [25 van het Eindexamenbesluit VO][ref4] afgerond:


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0004593#Artikel46
      [ref3]: https://wetten.overheid.nl/BWBR0004593#Artikel22
      [ref4]: https://wetten.overheid.nl/BWBR0004593#Artikel25
    url: https://wetten.overheid.nl/BWBR0033984/2014-08-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004593
        artikel: '37'
      - id: ref2
        bwb_id: BWBR0004593
        artikel: '46'
      - id: ref3
        bwb_id: BWBR0004593
        artikel: '22'
      - id: ref4
        bwb_id: BWBR0004593
        artikel: '25'
  - number: 8.1.a
    text: voordat het examen van de basisberoepsopleiding is afgerond, en
    url: https://wetten.overheid.nl/BWBR0033984/2014-08-01#Artikel8
  - number: 8.1.b
    text: uiterlijk in het vierde leerjaar van de technologieroute.
    url: https://wetten.overheid.nl/BWBR0033984/2014-08-01#Artikel8
  - number: '8.2'
    text: |-
      Leerlingen die het examen van de middenkaderopleiding die onderdeel uitmaakt van de technologieroute
      met goed gevolg afsluiten, ontvangen een diploma van de middenkaderopleiding als bedoeld in
      [artikel 7.4.6 van de WEB][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0033984/2014-08-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
  - number: '9.1'
    text: |-
      Het bevoegd gezag maakt aan de leerling en de wettelijke vertegenwoordiger van de leerling voorafgaand aan de
      inschrijving kenbaar dat de leerling binnen een experiment wordt ingeschreven.
    url: https://wetten.overheid.nl/BWBR0033984/2014-08-01#Artikel9
  - number: '9.2'
    text: |-
      In afwijking van [artikel 8.1.1 van de WEB][ref1] wordt de leerling in de vakmanschaproute of de technologieroute
      ingeschreven bij de school. Deze inschrijving is voor een periode van ten hoogste twee jaar waarna het bevoegd
      gezag van de school ervoor zorg draagt dat de leerling wordt ingeschreven bij de instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8
    url: https://wetten.overheid.nl/BWBR0033984/2014-08-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '8'
  - number: '9.3'
    text: |-
      Indien een leerling zoveel eerder dan de termijn genoemd in het tweede lid het examen van het vmbo-gedeelte van het
      experiment met goed gevolg aflegt, vindt terstond inschrijving bij de instelling plaats.
    url: https://wetten.overheid.nl/BWBR0033984/2014-08-01#Artikel9
  - number: '10'
    text: |-
      Het bevoegd gezag kan in afwijking van [titel III, afdeling II, hoofdstuk I, van de WVO][ref1] en
      [artikel 2.2.1 van de WEB][ref2] met het bevoegd gezag waarmee het een samenwerkingsovereenkomst heeft gesloten
      als bedoeld in [artikel 3, tweede lid, onder a][ref3], overeenkomen om vanwege een experiment een deel van de
      bekostiging over te dragen aan het andere bevoegd gezag.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#HoofdstukI
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0033984#Artikel3
    url: https://wetten.overheid.nl/BWBR0033984/2014-08-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002399
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0033984
        artikel: '3'
  - number: '11'
    text: |-
      Indien een leerling de leerroute van het experiment niet met succes afrondt, wordt deze leerling in staat gesteld
      een diploma in de basisberoepsgerichte leerweg, kaderberoepsgerichte leerweg, gemengde leerweg of theoretische
      leerweg te behalen of het diploma van een entreeopleiding, een basisberoepsopleiding, een vakopleiding of een
      middenkaderopleiding als bedoeld in [artikel 7.2.2, eerste lid, van de WEB][ref1], passend bij het naar het oordeel
      van het betreffende bevoegd gezag bereikte onderwijsniveau en de leeftijd van deze leerling.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0033984/2014-08-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
  - number: '12'
    text: |-
      Indien het bevoegd gezag de toestemming van Onze Minister heeft verkregen, bedoeld in [artikel 3][ref1], kan
      bevoegd gezag in het maatschappelijk verkeer de aanduiding voeren van het experiment.


      [ref1]: https://wetten.overheid.nl/BWBR0033984#Artikel3
    url: https://wetten.overheid.nl/BWBR0033984/2014-08-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0033984
        artikel: '3'
  - number: '13.1'
    text: |-
      Indien Onze Minister een besluit neemt als bedoeld in [artikel 109a van de WVO][ref1] of
      [artikel 6.1.4 van de WEB][ref2], en ten aanzien van de daar bedoelde schoolsoorten, leerweg of beroepsopleiding
      een experiment loopt,


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel109a
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel6
    url: https://wetten.overheid.nl/BWBR0033984/2014-08-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 109a
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '6'
  - number: 13.1.a
    text: trekt hij bij dat besluit tevens de toestemming voor het experiment in,
    url: https://wetten.overheid.nl/BWBR0033984/2014-08-01#Artikel13
  - number: 13.1.b
    text: |-
      wordt toepassing gegeven aan [artikel 11][ref1], en


