        bwb_id: BWBR0004593
        artikel: '23'
      - id: ref4
        bwb_id: BWBR0004593
        artikel: '24'
  - number: 7.2.a
    text: voordat het examen van de basisberoepsopleiding is afgerond, en
    url: https://wetten.overheid.nl/BWBR0033984/2019-08-01#Artikel7
  - number: 7.2.b
    text: |-
      uiterlijk in het derde leerjaar van de vakmanschaproute die opleidt tot een diploma basisberoepsopleiding, bedoeld
      in [artikel 2, eerste lid, onderdeel a, subonderdeel 1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0033984#Artikel2
    url: https://wetten.overheid.nl/BWBR0033984/2019-08-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0033984
        artikel: '2'
  - number: '7.3'
    text: |-
      Onverminderd [artikel 17 van het Examen- en kwalificatiebesluit beroepsopleidingen WEB][ref1], kan de kandidaat
      die niet is geslaagd voor het eindexamen vmbo in de basisberoepsgerichte of kaderberoepsgerichte leerweg, bedoeld
      in [artikelen 23][ref2], [24][ref3] en [49 van het Eindexamenbesluit VO][ref4], binnen de vakmanschaproute de
      basisberoepsopleiding alleen met goed gevolg afronden indien:


      [ref1]: https://wetten.overheid.nl/BWBR0027963#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0004593#Artikel23
      [ref3]: https://wetten.overheid.nl/BWBR0004593#Artikel24
      [ref4]: https://wetten.overheid.nl/BWBR0004593#Artikel49
    url: https://wetten.overheid.nl/BWBR0033984/2019-08-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0027963
        artikel: '17'
      - id: ref2
        bwb_id: BWBR0004593
        artikel: '23'
      - id: ref3
        bwb_id: BWBR0004593
        artikel: '24'
      - id: ref4
        bwb_id: BWBR0004593
        artikel: '49'
  - number: 7.3.a
    text: |-
      het gekozen kunstvak en lichamelijke opvoeding zijn beoordeeld als «voldoende» of «goed», en voor het vak
      maatschappijleer als eindcijfer 6 of meer is behaald, en
    url: https://wetten.overheid.nl/BWBR0033984/2019-08-01#Artikel7
  - number: 7.3.b
    text: 'hij voor het eindexamen in:'
    url: https://wetten.overheid.nl/BWBR0033984/2019-08-01#Artikel7
  - number: 7.3.b.1°
    text: de vakken Nederlandse taal en Engelse taal ten minste een eindcijfer 5 en een eindcijfer 6 heeft behaald, en
    url: https://wetten.overheid.nl/BWBR0033984/2019-08-01#Artikel7
  - number: 7.3.b.2°
    text: de rekentoets heeft afgelegd.
    url: https://wetten.overheid.nl/BWBR0033984/2019-08-01#Artikel7
  - number: '7.4'
    text: |-
      Het bevoegd gezag reikt de leerling in elk geval een cijferlijst uit wanneer de kandidaat de rekentoets heeft
      afgelegd of een examen in een vak met goed gevolg heeft afgelegd. Een cijferlijst wordt verstrekt indien
      [artikel 11][ref1] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0033984#Artikel11
    url: https://wetten.overheid.nl/BWBR0033984/2019-08-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0033984
        artikel: '11'
  - number: '7.5'
    text: |-
      Leerlingen die het examen van de basisberoepsopleiding die onderdeel uitmaakt van de vakmanschaproute met goed
      gevolg afsluiten, ontvangen:
    url: https://wetten.overheid.nl/BWBR0033984/2019-08-01#Artikel7
  - number: 7.5.a
    text: |-
      een diploma van de basisberoepsopleiding als bedoeld in [artikel 7.4.6 van de WEB][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0033984/2019-08-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
  - number: 7.5.b
    text: |-
      indien het vierde lid van toepassing is: een cijferlijst van de vakken en de rekentoets waarin de leerling examen
      vmbo heeft gedaan.
    url: https://wetten.overheid.nl/BWBR0033984/2019-08-01#Artikel7
  - number: '8.1'
    text: |-
      In afwijking van [artikel 37, tweede en derde lid][ref1], en
      [artikel 46, vierde en vijfde lid, van het Eindexamenbesluit VO][ref2] wordt het eindexamen, bedoeld in
      [artikelen 22][ref3], [24][ref4] en [25 van het Eindexamenbesluit VO][ref5] afgerond:


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0004593#Artikel46
      [ref3]: https://wetten.overheid.nl/BWBR0004593#Artikel22
      [ref4]: https://wetten.overheid.nl/BWBR0004593#Artikel24
      [ref5]: https://wetten.overheid.nl/BWBR0004593#Artikel25
    url: https://wetten.overheid.nl/BWBR0033984/2019-08-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004593
        artikel: '37'
      - id: ref2
        bwb_id: BWBR0004593
        artikel: '46'
      - id: ref3
        bwb_id: BWBR0004593
        artikel: '22'
      - id: ref4
        bwb_id: BWBR0004593
        artikel: '24'
      - id: ref5
        bwb_id: BWBR0004593
        artikel: '25'
  - number: 8.1.a
    text: voordat het examen van de middenkaderopleiding is afgerond, en
    url: https://wetten.overheid.nl/BWBR0033984/2019-08-01#Artikel8
  - number: 8.1.b
    text: uiterlijk in het vierde leerjaar van de beroepsroute.
    url: https://wetten.overheid.nl/BWBR0033984/2019-08-01#Artikel8
  - number: '8.2'
    text: |-
      Leerlingen die het examen van de middenkaderopleiding die onderdeel uitmaakt van de beroepsroute met goed gevolg
      afsluiten, ontvangen een diploma van de middenkaderopleiding als bedoeld in [artikel 7.4.6 van de WEB][ref1]. Een
      cijferlijst wordt verstrekt indien [artikel 11][ref2] van toepassing is en indien de kandidaat de rekentoets heeft
      afgelegd of een examen in een vak met goed gevolg heeft afgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0033984#Artikel11
    url: https://wetten.overheid.nl/BWBR0033984/2019-08-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0033984
        artikel: '11'
  - number: '9.1'
    text: |-
      Het bevoegd gezag maakt aan de leerling en de wettelijke vertegenwoordiger van de leerling voorafgaand aan de
      inschrijving kenbaar dat de leerling binnen een experiment wordt ingeschreven.
    url: https://wetten.overheid.nl/BWBR0033984/2019-08-01#Artikel9
  - number: '9.2'
    text: |-
      In afwijking van [artikel 8.1.1 van de WEB][ref1] wordt de leerling in de vakmanschaproute of de beroepsroute
      ingeschreven bij de school. Deze inschrijving is voor een periode van ten hoogste twee jaar waarna het bevoegd
      gezag van de school ervoor zorg draagt dat de leerling wordt ingeschreven bij de instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8
    url: https://wetten.overheid.nl/BWBR0033984/2019-08-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '8'
  - number: '9.3'
    text: |-
      Indien een leerling zoveel eerder dan de termijn genoemd in het tweede lid het examen van het vmbo-gedeelte van het
      experiment met goed gevolg aflegt, vindt terstond inschrijving bij de instelling plaats.
    url: https://wetten.overheid.nl/BWBR0033984/2019-08-01#Artikel9
  - number: '10'
    text: |-
      Het bevoegd gezag kan in afwijking van [titel III, afdeling II, hoofdstuk I, van de WVO][ref1] en
      [artikel 2.2.1 van de WEB][ref2] met het bevoegd gezag waarmee het een samenwerkingsovereenkomst heeft gesloten
      als bedoeld in [artikel 3, tweede lid, onder a][ref3], overeenkomen om vanwege een experiment een deel van de
      bekostiging over te dragen aan het andere bevoegd gezag.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#HoofdstukI
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0033984#Artikel3
    url: https://wetten.overheid.nl/BWBR0033984/2019-08-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002399
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0033984
        artikel: '3'
  - number: '11'
    text: |-
      Indien een leerling de leerroute van het experiment niet met succes afrondt, wordt deze leerling in staat gesteld
      een diploma in de basisberoepsgerichte leerweg, kaderberoepsgerichte leerweg, gemengde leerweg of theoretische
      leerweg te behalen of het diploma van een entreeopleiding, een basisberoepsopleiding, een vakopleiding of een
      middenkaderopleiding als bedoeld in [artikel 7.2.2, eerste lid, van de WEB][ref1], passend bij het naar het oordeel
      van het betreffende bevoegd gezag bereikte onderwijsniveau en de leeftijd van deze leerling.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0033984/2019-08-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
  - number: '12'
    text: |-
      Indien het bevoegd gezag de toestemming van Onze Minister heeft verkregen, bedoeld in [artikel 3][ref1], kan
      bevoegd gezag in het maatschappelijk verkeer de aanduiding voeren van het experiment.


      [ref1]: https://wetten.overheid.nl/BWBR0033984#Artikel3
    url: https://wetten.overheid.nl/BWBR0033984/2019-08-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0033984
        artikel: '3'
  - number: '13.1'
    text: |-
      Indien Onze Minister een besluit neemt als bedoeld in [artikel 109a van de WVO][ref1] of
      [artikel 6.1.4 van de WEB][ref2], en ten aanzien van de daar bedoelde schoolsoorten, leerweg of beroepsopleiding
      een experiment loopt,


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel109a
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel6
    url: https://wetten.overheid.nl/BWBR0033984/2019-08-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 109a
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '6'
  - number: 13.1.a
    text: trekt hij bij dat besluit tevens de toestemming voor het experiment in,
    url: https://wetten.overheid.nl/BWBR0033984/2019-08-01#Artikel13
  - number: 13.1.b
    text: |-
      wordt toepassing gegeven aan [artikel 11][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0033984#Artikel11
    url: https://wetten.overheid.nl/BWBR0033984/2019-08-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0033984
        artikel: '11'
  - number: 13.1.c
    text: wordt het experiment terstond beëindigd.
    url: https://wetten.overheid.nl/BWBR0033984/2019-08-01#Artikel13
  - number: '13.2'
    text: |-
      Indien het bevoegd gezag van de school of instelling het experiment voortijdig beëindigt, trekt Onze Minister op
      aanvraag of ambtshalve de toestemming voor het experiment in.
    url: https://wetten.overheid.nl/BWBR0033984/2019-08-01#Artikel13
  - number: '14'
    text: Het bevoegd gezag werkt mee aan de monitoring van de experimenten door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0033984/2019-08-01#Artikel14
  - number: '15.1'
    text: De experimenten starten met ingang van 1 augustus 2014 en eindigen met ingang van 1 augustus 2022.
    url: https://wetten.overheid.nl/BWBR0033984/2019-08-01#Artikel15
  - number: '15.2'
    text: |-
      In afwijking van het eerste lid kunnen de experimenten houdende de vakmanschaproute, bedoeld in
      [artikel 2, eerste lid, onderdeel a, subonderdeel 2][ref1], en de beroepsroute, anders dan de technologieroute,
      starten met ingang van 1 augustus 2016.


      [ref1]: https://wetten.overheid.nl/BWBR0033984#Artikel2
    url: https://wetten.overheid.nl/BWBR0033984/2019-08-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0033984
        artikel: '2'
  - number: '15.3'
    text: |-
      Indien op 1 mei 2022 geen voorstel van wet is ingediend als bedoeld in de
      [artikelen 118t, vierde lid, van de Wet op het voortgezet onderwijs][ref1] en
      [11a.1, vierde lid, van de Wet educatie en beroepsonderwijs][ref2] wordt voor wat betreft de leerlingen die dan nog
      in een doorlopende leerroute aanwezig zijn, toepassing gegeven aan [artikel 11][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel118t
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel11a
      [ref3]: https://wetten.overheid.nl/BWBR0033984#Artikel11
    url: https://wetten.overheid.nl/BWBR0033984/2019-08-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 118t
      - id: ref2
        bwb_id: BWBR0007625
        artikel: 11a
      - id: ref3
        bwb_id: BWBR0033984
        artikel: '11'
  - number: '16'
    text: |-
      Onze Minister zendt in 2021 aan de Staten Generaal een verslag over de doeltreffendheid en de effecten van dit
      besluit in de praktijk gericht op de doelstellingen, bedoeld in [artikel 2, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0033984#Artikel2
    url: https://wetten.overheid.nl/BWBR0033984/2019-08-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0033984
        artikel: '2'
  - number: '17'
    text: Dit besluit treedt in werking op 1 januari 2014.
    url: https://wetten.overheid.nl/BWBR0033984/2019-08-01#Artikel17
  - number: '18'
    text: 'Dit besluit wordt aangehaald als: Besluit experimenten doorlopende leerlijnen vmbo-mbo 2014–2022.'
    url: https://wetten.overheid.nl/BWBR0033984/2019-08-01#Artikel18
