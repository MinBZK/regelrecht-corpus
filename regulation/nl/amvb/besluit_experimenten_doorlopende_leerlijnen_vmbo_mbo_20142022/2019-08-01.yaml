  - number: '1.2'
    text: |-
      In dit besluit wordt onder «leerling» mede verstaan «deelnemer» als bedoeld in de [WEB][ref1], wordt
      onder «studiejaar» als bedoeld in [artikel 1.1.1., onderdeel r, van de WEB][ref2], mede verstaan:
      «schooljaar» als bedoeld in de [WVO][ref3], en heeft het begrip «begeleide onderwijsuren» als bedoeld in
      [artikel 7.2.7, zesde lid, van de WEB][ref4] mede betrekking op onderwijstijd voor een leerling in het eerste en
      tweede studiejaar van een experimentele leerroute.


      [ref1]: https://wetten.overheid.nl/BWBR0007625
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0002399
      [ref4]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0033984/2019-08-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007625
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0002399
      - id: ref4
        bwb_id: BWBR0007625
        artikel: '7'
  - number: '2.1'
    text: |-
      De volgende experimenten worden ingericht als doorlopende leerlijn vanaf het derde leerjaar van het vmbo tot en met
      een diploma beroepsonderwijs:
    url: https://wetten.overheid.nl/BWBR0033984/2019-08-01#Artikel2
  - number: 2.1.a
    text: 'vakmanschaproute: voor de leerling die:'
    url: https://wetten.overheid.nl/BWBR0033984/2019-08-01#Artikel2
  - number: 2.1.a.1°
    text: |-
      start in de basisberoepsgerichte of kaderberoepsgerichte leerweg en die in een aanverwant opleidingsdomein in het
      beroepsonderwijs wordt opgeleid tot een diploma basisberoepsopleiding, of
    url: https://wetten.overheid.nl/BWBR0033984/2019-08-01#Artikel2
  - number: 2.1.a.2°
    text: |-
      start in de kaderberoepsgerichte leerweg en die in een aanverwant opleidingsdomein in het beroepsonderwijs wordt
      opgeleid tot een diploma vakopleiding;
    url: https://wetten.overheid.nl/BWBR0033984/2019-08-01#Artikel2
  - number: 2.1.b
    text: |-
      beroepsroute: voor de leerling die start in de kaderberoepsgerichte, gemengde of theoretische leerweg en die in een
      aanverwant opleidingsdomein in het beroepsonderwijs wordt opgeleid tot een diploma middenkaderopleiding.
    url: https://wetten.overheid.nl/BWBR0033984/2019-08-01#Artikel2
  - number: '2.2'
    text: |-
      Het doel van de experimenten is te onderzoeken of door het inrichten van doorlopende leerlijnen van vmbo naar
      mbo en daarbij af te wijken van hetgeen in de [WVO][ref1] is geregeld betreffende onderwijstijd en de inrichting
      van de leerwegen in het vmbo en af te wijken van hetgeen in de [WEB][ref2] is geregeld betreffende studieduur
      en inrichting van de beroepsopleidingen, waarbij de leerlijn doorloopt tot en met de afsluiting van een
      basisberoepsopleiding, vakopleiding of middenkaderopleiding:


      [ref1]: https://wetten.overheid.nl/BWBR0002399
      [ref2]: https://wetten.overheid.nl/BWBR0007625
    url: https://wetten.overheid.nl/BWBR0033984/2019-08-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002399
      - id: ref2
        bwb_id: BWBR0007625
  - number: 2.2.1°
    text: |-
      de doorstroming van leerlingen van het voorbereidend beroepsonderwijs en het middelbaar algemeen voortgezet
      onderwijs naar het middelbaar beroepsonderwijs verbeterd kan worden,
    url: https://wetten.overheid.nl/BWBR0033984/2019-08-01#Artikel2
  - number: 2.2.2°
    text: meer leerlingen van de gemengde en theoretische leerweg kiezen voor een leerroute vmbo naar beroepsonderwijs,
    url: https://wetten.overheid.nl/BWBR0033984/2019-08-01#Artikel2
  - number: 2.2.3°
    text: de programmatische aansluiting van de leerwegen op het beroepsonderwijs verbeterd kan worden,
    url: https://wetten.overheid.nl/BWBR0033984/2019-08-01#Artikel2
  - number: 2.2.4°
    text: het onderwijsproces doelmatiger georganiseerd kan worden,
    url: https://wetten.overheid.nl/BWBR0033984/2019-08-01#Artikel2
  - number: 2.2.5°
    text: voor zover mogelijk de opleidingsduur kan worden verkort,
    url: https://wetten.overheid.nl/BWBR0033984/2019-08-01#Artikel2
  - number: 2.2.6°
    text: het aantal voortijdig schoolverlaters verder terug kan worden gedrongen, en
    url: https://wetten.overheid.nl/BWBR0033984/2019-08-01#Artikel2
  - number: 2.2.7°
    text: |-
      de aansluiting van het beroepsonderwijs op de arbeidsmarkt kan worden verbeterd en voor de technologieroute: een
      bijdrage wordt geleverd aan het tekort aan technisch opgeleide mensen op de arbeidsmarkt in de technieksector.
    url: https://wetten.overheid.nl/BWBR0033984/2019-08-01#Artikel2
  - number: '2.3'
    text: |-
      De artikelen uit de [WVO][ref1] en de [WEB][ref2] en de bij en krachtens deze wetten vastgestelde voorschriften
      zijn van toepassing op de experimenten tenzij bij dit besluit daarvan wordt afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0002399
      [ref2]: https://wetten.overheid.nl/BWBR0007625
    url: https://wetten.overheid.nl/BWBR0033984/2019-08-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002399
      - id: ref2
        bwb_id: BWBR0007625
  - number: '3.1'
    text: |-
      Het bevoegd gezag van een school en het bevoegd gezag van een instelling dienen gezamenlijk een aanvraag tot
      toestemming in bij Onze Minister om deel te nemen aan een experiment. Beide gezagsorganen ondertekenen de aanvraag.
    url: https://wetten.overheid.nl/BWBR0033984/2019-08-01#Artikel3
  - number: '3.2'
    text: 'De aanvraag, bedoeld in het eerste lid, omvat:'
    url: https://wetten.overheid.nl/BWBR0033984/2019-08-01#Artikel3
  - number: 3.2.a
    text: een samenwerkingsovereenkomst tussen het bevoegd gezag van de school en het bevoegd gezag van de instelling,
    url: https://wetten.overheid.nl/BWBR0033984/2019-08-01#Artikel3
  - number: 3.2.b
    text: |-
      de adviezen van de medezeggenschapsraad van de school, alsmede van de deelnemersraad en ondernemingsraad van de
      instelling en in voorkomend geval van haar ouderraad omtrent de aanvraag, bedoeld in het eerste lid,
    url: https://wetten.overheid.nl/BWBR0033984/2019-08-01#Artikel3
  - number: 3.2.c
    text: 'een projectplan, dat ten minste beschrijft:'
    url: https://wetten.overheid.nl/BWBR0033984/2019-08-01#Artikel3
  - number: 3.2.c.1°
    text: de gezamenlijke visie en ambitie ten aanzien van het experiment, en
    url: https://wetten.overheid.nl/BWBR0033984/2019-08-01#Artikel3
  - number: 3.2.c.2°
    text: |-
      een zo concreet mogelijke uitwerking van het experiment, waaronder een organisatieplan waarin is beschreven op
      welke wijze de leerroute zal worden georganiseerd, alsmede hoe het onderwijs als één programmatisch geheel zal
      worden aangeboden.
    url: https://wetten.overheid.nl/BWBR0033984/2019-08-01#Artikel3
  - number: '3.3'
    text: |-
      In de aanvraag worden het profiel of de profielen en het aanverwante opleidingsdomein genoemd, waarop de leerroute
      betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0033984/2019-08-01#Artikel3
  - number: '3.4'
    text: |-
      De aanvraag kan slechts betrekking hebben op één experiment, met dien verstande dat meerdere aanvragen kunnen
      worden ingediend.
    url: https://wetten.overheid.nl/BWBR0033984/2019-08-01#Artikel3
  - number: '3.5'
    text: |-
      Indien sprake is van een aanvraag die ziet op het voorbereidend beroepsonderwijs en het middelbaar
      beroepsonderwijs, verzorgd door een agrarisch opleidingscentrum of een verticale scholengemeenschap wordt de
      aanvraag:
    url: https://wetten.overheid.nl/BWBR0033984/2019-08-01#Artikel3
  - number: 3.5.a
    text: ingediend door het bevoegd gezag van de instelling, en
    url: https://wetten.overheid.nl/BWBR0033984/2019-08-01#Artikel3
  - number: 3.5.b
    text: |-
      in afwijking van het tweede lid, onder a, ingediend met een interne regeling in plaats van een
      samenwerkingsovereenkomst.
    url: https://wetten.overheid.nl/BWBR0033984/2019-08-01#Artikel3
  - number: '3.6'
    text: |-
      De deelname van de school aan een experiment ziet slechts op het toegestane onderwijsaanbod dat in het voorgaande
      schooljaar daadwerkelijk werd verzorgd.
    url: https://wetten.overheid.nl/BWBR0033984/2019-08-01#Artikel3
  - number: '3.7'
    text: |-
      De deelname van de instelling aan een experiment ziet slechts op het onderwijsaanbod dat in het voorgaande
      studiejaar daadwerkelijk werd verzorgd.
    url: https://wetten.overheid.nl/BWBR0033984/2019-08-01#Artikel3
  - number: '3.8'
    text: 'Voor een experiment komt niet in aanmerking:'
    url: https://wetten.overheid.nl/BWBR0033984/2019-08-01#Artikel3
  - number: 3.8.a
    text: |-
      een beroepsopleiding aan een instelling die naar oordeel van Onze Minister van onvoldoende kwaliteit is of ten
      aanzien waarvan toepassing is gegeven aan [artikel 6.1.4][ref1] of [artikel 6.1.5b, van de WEB][ref2],


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel6
    url: https://wetten.overheid.nl/BWBR0033984/2019-08-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '6'
  - number: 3.8.b
    text: |-
      een leerweg waar de inspectie op grond van [artikel 23a1 van de WVO][ref1] van oordeel is dat de leerresultaten
      ernstig of langdurig tekortschieten, of


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel23a1
    url: https://wetten.overheid.nl/BWBR0033984/2019-08-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 23a1
  - number: 3.8.c
    text: |-
      een beroepsopleiding die onderdeel uitmaakt van het experiment in de zin van het
      [Besluit experiment beroepsopleiding gecombineerde leerwegen bol-bbl][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0036631
    url: https://wetten.overheid.nl/BWBR0033984/2019-08-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0036631
  - number: '3.9'
    text: |-
      Deelname is slechts mogelijk indien ten tijde van de aanvraag sprake is van een samenwerking tussen de school en
      de instelling.
    url: https://wetten.overheid.nl/BWBR0033984/2019-08-01#Artikel3
  - number: '4.1'
    text: |-
      In de samenwerkingsovereenkomst, bedoeld in [artikel 3, tweede lid, onder a][ref1], zijn in elk geval afspraken
      opgenomen over:


      [ref1]: https://wetten.overheid.nl/BWBR0033984#Artikel3
    url: https://wetten.overheid.nl/BWBR0033984/2019-08-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0033984
        artikel: '3'
  - number: 4.1.a
    text: het wederzijds gebruik van faciliteiten,
    url: https://wetten.overheid.nl/BWBR0033984/2019-08-01#Artikel4
  - number: 4.1.b
    text: |-
      de vorm van samenwerking, waaronder in ieder geval de inrichting van de bestuurlijke verantwoordelijkheid en de
      organisatorische alsmede onderwijskundige inrichting van het experiment,
    url: https://wetten.overheid.nl/BWBR0033984/2019-08-01#Artikel4
  - number: 4.1.c
    text: |-
      de inhoud van de terugvaloptie, bedoeld in [artikel 11][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0033984#Artikel11
    url: https://wetten.overheid.nl/BWBR0033984/2019-08-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0033984
        artikel: '11'
  - number: 4.1.d
    text: de wijze waarop klachten worden afgehandeld,
    url: https://wetten.overheid.nl/BWBR0033984/2019-08-01#Artikel4
  - number: 4.1.e
    text: het profiel en het aanverwant opleidingsdomein waarin het experiment wordt aangeboden,
    url: https://wetten.overheid.nl/BWBR0033984/2019-08-01#Artikel4
  - number: 4.1.f
    text: |-
      de wijze waarop het bedrijfsleven zal worden betrokken bij de selectie van kwalificaties die binnen het betreffende
      opleidingsdomein zullen worden aangeboden,
    url: https://wetten.overheid.nl/BWBR0033984/2019-08-01#Artikel4
  - number: 4.1.g
    text: de wijze waarop het bedrijfsleven overigens wordt betrokken bij de opzet van het experiment,
    url: https://wetten.overheid.nl/BWBR0033984/2019-08-01#Artikel4
  - number: 4.1.h
    text: |-
      in geval van overdracht van een deel van de bekostiging met toepassing van [artikel 10][ref1], de omvang en de
      bestemming van de over te dragen middelen.


      [ref1]: https://wetten.overheid.nl/BWBR0033984#Artikel10
    url: https://wetten.overheid.nl/BWBR0033984/2019-08-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0033984
        artikel: '10'
  - number: '4.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing op een interne regeling als bedoeld in
      [artikel 3, vijfde lid, onderdeel b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0033984#Artikel3
    url: https://wetten.overheid.nl/BWBR0033984/2019-08-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0033984
        artikel: '3'
  - number: '5.1'
    text: |-
      Een vakmanschaproute of beroepsroute wordt aangeboden als één programmatisch geheel voor de leerlingen op de
      locaties van de school en de instelling.
    url: https://wetten.overheid.nl/BWBR0033984/2019-08-01#Artikel5
  - number: '5.2'
    text: |-
      Bij de inrichting van het programmatisch geheel kan, afhankelijk van de leerweg in het vmbo die onderdeel uitmaakt
      van de experimentele leerroute, worden afgeweken van de [artikelen 10, zevende lid, onderdelen a en b][ref1],
      [10b, zesde lid, en zevende lid, onderdeel a][ref2], en [10d, zevende lid, onderdelen a, b en c, van de WVO][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel10b
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel10d
    url: https://wetten.overheid.nl/BWBR0033984/2019-08-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 10b
      - id: ref3
        bwb_id: BWBR0002399
        artikel: 10d
  - number: '5.3'
    text: |-
      De school of instelling waar de leerling is ingeschreven, is gedurende de experimentele leerroute verantwoordelijk
      voor die leerling en het vervullen van de bijbehorende wettelijke verplichtingen, met uitzondering van in ieder
      geval de volgende situaties:
    url: https://wetten.overheid.nl/BWBR0033984/2019-08-01#Artikel5
  - number: 5.3.a
    text: het afleggen van een examen bij of het verkrijgen van een diploma van de andere onderwijsinstelling,
    url: https://wetten.overheid.nl/BWBR0033984/2019-08-01#Artikel5
  - number: 5.3.b
    text: het volgen van onderwijs, verzorgd door de andere onderwijsinstelling op de locatie van die instelling.
    url: https://wetten.overheid.nl/BWBR0033984/2019-08-01#Artikel5
  - number: '5.4'
    text: |-
      Bij de toepassing van [artikel 8.1.3 van de WEB][ref1] is in elk geval vastgelegd:


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8
    url: https://wetten.overheid.nl/BWBR0033984/2019-08-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '8'
  - number: 5.4.a
    text: |-
      het onderwijsprogramma van de vakmanschaproute of beroepsroute met het daarbij behorende aantal uren onderwijstijd,
      en
    url: https://wetten.overheid.nl/BWBR0033984/2019-08-01#Artikel5
  - number: 5.4.b
    text: |-
      de wijze waarop uitvoering wordt gegeven aan de terugvaloptie, bedoeld in [artikel 11][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0033984#Artikel11
    url: https://wetten.overheid.nl/BWBR0033984/2019-08-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0033984
        artikel: '11'
  - number: '5.5'
    text: |-
      Ten aanzien van de in dit experiment deelnemende leerlingen jonger dan 16 jaar wordt onderwijs verzorgd met
      inachtneming van de volgende vereisten:
    url: https://wetten.overheid.nl/BWBR0033984/2019-08-01#Artikel5
  - number: 5.5.a
    text: |-
      het onderwijs wordt ingericht volgens het onderwijsprogramma, bedoeld in [artikel 6a][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0033984#Artikel6a
    url: https://wetten.overheid.nl/BWBR0033984/2019-08-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0033984
        artikel: 6a
  - number: 5.5.b
    text: |-
      de beroepspraktijkvorming, bedoeld in de [artikelen 7.2.8][ref1] en [7.2.9 van de WEB][ref2], omvat uitsluitend het
      verrichten van lichte arbeid van geschikte aard.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0033984/2019-08-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '7'
  - number: '5.6'
    text: |-
      Resultaten door de leerling behaald onder de verantwoordelijkheid van het andere bevoegd gezag dan de school
      of instelling waar de leerling is ingeschreven, worden verwerkt op een wijze die aansluit bij de verwerking van
      resultaten op de school of instelling van het verantwoordelijke bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0033984/2019-08-01#Artikel5
  - number: '5.7'
    text: |-
      In aanvulling op [artikelen 10][ref1], [10b][ref2] en [10d van de WVO][ref3] en [artikel 7.2.7 van de WEB][ref4]
      ontvangt de leerling gedurende het experiment adequate loopbaanoriëntatie en begeleiding.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel10b
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel10d
      [ref4]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0033984/2019-08-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 10b
      - id: ref3
        bwb_id: BWBR0002399
        artikel: 10d
      - id: ref4
        bwb_id: BWBR0007625
        artikel: '7'
  - number: '5.8'
    text: |-
      Als extra vak als bedoeld in [artikel 10b, negende lid, onderdeel d, van de WVO][ref1] kan de technologieroute het
      vak informatietechnologie omvatten.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10b
    url: https://wetten.overheid.nl/BWBR0033984/2019-08-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10b
  - number: '6'
    text: |-
      De bevoegde gezagsorganen richten het onderwijsprogramma van een experimentele leerroute in met
      inachtneming van de in de onderdelen a, b, c en d vermelde studieduur. In afwijking van de volledige
      cursus- en studieduur, genoemd in de [artikelen 9][ref1] en [10a van de WVO][ref2] respectievelijk
      [artikel 7.2.4a, derde lid, onderdelen b, c, en d, van de WEB][ref3], bedraagt de studieduur van een experimentele
      leerroute vanaf het derde leerjaar van het vmbo:


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel10a
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0033984/2019-08-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 10a
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '7'
  - number: 6.a
    text: |-
      voor een vakmanschaproute als bedoeld in [artikel 2, eerste lid, onderdeel a, subonderdeel 1][ref1], die opleidt
      tot een diploma basisberoepsopleiding ten minste drie en ten hoogste vier volledige studiejaren;


      [ref1]: https://wetten.overheid.nl/BWBR0033984#Artikel2
    url: https://wetten.overheid.nl/BWBR0033984/2019-08-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0033984
        artikel: '2'
  - number: 6.b
    text: |-
      voor een vakmanschaproute als bedoeld in [artikel 2, eerste lid, onderdeel a, subonderdeel 2][ref1], die opleidt
      tot een diploma vakopleiding ten minste vier en ten hoogste vijf volledige studiejaren;


      [ref1]: https://wetten.overheid.nl/BWBR0033984#Artikel2
    url: https://wetten.overheid.nl/BWBR0033984/2019-08-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0033984
        artikel: '2'
  - number: 6.c
    text: |-
      voor een beroepsroute die opleidt tot een diploma middenkaderopleiding ten minste vier en ten hoogste vijf
      volledige studiejaren, of
    url: https://wetten.overheid.nl/BWBR0033984/2019-08-01#Artikel6
  - number: 6.d
    text: |-
      voor een beroepsroute die opleidt tot een diploma middenkaderopleiding, waarbij sprake is van een verlengde
      middenkaderopleiding als bedoeld in [artikel 7.2.4a, vierde lid, van de WEB][ref1]: ten minste vijf en ten hoogste
      zes volledige studiejaren.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0033984/2019-08-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
  - number: 6a.1
    text: |-
      In afwijking van [artikelen 6g, derde en vierde lid][ref1], en [6g1, eerste en tweede lid, van de WVO][ref2]
      en [artikel 7.2.7, derde lid, onderdelen b, c en d, van de WEB][ref3], zorgen de bevoegde gezagsorganen ervoor
      dat het onderwijsprogramma van een vakmanschaproute of beroepsroute die eindigt met een beroepsopleiding in de
      beroepsopleidende leerweg, afhankelijk van de in [artikel 6][ref4] voorgeschreven studieduur, voldoet aan het
      tweede lid, onderdelen a, b, c of d.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel6g
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel6g1
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0033984#Artikel6
    url: https://wetten.overheid.nl/BWBR0033984/2019-08-01#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 6g
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 6g1
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '7'
      - id: ref4
        bwb_id: BWBR0033984
        artikel: '6'
  - number: 6a.2
    text: 'Het onderwijsprogramma omvat bij een leerroute van:'
    url: https://wetten.overheid.nl/BWBR0033984/2019-08-01#Artikel6a
  - number: 6a.2.a
    text: |-
      drie volledige studiejaren ten minste 3.000 klokuren, bestaande uit ten minste 2.400 begeleide onderwijsuren en ten
      minste 250 klokuren aan beroepspraktijkvorming;
    url: https://wetten.overheid.nl/BWBR0033984/2019-08-01#Artikel6a
  - number: 6a.2.b
    text: |-
      vier volledige studiejaren ten minste 4.000 klokuren, bestaande uit ten minste 2.950 begeleide onderwijsuren en ten
      minste 450 klokuren aan beroepspraktijkvorming;
    url: https://wetten.overheid.nl/BWBR0033984/2019-08-01#Artikel6a
  - number: 6a.2.c
    text: |-
      vijf volledige studiejaren ten minste 5.000 klokuren, bestaande uit ten minste 3.500 begeleide onderwijsuren en ten
      minste 900 klokuren aan beroepspraktijkvorming, of
    url: https://wetten.overheid.nl/BWBR0033984/2019-08-01#Artikel6a
  - number: 6a.2.d
    text: |-
      zes volledige studiejaren ten minste 6.000 klokuren, bestaande uit ten minste 4.050 begeleide onderwijsuren en ten
      minste 1.350 klokuren aan beroepspraktijkvorming.
    url: https://wetten.overheid.nl/BWBR0033984/2019-08-01#Artikel6a
  - number: 6b.1
    text: |-
      In afwijking van [artikelen 6g, derde en vierde lid][ref1], en [6g1, eerste en tweede lid, van de WVO][ref2] en
      [artikel 7.2.7, vierde lid, eerste volzin][ref3], en onverminderd [artikel 8.1.1, derde lid, van de WEB][ref4]
      zorgen de bevoegde gezagsorganen ervoor dat het onderwijsprogramma van de vakmanschaproute of beroepsroute die
      eindigt met een beroepsopleiding in de beroepsbegeleidende leerweg, afhankelijk van de voorgeschreven studieduur,
      bedoeld in [artikel 6][ref5], voldoet aan het tweede lid, onderdeel a, b, c of d:


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel6g
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel6g1
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0007625#Artikel8
      [ref5]: https://wetten.overheid.nl/BWBR0033984#Artikel6
    url: https://wetten.overheid.nl/BWBR0033984/2019-08-01#Artikel6b
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 6g
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 6g1
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '7'
      - id: ref4
        bwb_id: BWBR0007625
        artikel: '8'
      - id: ref5
        bwb_id: BWBR0033984
        artikel: '6'
  - number: 6b.2
    text: 'Het onderwijsprogramma omvat bij een leerroute van:'
    url: https://wetten.overheid.nl/BWBR0033984/2019-08-01#Artikel6b
  - number: 6b.2.a
    text: |-
      drie volledige studiejaren ten minste 2.850 klokuren, waarvan ten minste 2.200 begeleide onderwijsuren en ten
      minste 610 klokuren aan beroepspraktijkvorming;
    url: https://wetten.overheid.nl/BWBR0033984/2019-08-01#Artikel6b
  - number: 6b.2.b
    text: |-
      vier volledige studiejaren 3.700 klokuren, waarvan ten minste 2.400 begeleide onderwijsuren en ten minste 1.220
      klokuren aan beroepspraktijkvorming;
    url: https://wetten.overheid.nl/BWBR0033984/2019-08-01#Artikel6b
  - number: 6b.2.c
    text: |-
      vijf volledige studiejaren ten minste 4.550 klokuren, waarvan en minste 2.600 begeleide onderwijsuren en ten minste
      1.830 klokuren aan beroepspraktijkvorming;
    url: https://wetten.overheid.nl/BWBR0033984/2019-08-01#Artikel6b
  - number: 6b.2.d
    text: |-
      zes volledige studiejaren ten minste 5.400 klokuren, waarvan ten minste 2.800 begeleide onderwijsuren en ten minste
      2.300 klokuren aan beroepspraktijkvorming.
    url: https://wetten.overheid.nl/BWBR0033984/2019-08-01#Artikel6b
  - number: '7.1'
    text: |-
      Het bevoegd gezag kan uitsluitend voor wat betreft een vakmanschaproute die opleidt tot een diploma
      basisberoepsopleiding als bedoeld in [artikel 2, eerste lid, onderdeel a, subonderdeel 1][ref1],
      in afwijking van de [artikelen 23, eerste lid, onderdelen b en c][ref2], en
      [24, eerste lid, onderdelen b en c, van het Eindexamenbesluit VO][ref3], besluiten vakken uit het profieldeel,
      bedoeld in [artikel 10b, zesde lid, van de WVO][ref4] en beroepsgerichte keuzevakken als bedoeld in het zevende
      lid, onderdeel a, van dat artikel, geen onderdeel te laten zijn van het eindexamen.


      [ref1]: https://wetten.overheid.nl/BWBR0033984#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0004593#Artikel23
      [ref3]: https://wetten.overheid.nl/BWBR0004593#Artikel24
      [ref4]: https://wetten.overheid.nl/BWBR0002399#Artikel10b
    url: https://wetten.overheid.nl/BWBR0033984/2019-08-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0033984
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0004593
        artikel: '23'
      - id: ref3
        bwb_id: BWBR0004593
        artikel: '24'
      - id: ref4
        bwb_id: BWBR0002399
        artikel: 10b
  - number: '7.2'
    text: |-
      In afwijking van [artikel 37, tweede en derde lid][ref1], en
      [artikel 46, vierde en vijfde lid, van het Eindexamenbesluit VO][ref2] wordt ten minste het gemeenschappelijk deel
      van het eindexamen, bedoeld in [artikelen 23][ref3] en [24 van het Eindexamenbesluit VO][ref4] afgerond:


      [ref1]: https://wetten.overheid.nl/BWBR0004593#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0004593#Artikel46
      [ref3]: https://wetten.overheid.nl/BWBR0004593#Artikel23
      [ref4]: https://wetten.overheid.nl/BWBR0004593#Artikel24
    url: https://wetten.overheid.nl/BWBR0033984/2019-08-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0004593
        artikel: '37'
      - id: ref2
        bwb_id: BWBR0004593
        artikel: '46'
