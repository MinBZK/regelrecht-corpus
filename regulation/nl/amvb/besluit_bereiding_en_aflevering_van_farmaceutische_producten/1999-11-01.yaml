  - number: '32'
    text: |-
      1 Met betrekking tot elke ingevoerde hoeveelheid van een farmaceutisch product, verpakt uit één charge:

      a. moet aanwezig zijn een genummerd protocol van de bereiding van het farmaceutische product, opgesteld door degeen
      die het farmaceutische product heeft bereid, waaruit blijkt dat de bereiding is geschied overeenkomstig de in het
      register opgenomen bereidingswijze;

      b. moeten aanwezig zijn genummerde protocollen van de verrichte controles van de voor de bereiding van het
      farmaceutische product gebruikte bestanddelen en van het farmaceutische product, opgesteld door degeen die het
      farmaceutische product heeft bereid, waaruit blijkt dat de controles zijn verricht met gebruikmaking van de in het
      register opgenomen analyse- en andere controlemethodieken;

      c. moet door de importeur, met gebruikmaking van de desbetreffende in het register opgenomen analyse- en andere
      controlemethodieken, worden onderzocht of het farmaceutische product in kwalitatieve samenstelling en voor wat
      betreft de werkzame bestanddelen in kwantitatieve samenstelling overeenstemt met de in het register opgenomen
      samenstelling;

      d. moeten van het verrichten van de controles, bedoeld [onder ][ref1], genummerde protocollen worden bijgehouden,
      waaruit blijkt dat de controles zijn verricht met gebruikmaking van de in dat onderdeel bedoelde analyse- en andere
      controlemethodieken.

      2 In een in het eerste lid, onder *a*, bedoeld protocol moeten door degeen die het farmaceutische product heeft
      bereid voorts de volgende gegevens zijn vermeld:

      a. de benaming van het farmaceutische product;

      b. de kwalitatieve en kwantitatieve samenstelling van het farmaceutische product;

      c. de gebruikte hoeveelheden van de bestanddelen van het farmaceutische product;

      d. de nummers van de controleprotocollen, bedoeld in het eerste lid, onder b;

      e. de berekende en de verkregen grootte van de charge;

      f. de datum van aanvang en die van beëindiging van de bereiding van de charge.

      3 In een in het eerste lid, onder *b*, bedoeld protocol moeten door degeen die het farmaceutische product heeft
      bereid voorts de volgende gegevens zijn vermeld:

      a. in een onderzoekprotocol van het product de benaming van dat product;

      b. in een onderzoekprotocol van het product de kwalitatieve en kwantitatieve samenstelling van het product;

      c. in de onderzoekprotocollen van de voor de bereiding van het product gebruikte bestanddelen en de in het
      onderzoekprotocol van het product de datum van de verrichte controles, alsmede de verkregen uitkomsten van die
      controles;

      d. bij de onder *c* bedoelde uitkomsten, het woord "conform" of een term van gelijke strekking, ingeval de
      desbetreffende uitkomst de overeenstemming met het desbetreffende in het register opgenomen gegeven aantoont, dan
      wel "niet conform" of een term van gelijke strekking, ingeval de desbetreffende uitkomst die overeenstemming niet
      aantoont.

      4 In de in het eerste lid, onder *d,* bedoelde protocollen moeten eveneens de in het derde lid genoemde gegevens
      worden vermeld.

      5 De in het eerste lid bedoelde protocollen moeten zijn ondertekend door de persoon, onder wiens leiding en
      toezicht de desbetreffende werkzaamheden hebben plaatsgevonden.

      6 De in het eerste lid, onder *a* en *b*, bedoelde protocollen moeten worden gecontroleerd door een persoon bevoegd
      tot het verrichten van de in dat lid, onder *c*, bedoelde controles, en indien die protocollen voldoen aan de
      desbetreffende bepalingen van dit artikel, door die persoon voor akkoord worden getekend.


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel32
    url: https://wetten.overheid.nl/BWBR0003127/1999-11-01#Artikel32
