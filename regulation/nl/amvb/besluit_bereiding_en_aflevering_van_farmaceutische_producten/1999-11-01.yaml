        paragraaf: '2'
  - number: '49'
    text: |-
      De personen, bedoeld in artikel 2, van de wet, dragen zorg dat met betrekking tot hun bedrijf, voor wat betreft
      farmaceutische producten, wordt voldaan aan de bepalingen van deze paragraaf.
    url: https://wetten.overheid.nl/BWBR0003127/1999-11-01#Artikel49
  - number: '50'
    text: |-
      1 De verkoop van farmaceutische producten mag slechts geschieden in een daarvoor geheel of gedeeltelijk ingericht
      en voor het publiek toegankelijk verkooplokaal.

      2 Farmaceutische producten moeten in het verkooplokaal, duidelijk afgescheiden van andere artikelen, ordelijk,
      overzichtelijk en zindelijk zijn opgesteld en opgeborgen, op zodanige wijze, dat licht, vocht en warmte daarop
      geen schadelijke invloed kunnen uitoefenen. Onze Minister kan met betrekking tot de wijze van opberging nadere
      voorschriften geven.

      3 In een bij het verkooplokaal behorende etalage mogen voor wat betreft farmaceutische producten uitsluitend
      ledige verpakkingen worden geëtaleerd. Deze verpakkingen moeten duidelijk afgescheiden van andere artikelen zijn
      opgesteld.

      4 Farmaceutische producten, welke elders dan in het verkooplokaal ter aflevering in voorraad worden gehouden,
      moeten op deugdelijke, zindelijke en ordelijke wijze worden bewaard in daartoe bestemde lokalen.

      5 Farmaceutische producten, welke zich kennelijk niet meer in goede staat bevinden, mogen niet worden afgeleverd of
      ter aflevering in voorraad worden gehouden.

      6 Met betrekking tot de in- en verkoop van farmaceutische producten moet een administratie worden gevoerd, welke
      zo is ingericht dat daaruit duidelijk blijkt welke farmaceutische producten zijn ingekocht en verkocht, alsmede van
      welke leveranciers die farmaceutische producten zijn betrokken. Onze Minister kan ten aanzien van de inrichting van
      deze te voeren administratie nadere voorschriften geven.
    url: https://wetten.overheid.nl/BWBR0003127/1999-11-01#Artikel50
  - number: '51'
    text: |-
      Het is verboden farmaceutische producten in verkoopautomaten aanwezig te hebben dan wel in een systeem van
      zelfbediening te verkopen, af te leveren of ter aflevering in voorraad te hebben.
    url: https://wetten.overheid.nl/BWBR0003127/1999-11-01#Artikel51
  - number: '52'
    text: |-
      1 Het is verboden een farmaceutisch product af te leveren:

      a. in een andere verpakking dan die waarin het in de handel is gebracht;

      b. indien de in [artikel 14, eerste lid, onder ][ref1], bedoelde sluiting is beschadigd;

      c. waarvan de datum tot welke het farmaceutische product geschikt voor gebruik wordt geacht, is verstreken;

      d. indien de vermeldingen, bedoeld in [paragraaf 2][ref2] van het Besluit etikettering en bijsluiter farmaceutisch
      producten, onleesbaar zijn gemaakt, gewijzigd of aangevuld.

      2 Het eerste lid, onder *a*, geldt niet ten aanzien van apothekers en apotheekhoudende artsen, indien:

      a. het betreft farmaceutische producten, welke blijkens de verpakking waarin zij zich bevinden kennelijk niet
      bestemd zijn om in die verpakking aan particuliere verbruikers te worden afgeleverd;

      b. op een recept is vermeld dat de aflevering van een farmaceutisch product niet mag geschieden in de in dat lid,
      onder *a*, bedoelde verpakking;

      c. de op een recept voorgeschreven hoeveelheid van een farmaceutisch product afwijkt van die welke zich bevindt in
      een in dat lid, onder *a*, bedoelde verpakking.

      3 Het eerste lid, onder *b*, geldt niet indien een apotheker of apotheekhoudende arts de sluiting heeft verbroken
      ter controle van het farmaceutische product, mits hij daarna op de in het eerste lid, onder *a*, bedoelde
      verpakking een sluiting, voorzien van zijn naam, aanbrengt.

      4 Het eerste lid, onder *d*, geldt niet ten aanzien van apothekers en apotheekhoudende artsen die een farmaceutisch
      product op recept afleveren.


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0003127#Paragraaf2
    url: https://wetten.overheid.nl/BWBR0003127/1999-11-01#Artikel52
    references:
      - id: ref1
