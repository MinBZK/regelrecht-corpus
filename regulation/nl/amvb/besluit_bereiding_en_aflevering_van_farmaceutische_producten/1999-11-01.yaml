        artikel: '8'
        paragraaf: '2'
  - number: '63'
    text: |-
      [Artikel 2, eerste lid, onder ][ref1] van de wet is niet van toepassing ten aanzien van de in
      [artikel 1, eerste lid, onder ][ref2] van de wet bedoelde geneesmiddelen, met uitzondering van:

      a. samenstellingen van substanties in een farmaceutische vorm, andere dan die een bestanddeel vormen van
      een medisch hulpmiddel in de zin van de [Wet op de medische hulpmiddelen][ref3], dat niet bestemd is om die
      geneesmiddelen toe te dienen;

      b. substanties en samenstellingen van substanties ten aanzien waarvan de
      [artikelen 2, eerste lid, en 3 van de Opiumwet][ref4] (*Stb.* 1976, 425) van toepassing is;

      c. generatoren, kits en uitgangsstoffen die bestemd zijn te worden gebruikt bij de bereiding van radiofarmaceutica.


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003127#Artikel1
