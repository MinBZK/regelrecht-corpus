  - number: '18'
    text: Onze Minister is bevoegd met betrekking tot de bereiding van farmaceutische producten nadere regelen te stellen.
    url: https://wetten.overheid.nl/BWBR0003127/1999-11-01#Artikel18
  - number: '19'
    text: |-
      1 Een aanvraag ter verkrijging van een vergunning als bedoeld in [artikel 1, onder ][ref1], moet de volgende
      gegevens bevatten:

      a. de naam en het adres van de aanvrager, alsmede de voornamen van de aanvrager ingeval deze een natuurlijk persoon
      is;

      b. een opgave van de aard en de omvang van de bedrijfswerkzaamheden en van de uitrusting waarover de aanvrager in
      verband met die bedrijfswerkzaamheden zal beschikken;

      c. een opgave van de ligging van het perceel of de percelen, waarin [de onder ][ref2] bedoelde werkzaamheden
      zullen worden verricht, onder overlegging van een plattegrond van het perceel of de percelen, met vermelding van
      de bestemming der ruimten of lokalen en vergezeld van een nauwkeurige beschrijving van de lokalen, alsmede van de
      inrichting dier lokalen;

      d. de naam en het adres van de persoon of personen die met de direkte leiding en het toezicht op één of meer
      deelbewerkingen zullen worden belast, onder aanduiding van de wetenschappelijke of technische kwalifikatie van
      die personen.

      2 Indien door de aanvrager in opdracht en ten behoeve van een ander charges van een farmaceutisch product of
      farmaceutische producten zullen worden bereid, moeten in plaats van de in het eerste lid, onder *d,* bedoelde
      opgave, de gegevens bedoeld in [artikel 2, leden 1, onder ][ref3] worden verstrekt.

      3 Bij een aanvraag moet worden overgelegd:

      a. een uittreksel uit het handelsregister, en

      b. in geval de aanvrager een rechtspersoon is, de statuten van die rechtspersoon.

      4 Een vergunning als bedoeld in [artikel 1, onder ][ref4] is niet vereist voor de fabrikant aan wie door de
      hoofdinspecteur toestemming is verleend om in opdracht en ten behoeve van een ander één of meer deelbewerkingen van
      de bereiding van een farmaceutisch product te verrichten of een farmaceutisch product te bereiden.

      5 [Artikel 2, zesde lid][ref5], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0003127#Artikel19
