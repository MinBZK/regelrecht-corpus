  - number: '15'
    text: |-
      Farmaceutische producten, welke ter aflevering in voorraad worden gehouden, moeten op deugdelijke, zindelijke en
      ordelijke wijze worden bewaard in daartoe bestemde lokalen.
    url: https://wetten.overheid.nl/BWBR0003127/1999-11-01#Artikel15
  - number: '16'
    text: |-
      1 Farmaceutische producten, ten aanzien waarvan [artikel 4, eerste of derde lid, van de wet][ref1] niet van
      toepassing is, mogen, behalve aan de in [artikel 2, eerste lid, onder d , van de wet][ref2] bedoelde categorieën
      van personen en aan ziekenhuizen, eveneens worden afgeleverd:

      a. aan tandartsen die van hun bevoegdheid tot uitoefening van de tandheelkunst gebruik mogen maken, voor zover het
      betreft farmaceutische producten die in de uitoefening van hun beroep worden gebruikt;

      b. aan het College ter beoordeling van geneesmiddelen, genoemd in [artikel 29, eerste lid, van de wet][ref3];

      c. met uitzondering van farmaceutische producten als monster, aan overheidsinstellingen, welke farmaceutische
      producten in voorraad moeten hebben in het belang van de zorg voor de volksgezondheid in geval van oorlog,
      oorlogsgevaar, daaraan verwante of daarmede verband houdende buitengewone omstandigheden;

      d. met uitzondering van farmaceutische producten als monster, aan:

      1°. personen of instellingen, uitsluitend ten behoeve van wetenschappelijk onderzoek,

      2°. instellingen, uitsluitend ten behoeve van het onderwijs in de farmacie,

      3°. diensten als bedoeld in [artikel 14, derde lid, van de Arbeidsomstandighedenwet 1998][ref4] en de Rijks
      Bedrijfsgezondheids- en Bedrijfsveiligheidsdienst.

      e. uitsluitend als monster aan artsen en verloskundigen die praktijk uitoefenen;

      f. aan de Organisatie voor het Verbod van Chemische Wapens.

      2 De in het eerste lid, onder *d,* bedoelde toestemming kan worden verleend onder beperkingen; aan de toestemming
      kunnen voorschriften worden verbonden.

      3 Aan verloskundigen mogen slechts monsters van farmaceutische producten worden afgeleverd, welke in de uitoefening
      van haar beroep worden gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0002290#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0002290#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0002290#Artikel29
      [ref4]: https://wetten.overheid.nl/BWBR0010346#Artikel14
