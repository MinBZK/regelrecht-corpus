  - number: '42'
    text: |-
      1 Een aanvraag ter verkrijging van een vergunning als bedoeld in [artikel 1, onder ][ref1], moet de volgende
      gegevens bevatten:

      a. de naam en het adres van de aanvrager, alsmede de voornamen van de aanvrager in geval deze een natuurlijk
      persoon is;

      b. de naam en het adres van de persoon, bedoeld in [artikel 45, eerste lid][ref2];

      c. een opgave van:

      1°. de farmaceutische producten welke uit een lid-staat zullen worden betrokken onder vermelding van de naam
      van die lid-staat en van de naam en het adres van degeen die in die lid-staat voor het in de handel brengen
      verantwoordelijk is;

      2°. de farmaceutische vormen van [de onder 1°][ref3] bedoelde farmaceutische producten;

      d. een opgave van:

      1°. de ligging van het perceel of de percelen, waarin de farmaceutische producten zullen worden verpakt en de
      verpakkingen geëtiketteerd onderscheidenlijk de farmaceutische producten ter aflevering in voorraad zullen worden
      gehouden, een en ander onder overlegging van een plattegrond van het perceel of de percelen, met vermelding van
      de bestemming der ruimten of lokalen en vergezeld van een nauwkeurige beschrijving van de lokalen, alsmede van de
      inrichting dier lokalen;

      2°. de uitrusting waarover de aanvrager in verband met het verpakken en etiketteren zal beschikken.

      2 Indien de aanvrager voornemens is de in [artikel 45 eerste lid][ref4], bedoelde verrichtingen te doen geschieden
      onder leiding en toezicht van een persoon als bedoeld in het tweede lid van dat artikel, moet de aanvraag de
      redenen daartoe bevatten.

      3 Bij een aanvraag moet worden overgelegd:

      a. een uittreksel uit het handelsregister, en

      b. in geval de aanvrager een rechtspersoon is, de statuten van die rechtspersoon.

      4 [Artikel 2, zesde lid][ref5], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0003127#Artikel45
      [ref3]: https://wetten.overheid.nl/BWBR0003127#Artikel42
      [ref4]: https://wetten.overheid.nl/BWBR0003127#Artikel45
      [ref5]: https://wetten.overheid.nl/BWBR0003127#Artikel2
    url: https://wetten.overheid.nl/BWBR0003127/1999-11-01#Artikel42
