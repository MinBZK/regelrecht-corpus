  - number: '28'
    text: |-
      1 Van de in [de artikelen 25][ref1] en [26][ref2] bedoelde verrichtingen moet voor elk kalenderjaar een register
      worden bijgehouden, inhoudende:

      a. de naam en het adres van de opdrachtgever;

      b. een opgave van hetgeen ten behoeve van [de onder ][ref3] bedoelde opdrachtgever is verricht;

      c. de nummers van de in [artikel 25][ref4] bedoelde protocollen welke op die verrichtingen betrekking hebben;

      d. de datum van aanvang en die van beëindiging van [de onder ][ref5] bedoelde verrichting.

      2 Een in het eerste lid bedoeld register moet gedurende twee jaren na het kalenderjaar waarop het register
      betrekking heeft worden bewaard en gedurende de termijn van bewaring ter beschikking worden gehouden van de
      personen, bedoeld in [artikel 33, eerste lid][ref6], van de wet.


