        artikel: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0003127
        artikel: '3'
        paragraaf: '2'
  - number: '55'
    text: |-
      1 Aflevering van zich nog in het stadium van proefneming bevindende ongeregistreerde farmaceutische producten,
      andere dan bedoeld in het derde lid, mag slechts geschieden indien door degeen die aflevert aan het tweede lid
      wordt voldaan.

      2 Een aflevering mag niet geschieden alvorens de hoofdinspecteur in kennis is gesteld van:

      a. de naam en het adres van de persoon aan wie het farmaceutische product zal worden afgeleverd;

      b. de kwalitatieve en kwantitatieve samenstelling van het farmaceutische product of, indien dit niet mogelijk is,
      van de gebruikte grondstoffen en de bewerkingen welke deze hebben ondergaan, een en ander onder aanwijzing van de
      werkzame bestanddelen;

      c. de verwachte werking van het farmaceutische product;

      d. de eventuele bijwerkingen en contra-indicaties van het farmaceutische product.

      3 De aflevering van zich nog in het stadium van proefneming bevindende ongeregistreerde farmaceutische producten
      ten behoeve van het verrichten van onderzoekingen aan de mens, mag slechts geschieden indien door degene die
      aflevert aan de navolgende bepalingen van dit artikel wordt voldaan.

      4 De betrokken apotheker, dan wel de fabrikant of importeur, moet er zicht van vergewissen dat:

      a. het ontwerp, de uitvoering en de rapportage van alle fasen van het klinische onderzoek, met inbegrip van het
      onderzoek naar de biologische beschikbaarheid en de biologische equivalentie, in overeenstemming met de beginselen
      van "Good Clinical Practice" geschieden;

      b. al het klinische onderzoek in overeenstemming met de in de huidige herziening van de Verklaring van Helsinki
      vastgelegde ethische beginselen wordt uitgevoerd, waarbij als regel elke proefpersoon, na te zijn voorgelicht, uit
      vrije wil toestemming heeft gegeven, welke toestemming is vastgelegd;

      c. bij het onderzoek rekening wordt gehouden met het Richtsnoer inzake Good Clinical Practice voor het onderzoek
      met geneesmiddelen in de Europese Gemeenschap waarvan de Nederlandse vertaling is geplaatst in de Staatscourant van
      11 februari 1988, nr. 28.

      d. het protocol, de procedures, met inbegrip van de statistische opzet, en de documentatie van het onderzoek door
      de opdrachtgever of de onderzoeker voor advies zijn voorgelegd aan de desbetreffende medisch-ethische commissie;

      e. het onderzoek niet begint, voordat het schriftelijke advies van deze commissie is ontvangen;

      f. er vooraf vastgestelde, systematisch schriftelijk vastgelegde procedures zijn voor de organisatie, de
      uitvoering, de verzameling van de gegevens, de documentatie en de verificatie bij klinisch onderzoek;

      g. in het geval van radiofarmaceutica, klinisch onderzoek wordt uitgevoerd onder verantwoordelijkheid van een arts
      met een vergunning voor het gebruik van radionucliden voor medische doeleinden.

      5 De betrokken apotheker, dan wel de fabrikant of importeur, moet voorzieningen treffen voor de archivering van
      documentatie, een en ander overeenkomstig het volgende:

      a. de onderzoeker zorgt ervoor dat de identificatiecodes van de patiënt gedurende ten minste vijftien jaar na de
      voltooiing of stopzetting van het onderzoek worden bewaard;

      b. patiëntenbestanden en andere brongegevens worden bewaard gedurende de maximale periode die in het ziekenhuis, de
      instelling of de particuliere praktijk wordt toegestaan;

      c. de opdrachtgever of andere eigenaar van de gegevens bewaart alle andere documentatie over het onderzoek zolang
      het product in de handel is;

      d. het eindrapport wordt door de opdrachtgever of de latere eigenaar gedurende vijf jaar nadat het product niet
      meer in de handel is, bewaard.

      6 Het in het zesde lid, sub *c*, bepaalde geldt voor:

      a. het protocol, met inbegrip van de beweegredenen, de doelstellingen en de statistische opzet en methodologie van
      het onderzoek, alsmede de omstandigheden waaronder het is uitgevoerd en beheerd, en bijzonderheden omtrent het voor
      het onderzoek gebruikte product, het farmaceutische product dat als referentie werd gebruikt of de placebo;

      b. de standaard-werkvoorschriften;

      c. alle schriftelijke adviezen over het protocol en de procedures;

      d. het onderzoekersdossier;

      e. statussen voor alle proefpersonen;

      f. het eindrapport;

      g. indien beschikbaar, het audit-certificaat (de audit-certificaten).

      7 Elke verandering in het eigendomsrecht van de gegevens moet worden gedocumenteerd. Alle gegevens en
      documenten moeten op verzoek ter beschikking van het College ter beoordeling van geneesmiddelen, genoemd in
      [artikel 29, eerste lid][ref1], van de wet worden gesteld.

      8 Degene die het farmaceutisch product heeft afgeleverd, draagt er zorg voor dat alle documenten die met het
      onderzoek samenhangen ter beschikking worden gehouden van de hoofdinspecteur.

      9 Op de verpakking waarin het farmaceutisch product wordt afgeleverd moet, tenzij het dubbelblind of een
      soortgelijk onderzoek betreft, duidelijk leesbaar:

      a. een zo nauwkeurig mogelijke omschrijving van de kwalitatieve en kwantitatieve samenstelling van het betrokken
      farmaceutisch product worden gegeven;

      b. zijn vermeld dat het betrokken farmaceutisch product zich nog in het stadium van proefneming bevindt.


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel29
    url: https://wetten.overheid.nl/BWBR0003127/1999-11-01#Artikel55
    references:
      - id: ref1
