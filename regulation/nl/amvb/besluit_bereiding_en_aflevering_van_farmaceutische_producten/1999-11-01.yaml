  - number: '9'
    text: |-
      1 Een in [artikel 8, eerste lid, onder ][ref1], bedoeld protocol moet voorts de volgende gegevens bevatten:

      a. de benaming van het farmaceutische product;

      b. de kwalitatieve en kwantitatieve samenstelling van het farmaceutische product;

      c. de gebruikte hoeveelheden van de bestanddelen van het farmaceutische product;

      d. de nummers van de controleprotocollen, bedoeld [onder ][ref2], van genoemd artikellid;

      e. de berekende en de verkregen grootte van de charge;

      f. de datum van aanvang en die van beëindiging van de bereiding van de charge;

      g. indien een deelbewerking of een onderdeel van de bereiding van een charge als bedoeld in
      [artikel 23, eerste lid][ref3], is verricht door een loonfabrikant:

      1°. de vermelding van de deelbewerking onderscheidenlijk van het onderdeel van de bereiding van een charge;

      2°. de nummers van de in [artikel 25, eerste onderscheidenlijk derde lid][ref4], bedoelde protocollen;

      3°. de naam en het adres van de loonfabrikant;

      h. indien een deelbewerking of een onderdeel van de bereiding van een charge als bedoeld in
      [artikel 25, eerste lid][ref5], is verricht door een in het buitenland gevestigde tot het bereiden van
      farmaceutische producten bevoegde persoon:

      1°. de vermelding van de deelbewerking onderscheidenlijk van het onderdeel van de bereiding van een charge;

      2°. de nummers van de in [artikel 25, eerste onderscheidenlijk derde lid][ref6], bedoelde protocollen;

      3°. de naam en het adres van de in het buitenland gevestigde persoon, die de desbetreffende werkzaamheden heeft
      verricht.

      2 In een in [artikel 8, tweede lid, onder ][ref7], bedoeld protocol moeten door de in dat artikelonderdeel
      bedoelde persoon eveneens zijn vermeld de gegevens, bedoeld in het eerste lid, onder *a-c, e* en *f*, alsmede de
      nummers van de controleprotocollen, betrekking hebbende op de controles van de bestanddelen van het farmaceutische
      product. Door de fabrikant moeten in het protocol, bedoeld in de eerste volzin, worden vermeld de nummers van de
      controleprotocollen, bedoeld in [artikel 8, tweede lid, onder ][ref8].

      3 De in [artikel 8, eerste lid, onder ][ref9], bedoelde protocollen moeten voorts de volgende gegevens bevatten:

      a. voor wat betreft een onderzoekprotocol van een bestanddeel van het farmaceutische product, de naam en het adres
      van de leverancier van dat bestanddeel;

      b. de datum van de verrichte controles, alsmede de verkregen uitkomsten van die controles;

      c. bij de onder *b* bedoelde uitkomsten, het woord "conform" of een term van gelijke strekking, ingeval de
      desbetreffende uitkomst de overeenstemming met het desbetreffende in het register opgenomen gegeven aantoont, dan
      wel "niet conform" of een term van gelijke strekking, ingeval de desbetreffende uitkomst die overeenstemming niet
      aantoont.

      4 In de in [artikel 8, tweede lid, onder ][ref10], bedoelde protocollen moeten door degeen die het farmaceutische
      product in het buitenland heeft bereid eveneens de in het derde lid, onder *b* en *c*, bedoelde gegevens zijn
      vermeld. In de in artikel 8, tweede lid, onder *d*, onderscheidenlijk derde lid, onder *b*, bedoelde protocollen
      moeten door de fabrikant eveneens de in het derde lid, onder *b* en *c*, bedoelde gegevens worden vermeld.

      5 De in [artikel 8][ref11] bedoelde protocollen moeten zijn ondertekend door de persoon, onder wiens leiding en
      toezicht de desbetreffende werkzaamheden hebben plaatsgevonden.


