  - number: '64'
    text: |-
      Het Besluit verpakte geneesmiddelen (*Stb.* 1963, 336) en het [Besluit aanvraag vergunningen geneesmiddelen 1972]
      (onbekend) (*Stb.* 1972, 144) worden ingetrokken.
