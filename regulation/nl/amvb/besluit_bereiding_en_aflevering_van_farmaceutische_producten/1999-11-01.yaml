  - number: '43'
    text: De parallel-groothandelaar draagt zorg dat wordt voldaan aan de bepalingen van deze paragraaf.
    url: https://wetten.overheid.nl/BWBR0003127/1999-11-01#Artikel43
  - number: '44'
    text: |-
      Wijzigingen in de gegevens welke ingevolge [artikel 42, eerste lid onder ][ref1], voor wat betreft de inrichting
      van het perceel of de percelen, en 2°, zijn verstrekt, moeten voor het eind van het kalenderjaar waarin de
      wijziging heeft plaatsgevonden ter kennis worden gebracht van Onze Minister en van de hoofdinspecteur. Van elke
      andere wijziging in de gegevens welke ingevolge [artikel 42][ref2] zijn verstrekt, moet onverwijld kennis worden
      gegeven aan Onze Minister en de hoofdinspecteur.


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0003127#Artikel42
    url: https://wetten.overheid.nl/BWBR0003127/1999-11-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0003127
        artikel: '42'
        paragraaf: '7'
      - id: ref2
        bwb_id: BWBR0003127
        artikel: '42'
        paragraaf: '7'
  - number: '45'
    text: |-
      1 De noodzakelijke verrichtingen met betrekking tot het verpakken en etiketteren van verpakkingen van de ingevoerde
      farmaceutische producten, alsmede het verrichten van de in [artikel 47, eerste lid][ref1], bedoelde controles
      met het verrichten waarvan de hoofdinspecteur ingevolge dat artikellid akkoord is gegaan, moeten geschieden onder
      leiding en toezicht van een apotheker, die van zijn bevoegdheid tot uitoefening der artsenijbereidkunst gebruik mag
      maken en die voldoet aan de eisen, vervat in artikel 23 van de E.E.G.-richtlijn no. 75/319/EEG.

      2 Onze Minister kan toestaan dat de in het eerste lid bedoelde verrichtingen geschieden onder leiding en
      toezicht van een persoon, die ten minste twee jaar direkt betrokken is geweest bij de industriële bereiding van
      farmaceutische producten, en een met het oog op de in het eerste lid bedoelde verrichtingen aanvaardbaar examen aan
      een instelling van wetenschappelijk onderwijs met goed gevolg heeft afgelegd. De tweede en derde volzin van artikel
      5, tweede lid, zijn van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel47
    url: https://wetten.overheid.nl/BWBR0003127/1999-11-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0003127
        artikel: '47'
        paragraaf: '7'
  - number: '46'
    text: |-
      1 De in [artikel 45, eerste lid][ref1], bedoelde verrichtingen moeten geschieden in daartoe bestemde lokalen en met
      gebruikmaking van de daarvoor geëigende uitrusting. In de desbetreffende lokalen mogen geen andere producten dan
      farmaceutische producten worden verpakt. Artikel 6, derde lid, is van overeenkomstige toepassing.

      2 Met betrekking tot de in [artikel 45, eerste lid][ref2], bedoelde verrichtingen moeten voldoende voorzorgen zijn
      genomen, teneinde te voorkomen dat:

      a. verontreiniging plaatsvindt van de in het eerste lid bedoelde lokalen, uitrusting en farmaceutische producten;

      b. verandering in de samenstelling van farmaceutische producten plaatsvindt of verwisseling plaatsvindt van
      farmaceutische producten en verpakkingsmateriaal.


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0003127#Artikel45
    url: https://wetten.overheid.nl/BWBR0003127/1999-11-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0003127
        artikel: '45'
        paragraaf: '7'
      - id: ref2
        bwb_id: BWBR0003127
        artikel: '45'
        paragraaf: '7'
  - number: '47'
    text: |-
      1 Met betrekking tot elke van uit een lid-staat betrokken hoeveelheid van een farmaceutisch product, verpakt
      uit één charge, is [artikel 37][ref1], van overeenkomstige toepassing, met dien verstande dat de parallel-
      groothandelaar verplicht is het in dat artikellid, [onder ][ref2], bedoelde onderzoek onderscheidenlijk de in dat
      artikellid, [onder ][ref3], bedoelde controle te doen verrichten door een door Onze Minister daartoe aangewezen
      bestuursorgaan, tenzij hij de hoofdinspecteur heeft aangetoond dat hij zulks hetzij volledig hetzij ten dele zelf
      kan verrichten en de hoofdinspecteur daarmee akkoord is gegaan.

      2 [Artikel 32, eerste lid, onder ][ref4], is van toepassing met betrekking tot een in het eerste lid bedoeld
      onderzoek.

      3 Voor een onderzoek onderscheidenlijk controle als in het eerste lid bedoeld, verricht door een in dat lid
      bedoelde bestuursorgaan, is de parallel-groothandelaar een vergoeding verschuldigd volgens een door Onze Minister
      vastgesteld tarief.

      4 Van de in [artikel 45, eerste lid][ref5], bedoelde verrichtingen met betrekking tot het verpakken en etiketteren
      van verpakkingen moet een gedagtekend protocol worden opgemaakt, voorzien van het op de verpakkingen vermelde
      partijnummer van de fabrikant, bedoeld in [artikel 2, eerste lid, onder ][ref6], van [Richtlijn 92/27/EEG]
      (31992L0027) van de Raad van de Europese Gemeenschappen van 31 maart 1992 betreffende de etikettering en de
      bijsluiter van geneesmiddelen voor menselijk gebruik (*PbEG* L 113); in dat protocol moeten tevens zijn vermeld
      de nummers van de protocollen als bedoeld in [artikel 32, eerste lid, onder ][ref7], onderscheidenlijk die van de
      protocollen als bedoeld in dat artikellid, [onder ][ref8].


