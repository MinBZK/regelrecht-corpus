  - number: '5'
    text: |-
      1 De bereiding van farmaceutische producten en het verrichten van controles moet geschieden onder leiding en
      toezicht van één of meer apothekers, die van hun bevoegdheid tot uitoefening der artsenijbereidkunst gebruik mogen
      maken en die voldoen aan de eisen, gesteld in artikel 23, van de E.E.G.-richtlijn no. 75/319/EEG, waarvan de tekst
      als bijlage bij dit besluit is gevoegd.

      2 Onze Minister kan, indien gewichtige redenen daartoe aanleiding geven, toestaan dat de bereiding of een onderdeel
      van de bereiding van farmaceutische producten, dan wel het verrichten van controles geschiedt onder leiding en
      toezicht van een persoon, die ten minste twee jaren direkt betrokken is geweest bij de industriële bereiding van
      farmaceutische producten en een met het oog op die taak aanvaardbaar examen aan een instelling van wetenschappelijk
      onderwijs met goed gevolg heeft afgelegd.

      De toestemming kan onder beperkingen worden verleend en aan de toestemming kunnen voorschriften worden verbonden.
      De toestemming kan worden ingetrokken indien de in de eerste volzin bedoelde persoon ernstig tekortschiet in de
      uitoefening van zijn functie.

      3 Voor de bereiding van farmaceutische producten en het verrichten van controles moet, in overeenstemming
      met de aard en omvang van de krachtens de vergunning toegestane bedrijfswerkzaamheden, worden beschikt over
      wetenschappelijk gevormd en over technisch geschoold personeel.

      4 Onze Minister kan op verzoek van de fabrikant toestaan dat één of meer controles worden verricht door een door
      Onze Minister daartoe erkend laboratorium. Een laboratorium wordt door Onze Minister erkend indien:

      a. het beschikt over de voor het verrichten van controles geëigende uitrusting en lokalen;

      b. de controles worden verricht onder leiding en toezicht van een apotheker of een persoon, die een met het oog op
      het verrichten van controles aanvaardbaar examen aan een instelling van wetenschappelijk onderwijs met goed gevolg
      heeft afgelegd;

      c. het met het oog op het verrichten van controles beschikt over wetenschappelijk gevormd en over technisch
      geschoold personeel.

      5 Een in het vierde lid bedoeld verzoek moet:

      a. met redenen zijn omkleed;

      b. een opgave bevatten van de desbetreffende controles;

      c. de naam en het adres van het laboratorium bevatten.

      6 Een toestemming als in het vierde lid bedoeld is niet vereist indien één of meer controles wegens bijzondere
      omstandigheden tijdelijk niet kunnen worden verricht. In zodanig geval moet hiervan, onder opgave van de reden en
      de naam en het adres van het laboratorium onverwijld kennis worden gegeven aan de hoofdinspecteur.
    url: https://wetten.overheid.nl/BWBR0003127/1999-11-01#Artikel5
  - number: '6'
    text: |-
      1 De bereiding van farmaceutische producten en het verrichten van controles op die bereiding moet
      geschieden in daartoe bestemde lokalen en met gebruikmaking van daarvoor geëigende uitrusting. In de
      bereidingslokalen mogen geen andere producten dan farmaceutische producten en geneesmiddelen als bedoeld in
      [artikel 1, eerste lid, onder ][ref1], van de wet worden bereid.

      2 Onze Minister kan desgevraagd toestaan dat in de in het eerste lid bedoelde bereidingslokalen met name genoemde
      andere producten dan die bedoeld in het eerste lid, geheel of gedeeltelijk worden bereid. De toestemming kan onder
      beperkingen worden verleend en aan de toestemming kunnen voorschriften worden verbonden. De toestemming kan worden
      ingetrokken indien wordt gehandeld in strijd met de aan die toestemming verbonden voorschriften, dan wel blijkt dat
      de bereiding van het product, waarvoor de toestemming is verleend, de bereiding van de in het eerste lid bedoelde
      producten ongunstig beïnvloedt.

      3 De in het eerste lid bedoelde lokalen moeten:

      a. deugdelijk zijn ingericht, zulks in overeenstemming met de eisen, voortvloeiende uit de aard van de daar te
      verrichten deelbewerking van de bereiding;

      b. zo zijn ingericht en afgewerkt, dat zij, met inbegrip van de daarin aanwezige uitrusting, gemakkelijk kunnen
      worden gereinigd;

      c. in ordelijke en zindelijke toestand verkeren.

      4 Met betrekking tot de bereiding van farmaceutische producten moeten voldoende voorzorgen zijn genomen teneinde te
      voorkomen dat:

      a. verontreiniging plaatsvindt van de in het eerste lid bedoelde lokalen en uitrusting, alsmede van substanties,
      hulpstoffen, halffabrikaten en farmaceutische producten;

      b. verwisseling plaatsvindt van substanties, hulpstoffen, halffabrikaten, farmaceutische producten en
      verpakkingsmateriaal.


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel1
