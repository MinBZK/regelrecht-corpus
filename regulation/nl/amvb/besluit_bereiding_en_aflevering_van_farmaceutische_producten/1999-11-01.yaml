  - number: '10'
    text: |-
      1 De in [artikel 8, eerste lid, onder ][ref1], bedoelde protocollen en het in
      [artikel 8, eerste lid, onder ][ref2], bedoelde document moeten, behoudens het in het vierde lid bedoelde geval,
      gedurende ten minste vijf jaren, te rekenen vanaf de datum van aanvang van de bereiding van de charge, worden
      bewaard.

      2 De in [artikel 8, tweede lid][ref3], bedoelde protocollen moeten, behoudens het in het vierde lid bedoelde
      geval, gedurende ten minste vijf jaren, te rekenen vanaf de datum van het laatst verrichte onderzoek, bedoeld
      [onder ][ref4], van eerstgenoemd artikellid, worden bewaard.

      3 De ingevolge [artikel 8, eerste lid, onder ][ref5], aan te houden monsters en het in
      [artikel 11, tweede lid][ref6], bedoelde exemplaar van het farmaceutische product moeten gedurende hetzelfde
      tijdvak als de daarop betrekking hebbende protocollen op deugdelijke wijze worden bewaard. De monsters moeten
      worden bewaard in een verpakking, welke is voorzien van een zodanige sluiting dat de verpakking niet zonder kenbare
      beschadiging van de sluiting kan worden geopend.

      4 Indien een farmaceutisch product, te rekenen vanaf de datum van aanvang van de bereiding van de charge, minder
      dan vijf jaren houdbaar is, behoeven de in het derde lid bedoelde monsters en het bedoelde exemplaar van het
      farmaceutische product, alsmede de daarop betrekking hebbende protocollen slechts te worden bewaard tot de datum
      tot welke het farmaceutische product geschikt voor gebruik wordt geacht.

      5 De in dit artikel bedoelde protocollen, monsters en het bedoelde exemplaar van het farmaceutische product
      moeten gedurende de termijn van bewaring ter beschikking worden gehouden van de personen, bedoeld in
      [artikel 33, eerste lid][ref7], van de wet.


