preamble:
  text: |-
    Wij Juliana, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Op de voordracht van de Staatssecretaris van Volksgezondheid en Milieuhygiëne van 25 april 1977, DG Vgz/GMI, no.
    129830;

    Overwegende dat het noodzakelijk is de regelen inzake de produktie en distributie van geneesmiddelen aan te passen
    aan de richtlijnen van de Raad van de Europese Gemeenschappen van 26 januari 1965 (65/65/EEG), van 20 mei 1975
    (75/318/EEG) en van 20 mei 1975 (75/319/EEG);

    Gelet op de artikelen 1, derde lid, en 26, onder f, g, en i, van de Wet op de Geneesmiddelenvoorziening (Stb. 1958,
    408);

    Gezien het advies van de Geneesmiddelencommissie;

    De Raad van State gehoord (advies van 15 juni 1977, no. 19b);

    Gezien het nader rapport van de Staatssecretaris van Volksgezondheid en Milieuhygiëne van 25 augustus 1977, DG Vgz/
    GMI, no. 131384;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0003127/1999-11-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. wet: [Wet op de Geneesmiddelenvoorziening][ref1] (*Stb.* 1958, 408);

      b. farmaceutisch product: farmaceutische specialité of farmaceutisch preparaat;

      c. fabrikant: ieder aan wie krachtens [artikel 2, eerste lid, onder ][ref2], van de wet vergunning is verleend tot
      het bereiden van farmaceutische producten en het afleveren daarvan;

      d. loonfabrikant:

      1°. ieder aan wie krachtens [artikel 2, eerste lid, onder ][ref3], van de wet vergunning is verleend tot het
      verrichten van één of meer deelbewerkingen van de bereiding van een farmaceutisch product of tot het bereiden van
      een farmaceutisch product, uitsluitend in opdracht en ten behoeve van een ander;

      2°. een fabrikant als bedoeld in [artikel 19, zevende lid][ref4];

      e. importeur: ieder die farmaceutische producten uit een ander land dan een lid-staat betrekt en aan wie krachtens
      [artikel 2, eerste lid, onder ][ref5], van de wet vergunning is verleend uitsluitend tot het afleveren van die
      producten;

      f. parallel-groothandelaar: ieder die een in een andere lid-staat in de handel gebracht farmaceutisch product uit
      die lid-staat betrekt in de verpakking waarin het in die lid-staat in de handel wordt gebracht en aan wie, ten
      behoeve van het in Nederland in de handel brengen van dat product, krachtens [artikel 2, eerste lid, onder ][ref6],
      van de wet vergunning is verleend tot het verpakken, etiketteren en afleveren;

      g. groothandelaar: ieder, niet zijnde een persoon als bedoeld [onder ][ref7], aan wie krachtens
      [artikel 2, eerste lid, onder ][ref8], van de wet vergunning is verleend uitsluitend tot het afleveren van
      farmaceutische producten;

      h. charge: hoeveelheid eenheden geneesmiddel in een farmaceutische vorm, gereed voor het verpakken, welke uit één
      uitgangsmassa in één bewerkingsgang is bereid;

      i. register: register van farmaceutische specialités of van farmaceutische preparaten, bedoeld in
      [artikel 3, eerste lid][ref9], van de wet en het communautaire geneesmiddelenregister, bedoeld in artikel 12,
      eerste lid, van de Europese registratie-verordening;

      j. registratiehouder: degeen te wiens name een farmaceutisch product in het desbetreffende register staat
      ingeschreven;

      k. controles: analyses en andere controles met betrekking tot welke in het register de analyse- en andere
      controlemethodieken zijn opgenomen;

      l. lid-staat: staat, welke lid is van de Europese Economische Gemeenschap;

      m. Europese registratie-verordening: de [verordening (EEG) nr. 2309/93](31993R2309) van de Raad van de Europese
      Gemeenschappen van 22 juli 1993 tot vaststelling van communautaire procedures voor het verlenen van vergunningen
      voor en het toezicht op geneesmiddelen voor menselijk en diergeneeskundig gebruik en tot oprichting van een
      Europees bureau voor de geneesmiddelenbeoordeling (*PbEG* L 214).

      2 Met een lidstaat wordt gelijkgesteld een andere staat die partij is bij de Overeenkomst betreffende de Europese
      Economische Ruimte.


