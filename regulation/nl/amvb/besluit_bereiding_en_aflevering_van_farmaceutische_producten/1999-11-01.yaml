  - number: '48'
    text: |-
      Ten aanzien van de uit een andere lid-staat betrokken farmaceutische producten zijn
      [de artikelen 14][ref1]-[17][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0003127#Artikel17
    url: https://wetten.overheid.nl/BWBR0003127/1999-11-01#Artikel48
