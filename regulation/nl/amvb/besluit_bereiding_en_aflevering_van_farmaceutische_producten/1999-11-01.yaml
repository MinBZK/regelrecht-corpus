  - number: '20'
    text: De loonfabrikant draagt zorg dat wordt voldaan aan de bepalingen van deze paragraaf.
    url: https://wetten.overheid.nl/BWBR0003127/1999-11-01#Artikel20
  - number: '21'
    text: |-
      Wijzigingen in de gegevens welke in gevolge [artikel 19, eerste lid onder ][ref1], voor wat betreft de inrichting
      van het perceel of de percelen, en *d,* zijn verstrekt, moeten voor het eind van het kalenderjaar waarin de
      wijziging heeft plaatsgevonden ter kennis worden gebracht van Onze Minister en van de hoofdinspecteur. Van elke
      andere wijziging in de gegevens welke ingevolge [artikel 19][ref2] zijn verstrekt moet onverwijld kennis worden
      gegeven aan Onze Minister en de hoofdinspecteur.


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0003127#Artikel19
