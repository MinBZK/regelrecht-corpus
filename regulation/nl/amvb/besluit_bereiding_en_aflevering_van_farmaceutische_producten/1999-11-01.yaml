  - number: '11'
    text: |-
      1 Gedurende het verpakken van een charge en het etiketteren van de verpakkingen moet het op die charge betrekking
      hebbende document, bedoeld in [artikel 8, eerste lid, onder ][ref1], aanwezig zijn in het lokaal, waarin het
      verpakken onderscheidenlijk het etiketteren plaatsvindt. Indien de in de eerste volzin bedoelde verrichtingen
      worden opgedragen aan een loonfabrikant moet het document aan deze ter beschikking worden gesteld.

      2 Indien een farmaceutisch product in de handel wordt gebracht in een verpakking, kennelijk bestemd om het daarin
      aan particuliere verbruikers af te leveren, moet van elke charge een exemplaar van het farmaceutisch product in die
      verpakking worden aangehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel8
    url: https://wetten.overheid.nl/BWBR0003127/1999-11-01#Artikel11
