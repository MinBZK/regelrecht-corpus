        artikel: '29'
        paragraaf: '4'
  - number: '56'
    text: |-
      1 Een persoon, rechtspersoon daaronder begrepen, niet zijnde groothandelaar of parallel-groothandelaar, die een
      farmaceutisch product betrekt van een in een andere lid-staat gevestigde registratiehouder is verplicht van elke
      ontvangst van een hoeveelheid daarvan onverwijld kennis te geven aan de hoofdinspecteur, onder vermelding van:

      a. zijn naam en adres;

      b. de naam en het adres van degeen van wie de hoeveelheid is betrokken;

      c. de benaming van het farmaceutische product;

      d. het aantal handelsverpakkingen en de inhoud van elk van die verpakkingen;

      e. de datum van ontvangst van de hoeveelheid.

      2 Met betrekking tot elke hoeveelheid van een farmaceutisch product, verpakt uit één charge, is [artikel 37][ref1],
      van overeenkomstige toepassing, met dien verstande dat een in het eerste lid bedoelde persoon verplicht is het in
      eerstgenoemd artikellid, [onder ][ref2] bedoelde onderzoek, onderscheidenlijk de in dat artikellid, [onder ][ref3]
      bedoelde controle te doen verrichten door een door Onze Minister daartoe aangewezen bestuursorgaan, tenzij hij
      de hoofdinspecteur heeft aangetoond dat hij zulks hetzij volledig hetzij ten dele zelf kan verrichten en de
      hoofdinspecteur daarmee akkoord is gegaan.

      3 [Artikel 32, eerste lid, onder ][ref4], is van toepassing met betrekking tot een in het tweede lid bedoeld
      onderzoek.

      4 Voor een onderzoek onderscheidenlijk controle als in het tweede lid bedoeld, verricht door een in dat lid
      bedoelde bestuursorgaan, is de in het eerste lid bedoelde persoon een vergoeding verschuldigd volgens een door Onze
      Minister vastgesteld tarief.

      5 Dit artikel geldt niet ten aanzien van een persoon die een farmaceutisch product uit een lid-staat betrekt dat
      kennelijk voor zijn eigen gebruik bestemd is.


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel37e
