  - number: '34'
    text: |-
      Ten aanzien van ingevoerde farmaceutische producten zijn [de artikelen 14][ref1]-[17][ref2] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0003127#Artikel17
    url: https://wetten.overheid.nl/BWBR0003127/1999-11-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0003127
        artikel: '14'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0003127
        artikel: '17'
        paragraaf: '2'
  - number: '35'
    text: Onze Minister is bevoegd met betrekking tot de invoer van farmaceutische producten nadere regelen te stellen.
    url: https://wetten.overheid.nl/BWBR0003127/1999-11-01#Artikel35
  - number: '36'
    text: |-
      1 Een aanvraag ter verkrijging van een vergunning als bedoeld in [artikel 1, onder ][ref1], moet de volgende
      gegevens bevatten:

      a. de naam en het adres van de aanvrager, alsmede de voornamen van de aanvrager in geval deze een natuurlijk
      persoon is;

      b. de naam van de persoon, onder wiens leiding en toezicht de bedrijfswerkzaamheden betreffende de in-, op- en
      uitslag van de farmaceutische producten zullen worden verricht, onder aanduiding van de kwalificatie van die
      persoon;

      c. een opgave van de ligging van het perceel of de percelen, waarin de farmaceutische producten ter aflevering in
      voorraad zullen worden gehouden, vergezeld van een nauwkeurige beschrijving van het lokaal of de lokalen, waarin de
      farmaceutische producten zullen worden bewaard, alsmede van de inrichting dier lokalen.

      2 Bij een aanvraag moet worden overgelegd:

      a. een uittreksel uit het handelsregister, en

      b. in geval de aanvrager een rechtspersoon is, de statuten van die rechtspersoon.

      3 [Artikel 2, zesde lid][ref2], is van toepassing.

      4 Voor het verkrijgen van een in het eerste lid bedoelde vergunning moet de aanvrager ten minste aan de volgende
      eisen voldoen:

      a. hij moet beschikken over geschikte en voldoende bedrijfsruimten, installaties en uitrusting, zodat een goede
      bewaring en een goede distributie van de farmaceutische producten wordt gewaarborgd;

      b. hij moet beschikken over gekwalificeerd personeel en met name over een gekwalificeerde persoon als bedoeld in
      het eerste lid, onder *b*.


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0003127#Artikel2
    url: https://wetten.overheid.nl/BWBR0003127/1999-11-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0003127
        artikel: '1'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0003127
        artikel: '2'
        paragraaf: '2'
  - number: 36a
    text: De groothandelaar draagt zorg dat wordt voldaan aan de bepalingen van deze paragraaf.
    url: https://wetten.overheid.nl/BWBR0003127/1999-11-01#Artikel36a
  - number: '37'
    text: |-
      De groothandelaar is verplicht van elke wijziging in de gegevens welke bij de in [artikel 36][ref1] bedoelde
      aanvraag zijn verstrekt, met uitzondering van die betreffende de inrichting van het perceel of de percelen,
      onverwijld kennis te geven aan Onze Minister en de hoofdinspecteur. Een wijziging betreffende de inrichting van het
      perceel of de percelen moet voor het eind van het kalenderjaar waarin de wijziging heeft plaatsgevonden ter kennis
      worden gebracht van Onze Minister en de hoofdinspecteur.


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel36
    url: https://wetten.overheid.nl/BWBR0003127/1999-11-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0003127
        artikel: '36'
        paragraaf: '5'
  - number: 37a
    text: |-
      De groothandelaar dient zich te richten naar de beginselen en richtsnoeren inzake goede distributiepraktijken,
      bedoeld in [artikel 10][ref1] van [richtlijn 92/25/EEG](31992L0025) van de Raad van de Europese Gemeenschappen
      van 31 maart 1992 betreffende de groothandel in geneesmiddelen voor menselijk gebruik (*PbEG* L 113). Van de
      bekendmaking daarvan door de Commissie van de Europese Gemeenschappen, zal door Onze Minister mededeling worden
      gedaan in de *Staatscourant,* voor zover zodanige bekendmaking niet geschiedt in het *Publikatieblad van de
      Europese Gemeenschappen*.


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel10
    url: https://wetten.overheid.nl/BWBR0003127/1999-11-01#Artikel37a
    references:
      - id: ref1
        bwb_id: BWBR0003127
        artikel: '10'
        paragraaf: '2'
  - number: 37b
    text: |-
      De groothandelaar moet beschikken over een urgentieplan waardoor de daadwerkelijke tenuitvoerlegging van elke actie
      tot het uit de handel nemen van een farmaceutisch product wordt gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0003127/1999-11-01#Artikel37b
  - number: 37c
    text: |-
      De groothandelaar mag zijn farmaceutische producten uitsluitend betrekken van personen die:

      a. zelf groothandelaar zijn;

      b. fabrikant, importeur of parallel-groothandelaar zijn; dan wel

      c. in het bezit zijn van een door een lid-staat afgegeven vergunning als bedoeld in [artikel 16][ref1] van
      [richtlijn 75/319/EEG](31975L0319) van de Raad van de Europese Gemeenschappen van 20 mei 1975 betreffende de
      aanpassing van de wettelijke en bestuursrechtelijke bepalingen inzake farmaceutische specialisten (*PbEG* L 147).


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel16
    url: https://wetten.overheid.nl/BWBR0003127/1999-11-01#Artikel37c
    references:
      - id: ref1
        bwb_id: BWBR0003127
        artikel: '16'
        paragraaf: '2'
  - number: 37d
    text: |-
      1 De groothandelaar moet een documentatie bijhouden, waarin voor elke tot inslag en uitslag leidende transactie van
      farmaceutische producten ten minste de volgende gegevens zijn opgenomen:

      a. de datum van de desbetreffende transactie;

      b. de benaming van het farmaceutische product;

      c. de ontvangen, onderscheidenlijk de geleverde hoeveelheid;

      d. de naam en het adres van de leverancier, onderscheidenlijk van de ontvanger.

      2 De in het eerste lid bedoelde documentatie dient gedurende ten minste vijf jaren te worden bewaard en gedurende
      die periode ter beschikking van de inspecteur te worden gehouden.
    url: https://wetten.overheid.nl/BWBR0003127/1999-11-01#Artikel37d
  - number: 37e
    text: |-
      1 Met betrekking tot elke vanuit een lid-staat betrokken hoeveelheid van een farmaceutisch product,
      verpakt uit één charge moet, indien die hoeveelheid niet is vergezeld van protocollen als bedoeld in
      [artikel 32, eerste lid, onder ][ref1], door de groothandelaar een onderzoek worden verricht als bedoeld in dat
      artikellid, [onder ][ref2].

      2 [Artikel 32, eerste lid, onder ][ref3], is van toepassing met betrekking tot het in het eerste lid bedoelde
      geval.


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0003127#Artikel37e
      [ref3]: https://wetten.overheid.nl/BWBR0003127#Artikel32
    url: https://wetten.overheid.nl/BWBR0003127/1999-11-01#Artikel37e
    references:
      - id: ref1
        bwb_id: BWBR0003127
        artikel: '32'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0003127
        artikel: 37e
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0003127
        artikel: '32'
        paragraaf: '4'
  - number: 37f
    text: |-
      De groothandelaar dient bij elke leverantie van farmaceutische producten aan personen, bevoegd tot het afleveren
      van farmaceutische producten aan particuliere verbruikers, documenten bij te voegen waaraan de volgende gegevens
      kunnen worden ontleend:

      a. de datum van aflevering;

      b. de benaming en de farmaceutische vorm van het farmaceutisch product;

      c. de geleverde hoeveelheid;

      d. de naam en het adres van de leverancier en de ontvanger.
    url: https://wetten.overheid.nl/BWBR0003127/1999-11-01#Artikel37f
  - number: '38'
    text: |-
      Met betrekking tot de groothandelaar zijn [de artikelen 14, vierde en vijfde lid][ref1], en [15][ref2]-[17][ref3]
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0003127#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0003127#Artikel17
    url: https://wetten.overheid.nl/BWBR0003127/1999-11-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0003127
        artikel: '14'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0003127
        artikel: '15'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0003127
        artikel: '17'
        paragraaf: '2'
  - number: '39'
    text: |-
      Voor de toepassing van deze paragraaf wordt onder "U.A.-vergunning" verstaan een vergunning als bedoeld in
      [artikel 4, eerste lid, onder ][ref1], van de wet.


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel4
    url: https://wetten.overheid.nl/BWBR0003127/1999-11-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0003127
        artikel: '4'
        paragraaf: '2'
  - number: '40'
    text: |-
      1 Een aanvraag ter verkrijging van een U.A.-vergunning moet de volgende gegevens bevatten:

      a. de naam en het adres van de aanvrager, alsmede de voornamen van de aanvrager in geval deze een natuurlijk
      persoon is;

      b. een opgave van de af te leveren farmaceutische producten, ten aanzien waarvan
      [artikel 4, eerste of derde lid][ref1], van de wet van toepassing is;

      c. de naam en het adres van de in [artikel 41, vierde lid][ref2], bedoelde apotheker of andere persoon.

      2 [Artikel 2, zesde lid][ref3], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0003127#Artikel41
      [ref3]: https://wetten.overheid.nl/BWBR0003127#Artikel2
    url: https://wetten.overheid.nl/BWBR0003127/1999-11-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0003127
        artikel: '4'
        paragraaf: '2'
      - id: ref2
