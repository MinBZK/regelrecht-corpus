  - number: '30'
    text: De importeur draagt zorg dat wordt voldaan aan de bepalingen van deze paragraaf.
    url: https://wetten.overheid.nl/BWBR0003127/1999-11-01#Artikel30
  - number: '31'
    text: |-
      Wijzigingen in de gegevens welke ingevolge [artikel 29, eerste lid onder ][ref1], voor wat betreft de inrichting
      van het perceel of de percelen, en die welke ingevolge voornoemd artikellid, [onder ][ref2], [2°][ref3] en
      [3°][ref4], zijn verstrekt, moeten voor het eind van het kalenderjaar waarin de wijziging heeft plaatsgevonden
      ter kennis worden gebracht van Onze Minister en van de hoofdinspecteur. Van elke andere wijziging in de gegevens
      welke ingevolge [artikel 29][ref5] zijn verstrekt moet onverwijld kennis worden gegeven aan Onze Minister en de
      hoofdinspecteur.


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel29
