  - number: 14a
    text: |-
      1 De hoofdinspecteur kan degene die verantwoordelijk is voor het in de handel brengen van een farmaceutisch
      product, verplichten om de handel in dat product op te schorten of dat product uit de handel te nemen, indien niet
      is voldaan aan één van de vereisten, bedoeld in [artikel 14, eerste lid][ref1], of indien de bescherming van de
      volksgezondheid zulks vordert. Artikel 14, vijfde lid, is van overeenkomstige toepassing.

      2 Het eerste lid geldt ook voor een farmaceutisch product dat krachtens een bindende uitspraak van de Commissie of
      de Raad van de Europese Gemeenschappen in een procedure als bedoeld in de [artikelen 7][ref2]*e* en [12][ref3], in
      de handel is.

      3 De hoofdinspecteur geeft van een maatregel tot opschorting van de handel of tot het uit de handel nemen van een
      farmaceutisch product als bedoeld in het tweede lid, uiterlijk op de volgende werkdag kennis aan de Commissie en de
      andere lid-staat of lid-staten waar het product ook in de handel is.

      4 Indien een maatregel tot opschorting of tot het uit de handel nemen van een product dat in meer lid-staten in
      de handel is, verband houdt met bijwerkingen die een onmiddellijk gevaar voor de volksgezondheid opleveren, geeft
      de hoofdinspecteur van die maatregel uiterlijk op de volgende werkdag kennis aan het Europees Bureau voor de
      geneesmiddelenbeoordeling, bedoeld in artikel 49 van de Europese registratie-verordening.

      5 De hoofdinspecteur geeft van elke maatregel als bedoeld in dit artikel, onverwijld kennis aan het College ter
      beoordeling van geneesmiddelen.


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0003114#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0003114#Artikel12a
