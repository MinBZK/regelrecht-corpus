  - number: '2'
    text: |-
      1 Een aanvraag ter verkrijging van een vergunning als bedoeld in [artikel 1, onder ][ref1], moet de volgende
      gegevens bevatten:

      a. de naam en het adres van de aanvrager, alsmede de voornamen van de aanvrager in geval deze een natuurlijk
      persoon is;

      b. een opgave van de farmaceutische producten welke zullen worden bereid en van de farmaceutische vormen van die
      producten;

      c. een opgave van de ligging van het perceel of de percelen, waarin

      1°. de bereiding van de farmaceutische producten en het verrichten van controles zal plaatsvinden;

      2°. de farmaceutische producten zullen worden bewaard;

      3°. de substanties, hulpstoffen en halffabrikaten, dienende voor de bereiding van farmaceutische producten, zullen
      worden bewaard;

      een en ander onder overlegging van een plattegrond van het perceel of de percelen, met vermelding van de bestemming
      der ruimten of lokalen en vergezeld van een nauwkeurige beschrijving van de lokalen, alsmede van de inrichting
      dier lokalen;

      d. een opgave van de aard en de omvang van de bedrijfswerkzaamheden en van de uitrusting waarover de aanvrager in
      verband met die bedrijfswerkzaamheden zal beschikken;

      e. een opgave van het aantal wetenschappelijk gevormde personen en van het aantal technisch geschoolde personen die
      met de direkte leiding van de bereiding van farmaceutische producten en het verrichten van controles zullen worden
      belast, onder aanduiding van de wetenschappelijke of technische kwalifikatie van die personen;

      f. de naam en het adres van de persoon of personen, bedoeld in [artikel 5, eerste of tweede lid, onder][ref2]
      wiens of wier leiding en toezicht de bereiding van farmaceutische producten en het verrichten van controles
      zal geschieden, alsmede een nauwkeurige omschrijving van zijn of hun werkzaamheden en van zijn of hun
      verantwoordelijkheden, onder vermelding van al die gegevens waaruit blijkt dat de in dat lid genoemde taak
      metterdaad zal kunnen worden vervuld;

      g. een door [de onder ][ref3] bedoelde persoon onderscheidenlijk een door elk van [de onder ][ref4] bedoelde
      personen ondertekende verklaring, dat hij de werkzaamheden overeenkomstig [de onder ][ref5] bedoelde omschrijving
      zal verrichten en de verantwoordelijkheid daarvoor aanvaardt.

      2 Indien de aanvrager voornemens is de bereiding van farmaceutische producten of het verrichten van controles te
      doen geschieden onder leiding en toezicht van een persoon als bedoeld in [artikel 5, tweede lid][ref6], moet de
      aanvraag de in dat artikellid bedoelde redenen bevatten.

      3 Indien de aanvrager voornemens is één of meer deelbewerkingen van de bereiding van een farmaceutisch product of
      de bereiding van een farmaceutisch product te doen verrichten door een loonfabrikant of één of meer deelbewerkingen
      te doen verrichten door een in het buitenland gevestigde tot het bereiden van farmaceutische producten bevoegde
      persoon, moet de aanvraag tevens bevatten een opgave van de desbetreffende deelbewerking of deelbewerkingen,
      onderscheidenlijk de vermelding van het farmaceutische product, de naam van de loonfabrikant onderscheidenlijk
      die van de in het buitenland gevestigde bevoegde persoon, alsmede een opgave van de ligging van het perceel
      waarin de deelbewerking of deelbewerkingen zal of zullen worden verricht, onderscheidenlijk de bereiding van het
      farmaceutische product zal plaatsvinden.

      4 Indien de aanvrager voornemens is één of meer controles te doen verrichten door een in
      [artikel 5, vierde lid][ref7], bedoeld laboratorium, moet de aanvraag tevens bevatten de gegevens, bedoeld in het
      vijfde lid van dat artikel.

      5 Bij een aanvraag moet worden overgelegd:

      a. een uittreksel uit het handelsregister, en

      b. in geval de aanvrager een rechtspersoon is, de statuten van die rechtspersoon.

      6 Onze Minister stelt de aanvrager binnen 90 dagen na de datum van ontvangst van de aanvraag in kennis van zijn
      beslissing. Ingeval het voor de beoordeling van de aanvraag noodzakelijk is dat door de aanvrager nadere gegevens
      worden verstrekt, wordt de in de eerste volzin genoemde termijn opgeschort van de datum waarop om deze gegevens
      wordt verzocht tot de datum van ontvangst van die gegevens.


