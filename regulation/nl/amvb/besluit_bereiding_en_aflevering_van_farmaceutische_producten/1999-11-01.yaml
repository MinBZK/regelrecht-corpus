  - number: '33'
    text: |-
      1 De in [artikel 32, eerste lid, onder ][ref1], bedoelde controles moeten geschieden onder leiding en toezicht van
      een apotheker, die van zijn bevoegdheid tot uitoefening der artsenijbereidkunst gebruik mag maken en die voldoet
      aan de eisen, vervat in artikel 23 van de E.E.G.-richtlijn no. 75/319/EEG.

      2 Onze Minister kan toestaan dat de in [artikel 32, eerste lid, onder ][ref2], bedoelde controles van
      farmaceutische producten geschieden onder leiding en toezicht van een persoon, die ten minste twee jaren belast
      is geweest met het verrichten van controles van industrieel bereide farmaceutische producten, en een met het oog
      op die taak aanvaardbaar examen aan een instelling van wetenschappelijk onderwijs met goed gevolg heeft afgelegd.
      De toestemming kan worden ingetrokken indien de in de eerste volzin bedoelde persoon ernstig tekortschiet in de
      uitoefening van zijn functie.

      3 Voor het verrichten van de in [artikel 32, eerste lid, onder ][ref3], bedoelde controles moet worden beschikt
      over technisch geschoold personeel, daartoe bestemde lokalen en daartoe geëigende uitrusting.

      4 Onze minister kan op verzoek van de importeur toestaan dat één of meer van de in
      [artikel 32, eerste lid, onder ][ref4], bedoelde controles worden verricht door een in
      [artikel 5, vierde lid][ref5], bedoeld laboratorium.

      5 Een in het vierde lid bedoeld verzoek moet:

      a. met redenen zijn omkleed;

      b. een opgave bevatten van de desbetreffende controles;

      c. de naam en het adres van het laboratorium bevatten.


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0003127#Artikel32
      [ref3]: https://wetten.overheid.nl/BWBR0003127#Artikel32
      [ref4]: https://wetten.overheid.nl/BWBR0003127#Artikel32
      [ref5]: https://wetten.overheid.nl/BWBR0003127#Artikel5
    url: https://wetten.overheid.nl/BWBR0003127/1999-11-01#Artikel33
