  - number: '29'
    text: |-
      1 Een aanvraag ter verkrijging van een vergunning als bedoeld in [artikel 1, onder ][ref1], moet de volgende
      gegevens bevatten:

      a. de naam en het adres van de aanvrager, alsmede de voornamen van de aanvrager ingeval deze een natuurlijk persoon
      is;

      b. een opgave van:

      1°. de farmaceutische producten welke zullen worden ingevoerd;

      2°. de farmaceutische vormen van [de onder 1°][ref2] bedoelde farmaceutische producten;

      3°. de naam en het adres van degeen [die de onder][ref3] 1° bedoelde farmaceutische producten heeft bereid;

      c. de naam en het adres van de persoon, bevoegd tot het verrichten van de in
      [artikel 32, eerste lid, onder ][ref4], bedoelde controles;

      d. indien controles als bedoeld in [artikel 32, eerste lid, onder ][ref5], door de aanvrager zullen worden
      verricht:

      1°. een opgave van de ligging van het perceel of de percelen, waarin de controles zullen worden verricht en de
      farmaceutische producten ter aflevering in voorraad zullen worden gehouden, een en ander onder overlegging van een
      plattegrond van het perceel of de percelen, met vermelding van de bestemming der ruimten of lokalen en vergezeld
      van een nauwkeurige beschrijving van de lokalen, alsmede van de inrichting dier lokalen;

      2°. een opgave van de technisch geschoolde personen die met de direkte leiding van de controles zullen worden
      belast, onder aanduiding van de technische kwalifikatie van die personen;

      3°. een opgave van de uitrusting waarover de aanvrager in verband met de controles zal beschikken;

      e. indien [onderdeel ][ref6] niet van toepassing is, een opgave van de ligging van het perceel of de percelen,
      waarin farmaceutische producten ter aflevering in voorraad zullen worden gehouden, vergezeld van een nauwkeurige
      beschrijving van het lokaal of de lokalen, waarin de farmaceutische producten zullen worden bewaard, alsmede van de
      inrichting dier lokalen.

      2 Indien de aanvrager voornemens is de in [artikel 32, eerste lid, onder ][ref7], bedoelde controles te doen
      geschieden onder leiding en toezicht van een persoon als bedoeld in [artikel 33, tweede lid][ref8], moet de
      aanvraag de redenen daartoe bevatten.

      3 Indien de aanvrager voornemens is één of meer van de in [artikel 32, eerste lid, onder ][ref9], bedoelde
      controles te doen verrichten door een in [artikel 33, vierde lid][ref10], bedoeld laboratorium, moet de aanvraag
      tevens de in het vijfde lid van dat artikel bedoelde gegevens bevatten.

      4 Bij een aanvraag moet worden overgelegd:

      a. een uittreksel uit het handelsregister, en

      b. in geval de aanvrager een rechtspersoon is, de statuten van die rechtspersoon.

      5 [Artikel 2, zesde lid][ref11], is van toepassing.


