        artikel: '14'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0003127
        paragraaf: '2'
  - number: '54'
    text: |-
      1 Het in [artikel 3, vijfde lid][ref1], van de wet vervatte verbod tot invoer van ongeregistreerde farmaceutische
      producten geldt niet indien:

      a. het farmaceutisch product is bestemd om als monster te worden overgelegd bij een aanvraag tot inschrijving van
      dat farmaceutische product in het register;

      b. Een farmaceutisch product is bestemd voor het doen verrichten van onderzoekingen aan de mens of aan dieren;

      c. een persoon bij het overschrijden van de grens in het bezit is van een farmaceutisch product dat kennelijk voor
      zijn eigen gebruik bestemd is, of

      d. de hoordinspecteur toestemming tot invoer van een farmaceutisch product voor een daarbij aangegeven doeleinde
      heeft verleend.

      2 In de in het eerste lid, onder *a* en *b,* bedoelde gevallen mag het farmaceutische product niet worden ingevoerd
      alvorens degeen, die het farmaceutische product wil invoeren, hiervan onder opgave van de bestemming, kennis heeft
      gegeven aan de hoofdinspecteur en deze hem een bewijs van ontvangst der kennisgeving heeft verstrekt.

      3 De hoofdinspecteur verleent de in het eerste lid, onder *d,* bedoelde toestemming uitsluitend aan personen,
      bevoegd tot uitoefening van de artsenijbereidkunst. Aan de toestemming kunnen voorschriften worden verbonden.

      4 Het in [artikel 3, vijfde lid][ref2], van de wet vervatte verbod tot het afleveren van ongeregistreerde
      farmaceutische producten geldt niet ten aanzien van een in het eerste lid, onder *a, b* of *d,* bedoeld
      farmaceutisch product voor zover het wordt afgeleverd voor de bestemming onderscheidenlijk het doeleinde waarvoor
      de invoer is toegestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003127#Artikel3
    url: https://wetten.overheid.nl/BWBR0003127/1999-11-01#Artikel54
    references:
      - id: ref1
