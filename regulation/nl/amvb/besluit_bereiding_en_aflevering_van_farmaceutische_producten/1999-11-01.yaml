  - number: '57'
    text: |-
      Voor de toepassing van deze paragraaf wordt onder "wijzigingswet" verstaan: de wet van 29 augustus 1975 (*Stb.*
      519).
    url: https://wetten.overheid.nl/BWBR0003127/1999-11-01#Artikel57
  - number: '58'
    text: |-
      Degeen aan wie overeenkomstig [artikel 2, eerste lid, onder ][ref1] van de wet, zoals dat artikelonderdeel luidde
      onmiddellijk vóór het in werking treden van de wijzigingswet, een vergunning is verleend, is verplicht binnen zes
      maanden na het in werking treden van dit artikel ter vervanging van die vergunning een aanvraag in te dienen als
      bedoeld in [de artikelen 2][ref2], [29][ref3] of [36][ref4] van dit besluit.


