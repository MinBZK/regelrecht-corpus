  - number: '7'
    text: |-
      De bereiding van een farmaceutisch product en het verrichten van controles moet geschieden overeenkomstig de in het
      register opgenomen bereidingswijze onderscheidenlijk met gebruikmaking van de in het register opgenomen analyse- en
      andere controlemethodieken.
    url: https://wetten.overheid.nl/BWBR0003127/1999-11-01#Artikel7
  - number: '8'
    text: |-
      1 Met betrekking tot elke charge, bereid in Nederland:

      a. moet van het bereiden van het farmaceutische product een genummerd protocol worden bijgehouden, waaruit blijkt
      dat de bereiding is geschied overeenkomstig de in het register opgenomen bereidingswijze;

      b. moeten van het verrichten van controles van de voor de bereiding van het farmaceutische product gebruikte
      bestanddelen en van het farmaceutische product genummerde protocollen worden bijgehouden, waaruit blijkt dat
      de controles zijn verricht met gebruikmaking van de desbetreffende in het register opgenomen analyse- en andere
      controlemethodieken;

      c. moet een document worden opgemaakt waarin de volgende gegevens zijn vermeld:

      1°. de benaming van het farmaceutische product;

      2°. de kwalitatieve en kwantitatieve samenstelling van de werkzame bestanddelen van het farmaceutische product;

      3°. de verkregen grootte van de charge en een code ter aanduiding van die charge;

      4°. zo nodig, instructies voor het verpakken;

      d. moet een monster van elk van de voor de bereiding van het farmaceutische product gebruikte bestanddelen worden
      aangehouden, zulks in voldoende hoeveelheid voor het verrichten van controles;

      e. moet een monster van het farmaceutische product worden aangehouden, zulks in voldoende hoeveelheid voor het
      verrichten van kwalitatieve controles van het farmaceutische product en voor het verrichten van kwantitatieve
      controles op tenminste alle werkzame bestanddelen.

      2 Met betrekking tot elke charge of elk deel van een charge, ingevoerd vanuit een ander land dan een lid-staat:

      a. moet aanwezig zijn een protocol als bedoeld in het eerste lid, onder *a*, opgesteld door degeen die het
      farmaceutische product in dat land heeft bereid;

      b. moeten aanwezig zijn protocollen als bedoeld in het eerste lid, onder *b*, opgesteld door degeen die het
      farmaceutische product in dat land heeft bereid;

      c. moet, met gebruikmaking van de desbetreffende in het register opgenomen analyse- en andere controlemethodieken,
      worden onderzocht of het farmaceutische product in kwalitatieve samenstelling en voor wat betreft de werkzame
      bestanddelen in kwantitatieve samenstelling overeenstemt met de in het register opgenomen samenstelling;

      d. moeten van de verrichte controles, bedoeld [onder ][ref1], genummerde protocollen worden bijgehouden, waaruit
      blijkt dat de controles zijn verricht met gebruikmaking van de in dat onderdeel bedoelde analyse- en andere
      controlemethodieken;

      e. is het eerste lid, onder *c* en *e*, van toepassing.

      3 Met betrekking tot elke charge of elk deel van een charge, ingevoerd vanuit een lid-staat:

      a. moeten, indien de charge of het deel van de charge in die lid-staat is bereid, aanwezig zijn protocollen als
      bedoeld in het eerste lid, onder *b*, opgesteld door degeen die het farmaceutische product in die lid-staat heeft
      bereid;

      b. moeten, indien de charge of het deel van een charge in die lid-staat is ingevoerd vanuit een ander land
      dan een lid-staat, aanwezig zijn protocollen, waaruit blijkt dat de in die lid-staat gevestigde importeur, met
      gebruikmaking van de desbetreffende in het register opgenomen analyse- en andere controlemethodieken, heeft
      onderzocht of het farmaceutische product in kwalitatieve samenstelling en voor wat betreft de werkzame bestanddelen
      in kwantitatieve samenstelling overeenstemt met de in het register opgenomen samenstelling;

      c. is het eerste lid, onder *c* en *e*, van toepassing.

      4 De in het tweede lid, onder *a* en *b*, en derde lid bedoelde protocollen moeten door de in
      [artikel 5, eerste of tweede lid][ref2], bedoelde persoon worden gecontroleerd en, indien zij voldoen aan de
      desbetreffende bepalingen van dit artikel en [artikel 9][ref3], door die persoon voor akkoord worden getekend.

      5 Indien een deelbewerking of een onderdeel van de bereiding van een charge als bedoeld in
      [artikel 23, eerste lid][ref4], wordt verricht door een loonfabrikant dan wel door een in het buitenland gevestigde
      tot het bereiden van farmaceutische producten bevoegde persoon, moeten de in het register vervatte gegevens
      welke betrekking hebben op de te verrichten deelbewerking onderscheidenlijk onderdeel van de bereiding van een
      charge ter beschikking van de desbetreffende persoon worden gesteld. Indien de in de eerste volzin bedoelde
      verrichtingen in het buitenland hebben plaatsgevonden, moeten van die verrichtingen protocollen als bedoeld in
      [artikel 25, eerste of derde lid][ref5], aanwezig zijn, opgesteld door de in het buitenland gevestigde bevoegde
      persoon.

      6 Het eerste lid, onder *e*, is niet van toepassing ingeval voor het kunnen verrichten van de daarin
      bedoelde controles van het farmaceutische product voldoende eenheden in een verpakking als bedoeld in
      [artikel 11, tweede lid][ref6], worden aangehouden.


