  - number: '62'
    text: |-
      1 [Artikel 8][ref1] van de wet is niet van toepassing ten aanzien van:

      a. de aflevering van farmaceutische producten door artsen volgens artikel 10 van de wet van 1 juni 1865 (*Stb.*
      60);

      b. de aflevering van monsters van farmaceutische producten door artsen, tandartsen en verloskundigen, voor zover
      deze aflevering plaatsvindt binnen de grenzen van hun beroepsuitoefening;

      c. de aflevering van orale antikonseptiva door artsen aan personen jonger dan 21 jaar die voor wat betreft de
      aflevering en het gebruik anoniem wensen te blijven, voor zover deze aflevering plaatsvindt in het kader van de
      werkzaamheden van een daarvoor naar het oordeel van Onze Minister in aanmerking komende en als zodanig door hem
      aangewezen instelling voor geboorteregeling en seksualiteitsvragen.

      2 De in het eerste lid, onder *b,* bedoelde personen mogen monsters van farmaceutische producten uitsluitend gratis
      afleveren.


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel8
    url: https://wetten.overheid.nl/BWBR0003127/1999-11-01#Artikel62
    references:
      - id: ref1
