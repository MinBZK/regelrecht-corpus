  - number: '22'
    text: |-
      Een deelbewerking van de bereiding van een farmaceutisch product moet geschieden onder de direkte leiding en
      toezicht van een persoon, die de met betrekking tot de aard van de deelbewerking vereiste wetenschappelijke of
      technische kwalifikatie bezit en ten minste twee jaren betrokken is geweest bij de industriële bereiding van
      farmaceutische producten.
    url: https://wetten.overheid.nl/BWBR0003127/1999-11-01#Artikel22
  - number: '23'
    text: |-
      1 Het verrichten van een deelbewerking of van een onderdeel van de bereiding van een charge, bestaande uit enkele
      opeenvolgende deelbewerkingen, mag slechts geschieden in uitsluitend daartoe bestemde lokalen en met gebruikmaking
      van daarvoor geëigende uitrusting.

      2 Onze Minister kan desgevraagd toestaan dat de in het eerste lid bedoelde lokalen en uitrusting worden gebezigd
      voor andere met name genoemde doeleinden. De toestemming kan onder beperkingen worden verleend en aan de
      toestemming kunnen voorschriften worden verbonden. De toestemming kan worden ingetrokken indien wordt gehandeld in
      strijd met de aan die toestemming verbonden voorschriften, dan wel blijkt dat het doeleinde waarvoor de toestemming
      is verleend, een in het eerste lid bedoelde verrichting ongunstig beïnvloedt.

      3 Met betrekking tot de in het eerste lid bedoelde lokalen is [artikel 6, derde lid][ref1], van toepassing.

      4 Met betrekking tot de in het eerste lid bedoelde verrichtingen is [artikel 6, vierde lid][ref2], van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0003127#Artikel6
    url: https://wetten.overheid.nl/BWBR0003127/1999-11-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0003127
        artikel: '6'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0003127
        artikel: '6'
        paragraaf: '2'
  - number: '24'
    text: |-
      Het verrichten van een deelbewerking of van een onderdeel van de bereiding van een charge als bedoeld in
      [artikel 23, eerste lid][ref1], moet geschieden overeenkomstig de desbetreffende in het register opgenomen
      bereidingswijze en, voor zover daarbij controles moeten worden verricht, met gebruikmaking van de desbetreffende in
      het register opgenomen analyse- en andere controlemethodieken.


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel23
    url: https://wetten.overheid.nl/BWBR0003127/1999-11-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0003127
        artikel: '23'
        paragraaf: '3'
  - number: '25'
    text: |-
      1 Van het verrichten van een deelbewerking of van een onderdeel van de bereiding van een charge als bedoeld
      in [artikel 23, eerste lid][ref1], moet een genummerd protocol worden bijgehouden, waaruit blijkt dat de
      desbetreffende in het register opgenomen bereidingswijze is gevolgd.

      2 Een in het eerste lid bedoelde protocol moet voorts de volgende gegevens bevatten:

      a. de benaming van het farmaceutische product;

      b. de kwalitatieve en kwantitatieve samenstelling van het farmaceutische product;

      c. in het geval bedoeld in het derde lid, de nummers van de in dat lid bedoelde protocollen;

      d. de datum van de aanvang en die van de beëindiging van het verrichten van de deelbewerking of van het onderdeel
      van de bereiding van een charge;

      e. de naam en het adres van de opdrachtgever.

      3 Voor zover bij het verrichten van een deelbwerking of van een onderdeel van de bereiding van een charge controles
      worden verricht, moeten van die verrichtingen genummerde protocollen worden bijgehouden, waaruit blijkt dat de
      controles zijn verricht met gebruikmaking van de desbetreffende in het register opgenomen analyse- en andere
      controlemethodieken. De protocollen moeten voorts de in [artikel 9, derde lid, onder ][ref2] bedoelde gegevens
      bevatten.

      4 De in het eerste en derde lid bedoelde protocollen moeten zijn ondertekend door de persoon, onder wiens direkte
      leiding en toezicht een deelbewerking of een onderdeel van de bereiding van een charge heeft plaatsgevonden.

      5 Indien in opdracht en ten behoeve van een ander een charge wordt bereid, zijn [de artikelen 5][ref3]-[7][ref4],
      [8, eerste lid][ref5], [9, eerste lid, onder ][ref6], van overeenkomstige toepassing.

      6 De ingevolge dit artikel opgestelde protocollen, het in [artikel 8, eerste lid, onder ][ref7] bedoelde document
      en de in dat artikellid, [onder ][ref8] en [][ref9] bedoelde monsters moeten worden verstrekt aan de opdrachtgever,
      ten behoeve van wie de desbetreffende werkzaamheden zijn verricht.


