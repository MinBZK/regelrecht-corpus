  - number: '3'
    text: De fabrikant draagt zorg dat wordt voldaan aan de bepalingen van deze paragraaf.
    url: https://wetten.overheid.nl/BWBR0003127/1999-11-01#Artikel3
  - number: '4'
    text: |-
      Wijzigingen in de gegevens welke ingevolge [artikel 2, eerste lid, onder ][ref1], voor wat betreft de inrichting
      van het perceel of de percelen, *d* en *e*, zijn verstrekt, moeten voor het eind van het kalenderjaar waarin de
      wijziging heeft plaatsgevonden ter kennis worden gebracht van Onze Minister en van de hoofdinspecteur. Van elke
      andere wijziging in de gegevens welke ingevolge [artikel 2][ref2] zijn verstrekt moet onverwijld kennis worden
      gegeven aan Onze Minister en de hoofdinspecteur.


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003127#Artikel2
