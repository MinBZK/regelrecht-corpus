---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_bereiding_en_aflevering_van_farmaceutische_producten
regulatory_layer: AMVB
publication_date: '2007-03-20'
valid_from: '2007-01-01'
bwb_id: BWBR0003127
url: https://wetten.overheid.nl/BWBR0003127/2007-01-01
preamble:
  text: |-
    Wij Juliana, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Op de voordracht van de Staatssecretaris van Volksgezondheid en Milieuhygiëne van 25 april 1977, DG Vgz/GMI, no.
    129830;

    Overwegende dat het noodzakelijk is de regelen inzake de produktie en distributie van geneesmiddelen aan te passen
    aan de richtlijnen van de Raad van de Europese Gemeenschappen van 26 januari 1965 (65/65/EEG), van 20 mei 1975
    (75/318/EEG) en van 20 mei 1975 (75/319/EEG);

    Gelet op de artikelen 1, derde lid, en 26, onder f, g, en i, van de Wet op de Geneesmiddelenvoorziening (Stb. 1958,
    408);

    Gezien het advies van de Geneesmiddelencommissie;

    De Raad van State gehoord (advies van 15 juni 1977, no. 19b);

    Gezien het nader rapport van de Staatssecretaris van Volksgezondheid en Milieuhygiëne van 25 augustus 1977, DG Vgz/
    GMI, no. 131384;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel1
  - number: 1.1.a
    text: |-
      wet: [Wet op de Geneesmiddelenvoorziening][ref1] (Stb. 1958, 408);


      [ref1]: https://wetten.overheid.nl/BWBR0002290
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002290
  - number: 1.1.b
    text: 'farmaceutisch product: farmaceutische specialité of farmaceutisch preparaat;'
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel1
  - number: 1.1.c
    text: |-
      fabrikant: degene aan wie krachtens [artikel 2, eerste lid, onder d, onderscheidenlijk vierde lid, van de wet][ref1]
      een vergunning is verleend tot het bereiden en afleveren van farmaceutische producten onderscheidenlijk
      geneesmiddelen voor onderzoek;


      [ref1]: https://wetten.overheid.nl/BWBR0002290#Artikel2
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002290
        artikel: '2'
  - number: 1.1.d
    text: |-
      loonfabrikant: degene aan wie krachtens
      [artikel 2, eerste lid, onder d, onderscheidenlijk vierde lid, van de wet][ref1] een vergunning is verleend tot
      het verrichten van een of meer deelbewerkingen van de bereiding van farmaceutische producten onderscheidenlijk
      geneesmiddelen voor onderzoek of tot het bereiden van zodanige farmaceutische producten of geneesmiddelen voor
      onderzoek uitsluitend in opdracht van en ten behoeve van een ander;


      [ref1]: https://wetten.overheid.nl/BWBR0002290#Artikel2
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002290
        artikel: '2'
  - number: 1.1.e
    text: |-
      importeur: degene die farmaceutische producten of geneesmiddelen voor onderzoek invoert en aan wie krachtens
      [artikel 2, eerste lid, onder d, onderscheidenlijk vijfde lid, van de wet][ref1] een vergunning is verleend voor
      het afleveren daarvan;


      [ref1]: https://wetten.overheid.nl/BWBR0002290#Artikel2
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002290
        artikel: '2'
  - number: 1.1.f
    text: |-
      parallel-groothandelaar: ieder die een in een andere lid-staat in de handel gebracht farmaceutisch
      product uit die lid-staat betrekt in de verpakking waarin het in die lid-staat in de handel wordt
      gebracht en aan wie, ten behoeve van het in Nederland in de handel brengen van dat product, krachtens
      [artikel 2, eerste lid, onder d, van de wet][ref1] vergunning is verleend tot het verpakken, etiketteren en
      afleveren;


      [ref1]: https://wetten.overheid.nl/BWBR0002290#Artikel2
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002290
        artikel: '2'
  - number: 1.1.g
    text: |-
      groothandelaar: ieder, niet zijnde een persoon als bedoeld onder e, aan wie krachtens
      [artikel 2, eerste lid, onder d, van de wet][ref1] vergunning is verleend uitsluitend tot het afleveren van
      farmaceutische producten;


      [ref1]: https://wetten.overheid.nl/BWBR0002290#Artikel2
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002290
        artikel: '2'
  - number: 1.1.h
    text: |-
      charge: hoeveelheid eenheden van een farmaceutisch product of een geneesmiddel voor onderzoek in een farmaceutische
      vorm die uit één homogene uitgangsmassa is bereid en dezelfde reeks van bereidingshandelingen heeft ondergaan;
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel1
  - number: 1.1.i
    text: |-
      register: register van farmaceutische specialités of van farmaceutische preparaten, bedoeld in
      [artikel 3, eerste lid, van de wet][ref1] en het communautaire geneesmiddelenregister, bedoeld in artikel 12,
      eerste lid, van de Europese registratie-verordening;


      [ref1]: https://wetten.overheid.nl/BWBR0002290#Artikel3
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002290
        artikel: '3'
  - number: 1.1.j
    text: |-
      registratiehouder: degeen te wiens name een farmaceutisch product in het desbetreffende register staat
      ingeschreven;
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel1
  - number: 1.1.k
    text: |-
      controles: analyses en andere controles met betrekking tot welke in het register de analyse- en andere
      controlemethodieken zijn opgenomen;
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel1
  - number: 1.1.l
    text: |-
      lidstaat: een land dat lid is van de Europese Unie of een ander land dat partij is bij de Overeenkomst inzake de
      Europese Economische Ruimte;
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel1
  - number: 1.1.m
    text: |-
      Europese registratie-verordening: de [verordening (EEG) nr. 2309/93](31993R2309) van de Raad van de Europese
      Gemeenschappen van 22 juli 1993 tot vaststelling van communautaire procedures voor het verlenen van vergunningen
      voor en het toezicht op geneesmiddelen voor menselijk en diergeneeskundig gebruik en tot oprichting van een
      Europees bureau voor de geneesmiddelenbeoordeling (PbEG L 214);
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel1
  - number: 1.1.n
    text: |-
      diensten van de informatiemaatschappij: diensten die normaal tegen vergoeding op afstand langs elektronische weg en
      op individueel verzoek van afnemers van zodanige diensten worden verricht;
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel1
  - number: 1.1.o
    text: |-
      postorderfarmacie: het per post of per koerier afleveren van farmaceutische producten die door een individuele
      afnemer per post, telefoon, telefax of door gebruikmaking van diensten van de informatiemaatschappij zijn besteld;
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel1
  - number: 1.1.p
    text: |-
      onderzoekersdossier: een dossier als bedoeld in
      [artikel 1, eerste lid, onder p, van de Wet medisch-wetenschappelijk onderzoek met mensen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009408#Artikel1
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009408
        artikel: '1'
  - number: 1.1.q
    text: |-
      [richtlijn 2001/83](32001L0083): [Richtlijn 2001/83/EG](32001L0083) van het Europees Parlement en de Raad van
      6 november 2001 tot vaststelling van een communautair wetboek betreffende geneesmiddelen voor menselijk gebruik
      (PbEG L 311);
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel1
  - number: 1.1.r
    text: |-
      [richtlijn 2001/20](32001L0020): [Richtlijn 2001/20/EG](32001L0020) van het Europees Parlement en de Raad
      van 4 april 2001 betreffende de onderlinge aanpassing van de wettelijke en bestuursrechtelijke bepalingen van
      de lidstaten inzake de toepassing van goede klinische praktijken bij de uitvoering van klinische proeven met
      geneesmiddelen voor menselijk gebruik (PbEG L 121);
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel1
  - number: 1.1.s
    text: |-
      invoeren: het binnen het grondgebied van Nederland brengen van farmaceutische producten of geneesmiddelen voor
      onderzoek vanuit een ander land dan een lidstaat.
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel1
  - number: '1.2'
    text: |-
      Met een lidstaat wordt gelijkgesteld een andere staat die partij is bij de Overeenkomst betreffende de Europese
      Economische Ruimte.
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel1
  - number: '2.1'
    text: |-
      Een aanvraag ter verkrijging van een vergunning als bedoeld in [artikel 1, onder c ][ref1], moet de volgende
      gegevens bevatten:


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel1
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003127
        artikel: '1'
        paragraaf: '1'
  - number: 2.1.a
    text: |-
      de naam en het adres van de aanvrager, alsmede de voornamen van de aanvrager in geval deze een natuurlijk persoon
      is;
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel2
  - number: 2.1.b
    text: |-
      een opgave van de farmaceutische producten of de geneesmiddelen voor onderzoek die zullen worden bereid en van
      de farmaceutische vormen daarvan alsmede, voor zover het geneesmiddelen voor onderzoek betreft, om welke van de
      volgende soorten het gaat:
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel2
  - number: 2.1.b.1°
    text: bloedproducten;
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel2
  - number: 2.1.b.2°
    text: immunologische producten;
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel2
  - number: 2.1.b.3°
    text: celtherapieproducten;
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel2
  - number: 2.1.b.4°
    text: gentherapieproducten;
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel2
  - number: 2.1.b.5°
    text: biotechnologieproducten;
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel2
  - number: 2.1.b.6°
    text: producten afkomstig van mensen of dieren;
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel2
  - number: 2.1.b.7°
    text: kruidenproducten;
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel2
  - number: 2.1.b.8°
    text: homeopathische producten;
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel2
  - number: 2.1.b.9°
    text: radiofarmaceutische producten;
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel2
  - number: 2.1.b.10°
    text: producten die chemische bestanddelen bevatten.
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel2
  - number: 2.1.c
    text: een opgave van de ligging van het perceel of de percelen, waarin
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel2
  - number: 2.1.c.1°
    text: |-
      de bereiding van de farmaceutische producten of geneesmiddelen voor onderzoek en het verrichten van controles zal
      plaatsvinden;
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel2
  - number: 2.1.c.2°
    text: de farmaceutische producten of geneesmiddelen voor onderzoek zullen worden bewaard;
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel2
  - number: 2.1.c.3°
    text: |-
      de substanties, hulpstoffen en halffabrikaten, dienende voor de bereiding van farmaceutische producten of
      geneesmiddelen voor onderzoek, zullen worden bewaard;
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel2
  - number: 2.1.d
    text: |-
      een opgave van de aard en de omvang van de bedrijfswerkzaamheden en van de uitrusting waarover de aanvrager in
      verband met die bedrijfswerkzaamheden zal beschikken alsmede, voor zover het geneesmiddelen voor onderzoek betreft,
      een precieze beschrijving van het bereidingsprocédé en de bereidingshandelingen;
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel2
  - number: 2.1.e
    text: |-
      een opgave van het aantal wetenschappelijk gevormde personen en van het aantal technisch geschoolde personen
      die met de direkte leiding van de bereiding van farmaceutische producten of geneesmiddelen voor onderzoek en het
      verrichten van controles zullen worden belast, onder aanduiding van de wetenschappelijke of technische kwalifikatie
      van die personen;
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel2
  - number: 2.1.f
    text: |-
      de naam en het adres van de persoon of personen, bedoeld in [artikel 5, eerste of tweede lid][ref1], onder wiens
      of wier leiding en toezicht de bereiding van farmaceutische producten of geneesmiddelen voor onderzoek en het
      verrichten van controles zal geschieden, alsmede een nauwkeurige omschrijving van zijn of hun werkzaamheden en van
      zijn of hun verantwoordelijkheden, onder vermelding van al die gegevens waaruit blijkt dat de in dat lid genoemde
      taak metterdaad zal kunnen worden vervuld;


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel5
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003127
        artikel: '5'
        paragraaf: '2'
  - number: 2.1.g
    text: |-
      een door de onder *f* bedoelde persoon onderscheidenlijk een door elk van de onder *f* bedoelde personen
      ondertekende verklaring, dat hij de werkzaamheden overeenkomstig de onder *f* bedoelde omschrijving zal verrichten
      en de verantwoordelijkheid daarvoor aanvaardt.
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel2
  - number: '2.2'
    text: |-
      Indien de aanvrager voornemens is de bereiding van farmaceutische producten of geneesmiddelen voor onderzoek
      of het verrichten van controles te doen geschieden onder leiding en toezicht van een persoon als bedoeld in
      [artikel 5, tweede lid][ref1], moet de aanvraag de in dat artikellid bedoelde redenen bevatten.


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel5
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003127
        artikel: '5'
        paragraaf: '2'
  - number: '2.3'
    text: |-
      Indien de aanvrager voornemens is één of meer deelbewerkingen van de bereiding van een farmaceutisch product of
      geneesmiddel voor onderzoek of de bereiding van een farmaceutisch product of geneesmiddel voor onderzoek te doen
      verrichten door een loonfabrikant of één of meer deelbewerkingen te doen verrichten door een in het buitenland
      gevestigde tot het bereiden van farmaceutische producten of geneesmiddelen voor onderzoek bevoegde persoon, moet
      de aanvraag tevens bevatten een opgave van de desbetreffende deelbewerking of deelbewerkingen, onderscheidenlijk
      de vermelding van het farmaceutische product of geneesmiddel voor onderzoek, de naam van de loonfabrikant
      onderscheidenlijk die van de in het buitenland gevestigde bevoegde persoon, alsmede een opgave van de ligging
      van het perceel waarin de deelbewerking of deelbewerkingen zal of zullen worden verricht, onderscheidenlijk de
      bereiding van het farmaceutische product of geneesmiddel voor onderzoek zal plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel2
  - number: '2.4'
    text: |-
      Indien de aanvrager voornemens is één of meer controles te doen verrichten door een in
      [artikel 5, vierde lid][ref1], bedoeld laboratorium, moet de aanvraag tevens bevatten de gegevens, bedoeld in het
      vijfde lid van dat artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel5
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003127
        artikel: '5'
        paragraaf: '2'
  - number: '2.5'
    text: 'Bij een aanvraag moet worden overgelegd:'
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel2
  - number: 2.5.a
    text: een uittreksel uit het handelsregister, en
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel2
  - number: 2.5.b
    text: in geval de aanvrager een rechtspersoon is, de statuten van die rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel2
  - number: '2.6'
    text: |-
      Onze Minister stelt de aanvrager binnen 90 dagen na de datum van ontvangst van de aanvraag in kennis van zijn
      beslissing. Ingeval het voor de beoordeling van de aanvraag noodzakelijk is dat door de aanvrager nadere gegevens
      worden verstrekt, wordt de in de eerste volzin genoemde termijn opgeschort van de datum waarop om deze gegevens
      wordt verzocht tot de datum van ontvangst van die gegevens.
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel2
  - number: '2.7'
    text: |-
      Het eerste lid tot en met vijfde lid is niet van toepassing op een aanvraag om een vergunning voor het bereiden en
      afleveren van geneesmiddelen voor onderzoek voor zover gegevens of bescheiden als bedoeld in die artikelleden reeds
      in het bezit zijn van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel2
  - number: 2a
    text: |-
      Een vergunning voor het bereiden van geneesmiddelen voor onderzoek geldt alleen voor de bereiding in de in de
      aanvraag vermelde percelen en voor de desbetreffende types en farmaceutische vormen van de geneesmiddelen voor
      onderzoek.
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel2a
  - number: '3'
    text: De fabrikant draagt zorg dat wordt voldaan aan de bepalingen van deze paragraaf.
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel3
  - number: '4.1'
    text: |-
      De fabrikant brengt zonder vergunning van Onze Minister geen wijzigingen aan in feiten of
      omstandigheden die zijn beschreven in de door hem verstrekte gegevens en bescheiden, bedoeld in
      [artikel 2, eerste tot en met vijfde lid][ref1]. Indien een persoon als bedoeld in [artikel 5][ref2] onverwachts
      wordt vervangen, wordt de vergunning onverwijld aangevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003127#Artikel5
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003127
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0003127
        artikel: '5'
        paragraaf: '2'
  - number: '4.2'
    text: |-
      Onze Minister stelt de fabrikant zo spoedig mogelijk, doch uiterlijk binnen dertig dagen na ontvangst van de
      aanvraag om een vergunning als bedoeld in het eerste lid, in kennis van zijn besluit. In bijzondere gevallen kan
      die periode worden verlengd tot negentig dagen.
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel4
  - number: '5.1'
    text: |-
      De bereiding van farmaceutische producten en het verrichten van controles daarop geschieden onder leiding en
      toezicht van een persoon die voldoet aan artikel 49 van [richtlijn 2001/83](32001L0083) dan wel op wie artikel 50,
      eerste lid, van die richtlijn van toepassing is. De bereiding van geneesmiddelen voor onderzoek of het verrichten
      van controles daarop geschieden onder leiding en toezicht van een persoon die voldoet aan artikel 49 van [richtlijn
      2001/83](32001L0083) dan wel op wie artikel 13, vijfde lid, van [richtlijn 2001/20](32001L0020) van toepassing is.
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel5
  - number: '5.2'
    text: |-
      Onze Minister kan, indien gewichtige redenen daartoe aanleiding geven, toestaan dat de bereiding of een onderdeel
      van de bereiding van farmaceutische producten of geneesmiddelen voor onderzoek dan wel het verrichten van
      controles daarop geschiedt onder leiding en toezicht van een persoon die ten minste twee jaren direct betrokken
      is geweest bij de industriële bereiding van farmaceutische producten dan wel bij de bereiding van geneesmiddelen
      voor onderzoek en een met het oog op die taak adequaat examen aan een instelling voor wetenschappelijk onderwijs
      met goed gevolg heeft afgelegd. De toestemming kan onder beperkingen worden verleend en aan de toestemming kunnen
      voorschriften worden verbonden. De toestemming kan worden ingetrokken indien de in de eerste volzin bedoelde
      persoon ernstig tekortschiet in de uitoefening van zijn functie.
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel5
  - number: '5.3'
    text: |-
      Voor de bereiding van farmaceutische producten of geneesmiddelen voor onderzoek en het verrichten van controles
      moet, in overeenstemming met de aard en omvang van de krachtens de vergunning toegestane bedrijfswerkzaamheden,
      worden beschikt over wetenschappelijk gevormd en over technisch geschoold personeel.
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel5
  - number: '5.4'
    text: |-
      Onze Minister kan op verzoek van de fabrikant toestaan dat één of meer controles worden verricht door een door Onze
      Minister daartoe erkend laboratorium. Een laboratorium wordt door Onze Minister erkend indien:
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel5
  - number: 5.4.a
    text: het beschikt over de voor het verrichten van controles geëigende uitrusting en lokalen;
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel5
  - number: 5.4.b
    text: |-
      de controles worden verricht onder leiding en toezicht van een apotheker of een persoon, die een met het oog op
      het verrichten van controles aanvaardbaar examen aan een instelling van wetenschappelijk onderwijs met goed gevolg
      heeft afgelegd;
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel5
  - number: 5.4.c
    text: |-
      het met het oog op het verrichten van controles beschikt over wetenschappelijk gevormd en over technisch geschoold
      personeel.
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel5
  - number: '5.5'
    text: 'Een in het vierde lid bedoeld verzoek moet:'
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel5
  - number: 5.5.a
    text: met redenen zijn omkleed;
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel5
  - number: 5.5.b
    text: een opgave bevatten van de desbetreffende controles;
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel5
  - number: 5.5.c
    text: de naam en het adres van het laboratorium bevatten.
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel5
  - number: '5.6'
    text: |-
      Een toestemming als in het vierde lid bedoeld is niet vereist indien één of meer controles wegens bijzondere
      omstandigheden tijdelijk niet kunnen worden verricht. In zodanig geval moet hiervan, onder opgave van de reden en
      de naam en het adres van het laboratorium onverwijld kennis worden gegeven aan de hoofdinspecteur.
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel5
  - number: '6.1'
    text: |-
      De bereiding van farmaceutische producten of geneesmiddelen voor onderzoek en het verrichten van controles op die
      bereiding moet geschieden in daartoe bestemde lokalen en met gebruikmaking van daarvoor geëigende uitrusting. In de
      bereidingslokalen mogen geen andere producten dan farmaceutische producten of geneesmiddelen voor onderzoek worden
      bereid.
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel6
  - number: '6.2'
    text: |-
      Onze Minister kan desgevraagd toestaan dat in de in het eerste lid bedoelde bereidingslokalen met name genoemde
      andere producten dan die bedoeld in het eerste lid, geheel of gedeeltelijk worden bereid. De toestemming kan onder
      beperkingen worden verleend en aan de toestemming kunnen voorschriften worden verbonden. De toestemming kan worden
      ingetrokken indien wordt gehandeld in strijd met de aan die toestemming verbonden voorschriften, dan wel blijkt dat
      de bereiding van het product, waarvoor de toestemming is verleend, de bereiding van de in het eerste lid bedoelde
      producten ongunstig beïnvloedt.
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel6
  - number: '6.3'
    text: 'De in het eerste lid bedoelde lokalen moeten:'
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel6
  - number: 6.3.a
    text: |-
      deugdelijk zijn ingericht, zulks in overeenstemming met de eisen, voortvloeiende uit de aard van de daar te
      verrichten deelbewerking van de bereiding;
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel6
  - number: 6.3.b
    text: |-
      zo zijn ingericht en afgewerkt, dat zij, met inbegrip van de daarin aanwezige uitrusting, gemakkelijk kunnen worden
      gereinigd;
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel6
  - number: 6.3.c
    text: in ordelijke en zindelijke toestand verkeren.
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel6
  - number: '6.4'
    text: |-
      Met betrekking tot de bereiding van farmaceutische producten of geneesmiddelen voor onderzoek moeten voldoende
      voorzorgen zijn genomen teneinde te voorkomen dat:
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel6
  - number: 6.4.a
    text: |-
      verontreiniging plaatsvindt van de in het eerste lid bedoelde lokalen en uitrusting, alsmede van substanties,
      hulpstoffen, halffabrikaten, farmaceutische producten of geneesmiddelen voor onderzoek;
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel6
  - number: 6.4.b
    text: |-
      verwisseling plaatsvindt van substanties, hulpstoffen, halffabrikaten, farmaceutische producten of geneesmiddelen
      voor onderzoek en verpakkingsmateriaal.
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel6
  - number: '7'
    text: |-
      De bereiding van een farmaceutisch product en het verrichten van controles geschieden overeenkomstig de in het
      register opgenomen bereidingswijze onderscheidenlijk met gebruikmaking van de in het register opgenomen analyse-
      en andere controlemethodieken en is overigens in overeenstemming met de bij ministeriële regeling vast te leggen
      beginselen inzake goede praktijken bij de bereiding van farmaceutische producten. De bereiding van een geneesmiddel
      voor onderzoek en het verrichten van controles geschieden overeenkomstig de productspecificatie, de informatie
      die is opgenomen in het onderzoekersdossier en de bij ministeriële regeling vast te leggen beginselen inzake goede
      praktijken bij de bereiding van geneesmiddelen voor onderzoek.
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel7
  - number: '8.1'
    text: 'Met betrekking tot elke charge van farmaceutische producten, bereid in Nederland:'
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel8
  - number: 8.1.a
    text: |-
      moet van het bereiden van het farmaceutische product een genummerd protocol worden bijgehouden, waaruit blijkt dat
      de bereiding is geschied overeenkomstig de in het register opgenomen bereidingswijze;
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel8
  - number: 8.1.b
    text: |-
      moeten van het verrichten van controles van de voor de bereiding van het farmaceutische product gebruikte
      bestanddelen en van het farmaceutische product genummerde protocollen worden bijgehouden, waaruit blijkt dat
      de controles zijn verricht met gebruikmaking van de desbetreffende in het register opgenomen analyse- en andere
      controlemethodieken;
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel8
  - number: 8.1.c
    text: 'moet een document worden opgemaakt waarin de volgende gegevens zijn vermeld:'
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel8
  - number: 8.1.c.1°
    text: de benaming van het farmaceutische product;
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel8
  - number: 8.1.c.2°
    text: de kwalitatieve en kwantitatieve samenstelling van de werkzame bestanddelen van het farmaceutische product;
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel8
  - number: 8.1.c.3°
    text: de verkregen grootte van de charge van het farmaceutische product en een code ter aanduiding van die charge;
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel8
  - number: 8.1.c.4°
    text: zo nodig, instructies voor het verpakken;
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel8
  - number: 8.1.d
    text: |-
      moet een monster van elk van de voor de bereiding van het farmaceutische product gebruikte bestanddelen worden
      aangehouden, zulks in voldoende hoeveelheid voor het verrichten van controles;
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel8
  - number: 8.1.e
    text: |-
      moet een monster van het farmaceutische product worden aangehouden, zulks in voldoende hoeveelheid voor het
      verrichten van kwalitatieve controles van het farmaceutische product en voor het verrichten van kwantitatieve
      controles op tenminste alle werkzame bestanddelen.
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel8
  - number: '8.2'
    text: 'Met betrekking tot elke ingevoerde charge van farmaceutische producten of elk deel daarvan:'
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel8
  - number: 8.2.a
    text: |-
      moet aanwezig zijn een protocol als bedoeld in het eerste lid, onder *a*, opgesteld door degeen die het
      farmaceutische product in dat land heeft bereid;
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel8
  - number: 8.2.b
    text: |-
      moeten aanwezig zijn protocollen als bedoeld in het eerste lid, onder *b*, opgesteld door degeen die het
      farmaceutische product in dat land heeft bereid;
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel8
  - number: 8.2.c
    text: |-
      moet, met gebruikmaking van de desbetreffende in het register opgenomen analyse- en andere controlemethodieken,
      worden onderzocht of het farmaceutische product in kwalitatieve samenstelling en voor wat betreft de werkzame
      bestanddelen in kwantitatieve samenstelling overeenstemt met de in het register opgenomen samenstelling;
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel8
  - number: 8.2.d
    text: |-
      moeten van de verrichte controles, bedoeld [onder ][ref1], genummerde protocollen worden bijgehouden, waaruit
      blijkt dat de controles zijn verricht met gebruikmaking van de in dat onderdeel bedoelde analyse- en andere
      controlemethodieken;


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel8
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003127
        artikel: '8'
        paragraaf: '2'
  - number: 8.2.e
    text: is het eerste lid, onder *c* en *e*, van toepassing.
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel8
  - number: '8.3'
    text: 'Met betrekking tot elk charge van farmaceutische producten of elk deel daarvan, betrokken uit een lidstaat:'
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel8
  - number: 8.3.a
    text: |-
      moeten, indien de charge of het deel van de charge in die lid-staat is bereid, aanwezig zijn protocollen als
      bedoeld in het eerste lid, onder *b*, opgesteld door degeen die het farmaceutische product in die lid-staat heeft
      bereid;
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel8
  - number: 8.3.b
    text: |-
      moeten, indien de charge of het deel van een charge in die lid-staat is ingevoerd vanuit een ander land dan
      een lid-staat, aanwezig zijn protocollen, waaruit blijkt dat de in die lid-staat gevestigde importeur, met
      gebruikmaking van de desbetreffende in het register opgenomen analyse- en andere controlemethodieken, heeft
      onderzocht of het farmaceutische product in kwalitatieve samenstelling en voor wat betreft de werkzame bestanddelen
      in kwantitatieve samenstelling overeenstemt met de in het register opgenomen samenstelling;
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel8
  - number: 8.3.c
    text: is het eerste lid, onder *c* en *e*, van toepassing.
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel8
  - number: '8.4'
    text: |-
      De in het tweede lid, onder *a* en *b*, en derde lid bedoelde protocollen moeten door de in
      [artikel 5, eerste of tweede lid][ref1], bedoelde persoon worden gecontroleerd en, indien zij voldoen aan de
      desbetreffende bepalingen van dit artikel en [artikel 9][ref2], door die persoon voor akkoord worden getekend.


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0003127#Artikel9
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003127
        artikel: '5'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0003127
        artikel: '9'
        paragraaf: '2'
  - number: '8.5'
    text: |-
      Indien een deelbewerking of een onderdeel van de bereiding van een charge van farmaceutische producten als bedoeld
      in [artikel 23, eerste lid][ref1], wordt verricht door een loonfabrikant dan wel door een in het buitenland
      gevestigde tot het bereiden van farmaceutische producten bevoegde persoon, moeten de in het register vervatte
      gegevens welke betrekking hebben op de te verrichten deelbewerking onderscheidenlijk onderdeel van de bereiding
      van een charge van farmaceutische producten ter beschikking van de desbetreffende persoon worden gesteld. Indien
      de in de eerste volzin bedoelde verrichtingen in het buitenland hebben plaatsgevonden, moeten van die verrichtingen
      protocollen als bedoeld in [artikel 25, eerste of derde lid][ref2], aanwezig zijn, opgesteld door de in het
      buitenland gevestigde bevoegde persoon.


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0003127#Artikel25
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003127
        artikel: '23'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0003127
        artikel: '25'
        paragraaf: '3'
  - number: '8.6'
    text: |-
      Het eerste lid, onder *e*, is niet van toepassing ingeval voor het kunnen verrichten van de daarin
      bedoelde controles van het farmaceutische product voldoende eenheden in een verpakking als bedoeld in
      [artikel 11, tweede lid][ref1], worden aangehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel11
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003127
        artikel: '11'
        paragraaf: '2'
  - number: 8a.1
    text: |-
      De fabrikant draagt ervoor zorg dat de in [artikel 5, eerste lid][ref1], bedoelde persoon met betrekking tot
      elke charge van geneesmiddelen voor onderzoek ter zake waarvan hij heeft vastgesteld dat aan het bij en krachtens
      [artikel 7, tweede volzin][ref2], bepaalde is voldaan, dit in een door hem ondertekend document vastlegt.


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0003127#Artikel7
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0003127
        artikel: '5'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0003127
        artikel: '7'
        paragraaf: '2'
  - number: 8a.2
    text: |-
      Het in het eerste lid bedoelde document wordt bij iedere verrichtingbijgesteld en wordt ten minste vijf jaren
      bewaard, te rekenen vanaf de datum waarop de laatste klinische proef met gebruikmaking van de geneesmiddelen voor
      onderzoek van de desbetreffende charge is beëindigd.
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel8a
  - number: '9.1'
    text: |-
      Een in [artikel 8, eerste lid, onder ][ref1], bedoeld protocol moet voorts de volgende gegevens bevatten:


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel8
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003127
        artikel: '8'
        paragraaf: '2'
  - number: 9.1.a
    text: de benaming van het farmaceutische product;
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel9
  - number: 9.1.b
    text: de kwalitatieve en kwantitatieve samenstelling van het farmaceutische product;
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel9
  - number: 9.1.c
    text: de gebruikte hoeveelheden van de bestanddelen van het farmaceutische product;
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel9
  - number: 9.1.d
    text: |-
      de nummers van de controleprotocollen, bedoeld [onder ][ref1], van genoemd artikellid;


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel9
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003127
        artikel: '9'
        paragraaf: '2'
  - number: 9.1.e
    text: de berekende en de verkregen grootte van de charge;
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel9
  - number: 9.1.f
    text: de datum van aanvang en die van beëindiging van de bereiding van de charge;
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel9
  - number: 9.1.g
    text: |-
      indien een deelbewerking of een onderdeel van de bereiding van een charge als bedoeld in
      [artikel 23, eerste lid][ref1], is verricht door een loonfabrikant:


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel23
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003127
        artikel: '23'
        paragraaf: '3'
  - number: 9.1.g.1°
    text: de vermelding van de deelbewerking onderscheidenlijk van het onderdeel van de bereiding van een charge;
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel9
  - number: 9.1.g.2°
    text: |-
      de nummers van de in [artikel 25, eerste onderscheidenlijk derde lid][ref1], bedoelde protocollen;


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel25
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003127
        artikel: '25'
        paragraaf: '3'
  - number: 9.1.g.3°
    text: de naam en het adres van de loonfabrikant;
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel9
  - number: 9.1.h
    text: |-
      indien een deelbewerking of een onderdeel van de bereiding van een charge als bedoeld in
      [artikel 25, eerste lid][ref1], is verricht door een in het buitenland gevestigde tot het bereiden van
      farmaceutische producten bevoegde persoon:


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel25
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003127
        artikel: '25'
        paragraaf: '3'
  - number: 9.1.h.1°
    text: de vermelding van de deelbewerking onderscheidenlijk van het onderdeel van de bereiding van een charge;
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel9
  - number: 9.1.h.2°
    text: |-
      de nummers van de in [artikel 25, eerste onderscheidenlijk derde lid][ref1], bedoelde protocollen;


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel25
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003127
        artikel: '25'
        paragraaf: '3'
  - number: 9.1.h.3°
    text: |-
      de naam en het adres van de in het buitenland gevestigde persoon, die de desbetreffende werkzaamheden heeft
      verricht.
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel9
  - number: '9.2'
    text: |-
      In een in [artikel 8, tweede lid, onder ][ref1], bedoeld protocol moeten door de in dat artikelonderdeel bedoelde
      persoon eveneens zijn vermeld de gegevens, bedoeld in het eerste lid, onder *a-c, e* en *f*, alsmede de nummers
      van de controleprotocollen, betrekking hebbende op de controles van de bestanddelen van het farmaceutische
      product. Door de fabrikant moeten in het protocol, bedoeld in de eerste volzin, worden vermeld de nummers van de
      controleprotocollen, bedoeld in [artikel 8, tweede lid, onder ][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0003127#Artikel8
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003127
        artikel: '8'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0003127
        artikel: '8'
        paragraaf: '2'
  - number: '9.3'
    text: |-
      De in [artikel 8, eerste lid, onder ][ref1], bedoelde protocollen moeten voorts de volgende gegevens bevatten:


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel8
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003127
        artikel: '8'
        paragraaf: '2'
  - number: 9.3.a
    text: |-
      voor wat betreft een onderzoekprotocol van een bestanddeel van het farmaceutische product, de naam en het adres van
      de leverancier van dat bestanddeel;
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel9
  - number: 9.3.b
    text: de datum van de verrichte controles, alsmede de verkregen uitkomsten van die controles;
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel9
  - number: 9.3.c
    text: |-
      bij de onder *b* bedoelde uitkomsten, het woord "conform" of een term van gelijke strekking, ingeval de
      desbetreffende uitkomst de overeenstemming met het desbetreffende in het register opgenomen gegeven aantoont, dan
      wel "niet conform" of een term van gelijke strekking, ingeval de desbetreffende uitkomst die overeenstemming niet
      aantoont.
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel9
  - number: '9.4'
    text: |-
      In de in [artikel 8, tweede lid, onder ][ref1], bedoelde protocollen moeten door degeen die het farmaceutische
      product in het buitenland heeft bereid eveneens de in het derde lid, onder *b* en *c*, bedoelde gegevens zijn
      vermeld. In de in artikel 8, tweede lid, onder *d*, onderscheidenlijk derde lid, onder *b*, bedoelde protocollen
      moeten door de fabrikant eveneens de in het derde lid, onder *b* en *c*, bedoelde gegevens worden vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel8
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003127
        artikel: '8'
        paragraaf: '2'
  - number: '9.5'
    text: |-
      De in [artikel 8][ref1] bedoelde protocollen moeten zijn ondertekend door de persoon, onder wiens leiding en
      toezicht de desbetreffende werkzaamheden hebben plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel8
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003127
        artikel: '8'
        paragraaf: '2'
  - number: '10.1'
    text: |-
      De in [artikel 8, eerste lid, onder ][ref1], bedoelde protocollen en het in [artikel 8, eerste lid, onder ][ref2],
      bedoelde document moeten, behoudens het in het vierde lid bedoelde geval, gedurende ten minste vijf jaren, te
      rekenen vanaf de datum van aanvang van de bereiding van de charge, worden bewaard.


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0003127#Artikel8
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003127
        artikel: '8'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0003127
        artikel: '8'
        paragraaf: '2'
  - number: '10.2'
    text: |-
      De in [artikel 8, tweede lid][ref1], bedoelde protocollen moeten, behoudens het in het vierde lid bedoelde
      geval, gedurende ten minste vijf jaren, te rekenen vanaf de datum van het laatst verrichte onderzoek, bedoeld
      [onder ][ref2], van eerstgenoemd artikellid, worden bewaard.


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0003127#Artikel10
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003127
        artikel: '8'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0003127
        artikel: '10'
        paragraaf: '2'
  - number: '10.3'
    text: |-
      De ingevolge [artikel 8, eerste lid, onder ][ref1], aan te houden monsters en het in
      [artikel 11, tweede lid][ref2], bedoelde exemplaar van het farmaceutische product moeten gedurende hetzelfde
      tijdvak als de daarop betrekking hebbende protocollen op deugdelijke wijze worden bewaard. De monsters moeten
      worden bewaard in een verpakking, welke is voorzien van een zodanige sluiting dat de verpakking niet zonder kenbare
      beschadiging van de sluiting kan worden geopend.


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0003127#Artikel11
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003127
        artikel: '8'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0003127
        artikel: '11'
        paragraaf: '2'
  - number: '10.4'
    text: |-
      Indien een farmaceutisch product, te rekenen vanaf de datum van aanvang van de bereiding van de charge, minder
      dan vijf jaren houdbaar is, behoeven de in het derde lid bedoelde monsters en het bedoelde exemplaar van het
      farmaceutische product, alsmede de daarop betrekking hebbende protocollen slechts te worden bewaard tot de datum
      tot welke het farmaceutische product geschikt voor gebruik wordt geacht.
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel10
  - number: '10.5'
    text: |-
      De in dit artikel bedoelde protocollen, monsters en het bedoelde exemplaar van het farmaceutische product
      moeten gedurende de termijn van bewaring ter beschikking worden gehouden van de personen, bedoeld in
      [artikel 33, eerste lid][ref1], van de wet.


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel33
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003127
        artikel: '33'
        paragraaf: '4'
  - number: '11.1'
    text: |-
      Gedurende het verpakken van een charge van een farmaceutisch product en het etiketteren van de verpakkingen moet
      het op die charge betrekking hebbende document, bedoeld in [artikel 8, eerste lid, onder c ][ref1], aanwezig zijn
      in het lokaal, waarin het verpakken onderscheidenlijk het etiketteren plaatsvindt. Indien de in de eerste volzin
      bedoelde verrichtingen worden opgedragen aan een loonfabrikant moet het document aan deze ter beschikking worden
      gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel8
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0003127
        artikel: '8'
        paragraaf: '2'
  - number: '11.2'
    text: |-
      Indien een farmaceutisch product in de handel wordt gebracht in een verpakking, kennelijk bestemd om het daarin
      aan particuliere verbruikers af te leveren, moet van elke charge een exemplaar van het farmaceutisch product in die
      verpakking worden aangehouden.
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel11
  - number: '14.1'
    text: 'Een farmaceutisch product mag slechts worden afgeleverd, indien:'
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel14
  - number: 14.1.a
    text: |-
      het farmaceutische product in kwalitatieve en kwantitatieve samenstelling overeenstemt met de in het register
      opgenomen samenstelling;
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel14
  - number: 14.1.b
    text: |-
      het farmaceutische product is bereid in overeenstemming met de in het register opgenomen bereidingswijze en
      onderzocht met gebruikmaking van de in het register opgenomen analyse- en andere controlemethodieken;
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel14
  - number: 14.1.c
    text: |-
      het farmaceutische product deugdelijk is verpakt en het voorwerp, waarin het farmaceutische product wordt
      afgeleverd, of de dat voorwerp direkt omsluitende buitenverpakking van een zodanige sluiting is voorzien dat het
      voorwerp onderscheidenlijk de buitenverpakking niet zonder kenbare beschadiging van de sluiting kan worden geopend;
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel14
  - number: 14.1.d
    text: |-
      is voldaan aan [paragraaf 2][ref1] van het Besluit etikettering en bijsluiter farmaceutische producten;


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Paragraaf2
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0003127
        paragraaf: '2'
  - number: 14.1.e
    text: |-
      de bijsluiter voldoet aan [paragraaf 3][ref1] van het besluit, genoemd [onder ][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Paragraaf3
      [ref2]: https://wetten.overheid.nl/BWBR0003127#Artikel14
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0003127
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0003127
        artikel: '14'
        paragraaf: '2'
  - number: 14.1.f
    text: |-
      het farmaceutische product in zodanige toestand verkeert, dat het bij bewaring overeenkomstig het voorschrift op of
      gevoegd bij de verpakking gedurende een redelijke tijd in deugdelijke toestand blijft verkeren.
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel14
  - number: '14.2'
    text: |-
      Indien na aflevering van een farmaceutisch product blijkt dat niet is voldaan aan één der vereisten, gesteld in
      het eerste lid, onder *a* en *b*, moeten alle uit de desbetreffende charge verpakte farmaceutische producten uit
      de handel worden genomen. Indien de uit een charge of een deel van een charge verpakte farmaceutische producten
      na aflevering blijken niet te voldoen aan één der vereisten, gesteld in het eerste lid, onder *c-f*, moeten de uit
      die charge onderscheidenlijk uit dat deel van die charge verpakte farmaceutische producten uit de handel worden
      genomen.
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel14
  - number: '14.3'
    text: |-
      De hoofdinspecteur kan op verzoek van de fabrikant toestaan dat de uit een charge of deel van een charge verpakte
      farmaceutische producten als bedoeld in het tweede lid in de handel blijven indien er sprake is van een geringe
      afwijking en naar het oordeel van de hoofdinspecteur deze afwijking geen gevaar voor de gezondheid van de mens
      oplevert.
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel14
  - number: '14.4'
    text: |-
      Van een ernstige klacht met betrekking tot een afgeleverd farmaceutisch product moet terstond schriftelijk kennis
      worden gegeven aan de hoofdinspecteur.
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel14
  - number: '14.5'
    text: |-
      Degene die verantwoordelijk is voor het in de handel brengen van een farmaceutisch product is verplicht een
      lid-staat waarin dit farmaceutische product onder zijn verantwoordelijkheid in de handel is of wordt gebracht,
      uiterlijk de volgende werkdag en onder opgave van redenen, in kennis te stellen van elke actie die door hem is
      ondernomen om het in de handel brengen van dat farmaceutische product op te schorten of het product uit de handel
      te nemen, indien de actie betrekking heeft op de doeltreffendheid van dat farmaceutisch product of de bescherming
      van de volksgezondheid.
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel14
  - number: 14a.1
    text: |-
      De hoofdinspecteur kan degene die verantwoordelijk is voor het in de handel brengen van een farmaceutisch product,
      verplichten om de handel in dat product op te schorten of dat product uit de handel te nemen, indien niet is
      voldaan aan één van de vereisten, bedoeld in [artikel 14, eerste lid][ref1], of indien de bescherming van de
      volksgezondheid zulks vordert. Artikel 14, vijfde lid, is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel14
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0003127
        artikel: '14'
        paragraaf: '2'
  - number: 14a.2
    text: |-
      Het eerste lid geldt ook voor een farmaceutisch product dat krachtens een bindende uitspraak van de Commissie of de
      Raad van de Europese Gemeenschappen in een procedure als bedoeld in de [artikelen 7][ref1]*e* en [12][ref2], in de
      handel is.


      [ref1]: https://wetten.overheid.nl/BWBR0003114#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0003114#Artikel12a
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0003114
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0003114
        artikel: 12a
  - number: 14a.3
    text: |-
      De hoofdinspecteur geeft van een maatregel tot opschorting van de handel of tot het uit de handel nemen van een
      farmaceutisch product als bedoeld in het tweede lid, uiterlijk op de volgende werkdag kennis aan de Commissie en de
      andere lid-staat of lid-staten waar het product ook in de handel is.
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel14a
  - number: 14a.4
    text: |-
      Indien een maatregel tot opschorting of tot het uit de handel nemen van een product dat in meer lid-staten in de
      handel is, verband houdt met bijwerkingen die een onmiddellijk gevaar voor de volksgezondheid opleveren, geeft
      de hoofdinspecteur van die maatregel uiterlijk op de volgende werkdag kennis aan het Europees Bureau voor de
      geneesmiddelenbeoordeling, bedoeld in artikel 49 van de Europese registratie-verordening.
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel14a
  - number: 14a.5
    text: |-
      De hoofdinspecteur geeft van elke maatregel als bedoeld in dit artikel, onverwijld kennis aan het College ter
      beoordeling van geneesmiddelen.
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel14a
  - number: '15'
    text: |-
      Farmaceutische producten, welke ter aflevering in voorraad worden gehouden, moeten op deugdelijke, zindelijke en
      ordelijke wijze worden bewaard in daartoe bestemde lokalen.
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel15
  - number: '16.1'
    text: |-
      Farmaceutische producten, ten aanzien waarvan [artikel 4, eerste of derde lid, van de wet][ref1] niet van
      toepassing is, mogen, behalve aan de in [artikel 2, eerste lid, onder d , van de wet][ref2] bedoelde categorieën
      van personen en aan ziekenhuizen, eveneens worden afgeleverd:


      [ref1]: https://wetten.overheid.nl/BWBR0002290#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0002290#Artikel2
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0002290
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0002290
        artikel: '2'
  - number: 16.1.a
    text: |-
      aan tandartsen die van hun bevoegdheid tot uitoefening van de tandheelkunst gebruik mogen maken, voor zover het
      betreft farmaceutische producten die in de uitoefening van hun beroep worden gebruikt;
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel16
  - number: 16.1.b
    text: |-
      aan het College ter beoordeling van geneesmiddelen, genoemd in [artikel 29, eerste lid, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002290#Artikel29
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0002290
        artikel: '29'
  - number: 16.1.c
    text: |-
      met uitzondering van farmaceutische producten als monster, aan overheidsinstellingen, welke farmaceutische
      producten in voorraad moeten hebben in het belang van de zorg voor de volksgezondheid in geval van oorlog,
      oorlogsgevaar, daaraan verwante of daarmede verband houdende buitengewone omstandigheden;
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel16
  - number: 16.1.d
    text: 'met uitzondering van farmaceutische producten als monster, aan:'
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel16
  - number: 16.1.d.1°
    text: personen of instellingen, uitsluitend ten behoeve van wetenschappelijk onderzoek,
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel16
  - number: 16.1.d.2°
    text: instellingen, uitsluitend ten behoeve van het onderwijs in de farmacie,
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel16
  - number: 16.1.d.3°
    text: |-
      deskundige personen als bedoeld in [artikel 14, eerste lid, van de Arbeidsomstandighedenwet][ref1] die zijn belast
      met de taken, bedoeld in de onderdelen b of c van dat lid, en arbodiensten als bedoeld in [die wet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0010346
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0010346
  - number: 16.1.e
    text: uitsluitend als monster aan artsen en verloskundigen die praktijk uitoefenen;
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel16
  - number: 16.1.f
    text: aan de Organisatie voor het Verbod van Chemische Wapens.
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel16
  - number: '16.2'
    text: |-
      De in het eerste lid, onder *d,* bedoelde toestemming kan worden verleend onder beperkingen; aan de toestemming
      kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel16
  - number: '16.3'
    text: |-
      Aan verloskundigen mogen slechts monsters van farmaceutische producten worden afgeleverd, welke in de uitoefening
      van haar beroep worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel16
  - number: '19.1'
    text: |-
      Een aanvraag ter verkrijging van een vergunning als bedoeld in [artikel 1, onder d][ref1], moet de volgende
      gegevens bevatten:


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel1
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0003127
        artikel: '1'
        paragraaf: '1'
  - number: 19.1.a
    text: |-
      de naam en het adres van de aanvrager, alsmede de voornamen van de aanvrager ingeval deze een natuurlijk persoon
      is;
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel19
  - number: 19.1.b
    text: |-
      een opgave van de aard en de omvang van de bedrijfswerkzaamheden en van de uitrusting waarover de aanvrager in
      verband met die bedrijfswerkzaamheden zal beschikken;
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel19
  - number: 19.1.c
    text: |-
      een opgave van de ligging van het perceel of de percelen, waarin de onder b bedoelde werkzaamheden zullen worden
      verricht, onder overlegging van een plattegrond van het perceel of de percelen, met vermelding van de bestemming
      der ruimten of lokalen en vergezeld van een nauwkeurige beschrijving van de lokalen, alsmede van de inrichting
      dier lokalen;
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel19
  - number: 19.1.d
    text: |-
      de naam en het adres van de persoon of personen die met de direkte leiding en het toezicht op één of meer
      deelbewerkingen zullen worden belast, onder aanduiding van de wetenschappelijke of technische kwalifikatie van
      die personen.
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel19
  - number: '19.2'
    text: |-
      Indien door de aanvrager in opdracht en ten behoeve van een ander charges van een farmaceutisch product of een
      geneesmiddel voor onderzoek zullen worden bereid, moeten in plaats van de in het eerste lid, onder d, bedoelde
      opgave, de gegevens bedoeld in [artikel 2, leden 1, onder e-g, en 2][ref1] worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel2
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0003127
        artikel: '2'
        paragraaf: '2'
  - number: '19.3'
    text: 'Bij een aanvraag moet worden overgelegd:'
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel19
  - number: 19.3.a
    text: een uittreksel uit het handelsregister, en
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel19
  - number: 19.3.b
    text: in geval de aanvrager een rechtspersoon is, de statuten van die rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel19
  - number: '19.4'
    text: |-
      [Artikel 2, zesde lid][ref1], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel2
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0003127
        artikel: '2'
        paragraaf: '2'
  - number: '20'
    text: De loonfabrikant draagt zorg dat wordt voldaan aan de bepalingen van deze paragraaf.
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel20
  - number: '21'
    text: |-
      Ten aanzien van de loonfabrikant is [artikel 4][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel4
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0003127
        artikel: '4'
        paragraaf: '2'
  - number: '22'
    text: |-
      Een deelbewerking van de bereiding van een farmaceutisch product moet geschieden onder de direkte leiding en
      toezicht van een persoon, die de met betrekking tot de aard van de deelbewerking vereiste wetenschappelijke of
      technische kwalifikatie bezit en ten minste twee jaren betrokken is geweest bij de industriële bereiding van
      farmaceutische producten.
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel22
  - number: '23.1'
    text: |-
      Het verrichten van een deelbewerking of van een onderdeel van de bereiding van een charge, bestaande uit enkele
      opeenvolgende deelbewerkingen, mag slechts geschieden in uitsluitend daartoe bestemde lokalen en met gebruikmaking
      van daarvoor geëigende uitrusting.
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel23
  - number: '23.2'
    text: |-
      Onze Minister kan desgevraagd toestaan dat de in het eerste lid bedoelde lokalen en uitrusting worden gebezigd voor
      andere met name genoemde doeleinden. De toestemming kan onder beperkingen worden verleend en aan de toestemming
      kunnen voorschriften worden verbonden. De toestemming kan worden ingetrokken indien wordt gehandeld in strijd
      met de aan die toestemming verbonden voorschriften, dan wel blijkt dat het doeleinde waarvoor de toestemming is
      verleend, een in het eerste lid bedoelde verrichting ongunstig beïnvloedt.
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel23
  - number: '23.3'
    text: |-
      Met betrekking tot de in het eerste lid bedoelde lokalen is [artikel 6, derde lid][ref1], van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel6
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0003127
        artikel: '6'
        paragraaf: '2'
  - number: '23.4'
    text: |-
      Met betrekking tot de in het eerste lid bedoelde verrichtingen is [artikel 6, vierde lid][ref1], van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel6
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0003127
        artikel: '6'
        paragraaf: '2'
  - number: '24'
    text: |-
      Het verrichten van een deelbewerking of van een onderdeel van de bereiding van een charge van farmaceutische
      producten onderscheidenlijk van geneesmiddelen voor onderzoek geschiedt overeenkomstig het bij en krachtens
      [artikel 7, eerste onderscheidenlijk tweede volzin][ref1], bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel7
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0003127
        artikel: '7'
        paragraaf: '2'
  - number: '25.1'
    text: |-
      Van het verrichten van een deelbewerking of van een onderdeel van de bereiding van een charge van een farmaceutisch
      product, bestaande uit enkele opeenvolgende deelbewerkingen, moet een genummerd protocol worden bijgehouden,
      waaruit blijkt dat de desbetreffende in het register opgenomen bereidingswijze is gevolgd.
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel25
  - number: '25.2'
    text: 'Een in het eerste lid bedoelde protocol moet voorts de volgende gegevens bevatten:'
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel25
  - number: 25.2.a
    text: de benaming van het farmaceutische product;
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel25
  - number: 25.2.b
    text: de kwalitatieve en kwantitatieve samenstelling van het farmaceutische product;
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel25
  - number: 25.2.c
    text: in het geval bedoeld in het derde lid, de nummers van de in dat lid bedoelde protocollen;
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel25
  - number: 25.2.d
    text: |-
      de datum van de aanvang en die van de beëindiging van het verrichten van de deelbewerking of van het onderdeel van
      de bereiding van een charge;
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel25
  - number: 25.2.e
    text: de naam en het adres van de opdrachtgever.
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel25
  - number: '25.3'
    text: |-
      Voor zover bij het verrichten van een deelbwerking of van een onderdeel van de bereiding van een charge controles
      worden verricht, moeten van die verrichtingen genummerde protocollen worden bijgehouden, waaruit blijkt dat de
      controles zijn verricht met gebruikmaking van de desbetreffende in het register opgenomen analyse- en andere
      controlemethodieken. De protocollen moeten voorts de in [artikel 9, derde lid, onder b en c][ref1], bedoelde
      gegevens bevatten.


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel9
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0003127
        artikel: '9'
        paragraaf: '2'
  - number: '25.4'
    text: |-
      De in het eerste en derde lid bedoelde protocollen moeten zijn ondertekend door de persoon, onder wiens direkte
      leiding en toezicht een deelbewerking of een onderdeel van de bereiding van een charge heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel25
  - number: '25.5'
    text: |-
      Indien in opdracht en ten behoeve van een ander een charge van een farmaceutisch product wordt
      bereid, zijn de [artikelen 5][ref1], [6][ref2], [7, eerste volzin][ref3], [8, eerste lid][ref4],
      [9, eerste lid, onder a tot en met f, derde en vijfde lid][ref5], [10, eerste, derde en vijfde lid][ref6], en
      [11, eerste lid, eerste volzin, en tweede lid][ref7], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0003127#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0003127#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0003127#Artikel8
      [ref5]: https://wetten.overheid.nl/BWBR0003127#Artikel9
      [ref6]: https://wetten.overheid.nl/BWBR0003127#Artikel10
      [ref7]: https://wetten.overheid.nl/BWBR0003127#Artikel11
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0003127
        artikel: '5'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0003127
        artikel: '6'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0003127
        artikel: '7'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0003127
        artikel: '8'
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0003127
        artikel: '9'
        paragraaf: '2'
      - id: ref6
        bwb_id: BWBR0003127
        artikel: '10'
        paragraaf: '2'
      - id: ref7
        bwb_id: BWBR0003127
        artikel: '11'
        paragraaf: '2'
  - number: '25.6'
    text: |-
      De ingevolge dit artikel opgestelde protocollen, het in [artikel 8, eerste lid, onder c][ref1], bedoelde document
      en de in dat artikellid, onder d en e, bedoelde monsters moeten worden verstrekt aan de opdrachtgever, ten behoeve
      van wie de desbetreffende werkzaamheden zijn verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel8
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0003127
        artikel: '8'
        paragraaf: '2'
  - number: 25a
    text: |-
      Onverminderd [artikel 24][ref1], zijn met betrekking tot het verrichten van een deelbewerking of een onderdeel van
      de bereiding van een charge van geneesmiddelen voor onderzoek, de [artikelen, 5][ref2], [6][ref3] en [8a][ref4]
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0003127#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0003127#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0003127#Artikel8a
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel25a
    references:
      - id: ref1
        bwb_id: BWBR0003127
        artikel: '24'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0003127
        artikel: '5'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0003127
        artikel: '6'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0003127
        artikel: 8a
        paragraaf: '2'
  - number: '26'
    text: |-
      Indien een deelbewerking van de bereiding van een farmaceutisch product bestaat uit het verpakken van een charge
      of een deel daarvan, of het etiketteren van de verpakkingen, moet gedurende het verpakken en het etiketteren het
      op de charge betrekking hebbende document, bedoeld in [artikel 8, eerste lid, onder ][ref1], aanwezig zijn in het
      lokaal waarin het verpakken onderscheidenlijk het etiketteren plaatsvindt. Na het verpakken en het etiketteren van
      de verpakkingen moet het in de eerste volzin bedoelde document aan de opdrachtgever worden teruggegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel8
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0003127
        artikel: '8'
        paragraaf: '2'
  - number: '28.1'
    text: |-
      Van de in [de artikelen 25][ref1] en [26][ref2] bedoelde verrichtingen moet voor elk kalenderjaar een register
      worden bijgehouden, inhoudende:


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0003127#Artikel26
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0003127
        artikel: '25'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0003127
        artikel: '26'
        paragraaf: '3'
  - number: 28.1.a
    text: de naam en het adres van de opdrachtgever;
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel28
  - number: 28.1.b
    text: |-
      een opgave van hetgeen ten behoeve van [de onder ][ref1] bedoelde opdrachtgever is verricht;


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel28
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0003127
        artikel: '28'
        paragraaf: '3'
  - number: 28.1.c
    text: |-
      de nummers van de in [artikel 25][ref1] bedoelde protocollen welke op die verrichtingen betrekking hebben;


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel25
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0003127
        artikel: '25'
        paragraaf: '3'
  - number: 28.1.d
    text: |-
      de datum van aanvang en die van beëindiging van [de onder ][ref1] bedoelde verrichting.


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel28
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0003127
        artikel: '28'
        paragraaf: '3'
  - number: '28.2'
    text: |-
      Een in het eerste lid bedoeld register moet gedurende twee jaren na het kalenderjaar waarop het register betrekking
      heeft worden bewaard en gedurende de termijn van bewaring ter beschikking worden gehouden van de personen, bedoeld
      in [artikel 33, eerste lid][ref1], van de wet.


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel33
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0003127
        artikel: '33'
        paragraaf: '4'
  - number: '29.1'
    text: |-
      Een aanvraag ter verkrijging van een vergunning als bedoeld in [artikel 1, eerste lid, onder e][ref1], moet de
      volgende gegevens bevatten:


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel1
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0003127
        artikel: '1'
        paragraaf: '1'
  - number: 29.1.a
    text: |-
      de naam en het adres van de aanvrager, alsmede de voornamen van de aanvrager ingeval deze een natuurlijk persoon
      is;
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel29
  - number: 29.1.b
    text: 'een opgave van:'
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel29
  - number: 29.1.b.1°
    text: de farmaceutische producten of geneesmiddelen voor onderzoek welke zullen worden ingevoerd;
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel29
  - number: 29.1.b.2°
    text: de farmaceutische vormen van de onder 1° bedoelde farmaceutische producten of geneesmiddelen voor onderzoek;
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel29
  - number: 29.1.b.3°
    text: |-
      de naam en het adres van degeen die de onder 1° bedoelde farmaceutische producten of geneesmiddelen voor onderzoek
      heeft bereid;
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel29
  - number: 29.1.c
    text: |-
      de naam en het adres van de persoon, bevoegd tot het verrichten van de in [artikel 32, eerste lid, onder c][ref1],
      bedoelde controles;


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel32
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0003127
        artikel: '32'
        paragraaf: '4'
  - number: 29.1.d
    text: |-
      indien controles als bedoeld in [artikel 32, eerste lid, onder c][ref1], door de aanvrager zullen worden verricht:


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel32
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0003127
        artikel: '32'
        paragraaf: '4'
  - number: 29.1.d.1°
    text: |-
      een opgave van de ligging van het perceel of de percelen, waarin de controles zullen worden verricht en de
      farmaceutische producten of geneesmiddelen voor onderzoek ter aflevering in voorraad zullen worden gehouden, een
      en ander onder overlegging van een plattegrond van het perceel of de percelen, met vermelding van de bestemming
      der ruimten of lokalen en vergezeld van een nauwkeurige beschrijving van de lokalen, alsmede van de inrichting
      dier lokalen;
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel29
  - number: 29.1.d.2°
    text: |-
      een opgave van de technisch geschoolde personen die met de direkte leiding van de controles zullen worden belast,
      onder aanduiding van de technische kwalifikatie van die personen;
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel29
  - number: 29.1.d.3°
    text: een opgave van de uitrusting waarover de aanvrager in verband met de controles zal beschikken;
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel29
  - number: 29.1.e
    text: |-
      indien onderdeel d niet van toepassing is, een opgave van de ligging van het perceel of de percelen, waarin
      farmaceutische producten of geneesmiddelen voor onderzoek ter aflevering in voorraad zullen worden gehouden,
      vergezeld van een nauwkeurige beschrijving van het lokaal of de lokalen, waarin de farmaceutische producten of
      geneesmiddelen voor onderzoek zullen worden bewaard, alsmede van de inrichting dier lokalen.
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel29
  - number: '29.2'
    text: |-
      Indien de aanvrager voornemens is de in [artikel 32, eerste lid, onder c][ref1], bedoelde controles te doen
      geschieden onder leiding en toezicht van een persoon als bedoeld in [artikel 33, tweede lid][ref2], moet de
      aanvraag de redenen daartoe bevatten.


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0003127#Artikel33
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0003127
        artikel: '32'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0003127
        artikel: '33'
        paragraaf: '4'
  - number: '29.3'
    text: |-
      Indien de aanvrager voornemens is één of meer van de in [artikel 32, eerste lid, onder c][ref1], bedoelde controles
      te doen verrichten door een in [artikel 33, vierde lid][ref2], bedoeld laboratorium, moet de aanvraag tevens de in
      het vijfde lid van dat artikel bedoelde gegevens bevatten.


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0003127#Artikel33
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0003127
        artikel: '32'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0003127
        artikel: '33'
        paragraaf: '4'
  - number: '29.4'
    text: 'Bij een aanvraag moet worden overgelegd:'
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel29
  - number: 29.4.a
    text: een uittreksel uit het handelsregister, en
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel29
  - number: 29.4.b
    text: in geval de aanvrager een rechtspersoon is, de statuten van die rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel29
  - number: '29.5'
    text: |-
      [Artikel 2, zesde lid][ref1], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel2
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0003127
        artikel: '2'
        paragraaf: '2'
  - number: '29.6'
    text: |-
      Voor zover het geneesmiddelen voor onderzoek betreft, wordt in de in het eerste lid, onder b, sub 1°, bedoelde
      opgave tevens vermeld om welke van de in [artikel 2, eerste lid, onder b][ref1], bedoelde soorten het gaat.


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel2
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0003127
        artikel: '2'
        paragraaf: '2'
  - number: '29.7'
    text: |-
      Het eerste tot en met vierde lid is niet van toepassing op een aanvraag om een vergunning als bedoeld in
      [artikel 1, eerste lid, onder e][ref1], voor zover gegevens of bescheiden als bedoeld in die artikelleden reeds in
      het bezit zijn van Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel1
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0003127
        artikel: '1'
        paragraaf: '1'
  - number: 29a.1
    text: |-
      Een aanvraag ter verkrijging van een vergunning voor het afleveren van ingevoerde geneesmiddelen voor onderzoek
      bevat, naast de in [artikel 29][ref1] bedoelde gegevens, een beschrijving van de handelingen die ter zake van de
      invoer van het geneesmiddel voor onderzoek zullen worden verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel29
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel29a
    references:
      - id: ref1
        bwb_id: BWBR0003127
        artikel: '29'
        paragraaf: '4'
  - number: 29a.2
    text: |-
      Een vergunning voor het invoeren van geneesmiddelen voor onderzoek geldt alleen voor de types en farmaceutische
      vormen van de geneesmiddelen voor onderzoek en de percelen die in de bij de aanvraag om de vergunning overgelegde
      gegevens en bescheiden worden genoemd.
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel29a
  - number: '30'
    text: De importeur draagt zorg dat wordt voldaan aan de bepalingen van deze paragraaf.
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel30
  - number: '31.1'
    text: |-
      De importeur brengt zonder vergunning van Onze Minister geen wijzigingen aan in feiten of omstandigheden
      die zijn beschreven in [artikel 29, eerste tot en met vierde lid][ref1]. Indien een persoon als bedoeld in
      [artikel 33][ref2] wordt vervangen, wordt de vergunning onverwijld aangevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0003127#Artikel33
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0003127
        artikel: '29'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0003127
        artikel: '33'
        paragraaf: '4'
  - number: '31.2'
    text: |-
      [Artikel 4, tweede lid][ref1], is van overeenkomstige toepassing ten aanzien van de importeur.


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel4
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0003127
        artikel: '4'
        paragraaf: '2'
  - number: '32.1'
    text: 'Met betrekking tot elke ingevoerde hoeveelheid van een farmaceutisch product, verpakt uit één charge:'
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel32
  - number: 32.1.a
    text: |-
      moet aanwezig zijn een genummerd protocol van de bereiding van het farmaceutische product, opgesteld door degeen
      die het farmaceutische product heeft bereid, waaruit blijkt dat de bereiding is geschied overeenkomstig de in het
      register opgenomen bereidingswijze;
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel32
  - number: 32.1.b
    text: |-
      moeten aanwezig zijn genummerde protocollen van de verrichte controles van de voor de bereiding van het
      farmaceutische product gebruikte bestanddelen en van het farmaceutische product, opgesteld door degeen die het
      farmaceutische product heeft bereid, waaruit blijkt dat de controles zijn verricht met gebruikmaking van de in het
      register opgenomen analyse- en andere controlemethodieken;
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel32
  - number: 32.1.c
    text: |-
      moet door de importeur, met gebruikmaking van de desbetreffende in het register opgenomen analyse- en andere
      controlemethodieken, worden onderzocht of het farmaceutische product in kwalitatieve samenstelling en voor wat
      betreft de werkzame bestanddelen in kwantitatieve samenstelling overeenstemt met de in het register opgenomen
      samenstelling;
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel32
  - number: 32.1.d
    text: |-
      moeten van het verrichten van de controles, bedoeld onder *c* , genummerde protocollen worden bijgehouden, waaruit
      blijkt dat de controles zijn verricht met gebruikmaking van de in dat onderdeel bedoelde analyse- en andere
      controlemethodieken.
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel32
  - number: '32.2'
    text: |-
      In een in het eerste lid, onder *a*, bedoeld protocol moeten door degeen die het farmaceutische product heeft
      bereid voorts de volgende gegevens zijn vermeld:
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel32
  - number: 32.2.a
    text: de benaming van het farmaceutische product;
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel32
  - number: 32.2.b
    text: de kwalitatieve en kwantitatieve samenstelling van het farmaceutische product;
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel32
  - number: 32.2.c
    text: de gebruikte hoeveelheden van de bestanddelen van het farmaceutische product;
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel32
  - number: 32.2.d
    text: de nummers van de controleprotocollen, bedoeld in het eerste lid, onder b;
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel32
  - number: 32.2.e
    text: de berekende en de verkregen grootte van de charge van een farmaceutisch product;
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel32
  - number: 32.2.f
    text: de datum van aanvang en die van beëindiging van de bereiding van de charge van een farmaceutisch product.
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel32
  - number: '32.3'
    text: |-
      In een in het eerste lid, onder *b*, bedoeld protocol moeten door degeen die het farmaceutische product heeft
      bereid voorts de volgende gegevens zijn vermeld:
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel32
  - number: 32.3.a
    text: in een onderzoekprotocol van het product de benaming van dat product;
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel32
  - number: 32.3.b
    text: in een onderzoekprotocol van het product de kwalitatieve en kwantitatieve samenstelling van het product;
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel32
  - number: 32.3.c
    text: |-
      in de onderzoekprotocollen van de voor de bereiding van het product gebruikte bestanddelen en de in het
      onderzoekprotocol van het product de datum van de verrichte controles, alsmede de verkregen uitkomsten van die
      controles;
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel32
  - number: 32.3.d
    text: |-
      bij de onder *c* bedoelde uitkomsten, het woord "conform" of een term van gelijke strekking, ingeval de
      desbetreffende uitkomst de overeenstemming met het desbetreffende in het register opgenomen gegeven aantoont, dan
      wel "niet conform" of een term van gelijke strekking, ingeval de desbetreffende uitkomst die overeenstemming niet
      aantoont.
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel32
  - number: '32.4'
    text: |-
      In de in het eerste lid, onder *d,* bedoelde protocollen moeten eveneens de in het derde lid genoemde gegevens
      worden vermeld.
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel32
  - number: '32.5'
    text: |-
      De in het eerste lid bedoelde protocollen moeten zijn ondertekend door de persoon, onder wiens leiding en toezicht
      de desbetreffende werkzaamheden hebben plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel32
  - number: '32.6'
    text: |-
      De in het eerste lid, onder *a* en *b*, bedoelde protocollen moeten worden gecontroleerd door een persoon bevoegd
      tot het verrichten van de in dat lid, onder *c*, bedoelde controles, en indien die protocollen voldoen aan de
      desbetreffende bepalingen van dit artikel, door die persoon voor akkoord worden getekend.
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel32
  - number: 32a.1
    text: |-
      De importeur draagt ervoor zorg dat met betrekking tot elke ingevoerde charge van geneesmiddelen voor onderzoek een
      door degene die de charge heeft bereid, opgesteld protocol aanwezig is waaruit blijkt dat:
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel32a
  - number: 32a.1.a
    text: |-
      de charge is bereid en gecontroleerd overeenkomstig normen die ten minste gelijkwaardig zijn aan de in
      [artikel 7, tweede volzin][ref1], bedoelde beginselen en overeenkomstig de productspecificatie;


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel7
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel32a
    references:
      - id: ref1
        bwb_id: BWBR0003127
        artikel: '7'
        paragraaf: '2'
  - number: 32a.1.b
    text: de charge in overeenstemming is met de in het onderzoekersdossier opgenomen informatie.
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel32a
  - number: 32a.2
    text: |-
      Indien met betrekking tot een ingevoerde charge van een geneesmiddel voor onderzoek dat dient ter vergelijking
      en is ingeschreven in een register als bedoeld in [artikel 3 van de wet][ref1], geen documenten kunnen worden
      overgelegd waaruit blijkt dat die charge is bereid overeenkomstig normen die ten minste gelijkwaardig zijn aan de
      in [artikel 7, tweede volzin][ref2], bedoelde beginselen, draagt de importeur ervoor zorg dat de desbetreffende
      charge van geneesmiddelen voor onderzoek alle relevante analyses, tests en controles ondergaat die nodig zijn om
      te kunnen vaststellen of de kwaliteit ervan in overeenstemming is met hetgeen daarover in het onderzoekersdossier
      is beschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0002290#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003127#Artikel7
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel32a
    references:
      - id: ref1
        bwb_id: BWBR0002290
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0003127
        artikel: '7'
        paragraaf: '2'
  - number: 32a.3
    text: |-
      De importeur belast een of meer personen met de taak te onderzoeken of aan het eerste lid is voldaan. Indien het
      geneesmiddelen voor onderzoek betreft als bedoeld in het tweede lid, belast de importeur een of meer personen met
      de taak alle relevante analyses, tests en controles te verrichten die nodig zijn om te kunnen vaststellen of de
      kwaliteit van de desbetreffende charges van geneesmiddelen voor onderzoek in overeenstemming is met de kwaliteit
      die wordt beschreven in het onderzoekersdossier. Indien de betrokken persoon heeft vastgesteld dat aan het bepaalde
      in het eerste dan wel het tweede lid is voldaan, legt deze dat in een door hem ondertekend document vast. Het
      document wordt bij iedere verrichting bijgesteld en wordt ten minste vijf jaren bewaard.
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel32a
  - number: '33.1'
    text: |-
      De in [artikel 32, eerste lid, onder c][ref1], bedoelde controles geschieden onder leiding en toezicht van een
      persoon die voldoet aan artikel 49 van [richtlijn 2001/83](32001L0083) dan wel op wie artikel 50, eerste lid, van
      die richtlijn van toepassing is. De in [artikel 32a, derde lid][ref2], bedoelde taken geschieden onder leiding en
      toezicht van een persoon die voldoet aan artikel 49 van [richtlijn 2001/83](32001L0083) dan wel op wie artikel 13,
      vijfde lid, van [richtlijn 2001/20](32001L0020) van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0003127#Artikel32a
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0003127
        artikel: '32'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0003127
        artikel: 32a
        paragraaf: '4'
  - number: '33.2'
    text: |-
      Onze Minister kan toestaan dat de in [artikel 32, eerste lid, onder c][ref1], bedoelde controles van farmaceutische
      producten geschieden onder leiding en toezicht van een persoon, die ten minste twee jaren belast is geweest
      met het verrichten van controles van industrieel bereide farmaceutische producten, en een met het oog op die
      taak aanvaardbaar examen aan een instelling van wetenschappelijk onderwijs met goed gevolg heeft afgelegd. De
      toestemming kan worden ingetrokken indien de in de eerste volzin bedoelde persoon ernstig tekortschiet in de
      uitoefening van zijn functie.


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel32
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0003127
        artikel: '32'
        paragraaf: '4'
  - number: '33.3'
    text: |-
      Voor het verrichten van de in [artikel 32, eerste lid, onder c][ref1], bedoelde controles of de in
      [artikel 32a, derde lid][ref2], bedoelde taken moet worden beschikt over technisch geschoold personeel, daartoe
      bestemde lokalen en daartoe geëigende uitrusting.


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0003127#Artikel32a
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0003127
        artikel: '32'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0003127
        artikel: 32a
        paragraaf: '4'
  - number: '33.4'
    text: |-
      Onze minister kan op verzoek van de importeur toestaan dat één of meer van de in
      [artikel 32, eerste lid, onder c][ref1], bedoelde controles worden verricht door een in
      [artikel 5, vierde lid][ref2], bedoeld laboratorium.


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0003127#Artikel5
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0003127
        artikel: '32'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0003127
        artikel: '5'
        paragraaf: '2'
  - number: '33.5'
    text: 'Een in het vierde lid bedoeld verzoek moet:'
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel33
  - number: 33.5.a
    text: met redenen zijn omkleed;
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel33
  - number: 33.5.b
    text: een opgave bevatten van de desbetreffende controles;
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel33
  - number: 33.5.c
    text: de naam en het adres van het laboratorium bevatten.
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel33
  - number: '34'
    text: |-
      Ten aanzien van ingevoerde farmaceutische producten zijn [de artikelen 14][ref1]-[17][ref2] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0003127#Artikel17
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0003127
        artikel: '14'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0003127
        artikel: '17'
        paragraaf: '2'
  - number: '35'
    text: Onze Minister is bevoegd met betrekking tot de invoer van farmaceutische producten nadere regelen te stellen.
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel35
  - number: '36.1'
    text: |-
      Een aanvraag ter verkrijging van een vergunning als bedoeld in [artikel 1, onder ][ref1], moet de volgende gegevens
      bevatten:


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel1
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0003127
        artikel: '1'
        paragraaf: '1'
  - number: 36.1.a
    text: |-
      de naam en het adres van de aanvrager, alsmede de voornamen van de aanvrager in geval deze een natuurlijk persoon
      is;
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel36
  - number: 36.1.b
    text: |-
      de naam van de persoon, onder wiens leiding en toezicht de bedrijfswerkzaamheden betreffende de in-, op- en uitslag
      van de farmaceutische producten zullen worden verricht, onder aanduiding van de kwalificatie van die persoon;
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel36
  - number: 36.1.c
    text: |-
      een opgave van de ligging van het perceel of de percelen, waarin de farmaceutische producten ter aflevering in
      voorraad zullen worden gehouden, vergezeld van een nauwkeurige beschrijving van het lokaal of de lokalen, waarin de
      farmaceutische producten zullen worden bewaard, alsmede van de inrichting dier lokalen.
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel36
  - number: '36.2'
    text: 'Bij een aanvraag moet worden overgelegd:'
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel36
  - number: 36.2.a
    text: een uittreksel uit het handelsregister, en
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel36
  - number: 36.2.b
    text: in geval de aanvrager een rechtspersoon is, de statuten van die rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel36
  - number: '36.3'
    text: |-
      [Artikel 2, zesde lid][ref1], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel2
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0003127
        artikel: '2'
        paragraaf: '2'
  - number: '36.4'
    text: |-
      Voor het verkrijgen van een in het eerste lid bedoelde vergunning moet de aanvrager ten minste aan de volgende
      eisen voldoen:
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel36
  - number: 36.4.a
    text: |-
      hij moet beschikken over geschikte en voldoende bedrijfsruimten, installaties en uitrusting, zodat een goede
      bewaring en een goede distributie van de farmaceutische producten wordt gewaarborgd;
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel36
  - number: 36.4.b
    text: |-
      hij moet beschikken over gekwalificeerd personeel en met name over een gekwalificeerde persoon als bedoeld in het
      eerste lid, onder *b*.
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel36
  - number: 36a
    text: De groothandelaar draagt zorg dat wordt voldaan aan de bepalingen van deze paragraaf.
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel36a
  - number: '37'
    text: |-
      De groothandelaar is verplicht van elke wijziging in de gegevens welke bij de in [artikel 36][ref1] bedoelde
      aanvraag zijn verstrekt, met uitzondering van die betreffende de inrichting van het perceel of de percelen,
      onverwijld kennis te geven aan Onze Minister en de hoofdinspecteur. Een wijziging betreffende de inrichting van het
      perceel of de percelen moet voor het eind van het kalenderjaar waarin de wijziging heeft plaatsgevonden ter kennis
      worden gebracht van Onze Minister en de hoofdinspecteur.


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel36
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0003127
        artikel: '36'
        paragraaf: '5'
  - number: 37a
    text: |-
      De groothandelaar dient zich te richten naar de beginselen en richtsnoeren inzake goede distributiepraktijken,
      bedoeld in [artikel 10][ref1] van [richtlijn 92/25/EEG](31992L0025) van de Raad van de Europese Gemeenschappen
      van 31 maart 1992 betreffende de groothandel in geneesmiddelen voor menselijk gebruik (*PbEG* L 113). Van de
      bekendmaking daarvan door de Commissie van de Europese Gemeenschappen, zal door Onze Minister mededeling worden
      gedaan in de *Staatscourant,* voor zover zodanige bekendmaking niet geschiedt in het *Publikatieblad van de
      Europese Gemeenschappen*.


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel10
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel37a
    references:
      - id: ref1
        bwb_id: BWBR0003127
        artikel: '10'
        paragraaf: '2'
  - number: 37b
    text: |-
      De groothandelaar moet beschikken over een urgentieplan waardoor de daadwerkelijke tenuitvoerlegging van elke actie
      tot het uit de handel nemen van een farmaceutisch product wordt gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel37b
  - number: 37c
    text: 'De groothandelaar mag zijn farmaceutische producten uitsluitend betrekken van personen die:'
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel37c
  - number: 37c.a
    text: zelf groothandelaar zijn;
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel37c
  - number: 37c.b
    text: fabrikant, importeur of parallel-groothandelaar zijn; dan wel
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel37c
  - number: 37c.c
    text: |-
      in het bezit zijn van een door een lid-staat afgegeven vergunning als bedoeld in [artikel 16][ref1] van [richtlijn
      75/319/EEG](31975L0319) van de Raad van de Europese Gemeenschappen van 20 mei 1975 betreffende de aanpassing van de
      wettelijke en bestuursrechtelijke bepalingen inzake farmaceutische specialisten (*PbEG* L 147).


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel16
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel37c
    references:
      - id: ref1
        bwb_id: BWBR0003127
        artikel: '16'
        paragraaf: '2'
  - number: 37d.1
    text: |-
      De groothandelaar moet een documentatie bijhouden, waarin voor elke tot inslag en uitslag leidende transactie van
      farmaceutische producten ten minste de volgende gegevens zijn opgenomen:
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel37d
  - number: 37d.1.a
    text: de datum van de desbetreffende transactie;
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel37d
  - number: 37d.1.b
    text: de benaming van het farmaceutische product;
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel37d
  - number: 37d.1.c
    text: de ontvangen, onderscheidenlijk de geleverde hoeveelheid;
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel37d
  - number: 37d.1.d
    text: de naam en het adres van de leverancier, onderscheidenlijk van de ontvanger.
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel37d
  - number: 37d.2
    text: |-
      De in het eerste lid bedoelde documentatie dient gedurende ten minste vijf jaren te worden bewaard en gedurende die
      periode ter beschikking van de inspecteur te worden gehouden.
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel37d
  - number: 37e.1
    text: |-
      Met betrekking tot elke vanuit een lid-staat betrokken hoeveelheid van een farmaceutisch product,
      verpakt uit één charge moet, indien die hoeveelheid niet is vergezeld van protocollen als bedoeld in
      [artikel 32, eerste lid, onder ][ref1], door de groothandelaar een onderzoek worden verricht als bedoeld in dat
      artikellid, [onder ][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0003127#Artikel37e
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel37e
    references:
      - id: ref1
        bwb_id: BWBR0003127
        artikel: '32'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0003127
        artikel: 37e
        paragraaf: '5'
  - number: 37e.2
    text: |-
      [Artikel 32, eerste lid, onder ][ref1], is van toepassing met betrekking tot het in het eerste lid bedoelde geval.


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel32
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel37e
    references:
      - id: ref1
        bwb_id: BWBR0003127
        artikel: '32'
        paragraaf: '4'
  - number: 37f
    text: |-
      De groothandelaar dient bij elke leverantie van farmaceutische producten aan personen, bevoegd tot het afleveren
      van farmaceutische producten aan particuliere verbruikers, documenten bij te voegen waaraan de volgende gegevens
      kunnen worden ontleend:
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel37f
  - number: 37f.a
    text: de datum van aflevering;
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel37f
  - number: 37f.b
    text: de benaming en de farmaceutische vorm van het farmaceutisch product;
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel37f
  - number: 37f.c
    text: de geleverde hoeveelheid;
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel37f
  - number: 37f.d
    text: de naam en het adres van de leverancier en de ontvanger.
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel37f
  - number: '38'
    text: |-
      Met betrekking tot de groothandelaar zijn [de artikelen 14, vierde en vijfde lid][ref1], en [15][ref2]-[17][ref3]
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0003127#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0003127#Artikel17
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0003127
        artikel: '14'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0003127
        artikel: '15'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0003127
        artikel: '17'
        paragraaf: '2'
  - number: '39'
    text: |-
      Voor de toepassing van deze paragraaf wordt onder "U.A.-vergunning" verstaan een vergunning als bedoeld in
      [artikel 4, eerste lid, onder ][ref1], van de wet.


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel4
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0003127
        artikel: '4'
        paragraaf: '2'
  - number: '40.1'
    text: 'Een aanvraag ter verkrijging van een U.A.-vergunning moet de volgende gegevens bevatten:'
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel40
  - number: 40.1.a
    text: |-
      de naam en het adres van de aanvrager, alsmede de voornamen van de aanvrager in geval deze een natuurlijk persoon
      is;
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel40
  - number: 40.1.b
    text: |-
      een opgave van de af te leveren farmaceutische producten, ten aanzien waarvan
      [artikel 4, eerste of derde lid][ref1], van de wet van toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel4
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0003127
        artikel: '4'
        paragraaf: '2'
  - number: 40.1.c
    text: |-
      de naam en het adres van de in [artikel 41, vierde lid][ref1], bedoelde apotheker of andere persoon.


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel41
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0003127
        artikel: '41'
        paragraaf: '6'
  - number: '40.2'
    text: |-
      [Artikel 2, zesde lid][ref1], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel2
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0003127
        artikel: '2'
        paragraaf: '2'
  - number: '41.1'
    text: |-
      Farmaceutische producten, ten aanzien waarvan [artikel 4, eerste of derde lid][ref1], van de wet van toepassing
      is, mogen door de houder van een U.A.-vergunning, behalve aan de in [artikel 4, eerste lid, onder ][ref2],
      van de wet bedoelde categorieën van personen en aan ziekenhuizen, eveneens worden afgeleverd aan de in
      [artikel 16, eerste lid, onder ][ref3], bedoelde, personen en instellingen, voor zover krachtens dat artikel
      toegestaan. Met betrekking tot de in de eerste volzin bedoelde farmaceutische producten is paragraaf 6 van het
      [Reclamebesluit geneesmiddelen][ref4] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0003127#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0003127#Artikel16
      [ref4]: https://wetten.overheid.nl/BWBR0006994
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0003127
        artikel: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0003127
        artikel: '4'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0003127
        artikel: '16'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0006994
  - number: '41.2'
    text: |-
      De houder van een U.A.-vergunning is verplicht van de aflevering van de in het eerste lid bedoelde farmaceutische
      producten een administratie te voeren welke zo is ingericht, dat daaruit duidelijk blijkt welke farmaceutische
      producten zijn afgeleverd, aan wie en op welke datum de aflevering heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel41
  - number: '41.3'
    text: |-
      De houder van een U.A.-vergunning draagt zorg dat bestellingen tot aflevering van de in het eerste lid bedoelde
      farmaceutische producten op zorgvuldige wijze worden uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel41
  - number: '41.4'
    text: |-
      De houder van een U.A.-vergunning draagt zorg dat voor zover het betreft de naleving van de leden 1-3 toezicht
      wordt gehouden door een apotheker, die van zijn bevoegdheid tot uitoefening van de artsenijbereidkunst gebruik
      mag maken, dan wel door een persoon als bedoeld in [de artikelen 5, tweede lid][ref1], [33, tweede lid][ref2] of
      [45, tweede lid][ref3], indien de houder fabrikant, importeur of parallel-groothandelaar is.


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0003127#Artikel33
      [ref3]: https://wetten.overheid.nl/BWBR0003127#Artikel45
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0003127
        artikel: '5'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0003127
        artikel: '33'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0003127
        artikel: '45'
        paragraaf: '7'
  - number: '42.1'
    text: |-
      Een aanvraag ter verkrijging van een vergunning als bedoeld in [artikel 1, onder ][ref1], moet de volgende gegevens
      bevatten:


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel1
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0003127
        artikel: '1'
        paragraaf: '1'
  - number: 42.1.a
    text: |-
      de naam en het adres van de aanvrager, alsmede de voornamen van de aanvrager in geval deze een natuurlijk persoon
      is;
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel42
  - number: 42.1.b
    text: |-
      de naam en het adres van de persoon, bedoeld in [artikel 45, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel45
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0003127
        artikel: '45'
        paragraaf: '7'
  - number: 42.1.c
    text: 'een opgave van:'
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel42
  - number: 42.1.c.1°
    text: |-
      de farmaceutische producten welke uit een lid-staat zullen worden betrokken onder vermelding van de naam
      van die lid-staat en van de naam en het adres van degeen die in die lid-staat voor het in de handel brengen
      verantwoordelijk is;
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel42
  - number: 42.1.c.2°
    text: |-
      de farmaceutische vormen van [de onder 1°][ref1] bedoelde farmaceutische producten;


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel42
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0003127
        artikel: '42'
        paragraaf: '7'
  - number: 42.1.d
    text: 'een opgave van:'
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel42
  - number: 42.1.d.1°
    text: |-
      de ligging van het perceel of de percelen, waarin de farmaceutische producten zullen worden verpakt en de
      verpakkingen geëtiketteerd onderscheidenlijk de farmaceutische producten ter aflevering in voorraad zullen worden
      gehouden, een en ander onder overlegging van een plattegrond van het perceel of de percelen, met vermelding van
      de bestemming der ruimten of lokalen en vergezeld van een nauwkeurige beschrijving van de lokalen, alsmede van de
      inrichting dier lokalen;
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel42
  - number: 42.1.d.2°
    text: de uitrusting waarover de aanvrager in verband met het verpakken en etiketteren zal beschikken.
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel42
  - number: '42.2'
    text: |-
      Indien de aanvrager voornemens is de in [artikel 45 eerste lid][ref1], bedoelde verrichtingen te doen geschieden
      onder leiding en toezicht van een persoon als bedoeld in het tweede lid van dat artikel, moet de aanvraag de
      redenen daartoe bevatten.


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel45
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0003127
        artikel: '45'
        paragraaf: '7'
  - number: '42.3'
    text: 'Bij een aanvraag moet worden overgelegd:'
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel42
  - number: 42.3.a
    text: een uittreksel uit het handelsregister, en
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel42
  - number: 42.3.b
    text: in geval de aanvrager een rechtspersoon is, de statuten van die rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel42
  - number: '42.4'
    text: |-
      [Artikel 2, zesde lid][ref1], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel2
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0003127
        artikel: '2'
        paragraaf: '2'
  - number: '43'
    text: De parallel-groothandelaar draagt zorg dat wordt voldaan aan de bepalingen van deze paragraaf.
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel43
  - number: '44'
    text: |-
      Wijzigingen in de gegevens welke ingevolge [artikel 42, eerste lid onder ][ref1], voor wat betreft de inrichting
      van het perceel of de percelen, en 2°, zijn verstrekt, moeten voor het eind van het kalenderjaar waarin de
      wijziging heeft plaatsgevonden ter kennis worden gebracht van Onze Minister en van de hoofdinspecteur. Van elke
      andere wijziging in de gegevens welke ingevolge [artikel 42][ref2] zijn verstrekt, moet onverwijld kennis worden
      gegeven aan Onze Minister en de hoofdinspecteur.


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0003127#Artikel42
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0003127
        artikel: '42'
        paragraaf: '7'
      - id: ref2
        bwb_id: BWBR0003127
        artikel: '42'
        paragraaf: '7'
  - number: '45.1'
    text: |-
      De noodzakelijke verrichtingen met betrekking tot het verpakken en etiketteren van verpakkingen van de ingevoerde
      farmaceutische producten, alsmede het verrichten van de in [artikel 47, eerste lid][ref1], bedoelde controles
      met het verrichten waarvan de hoofdinspecteur ingevolge dat artikellid akkoord is gegaan, moeten geschieden onder
      leiding en toezicht van een apotheker, die van zijn bevoegdheid tot uitoefening der artsenijbereidkunst gebruik mag
      maken en die voldoet aan de eisen, vervat in artikel 23 van de E.E.G.-richtlijn no. 75/319/EEG.


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel47
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0003127
        artikel: '47'
        paragraaf: '7'
  - number: '45.2'
    text: |-
      Onze Minister kan toestaan dat de in het eerste lid bedoelde verrichtingen geschieden onder leiding en toezicht van
      een persoon, die ten minste twee jaar direkt betrokken is geweest bij de industriële bereiding van farmaceutische
      producten, en een met het oog op de in het eerste lid bedoelde verrichtingen aanvaardbaar examen aan een instelling
      van wetenschappelijk onderwijs met goed gevolg heeft afgelegd. De tweede en derde volzin van artikel 5, tweede lid,
      zijn van toepassing.
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel45
  - number: '46.1'
    text: |-
      De in [artikel 45, eerste lid][ref1], bedoelde verrichtingen moeten geschieden in daartoe bestemde lokalen en met
      gebruikmaking van de daarvoor geëigende uitrusting. In de desbetreffende lokalen mogen geen andere producten dan
      farmaceutische producten worden verpakt. Artikel 6, derde lid, is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel45
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0003127
        artikel: '45'
        paragraaf: '7'
  - number: '46.2'
    text: |-
      Met betrekking tot de in [artikel 45, eerste lid][ref1], bedoelde verrichtingen moeten voldoende voorzorgen zijn
      genomen, teneinde te voorkomen dat:


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel45
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0003127
        artikel: '45'
        paragraaf: '7'
  - number: 46.2.a
    text: verontreiniging plaatsvindt van de in het eerste lid bedoelde lokalen, uitrusting en farmaceutische producten;
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel46
  - number: 46.2.b
    text: |-
      verandering in de samenstelling van farmaceutische producten plaatsvindt of verwisseling plaatsvindt van
      farmaceutische producten en verpakkingsmateriaal.
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel46
  - number: '47.1'
    text: |-
      Met betrekking tot elke van uit een lid-staat betrokken hoeveelheid van een farmaceutisch product, verpakt uit één
      charge, is [artikel 37][ref1], van overeenkomstige toepassing, met dien verstande dat de parallel-groothandelaar
      verplicht is het in dat artikellid, [onder ][ref2], bedoelde onderzoek onderscheidenlijk de in dat artikellid,
      [onder ][ref3], bedoelde controle te doen verrichten door een door Onze Minister daartoe aangewezen bestuursorgaan,
      tenzij hij de hoofdinspecteur heeft aangetoond dat hij zulks hetzij volledig hetzij ten dele zelf kan verrichten en
      de hoofdinspecteur daarmee akkoord is gegaan.


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel37e
      [ref2]: https://wetten.overheid.nl/BWBR0003127#Artikel47
      [ref3]: https://wetten.overheid.nl/BWBR0003127#Artikel47
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0003127
        artikel: 37e
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0003127
        artikel: '47'
        paragraaf: '7'
      - id: ref3
        bwb_id: BWBR0003127
        artikel: '47'
        paragraaf: '7'
  - number: '47.2'
    text: |-
      [Artikel 32, eerste lid, onder ][ref1], is van toepassing met betrekking tot een in het eerste lid bedoeld
      onderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel32
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0003127
        artikel: '32'
        paragraaf: '4'
  - number: '47.3'
    text: |-
      Voor een onderzoek onderscheidenlijk controle als in het eerste lid bedoeld, verricht door een in dat lid
      bedoelde bestuursorgaan, is de parallel-groothandelaar een vergoeding verschuldigd volgens een door Onze Minister
      vastgesteld tarief.
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel47
  - number: '47.4'
    text: |-
      Van de in [artikel 45, eerste lid][ref1], bedoelde verrichtingen met betrekking tot het verpakken en etiketteren
      van verpakkingen moet een gedagtekend protocol worden opgemaakt, voorzien van het op de verpakkingen vermelde
      partijnummer van de fabrikant, bedoeld in [artikel 2, eerste lid, onder ][ref2], van [Richtlijn 92/27/EEG]
      (31992L0027) van de Raad van de Europese Gemeenschappen van 31 maart 1992 betreffende de etikettering en de
      bijsluiter van geneesmiddelen voor menselijk gebruik (*PbEG* L 113); in dat protocol moeten tevens zijn vermeld
      de nummers van de protocollen als bedoeld in [artikel 32, eerste lid, onder ][ref3], onderscheidenlijk die van de
      protocollen als bedoeld in dat artikellid, [onder ][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0003127#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0003127#Artikel32
      [ref4]: https://wetten.overheid.nl/BWBR0003127#Artikel47
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0003127
        artikel: '45'
        paragraaf: '7'
      - id: ref2
        bwb_id: BWBR0003127
        artikel: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0003127
        artikel: '32'
        paragraaf: '4'
      - id: ref4
        bwb_id: BWBR0003127
        artikel: '47'
        paragraaf: '7'
  - number: '48.1'
    text: |-
      Ten aanzien van de uit een andere lid-staat betrokken farmaceutische producten zijn de [artikelen 14-17][ref1] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel14
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0003127
        artikel: '14'
        paragraaf: '2'
  - number: '48.2'
    text: |-
      Indien met betrekking tot geneesmiddelen voor onderzoek die worden betrokken uit een andere lidstaat waarin zij
      zijn bereid of waarin zij zijn ingevoerd, een document aanwezig is waaruit blijkt dat de geneesmiddelen voor
      onderzoek zijn bereid overeenkomstig het bij en krachtens [artikel 7, tweede volzin][ref1], bepaalde en dat is
      ondertekend door de persoon die in de andere lidstaat belast is met de in [artikel 5, eerste lid][ref2], of de
      in [artikel 33, eerste lid][ref3], bedoelde taken, zijn deze geneesmiddelen voor onderzoek vrijgesteld van de in
      [artikel 32a, derde lid][ref4], bedoelde analyses, tests en controles.


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0003127#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0003127#Artikel33
      [ref4]: https://wetten.overheid.nl/BWBR0003127#Artikel32a
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0003127
        artikel: '7'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0003127
        artikel: '5'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0003127
        artikel: '33'
        paragraaf: '4'
      - id: ref4
        bwb_id: BWBR0003127
        artikel: 32a
        paragraaf: '4'
  - number: '49'
    text: |-
      De personen, bedoeld in artikel 2, van de wet, dragen zorg dat met betrekking tot hun bedrijf, voor wat betreft
      farmaceutische producten, wordt voldaan aan de bepalingen van deze paragraaf.
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel49
  - number: '50.1'
    text: |-
      De verkoop van farmaceutische producten mag slechts geschieden in een daarvoor geheel of gedeeltelijk ingericht en
      voor het publiek toegankelijk verkooplokaal.
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel50
  - number: '50.2'
    text: |-
      Farmaceutische producten moeten in het verkooplokaal, duidelijk afgescheiden van andere artikelen, ordelijk,
      overzichtelijk en zindelijk zijn opgesteld en opgeborgen, op zodanige wijze, dat licht, vocht en warmte daarop
      geen schadelijke invloed kunnen uitoefenen. Onze Minister kan met betrekking tot de wijze van opberging nadere
      voorschriften geven.
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel50
  - number: '50.3'
    text: |-
      In een bij het verkooplokaal behorende etalage mogen voor wat betreft farmaceutische producten uitsluitend
      ledige verpakkingen worden geëtaleerd. Deze verpakkingen moeten duidelijk afgescheiden van andere artikelen zijn
      opgesteld.
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel50
  - number: '50.4'
    text: |-
      Farmaceutische producten, welke elders dan in het verkooplokaal ter aflevering in voorraad worden gehouden, moeten
      op deugdelijke, zindelijke en ordelijke wijze worden bewaard in daartoe bestemde lokalen.
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel50
  - number: '50.5'
    text: |-
      Farmaceutische producten, welke zich kennelijk niet meer in goede staat bevinden, mogen niet worden afgeleverd of
      ter aflevering in voorraad worden gehouden.
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel50
  - number: '50.6'
    text: |-
      Met betrekking tot de in- en verkoop van farmaceutische producten moet een administratie worden gevoerd, welke zo
      is ingericht dat daaruit duidelijk blijkt welke farmaceutische producten zijn ingekocht en verkocht, alsmede van
      welke leveranciers die farmaceutische producten zijn betrokken. Onze Minister kan ten aanzien van de inrichting van
      deze te voeren administratie nadere voorschriften geven.
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel50
  - number: '50.7'
    text: |-
      Het eerste, tweede en derde lid zijn niet van toepassing op de verkoop die uitsluitend strekt tot
      postorderfarmacie.
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel50
  - number: '50.8'
    text: |-
      Farmaceutische producten die met het oog op postorderfarmacie ten verkoop worden aangeboden, worden als zodanig en
      duidelijk afgescheiden van andere categorieën van producten gepresenteerd.
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel50
  - number: '51'
    text: |-
      Het is verboden farmaceutische producten in verkoopautomaten aanwezig te hebben. Het is voorts verboden
      farmaceutische producten die uitsluitend op recept mogen worden afgeleverd, in een systeem van zelfbediening te
      verkopen, af te leveren of ter aflevering in voorraad te hebben.
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel51
  - number: '52.1'
    text: 'Het is verboden een farmaceutisch product af te leveren:'
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel52
  - number: 52.1.a
    text: in een andere verpakking dan die waarin het in de handel is gebracht;
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel52
  - number: 52.1.b
    text: |-
      indien de in [artikel 14, eerste lid, onder ][ref1], bedoelde sluiting is beschadigd;


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel14
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0003127
        artikel: '14'
        paragraaf: '2'
  - number: 52.1.c
    text: waarvan de datum tot welke het farmaceutische product geschikt voor gebruik wordt geacht, is verstreken;
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel52
  - number: 52.1.d
    text: |-
      indien de vermeldingen, bedoeld in [paragraaf 2][ref1] van het Besluit etikettering en bijsluiter farmaceutisch
      producten, onleesbaar zijn gemaakt, gewijzigd of aangevuld.


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Paragraaf2
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0003127
        paragraaf: '2'
  - number: '52.2'
    text: 'Het eerste lid, onder *a*, geldt niet ten aanzien van apothekers en apotheekhoudende artsen, indien:'
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel52
  - number: 52.2.a
    text: |-
      het betreft farmaceutische producten, welke blijkens de verpakking waarin zij zich bevinden kennelijk niet bestemd
      zijn om in die verpakking aan particuliere verbruikers te worden afgeleverd;
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel52
  - number: 52.2.b
    text: |-
      op een recept is vermeld dat de aflevering van een farmaceutisch product niet mag geschieden in de in dat lid,
      onder *a*, bedoelde verpakking;
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel52
  - number: 52.2.c
    text: |-
      de op een recept voorgeschreven hoeveelheid van een farmaceutisch product afwijkt van die welke zich bevindt in een
      in dat lid, onder *a*, bedoelde verpakking.
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel52
  - number: '52.3'
    text: |-
      Het eerste lid, onder *b*, geldt niet indien een apotheker of apotheekhoudende arts de sluiting heeft verbroken ter
      controle van het farmaceutische product, mits hij daarna op de in het eerste lid, onder *a*, bedoelde verpakking
      een sluiting, voorzien van zijn naam, aanbrengt.
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel52
  - number: '52.4'
    text: |-
      Het eerste lid, onder *d*, geldt niet ten aanzien van apothekers en apotheekhoudende artsen die een farmaceutisch
      product op recept afleveren.
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel52
  - number: '54.1'
    text: |-
      Het in [artikel 3, vierde lid, van de wet][ref1] vervatte verbod op invoer van ongeregistreerde farmaceutische
      producten of geneesmiddelen voor onderzoek geldt niet indien:


      [ref1]: https://wetten.overheid.nl/BWBR0002290#Artikel3
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0002290
        artikel: '3'
  - number: 54.1.a
    text: |-
      het een farmaceutisch product betreft dat bestemd is om als monster te worden overgelegd bij een aanvraag tot
      inschrijving van dat product in het register,
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel54
  - number: 54.1.b
    text: |-
      het een farmaceutisch product of een geneesmiddel voor onderzoek betreft dat kennelijk voor eigen gebruik is
      bestemd door degene die het invoert, of
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel54
  - number: 54.1.c
    text: |-
      de hoofdinspecteur toestemming tot invoer van een farmaceutisch product voor een daarbij aangegeven doeleinde heeft
      verleend.
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel54
  - number: '54.2'
    text: |-
      De hoofdinspecteur verleent de in het eerste lid, onder c, bedoelde toestemming uitsluitend aan personen, bevoegd
      tot uitoefening van de artsenijbereidkunst. Aan de toestemming kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel54
  - number: '54.3'
    text: |-
      Het in [artikel 3, vierde lid, van de wet][ref1] vervatte verbod tot het afleveren van ongeregistreerde
      farmaceutische producten geldt niet ten aanzien van een in het eerste lid, onder a of c, bedoeld farmaceutisch
      product voor zover het wordt afgeleverd voor de bestemming onderscheidenlijk het doeleinde waarvoor de invoer is
      toegestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002290#Artikel3
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0002290
        artikel: '3'
  - number: '55.1'
    text: |-
      Aflevering van zich nog in het stadium van proefneming bevindende ongeregistreerde farmaceutische producten, die
      niet zijn bestemd voor het verrichten van onderzoekingen aan de mens, mag slechts geschieden indien door degeen die
      aflevert aan het tweede lid wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel55
  - number: '55.2'
    text: 'Een aflevering mag niet geschieden alvorens de hoofdinspecteur in kennis is gesteld van:'
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel55
  - number: 55.2.a
    text: de naam en het adres van de persoon aan wie het farmaceutische product zal worden afgeleverd;
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel55
  - number: 55.2.b
    text: |-
      de kwalitatieve en kwantitatieve samenstelling van het farmaceutische product of, indien dit niet mogelijk is,
      van de gebruikte grondstoffen en de bewerkingen welke deze hebben ondergaan, een en ander onder aanwijzing van de
      werkzame bestanddelen;
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel55
  - number: 55.2.c
    text: de verwachte werking van het farmaceutische product;
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel55
  - number: 55.2.d
    text: de eventuele bijwerkingen en contra-indicaties van het farmaceutische product.
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel55
  - number: '56.1'
    text: |-
      Een persoon, rechtspersoon daaronder begrepen, niet zijnde groothandelaar of parallel-groothandelaar, die een
      farmaceutisch product betrekt van een in een andere lid-staat gevestigde registratiehouder is verplicht van elke
      ontvangst van een hoeveelheid daarvan onverwijld kennis te geven aan de hoofdinspecteur, onder vermelding van:
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel56
  - number: 56.1.a
    text: zijn naam en adres;
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel56
  - number: 56.1.b
    text: de naam en het adres van degeen van wie de hoeveelheid is betrokken;
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel56
  - number: 56.1.c
    text: de benaming van het farmaceutische product;
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel56
  - number: 56.1.d
    text: het aantal handelsverpakkingen en de inhoud van elk van die verpakkingen;
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel56
  - number: 56.1.e
    text: de datum van ontvangst van de hoeveelheid.
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel56
  - number: '56.2'
    text: |-
      Met betrekking tot elke hoeveelheid van een farmaceutisch product, verpakt uit één charge, is [artikel 37][ref1],
      van overeenkomstige toepassing, met dien verstande dat een in het eerste lid bedoelde persoon verplicht is het in
      eerstgenoemd artikellid, [onder ][ref2] bedoelde onderzoek, onderscheidenlijk de in dat artikellid, [onder ][ref3]
      bedoelde controle te doen verrichten door een door Onze Minister daartoe aangewezen bestuursorgaan, tenzij hij
      de hoofdinspecteur heeft aangetoond dat hij zulks hetzij volledig hetzij ten dele zelf kan verrichten en de
      hoofdinspecteur daarmee akkoord is gegaan.


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel37e
      [ref2]: https://wetten.overheid.nl/BWBR0003127#Artikel56
      [ref3]: https://wetten.overheid.nl/BWBR0003127#Artikel56
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0003127
        artikel: 37e
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0003127
        artikel: '56'
        paragraaf: '12'
      - id: ref3
        bwb_id: BWBR0003127
        artikel: '56'
        paragraaf: '12'
  - number: '56.3'
    text: |-
      [Artikel 32, eerste lid, onder ][ref1], is van toepassing met betrekking tot een in het tweede lid bedoeld
      onderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel32
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0003127
        artikel: '32'
        paragraaf: '4'
  - number: '56.4'
    text: |-
      Voor een onderzoek onderscheidenlijk controle als in het tweede lid bedoeld, verricht door een in dat lid bedoelde
      bestuursorgaan, is de in het eerste lid bedoelde persoon een vergoeding verschuldigd volgens een door Onze Minister
      vastgesteld tarief.
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel56
  - number: '56.5'
    text: |-
      Dit artikel geldt niet ten aanzien van een persoon die een farmaceutisch product uit een lid-staat betrekt dat
      kennelijk voor zijn eigen gebruik bestemd is.
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel56
  - number: 56a.1
    text: |-
      Op verzoek van de fabrikant, van de exporteur, of van de autoriteiten van een ander land dan een lid-staat,
      certificeert de hoofdinspecteur ten behoeve van een bepaald farmaceutisch product dat een fabrikant in het bezit is
      van een vergunning tot het bereiden van geneesmiddelen, als bedoeld in [artikel 2, eerste lid, onder ][ref1], van
      de wet.


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel2
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel56a
    references:
      - id: ref1
        bwb_id: BWBR0003127
        artikel: '2'
        paragraaf: '2'
  - number: 56a.2
    text: |-
      Bij het afgeven van een bereidingscertificaat als bedoeld in het eerste lid houdt de hoofdinspecteur rekening met
      de geldende administratieve voorschriften van de Wereldgezondheidsorganisatie. Hij zorgt, met betrekking tot een
      voor uitvoer bestemd en in Nederland reeds geregistreerd farmaceutisch product, voor een goedgekeurde samenvatting
      van de kenmerken van het product overeenkomstig [artikel 2, eerste lid, onder ][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003114#Artikel2
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel56a
    references:
      - id: ref1
        bwb_id: BWBR0003114
        artikel: '2'
  - number: 56a.3
    text: |-
      Een bereidingscertificaat voor een farmaceutisch product dat niet is geregistreerd, wordt slechts verleend indien
      de fabrikant aan de hoofdinspecteur een verklaring overlegt, waarin wordt uiteengezet waarom het product niet is
      geregistreerd.
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel56a
  - number: '57'
    text: |-
      Voor de toepassing van deze paragraaf wordt onder "wijzigingswet" verstaan: de wet van 29 augustus 1975 (*Stb.*
      519).
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel57
  - number: '58'
    text: |-
      Degeen aan wie overeenkomstig [artikel 2, eerste lid, onder ][ref1] van de wet, zoals dat artikelonderdeel luidde
      onmiddellijk vóór het in werking treden van de wijzigingswet, een vergunning is verleend, is verplicht binnen zes
      maanden na het in werking treden van dit artikel ter vervanging van die vergunning een aanvraag in te dienen als
      bedoeld in [de artikelen 2][ref2], [29][ref3] of [36][ref4] van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003127#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0003127#Artikel29
      [ref4]: https://wetten.overheid.nl/BWBR0003127#Artikel36
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0003127
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0003127
        artikel: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0003127
        artikel: '29'
        paragraaf: '4'
      - id: ref4
        bwb_id: BWBR0003127
        artikel: '36'
        paragraaf: '5'
  - number: '59.1'
    text: |-
      Het in [artikel 2, tweede lid, eerste volzin][ref1], van de wet vervatte verbod geldt voor wat betreft het
      verrichten van een in [artikel 19, eerste lid][ref2], bedoelde deelbewerking niet tot zes maanden na het in werking
      treden van dit artikel ten aanzien van een persoon die een zodanige deelbewerking reeds verrichtte vóór dat in
      werking treden. Indien vóór het verstrijken van die termijn een aanvraag ter verkrijging van een vergunning als
      bedoeld in [artikel 19][ref3] voor het verrichten van de deelbewerking is ingediend, geldt dat verbod ook verder
      niet tot de eerste dag van de derde kalendermaand na de dag waarop de beslissing op de aanvraag onherroepelijk
      is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003127#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0003127#Artikel19
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0003127
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0003127
        artikel: '19'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0003127
        artikel: '19'
        paragraaf: '3'
  - number: '59.2'
    text: |-
      Degeen die onmiddellijk vóór het in werking treden van de wijzigingswet reeds de in [artikel 1, onder ][ref1]
      bedoelde handelingen wettig verrichtte, is bevoegd die handelingen te blijven verrichten tot zes maanden na het
      in werking treden van dit artikel. Indien vóór het verstrijken van die termijn door die persoon een aanvraag ter
      verkrijging van een vergunning als bedoeld in [artikel 1, onder ][ref2] is ingediend, blijft die persoon bevoegd
      die handelingen te verrichten tot de eerste dag van de derde kalendermaand na de dag waarop de beslissing op de
      aanvraag onherroepelijk is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0003127#Artikel1
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0003127
        artikel: '1'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0003127
        artikel: '1'
        paragraaf: '1'
  - number: '60'
    text: |-
      Waar in dit besluit wordt verwezen naar een in het register opgenomen gegeven, wordt, voor wat betreft de in
      artikel II, leden 4-6, van de wijzigingswet bedoelde farmaceutische producten geacht te zijn verwezen naar het
      desbetreffende bij de aanvraag tot inschrijving in het register verstrekte gegeven, totdat zij in het register
      zijn ingeschreven.
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel60
  - number: '61.1'
    text: |-
      Ten aanzien van farmaceutische producten die bij het in werking treden van dit artikel reeds in Nederland in de
      handel waren zijn in plaats van de bepalingen, vervat in [de artikelen 12][ref1] en [13][ref2], gedurende twaalf
      maanden na dat in werking treden van toepassing de terzake krachtens de wet vastgestelde bepalingen zoals die
      luidden onmiddellijk vóór dat in werking treden.


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0003127#Artikel13
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0003127
        artikel: '12'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0003127
        artikel: '13'
        paragraaf: '2'
  - number: '61.2'
    text: |-
      Na het verstrijken van de in het eerste lid genoemde termijn moet ten aanzien van een in dat lid bedoeld
      farmaceutisch product, zolang dat product niet in het register is ingeschreven, in plaats van het in
      [artikel 12, eerste lid, onder ][ref1] bedoelde nummer worden vermeld het nummer dat door het College ter
      beoordeling van geneesmiddelen, genoemd in [artikel 29, eerste lid][ref2], van de wet na ontvangst van een aanvraag
      tot inschrijving in het register is verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0003127#Artikel29
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0003127
        artikel: '12'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0003127
        artikel: '29'
        paragraaf: '4'
  - number: '62.1'
    text: |-
      [Artikel 8][ref1] van de wet is niet van toepassing ten aanzien van:


      [ref1]: https://wetten.overheid.nl/BWBR0003127#Artikel8
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0003127
        artikel: '8'
        paragraaf: '2'
  - number: 62.1.a
    text: de aflevering van farmaceutische producten door artsen volgens artikel 10 van de wet van 1 juni 1865 (*Stb.* 60);
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel62
  - number: 62.1.b
    text: |-
      de aflevering van monsters van farmaceutische producten door artsen, tandartsen en verloskundigen, voor zover deze
      aflevering plaatsvindt binnen de grenzen van hun beroepsuitoefening;
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel62
  - number: 62.1.c
    text: |-
      de aflevering van orale antikonseptiva door artsen aan personen jonger dan 21 jaar die voor wat betreft de
      aflevering en het gebruik anoniem wensen te blijven, voor zover deze aflevering plaatsvindt in het kader van de
      werkzaamheden van een daarvoor naar het oordeel van Onze Minister in aanmerking komende en als zodanig door hem
      aangewezen instelling voor geboorteregeling en seksualiteitsvragen.
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel62
  - number: '62.2'
    text: |-
      De in het eerste lid, onder *b,* bedoelde personen mogen monsters van farmaceutische producten uitsluitend gratis
      afleveren.
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel62
  - number: '63'
    text: |-
      [ Artikel 2, eerste lid, onder d, van de wet][ref1] is niet van toepassing ten aanzien van de in
      [artikel 1, eerste lid, onder ][ref2] bedoelde geneesmiddelen, met uitzondering van:


      [ref1]: https://wetten.overheid.nl/BWBR0002290#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002290#Artikel1
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0002290
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0002290
        artikel: '1'
  - number: 63.a
    text: |-
      samenstellingen van substanties in een farmaceutische vorm, andere dan die een bestanddeel vormen van een medisch
      hulpmiddel in de zin van de [Wet op de medische hulpmiddelen][ref1], dat niet bestemd is om die geneesmiddelen toe
      te dienen;


      [ref1]: https://wetten.overheid.nl/BWBR0002697
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0002697
  - number: 63.b
    text: generatoren, kits en uitgangsstoffen die bestemd zijn te worden gebruikt bij de bereiding van radiofarmaceutica.
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel63
  - number: '64'
    text: |-
      Het Besluit verpakte geneesmiddelen (*Stb.* 1963, 336) en het [Besluit aanvraag vergunningen geneesmiddelen 1972]
      (onbekend) (*Stb.* 1972, 144) worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel64
  - number: '65'
    text: Dit besluit kan worden aangehaald als "Besluit bereiding en aflevering van farmaceutische producten".
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel65
  - number: '66'
    text: |-
      De artikelen van dit besluit treden in werking op een door Ons te bepalen tijdstip, dat voor de verschillende
      artikelen of onderdelen daarvan verschillend kan worden gesteld.
    url: https://wetten.overheid.nl/BWBR0003127/2007-01-01#Artikel66
