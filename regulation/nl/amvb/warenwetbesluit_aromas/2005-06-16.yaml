  - number: '12'
    text: |-
      1 De in de [artikelen 8][ref1], [9][ref2], [10][ref3] en [11][ref4] bedoelde aanduidingen, onderscheidenlijk
      vermeldingen moeten in een voor de koper gemakkelijk te begrijpen taal zijn gesteld, tenzij andere maatregelen zijn
      getroffen om te waarborgen dat deze ter zake passend worden ingelicht.

      2 In afwijking van het eerste lid, behoeven de in [artikel 9, eerste lid][ref5], bedoelde opsomming, alsmede de
      in [artikel 10, onderdelen c en d][ref6], bedoelde vermeldingen slechts voor te komen op de handelsdocumenten die
      de desbetreffende aroma's vergezellen of die tegelijkertijd met of vóór de aflevering worden verzonden. In dat
      geval moet de volgende vermelding goed zichtbaar op de verpakking of de recipiënt worden gebezigd: "bestemd voor de
      vervaardiging van levensmiddelen, niet voor de verkoop in het klein".


