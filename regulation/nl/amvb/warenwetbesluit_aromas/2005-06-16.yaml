  - number: '11'
    text: |-
      1 Indien de aroma's als zodanig zijn bestemd voor de eindverbruiker, moeten bij de verhandeling de volgende
      vermeldingen worden gebezigd:

      a. de naam of handelsnaam en het adres van de fabrikant, verpakker of een in het gebied waarop het Verdrag tot
      oprichting van de Europese Gemeenschap dan wel de Overeenkomst betreffende de Europese Economische Ruimte van
      toepassing is gevestigde verkoper, waarbij voor rechtspersonen de vermelding van het adres mag worden vervangen
      door de vermelding van de plaats van de vestiging;

      b. De vermelding "voor levensmiddelen", dan wel een meer specifieke vermelding inzake de toepassing in de eet- of
      drinkwaar waarvoor het aroma bestemd is;

      c. de vermelding "aroma", dan wel een meer specifieke omschrijving van het aroma;

      d. in geval van een mengsel van aroma's met andere stoffen of materialen als bedoeld in
      [artikel 6, eerste lid, onderdelen ][ref1] de opsomming in dalende volgorde van de gewichtshoeveelheid in het
      mengsel van:

      1°. de aanwezige aroma's volgens de vermelding als voorgeschreven onder c;

      2°. de naam van de andere stoffen of materialen of, in voorkomend geval, het EG-nummer daarvan;

      e. een aanduiding betreffende de produktiepartij;

      f. de netto-hoeveelheid;

      g. de datum van minimale houdbaarheid;

      h. een aanwijzing omtrent de bewaring en het gebruik;

      i. de plaats van oorsprong of herkomst, indien de afwezigheid hiervan de eindverbruiker kan misleiden omtrent de
      werkelijke oorsprong of herkomst van het produkt.

      2 Onverminderd het eerste lid, onder *c,* mag het woord "natuurlijk" of elke andere uitdrukking die in wezen
      dezelfde betekenis heeft, uitsluitend worden gebruikt voor aroma's waarvan het aromatiserend bestanddeel
      uitsluitend aromatiserende stoffen bevat als bedoeld in [artikel 1, eerste lid, onderdeel ][ref2], of
      aromatiserende preparaten als bedoeld in [artikel 1, eerste lid, onder c][ref3].

      3 Indien de vermelding van een aroma een verwijzing bevat naar een eet- of drinkwaar of een uitgangsmateriaal voor
      een aroma, mag het woord "natuurlijk" of elke andere uitdrukking die in wezen dezelfde betekenis heeft, uitsluitend
      worden gebruikt indien het aromatische bestanddeel uitsluitend is verkregen door geschikte fysische, enzymatische
      of microbiologische procédés of door middel van traditionele wijzen van bereiding van eet- of drinkwaren,
      uitsluitend of bijna uitsluitend de eet- of drinkwaar of het uitgangsmateriaal voor het aroma waarnaar verwezen
      wordt.


      [ref1]: https://wetten.overheid.nl/BWBR0005413#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005413#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0005413#Artikel1
