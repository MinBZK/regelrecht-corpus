  - number: '13'
    text: |-
      1 Onze Minister stelt in overeenstemming met Onze Minister van Economische Zaken en van Landbouw, Natuur en
      Voedselkwaliteit nadere regels vast met betrekking tot het gebruik van aroma's, die de volgende onderwerpen
      betreffen:

      a. de ten hoogste toegelaten hoeveelheid van het betrokken aroma, of van de betrokken categorie van aroma's, die in
      eet- of drinkwaren in het algemeen aanwezig mag zijn;

      b. in voorkomend geval welke beperking voor wat betreft het gebruik in eet- of drinkwaren, of categorieën van eet-
      of drinkwaren van toepassing is.

      2 Ten aanzien van de eet- of drinkwaar waarvoor op grond van [artikel 14][ref1] of [16 van de Warenwet][ref2]
      (*Stb.* 1935, 793) regels van kracht zijn die uitdrukkelijk mede aroma's tot onderwerp hebben zoals in dit besluit
      bedoeld, blijven, in plaats van de krachtens het eerste lid vast te stellen regeling, de bedoelde regels van
      toepassing, totdat zij uitdrukkelijk worden ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0001969#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0001969#Artikel16
    url: https://wetten.overheid.nl/BWBR0005413/2005-06-16#Artikel13
