        artikel: '16'
  - number: 13a
    text: |-
      Als bevoegde instantie, bedoeld in artikel 7, eerste lid, onder a, van [verordening (EG) 2065/2003](32003R2065),
      wordt aangewezen de Voedsel en Waren Autoriteit.
    url: https://wetten.overheid.nl/BWBR0005413/2005-06-16#Artikel13a
  - number: '14'
    text: |-
      1 Als methoden van onderzoek welke bij uitsluiting beslissend zijn voor de vaststelling of met betrekking tot
      aroma's, onderscheidenlijk met betrekking tot eet- of drinkwaren waaraan aroma's zijn toegevoegd, al dan niet is
      voldaan aan de bij of krachtens dit besluit gestelde regels, worden aangewezen chromatografische scheidingsmethoden
      alsmede fysische, biologische en chemische isolatiemethoden.

      2 Onze Minister kan omtrent de in het eerste lid bedoelde methoden nadere regels stellen.
    url: https://wetten.overheid.nl/BWBR0005413/2005-06-16#Artikel14
  - number: '15'
    text: |-
      1 Het Geur- en smaakstoffenbesluit (Warenwet) (*Stb.* 1979, 396) wordt ingetrokken.

      2 In afwijking van het eerste lid, blijven de krachtens artikel 2, derde lid, van het Geur- en smaakstoffenbesluit
      (Warenwet) vastgestelde regels van kracht totdat zij uitdrukkelijk worden ingetrokken, met uitzondering van de
      regels voor wat betreft de stoffen agaricinezuur, beta-asaron, blauwzuur, cumarine, hypericine, pulegon, quassine,
      safrol, thujon en benz(a)pyreen.
    url: https://wetten.overheid.nl/BWBR0005413/2005-06-16#Artikel15
  - number: '16'
    text: |-
      1 Dit besluit treedt in werking met ingang van de tweede dag na de datum van uitgifte van het *Staatsblad,* waarin
      het wordt geplaatst.

      2 Aroma's welke voldoen aan de voorschriften die van toepassing zijn op de dag voor het in werking treden van dit
      besluit, mogen worden verhandeld en bij de bereiding van eet- of drinkwaren worden gebruikt tot 1 juni 1992.
    url: https://wetten.overheid.nl/BWBR0005413/2005-06-16#Artikel16
  - number: '17'
    text: 'Dit besluit kan worden aangehaald als: Warenwetbesluit Aroma''s.'
    url: https://wetten.overheid.nl/BWBR0005413/2005-06-16#Artikel17
