  - number: '10'
    text: |-
      Indien de aroma's als zodanig niet zijn bestemd voor de eindverbruiker of instellingen, moeten, onverminderd de
      [artikelen 8][ref1] en [9][ref2], bij de verhandeling de volgende vermeldingen worden gebezigd:

      a. de naam of handelsnaam en het adres van de fabrikant, verpakker of van een in het gebied waarop het Verdrag
      tot oprichting van de Europese Gemeenschap dan wel de Overeenkomst betreffende de Europese Economische Ruimte van
      toepassing is gevestigde verkoper, waarbij voor rechtspersonen de vermelding van het adres mag worden vervangen
      door de vermeling van de plaats van de vestiging;

      b. De vermelding "voor levensmiddelen", dan wel een meer specifieke vermelding inzake de toepassing in de eet- en
      drinkwaar waarvoor het aroma bestemd is;

      c. in geval van een mengsel van aroma's met andere stoffen of materialen als bedoeld in
      [artikel 6, eerste lid, onderdelen ][ref3] de opsomming in dalende volgorde van de gewichtshoeveelheid in het
      mengsel van:

      1°. de aanwezige aroma's volgens de indeling opgenomen in [artikel 9, eerste lid][ref4];

      2°. de naam van de andere stoffen of materialen of, in voorkomend geval, het EG-nummer daarvan;

      d. informatie over elk ingrediënt of groep van ingrediënten, waarvoor in een eet- of drinkwaar een kwantitatieve
      beperking geldt, aan de hand waarvan de koper kan voldoen aan enigerlei voor de desbetreffende eet- of drinkwaar
      geldend wettelijk voorschrift ter zake;

      e. de netto-hoeveelheid.


      [ref1]: https://wetten.overheid.nl/BWBR0005413#Artikel8
