preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Welzijn, Volksgezondheid en Cultuur van 26 juni 1991, VVP/L-U-691089,
    gedaan in overeenstemming met Onze Minister van Economische Zaken en de Staatssecretaris van Landbouw, Natuurbeheer
    en Visserij;

    Overwegende, dat uitvoering moet worden gegeven aan de Richtlijn van de Raad van de Europese Gemeenschappen van
    22 juni 1988 betreffende de onderlinge aanpassing van de wetgevingen der Lid-Staten inzake aroma's voor gebruik in
    levensmiddelen en de uitgangsmaterialen voor de bereiding van die aroma's (88/388/EEG) (PbEG L 184) en de Richtlijn
    van de Commissie van 16 januari 1991 tot aanvulling van bovengenoemde Richtlijn 88/388/EEG (PbEG L 42);

    Gelet op de artikelen 4, eerste lid, onderdeel a, 6, onderdeel a, 8, onderdelen a, b en c,12 en 14 van de Warenwet
    (Stb. 1988, 360);

    Gezien het advies van de Adviescommissie Warenwet (advies van 12 december 1990, nr. 14282/(1)5);

    De Raad van State gehoord (advies van 18 oktober 1991, nr. W13.91.0379);

    Gezien het nader rapport van de Staatssecretaris van Welzijn, Volksgezondheid en Cultuur van 21 januari 1992, nr.
    VVP/L-692502, uitgebracht in overeenstemming met Onze Minister van Economische Zaken en de Staatssecretaris van
    Landbouw, Natuurbeheer en Visserij;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0005413/2005-06-16#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. aroma's: aromastof, aromatiserend preparaat, verwerkingsaroma en rookaroma, alsmede mengsels daarvan, voor zover
      deze stoffen of produkten bestemd of geschikt zijn om aan eet- en drinkwaren geur of smaak te geven;

      b. aromastof: een gedefinieerde chemische stof met aromatiserende eigenschappen, welke is verkregen door:

      1°. geschikte fysische, enzymatische of microbiologische procédés uit een grondstof van plantaardige of dierlijke
      oorsprong, hetzij als zodanig, hetzij verwerkt door middel van traditionele wijzen van bereiding van eet- of
      drinkwaren;

      2°. chemische synthese of geïsoleerd door chemische procédés, en welke stof chemisch identiek is met een stof die
      van nature voorkomt in een produkt van plantaardige of dierlijke oorsprong als omschreven onder 1°; dan wel

      3°. chemische synthese, maar die chemisch niet identiek is met een stof die van nature voorkomt in een grondstof
      van plantaardige of dierlijke oorsprong als omschreven onder 1°;

      c. aromatiserend preparaat: een al dan niet geconcentreerd produkt met aromatiserende eigenschappen, zijnde een
      ander produkt dan aromastof;

      d. verwerkingsaroma: een produkt met aromatiserende eigenschappen, verkregen uit een mengsel van bestanddelen die
      niet noodzakelijkerwijs zelf aromatiserende eigenschappen bezitten;

      e. rookaroma: een rookextract dat wordt gebruikt in de traditionele procédés voor het roken van levensmiddelen;

      f. richtlijn: de Richtlijn van de Raad van 22 juni 1988 betreffende de onderlinge aanpassing van de wetgevingen der
      Lid-Staten inzake aroma's voor gebruik in levensmiddelen en de uitgangsmaterialen voor de bereiding van die aroma's
      (88/388/EEG) (*PbEG* L 184);

      g. *verordening (EG) 2065/2003*: [verordening (EG) nr. 2065/2003](32003R2065) van het Europees Parlement en de
      Raad van de Europese Unie van 10 november 2003 inzake in of op levensmiddelen gebruikte of te gebruiken rookaroma's
      (PbEU L 309).

      2 Als aroma's worden niet beschouwd:

      a. eet- en drinkwaren;

      b. stoffen die uitsluitend een zoete, zure of zoute smaak hebben;

      c. stoffen van plantaardige of dierlijke oorsprong met intrinsieke aromatiserende eigenschappen voor zover zij niet
      worden gebruikt als uitgangsmateriaal voor de bereiding van aroma's.
    url: https://wetten.overheid.nl/BWBR0005413/2005-06-16#Artikel1
  - number: '2'
    text: |-
      1 Het is verboden aroma's welke niet voldoen aan de bij of krachtens dit besluit gestelde eisen, te verhandelen of
      in eet- of drinkwaren te verwerken.

      2 Het is verboden aroma's te verhandelen anders dan met inachtneming van de voorschriften in dit besluit gesteld
      met betrekking tot hun aanduiding of tot het bezigen van vermeldingen.

      3 Het is verboden met gebruikmaking van de in dit besluit aangegeven aanduidingen andere waren te verhandelen dan
      aroma's waaraan die aanduidingen zijn voorbehouden.

      4 Het is verboden eet- of drinkwaren te bereiden of te verhandelen die niet voldoen aan de eisen bij of krachtens
      dit besluit gesteld met betrekking tot de aanwezigheid van aroma's in die eet- en drinkwaren.

      5 Het is verboden te handelen in strijd met artikel 4, tweede lid, van [verordening (EG) 2065/2003](32003R2065).
    url: https://wetten.overheid.nl/BWBR0005413/2005-06-16#Artikel2
  - number: '3'
    text: |-
      1 Een aromatiserend preparaat mag uitsluitend door geschikte fysische, enzymatische of microbiologische procédés
      zijn of worden verkregen uit grondstoffen van plantaardige of dierlijke oorsprong, hetzij als zodanig, hetzij
      verwerkt door middel van traditionele wijzen van bereiding van eet- of drinkwaren.

      2 Een verwerkingsaroma mag uitsluitend, via deugdelijke fabricageprocédés, door verhitting zijn of worden verkregen
      bij een temperatuur van ten hoogste 180° gedurende ten hoogste 15 minuten. Een van de bestanddelen van het
      verwerkingsaroma moet tenminste één stikstofamino-molecuul bevatten, terwijl een ander bestanddeel een reducerende
      suiker moet zijn.
    url: https://wetten.overheid.nl/BWBR0005413/2005-06-16#Artikel3
  - number: '4'
    text: |-
      1 Aroma's moeten voldoen aan de volgende algemene zuiverheidseisen:

      a. het gehalte aan arsenicum mag ten hoogste 3 mg per kg bedragen;

      b. het gehalte aan lood mag ten hoogste 10 mg per kg bedragen;

      c. het gehalte aan cadmium, onderscheidenlijk kwik mag ten hoogste 1 mg per kg bedragen.

      2 Het gebruik van aroma's mag niet leiden tot een gehalte aan 3,4-Benzopyreen in voor consumptie gereed zijnde eet-
      en drinkwaren dat groter is dan 0,03 microgram per kilogram.

      3 Het gebruik van aroma's en andere ingrediënten van eet- of drinkwaren met aromatiserende eigenschappen mag niet
      leiden tot een gehalte aan een of meer van onderstaande stoffen in eet- en drinkwaren in een hoeveelheid die de
      door Onze Minister voor de desbetreffende stof, en in voorkomend geval voor de desbetreffende eet- of drinkwaar,
      vastgestelde hoeveelheid overschrijdt: agaricinezuur, aloïne, beta-asaron, berberine, cumarine, cyaanwaterstofzuur,
      hypericine, pulegon, quassine, safrol en isosafrol, santonine, thujon (alfa en beta).

      4 De in het derde lid genoemde stoffen mogen niet als zodanig in eet- en drinkwaren of aan aroma's worden of
      zijn toegevoegd. Zij mogen slechts in de desbetreffende eet- of drinkwaar aanwezig zijn voor zover zij daarin van
      nature voorkomen, dan wel voor zover zij afkomstig zijn van toegevoegde aroma's, die uitsluitend zijn verkregen uit
      produkten van plantaardige of dierlijke oorsprong.

      5 De in het derde lid bedoelde hoeveelheden worden vastgesteld ter uitvoering van in of krachtens de richtlijn
      getroffen maatregelen ter zake.
    url: https://wetten.overheid.nl/BWBR0005413/2005-06-16#Artikel4
  - number: '5'
    text: |-
      1 Onze Minister stelt nadere regels vast ten aanzien van het uitgangsmateriaal, onderscheidenlijk de grondstoffen
      voor de bereiding van aroma's.

      2 Onze Minister kan nadere regels vaststellen die betrekking hebben op de bereidingsmethoden van aroma's.

      3 Onze Minister stelt nadere regels vast ten aanzien van toe te laten aromastoffen.

      4 De in het eerste, tweede en derde lid bedoelde regels worden vastgesteld ter uitvoering van de krachtens de
      richtlijn getroffen maatregelen ter zake.
    url: https://wetten.overheid.nl/BWBR0005413/2005-06-16#Artikel5
  - number: '6'
    text: |-
      1 Onze Minister stelt nadere regels vast die betrekking hebben op stoffen of materialen die in aroma's aanwezig
      mogen zijn en die:

      a. noodzakelijk zijn voor de bereiding van aroma's;

      b. mogen worden gebruikt voor het oplossen en verdunnen van aroma's;

      c. noodzakelijk zijn voor de opslag en het gebruik van aroma's.

      2 Onze Minister stelt nadere regels vast die betrekking hebben op de voorwaarden voor het gebruik van de in het
      eerste lid bedoelde stoffen en materialen.

      3 De in het eerste en tweede lid bedoelde regels worden vastgesteld ter uitvoering van krachtens de richtlijn
      getroffen maatregelen ter zake.
    url: https://wetten.overheid.nl/BWBR0005413/2005-06-16#Artikel6
  - number: '7'
    text: |-
      1 Onze Minister kan ten aanzien van de deugdelijkheid van aroma's nadere regels vaststellen die betrekking hebben
      op:

      a. microbiologische criteria;

      b. specifieke zuiverheidscriteria voor bijzondere aroma's.

      2 De in het eerste lid bedoelde regels worden vastgesteld ter uitvoering van krachtens de richtlijn getroffen
      maatregelen ter zake.
    url: https://wetten.overheid.nl/BWBR0005413/2005-06-16#Artikel7
  - number: '8'
    text: |-
      1 Bij de verhandeling van aroma's mag uitsluitend en moet worden gebezigd de aanduiding "aroma", dan wel de meer
      specifieke benaming of omschrijving van de betrokken aroma's.

      2 Onze Minister kan nadere regels vaststellen die betrekking hebben op de criteria voor de definitie van de in het
      eerste lid bedoelde meer specifieke benamingen.

      3 Onze Minister kan nadere regels vaststellen met betrekking tot de meer specifieke benamingen voor de aanduiding
      van de aroma's die uit mengsels van aromatiserende preparaten en aromastoffen bestaan.

      4 Onze Minister kan voorts nadere regels stellen die betrekking hebben op de aanduiding van aroma's die zijn
      bestemd voor de verhandeling aan de eindverbruiker of aan een instelling.

      5 De in het tweede, derde en vierde lid bedoelde regels worden vastgesteld ter uitvoering van krachtens de
      richtlijn getroffen maatregelen ter zake.

      6 Indien de aanduiding een verwijzing bevat naar een eet- of drinkwaar of een uitgangsmateriaal voor de bereiding
      van aroma's, mag in die verwijzing het woord "natuurlijk" of elke andere uitdrukking die in wezen dezelfde
      betekenis heeft, uitsluitend worden gebruikt voor zover het aromatiserende bestanddeel is geïsoleerd door geschikte
      fysische procédés dan wel enzymatische of microbiologische procédés of door traditionele bereidingswijzen van eet-
      en drinkwaren, uitsluitend of vrijwel uitsluitend uitgaande van de betrokken eet- of drinkwaar of het betrokken
      uitgangsmateriaal voor de bereiding van aroma's.
    url: https://wetten.overheid.nl/BWBR0005413/2005-06-16#Artikel8
  - number: '9'
    text: |-
      1 Indien de aroma's als zodanig niet zijn bestemd voor de eindverbruiker of instellingen, moet,
      onverminderd [artikel 8][ref1], bij de verhandeling worden gebezigd de opsomming, in dalende volgorde van de
      gewichtshoeveelheid, van de aanwezige aromatiserende bestanddelen volgens onderstaande indeling:

      a. natuurlijke aromastoffen voor de met een van de in [artikel 1, eerste lid, onderdeel ][ref2], beschreven
      procédés verkregen aromastoffen;

      b. natuuridentieke aromastoffen voor de met een van de in [artikel 1, eerste lid, onderdeel ][ref3], beschreven
      procédés verkregen aromastoffen;

      c. kunstmatige aromastoffen voor de met het in [artikel 1, eerste lid, onderdeel ][ref4], beschreven procédé
      verkregen aromastoffen;

      d. aromatiserende preparaten;

      e. verwerkingsaroma's;

      f. rookaroma's.

      2 Onverminderd het eerste lid, mag het woord "natuurlijke" of elke andere uitdrukking die in wezen dezelfde
      betekenis heeft, uitsluitend worden gebruikt voor aroma's waarvan de aromatiserende component uitsluitend
      aromatiserende stoffen bevat als bedoeld in [artikel 1, eerste lid, onderdeel ][ref5], of aromatiserende preparaten
      als bedoeld in [artikel 1, eerste lid, onder c][ref6].


