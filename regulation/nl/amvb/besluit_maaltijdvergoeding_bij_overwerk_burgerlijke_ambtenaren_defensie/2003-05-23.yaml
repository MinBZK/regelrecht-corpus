preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Defensie van 1 februari 1993, nr. PAV2210/93002671;

    Gelet op de artikelen 125, eerste lid, en 134, eerste lid, van de Ambtenarenwet 1929;

    De Raad van State gehoord (advies van 29 maart 1993, nr WO7.93.0070);

    Gezien het nader rapport van Onze Minister van Defensie van 16 juni 1993, nr. PAV2210/93008954;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0006036/2003-05-23#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0006036/2003-05-23#Artikel1
  - number: 1.a
    text: Onze Minister Onze Minister van Defensie;
    url: https://wetten.overheid.nl/BWBR0006036/2003-05-23#Artikel1
  - number: 1.b
    text: bevoegd gezag de bij koninklijk besluit of bij ministeriële regeling als zodanig aangewezen autoriteit;
    url: https://wetten.overheid.nl/BWBR0006036/2003-05-23#Artikel1
  - number: 1.c
    text: |-
      ambtenaar degene die ambtenaar is in de zin van het [Burgerlijk ambtenarenreglement defensie][ref1] of werknemer in
      de zin van het Arbeidsovereenkomstenbesluit;


      [ref1]: https://wetten.overheid.nl/BWBR0006040
    url: https://wetten.overheid.nl/BWBR0006036/2003-05-23#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006040
  - number: 1.d
    text: een maaltijd een eenvoudige warme maaltijd, bestaande uit ten minste een hoofdschotel;
    url: https://wetten.overheid.nl/BWBR0006036/2003-05-23#Artikel1
  - number: 1.e
    text: |-
      een maaltijd van overheidswege een maaltijd, al dan niet tegen betaling van rijkswege verstrekt, of door
      bemiddeling van het bevoegde gezag voor rekening van het Rijk verstrekt;
    url: https://wetten.overheid.nl/BWBR0006036/2003-05-23#Artikel1
  - number: 1.f
    text: |-
      overwerk hetgeen daaronder wordt verstaan in het [Bezoldigingsbesluit burgerlijke ambtenaren defensie][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006038
    url: https://wetten.overheid.nl/BWBR0006036/2003-05-23#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006038
  - number: '2.1'
    text: |-
      Indien de dagelijkse werktijd van de ambtenaar op de dag waarop overwerk wordt verricht, met ten minste twee
      overwerkuren wordt verlengd en het dienstbelang naar het oordeel van het bevoegde gezag dientengevolge niet
      toelaat, dat hij zijn maaltijd op de hiervoor bestemde tijd op de voor hem gebruikelijke plaats nuttigt, gelden de
      in de volgende leden vermelde regels.
    url: https://wetten.overheid.nl/BWBR0006036/2003-05-23#Artikel2
  - number: '2.2'
    text: |-
      Aan de ambtenaar wordt zo mogelijk een maaltijd van overheidswege verstrekt, met dien verstande dat indien hij
      hiervoor heeft moeten betalen, hem de gemaakte kosten worden vergoed tot ten hoogste het bedrag van de vergoeding
      berekend op de voet van het derde lid, onder *a*.
    url: https://wetten.overheid.nl/BWBR0006036/2003-05-23#Artikel2
  - number: '2.3'
    text: |-
      Indien een voorziening als bedoeld in het tweede lid niet mogelijk is, ontvangt de ambtenaar, die aantoonbaar
      een maaltijd in een daarvoor bestemde gelegenheid heeft genuttigd en betaald dan wel die niet aantoonbaar
      een maaltijd in een daarvoor bestemde gelegenheid heeft genuttigd en betaald, een vergoeding op grond van
      [artikel 12 van het Besluit dienstreizen defensie][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007956#Artikel12
    url: https://wetten.overheid.nl/BWBR0006036/2003-05-23#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0007956
        artikel: '12'
  - number: '3'
    text: |-
      Het besluit is niet van toepassing voor zover een andere regeling in vergoeding van de in dit besluit bedoelde
      kosten voorziet.
    url: https://wetten.overheid.nl/BWBR0006036/2003-05-23#Artikel3
  - number: '4.1'
    text: |-
      Onze Minister is bevoegd van de bij dit besluit gestelde regels af te wijken in gevallen waarin deze regels naar
      zijn oordeel niet of niet naar redelijkheid voorzien.
    url: https://wetten.overheid.nl/BWBR0006036/2003-05-23#Artikel4
  - number: '4.2'
    text: |-
      Onze Minister is bevoegd dit besluit op overeenkomstige wijze toe te passen voor met overwerk vergelijkbare
      situaties.
    url: https://wetten.overheid.nl/BWBR0006036/2003-05-23#Artikel4
  - number: '5'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het *Staatsblad* waarin het wordt
      geplaatst en werkt terug tot en met 1 april 1993.
    url: https://wetten.overheid.nl/BWBR0006036/2003-05-23#Artikel5
  - number: '6'
    text: Dit besluit wordt aangehaald als het Besluit maaltijdvergoeding bij overwerk burgerlijke ambtenaren defensie.
    url: https://wetten.overheid.nl/BWBR0006036/2003-05-23#Artikel6
