  - number: '5'
    text: |-
      1 Op verzoek van de ambtenaar ziet het bevoegd gezag af van het verlenen van ontslag, bedoeld in
      [artikel 2 eerste lid][ref1], voor de duur van telkens één jaar, indien de ambtenaar blijkens de uitslag
      van een door de deskundige persoon of arbodienst ingesteld arbeidsgezondheidskundig onderzoek als bedoeld in
      [artikel 36a, eerste lid, onder f, van het Algemeen Rijksambtenarenreglement][ref2], lichamelijk en psychisch in
      staat kan worden geacht zijn functie te blijven vervullen.

      2 Indien niet meer wordt voldaan aan de voorwaarde, genoemd in het eerste lid, wordt eervol ontslag als bedoeld in
      [artikel 2, eerste lid][ref3], verleend.

      3 Het ontslag, bedoeld in het tweede lid, wordt verleend met ingang van een dag niet vroeger dan een maand, maar
      niet later dan drie maanden na de dag, waarop niet langer aan de voorwaarde, genoemd in het eerste lid, wordt
      voldaan.


