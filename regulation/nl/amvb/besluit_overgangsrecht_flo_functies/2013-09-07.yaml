  - number: '4'
    text: |-
      1

      2 Voor de ambtenaar die is geboren vóór 1 januari 1950, gaat het in [artikel 2, eerste lid][ref1],
      bedoelde ontslag zoveel maanden eerder in dan zijn ontslag op zijn 65ste jaar, als het aantal jaren, dat
      de ambtenaar voor 1 januari 2000 een of meer functies waaraan een leeftijdsgrens was verbonden op grond van
      [artikel 97, eerste lid, van het Algemeen Rijksambtenarenreglement][ref2], zoals dit artikel luidde voor
      inwerkingtreding van onderhavig besluit, zonder wezenlijke onderbreking heeft vervuld, vermenigvuldigd met een
      factor 2, met een maximum van 60 maanden.

      3 Voor de ambtenaar die is geboren in de periode van 1 januari 1950 tot en met 31 december 1964,
      gaat het in [artikel 2, vijfde lid][ref3], bedoelde verlof zoveel maanden eerder in dan de eerste
      dag van de maand waarin hij de leeftijd van 65 jaar bereikt, als het aantal jaren dat de ambtenaar
      voor 1 januari 2000 een of meer functies waaraan een leeftijdsgrens was verbonden op grond van
      [artikel 97, eerste lid, van het Algemeen Rijksambtenarenreglement][ref4], zoals dit artikel luidde vóór
      inwerkingtreding van onderhavig besluit, zonder wezenlijke onderbreking heeft vervuld, vermenigvuldigd met een
      factor 2, met een maximum van 60 maanden.

      4 Voor de ambtenaar die geboren is na 31 december 1964, gaat het in [artikel 2, eerste lid][ref5], bedoelde ontslag
      zoveel maanden eerder in dan de eerste dag van de maand waarin hij de leeftijd van 65 jaar bereikt, als het aantal
      jaren, dat de ambtenaar voor 1 januari 2000 een of meer functies waaraan een leeftijdsgrens was verbonden op
      grond van [artikel 97, eerste lid, van het Algemeen Rijksambtenarenreglement][ref6], zoals dit artikel luidde vóór
      inwerkingtreding van onderhavig besluit, zonder wezenlijke onderbreking heeft vervuld, vermenigvuldigd met een
      factor 2, met een maximum van 60 maanden.

      5 Ten aanzien van het begrip wezenlijke onderbreking is [artikel 2, tweede lid][ref7], van toepassing.


