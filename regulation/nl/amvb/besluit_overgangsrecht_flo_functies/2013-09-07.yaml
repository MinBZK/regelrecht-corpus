  - number: '6'
    text: |-
      1 Voor de ambtenaar die is geboren vóór 1 januari 1950 bedraagt de uitkering, verbonden aan een ontslag
      als bedoeld in [artikel 2, eerste lid][ref1], 80% van de bezoldiging, vermeerderd met zoveel – ten hoogste
      tien – maal 0,5% van de bezoldiging als het totaal aantal volle voor pensioen geldige dienstjaren die
      meetellen voor de pensioenberekening krachtens het pensioenreglement, op de datum van het ontslag, bedoeld in
      [artikel 2, eerste lid][ref2], meer dan dertig bedraagt.

      2 Onder dienstjaren wordt in het eerste lid verstaan:

      a. voorzover gelegen vóór 1 januari 1996: de tijd, die voor betrokkene per 31 december 1995 meetelt voor de
      pensioenberekening, bedoeld in de Algemene burgerlijke pensioenwet, zoals deze luidde op 31 december 1995;

      b. voorzover gelegen op of na 1 januari 1996: de tijd gedurende welke betrokkene overheidswerknemer is in de zin
      van de [Wet privatisering ABP][ref3].

      3 Bij de berekening van het bedrag van het pensioen, bedoeld in het eerste lid, wordt mede in aanmerking genomen de
      diensttijd, bedoeld in artikel 5.1, tweede lid, van het pensioenreglement, die de betrokkene bij het bereiken van
      de leeftijd van 65 jaar zal kunnen aanwijzen.

      4 Voor de toepassing van het eerste lid wordt in aanmerking genomen de eventuele diensttijd, bedoeld in artikel D1,
      tweede lid, van de Algemene burgerlijke pensioenwet, zoals deze luidde op 31 december 1995. Het verzoek, bedoeld in
      artikel D2 van laatstgenoemde wet, wordt geacht te zijn gedaan.

      5 De in het eerste lid bedoelde uitkering wordt gelijkgesteld met een uitkering die is toegekend op basis van de op
      grond van [artikel 97, zevende lid, van het Algemeen Rijksambtenarenreglement][ref4] vastgestelde regels.


