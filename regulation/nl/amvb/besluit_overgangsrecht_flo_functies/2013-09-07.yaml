articles:
  - number: '2'
    text: |-
      1 Aan de ambtenaar die op 1 januari 2000 een in [artikel 3][ref1] genoemde functie vervulde en nadien zonder
      wezenlijke onderbreking blijft vervullen, wordt door Onze Minister eervol ontslag verleend met inachtneming van de
      volgende leden en artikelen.

      2 Onder een wezenlijke onderbreking, als bedoeld in het eerste lid, wordt verstaan een periode van meer dan zes
      maanden gedurende welke de ambtenaar niet daadwerkelijk is belast geweest met het vervullen van een functie, als
      bedoeld in [artikel 3][ref2], anders dan in verband met:

      a. ongeschiktheid tot het verrichten van zijn arbeid wegens ziekte;

      b. het genieten van ouderschapsverlof en zwangerschaps- en bevallingsverlof;

      c. het in een aaneengesloten periode opnemen van gespaarde compensatie-uren, als bedoeld in
      [artikel 1, tweede lid, van de Regeling van 25 november 1996][ref3] (Stcrt. 233);

      d. het in een aaneengesloten periode opnemen van verlof als bedoeld in de
      [Verlofspaarregeling rijkspersoneel][ref4];

      e. het in een aaneengesloten periode opnemen van verlof als bedoeld in de [Levensloopregeling rijkspersoneel][ref5];

      f. het genieten van scholingsverlof als bedoeld in
      [artikel 59, derde lid, van het Algemeen Rijksambtenarenreglement][ref6];

      g. een tijdelijke overplaatsing, als bedoeld in [artikel 58 van het Algemeen Rijksambtenarenreglement][ref7].

      3 De op grond van [artikel 97, zevende lid, van het Algemeen Rijksambtenarenreglement][ref8] vastgestelde regels
      zijn van overeenkomstige toepassing op het ontslag, bedoeld in het eerste lid, tenzij bij dit besluit daarvan wordt
      afgeweken.

      4 Voor de ambtenaar die is geboren vóór 1 januari 1950 wordt het in het eerste lid verleende ontslag wordt geacht
      een ontslag te zijn als bedoeld in [artikel 94a, tweede lid, van het Algemeen Rijksambtenarenreglement][ref9],
      indien ten aanzien van dat ontslag wordt voldaan aan de in dat artikel genoemde voorwaarden.

      5 Aan de ambtenaar die is geboren in de periode van 1 januari 1950 tot en met 31 december 1964 wordt in verband
      met een ontslag als bedoeld in het eerste lid, buitengewoon verlof zonder behoud van bezoldiging verleend. Tijdens
      dit verlof bestaat recht op een uitkering. Deze uitkering bedraagt 80% van de bezoldiging. De uitkering eindigt
      met ingang van de eerste dag van de maand volgend op de dag waarop de ambtenaar met het totaal van zijn recht
      op extra opbouw ouderdomspensioen, zijn recht op inkoop aanspraken ouderdomspensioen en zijn aanspraken op grond
      van overgangsbepaling A bij hoofdstuk 6 van het pensioenreglement Stichting Pensioenfonds ABP in staat is een
      pensioenuitkering te financieren tot de eerste dag van de maand waarin hij de leeftijd van 65 jaar bereikt waarvan
      de hoogte gelijk is aan zijn uitkering.


