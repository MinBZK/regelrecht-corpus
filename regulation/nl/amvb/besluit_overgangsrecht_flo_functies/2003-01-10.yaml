$id: besluit_overgangsrecht_flo_functies
regulatory_layer: AMVB
publication_date: '2015-03-26'
valid_from: '2003-01-10'
bwb_id: BWBR0010859
url: https://wetten.overheid.nl/BWBR0010859/2003-01-10
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties van 21 juli 1999, nr. AD1999/
    U76877, directoraat-generaal Management en Personeelsbeleid, directie Personeelsmanagement Rijksdienst, afdeling
    Arbeidsvoorwaarden;

    Gelet op artikel 125, eerste lid, van de Ambtenarenwet;

    De Raad van State gehoord (advies van 4 oktober 1999, no. W04.99.0425/I);

    Gezien het nader rapport van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties van 1 november 1999, nr.
    AD1999/U90401, directoraat-generaal Management en Personeelsbeleid, directie Personeelsmanagement Rijksdienst,
    afdeling Arbeidsvoorwaarden;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0010859/2003-01-10#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Op de gewezen ambtenaar die op de dag voorafgaande aan de dag waarop de Regeling uitkering wegens functioneel
      leeftijdsontslag is ingetrokken, een uitkering genoot op grond van die regeling, blijft laatstgenoemde regeling,
      zoals deze op voornoemde dag luidde, van toepassing.
    url: https://wetten.overheid.nl/BWBR0010859/2003-01-10#Artikel1
  - number: '2.1'
    text: |-
      Aan de ambtenaar die op 1 januari 2000 een in [artikel 3][ref1] genoemde functie vervulde en nadien zonder
      wezenlijke onderbreking blijft vervullen, wordt door Onze Minister eervol ontslag verleend met inachtneming van de
      volgende leden en artikelen.


      [ref1]: https://wetten.overheid.nl/BWBR0010859#Artikel3
    url: https://wetten.overheid.nl/BWBR0010859/2003-01-10#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0010859
        artikel: '3'
  - number: '2.2'
    text: |-
      Onder een wezenlijke onderbreking, als bedoeld in het eerste lid, wordt verstaan een periode van meer dan zes
      maanden gedurende welke de ambtenaar niet daadwerkelijk is belast geweest met het vervullen van een functie, als
      bedoeld in [artikel 3][ref1], anders dan in verband met:


      [ref1]: https://wetten.overheid.nl/BWBR0010859#Artikel3
    url: https://wetten.overheid.nl/BWBR0010859/2003-01-10#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0010859
        artikel: '3'
  - number: 2.2.a
    text: ongeschiktheid tot het verrichten van zijn arbeid wegens ziekte;
    url: https://wetten.overheid.nl/BWBR0010859/2003-01-10#Artikel2
  - number: 2.2.b
    text: het genieten van ouderschapsverlof en zwangerschaps- en bevallingsverlof;
    url: https://wetten.overheid.nl/BWBR0010859/2003-01-10#Artikel2
  - number: 2.2.c
    text: |-
      het in een aaneengesloten periode opnemen van gespaarde compensatie-uren, als bedoeld in artikel 1, tweede lid, van
      de Regeling van 25 november 1996 (Stcrt. 233);
    url: https://wetten.overheid.nl/BWBR0010859/2003-01-10#Artikel2
  - number: 2.2.d
    text: |-
      het genieten van scholingsverlof als bedoeld in
      [artikel 59, derde lid, van het Algemeen Rijksambtenarenreglement][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel59
    url: https://wetten.overheid.nl/BWBR0010859/2003-01-10#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '59'
  - number: 2.2.e
    text: |-
      een tijdelijke overplaatsing, als bedoeld in [artikel 58 van het Algemeen Rijksambtenarenreglement][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel58
    url: https://wetten.overheid.nl/BWBR0010859/2003-01-10#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '58'
  - number: '2.3'
    text: |-
      De op grond van [artikel 97, zevende lid, van het Algemeen Rijksambtenarenreglement][ref1] vastgestelde regels
      zijn van overeenkomstige toepassing op het ontslag, bedoeld in het eerste lid, tenzij bij dit besluit daarvan wordt
      afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel97
    url: https://wetten.overheid.nl/BWBR0010859/2003-01-10#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '97'
  - number: '2.4'
    text: |-
      Het in het eerste lid verleende ontslag wordt geacht een ontslag te zijn als bedoeld in
      [artikel 94a, tweede lid, van het Algemeen Rijksambtenarenreglement][ref1], indien ten aanzien van dat ontslag
      wordt voldaan aan de in dat artikel genoemde voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel94a
    url: https://wetten.overheid.nl/BWBR0010859/2003-01-10#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 94a
  - number: '3'
    text: |-
      De in [artikel 2, eerste lid][ref1], bedoelde functies zijn:


      [ref1]: https://wetten.overheid.nl/BWBR0010859#Artikel2
    url: https://wetten.overheid.nl/BWBR0010859/2003-01-10#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0010859
        artikel: '2'
  - number: 3.a
    text: |-
      bij het Ministerie van Justitie, een instelling van de Dienst Justitiële Inrichtingen: - algemeen directeur;
        - hoofd begeleiding;
        - bedrijfsleider;
        - sociaal-cultureel werker;
        - therapeut;
        - hoofd civiele dienst/hoofd interne dienst;
    url: https://wetten.overheid.nl/BWBR0010859/2003-01-10#Artikel3
  - number: 3.b
    text: |-
      bij het Ministerie van Landbouw, Natuurbeheer en Visserij, de directie Visserij: - kok aan boord van de zeegaande
      onderzoeksvaartuigen;
    url: https://wetten.overheid.nl/BWBR0010859/2003-01-10#Artikel3
  - number: 3.c
    text: 'bij het Ministerie van Verkeer en Waterstaat:'
    url: https://wetten.overheid.nl/BWBR0010859/2003-01-10#Artikel3
  - number: 3.c.1
    text: |-
      de dienstkring Waddenzee Oost van de directie Noord-Nederland van het directoraat-generaal Rijkswaterstaat: -
      kantonnier duinarbeider;
    url: https://wetten.overheid.nl/BWBR0010859/2003-01-10#Artikel3
  - number: 3.c.2
    text: |-
      de Scheepsvaartinspectie van het directoraat-generaal Goederenvervoer: - adjunct-inspecteur;
        - expert en senior-expert;
        - scheepsmeter en senior-scheepsmeter;
    url: https://wetten.overheid.nl/BWBR0010859/2003-01-10#Artikel3
  - number: 3.c.3
    text: |-
      de hoofdafdeling Handhaving van de Rijksdienst voor de Radiocommunicatie van het directoraat-generaal
      Telecommunicatie en Post: - inspectie-ambtenaar Landmobiel en Binnenvaart;
        - (eerste) medewerker mobiele monitoring;
        - (senior) monitoringsambtenaar;
        - (senior) medewerker registratie en analyse;
        - (senior) medewerker handhaving landmobiel en binnenvaart/mobiele monitoring;
        - medewerker handhaving landmobiel en toezicht EMC;
        - medewerker handhaving landmobiel en binnenvaart/ zeevaart/markttoezicht radio- en randapparatuur;
        - medewerker handhaving technisch specialist/mobiele monitoring/landmobiel en binnenvaart;
        - medewerker handhaving technisch specialist/landmobiel en binnenvaart/markttoezicht radio- en randapparatuur;
        - medewerker handhaving toezicht EMC/mobiele monitoring;
        - senior medewerker handhaving zeevaart/landmobiel en binnenvaart;
        - senior medewerker handhaving zeevaart/mobiele monitoring;
    url: https://wetten.overheid.nl/BWBR0010859/2003-01-10#Artikel3
  - number: 3.d
    text: |-
      bij het Ministerie van Sociale Zaken en Werkgelegenheid, de Arbeidsinspectie: - technisch ambtenaar die permanent
      en volledig is tewerkgesteld bij de buitendienst van Stoomwezen B.V.;
    url: https://wetten.overheid.nl/BWBR0010859/2003-01-10#Artikel3
  - number: 3.e
    text: |-
      bij het Ministerie van Binnenlandse Zaken en Koninkrijksrelaties, de Binnenlandse Veiligheidsdienst: - de door Onze
      Minister van Binnenlandse Zaken en Koninkrijksrelaties aan te wijzen functies.
    url: https://wetten.overheid.nl/BWBR0010859/2003-01-10#Artikel3
  - number: '4.1'
    text: |-
      Voor de ambtenaar die op 1 januari 2000 55 jaar of ouder is, gaat het in [artikel 2, eerste lid][ref1], bedoelde
      ontslag in op de eerste dag van de maand volgende op die waarin de ambtenaar de leeftijd van 60 jaar bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0010859#Artikel2
    url: https://wetten.overheid.nl/BWBR0010859/2003-01-10#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0010859
        artikel: '2'
  - number: '4.2'
    text: |-
      Voor de ambtenaar die op 1 januari 2000 jonger is dan 55 jaar, gaat het in [artikel 2, eerste lid][ref1],
      bedoelde ontslag zoveel maanden eerder in dan zijn ontslag op zijn 65ste jaar, als het aantal jaren, dat
      de ambtenaar voor 1 januari 2000 een of meer functies waaraan een leeftijdsgrens was verbonden op grond van
      [artikel 97, eerste lid, van het Algemeen Rijksambtenarenreglement][ref2], zoals dit artikel luidde voor
      inwerkingtreding van onderhavig besluit, zonder wezenlijke onderbreking heeft vervuld, vermenigvuldigd met een
      factor 2, met een maximum van 60 maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0010859#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0001950#Artikel97
    url: https://wetten.overheid.nl/BWBR0010859/2003-01-10#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0010859
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0001950
        artikel: '97'
  - number: '4.3'
    text: |-
      Ten aanzien van het begrip wezenlijke onderbreking is [artikel 2, tweede lid][ref1], van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0010859#Artikel2
    url: https://wetten.overheid.nl/BWBR0010859/2003-01-10#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0010859
        artikel: '2'
  - number: '5.1'
    text: |-
      Het bevoegd gezag kan van het verlenen van het ontslag, bedoeld in [artikel 2, eerste lid][ref1],
      voor de duur van telkens ten hoogste één jaar afzien, indien het dienstbelang zich daartegen
      niet verzet, de ambtenaar zulks heeft aangevraagd of daarmee instemt en hij blijkens de
      uitslag van een door de Arbo-dienst ingesteld arbeidsgezondheidskundig onderzoek als bedoeld in
      [artikel 36a, eerste lid, onder g, van het Algemeen Rijksambtenarenreglement][ref2], lichamelijk en psychisch in
      staat kan worden geacht zijn functie te blijven vervullen.


      [ref1]: https://wetten.overheid.nl/BWBR0010859#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0001950#Artikel36a
    url: https://wetten.overheid.nl/BWBR0010859/2003-01-10#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0010859
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0001950
        artikel: 36a
  - number: '5.2'
    text: |-
      Indien niet meer wordt voldaan aan een of meer van de in het eerste lid genoemde voorwaarden, vindt ontslag als
      bedoeld in [artikel 2, eerste lid][ref1], plaats.


      [ref1]: https://wetten.overheid.nl/BWBR0010859#Artikel2
    url: https://wetten.overheid.nl/BWBR0010859/2003-01-10#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0010859
        artikel: '2'
  - number: '5.3'
    text: |-
      Het ontslag wordt verleend met ingang van een dag niet vroeger dan een maand of niet later dan drie maanden na de
      dag, waarop niet langer aan de in het eerste lid gestelde voorwaarden wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0010859/2003-01-10#Artikel5
  - number: '6.1'
    text: |-
      In afwijking van de op grond van [artikel 97, zevende lid, van het Algemeen Rijksambtenarenreglement][ref1]
      gestelde regels bedraagt de uitkering, verbonden aan een ontslag als bedoeld in [artikel 2, eerste lid][ref2], 80%
      van de bezoldiging, vermeerderd met zoveel – ten hoogste tien – maal 0,5% van de bezoldiging als het totaal aantal
      volle voor pensioen geldige dienstjaren die meetellen voor de pensioenberekening krachtens het pensioenreglement,
      op de datum van het ontslag, bedoeld in [artikel 2, eerste lid][ref3], meer dan dertig bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel97
      [ref2]: https://wetten.overheid.nl/BWBR0010859#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0010859#Artikel2
    url: https://wetten.overheid.nl/BWBR0010859/2003-01-10#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '97'
      - id: ref2
        bwb_id: BWBR0010859
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0010859
        artikel: '2'
  - number: '6.2'
    text: 'Onder dienstjaren wordt in het eerste lid verstaan:'
    url: https://wetten.overheid.nl/BWBR0010859/2003-01-10#Artikel6
  - number: 6.2.a
    text: |-
      voorzover gelegen vóór 1 januari 1996: de tijd, die voor betrokkene per 31 december 1995 meetelt voor de
      pensioenberekening, bedoeld in de Algemene burgerlijke pensioenwet, zoals deze luidde op 31 december 1995;
    url: https://wetten.overheid.nl/BWBR0010859/2003-01-10#Artikel6
  - number: 6.2.b
    text: |-
      voorzover gelegen op of na 1 januari 1996: de tijd gedurende welke betrokkene overheidswerknemer is in de zin van
      de [Wet privatisering ABP][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007791
    url: https://wetten.overheid.nl/BWBR0010859/2003-01-10#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0007791
  - number: '6.3'
    text: |-
      Bij de berekening van het bedrag van het pensioen, bedoeld in het eerste lid, wordt mede in aanmerking genomen de
      diensttijd, bedoeld in artikel 5.1, tweede lid, van het pensioenreglement, die de betrokkene bij het bereiken van
      de leeftijd van 65 jaar zal kunnen aanwijzen.
    url: https://wetten.overheid.nl/BWBR0010859/2003-01-10#Artikel6
  - number: '6.4'
    text: |-
      Voor de toepassing van het eerste lid wordt in aanmerking genomen de eventuele diensttijd, bedoeld in artikel D1,
      tweede lid, van de Algemene burgerlijke pensioenwet, zoals deze luidde op 31 december 1995. Het verzoek, bedoeld in
      artikel D2 van laatstgenoemde wet, wordt geacht te zijn gedaan.
    url: https://wetten.overheid.nl/BWBR0010859/2003-01-10#Artikel6
  - number: '6.5'
    text: |-
      De in het eerste lid bedoelde uitkering wordt gelijkgesteld met een uitkering die is toegekend op basis van de op
      grond van [artikel 97, zevende lid, van het Algemeen Rijksambtenarenreglement][ref1] vastgestelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel97
    url: https://wetten.overheid.nl/BWBR0010859/2003-01-10#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '97'
  - number: '7'
    text: Dit besluit treedt in werking met ingang van 1 januari 2000.
    url: https://wetten.overheid.nl/BWBR0010859/2003-01-10#Artikel7
  - number: '8'
    text: 'Dit besluit wordt aangehaald als: Besluit overgangsrecht FLO-functies.'
    url: https://wetten.overheid.nl/BWBR0010859/2003-01-10#Artikel8
