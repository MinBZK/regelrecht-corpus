preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Verkeer en Waterstaat van 15 oktober 1991, nr. WJZ/V125788, Directoraat-
    Generaal voor het Vervoer;

    Gelet op de artikelen 1, derde lid, 5, tweede en vierde lid, 8, tweede lid, 9, tweede lid, 12, derde lid, 13, derde
    lid, 14, vierde lid, 15, derde lid, 19, tweede lid, 23, tweede lid, 25, tweede lid, 26, tweede lid, 27, vijfde lid,
    28, 29, tweede lid, 32 en 51, tweede lid, van de Wet goederenvervoer over de weg (Stb. 1992, 145);

    Gelet op de Eerste Richtlijn van de Raad van de Europese Gemeenschappen inzake de vaststelling van
    gemeenschappelijke regels voor bepaalde soorten goederenvervoer over de weg tussen de Lid-Staten;

    Gelet op Richtlijn 74/561(EEG) van de Raad van de Europese Gemeenschappen van 12 november 1974 inzake de toegang
    tot het beroep van ondernemer van nationaal en internationaal goederenvervoer over de weg (PbEG L 308) zoals
    gewijzigd bij Richtlijn 89/438(EEG) van de Raad van de Europese Gemeenschappen van 21 juni 1989 tot wijziging van
    Richtlijn 74/561(EEG) (PbEG L 212);

    Gelet op Richtlijn 75/130(EEG) van de Raad van de Europese Gemeenschappen van 17 februari 1975 houdende
    vaststelling van gemeenschappelijke voorschriften voor bepaalde vormen van gecombineerd vervoer van goederen tussen
    de Lid-Staten (PbEG L 48) zoals gewijzigd bij Richtlijn 86/544(EEG) van de Raad van de Europese Gemeenschappen van
    10 november 1986 (PbEG L 320);

    Gelet op Verordening (EEG) nr. 3164/76 van de Raad van de Europese Gemeenschappen van 16 december 1976, inzake de
    toegang tot de markt voor internationaal goederenvervoer over de weg, (PbEG L 356) zoals gewijzigd bij Verordening
    (EEG) nr. 1841/88 van 21 juni 1988 (PbEG L 163) en bij verordening (EEG) nr. 3915/90 van 21 december 1990 (PbEG
    L 375);

    Gelet op Richtlijn 77/796(EEG) van de Raad van de Europese Gemeenschappen van 12 december 1977 inzake de onderlinge
    erkenning van diploma's, certificaten en andere titels van ondernemer van goederenvervoer over de weg en ondernemer
    van personenvervoer over de weg en houdende maatregelen ter bevordering van de daadwerkelijke uitoefening van het
    recht van vrije vestiging van die vervoerondernemers (PbEG L 334) zoals gewijzigd bij Richtlijn 89/438(EEG) van de
    Raad van de Europese Gemeenschappen van 21 juni 1989 (PbEG L 212);

    Gelet op Richtlijn 78/546(EEG) van de Raad van de Europese Gemeenschappen van 12 juni 1978 betreffende de
    statistische registratie van het goederenvervoer over de weg in het kader van een regionale statistiek (PbEG L 168)
    zoals gewijzigd bij Richtlijn 89/462(EEG) van de Raad van de Europese Gemeenschappen van 18 juli 1989 (PbEG L 226);

    Gelet op Richtlijn 84/647(EEG) van de Raad van de Europese Gemeenschappen van 19 december 1984 betreffende het
    gebruik van gehuurde voertuigen zonder bestuurder voor het vervoer van goederen over de weg (PbEG L 335) zoals
    gewijzigd bij Richtlijn 90/398(EEG) van de Raad van de Europese Gemeenschappen van 24 juli 1990 (PbEG L 202);

    Gelet op Verordening (EEG) nr. 4059/89 van de Raad van de Europese Gemeenschappen van 21 december 1989 (PbEG L
    390) zoals gewijzigd bij Verordening (EEG) nr. 296/91 (PbEG L 36) tot vaststelling van de voorwaarden waaronder
    niet in een Lid-Staat woonachtige vervoerondernemers aldaar tot het binnenlands goederenvervoer over de weg worden
    toegelaten;

    Gelet op Verordening (EEG) nr. 3916/90 van de Raad van de Europese Gemeenschappen van 21 december 1990 betreffende
    in crisissituaties te nemen maatregelen op de markt voor het goederenvervoer over de weg (PbEG L 375);

    Gezien het advies van de Advies-Commissie Goederenvervoer bedoeld in artikel 6 van de Wet Autovervoer Goederen;

    De Raad van State gehoord (advies van 10 maart 1992, no. W09 910574;

    Gezien het nader rapport van Onze Minister van Verkeer en Waterstaat van 2 april 1992, nr. WJZ/V 221943,
    Directoraat-Generaal voor het Vervoer;

    Hebben goedgevonden en verstaan:
