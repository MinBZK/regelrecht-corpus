    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel7
  - number: '7.3'
    text: Bij ministeriële regeling kan de NIWO belast worden met overige taken.
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel7
  - number: '7.4'
    text: |-
      De NIWO is de bevoegde instantie, bedoeld in de artikelen 6, eerste lid, 7, tweede lid, 8 en 11, derde lid, van
      [verordening 881/92](31992R0881).
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel7
  - number: '8.1'
    text: |-
      De indiening van een aanvraag voor een vergunning tot het verrichten van binnenlands beroepsvervoer geschiedt bij
      de NIWO.
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel8
  - number: '8.2'
    text: De in het eerste lid bedoelde formulieren dienen volledig en naar waarheid ingevuld te worden.
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel8
  - number: '9'
    text: |-
      De aanvraag om afgifte van een vergunningbewijs voor binnenlands vervoer als bedoeld in
      [artikel 10, tweede lid, van de wet][ref1] wordt ingediend bij de NIWO.


      [ref1]: https://wetten.overheid.nl/BWBR0005443#Artikel10
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005443
        artikel: '10'
  - number: '10.1'
    text: |-
      Een vergunningbewijs wordt verleend voor een vrachtauto al dan niet met een aanhangwagen, of voor een samenstel van
      een trekker en een oplegger.
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel10
  - number: '10.2'
    text: |-
      Op een vergunningbewijs worden de naam en het adres van de vergunninghouder vermeld alsmede een code waaronder deze
      door de NIWO is geregistreerd.
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel10
  - number: '11'
    text: |-
      De modellen van vergunningbewijzen worden vastgesteld door de NIWO. De bewijzen worden gesteld op linnen of
      duurzaam papier.
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel11
  - number: '12'
    text: |-
      De afgifte van vergunningbewijzen geschiedt na ontvangst door de NIWO van de in [artikel 27 van de wet][ref1]
      bedoelde vergoeding.


      [ref1]: https://wetten.overheid.nl/BWBR0005443#Artikel27
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005443
        artikel: '27'
  - number: '13'
    text: |-
      In geval van toepassing van [artikel 11, eerste lid, van de wet][ref1] dan wel wanneer toepassing is gegeven
      aan [artikel 12, eerste lid, van de wet][ref2], dienen de vergunningbewijzen die in het bezit zijn van de
      vergunninghouder binnen één week na het tijdstip waarop de daaraan ten grondslag liggende vergunning haar
      geldigheid heeft verloren dan wel ingetrokken is, door de vergunninghouder ingeleverd te worden bij de NIWO.


      [ref1]: https://wetten.overheid.nl/BWBR0005443#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0005443#Artikel12
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0005443
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0005443
        artikel: '12'
  - number: '14.1'
    text: |-
      Degene die binnenlands beroepsvervoer verricht met een vrachtauto en voor wie een vergunningplicht geldt als
      bedoeld in [artikel 5, eerste lid, van de wet][ref1], alsmede de bestuurder van die vrachtauto is verplicht ervoor
      zorg te dragen dat bij de vrachtauto een geldig vergunningbewijs aanwezig is.


      [ref1]: https://wetten.overheid.nl/BWBR0005443#Artikel5
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0005443
        artikel: '5'
  - number: '14.2'
    text: Deze verplichting geldt eveneens in geval van lege ritten in verband met het in het eerste lid bedoelde vervoer.
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel14
  - number: '15'
    text: De indiening van een aanvraag om een communautaire vergunning geschiedt bij de NIWO.
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel15
  - number: '16'
    text: |-
      Het bepaalde in de [ artikelen 9][ref1], [10][ref2], [12][ref3] en [13][ref4] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005496#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0005496#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0005496#Artikel12
      [ref4]: https://wetten.overheid.nl/BWBR0005496#Artikel13
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0005496
        artikel: '9'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005496
        artikel: '10'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0005496
        artikel: '12'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0005496
        artikel: '13'
        hoofdstuk: II
        paragraaf: '2'
  - number: '17.1'
    text: |-
      Degene die grensoverschrijdend beroepsvervoer verricht met een vrachtauto en voor wie een vergunningplicht geldt
      als bedoeld in [artikel 5, derde lid, van de wet][ref1], alsmede de bestuurder van die vrachtauto is verplicht
      ervoor zorg te dragen dat bij de vrachtauto naast de voor grensoverschrijdend beroepsvervoer geldige gewaarmerkte
      kopie tevens het voor binnenlands beroepsvervoer geldige vergunningbewijs aanwezig is.


      [ref1]: https://wetten.overheid.nl/BWBR0005443#Artikel5
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0005443
        artikel: '5'
  - number: '17.2'
    text: Deze verplichting geldt eveneens in geval van lege ritten in verband met het in het eerste lid bedoelde vervoer.
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel17
  - number: '18.1'
    text: |-
      Ter voldoening aan de eis van betrouwbaarheid, bedoeld in [artikel 8, eerste lid, onderdeel ][ref1], is
      overlegging vereist van een niet ouder dan drie maanden zijnde verklaring omtrent het gedrag ten dienste
      van het verkrijgen van een vergunning voor beroepsvervoer en afgegeven overeenkomstig de bepalingen van de
      [Wet justitiële gegevens][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005443#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0014194
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0005443
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0014194
  - number: '18.2'
    text: |-
      Een ondernemer of bestuurder van een onderneming tot het verrichten van beroepsvervoer wiens land van oorsprong
      of herkomst een andere Lid-Staat is dan Nederland, dan wel een andere staat, die partij is bij de Overeenkomst
      betreffende de Europese Economische Ruimte, voldoet aan de eis van betrouwbaarheid door overlegging van een
      document of verklaring, in die andere staat afgegeven overeenkomstig het tweede, derde en vierde lid van artikel 8
      van [richtlijn nr. 96/26/EG](31996L0026) en niet ouder dan drie maanden.
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel18
  - number: '19'
    text: |-
      Een verklaring als bedoeld in [artikel 18, eerste lid][ref1], dient elke vijf jaar opnieuw overgelegd te worden.


      [ref1]: https://wetten.overheid.nl/BWBR0005496#Artikel18
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0005496
        artikel: '18'
        hoofdstuk: II
        paragraaf: '4'
  - number: '20.1'
    text: |-
      Ter voldoening aan de eis van kredietwaardigheid, bedoeld in [artikel 8, eerste lid, onderdeel ][ref1], van de wet
      dient de ondernemer te beschikken over een bij ministeriële regeling vast te stellen kapitaal en reserves benodigd
      voor een correcte aanvang en een goed beheer van de onderneming.


      [ref1]: https://wetten.overheid.nl/BWBR0005496#Artikel8
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0005496
        artikel: '8'
        hoofdstuk: II
        paragraaf: '2'
  - number: '20.2'
    text: |-
      Omtrent het voldoen aan de in het eerste lid genoemde eis van kredietwaardigheid stelt de NIWO een onderzoek in op
      de voet van het bepaalde in artikel 3, derde lid, onder b) van [richtlijn nr. 96/26/EG](31996L0026).
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel20
  - number: '20.3'
    text: |-
      De NIWO onderzoekt iedere vijf jaar of aan het bepaalde in het eerste lid wordt voldaan. De NIWO kan beleidsregels
      vaststellen ten aanzien van het tijdstip van dat onderzoek.
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel20
  - number: '20.4'
    text: |-
      De NIWO kan de ondernemer tijdens het onderzoek, bedoeld in het derde lid, een uitstel van ten hoogste een jaar
      verlenen ten behoeve van de vaststelling van het voldoen aan de eis van kredietwaardigheid indien de ondernemer
      heeft aangetoond dat het op grond van de algemene economische situatie van zijn onderneming waarschijnlijk is dat
      hij voor afloop van het verleende uitstel zal voldoen aan de eis van kredietwaardigheid.
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel20
  - number: '20.5'
    text: |-
      Een onderneming tot het verrichten van beroepsvervoer, die gevestigd is in een andere Lid-Staat dan Nederland, dan
      wel in een van de overige staten, die partij zijn bij de Overeenkomst betreffende de Europese Economische Ruimte,
      voldoet eveneens aan de eis van kredietwaardigheid, indien een verklaring overgelegd wordt die overeenkomstig
      artikel 9 van [richtlijn nr. 96/26/EG](31996L0026) in die andere staat is afgegeven en die niet ouder is dan drie
      maanden.
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel20
  - number: '21.1'
    text: |-
      Aan de eis van vakbekwaamheid, bedoeld in [artikel 8, eerste lid, onderdeel c, van de wet][ref1], wordt voldaan
      door degene die:


      [ref1]: https://wetten.overheid.nl/BWBR0005443#Artikel8
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0005443
        artikel: '8'
  - number: 21.1.a
    text: |-
      een door Onze Minister erkend getuigschrift overlegt van met goed gevolg afgelegde examens waarbij ten minste
      de kennis is vastgesteld van de onderwerpen en het opleidingsniveau van bijlage I van [richtlijn nr. 96/26/EG]
      (31996L0026) en die overeenkomstig die bijlage zijn georganiseerd, of
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel21
  - number: 21.1.b
    text: |-
      een verklaring van vakbekwaamheid overlegt die op grond van artikel 3, vierde lid, van [richtlijn nr. 96/26/EG]
      (31996L0026), door een andere Lidstaat, dan wel door een andere staat die partij is bij de Overeenkomst betreffende
      de Europese Economische Ruimte, is afgegeven.
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel21
  - number: '21.2'
    text: |-
      Bij ministeriële regeling kan bepaald worden van welke onderwerpen, genoemd in bijlage I van [richtlijn nr. 96/26/
      EG](31996L0026), vrijstelling verleend kan worden aan houders van in die regeling genoemde diploma's.
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel21
  - number: '21.4'
    text: |-
      Op het moment dat vijf jaar is verstreken na het tijdstip van de vergunningverlening toont de ondernemer aan dat
      hij voldoet aan de eis van vakbekwaamheid.
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel21
  - number: '22'
    text: |-
      Onverminderd het bepaalde in [artikel 21, eerste lid][ref1], dient ter voldoening aan de eis van vakbekwaamheid
      als bedoeld in [artikel 9, tweede lid, van de wet][ref2], een bij ministeriële regeling erkend vakdiploma voor
      grensoverschrijdend beroepsvervoer overgelegd te worden. Het bepaalde in [artikel 21, tweede lid][ref3], is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005496#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0005443#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0005496#Artikel21
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0005496
        artikel: '21'
        hoofdstuk: II
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0005443
        artikel: '9'
      - id: ref3
        bwb_id: BWBR0005496
        artikel: '21'
        hoofdstuk: II
        paragraaf: '4'
  - number: '23'
    text: |-
      Exemplaren van de verklaring van dienstbetrekking, bedoeld in [artikel 14, tweede lid, van de wet][ref1], worden
      op aanvraag van de vergunninghouder namens Onze Minister door een door hem aan te wijzen ambtenaar ter beschikking
      gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005443#Artikel14
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0005443
        artikel: '14'
  - number: '24'
    text: 'Bij indiensttreding van een bestuurder van een vrachtauto moet de vergunninghouder:'
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel24
  - number: 24.a
    text: |-
      aan de bestuurder een verklaring als bedoeld in [artikel 14, tweede lid, van de wet][ref1] verstrekken, ondertekend
      door zowel de vergunninghouder als de bestuurder;


      [ref1]: https://wetten.overheid.nl/BWBR0005443#Artikel14
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0005443
        artikel: '14'
  - number: 24.b
    text: |-
      na afgifte een ingevuld en ondertekend duplicaat van de verklaring terstond toezenden aan een door Onze Minister
      aan te wijzen ambtenaar; en
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel24
  - number: 24.c
    text: een duplicaat van de ingevulde en ondertekende verklaring bewaren ten kantore van zijn bedrijf.
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel24
  - number: '25'
    text: 'Bij beëindigen van de dienstbetrekking van een bestuurder van een vrachtauto moet de vergunninghouder:'
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel25
  - number: 25.a
    text: |-
      de in [artikel 24, onderdeel a][ref1], bedoelde verklaring innemen;


      [ref1]: https://wetten.overheid.nl/BWBR0005496#Artikel24
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0005496
        artikel: '24'
        hoofdstuk: II
        paragraaf: '5'
  - number: 25.b
    text: |-
      de datum van beëindiging van de dienstbetrekking aantekenen op de verklaring en op het duplicaat, bedoeld in
      [artikel 24, onderdeel c][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005496#Artikel24
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0005496
        artikel: '24'
        hoofdstuk: II
        paragraaf: '5'
  - number: 25.c
    text: De verklaring terstond zenden aan een door Onze Minister aan te wijzen ambtenaar; en
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel25
  - number: 25.d
    text: het duplicaat tot één jaar na het beëindigen van de dienstbetrekking ten kantore van zijn bedrijf bewaren.
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel25
  - number: '26'
    text: |-
      [Artikel 14, eerste lid, van de wet][ref1] is niet van toepassing wanneer gebruik wordt gemaakt van:


      [ref1]: https://wetten.overheid.nl/BWBR0005443#Artikel14
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0005443
        artikel: '14'
  - number: 26.a
    text: |-
      een werknemer, die voor beperkte tijd bij wijze van hulpbetoon zonder winstoogmerk aan een vergunninghouder ter
      beschikking is gesteld door een andere vergunninghouder bij wie die werknemer in dienstbetrekking is en die ten
      bewijze daarvan een verklaring van dienstbetrekking kan tonen; of
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel26
  - number: 26.b
    text: |-
      een werknemer, die door een door Onze Minister aan te wijzen instelling aan een vergunninghouder ter beschikking
      is gesteld en die ten bewijze daarvan een door deze instelling afgegeven verklaring kan tonen volgens een door Onze
      Minister vastgesteld model.
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel26
  - number: '27.1'
    text: |-
      Degene die beroepsvervoer verricht met een vrachtauto alsmede de bestuurder van die vrachtauto is verplicht
      ervoor zorg te dragen dat in de vrachtauto een verklaring als bedoeld in [artikel 24, onderdeel ][ref1], dan wel
      [artikel 26, onderdeel ][ref2], aanwezig is.


      [ref1]: https://wetten.overheid.nl/BWBR0005496#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0005496#Artikel26
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0005496
        artikel: '24'
        hoofdstuk: II
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0005496
        artikel: '26'
        hoofdstuk: II
        paragraaf: '5'
  - number: '27.2'
    text: Deze verplichting geldt eveneens in geval van lege ritten in verband met het in het eerste lid bedoelde vervoer.
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel27
  - number: '28'
    text: |-
      Indien de natuurlijke persoon die de werkzaamheden van vervoerder verricht of de natuurlijke persoon die voldoet
      aan het bepaalde in [artikel 8, eerste lid, onderdelen ][ref1], is overleden dan wel lichamelijk of wettelijk
      onbekwaam is geworden om als ondernemer op te treden, verleent de NIWO op aanvraag van belanghebbenden een
      vergunning als bedoeld in [artikel 13, eerste lid, van de wet][ref2], teneinde belanghebbenden de gelegenheid te
      bieden alsnog in de ontbrekende vakbekwaamheid of betrouwbaarheid te voorzien.


      [ref1]: https://wetten.overheid.nl/BWBR0005443#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005443#Artikel13
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0005443
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0005443
        artikel: '13'
  - number: '29'
    text: |-
      In afwijking van het bepaalde in [artikel 28][ref1] verleent de NIWO op aanvraag van belanghebbenden een vergunning
      als bedoeld in [artikel 5, eerste, onderscheidenlijk derde lid, van de wet][ref2] aan een persoon die niet voldoet
      aan de in [artikel 8, eerste lid, onderdeel ][ref3], bedoelde eis van vakbekwaamheid, indien deze persoon:


      [ref1]: https://wetten.overheid.nl/BWBR0005496#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0005443#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005443#Artikel8
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0005496
        artikel: '28'
        hoofdstuk: II
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0005443
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0005443
        artikel: '8'
  - number: 29.a
    text: |-
      beschikt over tien jaren ervaring in de leiding van een met vergunning uitgeoefende vervoeronderneming, waarvan ten
      minste drie jaren in het dagelijks beheer van de voort te zetten onderneming; en
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel29
  - number: 29.b
    text: tenminste de leeftijd van veertig jaren heeft bereikt.
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel29
  - number: '30'
    text: |-
      De indiening van een aanvraag als bedoeld in [artikel 28][ref1], dan wel[ 29][ref2] geschiedt bij de NIWO.


      [ref1]: https://wetten.overheid.nl/BWBR0005496#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0005496#Artikel29
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0005496
        artikel: '28'
        hoofdstuk: II
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0005496
        artikel: '29'
        hoofdstuk: II
        paragraaf: '6'
  - number: '31.1'
    text: |-
      Een aanvraag om verlenging als bedoeld in [artikel 13, derde lid, van de wet][ref1], dient uiterlijk vier weken
      voordat de geldigheidsduur van de toestemming is verstreken ingediend te worden.


      [ref1]: https://wetten.overheid.nl/BWBR0005443#Artikel13
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0005443
        artikel: '13'
  - number: '31.2'
    text: Indien niet binnen acht weken na het in behandeling nemen van de aanvraag is beslist, is de aanvraag toegewezen.
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel31
  - number: '32'
    text: |-
      Op vergunningbewijzen en gewaarmerkte kopieën, afgegeven op een aanvraag als bedoeld in [artikel 28][ref1], wordt
      de geldigheidsduur vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0005496#Artikel28
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0005496
        artikel: '28'
        hoofdstuk: II
        paragraaf: '6'
  - number: '33'
    text: |-
      Het bepaalde in de [artikelen 9][ref1] tot en met [14][ref2] en [17][ref3] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005496#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0005496#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0005496#Artikel17
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0005496
        artikel: '9'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005496
        artikel: '14'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0005496
        artikel: '17'
        hoofdstuk: II
        paragraaf: '3'
  - number: '34.1'
    text: |-
      Aan de eis van betrouwbaarheid, bedoeld in [artikel 8, eerste lid, onderdeel ][ref1] wordt niet langer
      voldaan indien de natuurlijke persoon of personen die permanent en daadwerkelijk leiding geven aan het
      beroepsvervoer in een aaneengesloten periode van drie jaar herhaaldelijk - al dan niet met toepassing van
      [artikel 51, tweede lid, van het Wetboek van Strafrecht][ref2] - onherroepelijk tot straf veroordeeld zijn wegens:


      [ref1]: https://wetten.overheid.nl/BWBR0005443#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel51
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0005443
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '51'
  - number: 34.1.a
    text: |-
      overtreding van [artikel 2.4:4][ref1], [2.5:1, vierde lid][ref2], [2.5:3][ref3],
      [2.5:4, vierde lid][ref4], [2.5:5, derde lid][ref5], [2.5:6, tweede lid][ref6], [2.7:1][ref7],
      [of artikel 2.7:4, eerste lid, onderdeel b of tweede lid, van het Arbeidstijdenbesluit vervoer][ref8];


      [ref1]: https://wetten.overheid.nl/BWBR0009386#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0009386#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0009386#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0009386#Artikel2
      [ref5]: https://wetten.overheid.nl/BWBR0009386#Artikel2
      [ref6]: https://wetten.overheid.nl/BWBR0009386#Artikel2
      [ref7]: https://wetten.overheid.nl/BWBR0009386#Artikel2
      [ref8]: https://wetten.overheid.nl/BWBR0009386#Artikel2
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0009386
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0009386
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0009386
        artikel: '2'
      - id: ref4
        bwb_id: BWBR0009386
        artikel: '2'
      - id: ref5
        bwb_id: BWBR0009386
        artikel: '2'
      - id: ref6
        bwb_id: BWBR0009386
        artikel: '2'
      - id: ref7
        bwb_id: BWBR0009386
        artikel: '2'
      - id: ref8
        bwb_id: BWBR0009386
        artikel: '2'
  - number: 34.1.b
    text: |-
      overtreding van [artikel 31 van de wet][ref1] voor wat betreft de technische staat van de vrachtauto;


      [ref1]: https://wetten.overheid.nl/BWBR0005443#Artikel31
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0005443
        artikel: '31'
  - number: 34.1.c
    text: |-
      overtreding van [artikel 31 van de wet][ref1] voor wat betreft de belading van de vrachtauto;


      [ref1]: https://wetten.overheid.nl/BWBR0005443#Artikel31
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0005443
        artikel: '31'
  - number: 34.1.d
    text: |-
      overtreding van [artikel 2, eerste of tweede lid, van de Wet aansprakelijkheidsverzekering motorrijtuigen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002415#Artikel2
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0002415
        artikel: '2'
  - number: 34.1.e
    text: |-
      overtreding van [artikel 5.3.15][ref1] juncto [5.1.1, eerste lid, onderdeel c, van het Voertuigreglement][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0006746#Artikel5
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0006746
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0006746
        artikel: '5'
  - number: '34.2'
    text: |-
      Aan de eis van betrouwbaarheid wordt niet langer voldaan indien herhaaldelijk bij onherroepelijk vonnis van
      de burgerlijke rechter is vastgesteld dat de in het beroep geldende loon- en andere op geld waardeerbare
      arbeidsvoorwaarden niet zijn nageleefd.
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel34
  - number: '34.3'
    text: |-
      Het in lege toestand verplaatsen van een vrachtauto wordt gelijkgesteld met beroepsvervoer in geval van toepassing
      van het bepaalde in het eerste lid, onderdelen *a* en *b* en het tweede lid.
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel34
  - number: '34.4'
    text: |-
      Bij ministeriële regeling wordt in overeenstemming met Onze Minister van Sociale Zaken en Werkgelegenheid
      vastgesteld op welk tijdstip de periode van drie jaar een aanvang neemt en bij welke aard van de overtredingen
      en cumulatie van veroordelingen onderscheidenlijk vonnissen genoemd in het eerste en tweede lid, niet langer meer
      wordt voldaan aan de eis van betrouwbaarheid.
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel34
  - number: '35.1'
    text: |-
      Er is sprake van herhaaldelijk in strijd handelen met het bepaalde in [artikel 14, eerste lid, van de wet][ref1]
      indien de vergunninghouder binnen een aaneengesloten periode van drie jaar een bij ministeriële regeling vast te
      stellen aantal malen onherroepelijk tot straf veroordeeld is wegens overtreding van eerdergenoemd artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0005443#Artikel14
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0005443
        artikel: '14'
  - number: '35.2'
    text: De periode van drie jaar vangt aan op de datum van de eerste onherroepelijke veroordeling.
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel35
  - number: '36'
    text: |-
      Indien de vergunninghouder zich schuldig maakt aan overtreding van [artikel 14 van de wet][ref1] stelt de NIWO hem
      ten minste één maal op de hoogte van de mogelijkheid van intrekking van de vergunning op grond van het bepaalde in
      [artikel 35, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005443#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0005496#Artikel35
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0005443
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0005496
        artikel: '35'
        hoofdstuk: II
        paragraaf: '7'
  - number: '37'
    text: |-
      Indien ingevolge het bepaalde in de [artikelen 34][ref1] en [35][ref2] de betrouwbaarheid dreigt te ontvallen,
      stelt de NIWO de vergunninghouder daarvan ten minste één maal op de hoogte.


      [ref1]: https://wetten.overheid.nl/BWBR0005496#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0005496#Artikel35
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0005496
        artikel: '34'
        hoofdstuk: II
        paragraaf: '7'
      - id: ref2
        bwb_id: BWBR0005496
        artikel: '35'
        hoofdstuk: II
        paragraaf: '7'
  - number: '38.1'
    text: |-
      De houder van een vergunning is verplicht deze, alsmede de daarop berustende vergunningbewijzen binnen één week na
      de dagtekening in de beschikking van de NIWO waarbij zij wordt ingetrokken, bij de NIWO in te leveren.
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel38
  - number: '38.2'
    text: |-
      Indien de in het eerste lid bedoelde vergunninghouder tevens in het bezit is van een communautaire vergunning,
      dient dit document alsmede de daarop berustende gewaarmerkte kopieën tegelijkertijd ingeleverd te worden.
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel38
  - number: '38.3'
    text: |-
      De bij een vergunninghouder gebezigde verklaringen van dienstbetrekking dienen op hetzelfde tijdstip ingeleverd te
      worden bij een door Onze Minister aan te wijzen ambtenaar.
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel38
  - number: '39.1'
    text: |-
      Alvorens de SIEV overgaat tot verlening van een inschrijving eigen vervoer, dient door de aanvrager te zijn
      aangetoond dat:
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel39
  - number: 39.1.a
    text: |-
      het vervoer een onderdeel vormt van het totaal van de bedrijfsactiviteiten van de onderneming van degene voor wiens
      rekening en risico de goederen worden vervoerd; en
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel39
  - number: 39.1.b
    text: |-
      het vervoer in het geheel van de bedrijfsactiviteiten geen hoofdactiviteit, maar een werkzaamheid van
      ondersteunende aard vormt.
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel39
  - number: '39.2'
    text: |-
      In het geval dat de vervoers- en overige bedrijfsactiviteiten zijn ondergebracht in verschillende juridisch
      gescheiden ondernemingen, dient de aanvrager bovendien aan te tonen dat de betrokken ondernemingen in financieel,
      organisatorisch en economisch opzicht zodanig verweven zijn dat zij als onderdelen van dezelfde organisatie
      beschouwd kunnen worden.
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel39
  - number: '39.3'
    text: |-
      Van verwevenheid in financieel opzicht is sprake indien ten minste de meerderheid van de aandelen in elk van de
      ondernemingen - daaronder begrepen de zeggenschap - middellijk of onmiddellijk in dezelfde hand is, dan wel indien
      meer dan de helft van het vermogen van elk der ondernemingen in dezelfde hand is.
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel39
  - number: '39.4'
    text: |-
      Van verwevenheid in organisatorisch opzicht is sprake indien de ondernemingen onder een gezamenlijke, althans als
      een eenheid functionerende, leiding staan, dan wel de leiding van de ene onderneming ten opzichte van die van de
      andere onderneming in een positie van feitelijke ondergeschiktheid verkeert.
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel39
  - number: '39.5'
    text: |-
      Van verwevenheid in economisch opzicht is sprake indien de activiteiten van de ondernemingen in hoofdzaak strekken
      tot verwezenlijking van eenzelfde ondernemingsdoelstelling, dan wel de activiteiten van de ene onderneming in
      hoofdzaak ten behoeve van de andere onderneming worden uitgeoefend.
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel39
  - number: '40'
    text: |-
      De verwevenheid bedoeld in [artikel 39, tweede lid][ref1], kan in ieder geval aangetoond worden door:


      [ref1]: https://wetten.overheid.nl/BWBR0005496#Artikel39
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0005496
        artikel: '39'
        hoofdstuk: III
        paragraaf: '1'
  - number: 40.a
    text: |-
      een beschikking op basis van [artikel 15 van de Wet op de Vennootschapsbelasting 1969][ref1] (*Stb.* 469) waarbij
      de betrokken ondernemingen tezamen als één fiscale eenheid worden aangemerkt; of


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel15
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '15'
  - number: 40.b
    text: |-
      een verklaring dat de betrokken ondernemingen als één ondernemer worden aangemerkt in de zin van
      [artikel 7, vierde lid, van de Wet op de Omzetbelasting 1968][ref1] (*Stb.* 329).


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel7
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '7'
  - number: '41.1'
    text: |-
      Een aanvraag om verlenging als bedoeld in [artikel 20, tweede lid, van de wet][ref1] dient uiterlijk acht weken
      voordat de geldigheidsduur van de inschrijving is verstreken ingediend te worden.


      [ref1]: https://wetten.overheid.nl/BWBR0005443#Artikel20
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0005443
        artikel: '20'
  - number: '41.2'
    text: Bij verlenging van de inschrijving dienen nieuwe inschrijvingsbewijzen aangevraagd te worden.
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel41
  - number: '42.1'
    text: |-
      De inschrijving kan bij verandering van de aard of de rechtsvorm van de onderneming of het bedrijf op aanvraag van
      de ingeschrevene worden gewijzigd.
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel42
  - number: '42.2'
    text: Bij wijziging van de inschrijving dienen nieuwe inschrijvingsbewijzen aangevraagd te worden.
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel42
  - number: '43'
    text: |-
      De aanvraag om inschrijving voor het verrichten van eigen vervoer en de aanvraag om verlenging, wijziging of
      doorhaling van een inschrijving wordt ingediend bij de SIEV.
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel43
  - number: '44'
    text: |-
      De aanvraag om afgifte van een inschrijvingsbewijs als bedoeld in [artikel 20, derde lid, van de wet][ref1] wordt
      ingediend bij de SIEV.


      [ref1]: https://wetten.overheid.nl/BWBR0005443#Artikel20
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0005443
        artikel: '20'
  - number: '45.1'
    text: |-
      Een inschrijvingsbewijs wordt verleend voor een vrachtauto al dan niet met een aanhangwagen, of voor een samenstel
      van trekker en een oplegger.
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel45
  - number: '45.2'
    text: |-
      Op een inschrijvingsbewijs worden de naam, het adres en de aard van het bedrijf van de ingeschrevene vermeld,
      alsmede de datum waarop de geldigheidsduur van de inschrijving afloopt.
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel45
  - number: '46'
    text: |-
      De modellen van de inschrijvingsbewijzen worden vastgesteld door de SIEV. De bewijzen worden gesteld op linnen of
      duurzaam papier.
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel46
  - number: '47.1'
    text: |-
      Degene die eigen vervoer verricht met een vrachtauto onder gelding van een inschrijving eigen vervoer
      alsmede de bestuurder van die vrachtauto is verplicht ervoor zorg te dragen dat in de vrachtauto een geldig
      inschrijvingsbewijs aanwezig is.
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel47
  - number: '47.2'
    text: Deze verplichting geldt eveneens in geval van lege ritten in verband met het in het eerste lid bedoelde vervoer.
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel47
  - number: '48'
    text: |-
      Ingeval zich een situatie voordoet als bedoeld in [artikel 22 van de wet][ref1], dan wel wanneer toepassing is
      gegeven aan [artikel 23, eerste lid, van de wet][ref2], dienen de inschrijvingsbewijzen die in het bezit zijn
      van de ingeschrevene binnen één week na het tijdstip waarop de daaraan ten grondslag liggende inschrijving haar
      geldigheid heeft verloren, dan wel is doorgehaald, ingeleverd te worden bij de SIEV.


      [ref1]: https://wetten.overheid.nl/BWBR0005443#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0005443#Artikel23
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0005443
        artikel: '22'
      - id: ref2
        bwb_id: BWBR0005443
        artikel: '23'
  - number: '49'
    text: |-
      Diegene die grensoverschrijdend eigen vervoer verricht dient in het bezit te zijn van een machtiging op grond van
      een overeenkomst met een andere Staat, tijdens het verrichten van vervoer op het grondgebied van die Staat, indien
      door die Staat een machtiging wordt geëist voor grensoverschrijdend eigen vervoer naar, door of van het grondgebied
      van die Staat.
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel49
  - number: '50'
    text: |-
      Geen machtiging is vereist voor grensoverschrijdend eigen vervoer indien het eigen vervoer geschiedt in
      overeenstemming met het bepaalde in overeenkomsten met andere Staten, betreffende het grensoverschrijdend eigen
      vervoer van goederen met vrachtauto’s en regelende de erkenning van inschrijving, of ter uitvoering van besluiten
      van volkenrechtelijke organisaties, voor zover zulks bij ministeriële regeling is bepaald.
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel50
  - number: '51'
    text: Aanvragen om machtigingen worden ingediend bij de SIEV.
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel51
  - number: '52'
    text: Bij inwilliging van de aanvraag worden door de SIEV aan de aanvrager een of meer machtigingen verstrekt.
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel52
  - number: '53.1'
    text: 'Een machtiging wordt door de SIEV ingetrokken:'
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel53
  - number: 53.1.a
    text: op verzoek van de ondernemer;
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel53
  - number: 53.1.b
    text: |-
      indien de ondernemer niet meer in het bezit is van een inschrijving eigen vervoer als bedoeld in
      [artikel 15 van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005443#Artikel15
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0005443
        artikel: '15'
  - number: 53.1.c
    text: indien blijkt van geen of onvoldoende gebruik.
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel53
  - number: '53.2'
    text: |-
      De houder van een machtiging is verplicht deze binnen één week na de dagtekening in de beschikking van de SIEV
      waarbij zij wordt ingetrokken, bij de SIEV in te leveren.
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel53
  - number: '54.1'
    text: |-
      Op een machtiging worden vermeld naam en adres van de houder, de aard van de onderneming of het bedrijf, de datum
      waarop op het verzoek om machtiging gunstig is beslist alsmede haar geldigheidsduur.
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel54
  - number: '54.2'
    text: Op een machtiging wordt nauwkeurig omschreven voor welk vervoer toelating is verleend en onder welke voorwaarden.
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel54
  - number: '55'
    text: |-
      Degene die eigen vervoer verricht met een vrachtauto krachtens een machtiging alsmede de bestuurder van die
      vrachtauto is verplicht ervoor zorg te dragen, onverminderd het bepaalde in [artikel 47][ref1], dat bij de
      vrachtauto een geldige machtiging aanwezig is.


      [ref1]: https://wetten.overheid.nl/BWBR0005496#Artikel47
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0005496
        artikel: '47'
        hoofdstuk: III
        paragraaf: '2'
  - number: '56'
    text: |-
      Met betrekking tot de aanvraag, de uitreiking en de intrekking van machtigingen ten behoeve van eigen
      vervoer bedoeld in [artikel 25, eerste lid, van de wet][ref1] zijn de [artikelen 51 tot en met 54][ref2] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005443#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0005496#Artikel51
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0005443
        artikel: '25'
      - id: ref2
        bwb_id: BWBR0005496
        artikel: '51'
        hoofdstuk: III
        paragraaf: '3'
  - number: '57'
    text: |-
      De SIEV kan ter uitvoering van een overeenkomst tussen de Staat der Nederlanden en een andere Staat of een
      volkenrechtelijke organisatie of van een besluit van een volkenrechtelijke organisatie, dan wel om redenen van
      internationaal vervoerbeleid bepalen, dat door de SIEV te verstrekken machtigingen worden uitgereikt door een
      buitenlandse instantie.
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel57
  - number: '58'
    text: |-
      Van het bepaalde in [artikel 25, eerste lid, van de wet][ref1] kan bij ministeriële regeling vrijstelling worden
      verleend indien het eigen vervoer geschiedt in overeenstemming met het bepaalde in overeenkomsten met andere
      Staten, betreffende het grensoverschrijdend eigen vervoer van goederen met vrachtauto’s en regelende de erkenning
      van inschrijving, of ter uitvoering van besluiten van volkenrechtelijke organisaties.


      [ref1]: https://wetten.overheid.nl/BWBR0005443#Artikel25
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0005443
        artikel: '25'
  - number: '59'
    text: |-
      Degene die grensoverschrijdend eigen vervoer verricht krachtens een machtiging met een vrachtauto alsmede de
      bestuurder van die vrachtauto is verplicht ervoor zorg te dragen dat bij de vrachtauto een geldige machtiging
      aanwezig is.
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel59
  - number: '60.1'
    text: |-
      Er is sprake van herhaaldelijk in strijd handelen met het bepaalde in [artikel 5, eerste of derde lid][ref1], of
      [artikel 21 van de wet][ref2], indien de houder van een inschrijving binnen een aaneengesloten periode van drie
      jaar drie maal onherroepelijk tot straf veroordeeld is wegens overtreding van de eerdergenoemde artikelen.


      [ref1]: https://wetten.overheid.nl/BWBR0005443#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005443#Artikel21
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0005443
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005443
        artikel: '21'
  - number: '60.2'
    text: De periode van drie jaar vangt aan op de datum van de eerste onherroepelijke veroordeling.
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel60
  - number: '60.3'
    text: Een veroordeling vervalt na drie jaar.
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel60
  - number: '61'
    text: |-
      Indien de houder van een inschrijving zich schuldig maakt aan overtreding van het bepaalde in
      [artikel 5, eerste of derde lid][ref1], of [artikel 21 van de wet][ref2], stelt de SIEV hem ten minste één maal op
      de hoogte van de daarop staande sanctie van doorhaling van de inschrijving.


      [ref1]: https://wetten.overheid.nl/BWBR0005443#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005443#Artikel21
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0005443
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005443
        artikel: '21'
  - number: '62'
    text: |-
      De houder van een inschrijving eigen vervoer is verplicht deze, alsmede de op basis daarvan afgegeven
      inschrijvingsbewijzen, binnen één week na dagtekening van een beschikking van de SIEV, waarbij zij wordt
      doorgehaald, bij de SIEV in te leveren.
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel62
  - number: '63'
    text: |-
      Onder aanvullende documenten als bedoeld in [artikel 26, eerste lid, van de wet][ref1] worden verstaan:


      [ref1]: https://wetten.overheid.nl/BWBR0005443#Artikel26
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0005443
        artikel: '26'
  - number: 63.a
    text: een bestuurdersattest;
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel63
  - number: 63.b
    text: een C.E.M.T.-vergunning;
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel63
  - number: 63.c
    text: een machtiging op grond van een overeenkomst met een andere staat.
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel63
  - number: '64.1'
    text: |-
      Van de verplichting te beschikken over een bestuurdersattest is vrijgesteld de houder van een communautaire
      vergunning voorzover het vervoer wordt verricht door een bestuurder die onderdaan is van een Lid-Staat, een andere
      staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte of Zwitserland.
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel64
  - number: '64.2'
    text: |-
      Bij ministeriële regeling kan vrijstelling worden verleend van een aanvullend document als bedoeld in
      [artikel 63, onderdelen b en c][ref1], indien het vervoer geschiedt in overeenstemming met een overeenkomst
      met een andere staat of ter uitvoering van een besluit van een volkenrechtelijke organisatie, betreffende het
      grensoverschrijdend beroepsvervoer van goederen met vrachtauto's en regelende de erkenning van vergunningen, dan
      wel om redenen van internationaal vervoerbeleid.


      [ref1]: https://wetten.overheid.nl/BWBR0005496#Artikel63
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0005496
        artikel: '63'
        hoofdstuk: IV
        paragraaf: '1'
  - number: '65.1'
    text: |-
      De NIWO verleent aan de houder van een communautaire vergunning op diens aanvraag een bestuurdersattest indien
      wordt voldaan aan artikel 3, derde lid, van [verordening 881/92](31992R0881).
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel65
  - number: '65.2'
    text: Onze Minister stelt nadere regels ter uitvoering van artikel 3, derde lid, van [verordening 881/92](31992R0881).
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel65
  - number: '66.1'
    text: |-
      Het bestuurdersattest wordt verleend voor de periode waarin wordt voldaan aan de voorwaarden, bedoeld in
      [artikel 65][ref1], doch ten hoogste voor vijf jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0005496#Artikel65
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0005496
        artikel: '65'
        hoofdstuk: IV
        paragraaf: '2'
  - number: '66.2'
    text: |-
      Indien het attest is verleend voor een kortere periode dan vijf jaar, kan, onverminderd het eerste lid, de
      geldigheidsduur van het attest worden verlengd.
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel66
  - number: '67.1'
    text: |-
      De vergunninghouder en de bestuurder van de vrachtauto handelen overeenkomstig artikel 6, vierde lid, van
      [verordening 881/92](31992R0881).
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel67
  - number: '67.2'
    text: |-
      De vergunninghouder levert het bestuurdersattest bij de NIWO in binnen een week na de dagtekening van de
      beschikking waarbij de NIWO het bestuurdersattest intrekt.
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel67
  - number: '75.1'
    text: C.E.M.T.-vergunningen worden door de NIWO uitsluitend uitgereikt aan houders van een communautaire vergunning.
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel75
  - number: '75.2'
    text: |-
      Aanvragen om een C.E.M.T.-vergunning, geldig voor het volgende kalenderjaar, moeten vóór een door de NIWO te
      bepalen datum bij de NIWO worden ingediend; aanvragen om een C.E.M.T.-vergunning voor het lopende kalenderjaar
      kunnen gedurende dat jaar bij de NIWO worden ingediend.
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel75
  - number: '75.3'
    text: Bij overschrijding van de in het tweede lid bedoelde datum wordt de aanvrager in zijn aanvraag niet ontvangen.
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel75
  - number: '75.4'
    text: 'De NIWO beschikt op de ingediende aanvragen:'
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel75
  - number: 75.4.a
    text: |-
      indien het betreft een C.E.M.T.-vergunning, geldig voor het volgende kalenderjaar, zo spoedig mogelijk, doch
      uiterlijk binnen acht weken na de in het tweede lid bedoelde datum;
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel75
  - number: 75.4.b
    text: |-
      indien het betreft een C.E.M.T.-vergunning, geldig voor het lopende kalenderjaar, zo spoedig mogelijk, doch
      uiterlijk binnen acht weken na de datum van indiening van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel75
  - number: '76.1'
    text: |-
      Voor de behandeling van de aanvraag om een C.E.M.T.-vergunning en voor de uitreiking daarvan is de aanvrager aan de
      NIWO een bij ministeriële regeling vast te stellen vergoeding verschuldigd.
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel76
  - number: '76.2'
    text: De NIWO reikt een vergunning eerst uit nadat de in het eerste lid bedoelde vergoedingen zijn ontvangen.
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel76
  - number: '76.3'
    text: |-
      Indien de verschuldigde vergoedingen niet zijn ontvangen binnen twintig dagen nadat de aanvrager van de beslissing
      van de NIWO in kennis is gesteld, is de NIWO bevoegd de aanvraag alsnog af te wijzen.
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel76
  - number: '77.1'
    text: |-
      De houder van een C.E.M.T.-vergunning moet een daarbijbehorend rittenboekje bijhouden, uitgegeven door het
      Secretariaat van de Europese Conferentie van Ministers van Verkeer.
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel77
  - number: '77.2'
    text: |-
      De NIWO reikt aan de houder van een C.E.M.T.-vergunning op zijn verzoek de nodige rittenboekjes uit. De NIWO draagt
      zorg voor de invulling van de omslag van het boekje.
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel77
  - number: '77.3'
    text: |-
      De houder van een C.E.M.T.-vergunning moet een verslag van het verrichte vervoer opmaken voor elke beladen rit,
      afgelegd tussen elke plaats waar geladen of gelost wordt, alsmede voor elke ledige rit, met inachtneming van de in
      het rittenboekje gegeven aanwijzingen.
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel77
  - number: '77.4'
    text: |-
      De verslagen van het verrichte vervoer moeten zodanig worden opgesteld, dat de chronologische volgorde van de voor
      de verschillende al dan niet beladen ritten afgelegde trajecten wordt aangehouden.
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel77
  - number: '78'
    text: |-
      Degene, die krachtens een C.E.M.T.-vergunning grensoverschrijdend beroepsvervoer met een vrachtauto verricht,
      alsmede de bestuurder van die vrachtauto is, onverminderd het bepaalde in de [artikelen 17][ref1] en [27][ref2],
      verplicht ervoor zorg te dragen, dat de geldige C.E.M.T.-vergunning en het bijbehorende rittenboekje bij de
      vrachtauto aanwezig zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0005496#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0005496#Artikel27
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0005496
        artikel: '17'
        hoofdstuk: II
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0005496
        artikel: '27'
        hoofdstuk: II
        paragraaf: '5'
  - number: '79.1'
    text: |-
      De houder van een C.E.M.T.-vergunning is verplicht de bladen met verslagen van het verrichte vervoer binnen twee
      weken na het verstrijken van de maand waarop zij betrekking hebben, aan de NIWO toe te zenden.
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel79
  - number: '79.2'
    text: |-
      De NIWO verzamelt de ingevolge het bepaalde in het eerste lid ontvangen gegevens en brengt deze halfjaarlijks ter
      kennis van Onze Minister op een door deze te bepalen wijze en binnen een door deze te bepalen periode.
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel79
  - number: '80.1'
    text: 'De C.E.M.T.-vergunning wordt door de NIWO ingetrokken:'
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel80
  - number: 80.1.a
    text: Op verzoek van de ondernemer;
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel80
  - number: 80.1.b
    text: indien de ondernemer niet meer in het bezit is van een communautaire vergunning.
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel80
  - number: '80.2'
    text: |-
      De C.E.M.T.-vergunning kan door de NIWO worden ingetrokken indien blijkt van geen, onvoldoende of een tot
      bilateraal vervoer beperkt gebruik.
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel80
  - number: '81'
    text: |-
      De houder van een C.E.M.T.-vergunning is verplicht deze binnen één week na de dagtekening van een beschikking van
      de NIWO, waarbij zij wordt ingetrokken, bij de NIWO in te leveren.
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel81
  - number: '82'
    text: |-
      Machtigingen als bedoeld in [artikel 63, onderdeel c][ref1], worden door de NIWO uitsluitend uitgereikt aan houders
      van een communautaire vergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0005496#Artikel63
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0005496
        artikel: '63'
        hoofdstuk: IV
        paragraaf: '1'
  - number: '83.1'
    text: De NIWO beschikt zo spoedig mogelijk doch uiterlijk binnen acht weken op de ingediende aanvragen om machtigingen.
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel83
  - number: '83.2'
    text: Indien niet binnen acht weken na het in behandeling nemen van de aanvraag is beslist, is de aanvraag toegewezen.
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel83
  - number: '84'
    text: |-
      Een machtiging wordt verleend voor een vrachtauto al dan niet met een aanhangwagen, of voor een samenstel van
      een trekker en een oplegger, waarbij het trekkend voertuig in de Staat van vestiging van de vergunninghouder
      geregistreerd dient te zijn.
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel84
  - number: '85.1'
    text: |-
      Op een machtiging worden vermeld naam en adres van de houder, de datum waarop op het verzoek om machtiging gunstig
      is beslist alsmede haar geldigheidsduur.
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel85
  - number: '85.2'
    text: Op een machtiging wordt nauwkeurig omschreven onder welke voorwaarden zij is verleend.
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel85
  - number: '85.3'
    text: Voor de verstrekking van een machtiging is de aanvrager een vergoeding verschuldigd.
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel85
  - number: '85.4'
    text: De uitreiking van een machtiging vindt eerst plaats nadat de verschuldigde vergoeding is voldaan.
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel85
  - number: '86.1'
    text: 'De machtiging wordt door de NIWO ingetrokken:'
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel86
  - number: 86.1.a
    text: op verzoek van de ondernemer;
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel86
  - number: 86.1.b
    text: indien de ondernemer niet meer in het bezit is van een communautaire vergunning of
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel86
  - number: 86.1.c
    text: bij geen of onvoldoende gebruik.
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel86
  - number: '86.2'
    text: |-
      De houder van een machtiging is verplicht deze binnen één week na de dagtekening van een beschikking van de NIWO,
      waarbij zij wordt ingetrokken, bij de NIWO in te leveren.
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel86
  - number: '87'
    text: |-
      Degene die grensoverschrijdend beroepsvervoer met een vrachtauto verricht krachtens een machtiging alsmede de
      bestuurder van die vrachtauto is, onverminderd het bepaalde in de [artikelen 17][ref1] en [27][ref2] verplicht er
      voor zorg te dragen, dat bij de vrachtauto een geldige machtiging aanwezig is tijdens het verrichten van vervoer op
      het grondgebied van een bepaalde Staat, indien voor grensoverschrijdend beroepsvervoer naar, door of van die Staat
      een machtiging wordt geëist.


      [ref1]: https://wetten.overheid.nl/BWBR0005496#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0005496#Artikel27
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0005496
        artikel: '17'
        hoofdstuk: II
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0005496
        artikel: '27'
        hoofdstuk: II
        paragraaf: '5'
  - number: '88.1'
    text: |-
      Cabotagevergunningen worden door de NIWO uitsluitend uitgereikt aan in Nederland gevestigde ondernemers die in het
      bezit zijn van een communautaire vergunning.
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel88
  - number: '88.2'
    text: |-
      Cabotagevergunningen worden verleend voor een periode, die duurt tot en met 31 december van het jaar, waarin zij
      zijn aangevraagd.
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel88
  - number: '89'
    text: |-
      Met betrekking tot de aanvraag en de uitreiking van een cabotagevergunning is het bepaalde in de
      [artikelen 75][ref1] en [76][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005496#Artikel75
      [ref2]: https://wetten.overheid.nl/BWBR0005496#Artikel76
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0005496
        artikel: '75'
        hoofdstuk: IV
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0005496
        artikel: '76'
        hoofdstuk: IV
        paragraaf: '3'
  - number: '90'
    text: |-
      Indien in de loop van een kalenderjaar cabotagevergunningen beschikbaar komen, worden deze vergunningen in
      volgorde van binnenkomst toegedeeld aan diegenen die reeds een aanvraag om een cabotagevergunning, conform
      [artikel 89][ref1], hebben ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0005496#Artikel89
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0005496
        artikel: '89'
        hoofdstuk: V
        paragraaf: '1'
  - number: '91'
    text: |-
      De NIWO verstrekt aan de houder van een cabotagevergunning op zijn verzoek de nodige boekjes verslagen
      cabotagevervoer tegen betaling van een vergoeding per boekje. De NIWO draagt zorg voor de invulling van de omslag
      van een boekje.
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel91
  - number: '92.1'
    text: Een in Nederland gevestigde ondernemer mag slechts cabotagevervoer verrichten krachtens een speciaal document.
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel92
  - number: '92.2'
    text: |-
      Indien het in het eerste lid bedoelde cabotagevervoer verricht wordt in een Lid-Staat dan geldt als speciaal
      document een cabotagevergunning.
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel92
  - number: '92.3'
    text: |-
      Het bepaalde in het eerste en tweede lid is niet van toepassing indien het vervoer geschiedt in overeenstemming met
      het bepaalde in overeenkomsten met andere Staten of ter uitvoering van besluiten van volkenrechtelijke organisaties
      dan wel om redenen van internationaal vervoerbeleid, voor zover zulks bij ministeriële regeling bekend is gemaakt.
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel92
  - number: '93'
    text: |-
      De houder van een cabotagevergunning is verplicht zorg te dragen voor de invulling van een boekje verslagen
      cabotagevervoer volgens de algemene bepalingen die zijn vermeld op de achterzijde van het eerste blad van de omslag
      van een boekje verslagen en van de toelichting die is vermeld op de voorzijde van het blad dat aan de uitscheurbare
      bladen voorafgaat.
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel93
  - number: '94.1'
    text: |-
      Degene, die krachtens een cabotagevergunning vervoer verricht met een vrachtauto, alsmede de bestuurder van
      die vrachtauto is verplicht ervoor zorg te dragen, dat een geldige cabotagevergunning en een bijbehorend boekje
      verslagen cabotagevervoer bij de vrachtauto aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel94
  - number: '94.2'
    text: Een cabotagevergunning mag slechts voor één vrachtauto tegelijk worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel94
  - number: '94.3'
    text: Een cabotagevergunning dient het trekkend voertuig te vergezellen.
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel94
  - number: '94.4'
    text: Een cabotagevergunning mag niet aan derden worden overgedragen.
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel94
  - number: '95.1'
    text: |-
      De houder van een cabotagevergunning is verplicht deze vergunning binnen een week na het verstrijken van de
      geldigheidsduur, aan de NIWO te zenden.
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel95
  - number: '95.2'
    text: |-
      De houder van een cabotagevergunning is verplicht de gebruikte verslagen van een boekje verslagen cabotagevervoer
      binnen een week na het verstrijken van de maand, waarop zij betrekking hebben aan de NIWO te zenden.
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel95
  - number: '96.1'
    text: 'Een cabotagevergunning wordt door de NIWO ingetrokken:'
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel96
  - number: 96.1.a
    text: op verzoek van de ondernemer;
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel96
  - number: 96.1.b
    text: indien de ondernemer niet meer in het bezit is van een communautaire vergunning.
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel96
  - number: '96.2'
    text: |-
      Indien door de houder van een cabotagevergunning geen of onvoldoende gebruik is gemaakt van reeds uitgereikte
      cabotagevergunningen kan de NIWO de afgifte van toegekende maar nog niet uitgereikte cabotagevergunningen weigeren.
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel96
  - number: '97'
    text: |-
      De houder van een cabotagevergunning is verplicht deze binnen één week na de dagtekening van een beschikking van de
      NIWO, waarbij zij wordt ingetrokken, bij de NIWO in te leveren.
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel97
  - number: '98.1'
    text: |-
      Een ondernemer, die is gevestigd in een andere Staat dan Nederland, mag slechts cabotagevervoer verrichten in
      Nederland krachtens een speciaal document.
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel98
  - number: '98.2'
    text: |-
      Indien de ondernemer gevestigd is in een Lid-Staat dan geldt als speciaal document een cabotagevergunning. Het
      bepaalde in [artikel 94][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005496#Artikel94
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel98
    references:
      - id: ref1
        bwb_id: BWBR0005496
        artikel: '94'
        hoofdstuk: V
        paragraaf: '2'
  - number: '98.3'
    text: |-
      Het bepaalde in het eerste en tweede lid is niet van toepassing indien het vervoer geschiedt in overeenstemming
      met het bepaalde in overeenkomsten met andere Staten of ter uitvoering van besluiten van volkenrechtelijke
      organisaties, dan wel om redenen van internationaal vervoerbeleid, voor zover zulks bekend is gemaakt bij
      ministeriële regeling.
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel98
  - number: '98.4'
    text: |-
      In de ministeriële regeling, bedoeld in het derde lid, kunnen ter uitvoering van de in dat lid bedoelde
      overeenkomsten of besluiten, dan wel van het in dat lid bedoelde beleid, nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel98
  - number: '99'
    text: |-
      Met betrekking tot de aanvraag, de uitreiking en de intrekking van een machtiging als bedoeld in
      [artikel 25 van de wet][ref1] zijn de [artikelen 83 tot en met 86][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005443#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0005496#Artikel83
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0005443
        artikel: '25'
      - id: ref2
        bwb_id: BWBR0005496
        artikel: '83'
        hoofdstuk: IV
        paragraaf: '4'
  - number: '100'
    text: |-
      De NIWO kan ter uitvoering van een overeenkomst tussen de Staat der Nederlanden en een andere Staat of een
      volkenrechtelijke organisatie of van een besluit van een volkenrechtelijke organisatie, dan wel om redenen van
      internationaal vervoerbeleid bepalen, dat door de NIWO te verstrekken machtigingen worden uitgereikt door een
      buitenlandse instantie.
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel100
  - number: '101'
    text: |-
      Van de machtiging, bedoeld in [artikel 25, eerste lid, van de wet][ref1], is vrijgesteld:


      [ref1]: https://wetten.overheid.nl/BWBR0005443#Artikel25
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel101
    references:
      - id: ref1
        bwb_id: BWBR0005443
        artikel: '25'
  - number: 101.a
    text: |-
      de houder van een communautaire vergunning, met dien verstande dat indien de bestuurder geen onderdaan is van
      een land als bedoeld in [artikel 64, eerste lid][ref1], de vrijstelling slechts geldt indien de houder van de
      communautaire vergunning tevens houder is van een bestuurdersattest;


      [ref1]: https://wetten.overheid.nl/BWBR0005496#Artikel64
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel101
    references:
      - id: ref1
        bwb_id: BWBR0005496
        artikel: '64'
        hoofdstuk: IV
        paragraaf: '1'
  - number: 101.b
    text: de houder van een C.E.M.T.-vergunning, voorzover de daaraan verbonden voorschriften worden nageleefd.
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel101
  - number: 101a
    text: |-
      Degene die grensoverschrijdend beroepsvervoer met een vrachtauto verricht krachtens een machtiging als bedoeld
      in [artikel 25, eerste lid, van de wet][ref1], dan wel krachtens een document als bedoeld in [artikel 101][ref2],
      alsmede de bestuurder van die vrachtauto, draagt er zorg voor dat die machtiging of dat document in de vrachtauto
      aanwezig is.


      [ref1]: https://wetten.overheid.nl/BWBR0005443#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0005496#Artikel101
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel101a
    references:
      - id: ref1
        bwb_id: BWBR0005443
        artikel: '25'
      - id: ref2
        bwb_id: BWBR0005496
        artikel: '101'
        hoofdstuk: VI
  - number: '102.1'
    text: |-
      Een machtiging als bedoeld in [artikel 25 van de wet][ref1] is niet vereist voor grensoverschrijdend beroepsvervoer
      naar, door en uit andere Lid-Staten dan Nederland verricht met een vrachtauto die blijkens het kenteken in een
      andere Lid-Staat is geregistreerd en waarvan het toegestaan totaal gewicht in beladen toestand niet meer bedraagt
      dan 6 ton of waarvan het toegestane laadvermogen niet meer bedraagt dan 3,5 ton.


      [ref1]: https://wetten.overheid.nl/BWBR0005443#Artikel25
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel102
    references:
      - id: ref1
        bwb_id: BWBR0005443
        artikel: '25'
  - number: '102.2'
    text: |-
      Van het bepaalde in [artikel 25, eerste lid, van de wet][ref1] kan bij ministeriële regeling vrijstelling
      worden verleend indien het grensoverschrijdend beroepsvervoer geschiedt in overeenstemming met het bepaalde in
      overeenkomsten met andere Staten of ter uitvoering van besluiten van volkenrechtelijke organisaties, betreffende
      het grensoverschrijdend beroepsvervoer van goederen met vrachtauto’s en regelende de erkenning van vergunningen,
      dan wel om redenen van internationaal vervoerbeleid.


      [ref1]: https://wetten.overheid.nl/BWBR0005443#Artikel25
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel102
    references:
      - id: ref1
        bwb_id: BWBR0005443
        artikel: '25'
  - number: '103'
    text: |-
      Een vrachtauto, die blijkens het kenteken niet geregistreerd is in een Lid-Staat, kan de toegang tot Nederland
      worden ontzegd, indien niet voldaan wordt aan het bepaalde in [artikel 25 van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005443#Artikel25
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel103
    references:
      - id: ref1
        bwb_id: BWBR0005443
        artikel: '25'
  - number: '104.1'
    text: |-
      De inhoud van de vrachtbrief, bedoeld in [artikel 29, eerste lid van de wet][ref1], wordt bij ministeriële regeling
      vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005443#Artikel29
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0005443
        artikel: '29'
  - number: '104.2'
    text: 'Geen vrachtbrief is vereist voor het vervoer van:'
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel104
  - number: 104.2.a
    text: levende dieren;
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel104
  - number: 104.2.b
    text: |-
      landbouwprodukten van de teeltplaats naar de veiling en van tot dit vervoer gebezigde ledige verpakkingsmiddelen
      van de veiling naar de teeltplaats;
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel104
  - number: 104.2.c
    text: inboedels;
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel104
  - number: 104.2.d
    text: losgestorte goederen;
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel104
  - number: 104.2.e
    text: postzendingen; of
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel104
  - number: 104.2.f
    text: andere bij ministeriële regeling aan te wijzen goederen.
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel104
  - number: '105.1'
    text: 'De vergunninghouder is verplicht ervoor zorg te dragen dat:'
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel105
  - number: 105.1.a
    text: |-
      een deel van de vrachtbrief vermeldende een omschrijving der goederen, de afzender, de geadresseerde en de
      vervoerder, in de vrachtauto, waarmee de goederen vervoerd worden, aanwezig is;
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel105
  - number: 105.1.b
    text: |-
      een deel van de vrachtbrief bij het ten vervoer aannemen van de goederen aan de afzender ten bewijze van ontvangst
      wordt afgegeven;
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel105
  - number: 105.1.c
    text: |-
      bij aflevering van de goederen het in onderdeel *a* bedoelde deel van de vrachtbrief tegelijk met de goederen wordt
      afgegeven tegen aftekening voor ontvangst van een daarvoor bestemd deel van de vrachtbrief.
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel105
  - number: '105.2'
    text: |-
      Het eerste lid is niet van toepassing indien het beroepsvervoer betreft waarvan de op dat vervoer betrekking
      hebbende vrachtbriefgegevens gestructureerd en genormeerd via een electronisch systeem worden uitgewisseld. De aard
      en inhoud van de bescheiden die in dat geval aan de in [artikel 43 van de wet][ref1] bedoelde ambtenaren ter inzage
      dienen te worden gegeven, worden bij ministeriële regeling vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005443#Artikel43
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel105
    references:
      - id: ref1
        bwb_id: BWBR0005443
        artikel: '43'
  - number: '105.3'
    text: |-
      Namens Onze Minister kan door een door hem aan te wijzen ambtenaar van het bepaalde in het eerste lid, onderdeel
      *a*, ontheffing worden verleend. In dat geval is de vergunninghouder verplicht zorg te dragen, dat een door die
      ambtenaar afgegeven bewijs van de ontheffing in de vrachtauto, waarmede de goederen vervoerd worden, aanwezig is.
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel105
  - number: '105.4'
    text: |-
      Aan het bepaalde in het eerste lid, onderdeel *c*, is, voor zover betreft de aftekening voor ontvangst voldaan,
      indien bij aflevering van de goederen voor ontvangst is afgetekend op een afzonderlijke lijst onder verwijzing naar
      de bij de zending behorende vrachtbrief.
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel105
  - number: '106.1'
    text: |-
      De vergoedingen bedoeld in [artikel 27, eerste lid, van de wet][ref1] mogen de normaal te achten kosten van
      behandeling, alsmede een redelijke bijdrage aan de apparaatskosten niet overschrijden.


      [ref1]: https://wetten.overheid.nl/BWBR0005443#Artikel27
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel106
    references:
      - id: ref1
        bwb_id: BWBR0005443
        artikel: '27'
  - number: '106.2'
    text: |-
      De vergoedingen bedoeld in [artikel 27, tweede lid, van de wet][ref1] zijn jaarlijks verschuldigd en dienen in
      redelijke verhouding te staan tot de kosten die samenhangen met de in [artikel 7][ref2] bedoelde werkzaamheden.


      [ref1]: https://wetten.overheid.nl/BWBR0005443#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0005496#Artikel7
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel106
    references:
      - id: ref1
        bwb_id: BWBR0005443
        artikel: '27'
      - id: ref2
        bwb_id: BWBR0005496
        artikel: '7'
        hoofdstuk: II
        paragraaf: '1'
  - number: '107'
    text: De NIWO verschaft periodiek aan Onze Minister een overzicht van de houders van C.E.M.T.-, en cabotagevergunningen.
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel107
  - number: '108'
    text: |-
      Overtreding van elk der bepalingen in de [artikelen 13][ref1], [14][ref2], [17][ref3], [24][ref4], [25][ref5],
      [27][ref6], [38][ref7], [47][ref8] , [48][ref9], [49][ref10], [55][ref11], [59][ref12], [62][ref13], [67][ref14],
      [77, eerste en derde lid][ref15], [78][ref16], [79, eerste lid][ref17], [81][ref18], [86, tweede lid][ref19],
      [87][ref20], [92, eerste lid][ref21], [93][ref22], [94][ref23], [95, eerste en tweede lid][ref24], [97][ref25],
      [98, eerste lid][ref26], [99][ref27], [101a][ref28] en [105, eerste en derde lid, laatste volzin][ref29], vormt een
      strafbaar feit in de zin van [artikel 1, onder 4][ref30] (*Stb.* 1950, 258).


