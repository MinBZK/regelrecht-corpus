  - number: '109'
    text: |-
      Gemeenten, welke vóór 1 januari 1986 vervoer hebben verricht bij de verwijdering van afvalstoffen die naar hun
      aard overeenkomen met de in [artikel 3, tweede lid, onderdeel ][ref1], genoemde stoffen en die afkomstig zijn uit
      niet-particuliere huishoudens, zijn gerechtigd dit vervoer tot 1 september 1992 te verrichten zonder een daartoe
      strekkende vergunning of inschrijving.


      [ref1]: https://wetten.overheid.nl/BWBR0005496#Artikel3
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel109
    references:
      - id: ref1
        bwb_id: BWBR0005496
        artikel: '3'
        hoofdstuk: I
        paragraaf: '2'
  - number: '110'
    text: |-
      Degenen, die vóór 1 mei 1988 tegen vergoeding vervoer hebben verricht van zuiveringsslib, dat slechts voor ten
      hoogste 20% bestaat uit vaste stoffen, zijn gerechtigd dit vervoer tot 19 maart 1994 te verrichten zonder een
      daartoe strekkende vergunning.
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel110
  - number: '111'
    text: |-
      Zaken die ter kennis zijn gebracht van het tuchtcollege bedoeld in artikel 52 van het Uitvoeringsbesluit
      autovervoer goederen 1988 vóór het tijdstip van in werking treden van deze wet worden, voor zover daarop bij het
      in werking treden van deze wet nog niet is beslist, behandeld overeenkomstig het bepaalde bij of krachtens de Wet
      Autovervoer Goederen.
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel111
  - number: '112'
    text: |-
      De verklaringen van dienstbetrekking als bedoeld in artikel 132 van het Uitvoeringsbesluit Autovervoer Goederen
      1988 (*Stb.* 209) die gelden op het tijdstip van het in werking treden van dit Besluit, worden vanaf dat tijdstip
      aangemerkt als verklaringen van dienstbetrekking als bedoeld in [artikel 24, onderdeel a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005496#Artikel24
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0005496
        artikel: '24'
        hoofdstuk: II
        paragraaf: '5'
  - number: '114.1'
    text: |-
      De [artikelen 55][ref1] en [56 van de Wet][ref2] treden in werking op 30 april 1992.


      [ref1]: https://wetten.overheid.nl/BWBR0005443#Artikel55
      [ref2]: https://wetten.overheid.nl/BWBR0005443#Artikel56
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel114
    references:
