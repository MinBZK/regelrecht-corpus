        artikel: '56'
  - number: '114.2'
    text: |-
      De overige [artikelen van de wet][ref1], alsmede dit besluit, treden in werking op 1 mei 1992.


      [ref1]: https://wetten.overheid.nl/BWBR0005443
    url: https://wetten.overheid.nl/BWBR0005496/2005-01-12#Artikel114
    references:
