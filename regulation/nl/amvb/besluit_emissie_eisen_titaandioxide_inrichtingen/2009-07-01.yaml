---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_emissie_eisen_titaandioxide_inrichtingen
regulatory_layer: AMVB
publication_date: '2012-11-13'
valid_from: '2009-07-01'
bwb_id: BWBR0006013
url: https://wetten.overheid.nl/BWBR0006013/2009-07-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 24 december 1992,
    nr. MJZ24d92020, Centrale Directie Juridische Zaken, Afdeling Wetgeving;

    Gelet op richtlijn nr. 92/112/EEG van de Raad van de Europese Gemeenschappen van 15 december 1992 tot vaststelling
    van de procedure voor de harmonisatie van de programma’s tot vermindering en uiteindelijke algehele opheffing
    van de verontreiniging door afval van de titaandioxide-industrie (PbEG L 409) en op artikel 8.44 van de Wet
    milieubeheer;

    De Raad van State gehoord (advies van 6 mei 1993, nr. W08.92.0659);

    Gezien het nader rapport van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 9 juni
    1993, nr. MJZ 09693023, Centrale Directie Juridische Zaken, Afdeling Wetgeving;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0006013/2009-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0006013/2009-07-01#Artikel1
  - number: 1.a
    text: |-
      inrichting: inrichting die behoort tot een krachtens [artikel 1.1, derde lid, van de Wet milieubeheer][ref1]
      aangewezen categorie, bestemd voor de produktie van titaandioxide;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel1
    url: https://wetten.overheid.nl/BWBR0006013/2009-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '1'
  - number: 1.b
    text: |-
      bestaande inrichting: inrichting die voor 22 februari 1978 is opgericht en waarvan de jaarcapaciteit voor de
      produktie van titaandioxide na die datum met niet meer dan 15 000 ton is uitgebreid;
    url: https://wetten.overheid.nl/BWBR0006013/2009-07-01#Artikel1
  - number: 1.c
    text: 'nieuwe inrichting: inrichting die geen bestaande inrichting is;'
    url: https://wetten.overheid.nl/BWBR0006013/2009-07-01#Artikel1
  - number: 1.d
    text: 'stof:'
    url: https://wetten.overheid.nl/BWBR0006013/2009-07-01#Artikel1
  - number: 1.d.1°
    text: |-
      ingeval het sulfaatproces wordt toegepast: stofdeeltjes van welke aard ook, afkomstig van de inrichting, en met
      name stofdeeltjes afkomstig van erts en pigment;
    url: https://wetten.overheid.nl/BWBR0006013/2009-07-01#Artikel1
  - number: 1.d.2°
    text: |-
      ingeval het chloorproces wordt toegepast: stofdeeltjes van welke aard ook, afkomstig van de inrichting, en met name
      stofdeeltjes afkomstig van erts, pigment en cokes;
    url: https://wetten.overheid.nl/BWBR0006013/2009-07-01#Artikel1
  - number: 1.e
    text: |-
      SOx: gasvormig zwaveldioxide (SO2) en zwaveltrioxide (SO3), afkomstig van de verschillende fasen van het
      produktieproces en van de interne behandeling van afvalstoffen, met inbegrip van zuurdruppels;
    url: https://wetten.overheid.nl/BWBR0006013/2009-07-01#Artikel1
  - number: 1.f
    text: 'chloor: gasvormig chloor, afkomstig van de verschillende fasen van het produktieproces;'
    url: https://wetten.overheid.nl/BWBR0006013/2009-07-01#Artikel1
  - number: 1.g
    text: 'Nm3: kubieke meter bij een temperatuur van 273 K en een druk van 101,3 kPa, droog;'
    url: https://wetten.overheid.nl/BWBR0006013/2009-07-01#Artikel1
  - number: 1.h
    text: |-
      bevoegd gezag: het bestuursorgaan dat bevoegd is een vergunning krachtens
      [artikel 8.1 van de Wet milieubeheer][ref1] voor de betrokken inrichting te verlenen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0006013/2009-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
  - number: '2.1'
    text: |-
      Degene die een bestaande inrichting drijft, draagt ervoor zorg dat, ingeval er gebruik wordt gemaakt van het
      sulfaatproces:
    url: https://wetten.overheid.nl/BWBR0006013/2009-07-01#Artikel2
  - number: 2.1.a
    text: |-
      vanaf 31 december 1993 de uitworp van stof uit de bronnen met een uitworp groter dan 2 kg/h niet meer bedraagt dan
      een daggemiddelde concentratie van 50 mg/Nm3 en een uurgemiddelde concentratie van 100 mg/Nm3 en de uitworp van
      stof uit elke andere bron niet meer bedraagt dan een daggemiddelde concentratie van 150 mg/Nm3 en een uurgemiddelde
      concentratie van 300 mg/Nm3;
    url: https://wetten.overheid.nl/BWBR0006013/2009-07-01#Artikel2
  - number: 2.1.b
    text: |-
      vanaf 1 januari 1995 de uitworp van SOx, vrijkomend tijdens de ontsluitings- en roostingsfase van de produktie van
      titaandioxide, niet meer bedraagt dan 10 kg SO2-equivalent per geproduceerde ton titaandioxide;
    url: https://wetten.overheid.nl/BWBR0006013/2009-07-01#Artikel2
  - number: 2.1.c
    text: maatregelen zijn getroffen ter voorkoming van de uitworp van zuurdruppels;
    url: https://wetten.overheid.nl/BWBR0006013/2009-07-01#Artikel2
  - number: 2.1.d
    text: |-
      de uitworp van SOx uit de installaties voor het concentreren van afvalzuren niet meer bedraagt dan 500 mg/Nm3,
      berekend als SO2-equivalent, en
    url: https://wetten.overheid.nl/BWBR0006013/2009-07-01#Artikel2
  - number: 2.1.e
    text: |-
      indien in de inrichting zouten worden geroost, die afkomstig zijn van de zuivering van afvalstoffen, de inrichting
      is uitgerust met de beste bestaande technieken ten einde de uitworp van SOx te beperken.
    url: https://wetten.overheid.nl/BWBR0006013/2009-07-01#Artikel2
  - number: '2.2'
    text: |-
      In afwijking van het eerste lid, onder *a*, draagt degene die een bestaande inrichting drijft, er met ingang van
      1 januari 1996 voor zorg dat de uitworp van stof uit de bronnen met een uitworp groter dan 0,5 kg/h niet meer
      bedraagt dan een daggemiddelde concentratie van 50 mg/Nm3 en een uurgemiddelde concentratie van 100 mg/Nm3 en de
      uitworp van stof uit elke andere bron niet meer bedraagt dan een daggemiddelde concentratie van 150 mg/Nm3 en een
      uurgemiddelde concentratie van 300 mg/Nm3.
    url: https://wetten.overheid.nl/BWBR0006013/2009-07-01#Artikel2
  - number: '3.1'
    text: |-
      Degene die een bestaande inrichting drijft, draagt ervoor zorg dat, ingeval er gebruik wordt gemaakt van het
      chlorideproces:
    url: https://wetten.overheid.nl/BWBR0006013/2009-07-01#Artikel3
  - number: 3.1.a
    text: |-
      de uitworp van stof uit de bronnen met een uitworp groter dan 2 kg/h niet meer bedraagt dan een daggemiddelde
      concentratie van 50 mg/Nm3 en een uurgemiddelde concentratie van 100 mg/Nm3 en de uitworp van stof uit elke andere
      bron niet meer bedraagt dan een daggemiddelde concentratie van 150 mg/Nm3 en een uurgemiddelde concentratie van 300
      mg/Nm3, en
    url: https://wetten.overheid.nl/BWBR0006013/2009-07-01#Artikel3
  - number: 3.1.b
    text: |-
      de daggemiddelde en uurgemiddelde waarde van de uitworp van chloor niet meer bedragen dan 5 mg/Nm3
      onderscheidenlijk 10 mg/Nm3 en de momentane waarde daarvan niet meer bedraagt dan 40 mg/Nm3.
    url: https://wetten.overheid.nl/BWBR0006013/2009-07-01#Artikel3
  - number: '3.2'
    text: |-
      In afwijking van het eerste lid, onder *a*, draagt degene die een bestaande inrichting drijft, er met ingang van
      1 januari 1996 voor zorg dat de uitworp van stof uit de bronnen met een uitworp groter dan 0,5 kg/h niet meer
      bedraagt dan een daggemiddelde concentratie van 50 mg/Nm3 en een uurgemiddelde concentratie van 100 mg/Nm3 en de
      uitworp van stof uit elke andere bron niet meer bedraagt dan een daggemiddelde concentratie van 150 mg/Nm3 en een
      uurgemiddelde concentratie van 300 mg/Nm3.
    url: https://wetten.overheid.nl/BWBR0006013/2009-07-01#Artikel3
  - number: '4'
    text: |-
      Degene die een nieuwe inrichting drijft, past ter voorkoming van de uitworp van stof, SO2, SO3 en chloor, de beste
      bestaande technieken toe, waarbij ten minste wordt voldaan aan de eisen die bij dit besluit zijn gesteld voor
      bestaande inrichtingen.
    url: https://wetten.overheid.nl/BWBR0006013/2009-07-01#Artikel4
  - number: '5'
    text: |-
      De hoeveelheden SO2, SO3 en zuurdruppels uitgedrukt in SO2-equivalent worden berekend met inachtneming van het
      tijdens het in bedrijf zijn van de inrichting geloosde gasvolume en het gedurende dezelfde tijd gemeten gemiddelde
      gehalte aan SO2 en SO3. De bepalingen van het debiet en van het gehalte aan SO2 en SO3 geschieden bij dezelfde
      temperatuur- en vochtigheidscondities.
    url: https://wetten.overheid.nl/BWBR0006013/2009-07-01#Artikel5
  - number: '6.1'
    text: |-
      Tenzij het gegevens betreft, die reeds ingevolge [titel 12.3 van de Wet milieubeheer][ref1] aan het bevoegd gezag
      ter beschikking worden gesteld, kan het bevoegd gezag nadere eisen stellen met betrekking tot:


      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0006013/2009-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0003245
  - number: 6.1.a
    text: de wijze waarop de concentraties van SOx, chloor en stof in het afgas moeten worden vastgesteld, en
    url: https://wetten.overheid.nl/BWBR0006013/2009-07-01#Artikel6
  - number: 6.1.b
    text: |-
      het ter beschikking stellen aan het bevoegd gezag van gegevens over de vastgestelde concentraties, bedoeld onder
      *a*.
    url: https://wetten.overheid.nl/BWBR0006013/2009-07-01#Artikel6
  - number: '6.2'
    text: Degene die de inrichting drijft, is gehouden aan de krachtens het eerste lid gestelde nadere eisen te voldoen.
    url: https://wetten.overheid.nl/BWBR0006013/2009-07-01#Artikel6
  - number: '7'
    text: |-
      Degene die de inrichting drijft, doet jaarlijks voor 1 maart opgave van de produktie van titaandioxide over het
      daaraan voorafgaande kalenderjaar aan het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0006013/2009-07-01#Artikel7
  - number: '8'
    text: |-
      Het bevoegd gezag kan bij het wijzigen van een voor een bestaande inrichting verleende vergunning als bedoeld in
      [artikel 8.1 van de Wet milieubeheer][ref1], aan de vergunning voorschriften verbinden die strenger zijn dan de
      eisen, neergelegd in de [artikelen 2][ref2] en [3][ref3], doch niet strenger dan de eisen waaraan bij toepassing
      van de beste bestaande technieken kan worden voldaan. Laatstbedoelde eisen worden slechts als voorschriften aan
      de vergunning verbonden, indien het voldoen aan die eisen redelijkerwijs van degene die de inrichting drijft, kan
      worden gevergd.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0006013#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0006013#Artikel3
    url: https://wetten.overheid.nl/BWBR0006013/2009-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0006013
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0006013
        artikel: '3'
  - number: '9'
    text: |-
      Ten aanzien van inrichtingen die op het tijdstip waarop dit besluit in werking treedt, reeds zijn opgericht, wordt
      dit besluit eerst een maand na dat tijdstip van toepassing.
    url: https://wetten.overheid.nl/BWBR0006013/2009-07-01#Artikel9
  - number: '10'
    text: |-
      Dit besluit treedt in werking met ingang van een maand na de datum van uitgifte van het *Staatsblad* waarin het
      is geplaatst.
    url: https://wetten.overheid.nl/BWBR0006013/2009-07-01#Artikel10
  - number: '11'
    text: 'Dit besluit wordt aangehaald als: Besluit emissie-eisen titaandioxide-inrichtingen.'
    url: https://wetten.overheid.nl/BWBR0006013/2009-07-01#Artikel11
