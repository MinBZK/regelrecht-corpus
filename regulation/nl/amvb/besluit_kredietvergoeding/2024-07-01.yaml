  - number: '7'
    text: |-
      1 De ten hoogste toegelaten totale kredietvergoeding bij regelmatige afwikkeling van niet-doorlopende
      kredietovereenkomsten met een vaste kredietvergoeding, waarbij:

      a. de betalingstermijn en het termijnbedrag gedurende de looptijd gelijk blijven, of

      b. de betalingstermijn gedurende de looptijd gelijk blijft en het eerste of het laatste termijnbedrag afwijkt van
      de overige termijnbedragen, die gedurende de looptijd gelijk blijven, voor zover deze afwijking een gevolg is van
      afrondingen, wordt berekend als volgt:

      TKV = n . T - K,

      waarbij:

      en

      . In deze formules is:

      TKV: de ten hoogste toegelaten totale kredietvergoeding;

      n: het totale aantal betalingstermijnen;

      T: het termijnbedrag dat geldt indien het ten hoogste toegelaten kredietvergoedingspercentage per betalingstermijn
      wordt gehanteerd;

      K: de kredietsom;

      im: het honderdste deel van het ten hoogste toegelaten kredietvergoedingspercentage per betalingstermijn;

      i: het honderdste deel van het ingevolge [afdeling 1][ref1] ten hoogste toegelaten effectieve
      kredietvergoedingspercentage op jaarbasis;

      m: het aantal betalingstermijnen per jaar.

      2 De ten hoogste toegelaten totale kredietvergoeding bij regelmatige afwikkeling van niet-doorlopende
      kredietovereenkomsten met een vaste kredietvergoeding, waarbij de eerste betalingstermijn afwijkt van de overige
      betalingstermijnen, voor zover deze afwijking tot gevolg heeft dat het eerste of het laatste termijnbedrag afwijkt
      van de overige termijnbedragen, terwijl die overige betalingstermijnen en termijnbedragen gedurende de looptijd
      gelijk blijven, wordt berekend als de som van:

      a. de ten hoogste toegelaten totale kredietvergoeding, berekend op de in het eerste lid aangegeven wijze, met dien
      verstande dat voor de omschrijving van "n" wordt gelezen: het totale aantal gelijk blijvende betalingstermijnen, en

      b. de ter zake van de afwijkende betalingstermijn op dagbasis berekende ten hoogste toegelaten kredietvergoeding,
      berekend op de in [artikel 10][ref2] aangegeven wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0005233#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0005233#Artikel10
