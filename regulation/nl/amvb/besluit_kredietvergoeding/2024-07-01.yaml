  - number: '8'
    text: |-
      1 De ten hoogste toegelaten kredietvergoeding per betalingstermijn bij regelmatige afwikkeling van andere dan de
      in het tweede lid alsmede de [artikelen 6][ref1] en [7][ref2] bedoelde kredietovereenkomsten wordt berekend als
      volgt:

      KVt= Rt . imt,

      waarbij:

      . In deze formules is:

      KVt: de ten hoogste toegelaten kredietvergoeding over de betalingstermijn met volgnummer t;

      Rt: het uitstaand saldo aan het begin van de betalingstermijn met volgnummer t dan wel,

      1°. indien bij een doorlopende kredietovereenkomst het uitstaand saldo als gevolg van achterstallige betalingen
      hoger is dan de kredietlimiet: de kredietlimiet;

      2°. indien bij een niet-doorlopende kredietovereenkomst de kredietnemer achterstallig is: het uitstaand saldo dat
      zou bestaan indien de kredietnemer niet achterstallig zou zijn;

      imt: het honderdste deel van het ten hoogste toegelaten kredietvergoedingspercentage per betalingstermijn met
      volgnummer t;

      i: het honderdste deel van het ingevolge [afdeling 1][ref3] ten hoogste toegelaten effectieve
      kredietvergoedingspercentage op jaarbasis;

      mt: een periode die gelijk is aan een jaar, uitgedrukt in eenheden van een betalingstermijn met volgnummer t.

      2 De ten hoogste toegelaten kredietvergoeding bij regelmatige afwikkeling van doorlopende kredietovereenkomsten
      waarvoor geen betalingsregeling van toepassing is wordt berekend op dagbasis. Daarbij wordt de ten hoogste
      toegelaten kredietvergoeding per dag berekend op de in [artikel 10][ref4] aangegeven wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0005233#Artikel6
