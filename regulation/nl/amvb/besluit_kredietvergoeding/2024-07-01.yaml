articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. betalingstermijn: het tijdvak dat ligt tussen:

      1°. het tijdstip waarop ter uitvoering van een kredietovereenkomst door de kredietgever een geldsom ter beschikking
      wordt gesteld onderscheidenlijk met het verschaffen van het genot van een zaak of het verlenen van een dienst een
      aanvang wordt gemaakt en het tijdstip waarop de kredietnemer de eerste betaling moet hebben gedaan, dan wel

      2°. twee opeenvolgende tijdstippen waarop de kredietnemer ter uitvoering van een kredietovereenkomst een betaling
      moet hebben gedaan;

      b. termijnbedrag: het bedrag van een betaling die de kredietnemer aan het einde van een betalingstermijn moet
      hebben gedaan;

      c. betalingsregeling: de regeling van de hoogte van de termijnbedragen, alsmede de lengte en, bij niet-doorlopend
      krediet, het aantal van de betalingstermijnen, welke in het kader van een kredietovereenkomst van toepassing is;

      d. kredietvergoedingspercentage per betalingstermijn: de kredietvergoeding die over een betalingstermijn
      in rekening wordt gebracht, uitgedrukt in een percentage van het uitstaand saldo aan het begin van die
      betalingstermijn;

      e. vaste kredietvergoeding: kredietvergoeding ten aanzien waarvan bij het aangaan van de kredietovereenkomst is
      overeengekomen dat het kredietvergoedingspercentage per betalingstermijn gedurende de looptijd gelijk blijft;

      f. variabele kredietvergoeding: kredietvergoeding ten aanzien waarvan bij het aangaan van de kredietovereenkomst
      is overeengekomen dat het kredietvergoedingspercentage per betalingstermijn gedurende de looptijd kan worden
      gewijzigd;

      g. kredietvergoeding bij regelmatige afwikkeling: de in
      [artikel 76, eerste lid, onderdeel a, van Boek 7 van het Burgerlijk Wetboek][ref1] bedoelde vorm van
      kredietvergoeding;

      h. vertragingsvergoeding: de in [artikel 76, eerste lid, onderdeel b, van Boek 7 van het Burgerlijk Wetboek][ref2]
      bedoelde vorm van kredietvergoeding.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel76
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel76
