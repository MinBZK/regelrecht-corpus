  - number: '10'
    text: |-
      De ten hoogste toegelaten kredietvergoeding per dag bij regelmatige afwikkeling wordt berekend als volgt:

      . In deze formule is:

      KVd: de ten hoogste toegelaten kredietvergoeding over dag d;

      Rd: 'het uitstaand saldo aan het begin van dag d, dan wel:'

      1°. indien het gaat om de toepassing van [artikel 6, tweede lid][ref1], of [artikel 8, eerste lid][ref2], en het
      uitstaand saldo als gevolg van achterstallige betalingen hoger is dan de kredietlimiet: de kredietlimiet;

      2°. indien het gaat om de toepassing van [artikel 7, tweede lid, onder b][ref3], en de kredietnemer achterstallig
      is: het uitstaand saldo dat aan het begin van dag d zou bestaan als de kredietnemer niet achterstallig zou zijn;

      i: het honderdste deel van het ingevolge [afdeling 1][ref4] ten hoogste toegelaten effectieve
      kredietvergoedingspercentage op jaarbasis;

      q: het aantal dagen van de maand waarvan dag d deel uitmaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0005233#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005233#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0005233#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0005233#HoofdstukII
