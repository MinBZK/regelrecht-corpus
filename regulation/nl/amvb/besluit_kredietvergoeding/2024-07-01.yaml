        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005233
        artikel: 16a
        hoofdstuk: V
  - number: '16'
    text: |-
      Indien gedurende de looptijd van een kredietovereenkomst de wettelijke rente wijzigt, is ten aanzien van de
      berekening van de ten hoogste toegelaten kredietvergoeding bij regelmatige afwikkeling het ten hoogste toegelaten
      effectieve kredietvergoedingspercentage op jaarbasis van toepassing dat gold op het tijdstip waarop:

      a. de kredietovereenkomst is aangegaan, indien het betreft vaste kredietvergoeding;

      b. de hoogte van de kredietvergoeding laatstelijk is gewijzigd, indien het betreft variabele kredietvergoeding.
    url: https://wetten.overheid.nl/BWBR0005233/2024-07-01#Artikel16
  - number: 16a
    text: |-
      1 De [artikelen 4 tot en met 10][ref1] en [15][ref2] zijn niet van toepassing wanneer het jaarlijks
      kostenpercentage, bedoeld in [artikel 1 van het Besluit Gedragstoezicht financiële ondernemingen Wft][ref3] ten
      hoogste de wettelijke rente verhoogd met 8 procentpunten bedraagt.

      2 Indien het eerste lid van toepassing is, wordt in [artikel 16][ref4] in plaats van «effectieve
      kredietvergoedingspercentage op jaarbasis» gelezen: jaarlijks kostenpercentage.


