  - number: '11'
    text: |-
      De ten hoogste toegelaten vertragingsvergoeding wordt op dagbasis berekend. De ten hoogste toegelaten
      vertragingsvergoeding per dag wordt berekend als volgt:

      . In deze formule is:

      VVd: de ten hoogste toegelaten vertragingsvergoeding over dag d;

      Ad: het bedrag in de betaling waarvan de kredietnemer aan het begin van dag d achterstallig is dan wel, indien het
      een kredietovereenkomst als bedoeld in [artikel 6][ref1] betreft, het deel van het uitstaand saldo dat op dag d de
      kredietlimiet te boven gaat als gevolg van achterstallige betalingen;

      r: het honderdste deel van het in het kader van de kredietovereenkomst overeengekomen effectieve
      kredietvergoedingspercentage op jaarbasis;

      q: het aantal dagen van de maand waarvan dag d deel uitmaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0005233#Artikel6
    url: https://wetten.overheid.nl/BWBR0005233/2024-07-01#Artikel11
