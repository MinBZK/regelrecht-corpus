  - number: '15'
    text: |-
      Op kredietovereenkomsten, aangegaan voor 10 augustus 2020, blijven, ten aanzien van geldsommen of diensten die voor
      die datum ter beschikking zijn gesteld, zijn opgenomen of verschaft of ten aanzien van genot van zaken dat voor die
      datum is verschaft, de [artikelen 4][ref1] en [16a][ref2] van het Besluit kredietvergoeding, zoals die artikelen
      luidden voor 10 augustus 2020, van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005233#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005233#Artikel16a
    url: https://wetten.overheid.nl/BWBR0005233/2024-07-01#Artikel15
