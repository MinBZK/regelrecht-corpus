  - number: '2'
    text: |-
      Voor de toepassing van dit besluit wordt een bij een kredietovereenkomst in maanden, kwartalen of jaren uitgedrukte
      betalingstermijn beschouwd als een gedurende de looptijd gelijk blijvende betalingstermijn, indien dit in een tot
      de kredietovereenkomst behorende overeenkomst uitdrukkelijk is overeengekomen.
    url: https://wetten.overheid.nl/BWBR0005233/2024-07-01#Artikel2
  - number: '3'
    text: |-
      Kredietvergoeding over een bepaald tijdvak mag niet eerder in rekening worden gebracht dan nadat de laatste dag van
      dat tijdvak is verstreken.
    url: https://wetten.overheid.nl/BWBR0005233/2024-07-01#Artikel3
  - number: '4'
    text: |-
      Voor de berekening van de ten hoogste toegelaten kredietvergoeding bij regelmatige afwikkeling geldt de wettelijke
      rente verhoogd met 8 procentpunten als het ten hoogste toegelaten effectieve kredietvergoedingspercentage op
      jaarbasis.
    url: https://wetten.overheid.nl/BWBR0005233/2024-07-01#Artikel4
  - number: '6'
    text: |-
      1 De ten hoogste toegelaten kredietvergoeding per betalingstermijn bij regelmatige afwikkeling van doorlopende
      kredietovereenkomsten met een variabele kredietvergoeding, waarbij:

      a. de betalingstermijn gedurende de looptijd gelijk blijft, of

      b. de eerste of de laatste betalingstermijn dan wel die beide betalingstermijnen afwijkt respectievelijk afwijken
      van de overige betalingstermijnen, die gedurende de looptijd gelijk blijven, wordt, onverminderd het bepaalde in
      het tweede en derde lid, berekend als volgt:

      KVt= Rt. im,

      waarbij:

      . In deze formules is:

      KVt: de ten hoogste toegelaten kredietvergoeding over de betalingstermijn met volgnummer t;

      Rt: het uitstaand saldo aan het begin van de betalingstermijn met volgnummer t dan wel, indien het uitstaand saldo
      als gevolg van achterstallige betalingen hoger is dan de kredietlimiet: de kredietlimiet;

      im: het honderdste deel van het ten hoogste toegelaten kredietvergoedingspercentage per betalingstermijn;

      i: het honderdste deel van het ingevolge [afdeling 1][ref1] ten hoogste toegelaten effectieve
      kredietvergoedingspercentage op jaarbasis;

      m: het aantal betalingstermijnen per jaar.

      2 Indien bij een kredietovereenkomst als bedoeld in het eerste lid een betaling of het opnemen van een geldsom
      door de kredietnemer dan wel het verschaffen van het genot van een zaak of het verlenen van een dienst aan
      de kredietnemer, plaatsvinden op een ander tijdstip dan waarop ingevolge de betalingsregeling uiterlijk een
      termijnbedrag dient te worden voldaan, wordt de ten hoogste toegelaten kredietvergoeding ter zake van de
      betalingstermijn waarbinnen deze gebeurtenissen plaatsvinden, op dagbasis berekend, waarbij de ten hoogste
      toegelaten kredietvergoeding per dag wordt berekend op de in [artikel 10][ref2] aangegeven wijze.

      3 In het geval, bedoeld in het eerste lid, onder *b*, wordt de ten hoogste toegelaten kredietvergoeding ter zake
      van de afwijkende betalingstermijnen op dagbasis berekend, waarbij de ten hoogste toegelaten kredietvergoeding per
      dag wordt berekend op de in [artikel 10][ref3] aangegeven wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0005233#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0005233#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0005233#Artikel10
