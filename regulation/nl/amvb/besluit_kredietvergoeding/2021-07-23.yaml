$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_kredietvergoeding
regulatory_layer: AMVB
publication_date: '2020-07-20'
valid_from: '2021-07-23'
bwb_id: BWBR0005233
url: https://wetten.overheid.nl/BWBR0005233/2021-07-23
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Economische Zaken van 6 mei 1991, nr. 91041078 WJA/W, gedaan in
    overeenstemming met Onze Minister van Financiën;

    Gelet op de artikelen 35, 50, derde lid, en 64 van de Wet op het consumentenkrediet (Stb. 1990, 395);

    Gehoord de Adviescommissie consumentenkrediet;

    De Raad van State gehoord (advies van 26 september 1991, nr. W10.91.0236);

    Gezien het nader rapport van de Staatssecretaris van Economische Zaken van 7 oktober 1991, nr. 91088192 WJA/W,
    uitgebracht in overeenstemming met Onze Minister van Financiën;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0005233/2021-07-23#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0005233/2021-07-23#Artikel1
  - number: 1.a
    text: |-
      wet: de [Wet op het consumentenkrediet][ref1] (*Stb.* 1990, 395);


      [ref1]: https://wetten.overheid.nl/BWBR0004815
    url: https://wetten.overheid.nl/BWBR0005233/2021-07-23#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004815
  - number: 1.b
    text: 'betalingstermijn: het tijdvak dat ligt tussen:'
    url: https://wetten.overheid.nl/BWBR0005233/2021-07-23#Artikel1
  - number: 1.b.1°
    text: |-
      het tijdstip waarop ter uitvoering van een krediettransactie door de kredietgever een geldsom ter beschikking wordt
      gesteld onderscheidenlijk met het verschaffen van het genot van een zaak of het verlenen van een dienst een aanvang
      wordt gemaakt en het tijdstip waarop de kredietnemer de eerste betaling moet hebben gedaan, dan wel
    url: https://wetten.overheid.nl/BWBR0005233/2021-07-23#Artikel1
  - number: 1.b.2°
    text: |-
      twee opeenvolgende tijdstippen waarop de kredietnemer ter uitvoering van een krediettransactie een betaling moet
      hebben gedaan;
    url: https://wetten.overheid.nl/BWBR0005233/2021-07-23#Artikel1
  - number: 1.c
    text: |-
      termijnbedrag: het bedrag van een betaling die de kredietnemer aan het einde van een betalingstermijn moet hebben
      gedaan;
    url: https://wetten.overheid.nl/BWBR0005233/2021-07-23#Artikel1
  - number: 1.d
    text: |-
      betalingsregeling: de regeling van de hoogte van de termijnbedragen, alsmede de lengte en, bij niet-doorlopend
      krediet, het aantal van de betalingstermijnen, welke in het kader van een krediettransactie van toepassing is;
    url: https://wetten.overheid.nl/BWBR0005233/2021-07-23#Artikel1
  - number: 1.e
    text: |-
      kredietvergoedingspercentage per betalingstermijn: de kredietvergoeding die over een betalingstermijn in rekening
      wordt gebracht, uitgedrukt in een percentage van het uitstaand saldo aan het begin van die betalingstermijn;
    url: https://wetten.overheid.nl/BWBR0005233/2021-07-23#Artikel1
  - number: 1.f
    text: |-
      vaste kredietvergoeding: kredietvergoeding ten aanzien waarvan bij het aangaan van de krediettransactie is
      overeengekomen dat het kredietvergoedingspercentage per betalingstermijn gedurende de looptijd gelijk blijft;
    url: https://wetten.overheid.nl/BWBR0005233/2021-07-23#Artikel1
  - number: 1.g
    text: |-
      variabele kredietvergoeding: kredietvergoeding ten aanzien waarvan bij het aangaan van de krediettransactie
      is overeengekomen dat het kredietvergoedingspercentage per betalingstermijn gedurende de looptijd kan worden
      gewijzigd;
    url: https://wetten.overheid.nl/BWBR0005233/2021-07-23#Artikel1
  - number: 1.h
    text: |-
      kredietvergoeding bij regelmatige afwikkeling: de in [artikel 34, onder a, van de wet][ref1] bedoelde vorm van
      kredietvergoeding;


      [ref1]: https://wetten.overheid.nl/BWBR0004815#Artikel34
    url: https://wetten.overheid.nl/BWBR0005233/2021-07-23#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004815
        artikel: '34'
  - number: 1.i
    text: |-
      vertragingsvergoeding: de in [artikel 34, onder b, van de wet][ref1] bedoelde vorm van kredietvergoeding.


      [ref1]: https://wetten.overheid.nl/BWBR0004815#Artikel34
    url: https://wetten.overheid.nl/BWBR0005233/2021-07-23#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004815
        artikel: '34'
  - number: '2'
    text: |-
      Voor de toepassing van dit besluit wordt een bij een krediettransactie in maanden, kwartalen of jaren uitgedrukte
      betalingstermijn beschouwd als een gedurende de looptijd gelijk blijvende betalingstermijn, indien dit in een tot
      de krediettransactie behorende overeenkomst uitdrukkelijk is overeengekomen.
    url: https://wetten.overheid.nl/BWBR0005233/2021-07-23#Artikel2
  - number: '3'
    text: |-
      Kredietvergoeding over een bepaald tijdvak mag niet eerder in rekening worden gebracht dan nadat de laatste dag van
      dat tijdvak is verstreken.
    url: https://wetten.overheid.nl/BWBR0005233/2021-07-23#Artikel3
  - number: '4'
    text: |-
      Voor de berekening van de ten hoogste toegelaten kredietvergoeding bij regelmatige afwikkeling geldt de wettelijke
      rente verhoogd met 8 procentpunten als het ten hoogste toegelaten effectieve kredietvergoedingspercentage op
      jaarbasis.
    url: https://wetten.overheid.nl/BWBR0005233/2021-07-23#Artikel4
  - number: '6.1'
    text: |-
      De ten hoogste toegelaten kredietvergoeding per betalingstermijn bij regelmatige afwikkeling van doorlopende
      krediettransacties met een variabele kredietvergoeding, waarbij:
    url: https://wetten.overheid.nl/BWBR0005233/2021-07-23#Artikel6
  - number: 6.1.a
    text: de betalingstermijn gedurende de looptijd gelijk blijft, of
    url: https://wetten.overheid.nl/BWBR0005233/2021-07-23#Artikel6
  - number: 6.1.b
    text: |-
      de eerste of de laatste betalingstermijn dan wel die beide betalingstermijnen afwijkt respectievelijk afwijken van
      de overige betalingstermijnen, die gedurende de looptijd gelijk blijven, wordt, onverminderd het bepaalde in het
      tweede en derde lid, berekend als volgt:
    url: https://wetten.overheid.nl/BWBR0005233/2021-07-23#Artikel6
  - number: '6.2'
    text: |-
      Indien bij een krediettransactie als bedoeld in het eerste lid een betaling of het opnemen van een geldsom door de
      kredietnemer dan wel het verschaffen van het genot van een zaak of het verlenen van een dienst aan de kredietnemer,
      plaatsvinden op een ander tijdstip dan waarop ingevolge de betalingsregeling uiterlijk een termijnbedrag dient te
      worden voldaan, wordt de ten hoogste toegelaten kredietvergoeding ter zake van de betalingstermijn waarbinnen deze
      gebeurtenissen plaatsvinden, op dagbasis berekend, waarbij de ten hoogste toegelaten kredietvergoeding per dag
      wordt berekend op de in [artikel 10][ref1] aangegeven wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0005233#Artikel10
    url: https://wetten.overheid.nl/BWBR0005233/2021-07-23#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005233
        artikel: '10'
        hoofdstuk: II
        afdeling: '2'
  - number: '6.3'
    text: |-
      In het geval, bedoeld in het eerste lid, onder *b*, wordt de ten hoogste toegelaten kredietvergoeding ter zake van
      de afwijkende betalingstermijnen op dagbasis berekend, waarbij de ten hoogste toegelaten kredietvergoeding per dag
      wordt berekend op de in [artikel 10][ref1] aangegeven wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0005233#Artikel10
    url: https://wetten.overheid.nl/BWBR0005233/2021-07-23#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005233
        artikel: '10'
        hoofdstuk: II
        afdeling: '2'
  - number: '7.1'
    text: |-
      De ten hoogste toegelaten totale kredietvergoeding bij regelmatige afwikkeling van niet-doorlopende
      krediettransacties met een vaste kredietvergoeding, waarbij:
    url: https://wetten.overheid.nl/BWBR0005233/2021-07-23#Artikel7
  - number: 7.1.a
    text: de betalingstermijn en het termijnbedrag gedurende de looptijd gelijk blijven, of
    url: https://wetten.overheid.nl/BWBR0005233/2021-07-23#Artikel7
  - number: 7.1.b
    text: |-
      de betalingstermijn gedurende de looptijd gelijk blijft en het eerste of het laatste termijnbedrag afwijkt van
      de overige termijnbedragen, die gedurende de looptijd gelijk blijven, voor zover deze afwijking een gevolg is van
      afrondingen, wordt berekend als volgt:
    url: https://wetten.overheid.nl/BWBR0005233/2021-07-23#Artikel7
  - number: '7.2'
    text: |-
      De ten hoogste toegelaten totale kredietvergoeding bij regelmatige afwikkeling van niet-doorlopende
      krediettransacties met een vaste kredietvergoeding, waarbij de eerste betalingstermijn afwijkt van de overige
      betalingstermijnen, voor zover deze afwijking tot gevolg heeft dat het eerste of het laatste termijnbedrag afwijkt
      van de overige termijnbedragen, terwijl die overige betalingstermijnen en termijnbedragen gedurende de looptijd
      gelijk blijven, wordt berekend als de som van:
    url: https://wetten.overheid.nl/BWBR0005233/2021-07-23#Artikel7
  - number: 7.2.a
    text: |-
      de ten hoogste toegelaten totale kredietvergoeding, berekend op de in het eerste lid aangegeven wijze, met dien
      verstande dat voor de omschrijving van "n" wordt gelezen: het totale aantal gelijk blijvende betalingstermijnen, en
    url: https://wetten.overheid.nl/BWBR0005233/2021-07-23#Artikel7
  - number: 7.2.b
    text: |-
      de ter zake van de afwijkende betalingstermijn op dagbasis berekende ten hoogste toegelaten kredietvergoeding,
      berekend op de in [artikel 10][ref1] aangegeven wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0005233#Artikel10
    url: https://wetten.overheid.nl/BWBR0005233/2021-07-23#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005233
        artikel: '10'
        hoofdstuk: II
        afdeling: '2'
  - number: '8.1'
    text: |-
      De ten hoogste toegelaten kredietvergoeding per betalingstermijn bij regelmatige afwikkeling van andere dan de
      in het tweede lid alsmede de [artikelen 6][ref1] en [7][ref2] bedoelde krediettransacties wordt berekend als
      volgt: 'KVt= Rt . imt, waarbij: . In deze formules is: KVt: de ten hoogste toegelaten kredietvergoeding over de'
      betalingstermijn met volgnummer t; Rt: het uitstaand saldo aan het begin van de betalingstermijn met volgnummer t
      dan wel,


      [ref1]: https://wetten.overheid.nl/BWBR0005233#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005233#Artikel7
    url: https://wetten.overheid.nl/BWBR0005233/2021-07-23#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0005233
        artikel: '6'
        hoofdstuk: II
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005233
        artikel: '7'
        hoofdstuk: II
        afdeling: '2'
  - number: 8.1.1°
    text: |-
      indien bij een doorlopende krediettransactie het uitstaand saldo als gevolg van achterstallige betalingen hoger is
      dan de kredietlimiet: de kredietlimiet;
    url: https://wetten.overheid.nl/BWBR0005233/2021-07-23#Artikel8
  - number: 8.1.2°
    text: |-
      indien bij een niet-doorlopende krediettransactie de kredietnemer achterstallig is: het uitstaand saldo dat zou
      bestaan indien de kredietnemer niet achterstallig zou zijn;
    url: https://wetten.overheid.nl/BWBR0005233/2021-07-23#Artikel8
  - number: '8.2'
    text: |-
      De ten hoogste toegelaten kredietvergoeding bij regelmatige afwikkeling van doorlopende krediettransacties waarvoor
      geen betalingsregeling van toepassing is wordt berekend op dagbasis. Daarbij wordt de ten hoogste toegelaten
      kredietvergoeding per dag berekend op de in [artikel 10][ref1] aangegeven wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0005233#Artikel10
    url: https://wetten.overheid.nl/BWBR0005233/2021-07-23#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0005233
        artikel: '10'
        hoofdstuk: II
        afdeling: '2'
  - number: '9.1'
    text: |-
      Indien op een tijdstip na het aangaan van de krediettransactie de betalingsregeling bij nadere overeenkomst
      wordt gewijzigd, wordt de kredietvergoeding bij regelmatige afwikkeling over de laatste betalingstermijn voor
      dat tijdstip respectievelijk over de eerste betalingstermijn na dat tijdstip op dagbasis berekend, indien die
      betalingstermijn afwijkt van de overige betalingstermijnen voor respectievelijk na dat tijdstip. Daarbij wordt de
      ten hoogste toegelaten kredietvergoeding per dag berekend op de in [artikel 10][ref1] aangegeven wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0005233#Artikel10
    url: https://wetten.overheid.nl/BWBR0005233/2021-07-23#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005233
        artikel: '10'
        hoofdstuk: II
        afdeling: '2'
  - number: '9.2'
    text: |-
      Indien de betalingsregeling na de wijziging voldoet aan de omschrijving van
      [artikel 7, eerste lid, aanhef en onder ][ref1], wordt de ten hoogste toegelaten kredietvergoeding
      per betalingstermijn bij regelmatige afwikkeling na dat tijdstip niettemin berekend op de in
      [artikel 8, eerste lid][ref2], aangegeven wijze. De aldus berekende ten hoogste toegelaten kredietvergoeding treedt
      in de plaats van de ten hoogste toegelaten kredietvergoeding die nog in rekening zou kunnen worden gebracht indien
      de betalingsregeling niet zou zijn gewijzigd.


      [ref1]: https://wetten.overheid.nl/BWBR0005233#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005233#Artikel8
    url: https://wetten.overheid.nl/BWBR0005233/2021-07-23#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005233
        artikel: '7'
        hoofdstuk: II
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005233
        artikel: '8'
        hoofdstuk: II
        afdeling: '2'
  - number: '10'
    text: |-
      De ten hoogste toegelaten kredietvergoeding per dag bij regelmatige afwikkeling wordt berekend als volgt: . In deze
      formule is: KVd: de ten hoogste toegelaten kredietvergoeding over dag d; Rd: het uitstaand saldo aan het begin van
      dag d, dan wel:
    url: https://wetten.overheid.nl/BWBR0005233/2021-07-23#Artikel10
  - number: 10.1°
    text: |-
      indien het gaat om de toepassing van [artikel 6, tweede lid][ref1], of [artikel 8, eerste lid][ref2], en het
      uitstaand saldo als gevolg van achterstallige betalingen hoger is dan de kredietlimiet: de kredietlimiet;


      [ref1]: https://wetten.overheid.nl/BWBR0005233#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005233#Artikel8
    url: https://wetten.overheid.nl/BWBR0005233/2021-07-23#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0005233
        artikel: '6'
        hoofdstuk: II
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005233
        artikel: '8'
        hoofdstuk: II
        afdeling: '2'
  - number: 10.2°
    text: |-
      indien het gaat om de toepassing van [artikel 7, tweede lid, onder b][ref1], en de kredietnemer achterstallig is:
      het uitstaand saldo dat aan het begin van dag d zou bestaan als de kredietnemer niet achterstallig zou zijn;


      [ref1]: https://wetten.overheid.nl/BWBR0005233#Artikel7
    url: https://wetten.overheid.nl/BWBR0005233/2021-07-23#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0005233
        artikel: '7'
        hoofdstuk: II
        afdeling: '2'
  - number: '11'
    text: |-
      De ten hoogste toegelaten vertragingsvergoeding wordt op dagbasis berekend. De ten hoogste toegelaten
      vertragingsvergoeding per dag wordt berekend als volgt: . In deze formule is: VVd: de ten hoogste toegelaten
      vertragingsvergoeding over dag d; Ad: het bedrag in de betaling waarvan de kredietnemer aan het begin van
      dag d achterstallig is dan wel, indien het een krediettransactie als bedoeld in [artikel 6][ref1] betreft,
      het deel van het uitstaand saldo dat op dag d de kredietlimiet te boven gaat als gevolg van achterstallige
      betalingen; r: het honderdste deel van het in het kader van de krediettransactie overeengekomen effectieve
      kredietvergoedingspercentage op jaarbasis; q: het aantal dagen van de maand waarvan dag d deel uitmaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0005233#Artikel6
    url: https://wetten.overheid.nl/BWBR0005233/2021-07-23#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0005233
        artikel: '6'
        hoofdstuk: II
        afdeling: '2'
  - number: '15'
    text: |-
      Op krediettransacties, aangegaan voor 10 augustus 2020, blijven, ten aanzien van geldsommen of diensten die voor
      die datum ter beschikking zijn gesteld, zijn opgenomen of verschaft of ten aanzien van genot van zaken dat voor die
      datum is verschaft, de [artikelen 4][ref1] en [16a][ref2] van het Besluit kredietvergoeding, zoals die artikelen
      luidden voor 10 augustus 2020, van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005233#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005233#Artikel16a
    url: https://wetten.overheid.nl/BWBR0005233/2021-07-23#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005233
        artikel: '4'
        hoofdstuk: II
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005233
        artikel: 16a
        hoofdstuk: V
  - number: '16'
    text: |-
      Indien gedurende de looptijd van een krediettransactie de wettelijke rente wijzigt, is ten aanzien van de
      berekening van de ten hoogste toegelaten kredietvergoeding bij regelmatige afwikkeling het ten hoogste toegelaten
      effectieve kredietvergoedingspercentage op jaarbasis van toepassing dat gold op het tijdstip waarop:
    url: https://wetten.overheid.nl/BWBR0005233/2021-07-23#Artikel16
  - number: 16.a
    text: de krediettransactie is aangegaan, indien het betreft vaste kredietvergoeding;
    url: https://wetten.overheid.nl/BWBR0005233/2021-07-23#Artikel16
  - number: 16.b
    text: de hoogte van de kredietvergoeding laatstelijk is gewijzigd, indien het betreft variabele kredietvergoeding.
    url: https://wetten.overheid.nl/BWBR0005233/2021-07-23#Artikel16
  - number: 16a.1
    text: |-
      De [artikelen 4 tot en met 10][ref1] en [15][ref2] zijn niet van toepassing wanneer het jaarlijks kostenpercentage,
      bedoeld in [artikel 1 van het Besluit Gedragstoezicht financiële ondernemingen Wft][ref3] ten hoogste de
      wettelijke rente verhoogd met 8 procentpunten bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0005233#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005233#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0020421#Artikel1
    url: https://wetten.overheid.nl/BWBR0005233/2021-07-23#Artikel16a
    references:
      - id: ref1
        bwb_id: BWBR0005233
        artikel: '4'
        hoofdstuk: II
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005233
        artikel: '15'
        hoofdstuk: V
      - id: ref3
        bwb_id: BWBR0020421
        artikel: '1'
  - number: 16a.2
    text: |-
      Indien het eerste lid van toepassing is, wordt in [artikel 16][ref1] in plaats van «effectieve
      kredietvergoedingspercentage op jaarbasis» gelezen: jaarlijks kostenpercentage.


      [ref1]: https://wetten.overheid.nl/BWBR0005233#Artikel16
    url: https://wetten.overheid.nl/BWBR0005233/2021-07-23#Artikel16a
    references:
      - id: ref1
        bwb_id: BWBR0005233
        artikel: '16'
        hoofdstuk: V
  - number: '17'
    text: Dit besluit treedt in werking op het tijdstip waarop de wet in werking treedt.
    url: https://wetten.overheid.nl/BWBR0005233/2021-07-23#Artikel17
  - number: '18'
    text: 'Dit besluit kan worden aangehaald als: Besluit kredietvergoeding.'
    url: https://wetten.overheid.nl/BWBR0005233/2021-07-23#Artikel18
