  - number: '71.1'
    text: |-
      Het tot aanstelling bevoegd gezag verricht zijn taak met betrekking tot begeleiding van verzuim en de
      arbeidsgezondheidskundige begeleiding op grond van de [Arbeidsomstandighedenwet][ref1] en de bepalingen in dit
      hoofdstuk.


      [ref1]: https://wetten.overheid.nl/BWBR0010346
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0010346
  - number: '71.2'
    text: |-
      Het tot aanstelling bevoegd gezag kan regels vaststellen met betrekking tot de wijze waarop invulling wordt gegeven
      aan de begeleiding van verzuim, de arbeidsgezondheidskundige begeleiding en de daarbij in acht te nemen procedures.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel71
  - number: '71.3'
    text: |-
      De ambtenaar is in geval van ongeschiktheid tot het verrichten van zijn arbeid wegens ziekte verplicht dit zo
      spoedig mogelijk, doch in elk geval niet later dan op de tweede dag van die ongeschiktheid, te melden.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel71
  - number: '71.4'
    text: |-
      Het tot aanstelling bevoegd gezag kan ten aanzien van de ambtenaar die korter dan een jaar volledig ongeschikt
      is geweest zijn arbeid te verrichten bepalen dat hij zijn arbeid slechts mag hervatten, nadat het tot aanstelling
      bevoegd gezag hiervoor toestemming heeft verleend.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel71
  - number: '71.5'
    text: |-
      De ambtenaar die wegens ziekte gedurende een jaar of langer volledig ongeschikt is geweest zijn arbeid te
      verrichten mag zijn arbeid slechts hervatten, nadat het tot aanstelling bevoegd gezag hiervoor toestemming heeft
      verleend.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel71
  - number: '71.6'
    text: |-
      Het tot aanstelling bevoegd gezag verleent de toestemming, bedoeld in het vierde en vijfde lid, eerst nadat er een
      medisch advies is van de deskundige persoon of de arbodienst.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel71
  - number: 71a.1
    text: 'De ambtenaar kan worden verplicht om een arbeidsgezondheidskundig onderzoek te ondergaan:'
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel71a
  - number: 71a.1.a)
    text: |-
      voor zover dit noodzakelijk is om te beoordelen of de ambtenaar van 55 jaar en ouder in staat is nachtarbeid te
      verrichten;
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel71a
  - number: 71a.1.b)
    text: |-
      indien het tot aanstelling bevoegd gezag gegronde redenen heeft om te twijfelen aan de goede gezondheidstoestand
      van de ambtenaar;
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel71a
  - number: 71a.1.c)
    text: indien de ambtenaar niet meer volledig geschikt is gebleken voor het verrichten van zijn arbeid;
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel71a
  - number: 71a.1.d)
    text: |-
      ter beantwoording van de vraag of de ambtenaar tijdens het tijdvak waarin hij wegens ziekte ongeschikt is om zijn
      arbeid te verrichten, in het belang van zijn genezing arbeid mag verrichten en om vast te stellen welke arbeid
      wenselijk wordt geacht;
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel71a
  - number: 71a.1.e)
    text: |-
      indien de ambtenaar in contact staat of kort geleden heeft gestaan met een persoon die een ziekte heeft waarvoor
      ingevolge de [Wet publieke gezondheid][ref1], een nominatieve aangifteplicht geldt;


      [ref1]: https://wetten.overheid.nl/BWBR0024705
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel71a
    references:
      - id: ref1
        bwb_id: BWBR0024705
  - number: 71a.1.f)
    text: |-
      om te beoordelen of er sprake is van een situatie als bedoeld in [artikel 129, zesde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003229#Artikel129
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel71a
    references:
      - id: ref1
        bwb_id: BWBR0003229
        artikel: '129'
        hoofdstuk: IX
  - number: 71a.1.g)
    text: |-
      om te beoordelen of de ambtenaar die wegens ziekte volledig ongeschikt is geweest zijn arbeid te verrichten zijn
      arbeid mag hervatten;
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel71a
  - number: 71a.1.h)
    text: voorzover dit voortvloeit uit enige wettelijke verplichting;
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel71a
  - number: 71a.1.i)
    text: |-
      indien hij in verband met de uitoefening van zijn werkzaamheden aan bijzonder gevaar voor zijn gezondheid
      blootstaat of hij is benoemd in een functie waarvoor bij aanstelling een geneeskundig onderzoek is vereist als
      bedoeld in [artikel 7, vierde lid, onderdeel b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003229#Artikel7
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel71a
    references:
      - id: ref1
        bwb_id: BWBR0003229
        artikel: '7'
        hoofdstuk: II
        paragraaf: '2'
  - number: 71a.2
    text: |-
      Het tot aanstelling bevoegd gezag stelt de ambtenaar buiten dienst indien na een arbeidsgezondheidskundig onderzoek
      als bedoeld in het eerste lid, blijkt dat sprake is van een zodanige lichamelijke of geestelijke toestand dat de
      belangen van de ambtenaar, van de dienst of van bij het verrichten van de arbeid betrokken derden zich er tegen
      verzetten dat de ambtenaar zijn arbeid blijft verrichten. De ambtenaar wordt niet buiten dienst gesteld indien hem
      andere passende werkzaamheden kunnen worden opgedragen. Indien de ambtenaar buiten dienst wordt gesteld, wordt hij
      geacht wegens ziekte ongeschikt te zijn tot het verrichten van zijn arbeid, in welk geval de overige bepalingen van
      dit hoofdstuk van toepassing zijn.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel71a
  - number: 71b.1
    text: |-
      In geval van een geschil over het wel of niet bestaan van ongeschiktheid tot werken wegens ziekte voorziet
      [artikel 32, eerste lid, van de Wet SUWI][ref1] in het instellen van een onderzoek en het geven van een oordeel.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel32
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel71b
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '32'
  - number: 71b.2
    text: |-
      Het medisch advies dat door de deskundige persoon of de arbodienst wordt uitgebracht naar aanleiding van
      een arbeidsgezondheidskundig onderzoek als bedoeld in [artikel 18 van de Arbeidsomstandighedenwet][ref1] en
      [artikel 71a][ref2], wordt zo spoedig mogelijk aan de ambtenaar en het tot aanstelling bevoegde gezag medegedeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0003229#Artikel71a
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel71b
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '18'
      - id: ref2
        bwb_id: BWBR0003229
        artikel: 71a
        hoofdstuk: VI
        paragraaf: '2'
  - number: 71b.3
    text: |-
      De ambtenaar of de gewezen ambtenaar kan de deskundige persoon of de arbodienst binnen drie dagen na ontvangst van
      het medisch advies, schriftelijk een hernieuwd onderzoek vragen indien hij het niet eens is met het medisch advies.
      De deskundige persoon of de arbodienst stelt het tot aanstelling bevoegde gezag in kennis van een ingediend verzoek
      om een hernieuwd onderzoek.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel71b
  - number: 71b.4
    text: |-
      Zo spoedig mogelijk na ontvangst van het schriftelijk verzoek om een hernieuwd onderzoek, doch uiterlijk binnen
      vier weken, vindt het hernieuwd onderzoek door een commissie van drie geneeskundigen plaats.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel71b
  - number: 71b.5
    text: |-
      Op verzoek van de ambtenaar of de gewezen ambtenaar wordt zijn behandelend arts in de gelegenheid gesteld mondeling
      of schriftelijk zijn mening aan de commissie van drie geneeskundigen kenbaar te maken.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel71b
  - number: 71c.1
    text: |-
      De leden van de commissie bedoeld in [artikel 71b, vierde en vijfde lid][ref1], worden per verzoek om een hernieuwd
      onderzoek aangewezen door het tot aanstelling bevoegde gezag. De geneeskundige die het medisch advies heeft
      uitgebracht waarvan herziening wordt gevraagd, heeft in de commissie geen zitting.


      [ref1]: https://wetten.overheid.nl/BWBR0003229#Artikel71b
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel71c
    references:
      - id: ref1
        bwb_id: BWBR0003229
        artikel: 71b
        hoofdstuk: VI
        paragraaf: '2'
  - number: 71c.2
    text: 'De commissie deelt haar oordeel schriftelijk mee aan:'
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel71c
  - number: 71c.2.a)
    text: de ambtenaar of de gewezen ambtenaar;
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel71c
  - number: 71c.2.b)
    text: het tot aanstelling bevoegde gezag;
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel71c
  - number: 71c.2.c)
    text: |-
      de behandelend arts, bedoeld in [artikel 71b, vijfde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003229#Artikel71b
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel71c
    references:
      - id: ref1
        bwb_id: BWBR0003229
        artikel: 71b
        hoofdstuk: VI
        paragraaf: '2'
  - number: 71d
    text: |-
      De kosten, verbonden aan het onderzoek, bedoeld in [artikel 71b, eerste lid][ref1], respectievelijk het hernieuwd
      onderzoek, bedoeld in het [artikel 71b, derde lid][ref2], komen voor rekening van het tot aanstelling bevoegde
      gezag. Eventuele reis- en verblijfkosten van de ambtenaar worden hem vergoed volgens de geldende regels ter zake
      van dienstreizen.


      [ref1]: https://wetten.overheid.nl/BWBR0003229#Artikel71b
      [ref2]: https://wetten.overheid.nl/BWBR0003229#Artikel71b
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel71d
    references:
      - id: ref1
        bwb_id: BWBR0003229
        artikel: 71b
        hoofdstuk: VI
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0003229
        artikel: 71b
        hoofdstuk: VI
        paragraaf: '2'
  - number: '72.1'
    text: |-
      De ambtenaar heeft bij ongeschiktheid tot het verrichten van zijn arbeid wegens ziekte gedurende een tijdvak van
      52 weken recht op doorbetaling van zijn bezoldiging. Bij voortdurende ongeschiktheid heeft hij vervolgens recht op
      doorbetaling van 70% van zijn bezoldiging.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel72
  - number: '72.2'
    text: |-
      Het tijdvak van 52 weken, bedoeld in het eerste lid, vangt aan op de eerste dag waarop wegens ziekte geheel
      of gedeeltelijk niet is of zou zijn gewerkt, of het werken wegens ziekte geheel of gedeeltelijk is of zou zijn
      gestaakt. Indien de ambtenaar buitengewoon verlof zonder behoud van bezoldiging geniet, vangt het tijdvak aan op de
      dag volgend op die waarop het buitengewoon verlof is beëindigd.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel72
  - number: '72.3'
    text: |-
      Voor de toepassing van het eerste lid worden perioden van ongeschiktheid samengeteld indien zij
      elkaar met een onderbreking van minder dan vier weken opvolgen of indien zij direct voorafgaan aan
      en aansluiten op een periode waarin zwangerschaps- of bevallingsverlof wordt genoten overeenkomstig
      [artikel 3:1, tweede en derde lid, van de Wet arbeid en zorg][ref1], tenzij de ongeschiktheid redelijkerwijs niet
      geacht kan worden voort te vloeien uit dezelfde oorzaak.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '3'
  - number: '72.4'
    text: |-
      In afwijking van het eerste lid, heeft de ambtenaar ook na afloop van het tijdvak van 52 weken, bedoeld in het
      eerste lid, recht op doorbetaling van zijn bezoldiging indien de ongeschiktheid om zijn arbeid te verrichten wordt
      veroorzaakt door een beroepsincident.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel72
  - number: '72.5'
    text: |-
      In afwijking van het eerste lid, heeft de ambtenaar ook na afloop van het tijdvak van 52 weken, bedoeld in het
      eerste lid, recht op doorbetaling van zijn bezoldiging over het aantal uren dat hij passende arbeid heeft verricht
      of zou hebben verricht indien die arbeid hem zou zijn aangeboden.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel72
  - number: '72.6'
    text: 'De doorbetaling van de bezoldiging eindigt:'
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel72
  - number: 72.6.a
    text: |-
      met ingang van de dag waarop de ambtenaar op grond van artikel [72a, eerste lid][ref1], is herplaatst;


      [ref1]: https://wetten.overheid.nl/BWBR0003229#Artikel72a
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0003229
        artikel: 72a
        hoofdstuk: VI
        paragraaf: '3'
  - number: 72.6.b
    text: met ingang van de dag waarop de ambtenaar ontslag is verleend;
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel72
  - number: 72.6.c
    text: met ingang van de dag waarop de ambtenaar de leeftijd van 65 jaar heeft bereikt; of
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel72
  - number: 72.6.d
    text: met ingang van de dag volgende op die waarop de ambtenaar is overleden.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel72
  - number: 72a.1
    text: |-
      De ambtenaar die ongeschikt is tot het verrichten van zijn arbeid wegens ziekte is verplicht een andere functie te
      aanvaarden indien sprake is van passende arbeid.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel72a
  - number: 72a.2
    text: |-
      De ambtenaar die door het UWV in het kader van de [WIA][ref1] minder dan 35% arbeidsongeschikt is verklaard, wordt
      herplaatst in een functie die passende arbeid omvat, tenzij een zwaarwegend dienstbelang zich daartegen verzet.


      [ref1]: https://wetten.overheid.nl/BWBR0019057
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel72a
    references:
      - id: ref1
        bwb_id: BWBR0019057
  - number: 72a.3
    text: |-
      De ambtenaar die op grond van het eerste lid is herplaatst voordat de termijn van twee jaar, bedoeld in
      [artikel 129, derde lid, onderdeel a][ref1], is verstreken, heeft tot het eind van genoemde termijn rechtop een
      aanvullende uitkering ter grootte van het verschil tussen:


      [ref1]: https://wetten.overheid.nl/BWBR0003229#Artikel129
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel72a
    references:
      - id: ref1
        bwb_id: BWBR0003229
        artikel: '129'
        hoofdstuk: IX
  - number: 72a.3.a
    text: |-
      het bedrag waarop de ambtenaar op grond van [artikel 72][ref1] recht zou hebben gehad indien hem geen andere
      betrekking zou zijn opgedragen, vermeerderd met de vakantie-uitkering en de eindejaarsuitkering; en


      [ref1]: https://wetten.overheid.nl/BWBR0003229#Artikel72
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel72a
    references:
      - id: ref1
        bwb_id: BWBR0003229
        artikel: '72'
        hoofdstuk: VI
        paragraaf: '3'
  - number: 72a.3.b
    text: zijn bezoldiging na herplaatsing, vermeerderd met de vakantie-uitkering en de eindejaarsuitkering.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel72a
  - number: 72a.4
    text: |-
      Indien de ziekte uit hoofde waarvan de ambtenaar ongeschikt is zijn arbeid te verrichten, wordt veroorzaakt door
      een beroepsincident, heeft de ambtenaar, bedoeld in het tweede lid, van wie de arbeidsongeschiktheid ten minste 35%
      bedraagt, nadat de termijn van twee jaar is verstreken tevens recht op een aanvullende uitkering ter grootte van
      het verschil tussen:
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel72a
  - number: 72a.4.a
    text: |-
      een percentage van zijn bezoldiging vermeerderd met de vakantie-uitkering en de eindejaarsuitkering, zoals die zou
      zijn op de dag voor zijn herplaatsing indien de ambtenaar op die dag niet ongeschikt zou zijn geweest tot werken;
      en
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel72a
  - number: 72a.4.b
    text: |-
      zijn bezoldiging na herplaatsing vermeerderd met de vakantie-uitkering, de eindejaarsuitkering en een uit de
      oorspronkelijke functie voortvloeiend recht op een WIA-uitkering en een AAOP-uitkering.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel72a
  - number: 72a.5
    text: |-
      Het percentage, bedoeld in het derde lid, onderdeel a, is afhankelijk van de mate van arbeidsongeschiktheid en
      bedraagt bij een arbeidsongeschiktheid van:






                    80% of meer:


                    90,02%;




                    65 tot 80%:


                    65,26%;




                    55 tot 65%:


                    54,01%;




                    45 tot 55%:


                    45,01%;




                    35 tot 45%:


                    36,01%;
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel72a
  - number: 72a.6
    text: 'De aanvullende uitkeringen, bedoeld in het tweede en derde lid, eindigen in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel72a
  - number: 72a.6.a
    text: met ingang van de dag waarop de ambtenaar ontslag is verleend;
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel72a
  - number: 72a.6.b
    text: met ingang van de dag waarop de ambtenaar de leeftijd van 65 jaar heeft bereikt; of
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel72a
  - number: 72a.6.c
    text: met ingang van de dag volgende op die waarop de ambtenaar is overleden.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel72a
  - number: 72b.1
    text: |-
      De ambtenaar, bedoeld in [artikel 37a, tweede lid][ref1], die voor 1 januari 2011 is herplaatst, ontvangt bij
      voortdurende arbeidsongeschiktheid gedurende hoogstens vijf jaar een uitkering van 70% van het verschil tussen:


      [ref1]: https://wetten.overheid.nl/BWBR0003229#Artikel72a
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel72b
    references:
      - id: ref1
        bwb_id: BWBR0003229
        artikel: 72a
        hoofdstuk: VI
        paragraaf: '3'
  - number: 72b.1.a
    text: |-
      zijn bezoldiging, vermeerderd met de vakantie-uitkering en de eindejaarsuitkering zoals die zou zijn geweest op de
      dag voor zijn herplaatsing indien de ambtenaar op die dag niet ongeschikt zou zijn geweest tot werken, en
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel72b
  - number: 72b.1.b
    text: |-
      zijn bezoldiging na herplaatsing verminderd met eventuele daarna volgende verhogingen op grond van
      [artikel 7 van het Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref1], en vermeerderd met de vakantie-
      uitkering en de eindejaarsuitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0003630#Artikel7
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel72b
    references:
      - id: ref1
        bwb_id: BWBR0003630
        artikel: '7'
  - number: 72b.2
    text: |-
      In afwijking van het eerste lid heeft de ambtenaar die arbeidsongeschikt is geworden ten gevolge van een
      beroepsincident, ook nadat de termijn van vijf jaar is verstreken recht op een uitkering.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel72b
  - number: 72b.3
    text: 'De uitkering eindigt in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel72b
  - number: 72b.3.a
    text: met ingang van de dag waarop de ambtenaar ontslag is verleend;
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel72b
  - number: 72b.3.b
    text: met ingang van de dag volgend op die waarop de ambtenaar is overleden.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel72b
  - number: 72b.4
    text: |-
      Bij eventuele samenloop van een recht op uitkering op grond van dit artikel en een recht op uitkering op grond van
      [artikel 37a, derde of vierde lid][ref1], vervalt het laatstbedoelde recht.


      [ref1]: https://wetten.overheid.nl/BWBR0003229#Artikel72a
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel72b
    references:
      - id: ref1
        bwb_id: BWBR0003229
        artikel: 72a
        hoofdstuk: VI
        paragraaf: '3'
  - number: '73.1'
    text: |-
      De gewezen ambtenaar die wegens ziekte, ontstaan voor het tijdstip van ingang van zijn ontslag, na zijn ontslag
      anders dan op grond van [artikel 129, eerste lid, onderdeel f][ref1], nog ongeschikt is een naar aard en omvang
      soortgelijke functie te vervullen, heeft:


      [ref1]: https://wetten.overheid.nl/BWBR0003229#Artikel129
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0003229
        artikel: '129'
        hoofdstuk: IX
  - number: 73.1.a
    text: |-
      zolang hij ongeschikt tot werken is wegens ziekte, maar niet langer dan een tijdvak van 52 weken, recht
      op doorbetaling van zijn laatstelijk genoten bezoldiging vermeerderd met de vakantie-uitkering en de
      eindejaarsuitkering;
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel73
  - number: 73.1.b
    text: |-
      zolang hij na afloop van het tijdvak, bedoeld in onderdeel a, nog ongeschikt is tot het verrichten van arbeid
      wegens ziekte, gedurende maximaal 26 weken recht op doorbetaling van 70% van zijn laatstelijk genoten bezoldiging
      vermeerderd met de vakantie-uitkering en de eindejaarsuitkering.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel73
  - number: '73.2'
    text: |-
      De gewezen ambtenaar die binnen een maand na het tijdstip van zijn ontslag wegens ziekte ongeschikt wordt een
      naar aard en omvang soortgelijke functie te vervullen, heeft, zolang hij ongeschikt is tot werken wegens ziekte,
      gedurende maximaal 52 weken recht op doorbetaling van zijn laatstelijk genoten bezoldiging indien hij gedurende ten
      minste twee maanden onmiddellijk aan het ontslag voorafgaande in dienst is geweest.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel73
  - number: '73.3'
    text: |-
      De gewezen ambtenaren, bedoeld het eerste en tweede lid, hebben gedurende een tijdvak van 104 weken als bedoeld
      in [artikel 23 van de WIA][ref1], recht op doorbetaling van hun laatstelijk genoten bezoldiging vermeerderd met
      de vakantie-uitkering en de eindejaarsuitkering, indien hun arbeidsongeschiktheid wordt veroorzaakt door een
      beroepsincident.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel23
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '23'
  - number: '73.4'
    text: |-
      Het tijdvak gedurende welke de gewezen ambtenaar recht heeft op doorbetaling van zijn laatstelijk genoten
      bezoldiging vangt aan op de eerste dag waarop wegens ziekte geheel of gedeeltelijk niet is of zou zijn gewerkt of
      het werken wegens ziekte geheel of gedeeltelijk is of zou zijn gestaakt. Indien de gewezen ambtenaar onmiddellijk
      voorafgaand aan het ontslag buitengewoon verlof zonder behoud van bezoldiging genoot, vangt het tijdvak, bedoeld in
      het eerste lid, onderdeel a, aan op de dag waarop het ontslag is ingegaan.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel73
  - number: '73.5'
    text: |-
      Voor het bepalen van het einde van het tijdvak van 52 weken, bedoeld in het eerste en tweede lid, worden
      perioden van ongeschiktheid tot werken wegens ziekte samengeteld indien de perioden van ongeschiktheid
      elkaar met een onderbreking van minder dan vier weken opvolgen of indien zij direct voorafgaan aan
      en aansluiten op een periode waarin zwangerschaps- of bevallingsverlof wordt genoten overeenkomstig
      [artikel 3:1, tweede en derde lid, van de Wet arbeid en zorg][ref1] of een uitkering op grond van
      [artikel 3:8][ref2], of [3:10, eerste lid, van die wet][ref3], tenzij de ongeschiktheid redelijkerwijs niet geacht
      kan worden voort te vloeien uit dezelfde oorzaak.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0013008
        artikel: '3'
  - number: '73.6'
    text: |-
      De doorbetaling van de laatstelijk genoten bezoldiging, bedoeld in het eerste, tweede en derde lid, eindigt in
      ieder geval:
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel73
  - number: 73.6.a
    text: met ingang van de dag waarop de gewezen ambtenaar de leeftijd van 65 jaar heeft bereikt; of
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel73
  - number: 73.6.b
    text: met ingang van de dag volgende op die waarop de gewezen ambtenaar is overleden.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel73
  - number: '73.7'
    text: |-
      De gewezen ambtenaar die recht heeft op een WIA-uitkering ter zake van de dienstbetrekking die hij voor zijn
      ontslag vervulde, heeft recht op een aanvullende uitkering indien de arbeidsongeschiktheid is veroorzaakt door
      een beroepsincident.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel73
  - number: '73.8'
    text: 'De aanvullende uitkering, bedoeld in het zevende lid, is gelijk aan het verschil tussen:'
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel73
  - number: 73.8.a
    text: |-
      een percentage van de laatstelijk genoten bezoldiging vermeerderd met de vakantie-uitkering en de
      eindejaarsuitkering, in het jaar voorafgaande aan zijn ontslag; en
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel73
  - number: 73.8.b
    text: |-
      de aan de ambtenaar toegekende WIA-uitkering, in voorkomend geval vermeerderd met een hem toegekende AAOP-
      uitkering.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel73
  - number: '73.9'
    text: |-
      Het percentage, bedoeld in het achtste lid, onderdeel a, is afhankelijk van de mate van arbeidsongeschiktheid en
      bedraagt bij een arbeidsongeschiktheid van:






                    80% of meer:


                    90,02%;




                    65 tot 80%:


                    65,26%;




                    55 tot 65%:


                    54,01%;




                    45 tot 55%:


                    45,01%;




                    35 tot 45%:


                    36,01%;
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel73
  - number: '73.10'
    text: 'De aanvullende uitkering, bedoeld in het zevende lid, eindigt:'
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel73
  - number: 73.10.a
    text: met ingang van de dag waarop de gewezen ambtenaar de leeftijd van 65 jaar heeft bereikt; of
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel73
  - number: 73.10.b
    text: met ingang van de dag volgende op die waarop de gewezen ambtenaar is overleden.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel73
  - number: '73.11'
    text: |-
      De gewezen ambtenaar aan wie eervol ontslag is verleend op grond van [artikel 124a][ref1], heeft slechts recht
      op doorbetaling van zijn laatstelijk genoten bezoldiging of aanvullende uitkering voorzover deze tezamen met de
      aanvullende uitkering, bedoeld in artikel 4 van het FPU-reglement basis- en aanvullende uitkering, de laatstgenoten
      bezoldiging niet overschrijdt.


      [ref1]: https://wetten.overheid.nl/BWBR0003229#Artikel124a
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0003229
        artikel: 124a
        hoofdstuk: IX
  - number: 73a.1
    text: |-
      De ambtenaar die ongeschikt is zijn arbeid te verrichten wegens een dienstongeval of een beroepsziekte doch
      niet door een beroepsincident, wordt op zijn aanvraag voor de toepassing van dit hoofdstuk gelijkgesteld met de
      ambtenaar die ongeschikt is zijn arbeid te verrichten wegens een beroepsincident.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel73a
  - number: 73a.2
    text: |-
      De gewezen ambtenaar van wie de arbeidsongeschiktheid wordt veroorzaakt door een dienstongeval of een beroepsziekte
      doch niet door een beroepsincident, wordt op zijn aanvraag voor de toepassing van dit hoofdstuk gelijkgesteld met
      de gewezen ambtenaar van wie de arbeidsongeschiktheid wordt veroorzaakt door een beroepsincident.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel73a
  - number: '74'
    text: |-
      De [artikelen 72, vierde lid][ref1], [72a, tweede tot en met vijfde lid][ref2], [73][ref3], [73a][ref4] en
      [104, tweede lid][ref5], zijn niet van toepassing op de ambtenaar en de gewezen ambtenaar die geen deelnemer zijn
      in de zin van het Pensioenreglement.


      [ref1]: https://wetten.overheid.nl/BWBR0003229#Artikel72
      [ref2]: https://wetten.overheid.nl/BWBR0003229#Artikel72a
      [ref3]: https://wetten.overheid.nl/BWBR0003229#Artikel73
      [ref4]: https://wetten.overheid.nl/BWBR0003229#Artikel73a
      [ref5]: https://wetten.overheid.nl/BWBR0003229#Artikel104
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0003229
        artikel: '72'
        hoofdstuk: VI
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0003229
        artikel: 72a
        hoofdstuk: VI
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0003229
        artikel: '73'
        hoofdstuk: VI
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0003229
        artikel: 73a
        hoofdstuk: VI
        paragraaf: '3'
      - id: ref5
        bwb_id: BWBR0003229
        artikel: '104'
        hoofdstuk: VIIa
  - number: '75.1'
    text: 'De ambtenaar en de gewezen ambtenaar hebben geen aanspraak op doorbetaling van de bezoldiging:'
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel75
  - number: 75.1.a)
    text: |-
      indien de ziekte is voorgewend, althans zodanig overdreven wordt voorgesteld, dat ongeschiktheid tot het verrichten
      van arbeid wegens ziekte niet kan worden aangenomen;
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel75
  - number: 75.1.b)
    text: |-
      indien de ambtenaar de ongeschiktheid tot het verrichten van zijn arbeid wegens ziekte opzettelijk heeft
      veroorzaakt, tenzij hem daarvan op grond van zijn psychische toestand geen verwijt kan worden gemaakt;
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel75
  - number: 75.1.c)
    text: |-
      indien de ongeschiktheid tot het verrichten van zijn arbeid wegens ziekte zich voordoet binnen een half jaar na het
      geneeskundig onderzoek, bedoeld in [artikel 7, vierde lid, onderdeel b][ref1] en blijkt dat de ambtenaar onjuiste
      informatie omtrent zijn gezondheidstoestand heeft verstrekt of gegevens heeft verzwegen, ten gevolge waarvan de
      verklaring van geschiktheid, de aan de desbetreffende functie verbonden werkzaamheden te verrichten, ten onrechte
      heeft plaatsgevonden, tenzij de ambtenaar aannemelijk maakt dat hij te goeder trouw heeft gehandeld.


      [ref1]: https://wetten.overheid.nl/BWBR0003229#Artikel7
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0003229
        artikel: '7'
        hoofdstuk: II
        paragraaf: '2'
  - number: '75.2'
    text: |-
      De gewezen ambtenaar heeft geen aanspraak op doorbetaling van zijn laatstelijk genoten bezoldiging, indien hij
      op grond van een aanvaarde andere betrekking aanspraak kan maken op betaling van loon of bezoldiging, dan wel
      aanspraak kan maken op een ZW-uitkering.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel75
  - number: 75a.1
    text: |-
      De aanspraken van de ambtenaar en de gewezen ambtenaar op grond van dit hoofdstuk vervallen indien de ambtenaar of
      de gewezen ambtenaar:
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel75a
  - number: 75a.1.a)
    text: niet binnen redelijke termijn gezondheidskundige hulp inroept;
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel75a
  - number: 75a.1.b)
    text: zich niet gedurende het gehele verloop van de ziekte onder gezondheidskundige behandeling blijft stellen;
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel75a
  - number: 75a.1.c)
    text: de voorschriften van de behandelende arts niet opvolgt;
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel75a
  - number: 75a.1.d)
    text: zich schuldig maakt aan gedragingen waardoor zijn genezing wordt belemmerd;
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel75a
  - number: 75a.1.e)
    text: |-
      verzuimt de deskundige persoon of de arbodienst op eerste aanvraag mee te delen om welke reden hij ongeschikt is
      tot werken;
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel75a
  - number: 75a.1.f)
    text: |-
      zonder deugdelijke grond nalaat gevolg te geven aan een verzoek van de deskundige persoon of de arbodienst om te
      verschijnen;
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel75a
  - number: 75a.1.g)
    text: |-
      er de oorzaak van is dat het arbeidsgezondheidskundig onderzoek door een door de deskundige persoon of de
      arbodienst aangewezen arts niet kan plaatshebben;
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel75a
  - number: 75a.1.h)
    text: |-
      niet binnen twee dagen na de aanvang van de ongeschiktheid tot werken wegens ziekte dit heeft gemeld bij zijn
      werkgever;
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel75a
  - number: 75a.1.i)
    text: |-
      weigert aangeboden passende arbeid, waartoe de deskundige persoon of de arbodienst hem in staat acht, te
      verrichten;
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel75a
  - number: 75a.1.j)
    text: |-
      zich niet houdt aan de ten aanzien van hem geldende regels met betrekking tot de wijze waarop invulling wordt
      gegeven aan de verzuimbegeleiding en de arbeidsgezondheidskundige begeleiding en de daarbij in acht te nemen
      procedure;
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel75a
  - number: 75a.1.k)
    text: zijn ongeschiktheid tot werken opzettelijk heeft veroorzaakt;
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel75a
  - number: 75a.1.l)
    text: |-
      weigert inzage te geven in een op hem betrekking hebbend document als bedoeld in
      [artikel 1 van de Wet op de identificatieplicht][ref1] of een geldig rijbewijs als bedoeld in artikel 9, eerste
      lid, van de Wegenverkeerswet, voor zover dit redelijkerwijs nodig is voor de uitvoering van wetten;


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel75a
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: 75a.1.m)
    text: |-
      tijdens de ongeschiktheid tot het verrichten van zijn arbeid wegens ziekte arbeid voor zichzelf of voor derden
      verricht, tenzij dit door de deskundige persoon of de arbodienst in het belang van zijn genezing wenselijk wordt
      geacht;
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel75a
  - number: 75a.1.n)
    text: |-
      vóór de betaling van de bezoldiging weigert mededeling te doen van inkomsten uit arbeid die hij heeft in verband
      met het verrichten van door de deskundige persoon of de arbodienst in het belang van zijn genezing wenselijk
      geachte arbeid voor zichzelf of voor derden;
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel75a
  - number: 75a.1.o)
    text: |-
      niet onverwijld op verzoek of uit eigen beweging alle feiten en omstandigheden meedeelt, waarvan hem redelijkerwijs
      duidelijk moet zijn dat zij van invloed kunnen zijn op het recht of op de hoogte van een aan hem toegekende
      arbeidsongeschiktheidsuitkering;
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel75a
  - number: 75a.1.p)
    text: |-
      zijn arbeid verzuimt te hervatten op het door de deskundige persoon of de arbodienst bepaalde tijdstip en in
      de door deze persoon of dienst bepaalde mate, indien zulks hem is opgedragen, tenzij hij daarvoor een door de
      deskundige persoon of de arbodienst als geldig erkende reden heeft opgegeven;
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel75a
  - number: 75a.1.q)
    text: |-
      zonder deugdelijke grond weigert gevolg te geven aan door het bevoegd gezag of een door het bevoegd gezag
      aangewezen deskundige gegeven redelijke voorschriften of mee te werken aan getroffen maatregelen die erop gericht
      zijn om de betrokkene in staat te stellen passende arbeid te verrichten;
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel75a
  - number: 75a.1.r)
    text: |-
      zonder deugdelijke grond weigert mee te werken aan het opstellen, evalueren of bijstellen van een plan van aanpak,
      bedoeld in [artikel 25, tweede lid, van de WIA][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel25
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel75a
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '25'
  - number: 75a.1.s)
    text: |-
      geen aanspraak heeft op een WIA-uitkering omdat geen aanvraag is ingediend of in verband met de toepassing van
      [artikel 88 van de WIA][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel88
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel75a
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '88'
  - number: 75a.1.t)
    text: zijn medewerking weigert bij de doelmatige uitvoering van de bepalingen van dit hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel75a
  - number: 75a.2
    text: |-
      De aanspraak op de doorbetaling van bezoldiging, kan geheel of gedeeltelijk vervallen worden verklaard in het geval
      de ambtenaar of de gewezen ambtenaar de regels heeft overtreden die ter zake van afwezigheid wegens ziekte zijn
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel75a
  - number: 75a.3
    text: |-
      De ingevolge het eerste lid vervallen aanspraken herleven met ingang van het tijdstip waarop de ambtenaar of de
      gewezen ambtenaar alsnog gevolg geeft aan de betreffende verplichting op grond van dat lid.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel75a
  - number: 75a.4
    text: |-
      Het tot aanstelling bevoegd gezag kan op grond van bijzondere omstandigheden bepalen, dat de aanspraak op de
      doorbetaling van bezoldiging, niet vervalt maar geheel of ten dele aan anderen dan aan de ambtenaar of de gewezen
      ambtenaar zal worden uitbetaald.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel75a
  - number: 75a.5
    text: |-
      Voor zover het tot aanstelling bevoegd gezag van de bevoegdheid, bedoeld in het vierde lid, geen gebruik heeft
      gemaakt, wordt de niet uitbetaalde bezoldiging, alsnog aan de ambtenaar of de gewezen ambtenaar uitbetaald, indien
      het in [artikel 32, eerste lid, van de Wet SUWI][ref1], bedoelde oordeel ten gunste van de ambtenaar of de gewezen
      ambtenaar uitvalt.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel32
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel75a
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '32'
  - number: 75b.1
    text: |-
      Het tot aanstelling bevoegde gezag is verplicht zo tijdig mogelijk zodanige maatregelen te treffen en voorschriften
      te geven als redelijkerwijs nodig is, opdat de ambtenaar die in verband met ongeschiktheid ten gevolge van ziekte
      verhinderd is zijn arbeid te verrichten, in staat wordt gesteld de eigen of andere passende arbeid te verrichten.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel75b
  - number: 75b.2
    text: |-
      De maatregelen en voorschriften, bedoeld in het eerste lid, zijn gericht op duurzame reïntegratie in de eigen
      arbeid of in andere passende arbeid in de sector Rijk waarvan de voor die arbeid geldende salarisschaal niet meer
      dan twee schalen lager is dan de salarisschaal die voor de ambtenaar geldt en waarbij de resterende mogelijkheden
      van de ambtenaar volledig worden benut. Indien na overleg tussen het tot aanstelling bevoegde gezag en de ambtenaar
      vaststaat dat dergelijke arbeid niet voorhanden is, zullen de maatregelen en voorschriften zich richten op duurzame
      reïntegratie in andere passende arbeid, zo mogelijk binnen een van de overheidssectoren.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel75b
  - number: 75b.3
    text: |-
      Zolang duurzame reïntegratie als bedoeld in het tweede lid niet mogelijk is, stelt het tot aanstelling bevoegde
      gezag de ambtenaar in de gelegenheid andere passende arbeid te verrichten.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel75b
  - number: 75b.4
    text: |-
      Uit hoofde van zijn verplichting, bedoeld in het eerste lid, stelt het tot aanstelling bevoegde gezag in
      overeenstemming met de ambtenaar een plan van aanpak op als bedoeld in [artikel 25, tweede lid, van de WIA][ref1].
      Het plan van aanpak wordt met medewerking van de ambtenaar regelmatig geëvalueerd en zo nodig bijgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel25
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel75b
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '25'
  - number: 75b.5
    text: |-
      De ambtenaar die van mening is dat het tot aanstelling bevoegde gezag de in het eerste lid bedoelde verplichtingen
      niet of onvoldoende nakomt, legt bij zijn verzoek tot nakoming aan het tot aanstelling bevoegde gezag een oordeel
      van het UWV als bedoeld in [artikel 32, derde lid, onderdeel b, van de Wet SUWI][ref1] over. Het tot aanstelling
      bevoegde gezag beslist binnen zes weken op het verzoek en deelt daarbij mee tot welke aanpassingen in de
      reïntegratie-inspanningen het verzoek hem aanleiding geeft.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel32
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel75b
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '32'
  - number: '80.1'
    text: |-
      Bij samenloop van een recht krachtens dit hoofdstuk met een ZW-uitkering, WIA-uitkering, AAOP-uitkering, WW-
      uitkering of bovenwettelijke WW-uitkering, dan wel een daarmee vergelijkbare uitkering, op grond van dezelfde
      dienstbetrekking, wordt deze uitkering in mindering gebracht op dit recht, tenzij het een recht op grond van de
      [artikelen 82][ref1] of [83][ref2] betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0003229#Artikel82
      [ref2]: https://wetten.overheid.nl/BWBR0003229#Artikel83
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0003229
        artikel: '82'
        hoofdstuk: VI
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0003229
        artikel: '83'
        hoofdstuk: VI
        paragraaf: '5'
  - number: '80.2'
    text: |-
      Indien als gevolg van handelingen of het nalaten van handelingen door de ambtenaar of de gewezen ambtenaar de ZW-
      uitkering, de WIA-uitkering, de AAOP-uitkering, de WW-uitkering of de bovenwettelijke WW-uitkering een vermindering
      ondergaat, dan wel de aanspraak daarop geheel of gedeeltelijk wordt geweigerd, wordt de ZW-uitkering, de WIA-
      uitkering, de AAOP-uitkering, de WW-uitkering of de bovenwettelijke WW-uitkering voor het vaststellen van de
      vermindering, bedoeld in het eerste lid, steeds geacht onverminderd te zijn genoten.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel80
  - number: '80.3'
    text: |-
      Indien de ambtenaar of de gewezen ambtenaar recht heeft op een ZW-uitkering of een WIA-uitkering, is het
      verplichtingen- en sanctieregime van de [ZW][ref1] of de [WIA][ref2] van overeenkomstige toepassing op zijn recht
      krachtens dit hoofdstuk op grond van dezelfde dienstbetrekking.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0019057
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0019057
  - number: '80.4'
    text: |-
      De inkomsten die de ambtenaar of de gewezen ambtenaar geniet in verband met het verrichten van in het belang van
      zijn genezing door de deskundige persoon of de arbodienst wenselijk geachte arbeid, worden op de aanspraak op
      de doorbetaling van de bezoldiging vermeerderd met de vakantie-uitkering en de eindejaarsuitkering in mindering
      gebracht, voor zover deze inkomsten tezamen met de aanspraak op de doorbetaling van de bezoldiging vermeerderd
      met de vakantie-uitkering en de eindejaarsuitkering of de WIA-uitkering, vermeerderd met de AAOP-uitkering, de
      bezoldiging vermeerderd met de vakantie-uitkering en de eindejaarsuitkering te boven gaan.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel80
  - number: '80.5'
    text: |-
      Inkomsten uit of in verband met arbeid of bedrijf, worden op het bedrag waarop de gewezen ambtenaar ingevolge dit
      hoofdstuk recht heeft, in mindering gebracht, tenzij:
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel80
  - number: 80.5.a)
    text: |-
      de gewezen ambtenaar deze inkomsten reeds vóór het intreden van de ongeschiktheid tot het verrichten van zijn
      arbeid wegens ziekte genoot; en
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel80
  - number: 80.5.b)
    text: de omvang van die arbeid niet is toegenomen.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel80
  - number: '81.1'
    text: |-
      Voor zolang de gewezen ambtenaar na beëindiging van de haar ingevolge
      [artikel 62d, het eerste, tweede of het vierde lid][ref1], toekomende uitkering:


      [ref1]: https://wetten.overheid.nl/BWBR0003229#Artikel62d
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0003229
        artikel: 62d
        hoofdstuk: V
        paragraaf: '2'
  - number: 81.1.a)
    text: wegens ziekte ongeschikt is tot werken, dan wel
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel81
  - number: 81.1.b)
    text: |-
      binnen een maand na deze beëindiging ongeschikt wordt tot werken, heeft zij gedurende een tijdvak van 52 weken
      recht op de doorbetaling van de bezoldiging overeenkomstig [artikel 73][ref1]. De termijn van 52 weken wordt
      geacht aan te vangen na beëindiging van voornoemde periode respectievelijk met ingang van de eerste dag waarop zij
      ongeschikt is een naar aard en omvang soortgelijke functie te vervullen.


      [ref1]: https://wetten.overheid.nl/BWBR0003229#Artikel73
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0003229
        artikel: '73'
        hoofdstuk: VI
        paragraaf: '3'
  - number: '81.2'
    text: |-
      Ongeschikt tot werken, geheel of gedeeltelijk, in de zin van het eerste lid is de vrouwelijke gewezen ambtenaar die
      als rechtstreeks en objectief medisch vast te stellen gevolg van ziekte of gebreken geheel of gedeeltelijk niet in
      staat is om een naar aard en omvang soortgelijke betrekking als zij vervulde, te vervullen.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel81
  - number: '82.1'
    text: |-
      In bijzondere gevallen kan aan de ambtenaar een tegemoetkoming worden toegekend in noodzakelijk gemaakte kosten die
      verband houden met ziekte, welke de ambtenaar voor zichzelf en voor zijn medebelanghebbenden heeft gemaakt:
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel82
  - number: 82.1.a)
    text: indien hierin niet ingevolge een andere regeling kan worden voorzien; en
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel82
  - number: 82.1.b)
    text: deze kosten redelijkerwijs niet voor zijn rekening kunnen blijven.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel82
  - number: '82.2'
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties kan omtrent het bepaalde in het eerste lid nadere
      regels vaststellen.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel82
  - number: '83.1'
    text: |-
      Indien de ziekte, uit hoofde waarvan de ambtenaar of de gewezen ambtenaar ongeschikt is zijn arbeid te verrichten,
      voortvloeit uit een dienstongeval of een door het verrichten van zijn arbeid opgelopen beroepsziekte, worden hem
      vergoed de naar het oordeel van het tot aanstelling bevoegd gezag noodzakelijk gemaakte kosten van geneeskundige
      behandeling of verzorging die ten laste van de ambtenaar blijven.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel83
  - number: '83.2'
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties kan omtrent het bepaalde in het eerste lid nadere
      regels vaststellen.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel83
  - number: 83a.1
    text: |-
      Het bedrag van de bezoldiging of de laatstgenoten bezoldiging, bedoeld in de [artikelen 72][ref1],
      [72a, derde lid][ref2], en [73][ref3], en het bedrag van de eindejaarsuitkering, bedoeld in de genoemde artikelen,
      worden in voorkomende gevallen gewijzigd overeenkomstig een algemene wijziging van het salaris respectievelijk
      de eindejaarsuitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0003229#Artikel72
      [ref2]: https://wetten.overheid.nl/BWBR0003229#Artikel72a
      [ref3]: https://wetten.overheid.nl/BWBR0003229#Artikel73
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel83a
    references:
      - id: ref1
        bwb_id: BWBR0003229
        artikel: '72'
        hoofdstuk: VI
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0003229
        artikel: 72a
        hoofdstuk: VI
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0003229
        artikel: '73'
        hoofdstuk: VI
        paragraaf: '3'
  - number: 83a.2
    text: |-
      Indien de ambtenaar in het genot is van een toelage als bedoeld in [artikel 17][ref1], [17a][ref2], [18][ref3]
      of [18a van het Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref4], worden die toelagen voor de
      vaststelling van het in het eerste lid bedoelde bedrag, vastgesteld op het bedrag dat hem ingevolge de voor hem
      geldende werktijdregeling zou zijn toegekend indien hij niet ongeschikt was geworden tot het verrichten van zijn
      arbeid wegens ziekte. Indien de vaststelling van het bedrag op deze wijze niet mogelijk is, dan wordt dit bedrag
      vastgesteld op het gemiddelde van het bedrag dat de ambtenaar per maand aan die toelagen heeft genoten over de drie
      kalendermaanden voorafgaande aan:


      [ref1]: https://wetten.overheid.nl/BWBR0003630#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0003630#Artikel17a
      [ref3]: https://wetten.overheid.nl/BWBR0003630#Artikel18
      [ref4]: https://wetten.overheid.nl/BWBR0003630#Artikel18a
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel83a
    references:
      - id: ref1
        bwb_id: BWBR0003630
        artikel: '17'
      - id: ref2
        bwb_id: BWBR0003630
        artikel: 17a
      - id: ref3
        bwb_id: BWBR0003630
        artikel: '18'
      - id: ref4
        bwb_id: BWBR0003630
        artikel: 18a
  - number: 83a.2.a)
    text: de kalendermaand waarin de ambtenaar ongeschikt is geworden tot het verrichten van zijn arbeid wegens ziekte; of
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel83a
  - number: 83a.2.b)
    text: |-
      de kalendermaand waarin de gewezen ambtenaar wegens ziekte ongeschikt is geworden een naar aard en omvang
      soortgelijke betrekking te vervullen.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel83a
  - number: 83a.3
    text: |-
      Indien ook voor het overige de bezoldiging niet in een vast bedrag per maand kan worden uitgedrukt, wordt gerekend
      met het bedrag dat gemiddeld per maand is toegekend in de drie kalendermaanden voorafgaande aan de maand waarin:
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel83a
  - number: 83a.3.a)
    text: de ambtenaar ongeschikt is geworden tot het verrichten van zijn arbeid wegens ziekte;
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel83a
  - number: 83a.3.b)
    text: |-
      de gewezen ambtenaar wegens ziekte ongeschikt is geworden een naar aard en omvang soortgelijke betrekking te
      vervullen.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel83a
  - number: 83a.4
    text: |-
      Voor zover de ambtenaar of de gewezen ambtenaar geen drie kalendermaanden in dienst is geweest, wordt voor
      de toepassing van het tweede en derde lid gerekend met het bedrag dat hem gemiddeld aan bezoldiging per maand
      is toegekend over het tijdvak waarin hij in dienst is geweest vóór het ontstaan van de ongeschiktheid tot het
      verrichten van zijn arbeid respectievelijk tot het vervullen van een naar aard en omvang soortgelijke betrekking.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel83a
  - number: 84a.1
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties kan regels vaststellen omtrent de te volgen procedure
      bij reorganisaties en het herplaatsen van ambtenaren.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel84a
  - number: 84a.2
    text: |-
      Het tot aanstelling bevoegd gezag kan nadere procedures en regels vaststellen omtrent reorganisaties en het
      herplaatsen van ambtenaren.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel84a
  - number: 84b.1
    text: Bij een reorganisatie zijn de bepalingen van dit hoofdstuk van toepassing.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel84b
  - number: 84b.2
    text: |-
      Onder reorganisatie als bedoeld in het eerste lid wordt verstaan: iedere wijziging van de organisatiestructuur,
      de omvang of de taakinhoud van de Kamer, de Stenografische Dienst of de Griffie voor de interparlementaire
      betrekkingen, of een onderdeel daarvan, waaraan personele consequenties zijn verbonden.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel84b
  - number: 84b.3
    text: |-
      De bepalingen van dit hoofdstuk zijn van overeenkomstige toepassing op de overgang van de ambtenaar naar een
      private onderneming of zelfstandig bestuursorgaan in verband met de privatisering of verzelfstandiging van het
      dienstonderdeel van de Kamer, de Stenografische Dienst of de Griffie voor de interparlementaire betrekkingen,
      waarbij de ambtenaar werkzaam is, tenzij bij algemeen verbindend voorschrift anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel84b
  - number: 84ba.1
    text: |-
      Door of namens het tot aanstelling bevoegd gezag worden de centrales van verenigingen van ambtenaren tijdig
      geïnformeerd over een voorgenomen besluit tot een reorganisatie.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel84ba
  - number: 84ba.2
    text: |-
      Door of namens het tot aanstelling bevoegd gezag worden de betrokken ondernemingsraden tijdig geïnformeerd over een
      voorgenomen besluit tot reorganisatie.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel84ba
  - number: 84d
    text: |-
      De ambtenaar die is aangesteld in tijdelijke dienst voor een proeftijd en de ambtenaar aangesteld in vaste dienst,
      wier functie in verband met een reorganisatie is opgeheven, wordt aangewezen als te herplaatsen ambtenaar, hierna
      te noemen: herplaatsingskandidaat.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel84d
  - number: 84e.1
    text: |-
      Van overtolligheid is sprake indien binnen de te reorganiseren Kamer, de Stenografische Dienst, de Griffie voor de
      interparlementaire betrekkingen van de Staten-Generaal of een onderdeel daarvan, meer ambtenaren een vergelijkbare
      of uitwisselbare functie vervullen en het totale aantal van die functies zodanig wordt verminderd dat onvoldoende
      van de functies voor de betrokken ambtenaren resteren.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel84e
  - number: 84e.2
    text: |-
      De ambtenaar die is aangesteld in tijdelijke dienst voor een proeftijd en de ambtenaar aangesteld in vaste dienst,
      die in verband met een reorganisatie overtollig zijn, worden aangewezen als herplaatsingskandidaat, waarbij de
      ambtenaar die het geringste aantal jaren in overheidsdienst heeft doorgebracht het eerst als herplaatsingskandidaat
      wordt aangewezen.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel84e
  - number: 84e.3
    text: |-
      Voor de berekening van het aantal in overheidsdienst doorgebrachte jaren wordt mede in aanmerking genomen
      tijd gewijd aan de verzorging van tot het huishouden van de ambtenaar behorende 0–4 jarige eigen, stief- of
      pleegkinderen, tot een maximum van in totaal zes jaren.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel84e
  - number: 84e.4
    text: |-
      Het tot aanstellen bevoegd gezag kan van de volgorde in het tweede lid afwijken indien zulks naar zijn oordeel
      noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel84e
  - number: 84f
    text: De ambtenaar wordt omtrent zijn aanwijzing als herplaatsingskandidaat zo spoedig mogelijk geïnformeerd.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel84f
  - number: 84g.1
    text: |-
      Onverminderd het gestelde in artikel 126, eerste lid is het tot aanstelling bevoegd gezag verplicht om de
      ambtenaar binnen een periode van 18 maanden, te rekenen vanaf het moment dat de ambtenaar is aangewezen als
      herplaatsingskandidaat, ten minste één passende functie aan te bieden.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel84g
  - number: 84g.2
    text: 'Het tot aanstelling bevoegd gezag kan de termijn als bedoeld in het eerste lid verkorten indien:'
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel84g
  - number: 84g.2.a
    text: |-
      de herplaatsingskandidaat heeft geweigerd te voldoen aan een hem op grond van dit hoofdstuk opgelegde verplichting,
      of;
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel84g
  - number: 84g.2.b
    text: |-
      reeds eerder in overleg met de ambtenaar binnen de termijn kan worden vastgesteld dat er geen mogelijkheden zijn om
      de herplaatsingskandidaat te herplaatsen.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel84g
  - number: 84g.3
    text: |-
      Het tot aanstelling bevoegd gezag kan de termijn verlengen of opschorten, indien de omstandigheden naar zijn
      oordeel daartoe aanleiding geven.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel84g
  - number: 84g.4
    text: |-
      De ambtenaar wordt gelijktijdig met zijn aanwijzing als herplaatsingskandidaat geïnformeerd over de aanvang en het
      einde van de termijn als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel84g
  - number: 84g.5
    text: |-
      Door het tot aanstelling bevoegd gezag wordt de herplaatsingskandidaat geïnformeerd over het verkorten, verlengen
      of opschorten van de termijn als bedoeld in het tweede en het derde lid.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel84g
  - number: 84h.1
    text: |-
      Van een passende functie als bedoeld in [artikel 84g][ref1] is sprake indien de herplaatsingskandidaat naar het
      oordeel van het tot aanstelling bevoegd gezag beschikt over de kennis en kunde die noodzakelijk worden geacht om
      de functie naar behoren te kunnen uitoefenen danwel indien de herplaatsingskandidaat naar het oordeel van het tot
      aanstelling bevoegd gezag binnen redelijke termijn om-, her- of bijgeschoold kan worden, en deze functie hem in
      verband met zijn persoonlijkheid, zijn omstandigheden en de voor hem bestaande vooruitzichten, redelijkerwijs kan
      worden opgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0003229#Artikel84g
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel84h
    references:
      - id: ref1
        bwb_id: BWBR0003229
        artikel: 84g
        hoofdstuk: VII
  - number: 84h.2
    text: |-
      Bij het eerste lid geldt de beperking dat uitsluitend sprake kan zijn van een passende functie indien de voor
      de functie geldende salarisschaal niet meer dan twee schalen lager is dan de salarisschaal die geldt voor de
      herplaatsingskandidaat.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel84h
  - number: 84h.3
    text: |-
      Het tot aanstelling bevoegd gezag kan de herplaatsingskandidaat plaatsen op een functie waarvan de geldende
      salarisschaal meer dan twee schalen lager is dan de salarisschaal die geldt voor de herplaatsingskandidaat indien
      er bijzondere omstandigheden zijn die zulks rechtvaardigen en indien de herplaatsingskandidaat daarmee instemt.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel84h
  - number: 84h.4
    text: |-
      Bij een herplaatsing met toepassing van het derde lid zijn de [artikelen 84k][ref1] en [84n][ref2] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003229#Artikel84k
      [ref2]: https://wetten.overheid.nl/BWBR0003229#Artikel84n
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel84h
    references:
      - id: ref1
        bwb_id: BWBR0003229
        artikel: 84k
        hoofdstuk: VII
      - id: ref2
        bwb_id: BWBR0003229
        artikel: 84n
        hoofdstuk: VII
  - number: 84i
    text: |-
      Het tot aanstelling bevoegd gezag kan de naar zijn oordeel meest geschikte herplaatsingskandidaat, voor wie de
      functie als passend wordt aangemerkt, herplaatsen in die functie.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel84i
  - number: 84j.1
    text: |-
      Onverminderd het bepaalde in artikel 84*g*, eerste lid, is de herplaatsingskandidaat verplicht al het mogelijke te
      doen om een passende fucntie te vinden.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel84j
  - number: 84j.2
    text: De herplaatsingskandidaat is verplicht een passende functie te aanvaarden.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel84j
  - number: 84k
    text: |-
      De herplaatsingskandidaat die slechts in een voor hem passende functie kan worden herplaatst na om-, her- of
      bijscholing kan hiertoe worden verplicht, voor zover dat redelijkerwijs van hem kan worden gevergd. Artikel 94,
      tweede lid, eerste volzin, derde, zesde en zevende lid zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel84k
  - number: 84l.1
    text: |-
      De herplaatsingskandidaat die heeft geweigerd te voldoen aan een hem op grond van dit hoofdstuk opgelegde
      verplichting, kan in verband daarmee ontslag worden verleend.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel84l
  - number: 84l.2
    text: Bij een ontslagverlening op grond van het eerste lid wordt een opzeggingstermijn van drie maanden in acht genomen.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel84l
  - number: 84n.1
    text: |-
      De ambtenaar die in verband met zijn herplaatsing of plaatsing in een passende functie in opdracht van het tot
      aanstelling bevoegd gezag is verhuisd, wordt eenmalig een bedrag toegekend van € 10 890,73 bruto ter tegemoetkoming
      in de daarmee verband houdende kosten.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel84n
  - number: 84n.2
    text: |-
      In de gevallen waarin de ambtenaar en zijn echtgenoot beiden in aanmerking komen voor het bedrag bedoeld in het
      eerste lid ontvangt elk de helft daarvan.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel84n
  - number: 84n.3
    text: |-
      Het bedrag bedoeld in het eerste lid wordt niet toegekend, indien de verhuizing niet heeft plaatsgevonden binnen
      twee jaren nadat de opdracht om te verhuizen is gegeven.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel84n
  - number: 84o
    text: |-
      Het tot aanstellen bevoegd gezag kan de herplaatsingskandidaat een premie in het vooruitzicht stellen ter grootte
      van maximaal drie maandsalarissen indien hem binnen 18 maanden nadat hij is aangewezen als herplaatsingskandidaat
      op zijn aanvraag eervol ontslag wordt verleend.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel84o
  - number: 84p.1
    text: |-
      De herplaatsingskandidaat aan wie eervol ontslag op zijn aanvraag is verleend wegens de aanvaarding van een functie
      kan, onverminderd het bepaalde in artikel 84*o*, een salarissuppletie worden toegekend indien het in de nieuwe
      functie genoten salaris lager is dan het salaris in de oorspronkelijke functie.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel84p
  - number: 84p.2
    text: |-
      De suppletie als bedoeld in het eerste lid wordt toegekend gedurende maximaal 5 jaar en is ten hoogste gelijk aan
      het verschil tussen het in de oorspronkelijke functie genoten salaris en het salaris in de nieuwe functie.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel84p
  - number: 84p.3
    text: |-
      Onder door het tot aanstelling bevoegd gezag te stellen voorwaarden kan het recht op suppletie op aanvraag van de
      herplaatsingskandidaat worden afgekocht.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel84p
  - number: 84q
    text: |-
      Het tot aanstellen bevoegd gezag kan de [artikelen 84j, tweede lid][ref1], [84k][ref2], [84n][ref3] en [84p][ref4]
      toepassen op de ambtenaar wiens functie binnen afzienbare tijd wordt opgeheven of die als overtollig zal worden
      aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0003229#Artikel84j
      [ref2]: https://wetten.overheid.nl/BWBR0003229#Artikel84k
      [ref3]: https://wetten.overheid.nl/BWBR0003229#Artikel84n
      [ref4]: https://wetten.overheid.nl/BWBR0003229#Artikel84p
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel84q
    references:
      - id: ref1
        bwb_id: BWBR0003229
        artikel: 84j
        hoofdstuk: VII
      - id: ref2
        bwb_id: BWBR0003229
        artikel: 84k
        hoofdstuk: VII
      - id: ref3
        bwb_id: BWBR0003229
        artikel: 84n
        hoofdstuk: VII
      - id: ref4
        bwb_id: BWBR0003229
        artikel: 84p
        hoofdstuk: VII
  - number: '85.1'
    text: |-
      De ambtenaar is gehouden de plichten uit zijn functie voortvloeiende, nauwgezet en ijverig te vervullen en zich te
      gedragen, zoals een goed ambtenaar betaamt.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel85
  - number: '85.2'
    text: |-
      Het is de ambtenaar verboden in dienst uniformkledingstukken te dragen, tenzij deze door de Kamer zijn verstrekt
      of voorgeschreven.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel85
  - number: '85.3'
    text: |-
      Het is de ambtenaar verboden bij gekleed gaan in uniform insignes of andere onderscheidingstekens te dragen, tenzij
      deze zijn verstrekt of voorgeschreven door de Kamer.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel85
  - number: '86.1'
    text: De ambtenaar is verplicht een eed of een belofte af te leggen.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel86
  - number: '86.2'
    text: Het tot aanstelling bevoegd gezag stelt regels inzake het afleggen door de ambtenaar van de eed of de belofte.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel86
  - number: '86.3'
    text: |-
      Bij regeling van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties wordt het formulier vastgesteld dat
      wordt gebruikt voor het afleggen door de ambtenaar van de eed of de belofte.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel86
  - number: '87'
    text: |-
      Ter zake van niet-naleving van bepalingen, welke redelijkerwijs niet kunnen worden geacht de ambtenaar bekend te
      zijn, worden hem geen voordelen onthouden of nadelen toegebracht.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel87
  - number: '89'
    text: |-
      Indien de ambtenaar verhinderd is zijn dienst te verrichten, is hij verplicht daarvan, onder opgave van redenen, zo
      tijdig mogelijk mededeling te doen, ten einde vertraging of hinder in de dienst zoveel doenlijk te voorkomen.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel89
  - number: '90.1'
    text: |-
      De ambtenaar kan worden verplicht te gaan wonen of te blijven wonen in of nabij de gemeente die hem als standplaats
      is aangewezen of waartoe zijn standplaats behoort, indien dit naar het oordeel van het bevoegd gezag noodzakelijk
      is in verband met de goede vervulling van zijn functie.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel90
  - number: '90.2'
    text: |-
      De ambtenaar aan wie de verplichting is opgelegd in of nabij de in het eerste lid bedoelde gemeente te gaan wonen,
      is gehouden zo spoedig mogelijk, maar uiterlijk twee jaar nadat die verplichting is opgelegd, daaraan gevolg te
      geven.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel90
  - number: '91.1'
    text: |-
      De ambtenaar is verplicht indien hem een ambts- of dienstwoning ter bewoning is aangewezen, deze te betrekken en
      zich ter zake van de bewoning en het gebruik te gedragen naar de voorschriften, die daaromtrent zijn gesteld.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel91
  - number: '91.2'
    text: |-
      Hij draagt de onderhoudskosten, welke volgens de wet en het plaatselijk gebruik gemeenlijk voor rekening van de
      huurder zijn, tenzij door het bevoegd gezag ter zake een afwijkende regeling is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel91
  - number: '92.1'
    text: De ambtenaar kan op zijn aanvraag een andere functie worden opgedragen.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel92
  - number: '92.2'
    text: |-
      Wanneer het belang van de dienst zulks vordert, is de ambtenaar verplicht, een andere passende functie te
      aanvaarden:
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel92
  - number: 92.2.a
    text: |-
      overeenkomstig het bepaalde in artikel 84*h* indien het gaat om een verplaatsing in het kader van een
      reorganisatie, en;
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel92
  - number: 92.2.b
    text: overeenkomstig het bepaalde in artikel 84*h*, eerste lid in de overige gevallen.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel92
  - number: 92b.1
    text: |-
      Indien de ambtenaar van 57 jaar of ouder op diens aanvraag een functie wordt opgedragen waaraan een salarisschaal
      is verbonden met een lager maximumsalaris dan dat van de reeds voor hem geldende salarisschaal, wordt op zijn
      salaris een inhouding toegepast.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel92b
  - number: 92b.2
    text: |-
      De inhouding is gelijk aan het verschil tussen het salaris dat de ambtenaar geniet en het salaris dat de ambtenaar
      zou genieten bij inpassing in de bij de nieuwe functie behorende salarisschaal op hetzelfde salarisnummer.
      Indien dit salarisnummer in laatstbedoelde salarisschaal niet voorkomt, geschiedt de inpassing op het naastlagere
      salarisnummer.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel92b
  - number: 92b.3
    text: |-
      Indien na 52 weken ziekte de doorbetaling van de bezoldiging op grond van [artikel 72, eerste lid][ref1], wordt
      teruggebracht tot 70%, wordt de inhouding over die uren opgeschort voor de duur van de ziekte.


      [ref1]: https://wetten.overheid.nl/BWBR0003229#Artikel72
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel92b
    references:
      - id: ref1
        bwb_id: BWBR0003229
        artikel: '72'
        hoofdstuk: VI
        paragraaf: '3'
  - number: 92b.4
    text: In bijzondere gevallen kan het tot aanstellen bevoegd gezag geheel of gedeeltelijk van de inhouding afzien.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel92b
  - number: '93.1'
    text: |-
      De ambtenaar kan worden verplicht tijdelijk andere ambtelijke werkzaamheden te verrichten dan die, welke hij
      gewoonlijk verricht, mits die werkzaamheden hem redelijkerwijs kunnen worden opgedragen. Hij kan echter niet
      worden verplicht werkzaamheden te verrichten in de plaats van stakers of uitgeslotenen in particuliere dienst,
      tenzij de opgedragen werkzaamheden worden verricht in dienst van het lichaam, waarbij hij werkzaam is, en voor de
      openbare dienst tijdens de staking of uitsluiting, dan wel als onmiddellijk gevolg daarvan redelijkerwijze dadelijk
      noodzakelijk zijn te achten. Die werkzaamheden worden de ambtenaar niet opgedragen dan nadat hij is gehoord.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel93
  - number: '93.2'
    text: |-
      Bij de toepassing van het bepaalde in het vorige lid wordt voor zoveel mogelijk rekening gehouden met de
      persoonlijke omstandigheden van de ambtenaar.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel93
  - number: 93a.1
    text: |-
      De ambtenaar die door het tot aanstellen bevoegd gezag is aangewezen als bedrijfshulpverlener als
      bedoeld in [artikel 15 van de Arbeidsomstandighedenwet][ref1] en die naast zijn normale werkzaamheden de
      bedrijfshulpverleningstaken naar behoren heeft uitgevoerd, ontvangt een toelage.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel15
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel93a
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '15'
  - number: 93a.2
    text: |-
      De toelage wordt bepaald volgens door het tot aanstellen bevoegd gezag vast te stellen regels en bedraagt tenminste
      € 195,35 per jaar.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel93a
  - number: 93a.3
    text: |-
      De vast te stellen regels bevatten in ieder geval de criteria die gehanteerd worden bij de toekenning van een
      bedrijfshulpverleningstoelage.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel93a
  - number: 93a.4
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties kan het in het tweede lid genoemde bedrag aanpassen
      overeenkomstig de algemene salarisontwikkeling van het rijkspersoneel.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel93a
  - number: 93b.1
    text: |-
      Het bevoegd gezag breidt de formatie van de organisatorische eenheid waar de ambtenaar die lid is van
      de ondernemingsraad werkzaam is, uit met de tijd die met toepassing van de [artikelen 17][ref1] en
      [18 van de Wet op de ondernemingsraden][ref2] voor die ambtenaar is vastgesteld, voor zover dit noodzakelijk is
      om gedurende de periode van het lidmaatschap de door de organisatorische eenheid te verrichten werkzaamheden te
      realiseren.


      [ref1]: https://wetten.overheid.nl/BWBR0002747#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0002747#Artikel18
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel93b
    references:
      - id: ref1
        bwb_id: BWBR0002747
        artikel: '17'
      - id: ref2
        bwb_id: BWBR0002747
        artikel: '18'
  - number: 93b.2
    text: |-
      De ambtenaar, bedoeld in het eerste lid, heeft op zijn aanvraag voor de resterende duur van zijn lidmaatschap van
      de ondernemingsraad recht op uitbreiding van zijn arbeidsduur met het aantal uren waarmee het bevoegd gezag vanwege
      dat lidmaatschap op grond van het eerste lid de formatie heeft uitgebreid. [Artikel 34, tweede lid][ref1], is van
      overeenkomstige toepassing. Een aanvraag als bedoeld in de eerste volzin wordt niet toegewezen zolang de ambtenaar
      geheel of gedeeltelijk ongeschikt is tot het verrichten van zijn arbeid wegens ziekte.


      [ref1]: https://wetten.overheid.nl/BWBR0003229#Artikel34
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel93b
    references:
      - id: ref1
        bwb_id: BWBR0003229
        artikel: '34'
        hoofdstuk: IV
  - number: '94.1'
    text: |-
      De ambtenaar kan in het belang van de Rijksdienst worden verplicht om scholing te volgen, voor zover dat
      redelijkerwijs van hem kan worden gevergd.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel94
  - number: '94.2'
    text: |-
      Aan de ambtenaar, die op grond van het eerste lid is verplicht scholing te volgen, wordt een volledige vergoeding
      van de noodzakelijk te maken scholingskosten toegekend. Het tot aanstelling bevoegd gezag kan in bijzondere
      gevallen afwijken van de vorige volzin.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel94
  - number: '94.3'
    text: |-
      Aan de ambtenaar, die op grond van het eerste lid is verplicht scholing te volgen, kan scholingsverlof met behoud
      van bezoldiging worden verleend.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel94
  - number: '94.4'
    text: |-
      De ambtenaar, die op grond van het eerste lid is verplicht scholing te volgen, kan worden verplicht tot
      terugbetaling van de aan hem toegekende vergoeding van de scholingskosten:
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel94
  - number: 94.4.a
    text: |-
      bij onvoldoende resultaat in de scholing en bij tussentijds afbreken van de scholing, indien dit aan eigen schuld
      of toedoen van de ambtenaar is te wijten;
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel94
  - number: 94.4.b
    text: |-
      bij ontslag tijdens het volgen van de scholing en in bijzondere gevallen bij ontslag binnen een termijn van
      maximaal drie jaren na het met voldoende resultaat afronden van de scholing, tenzij de ambtenaar binnen een maand
      na zijn ontslag elders in dienst treedt binnen de Rijksdienst of aansluitend aan zijn ontslag recht heeft op een
      uitkering op grond van werkloosheid, arbeidsongeschiktheid of ouderdomspensioen.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel94
  - number: '94.5'
    text: |-
      De verplichting tot terugbetaling wordt niet opgelegd aan de ambtenaar die binnen 18 maanden nadat hij is
      aangewezen als herplaatsingskandidaat als bedoeld in de [artikelen 84d][ref1] en [84e][ref2], op zijn aanvraag
      eervol ontslag wordt verleend wegens de aanvaarding van een functie buiten de Rijksdienst.


      [ref1]: https://wetten.overheid.nl/BWBR0003229#Artikel84d
      [ref2]: https://wetten.overheid.nl/BWBR0003229#Artikel84e
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0003229
        artikel: 84d
        hoofdstuk: VII
      - id: ref2
        bwb_id: BWBR0003229
        artikel: 84e
        hoofdstuk: VII
  - number: '94.6'
    text: Het tot aanstelling bevoegd gezag kan ten aanzien van dit artikel nadere regels stellen.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel94
  - number: '95.1'
    text: |-
      Aan de ambtenaar die op eigen initiatief scholing gaat volgen, kan op zijn aanvraag een vergoeding van de
      noodzakelijk te maken scholingskosten worden toegekend of scholingsverlof met behoud van bezoldiging worden
      verleend, indien het belang van de Rijksdienst bij het volgen van de scholing is gebaat.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel95
  - number: '95.2'
    text: |-
      De ambtenaar, aan wie op grond van het eerste lid een vergoeding van scholingskosten is toegekend, kan worden
      verplicht tot terugbetaling van die vergoeding:
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel95
  - number: 95.2.a
    text: |-
      bij onvoldoende resultaat in de scholing en bij tussentijds afbreken van de scholing, indien dit aan eigen schuld
      of toedoen van de ambtenaar is te wijten;
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel95
  - number: 95.2.b
    text: |-
      bij ontslag tijdens het volgen van de scholing en bij ontslag binnen een termijn van maximaal drie jaren na het
      met voldoende resultaat afronden van de scholing, tenzij de ambtenaar binnen een maand na zijn ontslag elders
      in dienst treedt binnen de Rijksdienst of aansluitend aan zijn ontslag recht heeft op een uitkering op grond van
      werkloosheid, arbeidsongeschiktheid of ouderdomspensioen.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel95
  - number: '95.3'
    text: |-
      De verplichting tot terugbetaling wordt niet opgelegd aan de ambtenaar die binnen 18 maanden nadat hij is
      aangewezen als herplaatsingskandidaat als bedoeld in de [artikelen 84d][ref1] en [84e][ref2], op zijn aanvraag
      eervol ontslag wordt verleend wegens de aanvaarding van een functie buiten de Rijksdienst.


      [ref1]: https://wetten.overheid.nl/BWBR0003229#Artikel84d
      [ref2]: https://wetten.overheid.nl/BWBR0003229#Artikel84e
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0003229
        artikel: 84d
        hoofdstuk: VII
      - id: ref2
        bwb_id: BWBR0003229
        artikel: 84e
        hoofdstuk: VII
  - number: '95.4'
    text: Het tot aanstelling bevoegd gezag kan ten aanzien van dit artikel nadere regels stellen.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel95
  - number: '96.1'
    text: |-
      De ambtenaar is verplicht aan het tot aanstelling bevoegd gezag, op een door dit gezag te bepalen wijze, opgave te
      doen van de nevenwerkzaamheden die hij verricht of voornemens is te gaan verrichten, die de belangen van de dienst
      voor zover deze in verband staan met zijn functievervulling, kunnen raken.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel96
  - number: '96.2'
    text: Het tot aanstelling bevoegd gezag voert een registratie op basis van de op grond van het eerste lid gedane opgaven.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel96
  - number: '96.3'
    text: |-
      Het is de ambtenaar verboden nevenwerkzaamheden te verrichten waardoor de goede vervulling van zijn functie of de
      goede functionering van de openbare dienst, voor zover deze in verband staat met zijn functievervulling, niet in
      redelijkheid zou zijn verzekerd. Door het tot aanstelling bevoegd gezag kunnen nadere regels omtrent dit verbod
      worden gesteld.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel96
  - number: 96a.1
    text: |-
      Het tot aanstelling bevoegd gezag wijst de ambtenaren aan die werkzaamheden verrichten waaraan in het bijzonder het
      risico van financiële belangenverstrengeling of het risico van oneigenlijk gebruik van koersgevoelige informatie
      verbonden is. De aangewezen ambtenaar meldt financiële belangen, alsmede het bezit van en transacties met effecten
      die de belangen van de dienst voor zover deze in verband staan met zijn functievervulling kunnen raken, aan een
      daartoe aangewezen functionaris.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel96a
  - number: 96a.2
    text: Het tot aanstelling bevoegd gezag voert een registratie van de op grond van het eerste lid gedane meldingen.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel96a
  - number: 96a.3
    text: |-
      De ambtenaar verstrekt nadere informatie of bescheiden met betrekking tot de financiële belangen of het bezit van
      of de transacties met effecten, indien daarvoor naar het oordeel van het tot aanstelling bevoegd gezag of de door
      dit gezag aangewezen functionaris, bedoeld in het eerste lid, aanleiding bestaat op grond van de melding of na de
      melding gebleken feiten of omstandigheden.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel96a
  - number: 96a.4
    text: |-
      De ambtenaar heeft geen financiële belangen, bezit geen effecten of verricht geen effectentransacties waardoor de
      goede vervulling van zijn functie of het goed functioneren van de openbare dienst, voorzover dit in verband staat
      met zijn functievervulling, niet in redelijkheid zou zijn verzekerd.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel96a
  - number: 96a.5
    text: |-
      Door het tot aanstelling bevoegd gezag kunnen nadere regels worden gesteld omtrent de melding, bedoeld in het
      eerste lid, de registratie, bedoeld in het tweede lid, en het verbod, bedoeld in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel96a
  - number: '97.1'
    text: |-
      Het is de ambtenaar verboden, middellijk of onmiddellijk deel te nemen aan aannemingen en leveringen ten behoeve
      van openbare diensten, tenzij daarvoor toestemming is verleend.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel97
  - number: '97.2'
    text: |-
      Hij is verplicht zich te gedragen naar hetgeen voor hem is bepaald ten aanzien van het deelnemen, middellijk of
      onmiddellijk, aan aannemingen en leveringen ten behoeve van anderen.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel97
  - number: '98.1'
    text: |-
      Het is de ambtenaar verboden, anders dan met goedvinden van het tot aanstelling bevoegd gezag, vergoedingen,
      beloningen, giften of beloften van derden te vorderen, te verzoeken of aan te nemen.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel98
  - number: '98.2'
    text: Het aannemen van steekpenningen is onvoorwaardelijk en ten strengste verboden.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel98
  - number: '99.1'
    text: |-
      De ambtenaar is verplicht de dienstkleding en de onderscheidingstekenen te dragen, indien en voor zover dit voor
      hem voorgeschreven is.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel99
  - number: '99.2'
    text: |-
      De Kamer verstrekt de voorgeschreven dienstkleding. De aanschaf en het onderhoud van de dienstkleding geschieden
      voor haar rekening.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel99
  - number: '100.1'
    text: |-
      De ambtenaar kan worden verplicht tot gehele of gedeeltelijke vergoeding van de door de dienst geleden schade, voor
      zover deze aan hem is te wijten.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel100
  - number: '100.2'
    text: |-
      Het bedrag van de schadevergoeding wordt niet vastgesteld, dan nadat de ambtenaar in de gelegenheid is gesteld zich
      schriftelijk of mondeling te verantwoorden.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel100
  - number: '101'
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties kan regels stellen ten aanzien van telewerken. Deze
      regels hebben in ieder geval betrekking op:
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel101
  - number: 101.a
    text: de inrichting van de telewerkplek;
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel101
  - number: 101.b
    text: de beschikbaarstelling door het bevoegd gezag van apparatuur;
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel101
  - number: 101.c
    text: de wijze waarop de werkcontacten tussen de ambtenaar en zijn dienstonderdeel zullen plaatsvinden;
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel101
  - number: 101.d
    text: de wijze waarop wordt voorzien in een vergoeding van de door de ambtenaar gemaakte kosten;
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel101
  - number: 101.e
    text: de wijze waarop het overleg met de vertegenwoordigers van het personeel wordt gevoerd.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel101
  - number: '103.1'
    text: De ambtenaar heeft recht op vergoeding wegens reis- en verblijfkosten ter zake van dienstreizen.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel103
  - number: '103.2'
    text: Deze vergoeding wordt vastgesteld overeenkomstig de daarvoor gestelde regels.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel103
  - number: '104.1'
    text: |-
      Het tot aanstelling bevoegd gezag kan naar billijkheid de ambtenaar schadeloos stellen, kosten vergoeden of
      overigens een geldelijke tegemoetkoming verlenen.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel104
  - number: '104.2'
    text: |-
      De ambtenaar en de gewezen ambtenaar die een beroepsincident als bedoeld in [artikel 70, onderdeel f][ref1], hebben
      gehad, hebben recht op volledige vergoeding van de schade die zij ten gevolge van dat beroepsincident lijden. In
      overeenstemming met de ambtenaar kan deze vergoeding mede strekken ter vervanging van de uitkering, bedoeld in
      [artikel 73, zevende lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003229#Artikel70
      [ref2]: https://wetten.overheid.nl/BWBR0003229#Artikel73
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0003229
        artikel: '70'
        hoofdstuk: VI
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0003229
        artikel: '73'
        hoofdstuk: VI
        paragraaf: '3'
  - number: '104.3'
    text: |-
      Het tot aanstelling bevoegd gezag is bevoegd omtrent schadeloosstelling, kostenvergoedingen en overige geldelijke
      tegemoetkomingen aan groepen van ambtenaren in overeenstemming met Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties nadere regels te geven.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel104
  - number: '104.4'
    text: |-
      Bij ministeriële regeling kan Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties regels stellen omtrent de
      schadeloosstelling, kostenvergoedingen en overige geldelijke tegemoetkomingen aan groepen van ambtenaren.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel104
  - number: '105.1'
    text: |-
      De ambtenaar die in contact staat of kort geleden gestaan heeft met een persoon, die een ziekte heeft, waarvoor
      ingevolge het krachtens de [Wet publieke gezondheid][ref1] bepaalde een nominatieve aangifteplicht geldt, mag zijn
      dienst niet verrichten en heeft geen toegang tot dienstgebouwen, -lokalen en -terreinen dan met toestemming van het
      bevoegd gezag, dat deze toestemming slechts kan verlenen na positief medisch advies van de deskundige persoon of de
      arbodienst, bedoeld in [hoofdstuk VI][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0024705
      [ref2]: https://wetten.overheid.nl/BWBR0003229#HoofdstukVI
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel105
    references:
      - id: ref1
        bwb_id: BWBR0024705
      - id: ref2
        bwb_id: BWBR0003229
        hoofdstuk: VI
  - number: '105.2'
    text: |-
      De ambtenaar, die verkeert in de in het vorige lid omschreven situatie, is verplicht daarvan ten spoedigste
      kennis te geven aan de deskundige persoon of de arbodienst, bedoeld in [hoofdstuk VI][ref1]. Hij is gehouden
      zich te gedragen naar de vanwege de deskundige persoon of de arbodienst, bedoeld in [hoofdstuk VI][ref2] gegeven
      aanwijzingen, waaronder die met betrekking tot het ondergaan van een geneeskundig onderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0003229#HoofdstukVI
      [ref2]: https://wetten.overheid.nl/BWBR0003229#HoofdstukVI
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel105
    references:
      - id: ref1
        bwb_id: BWBR0003229
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0003229
        hoofdstuk: VI
  - number: '105.3'
    text: |-
      Gedurende de periode dat de ambtenaar ingevolge het bepaalde in dit artikel zijn dienst niet verricht, geniet hij
      zijn volle bezoldiging.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel105
  - number: '106.1'
    text: |-
      Met de ambtenaar wordt minimaal een keer per jaar door een functionaris, aangewezen door het bevoegd gezag,
      gesproken over:
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel106
  - number: 106.1.a
    text: |-
      de wijze waarop de ambtenaar de opgedragen werkzaamheden heeft uitgevoerd en de resultaten die daarbij zijn
      gehaald;
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel106
  - number: 106.1.b
    text: de omstandigheden waaronder de opgedragen werkzaamheden zijn uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel106
  - number: 106.1.c
    text: welke werkzaamheden de ambtenaar zullen worden opgedragen en welke resultaten daarbij behaald moeten worden;
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel106
  - number: 106.1.d
    text: de omstandigheden waaronder die op te dragen werkzaamheden zullen worden uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel106
  - number: 106.1.e
    text: de wijze waarop de persoonlijke ontwikkeling van de ambtenaar bevorderd kan worden.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel106
  - number: '106.2'
    text: |-
      Indien de ambtenaar gedurende vijf aaneengesloten jaren dezelfde functie heeft vervuld, wordt in het gesprek als
      bedoeld in het eerste lid specifieke aandacht besteed aan de continuering van de loopbaan.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel106
  - number: '106.3'
    text: Van het met de ambtenaar besprokene wordt een schriftelijk verslag gemaakt.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel106
  - number: '106.4'
    text: Over de in het eerste lid, onder c, d en e, genoemde onderwerpen worden met de ambtenaar afspraken gemaakt.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel106
  - number: '106.5'
    text: |-
      Het tot aanstelling bevoegd gezag stelt vast aan welke eisen een gesprek als bedoeld in het eerste lid alsmede een
      verslag daarvan moet voldoen.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel106
  - number: '107.1'
    text: Indien het bevoegd gezag dit wenselijk vindt of de ambtenaar dit aanvraagt, wordt een beoordeling opgemaakt.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel107
  - number: '107.2'
    text: |-
      Een beoordeling wordt eerst vastgesteld nadat deze met de ambtenaar is besproken en hij zijn zienswijze kenbaar
      heeft kunnen maken.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel107
  - number: '107.3'
    text: Het tot aanstelling bevoegd gezag stelt nadere regels omtrent het opmaken en vaststellen van beoordelingen.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel107
  - number: 107a.1
    text: |-
      De ambtenaar die ten minste drie jaar een functie dan wel vergelijkbare of uitwisselbare functies vervult, heeft
      de mogelijkheid om, op kosten van het bevoegd gezag, eenmaal per vijf jaar een vertrouwelijke loopbaanscan te doen,
      met behulp van een professionele loopbaandeskundige.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel107a
  - number: 107a.2
    text: |-
      De ambtenaar kan de uitkomsten van de loopbaanscan inbrengen in het jaarlijks gesprek, bedoeld in
      [artikel 106][ref1], ter ondersteuning van het maken van afspraken over de verdere loopbaan.


      [ref1]: https://wetten.overheid.nl/BWBR0003229#Artikel106
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel107a
    references:
      - id: ref1
        bwb_id: BWBR0003229
        artikel: '106'
        hoofdstuk: VIIa
  - number: '108'
    text: Verplichting tot zekerheidstelling wordt de ambtenaar niet opgelegd.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel108
  - number: '109.1'
    text: |-
      De ambtenaar die namens de Eerste of de Tweede Kamer der Staten-Generaal is belast met de in
      [artikel 24, tweede en derde lid, van de Comptabiliteitswet 2001][ref1] vermelde taken, is verplicht een tekort
      geheel of gedeeltelijk aan te zuiveren, wanneer hem ter zake van dat tekort een ernstig verwijt kan worden gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel24
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel109
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '24'
  - number: '109.2'
    text: |-
      De ambtenaar die namens de Eerste of de Tweede Kamer der Staten-Generaal is belast met het in
      [artikel 25, tweede lid, van de Comptabiliteitswet 2001][ref1] bedoelde beheer, is verplicht schade te vergoeden,
      wanneer hem ter zake van die schade een ernstig verwijt kan worden gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel25
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel109
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '25'
  - number: '112.1'
    text: |-
      Aan de ambtenaar kan door het bevoegd gezag de toegang tot de dienstlokalen, dienstgebouwen of het werk, dan wel
      het verblijf daar, worden ontzegd.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel112
  - number: '112.2'
    text: |-
      Hij is verplicht zich te gedragen naar de maatregelen van orde die ten aanzien van het verblijf aldaar zijn
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel112
  - number: '113'
    text: |-
      Het is de ambtenaar verboden gedurende de werktijd alcoholhoudende dranken te gebruiken, bij zich te hebben of in
      de dienstlokalen te bewaren.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel113
  - number: '114.1'
    text: |-
      De ambtenaar heeft aanspraak op een gratificatie bij ambtsjubileum volgens door Onze Minister van Binnenlandse
      Zaken en Koninkrijksrelaties te stellen regels.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel114
  - number: '114.2'
    text: |-
      De ambtenaar die een diensttijd heeft van tien jaar of meer en aan wie ontslag is verleend op grond van
      [artikel 126][ref1] of [129, eerste lid, onder f][ref2], wordt een diensttijdgratificatie toegekend, indien binnen
      een termijn van vijf jaar na de datum van ingang van het ontslag aanspraak op een gratificatie bij ambtsjubileum
      zou hebben bestaan. De diensttijdgratificatie bedraagt een in verhouding tot de doorgebrachte diensttijd evenredig
      gedeelte van een gratificatie bij ambtsjubileum als bedoeld in het eerste lid. De berekeningsgrondslag van de
      gratificatie wordt bij een ontslag op grond van [artikel 129, eerste lid, onder f][ref3], vermenigvuldigd met een
      breuk, waarvan de teller overeenkomt met het aantal uren waarvoor de ambtenaar ontslag is verleend en de noemer met
      het aantal uren waarvoor hij voorafgaand aan het ontslag was aangesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003229#Artikel126
      [ref2]: https://wetten.overheid.nl/BWBR0003229#Artikel129
      [ref3]: https://wetten.overheid.nl/BWBR0003229#Artikel129
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel114
    references:
      - id: ref1
        bwb_id: BWBR0003229
        artikel: '126'
        hoofdstuk: IX
      - id: ref2
        bwb_id: BWBR0003229
        artikel: '129'
        hoofdstuk: IX
      - id: ref3
        bwb_id: BWBR0003229
        artikel: '129'
        hoofdstuk: IX
  - number: '115.1'
    text: |-
      De ambtenaar, die de hem opgelegde verplichtingen niet nakomt of zich overigens aan plichtsverzuim schuldig maakt,
      kan deswege disciplinair worden gestraft.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel115
  - number: '115.2'
    text: |-
      Plichtsverzuim omvat zowel het overtreden van enig voorschrift als het doen of nalaten van iets, welk een goed
      ambtenaar in gelijke omstandigheden behoort na te laten of te doen.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel115
  - number: '115.3'
    text: |-
      Tenzij door Ons of door het tot aanstelling bevoegd gezag anders is bepaald, wordt de straf opgelegd door het
      gezag, dat bevoegd is tot aanstelling in het door de ambtenaar beklede ambt.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel115
  - number: '116.1'
    text: 'De disciplinaire straffen, welke kunnen worden opgelegd, zijn:'
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel116
  - number: 116.1.a
    text: schriftelijke berisping;
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel116
  - number: 116.1.b
    text: |-
      buitengewone dienst op andere dagen dan zondag en voor de ambtenaar geldende kerkelijke feestdagen, zonder beloning
      of tegen een lagere dan de normale beloning en wel voor ten hoogste 6 uren met een maximum van 3 uren per dag;
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel116
  - number: 116.1.c
    text: |-
      vermindering van het recht op jaarlijkse vakantie met ten hoogste 1/3 van het aantal uren, waarop in het
      desbetreffende kalenderjaar aanspraak bestaat;
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel116
  - number: 116.1.d
    text: geldboete van ten hoogste € 22;
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel116
  - number: 116.1.e
    text: gehele of gedeeltelijke inhouding van salaris tot een bedrag van ten hoogste het salaris over een halve maand;
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel116
  - number: 116.1.f
    text: |-
      vaststelling van het salaris op een bedrag in de voor de ambtenaar geldende salarisschaal dat maximaal
      twee jaarlijkse periodieke salarisverhogingen minder bedraagt dan ingevolge de op hem van toepassing zijnde
      bezoldigingsregeling behoort te gelden, of indien voor het door de ambtenaar beklede ambt geen salarisschaal geldt,
      vermindering van het salaris met ten hoogste 5%, een en ander voor de tijd van niet langer dan twee jaren;
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel116
  - number: 116.1.g
    text: het niet toekennen van periodieke salarisverhogingen gedurende ten hoogste vier jaren;
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel116
  - number: 116.1.h
    text: |-
      uitsluiting voor de tijd van ten hoogste vier jaren van indeling in een salarisschaal waarvoor een hoger
      maximumsalaris geldt, indien zodanige indeling anders volgens de daarvoor geldende regeling zou hebben
      plaatsgevonden;
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel116
  - number: 116.1.i
    text: |-
      indeling in een salarisschaal waarvoor een lager maximumsalaris geldt dan dat verbonden aan de salarisschaal
      welke ingevolge de van toepassing zijnde bezoldigingsregeling behoort te gelden, een en ander al dan niet voor een
      bepaalde tijd en met of zonder vermindering van bezoldiging.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel116
  - number: 116.1.j
    text: |-
      verplaatsing, al dan niet met verlening van een tegemoetkoming in mogelijke verplaatsingskosten tot ten hoogste
      het bedrag, dat in geval van verplaatsing in het belang van de dienst zou kunnen worden verleend krachtens het
      [Verplaatsingskostenbesluit 1989][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004630
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel116
    references:
      - id: ref1
        bwb_id: BWBR0004630
  - number: 116.1.k
    text: schorsing voor een bepaalde tijd met gehele of gedeeltelijke inhouding van bezoldiging;
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel116
  - number: 116.1.l
    text: ontslag.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel116
  - number: '116.2'
    text: |-
      Indien een straf, als bedoeld in het eerste lid onder *g.*, *h.* of *i.* is opgelegd, kan - zo het verdere gedrag
      van de ambtenaar naar het oordeel van het tot oplegging van de straf bevoegd gezag daartoe aanleiding heeft gegeven
        - zijn positie met ingang van een bepaald tijdstip geheel of gedeeltelijk in overeenstemming worden gebracht met de
      positie, zoals deze zonder strafoplegging zou zijn geweest.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel116
  - number: '116.3'
    text: |-
      Bij het opleggen van een straf kan worden bepaald, dat zij niet ten uitvoer zal worden gelegd, indien de ambtenaar
      zich gedurende een vastgestelde termijn niet schuldig maakt aan soortgelijk plichtsverzuim, als waarvoor de
      bestraffing plaatsvindt, noch aan enig ander ernstig plichtsverzuim en zich houdt aan bij het opleggen van de straf
      eventueel gestelde bijzondere voorwaarden.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel116
  - number: '117.1'
    text: |-
      Indien de ambtenaar verantwoording aflegt doet hij dit ten overstaan van het gezag dat tot de voorgenomen
      strafoplegging bevoegd is, of van een door dit gezag aangewezen autoriteit, tenzij bij koninklijk besluit anders
      wordt bepaald. Het gezag, ten overstaan waarvan de verantwoording zal plaatsvinden, bepaalt of deze mondeling of
      schriftelijk zal geschieden, met dien verstande dat bij schriftelijke verantwoording de ambtenaar op zijn verzoek
      gelegenheid wordt gegeven tot nadere mondelinge toelichting.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel117
  - number: '117.2'
    text: |-
      Van de mondelinge verantwoording en van een eventuele nadere mondelinge toelichting wordt aanstonds proces-verbaal
      opgemaakt, dat na voorlezing wordt getekend door hem, te wiens overstaan de verantwoording heeft plaatsgevonden, en
      door de ambtenaar. Weigert de ambtenaar de ondertekening, dan wordt daarvan in het proces-verbaal, zo mogelijk met
      vermelding van de redenen, melding gemaakt. Een afschrift van het proces-verbaal wordt aan de ambtenaar uitgereikt.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel117
  - number: 117a
    text: |-
      De ambtenaar kan niet gestraft worden wegens overtreding van [artikel 125][ref1], dan nadat daarover advies is
      ingewonnen van de Adviescommissie grondrechten en functie-uitoefening ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0001947#Artikel125a
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel117a
    references:
      - id: ref1
        bwb_id: BWBR0001947
        artikel: 125a
  - number: '118'
    text: |-
      De ambtenaar dient van ontvangst van een besluit inzake strafoplegging te doen blijken door onverwijlde
      terugzending van een door hem ondertekend en gedateerd ontvangstbewijs.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel118
  - number: '119'
    text: |-
      De straf, behalve die van schriftelijke berisping, wordt niet ten uitvoer gelegd, zolang zij niet onherroepelijk is
      geworden, tenzij bij de strafoplegging onmiddellijke tenuitvoerlegging is bevolen.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel119
  - number: '120'
    text: |-
      De ambtenaar is van rechtswege in zijn ambt geschorst, wanneer hij krachtens wettelijke maatregel van zijn
      vrijheid is beroofd, tenzij de vrijheidsbeneming het gevolg is van een maatregel, anders dan op grond van de
      [Wet bijzondere opnemingen in psychiatrische ziekenhuizen][ref1], genomen in het belang van de volksgezondheid.


      [ref1]: https://wetten.overheid.nl/BWBR0005700
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel120
    references:
      - id: ref1
        bwb_id: BWBR0005700
  - number: '121.1'
    text: Onverminderd het bepaalde in artikel 116, eerste lid onder *k.*, kan de ambtenaar in zijn ambt worden geschorst
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel121
  - number: 121.1.a
    text: indien een strafrechtelijke vervolging ter zake van misdrijf tegen hem is ingesteld;
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel121
  - number: 121.1.b
    text: |-
      wanneer hem door het daartoe bevoegde gezag het voornemen tot bestraffing met onvoorwaardelijk ontslag is te kennen
      gegeven, dan wel hem die straf is opgelegd;
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel121
  - number: 121.1.c
    text: wanneer naar het oordeel van het tot aanstelling bevoegd gezag, het belang van de dienst zulks vordert.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel121
  - number: '121.2'
    text: Schorsing geschiedt door het gezag, dat bevoegd is tot aanstelling in het ambt, waarin geschorst wordt.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel121
  - number: '122.1'
    text: |-
      Tijdens de schorsing kan de bezoldiging voor een/derde gedeelte worden ingehouden; na verloop van zes weken kan
      een verdere inhouding, ook van het volle bedrag der bezoldiging, plaatsvinden. Geen inhouding vindt plaats in
      geval van schorsing in het belang van de dienst, bedoeld in het eerste lid onder *c.* van het vorige artikel, van
      plaatsing in een krankzinnigengesticht of daarmede gelijk te stellen inrichting dan wel van politiebewaring of
      inverzekeringstelling als bedoeld in [artikel 57 van het Wetboek van Strafvordering][ref1], mits niet gevolgd door
      inbewaringstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel57
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel122
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '57'
  - number: '122.2'
    text: |-
      De ingehouden bezoldiging kan alsnog geheel of gedeeltelijk aan de ambtenaar worden uitbetaald, indien de schorsing
      niet wordt gevolgd door een onvoorwaardelijk ontslag bij wijze van straf of ontslag op grond van artikel 129 eerste
      lid onder *e.* Op de aldus uit te keren bezoldiging worden in mindering gebracht de inkomsten, welke de ambtenaar
      sedert de schorsing heeft genoten uit arbeid, die hij als gevolg van de schorsing heeft kunnen verrichten, tenzij
      zulks naar het oordeel van het tot aanstelling bevoegd gezag onredelijk of onbillijk is.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel122
  - number: '122.3'
    text: Het niet ingehouden gedeelte van de bezoldiging van de geschorste ambtenaar kan aan anderen worden uitbetaald.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel122
  - number: '122.4'
    text: |-
      In geval van schorsing tijdens ziekte van de ambtenaar wordt onder bezoldiging verstaan, hetgeen daaronder voor de
      toepassing van Hoofdstuk VI wordt verstaan.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel122
  - number: '123'
    text: Ontslag wordt gegeven door het gezag, dat bevoegd is tot aanstelling in het desbetreffende ambt.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel123
  - number: '124.1'
    text: De ambtenaar wordt op zijn aanvraag ontslag verleend.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel124
  - number: '124.2'
    text: |-
      Behoudens in het geval, bedoeld in artikel 68, eerste lid, wordt dat ontslag verleend met ingang van een dag niet
      vroeger dan een maand of later dan drie maanden na de dag, waarop de aanvraag om ontslag is ingekomen.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel124
  - number: '124.3'
    text: |-
      Van het bepaalde in het eerste lid kan worden afgeweken, indien een strafrechtelijke vervolging ter zake van
      misdrijf tegen de ambtenaar is ingesteld of indien wordt overwogen de disciplinaire straf van ontslag op te leggen.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel124
  - number: '124.4'
    text: 'Van het bepaalde in het tweede lid kan worden afgeweken:'
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel124
  - number: 124.4.a
    text: indien wordt overwogen de ambtenaar een disciplinaire straf op te leggen;
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel124
  - number: 124.4.b
    text: |-
      indien het belang van de dienst zulks vordert met dien verstande, dat de termijn van drie maanden, vermeld in het
      tweede lid, tot ten hoogste zes maanden kan worden verlengd en dat bij de verlenging in redelijkheid met het belang
      van de ambtenaar rekening wordt gehouden;
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel124
  - number: 124.4.c
    text: ingevolge een aanvraag van de ambtenaar.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel124
  - number: '124.5'
    text: Het ontslag op aanvraag van de ambtenaar wordt eervol verleend.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel124
  - number: 124a.1
    text: |-
      Onder de Centrale vut-overeenkomst overheids- en onderwijspersoneel, als bedoeld in dit artikel, wordt verstaan de
      overeenkomst die is aangegaan op grond van [artikel 2 van de Wet kaderregeling vut overheidspersoneel][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007792#Artikel2
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel124a
    references:
      - id: ref1
        bwb_id: BWBR0007792
        artikel: '2'
  - number: 124a.2
    text: |-
      Aan de ambtenaar die ontslag vraagt met het oog op een uitkering op grond van de Regeling flexibel pensioen en
      uittreden, bedoeld in artikel 3 van de Centrale vut-overeenkomst overheids- en onderwijspersoneel en artikel
      1.5 van het Pensioenreglement van de Stichting pensioenfonds Abp wordt ontslag verleend, indien het bestuur
      van de Stichting fonds vrijwillig vervroegd uittreden overheidspersoneel alsmede het bestuur van de Stichting
      Pensioenfonds Abp op grond van een desbetreffende aanvraag hebben vastgesteld dat na dat te verlenen ontslag recht
      bestaat op een uitkering op grond van die regeling. Het ontslag gaat niet eerder in dan met ingang van de dag
      waarop het recht op de in de vorige volzin bedoelde uitkering ontstaat.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel124a
  - number: 124a.3
    text: |-
      Op aanvraag van de ambtenaar kan het in het tweede lid genoemde ontslag ook voor een gedeelte van de voor hem
      geldende arbeidsduur worden verleend, tenzij de belangen van de dienst zich hiertegen verzetten. Het gedeelte
      van dit ontslag bedraagt ten minste 10% van de omvang van de dienstverhouding. Ontslag voor een gedeelte van de
      arbeidsduur waaruit reeds eerder gedeeltelijk ontslag met het oog op de in het tweede lid bedoelde uitkering heeft
      plaatsgevonden bedraagt ten minste 10% van de oorspronkelijke arbeidsduur.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel124a
  - number: 124a.4
    text: |-
      [Artikel 124, tweede tot en met vijfde lid][ref1], is zoveel mogelijk van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003229#Artikel124
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel124a
    references:
      - id: ref1
        bwb_id: BWBR0003229
        artikel: '124'
        hoofdstuk: IX
  - number: '125.1'
    text: |-
      Aan de ambtenaar die is aangesteld in tijdelijke dienst wordt geacht eervol ontslag te zijn verleend zodra de duur
      van de aanstelling in tijdelijke dienst is verstreken, tenzij sprake is van een stilzwijgende voortzetting als
      bedoeld in [artikel 6, vierde of vijfde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003229#Artikel6
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel125
    references:
      - id: ref1
        bwb_id: BWBR0003229
        artikel: '6'
        hoofdstuk: II
        paragraaf: '1'
  - number: '125.2'
    text: |-
      Aan de ambtenaar die is aangesteld in tijdelijke dienst kan ontslag worden verleend, mits een opzegtermijn in acht
      wordt genomen van:
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel125
  - number: 125.2.a
    text: |-
      drie maanden, indien de ambtenaar ten tijde van de opzegging laatstelijke tenminste twaalf maanden onafgebroken in
      dienst is geweest;
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel125
  - number: 125.2.b
    text: |-
      twee maanden, indien de ambtenaar ten tijde van de opzegging laatstelijke tenminste zes maanden doch korter dan
      twaalf maanden onafgebroken in dienst is geweest;
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel125
  - number: 125.2.c
    text: |-
      één maand, indien de ambtenaar ten tijde van de opzegging laatstelijk korter dan zes maanden onafgebroken in dienst
      is geweest.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel125
  - number: '125.3'
    text: |-
      Opzegging als in het vorige lid bedoeld kan niet geschieden gedurende de zwangerschap van de vrouwelijke ambtenaar,
      noch gedurende het verlof bedoeld in [artikel 62c, vierde lid][ref1], noch – indien zij haar dienst heeft vervat
      – gedurende een periode van zes weken volgend op dat verlof. Het bevoegd gezag kan ter staving van de zwangerschap
      een verklaring van een arts of van een verloskundige verlangen.


      [ref1]: https://wetten.overheid.nl/BWBR0003229#Artikel62c
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel125
    references:
      - id: ref1
        bwb_id: BWBR0003229
        artikel: 62c
        hoofdstuk: V
        paragraaf: '2'
  - number: '125.4'
    text: |-
      Opzegging als bedoeld in het tweede lid kan niet geschieden wegens het aanvragen of het opnemen van
      ouderschapsverlof.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel125
  - number: '125.5'
    text: |-
      Opzegging als bedoeld in het tweede lid kan niet geschieden wegens de omstandigheid dat de ambtenaar in of buiten
      rechte een beroep heeft gedaan op het beginsel van gelijke behandeling van mannen en vrouwen.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel125
  - number: '125.6'
    text: |-
      Opzegging als bedoeld in het tweede lid kan niet plaatsvinden wegens het feit dat de ambtenaar door een centrale
      als bedoeld in [artikel 138][ref1] of door een daarbij aangesloten vereniging is aangewezen om bestuurlijke
      of vertegenwoordigende aktiviteiten te ontplooien binnen zijn centrale of een daarbij aangesloten vereniging
      dan wel binnen de organisatie van de werkgever, die er toe strekken de doelstellingen van zijn centrale van
      overheidspersoneel en daarbij aangesloten verenigingen te ondersteunen.


      [ref1]: https://wetten.overheid.nl/BWBR0003229#Artikel138
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel125
    references:
      - id: ref1
        bwb_id: BWBR0003229
        artikel: '138'
        hoofdstuk: X
        paragraaf: '1'
  - number: '125.7'
    text: |-
      Opzegging als bedoeld in het tweede lid kan niet geschieden wegens de omstandigheid dat de ambtenaar is geplaatst
      op een kandidatenlijst als bedoeld in [artikel 9 van de Wet op de ondernemingsraden][ref1], noch wegens het
      lidmaatschap of het korter dan twee jaar geleden beëindigde lidmaatschap van de ambtenaar van de ondernemingsraad
      of van een commissie van die raad.


      [ref1]: https://wetten.overheid.nl/BWBR0002747#Artikel9
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel125
    references:
      - id: ref1
        bwb_id: BWBR0002747
        artikel: '9'
  - number: '125.8'
    text: |-
      Het ontslag kan, al dan niet op aanvraag van de ambtenaar, ingaan voor de afloop van de opzeggingstermijn.
      Indien dit niet op de aanvraag van de ambtenaar geschiedt, wordt hem over de tijd, welke aan de opzeggingstermijn
      ontbreekt, een bedrag uitbetaald gelijk aan de laatstgenoten bezoldiging, vermeerderd met de vakantie-uitkering en
      de eindejaarsuitkering.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel125
  - number: '126.1'
    text: |-
      De ambtenaar kan in het kader van een reorganisatie eervol ontslag worden verleend indien het niet mogelijk is
      gebleken om hem te herplaatsen in een passende functie.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel126
  - number: '126.2'
    text: |-
      Aan de ambtenaar die in het kader van een reorganisatie is herplaatst kan alsnog het ontslag, bedoeld in het eerste
      lid worden verleend indien binnen een periode van uiterlijk één jaar te rekenen vanaf de datum waarop de functie
      is opgedragen, blijkt dat de betreffende functie niet passend is voor die ambtenaar en het niet mogelijk is om de
      ambtenaar binnen een redelijke termijn op een passende functie te plaatsen.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel126
  - number: '126.3'
    text: |-
      Bij een ontslagverlening op grond van het eerste lid van dit artikel wordt een opzeggingstermijn van drie maanden
      in acht genomen. Bij een ontslagverlening op grond van het tweede lid van dit artikel geldt geen opzeggingstermijn.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel126
  - number: '127.1'
    text: |-
      Aan de ambtenaar die in verband met de aanvaarding van een functie in een publiekrechtelijk college, waarin hij
      is benoemd of verkozen, tijdelijk is ontheven van de waarneming van zijn ambt, wordt, indien hij ophoudt zodanige
      functie te bekleden en hij naar het oordeel van het tot aanstelling bevoegd gezag niet in actieve dienst kan worden
      hersteld, eervol ontslag verleend.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel127
  - number: '127.2'
    text: |-
      Tenzij [artikel 68, eerste lid][ref1], van toepassing is, wordt eervol ontslag eveneens verleend aan de ambtenaar,
      die na afloop van het verlof, verleend met toepassing van [artikel 63][ref2], uitgezonderd het vierde en vijfde
      lid en in verband met het vervullen van een functie bij een internationale volkenrechtelijke organisatie, naar het
      oordeel van het bevoegd gezag niet in actieve dienst kan worden hersteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003229#Artikel68
      [ref2]: https://wetten.overheid.nl/BWBR0003229#Artikel63
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel127
    references:
      - id: ref1
        bwb_id: BWBR0003229
        artikel: '68'
        hoofdstuk: V
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0003229
        artikel: '63'
        hoofdstuk: V
        paragraaf: '2'
  - number: '127.3'
    text: |-
      Het eerste lid vindt eveneens toepassing voor de ambtenaar die ophoudt de functie te bekleden, bedoeld in
      [artikel 24, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003229#Artikel24
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel127
    references:
      - id: ref1
        bwb_id: BWBR0003229
        artikel: '24'
        hoofdstuk: III
  - number: 127a
    text: |-
      Aan de ambtenaar die een benoeming tot minister of staatssecretaris aanvaardt, wordt met ingang van de dag van het
      aanvaarden van deze betrekking, eervol ontslag verleend.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel127a
  - number: '128'
    text: |-
      Een ontslag als bedoeld in [artikel 125][ref1], wordt verleend door het tot aanstelling bevoegd gezag. Dit is
      gehouden het advies in te winnen van de Adviescommissie grondrechten en functie-uitoefening ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0001947#Artikel125e
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel128
    references:
      - id: ref1
        bwb_id: BWBR0001947
        artikel: 125e
  - number: '129.1'
    text: |-
      Anders dan op aanvraag, bij wijze van straf of ingevolge het bepaalde bij
      [artikel 7 van de Wet Incompatibiliteiten Staten-Generaal en Europees Parlement][ref1],
      de [artikelen 125][ref2], [126][ref3], [127][ref4] en [127a][ref5] van dit besluit en bij
      [artikel 125e, tweede lid, van de Ambtenarenwet][ref6], kan de ambtenaar worden ontslagen op grond van:


      [ref1]: https://wetten.overheid.nl/BWBR0006612#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0003229#Artikel125
      [ref3]: https://wetten.overheid.nl/BWBR0003229#Artikel126
      [ref4]: https://wetten.overheid.nl/BWBR0003229#Artikel127
      [ref5]: https://wetten.overheid.nl/BWBR0003229#Artikel127a
      [ref6]: https://wetten.overheid.nl/BWBR0001947#Artikel125e
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel129
    references:
      - id: ref1
        bwb_id: BWBR0006612
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0003229
        artikel: '125'
        hoofdstuk: IX
      - id: ref3
        bwb_id: BWBR0003229
        artikel: '126'
        hoofdstuk: IX
      - id: ref4
        bwb_id: BWBR0003229
        artikel: '127'
        hoofdstuk: IX
      - id: ref5
        bwb_id: BWBR0003229
        artikel: 127a
        hoofdstuk: IX
      - id: ref6
        bwb_id: BWBR0001947
        artikel: 125e
  - number: 129.1.a
    text: |-
      het verlies van een vereiste voor de benoembaarheid, door het tot aanstelling bevoegd gezag gesteld bij een
      regeling aan de benoeming voorafgegaan, tenzij het vereiste alleen voor de aanvang van het ambt geldt;
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel129
  - number: 129.1.b
    text: het aangaan van een graad van zwagerschap, die de benoembaarheid tot het ambt zou uitsluiten;
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel129
  - number: 129.1.c
    text: onherroepelijk geworden rechterlijke uitspraak waarbij de ambtenaar onder curatele is gesteld;
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel129
  - number: 129.1.d
    text: het ondergaan van lijfsdwang wegens schulden krachtens onherroepelijk geworden rechterlijke uitspraak;
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel129
  - number: 129.1.e
    text: onherroepelijk geworden veroordeling tot vrijheidsstraf wegens misdrijf;
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel129
  - number: 129.1.f
    text: ongeschiktheid tot het verrichten van zijn arbeid wegens ziekte;
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel129
  - number: 129.1.g
    text: onbekwaamheid of ongeschiktheid voor het door hem beklede ambt anders dan op grond van ziels- of lichaamsgebreken;
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel129
  - number: 129.1.h
    text: het bereiken van de pensioengerechtigde leeftijd;
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel129
  - number: 129.1.i
    text: |-
      het bij of in verband met indiensttreding en/of keuring verstrekken van onjuiste of onvolledige inlichtingen,
      zonder welke handelwijze niet tot indienstneming of goedkeuring zou zijn overgegaan, tenzij de ambtenaar
      aannemelijk maakt dat hij te goeder trouw heeft gehandeld.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel129
  - number: '129.2'
    text: |-
      Een ontslag op grond van het bepaalde in het eerste lid onder *a.*, *b.*, *f.*, *g.* en *h.* wordt steeds eervol
      verleend.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel129
  - number: '129.3'
    text: 'Een ontslag als bedoeld in het eerste lid, onderdeel *f*, kan slechts plaatsvinden indien:'
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel129
  - number: 129.3.a
    text: |-
      er sprake is van ongeschiktheid tot het verrichten van zijn arbeid wegens ziekte gedurende een ononderbroken
      periode van twee jaar,
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel129
  - number: 129.3.b
    text: |-
      herstel van zijn ziekte niet binnen een periode van zes maanden na de in onderdeel *a* genoemde termijn van twee
      jaar te verwachten is, en
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel129
  - number: 129.3.c
    text: |-
      het bevoegd gezag van oordeel is dat duurzame reïntegratie in arbeid die aansluit bij de benutbare mogelijkheden
      van de ambtenaar, niet binnen een redelijke termijn te verwachten is.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel129
  - number: '129.4'
    text: 'De termijn van twee jaar, bedoeld in het derde lid, onderdeel a, wordt verlengd:'
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel129
  - number: 129.4.a
    text: |-
      met de duur van de vertraging indien het tot aanstelling bevoegde gezag de aangifte, bedoeld in
      [artikel 38, eerste lid, van de Ziektewet][ref1] later doet dan op grond van [dat artikel van de Ziektewet][ref2]
      is voorgeschreven;


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel38
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel129
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '38'
      - id: ref2
        bwb_id: BWBR0001888
        artikel: '38'
  - number: 129.4.b
    text: |-
      met de duur van de verlenging van de wachttijd, bedoeld in [artikel 23, eerste lid, van de WIA][ref1], indien de
      wachttijd op grond van [artikel 24, eerste lid, van de WIA][ref2] wordt verlengd;


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel24
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel129
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '23'
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '24'
  - number: 129.4.c
    text: |-
      met de duur van het tijdvak dat het UWV op grond van [artikel 25, negende lid, van de WIA][ref1] heeft vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel25
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel129
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '25'
  - number: '129.5'
    text: |-
      Voor de berekening van het tijdvak van twee jaar, bedoeld in het derde lid, onderdeel a, worden perioden van
      ongeschiktheid tot het verrichten van arbeid wegens ziekte tengevolge van zwangerschap voorafgaand aan het
      zwangerschapsverlof en perioden van ongeschiktheid tijdens het zwangerschaps- of bevallingsverlof, bedoeld in
      [artikel 3:1, tweede en derde lid, van de Wet arbeid en zorg][ref1], niet in aanmerking genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel129
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '3'
  - number: '129.6'
    text: |-
      Perioden van ongeschiktheid tot het verrichten van zijn arbeid, anders dan bedoeld in het vijfde lid, worden
      samengeteld indien zij elkaar met een onderbreking van minder dan vier weken opvolgen, of indien zij direct
      voorafgaan aan en aansluiten op een periode waarin zwangerschaps- of bevallingsverlof wordt genoten overeenkomstig
      [artikel 3:1, tweede en derde lid, van de Wet arbeid en zorg][ref1], tenzij de ongeschiktheid redelijkerwijs niet
      geacht kan worden voort te vloeien uit dezelfde oorzaak.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel129
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '3'
  - number: '129.7'
    text: |-
      Bij de beoordeling of er sprake is van een situatie als bedoeld in het derde lid, betrekt het bevoegd gezag de
      uitslag van de beoordeling door het UWV van de claim in het kader van de [WIA][ref1]. Indien deze beoordeling niet
      of langer dan een jaar geleden heeft plaatsgevonden, vraagt het bevoegd gezag aan het UWV een oordeel als bedoeld
      in [artikel 32, eerste lid, van de Wet SUWI][ref2] en betrekt dit bij zijn beoordeling.


      [ref1]: https://wetten.overheid.nl/BWBR0019057
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel32
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel129
    references:
      - id: ref1
        bwb_id: BWBR0019057
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '32'
  - number: '129.8'
    text: |-
      Indien herplaatsing als bedoeld in [artikel 72a][ref1] plaatsvindt in een betrekking voor minder uren dan het
      aantal waarvoor de ambtenaar was aangesteld, heeft het ontslag uitsluitend betrekking op het meerdere aantal uren.


      [ref1]: https://wetten.overheid.nl/BWBR0003229#Artikel72a
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel129
    references:
      - id: ref1
        bwb_id: BWBR0003229
        artikel: 72a
        hoofdstuk: VI
        paragraaf: '3'
  - number: '130'
    text: |-
      Indien aan de ambtenaar gedurende de tijd, dat hij recht heeft op wachtgeld, daaronder mede begrepen
      herplaatsingswachtgeld, een uitkering krachtens de [Uitkeringsregeling 1966][ref1] of een suppletie op grond van
      de [Suppletieregeling gedeeltelijk arbeidsongeschikten sector Rijk][ref2], een voor hem passend geachte betrekking
      is aangeboden en die betrekking binnen een periode van uiterlijk één jaar, nadat hij haar is gaan vervullen, niet
      passend voor hem blijkt te zijn, kan hem binnen die periode op zijn aanvraag eervol ontslag uit die betrekking
      worden verleend, welk ontslag ten aanzien van zijn aanspraken op een wachtgeld of uitkering als evenbedoeld, wordt
      geacht niet door eigen toedoen te zijn verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0002537
      [ref2]: https://wetten.overheid.nl/BWBR0007758
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel130
    references:
      - id: ref1
        bwb_id: BWBR0002537
      - id: ref2
        bwb_id: BWBR0007758
  - number: 130a.1
    text: |-
      Aan de ambtenaar die ten gevolge van ziekte verhinderd is zijn arbeid te verrichten kan ontslag worden verleend,
      indien hij zonder deugdelijke grond weigert:
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel130a
  - number: 130a.1.a
    text: |-
      gevolg te geven aan door het bevoegd gezag of een door het bevoegd gezag aangewezen deskundige gegeven redelijke
      voorschriften of mee te werken aan door het bevoegd gezag of een door het bevoegd gezag aangewezen deskundige
      getroffen maatregelen om hem in staat te stellen de eigen of passende andere arbeid te verrichten, of
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel130a
  - number: 130a.1.b
    text: passende arbeid te verrichten waartoe het bevoegd gezag hem in de gelegenheid stelt, of
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel130a
  - number: 130a.1.c
    text: |-
      zijn medewerking te verlenen aan het opstellen, evalueren of bijstellen van een plan van aanpak als bedoeld in
      [artikel 25, tweede lid, van de WIA][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel25
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel130a
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '25'
  - number: 130a.1.d
    text: een WIA- uitkering aan te vragen.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel130a
  - number: 130a.2
    text: |-
      Bij de beoordeling of er sprake is van een situatie als bedoeld in het eerste lid, kan het bevoegd gezag de uitslag
      van de beoordeling door het UWV van de claim in het kader van de [WIA][ref1] betrekken indien deze minder dan een
      jaar geleden heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0019057
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel130a
    references:
      - id: ref1
        bwb_id: BWBR0019057
  - number: '131.1'
    text: |-
      Door de Kamer, door de Gemengde Commissie, dan wel door de Gemengde Commissie van toezicht kan aan een ambtenaar
      in vaste dienst ook op andere gronden dan die in artikel 129 zijn geregeld of waarnaar in dat artikel is verwezen,
      ontslag worden gegeven. Dat ontslag wordt dan eervol verleend.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel131
  - number: '131.2'
    text: |-
      In geval van ontslag ingevolge het eerste lid wordt door het tot ontslagverlening bevoegde gezag een
      voorziening getroffen waarbij de ambtenaar een uitkering verleend wordt, die, naar het oordeel van
      dat bevoegde gezag, met het oog op de omstandigheden redelijk is te achten. Deze uitkering zal ten
      minste gelijk zijn aan het voor de ambtenaar geldende totaal van uitkeringen berekend op basis van de
      [Werkloosheidswet][ref1] en het [Besluit bovenwettelijke uitkeringen bij werkloosheid voor de sector Rijk][ref2],
      als ware als gevolg van het ontslag geen sprake van verwijtbare werkloosheid als bedoeld in
      [artikel 24 van de Werkloosheidswet][ref3]. Voor zover door het bevoegde gezag ten gunste van de
      ambtenaar niet anders is beslist, zijn op de uitkering voor het overige de [Werkloosheidswet][ref4] en het
      [Besluit bovenwettelijke uitkeringen bij werkloosheid voor de sector Rijk][ref5] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0008114
      [ref3]: https://wetten.overheid.nl/BWBR0004045#Artikel24
      [ref4]: https://wetten.overheid.nl/BWBR0004045
      [ref5]: https://wetten.overheid.nl/BWBR0008114
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel131
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0008114
      - id: ref3
        bwb_id: BWBR0004045
        artikel: '24'
      - id: ref4
        bwb_id: BWBR0004045
      - id: ref5
        bwb_id: BWBR0008114
  - number: '131.3'
    text: |-
      Indien de ambtenaar terzake van zijn ontslag ingevolge het eerste lid recht heeft op een uitkering krachtens de
      [Werkloosheidswet][ref1] of het [Besluit bovenwettelijke uitkeringen bij werkloosheid voor de sector Rijk][ref2],
      wordt de in het tweede lid bedoelde uitkering met die uitkering verminderd.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0008114
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel131
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0008114
  - number: 132a.1
    text: |-
      De ambtenaar aan wie op zijn aanvraag eervol ontslag wordt verleend in verband met de aanvaarding van een functie
      buiten de overheid, heeft op grond van zijn ontslag als ambtenaar aanspraak op een uitkering overeenkomstig het
      [Besluit bovenwettelijke uitkeringen bij werkloosheid voor de sector Rijk][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008114
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel132a
    references:
      - id: ref1
        bwb_id: BWBR0008114
  - number: 132a.2
    text: |-
      Het bepaalde in het eerste lid geldt slechts indien de ambtenaar is aangewezen als herplaatsingskandidaat als
      bedoeld in de artikelen 84d en 84e en hij binnen twee jaar na zijn indiensttreding buiten de overheid buiten zijn
      schuld of toedoen wordt ontslagen.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel132a
  - number: 132a.3
    text: |-
      Indien de ambtenaar terzake van zijn ontslag ingevolge het tweede lid recht heeft op een uitkering krachtens de
      [Werkloosheidswet][ref1] wordt de in het eerste lid bedoelde uitkering met die uitkering verminderd.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel132a
    references:
      - id: ref1
        bwb_id: BWBR0004045
  - number: '134.1'
    text: De bezoldiging van de ambtenaar wordt uitbetaald tot en met de dag van overlijden.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel134
  - number: '134.2'
    text: |-
      Indien de ambtenaar bij zijn overlijden een positief of negatief vakantiesaldo heeft, vinden
      [artikel 37, eerste en tweede lid][ref1], overeenkomstige toepassing. Het aldus openstaande bedrag en de reeds
      voor zijn overlijden aan de ambtenaar uitbetaalde bezoldiging over een na zijn overlijden gelegen tijdvak worden
      verrekend met het eventueel aan de nagelaten betrekkingen of rechtverkrijgenden van de ambtenaar verschuldigde
      bedrag wegens nog niet vergolden aanspraken van de ambtenaar, en bij gebreke hiervan of indien dit bedrag daarvoor
      niet toereikend is, op de uitkering, bedoeld in het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0003229#Artikel37
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel134
    references:
      - id: ref1
        bwb_id: BWBR0003229
        artikel: '37'
        hoofdstuk: V
        paragraaf: '1'
  - number: '134.3'
    text: |-
      Aan de nabestaande, van wie de overleden ambtenaar niet duurzaam gescheiden leefde, wordt een bedrag uitgekeerd
      gelijk aan de bezoldiging over drie maanden vermeerderd met de vakantie-uitkering en de eindejaarsuitkering
      hierover. Indien de ambtenaar op de dag direct voorafgaand aan zijn overlijden aanspraak maakte op een uitkering op
      grond van de [Ziektewet][ref1], [Werkloosheidswet][ref2] of de [WIA][ref3], wordt als maatstaf voor de bezoldiging
      uitgegaan van de bezoldiging die hij zou hebben genoten als hij op die dag arbeidsgeschikt zou zijn geweest.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0004045
      [ref3]: https://wetten.overheid.nl/BWBR0019057
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel134
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0004045
      - id: ref3
        bwb_id: BWBR0019057
  - number: '134.4'
    text: |-
      Indien de ambtenaar in het genot was van een toelage als bedoeld in [artikel 17][ref1] of
      [18a van het Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref2], wordt de in het derde lid bedoelde
      bezoldiging in zoverre gesteld op het gemiddelde van het bedrag dat de overleden ambtenaar is toegekend of
      zou zijn toegekend in de drie kalendermaanden voorafgaande aan de dag van overlijden, of het intreden van de
      arbeidsongeschiktheid.


      [ref1]: https://wetten.overheid.nl/BWBR0003630#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0003630#Artikel18a
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel134
    references:
      - id: ref1
        bwb_id: BWBR0003630
        artikel: '17'
      - id: ref2
        bwb_id: BWBR0003630
        artikel: 18a
  - number: '134.5'
    text: |-
      Op het bedrag, bedoeld in het derde lid, wordt in mindering gebracht een uitkering op grond van
      [artikel 35 van de ZW][ref1], [artikel 74 van de WIA][ref2], artikel 11.17 van het pensioenreglement of andere naar
      aard en strekking hiermee overeenkomende uitkeringen die voortvloeien uit dezelfde dienstbetrekking.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel74
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel134
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '35'
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '74'
  - number: '134.6'
    text: |-
      Bij ontstentenis van een nabestaande, van wie de overledene niet duurzaam gescheiden leefde, geschiedt de
      uitkering, bedoeld in het derde lid, ten behoeve van de minderjarige kinderen. Onder kinderen in de zin van dit
      artikel worden mede verstaan natuurlijke kinderen en kinderen waarover de overledene de pleegouderlijke zorg droeg.
      Onder pleegouderlijke zorg wordt verstaan de zorg voor het onderhoud en de opvoeding van het kind als was het een
      eigen kind, onafhankelijk van enige verplichting daartoe of van het genieten van een vergoeding daarvoor. Ontbreken
      ook zodanige kinderen dan geschiedt de uitkering aan degenen die geheel of grotendeels afhankelijk waren van de
      bezoldiging van de ambtenaar.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel134
  - number: '134.7'
    text: |-
      Indien de ambtenaar geen betrekkingen als bedoeld in het derde en zesde lid, nalaat, kan de daar bedoelde uitkering
      door het bevoegd gezag geheel of ten dele worden uitgekeerd voor de betaling van de kosten van de laatste ziekte en
      van de lijkbezorging indien de nalatenschap van de overledene hiertoe ontoereikend is.
    url: https://wetten.overheid.nl/BWBR0003229/2010-01-13#Artikel134
  - number: 134a
    text: |-
      Na het overlijden van de gewezen ambtenaar, die op de dag van zijn overlijden op grond van de [artikelen 73][ref1]
      en [81][ref2]in het genot was van doorbetaling van zijn laatstelijk genoten bezoldiging, wordt aan de in
      [artikel 134][ref3] bedoelde personen en met overeenkomstige toepassing van dat artikel een bedrag uitgekeerd,
      gelijk aan de bezoldiging welke de gewezen ambtenaar op de dag van zijn overlijden genoot, berekend over een
      tijdvak van drie maanden. Op deze uitkering wordt in mindering gebracht het bedrag van de uitkering op grond
      van de [artikelen 35][ref4] en [36 van de ZW][ref5], [artikel 74 van de WIA][ref6], de [artikelen 6][ref7] en
      [11 van het Besluit bovenwettelijke uitkeringen bij werkloosheid voor de sector Rijk][ref8] of naar aard en
      strekking daarmee overeenkomende uitkeringen die voortvloeien uit dezelfde dienstbetrekking. Alleen uitkeringen die
      voortvloeien uit de dienstbetrekking bij Onze Minister worden in mindering gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0003229#Artikel73
      [ref2]: https://wetten.overheid.nl/BWBR0003229#Artikel81
      [ref3]: https://wetten.overheid.nl/BWBR0003229#Artikel134
      [ref4]: https://wetten.overheid.nl/BWBR0001888#Artikel35
      [ref5]: https://wetten.overheid.nl/BWBR0001888#Artikel36
      [ref6]: https://wetten.overheid.nl/BWBR0019057#Artikel74
