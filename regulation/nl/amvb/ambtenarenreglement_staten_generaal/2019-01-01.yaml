preamble:
  text: |-
    Wij Juliana, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Op de voordracht van Onze Minister van Binnenlandse Zaken van 6 november 1978, nr. AB78/1727, Directoraat-Generaal
    voor Overheidspersoneelsbeleid, Directie Overheidspersoneelszaken, Afdeling Algemene en Juridische Zaken, daarmede
    handelende in overeenstemming met het verzoek van de Voorzitters van de beide Kamers der Staten-Generaal bij brief
    van 12 mei 1977;

    Gelet op artikel 125, eerste lid van de Ambtenarenwet 1929;

    De Raad van State gehoord (advies van 6 december 1978, nr. 8);

    Gezien het nader rapport van Onze Minister van Binnenlandse Zaken van 19 februari 1979, nr. AB78/2288; Directoraat-
    Generaal voor Overheidspersoneelsbeleid, Directie Overheidspersoneelszaken, Afdeling Algemene en Juridische Zaken;

    Hebben goedgevonden en verstaan:

    vast te stellen de navolgende bepalingen.
  url: https://wetten.overheid.nl/BWBR0003229/2019-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In dit besluit wordt verstaan onder:

        - *«ambtenaar»:* degene die door het bevoegd gezag is aangesteld om in burgerlijke openbare dienst bij de Staten-
      Generaal werkzaam te zijn;
        - *«bevoegd gezag»:* het tot aanstelling bevoegd gezag, bedoeld in het derde lid;
        - *«griffier»:* de door elk der kamers benoemde griffier;
        - *«kamer»:* de desbetreffende Kamer der Staten-Generaal.

      2 De in dit besluit bedoelde bevoegdheden van de kamer kunnen uitsluitend worden uitgeoefend ten aanzien van de
      ambtenaren die in dienst zijn van de desbetreffende kamer.

      3 De kamer, het presidium van de Tweede Kamer der Staten-Generaal, de griffier van de Tweede Kamer der Staten-
      Generaal, onderscheidenlijk de huishoudelijke commissie van de Eerste Kamer der Staten-Generaal is het bevoegd
      gezag.
    url: https://wetten.overheid.nl/BWBR0003229/2019-01-01#Artikel1
  - number: '2'
    text: |-
      Het [Algemeen Rijksambtenarenreglement][ref1], met uitzondering van de [artikelen 4, eerste lid, onder f][ref2],
      [4a][ref3], [5a][ref4], [9, twaalfde lid][ref5], [12c, vierde lid][ref6], [24, derde lid][ref7],
      [33e, tweede lid][ref8], [50, tweede en derde lid][ref9], [58, tweede en derde lid][ref10], [63a][ref11],
      [68a][ref12], [71][ref13], [71a, derde lid][ref14], en [73][ref15], is van overeenkomstige toepassing op de
      ambtenaar, met dien verstande dat voor «Onze Minister» telkens wordt gelezen «het bevoegd gezag», voor «ministerie»
      «de desbetreffende kamer» voor «hoofd van dienst» «de griffier» en voor «departementaal overleg» «overleg bij de
      Staten-Generaal».


