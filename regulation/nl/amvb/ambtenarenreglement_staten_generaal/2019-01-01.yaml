  - number: '3'
    text: |-
      De ambtenaar is geen lid van de Algemene Bestuursdienst of van de daaronder begrepen topmanagementgroep, bedoeld in
      [artikel 4, vijfde lid, van het Algemeen Rijksambtenarenreglement][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel4
    url: https://wetten.overheid.nl/BWBR0003229/2019-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '4'
  - number: '4'
    text: De werkzaamheden van de ambtenaar worden niet als substantieel bezwarend aangemerkt.
    url: https://wetten.overheid.nl/BWBR0003229/2019-01-01#Artikel4
  - number: '5'
    text: |-
      1 De ambtenaar die de functie van griffier uitoefent, ontvangt een maandelijkse tegemoetkoming van € 538,13 in
      verband met representatiekosten.

      2 De ambtenaar die de functie van plaatsvervangend griffier uitoefent of de functie van griffier ten minste drie
      maanden waarneemt, ontvangt een maandelijkse tegemoetkoming van 75% van het in het eerste lid genoemde bedrag in
      verband met representatiekosten.

      3 De ambtenaar die een andere functie dan de in het tweede lid genoemde functie uitoefent waaraan
      representatiekosten zijn verbonden, ontvangt indien deze functie is vermeld op een daartoe door het bevoegd gezag
      vastgestelde lijst een maandelijkse tegemoetkoming ter hoogte van het op die lijst bij die functie vermelde bedrag
      dat maximaal 25% van het in het eerste lid genoemde bedrag kan zijn.

      4 In deze bepaling wordt onder representatiekosten verstaan de door de ambtenaar gemaakte of te maken kosten in
      verband met de eisen die de uitoefening van de functie stelt ten aanzien van het onderhouden van externe contacten
      en het verrichten van representatieve activiteiten, waaronder worden begrepen de kosten in verband met:

      a. huur of aanschaf van kleding en schoeisel of andere persoonlijke attributen;

      b. aanpassing en inrichting van de eigen woning;

      c. persoonlijke verzorging;

      d. contributies en lidmaatschappen;

      e. ontvangsten van bescheiden omvang in de eigen woning;

      f. het aanbieden van lunches, diners en overige consumpties, persoonlijke attenties en geschenken, en

      g. fooien.

      5 De tegemoetkoming wordt niet uitbetaald vanaf de eerste dag van de kalendermaand volgend op die waarin de
      ambtenaar in het geheel geen dienst heeft verricht, tenzij het niet verrichten van de dienst het gevolg is van
      vakantieverlof of ziekte voor zover het de eerste vier weken van de ziekte betreft. De uitbetaling wordt hervat in
      de kalendermaand volgend op die waarin de ambtenaar zijn dienst heeft hervat.

      6 De ambtenaar die een tegemoetkoming als bedoeld in het eerste lid ontvangt, kan geen representatiekosten
      declareren.

      7 Aan de ambtenaar die geen tegemoetkoming als bedoeld in het eerste lid ontvangt, of de ambtenaar, bedoeld in het
      eerste lid, die kosten voor representatieve activiteiten heeft gemaakt, die niet zijn genoemd in het vierde lid,
      kunnen daadwerkelijk gemaakte representatiekosten geheel of gedeeltelijk worden vergoed, indien:

      a. het onderhouden van externe contacten en het verrichten van representatieve activiteiten plaatsvindt met
      voorafgaande toestemming van of in opdracht van het bevoegd gezag;

      b. de declaratie van representatiekosten is ingediend binnen zes maanden na de kalendermaand waarin de kosten zijn
      gemaakt, en

      c. daarbij door de ambtenaar bewijsstukken worden overgelegd waaruit blijkt dat de kosten daadwerkelijk zijn
      gemaakt.

      8 Het bedrag, bedoeld in het eerste lid, wordt per 1 januari van elk jaar bij regeling van Onze Minister voor Wonen
      en Rijksdienst aangepast voor zover de consumentenprijsindex van het Centraal bureau voor de statistiek, geldend
      voor de maand september van het voorafgaande jaar, daartoe aanleiding geeft.
    url: https://wetten.overheid.nl/BWBR0003229/2019-01-01#Artikel5
  - number: '6'
    text: |-
      1 De ambtenaar die namens de Eerste of de Tweede Kamer der Staten-Generaal is belast met het in
      [artikel 21, zevende lid, van de Comptabiliteitswet 2001][ref1] genoemde financieel beheer, is verplicht een tekort
      geheel of gedeeltelijk aan te zuiveren, wanneer hem ter zake van dat tekort een ernstig verwijt kan worden gemaakt.

      2 De ambtenaar die namens de Eerste of de Tweede Kamer der Staten-Generaal is belast met het in [artikel 25][ref2]
      bedoelde materieelbeheer, is verplicht schade te vergoeden, wanneer hem ter zake van die schade een ernstig verwijt
      kan worden gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0013891#Artikel25
    url: https://wetten.overheid.nl/BWBR0003229/2019-01-01#Artikel6
