        artikel: '25'
  - number: '7'
    text: |-
      1 Het is de ambtenaar verboden in dienst uniformkledingstukken te dragen, tenzij deze door de kamer zijn verstrekt
      of voorgeschreven.

      2 Het is de ambtenaar verboden bij gekleed gaan in uniform insignes of andere onderscheidingstekens te dragen,
      tenzij deze zijn verstrekt of voorgeschreven door de kamer.

      3 De kamer verstrekt de voorgeschreven dienstkleding. De aanschaf en het onderhoud van de dienstkleding geschieden
      voor haar rekening.
    url: https://wetten.overheid.nl/BWBR0003229/2019-01-01#Artikel7
  - number: 7a
    text: |-
      1 Met de ambtenaar wordt minimaal een keer per jaar door een leidinggevende functionaris, aangewezen door het
      bevoegd gezag, gesproken over:

      a. De wijze waarop de ambtenaar de opgedragen werkzaamheden heeft uitgevoerd en de resultaten die daarbij zijn
      behaald;

      b. De omstandigheden waaronder de opgedragen werkzaamheden zijn uitgevoerd;

      c. Welke werkzaamheden de ambtenaar zullen worden opgedragen en welke resultaten daarbij behaald moeten worden;

      d. De omstandigheden waaronder die op te dragen werkzaamheden zullen worden uitgevoerd;

      e. De wijze waarop de persoonlijke ontwikkeling van de ambtenaar bevorderd kan worden.

      2 Indien de ambtenaar gedurende vijf aaneengesloten jaren dezelfde functie heeft vervuld, wordt in het gesprek,
      bedoeld in het eerste lid, specifieke aandacht besteed aan de wenselijkheid en mogelijkheid van de continuering van
      de loopbaan in een andere functie.

      3 Over de in het eerste lid, onder c, d en e, genoemde onderwerpen worden met de ambtenaar afspraken gemaakt.

      4 Van het met de ambtenaar besprokene wordt een schriftelijk verslag gemaakt.

      5 Het bevoegd gezag stelt vast aan welke eisen een gesprek, als bedoeld in het eerste lid, alsmede het verslag
      daarvan moet voldoen.
    url: https://wetten.overheid.nl/BWBR0003229/2019-01-01#Artikel7a
  - number: '8'
    text: |-
      Het bevoegd gezag kan nadere regels stellen ten aanzien van het onderzoek, het buitengewoon verlof respectievelijk
      de beoordeling, genoemd in de [artikelen 9, derde lid][ref1], [33e, eerste lid][ref2], respectievelijk
      [71a, eerste en tweede lid, van het Algemeen Rijksambtenarenreglement][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0001950#Artikel33e
