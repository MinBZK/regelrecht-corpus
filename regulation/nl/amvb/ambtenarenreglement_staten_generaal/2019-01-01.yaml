      1 Een voornemen tot wijziging van dit besluit wordt behandeld in de Sectorcommissie overleg rijkspersoneel.

      2 Vanwege de Staten-Generaal wordt dit besluit niet gewijzigd dan nadat daarover met het georganiseerd overleg,
