      1 De aanstelling geschiedt in vaste of tijdelijke dienst.

      2 De aanstelling geschiedt in vaste dienst, tenzij er grond is een tijdelijke aanstelling voor bepaalde tijd te
      verlenen.

      3 De niet-Nederlander kan uitsluitend worden aangesteld indien hij in Nederland rechtmatig verblijf heeft
      als bedoeld in [artikel 8 van de Vreemdelingenwet 2000][ref1] en het tot aanstelling bevoegd gezag voor hem
      beschikt over een tewerkstellingsvergunning als bedoeld in de [Wet arbeid vreemdelingen][ref2], tenzij die
      tewerkstellingsvergunning krachtens laatstgenoemde [wet][ref3] niet is vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0007149
      [ref3]: https://wetten.overheid.nl/BWBR0007149
