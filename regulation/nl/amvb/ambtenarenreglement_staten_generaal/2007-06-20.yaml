  - number: 72a
    text: |-
      1 De ambtenaar die ongeschikt is tot het verrichten van zijn arbeid wegens ziekte is verplicht een andere functie
      te aanvaarden indien sprake is van passende arbeid.

      2 De ambtenaar die op grond van het eerste lid is herplaatst voordat de termijn van twee jaar, bedoeld in
      [artikel 129, derde lid, onderdeel a][ref1], is verstreken, heeft tot het eind van genoemde termijn rechtop een
      aanvullende uitkering ter grootte van het verschil tussen:

      a. het bedrag waarop de ambtenaar op grond van [artikel 72][ref2] recht zou hebben gehad indien hem geen andere
      betrekking zou zijn opgedragen; en

      b. zijn bezoldiging na herplaatsing.

      3 Indien de ziekte uit hoofde waarvan de ambtenaar ongeschikt is zijn arbeid te verrichten, wordt veroorzaakt door
      een beroepsincident, heeft de ambtenaar, bedoeld in het tweede lid, tevens recht op een aanvullende uitkering nadat
      de termijn van twee jaar is verstreken ter grootte van het verschil tussen:

      a. een percentage van zijn bezoldiging vermeerderd met de vakantie-uitkering, zoals die zou zijn op de dag voor
      zijn herplaatsing indien de ambtenaar op die dag niet ongeschikt zou zijn geweest tot werken; en

      b. zijn bezoldiging na herplaatsing vermeerderd met de vakantie-uitkering en vermeerderd met een uit
      de oorspronkelijke betrekking voortvloeiend recht op een WAO-uitkering, invaliditeitspensioen en een
      herplaatsingstoelage.

      4 Het percentage, bedoeld in het derde lid, onderdeel a, is afhankelijk van de mate van arbeidsongeschiktheid en
      bedraagt bij een arbeidsongeschiktheid van:








                    80% of meer:


                    90,02%;




                    65 tot 80%:


                    65,26%;




                    55 tot 65%:


                    54,01%;




                    45 tot 55%:


                    45,01%;




                    35 tot 45%:


                    36,01%;




                    25 tot 35%:


                    27,01%;




                    15 tot 25%:


                    18,00%.






      5 De aanvullende uitkeringen, bedoeld in het tweede en derde lid, eindigen in ieder geval:

      a. met ingang van de dag waarop de ambtenaar ontslag is verleend;

      b. met ingang van de dag waarop de ambtenaar de leeftijd van 65 jaar heeft bereikt; of

      c. met ingang van de dag volgende op die waarop de ambtenaar is overleden.


      [ref1]: https://wetten.overheid.nl/BWBR0003229#Artikel129
      [ref2]: https://wetten.overheid.nl/BWBR0003229#Artikel72
