  - number: '75'
    text: |-
      1 De ambtenaar en de gewezen ambtenaar hebben geen aanspraak op doorbetaling van de bezoldiging of een
      bovenwettelijke arbeidsongeschiktheidsuitkering:

      a) indien de ziekte is voorgewend, althans zodanig overdreven wordt voorgesteld, dat ongeschiktheid tot het
      verrichten van arbeid wegens ziekte niet kan worden aangenomen;

      b) indien de ambtenaar de ongeschiktheid tot het verrichten van zijn arbeid wegens ziekte opzettelijk heeft
      veroorzaakt, tenzij hem daarvan op grond van zijn psychische toestand geen verwijt kan worden gemaakt;

      c) indien de ongeschiktheid tot het verrichten van zijn arbeid wegens ziekte zich voordoet binnen een half jaar
      na het geneeskundig onderzoek, bedoeld in artikel 7, vierde lid, onderdeel b en blijkt dat de ambtenaar onjuiste
      informatie omtrent zijn gezondheidstoestand heeft verstrekt of gegevens heeft verzwegen, ten gevolge waarvan de
      verklaring van geschiktheid, de aan de desbetreffende functie verbonden werkzaamheden te verrichten, ten onrechte
      heeft plaatsgevonden, tenzij de ambtenaar aannemelijk maakt dat hij te goeder trouw heeft gehandeld.

      2 De gewezen ambtenaar heeft geen aanspraak op doorbetaling van zijn laatstelijk genoten bezoldiging of de
      bovenwettelijke arbeidsongeschiktheidsuitkering, indien hij op grond van een aanvaarde andere betrekking aanspraak
      kan maken op doorbetaling van zijn loon of bezoldiging, dan wel op een ZW-uitkering.
    url: https://wetten.overheid.nl/BWBR0003229/2007-06-20#Artikel75
  - number: 75a
    text: |-
      1 De aanspraken van de ambtenaar en de gewezen ambtenaar op grond van dit hoofdstuk vervallen indien de ambtenaar
      of de gewezen ambtenaar:

      a) niet binnen redelijke termijn gezondheidskundige hulp inroept;

      b) zich niet gedurende het gehele verloop van de ziekte onder gezondheidskundige behandeling blijft stellen;

      c) de voorschriften van de behandelende arts niet opvolgt;

      d) zich schuldig maakt aan gedragingen waardoor zijn genezing wordt belemmerd;

      e) verzuimt de deskundige persoon of de arbodienst op eerste aanvraag mee te delen om welke reden hij ongeschikt is
      tot werken;

      f) zonder deugdelijke grond nalaat gevolg te geven aan een verzoek van de deskundige persoon of de arbodienst om
      te verschijnen;

      g) er de oorzaak van is dat het arbeidsgezondheidskundig onderzoek door een door de deskundige persoon of de
      arbodienst aangewezen arts niet kan plaatshebben;

      h) niet binnen twee dagen na de aanvang van de ongeschiktheid tot werken wegens ziekte dit heeft gemeld bij zijn
      werkgever;

      i) weigert aangeboden passende arbeid, waartoe de deskundige persoon of de arbodienst hem in staat acht, te
      verkrijgen of te aanvaarden, dan wel, zonder deugdelijke grond weigert deze arbeid, waartoe het bevoegd gezag hem
      in de gelegenheid stelt, te verrichten;

      j) zich niet houdt aan de ten aanzien van hem geldende regels met betrekking tot de wijze waarop invulling wordt
      gegeven aan de verzuimbegeleiding en de arbeidsgezondheidskundige begeleiding en de daarbij in acht te nemen
      procedure;

      k) zijn ongeschiktheid tot werken opzettelijk heeft veroorzaakt;

      l) weigert inzage te geven in een op hem betrekking hebbend document als bedoeld in
      [artikel 1 van de Wet op de identificatieplicht][ref1] of een geldig rijbewijs als bedoeld in artikel 9, eerste
      lid, van de Wegenverkeerswet, voor zover dit redelijkerwijs nodig is voor de uitvoering van wetten;

      m) tijdens de ongeschiktheid tot het verrichten van zijn arbeid wegens ziekte arbeid voor zichzelf of voor derden
      verricht, tenzij dit door de deskundige persoon of de arbodienst in het belang van zijn genezing wenselijk wordt
      geacht;

      n) vóór de betaling van de bezoldiging weigert mededeling te doen van inkomsten uit arbeid die hij heeft in verband
      met het verrichten van door de deskundige persoon of de arbodienst in het belang van zijn genezing wenselijk
      geachte arbeid voor zichzelf of voor derden;

      o) niet onverwijld op verzoek of uit eigen beweging alle feiten en omstandigheden meedeelt, waarvan hem
      redelijkerwijs duidelijk moet zijn dat zij van invloed kunnen zijn op het recht of op de hoogte van een aan hem
      toegekende arbeidsongeschiktheidsuitkering;

      p) zijn arbeid verzuimt te hervatten op het door de deskundige persoon of de arbodienst bepaalde tijdstip en in
      de door deze persoon of dienst bepaalde mate, indien zulks hem is opgedragen, tenzij hij daarvoor een door de
      deskundige persoon of de arbodienst als geldig erkende reden heeft opgegeven;

      q) zonder deugdelijke grond weigert gevolg te geven aan door het bevoegd gezag of een door het bevoegd gezag
      aangewezen deskundige gegeven redelijke voorschriften of mee te werken aan getroffen maatregelen die erop gericht
      zijn om de betrokkene in staat te stellen passende arbeid te verrichten;

      r) zonder deugdelijke grond weigert mee te werken aan het opstellen, evalueren of bijstellen van een plan van
      aanpak, bedoeld in [artikel 71a, tweede lid, van de WAO][ref2];

      s) geen aanspraak heeft op een WAO-uitkering in verband met de toepassing van [artikel 25][ref3] of
      [28, onder a of b, van de WAO][ref4];

      t) zijn medewerking weigert bij de doelmatige uitvoering van de bepalingen van dit hoofdstuk.

      2 De aanspraak op de doorbetaling van bezoldiging of de bovenwettelijke arbeidsongeschiktheidsuitkering, kan
      geheel of gedeeltelijk vervallen worden verklaard in het geval de ambtenaar of de gewezen ambtenaar de regels heeft
      overtreden die ter zake van afwezigheid wegens ziekte zijn vastgesteld.

      3 De ingevolge het eerste lid vervallen aanspraken herleven met ingang van het tijdstip waarop de ambtenaar of de
      gewezen ambtenaar alsnog gevolg geeft aan de betreffende verplichting op grond van dat lid.

      4 Het tot aanstelling bevoegd gezag kan op grond van bijzondere omstandigheden bepalen, dat de aanspraak op de
      doorbetaling van bezoldiging of de bovenwettelijke arbeidsongeschiktheidsuitkering, niet vervalt maar geheel of ten
      dele aan anderen dan aan de ambtenaar of de gewezen ambtenaar zal worden uitbetaald.

      5 Voor zover het tot aanstelling bevoegd gezag van de bevoegdheid, bedoeld in het vierde lid, geen
      gebruik heeft gemaakt, wordt de niet uitbetaalde bezoldiging of de niet uitbetaalde bovenwettelijke
      arbeidsongeschiktheidsuitkering, alsnog aan de ambtenaar of de gewezen ambtenaar uitbetaald, indien het in
      [artikel 30, eerste lid, onderdeel e, van de Wet SUWI][ref5], bedoelde oordeel ten gunste van de ambtenaar of de
      gewezen ambtenaar uitvalt.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel71a
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel25
      [ref4]: https://wetten.overheid.nl/BWBR0002524#Artikel28
      [ref5]: https://wetten.overheid.nl/BWBR0013060#Artikel30
