  - number: '94'
    text: |-
      1 De ambtenaar kan in het belang van de Rijksdienst worden verplicht om scholing te volgen, voor zover dat
      redelijkerwijs van hem kan worden gevergd.

      2 Aan de ambtenaar, die op grond van het eerste lid is verplicht scholing te volgen, wordt een volledige vergoeding
      van de noodzakelijk te maken scholingskosten toegekend. Het tot aanstelling bevoegd gezag kan in bijzondere
      gevallen afwijken van de vorige volzin.

      3 Aan de ambtenaar, die op grond van het eerste lid is verplicht scholing te volgen, kan scholingsverlof met behoud
      van bezoldiging worden verleend.

      4 Indien de ambtenaar aan wie scholingsverlof als bedoeld in het derde lid is verleend gedurende dat verlof of
      gedurende een bepaalde periode van dat verlof tevens recht heeft op een financiële tegemoetkoming op basis van
      [hoofdstuk 7 van de Wet arbeid en zorg][ref1], wordt gedurende de periode waarin sprake is van samenloop een
      inhouding op de bezoldiging toegepast welke overeenkomt met het bedrag van bedoelde financiële tegemoetkoming.
      Indien de financiële tegemoetkoming hoger is dan hetgeen over de verlofuren wordt doorbetaald aan bezoldiging wordt
      de inhouding vastgesteld op het laatstbedoelde bedrag.

      5 Indien aan de in [hoofdstuk 7 van de Wet arbeid en zorg][ref2] gestelde voorwaarden voor het toekennen van een
      financiële tegemoetkoming is voldaan maar geen financiële tegemoetkoming is toegekend omdat de ambtenaar geen
      aanvraag heeft ingediend, past het bevoegd gezag het vierde lid op overeenkomstige wijze toe. In dat geval wordt
      rekening gehouden met de financiële tegemoetkoming die aan de ambtenaar zou zijn toegekend indien hij wel een
      aanvraag zou hebben ingediend.

      6 De ambtenaar, die op grond van het eerste lid is verplicht scholing te volgen, kan worden verplicht tot
      terugbetaling van de aan hem toegekende vergoeding van de scholingskosten:

      a. bij onvoldoende resultaat in de scholing en bij tussentijds afbreken van de scholing, indien dit aan eigen
      schuld of toedoen van de ambtenaar is te wijten;

      b. bij ontslag tijdens het volgen van de scholing en in bijzondere gevallen bij ontslag binnen een termijn van
      maximaal drie jaren na het met voldoende resultaat afronden van de scholing, tenzij de ambtenaar binnen een maand
      na zijn ontslag elders in dienst treedt binnen de Rijksdienst of aansluitend aan zijn ontslag recht heeft op een
      uitkering op grond van werkloosheid, arbeidsongeschiktheid of ouderdomspensioen.

      7 De verplichting tot terugbetaling wordt niet opgelegd aan de ambtenaar die binnen 18 maanden nadat hij is
      aangewezen als herplaatsingskandidaat als bedoeld in de [artikelen 84d][ref3] en [84e][ref4], op zijn aanvraag
      eervol ontslag wordt verleend wegens de aanvaarding van een functie buiten de Rijksdienst.

      8 Het tot aanstelling bevoegd gezag kan ten aanzien van dit artikel nadere regels stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Hoofdstuk7
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Hoofdstuk7
      [ref3]: https://wetten.overheid.nl/BWBR0003229#Artikel84d
      [ref4]: https://wetten.overheid.nl/BWBR0003229#Artikel84e
