  - number: 130a
    text: |-
      1 Ook tijdens de periode, bedoeld in [artikel 129, derde lid, onderdeel a][ref1], kan aan de ambtenaar die ten
      gevolge van ziekte verhinderd is zijn arbeid te verrichten, ontslag worden verleend, indien hij zonder deugdelijke
      grond weigert:

      a. gevolg te geven aan door het bevoegd gezag of een door het bevoegd gezag aangewezen deskundige gegeven
      redelijke voorschriften of mee te werken aan door het bevoegd gezag of een door het bevoegd gezag aangewezen
      deskundige getroffen maatregelen om hem in staat te stellen de eigen of andere passende arbeid, bedoeld in
      [artikel 70, onderdeel l][ref2], te verrichten, of

      b. passende arbeid te verrichten waartoe het bevoegd gezag hem in de gelegenheid stelt, of

      c. zijn medewerking te verlenen aan het opstellen, evalueren of bijstellen van een plan van aanpak als bedoeld in
      [artikel 71a, tweede lid, van de Wet op de arbeidsongeschiktheidsverzekering][ref3].

      2 Om te beoordelen of er sprake is van een situatie als bedoeld in het eerste lid, vraagt het bevoegd gezag
      een hierop betrekking hebbend advies van het Uitvoeringsinstituut werknemersverzekeringen en neemt dit mede in
      beschouwing.


      [ref1]: https://wetten.overheid.nl/BWBR0003229#Artikel129
