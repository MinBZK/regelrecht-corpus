  - number: 34a
    text: |-
      1 De gemiddelde wekelijkse werktijd van een ambtenaar van 57 jaar en ouder die daartoe een aanvraag heeft
      ingediend, wordt, met behoud van zijn arbeidsduur, teruggebracht met 15,8%, tenzij het dienstbelang zich daartegen
      verzet. De ambtenaar voor wie de arbeidsduur op meer dan gemiddeld 36 uur is vastgesteld, kan een aanvraag als
      bedoeld in de eerste volzin eerst indienen nadat op zijn aanvraag door het bevoegd gezag zijn arbeidsduur is
      vastgesteld op ten hoogste gemiddeld 36 uur.

      2 De in het eerste lid bedoelde ambtenaar dient op het moment van de vermindering van de werktijd tenminste 5
      aaneengesloten jaren in dienst te zijn van het rijk.

      3 Voor de uren die het wekelijkse verschil vormen tussen de in het eerste lid bedoelde arbeidsduur en de
      teruggebrachte werktijd wordt de ambtenaar geacht met verlof te zijn.

      4 Op het salaris van de in het eerste lid bedoelde ambtenaar wordt een inhouding toegepast. De hoogte van
      deze inhouding is afhankelijk van de leeftijd op de datum dat de werktijdvermindering op grond van dit artikel
      ingaat en bedraagt een percentage volgens onderstaande tabel van het salaris dat voor hem zou gelden zonder
      werktijdvermindering op grond van dit artikel, verminderd met een eventuele inhouding als bedoeld in artikel 92b:








                    Leeftijd


                    Inhouding in procenten






                    57


                    5




                    58


                    5




                    59


                    3,5




                    60


                    3,5




                    61


                    2




                    62


                    2




                    63


                    1




                    64


                    1






      5 De inhouding, bedoeld in het vierde lid, wordt teruggebracht tot 70% voor zover op grond van
      [artikel 72, eerste lid][ref1], niet meer dan 70% van de bezoldiging wordt doorbetaald.

      6 Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties stelt omtrent de verrekening van extra inkomsten uit
      arbeid of bedrijf met het salaris van de in het eerste lid bedoelde ambtenaar regels vast.


      [ref1]: https://wetten.overheid.nl/BWBR0003229#Artikel72
