  - number: '128'
    text: |-
      Een ontslag als bedoeld in [artikel 125][ref1], wordt verleend door het tot aanstelling bevoegd gezag. Dit is
      gehouden het advies in te winnen van de Adviescommissie grondrechten en functie-uitoefening ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0001947#Artikel125e
    url: https://wetten.overheid.nl/BWBR0003229/2007-06-20#Artikel128
