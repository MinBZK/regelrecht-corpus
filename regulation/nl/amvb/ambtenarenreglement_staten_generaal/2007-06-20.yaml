  - number: '131'
    text: |-
      1 Door de Kamer, door de Gemengde Commissie, dan wel door de Gemengde Commissie van toezicht kan aan een ambtenaar
      in vaste dienst ook op andere gronden dan die in artikel 129 zijn geregeld of waarnaar in dat artikel is verwezen,
      ontslag worden gegeven. Dat ontslag wordt dan eervol verleend.

      2 In geval van ontslag ingevolge het eerste lid wordt door het tot ontslagverlening bevoegde gezag
      een voorziening getroffen waarbij de ambtenaar een uitkering verleend wordt, die, naar het oordeel
      van dat bevoegde gezag, met het oog op de omstandigheden redelijk is te achten. Deze uitkering zal ten
      minste gelijk zijn aan het voor de ambtenaar geldende totaal van uitkeringen berekend op basis van de
      [Werkloosheidswet][ref1] en het [Besluit bovenwettelijke uitkeringen bij werkloosheid voor de sector Rijk][ref2],
      als ware als gevolg van het ontslag geen sprake van verwijtbare werkloosheid als bedoeld in
      [artikel 24 van de Werkloosheidswet][ref3]. Voor zover door het bevoegde gezag ten gunste van de
      ambtenaar niet anders is beslist, zijn op de uitkering voor het overige de [Werkloosheidswet][ref4] en het
      [Besluit bovenwettelijke uitkeringen bij werkloosheid voor de sector Rijk][ref5] van overeenkomstige toepassing.

      3 Indien de ambtenaar terzake van zijn ontslag ingevolge het eerste lid recht heeft op een uitkering krachtens de
      [Werkloosheidswet][ref6] of het [Besluit bovenwettelijke uitkeringen bij werkloosheid voor de sector Rijk][ref7],
      wordt de in het tweede lid bedoelde uitkering met die uitkering verminderd.


