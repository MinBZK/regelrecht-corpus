  - number: '37'
    text: |-
      1 Indien de ambtenaar op de datum van zijn ontslag nog aanspraak heeft op vakantie, wordt hem voor ieder uur
      vakantie dat hij niet heeft opgenomen een vergoeding toegekend ten bedrage van het salaris per uur dat de ambtenaar
      direct voorafgaand aan zijn ontslag genoot. De vergoeding wordt berekend over ten hoogste twee maal de aanspraak op
      vakantie over een vol kalenderjaar, uitgaande van het salaris en de werktijd zoals die direct voorafgaand aan het
      ontslag voor de ambtenaar golden en de leeftijd welke hij bereikt in het kalenderjaar waarin de dienstbetrekking
      wordt beëindigd.

      2 Indien op de dag van zijn ontslag blijkt, dat de ambtenaar teveel vakantie heeft genoten, is hij voor ieder uur
      teveel genoten vakantie een bedrag verschuldigd ten bedrage van de salaris per uur.

      3 In geval van overgang zonder onderbreking naar een andere functie binnen de rijksdienst in de loop van een
      kalenderjaar kan de ambtenaar er - in zoverre in afwijking van lid 1 - voor kiezen de vakantieaanspraken van het
      lopende kalenderjaar die niet zijn genoten, te behouden. Daarbij wordt vakantie die in het lopende kalenderjaar is
      genoten in mindering gebracht op de aanspraken in dat jaar.
    url: https://wetten.overheid.nl/BWBR0003229/2007-06-20#Artikel37
  - number: '38'
    text: |-
      Ingeval de ambtenaar in het genot is van een toelage als bedoeld in artikel 17 dan wel artikel 18*a* van het
      BBRA 1984 is - met betrekking tot de vaststelling van dat bezoldigingsdeel tijdens vakantie - artikel 25 lid 3,
      respectievelijk lid 4, van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0003229/2007-06-20#Artikel38
  - number: '39'
    text: Het tot aanstelling bevoegd gezag is bevoegd nadere en zonodig afwijkende regels vast te stellen.
    url: https://wetten.overheid.nl/BWBR0003229/2007-06-20#Artikel39
  - number: '53'
    text: |-
      Onverminderd het bepaalde in de hoofdstukken III. en IV. geniet verlof:

      a. de ambtenaar, die als militair dan wel op grond van een verbintenis als vrijwilliger in de zin van artikel 2,
      eerste lid, onder *a.* of *b.* van de Rechtstoestandregeling reservepolitie of van een overeenkomstige verbintenis,
      als bedoeld in de artikelen 53 en 54 van die regeling in werkelijke dienst is;

      b. de ambtenaar, die zich bevindt in een der omstandigheden, genoemd in artikel 30;

      c. de ambtenaar die uit hoofde van ziekte of ongeval verhinderd is dienst te verrichten.
    url: https://wetten.overheid.nl/BWBR0003229/2007-06-20#Artikel53
  - number: '54'
    text: |-
      1 Indien de rijksdienst op een daartoe aangewezen kerkelijke of nationale, landelijk, regionaal of plaatselijk
      erkende feest- of gedenkdag is gesloten, geniet de desbetreffende ambtenaar verlof voor zoveel het dienstbelang
      niet anders vereist.

      2 Het vorige lid vindt geen toepassing, indien de sluiting van de rijksdienst regionaal of plaatselijk plaatsvindt
      en de ambtenaar elders werkzaam is.
    url: https://wetten.overheid.nl/BWBR0003229/2007-06-20#Artikel54
  - number: '55'
    text: |-
      1 Aan de ambtenaar wordt in de gevallen en onder de voorwaarden genoemd in de volgende artikelen van deze paragraaf
      buitengewoon verlof verleend.

      2 Onder zeer bijzondere persoonlijke omstandigheden als bedoeld in [artikel 4:1 van de Wet arbeid en zorg][ref1]
      worden in ieder geval begrepen de omstandigheden genoemd in de artikelen 59, 60 en 62b.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel41
    url: https://wetten.overheid.nl/BWBR0003229/2007-06-20#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: 4:1
  - number: '56'
    text: |-
      Tenzij de belangen van de dienst zich daartegen verzetten, wordt buitengewoon verlof met behoud van volle
      bezoldiging verleend:

      a. voor de uitoefening van kiesrecht;

      b. voor het voldoen aan een wettelijke verplichting, een en ander voor zover dit niet in vrije tijd kan geschieden
      en omzetting van dienst niet mogelijk is.
    url: https://wetten.overheid.nl/BWBR0003229/2007-06-20#Artikel56
  - number: '57'
    text: |-
      1 Indien de ambtenaar een vaste vergoeding ontvangt uit de functie waarvoor hem het in [artikel 125][ref1]
      bedoelde verlof wordt verleend, wordt op zijn bezoldiging een inhouding toegepast over de tijd dat hij het verlof
      geniet. Deze inhouding gaat hetgeen hij geacht kan worden te ontvangen als vaste vergoeding voor de met het verlof
      overeenkomende tijd in de bedoelde functie niet te boven.

      2 Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties kan nadere regels ter uitvoering van het eerste lid
      vaststellen.


      [ref1]: https://wetten.overheid.nl/BWBR0001947#Artikel125c
    url: https://wetten.overheid.nl/BWBR0003229/2007-06-20#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0001947
        artikel: 125c
  - number: '58'
    text: |-
      1 Tenzij de belangen van de dienst zich daartegen verzetten wordt jaarlijks ten hoogste 120 uren buitengewoon
      verlof met behoud van volle bezoldiging verleend voor het bijwonen van vergaderingen van statutaire organen
      van verenigingen van ambtenaren, van centrale organisaties, waarbij deze verenigingen zijn aangesloten of van
      internationale ambtenarenorganisaties, mits de ambtenaar hieraan deelneemt:

      a. voor zover betreft vergaderingen van verenigingen van ambtenaren als bestuurslid van die vereniging dan wel als
      afgevaardigde of bestuurslid van een onderdeel daarvan;

      b. voor zover betreft vergaderingen van centrale organisaties, waarbij verenigingen van ambtenaren zijn
      aangesloten, als bestuurslid van die centrale organisatie dan wel als afgevaardigde of bestuurslid van een bij die
      organisatie aangesloten vereniging van ambtenaren;

      c. voor zover betreft vergaderingen van een internationale ambtenarenorganisatie als bestuurslid van deze
      organisatie dan wel als afgevaardigde of bestuurslid van een bij die organisatie aangesloten vereniging van
      ambtenaren.

      2 Tenzij de belangen van de dienst zich daartegen verzetten, wordt tot ten hoogste 208 uren per jaar buitengewoon
      verlof met behoud van volle bezoldiging verleend aan de ambtenaar, die door een centrale als bedoeld in artikel
      140 of door een daarbij aangesloten vereniging is aangewezen om bestuurlijke en/of vertegenwoordigende activiteiten
      te ontplooien binnen zijn centrale of een daarbij aangesloten vereniging c.q. binnen de organisatie van de
      werkgever, die er toe strekken de doelstellingen van zijn centrale van overheidspersoneel en de daarbij aangesloten
      verenigingen te ondersteunen.

      3 Tenzij de belangen van de dienst zich daartegen verzetten, wordt buitengewoon verlof met behoud van volle
      bezoldiging verleend aan de ambtenaar voor het - op uitnodiging van een organisatie van ambtenaren - als cursist
      deelnemen aan een cursus, met dien verstande dat dit verlof ten hoogste 48 uren per twee jaren bedraagt.

      4 Het aantal uren dat op grond van het eerste, tweede en derde lid aan een ambtenaar mag worden verleend, bedraagt
      te zamen ten hoogste 240 uren per jaar, met dien verstande dat ten hoogste 320 uren worden verleend:

      a. aan leden van de hoofdbesturen van de Algemene Centrale van Overheidspersoneel, en de Christelijke Centrale
      van Overheids- en Onderwijspersoneel en van organisaties, die rechtstreeks bij die centrale organisaties zijn
      aangesloten;

      b. aan leden van het hoofdbestuur van het Ambtenarencentrum en aan leden van het dagelijks bestuur van de bij die
      centrale aangesloten organisaties;

      c. aan leden van het hoofdbestuur van de Centrale van Middelbare en Hogere Functionarissen bij Overheid, Onderwijs,
      Bedrijven en Instellingen, alsmede aan de bestuursleden van de sectoren en secties van die organisatie.

      5 Het verlof bedoeld in de vorige leden, wordt slechts verleend aan ambtenaren, die lid zijn van verenigingen
      van ambtenaren, welke zijn aangesloten bij centrales van verenigingen van ambtenaren, die deel uitmaken van de
      Sectorcommissie overleg rijkspersoneel.

      6 Tenzij andere belangen van de dienst zich daartegen verzetten, wordt buitengewoon verlof met behoud van volle
      bezoldiging verleend voor het bijwonen van vergaderingen van georganiseerd overleg in ambtenarenzaken. Dit geldt
      eveneens voor één voorvergadering per in de vorige volzin bedoelde vergadering.
    url: https://wetten.overheid.nl/BWBR0003229/2007-06-20#Artikel58
  - number: '59'
    text: |-
      1 Tenzij de belangen van de dienst zich daartegen verzetten, wordt bij verhuizing buitengewoon verlof met behoud
      van volle bezoldiging verleend voor ten hoogste twee dagen per kalenderjaar, aan hen die een eigen huishouding
      hebben.

      2 Het tot aanstellen bevoegd gezag kan regels vaststellen in aanvulling op of in afwijking van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0003229/2007-06-20#Artikel59
  - number: '60'
    text: |-
      1 Tenzij de belangen van de dienst zich daartegen verzetten, wordt aan de ambtenaar buitengewoon verlof met behoud
      van volle bezoldiging verleend:

      a. bij zijn ondertrouw: één dag;

      b. bij zijn huwelijk: vier dagen;

      c. tot het bijwonen van een huwelijk van bloed- of aanverwanten in de eerste en tweede graad: één dag indien dit
      huwelijk wordt gesloten in zijn woon- of standplaats en ten hoogste twee dagen, indien dit huwelijk wordt gesloten
      buiten zijn woon- of standplaats;

      d. bij overlijden van:

      1°. in artikel 62ab, tweede lid, genoemde personen: vier dagen;

      2°. bloed- of aanverwanten in de tweede graad: twee dagen;

      3°. bloed- of aanverwanten in de derde of vierde graad: ten hoogste één dag;

      indien de ambtenaar is belast met de regeling van de lijkbezorging of van de nalatenschap dan wel van beide: ten
      hoogste vier dagen;

      e. bij bevalling van zijn echtgenote: ten hoogste twee dagen;

      f. bij zijn 25-, 40-, en 50-jarig ambts- of huwelijksjubileum en bij 25-, 40-, 50- en 60-jarig huwelijksjubileum
      van ouders, stiefouders, pleegouders, schoonouders of grootouders: één dag.

      2 Voor de toepassing van dit artikel wordt onder huwelijk mede begrepen het sluiten van een samenlevingscontract
      als bedoeld in artikel 1, vierde lid, of het aangaan van een geregistreerd partnerschap.

      3 Buitengewoon verlof dat aan de ambtenaar op grond van het eerste lid wordt verleend in verband met
      aanverwantschap die door zijn huwelijk is ontstaan met bloedverwanten van zijn echtgenote wordt op gelijke wijze
      verleend aan de ambtenaar die ongehuwd samenwoont als bedoeld in artikel 1, vierde lid, of aan de ambtenaar die een
      geregistreerd partnerschap is aangegaan met betrekking tot dezelfde bloedverwanten van zijn levenspartner of van
      zijn geregistreerde partner.

      4 Het tot aanstellen bevoegd gezag kan regels vaststellen in aanvulling op of in afwijking van de vorige leden.
    url: https://wetten.overheid.nl/BWBR0003229/2007-06-20#Artikel60
  - number: '61'
    text: |-
      1 Buitengewoon verlof van korte duur, al dan niet met behoud van volle bezoldiging, kan bovendien worden verleend
      in de gevallen, waarin hij, die tot verlenen van dat verlof bevoegd is verklaard, oordeelt, dat daartoe aanleiding
      bestaat.

      2 Het tot aanstellen bevoegd gezag kan ter uitvoering van het eerste lid nadere regels stellen.
    url: https://wetten.overheid.nl/BWBR0003229/2007-06-20#Artikel61
  - number: '62'
    text: |-
      1 Behoudens in dringende gevallen moet buitengewoon verlof van korte duur tenminste 24 uren tevoren schriftelijk of
      mondeling worden aangevraagd.

      2 Indien de ambtenaar, die niet vooraf een aanvraag voor buitengewoon verlof van korte duur heeft ingediend, ten
      genoegen van de in het eerste lid bedoelde autoriteit aantoont, dat hij daartoe geen gelegenheid heeft gehad,
      terwijl er voor zijn afwezigheid gegronde redenen bestonden, wordt deze afwezigheid beschouwd als buitengewoon
      verlof met behoud van volle bezoldiging.

      3 Een gegronde reden als bedoeld in het tweede lid is slechts aanwezig:

      a. indien een der in de voorgaande artikelen genoemde omstandigheden aanwezig is geweest, op grond waarvan aan
      de ambtenaar op zijn aanvraag buitengewoon verlof wordt verleend, zulks met inachtneming van de daarbij vermelde
      voorwaarden en termijnen;

      b. in alle andere gevallen, indien de ambtenaar, alle omstandigheden in aanmerking genomen, redelijker wijze de
      dienst mocht verzuimen.
    url: https://wetten.overheid.nl/BWBR0003229/2007-06-20#Artikel62
  - number: 62a
    text: |-
      1 De ambtenaar die als ouder in familierechtelijke betrekking staat tot een kind, heeft aanspraak op verlof. Indien
      de ambtenaar met ingang van hetzelfde tijdstip tot meer dan één kind in familierechtelijke betrekking komt te
      staan, bestaat er ten aanzien van ieder van die kinderen aanspraak op verlof.

      2 De ambtenaar die blijkens verklaringen uit de gemeentelijke basisadministratie op hetzelfde adres woont als een
      kind en duurzaam de verzorging en de opvoeding van dat kind als eigen kind op zich heeft genomen, heeft aanspraak
      op verlof. Indien de ambtenaar met ingang van hetzelfde tijdstip de verzorging en opvoeding van meer dan één kind
      op zich heeft genomen, bestaat er ten aanzien van ieder van die kinderen aanspraak op verlof.

      3 Geen aanspraak op verlof bestaat over de periode gelegen na de datum waarop het kind de leeftijd van acht jaren
      heeft bereikt.

      4 Het verlof wordt uitsluitend verleend aan de ambtenaar wiens dienstbetrekking ten minste een jaar heeft geduurd.
      Indien de dienstbetrekking buiten Nederland wordt vervuld bestaat aanspraak op verlof tenzij gewichtige redenen van
      dienstbelang zich hiertegen verzetten.

      5 Het aantal uren verlof waarop de ambtenaar per keer ten hoogste aanspraak heeft, bedraagt een kwart van
      het aantal door de ambtenaar te werken uren in het kalenderjaar waarin het verlof aanvangt uitgaande van zijn
      arbeidsduur op het tijdstip waarop het verlof aanvangt. Indien de arbeidsduur van de ambtenaar gedurende het verlof
      wijzigt, wordt de aanspraak op het verlof opnieuw vastgesteld, rekening houdend met de mate waarin de arbeidsduur
      is gewijzigd en de mate waarin de periode gedurende welke het verlof wordt genoten is verstreken.

      6 Het verlof wordt opgenomen gedurende een aaneengesloten periode van ten hoogste zes maanden en gelijkmatig over
      deze periode verdeeld. In afwijking van de eerste volzin kan de ambtenaar het bevoegd gezag verzoeken om het verlof
      op een andere wijze aaneengesloten te genieten of het verlof op te delen in ten hoogste drie perioden, waarbij
      iedere periode ten minste een maand bedraagt. Het bevoegd gezag stemt in met het verzoek tenzij een zwaarwegend
      dienstbelang zich daartegen verzet.

      7 De ambtenaar heeft over de uren waarop hem ouderschapsverlof is verleend, recht op 75% van
      zijn bezoldiging, verminderd met de ouderschapsverlofkorting waarop over die uren op grond van
      [artikel 8.14b van de Wet inkomstenbelasting 2001][ref1] maximaal recht kan bestaan. Indien aan de in het eerste
      lid van genoemd artikel gestelde voorwaarden voor het toekennen van ouderschapsverlofkorting is voldaan en een
      ouderschapsverlofkorting is toegekend, heeft de ambtenaar op zijn aanvraag tevens recht op het verschil tussen
      de maximale ouderschapsverlofkorting, bedoeld in de eerste volzin, en de toegekende ouderschapsverlofkorting. De
      ambtenaar dient zijn aanvraag in binnen zes maanden nadat de ouderschapsverlofkorting is toegekend.

      8 Indien de ambtenaar aan wie verlof is verleend gedurende dat verlof of gedurende een bepaalde
      periode van dat verlof tevens recht heeft op een financiële tegemoetkoming op basis van
      [hoofdstuk 7 van de Wet arbeid en zorg][ref2], wordt gedurende de periode waarin sprake is van samenloop een
      inhouding op de doorbetaling van bezoldiging als bedoeld in het vijfde lid toegepast welke overeenkomt met het
      bedrag van bedoelde financiële tegemoetkoming.

      9 Indien aan de in [hoofdstuk 7 van de Wet arbeid en zorg][ref3] gestelde voorwaarden voor het toekennen van een
      financiële tegemoetkoming is voldaan maar geen financiële tegemoetkoming is toegekend omdat de ambtenaar geen
      aanvraag heeft ingediend, past het bevoegd gezag het zesde lid op overeenkomstige wijze toe. In dat geval wordt
      rekening gehouden met de financiële tegemoetkoming die aan de ambtenaar zou zijn toegekend indien hij wel een
      aanvraag zou hebben ingediend.

      10 De ambtenaar is verplicht tot terugbetaling van de bezoldiging over de genoten verlofuren wanneer hem binnen
      een jaar na afloop van het verlof ontslag wordt verleend op aanvraag dan wel niet op aanvraag op grond van aan de
      ambtenaar te wijten feiten of omstandigheden. Ontslag op aanvraag gevolgd door een overgang binnen een maand naar
      een andere functie binnen de rijksdienst wordt niet als ontslag beschouwd. Het tot aanstelling bevoegd gezag kan de
      ambtenaar ontheffen van de in de eerste volzin bedoelde verplichting indien er bijzondere omstandigheden zijn die
      dat naar het oordeel van het tot aanstelling bevoegd gezag rechtvaardigen.

      11 De ambtenaar meldt het voornemen verlof te nemen ten minste twee maanden voor het door hem gewenste tijdstip van
      ingang van het verlof schriftelijk aan het tot verlening van het verlof bevoegde gezag onder opgave van:

      a. de aaneengesloten periode van het verlof;

      b. het aantal uren verlof per week;

      c. de spreiding van de verlofuren over de week.

      De tijdstippen van ingang en einde van het verlof kunnen afhankelijk worden gesteld van de datum van de bevalling,
      van het einde van het bevallingsverlof of van de aanvang van de verzorging.

      12 Het bevoegd gezag is verplicht in te stemmen met een aanvraag van de ambtenaar het verlof niet op te nemen
      of niet voort te zetten op grond van onvoorziene omstandigheden, tenzij gewichtige redenen van dienstbelang zich
      hiertegen verzetten. Het bevoegd gezag behoeft aan de aanvraag niet met ingang van een vroeger tijdstip gevolg te
      geven dan vier weken na de aanvraag. In het geval het verlof met toepassing van de eerste volzin, na het tijdstip
      van ingang daarvan niet wordt voortgezet, vervalt de aanspraak op het overige deel van dat verlof.

      13 Het bevoegd gezag kan, na overleg met de ambtenaar, de spreiding van de uren over de week op grond van
      gewichtige redenen van dienstbelang wijzigen tot vier weken voor het tijdstip van ingang van het verlof.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel8.14b
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Hoofdstuk7
      [ref3]: https://wetten.overheid.nl/BWBR0013008#Hoofdstuk7
