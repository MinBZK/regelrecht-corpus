  - number: '96'
    text: |-
      1 De ambtenaar is verplicht aan het tot aanstelling bevoegd gezag, op een door dit gezag te bepalen wijze, opgave
      te doen van de nevenwerkzaamheden die hij verricht of voornemens is te gaan verrichten, die de belangen van de
      dienst voor zover deze in verband staan met zijn functievervulling, kunnen raken.

      2 Het tot aanstelling bevoegd gezag voert een registratie op basis van de op grond van het eerste lid gedane
      opgaven.

      3 Het is de ambtenaar verboden nevenwerkzaamheden te verrichten waardoor de goede vervulling van zijn functie of
      de goede functionering van de openbare dienst, voor zover deze in verband staat met zijn functievervulling, niet
      in redelijkheid zou zijn verzekerd. Door het tot aanstelling bevoegd gezag kunnen nadere regels omtrent dit verbod
      worden gesteld.
    url: https://wetten.overheid.nl/BWBR0003229/2007-06-20#Artikel96
  - number: 96a
    text: |-
      1 Het tot aanstelling bevoegd gezag wijst de ambtenaren aan die werkzaamheden verrichten waaraan in het bijzonder
      het risico van financiële belangenverstrengeling of het risico van oneigenlijk gebruik van koersgevoelige
      informatie verbonden is. De aangewezen ambtenaar meldt financiële belangen, alsmede het bezit van en transacties
      met effecten die de belangen van de dienst voor zover deze in verband staan met zijn functievervulling kunnen
      raken, aan een daartoe aangewezen functionaris.

      2 Het tot aanstelling bevoegd gezag voert een registratie van de op grond van het eerste lid gedane meldingen.

      3 De ambtenaar verstrekt nadere informatie of bescheiden met betrekking tot de financiële belangen of het bezit van
      of de transacties met effecten, indien daarvoor naar het oordeel van het tot aanstelling bevoegd gezag of de door
      dit gezag aangewezen functionaris, bedoeld in het eerste lid, aanleiding bestaat op grond van de melding of na de
      melding gebleken feiten of omstandigheden.

      4 De ambtenaar heeft geen financiële belangen, bezit geen effecten of verricht geen effectentransacties waardoor de
      goede vervulling van zijn functie of het goed functioneren van de openbare dienst, voorzover dit in verband staat
      met zijn functievervulling, niet in redelijkheid zou zijn verzekerd.

      5 Door het tot aanstelling bevoegd gezag kunnen nadere regels worden gesteld omtrent de melding, bedoeld in het
      eerste lid, de registratie, bedoeld in het tweede lid, en het verbod, bedoeld in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0003229/2007-06-20#Artikel96a
  - number: '97'
    text: |-
      1 Het is de ambtenaar verboden, middellijk of onmiddellijk deel te nemen aan aannemingen en leveringen ten behoeve
      van openbare diensten, tenzij daarvoor toestemming is verleend.

      2 Hij is verplicht zich te gedragen naar hetgeen voor hem is bepaald ten aanzien van het deelnemen, middellijk of
      onmiddellijk, aan aannemingen en leveringen ten behoeve van anderen.
    url: https://wetten.overheid.nl/BWBR0003229/2007-06-20#Artikel97
  - number: '98'
    text: |-
      1 Het is de ambtenaar verboden, anders dan met goedvinden van het tot aanstelling bevoegd gezag, vergoedingen,
      beloningen, giften of beloften van derden te vorderen, te verzoeken of aan te nemen.

      2 Het aannemen van steekpenningen is onvoorwaardelijk en ten strengste verboden.
    url: https://wetten.overheid.nl/BWBR0003229/2007-06-20#Artikel98
  - number: '99'
    text: |-
      1 De ambtenaar is verplicht de dienstkleding en de onderscheidingstekenen te dragen, indien en voor zover dit voor
      hem voorgeschreven is.

      2 De Kamer verstrekt de voorgeschreven dienstkleding. De aanschaf en het onderhoud van de dienstkleding geschieden
      voor haar rekening.
    url: https://wetten.overheid.nl/BWBR0003229/2007-06-20#Artikel99
  - number: '100'
    text: |-
      1 De ambtenaar kan worden verplicht tot gehele of gedeeltelijke vergoeding van de door de dienst geleden schade,
      voor zover deze aan hem is te wijten.

      2 Het bedrag van de schadevergoeding wordt niet vastgesteld, dan nadat de ambtenaar in de gelegenheid is gesteld
      zich schriftelijk of mondeling te verantwoorden.
    url: https://wetten.overheid.nl/BWBR0003229/2007-06-20#Artikel100
  - number: '101'
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties kan regels stellen ten aanzien van telewerken. Deze
      regels hebben in ieder geval betrekking op:

      a. de inrichting van de telewerkplek;

      b. de beschikbaarstelling door het bevoegd gezag van apparatuur;

      c. de wijze waarop de werkcontacten tussen de ambtenaar en zijn dienstonderdeel zullen plaatsvinden;

      d. de wijze waarop wordt voorzien in een vergoeding van de door de ambtenaar gemaakte kosten;

      e. de wijze waarop het overleg met de vertegenwoordigers van het personeel wordt gevoerd.
    url: https://wetten.overheid.nl/BWBR0003229/2007-06-20#Artikel101
  - number: '103'
    text: |-
      1 De ambtenaar heeft recht op vergoeding wegens reis- en verblijfkosten ter zake van dienstreizen.

      2 Deze vergoeding wordt vastgesteld overeenkomstig de daarvoor gestelde regels.
    url: https://wetten.overheid.nl/BWBR0003229/2007-06-20#Artikel103
  - number: '104'
    text: |-
      1 Het tot aanstelling bevoegd gezag kan naar billijkheid de ambtenaar schadeloos stellen, kosten vergoeden of
      overigens een geldelijke tegemoetkoming verlenen.

      2 De ambtenaar en de gewezen ambtenaar die een beroepsincident als bedoeld in [artikel 70, onderdeel f][ref1],
      hebben gehad, hebben recht op volledige vergoeding van de schade die zij ten gevolge van dat beroepsincident
      lijden. In overeenstemming met de ambtenaar kan deze vergoeding mede strekken ter vervanging van de uitkering,
      bedoeld in [artikel 73, zevende lid][ref2].

      3 Het tot aanstelling bevoegd gezag is bevoegd omtrent schadeloosstelling, kostenvergoedingen en overige geldelijke
      tegemoetkomingen aan groepen van ambtenaren in overeenstemming met Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties nadere regels te geven.


      [ref1]: https://wetten.overheid.nl/BWBR0003229#Artikel70
      [ref2]: https://wetten.overheid.nl/BWBR0003229#Artikel73
    url: https://wetten.overheid.nl/BWBR0003229/2007-06-20#Artikel104
