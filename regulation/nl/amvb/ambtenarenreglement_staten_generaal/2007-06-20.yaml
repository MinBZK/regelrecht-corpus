  - number: '108'
    text: Verplichting tot zekerheidstelling wordt de ambtenaar niet opgelegd.
    url: https://wetten.overheid.nl/BWBR0003229/2007-06-20#Artikel108
  - number: '109'
    text: |-
      1 De ambtenaar die namens de Eerste of de Tweede Kamer der Staten-Generaal is belast met de in
      [artikel 24, tweede en derde lid, van de Comptabiliteitswet 2001][ref1] vermelde taken, is verplicht een tekort
      geheel of gedeeltelijk aan te zuiveren, wanneer hem ter zake van dat tekort een ernstig verwijt kan worden gemaakt.

      2 De ambtenaar die namens de Eerste of de Tweede Kamer der Staten-Generaal is belast met het in
      [artikel 25, tweede lid, van de Comptabiliteitswet 2001][ref2] bedoelde beheer, is verplicht schade te vergoeden,
      wanneer hem ter zake van die schade een ernstig verwijt kan worden gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0013891#Artikel25
