      - id: ref1
        bwb_id: BWBR0013008
  - number: 62d
    text: |-
      1 De gewezen vrouwelijke ambtenaar, wier tijdstip van ingang van haar ontslag is gelegen in de periode, bedoeld
      in [artikel 62c, eerste lid][ref1], behoudt haar aanspraak op bezoldiging vermeerderd met haar vakantie-uitkering.
      De aanspraak eindigt na 16 weken, te rekenen vanaf de eerste dag waarop haar zwangerschapsverlof als bedoeld in
      [artikel 62c, derde lid][ref2], een aanvang heeft genomen.

      2 De gewezen ambtenaar, wier bevalling waarschijnlijk is binnen vier maanden na het tijdstip van ingang van haar
      ontslag, ontvangt haar laatstelijk genoten bezoldiging vermeerderd met haar vakantie-uitkering gedurende de periode
      die:

      a. aanvangt op de 41e dag voorafgaande aan de vermoedelijke datum van bevalling; en

      b. eindigt op de 70e dag na de datum waarop de bevalling heeft plaatsgevonden.

      3 De periode, bedoeld in het tweede lid, wordt verlengd tot 16 weken, indien die periode door een voortijdige
      bevalling minder dan 16 weken heeft bedragen.

      4 De gewezen ambtenaar wier bevalling niet wordt verwacht binnen vier maanden na het tijdstip van ingang van haar
      ontslag, maar die niettemin binnen die termijn bevalt, ontvangt haar laatstelijk genoten bezoldiging vermeerderd
      met haar vakantie-uitkering gedurende de periode die:

      a. aanvangt op de datum van bevalling; en

      b. eindigt op de 70e dag na de datum waarop de bevalling heeft plaatsgevonden.

      5 De [artikelen 62c, vijfde en zesde lid][ref3], [75, tweede lid][ref4], en [83a][ref5], zijn van overeenkomstige
      toepassing.


