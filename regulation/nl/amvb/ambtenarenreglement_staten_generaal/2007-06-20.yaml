  - number: '2'
    text: |-
      1 De in dit besluit bedoelde bevoegdheden van de Kamer, kunnen uitsluitend worden uitgeoefend ten aanzien van de
      ambtenaren, in dienst van de desbetreffende Kamer.

      2 De in dit besluit bedoelde bevoegdheden van de Gemengde Commissie kunnen uitsluitend worden uitgeoefend ten
      aanzien van de ambtenaren bedoeld in het Reglement voor de openbaarmaking van het verslag van het verhandelde in de
      vergaderingen der Staten-Generaal.

      3 De in dit besluit bedoelde bevoegdheden van de Gemengde Commissie van toezicht kunnen uitsluitend betrekking
      hebben op de ambtenaren bedoeld in het Reglement voor de Griffie voor de interparlementaire betrekkingen der
      Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0003229/2007-06-20#Artikel2
  - number: '3'
    text: |-
      De Kamer, de Gemengde Commissie onderscheidenlijk de Gemengde Commissie van toezicht is het tot aanstelling bevoegd
      gezag.
    url: https://wetten.overheid.nl/BWBR0003229/2007-06-20#Artikel3
  - number: '4'
    text: |-
      1 De bepalingen van dit besluit vinden slechts toepassing, voor zover niet anders is of wordt bepaald hetzij bij
      of krachtens een wet, hetzij in het [Reglement van Orde van de Eerste Kamer der Staten-Generaal][ref1], in het
      [Reglement van Orde van de Tweede Kamer der Staten-Generaal][ref2], in het Reglement voor de openbaarmaking van het
      verslag van het verhandelde in de vergaderingen der Staten-Generaal, dan wel in het Reglement voor de griffie voor
      de interparlementaire betrekkingen der Staten-Generaal.

      2 Op de ambtenaar die is aangesteld voor het verrichten van enkele diensten niet vallende binnen de taak van het
      betrokken dienstvak, waarbij per dienst een afzonderlijke beloning wordt vastgesteld, zijn niet van toepassing:

      a. hoofdstuk II, paragraaf 4;

      b. de artikelen 20 en 24 tot en met 32;

      c. de hoofdstukken IV en V;

      d. hoofdstuk VI, paragrafen 2 en 3;

      e. de artikelen 78, 80, 82 en 84.


      [ref1]: https://wetten.overheid.nl/BWBR0007428
      [ref2]: https://wetten.overheid.nl/BWBR0006023
