  - number: '82'
    text: |-
      1 In bijzondere gevallen kan aan de ambtenaar een tegemoetkoming worden toegekend in noodzakelijk gemaakte kosten
      die verband houden met ziekte, welke de ambtenaar voor zichzelf en voor zijn medebelanghebbenden heeft gemaakt:

      a) indien hierin niet ingevolge een andere regeling kan worden voorzien; en

      b) deze kosten redelijkerwijs niet voor zijn rekening kunnen blijven.

      2 Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties kan omtrent het bepaalde in het eerste lid nadere
      regels vaststellen.
    url: https://wetten.overheid.nl/BWBR0003229/2007-06-20#Artikel82
  - number: '83'
    text: |-
      1 Indien de ziekte, uit hoofde waarvan de ambtenaar of de gewezen ambtenaar ongeschikt is zijn arbeid te
      verrichten, voortvloeit uit een dienstongeval of een door het verrichten van zijn arbeid opgelopen beroepsziekte,
      worden hem vergoed de naar het oordeel van het tot aanstelling bevoegd gezag noodzakelijk gemaakte kosten van
      geneeskundige behandeling of verzorging die ten laste van de ambtenaar blijven.

      2 Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties kan omtrent het bepaalde in het eerste lid nadere
      regels vaststellen.
    url: https://wetten.overheid.nl/BWBR0003229/2007-06-20#Artikel83
  - number: 83a
    text: |-
      1 Het bedrag van de bezoldiging of de laatstelijk genoten bezoldiging, bedoeld in de [artikelen 73][ref1] en
      [74][ref2], wordt in voorkomende gevallen gewijzigd overeenkomstig een algemene salariswijziging.

      2 Indien de ambtenaar in het genot is van een toelage als bedoeld in [artikel 17][ref3], [17a][ref4], [18][ref5]
      of [18a van het Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref6], worden die toelagen voor de
      vaststelling van het in het eerste lid bedoelde bedrag, vastgesteld op het bedrag dat hem ingevolge de voor hem
      geldende werktijdregeling zou zijn toegekend indien hij niet ongeschikt was geworden tot het verrichten van zijn
      arbeid wegens ziekte. Indien de vaststelling van het bedrag op deze wijze niet mogelijk is, dan wordt dit bedrag
      vastgesteld op het gemiddelde van het bedrag dat de ambtenaar per maand aan die toelagen heeft genoten over de drie
      kalendermaanden voorafgaande aan:

      a) de kalendermaand waarin de ambtenaar ongeschikt is geworden tot het verrichten van zijn arbeid wegens ziekte; of

      b) de kalendermaand waarin de gewezen ambtenaar wegens ziekte ongeschikt is geworden een naar aard en omvang
      soortgelijke betrekking te vervullen.

      3 Indien ook voor het overige de bezoldiging niet in een vast bedrag per maand kan worden uitgedrukt, wordt
      gerekend met het bedrag dat gemiddeld per maand is toegekend in de drie kalendermaanden voorafgaande aan de maand
      waarin:

      a) de ambtenaar ongeschikt is geworden tot het verrichten van zijn arbeid wegens ziekte;

      b) de gewezen ambtenaar wegens ziekte ongeschikt is geworden een naar aard en omvang soortgelijke betrekking te
      vervullen.

      4 Voor zover de ambtenaar of de gewezen ambtenaar geen drie kalendermaanden in dienst is geweest, wordt voor
      de toepassing van het tweede en derde lid gerekend met het bedrag dat hem gemiddeld aan bezoldiging per maand
      is toegekend over het tijdvak waarin hij in dienst is geweest vóór het ontstaan van de ongeschiktheid tot het
      verrichten van zijn arbeid respectievelijk tot het vervullen van een naar aard en omvang soortgelijke betrekking.


      [ref1]: https://wetten.overheid.nl/BWBR0003229#Artikel73
