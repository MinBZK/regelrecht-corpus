        bwb_id: BWBR0003630
        artikel: '22'
  - number: 84a
    text: |-
      1 Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties kan regels vaststellen omtrent de te volgen procedure
      bij reorganisaties en het herplaatsen van ambtenaren.

      2 Het tot aanstelling bevoegd gezag kan nadere procedures en regels vaststellen omtrent reorganisaties en het
      herplaatsen van ambtenaren.
    url: https://wetten.overheid.nl/BWBR0003229/2007-06-20#Artikel84a
  - number: 84b
    text: |-
      1 Bij een reorganisatie zijn de bepalingen van dit hoofdstuk van toepassing.

      2 Onder reorganisatie als bedoeld in het eerste lid wordt verstaan: iedere wijziging van de organisatiestructuur,
      de omvang of de taakinhoud van de Kamer, de Stenografische Dienst of de Griffie voor de interparlementaire
      betrekkingen, of een onderdeel daarvan, waaraan personele consequenties zijn verbonden.

      3 De bepalingen van dit hoofdstuk zijn van overeenkomstige toepassing op de overgang van de ambtenaar naar een
      private onderneming of zelfstandig bestuursorgaan in verband met de privatisering of verzelfstandiging van het
      dienstonderdeel van de Kamer, de Stenografische Dienst of de Griffie voor de interparlementaire betrekkingen,
      waarbij de ambtenaar werkzaam is, tenzij bij algemeen verbindend voorschrift anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0003229/2007-06-20#Artikel84b
  - number: 84ba
    text: |-
      1 Door of namens het tot aanstelling bevoegd gezag worden de centrales van verenigingen van ambtenaren tijdig
      geïnformeerd over een voorgenomen besluit tot een reorganisatie.

      2 Door of namens het tot aanstelling bevoegd gezag worden de betrokken ondernemingsraden tijdig geïnformeerd over
      een voorgenomen besluit tot reorganisatie.
    url: https://wetten.overheid.nl/BWBR0003229/2007-06-20#Artikel84ba
  - number: 84d
    text: |-
      De ambtenaar die is aangesteld in tijdelijke dienst voor een proeftijd en de ambtenaar aangesteld in vaste dienst,
      wier functie in verband met een reorganisatie is opgeheven, wordt aangewezen als te herplaatsen ambtenaar, hierna
      te noemen: herplaatsingskandidaat.
    url: https://wetten.overheid.nl/BWBR0003229/2007-06-20#Artikel84d
  - number: 84e
    text: |-
      1 Van overtolligheid is sprake indien binnen de te reorganiseren Kamer, de Stenografische Dienst, de Griffie
      voor de interparlementaire betrekkingen van de Staten-Generaal of een onderdeel daarvan, meer ambtenaren een
      vergelijkbare of uitwisselbare functie vervullen en het totale aantal van die functies zodanig wordt verminderd dat
      onvoldoende van de functies voor de betrokken ambtenaren resteren.

      2 De ambtenaar die is aangesteld in tijdelijke dienst voor een proeftijd en de ambtenaar aangesteld in vaste
      dienst, die in verband met een reorganisatie overtollig zijn, worden aangewezen als herplaatsingskandidaat,
      waarbij de ambtenaar die het geringste aantal jaren in overheidsdienst heeft doorgebracht het eerst als
      herplaatsingskandidaat wordt aangewezen.

      3 Voor de berekening van het aantal in overheidsdienst doorgebrachte jaren wordt mede in aanmerking genomen
      tijd gewijd aan de verzorging van tot het huishouden van de ambtenaar behorende 0–4 jarige eigen, stief- of
      pleegkinderen, tot een maximum van in totaal zes jaren.

      4 Het tot aanstellen bevoegd gezag kan van de volgorde in het tweede lid afwijken indien zulks naar zijn oordeel
      noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0003229/2007-06-20#Artikel84e
  - number: 84f
    text: De ambtenaar wordt omtrent zijn aanwijzing als herplaatsingskandidaat zo spoedig mogelijk geïnformeerd.
    url: https://wetten.overheid.nl/BWBR0003229/2007-06-20#Artikel84f
  - number: 84g
    text: |-
      1 Onverminderd het gestelde in artikel 126, eerste lid is het tot aanstelling bevoegd gezag verplicht om de
      ambtenaar binnen een periode van 18 maanden, te rekenen vanaf het moment dat de ambtenaar is aangewezen als
      herplaatsingskandidaat, ten minste één passende functie aan te bieden.

      2 Het tot aanstelling bevoegd gezag kan de termijn als bedoeld in het eerste lid verkorten indien:

      a. de herplaatsingskandidaat heeft geweigerd te voldoen aan een hem op grond van dit hoofdstuk opgelegde
      verplichting, of;

      b. reeds eerder in overleg met de ambtenaar binnen de termijn kan worden vastgesteld dat er geen mogelijkheden zijn
      om de herplaatsingskandidaat te herplaatsen.

      3 Het tot aanstelling bevoegd gezag kan de termijn verlengen of opschorten, indien de omstandigheden naar zijn
      oordeel daartoe aanleiding geven.

      4 De ambtenaar wordt gelijktijdig met zijn aanwijzing als herplaatsingskandidaat geïnformeerd over de aanvang en
      het einde van de termijn als bedoeld in het eerste lid.

      5 Door het tot aanstelling bevoegd gezag wordt de herplaatsingskandidaat geïnformeerd over het verkorten, verlengen
      of opschorten van de termijn als bedoeld in het tweede en het derde lid.
    url: https://wetten.overheid.nl/BWBR0003229/2007-06-20#Artikel84g
  - number: 84h
    text: |-
      1 Van een passende functie als bedoeld in [artikel 84g][ref1] is sprake indien de herplaatsingskandidaat naar het
      oordeel van het tot aanstelling bevoegd gezag beschikt over de kennis en kunde die noodzakelijk worden geacht om
      de functie naar behoren te kunnen uitoefenen danwel indien de herplaatsingskandidaat naar het oordeel van het tot
      aanstelling bevoegd gezag binnen redelijke termijn om-, her- of bijgeschoold kan worden, en deze functie hem in
      verband met zijn persoonlijkheid, zijn omstandigheden en de voor hem bestaande vooruitzichten, redelijkerwijs kan
      worden opgedragen.

      2 Bij het eerste lid geldt de beperking dat uitsluitend sprake kan zijn van een passende functie indien de voor
      de functie geldende salarisschaal niet meer dan twee schalen lager is dan de salarisschaal die geldt voor de
      herplaatsingskandidaat.

      3 Het tot aanstelling bevoegd gezag kan de herplaatsingskandidaat plaatsen op een functie waarvan de geldende
      salarisschaal meer dan twee schalen lager is dan de salarisschaal die geldt voor de herplaatsingskandidaat indien
      er bijzondere omstandigheden zijn die zulks rechtvaardigen en indien de herplaatsingskandidaat daarmee instemt.

      4 Bij een herplaatsing met toepassing van het derde lid zijn de [artikelen 84k][ref2] en [84n][ref3] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003229#Artikel84g
      [ref2]: https://wetten.overheid.nl/BWBR0003229#Artikel84k
      [ref3]: https://wetten.overheid.nl/BWBR0003229#Artikel84n
    url: https://wetten.overheid.nl/BWBR0003229/2007-06-20#Artikel84h
    references:
      - id: ref1
        bwb_id: BWBR0003229
        artikel: 84g
        hoofdstuk: VII
      - id: ref2
        bwb_id: BWBR0003229
        artikel: 84k
        hoofdstuk: VII
      - id: ref3
        bwb_id: BWBR0003229
        artikel: 84n
        hoofdstuk: VII
  - number: 84i
    text: |-
      Het tot aanstelling bevoegd gezag kan de naar zijn oordeel meest geschikte herplaatsingskandidaat, voor wie de
      functie als passend wordt aangemerkt, herplaatsen in die functie.
    url: https://wetten.overheid.nl/BWBR0003229/2007-06-20#Artikel84i
  - number: 84j
    text: |-
      1 Onverminderd het bepaalde in artikel 84*g*, eerste lid, is de herplaatsingskandidaat verplicht al het mogelijke
      te doen om een passende fucntie te vinden.

      2 De herplaatsingskandidaat is verplicht een passende functie te aanvaarden.
    url: https://wetten.overheid.nl/BWBR0003229/2007-06-20#Artikel84j
  - number: 84k
    text: |-
      De herplaatsingskandidaat die slechts in een voor hem passende functie kan worden herplaatst na om-, her- of
      bijscholing kan hiertoe worden verplicht, voor zover dat redelijkerwijs van hem kan worden gevergd. Artikel 94,
      tweede lid, eerste volzin, derde, zesde en zevende lid zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0003229/2007-06-20#Artikel84k
  - number: 84l
    text: |-
      1 De herplaatsingskandidaat die heeft geweigerd te voldoen aan een hem op grond van dit hoofdstuk opgelegde
      verplichting, kan in verband daarmee ontslag worden verleend.

      2 Bij een ontslagverlening op grond van het eerste lid wordt een opzeggingstermijn van drie maanden in acht
      genomen.
    url: https://wetten.overheid.nl/BWBR0003229/2007-06-20#Artikel84l
  - number: 84n
    text: |-
      1 De ambtenaar die in verband met zijn herplaatsing of plaatsing in een passende functie in opdracht van het tot
      aanstelling bevoegd gezag is verhuisd, wordt eenmalig een bedrag toegekend van € 10 890,73 bruto ter tegemoetkoming
      in de daarmee verband houdende kosten.

      2 In de gevallen waarin de ambtenaar en zijn echtgenoot beiden in aanmerking komen voor het bedrag bedoeld in het
      eerste lid ontvangt elk de helft daarvan.

      3 Het bedrag bedoeld in het eerste lid wordt niet toegekend, indien de verhuizing niet heeft plaatsgevonden binnen
      twee jaren nadat de opdracht om te verhuizen is gegeven.
    url: https://wetten.overheid.nl/BWBR0003229/2007-06-20#Artikel84n
  - number: 84o
    text: |-
      Het tot aanstellen bevoegd gezag kan de herplaatsingskandidaat een premie in het vooruitzicht stellen ter grootte
      van maximaal drie maandsalarissen indien hem binnen 18 maanden nadat hij is aangewezen als herplaatsingskandidaat
      op zijn aanvraag eervol ontslag wordt verleend.
    url: https://wetten.overheid.nl/BWBR0003229/2007-06-20#Artikel84o
  - number: 84p
    text: |-
      1 De herplaatsingskandidaat aan wie eervol ontslag op zijn aanvraag is verleend wegens de aanvaarding van een
      functie kan, onverminderd het bepaalde in artikel 84*o*, een salarissuppletie worden toegekend indien het in de
      nieuwe functie genoten salaris lager is dan het salaris in de oorspronkelijke functie.

      2 De suppletie als bedoeld in het eerste lid wordt toegekend gedurende maximaal 5 jaar en is ten hoogste gelijk aan
      het verschil tussen het in de oorspronkelijke functie genoten salaris en het salaris in de nieuwe functie.

      3 Onder door het tot aanstelling bevoegd gezag te stellen voorwaarden kan het recht op suppletie op aanvraag van de
      herplaatsingskandidaat worden afgekocht.
    url: https://wetten.overheid.nl/BWBR0003229/2007-06-20#Artikel84p
  - number: 84q
    text: |-
      Het tot aanstellen bevoegd gezag kan de [artikelen 84j, tweede lid][ref1], [84k][ref2], [84n][ref3] en [84p][ref4]
      toepassen op de ambtenaar wiens functie binnen afzienbare tijd wordt opgeheven of die als overtollig zal worden
      aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0003229#Artikel84j
      [ref2]: https://wetten.overheid.nl/BWBR0003229#Artikel84k
      [ref3]: https://wetten.overheid.nl/BWBR0003229#Artikel84n
      [ref4]: https://wetten.overheid.nl/BWBR0003229#Artikel84p
    url: https://wetten.overheid.nl/BWBR0003229/2007-06-20#Artikel84q
    references:
      - id: ref1
        bwb_id: BWBR0003229
        artikel: 84j
        hoofdstuk: VII
      - id: ref2
        bwb_id: BWBR0003229
        artikel: 84k
        hoofdstuk: VII
      - id: ref3
        bwb_id: BWBR0003229
        artikel: 84n
        hoofdstuk: VII
      - id: ref4
        bwb_id: BWBR0003229
        artikel: 84p
        hoofdstuk: VII
  - number: '85'
    text: |-
      1 De ambtenaar is gehouden de plichten uit zijn functie voortvloeiende, nauwgezet en ijverig te vervullen en zich
      te gedragen, zoals een goed ambtenaar betaamt.

      2 Het is de ambtenaar verboden in dienst uniformkledingstukken te dragen, tenzij deze door de Kamer zijn verstrekt
      of voorgeschreven.

      3 Het is de ambtenaar verboden bij gekleed gaan in uniform insignes of andere onderscheidingstekens te dragen,
      tenzij deze zijn verstrekt of voorgeschreven door de Kamer.
    url: https://wetten.overheid.nl/BWBR0003229/2007-06-20#Artikel85
  - number: '86'
    text: |-
      1 De ambtenaar is verplicht een eed of een belofte af te leggen.

      2 Het tot aanstelling bevoegd gezag stelt regels inzake het afleggen door de ambtenaar van de eed of de belofte.

      3 Bij regeling van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties wordt het formulier vastgesteld dat
      wordt gebruikt voor het afleggen door de ambtenaar van de eed of de belofte.
    url: https://wetten.overheid.nl/BWBR0003229/2007-06-20#Artikel86
  - number: '87'
    text: |-
      Ter zake van niet-naleving van bepalingen, welke redelijkerwijs niet kunnen worden geacht de ambtenaar bekend te
      zijn, worden hem geen voordelen onthouden of nadelen toegebracht.
    url: https://wetten.overheid.nl/BWBR0003229/2007-06-20#Artikel87
  - number: '89'
    text: |-
      Indien de ambtenaar verhinderd is zijn dienst te verrichten, is hij verplicht daarvan, onder opgave van redenen, zo
      tijdig mogelijk mededeling te doen, ten einde vertraging of hinder in de dienst zoveel doenlijk te voorkomen.
    url: https://wetten.overheid.nl/BWBR0003229/2007-06-20#Artikel89
  - number: '90'
    text: |-
      1 De ambtenaar kan worden verplicht te gaan wonen of te blijven wonen in of nabij de gemeente die hem als
      standplaats is aangewezen of waartoe zijn standplaats behoort, indien dit naar het oordeel van het bevoegd gezag
      noodzakelijk is in verband met de goede vervulling van zijn functie.

      2 De ambtenaar aan wie de verplichting is opgelegd in of nabij de in het eerste lid bedoelde gemeente te gaan
      wonen, is gehouden zo spoedig mogelijk, maar uiterlijk twee jaar nadat die verplichting is opgelegd, daaraan gevolg
      te geven.
    url: https://wetten.overheid.nl/BWBR0003229/2007-06-20#Artikel90
  - number: '91'
    text: |-
      1 De ambtenaar is verplicht indien hem een ambts- of dienstwoning ter bewoning is aangewezen, deze te betrekken en
      zich ter zake van de bewoning en het gebruik te gedragen naar de voorschriften, die daaromtrent zijn gesteld.

      2 Hij draagt de onderhoudskosten, welke volgens de wet en het plaatselijk gebruik gemeenlijk voor rekening van de
      huurder zijn, tenzij door het bevoegd gezag ter zake een afwijkende regeling is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003229/2007-06-20#Artikel91
  - number: '92'
    text: |-
      1 De ambtenaar kan op zijn aanvraag een andere functie worden opgedragen.

      2 Wanneer het belang van de dienst zulks vordert, is de ambtenaar verplicht, een andere passende functie te
      aanvaarden:

      a. overeenkomstig het bepaalde in artikel 84*h* indien het gaat om een verplaatsing in het kader van een
      reorganisatie, en;

      b. overeenkomstig het bepaalde in artikel 84*h*, eerste lid in de overige gevallen.
    url: https://wetten.overheid.nl/BWBR0003229/2007-06-20#Artikel92
  - number: 92b
    text: |-
      1 Indien de ambtenaar van 57 jaar of ouder op diens aanvraag een functie wordt opgedragen waaraan een salarisschaal
      is verbonden met een lager maximumsalaris dan dat van de reeds voor hem geldende salarisschaal, wordt op zijn
      salaris een inhouding toegepast.

      2 De inhouding is gelijk aan het verschil tussen het salaris dat de ambtenaar geniet en het salaris dat
      de ambtenaar zou genieten bij inpassing in de bij de nieuwe functie behorende salarisschaal op hetzelfde
      salarisnummer. Indien dit salarisnummer in laatstbedoelde salarisschaal niet voorkomt, geschiedt de inpassing op
      het naastlagere salarisnummer.

      3 Indien na 52 weken ziekte de doorbetaling van de bezoldiging op grond van [artikel 72, eerste lid][ref1], wordt
      teruggebracht tot 70%, wordt de inhouding opgeschort voor de duur van de ziekte.

      4 In bijzondere gevallen kan het tot aanstellen bevoegd gezag geheel of gedeeltelijk van de inhouding afzien.


      [ref1]: https://wetten.overheid.nl/BWBR0003229#Artikel72
