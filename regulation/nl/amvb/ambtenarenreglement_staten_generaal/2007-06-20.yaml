  - number: 134b
    text: |-
      1 Indien het overlijden van de ambtenaar is veroorzaakt door een dienstongeval of een door het verrichten van zijn
      arbeid opgelopen beroepsziekte, wordt aan degene die in verband met dit overlijden krachtens het Pensioenreglement
      van de Stichting Pensioenfonds ABP, een nabestaandenpensioen geniet, een uitkering toegekend ten bedrage van 18
      procent van het resultaat van de vermenigvuldiging van:

      a) indien het gaat om de partner, bedoeld in artikel 7.1 van het Pensioenreglement van de Stichting
      Pensioenfonds ABP, vijf zevende deel van 1,75 procent van de berekeningsgrondslag, bedoeld in artikel 6.2 van het
      Pensioenreglement van de Stichting Pensioenfonds ABP en de pensioengeldige diensttijd, bedoeld in hoofdstuk 5 van
      het Pensioenreglement van de Stichting Pensioenfonds ABP;

      b) indien het gaat om de wees, bedoeld in artikel 7.7, eerste lid, aanhef, onderdeel a, van het Pensioenreglement
      van de Stichting Pensioenfonds ABP, een zevende deel van 1,75 procent van de berekeningsgrondslag, bedoeld in
      artikel 6.2 van het Pensioenreglement van de Stichting Pensioenfonds ABP, en de pensioengeldige diensttijd, bedoeld
      in hoofdstuk 5 van het Pensioenreglement van de Stichting Pensioenfonds ABP;

      c) indien het gaat om de wees, bedoeld in artikel 7.7, eerste lid, aanhef, onderdeel b, van het Pensioenreglement
      van de Stichting Pensioenfonds ABP, twee zevende deel van 1,75 procent van de berekeningsgrondslag, bedoeld in
      artikel 6.2 van het Pensioenreglement van de Stichting Pensioenfonds ABP, en de pensioengeldige diensttijd, bedoeld
      in hoofdstuk 5 van het Pensioenreglement van de Stichting Pensioenfonds ABP.

      Indien de weduwe of weduwnaar een samenlevingscontract sluit dan wel een geregistreerd partnerschap aangaat,
      eindigt de uitkering met ingang van de maand volgend op de datum van het sluiten van het samenlevingscontract dan
      wel het aangaan van het geregistreerd partnerschap.

      2 De uitkering eindigt met ingang van de dag waarop de overledene de leeftijd van 65 jaar zou hebben bereikt, dan
      wel, indien de partner, bedoeld in artikel 7.1 van het Pensioenreglement van de Stichting Pensioenfonds ABP, aan
      wie een pensioen werd toegekend, hertrouwt, met ingang van de maand volgende op de datum van het hertrouwen.

      3 Het eerste lid is van overeenkomstige toepassing op de gewezen ambtenaar ten aanzien van wie artikel 73, derde
      lid, toepassing heeft gevonden, indien zijn overlijden het rechtstreeks gevolg is van de arbeidsongeschiktheid,
      bedoeld in dat artikel.
    url: https://wetten.overheid.nl/BWBR0003229/2007-06-20#Artikel134b
  - number: '135'
    text: |-
      1 Gedurende de maand van het overlijden en de volgende drie maanden behouden de achterblijvende gezinsleden het
      gebruik der ambts- of dienstwoning, waarin zij met de ambtenaar woonden. Daarvan kan echter worden afgeweken als
      het tot aanstelling bevoegd gezag dat in het belang van de dienst noodzakelijk acht. Alsdan wordt door bedoeld
      gezag naar billijkheid een schadevergoeding gegeven.

      2 Bij vrijwillig verlaten van de ambts- of dienstwoning binnen de termijn gedurende welke de woning nog mag worden
      gebruikt, kan het tot aanstelling bevoegd gezag te zijner beoordeling een vergoeding geven.
    url: https://wetten.overheid.nl/BWBR0003229/2007-06-20#Artikel135
  - number: '136'
    text: |-
      Indien door de ambtenaar voor het gebruik der ambts- of dienstwoning een vergoeding verschuldigd was, voldoen de
      achtergebleven gezinsleden deze over de tijd, gedurende welke zij het gebruik dier woning behouden.
    url: https://wetten.overheid.nl/BWBR0003229/2007-06-20#Artikel136
  - number: '137'
    text: |-
      1 Bij vermissing van de ambtenaar vinden, behoudens het bepaalde in het tweede lid, de bepalingen van de artikelen
      134 tot en met 136 overeenkomstige toepassing. De ambtenaar wordt daarbij geacht te zijn overleden op een door het
      tot aanstelling bevoegd gezag te bepalen dag.

      2 Het bepaalde in het tweede lid van artikel 134 vindt geen toepassing indien gegronde vermoedens bestaan, dat de
      vermissing het gevolg is van ongeoorloofde afwezigheid.

      3 Indien blijkt, dat de als vermist beschouwde ambtenaar in leven is, kan ter beoordeling van het tot aanstelling
      bevoegd gezag de bezoldiging alsnog worden uitbetaald, tenzij gegronde vermoedens bestaan, dat de vermissing het
      gevolg was van ongeoorloofde afwezigheid.

      4 Indien uit hoofde van de vermissing van de ambtenaar pensioen of enige andere uitkering, voortvloeiende uit zijn
      ambtelijke rechtspositieregeling, is toegekend over het tijdvak, waarover naar het oordeel van het tot aanstelling
      bevoegd gezag aanspraak bestaat op bezoldiging, wordt die bezoldiging verminderd met de over dat tijdvak aldus
      uitbetaalde bedragen.

      5 De bezoldiging, waarop de ambtenaar ingevolge het derde en het vierde lid aanspraak heeft, kan aan anderen dan de
      ambtenaar worden uitbetaald.
    url: https://wetten.overheid.nl/BWBR0003229/2007-06-20#Artikel137
  - number: '138'
    text: |-
      Over aangelegenheden van algemeen belang voor de rechtstoestand van de ambtenaren met inbegrip van de algemene
      regels volgens welke het personeelsbeleid zal worden gevoerd, wordt niet beslist dan nadat daarover door of namens
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties overleg is gepleegd met de Sectorcommissie overleg
      rijkspersoneel.
    url: https://wetten.overheid.nl/BWBR0003229/2007-06-20#Artikel138
  - number: '139'
    text: |-
      1 Voor zover Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties in overeenstemming met de Sectorcommissie
      overleg rijkspersoneel niet anders heeft bepaald, wordt over voorgenomen besluiten tot invoering of wijziging van
      regels met rechten of verplichtingen van individuele ambtenaren en over voorgenomen besluiten tot een belangrijke
      reorganisatie, niet door het tot aanstelling bevoegd gezag beslist dan nadat door hem overleg is gevoerd met de
      centrales van verenigingen van ambtenaren.

      2 Het overleg heeft geen betrekking op aangelegenheden waarover overleg dient te worden gevoerd met de
      Sectorcommissie overleg rijkspersoneel.

      3 Een voorgenomen besluit tot invoering of wijziging van regels met rechten of verplichtingen van individuele
      ambtenaren waarover overleg met de centrales moet worden gevoerd, wordt slechts ten uitvoer gebracht indien
      daarover overeenstemming bestaat met ten minste de helft van de tot het overleg toegelaten centrales.

      4 Het overleg over voorgenomen besluiten tot een belangrijke reorganisatie heeft slechts betrekking op de
      bijzondere rechtspositionele en sociale gevolgen van het voorgenomen besluit voor de betrokken ambtenaren.
    url: https://wetten.overheid.nl/BWBR0003229/2007-06-20#Artikel139
  - number: '140'
    text: |-
      1 Het tot aanstelling bevoegd gezag laat tot het overleg toe de tot de Sectorcommissie overleg rijkspersoneel
      toegelaten centrales.

      2 Schorsing dan wel intrekking van een toelating van een centrale tot de Sectorcommissie overleg rijkspersoneel,
      heeft tot gevolg schorsing respectievelijk intrekking van de toelating tot het overleg.

      3 Het tot aanstelling bevoegd gezag kan een vertegenwoordiger van een centrale uitsluiten van deelneming aan
      het overleg indien naar het oordeel van het tot aanstelling bevoegd gezag het dienstbelang dit in verband met de
      werkzaamheden van betrokkene als ambtenaar vordert. Voordat tot uitsluiting wordt besloten wordt het bestuur van
      de desbetreffende centrale in de gelegenheid gesteld zijn zienswijze naar voren te brengen. In afwachting van de
      beslissing van het tot aanstelling bevoegd gezag neemt betrokkene niet of niet meer deel aan het overleg.
    url: https://wetten.overheid.nl/BWBR0003229/2007-06-20#Artikel140
  - number: '141'
    text: |-
      Het overleg staat onder leiding van een persoon door het tot aanstelling bevoegd gezag uit zijn midden aangewezen.
      Het tot aanstelling bevoegd gezag wijst tevens een plaatsvervangend voorzitter aan.
    url: https://wetten.overheid.nl/BWBR0003229/2007-06-20#Artikel141
  - number: '142'
    text: |-
      Het tot aanstelling bevoegd gezag kan geheimhouding opleggen ten aanzien van hetgeen in het overleg is behandeld.
      De plicht tot geheimhouding geldt niet voor zover degenen die namens de centrales aan het overleg deelnemen in
      bespreking treden met de door hen vertegenwoordigde centrales of de daarbij aangesloten verenigingen.
    url: https://wetten.overheid.nl/BWBR0003229/2007-06-20#Artikel142
  - number: '143'
    text: |-
      Het tot aanstelling bevoegd gezag draagt er zorg voor dat de ambtenaar, die in het overleg optreedt of heeft
      opgetreden namens een centrale, en de ambtenaar, die lid is geweest van de bijzondere commissie, niet uit dien
      hoofde worden benadeeld in hun positie als ambtenaar.
    url: https://wetten.overheid.nl/BWBR0003229/2007-06-20#Artikel143
  - number: 149a
    text: |-
      Voor de toepassing van de artikelen 149b tot en met 149g wordt verstaan onder:

      a. deelnemers aan het overleg: de voorzitter en de tot het overleg toegelaten centrales van verenigingen van
      ambtenaren;

      b. Advies- en Arbitragecommissie: de Advies- en Arbitragecommissie, genoemd in [artikel 110][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel110g
    url: https://wetten.overheid.nl/BWBR0003229/2007-06-20#Artikel149a
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 110g
  - number: 149b
    text: |-
      Indien de voorzitter dan wel een of meer van de centrales, in het overleg tot het oordeel komen dat dit overleg
      niet tot een uitkomst zal leiden die de instemming van alle deelnemers aan dat overleg zal hebben, brengen zij
      dat oordeel binnen 3 dagen nadat zij daarvan in het overleg blijk hebben gegeven, schriftelijk ter kennis van de
      overige deelnemers aan het overleg.
    url: https://wetten.overheid.nl/BWBR0003229/2007-06-20#Artikel149b
  - number: 149c
    text: |-
      1 Binnen vijf dagen na de kennisgeving, bedoeld in het vorige artikel, schrijft de voorzitter een
      overlegvergadering uit. De vergadering moet worden gehouden binnen zeven dagen nadat deze is uitgeschreven.

      2 Tenzij door de voorzitter en de centrales wordt besloten het overleg voort te zetten dat wel te beëindigen, wordt
      in de vergadering nagegaan of overeenstemming bestaat over de vraag wat het onderwerp en de inhoud van het geschil
      is en of een oplossing van dat geschil zal worden gezocht door middel van voortzetting van het overleg nadat het
      advies is ingewonnen van de Advies- en Arbitragecommissie, dan wel door middel van onderwerping van het geschil aan
      een arbitrale uitspraak van de Advies- en Arbitragecommissie.

      3 Tot het inwinnen van advies zijn zowel de voorzitter als de centrales bevoegd.

      4 Voor onderwerping van het geschil aan arbitrage is overeenstemming vereist tussen alle deelnemers aan het
      overleg.
    url: https://wetten.overheid.nl/BWBR0003229/2007-06-20#Artikel149c
  - number: 149d
    text: |-
      1 Binnen drie dagen na de vergadering, bedoeld in het vorige artikel, wordt het verzoek om advies ter kennis
      gebracht aan de voorzitter van de Advies- en Arbitragecommissie. Het verzoek wordt ondertekend door de deelnemers
      aan het overleg die zich voor inwinning van advies hebben uitgesproken en bevat ten minste het onderwerp en de
      inhoud van het geschil. Indien in de vergadering bedoeld in het vorige artikel geen overeenstemming is bereikt
      tussen alle deelnemers aan het overleg over de vraag wat het onderwerp en de inhoud van het geschil is, brengen
      de overige deelnemers aan het overleg hun visie op het onderwerp en de inhoud van het geschil eveneens binnen drie
      dagen na eerdergenoemde vergadering ter kennis van de voorzitter van de Advies- en Arbitragecommissie.

      2 De eerste volzin van het eerste lid is van overeenkomstige toepassing ten aanzien van het onderwerpen van het
      geschil aan een arbitrale uitspraak. Het verzoek daartoe wordt ondertekend door alle deelnemers aan het overleg en
      dient tenminste te bevatten:

      a. het onderwerp en de inhoud van het geschil;

      b. de standpunten van alle deelnemers aan het overleg omtrent onderwerp en inhoud van het geschil.
    url: https://wetten.overheid.nl/BWBR0003229/2007-06-20#Artikel149d
  - number: 149e
    text: |-
      De Advies- en Arbitragecommissie wordt voor de behandeling van het desbetreffende geschil uitgebreid met twee
      bijzondere leden die worden benoemd door het tot aanstelling bevoegde gezag. Van deze leden wordt een lid benoemd
      op voordracht van de voorzitter van het overleg met de centrales en een lid op voordracht van de tot dat overleg
      toegelaten centrales. Niet benoembaar tot bijzonder lid zijn:

      a. personen die ingevolge het vierde lid van [artikel 110][ref1] zijn uitgesloten van het lidmaatschap en het
      plaatsvervangend lidmaatschap;

      b. personen die namens de centrales aan het overleg deelnemen, dan wel wier deelname aan het overleg nog niet
      langer dan twee jaar is beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel110g
    url: https://wetten.overheid.nl/BWBR0003229/2007-06-20#Artikel149e
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 110g
  - number: 149f
    text: Binnen twee weken na ontvangst van het advies wordt het overleg over het geschil voortgezet.
    url: https://wetten.overheid.nl/BWBR0003229/2007-06-20#Artikel149f
  - number: 149g
    text: De uitspraak van de Advies- en Arbitragecommissie heeft bindende kracht.
    url: https://wetten.overheid.nl/BWBR0003229/2007-06-20#Artikel149g
  - number: '180'
    text: |-
      1 Voorstellen tot wijziging van dit besluit worden behandeld in de Sectorcommissie overleg rijkspersoneel.

      2 Vanwege de Staten-Generaal worden geen voorstellen tot wijziging van dit besluit gedaan dan nadat daarover bij de
      Staten-Generaal met de centrales van verenigingen van ambtenaren overleg is gepleegd.
    url: https://wetten.overheid.nl/BWBR0003229/2007-06-20#Artikel180
  - number: '181'
    text: |-
      Voor zover voor ambtenaren nadere regels ter uitwerking van de bepalingen van dit besluit worden vereist, worden
      die regels vastgesteld door de Kamer, de Gemengde Commissie of de Gemengde Commissie van toezicht.
    url: https://wetten.overheid.nl/BWBR0003229/2007-06-20#Artikel181
  - number: 181a
    text: |-
      Van de bevoegdheid tot het stellen van regels met een sterk technisch karakter krachtens dit besluit, anders dan
      krachtens de artikelen 7 en 10, kunnen Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties en Onze Minister
      van Financiën mandaat verlenen.
    url: https://wetten.overheid.nl/BWBR0003229/2007-06-20#Artikel181a
  - number: '182'
    text: |-
      De [Algemene Termijnenwet][ref1] is niet van toepassing op de termijnen in dit besluit gesteld met uitzondering
      van die, genoemd in de artikelen 10, tweede en derde lid, 71b, tweede en derde lid, alsmede in de hoofdstukken XI
      en XIA.


      [ref1]: https://wetten.overheid.nl/BWBR0002448
    url: https://wetten.overheid.nl/BWBR0003229/2007-06-20#Artikel182
    references:
      - id: ref1
        bwb_id: BWBR0002448
  - number: 182a
    text: |-
      1 Ten aanzien van de ambtenaar en de gewezen ambtenaar van wie de eerste dag van ongeschiktheid tot het verrichten
      van zijn arbeid wegens ziekte is gelegen voor 1 januari 2004, blijven de [artikelen 34a][ref1], [92a][ref2] en
      [92b][ref3] en [hoofdstuk VI][ref4] van het Ambtenarenreglement Staten-Generaal van toepassing zoals deze luidden
      op 30 november 2005, met dien verstande dat voor [artikel 75b][ref5] in genoemd [hoofdstuk VI][ref6] in de plaats
      treedt [artikel 75b][ref7] zoals dat thans luidt.

      2 Voor de toepassing van het eerste lid worden perioden van ongeschiktheid tot werken geacht eenzelfde, niet
      onderbroken periode van ongeschiktheid te vormen, indien zij elkaar met een onderbreking van minder dan vier weken
      opvolgen of indien zij direct voorafgaan aan en aansluiten op een periode waarin zwangerschaps- of bevallingsverlof
      wordt genoten overeenkomstig [artikel 3:1, tweede en derde lid, van de Wet arbeid en zorg][ref8] of een
      uitkering op grond van [artikel 3:8][ref9], of [3:10, eerste lid, van die wet][ref10], tenzij de ongeschiktheid
      redelijkerwijs niet geacht kan worden voort te vloeien uit dezelfde oorzaak.


