  - number: '8'
    text: |-
      Bij wijziging van een tijdelijk in een vast dienstverband dan wel in geval van wijziging van tewerkstelling in
      een andere niet-vertrouwensfunctie wordt geen verklaring omtrent het gedrag verlangd of, indien het een functie
      betreft die bijzondere eisen stelt aan de integriteit of verantwoordelijkheid van de betrokkene, wordt niet
      verzocht om justitiële gegevens, tenzij naar het oordeel van het bevoegd gezag door gewijzigde omstandigheden
      betreffende de functie of de tewerkstelling een verklaring omtrent het gedrag dan wel een onderzoek, bedoeld in
      [artikel 7, zevende lid][ref1], nodig is.


      [ref1]: https://wetten.overheid.nl/BWBR0003229#Artikel7
