  - number: '112'
    text: |-
      1 Aan de ambtenaar kan door het bevoegd gezag de toegang tot de dienstlokalen, dienstgebouwen of het werk, dan wel
      het verblijf daar, worden ontzegd.

      2 Hij is verplicht zich te gedragen naar de maatregelen van orde die ten aanzien van het verblijf aldaar zijn
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003229/2007-06-20#Artikel112
  - number: '113'
    text: |-
      Het is de ambtenaar verboden gedurende de werktijd alcoholhoudende dranken te gebruiken, bij zich te hebben of in
      de dienstlokalen te bewaren.
    url: https://wetten.overheid.nl/BWBR0003229/2007-06-20#Artikel113
  - number: '114'
    text: |-
      1 De ambtenaar heeft aanspraak op een gratificatie bij ambtsjubileum volgens door Onze Minister van Binnenlandse
      Zaken en Koninkrijksrelaties te stellen regels.

      2 De ambtenaar die een diensttijd heeft van 10 jaar of meer en aan wie ontslag is verleend op grond van artikel,
      126 of 129, eerste lid, onder *f* wordt een diensttijdgratificatie toegekend ter grootte van een in verhouding tot
      de doorgebrachte diensttijd evenredig gedeelte van een gratificatie bij ambtsjubileum als bedoeld in het eerste
      lid. Toekenning vindt niet plaats indien niet binnen een termijn van vijf jaar na de datum van ingang van het
      ontslag aanspraak op een gratificatie bij ambtsjubileum zou hebben bestaan.
    url: https://wetten.overheid.nl/BWBR0003229/2007-06-20#Artikel114
  - number: 114a
    text: |-
      In deze paragraaf wordt verstaan onder vermoeden van een misstand: een op redelijke gronden gebaseerd vermoeden
      van het zich voordoen in de organisatie waar de ambtenaar werkzaam is van een grove schending van wettelijke
      voorschriften of beleidsregels, een groot gevaar voor de gezondheid, de veiligheid of het milieu, dan wel een zeer
      onbehoorlijke wijze van functioneren, die het goed functioneren van de openbare dienst in gevaar kan brengen.
    url: https://wetten.overheid.nl/BWBR0003229/2007-06-20#Artikel114a
  - number: 114b
    text: |-
      1 Onverminderd verplichtingen tot aangifte van strafbare feiten meldt de ambtenaar het vermoeden van een misstand
      aan de leidinggevende. Indien de ambtenaar melding aan de leidinggevende niet wenselijk acht, meldt hij het
      vermoeden aan de naast hogere leidinggevende of aan een daartoe aangewezen vertrouwenspersoon.

      2 Indien zwaarwegende redenen in de weg staan aan de toepassing van de in het eerste lid bedoelde procedure, meldt
      de ambtenaar het vermoeden van een misstand schriftelijk rechtstreeks aan de Commissie integriteit overheid.
    url: https://wetten.overheid.nl/BWBR0003229/2007-06-20#Artikel114b
  - number: 114c
    text: |-
      1 De leidinggevende of de vertrouwenspersoon, bedoeld in [artikel 114b, eerste lid][ref1], draagt er zorg voor dat
      het tot aanstelling bevoegd gezag onverwijld via de hiërarchische lijn schriftelijk op de hoogte wordt gesteld van
      het gemelde vermoeden van een misstand en van de datum waarop de melding is ontvangen. Indien de melding is gedaan
      bij de vertrouwenspersoon, vergewist deze zich ervan dat de ambtenaar heeft ingestemd met melding aan het tot
      aanstelling bevoegd gezag.

      2 Het tot aanstelling bevoegd gezag

      a. bewerkstelligt dat onverwijld een onderzoek wordt ingesteld naar aanleiding van de melding van een vermoeden van
      een misstand;

      b. bevestigt schriftelijk aan de ambtenaar die een vermoeden van een misstand heeft gemeld het moment van die
      melding en de inhoud ervan en

      c. informeert de persoon of personen op wie het gemelde vermoeden van een misstand betrekking heeft, dat een
      melding is gedaan, tenzij dit het onderzoeksbelang kan schaden.

      3 Binnen acht weken na de melding wordt de ambtenaar die een vermoeden van een misstand heeft gemeld door het tot
      aanstelling bevoegd gezag schriftelijk op de hoogte gesteld van het inhoudelijke standpunt van dat gezag omtrent
      het gemelde vermoeden.

      4 Indien het standpunt niet binnen acht weken kan worden gegeven, stelt het tot aanstelling bevoegd gezag de
      ambtenaar hiervan in kennis en vermeldt het daarbij de termijn waarbinnen een standpunt tegemoet kan worden gezien.

      5 Nadat het tot aanstelling bevoegd gezag het standpunt omtrent het gemelde vermoeden heeft bepaald, stelt het
      de persoon of personen op wie het vermoeden van een misstand betrekking had schriftelijk op de hoogte van dat
      standpunt alsmede van de melding, indien bedoelde persoon of personen daarover met toepassing van het tweede lid,
      onderdeel c, niet eerder was of waren geïnformeerd.


      [ref1]: https://wetten.overheid.nl/BWBR0003229#Artikel114b
    url: https://wetten.overheid.nl/BWBR0003229/2007-06-20#Artikel114c
    references:
      - id: ref1
        bwb_id: BWBR0003229
        artikel: 114b
        hoofdstuk: VIIb
  - number: 114d
    text: |-
      1 De ambtenaar kan het vermoeden van een misstand melden bij de Commissie integriteit overheid, indien:

      a. de ambtenaar het niet eens is met het standpunt van het tot aanstelling bevoegd gezag, bedoeld in
      [artikel 114c, derde lid][ref1];

      b. de ambtenaar niet binnen de in [artikel 114c, derde lid][ref2], gestelde termijn een standpunt of een bericht
      als bedoeld in [artikel 114c, vierde lid][ref3], heeft ontvangen, of

      c. de ambtenaar niet binnen de in [artikel 114c, vierde lid][ref4], bedoelde termijn een standpunt heeft ontvangen
      dan wel die termijn onredelijk lang is;

      2 De ambtenaar meldt het vermoeden van een misstand bij de Commissie integriteit overheid, indien de situatie,
      bedoeld in [artikel 114b, tweede lid][ref5], zich voordoet.

      3 Binnen vier weken nadat de Commissie integriteit overheid advies heeft uitgebracht, deelt het tot aanstelling
      bevoegd gezag de ambtenaar die het vermoeden van een misstand heeft gemeld, schriftelijk gemotiveerd mee of het
      advies wordt opgevolgd. Een afschrift van deze mededeling wordt gezonden aan de Commissie integriteit overheid.

      4 Het tot aanstelling bevoegd gezag informeert de persoon of personen op wie het vermoeden van een misstand
      betrekking had over het advies, bedoeld in het derde lid, en het gevolg dat daaraan wordt gegeven, alsmede over de
      melding, indien bedoelde persoon of personen daarover niet eerder was of waren geïnformeerd.


      [ref1]: https://wetten.overheid.nl/BWBR0003229#Artikel114c
