  - number: '129'
    text: |-
      1 Anders dan op aanvraag, bij wijze van straf of ingevolge het bepaalde bij
      [artikel 7 van de Wet Incompatibiliteiten Staten-Generaal en Europees Parlement][ref1],
      de [artikelen 125][ref2], [126][ref3], [127][ref4] en [127a][ref5] van dit besluit en bij
      [artikel 125e, tweede lid, van de Ambtenarenwet][ref6], kan de ambtenaar worden ontslagen op grond van:

      a. het verlies van een vereiste voor de benoembaarheid, door het tot aanstelling bevoegd gezag gesteld bij een
      regeling aan de benoeming voorafgegaan, tenzij het vereiste alleen voor de aanvang van het ambt geldt;

      b. het aangaan van een graad van zwagerschap, die de benoembaarheid tot het ambt zou uitsluiten;

      c. onherroepelijk geworden rechterlijke uitspraak waarbij de ambtenaar onder curatele is gesteld;

      d. het ondergaan van lijfsdwang wegens schulden krachtens onherroepelijk geworden rechterlijke uitspraak;

      e. onherroepelijk geworden veroordeling tot vrijheidsstraf wegens misdrijf;

      f. ongeschiktheid tot het verrichten van zijn arbeid wegens ziekte;

      g. onbekwaamheid of ongeschiktheid voor het door hem beklede ambt anders dan op grond van ziels- of
      lichaamsgebreken;

      h. het bereiken van de pensioengerechtigde leeftijd;

      i. het bij of in verband met indiensttreding en/of keuring verstrekken van onjuiste of onvolledige inlichtingen,
      zonder welke handelwijze niet tot indienstneming of goedkeuring zou zijn overgegaan, tenzij de ambtenaar
      aannemelijk maakt dat hij te goeder trouw heeft gehandeld.

      2 Een ontslag op grond van het bepaalde in het eerste lid onder *a.*, *b.*, *f.*, *g.* en *h.* wordt steeds eervol
      verleend.

      3 Een ontslag als bedoeld in het eerste lid, onderdeel *f*, kan slechts plaatsvinden indien:

      a. er sprake is van ongeschiktheid tot het verrichten van zijn arbeid wegens ziekte gedurende een ononderbroken
      periode van twee jaar,

      b. herstel van zijn ziekte niet binnen een periode van zes maanden na de in onderdeel *a* genoemde termijn van twee
      jaar te verwachten is, en

      c. het bevoegd gezag van oordeel is dat duurzame reïntegratie in arbeid die aansluit bij de benutbare mogelijkheden
      van de ambtenaar, niet binnen een redelijke termijn te verwachten is.

      4 De termijn van twee jaar, bedoeld in het derde lid, onderdeel a, wordt verlengd:

      a. met de duur van de vertraging indien het tot aanstelling bevoegde gezag de aangifte, bedoeld in
      [artikel 38, eerste lid, van de Ziektewet][ref7] later doet dan op grond van [dat artikel van de Ziektewet][ref8]
      is voorgeschreven;

      b. met de duur van de verlenging van de wachttijd, bedoeld in
      [artikel 19, eerste lid, van de Wet op de arbeidsongeschiktheidsverzekering][ref9], indien de wachttijd op grond
      van het zevende lid van dat artikel wordt verlengd;

      c. met de duur van het tijdvak, dat het Uitvoeringsinstituut werknemersverzekeringen op grond van
      [artikel 71a, negende lid, van de Wet op de arbeidsongeschiktheidsverzekering][ref10] heeft vastgesteld.

      5 Voor de berekening van het tijdvak van twee jaar, bedoeld in het derde lid, onderdeel a, worden perioden
      van ongeschiktheid tot het verrichten van arbeid wegens ziekte tengevolge van zwangerschap voorafgaand aan het
      zwangerschapsverlof en perioden van ongeschiktheid tijdens het zwangerschaps- of bevallingsverlof, bedoeld in
      [artikel 3:1, tweede en derde lid, van de Wet arbeid en zorg][ref11], niet in aanmerking genomen.

      6 Perioden van ongeschiktheid tot het verrichten van zijn arbeid, anders dan bedoeld in het vijfde lid, worden
      samengeteld indien zij elkaar met een onderbreking van minder dan vier weken opvolgen, of indien zij direct
      voorafgaan aan en aansluiten op een periode waarin zwangerschaps- of bevallingsverlof wordt genoten overeenkomstig
      [artikel 3:1, tweede en derde lid, van de Wet arbeid en zorg][ref12], tenzij de ongeschiktheid redelijkerwijs niet
      geacht kan worden voort te vloeien uit dezelfde oorzaak.

      7 Om te beoordelen of er sprake is van een situatie, bedoeld in het derde lid, onderdelen a en b, vraagt
      het bevoegd gezag het oordeel van een daartoe door het Uitvoeringsinstituut werknemersverzekeringen, die de
      [Wet op de arbeidsongeschiktheidsverzekering][ref13] uitvoert ten aanzien van de ambtenaar, aangewezen arts.

      8 De in het zevende lid bedoelde arts betrekt bij zijn beoordeling een door het bevoegd gezag aangewezen arts en,
      indien de ambtenaar dit wenst, een door de ambtenaar aangewezen arts.

      9 Het bevoegd gezag stelt de ambtenaar er schriftelijk van in kennis dat de procedure, bedoeld in het zevende lid,
      wordt ingesteld.

      Daarbij wijst het bevoegd gezag de ambtenaar op de mogelijkheid om een arts van zijn keuze te laten deelnemen aan
      de procedure.

      10 De kennisgeving, bedoeld in het negende lid, geschiedt niet eerder dan nadat de ambtenaar gedurende een
      onafgebroken periode van 18 maanden ongeschikt is geweest tot het verrichten van zijn arbeid wegens ziekte. Het
      zesde lid is hierbij van overeenkomstige toepassing.

      11 De in het zevende lid bedoelde arts stelt naar aanleiding van zijn bevindingen een rapport op. Hij zendt dit
      rapport aan het bevoegd gezag. Tevens zendt hij een afschrift van dit rapport aan de ambtenaar.

      12 Indien herplaatsing als bedoeld in [artikel 72a][ref14] plaatsvindt in een betrekking voor minder uren dan het
      aantal waarvoor de ambtenaar was aangesteld, heeft het ontslag uitsluitend betrekking op het meerdere aantal uren.


      [ref1]: https://wetten.overheid.nl/BWBR0006612#Artikel7
