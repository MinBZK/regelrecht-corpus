        paragraaf: '2'
  - number: '10'
    text: |-
      1 De kosten van het geneeskundig onderzoek en het hernieuwd geneeskundig onderzoek komen voor rekening van het
      Rijk. De betrokkene ontvangt een vergoeding van reis- en verblijfkosten op de voet van de bepalingen van het
      [Reisbesluit binnenland][ref1].

      2 De uitslag van het geneeskundig onderzoek wordt uiterlijk binnen twee weken na vaststelling aan de betrokkene
      medegedeeld.

      3 De betrokkene kan binnen twee weken nadat hem de uitslag van het geneeskundig onderzoek is meegedeeld, een
      hernieuwd geneeskundig onderzoek aanvragen.

      4 Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties stelt omtrent het hernieuwd geneeskundig onderzoek
      nadere regels vast. Dit hernieuwd geneeskundig onderzoek mag niet worden verricht door de arts die het geneeskundig
      onderzoek heeft verricht.

      5 Bij wijziging van een tijdelijk in een vast dienstverband vindt niet opnieuw een geneeskundig onderzoek plaats,
      tenzij ten aanzien van de geschiktheid van de betrokkene ernstige twijfel is gerezen.

      6 De betrokkene die op grond van artikel 7, vierde lid, onderdeel *b*, is onderworpen aan een geneeskundig
      onderzoek, wordt bij aanstelling in een andere functie opnieuw aan een onderzoek naar de medische geschiktheid
      onderworpen indien betrokkene voor het vervullen van die functie aan andere medische eisen dient te voldoen dan
      voor de tot dusverre vervulde functie.


      [ref1]: https://wetten.overheid.nl/BWBR0005889
    url: https://wetten.overheid.nl/BWBR0003229/2007-06-20#Artikel10
