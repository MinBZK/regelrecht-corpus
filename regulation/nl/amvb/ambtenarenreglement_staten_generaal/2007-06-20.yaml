        paragraaf: '3'
  - number: '93'
    text: |-
      1 De ambtenaar kan worden verplicht tijdelijk andere ambtelijke werkzaamheden te verrichten dan die, welke hij
      gewoonlijk verricht, mits die werkzaamheden hem redelijkerwijs kunnen worden opgedragen. Hij kan echter niet
      worden verplicht werkzaamheden te verrichten in de plaats van stakers of uitgeslotenen in particuliere dienst,
      tenzij de opgedragen werkzaamheden worden verricht in dienst van het lichaam, waarbij hij werkzaam is, en voor de
      openbare dienst tijdens de staking of uitsluiting, dan wel als onmiddellijk gevolg daarvan redelijkerwijze dadelijk
      noodzakelijk zijn te achten. Die werkzaamheden worden de ambtenaar niet opgedragen dan nadat hij is gehoord.

      2 Bij de toepassing van het bepaalde in het vorige lid wordt voor zoveel mogelijk rekening gehouden met de
      persoonlijke omstandigheden van de ambtenaar.
    url: https://wetten.overheid.nl/BWBR0003229/2007-06-20#Artikel93
  - number: 93a
    text: |-
      1 De ambtenaar die door het tot aanstellen bevoegd gezag is aangewezen als bedrijfshulpverlener als
      bedoeld in [artikel 15 van de Arbeidsomstandighedenwet][ref1] en die naast zijn normale werkzaamheden de
      bedrijfshulpverleningstaken naar behoren heeft uitgevoerd, ontvangt een toelage.

      2 De toelage wordt bepaald volgens door het tot aanstellen bevoegd gezag vast te stellen regels en bedraagt
      tenminste € 195,35 per jaar.

      3 De vast te stellen regels bevatten in ieder geval de criteria die gehanteerd worden bij de toekenning van een
      bedrijfshulpverleningstoelage.

      4 Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties kan het in het tweede lid genoemde bedrag aanpassen
      overeenkomstig de algemene salarisontwikkeling van het rijkspersoneel.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel15
    url: https://wetten.overheid.nl/BWBR0003229/2007-06-20#Artikel93a
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '15'
  - number: 93b
    text: |-
      1 Het bevoegd gezag breidt de formatie van de organisatorische eenheid waar de ambtenaar die lid is
      van de ondernemingsraad werkzaam is, uit met de tijd die met toepassing van de [artikelen 17][ref1] en
      [18 van de Wet op de ondernemingsraden][ref2] voor die ambtenaar is vastgesteld, voor zover dit noodzakelijk is
      om gedurende de periode van het lidmaatschap de door de organisatorische eenheid te verrichten werkzaamheden te
      realiseren.

      2 De ambtenaar, bedoeld in het eerste lid, heeft op zijn aanvraag voor de resterende duur van zijn lidmaatschap van
      de ondernemingsraad recht op uitbreiding van zijn arbeidsduur met het aantal uren waarmee het bevoegd gezag vanwege
      dat lidmaatschap op grond van het eerste lid de formatie heeft uitgebreid. [Artikel 34, tweede lid][ref3], is van
      overeenkomstige toepassing. Een aanvraag als bedoeld in de eerste volzin wordt niet toegewezen zolang de ambtenaar
      geheel of gedeeltelijk ongeschikt is tot het verrichten van zijn arbeid wegens ziekte.


      [ref1]: https://wetten.overheid.nl/BWBR0002747#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0002747#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0003229#Artikel34
