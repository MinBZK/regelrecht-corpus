  - number: 71b
    text: |-
      1 In geval van een geschil over het wel of niet bestaan van ongeschiktheid tot werken wegens ziekte voorziet
      [artikel 30, eerste lid, onderdeel e, van de Wet SUWI][ref1] in het instellen van een onderzoek en het geven van
      een oordeel.

      2 Het medisch advies dat door de deskundige persoon of de arbodienst wordt uitgebracht naar aanleiding van
      een arbeidsgezondheidskundig onderzoek als bedoeld in [artikel 18 van de Arbeidsomstandighedenwet][ref2] en
      [artikel 71a][ref3], wordt zo spoedig mogelijk aan de ambtenaar en het tot aanstelling bevoegde gezag medegedeeld.

      3 De ambtenaar of de gewezen ambtenaar kan de deskundige persoon of de arbodienst binnen drie dagen na ontvangst
      van het medisch advies, schriftelijk een hernieuwd onderzoek vragen indien hij het niet eens is met het medisch
      advies. De deskundige persoon of de arbodienst stelt het tot aanstelling bevoegde gezag in kennis van een ingediend
      verzoek om een hernieuwd onderzoek.

      4 Zo spoedig mogelijk na ontvangst van het schriftelijk verzoek om een hernieuwd onderzoek, doch uiterlijk binnen
      vier weken, vindt het hernieuwd onderzoek door een commissie van drie geneeskundigen plaats.

      5 Op verzoek van de ambtenaar of de gewezen ambtenaar wordt zijn behandelend arts in de gelegenheid gesteld
      mondeling of schriftelijk zijn mening aan de commissie van drie geneeskundigen kenbaar te maken.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0010346#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0003229#Artikel71a
