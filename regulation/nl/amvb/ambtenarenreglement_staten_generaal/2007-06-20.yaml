  - number: '12'
    text: |-
      1 Aan de ambtenaar wordt, zo mogelijk vóór de aanvaarding van zijn ambt, een akte van aanstelling uitgereikt,
      waarin in ieder geval worden vermeld:

      a. de naam, de voornamen en de geboortedatum van de ambtenaar;

      b. de naam van de instelling of de dienst waarbij hij te werk wordt gesteld;

      c. de datum, met ingang waarvan hij wordt aangesteld;

      d. of de aanstelling geschiedt in vaste of tijdelijke dienst.

      2 Indien de aanstelling geschiedt in tijdelijke dienst, wordt bovendien in de akte van aanstelling vermeld:

      a. de duur van de aanstelling in tijdelijke dienst;

      b. de toepasselijke, in artikel 6, tweede lid, omschreven grond(en) voor de aanstelling in tijdelijke dienst;

      c. de specifieke reden, indien sprake is van een aanstelling op grond van artikel 6, tweede lid, onder f.

      3 Indien de aanstelling geschiedt in tijdelijke dienst met toepassing van artikel 6*a*, eerste lid, wordt bovendien
      in de akte van aanstelling vermeld welke van de in dat artikellid bedoelde regelingen geheel of gedeeltelijk buiten
      toepassing zijn verklaard.

      4 Indien de aanstelling geschiedt voor een variabel aantal uren wordt in de akte van aanstelling in voorkomende
      gevallen bovendien het op grond van artikel 6b, tweede lid, voor de ambtenaar geldende aantal garantie-uren
      vermeld.
    url: https://wetten.overheid.nl/BWBR0003229/2007-06-20#Artikel12
  - number: '13'
    text: |-
      Voor zover deze gegevens op hem betrekking hebben en niet reeds in de acte van aanstelling zijn vermeld, worden aan
      de ambtenaar zo spoedig mogelijk schriftelijk medegedeeld:

      a. de afdeling of het dienstvak waarbij en de betrekking waarin hij is tewerkgesteld, zomede de hem
      dienovereenkomstig aangewezen standplaats;

      b. de salarisschaal en de voor de bepaling van die schaal in acht genomen regels;

      c. het salaris dat hem is toegekend, zomede het salarisnummer en het tijdstip waarop het salaris voor de eerste
      maal periodiek zal worden verhoogd;

      d. andere hem mogelijk toegekende voordelen, onder verwijzing naar de desbetreffende kortingsregeling.
    url: https://wetten.overheid.nl/BWBR0003229/2007-06-20#Artikel13
  - number: '15'
    text: |-
      1 De ambtenaar wordt bij zijn aanstelling schriftelijk op de hoogte gesteld van de hoofdlijnen van zijn
      rechtspositie.

      2 Regelingen waarin zijn rechtspositie is neergelegd worden op een voor de ambtenaar gemakkelijke toegankelijke
      plaats ter inzage gelegd. Van deze regelingen kan hij kosteloos afschriften maken voor zover dat redelijkerwijs
      nodig is.

      3 De schriftelijk vastgestelde en voor hem geldende regelingen en instructies, welke hij bij de vervulling van
      zijn dienst heeft na te leven, worden eveneens op een voor de ambtenaar gemakkelijk toegankelijke plaats ter inzage
      gelegd. In het geval vermelde regelingen en instructies niet schriftelijk zijn vastgelegd, worden deze behoorlijk
      te zijner kennis gebracht.
    url: https://wetten.overheid.nl/BWBR0003229/2007-06-20#Artikel15
  - number: '16'
    text: |-
      Het tot aanstelling bevoegd gezag kan regels vaststellen omtrent loopbaanvorming in het algemeen en omtrent
      daarmede verband houdende bijzondere regelingen ter bepaling van de voor de ambtenaar geldende salarisschaal.
    url: https://wetten.overheid.nl/BWBR0003229/2007-06-20#Artikel16
  - number: '20'
    text: |-
      De ambtenaar ontvangt over de tijd, gedurende welke hij in strijd met zijn verplichtingen opzettelijk nalaat zijn
      dienst te verrichten, geen bezoldiging.
    url: https://wetten.overheid.nl/BWBR0003229/2007-06-20#Artikel20
  - number: '21'
    text: |-
      De beloning van de ambtenaar, die is aangesteld voor enkele diensten, niet vallende binnen de taak van het
      betrokken dienstvak, wordt bepaald op een voor elk geval of voor elke te verrichten dienst, afzonderlijk vast te
      stellen bedrag.
    url: https://wetten.overheid.nl/BWBR0003229/2007-06-20#Artikel21
  - number: '24'
    text: |-
      1 Aan de ambtenaar die in verband met de werkzaamheden die voortvloeien uit een functie in een publiekrechtelijk
      college, waarin hij is benoemd of verkozen, tijdelijk is ontheven van de waarneming van zijn ambt wordt gedurende
      zijn ontheffing een non-activiteitswedde toegekend. De non-activiteitswedde is het bedrag waarmee de laatstelijk
      door hem in zijn ambt genoten bezoldiging het bedrag van de inkomsten die de ambtenaar in verband met zijn
      werkzaamheden in dat publiekrechtelijk college geniet, overschrijdt.

      2 Voor de toepassing van het eerste lid geldt voorts dat:

      a. toekenning van de non-activiteitswedde plaatsvindt op de voet van het bepaalde in de artikelen 4, tweede, derde,
      vierde en vijfde lid, en 5 van de Wet Incompatibiliteiten Staten-Generaal en Europees Parlement;

      b. onder inkomsten die in verband met zijn werkzaamheden in dat publiekrechtelijk college worden genoten wordt
      verstaan: alle inkomsten die aan die werkzaamheden zijn verbonden.

      3 Voor de toepassing van dit artikel wordt de functie van substituut-ombudsman met de in het eerste lid bedoelde
      functie gelijkgesteld.

      4 Dit artikel is niet van toepassing op degenen die een non-acitiviteitswedde geniet uit hoofde van artikel 4,
      eerste lid, van de Wet Incompatibiliteiten Staten-Generaal en Europees Parlement.
    url: https://wetten.overheid.nl/BWBR0003229/2007-06-20#Artikel24
  - number: '25'
    text: |-
      1 De ambtenaar, die als militair in werkelijke dienst is, wordt geacht in zijn burgerlijke betrekking met verlof
      te zijn.

      2 Hij behoudt over de tijd van deze dienst het genot van de aan zijn ambt verbonden bezoldiging, slechts voor zover
      hem bij of krachtens de artikelen 26 tot en met 28 daarop aanspraak is verleend. Voor zover die werkelijke dienst
      wordt vervuld in aan hem verleend vakantieverlof, behoudt hij in ieder geval het genot van de volle aan zijn ambt
      verbonden bezoldiging.

      3 Voor de toepassing van het vorige lid en de artikelen 26 tot en met 28 en
      32 wordt - ingeval de ambtenaar in het genot is van een toelage als bedoeld in
      [artikel 17 van het Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref1] - dit bezoldigingsdeel vastgesteld
      op het bedrag dat hem ingevolge de voor hem geldende werktijdregeling zou zijn toegekend, indien hij niet aan
      zijn burgerlijke betrekking zou zijn onttrokken. Is de vaststelling van het bedrag op deze wijze niet mogelijk,
      dan wordt dit, met inachtneming van de percentages en het berekeningsmaximum zoals genoemd in artikel 17 van
      vorengenoemd besluit, berekend over het voor de ambtenaar geldende salaris, zulks naar de aantallen uren als
      bedoeld in dat artikel waarop door hem gedurende de drie kalendermaanden voorafgaande aan het tijdstip met ingang
      waarvan hij aan zijn burgerlijke betrekking werd onttrokken, ingevolge de voor hem geldende werktijdregeling
      gemiddeld per maand is gewerkt.

      4 Voor de toepassing van het tweede lid en de artikelen 26 tot en met 28 en 32 wordt - ingeval de ambtenaar in het
      genot is van een toelage als bedoeld in artikel 18*a* van het Bezoldigings Besluit Burgerlijke Rijksambtenaren 1984
        - dit bezoldigingsdeel vastgesteld op het bedrag dat hem ingevolge het voor hem geldende consignatierooster zou
      zijn toegekend, indien hij niet aan zijn burgerlijke betrekking zou zijn onttrokken. Is de vaststelling van het
      bedrag op deze wijze niet mogelijk, dan wordt dit bedrag berekend naar de berekeningsgrondslag en de percentages
      zoals genoemd in artikel 18*a* van vorengenoemd besluit, zulks naar de aantallen uren als bedoeld in dat artikel
      waarop door hem gedurende de drie kalendermaanden voorafgaande aan het tijdstip met ingang waarvan hij aan zijn
      burgerlijke betrekking werd onttrokken, gemiddeld per maand consignatiediensten zijn verricht.

      5 Voor zover de ambtenaar ingevolge de voor hem geldende bezoldigingsregeling aanspraak heeft op een vakantie-
      uitkering geniet hij deze uitkering slechts voor zoveel die uitgaat boven de vakantie-uitkering waarop hij als
      militair aanspraak heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0003630#Artikel17
    url: https://wetten.overheid.nl/BWBR0003229/2007-06-20#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0003630
        artikel: '17'
  - number: '26'
    text: |-
      1 De ambtenaar, die ingevolge wettelijke verplichting anders dan voor herhalingsoefening als militair in werkelijke
      dienst is, geniet onverminderd het bepaalde in artikel 122 de aan zijn ambt verbonden bezoldiging voor zoveel deze
      meer bedraagt dan zijn militaire beloning, met dien verstande, dat indien de ambtenaar ongehuwd is, hij slechts
      de aan zijn ambt verbonden bezoldiging geniet, voor zoveel 70 ten honderd daarvan meer bedraagt dan zijn militaire
      beloning.

      2 Zo nodig in afwijking van het bepaalde in het eerste lid blijft de ambtenaar als daar bedoeld in ieder geval
      de aan zijn ambt verbonden bezoldiging genieten tot een bedrag, dat gelijk is aan het bedrag van het op hem
      te verhalen gedeelte van de pensioenbijdrage en van de premie voor de Regeling flexibel pensioen en uittreden,
      bedoeld in artikel 3 van de Centrale vut-overeenkomst overheids- en onderwijspersoneel en artikel 1.5 van het
      Pensioenreglement van de Stichting Pensioenfonds ABP.

      3 Ongehuwde enige kostwinners worden voor de toepassing van het eerste lid gelijk gesteld met gehuwden. Het tot
      aanstelling bevoegd gezag beslist of een ongehuwde als enig kostwinner wordt beschouwd.

      4 Voor de toepassing van het eerste lid wordt de militaire beloning verminderd met een eventuele aftrek wegens
      genot van voeding en huisvesting.

      5 Onze Ministers van Binnenlandse Zaken en Koninkrijksrelaties en van Financiën stellen bij gemeenschappelijke
      ministeriële regeling vast hetgeen voor de toepassing van dit artikel onder militaire beloning wordt verstaan.
    url: https://wetten.overheid.nl/BWBR0003229/2007-06-20#Artikel26
  - number: '27'
    text: |-
      1 Het bepaalde in artikel 26 is eerst van toepassing, nadat de ambtenaar als militair de opleiding en oefening
      heeft volbracht.

      2 De ambtenaar, die ingevolge een wettelijke verplichting voor opleiding en oefening als militair in werkelijke
      dienst is, geniet gedurende deze opleiding en oefening de aan zijn ambt verbonden bezoldiging tot een bedrag,
      hetwelk gelijk is aan het op hem te verhalen gedeelte van de pensioenbijdrage en van de premie voor de
      Regeling flexibel pensioen en uittreden, bedoeld in artikel 3 van de Centrale vut-overeenkomst overheids- en
      onderwijspersoneel en artikel 1.5 van het Pensioenreglement van de Stichting Pensioenfonds ABP.

      3 Het eerste en tweede lid zijn niet van toepassing ten aanzien van ambtenaren op wie bij koninklijk besluit de
      artikelen 25 en 26 van overeenkomstige toepassing zijn verklaard.

      4 Indien de ambtenaar bij opkomst in militaire dienst voldoet aan de voorwaarde, gesteld in het eerste lid, dan
      wel indien ingevolge het derde lid bij opkomst in militaire dienst deze voorwaarde niet voor hem geldt, geniet hij
      in afwijking van het bepaalde in artikel 26 gedurende twee weken na zijn opkomst de volle aan zijn ambt verbonden
      bezoldiging.
    url: https://wetten.overheid.nl/BWBR0003229/2007-06-20#Artikel27
  - number: '28'
    text: |-
      1 De ambtenaar die voor een herhalingsoefening als militair in werkelijke dienst is, geniet de aan zijn ambt
      verbonden bezoldiging voor zoveel deze meer bedraagt dan zijn militaire beloning. Artikel 26, tweede, vierde en
      vijfde lid, is van toepassing.

      2 Voor zoveel nodig bepaalt Onze Minister van Defensie welke dienst als herhalingsoefening wordt beschouwd.

      3 Met herhalingsoefening gelijkgestelde dienst

      Voor de toepassing of voortgezette toepassing van het eerste lid worden met inachtneming van hetgeen daaromtrent is
      bepaald in de [Kaderwet dienstplicht][ref1] of in de Wet voor het reservepersoneel der krijgsmacht en onverminderd
      het bepaalde in artikel 122 van dit reglement met herhalingsoefeningen gelijkgesteld:

      a. het in dienst komen dan wel het in aansluiting aan een herhalingsoefening langer in dienst blijven voor een
      onderzoek omtrent een strafbaar feit of een krijgstuchtelijk vergrijp, waarvan de militair verdacht of beklaagd
      wordt;

      b. het in dienst komen dan wel het in aansluiting aan een herhalingsoefening langer in dienst blijven ten einde
      rekening en verantwoording af te leggen van gevoerd beheer;

      c. het in aansluiting aan een herhalingsoefening langer in dienst blijven wegens:

      1. ziekte;

      2. het niet tijdig bereiken van de vereiste graad van geoefendheid als gevolg van ziekte;

      3. het heersen of geheerst hebben van een besmettelijke ziekte;

      d. het in dienst komen om gehoord te worden omtrent een bij Ons of bij Onze Minister van Defensie ingediend
      beroepschrift onderscheidenlijk bezwaarschrift.


      [ref1]: https://wetten.overheid.nl/BWBR0008589
    url: https://wetten.overheid.nl/BWBR0003229/2007-06-20#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0008589
  - number: '29'
    text: |-
      Indien de ambtenaar, als militair in werkelijke dienst zijnde overlijdt, wordt de uitkering, bedoeld in artikel
      134, verminderd met het bedrag van de overeenkomstige uitkering, welke uit hoofde van de militaire dienst ter zake
      van dit overlijden wordt gedaan.
    url: https://wetten.overheid.nl/BWBR0003229/2007-06-20#Artikel29
  - number: '30'
    text: |-
      1 Het bepaalde in de artikelen 25 tot en met 29 is van overeenkomstige toepassing ten aanzien van:

      a. De ambtenaar, die is te werk gesteld in de zin van
      [artikel 9 van de Wet gewetensbezwaren militaire dienst][ref1];

      b. de ambtenaar, die in werkelijke dienst is op grond van een verbintenis bij het Korps Nationale Reserve;

      c. de ambtenaar, die als militair in werkelijke dienst is op grond van een verbintenis bij het reservepersoneel
      der krijgsmacht;

      d. de ambtenaar, die op grond van een andere bijzondere verbintenis in werkelijke militaire of daarmede gelijk te
      stellen dienst is, ter zake waarvan Wij zulks hebben bepaald.

      2 Wij behouden Ons voor met betrekking tot de uitvoering van het eerste lid nader regels te stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0002386#Artikel9
    url: https://wetten.overheid.nl/BWBR0003229/2007-06-20#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0002386
        artikel: '9'
  - number: '31'
    text: |-
      Op de ambtenaar, die in tijdelijke dienst is aangesteld, zijn de bepalingen, vervat in de artikelen 25 tot en
      met 30, slechts van toepassing tot en met de dag, waarop de burgerlijke betrekking zou zijn beëindigd, indien hij
      daaraan niet door de militaire dienst zou zijn onttrokken.
    url: https://wetten.overheid.nl/BWBR0003229/2007-06-20#Artikel31
  - number: '32'
    text: |-
      1 De ambtenaar, die op grond van een verbintenis als vrijwilliger in de zin van artikel 2, eerste lid onder *a*
      of *b*, van de Rechtstoestandsregeling reservepolitie of van een overeenkomstige verbintenis, als bedoeld in de
      artikelen 53 en 54 van die regeling in werkelijke dienst is, wordt geacht met verlof te zijn.

      2 De in het eerste lid bedoelde ambtenaar blijft gedurende het aldaar bedoelde verlof, onverminderd het bepaalde
      in artikel 122, in het genot van de aan zijn ambt verbonden bezoldiging, met dien verstande, dat deze bezoldiging
      indien het verlof langer dan twee weken duurt, voor de verdere duur van het verlof wordt verminderd met de
      beloning, waarop de ambtenaar als vrijwilliger aanspraak heeft.

      3 De in het tweede lid bedoelde vermindering wordt slechts toegepast tot een zodanig bedrag, dat de ambtenaar in
      het genot blijft van een bedrag gelijk aan het op hem te verhalen gedeelte van de pensioenbijdrage en van de premie
      voor de Regeling flexibel pensioen en uittreden, bedoeld in artikel 3 van de Centrale vut-overeenkomst overheids-
      en onderwijspersoneel en artikel 1.5 van het Pensioenreglement van de Stichting Pensioenfonds ABP.

      4 Het bepaalde in het eerste, tweede en derde lid is niet van toepassing indien de ambtenaar de werkelijke dienst
      als vrijwilliger vervult tijdens een aan hem verleend vakantieverlof.

      5 Het bepaalde in artikel 31 is voor zoveel mogelijk van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0003229/2007-06-20#Artikel32
  - number: '34'
    text: |-
      1 Met inachtneming van het bepaalde in dit hoofdstuk en van het bepaalde in of krachtens wetten, houdende
      regels tot beperking van de werktijd, stelt het bevoegd gezag voor de ambtenaren werktijdregelingen vast. Onder
      werktijdregeling wordt verstaan een van tevoren bekend gemaakt schema van aanvang en einde van de dagelijkse
      werktijden gedurende een bepaalde periode. Het in de werktijdregeling opgenomen aantal te werken uren op jaarbasis
      kan niet hoger zijn dan gemiddeld 40 uur per week.

      2 De arbeidsduur bedraagt gemiddeld ten hoogste 36 uur per week. De werktijd wordt behoorlijk door rusttijd
      onderbroken. De ambtenaar kan bij het bevoegd gezag een aanvraag indienen om de arbeidsduur in hele uren vast
      te stellen op meer dan gemiddeld 36 uur per week, waarbij een maximum geldt van gemiddeld 40 uur per week. Deze
      aanvraag wordt toegewezen tenzij het dienstbelang zich daartegen verzet.

      Een aanvraag tot het vaststellen van de arbeidsduur op meer dan gemiddeld 36 uur per week wordt niet toegekend
      voor:

      a. de ambtenaar wiens gemiddelde wekelijkse werktijd op basis van [artikel 34a][ref1] is teruggebracht;

      b. de ambtenaar die op basis van [artikel 62a][ref2] betaald ouderschapsverlof geniet;

      c. de ambtenaar die op basis van [artikel 63][ref3] buitengewoon verlof van lange duur geniet;

      d. de ambtenaar aan wie op basis van [artikel 124a, derde lid][ref4], gedeeltelijk ontslag is verleend;

      e. de arbeidsgehandicapte in de zin van [artikel 2 van de Wet op de (re)ïntegratie arbeidsgehandicapten][ref5],
      waarbij een verminderde arbeidsprestatie is vastgesteld.

      3 Het aantal te werken uren per jaar bedraagt: het aantal kalenderdagen per jaar verminderd met het aantal
      zaterdagen en zondagen en niet op zaterdag of zondag vallende feestdagen, genoemd in het zevende lid, onder
      a, in dat jaar, vermenigvuldigd met 7,2 en vervolgens vermenigvuldigd met de voor de ambtenaar geldende
      arbeidsduurfactor.

      4 Het aantal te werken uren, bedoeld in het derde lid, wordt rekenkundig afgerond.

      5 Aan de ambtenaar van 55 jaar en ouder wordt niet opgedragen dienst te verrichten tussen 22.00 uur en 06.00 uur
      tenzij het een gedeelte van een dienst betreft die doorloopt na 22.00 uur en ten laatste eindigt om 24.00 uur.

      6 Van het bepaalde in het vorige lid kan voor de duur van telkens ten hoogste één jaar worden afgeweken indien
      de ambtenaar dit heeft aangevraagd danwel zeer gewichtige redenen van dienstbelang hiertoe noodzaken, mits de
      deskundige persoon of de arbodienst als bedoeld in [hoofdstuk VI][ref6], daaromtrent een positief medisch advies
      heeft uitgebracht.

      7 a. Geen dienst wordt geëist op zondagen, alsmede op de Nieuwjaarsdag, de Tweede Paasdag, de Hemelvaartsdag, de
      Tweede Pinksterdag, de beide Kerstdagen, de dag, waarop de verjaardag van de Koningin wordt gevierd en op 5 mei.

      b. Van onderdeel a van dit artikellid kan slechts worden afgeweken indien het dienstbelang dit onvermijdelijk maakt
      en met inachtneming van het navolgende:

      1. geen dienst wordt geëist op ten minste dertien zondagen per periode van zes maanden;

      2. de ambtenaar wordt zo weinig mogelijk in zijn zondagsrust beperkt en hem wordt zoveel mogelijk de gelegenheid
      geboden op zondag en op de voor hem geldende kerkelijke feestdagen zijn kerk te bezoeken.

      c. De onderdelen a en b vinden ten aanzien van de zondag voor de ambtenaar die aan het hoofd van dienst heeft
      medegedeeld dat hij, in verband met zijn godsdienstige opvattingen, de wekelijkse rustdag op een andere dag dan de
      zondag viert, overeenkomstige toepassing voor die dag in plaats van ten aanzien van de zondag.

      d. Op zaterdag kan dienst worden geëist, mits de belangen van de dienst daartoe aanleiding geven.

      8 a. De ambtenaar van 18 jaar of ouder heeft een onafgebroken rusttijd van hetzij ten minste 36 uren in elke
      aaneengesloten tijdruimte van 7 maal 24 uren, tenzij ten minste 60 uren in elke aaneengesloten tijdruimte van 9
      maal 24 uren welke rusttijd éénmaal in elke periode van 5 achtereenvolgende weken mag worden bekort tot 32 uren.

      b. De ambtenaar van 16 of 17 jaar heeft een onafgebroken rusttijd van ten minste 36 uren in elke aaneengesloten
      tijdruimte van 7 maal 24 uren.

      9 Afwijkingen

      Van de voor de ambtenaar vastgestelde werktijdregeling kan slechts worden afgeweken indien het dienstbelang dit
      onvermijdelijk maakt en - behoudens in geval van oorlog, oorlogsgevaar of andere buitengewone omstandigheden -
      mits ervoor wordt gezorgd, dat de ambtenaar in of over het desbetreffende tijdvak van zeven dagen een ononderbroken
      rusttijd van ten minste 36 uren geniet.

      10 In bijzondere gevallen kan van de vaststelling van een werktijdregeling als bedoeld in het eerste lid worden
      afgezien. In die gevallen vindt in het tweede tot en met zevende lid overeenkomstige toepassing.

      11 In overeenstemming met Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties kan in uitzonderlijke
      gevallen van het bepaalde in het tweede tot en met negende lid, alsmede van het bepaalde in de tweede volzin
      van het tiende lid, worden afgeweken voorzover dat niet in strijd is met het bepaalde bij of krachtens de
      [Arbeidstijdenwet][ref7].

      12 Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties is bevoegd ter zake van de uitvoering van het
      bepaalde in dit artikel nadere regels vast te stellen.


