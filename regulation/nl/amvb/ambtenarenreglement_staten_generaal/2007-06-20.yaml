  - number: 34b
    text: |-
      De ambtenaar heeft het recht om, op zijn verzoek, in deeltijd te gaan werken, tenzij hieruit bezwaren voor de
      dienst voortvloeien.
    url: https://wetten.overheid.nl/BWBR0003229/2007-06-20#Artikel34b
  - number: 34c
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties stelt regels ten aanzien van individuele
      keuzemogelijkheden in het arbeidsvoorwaardenpakket.
    url: https://wetten.overheid.nl/BWBR0003229/2007-06-20#Artikel34c
  - number: '35'
    text: |-
      1 De ambtenaar heeft jaarlijks aanspraak op vakantie met behoud van zijn volle bezoldiging.

      2 De aanspraak op vakantie wordt uitgedrukt in hele uren.

      3 De omvang van de aanspraak op vakantie is afhankelijk van:

      a. de leeftijd van de ambtenaar;

      b. de werktijd van de ambtenaar.

      4 Voor de ambtenaar met volledige werktijd bedraagt de aanspraak op vakantie 165,6 uren per kalenderjaar. Onder
      volledige werktijd wordt verstaan een werktijd welke gemiddeld 36 werkuren per week omvat.

      5 De op grond van het vierde lid geldende aanspraak op vakantie wordt verhoogd volgens onderstaande tabel,
      afhankelijk van de leeftijd die de ambtenaar in het desbetreffende kalenderjaar bereikt:








                    leeftijd


                    verhoging






                    van 45 tot en met 49 jaar


                    7,2 uren




                    van 50 tot en met 54 jaar


                    14,4 uren




                    van 55 tot en met 59 jaar


                    21,6 uren




                    vanaf 60 jaar


                    28,8 uren.






      6 De ingevolge het vierde en vijfde lid geldende aanspraak op vakantie wordt vermenigvuldigd met de voor de
      ambtenaar geldende arbeidsduurfactor. Zo nodig vindt afronding naar boven op hele uren plaats.

      7 Bij beëindiging of aanvang van het dienstverband in de loop van een kalenderjaar, wordt de aanspraak op vakantie
      vastgesteld naar evenredigheid van de dienst, die hij in dat jaar verricht heeft of zal verrichten.

      8 Indien de werktijd van de ambtenaar wordt gewijzigd, wordt de aanspraak op vakantie over een eventueel resterend
      gedeelte van het desbetreffende kalenderjaar opnieuw vastgesteld, rekening houdend met de nieuwe werktijd. De
      tot aan de datum van ingang van de wijziging van de werktijd verworven aanspraak op vakantie blijft ongewijzigd
      gehandhaafd.

      9 Over kalendermaanden gedurende welke de ambtenaar in afwijking van de voor hem geldende werktijdregeling in het
      geheel geen dienst verricht, heeft hij geen aanspraak op vakantie.

      Over kalendermaanden gedurende welke de ambtenaar in afwijking van de voor hem geldende werktijdregeling
      gedeeltelijk dienst verricht, heeft hij aanspraak op vakantie naar evenredigheid van het gedeelte van de werktijd
      waarop hij volgens de werktijdregeling dienst verricht.

      10 Lid 9 is niet van toepassing, indien geheel of gedeeltelijk geen dienst wordt verricht wegens:

      a. genoten vakantie;

      b. ziekte, voor zover de verhindering tot dienstverrichting korter duurt dan 26 weken, waarbij een hervatting van
      de dienstverrichting gedurende vier weken of minder geen nieuwe periode van 26 weken inluidt.

      c. zwangerschaps- en bevallingsverlof als bedoeld in [artikel 62c, derde en vierde lid][ref1];

      d. verblijf in militaire dienst wegens herhalingsoefeningen;

      e. verlof verleend op basis van [artikel 54][ref2], [56][ref3], [58][ref4], [59][ref5], [60][ref6], [62aa][ref7]
      of [62ab van dit besluit][ref8];

      f. het minder uren werken op basis van de in [artikel 34c van dit besluit][ref9] bedoelde regels.

      11 In afwijking van het tiende lid, onder b, heeft de ambtenaar gedurende de periode dat
      [artikel 75a, eerste lid, onderdeel i, q of r][ref10], toepassing vindt, geen aanspraak op vakantie.

      12 Met ingang van de dag dat de ambtenaar op grond van [artikel 34a][ref11] gedeeltelijk geen dienst verricht
      vervalt de in het vijfde lid bedoelde verhoging van de vakantieaanspraak.

      13 Indien het belang van de dienst zich daartegen niet verzet, kan het tot aanstelling bevoegd gezag op aanvraag
      van de ambtenaar eenmaal per kalenderjaar zijn aanspraak op vakantie verlagen. Het aantal uren vakantie waarmee
      de aanspraak kan worden verlaagd bedraagt ten hoogste het aantal uren vakantie waarop de ambtenaar over het
      desbetreffende kalenderjaar aanspraak heeft, verminderd met: 144 uur vermenigvuldigd met de voor de ambtenaar
      geldende arbeidsduurfactor. Zo nodig vindt afronding naar boven op hele uren plaats.

      14 Het tot aanstelling bevoegd gezag stelt vast voor welke datum aanvragen als bedoeld in het dertiende lid kunnen
      worden ingediend en geeft op of na die datum gelijktijdig beschikkingen op de voor die datum ingediende aanvragen.

      15 De ambtenaar wordt voor elk uur vakantie waarmee zijn aanspraak op vakantie overeenkomstig het dertiende en
      zeventiende lid wordt verlaagd, een vergoeding toegekend ten bedrage van het salaris per uur dat hij geniet op de
      door het tot aanstelling bevoegd gezag krachtens het veertiende lid vastgestelde datum.

      16 Indien de ambtenaar de vergoeding, genoemd in het vijftiende lid, volledig inzet ten behoeve van
      levensloopverlof, bedoeld in [artikel 69a][ref12], bedraagt, in afwijking van het dertiende lid, het aantal uren
      waarmee de aanspraak op vakantie kan worden verlaagd ten hoogste het aantal uren waarop de ambtenaar over het
      desbetreffende kalenderjaar aanspraak heeft, verminderd met: 108 uur vermenigvuldigd met de voor de ambtenaar
      geldende arbeidsduurfactor. Zo nodig vindt afronding naar boven op hele uren plaats.

      17 Met inachtneming van de beperkingen die krachtens [artikel 69a][ref13] zijn gesteld aan het sparen voor
      levensloopverlof, verlaagt het bevoegd gezag op aanvraag van de ambtenaar het aantal vakantie-uren dat met
      toepassing van [artikel 36, zevende en achtste lid][ref14], is overgeboekt, indien de vergoeding voor de uren
      waarmee de aanspraak op vakantie wordt verlaagd volledig wordt ingezet ten behoeve van levensloopverlof als
      bedoeld in [artikel 69a][ref15]. De ambtenaar doet de aanvraag gelijktijdig met de aanvraag om te sparen voor
      levensloopverlof.


