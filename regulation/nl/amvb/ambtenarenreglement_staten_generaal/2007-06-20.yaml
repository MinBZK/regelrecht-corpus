  - number: 71c
    text: |-
      1 De leden van de commissie bedoeld in [artikel 71b, vierde en vijfde lid][ref1], worden per verzoek om een
      hernieuwd onderzoek aangewezen door het tot aanstelling bevoegde gezag. De geneeskundige die het medisch advies
      heeft uitgebracht waarvan herziening wordt gevraagd, heeft in de commissie geen zitting.

      2 De commissie deelt haar oordeel schriftelijk mee aan:

      a) de ambtenaar of de gewezen ambtenaar;

      b) het tot aanstelling bevoegde gezag;

      c) de behandelend arts, bedoeld in [artikel 71b, vijfde lid][ref2].


