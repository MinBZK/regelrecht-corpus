  - number: '70'
    text: |-
      In dit hoofdstuk wordt verstaan onder:

      a) arbeidsongeschiktheid: arbeidsongeschiktheid als bedoeld in [artikel 18, eerste lid van de WAO][ref1];

      b) arbodienst: een arbodienst als bedoeld in de [Arbeidsomstandighedenwet][ref2];

      c) deskundige persoon: een deskundige persoon als bedoeld in
      [artikel 14, eerste lid, van de Arbeidsomstandighedenwet][ref3] die belast is met de taken, bedoeld in
      [artikel 14, eerste lid, onderdelen b of c, van die wet][ref4];

      d) beroepsziekte: een ziekte, welke in overwegende mate haar oorzaak vindt in de aard van de aan de ambtenaar
      opgedragen werkzaamheden of in de bijzondere omstandigheden, waaronder deze moesten worden verricht, en niet aan
      zijn schuld of onvoorzichtigheid is te wijten;

      e) dienstongeval: een ongeval, welke in overwegende mate zijn oorzaak vindt in de aard van de aan de ambtenaar
      opgedragen werkzaamheden of in de bijzondere omstandigheden, waaronder deze moesten worden verricht, en niet aan
      zijn schuld of onvoorzichtigheid is te wijten;

      f) beroepsincident: een dienstongeval of een beroepsziekte voortvloeiend uit een gevaarzettende situatie die
      rechtstreeks verband houdt met de uitvoering van zijn taak waaraan de ambtenaar zich vanwege zijn specifieke
      functie niet kan onttrekken;

      g) herplaatsingstoelage: een herplaatsingstoelage als bedoeld in hoofdstuk 9 van het Pensioenreglement van de
      Stichting Pensioenfonds ABP;

      h) invaliditeitspensioen: een invaliditeitspensioen als bedoeld in hoofdstuk 8 van het Pensioenreglement van de
      Stichting Pensioenfonds ABP;

      i) medisch advies: een advies van de deskundige persoon of de arbodienst dat ten aanzien
      van de ambtenaar is uitgebracht na een arbeidsgezondheidskundig onderzoek als bedoeld in
      [artikel 18 van de Arbeidsomstandighedenwet][ref5] en [artikel 71a][ref6] van dit reglement;

      j) gewezen ambtenaar: een ambtenaar aan wie ontslag is verleend, met ingang van de dag waarop het ontslag is
      ingetreden;

      k) UWV: het Uitvoeringsinstituut werknemersverzekeringen, genoemd in [hoofdstuk 5 van de Wet SUWI][ref7];

      l) passende arbeid: alle arbeid die voor de krachten en bekwaamheden van de ambtenaar is berekend, tenzij
      aanvaarding om redenen van lichamelijke, geestelijke of sociale aard niet van hem kan worden gevergd;

      m) Pensioenreglement: het Pensioenreglement van de Stichting Pensioenfonds ABP;

      n) Stichting Pensioenfonds ABP: de Stichting Pensioenfonds ABP, bedoeld in
      [artikel 6 van de Wet privatisering ABP][ref8];

      o) Wet SUWI: de [Wet structuur uitvoeringsorganisatie werk en inkomen][ref9];

      p) WW-uitkering: een uitkering op grond van de [Werkloosheidswet][ref10];

      q) bovenwettelijke WW-uitkering: de uitkering bedoeld in
      __REF000___________________________________________________________________________________________________________
      ______;

      r) WAO: de [Wet op de arbeidsongeschiktheidsverzekering][ref12];

      s) WAO-uitkering: een uitkering op grond van de [WAO][ref13];

      t) ZW: de [Ziektewet][ref14];

      u) ZW-uitkering: ziekengeld als bedoeld in [artikel 19 van de ZW][ref15];

      v) zijn arbeid: hetgeen daaronder wordt verstaan ingevolge [artikel 19 van de ZW][ref16].


