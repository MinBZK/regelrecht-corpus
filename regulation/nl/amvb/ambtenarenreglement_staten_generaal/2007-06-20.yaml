  - number: '74'
    text: |-
      De [artikelen 72, vierde lid][ref1], [72a, tweede tot en met vijfde lid][ref2], [73][ref3], [73a][ref4] en
      [104, tweede lid][ref5], zijn niet van toepassing op de ambtenaar en de gewezen ambtenaar die geen deelnemer zijn
      in de zin van het Pensioenreglement.


