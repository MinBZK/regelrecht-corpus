preamble:
  text: |-
    Wij Juliana, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Op de voordracht van Onze Minister van Binnenlandse Zaken van 6 november 1978, nr. AB78/1727, Directoraat-Generaal
    voor Overheidspersoneelsbeleid, Directie Overheidspersoneelszaken, Afdeling Algemene en Juridische Zaken, daarmede
    handelende in overeenstemming met het verzoek van de Voorzitters van de beide Kamers der Staten-Generaal bij brief
    van 12 mei 1977;

    Gelet op artikel 125, eerste lid van de Ambtenarenwet 1929;

    De Raad van State gehoord (advies van 6 december 1978, nr. 8);

    Gezien het nader rapport van Onze Minister van Binnenlandse Zaken van 19 februari 1979, nr. AB78/2288; Directoraat-
    Generaal voor Overheidspersoneelsbeleid, Directie Overheidspersoneelszaken, Afdeling Algemene en Juridische Zaken;

    Hebben goedgevonden en verstaan:

    vast te stellen de navolgende bepalingen.
  url: https://wetten.overheid.nl/BWBR0003229/2007-06-20#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In dit besluit wordt verstaan onder: "Ambtenaar", degene, die krachtens het bepaalde in
      [artikel 61 van de Grondwet][ref1], in het [Reglement van Orde van de Eerste Kamer der Staten-Generaal][ref2], in
      het [Reglement van Orde van de Tweede Kamer der Staten-Generaal][ref3], in het Reglement voor de openbaarmaking
      van het verslag van het verhandelde in de vergaderingen der Staten-Generaal, dan wel in het Reglement voor de
      Griffie voor de interparlementaire betrekkingen der Staten-Generaal is aangesteld om in burgerlijke openbare dienst
      werkzaam te zijn;

      "de Kamer", "het College van Senioren", "de Huishoudelijke Commissie", "het Presidium" en "de Griffier": de
      desbetreffende Kamer der Staten-Generaal, onderscheidenlijk het College van Senioren en de Huishoudelijke Commissie
      van de Eerste Kamer, het Presidium van de Tweede Kamer en de griffier van de desbetreffende Kamer;

      "de Gemengde Commissie" en "de Directeur": de Commissie, onderscheidenlijk de directeur, bedoeld in het Reglement
      voor de openbaarmaking van het verslag van het verhandelde in de vergaderingen der Staten-Generaal; "de Gemengde
      Commissie van toezicht" en "de Griffier voor de interparlementaire betrekkingen der Staten-Generaal": de commissie,
      onderscheidenlijk de griffier bedoeld in het Reglement voor de Griffie voor de interparlementaire betrekkingen der
      Staten-Generaal;

      "arbeidsduurfactor": een breuk, waarvan de teller bestaat uit de voor de ambtenaar vastgestelde arbeidsduur en de
      noemer bestaat uit het getal 36.

      2 Tenzij anders is bepaald wordt voor de toepassing van dit besluit verstaan onder salaris, onderscheidenlijk
      bezoldiging, hetgeen daaronder wordt verstaan in het [Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref4].

      3 Ingeval de bezoldiging van de ambtenaar is geregeld krachtens een andere bezoldigingsregeling
      dan die bedoeld in het tweede lid, wordt voor de toepassing van dit besluit onder salaris,
      onderscheidenlijk bezoldiging verstaan, het bedrag dat op overeenkomstige wijze is vastgesteld als in het
      [Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref5].

      4 In dit besluit wordt onder echtgenoot of echtgenote mede verstaan de levenspartner met wie de niet gehuwde
      ambtenaar samenwoont en – met het oogmerk duurzaam samen te leven – een gemeenschappelijke huishouding voert op
      basis van een notarieel verleden samenlevingscontract bevattende de wederzijdse rechten en verplichtingen ter zake
      van die samenwoning en gemeenschappelijke huishouding alsmede de geregistreerde partner. Onder weduwe of weduwnaar
      wordt mede verstaan de achtergebleven levenspartner of de achtergebleven geregistreerde partner. Tegelijkertijd kan
      slechts een persoon als echtgenoot of echtgenote dan wel weduwe of weduwnaar worden aangemerkt. Tot gezinslid wordt
      in voorkomend geval mede gerekend de geregistreerde partner of de levenspartner.

      Het tot aanstelling bevoegd gezag kan verlangen dat een schriftelijke verklaring van een notaris wordt overgelegd
      waaruit blijkt dat een samenlevingscontract is gesloten.


