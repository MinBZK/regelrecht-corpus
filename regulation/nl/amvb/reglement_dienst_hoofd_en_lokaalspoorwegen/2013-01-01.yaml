  - number: '93.4'
    text: |-
      De beschikkingen van de Minister, genomen krachtens artikel 1, derde lid, onderscheidenlijk artikel 3 van
      Ons besluit van 9 augustus 1922, betreffende de wijze van afsluiting der spoorwegen, worden, voor zover
      zij op het tijdstip van inwerkingtreding van dit besluit geldig zijn, geacht te zijn genomen krachtens
      [artikel 19, tweede lid][ref1], onderscheidenlijk [artikel 18, derde lid][ref2], van dit besluit.


