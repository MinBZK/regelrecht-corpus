  - number: '94'
    text: |-
      De overwegen, welke bij inwerkingtreding van dit besluit worden beveiligd op één der in
      [artikel 20][ref1] van dit besluit voorgeschreven wijzen, worden geacht te zijn beveiligd op grond van
      [artikel 18, derde of vierde lid][ref2], van dit besluit. Met de uitvoering van de voorzieningen wordt geacht te
      zijn ingestemd krachtens [artikel 20, vierde lid][ref3], van dit besluit. Andere of aanvullende maatregelen of
      voorzieningen worden geacht te zijn voorgeschreven op grond van [artikel 20, vijfde of zesde lid][ref4], van dit
      besluit.


