  - number: 10.1.a
    text: aanvullende voorwaarden stellen;
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel10
  - number: 10.1.b
    text: voorschriften geven omtrent de uitoefening van deze bevoegdheden;
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel10
  - number: 10.1.c
    text: |-
      de Directie opdragen de op grond van die bevoegdheden getroffen maatregelen op te heffen, indien naar zijn mening
      de in genoemde artikelen en ingevolge *a* gestelde voorwaarden niet vervuld waren of niet meer vervuld zijn.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel10
  - number: '10.2'
    text: De Directie is verplicht aan deze voorschriften en opdrachten te voldoen.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel10
  - number: '10.3'
    text: |-
      De Directie geeft ter zake van de uitoefening van de haar toegekende bevoegdheden desgevraagd kennis aan de
      Minister.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel10
  - number: '11'
    text: |-
      Voor RandstadRail geldt voor de toepassing van de [artikelen 13, derde lid][ref1], [14, derde lid][ref2],
      [15][ref3], [16, tweede lid][ref4], [17, eerste en tweede lid][ref5], [23, eerste lid][ref6], en [25][ref7] als
      Directie, het dagelijks bestuur van de plusregio waarin het desbetreffende gedeelte van RandstadRail is gelegen.


      [ref1]: https://wetten.overheid.nl/BWBR0003083#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0003083#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0003083#Artikel15
      [ref4]: https://wetten.overheid.nl/BWBR0003083#Artikel16
      [ref5]: https://wetten.overheid.nl/BWBR0003083#Artikel17
      [ref6]: https://wetten.overheid.nl/BWBR0003083#Artikel23
      [ref7]: https://wetten.overheid.nl/BWBR0003083#Artikel25
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0003083
        artikel: '13'
        hoofdstuk: II
        afdeling: II
      - id: ref2
        bwb_id: BWBR0003083
        artikel: '14'
        hoofdstuk: II
        afdeling: II
      - id: ref3
        bwb_id: BWBR0003083
        artikel: '15'
        hoofdstuk: II
        afdeling: II
      - id: ref4
        bwb_id: BWBR0003083
        artikel: '16'
        hoofdstuk: II
        afdeling: II
      - id: ref5
        bwb_id: BWBR0003083
        artikel: '17'
        hoofdstuk: II
        afdeling: II
      - id: ref6
        bwb_id: BWBR0003083
        artikel: '23'
        hoofdstuk: II
        afdeling: III
      - id: ref7
        bwb_id: BWBR0003083
        artikel: '25'
        hoofdstuk: II
        afdeling: III
  - number: '13.1'
    text: |-
      De normale wijdte van het spoor, gemeten tussen de binnenzijden van de spoorstaafkoppen, bedraagt 1435 mm. De
      wijdte mag niet minder zijn dan 1430 mm en - in bogen met inbegrip van spoorverwijding niet meer zijn dan 1470 mm.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel13
  - number: '13.2'
    text: |-
      De aarden baan, de bovenbouw en de kunstwerken moeten zodanig zijn uitgevoerd, dat daarop bij de ter plaatse
      toegelaten snelheid voertuigen kunnen worden vervoerd met: een asbelasting van ten minste 18 t en een gewicht van
      ten minste 5 t per strekkende meter. een asbelasting van ten minste 16 t en een gewicht van ten minste 4,8 t per
      strekkende meter.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel13
  - number: '13.3'
    text: De Directie kan ontheffing verlenen van het bepaalde in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel13
  - number: '13.4'
    text: |-
      Op de weg moeten palen aanwezig zijn, die de afstand tot een beginstation langs de as van de spoorweg in kilometers
      en hectometers aangeven; in bijzondere gevallen kan een ander beginpunt worden aangenomen.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel13
  - number: '13.5'
    text: |-
      Op spoorwegen die uitsluitend bestemd zijn voor het vervoer van goederen, kan plaatsing van de in het vierde lid
      bedoelde hectometerpalen achterwege blijven.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel13
  - number: '14.1'
    text: |-
      Voor recht spoor geldt het met I gemerkte profiel van vrije ruimte en voor sporen in bogen geldt het met II
      gemerkte profiel van vrije ruimte, beide aangegeven op [bijlage A][ref1], een en ander met dien verstande, dat de
      halve breedtematen verminderd mogen onderscheidenlijk vermeerderd moeten worden overeenkomstig de in die bijlage
      opgenomen tabellen.


      [ref1]: https://wetten.overheid.nl/BWBR0003083
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0003083
  - number: '14.2'
    text: De Minister kan voor door hem aan te wijzen spoorwegen andere profielen van vrije ruimte voorschrijven of toestaan.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel14
  - number: '14.3'
    text: |-
      Binnen deze profielen mogen zich geen vaste voorwerpen bevinden, tenzij deze voor de veiligheid van het verkeer
      niet hinderlijk zijn en door de Directie worden toegelaten.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel14
  - number: '14.4'
    text: |-
      Tussen twee samenlopende of elkander kruisende sporen wordt op door de Directie te bepalen wijze de grens
      aangeduid, tot welke voertuigen op het ene spoor kunnen worden bewogen, zonder de beweging van voertuigen op het
      andere spoor te hinderen.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel14
  - number: '15'
    text: |-
      Het is aan anderen dan de Directie verboden zonder vergunning, verleend door of namens de Minister, op, in, boven
      of onder de spoorweg leidingen, werken, andere inrichtingen of beplantingen aan te brengen, te doen aanbrengen, of
      te hebben, dan wel daarmede verband houdende werkzaamheden uit te voeren of te doen uitvoeren.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel15
  - number: '16.1'
    text: 'Het is een ieder verboden:'
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel16
  - number: 16.1.a
    text: op enigerlei wijze in te grijpen in de bediening of de werking van spoorweginstallaties;
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel16
  - number: 16.1.b
    text: |-
      de spoorweg en de daartoe behorende terreinen, werken en inrichtingen te beschadigen of door het storten van vuil
      of het deponeren van afval te verontreinigen.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel16
  - number: '16.2'
    text: |-
      Niet strafbaar is hij, die enige in het eerste lid genoemde handeling verricht uit de aard van zijn betrekking, of
      met toestemming van de Directie.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel16
  - number: '17.1'
    text: |-
      De Directie draagt zorg dat de spoorweg met zijn vaste voorzieningen zodanig wordt onderhouden, dat hij veilig kan
      worden bereden.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel17
  - number: '17.2'
    text: De Directie draagt zorg dat plaatsen waar gevaar dreigt afdoende worden bewaakt.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel17
  - number: '17.3'
    text: |-
      Gedeelten van de spoorweg, welke tijdelijk niet berijdbaar zijn, of wegens de uitvoering van werken of om andere
      redenen niet met de overeenkomstig [artikel 54][ref1] vastgestelde snelheid bereden kunnen worden, moeten op
      voldoende afstand door seinen worden aangeduid, ook wanneer geen trein wordt verwacht.


      [ref1]: https://wetten.overheid.nl/BWBR0003083#Artikel54
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0003083
        artikel: '54'
        hoofdstuk: IV
  - number: '18.1'
    text: |-
      De spoorweg buiten de overwegen wordt op de in [artikel 19][ref1] aangegeven wijze afgesloten. De Minister kan
      ontheffing verlenen van de verplichting tot afsluiting voor die gedeelten van de spoorweg, waar naar zijn oordeel
      de veiligheid een afsluiting niet vordert.


      [ref1]: https://wetten.overheid.nl/BWBR0003083#Artikel19
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0003083
        artikel: '19'
        hoofdstuk: II
        afdeling: III
  - number: '18.2'
    text: De spoorweg buiten de overwegen wordt afgesloten op door de Minister aan te wijzen gedeelten.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel18
  - number: '18.3'
    text: |-
      Elke overweg wordt beveiligd op één der door de Minister aan te geven wijzen, als bedoeld in [artikel 20][ref1].
      De Minister kan ontheffing verlenen van de verplichting tot beveiliging van die overwegen waar naar zijn oordeel
      de veiligheid, mede gelet op de verkeersintensiteit en het uitzicht van de kruisende weg af over de spoorweg, een
      beveiliging niet vordert.


      [ref1]: https://wetten.overheid.nl/BWBR0003083#Artikel20
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0003083
        artikel: '20'
        hoofdstuk: II
        afdeling: III
  - number: '18.4'
    text: |-
      Bij overwegen en overgangen leidende naar spoorweggedeelten op de openbare weg kan door de Minister worden bepaald,
      op welke van de in [artikel 20][ref1] aangegeven wijzen de overweg onderscheidenlijk de overgang wordt beveiligd,
      dan wel welke van de in dat artikel genoemde veiligheidsmaatregelen wordt toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0003083#Artikel20
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0003083
        artikel: '20'
        hoofdstuk: II
        afdeling: III
  - number: '19.1'
    text: 'Als voldoende afsluiting van de spoorweg buiten de overwegen worden aangemerkt:'
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel19
  - number: 19.1.a
    text: rivieren, kanalen en beken;
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel19
  - number: 19.1.b
    text: moerasgrond, rietland en land met dicht ineengegroeid houtgewas;
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel19
  - number: 19.1.c
    text: aangrenzend maaiveld, indien dat ten minste 3,00 m boven of onder de kruin van de spoorweg is gelegen;
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel19
  - number: 19.1.d
    text: |-
      waterhoudende sloten met een diepte van ten minste 0,70 m beneden de laagste waterstand en een bodembreedte van ten
      minste 1,00 m;
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel19
  - number: 19.1.e
    text: |-
      muren, schuttingen, rasterwerken, palen met ijzerdraden of vlechtwerk of andere soortgelijke afheiningen en levende
      dicht ineengegroeide heggen, een en ander met een hoogte van ten minste 1,00 m;
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel19
  - number: 19.1.f
    text: droge sloten, dammen of wallen tot afscheiding van bouwland, of bos-, duin- en heidegrond.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel19
  - number: '19.2'
    text: |-
      De Minister kan voor de inrichting van de afsluitingen, bedoeld onder *e* en *f* van het eerste lid, aanwijzingen
      geven en hij kan in bijzondere omstandigheden voor de afsluitingen, bedoeld onder *d* en *e* van het eerste lid,
      andere afmetingen voorschrijven of toestaan.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel19
  - number: '20.1'
    text: 'Overwegen kunnen worden beveiligd door:'
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel20
  - number: 20.1.a
    text: |-
      verkeerslichten als bedoeld in [artikel 71 van het RVV 1990][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004825#Artikel71
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0004825
        artikel: '71'
  - number: 20.1.b
    text: |-
      verkeerslichten als bedoeld in [artikel 71 van het RVV 1990][ref1] in combinatie met halve overwegbomen of
      sluitbomen;


      [ref1]: https://wetten.overheid.nl/BWBR0004825#Artikel71
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0004825
        artikel: '71'
  - number: 20.1.c
    text: |-
      verkeerslichten als bedoeld in de [artikelen 68][ref1], [69][ref2] dan wel [74, van het RVV 1990][ref3], op
      overwegen waar de hoogste snelheid van het spoorwegverkeer niet meer dan 40 km/h bedraagt;


      [ref1]: https://wetten.overheid.nl/BWBR0004825#Artikel68
      [ref2]: https://wetten.overheid.nl/BWBR0004825#Artikel69
      [ref3]: https://wetten.overheid.nl/BWBR0004825#Artikel74
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0004825
        artikel: '68'
      - id: ref2
        bwb_id: BWBR0004825
        artikel: '69'
      - id: ref3
        bwb_id: BWBR0004825
        artikel: '74'
  - number: 20.1.d
    text: hekken die zodanig zijn ingericht, dat zij niet naar de zijde van de spoorweg opengaan;
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel20
  - number: 20.1.e
    text: |-
      personeel dat een stopteken toont als bedoeld in [artikel 82, vierde lid, van het RVV 1990][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004825#Artikel82
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0004825
        artikel: '82'
  - number: '20.2'
    text: |-
      Bij overwegen en overgangen leidende naar spoorweggedeelten op de openbare weg kunnen met betrekking tot treinen,
      rangeerdelen en bijzondere voertuigen de volgende veiligheidsmaatregelen worden toegepast:
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel20
  - number: 20.2.a
    text: het geven van geluidssignalen;
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel20
  - number: 20.2.b
    text: het verminderen van de snelheid;
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel20
  - number: 20.2.c
    text: het tot stilstand brengen.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel20
  - number: '20.3'
    text: |-
      Onverminderd het bepaalde in het eerste en het tweede lid kunnen overwegen in voetpaden en fietspaden worden
      beveiligd door klaphekken of zig-zaghekken en overwegen in voetpaden door draaikruisen.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel20
  - number: '20.4'
    text: |-
      De uitvoering van de voorzieningen, genoemd in het eerste en het derde lid, en van hierop aanvullende voorzieningen
      behoeft de instemming van de Minister. De Minister kan aanvullende voorzieningen voorschrijven.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel20
  - number: '20.5'
    text: |-
      Indien naar het oordeel van de Minister daartoe aanleiding bestaat, kan hij andere maatregelen of voorzieningen in
      het belang van de veiligheid voorschrijven.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel20
  - number: '20.6'
    text: |-
      Indien de plaatselijke situatie bij een overweg naar het oordeel van de Minister daartoe aanleiding geeft, kan hij
      aanvullende maatregelen of voorzieningen in het belang van de veiligheid voorschrijven.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel20
  - number: '20.7'
    text: |-
      Overwegen, welke niet op de in het eerste lid, onder *e*, genoemde wijze worden beveiligd, kunnen buiten de
      diensturen of in geval van storing of buitendienststelling eveneens op de in het eerste lid, onder *e* , genoemde
      wijze worden beveiligd.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel20
  - number: '21.1'
    text: Sluitbomen worden ter plaatse of met toestemming van de Minister op afstand bediend.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel21
  - number: '21.2'
    text: |-
      Bij de ter plaatse bediende sluitbomen moet de bedieningsapparatuur zodanig geplaatst zijn, dat de overwegwachter
      de overweg en de aansluitende weggedeelten kan overzien en zo nodig aanwijzingen aan de weggebruikers kan geven.
      Bij de op afstand bediende sluitbomen moet de overwegwachter van zijn post de overweg kunnen zien, tenzij in
      bijzondere gevallen de Minister hiervan ontheffing heeft verleend.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel21
  - number: '21.3'
    text: |-
      Bij de ter plaatse bediende sluitbomen kunnen en bij de op afstand bediende sluitbomen moeten inrichtingen
      geplaatst zijn, waarmede de overwegwachter door middel van rode knipperlichten tijdig het sein aan de weggebruikers
      geeft, dat hij tot sluiting overgaat. Deze rode knipperlichten worden tijdens of onmiddellijk na het openen van de
      bomen weer buiten werking gesteld.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel21
  - number: '21.4'
    text: |-
      De Directie schrijft maatregelen voor teneinde te verzekeren, dat de komst van elke trein wordt aangekondigd aan
      de overwegwachter die niet tevens het sein bedient dat toegang geeft tot het spoorgedeelte, waarin de overweg
      ligt. Deze aankondiging moet zodanig geschieden, dat de overwegwachter de sluitbomen zonder overhaasting tijdig
      kan sluiten.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel21
  - number: '21.5'
    text: |-
      Zodra de veiligheid van het spoorwegverkeer zulks vordert, sluit de overwegwachter de sluitbomen, ongeacht of hij
      de in het vierde lid bedoelde aankondiging al of niet heeft ontvangen. Hij houdt de sluitbomen gesloten totdat de
      overweg is ontruimd.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel21
  - number: '21.6'
    text: |-
      De overwegwachter, bedoeld in het vierde lid, moet een spreekverbinding hebben met de bewaakte post, waar het sein
      wordt bediend, dat de toegang geeft tot het spoorgedeelte waarin de overweging ligt.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel21
  - number: '21.7'
    text: |-
      Waar de Minister het nodig oordeelt, moet een sein dat toegang geeft tot het spoorweggedeelte, waarin de overweg
      ligt, niet uit de stand "stop" kunnen worden gebracht, voordat de sluitbomen zijn gesloten.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel21
  - number: '21.8'
    text: |-
      De Minister kan tevens voorschrijven, dat de sluitbomen niet weer kunnen worden geopend, voordat de trein de
      overweg berijdt.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel21
  - number: '21.9'
    text: |-
      Het bepaalde in het zesde lid is voor baanvakken, waar de hoogst toegelaten snelheid niet meer dan 40 km/h bedraagt
      en waar aan weerszijden van de overweg voor de trein een vast sein is geplaatst, dat alleen het seinbeeld "stop"
      kan tonen, niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel21
  - number: '21.10'
    text: De overwegwachter moet aan de naderende trein een stopsein kunnen geven.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel21
  - number: '22.1'
    text: |-
      Behoudens door de Minister te verlenen ontheffing worden de door sluitbomen of halve overwegbomen beveiligde
      overwegen, met uitzondering van overpaden, des nachts op naar zijn oordeel voldoende wijze verlicht.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel22
  - number: '22.2'
    text: |-
      De Minister kan voorschrijven, dat andere dan de in het eerste lid bedoelde overwegen des nachts op naar zijn
      oordeel voldoende wijze worden verlicht.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel22
  - number: '23.1'
    text: |-
      Behoudens op baanvakken die niet regelmatig worden bereden, draagt de Directie zorg voor de plaatsing van
      Andreaskruisen volgens model J12 of J13 van [bijlage 1, behorende bij het RVV 1990][ref1], met uitzondering
      van overwegen in niet voor het openbaar verkeer openstaande wegen die zijn voorzien van hekken als bedoeld in
      [artikel 20, eerste lid, onderdeel ][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004825
      [ref2]: https://wetten.overheid.nl/BWBR0003083#Artikel20
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0004825
      - id: ref2
        bwb_id: BWBR0003083
        artikel: '20'
        hoofdstuk: II
        afdeling: III
  - number: '23.2'
    text: |-
      De Minister kan voorschrijven, dat vóór een voor het openbaar verkeer openstaande overweg waarschuwingsborden
      worden geplaatst, en wel bij een overweg met sluitbomen of halve-overwegbomen een bord volgens model J10 en
      bij een andere overweg een bord volgens model J11 van [bijlage I, behorende bij het Reglement verkeersregels en
      verkeerstekens 1990](onbekend).
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel23
  - number: '23.3'
    text: |-
      De Minister kan tevens voorschrijven, dat vóór een voor het openbaar verkeer openstaande overweg, buiten de
      bebouwde kom gelegen in een weg met belangrijk verkeer, bakens volgens het bij ministeriële regeling vastgestelde
      model worden geplaatst.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel23
  - number: '23.4'
    text: |-
      De Minister kan voorschrijven dat bij door hem aan te wijzen overwegen borden volgens model B7 van [bijlage I,
      behorende bij het Reglement verkeersregels en verkeerstekens 1990](onbekend) worden geplaatst alsmede zonodig
      stopstrepen worden aangebracht ten einde aan te geven dat het wegverkeer moet stoppen alvorens deze overwegen te
      passeren.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel23
  - number: 23a
    text: |-
      Overwegen waarbij geen Andreaskruisen of hekken zijn geplaatst, mogen uitsluitend worden bereden nadat aan het
      wegverkeer een stopteken als bedoeld in [artikel 20, eerste lid, onderdeel ][ref1], is getoond.


      [ref1]: https://wetten.overheid.nl/BWBR0003083#Artikel20
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel23a
    references:
      - id: ref1
        bwb_id: BWBR0003083
        artikel: '20'
        hoofdstuk: II
        afdeling: III
  - number: '24.1'
    text: |-
      Een ieder is verplicht op overwegen in wegen die niet voor het openbaar verkeer open staan, treinen, rangeerdelen
      en bijzondere voertuigen voor te laten gaan en daarbij de overweg geheel vrij te laten.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel24
  - number: '24.2'
    text: |-
      Het is een ieder verboden een overweg als bedoeld in het eerste lid, op te gaan, tenzij hij direct kan door gaan en
      de overweg geheel vrij kan maken.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel24
  - number: '24.3'
    text: |-
      Het is een ieder verboden een overweg als bedoeld in het eerste lid, op te gaan indien een verkeerslicht zoals
      bedoeld in [artikel 20, eerste lid, onderdeel ][ref1] , rood licht of rood knipperlicht toont, dan wel een
      stopteken als bedoeld in [artikel 20, eerste lid, onderdeel ][ref2] wordt getoond.


      [ref1]: https://wetten.overheid.nl/BWBR0003083#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0003083#Artikel20
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0003083
        artikel: '20'
        hoofdstuk: II
        afdeling: III
      - id: ref2
        bwb_id: BWBR0003083
        artikel: '20'
        hoofdstuk: II
        afdeling: III
  - number: '25'
    text: |-
      Op overwegen uitsluitend ten behoeve van de spoorwegdienst, reizigers, verladers en dergelijke zijn de
      [artikelen 18][ref1], [22][ref2] en [23][ref3] niet van toepassing. De Directie kan voorschrijven, dat beveiliging
      of veiligheidsmaatregelen als bedoeld in [artikel 20][ref4], dan wel andere beveiliging of veiligheidsmaatregelen,
      worden toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0003083#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0003083#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0003083#Artikel23
      [ref4]: https://wetten.overheid.nl/BWBR0003083#Artikel20
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0003083
        artikel: '18'
        hoofdstuk: II
        afdeling: III
      - id: ref2
        bwb_id: BWBR0003083
        artikel: '22'
        hoofdstuk: II
        afdeling: III
      - id: ref3
        bwb_id: BWBR0003083
        artikel: '23'
        hoofdstuk: II
        afdeling: III
      - id: ref4
        bwb_id: BWBR0003083
        artikel: '20'
        hoofdstuk: II
        afdeling: III
  - number: '26.1'
    text: 'Voor treinbewegingen worden:'
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel26
  - number: 26.1.a
    text: wissels in hoofdsporen;
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel26
  - number: 26.1.b
    text: kruisingen van sporen, op gelijke hoogte, van spoorwegen waarop dit reglement van toepassing is;
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel26
  - number: 26.1.c
    text: aansluitingen van spoorwegtakken,
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel26
  - number: 26.d
    text: |-
      beweegbare bruggen beveiligd door een daarvoor geplaatst bedienbaar of automatisch vast sein, dat het seinbeeld
      "stop" kan tonen.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel26
  - number: '26.2'
    text: |-
      Op sporen waar de in het eerste lid bedoelde plaatsen met een snelheid van ten hoogste 40 km/h worden genaderd, mag
      de beveiliging ook bestaan uit een daarvoor geplaatst vast sein, dat alleen het seinbeeld "stop" kan tonen en waar
      de trein zijn loop begint ook uit een spoorafsluiting.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel26
  - number: '26.3'
    text: De Directie kan ontheffing verlenen van het bepaalde in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel26
  - number: '26.4'
    text: |-
      De posten waar seinen, geplaatst ingevolge het bepaalde in het eerste lid, worden bediend, moeten zijn voorzien van
      toestellen waarmee een spreekverbinding tot stand kan worden gebracht met de naastliggende bewaakte posten waar een
      sein wordt bediend waarmee treinbewegingen kunnen worden toegelaten naar de eerstgenoemde posten.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel26
  - number: '26.5'
    text: De Directie kan ontheffing verlenen van het bepaalde in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel26
  - number: '26.6'
    text: |-
      De Minister bepaalt, in voorkomend geval in afwijking van [artikel 12 van het Tramwegreglement][ref1], op welke
      wijze een kruising op gelijke hoogte met een spoor van een voor openbaar vervoer van personen opengestelde
      spoorweg, waarop dit reglement niet van toepassing is, beveiligd wordt; de Directie bepaalt dit ten aanzien van een
      kruising op gelijke hoogte met een niet voor openbaar vervoer van personen opengestelde spoorweg.


      [ref1]: https://wetten.overheid.nl/BWBR0001898#Artikel12
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0001898
        artikel: '12'
  - number: '27.1'
    text: |-
      De beschrijving van de beelden, getoond door de in dit reglement bedoelde seinen, hun betekenis en voorzover
      daartoe aanleiding bestaat, voorschriften voor het gebruik mede in verband met de weersomstandigheden, worden
      opgenomen in een afzonderlijke afdeling van het in [artikel 6 van de Spoorwegwet][ref1] bedoelde dienstreglement,
      genaamd "Seinreglement".


      [ref1]: https://wetten.overheid.nl/BWBR0001848#Artikel6
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0001848
        artikel: '6'
  - number: '27.2'
    text: |-
      De plaats van de in deze afdeling bedoelde vaste seinen en, voorzover bedienbaar, de bedieningswijze worden
      omschreven in voorschriften, die aan de Minister worden toegezonden.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel27
  - number: '28.1'
    text: |-
      Indien een vast sein het seinbeeld "stop" toont, moet buiten de stations de voorafgaande seingeving een zodanige
      snelheidsvermindering opleggen dat de trein voor dit stoptonende sein tot stilstand kan worden gebracht.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel28
  - number: '28.2'
    text: |-
      Het in het eerste lid bepaalde geldt eveneens op stations, tenzij aan de machinist op andere wijze is kenbaar
      gemaakt, dat de trein moet stoppen.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel28
  - number: '28.3'
    text: |-
      De in het eerste lid bedoelde voorafgaande seingeving is voor baanvakken, waar de hoogst toegelaten snelheid niet
      meer dan 40 km/h bedraagt, alleen vereist in door de Directie te bepalen gevallen.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel28
  - number: '29.1'
    text: |-
      Tussen een wissel gelegen in een hoofdspoor en een, ingevolge het bepaalde in [artikel 26, eerste lid][ref1],
      daarvoor geplaatst sein moet een zodanig verband bestaan, dat, als dit sein het voorbijrijden toelaat, het wissel
      niet kan worden omgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0003083#Artikel26
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0003083
        artikel: '26'
        hoofdstuk: II
        afdeling: IV
  - number: '29.2'
    text: |-
      Wanneer een wissel in een hoofdspoor tegen de punt wordt bereden, moet tussen dat wissel en een daarvoor geplaatst
      voor treinen geldend bedienbaar of automatisch vast sein een zodanig verband bestaan, dat de juiste stand van de
      tongen verzekerd is.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel29
  - number: '29.3'
    text: |-
      De Directie kan bepalen, dat het in het eerste en tweede lid bedoelde verband achterwege blijft, mits bij het
      doorrijden van treinen over een hoofdspoor de wissels met een slot gesloten of bewaakt zijn.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel29
  - number: '29.4'
    text: |-
      Bij door de Minister aan te wijzen spoorwegen kan het in het eerste lid bedoelde verband achterwege blijven, mits
      bij het doorrijden van treinen over een hoofdspoor de wissels door een veerinrichting in een bepaalde stand worden
      gehouden. Een niet tegen de punt bereden van een veerinrichting voorzien wissel wordt geacht steeds in de juiste
      stand te liggen.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel29
  - number: '29.5'
    text: |-
      Indien een wissel in een hoofdspoor wordt bediend op een afstand van meer dan 250 m en normaal tegen de punt wordt
      bereden door voor reizigersvervoer aangewezen treinen, moeten voorzieningen aanwezig zijn die het omleggen beletten
      tijdens het berijden tegen de punt.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel29
  - number: '29.6'
    text: |-
      Tussen een beweegbare brug en een, ingevolge het gestelde in [artikel 26, eerste lid][ref1], daarvoor geplaatst
      sein moet een zodanig verband bestaan, dat, als dit sein het voorbijrijden toelaat, de brug in de juiste stand
      is vastgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0003083#Artikel26
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0003083
        artikel: '26'
        hoofdstuk: II
        afdeling: IV
  - number: '29.7'
    text: |-
      Tussen de seinen geplaatst ingevolge het bepaalde in [artikel 26, eerste lid, onder ][ref1], moet een zodanig
      verband bestaan, dat deze seinen alleen een seinbeeld dat voorbijrijden toelaat kunnen tonen, wanneer daardoor geen
      treinen met elkaar in aanraking kunnen komen.


      [ref1]: https://wetten.overheid.nl/BWBR0003083#Artikel26
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0003083
        artikel: '26'
        hoofdstuk: II
        afdeling: IV
  - number: '30'
    text: |-
      De Directie wijst de seinhuizen en de brugposten aan, waar de wachter aan naderende treinen een stopsein moet
      kunnen geven.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel30
  - number: '31.1'
    text: |-
      Baanvakken waarvoor een hoogste toegelaten snelheid van meer dan 100 km/h geldt, moeten zijn uitgerust met
      de apparatuur van een systeem van automatische treinbeïnvloeding dat ten minste voldoet aan door de Minister
      te stellen voorwaarden. De apparatuur van een systeem van automatische treinbeïnvloeding die is bestemd of
      mede is bestemd voor beïnvloeding van goedgekeurde hogesnelheidstreinen op hogesnelheidsinfrastructuur is in
      overeenstemming met de krachtens [hoofdstuk IIIA van de Spoorwegwet][ref1] toepasselijke voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0001848#HoofdstukIIIA
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0001848
        hoofdstuk: IIIA
  - number: '31.2'
    text: De Minister kan ontheffing verlenen van het bepaalde in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel31
  - number: '31.3'
    text: |-
      De Minister kan voorschrijven, dat ook andere dan de in het eerste lid bedoelde baanvakken met de daar genoemde
      apparatuur worden uitgerust.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel31
  - number: 31a
    text: |-
      De [artikelen 21][ref1] en [30][ref2] zijn niet van toepassing op RandstadRail.


      [ref1]: https://wetten.overheid.nl/BWBR0003083#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0003083#Artikel30
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel31a
    references:
      - id: ref1
        bwb_id: BWBR0003083
        artikel: '21'
        hoofdstuk: II
        afdeling: III
      - id: ref2
        bwb_id: BWBR0003083
        artikel: '30'
        hoofdstuk: II
        afdeling: IV
  - number: '33.1'
    text: 'Elk krachtvoertuig moet voorzien zijn van:'
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel33
  - number: 33.1.a
    text: spoorstaafruimers;
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel33
  - number: 33.1.b
    text: lantarenhouders of vaste front- en sluitseinen;
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel33
  - number: 33.1.c
    text: een inrichting om geluidsseinen te geven;
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel33
  - number: 33.1.d
    text: een handrem;
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel33
  - number: 33.1.e
    text: |-
      een inrichting, waarmee het doorgaand zelfwerkende remsysteem, als bedoeld in [artikel 53, vijfde lid][ref1], wordt
      bediend en gecontroleerd, alsmede van een op dat systeem aangesloten rem, een en ander indien het krachtvoertuig is
      bestemd voor het vervoeren van treinen met een doorgaand zelfwerkend remsysteem;


      [ref1]: https://wetten.overheid.nl/BWBR0003083#Artikel53
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0003083
        artikel: '53'
        hoofdstuk: IV
  - number: 33.1.f
    text: een snelheidsmeter, tenzij het vermogen van het krachtvoertuig aan de wielomtrek kleiner is dan 75 kW;
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel33
  - number: 33.1.g
    text: |-
      een inrichting, die, wanneer deze niet voortdurend of met korte tussenpozen door de machinist wordt bediend, de
      trein automatisch tot stilstand brengt;
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel33
  - number: 33.1.h
    text: |-
      de apparatuur van het in [artikel 31][ref1] bedoelde systeem van automatische treinbeïnvloeding, indien het
      krachtvoertuig dienst doet op in dat artikel aangeduide baanvakken.


      [ref1]: https://wetten.overheid.nl/BWBR0003083#Artikel31
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0003083
        artikel: '31'
        hoofdstuk: II
        afdeling: IV
  - number: '33.2'
    text: De Minister kan ontheffing verlenen van het bepaalde in het eerste lid, sub *h*.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel33
  - number: '33.3'
    text: |-
      Alle in het krachtvoertuig ten behoeve van de voortbeweging dienstdoende motoren moeten door de machinist vanuit
      elke cabine van het krachtvoertuig zelf kunnen worden beheerst; daarenboven zijn voorzieningen toegelaten, die het
      mogelijk maken, dat bedoelde beheersing geschiedt vanuit de cabine van een ander voertuig in de trein of op andere
      wijze van buitenaf. In laatstgenoemd geval voldoet de apparatuur aan door de Minister te stellen voorwaarden.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel33
  - number: '33.4'
    text: 'Bij krachtvoertuigen gedreven door een of meer verbrandingsmotoren moeten:'
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel33
  - number: 33.4.a
    text: |-
      de brandstoftanks en de brandstofleidingen zodanig ingericht zijn, dat daarin geen ongewenste overdruk kan ontstaan
      en dat de kans op het ontstaan van lekkages zoveel mogelijk wordt beperkt;
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel33
  - number: 33.4.b
    text: |-
      de vulopeningen van de brandstoftanks zich buiten het krachtvoertuig bevinden, wanneer dit is ingericht voor
      vervoer van reizigers of post;
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel33
  - number: 33.4.c
    text: |-
      de ruimten waarin deze tanks zijn aangebracht, van het inwendige van het krachtvoertuig door dichte onbrandbare
      wanden gescheiden zijn en zodanig ingericht, dat buiten de tanks geraakte vloeibare brandstof of brandbare gassen
      onmiddellijk buiten het krachtvoertuig worden afgevoerd;
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel33
  - number: 33.4.d
    text: |-
      de leidingen voor de afvoer van afgewerkte motorgassen, voor zover zij zich in de inwendige ruimte van het
      krachtvoertuig bevinden, ononderbroken en, waar zij gevaar voor brand opleveren, geïsoleerd zijn;
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel33
  - number: 33.4.e
    text: |-
      indien het krachtvoertuig is ingericht voor het vervoer van reizigers, de motoren geplaatst zijn in ruimten die
      voor deze reizigers niet toegankelijk zijn; de wanden van deze ruimten moeten uit onbrandbare stof bestaan of met
      onbrandbare stof zijn bekleed.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel33
  - number: '33.5'
    text: 'Krachtvoertuigen gedreven door een of meer elektromotoren moeten voorzien zijn van:'
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel33
  - number: 33.5.a
    text: |-
      inrichtingen die beveiligen tegen de gevolgen van te grote stroomsterkte en te hoge spanning van de elektrische
      stroom, voor zover deze niet elders, bij voorbeeld in onderstations, zijn ondergebracht;
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel33
  - number: 33.5.b
    text: |-
      geleidende verbindingen met de aarde van alle delen van het krachtvoertuig, die, indien zij tengevolge van breuk in
      de bovenleiding of door andere oorzaken onder spanning komen, gevaar opleveren.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel33
  - number: '33.6'
    text: |-
      De wielen van de krachtvoertuigen moeten van flenzen van voldoende hoogte voorzien zijn. Flenzen mogen worden
      weggelaten bij wielen van niet verschuifbare tussenassen van ten minste drie in een gemeenschappelijk raamwerk
      aangebrachte assen, mits de wielen van deze assen voldoende draagvlak vinden. De dikte van de wielbanden moet
      ten minste 25 mm bedragen. Bij volwielen moet de minimum-dikte van de delen die de wielband vervangen, worden
      aangegeven door een in de buitenzijde van het wiel ingedraaide groef.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel33
  - number: '33.7'
    text: |-
      Andere dan de in het vierde en vijfde lid bedoelde typen krachtvoertuigen kunnen op de spoorwegen worden toegelaten
      onder door de Minister te stellen voorwaarden.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel33
  - number: '34'
    text: |-
      In een als bijlage van het in [artikel 44][ref1] bedoelde register bij te houden album worden opgenomen:


      [ref1]: https://wetten.overheid.nl/BWBR0003083#Artikel44
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0003083
        artikel: '44'
        hoofdstuk: III
        afdeling: III
  - number: 34.A
    text: 'voor alle krachtvoertuigen:'
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel34
  - number: 34.A.a
    text: de naam van de spoorwegdienst die het krachtvoertuig in gebruik neemt;
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel34
  - number: 34.A.b
    text: |-
      het volgnummer, het fabrieksnummer, de naam en de woonplaats van de fabrikant en het jaar waarin het krachtvoertuig
      is afgeleverd;
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel34
  - number: 34.A.c
    text: een korte omschrijving van het krachtvoertuig;
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel34
  - number: 34.A.d
    text: het type van de zelfwerkende rem;
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel34
  - number: 34.A.e
    text: het gewicht van het krachtvoertuig in dienstvaardige toestand, de grootste asdruk en het remgewicht;
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel34
  - number: 34.A.f
    text: de constructief toegestane snelheid.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel34
  - number: 34.B
    text: 'voor krachtvoertuigen al dan niet rechtstreeks gedreven door een of meer verbrandingsmotoren:'
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel34
  - number: 34.B.a
    text: het type en de hoofdafmetingen van de motoren;
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel34
  - number: 34.B.b
    text: het grootste toegelaten aantal omwentelingen van de motoren in de minuut;
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel34
  - number: 34.B.c
    text: het continuvermogen van de motoren in kW;
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel34
  - number: 34.B.d
    text: het type van de koelinrichting;
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel34
  - number: 34.B.e
    text: een opgave van de inhoud van de brandstoftanks;
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel34
  - number: 34.B.f
    text: het type van de krachtoverbrenging tussen de motoren en de aangedreven assen.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel34
  - number: 34.C
    text: 'voor krachtvoertuigen gedreven door een of meer elektromotoren:'
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel34
  - number: 34.C.a
    text: het type en de maximumspanning van de tractiemotoren;
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel34
  - number: 34.C.b
    text: het grootste toegelaten omwentelingen van de tractiemotoren in de minuut;
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel34
  - number: 34.C.c
    text: het aantal en het continuvermogen van de tractiemotoren in kW.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel34
  - number: '35'
    text: |-
      Op treinstellen zijn mede de bepalingen van de [artikelen 37][ref1], [38][ref2] en [40][ref3] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003083#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0003083#Artikel38
      [ref3]: https://wetten.overheid.nl/BWBR0003083#Artikel40
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0003083
        artikel: '37'
        hoofdstuk: III
        afdeling: II
      - id: ref2
        bwb_id: BWBR0003083
        artikel: '38'
        hoofdstuk: III
        afdeling: II
      - id: ref3
        bwb_id: BWBR0003083
        artikel: '40'
        hoofdstuk: III
        afdeling: II
  - number: '37'
    text: Alle rijtuigen en wagens moeten voorzien zijn van lantarenhouders of van vaste sluitseinen.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel37
  - number: '38.1'
    text: De rijtuigen moeten voorzien zijn van middelen tot behoorlijke verlichting, luchtverversing en verwarming.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel38
  - number: '38.2'
    text: |-
      De rijtuigafdelingen waarin reizigers worden vervoerd, worden in twee klassen onderscheiden, tenzij de Directie
      anders bepaalt.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel38
  - number: '38.3'
    text: |-
      Op afstand bediende of automatisch sluitende deuren moeten zodanig geconstrueerd zijn, dat bij het openen en
      sluiten daarvan geen gevaar voor personen ontstaat.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel38
  - number: '38.4'
    text: 'Naar buiten openslaande deuren in de zijwanden van de rijtuigen moeten:'
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel38
  - number: 38.4.a
    text: |-
      in een stand, loodrecht op de lengteas van het rijtuig, binnen het profiel van vrije ruimte als bedoeld in
      [artikel 14][ref1] blijven;


      [ref1]: https://wetten.overheid.nl/BWBR0003083#Artikel14
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0003083
        artikel: '14'
        hoofdstuk: II
        afdeling: II
  - number: 38.4.b
    text: |-
      voorzien zijn van twee sluitingen, die zowel van buiten als van binnen door de reizigers zonder bezwaar kunnen
      worden geopend; deze twee sluitingen mogen in één slot verenigd zijn.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel38
  - number: '38.5'
    text: |-
      Zwenkzwaaideuren en draaivouwdeuren in de zijwanden van de rijtuigen, die door middel van luchtdruk worden
      gesloten, moeten in gesloten stand zijn vergrendeld om te voorkomen dat zij door drukken - van binnenuit - kunnen
      worden geopend.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel38
  - number: '38.6'
    text: Ruiten in ramen, deuren en wanden van nieuw te bouwen rijtuigen moeten uit veiligheidsglas bestaan.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel38
  - number: '39'
    text: |-
      Onder een stuurstandvoertuig wordt verstaan een voertuig, geen krachtvoertuig zijnde, dat voorzien is van
      apparatuur, waarmee alle voortbewegingsinrichtingen in de trein en het doorgaand zelfwerkend remsysteem kunnen
      worden bediend en gecontroleerd. Het moet verder voorzien zijn van de overige in [artikel 33, eerste lid][ref1],
      genoemde inrichtingen, zulks onverminderd de ontheffingsmogelijkheid genoemd in het tweede lid van dat artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0003083#Artikel33
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0003083
        artikel: '33'
        hoofdstuk: III
        afdeling: I
  - number: '40'
    text: 'Op een zichtbare plaats worden duidelijk aangegeven:'
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel40
  - number: 40.a
    text: |-
      op rijtuigen bestemd voor het vervoer van reizigers: de klasse, met dien verstande, dat de aanduiding van de tweede
      klasse achterwege kan worden gelaten;
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel40
  - number: 40.b
    text: 'in elke afdeling: de klasse en het aantal zitplaatsen;'
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel40
  - number: 40.c
    text: 'op elke eerste klasse balkon: de klasse;'
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel40
  - number: 40.d
    text: 'in rijtuigen met een buitenbreedte van de bak van meer dan 2,90 meter:'
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel40
  - number: '41.1'
    text: |-
      Het rollend materieel met alle daaraan bevestigde losse delen moet, al dan niet beladen, zowel op recht spoor als
      in bogen blijven binnen het op [bijlage B][ref1] aangegeven kinematisch omgrenzingsprofiel, zulks onverminderd het
      bepaalde in de laatste alinea van het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0003083
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0003083
  - number: '41.2'
    text: |-
      Bij de bepaling van het in het eerste lid bedoelde omgrenzingsprofiel is er van uitgegaan, dat de hartlijn van dit
      profiel samenvalt met de hartlijn van het spoor met normale spoorwijdte, waarbij deze hartlijn loodrecht staat op
      het vlak door de bovenkanten der spoorstaven.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel41
  - number: '41.3'
    text: |-
      Bij de bepaling van de afmetingen van het rollend materieel wordt uitgegaan van een referentieboog met een straal
      van 250 m. Daarbij moet rekening gehouden worden met:
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel41
  - number: 41.3.a
    text: |-
      geometrische verplaatsingen tengevolge van de instelling van het rollend materieel in het spoor, slijtagefactoren
      van dat materieel en verticale verplaatsingen ervan;
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel41
  - number: 41.3.b
    text: horizontale verplaatsingen ten gevolge van statisch overhellen bij een verkanting tot 50 mm;
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel41
  - number: 41.3.c
    text: afwijkingen, verband houdende met bouw en belading van het rollend materieel, voor zover deze meer dan 1° bedragen.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel41
  - number: '41.4'
    text: |-
      Met het oog op het veilig berijden van een spoor in verticale bogen moet de onderste begrenzingslijn van het
      rollend materieel zo nodig hoger zijn dan op [bijlage B][ref1] is aangegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0003083
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0003083
  - number: '41.5'
    text: De Minister kan voor door hem aan te wijzen materieel andere omgrenzingsprofielen voorschrijven of toestaan.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel41
  - number: '42'
    text: |-
      De asbelasting en het gewicht per strekkende meter van rollend materieel mogen de voor de aarden baan, de bovenbouw
      en de kunstwerken toelaatbare belasting niet overschrijden. De constructie van rollend materieel moet zijn
      afgestemd op de toelaatbare belasting van de aarden baan, de bovenbouw en de kunstwerken.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel42
  - number: '43'
    text: |-
      Alvorens rollend materieel wordt aangeschaft, wordt met het type door de Directie ingestemd. Op de desbetreffende
      tekeningen op een schaal van ten minste 1 : 100 worden onder meer aangegeven:
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel43
  - number: 43.a
    text: |-
      voor treinstellen en rijtuigen: het aantal zit- of ligplaatsen of bedden in elke afdeling en het aantal
      klapzittingen op elk balkon en, indien de Directie dit voorschrijft, het aantal staanplaatsen in elke afdeling en
      op elk balkon;
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel43
  - number: 43.b
    text: 'voor treinstellen en wagens: het draagvermogen voor vervoer van goederen.'
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel43
  - number: '44.1'
    text: Alvorens rollend materieel in dienst wordt gesteld, wordt dit vanwege de Directie onderzocht en geaccordeerd.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel44
  - number: '44.2'
    text: |-
      De akkoordverklaring wordt ingeschreven in een hiertoe dienend register, met volgnummer, datum van
      akkoordverklaring en datum van indienststelling.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel44
  - number: '45'
    text: |-
      Wijziging van de bestemming of van de inrichting van rollend materieel, waardoor wordt afgeweken van de in
      [artikel 43][ref1] bedoelde tekeningen, wordt door de Directie geaccordeerd.


      [ref1]: https://wetten.overheid.nl/BWBR0003083#Artikel43
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0003083
        artikel: '43'
        hoofdstuk: III
        afdeling: III
  - number: '46'
    text: |-
      Rollend materieel wordt volgens een door de Directie geaccordeerd schema voor periodiek onderhoud nauwkeurig
      onderzocht en in een zodanige staat gehouden, dat daaruit samengestelde treinen en rangeerdelen te allen tijde
      veilig kunnen rijden.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel46
  - number: '47.1'
    text: |-
      Van rollend materieel wordt een administratie gevoerd, waarbij van elk krachtvoertuig, van elk rijtuig en van elke
      wagen worden aangetekend:
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel47
  - number: 47.1.a
    text: het volgnummer;
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel47
  - number: 47.1.b
    text: de naam van de fabrikant;
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel47
  - number: 47.1.c
    text: de datum van indienststelling;
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel47
  - number: 47.1.d
    text: wijzigingen en belangrijke herstellingen;
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel47
  - number: 47.1.e
    text: |-
      de data waarop het materieel voor de onder *d* bedoelde voorzieningen in de werkplaats werd opgenomen en daarna
      weer in dienst werd gesteld.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel47
  - number: '47.2'
    text: 'Van de assen van rollend materieel wordt een administratie gevoerd, waarbij van elke as worden aangetekend:'
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel47
  - number: 47.2.a
    text: het volgnummer;
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel47
  - number: 47.2.b
    text: de omschrijving van de grondstof en de naam van de fabrikant;
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel47
  - number: 47.2.c
    text: de hoofdafmetingen;
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel47
  - number: 47.2.d
    text: de datum van indienststelling.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel47
  - number: '48'
    text: |-
      Rollend materieel dat niet aan de spoorwegdienst toebehoort en niet valt onder [artikel 49][ref1] kan onder de
      Directie te stellen voorwaarden op de spoorweg worden toegelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0003083#Artikel49
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0003083
        artikel: '49'
        hoofdstuk: III
        afdeling: III
  - number: '49'
    text: |-
      Rollend materieel behorend tot of opgenomen in het materieelpark van buitenlandse spoorwegdiensten mag op de
      spoorwegen hier te lande worden gebruikt, zonder dat de bepalingen van dit reglement, het onderzoek van rollend
      materieel betreffende, worden toegepast, mits:
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel49
  - number: 49.a
    text: |-
      dat rollend materieel, wat de algemene inrichting en de hoofdafmetingen betreft, niet meer afwijkt van de
      voorschriften van dit reglement dan zonder bezwaar voor de veiligheid kan worden toegelaten;
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel49
  - number: 49.b
    text: het uiterlijk aanzien geen twijfel laat aangaande de deugdelijkheid en de goede staat van onderhoud;
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel49
  - number: 49.c
    text: |-
      de rijtuigen en het voor vervoer van personen bestemde gedeelte van de treinstellen inwendig zindelijk onderhouden
      en niet minder goed ingericht zijn dan op de spoorwegen hier te lande gebruikelijk.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel49
  - number: '50.1'
    text: |-
      De Directie kan om bijzondere redenen afwijkingen van dit hoofdstuk toestaan, behoudens met betrekking tot
      onderwerpen ten aanzien waarvan enige bevoegdheid aan de Minister is toegekend.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel50
  - number: '50.2'
    text: |-
      Van de desbetreffende beschikking wordt - indien daartoe aanleiding is - aantekening gehouden in het register,
      bedoeld in [artikel 44][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003083#Artikel44
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0003083
        artikel: '44'
        hoofdstuk: III
        afdeling: III
  - number: 50a.1
    text: |-
      Goedgekeurde hogesnelheidstreinen zijn met inachtneming van [artikel 32f, derde lid, van de Spoorwegwet][ref1] hier
      te lande voor gebruik op hogesnelheidsinfrastructuur toegelaten en mogen worden gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0001848#Artikel32f
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel50a
    references:
      - id: ref1
        bwb_id: BWBR0001848
        artikel: 32f
  - number: 50a.2
    text: |-
      De [artikelen 43 tot en met 46][ref1], [48][ref2], [49][ref3] en [50][ref4] zijn ten aanzien van goedgekeurde hoge-
      snelheidstreinen niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003083#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0003083#Artikel48
      [ref3]: https://wetten.overheid.nl/BWBR0003083#Artikel49
      [ref4]: https://wetten.overheid.nl/BWBR0003083#Artikel50
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel50a
    references:
      - id: ref1
        bwb_id: BWBR0003083
        artikel: '43'
        hoofdstuk: III
        afdeling: III
      - id: ref2
        bwb_id: BWBR0003083
        artikel: '48'
        hoofdstuk: III
        afdeling: III
      - id: ref3
        bwb_id: BWBR0003083
        artikel: '49'
        hoofdstuk: III
        afdeling: III
      - id: ref4
        bwb_id: BWBR0003083
        artikel: '50'
        hoofdstuk: III
        afdeling: III
  - number: 50a.3
    text: |-
      Voor gebruik van hogesnelheidsinfrastructuur door ander rollend materieel dan goedgekeurde hoge snelheidstreinen
      kunnen bij ministeriële regeling voorschriften die gelden voor goedgekeurde hogesnelheidstreinen, geheel of
      gedeeltelijk van toepassing worden verklaard.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel50a
  - number: '51.1'
    text: Behoudens hetgeen hierna is bepaald, is het krachtvoertuig aan het hoofd van de trein geplaatst.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel51
  - number: '51.2'
    text: |-
      Voertuigen als bedoeld in [artikel 39][ref1] mogen met de cabine voorop aan het hoofd van de trein worden
      geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0003083#Artikel39
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0003083
        artikel: '39'
        hoofdstuk: III
        afdeling: II
  - number: '51.3'
    text: |-
      De machinist moet zich bevinden in de voorste cabine van het in het eerste lid bedoelde krachtvoertuig, dan wel in
      een voertuig als bedoeld in het tweede lid, wanneer dit aan het hoofd van de trein is geplaatst.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel51
  - number: 51.4.a
    text: |-
      In de trein mogen twee of meer krachtvoertuigen zijn geplaatst die worden bediend door de in het derde lid bedoelde
      machinist.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel51
  - number: 51.4.b
    text: |-
      Afzonderlijk bediende krachtvoertuigen mogen in de trein zijn geplaatst, indien de machinisten zich voortdurend
      door middel van een radioverbinding met elkaar kunnen verstaan.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel51
  - number: 51.4.c
    text: |-
      Zonder deze radioverbinding mogen, behalve het krachtvoertuig dat wordt bediend door de in het derde lid bedoelde
      machinist, nog ten hoogste twee afzonderlijk bediende krachtvoertuigen in de trein zijn geplaatst, mits: - deze
      zijn aangesloten op het doorgaand zelfwerkend remsysteem,
        - deze in de trein zijn geplaatst als tweede en/of als laatste voertuig,
        - de machinisten zich met elkaar kunnen verstaan door seinen, die omschreven worden in het Seinreglement, bedoeld
      in [artikel 27][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003083#Artikel27
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0003083
        artikel: '27'
        hoofdstuk: II
        afdeling: IV
  - number: '51.5'
    text: |-
      Treinen mogen worden opgedrukt door een niet aan de trein gekoppeld krachtvoertuig bij het bestijgen van moeilijke
      hellingen, het vertrekken van de stations en bij onvoldoende of weggevallen trekvermogen van het krachtvoertuig of
      van de krachtvoertuigen in de trein.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel51
  - number: '51.6'
    text: 'Afwijking van het bepaalde in het eerste, tweede en derde lid is toegestaan bij:'
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel51
  - number: 51.6.a
    text: treinen naar of van los- en laadplaatsen;
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel51
  - number: 51.6.b
    text: treinen naar of van spooraansluitingen;
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel51
  - number: 51.6.c
    text: bijzondere treinen die niet ten dienste van het vervoer van reizigers zijn ingelegd;
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel51
  - number: 51.6.d
    text: bedrijfsstoringen.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel51
  - number: '51.7'
    text: |-
      Voor het rijden met andere dan de in [artikel 33, vierde en vijfde lid][ref1], bedoelde krachtvoertuigen geeft de
      Directie bijzondere voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0003083#Artikel33
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0003083
        artikel: '33'
        hoofdstuk: III
        afdeling: I
  - number: '51.8'
    text: |-
      Niet medewerkende, onbemande krachtvoertuigen blijven bij de bepaling van het aantal krachtvoertuigen buiten
      beschouwing.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel51
  - number: '52.1'
    text: |-
      Een trein mag zijn samengesteld uit zoveel voertuigen, dat het aantal assen niet meer bedraagt dan 150 voor
      reizigerstreinen en 300 voor goederentreinen.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel52
  - number: '52.2'
    text: |-
      Indien een trein is samengesteld uit rijtuigen en wagens bepaalt de Directie of deze als reizigerstrein dan wel als
      goederentrein moet worden beschouwd.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel52
  - number: '52.3'
    text: |-
      In reizigerstreinen worden twee- of drie-assige voertuigen achteraan vervoerd. De Directie kan voertuigen aanwijzen
      waarvoor van deze bepaling mag worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel52
  - number: '52.4'
    text: |-
      Indien in bijzondere gevallen geen reizigersmaterieel beschikbaar is, kan de Directie toestaan dat reizigers worden
      vervoerd in ander door haar aan te wijzen gesloten materieel, mits:
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel52
  - number: 52.4.a
    text: |-
      dit materieel aan de leiding van het doorgaand zelfwerkend remsysteem is aangesloten, met dien verstande dat -
      onverminderd het overigens in [artikel 53, vijfde lid][ref1], bepaalde - niet vereist is dat het remwerk in elk
      voertuig in werking kan worden gesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0003083#Artikel53
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0003083
        artikel: '53'
        hoofdstuk: IV
  - number: 52.4.b
    text: de trein met geen grotere snelheid dan 80 km/h wordt vervoerd;
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel52
  - number: 52.4.c
    text: de schuifdeuren tijdens de rit in gedeeltelijk geopende stand zijn vastgezet;
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel52
  - number: 52.4.d
    text: voor zover mogelijk voor passende zitgelegenheid wordt gezorgd.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel52
  - number: '52.5'
    text: |-
      Voor het geval in een reizigerstrein die met een grotere snelheid dan 80 km/h wordt vervoerd, houten met reizigers
      bezette rijtuigen of wagens voorkomen, worden deze achteraan vervoerd.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel52
  - number: '52.6'
    text: |-
      Elke trein voert de front- en sluitseinen als omschreven in het Seinreglement, bedoeld in [artikel 27][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003083#Artikel27
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0003083
        artikel: '27'
        hoofdstuk: II
        afdeling: IV
  - number: '53.1'
    text: |-
      Treinen worden ten minste beremd overeenkomstig door de Minister te accorderen tabellen, die het remgewicht van de
      trein uitdrukken in percentages van het treingewicht als functie van de snelheid. Deze percentages dienen zodanig
      te zijn, dat de treinen op een dalende helling van 5o/oo tot stilstand kunnen worden gebracht binnen de hierna
      genoemde afstanden:









                    Treinsnelheid in km/h


                    Hoofdspoorwegen


                    Lokaalspoorwegen




                    baanvaksnelheid


                    Voor vervoer van personen en goederen opengestelde spoorwegen


                    Alléén voor vervoer van goederen opengestelde spoorwegen






                    ten hoogste 110 km/h


                    meer dan 110 km/h







                    niet meer dan 40:


                    400 m


                    400 m


                    400 m


                    400 m




                    meer dan 40 doch niet meer dan 60:


                    500 m


                    500 m


                    500 m


                    500 m




                    meer dan 60 doch niet meer dan 80:


                    800 m


                    800 m


                    600 m


                    800 m




                    meer dan 80 doch niet meer dan 110:


                    800 m


                    1000 m


                    –


                    –




                    meer dan 110 doch niet meer dan 130:


                    –


                    1000 m


                    –


                    –




                    meer dan 130:


                    –


                    een door de Minister te bepalen afstand van ten minste 1000 m


                    –


                    –




           Voor dalende hellingen van meer dan 5o/oo kan de Minister nadere voorschriften geven.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel53
  - number: '53.2'
    text: De Minister bepaalt, hoe het promillage van een helling moet worden berekend.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel53
  - number: '53.3'
    text: |-
      Voor treinen die rijden op baanvakken die uitsluitend voor het vervoer van reizigers zijn bestemd kan de Minister
      afwijking van de in het eerste lid gestelde eisen voorschrijven.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel53
  - number: '53.4'
    text: |-
      Onder remgewicht van de trein wordt verstaan: de som van de remgewichten van de voertuigen waarvan de rem
      functioneert. Onder treingewicht wordt verstaan: de som van de totale gewichten van de voertuigen; het totale
      gewicht is de som van het eigen gewicht en het gewicht van de reizigers en/of van de lading. Het remgewicht en het
      eigen gewicht moeten op elk voertuig zijn aangegeven. Indien het totale gewicht niet op een rijtuig is aangegeven,
      wordt dit bij een voor reizigers toegankelijk rijtuig berekend door bij het eigengewicht te tellen:






                    2 t


                    voor een slaaprijtuig of voor een restauratierijtuig met bagage- of reizigersafdeling,




                    nihil


                    voor overige restauratierijtuigen,




                    3 t


                    voor een bagagerijtuig met een bodemoppervlakte van ten hoogste 40 m2,




                    4 t


                    voor een zit- en ligrijtuig 1e klasse,




                    5 t


                    voor de overige rijtuigen.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel53
  - number: '53.5'
    text: |-
      Treinen rijdende met een grotere snelheid dan 40 km/h moeten zijn voorzien van een doorgaand zelfwerkend remsysteem
      dat aan de volgende eisen voldoet:
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel53
  - number: 53.5.a
    text: de remmen moeten door de machinist van zijn plaats af in werking kunnen worden gesteld;
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel53
  - number: 53.5.b
    text: |-
      de remmen moeten in werking treden, zodra de doorgaande leiding anders dan tengevolge van een bedieningshandeling
      wordt verbroken.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel53
  - number: '53.6'
    text: |-
      De constructie van het doorgaand zelfwerkend remsysteem en de inrichting om dit te bedienen worden vastgesteld door
      de Directie.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel53
  - number: '53.7'
    text: |-
      Voertuigen die niet kunnen worden aangesloten op het doorgaand zelfwerkend remsysteem, mogen onverminderd het
      bepaalde in het negende lid achteraan worden vervoerd, en wel:
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel53
  - number: 53.7.a
    text: |-
      in reizigerstreinen, voor zover deze met een snelheid van niet meer dan 80 km/h rijden, tot een aantal van ten
      hoogste drie, en voor zover deze sneller rijden ten hoogste één, mits in alle gevallen elk voertuig ten minste
      weegt: 10 t, indien het twee assen heeft, 14 t, indien het drie assen heeft, 16 t, indien het meer dan drie assen
      heeft;
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel53
  - number: 53.7.b
    text: |-
      in goederentreinen, voor zover deze met een snelheid van meer dan 40 km/h doch niet meer dan 80 km/h rijden, tot
      een aantal van ten hoogste drie, elk wegende ten minste 8 t, en voor zover deze sneller dan 80 km/h rijden ten
      hoogste één, waarvan het gewicht aan de onder *a* gestelde eisen voldoet.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel53
  - number: '53.8'
    text: |-
      Bovendien mag in reizigerstreinen ten hoogste één voertuig worden vervoerd waarvan de op het doorgaand zelfwerkend
      remsysteem aangesloten rem buiten werking is mits dit voertuig ten minste 14 t weegt. De Minister is bevoegd
      afwijking van deze bepaling toe te staan voor door hem aangewezen treinen waarmede zowel personen als goederen
      worden vervoerd, mits deze treinen met een snelheid van niet meer dan 80 km/h rijden.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel53
  - number: '53.9'
    text: |-
      Op spoorwegen met hellingen groter dan 5o/oo en langer dan 1000 m moet in elke trein het laatste voertuig zijn
      voorzien, hetzij van een op het doorgaand zelfwerkend remsysteem aangesloten rem, hetzij van een handrem. In het
      laatstbedoelde geval moet een personeelslid aanwezig zijn, dat de handrem zonodig kan bedienen.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel53
  - number: '53.10'
    text: |-
      Bij uitzondering mag in goederentreinen, achter het in het negende lid bedoelde voertuig, onverminderd het bepaalde
      in het zevende lid onder *b*, een herstelling behoevend voertuig worden vervoerd, indien dat vervoer geen gevaar
      oplevert en de aard van de beschadiging een andere plaatsing in de weg staat.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel53
  - number: '54.1'
    text: |-
      De snelheid waarmede de treinen mogen worden vervoerd, wordt per spoorweg of zo nodig per spoorweggedeelte door de
      Directie vastgesteld door de Minister vastgesteld. Zij mag overigens onverminderd het bepaalde in het vijfde lid en
      noodzakelijke snelheidsbeperkingen in verband met de aard van het materieel of de situatie ter plaatse, niet meer
      bedragen dan:
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel54
  - number: 54.1.a
    text: |-
      140 km/h voor reizigerstreinen en treinen bestaande uit ledig reizigersmaterieel; de Minister kan voor door hem te
      bepalen baanvakken en onder door hem te stellen voorwaarden een grotere snelheid toestaan;
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel54
  - number: 54.1.b
    text: |-
      100 km/h voor goederentreinen en werktreinen; de Directie kan voor door haar aan te wijzen treinen een snelheid
      toestaan van meer dan 100 km/h doch ten hoogste 140 km/h, mits ook de belading aan door haar te stellen eisen
      voldoet;
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel54
  - number: 54.1.b.a
    text: 100 km/h voor reizigerstreinen en treinen bestaande uit ledig reizigersmaterieel;
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel54
  - number: 54.1.b.b
    text: 80 km/h voor goederentreinen en werktreinen;
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel54
  - number: 54.1.b.c
    text: |-
      60 km/h, wanneer de trein wordt opgedrukt op de in [artikel 51, vijfde lid][ref1], bedoelde wijze;


      [ref1]: https://wetten.overheid.nl/BWBR0003083#Artikel51
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0003083
        artikel: '51'
        hoofdstuk: IV
  - number: 54.1.b.d
    text: |-
      30 km/h voor treinen die niet door de machinist vanuit een cabine aan het hoofd van de trein worden bediend, indien
      echter, op een door de Directie aangewezen gedeelte van de spoorweg op het voorste voertuig van een niet voor
      reizigersvervoer aangewezen trein, personeel dienst doet dat het doorgaand zelfwerkend remsysteem kan bedienen en
      zich door middel van een radioverbinding met de machinist kan verstaan, bedraagt de hoogste toegelaten snelheid 60
      km/h.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel54
  - number: '54.2'
    text: Voor proefritten is de snelheid onbeperkt.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel54
  - number: '54.3'
    text: Voor proefritten is de snelheid beperkt tot 100 km/h.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel54
  - number: '54.4'
    text: |-
      Behoudens het bepaalde in het tweede en derde lid is de snelheid, waarmede treinen worden vervoerd, niet hoger
      dan krachtens het eerste lid is vastgesteld. Zij bedraagt voorts bij het doorrijden van bogen, waaronder begrepen
      wisselbogen, niet meer dan voor deze bogen is vastgesteld overeenkomstig de volgende formule: In deze formule is:
      v de toegelaten snelheid in km/h h de verkanting in mm a de niet door de verkanting gecompenseerde zijdelingse
      versnelling; deze waarde mag ten hoogste bedragen: voor spoor in grindballast 0,4 m/sec2 voor spoor in gebroken
      grindballast 0,6 m/sec2 voor spoor in steenslagballast en voor wisselbogen 0,8 m/sec2 r de boogstraal in m. De
      Directie-Generaal kan in door hem bepaalde gevallen grotere zijwaartse versnellingen toestaan.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel54
  - number: '54.5'
    text: |-
      In of krachtens het Trein- en Rangeerdienstreglement, bedoeld in [artikel 51][ref1], wordt bepaald of, en in welke
      mate de snelheid moet worden verminderd waar zulks voor de veiligheid van het verkeer nodig mocht zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0003083#Artikel51
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0003083
        artikel: '51'
        hoofdstuk: IV
  - number: '54.6'
    text: De Directie wijst plaatsen aan waar toestellen voor het meten van de treinsnelheden worden geplaatst.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel54
  - number: '54.7'
    text: |-
      Voor zover een spoorweg op de openbare weg is aangelegd, kan de Minister, de Directie en gedeputeerde staten van de
      betrokken provincie gehoord, voorschrijven, dat en in welke mate de snelheid moet worden verminderd.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel54
  - number: '55.1'
    text: |-
      De voor treinen bestemde krachtvoertuigen en rijtuigen moeten, globaal eenmaal per etmaal, geheel worden nagezien.
      Daarbij moet er in het bijzonder op worden gelet, dat de voertuigen geen gebreken vertonen die voor de veiligheid
      van het verkeer gevaar kunnen opleveren.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel55
  - number: '55.2'
    text: |-
      Elke trein moet, voordat hij naar de eerste bestemming van de dag vertrekt, geheel zijn nagezien. Daarbij moet er
      in het bijzonder op worden gelet, dat:
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel55
  - number: 55.2.a
    text: indien de trein is voorzien van een doorgaand zelfwerkend remsysteem dit goed werkt;
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel55
  - number: 55.2.b
    text: |-
      het remgewicht van de trein voldoet aan het bepaalde in [artikel 53, eerste lid][ref1], en de remmen zoveel
      mogelijk gelijkelijk over de trein zijn verdeeld:


      [ref1]: https://wetten.overheid.nl/BWBR0003083#Artikel53
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0003083
        artikel: '53'
        hoofdstuk: IV
  - number: 55.2.c
    text: |-
      in de trein geen voertuigen zijn opgenomen die niet geschikt zijn voor de grootste snelheid waarmee de trein wordt
      vervoerd;
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel55
  - number: 55.2.d
    text: de voertuigen onderling op de juiste wijze zijn gekoppeld;
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel55
  - number: 55.2.e
    text: de voor de veiligheid nodige elektrische verbindingen tussen de voertuigen zijn aangebracht en deze goed werken;
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel55
  - number: 55.2.f
    text: |-
      de in het Seinreglement, bedoeld in [artikel 27][ref1], omschreven seinen en de in [artikel 56][ref2] bedoelde
      seinmiddelen aanwezig zijn;


      [ref1]: https://wetten.overheid.nl/BWBR0003083#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0003083#Artikel56
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0003083
        artikel: '27'
        hoofdstuk: II
        afdeling: IV
      - id: ref2
        bwb_id: BWBR0003083
        artikel: '56'
        hoofdstuk: IV
  - number: 55.2.g
    text: de buitendeuren van het reizigersmaterieel goed sluiten;
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel55
  - number: 55.2.h
    text: elke wagen zoveel mogelijk gelijkmatig is beladen en niet tot een zwaarder gewicht dan is toegelaten;
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel55
  - number: 55.2.i
    text: van een goederentrein de wagens en hun belading geen gebreken vertonen.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel55
  - number: '55.3'
    text: |-
      In afwijking van het eerste en tweede lid worden de voor treinen bestemde krachtvoertuigen en rijtuigen die worden
      ingezet bij RandstadRail, volgens een door de Directie vast te stellen schema nagezien. Daarbij wordt er in het
      bijzonder op gelet, dat de voertuigen geen gebreken vertonen die voor de veiligheid van het verkeer gevaar kunnen
      opleveren.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel55
  - number: '55.4'
    text: De Directie bepaalt op welke punten moeten worden gelet bij een wijziging in de samenstelling van de trein.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel55
  - number: '56'
    text: |-
      Elke trein wordt voorzien van de gereedschappen, nodig bij kleine ongevallen en herstellingen van het rollend
      materieel, alsmede van middelen voor het treffen van veiligheidsmaatregelen bij onregelmatigheden.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel56
  - number: '57.1'
    text: Waar dubbel spoor ligt, houden de treinen het ten opzichte van de rijrichting rechts liggende spoor.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel57
  - number: '57.2'
    text: 'Afwijkingen van die regel zijn geoorloofd:'
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel57
  - number: 57.2.a
    text: |-
      indien de beveiliging mede is ingericht voor het berijden van het ten opzichte van de rijrichting links liggende
      spoor;
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel57
  - number: 57.2.b
    text: |-
      waar met toestemming van de Directie de beveiliging uitsluitend is ingericht voor het berijden van het ten opzichte
      van de rijrichting links liggende spoor;
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel57
  - number: 57.2.c
    text: |-
        - voor treinen naar of van spooraansluitingen,
        - voor treinen die niet ten dienste van het publiek zijn ingelegd,
        - voor treinen die in verband met werkzaamheden aan de spoorweg het rechts liggende spoor niet kunnen berijden,
        - voor krachtvoertuigen die na het opdrukken van een trein terugkeren,
        - voor treinen die betrokken zijn bij ongevallen of onregelmatigheden in de treinenloop,
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel57
  - number: '58.1'
    text: 'Een trein mag een spoorgedeelte eerst berijden, indien:'
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel58
  - number: 58.1.a
    text: de zekerheid is verkregen dat dit spoorgedeelte vrij is;
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel58
  - number: 58.1.b
    text: |-
      de zekerheid is verkregen dat op dat spoorgedeelte geen trein uit tegengestelde richting gelijktijdig wordt
      toegelaten;
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel58
  - number: 58.1.c
    text: een en ander door seinen aan de machinist is kenbaar gemaakt;
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel58
  - number: 58.1.d
    text: |-
      een en ander door seinen of op een in het Trein- en Rangeerdienstreglement, bedoeld in [artikel 51][ref1],
      aangeduide andere wijze aan de machinist is kenbaar gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0003083#Artikel51
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0003083
        artikel: '51'
        hoofdstuk: IV
  - number: '58.2'
    text: 'De zekerheid, bedoeld in het eerste lid, wordt op een der volgende wijzen verkregen:'
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel58
  - number: 58.2.a
    text: |-
      door middel van zelfwerkend blokstelsel, waarbij het desbetreffende seinbeeld alleen kan worden getoond, indien het
      te berijden spoorgedeelte vrij is en tevens is uitgesloten, dat een sein gelijktijdig een trein uit tegengestelde
      richting toelaat;
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel58
  - number: 58.2.b
    text: |-
      door middel van bediend blokstelsel, waarbij het desbetreffende sein, nadat het is bediend voor een trein,
      alleen opnieuw kan worden bediend, nadat door inrichtingen of door waarneming is vastgesteld, dat deze trein het
      desbetreffende spoorgedeelte heeft verlaten en door inrichtingen tevens is uitgesloten, dat een sein gelijktijdig
      een trein uit tegengestelde richting toelaat;
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel58
  - number: 58.2.c
    text: |-
      Op door de Minister aan te wijzen voor het vervoer van reizigers bestemde spoorwegen of gedeelten daarvan, doordat
      het betrokken personeellid eerst toestemming geeft om een spoorgedeelte te berijden, nadat hem is meegedeeld of
      uit zijn eigen waarneming is gebleken, dat de voorgaande trein dit spoorgedeelte heeft verlaten en geen trein
      gelijktijdig uit tegengestelde richting wordt toegelaten;
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel58
  - number: 58.2.d
    text: |-
      op spoorwegen die uitsluitend bestemd zijn voor het vervoer van goederen, op een in het Trein- en
      Rangeerdienstreglement, bedoeld in [artikel 51][ref1], aan te geven wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0003083#Artikel51
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0003083
        artikel: '51'
        hoofdstuk: IV
  - number: '58.3'
    text: |-
      In het Trein- en Rangeerdienstreglement, bedoeld in [artikel 51][ref1], wordt aangegeven hoe, in afwijking van het
      bepaalde in het eerste lid, onder *a* en *c*, treinbewegingen plaats hebben:


      [ref1]: https://wetten.overheid.nl/BWBR0003083#Artikel51
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0003083
        artikel: '51'
        hoofdstuk: IV
  - number: 58.3.a
    text: bij afwijkend gebruik van de sporen;
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel58
  - number: 58.3.b
    text: op stations;
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel58
  - number: 58.3.c
    text: |-
      indien een seinbeeld wordt getoond dat het voorbijrijden toelaat, maar daarbij niet de zekerheid geeft dat het te
      berijden spoorgedeelte vrij is;
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel58
  - number: 58.3.d
    text: indien een trein niet is uitgerust met een doorgaand zelfwerkend remsysteem;
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel58
  - number: 58.3.e
    text: in geval van storing.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel58
  - number: '58.4'
    text: |-
      in het Trein- en Rangeerdienstreglement, bedoeld in [artikel 51][ref1], wordt geregeld hoe treinbewegingen worden
      beveiligd tegen rangeerbewegingen.


      [ref1]: https://wetten.overheid.nl/BWBR0003083#Artikel51
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0003083
        artikel: '51'
        hoofdstuk: IV
  - number: '59'
    text: 'Een trein mag vóór de in de dienstregeling aangegeven tijd rijden, mits:'
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel59
  - number: 59.a
    text: |-
      het een baanvak betreft waar: - alle sluitbomen, als bedoeld [onder ][ref1], zodanig in de beveiliging zijn
      opgenomen, dat de vaste seinen, die toegang geven tot de overweg alleen een seinbeeld kunnen tonen dat het
      voorbijrijden toelaat als de bomen zijn gesloten, of
        - deze seinen en de bomen vanuit dezelfde post worden bediend;


      [ref1]: https://wetten.overheid.nl/BWBR0003083#Artikel20
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0003083
        artikel: '20'
        hoofdstuk: II
        afdeling: III
  - number: 59.b
    text: het treinen betreft die niet voor het openbaar vervoer van reizigers bestemd zijn.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel59
  - number: '60.1'
    text: |-
      Op de treinrapporten, bedoeld in [artikel 71, derde lid][ref1], worden aangetekend:


      [ref1]: https://wetten.overheid.nl/BWBR0003083#Artikel71
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0003083
        artikel: '71'
        hoofdstuk: VI
        afdeling: I
  - number: 60.1.a
    text: de dag, het nummer of de letter van de trein en het baanvak, waarop deze loopt;
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel60
  - number: 60.1.b
    text: |-
      de werkelijke tijd van vertrek en aankomst op elk station benevens het aantal minuten vertraging; indien de
      werkzaamheden van de chef van de trein aan de machinist zijn opgedragen, kan volstaan worden met vermelding van de
      werkelijke tijden van vertrek en aankomst op de begin- en eindstations en op de stations, waar gekruist wordt;
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel60
  - number: 60.1.c
    text: de oorzaken van de vertragingen;
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel60
  - number: 60.1.d
    text: alle buitengewone voorvallen, die zich gedurende de loop van de trein voordoen;
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel60
  - number: 60.1.e
    text: de nummers van de kracht- en andere voertuigen, waaruit de trein is samengesteld.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel60
  - number: '60.2'
    text: De Directie kan van het bepaalde in het eerste lid ontheffing verlenen.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel60
  - number: '61.1'
    text: |-
      Het bedienen van een krachtvoertuig in de rangeerdienst kan hetzij rechtstreeks, hetzij op andere wijze van
      buitenaf geschieden. In het eerste geval moet de machinist zich op het krachtvoertuig, in het laatste geval op of
      bij het rangeerdeel bevinden.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel61
  - number: '61.2'
    text: |-
      Het krachtvoertuig waarmee een rangeerbeweging wordt uitgevoerd, voert de seinen als omschreven in het
      Seinreglement, bedoeld in [artikel 27][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003083#Artikel27
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0003083
        artikel: '27'
        hoofdstuk: II
        afdeling: IV
  - number: '61.3'
    text: |-
      De Minister kan na de Directie te hebben gehoord bepalen, op welke tijden niet mag worden gerangeerd over door hem
      aan te wijzen overwegen.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel61
  - number: '62'
    text: |-
      Maatregelen worden genomen om te beletten, dat op de sporen staande voertuigen door de wind of door andere
      onvoorziene omstandigheden in beweging worden gebracht en dat krachtvoertuigen zonder te zijn bediend in beweging
      komen.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel62
  - number: '63'
    text: |-
      Voorschriften betreffende bijzondere voertuigen worden opgenomen in het Trein- en Rangeerdienstreglement, bedoeld
      in [artikel 51][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003083#Artikel51
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0003083
        artikel: '51'
        hoofdstuk: IV
  - number: '66.1'
    text: |-
      In het Trein- en Rangeerdienstreglement, bedoeld in [artikel 51][ref1], worden voorschriften opgenomen betreffende
      de te nemen maatregelen:


      [ref1]: https://wetten.overheid.nl/BWBR0003083#Artikel51
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0003083
        artikel: '51'
        hoofdstuk: IV
  - number: 66.1.a
    text: |-
      indien een trein tengevolge van een onregelmatigheid buiten een station tot stilstand is gekomen en zijn rit niet
      kan vervolgen;
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel66
  - number: 66.1.b
    text: indien een gedeelte van een trein onderweg afbreekt;
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel66
  - number: 66.1.c
    text: indien een hoofdspoor versperd is.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel66
  - number: '66.2'
    text: Zo nodig schrijft de Directie aanvullende maatregelen voor met betrekking tot onregelmatigheden op stations.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel66
  - number: '66.3'
    text: |-
      De Directie wijst de plaatsen aan, waar een reservekrachtvoertuig gereed moet staan voor onmiddellijk gebruik,
      en waar de nodige werktuigen en materialen aanwezig moeten zijn om bij ongevallen het spoor spoedig te kunnen
      ontruimen.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel66
  - number: '67.1'
    text: |-
      De Directie wijst voor reizigers geopende stations en halten aan, waar de door hem voor te schrijven middelen tot
      het verlenen van eerste hulp aan en tot het vervoer van gewonden aanwezig moeten zijn.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel67
  - number: '67.2'
    text: |-
      De Directie schrijft voor, welke middelen tot het verlenen van eerste hulp aan gewonden in elke trein waarmede
      reizigers worden vervoerd, aanwezig moeten zijn.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel67
  - number: '67.3'
    text: |-
      De Directie treft een regeling omtrent de wijze, waarop aan de daarbij aan te wijzen personeelsleden de nodige
      kennis wordt bijgebracht voor het verlenen van eerste hulp aan gewonden.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel67
  - number: '68.1'
    text: 'Door de Directie wordt onmiddellijk kennis gegeven:'
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel68
  - number: 68.1.a
    text: |-
      van alle voorvallen op de spoorweg, die hetzij de veiligheid of de regelmatigheid van het spoorwegverkeer hetzij de
      veiligheid van personen in gevaar hebben gebracht, schriftelijk aan een der ambtenaren, belast met het toezicht, en
      bovendien per telex in gevallen waarbij de veiligheid van het spoorwegverkeer in gevaar is gebracht en tevens een
      ongeval is ontstaan;
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel68
  - number: 68.1.b
    text: |-
      van ernstige botsingen en van ernstige ontsporingen van één of meer treinen per telex aan de Minister en bovendien
      telefonisch aan een der ambtenaren, belast met het toezicht, aan de burgemeester van de gemeente in welke het
      voorval heeft plaatsgevonden en aan de officier van justitie in het arrondissement waarin de rechtbank is gelegen
      waartoe die gemeente behoort;
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel68
  - number: 68.1.c
    text: |-
      van voorvallen op de spoorweg, die dood of zwaar lichamelijk letsel, van één of meer personen ten gevolge hebben
      gehad, telefonisch aan de burgemeester van de gemeente in welke het voorval heeft plaatsgevonden en aan de officier
      van justitie in het arrondissement waarin de rechtbank is gelegen waartoe die gemeente behoort.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel68
  - number: '68.2'
    text: |-
      Van elk door de Directie in te stellen onderzoek betreffende voorvallen, waarbij de veiligheid van het
      spoorwegverkeer in ernstige mate in gevaar wordt gebracht, wordt tijdig kennis gegeven aan een der ambtenaren,
      belast met het toezicht. Die ambtenaren kunnen het onderzoek bijwonen. De Directie doet een verslag van het
      onderzoek aan de ambtenaren, belast met het toezicht, alsmede aan de Minister toekomen.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel68
  - number: '70.1'
    text: |-
      Het personeel moet de voor een behoorlijke uitoefening van zijn werkzaamheden vereiste lichamelijke en geestelijke
      gesteldheid bezitten.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel70
  - number: '70.2'
    text: |-
      De personeelsleden bedoeld in [artikel 74][ref1] moeten de Nederlandse taal kunnen lezen en schrijven, voorzover
      zulks voor een behoorlijke uitoefening van de dienst wordt vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0003083#Artikel74
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0003083
        artikel: '74'
        hoofdstuk: VI
        afdeling: I
  - number: '71.1'
    text: |-
      Op elke trein moeten ten minste een chef van de trein en een machinist dienst doen, behoudens het bepaalde in het
      vijfde lid.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel71
  - number: '71.2'
    text: De chef van de trein heeft de leiding over het overige personeel, voorzover dit op de trein dienst doet.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel71
  - number: '71.3'
    text: |-
      De chef van de trein moet, voor zover zulks door de Directie is voorgeschreven, gedurende de loop van de trein de
      treinrapporten invullen, als is aangegeven in [artikel 60][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003083#Artikel60
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0003083
        artikel: '60'
        hoofdstuk: IV
  - number: '71.4'
    text: Het bedienen van de doorgaande rem mag slechts door de machinist geschieden.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel71
  - number: '71.5'
    text: |-
      Aan de machinist kunnen - onverminderd het bepaalde in [artikel 73, tweede lid][ref1] - de werkzaamheden van chef
      van de trein worden opgedragen op - losse locomotieven,
        - goederentreinen,
        - werktreinen,
        - posttreinen,
        - treinen samengesteld uit ledig reizigersmaterieel,
        - reizigerstreinen voorzien van op afstand bediende deuren, waarvan het gesloten zijn door middel van
      cabinesignalering wordt aangegeven,
        - treinen bestemd voor het vervoer van militairen,
        - andere door de Directie aan te wijzen treinen.


      [ref1]: https://wetten.overheid.nl/BWBR0003083#Artikel73
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0003083
        artikel: '73'
        hoofdstuk: VI
        afdeling: I
  - number: '72.1'
    text: 'Met het bedienen van een krachtvoertuig mag slechts worden belast hij, die:'
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel72
  - number: 72.1.a
    text: ten minste 18 jaar is;
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel72
  - number: 72.1.b
    text: ten minste volledig basisonderwijs of een daaraan gelijkwaardige opleiding heeft genoten;
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel72
  - number: 72.1.c
    text: |-
      voldoende bewijzen heeft gegeven van praktische en theoretische bekwaamheid door het rijden van een proefrit en
      het afleggen van een examen; de exameneisen en de samenstelling van de examencommissie behoeven de instemming van
      de Directie.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel72
  - number: '72.2'
    text: |-
      Onverminderd het bepaalde in het eerste lid, mag met het bedienen van een krachtvoertuig in de rangeerdienst of van
      een trein, niet aangewezen voor reizigersvervoer, met een snelheid van niet meer dan 50 km/h slechts worden belast
      hij, die ten minste een maand onder toezicht van een ervaren machinist op een zodanig krachtvoertuig heeft dienst
      gedaan.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel72
  - number: '72.3'
    text: |-
      Onverminderd het bepaalde in het eerste lid, onder b en c, en in het vierde lid, wordt met het bedienen van een
      krachtvoertuig van treinen, opengesteld voor reizigers, slechts degene belast die ten minste een maand onder
      toezicht van een ervaren machinist een dergelijk krachtvoertuig heeft bediend.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel72
  - number: '72.4'
    text: Een machinist van een trein, opengesteld voor reizigers anders dan personeel, is ten minste 21 jaar.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel72
  - number: '72.5'
    text: |-
      Ten aanzien van het bedienen van krachtvoertuigen met een vermogen aan de wielomtrek van minder dan 110 kW kan de
      Directie ontheffing verlenen van het bepaalde in het tweede lid en, voor zover het betreft treinen niet aangewezen
      voor reizigersvervoer, van het bepaalde in het derde lid.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel72
  - number: '72.6'
    text: |-
      Ten aanzien van personeel van werkplaatsen en bedrijven van de spoorwegdienst dat voldoet aan de in het eerste lid
      gestelde eisen is het bepaalde in het tweede lid niet van toepassing voor zover het betreft het in rangeerdienst
      overbrengen van rollend materieel, bestemd voor of afkomstig van een werkplaats of bedrijf, van of naar daarvoor
      aangewezen overgavesporen.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel72
  - number: '72.7'
    text: |-
      De Minister kan ten aanzien van krachtvoertuigpersoneel dat dienst doet op door hem aan te wijzen materieel en
      baanvakken van de voorgaande leden afwijkende, of aanvullende, eisen stellen.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel72
  - number: '73.1'
    text: |-
      De Directie draagt zorg, dat het personeel, voor zover de zorgvuldige uitoefening van zijn dienst dit vordert, te
      zijner beschikking heeft de nodige gedeelten van dit reglement, van het [ARV][ref1] en van het reglement, bedoeld
      in [artikel 6 van de Spoorwegwet][ref2], alsmede de nodige gedeelten van de tijdtafel van de dienstregeling of een
      overzicht van de treinenloop ter plaatse waar het dienst doet.


      [ref1]: https://wetten.overheid.nl/BWBR0002548
      [ref2]: https://wetten.overheid.nl/BWBR0001848#Artikel6
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0002548
      - id: ref2
        bwb_id: BWBR0001848
        artikel: '6'
  - number: '73.2'
    text: |-
      Aan het personeel dat dienst doet op belangrijke posten die dienen voor de verzekering van het veilig verkeer op de
      spoorweg, noch aan machinisten gedurende de loop van de treinen waarop zij dienst doen, mag iets worden opgedragen
      of toegestaan waardoor hun aandacht zou kunnen worden afgeleid.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel73
  - number: '77'
    text: |-
      Personeel van een buitenlandse spoorwegdienst kan op de spoorweg dienst doen onder de Directie te stellen
      voorwaarden; bij deze voorwaarden kan worden afgeweken van de bepalingen van dit hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel77
  - number: '78'
    text: |-
      Personen die niet tot het personeel behoren en niet vallen onder [artikel 77][ref1] kunnen onder door de Directie
      te stellen voorwaarden:


      [ref1]: https://wetten.overheid.nl/BWBR0003083#Artikel77
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0003083
        artikel: '77'
        hoofdstuk: VI
        afdeling: I
  - number: 78.a
    text: |-
      tot de spoorweg worden toegelaten voor de bediening van het in [artikel 48][ref1] bedoelde rollend materieel;


      [ref1]: https://wetten.overheid.nl/BWBR0003083#Artikel48
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0003083
        artikel: '48'
        hoofdstuk: III
        afdeling: III
  - number: 78.b
    text: |-
      worden belast met de leiding van werkzaamheden aan de spoorweg met de daartoe behorende voorzieningen, zowel binnen
      als in de nabijheid van het profiel van vrije ruimte, bedoeld in [artikel 14][ref1], of met de zorg voor het nemen
      van veiligheidsmaatregelen bij die werkzaamheden;


      [ref1]: https://wetten.overheid.nl/BWBR0003083#Artikel14
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0003083
        artikel: '14'
        hoofdstuk: II
        afdeling: II
  - number: 78.c
    text: |-
      worden belast met de bediening en begeleiding van treinen, rangeerdelen en bijzondere voertuigen die voor de in
      onderdeel *b* bedoelde werkzaamheden worden ingezet.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel78
  - number: '93.1'
    text: |-
      De beschikkingen van de Minister, genomen krachtens artikel 75, derde lid, artikel 86, sub *b*, artikel 101,
      artikel 104, artikel 106, artikel 107, eerste lid, artikel 116, artikel 118, onderscheidenlijk artikel 118*a* van
      het Algemeen Reglement Dienst worden, voor zover zij op het tijdstip van inwerkingtreding van dit besluit geldig
      zijn, geacht te zijn genomen krachtens [artikel 61, derde lid][ref1], [artikel 83, eerste lid, sub b][ref2],
      [artikel 91][ref3], [artikel 79, tweede lid][ref4], [artikel 81][ref5], [artikel 64, eerste lid][ref6],
      [artikel 6, eerste lid][ref7], [artikel 10, eerste lid][ref8], onderscheidenlijk [artikel 8][ref9] van dit besluit.


