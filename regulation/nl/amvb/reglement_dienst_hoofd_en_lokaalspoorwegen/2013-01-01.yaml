preamble:
  text: |-
    Wij Juliana, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Op de voordracht van Onze Minister van Verkeer en Waterstaat van 16 september 1976, nr. A-1/V 27470, Directoraat-
    Generaal van het Verkeer;

    Gelet op de artikelen 27 en 33 van de Spoorwegwet, op artikel 4 van de Lokaalspoor- en Tramwegwet en op artikel II
    van de Overgangsbepalingen van de wet van 13 juli 1907 (Stb. 193);

    De Raad van State gehoord (advies van 20 oktober 1976, nr. 27);

    Gezien het nader rapport van Onze Minister van Verkeer en Waterstaat van 17 januari 1977, nr. A1/V25010,
    Directoraat-Generaal van het Verkeer;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: Dit reglement kan worden aangehaald onder de titel "Reglement dienst hoofd- en lokaalspoorwegen" of "RDHL".
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel1
  - number: '2'
    text: 'In dit reglement wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel2
  - number: 2.a
    text: 'de Minister: Onze Minister van Verkeer en Waterstaat;'
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel2
  - number: 2.b
    text: |-
      ambtenaren belast met het toezicht: de ambtenaren, bedoeld in [artikel 10 van de Spoorwegwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001848#Artikel10
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0001848
        artikel: '10'
  - number: 2.c
    text: |-
      Directie: bestuurders van een spoorwegdienst als bedoeld in [artikel 9 van de Spoorwegwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001848#Artikel9
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0001848
        artikel: '9'
  - number: 2.d
    text: |-
      personeel: hoofdbeambten, beambten en bedienden van een spoorwegdienst, als bedoeld in de [Spoorwegwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001848
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0001848
  - number: 2.e
    text: 'chef van de trein: hij, die het bevel over een trein voert;'
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel2
  - number: 2.f
    text: 'machinist: hij, die een krachtvoertuig bedient;'
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel2
  - number: 2.g
    text: 'overwegwachter: hij, die een krachtvoertuig bedient;'
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel2
  - number: 2.h
    text: 'voertuig: elk voertuig, al dan niet geleed, ingericht om op spoorstaven te rijden;'
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel2
  - number: 2.i
    text: |-
      locomotief: elk voertuig, voorzien van een eigen voortbewegingsinrichting, hoofdzakelijk bestemd om andere
      voertuigen op spoorstaven voort te bewegen en niet zelf ingericht voor het vervoer van personen, bagage, goederen,
      post of levende dieren, of een combinatie van deze voertuigen welke van één punt uit worden bediend;
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel2
  - number: 2.j
    text: |-
      treinstel: elk voertuig, voorzien van een eigen voortbewegingsinrichting met een vermogen aan de wielomtrek van
      meer dan 75 kW en ingericht voor het vervoer van personen, bagage, goederen, post of levende dieren;
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel2
  - number: 2.k
    text: 'krachtvoertuig: elke locomotief en elk treinstel;'
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel2
  - number: 2.l
    text: |-
      rijtuig: elk voertuig zonder eigen voortbewegingsinrichting, bestemd om door middel van een krachtvoertuig te
      worden voortbewogen en geheel of gedeeltelijk ingericht voor het vervoer van personen, bagage of post, alsmede elk
      ander door de Directie als zodanig aangewezen voertuig;
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel2
  - number: 2.m
    text: |-
      wagen: elk voertuig zonder eigen voortbewegingsinrichting, bestemd om door middel van een krachtvoertuig te worden
      voortbewogen en ingericht voor het vervoer van goederen, post of levende dieren, alsmede elk ander door de Directie
      als zodanig aangewezen voertuig;
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel2
  - number: 2.n
    text: 'rollend materieel: elk krachtvoertuig, elk rijtuig en elke wagen;'
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel2
  - number: 2.o
    text: |-
      bijzonder voertuig: elk voertuig, geen rollend materieel zijnde, dat op één of twee spoorstaven wordt of zal worden
      voortbewogen, dan wel zichzelf voortbeweegt of zal voortbewegen;
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel2
  - number: 2.p
    text: |-
      trein: een krachtvoertuig - indien met andere voertuigen verbonden, daarmede een geheel vormende - dat zich van
      een station naar een andere bestemming beweegt of bewegen gaat, of zich van die andere bestemming naar een station
      beweegt of bewegen gaat;
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel2
  - number: 2.q
    text: |-
      rangeerdeel: een krachtvoertuig, een rijtuig, een wagen of een aantal van deze voertuigen, aaneengesloten, geen
      trein zijnde;
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel2
  - number: 2.r
    text: |-
      station: gedeelte van de spoorweg bestemd en ingericht om treinen te doen stoppen, beginnen, eindigen, inhalen of
      kruisen en voorzien van ten minste één wissel, dat door treinen rechtstreeks in beide standen kan worden bereden,
      en tevens bestemd en ingericht om reizigers te laten in- en uitstappen en/of goederen aan te nemen en af te
      leveren; de Directie kan een zodanig gedeelte van de spoorweg, dat niet tevens is bestemd en ingericht om reizigers
      te laten in- en uitstappen en/of goederen aan te nemen en af te leveren, met een station gelijkstellen;
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel2
  - number: 2.s
    text: |-
      halte: gedeelte van de spoorweg bestemd en ingericht om reizigers te laten in- en uitstappen en/of goederen aan te
      nemen en af te leveren, niet zijnde een station;
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel2
  - number: 2.t
    text: |-
      hoofdspoor: een spoor dat in gewone omstandigheden door treinen wordt bereden, of een spoor, dat door de Directie
      als zodanig wordt aangewezen;
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel2
  - number: 2.u
    text: 'baanvak: gedeelte van de spoorweg tussen twee met name te noemen punten;'
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel2
  - number: 2.v
    text: |-
      grensdienstbaanvak: baanvak tussen de Nederlandse grens en het uiterste station, waar personeel van een
      buitenlandse spoorwegdienst treinen aan personeel van een binnenlandse spoorwegdienst mag overgeven en van dat
      personeel mag overnemen;
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel2
  - number: 2.w
    text: 'overweg: gelijkvloerse kruising van een spoorweg en een weg;'
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel2
  - number: 2.x
    text: 'overpad: overweg gelegen in een vrijliggend fietspad of voetpad;'
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel2
  - number: 2.ij
    text: 'nacht: de tijd tussen een half uur na zonsondergang en een half uur voor zonsopgang;'
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel2
  - number: 2.z
    text: |-
      goedgekeurde hogesnelheidstrein: rollend materieel dat een subsysteem vormt als bedoeld
      in [hoofdstuk IIIA van de Spoorwegwet][ref1] en waarvoor machtiging als bedoeld in
      [artikel 7 van de Spoorwegwet][ref2] is verleend of dat met toestemming van de bevoegde autoriteiten van een
      andere lidstaat van de Europese Unie of een andere staat die partij is bij de Overeenkomst betreffende de Europese
      Economische Ruimte, in gebruik is genomen;


      [ref1]: https://wetten.overheid.nl/BWBR0001848#HoofdstukIIIA
      [ref2]: https://wetten.overheid.nl/BWBR0001848#Artikel7
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0001848
        hoofdstuk: IIIA
      - id: ref2
        bwb_id: BWBR0001848
        artikel: '7'
  - number: 2.aa
    text: |-
      hogesnelheidsinfrastructuur: infrastructuur die een subsysteem vormt als bedoeld in
      [hoofdstuk IIIA van de Spoorwegwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001848#HoofdstukIIIA
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0001848
        hoofdstuk: IIIA
  - number: 2.ab
    text: |-
      RandstadRail: de ingevolge [artikel 1, eerste lid, van de Locaalspoor- en Tramwegwet][ref1] aangewezen
      locaalspoorweg Den Haag Centraal – Den Haag Laan van NOI – Zoetermeer, met de zijtak Leidschendam – Rotterdam;


      [ref1]: https://wetten.overheid.nl/BWBR0001866#Artikel1
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0001866
        artikel: '1'
  - number: 2.ac
    text: |-
      plusregio: regio als bedoeld in [artikel 104 van de Wet gemeenschappelijke regelingen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel104
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '104'
  - number: '3'
    text: 'Dit reglement is van toepassing op alle spoorwegen, met uitzondering van:'
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel3
  - number: 3.a
    text: de spoorwegen, die als tramwegen worden beschouwd;
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel3
  - number: 3.b
    text: de spoorwegen, die niet voor openbaar vervoer van personen of van goederen zijn opengesteld;
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel3
  - number: 3.c
    text: |-
      de spoorwegen, waarop geen ander vervoer plaats heeft dan personenvervoer binnen één gemeente, alsmede de daarmede
      gelijkgestelde spoorwegen of spoorweggedeelten.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel3
  - number: '4'
    text: |-
      De spoorwegen, waarop dit reglement van toepassing is en die niet ingevolge
      [artikel 1 van de Lokaalspoor- en Tramwegwet][ref1] als lokaalspoorwegen worden beschouwd of daarmede zijn
      gelijkgesteld, worden in dit reglement aangeduid als hoofdspoorwegen.


      [ref1]: https://wetten.overheid.nl/BWBR0001866#Artikel1
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0001866
        artikel: '1'
  - number: '5'
    text: |-
      De over de volle breedte van een bladzijde gedrukte bepalingen van dit reglement gelden voor hoofdspoorwegen en
      lokaalspoorwegen, die op de linkerhelft van een bladzijde alleen voor hoofdspoorwegen, die op de rechterhelft van
      een bladzijde alleen voor lokaalspoorwegen.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel5
  - number: '6.1'
    text: |-
      Ten aanzien van buitenlandse spoorwegdiensten die de dienst in Nederland uitoefenen, kan de Minister ontheffing
      verlenen of afwijkingen toestaan van de bepalingen van dit reglement.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel6
  - number: '6.2'
    text: |-
      Voor grensdienstbaanvakken kan de Minister ontheffing verlenen of afwijkingen toestaan van de bepalingen van dit
      reglement.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel6
  - number: '7.1'
    text: |-
      Voor spoorwegen of gedeelten daarvan die op openbare wegen zijn aangelegd, zijn de [artikelen 34][ref1] en
      [35 van de Spoorwegwet][ref2] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001848#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0001848#Artikel35
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0001848
        artikel: '34'
      - id: ref2
        bwb_id: BWBR0001848
        artikel: '35'
  - number: '7.2'
    text: |-
      Voor spoorwegen, uitsluitend bestemd voor het vervoer van goederen, kan de Minister ontheffen verlenen of
      afwijkingen toestaan van bepalingen van dit reglement.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel7
  - number: '7.3'
    text: |-
      Voor spoorwegen, waar de hoogste toegelaten snelheid niet meer dan 40 km/h bedraagt, kan de Minister ontheffing
      verlenen of afwijkingen toestaan van de bepalingen van dit reglement.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel7
  - number: '8'
    text: |-
      Voor proefnemingen met betrekking tot het gebruik, de inspectie, het onderhoud alsmede de inrichting en de
      bediening van het rollend materieel en het gebruik, de inspectie en het onderhoud van technische systemen en
      hulpmiddelen voor de uitoefening van de dienst op de spoorweg, kan de Minister voor een door hem te bepalen termijn
      ontheffing verlenen of afwijkingen toestaan van bepalingen van dit reglement.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel8
  - number: '9.1'
    text: |-
      Waar in dit reglement aan de Minister de bevoegdheid is toegekend ontheffing te verlenen of afwijking toe te staan
      van bepalingen van dit reglement, kunnen aan die ontheffing of afwijking voorwaarden worden verbonden.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel9
  - number: '9.2'
    text: |-
      Het niet naleven van de gestelde voorwaarden staat gelijk met overtreding van de bepalingen, waarvan ontheffing
      werd verleend of afwijking werd toegestaan.
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel9
  - number: '10.1'
    text: |-
      De Minister kan ter zake van de in de [artikelen 11, zesde lid][ref1], [13, derde lid][ref2],
