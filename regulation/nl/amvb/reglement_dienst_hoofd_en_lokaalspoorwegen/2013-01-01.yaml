        afdeling: II
  - number: '93.3'
    text: |-
      De beschikkingen van de Minister, genomen krachtens artikel 2, eerste respectievelijk tweede lid,
      artikel 10, eerste respectievelijk vijfde lid, onderscheidenlijk artikel 21 van het Algemeen Reglement
      Dienst Locaalspoorwegen, worden, voor zover zij op het tijdstip van inwerkingtreding van dit besluit
      geldig zijn, geacht te zijn genomen krachtens [artikel 18, tweede respectievelijk vierde lid][ref1],
      [artikel 54, eerste respectievelijk zevende lid][ref2], onderscheidenlijk [artikel 7, tweede lid][ref3], van dit
      besluit.


