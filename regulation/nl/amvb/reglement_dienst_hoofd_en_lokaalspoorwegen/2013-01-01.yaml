  - number: '93.2'
    text: |-
      Vergunningen, verleend door of namens de Minister krachtens artikel 15 van het Algemeen Reglement Dienst, worden,
      voor zover zij op het tijdstip van inwerkingtreding van dit besluit geldig zijn, geacht te zijn verleend krachtens
      [artikel 15][ref1] van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0003083#Artikel15
    url: https://wetten.overheid.nl/BWBR0003083/2013-01-01#Artikel93
