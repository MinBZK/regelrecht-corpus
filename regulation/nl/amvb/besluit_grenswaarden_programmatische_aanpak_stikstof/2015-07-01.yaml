articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder: - *depositieruimte voor grenswaarden:* hoeveelheid stikstofdepositie die
      in het kader van het programma voor een hectare van een voor stikstof gevoelig habitat in een Natura 2000-gebied
      beschikbaar is voor projecten of andere handelingen als bedoeld in [artikel 19kh, zevende lid, van de wet][ref1];
        - *wet:* [Natuurbeschermingswet 1998][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel19kh
      [ref2]: https://wetten.overheid.nl/BWBR0009641
    url: https://wetten.overheid.nl/BWBR0036689/2015-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009641
        artikel: 19kh
      - id: ref2
        bwb_id: BWBR0009641
  - number: '2.1'
    text: |-
      De waarde, bedoeld in [artikel 19kh, zevende lid, onderdeel a, onder 1°, van de wet][ref1], is 1 mol per hectare
      per jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel19kh
    url: https://wetten.overheid.nl/BWBR0036689/2015-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0009641
        artikel: 19kh
  - number: '2.2'
    text: |-
      De afstand, bedoeld in [artikel 19kh, zevende lid, onderdeel a, onder 2°, van de wet][ref1], is voor projecten en
      andere handelingen als bedoeld in [artikel 19kn, eerste lid, van de wet][ref2] ten aanzien van:


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel19kh
      [ref2]: https://wetten.overheid.nl/BWBR0009641#Artikel19kn
    url: https://wetten.overheid.nl/BWBR0036689/2015-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0009641
        artikel: 19kh
      - id: ref2
        bwb_id: BWBR0009641
        artikel: 19kn
  - number: 2.2.a
    text: |-
      een hoofdweg als bedoeld in [artikel 1 van de Tracéwet][ref1]: 3 kilometer, gemeten vanaf het midden van de
      rijbaan;


      [ref1]: https://wetten.overheid.nl/BWBR0006147#Artikel1
    url: https://wetten.overheid.nl/BWBR0036689/2015-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006147
        artikel: '1'
  - number: 2.2.b
    text: |-
      een hoofdvaarweg als bedoeld in [artikel 1 van de Tracéwet][ref1], indien zij geheel of gedeeltelijk betrekking
      hebben op de scheepvaartfunctie van de hoofdvaarweg: 5 kilometer, gemeten vanaf het midden van de vaarweg.


      [ref1]: https://wetten.overheid.nl/BWBR0006147#Artikel1
    url: https://wetten.overheid.nl/BWBR0036689/2015-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006147
        artikel: '1'
  - number: '2.3'
    text: |-
      In afwijking van het eerste lid is de waarde, bedoeld in
      [artikel 19kh, zevende lid, onderdeel a, onder 1°, van de wet][ref1], voor een project of andere handeling, niet
      zijnde een project of andere handeling als bedoeld in [artikel 19kn, eerste lid, van de wet][ref2], 0,05 mol per
      hectare per jaar, zolang uit het krachtens [artikel 19kb][ref3] voorgeschreven rekenmodel blijkt dat ten aanzien
      van een hectare van een voor stikstof gevoelige habitat in het desbetreffende Natura 2000-gebied 5% of minder van
      de depositieruimte voor grenswaarden beschikbaar is.


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel19kh
      [ref2]: https://wetten.overheid.nl/BWBR0009641#Artikel19kn
      [ref3]: https://wetten.overheid.nl/BWBR0009641#Artikel19kb
    url: https://wetten.overheid.nl/BWBR0036689/2015-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0009641
        artikel: 19kh
      - id: ref2
        bwb_id: BWBR0009641
        artikel: 19kn
      - id: ref3
        bwb_id: BWBR0009641
        artikel: 19kb
  - number: '2.4'
    text: |-
      Ingeval het derde lid van toepassing is, en zodra het derde lid, nadat het van toepassing is geworden, niet langer
      van toepassing is, doet Onze Minister hiervan mededeling in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0036689/2015-07-01#Artikel2
  - number: '2.5'
    text: |-
      Het derde lid is niet van toepassing ten aanzien van projecten en andere handelingen voor zover deze
      stikstofdepositie veroorzaken op Natura 2000-gebieden die niet in het programma zijn opgenomen.
    url: https://wetten.overheid.nl/BWBR0036689/2015-07-01#Artikel2
  - number: '3'
    text: Dit besluit treedt in werking op 1 juli 2015.
    url: https://wetten.overheid.nl/BWBR0036689/2015-07-01#Artikel3
  - number: '4'
    text: 'Dit besluit wordt aangehaald als: Besluit grenswaarden programmatische aanpak stikstof.'
    url: https://wetten.overheid.nl/BWBR0036689/2015-07-01#Artikel4
