  - number: G-1
    text: |-
      In afwijking van de wet voor wat betreft artikel 3, eerste lid, gelden de bepalingen van deze paragraaf in
      die gevallen waarin een school wordt gesplitst, behoudens voor zover de splitsing geschiedt met het oog op een
      onmiddellijk op de splitsing volgende samenvoeging als bedoeld in [Paragraaf F][ref1] van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0003710#ParagraafF
    url: https://wetten.overheid.nl/BWBR0003710/2014-01-01#ArtikelG-1
    references:
      - id: ref1
        bwb_id: BWBR0003710
        paragraaf: F
  - number: G-2
    text: |-
      1 In een geval als bedoeld in [artikel G-1][ref1] geldt het aan de school vastgestelde medezeggenschapsreglement
      vanaf het moment van splitsing als krachtens artikel 3, eerste lid, van de wet te zijn vastgesteld aan elk van
      de uit de splitsing ontstane scholen afzonderlijk, met uitzondering van de bepalingen ten aanzien waarvan het
      bevoegd gezag en de medezeggenschapsraad van de te splitsen school, gezien de veranderingen in de feitelijke
      situatie, gezamenlijk constateren dat zij niet kunnen werken in de situatie na de splitsing. Het bevoegd gezag
      en de medezeggenschapsraad van de te splitsen school treffen gezamenlijk een voorziening met betrekking tot de
      uitoefening van de in de wet en het reglement neergelegde medezeggenschapsbevoegdheden in de periode tot aan de
      verkiezing van de in het derde lid bedoelde medezeggenschapsraad.

      2 Indien het in het eerste lid bedoelde reglement bepalingen bevat die met het oog op de situatie na de splitsing
      wijziging behoeven, legt het bevoegd gezag tijdig voor de splitsing aan de medezeggenschapsraad een voorstel voor
      tot wijziging van de bedoelde bepalingen.

      3 Binnen drie maanden na de splitsing wordt een medezeggenschapsraad gekozen aan elk van de uit de splitsing
      ontstane scholen.


      [ref1]: https://wetten.overheid.nl/BWBR0003710#ArtikelG-1
    url: https://wetten.overheid.nl/BWBR0003710/2014-01-01#ArtikelG-2
    references:
      - id: ref1
        bwb_id: BWBR0003710
        artikel: G-1
        paragraaf: G
  - number: H-1
    text: |-
      1 In afwijking van de wet voor wat betreft de artikelen 3, eerste lid, 4 en 6, eerste lid, gelden de bepalingen van
      deze paragraaf in geval van omzetting van scholen.

      2 Voor de toepassing van deze paragraaf wordt onder omzetting van scholen verstaan, de opheffing van een openbare,
      respectievelijk bijzondere school, onder aansluitende oprichting van een bijzondere, respectievelijk openbare
      school die daarvoor in de plaats komt.

      3 Deze paragraaf is niet van toepassing op een omzetting, onmiddellijk voorafgaand aan een samenvoeging als bedoeld
      in [Paragraaf F][ref1] van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0003710#ParagraafF
    url: https://wetten.overheid.nl/BWBR0003710/2014-01-01#ArtikelH-1
    references:
      - id: ref1
        bwb_id: BWBR0003710
        paragraaf: F
  - number: H-2
    text: |-
      1 In een geval als bedoeld in [artikel H-1][ref1] geldt de medezeggenschapsraad van de opgeheven school als
      krachtens artikel 4, eerste lid, van de wet, vanaf het moment van oprichting van de nieuwe school te zijn gekozen
      aan laatstbedoelde school.

      2 Het reglement van de opgeheven school geldt als krachtens artikel 3, eerste lid, van de wet, op het moment van
      oprichting van de nieuwe school te zijn vastgesteld aan laatstbedoelde school, behoudens voor zover dit reglement
      bepalingen bevat die direct het karakter van de door de omzetting opgerichte school betreffen en het bevoegd
      gezag, gezien de met de omzetting gepaard gaande karakterverandering van de school, overneming van die bepalingen
      onaanvaardbaar acht. Na de oprichting van de nieuwe school legt het bevoegd gezag onverwijld een voorstel aan de
      medezeggenschapsraad voor tot aanpassing van de in de vorige volzin bedoelde bepalingen aan de nieuwe situatie.


      [ref1]: https://wetten.overheid.nl/BWBR0003710#ArtikelH-1
    url: https://wetten.overheid.nl/BWBR0003710/2014-01-01#ArtikelH-2
    references:
      - id: ref1
        bwb_id: BWBR0003710
        artikel: H-1
        paragraaf: H
  - number: I-1
    text: |-
      In afwijking van de wet voor wat betreft de artikelen 6, eerste lid, en 7, gelden de bepalingen van deze paragraaf
      in gevallen waarin aan een school besluiten worden genomen met betrekking tot het volgende schooljaar, terwijl dan
      een of meer andere scholen zullen zijn ontstaan ten gevolge van samenvoeging, splitsing of omzetting als bedoeld
      in de [Paragrafen F tot en met H][ref1], of ten gevolge van de overgang van de school in een school van een nieuwe
      onderwijsvorm.


      [ref1]: https://wetten.overheid.nl/BWBR0003710#ParagraafF
    url: https://wetten.overheid.nl/BWBR0003710/2014-01-01#ArtikelI-1
    references:
      - id: ref1
        bwb_id: BWBR0003710
        paragraaf: F
  - number: I-2
    text: |-
      In een geval als bedoeld in [artikel I-1][ref1] zijn de reglementen van de betrokken medezeggenschapsraad
      of medezeggenschapsraden wat de daarin neergelegde bevoegdheden als bedoeld in artikel 6, eerste lid, van
      de wet betreft, van overeenkomstige toepassing op voorgenomen besluiten ten aanzien van aangelegenheden als
      bedoeld in artikel 7 van de wet, die betrekking hebben op de situatie na de samenvoeging, splitsing, omzetting
      onderscheidenlijk overgang.


      [ref1]: https://wetten.overheid.nl/BWBR0003710#ArtikelI-1
    url: https://wetten.overheid.nl/BWBR0003710/2014-01-01#ArtikelI-2
    references:
      - id: ref1
        bwb_id: BWBR0003710
        artikel: I-1
        paragraaf: I
  - number: J-1
    text: |-
      In afwijking van de wet voor wat betreft de artikelen 4, tweede, zevende en tiende lid, 13, en 24, tweede lid,
      gelden de bepalingen van deze paragraaf voor scholen voor hoger beroepsonderwijs, totdat de Wet op het hoger
      beroepsonderwijs (*Stb.* 1985, 80) wat de regeling van de medezeggenschap betreft in werking is getreden.
    url: https://wetten.overheid.nl/BWBR0003710/2014-01-01#ArtikelJ-1
  - number: J-2
    text: |-
      1 Het aantal leden van de medezeggenschapsraad bedraagt aan een school met minder dan 750 leden ten hoogste 10
      leden.

      2 Het aantal leden van de voorlopige medezeggenschapsraad bedraagt aan een school met minder dan 750 leden 8 leden.
    url: https://wetten.overheid.nl/BWBR0003710/2014-01-01#ArtikelJ-2
  - number: J-3
    text: |-
      1 Een daartoe door de schoolleiding uit haar midden aangewezen lid heeft, met adviserende stem, mede zitting in de
      raad, indien het niet tot lid daarvan is gekozen.

      2 Een lid van de schoolleiding, door het bevoegd gezag aangewezen om namens dat gezag de besprekingen met de
      raad te voeren, bedoeld in artikel 5, eerste lid, van de wet, kan niet tevens lid zijn van de raad, indien het
      medezeggenschapsreglement bepaalt dat het tot zijn taak behoort om deze besprekingen te voeren.
    url: https://wetten.overheid.nl/BWBR0003710/2014-01-01#ArtikelJ-3
  - number: J-4
    text: |-
      1 Een deelraad wordt in ieder geval ingesteld indien de medezeggenschapsraad dit wenst.

      2 [Artikel 4, tweede tot en met zesde, negende en twaalfde lid van de wet][ref1], zijn van overeenkomstige
      toepassing op een deelraad.

      3 Volgens regels, vastgesteld in het medezeggenschapsreglement, kan de medezeggenschapsraad een bevoegdheid als
      bedoeld in [artikel 6, eerste lid, onder a, b, c en j, van de wet][ref2] overdragen aan een deelraad, voor zover
      het betreft een aangelegenheid die het desbetreffende deel van de school in het bijzonder aangaat.


      [ref1]: https://wetten.overheid.nl/BWBR0005746#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005746#Artikel6
    url: https://wetten.overheid.nl/BWBR0003710/2014-01-01#ArtikelJ-4
    references:
      - id: ref1
        bwb_id: BWBR0005746
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0005746
        artikel: '6'
  - number: K-1
    text: |-
      In afwijking van de wet voor wat betreft artikel 4, vijfde lid onder *c*, gelden de bepalingen van deze paragraaf
      voor scholengemeenschappen voor middelbaar en hoger beroepsonderwijs.
    url: https://wetten.overheid.nl/BWBR0003710/2014-01-01#ArtikelK-1
  - number: K-2
    text: |-
      In een geval als bedoeld in [artikel K-1][ref1] wordt het deel van de medezeggenschapsraad, bedoeld in artikel 4,
      derde lid onder *b*, van de wet, gekozen uit en door de leerlingen, indien dit overeenstemt met de wens van ten
      minste twee derden van de ouders van de leerlingen, bedoeld in artikel 4, vijfde lid onder *c*, van de wet.


      [ref1]: https://wetten.overheid.nl/BWBR0003710#ArtikelK-1
    url: https://wetten.overheid.nl/BWBR0003710/2014-01-01#ArtikelK-2
    references:
      - id: ref1
        bwb_id: BWBR0003710
        artikel: K-1
        paragraaf: K
  - number: K-3
    text: |-
      Het bepaalde in [artikel K-2][ref1] is van overeenkomstige toepassing op de voorlopige medezeggenschapsraad.


      [ref1]: https://wetten.overheid.nl/BWBR0003710#ArtikelK-2
    url: https://wetten.overheid.nl/BWBR0003710/2014-01-01#ArtikelK-3
    references:
      - id: ref1
        bwb_id: BWBR0003710
        artikel: K-2
        paragraaf: K
  - number: M-1
    text: |-
      In afwijking van de wet voor wat betreft artikel 3, vijfde lid onder *b*, gelden de bepalingen van deze paragraaf
      voor scholen voor voortgezet speciaal onderwijs en scholen of instellingen voor speciaal en voortgezet speciaal
      onderwijs als bedoeld in [artikel 8, eerste lid, van de Wet op de expertisecentra][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel8
    url: https://wetten.overheid.nl/BWBR0003710/2014-01-01#ArtikelM-1
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '8'
  - number: M-2
    text: |-
      Het deel van de medezeggenschapsraad, bedoeld in artikel 3, derde lid onder *b*, van de wet wordt aan een school
      voor voortgezet speciaal onderwijs gekozen uit en door de ouders dan wel deels uit en door de leerlingen, en aan
      een school of instelling voor speciaal en voortgezet speciaal onderwijs uit en door de ouders dan wel deels uit en
      door de ouders en deels uit en door de leerlingen die zijn toegelaten tot het voortgezet speciaal onderwijs.
    url: https://wetten.overheid.nl/BWBR0003710/2014-01-01#ArtikelM-2
  - number: M-3
    text: |-
      Het bepaalde in [artikel M-2][ref1] is van overeenkomstige toepassing op de voorlopige medezeggenschapsraad.


      [ref1]: https://wetten.overheid.nl/BWBR0003710#ArtikelM-2
    url: https://wetten.overheid.nl/BWBR0003710/2014-01-01#ArtikelM-3
    references:
      - id: ref1
        bwb_id: BWBR0003710
        artikel: M-2
        paragraaf: M
  - number: M-4
    text: |-
      Tot en met 31 juli 1985 gelden de bepalingen van deze paragraaf voor scholen voor voortgezet buitengewoon onderwijs
      als bedoeld in artikel 6, eerste lid, van het Besluit buitengewoon onderwijs 1967 (*Stb.* 1978, 582).
    url: https://wetten.overheid.nl/BWBR0003710/2014-01-01#ArtikelM-4
  - number: N-1
    text: |-
      Ten aanzien van de aangewezen scholen, bedoeld in de Regeling m.b.o. 1990-1991 (kenmerk WJZ 90031766/3473, *Uitleg
      OenW-Regelingen* 1990, 18*a* extra van 4 juli 1990), geldt tot 1 augustus 1991 dat de bepalingen, opgenomen in het
      medezeggenschapsreglement ingevolge de toepassing van artikel 6, eerste lid, onderdeel *a* dan wel *b*, van de wet,
      niet van toepassing zijn voor zover het betreft aangelegenheden waarover overleg wordt gevoerd in het georganiseerd
      overleg op instellingsniveau als bedoeld in genoemde regeling.
    url: https://wetten.overheid.nl/BWBR0003710/2014-01-01#ArtikelN-1
  - number: Z-1
    text: |-
      Indien bijzondere omstandigheden een goede toepassing van een of meer van de onderdelen van dit besluit in een
      school of in een aantal scholen die door hetzelfde bevoegd gezag in stand worden gehouden, in de weg staan, kan
      Onze minister op verzoek van het bevoegd gezag toestaan, dat voor wat betreft een of meer onderdelen op door hem
      aangegeven wijze wordt afgeweken van het bepaalde in dit besluit.
    url: https://wetten.overheid.nl/BWBR0003710/2014-01-01#ArtikelZ-1
  - number: Z-2
    text: Dit besluit kan worden aangehaald als "Besluit medezeggenschap onderwijs".
    url: https://wetten.overheid.nl/BWBR0003710/2014-01-01#ArtikelZ-2
  - number: Z-3
    text: |-
      Dit besluit treedt in werking met ingang van de tweede dag na de datum van uitgifte van het *Staatsblad* waarin het
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0003710/2014-01-01#ArtikelZ-3
