  - number: C-1
    text: |-
      In afwijking van de wet voor wat betreft artikel 4, eerste en zevende lid, gelden de bepalingen van deze paragraaf
      in die gevallen, waarin een of meer scholen voor kleuteronderwijs en een of meer scholen voor gewoon lager
      onderwijs door hetzelfde bevoegd gezag in stand worden gehouden en samenwerken, of zullen gaan samenwerken met het
      oog op de vorming van een school voor basisonderwijs als bedoeld in de [Wet op het basisonderwijs][ref1]

      (*Stb.* 1984, 2).


      [ref1]: https://wetten.overheid.nl/BWBR0003420
    url: https://wetten.overheid.nl/BWBR0003710/2014-01-01#ArtikelC-1
    references:
      - id: ref1
        bwb_id: BWBR0003420
  - number: C-2
    text: |-
      1 In een geval als bedoeld in [artikel C-1][ref1] kan het bevoegd gezag een medezeggenschapsraad instellen voor de
      groep van scholen, indien dit overeenstemt met de wens van ten minste twee derden zowel van het personeel van elk
      van de desbetreffende scholen als van de ouders van de leerlingen van elk van de desbetreffende scholen.

      2 Bij de berekening van het aantal leden van de medezeggenschapsraad wordt uitgegaan van het gezamenlijk aantal
      leerlingen van de desbetreffende scholen, met dien verstande dat het aantal leden in elk geval het dubbele van het
      aantal scholen bedraagt.

      3 In elk van de delen van de medezeggenschapsraad, die ingevolge artikel 4, derde lid onder *a* en *b*, van de wet
      worden gekozen, wordt ten minste een lid uit elk van de desbetreffende scholen gekozen.

      4 De schoolleider van elk van de desbetreffende scholen heeft, met adviserende stem, mede zitting in de
      medezeggenschapsraad, indien hij niet tot lid daarvan is gekozen.


      [ref1]: https://wetten.overheid.nl/BWBR0003710#ArtikelC-1
    url: https://wetten.overheid.nl/BWBR0003710/2014-01-01#ArtikelC-2
    references:
