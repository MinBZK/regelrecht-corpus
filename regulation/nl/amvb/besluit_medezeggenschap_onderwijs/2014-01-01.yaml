  - number: F-5
    text: |-
      Het bevoegd gezag kan in overeenstemming met de medezeggenschapsraden van de samen te voegen scholen besluiten,
      geen toepassing te geven aan het bepaalde in [artikel F-2][ref1], [F-3][ref2] onderscheidenlijk [F-4][ref3]. Alsdan
      wordt binnen drie maanden na de samenvoeging een voorlopige medezeggenschapsraad gekozen aan de nieuwe school en
      legt het bevoegd gezag onverwijld daarna een medezeggenschapsreglement als voorstel aan deze raad voor. Vervolgens
      spreekt de voorlopige raad zich, na overleg met het bevoegd gezag, binnen drie maanden over het voorstel uit.


      [ref1]: https://wetten.overheid.nl/BWBR0003710#ArtikelF-2
      [ref2]: https://wetten.overheid.nl/BWBR0003710#ArtikelF-3
      [ref3]: https://wetten.overheid.nl/BWBR0003710#ArtikelF-4
