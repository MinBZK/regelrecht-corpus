  - number: B-1
    text: |-
      In afwijking van de wet voor wat betreft de artikelen 4, tweede, derde en tiende lid, en 24, tweede lid, gelden de
      bepalingen van deze paragraaf voor die scholen voor kleuteronderwijs en die scholen voor gewoon lager onderwijs,
      waar de schoolleider de enige aan de school verbonden leidster onderscheidenlijk onderwijzer is.
    url: https://wetten.overheid.nl/BWBR0003710/2014-01-01#ArtikelB-1
  - number: B-2
    text: |-
      1 Het aantal leden van de medezeggenschapsraad bedraagt aan een school als bedoeld in [artikel B-1][ref1] ten
      hoogste 3 leden.

      2 De medezeggenschapsraad bestaat uit:

      a. de schoolleider;

      b. een lid dat uit en door de ouders wordt gekozen; en indien het medezeggenschapsreglement dit bepaalt, uit

      c. een lid dat wordt gekozen overeenkomstig het bepaalde in artikel 4, zesde lid, van de wet.

      3 Het medezeggenschapsreglement kan niet bepalen dat het tot de taak van de schoolleider behoort om namens het
      bevoegd gezag de besprekingen met de medezeggenschapsraad te voeren, bedoeld in artikel 5, eerste lid, van de wet.


      [ref1]: https://wetten.overheid.nl/BWBR0003710#ArtikelB-1
    url: https://wetten.overheid.nl/BWBR0003710/2014-01-01#ArtikelB-2
    references:
      - id: ref1
        bwb_id: BWBR0003710
        artikel: B-1
        paragraaf: B
  - number: B-3
    text: |-
      De voorlopige medezeggenschapsraad aan een school als bedoeld in [artikel B-1][ref1] bestaat uit de schoolleider en
      een lid dat uit en door de ouders wordt gekozen.


      [ref1]: https://wetten.overheid.nl/BWBR0003710#ArtikelB-1
    url: https://wetten.overheid.nl/BWBR0003710/2014-01-01#ArtikelB-3
    references:
      - id: ref1
        bwb_id: BWBR0003710
        artikel: B-1
        paragraaf: B
  - number: B-4
    text: |-
      Indien op het moment van inwerkingtreding van dit besluit aan een school als bedoeld in [artikel B-1][ref1] geen
      medezeggenschapsraad of voorlopige medezeggenschapsraad is verbonden in overeenstemming met het bepaalde in de
      [artikelen B-2][ref2] en [B-3][ref3], wordt binnen drie maanden een voorlopige medezeggenschapsraad gekozen.


      [ref1]: https://wetten.overheid.nl/BWBR0003710#ArtikelB-1
