    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Onderwijs en Wetenschappen, drs. G. van Leijenhorst, mede namens Onze
    Minister van Landbouw en Visserij van 1 mei 1984, nr. 5171/1156, centrale directie Wetgeving en Juridische Zaken;

    Gelet op artikel 17, tweede lid, van de Wet medezeggenschap onderwijs (Stb. 1981, 778);

    De Onderwijsraad gehoord (advies van 15 juli 1983, O.R. 544 Alg.);

    De Raad van State gehoord (advies van 20 juli 1984, no. W05.84.0261/14.4.28);

    Gezien het nader rapport van de Staatssecretaris van Onderwijs en Wetenschappen, drs. G. van Leijenhorst, mede
    namens Onze Minister van Landbouw en Visserij, van 24 augustus 1984, nr. 5535/1156, centrale directie Wetgeving en
    Juridische Zaken;

    Hebben goedgevonden en verstaan:
