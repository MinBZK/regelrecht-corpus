  - number: E-1
    text: |-
      In afwijking van de wet voor wat betreft artikel 4, eerste en achtste lid, gelden de bepalingen van deze paragraaf
      voor die gevallen, waarin meer cursussen voor voortgezet onderwijs, die geen organisatorische eenheid vormen,
      door hetzelfde bevoegd gezag in stand worden gehouden, dan wel een bevoegd gezag een school en een of meer daaraan
      verbonden cursussen in stand houdt.
    url: https://wetten.overheid.nl/BWBR0003710/2014-01-01#ArtikelE-1
  - number: E-2
    text: |-
      1 In een geval als bedoeld in [artikel E-1][ref1] kan het bevoegd gezag een medezeggenschapsraad instellen voor een
      of meer groepen van cursussen en, onderscheidenlijk of, voor een of meer cursussen afzonderlijk, dan wel voor een
      groep van een school en een of meer cursussen.

      2 Indien het bevoegd gezag een medezeggenschapsraad instelt voor een groep van cursussen, dan wel voor een groep
      van een school en een of meer cursussen, wordt bij de berekening van het aantal leden van de medezeggenschapsraad
      uitgegaan van het gezamenlijk aantal leerlingen van de desbetreffende cursussen, onderscheidenlijk school en cursus
      dan wel cursussen.

      3 Indien het bevoegd gezag een medezeggenschapsraad instelt voor een groep van cursussen, dan wel voor een groep
      van een school en een of meer cursussen kan de verkiezing van de leden van de medezeggenschapsraad plaatsvinden
      volgens een stelsel, waarin de desbetreffende cursussen, onderscheidenlijk school en cursus dan wel cursussen
      evenredig zijn vertegenwoordigd.


      [ref1]: https://wetten.overheid.nl/BWBR0003710#ArtikelE-1
    url: https://wetten.overheid.nl/BWBR0003710/2014-01-01#ArtikelE-2
    references:
