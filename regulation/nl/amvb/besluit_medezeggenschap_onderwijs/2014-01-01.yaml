  - number: D-1
    text: |-
      In afwijking van de wet voor wat betreft de artikelen 4, tweede tot en met zesde lid, en 24, tweede lid, gelden de
      bepalingen van deze paragraaf voor die cursussen voor voortgezet onderwijs, waarvan de cursusduur minder dan één
      jaar bedraagt en waaraan per leerling per week gedurende minder dan 7 lesuren onderwijs wordt gegeven.
    url: https://wetten.overheid.nl/BWBR0003710/2014-01-01#ArtikelD-1
  - number: D-2
    text: |-
      1 Het aantal leden van de medezeggenschapsraad bedraagt aan een cursus als bedoeld in [artikel D-1][ref1] met
      minder dan 250 leerlingen ten hoogste 3 leden, met 250 tot 750 leerlingen ten hoogste 5 leden, met 750 tot 1250
      leerlingen ten hoogste 7 leden en met 1250 of meer leerlingen ten hoogste 9 leden.

      2 De medezeggenschapsraad bestaat uit leden die uit en door het personeel worden gekozen.


      [ref1]: https://wetten.overheid.nl/BWBR0003710#ArtikelD-1
    url: https://wetten.overheid.nl/BWBR0003710/2014-01-01#ArtikelD-2
    references:
      - id: ref1
