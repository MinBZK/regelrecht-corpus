  - number: F-1
    text: |-
      1 In afwijking van de wet voor wat betreft de artikelen 3, eerste lid, 4, tweede lid, en 24, eerste, tweede, vierde
      en vijfde lid, eerste en tweede volzin, gelden de bepalingen van deze paragraaf in die gevallen waarin een school
      ontstaat uit samenvoeging van twee of meer scholen.

      2 Onder samenvoeging wordt voor de toepassing van deze paragraaf verstaan:

      a. opheffing van twee of meer gelijksoortige scholen en de gelijktijdige oprichting van een school die feitelijk de
      voortzetting is van de gezamenlijke opgeheven scholen;

      b. opheffing van een of meer scholen waarbij deze school of scholen feitelijk opgaan in een andere, gelijksoortige
      school;

      c. vereniging van twee of meer scholen in een scholengemeenschap als bedoeld in
      [artikel 19 van de Wet op het voortgezet onderwijs][ref1];

      d. samenbrenging van scholen in een onderwijsgemeenschap als bedoeld in artikel 25, vierde lid, van het Besluit
      proefprojecten nieuw vervolg/beroepsonderwijs (*Stb.* 1980, 283) en artikel 23, vierde lid, van het Besluit
      proefprojecten deeltijd vervolg/beroepsonderwijs (*Stb.* 1983, 128);

      e. oprichting van een school door omvorming als bedoeld in artikel 31 van het Besluit proefprojecten deeltijd
      vervolg/beroepsonderwijs;

      f. gezamenlijke overgang van scholen in een school van een nieuwe onderwijsvorm.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel19
    url: https://wetten.overheid.nl/BWBR0003710/2014-01-01#ArtikelF-1
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '19'
  - number: F-2
    text: |-
      In het geval dat aan de samen te voegen scholen met toepassing van artikel 17, eerste dan wel tweede lid, van
      de wet een gezamenlijke medezeggenschapsraad is gekozen, geldt deze raad vanaf de samenvoeging als krachtens
      artikel 4 van de wet te zijn gekozen aan de nieuwe school. Het medezeggenschapsreglement van de scholen geldt
      vanaf de samenvoeging als krachtens artikel 3, eerste lid, van de wet te zijn vastgesteld aan de nieuwe school,
      met uitzondering van de bepalingen ten aanzien waarvan het bevoegd gezag en de gezamenlijke medezeggenschapsraad,
      gezien de veranderingen in de feitelijke situatie, gezamenlijk constateren dat zij niet kunnen werken in de
      situatie na de samenvoeging. Indien is geconstateerd dat een of meer bepalingen van het medezeggenschapsreglement
      niet kunnen werken in de situatie na de samenvoeging, en het bevoegd gezag van oordeel is dat het
      medezeggenschapsreglement om die reden aanpassing behoeft, legt het bevoegd gezag na de samenvoeging onverwijld een
      wijziging van het medezeggenschapsreglement als voorstel aan de medezeggenschapsraad voor.
    url: https://wetten.overheid.nl/BWBR0003710/2014-01-01#ArtikelF-2
  - number: F-3
    text: |-
      In het geval dat scholen met gelijkluidende medezeggenschapsreglementen worden samengevoegd, geldt vanaf de
      samenvoeging als krachtens artikel 4 van de wet aan de nieuwe school te zijn gekozen een medezeggenschapsraad,
      samengesteld uit de leden van de medezeggenschapsraden van deze scholen. De aldus samengestelde raad
      is aan de nieuwe school verbonden totaan de verkiezing van de medezeggenschapsraad van deze school. De
      medezeggenschapsreglementen van de scholen gelden vanaf de samenvoeging als het krachtens artikel 3, eerste
      lid, van de wet aan de nieuwe school vastgestelde medezeggenschapsreglement, met uitzondering van de bepalingen
      ten aanzien waarvan het bevoegd gezag en de medezeggenschapsraden van de samen te voegen scholen, gezien de
      veranderingen in de feitelijke situatie, gezamenlijk constateren dat zij niet kunnen werken in de situatie na de
      samenvoeging. Indien is geconstateerd dat een of meer bepalingen van het medezeggenschapsreglement niet kunnen
      werken in de situatie na de samenvoeging, en het bevoegd gezag van oordeel is dat het medezeggenschapsreglement
      om die reden aanpassing behoeft, legt het bevoegd gezag na de samenvoeging onverwijld een wijziging van het
      medezeggenschapsreglement als voorstel aan de medezeggenschapsraad voor.
    url: https://wetten.overheid.nl/BWBR0003710/2014-01-01#ArtikelF-3
  - number: F-4
    text: |-
      In andere gevallen van samenvoeging dan die, bedoeld in de [artikelen F-2][ref1] en [F-3][ref2], geldt vanaf de
      samenvoeging als krachtens artikel 24, eerste lid, van de wet aan de nieuwe school te zijn gekozen een voorlopige
      medezeggenschapsraad, samengesteld uit de leden van de raden van de samengevoegde scholen. Na de samenvoeging legt
      het bevoegd gezag onverwijld een medezeggenschapsreglement als voorstel aan de voorlopige raad voor. Vervolgens
      spreekt de voorlopige raad zich, na overleg met het bevoegd gezag, binnen drie maanden over het voorstel uit.


      [ref1]: https://wetten.overheid.nl/BWBR0003710#ArtikelF-2
      [ref2]: https://wetten.overheid.nl/BWBR0003710#ArtikelF-3
    url: https://wetten.overheid.nl/BWBR0003710/2014-01-01#ArtikelF-4
    references:
