        artikel: E-1
        paragraaf: E
  - number: E-3
    text: |-
      [Artikel E-2][ref1] is van overeenkomstige toepassing op de voorlopige medezeggenschapsraad.


      [ref1]: https://wetten.overheid.nl/BWBR0003710#ArtikelE-2
