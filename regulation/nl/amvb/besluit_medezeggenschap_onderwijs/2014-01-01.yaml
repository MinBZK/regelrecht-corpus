        artikel: D-1
        paragraaf: D
  - number: D-3
    text: |-
      Het aantal leden van de voorlopige medezeggenschapsraad bedraagt aan een cursus als bedoeld in [artikel D-1][ref1]
      met minder dan 250 leerlingen 2 leden, met 250 tot 750 leerlingen 4 leden, met 750 tot 1250 leerlingen 6 leden en
      met 1250 of meer leerlingen 8 leden. [Artikel D-2, tweede lid][ref2] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003710#ArtikelD-1
      [ref2]: https://wetten.overheid.nl/BWBR0003710#ArtikelD-2
