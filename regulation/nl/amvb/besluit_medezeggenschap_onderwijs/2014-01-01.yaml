articles:
  - number: A-1
    text: |-
      In dit besluit wordt verstaan onder:

      a. Onze Minister: Onze Minister van Onderwijs, Cultuur en Wetenschap en, voor wat betreft het onderwijs op het
      gebied van landbouw, natuurlijke omgeving en voedsel, Onze Minister van Economische Zaken;

      b. de wet: de [Wet medezeggenschap onderwijs][ref1] (*Stb.* 1981, 778);

      c. de medezeggenschapsraad: de raad, bedoeld in [artikel 4, eerste lid, van de wet][ref2];

      d. de voorlopige medezeggenschapsraad: de raad, bedoeld in [artikel 24 van de wet][ref3];

      e. het medezeggenschapsreglement: het reglement, bedoeld in [artikel 3, eerste lid, van de wet][ref4];

      f. het bevoegd gezag: voor wat betreft

      1°. een rijksschool: Onze minister;

      2°. een gemeentelijke school: het college van burgemeester en wethouders, voor zover de raad niet anders bepaalt,
      en, indien de raad dit wenselijk oordeelt, met inachtneming van door hem te stellen regelen;

      3°. een bijzondere school: het schoolbestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0005746
      [ref2]: https://wetten.overheid.nl/BWBR0005746#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0005746#Artikel24
      [ref4]: https://wetten.overheid.nl/BWBR0005746#Artikel3
