  - number: '4.2'
    text: |-
      1 De waardevaststelling, bedoeld in [artikel 9.8, derde lid, van de wet][ref1] geschiedt op basis van:

      a. het in [artikel 5.4, vijfde lid, van de wet][ref2] bedoelde vastgestelde aantal dieren; en

      b. de waarde die het dier, product of voorwerp had op het moment waarop aan de desbetreffende houder is medegedeeld
      dat ten aanzien van zijn dier, product of voorwerp een bestrijdingsmaatregel wordt of is toegepast.

      2 Bij toepassing van het eerste lid, onderdeel b, wordt rekening gehouden met de bij ministeriele regeling vast te
      stellen indeling van dieren, producten of voorwerpen in soorten, categorieën of andere onderverdelingen.

      3 De deskundige, bedoeld in [artikel 9.8, vijfde lid, van de wet][ref3], verstrekt de houder van het dier, product
      of voorwerp een afschrift van het formulier, bedoeld in artikel 9.8, zevende lid, van de wet.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel9.8
      [ref2]: https://wetten.overheid.nl/BWBR0030250#Artikel5.4
      [ref3]: https://wetten.overheid.nl/BWBR0030250#Artikel9.8
