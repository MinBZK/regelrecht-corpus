  - number: '3.1'
    text: |-
      Voor daartoe aangewezen monitoringsprogramma’s wijst Onze Minister een instelling met een laboratorium aan die:

      a. monsters neemt;

      b. laboratoriumanalyses, -tests en -diagnoses uitvoert;

      c. ander onderzoek verricht in het kader van de opsporing en bestrijding van dierziektes; of

      d. rapportages maakt over de verrichte werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0045039/2025-01-01#Artikel3.1
  - number: '3.2'
    text: |-
      Onze Minister kan aan een aangewezen instelling als bedoeld in [artikel 3.1][ref1] algemene en bijzondere
      instructies geven over de uitvoering en verantwoording van de aangewezen monitoringsprogramma’s.


      [ref1]: https://wetten.overheid.nl/BWBR0045039#Artikel3.1
    url: https://wetten.overheid.nl/BWBR0045039/2025-01-01#Artikel3.2
