      De aan te wijzen diersoorten en het voor die diersoorten te bepalen aantal, bedoeld in:

      a. [artikel 9.15, derde lid, van de wet][ref1], zijn:

      1. 249 kippen;

      2. 249 kalkoenen;

      3. 249 eenden;

      4. 25 schapen;

      5. 25 geiten;

      6. 5 runderen;

      7. 5 varkens.

      b. [artikel 9.16, derde lid, van de wet][ref2], zijn:

      1. 25 schapen;

      2. 25 geiten.


