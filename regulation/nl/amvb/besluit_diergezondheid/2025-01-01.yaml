  - number: '3.3'
    text: |-
      Een exploitant als bedoeld in artikel 4, onderdeel 24, van verordening nr. (EU) 2016/429 verleent medewerking
      ten behoeve van het nemen van monsters van de door hem gehouden dieren, kadavers, delen van dieren of dierlijke
      producten en staat deze af aan het op grond van [artikel 3.1][ref1] aangewezen instelling ter uitvoering van de
      aangewezen monitoringsprogramma’s.


      [ref1]: https://wetten.overheid.nl/BWBR0045039#Artikel3.1
