  - number: '4.1'
    text: |-
      Het moment waarop aan de houder is meegedeeld dat ten aanzien van een dier, product of voorwerp
      een bestrijdingsmaatregel als bedoeld in [artikel 5.4, derde lid, onderdelen h of i][ref1], of
      [artikel 5.5, tweede lid, onderdelen c of d, van de wet][ref2] wordt of is toegepast, geldt als ijkmoment voor de
      waardevaststelling, bedoeld in [artikel 9.8, zesde lid, onderdeel a, van de wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel5.4
      [ref2]: https://wetten.overheid.nl/BWBR0030250#Artikel5.5
      [ref3]: https://wetten.overheid.nl/BWBR0030250#Artikel9.8
