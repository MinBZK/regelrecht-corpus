  - number: '2.2'
    text: |-
      Onze Minister wijst een dier of een groep dieren aan als besmet met een dierziekte of zoönose als bedoeld in
      [artikel 5.3, tweede lid, van de wet][ref1], anders dan een ziekte als bedoeld in artikel 9, eerste lid, van
      verordening (EU) nr. 2016/429, indien:

      a. de ziekteverwekker, vaccinstammen uitgezonderd, is geïsoleerd in een monster van een dier of een groep dieren;

      b. een antigeen of nucleïnezuur dat specifiek is voor de ziekteverwekker en niet het gevolg is van vaccinatie, is
      aangetroffen in een monster van een dier of een groep dieren waarbij klinische symptomen die bij de ziekte passen
      of een epidemiologisch verband met een vermoedelijk of bevestigd geval zijn vastgesteld; of

      c. een positief resultaat van een indirecte diagnostische methode dat niet het gevolg is van vaccinatie, is
      verkregen in een monster van een dier of een groep dieren waarbij klinische symptomen die bij de ziekte passen of
      een epidemiologisch verband met een vermoedelijk of bevestigd geval zijn vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel5.3
    url: https://wetten.overheid.nl/BWBR0045039/2025-01-01#Artikel2.2
