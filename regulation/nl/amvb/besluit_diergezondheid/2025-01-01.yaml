  - number: '4.3'
    text: |-
      1 De waarde van een verdacht dier en de marktwaarde van een product, bedoeld in
      [artikel 9.8, eerste lid, onderdelen a en c, van de wet][ref1], zijn het bedrag dat de eigenaar onder normale
      omstandigheden voor dat dier of product had kunnen ontvangen op de markt, al naar gelang de conditie, de kwaliteit,
      het gewicht, het ras of type, de leeftijd of ouderdom.

      2 In afwijking van het eerste lid is de waarde van een dier of product dat zich bevindt in een levensfase of fase
      van het productieproces waarin het onder normale omstandigheden niet verhandelbaar is, de waarde, al naar gelang
      het gebruiksdoel, de aanwending, de leeftijd of ouderdom.

      3 De vervangingswaarde van een voorwerp, bedoeld in [artikel 9.8, eerste lid, onderdeel d, van de wet][ref2], is
      het bedrag benodigd voor het verkrijgen van naar soort, kwaliteit, hoeveelheid, staat en ouderdom gelijkwaardige
      zaken.

      4 De waarde van een ziek dier, bedoeld in [artikel 9.8, eerste lid, onderdeel b, van de wet][ref3], is 50% van het
      bedrag, bedoeld in het eerste of tweede lid.

      5 De waarde van een dood dier, bedoeld in [artikel 9.8, eerste lid, onderdeel b, van de wet][ref4], is nihil.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel9.8
