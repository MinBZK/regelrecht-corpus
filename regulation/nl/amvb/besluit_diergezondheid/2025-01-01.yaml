      1 Dit besluit treedt in werking met ingang van 21 april 2021, met uitzondering van
      [artikel 6.4, onderdeel B][ref1], ten aanzien van de [artikelen 1.29](onbekend), [1.30](onbekend) en [1.31 van het
      Besluit houders van dieren](onbekend), en van [artikel 6.5][ref2].

      2 Indien het bij koninklijke boodschap van 17 februari 2020 ingediende voorstel van wet tot wijziging van de Wet
      dieren in verband met de uitvoering van de herziene Europese diergezondheidswetgeving (Kamerstukken ) tot wet is
      of wordt verheven en artikel I, onderdeel B, van die wet in werking treedt, treedt artikel 6.4, onderdeel B, ten
      aanzien van de [artikelen 1.29](onbekend), [1.30](onbekend) en [1.31 van het Besluit houders van dieren](onbekend),
      op hetzelfde tijdstip in werking.

      3 [Artikel 6.5][ref3] treedt in werking op het tijdstip dat artikel I, onderdeel A, onderdeel 3, van het besluit
      van 15 oktober 2020 tot wijziging van het Besluit diergezondheidsheffing in verband met de vaststelling van de
      tarieven voor 2021 (Stb. 399) in werking treedt.


