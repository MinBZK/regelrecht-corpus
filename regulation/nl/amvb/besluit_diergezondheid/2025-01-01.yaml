  - number: '2.1'
    text: |-
      1 Onze Minister wijst een dier of groep dieren aan als verdacht van besmetting met een dierziekte of zoönose als
      bedoeld in [artikel 5.3, tweede lid, van de wet][ref1], anders dan een ziekte als bedoeld in artikel 9, eerste lid,
      van verordening (EU) nr. 2016/429, indien:

      a. uit klinisch, post-mortem- of laboratoriumonderzoeken blijkt dat een of meer klinische tekenen of post-
      mortemlaesies of histologische bevindingen op die ziekte wijzen;

      b. een of meer resultaten van een diagnostische methode op de waarschijnlijke aanwezigheid van de ziekte in een
      monster van een dier of een groep dieren wijzen; of

      c. er een epidemiologisch verband met een bevestigd geval is vastgesteld.

      2 Onze Minister trekt een aanwijzing als bedoeld in het eerste lid in, indien:

      a. er geen agens, antigeen of indirecte immunologische reactie is aangetoond; of

      b. Onze Minister anderszins de overtuiging heeft gekregen dat het dier niet aan een ziekte als bedoeld in de aanhef
      van het eerste lid lijdt.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel5.3
    url: https://wetten.overheid.nl/BWBR0045039/2025-01-01#Artikel2.1
    references:
