  - number: '5.3'
    text: |-
      1 Het aantal in een kalenderjaar gehouden varkens wordt bepaald op basis van het aantal dieren dat in het
      kalenderjaar uit de stal is afgevoerd.

      2 Het aantal in een kalenderjaar gehouden runderen, jonger dan een jaar, wordt bepaald op basis van het aantal
      dieren dat in het kalenderjaar uit de stal is afgevoerd om te worden geëxporteerd of om te worden vervoerd naar een
      slachthuis, al dan niet via een verzamelcentrum.
    url: https://wetten.overheid.nl/BWBR0045039/2025-01-01#Artikel5.3
  - number: '5.4'
    text: |-
      De tarieven voor de diergezondheidsheffing worden voor de jaren 2025 tot en met 2029 zodanig vastgesteld dat de
      totale opbrengst in die periode niet meer bedraagt dan:

      a. voor runderen: € 90.000.000;

      b. voor varkens: € 85.000.000;

      c. voor kippen, kalkoenen, eenden en broedeieren: € 130.000.000;

      d. voor geiten: € 9.700.000;

      e. voor schapen: € 8.900.000.
    url: https://wetten.overheid.nl/BWBR0045039/2025-01-01#Artikel5.4
  - number: '5.5'
    text: |-
      De omvang van de in [artikel 9.23, derde lid, van de wet][ref1] bedoelde reserve bedraagt:

      a. voor runderen: € 1.800.000;

      b. voor varkens: € 7.400.000;

      c. voor kippen, kalkoenen, eenden en broedeieren: € 7.423.000;

      d. voor geiten: € 49.000;

      e. voor schapen: € 49.000.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel9.23
