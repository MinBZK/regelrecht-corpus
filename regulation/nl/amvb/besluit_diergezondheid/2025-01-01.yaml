  - number: '5.6'
    text: |-
      1 Het tarief voor de diergezondheidsheffing ter zake van het houden van kippen die behoren tot een vleesras
      bedraagt:

      a. € 1,490454 per kip die bestemd is om te worden opgefokt tot grootouderdier;

      b. € 0,124461 per kip die bestemd is om te worden opgefokt tot ouderdier.

      2 Het tarief voor de diergezondheidsheffing ter zake van het houden van kippen die behoren tot een vleesras
      bedraagt:

      a. € 0,375475 per ouderdier;

      b. € 1,948455 per grootouderdier.

      3 Het tarief voor de diergezondheidsheffing ter zake van het houden van vleeskuikens bedraagt:

      a. € 0,034008 per vleeskuiken van een traaggroeiend ras;

      b. € 0,014684 per vleeskuiken van andere rassen dan bedoeld in onderdeel a.

      4 Het tarief voor de diergezondheidsheffing ter zake van de inleg van broedeieren, afkomstig van kippen die behoren
      tot een vleesras, bedraagt:

      a. nihil per broedei voor fok- en vermeerderingspluimvee;

      b. nihil per broedei voor gebruikspluimvee.
    url: https://wetten.overheid.nl/BWBR0045039/2025-01-01#Artikel5.6
  - number: '5.7'
    text: |-
      1 Het tarief voor de diergezondheidsheffing ter zake van het houden van kippen die behoren tot een legras bedraagt:

      a. € 2,036631 per kip die bestemd is om te worden opgefokt tot grootouderdier;

      b. € 0,214822 per kip die bestemd is om te worden opgefokt tot ouderdier;

      c. € 0,062868 per kip die bestemd is om te worden opgefokt tot legkip.

      2 Het tarief voor de diergezondheidsheffing ter zake van het houden van kippen die behoren tot een legras bedraagt:

      a. € 2,825901 per grootouderdier;

      b. € 0,369519 per ouderdier.

      3 Het tarief voor de diergezondheidsheffing ter zake van het houden van legkippen bedraagt:

      a. € 1,037400 per legkip die wordt gehouden voor de productie van biologische eieren als bedoeld in artikel 30,
      eerste lid, van [verordening (EU) 2018/848](32748R2018);

      b. € 0,539449 per legkip die wordt gehouden voor de productie van eieren van hennen met vrije uitloop als bedoeld
      in bijlage II, onderdeel 1, van [verordening (EU) 2023/2465](32023R2465);

      c. € 0,337156 per legkip die wordt gehouden voor de productie van scharreleieren als bedoeld in bijlage II,
      onderdeel 2, van [verordening (EU) 2023/2465](32023R2465) of vaccinbroedeieren;

      d. € 0,219508 per legkip die wordt gehouden voor de productie van eieren uit aangepaste kooien als bedoeld in
      bijlage II, onderdeel 3, van [verordening (EU) 2023/2465](32023R2465).

      4 Het tarief voor de diergezondheidsheffing voor de inleg van broedeieren, afkomstig van kippen die behoren tot een
      legras, bedraagt:

      a. nihil per broedei voor fok- en vermeerderingspluimvee;

      b. nihil per broedei voor gebruikspluimvee;

      c. nihil per vaccinbroedei.

      5 Het tarief voor de diergezondheidsheffing ter zake van het houden van leghanen bedraagt € 0,042897 per leghaan.
    url: https://wetten.overheid.nl/BWBR0045039/2025-01-01#Artikel5.7
