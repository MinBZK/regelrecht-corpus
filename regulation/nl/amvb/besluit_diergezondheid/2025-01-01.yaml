preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Landbouw, Natuur en Voedselkwaliteit van 16 november 2020, nr. WJZ /
    20277340, gedaan in overeenstemming met Onze Minister voor Medische Zorg en Sport en na overleg met Onze Minister
    van Sociale Zaken en Werkgelegenheid;

    Gelet op Verordening (EU) 2016/429 van het Europees Parlement en de Raad van 9 maart 2016 betreffende
    overdraagbare dierziekten en tot wijziging en intrekking van bepaalde handelingen op het gebied van diergezondheid
    («diergezondheidswetgeving») (PbEU 2016, L 84), Verordening (EG) nr. 2160/2003 van het Europees Parlement
    en de Raad van 17 november 2003 inzake de bestrijding van salmonella en andere specifieke door voedsel
    overgedragen zoönoseverwekkers (PbEU 2003, L 325), Richtlijn 2003/99/EG van het Europees Parlement en de Raad
    van de Europese Unie van 17 november 2003 inzake de bewaking van zoönosen en zoönoseverwekkers en houdende
    wijziging van Beschikking 90/424/EEG van de Raad en intrekking van Richtlijn 92/117/EEG van de Raad (PbEU
    2003, L 325), Verordening (EG) nr. 178/2002 van het Europees Parlement en de Raad van de Europese Unie van
    28 januari 2002 tot vaststelling van de algemene beginselen en voorschriften van de levensmiddelenwetgeving,
    tot oprichting van een Europese Autoriteit voor voedselveiligheid en tot vaststelling van procedures voor
    voedselveiligheidsaangelegenheden (PbEG 2002, L 31, Verordening (EU) nr. 576/2013 van het Europees Parlement en
    de Raad van 12 juni 2013 betreffende het niet-commerciële verkeer van gezelschapsdieren en tot intrekking van
    Verordening (EG) nr. 998/2003 (PbEU 2013, L 178) en de artikelen 2.2, tiende lid, 2.4, tweede lid, 2.5, tweede lid,
    2.6, tweede lid, 2.7, tweede lid, 2.12, 2.22, tweede lid, 3.1, tweede lid, 5.4, tweede lid, 5.6, vierde en vijfde
    lid, artikel 6.4, eerste lid, artikel 7.2, tweede lid, 7.8, 9.8, tweede en zesde lid, 9.9, eerste en tweede lid,
    10.2, eerste lid, en artikel 11.1 van de Wet dieren;

    De Afdeling advisering van de Raad van State gehoord (advies van 10 februari 2021, nr. W11.20.0420/IV);

    Gezien het nader rapport van Onze Minister van Landbouw, Natuur en Voedselkwaliteit van 22 maart 2021, nr. WJZ
    21059158, gedaan in overeenstemming met Onze Minister voor Medische Zorg en Sport en na overleg met Onze Minister
    van Sociale Zaken en Werkgelegenheid;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0045039/2025-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

        - *besmet dier:* dier dat is aangewezen als besmet als bedoeld in [artikel 2.2][ref1];
        - *deskundige:* deskundige als bedoeld in [artikel 9.8, vijfde lid, van de wet][ref2];
        - *verdacht dier:* dier dat is aangewezen als verdacht als bedoeld in [artikel 2.1][ref3];
        - *verordening (EU) nr. 2016/429:* verordening (EU) 2016/429 van het Europees Parlement en de Raad van 9 maart 2016
      betreffende overdraagbare dierziekten en tot wijziging en intrekking van bepaalde handelingen op het gebied van
      diergezondheid («diergezondheidswetgeving») (PbEU 2016, L 84);
        - *wet:* [Wet dieren][ref4].


