  - number: '5.12'
    text: |-
      1 Het tarief voor de diergezondheidsheffing ter zake van het houden van varkens op een A-bedrijf bedraagt:

      a. € 0,275 per vleesvarken dat is afgevoerd naar een slachthuis of naar een bestemming buiten Nederland, al dan
      niet via een verzamelcentrum;

      b. € 0,138 per zeug, beer, gelt of big die is afgevoerd naar een A-, B-, C- of D-bedrijf, naar een slachthuis of
      naar een bestemming buiten Nederland, al dan niet via een verzamelcentrum;

      c. € 0,096 per big die is afgevoerd naar een E-bedrijf.

      2 Het tarief voor de diergezondheidsheffing ter zake van het houden van varkens op een B-bedrijf bedraagt:

      a. € 0,275 per vleesvarken dat is afgevoerd naar een slachthuis of naar een bestemming buiten Nederland, al dan
      niet via een verzamelcentrum;

      b. € 0,138 per zeug, beer of gelt die is afgevoerd naar een slachthuis of naar een bestemming buiten Nederland, al
      dan niet via een verzamelcentrum;

      c. € 0,138 per big die is afgevoerd naar een D-bedrijf, naar een slachthuis of naar een bestemming buiten
      Nederland, al dan niet via een verzamelcentrum;

      d. € 0,096 per big die is afgevoerd naar een F-bedrijf.

      3 Het tarief voor de diergezondheidsheffing ter zake van het houden van varkens op een C-bedrijf bedraagt € 0,138
      per varken dat is afgevoerd naar A-, B-, of D-bedrijf, naar een slachthuis of naar een bestemming buiten Nederland,
      al dan niet via een verzamelcentrum.

      4 Het tarief voor de diergezondheidsheffing ter zake van het houden van varkens op een D-bedrijf bedraagt € 0,138
      per varken dat is afgevoerd naar een slachthuis of naar een bestemming buiten Nederland, al dan niet via een
      verzamelcentrum.

      5 Het tarief voor de diergezondheidsheffing ter zake van het houden van varkens op een E-bedrijf bedraagt € 0,041
      per varken.

      6 Het tarief voor de diergezondheidsheffing ter zake van het houden van varkens op een F-bedrijf bedraagt € 0,041
      per varken.

      7 Op geslachtsrijpe varkens die eerder bestemd waren voor de fokkerij en van een A-bedrijf of een B-bedrijf zijn
      afgevoerd naar een slachthuis, al dan niet via een verzamelcentrum, is uitsluitend het eerste lid, onderdeel b, dan
      wel het tweede lid, onderdeel b, van toepassing.
    url: https://wetten.overheid.nl/BWBR0045039/2025-01-01#Artikel5.12
  - number: '7.1'
    text: |-
      Besluiten die op grond van artikel 13 van uitvoeringsverordening (EU) 2015/262 van de Commissie van 17 februari
      2015 tot vaststelling van voorschriften overeenkomstig de [Richtlijnen 90/427/EEG](31990L0427) en [2009/156/
      EG](32009L0156) van de Raad met betrekking tot de methoden voor de identificatie van paardachtigen (verordening
      paardenpaspoort) (Pb EU 2015, L 59) zijn genomen, worden geacht te zijn genomen op grond van artikel 60 van
      verordening (EU) [2019/2035](32019L2035) onder dezelfde voorschriften, beperkingen en voorwaarden.
    url: https://wetten.overheid.nl/BWBR0045039/2025-01-01#Artikel7.1
  - number: '7.2'
    text: |-
      De volgende besluiten worden ingetrokken:

      a. het [Besluit aanwijzing diersoorten besmettelijke dierziekten][ref1];

      b. het [Besluit eisen dierlijk sperma en spermawincentra][ref2];

      c. het [Besluit gebruik sera en entstoffen][ref3];

      d. het [Besluit niet gehouden dieren][ref4];

      e. het [Besluit uitvoer dieren en produkten van dierlijke oorsprong][ref5];

      f. het [Besluit uitvoering verordening officiële controles diergezondheid][ref6];

      g. het [Besluit verdachte dieren][ref7];

      h. het [Besluit verlaging tegemoetkoming aangewezen dierziekten][ref8];

      i. het [Besluit vervoer van en naar besmette of van besmetting verdachte gebouwen en terreinen][ref9];

      j. het [Besluit waardevaststelling bij dierziektebestrijding][ref10];

      k. het [Besluit zoönosen][ref11];

      l. het [Embryobesluit][ref12].


