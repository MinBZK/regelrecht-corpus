  - number: '5.1'
    text: |-
      In dit hoofdstuk wordt verstaan onder:

        - *A-, B-, C-, D-, E- of F-bedrijf:* bedrijf dat op grond van
      [artikel 2.27a van het Besluit houders van dieren][ref1] is geregistreerd als A-, B-, C-, D-, E- of F-bedrijf;
        - *beer:* geslachtsrijp varken van het mannelijk geslacht; bestemd voor de fokkerij;
        - *big:* varken vanaf de geboorte tot aan het spenen;
        - *diergezondheidsheffing:* heffing als bedoeld in [artikel 9.14 van de wet][ref2];
        - *gebruikspluimvee:* pluimvee dat bestemd is voor de productie van consumptie-eieren of direct bestemd is voor de
      productie van vlees;
        - *gelt:* geslachtsrijp varken van het vrouwelijk geslacht dat nog niet heeft geworpen, bestemd voor de fokkerij;
        - *grootouderdier:* kip die gehouden wordt voor de productie van broedeieren ter verkrijging van ouderdieren;
        - *legkip:* kip die gehouden wordt voor de productie van consumptie-eieren of vaccinbroedeieren;
        - *leghaan:* haan van een legras die direct bestemd is voor de productie van vlees;
        - *legras:* pluimveeras dat bestemd is voor de productie van eieren;
        - *ouderdier:* kip die gehouden wordt voor de productie van broedeieren ter verkrijging van gebruikspluimvee;
        - *traaggroeiend ras:* ras waarvan de dieren minder dan 50 gram per dag groeien;
        - *verordening (EU) 2018/848:* [Verordening (EU) 2018/848](32748R2018) van het Europees Parlement en de Raad van
      30 mei 2018 inzake de biologische productie en de etikettering van biologische producten en tot intrekking van
      Verordening (EG) nr. 834/2007 van de Raad (PbEU 2018, L 150);
        - *verordening (EU) 2023/2465:* Gedelegeerde [Verordening (EU) 2023/2465](32023R2465) van de Commissie van
      17 augustus 2023 tot aanvulling van [Verordening (EU) nr. 1308/2013](32013R1308) van het Europees Parlement en de
      Raad wat betreft handelsnormen voor eieren, en tot intrekking van [Verordening (EG) nr. 589/2008](32008R0589) van
      de Commissie;
        - *vleeskalkoen:* kalkoen die direct bestemd is voor de productie van vlees;
        - *vleeskuiken:* kip die direct bestemd is voor de productie van vlees;
        - *vleesras:* pluimveeras dat bestemd is voor de productie van vlees;
        - *vleesvarken:* gespeend varken dat wordt gehouden voor de productie van vlees;
        - *zeug:* varken van het vrouwelijk geslacht na de worp van haar eerste biggen.


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel2.27a
      [ref2]: https://wetten.overheid.nl/BWBR0030250#Artikel9.14
    url: https://wetten.overheid.nl/BWBR0045039/2025-01-01#Artikel5.1
