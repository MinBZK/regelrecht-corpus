    text: |-
      1

      De tegemoetkoming in de schade bedraagt voor alle dieren ten hoogste tienduizend euro per dier.

      2 In afwijking van het eerste lid bedraagt de tegemoetkoming in de schade voor pluimvee als bedoeld in artikel 4,
      onderdeel 9, van [verordening (EU) nr. 2016/429](32016R0429), honderd euro per dier.
    url: https://wetten.overheid.nl/BWBR0045039/2025-01-01#Artikel4.4
  - number: '4.5'
    text: |-
      1 Een houder die zich niet met het advies van de deskundige, bedoeld in [artikel 9.8, vijfde lid, van de wet][ref1],
      kan verenigen, kan Onze Minister gemotiveerd verzoeken om een herwaardering.

      2 Een verzoek als bedoeld in het eerste lid wordt gedaan binnen een week te rekenen vanaf de dag na de dagtekening
      van het advies.

      3 Indien het verzoek, bedoeld in het eerste lid, aanleiding geeft tot het opstellen van een nieuw advies, wijst
      Onze Minister drie deskundigen aan, waaronder de deskundige die het oorspronkelijke advies uitbracht, die Onze
      Minister adviseren over de waarde van het dier, product of voorwerp.

      4 Indien de drie deskundigen geen overeenstemming bereiken, wordt het advies over de waarde bepaald door de som van
      de door de drie deskundigen voorgestelde waarden te delen door drie.

      5 De drie deskundigen verstrekken de houder van het dier, product of voorwerp afschriften van de formulieren,
      bedoeld in [artikel 9.8, zevende lid, van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel9.8
      [ref2]: https://wetten.overheid.nl/BWBR0030250#Artikel9.8
    url: https://wetten.overheid.nl/BWBR0045039/2025-01-01#Artikel4.5
