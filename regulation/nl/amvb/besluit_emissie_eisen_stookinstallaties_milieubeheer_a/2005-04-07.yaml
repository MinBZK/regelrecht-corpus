---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_emissie_eisen_stookinstallaties_milieubeheer_a
regulatory_layer: AMVB
publication_date: '2012-11-13'
valid_from: '2005-04-07'
bwb_id: BWBR0004147
url: https://wetten.overheid.nl/BWBR0004147/2005-04-07
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 22 januari
    1986, MJZ 22 16 025, Centrale Directie Juridische Zaken, afdeling Wetgeving en het Directoraat-Generaal voor de
    Milieuhygiëne, directie Lucht, gedaan in overeenstemming met Onze Minister van Economische Zaken;

    Overwegende dat het, gelet op de problematiek van de verzuring van het milieu en met het oog op de kwaliteit
    van de buitenlucht, wenselijk is ter beperking van de luchtverontreiniging door zwaveloxiden, stikstofoxiden en
    stof, eisen te stellen aan de emissie van die stoffen door stookinstallaties, behorende tot vergunningplichtige
    inrichtingen;

    Gelet op de artikelen 13, 20a, 88, eerste, derde en vierde lid, van de Wet inzake de luchtverontreiniging (Stb.
    1981, 411);

    Gehoord de Centrale raad voor de milieuhygiëne (advies van 11 september 1985);

    De Raad van State gehoord (advies van 23 december 1986, No. W.O.86.0059.);

    Gezien het nader rapport van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 8 april
    1987, nr. MJZ 0847004, Centrale Directie Juridische Zaken, afdeling Wetgeving en het Directoraat-Generaal voor de
    Milieuhygiëne, directie Lucht, uitgebracht in overeenstemming met Onze Minister van Economische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel1
  - number: 1.a
    text: |-
      wet: [Wet milieubeheer][ref1];

      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003245
  - number: 1.b
    text: |-
      inrichting: een inrichting die behoort tot een of meer van de categorieën van inrichtingen, die zijn genoemd in
      [bijlage I][ref1] van het Inrichtingen-en vergunningenbesluit milieubeheer, onder: 1.3, onder *b*, 2.6, onder *a*,
      4.3, 5.3, 6.2, 8.1, onder *e*, 8.2, onder *a*, 9.3, onder *g* of *j*, 11.3, onder *a*, *b*, *c*, 1°, 4°, 6°, *f*,
      *h*, voor zover het betreft een inrichting met een capaciteit van 100.106 kg per jaar of meer, of *k*, 2°, 12.2,
      onder *a*, *h* of *i*, 13.3, onder *c*, 24.2, of 28.4, onder *e*, voor zover het betreft een inrichting met een
      capaciteit van 1,5.103 kg per uur of meer.


      [ref1]: https://wetten.overheid.nl/BWBR0005829
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005829
  - number: 1.c
    text: |-
      vergunning: een vergunning krachtens [artikel 8.1][ref1] van de wet voor zover deze betrekking heeft op een
      stookinstallatie;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
  - number: 1.d
    text: 'kolen: steenkool of uit steenkool vervaardigde vaste brandstoffen, bruinkool en geperste bruinkool;'
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel1
  - number: 1.e
    text: |-
      zware stookolie: zware stookolie in de zin van de [Wet op de accijns][ref1] (*Stb.* 1991, 561) alsmede aardolie en
      produkten van aardolie waarvan het vloeipunt boven 40°C ligt;


      [ref1]: https://wetten.overheid.nl/BWBR0005251
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005251
  - number: 1.f
    text: |-
      gasolie: gasolie in de zin van de [Wet op de accijns][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005251
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005251
  - number: 1.g
    text: |-
      vloeibare brandstoffen: zware stookolie alsmede andere brandstoffen die bij een temperatuur van 293 Kelvin en
      een druk van 101,3 kiloPascal in vloeibare toestand verkeren, daaronder begrepen minerale oliën in de zin van de
      [Wet op de accijns][ref1], welke bij genoemde temperatuur en druk niet vloeibaar zijn;


      [ref1]: https://wetten.overheid.nl/BWBR0005251
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005251
  - number: 1.h
    text: |-
      gasvormige brandstoffen: brandstoffen die bij een temperatuur van 293 Kelvin en een druk van 101,3 kiloPascal in
      gasvormige toestand verkeren;
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel1
  - number: 1.i
    text: |-
      LPG: vloeibaar gemaakt petroleumgas als bedoeld in [artikel 26 van de Wet op de accijns][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel26
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '26'
  - number: 1.j
    text: 'aardgas van standaardkwaliteit: aardgas, waarvan de onderste verbrandingswaarde 38 MJ/kg is;'
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel1
  - number: 1.k
    text: |-
      rookgas: het mengsel van gassen met de vaste of vloeibare stoffen die zich daarin bevinden, dat bij het verbruik
      van brandstoffen vrijkomt en dat naar de buitenlucht wordt afgevoerd;
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel1
  - number: 1.l
    text: |-
      stookinstallatie: technische eenheid, met inbegrip van de bij de eenheid behorende voorzieningen voor de reiniging
      van het rookgas, waarin brandstof wordt verstookt met als doel de warmte-inhoud ervan te benutten;
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel1
  - number: 1.m
    text: |-
      bestaande stookinstallatie: een stookinstallatie met betrekking waartoe voor 29 mei 1987 vergunning is verleend
      tenzij na dat tijdstip de stookinstallatie geheel is vervangen dan wel, anders dan ter voldoening aan dit besluit,
      de combinatie van brander- en vuurhaard door een andere is vervangen of aan die combinatie wijzigingen zijn
      aangebracht die met nieuwbouw overeenkomen;
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel1
  - number: 1.n
    text: |-
      gasturbine-installatie: een stookinstallatie, bestaande uit een of meer gasturbines, waarin een vloeibare of
      een gasvormige brandstof wordt gestookt, met een of meer bijbehorende ketels waar de verbrandingsgassen van de
      gasturbine dan wel gasturbines doorheen worden gevoerd teneinde warmte over te dragen aan een medium dat niet in
      contact treedt met die gassen en waarin al of niet een brandstof wordt gestookt en waarbij geen danwel nagenoeg
      geen extra lucht voor de verbranding wordt toegevoerd;
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel1
  - number: 1.o
    text: |-
      zuigermotor: een stookinstallatie, bestaande uit een toestel waarin een door verbranding verkregen gasmengsel een
      zuiger in beweging brengt voor de aandrijving van een werktuig;
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel1
  - number: 1.p
    text: |-
      warmte-inhoud van een hoeveelheid brandstof: de op de onderste verbrandingswaarde betrokken hoeveelheid energie die
      bij verbranding van die hoeveelheid brandstof vrijkomt;
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel1
  - number: 1.q
    text: |-
      thermisch vermogen: de warmte-inhoud van de maximale hoeveelheid brandstof die per tijdseenheid kan worden
      toegevoerd aan een stookinstallatie;
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel1
  - number: 1.r
    text: 'belasting: het deel van het thermische vermogen, waarbij de stookinstallatie daadwerkelijk wordt bedreven;'
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel1
  - number: 1.s
    text: |-
      ISO-luchtcondities: een temperatuur van 288 Kelvin, een druk van 101,3 kiloPascal en een relatieve vochtigheid van
      60 procent;
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel1
  - number: 1.t
    text: |-
      motorrendement: het procentuele aandeel van de warmte-inhoud van de toegevoerde brandstoffen, dat bij de hoogste
      belasting waarbij de zuigermotor continu kan worden bedreven, bij ISO-luchtcondities in arbeid wordt omgezet;
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel1
  - number: 1.u
    text: |-
      gasturbinerendement: het procentuele aandeel van de warmte-inhoud van de toegevoerde brandstoffen, dat bij de
      hoogste belasting waarbij de gasturbine continu kan worden bedreven, bij ISO-luchtcondities in netto-arbeid wordt
      omgezet;
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel1
  - number: 1.v
    text: |-
      ontzwavelingspercentage: de verhouding, uitgedrukt in procenten, van enerzijds het verschil tussen de met de
      brandstof toegevoerde massahoeveelheid zwavelverbindingen en de met het rookgas uitgeworpen massahoeveelheid
      zwavelverbindingen, berekend als zwavel, en anderzijds de met de brandstof toegevoerde massahoeveelheid
      zwavelverbindingen, eveneens berekend als zwavel;
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel1
  - number: 1.w
    text: |-
      elektriciteits-produktiebedrijf: houder van een vergunning als bedoeld in artikel 3, eerste lid, van de
      Elektriciteitswet 1989 (*Stb.* 1989, 535);
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel1
  - number: 1.x
    text: 'raffinaderij: een inrichting voor de raffinage van aardolie;'
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel1
  - number: 1.y
    text: 'vaste brandstoffen: brandstoffen die niet gasvormig of vloeibaar zijn in de zin van dit besluit;'
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel1
  - number: 1.z
    text: |-
      procesfornuis: een stookinstallatie die in hoofdzaak gebruikt wordt voor andere doeleinden dan het verhitten van
      water of stoom, het opwekken van kracht, dan wel van een combinatie daarvan;
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel1
  - number: 1.aa
    text: 'rookgasdebiet: de volumehoeveelheid rookgas per tijdseenheid, uitgedrukt in m3 per uur;'
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel1
  - number: 1.bb
    text: |-
      brandstof: een brandstof in de zin van de [Wet inzake de luchtverontreiniging][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002731
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002731
  - number: 1.cc
    text: |-
      bevoegd gezag: het bestuursorgaan dat bevoegd is een vergunning krachtens
      [artikel 8.1 van de Wet milieubeheer][ref1] voor de betrokken inrichting te verlenen;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
  - number: 1.dd
    text: |-
      biomassa: producten die uitsluitend bestaan uit plantaardig landbouw- of bosbouwmateriaal dat gebruikt kan worden
      als brandstof om de warmte-inhoud ervan te benutten, alsmede de volgende als brandstof gebruikte afvalstoffen:
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel1
  - number: 1.dd.1°
    text: plantaardige afvalstoffen die ontstaan zijn bij de uitoefening van land- of bosbouw;
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel1
  - number: 1.dd.2°
    text: |-
      plantaardige afvalstoffen die afkomstig zijn van de levensmiddelenindustrie indien de als gevolg van de thermische
      behandeling van zodanige afvalstoffen opgewekte warmte wordt teruggewonnen;
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel1
  - number: 1.dd.3°
    text: |-
      vezelachtige afvalstoffen die ontstaan zijn bij de vervaardiging van ruwe pulp of de vervaardiging van papier uit
      pulp, indien zodanige afvalstoffen op de plaats waar zij zijn ontstaan, thermisch worden behandeld en de als gevolg
      daarvan opgewekte warmte wordt teruggewonnen;
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel1
  - number: 1.dd.4°
    text: |-
      afvalstoffen bestaande uit hout dat niet als gevolg van een behandeling met houtbeschermingsmiddelen of het
      aanbrengen van een beschermingslaag gehalogeneerde organische verbindingen dan wel zware metalen kan bevatten;
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel1
  - number: 1.dd.5°
    text: afvalstoffen bestaande uit kurk;
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel1
  - number: 1.ee
    text: 'ketelinstallatie: stookinstallatie, ontworpen om in hoofdzaak water of stoom te verhitten;'
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel1
  - number: 1.ff
    text: |-
      gasturbine: krachtwerktuig waarin een continu toegevoerd gecomprimeerd gasvormig mengsel van brandstof en lucht tot
      ontbranding wordt gebracht waarna dit axiaal expandeert langs een rotor.
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel1
  - number: '2'
    text: 'Dit besluit is van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel2
  - number: 2.a
    text: |-
      zuigermotoren waarin gasolie of gasvormige brandstoffen met uitzondering van LPG, dan wel mengsels daarvan, worden
      gestookt, gebruikt voor de aandrijving van:
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel2
  - number: 2.a.1°
    text: |-
      een electrische generator of gascompressor in een installatie voor warmtekrachtkoppeling onderscheidenlijk in een
      warmtepompinstallatie, of
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel2
  - number: 2.a.2°
    text: |-
      een pomp of een compressor die continu wordt gebruikt voor het bedrijven van een installatie, welke blijkens de
      vergunning ontworpen is voor een jaarlijkse bedrijfstijd van tenminste 5000 uur,
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel2
  - number: 2.b
    text: 'andere stookinstallaties dan zuigermotoren, waarin brandstoffen worden gebruikt, met uitzondering van:'
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel2
  - number: 2.b.1°
    text: |-
      stookinstallaties die bestemd zijn voor het drogen of behandelen van voorwerpen of materialen door middel van
      rechtstreeks kontakt met verbrandingsgas;
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel2
  - number: 2.b.2°
    text: cokesovens;
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel2
  - number: 2.b.3°
    text: stookinstallaties voor vloeibare of gasvormige brandstoffen met een thermisch vermogen van 0,9 MW of minder;
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel2
  - number: 2.b.4°
    text: |-
      stookinstallaties die blijkens de daarvoor geldende vergunning bestemd zijn voor het onderzoeken, beproeven
      of demonstreren van experimentele verbrandingstechnieken of technieken ter bestrijding van de uitworp van
      zwaveldioxide, stikstofoxiden en stof;
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel2
  - number: 2.b.5°
    text: |-
      gasturbines en gasturbine-installaties, waarvoor voor 27 november 2002 vergunning is verleend, waarvan het
      jaarlijks aantal bedrijfsuren niet meer bedraagt dan 500, gasturbines en gasturbine-installaties, waarvoor op of
      na 27 november 2002 vergunning is verleend, met een thermisch vermogen van minder dan 50 MW waarvan het jaarlijks
      aantal bedrijfsuren niet meer bedraagt dan 500 en gasturbines en gasturbine-installaties met een netto-asvermogen
      van niet meer dan 1 MW;
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel2
  - number: 2.b.6°
    text: |-
      stookinstallaties waarvoor emissie-eisen zijn gesteld bij het [Besluit verbranden afvalstoffen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0016460
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0016460
  - number: 2.b.7°
    text: |-
      bestaande stookinstallaties die blijkens de daarvoor geldende vergunning bestemd zijn voor tijdelijk bedrijf van
      niet meer dan 500 uren per jaar;
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel2
  - number: 2.b.8°
    text: installaties voor de vergassing van kolen of olie;
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel2
  - number: 2.b.9°
    text: installaties die op offshoreplatforms worden gebruikt;
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel2
  - number: 2.b.10°
    text: |-
      technische voorzieningen voor de zuivering van rookgassen door verbranding die niet als autonome stookinstallatie
      worden geëxploiteerd.
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel2
  - number: '3'
    text: |-
      Degene die een inrichting drijft waarin zich een stookinstallatie bevindt waarop dit besluit van toepassing is,
      draagt er zorg voor dat de voorschriften, bij of krachtens dit besluit gesteld, worden nageleefd.
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel3
  - number: '4.1'
    text: |-
      Voor de berekening van de uitworp van een stookinstallatie wordt de massaconcentratie aan zwaveldioxide,
      stifstofoxiden of stof in het rookgas herleid op rookgas met een volumegehalte aan zuurstof van:
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel4
  - number: 4.1.a
    text: 'ingeval het een stookinstallatie voor vaste brandstoffen betreft: 6 procent;'
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel4
  - number: 4.1.b
    text: 'ingeval het een andere stookinstallatie dan bedoeld onder a. betreft: 3 procent.'
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel4
  - number: '4.2'
    text: |-
      Voor de berekening van de uitworp van een stookinstallatie geldt als het volume van het rookgas het volume bij een
      temperatuur van 273 Kelvin en een druk van 101,3 kiloPascal, na aftrek van het volume van het erin aanwezige water,
      berekend als waterdamp.
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel4
  - number: '4.3'
    text: |-
      Voor de berekening van de uitworp van een stookinstallatie wordt de massaconcentratie aan stikstofoxiden in het
      rookgas berekend als massaconcentratie aan stikstofdioxide.
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel4
  - number: '5.1'
    text: |-
      Voor de vaststelling van het thermische vermogen van een stookinstallatie wordt, behoudens tegenbewijs, uitgegaan
      van het in de vergunning vastgelegde vermogen.
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel5
  - number: '5.2'
    text: |-
      Voor de vaststelling van het gasturbinerendement en het motorrendement wordt, behoudens tegenbewijs, uitgegaan van
      het door de fabrikant gegarandeerde gasturbinerendement onderscheidenlijk motorrendement.
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel5
  - number: 5a.1
    text: Het rookgas dient gecontroleerd via een of meer schoorstenen te worden geloosd.
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel5a
  - number: 5a.2
    text: |-
      De schoorsteen van een stookinstallatie, niet zijnde een bestaande stookinstallatie met een thermisch vermogen van
      minder dan 50 MW, is zo hoog dat er geen gevaar bestaat voor de gezondheid en het milieu.
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel5a
  - number: '6.1'
    text: |-
      Indien twee of meer stookinstallaties binnen een inrichting zodanig zijn gelegen dat de rookgassen via één
      schoorsteen worden geloosd, of blijkens de vergunning op technisch en economisch aanvaardbare wijze via één
      schoorsteen kunnen worden geloosd, wordt dit samenstel van stookinstallaties als één stookinstallatie aangemerkt.
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel6
  - number: '6.2'
    text: 'Het eerste lid is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel6
  - number: 6.2.a
    text: bestaande stookinstallaties voor vaste of gasvormige brandstoffen;
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel6
  - number: 6.2.b
    text: bestaande stookinstallaties voor zware stookolie, waarvoor voor 2 januari 1975 vergunning is verleend;
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel6
  - number: 6.2.c
    text: |-
      bestaande stookinstallaties voor zware stookolie waarbij het aandeel van zware stookolie in de warmte-inhoud van de
      toegevoegde brandstoffen minder dan 50 procent bedraagt;
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel6
  - number: 6.2.d
    text: afzonderlijk gedreven gasturbines waarvoor voor 27 november 2002 vergunning is verleend;
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel6
  - number: 6.2.e
    text: |-
      gasturbine-installaties waarvoor voor 27 november 2002 vergunning is verleend en waarop artikel 20 of artikel 20a
      van toepassing is;
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel6
  - number: 6.2.f
    text: afzonderlijk aangedreven gasturbines met een thermisch vermogen van minder dan 50 MW;
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel6
  - number: 6.2.g
    text: |-
      gasturbine-installaties waarop [artikel 20][ref1] of [artikel 20a][ref2] van toepassing is met een thermisch
      vermogen van minder dan 50 MW;


      [ref1]: https://wetten.overheid.nl/BWBR0004147#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0004147#Artikel20a
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0004147
        artikel: '20'
        hoofdstuk: '2'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0004147
        artikel: 20a
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 6.2.h
    text: zuigermotoren.
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel6
  - number: '7.1'
    text: |-
      Een stookinstallatie met een thermisch vermogen van minder dan 50 MW die, als gevolg van een storing in het
      onderdeel van de stookinstallatie dat de emissiereductie bewerkstelligt, niet met inachtneming van de eisen die ten
      aanzien van de uitworp van stikstofoxiden of stof bij of krachtens dit besluit zijn gesteld, kan worden gebruikt,
      mag, indien het bevoegd gezag voor die installatie voor dat soort voorvallen in de vergunning een bepaalde periode
      heeft vastgesteld, gedurende die periode in bedrijf worden gehouden.
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel7
  - number: '7.2'
    text: |-
      Een stookinstallatie voor vaste brandstoffen of zware stookolie met een thermisch vermogen van minder dan 50 MW die
      is uitgerust met voorzieningen voor de ontzwaveling van rookgassen, mag bij het optreden van zodanige storingen in
      die voorzieningen dat het vereiste ontzwavelingspercentage niet wordt gehaald:
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel7
  - number: 7.2.a
    text: |-
      indien de waarde van de emissie-eis met betrekking tot zwaveldioxide wordt overschreden, gedurende ten hoogste 72
      achtereenvolgende uren en voor ten hoogste 240 uren in totaal per kalenderjaar in bedrijf blijven;
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel7
  - number: 7.2.b
    text: |-
      indien de waarde van de emissie-eis met betrekking tot zwaveldioxide niet wordt overschreden en het bevoegd gezag
      voor die stookinstallaties voor dit soort voorvallen in de vergunning een bepaalde periode heeft vastgesteld,
      gedurende die periode in bedrijf worden gehouden.
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel7
  - number: '7.3'
    text: |-
      Het eerste lid is van overeenkomstige toepassing op de uitworp van zwaveldioxide van een andere stookinstallatie
      met een thermisch vermogen van minder dan 50 MW dan bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel7
  - number: 7a.1
    text: |-
      Indien bij een stookinstallatie met een thermisch vermogen van 50 MW of meer de apparatuur die de emissiereductie
      bewerkstelligt, is uitgevallen, en deze apparatuur niet binnen 24 uur normaal functioneert, wordt de
      stookinstallatie geheel of gedeeltelijk buiten gebruik gesteld of met een weinig vervuilende brandstof in bedrijf
      gehouden.
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel7a
  - number: 7a.2
    text: |-
      Een stookinstallatie met een thermisch vermogen van 50 MW of meer mag als gevolg van een storing als bedoeld
      in het eerste lid gedurende ten hoogste 120 uur per 12 maanden in bedrijf zijn zonder dat de apparatuur die de
      emissiereductie bewerkstelligt, functioneert.
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel7a
  - number: 7a.3
    text: |-
      Het bevoegd gezag kan de in het eerste en tweede lid genoemde periodes van 24 en 120 uur verlengen, indien dit
      absoluut noodzakelijk is om de energievoorziening in stand te houden of indien de betreffende stookinstallatie
      in die gevallen voor een beperkte tijd vervangen zou worden door een stookinstallatie die over het geheel genomen
      hogere emissies zou veroorzaken.
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel7a
  - number: 7a.4
    text: Storingen als bedoeld in het eerste lid worden binnen 48 uur gemeld aan het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel7a
  - number: '8'
    text: |-
      Bij afwisselend gebruik van verschillende soorten brandstof in een stookinstallatie zijn de bij of krachtens dit
      besluit gestelde emissie-eisen voor elke gebruikte brandstof afzonderlijk van toepassing.
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel8
  - number: '9.1'
    text: |-
      Bij gelijktijdig gebruik van verschillende soorten brandstof in een stookinstallatie geldt als emissie-eis voor
      zwaveldioxide, stikstofoxiden en stof het gewogen gemiddelde van de emissie-eisen die op grond van dit besluit voor
      elk van de brandstoffen afzonderlijk zouden gelden.
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel9
  - number: '9.2'
    text: |-
      Het in het eerste lid bedoelde gewogen gemiddelde wordt per tijdseenheid berekend naar het aandeel van elk van de
      brandstoffen in de warmte-inhoud van de toegevoerde brandstoffen.
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel9
  - number: '9.3'
    text: |-
      Bij toepassing van het eerste lid op een stookinstallatie waarin het aandeel van vaste brandstoffen en zware
      stookolie in de warmte-inhoud van de toegevoerde brandstoffen minder bedraagt dan 30% van het totaal en minder is
      dan 300 MW, gelden de eisen met betrekking tot het ontzwavelingspercentage gesteld in [hoofdstuk 2][ref1] niet.


      [ref1]: https://wetten.overheid.nl/BWBR0004147#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0004147
        hoofdstuk: '2'
  - number: '9.4'
    text: |-
      In afwijking van het eerste lid geschiedt de vaststelling van de toegestane uitworp aan zwaveloxiden bij een
      stookinstallatie als bedoeld in het derde lid:
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel9
  - number: 9.4.a
    text: |-
      bij een bestaande stookinstallatie op basis van een emissie-eis van 700 mg/m3 voor vaste brandstoffen en van 1700
      mg/m3 voor zware stookolie;
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel9
  - number: 9.4.b
    text: |-
      bij een stookinstallatie waarvoor in de periode van 29 mei 1987 tot en met 26 november 2002 vergunning is verleend
      en waarvan het thermisch vermogen 400 MW of minder is, op basis van een emissie-eis van 700 mg/m3 voor vaste
      brandstoffen en van 1000 mg/m3 voor zware stookolie;
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel9
  - number: 9.4.c
    text: |-
      bij een stookinstallatie voor zware stookolie waarvoor op of na 27 november 2002 vergunning is verleend en waarvan
      het thermisch vermogen 50 MW of meer is, maar minder dan 100 MW, op basis van een emissie-eis van 850 mg/m3.
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel9
  - number: '9.5'
    text: |-
      In afwijking van het eerste lid geldt, indien bij of krachtens dit besluit geen emissie-eis voor zwaveldioxide is
      gesteld, als emissie-eis de emissie van zwaveldioxide die zou ontstaan door het verbranden van brandstoffen met het
      zwavelgehalte dat op grond van het [Besluit zwavelgehalte brandstoffen][ref1] ten hoogste is toegestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002939
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002939
  - number: '10.1'
    text: |-
      Indien ten aanzien van rookgassen die via verschillende schoorstenen naar de buitenlucht worden afgevoerd, tezamen
      één eis met betrekking tot de uitworp van zwaveloxiden of stikstofoxiden is gesteld, dan geldt die emissie-eis voor
      de gemiddelde uitworp via die schoorstenen.
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel10
  - number: '10.2'
    text: |-
      De middeling bedoeld in het eerste lid dient te geschieden naar rato van de volumeverdeling van de rookgassen over
      de schoorstenen.
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel10
  - number: 10a
    text: 'In plaats van de datum van de vergunningverlening geldt:'
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel10a
  - number: 10a.a
    text: |-
      indien van een stookinstallatie na de datum van vergunningverlening de combinatie van brander en
      vuurhaard door een andere combinatie wordt vervangen of daaraan veranderingen worden aangebracht,
      die met nieuwbouw van de stookinstallatie overeenkomen, dan wel de stookinstallatie geheel wordt
      vervangen, voor de toepassing van de [artikelen 11, derde lid][ref1], [12, derde en vierde lid][ref2],
      [13, tweede, derde en vierde lid][ref3], en [23][ref4], indien voor bedoelde verandering een vergunning als bedoeld
      in [artikel 8.1, eerste lid, aanhef en onder b, van de wet][ref5] is verleend, de datum waarop die vergunning is
      verleend, dan wel, indien zich een geval voordoet als bedoeld in [artikel 8.19, tweede lid, van de wet][ref6], de
      datum waarop het bevoegd gezag een verklaring als bedoeld in [artikel 8.19, tweede lid, onder c, van de wet][ref7]
      heeft afgegeven, dan wel, indien een dergelijke vergunning niet is verleend en zich geen geval voordoet als bedoeld
      in [artikel 8.19, tweede lid, van de wet][ref8], de datum waarop bedoelde verandering is uitgevoerd;


      [ref1]: https://wetten.overheid.nl/BWBR0004147#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0004147#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0004147#Artikel13
      [ref4]: https://wetten.overheid.nl/BWBR0004147#Artikel23
      [ref5]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref6]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref7]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref8]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0004147
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0004147
        artikel: '12'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0004147
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0004147
        artikel: '23'
        hoofdstuk: '2'
        paragraaf: '4'
      - id: ref5
        bwb_id: BWBR0003245
        artikel: '8'
      - id: ref6
        bwb_id: BWBR0003245
        artikel: '8'
      - id: ref7
        bwb_id: BWBR0003245
        artikel: '8'
      - id: ref8
        bwb_id: BWBR0003245
        artikel: '8'
  - number: 10a.b
    text: |-
      indien de capaciteit van een stookinstallatie met een thermisch vermogen van 50 MW of meer op of na 27
      november 2002 met 50 MW of meer wordt uitgebreid, voor de toepassing van dit besluit met betrekking tot het
      uitgebreide gedeelte van de installatie de datum waarop voor bedoelde verandering een vergunning als bedoeld
      in [artikel 8.1, eerste lid, aanhef en onder b, van de wet][ref1] is verleend dan wel, indien een dergelijke
      vergunning niet is verleend, de datum waarop bedoelde verandering is uitgevoerd;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
  - number: 10a.c
    text: |-
      indien een stookinstallatie met een thermisch vermogen van 50 MW of meer op of na 27 november 2002 wordt veranderd
      dan wel de werking hiervan na die datum wordt veranderd op een wijze die naar het oordeel van het bevoegd gezag
      negatieve en significante effecten kan hebben op mens of milieu, voorzover onderdeel b niet van toepassing
      is, voor de toepassing van dit besluit de datum waarop voor bedoelde verandering een vergunning als bedoeld
      in [artikel 8.1, eerste lid, aanhef en onder b, van de wet][ref1] is verleend, dan wel, indien een dergelijke
      vergunning niet is verleend, de datum waarop bedoelde verandering is uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
  - number: 10b
    text: |-
      Een stookinstallatie waarvoor voor 27 november 2002 een vergunning is aangevraagd en die voor 27 november 2003 in
      gebruik is genomen, wordt voor de toepassing van dit besluit gelijkgesteld aan een stookinstallatie waarvoor voor
      27 november 2002 vergunning is verleend.
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel10b
  - number: 10c
    text: |-
      Bij een stookinstallatie met een thermisch vermogen van 50 MW of meer waarvoor op of na 27 november 2002
      vergunning is verleend en bij een stookinstallatie met een thermisch vermogen van 50 MW of meer waarop
      [artikel 10a, tweede lid][ref1], van toepassing is, wordt de technische en economische haalbaarheid van
      warmtekrachtkoppeling onderzocht. Indien die haalbaarheid wordt bevestigd, wordt warmtekrachtkoppeling toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0004147#Artikel10a
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel10c
    references:
      - id: ref1
        bwb_id: BWBR0004147
        artikel: 10a
        hoofdstuk: '1'
  - number: '11.1'
    text: |-
      Een stookinstallatie voor vaste brandstoffen wordt zodanig gebruikt dat de uitworp van zwaveldioxide met het
      rookgas niet meer bedraagt dan:
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel11
  - number: 11.1.a
    text: 'indien het thermisch vermogen van de stookinstallatie 300 MW of meer is:'
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel11
  - number: 11.1.a.1°
    text: 'indien vergunning is verleend voor 1 januari 1990: 400 mg/m3;'
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel11
  - number: 11.1.a.2°
    text: 'indien vergunning is verleend op of na 1 januari 1990: 200 mg/m3;'
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel11
  - number: 11.1.b
    text: 'indien het thermisch vermogen van de stookinstallatie 100 MW of meer is, maar minder dan 300 MW:'
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel11
  - number: 11.1.b.1°
    text: 'indien vergunning is verleend voor 27 november 2002: 700 mg/m3;'
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel11
  - number: 11.1.b.2°
    text: 'indien vergunning is verleend op of na 27 november 2002: 200 mg/m3;'
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel11
  - number: 11.1.c
    text: 'indien het thermisch vermogen van de stookinstallatie 50 MW of meer is, maar minder dan 100 MW:'
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel11
  - number: 11.1.c.1°
    text: 'indien vergunning is verleend voor 27 november 2002: 700 mg/m3;'
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel11
  - number: 11.1.c.2°
    text: |-
      indien vergunning is verleend op of na 27 november 2002 en de stookinstallatie met biomassa wordt gestookt: 200
      mg/m3;
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel11
  - number: 11.1.c.3°
    text: |-
      indien vergunning is verleend op of na 27 november 2002 en de stookinstallatie met andere vaste brandstoffen dan
      biomassa wordt gestookt: 700 mg/m3;
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel11
  - number: 11.1.d
    text: 'indien het thermisch vermogen van de stookinstallatie minder is dan 50 MW: 700 mg/m3.'
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel11
  - number: '11.2'
    text: |-
      Een stookinstallatie voor vaste brandstoffen met een thermisch vermogen van 300 MW of meer wordt voorts zodanig
      gebruikt dat ten minste een ontzwavelingspercentage van 85 wordt bereikt.
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel11
  - number: '11.3'
    text: |-
      Een stookinstallatie voor vaste brandstoffen wordt zodanig gebruikt dat de emissie van stikstofoxiden met het
      rookgas niet meer bedraagt dan:
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel11
  - number: 11.3.a
    text: 'indien het thermisch vermogen van de stookinstallatie 500 MW of meer is:'
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel11
  - number: 11.3.a.1°
    text: 'indien vergunning is verleend voor 1 januari 1989: 400 mg/m3 en met ingang van 1 januari 2016: 200 mg/m3;'
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel11
  - number: 11.3.a.2°
    text: 'indien vergunning is verleend in 1989: 300 mg/m3 en met ingang van 1 januari 2016: 200 mg/m3;'
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel11
  - number: 11.3.a.3°
    text: 'indien vergunning is verleend op of na 1 januari 1990: 200 mg/m3;'
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel11
  - number: 11.3.b
    text: 'indien het thermisch vermogen van de stookinstallatie 300 MW of meer is, maar minder dan 500 MW:'
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel11
  - number: 11.3.b.1°
    text: 'indien vergunning is verleend voor 1 januari 1989: 400 mg/m3;'
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel11
  - number: 11.3.b.2°
    text: 'indien vergunning is verleend in 1989: 300 mg/m3;'
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel11
  - number: 11.3.b.3°
    text: 'indien vergunning is verleend op of na 1 januari 1990: 200 mg/m3;'
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel11
  - number: 11.3.c
    text: 'indien het thermisch vermogen van de stookinstallatie minder is dan 300 MW:'
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel11
  - number: 11.3.c.1°
    text: |-
      indien vergunning is verleend voor 1 augustus 1988: 650 mg/m3 en indien de stookinstallatie een thermisch vermogen
      heeft van 50 MW of meer met ingang van 1 januari 2008: 600 mg/m3;
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel11
  - number: 11.3.c.2°
    text: 'indien vergunning is verleend in de periode van 1 augustus 1988 tot en met 14 oktober 1992: 500 mg/m3;'
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel11
  - number: 11.3.c.3°
    text: 'indien vergunning is verleend in de periode van 15 oktober 1992 tot en met 31 december 1993: 200 mg/m3;'
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel11
  - number: 11.3.c.4°
    text: 'indien vergunning is verleend op of na 1 januari 1994: 100 mg/m3.'
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel11
  - number: '11.4'
    text: |-
      Een stookinstallatie voor vaste brandstoffen wordt zodanig gebruikt dat de uitworp van stof met het rookgas niet
      meer bedraagt dan:
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel11
  - number: 11.4.a
    text: 'indien voor 15 oktober 1992 vergunning is verleend: 50 mg/m3;'
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel11
  - number: 11.4.b
    text: |-
      indien op of na 15 oktober 1992 vergunning is verleend: 20 mg/m3 dan wel tijdens storingen in de voorzieningen voor
      de ontzwaveling van rookgassen indien krachtens [artikel 7][ref1] of [artikel 7a][ref2] de installatie in bedrijf
      mag worden gehouden: 50 mg/m3.


      [ref1]: https://wetten.overheid.nl/BWBR0004147#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0004147#Artikel7a
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0004147
        artikel: '7'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0004147
        artikel: 7a
        hoofdstuk: '1'
  - number: '12.1'
    text: |-
      Een stookinstallatie voor vloeibare brandstoffen, anders dan gasolie, wordt zodanig gebruikt dat de emissie van
      zwaveldioxide met het rookgas niet meer bedraagt dan:
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel12
  - number: 12.1.a
    text: 'indien het thermisch vermogen 300 MW of meer is: 200 mg/m3;'
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel12
  - number: 12.1.b
    text: 'indien het thermisch vermogen 100 MW of meer is, maar minder dan 300 MW:'
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel12
  - number: 12.1.b.1°
    text: 'indien vergunning is verleend voor 27 november 2002: 1700 mg/m3;'
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel12
  - number: 12.1.b.2°
    text: 'indien vergunning is verleend op of na 27 november 2002: 400 tot 200 mg/m3, lineair aflopend tussen 100 en 300 MW;'
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel12
  - number: 12.1.c
    text: 'indien het thermisch vermogen 50 MW of meer is, maar minder dan 100 MW:'
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel12
  - number: 12.1.c.1°
    text: 'indien vergunning is verleend voor 27 november 2002: 1700 mg/m3;'
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel12
  - number: 12.1.c.2°
    text: 'indien vergunning is verleend op of na 27 november 2002: 850 mg/m3;'
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel12
  - number: 12.1.d
    text: 'indien het thermisch vermogen minder dan 50 MW is: 1700 mg/m3.'
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel12
  - number: '12.2'
    text: |-
      Een stookinstallatie voor zware stookolie met een thermisch vermogen van 300 MW of meer wordt voorts zodanig
      gebruikt, dat ten minste een ontzwavelingspercentage van 85 wordt bereikt.
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel12
  - number: '12.3'
    text: |-
      Een procesfornuis voor vloeibare brandstoffen wordt zodanig gebruikt, dat de uitworp van stikstofoxiden met het
      rookgas niet meer bedraagt dan:
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel12
  - number: 12.3.a
    text: |-
      indien vergunning is verleend voor 15 september 1991: 450 mg/m3 en indien de stookinstallatie een thermisch
      vermogen heeft van 500 MW of meer: na 1 januari 2008 400 mg/m3;
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel12
  - number: 12.3.b
    text: 'indien in de periode van 15 september 1991 tot en met 14 oktober 1992 vergunning is verleend: 300 mg/m3;'
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel12
  - number: 12.3.c
    text: 'indien in de periode van 15 oktober 1992 tot en met 30 april 1998 vergunning is verleend: 200 mg/m3;'
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel12
  - number: 12.3.d
    text: 'indien op of na 1 mei 1998 vergunning is verleend: 120 mg/m3.'
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel12
  - number: '12.4'
    text: |-
      Een stookinstallatie voor vloeibare brandstoffen anders dan een procesfornuis, wordt zodanig gebruikt, dat de
      uitworp aan stikstofoxiden met het rookgas niet meer bedraagt dan:
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel12
  - number: 12.4.a
    text: |-
      indien vergunning is verleend voor 1 augustus 1988: 450 mg/m3 en indien de stookinstallatie een thermisch vermogen
      heeft van 500 MW of meer: na 1 januari 2008 400 mg/m3;
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel12
  - number: 12.4.b
    text: 'indien in de periode van 1 augustus 1988 tot en met 14 oktober 1992 vergunning is verleend: 300 mg/m3;'
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel12
  - number: 12.4.c
    text: 'indien in de periode van 15 oktober 1992 tot en met 30 april 1998 vergunning is verleend: 150 mg/m3;'
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel12
  - number: 12.4.d
    text: 'indien op of na 1 mei 1998 vergunning is verleend: 120 mg/m3.'
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel12
  - number: '12.5'
    text: |-
      Een stookinstallatie voor vloeibare brandstoffen met een thermisch vermogen van 50 MW of meer wordt zodanig
      gebruikt, dat de uitworp van stof met het rookgas niet meer bedraagt dan:
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel12
  - number: 12.5.a
    text: |-
      100 mg/m3 indien vergunning is verleend voor 27 november 2002, het thermisch vermogen kleiner is dan 500 MW en het
      asgehalte van de brandstof meer is dan 0,06 procent;
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel12
  - number: 12.5.b
    text: 30 mg/m3 indien vergunning is verleend op of na 27 november 2002 en het thermisch vermogen 100 MW of meer is;
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel12
  - number: 12.5.c
    text: 50 mg/m3 in andere gevallen dan bedoeld onder a of b.
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel12
  - number: '12.6'
    text: |-
      Indien in een stookinstallatie met een thermisch vermogen van minder dan 50 MW die gewoonlijk met aardgas wordt
      gestookt, slechts zware stookolie of gasolie wordt gestookt in het geval geen levering van aardgas kan plaatsvinden
      wegens weersomstandigheden of storingen in de aardgastoevoer, zijn het eerste lid, aanhef en onder a, en het tweede
      tot en met vijfde lid niet van toepassing. Bij een stookinstallatie met een thermisch vermogen van 50 MW of meer
      zijn in het in het eerste lid bedoelde geval de in de eerste volzin bedoelde leden gedurende ten hoogste 240 uur
      per incident niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel12
  - number: '12.7'
    text: |-
      Een stookinstallatie als bedoeld in het zesde lid waarin zware stookolie wordt gestookt, wordt zodanig gebruikt dat
      de uitworp van zwaveldioxide met het rookgas niet meer bedraagt dan 1700 mg/m3.
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel12
  - number: '12.8'
    text: |-
      Van elk geval van het stoken van zware stookolie of gasolie in de in het zesde lid genoemde omstandigheden dient
      terstond melding te worden gemaakt aan het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel12
  - number: '13.1'
    text: |-
      Een stookinstallatie voor gasvormige brandstoffen wordt zodanig gebruikt, dat de uitworp van zwaveldioxide met het
      rookgas niet meer bedraagt dan:
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel13
  - number: 13.1.a
    text: 'voor gasvormige brandstoffen die afkomstig zijn uit een raffinaderij:'
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel13
  - number: 13.1.a.1°
    text: |-
      800 mg/m3, ingeval het gassen betreft met een lage specifieke warmte-inhoud afkomstig van de laatste fase van
      omzetting van raffinage-residuen in petroleumcokes, die gestookt worden in een stookinstallatie waarvoor voor 27
      november 2002 vergunning is verleend of in een stookinstallatie met een thermisch vermogen van minder dan 50 MW;
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel13
  - number: 13.1.a.2°
    text: 35 mg/m3, in geval het andere dan de onder 1° bedoelde gassen betreft;
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel13
  - number: 13.1.b
    text: 400 mg/m3 voor cokesovengas;
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel13
  - number: 13.1.c
    text: 150 mg/m3 voor hoogovengas;
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel13
  - number: 13.1.d
    text: 35 mg/m3 voor oxygas;
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel13
  - number: 13.1.e
    text: 5 mg/m3 voor LPG;
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel13
  - number: 13.1.f
    text: |-
      35 mg/m3 voor andere dan de onder *a* tot en met *e* bedoelde gasvormige brandstoffen, behalve gas, verkregen
      door vergassing van kolen, dat gestookt wordt in een stookinstallatie waarvoor voor 27 november 2002 vergunning is
      verleend of in een stookinstallatie met een thermisch vermogen van minder dan 50 MW.
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel13
  - number: '13.2'
    text: |-
      Een procesfornuis voor in de inrichting gegenereerde gasvormige brandstoffen wordt zodanig gebruikt dat de uitworp
      van stikstofoxiden met het rookgas niet meer bedraagt dan:
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel13
  - number: 13.2.a
    text: |-
      indien vergunning is verleend voor 15 september 1991: 350 mg/m3 en indien de stookinstallatie een thermisch
      vermogen heeft van 50 MW of meer met ingang van 1 januari 2008:
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel13
  - number: 13.2.a.1°
    text: 200 mg/m3, indien de stookinstallatie een thermisch vermogen heeft van 500 MW of meer;
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel13
  - number: 13.2.a.2°
    text: 300 mg/m3, indien de stookinstallatie een thermisch vermogen heeft van minder dan 500 MW;
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel13
  - number: 13.2.b
    text: 'indien vergunning is verleend in de periode van 15 september 1991 tot en met 30 april 1998: 200 mg/m3;'
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel13
  - number: 13.2.c
    text: 'indien vergunning is verleend op of na 1 mei 1998:'
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel13
  - number: 13.2.c.1°
    text: |-
      ingeval de uittreedtemperatuur van het medium waaraan de warmte wordt overgedragen lager is dan 600° C en geen
      luchtvoorverwarming wordt toegepast: 110 mg/m3;
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel13
  - number: 13.2.c.2°
    text: 'in de overige gevallen: 140 mg/m3.'
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel13
  - number: '13.3'
    text: |-
      Een procesfornuis voor andere gasvormige brandstoffen dan bedoeld in het tweede lid wordt zodanig gebruikt dat de
      uitworp van stikstofoxiden met het rookgas niet meer bedraagt dan:
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel13
  - number: 13.3.a
    text: |-
      indien vergunning is verleend voor 15 september 1991: 350 mg/m3 en indien de stookinstallatie een thermisch
      vermogen heeft van 50 MW of meer met ingang van 1 januari 2008:
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel13
  - number: 13.3.a.1°
    text: 200 mg/m3, indien de stookinstallatie een thermisch vermogen heeft van 500 MW of meer;
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel13
  - number: 13.3.a.2°
    text: 300 mg/m3, indien de stookinstallatie een thermisch vermogen heeft van minder dan 500 MW;
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel13
  - number: 13.3.b
    text: 'indien vergunning is verleend in de periode van 15 september 1991 tot en met 14 oktober 1992: 200 mg/m3;'
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel13
  - number: 13.3.c
    text: 'indien vergunning is verleend in de periode van 15 oktober 1992 tot en met 30 april 1998: 150 mg/m3;'
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel13
  - number: 13.3.d
    text: 'indien vergunning is verleend op of na 1 mei 1998:'
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel13
  - number: 13.3.d.1°
    text: |-
      80 mg/m3, ingeval de uittreedtemperatuur van het medium waaraan de warmte wordt overgedragen lager is dan 600° C en
      geen luchtvoorverwarming wordt toegepast;
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel13
  - number: 13.3.d.2°
    text: 110 mg/m3 in de overige gevallen.
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel13
  - number: '13.4'
    text: |-
      Een stookinstallatie voor gasvormige brandstoffen anders dan bedoeld in het tweede en derde lid, wordt zodanig
      gebruikt dat de uitworp van stikstofoxiden met het rookgas niet meer bedraagt dan:
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel13
  - number: 13.4.a
    text: |-
      indien vergunning is verleend voor 1 augustus 1988: 350 mg/m3 en indien de stookinstallatie een thermisch vermogen
      heeft van 50 MW of meer met ingang van 1 januari 2008:
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel13
  - number: 13.4.a.1°
    text: 200 mg/m3, indien de stookinstallatie een thermisch vermogen heeft van 500 MW of meer;
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel13
  - number: 13.4.a.2°
    text: 300 mg/m3, indien de stookinstallatie een thermisch vermogen heeft van minder dan 500 MW;
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel13
  - number: 13.4.b
    text: 'indien vergunning is verleend in de periode van 1 augustus 1988 tot en met 14 oktober 1992: 200 mg/m3;'
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel13
  - number: 13.4.c
    text: 'indien vergunning is verleend in de periode van 15 oktober 1992 tot en met 30 april 1998:'
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel13
  - number: 13.4.c.1°
    text: 200 mg/m3 voor brandstoffen als bedoeld in het tweede lid;
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel13
  - number: 13.4.c.2°
    text: 100 mg/m3 voor overige brandstoffen.
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel13
  - number: 13.4.d
    text: 'indien vergunning is verleend op of na 1 mei 1998: 70 mg/m3.'
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel13
  - number: '13.5'
    text: |-
      Een stookinstallatie voor gasvormige brandstoffen wordt zodanig gebruikt dat de uitworp van stof met het rookgas
      niet meer bedraagt dan:
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel13
  - number: 13.5.a
    text: 20 mg/m3 voor cokesovengas, oxygas dan wel mengsels van deze gassen met hoogovengas;
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel13
  - number: 13.5.b
    text: 10 mg/m3 voor hoogovengas, voor zover niet vermengd met cokesovengas of oxygas;
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel13
  - number: 13.5.c
    text: 5 mg/m3 voor andere dan de onder *a* en *b* bedoelde gasvormige brandstoffen.
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel13
  - number: '14'
    text: Het bepaalde in § 1 is niet van toepassing op bestaande stookinstallaties.
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel14
  - number: '15.1'
    text: |-
      Een bestaande stookinstallatie voor kolen met een thermisch vermogen van 300 MW of meer wordt zodanig gebruikt dat
      de uitworp van zwaveldioxide met het rookgas niet meer bedraagt dan 400 mg/m3.
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel15
  - number: '15.2'
    text: |-
      Een stookinstallatie als bedoeld in het eerste lid wordt zodanig gebruikt dat ten minste een
      ontzwavelingspercentage van 85 wordt bereikt.
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel15
  - number: '15.3'
    text: |-
      Een bestaande stookinstallatie voor kolen met een thermisch vermogen van 300 MW of meer wordt, indien deze na 1
      januari 1989 nog 10.000 uren, herleid op uren bij een belasting van 100 procent, in gebruik zal zijn, met ingang
      van die datum zodanig gebruikt dat de uitworp van stikstofoxiden met het rookgas niet meer bedraagt dan 1100 mg/m3
      bij gebruik van poederkool en ten hoogste 1000 mg/m3 in andere gevallen.
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel15
  - number: '15.4'
    text: |-
      Een bestaande stookinstallatie als bedoeld in het derde lid, alsmede een bestaande stookinstallatie voor kolen
      met een thermisch vermogen van minder dan 300 MW maar van meer dan 20 MW wordt zodanig gebruikt dat de uitworp van
      stikstofoxiden met het rookgas niet meer bedraagt dan 650 mg/m3.
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel15
  - number: '16.1'
    text: |-
      Een bestaande stookinstallatie voor zware stookolie met een thermisch vermogen van 300 MW of meer wordt zodanig
      gebruikt dat de uitworp van zwaveldioxide met het rookgas niet meer bedraagt dan 400 mg/m3.
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel16
  - number: '16.2'
    text: |-
      Een stookinstallatie als bedoeld in het eerste lid wordt zodanig gebruikt dat ten minste een
      ontzwavelingspercentage van 85 wordt bereikt.
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel16
  - number: '16.3'
    text: |-
      Een bestaande stookinstallatie voor vloeibare brandstoffen wordt, indien deze na 1 januari 1989 nog 10.000 uren,
      herleid op uren bij een belasting van 100 procent, in gebruik zal zijn, met ingang van die datum zodanig gebruikt
      dat de uitworp van stikstofoxiden met het rookgas niet meer bedraagt dan 700 mg/m3.
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel16
  - number: '16.4'
    text: |-
      Voor een stookinstallatie als bedoeld in het derde lid, niet behorend tot een elektriciteits-produktiebedrijf,
      geldt in plaats van de in het derde lid vermelde waarde van 700 mg/m3 een waarde van:
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel16
  - number: 16.4.a
    text: |-
      voor zware stookolie en voor in de inrichting gegenereerde vloeibare brandstoffen met een stikstofgehalte groter
      dan 0,3 procent: 400 mg/m3;
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel16
  - number: 16.4.b
    text: 'voor andere vloeibare brandstoffen dan bedoeld onder *a* : 200 mg/m3.'
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel16
  - number: '16.5'
    text: |-
      Het eerste tot en met het vierde lid zijn niet van toepassing met betrekking tot een stookinstallatie waarin
      zowel aardgas als zware stookolie of gasolie kan worden gestookt, indien slechts zware stookolie of gasolie wordt
      gestookt:
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel16
  - number: 16.5.a
    text: |-
      ingeval in verband met de weersomstandigheden of storingen in de aardgastoevoer geen levering van aardgas kan
      plaatsvinden;
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel16
  - number: 16.5.b
    text: |-
      teneinde een noodzakelijke verversing van de voorraad zware stookolie of gasolie, die wordt aangehouden met het
      oog op de omstandigheden, bedoeld onder *a* , dan wel op grond van de Wet voorraadvorming aardolieprodukten (*Stb.*
      1986, 675), mogelijk te maken.
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel16
  - number: '16.6'
    text: |-
      Een bestaande stookinstallatie voor zware stookolie wordt, voor zover een eis als gesteld in het eerste of tweede
      lid niet of nog niet van toepassing is, zodanig gebruikt dat de uitworp van zwaveldioxide met het rookgas niet meer
      bedraagt dan 1700 mg/m3.
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel16
  - number: '16.7'
    text: |-
      Van elk geval van het stoken van zware stookolie of gasolie in de in het vijfde lid genoemde omstandigheden dient
      terstond melding te worden gemaakt aan het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel16
  - number: '17.1'
    text: |-
      Een bestaande stookinstallatie voor gasvormige brandstoffen wordt, indien deze na 1 januari 1989 nog tenminste
      10.000 uren, herleid op uren bij een belasting van 100 procent, in gebruik zal zijn, zodanig gebruikt, dat de
      uitworp van stikstofoxiden met het rookgas niet meer bedraagt dan:
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel17
  - number: 17.1.a
    text: 'met ingang van 1 januari 1989: 500 mg/m3;'
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel17
  - number: 17.1.b
    text: voor stookinstallaties niet behorend tot een elektriciteitsproduktiebedrijf
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel17
  - number: 17.1.b.1°
    text: 150 mg/m3,
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel17
  - number: 17.1.b.2°
    text: |-
      zodra de branders op of na 1 mei 1998 worden vervangen: 70 mg/m3, bij stookinstallaties met een thermisch vermogen
      van 10 MW of minder waarin de warmte wordt overgedragen aan water, stoom of thermische olie.
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel17
  - number: '17.2'
    text: |-
      Een bestaande stookinstallatie voor gasvormige brandstoffen die afkomstig zijn uit een raffinaderij, wordt zodanig
      gebruikt dat de uitworp van zwaveldioxide met het rookgas niet meer bedraagt dan:
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel17
  - number: 17.2.a
    text: |-
      800 mg/m3, ingeval het gas betreft met een lage specifieke warmte-inhoud afkomstig van de laatste fase van de
      omzetting van raffinageresiduen in petroleumcokes;
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel17
  - number: 17.2.b
    text: |-
      35 mg/m3, ingeval het andere dan [de onder ][ref1] bedoelde gassen betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0004147#Artikel17
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0004147
        artikel: '17'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '17.3'
    text: |-
      Een bestaande stookinstallatie voor gasvormige brandstoffen bestaande uit cokesovengas, hoogovengas of oxygas, dan
      wel een mengsel van twee of meer van deze gassen, of van een of meer van deze gassen met aardgas, wordt zodanig
      gebruikt dat de uitworp met het rookgas niet meer bedraagt dan:
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel17
  - number: 17.3.a
    text: 'voor zwaveldioxide:'
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel17
  - number: 17.3.a.1°
    text: 400 mg/m3 voor cokesovengas;
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel17
  - number: 17.3.a.2°
    text: 150 mg/m3 voor hoogovengas;
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel17
  - number: 17.3.a.3°
    text: 35 mg/m3 voor oxygas;
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel17
  - number: 17.3.b
    text: voor stof 20 mg/m3.
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel17
  - number: '17.4'
    text: |-
      Bij het gebruik van aardgas in combinatie met een of meer andere brandstoffen wordt voor de berekening van de
      uitworp van zwaveldioxide met het rookgas een waarde van 35 mg/m3 gehanteerd.
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel17
  - number: '18.1'
    text: |-
      [Artikel 9][ref1] en de [paragrafen 1][ref2] en [2][ref3] van dit hoofdstuk, voorzover de toepassing daarvan
      betrekking heeft op de emissie van zwaveldioxide, zijn niet van toepassing op stookinstallaties in een
      raffinaderij.


      [ref1]: https://wetten.overheid.nl/BWBR0004147#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0004147#Hoofdstuk2
      [ref3]: https://wetten.overheid.nl/BWBR0004147#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0004147
        artikel: '9'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0004147
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0004147
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '18.2'
    text: |-
      In een raffinaderij bedraagt de concentratie aan zwaveldioxide, gemiddeld over de rookgassen die afkomstig zijn
      van:
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel18
  - number: 18.2.a
    text: de bestaande stookinstallaties niet meer dan 1700 mg/m3 en met ingang van 1 januari 2008 niet meer dan 1000 mg/m3;
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel18
  - number: 18.2.b
    text: |-
      de stookinstallaties waarvoor op of na 29 mei 1987 maar voor 27 november 2002 vergunning is verleend, en de
      stookinstallaties met een vermogen van minder dan 50 MW waarvoor op of na 27 november 2002 vergunning is verleend,
      niet meer dan 1000 mg/m3;
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel18
  - number: 18.2.c
    text: |-
      de stookinstallaties met een thermisch vermogen van 50 MW of meer waarvoor op of na 27 november 2002 vergunning is
      verleend, niet meer dan 600 mg/m3.
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel18
  - number: '18.3'
    text: |-
      Onverminderd het tweede lid, bedraagt in een raffinaderij de massahoeveelheid zwaveldioxide die per tijdseenheid
      met de rookgassen die afkomstig zijn van de stookinstallaties wordt geëmitteerd, vermeerderd met de in die
      tijdseenheid geëmitteerde hoeveelheid zwaveloxiden, afkomstig van de omzetting van zwavelwaterstof in zwavel,
      berekend als zwaveldioxide, gedeeld door het totale volume van de in die tijdseenheid geëmitteerde rookgassen, niet
      meer dan 1000 mg/m3.
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel18
  - number: '19'
    text: |-
      [Artikel 9][ref1] en de bepalingen van § [1][ref2] en § [2][ref3] van dit hoofdstuk voor zover de toepassing
      daarvan betrekking heeft op de uitworp van stikstofoxiden, zijn niet van toepassing op gasturbines, gasturbine-
      installaties en zuigermotoren.


      [ref1]: https://wetten.overheid.nl/BWBR0004147#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0004147#Hoofdstuk2
      [ref3]: https://wetten.overheid.nl/BWBR0004147#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0004147
        artikel: '9'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0004147
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0004147
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '20.1'
    text: |-
      Een gasturbine of gasturbine-installatie wordt zodanig gebruikt dat de emissie van stikstofoxiden met het rookgas,
      betrokken op de warmte-inhoud van de toegevoerde brandstof, niet meer bedraagt dan:
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel20
  - number: 20.1.a
    text: |-
      voor een gasturbine, waarvoor voor 1 mei 1998 vergunning is verleend: 200 g/GJ, vermenigvuldigd met een factor
      gelijk aan eendertigste van het gasturbinerendement en teruggerekend op ISO-luchtcondities;
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel20
  - number: 20.1.b
    text: |-
      voor een gasturbine, waarvoor op of na 1 mei 1998, maar voor 27 november 2002 vergunning is verleend en voor
      een gasturbine met een thermisch vermogen van minder dan 50 MW, waarvoor op of na 27 november 2002 vergunning is
      verleend: 65 g/GJ, teruggerekend op ISO-luchtcondities;
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel20
  - number: 20.1.c
    text: |-
      voor een met aardgas gestookte gasturbine met een thermisch vermogen van 50 MW of meer, waarvoor op of na 27
      november 2002 vergunning is verleend: 45 g/GJ;
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel20
  - number: 20.1.d
    text: |-
      voor een met andere brandstoffen dan aardgas gestookte gasturbine met een thermisch vermogen van 50 MW of meer,
      waarvoor op of na 27 november 2002 vergunning is verleend: 65 g/GJ;
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel20
  - number: 20.1.e
    text: |-
      voor een gasturbine-installatie, waarvoor voor 27 november 2002 vergunning is verleend, en voor een gasturbine-
      installatie met een thermisch vermogen van minder dan 50 MW, waarvoor op of na 27 november 2002 vergunning
      is verleend: 65 g/GJ, vermenigvuldigd met een factor gelijk aan eendertigste van het gasturbinerendement en
      teruggerekend op ISO-luchtcondities;
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel20
  - number: 20.1.f
    text: |-
      voor een met aardgas gestookte gasturbine-installatie met een thermisch vermogen van 50 MW of meer, waarvoor op of
      na 27 november 2002 vergunning is verleend: 45 g/GJ;
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel20
  - number: 20.1.g
    text: |-
      voor een met andere brandstoffen dan aardgas gestookte gasturbine-installatie met een thermisch vermogen van 50 MW
      of meer, waarvoor op of na 27 november 2002 vergunning is verleend: 65 g/GJ.
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel20
  - number: '20.2'
    text: Bij toepassing van het eerste lid wordt een vermenigvuldigingsfactor die kleiner is dan 1, gesteld op 1.
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel20
  - number: '20.3'
    text: |-
      In afwijking van het bepaalde in het eerste lid wordt, indien in een gasturbine of gasturbine-installatie andere
      gasvormige brandstoffen dan aardgas van standaardkwaliteit worden gestookt, de factor, bedoeld in het eerste lid,
      onder a en e, vermenigvuldigd met een factor die gelijk is aan de verhouding van de onderste verbrandingswaarde
      van de ingezette brandstof, uitgedrukt in MJ/kg, tot een verbrandingswaarde van 38 MJ/kg, met dien verstande dat de
      laatstgenoemde factor minimaal 0,9 en maximaal 1,1 bedraagt.
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel20
  - number: 20a.1
    text: |-
      [Artikel 20][ref1] is niet van toepassing op een bestaande gasturbine of een bestaande gasturbine-installatie.


      [ref1]: https://wetten.overheid.nl/BWBR0004147#Artikel20
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel20a
    references:
      - id: ref1
        bwb_id: BWBR0004147
        artikel: '20'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 20a.2
    text: |-
      Een bestaande gasturbine of gasturbine-installatie wordt, indien deze na 31 december 1989 tenminste nog 25000 uren
      in bedrijf zal zijn, zodanig gebruikt, dat, teruggerekend op ISO-luchtcondities, de uitworp van stikstofoxiden met
      het rookgas, betrokken op de warmte-inhoud van de toegevoerde brandstof, niet meer bedraagt dan:
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel20a
  - number: 20a.2.a
    text: 'voor een gasturbine: 200 g/GJ;'
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel20a
  - number: 20a.2.b
    text: 'voor een gasturbine-installatie: 135 g/GJ;'
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel20a
  - number: 20a.3
    text: Bij toepassing van het tweede lid wordt een vermenigvuldigingsfactor die kleiner is dan een, gesteld op een.
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel20a
  - number: 20a.4
    text: |-
      In afwijking van het bepaalde in het tweede lid wordt, indien in een gasturbine of gasturbine-installatie andere
      gasvormige brandstoffen dan aardgas van standaardkwaliteit worden gestookt, de factor, vermeld in het tweede lid,
      vermenigvuldigd met een factor die gelijk is aan de verhouding van de onderste verbrandingswaarde van de ingezette
      brandstof, uitgedrukt in MJ/kg, tot een verbrandingswaarde van 38 MJ/kg, met dien verstande dat de laatstgenoemde
      factor minimaal 0,9 en maximaal 1,1 bedraagt.
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel20a
  - number: 20a.5
    text: |-
      Voor een bestaande gasturbine-installatie, niet behorend tot een elektriciteits-produktiebedrijf, geldt, indien
      deze na 31 december 1993 tenminste nog 25000 uren in bedrijf zal zijn, in plaats van de in het tweede lid, onder
      *b*, vermelde waarde van 135 g/GJ een waarde van 65 g/GJ.
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel20a
  - number: '21.1'
    text: |-
      De [artikelen 20][ref1] en [20a][ref2] zijn niet van toepassing op een gasturbine die onderdeel uitmaakt van
      een combinatie van een gasturbine met een andere stookinstallatie, zonder dat deze combinatie een gasturbine-
      installatie in de zin van [artikel 1][ref3] vormt.


      [ref1]: https://wetten.overheid.nl/BWBR0004147#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0004147#Artikel20a
      [ref3]: https://wetten.overheid.nl/BWBR0004147#Artikel1
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0004147
        artikel: '20'
        hoofdstuk: '2'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0004147
        artikel: 20a
        hoofdstuk: '2'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0004147
        artikel: '1'
        hoofdstuk: '1'
  - number: '21.2'
    text: |-
      Voor een combinatie van installaties als bedoeld in het eerste lid geldt voor de uitworp van stikstofoxiden met het
      rookgas uitsluitend de emissie-eis voor die andere stookinstallatie, met dien verstande dat het thermisch vermogen
      daarvan gesteld wordt op de som van de thermische vermogens van die stookinstallatie en de gasturbine.
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel21
  - number: '21.3'
    text: |-
      Indien in een geval als bedoeld in het tweede lid [artikel 13, derde lid, onder b, of vierde lid, onder b][ref1],
      van toepassing is, geldt in plaats van de in die leden vermelde waarde van 200 mg/m3 voor stookinstallaties met
      een thermisch vermogen van minder dan 500 MW een waarde van 240 mg/m3 en voor stookinstallaties met een thermisch
      vermogen van 500 MW of meer tot 1 januari 2008 een waarde van 240 mg/m3 en na die datum een waarde van 200 mg/m3.


      [ref1]: https://wetten.overheid.nl/BWBR0004147#Artikel13
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0004147
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '22.1'
    text: |-
      Indien een gasturbine die behoort tot een elektriciteits-produktiebedrijf is gecombineerd met een andere
      stookinstallatie waarin meer extra brandstoffen worden bijgestookt dan een hoeveelheid die overeenkomt met
      anderhalfmaal het thermisch vermogen van de gasturbine, bedraagt voor deze combinatie de toegestane uitworp
      aan stikstofoxiden met het rookgas in afwijking van het bepaalde in de [artikelen 20][ref1], [20a][ref2] en
      [21][ref3] niet meer dan het gemiddelde van de eisen die voor de gasturbine en voor de andere stookinstallatie
      elk afzonderlijk zouden gelden, waarbij het gemiddelde wordt berekend naar verhouding van de warmte-inhoud van de
      toegevoerde brandstoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0004147#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0004147#Artikel20a
      [ref3]: https://wetten.overheid.nl/BWBR0004147#Artikel21
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0004147
        artikel: '20'
        hoofdstuk: '2'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0004147
        artikel: 20a
        hoofdstuk: '2'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0004147
        artikel: '21'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: '22.2'
    text: |-
      De [artikelen 20, eerste lid, onder e tot en met g][ref1], en [20a, tweede lid, onder b][ref2], zijn van
      overeenkomstige toepassing op een gasturbine als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0004147#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0004147#Artikel20a
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0004147
        artikel: '20'
        hoofdstuk: '2'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0004147
        artikel: 20a
        hoofdstuk: '2'
        paragraaf: '4'
  - number: '22.3'
    text: |-
      De [artikelen 20][ref1] en [20a, tweede lid][ref2], zijn op een gasturbine als bedoeld in het eerste
      lid niet van toepassing, indien in de bijbehorende stookinstallatie in de omstandigheden bedoeld in de
      [artikelen 12, zesde lid][ref3], of [artikel 16, vijfde lid][ref4], zware stookolie wordt gestookt.


      [ref1]: https://wetten.overheid.nl/BWBR0004147#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0004147#Artikel20a
      [ref3]: https://wetten.overheid.nl/BWBR0004147#Artikel12
      [ref4]: https://wetten.overheid.nl/BWBR0004147#Artikel16
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0004147
        artikel: '20'
        hoofdstuk: '2'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0004147
        artikel: 20a
        hoofdstuk: '2'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0004147
        artikel: '12'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0004147
        artikel: '16'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '23.1'
    text: |-
      Een zuigermotor waarin het aandeel van gasvormige brandstoffen in de warmte-inhoud van de toegevoerde brandstoffen
      50 procent of meer bedraagt wordt zodanig gebruikt, dat, teruggerekend op ISO-luchtcondities, de uitworp van
      stikstofoxiden met het rookgas, betrokken op de warmte-inhoud van de toegevoerde brandstof, niet meer bedraagt dan:
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel23
  - number: 23.1.a
    text: 'bij een asvermogen van meer dan 50 kW:'
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel23
  - number: 23.1.a.1°
    text: 'indien vergunning is verleend in de periode van 29 mei 1987 tot en met 31 december 1989: 800 g/GJ;'
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel23
  - number: 23.1.a.2°
    text: 'indien vergunning is verleend op of na 1 januari 1990, maar voor 1 januari 1994: 270 g/GJ;'
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel23
  - number: 23.1.a.3°
    text: |-
      indien vergunning is verleend op of na 1 januari 1994: 140 g/GJ; vermenigvuldigd met eendertigste van het
      motorrendement.
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel23
  - number: 23.1.b
    text: 'bij een asvermogen van 50 kW of minder: 800 g/GJ, vermenigvuldigd met eendertigste van het motorrendement.'
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel23
  - number: '23.2'
    text: |-
      Een zuigermotor waarin het aandeel van gasvormige brandstoffen in de warmte-inhoud van de toegevoerde brandstoffen
      minder bedraagt dan 50 procent wordt zodanig gebruikt, dat, teruggerekend op ISO-luchtcondities, de uitworp van
      stikstofoxiden met het rookgas, betrokken op de warmte-inhoud van de toegevoerde brandstof, niet meer bedraagt dan:
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel23
  - number: 23.2.a
    text: 'indien vergunning is verleend voor 1 januari 1990 of indien het asvermogen 50 kW of minder is: 1200 g/GJ;'
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel23
  - number: 23.2.b
    text: 'indien vergunning is verleend op of na 1 januari 1990 en het asvermogen meer is dan 50 kW: 400 g/GJ;'
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel23
  - number: 23a.1
    text: |-
      [Artikel 23][ref1] is niet van toepassing op een bestaande zuigermotor.


      [ref1]: https://wetten.overheid.nl/BWBR0004147#Artikel23
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel23a
    references:
      - id: ref1
        bwb_id: BWBR0004147
        artikel: '23'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 23a.2
    text: |-
      Een bestaande zuigermotor met een asvermogen van meer dan 50 kW waarin het aandeel van gasvormige brandstoffen
      in de warmte-inhoud van de toegevoerde brandstoffen 50 procent of meer bedraagt wordt zodanig gebruikt, dat,
      teruggerekend op ISO-luchtcondities, de uitworp van stikstofoxiden met het rookgas, betrokken op de warmte-inhoud
      van de toegevoerde brandstof, niet meer bedraagt dan 500 g/GJ.
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel23a
  - number: '24.1'
    text: |-
      Indien ten aanzien van een procesfornuis waarin de vuurhaardtemperatuur hoger is dan 760° C,
      [artikel 17, eerste lid, onder b, onder 1°][ref1], van toepassing is, kan het bevoegd gezag in plaats
      van de in bedoeld artikelonderdeel genoemde emissie-eis bij nadere eis - met inachtneming van het zesde
      lid en [artikel 25, derde lid][ref2], - een emissie-eis vaststellen, waarvan de waarde wordt berekend door
      vermenigvuldiging van de in bedoeld artikelonderdeel aangegeven waarde met een factor voor de vuurhaardtemperatuur,
      zijnde: waarbij T is de temperatuur, uitgedrukt in graden Celsius, gemeten in de vuurhaard in het gebied waar het
      stralingsgedeelte overgaat in het convectiegedeelte, afgeschermd van de vlam.


      [ref1]: https://wetten.overheid.nl/BWBR0004147#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0004147#Artikel25
