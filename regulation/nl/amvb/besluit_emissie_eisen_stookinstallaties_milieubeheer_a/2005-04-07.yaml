    text: |-
      Het bevoegd gezag kan een strengere emissie-eis stellen dan een in dit besluit gestelde emissie-eis of dan met
      toepassing van het eerste, tweede of derde lid mogelijk is, indien:
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel27
  - number: 27.4.a
    text: de aanvrager of houder van een vergunning in staat en bereid is om aan die strengere emissie-eis te voldoen of
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel27
  - number: 27.4.b
    text: |-
      volgens de actuele stand der techniek aan die strengere emissie-eis kan worden voldaan, terwijl voor de betreffende
      stookinstallatie op grond van [artikel 28][ref1] een minder strenge emissie-eis was voorgeschreven of voor een
      andere stookinstallatie in de inrichting is voorgeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0004147#Artikel28
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0004147
        artikel: '28'
        hoofdstuk: '3'
  - number: '28.1'
    text: |-
      Het bevoegd gezag kan, de inspecteur gehoord, voor een bestaande stookinstallatie minder strenge emissie-
      eisen dan de in de [artikelen 15, vierde lid][ref1], [16, derde lid][ref2], [17, eerste lid][ref3],
      [20a, tweede lid, onder b][ref4], en [20a, vijfde lid][ref5], gestelde emissie-eisen stellen, voor zover naar zijn
      oordeel de installatie, gezien de actuele stand der techniek, niet zodanig kan worden aangepast of verbouwd dat aan
      het bepaalde in genoemde artikelleden kan worden voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0004147#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0004147#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0004147#Artikel17
      [ref4]: https://wetten.overheid.nl/BWBR0004147#Artikel20a
      [ref5]: https://wetten.overheid.nl/BWBR0004147#Artikel20a
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0004147
        artikel: '15'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004147
        artikel: '16'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0004147
        artikel: '17'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0004147
        artikel: 20a
        hoofdstuk: '2'
        paragraaf: '4'
      - id: ref5
        bwb_id: BWBR0004147
        artikel: 20a
        hoofdstuk: '2'
        paragraaf: '4'
  - number: '28.2'
    text: |-
      Het bevoegd gezag kan, de inspecteur gehoord, voor een gasturbine-installatie waarvoor voor 15 oktober 1992
      vergunning is verleend een minder strenge emissie-eis stellen dan de in [artikel 20, eerste lid, onder e][ref1],
      gestelde emissie-eis voor zover naar zijn oordeel de gasturbine-installatie gezien de actuele stand der techniek
      niet zodanig kan worden aangepast of verbouwd dat aan laatstgenoemd artikelonderdeel kan worden voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0004147#Artikel20
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0004147
        artikel: '20'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: '28.3'
    text: |-
      Het bevoegd gezag kan, de inspecteur gehoord, voor een bestaande zuigermotor voor andere gassen dan aardgas of
      voor een bestaande zuigermotor als bedoeld in [artikel 2, onder a, aanhef en onder 2°][ref1], een minder strenge
      emissie-eis stellen dan de in [artikel 23a][ref2] gestelde emissie-eis voor zover naar zijn oordeel de zuigermotor
      gezien de actuele stand der techniek niet zodanig kan worden aangepast of verbouwd dat aan laatstgenoemd
      artikelonderdeel kan worden voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0004147#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0004147#Artikel23a
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0004147
        artikel: '2'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0004147
        artikel: 23a
        hoofdstuk: '2'
        paragraaf: '4'
  - number: '28.4'
    text: |-
      Het bepaalde in het eerste, tweede en derde lid is slechts van toepassing, indien een desbetreffend voorschrift
      vóór het tijdstip waarop het bepaalde in een in dat lid genoemd artikel op de stookinstallatie van toepassing
      wordt, in de vergunning is opgenomen.
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel28
  - number: '28.5'
    text: |-
      Het bevoegd gezag kan, de inspecteur gehoord, voor een stookinstallatie in de procesindustrie minder strenge
      emissie-eisen stellen:
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel28
  - number: 28.5.a
    text: |-
      in de in het zevende en achtste lid aangegeven gevallen, voor zover naar zijn oordeel bij de actuele stand van de
      techniek de stookinstallatie niet zodanig kan worden gebouwd, onderscheidenlijk aangepast of verbouwd, dat aan het
      bepaalde in die leden kan worden voldaan;
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel28
  - number: 28.5.b
    text: |-
      in de in het negende lid aangegeven geval, voor zover naar zijn oordeel bij de actuele stand van de techniek de
      bestaande stookinstallatie niet zodanig kan worden aangepast of verbouwd, dat aan het bepaalde in dat lid kan
      worden voldaan.
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel28
  - number: '28.6'
    text: |-
      De actuele stand van de techniek, bedoeld in het vijfde lid, dient mede te worden bezien in relatie tot het in het
      belang van het milieu verantwoorde gebruik van in de inrichting gegenereerde brandstoffen en voor zover het een
      procesfornuis betreft, de voor het proces noodzakelijke wijze van bedrijven van dat procesfornuis.
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel28
  - number: '28.7'
    text: |-
      Voor een stookinstallatie waarvoor in de periode van 1 augustus 1988 tot en met 30 april 1998
      vergunning is verleend, kan een minder strenge emissie-eis gesteld worden dan de krachtens
      [artikel 13, tweede lid, onder b, derde lid, onder b of c, of vierde lid, onder b of c][ref1], gestelde emissie-
      eisen, maar tot en met 31 december 2007 niet minder streng dan 350 mg/m3 en na deze datum niet minder streng dan:


      [ref1]: https://wetten.overheid.nl/BWBR0004147#Artikel13
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0004147
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 28.7.a
    text: 350 mg/m3 indien de installatie een thermisch vermogen heeft van minder dan 50 MW;
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel28
  - number: 28.7.b
    text: 300 mg/m3 indien de installatie een thermisch vermogen heeft van 50 MW of meer, maar minder dan 500 MW;
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel28
  - number: 28.7.c
    text: 200 mg/m3 indien de installatie een thermisch vermogen heeft van 500 MW of meer.
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel28
  - number: '28.8'
    text: |-
      Voor een procesfornuis waarvoor op of na 1 mei 1998 vergunning is verleend, kan, ingeval door toepassing van
      luchtvoorverwarming niet aan de eis met betrekking tot stikstofoxiden kan worden voldaan, een minder strenge
      emissie-eis gesteld worden dan:
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel28
  - number: 28.8.a
    text: |-
      de krachtens artikel 13, tweede lid, onder c, onder 2°, gestelde emissie-eis, maar niet minder streng dan 160 mg/m3
      ingeval de uittreedtemperatuur van het medium waaraan de warmte wordt overgedragen lager is dan 600° C en 200 mg/m3
      in de overige gevallen;
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel28
  - number: 28.8.b
    text: |-
      de krachtens artikel 13, derde lid, onder d, onder 2°, gestelde emissie-eis, maar niet minder streng dan 130 mg/m3
      ingeval de uittreedtemperatuur van het medium waaraan de warmte wordt overgedragen lager is dan 600° C en 150 mg/3
      in de overige gevallen.
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel28
  - number: '28.9'
    text: |-
      Voor een bestaande stookinstallatie kan een minder strenge emissie-eis worden gesteld dan de krachtens
      [artikel 16, vierde lid][ref1], of [17, eerste lid][ref2], onder b, onder 1°, juncto [artikel 24][ref3] geldende
      emissie-eisen, maar niet minder streng dan 700 mg/m3 bij gebruik van vloeibare brandstoffen en 500 mg/m3 bij
      gebruik van gasvormige brandstoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0004147#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0004147#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0004147#Artikel24
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0004147
        artikel: '16'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004147
        artikel: '17'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0004147
        artikel: '24'
        hoofdstuk: '2'
        paragraaf: '5'
  - number: '28.10'
    text: |-
      Het bevoegd gezag kan, de inspecteur gehoord, met inachtneming van de eisen van [richtlijn 2001/80/EG](32001L0080)
      van het Europees Parlement en de Raad van 23 oktober 2001 inzake de beperking van de emissies van bepaalde
      verontreinigende stoffen in de lucht door grote stookinstallaties (PbEG L 309), voor een stookinstallatie
      minder strenge emissie-eisen met betrekking tot stikstofoxiden dan de in de [artikelen 11, derde lid][ref1],
      [12, derde en vierde lid][ref2], [13, tweede tot en met vierde lid, 15, derde en vierde lid][ref3],
      [16, derde en vierde lid][ref4], [17, eerste lid][ref5], en [20 tot en met 23a][ref6] gestelde emissie-eisen
      stellen, voorzover naar zijn oordeel afdoende wordt aangetoond dat laatstbedoelde eisen strenger zijn dan de eisen
      die zouden voortvloeien uit de eis dat de voor de betrokken inrichting in aanmerking komende beste beschikbare
      technieken worden toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0004147#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0004147#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0004147#Artikel13
      [ref4]: https://wetten.overheid.nl/BWBR0004147#Artikel16
      [ref5]: https://wetten.overheid.nl/BWBR0004147#Artikel17
      [ref6]: https://wetten.overheid.nl/BWBR0004147#Artikel20
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0004147
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0004147
        artikel: '12'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0004147
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0004147
        artikel: '16'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0004147
        artikel: '17'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref6
        bwb_id: BWBR0004147
        artikel: '20'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: '28.11'
    text: Het bevoegd gezag doet onverwijld mededeling aan Onze Minister van beslissingen op grond van dit artikel.
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel28
  - number: '28.12'
    text: |-
      Door het bevoegd gezag krachtens het vijfde tot en met achtste lid vastgestelde emissie-eisen die
      betrekking hebben op stookinstallaties met een thermisch vermogen van 50 MW of meer als bedoeld in
      [artikel 13, tweede lid, onder b, derde lid, onder b of c, of vierde lid, onder b of c][ref1], komen met ingang van
      1 januari 2008 te vervallen, indien deze eisen minder streng zijn dan:


      [ref1]: https://wetten.overheid.nl/BWBR0004147#Artikel13
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0004147
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 28.12.a
    text: 'voor een stookinstallatie met een thermisch vermogen van minder dan 500 MW: 300 mg/m3;'
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel28
  - number: 28.12.b
    text: 'voor een stookinstallatie met een thermisch vermogen van 500 MW of meer: 200 mg/m3,'
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel28
  - number: '29'
    text: |-
      Het bevoegd gezag kan - onverminderd [artikel 24][ref1] - nadere eisen stellen met betrekking tot:


      [ref1]: https://wetten.overheid.nl/BWBR0004147#Artikel24
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0004147
        artikel: '24'
        hoofdstuk: '2'
        paragraaf: '5'
  - number: 29.a
    text: het goed functioneren van een stookinstallatie;
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel29
  - number: 29.b
    text: |-
      het bepaalde in [artikel 5a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004147#Artikel5a
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0004147
        artikel: 5a
        hoofdstuk: '1'
  - number: 29.c
    text: |-
      de wijze waarop overeenkomstig [artikel 33, eerste lid][ref1], wordt aangetoond dat is voldaan aan de van
      toepassing zijnde emissie-eisen;


      [ref1]: https://wetten.overheid.nl/BWBR0004147#Artikel33
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0004147
        artikel: '33'
        hoofdstuk: '4'
  - number: 29.d
    text: |-
      het bepaalde in [artikel 37, eerste lid][ref1], [artikel 43, tweede lid, onder b][ref2], en de ministeriële regels
      bedoeld in [artikel 45][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0004147#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0004147#Artikel43
      [ref3]: https://wetten.overheid.nl/BWBR0004147#Artikel45
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0004147
        artikel: '37'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0004147
        artikel: '43'
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0004147
        artikel: '45'
        hoofdstuk: '4'
  - number: '30.1'
    text: |-
      De bepalingen van dit hoofdstuk zijn van toepassing op stookinstallaties waarvoor bij of krachtens dit besluit
      emissie-eisen zijn gesteld.
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel30
  - number: '30.2'
    text: |-
      In afwijking van het eerste lid zijn de [artikelen 31 tot en met 36][ref1] niet van toepassing op de meting van
      concentraties van zwaveloxiden in een raffinaderij.


      [ref1]: https://wetten.overheid.nl/BWBR0004147#Artikel31
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0004147
        artikel: '31'
        hoofdstuk: '4'
  - number: 30a
    text: 'Continue meting voor de bepaling van de concentratie van zwaveldioxide, stikstofoxiden of stof is:'
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel30a
  - number: 30a.a
    text: rechtstreekse continue meting van de concentratie in het rookgas of
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel30a
  - number: 30a.b
    text: continue meting van de parameters van de voor een stookinstallatie vastgestelde uitworpkarakteristiek.
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel30a
  - number: 30b.1
    text: |-
      Indien op grond van dit besluit een meetverplichting geldt, worden ter bepaling van de concentratie in het rookgas
      van stoffen waarvoor bij of krachtens dit besluit emissie-eisen zijn gesteld, representatieve metingen verricht.
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel30b
  - number: 30b.2
    text: |-
      De bemonsteringen, analyses en metingen van de parameters die nodig zijn voor de bepaling van de concentraties,
      bedoeld in het eerste lid, alsmede de andere metingen en berekeningen die in dit besluit zijn voorgeschreven,
      worden uitgevoerd volgens CEN-normen. Indien geen CEN-normen bestaan, worden andere normen gebruikt die waarborgen
      dat gegevens van een gelijkwaardige wetenschappelijke kwaliteit worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel30b
  - number: 30b.3
    text: |-
      De ter voldoening aan dit besluit toegepaste uitworpkarakteristieken en de keuze van de continu te meten parameters
      zijn zodanig dat de concentraties in het rookgas daarmee steeds ondubbelzinnig kunnen worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel30b
  - number: 30b.4
    text: |-
      Jaarlijks wordt een verificatietest uitgevoerd op de ter controle van een emissie-eis geïnstalleerde apparatuur
      en op de toegepaste uitworpkarakteristieken door middel van parallelle metingen. Om de drie jaar worden de
      geïnstalleerde apparatuur en de toegepaste uitworpkarakteristieken door middel van referentiemetingen gekalibreerd.
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel30b
  - number: 30b.5
    text: |-
      Het uitvoeren van afzonderlijke metingen, parallelmetingen en referentiemetingen geschiedt door een rechtspersoon
      die:
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel30b
  - number: 30b.5.a
    text: |-
      voor deze verrichtingen geaccrediteerd is door een algemeen aanvaarde nationale accreditatie-instelling of een
      vergelijkbare buitenlandse instelling die afkomstig is uit een andere lidstaat van de Europese Unie of een staat
      die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte van 2 mei 1992, of
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel30b
  - number: 30b.5.b
    text: |-
      voor deze verrichtingen de CEN-normen inzake de onafhankelijkheid en de competentie van laboratoria aantoonbaar tot
      uitvoering brengt.
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel30b
  - number: 30b.6
    text: |-
      Een in het tweede en vijfde lid, onder b, bedoelde norm heeft betrekking op de laatst uitgegeven norm met de
      daarop uitgegeven aanvullingen en correctiebladen. Een uitgegeven norm, aanvulling of correctieblad wordt eerst van
      toepassing één jaar na de datum van uitgifte.
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel30b
  - number: 30c.1
    text: |-
      De waarde van het 95%-betrouwbaarheidsinterval van individuele waarnemingen, op basis waarvan de gemiddelden worden
      berekend die getoetst worden aan de emissie-eisen, is bij continumetingen niet groter dan de volgende percentages
      van de emissie-eisen:
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel30c
  - number: 30c.1.a
    text: 'zwaveldioxide: 20;'
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel30c
  - number: 30c.1.b
    text: 'stikstofoxiden: 20;'
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel30c
  - number: 30c.1.c
    text: 'stof: 30.'
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel30c
  - number: 30c.2
    text: |-
      Bij continue metingen vindt toetsing aan de bij of krachtens dit besluit gestelde emissie-eisen plaats op basis
      van het gemiddelde van de individuele waarnemingen, na aftrek van de waarde van het in het eerste lid bedoelde
      betrouwbaarheidsinterval.
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel30c
  - number: 30c.3
    text: |-
      Bij afzonderlijke metingen kan een door een meetinstantie aangetoond 95%-betrouwbaarheidsinterval op dezelfde wijze
      als beschreven in het tweede lid worden verdisconteerd. Dit betrouwbaarheidsinterval is niet groter dan de in het
      eerste lid genoemde percentages.
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel30c
  - number: 30c.4
    text: |-
      Indien in een dag meer dan drie uurgemiddelden ongeldig zijn wegens storing of onderhoud van het continu werkende
      meetsysteem, worden de metingen van die dag als ongeldig beschouwd. Indien per jaar de metingen van meer dan
      tien dagen ongeldig zijn, worden passende maatregelen getroffen om de betrouwbaarheid van het continu werkende
      meetsysteem te verbeteren.
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel30c
  - number: '31.1'
    text: |-
      De concentratie aan zwaveldioxide in rookgas wordt bij een stookinstallatie met een thermisch vermogen van 100 MW
      of meer bepaald door middel van continue meting.
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel31
  - number: '31.2'
    text: |-
      In afwijking van het eerste lid is in de volgende gevallen continue meting niet verplicht en is [artikel 32][ref1]
      van overeenkomstige toepassing:


      [ref1]: https://wetten.overheid.nl/BWBR0004147#Artikel32
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0004147
        artikel: '32'
        hoofdstuk: '4'
  - number: 31.2.a
    text: |-
      de stookinstallatie heeft een thermisch vermogen van minder dan 300 MW en zal na uiterlijk 10.000 bedrijfsuren, te
      rekenen vanaf 27 november 2002, definitief buiten bedrijf worden gesteld;
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel31
  - number: 31.2.b
    text: de stookinstallatie is een met aardgas gestookte ketelinstallatie, gasturbine of gasturbine-installatie;
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel31
  - number: 31.2.c
    text: |-
      de stookinstallatie wordt met olie gestookt, het zwavelgehalte van deze olie is bekend en de stookinstallatie heeft
      geen rookgasontzwavelingsinstallatie;
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel31
  - number: 31.2.d
    text: |-
      de stookinstallatie is een met biomassa gestookte ketelinstallatie en het in acht nemen van de emissie-eisen voor
      zwaveldioxide geschiedt uitsluitend door het stoken van biomassa met een bepaald zwavelgehalte.
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel31
  - number: '32.1'
    text: |-
      De concentratie aan zwaveldioxide in rookgas wordt bepaald door middel van een afzonderlijke meting bij een
      stookinstallatie met een thermisch vermogen, kleiner dan 100 MW, tenzij:
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel32
  - number: 32.1.a
    text: continue meting plaatsvindt, of
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel32
  - number: 32.1.b
    text: |-
      het in acht nemen van de emissie-eisen uitsluitend door middel van het stoken van brandstoffen met een bepaald
      zwavelgehalte geschiedt.
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel32
  - number: '32.2'
    text: |-
      Een afzonderlijke meting als bedoeld in het eerste lid wordt zo spoedig mogelijk nadat een emissie-eis op de
      stookinstallatie van toepassing wordt, doch uiterlijk binnen vier weken na dat tijdstip, verricht. Indien het
      thermisch vermogen van de stookinstallatie 50 MW of meer is, wordt een volgende afzonderlijke meting als bedoeld in
      het eerste lid verricht:
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel32
  - number: 32.2.a
    text: |-
      indien de stookinstallatie minder dan zes maanden per jaar aaneengesloten uit bedrijf is: uiterlijk zes maanden na
      de ingevolge de eerste volzin verrichte eerste afzonderlijke meting en vervolgens telkens na afloop van een periode
      van zes maanden;
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel32
  - number: 32.2.b
    text: |-
      indien de stookinstallatie meer dan zes maanden per jaar aaneengesloten uit bedrijf is: uiterlijk een jaar na de
      ingevolge de eerste volzin verrichte eerste afzonderlijke meting en vervolgens telkens na afloop van een periode
      van een jaar.
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel32
  - number: '33.1'
    text: |-
      Indien toepassing wordt gegeven aan [artikel 31, tweede lid, onder c of d][ref1], of indien
      [artikel 32, eerste lid, onder b][ref2], van toepassing is, dient te allen tijde aan de hand van gegevens met
      betrekking tot het zwavelgehalte van elke ingezette brandstof en andere gegevens die noodzakelijk zijn om de
      uitworp aan zwaveldioxide te berekenen, te kunnen worden aangetoond dat aan de van toepassing zijnde emissie-eis
      is voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0004147#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0004147#Artikel32
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0004147
        artikel: '31'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0004147
        artikel: '32'
        hoofdstuk: '4'
  - number: '33.2'
    text: De gegevens, bedoeld in het eerste lid, dienen in een register te worden opgenomen.
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel33
  - number: '33.3'
    text: |-
      Indien in een stookinstallatie waarop
      [artikel 12, eerste lid, onder b, onder 1°, onder c, onder 1°, of onder d, of achtste lid][ref1], dan wel
      [artikel 16, zesde lid][ref2], van toepassing is, zware stookolie wordt gestookt met een zwavelgehalte van niet
      meer dan 1%, is aan de in genoemde artikelen gestelde emissie-eis voldaan en kan in afwijking van het bepaalde in
      het eerste lid worden volstaan met registratie van het zwavelgehalte van genoemde brandstof.


      [ref1]: https://wetten.overheid.nl/BWBR0004147#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0004147#Artikel16
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0004147
        artikel: '12'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0004147
        artikel: '16'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '34.1'
    text: |-
      Indien bij een stookinstallatie, waarvoor voor 27 november 2002 vergunning is verleend, of een stookinstallatie
      met een thermisch vermogen van minder dan 50 MW de concentratie aan zwaveldioxide in rookgas continu wordt gemeten,
      geldt een emissie-eis als in acht genomen, indien in een kalenderjaar:
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel34
  - number: 34.1.a
    text: geen kalendermaandgemiddelde de waarde van de emissie-eis te boven gaat en
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel34
  - number: 34.1.b
    text: 97% van alle 48-uursgemiddelden niet hoger ligt dan 110% van de waarde van de emissie-eis.
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel34
  - number: '34.2'
    text: |-
      Indien bij een stookinstallatie, waarvoor op of na 27 november 2002 vergunning is verleend, met een thermisch
      vermogen van 50 MW of meer de concentratie aan zwaveldioxide in rookgas continu wordt gemeten, geldt de emissie-eis
      als in acht genomen, indien in een kalenderjaar:
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel34
  - number: 34.2.a
    text: geen daggemiddelde hoger is dan de waarde van de emissie-eis en
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel34
  - number: 34.2.b
    text: 95% van alle uurgemiddelden niet hoger is dan 200% van de waarde van de emissie-eis.
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel34
  - number: '34.3'
    text: |-
      Voor de toepassing van het eerste en tweede lid worden meetuitkomsten, verkregen tijdens perioden waarin een
      stookinstallatie krachtens [artikel 7][ref1] of [artikel 7a][ref2] in werking mag zijn tijdens storingen in
      de apparatuur die de emissiereductie bewerkstelligt, alsmede meetuitkomsten verkregen tijdens het opstarten en
      stilleggen, niet meegerekend.


      [ref1]: https://wetten.overheid.nl/BWBR0004147#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0004147#Artikel7a
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0004147
        artikel: '7'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0004147
        artikel: 7a
        hoofdstuk: '1'
  - number: '35.1'
    text: |-
      Een eerste afzonderlijke meting als bedoeld in [artikel 32, tweede lid, eerste volzin][ref1], wordt verricht bij
      een belasting van de stookinstallatie van:


      [ref1]: https://wetten.overheid.nl/BWBR0004147#Artikel32
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0004147
        artikel: '32'
        hoofdstuk: '4'
  - number: 35.1.a
    text: 'indien het een stookinstallatie betreft met een thermisch vermogen van 50 MW of meer: 100 procent;'
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel35
  - number: 35.1.b
    text: 'indien het een stookinstallatie betreft met een thermisch vermogen van minder dan 50 MW: meer dan 60 procent.'
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel35
  - number: '35.2'
    text: |-
      In afwijking van het bepaalde in het eerste lid, onder *a*, wordt een eerste afzonderlijke meting bij een bestaande
      stookinstallatie verricht bij een belasting van meer dan 60 procent.
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel35
  - number: '35.3'
    text: |-
      Een vervolgmeting als bedoeld in [artikel 32, tweede lid, tweede volzin][ref1], wordt verricht bij een belasting
      van meer dan 60 procent.


      [ref1]: https://wetten.overheid.nl/BWBR0004147#Artikel32
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0004147
        artikel: '32'
        hoofdstuk: '4'
  - number: '36.1'
    text: |-
      Bij een afzonderlijke meting als bedoeld in [artikel 32][ref1] geldt een emissie-eis als in acht genomen, indien
      geen enkele meetuitkomst boven de waarde van de emissie-eis ligt.


      [ref1]: https://wetten.overheid.nl/BWBR0004147#Artikel32
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0004147
        artikel: '32'
        hoofdstuk: '4'
  - number: '36.2'
    text: |-
      Indien één van de meetuitkomsten die onderdeel uitmaken van één afzonderlijke meting boven de waarde van de
      emissie-eis ligt, mag binnen een door het bevoegd gezag vast te stellen periode op grond van een serie nadere
      metingen alsnog worden vastgesteld of aan de emissie-eis is voldaan.
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel36
  - number: '37.1'
    text: |-
      De emissie aan zwaveldioxide van een stookinstallatie die onderdeel uitmaakt van een raffinaderij wordt bepaald
      door:
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel37
  - number: 37.1.a
    text: continue meting indien de stookinstallatie een vermogen heeft van 100 MW of meer;
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel37
  - number: 37.1.b
    text: |-
      afzonderlijke meting indien de stookinstallatie een vermogen heeft van minder dan 100 MW, tenzij continue meting
      plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel37
  - number: '37.2'
    text: |-
      In afwijking van het eerste lid kan, indien de emissie aan zwaveldioxide van een stookinstallatie die onderdeel
      uitmaakt van een raffinaderij uitsluitend wordt bepaald door het zwavelgehalte van de ingezette brandstoffen, in
      de volgende gevallen worden volstaan met registratie in een register van de aard en de gebruikte hoeveelheden van
      de ingezette brandstoffen, het zwavelgehalte daarvan en alle andere gegevens die noodzakelijk zijn om te kunnen
      beoordelen of aan de emissie-eisen voor zwaveldioxide is voldaan:
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel37
  - number: 37.2.a
    text: de stookinstallatie heeft een thermisch vermogen van minder dan 100 MW;
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel37
  - number: 37.2.b
    text: |-
      de stookinstallatie zal na uiterlijk 10.000 bedrijfsuren, te rekenen vanaf 27 november 2002, definitief buiten
      bedrijf worden gesteld;
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel37
  - number: 37.2.c
    text: |-
      de stookinstallatie is een ketelinstallatie, gasturbine of gasturbine-installatie die, of een procesfornuis dat met
      aardgas wordt gestookt;
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel37
  - number: 37.2.d
    text: |-
      de stookinstallatie wordt met olie gestookt, het zwavelgehalte van deze olie is bekend en de stookinstallatie heeft
      geen rookgasontzwavelingsinstallatie;
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel37
  - number: 37.2.e
    text: |-
      de stookinstallatie is een met biomassa gestookte ketelinstallatie en de houder van de inrichting waarin zich deze
      installatie bevindt, heeft aangetoond dat de emissie aan zwaveldioxide in geen geval hoger kan zijn dan de bij of
      krachtens dit besluit gestelde emissie-eisen.
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel37
  - number: '37.3'
    text: |-
      De concentratie aan zwaveloxiden van de onderscheiden delen van een raffinaderij wordt berekend aan de hand van
      de met toepassing van het eerste en tweede lid verkregen gegevens, en, voor de vaststelling van de concentraties,
      bedoeld in [artikel 18, derde lid][ref1], mede aan de hand van gegevens inzake de emissie aan zwaveloxiden
      afkomstig van de omzetting van zwavelwaterstof in zwavel.


      [ref1]: https://wetten.overheid.nl/BWBR0004147#Artikel18
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0004147
        artikel: '18'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '37.4'
    text: |-
      De emissie-eisen, bedoeld in [artikel 18, tweede lid, onder a, en derde lid][ref1], gelden als in acht genomen
      indien geen 24-uursgemiddelde, berekend overeenkomstig het derde lid, de waarde van de bij of krachtens dit besluit
      gestelde emissie-eis te boven gaat.


      [ref1]: https://wetten.overheid.nl/BWBR0004147#Artikel18
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0004147
        artikel: '18'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '37.5'
    text: |-
      De emissie-eis, bedoeld in [artikel 18, tweede lid, onder b][ref1], geldt als in acht genomen, indien in een
      kalenderjaar van de meetuitkomsten, berekend overeenkomstig het derde lid:


      [ref1]: https://wetten.overheid.nl/BWBR0004147#Artikel18
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0004147
        artikel: '18'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 37.5.a
    text: geen kalendermaandgemiddelde de waarde van de emissie-eis te boven gaat, en
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel37
  - number: 37.5.b
    text: 97% van alle 48-uursgemiddelden niet hoger is dan 110% van de waarde van de emissie-eis.
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel37
  - number: '37.6'
    text: |-
      De emissie-eis, bedoeld in [artikel 18, tweede lid, onder c][ref1], geldt als in acht genomen, indien in een
      kalenderjaar van de meetuitkomsten, berekend overeenkomstig het derde lid:


      [ref1]: https://wetten.overheid.nl/BWBR0004147#Artikel18
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0004147
        artikel: '18'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 37.6.a
    text: geen daggemiddelde hoger is dan de emissie-eis en
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel37
  - number: 37.6.b
    text: 95% van alle uurgemiddelden niet hoger is dan 200% van de waarde van de emissie-eis.
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel37
  - number: '38.1'
    text: |-
      De concentratie aan stikstofoxiden in rookgas bij een stookinstallatie met een thermisch vermogen van 100 MW of
      meer, niet zijnde een gasturbine of een gasturbine-installatie, een zuigermotor of een combinatie van installaties
      als bedoeld in [artikel 22][ref1], wordt bepaald door continue meting.


      [ref1]: https://wetten.overheid.nl/BWBR0004147#Artikel22
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0004147
        artikel: '22'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: '38.2'
    text: |-
      De concentratie aan stikstofoxiden in rookgas bij een stookinstallatie met een thermisch vermogen van minder
      dan 100 MW, niet zijnde een gasturbine of een gasturbine-installatie, een zuigermotor of een combinatie van
      installaties als bedoeld in [artikel 22][ref1], wordt bepaald door:


      [ref1]: https://wetten.overheid.nl/BWBR0004147#Artikel22
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0004147
        artikel: '22'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 38.2.a
    text: |-
      continue meting indien het een stookinstallatie betreft waarop
      [artikel 13, tweede lid, onder c, of vierde lid, onder c, onder 1°][ref1], of
      [artikel 24, vierde of vijfde lid][ref2], van toepassing is, tenzij op een andere wijze ten genoegen van het
      bevoegd gezag wordt aangetoond dat de voor de stookinstallatie geldende emissie-eis niet zal worden overschreden;


      [ref1]: https://wetten.overheid.nl/BWBR0004147#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0004147#Artikel24
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0004147
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0004147
        artikel: '24'
        hoofdstuk: '2'
        paragraaf: '5'
  - number: 38.2.b
    text: afzonderlijke meting indien geen continue meting plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel38
  - number: '38.3'
    text: |-
      Indien de concentratie aan stikstofoxiden bij een stookinstallatie, waarvoor voor 27 november 2002 vergunning is
      verleend, of een stookinstallatie met een thermisch vermogen van minder dan 50 MW continu wordt gemeten, geldt de
      emissie-eis als in acht genomen, indien:
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel38
  - number: 38.3.a
    text: geen kalendermaandgemiddelde de waarde van de emissie-eis te boven gaat, en
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel38
  - number: 38.3.b
    text: 95% van alle 48-uursgemiddelden niet hoger is dan 110% van de emissie-eis.
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel38
  - number: '38.4'
    text: |-
      Indien de concentratie aan stikstofoxiden bij een stookinstallatie, waarvoor op of na 27 november 2002 vergunning
      is verleend, met een thermisch vermogen van 50 MW of meer continu wordt gemeten, geldt de emissie-eis als in acht
      genomen, indien:
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel38
  - number: 38.4.a
    text: geen daggemiddelde de waarde van de emissie-eis te boven gaat, en
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel38
  - number: 38.4.b
    text: 95% van alle uurgemiddelden in een kalenderjaar niet hoger is dan 200% van de emissie-eis.
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel38
  - number: '38.5'
    text: |-
      Voor de toepassing van het derde en vierde lid worden meetuitkomsten, verkregen tijdens perioden waarin een
      stookinstallatie krachtens [artikel 7][ref1] of [artikel 7a][ref2] in werking mag zijn tijdens storingen in
      de apparatuur die de emissiereductie bewerkstelligt, alsmede meetuitkomsten verkregen tijdens het opstarten en
      stilleggen, niet meegerekend.


      [ref1]: https://wetten.overheid.nl/BWBR0004147#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0004147#Artikel7a
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0004147
        artikel: '7'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0004147
        artikel: 7a
        hoofdstuk: '1'
  - number: '38.6'
    text: |-
      Een afzonderlijke meting als bedoeld in het tweede lid, onder b, wordt zo spoedig mogelijk nadat een emissie-eis
      op de stookinstallatie van toepassing wordt, doch uiterlijk binnen vier weken na dat tijdstip, verricht. Indien
      het thermisch vermogen van de stookinstallatie 50 MW of meer bedraagt, wordt een volgende afzonderlijke meting als
      bedoeld in het tweede lid, onder b, verricht:
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel38
  - number: 38.6.a
    text: |-
      indien de stookinstallatie minder dan zes maanden per jaar aaneengesloten uit bedrijf is: uiterlijk zes maanden na
      de ingevolge de eerste volzin verrichte eerste afzonderlijke meting en vervolgens telkens na afloop van een periode
      van zes maanden of
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel38
  - number: 38.6.b
    text: |-
      indien de stookinstallatie meer dan zes maanden per jaar aaneengesloten uit bedrijf is: uiterlijk een jaar na de
      ingevolge de eerste volzin verrichte eerste afzonderlijke meting en vervolgens telkens na afloop van een periode
      van een jaar,
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel38
  - number: '38.7'
    text: |-
      Het eerste lid is niet van toepassing op een stookinstallatie met een thermisch vermogen van minder dan 300 MW, die
      na uiterlijk 10.000 bedrijfsuren, te rekenen vanaf 27 november 2002, definitief buiten bedrijf zal worden gesteld.
      In dat geval is het tweede lid van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel38
  - number: 38a.1
    text: |-
      Indien in een stookinstallatie als bedoeld in het tweede lid, uitsluitend branders zijn geïnstalleerd, die behoren
      tot een type dat, blijkens keuring door een door Onze Minister aan te wijzen instantie, bij toepassing in zo'n
      stookinstallatie ertoe leidt dat de uitworp van stikstofoxiden voldoet aan de gestelde eis, is aan het bepaalde in
      [de artikelen 13, vierde lid, onder c of d, of 17, eerste lid, onder b, onder 1° of 2°][ref1], voldaan en blijft
      [artikel 38, tweede lid][ref2], buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004147#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0004147#Artikel38
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel38a
    references:
      - id: ref1
        bwb_id: BWBR0004147
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0004147
        artikel: '38'
        hoofdstuk: '4'
  - number: 38a.2
    text: 'Het eerste lid is van toepassing op een stookinstallatie voor aardgas:'
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel38a
  - number: 38a.2.a
    text: |-
      met een thermisch vermogen van 7,5 MW of minder die uitsluitend wordt gebruikt voor het verhitten van water of
      stoom bij een druk niet hoger dan 1 MPa zonder dat daarbij luchtvoorverwarming wordt toegepast en
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel38a
  - number: 38a.2.b
    text: |-
      waarop [artikel 13, vierde lid, onder c of d, of 17, eerste lid, onder b][ref1], van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0004147#Artikel13
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel38a
    references:
      - id: ref1
        bwb_id: BWBR0004147
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '39.1'
    text: |-
      De concentratie aan stikstofoxiden in rookgas wordt bij een gasturbine, een gasturbine-installatie of een
      combinatie van installaties als bedoeld in [artikel 22][ref1], met een thermisch vermogen van 100 MW of meer,
      bepaald door continue meting.


      [ref1]: https://wetten.overheid.nl/BWBR0004147#Artikel22
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0004147
        artikel: '22'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: '39.2'
    text: |-
      De concentratie aan stikstofoxiden in rookgas wordt bij een gasturbine, een gasturbine-installatie of een
      combinatie van installaties als bedoeld in [artikel 22][ref1], met een thermisch vermogen van minder dan 100 MW,
      bepaald door:


      [ref1]: https://wetten.overheid.nl/BWBR0004147#Artikel22
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0004147
        artikel: '22'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 39.2.a
    text: |-
      continue meting indien ter bestrijding van de emissie van stikstofoxiden met het rookgas injectie van water, stoom
      of een ander inert materiaal wordt toegepast, tenzij op een andere wijze ten genoegen van het bevoegd gezag wordt
      aangetoond dat de voor de stookinstallatie geldende emissie-eis niet zal worden overschreden;
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel39
  - number: 39.2.b
    text: afzonderlijke meting indien geen continue meting plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel39
  - number: '39.3'
    text: |-
      De concentratie aan stikstofoxiden in rookgas wordt bij een zuigermotor bepaald door middel van een afzonderlijke
      meting.
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel39
  - number: '39.4'
    text: |-
      Het eerste lid is niet van toepassing op een stookinstallatie met een thermisch vermogen van minder dan 300 MW, die
      na uiterlijk 10.000 bedrijfsuren, te rekenen vanaf 27 november 2002, definitief buiten bedrijf zal worden gesteld.
      In dat geval is het tweede lid van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel39
  - number: '40.1'
    text: |-
      Indien de concentratie aan stikstofoxiden continu wordt gemeten bij een gasturbine, een gasturbine-installatie of
      een combinatie van installaties als bedoeld in [artikel 22][ref1], geldt de emissie-eis als in acht genomen indien:


      [ref1]: https://wetten.overheid.nl/BWBR0004147#Artikel22
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0004147
        artikel: '22'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 40.1.a
    text: |-
      bij gasturbine-installaties, waarvoor op of na 27 november 2002 vergunning is verleend, met een thermisch
      vermogen van 50 MW of meer: indien geen daggemiddelde de waarde van de emissie-eis te boven gaat en 95% van de
      uurgemiddelden in één kalenderjaar niet hoger is dan 200% van de emissie-eis;
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel40
  - number: 40.1.b
    text: |-
      in andere gevallen dan bedoeld onder a: indien van de meetuitkomsten geen 24-uursgemiddelde de waarde van de
      emissie-eis te boven gaat.
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel40
  - number: '40.2'
    text: |-
      Voor de toepassing van het eerste lid worden meetuitkomsten, verkregen tijdens perioden waarin een stookinstallatie
      krachtens [artikel 7][ref1] of [artikel 7a][ref2] in werking mag zijn tijdens storingen in de apparatuur die
      de emissiereductie bewerkstelligt, alsmede meetuitkomsten verkregen tijdens het opstarten en stilleggen van de
      gasturbine-installatie of van de combinatie van installaties als bedoeld in [artikel 22][ref3], niet meegerekend.


      [ref1]: https://wetten.overheid.nl/BWBR0004147#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0004147#Artikel7a
      [ref3]: https://wetten.overheid.nl/BWBR0004147#Artikel22
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0004147
        artikel: '7'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0004147
        artikel: 7a
        hoofdstuk: '1'
      - id: ref3
        bwb_id: BWBR0004147
        artikel: '22'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: '41.1'
    text: |-
      Indien de concentratie aan stikstofoxiden bij een gasturbine of een gasturbine-installatie, een combinatie van
      installaties als bedoeld in [artikel 22][ref1] of een zuigermotor afzonderlijk wordt gemeten, wordt telkens nadat
      een emissie-eis van toepassing is geworden, zo spoedig mogelijk, doch uiterlijk binnen vier weken nadien, een
      eerste maal een afzonderlijke meting verricht, en vervolgens iedere keer na afloop van een periode van vier jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0004147#Artikel22
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0004147
        artikel: '22'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: '41.2'
    text: |-
      In afwijking van het eerste lid, wordt voor een bestaande zuigermotor een eerste afzonderlijke meting uitgevoerd
      voor 1 maart 2000, tenzij uit een afzonderlijke meting uitgevoerd na inwerkingtreding van dit besluit, maar voor 1
      januari 2000 is gebleken dat aan de in [artikel 23a][ref1] gestelde eis is voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0004147#Artikel23a
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0004147
        artikel: 23a
        hoofdstuk: '2'
        paragraaf: '4'
  - number: '41.3'
    text: |-
      In afwijking van het eerste lid worden bij gasturbines en gasturbine-installaties met een thermisch vermogen van
      50 MW of meer, waarvoor op of na 27 november 2002 vergunning is verleend, nadat ingevolge het eerste lid een eerste
      maal een afzonderlijke meting is verricht, de daarop volgende afzonderlijke metingen verricht:
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel41
  - number: 41.3.a
    text: |-
      indien de stookinstallatie minder dan zes maanden per jaar aaneengesloten uit bedrijf is: uiterlijk zes maanden na
      de eerste afzonderlijke meting en vervolgens telkens na afloop van een periode van zes maanden;
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel41
  - number: 41.3.b
    text: |-
      indien de stookinstallatie meer dan zes maanden per jaar aaneengesloten uit bedrijf is: uiterlijk een jaar na de
      eerste afzonderlijke meting en vervolgens telkens na afloop van een periode van een jaar.
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel41
  - number: '42.1'
    text: |-
      Een afzonderlijke meting als bedoeld in [artikel 39][ref1] wordt verricht bij de hoogste belasting waarbij de
      gasturbine of de zuigermotor continu kan worden bedreven en:


      [ref1]: https://wetten.overheid.nl/BWBR0004147#Artikel39
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0004147
        artikel: '39'
        hoofdstuk: '4'
  - number: 42.1.a
    text: |-
      indien de maximale bijstook in de bijbehorende ketel of ketels volgens de ontwerpspecifikatie 10 procent of meer is
      van het thermische vermogen van de gasturbine-installatie, bij een bijstook in de bijbehorende ketel of ketels van
      10 procent, of indien dat meer is, bij een minimale bijstook,
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel42
  - number: 42.1.a.1°
    text: overeenkomstig de desbetreffende specificatie in de vergunningvoorschriften, of, bij ontbreken daarvan,
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel42
  - number: 42.1.a.2°
    text: overeenkomstig de desbetreffende ontwerpspecificatie;
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel42
  - number: 42.1.b
    text: |-
      indien de maximale bijstook in de bijbehorende ketel of ketels volgens de ontwerpspecifikatie kleiner is dan 10
      procent van het thermische vermogen van de gasturbine-installatie, bij een maximale bijstook in de bijbehorende
      ketel of ketels.
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel42
  - number: '42.2'
    text: |-
      Bij toepassing van het eerste lid is [artikel 36][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004147#Artikel36
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0004147
        artikel: '36'
        hoofdstuk: '4'
  - number: 42a.1
    text: |-
      Indien een zuigermotor waarin uitsluitend aardgas wordt gestookt, behoort tot een type dat blijkens keuring door
      een door Onze Minister aan te wijzen instantie met betrekking tot de uitworp van stikstofoxiden voldoet aan de in
      [artikel 23][ref1] gestelde eis voor de categorie waartoe dat type behoort en de zuigermotor wordt gedreven conform
      de bedrijfsvoorschriften van de leverancier voor dat type, is aan het bepaalde in [artikel 23][ref2] voldaan en
      blijft [artikel 39, derde lid][ref3], buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004147#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0004147#Artikel23
      [ref3]: https://wetten.overheid.nl/BWBR0004147#Artikel39
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel42a
    references:
      - id: ref1
        bwb_id: BWBR0004147
        artikel: '23'
        hoofdstuk: '2'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0004147
        artikel: '23'
        hoofdstuk: '2'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0004147
        artikel: '39'
        hoofdstuk: '4'
  - number: 42a.2
    text: |-
      De juiste afstelling van de motor voor de wijze van drijven, bedoeld in het eerste lid, dient bij onderhoudsbeurten
      te worden gecontroleerd, hetgeen dient te blijken uit een verslag van de uitgevoerde onderhoudsbeurten.
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel42a
  - number: '43.1'
    text: |-
      De concentratie aan stof in rookgas wordt bij een stookinstallatie met een thermisch vermogen van 100 MW of meer
      bepaald door middel van continue meting.
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel43
  - number: '43.2'
    text: |-
      In afwijking van het eerste lid hoeft in de volgende gevallen geen continue meting plaats te vinden en is het derde
      lid van overeenkomstige toepassing:
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel43
  - number: 43.2.a
    text: |-
      de stookinstallatie heeft een thermisch vermogen van minder dan 300 MW en zal na uiterlijk 10.000 bedrijfsuren, te
      rekenen vanaf 27 november 2002, definitief buiten bedrijf worden gesteld;
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel43
  - number: 43.2.b
    text: |-
      de stookinstallatie is een ketelinstallatie, gasturbine of gasturbine-installatie die, of een procesfornuis dat
      wordt gestookt met een gasvormige brandstof die gezien de herkomst geen dusdanige hoeveelheid stofdeeltjes kan
      bevatten dat daardoor 10% van de betreffende emissie-eis kan worden overschreden.
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel43
  - number: '43.3'
    text: |-
      De concentratie aan stof in rookgas wordt bij een stookinstallatie met een thermisch vermogen van minder dan 100 MW
      bepaald door middel van een afzonderlijke meting, tenzij:
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel43
  - number: 43.3.a
    text: continue meting plaatsvindt of
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel43
  - number: 43.3.b
    text: |-
      de stookinstallatie een ketelinstallatie, gasturbine of gasturbine-installatie is die, of een procesfornuis is
      dat wordt gestookt met een gasvormige brandstof die gezien de herkomst geen dusdanige hoeveelheid stofdeeltjes kan
      bevatten dat daardoor 10% van de betreffende emissie-eis kan worden overschreden.
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel43
  - number: '43.4'
    text: |-
      Een afzonderlijke meting als bedoeld in het derde lid wordt zo spoedig mogelijk nadat een emissie-eis op de
      stookinstallatie van toepassing wordt, doch uiterlijk binnen vier weken na dat tijdstip, verricht. Indien het
      thermisch vermogen van de stookinstallatie 50 MW of meer bedraagt, wordt een volgende afzonderlijke meting als
      bedoeld in het derde lid verricht:
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel43
  - number: 43.4.a
    text: |-
      indien de stookinstallatie minder dan zes maanden per jaar aaneengesloten uit bedrijf is: uiterlijk zes maanden na
      de ingevolge de eerste volzin verrichte eerste afzonderlijke meting en vervolgens telkens na afloop van een periode
      van zes maanden;
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel43
  - number: 43.4.b
    text: |-
      indien de stookinstallatie meer dan zes maanden per jaar aaneengesloten uit bedrijf is: uiterlijk een jaar na de
      ingevolge de eerste volzin verrichte eerste afzonderlijke meting en vervolgens telkens na afloop van een periode
      van een jaar.
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel43
  - number: '43.5'
    text: |-
      Een afzonderlijke meting als bedoeld in het derde lid wordt telkens wanneer een emissie-eis op de stookinstallatie
      van toepassing wordt, zo spoedig mogelijk, doch uiterlijk binnen vier weken nadien verricht. Indien het thermisch
      vermogen van de stookinstallatie 50 MW of meer bedraagt, wordt uiterlijk zes maanden na een ingevolge de eerste
      volzin verrichte eerste afzonderlijke meting en vervolgens telkens na afloop van een periode van zes maanden een
      vervolgmeting verricht.
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel43
  - number: '43.6'
    text: |-
      Een afzonderlijke meting als bedoeld in het derde lid aan een rookgasontzwavelingsinstallatie wordt uitgevoerd bij
      een ontzwavelingsrendement van ten minste 85%.
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel43
  - number: '43.7'
    text: |-
      De [artikelen 13, vijfde lid, aanhef en onder c][ref1], en [33][ref2] gelden als in acht genomen, indien in de
      stookinstallatie uitsluitend aardgas wordt gestookt.


      [ref1]: https://wetten.overheid.nl/BWBR0004147#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0004147#Artikel33
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0004147
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0004147
        artikel: '33'
        hoofdstuk: '4'
  - number: '43.8'
    text: |-
      De [artikelen 34][ref1], [35][ref2] en [36][ref3] zijn van overeenkomstige toepassing op de bepaling van de
      concentratie aan stof in het rookgas.


      [ref1]: https://wetten.overheid.nl/BWBR0004147#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0004147#Artikel35
      [ref3]: https://wetten.overheid.nl/BWBR0004147#Artikel36
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0004147
        artikel: '34'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0004147
        artikel: '35'
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0004147
        artikel: '36'
        hoofdstuk: '4'
  - number: 43a.1
    text: |-
      Indien continue meting van de concentratie aan zwaveldioxide, stikstofoxiden of stof in rookgas van een
      stookinstallatie plaatsvindt, dient de per dag uitgeworpen massahoeveelheid zwaveldioxide, onderscheidenlijk
      stikstofoxiden, onderscheidenlijk stof dagelijks te worden vastgesteld en opgeteld bij de hoeveelheid die in
      de voorafgaande dagen van het kalenderjaar is uitgeworpen. De vaststelling geschiedt mede op basis van het
      rookgasdebiet.
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel43a
  - number: 43a.2
    text: |-
      Indien de concentratie aan zwaveldioxide, stikstofoxiden of stof in rookgas van een stookinstallatie niet continu
      wordt gemeten, dient na afloop van elk kalenderjaar een raming van de totale uitgeworpen massahoeveelheid aan
      zwaveldioxide, onderscheidenlijk stikstofoxiden, onderscheidenlijk stof te worden opgesteld.
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel43a
  - number: 43a.3
    text: |-
      Vóór 1 april van elk kalenderjaar worden de op grond van het eerste en tweede lid vastgestelde gegevens met
      betrekking tot de in het afgelopen kalenderjaar totaal uitgeworpen massahoeveelheid zwaveldioxide, stikstofoxiden
      en stof aan het bevoegd gezag toegezonden. De in het eerste lid gestelde verplichting is niet van toepassing,
      indien de gegevens, bedoeld in de eerste volzin, reeds ingevolge het [Besluit milieuverslaglegging][ref1] aan het
      bevoegd gezag ter beschikking worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0010010
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel43a
    references:
      - id: ref1
        bwb_id: BWBR0010010
  - number: 43a.4
    text: |-
      In afwijking van het eerste en tweede lid hoeft de geëmitteerde hoeveelheid stof bij stookinstallaties met een
      thermisch vermogen van minder dan 50 MW niet te worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel43a
  - number: 43b.1
    text: |-
      Met ingang van 1 januari 2005 wordt jaarlijks een raming opgesteld van de warmte-inhoud van de totale hoeveelheid
      brandstof die in het daaraan voorafgaande kalenderjaar in een stookinstallatie met een thermisch vermogen van 50 MW
      of meer is verbrand. Deze warmte-inhoud wordt gespecificeerd voor de volgende categorieën brandstoffen: biomassa,
      overige vaste brandstoffen, vloeibare brandstoffen, aardgas en overige gasvormige brandstoffen.
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel43b
  - number: 43b.2
    text: |-
      Voor 1 april van elk kalenderjaar worden de op grond van het eerste lid vastgestelde gegevens met betrekking tot
      het daaraan voorafgaande kalenderjaar aan het bevoegd gezag en aan de inspecteur-generaal van het Inspectoraat-
      Generaal VROM toegezonden.
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel43b
  - number: 43b.3
    text: |-
      Het eerste en het tweede lid zijn niet van toepassing indien de betreffende gegevens reeds ingevolge het
      [Besluit milieuverslaglegging][ref1] aan het bevoegd gezag ter beschikking worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0010010
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel43b
    references:
      - id: ref1
        bwb_id: BWBR0010010
  - number: '44'
    text: |-
      De resultaten van de bij of krachtens het bepaalde in dit hoofdstuk uitgevoerde metingen, alsmede andere gegevens
      die nodig zijn om te kunnen beoordelen of in overeenstemming met dit besluit is gehandeld, worden door degene die
      de inrichting drijft, in de inrichting ter beschikking gehouden voor controle, indien het:
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel44
  - number: 44.a
    text: |-
      meetresultaten of andere gegevens betreft die betrekking hebben op afzonderlijke metingen: gedurende de verdere
      levensduur van de stookinstallatie;
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel44
  - number: 44.b
    text: 'andere meetresultaten of andere gegevens betreft: gedurende drie kalenderjaren.'
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel44
  - number: '45'
    text: |-
      Onze Minister stelt nadere regels met betrekking tot de wijze waarop de concentraties aan zwaveldioxide,
      stikstofoxiden en stof in het rookgas en het voldoen aan de andere vereisten van dit besluit moeten worden
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel45
  - number: '46.1'
    text: |-
      Ingeval met betrekking tot zware stookolie een besluit krachtens [artikel 5 of 6 van de Distributiewet 1939][ref1]
      is vastgesteld en toepassing is gegeven aan [artikel 5][ref2], kan Onze Minister, in overeenstemming met Onze
      Minister van Economische Zaken, voor stookinstallaties voor zware stookolie waarop [artikel 12][ref3], eerste
      en tweede of achtste lid, of [artikel 16][ref4], eerste en tweede of zesde lid, van het onderhavige besluit van
      toepassing is, waarden voor de toegestane uitworp van zwaveldioxide vaststellen, die voor een periode van ten
      hoogste zes maanden in de plaats komen van de waarden vermeld in die leden.


      [ref1]: https://wetten.overheid.nl/BWBR0001997#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0002939#Artikel5a
      [ref3]: https://wetten.overheid.nl/BWBR0004147#Artikel12
      [ref4]: https://wetten.overheid.nl/BWBR0004147#Artikel16
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0001997
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0002939
        artikel: 5a
      - id: ref3
        bwb_id: BWBR0004147
        artikel: '12'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0004147
        artikel: '16'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '46.2'
    text: |-
      Het eerste lid geldt voor een andere dan een bestaande stookinstallatie slechts indien het thermisch vermogen van
      de stookinstallatie kleiner is dan 300 MW.
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel46
  - number: '46.3'
    text: |-
      Een waarde als bedoeld in het eerste lid is voor stookinstallaties waarvoor een emissie-eis van 1700 mg/m3
      geldt, niet hoger dan de waarde voor de uitworp van zwaveldioxide met het rookgas, die zou optreden wanneer zware
      stookolie wordt verbruikt met een zwavelgehalte, gelijk aan een gehalte dat is vastgesteld met toepassing van
      [artikel 5][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002939#Artikel5a
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0002939
        artikel: 5a
  - number: '46.4'
    text: |-
      Voor stookinstallaties waarvoor een emissie-eis van 400 mg/m3 onderscheidenlijk 200 mg/m3 geldt, is de in het
      eerste lid bedoelde waarde niet hoger dan 15 procent van de met toepassing van het derde lid verkregen waarde.
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel46
  - number: '46.5'
    text: |-
      Onverminderd het eerste lid vervalt een besluit krachtens het eerste lid, behoudens eerdere intrekking, twaalf
      weken na het tijdstip, te rekenen waarvan niet langer een besluit krachtens de [Distributiewet 1939][ref1], als
      bedoeld in het eerste lid, in werking is.


      [ref1]: https://wetten.overheid.nl/BWBR0001997
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0001997
  - number: '47'
    text: |-
      De aan een vergunning verbonden voorschriften blijven, met betrekking tot onderwerpen waarin dit besluit voorziet,
      van kracht voor zover deze niet in strijd zijn met het bij of krachtens dit besluit bepaalde.
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel47
  - number: 48a.1
    text: |-
      Voor een stookinstallatie anders dan een procesfornuis waarop dit besluit van toepassing is
      als gevolg van de wijziging van het thermisch vermogen van 75 MWth in 50 MWth, genoemd in
      __REF000___________________________________________________________________________________________________________
      __, geldt:


      [ref1]: https://wetten.overheid.nl/BWBR0005829
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel48a
    references:
      - id: ref1
        bwb_id: BWBR0005829
  - number: 48a.1.a
    text: 'indien tussen 31 juli 1988 en 15 september 1991 vergunning is verleend, in afwijking van het bepaalde in:'
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel48a
  - number: 48a.1.a.1°
    text: |-
      [artikel 11, derde lid, onder c, onder 2°][ref1], een emissie-eis van 650 mg/m3 en met ingang van 1 januari 2008
      een emissie-eis van 600 mg/m3;


      [ref1]: https://wetten.overheid.nl/BWBR0004147#Artikel11
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel48a
    references:
      - id: ref1
        bwb_id: BWBR0004147
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 48a.1.a.2°
    text: |-
      [artikel 12, vierde lid, onder b][ref1], een emissie-eis van 450 mg/m3 en met ingang van 1 januari 2008 een
      emissie-eis van 400 mg/m3 indien de stookinstallatie een thermisch vermogen heeft van 500 MW of meer;


      [ref1]: https://wetten.overheid.nl/BWBR0004147#Artikel12
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel48a
    references:
      - id: ref1
        bwb_id: BWBR0004147
        artikel: '12'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 48a.1.a.3°
    text: |-
      [artikel 13, vierde lid, onder b][ref1], een emissie-eis van 350 mg/m3 en met ingang van 1 januari 2008 een
      emissie-eis van 300 mg/m3 indien de stookinstallatie een thermisch vermogen heeft van minder dan 500 MW en 200 mg/
      m3 indien de stookinstallatie een thermisch vermogen heeft van 500 MW of meer;


      [ref1]: https://wetten.overheid.nl/BWBR0004147#Artikel13
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel48a
    references:
      - id: ref1
        bwb_id: BWBR0004147
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 48a.1.b
    text: |-
      [artikel 16, derde lid][ref1] en [artikel 17, eerste lid][ref2], niet;


      [ref1]: https://wetten.overheid.nl/BWBR0004147#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0004147#Artikel17
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel48a
    references:
      - id: ref1
        bwb_id: BWBR0004147
        artikel: '16'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004147
        artikel: '17'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 48a.1.c
    text: |-
      voor de toepassing van [artikel 20][ref1], in plaats van de datum van 31 december 1989, de datum van 14 september
      1991;


      [ref1]: https://wetten.overheid.nl/BWBR0004147#Artikel20a
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel48a
    references:
      - id: ref1
        bwb_id: BWBR0004147
        artikel: 20a
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 48a.1.d
    text: |-
      in afwijking van de in [artikel 16, zesde lid][ref1], en in [artikel 20][ref2], vastgestelde ingangsdata, een
      ingangsdatum van 15 september 1991.


      [ref1]: https://wetten.overheid.nl/BWBR0004147#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0004147#Artikel20a
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel48a
    references:
      - id: ref1
        bwb_id: BWBR0004147
        artikel: '16'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004147
        artikel: 20a
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 48a.2
    text: |-
      Voor een bestaand procesfornuis gelden [artikel 16, derde lid][ref1], en [artikel 17, eerste lid, onder a][ref2],
      niet.


      [ref1]: https://wetten.overheid.nl/BWBR0004147#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0004147#Artikel17
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel48a
    references:
      - id: ref1
        bwb_id: BWBR0004147
        artikel: '16'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004147
        artikel: '17'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 48b
    text: |-
      Voor een stookinstallatie voor gasvormige of vloeibare brandstoffen met een vermogen, berekend op de bovenste
      verbrandingswaarde van de brandstof van minder dan 2,5 MW, waarvoor vóór 1 mei 1998 vergunning is verleend, geldt:
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel48b
  - number: 48b.a
    text: |-
      artikel 12, derde lid, onder a, b of c en vierde lid, onder a, b of c, artikel 13, tweede lid, onder a of b, derde
      lid, onder a, b of c en vierde lid, onder a, b, of c, zodra na 30 april 1998 de branders van de stookinstallatie
      worden vervangen;
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel48b
  - number: 48b.b
    text: |-
      in afwijking van [artikel 16, vierde lid][ref1], de emissie-eis, zodra op of na 1 mei 1998 de branders van de
      stookinstallatie worden vervangen;


      [ref1]: https://wetten.overheid.nl/BWBR0004147#Artikel16
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel48b
    references:
      - id: ref1
        bwb_id: BWBR0004147
        artikel: '16'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 48b.c
    text: |-
      niet [artikel 17, eerste lid, onder a, en onder b, onder 1°][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004147#Artikel17
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel48b
    references:
      - id: ref1
        bwb_id: BWBR0004147
        artikel: '17'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '50.1'
    text: |-
      Dit besluit treedt in werking met ingang van de eenendertigste dag na de datum van uitgifte van het *Staatsblad*
      waarin het is geplaatst.
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel50
  - number: '50.2'
    text: |-
      In afwijking van het eerste lid treden
      __REF000___________________________________________________________________________________________________________
      __________________________________________________________________________, en [23, eerste lid, onder c][ref2],
      van dit besluit in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende
      artikelonderdelen verschillend kan worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004147#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0004147#Artikel23
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0004147
        artikel: '12'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0004147
        artikel: '23'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: '50.3'
    text: Dit besluit kan worden aangehaald als het Besluit emissie-eisen stookinstallaties milieubeheer A.
    url: https://wetten.overheid.nl/BWBR0004147/2005-04-07#Artikel50
