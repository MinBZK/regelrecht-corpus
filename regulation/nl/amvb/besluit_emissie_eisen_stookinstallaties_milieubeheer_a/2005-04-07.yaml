      [artikel 17, eerste lid, onder b, onder 1°][ref3], een emissie-eis waarvan de waarde gelijk is aan de in dat
      artikellid aangegeven waarde, vermenigvuldigd met een factor voor de samenstelling van bedoelde gasvormige
      brandstof, zijnde: (1 + mol fractie C3+) (1 + mol fractie H); waarbij C3+ staat voor koolwaterstoffen met meer dan
      drie koolstofatomen.


