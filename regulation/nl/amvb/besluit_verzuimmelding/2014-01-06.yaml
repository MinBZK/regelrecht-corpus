    text: |-
      De gegevensverstrekking, bedoeld in de [artikelen 21a, eerste, tweede en zesde lid, van de Leerplichtwet 1969][ref1],
      [8.1.8a, eerste en vijfde lid, van de Wet educatie en beroepsonderwijs][ref2],
      [47b, eerste en vijfde lid, van de Wet op de expertisecentra][ref3] en
      [28a, eerste en vijfde lid, van de Wet op het voortgezet onderwijs][ref4], vindt plaats langs elektronische weg.


