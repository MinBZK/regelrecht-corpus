        bwb_id: BWBR0006622
        artikel: '8'
  - number: '3'
    text: De justitiële documentatiedienst registreert voorts
    url: https://wetten.overheid.nl/BWBR0002293/2002-01-01#Artikel3
  - number: '3.1'
    text: |-
      de gegevens als genoemd in artikel 5 van de wet, voor zover zij vóór het inwerkingtreden van de wet werden
      opgenomen in de strafregisters als bedoeld in het Koninklijk besluit van 19 februari 1896, *Stb.* 29, zoals dit
      laatstelijk werd gewijzigd, evenwel met uitzondering van de vonnissen, die hier te lande zijn gewezen door Duitse
      rechters en van vonnissen en arresten gewezen door de in het besluit van de Secretaris-Generaal van het Departement
      van Justitie van 12 augustus 1941 (*Verord. Bl.* 1941, 156) bedoelde vrederechters en het vredegerechtshof;
    url: https://wetten.overheid.nl/BWBR0002293/2002-01-01#Artikel3
  - number: '3.2'
    text: |-
      alle gegevens, welke de documentatiedienst als bedoeld in het "Besluit justitiële documentatie" (Koninklijk besluit
      van 2 februari 1951, *Stb.* 36) vóór de inwerkingtreding van de wet heeft geregistreerd ingevolge de artikelen 3 t/
      m 6 van de beschikking van de Minister van Justitie van 16 april 1951 (*Ned. Stcrt.* 1951, nr. 76) aangevuld bij
      beschikking van 29 juni 1951 (*Ned. Stcrt.* 1951, nr. 129), met uitzondering van de gegevens, betrekking hebbend op
      strafbare feiten als bedoeld in artikel 6 van deze algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0002293/2002-01-01#Artikel3
  - number: '4'
    text: 'De justitiële documentatiedienst registreert bovendien met betrekking tot de geregistreerde zaken:'
    url: https://wetten.overheid.nl/BWBR0002293/2002-01-01#Artikel4
  - number: '4.1'
    text: de datum van het vermoedelijk einde van een proeftijd;
    url: https://wetten.overheid.nl/BWBR0002293/2002-01-01#Artikel4
  - number: '4.2'
    text: de verlenging of verkorting van een proeftijd;
    url: https://wetten.overheid.nl/BWBR0002293/2002-01-01#Artikel4
  - number: '4.3'
    text: de verlenging of beëindiging van de terbeschikkingstelling van de regering;
    url: https://wetten.overheid.nl/BWBR0002293/2002-01-01#Artikel4
  - number: '4.4'
    text: de last tot gehele of gedeeltelijke tenuitvoerlegging van een voorwaardelijke veroordeling;
    url: https://wetten.overheid.nl/BWBR0002293/2002-01-01#Artikel4
  - number: '4.5'
    text: het opnieuw in behandeling nemen van een geseponeerde zaak;
    url: https://wetten.overheid.nl/BWBR0002293/2002-01-01#Artikel4
  - number: '4.6'
    text: het opnieuw in behandeling nemen van een voorwaardelijk niet-vervolgde zaak;
    url: https://wetten.overheid.nl/BWBR0002293/2002-01-01#Artikel4
  - number: '4.7'
    text: |-
      het bevel als bedoeld in [artikel 578, tweede lid van het Wetboek van Strafvordering][ref1] na voldoening aan de
      overeenkomstig [artikel 74 van het Wetboek van Strafrecht][ref2] gestelde voorwaarden;


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel578
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel74
    url: https://wetten.overheid.nl/BWBR0002293/2002-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '578'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '74'
  - number: '4.8'
    text: de beslissing dat een waarborgsom geheel of ten dele aan de Staat vervalt;
    url: https://wetten.overheid.nl/BWBR0002293/2002-01-01#Artikel4
  - number: '4.9'
    text: |-
      de beslissing op grond van het bepaalde in [artikel 577][ref1] tot verminderen of kwijtschelden, dan wel tot geheel
      of ten dele teruggeven of aan een derde uitkeren van het bedrag dat is vastgesteld in een maatregel als bedoeld
      in [artikel 36][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel577b
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel36e
    url: https://wetten.overheid.nl/BWBR0002293/2002-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 577b
      - id: ref2
        bwb_id: BWBR0001854
        artikel: 36e
  - number: '4.10'
    text: 'indien een aanvraag tot herziening is ingediend:'
    url: https://wetten.overheid.nl/BWBR0002293/2002-01-01#Artikel4
  - number: 4.10.a
    text: de verwijzing door de Hoge Raad;
    url: https://wetten.overheid.nl/BWBR0002293/2002-01-01#Artikel4
  - number: 4.10.b
    text: de uiteindelijke onherroepelijke afdoening;
    url: https://wetten.overheid.nl/BWBR0002293/2002-01-01#Artikel4
  - number: '4.11'
    text: de last tot uitstel of het niet doen plaatsvinden van vervroegde invrijheidstelling;
    url: https://wetten.overheid.nl/BWBR0002293/2002-01-01#Artikel4
  - number: '4.12'
    text: de beschikking tot intrekking van de voorwaardelijke invrijheidstelling;
    url: https://wetten.overheid.nl/BWBR0002293/2002-01-01#Artikel4
  - number: '4.13'
    text: de verlening van gehele of gedeeltelijke gratie;
    url: https://wetten.overheid.nl/BWBR0002293/2002-01-01#Artikel4
  - number: '4.14'
    text: de aan het besluit tot het verlenen van gratie verbonden bepalingen (voorwaarden);
    url: https://wetten.overheid.nl/BWBR0002293/2002-01-01#Artikel4
  - number: '4.15'
    text: de wijziging of de herroeping van een besluit tot het verlenen van gratie;
    url: https://wetten.overheid.nl/BWBR0002293/2002-01-01#Artikel4
  - number: '4.16'
    text: |-
      de beschikking tot voorwaardelijke beëindiging van de verpleging van een ter beschikking van de Regering gestelde,
      met de duur van de proeftijd;
    url: https://wetten.overheid.nl/BWBR0002293/2002-01-01#Artikel4
  - number: '4.17'
    text: |-
      de herroeping van de voorwaardelijke beëindiging van de verpleging van een ter beschikking van de Regering
      gestelde;
    url: https://wetten.overheid.nl/BWBR0002293/2002-01-01#Artikel4
  - number: '4.18'
    text: de vervanging van een geldboete door arrest of berisping;
    url: https://wetten.overheid.nl/BWBR0002293/2002-01-01#Artikel4
  - number: '4.19'
    text: de beëindiging van de maatregel van plaatsing in een inrichting voor buitengewone behandeling;
    url: https://wetten.overheid.nl/BWBR0002293/2002-01-01#Artikel4
  - number: '4.20'
    text: de voorwaardelijke beëindiging van de maatregel van plaatsing in een inrichting voor buitengewone behandeling;
    url: https://wetten.overheid.nl/BWBR0002293/2002-01-01#Artikel4
  - number: '4.21'
    text: |-
      de herroeping van de voorwaardelijke beëindiging van de maatregel van plaatsing in een inrichting voor buitengewone
      behandeling;
    url: https://wetten.overheid.nl/BWBR0002293/2002-01-01#Artikel4
  - number: '4.22'
    text: |-
      de vervanging van de maatregel van plaatsing in een inrichting voor buitengewone behandeling door de maatregel van
      terbeschikkingstelling van de Regering;
    url: https://wetten.overheid.nl/BWBR0002293/2002-01-01#Artikel4
  - number: '4.23'
    text: de vervanging van de straf van plaatsing in een tuchtschool door een andere straf;
    url: https://wetten.overheid.nl/BWBR0002293/2002-01-01#Artikel4
  - number: '4.24'
    text: de vervanging van de geldboete door jeugddetentie, hechtenis of een alternatieve sanctie;
    url: https://wetten.overheid.nl/BWBR0002293/2002-01-01#Artikel4
  - number: '4.25'
    text: de verlenging of de beëindiging van de maatregel van plaatsing in een inrichting voor jeugdigen;
    url: https://wetten.overheid.nl/BWBR0002293/2002-01-01#Artikel4
  - number: '4.26'
    text: de voorwaardelijke beëindiging van de maatregel van plaatsing in een inrichting voor jeugdigen;
    url: https://wetten.overheid.nl/BWBR0002293/2002-01-01#Artikel4
  - number: '4.27'
    text: de herroeping van de voorwaardelijke beëindiging van de maatregel van plaatsing in een inrichting voor jeugdigen;
    url: https://wetten.overheid.nl/BWBR0002293/2002-01-01#Artikel4
  - number: '4.28'
    text: de omzetting van een alternatieve straf in een vrijheidsstraf;
    url: https://wetten.overheid.nl/BWBR0002293/2002-01-01#Artikel4
  - number: '4.29'
    text: |-
      het opleggen en gelasten van de gehele of gedeeltelijke tenuitvoerlegging van een vrijheidsstraf in plaats van de
      straf van het verrichten van onbetaalde arbeid;
    url: https://wetten.overheid.nl/BWBR0002293/2002-01-01#Artikel4
  - number: '4.30'
    text: de voorwaardelijke invrijheidstelling van een jeugdige;
    url: https://wetten.overheid.nl/BWBR0002293/2002-01-01#Artikel4
  - number: '4.31'
    text: |-
      de gehele of gedeeltelijke vervanging van de straf van jeugddetentie in een van de straffen genoemd in
      [artikel 9, eerste lid, van het Wetboek van Strafrecht][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel9
    url: https://wetten.overheid.nl/BWBR0002293/2002-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '9'
  - number: '4.32'
    text: de verlenging van de maatregel van terbeschikkingstelling;
    url: https://wetten.overheid.nl/BWBR0002293/2002-01-01#Artikel4
  - number: '4.33'
    text: |-
      de voorwaardelijke beëindiging van de verpleging van overheidswege als bedoeld in [artikel 38][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel38g
    url: https://wetten.overheid.nl/BWBR0002293/2002-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 38g
  - number: '4.34'
    text: |-
      het geven van een bevel tot verpleging van overheidswege als bedoeld in [artikel 38][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel38c
    url: https://wetten.overheid.nl/BWBR0002293/2002-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 38c
  - number: '4.35'
    text: |-
      het geven van een last tot hervatting van de verpleging van overheidswege als bedoeld in [artikel 38][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel38k
    url: https://wetten.overheid.nl/BWBR0002293/2002-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 38k
  - number: '5'
    text: |-
      De justitiële documentatiedienst registreert de in de [artikelen 2][ref1], [3][ref2] en [4][ref3] bedoelde
      gegevens in de bij de dienst te houden algemene documentatieregisters.


      [ref1]: https://wetten.overheid.nl/BWBR0002293#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002293#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0002293#Artikel4
    url: https://wetten.overheid.nl/BWBR0002293/2002-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002293
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0002293
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0002293
        artikel: '4'
  - number: '6'
    text: |-
      Buiten registratie door de justitiële documentatiedienst blijven de zaken als bedoeld in [artikel 2 onder 1][ref1]
      indien het door de officier van justitie in behandeling genomen proces-verbaal betrekking heeft op


      [ref1]: https://wetten.overheid.nl/BWBR0002293#Artikel2
    url: https://wetten.overheid.nl/BWBR0002293/2002-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002293
        artikel: '2'
  - number: 6.a
    text: |-
      een strafbaar feit, beschouwd als overtreding ingevolge
      [artikel 72 van de Algemene wet inzake rijksbelastingen][ref1] (*Stb.* 1959, 301) of artikel 191 van de Algemene
      wet inzake de douane en de accijnzen (*Stb.* 1961, 31);


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel72
    url: https://wetten.overheid.nl/BWBR0002293/2002-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '72'
  - number: 6.b
    text: |-
      een overtreding van een provinciale verordening, waarbij - ingevolge [artikel 146 van de Provinciewet][ref1] -
      belasting of andere rechten worden geheven;


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel146
    url: https://wetten.overheid.nl/BWBR0002293/2002-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '146'
  - number: 6.c
    text: |-
      een overtreding van een gemeentelijke verordening, waarbij - ingevolge [artikel 272 van de gemeentewet][ref1] -
      belasting of andere rechten worden geheven;


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel272
    url: https://wetten.overheid.nl/BWBR0002293/2002-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '272'
  - number: 6.d
    text: een overtreding als bedoeld in artikel 54 van de Wet op het notarisambt;
    url: https://wetten.overheid.nl/BWBR0002293/2002-01-01#Artikel6
  - number: 6.e
    text: |-
      een overtreding als bedoeld in [artikel 465][ref1], [466][ref2], [467][ref3] of
      [468 onder 1° van het Wetboek van Strafrecht][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel465
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel466
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel467
      [ref4]: https://wetten.overheid.nl/BWBR0001854#Artikel468
    url: https://wetten.overheid.nl/BWBR0002293/2002-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '465'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '466'
      - id: ref3
        bwb_id: BWBR0001854
        artikel: '467'
      - id: ref4
        bwb_id: BWBR0001854
        artikel: '468'
  - number: 6.f
    text: een overtreding van artikel 3 van de Enquêtewet.
    url: https://wetten.overheid.nl/BWBR0002293/2002-01-01#Artikel6
  - number: '7.1'
    text: |-
      De ingevolge dit besluit geregistreerde gegevens worden uit de justitiële documentatie verwijderd, zodra komt vast
      te staan dat de betrokken persoon ten onrechte als verdachte is aangemerkt.
    url: https://wetten.overheid.nl/BWBR0002293/2002-01-01#Artikel7
  - number: '7.2'
    text: |-
      De ingevolge dit besluit geregistreerde gegevens worden uit de justitiële documentatie verwijderd na verloop van
      een termijn van twintig jaren.
    url: https://wetten.overheid.nl/BWBR0002293/2002-01-01#Artikel7
  - number: '7.3'
    text: |-
      De in het tweede lid genoemde termijn wordt verlengd met de bij de uitspraak bepaalde duur van de opgelegde
      vrijheidsstraf indien deze drie jaren te boven gaat alsmede met de duur van de terbeschikkingstelling, de duur van
      de plaatsing in een inrichting voor buitengewone behandeling of van de plaatsing in een inrichting voor jeugdigen.
    url: https://wetten.overheid.nl/BWBR0002293/2002-01-01#Artikel7
  - number: '7.4'
    text: |-
      Bij toepassing van het derde lid wordt de termijn bovendien verlengd met tien jaren in het geval van veroordeling
      wegens een misdrijf waarop naar de wettelijke omschrijving een gevangenisstraf van acht jaren of meer is gesteld.
    url: https://wetten.overheid.nl/BWBR0002293/2002-01-01#Artikel7
  - number: 7a
    text: |-
      De gegevens als bedoeld in [artikel 2 onder 1][ref1], alsmede de gegevens omtrent rechtspersonen
      of vennootschappen worden uit de justitiële documentatie verwijderd na verloop van 5 jaren.
      Evenwel worden de gegevens welke langer beschikbaar moeten blijven opdat kan worden voldaan aan
      [artikel 7 van het Besluit inlichtingen justitiële documentatie][ref2] na tien jaren verwijderd.


      [ref1]: https://wetten.overheid.nl/BWBR0002293#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002292#Artikel7
    url: https://wetten.overheid.nl/BWBR0002293/2002-01-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0002293
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0002292
        artikel: '7'
  - number: 7b
    text: |-
      De gegevens worden in elk geval verwijderd indien sedert de geboortedag van de betrokken persoon tachtig jaren zijn
      verstreken of na het overlijden van de betrokken persoon.
    url: https://wetten.overheid.nl/BWBR0002293/2002-01-01#Artikel7b
  - number: 7c.1
    text: |-
      De in de [artikelen 7][ref1] en [7][ref2] bedoelde termijn vangt aan op de dag volgende op die waarop de zaak
      onherroepelijk is afgedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002293#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002293#Artikel7a
    url: https://wetten.overheid.nl/BWBR0002293/2002-01-01#Artikel7c
    references:
      - id: ref1
        bwb_id: BWBR0002293
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0002293
        artikel: 7a
  - number: 7c.2
    text: |-
      Indien gedurende twintig jaren na de dag van registratie bij de justitiële documentatiedienst geen melding
      is binnengekomen dat de zaak onherroepelijk is afgedaan, vangt de termijn aan op de dag waarop de zaak is
      geregistreerd.
    url: https://wetten.overheid.nl/BWBR0002293/2002-01-01#Artikel7c
  - number: '8'
    text: |-
      Onze Minister van Justitie kan ten aanzien van de wijze van registratie en van verwijdering van gegevens genoemd in
      deze algemene maatregel van bestuur nadere voorschriften geven.
    url: https://wetten.overheid.nl/BWBR0002293/2002-01-01#Artikel8
  - number: '9.1'
    text: Dit besluit kan worden aangehaald als Besluit registratie justitiële gegevens.
    url: https://wetten.overheid.nl/BWBR0002293/2002-01-01#Artikel9
  - number: '9.2'
    text: |-
      Het besluit treedt in werking tegelijk met de
      [Wet op de justitiële documentatie en op de verklaringen omtrent het gedrag][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002195
    url: https://wetten.overheid.nl/BWBR0002293/2002-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002195
