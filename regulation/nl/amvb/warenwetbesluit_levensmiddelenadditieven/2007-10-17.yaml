preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Welzijn, Volksgezondheid en Cultuur van 25 september 1991, VVP/L/
    U-691763, gedaan in overeenstemming met Onze Minister van Economische Zaken en de Staatssecretaris van Landbouw,
    Natuurbeheer en Visserij;

    Overwegende, dat uitvoering moet worden gegeven aan de Richtlijn van de Raad van de Europese Gemeenschappen
    van 21 december 1988 betreffende de onderlinge aanpassing van de wetgevingen der Lid-Staten inzake
    levensmiddelenadditieven die in voor menselijke voeding bestemde waren mogen worden gebruikt (89/107/EEG) (PbEG
    L 40);

    Overwegende, dat het voor de inzichtelijkheid van de wetgeving gewenst is dat de regels met betrekking tot de
    toelating van levensmiddelenadditieven zoveel mogelijk worden geconcentreerd in één Warenwetbesluit;

    Overwegende, dat het om die reden tevens gewenst is dat de gebruiksvoorwaarden in of krachtens zodanig
    Warenwetbesluit dienen te worden vastgesteld;

    Gelet op de artikelen 4, eerste lid, onderdeel a,6, onderdeel a, 8, onderdelen a, b en c, 12 en 14 van de Warenwet
    (Stb. 1988, 360);

    Gehoord de Adviescommissie Warenwet (advies van 12 december 1990, nr. 14245/(1)5);

    De Raad van State gehoord (advies van 4 december 1991, nr. W13.91.0538);

    Gezien het nader rapport van de Staatssecretaris van Welzijn, Volksgezondheid en Cultuur van 11 maart 1992 VVP/L-
    92371, uitgebracht in overeenstemming met Onze Minister van Economische Zaken en de Staatssecretaris van Landbouw,
    Natuurbeheer en Visserij;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0005456/2007-10-17#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. levensmiddelenadditieven: alle stoffen met of zonder voedingswaarde die op zichzelf gewoonlijk niet als voedsel
      worden geconsumeerd en gewoonlijk niet als kenmerkend voedsel-ingrediënt worden gebruikt, en die om technische
      redenen bij het vervaardigen, verwerken, bereiden, behandelen, verpakken, vervoeren of opslaan van eet- of
      drinkwaren opzettelijk daaraan worden toegevoegd, met als gevolg, of redelijkerwijs te verwachten gevolg, dat de
      stoffen zelf, dan wel de derivaten ervan, direct of indirect een bestanddeel van die eet- of drinkwaren worden;

      b. instellingen: restaurants, ziekenhuizen, kantines en andere soortgelijke instellingen,

      c. richtlijn: de richtlijn van de Raad van de EEG inzake de onderlinge aanpassing van de wetgevingen der Lid-Staten
      inzake levensmiddelenadditieven die in voor menselijke voeding bestemde waren mogen worden gebruikt (89/107/EEG)
      (*PbEG* L 40).

      2 Als levensmiddelenadditief worden niet beschouwd:

      a. gewasbeschermingsmiddelen of biociden als bedoeld in de [Wet gewasbeschermingsmiddelen en biociden][ref1];

      b. stoffen die als voedingsstoffen aan eet- of drinkwaren worden toegevoegd, zoals mineralen, sporeëlementen en
      vitamines.

      3 Dit besluit is niet van toepassing op

      a. stoffen die, hoewel zij als levensmiddelenadditieven gebruikt kunnen worden, kennelijk niet als zodanig bestemd
      zijn;

      b. geur- en smaakstoffen als bedoeld in het [Warenwetbesluit Aroma's][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0021670
      [ref2]: https://wetten.overheid.nl/BWBR0005413
    url: https://wetten.overheid.nl/BWBR0005456/2007-10-17#Artikel1
    references:
