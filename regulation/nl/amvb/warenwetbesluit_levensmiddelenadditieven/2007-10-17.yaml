        artikel: '4'
        paragraaf: '2'
  - number: '4'
    text: |-
      1 Levensmiddelenadditieven moeten voldoen aan de volgende algemene zuiverheidseisen:

      a. het gehalte aan arsenicum mag ten hoogste 3 mg per kg bedragen;

      b. het gehalte aan lood mag ten hoogste 10 mg per kg bedragen;

      c. het gezamenlijk gehalte aan koper en zink mag ten hoogste 50 mg per kg bedragen, waarbij het gehalte aan zink
      niet hoger mag zijn dan 25 mg per kg.

      2 Onze Minister stelt nadere regels vast met betrekking tot

      a. de zuiverheid van levensmiddelenadditieven in het algemeen, of van bepaalde levensmiddelenadditieven;

      b. de hoedanigheid van levensmiddelenadditieven die worden gebruikt als oplosmiddelen die als draagstof fungeren.
    url: https://wetten.overheid.nl/BWBR0005456/2007-10-17#Artikel4
  - number: '5'
    text: |-
      1 Bij de verhandeling moet de voor het betrokken levensmiddelenadditief van toepassing zijnde aanduiding worden
      gebezigd.

      2 De in het eerste lid bedoelde aanduiding is het EEG-nummer en de bijbehorende algemeen gebruikelijke naam van
      het desbetreffende levensmiddelenadditief. Voor zover voor de desbetreffende stof geen EEG-nummer is vastgesteld,
      is die aanduiding een omschrijving van het levensmiddelenadditief die voldoende nauwkeurig is om deze te kunnen
      onderscheiden van andere levensmiddelenadditieven waarmee deze kan worden verward.

      3 Indien het levensmiddelenadditief tezamen met andere levensmiddelenadditieven worden verhandeld, moeten de
      desbetreffende aanduidingen in afnemende volgorde van het gewichtsaandeel worden vermeld.

      4 Indien een of meer levensmiddelenadditieven tezamen met andere stoffen, materialen of ingrediënten ten behoeve
      van de bereiding van eet- of drinkwaren worden geïntegreerd om het opslaan, verhandelen, standaardiseren, verdunnen
      of oplossen ervan te vergemakkelijken, moet de aanduiding, onderscheidenlijk moeten de aanduidingen bij de
      verhandeling worden vermeld in afnemende volgorde van het gewichtsaandeel.

      5 De volgende vermelding moet bij de verhandeling worden gebezigd: "voor gebruik in levensmiddelen", of "voor
      levensmiddelen, beperkt gebruik", dan wel een meer specifieke vermelding inzake de toepassing in de eet- of
      drinkwaar waarvoor het levensmiddelenadditief bestemd is.

      6 De in dit artikel bedoelde aanduiding en vermeldingen moeten duidelijk zichtbaar, gemakkelijk leesbaar en in een
      gemakkelijk te begrijpen taal zijn aangebracht, en mogen niet door vegen kunnen worden uitgewist.
    url: https://wetten.overheid.nl/BWBR0005456/2007-10-17#Artikel5
  - number: '6'
    text: |-
      1 Indien de levensmiddelenadditieven als zodanig niet zijn bestemd voor de eindverbruiker of instellingen, moeten,
      onverminderd [artikel 5][ref1], bij de verhandeling de volgende vermeldingen worden gebezigd:

      a. zo nodig een aanwijzing omtrent de bijzondere voorwaarden voor bewaring en gebruik;

      b. een gebruiksaanwijzing indien zonder zodanige vermelding een behoorlijk gebruik van het levensmiddelenadditief
      onmogelijk is;

      c. de naam of handelsnaam en het adres van de fabrikant, verpakker of van een in het gebied waarop het Verdrag
      tot oprichting van de Europese Economische Gemeenschap dan wel de Overeenkomst betreffende de Europese Economische
      Ruimte van toepassing is gevestigde verkoper, waarbij voor rechtspersonen de vermelding van het adres mag worden
      vervangen door de vermelding van de plaats van vestiging;

      d. het percentage van elk bestanddeel waarvoor in een eet- of drinkwaar een kwantitatieve beperking geldt of
      andere passende gegevens over de samenstelling aan de hand waarvan de koper kan voldoen aan enigerlei voor de
      desbetreffende eet- of drinkwaar geldend wettelijk voorschrift, met dien verstande dat het gecombineerde percentage
      in één getal mag worden aangegeven indien deze kwantitatieve beperking geldt voor een groep bestanddelen die
      afzonderlijk of in combinatie wordt gebruikt en

      e. de netto-hoeveelheid.

      Zij moeten duidelijk zichtbaar, gemakkelijk leesbaar en in een gemakkelijk te begrijpen taal zijn aangebracht, en
      mogen niet door vegen kunnen worden uitgewist.

      2 In afwijking van het eerste lid en [artikel 5, vierde lid][ref2], behoeven de in het eerste lid, onderdelen
      *b* en *d*, bedoelde vermeldingen slechts voor te komen op de handelsdocumenten die de desbetreffende
      levensmiddelenadditieven vergezellen of die reeds voor of tegelijkertijd met de aflevering worden verzonden. In dat
      geval moet de volgende vermelding goed zichtbaar op de verpakking worden gebezigd: "bestemd voor de vervaardiging
      van levensmiddelen, niet voor de verkoop in het klein".


      [ref1]: https://wetten.overheid.nl/BWBR0005456#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005456#Artikel5
