  - number: '7'
    text: |-
      1 In eet- of drinkwaren mogen slechts levensmiddelenadditieven aanwezig zijn indien het gebruik van deze additieven
      in die eet- of drinkwaren in overeenstemming is met de criteria die zijn opgenomen in de [Bijlage II][ref1].

      2 Onze Minister stelt nadere regels vast met betrekking tot het gebruik van levensmiddelenadditieven die de
      volgende onderwerpen betreffen:

      a. de ten hoogste toegelaten hoeveelheid van het betrokken levensmiddelenadditief of de categorie
      levensmiddelenadditieven die in eet- of drinkwaren aanwezig mag zijn;

      b. in voorkomend geval welke beperking voor wat betreft het technisch gebruiksdoel van toepassing is.

      3 Voor zover de in het tweede lid bedoelde regeling niet voortvloeit uit een krachtens het Verdrag tot oprichting
      van de Europese Gemeenschap tot stand gekomen bindende regeling, stelt Onze Minister bedoelde regels vast in
      overeenstemming met Onze Minister van Landbouw, Natuurbeheer en Visserij.

      4 In eet- of drinkwaren genoemd in de krachtens het tweede lid vastgestelde regeling, mogen uitsluitend
      levensmiddelenadditieven aanwezig zijn welke in samenhang met de desbetreffende waar zijn genoemd, een en ander met
      inachtneming van de beperkingen voor zover daarbij vermeld met betrekking tot de ten hoogste toegelaten hoeveelheid
      en de aard van de waar. In geval van een niet voor gebruik gereed zijnde waar, wordt de uit die beperkingen
      voortvloeiende, ten hoogste toegelaten hoeveelheid in de desbetreffende waar, berekend op het produkt verkregen uit
      die waar na bereiding volgens de gebruiksaanwijzing.

      5 Het vierde lid, tweede volzin, is van overeenkomstige toepassing op voorschriften krachtens de [Warenwet][ref2]
      met betrekking tot een of meer andere dan in dat lid bedoelde eet- of drinkwaren of groepen van eet- of
      drinkwaren, voor wat betreft het daarin gestelde ten aanzien van de ten hoogste toegestane aanwezigheid van
      levensmiddelenadditieven in de aldaar bedoelde eet- of drinkwaren.


      [ref1]: https://wetten.overheid.nl/BWBR0005456
      [ref2]: https://wetten.overheid.nl/BWBR0001969
    url: https://wetten.overheid.nl/BWBR0005456/2007-10-17#Artikel7
    references:
