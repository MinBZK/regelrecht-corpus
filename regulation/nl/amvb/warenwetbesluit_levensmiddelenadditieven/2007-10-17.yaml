  - number: '2'
    text: |-
      1 Het is verboden levensmiddelenadditieven die niet ingevolge dit besluit zijn toegelaten om als zodanig te dienen,
      of die niet voldoen aan de bij of krachtens dit besluit gestelde eisen, te verhandelen of in eet- of drinkwaren
      te verwerken.

      2 Het is verboden levensmiddelenadditieven te verhandelen anders dan met inachtneming van de voorschriften in dit
      besluit gesteld met betrekking tot hun aanduiding of tot het bezigen van vermeldingen.

      3 Het is verboden met gebruikmaking van de in dit besluit aangegeven aanduidingen andere waren te verhandelen dan
      levensmiddelenadditieven waaraan die aanduidingen zijn voorbehouden.

      4 Het is verboden eet- of drinkwaren te bereiden of te verhandelen die niet voldoen aan de eisen bij of krachtens
      dit besluit gesteld met betrekking tot de aanwezigheid van levensmiddelenadditieven in die eet- of drinkwaren.
    url: https://wetten.overheid.nl/BWBR0005456/2007-10-17#Artikel2
  - number: '3'
    text: |-
      1 Als levensmiddelenadditief zijn uitsluitend toegelaten stoffen die behoren tot een in [bijlage I][ref1] genoemde
      categorie van levensmiddelenadditieven.

      2 Indien Onze Minister ter uitvoering van krachtens de richtlijn getroffen maatregelen stoffen, behorende tot een
      bepaalde categorie van levensmiddelenadditieven heeft aangewezen, zijn, in afwijking van het eerste lid, binnen die
      categorie uitsluitend die aangewezen stoffen toegelaten.

      3 In afwijking van het eerste lid zijn van de stoffen behorende tot de categorie zoetstof als bedoeld in het
      [Warenwetbesluit Zoetstoffen][ref2], als levensmiddelenadditief uitsluitend toegelaten de op grond van genoemd
      besluit toegelaten stoffen. De [artikelen 4 tot en met 8][ref3] zijn op zoetstoffen niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005456
      [ref2]: https://wetten.overheid.nl/BWBR0004652
      [ref3]: https://wetten.overheid.nl/BWBR0005456#Artikel4
    url: https://wetten.overheid.nl/BWBR0005456/2007-10-17#Artikel3
    references:
