  - number: '8'
    text: |-
      1 Als methoden van onderzoek welke bij uitsluiting beslissend zijn voor de vaststelling of met betrekking tot de
      in dit besluit bedoelde levensmiddelenadditieven, onderscheidenlijk met betrekking tot eet- of drinkwaren waaraan
      levensmiddelenadditieven zijn toegevoegd, al dan niet is voldaan aan de bij of krachtens dit besluit gestelde
      regels, worden aangewezen chromatografische scheidingsmethoden, alsmede fysische, biologische en chemische
      isolatiemethoden.

      2 Voor zover de in het eerste lid bedoelde methoden van onderzoek niet voortvloeien uit een krachtens het Verdrag
      tot oprichting van de Europese Gemeenschap tot stand gekomen bindende regeling, stelt Onze Minister bedoelde
      methoden vast in overeenstemming met Onze Minister van Landbouw, Natuurbeheer en Visserij.
    url: https://wetten.overheid.nl/BWBR0005456/2007-10-17#Artikel8
  - number: '13'
    text: |-
      1 Dit besluit treedt in werking met ingang van de tweede dag na de datum van uitgifte van het *Staatsblad*, waarin
      het wordt geplaatst.

      2 In afwijking van het eerste lid mogen levensmiddelenadditieven welke voldoen aan de op de dag, voorafgaande aan
      de in het eerste lid bedoeld datum, op die waren van toepassing zijnde voorschriften, nog worden verhandeld tot en
      met 1 juni 1992.
    url: https://wetten.overheid.nl/BWBR0005456/2007-10-17#Artikel13
