  - number: '4'
    text: |-
      Het is verboden asbest of asbesthoudende producten te vervaardigen, in Nederland in te voeren, voorhanden te
      hebben, aan een ander ter beschikking te stellen, toe te passen of te bewerken.
    url: https://wetten.overheid.nl/BWBR0017778/2008-06-01#Artikel4
  - number: '5'
    text: |-
      Het verbod, bedoeld in [artikel 4][ref1], is niet van toepassing voorzover dit betrekking heeft op:

      a. het voorhanden hebben of aan een ander ter beschikking stellen van een product dat rechtmatig op de markt
      is gebracht of waarin asbest of een asbesthoudend product rechtmatig is toegepast en dat voor de datum van
      inwerkingtreding van dit besluit reeds geïnstalleerd of in bedrijf was, tenzij bij wettelijk voorschrift anders
      is bepaald;

      b. het uitvoeren van laboratoriumonderzoek of het nemen van materiaalmonsters, teneinde de samenstelling van het
      asbest en het asbestgehalte van asbesthoudende producten vast te stellen;

      c. het maken van aanboringen of het uitvoeren van reparatie- of onderhoudswerkzaamheden;

      d. het reinigen van kledingstukken en werktuigen die zijn gebruikt bij werkzaamheden waarbij asbest aanwezig was of
      is vrijgekomen;

      e. het afgraven, opslaan, tijdens het vervoer voorhanden hebben of aan een ander ter beschikking stellen van
      afvalstoffen indien daaraan geen asbest opzettelijk is toegevoegd, tenzij bij wettelijk voorschrift anders is
      bepaald;

      f. het reinigen van afvalstoffen waaraan geen asbest opzettelijk is toegevoegd en waarvan na reiniging de
      concentratie serpetijnasbest, vermeerderd met tien maal de concentratie amfiboolasbest, bepaald overeenkomstig
      een krachtens [artikel 2, onder b][ref2], vastgestelde methode, niet hoger is dan de in dat onderdeel aangegeven
      hoeveelheid per kilogram droge stof, tenzij bij wettelijk voorschrift anders is bepaald;

      g. handelingen die betrekking hebben op het opruimen van asbest of een asbesthoudend product dat ten gevolge van
      een incident is vrijgekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0017778#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0017778#Artikel2
    url: https://wetten.overheid.nl/BWBR0017778/2008-06-01#Artikel5
