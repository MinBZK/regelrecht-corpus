      [ref2]: https://wetten.overheid.nl/BWBR0010346#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0017778#Artikel4
    url: https://wetten.overheid.nl/BWBR0017778/2008-06-01#Artikel8
