    text: |-
      1 De krachtens [artikel 9.11 van het Arbeidsomstandighedenbesluit][ref1], zoals dat artikel luidde op de dag voor
      de inwerkingtreding van dit besluit, verleende ontheffingen blijven, met inbegrip van de aan die ontheffingen
      verbonden voorschriften of beperkingen, van kracht tot en met het tijdstip waarvoor die ontheffingen zijn verleend.

      2 Ten aanzien van de ontheffingen, bedoeld in het eerste lid, is [artikel 4][ref2] niet van toepassing.


