  - number: '3'
    text: |-
      1 Dit besluit is voorts niet van toepassing:

      a. tijdens, direct voor en direct na oefeningen als bedoeld in
      [artikel 1.5, onder d, van het Arbeidsomstandighedenbesluit][ref1];

      b. ten aanzien van militaire vaartuigen, militaire luchtvaartuigen, bemande wapensystemen en eenheden met
      gereedstelling:

      1°. voorzover afwijking van dit besluit naar het oordeel van Onze Minister van Defensie noodzakelijk is in verband
      met de bouw, constructie, inrichting of uitrusting van deze vaartuigen en wapensystemen;

      2°. indien oorlogsschepen varen en indien militaire luchtvaartuigen en bemande wapensystemen als zodanig in gebruik
      zijn;

      3°. voorzover de operationele taakuitvoering van deze vaartuigen en wapensystemen of van de eenheden met
      gereedstelling naar het oordeel van Onze Minister van Defensie door de toepassing van dit besluit wordt belemmerd.

      2 Onder militaire vaartuigen, militaire luchtvaartuigen, bemande wapensystemen en eenheden met gereedstelling wordt
      verstaan hetgeen daaronder wordt verstaan in [artikel 1.5 van het Arbeidsomstandighedenbesluit][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel1.5
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel1.5
