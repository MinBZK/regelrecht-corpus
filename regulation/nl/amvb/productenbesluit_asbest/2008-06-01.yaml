  - number: '6'
    text: |-
      1 Handelingen als bedoeld in [artikel 5][ref1] met asbest of asbesthoudende producten worden op een zodanige wijze
      verricht dat gevaren voor mens en milieu die door zodanige handelingen kunnen ontstaan, worden voorkomen.

      2 Bij regeling van Onze Minister kunnen met het oog op het voorkomen van gevaren voor mens of milieu met asbest
      regels worden gegeven die ten minste bij het verrichten van zodanige handelingen in acht worden genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0017778#Artikel5
    url: https://wetten.overheid.nl/BWBR0017778/2008-06-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0017778
        artikel: '5'
        paragraaf: '2'
  - number: '7'
    text: |-
      1 Asbesthoudende producten die in handelsvoorraden voorhanden zijn, aan een ander ter beschikking worden gesteld of
      worden toegepast, zijn voorzien van aanduidingen overeenkomstig de bijlage bij dit besluit.

      2 Het eerste lid is niet van toepassing op bouwwerken, constructies, installaties en transportmiddelen.
    url: https://wetten.overheid.nl/BWBR0017778/2008-06-01#Artikel7
  - number: '8'
    text: |-
      Ter uitvoering van [artikel 16, tiende lid, van de Arbeidsomstandighedenwet][ref1] zijn de werkgever, de werknemer,
      de zelfstandige en de werkgever, bedoeld in [artikel 16, zevende lid, van de Arbeidsomstandighedenwet][ref2]
      verplicht tot naleving van [artikel 4][ref3].


