articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. Onze Minister: Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer;

      b. asbest: de volgende vezelachtige silicaten: actinoliet (CAS-nummer 77536-66-4), amosiet (CAS-nummer 12172-73-5),
      anthofylliet (CAS-nummer 77536-67-5), chrysotiel (CAS-nummer 12001-29-5), crocidoliet (CAS-nummer 12001-28-4) en
      tremoliet (CAS-nummer 77536-68-6);

      c. serpentijnasbest: het vezelachtige silicaat, chrysotiel;

      d. amfiboolasbest: vezelachtige silicaten: actinoliet, amosiet, anthofylliet, crocidoliet en tremoliet.
    url: https://wetten.overheid.nl/BWBR0017778/2008-06-01#Artikel1
  - number: '2'
    text: |-
      Dit besluit is niet van toepassing op:

      a. asbest of een asbesthoudend product dat wordt verwijderd in een inrichting als bedoeld in
      [artikel 1.1, vierde lid, van de Wet milieubeheer][ref1];

      b. een product waaraan geen asbest opzettelijk is toegevoegd en waarvan de concentratie serpentijnasbest,
      vermeerderd met tien maal de concentratie amfiboolasbest, bepaald overeenkomstig een bij regeling van Onze Minister
      vast te stellen methode, niet hoger is dan honderd milligram per kilogram droge stof;

      c. handelingen waaromtrent regels zijn gesteld bij of krachtens het [Asbestverwijderingsbesluit 2005][ref2];

      d. het geheel of gedeeltelijk afbreken of uit elkaar nemen van bouwwerken of objecten waarin asbest of
      asbesthoudende producten is respectievelijk zijn verwerkt en het verwijderen van asbest of asbesthoudende
      producten uit deze bouwwerken of objecten voorzover daaromtrent regels zijn gesteld bij of krachtens het
      [Arbeidsomstandighedenbesluit][ref3];

      e. het verplaatsen van verontreinigde grond binnen een geval van ernstige verontreiniging als bedoeld in
      [artikel 1 van de Wet bodembescherming][ref4], tenzij aan die grond asbest opzettelijk is toegevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel1.1
      [ref2]: https://wetten.overheid.nl/BWBR0019316
      [ref3]: https://wetten.overheid.nl/BWBR0008498
      [ref4]: https://wetten.overheid.nl/BWBR0003994#Artikel1
