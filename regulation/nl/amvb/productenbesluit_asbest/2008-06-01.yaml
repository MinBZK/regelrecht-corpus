  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer, de
    Staatssecretaris van Sociale Zaken en Werkgelegenheid en Onze Minister van Volksgezondheid, Welzijn en Sport van 6
    juli 2004, nr. MJZ2004060995, Centrale Directie Juridische Zaken, Afdeling Wetgeving, gedaan in overeenstemming met
    Onze Minister van Economische Zaken;

    Gelet op artikel 5 van richtlijn nr. 83/477/EEG van de Raad van 19 september 1983 betreffende de bescherming van
    werknemers tegen de risico's van blootstelling aan asbest op het werk (PbEG L 263), artikel 3 van richtlijn nr.
    83/478/EEG van de Raad van 19 september 1983 (PbEG L 263), houdende vijfde wijziging (asbest) van richtlijn nr.
    76/769/EEG van de Raad betreffende de onderlinge aanpassing van de wettelijke en bestuursrechtelijke bepalingen
    der lidstaten inzake de beperking van het op de markt brengen en van het gebruik van bepaalde gevaarlijke stoffen
    en preparaten, artikel 7, eerste gedachtestreepje, van richtlijn nr. 87/217/EEG van de Raad van 19 maart 1987
    inzake voorkoming en vermindering van verontreiniging van het milieu door asbest (PbEG L 85), artikel 2, vijfde
    lid, tweede volzin, en zesde lid, eerste volzin, van richtlijn nr. 98/12/EG van de Commissie van 27 januari
    1998 (PbEG L 81) tot aanpassing aan de technische vooruitgang van richtlijn nr. 71/320/EEG van de Raad inzake de
    onderlinge aanpassing van de wetgevingen van de lidstaten betreffende de reminrichtingen van bepaalde categorieën
    motorvoertuigen en aanhangwagens daarvan, richtlijn nr. 1999/77/EG van de Commissie van 26 juli 1999 (PbEG L 207)
    tot zesde aanpassing aan de technische vooruitgang van bijlage I bij richtlijn nr. 76/769/EEG, artikel 3, tweede
    lid, tweede volzin, van richtlijn nr. 2002/78/EG van de Commissie van 1 oktober 2002 (PbEG L 267) tot aanpassing
    aan de technische vooruitgang van richtlijn nr. 71/320/EEG, artikel 1, vijfde lid, van richtlijn nr. 2003/18/
    EG van het Europese Parlement en de Raad van 27 maart 2003 (PbEU L 97) tot wijziging van richtlijn 83/477/EEG van
    de Raad betreffende de bescherming van werknemers tegen de risico’s van blootstelling van asbest op het werk, de
    artikelen 24 en 39, derde lid, van de Wet milieugevaarlijke stoffen, de artikelen 16 en 33, tweede lid, van de
    Arbeidsomstandighedenwet 1998 en de artikelen 4, 8, 12, 13, 14 en 32b van de Warenwet;

    De Raad van State gehoord (advies van 6 september 2004, nr. W08.04.0331/V);

    Gezien het nader rapport van de Staatssecretaris van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer, de
    Staatssecretaris van Sociale Zaken en Werkgelegenheid en Onze Minister van Volksgezondheid, Welzijn en Sport van
    15 december 2004, nr. MJZ 2004118121, Directie Juridische Zaken, Afdeling Wetgeving, uitgebracht in overeenstemming
    met Onze Minister van Economische Zaken;

    Hebben goedgevonden en verstaan:
