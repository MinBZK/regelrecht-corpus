---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: varkensbesluit
regulatory_layer: AMVB
publication_date: '2014-06-19'
valid_from: '2005-08-01'
bwb_id: BWBR0006806
url: https://wetten.overheid.nl/BWBR0006806/2005-08-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Landbouw, Natuurbeheer en Visserij van 23 december 1993, No. J.
    9319898, Directie Juridische en Bedrijfsorganisatorische Zaken;

    Gelet op richtlijn 91/630/EEG van de Raad van de Europese Gemeenschappen van 19 november 1991 tot vaststelling
    van minimumnormen ter bescherming van varkens (Pb EG 1991, L 340) en op de artikelen 35, 38, 39, 45 en 111 van de
    Gezondheids- en welzijnswet voor dieren;

    Gezien de adviezen van de Raad voor Dierenaangelegenheden, het Landbouwschap, de Nederlandse Vereniging tot
    Bescherming van Dieren, het Produktschap Vee en Vlees en de Bond van Verenigingen voor Kunstmatige Inseminatie
    van Varkens;

    De Raad van State gehoord (advies van 20 mei 1994, No. W11.94.0003);

    Gezien het nader rapport van de Staatssecretaris van Landbouw, Natuurbeheer en Visserij van 30 juni 1994, No. J.
    949686, Directie Juridische en Bedrijfsorganisatorische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel1
  - number: 1.a
    text: |-
      wet: [Gezondheids- en welzijnswet voor dieren][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005662
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005662
  - number: 1.b
    text: 'varken: varken dat kennelijk wordt gehouden voor de fokkerij of voor de mesterij;'
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel1
  - number: 1.c
    text: 'beer: geslachtsrijp varken van het mannelijk geslacht dat kennelijk bestemd is voor de fokkerij;'
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel1
  - number: 1.d
    text: 'volwassen beer: beer van 18 maanden of ouder;'
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel1
  - number: 1.e
    text: |-
      gelt: geslachtsrijp varken van het vrouwelijk geslacht, kennelijk bestemd voor de fokkerij, dat nog niet heeft
      geworpen;
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel1
  - number: 1.f
    text: |-
      gebruiksvarken: varken met een leeftijd van ten minste tien weken tot aan het moment waarop het wordt geslacht dan
      wel een beer of gelt is geworden;
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel1
  - number: 1.g
    text: 'big: varken vanaf zijn geboorte tot aan het spenen;'
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel1
  - number: 1.h
    text: 'spenen: blijvend onttrekken van biggen aan een zogende zeug;'
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel1
  - number: 1.i
    text: 'zeug: varken van het vrouwelijk geslacht, kennelijk bestemd voor de fokkerij, na de worp van haar eerste biggen;'
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel1
  - number: 1.j
    text: 'zogende zeug: zeug tot aan het spenen van de biggen;'
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel1
  - number: 1.k
    text: 'gespeend varken: gespeend varken met een leeftijd tot 10 weken;'
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel1
  - number: 1.l
    text: 'stal: ruimte bestemd voor het houden van één of meer varkens;'
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel1
  - number: 1.m
    text: 'derde land: land waarop het Verdrag betreffende de Europese Unie niet van toepassing is.'
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel1
  - number: '2.1'
    text: |-
      Het houden van varkens geschiedt overeenkomstig de [artikelen 2a][ref1], [2aa][ref2], [2b][ref3] en
      [3 van dit besluit][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0006806#Artikel2a
      [ref2]: https://wetten.overheid.nl/BWBR0006806#Artikel2aa
      [ref3]: https://wetten.overheid.nl/BWBR0006806#Artikel2b
      [ref4]: https://wetten.overheid.nl/BWBR0006806#Artikel3
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006806
        artikel: 2a
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0006806
        artikel: 2aa
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0006806
        artikel: 2b
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0006806
        artikel: '3'
        paragraaf: '2'
  - number: '2.2'
    text: |-
      Het huisvesten van varkens geschiedt overeenkomstig de [artikelen 4 tot en met 11 van dit besluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006806#Artikel4
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006806
        artikel: '4'
        paragraaf: '2'
  - number: '2.3'
    text: |-
      Het verzorgen van varkens geschiedt overeenkomstig de [artikelen 12][ref1] en [13 van dit besluit][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006806#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0006806#Artikel13
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006806
        artikel: '12'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0006806
        artikel: '13'
        paragraaf: '3'
  - number: 2a.1
    text: Gespeende varkens, gebruiksvarkens, gelten en zeugen worden in afzonderlijke groepen gehouden.
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel2a
  - number: 2a.2
    text: Aan een eenmaal gevormde groep gespeende varkens of gebruiksvarkens worden geen varkens toegevoegd.
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel2a
  - number: 2a.3
    text: Een groep gespeende varkens wordt uiterlijk één week na het spenen gevormd.
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel2a
  - number: 2a.4
    text: Een groep gebruiksvarkens wordt gevormd uit varkens afkomstig uit één groep gespeende varkens.
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel2a
  - number: 2aa.1
    text: |-
      Er worden maatregelen getroffen om de agressie in groepen, bedoeld in [artikel 2a, eerste lid][ref1], zoveel
      mogelijk te beperken. Onder maatregelen wordt in ieder geval verstaan het verstrekken van stro of ander materiaal
      aan gespeende varkens en gebruiksvarkens.


      [ref1]: https://wetten.overheid.nl/BWBR0006806#Artikel2a
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel2aa
    references:
      - id: ref1
        bwb_id: BWBR0006806
        artikel: 2a
        paragraaf: '2'
  - number: 2aa.2
    text: Bij tekenen van ernstige gevechten vindt onmiddellijk onderzoek plaats naar de oorzaken hiervan.
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel2aa
  - number: 2b.1
    text: |-
      In afwijking van [artikel 2a, eerste lid][ref1], is het toegestaan:


      [ref1]: https://wetten.overheid.nl/BWBR0006806#Artikel2a
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel2b
    references:
      - id: ref1
        bwb_id: BWBR0006806
        artikel: 2a
        paragraaf: '2'
  - number: 2b.1.a
    text: een zeug ten behoeve van het zogen van de biggen, tezamen met de biggen, individueel te houden;
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel2b
  - number: 2b.1.b
    text: 'een gelt of zeug individueel te houden vanaf:'
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel2b
  - number: 2b.1.b.1°
    text: één week vóór het berekende tijdstip van werpen tot het tijdstip van werpen;
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel2b
  - number: 2b.1.b.2°
    text: vanaf het spenen tot en met vier dagen na de dag van natuurlijke dekking of kunstmatige inseminatie;
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel2b
  - number: 2b.1.c
    text: |-
      gespeende varkens, gebruiksvarkens, gelten of zeugen tijdelijk af te zonderen van de groep voor de tijdspanne die
      nodig is:
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel2b
  - number: 2b.1.c.1°
    text: voor het om gezondheidsredenen onderzoeken of behandelen van het varken;
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel2b
  - number: 2b.1.c.2°
    text: voor het drachtigheidsonderzoek of het collecteren van sperma;
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel2b
  - number: 2b.1.c.3°
    text: voor identificatie, wassen, ontsmetten of wegen van het varken;
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel2b
  - number: 2b.1.c.4°
    text: voor voeropname;
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel2b
  - number: 2b.1.c.5°
    text: om de stal te reinigen;
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel2b
  - number: 2b.1.d
    text: |-
      varkens tijdelijk af te zonderen van de groep indien de varkens buitengewoon agressief zijn, of ziek of gewond
      zijn, dan wel door andere varkens zijn aangevallen.
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel2b
  - number: 2b.2
    text: |-
      Bij een tijdelijke afzondering van de groep als bedoeld in het eerste lid, onderdeel d, beschikken de varkens over
      voldoende ruimte om zich te kunnen omdraaien, voor zover specifiek veterinair advies niet anders luidt.
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel2b
  - number: 2c.1
    text: |-
      Met het oog op de uitvoering van de [artikelen 2a][ref1] en [2b][ref2] wordt medewerking gevorderd van het bestuur
      van het Produktschap voor Vee en Vlees.


      [ref1]: https://wetten.overheid.nl/BWBR0006806#Artikel2a
      [ref2]: https://wetten.overheid.nl/BWBR0006806#Artikel2b
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel2c
    references:
      - id: ref1
        bwb_id: BWBR0006806
        artikel: 2a
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0006806
        artikel: 2b
        paragraaf: '2'
  - number: 2c.2
    text: |-
      De in het eerste lid bedoelde medewerking bestaat uit het verrichten van de noodzakelijke werkzaamheden en het bij
      verordening stellen van regels.
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel2c
  - number: 2c.3
    text: |-
      De krachtens de in het tweede lid bij verordening vastgestelde voorschriften en genomen besluiten behoeven de
      goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel2c
  - number: 2c.4
    text: |-
      Onze Minister kan met betrekking tot het verlenen van de in het eerste lid bedoelde medewerking beleidsregels
      stellen.
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel2c
  - number: 2c.5
    text: |-
      De in het tweede bedoelde regels kunnen onder meer betrekking hebben op de instelling van de plicht tot
      identificatie van varkens, de registratie daarvan, alsmede op de melding daarvan aan een daarbij aan te wijzen
      instantie.
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel2c
  - number: '3.1'
    text: Zeugen en gelten worden niet aangebonden gehouden.
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel3
  - number: '3.2'
    text: 'Varkensstallen zijn op zodanige wijze ingericht dat de varkens:'
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel3
  - number: 3.2.a
    text: |-
      toegang hebben tot een schone en comfortabele ruimte met een adequate waterafvoer, waar alle varkens tegelijk
      kunnen liggen;
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel3
  - number: 3.2.b
    text: kunnen rusten en ongehinderd kunnen opstaan;
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel3
  - number: 3.2.c
    text: andere varkens kunnen zien.
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel3
  - number: '3.3'
    text: |-
      Een stal bestemd voor een zeug of een gelt is zodanig ingericht dat achter de zeug of de gelt voldoende vrije
      ruimte beschikbaar is voor het natuurlijke of het begeleide werpen.
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel3
  - number: '3.4'
    text: |-
      Een stal bestemd voor een zogende zeug met biggen, waarin de zeug zich vrij kan bewegen en kan omdraaien, is
      voorzien van een bescherming voor de biggen. In een stal waarin een zogende zeug met biggen zich niet vrij kan
      bewegen of omdraaien, beschikken de biggen over voldoende ruimte om ongehinderd te kunnen worden gezoogd.
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel3
  - number: '4.1'
    text: |-
      De beschikbare oppervlakte van een stal bestemd voor gelten na dekking of zeugen zonder biggen, die in een groep
      worden gehouden, bedraagt tenminste per gelt of zeug 2,25 m2.
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel4
  - number: '4.2'
    text: |-
      De voor de varkens beschikbare oppervlakte van een stal bestemd voor gespeende varkens, gebruiksvarkens en niet in
      een groep gehouden gelten of zeugen bedraagt ten minste per varken met een gemiddeld gewicht:
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel4
  - number: 4.2.a
    text: 'tot 15 kg: 0,20 m2;'
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel4
  - number: 4.2.b
    text: 'van 15 tot 30 kg: 0,40 m2;'
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel4
  - number: 4.2.c
    text: 'van 30 tot 50 kg: 0,60 m2;'
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel4
  - number: 4.2.d
    text: 'van 50 tot 85 kg: 0,80 m2;'
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel4
  - number: 4.2.e
    text: 'van 85 tot 110 kg: 1 m2;'
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel4
  - number: 4.2.f
    text: 'van meer dan 110 kg: 1,3 m2.'
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel4
  - number: '4.3'
    text: |-
      De zijden van de stal waarin een groep zeugen en gelten wordt gehouden, zijn langer dan 2,8 meter. Indien minder
      dan zes gelten of zeugen in een groep worden gehouden, zijn de zijden van de stal waarin deze groep wordt gehouden
      langer dan 2,4 meter.
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel4
  - number: '4.4'
    text: De in het eerste lid bedoelde beschikbare oppervlakte
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel4
  - number: 4.4.a
    text: wordt per gelt of zeug met 10% vergroot indien deze dieren in groepen van minder dan zes varkens worden gehouden en
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel4
  - number: 4.4.b
    text: |-
      kan per gelt of zeug met 10% worden verkleind indien deze dieren in groepen van meer dan 40 varkens worden
      gehouden.
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel4
  - number: '4.5'
    text: |-
      De in het tweede lid bedoelde beschikbare oppervlakte kan per gespeend varken of gebruiksvarken met een gemiddeld
      gewicht van meer dan 15 kg, met 10% worden verkleind indien deze dieren in groepen van meer dan 40 varkens worden
      gehouden.
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel4
  - number: 4a.1
    text: |-
      Onverminderd [artikel 3, tweede lid][ref1], wordt een beer op zodanige wijze gehuisvest dat hij zich kan omdraaien
      en de andere varkens kan horen en ruiken.


      [ref1]: https://wetten.overheid.nl/BWBR0006806#Artikel3
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0006806
        artikel: '3'
        paragraaf: '2'
  - number: 4a.2
    text: 'De beschikbare oppervlakte in een stal bestemd voor een beer bedraagt ten minste:'
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel4a
  - number: 4a.2.a
    text: 'voor een beer jonger dan 12 maanden: 4 m²;'
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel4a
  - number: 4a.2.b
    text: 'voor een beer van 12 maanden of ouder en jonger dan 18 maanden: 5 m²;'
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel4a
  - number: 4a.2.c
    text: 'voor een beer van 18 maanden of ouder: 6 m²;'
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel4a
  - number: 4a.2.d
    text: 'ingeval de stal tevens voor het dekken wordt gebruikt: 10 m².'
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel4a
  - number: 4a.3
    text: |-
      De beschikbare oppervlakte in een stal als bedoeld in het tweede lid, onderdeel d, is voor een beer vrij
      beschikbaar.
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel4a
  - number: '5.1'
    text: |-
      De voor de varkens beschikbare vloer van een stal bestaat niet geheel uit roostervloer, tenzij de vloer is bestemd
      voor gespeende varkens of zogende zeugen met biggen en niet is vervaardigd van beton.
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel5
  - number: '5.2'
    text: |-
      Indien de vloer van de in [artikel 4, eerste lid][ref1], bedoelde stal gedeeltelijk uit roostervloer bestaat,
      bedraagt de oppervlakte van het dichte deel van de voor gelten of zeugen zonder biggen beschikbare vloer tenminste
      per gelt of zeug 1,3 m2.


      [ref1]: https://wetten.overheid.nl/BWBR0006806#Artikel4
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0006806
        artikel: '4'
        paragraaf: '2'
  - number: '5.3'
    text: |-
      Indien de vloer van de in [artikel 4, tweede lid][ref1], bedoelde stal gedeeltelijk uit roostervloer
      bestaat, bedraagt de oppervlakte van het dichte deel van de vloer per varken tenminste 40% van de ingevolge
      [artikel 4][ref2] voorgeschreven beschikbare oppervlakte per varken.


      [ref1]: https://wetten.overheid.nl/BWBR0006806#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0006806#Artikel4
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0006806
        artikel: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0006806
        artikel: '4'
        paragraaf: '2'
  - number: '5.4'
    text: |-
      Indien de vloer van de in [artikel 4, tweede lid][ref1], bedoelde stal gedeeltelijk uit roostervloer bestaat,
      bedraagt, in afwijking van het derde lid, vanaf een bij koninklijk besluit te bepalen tijdstip de oppervlakte van
      het dichte deel van de voor varkens beschikbare vloer tenminste per varken met een gemiddeld gewicht:


      [ref1]: https://wetten.overheid.nl/BWBR0006806#Artikel4
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0006806
        artikel: '4'
        paragraaf: '2'
  - number: 5.4.a
    text: 'tot 30 kg: 0,24 m2;'
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel5
  - number: 5.4.b
    text: 'van 30 tot 50 kg: 0,35 m2;'
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel5
  - number: 5.4.c
    text: 'van 50 tot 85 kg: 0,45 m2;'
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel5
  - number: 5.4.d
    text: 'van 85 tot en met 110 kg: 0,60 m2;'
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel5
  - number: 5.4.e
    text: 'van meer dan 110 kg: 0,75 m2.'
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel5
  - number: '5.5'
    text: |-
      Indien de vloer van de in [artikel 4a][ref1], bedoelde stal gedeeltelijk uit roostervloer bestaat, bedraagt de
      oppervlakte van het dichte deel van de vloer tenminste twee derden van de totale vloeroppervlakte.


      [ref1]: https://wetten.overheid.nl/BWBR0006806#Artikel4a
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0006806
        artikel: 4a
        paragraaf: '2'
  - number: '5.6'
    text: |-
      In een stal, bestemd voor één of meer zogende zeugen met biggen, beschikken de biggen over een dichte vloer of een
      vloer bedekt met een rubber mat waarvan de oppervlakte ten minste 0,6 m2 per toom biggen bedraagt.
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel5
  - number: '5.7'
    text: |-
      De vloeren van de stal zijn op zodanige wijze ontworpen, gebouwd en onderhouden dat bij de varkens geen letsel of
      pijn wordt veroorzaakt.
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel5
  - number: '6'
    text: 'Een vloer of een gedeelte daarvan, voorzien van gierdoorlatende openingen, wordt als dicht beschouwd indien:'
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel6
  - number: 6.a
    text: |-
      het totaal aan gierdoorlatende openingen niet meer bedraagt dan 5% van de totale oppervlakte van het dichte deel
      van de vloer, en
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel6
  - number: 6.b
    text: |-
      de breedte van gierdoorlatende spleten ten hoogste 10 mm en de doorsnede van ronde gierdoorlatende openingen ten
      hoogste 20 mm bedraagt.
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel6
  - number: '7'
    text: |-
      Onverminderd [artikel 3, tweede lid][ref1], heeft in een stal waarin gelten of zeugen zonder biggen in voerligboxen
      worden gehouden elk varken de beschikking over een vrije ruimte met een lengte van ten minste 2 meter.


      [ref1]: https://wetten.overheid.nl/BWBR0006806#Artikel3
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0006806
        artikel: '3'
        paragraaf: '2'
  - number: '8.1'
    text: |-
      Onverminderd [artikel 5, zevende lid][ref1], is de spleetbreedte tussen de roosterbalken van een roostervloer over
      de gehele oppervlakte van de roostervloer gelijk en bedraagt deze bij stallen bestemd voor:


      [ref1]: https://wetten.overheid.nl/BWBR0006806#Artikel5
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0006806
        artikel: '5'
        paragraaf: '2'
  - number: 8.1.a
    text: 'zeugen zonder biggen en gelten na dekking: ten hoogste 20 mm;'
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel8
  - number: 8.1.b
    text: 'zogende zeugen met biggen: ten hoogste 10 mm bij betonroostervloeren en 12 mm bij andere roostervloeren;'
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel8
  - number: 8.1.c
    text: 'gespeende varkens: ten hoogste 14 mm bij betonroostervloeren en 15 mm bij andere roostervloeren;'
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel8
  - number: 8.1.d
    text: 'gebruiksvarkens: ten hoogste 18 mm bij betonroostervloeren en 20 mm bij andere roostervloeren.'
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel8
  - number: '8.2'
    text: 'De balkbreedte van de roosterbalken van een betonroostervloer bedraagt bij een stal bestemd voor:'
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel8
  - number: 8.2.a
    text: 'biggen en gespeende varkens: ten minste 50 mm'
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel8
  - number: 8.2.b
    text: 'gebruiksvarkens, gelten na dekking en zeugen: ten minste 80 mm.'
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel8
  - number: '9.1'
    text: |-
      Het dichte deel van de vloer van een stal bestemd voor een beer of een zogende zeug met biggen is voorzien van
      strooisel bestaande uit stro, hooi, houtkrullen, zaagsel, compost, turf of een mengsel daarvan, dan wel, ingeval
      van een zogende zeug met biggen, bedekt met een rubber mat.
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel9
  - number: '9.2'
    text: |-
      Varkens beschikken permanent over voldoende materiaal om te onderzoeken en mee te spelen. Het materiaal is niet
      schadelijk voor de gezondheid van de varkens.
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel9
  - number: '9.3'
    text: |-
      Onverminderd het tweede lid, beschikken zeugen en gelten in de laatste week voor het werpen over voldoende
      los materiaal dat voldoet als adequaat nestmateriaal, tenzij dit in verband met de op het bedrijf gebruikte
      mengmestmethode technisch niet uitvoerbaar is.
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel9
  - number: '10.1'
    text: |-
      De lichtintensiteit in een stal bestemd voor varkens bedraagt verticaal op dierhoogte gemeten ten minste 40 lux
      gedurende ten minste 8 uur per dag.
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel10
  - number: '10.2'
    text: |-
      In een stal bestemd voor varkens wordt een continue geluidsniveau van 85 dBA of hoger alsmede constant of
      plotseling lawaai vermeden.
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel10
  - number: '11.1'
    text: |-
      Het voedersysteem in groepshuisvesting waarborgt dat alle varkens voldoende voedsel tot zich kunnen nemen, zelfs in
      aanwezigheid van concurrenten.
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel11
  - number: '11.2'
    text: |-
      Indien varkens in een groep worden gehouden en niet ad libitum of via een automatisch individueel voedersysteem
      worden gevoederd, is de lengte van de rechte trog zodanig dat alle varkens tegelijkertijd kunnen eten. De lengte
      van de rechte trog bedraagt ten minste 0,30 m per geslachtsrijp varken.
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel11
  - number: '12'
    text: |-
      Drachtige zeugen en gelten worden zo nodig tegen uitwendige en inwendige parasieten behandeld en worden voordat zij
      in het kraamhok worden gebracht grondig schoongemaakt.
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel12
  - number: '13.1'
    text: Alle varkens worden ten minste eenmaal per dag gevoederd.
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel13
  - number: '13.2'
    text: Varkens ouder dan twee weken beschikken permanent over voldoende vers water.
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel13
  - number: '13.3'
    text: |-
      Aan guste en drachtige zeugen en gelten wordt een toereikende hoeveelheid bulk- of vezelrijk en energierijk voer
      verstrekt om hun honger te verminderen en in de behoefte tot kauwen te voorzien.
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel13
  - number: '15'
    text: |-
      Onverminderd het bepaalde bij of krachtens de [Wet uitoefening diergeneeskunde][ref1] is het castreren van
      mannelijke varkens, die ouder zijn dan zeven dagen, uitsluitend toegestaan als deze ingreep onder anesthesie en met
      aanvullende langdurige analgesie wordt uitgevoerd door een dierenarts.


      [ref1]: https://wetten.overheid.nl/BWBR0004730
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0004730
  - number: '16.1'
    text: Het spenen van biggen geschiedt niet voordat de biggen 28 dagen oud zijn.
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel16
  - number: '16.2'
    text: |-
      In afwijking van het eerste lid kunnen de biggen eerder worden gespeend, indien het welzijn of de gezondheid van de
      zeug of van de biggen in het gedrang komen.
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel16
  - number: '16.3'
    text: |-
      In afwijking van het eerste lid kunnen de biggen ten hoogste zeven dagen eerder worden gespeend, indien de biggen
      naar gespecialiseerde voorzieningen worden gebracht die a. volledig worden leeggemaakt en grondig worden gereinigd
      en ontsmet vóórdat een nieuwe groep biggen wordt binnengebracht, en b. gescheiden zijn van de voorzieningen waar
      zeugen worden gehouden om het overdragen van ziekten op de biggen zo veel mogelijk te beperken.
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel16
  - number: '17'
    text: |-
      Onverminderd het overigens ten aanzien van de invoer bepaalde geschiedt de invoer van varkens die vanuit een
      derde land via Nederland voor het eerst op het grondgebied van de Europese Gemeenschappen worden gebracht, slechts
      indien de varkens vergezeld gaan van een geldig, door de bevoegde autoriteit van dat derde land afgegeven, volledig
      ingevuld en gedagtekend certificaat als bedoeld in artikel 8 van [richtlijn 91/630/EEG](31991L0630).
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel17
  - number: '19.1'
    text: |-
      [Artikel 2a, eerste lid][ref1], voorzover van toepassing op gelten en zeugen, is tot 1 januari 2013 niet van
      toepassing indien de gebruiker van de stal kan aantonen dat:


      [ref1]: https://wetten.overheid.nl/BWBR0006806#Artikel2a
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0006806
        artikel: 2a
        paragraaf: '2'
  - number: 19.1.a
    text: de stal voor 1 november 1998 in gebruik is genomen, en
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel19
  - number: 19.1.b
    text: de stal of de vloer van de stal na 1 november 1998 niet is verbouwd of herbouwd.
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel19
  - number: '19.2'
    text: |-
      De [artikelen 4, eerste en tweede lid][ref1], en [5, tweede lid][ref2], zijn tot 1 januari 2013 niet van toepassing
      indien de gebruiker van de stal kan aantonen dat:


      [ref1]: https://wetten.overheid.nl/BWBR0006806#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0006806#Artikel5
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0006806
        artikel: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0006806
        artikel: '5'
        paragraaf: '2'
  - number: 19.2.a
    text: de stal vóór 1 november 1998 in gebruik is genomen;
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel19
  - number: 19.2.b
    text: |-
      de stal vanaf 1 november 1998 voldoet aan de [artikelen 4, eerste lid][ref1], en
      [5, tweede lid, van het Varkensbesluit][ref2] zoals dat luidde vóór 1 september 1998, en


      [ref1]: https://wetten.overheid.nl/BWBR0006806#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0006806#Artikel5
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0006806
        artikel: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0006806
        artikel: '5'
        paragraaf: '2'
  - number: 19.2.c
    text: de stal of de vloer van de stal na 1 november 1998 niet is verbouwd of herbouwd.
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel19
  - number: '19.3'
    text: |-
      De [artikelen 2b, tweede lid][ref1], [4, derde lid en vierde lid, onderdeel a][ref2],
      [8, eerste lid, onderdelen c en d][ref3], voor zover van toepassing op betonroostervloeren, en
      [8, tweede lid][ref4], zijn tot 1 januari 2013 niet van toepassing indien de gebruiker van de stal kan aantonen
      dat:


      [ref1]: https://wetten.overheid.nl/BWBR0006806#Artikel2b
      [ref2]: https://wetten.overheid.nl/BWBR0006806#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0006806#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0006806#Artikel8
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0006806
        artikel: 2b
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0006806
        artikel: '4'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0006806
        artikel: '8'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0006806
        artikel: '8'
        paragraaf: '2'
  - number: 19.3.a
    text: |-
      de stal voor de inwerkingtreding van het Besluit van 28 april 2003, houdende wijziging van het Varkensbesluit
      (implementatie [richtlijnen nr. 2001/88/EG](32001L0088) en [nr. 2001/93/EG](32001L0093)) in gebruik is genomen;
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel19
  - number: 19.3.b
    text: |-
      de stal vanaf 1 januari 2003 voldoet aan [artikel 8, eerste lid, onderdeel c en d, van het Varkensbesluit][ref1]
      zoals dat luidde voor de inwerkingtreding van het besluit, bedoeld in onderdeel a, en


      [ref1]: https://wetten.overheid.nl/BWBR0006806#Artikel8
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0006806
        artikel: '8'
        paragraaf: '2'
  - number: 19.3.c
    text: |-
      de stal of de vloer van de stal na de inwerkingtreding van het besluit, bedoeld in onderdeel a, niet is verbouwd
      of herbouwd.
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel19
  - number: '19.4'
    text: |-
      [Artikel 4a, tweede lid, onderdeel d en derde lid][ref1] is tot 1 januari 2005 niet van toepassing indien de
      gebruiker van de stal kan aantonen dat:


      [ref1]: https://wetten.overheid.nl/BWBR0006806#Artikel4a
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0006806
        artikel: 4a
        paragraaf: '2'
  - number: 19.4.a
    text: |-
      de stal voor de inwerkingtreding van het besluit, bedoeld in het vierde lid, onderdeel a, onder 1°, in gebruik
      is genomen;
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel19
  - number: 19.4.b
    text: |-
      de stal voldoet aan [artikel 4a, onderdeel c, van het Varkensbesluit][ref1] zoals dat luidde voor de
      inwerkingtreding van het besluit, bedoeld in onderdeel a, en


      [ref1]: https://wetten.overheid.nl/BWBR0006806#Artikel4a
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0006806
        artikel: 4a
        paragraaf: '2'
  - number: 19.4.c
    text: |-
      de stal of de vloer van de stal na de inwerkingtreding van het besluit, bedoeld in onderdeel a, niet is verbouwd
      of herbouwd.
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel19
  - number: '19.5'
    text: |-
      [Artikel 5, vierde lid][ref1], is gedurende 10 jaar na het in dat lid bedoelde tijdstip niet van toepassing indien
      de gebruiker van de stal kan aantonen dat:


      [ref1]: https://wetten.overheid.nl/BWBR0006806#Artikel5
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0006806
        artikel: '5'
        paragraaf: '2'
  - number: 19.5.a
    text: |-
      de stal vóór het in [artikel 5, vierde lid][ref1], bedoelde tijdstip in gebruik is genomen, en


      [ref1]: https://wetten.overheid.nl/BWBR0006806#Artikel5
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0006806
        artikel: '5'
        paragraaf: '2'
  - number: 19.5.b
    text: |-
      de stal of de vloer van de stal na het in [artikel 5, vierde lid][ref1], bedoelde tijdstip niet is verbouwd of
      herbouwd.


      [ref1]: https://wetten.overheid.nl/BWBR0006806#Artikel5
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0006806
        artikel: '5'
        paragraaf: '2'
  - number: '20'
    text: Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel20
  - number: '21'
    text: 'Dit besluit kan worden aangehaald als: Varkensbesluit.'
    url: https://wetten.overheid.nl/BWBR0006806/2005-08-01#Artikel21
