  - number: 19a
    text: |-
      Met ingang van 1 januari 2000 is [artikel 19][ref1] vanaf het tijdstip waarop
      registratie van de kennisgeving van overgang van een varkensrecht als bedoeld in
      [artikel 1, onderdeel h, van de Wet herstructurering varkenshouderij][ref2], of een gedeelte daarvan,
      overeenkomstig de [artikelen 18][ref3] en [19][ref4], onderscheidenlijk [20, van die wet][ref5] heeft
      plaatsgevonden, niet van toepassing op een stal als bedoeld in [artikel 19][ref6]:


