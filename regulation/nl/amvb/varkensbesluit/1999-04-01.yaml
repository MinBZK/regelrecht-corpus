---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: varkensbesluit
regulatory_layer: AMVB
publication_date: '2014-06-19'
valid_from: '1999-04-01'
bwb_id: BWBR0006806
url: https://wetten.overheid.nl/BWBR0006806/1999-04-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Landbouw, Natuurbeheer en Visserij van 23 december 1993, No. J.
    9319898, Directie Juridische en Bedrijfsorganisatorische Zaken;

    Gelet op richtlijn 91/630/EEG van de Raad van de Europese Gemeenschappen van 19 november 1991 tot vaststelling
    van minimumnormen ter bescherming van varkens (Pb EG 1991, L 340) en op de artikelen 35, 38, 39, 45 en 111 van de
    Gezondheids- en welzijnswet voor dieren;

    Gezien de adviezen van de Raad voor Dierenaangelegenheden, het Landbouwschap, de Nederlandse Vereniging tot
    Bescherming van Dieren, het Produktschap Vee en Vlees en de Bond van Verenigingen voor Kunstmatige Inseminatie
    van Varkens;

    De Raad van State gehoord (advies van 20 mei 1994, No. W11.94.0003);

    Gezien het nader rapport van de Staatssecretaris van Landbouw, Natuurbeheer en Visserij van 30 juni 1994, No. J.
    949686, Directie Juridische en Bedrijfsorganisatorische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0006806/1999-04-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0006806/1999-04-01#Artikel1
  - number: 1.a
    text: |-
      wet: [Gezondheids- en welzijnswet voor dieren][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005662
    url: https://wetten.overheid.nl/BWBR0006806/1999-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005662
  - number: 1.b
    text: 'varken: varken dat kennelijk wordt gehouden voor de fokkerij of voor de mesterij;'
    url: https://wetten.overheid.nl/BWBR0006806/1999-04-01#Artikel1
  - number: 1.c
    text: 'beer: geslachtsrijp varken van het mannelijk geslacht dat kennelijk bestemd is voor de fokkerij;'
    url: https://wetten.overheid.nl/BWBR0006806/1999-04-01#Artikel1
  - number: 1.d
    text: 'volwassen beer: beer van 18 maanden of ouder;'
    url: https://wetten.overheid.nl/BWBR0006806/1999-04-01#Artikel1
  - number: 1.e
    text: |-
      gelt: geslachtsrijp varken van het vrouwelijk geslacht, kennelijk bestemd voor de fokkerij, dat nog niet heeft
      geworpen;
    url: https://wetten.overheid.nl/BWBR0006806/1999-04-01#Artikel1
  - number: 1.f
    text: |-
      gebruiksvarken: varken met een leeftijd van ten minste tien weken tot aan het moment waarop het wordt geslacht dan
      wel een beer of gelt is geworden;
    url: https://wetten.overheid.nl/BWBR0006806/1999-04-01#Artikel1
  - number: 1.g
    text: 'big: varken vanaf zijn geboorte tot aan het spenen;'
    url: https://wetten.overheid.nl/BWBR0006806/1999-04-01#Artikel1
  - number: 1.h
    text: 'spenen: blijvend onttrekken van biggen aan een zogende zeug;'
    url: https://wetten.overheid.nl/BWBR0006806/1999-04-01#Artikel1
  - number: 1.i
    text: 'zeug: varken van het vrouwelijk geslacht, kennelijk bestemd voor de fokkerij, na de worp van haar eerste biggen;'
    url: https://wetten.overheid.nl/BWBR0006806/1999-04-01#Artikel1
  - number: 1.j
    text: 'zogende zeug: zeug tot aan het spenen van de biggen;'
    url: https://wetten.overheid.nl/BWBR0006806/1999-04-01#Artikel1
  - number: 1.k
    text: 'gespeend varken: gespeend varken met een leeftijd tot 10 weken;'
    url: https://wetten.overheid.nl/BWBR0006806/1999-04-01#Artikel1
  - number: 1.l
    text: 'stal: ruimte bestemd voor het houden van één of meer varkens;'
    url: https://wetten.overheid.nl/BWBR0006806/1999-04-01#Artikel1
  - number: 1.m
    text: |-
      [richtlijn 91/630/EEG](31991L0630): [richtlijn nr. 91/630/EEG](31991L0630) van de Raad van de Europese
      Gemeenschappen van 19 november 1991 tot vaststelling van minimumnormen ter bescherming van varkens (*Pb EG* L 340);
    url: https://wetten.overheid.nl/BWBR0006806/1999-04-01#Artikel1
  - number: 1.n
    text: 'bijlage: bijlage bij [richtlijn 91/630/EEG](31991L0630);'
    url: https://wetten.overheid.nl/BWBR0006806/1999-04-01#Artikel1
  - number: 1.o
    text: 'derde land: land waarop het Verdrag betreffende de Europese Unie niet van toepassing is.'
    url: https://wetten.overheid.nl/BWBR0006806/1999-04-01#Artikel1
  - number: '2.1'
    text: |-
      Het houden van varkens geschiedt overeenkomstig de [artikelen 2a][ref1], 2b, eerste lid, en 3 van dit besluit en
      hoofdstuk II, onder IV, van de bijlage.


      [ref1]: https://wetten.overheid.nl/BWBR0006806#Artikel2a
    url: https://wetten.overheid.nl/BWBR0006806/1999-04-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006806
        artikel: 2a
        paragraaf: '2'
  - number: '2.2'
    text: |-
      Het huisvesten van varkens geschiedt overeenkomstig de [artikelen 4 tot en met 11][ref1] van dit besluit en
      hoofdstuk I, de punten 1 tot en met 3, 4, derde zin, 5, 6, derde zin, 8, 9, tweede en laatste zin, 11, 13, laatste
      zin, 14 en 15 voor zover betreffend het ontwerpen, bouwen en plaatsen van voeder- en drinkinstallaties, hoofdstuk
      II, onder I, onder II, de punten 2 tot en met 4, en onder III, de punten 1 en 2, van de bijlage.


      [ref1]: https://wetten.overheid.nl/BWBR0006806#Artikel4
    url: https://wetten.overheid.nl/BWBR0006806/1999-04-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006806
        artikel: '4'
        paragraaf: '2'
  - number: 2a.1
    text: Gespeende varkens, gebruiksvarkens, gelten en zeugen worden in afzonderlijke groepen gehouden.
    url: https://wetten.overheid.nl/BWBR0006806/1999-04-01#Artikel2a
  - number: 2a.2
    text: |-
      In zoverre in afwijking van het in hoofdstuk II, onder IV, laatste zin, van de bijlage bepaalde, worden aan een
      eenmaal gevormde groep gespeende varkens of gebruiksvarkens geen varkens toegevoegd.
    url: https://wetten.overheid.nl/BWBR0006806/1999-04-01#Artikel2a
  - number: 2a.3
    text: Een groep gespeende varkens wordt uiterlijk één week na het spenen gevormd.
    url: https://wetten.overheid.nl/BWBR0006806/1999-04-01#Artikel2a
  - number: 2a.4
    text: Een groep gebruiksvarkens wordt gevormd uit varkens afkomstig uit één groep gespeende varkens.
    url: https://wetten.overheid.nl/BWBR0006806/1999-04-01#Artikel2a
  - number: 2b.1
    text: |-
      In afwijking van [artikel 2a, eerste lid][ref1], is het toegestaan een zeug ten behoeve van het zogen van de
      biggen, tezamen met de biggen, individueel te houden.


      [ref1]: https://wetten.overheid.nl/BWBR0006806#Artikel2a
    url: https://wetten.overheid.nl/BWBR0006806/1999-04-01#Artikel2b
    references:
      - id: ref1
        bwb_id: BWBR0006806
        artikel: 2a
        paragraaf: '2'
  - number: 2b.2
    text: |-
      Voorts is het in afwijking van [artikel 2a, eerste lid][ref1], toegestaan een gelt of zeug individueel te houden:


      [ref1]: https://wetten.overheid.nl/BWBR0006806#Artikel2a
    url: https://wetten.overheid.nl/BWBR0006806/1999-04-01#Artikel2b
    references:
      - id: ref1
        bwb_id: BWBR0006806
        artikel: 2a
        paragraaf: '2'
  - number: 2b.2.a
    text: vanaf één week vóór het berekende tijdstip van werpen tot het tijdstip van werpen, en
    url: https://wetten.overheid.nl/BWBR0006806/1999-04-01#Artikel2b
  - number: 2b.2.b
    text: |-
      vanaf twee dagen voorafgaand aan de dag van natuurlijke dekking of kunstmatige inseminatie tot en met vier dagen na
      de dag van natuurlijke dekking of kunstmatige inseminatie.
    url: https://wetten.overheid.nl/BWBR0006806/1999-04-01#Artikel2b
  - number: 2b.3
    text: |-
      Onverminderd het overigens in punt 7, tweede zin, van hoofdstuk I van de bijlage bepaalde, is het toegestaan
      gespeende varkens, gebruiksvarkens, gelten of zeugen tijdelijk af te zonderen van de groep voor de tijdspanne die
      nodig is:
    url: https://wetten.overheid.nl/BWBR0006806/1999-04-01#Artikel2b
  - number: 2b.3.a
    text: voor het om gezondheidsredenen onderzoeken of behandelen van het varken;
    url: https://wetten.overheid.nl/BWBR0006806/1999-04-01#Artikel2b
  - number: 2b.3.b
    text: ten behoeve van drachtigheidsonderzoek of het collecteren van sperma;
    url: https://wetten.overheid.nl/BWBR0006806/1999-04-01#Artikel2b
  - number: 2b.3.c
    text: voor identificatie, wassen, ontsmetten of wegen van het varken;
    url: https://wetten.overheid.nl/BWBR0006806/1999-04-01#Artikel2b
  - number: 2b.3.d
    text: voor voeropname, of
    url: https://wetten.overheid.nl/BWBR0006806/1999-04-01#Artikel2b
  - number: 2b.3.e
    text: om de stal te reinigen.
    url: https://wetten.overheid.nl/BWBR0006806/1999-04-01#Artikel2b
  - number: 2c.1
    text: |-
      Met het oog op de uitvoering van de [artikelen 2a][ref1] en [2b][ref2] wordt medewerking gevorderd van het bestuur
      van het Produktschap voor Vee en Vlees.


      [ref1]: https://wetten.overheid.nl/BWBR0006806#Artikel2a
      [ref2]: https://wetten.overheid.nl/BWBR0006806#Artikel2b
    url: https://wetten.overheid.nl/BWBR0006806/1999-04-01#Artikel2c
    references:
      - id: ref1
        bwb_id: BWBR0006806
        artikel: 2a
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0006806
        artikel: 2b
        paragraaf: '2'
  - number: 2c.2
    text: |-
      De in het eerste lid bedoelde medewerking bestaat uit het verrichten van de noodzakelijke werkzaamheden en het bij
      verordening stellen van regels.
    url: https://wetten.overheid.nl/BWBR0006806/1999-04-01#Artikel2c
  - number: 2c.3
    text: |-
      De krachtens de in het tweede lid bij verordening vastgestelde voorschriften en genomen besluiten behoeven de
      goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0006806/1999-04-01#Artikel2c
  - number: 2c.4
    text: |-
      Onze Minister kan met betrekking tot het verlenen van de in het eerste lid bedoelde medewerking beleidsregels
      stellen.
    url: https://wetten.overheid.nl/BWBR0006806/1999-04-01#Artikel2c
  - number: 2c.5
    text: |-
      De in het tweede bedoelde regels kunnen onder meer betrekking hebben op de instelling van de plicht tot
      identificatie van varkens, de registratie daarvan, alsmede op de melding daarvan aan een daarbij aan te wijzen
      instantie.
    url: https://wetten.overheid.nl/BWBR0006806/1999-04-01#Artikel2c
  - number: '3'
    text: Met ingang van 1 januari 1996 worden zeugen en gelten niet aangebonden gehouden.
    url: https://wetten.overheid.nl/BWBR0006806/1999-04-01#Artikel3
  - number: '4.1'
    text: |-
      De beschikbare oppervlakte van een stal bedraagt voor gelten of zeugen zonder biggen, die in een groep worden
      gehouden, tenminste per gelt of zeug 2,25 m2.
    url: https://wetten.overheid.nl/BWBR0006806/1999-04-01#Artikel4
  - number: '4.2'
    text: |-
      De voor de varkens beschikbare oppervlakte van een stal bestemd voor gespeende varkens, gebruiksvarkens en niet in
      een groep gehouden gelten of zeugen bedraagt tenminste per varken met een gemiddeld gewicht:
    url: https://wetten.overheid.nl/BWBR0006806/1999-04-01#Artikel4
  - number: 4.2.a
    text: 'tot 30 kg: 0,4 m2;'
    url: https://wetten.overheid.nl/BWBR0006806/1999-04-01#Artikel4
  - number: 4.2.b
    text: 'van 30 tot 50 kg: 0,6 m2;'
    url: https://wetten.overheid.nl/BWBR0006806/1999-04-01#Artikel4
  - number: 4.2.c
    text: 'van 50 tot 85 kg: 0,8 m2;'
    url: https://wetten.overheid.nl/BWBR0006806/1999-04-01#Artikel4
  - number: 4.2.d
    text: 'van 85 tot en met 110 kg: 1,0 m2;'
    url: https://wetten.overheid.nl/BWBR0006806/1999-04-01#Artikel4
  - number: 4.2.e
    text: 'van meer dan 110 kg: 1,3 m2.'
    url: https://wetten.overheid.nl/BWBR0006806/1999-04-01#Artikel4
  - number: 4a
    text: |-
      Onverminderd het in hoofdstuk II, onder I, van de bijlage bepaalde, bedraagt in een stal bestemd voor een beer, de
      voor de beer beschikbare oppervlakte tenminste:
    url: https://wetten.overheid.nl/BWBR0006806/1999-04-01#Artikel4a
  - number: 4a.a
    text: 'voor een beer jonger dan 12 maanden: 4 m2;'
    url: https://wetten.overheid.nl/BWBR0006806/1999-04-01#Artikel4a
  - number: 4a.b
    text: 'voor een beer van 12 maanden of ouder en jonger dan 18 maanden: 5 m2;'
    url: https://wetten.overheid.nl/BWBR0006806/1999-04-01#Artikel4a
  - number: 4a.c
    text: 'ingeval de stal tevens voor het dekken wordt gebruikt: 7 m2.'
    url: https://wetten.overheid.nl/BWBR0006806/1999-04-01#Artikel4a
  - number: '5.1'
    text: |-
      Onverminderd punt 11 van hoofdstuk I van de bijlage bestaat de voor de varkens beschikbare vloer van een stal niet
      geheel uit roostervloer, tenzij de vloer bestemd is voor gespeende varkens of zogende zeugen met biggen en niet is
      vervaardigd van beton.
    url: https://wetten.overheid.nl/BWBR0006806/1999-04-01#Artikel5
  - number: '5.2'
    text: |-
      Indien de vloer van de in [artikel 4, eerste lid][ref1], bedoelde stal gedeeltelijk uit roostervloer bestaat,
      bedraagt de oppervlakte van het dichte deel van de voor gelten of zeugen zonder biggen beschikbare vloer tenminste
      per gelt of zeug 1,3 m2.


      [ref1]: https://wetten.overheid.nl/BWBR0006806#Artikel4
    url: https://wetten.overheid.nl/BWBR0006806/1999-04-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0006806
        artikel: '4'
        paragraaf: '2'
  - number: '5.3'
    text: |-
      Indien de vloer van de in [artikel 4, tweede lid][ref1], bedoelde stal gedeeltelijk uit roostervloer bestaat,
      bedraagt de oppervlakte van het dichte deel van de voor varkens beschikbare vloer tenminste per varken met een
      gemiddeld gewicht:


      [ref1]: https://wetten.overheid.nl/BWBR0006806#Artikel4
    url: https://wetten.overheid.nl/BWBR0006806/1999-04-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0006806
        artikel: '4'
        paragraaf: '2'
  - number: 5.3.a
    text: 'tot 30 kg: 0,12 m2;'
    url: https://wetten.overheid.nl/BWBR0006806/1999-04-01#Artikel5
  - number: 5.3.b
    text: 'van 30 tot 50 kg: 0,20 m2;'
    url: https://wetten.overheid.nl/BWBR0006806/1999-04-01#Artikel5
  - number: 5.3.c
    text: 'van 50 tot 85 kg: 0,25 m2;'
    url: https://wetten.overheid.nl/BWBR0006806/1999-04-01#Artikel5
  - number: 5.3.d
    text: 'van 85 tot en met 110 kg: 0,30 m2;'
    url: https://wetten.overheid.nl/BWBR0006806/1999-04-01#Artikel5
  - number: 5.3.e
    text: 'van meer dan 110 kg: 0,40 m2.'
    url: https://wetten.overheid.nl/BWBR0006806/1999-04-01#Artikel5
  - number: '5.4'
    text: |-
      Indien de vloer van de in [artikel 4, tweede lid][ref1], bedoelde stal gedeeltelijk uit roostervloer bestaat,
      bedraagt, in afwijking van het derde lid, vanaf een bij koninklijk besluit te bepalen tijdstip de oppervlakte van
      het dichte deel van de voor varkens beschikbare vloer tenminste per varken met een gemiddeld gewicht:


      [ref1]: https://wetten.overheid.nl/BWBR0006806#Artikel4
    url: https://wetten.overheid.nl/BWBR0006806/1999-04-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0006806
        artikel: '4'
        paragraaf: '2'
  - number: 5.4.a
    text: 'tot 30 kg: 0,24 m2;'
    url: https://wetten.overheid.nl/BWBR0006806/1999-04-01#Artikel5
  - number: 5.4.b
    text: 'van 30 tot 50 kg: 0,35 m2;'
    url: https://wetten.overheid.nl/BWBR0006806/1999-04-01#Artikel5
  - number: 5.4.c
    text: 'van 50 tot 85 kg: 0,45 m2;'
    url: https://wetten.overheid.nl/BWBR0006806/1999-04-01#Artikel5
  - number: 5.4.d
    text: 'van 85 tot en met 110 kg: 0,60 m2;'
    url: https://wetten.overheid.nl/BWBR0006806/1999-04-01#Artikel5
  - number: 5.4.e
    text: 'van meer dan 110 kg: 0,75 m2.'
    url: https://wetten.overheid.nl/BWBR0006806/1999-04-01#Artikel5
  - number: '5.5'
    text: |-
      Indien de vloer van de in [artikel 4a][ref1], bedoelde stal gedeeltelijk uit roostervloer bestaat, bedraagt de
      oppervlakte van het dichte deel van de vloer tenminste twee derden van de totale vloeroppervlakte.


      [ref1]: https://wetten.overheid.nl/BWBR0006806#Artikel4a
    url: https://wetten.overheid.nl/BWBR0006806/1999-04-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0006806
        artikel: 4a
        paragraaf: '2'
  - number: '5.6'
    text: |-
      In een stal, bestemd voor één of meer zogende zeugen met biggen, beschikken de biggen over een dichte vloer of een
      vloer bedekt met een rubber mat waarvan de oppervlakte ten minste 0,6 m2 per toom biggen bedraagt.
    url: https://wetten.overheid.nl/BWBR0006806/1999-04-01#Artikel5
  - number: '6'
    text: 'Een vloer of een gedeelte daarvan, voorzien van gierdoorlatende openingen, wordt als dicht beschouwd indien:'
    url: https://wetten.overheid.nl/BWBR0006806/1999-04-01#Artikel6
  - number: 6.a
    text: |-
      het totaal aan gierdoorlatende openingen niet meer bedraagt dan 5% van de totale oppervlakte van het dichte deel
      van de vloer, en
    url: https://wetten.overheid.nl/BWBR0006806/1999-04-01#Artikel6
  - number: 6.b
    text: |-
      de breedte van gierdoorlatende spleten ten hoogste 10 mm en de doorsnede van ronde gierdoorlatende openingen ten
      hoogste 20 mm bedraagt.
    url: https://wetten.overheid.nl/BWBR0006806/1999-04-01#Artikel6
  - number: '7'
    text: |-
      Onverminderd [artikel 3][ref1] en punt 8 van hoofdstuk I van de bijlage heeft in een stal waarin gelten of zeugen
      zonder biggen aangebonden of in voerligboxen worden gehouden elk varken de beschikking over een vrije ruimte met
      een lengte van tenminste 2 meter.


      [ref1]: https://wetten.overheid.nl/BWBR0006806#Artikel3
    url: https://wetten.overheid.nl/BWBR0006806/1999-04-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0006806
        artikel: '3'
        paragraaf: '2'
  - number: '8.1'
    text: |-
      Onverminderd punt 11 van hoofdstuk I van de bijlage is de spleetbreedte tussen de roosterbalken van een
      roostervloer over de gehele oppervlakte van de roostervloer gelijk en bedraagt deze bij stallen bestemd voor:
    url: https://wetten.overheid.nl/BWBR0006806/1999-04-01#Artikel8
  - number: 8.1.a
    text: 'zeugen zonder biggen: ten hoogste 20 mm;'
    url: https://wetten.overheid.nl/BWBR0006806/1999-04-01#Artikel8
  - number: 8.1.b
    text: 'zogende zeugen met biggen: ten hoogste 10 mm bij betonroostervloeren en 12 mm bij andere roostervloeren;'
    url: https://wetten.overheid.nl/BWBR0006806/1999-04-01#Artikel8
  - number: 8.1.c
    text: 'gespeende varkens: ten hoogste 15 mm;'
    url: https://wetten.overheid.nl/BWBR0006806/1999-04-01#Artikel8
  - number: 8.1.d
    text: 'gebruiksvarkens: ten hoogste 20 mm.'
    url: https://wetten.overheid.nl/BWBR0006806/1999-04-01#Artikel8
  - number: '8.2'
    text: |-
      Onverminderd het eerste lid voldoen betonroostervloeren aan de Nederlandse normen, bedoeld in NEN-normen nr. 3873
      betreffende roostervloeren van gewapend beton voor stalgebouwen, zoals uitgegeven door het Nederlands Normalisatie-
      Instituut in februari 1989.
    url: https://wetten.overheid.nl/BWBR0006806/1999-04-01#Artikel8
  - number: '9'
    text: |-
      Onverminderd hoofdstuk I, punt 16, alsmede hoofdstuk II, onder I, onder II, punt 2, en onder III, punt 1, van de
      bijlage is het dichte deel van de vloer van een stal bestemd voor een beer of een zogende zeug met biggen voorzien
      van strooisel bestaande uit stro, hooi, houtkrullen, zaagsel, compost, turf of een mengsel daarvan, dan wel, in
      geval van een zogende zeug met biggen, bedekt met een rubber mat.
    url: https://wetten.overheid.nl/BWBR0006806/1999-04-01#Artikel9
  - number: '10'
    text: |-
      Van voldoende daglicht of kunstlicht als bedoeld in punt 5 van hoofdstuk I van de bijlage is sprake indien de
      verlichting in de stal verticaal op dierhoogte gemeten ten minste 12 lux bedraagt.
    url: https://wetten.overheid.nl/BWBR0006806/1999-04-01#Artikel10
  - number: '11'
    text: |-
      Onverminderd punt 13 van hoofdstuk I van de bijlage bedraagt de lengte van de rechte trog tenminste 0,30 m per
      geslachtsrijp varken indien de varkens worden gehouden in groepen die niet ad libitum of door middel van een
      automatisch voedersysteem worden gevoederd.
    url: https://wetten.overheid.nl/BWBR0006806/1999-04-01#Artikel11
  - number: '12'
    text: |-
      De verzorging van varkens geschiedt overeenkomstig [artikel 13][ref1] van dit besluit en hoofdstuk I, de punten
      4, eerste, tweede en laatste zin, 6, eerste, tweede en laatste zin, 7, 9, eerste zin, 10, 12, 13, eerste zin, 15
      voor zover betreffend het onderhoud van voeder- en drinkinstallaties, 16, en hoofdstuk II, onder II, punt 1 van
      de bijlage.


      [ref1]: https://wetten.overheid.nl/BWBR0006806#Artikel13
    url: https://wetten.overheid.nl/BWBR0006806/1999-04-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0006806
        artikel: '13'
        paragraaf: '3'
  - number: '13'
    text: Onverminderd punt 16 van hoofdstuk I van de bijlage wordt aan zeugen zonder biggen enig ruwvoer verstrekt.
    url: https://wetten.overheid.nl/BWBR0006806/1999-04-01#Artikel13
  - number: '15'
    text: |-
      Onverminderd het bepaalde bij of krachtens de [Wet op de uitoefening van de diergeneeskunde][ref1] geschiedt het
      castreren van mannelijke varkens ouder dan vier weken slechts indien de varkens verdoofd zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0004730
    url: https://wetten.overheid.nl/BWBR0006806/1999-04-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0004730
  - number: '16'
    text: Het spenen van biggen geschiedt overeenkomstig hoofdstuk II, onder III, punt 5, van de bijlage.
    url: https://wetten.overheid.nl/BWBR0006806/1999-04-01#Artikel16
  - number: '17'
    text: |-
      Onverminderd het overigens ten aanzien van de invoer bepaalde geschiedt de invoer van varkens die vanuit een
      derde land via Nederland voor het eerst op het grondgebied van de Europese Gemeenschappen worden gebracht, slechts
      indien de varkens vergezeld gaan van een geldig, door de bevoegde autoriteit van dat derde land afgegeven, volledig
      ingevuld en gedagtekend certificaat als bedoeld in artikel 8 van [richtlijn 91/630/EEG](31991L0630).
    url: https://wetten.overheid.nl/BWBR0006806/1999-04-01#Artikel17
  - number: '18.1'
    text: |-
      Een wijziging van artikel 8 van [richtlijn 91/630/EEG](31991L0630) dan wel van de bijlage, bedoeld in
      [artikel 2][ref1], [12][ref2], [14][ref3] en [16][ref4], treedt voor de toepassing van die artikelen in werking met
      ingang van de dag waarop aan de betrokken wijziging uitvoering moet zijn gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0006806#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006806#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0006806#Artikel14
      [ref4]: https://wetten.overheid.nl/BWBR0006806#Artikel16
    url: https://wetten.overheid.nl/BWBR0006806/1999-04-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0006806
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0006806
        artikel: '12'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0006806
        artikel: '14'
        paragraaf: '4'
      - id: ref4
        bwb_id: BWBR0006806
        artikel: '16'
        paragraaf: '5'
  - number: '18.2'
    text: |-
      Onze Minister van Landbouw, Natuurbeheer en Visserij doet mededeling van een wijziging als bedoeld in het eerste
      lid, in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0006806/1999-04-01#Artikel18
  - number: '19.1'
    text: |-
      [Artikel 2a, eerste lid][ref1], voorzover van toepassing op gelten en zeugen, is tot 1 januari 2008 niet van
      toepassing indien het een stal betreft waarvan de gebruiker kan aantonen dat hij vóór 1 november 1998 in gebruik is
      genomen en dat die stal of de vloer van de stal nadien niet is verbouwd of herbouwd.


      [ref1]: https://wetten.overheid.nl/BWBR0006806#Artikel2a
    url: https://wetten.overheid.nl/BWBR0006806/1999-04-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0006806
        artikel: 2a
        paragraaf: '2'
  - number: '19.2'
    text: |-
      [Artikel 2a, tweede tot en met vierde lid][ref1], is tot 1 januari 2008 niet van toepassing indien het een stal
      betreft waarvan de gebruiker kan aantonen dat hij vóór 1 november 1998 in gebruik is genomen en dat die stal of de
      vloer van de stal nadien niet is verbouwd.


      [ref1]: https://wetten.overheid.nl/BWBR0006806#Artikel2a
    url: https://wetten.overheid.nl/BWBR0006806/1999-04-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0006806
        artikel: 2a
        paragraaf: '2'
  - number: '19.3'
    text: |-
      De [artikelen 4][ref1] en [5, tweede lid][ref2], zijn tot 1 januari 2008 niet van toepassing mits de gebruiker
      van de stal kan aantonen dat de stal vóór 1 november 1998 in gebruik is genomen, dat de stal vanaf 1 november 1998
      voldoet aan de [artikelen 4, eerste lid][ref3], en [5, tweede lid][ref4], van het Varkensbesluit zoals dat luidde
      vóór 1 september 1998 en dat die stal of de vloer van de stal na 1 november 1998 niet is verbouwd of herbouwd.


      [ref1]: https://wetten.overheid.nl/BWBR0006806#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0006806#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0006806#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0006806#Artikel5
    url: https://wetten.overheid.nl/BWBR0006806/1999-04-01#Artikel19
    references:
