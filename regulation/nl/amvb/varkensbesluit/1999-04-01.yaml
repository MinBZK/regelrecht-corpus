        artikel: '4'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0006806
        artikel: '5'
        paragraaf: '2'
  - number: '19.4'
    text: |-
      De [artikelen 3][ref1], [5, eerste lid][ref2], en [8][ref3] zijn tot 1 januari 2002 niet van toepassing indien
      het een stal betreft waarvan de gebruiker kan aantonen dat hij vóór 1 januari 1994 in gebruik is genomen en dat die
      stal of het in het desbetreffende artikel bedoelde onderdeel daarvan nadien niet is verbouwd of herbouwd.


      [ref1]: https://wetten.overheid.nl/BWBR0006806#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0006806#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0006806#Artikel8
