  - number: '19.5'
    text: |-
      [Artikel 4a, aanhef en onderdelen a en b][ref1], zijn tot 1 januari 2000 niet van toepassing indien het een stal
      betreft waarvan de gebruiker kan aantonen dat hij vóór 1 november 1998 in gebruik is genomen en dat die stal of de
      vloer van de stal nadien niet is verbouwd of herbouwd.


      [ref1]: https://wetten.overheid.nl/BWBR0006806#Artikel4a
    url: https://wetten.overheid.nl/BWBR0006806/1999-04-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0006806
        artikel: 4a
        paragraaf: '2'
  - number: '19.6'
    text: |-
      [Artikel 5, vierde lid][ref1], is gedurende 10 jaar na het in dat lid bedoelde tijdstip niet van toepassing indien
      het een stal betreft waarvan de gebruiker kan aantonen dat hij vóór dat tijdstip in gebruik is genomen en dat die
      stal of de vloer van de stal na dat tijdstip niet is verbouwd of herbouwd.


      [ref1]: https://wetten.overheid.nl/BWBR0006806#Artikel5
    url: https://wetten.overheid.nl/BWBR0006806/1999-04-01#Artikel19
    references:
      - id: ref1
