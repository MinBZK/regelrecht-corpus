  - number: '20'
    text: Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0006806/1999-04-01#Artikel20
  - number: '21'
    text: 'Dit besluit kan worden aangehaald als: Varkensbesluit.'
    url: https://wetten.overheid.nl/BWBR0006806/1999-04-01#Artikel21
