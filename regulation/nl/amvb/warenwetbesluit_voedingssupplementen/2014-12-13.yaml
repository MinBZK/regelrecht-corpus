---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: warenwetbesluit_voedingssupplementen
regulatory_layer: AMVB
publication_date: '2003-04-01'
valid_from: '2014-12-13'
bwb_id: BWBR0014814
url: https://wetten.overheid.nl/BWBR0014814/2014-12-13
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Volksgezondheid, Welzijn en Sport van 29 november 2002, VGB/VL 2335168
    gedaan in overeenstemming met Onze Ministers van Landbouw, Natuurbeheer en Visserij, van Economische Zaken, en
    van Justitie;

    Gelet op:

    – richtlijn nr. 2002/46/EG van het Europees Parlement en de Raad van de Europese Unie van 10 juni 2002 betreffende
    de onderlinge aanpassing van de wetgevingen der lidstaten inzake voedingssupplementen (PbEG L 183), alsmede

    – artikel 4, eerste lid, onder a en c, artikel 6, onder d, artikel 8, eerste lid, onder a en c, artikel 13, onder
    a, artikel 14, en artikel 32b, eerste lid, van de Warenwet;

    De Raad van State gehoord (advies van 6 februari 2003, No. W13.02.0549/III);

    Gezien het nader rapport van de Staatssecretaris van Volksgezondheid, Welzijn en Sport van 11 maart 2003 met nummer
    VGB/VL 2361770, uitgebracht in overeenstemming met Onze Ministers van Landbouw, Natuurbeheer en Visserij, van
    Economische Zaken, en van Justitie;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0014814/2014-12-13#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0014814/2014-12-13#Artikel1
  - number: 1.1.a
    text: '*microvoedingsstoffen*: vitaminen en mineralen;'
    url: https://wetten.overheid.nl/BWBR0014814/2014-12-13#Artikel1
  - number: 1.1.b
    text: '*voedingssupplementen*: eet- of drinkwaren die:'
    url: https://wetten.overheid.nl/BWBR0014814/2014-12-13#Artikel1
  - number: 1.1.b.1
    text: bedoeld zijn als aanvulling op de normale voeding;
    url: https://wetten.overheid.nl/BWBR0014814/2014-12-13#Artikel1
  - number: 1.1.b.2
    text: |-
      een geconcentreerde bron vormen van één of meer microvoedingsstoffen of van andere stoffen met een voedingskundig
      of fysiologisch effect; en
    url: https://wetten.overheid.nl/BWBR0014814/2014-12-13#Artikel1
  - number: 1.1.b.3
    text: verhandeld worden in voor inname bestemde afgemeten kleine eenheidshoeveelheden;
    url: https://wetten.overheid.nl/BWBR0014814/2014-12-13#Artikel1
  - number: 1.1.c
    text: |-
      *richtlijn 2002/46/EG*: [richtlijn nr. 2002/46/EG](32002L0046) van het Europees Parlement en de Raad van de
      Europese Unie van 10 juni 2002 betreffende de onderlinge aanpassing van de wetgevingen der lidstaten inzake
      voedingssupplementen (PbEG L 183);
    url: https://wetten.overheid.nl/BWBR0014814/2014-12-13#Artikel1
  - number: 1.1.d
    text: |-
      *verordening (EU) 1169/2011*: Verordening (EU) nr. 1169/2011 van het Europees Parlement en de Raad van 25 oktober
      2011 betreffende de verstrekking van voedselinformatie aan consumenten, tot wijziging van Verordeningen (EG)
      nr. 1924/2006 en (EG) nr. 1925/2006 van het Europees Parlement en de Raad en tot intrekking van Richtlijn 87/250/
      EEG van de Commissie, Richtlijn 90/496/EEG van de Raad, Richtlijn 1999/10/EG van de Commissie, Richtlijn 2000/13/
      EG van het Europees Parlement en de Raad, Richtlijnen 2002/67/EG en 2008/5/EG van de Commissie, en Verordening (EG)
      nr. 608/2004 van de Commissie (PbEU 2011, L 304).
    url: https://wetten.overheid.nl/BWBR0014814/2014-12-13#Artikel1
  - number: '1.2'
    text: |-
      Dit besluit is niet van toepassing op geneesmiddelen als bedoeld in
      [artikel 1, eerste lid, onder b, van de Geneesmiddelenwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel1
    url: https://wetten.overheid.nl/BWBR0014814/2014-12-13#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '1'
  - number: '2.1'
    text: |-
      Het is verboden voedingssupplementen te bereiden of te verhandelen die niet voldoen aan de bij of krachtens dit
      besluit gestelde eisen met betrekking tot hun samenstelling.
    url: https://wetten.overheid.nl/BWBR0014814/2014-12-13#Artikel2
  - number: '2.2'
    text: |-
      Het is verboden voedingssupplementen aan de eindverbruiker te koop aan te bieden, te verkopen of af te leveren
      anders dan als voorverpakt levensmiddel als bedoeld in artikel 2, tweede lid, onder e, van verordening (EU)
      1169/2011.
    url: https://wetten.overheid.nl/BWBR0014814/2014-12-13#Artikel2
  - number: '2.3'
    text: |-
      Het is verboden voedingssupplementen te verhandelen anders dan met inachtneming van de bij dit besluit gestelde
      voorschriften met betrekking tot hun aanduiding.
    url: https://wetten.overheid.nl/BWBR0014814/2014-12-13#Artikel2
  - number: '2.4'
    text: |-
      Het is verboden voedingssupplementen te verhandelen anders dan met inachtneming van de bij of krachtens dit besluit
      gestelde voorschriften met betrekking tot het bezigen van vermeldingen of voorstellingen betreffende de aard,
      samenstelling, hoedanigheid, eigenschappen of bestemming van de waar.
    url: https://wetten.overheid.nl/BWBR0014814/2014-12-13#Artikel2
  - number: '3.1'
    text: |-
      Bij regeling van Onze Minister worden ter uitvoering van artikel 4, eerste lid, van [richtlijn 2002/46/EG]
      (32002L0046), de microvoedingsstoffen en de verbindingen daarvan aangewezen die uitsluitend gebruikt mogen worden
      bij de bereiding van voedingssupplementen.
    url: https://wetten.overheid.nl/BWBR0014814/2014-12-13#Artikel3
  - number: '3.2'
    text: |-
      Bij regeling van Onze Minister worden ter uitvoering van krachtens [richtlijn 2002/46/EG](32002L0046) vastgestelde
      maatregelen de zuiverheidseisen vastgesteld voor de in het eerste lid bedoelde microvoedingsstoffen.
    url: https://wetten.overheid.nl/BWBR0014814/2014-12-13#Artikel3
  - number: '3.3'
    text: |-
      Krachtens de [Warenwet][ref1] vastgestelde zuiverheidseisen voor in het eerste lid bedoelde microvoedingsstoffen
      die gebruikt worden bij de bereiding van andere eet- en drinkwaren dan voedingssupplementen, zijn van
      overeenkomstige toepassing bij de bereiding van voedingssupplementen.


      [ref1]: https://wetten.overheid.nl/BWBR0001969
    url: https://wetten.overheid.nl/BWBR0014814/2014-12-13#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0001969
  - number: '4'
    text: |-
      Bij regeling van Onze Minister worden ter uitvoering van krachtens artikel 5, vierde lid, van [richtlijn
      2002/46/EG](32002L0046) getroffen maatregelen, de hoeveelheden vitaminen en mineralen vastgesteld, die in
      voedingssupplementen:
    url: https://wetten.overheid.nl/BWBR0014814/2014-12-13#Artikel4
  - number: 4.a
    text: ten minste aanwezig zijn; en
    url: https://wetten.overheid.nl/BWBR0014814/2014-12-13#Artikel4
  - number: 4.b
    text: ten hoogste aanwezig mogen zijn.
    url: https://wetten.overheid.nl/BWBR0014814/2014-12-13#Artikel4
  - number: '5'
    text: De aanduiding *voedingssupplement* mag uitsluitend en moet worden gebezigd voor voedingssupplementen.
    url: https://wetten.overheid.nl/BWBR0014814/2014-12-13#Artikel5
  - number: '6.1'
    text: 'Onverminderd verordening (EU) 1169/2011 worden bij voedingssupplementen vermeldingen gebezigd inzake:'
    url: https://wetten.overheid.nl/BWBR0014814/2014-12-13#Artikel6
  - number: 6.1.a
    text: |-
      de aanduiding van de categorieën microvoedingsstoffen of stoffen die de waar kenmerken, of informatie betreffende
      de aard van deze microvoedingsstoffen of stoffen;
    url: https://wetten.overheid.nl/BWBR0014814/2014-12-13#Artikel6
  - number: 6.1.b
    text: de aanbevolen dagelijkse portie van de waar;
    url: https://wetten.overheid.nl/BWBR0014814/2014-12-13#Artikel6
  - number: 6.1.c
    text: een waarschuwing voor overschrijding van de aanbevolen dagelijkse portie;
    url: https://wetten.overheid.nl/BWBR0014814/2014-12-13#Artikel6
  - number: 6.1.d
    text: een vermelding dat voedingssupplementen niet als substituut voor een gevarieerde voeding worden gebruikt; en
    url: https://wetten.overheid.nl/BWBR0014814/2014-12-13#Artikel6
  - number: 6.1.e
    text: een waarschuwing dat voedingssupplementen buiten bereik van jonge kinderen moeten worden bewaard.
    url: https://wetten.overheid.nl/BWBR0014814/2014-12-13#Artikel6
  - number: '6.2'
    text: |-
      Bij de vaststelling van de aanbevolen dagelijkse portie wordt rekening gehouden met de in [artikel 4][ref1]
      bedoelde hoeveelheden.


      [ref1]: https://wetten.overheid.nl/BWBR0014814#Artikel4
    url: https://wetten.overheid.nl/BWBR0014814/2014-12-13#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0014814
        artikel: '4'
        paragraaf: '2'
  - number: '6.3'
    text: |-
      Bij voedingssupplementen worden geen vermeldingen gebezigd die beweren of suggereren dat een evenwichtige en
      gevarieerde voeding in het algemeen geen passende hoeveelheden aan microvoedingsstoffen kan bieden.
    url: https://wetten.overheid.nl/BWBR0014814/2014-12-13#Artikel6
  - number: '6.4'
    text: |-
      Bij regeling van Onze Minister worden ter uitvoering van krachtens artikel 7 van [richtlijn 2002/46/EG](32002L0046)
      getroffen maatregelen nadere regels vastgesteld inzake het tweede en derde lid.
    url: https://wetten.overheid.nl/BWBR0014814/2014-12-13#Artikel6
  - number: '7.1'
    text: |-
      De hoeveelheid in een voedingssupplement aanwezige microvoedingsstoffen of stoffen met een voedingskundig of
      fysiologisch effect wordt in de etikettering van de waar vermeld in een getal. Deze vermelding;
    url: https://wetten.overheid.nl/BWBR0014814/2014-12-13#Artikel7
  - number: 7.1.a
    text: heeft betrekking op de aanbevolen dagelijkse portie; en
    url: https://wetten.overheid.nl/BWBR0014814/2014-12-13#Artikel7
  - number: 7.1.b
    text: |-
      wordt uitgedrukt als percentage van de, voor zover van toepassing, in bijlage XIII, deel A, van verordening (EU)
      1169/2011, vermelde referentie-innames.
    url: https://wetten.overheid.nl/BWBR0014814/2014-12-13#Artikel7
  - number: '7.2'
    text: |-
      De in de aanhef van het eerste lid bedoelde hoeveelheid is een gemiddelde op basis van de analyse van de waar door
      de desbetreffende fabrikant.
    url: https://wetten.overheid.nl/BWBR0014814/2014-12-13#Artikel7
  - number: '7.3'
    text: |-
      Onverminderd het eerste lid, onder b, mag het daar bedoelde percentage van de referentiewaarden voor vitaminen en
      mineralen ook grafisch worden weergegeven.
    url: https://wetten.overheid.nl/BWBR0014814/2014-12-13#Artikel7
  - number: '7.4'
    text: |-
      Bij regeling van Onze Minister worden ter uitvoering van krachtens artikel 8, eerste lid, en artikel 9, eerste
      en tweede lid, van [richtlijn 2002/46/EG](32002L0046) getroffen maatregelen, nadere regels vastgesteld inzake het
      eerste, tweede, of derde lid.
    url: https://wetten.overheid.nl/BWBR0014814/2014-12-13#Artikel7
  - number: '9.1'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin het wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0014814/2014-12-13#Artikel9
  - number: '9.2'
    text: |-
      In afwijking van het eerste lid treden [artikel 2][ref1] en [artikel 8][ref2] in werking met ingang van 1 augustus
      2005.


      [ref1]: https://wetten.overheid.nl/BWBR0014814#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0014814#Artikel8
    url: https://wetten.overheid.nl/BWBR0014814/2014-12-13#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0014814
        artikel: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0014814
        artikel: '8'
        paragraaf: '4'
  - number: '9.3'
    text: |-
      [Artikel 3, vierde lid][ref1], vervalt met ingang van 31 december 2009.


      [ref1]: https://wetten.overheid.nl/BWBR0014814#Artikel3
    url: https://wetten.overheid.nl/BWBR0014814/2014-12-13#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0014814
        artikel: '3'
        paragraaf: '2'
  - number: '10'
    text: 'Dit besluit wordt aangehaald als: Warenwetbesluit voedingssupplementen.'
    url: https://wetten.overheid.nl/BWBR0014814/2014-12-13#Artikel10
