preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Volksgezondheid, Welzijn en Sport van 29 november 2002, VGB/VL 2335168
    gedaan in overeenstemming met Onze Ministers van Landbouw, Natuurbeheer en Visserij, van Economische Zaken, en
    van Justitie;

    Gelet op:

    – richtlijn nr. 2002/46/EG van het Europees Parlement en de Raad van de Europese Unie van 10 juni 2002 betreffende
    de onderlinge aanpassing van de wetgevingen der lidstaten inzake voedingssupplementen (PbEG L 183), alsmede

    – artikel 4, eerste lid, onder a en c, artikel 6, onder d, artikel 8, eerste lid, onder a en c, artikel 13, onder
    a, artikel 14, en artikel 32b, eerste lid, van de Warenwet;

    De Raad van State gehoord (advies van 6 februari 2003, No. W13.02.0549/III);

    Gezien het nader rapport van de Staatssecretaris van Volksgezondheid, Welzijn en Sport van 11 maart 2003 met nummer
    VGB/VL 2361770, uitgebracht in overeenstemming met Onze Ministers van Landbouw, Natuurbeheer en Visserij, van
    Economische Zaken, en van Justitie;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0014814/2009-12-31#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. *microvoedingsstoffen*: vitaminen en mineralen;

      b. *voedingssupplementen*: eet- of drinkwaren die:

      1° bedoeld zijn als aanvulling op de normale voeding;

      2° een geconcentreerde bron vormen van één of meer microvoedingsstoffen of van andere stoffen met een
      voedingskundig of fysiologisch effect; en

      3° verhandeld worden in voor inname bestemde afgemeten kleine eenheidshoeveelheden;

      c. *richtlijn 2002/46/EG*: [richtlijn nr. 2002/46/EG](32002L0046) van het Europees Parlement en de Raad van
      de Europese Unie van 10 juni 2002 betreffende de onderlinge aanpassing van de wetgevingen der lidstaten inzake
      voedingssupplementen (PbEG L 183);

      2 Dit besluit is niet van toepassing op geneesmiddelen als bedoeld in
      [artikel 1, eerste lid, onder b, van de Geneesmiddelenwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel1
    url: https://wetten.overheid.nl/BWBR0014814/2009-12-31#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '1'
  - number: '2'
    text: |-
      1 Het is verboden voedingssupplementen te bereiden of te verhandelen die niet voldoen aan de bij of krachtens dit
      besluit gestelde eisen met betrekking tot hun samenstelling.

      2 Het is verboden voedingssupplementen aan de eindverbruiker te koop aan te bieden,
      te verkopen of af te leveren anders dan in een voorverpakking als bedoeld in
      [artikel 1, onder c, van het Warenwetbesluit Etikettering van levensmiddelen][ref1].

      3 Het is verboden voedingssupplementen te verhandelen anders dan met inachtneming van de bij dit besluit gestelde
      voorschriften met betrekking tot hun aanduiding.

      4 Het is verboden voedingssupplementen te verhandelen anders dan met inachtneming van de bij of krachtens dit
      besluit gestelde voorschriften met betrekking tot het bezigen van vermeldingen of voorstellingen betreffende de
      aard, samenstelling, hoedanigheid, eigenschappen of bestemming van de waar.


      [ref1]: https://wetten.overheid.nl/BWBR0005310#Artikel1
    url: https://wetten.overheid.nl/BWBR0014814/2009-12-31#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005310
        artikel: '1'
  - number: '3'
    text: |-
      1 Bij regeling van Onze Minister worden ter uitvoering van artikel 4, eerste lid, van [richtlijn 2002/46/EG]
      (32002L0046), de microvoedingsstoffen en de verbindingen daarvan aangewezen die uitsluitend gebruikt mogen worden
      bij de bereiding van voedingssupplementen.

      2 Bij regeling van Onze Minister worden ter uitvoering van krachtens [richtlijn 2002/46/EG](32002L0046)
      vastgestelde maatregelen de zuiverheidseisen vastgesteld voor de in het eerste lid bedoelde microvoedingsstoffen.

      3 Krachtens de [Warenwet][ref1] vastgestelde zuiverheidseisen voor in het eerste lid bedoelde microvoedingsstoffen
      die gebruikt worden bij de bereiding van andere eet- en drinkwaren dan voedingssupplementen, zijn van
      overeenkomstige toepassing bij de bereiding van voedingssupplementen.


      [ref1]: https://wetten.overheid.nl/BWBR0001969
    url: https://wetten.overheid.nl/BWBR0014814/2009-12-31#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0001969
  - number: '4'
    text: |-
      Bij regeling van Onze Minister worden ter uitvoering van krachtens artikel 5, vierde lid, van [richtlijn
      2002/46/EG](32002L0046) getroffen maatregelen, de hoeveelheden vitaminen en mineralen vastgesteld, die in
      voedingssupplementen:

      a. ten minste aanwezig zijn; en

      b. ten hoogste aanwezig mogen zijn.
    url: https://wetten.overheid.nl/BWBR0014814/2009-12-31#Artikel4
  - number: '5'
    text: De aanduiding *voedingssupplement* mag uitsluitend en moet worden gebezigd voor voedingssupplementen.
    url: https://wetten.overheid.nl/BWBR0014814/2009-12-31#Artikel5
  - number: '6'
    text: |-
      1 Onverminderd het [Warenwetbesluit Etikettering van levensmiddelen][ref1] worden bij voedingssupplementen
      vermeldingen gebezigd inzake:

      a. de aanduiding van de categorieën microvoedingsstoffen of stoffen die de waar kenmerken, of informatie
      betreffende de aard van deze microvoedingsstoffen of stoffen;

      b. de aanbevolen dagelijkse portie van de waar;

      c. een waarschuwing voor overschrijding van de aanbevolen dagelijkse portie;

      d. een vermelding dat voedingssupplementen niet als substituut voor een gevarieerde voeding worden gebruikt; en

      e. een waarschuwing dat voedingssupplementen buiten bereik van jonge kinderen moeten worden bewaard.

      2 Bij de vaststelling van de aanbevolen dagelijkse portie wordt rekening gehouden met de in [artikel 4][ref2]
      bedoelde hoeveelheden.

      3 Bij voedingssupplementen worden geen vermeldingen gebezigd die beweren of suggereren dat een evenwichtige en
      gevarieerde voeding in het algemeen geen passende hoeveelheden aan microvoedingsstoffen kan bieden.

      4 Bij regeling van Onze Minister worden ter uitvoering van krachtens artikel 7 van [richtlijn 2002/46/EG]
      (32002L0046) getroffen maatregelen nadere regels vastgesteld inzake het tweede en derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005310
      [ref2]: https://wetten.overheid.nl/BWBR0014814#Artikel4
    url: https://wetten.overheid.nl/BWBR0014814/2009-12-31#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005310
      - id: ref2
        bwb_id: BWBR0014814
        artikel: '4'
        paragraaf: '2'
  - number: '7'
    text: |-
      1 De hoeveelheid in een voedingssupplement aanwezige microvoedingsstoffen of stoffen met een voedingskundig of
      fysiologisch effect wordt in de etikettering van de waar vermeld in een getal. Deze vermelding;

      a. heeft betrekking op de aanbevolen dagelijkse portie; en

      b. wordt uitgedrukt als percentage van de, voor zover van toepassing, in de bijlage van het Warenwetbesluit
      Voedingswaarde-informatie levensmiddelen vermelde referentiewaarden.

      2 De in de aanhef van het eerste lid bedoelde hoeveelheid is een gemiddelde op basis van de analyse van de waar
      door de desbetreffende fabrikant.

      3 Onverminderd het eerste lid, onder b, mag het daar bedoelde percentage van de referentiewaarden voor vitaminen en
      mineralen ook grafisch worden weergegeven.

      4 Bij regeling van Onze Minister worden ter uitvoering van krachtens artikel 8, eerste lid, en artikel 9, eerste
      en tweede lid, van [richtlijn 2002/46/EG](32002L0046) getroffen maatregelen, nadere regels vastgesteld inzake het
      eerste, tweede, of derde lid.
    url: https://wetten.overheid.nl/BWBR0014814/2009-12-31#Artikel7
  - number: '9'
    text: |-
      1 Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin het wordt
      geplaatst.

