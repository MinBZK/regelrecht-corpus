preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Financiën van 16 december 1998, nr. BGW 98/2586-M, Generale Thesaurie,
    Directie Binnenlands Geldwezen, Afdeling Effectenwezen;

    Gelet op artikel 9, onder c, van de Bankwet 1998;

    Overwegende dat het verrichten van werkzaamheden van De Nederlandsche Bank N.V. betrekking hebbende op
    uitvoering van de Collectieve Garantieregeling van kredietinstellingen en de Beleggerscompensatieregeling van
    effecteninstellingen, waaronder mede gerekend wordt financiering in verband met verplichtingen van de Stichting
    Toezicht Effectenverkeer, in het algemeen belang is;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0010134/1998-12-23#ArtikelAanhef
articles:
  - number: '1'
    text: 'Wij verlenen goedkeuring aan De Nederlandsche Bank N.V.:'
    url: https://wetten.overheid.nl/BWBR0010134/1998-12-23#Artikel1
  - number: 1.a
    text: |-
      om werkzaamheden te verrichten die noodzakelijk zijn voor de uitvoering van de Collectieve
      Garantieregeling van kredietinstellingen voor terugbetaalbare gelden en beleggingen, welke ingevolge
      [artikel 84 van de Wet toezicht kredietwezen 1992][ref1], bij besluit van 28 september 1998 algemeen verbindend
      is verklaard;


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel84
    url: https://wetten.overheid.nl/BWBR0010134/1998-12-23#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005792
        artikel: '84'
  - number: 1.b
    text: |-
      om werkzaamheden, waaronder mede gerekend wordt financiering in verband met verplichtingen van de
      Stichting Toezicht Effectenverkeer, te verrichten die noodzakelijk zijn voor de uitvoering van de
      Beleggerscompensatieregeling van effecteninstellingen voor vorderingen van beleggers welke ingevolge
      [artikel 28a, eerste lid, van de Wet toezicht effectenverkeer 1995][ref1], bij besluit van 21 september 1998
      algemeen verbindend is verklaard;


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel28a
    url: https://wetten.overheid.nl/BWBR0010134/1998-12-23#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007657
        artikel: 28a
  - number: '2'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin het wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0010134/1998-12-23#Artikel2
