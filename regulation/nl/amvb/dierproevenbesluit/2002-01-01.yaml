        artikel: '5'
      - id: ref2
        bwb_id: BWBR0003802
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0003081
        artikel: '20'
  - number: '10'
    text: >-
      1 De vergunninghouder is met betrekking tot de proefdieren waarover hij beschikt, verplicht aantekening te houden
      van:


      a. het aantal, de soort en de datum van verwerving van de dieren;


      b. de herkomst van de dieren;


      c. het gebruik dat van de dieren is gemaakt;


      d. de reden en de datum van afvoer der dieren.


      2 De in het vorige lid bedoelde gegevens dienen te worden bewaard tot vijf jaren na afloop van het kalenderjaar
      waarop de gegevens betrekking hebben.


      3 Voorzover het een paard, een aap, een hond of een kat betreft dienen de in het eerste lid bedoelde gegevens voor
      ieder dier afzonderlijk te worden bijgehouden. Daartoe dienen deze dieren door het aanbrengen van merktekens of
      anderszins identificeerbaar te zijn.


      4 Onze Minister kan aanwijzingen geven over de wijze waarop het aanbrengen van merktekens dient te geschieden.


      5 De vergunninghouder is tevens verplicht per proef aantekening te houden van:


      a. het doel waarvoor de proef wordt verricht;


      b. de vraagstelling die leidde tot het ontwerpen van de proef, alsmede de naam van degene die de wijze van
      uitvoering van de proef bepaalde;


      c. de aard van de proef;


      d. het aantal en de soort van de bij de proef betrokken dieren;


      e. het al dan niet rechtstreeks verband van de proef met de gezondheid of met de voeding van mens of dier;


      f. het al dan niet rechtstreeks verband tussen het doel van de proef en geldende wettelijke bepalingen;


      g. de bij de proef in het geding zijnde technieken, daaronder begrepen eventuele verdoving;


      h. het in de proef aanwezige risico van ongerief voor de dieren;


      i. de bestemming der dieren na afloop van de proef.


      6 Onze Minister stelt vast welke gegevens omtrent de proefdieren en de verrichte proeven de vergunninghouder hem
      dient te verstrekken; deze gegevens dienen jaarlijks over het voorafgaande kalenderjaar te worden verstrekt.


      7 Onze Minister kan nadere regelen stellen met betrekking tot het in het eerste, vijfde en zesde lid bepaalde.
    url: https://wetten.overheid.nl/BWBR0003802/2002-01-01#Artikel10
  - number: '11'
    text: >-
      Bij het indienen van een aanvrage om een vergunning, bedoeld in artikel 2 van de wet, is een bedrag van € 90,76
      verschuldigd.
    url: https://wetten.overheid.nl/BWBR0003802/2002-01-01#Artikel11
  - number: 11a
    text: |-
      Om in aanmerking te komen voor een vergunning tot het fokken of afleveren van proefdieren als bedoeld in
      [artikel 11][ref1], dient de aanvrager aannemelijk te maken dat hij wat betreft de organisatie kan voldoen aan de
      [artikelen 4][ref2], [7][ref3], [8][ref4], [9][ref5] en [10][ref6], alsmede, wat betreft het personeel, aan de
      [artikelen 3][ref7], [5][ref8] en [6][ref9].


      [ref1]: https://wetten.overheid.nl/BWBR0003081#Artikel11a
