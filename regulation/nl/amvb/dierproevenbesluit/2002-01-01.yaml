        bwb_id: BWBR0003802
        artikel: '10'
  - number: '2'
    text: >-
      1 De wijze van uitvoering van een dierproef dient te zijn bepaald door een persoon die in Nederland een doctoraal
      examen met goed gevolg heeft afgelegd in een biologische, biomedische of zoötechnische studierichting met ten
      minste 500 studiebelastingsuren (sbu's) biologische basisvakken. Hiervan dienen de vakken anatomie/zoölogie en
      dierfysiologie ieder ten minste 200 sbu's te omvatten.


      2 De in het eerste lid bedoelde persoon dient bovendien een door Onze Minister aan te wijzen cursus proefdierkunde
      te hebben gevolgd en met goed gevolg te hebben afgesloten.
    url: https://wetten.overheid.nl/BWBR0003802/2002-01-01#Artikel2
  - number: 2a
    text: >-
      Het onderzoeksplan, bedoeld in artikel 10*a*, tweede lid, van de wet, vermeldt in ieder geval:


      – de vraagstelling van het onderzoek;


      – het belang van het onderzoek voor de gezondheid of voeding van mens of dier;


      – het maatschappelijke en wetenschappelijke belang van het onderzoek;


      – de deskundigheid, waaronder begrepen de mate van ervaring op het desbetreffende onderzoeksgebied, van degene die
      de opzet en uitvoering van de proef bepaalt, in verband met artikel 9 van de wet;


      – door wie of door welke commissie de wetenschappelijke kwaliteit is beoordeeld;


      – de argumentatie, waarom de vraagstelling niet met minder dieren of anders dan met behulp van proefdieren kan
      worden beantwoord;


      – de motivering van de keuze van de soort en het aantal proefdieren;


      – de herkomst van de proefdieren;


      – de beoogde behandeling en verzorging, waaronder begrepen de huisvesting, voor, tijdens en na de proef, alsmede de
      deskundigheid van de hiermee belaste persoon, in verband met artikel 12 van de wet;


      – de aard, de frequentie en de duur van de ingrepen waaraan het dier wordt onderworpen;


      – de mate van ongerief dat de proefdieren wordt of kan worden berokkend;


      – de toepassing van verdoving of pijnstillende middelen en andere methoden ter vermijding van ongerief;


      of een dier eerder is gebruikt in verband met artikel 13, derde lid, van de wet;


      – of en, zo ja, op welk moment besloten zal worden over te gaan tot verantwoord doden van betrokken proefdieren,
      alsmede de methode welke wordt toegepast;


      – de uiteindelijke bestemming van het dier na de proef.
    url: https://wetten.overheid.nl/BWBR0003802/2002-01-01#Artikel2a
  - number: '3'
    text: |-
      Dieren die voor proeven worden gebruikt, dienen te worden verzorgd en behandeld door personen als bedoeld in
      [artikel 2][ref1], of door anderen die over een door Onze Minister erkend diploma beschikken dan wel aan door hem
      te stellen eisen van bekwaamheid voldoen. Onze Minister kan werkzaamheden aanwijzen, waarvan het verrichten is
      voorbehouden aan een of meer categorieën van de in dit lid bedoelde personen.


      [ref1]: https://wetten.overheid.nl/BWBR0003802#Artikel2
    url: https://wetten.overheid.nl/BWBR0003802/2002-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003802
        artikel: '2'
  - number: '4'
    text: >-
      1 Tenzij zulks de proef zou verijdelen dienen de voeding, de huisvesting en de overige verzorging en behandeling
      van de proefdieren op zodanige wijze en onder zodanige omstandigheden te geschieden dat zoveel mogelijk wordt
      voldaan aan hun fysiologische en ethologische behoeften.


      2 Onze Minister kan nadere regelen stellen met betrekking tot het in het eerste lid bepaalde.
    url: https://wetten.overheid.nl/BWBR0003802/2002-01-01#Artikel4
  - number: 4a
    text: >-
      Als handelingen waarbij in alle gevallen verdoving moet plaatsvinden, worden aangewezen die handelingen waarbij
      sprake is van ernstige verwondingen die hevige pijn kunnen veroorzaken.
    url: https://wetten.overheid.nl/BWBR0003802/2002-01-01#Artikel4a
  - number: '5'
    text: >-
      Aan de in artikel 14 van de wet bedoelde verplichting kan slechts worden voldaan door het houden van toezicht op
      het welzijn van de proefdieren op te dragen aan een persoon die in Nederland met goed gevolg het doctoraal examen
      heeft afgelegd in één van de volgende studierichtingen:


      1. diergeneeskunde;


      2. geneeskunde;


      3. biologie, afstudeerrichting medische biologie;


      4. biologie, afstudeerrichting zoölogie, waarbij pathofysiologie onderdeel van het onderwijsprogramma uitmaakt.


      De in de vorige volzin bedoelde persoon dient bovendien een door Onze Minister aan te wijzen cursus welzijn van
      proefdieren te hebben gevolgd en met goed gevolg te hebben afgesloten.
    url: https://wetten.overheid.nl/BWBR0003802/2002-01-01#Artikel5
  - number: '6'
    text: |-
      De in [artikel 5][ref1] bedoelde opdracht omvat naast het houden van toezicht op de wijze van uitvoering van de
      dierproeven in ieder geval het houden van toezicht op de keuze en de verwerving van de proefdieren, waaronder
      begrepen de fokkerij, op hun verzorging en behandeling zowel voor en tijdens als na de proef, op de eventuele
      verdoving en euthanasie der dieren en voorts op de registratie van de proefdieren en de proeven.


      [ref1]: https://wetten.overheid.nl/BWBR0003802#Artikel5
    url: https://wetten.overheid.nl/BWBR0003802/2002-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0003802
        artikel: '5'
  - number: '7'
    text: |-
      De in [artikel 5][ref1] bedoelde opdracht gaat gepaard met de verlening van de bevoegdheid aan degene die met het
      toezicht is belast om:

      a. van ieder voor wiens handelen of nalaten de opdrachtgever als zodanig verantwoordelijk is, alle inlichtingen te
      verlangen alsmede inzage te verlangen van alle bescheiden en daarvan afschrift te nemen;

      b. te allen tijde alle plaatsen waarvoor de opdrachtgever als zodanig verantwoordelijk is, te betreden. Indien voor
      het betreden van een plaats in het belang van een proef voorschriften zijn gesteld, worden deze bij het betreden
      van die plaats in acht genomen;

      c. dieren en goederen waarvoor de opdrachtgever als zodanig verantwoordelijk is, aan een onderzoek ter plaatse of
      elders te onderwerpen of te doen onderwerpen en van goederen monsters te nemen of te doen nemen, een en ander voor
      zover dit voor de vervulling van de in [artikel 6][ref2] omschreven taak redelijkerwijs nodig is.


      [ref1]: https://wetten.overheid.nl/BWBR0003802#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0003802#Artikel6
    url: https://wetten.overheid.nl/BWBR0003802/2002-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0003802
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0003802
        artikel: '6'
  - number: '8'
    text: |-
      De vergunninghouder draagt zorg dat ieder voor wiens handelen of nalaten hij als zodanig verantwoordelijk is, aan
      de in [artikel 5][ref1] bedoelde persoon alle ingevolge [artikel 7][ref2] verlangde medewerking verleent alsmede
      dat de verstrekking van de ingevolge [artikel 7, eerste lid][ref3], verlangde inlichtingen volledig en naar
      waarheid geschiedt.


      [ref1]: https://wetten.overheid.nl/BWBR0003802#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0003802#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0003802#Artikel7
    url: https://wetten.overheid.nl/BWBR0003802/2002-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003802
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0003802
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0003802
        artikel: '7'
  - number: '9'
    text: |-
      De in [artikel 5][ref1] bedoelde opdracht omvat de verplichting van degene die met het toezicht is belast ten
      minste eenmaal per jaar aan de opdrachtgever schriftelijk verslag uit te brengen van zijn in [artikel 6][ref2]
      bedoelde werkzaamheden. De opdrachtgever zendt aan de op grond van [artikel 20 van de wet][ref3] aangewezen
      hoofdinspecteur een afschrift van dit verslag toe.


      [ref1]: https://wetten.overheid.nl/BWBR0003802#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0003802#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0003081#Artikel20
    url: https://wetten.overheid.nl/BWBR0003802/2002-01-01#Artikel9
    references:
