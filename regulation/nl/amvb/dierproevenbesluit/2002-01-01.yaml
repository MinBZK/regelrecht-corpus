preamble:
  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Op de voordracht van de Staatssecretaris van Welzijn, Volksgezondheid en Cultuur van 8 februari 1985, DG VGZ/VVP,
    no. 143898;


    Gelet op de artikelen 3, tweede lid, 9, 12, 14 en 15 van de Wet op de dierproeven (Stb. 1977, 67);


    Gezien het advies van de Commissie van advies voor de dierproeven van 4 augustus 1982;


    De Raad van State gehoord (advies van 3 mei 1985, W13.85.0097/15.5.18.);


    Gezien het nader rapport van de Staatssecretaris van Welzijn, Volksgezondheid en Cultuur van 21 mei 1985, DGVGZ/
    VVP, no. 81688;


    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0003802/2002-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. "wet": [Wet op de dierproeven][ref1];

      b. "vergunninghouder": houder van een vergunning tot het verrichten van dierproeven als bedoeld
      in [artikel 2 van de wet][ref2], alsmede, voor de toepassing van de [artikelen 8][ref3] en
      [10, eerste en zesde lid][ref4], van dit besluit, de houder van een vergunning tot het fokken of afleveren van
      dieren als bedoeld in artikel 11*a* van de wet.


      [ref1]: https://wetten.overheid.nl/BWBR0003081
      [ref2]: https://wetten.overheid.nl/BWBR0003081#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0003802#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0003802#Artikel10
    url: https://wetten.overheid.nl/BWBR0003802/2002-01-01#Artikel1
