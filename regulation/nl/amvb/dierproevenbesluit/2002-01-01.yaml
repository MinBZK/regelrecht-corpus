  - number: '12'
    text: |-
      Het in de [artikelen 2, tweede lid][ref1], en [3][ref2] bepaalde geldt niet ten aanzien van degenen die op het
      tijdstip van afkondiging van dit besluit reeds zijn belast met de in die artikelen bedoelde werkzaamheden.


      [ref1]: https://wetten.overheid.nl/BWBR0003802#Artikel2
