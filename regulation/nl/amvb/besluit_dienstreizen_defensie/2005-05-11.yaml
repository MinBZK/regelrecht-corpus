$id: besluit_dienstreizen_defensie
regulatory_layer: AMVB
publication_date: '2019-10-10'
valid_from: '2005-05-11'
bwb_id: BWBR0007956
url: https://wetten.overheid.nl/BWBR0007956/2005-05-11
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Defensie van 9 januari 1996, nr. PAV2210/96000199;

    Gelet op de artikelen 12 van de Militaire Ambtenarenwet 1931, 125, eerste lid, van de Ambtenarenwet en 2 van de Wet
    rechtstoestand dienstplichtigen;

    De Raad van State gehoord (advies van 12 maart 1996, nr. W07.96.0014);

    Gezien het nader rapport van de Staatssecretaris van Defensie van 20 maart 1996, nr. PAV 6115/96004079;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0007956/2005-05-11#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop rustende bepalingen wordt, tenzij in dit besluit uitdrukkelijk anders is bepaald,
      verstaan onder:
    url: https://wetten.overheid.nl/BWBR0007956/2005-05-11#Artikel1
  - number: 1.a
    text: 'ministerie: Ministerie van Defensie;'
    url: https://wetten.overheid.nl/BWBR0007956/2005-05-11#Artikel1
  - number: 1.b
    text: 'bevoegd gezag: de bij ministeriële regeling aan te wijzen functionarissen;'
    url: https://wetten.overheid.nl/BWBR0007956/2005-05-11#Artikel1
  - number: 1.c
    text: 'de dienstreiziger:'
    url: https://wetten.overheid.nl/BWBR0007956/2005-05-11#Artikel1
  - number: 1.c.1
    text: de militair, bedoeld in artikel 1, eerste lid, onderdeel c, van het Algemeen militair ambtenarenreglement, of
    url: https://wetten.overheid.nl/BWBR0007956/2005-05-11#Artikel1
  - number: 1.c.2
    text: de ambtenaar, bedoeld in artikel 1, van het Burgerlijk ambtenarenreglement Defensie,
    url: https://wetten.overheid.nl/BWBR0007956/2005-05-11#Artikel1
  - number: 1.d
    text: |-
      de dienstreis: de door het bevoegd gezag aan de dienstreiziger in verband met dienstverrichting opgedragen
      noodzakelijke reis en het daarmee samenhangende verblijf;
    url: https://wetten.overheid.nl/BWBR0007956/2005-05-11#Artikel1
  - number: 1.e
    text: |-
      een plaats van tewerkstelling: een gebouw, gebouwencomplex, terrein of vaartuig, of een andere door het bevoegd
      gezag aan te wijzen plaats, waar of van waaruit de dienstreiziger gewoonlijk zijn werkzaamheden verricht;
    url: https://wetten.overheid.nl/BWBR0007956/2005-05-11#Artikel1
  - number: 1.f
    text: |-
      openbaar vervoer: voor een ieder openstaand personenvervoer per trein, metro, tram, bus, auto, pont, (veer)boot of
      vliegtuig volgens een dienstregeling, dan wel met de treintaxi;
    url: https://wetten.overheid.nl/BWBR0007956/2005-05-11#Artikel1
  - number: 1.g
    text: 'van overheidswege:'
    url: https://wetten.overheid.nl/BWBR0007956/2005-05-11#Artikel1
  - number: 1.g.1°
    text: |-
      vanwege of voor rekening van het rijk of van een ander Nederlands publiekrechtelijk of semi-publiekrechtelijk
      lichaam; en
    url: https://wetten.overheid.nl/BWBR0007956/2005-05-11#Artikel1
  - number: 1.g.2°
    text: vanwege een met overheidsmiddelen gesubsidieerde instelling;
    url: https://wetten.overheid.nl/BWBR0007956/2005-05-11#Artikel1
  - number: 1.h
    text: |-
      dienstvervoer: vervoer dat van overheidswege of vanwege een buitenlandse mogendheid, een buitenlandse krijgsmacht
      of een internationale organisatie ter beschikking is gesteld.
    url: https://wetten.overheid.nl/BWBR0007956/2005-05-11#Artikel1
  - number: '2'
    text: |-
      Onze Minister van Defensie kan in geval van buitengewone omstandigheden tijdelijk afwijken van hetgeen bij of
      krachtens dit besluit is bepaald, indien en voor zolang dit met het oog op de goede uitvoering van de operationele
      taken van de krijgsmacht noodzakelijk wordt geacht.
    url: https://wetten.overheid.nl/BWBR0007956/2005-05-11#Artikel2
  - number: '3.1'
    text: |-
      Dit besluit is niet van toepassing indien voor een reis aanspraak bestaat op een vergoeding van reis- en
      verblijfkosten uit anderen hoofde.
    url: https://wetten.overheid.nl/BWBR0007956/2005-05-11#Artikel3
  - number: '3.2'
    text: 'Dit besluit is voorts niet van toepassing:'
    url: https://wetten.overheid.nl/BWBR0007956/2005-05-11#Artikel3
  - number: 3.2.a
    text: op een van een militaire oefening deel uitmakende verplaatsing alsmede het daarmee samenhangende verblijf;
    url: https://wetten.overheid.nl/BWBR0007956/2005-05-11#Artikel3
  - number: 3.2.b
    text: op degene op wie hoofdstuk 3 van het Voorzieningenstelsel buitenland defensiepersoneel van toepassing is;
    url: https://wetten.overheid.nl/BWBR0007956/2005-05-11#Artikel3
  - number: 3.2.c
    text: |-
      op degene die zitting heeft in de militaire kamer van de rechtbank of het gerechtshof, dan wel voor zover die
      functie in deeltijd wordt uitgeoefend, voor zover het betreft de aan die functie-uitoefening verbonden vergoeding
      van reis- en verblijfkosten; of
    url: https://wetten.overheid.nl/BWBR0007956/2005-05-11#Artikel3
  - number: 3.2.d
    text: |-
      op degene die behoort tot bij ministeriële regeling aan te wijzen groepen, waarbij sprake is van een inzet onder
      leiding of toezicht van een orgaan van de Verenigde Naties, bij of ten behoeve van een bondgenootschappelijk
      orgaan of bondgenootschappelijke strijdkrachten dan wel ten behoeve van operaties in het kader van internationale
      overeenkomsten of andere verplichtingen door Nederland aangegaan.
    url: https://wetten.overheid.nl/BWBR0007956/2005-05-11#Artikel3
  - number: '4.1'
    text: Een dienstreis wordt op de door het bevoegd gezag aangegeven wijze uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0007956/2005-05-11#Artikel4
  - number: '4.2'
    text: Een dienstreis wordt met openbaar vervoer gemaakt, tenzij dienstvervoer beschikbaar en doelmatiger is.
    url: https://wetten.overheid.nl/BWBR0007956/2005-05-11#Artikel4
  - number: '4.3'
    text: |-
      Indien dienstvervoer niet beschikbaar en de plaats van bestemming doelmatig met openbaar vervoer bereikbaar is,
      wordt de dienstreis met openbaar vervoer gemaakt. Het bevoegd gezag kan de dienstreiziger toestaan de dienstreis
      met eigen vervoer te maken.
    url: https://wetten.overheid.nl/BWBR0007956/2005-05-11#Artikel4
  - number: '4.4'
    text: |-
      Indien dienstvervoer niet beschikbaar en de plaats van bestemming niet of niet doelmatig met openbaar vervoer
      bereikbaar is, wordt de dienstreis, indien de dienstreiziger hierin toestemt, met eigen vervoer gemaakt.
    url: https://wetten.overheid.nl/BWBR0007956/2005-05-11#Artikel4
  - number: '4.5'
    text: |-
      Voor de beoordeling of een plaats met openbaar vervoer bereikbaar is, kan het bevoegd gezag het gebruik van een
      taxi mede betrekken in zijn overwegingen.
    url: https://wetten.overheid.nl/BWBR0007956/2005-05-11#Artikel4
  - number: '4.6'
    text: |-
      Indien de dienstreis niet op de door het bevoegd gezag aangegeven wijze is uitgevoerd, heeft de dienstreiziger
      slechts aanspraak op de vergoedingen bij of krachtens dit besluit, waarop aanspraak bestaat, indien de dienstreis
      wel op de door het bevoegd gezag aangegeven wijze zou zijn uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0007956/2005-05-11#Artikel4
  - number: '5.1'
    text: |-
      Voor de vergoeding van reis- en verblijfkosten geldt dat de gebruikelijke ingang van een plaats van tewerkstelling
      het beginpunt en het eindpunt is van de dienstreis.
    url: https://wetten.overheid.nl/BWBR0007956/2005-05-11#Artikel5
  - number: '5.2'
    text: |-
      In afwijking van het eerste lid kan het bevoegd gezag de woning van de dienstreiziger of een andere plaats als
      beginpunt of eindpunt van de dienstreis aanmerken, tenzij op een reisdeel een plaats van tewerkstelling wordt
      bezocht.
    url: https://wetten.overheid.nl/BWBR0007956/2005-05-11#Artikel5
  - number: '6'
    text: |-
      Een dienstreis die in Nederland is begonnen en waarbij het reisgedeelte buiten Nederland beperkt is of waarbij
      de grensoverschrijding niet noodzakelijkerwijs leidt tot gebruik van maaltijden of logies in een gebied buiten
      Nederland, wordt voor de toepassing van dit besluit aangemerkt als een dienstreis binnen Nederland.
    url: https://wetten.overheid.nl/BWBR0007956/2005-05-11#Artikel6
  - number: '7.1'
    text: |-
      De voor een dienstreis noodzakelijk gemaakte reiskosten met openbaar vervoer worden vergoed, met inachtneming van
      bij ministeriële regeling te stellen regels.
    url: https://wetten.overheid.nl/BWBR0007956/2005-05-11#Artikel7
  - number: '7.2'
    text: |-
      De reisklasse waarin de dienstreiziger gerechtigd is voor rekening van het ministerie te reizen wordt bij
      ministeriële regeling vastgesteld.
    url: https://wetten.overheid.nl/BWBR0007956/2005-05-11#Artikel7
  - number: '7.3'
    text: |-
      Indien de dienstreiziger voor de dienstreis gebruik maakt van een niet van overheidswege verstrekt abonnement
      voor reizen met openbaar vervoer, worden de gedurende de looptijd van dat abonnement gemaakte dienstreizen vergoed
      op basis van het voltarief totdat het bij ministeriële regeling te bepalen omslagpunt is bereikt van de door de
      dienstreiziger gemaakte kosten en alle vanwege het ministerie ontvangen reiskostenvergoedingen over de looptijd van
      het abonnement.
    url: https://wetten.overheid.nl/BWBR0007956/2005-05-11#Artikel7
  - number: '8'
    text: |-
      De dienstreiziger die de dienstreis met dienstvervoer maakt, heeft aanspraak op vergoeding van de daarvoor
      noodzakelijk gemaakte kosten.
    url: https://wetten.overheid.nl/BWBR0007956/2005-05-11#Artikel8
  - number: '9.1'
    text: |-
      Indien dienstvervoer niet beschikbaar en openbaar vervoer niet mogelijk of niet doelmatig is en de dienstreiziger
      gebruik maakt van een eigen motorrijtuig, maakt deze aanspraak op de bij ministeriële regeling vast te stellen
      vergoeding.
    url: https://wetten.overheid.nl/BWBR0007956/2005-05-11#Artikel9
  - number: '9.2'
    text: |-
      Indien in bijzondere gevallen het gebruik van een eigen motorrijtuig voor het vervoer tussen de woning en een
      plaats van tewerkstelling noodzakelijk is voor het doelmatig uitvoeren van een op die dag voorkomende dienstreis,
      kan het bevoegd gezag daarvoor een vergoeding verlenen als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0007956/2005-05-11#Artikel9
  - number: '9.3'
    text: |-
      De vergoeding voor het gebruik van een eigen motorrijtuig strekt mede tot vergoeding van eventueel onverhaalbare
      schaden aan het motorrijtuig of de premie van een hierop betrekking hebbende schadeverzekering, voor zover de
      kilometervergoeding, bedoeld in het eerste en tweede lid, is verstrekt voor meer dan een bij ministeriële regeling
      vastgesteld aantal kilometers per jaar, alsmede tot vergoeding van de bij ministeriële regeling omschreven andere
      kosten.
    url: https://wetten.overheid.nl/BWBR0007956/2005-05-11#Artikel9
  - number: '10.1'
    text: |-
      Indien dienstvervoer niet beschikbaar is en de dienstreis doelmatig met openbaar vervoer kan worden gemaakt, maar
      de dienstreiziger er de voorkeur aan geeft gebruik te maken van een eigen motorrijtuig, maakt de dienstreiziger
      aanspraak op de bij ministeriële regeling vast te stellen vergoeding.
    url: https://wetten.overheid.nl/BWBR0007956/2005-05-11#Artikel10
  - number: '10.2'
    text: |-
      Indien dienstvervoer niet beschikbaar is en de dienstreis doelmatig met openbaar vervoer kan worden gemaakt, maar
      de dienstreiziger er de voorkeur aan geeft gebruik te maken van een eigen motorrijtuig te zamen met één of meer
      anderen, maakt de dienstreiziger die tevens bestuurder is aanspraak op de bij ministeriële regeling vast te stellen
      vergoeding.
    url: https://wetten.overheid.nl/BWBR0007956/2005-05-11#Artikel10
  - number: '11.1'
    text: |-
      Indien voor de dienstreis gebruik wordt gemaakt van een fiets, maakt de dienstreiziger aanspraak op de bij
      ministeriële regeling vast te stellen vergoeding.
    url: https://wetten.overheid.nl/BWBR0007956/2005-05-11#Artikel11
  - number: '11.2'
    text: |-
      Indien een deel van de dienstreis wordt uitgevoerd met een taxi of een gehuurd motorrijtuig worden de daaraan
      verbonden kosten vergoed, indien het gebruik daarvan naar het oordeel van het bevoegd gezag voor de dienstreis
      noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0007956/2005-05-11#Artikel11
  - number: '12.1'
    text: |-
      De voor een dienstreis noodzakelijk gemaakte verblijfkosten, waaronder zijn te verstaan de uitgaven voor
      maaltijden, logies en kleine uitgaven, worden vergoed volgens bij ministeriële regeling te stellen regels.
    url: https://wetten.overheid.nl/BWBR0007956/2005-05-11#Artikel12
  - number: '12.2'
    text: |-
      Voor de in verband met een dienstreis naar een gebied buiten Nederland noodzakelijk gemaakte andere kosten,
      waaronder die voor bijzondere kleding indien klimatologische of andere bijzondere omstandigheden in het te bezoeken
      land daartoe aanleiding geven, kan, volgens bij ministeriële regeling te bepalen regels, een tegemoetkoming worden
      verleend.
    url: https://wetten.overheid.nl/BWBR0007956/2005-05-11#Artikel12
  - number: '13.1'
    text: 'Geen aanspraak op vergoeding van verblijfkosten bestaat voor een dienstreis:'
    url: https://wetten.overheid.nl/BWBR0007956/2005-05-11#Artikel13
  - number: 13.1.a
    text: van korter dan vier uren;
    url: https://wetten.overheid.nl/BWBR0007956/2005-05-11#Artikel13
  - number: 13.1.b
    text: met het vliegtuig voor wat betreft de vliegduur;
    url: https://wetten.overheid.nl/BWBR0007956/2005-05-11#Artikel13
  - number: 13.1.c
    text: |-
      in verband met het verrichten van diensten als bedoeld in
      [artikel 54a, onderdeel b, van het Algemeen militair ambtenarenreglement][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel54a
    url: https://wetten.overheid.nl/BWBR0007956/2005-05-11#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: 54a
  - number: 13.1.d
    text: |-
      waarbij andere dan de normaal aan de functie verbonden activiteiten worden verricht, voor zover deze bij
      ministeriële regeling zijn aangewezen.
    url: https://wetten.overheid.nl/BWBR0007956/2005-05-11#Artikel13
  - number: '13.2'
    text: |-
      Geen aanspraak op vergoeding van kosten voor het gebruik van maaltijden of logies bestaat indien de dienstreiziger
      in de gelegenheid is om op de plaats van bestemming van de dienstreis gebruik te maken van maaltijden of logies
      van overheidswege of vanwege een buitenlandse mogendheid, een buitenlandse krijgsmacht of een internationale
      organisatie en daar geen gebruik van maakt.
    url: https://wetten.overheid.nl/BWBR0007956/2005-05-11#Artikel13
  - number: 13a
    text: |-
      De aanspraak op reiskosten voor het reizen tussen de woning en de plaats van tewerkstelling en terug van een
      militair, aangesteld bij het reservepersoneel, die ingevolge een oproep van het bevoegd gezag in werkelijke dienst
      moet komen, wordt berekend op de voet van dit besluit.
    url: https://wetten.overheid.nl/BWBR0007956/2005-05-11#Artikel13a
  - number: '14.1'
    text: |-
      Bij een detachering wordt in de gemaakte reiskosten van de dienstreiziger, alsmede de onvermijdbaar doorlopende
      kosten, tegemoet gekomen volgens het bij ministeriële regeling bepaalde, waarbij op vervangende wijze wordt
      voorzien in de voor de desbetreffende dienstreiziger geldende aanspraak op een tegemoetkoming in de kosten voor het
      reizen tussen de woning en de plaats van tewerkstelling.
    url: https://wetten.overheid.nl/BWBR0007956/2005-05-11#Artikel14
  - number: '14.2'
    text: |-
      Bij een detachering waarbij dagelijks reizen tussen de woning en de plaats van detachering niet mogelijk is, wordt
      in de verblijfkosten van de dienstreiziger voorzien volgens het bij ministeriële regeling bepaalde, waarbij voor
      wat betreft de dienstreis in Nederland zo mogelijk wordt voorzien in verblijf door of vanwege het ministerie,
      rekening houdende met een bij ministeriële regeling vast te stellen eigen bijdrage.
    url: https://wetten.overheid.nl/BWBR0007956/2005-05-11#Artikel14
  - number: '14.3'
    text: De plaats van detachering is een plaats van tewerkstelling.
    url: https://wetten.overheid.nl/BWBR0007956/2005-05-11#Artikel14
  - number: '14.4'
    text: 'Voor de toepassing van dit artikel wordt onder "een detachering" verstaan:'
    url: https://wetten.overheid.nl/BWBR0007956/2005-05-11#Artikel14
  - number: 14.4.a
    text: |-
      voor de dienstreis in of naar Nederland: de dienstverrichting gedurende een periode van vier weken of langer in
      of vanuit één bepaalde plaats, niet zijnde de plaats van tewerkstelling van waaruit de dienstreis is aangevangen,
      gedurende meer dan de helft van de voor de dienstreiziger gebruikelijke werkdagen;
    url: https://wetten.overheid.nl/BWBR0007956/2005-05-11#Artikel14
  - number: 14.4.b
    text: |-
      voor de dienstreis in of naar een gebied buiten Nederland: de dienstverrichting in of vanuit één bepaalde plaats
      buiten Nederland gedurende een periode van langer dan dertig dagen.
    url: https://wetten.overheid.nl/BWBR0007956/2005-05-11#Artikel14
  - number: '15.1'
    text: |-
      Het declareren en uitbetalen van de in dit besluit bedoelde vergoedingen geschiedt naar bij ministeriële regeling
      te stellen nadere regels.
    url: https://wetten.overheid.nl/BWBR0007956/2005-05-11#Artikel15
  - number: '15.2'
    text: |-
      Behoudens in uitzonderlijke situaties, vervalt de aanspraak op vergoeding, indien de dienstreiziger de
      reisdeclaratie niet heeft ingediend binnen dertien weken na de maand waarop de declaratie betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0007956/2005-05-11#Artikel15
  - number: 15a
    text: |-
      Van de bevoegdheid tot het vaststellen van ministeriële regelingen als bedoeld in [hoofdstuk 2][ref1] kan mandaat
      worden verleend aan de hoofddirecteur personeel van het Ministerie van Defensie.


      [ref1]: https://wetten.overheid.nl/BWBR0007956#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0007956/2005-05-11#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0007956
        hoofdstuk: '2'
  - number: '16'
    text: |-
      Onze Minister van Defensie kan [de artikelen 12][ref1] en [13][ref2] buiten toepassing laten of daarvan afwijken
      voor zover toepassing gelet op het belang van de vergoeding van verblijfkosten voor de dienstreiziger zal leiden
      tot een onbillijkheid van overwegende aard.


      [ref1]: https://wetten.overheid.nl/BWBR0007956#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0007956#Artikel13
    url: https://wetten.overheid.nl/BWBR0007956/2005-05-11#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0007956
        artikel: '12'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0007956
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '17'
    text: |-
      Voor een dienstreis die is aangevangen en nog niet is beëindigd voor de dag van inwerkingtreding van dit besluit,
      bestaat aanspraak op de voor de dienstreiziger meest gunstige bepalingen inzake de vergoeding van dienstreizen
      geldende vóór deze dag.
    url: https://wetten.overheid.nl/BWBR0007956/2005-05-11#Artikel17
  - number: '18.1'
    text: |-
      Degene, bedoeld in [artikel 1, onderdeel ][ref1], ten 1°, die in de periode van 12 maanden voorafgaande aan de
      inwerkingtreding van dit besluit als militair in de zin van het Besluit dienstreizen militairen op ten minste 40
      dagen tegen vergoeding dienstreizen binnen Nederland heeft gemaakt, heeft aanspraak op de bij ministeriële regeling
      vast te stellen tegemoetkoming.


      [ref1]: https://wetten.overheid.nl/BWBR0007956#Artikel1
    url: https://wetten.overheid.nl/BWBR0007956/2005-05-11#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0007956
        artikel: '1'
        hoofdstuk: '1'
  - number: '18.2'
    text: |-
      Degene die aanspraak had op de tegemoetkoming, bedoeld in artikel 17 van het Reisbesluit binnenland burgerlijke
      ambtenaren defensie, behoudt deze aanspraak onder dezelfde voorwaarden als neergelegd in genoemd artikel.
    url: https://wetten.overheid.nl/BWBR0007956/2005-05-11#Artikel18
  - number: '25.1'
    text: Het Besluit dienstreizen militairen wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0007956/2005-05-11#Artikel25
  - number: '25.2'
    text: Het Reisbesluit binnenland burgerlijke ambtenaren defensie wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0007956/2005-05-11#Artikel25
  - number: '25.3'
    text: Het Reisbesluit buitenland burgerlijke ambtenaren defensie wordt ingetrokken.
