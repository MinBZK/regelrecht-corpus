articles:
  - number: '2'
    text: |-
      1 De melding van degene die voornemens is de bodem te saneren dan wel handelingen te verrichten ten gevolge waarvan
      de verontreiniging van de bodem wordt verminderd of verplaatst, kan achterwege blijven:

      a. indien het bevoegde gezag heeft vastgesteld dat geen sprake is van een geval van ernstige verontreiniging, naar
      aanleiding van de resultaten van een bodemonderzoek op grond van:

      1°. een aanvraag om een omgevingsvergunning voor een bouwactiviteit als bedoeld in
      [artikel 2.1, eerste lid, onder a, van de Wet algemene bepalingen omgevingsrecht][ref1], voor
      zover daarbij krachtens [artikel 4.4 van het Besluit omgevingsrecht][ref2] in samenhang met
      [artikel 8, derde lid, van de Woningwet][ref3] en de gemeentelijke bouwverordening, bedoeld in dat artikel, de
      overlegging van een onderzoeksrapport inzake de gesteldheid van de bodem is vereist,

      2°. een aanvraag om een omgevingsvergunning voor een activiteit met betrekking tot een inrichting als bedoeld in
      [artikel 2.1, eerste lid, onder e, van de Wet algemene bepalingen omgevingsrecht][ref4],

      3°. een aanvraag om een ontheffing als bedoeld in [artikel 1.3 van de Wet milieubeheer][ref5] dan wel een mede op
      een activiteit waarvoor een zodanige ontheffing is vereist betrekking hebbende aanvraag om een omgevingsvergunning
      als bedoeld in [artikel 1.3a, eerste lid, van die wet][ref6], of

      4°. een melding als bedoeld in [artikel 8.41 van de Wet milieubeheer][ref7] op grond van een in
      [artikel 8.40 van die wet][ref8] bedoelde algemene maatregel van bestuur;

      b. indien het bevoegde gezag naar aanleiding van een melding als bedoeld in
      [artikel 42 van het Besluit bodemkwaliteit][ref9] heeft vastgesteld dat geen sprake is van een ernstig geval van
      verontreiniging.

      2 Het eerste lid, aanhef en onderdeel a, is niet van toepassing indien de in dat lid, aanhef en onderdeel a,
      bedoelde resultaten van het bodemonderzoek niet meer representatief zijn om te kunnen beoordelen of de bodem
      ernstig verontreinigd is. Hiervan is in ieder geval sprake indien er vijf jaren zijn verstreken na voltooiing van
      het bodemonderzoek.


