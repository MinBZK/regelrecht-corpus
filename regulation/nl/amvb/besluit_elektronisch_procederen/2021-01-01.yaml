    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0044275/2021-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: >-
      Dit besluit is van toepassing op het langs elektronische weg procederen in het civiele recht of in het
      bestuursrecht bij:


      a. de rechtbanken, de gerechtshoven en de Hoge Raad;


      b. de Afdeling bestuursrechtspraak van de Raad van State;


      c. de Centrale Raad van Beroep;


      d. het College van Beroep voor het bedrijfsleven.
    url: https://wetten.overheid.nl/BWBR0044275/2021-01-01#Artikel1
  - number: '2'
    text: >-
      1 Als bij een rechterlijke instantie in een categorie van zaken een verplichting tot elektronisch procederen
      geldt, wordt daartoe in een voor die rechterlijke instantie vastgesteld procesreglement een digitaal systeem voor
      gegevensverwerking aangewezen.


      2 Voor andere gevallen kan de rechterlijke instantie in een categorie van zaken de mogelijkheid van elektronisch
      procederen geheel of gedeeltelijk openstellen door daartoe in een voor die rechterlijke instantie vastgesteld
      procesreglement een digitaal systeem voor gegevensverwerking aan te wijzen.


      3 Een grosse kan niet via een digitaal systeem voor gegevensverwerking worden verzonden.
    url: https://wetten.overheid.nl/BWBR0044275/2021-01-01#Artikel2
  - number: '3'
    text: |-
      1 Een op grond van [artikel 2, eerste of tweede lid][ref1], aangewezen digitaal systeem voor gegevensverwerking
      voldoet aan de volgende eisen:

      a. de gebruiker van het systeem wordt geïdentificeerd;

      b. een procespartij, procesvertegenwoordiger of een bij de procedure betrokken derde die toegang verkrijgt tot het
      systeem anders dan via een koppeling met een ander digitaal systeem voor gegevensverwerking, wordt geauthenticeerd;

      c. na te gaan is wie wordt beschouwd als de indiener van een bericht;

      d. na te gaan is of een bericht is gewijzigd na het moment van verzending;

      e. na te gaan is op welk tijdstip een bericht door een rechterlijke instantie elektronisch is ontvangen,
      respectievelijk door de griffie elektronisch is verzonden;

      f. de berichten in het systeem, alsmede, indien van toepassing, het digitale dossier, zijn uitsluitend toegankelijk
      voor personen die daarvoor zijn geautoriseerd; en

      g. na te gaan is wanneer zich een verstoring in het digitale systeem voordoet of heeft voorgedaan.

      2 Toegang tot een aangewezen digitaal systeem voor gegevensverwerking via een koppeling met een ander digitaal
      systeem voor gegevensverwerking wordt slechts verleend als het betrouwbaarheidsniveau van dat systeem ten minste
      gelijkwaardig is aan het betrouwbaarheidsniveau van het aangewezen digitale systeem.


      [ref1]: https://wetten.overheid.nl/BWBR0044275#Artikel2
    url: https://wetten.overheid.nl/BWBR0044275/2021-01-01#Artikel3
    references:
      - id: ref1
