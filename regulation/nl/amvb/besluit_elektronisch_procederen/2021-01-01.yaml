    Juridische Zaken,


    Gelet op:


    De Afdeling advisering van de Raad van State gehoord (advies van 23 september 2020, nr. W16.20.0245/II);


    Gezien het nader rapport van Onze Minister voor Rechtsbescherming van 15 oktober 2020; nr. 3051637, directie
