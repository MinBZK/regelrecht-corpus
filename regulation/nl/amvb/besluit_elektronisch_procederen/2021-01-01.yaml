  - number: '6'
    text: >-
      1 Als een natuurlijk persoon over een burgerservicenummer beschikt, zijn de volgende personen bevoegd om dit
      nummer van de persoon die hij vertegenwoordigt of in wiens opdracht hij handelt, te verwerken ten behoeve van de
      procedure:


      a. degene die beroepsmatig rechtsbijstand verleent;


      b. de gerechtsdeurwaarder; of


      c. een andere gemachtigde in zaken waarin partijen in persoon kunnen procederen.


      2 De gerechtsdeurwaarder is tevens bevoegd om bij het indienen van de dagvaarding of de procesinleiding en bij het
      exploot van betekening het burgerservicenummer van de gedaagde of verweerder te verwerken.
    url: https://wetten.overheid.nl/BWBR0044275/2021-01-01#Artikel6
  - number: '7'
    text: |-
      Een onderneming of rechtspersoon die niet op grond van [artikel 5][ref1] of
      [6 van de Handelsregisterwet 2007][ref2] staat ingeschreven in het handelsregister is niet verplicht elektronisch
      te procederen tenzij de onderneming of rechtspersoon in de procedure wordt vertegenwoordigd door een derde die in
      Nederland verplicht is tot elektronisch procederen.


      [ref1]: https://wetten.overheid.nl/BWBR0021777#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0021777#Artikel6
    url: https://wetten.overheid.nl/BWBR0044275/2021-01-01#Artikel7
