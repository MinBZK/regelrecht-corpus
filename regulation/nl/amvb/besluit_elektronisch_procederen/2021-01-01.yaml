        bwb_id: BWBR0021777
        artikel: '6'
  - number: '8'
    text: >-
      Als op de laatste dag van een voor de indiener geldende termijn voor indiening van een bericht een niet aan hem
      toerekenbare verstoring plaatsvindt van de toegang tot het aangewezen digitale systeem voor gegevensverwerking, is
      een daardoor veroorzaakte overschrijding van de termijn verschoonbaar als het bericht uiterlijk wordt ingediend op
      de eerstvolgende dag na de dag waarop de indiener ermee bekend had kunnen zijn dat de verstoring is verholpen.
    url: https://wetten.overheid.nl/BWBR0044275/2021-01-01#Artikel8
