        artikel: '2'
  - number: '4'
    text: |-
      De authenticatie, bedoeld in [artikel 3, eerste lid, onder b][ref1], vindt plaats met een middel dat in het
      desbetreffende procesreglement is aangewezen en dat:

      a. is uitgegeven door:

      1°. de overheid;

      2°. een daartoe onder toezicht van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties staande organisatie;
      of

      3°. de Nederlandse orde van advocaten; en

      b. uitgaat van tweefactorauthenticatie of voldoet aan het betrouwbaarheidsniveau substantieel of hoog.


      [ref1]: https://wetten.overheid.nl/BWBR0044275#Artikel3
    url: https://wetten.overheid.nl/BWBR0044275/2021-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0044275
        artikel: '3'
  - number: '5'
    text: |-
      1 Tenzij de wet anders bepaalt, ondertekent degene die op grond van het
      [Wetboek van Burgerlijke Rechtsvordering][ref1] of de [Algemene wet bestuursrecht][ref2] een stuk
      dient te ondertekenen, het stuk voorafgaand aan de indiening, verzending of plaatsing in het aangewezen
      systeem. Hierbij kan gebruik worden gemaakt van een gewone elektronische handtekening, tenzij bij
      procesreglement een gekwalificeerde of geavanceerde elektronische handtekening is voorgeschreven.
      [Artikel 15a van Boek 3 van het Burgerlijk Wetboek][ref3] is van toepassing.

      2 In afwijking van het eerste lid, geldt een stuk dat langs elektronische weg is ingediend
      in een daartoe aangewezen digitaal systeem voor gegevensverwerking door een op persoonsniveau
      geauthenticeerde procespartij, procesvertegenwoordiger of bij de procedure betrokken derde, als
      ondertekend door die persoon. Dit is niet van toepassing op de ondertekening van akten als bedoeld in
      [artikel 156 van het Wetboek van Burgerlijke Rechtsvordering][ref4] en van documenten in een arbitrageprocedure
      ingevolge het [Vierde Boek van het Wetboek van Burgerlijke Rechtsvordering][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0001827
      [ref2]: https://wetten.overheid.nl/BWBR0005537
      [ref3]: https://wetten.overheid.nl/BWBR0005291#Artikel15a
      [ref4]: https://wetten.overheid.nl/BWBR0001827#Artikel156
      [ref5]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0044275/2021-01-01#Artikel5
