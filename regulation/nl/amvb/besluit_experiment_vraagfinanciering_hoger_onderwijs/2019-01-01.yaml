  - number: '5'
    text: |-
      1 Onze Minister evalueert uiterlijk in 2021 het experiment.

      2 Onze Minister evalueert het experiment tussentijds in 2018.

      3 Onze Minister kan zich in het kader van de evaluatie, bedoeld in het eerste en het tweede lid, laten bijstaan
      door een van Onze Minister onafhankelijke deskundige.

      4 Onze Minister stelt de inspectie, het accreditatieorgaan, bedoeld in
      [artikel 1.1, onderdeel p, van de wet][ref1] en de Commissie doelmatigheid hoger onderwijs, bedoeld
      in het [Instellingsbesluit Commissie Doelmatigheid Hoger Onderwijs][ref2], in de gelegenheid hun
      zienswijzen naar voren te brengen naar aanleiding van een ontwerp van een verslag als bedoeld in
      [artikel 1.7a, vijfde lid, van de wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1.1
      [ref2]: https://wetten.overheid.nl/BWBR0026019
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel1.7a
