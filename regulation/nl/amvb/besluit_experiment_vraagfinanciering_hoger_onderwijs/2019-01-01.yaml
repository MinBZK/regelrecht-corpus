        artikel: 1.7a
  - number: '6'
    text: |-
      1 Onze Minister evalueert het experiment in ieder geval op basis van de volgende criteria:

      a. de mate waarin het experiment leidt tot een vraaggerichter en flexibeler aanbod;

      b. de mate waarin het aanbod van goede kwaliteit is en tegen redelijke prijzen wordt aangeboden;

      c. de mate waarin de aspecten, bedoeld onder a en b, leiden tot een toename van studenten aan deeltijdse en duale
      opleidingen;

      d. de mate waarin de aspecten, bedoeld onder a en b, leiden tot een toename van gediplomeerden;

      e. de mate waarin de aspecten, bedoeld onder a en b, effect hebben op de studievoortgang, zich uitend in de mate
      waarin studenten succesvol zijn in het behalen van het aantal punten verbonden aan een module, en de mate waarin
      modules worden gestapeld;

      f. de mate waarin de kosten toenemen, waaronder de kosten voor het Rijk en voor werkgevers;

      g. de mate waarin werkgevers en werkenden bijdragen aan de kosten van het collegegeld; en

      h. de mate waarin de wijze waarop het experiment is vormgegeven doelmatig is, mede in relatie tot de
      administratieve lasten.

      2 Bij de evaluatie zal aandacht worden geschonken aan de volgende effecten:

      a. effecten op ontwikkeling van aard en inrichting van de opleidingen, waaronder het leveren van maatwerk, de
      aansluiting bij de vraag van werkgevers en werkenden en de toename of afname van het aantal opleidingen;

      b. effecten op omvang van het aanbod;

      c. effecten op de kwaliteit van opleidingen onder meer op basis van gegevens over studenttevredenheid en
      werkgeverstevredenheid en op basis van accreditatie als bedoeld in [artikel 1.1, onderdeel q van de wet][ref1], en
      oordelen van de Inspectie;

      d. effecten op de arbeidsmarktpositie van studenten; en

      e. effecten op de omvang van private investeringen in opleidingen.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1.1
    url: https://wetten.overheid.nl/BWBR0037862/2019-01-01#Artikel6
