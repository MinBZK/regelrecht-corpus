  - number: '13'
    text: |-
      1 Onze Minister kan het experiment bij een deelnemende instelling op verzoek van die instelling geheel of
      gedeeltelijk beëindigen, indien:

      a. bij die instelling de belangstelling voor het volgen van modules bij studenten sterk afneemt; of

      b. de financiële haalbaarheid van het aanbieden van modules bij die instelling sterk afwijkt van de verwachtingen;

      2 Onze Minister kan het experiment bij een deelnemende instelling ook ongevraagd geheel of gedeeltelijk beëindigen,
      indien:

      a. de desbetreffende deelnemende instelling de voorschriften van dit besluit niet naar behoren naleeft;

      b. de diplomagerichtheid van het onderwijs bij die deelnemende instelling sterk afneemt;

      c. door voortzetting bij die instelling afbreuk zou worden gedaan aan de kwaliteit of toegankelijkheid van het
      hoger onderwijs; of

      d. de op grond van de [Subsidieregeling vraagfinanciering hoger onderwijs][ref1] beschikbare financiële middelen
      niet toereikend zijn om het experiment bij die instelling voort te zetten.


      [ref1]: https://wetten.overheid.nl/BWBR0037056
