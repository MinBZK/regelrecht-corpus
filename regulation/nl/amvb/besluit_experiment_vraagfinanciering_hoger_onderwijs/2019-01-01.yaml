        artikel: '2'
  - number: '2'
    text: |-
      1 Een student die voldoet aan de voorwaarden, bedoeld in [artikel 3, tweede tot en met vierde lid][ref1], van de
      Subsidieregeling vraagfinanciering hoger onderwijs, kan bij een hogeschool die in aanmerking komt voor een voucher,
      aanspraak maken op collegegeldverlaging met maximaal € 1.250 in verband met het volgen van een module.

      2 Een student die twee modules in hetzelfde studiejaar wenst te volgen, laat zich voor de eerste module
      uitschrijven voordat inschrijving voor de tweede module kan plaatsvinden.

      3 Een student als bedoeld in het eerste lid verliest de aanspraak op wettelijk collegegeld, bedoeld in
      [artikel 7.45a van de wet][ref2], en de aanspraak op vrijstelling dan wel vermindering van betaling van collegegeld
      als bedoeld in [artikel 7.48 van de wet][ref3].

      4 Het bestuur van een deelnemende instelling kan een student als bedoeld in het eerste en tweede lid in verband met
      de inschrijving voor een module collegegeld in rekening brengen tot een maximumbedrag van € 3.750.

      5 Het bestuur van een bekostigde deelnemende instelling is vrij in de keuze van de vestigingsplaats van een
      toegelaten opleiding.

      6 Het experiment duurt van 1 september 2016 tot en met 31 augustus 2024.


      [ref1]: https://wetten.overheid.nl/BWBR0037862#Artikel3
