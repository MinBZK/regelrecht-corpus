  - number: '7'
    text: |-
      1 Aan het experiment kan uitsluitend worden deelgenomen door een instelling voor hoger onderwijs, die aanspraak
      maakt op een voucher.

      2 Tot het experiment worden uitsluitend toegelaten de opleidingen in verband waarmee een voucher als bedoeld in het
      eerste lid door Onze Minister is verleend.
    url: https://wetten.overheid.nl/BWBR0037862/2019-01-01#Artikel7
  - number: '8'
    text: |-
      1 Het bestuur van een deelnemende instelling sluit met een student die zich wenst in te schrijven voor een module
      bij een toegelaten opleiding, een onderwijsovereenkomst waarin in ieder geval de duur van de overeenkomst, het
      onderwijsprogramma voor de betrokken student, de hoogte van het daarmee verbonden collegegeld, de wijze van
      betaling en de gronden voor terugvordering worden vastgelegd.

      2 Het bestuur van een deelnemende instelling maakt in de onderwijs- en examenregeling bekend op welke wijze de
      onderwijsovereenkomst, bedoeld in het eerste lid, wordt gesloten en welke wederzijdse rechten en verplichtingen
      daarin in ieder geval worden vastgelegd.
    url: https://wetten.overheid.nl/BWBR0037862/2019-01-01#Artikel8
  - number: '9'
    text: |-
      1 Van 2017 tot en met 2021 rapporteert het bestuur van een deelnemende instelling jaarlijks aan Onze Minister over
      de uitvoering van het experiment in het voorafgaande kalenderjaar.

      2 In 2021 rapporteert het bestuur van een deelnemende instelling aan Onze Minister over de uitvoering van het
      experiment in het tijdvak 2016 tot en met 2020.

      3 Het bestuur van de deelnemende instelling zendt jaarlijks de volgende gegevens aan Onze Minister:

      a. de instroom van studenten met collegegeldverlaging in de toegelaten opleidingen;

      b. de gemiddelde verblijfsduur van studenten met collegegeldverlaging in de toegelaten opleidingen;

      c. de hoogte van het gevraagde collegegeld en van andere eigen bijdragen ten behoeve van het aanbieden van modules
      bij de toegelaten opleidingen;

      d. de hoogte van het gevraagde instellingscollegegeld voor studenten die aan de toegelaten opleidingen studeren
      zonder collegegeldverlaging;

      e. het aantal vouchers per student in de toegelaten opleidingen;

      f. de tijdstippen waarop studenten aan de toegelaten opleidingen een beroep hebben gedaan op collegegeldverlaging;

      g. het aantal studenten met collegegeldverlaging dat de toegelaten opleidingen met een diploma heeft afgesloten;

      h. het aantal studenten met collegegeldverlaging dat het totale aantal studiepunten behorend bij de vouchers heeft
      behaald.

      4 De gegevens, bedoeld in het derde lid, worden voorzien van een accountantsverklaring die voldoet aan de eisen van
      de [Verordening gedrags- en beroepsregels accountants][ref1].

      5 Het bestuur van een bekostigde deelnemende instelling neemt de rapportages en gegevens, bedoeld in het eerste,
      tweede en derde lid, op in het verslag, bedoeld in [artikel 2.9 van de wet][ref2]. Het bestuur van een andere
      deelnemende instelling voor hoger onderwijs neemt de rapportages en gegevens, bedoeld in het eerste, tweede en
      derde lid, op in het verslag, bedoeld in [artikel 1.12, derde lid, van de wet][ref3].

      6 Het bestuur van een deelnemende instelling verstrekt desgevraagd andere informatie aan Onze Minister in verband
      met de deelname aan en monitoring, evaluatie en effectmeting van het experiment.


      [ref1]: https://wetten.overheid.nl/BWBR0034635
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel2.9
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel1.12
