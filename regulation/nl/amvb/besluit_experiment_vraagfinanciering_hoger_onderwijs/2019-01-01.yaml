articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. *wet:* [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1];

      b. *Onze Minister:* Onze Minister van Onderwijs, Cultuur en Wetenschap;

      c. *Inspectie:* de inspectie, bedoeld in de [Wet op het onderwijstoezicht][ref2];

      d. *instelling voor hoger onderwijs:* instelling voor hoger onderwijs als bedoeld in
      [artikel 1.2, onderdelen a of b, van de wet][ref3];

      e. *bekostigde instelling voor hoger onderwijs:* bekostigde instelling voor hoger onderwijs als bedoeld in
      [artikel 1.8 van de wet][ref4];

      f. *bestuur:* instellingsbestuur als bedoeld in [artikel 1.1, onderdeel j, van de wet][ref5];

      g. *hoger beroepsonderwijs:* hoger onderwijs als bedoeld in [artikel 1.1, onderdeel d, van de wet][ref6];

      h. *opleiding:* associate degree-opleiding als bedoeld in [artikel 7.3a, tweede lid, onderdeel b][ref7] en
      bacheloropleiding als bedoeld in artikel 7.3a, tweede lid, onderdeel a, van de wet;

      i.

      j. *deeltijds:* deeltijds als bedoeld in [artikel 7.7, eerste lid, van de wet][ref8];

      k. *duaal:* duaal als bedoeld in [artikel 7.7, tweede lid, van de wet][ref9];

      l. *studiepunt:* studiepunt als bedoeld in [artikel 7.4, eerste lid, van de wet][ref10];

      m. *onderwijs- en examenregeling:* onderwijs- en examenregeling als bedoeld in [artikel 7.13 van de wet][ref11];

      n. *experiment:* experiment als bedoeld in [artikel 2][ref12];

      o. *deelnemende instelling:* instelling voor hoger onderwijs als bedoeld in [artikel 7, eerste lid][ref13];

      p. *toegelaten opleiding:* opleiding als bedoeld in [artikel 7, tweede lid][ref14];

      q.

      r. *voucher:* subsidie als bedoeld in [artikel 3 van de Subsidieregeling vraagfinanciering hoger onderwijs][ref15];

      s. *module:* hoger onderwijs als bedoeld in
      [artikel 3 van de Subsidieregeling vraagfinanciering hoger onderwijs][ref16];

      t. *instellingscollegegeld:* instellingscollegegeld als bedoeld in [artikel 7.46 van de wet][ref17];

      u. *collegegeldverlaging:* collegegeldverlaging, bedoeld in [artikel 2, eerste lid][ref18].


