  - number: '12'
    text: |-
      1 Het bestuur van een bekostigde deelnemende instelling stelt het deel medezeggenschapsraad dat uit en door de
      studenten is gekozen in de gelegenheid te adviseren over de hoogte van het collegegeld.

      2 Indien het bestuur van een bekostigde deelnemende instelling op grond van
      [artikel 10.16a, eerste lid, van de wet][ref1] heeft besloten dat de [Wet op de ondernemingsraden][ref2] met
      uitzondering van [hoofdstuk VIIB][ref3] van toepassing is, stelt het bestuur de gezamenlijke vergadering van de
      ondernemingsraad in de gelegenheid te adviseren over de hoogte van het collegegeld.

      3 Het bestuur van een bekostigde deelnemende instelling stelt de medezeggenschapsraad in de gelegenheid te
      adviseren over de inrichting van het experiment.

      4 Indien het bestuur van een bekostigde deelnemende instelling op grond van
      [artikel 10.16a, eerste lid, van de wet][ref4] heeft besloten dat de [Wet op de ondernemingsraden][ref5] met
      uitzondering van [hoofdstuk VIIB][ref6] van toepassing is, stelt het bestuur de gezamenlijke vergadering van de
      ondernemingsraad in de gelegenheid te adviseren over de inrichting van het experiment.

      5 Het bestuur van een deelnemende instelling voert het experiment cohortsgewijs uit.

      6 Onze Minister kan een deelnemende instelling in verband met het experiment andere, op de individuele instelling
      voor hoger onderwijs of op een categorie instellingen voor hoger onderwijs afgestemde, verplichtingen opleggen.


