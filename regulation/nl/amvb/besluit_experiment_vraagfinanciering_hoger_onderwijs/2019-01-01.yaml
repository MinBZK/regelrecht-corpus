  - number: '10'
    text: |-
      1 Het bestuur van een bekostigde deelnemende instelling is verplicht tijdig zodanige informatie aan studenten en
      aanstaande studenten te verstrekken over de deelname aan en inrichting van het experiment dat het hen in staat
      stelt zich voorafgaand aan de inschrijving een goed oordeel te vormen over de gevolgen daarvan, in het bijzonder in
      verband met het verlies van de aanspraak op wettelijk collegegeld.

      2 Het bestuur van een bekostigde deelnemende instelling maakt voor 1 september 2016 in de onderwijs- en
      examenregeling bekend op welke opleidingen en op welke wijze dit besluit van toepassing is.
    url: https://wetten.overheid.nl/BWBR0037862/2019-01-01#Artikel10
  - number: '11'
    text: |-
      1 Het bestuur van een bekostigde deelnemende instelling zorgt ervoor dat een uitschrijving als bedoeld
      in [artikel 2, tweede lid][ref1], en de jaarlijkse uitschrijving per 31 augustus in verband met
      [artikel 7.32, vierde lid, eerste volzin, van de wet][ref2] geen gevolgen hebben voor de rechten van de student,
      bedoeld in [artikel 7.34 van de wet][ref3], die verband houden met het volgen en afronden van een module.

      2 Een bestuur van een deelnemende instelling zorgt ervoor dat in geval van geheel of gedeeltelijke beëindiging
      van het experiment bij de instelling de onderwijscontinuïteit voor de betrokken studenten gedurende een redelijke
      termijn is gewaarborgd.


      [ref1]: https://wetten.overheid.nl/BWBR0037862#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7.32
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel7.34
