  - number: '3'
    text: |-
      Het doel van het experiment is te onderzoeken of een combinatie van

      a. de vrijheid van vestigingsplaats van een opleiding;

      b. het bijzondere collegegeldregime, bedoeld in [artikel 2][ref1];

      c. subsidieverlening als bedoeld in de [Subsidieregeling vraagfinanciering hoger onderwijs][ref2]; en

      d. een modulair aanbod van deeltijdse of duale opleidingen in het hoger beroepsonderwijs;

      leidt tot een vraaggerichter en aantrekkelijker aanbod van hoger onderwijs van goede kwaliteit tegen redelijke
      prijzen, voor zowel werkenden, werkgevers als werkzoekenden, en daardoor tot een hogere deelname aan en diplomering
      in het hoger beroepsonderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0037862#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037056
