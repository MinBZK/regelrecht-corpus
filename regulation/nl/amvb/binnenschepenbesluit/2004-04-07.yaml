  - number: '45'
    text: |-
      Bij verbouwing van een bestaand schip en bij vervanging van onderdelen of van de uitrusting van een bestaand schip
      zijn de regelen van [bijlage II][ref1] en III onverkort van toepassing op hetgeen verbouwd of vervangen wordt.


      [ref1]: https://wetten.overheid.nl/BWBR0004196
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel45
    references:
