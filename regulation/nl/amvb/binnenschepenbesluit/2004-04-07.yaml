  - number: '42.3'
    text: |-
      Bij het onderzoek van bestaande passagiersschepen, veerboten en zeilende passagiersschepen zijn met betrekking tot
      de regelen van de [artikelen 7.02, eerste en tweede lid, en 7.04 van bijlage III][ref1] de overgangsbepalingen van
      de [artikelen 11.07 en 11.08 van bijlage III][ref2] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004196
      [ref2]: https://wetten.overheid.nl/BWBR0004196
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel42
    references:
