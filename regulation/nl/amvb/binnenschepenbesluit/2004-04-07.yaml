  - number: 1.1.r
    text: |-
      veerboot: schip dat is gebouwd of bestemd voor het bedrijfsmatig vervoer van meer dan 12 personen buiten de
      bemanning alsook van voertuigen op meer dan twee wielen, en dat een bootdienst onderhoudt tussen twee of meer
      aanlegplaatsen gelegen aan - de Dollard,
        - de Eems,
        - de Waddenzee, met inbegrip van de verbindingen met de Noordzee, of
        - de Westerschelde en de zeemonding daarvan, met inbegrip van de waterwegen tussen Zeeuwsch-Vlaanderen enerzijds en
