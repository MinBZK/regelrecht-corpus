        bwb_id: BWBR0004196
  - number: '43'
    text: |-
      Bij het onderzoek van bestaande passagiersschepen, veerboten en zeilende passagiersschepen zijn gedurende vijf
      jaren vanaf de datum van het eerste onderzoek de regelen opgenomen in de eerste kolom van de tabel van artikel
      11.02 van [bijlage III][ref1] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004196
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0004196
  - number: '44'
    text: |-
      Bij het onderzoek van bestaande passagiersschepen zijn gedurende één jaar vanaf de datum van het
      eerste onderzoek, bedoeld in [artikel 34][ref1], de regelen van [bijlage III][ref2], niet genoemd in
      [de artikelen 42, eerste en tweede lid][ref3], en [43][ref4], niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004196#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0004196
      [ref3]: https://wetten.overheid.nl/BWBR0004196#Artikel42
