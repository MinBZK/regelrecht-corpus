preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Verkeer en Waterstaat van 7 januari 1987, nr. PJ/S 31.977, Directoraat-
    Generaal Scheepvaart en Maritieme Zaken, gedaan mede namens de Staatssecretaris van Sociale Zaken en
    Werkgelegenheid;

    Na overleg met Onze Ministers van Landbouw en Visserij en van Welzijn, Volksgezondheid en Cultuur;

    Gelet op de artikelen 1, derde lid, 5, eerste en derde lid, 10, eerste lid, 13, eerste lid, 27, zesde lid, en 58,
    eerste lid, van de Binnenschepenwet (Stb. 1981, 678);

    Gelet op de Richtlijn van de Raad van de Europese Gemeenschappen van 20 januari 1976 (76/135/EEG) inzake de
    wederzijdse erkenning van scheepsattesten voor binnenschepen (Pb EG L 21), gewijzigd bij de Richtlijn van die Raad
    van 23 november 1978 (78/1016/EEG, Pb EG L 349);

    Mede gelet op de Richtlijn van de Raad van de Europese Gemeenschappen van 4 oktober 1982 (82/714/EEG) tot
    vaststelling van de technische voorschriften voor binnenschepen (Pb EG L 301);

    De Raad van State gehoord (advies van 11 maart 1987, nr. W 09.87.0016);

    Gezien het nader rapport van Onze Minister van Verkeer en Waterstaat van 9 juli 1987, nr. S/J 30.879/87,
    Directoraat-Generaal Scheepvaart en Maritieme Zaken, uitgebracht mede namens de Staatssecretaris van Sociale zaken
    en Werkgelegenheid;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#ArtikelAanhef
