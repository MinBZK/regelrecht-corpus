        bwb_id: BWBR0004196
  - number: '46.1'
    text: |-
      Het hoofd van de scheepvaartinspectie kan niet toepassing van regelen toestaan bij het eindigen van de termijnen,
      bedoeld in de [ artikelen 37][ref1], [38][ref2], [39][ref3], [41][ref4], [43][ref5] en [44][ref6] en bij toepassing
      van de [artikelen 36][ref7], [40][ref8], [42][ref9] en [45][ref10], indien toepassing van deze regelen in de
      praktijk niet uitvoerbaar blijkt of onevenredig hoge kosten met zich meebrengt.


