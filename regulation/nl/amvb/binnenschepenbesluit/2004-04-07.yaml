        artikel: '56'
  - number: 2a
    text: |-
      De categorieën van schepen, bedoeld in [artikel 4, eerste lid, onder ][ref1] zijn:


      [ref1]: https://wetten.overheid.nl/BWBR0003443#Artikel4
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0003443
        artikel: '4'
  - number: 2a.a
    text: vrachtschepen, sleepboten en duwboten, ongeacht de binnenwateren waarop zij zich bevinden; en
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel2a
  - number: 2a.b
    text: passagiersschepen, voor zover zij zich bevinden op de binnenwateren van de zones 3 en 4.
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel2a
  - number: '3'
    text: |-
      Bij dit besluit behoren de volgende bijlagen: [bijlage I][ref1]: lijst van binnenwateren van het communautaire
      net, ingedeeld in de zones 1, 2, 3 en 4; [bijlage II][ref2]: technische regelen voor vrachtschepen, sleepboten
      en duwboten; [bijlage III][ref3]: technische regelen voor passagiersschepen; [bijlage IV][ref4]: regelen
      met betrekking tot arbeid aan boord van schepen; [bijlage V][ref5]: technische regelen voor veerboten;
      [bijlage VI][ref6]: technische regelen voor rijksvaartuigen; [bijlage VII][ref7]: technische regelen voor zeilende
      passagiersschepen; bijlage VIII: technische regelen voor bunkerstations.


      [ref1]: https://wetten.overheid.nl/BWBR0004196
      [ref2]: https://wetten.overheid.nl/BWBR0004196
      [ref3]: https://wetten.overheid.nl/BWBR0004196
      [ref4]: https://wetten.overheid.nl/BWBR0004196
      [ref5]: https://wetten.overheid.nl/BWBR0004196
      [ref6]: https://wetten.overheid.nl/BWBR0004196
      [ref7]: https://wetten.overheid.nl/BWBR0004196
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0004196
      - id: ref2
        bwb_id: BWBR0004196
      - id: ref3
        bwb_id: BWBR0004196
      - id: ref4
        bwb_id: BWBR0004196
      - id: ref5
        bwb_id: BWBR0004196
      - id: ref6
        bwb_id: BWBR0004196
      - id: ref7
        bwb_id: BWBR0004196
  - number: '4.1'
    text: 'Het hoofd van de scheepvaartinspectie geeft certificaten af voor:'
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel4
  - number: 4.1.a
    text: vrachtschepen;
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel4
  - number: 4.1.b
    text: sleepboten en duwboten;
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel4
  - number: 4.1.c
    text: passagiersschepen;
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel4
  - number: 4.1.d
    text: veerboten;
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel4
  - number: 4.1.e
    text: rijksvaartuigen;
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel4
  - number: 4.1.f
    text: zeilende passagiersschepen;
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel4
  - number: 4.1.g
    text: bunkerstations.
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel4
  - number: '4.2'
    text: |-
      Het hoofd van de scheepvaartinspectie geeft communautaire aanvullende certificaten af voor vrachtschepen,
      sleepboten en duwboten, die voorzien zijn van een scheepspatent als bedoeld in de Herziene Rijnvaartakte.
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel4
  - number: '4.3'
    text: |-
      Met uitzondering van het bepaalde in [artikel 10][ref1], is het in dit besluit bepaalde met betrekking tot het
      certificaat en het communautaire certificaat van overeenkomstige toepassing op het communautaire aanvullende
      certificaat.


      [ref1]: https://wetten.overheid.nl/BWBR0004196#Artikel10
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0004196
        artikel: '10'
        paragraaf: '2'
  - number: '5.1'
    text: De aanvraag voor een certificaat van onderzoek wordt ingediend door de eigenaar van het schip.
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel5
  - number: '5.2'
    text: |-
      Bij de aanvraag worden de tekeningen van bouw en inrichting van het schip alsmede, indien hiertoe naar het oordeel
      van het hoofd van de scheepvaartinspectie bijzondere redenen bestaan, het rekenkundig bewijs van de sterkte van de
      romp overgelegd.
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel5
  - number: '5.3'
    text: |-
      Indien het schip is onderzocht door of gebouwd onder toezicht van een erkend onderzoekingsbureau, wordt ook de
      verklaring van dat bureau inzake het onderzoek of de bouw overgelegd.
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel5
  - number: '5.4'
    text: |-
      Indien ingevolge de [artikelen 23][ref1] of [24][ref2] een hellingproef is vereist, worden de uitkomsten van die
      proef overgelegd alsmede de gegevens over de stabiliteit van het schip bij verschillende beladingstoestanden.


      [ref1]: https://wetten.overheid.nl/BWBR0004196#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0004196#Artikel24
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0004196
        artikel: '23'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0004196
        artikel: '24'
        paragraaf: '3'
  - number: '6'
    text: |-
      Een certificaat wordt afgegeven nadat een schip met gunstig gevolg is onderzocht overeenkomstig het gestelde in
      [de artikelen 19 tot en met 23][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004196#Artikel19
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0004196
        artikel: '19'
        paragraaf: '3'
  - number: '7'
    text: Voor vrachtschepen, sleepboten en duwboten wordt het certificaat als communautair certificaat afgegeven.
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel7
  - number: '8'
    text: |-
      Het communautaire certificaat voor vrachtschepen, sleepboten en duwboten, die in een andere Lid-Staat van
      de Europese Gemeenschappen dan Nederland of in een van de overige Staten die partij zijn bij de Overeenkomst
      betreffende de Europese Economische Ruimte teboekstaan of daar hun thuishaven hebben, of waarvan de eigenaar in de
      desbetreffende staat woonachtig is, wordt slechts afgegeven indien die staat of een bevoegde onderzoeksinstantie
      uit die Staat daarom heeft verzocht.
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel8
  - number: '9'
    text: 'In het certificaat worden vermeld:'
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel9
  - number: 9.a
    text: |-
      de voornaamste gegevens omtrent het schip, de binnenwateren waarvoor het geschikt is bevonden, alsmede of het in
      [artikel 5, tweede lid, van de Binnenschepenwet][ref1] bedoelde onderzoek is ingesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0003443#Artikel5
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003443
        artikel: '5'
  - number: 9.b
    text: |-
      de regelen die bij het gebruik van het schip in acht moeten worden genomen, alsmede in voorkomende gevallen de
      toegestane afwijkingen en te treffen voorzieningen met vermelding van de binnenwateren en de periode, waar deze
      voor gelden en
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel9
  - number: 9.c
    text: de geldigheidsduur, de verlenging en de vernieuwing van de geldigheidsduur van het certificaat.
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel9
  - number: '10.1'
    text: |-
      Het certificaat en het communautaire certificaat, alsmede het communautaire aanvullende certificaat in samenhang
      met een scheepspatent als bedoeld in de Herziene Rijnvaartakte zijn geldig voor de bestemming en voor de
      binnenwateren, bedoeld in [bijlage I][ref1], waarvoor het schip blijkens het certificaat geschikt is bevonden, voor
      zover verenigbaar met het bij of krachtens de Herziene Rijnvaartakte bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0004196
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0004196
  - number: '10.2'
    text: |-
      Een communautair certificaat dat geldig is voor de binnenwateren van zone 3, is tevens geldig voor de in Nederland
      gelegen binnenwateren van zone 2.
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel10
  - number: '11.1'
    text: |-
      Na een bijzonder onderzoek in een geval als bedoeld in [artikel 24, eerste lid][ref1], wordt indien het schip
      aan de bij of krachtens de wet gestelde regelen voldoet door het hoofd van de scheepvaartinspectie een nieuw
      certificaat afgegeven dan wel de geldigheidsduur van het certificaat vernieuwd.


      [ref1]: https://wetten.overheid.nl/BWBR0004196#Artikel24
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0004196
        artikel: '24'
        paragraaf: '3'
  - number: '11.2'
    text: |-
      Indien het een schip betreft met een communautair certificaat dat in een andere Lid-Staat van de Europese
      Gemeenschappen dan Nederland of in een van de overige staten die partij zijn bij de Overeenkomst betreffende de
      Europese Economische Ruimte is afgegeven of waarvan de geldigheidsduur in de desbetreffende Staat is vernieuwd,
      wordt de vernieuwing van het communautaire certificaat of de vernieuwing van de geldigheidsduur van het
      communautaire certificaat binnen een maand ter kennis gebracht van de autoriteit die het communautaire certificaat
      heeft afgegeven of de geldigheidsduur daarvan heeft vernieuwd.
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel11
  - number: '12.1'
    text: |-
      Bij het verstrijken van de geldigheidsduur van een certificaat kan de geldigheid daarvan worden vernieuwd nadat een
      aanvraag daartoe is ingediend en een onderzoek van het schip met gunstig gevolg heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel12
  - number: '12.2'
    text: |-
      Het onderzoek kan beperkt blijven tot een onderzoek van de constructie, de werktuigen, de ketels en andere
      drukvaten, alsmede van de uitrusting en de gehele romp van het schip.
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel12
  - number: '13'
    text: |-
      In bijzondere gevallen kan het hoofd van de scheepvaartinspectie zonder onderzoek van het schip de geldigheidsduur
      van een certificaat verlengen.
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel13
  - number: '14'
    text: |-
      De geldigheidsduur, de verlenging en de vernieuwing van de geldigheidsduur van het certificaat worden vastgesteld
      volgens het bepaalde in [artikel 6 van de Binnenschepenwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003443#Artikel6
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0003443
        artikel: '6'
  - number: '15.1'
    text: |-
      Indien een certificaat onleesbaar of onbruikbaar is geworden, wordt na terugzending van het certificaat aan het
      hoofd van de scheepvaartinspectie tegen betaling van door Onze Minister vast te stellen kosten een duplicaat van
      het certificaat verstrekt.
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel15
  - number: '15.2'
    text: |-
      Het duplicaat wordt tegen betaling van door Onze Minister vast te stellen kosten eveneens verstrekt wanneer het
      certificaat verloren is gegaan en hiervan mededeling is gedaan aan het hoofd van de scheepvaartinspectie.
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel15
  - number: '16'
    text: |-
      De certificaten worden door of vanwege het hoofd van de scheepvaartinspectie van een volgnummer voorzien en
      geregistreerd.
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel16
  - number: '17.1'
    text: Van de certificaten worden afschriften bewaard.
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel17
  - number: '17.2'
    text: Op de afschriften worden de aantekeningen en wijzigingen vermeld die op de certificaten voorkomen.
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel17
  - number: '17.3'
    text: Op de afschriften worden tevens de vervangingen en de ongeldigverklaringen van de certificaten aangetekend.
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel17
  - number: '18'
    text: |-
      Behoudens weigering op grond van het bepaalde bij of krachtens de [Wet openbaarheid van bestuur][ref1] wordt door
      het hoofd van de scheepvaartinspectie op verzoek hetzij inzage van het afschrift van een certificaat verleend,
      hetzij een uittreksel of gewaarmerkt afschrift van een certificaat verschaft tegen betaling van door Onze Minister
      vast te stellen kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0005252
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0005252
  - number: '19'
    text: |-
      Bij het onderzoek of bijzonder onderzoek van schepen wordt nagegaan of het schip voldoet aan de voor dat schip van
      toepassing zijnde regelen, zoals opgenomen in de bij dit besluit behorende bijlagen.
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel19
  - number: '20.1'
    text: |-
      Mits voorzieningen zijn getroffen, die naar het redelijk oordeel van het hoofd van de scheepvaartinspectie
      voldoende waarborg bieden voor de veiligheid van het schip en de opvarenden, dan wel naar het
      redelijk oordeel van het hoofd van de scheepvaartinspectie in overeenstemming met de ingevolge
      [artikel 27, eerste lid, van de Binnenschepenwet][ref1], door Onze Minister van Sociale Zaken en Werkgelegenheid
      aangewezen ambtenaren voldoende waarborg bieden voor de veiligheid, de gezondheid en het welzijn in verband met de
      arbeid aan boord, zijn regelen van [bijlagen II][ref2] en [III][ref3] niet van toepassing bij het onderzoek van:


      [ref1]: https://wetten.overheid.nl/BWBR0003443#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0004196
      [ref3]: https://wetten.overheid.nl/BWBR0004196
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0003443
        artikel: '27'
      - id: ref2
        bwb_id: BWBR0004196
      - id: ref3
        bwb_id: BWBR0004196
  - number: 20.1.a
    text: schepen uitsluitend bestemd voor het varen in Nederland in een beperkt gebied of in havengebieden;
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel20
  - number: 20.1.b
    text: |-
      schepen uitsluitend bestemd voor het varen op in Nederland gelegen binnenwateren die niet via een ander binnenwater
      in verbinding staan met het waterwegennet van Duitsland of België en
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel20
  - number: 20.1.c
    text: |-
      schepen met een laadvermogen van 350 ton of minder, waarvan de kiel voor 1 januari 1950 is gelegd en die
      uitsluitend bestemd zijn voor het varen op in Nederland gelegen binnenwateren.
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel20
  - number: '20.2'
    text: |-
      In afwijking van het bepaalde in het eerste lid zijn voor schepen, niet zijnde bestaande schepen, de regelen van
      [hoofdstuk 11][ref1] van [bijlage II][ref2] onverkort van toepassing behoudens het bepaalde in [bijlage III][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0004196
      [ref2]: https://wetten.overheid.nl/BWBR0004196
      [ref3]: https://wetten.overheid.nl/BWBR0004196
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0004196
      - id: ref2
        bwb_id: BWBR0004196
      - id: ref3
        bwb_id: BWBR0004196
  - number: '20.3'
    text: |-
      Met betrekking tot vrachtschepen, sleepboten en duwboten wordt toepassing van het eerste lid ter kennis gebracht
      van de Commissie van de Europese Gemeenschappen.
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel20
  - number: '21.1'
    text: |-
      Indien uit een door een erkend onderzoekingsbureau afgegeven verklaring blijkt, dat een schip voldoet aan de
      krachtens [artikel 5, eerste lid, van de Binnenschepenwet][ref1] voor dat schip van toepassing zijnde regelen,
      zoals opgenomen in de bij dit besluit behorende bijlagen, kan van een onderzoek als bedoeld in dat lid worden
      afgezien.


      [ref1]: https://wetten.overheid.nl/BWBR0003443#Artikel5
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0003443
        artikel: '5'
  - number: '21.2'
    text: |-
      Van een erkend onderzoekingsbureau is sprake indien het is aangewezen op grond van
      [artikel 27, vijfde lid, van de Binnenschepenwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003443#Artikel27
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0003443
        artikel: '27'
  - number: '21.3'
    text: |-
      De aanwijzing wordt ter kennis gebracht van de Commissie van de Europese Gemeenschappen en van de Lid-Staten van
      de Europese Gemeenschappen en van de overige staten die partij zijn bij de Overeenkomst betreffende de Europese
      Economische Ruimte.
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel21
  - number: '21.4'
    text: De aanwijzing kan voor bepaalde of onbepaalde tijd plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel21
  - number: '21.5'
    text: Bij koninklijk besluit kan de aanwijzing te allen tijde worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel21
  - number: '22.1'
    text: |-
      Voor een onderzoek van het schip wordt het door de eigenaar of diens vertegenwoordiger onbeladen, gereinigd en
      voorzien van de voorgeschreven uitrusting aangeboden.
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel22
  - number: '22.2'
    text: |-
      Indien het hoofd van de scheepvaartinspectie om bijzondere redenen een onderzoek van het schip aan de buitenzijde
      redelijkerwijs nodig oordeelt, wordt het door de eigenaar of diens vertegenwoordiger zodanig drooggezet dat de
      gehele romp aan de buitenzijde kan worden onderzocht.
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel22
  - number: '22.3'
    text: |-
      De eigenaar van het schip of diens vertegenwoordiger verleent verdere medewerking aan het onderzoek, onder
      meer door de toegang te vergemakkelijken tot de delen van de romp en tot de installaties, die niet of moeilijk
      toegankelijk of zichtbaar zijn, door personeel beschikbaar te stellen en door proefvaarten te houden.
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel22
  - number: '23.1'
    text: |-
      Voor de beoordeling van de stabiliteit van een passagiersschip, een veerboot of een zeilend passagiersschip wordt
      het schip - indien het een eerste onderzoek betreft - aan een hellingproef onderworpen.
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel23
  - number: '23.2'
    text: |-
      Indien de uitkomsten van de hellingproef van een zusterschip van een passagiersschip, een veerboot of een zeilend
      passagiersschip beschikbaar zijn en daaraan voldoende stabiliteitsgegevens kunnen worden ontleend, kan het hoofd
      van de scheepvaartinspectie toestaan dat een hellingproef achterwege blijft.
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel23
  - number: '23.3'
    text: |-
      Voor de beoordeling van de stabiliteit van vrachtschepen, sleepboten, duwboten, rijksvaartuigen en bunkerstations
      kan het hoofd van de scheepvaartinspectie bepalen dat een hellingproef wordt gehouden, indien de inrichting of de
      bijzondere bestemming van het schip daartoe aanleiding geeft.
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel23
  - number: '23.4'
    text: |-
      De hellingproef wordt door of namens de eigenaar gehouden in aanwezigheid van de daartoe bevoegde ambtenaar van
      de scheepvaartinspectie.
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel23
  - number: '24.1'
    text: |-
      Bij belangrijke schade, herstellingen, verbouwingen of andere ingrijpende wijzigingen en bij vermoeden van ernstige
      gebreken aan een schip met een certificaat of een communautair certificaat wordt een bijzonder onderzoek ingesteld.
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel24
  - number: '24.2'
    text: |-
      Het bijzonder onderzoek omvat een onderzoek van de constructie, de werktuigen en uitrusting van het schip, voor
      zover deze betrokken zijn bij de schade, de herstelling, de verbouwing, de wijziging of de gebreken. Tevens kan de
      stabiliteit worden beoordeeld.
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel24
  - number: '24.3'
    text: |-
      Indien het een bijzonder onderzoek van een passagiersschip, een veerboot of een zeilend passagiersschip betreft kan
      het hoofd van de scheepvaartinspectie bepalen dat een hellingproef wordt gehouden.
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel24
  - number: '25.1'
    text: |-
      Nadat een onderzoek of bijzonder onderzoek is beëindigd, dient de toestand van het schip en de uitrusting te worden
      gehandhaafd in overeenstemming met de vermeldingen in het certificaat.
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel25
  - number: '25.2'
    text: |-
      Het schip mag slechts gebruikt worden voor de bestemming en op de binnenwateren, waarvoor het blijkens het
      certificaat geldig of geschikt is bevonden.
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel25
  - number: '25.3'
    text: |-
      Bij het gebruik van het schip dienen in acht genomen te worden het vrijboord en de regelen ten aanzien van de
      belading, het stuwen, de stabiliteit en het gebruik, die in het certificaat zijn aangegeven voor de binnenwateren
      waarop door het schip wordt gevaren.
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel25
  - number: '25.4'
    text: |-
      Aan boord van een passagiersschip, een veerboot of een zeilend passagiersschip mogen niet meer passagiers worden
      toegelaten dan het ten hoogste toegestane aantal volgens het certificaat.
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel25
  - number: '25.5'
    text: |-
      Bij het gebruik van het schip dient de in het certificaat vermelde uitrusting in deugdelijke staat op de daarvoor
      bestemde plaatsen aan boord te zijn.
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel25
  - number: '26'
    text: |-
      Ter bevordering van de veiligheid, de gezondheid en het welzijn in verband met de arbeid aan boord van schepen bij
      gebruik op de binnenwateren
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel26
  - number: 26.a
    text: |-
      moeten de inrichting en uitrusting van die schepen voldoen aan de regelen, opgenomen in [de hoofdstukken 8][ref1]
      en [11][ref2] van [bijlage II][ref3] alsmede aan door Onze Ministers aangewezen andere regelen, opgenomen in
      [bijlage II][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0004196
      [ref2]: https://wetten.overheid.nl/BWBR0004196
      [ref3]: https://wetten.overheid.nl/BWBR0004196
      [ref4]: https://wetten.overheid.nl/BWBR0004196
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0004196
      - id: ref2
        bwb_id: BWBR0004196
      - id: ref3
        bwb_id: BWBR0004196
      - id: ref4
        bwb_id: BWBR0004196
  - number: 26.b
    text: |-
      moeten met betrekking tot de arbeid aan boord van die schepen de regelen in acht genomen worden, die zijn opgenomen
      in [bijlage IV][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004196
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0004196
  - number: '27.1'
    text: |-
      De toezichthoudende ambtenaar die vaststelt dat aan boord van een schip een voor dat schip vereist document van
      deugdelijkheid ontbreekt of niet geldig is, dan wel dat de op het document vermelde gegevens afwijken van de
      werkelijke toestand, stelt het hoofd van de scheepvaartinspectie op de hoogte van zijn bevindingen.
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel27
  - number: '27.2'
    text: |-
      De eigenaar van het schip of diens vertegenwoordiger dient deze situatie te verhelpen en richt zich daarbij naar
      eventueel door het hoofd van de scheepvaartinspectie voorgeschreven maatregelen, te nemen in overeenstemming met
      de ingevolge [artikel 28, eerste lid, van de Binnenschepenwet][ref1], door Onze Minister van Sociale Zaken en
      Werkgelegenheid aangewezen ambtenaren, indien het de veiligheid, de gezondheid en het welzijn in verband met de
      arbeid aan boord betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0003443#Artikel28
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0003443
        artikel: '28'
  - number: '27.3'
    text: |-
      De ambtenaar van de scheepvaartinspectie of de ingevolge [artikel 9, eerste lid, van de Binnenschepenwet][ref1],
      door Onze Minister van Sociale Zaken en Werkgelegenheid aangewezen ambtenaren, die de vaart met een schip
      onderbreekt omdat de staat waarin het schip zich bevindt zodanig is dat de veiligheid van het schip en de
      opvarenden onmiddellijk gevaar loopt, handelt op de in het eerste lid bedoelde wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0003443#Artikel9
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0003443
        artikel: '9'
  - number: '27.4'
    text: |-
      Het hoofd van de scheepvaartinspectie beslist zo spoedig mogelijk of een bijzonder onderzoek zal worden ingesteld.
      Hij kan ook maatregelen voorschrijven ertoe strekkende de redenen voor het onderbreken van de vaart weg te nemen
      dan wel maatregelen voorschrijven op grond waarvan het schip zonder gevaar, eventueel na beëindiging van zijn reis,
      kan doorvaren tot de plaats waar het zal worden onderzocht of hersteld. Indien het de veiligheid, de gezondheid en
      het welzijn in verband met de arbeid aan boord betreft, neemt het hoofd van de scheepvaartinspectie zijn beslissing
      in overeenstemming met de ingevolge [artikel 9, eerste lid, van de Binnenschepenwet][ref1], door Onze Minister van
      Sociale Zaken en Werkgelegenheid aangewezen ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0003443#Artikel9
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0003443
        artikel: '9'
  - number: '27.5'
    text: |-
      Indien het een in het buitenland teboekstaand schip betreft dat is of moet zijn voorzien van een communautair
      certificaat of van een scheepsattest als bedoeld in [richtlijn 76/135/EEG](31976L0135), doet het hoofd van
      de scheepvaartinspectie de bevindingen toekomen aan de instantie die het communautaire certificaat of het
      scheepsattest heeft afgegeven of had moeten afgeven.
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel27
  - number: '28.1'
    text: |-
      Scheepsattesten afgegeven ingevolge [richtlijn 76/135/EEG](31976L0135), worden erkend, voor zover het scheepsattest
      niet meer dan vijf jaren te voren is afgegeven of verlengd en de geldigheidsduur niet verstreken is.
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel28
  - number: '28.2'
    text: |-
      De erkenning van scheepsattesten voor vrachtschepen, sleepboten en duwboten geldt voor de vaart op alle in
      Nederland gelegen binnenwateren.
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel28
  - number: '28.3'
    text: |-
      De erkenning van scheepsattesten voor passagiersschepen en zeilende passagiersschepen geldt voor de in
      Nederland gelegen zones 3 en 4 en, indien het schip tevens voldoet aan de desbetreffende regelen voor zone 2 van
      [bijlage III][ref1], voor de in Nederland gelegen zone 2.


      [ref1]: https://wetten.overheid.nl/BWBR0004196
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0004196
  - number: '28.4'
    text: |-
      Het derde lid is van overeenkomstige toepassing op veerboten, met dien verstande dat de erkenning voor de in
      [artikel 1, eerste lid, onder ][ref1], genoemde wateren van zone 2 slechts geldt, indien het schip tevens voldoet
      aan de desbetreffende regelen van [bijlage V][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004196#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0004196
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0004196
        artikel: '1'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0004196
  - number: '29.1'
    text: |-
      Onze Minister kan voor de toepassing van [artikel 4, eerste lid, onder ][ref1] een document erkennen dat door een
      bevoegde autoriteit van een andere staat - niet zijnde een Lid-Staat van de Europese Gemeenschappen of een van de
      overige Staten die partij zijn bij de Overeenkomst betreffende de Europese Economische Ruimte - is afgegeven ten
      bewijze van de deugdelijkheid van een aldaar teboekstaand schip.


      [ref1]: https://wetten.overheid.nl/BWBR0003443#Artikel4
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0003443
        artikel: '4'
  - number: '29.2'
    text: |-
      Erkenning van het in het eerste lid bedoelde document van deugdelijkheid vindt plaats indien het naar het oordeel
      van Onze Minister voldoende waarborg biedt voor de deugdelijkheid van het schip.
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel29
  - number: '30'
    text: |-
      Een in [artikel 29][ref1] genoemd document van deugdelijkheid wordt erkend voor in Nederland gelegen binnenwateren
      van de zones 2, 3 of 4 naar gelang het document naar het oordeel van Onze Minister voldoende waarborg biedt voor de
      veiligheid van de vaart op die wateren.


      [ref1]: https://wetten.overheid.nl/BWBR0004196#Artikel29
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0004196
        artikel: '29'
        paragraaf: '5'
  - number: '31'
    text: De erkenning kan betrekking hebben op een enkel document van deugdelijkheid of op een groep gelijke documenten.
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel31
  - number: 31a.1
    text: |-
      Met het certificaat ten behoeve van passagiersschepen, veerboten, rijksvaartuigen, zeilende passagiersschepen
      of bunkerstations wordt gelijkgesteld een document van deugdelijkheid, afgegeven door een onafhankelijke
      keuringsinstelling in een andere lidstaat in de Europese Unie dan wel in een staat die partij is bij de
      overeenkomst inzake de Europese Economische Ruimte, welk document is afgegeven op basis van onderzoekingen die ten
      minste aan gelijkwaardige eisen voldoen.
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel31a
  - number: 31a.2
    text: |-
      Met de in de [bijlagen III][ref1], [V][ref2], [VI][ref3], [VII][ref4] en VIII van dit besluit vastgestelde
      technische eisen worden gelijkgesteld daaraan gelijkwaardige technische eisen vastgesteld door of vanwege een
      lidstaat van de Europese Unie dan wel door of vanwege een staat die partij is bij de overeenkomst inzake de
      Europese Economische Ruimte.


      [ref1]: https://wetten.overheid.nl/BWBR0004196
      [ref2]: https://wetten.overheid.nl/BWBR0004196
      [ref3]: https://wetten.overheid.nl/BWBR0004196
      [ref4]: https://wetten.overheid.nl/BWBR0004196
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel31a
    references:
      - id: ref1
        bwb_id: BWBR0004196
      - id: ref2
        bwb_id: BWBR0004196
      - id: ref3
        bwb_id: BWBR0004196
      - id: ref4
        bwb_id: BWBR0004196
  - number: '32'
    text: |-
      Onze Minister in overeenstemming met de Minister van Sociale Zaken en Werkgelegenheid stelt een tijdschema vast
      voor het eerste onderzoek van bestaande vrachtschepen, sleepboten en duwboten.
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel32
  - number: '33.1'
    text: |-
      Het in [artikel 32][ref1] bedoelde tijdschema omvat een periode gerekend vanaf één jaar na de datum van
      inwerkingtreding van dit besluit en eindigend op 1 juli 1998.


      [ref1]: https://wetten.overheid.nl/BWBR0004196#Artikel32
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0004196
        artikel: '32'
        paragraaf: '6'
  - number: '33.2'
    text: |-
      Het tijdschema kan met een periode van zeven jaren worden verlengd voor schepen waarvan de bouw op 1 januari 1970
      is begonnen of voltooid en die bestemd zijn om uitsluitend in Nederland te worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel33
  - number: '33.3'
    text: |-
      Het tijdschema wordt ter kennis gebracht van de Commissie van de Europese Gemeenschappen en van de Lid-Staten van
      de Europese Gemeenschappen en van de overige Staten die partij zijn bij de Overeenkomst betreffende de Europese
      Economische Ruimte.
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel33
  - number: '34'
    text: |-
      Onze Minister in overeenstemming met de Minister van Sociale Zaken en Werkgelegenheid stelt voor het eerste
      onderzoek van bestaande passagiersschepen een afzonderlijk tijdschema vast.
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel34
  - number: '35'
    text: Het eerste onderzoek van bunkerstations die op 1 februari 2002 in bedrijf zijn vindt plaats voor 1 februari 2007.
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel35
  - number: '36'
    text: |-
      Mits voorzieningen zijn getroffen, die naar het redelijk oordeel van het hoofd van de scheepvaartinspectie
      voldoende waarborg bieden voor de veiligheid van het schip en de opvarenden, dan wel naar het
      redelijk oordeel van het hoofd van de scheepvaartinspectie in overeenstemming met de ingevolge
      [artikel 27, eerste lid, van de Binnenschepenwet][ref1], door Onze Minister van Sociale Zaken en Werkgelegenheid
      aangewezen ambtenaren voldoende waarborg bieden voor de veiligheid, de gezondheid en het welzijn in verband met de
      arbeid aan boord, zijn bij het onderzoek van bestaande vrachtschepen, sleepboten en duwboten niet van toepassing:


      [ref1]: https://wetten.overheid.nl/BWBR0003443#Artikel27
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0003443
        artikel: '27'
  - number: 36.a
    text: |-
      de regelen opgenomen in de tweede kolom van de tabel van artikel 13.01 van [bijlage II][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004196
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0004196
  - number: 36.b
    text: |-
      de regelen van artikel 7.03, zesde lid, van [bijlage II][ref1], mits wordt voldaan aan het gestelde in artikel
      13.02 van [bijlage II][ref2] en behoudens het bepaalde in [artikel 37][ref3]; en


      [ref1]: https://wetten.overheid.nl/BWBR0004196
      [ref2]: https://wetten.overheid.nl/BWBR0004196
      [ref3]: https://wetten.overheid.nl/BWBR0004196#Artikel37
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0004196
      - id: ref2
        bwb_id: BWBR0004196
      - id: ref3
        bwb_id: BWBR0004196
        artikel: '37'
        paragraaf: '6'
  - number: 36.c
    text: |-
      de regelen van artikel 11.16 van [bijlage II][ref1] met betrekking tot het hekwerk, mits wordt voldaan aan het
      gestelde in artikel 13.03 van [bijlage II][ref2] en behoudens het bepaalde in [artikel 37][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0004196
      [ref2]: https://wetten.overheid.nl/BWBR0004196
      [ref3]: https://wetten.overheid.nl/BWBR0004196#Artikel37
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0004196
      - id: ref2
        bwb_id: BWBR0004196
      - id: ref3
        bwb_id: BWBR0004196
        artikel: '37'
        paragraaf: '6'
  - number: '37'
    text: |-
      Bij het onderzoek van bestaande vrachtschepen, sleepboten en duwboten zijn gedurende vijf jaren vanaf de datum van
      het eerste onderzoek, bedoeld in [artikel 32][ref1], niet van toepassing de regelen opgenomen in de eerste kolom
      van de tabel van artikel 13.01 van [bijlage II][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004196#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0004196
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0004196
        artikel: '32'
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0004196
  - number: '38'
    text: |-
      Bij het onderzoek van bestaande vrachtschepen, sleepboten en duwboten zijn gedurende drie jaren vanaf de datum van
      het eerste onderzoek, bedoeld in [artikel 32][ref1], niet van toepassing de regelen van de artikelen 8.01 tot en
      met 8.14 van [bijlage II][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004196#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0004196
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0004196
        artikel: '32'
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0004196
  - number: '39'
    text: |-
      Bij het onderzoek van bestaande vrachtschepen, sleepboten en duwboten zijn gedurende één jaar vanaf de datum van
      het eerste onderzoek, bedoeld in [artikel 32][ref1], niet van toepassing de regelen van [bijlage II][ref2], niet
      genoemd in [de artikelen 36][ref3], [37][ref4] en [38][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0004196#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0004196
      [ref3]: https://wetten.overheid.nl/BWBR0004196#Artikel36
      [ref4]: https://wetten.overheid.nl/BWBR0004196#Artikel37
      [ref5]: https://wetten.overheid.nl/BWBR0004196#Artikel38
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0004196
        artikel: '32'
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0004196
      - id: ref3
        bwb_id: BWBR0004196
        artikel: '36'
        paragraaf: '6'
      - id: ref4
        bwb_id: BWBR0004196
        artikel: '37'
        paragraaf: '6'
      - id: ref5
        bwb_id: BWBR0004196
        artikel: '38'
        paragraaf: '6'
  - number: '40'
    text: |-
      In afwijking van het bepaalde in [de artikelen 36 tot en met 39][ref1] zijn de regelen van artikel 11.01, tweede,
      vierde en vijfde lid, van bijlage II bij het onderzoek van bestaande schepen van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004196#Artikel36
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0004196
        artikel: '36'
        paragraaf: '6'
  - number: '41'
    text: |-
      In afwijking van het bepaalde in [artikel 39][ref1] zijn bij het onderzoek van bestaande vrachtschepen, sleepboten
      en duwboten, die op 1 juni 1985 zijn ingericht voor het voeren van het schip door een persoon met behulp van radar,
      de regelen van [hoofdstuk 9][ref2] van [bijlage II][ref3] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004196#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0004196
      [ref3]: https://wetten.overheid.nl/BWBR0004196
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0004196
        artikel: '39'
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0004196
      - id: ref3
        bwb_id: BWBR0004196
  - number: '42.1'
    text: |-
      Bij het onderzoek van bestaande passagiersschepen, veerboten en zeilende passagiersschepen zijn de
      regelen opgenomen in de tweede kolom van de tabel van [artikel 11.02 van bijlage III][ref1] niet van
      toepassing, mits voorzieningen zijn getroffen, die naar het redelijk oordeel van het hoofd van de
      scheepvaartinspectie voldoende waarborg bieden voor de veiligheid van het schip en de opvarenden, dan wel
      naar het redelijk oordeel van het hoofd van de scheepvaartinspectie in overeenstemming met de ingevolge
      [artikel 27, eerste lid, van de Binnenschepenwet][ref2], door Onze Minister van Sociale Zaken en Werkgelegenheid
      aangewezen ambtenaren voldoende waarborg bieden voor de veiligheid, de gezondheid en het welzijn in verband met de
      arbeid aan boord en met inachtneming van het bepaalde in het volgende lid.


      [ref1]: https://wetten.overheid.nl/BWBR0004196
      [ref2]: https://wetten.overheid.nl/BWBR0003443#Artikel27
