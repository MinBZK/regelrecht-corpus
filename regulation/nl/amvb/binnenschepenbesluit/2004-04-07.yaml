  - number: '47'
    text: |-
      Bij regeling van Onze Minister in overeenstemming met de Minister van Sociale Zaken en Werkgelegenheid, dan wel van
      de Minister van Sociale Zaken en Werkgelegenheid in overeenstemming met Onze Minister kunnen nadere regelen worden
      gegeven ter uitvoering van dit besluit.
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel47
  - number: '48'
    text: Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel48
  - number: '49'
    text: Dit besluit kan worden aangehaald als "Binnenschepenbesluit".
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel49
