    text: 'In de bij dit besluit behorende bijlagen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel1
  - number: 1.2.a
    text: 'schip: binnenschip of zeeschip;'
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel1
  - number: 1.2.b
    text: |-
      motorvrachtschip: vrachtschip gebouwd om door middel van zijn eigen mechanische voortstuwingsmiddelen zelfstandig
      te varen, niet zijnde een motortankschip;
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel1
  - number: 1.2.c
    text: |-
      motortankschip: schip met een laadvermogen van 15 ton of meer, dat is bestemd voor het bedrijfsmatig vervoer van
      goederen in vaste tanks en gebouwd om door middel van zijn eigen mechanische voortstuwingsmiddelen zelfstandig
      te varen;
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel1
  - number: 1.2.d
    text: 'motorschip: motorvrachtschip of motortankschip;'
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel1
  - number: 1.2.e
    text: 'sleepboot: schip dat is gebouwd om te slepen;'
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel1
  - number: 1.2.f
    text: 'duwboot: schip dat is gebouwd om te duwen;'
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel1
  - number: 1.2.g
    text: 'sleep-duwboot: schip dat is gebouwd om te slepen en te duwen;'
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel1
  - number: 1.2.h
    text: |-
      sleepvrachtschip: vrachtschip niet zijnde een sleeptankschip, dat is gebouwd om te worden gesleept en dat - niet is
      voorzien van eigen mechanische voortstuwingsmiddelen of
        - wel voorzien is van eigen mechanische voortstuwingsmiddelen, die slechts verplaatsingen over kleine afstanden
      toelaten;
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel1
  - number: 1.2.i
    text: |-
      sleeptankschip: schip met een laadvermogen van 15 ton of meer, dat is bestemd voor het bedrijfsmatig vervoer
      van goederen in vaste tanks, gebouwd om te worden gesleept en dat - niet is voorzien van eigen mechanische
      voortstuwingsmiddelen of
        - wel is voorzien van eigen mechanische voortstuwingsmiddelen, die slechts verplaatsingen over kleine afstanden
      toelaten;
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel1
  - number: 1.2.k
    text: 'sleepschip: sleepvrachtschip of sleeptankschip;'
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel1
  - number: 1.2.l
    text: |-
      vrachtduwbak: vrachtschip niet zijnde een tankduwbak, dat is gebouwd of geschikt gemaakt om te worden geduwd en dat
        - niet is voorzien van eigen mechanische voortstuwingsmiddelen of
        - wel is voorzien van eigen mechanische voortstuwingsmiddelen, die slechts verplaatsingen over kleine afstanden
      toelaten;
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel1
  - number: 1.2.m
    text: |-
      tankduwbak: schip met een laadvermogen van 15 ton of meer, dat is bestemd voor het bedrijfsmatig vervoer van
      goederen in vaste tanks, gebouwd of geschikt gemaakt om te worden geduwd en dat - niet is voorzien van eigen
      mechanische voortstuwingsmiddelen of
        - wel is voorzien van eigen mechanische voortstuwingsmiddelen, die slechts verplaatsingen over kleine afstanden
      toelaten;
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel1
  - number: 1.2.n
    text: |-
      zeeschipbak: vrachtduwbak of tankduwbak, gebouwd om aan boord van een zeeschip te worden vervoerd en om de
      binnenwateren te bevaren;
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel1
  - number: 1.2.o
    text: 'duwbak: vrachtduwbak, tankduwbak of zeeschipbak;'
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel1
  - number: 1.2.p
    text: |-
      passagiersschip: schip dat is gebouwd of bestemd voor het bedrijfsmatig vervoer van meer dan twaalf personen
      buiten de bemanning, niet zijnde een veerboot en niet ingericht om hoofdzakelijk door middel van zeilen te worden
      voortbewogen;
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel1
  - number: 1.2.q
    text: |-
      drijvend werktuig: schip met mechanische installaties, dat is bestemd om op de binnenwateren te worden gebruikt,
      zoals een baggermolen, een elevator, een bok, een kraan;
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel1
  - number: 1.2.r
    text: |-
      drijvende inrichting: drijvend bouwsel dat niet is bestemd om in de regel te worden verplaatst, zoals een drijvende
      zweminrichting, een droogdok, een landingsbrug, een drijvend botenhuis;
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel1
  - number: 1.2.s
    text: |-
      drijvend voorwerp: vlot, bouwsel, samenstel of voorwerp dat is geschikt om te varen, niet zijnde een schip als
      hiervoor bedoeld, een drijvend werktuig of drijvende inrichting;
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel1
  - number: 1.2.t
    text: 'stuurhuis: ruimte waar de voor het voeren van het schip noodzakelijke bedieningsinrichtingen zijn opgesteld;'
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel1
  - number: 1.2.u
    text: 'machinekamer: ruimte waar de voortstuwingswerktuigen, de hulpwerktuigen of beiden zijn opgesteld;'
    url: https://wetten.overheid.nl/BWBR0004196/2004-04-07#Artikel1
  - number: 1.2.v
    text: |-
      verblijf: ruimte die bestemd is voor het gebruik door de gewoonlijk aan boord verblijvende personen of passagiers,
      met inbegrip van keukens, provisiekamers, toiletten, wasgelegenheden, washokken, portalen en gangen, met
