  - number: '46.2'
    text: |-
      De in het eerste lid bedoelde niet toepassing van regelen wordt slechts toegestaan, mits voorzieningen zijn
      getroffen, die naar het redelijk oordeel van het hoofd van de scheepvaartinspectie voldoende waarborg bieden
      voor de veiligheid van het schip en de opvarenden, dan wel naar het redelijk oordeel van het hoofd van de
      scheepvaartinspectie in overeenstemming met de ingevolge [artikel 27, eerste lid, van de Binnenschepenwet][ref1],
      door Onze Minister van Sociale Zaken en Werkgelegenheid aangewezen ambtenaren voldoende waarborg bieden voor de
      veiligheid, de gezondheid en het welzijn in verband met de arbeid aan boord.


      [ref1]: https://wetten.overheid.nl/BWBR0003443#Artikel27
