        artikel: '40'
  - number: 5b
    text: |-
      1 Onze Minister kan ter bescherming van het milieu:

      a. aan een omgevingsvergunning als bedoeld in
      [artikel 2.1, eerste lid, aanhef en onder e, van de Wet algemene bepalingen omgevingsrecht][ref1], een vergunning
      als bedoeld in [artikel 40, tweede lid, eerste volzin, van de Mijnbouwwet][ref2] en een instemming voorschriften
      verbinden om aanvullende eisen te stellen;

      b. een bepaling als bedoeld in de [artikelen 10 tot en met 19][ref3],
      [21 tot en met 61, eerste lid][ref4], en [62 tot en met 65][ref5], niet van toepassing verklaren
      en daarbij beperkingen of voorwaarden stellen aan een omgevingsvergunning als bedoeld in
      [artikel 2.1, eerste lid, aanhef en onder e, van de Wet algemene bepalingen omgevingsrecht][ref6], een vergunning
      als bedoeld in [artikel 40, tweede lid, eerste volzin, van de Mijnbouwwet][ref7] of een instemming.

      2 [Artikel 20, eerste en tweede lid][ref8], en [artikel 61, tweede lid][ref9], zijn van overeenkomstige toepassing.
      Artikel 20, derde en vierde lid, is niet van toepassing.


