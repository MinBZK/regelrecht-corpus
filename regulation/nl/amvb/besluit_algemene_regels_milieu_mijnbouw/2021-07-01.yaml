  - number: '4'
    text: |-
      1 Dit besluit is van toepassing op:

      a. mobiele installaties op land met bijbehorend terrein;

      b. mobiele installaties in oppervlaktewater;

      c. onderzeese installaties.

      2 Dit besluit is niet van toepassing op:

      a. een mobiele installatie op een locatie die gelegen is in een gevoelig gebied als bedoeld onder a, b, of d van
      punt 1 van onderdeel A van de [bijlage, behorende bij het Besluit milieueffectrapportage](onbekend);

      b. een mobiele installatie op land indien uit de berekening van het plaatsgebonden risico als
      bedoeld in [artikel 44][ref1] blijkt dat er een beperkt kwetsbaar object als bedoeld in het
      [Besluit externe veiligheid inrichtingen][ref2] binnen de 10-6 per jaar veiligheidscontour is gelegen.


      [ref1]: https://wetten.overheid.nl/BWBR0023771#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0016767
