  - number: '2'
    text: Bij ministeriële regeling worden regels gesteld omtrent de toepassing van de NRB.
    url: https://wetten.overheid.nl/BWBR0023771/2021-07-01#Artikel2
  - number: '3'
    text: |-
      1 De uitvoerder die weet of redelijkerwijs had kunnen weten dat door het in werking zijn van de mobiele installatie
      dan wel onderzeese installatie en de in verband met de mobiele installatie dan wel onderzeese installatie verrichte
      werkzaamheden en activiteiten nadelige gevolgen voor het milieu ontstaan of kunnen ontstaan die niet of onvoldoende
      worden voorkomen of beperkt door naleving van de bij of krachtens dit besluit gestelde regels, voorkomt die
      gevolgen of beperkt die voor zover voorkomen niet mogelijk is en voor zover dit redelijkerwijs van hem kan worden
      gevergd.

      2 [Artikel 2.1, tweede en vierde lid, van het Activiteitenbesluit milieubeheer][ref1] is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2.1
    url: https://wetten.overheid.nl/BWBR0023771/2021-07-01#Artikel3
