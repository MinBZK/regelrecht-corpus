  - number: '6'
    text: |-
      1 Het aanleggen, uitbreiden, wijzigen, testen, onderhouden, repareren en buiten gebruik stellen van een boorgat
      met behulp van een mobiele installatie op land en het stimuleren van een voorkomen via een boorgat geschiedt in
      overeenstemming met de voorschriften die zijn opgenomen in [Hoofdstuk 3][ref1].

      2 Het aanleggen, uitbreiden, wijzigen, testen, onderhouden, repareren en buiten gebruik stellen van een boorgat
      met behulp van een mobiele installatie in oppervlaktewater en het stimuleren van een voorkomen via een boorgat
      geschiedt in overeenstemming met de voorschriften die zijn opgenomen in [hoofdstuk 4][ref2].

      3 Het aanleggen, testen, onderhouden, repareren en het gebruik van een onderzeese installatie geschiedt in
      overeenstemming met de voorschriften die zijn opgenomen in [hoofdstuk 5][ref3].

      4 De uitvoerder draagt er zorg voor dat de voorschriften, bedoeld in het eerste tot en met derde lid, worden
      nageleefd.


      [ref1]: https://wetten.overheid.nl/BWBR0023771#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0023771#Hoofdstuk4
      [ref3]: https://wetten.overheid.nl/BWBR0023771#Hoofdstuk5
