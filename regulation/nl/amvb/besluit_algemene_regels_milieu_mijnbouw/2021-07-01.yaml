        paragraaf: '4'
  - number: '43'
    text: |-
      1 Er is een handleiding op de mobiele installatie aanwezig waarin regels zijn gesteld door de uitvoerder
      ten aanzien van transportbewegingen, pipehandling, het verbranden van aardgas in de openlucht en andere
      geluidsintensieve activiteiten.

      2 De regels, bedoeld in het eerste lid, beperken de schade aan milieu en overlast voor de omgeving zo goed
      mogelijk.

      3 De uitvoerder draagt er zorg voor dat een ieder die werkzaam is op de mobiele installatie bekend is met de
      handleiding en de regels, bedoeld in het eerste lid, naleeft.
    url: https://wetten.overheid.nl/BWBR0023771/2021-07-01#Artikel43
  - number: '44'
    text: |-
      De uitvoerder berekent het plaatsgebonden risico voorafgaand aan de boring, overeenkomstig het
      [Besluit externe veiligheid inrichtingen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0016767
    url: https://wetten.overheid.nl/BWBR0023771/2021-07-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0016767
  - number: '45'
    text: |-
      Het boren en het afwerken van de put zijn niet toegestaan indien zich een kwetsbare bestemming, zoals gedefinieerd
      in het [Besluit externe veiligheid inrichtingen][ref1], binnen de contour van 10-6/jaar van de volgens
      [artikel 44][ref2] berekende waarde van het plaatsgebonden risico bevindt.


      [ref1]: https://wetten.overheid.nl/BWBR0016767
      [ref2]: https://wetten.overheid.nl/BWBR0023771#Artikel44
    url: https://wetten.overheid.nl/BWBR0023771/2021-07-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0016767
      - id: ref2
        bwb_id: BWBR0023771
        artikel: '44'
        hoofdstuk: '3'
        paragraaf: '9'
  - number: '46'
    text: |-
      Indien zich op een mobiele installatie een ongewoon voorval voordoet of heeft voorgedaan waardoor nadelige gevolgen
      voor het milieu zijn ontstaan of dreigen te ontstaan, meldt de uitvoerder het ongewoon voorval zo spoedig mogelijk
      telefonisch aan de inspecteur-generaal der mijnen. De uitvoerder bevestigt de melding binnen 24 uur schriftelijk.
    url: https://wetten.overheid.nl/BWBR0023771/2021-07-01#Artikel46
  - number: '47'
    text: |-
      1 De buitenverlichting op de mobiele installatie blijft ter bescherming van het milieu beperkt tot het niveau dat
      noodzakelijk is voor het verrichten van de nodige werkzaamheden of ter voorkoming van gevaar.

      2 De lampen van de buitenverlichting branden uitsluitend voor zover dat voor het verrichten van werkzaamheden of in
      verband met de veiligheid noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0023771/2021-07-01#Artikel47
  - number: '48'
    text: |-
      De mobiele installatie wordt schoon gehouden, verkeert steeds in goede staat van onderhoud en wordt vrijgehouden
      van voor de werking van de installatie onnodig materiaal, zodat geen verontreinigende stoffen in het milieu kunnen
      komen.
    url: https://wetten.overheid.nl/BWBR0023771/2021-07-01#Artikel48
  - number: '49'
    text: |-
      1 Doeltreffende maatregelen zijn genomen om laad- en loswerkzaamheden lekvrij te doen geschieden.

      2 Op plaatsen waar laad- en loswerkzaamheden worden verricht zijn zodanige voorzieningen getroffen of maatregelen
      genomen dat het weglekken van stoffen door opvang of anderszins wordt voorkomen.
    url: https://wetten.overheid.nl/BWBR0023771/2021-07-01#Artikel49
  - number: '50'
    text: |-
      De mobiele installatie wordt zodanig in bedrijf gehouden en onderhouden dat de geluidemissie tot een minimum wordt
      beperkt.
    url: https://wetten.overheid.nl/BWBR0023771/2021-07-01#Artikel50
  - number: '51'
    text: |-
      Voor zover de mobiele installatie is gelegen in provinciaal ingedeeld gebied zijn de [artikelen 18][ref1],
      [19][ref2] en [20][ref3] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0023771#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0023771#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0023771#Artikel20
    url: https://wetten.overheid.nl/BWBR0023771/2021-07-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0023771
        artikel: '18'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0023771
        artikel: '19'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0023771
        artikel: '20'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '52'
    text: |-
      1 Een zuigermotor met een asvermogen van meer dan 130 kW waarin het aandeel van gasvormige brandstoffen in
      de warmte-inhoud van de toegevoerde brandstoffen minder dan 50 procent bedraagt, wordt zodanig gebruikt dat,
      teruggerekend op ISO-luchtcondities, de uitworp van stikstofoxiden met het rookgas, betrokken op de warmte-inhoud
      van de toegevoerde brandstof, niet meer bedraagt dan 2722 g/GJ (=9.8 g/kWh).

      2 Het eerste lid geldt niet voor een zuigermotor voor de aandrijving van een noodstroomgenerator.
    url: https://wetten.overheid.nl/BWBR0023771/2021-07-01#Artikel52
  - number: '53'
    text: |-
      1 De uitworp van stikstofoxiden met het rookgas van een zuigermotor voor de opwekking van elektriciteit wordt
      binnen vier weken na aanvang van de werkzaamheden door een afzonderlijke meting bepaald. Desgevraagd worden de
      meetgegevens aan de inspecteur-generaal der mijnen overgelegd.

      2 Bij ministeriële regeling worden regels gegeven betreffende de meetmethoden van de meting bedoeld in het eerste
      lid.

      3 Een meting als bedoeld in het eerste lid is niet nodig indien kan worden aangetoond dat een dergelijke meting
      binnen drie jaar voorafgaand aan de werkzaamheden verricht is en de resultaten van de meting kunnen worden
      overgelegd.
    url: https://wetten.overheid.nl/BWBR0023771/2021-07-01#Artikel53
  - number: '54'
    text: |-
      1 In het geval van het testen van boorgaten en het schoonproduceren ervan wordt minimaal 48 uur voorafgaand aan het
      verbranden een testprogramma afgegeven bij de inspecteur-generaal der mijnen, waarin aandacht wordt besteed aan:

      a. de duur van de test;

      b. het tijdstip waarop het verbranden plaats zal vinden;

      c. maatregelen ter voorkoming van vogelsterfte.

      2 In voorkomend geval kan de inspecteur-generaal der mijnen in het belang van het milieu aanvullende eisen stellen
      aan het testprogramma.
    url: https://wetten.overheid.nl/BWBR0023771/2021-07-01#Artikel54
  - number: '55'
    text: |-
      De continue en incidentele emissies van de stoffen als bedoeld in de [artikelen 53][ref1] en [54][ref2] die
      bij de werkzaamheden vrijkomen en de hoeveelheid verbrand gas/condensaat worden geregistreerd in een meet- en
      registratiesysteem.


      [ref1]: https://wetten.overheid.nl/BWBR0023771#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0023771#Artikel54
    url: https://wetten.overheid.nl/BWBR0023771/2021-07-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0023771
        artikel: '53'
        hoofdstuk: '4'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0023771
        artikel: '54'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: '56'
    text: |-
      1 Installaties op een mijnbouwwerk die een koudemiddel bevatten en zich bevinden op het continentaal plat worden
      onderhouden in overeenstemming met het [Besluit gefluoreerde broeikasgassen en ozonlaagafbrekende stoffen]
      (onbekend).

      2 Installaties met een inhoud gelegen tussen 3 kg en 30 kg dan wel meer dan 30 kg koudemiddel op een
      mijnbouwinstallatie die vanuit het buitenland de Nederlandse wateren binnenkomt, worden zo spoedig mogelijk
      onderworpen aan een periodieke keuring, tenzij een dergelijke keuring reeds heeft plaatsgevonden in de voorafgaande
      twaalf respectievelijk drie maanden.
    url: https://wetten.overheid.nl/BWBR0023771/2021-07-01#Artikel56
  - number: '57'
    text: |-
      De uitvoerder neemt maatregelen om het ontstaan van afvalstoffen en gevaarlijke stoffen of afvalstoffen zoveel
      mogelijk te voorkomen.
    url: https://wetten.overheid.nl/BWBR0023771/2021-07-01#Artikel57
  - number: '58'
    text: |-
      1 Afvalstoffen zijn in goed gesloten, niet lekkend, tegen weersinvloeden bestendig en zonodig geurhinder voorkomend
      verpakkingsmateriaal verpakt en worden zo spoedig mogelijk afgevoerd.

      2 Oliehoudend boorgruis wordt afgevoerd in goed afgesloten vloeistofdichte containers.
    url: https://wetten.overheid.nl/BWBR0023771/2021-07-01#Artikel58
  - number: '59'
    text: |-
      De uitvoerder houdt een register bij waarin onder vermelding van de datum van afvoer nauwkeurig aantekening wordt
      gehouden van de soort en hoeveelheid van de van de mobiele installatie afgevoerde afvalstoffen.
    url: https://wetten.overheid.nl/BWBR0023771/2021-07-01#Artikel59
  - number: '60'
    text: |-
      De richtlijnen van de «Opslag van verpakte gevaarlijke stoffen» (PGS 15,) zijn van overeenkomstige toepassing op de
      opslag van gevaarlijke stoffen in emballage.
    url: https://wetten.overheid.nl/BWBR0023771/2021-07-01#Artikel60
  - number: '61'
    text: |-
      1 Bij het inwerking hebben van de mobiele installatie streeft de uitvoerder naar een zo hoog mogelijke energie-
      efficiency.

      2 Onze Minister kan met betrekking tot de energie-efficiency van de bij een boring te gebruiken dieselmotoren en
      generatoren maatwerkvoorschriften stellen.
    url: https://wetten.overheid.nl/BWBR0023771/2021-07-01#Artikel61
  - number: '62'
    text: |-
      Voor zover:

      a. documenten met betrekking tot de registratie van luchtemissies en de registratie van afvalstoffen op basis van
      de [artikelen 55][ref1] en [59][ref2],

      b. onderhoudscontracten met betrekking tot op de mobiele installatie aanwezige installaties,

      c. certificaten of bewijzen van:

      1°. de tanks, filters en andere voorzieningen,

      2°. onderhoud of keuringen van op de mobiele installatie aanwezige voorzieningen en installaties,

      d. de veiligheidsinformatiebladen, die behoren bij de op de mobiele installatie aanwezige gevaarlijke stoffen,

      voor de mobiele installatie zijn afgegeven, zijn die documenten of een kopie daarvan gedurende de werkzaamheden
      op de mobiele installatie aanwezig of binnen een door degene die toeziet op de naleving van dit besluit te stellen
      termijn beschikbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0023771#Artikel55
      [ref2]: https://wetten.overheid.nl/BWBR0023771#Artikel59
    url: https://wetten.overheid.nl/BWBR0023771/2021-07-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0023771
        artikel: '55'
        hoofdstuk: '4'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0023771
        artikel: '59'
        hoofdstuk: '4'
        paragraaf: '4'
  - number: '63'
    text: De onderzeese installatie verkeert in goede staat van onderhoud.
    url: https://wetten.overheid.nl/BWBR0023771/2021-07-01#Artikel63
  - number: '64'
    text: |-
      Lozing van stoffen is verboden, met uitzondering van stoffen die vrijkomen bij de bediening van de kleppen van
      de onderzeese installatie. De uitvoerder treft maatregelen zodat lozing van deze stoffen zo goed mogelijk wordt
      beperkt.
    url: https://wetten.overheid.nl/BWBR0023771/2021-07-01#Artikel64
  - number: '65'
    text: |-
      Indien zich op een onderzeese installatie een ongewoon voorval voordoet of heeft voorgedaan, waardoor nadelige
      gevolgen voor het milieu zijn ontstaan of dreigen te ontstaan meldt de uitvoerder het ongewoon voorval zo spoedig
      mogelijk telefonisch aan de inspecteur-generaal der mijnen. De uitvoerder bevestigt de melding binnen 24 uur
      schriftelijk.
    url: https://wetten.overheid.nl/BWBR0023771/2021-07-01#Artikel65
  - number: '66'
    text: |-
      1 Voor een installatie als bedoeld in [artikel 4][ref1] en [artikel 5, eerste lid][ref2],
      waarvoor op het tijdstip van inwerkingtreding van dit besluit reeds een vergunning
      als bedoeld in [artikel 8.1, eerste en tweede lid, van de Wet milieubeheer][ref3] of
      [artikel 40, tweede lid, eerste volzin, van de Mijnbouwwet][ref4] is verleend, blijven de voorschriften met
      betrekking tot geluid van die vergunning gedurende drie jaar na het tijdstip van inwerkingtreding van dit besluit
      op die installatie van toepassing als maatwerkvoorschrift als bedoeld in [artikel 20, eerste of tweede lid][ref5].
      Onze Minister kan voor afloop van de termijn van drie jaar deze voorschriften wijzigen of intrekken.

      2 Indien voor het tijdstip waarop dit besluit in werking treedt, een aanvraag om een
      vergunning als bedoeld in [artikel 8.1, eerste en tweede lid, van de Wet milieubeheer][ref6] of
      [artikel 40, tweede lid, van de Mijnbouwwet][ref7] voor het oprichten van een installatie als bedoeld in
      [artikel 4][ref8] of [artikel 5, eerste lid][ref9], bij Onze Minister is ingediend maar de vergunning nog niet
      is verleend en in werking getreden, wordt de aanvraag om de vergunning aangemerkt als een melding overeenkomstig
      [artikel 7][ref10] of [8][ref11].


      [ref1]: https://wetten.overheid.nl/BWBR0023771#Artikel4
