        artikel: '7.16'
  - number: '9'
    text: |-
      In dit hoofdstuk wordt verstaan onder «terrein»: terrein waarop met een mobiele installatie werkzaamheden
      plaatsvinden of hebben plaatsgevonden die samenhangen met de opsporing of winning van delfstoffen of aardwarmte dan
      wel de opslag van stoffen en dat ten behoeve van deze activiteiten in stand wordt gehouden.
    url: https://wetten.overheid.nl/BWBR0023771/2021-07-01#Artikel9
  - number: '10'
    text: |-
      Indien zich op een mobiele installatie en bijbehorend terrein een ongewoon voorval voordoet of heeft voorgedaan
      waardoor nadelige gevolgen voor het milieu zijn ontstaan of dreigen te ontstaan, meldt de uitvoerder het ongewoon
      voorval zo spoedig mogelijk telefonisch aan de inspecteur-generaal der mijnen. De uitvoerder bevestigt de melding
      binnen 24 uur schriftelijk.
    url: https://wetten.overheid.nl/BWBR0023771/2021-07-01#Artikel10
  - number: '11'
    text: |-
      1 Op de buitengrens van het terrein is een stevig minimaal twee meter hoog hekwerk geplaatst waarvan de
      toegangsdeuren naar buiten opendraaien.

      2 Toegang tot het terrein hebben slechts personen die daartoe bevoegd zijn en de controle daarop vindt plaats door
      de uitvoerder.
    url: https://wetten.overheid.nl/BWBR0023771/2021-07-01#Artikel11
  - number: '12'
    text: |-
      1 Het terrein is schoon en er bevindt zich geen materiaal op het terrein dat niet noodzakelijk is voor het doel
      waarvoor het terrein is ingericht.

      2 Op het terrein aanwezige begroeiing wordt kort gehouden en dood hout, bladeren, afgesneden onkruid of gras worden
      verwijderd.

      3 Bij het schoon houden, kort houden van begroeiing en verwijderen van dood hout, bladeren afgesneden, onkruid of
      gras wordt op plaatsen waar gevaar voor explosieve verbranding niet is uitgesloten geen apparatuur of gereedschap
      gebruikt die vonken kan veroorzaken.
    url: https://wetten.overheid.nl/BWBR0023771/2021-07-01#Artikel12
  - number: '13'
    text: |-
      De op het terrein aanwezige boorputten zijn voorzien van een doeltreffende beveiliging tegen aanrijding en vallende
      objecten.
    url: https://wetten.overheid.nl/BWBR0023771/2021-07-01#Artikel13
  - number: '14'
    text: |-
      Op het terrein treft de uitvoerder doeltreffende maatregelen en voorzieningen om laad- en loswerkzaamheden lekvrij
      te doen geschieden en waardoor het wegvloeien van stoffen wordt voorkomen.
    url: https://wetten.overheid.nl/BWBR0023771/2021-07-01#Artikel14
  - number: '15'
    text: |-
      1 Het terrein is voorzien van buitenverlichting voor zover die noodzakelijk is voor het verrichten van
      werkzaamheden en het voorkomen van gevaar.

      2 De hoogte van de installatie van de buitenverlichting en het gebruik ervan gaat niet verder dan noodzakelijk is
      voor het verrichten van de nodige werkzaamheden of het handhaven van de veiligheid.

      3 De verlichting is zodanig opgesteld en ingericht en de lampen zijn zodanig afgeschermd dat hinderlijke
      lichtstraling voor de omgeving en het milieu en directe instraling in woningen wordt voorkomen.
    url: https://wetten.overheid.nl/BWBR0023771/2021-07-01#Artikel15
  - number: '16'
    text: |-
      1 De uitvoerder stelt na overleg met de commandant van de plaatselijke bandweer een brandbestrijdingsplan op en
      zorgt er voor dat het plan tijdens het boren op de locatie aanwezig is.

      2 Bij ministeriële regeling worden regels gegeven met betrekking tot de informatie die het brandbestrijdingsplan
      bevat.
    url: https://wetten.overheid.nl/BWBR0023771/2021-07-01#Artikel16
  - number: '17'
    text: De mobiele installatie wordt schoon gehouden en verkeert steeds in goede staat van onderhoud.
    url: https://wetten.overheid.nl/BWBR0023771/2021-07-01#Artikel17
  - number: '18'
    text: |-
      In deze paragraaf wordt verstaan onder:

      a. langtijdgemiddeld beoordelingsniveau: (L) het gemiddelde van de afwisselende niveaus van het ter plaatse
      optredende geluid, gemeten in een bepaalde periode en vastgesteld en beoordeeld overeenkomstig de Handleiding meten
      en rekenen industrielawaai;

      b. maximaal geluidsniveau: (L) maximaal geluidsniveau, gemeten in de meterstand «F» of «fast», als vastgesteld en
      beoordeeld overeenkomstig de Handleiding meten en rekenen industrielawaai;

      c. geluidsniveau: geluidsniveau in dB(A) als bedoeld in [artikel 1 van de Wet geluidhinder][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel1
    url: https://wetten.overheid.nl/BWBR0023771/2021-07-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '1'
  - number: '19'
    text: |-
      Voor het langtijdgemiddeld beoordelingsniveau (L) en het maximaal geluidsniveau (L), veroorzaakt door de mobiele
      installatie en de in verband met de mobiele installatie verrichte werkzaamheden en activiteiten geldt:

      a. de niveaus op de in de tabel I genoemde plaatsen en tijdstippen bedragen niet meer dan de in die tabel
      aangegeven waarden:


              Tabel I











                      07:00–19:00 uur


                      19:00–23:00 uur


                      23:00–07:00 uur






                      L, op een afstand van 300 meter vanaf de mobiele installatie



                      60 dB(A)


                      55 dB(A)


                      50 dB(A)




                      L in geluidsgevoelige gebouwen op een afstand van 300 meter of minder vanaf de mobiele installaties



                      40 dB(A)


                      35 dB(A)


                      30 dB(A)




                      L op een afstand van 300 meter vanaf de mobiele installatie



                      70 dB(A)


                      65 dB(A)


                      60 dB(A)






      b. de in tabel I opgenomen maximale geluidsniveaus (L) zijn niet van toepassing op het laden en lossen,
      transportbewegingen, pipehandling en het verbranden van (aard)gas in de open lucht;

      c. de activiteiten, genoemd onder b, vinden plaats tussen 07:00 en 19:00 uur, tenzij dit redelijkerwijs niet
      mogelijk is;

      d. de in de tabel aangegeven waarden in geluidsgevoelige gebouwen gelden alleen indien de gebruiker ervan
      toestemming geeft voor het in redelijkheid uitvoeren of doen uitvoeren van geluidmetingen;

      e. als er een geluidsgevoelig gebouw aanwezig is binnen 300 meter vanaf het hart van de boorinstallatie, monitort
      en registreert de uitvoerder het geluid continu. De monitoring geschiedt zodanig dat een goede indicatie wordt
      verkregen van het equivalent geluidsniveau op de gevel van de meest met geluid belaste woning;

      f. als er een geluidsgevoelig gebouw aanwezig is binnen 300 meter vanaf het hart van de boorinstallatie wordt
      voorafgaand aan de boring in een rapport van een akoestisch onderzoek op grond van verrichte geluidsmetingen of
      geluidsberekeningen aangetoond dat aan de geluidniveaus uit tabel I, dan wel volgens een maatwerkvoorschrift als
      bedoeld in [artikel 20][ref1], kan worden voldaan. In het rapport wordt aangegeven welke voorzieningen worden
      getroffen om te voorkomen dat de geldende geluidniveaus worden overschreden. Het akoestisch onderzoek wordt
      uitgevoerd overeenkomstig de Handleiding meten en rekenen met industrielawaai. De resultaten van dit akoestische
      onderzoek worden uiterlijk vier weken voorafgaand aan de boring bij de inspecteur-generaal der mijnen ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0023771#Artikel20
    url: https://wetten.overheid.nl/BWBR0023771/2021-07-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0023771
        artikel: '20'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '20'
    text: |-
      1 Onze Minister kan bij maatwerkvoorschrift waarden stellen die hoger zijn dan de waarden die zijn vermeld in Tabel
      I, indien de waarden in Tabel I naar het oordeel van Onze Minister op basis van de beste beschikbare techniek niet
      haalbaar zijn.

      2 Onze Minister kan bij maatwerkvoorschrift waarden stellen die lager zijn dan de waarden die vermeld zijn in
      Tabel I, indien naar het oordeel van Onze Minister lagere waarden uit een oogpunt van bescherming van het milieu
      noodzakelijk zijn voor zover die op basis van de beste beschikbare techniek technisch haalbaar zijn.

      3 Van een beschikking als bedoeld in het eerste en tweede lid wordt kennisgegeven in de Staatscourant.

      4 Indien een maatwerkvoorschrift als bedoeld in het eerste lid waarden tot gevolg heeft die
      aanzienlijke gevolgen voor het milieu kunnen hebben, is op de voorbereiding van het maatwerkvoorschrift
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0023771/2021-07-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: '21'
    text: |-
      1 Voor de etmaalwaarde van de verkeersbewegingen van en naar de mobiele installatie geldt een streefwaarde van
      50 dB(A).

      2 Bij ministeriele regeling worden regels gegeven betreffende de beoordeling van etmaalwaarden van de
      verkeersbewegingen.
    url: https://wetten.overheid.nl/BWBR0023771/2021-07-01#Artikel21
  - number: '22'
    text: |-
      1 Het terrein waarop de mobiele installatie zich bevindt, is zodanig ingericht en onderhouden, dat geurhinder wordt
      voorkomen.

      2 Het gebruik van chemische stoffen is verboden indien deze buiten het terrein waarop de mobiele installatie zich
      bevindt geurhinder veroorzaken.

      3 De aanwezigheid van flensverbindingen in leidingen, waardoor geurverwekkende gassen of vloeistoffen worden
      getransporteerd, wordt zoveel mogelijk vermeden.
    url: https://wetten.overheid.nl/BWBR0023771/2021-07-01#Artikel22
  - number: '23'
    text: |-
      1 De uitworp van stikstofoxiden met het rookgas van een zuigermotor voor de opwekking van elektriciteit wordt
      binnen vier weken na aanvang van de werkzaamheden door een afzonderlijke meting bepaald. Desgevraagd worden de
      meetgegevens aan de inspecteur-generaal der mijnen overgelegd.

      2 Bij ministeriële regeling worden regels gegeven betreffende de meetmethoden van de meting bedoeld in het eerste
      lid.

      3 Een meting als bedoeld in het eerste lid is niet nodig indien wordt aangetoond dat een dergelijke meting binnen
      drie jaar voorafgaand aan de werkzaamheden verricht is en de resultaten van de meting worden overgelegd.
    url: https://wetten.overheid.nl/BWBR0023771/2021-07-01#Artikel23
  - number: '24'
    text: |-
      1 In geval van het gebruik van een fakkel is deze ontworpen met het oog op optimale afgasverbranding met een
      minimum rendement van 99%.

      2 Minimaal 48 uur voorafgaand aan het affakkelen wordt een fakkelprogramma ingediend bij de inspecteur-generaal der
      mijnen, waarin aandacht wordt besteed aan:

      a. duur van het fakkelen;

      b. tijdstip waarop het fakkelen plaats zal vinden;

      c. maatregelen om geluidsbelasting voor omwonenden te voorkomen, dan wel te beperken.

      3 De inspecteur-generaal der mijnen kan eisen stellen aan het affakkelen ter bescherming van het milieu en ter
      voorkoming van geluidoverlast.
    url: https://wetten.overheid.nl/BWBR0023771/2021-07-01#Artikel24
  - number: '25'
    text: |-
      Emissies van gassen die vrijkomen bij het testen van boorgaten en het schoon produceren ervan en de hoeveelheid
      verbrand gas/condensaat worden geregistreerd in een meet- en registratiesysteem.
    url: https://wetten.overheid.nl/BWBR0023771/2021-07-01#Artikel25
  - number: '26'
    text: |-
      In deze paragraaf wordt verstaan onder:

      a.

      b. bodembeschermende maatregel: op de gebezigde stoffen en gebruikte bodembeschermende voorziening toegesneden
      beheermaatregel gericht op reparatie, schoonmaak, onderhoud, actie bij incidenten, bedrijfsinterne controle,
      inspectie of toezicht, ter voorkoming van immissies in de bodem of herstel van de effecten van zulke immissies op
      de bodemkwaliteit, waarvan de uitvoering is gewaarborgd;

      c. bodembeschermende voorziening: een vloeistofkerende voorziening, een vloeistofdichte vloer of verharding of een
      andere doelmatige fysieke voorziening, ter voorkoming van immissies in de bodem;

      d. lekbak: een voorziening waarvan de bodembeschermende werking door de daarop afgestemde bodembeschermende
      maatregelen is gewaarborgd, en die zich rondom of onder een bodembedreigende activiteit bevindt en in staat is de
      bij normale bedrijfsvoering gemorste of wegspattende vloeistoffen op te vangen;

      e. vloeistofdichte vloer of verharding: vloer of verharding direct op de bodem die waarborgt dat geen vloeistof aan
      de niet met vloeistof belaste zijde van die vloer kan komen.
    url: https://wetten.overheid.nl/BWBR0023771/2021-07-01#Artikel26
  - number: '27'
    text: |-
      Op het terrein waarop de mobiele installatie zich bevindt, worden bodembeschermende voorzieningen en
      bodembeschermende maatregelen, getroffen die voldoen aan eisen gesteld in de NRB. Voor putkelders gelden de eisen
      van bodemrisico categorie A en voor het overige gebied de eisen van bodemrisico categorie A of A*.
    url: https://wetten.overheid.nl/BWBR0023771/2021-07-01#Artikel27
  - number: '28'
    text: |-
      1 Indien het terrein niet voldoet aan de eisen van bodemrisicocategorie A, maar aan die van A*, worden vier
      grondwaterpeilbuizen geïnstalleerd die zodanig zijn geplaatst dat bodemverontreiniging door (hulp)stoffen die bij
      het uitvoeren van boringen worden gebruikt, kunnen worden gesignaleerd.

      2 De grondwaterpeilbuizen, bedoeld in het eerste lid, worden zo vaak als de omstandigheden daartoe aanleiding
      geven, doch in ieder geval voorafgaande aan de werkzaamheden, binnen zes maanden na beëindiging van de
      werkzaamheden en daarna iedere vijf jaren bemonsterd en geanalyseerd volgens een bij ministeriële regeling aan te
      wijzen niet publiekrechtelijke regeling of norm voor de bemonstering en het analyseren van grondwater.

      3 De resultaten van de bemonstering en analyse worden ten minste vijf jaar bewaard en worden op verzoek getoond aan
      de inspecteur-generaal der mijnen.

      4 De installatie van een grondwaterpeilbuis als bedoeld in het eerste en tweede lid, alsmede de bemonstering en
      analyse als bedoeld in het tweede lid, vinden plaats door een persoon of instelling, die voor deze werkzaamheid
      beschikt over een erkenning op grond van het [Besluit bodemkwaliteit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022929
    url: https://wetten.overheid.nl/BWBR0023771/2021-07-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0022929
  - number: '29'
    text: |-
      Indien uit een onderzoek als bedoeld in [artikel 28][ref1] blijkt dat de bodem als gevolg van de activiteiten
      op het terrein is aangetast of verontreinigd, dan wel door welke andere oorzaak dan ook bodemverontreiniging is
      ontstaan:

      a. draagt de uitvoerder er zorg voor dat het beperken en zoveel mogelijk ongedaan maken van de verontreiniging of
      de aantasting en de directe gevolgen daarvan, geschiedt door een persoon of een instelling die beschikt over een
      erkenning op grond van het [Besluit uitvoeringskwaliteit bodembeheer][ref2];

      b. zorgt de uitvoerder onverwijld voor melding ervan aan de inspecteur-generaal der mijnen;

      c. meldt de uitvoerder de afronding van de werkzaamheden, bedoeld onder a, direct aan de inspecteur-generaal der
      mijnen door middel van een verklaring van de persoon of instelling, bedoeld onder a.


      [ref1]: https://wetten.overheid.nl/BWBR0023771#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0019963
    url: https://wetten.overheid.nl/BWBR0023771/2021-07-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0023771
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0019963
  - number: '30'
    text: |-
      1 De controle, het onderhoud en het beheer van bodembeschermende voorzieningen wordt in eenduidige interne
      bedrijfsprocedures en werkinstructies ter bescherming van de bodem vastgelegd, waarin tenminste is aangegeven op
      welke wijze:

      a. de staat en goede werking wordt gecontroleerd van bodembeschermende voorzieningen en verpakkingen en apparatuur
      waarin vloeibare bodembedreigende stoffen worden opgeslagen of getransporteerd;

      b. er voor zorg wordt gedragen dat zo vaak als de omstandigheden daarom vragen inspecties op morsingen en lekkages
      plaatsvinden en

      c. is gewaarborgd dat gemorst of gelekte stoffen direct worden opgeruimd.

      2 De uitvoerder draagt er zorg voor dat de medewerkers die binnen de inrichting bodembedreigende activiteiten
      verrichten, op de hoogte zijn van de interne bedrijfsprocedures en werkinstructies als bedoeld in het eerste lid,
      dat deze worden nageleefd en op het terrein zodanig aanwezig zijn dat een ieder daarvan op eenvoudige wijze kennis
      kan nemen.

      3 De controle, het onderhoud en het beheer van bodembeschermende voorzieningen vinden zodanig plaats dat
      vrijgekomen stoffen zijn verwijderd voordat deze in de bodem kunnen geraken.

      4 Morsingen en lekkages worden overeenkomstig de interne bedrijfsprocedures en werkinstructies als bedoeld in het
      eerste lid, verholpen en opgeruimd.

      5 De uitvoerder draagt er zorg voor dat de in het kader van de interne bedrijfsprocedures en werkinstructies
      noodzakelijke middelen ter bescherming van de bodem binnen het terrein in voldoende mate aanwezig zijn en dat er
      voldoende, in het gebruik van deze middelen, geïnstrueerd personeel aanwezig is.

      6 Bevindingen van controles van of onderhoud aan bodembeschermende voorzieningen, alsmede acties genomen na
      incidenten met bodembedreigende stoffen worden opgenomen in een logboek dat te allen tijde beschikbaar is voor de
      inspecteur-generaal der mijnen.
    url: https://wetten.overheid.nl/BWBR0023771/2021-07-01#Artikel30
  - number: '31'
    text: |-
      1 Een bodembeschermende voorziening is zo uitgevoerd dat gemorste of weggelekte vloeibare bodembedreigende stoffen
      effectief worden opgevangen en kunnen worden opgeruimd.

      2 Een vloeistofdichte vloer of verharding, een lekbak of een andere opvangbak, die wordt gebruikt als
      bodembeschermende voorziening is bestand tegen de inwerking van de desbetreffende vloeibare bodembedreigende
      stoffen en de condities waaronder deze stoffen worden gebruikt of opgeslagen.

      3 Lekbakken en andere opvangbakken zijn zodanig uitgevoerd dat er geen hemelwater in terecht kan komen, tenzij het
      hemelwater direct wordt verwijderd op een zodanige wijze dat de bodembeschermende werking van de voorziening niet
      negatief wordt beïnvloed.

      4 Lekbakken en andere opvangbakken waarin vloeibare bodembedreigende stoffen in verpakking of in een opslagtank
      worden opgeslagen, hebben een opvangcapciteit die ten minste gelijk is aan het volume van de inhoud van de grootste
      verpakkingseenheid of opslagtank vermeerderd met 10%, met dien verstande dat de opvangcapaciteit ten minste 10% is
      van het volume van alle opgeslagen stoffen.
    url: https://wetten.overheid.nl/BWBR0023771/2021-07-01#Artikel31
  - number: '32'
    text: |-
      Bedrijfsafvalwater wordt opgevangen en afgevoerd naar een daartoe bevoegde verwerker, dan wel, indien de beheerder
      van het vuilwaterriool daartoe toestemming geeft, via het vuilwaterriool.
    url: https://wetten.overheid.nl/BWBR0023771/2021-07-01#Artikel32
  - number: '33'
    text: |-
      Voordat het terrein waarop de mobiele installatie zich bevindt, wordt verlaten, wordt door een persoon of
      instelling die daartoe op grond van het [Besluit uitvoeringskwaliteit bodembeheer][ref1] is erkend, een
      eindsituatie-onderzoek van de bodem verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0019963
    url: https://wetten.overheid.nl/BWBR0023771/2021-07-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0019963
  - number: '34'
    text: |-
      In deze paragraaf wordt onder ADR verstaan de op 30 september 1957 te Genève totstandgekomen Europese Overeenkomst
      betreffende het internationale vervoer van gevaarlijke stoffen over de weg (Trb. 1959, 171).
    url: https://wetten.overheid.nl/BWBR0023771/2021-07-01#Artikel34
  - number: '35'
    text: Het ontstaan van afvalstoffen wordt zoveel mogelijk voorkomen of beperkt.
    url: https://wetten.overheid.nl/BWBR0023771/2021-07-01#Artikel35
  - number: '36'
    text: |-
      1 Afvalstoffen zijn in goed gesloten, niet lekkend, tegen weersinvloeden bestendig en zonodig geurhinder voorkomend
      verpakkingsmateriaal verpakt en worden zo spoedig mogelijk afgevoerd.

      2 Oliehoudend boorgruis wordt afgevoerd in goed afgesloten vloeistofdichte containers.
    url: https://wetten.overheid.nl/BWBR0023771/2021-07-01#Artikel36
  - number: '37'
    text: |-
      1 Bij ministeriële regeling aangewezen gevaarlijke afvalstoffen worden van elkaar en van andere afvalstoffen
      gescheiden, gescheiden gehouden en gescheiden afgegeven.

      2 Andere dan de in het eerste lid bedoelde afvalstoffen worden gescheiden, gescheiden gehouden en gescheiden
      afgegeven, tenzij dit redelijkerwijs niet mogelijk is.
    url: https://wetten.overheid.nl/BWBR0023771/2021-07-01#Artikel37
  - number: '38'
    text: |-
      1 Opslag van vloeibare en vaste verpakte gevaarlijke stoffen, die zijn ingedeeld in de klassen 3, 5.1, 6.1, 8 en 9
      van het ADR, vindt plaats volgens hoofdstuk 3 van PGS 15.

      2 Opslag van gasvormige gevaarlijke stoffen in gasflessen, spuitbussen en gaspatronen die zijn ingedeeld in klasse
      2 van het ADR vindt plaats volgens de hoofdstukken 6 en 7 van PGS 15.
    url: https://wetten.overheid.nl/BWBR0023771/2021-07-01#Artikel38
  - number: '39'
    text: Opslag van dieselolie vindt plaats volgens PGS 30.
    url: https://wetten.overheid.nl/BWBR0023771/2021-07-01#Artikel39
  - number: '40'
    text: |-
      1 Bij het inwerking hebben van de mobiele installatie streeft de uitvoerder naar een zo hoog mogelijke energie-
      efficiency.

      2 Onze Minister kan met betrekking tot de energie-efficiency van de bij een boring te gebruiken dieselmotoren en
      generatoren maatwerkvoorschriften stellen.
    url: https://wetten.overheid.nl/BWBR0023771/2021-07-01#Artikel40
  - number: '41'
    text: |-
      Tijdens het transport van de mobiele installatie en het bij het gebruik van de mobiele installatie benodigde en
      vrijkomende materiaal van en naar een terrein worden de vorming en verspreiding van stof voorkomen. De aan- en
      afvoerroute van de mobiele installatie en het benodigde en vrijkomende materiaal wordt in overeenstemming met de
      gemeente en de wegbeheerder vastgesteld.
    url: https://wetten.overheid.nl/BWBR0023771/2021-07-01#Artikel41
  - number: '42'
    text: |-
      Voor zover documenten met betrekking tot:

      a. de monitoring van het geluid, de registratie van luchtemissies, de bemonstering van het grondwater en de
      registratie met betrekking tot bodembeschermende voorzieningen op basis van de [artikelen 19][ref1], [23][ref2],
      [25][ref3], [28][ref4] en [30][ref5],

      b. onderhoudscontracten met betrekking tot op de mobiele installatie aanwezige installaties,

      c. certificaten of bewijzen van:

      1°. tanks, filters en andere voorzieningen,

      2°. onderhoud of keuringen van op de mobiele installatie aanwezige voorzieningen en installaties,

      d. de veiligheidsinformatiebladen die behoren bij de op de mobiele installatie.

      e. aanwezige gevaarlijke stoffen,

      voor de mobiele installatie zijn afgegeven dan wel voorgeschreven, zijn die documenten of een kopie daarvan
      gedurende de werkzaamheden op de mobiele installatie aanwezig of binnen een termijn die wordt gesteld door degene
      die toeziet op de naleving van dit besluit voor deze beschikbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0023771#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0023771#Artikel23
      [ref3]: https://wetten.overheid.nl/BWBR0023771#Artikel25
      [ref4]: https://wetten.overheid.nl/BWBR0023771#Artikel28
      [ref5]: https://wetten.overheid.nl/BWBR0023771#Artikel30
    url: https://wetten.overheid.nl/BWBR0023771/2021-07-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0023771
        artikel: '19'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
