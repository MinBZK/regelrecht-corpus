  - number: '67'
    text: |-
      Indien een niet publiekrechtelijke norm waarnaar in dit besluit wordt verwezen of de NRB wijzigt kan bij
      ministeriële regeling overgangsrecht worden opgenomen waarbij kan worden bepaald dat de oude norm voor bestaande
      installaties al dan niet tijdelijk blijft gelden.
    url: https://wetten.overheid.nl/BWBR0023771/2021-07-01#Artikel67
  - number: '68'
    text: |-
      Dit besluit treedt in werking met ingang van de eerste dag van de derde kalendermaand na de datum van uitgifte van
      het Staatsblad waarin het wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0023771/2021-07-01#Artikel68
  - number: '69'
    text: 'Dit besluit wordt aangehaald als: Besluit algemene regels milieu mijnbouw.'
    url: https://wetten.overheid.nl/BWBR0023771/2021-07-01#Artikel69
