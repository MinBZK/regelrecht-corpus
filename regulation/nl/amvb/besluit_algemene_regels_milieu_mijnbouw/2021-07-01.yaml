  - number: '5'
    text: |-
      Van het verbod, bedoeld in [artikel 40, tweede lid, eerste volzin, van de Mijnbouwwet][ref1], zijn alle mobiele en
      onderzeese installaties uitgezonderd, tenzij een installatie is geplaatst bij of verbonden is met een voor winning
      bestemd mijnbouwwerk op het continentaal plat.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel40
    url: https://wetten.overheid.nl/BWBR0023771/2021-07-01#Artikel5
    references:
