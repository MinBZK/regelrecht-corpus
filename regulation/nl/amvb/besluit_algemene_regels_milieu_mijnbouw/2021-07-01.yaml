  - number: 66a
    text: |-
      1 Een melding die is gedaan in de periode tussen de bekendmaking van het Besluit van 6 maart 2017, houdende
      wijziging van het Besluit omgevingsrecht, het Besluit milieueffectrapportage en het Besluit algemene regels milieu
      mijnbouw (Staatsblad 2017, 114) tot tien maanden na de inwerkingtreding van dat besluit, geldt in afwijking van
      [artikel 2.5 van het Besluit omgevingsrecht][ref1], de [Bijlage, onderdeel D, categorie 17.2, kolom 4, bij het
      Besluit milieueffectrapportage](onbekend) en de [artikelen 5, onderdeel a, onder 1°][ref2], [7, zesde lid][ref3],
      [8, zesde lid][ref4], en [8a][ref5], van dit besluit als een melding als bedoeld in de artikelen 7, eerste
      lid, aanhef, en 8, eerste lid, aanhef, van het Besluit algemene regels milieu mijnbouw met toepassing van het
      [Besluit omgevingsrecht][ref6], het [Besluit milieueffectrapportage][ref7] en het Besluit algemene regels milieu
      mijnbouw zoals deze besluiten luidden voor de inwerkingtreding van het eerder genoemde besluit.

      2 Het aanleggen, wijzigen of uitbreiden van een boorgat, waarvoor een melding is gedaan, kan worden begonnen tot
      en met 12 maanden na de inwerkingtreding van het besluit, bedoeld in het eerste lid, en voortgezet tot en met 18
      maanden na de inwerkingtreding van dat besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0027464#Artikel2.5
