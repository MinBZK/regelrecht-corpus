  - number: 8a
    text: |-
      1 In afwijking van [artikel 8, eerste lid, aanhef][ref1], vraagt een uitvoerder die het voornemen heeft om met een
      mobiele installatie in het continentaal plat een boorgat aan te leggen, uit te breiden of te wijzigen als bedoeld
      in [artikel 5a, eerste lid][ref2], ten minste vier weken voor aanvang om instemming.

      2 De uitvoerder overlegt bij de aanvraag om instemming gegevens over de werkzaamheden, bedoeld in
      [artikel 8, eerste lid, onderdelen a tot en met f][ref3], voor zover deze gegevens niet zijn verstrekt bij de
      mededeling, bedoeld in [artikel 7.16, eerste lid, van de Wet milieubeheer][ref4].

      3 Van de aanvraag om instemming wordt in de Staatscourant kennisgegeven.

      4 Onze Minister kan op aanvraag van de uitvoerder een instemming wijzigen. Het eerste tot en met derde lid zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0023771#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0023771#Artikel5a
      [ref3]: https://wetten.overheid.nl/BWBR0023771#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Artikel7.16
    url: https://wetten.overheid.nl/BWBR0023771/2021-07-01#Artikel8a
