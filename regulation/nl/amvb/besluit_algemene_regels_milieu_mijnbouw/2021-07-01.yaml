        bwb_id: BWBR0014168
        artikel: '40'
  - number: 5a
    text: |-
      1 Het is verboden zonder instemming van Onze Minister met een mobiele installatie in het
      continentaal plat een boorgat aan te leggen, uit te breiden of te wijzigen, tenzij de mobiele
      installatie is geplaatst bij of verbonden is aan een mijnbouwwerk en voor deze activiteit krachtens
      [artikel 40, tweede lid, eerste volzin, van de Mijnbouwwet][ref1] een vergunning is verleend.

      2 De instemming kan slechts in het belang van de bescherming van het milieu worden geweigerd.

      3 De instemming en de daarbij gestelde voorwaarden, beperkingen en voorschriften kunnen worden gewijzigd, voor
      zover de wijziging wordt gerechtvaardigd door het belang van de bescherming van het milieu.

      4 De instemming kan worden ingetrokken indien het aanleggen, uitbreiden of wijzigen van een boorgat met een mobiele
      installatie tot ontoelaatbare nadelige gevolgen voor het milieu kan leiden.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel40
    url: https://wetten.overheid.nl/BWBR0023771/2021-07-01#Artikel5a
