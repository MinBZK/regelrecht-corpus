preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Economische Zaken van 30 oktober 2007, nr. WJZ 7118005, in overeenstemming
    met Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer;

    Gelet op artikel 40, tweede lid, en negende lid, onderdeel a, van de Mijnbouwwet en de artikelen 8.40, 8.41 en 8.42
    van de Wet milieubeheer;

    De Raad van State gehoord (advies van 20 december 2007, nr. W10.07.0408/III);

    Gezien het nader rapport van Onze Minister van Economische Zaken van 28 maart 2008, nr. WJZ 8027133, uitgebracht in
    overeenstemming met Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0023771/2021-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. Onze Minister: Onze Minister van Economische Zaken;

      b. mobiele installatie: een verplaatsbare installatie voor het aanleggen, uitbreiden, wijzigen, testen,
      onderhouden, repareren of buiten gebruik stellen van een boorgat of het stimuleren van een voorkomen via een
      boorgat;

      c. onderzeese installatie: een geheel boven en beneden de bodem van een oppervlaktewater gelegen
      mijnbouwinstallatie die niet boven het oppervlaktewater uitsteekt;

      d. uitvoerder: de in [artikel 41, vierde lid, van de Mijnbouwwet][ref1] bedoelde persoon;

      e. woning: een gebouw of deel van een gebouw dat voor bewoning wordt gebruikt of daartoe is bestemd;

      f. geluidsgevoelige gebouwen: woningen en andere geluidsgevoelige gebouwen als bedoeld in
      [artikel 1 van de Wet geluidhinder][ref2], met uitzondering van gebouwen behorende bij de betreffende inrichting en
      gebouwen gelegen op een gezoneerd industrieterrein;

      g. geluidsgevoelige terreinen: geluidsgevoelige terreinen als bedoeld in [artikel 1 van de Wet geluidhinder][ref3],
      met uitzondering van terreinen behorende bij de betreffende inrichting en terreinen op een gezoneerd
      industrieterrein;

      h. ongewoon voorval: voorval als bedoeld in [artikel 17.1 van de Wet milieubeheer][ref4];

      i. bevoegd gezag: bestuursorgaan dat bevoegd is tot het geven van een beschikking of het nemen
      van een ander besluit alsmede het bestuursorgaan dat bevoegd zou zijn een vergunning krachtens
      [artikel 2.1, eerste lid, aanhef en onder e, van de Wet algemene bepalingen omgevingsrecht][ref5] of
      [artikel 40, tweede lid, van de Mijnbouwwet][ref6] voor de betrokken inrichting of installatie te verlenen;

      j. maatwerkvoorschrift: voorschrift dat nodig is ter bescherming van het milieu, inhoudende:

      1°. een beschikking waarbij het bevoegd gezag aanvullende eisen stelt; dan wel

      2°. een ontheffing waarbij het bevoegd gezag de daarbij aangewezen bepalingen niet van toepassing verklaart al dan
      niet onder het stellen van beperkingen of voorwaarden;

      k. NRB: Nederlandse Richtlijn Bodembescherming bedrijfsmatige activiteiten, uitgegeven door Infomil;

      l. PGS: Publicatiereeks Gevaarlijke Stoffen;

      m. motorrendement: het procentuele aandeel van de warmte-inhoud van de toegevoerde brandstoffen, dat bij de hoogste
      belasting waarbij de zuigermotor continu kan worden bedreven, bij ISO-luchtcondities, in arbeid wordt omgezet;

      n. ISO-luchtcondities: een temperatuur van 288° Kelvin, een druk van 101,3 kPa en een relatieve vochtigheid van
      60 procent;

      o. ETRS89 systeem: European Terrestrial Reference System 1989, bedoeld in bijlage II, onder 1.2, van Verordening
      (EU) nr. 1089/2010 van de Commissie van 23 november 2010 ter uitvoering van Richtlijn 2007/2/EG van het Europees
      Parlement en de Raad betreffende de interoperabiliteit van verzamelingen ruimtelijke gegevens en van diensten met
      betrekking tot ruimtelijke gegevens (PbEU 2010, L 323).


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel41
