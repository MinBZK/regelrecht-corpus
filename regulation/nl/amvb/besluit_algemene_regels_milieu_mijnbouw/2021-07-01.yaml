  - number: '8'
    text: |-
      1 De uitvoerder die het voornemen heeft om werkzaamheden uit te voeren in oppervlaktewater met een mobiele
      installatie als bedoeld in [artikel 6, tweede lid][ref1] , meldt ten minste twee weken voor de aanvang van die
      werkzaamheden schriftelijk of per elektronische post aan Onze Minister:

      a. de coördinaten berekend volgens het ETRS89 systeem;

      b. de naam, dan wel aanduiding en de eigenaar van de mobiele installatie;

      c. een samenvattende beschrijving van de mobiele installatie alsmede een opgave van het motorrendement van de bij
      de boring te gebruiken dieselmotoren en de generatoren;

      d. een samenvatting van de te verrichten werkzaamheden;

      e. de verwachte datum van de aanvang en beëindiging van de werkzaamheden;

      f. de resultaten van een akoestisch onderzoek als bedoeld in [artikel 19, onderdeel f][ref2], waaruit
      blijkt dat wordt voldaan aan de voorschriften ten aanzien van geluid, die zijn gesteld bij of krachtens de
      [artikelen 19][ref3] of [20][ref4] voor zover de mobiele installatie is gelegen in provinciaal ingedeeld gebied.

      2 Het eerste lid is van overeenkomstige toepassing met betrekking tot het veranderen van een mobiele installatie en
      het veranderen van de werkzaamheden.

      3 Van de melding, bedoeld in het eerste lid, wordt door Onze Minister kennisgegeven in de Staatscourant, in het
      geval dat de installatie in provinciaal ingedeeld gebied zal zijn of is gelegen.

      4 Indien de installatie in provinciaal ingedeeld gebied is gelegen, wordt een afschrift van de melding door Onze
      Minister toegezonden aan burgemeester en wethouders van de gemeente waarin de mobiele installatie zal zijn of is
      gelegen.

      5 De in het eerste lid, onder c tot en met f, vermelde gegevens behoeven niet te worden verstrekt, voor zover Onze
      Minister reeds over die gegevens beschikt.

      6 Een melding als bedoeld in het eerste lid blijft achterwege indien voor het aanleggen, het
      uitbreiden of het wijzigen van een boorgat met een mobiele installatie een vergunning als bedoeld in
      [artikel 2.1, eerste lid, aanhef en onder e, van de Wet algemene bepalingen omgevingsrecht][ref5] of een instemming
      als bedoeld in [artikel 5a, eerste lid][ref6], van dit besluit is verleend.


