  - number: '7'
    text: |-
      1 De uitvoerder die het voornemen heeft om werkzaamheden uit te voeren op land met een mobiele installatie als
      bedoeld in [artikel 6, eerste lid][ref1], meldt ten minste vier weken voor de aanvang van die werkzaamheden
      schriftelijk of per elektronische post aan Onze Minister:

      a. het adres, de kadastrale aanduiding en de ligging van de mobiele installatie met bijbehorend terrein ten
      opzichte van de directe nabijheid van geluidsgevoelige gebouwen en geluidsgevoelige terreinen;

      b. de naam dan wel nummer of aanduiding van de mobiele installatie alsmede de eigenaar;

      c. een samenvattende beschrijving van de mobiele installatie alsmede een opgave van het motorrendement van de bij
      de boring te gebruiken dieselmotoren en de generatoren;

      d. een samenvatting van de te verrichten werkzaamheden;

      e. de 10-6 per jaar veiligheidscontour voortvloeiend uit de berekening van het plaatsgebonden risico, als bedoeld
      in [artikel 44][ref2];

      f. de verwachte datum van de aanvang en die van de beëindiging van de werkzaamheden;

      g. de resultaten van een akoestisch onderzoek als bedoeld in [artikel 19, onderdeel f][ref3], waaruit
      blijkt dat wordt voldaan aan de voorschriften ten aanzien van geluid, die zijn gesteld bij of krachtens de
      [artikelen 19][ref4] of [20][ref5];

      h. de resultaten van een onderzoek naar de bodem op de plaats waar de mobiele installatie zal zijn of is
      gelegen en is uitgevoerd door een persoon of instelling die daartoe beschikt over een erkenning op grond van
      het [Besluit uitvoeringskwaliteit bodembeheer][ref6] en is gericht op de bodembedreigende stoffen die door de
      werkzaamheden met de mobiele installatie een bedreiging voor de bodemkwaliteit vormen en op de plaatsen waar
      bodembedreigende activiteiten plaatsvinden;

      i. het aantal transportbewegingen gedurende de dag (7.00–19.00), avond (19.00–23.00) en nacht (23.00–7.00).

      2 Het eerste lid is van overeenkomstige toepassing met betrekking tot het wijzigen van een mobiele installatie en
      het wijzigen van de werkzaamheden.

      3 Van de melding, bedoeld in het eerste lid, wordt door Onze Minister kennisgegeven in de Staatscourant.

      4 Een afschrift van de melding wordt door Onze Minister toegezonden aan burgemeester en wethouders van de gemeente
      waarin de mobiele installatie zal zijn of is gelegen.

      5 De in het eerste lid, onder c tot en met i, vermelde gegevens behoeven niet te worden verstrekt, voor zover Onze
      Minister reeds over die gegevens beschikt.

      6 Een melding als bedoeld in het eerste lid blijft achterwege indien voor het aanleggen, het
      uitbreiden of het wijzigen van een boorgat met een mobiele installatie een vergunning als bedoeld in
      [artikel 2.1, eerste lid, aanhef en onder e, van de Wet algemene bepalingen omgevingsrecht][ref7] is verleend.


