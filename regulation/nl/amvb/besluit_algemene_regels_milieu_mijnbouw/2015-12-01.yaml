    text: |-
      Het eerste lid is van overeenkomstige toepassing met betrekking tot het wijzigen van een mobiele installatie en het
      wijzigen van de werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel7
  - number: '7.3'
    text: |-
      Van de melding, bedoeld in het eerste lid, wordt door Onze Minister openbaar kennis gegeven in de Staatscourant en
      in één of meer dag-, nieuws- of huis-aan-huisbladen.
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel7
  - number: '7.4'
    text: |-
      Een afschrift van de melding wordt door Onze Minister toegezonden aan burgemeester en wethouders van de gemeente
      waarin de mobiele installatie zal zijn of is gelegen.
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel7
  - number: '7.5'
    text: |-
      De in het eerste lid, onder c tot en met i, vermelde gegevens behoeven niet te worden verstrekt, voor zover Onze
