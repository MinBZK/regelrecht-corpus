    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel7
  - number: '8.1'
    text: |-
      De uitvoerder die het voornemen heeft om werkzaamheden uit te voeren in oppervlaktewater met een mobiele
      installatie als bedoeld in [artikel 6, tweede lid][ref1] , meldt ten minste twee weken voor de aanvang van die
      werkzaamheden schriftelijk of per elektronische post aan Onze Minister:


      [ref1]: https://wetten.overheid.nl/BWBR0023771#Artikel6
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0023771
        artikel: '6'
        hoofdstuk: '2'
  - number: 8.1.a
    text: de coördinaten berekend volgens het stelsel van de Europese vereffening;
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel8
  - number: 8.1.b
    text: de naam, dan wel aanduiding en de eigenaar van de mobiele installatie;
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel8
  - number: 8.1.c
    text: |-
      een samenvattende beschrijving van de mobiele installatie alsmede een opgave van het motorrendement van de bij de
      boring te gebruiken dieselmotoren en de generatoren;
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel8
  - number: 8.1.d
    text: een samenvatting van de te verrichten werkzaamheden;
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel8
  - number: 8.1.e
    text: de verwachte datum van de aanvang en beëindiging van de werkzaamheden;
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel8
  - number: 8.1.f
    text: |-
      de resultaten van een akoestisch onderzoek als bedoeld in [artikel 19, onderdeel f][ref1], waaruit blijkt dat wordt
      voldaan aan de voorschriften ten aanzien van geluid, die zijn gesteld bij of krachtens de [artikelen 19][ref2] of
      [20][ref3] voor zover de mobiele installatie is gelegen in provinciaal ingedeeld gebied.


      [ref1]: https://wetten.overheid.nl/BWBR0023771#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0023771#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0023771#Artikel20
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0023771
        artikel: '19'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0023771
        artikel: '19'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0023771
        artikel: '20'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '8.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing met betrekking tot het veranderen van een mobiele installatie en
      het veranderen van de werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel8
  - number: '8.3'
    text: |-
      Van de melding, bedoeld in het eerste lid, wordt door Onze Minister openbaar kennis gegeven in de Staatscourant
      en in één of meer dag-, nieuws- of huis-aan-huisbladen, in het geval dat de installatie in provinciaal ingedeeld
      gebied zal zijn of is gelegen;
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel8
  - number: '8.4'
    text: |-
      Indien de installatie in provinciaal ingedeeld gebied is gelegen, wordt een afschrift van de melding door Onze
      Minister toegezonden aan burgemeester en wethouders van de gemeente waarin de mobiele installatie zal zijn of is
      gelegen.
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel8
  - number: '8.5'
    text: |-
      De in het eerste lid, onder c tot en met f, vermelde gegevens behoeven niet te worden verstrekt, voor zover Onze
      Minister reeds over die gegevens beschikt.
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel8
  - number: '9'
    text: |-
      In dit hoofdstuk wordt verstaan onder «terrein»: terrein waarop met een mobiele installatie werkzaamheden
      plaatsvinden of hebben plaatsgevonden die samenhangen met de opsporing of winning van delfstoffen of aardwarmte dan
      wel de opslag van stoffen en dat ten behoeve van deze activiteiten in stand wordt gehouden.
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel9
  - number: '10'
    text: |-
      Indien zich op een mobiele installatie en bijbehorend terrein een ongewoon voorval voordoet of heeft voorgedaan
      waardoor nadelige gevolgen voor het milieu zijn ontstaan of dreigen te ontstaan, meldt de uitvoerder het ongewoon
      voorval zo spoedig mogelijk telefonisch aan de inspecteur-generaal der mijnen. De uitvoerder bevestigt de melding
      binnen 24 uur schriftelijk.
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel10
  - number: '11.1'
    text: |-
      Op de buitengrens van het terrein is een stevig minimaal twee meter hoog hekwerk geplaatst waarvan de
      toegangsdeuren naar buiten opendraaien.
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel11
  - number: '11.2'
    text: |-
      Toegang tot het terrein hebben slechts personen die daartoe bevoegd zijn en de controle daarop vindt plaats door
      de uitvoerder.
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel11
  - number: '12.1'
    text: |-
      Het terrein is schoon en er bevindt zich geen materiaal op het terrein dat niet noodzakelijk is voor het doel
      waarvoor het terrein is ingericht.
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel12
  - number: '12.2'
    text: |-
      Op het terrein aanwezige begroeiing wordt kort gehouden en dood hout, bladeren, afgesneden onkruid of gras worden
      verwijderd.
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel12
  - number: '12.3'
    text: |-
      Bij het schoon houden, kort houden van begroeiing en verwijderen van dood hout, bladeren afgesneden, onkruid of
      gras wordt op plaatsen waar gevaar voor explosieve verbranding niet is uitgesloten geen apparatuur of gereedschap
      gebruikt die vonken kan veroorzaken.
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel12
  - number: '13'
    text: |-
      De op het terrein aanwezige boorputten zijn voorzien van een doeltreffende beveiliging tegen aanrijding en vallende
      objecten.
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel13
  - number: '14'
    text: |-
      Op het terrein treft de uitvoerder doeltreffende maatregelen en voorzieningen om laad- en loswerkzaamheden lekvrij
      te doen geschieden en waardoor het wegvloeien van stoffen wordt voorkomen.
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel14
  - number: '15.1'
    text: |-
      Het terrein is voorzien van buitenverlichting voor zover die noodzakelijk is voor het verrichten van werkzaamheden
      en het voorkomen van gevaar.
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel15
  - number: '15.2'
    text: |-
      De hoogte van de installatie van de buitenverlichting en het gebruik ervan gaat niet verder dan noodzakelijk is
      voor het verrichten van de nodige werkzaamheden of het handhaven van de veiligheid.
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel15
  - number: '15.3'
    text: |-
      De verlichting is zodanig opgesteld en ingericht en de lampen zijn zodanig afgeschermd dat hinderlijke
      lichtstraling voor de omgeving en het milieu en directe instraling in woningen wordt voorkomen.
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel15
  - number: '16.1'
    text: |-
      De uitvoerder stelt na overleg met de commandant van de plaatselijke bandweer een brandbestrijdingsplan op en zorgt
      er voor dat het plan tijdens het boren op de locatie aanwezig is.
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel16
  - number: '16.2'
    text: |-
      Bij ministeriële regeling worden regels gegeven met betrekking tot de informatie die het brandbestrijdingsplan
      bevat.
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel16
  - number: '17'
    text: De mobiele installatie wordt schoon gehouden en verkeert steeds in goede staat van onderhoud.
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel17
  - number: '18'
    text: 'In deze paragraaf wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel18
  - number: 18.a
    text: |-
      langtijdgemiddeld beoordelingsniveau: (L) het gemiddelde van de afwisselende niveaus van het ter plaatse optredende
      geluid, gemeten in een bepaalde periode en vastgesteld en beoordeeld overeenkomstig de Handleiding meten en rekenen
      industrielawaai;
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel18
  - number: 18.b
    text: |-
      maximaal geluidsniveau: (L) maximaal geluidsniveau, gemeten in de meterstand «F» of «fast», als vastgesteld en
      beoordeeld overeenkomstig de Handleiding meten en rekenen industrielawaai;
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel18
  - number: 18.c
    text: |-
      geluidsniveau: geluidsniveau in dB(A) als bedoeld in [artikel 1 van de Wet geluidhinder][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel1
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '1'
  - number: '19'
    text: |-
      Voor het langtijdgemiddeld beoordelingsniveau (L) en het maximaal geluidsniveau (L), veroorzaakt door de mobiele
      installatie en de in verband met de mobiele installatie verrichte werkzaamheden en activiteiten geldt:
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel19
  - number: 19.a
    text: |-
      de niveaus op de in de tabel I genoemde plaatsen en tijdstippen bedragen niet meer dan de in die tabel aangegeven
      waarden:
              Tabel I











                      07:00–19:00 uur


                      19:00–23:00 uur


                      23:00–07:00 uur






                      L, op een afstand van 300 meter vanaf de mobiele installatie



                      60 dB(A)


                      55 dB(A)


                      50 dB(A)




                      L in geluidsgevoelige gebouwen op een afstand van 300 meter of minder vanaf de mobiele installaties



                      40 dB(A)


                      35 dB(A)


                      30 dB(A)




                      L op een afstand van 300 meter vanaf de mobiele installatie



                      70 dB(A)


                      65 dB(A)


                      60 dB(A)
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel19
  - number: 19.b
    text: |-
      de in tabel I opgenomen maximale geluidsniveaus (L) zijn niet van toepassing op het laden en lossen,
      transportbewegingen, pipehandling en het verbranden van (aard)gas in de open lucht;
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel19
  - number: 19.c
    text: |-
      de activiteiten, genoemd onder b, vinden plaats tussen 07:00 en 19:00 uur, tenzij dit redelijkerwijs niet mogelijk
      is;
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel19
  - number: 19.d
    text: |-
      de in de tabel aangegeven waarden in geluidsgevoelige gebouwen gelden alleen indien de gebruiker ervan toestemming
      geeft voor het in redelijkheid uitvoeren of doen uitvoeren van geluidmetingen;
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel19
  - number: 19.e
    text: |-
      als er een geluidsgevoelig gebouw aanwezig is binnen 300 meter vanaf het hart van de boorinstallatie, monitort
      en registreert de uitvoerder het geluid continu. De monitoring geschiedt zodanig dat een goede indicatie wordt
      verkregen van het equivalent geluidsniveau op de gevel van de meest met geluid belaste woning;
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel19
  - number: 19.f
    text: |-
      als er een geluidsgevoelig gebouw aanwezig is binnen 300 meter vanaf het hart van de boorinstallatie wordt
      voorafgaand aan de boring in een rapport van een akoestisch onderzoek op grond van verrichte geluidsmetingen of
      geluidsberekeningen aangetoond dat aan de geluidniveaus uit tabel I, dan wel volgens een maatwerkvoorschrift als
      bedoeld in [artikel 20][ref1], kan worden voldaan. In het rapport wordt aangegeven welke voorzieningen worden
      getroffen om te voorkomen dat de geldende geluidniveaus worden overschreden. Het akoestisch onderzoek wordt
      uitgevoerd overeenkomstig de Handleiding meten en rekenen met industrielawaai. De resultaten van dit akoestische
      onderzoek worden uiterlijk vier weken voorafgaand aan de boring bij de inspecteur-generaal der mijnen ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0023771#Artikel20
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0023771
        artikel: '20'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '20.1'
    text: |-
      Onze Minister kan bij maatwerkvoorschrift waarden stellen die hoger zijn dan de waarden die zijn vermeld in Tabel
      I, indien de waarden in Tabel I naar het oordeel van Onze Minister op basis van de beste beschikbare techniek niet
      haalbaar zijn.
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel20
  - number: '20.2'
    text: |-
      Onze Minister kan bij maatwerkvoorschrift waarden stellen die lager zijn dan de waarden die vermeld zijn in
      Tabel I, indien naar het oordeel van Onze Minister lagere waarden uit een oogpunt van bescherming van het milieu
      noodzakelijk zijn voor zover die op basis van de beste beschikbare techniek technisch haalbaar zijn.
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel20
  - number: '20.3'
    text: |-
      Van een beschikking als bedoeld in het eerste en tweede lid wordt kennis gegeven in de Staatscourant en in een of
      meer dag-, nieuws- of huis-aan huis-bladen.
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel20
  - number: '20.4'
    text: |-
      Indien een maatwerkvoorschrift als bedoeld in het eerste lid waarden tot gevolg heeft die aanzienlijke
      gevolgen voor het milieu kunnen hebben, is op de voorbereiding van het maatwerkvoorschrift
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: '21.1'
    text: |-
      Voor de etmaalwaarde van de verkeersbewegingen van en naar de mobiele installatie geldt een streefwaarde van 50
      dB(A).
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel21
  - number: '21.2'
    text: |-
      Bij ministeriele regeling worden regels gegeven betreffende de beoordeling van etmaalwaarden van de
      verkeersbewegingen.
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel21
  - number: '22.1'
    text: |-
      Het terrein waarop de mobiele installatie zich bevindt, is zodanig ingericht en onderhouden, dat geurhinder wordt
      voorkomen.
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel22
  - number: '22.2'
    text: |-
      Het gebruik van chemische stoffen is verboden indien deze buiten het terrein waarop de mobiele installatie zich
      bevindt geurhinder veroorzaken.
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel22
  - number: '22.3'
    text: |-
      De aanwezigheid van flensverbindingen in leidingen, waardoor geurverwekkende gassen of vloeistoffen worden
      getransporteerd, wordt zoveel mogelijk vermeden.
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel22
  - number: '23.1'
    text: |-
      De uitworp van stikstofoxiden met het rookgas van een zuigermotor voor de opwekking van elektriciteit wordt
      binnen vier weken na aanvang van de werkzaamheden door een afzonderlijke meting bepaald. Desgevraagd worden de
      meetgegevens aan de inspecteur-generaal der mijnen overgelegd.
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel23
  - number: '23.2'
    text: |-
      Bij ministeriële regeling worden regels gegeven betreffende de meetmethoden van de meting bedoeld in het eerste
      lid.
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel23
  - number: '23.3'
    text: |-
      Een meting als bedoeld in het eerste lid is niet nodig indien wordt aangetoond dat een dergelijke meting binnen
      drie jaar voorafgaand aan de werkzaamheden verricht is en de resultaten van de meting worden overgelegd.
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel23
  - number: '24.1'
    text: |-
      In geval van het gebruik van een fakkel is deze ontworpen met het oog op optimale afgasverbranding met een minimum
      rendement van 99%.
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel24
  - number: '24.2'
    text: |-
      Minimaal 48 uur voorafgaand aan het affakkelen wordt een fakkelprogramma ingediend bij de inspecteur-generaal der
      mijnen, waarin aandacht wordt besteed aan:
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel24
  - number: 24.2.a
    text: duur van het fakkelen;
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel24
  - number: 24.2.b
    text: tijdstip waarop het fakkelen plaats zal vinden;
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel24
  - number: 24.2.c
    text: maatregelen om geluidsbelasting voor omwonenden te voorkomen, dan wel te beperken.
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel24
  - number: '24.3'
    text: |-
      De inspecteur-generaal der mijnen kan eisen stellen aan het affakkelen ter bescherming van het milieu en ter
      voorkoming van geluidoverlast.
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel24
  - number: '25'
    text: |-
      Emissies van gassen die vrijkomen bij het testen van boorgaten en het schoon produceren ervan en de hoeveelheid
      verbrand gas/condensaat worden geregistreerd in een meet- en registratiesysteem.
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel25
  - number: '26'
    text: 'In deze paragraaf wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel26
  - number: 26.a
    text: 'NEN: door de stichting Nederlands Normalisatie-instituut uitgegeven norm;'
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel26
  - number: 26.b
    text: |-
      bodembeschermende maatregel: op de gebezigde stoffen en gebruikte bodembeschermende voorziening toegesneden
      beheermaatregel gericht op reparatie, schoonmaak, onderhoud, actie bij incidenten, bedrijfsinterne controle,
      inspectie of toezicht, ter voorkoming van immissies in de bodem of herstel van de effecten van zulke immissies op
      de bodemkwaliteit, waarvan de uitvoering is gewaarborgd;
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel26
  - number: 26.c
    text: |-
      bodembeschermende voorziening: een vloeistofkerende voorziening, een vloeistofdichte vloer of verharding of een
      andere doelmatige fysieke voorziening, ter voorkoming van immissies in de bodem;
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel26
  - number: 26.d
    text: |-
      lekbak: een voorziening waarvan de bodembeschermende werking door de daarop afgestemde bodembeschermende
      maatregelen is gewaarborgd, en die zich rondom of onder een bodembedreigende activiteit bevindt en in staat is de
      bij normale bedrijfsvoering gemorste of wegspattende vloeistoffen op te vangen;
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel26
  - number: 26.e
    text: |-
      vloeistofdichte vloer of verharding: vloer of verharding direct op de bodem die waarborgt dat geen vloeistof aan de
      niet met vloeistof belaste zijde van die vloer kan komen.
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel26
  - number: '27'
    text: |-
      Op het terrein waarop de mobiele installatie zich bevindt, worden bodembeschermende voorzieningen en
      bodembeschermende maatregelen, getroffen die voldoen aan eisen gesteld in de NRB. Voor putkelders gelden de eisen
      van bodemrisico categorie A en voor het overige gebied de eisen van bodemrisico categorie A of A*.
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel27
  - number: '28.1'
    text: |-
      Indien het terrein niet voldoet aan de eisen van bodemrisicocategorie A, maar aan die van A*, worden vier
      grondwaterpeilbuizen geïnstalleerd die zodanig zijn geplaatst dat bodemverontreiniging door (hulp)stoffen die bij
      het uitvoeren van boringen worden gebruikt, kunnen worden gesignaleerd.
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel28
  - number: '28.2'
    text: |-
      De grondwaterpeilbuizen, bedoeld in het eerste lid, worden zo vaak als de omstandigheden daartoe aanleiding geven,
      doch in ieder geval voorafgaande aan de werkzaamheden, binnen zes maanden na beëindiging van de werkzaamheden en
      daarna iedere vijf jaren bemonsterd en geanalyseerd volgens NEN 5744.
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel28
  - number: '28.3'
    text: |-
      De resultaten van de bemonstering en analyse worden ten minste vijf jaar bewaard en worden op verzoek getoond aan
      de inspecteur-generaal der mijnen.
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel28
  - number: '28.4'
    text: |-
      De installatie van een grondwaterpeilbuis als bedoeld in het eerste en tweede lid, alsmede de bemonstering en
      analyse als bedoeld in het tweede lid, vinden plaats door een persoon of instelling, die voor deze werkzaamheid
      beschikt over een erkenning op grond van het [Besluit bodemkwaliteit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022929
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0022929
  - number: '29'
    text: |-
      Indien uit een onderzoek als bedoeld in [artikel 28][ref1] blijkt dat de bodem als gevolg van de activiteiten
      op het terrein is aangetast of verontreinigd, dan wel door welke andere oorzaak dan ook bodemverontreiniging is
      ontstaan:


      [ref1]: https://wetten.overheid.nl/BWBR0023771#Artikel28
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0023771
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: 29.a
    text: |-
      draagt de uitvoerder er zorg voor dat het beperken en zoveel mogelijk ongedaan maken van de verontreiniging of
      de aantasting en de directe gevolgen daarvan, geschiedt door een persoon of een instelling die beschikt over een
      erkenning op grond van het [Besluit uitvoeringskwaliteit bodembeheer][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0019963
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0019963
  - number: 29.b
    text: zorgt de uitvoerder onverwijld voor melding ervan aan de inspecteur-generaal der mijnen;
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel29
  - number: 29.c
    text: |-
      meldt de uitvoerder de afronding van de werkzaamheden, bedoeld onder a, direct aan de inspecteur-generaal der
      mijnen door middel van een verklaring van de persoon of instelling, bedoeld onder a.
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel29
  - number: '30.1'
    text: |-
      De controle, het onderhoud en het beheer van bodembeschermende voorzieningen wordt in eenduidige interne
      bedrijfsprocedures en werkinstructies ter bescherming van de bodem vastgelegd, waarin tenminste is aangegeven op
      welke wijze:
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel30
  - number: 30.1.a
    text: |-
      de staat en goede werking wordt gecontroleerd van bodembeschermende voorzieningen en verpakkingen en apparatuur
      waarin vloeibare bodembedreigende stoffen worden opgeslagen of getransporteerd;
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel30
  - number: 30.1.b
    text: |-
      er voor zorg wordt gedragen dat zo vaak als de omstandigheden daarom vragen inspecties op morsingen en lekkages
      plaatsvinden en
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel30
  - number: 30.1.c
    text: is gewaarborgd dat gemorst of gelekte stoffen direct worden opgeruimd.
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel30
  - number: '30.2'
    text: |-
      De uitvoerder draagt er zorg voor dat de medewerkers die binnen de inrichting bodembedreigende activiteiten
      verrichten, op de hoogte zijn van de interne bedrijfsprocedures en werkinstructies als bedoeld in het eerste lid,
      dat deze worden nageleefd en op het terrein zodanig aanwezig zijn dat een ieder daarvan op eenvoudige wijze kennis
      kan nemen.
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel30
  - number: '30.3'
    text: |-
      De controle, het onderhoud en het beheer van bodembeschermende voorzieningen vinden zodanig plaats dat vrijgekomen
      stoffen zijn verwijderd voordat deze in de bodem kunnen geraken.
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel30
  - number: '30.4'
    text: |-
      Morsingen en lekkages worden overeenkomstig de interne bedrijfsprocedures en werkinstructies als bedoeld in het
      eerste lid, verholpen en opgeruimd.
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel30
  - number: '30.5'
    text: |-
      De uitvoerder draagt er zorg voor dat de in het kader van de interne bedrijfsprocedures en werkinstructies
      noodzakelijke middelen ter bescherming van de bodem binnen het terrein in voldoende mate aanwezig zijn en dat er
      voldoende, in het gebruik van deze middelen, geïnstrueerd personeel aanwezig is.
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel30
  - number: '30.6'
    text: |-
      Bevindingen van controles van of onderhoud aan bodembeschermende voorzieningen, alsmede acties genomen na
      incidenten met bodembedreigende stoffen worden opgenomen in een logboek dat te allen tijde beschikbaar is voor de
      inspecteur-generaal der mijnen.
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel30
  - number: '31.1'
    text: |-
      Een bodembeschermende voorziening is zo uitgevoerd dat gemorste of weggelekte vloeibare bodembedreigende stoffen
      effectief worden opgevangen en kunnen worden opgeruimd.
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel31
  - number: '31.2'
    text: |-
      Een vloeistofdichte vloer of verharding, een lekbak of een andere opvangbak, die wordt gebruikt als
      bodembeschermende voorziening is bestand tegen de inwerking van de desbetreffende vloeibare bodembedreigende
      stoffen en de condities waaronder deze stoffen worden gebruikt of opgeslagen.
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel31
  - number: '31.3'
    text: |-
      Lekbakken en andere opvangbakken zijn zodanig uitgevoerd dat er geen hemelwater in terecht kan komen, tenzij het
      hemelwater direct wordt verwijderd op een zodanige wijze dat de bodembeschermende werking van de voorziening niet
      negatief wordt beïnvloed.
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel31
  - number: '31.4'
    text: |-
      Lekbakken en andere opvangbakken waarin vloeibare bodembedreigende stoffen in verpakking of in een opslagtank
      worden opgeslagen, hebben een opvangcapciteit die ten minste gelijk is aan het volume van de inhoud van de grootste
      verpakkingseenheid of opslagtank vermeerderd met 10%, met dien verstande dat de opvangcapaciteit ten minste 10% is
      van het volume van alle opgeslagen stoffen.
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel31
  - number: '32'
    text: |-
      Bedrijfsafvalwater wordt opgevangen en afgevoerd naar een daartoe bevoegde verwerker, dan wel, indien de beheerder
      van het vuilwaterriool daartoe toestemming geeft, via het vuilwaterriool.
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel32
  - number: '33'
    text: |-
      Voordat het terrein waarop de mobiele installatie zich bevindt, wordt verlaten, wordt door een persoon of
      instelling die daartoe op grond van het [Besluit uitvoeringskwaliteit bodembeheer][ref1] is erkend, een
      eindsituatie-onderzoek van de bodem verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0019963
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0019963
  - number: '34'
    text: |-
      In deze paragraaf wordt onder ADR verstaan de op 30 september 1957 te Genève totstandgekomen Europese Overeenkomst
      betreffende het internationale vervoer van gevaarlijke stoffen over de weg (Trb. 1959, 171).
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel34
  - number: '35'
    text: Het ontstaan van afvalstoffen wordt zoveel mogelijk voorkomen of beperkt.
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel35
  - number: '36.1'
    text: |-
      Afvalstoffen zijn in goed gesloten, niet lekkend, tegen weersinvloeden bestendig en zonodig geurhinder voorkomend
      verpakkingsmateriaal verpakt en worden zo spoedig mogelijk afgevoerd.
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel36
  - number: '36.2'
    text: Oliehoudend boorgruis wordt afgevoerd in goed afgesloten vloeistofdichte containers.
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel36
  - number: '37.1'
    text: |-
      Bij ministeriële regeling aangewezen gevaarlijke afvalstoffen worden van elkaar en van andere afvalstoffen
      gescheiden, gescheiden gehouden en gescheiden afgegeven.
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel37
  - number: '37.2'
    text: |-
      Andere dan de in het eerste lid bedoelde afvalstoffen worden gescheiden, gescheiden gehouden en gescheiden
      afgegeven, tenzij dit redelijkerwijs niet mogelijk is.
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel37
  - number: '38.1'
    text: |-
      Opslag van vloeibare en vaste verpakte gevaarlijke stoffen, die zijn ingedeeld in de klassen 3, 5.1, 6.1, 8 en 9
      van het ADR, vindt plaats volgens hoofdstuk 3 van PGS 15.
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel38
  - number: '38.2'
    text: |-
      Opslag van gasvormige gevaarlijke stoffen in gasflessen, spuitbussen en gaspatronen die zijn ingedeeld in klasse 2
      van het ADR vindt plaats volgens de hoofdstukken 6 en 7 van PGS 15.
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel38
  - number: '39'
    text: Opslag van dieselolie vindt plaats volgens PGS 30.
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel39
  - number: '40.1'
    text: |-
      Bij het inwerking hebben van de mobiele installatie streeft de uitvoerder naar een zo hoog mogelijke energie-
      efficiency.
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel40
  - number: '40.2'
    text: |-
      Onze Minister kan met betrekking tot de energie-efficiency van de bij een boring te gebruiken dieselmotoren en
      generatoren maatwerkvoorschriften stellen.
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel40
  - number: '41'
    text: |-
      Tijdens het transport van de mobiele installatie en het bij het gebruik van de mobiele installatie benodigde en
      vrijkomende materiaal van en naar een terrein worden de vorming en verspreiding van stof voorkomen. De aan- en
      afvoerroute van de mobiele installatie en het benodigde en vrijkomende materiaal wordt in overeenstemming met de
      gemeente en de wegbeheerder vastgesteld.
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel41
  - number: '42'
    text: 'Voor zover documenten met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel42
  - number: 42.a
    text: |-
      de monitoring van het geluid, de registratie van luchtemissies, de bemonstering van het grondwater en de
      registratie met betrekking tot bodembeschermende voorzieningen op basis van de [artikelen 19][ref1], [23][ref2],
      [25][ref3], [28][ref4] en [30][ref5],


      [ref1]: https://wetten.overheid.nl/BWBR0023771#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0023771#Artikel23
      [ref3]: https://wetten.overheid.nl/BWBR0023771#Artikel25
      [ref4]: https://wetten.overheid.nl/BWBR0023771#Artikel28
      [ref5]: https://wetten.overheid.nl/BWBR0023771#Artikel30
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0023771
        artikel: '19'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0023771
        artikel: '23'
        hoofdstuk: '3'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0023771
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0023771
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '4'
      - id: ref5
        bwb_id: BWBR0023771
        artikel: '30'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: 42.b
    text: onderhoudscontracten met betrekking tot op de mobiele installatie aanwezige installaties,
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel42
  - number: 42.c
    text: 'certificaten of bewijzen van:'
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel42
  - number: 42.c.1°
    text: tanks, filters en andere voorzieningen,
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel42
  - number: 42.c.2°
    text: onderhoud of keuringen van op de mobiele installatie aanwezige voorzieningen en installaties,
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel42
  - number: 42.d
    text: de veiligheidsinformatiebladen die behoren bij de op de mobiele installatie.
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel42
  - number: 42.e
    text: aanwezige gevaarlijke stoffen,
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel42
  - number: '43.1'
    text: |-
      Er is een handleiding op de mobiele installatie aanwezig waarin regels zijn gesteld door de uitvoerder ten aanzien
      van transportbewegingen, pipehandling, het verbranden van aardgas in de openlucht en andere geluidsintensieve
      activiteiten.
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel43
  - number: '43.2'
    text: De regels, bedoeld in het eerste lid, beperken de schade aan milieu en overlast voor de omgeving zo goed mogelijk.
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel43
  - number: '43.3'
    text: |-
      De uitvoerder draagt er zorg voor dat een ieder die werkzaam is op de mobiele installatie bekend is met de
      handleiding en de regels, bedoeld in het eerste lid, naleeft.
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel43
  - number: '44'
    text: |-
      De uitvoerder berekent het plaatsgebonden risico voorafgaand aan de boring, overeenkomstig het
      [Besluit externe veiligheid inrichtingen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0016767
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0016767
  - number: '45'
    text: |-
      Het boren en het afwerken van de put zijn niet toegestaan indien zich een kwetsbare bestemming, zoals gedefinieerd
      in het [Besluit externe veiligheid inrichtingen][ref1], binnen de contour van 10-6/jaar van de volgens
      [artikel 44][ref2] berekende waarde van het plaatsgebonden risico bevindt.


      [ref1]: https://wetten.overheid.nl/BWBR0016767
      [ref2]: https://wetten.overheid.nl/BWBR0023771#Artikel44
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0016767
      - id: ref2
        bwb_id: BWBR0023771
        artikel: '44'
        hoofdstuk: '3'
        paragraaf: '9'
  - number: '46'
    text: |-
      Indien zich op een mobiele installatie een ongewoon voorval voordoet of heeft voorgedaan waardoor nadelige gevolgen
      voor het milieu zijn ontstaan of dreigen te ontstaan, meldt de uitvoerder het ongewoon voorval zo spoedig mogelijk
      telefonisch aan de inspecteur-generaal der mijnen. De uitvoerder bevestigt de melding binnen 24 uur schriftelijk.
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel46
  - number: '47.1'
    text: |-
      De buitenverlichting op de mobiele installatie blijft ter bescherming van het milieu beperkt tot het niveau dat
      noodzakelijk is voor het verrichten van de nodige werkzaamheden of ter voorkoming van gevaar.
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel47
  - number: '47.2'
    text: |-
      De lampen van de buitenverlichting branden uitsluitend voor zover dat voor het verrichten van werkzaamheden of in
      verband met de veiligheid noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel47
  - number: '48'
    text: |-
      De mobiele installatie wordt schoon gehouden, verkeert steeds in goede staat van onderhoud en wordt vrijgehouden
      van voor de werking van de installatie onnodig materiaal, zodat geen verontreinigende stoffen in het milieu kunnen
      komen.
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel48
  - number: '49.1'
    text: Doeltreffende maatregelen zijn genomen om laad- en loswerkzaamheden lekvrij te doen geschieden.
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel49
  - number: '49.2'
    text: |-
      Op plaatsen waar laad- en loswerkzaamheden worden verricht zijn zodanige voorzieningen getroffen of maatregelen
      genomen dat het weglekken van stoffen door opvang of anderszins wordt voorkomen.
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel49
  - number: '50'
    text: |-
      De mobiele installatie wordt zodanig in bedrijf gehouden en onderhouden dat de geluidemissie tot een minimum wordt
      beperkt.
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel50
  - number: '51'
    text: |-
      Voor zover de mobiele installatie is gelegen in provinciaal ingedeeld gebied zijn de [artikelen 18][ref1],
      [19][ref2] en [20][ref3] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0023771#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0023771#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0023771#Artikel20
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0023771
        artikel: '18'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0023771
        artikel: '19'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0023771
        artikel: '20'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '52.1'
    text: |-
      Een zuigermotor met een asvermogen van meer dan 130 kW waarin het aandeel van gasvormige brandstoffen in de warmte-
      inhoud van de toegevoerde brandstoffen minder dan 50 procent bedraagt, wordt zodanig gebruikt dat, teruggerekend op
      ISO-luchtcondities, de uitworp van stikstofoxiden met het rookgas, betrokken op de warmte-inhoud van de toegevoerde
      brandstof, niet meer bedraagt dan 2722 g/GJ (=9.8 g/kWh).
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel52
  - number: '52.2'
    text: Het eerste lid geldt niet voor een zuigermotor voor de aandrijving van een noodstroomgenerator.
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel52
  - number: '53.1'
    text: |-
      De uitworp van stikstofoxiden met het rookgas van een zuigermotor voor de opwekking van elektriciteit wordt
      binnen vier weken na aanvang van de werkzaamheden door een afzonderlijke meting bepaald. Desgevraagd worden de
      meetgegevens aan de inspecteur-generaal der mijnen overgelegd.
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel53
  - number: '53.2'
    text: |-
      Bij ministeriële regeling worden regels gegeven betreffende de meetmethoden van de meting bedoeld in het eerste
      lid.
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel53
  - number: '53.3'
    text: |-
      Een meting als bedoeld in het eerste lid is niet nodig indien kan worden aangetoond dat een dergelijke meting
      binnen drie jaar voorafgaand aan de werkzaamheden verricht is en de resultaten van de meting kunnen worden
      overgelegd.
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel53
  - number: '54.1'
    text: |-
      In het geval van het testen van boorgaten en het schoonproduceren ervan wordt minimaal 48 uur voorafgaand aan het
      verbranden een testprogramma afgegeven bij de inspecteur-generaal der mijnen, waarin aandacht wordt besteed aan:
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel54
  - number: 54.1.a
    text: de duur van de test;
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel54
  - number: 54.1.b
    text: het tijdstip waarop het verbranden plaats zal vinden;
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel54
  - number: 54.1.c
    text: maatregelen ter voorkoming van vogelsterfte.
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel54
  - number: '54.2'
    text: |-
      In voorkomend geval kan de inspecteur-generaal der mijnen in het belang van het milieu aanvullende eisen stellen
      aan het testprogramma.
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel54
  - number: '55'
    text: |-
      De continue en incidentele emissies van de stoffen als bedoeld in de [artikelen 53][ref1] en [54][ref2] die
      bij de werkzaamheden vrijkomen en de hoeveelheid verbrand gas/condensaat worden geregistreerd in een meet- en
      registratiesysteem.


      [ref1]: https://wetten.overheid.nl/BWBR0023771#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0023771#Artikel54
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0023771
        artikel: '53'
        hoofdstuk: '4'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0023771
        artikel: '54'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: '56.1'
    text: |-
      Installaties op een mijnbouwwerk die een koudemiddel bevatten en zich bevinden op het continentaal plat worden
      onderhouden in overeenstemming met het [Besluit gefluoreerde broeikasgassen en ozonlaagafbrekende stoffen](529359).
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel56
  - number: '56.2'
    text: |-
      Installaties met een inhoud gelegen tussen 3 kg en 30 kg dan wel meer dan 30 kg koudemiddel op een
      mijnbouwinstallatie die vanuit het buitenland de Nederlandse wateren binnenkomt, worden zo spoedig mogelijk
      onderworpen aan een periodieke keuring, tenzij een dergelijke keuring reeds heeft plaatsgevonden in de voorafgaande
      twaalf respectievelijk drie maanden.
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel56
  - number: '57'
    text: |-
      De uitvoerder neemt maatregelen om het ontstaan van afvalstoffen en gevaarlijke stoffen of afvalstoffen zoveel
      mogelijk te voorkomen.
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel57
  - number: '58.1'
    text: |-
      Afvalstoffen zijn in goed gesloten, niet lekkend, tegen weersinvloeden bestendig en zonodig geurhinder voorkomend
      verpakkingsmateriaal verpakt en worden zo spoedig mogelijk afgevoerd.
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel58
  - number: '58.2'
    text: Oliehoudend boorgruis wordt afgevoerd in goed afgesloten vloeistofdichte containers.
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel58
  - number: '59'
    text: |-
      De uitvoerder houdt een register bij waarin onder vermelding van de datum van afvoer nauwkeurig aantekening wordt
      gehouden van de soort en hoeveelheid van de van de mobiele installatie afgevoerde afvalstoffen.
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel59
  - number: '60'
    text: |-
      De richtlijnen van de «Opslag van verpakte gevaarlijke stoffen» (PGS 15,) zijn van overeenkomstige toepassing op de
      opslag van gevaarlijke stoffen in emballage.
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel60
  - number: '61.1'
    text: |-
      Bij het inwerking hebben van de mobiele installatie streeft de uitvoerder naar een zo hoog mogelijke energie-
      efficiency.
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel61
  - number: '61.2'
    text: |-
      Onze Minister kan met betrekking tot de energie-efficiency van de bij een boring te gebruiken dieselmotoren en
      generatoren maatwerkvoorschriften stellen.
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel61
  - number: '62'
    text: 'Voor zover:'
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel62
  - number: 62.a
    text: |-
      documenten met betrekking tot de registratie van luchtemissies en de registratie van afvalstoffen op basis van de
      [artikelen 55][ref1] en [59][ref2],


      [ref1]: https://wetten.overheid.nl/BWBR0023771#Artikel55
      [ref2]: https://wetten.overheid.nl/BWBR0023771#Artikel59
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0023771
        artikel: '55'
        hoofdstuk: '4'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0023771
        artikel: '59'
        hoofdstuk: '4'
        paragraaf: '4'
  - number: 62.b
    text: onderhoudscontracten met betrekking tot op de mobiele installatie aanwezige installaties,
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel62
  - number: 62.c
    text: 'certificaten of bewijzen van:'
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel62
  - number: 62.c.1°
    text: de tanks, filters en andere voorzieningen,
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel62
  - number: 62.c.2°
    text: onderhoud of keuringen van op de mobiele installatie aanwezige voorzieningen en installaties,
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel62
  - number: 62.d
    text: de veiligheidsinformatiebladen, die behoren bij de op de mobiele installatie aanwezige gevaarlijke stoffen,
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel62
  - number: '63'
    text: De onderzeese installatie verkeert in goede staat van onderhoud.
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel63
  - number: '64'
    text: |-
      Lozing van stoffen is verboden, met uitzondering van stoffen die vrijkomen bij de bediening van de kleppen van
      de onderzeese installatie. De uitvoerder treft maatregelen zodat lozing van deze stoffen zo goed mogelijk wordt
      beperkt.
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel64
  - number: '65'
    text: |-
      Indien zich op een onderzeese installatie een ongewoon voorval voordoet of heeft voorgedaan, waardoor nadelige
      gevolgen voor het milieu zijn ontstaan of dreigen te ontstaan meldt de uitvoerder het ongewoon voorval zo spoedig
      mogelijk telefonisch aan de inspecteur-generaal der mijnen. De uitvoerder bevestigt de melding binnen 24 uur
      schriftelijk.
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel65
  - number: '66.1'
    text: |-
      Voor een installatie als bedoeld in [artikel 4][ref1] en [artikel 5, eerste lid][ref2],
      waarvoor op het tijdstip van inwerkingtreding van dit besluit reeds een vergunning
      als bedoeld in [artikel 8.1, eerste en tweede lid, van de Wet milieubeheer][ref3] of
      [artikel 40, tweede lid, eerste volzin, van de Mijnbouwwet][ref4] is verleend, blijven de voorschriften met
      betrekking tot geluid van die vergunning gedurende drie jaar na het tijdstip van inwerkingtreding van dit besluit
      op die installatie van toepassing als maatwerkvoorschrift als bedoeld in [artikel 20, eerste of tweede lid][ref5].
      Onze Minister kan voor afloop van de termijn van drie jaar deze voorschriften wijzigen of intrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0023771#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0023771#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0014168#Artikel40
      [ref5]: https://wetten.overheid.nl/BWBR0023771#Artikel20
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel66
