      motorrendement: het procentuele aandeel van de warmte-inhoud van de toegevoerde brandstoffen, dat bij de hoogste
      belasting waarbij de zuigermotor continu kan worden bedreven, bij ISO-luchtcondities, in arbeid wordt omgezet;
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel1
