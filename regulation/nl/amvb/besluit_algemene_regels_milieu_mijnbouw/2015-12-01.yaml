    text: |-
      ISO-luchtcondities: een temperatuur van 288° Kelvin, een druk van 101,3 kPa en een relatieve vochtigheid van 60
      procent.
    url: https://wetten.overheid.nl/BWBR0023771/2015-12-01#Artikel1
