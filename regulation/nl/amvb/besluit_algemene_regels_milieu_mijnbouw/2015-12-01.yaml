  - number: '66.2'
    text: |-
      Indien voor het tijdstip waarop dit besluit in werking treedt, een aanvraag om een vergunning
      als bedoeld in [artikel 8.1, eerste en tweede lid, van de Wet milieubeheer][ref1] of
      [artikel 40, tweede lid, van de Mijnbouwwet][ref2] voor het oprichten van een installatie als bedoeld in
      [artikel 4][ref3] of [artikel 5, eerste lid][ref4], bij Onze Minister is ingediend maar de vergunning nog niet
      is verleend en in werking getreden, wordt de aanvraag om de vergunning aangemerkt als een melding overeenkomstig
      [artikel 7][ref5] of [8][ref6].


