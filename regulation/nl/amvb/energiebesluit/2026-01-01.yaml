preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Klimaat en Groene Groei van 18 juni 2025, nr. WJZ / 99237560;

    Gelet op de artikelen 1.4, derde lid, 1.7, tweede en derde lid, 2.2, tweede en derde lid, 2.5, zesde lid, 2.6,
    zesde lid, 2.18, tweede lid, 2.21, tweede lid, 2.25, tweede en vierde lid, 2.34, vijfde lid, 2.46, tweede lid,
    2.50, derde lid, 2.51, tweede lid, 2.53, tweede lid, 2.56, eerste en tweede lid, 2.68, tweede lid, 3.8, derde lid,
    3.18, eerste lid, 3.26, eerste en tweede lid, 3.27, vijfde lid, 3.36, eerste lid, 3.40, derde en vierde lid, 3.41,
    tweede lid, 3.47, tweede en vierde lid, 3.64, tweede lid, 3.74, 3.75, 3.79, 3.85, 3.87, vierde lid, 3.90, 3.96,
    3.100, vijfde lid, 3.102, 3.103, tweede lid, 3.107, derde lid, 3.118, vierde lid, 4.4, vierde lid, 4.22, vierde
    lid, 5.1, tweede lid, 5.12, tweede lid, 5.27, eerste lid, van de Energiewet, artikel 5 van de Metrologiewet en de
    artikelen 4.3, eerste lid, 5.11, eerste lid, en 5.12, derde lid, van Omgevingswet;

    De Afdeling advisering van de Raad van State gehoord (advies van 17 september 2025, nr. W19.25.00151/IV);

    Gezien het nader rapport van Onze Minister van Klimaat en Groene Groei van 28 oktober 2025, nr. WJZ / 100821074;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder: - *beveiliging van een transmissie-
      of distributiesysteem:* geheel van maatregelen om het transmissie- of distributiesysteem te beschermen tegen
      schadelijke invloeden van buitenaf;
        - *besturing van een transmissie- of distributiesysteem:* het op een automatische manier in een bepaalde toestand
      brengen of houden van een transmissie- of distributiesysteem of onderdeel daarvan;
        - *eIDAS-verordening:* [verordening (EU) nr. 910/2014](32014R0910) van het Europees Parlement en de Raad van
      23 juli 2014 betreffende elektronische identificatie en vertrouwensdiensten voor elektronische transacties in de
      interne markt en tot intrekking van [Richtlijn 1999/93/EG](31999L0093);
        - *erkenning als meetverantwoordelijke partij:* erkenning als meetverantwoordelijke partij als bedoeld in artikel
      2.50, vierde lid, van de wet;
        - *erkenning als submeetverantwoordelijke partij:* erkenning als submeetverantwoordelijke partij als bedoeld in
      artikel 4.14, vierde lid;
        - *erkend kredietbeoordelingsbureau:* een in de Europese Unie geregistreerd ratingbureau overeenkomstig
      [verordening (EG) nr. 1060/2009](32009R1060) van het Europees Parlement en de Raad van 16 september 2009 inzake
      ratingbureaus;
        - *gemiddelde effectieve etmaaltemperatuur:* in een etmaal op het KNMI-weerstation De Bilt gemeten gemiddelde
      luchttemperatuur uitgedrukt in graden Celsius (T), gecorrigeerd voor de in dat etmaal op het KNMI-weerstation De
      Bilt gemeten gemiddelde windsnelheid uitgedrukt in meters per seconde (V), volgens de formule T - (V/1,5);
        - *investeringsplan:* investeringsplan als bedoeld in artikel 3.34 van de wet;
        - *kwaliteitsborgingssysteem:* het geheel van samenhangende plannen, processen en procedures voor het registreren,
      monitoren en eventueel verbeteren van de kwaliteit van de bedrijfsvoering;
        - *noodleverancier:* vergunninghouder die op aanwijzing van de Autoriteit Consument en Markt tijdelijk de levering
      van elektriciteit of gas voortzet aan eindafnemers met een kleine aansluiting, als bedoeld in artikel 2.25, tweede
      lid, van de wet;
        - *noodlevering:* tijdelijke voortzetting van de levering van elektriciteit of gas als bedoeld in artikel 2.25,
      derde lid, van de wet;
        - *opslagjaar:* de periode tussen 06.00 uur op 1 april van enig jaar tot 06.00 uur op 1 april van het
      daaropvolgende jaar;
        - *pieklevering:* het deel van de feitelijke aflevering van gas in een uur aan eindafnemers met een kleine
      aansluiting dat de hoeveelheid te boven gaat zoals die maximaal in een uur aan deze eindafnemers zou worden
      geleverd op een dag met een gemiddelde effectieve etmaaltemperatuur van -9 °C (graden Celsius);
        - *submeetinrichting:* specifiek meettoestel als bedoeld in artikel 2, onderdeel 78, van [verordening 2019/943]
      (32843R2019);
        - *submeetverantwoordelijke partij:* beheerder van een submeetinrichting als bedoeld in artikel 4.9, vijfde lid,
      niet zijnde een meetverantwoordelijke partij, die is erkend op grond artikel 4.14;
        - *vergunning:* vergunning, bedoeld in artikel 2.18, derde lid, van de wet;
        - *wet:* Energiewet.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel1.1
  - number: 1.2.1
    text: |-
      De minimumaansluitcapaciteit voor een gezamenlijke aansluiting als bedoeld in artikel 1.4, derde lid, van de wet
      bedraagt 100 kVA.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel1.2
  - number: 1.2.2
    text: |-
      Het aantal installaties dat gebruik maakt van een gezamenlijke aansluiting als bedoeld in artikel 1.4, derde lid,
      van de wet bedraagt ten hoogste vier.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel1.2
  - number: 1.3.1
    text: |-
      Onder energiearmoede wordt verstaan energiearmoede als bedoeld in artikel 2, onderdeel 52, van [richtlijn (EU)
      2023/1791](32023L1791) van het Europees Parlement en de Raad van 13 september 2023 betreffende energie-efficiëntie
      en tot wijziging van [Verordening (EU) 2023/955](32023R0955) (herschikking).
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel1.3
  - number: 1.3.2
    text: |-
      Het Centraal bureau voor de statistiek, genoemd in artikel 2, eerste lid, van de Wet op het Centraal bureau voor de
      statistiek, wordt aangewezen als de instantie, bedoeld in artikel 1.7, derde lid, van de wet.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel1.3
  - number: 2.1.1
    text: |-
      Een leverancier stelt een leveringsovereenkomst of een leveringsovereenkomst inzake peer-to-peer-handel met een
      eindafnemer op schrift en zorgt ervoor dat de overeenkomst in ieder geval de volgende gegevens bevat:
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel2.1
  - number: 2.1.1.a
    text: de naam, het adres, het telefoonnummer en het e-mailadres van de leverancier;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel2.1
  - number: 2.1.1.b
    text: een omschrijving van de te leveren goederen en diensten en de overeengekomen kwaliteitsniveaus van de diensten;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel2.1
  - number: 2.1.1.c
    text: de ingangsdatum van de levering van de te leveren goederen en diensten;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel2.1
  - number: 2.1.1.d
    text: |-
      indien van toepassing, informatie over de voorwaarden die zijn verbonden aan bij het sluiten van de overeenkomst
      verstrekte voordelen van geldelijke aard;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel2.1
  - number: 2.1.1.e
    text: |-
      de overeengekomen tarieven en de wijze waarop informatie kan worden verkregen over de geldende tarieven voor de
      levering van elektriciteit of gas;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel2.1
  - number: 2.1.1.f
    text: |-
      in het geval van afspraken over het leveren van elektriciteit of gas uit hernieuwbare bronnen, de wijze waarop
      informatie kan worden verkregen over de herkomst van de te leveren elektriciteit of gas;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel2.1
  - number: 2.1.1.g
    text: |-
      de looptijd van de overeenkomst en de voorwaarden voor wijziging, verlenging en beëindiging van de overeenkomst
      of diensten;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel2.1
  - number: 2.1.1.h
    text: |-
      een omschrijving van de toepasselijke vergoedingen en terugbetalingsregelingen als de geleverde diensten niet aan
      de overeengekomen kwaliteitsniveaus voldoen met inbegrip van onnauwkeurige en te late facturering;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel2.1
  - number: 2.1.1.i
    text: informatie over de overeengekomen opzegvergoeding bij tussentijdse opzegging van de overeenkomst;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel2.1
  - number: 2.1.1.k
    text: |-
      indien er een waarborgsom in rekening wordt gebracht, de maximale hoogte van de waarborgsom die de leverancier in
      rekening kan brengen bij een huishoudelijk eindafnemer of een micro-onderneming; en
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel2.1
  - number: 2.1.1.l
    text: |-
      indien het een huishoudelijk eindafnemer of micro-onderneming betreft, informatie over consumentenrechten,
      met inbegrip van informatie over klachtenbehandeling en de wijze waarop procedures bij een buitengerechtelijke
      instantie voor geschilbeslechting aanhangig kunnen worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel2.1
  - number: 2.1.2
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over de maximale hoogte van de waarborgsom die een
      leverancier kan vragen aan een huishoudelijk eindafnemer of een micro-onderneming bij het sluiten van een
      leveringsovereenkomst of leveringsovereenkomst inzake peer-to-peer-handel.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel2.1
  - number: '2.2'
    text: |-
      Een leverancier verstrekt een eindafnemer bij het sluiten van een leveringsovereenkomst of leveringsovereenkomst
      inzake peer-to-peer-handel uitsluitend voordelen die geldelijk van aard zijn.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel2.2
  - number: '2.3'
    text: |-
      De samenvatting van de belangrijkste voorwaarden uit de overeenkomst, bedoeld in artikel 2.6, vierde lid, van de
      wet, bevat in ieder geval:
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel2.3
  - number: 2.3.a
    text: de overeengekomen tarieven en de opbouw daarvan;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel2.3
  - number: 2.3.b
    text: informatie over de frequentie van de aanpassing van de tarieven;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel2.3
  - number: 2.3.c
    text: de gegevens bedoeld in artikel 2.1, eerste lid; en
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel2.3
  - number: 2.3.d
    text: |-
      dat overeenkomstig artikel 2.5 een eindafnemer binnen de termijn, bedoeld in artikel 2.5, derde lid, schriftelijk
      in kennis wordt gesteld van elke aanpassing van de tarieven voor de levering van elektriciteit en gas en van elk
      voornemen de aan de overeenkomst verbonden voorwaarden voor de levering van elektriciteit of gas te wijzigen.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel2.3
  - number: 2.4.1
    text: |-
      Een leverancier biedt eindafnemers een keuze uit verschillende betalingswijzen en vermeldt de overeengekomen
      betalingswijze in de leveringsovereenkomst of leveringsovereenkomst inzake peer-to-peer-handel met de eindafnemer.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel2.4
  - number: 2.4.2
    text: |-
      Een verschil in tarieven en voorwaarden tussen betalingswijzen, houdt uitsluitend verband met het verschil in
      kosten die die betalingswijzen voor de leverancier met zich brengen.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel2.4
  - number: 2.5.1
    text: |-
      Een leverancier stelt eindafnemers op een transparante en begrijpelijke manier schriftelijk in kennis van elke
      wijziging van de prijzen voor de levering van elektriciteit of gas of de methode voor vaststelling hiervan,
      alsmede van de redenen, voorwaarden en de reikwijdte ervan, en geeft daarbij aan of en onder welke voorwaarden de
      overeenkomst kan worden opgezegd wanneer zij van een dergelijk voornemen in kennis worden gesteld.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel2.5
  - number: 2.5.2
    text: |-
      Een leverancier stelt eindafnemers op een transparante en begrijpelijke manier schriftelijk in kennis van elk
      voornemen de aan de overeenkomst verbonden voorwaarden voor de levering van elektriciteit of gas te wijzigen,
      en wijst hen daarbij, indien van toepassing, op hun recht om de overeenkomst op te zeggen wanneer zij van een
      dergelijk voornemen in kennis worden gesteld.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel2.5
  - number: 2.5.3
    text: |-
      Een leverancier informeert eindafnemers over de wijziging van de prijzen, bedoeld in het eerste lid, uiterlijk twee
      weken, of, indien het een huishoudelijk eindafnemer of micro-onderneming betreft, uiterlijk een maand, voordat de
      wijziging in werking treedt.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel2.5
  - number: '2.6'
    text: |-
      Een leverancier vraagt ten behoeve van de registratie, bedoeld in artikel 2.6, vijfde lid, van de wet, voorafgaand
      aan het sluiten van de leveringsovereenkomst of leveringsovereenkomst inzake peer-to-peer-handel aan een
      eindafnemer of deze een huishoudelijke eindafnemer of een micro-onderneming is.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel2.6
  - number: '2.7'
    text: |-
      Een leverancier draagt er zorg voor dat bij zijn aanbod voor eindafnemers met een kleine aansluiting in ieder geval
      kenbaar is:
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel2.7
  - number: 2.7.a
    text: |-
      dat hij verplicht is elektriciteit of gas te leveren aan elke eindafnemer met een kleine aansluiting die zijn
      aanbod aanvaardt;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel2.7
  - number: 2.7.b
    text: |-
      dat hij overeenkomstig artikel 2.26 van de wet preventieve maatregelen neemt om het beëindigen van de levering aan
      of van de facilitering in peer-to-peer-handel wegens wanbetaling zoveel mogelijk te voorkomen; en
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel2.7
  - number: 2.7.c
    text: |-
      dat hij overeenkomstig artikel 2.5 verplicht is om eindafnemers binnen de in artikel 2.5, derde lid, bepaalde
      termijn schriftelijk in kennis te stellen van elke aanpassing van de tarieven voor de levering van elektriciteit
      en gas en van elk voornemen de aan de overeenkomst verbonden voorwaarden voor de levering van elektriciteit of gas
      te wijzigen.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel2.7
  - number: 2.8.1
    text: |-
      Een marktdeelnemer die aggregeert stelt een aggregatieovereenkomst met een actieve afnemer op schrift en zorgt
      ervoor dat de aggregatieovereenkomst in ieder geval de volgende gegevens bevat:
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel2.8
  - number: 2.8.1.a
    text: de naam, het adres, het telefoonnummer en het e-mailadres van de marktdeelnemer die aggregeert;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel2.8
  - number: 2.8.1.b
    text: een omschrijving van de aard en de voorwaarden van de overeenkomst;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel2.8
  - number: 2.8.1.c
    text: de ingangsdatum van de teruglevering of de vraagresponsdienst;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel2.8
  - number: 2.8.1.d
    text: |-
      de overeengekomen vergoeding voor de teruggeleverde elektriciteit of vraagrespons en de wijze waarop informatie kan
      worden verkregen over de geldende vergoedingen;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel2.8
  - number: 2.8.1.e
    text: de looptijd van de overeenkomst en de voorwaarden voor wijziging, verlenging en beëindiging van de overeenkomst;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel2.8
  - number: 2.8.1.f
    text: informatie over de overeengekomen opzegvergoeding bij tussentijdse opzegging van de overeenkomst; en
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel2.8
  - number: 2.8.1.g
    text: |-
      indien de actieve afnemer tevens een huishoudelijk eindafnemer of micro-onderneming is, informatie over
      consumentenrechten, met inbegrip van informatie over klachtenbehandeling en de wijze waarop procedures bij de
      instantie voor buitengerechtelijke geschilbeslechting waarbij de marktdeelnemer aangesloten is, aanhangig kunnen
      worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel2.8
  - number: 2.8.2
    text: |-
      Artikel 2.5 is van overeenkomstige toepassing op een aggregatieovereenkomst, met dien verstande dat in plaats van
      «een leverancier» wordt gelezen »een marktdeelnemer die aggregeert».
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel2.8
  - number: '2.9'
    text: |-
      Een actieve afnemer kan een vraagresponsovereenkomst beëindigen zonder inachtneming van een opzegtermijn, indien de
      leveringszekerheid van die actieve afnemer dat vereist.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel2.9
  - number: 2.10.1
    text: |-
      Een vergunningplichtige leverancier beschikt over de op grond van artikel 2.18, eerste lid, van de wet benodigde
      organisatorische, financiële en technische kwaliteiten, alsmede over voldoende deskundigheid, indien:
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel2.10
  - number: 2.10.1.a
    text: |-
      de leverancier beschikt over een goede administratieve organisatie, met inbegrip van de financiële administratie,
      en over een goede interne en externe controle hierop;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel2.10
  - number: 2.10.1.b
    text: de leverancier beschikt over een solide financiële positie en een gedegen inkoopstrategie;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel2.10
  - number: 2.10.1.c
    text: |-
      de leverancier balanceringsverantwoordelijke is, of de balanceringsverantwoordelijkheid voor ten minste een jaar
      aan een balanceringsverantwoordelijke heeft overgedragen;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel2.10
  - number: 2.10.1.d
    text: |-
      de leverancier beschikt over een onafhankelijke risicomanager die verantwoordelijk is voor de beheersing van
      risico’s voor de financiële positie van de leverancier;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel2.10
  - number: 2.10.1.e
    text: de leverancier niet in staat van faillissement verkeert; en
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel2.10
  - number: 2.10.1.f
    text: de leverancier geen surseance van betaling is verleend.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel2.10
  - number: 2.10.2
    text: |-
      Een vergunningplichtige leverancier is aangesloten bij een instantie tot buitengerechtelijke geschillenbeslechting
      in de zin van de Implementatiewet buitengerechtelijke geschillenbeslechting consumenten.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel2.10
  - number: 2.10.3
    text: Bij ministeriële regeling worden nadere regels gesteld over de vereisten, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel2.10
  - number: 2.10.4
    text: |-
      Een vergunninghouder geeft de Autoriteit Consument en Markt binnen twee weken alle wijzigingen door van
      omstandigheden relevant voor de eisen, bedoeld in artikel 2.18, derde lid, van de wet.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel2.10
  - number: 2.10.5
    text: |-
      In afwijking van het vierde lid geeft een vergunninghouder de Autoriteit Consument en Markt uiterlijk vier weken
      voorafgaand aan de voorgenomen ingangsdatum van de wijziging of, indien dit later is, zodra hij voornemens is om de
      wijziging te gaan doorvoeren, de volgende wijzigingen door:
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel2.10
  - number: 2.10.5.a
    text: het benoemen van een bestuurder;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel2.10
  - number: 2.10.5.b
    text: wijziging van de doorslaggevende zeggenschap in de onderneming;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel2.10
  - number: 2.10.5.c
    text: |-
      het aflopen, de beëindiging of het aangaan van een overeenkomst van de vergunninghouder met een partij aan wie de
      balanceringsverantwoordelijkheid wordt overgedragen.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel2.10
  - number: 2.11.1
    text: |-
      Een aanvraag voor het verkrijgen van toestemming van de Autoriteit Consument en Markt voor de overdracht van
      een vergunning op grond van artikel 2.21 van de wet, wordt ingediend door de leverancier die voornemens is om de
      vergunning over te dragen en de leverancier die voornemens is om de vergunning over te nemen gezamenlijk.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel2.11
  - number: 2.11.2
    text: |-
      De eisen gesteld bij of krachtens artikel 2.18, eerste, tweede en vijfde lid, van de wet zijn van toepassing op de
      aanvraag en beoordeling door de Autoriteit Consument en Markt
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel2.11
  - number: 2.11.3
    text: 'De aanvraag gaat vergezeld van:'
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel2.11
  - number: 2.11.3.a
    text: de reden van de overdracht van de vergunning;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel2.11
  - number: 2.11.3.b
    text: |-
      een onderbouwing waarom de overdracht geen nadelige effecten heeft op de overnemende leverancier en geen negatieve
      invloed heeft op de mate waarin wordt voldaan aan de eisen die bij het verlenen van de vergunning zijn gesteld; en
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel2.11
  - number: 2.11.3.c
    text: de wijze waarop eindafnemers met een kleine aansluiting worden geïnformeerd over de overdracht.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel2.11
  - number: 2.12.1
    text: |-
      De vergunninghouder dan wel, indien deze failliet is verklaard, de curator, treedt zo spoedig mogelijk na het doen
      van een mededeling als bedoeld in artikel 2.24 van de wet, in overleg met de Autoriteit Consument en Markt en met
      de transmissiesysteembeheerder, met het oog op de leveringszekerheid en de toepassing van deze afdeling.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel2.12
  - number: 2.12.2
    text: |-
      Een beschikking tot intrekking van een vergunning als bedoeld in artikel 2.18, derde lid, van de wet treedt ten
      hoogste twintig werkdagen na de dag waarop die beschikking is gegeven in werking. De vergunninghouder dan wel de
      curator geeft na vaststelling van de beschikking tot intrekking van een vergunning daarvan onverwijld schriftelijk
      bericht aan de eindafnemers met een kleine aansluiting aan wie hij elektriciteit of gas levert.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel2.12
  - number: '2.13'
    text: |-
      De termijn waarbinnen een eindafnemer met een kleine aansluiting overeenkomstig artikel 2.25, eerste lid, van de
      wet niet bevoegd is zijn leveringsovereenkomst of leveringsovereenkomst inzake peer-to-peer-handel op te zeggen,
      eindigt op het moment waarop deze overeenkomst is overgedragen aan een andere vergunninghouder of op het moment
      waarop deze overeenkomst van rechtswege eindigt en de noodlevering aanvangt.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel2.13
  - number: '2.14'
    text: |-
      De termijn voor het overdragen aan een andere vergunninghouder van leveringsovereenkomsten of
      leveringsovereenkomsten inzake peer-to-peer-handel overeenkomstig artikel 2.25, eerste lid, van de wet, alsmede
      voor het overdragen van de krachtens artikel 2.10, derde lid, te bepalen gegevens, eindigt op het tijdstip waarop
      de Autoriteit Consument en Markt een besluit neemt als bedoeld in artikel 2.25, tweede lid, van de wet, maar
      bedraagt ten hoogste tien werkdagen na de dag waarop de beschikking tot intrekking van de vergunning is gegeven.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel2.14
  - number: 2.15.1
    text: |-
      De Autoriteit Consument en Markt besluit, indien geldende leveringsovereenkomsten en leveringsovereenkomsten inzake
      peer-to-peer-handel niet zijn overgedragen overeenkomstig artikel 2.25, eerst lid, van de wet, uiterlijk op de
      elfde werkdag na de dag waarop de beschikking tot intrekking van een vergunning is gegeven of na het moment van
      faillissement tot verdeling van de resterende eindafnemers met een kleine aansluiting en wijst noodleveranciers
      aan.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel2.15
  - number: 2.15.2
    text: |-
      De vergunninghouder wiens vergunning is ingetrokken, dan wel, indien deze failliet is verklaard, de curator
      draagt na het besluit tot verdeling de krachtens artikel 2.10, derde lid, te bepalen gegevens van de toegedeelde
      eindafnemers met een kleine aansluiting die nog een leveringsovereenkomst of leveringsovereenkomst inzake peer-to-
      peer-handel met de vergunninghouder hebben, onverwijld over aan de transmissiesysteembeheerder.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel2.15
  - number: 2.15.3
    text: |-
      Een noodleverancier zet de levering van elektriciteit of gas voort aan de aan hem toegedeelde eindafnemers met een
      kleine aansluiting gedurende zes maanden, of tot het moment waarop binnen deze termijn een door een toegedeelde
      eindafnemer afgesloten leveringsovereenkomst ingaat.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel2.15
  - number: 2.15.4
    text: |-
      De noodleverancier verstrekt zo spoedig mogelijk na het moment dat het besluit van de Autoriteit Consument en
      Markt, bedoeld in artikel 2.25, tweede lid, van de wet, in werking treedt, de aan hem toegedeelde eindafnemers met
      een kleine aansluiting:
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel2.15
  - number: 2.15.4.a
    text: |-
      een aanbod tot het sluiten van een terugleveringsovereenkomst voor de duur van de noodlevering, indien de
      eindafnemer een terugleveringsovereenkomst had met de vergunninghouder wiens vergunning is ingetrokken dan wel die
      in faillissement verkeert; en
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel2.15
  - number: 2.15.4.b
    text: 'schriftelijk de volgende informatie:'
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel2.15
  - number: 2.15.4.b.1°
    text: de naam, het adres, het telefoonnummer en het e-mailadres van de vergunninghouder;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel2.15
  - number: 2.15.4.b.2°
    text: de termijn van de levering van elektriciteit of gas;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel2.15
  - number: 2.15.4.b.3°
    text: dat de eindafnemer na het besluit tot verdeling kosteloos over kan stappen;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel2.15
  - number: 2.15.4.b.4°
    text: |-
      informatie over de door de eindafnemer voor de levering verschuldigde vergoeding, bedoeld in artikel 2.25, derde
      lid, van de wet;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel2.15
  - number: 2.15.4.b.5°
    text: informatie over facturering; en
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel2.15
  - number: 2.15.4.b.6°
    text: |-
      informatie over klachtbehandeling en de wijze waarop procedures bij een instantie voor buitengerechtelijke
      geschilbeslechting aanhangig kunnen worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel2.15
  - number: 2.16.1
    text: |-
      De Autoriteit Consument en Markt verdeelt de resterende eindafnemers met een kleine aansluiting bij het besluit,
      bedoeld in artikel 2.15, eerste lid, over de overige vergunninghouders naar evenredigheid van het aantal
      eindafnemers aan wie zij reeds leveren.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel2.16
  - number: 2.16.2
    text: |-
      Op verzoek van vergunninghouders die deel uitmaken van een groep als bedoeld in artikel 24b van Boek 2 van het
      Burgerlijk Wetboek, kan de Autoriteit Consument en Markt de aan deze vergunninghouders toe te delen eindafnemers
      met een kleine aansluiting op een andere wijze over hen verdelen.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel2.16
  - number: 2.16.3
    text: |-
      Een vergunninghouder wordt door de Autoriteit Consument en Markt bij de verdeling van eindafnemers met een kleine
      aansluiting uitgesloten indien:
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel2.16
  - number: 2.16.3.a
    text: aan hem een verbod als bedoeld in artikel 2.19, tweede lid, van de wet is opgelegd;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel2.16
  - number: 2.16.3.b
    text: hij een mededeling heeft gedaan als bedoeld in artikel 2.24 van de wet;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel2.16
  - number: 2.16.3.c
    text: aan hem surseance van betaling is verleend; of
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel2.16
  - number: 2.16.3.d
    text: |-
      andere omstandigheden met betrekking tot de vergunninghouder aanleiding geven tot zijn uitsluiting in het belang
      van de eindafnemers.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel2.16
  - number: 2.16.4
    text: |-
      Indien uitzonderlijke marktomstandigheden daartoe aanleiding geven, kan de Autoriteit Consument en Markt bij de
      verdeling van de eindafnemers met een kleine aansluiting in het belang van de leveringszekerheid vergunninghouders
      met een klein marktaandeel uitsluiten.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel2.16
  - number: 2.17.1
    text: |-
      De noodleverancier bepaalt zo spoedig mogelijk na aanvang van de noodlevering, doch uiterlijk binnen 5 werkdagen,
      de hoogte van de door de eindafnemer met een kleine aansluiting gedurende de termijn van zes maanden voor de
      levering verschuldigde vergoeding, bedoeld in artikel 25, derde lid, van de wet, en doet van de hoogte en de
      samenstelling van de vergoeding onverwijld mededeling aan de Autoriteit Consument en Markt. De noodleverancier kan
      de hoogte van de verschuldigde vergoeding tussentijds uitsluitend verlagen.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel2.17
  - number: 2.17.2
    text: |-
      De hoogte van de voor de levering verschuldigde vergoeding ziet uitsluitend op vergoeding van redelijke kosten van
      de noodlevering voor de vergunninghouder.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel2.17
  - number: 2.17.3
    text: |-
      De Autoriteit Consument en Markt kan een maximum vaststellen waar de hoogte van de voor de levering verschuldigde
      vergoeding, onverminderd het bepaalde in het tweede lid, aan gebonden is. De Autoriteit Consument en Markt baseert
      de hoogte van het maximum op een vergelijking met het relevante marktaanbod van leveringsovereenkomsten en neemt
      daarbij de actuele marktomstandigheden en de bijzondere kenmerken van de tijdelijke levering op grond van de wet en
      de daarmee samenhangende kosten in aanmerking.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel2.17
  - number: 2.17.4
    text: |-
      Op de noodlevering is het bepaalde bij of krachtens de artikelen 2.13, 2.31, 2.42, eerste lid, en 2.43, derde lid,
      van de wet van overeenkomstige toepassing. Bij ministeriële regeling kunnen nadere regels worden gesteld over de
      voorwaarden waaronder de noodlevering plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel2.17
  - number: 2.18.1
    text: |-
      Een noodleverancier doet zo spoedig mogelijk, doch uiterlijk binnen drie maanden na het moment dat het besluit van
      verdeling, bedoeld in artikel 2.25, tweede lid, van de wet in werking treedt, de aan hem toegedeelde eindafnemers
      met een kleine aansluiting een aanbod tot het aangaan van een leveringsovereenkomst.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel2.18
  - number: 2.18.2
    text: |-
      Indien een toegedeelde eindafnemer met een kleine aansluiting niet reageert op het aanbod en er geen
      leveringsovereenkomst is aangegaan met een andere vergunninghouder, verstrekt de noodleverancier de toegedeelde
      eindafnemer met een kleine aansluiting ten minste driemaal een schriftelijke herinnering met daarin een aanbod.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel2.18
  - number: 2.18.3
    text: |-
      De noodleverancier spant zich tot het uiterste in om, zo nodig herhaaldelijk en via diverse communicatiekanalen,
      in persoonlijk contact te treden met de eindafnemer met een kleine aansluiting teneinde deze te wijzen op
      mogelijkheden om een leveringsovereenkomst te sluiten en om de beëindiging van de levering van elektriciteit of gas
      en het buiten werking stellen van de aansluiting of het voor die levering aan de aansluiting toegekende additionele
      allocatiepunt te voorkomen na ommekomst van de termijn van zes maanden, bedoeld in artikel 2.15, derde lid.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel2.18
  - number: 2.18.4
    text: |-
      De instantie voor buitengerechtelijke geschilbeslechting waarbij de noodleverancier ingevolge artikel 2.18, eerste
      lid, van de wet is aangesloten, is bevoegd tot kennisneming van geschillen ter zake van de uitvoering van een
      noodlevering.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel2.18
  - number: '2.19'
    text: |-
      Een inkoopovereenkomst van een vergunninghouder ten behoeve van de levering van elektriciteit of gas aan
      eindafnemers met een kleine aansluiting bevat geen beding tot ontbinding van rechtswege van die overeenkomst
      ingeval aan de vergunninghouder surseance van betaling is verleend of deze failliet is verklaard, dan wel ingeval
      diens surseance of faillissement is aangevraagd, dan wel ingeval diens vergunning zal worden ingetrokken, noch
      bedingen die het de wederpartij mogelijk maken in die gevallen de verbintenis op te zeggen of de nakoming van de
      verbintenis op te schorten of te ontbinden of onder gewijzigde voorwaarden voort te zetten, tot het moment dat,
      ingeval van intrekking van een vergunning of faillissement van de vergunninghouder, alle leveringsovereenkomsten
      met eindafnemers met een kleine aansluiting conform artikel 2.25, eerste lid, van de wet zijn overgedragen aan een
      andere vergunninghouder dan wel conform artikel 2.25, derde lid, van de wet geacht worden te zijn beëindigd.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel2.19
  - number: '2.20'
    text: |-
      Een vergelijkingsinstrument als bedoeld in artikel 2.68, eerste lid, van de wet wordt op verzoek van de aanbieder
      van dat vergelijkingsinstrument gecertificeerd, indien het vergelijkingsinstrument voldoet aan de volgende
      voorwaarden:
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel2.20
  - number: 2.20.a
    text: de toegang tot het vergelijkingsinstrument is kosteloos voor huishoudelijk eindafnemers en micro-ondernemingen;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel2.20
  - number: 2.20.b
    text: |-
      de aanbieder van het vergelijkingsinstrument is onafhankelijk van de leveranciers en andere marktdeelnemers en
      waarborgt dat aanbieders in de zoekresultaten gelijk worden behandeld;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel2.20
  - number: 2.20.c
    text: 'het vergelijkingsinstrument vermeldt op een duidelijk vindbare wijze:'
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel2.20
  - number: 2.20.c.1°
    text: wie de eigenaar daarvan is;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel2.20
  - number: 2.20.c.2°
    text: wie het vergelijkingsinstrument beheert en controleert;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel2.20
  - number: 2.20.c.3°
    text: hoe het aanbieden van vergelijkingsinstrument wordt bekostigd; en
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel2.20
  - number: 2.20.c.4°
    text: de duidelijke en objectieve criteria waarop de vergelijking moet worden gebaseerd;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel2.20
  - number: 2.20.d
    text: het vergelijkingsinstrument maakt gebruik van duidelijke en ondubbelzinnige taal;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel2.20
  - number: 2.20.e
    text: |-
      het vergelijkingsinstrument geeft nauwkeurige en actuele informatie, met vermelding van het tijdstip van de meest
      recente actualisering;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel2.20
  - number: 2.20.f
    text: |-
      het vergelijkingsinstrument is toegankelijk voor eindafnemers met een handicap door waarneembaar, bedienbaar,
      begrijpelijk en robuust te zijn;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel2.20
  - number: 2.20.g
    text: het vergelijkingsinstrument voorziet in een effectieve procedure om onjuiste informatie te melden;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel2.20
  - number: 2.20.h
    text: |-
      het vergelijkingsinstrument staat open voor het aanbod van iedere leverancier die de relevante informatie
      beschikbaar maakt en omvat een breed scala aan aanbiedingen, met uitzondering van het aanbod om ten behoeve van
      eindafnemers te faciliteren in peer-to-peer handel, die een significant deel van de markt beslaan;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel2.20
  - number: 2.20.i
    text: |-
      het vergelijkingsinstrument vermeldt in voorkomend geval duidelijk dat de gepresenteerde informatie geen volledig
      overzicht van de markt biedt, voordat de zoekresultaten worden getoond; en
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel2.20
  - number: 2.20.j
    text: |-
      bij de vergelijking van het aanbod van leveranciers worden in ieder geval de prijzen waartegen een leverancier
      elektriciteit of gas levert aan een huishoudelijk eindafnemer of een micro-onderneming, de kosten met betrekking
      tot terugleveren van zelfopgewekte hernieuwbare elektriciteit en de hoogte van de vergoeding voor teruggeleverde
      elektriciteit vergeleken.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel2.20
  - number: '3.1'
    text: |-
      Onze Minister kan een aanwijzing als systeembeheerder als bedoeld in artikel 3.2, eerste lid, van de wet, intrekken
      indien:
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.1
  - number: 3.1.a
    text: |-
      de Autoriteit Consument en Markt de certificering, bedoeld in artikel 3.4, eerste of derde lid, van de wet, van die
      systeembeheerder heeft ingetrokken;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.1
  - number: 3.1.b
    text: |-
      de systeembeheerder niet langer voldoet aan de eisen, gesteld bij of krachtens artikel 3.3, tweede tot en met zesde
      lid, van de wet.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.1
  - number: '3.2'
    text: |-
      De Autoriteit Consument en Markt kan een erkenning als gesloten systeem als bedoeld in artikel 3.7 van de wet,
      intrekken indien:
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.2
  - number: 3.2.a
    text: niet langer wordt voldaan aan de voorwaarden, bedoeld in artikel 3.7 van de wet;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.2
  - number: 3.2.b
    text: |-
      het gesloten systeem niet wordt beheerd door degene die op grond van artikel 3.6 van de wet, als beheerder is
      aangewezen;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.2
  - number: 3.2.c
    text: |-
      de beheerder van het gesloten systeem in strijd handelt met vereisten gesteld bij of krachtens de artikelen 3.104
      en 3.105, tweede en derde lid, van de wet;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.2
  - number: 3.2.d
    text: |-
      bij de aanvraag om een erkenning onjuiste of onvolledige gegevens zijn verstrekt en de verstrekking van juiste of
      volledige gegevens tot een andere beslissing op de aanvraag zou hebben geleid.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.2
  - number: 3.3.1
    text: |-
      Bij ministeriële regeling kunnen de in artikel 3.18, eerste lid, onderdeel a, van de wet bedoelde gegevens,
      hulpmiddelen, materialen, werkmethoden of processen worden aangewezen. Dit betreft in ieder geval:
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.3
  - number: 3.3.1.a
    text: |-
      voor zover deze uit het oogpunt van de bescherming van vitale processen van essentieel belang zijn voor de
      nationale veiligheid, gegevens, hulpmiddelen of materialen voor:
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.3
  - number: 3.3.1.a.1°
    text: de instandhouding van een transmissie- of distributiesysteem;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.3
  - number: 3.3.1.a.2°
    text: de beveiliging van een transmissie- of distributiesysteem;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.3
  - number: 3.3.1.a.3°
    text: de besturing van een transmissie- of distributiesysteem;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.3
  - number: 3.3.1.a.4°
    text: de bewaking van gegevens, hulpmiddelen en materialen;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.3
  - number: 3.3.1.a.5°
    text: de bediening van onderdelen van een transmissie- of distributiesysteem;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.3
  - number: 3.3.1.a.6°
    text: het beschikbaar stellen van gegevens ten behoeve van marktfacilitering;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.3
  - number: 3.3.1.b
    text: |-
      werkmethoden en processen die zijn ingericht met behulp van de gegevens, hulpmiddelen of materialen, als bedoeld in
      onderdeel a.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.3
  - number: 3.3.2
    text: |-
      Bij de ministeriële regeling, bedoeld in het eerste lid, kan de vereiste mate van vertrouwelijkheid worden bepaald
      van de aangewezen gegevens, hulpmiddelen, materialen, werkmethoden en processen en gegevens die daaraan ontleend
      zijn.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.3
  - number: 3.4.1
    text: |-
      Een transmissiesysteembeheerder, transmissiesysteembeheerder voor elektriciteit op zee of
      distributiesysteembeheerder treft ten aanzien van de aangewezen gegevens, hulpmiddelen, materialen, werkmethoden
      of processen waarvoor de vereiste mate van vertrouwelijkheid op grond van artikel 3.3, tweede lid, is bepaald, alle
      passende en evenredige maatregelen die nodig zijn om geheimhouding ervan te verzekeren.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.4
  - number: 3.4.2
    text: 'Deze maatregelen houden onder meer in dat:'
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.4
  - number: 3.4.2.a
    text: |-
      gegevens, hulpmiddelen, materialen en gegevens over processen en werkmethoden zijn beschermd tegen ontvreemding,
      vernietiging, verwijdering, onthulling, verlies of toegang tot die gegevens, hulpmiddelen of dat materiaal door een
      onbevoegde, of tegen enige andere vorm van compromittering;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.4
  - number: 3.4.2.b
    text: |-
      de terreinen, gebouwen en ruimten, waar de betrokken gegevens, hulpmiddelen of materialen worden bewaard of
      gebruikt of waar de betrokken processen worden gevolgd of de betrokken werkmethoden worden toegepast zijn
      beveiligd;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.4
  - number: 3.4.2.c
    text: |-
      is gewaarborgd dat alleen personen kennis kunnen nemen van de gegevens, behorende tot of ontleend aan de aangewezen
      gegevens, hulpmiddelen, materialen, processen en werkmethoden, indien dit nodig is voor de uitvoering van hun
      werkzaamheden;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.4
  - number: 3.4.2.d
    text: |-
      medewerkers die kennis hebben of krijgen van de aangewezen gegevens, hulpmiddelen, materialen, processen en
      werkmethoden door of voor de transmissiesysteembeheerder, transmissiesysteembeheerder voor elektriciteit op zee of
      distributiesysteembeheerder zijn gecontroleerd op hun eerlijkheid, integriteit en veiligheidsbewustzijn;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.4
  - number: 3.4.2.e
    text: |-
      navolgbaar en controleerbaar is vastgelegd wie is belast met het treffen van maatregelen ter verzekering van de
      geheimhouding en met het toezicht op de naleving daarvan;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.4
  - number: 3.4.2.f
    text: |-
      indien ernstige inbreuken op de naleving van de ter verzekering van geheimhouding getroffen maatregelen, dan wel
      spionage worden vermoed of ontdekt, de transmissiesysteembeheerder en distributiesysteembeheerder dit onverwijld
      registreert.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.4
  - number: 3.4.3
    text: |-
      Desgevraagd verstrekt de transmissiesysteembeheerder, transmissiesysteembeheerder voor elektriciteit op zee of
      distributiesysteembeheerder aan Onze Minister informatie over de gegevens, hulpmiddelen, materialen, processen of
      werkmethoden, als bedoeld in artikel 3.3.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.4
  - number: 3.4.4
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld over de maatregelen, bedoeld in het eerste en tweede
      lid, daarbij kan rekening worden gehouden met de verschillen tussen systeembeheerders voor elektriciteit of voor
      gas.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.4
  - number: '3.5'
    text: |-
      In een uitvalsituatie in een transmissiesysteem voor elektriciteit met een spanningsniveau van 220 kV of hoger in
      normaal bedrijf, is de eis, bedoeld in artikel 3.26, eerste lid, aanhef, van de wet, niet van toepassing indien de
      uitvalsituatie betrekking heeft op:
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.5
  - number: 3.5.a
    text: |-
      een transformator naar een spanning lager dan 110 kV en leidt tot een onderbreking van transport van elektriciteit
      van maximaal 200 MW gedurende ten hoogste:
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.5
  - number: 3.5.a.1°
    text: tien minuten voor transport ten behoeve van verbruik, of
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.5
  - number: 3.5.a.2°
    text: |-
      twee weken voor transport ten behoeve van productie of invoeding van een elektriciteitsopslagfaciliteit die
      rechtstreeks op de transformator is aangesloten, dan wel op het onderliggende distributiesysteem voor elektriciteit
      en rechtstreeks op een hoog- of middenspanningsrail op een hoogspanningsstation is aangesloten;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.5
  - number: 3.5.b
    text: |-
      een railsysteem en leidt tot een onderbreking van transport van elektriciteit van maximaal 1500 MW gedurende ten
      hoogste zes uur voor transport ten behoeve van productie of invoeding van een elektriciteitsopslagfaciliteit die
      rechtstreeks op het railsysteem is aangesloten, dan wel op het onderliggende distributiesysteem voor elektriciteit
      en rechtstreeks op een hoog- of middenspanningsrail op een hoogspanningsstation is aangesloten;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.5
  - number: 3.5.c
    text: |-
      een railsysteem en leidt tot een onderbreking van transport van elektriciteit van ten hoogste 2000 MW gedurende
      ten hoogste zes uur voor transport ten behoeve van op een transmissiesysteem voor elektriciteit op zee aangesloten
      productie.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.5
  - number: '3.6'
    text: |-
      In een uitvalsituatie in een transmissiesysteem voor elektriciteit met een spanningsniveau van 220 kV of hoger
      tijdens onderhoud, is de eis, bedoeld in artikel 3.26, eerste lid, aanhef, van de wet, niet van toepassing, indien
      de uitvalsituatie betrekking heeft op:
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.6
  - number: 3.6.a
    text: |-
      een transformator naar een spanning lager dan 110 kV en leidt tot een onderbreking van transport van elektriciteit
      van maximaal 200 MW gedurende ten hoogste:
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.6
  - number: 3.6.a.1°
    text: zes uur voor transport ten behoeve van verbruik, of
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.6
  - number: 3.6.a.2°
    text: |-
      twee weken voor transport ten behoeve van productie of invoeding van een elektriciteitsopslagfaciliteit die
      rechtstreeks op de transformator is aangesloten, dan wel op het onderliggende distributiesysteem voor elektriciteit
      en rechtstreeks op een hoog- of middenspanningsrail op een hoogspanningsstation is aangesloten;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.6
  - number: 3.6.b
    text: 'een railsysteem en leidt tot een onderbreking van transport van elektriciteit van maximaal:'
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.6
  - number: 3.6.b.1°
    text: |-
      1000 MW gedurende ten hoogste twee uur, waarna de onderbreking maximaal 500 MW is, vervolgens lineair afneemt tot
      maximaal 100 MW en na zes uur is opgelost voor transport ten behoeve van verbruik, of
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.6
  - number: 3.6.b.2°
    text: |-
      1500 MW gedurende ten hoogste zes uur voor transport ten behoeve van productie of invoeding van een
      elektriciteitsopslagfaciliteit die rechtstreeks op het railsysteem is aangesloten, dan wel op het
      onderliggende distributiesysteem voor elektriciteit en rechtstreeks op een hoog- of middenspanningsrail op een
      hoogspanningsstation is aangesloten;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.6
  - number: 3.6.c
    text: |-
      een railsysteem en leidt tot een onderbreking van transport van elektriciteit van ten hoogste 2000 MW gedurende
      ten hoogste zes uur, voor transport ten behoeve van op een transmissiesysteem voor elektriciteit op zee aangesloten
      productie.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.6
  - number: '3.7'
    text: |-
      In een uitvalsituatie in een transmissiesysteem voor elektriciteit met een spanningsniveau van 110 tot 220 kV in
      normaal bedrijf, is de eis, bedoeld in artikel 3.26, eerste lid, aanhef, van de wet, niet van toepassing indien de
      uitvalsituatie betrekking heeft op:
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.7
  - number: 3.7.a
    text: |-
      een transformator naar een spanning lager dan 110 kV en leidt tot een onderbreking van transport van elektriciteit
      van maximaal 200 MW gedurende ten hoogste:
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.7
  - number: 3.7.a.1°
    text: tien minuten voor transport ten behoeve van verbruik, of
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.7
  - number: 3.7.a.2°
    text: |-
      twee weken voor transport ten behoeve van productie of invoeding van een elektriciteitsopslagfaciliteit die
      rechtstreeks op de transformator is aangesloten, dan wel op het onderliggende distributiesysteem voor elektriciteit
      en rechtstreeks op een hoog- of middenspanningsrail op een hoogspanningsstation is aangesloten ;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.7
  - number: 3.7.b
    text: 'een circuit en leidt tot een onderbreking van transport van elektriciteit van maximaal:'
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.7
  - number: 3.7.b.1°
    text: 100 MW gedurende ten hoogste tien minuten voor transport ten behoeve van verbruik, of
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.7
  - number: 3.7.b.2°
    text: |-
      500 MW gedurende ten hoogste twee weken voor transport ten behoeve van productie of invoeding van een
      elektriciteitsopslagfaciliteit die rechtstreeks op het circuit is aangesloten, dan wel op het onderliggende
      distributiesysteem voor elektriciteit en rechtstreeks op een hoog- of middenspanningsrail op een
      hoogspanningsstation is aangesloten;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.7
  - number: 3.7.c
    text: 'een railsysteem en leidt tot een onderbreking van transport van elektriciteit van maximaal:'
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.7
  - number: 3.7.c.1°
    text: |-
      500 MW gedurende ten hoogste een uur en daarna maximaal 100 MW gedurende ten hoogste vijf uur voor transport ten
      behoeve van verbruik, of
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.7
  - number: 3.7.c.2°
    text: |-
      1500 MW gedurende ten hoogste zes uur voor transport ten behoeve van productie of invoeding van een
      elektriciteitsopslagfaciliteit die rechtstreeks op het railsysteem is aangesloten, dan wel op het
      onderliggende distributiesysteem voor elektriciteit en rechtstreeks op een hoog- of middenspanningsrail op een
      hoogspanningsstation is aangesloten.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.7
  - number: 3.8.1
    text: |-
      In een uitvalsituatie in een transmissiesysteem voor elektriciteit met een spanningsniveau van 110 tot 220 kV
      tijdens onderhoud, is de eis, bedoeld in artikel 3.26, eerste lid, aanhef, van de wet, niet van toepassing indien
      de uitvalsituatie betrekking heeft op:
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.8
  - number: 3.8.1.a
    text: |-
      een transformator naar een spanning lager dan 110 kV en leidt tot een onderbreking van transport van elektriciteit
      van maximaal 200 MW gedurende ten hoogste:
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.8
  - number: 3.8.1.a.1°
    text: zes uur voor transport ten behoeve van verbruik, of
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.8
  - number: 3.8.1.a.2°
    text: |-
      twee weken voor transport ten behoeve van productie of invoeding van een elektriciteitsopslagfaciliteit die
      rechtstreeks op de transformator is aangesloten, dan wel op het onderliggende distributiesysteem voor elektriciteit
      en rechtstreeks op een hoog- of middenspanningsrail op een hoogspanningsstation is aangesloten;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.8
  - number: 3.8.1.b
    text: 'een circuit en leidt tot een onderbreking van transport van elektriciteit van maximaal:'
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.8
  - number: 3.8.1.b.1°
    text: 100 MW gedurende ten hoogste zes uur voor transport ten behoeve van verbruik, of
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.8
  - number: 3.8.1.b.2°
    text: |-
      500 MW, gedurende ten hoogste twee weken voor transport ten behoeve van productie of invoeding van een
      elektriciteitsopslagfaciliteit die rechtstreeks op het circuit is aangesloten, dan wel op het onderliggende
      distributiesysteem voor elektriciteit en rechtstreeks op een hoog- of middenspanningsrail op een
      hoogspanningsstation is aangesloten;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.8
  - number: 3.8.1.c
    text: 'een railsysteem en leidt tot een onderbreking van transport van elektriciteit van maximaal:'
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.8
  - number: 3.8.1.c.1°
    text: |-
      1000 MW gedurende ten hoogste twee uur, waarna de onderbreking maximaal 500 MW is, vervolgens lineair afneemt tot
      maximaal 100 MW en na zes uur is opgelost voor transport ten behoeve van verbruik, of
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.8
  - number: 3.8.1.c.2°
    text: |-
      1500 MW gedurende ten hoogste zes uur voor transport ten behoeve van productie of invoeding van een
      elektriciteitsopslagfaciliteit die rechtstreeks op het railsysteem is aangesloten, dan wel op het
      onderliggende distributiesysteem voor elektriciteit en rechtstreeks op een hoog- of middenspanningsrail op een
      hoogspanningsstation is aangesloten.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.8
  - number: 3.8.2
    text: |-
      In afwijking van het eerste lid, aanhef en onderdelen b en c, is in een uitvalsituatie in een transmissiesysteem
      voor elektriciteit met een spanningsniveau van 110 tot 220 kV tijdens onderhoud de eis, bedoeld in artikel 3.26,
      eerste lid, aanhef, van de wet, niet van toepassing indien de uitvalsituatie betrekking heeft op:
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.8
  - number: 3.8.2.a
    text: |-
      een gesloten schakelinstallatie ten tijde van reparatie, modificatie en vervanging van dit onderdeel van het
      systeem en leidt tot een onderbreking van transport van elektriciteit van maximaal:
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.8
  - number: 3.8.2.a.1°
    text: 100 MW gedurende ten hoogste 48 uur voor transport ten behoeve van verbruik, of
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.8
  - number: 3.8.2.a.2°
    text: |-
      500 MW gedurende 48 uur voor transport ten behoeve van productie of invoeding van een
      elektriciteitsopslagfaciliteit die rechtstreeks op de schakelinstallatie is aangesloten, dan wel op het
      onderliggende distributiesysteem voor elektriciteit en rechtstreeks op een hoog- of middenspanningsrail op een
      hoogspanningsstation is aangesloten;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.8
  - number: 3.8.2.b
    text: |-
      een gasdrukpijpkabel of een oliedrukkabel ten tijde van reparatie, modificatie of vervanging van dit onderdeel van
      het systeem en leidt tot een onderbreking van transport van elektriciteit van maximaal:
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.8
  - number: 3.8.2.b.1°
    text: 100 MW gedurende ten hoogste een week voor transport ten behoeve van verbruik, of
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.8
  - number: 3.8.2.b.2°
    text: |-
      500 MW gedurende ten hoogste een week voor transport ten behoeve van productie of invoeding van een
      elektriciteitsopslagfaciliteit die rechtstreeks op de gasdrukpijpkabel of een oliedrukkabel is aangesloten, dan wel
      op het onderliggende distributiesysteem voor elektriciteit en rechtstreeks op een hoog- of middenspanningsrail op
      een hoogspanningsstation is aangesloten.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.8
  - number: 3.9.1
    text: |-
      De eis, bedoeld in artikel 3.26, eerste lid, aanhef, van de wet, is niet van toepassing in een uitvalsituatie
      in een deel van een transmissiesysteem voor elektriciteit met een spanningsniveau van 110 tot 220 kV tijdens
      werkzaamheden ter vervanging of toevoeging van een circuit of railsysteem of ter vervanging van de secundaire
      installatie in het betreffende deel van het transmissiesysteem voor elektriciteit, voor de duur van deze
      werkzaamheden, doch ten hoogste in totaal twee weken, mits:
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.9
  - number: 3.9.1.a
    text: |-
      de werkzaamheden niet kunnen worden uitgevoerd met inachtneming van de norm, bedoeld in artikel 3.26, eerste lid,
      aanhef, van de wet of, indien van toepassing, een vrijstelling als bedoeld in de artikelen 3.5, tot en met 3.11; en
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.9
  - number: 3.9.1.b
    text: |-
      remediërende maatregelen, waaronder de inzet van door aangeslotenen aan de transmissiesysteembeheerder voor
      elektriciteit aangeboden flexibiliteit, niet of onvoldoende beschikbaar zijn.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.9
  - number: 3.9.2
    text: |-
      De eis, bedoeld in artikel 3.26, eerste lid, aanhef, van de wet, is niet van toepassing in een uitvalsituatie in
      een deel van een transmissiesysteem voor elektriciteit met een spanningsniveau van 110 tot en met 380 kV tijdens
      werkzaamheden ter vervanging of toevoeging van een transformator in het betreffende deel van het transmissiesysteem
      voor elektriciteit of een transformator naar een systeemonderdeel met een lager spanningsniveau, voor de duur van
      deze werkzaamheden, doch ten hoogste in totaal vier weken, mits:
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.9
  - number: 3.9.2.a
    text: |-
      de werkzaamheden niet kunnen worden uitgevoerd met inachtneming van de norm, bedoeld in artikel 3.26, eerste lid,
      aanhef, van de wet of, indien van toepassing, een vrijstelling als bedoeld in de artikelen 3.5 tot en met 3.11; en
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.9
  - number: 3.9.2.b
    text: |-
      remediërende maatregelen, waaronder de inzet van door aangeslotenen aan de transmissiesysteembeheerder voor
      elektriciteit aangeboden flexibiliteit, niet of onvoldoende beschikbaar zijn.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.9
  - number: 3.9.3
    text: 'Onverminderd het eerste of tweede lid:'
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.9
  - number: 3.9.3.a
    text: |-
      voert de transmissiesysteembeheerder voor elektriciteit de werkzaamheden, bedoeld in het eerste of tweede lid, uit
      met inachtneming van [verordening (EU) 2017/1485](32017R1485) van de Commissie tot vaststelling van richtsnoeren
      betreffende het beheer van elektriciteitstransmissiesystemen;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.9
  - number: 3.9.3.b
    text: |-
      stuurt de transmissiesysteembeheerder voor elektriciteit aangeslotenen met een transportovereenkomst voor meer
      dan 10 MW die door een uitvalsituatie ten gevolge van de werkzaamheden, bedoeld in het eerste of tweede lid,
      kunnen worden getroffen uiterlijk twee maanden voorafgaand aan de werkzaamheden schriftelijk een vooraankondiging
      met een globale planning van de werkzaamheden en uiterlijk tien werkdagen voorafgaand aan de werkzaamheden een
      schriftelijke vooraankondiging en een op de dag nauwkeurige planning van de werkzaamheden; en
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.9
  - number: 3.9.3.c
    text: |-
      informeert de transmissiesysteembeheerder voor elektriciteit de Autoriteit Consument en Markt uiterlijk tien
      werkdagen voor aanvang van de werkzaamheden over het moment en de duur van uitvoering daarvan.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.9
  - number: '3.10'
    text: |-
      In een uitvalsituatie in een transmissiesysteem voor elektriciteit is de eis, bedoeld in artikel 3.26, eerste lid,
      aanhef, van de wet, niet van toepassing indien de uitvalsituatie betrekking heeft op:
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.10
  - number: 3.10.a
    text: een mast met een of meer bovengrondse verbindingen;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.10
  - number: 3.10.b
    text: een railsysteem gedurende een schakelsequentie.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.10
  - number: '3.11'
    text: |-
      In een uitvalsituatie in een transmissiesysteem met een spanningsniveau van 110 kV of hoger, is de eis, bedoeld in
      artikel 3.26, eerste lid, aanhef, van de wet, niet van toepassing indien de uitvalsituatie betrekking heeft op een
      onderdeel van het systeem waarvoor een ontheffing is aangevraagd als bedoeld in artikel 3.26, eerste lid, onderdeel
      c, van de wet, tot de dag na die waarop de beslissing op de aanvraag onherroepelijk is geworden.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.11
  - number: 3.12.1
    text: 'Een aanvraag voor een ontheffing als bedoeld in artikel 3.26, eerste lid, onderdeel c, van de wet, omvat:'
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.12
  - number: 3.12.1.a
    text: |-
      een aanduiding van het onderdeel van het transmissiesysteem voor elektriciteit waarvoor een ontheffing wordt
      aangevraagd en een locatiebeschrijving daarvan;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.12
  - number: 3.12.1.b
    text: |-
      de redenen voor afwijking van de norm in artikel 3.26, eerste lid, aanhef, van de wet of, indien van toepassing,
      vrijstelling in de artikelen 3.5 tot en met 3.11;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.12
  - number: 3.12.1.c
    text: |-
      de maximale omvang van onderbroken transport van elektriciteit in MW en de maximale duur van de onderbreking bij
      een uitvalsituatie met betrekking tot het onderdeel van het transmissie- of distributiesysteem voor elektriciteit
      waarvoor een ontheffing wordt aangevraagd, in voorkomend geval uitgesplitst naar transport ten behoeve van
      productie of verbruik, en een toelichting hierop;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.12
  - number: 3.12.1.d
    text: een beschrijving van de kans op een onderbreking als bedoeld in onderdeel c;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.12
  - number: 3.12.1.e
    text: |-
      een toelichting op conformiteit van de aanvraag met [Verordening (EU) 2017/1485](32017R1485) van de Commissie tot
      vaststelling van richtsnoeren betreffende het beheer van elektriciteitstransmissiesystemen;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.12
  - number: 3.12.1.f
    text: een voorstel voor de duur van de ontheffing en een onderbouwing daarvan;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.12
  - number: 3.12.1.g
    text: |-
      een beschrijving van de belangrijkste risico’s ten aanzien van de raming en planning van het project voor de
      investering om aan de norm te voldoen en een beschrijving van de maatregelen die de aanvrager neemt om deze
      risico’s te beperken.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.12
  - number: 3.12.2
    text: |-
      Indien de aanvraag betrekking heeft op het verlengen van de duur van een ontheffing, omvat de aanvraag tevens
      een motivering waarom het project voor de investering om aan de norm te voldoen niet is afgerond, waarbij wordt
      beschreven:
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.12
  - number: 3.12.2.a
    text: |-
      op welke wijze de aanvrager zich heeft ingespannen om het project te realiseren en welke maatregelen worden genomen
      om het project binnen de gevraagde verlengde termijn te realiseren, of
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.12
  - number: 3.12.2.b
    text: |-
      dat uit het investeringsplan van de aanvrager, bedoeld in artikel 3.35, vijfde lid, van de wet, volgt dat het
      betreffende project niet binnen de termijn van de verleende ontheffing kon worden afgerond.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.12
  - number: '3.13'
    text: |-
      De Autoriteit Consument en Markt neemt het besluit op de aanvraag tot een ontheffing zo spoedig mogelijk, doch
      uiterlijk zes maanden na ontvangst van de aanvraag. Deze termijn kan eenmaal met ten hoogste zes maanden worden
      verlengd.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.13
  - number: '3.14'
    text: |-
      Aan de ontheffing wordt de voorwaarde verbonden dat wanneer het systeemonderdeel waarvoor ontheffing wordt verleend
      ingrijpend wordt gerenoveerd of gemodificeerd, het desbetreffende systeemonderdeel wordt aangepast overeenkomstig
      de norm in artikel 3.26, eerste lid, van de wet of, indien van toepassing, een vrijstelling in de artikelen 3.5 tot
      en met 3.11.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.14
  - number: 3.15.1
    text: |-
      Een ontheffing wordt verleend voor een onderdeel van het transmissiesysteem voor elektriciteit dat op 1 januari
      2021 niet voldoet aan de norm, bedoeld in artikel 3.26, eerste lid, van de wet of, indien van toepassing, een
      vrijstelling als bedoeld in de artikelen 3.5 tot en met 3.11, voor ten hoogste de maximale omvang en duur van de
      onderbreking bij een uitvalsituatie met betrekking tot dat onderdeel op die datum.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.15
  - number: 3.15.2
    text: |-
      De uitvalsituatie waarop de ontheffing betrekking heeft leidt niet tot overschrijding van de operationele
      veiligheidsgrenzen die zijn vastgesteld bij of krachtens [Verordening (EU) 2017/1485](32017R1485) van de Commissie
      tot vaststelling van richtsnoeren betreffende het beheer van elektriciteitstransmissiesystemen.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.15
  - number: 3.15.3
    text: 'Een ontheffing, of een verlenging daarvan, wordt verleend voor ten hoogste:'
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.15
  - number: 3.15.3.a
    text: |-
      tien jaren, indien het een onderdeel van het transmissiesysteem met een spanningsniveau van 220 kV of hoger
      betreft;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.15
  - number: 3.15.3.b
    text: vijf jaren, indien het een onderdeel van het transmissiesysteem met een spanningsniveau van 110 tot 220 kV betreft.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.15
  - number: 3.16.1
    text: |-
      De Autoriteit Consument en Markt weigert een ontheffing indien de aanvraag niet voldoet aan de vereisten in artikel
      3.15 reikwijdte en duur ontheffing of vrijstelling.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.16
  - number: 3.16.2
    text: |-
      De Autoriteit Consument en Markt kan een verlenging van een ontheffing weigeren indien de aanvrager zich naar het
      oordeel van de Autoriteit Consument en Markt onvoldoende heeft ingespannen om het project voor de investering om
      aan de norm te voldoen te realiseren.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.16
  - number: 3.16.3
    text: |-
      De Autoriteit Consument en Markt kan een ontheffing of de daaraan verbonden voorschriften of beperkingen wijzigen
      of aanvullen.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.16
  - number: 3.16.4
    text: 'De Autoriteit Consument en Markt kan een ontheffing intrekken indien:'
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.16
  - number: 3.16.4.a
    text: |-
      bij de aanvraag onjuiste of onvolledige gegevens zijn verstrekt en de verstrekking van juiste en volledige gegevens
      tot een andere beschikking op de aanvraag zou hebben geleid;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.16
  - number: 3.16.4.b
    text: de aan de ontheffing verbonden voorschriften of beperkingen niet worden nageleefd;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.16
  - number: 3.16.4.c
    text: de transmissiesysteembeheerder aan wie de ontheffing is verleend, verzoekt om intrekking van de ontheffing.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.16
  - number: '3.17'
    text: |-
      Een door Onze Minister op grond van artikel 3.27, eerste lid, van de wet, aangewezen bovengronds deel van een
      systeem, wordt op verzoek van een college van burgemeester en wethouders of van gedeputeerde staten verplaatst of
      vervangen, indien dat deel:
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.17
  - number: 3.17.a
    text: ten minste 1000 meter lang is, tenzij het een systeem betreft met een spanningsniveau van 50 kV; of
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.17
  - number: 3.17.b
    text: |-
      ten minste 500 meter lang is, voor zover het een deel betreft dat direct is verbonden met een transformator-,
      schakel-, verdeel- of onderstation, voor zover het een te vervangen deel betreft.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.17
  - number: '3.18'
    text: |-
      De op grond van artikel 3.27, eerste lid, van de wet, aan te wijzen bovengrondse delen van systemen worden slechts
      aangewezen als vervanging of verplaatsing kostenefficiënt is. Bij de aanwijzing kan worden bepaald dat een deel
      wordt aangewezen voor verplaatsing of voor vervanging.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.18
  - number: 3.19.1
    text: |-
      Een indiener van een verzoek tot verplaatsing of vervanging als bedoeld in artikel 3.27, eerste lid, van de wet,
      of een verzoek tot het doen van onderzoek als bedoeld in artikel 3.27, derde lid, van de wet, betaalt van de kosten
      voor de uitvoering van het betreffende verzoek:
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.19
  - number: 3.19.1.a
    text: 20%, indien het deel zich bevindt in een gemeente met meer dan 30.000 inwoners, of
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.19
  - number: 3.19.1.b
    text: 15%, indien het deel zich bevindt in een gemeente met ten hoogste 30.000 inwoners.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.19
  - number: 3.19.2
    text: |-
      In afwijking van het eerste lid betaalt een indiener voor de uitvoering van de verzoeken, bedoeld in het eerste
      lid, tezamen, een bedrag dat wordt berekend door € 975.000,– te vermenigvuldigen met het aantal kilometers,
      afgerond op één cijfer achter de komma, waaruit het aan te leggen deel bestaat, indien dat bedrag lager is dan het
      bedrag dat de indiener op grond van het eerste lid zou betalen.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.19
  - number: 3.19.3
    text: |-
      Bij ministeriële regeling worden regels gesteld over de wijze van bepaling van de inwonertallen, bedoeld in het
      eerste lid, en de indexering van het in het tweede lid bedoelde bedrag op bij die regeling te bepalen wijze.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.19
  - number: 3.20.1
    text: |-
      Als kosten voor de uitvoering van een verzoek tot verplaatsing of vervanging als bedoeld in artikel 3.27,
      eerste lid, van de wet, worden aangemerkt de kosten die de transmissie- of distributiesysteembeheerder na de
      investeringsbeslissing van de indiener maakt.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.20
  - number: 3.20.2
    text: |-
      Als kosten voor de uitvoering van een verzoek tot het doen van een onderzoek als bedoeld in artikel 3.27, derde
      lid, van de wet, worden aangemerkt de kosten die de transmissie- of distributiesysteembeheerder voorafgaand aan de
      investeringsbeslissing van de indiener maakt.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.20
  - number: 3.20.3
    text: |-
      Bij ministeriële regeling worden regels gesteld over de bestanddelen van de uitvoeringskosten, bedoeld in het
      eerste en tweede lid, en de daarop in mindering te brengen kosten of opbrengsten.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.20
  - number: '3.21'
    text: |-
      Indien een transmissie- of distributiesysteembeheerder onvoldoende mensen en middelen beschikbaar heeft om aan
      alle ontvangen verzoeken tot verplaatsing of vervanging gelijktijdig uitvoering te geven, hanteert de transmissie-
      of distributiesysteembeheerder de volgorde van binnenkomst van de verzoeken als uitgangspunt voor de volgorde van
      uitvoering.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.21
  - number: '3.22'
    text: |-
      De aanvraag, bedoeld in artikel 3.27, vierde lid, van de wet, bevat een beschrijving waarin wordt onderbouwd dat
      het vervangen of verplaatsen van dat deel technisch of ruimtelijk niet haalbaar is of strijdig is met het belang
      van leveringszekerheid.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.22
  - number: 3.23.1
    text: |-
      Een investeringsplan als bedoeld in artikel 3.34, eerste lid, van de wet geldt voor een termijn van twee jaren of
      totdat er een nieuw investeringsplan is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.23
  - number: 3.23.2
    text: |-
      Een transmissie- of distributiesysteembeheerder of transmissiesysteembeheerder voor elektriciteit op zee legt een
      ontwerpinvesteringsplan voor aan de Autoriteit Consument en Markt uiterlijk op de eerste dag na 1 januari van een
      even kalenderjaar die niet een zaterdag of een zondag is.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.23
  - number: 3.23.3
    text: |-
      Indien door onvoorziene omstandigheden binnen de termijn van twee jaren, bedoeld in het eerste lid, noodzakelijk
      is om een significante wijziging in de geplande uitbreidings- of vervangingsinvesteringen aan te brengen die
      ook binnen die termijn werking moet krijgen, wordt het investeringsplan tussentijds herzien. De transmissie- of
      distributiesysteembeheerder of transmissiesysteembeheerder voor elektriciteit op zee legt een ontwerpherziening
      van het investeringsplan zo spoedig mogelijk voor aan de Autoriteit Consument en Markt. Artikel 3.26, is van
      overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.23
  - number: 3.24.1
    text: |-
      De beschrijving en onderbouwing van de noodzakelijke uitbreidings- en vervangingsinvesteringen, bedoeld in artikel
      3.34, tweede lid, onderdeel a, van de wet, omvat:
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.24
  - number: 3.24.1.a
    text: |-
      de planning, voortgang en beoogde realisatiedatum van de geplande investeringen, geactualiseerd tot zes maanden
      voor de voorlegging ter consultatie van het ontwerpinvesteringsplan, bedoeld in artikel 3.35 van de wet;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.24
  - number: 3.24.1.b
    text: de uitbreidings- of vervangingsinvesteringen die in de eerstkomende vijf jaren moeten worden gepland;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.24
  - number: 3.24.1.c
    text: |-
      een kwalitatieve omschrijving van de uitbreidings- en vervangingsinvesteringen die naar verwachting in de
      eerstkomende vijftien jaren moeten worden gepland;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.24
  - number: 3.24.1.d
    text: een aanduiding van en verklaring voor de wijzigingen ten opzichte van het voorgaande investeringsplan; en
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.24
  - number: 3.24.1.e
    text: |-
      de uitbreidings- en vervangingsinvesteringen die zijn gerealiseerd in het kalenderjaar voorafgaand aan het jaar
      waarin het ontwerp investeringsplan ter consultatie wordt voorgelegd.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.24
  - number: 3.24.2
    text: |-
      De beschrijving en onderbouwing van de congestie- of systeembeheersdiensten die de transmissie- of
      distributiesysteembeheerder of de transmissiesysteembeheerder voor elektriciteit op zee zal inkopen ter voorkoming
      van verzwaring van het systeem, bedoeld in artikel 3.34, tweede lid, onderdeel b, van de wet omvat:
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.24
  - number: 3.24.2.a
    text: |-
      de congestie- of systeembeheersdiensten die worden ingekocht en de uitbreidings- of vervangingsinvesteringen die
      hiermee worden voorkomen;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.24
  - number: 3.24.2.b
    text: |-
      de congestie- of systeembeheersdiensten die in de eerstkomende vijf jaren moeten worden ingekocht ter voorkoming
      van verzwaring van het systeem en de uitbreidings- of vervangingsinvesteringen die daarmee worden voorkomen; en
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.24
  - number: 3.24.2.c
    text: een aanduiding en verklaring voor de wijzigingen ten opzichte van het voorgaande investeringsplan.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.24
  - number: 3.24.3
    text: |-
      Het investeringsplan van een transmissie- of distributiesysteembeheerder bevat bij de beschrijving en onderbouwing
      van de noodzakelijke uitbreidings- en vervangingsinvesteringen, bedoeld in het eerste lid, een beschrijving
      van de ontwikkelingen in de energiemarkt en andere ontwikkelingen die van invloed zijn op de inrichting van
      het transmissie- of distributiesysteem, een analyse van deze ontwikkelingen in de vorm van scenario’s voor de
      eerstkomende vijfentwintig jaar en hoe de noodzakelijke uitbreidings- en vervangingsinvesteringen aansluiten bij
      deze scenario’s.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.24
  - number: 3.24.4
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld over de inhoud en inrichting van een investeringsplan en de
      procedure van totstandkoming van scenario’s, bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.24
  - number: 3.25.1
    text: |-
      Een transmissie- of distributiesysteembeheerder houdt bij het bepalen van de volgorde van de uitvoering van de
      noodzakelijke uitbreidingsinvesteringen rekening met het maatschappelijk belang van de investeringen door een
      hogere prioriteit toe te kennen aan de uitvoering naar de mate waarin de investeringen een bijdrage leveren aan de
      transitie naar een duurzame energievoorziening, tenzij de uitvoering van overige wettelijke taken en verplichtingen
      of de onderlinge samenhang tussen investeringen een andere volgorde rechtvaardigt.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.25
  - number: 3.25.2
    text: |-
      Een transmissie- of distributiesysteembeheerder of transmissiesysteembeheerder voor elektriciteit op zee maakt in
      het investeringsplan inzichtelijk hoe uitvoering is gegeven aan het eerste lid.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.25
  - number: 3.25.3
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld voor de prioritering van noodzakelijke
      uitbreidingsinvesteringen.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.25
  - number: 3.26.1
    text: |-
      Een transmissie- of distributiesysteembeheerder of transmissiesysteembeheerder voor elektriciteit op zee
      consulteert een ontwerpinvesteringsplan gedurende een bij ministeriële regeling vast te leggen periode door
      publicatie van het ontwerpinvesteringsplan op een voor eenieder kenbare en toegankelijke wijze.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.26
  - number: 3.26.2
    text: |-
      De transmissie- of distributiesysteembeheerder of transmissiesysteembeheerder voor elektriciteit op zee
      voegt de consultatiereacties bij het ontwerpinvesteringsplan en geeft aan hoe deze zijn verwerkt in het
      ontwerpinvesteringsplan.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.26
  - number: 3.26.3
    text: |-
      De Autoriteit Consument en Markt toetst het ontwerpinvesteringsplan binnen een bij ministeriële regeling vast te
      leggen termijn nadat het ontwerpinvesteringsplan overeenkomstig artikel 3.35 van de wet is voorgelegd.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.26
  - number: 3.26.4
    text: |-
      Indien het ontwerpinvesteringsplan de Autoriteit Consument en Markt aanleiding geeft tot het opleggen van
      een bindende gedragslijn als bedoeld in artikel 5.20, eerste lid, van de wet, stelt de transmissie- of
      distributiesysteembeheerder of transmissiesysteembeheerder voor elektriciteit op zee het investeringsplan niet vast
      dan nadat het investeringsplan overeenkomstig de gedragslijn is aangepast.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.26
  - number: 3.26.6
    text: |-
      Een transmissie- of distributiesysteembeheerder of transmissiesysteembeheerder voor elektriciteit op zee publiceert
      het investeringsplan na vaststelling onverwijld op een voor eenieder kenbare en toegankelijke wijze en zendt het
      aan Onze Minister en de Autoriteit Consument en Markt.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.26
  - number: 3.26.7
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld over de toepassing van het eerste tot en met vierde
      lid en het zesde lid.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.26
  - number: 3.27.1
    text: |-
      Een distributiesysteembeheerder voor gas kan een verzoek om een kleine aansluiting in een gebied buiten de bebouwde
      kom als bedoeld in artikel 20a van de Wegenverkeerswet 1994 afwijzen wegens het niet onder economische voorwaarden
      kunnen beheren, onderhouden en ontwikkelen van een distributiesysteem voor gas in dat gebied, tenzij de equivalente
      uitbreiding van het distributiesysteem voor gas niet groter is dan de acceptabele uitbreiding daarvan, waarbij:
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.27
  - number: 3.27.1.a
    text: |-
      de acceptabele uitbreiding van het distributiesysteem voor gas wordt vastgesteld door voor alle verzoeken, of
      redelijkerwijs te verwachten verzoeken om aansluiting, de rekencapaciteit op te tellen en te vermenigvuldigen met
      7,5; en
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.27
  - number: 3.27.1.b
    text: |-
      de equivalente uitbreiding van het distributiesysteem voor gas wordt vastgesteld door de kortste route langs de weg
      te bepalen van het distributiesysteem voor gas tot aan de aansluiting, met uitzondering van de aansluitleidingen,
      gecorrigeerd voor de aard van het te doorkruisen gebied en in indien nodig voor een of meer reduceerstations.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.27
  - number: 3.27.2
    text: |-
      Bij ministeriële regeling kan worden bepaald dat de equivalente uitbreiding van het distributiesysteem voor gas
      wordt gecorrigeerd:
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.27
  - number: 3.27.2.a
    text: voor het te doorkruisen gebied;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.27
  - number: 3.27.2.b
    text: wanneer een of meer reduceerstations noodzakelijk zijn.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.27
  - number: 3.28.1
    text: |-
      Bij de beoordeling of maatregelen als bedoeld in artikel 3.40, vierde lid, van de wet of artikel 3.47, tweede lid,
      van de wet, economisch verantwoord zijn, weegt de transmissie- of distributiesysteembeheerder voor gas de verwachte
      kosten van maatregelen die hij of een andere distributiesysteembeheerder voor gas of de transmissiesysteembeheerder
      voor gas moet nemen om de producent van gas uit hernieuwbare bronnen een aanbod voor aansluiting of transport te
      kunnen doen, af tegen de redelijkerwijs te verwachten hoeveelheid gas uit hernieuwbare bronnen dat door dat aanbod
      aan de producent ingevoed kan worden op zijn systeem.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.28
  - number: 3.28.2
    text: |-
      Bij de afweging, bedoeld in het eerste lid, neemt de transmissie- of distributiesysteembeheerder voor gas in ieder
      geval in acht:
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.28
  - number: 3.28.2.a
    text: |-
      het belang van de hoeveelheid gas uit hernieuwbare bronnen dat door het aanbod aan de producent kan worden ingevoed
      op zijn systeem gelet op de door het kabinet vastgestelde doelstellingen voor de productie van gas uit hernieuwbare
      bronnen;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.28
  - number: 3.28.2.b
    text: |-
      de aanvullende capaciteit voor aansluiting van of transport voor andere producenten van gas uit hernieuwbare
      bronnen die door de maatregelen van de transmissie- of distributiesysteembeheerder voor gas wordt gerealiseerd en
      het verwachte toekomstige gebruik en belang hiervan gelet op de door het kabinet vastgestelde doelstellingen voor
      de productie van gas uit hernieuwbare bronnen;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.28
  - number: 3.28.2.c
    text: |-
      de verwachte ontwikkeling van de vraag naar gas in relevante delen van het transmissie- of distributiesysteem en de
      betekenis daarvan voor de maatregelen, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.28
  - number: 3.28.3
    text: |-
      Indien uit de afweging, als bedoeld in het eerste lid, blijkt dat verschillende maatregelen economisch verantwoord
      zijn, hanteren de transmissie- of distributiesysteembeheerders voor gas de meest kostenefficiënte maatregelen.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.28
  - number: 3.28.4
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld over de toepassing van het eerste tot en met het
      derde lid.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.28
  - number: 3.29.1
    text: |-
      Een transmissie- of distributiesysteembeheerder stelt een aansluiting of een aan een aansluiting toegekend
      additioneel allocatiepunt buiten werking in ieder geval indien:
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.29
  - number: 3.29.1.a
    text: |-
      op het primaire of additionele allocatiepunt van de aansluiting ten behoeve van het verbruik of de invoeding geen
      leverancier of marktdeelnemer is gecontracteerd overeenkomstig artikel 2.1 of 2.2, eerste lid, van de wet;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.29
  - number: 3.29.1.b
    text: |-
      op het primaire of additionele allocatiepunt van de aansluiting geen balanceringsverantwoordelijke voor
      elektriciteit of gas actief is overeenkomstig artikel 2.42 of artikel 2.43 van de wet;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.29
  - number: 3.29.1.c
    text: |-
      op of nabij een voor de aansluiting vastgesteld overdrachtspunt geen geïnstalleerde meetinrichting aanwezig is waar
      dat op grond van het gestelde bij of krachtens artikel 2.46, van de wet is vereist;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.29
  - number: 3.29.1.d
    text: |-
      op een aansluiting of een aan een aansluiting toegekend additioneel allocatiepunt van een aangeslotene als bedoeld
      in artikel 2.47, tweede lid, van de wet geen meetverantwoordelijke partij actief is, of
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.29
  - number: 3.29.1.e
    text: |-
      de aansluitovereenkomst is beëindigd en de aansluiting niet aansluitend opnieuw in gebruik is of zal worden
      gegeven.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.29
  - number: 3.29.2
    text: |-
      Een transmissie- of distributiesysteembeheerder verwijdert een aansluiting in ieder geval indien de
      aansluitovereenkomst is beëindigd en:
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.29
  - number: 3.29.2.a
    text: niet aannemelijk is dat een verzoek zal worden gedaan om deze aansluiting opnieuw in gebruik te geven, of
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.29
  - number: 3.29.2.b
    text: |-
      dit nodig is vanuit de beheertaak, bedoeld in artikel 3.25 van de wet, of de kwaliteitsborging, bedoeld in artikel
      3.74 van de wet.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.29
  - number: 3.30.1
    text: |-
      Een transmissiesysteembeheerder voor gas zorgt voor alle voorzieningen op het gebied van gasinkoop,
      flexibiliteitsdiensten en gastransport op het transmissiesysteem voor gas die nodig zijn om vergunninghouders
      in staat te stellen de pieklevering te verzorgen voor alle eindafnemers van gas met een kleine aansluiting in
      Nederland. Deze voorzieningen moeten volstaan om pieklevering te kunnen verzorgen op een dag met een gemiddelde
      effectieve etmaaltemperatuur van -17 °C.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.30
  - number: 3.30.2
    text: |-
      Indien transmissiesysteembeheerder voor gas voor de uitvoering van de taak, bedoeld in het eerste lid, een openbare
      inkoopprocedure volgt, dient te worden verzekerd dat de voorzieningen:
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.30
  - number: 3.30.2.a
    text: worden aangehouden in een gasopslagsysteem;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.30
  - number: 3.30.2.b
    text: zowel het volume als de productiecapaciteit die noodzakelijk zijn voor de pieklevering omvatten; en
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.30
  - number: 3.30.2.c
    text: |-
      gedurende de maanden december tot en met februari van enig jaar te allen tijde beschikbaar zijn voor de
      pieklevering.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.30
  - number: 3.30.3
    text: |-
      Een transmissiesysteembeheerder voor gas stelt ter uitvoering van zijn taak, bedoeld in het eerste lid, gas
      beschikbaar aan vergunninghouders op de punten waar een verbinding bestaat tussen het transmissiesysteem voor gas
      en distributiesystemen voor gas.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.30
  - number: 3.30.4
    text: |-
      Een transmissiesysteembeheerder voor gas stelt de totale omvang vast van de voorzieningen, bedoeld in het eerste
      lid, en stelt deze ter beschikking aan vergunninghouders naar rato van hun aantal eindafnemers van gas met een
      kleine aansluiting.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.30
  - number: 3.30.5
    text: |-
      Een distributiesysteembeheerder voor gas verstrekt aan een transmissiesysteembeheerder voor gas de informatie die
      nodig is om per vergunninghouder de benodigde omvang van de voorzieningen, bedoeld in het eerste lid, te bepalen.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.30
  - number: 3.31.1
    text: |-
      Bij het waarborgen van de kwaliteit van de uitvoering van zijn wettelijke taken en verplichtingen, betrekt
      de transmissie- of distributiesysteembeheerder ten minste de volgende kwaliteitsaspecten: de veiligheid, de
      betrouwbaarheid van zijn systeem, de productkwaliteit, de kwaliteit van de dienstverlening en de kwaliteit van
      meetdata en het beheer daarvan.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.31
  - number: 3.31.2
    text: |-
      Een transmissie- of distributiesysteembeheerder hanteert een doeltreffend kwaliteitsborgingssysteem voor de
      uitvoering van zijn wettelijke taken en verplichtingen.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.31
  - number: 3.31.3
    text: |-
      Een transmissie- of distributiesysteembeheerder handelt overeenkomstig de plannen, processen en procedures van
      het kwaliteitsborgingssysteem.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.31
  - number: 3.31.4
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld over de uitvoering van het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.31
  - number: 3.32.1
    text: Een transmissie- of distributiesysteembeheerder stelt een kwaliteitsplan vast.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.32
  - number: 3.32.2
    text: 'Het kwaliteitsplan bevat ten minste een beschrijving van:'
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.32
  - number: 3.32.2.a
    text: het gehanteerde kwaliteitsborgingssysteem;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.32
  - number: 3.32.2.b
    text: de doelstelling van het kwaliteitsborgingssysteem;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.32
  - number: 3.32.2.c
    text: |-
      de kwaliteitsniveaus die de transmissie- of distributiesysteembeheerder nastreeft op de verschillende
      kwaliteitsaspecten, genoemd in artikel 3.31;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.32
  - number: 3.32.2.d
    text: de belangrijkste risico’s voor de kwaliteitsniveaus;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.32
  - number: 3.32.2.e
    text: |-
      de door de transmissie- of distributiesysteembeheerder geïdentificeerde bestaande en toekomstige knelpunten voor de
      realisatie van de verschillende kwaliteitsniveaus;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.32
  - number: 3.32.2.f
    text: |-
      de door de transmissie- of distributiesysteembeheerder gehanteerde maatregelen voor het waarborgen van de
      kwaliteitsniveaus;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.32
  - number: 3.32.2.g
    text: |-
      de wijze waarop de kwaliteitsniveaus gerealiseerd kunnen worden en de knelpunten geadresseerd kunnen worden met de
      maatregelen, bedoeld in onderdeel f;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.32
  - number: 3.32.2.h
    text: |-
      de kritische prestatie-indicatoren en de streefwaardes die gebruikt worden bij de beheersing van de
      kwaliteitsniveaus.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.32
  - number: 3.32.3
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld over de inhoud van het kwaliteitsplan.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.32
  - number: 3.33.1
    text: |-
      Een transmissie- of distributiesysteembeheerder legt tweejaarlijks een ontwerpkwaliteitsplan voor aan de Autoriteit
      Consument en Markt en aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.33
  - number: 3.33.2
    text: |-
      De Autoriteit Consument en Markt en Onze Minister toetsen binnen twaalf weken nadat het ontwerpkwaliteitsplan is
      voorgelegd of het kwaliteitsplan voldoet aan de eisen, gesteld bij of krachtens artikel 3.32. Onze Minister toetst
      het ontwerpkwaliteitsplan enkel op onderdelen waarvoor Onze Minister op grond van artikel 5.18, eerste lid, van de
      wet is belast met het toezicht op de naleving.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.33
  - number: 3.33.3
    text: |-
      In afwijking van het eerste en tweede lid legt de transmissiesysteembeheerder voor elektriciteit een
      ontwerpkwaliteitsplan enkel voor aan de Autoriteit Consument en Markt en wordt dat plan enkel getoetst door de
      Autoriteit Consument en Markt.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.33
  - number: 3.33.4
    text: |-
      Indien het ontwerpkwaliteitsplan de Autoriteit Consument en Markt of Onze Minister aanleiding geeft tot
      het opleggen van een bindende gedragslijn als bedoeld in artikel 5.20 van de wet, stelt de transmissie- of
      distributiesysteembeheerder het kwaliteitsplan niet vast dan nadat het kwaliteitsplan overeenkomstig de gedragslijn
      is aangepast.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.33
  - number: 3.33.5
    text: |-
      De transmissie- of distributiesysteembeheerder publiceert het kwaliteitsplan na vaststelling onverwijld op een
      geschikte wijze en zendt het aan Onze Minister en de Autoriteit Consument en Markt.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.33
  - number: 3.33.6
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld over de procedure, bedoeld in het eerste, tweede en
      vijfde lid.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.33
  - number: 3.34.1
    text: |-
      Een distributiesysteembeheerder of beheerder van een gesloten systeem voorziet in een transparante, eenvoudige
      en goedkope procedure voor de behandeling van klachten van aangeslotenen met een kleine aansluiting over het
      systeembeheer.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.34
  - number: 3.34.2
    text: 'De in het eerste lid bedoelde procedure voorziet er voorts in dat:'
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.34
  - number: 3.34.2.a
    text: |-
      de behandeling van de klacht geschiedt door een persoon die niet bij de gedraging waarop de klacht betrekking
      heeft, betrokken is geweest;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.34
  - number: 3.34.2.b
    text: |-
      de klager schriftelijk en gemotiveerd in kennis wordt gesteld van de bevindingen naar aanleiding van de klacht en
      van de conclusies die daaraan worden verbonden; en
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.34
  - number: 3.34.2.c
    text: de klacht zo spoedig mogelijk, doch uiterlijk binnen acht weken na ontvangst van de klacht wordt afgehandeld.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.34
  - number: 3.35.1
    text: |-
      Een transmissie- of distributiesysteembeheerder van een transmissie- of distributiesysteem dat bestemd is of
      gebruikt wordt voor het transport van gas bij een druk tot en met 16 bar, neemt bij het ontwerp, de aanleg, de
      ingebruikstelling, de exploitatie, de wijziging, het beheer, het onderhoud en de buitengebruikstelling van een
      transmissie- of distributiesysteem de technische en organisatorische maatregelen die redelijkerwijs van hem gevergd
      kunnen worden om voorvallen te voorkomen waardoor nadelige gevolgen voor de mens of het milieu kunnen ontstaan.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.35
  - number: 3.35.2
    text: |-
      Indien zich een voorval als bedoeld in het eerste lid voordoet waardoor nadelige gevolgen voor de mens of het
      milieu zijn ontstaan, draagt de transmissie- of distributiesysteembeheerder zorg voor het zoveel mogelijk beperken
      of ongedaan maken van de nadelige gevolgen voor de mens en het milieu.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.35
  - number: 3.36.1
    text: |-
      Een transmissie- of distributiesysteembeheerder, transmissiesysteembeheerder voor elektriciteit op zee of beheerder
      van een gesloten systeem draagt er zorg voor dat aangeslotenen op een eenvoudige wijze onderbrekingen in het
      transport van elektriciteit of gas, afwijkingen van de eisen aan de kwaliteit van het transport van elektriciteit
      of gas, of waarnemingen van gaslucht kunnen melden en maakt aan aangeslotenen bekend op welke wijze deze meldingen
      kunnen worden gedaan.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.36
  - number: 3.36.2
    text: |-
      Indien zich met betrekking tot een systeem voor gas dat bestemd is of gebruikt wordt voor het transport van gas bij
      een druk tot en met 16 bar een voorval voordoet of heeft voorgedaan waardoor nadelige gevolgen voor de mens of het
      milieu zijn ontstaan of dreigen te ontstaan, meldt de transmissie- of distributiesysteembeheerder dat voorval bij
      Onze Minister.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.36
  - number: 3.36.3
    text: |-
      Indien zich met betrekking tot een systeem voor elektriciteit een voorval voordoet of heeft voorgedaan waardoor
      nadelige gevolgen voor de mens of het milieu zijn ontstaan of dreigen te ontstaan, meldt de transmissie- of
      distributiesysteembeheerder dat voorval bij de Autoriteit Consument en Markt.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.36
  - number: 3.36.4
    text: |-
      De meldingen, bedoeld in het tweede en derde lid, worden zo spoedig mogelijk gedaan, doch uiterlijk binnen één dag,
      tenzij bij ministeriële regeling een andere termijn is bepaald.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.36
  - number: 3.36.5
    text: |-
      Een transmissie- of distributiesysteembeheerder, transmissiesysteembeheerder voor elektriciteit op zee of beheerder
      van een gesloten systeem registreert de bij hem gemelde voorvallen, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.36
  - number: 3.36.6
    text: 'Bij ministeriële regeling kunnen regels worden gesteld over:'
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.36
  - number: 3.36.6.a
    text: de meldplicht, bedoeld in het eerste tot en met het vierde lid;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.36
  - number: 3.36.6.b
    text: de gegevens die worden geregistreerd;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.36
  - number: 3.36.6.c
    text: de wijze waarop de registraties worden gedaan;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.36
  - number: 3.36.6.d
    text: de openbaarmaking van de registraties.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.36
  - number: 3.37.1
    text: |-
      Een transmissie- of distributiesysteembeheerder stelt ten minste iedere vijf jaren een calamiteitenplan vast en
      zendt dit en tussentijdse aanpassingen van het calamiteitenplan ter goedkeuring aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.37
  - number: 3.37.2
    text: Bij ministeriële regeling worden nadere eisen gesteld aan het calamiteitenplan.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.37
  - number: 3.37.3
    text: |-
      Onze Minister beoordeelt of het calamiteitenplan voldoet aan de eisen, bedoeld in het tweede lid, en kan de
      transmissie- of distributiesysteembeheerder verzoeken het calamiteitenplan aan te passen.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.37
  - number: '3.38'
    text: |-
      Als een aangeslotene van leverancier, marktdeelnemer die aggregeert, balanceringsverantwoordelijke, of
      meetverantwoordelijke partij wisselt, voert de desbetreffende systeembeheerder die wisseling door in zijn register,
      overeenkomstig bij ministeriële regeling te stellen regels, waarbij in ieder geval regels worden gesteld over
      de termijn waarbinnen de wisseling moet zijn doorgevoerd en over de bij een verzoek om wisseling te verstrekken
      gegevens.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.38
  - number: 3.39.1
    text: |-
      Indien een distributiesysteembeheerder uit de hem ter beschikking staande gegevens redenen heeft om te vermoeden
      dat de continuïteit van de levering door een vergunninghouder in gevaar komt, meldt hij dat zo spoedig mogelijk aan
      de transmissiesysteembeheerder voor elektriciteit of gas en aan de Autoriteit Consument en Markt.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.39
  - number: 3.39.2
    text: |-
      Tot en met tien werkdagen na het tijdstip waarop een beschikking tot intrekking van een vergunning als bedoeld in
      artikel 2.18, derde lid, van de wet is gegeven, of, indien dat korter is, tot het tijdstip waarop een dergelijke
      beschikking in werking is getreden, is ingetrokken of de Autoriteit Consument en Markt een besluit als bedoeld in
      artikel 2.15, eerste lid, neemt:
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.39
  - number: 3.39.2.a
    text: |-
      voert een distributiesysteembeheerder geen leverancierswisseling door in het register, bedoeld in artikel 4.5,
      tweede lid, van de wet, ten aanzien van eindafnemers met een kleine aansluiting die een leveringsovereenkomst of
      leveringsovereenkomst inzake peer-to-peer-handel hebben met de betrokken vergunninghouder;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.39
  - number: 3.39.2.b
    text: |-
      staat de transmissiesysteembeheerder voor elektriciteit of gas garant voor de betaling van de inkoop van
      elektriciteit of gas, waaronder die als gevolg van onbalans, ten behoeve van de levering aan eindafnemers met een
      kleine aansluiting die een leveringsovereenkomst of leveringsovereenkomst inzake peer-to-peer-handel hebben met
      de betrokken vergunninghouder indien de betrokken vergunninghouder dan wel de curator daarom verzoekt en aantoont
      dat hij onvoldoende liquide middelen ter beschikking heeft of kan krijgen om te waarborgen dat gedurende de in de
      aanhef bedoelde periode de levering van elektriciteit of gas aan deze eindafnemers kan worden voortgezet.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.39
  - number: 3.39.3
    text: |-
      Indien op de elfde dag na het tijdstip waarop een beschikking tot intrekking van een vergunning als bedoeld in
      artikel 2.18, derde lid, van de wet is gegeven deze beschikking niet in werking is getreden of niet is ingetrokken,
      of indien dat korter is, de Autoriteit Consument en Markt een besluit tot verdeling als bedoeld in artikel 2.15,
      eerste lid, neemt:
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.39
  - number: 3.39.3.a
    text: |-
      voert een distributiesysteembeheerder geen leverancierswisseling door in het register, bedoeld in artikel 4.5,
      tweede lid, van de wet, ten aanzien van eindafnemers met een kleine aansluiting die een leveringsovereenkomst of
      leveringsovereenkomst inzake peer-to-peer-handel hebben met de betrokken vergunninghouder totdat de verdeling is
      afgerond conform onderdeel d;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.39
  - number: 3.39.3.b
    text: |-
      verstrekt een distributiesysteembeheerder aan de transmissiesysteembeheerder voor elektriciteit of gas de gegevens
      die de Autoriteit Consument en Markt nodig heeft voor het besluit tot verdeling;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.39
  - number: 3.39.3.c
    text: |-
      verstrekt de transmissiesysteembeheerder voor elektriciteit of gas de gegevens, bedoeld in onderdeel b, aan de
      Autoriteit Consument en Markt;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.39
  - number: 3.39.3.d
    text: |-
      coördineert de transmissiesysteembeheerder voor elektriciteit of gas op aanwijzing van de Autoriteit Consument en
      Markt het doorvoeren van het besluit tot verdeling in het register, bedoeld in artikel 4.5, tweede lid, van de wet,
      en geeft daartoe aanwijzingen aan de distributiesysteembeheerders;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.39
  - number: 3.39.3.e
    text: |-
      verstrekt de transmissiesysteembeheerder voor elektriciteit of gas conform het besluit tot verdeling aan de
      aangewezen leveranciers de gegevens, bedoeld in artikel 2.15, tweede lid, van de aan hen toegewezen eindafnemers;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.39
  - number: 3.39.3.f
    text: |-
      staat de transmissiesysteembeheerder voor elektriciteit of gas garant voor de betaling van de inkoop van
      elektriciteit of gas, waaronder die als gevolg van onbalans, ten behoeve van de levering aan eindafnemers met een
      kleine aansluiting, die een geldende leveringsovereenkomst of leveringsovereenkomst inzake peer-to-peer-handel
      hebben met de betrokken vergunninghouder, gedurende de periode tussen de in de aanhef bedoeld dag en het tijdstip
      van inwerkingtreding van het besluit tot verdeling van de Autoriteit Consument en Markt, indien de vergunninghouder
      dan wel de curator daarom verzoekt en aantoont dat hij onvoldoende liquide middelen ter beschikking heeft of kan
      krijgen om te waarborgen dat gedurende deze periode de levering van elektriciteit of gas kan worden voortgezet;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.39
  - number: 3.39.3.g
    text: |-
      staat de transmissiesysteembeheerder voor elektriciteit of gas garant voor de betaling van de inkoop van
      elektriciteit of gas ten behoeve van de levering van elektriciteit of gas aan op grond van artikel 25, tweede lid,
      van de wet, aan een vergunninghouder toegewezen eindafnemers gedurende de periode tussen de in de aanhef bedoeld
      dag en het tijdstip van inwerkingtreding van het besluit tot verdeling van de Autoriteit Consument en Markt en
      ten hoogste de daaropvolgende twee maanden, indien de betreffende vergunninghouder daarom verzoekt en aantoont
      dat de bestaande kredietruimte onvoldoende is om de levering van elektriciteit of gas aan de aan hem toegedeelde
      eindafnemers gedurende deze periode te waarborgen.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.39
  - number: 3.39.4
    text: |-
      Een garantstelling als bedoeld in het tweede lid, onderdeel b, of het derde lid, onderdeel f, vindt plaats
      op basis van een overeenkomst tussen de transmissiesysteembeheerder voor elektriciteit of gas en de betrokken
      vergunninghouder dan wel de curator. De garantstellingsovereenkomst wordt aangegaan onder redelijke voorwaarden
      en bevat een derdenbeding als bedoeld in artikel 253, eerste lid, van Boek 6 van het Burgerlijk Wetboek dat de
      wederpartij van de inkoopovereenkomsten, bedoeld in artikel 2.19, bij aanvaarding van het beding het recht geeft
      om rechtstreekse betaling te vorderen van de transmissiesysteembeheerder voor elektriciteit of gas voor de bij hem,
      ten behoeve van de levering, bedoeld in het tweede lid, onderdeel b, of het derde lid, onderdeel f, indien deze
      onder de garantstelling moet uitkeren.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.39
  - number: '3.40'
    text: |-
      Bij ministeriële regeling worden regels gesteld over de informatie die een transmissie- of
      distributiesysteembeheerder een aangeslotene verstrekt met het oog op het voorkomen van buitenwerkingstelling
      van diens aansluiting of een daaraan toegekend additioneel allocatiepunt op grond van artikel 3.41 van de wet in
      geval van het faillissement of de intrekking van een vergunning, erkenning of toelating van een marktdeelnemer,
      balanceringsverantwoordelijke of meetverantwoordelijke partij die op de aansluiting of het additionele
      allocatiepunt actief is, en de termijn waarbinnen deze informatie wordt verstrekt, in geval van intrekking van een
      vergunning als bedoeld in artikel 2.19, eerste lid, van de wet.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.40
  - number: 3.41.1
    text: |-
      Een transmissiesysteembeheerder, transmissiesysteembeheerder voor elektriciteit op zee, of
      distributiesysteembeheerder toont zijn kredietwaardigheid aan door middel van een door een erkend
      kredietbeoordelingsbureau aan hem toegekende kredietwaardigheidsbeoordeling als «investeringswaardig».
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.41
  - number: 3.41.2
    text: |-
      Een systeembeheerder als bedoeld in het eerste lid maakt de toekenning van de kredietwaardigheidsbeoordeling bekend
      binnen een maand nadat deze is afgegeven en stuurt de Autoriteit Consument en Markt een kopie van het ontvangen
      kredietwaardigheidsbeoordelingsrapport.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.41
  - number: 3.41.3
    text: |-
      In afwijking van het eerste lid, kan een distributiesysteembeheerder met een bij ministeriële regeling te bepalen
      maximum omzet zijn kredietwaardigheid aantonen door te voldoen aan bij ministeriële regeling vast te stellen
      financiële ratio’s en tevens een kredietfaciliteit aan te houden die borgt dat er voor twaalf maanden voldoende
      krediet beschikbaar is om aan de lopende verplichtingen te kunnen voldoen. Indien de distributiesysteembeheerder
      gebruik maakt van deze kredietfaciliteit meldt hij dit onverwijld schriftelijk aan de Autoriteit Consument en
      Markt.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.41
  - number: 3.41.4
    text: |-
      Indien een systeembeheerder als bedoeld in het eerste of derde lid zijn kredietwaardigheid conform de eisen,
      bedoeld in het eerste of derde lid, niet kan aantonen:
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.41
  - number: 3.41.4.a
    text: meldt hij dit onverwijld schriftelijk aan de Autoriteit Consument en Markt,
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.41
  - number: 3.41.4.b
    text: |-
      stelt hij binnen vier weken na de melding een herstelplan op waarin wordt beschreven op welke wijze hij zijn
      financieel beheer zal verbeteren om zijn kredietwaardigheid te herstellen conform de eisen, bedoeld in het eerste
      respectievelijk derde lid, en zendt hij dit plan aan de Autoriteit Consument en Markt; en
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.41
  - number: 3.41.4.c
    text: keert hij geen dividend of andere kapitaaluitkeringen uit aan zijn aandeelhouders.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.41
  - number: 3.41.5
    text: |-
      De Autoriteit Consument en Markt kan een systeembeheerder als bedoeld in het eerste of derde lid aanwijzingen
      geven met betrekking tot de verbetering van het financieel beheer ten behoeve van het herstellen van zijn
      kredietwaardigheid conform de eisen, bedoeld in het eerste of derde lid.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.41
  - number: 3.41.6
    text: |-
      Een systeembeheerder als bedoeld in het eerste of derde lid voegt jaarlijks in of bij de publicatie van de
      afzonderlijke boekhouding, bedoeld in artikel 3.42, eerste lid:
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.41
  - number: 3.41.6.a
    text: |-
      een verklaring waaruit blijkt dat aan hem een kredietwaardigheidsbeoordeling als «investeringswaardig» als bedoeld
      in het eerste lid is toegekend of dat hij zijn kredietwaardigheid conform de eisen, bedoeld in het derde lid, kan
      aantonen;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.41
  - number: 3.41.6.b
    text: |-
      een toelichting met betrekking tot de in de komende vijf jaren voorziene ontwikkeling van de kredietwaardigheid met
      de bij ministeriële regeling nader bepaalde onderdelen.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.41
  - number: 3.42.1
    text: |-
      Een transmissie- of distributiesysteembeheerder, transmissiesysteembeheerder voor elektriciteit op zee,
      interconnectorsysteembeheerder, LNG-beheerder of gasopslagbeheerder voert voor zijn wettelijke taken en
      verplichtingen een afzonderlijke boekhouding en laat de bij ministeriële regeling aangeduide onderdelen van deze
      boekhouding door een onafhankelijk accountant controleren.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.42
  - number: 3.42.2
    text: |-
      Bij ministeriële regeling worden regels gesteld over de afzonderlijke boekhouding en controle daarvan, bedoeld
      in het eerste lid, de toelichting bij en de publicatie van deze afzonderlijke boekhouding en het verslag van de
      controle.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.42
  - number: 3.42.3
    text: |-
      Indien een systeembeheerder, bedoeld in het eerste lid, of de groep, bedoeld in artikel 24b van Boek 2 van
      het Burgerlijk Wetboek, waartoe deze behoort, op grond van titel 9 van Boek 2 van het Burgerlijk Wetboek zijn
      jaarrekening niet openbaar hoeft te maken, legt hij een exemplaar daarvan ter inzage op het hoofdkantoor met
      inachtneming van de termijnen, bedoeld in artikel 394 van Boek 2 van het Burgerlijk Wetboek.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.42
  - number: '3.43'
    text: |-
      Bij de vaststelling van de door de transmissie- of distributiesysteembeheerder voor elektriciteit toe te passen
      tarieven, bedoeld in artikel 3.107, eerste lid, van de wet, neemt de Autoriteit Consument en Markt, onverminderd
      het bepaalde bij of krachtens artikel 3.107 van de wet, het volgende in acht:
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.43
  - number: 3.43.a
    text: |-
      de tarieven die gelden voor een actieve afnemer houden op een transparante wijze apart rekening met invoeding op
      en afname van het transmissie- of distributiesysteem voor elektriciteit en dragen op een passende wijze bij aan het
      delen van de totale kosten van het transmissie- of distributiesysteem voor elektriciteit;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.43
  - number: 3.43.b
    text: |-
      aan een actieve afnemer die binnen zijn eigen installatie geproduceerde elektriciteit opslaat, worden geen
      dubbele tarieven gerekend voor de opgeslagen elektriciteit of voor de levering van congestie beheers- of
      systeembeheersdiensten aan een transmissie- of distributiesysteembeheerder voor elektriciteit;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.43
  - number: 3.43.c
    text: 'de tarieven die gelden voor een energiegemeenschap:'
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.43
  - number: 3.43.c.1.
    text: |-
      dragen op voldoende en evenwichtige wijze bij aan het delen van de totale kosten van het transmissie- of
      distributiesysteem voor elektriciteit;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.43
  - number: 3.43.c.2°
    text: |-
      gelden ongeacht of de energiegemeenschap, met inachtneming van artikel 2.17, tweede lid, onderdeel a, van de wet,
      elektriciteit levert aan zijn leden of aandeelhouders, en in overeenstemming met een door de Autoriteit Consument
      en Markt uitgevoerde transparante analyse van kosten en baten van gedistribueerde energiebronnen.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.43
  - number: '3.44'
    text: |-
      De transmissiesysteembeheerder voor elektriciteit op zee brengt het restant van de voor een jaar vastgestelde
      totale toegestane vergoeding dat niet wordt gedekt door subsidie, bedoeld in artikel 3.118, vierde lid, van de wet,
      in rekening bij de transmissiesysteembeheerder voor elektriciteit.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.44
  - number: '3.45'
    text: |-
      Een gasopslagbeheerder voert voorafgaand aan de bekendmaking, bedoeld in artikel. 3.100, vierde lid, van de wet,
      overleg met representatieve organisaties van systeemgebruikers over de tarieven en voorwaarden.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.45
  - number: '3.46'
    text: |-
      De bekendmaking van de indicatie van de tarieven en voorwaarden door de gasopslagbeheerder, bedoeld in artikel.
      3.100, vierde lid, van de wet, vindt jaarlijks voor 1 oktober plaats.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.46
  - number: 3.47.1
    text: |-
      Toegang tot een gasopslagsysteem is in ieder geval technisch of economisch noodzakelijk voor een efficiënte toegang
      als bedoeld in artikel 3.100, vijfde lid, van de wet, indien toegang tot dit gasopslagsysteem noodzakelijk is voor
      de voor leveringszekerheid benodigde flexibiliteit.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.47
  - number: 3.47.2
    text: |-
      De minister stelt in het belang van het bepalen van de voor de leveringszekerheid benodigde flexibiliteit, bedoeld
      in het eerste lid, jaarlijks voor het daaropvolgende opslagjaar, met inachtneming van het overzicht, bedoeld in
      artikel 3.66 van de wet, een nationaal vuldoel vast voor op het Nederlands grondgebied gelegen gasopslagsystemen.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.47
  - number: 3.47.3
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over de noodzakelijkheid voor de voor leveringszekerheid
      benodigde flexibiliteit, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.47
  - number: 3.48.1
    text: |-
      Indien een gasopslagsysteem voldoet aan de voorwaarden, bedoeld in artikel 3.103, eerste lid, van de wet, dan
      voldoet de gasopslagbeheerder tevens aan de volgende eisen:
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.48
  - number: 3.48.1.a
    text: |-
      de personen die verantwoordelijk zijn voor het beheer van het gasopslagsysteem nemen niet deel in
      bedrijfsstructuren van het geïntegreerde gasbedrijf die direct of indirect verantwoordelijk zijn voor het
      dagelijkse beheer van de productie en levering van aardgas;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.48
  - number: 3.48.1.b
    text: |-
      er moeten passende maatregelen worden genomen zodat personen die verantwoordelijk zijn voor het beheer van het
      gasopslagsysteem onafhankelijk kunnen functioneren;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.48
  - number: 3.48.1.c
    text: |-
      de gasopslagbeheerder heeft effectieve beslissingsbevoegdheid, onafhankelijk van het geïntegreerde gasbedrijf,
      wat de activa betreft die noodzakelijk zijn voor de exploitatie, het onderhoud en de ontwikkeling van de
      opslaginstallaties;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.48
  - number: 3.48.1.d
    text: |-
      de gasopslagbeheerder heeft een nalevingsprogramma met maatregelen die moeten worden genomen om discriminerend
      en concurrentieverstorend gedrag uit te sluiten. Het nalevingsprogramma bevat de specifieke verplichtingen van de
      werknemers ter verwezenlijking van die doelstellingen.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.48
  - number: 3.48.2
    text: |-
      Een gasopslagbeheerder, als bedoeld in het eerste lid, overlegt een verslag over de uitvoering van het
      nalevingsprogramma, bedoeld in het eerste lid, onderdeel d, jaarlijks aan de Autoriteit Consument en Markt en
      publiceert dit verslag jaarlijks op een geschikte wijze.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.48
  - number: 3.49.1
    text: |-
      Een aangeslotene als bedoeld in artikel 3.86, eerste lid, onderdeel a, van de wet heeft slechts recht op vergoeding
      van schade als bedoeld in artikel 3.87, eerste lid, van de wet, indien de funderingen van het windpark zijn
      aangelegd en, indien het windpark niet gebruiksklaar is, indien de aangeslotene aannemelijk kan maken dat het
      windpark gebruiksklaar zou zijn geweest als daar niet vanaf was gezien om de schade te beperken.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.49
  - number: 3.49.2
    text: |-
      Onder het voor de ontsluiting van het windpark noodzakelijk deel van het transmissiesysteem voor elektriciteit op
      zee, bedoeld in artikel 3.87, eerste lid, onderdeel a, van de wet, wordt verstaan:
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.49
  - number: 3.49.2.a
    text: de aansluiting van het windpark;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.49
  - number: 3.49.2.b
    text: |-
      het transmissiesysteem voor elektriciteit op zee tussen het windpark en het transformatorstation op land
      met de in het ontwikkelkader windenergie op zee, bedoeld in artikel 3.83 van de wet, vastgestelde minimale
      transportcapaciteit;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.49
  - number: 3.49.2.c
    text: |-
      het transmissiesysteem voor elektriciteit op zee tussen het windpark en een transportsysteem voor elektriciteit van
      een ander land met de in het ontwikkelkader windenergie op zee, bedoeld in artikel 3.83 van de wet, vastgestelde
      minimale transportcapaciteit.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.49
  - number: 3.49.3
    text: |-
      Onder gemiddeld voor het transmissiesysteem voor elektriciteit op zee redelijkerwijs noodzakelijk onderhoud als
      bedoeld in artikel 3.87, eerste lid, onderdeel b, van de wet wordt verstaan:
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.49
  - number: 3.49.3.a
    text: 'een onderhoudsperiode van:'
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.49
  - number: 3.49.3.a.1°
    text: vijf dagen per kalenderjaar voor wisselstroomverbindingen;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.49
  - number: 3.49.3.a.2°
    text: achttien dagen per kalenderjaar voor gelijkstroomverbindingen, of
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.49
  - number: 3.49.3.b
    text: |-
      een onderhoudsperiode van ten hoogste 38 dagen ter vervanging van componenten van het transmissiesysteem
      voor elektriciteit op zee die van belang zijn voor beveiliging en besturing van het transmissiesysteem voor
      elektriciteit op zee.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.49
  - number: 3.49.4
    text: Een onderhoudsperiode als bedoeld in het derde lid, hoeft niet aaneengesloten te zijn.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.49
  - number: 3.49.5
    text: |-
      Het derde lid, aanhef en onderdeel b, is niet van toepassing op een aangeslotene met een vergunning als bedoeld
      in artikel 12 van de Wet windenergie op zee die is verleend voor 14 april 2022 en indien er na 14 april 2022 geen
      besluit is genomen door Onze Minister tot verlenging van de looptijd van die vergunning.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.49
  - number: 3.50.1
    text: |-
      De transmissiesysteembeheerder voor elektriciteit op zee stelt een aangeslotene als bedoeld in artikel 3.86, eerste
      lid, onderdeel a, van de wet ten minste twee jaar van tevoren op de hoogte van de startdatum van werkzaamheden als
      bedoeld in 3.49, derde lid, onderdeel b, en geeft daarbij tevens aan wat de planning van die werkzaamheden is.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.50
  - number: 3.50.2
    text: |-
      De transmissiesysteembeheerder voor elektriciteit op zee zoekt voor het bepalen van de startdatum en planning van
      de werkzaamheden afstemming met de aangeslotene voordat hij de aangeslotene overeenkomstig het eerste lid op de
      hoogte stelt van de startdatum en planning van die werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.50
  - number: 3.51.1
    text: 'Voor het bepalen van de schade ten gevolge van gederfde of uitgestelde inkomsten worden ingeval van:'
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.51
  - number: 3.51.1.a
    text: |-
      gehele of gedeeltelijke te late oplevering van het transmissiesysteem voor elektriciteit op zee uitgestelde
      inkomsten uit elektriciteitsverkopen en subsidie in aanmerking genomen;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.51
  - number: 3.51.1.b
    text: |-
      gehele of gedeeltelijke niet-beschikbaarheid van het transmissiesysteem voor elektriciteit op zee gederfde
      inkomsten uit elektriciteitsverkopen en uitgestelde inkomsten uit subsidie in aanmerking genomen.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.51
  - number: 3.51.2
    text: |-
      Gevolgschade is het totaal van de financiële gevolgen die een causaal verband hebben met de gebeurtenis die een
      recht op vergoeding van schade doet ontstaan, waaronder in ieder geval zijn begrepen de kosten die de aangeslotene
      maakt ter beperking van de schade en extra kosten voor materieel, personeel, opslag en zaakschade aan het windpark.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.51
  - number: 3.51.3
    text: |-
      De schade, bedoeld in het eerste en tweede lid, wordt vermeerderd met de wettelijke rente die verschuldigd is
      voor de tijd die verstrijkt tussen het moment waarop de schade is ontstaan en het moment waarop de schade wordt
      uitgekeerd.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.51
  - number: 3.52.1
    text: |-
      Bij gehele of gedeeltelijke te late oplevering van het transmissiesysteem voor elektriciteit op zee betreft de
      vergoeding van schade een vergoeding van schade door uitgestelde inkomsten en de gevolgschade, bedoeld in artikel
      3.51, tweede lid.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.52
  - number: 3.52.2
    text: |-
      Bij gehele of gedeeltelijke niet-beschikbaarheid van het transmissiesysteem voor elektriciteit op zee wordt de
      hoogte van de vergoeding van schade berekend door de som van:
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.52
  - number: 3.52.2.a
    text: |-
      het subsidiebedrag bestaande uit het verschil tussen het tenderbedrag per kilowattuur waarvoor subsidie is
      verstrekt op grond van het Besluit stimulering duurzame energieproductie of het Besluit stimulering duurzame
      energieproductie en klimaattransitie en de voor dat jaar geldende elektriciteitsprijs als bedoeld in artikel
      22 van het Besluit stimulering duurzame energieproductie en klimaattransitie of, indien de elektriciteitsprijs
      lager is dan de in artikel 20 van het Besluit stimulering duurzame energieproductie en klimaattransitie bedoelde
      basiselektriciteitsprijs, de in dat artikel bedoelde basiselektriciteitsprijs, verminderd met het quotiënt tussen
      hetzelfde subsidiebedrag en (1+i)5, waarbij i staat voor de discontovoet, en
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.52
  - number: 3.52.2.b
    text: |-
      het voor dat jaar geldende op grond van artikel 14, eerste lid, onderdeel a, van het Besluit stimulering duurzame
      energieproductie en klimaattransitie vastgestelde correctiebedrag voor windenergie op zee te vermenigvuldigen met
      de hoeveelheid elektriciteit die in een kalenderjaar wegens niet-beschikbaarheid niet via het transmissiesysteem
      voor elektriciteit op zee kon worden getransporteerd, verminderd met de hoeveelheid elektriciteit die in het in
      artikel 3.49, derde lid, genoemde aantal dagen geproduceerd kan worden, berekend op basis van het productieprofiel
      van het windpark. De uitkomst van deze berekening wordt vermeerderd met de gevolgschade.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.52
  - number: 3.52.3
    text: 'De schade door uitgestelde inkomsten wordt berekend door de som van:'
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.52
  - number: 3.52.3.a
    text: |-
      het subsidiebedrag bestaande uit het verschil tussen het tenderbedrag per kilowattuur waarvoor subsidie is
      verstrekt op grond van het Besluit stimulering duurzame energieproductie of het Besluit stimulering duurzame
      energieproductie en klimaattransitie en de voor dat jaar geldende elektriciteitsprijs als bedoeld in artikel
      22 van het Besluit stimulering duurzame energieproductie en klimaattransitie of, indien de elektriciteitsprijs
      lager is dan de in artikel 20 van het Besluit stimulering duurzame energieproductie en klimaattransitie bedoelde
      basiselektriciteitsprijs, de in dat artikel bedoelde basiselektriciteitsprijs, verminderd met het quotiënt tussen
      hetzelfde subsidiebedrag en (1+i)16, waarbij i staat voor de discontovoet, en
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.52
  - number: 3.52.3.b
    text: |-
      het voor dat jaar geldende op grond van artikel 14, eerste lid, onderdeel a, van het Besluit stimulering duurzame
      energieproductie en klimaattransitie vastgestelde correctiebedrag voor windenergie op zee verminderd met hetzelfde
      correctiebedrag gedeeld door (1+i)v-5 te vermenigvuldigen met de hoeveelheid elektriciteit die niet via het
      transmissiesysteem voor elektriciteit op zee getransporteerd kon worden, berekend op basis van het productieprofiel
      van het windpark, waarbij i staat voor de discontovoet en v voor de periode waarvoor de vergunning van het windpark
      is afgegeven.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.52
  - number: 3.52.4
    text: |-
      De hoeveelheid elektriciteit die niet via het transmissiesysteem voor elektriciteit op zee getransporteerd kon
      worden, wordt bepaald op basis de gemiste elektriciteitsproductie. De gemiste elektriciteitsproductie wordt
      berekend door de windsnelheid te vermenigvuldigen met het productieprofiel van een windpark vermenigvuldigd met
      de tijd waarin het transmissiesysteem voor elektriciteit op zee niet of verminderd beschikbaar was of, indien voor
      deze wijze van berekenen onvoldoende gegevens zijn, op een andere wijze. De gemiste elektriciteitsproductie wordt
      verminderd met de hoeveelheid elektriciteit die niet kon worden geproduceerd als gevolg van productiebeperkingen
      van het windpark zelf en, in voorkomend geval, de hoeveelheid elektriciteit die wel getransporteerd kon worden.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.52
  - number: 3.52.5
    text: |-
      Wanneer de transmissiesysteembeheerder voor elektriciteit op zee dit noodzakelijk acht, voegt de aangeslotene
      bij de berekening van de hoogte van het recht op vergoeding van schade en de gegevens waarop deze berekening is
      gebaseerd een goedkeurende verklaring van een onafhankelijk accountant bij.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.52
  - number: 3.52.6
    text: |-
      Indien in enig jaar de voor de aangeslotene geldende maximaal te vergoeden elektriciteitsprijs lager is dan het
      voor dat jaar geldende op grond van artikel 14, eerste lid, onderdeel a, van het Besluit stimulering duurzame
      energieproductie en klimaattransitie vastgestelde correctiebedrag voor windenergie op zee, wordt bij de toepassing
      van het tweede en derde lid de maximaal te vergoeden elektriciteitsprijs gehanteerd.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.52
  - number: 3.52.7
    text: |-
      De maximaal te vergoeden elektriciteitsprijs is het gemiddelde van voor de voor vijf jaren voorafgaand aan het jaar
      waarin een recht op schadevergoeding ontstaat op grond van artikel 14, eerste lid, onderdeel a, van het Besluit
      stimulering duurzame energieproductie en klimaattransitie vastgestelde correctiebedragen voor windenergie op zee
      met een toeslag van 50 procent.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.52
  - number: 3.52.8
    text: |-
      Indien in enig jaar het voor dat jaar geldende op grond van artikel 14, eerste lid, onderdeel a, van het Besluit
      stimulering duurzame energieproductie en klimaattransitie vastgestelde correctiebedrag voor windenergie op
      zee lager is dan de in artikel 20 van het Besluit stimulering duurzame energieproductie en klimaattransitie
      bedoelde basiselektriciteitsprijs, wordt bij de toepassing van het tweede en derde lid de in dat artikel bedoelde
      basiselektriciteitsprijs gehanteerd.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.52
  - number: 3.52.9
    text: |-
      Bij ministeriële regeling worden regels gesteld over het bepalen van het productieprofiel van het windpark en de
      gemiste elektriciteitsproductie;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.52
  - number: 3.52.10
    text: Onze Minister stelt jaarlijks de discontovoet i, bedoeld in het tweede en derde lid, vast.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel3.52
  - number: 4.1.1
    text: |-
      Een meetverantwoordelijke partij voldoet aan de eisen, bedoeld in artikel 2.50, tweede lid, van de wet, indien de
      meetverantwoordelijke partij:
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel4.1
  - number: 4.1.1.a
    text: |-
      beschikt over gekwalificeerd personeel en de middelen die nodig zijn om de verplichtingen die zijn voorgeschreven
      bij of krachtens artikel 2.48, afdeling 4.1 en de artikelen 4.7 en 4.11 van de wet na te komen;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel4.1
  - number: 4.1.1.b
    text: |-
      beschikt over een kwaliteitsborgingssysteem voor het uitvoeren van de verplichtingen die zijn voorgeschreven bij
      of krachtens artikel 2.48, afdeling 4.1 en de artikelen 4.7 en 4.11 van de wet, dat is gecertificeerd door een
      organisatie die daartoe is geaccrediteerd door de Nederlandse Raad voor de Accreditatie of een gelijkwaardige
      andere accreditatieinstelling;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel4.1
  - number: 4.1.1.c
    text: |-
      beschikt over een goede administratieve organisatie, met inbegrip van de financiële administratie, en over een
      goede interne of externe controle hierop;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel4.1
  - number: 4.1.1.d
    text: niet in staat van faillissement verkeert;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel4.1
  - number: 4.1.1.e
    text: geen surseance van betaling is verleend;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel4.1
  - number: 4.1.1.f
    text: |-
      beschikt over een inschatting van de kosten voor de minimale inzet om twintig weken aan de verplichtingen die
      zijn voorgeschreven bij of krachtens afdeling 4.1 en de artikelen 4.7 en 4.11 van de wet in het geval van een
      faillissement of surseance van betaling te kunnen blijven voldoen.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel4.1
  - number: 4.1.2
    text: |-
      Een meetverantwoordelijke partij geeft de Autoriteit Consument en Markt binnen twee weken wijzigingen door van
      omstandigheden relevant voor de eisen, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel4.1
  - number: 4.1.3
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld over de eisen, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel4.1
  - number: 4.2.1
    text: |-
      Indien de Autoriteit Consument en Markt voornemens is de erkenning als meetverantwoordelijke partij in te trekken
      wegens een andere redenen dan dat de meetverantwoordelijke partij in faillissement of surseance van betaling is
      verleend, geeft deze de meetverantwoordelijke partij een redelijke termijn om de geconstateerde tekortkomingen te
      herstellen, tenzij herstel, gelet op de aard van de tekortkoming, naar het oordeel van de Autoriteit Consument en
      Markt niet meer mogelijk is.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel4.2
  - number: 4.2.2
    text: |-
      Een beschikking tot intrekking van een erkenning als meetverantwoordelijke partij treedt ten hoogste achttien
      weken na de dag waarop die beschikking is gegeven, in werking. Indien de erkenning wordt ingetrokken vanwege een
      faillissement of surseance van betaling, bedraagt deze termijn twintig weken.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel4.2
  - number: 4.2.3
    text: |-
      Indien de Autoriteit Consument en Markt een beschikking neemt tot intrekking van een erkenning, informeert de
      Autoriteit Consument en Markt onverwijld de transmissie- of distributiesysteembeheerder over dit besluit.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel4.2
  - number: 4.2.4
    text: |-
      De transmissie- of distributiesysteembeheerder geeft na ontvangst van de beschikking tot intrekking van een
      erkenning daarvan onverwijld bericht aan de op het allocatiepunt actieve marktdeelnemers. Ook meldt de transmissie-
      of distributiesysteembeheerder aan de betreffende aangeslotene, bedoeld in artikel 2.47, tweede lid, van de wet of
      aan diens gemachtigde bij aangetekende brief dat:
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel4.2
  - number: 4.2.4.a
    text: de erkenning van de door of namens hem gecontracteerde meetverantwoordelijke partij wordt ingetrokken;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel4.2
  - number: 4.2.4.b
    text: |-
      de aangeslotene de plicht heeft ervoor te zorgen dat een meetverantwoordelijke partij actief is op zijn aansluiting
      als bedoeld in artikel 2.47, tweede lid, van de wet;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel4.2
  - number: 4.2.4.c
    text: |-
      de aangeslotene de gelegenheid heeft om binnen de in artikel 4.3 genoemde termijnen een nieuwe
      meetverantwoordelijke partij te contracteren;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel4.2
  - number: 4.2.4.d
    text: |-
      de aangeslotene er zorg voor draagt dat de meetinrichting en de eventueel daarbij behorende communicatiemiddelen
      niet worden verwijderd of gewijzigd, of niet meer functioneren of kunnen functioneren, zolang nog geen nieuwe
      meetverantwoordelijke partij actief is op de aansluiting.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel4.2
  - number: 4.3.1
    text: |-
      Een aangeslotene als bedoeld in artikel 2.47, tweede lid, van de wet, contracteert na ontvangst van de brief
      bedoeld in artikel 4.2, vierde lid, een nieuwe meetverantwoordelijke partij:
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel4.3
  - number: 4.3.1.a
    text: |-
      binnen twee weken na ontvangst van de brief, indien de aangeslotene de beschikking heeft over een gecontracteerd
      transportvermogen dat groter is dan 1 MW;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel4.3
  - number: 4.3.1.b
    text: binnen twee weken na ontvangst van de brief, indien de aangeslotene 170.000 m3 gas of meer per jaar verbruikt;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel4.3
  - number: 4.3.1.c
    text: |-
      binnen zes weken na ontvangst van de brief, indien de aangeslotene de beschikking heeft over een gecontracteerd
      transportvermogen dat kleiner dan of gelijk is aan 1 MW;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel4.3
  - number: 4.3.1.d
    text: binnen zes weken na ontvangst van de brief, indien de aangeslotene minder dan 170.000 m3 gas per jaar verbruikt.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel4.3
  - number: 4.3.2
    text: |-
      De overeenkomst met de nieuwe meetverantwoordelijke partij, bedoeld in het eerste lid, treedt in werking uiterlijk
      achttien weken nadat de beschikking tot intrekking van de erkenning, bedoeld in artikel 4.2, tweede lid, is
      gegeven.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel4.3
  - number: 4.3.3
    text: |-
      Indien de erkenning wordt ingetrokken vanwege een faillissement of surseance van betaling, worden twee weken
      toegevoegd aan de termijn, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel4.3
  - number: 4.4.1
    text: |-
      Nadat de beschikking tot intrekking van de erkenning, bedoeld in artikel 4.2, eerste lid, is gegeven blijft de
      meetverantwoordelijke partij verantwoordelijk voor de verplichtingen die zijn voorgeschreven bij of krachtens
      artikel 2.48, afdeling 4.1 en de artikelen 4.7 en 4.11 van de wet tot er een nieuwe meetverantwoordelijke partij op
      de aansluiting actief is.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel4.4
  - number: 4.4.2
    text: |-
      De meetverantwoordelijke partij verzamelt, valideert en stelt de laatst beschikbare meetgegevens zo spoedig
      mogelijk, uiterlijk binnen een maand na inwerkingtreding van het contract van de nieuwe meetverantwoordelijke
      partij met de aangeslotene, vast. De meetverantwoordelijke partij overhandigt op dat moment aan de aangeslotene
      de meetgegevens over de afname en de invoeding per dag van de voorgaande vierentwintig maanden en de cumulatieve
      gegevens van de drie voorafgaande jaren, of de periode sinds de aanvang van het meetcontract indien dit korter is.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel4.4
  - number: 4.4.3
    text: |-
      Het eerste en tweede lid zijn niet van toepassing indien een meetverantwoordelijke partij in faillissement verkeert
      of aan hem surseance van betaling is verleend.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel4.4
  - number: 4.5.1
    text: |-
      Dit artikel is van toepassing indien een meetverantwoordelijke partij in faillissement verkeert of aan hem
      surseance van betaling is verleend.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel4.5
  - number: 4.5.2
    text: |-
      De bij de meetverantwoordelijke partij betrokken transmissiesysteembeheerder voor een elektriciteitsaansluiting
      of distributiesysteembeheerder voor een gasaansluiting draagt voor een grote aansluiting zorg voor een regeling
      met de betrokken curator of bewindvoerder, om te waarborgen dat de verplichtingen die zijn voorgeschreven bij of
      krachtens artikel 2.48, afdeling 4.1 en de artikelen 4.7 en 4.11 van de wet worden nageleefd tot er een nieuwe
      meetverantwoordelijke partij op de aansluiting actief is.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel4.5
  - number: 4.5.3
    text: |-
      Indien er vanwege overmacht of vanwege een storing van de communicatiefunctionaliteit in de verzending of ontvangst
      van de meetgegevens geen actuele meetgegevens beschikbaar zijn stelt de transmissiesysteembeheerder, zolang geen
      nieuwe meetverantwoordelijke partij actief is op de aansluiting, de meetgegevens vast op basis van:
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel4.5
  - number: 4.5.3.a
    text: het jaarverbruik van de voorafgaande periode van twaalf maanden; of
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel4.5
  - number: 4.5.3.b
    text: |-
      indien het niet mogelijk is het jaarverbruik vast te stellen, een profiel dat is gebaseerd op historische
      meetgegevens, voor zover beschikbaar.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel4.5
  - number: 4.5.4
    text: |-
      In de periode voordat een nieuwe meetverantwoordelijke partij de meetfunctie heeft overgenomen als bedoeld in
      artikel 4.3, tweede lid, staat de transmissiesysteembeheerder op verzoek van de betrokken curator of bewindvoerder
      garant voor de kosten:
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel4.5
  - number: 4.5.4.a
    text: |-
      zoals bepaald bij de meeste recente inschatting van de kosten overeenkomstig artikel 4.1, eerste lid, onderdeel f,
      of in de rapportage bedoeld in artikel 2.52 van de wet, die nodig zijn om gebruik te kunnen blijven maken van de
      actuele meetgegevens, bedoeld in het eerste lid, in die periode; en
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel4.5
  - number: 4.5.4.b
    text: |-
      voor het blijven functioneren van de meetinrichting en eventuele daarbij behorende communicatiemiddelen tot het
      moment dat een nieuwe meetverantwoordelijke partij de meetfunctie overneemt.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel4.5
  - number: 4.5.5
    text: |-
      De transmissiesysteembeheerder wijst het verzoek voor garantstelling toe, indien de curator of bewindvoerder
      aantoont dat de bestaande financiële ruimte onvoldoende is voor het verzamelen en aanleveren van gegevens
      overeenkomstig het eerste lid.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel4.5
  - number: 4.5.6
    text: |-
      Indien de daadwerkelijke kosten hoger zijn dan bepaald overeenkomstig het vierde lid, onderdeel a, kan de
      transmissiesysteembeheerder een kostenbepaling ter goedkeuring voorleggen aan de Autoriteit Consument en Markt.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel4.5
  - number: 4.5.7
    text: |-
      De meetverantwoordelijke partij verzamelt, valideert en stelt de laatst beschikbare meetgegevens zo
      spoedig mogelijk vast, doch uiterlijk binnen een maand na inwerkingtreding van het contract van de nieuwe
      meetverantwoordelijke partij met de aangeslotene. De meetverantwoordelijke partij overhandigt op dat moment aan de
      aangeslotene de meetgegevens over de afname en de invoeding per dag van de voorgaande vierentwintig maanden en de
      cumulatieve gegevens van de drie voorafgaande jaren, of de periode sinds de aanvang van het meetcontract indien dit
      korter is.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel4.5
  - number: 4.6.1
    text: |-
      Een aanvraag voor het verkrijgen van de goedkeuring van de Autoriteit Consument en Markt voor de overdracht van een
      erkenning op grond van artikel 2.53 van de wet, wordt ingediend door de meetverantwoordelijke partij die voornemens
      is de erkenning over te dragen en de partij die die meeterkenning voornemens is te ontvangen gezamenlijk.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel4.6
  - number: 4.6.2
    text: |-
      De eisen in artikel 4.1 zijn van toepassing op de aanvraag en beoordeling van de Autoriteit Consument en Markt,
      tenzij de erkenning wordt overgedragen aan een meetverantwoordelijke partij met een erkenning als bedoeld in
      artikel 2.50 van de wet.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel4.6
  - number: 4.6.3
    text: 'De aanvraag gaat vergezeld van:'
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel4.6
  - number: 4.6.3.a
    text: de reden van de overdracht van de erkenning;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel4.6
  - number: 4.6.3.b
    text: |-
      de wijze waarop de betrokken aangeslotenen, leveranciers en systeembeheerders worden geïnformeerd over de
      overdracht; en
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel4.6
  - number: 4.6.3.c
    text: |-
      een rapport over de risico’s voor de continuïteit van de verplichtingen, bedoeld in artikel 2.50, tweede lid,
      onderdeel b, van de wet, die verbonden zijn aan de overdracht en, indien nodig, de daarbij behorende mitigerende
      maatregelen.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel4.6
  - number: 4.6.4
    text: |-
      Indien beoogd wordt de erkenning over te dragen aan een reeds erkende meetverantwoordelijke partij, gaat de
      aanvraag, bedoeld in het tweede lid, vergezeld van een rapport over de risico’s voor de continuïteit van de
      verplichtingen, bedoeld in artikel 2.50, tweede lid, onderdeel b, van de wet, die verbonden zijn aan de overdracht
      en, indien nodig, de daarbij behorende mitigerende maatregelen.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel4.6
  - number: '4.7'
    text: |-
      Een actieve afnemer die op zijn aansluiting of op een specifiek deel van zijn installatie een
      vraagresponsovereenkomst sluit met een marktdeelnemer die niet tevens zijn leverancier is, beschikt op of nabij het
      overdrachtspunt van zijn aansluiting over een meetinrichting waarvan de communicatiefunctionaliteit administratief
      is ingeschakeld.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel4.7
  - number: '4.8'
    text: |-
      Indien een aangeslotene elektriciteit teruglevert aan een marktdeelnemer die niet zijn leverancier is, sluit
      een marktdeelnemer met deze aangeslotene geen vraagresponsovereenkomst, tenzij de teruglevering geschiedt
      op een technisch gescheiden allocatiepunt, dat niet elektrisch is gekoppeld met de installatie waarop de
      vraagresponsdienst wordt geleverd.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel4.8
  - number: 4.9.1
    text: |-
      Indien een aangeslotene op een transmissie-, distributie- of gesloten systeem voor elektriciteit gebruik
      maakt van een submeetinrichting op een deel van zijn installatie ten behoeve van de uitvoering van een
      vraagresponsovereenkomst, voldoet deze submeetinrichting aan de krachtens artikel 2.46, derde lid, van de wet
      gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel4.9
  - number: 4.9.2
    text: |-
      De submeetinrichting wordt geïnstalleerd en beheerd door een meetverantwoordelijke partij of
      submeetverantwoordelijke partij.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel4.9
  - number: 4.9.3
    text: |-
      De partij die de submeetinrichting installeert en beheert, is tevens verantwoordelijk voor de verzameling,
      validatie en vaststelling van de meetgegevens voor de betreffende submeetinrichting.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel4.9
  - number: 4.10.1
    text: |-
      Een aangeslotene met een grote aansluiting op een transmissie-, distributie- of gesloten systeem voor elektriciteit
      die meer dan één marktdeelnemer contracteert, beschikt op een toegekend additioneel allocatiepunt als bedoeld in
      artikel 3.44, derde lid, van de wet, over een meetinrichting die voldoet aan de krachtens artikel 2.46, derde lid,
      van de wet gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel4.10
  - number: 4.10.2
    text: De aangeslotene draagt er zorg voor dat de communicatiefunctionaliteit van de meetinrichting wordt gebruikt.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel4.10
  - number: 4.11.1
    text: |-
      Indien een aangeslotene op een transmissie- of distributiesysteem voor elektriciteit met een installatie
      als bedoeld in artikel 3.63, onderdeel a, van de wet elektriciteit uit hernieuwbare bronnen produceert en
      de geproduceerde elektriciteit wordt gemeten met een meetinrichting op een andere plaats dan op of nabij het
      overdrachtspunt, voldoet die meetinrichting aan de krachtens artikel 2.46, derde lid, van de wet gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel4.11
  - number: 4.11.2
    text: |-
      Een distributiesysteembeheerder installeert en beheert een meetinrichting als bedoeld in het eerste lid van een
      aangeslotene met een kleine aansluiting en verzamelt en valideert de meetgegevens ten aanzien van de productie van
      elektriciteit uit hernieuwbare bronnen en stelt deze vast.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel4.11
  - number: 4.12.1
    text: |-
      Een aangeslotene met een kleine aansluiting op een distributiesysteem of gesloten systeem voor elektriciteit
      beschikt op elk toegekend additioneel allocatiepunt als bedoeld in artikel 3.44, derde lid, van de wet over een
      meetinrichting die voldoet aan de krachtens artikel 2.46, derde lid, van de wet gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel4.12
  - number: 4.12.2
    text: |-
      De aangeslotene draagt er zorg voor dat de communicatiefunctionaliteit van de meetinrichting administratief is
      ingeschakeld.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel4.12
  - number: 4.12.3
    text: |-
      De systeembeheerder die de meetinrichting op het primaire allocatiepunt heeft geïnstalleerd en beheert, installeert
      en beheert de meetinrichting op een additioneel allocatiepunt.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel4.12
  - number: 4.13.1
    text: |-
      Een distributiesysteembeheerder stelt de invoeding, de onttrekking of het verbruik van elektriciteit of gas vast
      bij een onbemeten aansluiting als bedoeld in artikel 2.46, eerste lid, onderdeel a, van de wet.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel4.13
  - number: 4.13.2
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld over de wijze waarop de distributiesysteembeheerder
      die gegevens vaststelt.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel4.13
  - number: 4.14.1
    text: |-
      Het is voor een submeetverantwoordelijke partij verboden zonder erkenning als bedoeld in het vierde lid te handelen
      overeenkomstig artikel 4.9 ten behoeve van de afhandeling van de vraagresponsovereenkomst, bedoeld in artikel 4.9,
      eerste lid.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel4.14
  - number: 4.14.2
    text: |-
      Op een submeetverantwoordelijke partij zijn de artikelen 2.48, tweede lid, aanhef en onderdelen a tot en met e
      en g, 2.49, 2.52 en 4.2 tot en met 4.4 van de wet van overeenkomstige toepassing, met dien verstande dat de in
      de aanhef van artikel 2.48, tweede lid, van de wet bedoelde regels kunnen worden gesteld en dat in artikel 2.49,
      eerste lid, voor «meetverantwoordelijke partij» wordt gelezen «submeetverantwoordelijke partij».
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel4.14
  - number: 4.14.3
    text: 'Een submeetverantwoordelijke partij:'
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel4.14
  - number: 4.14.3.a
    text: |-
      beschikt over de benodigde organisatorische en technische kwaliteiten alsmede over voldoende deskundigheid voor een
      goede uitvoering van zijn verplichtingen; en
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel4.14
  - number: 4.14.3.b
    text: |-
      is redelijkerwijs in staat de verplichtingen gesteld bij of krachtens de artikelen, bedoeld in het tweede lid,
      artikel 4.9, tweede en derde lid, en artikel 4.8, zevende tot en met negende lid, van de wet na te komen.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel4.14
  - number: 4.14.4
    text: |-
      De Autoriteit Consument en Markt verleent een submeetverantwoordelijke partij voor de installatie, het beheer en
      het meten op aanvraag een erkenning als de submeetverantwoordelijke partij voldoet aan de eisen, bedoeld in het
      derde lid.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel4.14
  - number: 4.14.5
    text: De Autoriteit Consument en Markt kan voorschriften en beperkingen verbinden aan een erkenning.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel4.14
  - number: 4.14.6
    text: 'Bij ministeriële regeling kunnen regels worden gesteld over:'
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel4.14
  - number: 4.14.6.a
    text: de voorwaarden waaraan een aanvraag moet voldoen;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel4.14
  - number: 4.14.6.b
    text: de procedure voor de aanvraag van een erkenning;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel4.14
  - number: 4.14.6.c
    text: |-
      de informatie die een submeetverantwoordelijke partij na het verlenen van de erkenning al dan niet periodiek moet
      verstrekken.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel4.14
  - number: 4.15.1
    text: |-
      Een submeetverantwoordelijke partij voldoet aan de eisen, bedoeld in artikel 4.14, derde lid, indien de
      submeetverantwoordelijke partij:
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel4.15
  - number: 4.15.1.a
    text: |-
      beschikt over gekwalificeerd personeel en de middelen die nodig zijn om de verplichtingen die zijn voorgeschreven
      bij of krachtens artikel 2.48, afdeling 4.1 en de artikelen 4.7 en 4.11 van de wet na te komen;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel4.15
  - number: 4.15.1.b
    text: |-
      beschikt over een kwaliteitsborgingssysteem voor het uitvoeren van de verplichtingen die zijn voorgeschreven bij
      of krachtens artikel 2.48, afdeling 4.1 en de artikelen 4.7 en 4.11 van de wet, dat is gecertificeerd door een
      organisatie die daartoe is geaccrediteerd door de Nederlandse Raad voor de Accreditatie of een gelijkwaardige
      andere accreditatieinstelling;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel4.15
  - number: 4.15.1.c
    text: |-
      beschikt over een goede administratieve organisatie, met inbegrip van de financiële administratie, en over een
      goede interne of externe controle hierop;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel4.15
  - number: 4.15.1.d
    text: niet in staat van faillissement verkeert;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel4.15
  - number: 4.15.1.e
    text: geen surseance van betaling is verleend;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel4.15
  - number: 4.15.1.f
    text: |-
      beschikt over een inschatting van de kosten voor de minimale inzet om 20 weken aan de verplichtingen die
      zijn voorgeschreven bij of krachtens afdeling 4.1 en de artikelen 4.7 en 4.11 van de wet in het geval van een
      faillissement of surseance van betaling te kunnen blijven voldoen.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel4.15
  - number: 4.15.2
    text: |-
      Een submeetverantwoordelijke partij geeft de Autoriteit Consument en Markt binnen twee weken alle wijzigingen door
      van de gegevens, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel4.15
  - number: 4.15.3
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld over de vereisten, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel4.15
  - number: 4.16.1
    text: |-
      Artikel 2.51, eerst lid, van de wet is van overeenkomstige toepassing op een erkenning als submeetverantwoordelijke
      partij.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel4.16
  - number: 4.16.2
    text: |-
      Indien de Autoriteit Consument en Markt voornemens is de erkenning als submeetverantwoordelijke partij in te
      trekken wegens een andere redenen dan dat de submeetverantwoordelijke partij in faillissement of als surseance
      van betaling is verleend, geeft deze de submeetverantwoordelijke partij een redelijke termijn om de geconstateerde
      tekortkomingen te herstellen, tenzij herstel, gelet op de aard van de tekortkoming, naar het oordeel van de
      Autoriteit Consument en Markt niet meer mogelijk is.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel4.16
  - number: 4.16.3
    text: |-
      Een beschikking tot intrekking van een erkenning als submeetverantwoordelijke partij treedt achttien weken na de
      dag, waarop die beschikking is gegeven, in werking. Indien de erkenning wordt ingetrokken vanwege een faillissement
      of surseance van betaling, worden twee weken toegevoegd aan de termijn.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel4.16
  - number: 4.16.4
    text: |-
      Indien de Autoriteit Consument en Markt een beschikking neemt tot intrekking van een erkenning, informeert de
      Autoriteit Consument en Markt de transmissie- of distributiesysteembeheerder, of beheerder van een gesloten
      systeem, over dit besluit.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel4.16
  - number: 4.16.5
    text: |-
      De submeetverantwoordelijke partij geeft na vaststelling van de beschikking tot intrekking van een erkenning
      daarvan onverwijld bericht aan de aangeslotene en informeert de aangeslotene over de gevolgen daarvan voor de
      aangeslotene.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel4.16
  - number: 4.17.1
    text: |-
      Een erkenning als submeetverantwoordelijke partij kan slechts worden overgedragen na goedkeuring van de Autoriteit
      Consument en Markt.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel4.17
  - number: 4.17.2
    text: |-
      Artikel 4.6 is van overeenkomstige toepassing op het overdragen van een erkenning als submeetverantwoordelijke
      partij, met dien verstande dat voor «meetverantwoordelijke partij» wordt gelezen «submeetverantwoordelijke partij».
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel4.17
  - number: 4.18.1
    text: |-
      Een melding van een inbreuk op de beveiliging van gegevens als bedoeld in de artikelen 4.4, eerste lid, of 4.22,
      eerste lid, van de wet wordt gedaan op een door Onze Minister aangegeven wijze.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel4.18
  - number: 4.18.2
    text: |-
      Onze Minister kan, na raadpleging van de betrokken partij, het publiek informeren over een gemeld incident als
      bedoeld in de artikelen 4.4, eerste lid, of 4.22, eerste lid, van de wet, of vorderen dat de betrokken partij dit
      doet, indien publieke bewustwording nodig is om een incident te voorkomen of een lopend incident te beheersen.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel4.18
  - number: 4.19.1
    text: |-
      De gegevensuitwisselingsentiteit stelt de identiteit van de partijen, bedoeld in artikel 4.20, eerste lid, van de
      wet vast aan de hand van:
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel4.19
  - number: 4.19.1.a
    text: |-
      een publiek identificatiemiddel als bedoeld in artikel 5, eerste lid, onderdeel a, van de Wet digitale overheid, op
      betrouwbaarheidsniveau substantieel als bedoeld in artikel 8, tweede lid, onderdeel b, van de eIDAS-verordening; of
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel4.19
  - number: 4.19.1.b
    text: |-
      een elektronisch identificatiemiddel dat is uitgegeven op grond van een stelsel voor elektronische
      identificatiemiddelen met betrouwbaarheidsniveau substantieel als bedoeld in artikel 8, tweede lid, onderdeel b,
      van de eIDAS-verordening, en dat ten behoeve van de grensoverschrijdende authenticatie is erkend overeenkomstig
      artikel 6, eerste lid, van de eIDAS-verordening.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel4.19
  - number: 4.19.2
    text: |-
      Voor gevallen waarin toepassing van de identificatiemiddelen, bedoeld in het eerste lid, niet mogelijk is, kan bij
      ministeriële regeling een andere wijze van identificatie worden toegestaan.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel4.19
  - number: 5.1.1
    text: 'De Autoriteit Consument en Markt werkt in grensoverschrijdende kwesties samen met:'
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel5.1
  - number: 5.1.1.a
    text: |-
      instellingen in andere lidstaten van de Europese Unie die op grond van nationale wettelijke regels zijn aangewezen
      als nationale regulerende instantie of toezichthouder;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel5.1
  - number: 5.1.1.b
    text: Acer;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel5.1
  - number: 5.1.1.c
    text: andere instanties van betrokken lidstaten.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel5.1
  - number: 5.1.2
    text: |-
      De Autoriteit Consument en Markt werkt, onder meer teneinde de nationale markten op één of meer geografische
      gebieden als bedoeld in artikel 12, derde lid, van [verordening 715/2009](32009R0715) te integreren en samenwerking
      tussen een transmissiesysteembeheerder en een buitenlandse transmissiesysteembeheerder in deze gebieden aan te
      moedigen, samen met instellingen in andere lidstaten van de Europese Unie die op grond van nationale wettelijke
      regels zijn belast met de toepassing van de regels op het gebied van gas.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel5.1
  - number: '5.2'
    text: 'De Autoriteit Consument en Markt:'
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel5.2
  - number: 5.2.a
    text: |-
      volgt in welke mate de elektriciteitsmarkt aan de doelstellingen, bedoeld in artikel 58 van [richtlijn 2019/944]
      (32019L0944), voldoet;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel5.2
  - number: 5.2.b
    text: |-
      volgt in welke mate de gasmarkt aan de doelstellingen, bedoeld in artikel 40 van [richtlijn 2009/73](32009L0073),
      voldoet;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel5.2
  - number: 5.2.c
    text: |-
      beoordeelt de samenhang tussen een investeringsplan als bedoeld in artikel 3.34 van de wet van een
      transmissiesysteembeheerder en het Uniebrede netontwikkelingsplan als bedoeld in artikel 30, eerste lid, onderdeel
      b, van [verordening 2019/943](32843R2019) of artikel 8, derde lid, onderdeel b, van [verordening 714/2009]
      (32009R0714);
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel5.2
  - number: 5.2.d
    text: volgt het niveau van transparantie op de elektriciteits- en gasmarkten, met inbegrip van de groothandelsprijzen;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel5.2
  - number: 5.2.e
    text: |-
      volgt het niveau en de doeltreffendheid van de openstelling van de markt en de mededinging op groot- en
      kleinhandelsniveau;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel5.2
  - number: 5.2.f
    text: |-
      volgt het bestaan van praktijken gericht op het aangaan van overeenkomsten die afnemers kunnen weerhouden van of
      hen beperkingen kunnen opleggen met betrekking tot een keuze voor het gelijktijdig sluiten van overeenkomsten met
      meer dan een leverancier;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel5.2
  - number: 5.2.g
    text: |-
      volgt de marktontwikkelingen van levering op basis van een dynamische elektriciteitsprijs als bedoeld in artikel
      2.9, van de wet, en beoordeelt de risico’s van nieuwe producten en diensten;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel5.2
  - number: 5.2.h
    text: volgt de investeringen in productie- en opslagcapaciteit met het oog op de voorzieningszekerheid;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel5.2
  - number: 5.2.i
    text: |-
      volgt de technische samenwerking tussen transmissiesysteembeheerders binnen de Europese Unie en buitenlandse
      instellingen die op grond van nationale wettelijke regels zijn belast met het beheer van een transmissiesysteem in
      landen buiten de Europese Unie;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel5.2
  - number: 5.2.j
    text: volgt het congestiebeheer van transmissie- en distributiesystemen, inclusief interconnectoren.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel5.2
  - number: '5.3'
    text: 'De Autoriteit Consument en Markt publiceert:'
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel5.3
  - number: 5.3.a
    text: |-
      jaarlijks aanbevelingen over de conformiteit van de leveringsprijzen met artikel 5 van [richtlijn 2019/944]
      (32019L0944) en artikel 3 van [richtlijn 2009/73](32009L0073);
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel5.3
  - number: 5.3.b
    text: jaarlijks de beoordelingen bedoeld in artikel 5.2, onderdeel c;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel5.3
  - number: 5.3.c
    text: |-
      tot 1 januari 2036 jaarlijks een verslag met de belangrijkste marktontwikkelingen van levering op basis van een
      dynamische elektriciteitsprijs als bedoeld in artikel 2.9, van de wet, waaronder de ontwikkeling van het aanbod op
      de markt en de effecten op de facturen van de consument en de prijsvolatiliteit;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel5.3
  - number: 5.3.d
    text: |-
      om de twee jaren aanbevelingen over de prestaties van de transmissie- en distributiesysteembeheerders voor
      elektriciteit met betrekking tot de ontwikkeling van een slim netwerk dat gericht is op energie-efficiëntie en de
      integratie van energie uit hernieuwbare bronnen;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel5.3
  - number: 5.3.e
    text: |-
      de geschatte kosten van de transmissie- en distributiesysteembeheerders die zij gebruikt voor het vaststellen van
      een inkomstenbesluit of een tarievenbesluit met inachtneming van het bepaalde in artikel 5.1, eerste lid, onderdeel
      c, van de Wet open overheid.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel5.3
  - number: '5.4'
    text: 'De Autoriteit Consument en Markt:'
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel5.4
  - number: 5.4.a
    text: |-
      draagt bij aan de compatibiliteit van gegevensuitwisselingsprocessen voor de belangrijkste marktprocessen in één of
      meer geografische gebieden als bedoeld in artikel 34, derde lid, van [verordening 2019/943](32843R2019) of artikel
      12, derde lid, van [verordening 715/2009](32009R0715);
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel5.4
  - number: 5.4.b
    text: |-
      zorgt ervoor dat een transmissiesysteembeheerder voor elektriciteit ingevolge artikel 16 van [verordening 2019/943]
      (32843R2019) zo veel mogelijk interconnectorcapaciteit beschikbaar stelt;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel5.4
  - number: 5.4.c
    text: |-
      draagt in voorkomend geval, met de instellingen in andere lidstaten van de Europese Unie die op grond van nationale
      wettelijke regels zijn aangewezen als nationale regulerende instantie, zorg voor de gezamenlijke vaststelling van
      niet-naleving van Unierechtelijke verplichtingen, van:
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel5.4
  - number: 5.4.c.i
    text: de ENTSB voor elektriciteit of de EU-DSB-entiteit;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel5.4
  - number: 5.4.c.ii
    text: de regionale coördinatiecentra, opgericht uit hoofde van artikel 35 van [verordening 2019/943](32843R2019);
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel5.4
  - number: 5.4.d
    text: |-
      brengt een certificeringsbeschikking voor een transmissiesysteembeheerder of een interconnectorsysteembeheerder als
      bedoeld in artikel 3.4, eerste of derde lid, van de wet, en alle relevante informatie in verband met dat besluit
      onverwijld ter kennis van de Europese Commissie.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel5.4
  - number: '5.5'
    text: |-
      Indien Onze Minister op grond van artikel 5.12, eerste lid, van de wet de transmissiesysteembeheerder voor
      elektriciteit opdraagt tot de inrichting van een strategische reserve als bedoeld in artikel 21, derde lid, van
      [verordening 2019/943](32843R2019), worden bij ministeriële regeling regels gesteld over, in ieder geval:
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel5.5
  - number: 5.5.a
    text: het doel van de strategische reserve;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel5.5
  - number: 5.5.b
    text: de periode waarvoor de strategische reserve wordt ingericht;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel5.5
  - number: 5.5.c
    text: de wijze waarop de transmissiesysteembeheerder een strategische reserve contracteert;
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel5.5
  - number: 5.5.d
    text: niet-beschikbaarheidsbetalingen die de transmissiesysteembeheerder kan opleggen bij niet levering; en
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel5.5
  - number: 5.5.e
    text: overige regels die noodzakelijk zijn voor de inrichting van een strategische reserve.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel5.5
  - number: 5.6.1
    text: De bedragen die verschuldigd zijn op grond van artikel 5.27, eerste lid, van de wet, zijn vaste bedragen.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel5.6
  - number: 5.6.2
    text: |-
      De hoogte van de bedragen, bedoeld in het eerste lid, kan verschillen voor de verschillende in artikel 5.27, eerste
      lid, van de wet, bedoelde beschikkingen.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel5.6
  - number: 5.6.3
    text: De hoogte van de bedragen, bedoeld in het eerste lid, wordt bij ministeriële regeling vastgesteld.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel5.6
  - number: 5.6.4
    text: |-
      Onze Minister brengt de bedragen, bedoeld in het eerste lid, in rekening en verzendt een beschikking daartoe
      tegelijk met de bekendmaking van de betreffende beschikking, bedoeld artikel 5.27, eerste lid, van de wet.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel5.6
  - number: 5.6.5
    text: |-
      In afwijking van het vierde lid brengt de Autoriteit Consument en Markt de bedragen in rekening, voor zover zij
      namens Onze Minister beschikkingen neemt als bedoeld artikel 5.27, eerste lid, van de wet.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel5.6
  - number: 5.6.6
    text: |-
      De bedragen die worden gefactureerd door Onze Minister, worden door Onze Minister geïnd en aan Onze Minister
      betaald.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel5.6
  - number: 5.7.1
    text: |-
      Een distributiesysteembeheerder verstrekt aan Onze Minister de bij ministeriële regeling te bepalen gegevens met
      betrekking tot een aangeslotene als bedoeld in artikel 3.53, derde lid, van de wet ten behoeve van het houden van
      toezicht op het bepaalde in artikel 2.46, eerste en derde lid, en artikel 2.47, eerste lid, van de wet.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel5.7
  - number: 5.7.2
    text: |-
      Een distributiesysteembeheerder bewaart de bij ministeriële regeling te bepalen gegevens voor een bij die
      ministeriële regeling te bepalen termijn, die hij moet verstrekken op grond van het eerste lid, die niet zijn
      opgenomen in een register als bedoeld in artikel 4.5, eerste lid, van de wet.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel5.7
  - number: 5.7.3
    text: |-
      Een distributiesysteembeheerder verstrekt de gegevens als bedoeld in het eerste lid middels een faciliteit als
      bedoeld in artikel 4.16, derde lid, van de wet en geeft de gegevensuitwisselingsentiteit ter uitvoering van het
      vierde lid toegang tot zijn register, bedoeld in artikel 4.5, eerste lid, van de wet en de gegevens die hij op
      grond van het tweede lid bewaart.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel5.7
  - number: 5.7.4
    text: |-
      De gegevensuitwisselingsentiteit geeft Onze Minister toegang tot en faciliteert de uitwisseling van de gegevens,
      bedoeld in het eerste lid, middels een faciliteit van de gegevensuitwisselingsentiteit.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel5.7
  - number: '6.24'
    text: |-
      De periode, bedoeld in artikel 7.28, eerste lid, van de wet is vanaf de inwerkingtreding van dat artikel tot
      1 januari 2027.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel6.24
  - number: '6.25'
    text: |-
      Op aanvragen die voor de inwerkingtreding van artikel 6.4 van dit besluit zijn ingediend is het recht dat gold
      onmiddellijk voor het tijdstip van inwerkingtreding van dat artikel van toepassing.
    url: https://wetten.overheid.nl/BWBR0051745/2026-01-01#Artikel6.25
  - number: '6.27'
    text: 'De volgende besluiten worden ingetrokken:'
