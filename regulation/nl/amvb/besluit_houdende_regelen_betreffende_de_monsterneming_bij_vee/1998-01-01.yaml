preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Landbouw en Visserij van 14 april 1988, no. J 3843, Directie Juridische
    en Bedrijfsorganisatorische Zaken, gedaan in overeenstemming met de Staatssecretaris van Welzijn, Volksgezondheid
    en Cultuur;

    Overwegende dat de Richtlijn van de Raad van de Europese Gemeenschappen van 16 september 1986 inzake het onderzoek
    van dieren en vers vlees op de aanwezigheid van residuen (86/469/EEG, PbEG L275) voorschrijft dat de Lid-Staten
    steekproefsgewijs monsters nemen bij levende dieren op de veehouderij;

    Gelet op artikel 49 van de Diergeneesmiddelenwet (Stb. 1985, 410);

    De Raad van State gehoord (advies van 19 mei 1988, No. W11.88.0189);

    Gezien het nader rapport van Onze Minister van Landbouw en Visserij van 16 juni 1988, nr. J 6038, Directie
    Juridische en Bedrijfsorganisatorische Zaken, uitgebracht in overeenstemming met de Staatssecretaris van Welzijn,
    Volksgezondheid en Cultuur;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0004357/1998-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      De in [artikel 52 van de Diergeneesmiddelenwet][ref1] bedoelde ambtenaren zijn bevoegd om bij runderen, varkens,
      schapen, geiten, eenhoevigen, pluimvee, tamme konijnen, wilde dieren en wilde herkauwers, voor zover zij op een
      bedrijf worden gehouden, monsters te nemen van lichaamsvloeistoffen en uitscheidingsproducten, alsmede om van
      aquicultuurdieren en het vangstwater monsters te nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel52
    url: https://wetten.overheid.nl/BWBR0004357/1998-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '52'
  - number: '3'
    text: |-
      Het bepaalde in de [artikelen 56][ref1] en [57 van de Diergeneesmiddelenwet][ref2] is van overeenkomstige
      toepassing op een monster, dat ingevolge de in [artikel 1][ref3] omschreven bevoegdheid wordt genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel56
      [ref2]: https://wetten.overheid.nl/BWBR0003818#Artikel57
      [ref3]: https://wetten.overheid.nl/BWBR0004357#Artikel1
