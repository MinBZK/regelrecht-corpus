preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Volksgezondheid, Welzijn en Sport van 13 oktober 1994, Directie
    Algemeen Sociaal Beleid, nr. 943335;

    Gelet op artikel 10 van de Welzijnswet 1994;

    De Raad van State gehoord (advies van 12 december 1994, no. W13.94.0622);

    Gezien het nader rapport van de Staatssecretaris van Volksgezondheid, Welzijn en Sport van 19 december 1994, DASB/
    BJA-944375, in overeenstemming met de Staatssecretaris van Justitie;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel1
  - number: 1.a
    text: |-
      wet: [Welzijnswet 1994][ref1];

      [ref1]: https://wetten.overheid.nl/BWBR0006705
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006705
  - number: 1.b
    text: |-
      instelling: een privaatrechtelijke rechtspersoon met volledige rechtsbevoegdheid, dan wel een rechtspersoon die
      krachtens publiekrecht is ingesteld;
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel1
  - number: 1.c
    text: 'project: een activiteit op het terrein van het welzijnsbeleid met een incidenteel karakter;'
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel1
  - number: 1.d
    text: |-
      instellingssubsidie: een subsidie aan een instelling in de kosten van haar structurele activiteiten of een gedeelte
      daarvan;
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel1
  - number: 1.e
    text: 'projectsubsidie: een subsidie in de kosten van een project;'
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel1
  - number: 1.f
    text: |-
      beleidsplan: een plan als bedoeld in [artikel 9][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007133#Artikel9
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007133
        artikel: '9'
        hoofdstuk: II
        paragraaf: '2'
  - number: 1.g
    text: |-
      welzijnsnota: de nota, bedoeld in [artikel 8 van de wet][ref1] ;


      [ref1]: https://wetten.overheid.nl/BWBR0006705#Artikel8
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006705
        artikel: '8'
  - number: 1.h
    text: |-
      uitkering: een specifieke uitkering als bedoeld in [artikel 9 van de wet][ref1] .


      [ref1]: https://wetten.overheid.nl/BWBR0006705#Artikel9
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006705
        artikel: '9'
  - number: 1a
    text: |-
      Dit besluit is van toepassing op de verstrekking van uitkeringen en subsidies op beleidsterreinen die op
      grond van de [artikelen 4, derde lid][ref1], en [5 van de wet][ref2] tot de verantwoordelijkheid van het
      Rijk behoren, tenzij daarvoor bij een algemene maatregel van bestuur of ministeriële regeling als bedoeld in
      [artikel 10, eerste lid, van de wet][ref3], andere regels zijn gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0006705#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0006705#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0006705#Artikel10
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0006705
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0006705
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0006705
        artikel: '10'
  - number: '2'
    text: |-
      Onze Minister maakt openbaar welke activiteiten voor een uitkering als bedoeld in [artikel 40][ref1] of voor
      subsidie in aanmerking komen, voor zover dit niet reeds blijkt uit de welzijnsnota, alsmede voor zover hij
      voornemens is af te wijken van het in die nota gestelde.


      [ref1]: https://wetten.overheid.nl/BWBR0007133#Artikel40
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0007133
        artikel: '40'
        hoofdstuk: VI
        paragraaf: '1'
  - number: '3.1'
    text: |-
      Een subsidie of een uitkering als bedoeld in [artikel 40][ref1] ten laste van een
      begroting die nog niet is vastgesteld, wordt verleend onder de voorwaarde, bedoeld in
      [artikel 4:34, eerste lid, van de Algemene wet bestuursrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007133#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0007133
        artikel: '40'
        hoofdstuk: VI
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '3.2'
    text: |-
      Subsidies en uitkeringen als bedoeld in [artikel 40][ref1] worden slechts verstrekt voorzover Onze Minister
      van oordeel is dat het verstrekken van subsidies en uitkeringen zijn beleid ondersteunt dat is neergelegd in de
      welzijnsnota dan wel dat met toepassing van [artikel 2][ref2] openbaar is gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0007133#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0007133#Artikel2
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0007133
        artikel: '40'
        hoofdstuk: VI
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007133
        artikel: '2'
        hoofdstuk: I
  - number: '4.1'
    text: 'Subsidie wordt voorts slechts verstrekt, indien:'
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel4
  - number: 4.1.a
    text: |-
      naar het oordeel van Onze Minister mag worden verwacht dat de met de subsidiëring beoogde doeleinden zullen worden
      bereikt; en
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel4
  - number: 4.1.b
    text: 'de aanvrager:'
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel4
  - number: 4.1.b.1°
    text: naar het oordeel van Onze Minister de behoefte aan subsidie heeft aangetoond; en
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel4
  - number: 4.1.b.2°
    text: |-
      aannemelijk heeft gemaakt dat de financiële middelen, met inbegrip van subsidie, voldoende zullen zijn om de
      voorgenomen activiteiten uit te voeren.
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel4
  - number: '4.2'
    text: |-
      Het eerste lid, aanhef en onder *b*, is niet van toepassing indien het betreft een subsidie aan een rechtspersoon
      die krachtens publiekrecht is ingesteld.
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel4
  - number: '5'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de wijze waarop het bedrag van een
      uitkering als bedoeld in [artikel 40][ref1] of van een subsidie wordt berekend.


      [ref1]: https://wetten.overheid.nl/BWBR0007133#Artikel40
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007133
        artikel: '40'
        hoofdstuk: VI
        paragraaf: '1'
  - number: '6.1'
    text: |-
      De instelling die voor haar activiteiten of een gedeelte daarvan in een jaar een instellingssubsidie
      verlangt, dient uiterlijk dertien weken vóór de aanvang van het desbetreffende jaar een subsidieaanvraag in.
      De aanvraag wordt onderbouwd met een activiteitenplan en een begroting van de instelling en gaat, indien de
      liquiditeitsbehoefte niet regelmatig gespreid is over het jaar, vergezeld van een liquiditeitsprognose.
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel6
  - number: '6.2'
    text: |-
      In het activiteitenplan worden de aard en de omvang van de voorgenomen activiteiten beschreven. Daarbij
      wordt aangegeven welke doelstelling de instelling met de activiteiten nastreeft, op welke wijze zij
      zullen worden uitgevoerd, voor welke doelgroep zij zijn bestemd en op welke wijze wordt voldaan aan
      [artikel 7, eerste lid][ref1], van de wet.


      [ref1]: https://wetten.overheid.nl/BWBR0006705#Artikel7
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0006705
        artikel: '7'
  - number: '6.3'
    text: |-
      De begroting geeft inzicht in de baten en lasten van de activiteiten waarvoor subsidie wordt gevraagd in dat jaar.
      Daarbij wordt uitgegaan van het prijspeil en van het niveau van de kosten van de arbeidsvoorwaarden op het moment
      van indiening van de aanvraag. De begroting is voorzien van een postgewijze toelichting. Indien de instelling een
      privaatrechtelijke rechtspersoon is bevat de begroting tevens zowel de baten en lasten van de instelling als geheel
      als de baten en lasten van elk te onderscheiden onderdeel van de instelling.
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel6
  - number: '6.4'
    text: |-
      De liquiditeitsprognose geeft gemotiveerd inzicht in het verloop van de liquiditeitsbehoefte van de activiteiten
      per kalenderkwartaal.
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel6
  - number: '6.5'
    text: Onze Minister kan ontheffing verlenen van de in het eerste lid genoemde aanvraagtermijn.
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel6
  - number: '7.1'
    text: |-
      Bij de aanvraag van een jaarlijkse instellingssubsidie door een privaatrechtelijke rechtspersoon worden tevens
      overgelegd:
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel7
  - number: 7.1.a
    text: een afschrift van de oprichtingsakte of de statuten;
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel7
  - number: 7.1.b
    text: een afschrift waaruit de inschrijving van de instelling in het geldende openbaar register blijkt;
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel7
  - number: 7.1.c
    text: een volledig overzicht van de financiële toestand van de instelling op het tijdstip van de aanvraag; en
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel7
  - number: 7.1.d
    text: |-
      indien de aanvraag is ondertekend door een of meer andere personen dan de personen die op grond van de statuten
      bevoegd zijn de instelling te vertegenwoordigen: een afschrift van de volmacht op grond waarvan de aanvraag door
      die andere persoon of personen is ondertekend.
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel7
  - number: '7.2'
    text: |-
      Voor zover de aanvrager voor dezelfde begrote uitgaven tevens subsidie of een andere financiële bijdrage heeft
      aangevraagd bij een of meer andere bestuursorganen of organisaties, doet hij daarvan mededeling in de aanvraag,
      onder vermelding van de stand van zaken met betrekking tot de beoordeling van die aanvraag of aanvragen.
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel7
  - number: '7.3'
    text: |-
      Overlegging van de in het eerste lid bedoelde afschriften kan achterwege blijven, indien de aanvrager er
      redelijkerwijs van uit kan gaan dat deze gegevens aan Onze Minister bekend zijn.
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel7
  - number: '8'
    text: |-
      Indien in de welzijnsnota dan wel in de mededeling, bedoeld in [artikel 8, vierde lid][ref1], van de wet,
      de mogelijkheid daartoe is opgenomen, kan Onze Minister op een bepaald terrein van het welzijnsbeleid
      instellingssubsidies verlenen voor een duur van meer dan één jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0006705#Artikel8
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0006705
        artikel: '8'
  - number: '9.1'
    text: |-
      Een aanvraag van een meerjarige instellingssubsidie wordt ingediend vóór een bij ministeriële regeling te
      bepalen tijdstip, dat voor verschillende activiteiten op het terrein van het welzijnsbeleid verschillend kan
      worden vastgesteld. Dit tijdstip ligt ten minste dertien weken vóór de aanvang van de periode waarvoor subsidie
      wordt gevraagd. De aanvraag gaat vergezeld van een beleidsplan voor de hele periode en een liquiditeitsprognose.
      [Artikel 6, vierde lid, eerste volzin][ref1], en [artikel 7][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007133#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0007133#Artikel7
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0007133
        artikel: '6'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007133
        artikel: '7'
        hoofdstuk: II
        paragraaf: '1'
  - number: '9.2'
    text: 'Het beleidsplan geeft ten minste inzicht in:'
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel9
  - number: 9.2.a
    text: de beleidsvoornemens voor de betrokken periode; en
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel9
  - number: 9.2.b
    text: de geschatte baten en lasten gedurende de betrokken periode.
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel9
  - number: '9.3'
    text: Onze Minister kan ontheffing verlenen van de in het eerste lid bedoelde aanvraagtermijn.
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel9
  - number: '10'
    text: |-
      Uiterlijk dertien weken, voorafgaand aan enig jaar waarvoor een meerjarige instellingssubsidie is aangevraagd
      of verleend, dient de instelling bij Onze Minister een activiteitenplan in, vergezeld van een begroting van de
      instelling. [Artikel 6, tweede en derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007133#Artikel6
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0007133
        artikel: '6'
        hoofdstuk: II
        paragraaf: '1'
  - number: '11.1'
    text: Onze Minister kan projectsubsidies verlenen die zich uitstrekken over meer dan één kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel11
  - number: '11.2'
    text: |-
      De natuurlijke persoon of de rechtspersoon die subsidie voor een bepaald project verlangt, dient ten minste dertien
      weken vóór de aanvang van het project een aanvraag in. De aanvraag wordt onderbouwd met een projectplan en een
      begroting en gaat vergezeld van een liquiditeitsprognose.
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel11
  - number: '11.3'
    text: |-
      In het projectplan worden de aard en de omvang van de voorgenomen activiteiten beschreven. Daarbij wordt aangegeven
      welke doelstelling de aanvrager met de activiteiten nastreeft en op welke wijze die zullen worden uitgevoerd.
      Indien in het kader van het project uitvoerend werk of steunfunctiewerk wordt verricht, wordt tevens aangegeven op
      welke wijze wordt voldaan aan [artikel 7, eerste lid][ref1], van de wet.


      [ref1]: https://wetten.overheid.nl/BWBR0006705#Artikel7
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0006705
        artikel: '7'
  - number: '11.4'
    text: |-
      De begroting geeft inzicht in de baten en lasten van het project. De begroting is voorzien van een postgewijze
      toelichting. Daarbij wordt uitgegaan van het prijspeil en van het niveau van de kosten van de arbeidsvoorwaarden op
      het moment van indiening van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel11
  - number: '11.5'
    text: |-
      De liquiditeitsprognose geeft gemotiveerd inzicht in het verloop van de liquiditeitsbehoefte van de activiteiten
      per maand. De liquiditeitsprognose kan achterwege blijven als de liquiditeitsbehoefte regelmatig gespreid is over
      de duur van het project.
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel11
  - number: '11.6'
    text: |-
      In afwijking van het tweede lid kan Onze Minister bepalen dat aanvragen voor projecten op bepaalde terreinen vóór
      een of meer door hem vastgestelde data worden ingediend.
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel11
  - number: '11.7'
    text: Onze Minister kan ontheffing verlenen van de in het tweede of zesde lid bedoelde aanvraagtermijn.
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel11
  - number: '12.1'
    text: 'Bij de aanvraag van een projectsubsidie door een privaatrechtelijke rechtspersoon worden tevens overgelegd:'
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel12
  - number: 12.1.a
    text: een afschrift van de oprichtingsakte of de statuten;
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel12
  - number: 12.1.b
    text: een afschrift waaruit de inschrijving van de instelling in het geldende openbaar register blijkt; en
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel12
  - number: 12.1.c
    text: |-
      indien de aanvraag is ondertekend door een of meer andere personen dan de personen die op grond van de statuten
      bevoegd zijn de instelling te vertegenwoordigen: een afschrift van de volmacht op grond waarvan de aanvraag door
      die andere persoon of personen is ondertekend.
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel12
  - number: '12.2'
    text: |-
      Onze Minister kan een aanvrager of een categorie aanvragers tevens verplichten tot het overleggen van een volledig
      overzicht van de financiële toestand van de instelling op het tijdstip van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel12
  - number: '12.3'
    text: |-
      Voor zover de aanvrager voor dezelfde begrote uitgaven tevens subsidie of een andere financiële bijdrage heeft
      aangevraagd bij een of meer andere bestuursorganen of organisaties, doet hij daarvan mededeling in de aanvraag,
      onder vermelding van de stand van zaken met betrekking tot de beoordeling van die aanvraag of aanvragen.
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel12
  - number: '12.4'
    text: |-
      Overlegging van in het eerste lid bedoelde afschriften kan achterwege blijven, indien de aanvrager er
      redelijkerwijs van uit kan gaan dat deze gegevens aan Onze Minister bekend zijn.
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel12
  - number: '12.5'
    text: Het tweede lid is niet van toepassing indien een publiekrechtelijke rechtspersoon een projectsubsidie aanvraagt.
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel12
  - number: '13'
    text: |-
      Onze Minister geeft een beschikking op een aanvraag binnen dertien weken na ontvangst van de aanvraag. Met het oog
      op de onderlinge afweging van aanvragen kan bij ministeriële regeling worden bepaald dat op aanvragen wordt beslist
      na een of meer bepaalde data in een kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel13
  - number: '14.1'
    text: |-
      Nadat een subsidieaanvraag is ingediend, kan Onze Minister voorschotten verlenen. Daarbij wordt rekening gehouden
      met de ingediende liquiditeitsprognose.
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel14
  - number: '14.2'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de bevoorschotting.
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel14
  - number: '14.3'
    text: |-
      Indien de subsidieaanvraag te laat wordt ingediend en Onze Minister de aanvraag desondanks in behandeling neemt,
      kan hij het verlenen van voorschotten evenredig later doen plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel14
  - number: '15'
    text: |-
      In een beschikking waarbij een meerjarige subsidie wordt verleend, wordt vermeld welk bedrag elk jaar van de
      betrokken periode als voorschot zal worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel15
  - number: '16.1'
    text: |-
      Bij de verlening van een subsidie kan Onze Minister bepalen dat het subsidiebedrag door hem wordt bijgesteld,
      rekening houdend met de ontwikkeling van het prijspeil of de ontwikkeling in de kosten van de arbeidsvoorwaarden.
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel16
  - number: '16.2'
    text: |-
      Met het oog op de toepassing van het eerste lid kan Onze Minister bij de verlening van de subsidie tevens
      bepalen welk deel van het subsidiebedrag in aanmerking zal worden genomen voor een bijstelling in verband met de
      ontwikkeling van het prijspeil, onderscheidenlijk van de kosten van de arbeidsvoorwaarden.
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel16
  - number: '16.3'
    text: |-
      Indien een subsidie met toepassing van het eerste lid wordt bijgesteld, kan de bevoorschotting overeenkomstig
      worden gewijzigd.
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel16
  - number: '19'
    text: 'De subsidieontvanger zorgt ervoor dat:'
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel19
  - number: 19.a
    text: |-
      de doeleinden, gesteld in het activiteitenplan, het beleidsplan dan wel het projectplan, op doelmatige wijze worden
      nagestreefd;
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel19
  - number: 19.b
    text: de werkzaamheden op een zodanige manier worden geregeld dat een goed beleid en beheer worden gevoerd; en
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel19
  - number: 19.c
    text: de subsidie op doelmatige wijze wordt gebruikt voor de doeleinden waarvoor deze wordt verleend.
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel19
  - number: '20'
    text: 'De subsidieontvanger zorgt er voorts voor dat:'
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel20
  - number: 20.a
    text: de administratie op overzichtelijke en doelmatige wijze wordt gevoerd;
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel20
  - number: 20.b
    text: de administratie een juist, volledig en actueel beeld geeft van het functioneren van de instelling; en
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel20
  - number: 20.c
    text: |-
      van alle ontvangsten en uitgaven deugdelijke bewijsstukken aanwezig zijn, waaruit de aard en de omvang van de
      geleverde goederen of van de verrichte diensten duidelijk blijken.
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel20
  - number: '21.1'
    text: Bij instellingen die een instellingssubsidie ontvangen, is het boekjaar gelijk aan het kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel21
  - number: '21.2'
    text: Bij ministeriële regeling kan vrijstelling worden verleend van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel21
  - number: '21.3'
    text: Onze Minister kan ontheffing verlenen van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel21
  - number: '22'
    text: |-
      De subsidieontvanger doet zo spoedig mogelijk schriftelijk mededeling aan Onze Minister van omstandigheden die van
      belang kunnen zijn voor een beslissing tot wijziging, intrekking of vaststelling van de subsidie. Daarbij worden de
      relevante stukken overgelegd.
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel22
  - number: '23.1'
    text: |-
      De privaatrechtelijke rechtspersoon die een instellingssubsidie ontvangt, verzekert haar roerende en onroerende
      zaken op afdoende wijze tegen het risico van diefstal en brand alsmede tegen het risico van wettelijke
      aansprakelijkheid tegenover derden.
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel23
  - number: '23.2'
    text: |-
      De ontvanger van een instellingssubsidie verzekert voor vrijwilligers die werkzaamheden verrichten in het kader van
      de gesubsidieerde activiteiten, hun wettelijke aansprakelijkheid.
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel23
  - number: '23.3'
    text: Onze Minister kan op aanvraag ontheffing verlenen van het eerste of tweede lid.
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel23
  - number: '23.4'
    text: |-
      Onze Minister kan het eerste of tweede lid van overeenkomstige toepassing verklaren op de ontvanger van een
      projectsubsidie.
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel23
  - number: '24.1'
    text: |-
      De subsidieontvanger stelt na afloop van de periode of het project waarvoor subsidie is verleend een
      verslag vast dat inzicht geeft in de aard, duur en omvang van de in het kader van de subsidiëring verrichte
      activiteiten. Het verslag vergelijkt de verrichte activiteiten met de in het beleidsplan, activiteitenplan,
      onderscheidenlijk projectplan, voorgenomen activiteiten. Tevens vermeldt het verslag op welke wijze is voldaan aan
      [artikel 7, eerste lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006705#Artikel7
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0006705
        artikel: '7'
  - number: '24.2'
    text: |-
      De ontvanger van een meerjarig instellingssubsidie verstrekt Onze Minister tussentijds financiële informatie
      door binnen 4 maanden na afloop van ieder jaar waarover subsidie is verleend, de jaarrekening in te dienen;
      de[ artikelen 33, vierde lid][ref1], [35][ref2] en [36][ref3] zijn van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007133#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0007133#Artikel35
      [ref3]: https://wetten.overheid.nl/BWBR0007133#Artikel36
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0007133
        artikel: '33'
        hoofdstuk: V
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007133
        artikel: '35'
        hoofdstuk: V
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0007133
        artikel: '36'
        hoofdstuk: V
        paragraaf: '1'
  - number: '25.1'
    text: |-
      Indien een gesubsidieerde activiteit leidt tot een publikatie kan Onze Minister bepalen dat de subsidieontvanger
      er zorg voor draagt dat bij de publikatie wordt aangegeven wie de uitvoerder en subsidiënt van het project zijn
      geweest.
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel25
  - number: '25.2'
    text: |-
      Indien een subsidie gericht is of mede gericht is op de totstandkoming van een werk als bedoeld
      in [artikel 10, onder 1°, van de Auteurswet 1912][ref1], draagt de subsidieontvanger er zorg voor
      auteursrechthebbende te zijn ter zake van dat werk.


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel10
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: '10'
  - number: '25.3'
    text: |-
      De subsidieontvanger vrijwaart de Staat der Nederlanden voor aanspraken van derden ter zake van alle schade die zij
      lijden ten gevolge van de door of vanwege de subsidieontvanger verrichte publikaties.
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel25
  - number: '27.1'
    text: |-
      Onze Minister kan bepalen dat de subsidie-ontvanger in de gevallen genoemd in
      [artikel 4:41, tweede lid, van de Algemene wet bestuursrecht][ref1], aan hem een door hem te bepalen vergoeding
      voor vermogensvorming is verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '27.2'
    text: |-
      Bij de bepaling van de hoogte van de vergoeding wordt uitgegaan van de waarde van de goederen en andere
      vermogensbestanddelen op het tijdstip waarop de vergoeding verschuldigd wordt, met dien verstande dat in geval
      van ontvangst van schadevergoeding voor verlies of beschadiging van zaken, wordt uitgegaan van het bedrag dat
      als schadevergoeding door de instelling wordt ontvangen. Indien het onroerende zaken betreft, geschiedt de
      waardebepaling door één of drie onafhankelijke deskundigen.
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel27
  - number: '27.3'
    text: |-
      Toepassing van het eerste lid blijft achterwege indien de activiteiten van de subsidieontvanger, na toestemming
      van Onze Minister, door een andere rechtspersoon worden voortgezet en de activa tegen boekwaarde aan die andere
      rechtspersoon in eigendom zijn overgedragen.
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel27
  - number: '28.1'
    text: |-
      De vergoeding die de instelling betaalt aan een organisatie die zich de ondersteuning van één of meer
      gesubsidieerde instellingen ten doel stelt, voor door die organisatie aan de instelling ter beschikking gestelde
      goederen, is niet hoger dan het bedrag dat op grond van de verkrijgings- of vervaardigingsprijs verminderd
      met de ontvangen investeringssubsidies en bestemmingsgiften berekend wordt, rekening houdend met de geldende
      afschrijvingspercentages.
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel28
  - number: '28.2'
    text: |-
      De vergoeding die de instelling betaalt aan een organisatie die zich de ondersteuning van één of meer
      gesubsidieerde instellingen ten doel stelt, voor door die organisatie aan de instelling geleverde diensten, is,
      indien het diensten betreft die in het algemeen door soortgelijke instellingen in eigen beheer worden verricht,
      niet hoger dan het bedrag dat gelijk is aan de kosten die de instelling zou hebben gehad bij het verrichten van de
      diensten in eigen beheer.
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel28
  - number: '28.3'
    text: |-
      De vergoeding die de instelling betaalt aan een organisatie die zich de ondersteuning van één of meer
      gesubsidieerde instellingen ten doel stelt, voor door die organisatie aan de instelling geleverde diensten, andere
      dan bedoeld in het tweede lid, is niet hoger dan het bedrag dat voor het doen verrichten van dergelijke diensten
      door andere organisaties gebruikelijk kan worden geacht.
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel28
  - number: '29'
    text: |-
      De subsidieontvanger die aan derden goederen ter beschikking stelt of voor derden diensten verricht, brengt
      daarvoor een vergoeding in rekening die ten minste kostendekkend is, tenzij het derden betreft voor wie de
      gesubsidieerde activiteiten bestemd zijn; Onze Minister kan ook andere gevallen aanwijzen waarin de bepaling niet
      geldt.
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel29
  - number: '30.1'
    text: |-
      De subsidieontvanger verstrekt aan de door Onze Minister aangewezen ambtenaren of andere personen op hun verzoek
      alle bescheiden en inlichtingen die noodzakelijk zijn voor een juiste vervulling van hun taak. De bescheiden
      worden op één adres getoond en de inlichtingen, op verzoek, schriftelijk verstrekt. Indien de instelling slechts
      kan voldoen aan deze verplichting door inbreuk te maken op het recht van enig persoon op bescherming van zijn
      persoonlijke levenssfeer, verstrekt de instelling de verlangde gegevens op zodanige wijze dat deze niet tot
      personen herleidbaar zijn.
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel30
  - number: '30.2'
    text: |-
      Ook anderszins wordt zoveel mogelijk medewerking verleend teneinde de door Onze Minister aangewezen ambtenaren of
      andere personen in staat te stellen hun taak op een juiste wijze te vervullen.
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel30
  - number: '30.3'
    text: |-
      De subsidieontvanger werkt mee aan door of namens Onze Minister ingestelde onderzoeken die erop zijn gericht Onze
      Minister inlichtingen te verschaffen ten behoeve van de uitvoering van de landelijke functie.
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel30
  - number: '31'
    text: |-
      Indien bij Onze Minister het vermoeden is gerezen dat [artikel 28][ref1] niet is nageleefd, spant de
      subsidieontvanger zich desgevraagd in de jaarrekening van de desbetreffende organisatie over te leggen.


      [ref1]: https://wetten.overheid.nl/BWBR0007133#Artikel28
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0007133
        artikel: '28'
        hoofdstuk: IV
  - number: '32.1'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent aan de verlening van bepaalde categorieën
      subsidies te verbinden verplichtingen.
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel32
  - number: '32.2'
    text: |-
      Onze Minister kan tevens bij de subsidieverlening verplichtingen opleggen die strekken tot verwezenlijking van het
      doel van de subsidie.
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel32
  - number: '33.1'
    text: |-
      Binnen vier maanden na afloop van de periode of het project waarvoor subsidie is verleend, dient de
      subsidieontvanger een aanvraag in voor de subsidievaststelling.
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel33
  - number: '33.2'
    text: 'De aanvraag voor de subsidievaststelling gaat vergezeld van:'
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel33
  - number: 33.2.a
    text: |-
      het verslag, bedoeld in [artikel 24, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007133#Artikel24
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0007133
        artikel: '24'
        hoofdstuk: IV
  - number: 33.2.b
    text: een subsidiedeclaratie;
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel33
  - number: 33.2.c
    text: de jaarrekening(en); en
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel33
  - number: 33.2.d
    text: |-
      indien de aanvraag is ondertekend door een of meer andere personen dan de personen die op grond van de statuten
      bevoegd zijn de instelling te vertegenwoordigen: een afschrift van de volmacht op grond waarvan de aanvraag door
      die andere persoon of personen is ondertekend.
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel33
  - number: '33.3'
    text: |-
      Een subsidiedeclaratie kan achterwege blijven indien de daarmee te verstrekken informatie reeds in de in te zenden
      jaarrekening is opgenomen.
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel33
  - number: '33.4'
    text: |-
      Een jaarrekening behoeft , tenzij bij de subsidieverlening anders is bepaald, niet te worden ingezonden, indien het
      gaat om:
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel33
  - number: 33.4.a
    text: een projectsubsidie; of
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel33
  - number: 33.4.b
    text: een subsidie aan een publiekrechtelijke rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel33
  - number: '33.5'
    text: Bij ministeriële regeling kan vrijstelling worden verleend van de in het eerste lid genoemde aanvraagtermijn.
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel33
  - number: '33.6'
    text: Onze Minister kan ontheffing verlenen van de in het eerste lid genoemde aanvraagtermijn.
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel33
  - number: '34'
    text: |-
      De subsidiedeclaratie geeft een zodanig inzicht dat een verantwoord oordeel kan worden gevormd omtrent de
      aanwending en de besteding van de subsidie door de instelling en geeft de nodige informatie om de subsidie
      vast te stellen. De subsidiedeclaratie sluit aan op de indeling van de bij de subsidieaanvraag ingediende
      begroting. Belangrijke verschillen tussen declaratie en begroting worden toegelicht. In de subsidiedeclaratie van
      instellingssubsidies wordt de aansluiting tussen de subsidiedeclaratie en de jaarrekening(en) toegelicht.
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel34
  - number: '35.1'
    text: |-
      De [afdelingen 2 tot en met 8 van Titel 9 van Boek 2 van het Burgerlijk Wetboek][ref1] zijn van overeenkomstige
      toepassing op de jaarrekening, met dien verstande dat de winst- en verliesrekening vervangen wordt door een
      exploitatierekening; op deze rekening zijn de bepalingen omtrent de winst- en verliesrekening zoveel mogelijk
      van overeenkomstige toepassing. Bepalingen omtrent winst en verlies zijn van overeenkomstige toepassing op het
      exploitatiesaldo.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Afdeling2
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0003045
        afdeling: '2'
  - number: '35.2'
    text: |-
      De grondslag voor de waardering van activa en passiva is de verkrijgings- of vervaardigingsprijs verminderd met de
      ontvangen investeringssubsidies en bestemmingsgiften.
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel35
  - number: '35.3'
    text: |-
      Onze Minister kan bepalen dat bepalingen van de in het eerste lid bedoelde Titel of onderdelen daarvan niet van
      toepassing zijn op bepaalde instellingen of categorieën van instellingen.
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel35
  - number: '36.1'
    text: |-
      De jaarrekening en de subsidiedeclaratie zijn ieder afzonderlijk voorzien van een verklaring van een accountant als
      bedoeld in [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '36.2'
    text: |-
      De jaarrekening of de subsidiedeclaratie gaat vergezeld van een rapportage omtrent de naleving van de
      subsidiebepalingen door de subsidieontvanger, opgesteld door de accountant overeenkomstig een door Onze Minister
      vast te stellen protocol.
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel36
  - number: '36.3'
    text: |-
      De subsidieontvanger draagt er zorg voor dat de accountant meewerkt aan door of namens de departementale
      accountantsdienst in te stellen onderzoeken naar de door de accountant verrichte (controle)-werkzaamheden. De
      daaraan verbonden kosten worden geacht te zijn begrepen in de subsidie.
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel36
  - number: '36.4'
    text: |-
      In geval van een instellingssubsidie zijn het eerste en tweede lid niet van toepassing indien het totaal van de
      door Onze Minister verleende subsidies met betrekking tot dat jaar minder dan €  125 000 bedraagt.
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel36
  - number: '36.5'
    text: |-
      In geval van een projectsubsidie zijn, tenzij bij de subsidieverlening anders is bepaald, het eerste en tweede lid
      niet van toepassing indien de subsidie minder dan € 125 000 bedraagt.
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel36
  - number: '37'
    text: |-
      Binnen zes maanden na ontvangst van de aanvraag, bedoeld in [artikel 33][ref1], geeft Onze Minister een beschikking
      tot vaststelling van de subsidie.


      [ref1]: https://wetten.overheid.nl/BWBR0007133#Artikel33
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0007133
        artikel: '33'
        hoofdstuk: V
        paragraaf: '1'
  - number: '40'
    text: |-
      Uitkeringen aan provincies en gemeenten ten behoeve van het door hun besturen te voeren welzijnsbeleid worden door
      Onze Minister toegekend met inachtneming van de[ artikelen 41 tot en met 51][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007133#Artikel41
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0007133
        artikel: '41'
        hoofdstuk: VI
        paragraaf: '2'
  - number: '41.1'
    text: |-
      De aanvraag van een jaarlijkse uitkering wordt uiterlijk dertien weken vóór de aanvang van het kalenderjaar waarop
      deze betrekking heeft, ingediend.
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel41
  - number: '41.2'
    text: |-
      Bij de aanvraag wordt aangegeven welke activiteiten met behulp van de uitkering zullen worden bekostigd, welke
      doelen daarmee worden nagestreefd en welke kosten met de activiteiten zullen zijn gemoeid.
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel41
  - number: '41.3'
    text: Onze Minister kan ontheffing verlenen van de in het eerste lid genoemde aanvraagtermijn.
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel41
  - number: '42.1'
    text: |-
      Indien in de welzijnsnota dan wel in de mededeling, bedoeld in [artikel 8, vierde lid][ref1], van de wet, de
      mogelijkheid daartoe is opgenomen, kan Onze Minister op een bepaald terrein van het welzijnsbeleid uitkeringen,
      anders dan ten behoeve van projecten, verlenen voor een duur van meer dan een jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0006705#Artikel8
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0006705
        artikel: '8'
  - number: '42.2'
    text: |-
      Een aanvraag van een meerjarige uitkering, anders dan ten behoeve van een project, wordt ingediend vóór een
      bij ministeriële regeling te bepalen tijdstip, dat voor verschillende activiteiten op het terrein van het
      welzijnsbeleid verschillend kan worden vastgesteld. Dit tijdstip ligt ten minste dertien weken vóór de aanvang van
      de periode waarvoor een uitkering wordt gevraagd. [Artikel 41, tweede en derde lid][ref1], is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007133#Artikel41
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0007133
        artikel: '41'
        hoofdstuk: VI
        paragraaf: '2'
  - number: '43.1'
    text: Onze Minister kan voor projecten uitkeringen verlenen die zich uitstrekken over meer dan één kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel43
  - number: '43.2'
    text: |-
      Een aanvraag van een meerjarige uitkering ten behoeve van een project wordt uiterlijk dertien weken vóór de
      aanvang van de periode waarop deze betrekking heeft, ingediend. [Artikel 41, tweede en derde lid][ref1], is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007133#Artikel41
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0007133
        artikel: '41'
        hoofdstuk: VI
        paragraaf: '2'
  - number: '44.1'
    text: |-
      Onze Minister geeft een beschikking op de aanvraag binnen dertien weken na ontvangst van de aanvraag. Met het oog
      op de onderlinge afweging van aanvragen kan bij ministeriële regeling worden bepaald dat op aanvragen wordt beslist
      op of na een of meer bepaalde data in een kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel44
  - number: '44.2'
    text: |-
      Indien de beslissing een verlening inhoudt, wordt het bedrag van de te verlenen uitkering vermeld dan wel de wijze
      waarop dit wordt bepaald en welk bedrag ten hoogste zal worden verleend.
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel44
  - number: '44.3'
    text: |-
      De [artikelen 4:48][ref1] en [4:50 van de Algemene wet bestuursrecht][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '45'
    text: |-
      Nadat een aanvraag voor een uitkering is ingediend, kan Onze Minister voorschotten verlenen. De
      [artikelen 14, tweede en derde lid][ref1], en [15][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007133#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0007133#Artikel15
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0007133
        artikel: '14'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0007133
        artikel: '15'
        hoofdstuk: III
  - number: '46.1'
    text: |-
      Bij de verlening van een uitkering kan Onze Minister bepalen dat het uitkeringsbedrag door hem wordt bijgesteld,
      rekening houdend met de ontwikkeling van het prijspeil of de ontwikkeling in de kosten van de arbeidsvoorwaarden.
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel46
  - number: '46.2'
    text: |-
      Met het oog op de toepassing van het eerste lid kan Onze Minister bij de verlening van de uitkering tevens
      bepalen welk deel van het uitkeringsbedrag in aanmerking zal worden genomen voor een bijstelling in verband met de
      ontwikkeling van het prijspeil, onderscheidenlijk van de kosten van de arbeidsvoorwaarden.
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel46
  - number: '46.3'
    text: |-
      Indien een uitkering met toepassing van het eerste lid wordt bijgesteld, kan de bevoorschotting overeenkomstig
      worden gewijzigd.
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel46
  - number: '47'
    text: |-
      De provincie of gemeente doet zo spoedig mogelijk schriftelijk mededeling aan Onze Minister van omstandigheden die
      van belang kunnen zijn voor een beslissing tot wijziging, intrekking of vaststelling van een uitkering. Daarbij
      worden de relevante stukken overgelegd.
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel47
  - number: '48'
    text: |-
      Binnen zes maanden na afloop van de periode waarvoor een uitkering is verstrekt, zendt de provincie of gemeente een
      schriftelijk verslag aan Onze Minister over de activiteiten waarvoor de uitkering is verstrekt.
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel48
  - number: '49.1'
    text: |-
      De provincie of gemeente verstrekt aan de door Onze Minister aangewezen ambtenaren of andere personen op diens
      verzoek alle bescheiden en inlichtingen die noodzakelijk zijn voor een juiste vervulling van hun taak. De
      bescheiden worden op één adres getoond en de inlichtingen, op verzoek, schriftelijk verstrekt. Indien de provincie
      of gemeente slechts kan voldoen aan deze verplichting door inbreuk te maken op het recht van enig persoon op
      bescherming van zijn persoonlijke levenssfeer, verstrekt de provincie of gemeente de verlangde gegevens op zodanige
      wijze dat deze niet tot personen herleidbaar zijn.
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel49
  - number: '49.2'
    text: |-
      Ook anderszins wordt zoveel mogelijk medewerking verleend teneinde de door Onze Minister aangewezen ambtenaren of
      andere personen in staat te stellen hun taak op een juiste wijze te vervullen.
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel49
  - number: '49.3'
    text: |-
      De provincie of gemeente werkt mee aan door of namens Onze Minister ingestelde onderzoeken die erop zijn gericht
      Onze Minister inlichtingen te verschaffen ten behoeve van de uitvoering van de landelijke functie.
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel49
  - number: 49a
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent de aan de verlening van bepaalde categorieën
      van uitkeringen te verbinden verplichtingen.
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel49a
  - number: '50.1'
    text: |-
      Binnen tien maanden na afloop van het kalenderjaar waarvoor een uitkering is verstrekt of in geval van een
      meerjarige uitkering binnen tien maanden na afloop van het laatste kalenderjaar waarvoor de uitkering is verstrekt,
      legt de provincie of gemeente een verantwoording over, waaruit blijkt of de activiteiten waarvoor de uitkering was
      bestemd, zijn uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel50
  - number: '50.2'
    text: |-
      Indien de uitkering bestaat uit een vergoeding van werkelijk gemaakte kosten blijkt uit de verantwoording tevens in
      hoeverre de verleende uitkering is besteed ten behoeve van het doel waarvoor zij was bestemd.
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel50
  - number: '50.3'
    text: |-
      Indien de uitkering meer bedraagt dan € 125 000, is de verantwoording voorzien van een verklaring van een
      accountant als bedoeld in [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '50.4'
    text: |-
      Indien de in het eerste en tweede lid bedoelde gegevens voldoende blijken uit de vastgestelde jaarrekening van
      de provincie of gemeente, kan worden volstaan met de toezending van die jaarrekening en de daarbij behorende
      verslagen.
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel50
  - number: '51'
    text: |-
      Binnen zes maanden na ontvangst van een verantwoording als bedoeld in [artikel 50, eerste of tweede lid][ref1],
      of de jaarrekening, bedoeld in [artikel 50, vierde lid][ref2], geeft Onze Minister een beschikking tot
      vaststelling van de uitkering. De [artikelen 4:46][ref3], [4:49][ref4], [4:52][ref5], [4:56][ref6] en
      [4:57 van de Algemene wet bestuursrecht][ref7] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007133#Artikel50
      [ref2]: https://wetten.overheid.nl/BWBR0007133#Artikel50
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref6]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref7]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0007133
        artikel: '50'
        hoofdstuk: VI
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0007133
        artikel: '50'
        hoofdstuk: VI
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref5
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref6
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref7
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '56'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld ten aanzien van de inrichting en de wijze
      van indiening van aanvragen, het beleidsplan, het activiteitenplan, het projectplan, de begroting, de
      liquiditeitsprognose, de administratie, de jaarrekening, de subsidiedeclaratie, verslagen, de verantwoording en de
      verklaring van de accountant.
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel56
  - number: '57'
    text: |-
      Onze Minister kan, gelet op het belang dat dit besluit beoogt te beschermen, artikelen buiten toepassing laten of
      daarvan afwijken voor zover strikte toepassing leidt tot een onbillijkheid van overwegende aard.
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel57
  - number: '58'
    text: |-
      De houder van een bejaardenpension die in 1994 van Onze Minister subsidie heeft ontvangen ten behoeve van
      de duurzame huisvesting en verzorging van zorgbehoevende personen, wordt voor de toepassing van dit besluit
      gelijkgesteld met een instelling.
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel58
  - number: '61'
    text: Dit besluit treedt in werking met ingang van 1 januari 1995.
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel61
  - number: '62'
    text: 'Dit besluit wordt aangehaald als: Bekostigingsbesluit welzijnsbeleid.'
    url: https://wetten.overheid.nl/BWBR0007133/2002-09-25#Artikel62
