    text: |-
      Ten aanzien van de kilowattuurmeters, bedoeld in [artikel 2, tweede lid, onder a, 3°][ref1], die niet zijn
      aangesloten op meettransformatoren en waarvan door degenen, die in de uitoefening van een bedrijf elektrische
      energie, bij een spanning, niet groter dan 600 V, aan verbruikers daarvan verstrekken, op plaatsen, gebruikt of
      mede gebruikt tot dat verstrekken, ter bepaling van hoeveelheden energie bij vorenbedoelde spanning gebruik wordt
      gemaakt, gelden de [artikelen 2][ref2] tot en met [23 van het IJkreglement][ref3] en de verbodsbepalingen van
      [artikel 2, tweede lid][ref4].


