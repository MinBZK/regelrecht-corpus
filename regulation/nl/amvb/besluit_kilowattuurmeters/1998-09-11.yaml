  - number: '3'
    text: |-
      Het bepaalde in [artikel 2][ref1] is niet van toepassing met betrekking tot kilowattuurmeters die op het
      tijdstip van inwerkingtreding van het koninklijk besluit van 5 februari 1970, houdende toepassing van de
      [artikelen 6][ref2], vijfde lid, 7, derde lid, onder b, 8, derde lid, [20][ref3], derde lid, [21][ref4], tweede
      lid, en [27, derde lid, van de IJkwet][ref5] ten aanzien van kilowattuurmeters (Stb. 33), reeds in de handel zijn
      gebracht en voldoen aan de voor kilowattuurmeters krachtens [artikel 2, tweede lid, van het IJkreglement][ref6]
      door de Minister van Economische Zaken gegeven voorschriften omtrent de meeteigenschappen bij het onderzoek,
      bedoeld in artikel 16 van de wet.


