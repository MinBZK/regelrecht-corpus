  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Economische Zaken van 28 juli 1997, nr. 97047448 WJA/W;

    Gelet op de artikelen 6, vijfde lid, 7, derde lid, onder b, 8, derde lid, 9, eerste lid, 11, 13, 16, tweede lid,
    19, 20, derde lid, en 21, tweede lid, van de IJkwet;

    De Raad van State gehoord (advies van 15 augustus 1997, nr. W10.97.0514);

    Gezien het nader rapport van Onze Minister van Economische Zaken van 25 november 1997, nr. 97070628 WJA/W;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0009068/1998-09-11#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Voor het bij of krachtens dit besluit bepaalde wordt verstaan onder:

      a. kilowattuurmeters: de éénfasewisselstroom- en de draaistroommeters, ingericht voor het meten van elektrische
      energie bij een spanning, niet groter dan 600 V;

      b. inductiekilowattuurmeters: de kilowattuurmeters, waarvan de werking berust op het beginsel van inductie, met
      uitzondering van de overschrijdingsmeters, de meters met maximumaanwijzing en de meters, ingericht om te worden
      aangesloten op meettransformatoren;

      c. statische kilowattuurmeters: de kilowattuurmeters, die hoofdzakelijk zijn opgebouwd uit elektronische
      componenten, met uitzondering van de meters, die blijkens een daarop aangebrachte aanduiding uitsluitend bestemd
      zijn om te worden aangesloten op meettransformatoren;

      d. de wet: de [IJkwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009082
    url: https://wetten.overheid.nl/BWBR0009068/1998-09-11#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009082
  - number: '2'
    text: |-
      1 Het is degenen, die in de uitoefening van een bedrijf elektrische energie bij een spanning, niet groter dan
      600 V, aan verbruikers daarvan verstrekken, verboden op plaatsen, gebruikt of mede gebruikt tot dat verstrekken,
      te bezitten:

      a. andere dan met de wet of de ter uitvoering daarvan genomen koninklijke besluiten overeenkomstige
      inductiekilowattuurmeters of statische kilowattuurmeters;

      b. aan keuring of herkeuring onderworpen inductiekilowattuurmeters of statische kilowattuurmeters, welke van een
      afkeuringsmerk of welke niet van de vereiste ijkmerken zijn voorzien.

      2 Het is degenen, die in de uitoefening van een bedrijf elektrische energie bij een spanning, niet groter dan 600
      V, aan verbruikers daarvan verstrekken, verboden op plaatsen, gebruikt of mede gebruikt tot dat verstrekken, ter
      bepaling van hoeveelheden energie bij vorenbedoelde spanning gebruik te maken van:

      a. andere voorwerpen dan:

      1°. met de wet of de ter uitvoering daarvan genomen koninklijke besluiten overeenkomstige inductiekilowattuurmeters
      of statische kilowattuurmeters, of

      2°. kilowattuurmeters, waarvan de werking berust op het beginsel van inductie, voor zover het betreft
      overschrijdingsmeters, meters met maximumaanwijzing of meters, ingericht om te worden aangesloten op
      meettransformatoren, of

      3°. kilowattuurmeters, die hoofdzakelijk zijn opgebouwd uit elektronische componenten, voor zover het betreft
      meters, die blijkens een daarop aangebrachte aanduiding uitsluitend bestemd zijn om te worden aangesloten op
      meettransformatoren;

      b. inductiekilowattuurmeters of statische kilowattuurmeters in strijd met de voorschriften, gegeven krachtens het
      bepaalde in het zesde lid van artikel 6 van de wet;

      c. inductiekilowattuurmeters of statische kilowattuurmeters ten aanzien waarvan de daarvoor ingevolge de wet of de
      ter uitvoering daarvan genomen koninklijke besluiten voorgeschreven keuring of herkeuring niet heeft plaatsgehad;

      d. inductiekilowattuurmeters of statische kilowattuurmeters, welke van een afkeuringsmerk zijn voorzien of welke
      niet van de vereiste ijkmerken zijn voorzien;

      e. inductiekilowattuurmeters of statische kilowattuurmeters in strijd met het bepaalde in artikel 11, vierde lid,
      onder b, of artikel 16, tweede lid, van de wet;

      f. inductiekilowattuurmeters of statische kilowattuurmeters, die bij een onderzoek door toezichthouders ingevolge
      [artikel 5:18 van de Algemene wet bestuursrecht][ref1] niet aan de daarvoor bij of krachtens artikel 6 van de wet
      gegeven voorschriften blijken te voldoen doch niet van een afkeuringsmerk als in artikel 29c van de wet bedoeld
      zijn voorzien, voor zover die kilowattuurmeters nadien niet alsnog zijn goedgekeurd;

      g. inductiekilowattuurmeters of statische kilowattuurmeters, die bij de herkeuring niet zijn goedgekeurd en daarbij
      ingevolge het krachtens artikel 14, vierde lid, van de wet bepaalde niet van een afkeuringsmerk zijn voorzien, voor
      zover die kilowattuurmeters nadien niet alsnog zijn goedgekeurd.

      3 Als meetinstrumenten, ten aanzien waarvan artikel 19 van de wet geldt, worden aangewezen de
      inductiekilowattuurmeters en de statische kilowattuurmeters.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel518
