    text: |-
      Na de inwerkingtreding van dit besluit berusten de krachtens het koninklijk besluit van 5 februari 1970, houdende
      toepassing van de [artikelen 6][ref1], vijfde lid, 7, derde lid, onder b, 8, derde lid, [20][ref2], derde lid,
      [21][ref3], tweede lid, en [27, derde lid, van de IJkwet][ref4] ten aanzien van kilowattuurmeters (Stb. 33),
      vastgestelde regels en andere besluiten op dit besluit.


