$id: besluit_financiering_rechtspraak_2005
regulatory_layer: AMVB
publication_date: '2005-02-10'
valid_from: '2005-02-11'
bwb_id: BWBR0017975
url: https://wetten.overheid.nl/BWBR0017975/2005-02-11
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Justitie van 7 december 2004, Directie Wetgeving, nr. 5323045/04/06;

    Gelet op de artikelen 97, eerste lid, en 98, vierde lid, van de Wet op de rechterlijke organisatie;

    De Raad van State gehoord (advies van 6 januari 2005, nr. W03.04.0591/I);

    Gezien het nader rapport van Onze Minister van Justitie van 21 januari 2005, Directie Wetgeving nr. 5331152/05/6;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel1
  - number: 1.a
    text: |-
      wet: de [Wet op de rechterlijke organisatie][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001830
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001830
  - number: 1.b
    text: 'zaak: een door een gerecht te behandelen of afgehandelde gerechtelijke procedure;'
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel1
  - number: 1.c
    text: 'productie: het totaal aantal behandelde of afgedane zaken;'
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel1
  - number: 1.d
    text: |-
      landelijke prijzen: de naar productgroep gedifferentieerde bedragen per zaak die worden gebruikt voor de
      vaststelling van de productiegerelateerde bijdrage aan de rechtspraak;
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel1
  - number: 1.e
    text: |-
      lokale prijzen: de naar productgroep en gerecht gedifferentieerde bedragen die worden gebruikt voor de vaststelling
      van de productiegerelateerde bijdrage aan een gerecht;
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel1
  - number: 1.f
    text: 'zaakscategorie: een deel van de productie dat binnen een gerechtscategorie op gelijksoortige wijze wordt behandeld;'
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel1
  - number: 1.g
    text: 'productgroep: een aantal samenhangende zaakscategorieën;'
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel1
  - number: 1.h
    text: 'gerechtscategorieën:'
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel1
  - number: 1.h.1°
    text: de rechtbanken;
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel1
  - number: 1.h.2°
    text: de gerechtshoven;
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel1
  - number: 1.h.3°
    text: het College van Beroep voor het bedrijfsleven;
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel1
  - number: 1.h.4°
    text: de Centrale Raad van Beroep.
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel1
  - number: '2.1'
    text: |-
      Er is een systeem van productiemeting voor de rechtspraak. Dit systeem houdt in het meten van het aantal behandelde
      of afgedane zaken per gerechtscategorie en daarbinnen per afzonderlijk gerecht.
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel2
  - number: '2.2'
    text: De meting gebeurt op het niveau van afzonderlijke zaakscategorieën, geclusterd in productgroepen.
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel2
  - number: '2.3'
    text: |-
      De Raad beheert de aan de indeling in productgroepen en zaakscategorieën ten grondslag liggende definities en
      modellen.
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel2
  - number: '2.4'
    text: |-
      Belangrijke wijzigingen in de indeling in productgroepen en zaakscategorieën, alsmede de onderliggende definities
      en modellen behoeven de instemming van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel2
  - number: '3.1'
    text: |-
      Er is een systeem van prijsmeting voor de rechtspraak. Dit systeem houdt in het toerekenen van kosten aan
      aantallen behandelde of afgedane zaken voor alle gerechten gezamenlijk en daaruit eenduidig afgeleid de gerechten
      afzonderlijk.
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel3
  - number: '3.2'
    text: De meting gebeurt op het niveau van de afzonderlijke productgroepen.
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel3
  - number: '3.3'
    text: De Raad beheert de aan de prijsmeting ten grondslag liggende definities en modellen.
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel3
  - number: '3.4'
    text: Belangrijke wijzigingen in de definities en modellen behoeven de instemming van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel3
  - number: '4.1'
    text: |-
      Er is een werklastmetingssysteem voor de rechtspraak. Dit systeem houdt in het meten van de werklast van het
      personeel bij de gerechten gemoeid met de productie door middel van periodieke tijdschrijfonderzoeken.
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel4
  - number: '4.2'
    text: De meting gebeurt op het niveau van de afzonderlijke zaakscategorieën.
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel4
  - number: '4.3'
    text: De Raad beheert de aan de werklastmeting ten grondslag liggende methode van periodieke tijdschrijfonderzoeken.
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel4
  - number: '4.4'
    text: |-
      De Raad doet de opzet van de tijdschrijfonderzoeken alsmede de wijze waarop de onderzoeken worden uitgevoerd
      toetsen door een externe, onafhankelijke deskundige.
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel4
  - number: '5.1'
    text: |-
      De Raad houdt aanvullend op de tijdschrijfonderzoeken in het kader van de werklastmeting periodiek vergelijkende
      onderzoeken naar gerealiseerde prijsverschillen tussen gerechten.
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel5
  - number: '5.2'
    text: |-
      Op verzoek van Onze Minister dan wel eigener beweging houdt de Raad gerichte diepteonderzoeken naar specifieke
      elementen van de gerealiseerde prijs per zaak.
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel5
  - number: '6.1'
    text: |-
      De Raad stelt een commissie in die de Raad adviseert over wijzigingen in de productie-, prijs- en
      werklastmetingssystemen alsmede de opzet van de vergelijkende en diepteonderzoeken, bedoeld in de
      [artikelen 2 tot en met 5][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017975#Artikel2
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0017975
        artikel: '2'
        hoofdstuk: '2'
  - number: '6.2'
    text: De commissie bestaat uit vertegenwoordigers van de gerechten.
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel6
  - number: '6.3'
    text: Een vertegenwoordiger van het Ministerie van Justitie neemt als waarnemer deel aan de overleggen van de commissie.
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel6
  - number: '7.1'
    text: |-
      De Raad en de gerechten ontwikkelen en beheren een kwaliteitssysteem. Aan de hand van het systeem wordt de
      kwaliteit van de rechterlijke organisatie en meer in het bijzonder het rechterlijke functioneren gemeten.
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel7
  - number: '7.2'
    text: De Raad doet de opzet van het kwaliteitssysteem toetsen door een externe, onafhankelijke deskundige.
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel7
  - number: '8.1'
    text: |-
      Onze Minister ontwikkelt en beheert een prognosemodel voor de instroom van zaken. Het model heeft als doel tot
      objectief gefundeerde uitspraken te komen over de te verwachten instroom van zaken bij de gerechten.
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel8
  - number: '8.2'
    text: De ontwikkeling en het beheer van het prognosemodel gebeuren in overleg met de Raad.
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel8
  - number: '8.3'
    text: Onze Minister doet de opzet van het prognosemodel toetsen door een externe, onafhankelijke deskundige.
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel8
  - number: '9'
    text: |-
      De jaarlijks aan de Raad toe te kennen bijdrage ten behoeve van de activiteiten van de Raad en de gerechten
      gezamenlijk is gelijk aan het bedrag dat ten behoeve van de Raad is opgenomen in de voor het desbetreffende
      begrotingsjaar vastgestelde begroting van het Ministerie van Justitie.
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel9
  - number: '10'
    text: 'De aan de Raad toe te kennen bijdrage bestaat uit de volgende onderdelen:'
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel10
  - number: 10.a
    text: een productiegerelateerde bijdrage;
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel10
  - number: 10.b
    text: een bijdrage voor gerechtskosten;
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel10
  - number: 10.c
    text: een bijdrage voor overige uitgaven.
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel10
  - number: '11'
    text: |-
      De productiegerelateerde bijdrage wordt bepaald door de voor het desbetreffende jaar geldende landelijke prijzen te
      vermenigvuldigen met het aantal in de begroting van het Ministerie van Justitie opgenomen zaken per productgroep.
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel11
  - number: '12.1'
    text: |-
      De landelijke prijzen worden voor drie opeenvolgende jaren vastgesteld en opgenomen in de begroting van het
      Ministerie van Justitie.
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel12
  - number: '12.2'
    text: 'De prijzen zijn gebaseerd op:'
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel12
  - number: 12.2.a
    text: de in het verleden gerealiseerde prijs per productgroep;
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel12
  - number: 12.2.b
    text: veranderingen in de verhouding van de aantallen zaken per zaakscategorie binnen de productgroep;
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel12
  - number: 12.2.c
    text: |-
      de uitkomsten van de werklastmeting, bedoeld in [artikel 4][ref1], en de aanvullende onderzoeken, bedoeld in
      [artikel 5][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0017975#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0017975#Artikel5
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0017975
        artikel: '4'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0017975
        artikel: '5'
        hoofdstuk: '2'
  - number: 12.2.d
    text: |-
      overwegingen van kwaliteit op basis van informatie uit het kwaliteitssysteem, bedoeld in [artikel 7][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0017975#Artikel7
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0017975
        artikel: '7'
        hoofdstuk: '2'
  - number: 12.2.e
    text: overwegingen van doelmatigheid.
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel12
  - number: '12.3'
    text: Jaarlijks worden de prijzen aangepast in verband met algemene loon- en prijsontwikkelingen.
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel12
  - number: '13.1'
    text: |-
      De Raad baseert in zijn begrotingsvoorstel voor het uitvoeringsjaar en de vier daaropvolgende jaren de raming van
      het aantal zaken per productgroep op de verwachte instroom van zaken in het begrotingsjaar, de werkvoorraad aan het
      begin van het uitvoeringsjaar en de gewenste werkvoorraad aan het eind van het jaar.
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel13
  - number: '13.2'
    text: |-
      De Raad hanteert het prognosemodel, bedoeld in [artikel 8][ref1], voor de raming van de verwachte instroom van
      zaken. Indien hij voor zijn begrotingsvoorstel afwijkt van door het prognosemodel gegenereerde gegevens, worden de
      redenen daarvoor opgenomen in het voorstel.


      [ref1]: https://wetten.overheid.nl/BWBR0017975#Artikel8
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0017975
        artikel: '8'
        hoofdstuk: '2'
  - number: '13.3'
    text: |-
      De Raad corrigeert, in voorkomend geval, de raming van de verwachte instroom voor de effecten van wijzigingen in
      het systeem van de rechtspraak.
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel13
  - number: '14.1'
    text: |-
      De bijdrage voor gerechtskosten wordt bepaald door de gerechtskosten per zaak te vermenigvuldigen met het aantal in
      de begroting van het Ministerie van Justitie opgenomen civiele en bestuursrechtelijke zaken.
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel14
  - number: '14.2'
    text: |-
      Onder gerechtskosten per zaak wordt verstaan: de gerealiseerde gerechtskosten in civiele en bestuursrechtelijke
      zaken in het meest recente aan het begrotingsjaar voorafgaande jaar gedeeld door het aantal afgehandelde civiele en
      bestuursrechtelijke zaken in het desbetreffende begrotingsjaar.
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel14
  - number: '14.3'
    text: |-
      Indien het in het eerste lid bedoelde bedrag niet toereikend is, stelt Onze Minister aanvullende financiële
      middelen ter beschikking van de Raad teneinde de met de gerechtskosten gemoeide uitgaven van de gerechten te
      bekostigen.
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel14
  - number: '15.1'
    text: |-
      De bijdrage voor overige uitgaven is gelijk aan het bedrag dat hiervoor is opgenomen in de begroting van het
      Ministerie van Justitie.
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel15
  - number: '15.2'
    text: |-
      De Raad neemt in zijn begrotingsvoorstel een plan op met daarin een raming van de overige uitgaven voor
      het desbetreffende begrotingsjaar, een omschrijving van de activiteiten en de daarmee nagestreefde concrete
      doelstellingen.
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel15
  - number: '15.3'
    text: In de raming worden incidentele en structurele kosten zichtbaar gemaakt.
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel15
  - number: '16'
    text: |-
      De door Onze Minister aan de jaarlijkse bijdragetoekenning te verbinden voorschriften kunnen slechts betrekking
      hebben op:
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel16
  - number: 16.a
    text: de door de gerechten gezamenlijk te realiseren zaaksaantallen per productgroep;
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel16
  - number: 16.b
    text: |-
      te realiseren doelstellingen zoals opgenomen in het in [artikel 15][ref1] bedoelde plan;


      [ref1]: https://wetten.overheid.nl/BWBR0017975#Artikel15
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0017975
        artikel: '15'
        hoofdstuk: '3'
        afdeling: '2'
  - number: 16.c
    text: het realiseren van in arbeidsvoorwaardenoverleg gemaakte afspraken.
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel16
  - number: '17.1'
    text: |-
      Het eigen vermogen van de rechtspraak wordt bepaald door de som te nemen van de eigen vermogens van de gerechten
      en onder de Raad ressorterende diensten, bedoeld in de [artikelen 36][ref1] en [39, tweede lid][ref2], en het eigen
      vermogen van de Raad zelf, bedoeld in [artikel 18][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0017975#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0017975#Artikel39
      [ref3]: https://wetten.overheid.nl/BWBR0017975#Artikel18
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0017975
        artikel: '36'
        hoofdstuk: '4'
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0017975
        artikel: '39'
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0017975
        artikel: '18'
        hoofdstuk: '3'
        afdeling: '4'
  - number: '17.2'
    text: 'In de balans kunnen onder het eigen vermogen van de rechtspraak slechts worden opgenomen:'
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel17
  - number: 17.2.a
    text: een exploitatiereserve;
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel17
  - number: 17.2.b
    text: |-
      een verplichte reserve, dat wil zeggen een reserve als bedoeld in
      [artikel 2:365 BW, tweede lid, in samenhang met het eerste lid, onderdeel b, van dat artikel][ref1] en
      [artikel 2:390 BW][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel365
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel390
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '365'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '390'
  - number: 17.2.c
    text: het onverdeelde resultaat.
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel17
  - number: '17.3'
    text: |-
      Het totaal van de exploitatiereserve en het onverdeeld resultaat van de rechtspraak bedraagt ten hoogste 5% van de
      gemiddelde jaarlijkse baten van de rechtspraak, berekend over de laatste drie jaar.
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel17
  - number: '17.4'
    text: Het eigen vermogen van de rechtspraak is minimaal nul.
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel17
  - number: '17.5'
    text: |-
      Een positief exploitatieresultaat van de rechtspraak komt tot de in het derde lid bedoelde grens ten goede aan de
      exploitatiereserve van de rechtspraak. Het meerdere keert de Raad uit aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel17
  - number: '17.6'
    text: |-
      Een negatief exploitatieresultaat van de rechtspraak komt ten laste van de exploitatiereserve van de rechtspraak.
      In het uitzonderlijke geval dat dit leidt tot een negatief vermogen wordt dit aangezuiverd door Onze Minister en
      vindt overleg plaats over te nemen maatregelen als bedoeld in [artikel 21][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017975#Artikel21
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0017975
        artikel: '21'
        hoofdstuk: '3'
        afdeling: '4'
  - number: '17.7'
    text: |-
      Voor het tegen een financiële vergoeding verrichten van activiteiten die niet in een wettelijke regeling aan de
      rechtspraak zijn opgedragen voor anderen dan Onze Minister, behoeft de Raad de instemming van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel17
  - number: '18.1'
    text: |-
      De Raad heeft een eigen vermogen bestaande uit een exploitatiereserve, een verplichte reserve en het onverdeeld
      resultaat.
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel18
  - number: '18.2'
    text: |-
      De exploitatiereserve van de Raad is bestemd om risico’s in de bedrijfsvoering van de rechtspraak als geheel op
      te vangen.
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel18
  - number: '18.3'
    text: |-
      Onze Minister kan met inachtneming van [artikel 17, derde lid][ref1], om niet een toevoeging doen aan de
      exploitatiereserve van de Raad ten einde het eigen vermogen van de Raad te versterken.


      [ref1]: https://wetten.overheid.nl/BWBR0017975#Artikel17
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0017975
        artikel: '17'
        hoofdstuk: '3'
        afdeling: '4'
  - number: '18.4'
    text: |-
      Het is de Raad niet toegestaan bijdragen in de vorm van een lening te aanvaarden van anderen dan Onze Minister van
      Financiën. Bijdragen van anderen worden toegevoegd aan de exploitatiereserve van de Raad.
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel18
  - number: '19.1'
    text: De Raad beheert een egalisatierekening voor de rechtspraak.
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel19
  - number: '19.2'
    text: De egalisatierekening is bestemd om verschillen tussen de overeengekomen en gerealiseerde productie te verrekenen.
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel19
  - number: '19.3'
    text: De egalisatierekening maakt deel uit van de balans van de Raad.
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel19
  - number: '19.4'
    text: |-
      De gelden op de egalisatierekening worden zonder rente aangehouden op een rekening-courant bij de
      Rijkshoofdboekhouding van het Ministerie van Financiën.
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel19
  - number: '19.5'
    text: |-
      Een positieve verrekening ten laste van de egalisatierekening kan niet meer zijn dan het totaal beschikbare bedrag
      op de rekening
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel19
  - number: '20.1'
    text: |-
      De aan de Raad ingevolge [artikel 11][ref1] toegekende productiegerelateerde bijdrage wordt verhoogd dan wel
      verlaagd indien de gerechten meer dan wel minder zaken per productgroep hebben afgedaan dan in de begroting van het
      Ministerie van Justitie was opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0017975#Artikel11
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0017975
        artikel: '11'
        hoofdstuk: '3'
        afdeling: '2'
  - number: '20.2'
    text: |-
      Het bedrag van de verhoging dan wel verlaging wordt bepaald door het aantal zaken per productgroep dat meer dan
      wel minder is afgedaan te vermenigvuldigen met een prijs die gelijk is aan 70% van de voor het desbetreffende jaar
      geldende prijs per productgroep.
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel20
  - number: '20.3'
    text: |-
      Een in het eerste lid bedoelde verhoging van de productiegerelateerde bijdrage wordt tot de in
      [artikel 17, derde lid][ref1], bedoelde grens als bate opgenomen in de staat van baten en lasten van de Raad
      en de gerechten en komt ten laste van de egalisatierekening van de rechtspraak. Is de verhoging groter, dan
      wordt voor het meerdere de egalisatierekening niet belast. De verhoging is maximaal het bedrag, bedoeld in
      [artikel 19, vijfde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0017975#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0017975#Artikel19
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0017975
        artikel: '17'
        hoofdstuk: '3'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0017975
        artikel: '19'
        hoofdstuk: '3'
        afdeling: '4'
  - number: '20.4'
    text: |-
      Een in het eerste lid bedoelde verlaging van de productiegerelateerde bijdrage wordt als last opgenomen in de staat
      van baten en lasten van de Raad en de gerechten en komt ten goede aan de egalisatierekening van de rechtspraak.
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel20
  - number: '21'
    text: |-
      Bij een dreigend exploitatieverlies dat leidt tot een negatief vermogen van de rechtspraak, een exploitatiewinst
      die uitkomt komen boven de in [artikel 17, derde lid][ref1], bedoelde grens dan wel een ingrijpende wijziging
      van omstandigheden met aantoonbare gevolgen voor de productie, overleggen Onze Minister en de Raad over te nemen
      maatregelen en passen zo nodig, onverminderd [artikel 17, vijfde lid, tweede volzin][ref2], de productieaantallen
      van de rechtspraak en de landelijke prijzen aan.


      [ref1]: https://wetten.overheid.nl/BWBR0017975#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0017975#Artikel17
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0017975
        artikel: '17'
        hoofdstuk: '3'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0017975
        artikel: '17'
        hoofdstuk: '3'
        afdeling: '4'
  - number: '22.1'
    text: |-
      De Raad verstrekt Onze Minister de voor de uitoefening van zijn taak met betrekking tot de financiering van de
      rechtspraak benodigde informatie. Daartoe behoren in elk geval:
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel22
  - number: 22.1.a
    text: |-
      gegevens over de productiegerelateerde bijdrage, gerechtskosten en overige uitgaven als bedoeld in de
      [artikelen 11][ref1], [14, eerste lid][ref2], en [15, tweede en derde lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0017975#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0017975#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0017975#Artikel15
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0017975
        artikel: '11'
        hoofdstuk: '3'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0017975
        artikel: '14'
        hoofdstuk: '3'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0017975
        artikel: '15'
        hoofdstuk: '3'
        afdeling: '2'
  - number: 22.1.b
    text: |-
      prijsgegevens, waaronder de uitkomsten van de werklastmeting en vergelijkende en diepteonderzoeken, en gegevens
      over de kwaliteit als genoemd in [artikel 12, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017975#Artikel12
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0017975
        artikel: '12'
        hoofdstuk: '3'
        afdeling: '2'
  - number: 22.1.c
    text: |-
      gegevens over zaaksaantallen, de instroom van zaken en werkvoorraden genoemd in [artikel 13][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017975#Artikel13
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0017975
        artikel: '13'
        hoofdstuk: '3'
        afdeling: '2'
  - number: 22.1.d
    text: |-
      balansgegevens waaronder gegevens over het eigen vermogen en de egalisatierekening als bedoeld in de
      [artikelen 17 tot en met 19][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017975#Artikel17
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0017975
        artikel: '17'
        hoofdstuk: '3'
        afdeling: '4'
  - number: '22.2'
    text: |-
      Onze Minister en de Raad maken in een informatieprotocol nadere afspraken over de ten behoeve van de financiering
      te verstrekken informatie.
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel22
  - number: '23'
    text: |-
      De Raad splitst de in [artikel 11][ref1] bedoelde productiegerelateerde bijdrage van Onze Minister in de volgende
      delen:


      [ref1]: https://wetten.overheid.nl/BWBR0017975#Artikel11
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0017975
        artikel: '11'
        hoofdstuk: '3'
        afdeling: '2'
  - number: 23.a
    text: een productiegerelateerde bijdrage voor de gerechten;
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel23
  - number: 23.b
    text: een bijdrage aan de gerechten voor huisvesting;
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel23
  - number: 23.c
    text: een bijdrage aan de gerechten voor specifieke uitgaven;
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel23
  - number: 23.d
    text: centraal door de Raad te beheren uitgaven.
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel23
  - number: '24'
    text: |-
      De Raad splitst de in [artikel 15][ref1] bedoelde bijdrage van Onze Minister voor overige uitgaven in de volgende
      delen:


      [ref1]: https://wetten.overheid.nl/BWBR0017975#Artikel15
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0017975
        artikel: '15'
        hoofdstuk: '3'
        afdeling: '2'
  - number: 24.a
    text: een bijdrage aan de gerechten voor overige uitgaven;
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel24
  - number: 24.b
    text: centraal door de Raad te beheren overige uitgaven.
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel24
  - number: '25'
    text: 'De door de Raad aan het gerecht toe te kennen bijdrage bestaat uit de volgende onderdelen:'
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel25
  - number: 25.a
    text: een productiegerelateerde bijdrage;
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel25
  - number: 25.b
    text: een bijdrage voor gerechtskosten;
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel25
  - number: 25.c
    text: een bijdrage voor huisvesting;
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel25
  - number: 25.d
    text: een bijdrage voor specifieke uitgaven;
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel25
  - number: 25.e
    text: een bijdrage voor overige uitgaven.
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel25
  - number: '26.1'
    text: |-
      De Raad bepaalt de productiegerelateerde bijdrage aan het gerecht door de voor het desbetreffende jaar geldende
      lokale prijzen te vermenigvuldigen met de met het gerecht overeengekomen aantal zaken per productgroep.
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel26
  - number: '26.2'
    text: |-
      Onder het in het eerste lid bedoelde overeengekomen aantal zaken wordt verstaan het aantal af te handelen zaken van
      het gerecht zelf vermeerderd met het aantal af te handelen zaken als nevenzittingsplaats voor een ander gerecht,
      verminderd met het aantal af te handelen zaken die in een nevenzittingsplaats buiten het eigen rechtsgebied worden
      afgehandeld.
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel26
  - number: '27.1'
    text: De Raad stelt de lokale prijzen vast.
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel27
  - number: '27.2'
    text: |-
      De Raad kan de prijzen voor de afzonderlijke gerechten verschillend vaststellen op grond van de uitkomsten van de
      werklastmeting en de vergelijkende onderzoeken, bedoeld in de [artikelen 4][ref1] en [5][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0017975#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0017975#Artikel5
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0017975
        artikel: '4'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0017975
        artikel: '5'
        hoofdstuk: '2'
  - number: '27.3'
    text: |-
      De in het tweede lid bedoelde differentiatie in de prijzen kan alleen betrekking hebben op factoren die de
      gerechten niet kunnen beïnvloeden.
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel27
  - number: '28.1'
    text: |-
      De Raad verdeelt het bedrag van de in [artikel 10, onder b][ref1], bedoelde component gerechtskosten over de
      gerechten overeenkomstig het aantal civiele en bestuursrechtelijke zaken dat in het begrotingsjaar zal worden
      afgehandeld.


      [ref1]: https://wetten.overheid.nl/BWBR0017975#Artikel10
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0017975
        artikel: '10'
        hoofdstuk: '3'
        afdeling: '1'
  - number: '28.2'
    text: |-
      Op verzoek van het bestuur van een gerecht stelt de Raad aanvullende financiële middelen ter beschikking teneinde
      de met de gerechtskosten in civiele en bestuursrechterlijke zaken gemoeide uitgaven van het desbetreffende gerecht
      te bekostigen.
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel28
  - number: '29'
    text: |-
      De Raad verdeelt het bedrag van de in [artikel 23, onder b][ref1], bedoelde component huisvesting over de gerechten
      op grond van ramingen van de gerechten ter zake.


      [ref1]: https://wetten.overheid.nl/BWBR0017975#Artikel23
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0017975
        artikel: '23'
        hoofdstuk: '4'
        afdeling: '1'
  - number: '30.1'
    text: |-
      Het bestuur van een gerecht kan de Raad verzoeken om toekenning van aanvullende financiële middelen ten behoeve
      van specifiek omschreven activiteiten die zijn gericht op de verbetering van de organisatie of de werkwijze van het
      gerecht, of op bevordering van de juridische kwaliteit.
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel30
  - number: '30.2'
    text: 'Het verzoek gaat in elk geval vergezeld van:'
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel30
  - number: 30.2.a
    text: een projectplan, en
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel30
  - number: 30.2.b
    text: een begroting, tenzij deze voor de berekening van het bedrag niet van belang is.
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel30
  - number: '30.3'
    text: |-
      Door de Raad toegekende verzoeken komen ten laste van de in [artikel 23, onder c][ref1], bedoelde component
      specifieke uitgaven.


      [ref1]: https://wetten.overheid.nl/BWBR0017975#Artikel23
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0017975
        artikel: '23'
        hoofdstuk: '4'
        afdeling: '1'
  - number: '31'
    text: |-
      De Raad verdeelt het bedrag van de in [artikel 24, onder a][ref1], bedoelde component overige uitgaven over de
      gerechten op grond van ramingen van de gerechten ter zake.


      [ref1]: https://wetten.overheid.nl/BWBR0017975#Artikel24
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0017975
        artikel: '24'
        hoofdstuk: '4'
        afdeling: '1'
  - number: '32'
    text: |-
      De aan de toekenning van de jaarlijkse bijdrage door de Raad te verbinden voorschriften kunnen slechts betrekking
      hebben op de in het desbetreffende jaar:
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel32
  - number: 32.a
    text: te realiseren zaaksaantallen, onderscheiden naar zaakscategorie;
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel32
  - number: 32.b
    text: |-
      met de in de [artikelen 25, onder c, d en e][ref1], bedoelde bijdragen te realiseren doelen;


      [ref1]: https://wetten.overheid.nl/BWBR0017975#Artikel25
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0017975
        artikel: '25'
        hoofdstuk: '4'
        afdeling: '2'
  - number: 32.c
    text: het realiseren van in arbeidsvoorwaardenoverleg gemaakte afspraken.
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel32
  - number: '33'
    text: |-
      Het bestuur van het gerecht is verplicht medewerking te verlenen aan de metingen en onderzoeken, bedoeld in de
      [artikelen 2 tot en met 5][ref1] en [7][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0017975#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0017975#Artikel7
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0017975
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0017975
        artikel: '7'
        hoofdstuk: '2'
  - number: '34'
    text: |-
      Het bestuur van het gerecht kan de ingevolge [artikel 28][ref1] aan het gerecht toegekende bijdrage voor
      gerechtskosten in civiele en bestuursrechtelijke zaken uitsluitend voor deze kosten aanwenden.


      [ref1]: https://wetten.overheid.nl/BWBR0017975#Artikel28
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0017975
        artikel: '28'
        hoofdstuk: '4'
        afdeling: '2'
  - number: '35'
    text: 'Het bestuur van het gerecht verstrekt aan de Raad:'
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel35
  - number: 35.a
    text: |-
      de in [artikel 22, eerste lid][ref1], genoemde gegevens;


      [ref1]: https://wetten.overheid.nl/BWBR0017975#Artikel22
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0017975
        artikel: '22'
        hoofdstuk: '3'
        afdeling: '5'
  - number: 35.b
    text: |-
      de gegevens die de Raad nodig heeft om aan de afspraken in het in [artikel 22, tweede lid][ref1], bedoelde
      informatieprotocol te voldoen;


      [ref1]: https://wetten.overheid.nl/BWBR0017975#Artikel22
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0017975
        artikel: '22'
        hoofdstuk: '3'
        afdeling: '5'
  - number: 35.c
    text: |-
      informatie over aantallen en categorieën van af te handelen zaken van het gerecht en aantallen en categorieën van
      af te handelen zaken als nevenzittingsplaats voor een ander gerecht, alsmede aantallen en categorieën van zaken die
      in een nevenzittingsplaats buiten het rechtsgebied worden behandeld.
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel35
  - number: '36.1'
    text: |-
      Het gerecht heeft een eigen vermogen bestaande uit een exploitatiereserve, een verplichte reserve en het onverdeeld
      resultaat.
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel36
  - number: '36.2'
    text: De exploitatiereserve is bestemd om risico’s in de bedrijfsvoering van het gerecht op te vangen.
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel36
  - number: '36.3'
    text: |-
      Het totaal van de exploitatiereserve en het onverdeeld resultaat van het gerecht bedraagt ten hoogste 5% van de
      gemiddelde jaarlijkse baten, berekend over de laatste drie jaar.
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel36
  - number: '36.4'
    text: Het eigen vermogen van het gerecht is minimaal nul.
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel36
  - number: '36.5'
    text: |-
      De Raad kan met inachtneming van het bepaalde in het derde lid om niet een toevoeging doen aan de
      exploitatiereserve van het gerecht ten einde het eigen vermogen van het gerecht te versterken.
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel36
  - number: '36.6'
    text: |-
      Het is het gerecht niet toegestaan bijdragen in de vorm van een lening te aanvaarden van anderen dan Onze Minister
      van Financiën. Aanvragen worden ingediend via de Raad. Bijdragen van anderen leiden altijd tot een toevoeging aan
      de exploitatiereserve van het gerecht.
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel36
  - number: '36.7'
    text: |-
      Een positief exploitatieresultaat van het gerecht komt tot de in het derde lid bedoelde grens ten goede aan de
      exploitatiereserve. Het meerdere wordt toegevoegd aan het vermogen van de Raad.
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel36
  - number: '36.8'
    text: |-
      Een negatief exploitatieresultaat van het gerecht komt ten laste van het exploitatiereserve. In het uitzonderlijke
      geval dat dit leidt tot een negatief vermogen wordt dit aangezuiverd door de Raad en vindt overleg plaats over te
      nemen maatregelen als bedoeld in [artikel 38][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017975#Artikel38
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0017975
        artikel: '38'
        hoofdstuk: '4'
        afdeling: '5'
  - number: '36.9'
    text: |-
      Voor het tegen een financiële vergoeding verrichten van activiteiten die niet in een wettelijke regeling aan het
      gerecht zijn opgedragen voor anderen dan de rechtspraak zelf of Onze Minister, behoeft het bestuur van het gerecht
      de instemming van de Raad.
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel36
  - number: '37.1'
    text: |-
      De aan het gerecht ingevolge [artikel 26][ref1] toegekende productiegerelateerde bijdrage wordt verhoogd dan wel
      verlaagd, indien het gerecht meer dan wel minder zaken per productgroep heeft afgedaan dan met de Raad voor dat
      jaar is overeengekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0017975#Artikel26
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0017975
        artikel: '26'
        hoofdstuk: '4'
        afdeling: '2'
  - number: '37.2'
    text: |-
      Het bedrag van de verhoging dan wel verlaging wordt bepaald door het aantal zaken per productgroep dat meer dan
      wel minder is afgedaan te vermenigvuldigen met een prijs die gelijk is aan 70% van het voor het desbetreffende jaar
      geldende gemiddelde van de prijs per productgroep, die de Raad voor de afzonderlijke gerechten hanteert.
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel37
  - number: '37.3'
    text: |-
      Een in het tweede lid bedoelde verhoging van de productiegerelateerde bijdrage wordt als bate opgenomen in de
      staat van baten en lasten en komt ten laste van de in [artikel 19][ref1] bedoelde egalisatierekening van de
      rechtspraak. Indien voor de rechtspraak sprake is van een verrekening die hoger ligt dan het bedrag dat op grond
      van [artikel 19, vijfde lid][ref2], beschikbaar is, bedraagt de verhoging voor elk afzonderlijk gerecht een aan de
      krachtens het tweede lid berekende verhogingen evenredig deel van het beschikbare bedrag op de egalisatierekening.


      [ref1]: https://wetten.overheid.nl/BWBR0017975#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0017975#Artikel19
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0017975
        artikel: '19'
        hoofdstuk: '3'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0017975
        artikel: '19'
        hoofdstuk: '3'
        afdeling: '4'
  - number: '37.4'
    text: |-
      Een in het tweede lid bedoelde verlaging van de productiegerelateerde bijdrage wordt als last opgenomen in de staat
      van baten en lasten van het gerecht en komt ten goede aan de egalisatierekening van de rechtspraak.
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel37
  - number: '38'
    text: |-
      Bij een dreigend exploitatieverlies dat leidt tot een negatief vermogen voor een gerecht, een exploitatiewinst
      die uitkomt boven de in [artikel 36, derde lid][ref1], bedoelde grens dan wel bij een ingrijpende wijziging van
      omstandigheden met aantoonbare gevolgen voor de productie, overlegt de Raad met het betreffende gerecht over te
      nemen maatregelen en passen zij zonodig, onverminderd [artikel 36, zevende lid, tweede volzin][ref2], de gemaakte
      afspraken over productieaantallen en de lokale prijzen aan.


      [ref1]: https://wetten.overheid.nl/BWBR0017975#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0017975#Artikel36
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0017975
        artikel: '36'
        hoofdstuk: '4'
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0017975
        artikel: '36'
        hoofdstuk: '4'
        afdeling: '5'
  - number: '39.1'
    text: |-
      Het met ingang van het jaar 2005 door de Raad, de gerechten en onder de Raad ressorterende diensten toe te passen
      begrotingsstelsel is het baten-lastenstelsel.
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel39
  - number: '39.2'
    text: 'Voor de Raad, de gerechten en onder de Raad ressorterende diensten zijn van overeenkomstige toepassing:'
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel39
  - number: 39.2.a
    text: hoofdstuk 6 van de Regeling departementale begrotingsadministratie 1997;
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel39
  - number: 39.2.b
    text: |-
      de Regeling leen- en depositofaciliteiten agentschappen 2003, met dien verstande dat de Raad mede ten behoeve van
      de gerechten en de onder de Raad ressorterende diensten aanvragen doet.
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel39
  - number: '40'
    text: |-
      Voor onder de Raad ressorterende diensten is [artikel 36][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0017975#Artikel36
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0017975
        artikel: '36'
        hoofdstuk: '4'
        afdeling: '5'
  - number: '41'
    text: De door de gerechten te maken gerechtskosten in strafzaken komen ten laste van het College van procureurs-generaal.
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel41
  - number: '42.1'
    text: |-
      Onze Minister geeft jaarlijks aan de Raad aan welke andere regels in acht moeten worden genomen bij de
      voorbereiding en de inrichting van het begrotingsvoorstel van de Raad.
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel42
  - number: '42.2'
    text: |-
      Onze Minister en de Raad maken in een begrotingsprotocol nadere afspraken over de in de begrotingsvoorbereiding,
      begrotingsuitvoering en begrotingsverantwoording te volgen werkwijze.
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel42
  - number: '43'
    text: |-
      Het [Besluit financiering rechtspraak][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0013886
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0013886
  - number: '46.1'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin het wordt
      geplaatst en werkt terug tot en met 1 februari 2004.
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel46
  - number: '46.2'
    text: |-
      Op de financiering van de rechtspraak in het jaar 2004 blijft het [Besluit financiering rechtspraak][ref1] van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013886
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0013886
  - number: '46.3'
    text: |-
      Voor het opstellen van een openingsbalans per 1 januari 2005 zijn de artikelen 2 en 3 van de regeling
      Vermogensvoorschriften baten-lastendiensten 2001 van overeenkomstige toepassing voor de Raad, de gerechten en onder
      de Raad ressorterende diensten.
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel46
  - number: '46.4'
    text: |-
      De in [artikel 17, derde lid][ref1], en [artikel 36, derde lid][ref2], bedoelde grens van 5% wordt voor het jaar
      2006 berekend aan de hand van de baten 2005. Voor het jaar 2007 aan de hand van de gemiddelde jaarlijkse baten van
      2005 en 2006.


      [ref1]: https://wetten.overheid.nl/BWBR0017975#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0017975#Artikel36
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0017975
        artikel: '17'
        hoofdstuk: '3'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0017975
        artikel: '36'
        hoofdstuk: '4'
        afdeling: '5'
  - number: '47'
    text: 'Dit besluit wordt aangehaald als: Besluit financiering rechtspraak 2005.'
    url: https://wetten.overheid.nl/BWBR0017975/2005-02-11#Artikel47
