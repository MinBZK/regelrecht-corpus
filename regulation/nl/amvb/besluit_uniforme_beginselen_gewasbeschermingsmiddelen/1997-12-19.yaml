articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. wet: [Bestrijdingsmiddelenwet 1962][ref1];

      b. richtlijn: [richtlijn nr. 91/414/EEG](31991L0414) van de Raad van de Europese Gemeenschappen van 15 juli 1991
      betreffende het op de markt brengen van gewasbeschermingsmiddelen (*PbEG* L 230);

      c. omzettingsprodukten: relevante metabolieten, afbraak- of reactieprodukten.


      [ref1]: https://wetten.overheid.nl/BWBR0002380
    url: https://wetten.overheid.nl/BWBR0007323/1997-12-19#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002380
  - number: '2'
    text: |-
      1 Met betrekking tot de toelatingscriteria, bedoeld in artikel 3, eerste lid, onderdeel *a*, van de wet worden voor
      gewasbeschermingsmiddelen die werkzame stoffen bevatten die bij de in artikel 3, tweede lid, onderdeel *a*, van
      de wet bedoelde communautaire maatregel zijn aangewezen of die niet reeds vóór 26 juli 1993 werden afgeleverd als
      nadere regelen en als beginselen voor de beoordeling vastgesteld de uniforme beginselen als opgenomen in Bijlage VI
      bij de richtlijn, met uitzondering van Onderdeel A, Inleiding, onder 2*a*, 4 en 5, en Onderdeel C, Besluitvorming,
      onder 2.6. en 2.7.

      2 Dit besluit is niet van toepassing op:

      a. gewasbeschermingsmiddelen als bedoeld in artikel 1, vijfde lid, van de wet, en

      b. andere dan chemische gewasbeschermingsmiddelen.

      3 Op een wijziging van Bijlage VI bij de richtlijn is artikel 1, zesde lid, van de wet van overeenkomstige
      toepassing.
    url: https://wetten.overheid.nl/BWBR0007323/1997-12-19#Artikel2
  - number: '4'
    text: |-
      1 Bij regeling van Onze Minister van Landbouw, Natuurbeheer en Visserij, Onze Minister van Volksgezondheid, Welzijn
      en Sport, Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer of Onze Minister van Sociale
      Zaken en Werkgelegenheid kunnen voor de uitvoering van dit besluit nadere regels worden gesteld die onder meer
      betrekking kunnen hebben op:

      a. de omschrijving van begrippen;

      b. de bepaling van berekeningsmethoden;

      c. de bepaling van waarden of effecten;

      d. de toetsing van uitkomsten aan waarden of gestelde normen;

      e. te verrichten proeven.

      2 De regeling wordt vastgesteld overeenkomstig de in artikel 3*a*, tweede lid, onderdelen *a* tot en met *d*, van
      de wet aangegeven wijze.
    url: https://wetten.overheid.nl/BWBR0007323/1997-12-19#Artikel4
  - number: '6'
    text: Dit besluit treedt in werking met ingang van 1 september 1995.
    url: https://wetten.overheid.nl/BWBR0007323/1997-12-19#Artikel6
  - number: '7'
    text: 'Dit besluit wordt aangehaald als: Besluit uniforme beginselen gewasbeschermingsmiddelen.'
    url: https://wetten.overheid.nl/BWBR0007323/1997-12-19#Artikel7
