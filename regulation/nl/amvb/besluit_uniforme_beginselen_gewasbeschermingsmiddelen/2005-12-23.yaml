articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. wet: [Bestrijdingsmiddelenwet 1962][ref1];

      b. richtlijn: [richtlijn nr. 91/414/EEG](31991L0414) van de Raad van de Europese Gemeenschappen van 15 juli 1991
      betreffende het op de markt brengen van gewasbeschermingsmiddelen (*PbEG* L 230).


      [ref1]: https://wetten.overheid.nl/BWBR0002380
    url: https://wetten.overheid.nl/BWBR0007323/2005-12-23#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002380
  - number: '2'
    text: |-
      1 Bij de beoordeling van de toelaatbaarheid van gewasbeschermingsmiddelen, zoals bedoeld in
      [artikel 3, eerste lid, onderdeel a, van de wet][ref1], maakt het college gebruik van de uniforme beginselen, zoals
      vastgesteld in bijlage VI bij de richtlijn.

      2 Op een wijziging van Bijlage VI bij de richtlijn is [artikel 1, zesde lid, van de wet][ref2] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002380#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002380#Artikel1
    url: https://wetten.overheid.nl/BWBR0007323/2005-12-23#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002380
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0002380
        artikel: '1'
  - number: '3'
    text: |-
      Bij regeling van Onze Minister van Landbouw, Natuur en Voedselkwaliteit, Onze Minister van Volksgezondheid,
      Welzijn en Sport, Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer of Onze Minister
      van Sociale Zaken en Werkgelegenheid kunnen voor de uitvoering van dit besluit overeenkomstig de in
      [artikel 3a, tweede lid, onderdelen a tot en met d, van de wet][ref1] vastgestelde wijze, nadere regels worden
      gesteld:

      a. voor de uitwerking van de uniforme beginselen, of

      b. met het oog op de nationaal specifieke agrarische, fytosanitaire, of ecologische, waaronder klimatologische,
      omstandigheden.


      [ref1]: https://wetten.overheid.nl/BWBR0002380#Artikel3a
    url: https://wetten.overheid.nl/BWBR0007323/2005-12-23#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002380
        artikel: 3a
  - number: '6'
    text: Dit besluit treedt in werking met ingang van 1 september 1995.
    url: https://wetten.overheid.nl/BWBR0007323/2005-12-23#Artikel6
  - number: '7'
    text: 'Dit besluit wordt aangehaald als: Besluit uniforme beginselen gewasbeschermingsmiddelen.'
    url: https://wetten.overheid.nl/BWBR0007323/2005-12-23#Artikel7
