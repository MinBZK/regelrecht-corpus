  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Landbouw, Natuurbeheer en Visserij van 25 oktober 1994, No. J. 9416
    843, Directie Juridische en Bedrijfsorganisatorische Zaken, gedaan in overeenstemming met Onze Minister van
