    Unie van 27 juli 1994 tot vaststelling van Bijlage VI bij Richtlijn 91/414/EEG betreffende het op de markt brengen
    van gewasbeschermingsmiddelen (PbEG L 227) en op artikel 3a, eerste en tweede lid, van de Bestrijdingsmiddelenwet
    1962;

    De Raad van State gehoord (advies van 11 januari 1995, no. W11.94.0656);

    Gezien het nader rapport van Onze Minister van Landbouw, Natuurbeheer en Visserij van 27 maart 1995, No. J. 95 892,
