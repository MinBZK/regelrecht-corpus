$id: besluit_etikettering_en_bijsluiter_farmaceutische_producten
regulatory_layer: AMVB
publication_date: '2007-03-20'
valid_from: '1998-03-18'
bwb_id: BWBR0006779
url: https://wetten.overheid.nl/BWBR0006779/1998-03-18
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Welzijn, Volksgezondheid en Cultuur van 8 oktober 1993, GMV/G 932896;

    Gelet op

    Gezien het advies van de Geneesmiddelencommissie, d.d. 10 februari 1993, nr. Geco 4772;

    De Raad van State gehoord (advies d.d. 8 maart 1994, no. W13.93.0669);

    Gezien het nader rapport van Onze Minister van Welzijn, Volksgezondheid en Cultuur van 16 juni 1994, GMV/G 941888;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0006779/1998-03-18#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0006779/1998-03-18#Artikel1
  - number: 1.1.a
    text: |-
      de wet: de [Wet op de Geneesmiddelenvoorziening][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002290
    url: https://wetten.overheid.nl/BWBR0006779/1998-03-18#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002290
  - number: 1.1.b
    text: 'farmaceutisch product: farmaceutische specialité of farmaceutisch preparaat;'
    url: https://wetten.overheid.nl/BWBR0006779/1998-03-18#Artikel1
  - number: 1.1.c
    text: 'primaire verpakking: verpakking die rechtstreeks met het farmaceutische product in aanraking komt;'
    url: https://wetten.overheid.nl/BWBR0006779/1998-03-18#Artikel1
  - number: 1.1.d
    text: 'stripverpakking: primaire verpakking in de vorm van'
    url: https://wetten.overheid.nl/BWBR0006779/1998-03-18#Artikel1
  - number: 1.1.d.1°
    text: een doordrukstrip,
    url: https://wetten.overheid.nl/BWBR0006779/1998-03-18#Artikel1
  - number: 1.1.d.2°
    text: een stripverpakking voor zetpillen; en
    url: https://wetten.overheid.nl/BWBR0006779/1998-03-18#Artikel1
  - number: 1.1.d.3°
    text: een stripverpakking die moet worden opengescheurd of -geknipt;
    url: https://wetten.overheid.nl/BWBR0006779/1998-03-18#Artikel1
  - number: 1.1.e
    text: 'buitenverpakking: verpakking waarin de primaire verpakking is geplaatst;'
    url: https://wetten.overheid.nl/BWBR0006779/1998-03-18#Artikel1
  - number: 1.1.f
    text: |-
      benaming van het farmaceutische product: de benaming waaronder het farmaceutische product is ingeschreven in
      een register als bedoeld in [artikel 3, eerste lid][ref1], van de wet; zij kan een fantasienaam, een algemene of
      wetenschappelijke benaming zijn, vergezeld van een merk of de naam van de fabrikant;


      [ref1]: https://wetten.overheid.nl/BWBR0006779#Artikel3
    url: https://wetten.overheid.nl/BWBR0006779/1998-03-18#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006779
        artikel: '3'
        paragraaf: '2'
  - number: 1.1.g
    text: |-
      algemene benaming: de door de Wereldgezondheidsorganisatie aanbevolen algemene internationale benaming of, bij het
      ontbreken daarvan, de algemeen gebruikelijke benaming;
    url: https://wetten.overheid.nl/BWBR0006779/1998-03-18#Artikel1
  - number: 1.1.h
    text: |-
      concentratie: het gehalte aan werkzame bestanddelen van een farmaceutisch product, uitgedrukt in hoeveelheid per
      doserings-, volume- of gewichtseenheid;
    url: https://wetten.overheid.nl/BWBR0006779/1998-03-18#Artikel1
  - number: 1.1.i
    text: 'excipiëntia: andere dan werkzame bestanddelen van een farmaceutisch product;'
    url: https://wetten.overheid.nl/BWBR0006779/1998-03-18#Artikel1
  - number: 1.1.j
    text: |-
      partijnummer van de fabrikant: code ter aanduiding van de charge, bedoeld in [artikel 1, onder ][ref1], van het
      Besluit bereiding en aflevering van farmaceutische producten;


      [ref1]: https://wetten.overheid.nl/BWBR0006779#Artikel1
    url: https://wetten.overheid.nl/BWBR0006779/1998-03-18#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006779
        artikel: '1'
        paragraaf: '1'
  - number: 1.1.k
    text: 'bijsluiter: geschrift met informatie ten behoeve van de gebruiker;'
    url: https://wetten.overheid.nl/BWBR0006779/1998-03-18#Artikel1
  - number: 1.1.l
    text: 'fabrikant: ieder aan wie'
    url: https://wetten.overheid.nl/BWBR0006779/1998-03-18#Artikel1
  - number: 1.1.l.1°
    text: |-
      krachtens [artikel 2][ref1], eerste lid, onder *d*, van de wet vergunning is verleend tot het bereiden van
      farmaceutische producten en het afleveren daarvan; alsmede


      [ref1]: https://wetten.overheid.nl/BWBR0002290#Artikel2
    url: https://wetten.overheid.nl/BWBR0006779/1998-03-18#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002290
        artikel: '2'
  - number: 1.1.l.2°
    text: |-
      ter uitvoering van artikel 16 van [Richtlijn 75/319/EEG](31975L0319) van de Raad van de Europese Gemeenschappen
      van 20 mei 1975 betreffende de aanpassing van de wettelijke en bestuursrechtelijke bepalingen inzake farmaceutische
      specialiteiten (*PbEG* L 147) door de bevoegde autoriteiten van een andere lid-staat vergunning voor de
      vervaardiging van farmaceutische producten is verleend;
    url: https://wetten.overheid.nl/BWBR0006779/1998-03-18#Artikel1
  - number: 1.1.m
    text: |-
      lid-staat: staat die lid is van de Europese Gemeenschappen of die partij is bij de Overeenkomst betreffende de
      Europese Economische Ruimte.
    url: https://wetten.overheid.nl/BWBR0006779/1998-03-18#Artikel1
  - number: '1.2'
    text: |-
      Dit besluit is niet van toepassing op farmaceutische producten als bedoeld in [artikel 3, zevende lid][ref1], van
      de wet.


      [ref1]: https://wetten.overheid.nl/BWBR0006779#Artikel3
    url: https://wetten.overheid.nl/BWBR0006779/1998-03-18#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006779
        artikel: '3'
        paragraaf: '2'
  - number: '2.1'
    text: |-
      Op de buitenverpakking en op de primaire verpakking, waarin een farmaceutisch product wordt afgeleverd zijn de
      volgende gegevens vermeld:
    url: https://wetten.overheid.nl/BWBR0006779/1998-03-18#Artikel2
  - number: 2.1.a
    text: de benaming van het farmaceutische product;
    url: https://wetten.overheid.nl/BWBR0006779/1998-03-18#Artikel2
  - number: 2.1.b
    text: |-
      de kwalitatieve en kwantitatieve samenstelling voor wat betreft werkzame bestanddelen van het farmaceutische
      product per doseringseenheid of, afhankelijk van de toedieningsvorm, voor een bepaald volume of gewicht, met
      gebruikmaking van de algemene benaming;
    url: https://wetten.overheid.nl/BWBR0006779/1998-03-18#Artikel2
  - number: 2.1.c
    text: |-
      de farmaceutische vorm van het farmaceutische product en de inhoud van de verpakking, uitgedrukt in gewicht, volume
      of doseringseenheden;
    url: https://wetten.overheid.nl/BWBR0006779/1998-03-18#Artikel2
  - number: 2.1.d
    text: |-
      een opgave van de in het farmaceutische product aanwezige excipiëntia met een algemeen bekende werking of een
      algemeen bekend effect, overeenkomstig bij ministeriële regeling nader te stellen regels;
    url: https://wetten.overheid.nl/BWBR0006779/1998-03-18#Artikel2
  - number: 2.1.e
    text: de wijze van gebruik en, zo nodig, de wijze van toediening van het farmaceutische product;
    url: https://wetten.overheid.nl/BWBR0006779/1998-03-18#Artikel2
  - number: 2.1.f
    text: een waarschuwing dat het farmaceutische product buiten het bereik van kinderen dient te worden bewaard;
    url: https://wetten.overheid.nl/BWBR0006779/1998-03-18#Artikel2
  - number: 2.1.g
    text: een speciale waarschuwing, indien deze voor het betrokken farmaceutische product noodzakelijk is;
    url: https://wetten.overheid.nl/BWBR0006779/1998-03-18#Artikel2
  - number: 2.1.h
    text: een begrijpelijke aanduiding van de uiterste gebruiksdatum (maand/jaar) van het farmaceutische product;
    url: https://wetten.overheid.nl/BWBR0006779/1998-03-18#Artikel2
  - number: 2.1.i
    text: zo nodig, bijzondere voorzorgsmaatregelen voor de bewaring van het farmaceutische product;
    url: https://wetten.overheid.nl/BWBR0006779/1998-03-18#Artikel2
  - number: 2.1.j
    text: |-
      zo nodig, bijzondere voorzorgsmaatregelen voor het verwijderen van niet gebruikte farmaceutische producten of
      afvalstoffen, afgeleid van die producten;
    url: https://wetten.overheid.nl/BWBR0006779/1998-03-18#Artikel2
  - number: 2.1.k
    text: de naam en de plaats van vestiging van de persoon die verantwoordelijk is voor het in de handel brengen;
    url: https://wetten.overheid.nl/BWBR0006779/1998-03-18#Artikel2
  - number: 2.1.l
    text: |-
      het nummer waaronder het farmaceutische product in een register als bedoeld in [artikel 3, eerste lid][ref1], van
      de wet is ingeschreven;


      [ref1]: https://wetten.overheid.nl/BWBR0006779#Artikel3
    url: https://wetten.overheid.nl/BWBR0006779/1998-03-18#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006779
        artikel: '3'
        paragraaf: '2'
  - number: 2.1.m
    text: het partijnummer van de fabrikant;
    url: https://wetten.overheid.nl/BWBR0006779/1998-03-18#Artikel2
  - number: 2.1.n
    text: |-
      in geval het een farmaceutisch product betreft ten aanzien waarvan [artikel 4, eerste of derde lid][ref1], van
      de wet toepassing heeft gevonden: "uitsluitend af te leveren in apotheken", onderscheidenlijk: "uitsluitend af te
      leveren op recept", dan wel "U.A." onderscheidenlijk "U.R.";


      [ref1]: https://wetten.overheid.nl/BWBR0006779#Artikel4
    url: https://wetten.overheid.nl/BWBR0006779/1998-03-18#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006779
        artikel: '4'
        paragraaf: '2'
  - number: 2.1.o
    text: |-
      een gebruiksaanwijzing, indien het een farmaceutisch product betreft ten aanzien waarvan
      [artikel 4, eerste of derde lid][ref1], van de wet geen toepassing heeft gevonden;


      [ref1]: https://wetten.overheid.nl/BWBR0006779#Artikel4
    url: https://wetten.overheid.nl/BWBR0006779/1998-03-18#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006779
        artikel: '4'
        paragraaf: '2'
  - number: 2.1.p
    text: de gegevens, bij ministeriële regeling voorgeschreven.
    url: https://wetten.overheid.nl/BWBR0006779/1998-03-18#Artikel2
  - number: '2.2'
    text: Bij gebruik van een fantasienaam als de benaming mag geen verwarring ontstaan met de algemene benaming.
    url: https://wetten.overheid.nl/BWBR0006779/1998-03-18#Artikel2
  - number: '3.1'
    text: |-
      Indien een farmaceutisch product slechts één werkzaam bestanddeel bevat en de benaming van dat product een
      fantasienaam is, wordt onmiddellijk bij die benaming op de buitenverpakking en op de primaire verpakking tevens de
      algemene benaming vermeld.
    url: https://wetten.overheid.nl/BWBR0006779/1998-03-18#Artikel3
  - number: '3.2'
    text: |-
      Indien een farmaceutisch product onder dezelfde benaming in meer dan één farmaceutische vorm of in verschillende
      concentraties in de handel wordt gebracht, wordt in de benaming tevens de farmaceutische vorm of concentratie
      aangegeven. In voorkomend geval wordt de aanduiding van de leeftijdsgroep tevens in de benaming opgenomen, indien
      het product voor gebruik door zodanige leeftijdsgroep bestemd is.
    url: https://wetten.overheid.nl/BWBR0006779/1998-03-18#Artikel3
  - number: '3.3'
    text: |-
      Indien een farmaceutisch product bestemd is voor inspuiting of voor plaatselijke applicatie of aanwending, dan wel
      voor toepassing in of aan het oog, worden in afwijking van [artikel 2, eerste lid, onder ][ref1], alle excipiëntia
      van dat product vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0006779#Artikel2
    url: https://wetten.overheid.nl/BWBR0006779/1998-03-18#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006779
        artikel: '2'
        paragraaf: '2'
  - number: '4'
    text: |-
      Op de buitenverpakking mogen tekens of pictogrammen worden aangebracht ter verduidelijking van de daarop te
      vermelden gegevens, alsmede andere gegevens worden vermeld, mits die gegevens in overeenstemming zijn met de
      ingevolge [artikel 9, vijfde lid, van het Besluit registratie geneesmiddelen][ref1] goedgekeurde samenvatting
      van de kenmerken van het farmaceutische product en bijdragen aan de gezondheidsvoorlichting, een en ander met
      uitzondering van vermeldingen ter aanprijzing van het farmaceutische product.


      [ref1]: https://wetten.overheid.nl/BWBR0003114#Artikel9
    url: https://wetten.overheid.nl/BWBR0006779/1998-03-18#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003114
        artikel: '9'
  - number: '5.1'
    text: |-
      In afwijking van [de artikelen 2][ref1] en [3][ref2] zijn, in geval het farmaceutische product wordt afgeleverd
      in een stripverpakking, voorzien van een buitenverpakking die voldoet aan de artikelen 2 en 3, op die primaire
      verpakking ten minste de volgende gegevens vermeld:


      [ref1]: https://wetten.overheid.nl/BWBR0006779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006779#Artikel3
    url: https://wetten.overheid.nl/BWBR0006779/1998-03-18#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0006779
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0006779
        artikel: '3'
        paragraaf: '2'
  - number: 5.1.a
    text: |-
      de benaming van het farmaceutische product, overeenkomstig [artikel 2, eerste lid, onder ][ref1], en
      [artikel 3, eerste en tweede lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0006779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006779#Artikel3
    url: https://wetten.overheid.nl/BWBR0006779/1998-03-18#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0006779
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0006779
        artikel: '3'
        paragraaf: '2'
  - number: 5.1.b
    text: |-
      de naam van degene op wiens naam het farmaceutische product in een register als bedoeld in
      [artikel 2, eerste lid, onder ][ref1], staat ingeschreven;


      [ref1]: https://wetten.overheid.nl/BWBR0006779#Artikel2
    url: https://wetten.overheid.nl/BWBR0006779/1998-03-18#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0006779
        artikel: '2'
        paragraaf: '2'
  - number: 5.1.c
    text: |-
      de uiterste gebruiksdatum als bedoeld in [artikel 2, eerste lid, onder ][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006779#Artikel2
    url: https://wetten.overheid.nl/BWBR0006779/1998-03-18#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0006779
        artikel: '2'
        paragraaf: '2'
  - number: 5.1.d
    text: het partijnummer van de fabrikant.
    url: https://wetten.overheid.nl/BWBR0006779/1998-03-18#Artikel5
  - number: '5.2'
    text: |-
      In afwijking van [de artikelen 2][ref1] en [3][ref2] zijn, in geval het farmaceutische product wordt afgeleverd in
      een primaire verpakking van zodanige omvang, dat daarop niet alle in die artikelen bedoelde gegevens kunnen worden
      vermeld, op die verpakking ten minste de volgende gegevens vermeld:


      [ref1]: https://wetten.overheid.nl/BWBR0006779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006779#Artikel3
    url: https://wetten.overheid.nl/BWBR0006779/1998-03-18#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0006779
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0006779
        artikel: '3'
        paragraaf: '2'
  - number: 5.2.a
    text: |-
      de benaming van het farmaceutische product, overeenkomstig [artikel 2, eerste lid, onder ][ref1], en
      [artikel 3, eerste en tweede lid][ref2], alsmede, zo nodig, de wijze van toediening van het farmaceutische product;


      [ref1]: https://wetten.overheid.nl/BWBR0006779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006779#Artikel3
    url: https://wetten.overheid.nl/BWBR0006779/1998-03-18#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0006779
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0006779
        artikel: '3'
        paragraaf: '2'
  - number: 5.2.b
    text: de wijze van gebruik van het farmaceutische product;
    url: https://wetten.overheid.nl/BWBR0006779/1998-03-18#Artikel5
  - number: 5.2.c
    text: |-
      de uiterste gebruikdatum als bedoeld in [artikel 2, eerste lid, onder ][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006779#Artikel2
    url: https://wetten.overheid.nl/BWBR0006779/1998-03-18#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0006779
        artikel: '2'
        paragraaf: '2'
  - number: 5.2.d
    text: het partijnummer van de fabrikant;
    url: https://wetten.overheid.nl/BWBR0006779/1998-03-18#Artikel5
  - number: 5.2.e
    text: de inhoud van de verpakking, uitgedrukt in gewicht, volume of eenheden.
    url: https://wetten.overheid.nl/BWBR0006779/1998-03-18#Artikel5
  - number: '6'
    text: |-
      De gegevens, bedoeld in [de artikelen 2][ref1] tot en met [5][ref2], zijn duidelijk leesbaar en onuitwisbaar
      vermeld en in begrijpelijke bewoordingen in de Nederlandse taal gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0006779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006779#Artikel5
    url: https://wetten.overheid.nl/BWBR0006779/1998-03-18#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0006779
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0006779
        artikel: '5'
        paragraaf: '2'
  - number: '7.1'
    text: |-
      In de verpakking van elk farmaceutisch product is een bijsluiter gevoegd, tenzij alle daarin op grond van dit
      artikel op te nemen informatie is aangebracht op de buitenverpakking of op de primaire verpakking.
    url: https://wetten.overheid.nl/BWBR0006779/1998-03-18#Artikel7
  - number: '7.2'
    text: |-
      De bijsluiter wordt opgesteld overeenkomstig de ingevolge
      [artikel 9, vijfde lid, van het Besluit registratie geneesmiddelen][ref1] goedgekeurde samenvatting van de
      kenmerken van het farmaceutische product.


      [ref1]: https://wetten.overheid.nl/BWBR0003114#Artikel9
    url: https://wetten.overheid.nl/BWBR0006779/1998-03-18#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0003114
        artikel: '9'
  - number: '7.3'
    text: 'De bijsluiter bevat in onderstaande volgorde de volgende gegevens:'
    url: https://wetten.overheid.nl/BWBR0006779/1998-03-18#Artikel7
  - number: 7.3.a
    text: 'ter identificatie van het farmaceutische product:'
    url: https://wetten.overheid.nl/BWBR0006779/1998-03-18#Artikel7
  - number: 7.3.a.1°
    text: |-
      de benaming van het farmaceutische product, overeenkomstig [artikel 2, eerste lid, onder ][ref1], en
      [artikel 3, eerste en tweede lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0006779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006779#Artikel3
    url: https://wetten.overheid.nl/BWBR0006779/1998-03-18#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0006779
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0006779
        artikel: '3'
        paragraaf: '2'
  - number: 7.3.a.2°
    text: |-
      de kwalitatieve samenstelling van het farmaceutische product voor wat betreft de werkzame bestanddelen en de
      excipiëntia, alsmede de kwantitatieve samenstelling van het farmaceutische product voor wat betreft de werkzame
      bestanddelen, met vermelding van de algemene benaming;
    url: https://wetten.overheid.nl/BWBR0006779/1998-03-18#Artikel7
  - number: 7.3.a.3°
    text: |-
      de farmaceutische vorm van het farmaceutische product en de inhoud van de verpakking, uitgedrukt in gewicht of
      volume, dan wel doseringseenheden;
    url: https://wetten.overheid.nl/BWBR0006779/1998-03-18#Artikel7
  - number: 7.3.a.4°
    text: de farmaco-therapeutische categorie of het soort werking, in voor de gebruiker begrijpelijke bewoordingen;
    url: https://wetten.overheid.nl/BWBR0006779/1998-03-18#Artikel7
  - number: 7.3.a.5°
    text: de naam en het adres van degene die verantwoordelijk is voor het in de handel brengen;
    url: https://wetten.overheid.nl/BWBR0006779/1998-03-18#Artikel7
  - number: 7.3.b
    text: de therapeutische indicaties;
    url: https://wetten.overheid.nl/BWBR0006779/1998-03-18#Artikel7
  - number: 7.3.c
    text: 'de informatie die noodzakelijk is voordat het farmaceutische product wordt gebruikt:'
    url: https://wetten.overheid.nl/BWBR0006779/1998-03-18#Artikel7
  - number: 7.3.c.1°
    text: contra-indicaties;
    url: https://wetten.overheid.nl/BWBR0006779/1998-03-18#Artikel7
  - number: 7.3.c.2°
    text: nodige voorzorgen bij gebruik;
    url: https://wetten.overheid.nl/BWBR0006779/1998-03-18#Artikel7
  - number: 7.3.c.3°
    text: |-
      interacties met andere geneesmiddelen en andere interacties, die de werking van het farmaceutische product kunnen
      beïnvloeden;
    url: https://wetten.overheid.nl/BWBR0006779/1998-03-18#Artikel7
  - number: 7.3.c.4°
    text: speciale waarschuwingen;
    url: https://wetten.overheid.nl/BWBR0006779/1998-03-18#Artikel7
  - number: 7.3.d
    text: 'de aanwijzingen die nodig en gebruikelijk zijn voor een goed gebruik, in het bijzonder:'
    url: https://wetten.overheid.nl/BWBR0006779/1998-03-18#Artikel7
  - number: 7.3.d.1°
    text: de dosering;
    url: https://wetten.overheid.nl/BWBR0006779/1998-03-18#Artikel7
  - number: 7.3.d.2°
    text: de wijze van gebruik en, zo nodig, de wijze van toediening;
    url: https://wetten.overheid.nl/BWBR0006779/1998-03-18#Artikel7
  - number: 7.3.d.3°
    text: |-
      de toedieningsfrequentie, waarbij zo nodig het tijdstip waarop het farmaceutische product kan of moet worden
      toegediend, nader wordt omschreven; en, in voorkomend geval, afhankelijk van de aard van het farmaceutische
      product:
    url: https://wetten.overheid.nl/BWBR0006779/1998-03-18#Artikel7
  - number: 7.3.d.4°
    text: de duur van de behandeling, indien hiervoor een beperking geldt;
    url: https://wetten.overheid.nl/BWBR0006779/1998-03-18#Artikel7
  - number: 7.3.d.5°
    text: te nemen maatregelen in geval van overdosering;
    url: https://wetten.overheid.nl/BWBR0006779/1998-03-18#Artikel7
  - number: 7.3.d.6°
    text: te nemen maatregelen indien een of meer doses niet zijn toegediend;
    url: https://wetten.overheid.nl/BWBR0006779/1998-03-18#Artikel7
  - number: 7.3.d.7°
    text: een aanduiding, indien nodig, inhoudende dat er ontwenningsverschijnselen kunnen optreden;
    url: https://wetten.overheid.nl/BWBR0006779/1998-03-18#Artikel7
  - number: 7.3.e
    text: |-
      een beschrijving van de bijwerkingen die kunnen optreden bij een normaal gebruik van het farmaceutische product en,
      in voorkomend geval, van de maatregelen die moeten worden getroffen;
    url: https://wetten.overheid.nl/BWBR0006779/1998-03-18#Artikel7
  - number: 7.3.f
    text: 'een verwijzing naar de uiterste gebruiksdatum op de verpakking met:'
    url: https://wetten.overheid.nl/BWBR0006779/1998-03-18#Artikel7
  - number: 7.3.f.1°
    text: een waarschuwing tegen overschrijding van die datum;
    url: https://wetten.overheid.nl/BWBR0006779/1998-03-18#Artikel7
  - number: 7.3.f.2°
    text: zo nodig, bijzondere voorzorgen in verband met de bewaring;
    url: https://wetten.overheid.nl/BWBR0006779/1998-03-18#Artikel7
  - number: 7.3.f.3°
    text: in voorkomend geval, een waarschuwing tegen bepaalde zichtbare tekenen van bederf;
    url: https://wetten.overheid.nl/BWBR0006779/1998-03-18#Artikel7
  - number: 7.3.g
    text: de datum waarop de bijsluiter voor het laatst is herzien.
    url: https://wetten.overheid.nl/BWBR0006779/1998-03-18#Artikel7
  - number: '7.4'
    text: Bij de in het derde lid, onderdeel *c*, bedoelde informatie
    url: https://wetten.overheid.nl/BWBR0006779/1998-03-18#Artikel7
  - number: 7.4.a
    text: wordt rekening gehouden met de bijzondere situatie van bepaalde gebruikersgroepen;
    url: https://wetten.overheid.nl/BWBR0006779/1998-03-18#Artikel7
  - number: 7.4.b
    text: |-
      worden, indien nodig, de mogelijke effecten van het gebruik op de rijvaardigheid of op het vermogen om machines te
      bedienen vermeld;
    url: https://wetten.overheid.nl/BWBR0006779/1998-03-18#Artikel7
  - number: 7.4.c
    text: |-
      worden de in het farmaceutische product aanwezige excipiëntia vermeld waarvan de kennis belangrijk is om het
      product doelmatig en veilig te kunnen gebruiken, overeenkomstig de ter zake bij ministeriële regeling nader te
      stellen regels.
    url: https://wetten.overheid.nl/BWBR0006779/1998-03-18#Artikel7
  - number: '7.5'
    text: |-
      De in het derde lid bedoelde gegevens zijn gemakkelijk leesbaar vermeld, zijn gesteld in de Nederlandse taal en
      opgesteld in voor de gebruiker duidelijke begrijpelijke bewoordingen.
    url: https://wetten.overheid.nl/BWBR0006779/1998-03-18#Artikel7
  - number: '7.6'
    text: |-
      [Artikel 4][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006779#Artikel4
    url: https://wetten.overheid.nl/BWBR0006779/1998-03-18#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0006779
        artikel: '4'
        paragraaf: '2'
  - number: '7.7'
    text: |-
      Naast de krachtens het derde lid te vermelden gegevens wordt in de bijsluiter de gebruiker uitdrukkelijk verzocht
      zijn arts of apotheker elke bijwerking mede te delen die niet in de bijsluiter wordt genoemd.
    url: https://wetten.overheid.nl/BWBR0006779/1998-03-18#Artikel7
  - number: '8'
    text: |-
      In bijzondere gevallen kan het College ter beoordeling van geneesmiddelen, bedoeld in
      [artikel 29, eerste lid][ref1], van de wet, met betrekking tot een farmaceutisch product ten aanzien waarvan
      [artikel 4, derde lid][ref2], van de wet toepassing heeft gevonden, ontheffing verlenen van [de artikelen 6][ref3]
      en [7, vijfde lid][ref4], ter zake van het gebruik van de Nederlandse taal, mits de gegevens zijn gesteld in de
      Engelse, Franse of Duitse taal.


      [ref1]: https://wetten.overheid.nl/BWBR0002290#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0002290#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0006779#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0006779#Artikel7
    url: https://wetten.overheid.nl/BWBR0006779/1998-03-18#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002290
        artikel: '29'
      - id: ref2
        bwb_id: BWBR0002290
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0006779
        artikel: '6'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0006779
        artikel: '7'
        paragraaf: '3'
  - number: '14'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het *Staatsblad* waarin het
      wordt geplaatst, met dien verstande dat farmaceutische producten die, onverminderd overige van toepassing zijnde
      wettelijke bepalingen, voldoen aan de ter zake van de etikettering en bijsluiter gestelde voorschriften zoals die
      golden voor de datum van inwerkingtreding van dit besluit, ook na die datum mogen worden afgeleverd totdat het in
      [artikel 3, tweede lid][ref1], van de wet bedoelde tijdvak van vijf jaren is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0006779#Artikel3
    url: https://wetten.overheid.nl/BWBR0006779/1998-03-18#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0006779
        artikel: '3'
        paragraaf: '2'
  - number: '15'
    text: 'Dit besluit wordt aangehaald als: Besluit etikettering en bijsluiter farmaceutische producten.'
    url: https://wetten.overheid.nl/BWBR0006779/1998-03-18#Artikel15
