articles:
  - number: '1'
    text: |-
      1 In dit besluit en de daarop rustende bepalingen wordt verstaan onder:

      a. LPG: een produkt, hoofdzakelijk bestaande uit propaan en propeen, met geringe hoeveelheden ethaan, butanen en
      butenen (handelspropaan), dan wel hoofdzakelijk bestaande uit butaan, buteen en isobutaan (handelsbutaan) alsmede
      mengsels van de genoemde produkten, voor zover de dampspanning bij 343 K (70°C) ten hoogste 3100 kPa (31 bar)
      bedraagt;

      b. LPG-tankstation: een inrichting, behorende tot een categorie die is aangewezen krachtens
      [artikel 1.1, derde lid, van de Wet milieubeheer][ref1], die dient tot het afleveren van LPG aan motorvoertuigen
      voor het wegverkeer, voor zover:

      1°. de doorzet van LPG meer bedraagt dan 50 m3 per jaar;

      2°. de bewaring van LPG niet meer bedraagt dan 80 m3;

      c. bevoegd gezag: het bestuursorgaan dat bevoegd is of zou zijn een vergunning krachtens
      [artikel 8.1 van de Wet milieubeheer][ref2] voor het LPG-tankstation te verlenen;

      d. objecten categorie I:

      1°. sporthallen en zwembaden;

      2°. winkels, voor zover zij niet onder categorie II vallen;

      3°. hotels, restaurants en kantoorgebouwen, voor zover zij niet onder categorie II vallen;

      4°. bedrijfsgebouwen, voor zover zij niet onder categorie II vallen, alsmede incidentele dienst- of
      bedrijfswoningen die op industrieterreinen voorkomen, met een gemiddelde dichtheid aan dienst- of bedrijfswoningen
      van ten hoogste één per hectare;

      5°. speeltuinen, sportvelden, openluchtzwembaden en andere recreatieterreinen, voor zover deze recreatieterreinen
      niet onder categorie II vallen;

      e. objecten categorie II:

      1°. bejaardenoorden, verpleeginrichtingen, ziekenhuizen en sanatoria, zwakzinnigeninrichtingen en psychiatrische
      ziekenhuizen, gezinsvervangende tehuizen;

      2°. scholen;

      3°. complexen, waarin meer dan 5 winkels zijn gevestigd en waarvan het gezamenlijk vloeroppervlak meer dan 1000 m²
      bedraagt, en winkels met een totaal vloeroppervlak van meer dan 2000 m² per object;

      4°. hotels, restaurants en kantoorgebouwen, bestemd voor meer dan 50 personen per object;

      5°. telefooncentrales, gebouwen met vluchtleidingsapparatuur, elektriciteitscentrales, hoofdschakelstations van
      de hoofdspoorweginfrastructuur, bedoeld in de [Spoorwegwet][ref3], en andere kwetsbare objecten met een hoge
      infrastructurele waarde;

      6°. installaties en bovengrondse opslagtanks voor brandbare, explosieve of giftige stoffen alsmede plaatsen ten
      behoeve van de bewaring van gasflessen waarvan de gezamenlijke inhoud meer dan 2500 liter (waterinhoud) bedraagt;

      7°. campings, bestemd voor het verblijf van meer dan 50 personen, volkstuincomplexen, waarop meer dan 25
      tuinhuisjes, mede bestemd voor het verblijf van personen, aanwezig zijn en andere recreatieterreinen, bestemd voor
      het verblijf gedurende meerdere aaneengesloten dagen van het jaar van meer dan 50 personen;

      f. woning: de verblijfsruimten van een gebouw of deel van een gebouw dat voor bewoning gebruikt wordt of daartoe
      is bestemd;

      g. circulaire: circulaire "Sanering bestaande LPG-stations", uitgegeven door het Ministerie van Volkshuisvesting,
      Ruimtelijke Ordening en Milieubeheer, april 1985.

      2 Dit besluit is niet van toepassing op een LPG-tankstation:

      a. waarbij de afstand van het reservoir, gerekend vanaf de aansluitpunten van de leidingen alsmede het bovengrondse
      deel van de leidingen en de pomp bij het reservoir, of het vulpunt tot een woning van derden of een object
      categorie II, minder bedraagt dan 15 m;

      b. waarbij de afstand van het vulpunt tot een woning van derden of een object categorie II meer dan 15 m en minder
      dan 20 m bedraagt en waarbij door het treffen van een voorziening als bedoeld in voorschrift 4.6.5 van de bij
      dit besluit behorende [bijlage I][ref4] niet voldaan kan worden aan het in dat voorschrift, onder *c*, genoemde
      afstandscriterium;

      c. waarbij de afstand van het reservoir, gerekend vanaf de aansluitpunten van de leidingen alsmede het
      bovengrondse deel van de leidingen en de pomp bij het reservoir, of het vulpunt tot een woning van derden of
      een object categorie II meer dan 15 m en minder dan 20 m bedraagt en waarbij niet voldaan kan worden aan de
      afstanden tot objecten binnen de inrichting, die volgens de voorschriften onder 4 van de bij dit besluit behorende
      [bijlage I][ref5] aangehouden dienen te worden;

      d. dat zodanig is ingericht dat het vulpunt van het reservoir niet bereikbaar is voor een tankwagen, waarvan de
      inhoud ten minste 20 m3 bedraagt.


