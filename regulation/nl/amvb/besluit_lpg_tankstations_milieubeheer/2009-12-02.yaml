      3 In een geval als bedoeld in het tweede lid, geeft degene die een LPG-tankstation drijft, ten minste vier weken
      voor het in dat lid bedoelde tijdstip het bevoegd gezag, het districtshoofd en het districtshoofd van de Dienst
      voor het Stoomwezen ervan kennis dat hij het LPG-tankstation in werking heeft.

      4 Bij een kennisgeving als bedoeld in het derde lid worden de gegevens verstrekt, die in de bij dit besluit
      behorende [bijlage II][ref2] zijn aangegeven. De kennisgeving wordt gedaan op een formulier waarvan het model
      wordt vastgesteld door Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer. Onze Minister kan
      daarbij nadere regels stellen met betrekking tot de in [bijlage II][ref3] bedoelde gegevens.

      5 Een kennisgeving is niet vereist, indien voor het LPG-tankstation een kennisgeving als bedoeld in artikel 1*a*
      van het Hinderbesluit (*Stb.* 1980, 445) is gedaan, met gebruikmaking van het meldingsformulier vermeld in bijlage
      2 van de circulaire.


