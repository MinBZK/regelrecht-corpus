  - number: '2'
    text: |-
      Degene die een LPG-tankstation drijft, dient, behalve aan de voorschriften die aan de vergunning zijn verbonden,
      te voldoen aan de voorschriften die zijn opgenomen in de bij dit besluit behorende [bijlage I][ref1], alsmede
      aan de krachtens deze voorschriften door het bevoegd gezag gestelde nadere eisen. De voorschriften, opgenomen
      in [bijlage I][ref2], zijn niet van toepassing op drukapparatuur, samenstellen en druksystemen waarop het
      [Warenwetbesluit drukapparatuur](onbekend) van toepassing is, voorzover de voorschriften betrekking hebben op het
      ontwerp, de vervaardiging, de overeenstemmingsbeoordeling, de keuring voor ingebruikneming en de herkeuring bedoeld
      in dat besluit.


