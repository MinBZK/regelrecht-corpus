  - number: 18c.4
    text: |-
      Het instituut verstrekt de informatie, bedoeld in het derde lid, door aan het laboratorium, bedoeld in het eerste
      lid, tweede volzin, indien een deskundige van dat laboratorium het verslag, bedoeld in het eerste lid, heeft
      opgesteld. Het eerste en tweede lid zijn op dat laboratorium van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel18c
  - number: '19'
    text: Het Besluit DNA-onderzoeken wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel19
  - number: '20'
    text: |-
      Dit besluit treedt in werking op het tijdstip waarop de wet van 5 juli 2001 tot wijziging van de regeling van het
      DNA-onderzoek in strafzaken (Stb. 2001, 335) in werking treedt.
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel20
  - number: '21'
    text: 'Dit besluit wordt aangehaald als: Besluit DNA-onderzoek in strafzaken.'
