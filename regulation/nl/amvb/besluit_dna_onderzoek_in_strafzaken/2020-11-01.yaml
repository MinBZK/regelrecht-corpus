      misdrijf waarop naar de wettelijke omschrijving een gevangenisstraf van minder dan zes jaar is gesteld, en in het
      kader van het misdrijf het DNA-profiel is verwerkt,


      [ref1]: https://wetten.overheid.nl/BWBR0012791#Artikel1
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel18a
