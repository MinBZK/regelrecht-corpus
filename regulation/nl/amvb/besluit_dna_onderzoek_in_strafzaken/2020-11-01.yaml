  - number: 18c.3
    text: |-
      De Justitiële Informatiedienst verstrekt de informatie die deze dienst ingevolge artikel 8 van het Besluit
      identiteitsvaststelling verdachten en veroordeelden van het openbaar ministerie heeft verkregen, aan het instituut,
      voor zover die informatie nodig is om te kunnen voldoen aan [artikel 18, eerste tot en met vierde lid][ref1], en
      [artikel 18a, eerste lid, onder a tot en met c en e, en tweede lid][ref2]. Het openbaar ministerie verstrekt het
      instituut de informatie die nodig is om te kunnen voldoen aan artikel 18, vijfde lid, artikel 18a, eerste lid,
      onder d, en [artikel 18b][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0012791#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0012791#Artikel18a
      [ref3]: https://wetten.overheid.nl/BWBR0012791#Artikel18b
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel18c
