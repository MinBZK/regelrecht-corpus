  - number: 18a.1.e
    text: terstond na het overlijden van betrokkene.
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel18a
  - number: 18a.2
    text: |-
      De in het eerste lid, onder a, b en c, genoemde termijnen belopen zes, tien, respectievelijk twintig jaar indien
      de gewezen verdachte ten tijde van het begaan van het feit waarop de rechterlijke uitspraak betrekking heeft de
      leeftijd van achttien jaar nog niet had bereikt.
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel18a
  - number: 18b.1
    text: 'Het instituut vernietigt het DNA-profiel van een overleden slachtoffer:'
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel18b
  - number: 18b.1.a
    text: |-
      twaalf jaar na vastlegging in de DNA-databank indien betrokkene is overleden als gevolg van of is betrokken bij een
      misdrijf waarop naar de wettelijke omschrijving een gevangenisstraf van minder dan zes jaar is gesteld,
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel18b
  - number: 18b.1.b
    text: |-
      twintig jaar na vastlegging in de DNA-databank indien betrokkene is overleden als gevolg van of is betrokken bij
      een misdrijf waarop naar de wettelijke omschrijving een gevangenisstraf van zes jaar of meer is gesteld, dan wel
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel18b
  - number: 18b.1.c
    text: |-
      tachtig jaar na vastlegging in de DNA-databank indien betrokkene is overleden als gevolg van of betrokken is bij
      een misdrijf dat op grond van artikel 70, tweede lid, van het Wetboek van Strafrecht niet aan verjaring onderhevig
      is.
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel18b
  - number: 18b.2
    text: |-
      Het instituut vernietigt het DNA-profiel van een vermist persoon overeenkomstig de termijnen, genoemd in het eerste
      lid, of zodra de persoon niet langer vermist is.
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel18b
  - number: 18b.3
    text: |-
      Het instituut vernietigt het DNA-profiel van een onbekende verdachte overeenkomstig de termijnen, genoemd in het
      eerste lid.
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel18b
  - number: 18b.4
    text: |-
      Indien het een DNA-profiel van een overleden slachtoffer of een onbekende verdachte als bedoeld in
      [artikel 14, zevende lid][ref1], betreft, vangt het tijdstip waarop dat DNA-profiel overeenkomstig de termijnen,
      bedoeld in het eerste lid, dient te worden vernietigd aan op de dag van ontvangst van de aanvraag van het DNA-
      onderzoek in het kader waarvan het DNA-profiel in het dossier over de strafzaak is vastgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0012791#Artikel14
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel18b
    references:
      - id: ref1
        bwb_id: BWBR0012791
        artikel: '14'
        paragraaf: '4'
  - number: 18c.1
    text: |-
      Het instituut vernietigt met het DNA-profiel van een persoon, bedoeld in [artikel 18][ref1], [18a][ref2]
      of [18b][ref3], tevens terstond de gegevens over hem, bedoeld in [artikel 6, eerste lid][ref4], het
      celmateriaal waaruit dat DNA-profiel is verkregen, alsmede het afschrift van het verslag, bedoeld in
      [artikel 10, eerste lid][ref5], indien het verslag is opgesteld door een deskundige die aan het laboratorium
      van het instituut is verbonden, en de andere gegevens die het instituut over hem heeft bewaard in het dossier
      over de strafzaak in het kader waarvan zijn DNA-profiel in de DNA-databank is bewaard. De eerste volzin is van
      overeenkomstige toepassing op een ander laboratorium dan het laboratorium van het instituut indien het verslag is
      opgesteld door een deskundige van dat andere laboratorium.


      [ref1]: https://wetten.overheid.nl/BWBR0012791#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0012791#Artikel18a
      [ref3]: https://wetten.overheid.nl/BWBR0012791#Artikel18b
      [ref4]: https://wetten.overheid.nl/BWBR0012791#Artikel6
      [ref5]: https://wetten.overheid.nl/BWBR0012791#Artikel10
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel18c
