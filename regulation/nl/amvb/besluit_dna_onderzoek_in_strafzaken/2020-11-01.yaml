    text: |-
      wanneer naar het oordeel van de officier van justitie vaststaat dat herziening ten nadele op grond van
      [artikel 482a, eerste lid, aanhef en onder a][ref1], van de wet uitgesloten is, dan wel


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel482a
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel18a
