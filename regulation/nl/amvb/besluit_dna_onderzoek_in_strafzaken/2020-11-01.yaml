  - number: '3.4'
    text: |-
      [Artikel 2, negende lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0012791#Artikel2
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel3
