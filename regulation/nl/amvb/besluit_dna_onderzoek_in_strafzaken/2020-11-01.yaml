  - number: 1.k
    text: |-
      NEN-EN ISO/IEC 17025: algemene eisen voor de competentie van test- en kalibratielaboratoria, uitgegeven door het
      Koninklijk Nederlands Normalisatie-instituut, zoals deze luidde in januari 2018.
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel1
  - number: 1a
    text: |-
      Als misdrijven als bedoeld in [artikel 151a, derde lid, van de wet][ref1], ten aanzien waarvan de
      hulpofficier van justitie de bevoegdheid heeft een DNA-onderzoek op basis van celmateriaal van een
      onbekende verdachte te verrichten, worden aangewezen de misdrijven, bedoeld in de [artikelen 310][ref2] en
      [311, eerste lid, onderdelen 1°, 4° en 5°, van het Wetboek van Strafrecht][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel151a
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel310
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel311
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 151a
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '310'
      - id: ref3
        bwb_id: BWBR0001854
        artikel: '311'
  - number: 1b
    text: |-
      Als uiterlijk waarneembare persoonskenmerken van een onbekende verdachte of een onbekend slachtoffer
      waarop een DNA-onderzoek als bedoeld in [artikel 151d, eerste lid, eerste volzin][ref1], of
      [artikel 195f, eerste lid, eerste volzin, van de wet][ref2] gericht kan zijn, worden aangewezen:


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel151d
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel195f
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel1b
    references:
