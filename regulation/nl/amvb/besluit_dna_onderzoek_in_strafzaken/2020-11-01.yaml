        artikel: '16'
        paragraaf: '4'
  - number: '18.1'
    text: 'Het instituut vernietigt het DNA-profiel van een verdachte of veroordeelde:'
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel18
  - number: 18.1.a
    text: |-
      twintig jaar nadat een einduitspraak als bedoeld in de [artikelen 351][ref1] en
      [352, tweede lid, van het Wetboek van Strafvordering][ref2] is gedaan in verband met een misdrijf waarop naar de
      wettelijke omschrijving een gevangenisstraf van minder dan zes jaar is gesteld, en in het kader van het misdrijf
      het DNA-profiel is verwerkt of nadat een strafbeschikking wegens het misdrijf volledig ten uitvoer is gelegd, dan
      wel twaalf jaar na het overlijden van betrokkene,


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel351
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel352
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '351'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '352'
  - number: 18.1.b
    text: |-
      dertig jaar nadat een einduitspraak als bedoeld in de [artikelen 351][ref1] en
      [352, tweede lid, van het Wetboek van Strafvordering][ref2] is gedaan in verband met een misdrijf waarop naar de
      wettelijke omschrijving een gevangenisstraf van zes jaar of meer is gesteld, en in het kader van het misdrijf het
      DNA-profiel is verwerkt of nadat een strafbeschikking wegens het misdrijf volledig ten uitvoer is gelegd, dan wel
      twintig jaar na het overlijden van betrokkene, of


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel351
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel352
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '351'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '352'
  - number: 18.1.c
    text: na het vervallen van het recht tot strafvordering door verjaring.
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel18
  - number: '18.2'
    text: |-
      De termijn van twintig en dertig jaar, genoemd in het eerste lid, wordt verlengd indien tegen de betrokkene een
      einduitspraak als bedoeld in de [artikelen 351][ref1] en [352, tweede lid, van het Wetboek van Strafvordering][ref2]
      in verband met een ander misdrijf is gedaan of een strafbeschikking in verband met een ander misdrijf is
      uitgevaardigd. In dat geval wordt het DNA-profiel vernietigd twintig dan wel dertig jaar nadat de einduitspraak
      in verband met dat andere misdrijf is gedaan of de strafbeschikking in verband met dat andere misdrijf volledig
      ten uitvoer is gelegd, al naar gelang op het misdrijf naar de wettelijke omschrijving minder dan zes jaar dan wel
      zes jaar of meer gevangenisstraf is gesteld. De eerste twee volzinnen zijn niet van toepassing in het geval op dat
      andere misdrijf naar de wettelijke omschrijving een gevangenisstraf van minder dan zes jaar is gesteld, terwijl op
      het eerdere misdrijf naar de wettelijke omschrijving een gevangenisstraf van zes jaar of meer was gesteld en van de
      termijn van dertig jaar nog niet meer dan tien jaar is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel351
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel352
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '351'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '352'
  - number: '18.3'
    text: |-
      De termijn van dertig jaar, genoemd in het eerste lid, wordt met twintig jaar verlengd indien de duur van de
      gevangenisstraf of vrijheidsbenemende maatregel langer is dan twintig jaar. Indien de gevangenisstraf levenslang
      is of de vrijheidsbenemende maatregel de duur van veertig jaar overstijgt, wordt het DNA-profiel na tachtig jaar
      vernietigd.
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel18
  - number: '18.4'
    text: |-
      In afwijking van het eerste tot en met derde lid wordt het DNA-profiel van een verdachte of veroordeelde wegens
      een misdrijf als bedoeld in de [artikelen 240b tot en met 250 van het Wetboek van Strafrecht][ref1] na tachtig
      jaar vernietigd.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel241
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '241'
  - number: '18.5'
    text: |-
      Het instituut vernietigt het DNA-profiel van een persoon als bedoeld in [artikel 14, vierde lid, onder g][ref1],
      twintig jaar na vastlegging in de DNA-databank of zodra deze persoon het instuut heeft medegedeeld dat hij zijn
      toestemming tot het verwerken van zijn DNA-profiel heeft ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0012791#Artikel14
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel18
    references:
