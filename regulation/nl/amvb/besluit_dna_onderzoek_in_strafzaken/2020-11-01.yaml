  - number: '2.1'
    text: |-
      De verdachte, de persoon, bedoeld in [artikel 14, vierde lid, onder g][ref1], of de derde die gevraagd wordt
      schriftelijk toe te stemmen in het afnemen van celmateriaal ten behoeve van DNA-onderzoek, kan zich bij het
      nemen van zijn beslissing door een raadsman doen bijstaan. De officier van justitie onderscheidenlijk de rechter-
      commissaris wijst hem op deze mogelijkheid.


      [ref1]: https://wetten.overheid.nl/BWBR0012791#Artikel14
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0012791
        artikel: '14'
        paragraaf: '4'
  - number: '2.2'
    text: |-
      Op het formulier voor de schriftelijke toestemming, bedoeld in het eerste lid, wordt melding gemaakt van de
      gevolgen van de medewerking aan een DNA-onderzoek.
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel2
  - number: '2.3'
    text: |-
      Degene die vrijwillig medewerking verleent aan een DNA-onderzoek, kan ten behoeve van dat onderzoek wangslijmvlies,
      bloed of haarwortels laten afnemen.
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel2
  - number: '2.4'
    text: Het afnemen van wangslijmvlies geschiedt door van de binnenzijde van een wang een of meer monsters te nemen.
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel2
  - number: '2.5'
    text: Het afnemen van bloed geschiedt door middel van een vingerprik.
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel2
  - number: '2.6'
    text: Het afnemen van haarwortels geschiedt door het uittrekken van ten minste tien haren uit de hoofdhuid.
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel2
  - number: '2.7'
    text: |-
      Het afnemen van wangslijmvlies, bloed of haarwortels geschiedt door een arts of een verpleegkundige. Ingeval
      de desbetreffende persoon daar afzonderlijk schriftelijk in toestemt, kan het afnemen van wangslijmvlies of
      haarwortels geschieden door een daartoe door de officier van justitie aangewezen opsporingsambtenaar die voldoet
      aan bij ministeriële regeling vastgestelde eisen.
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel2
  - number: '2.8'
    text: Het afnemen van celmateriaal geschiedt met de hulpmiddelen die bij ministeriële regeling zijn voorgeschreven.
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel2
  - number: '2.9'
    text: |-
      Indien de arts of de verpleegkundige bij de behandeling van de desbetreffende persoon betrokken is
      of is geweest, neemt hij bij hem geen celmateriaal af, tenzij de persoon daartoe schriftelijk een
      verzoek heeft ingediend bij de officier van justitie onderscheidenlijk de rechter-commissaris dan
      wel de functionaris, bedoeld in [artikel 1, onder d, van de Penitentiaire beginselenwet][ref1],
      [artikel 1, onder g, van de Beginselenwet verpleging ter beschikking gestelden][ref2] of
      [artikel 1, onder h, van de Beginselenwet justitiële jeugdinrichtingen][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0008765#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0011756#Artikel1
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0008765
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0011756
        artikel: '1'
  - number: '3.1'
    text: |-
      Het afnemen van wangslijmvlies, bloed of haarwortels ten behoeve van een DNA-onderzoek
      bij een verdachte ingevolge een bevel als bedoeld in [artikel 151b, eerste lid][ref1], of
      [artikel 195d, eerste lid, van de wet][ref2] dan wel een veroordeelde ingevolge een bevel als bedoeld in
      [artikel 2, eerste lid, van de Wet DNA-onderzoek bij veroordeelden][ref3] geschiedt:


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel151b
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel195d
      [ref3]: https://wetten.overheid.nl/BWBR0017212#Artikel2
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 151b
      - id: ref2
        bwb_id: BWBR0001903
        artikel: 195d
      - id: ref3
        bwb_id: BWBR0017212
        artikel: '2'
  - number: 3.1.a
    text: |-
      op de wijze als omschreven in [artikel 2, vierde tot en met zesde lid][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0012791#Artikel2
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0012791
        artikel: '2'
        paragraaf: '2'
  - number: 3.1.b
    text: met de hulpmiddelen die bij ministeriële regeling zijn voorgeschreven.
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel3
  - number: '3.2'
    text: |-
      Het afnemen van wangslijmvlies of haarwortels bij een verdachte ingevolge een bevel als bedoeld in
      [artikel 151b, eerste lid][ref1], of [artikel 195d, eerste lid, van de wet][ref2] kan, ingeval de verdachte
      daar afzonderlijk schriftelijk in toestemt, geschieden door een daartoe door de officier van justitie aangewezen
      opsporingsambtenaar die voldoet aan bij ministeriële regeling vastgestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel151b
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel195d
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 151b
      - id: ref2
        bwb_id: BWBR0001903
        artikel: 195d
  - number: '3.3'
    text: |-
      Het afnemen van wangslijmvlies of haarwortels bij een veroordeelde ingevolge een bevel als bedoeld
      in [artikel 2, eerste lid, van de Wet DNA-onderzoek bij veroordeelden][ref1] kan, ingeval de
      veroordeelde daartegen geen bezwaar maakt, geschieden door een daartoe door de officier van justitie
      aangewezen opsporingsambtenaar of een daartoe door de directeur van de inrichting of instelling
      aangewezen persoon als bedoeld in [artikel 1, onder f, van de Penitentiaire beginselenwet][ref2],
      [artikel 1, onder k, van de Beginselenwet verpleging ter beschikking gestelden][ref3] of
      [artikel 1, onder i, van de Beginselenwet justitiële jeugdinrichtingen][ref4] die voldoet aan bij ministeriële
      regeling vastgestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0017212#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0009709#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0008765#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0011756#Artikel1
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel3
