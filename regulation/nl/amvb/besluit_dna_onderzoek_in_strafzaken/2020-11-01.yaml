  - number: '4.1'
    text: |-
      Bij het afnemen van wangslijmvlies, bloed of haarwortels van een persoon als bedoeld
      in [artikel 2][ref1] of [artikel 3][ref2] is een opsporingsambtenaar dan wel een
      persoon als bedoeld in [artikel 1, onder f, van de Penitentiaire beginselenwet][ref3],
      [artikel 1, onder k, van de Beginselenwet verpleging ter beschikking gestelden][ref4] of
      [artikel 1, onder i, van de Beginselenwet justitiële jeugdinrichtingen][ref5], voor zover het afnemen van het
      celmateriaal plaatsvindt bij een veroordeelde en hij in een inrichting als bedoeld in artikel 1, onder b, van
      de Penitentiaire beginselenwet, artikel 1, onder d, van de Beginselenwet verpleging ter beschikking gestelden of
      artikel 1, onder b, van de Beginselenwet justitiële jeugdinrichtingen verblijft of vanuit de inrichting vrijheden
      geniet, aanwezig die:


      [ref1]: https://wetten.overheid.nl/BWBR0012791#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0012791#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0009709#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0008765#Artikel1
      [ref5]: https://wetten.overheid.nl/BWBR0011756#Artikel1
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0012791
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0012791
        artikel: '3'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0009709
        artikel: '1'
      - id: ref4
        bwb_id: BWBR0008765
        artikel: '1'
      - id: ref5
        bwb_id: BWBR0011756
        artikel: '1'
  - number: 4.1.a
    text: 'daarvan proces-verbaal opmaakt dat of een verklaring die:'
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel4
  - number: 4.1.a.1°
    text: |-
      hij voorziet van een sporenidentificatienummer en de naam, de geboortedatum en -plaats en het geboorteland van de
      persoon van wie het celmateriaal is afgenomen of, indien deze gegevens onbekend zijn, andere gegevens waarmee de
      identiteit van deze persoon kan worden vastgesteld, en
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel4
  - number: 4.1.a.2°
    text: |-
      waarin hij, indien het een veroordeelde betreft, vermeldt of de veroordeelde al dan niet op grond van
      [artikel 3, derde lid][ref1], bezwaar heeft gemaakt tegen het afnemen van celmateriaal door een ander persoon dan
      een arts of een verpleegkundige.


      [ref1]: https://wetten.overheid.nl/BWBR0012791#Artikel3
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0012791
        artikel: '3'
        paragraaf: '2'
  - number: 4.1.b
    text: |-
      de verpakking waarin het van de persoon afgenomen celmateriaal is gebracht, van een sporenidentificatienummer
      voorziet dat gelijk is aan het een sporenidentificatienummer, bedoeld onder a, onderdeel 1°, en
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel4
  - number: 4.1.c
    text: |-
      ervoor zorgt dat de verpakking met het celmateriaal, bedoeld onder b, die hij van een of meer fraudebestendige
      sluitzegels of een fraudebestendige afsluiting heeft voorzien, zo spoedig mogelijk bij het laboratorium dat het
      DNA-onderzoek verricht, wordt bezorgd.
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel4
  - number: '4.2'
    text: |-
      De opsporingsambtenaar die het proces-verbaal opmaakt, of de persoon, bedoeld in het eerste lid, die de verklaring
      opmaakt, is een ander persoon dan de persoon die ingevolge [artikel 2, zevende lid, tweede volzin][ref1], of
      [artikel 3, tweede of derde lid][ref2], wangslijmvlies of haarwortels afneemt.


      [ref1]: https://wetten.overheid.nl/BWBR0012791#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0012791#Artikel3
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0012791
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0012791
        artikel: '3'
        paragraaf: '2'
  - number: '4.3'
    text: |-
      Indien het celmateriaal op een andere wijze van een persoon als bedoeld in [artikel 2][ref1] of [artikel 3][ref2]
      is verkregen dan de op de in die artikelen voorziene wijze, of indien het celmateriaal van een derde betreft
      die overleden of vermist is als gevolg van een misdrijf, verricht de opsporingsambtenaar de handelingen,
      bedoeld in het eerste lid, onder b en c. Indien het in de vorige zin bedoelde celmateriaal van een veroordeelde
      is, verricht de functionaris, bedoeld in [artikel 1, onder d, van de Penitentiaire beginselenwet][ref3],
      [artikel 1, onder g, van de Beginselenwet verpleging ter beschikking gestelden][ref4] of
      [artikel 1, onder h, van de Beginselenwet justitiële jeugdinrichtingen][ref5], de handelingen, bedoeld in het
      eerste lid, onder b en c.


      [ref1]: https://wetten.overheid.nl/BWBR0012791#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0012791#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0009709#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0008765#Artikel1
      [ref5]: https://wetten.overheid.nl/BWBR0011756#Artikel1
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0012791
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0012791
        artikel: '3'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0009709
        artikel: '1'
      - id: ref4
        bwb_id: BWBR0008765
        artikel: '1'
      - id: ref5
        bwb_id: BWBR0011756
        artikel: '1'
  - number: '4.4'
    text: |-
      In de opdracht aan de deskundige van het laboratorium dat het DNA-onderzoek verricht, worden in ieder geval de
      gegevens, bedoeld in [artikel 6, eerste lid, onder a tot en met c en e][ref1], vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0012791#Artikel6
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0012791
        artikel: '6'
        paragraaf: '2'
  - number: 4a.1
    text: |-
      Nadat een opsporingsambtenaar celmateriaal van een onbekende verdachte heeft veiliggesteld of van een in
      beslag genomen voorwerp heeft afgenomen, plaatst een opsporingsambtenaar dat celmateriaal na een daartoe
      verstrekte opdracht van de officier van justitie, de hulpofficier van justitie of de rechter-commissaris in
      een daarvoor bestemd mobiel apparaat ten behoeve van het verrichten van een DNA-onderzoek. Dat DNA-onderzoek
      mag alleen gericht zijn op het verkrijgen van data aan de hand waarvan een deskundige van het laboratorium
      van het instituut of een ander laboratorium als bedoeld in [artikel 7, tweede en derde lid][ref1], waaraan
      het apparaat die data heeft verzonden, het DNA-onderzoek verder verricht. In de opdracht aan de deskundige van
      het laboratorium dat het laatstbedoelde DNA-onderzoek verricht, worden in ieder geval de gegevens, bedoeld in
      [artikel 6, eerste lid, onder a tot en met c][ref2], vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0012791#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0012791#Artikel6
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0012791
        artikel: '7'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0012791
        artikel: '6'
        paragraaf: '2'
  - number: 4a.2
    text: |-
      De opsporingsambtenaar kan de onderzoekshandeling, bedoeld in het eerste lid, alleen verrichten indien het
      landelijk politiekorps, bedoeld in [artikel 25, eerste lid, van de Politiewet 2012][ref1] waar hij werkzaam is,
      door de Raad voor Accreditatie voor die handeling aan de hand van de eisen, genoemd in de NEN-EN ISO/IEC 17 025,
      is geaccrediteerd.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel25
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '25'
  - number: 4a.3
    text: |-
      De opsporingsambtenaar zendt het celmateriaal dat bestemd is voor het verrichten van een DNA-onderzoek als bedoeld
      in [artikel 151a, zesde lid, eerste volzin][ref1], of [artikel 195b, eerste lid, eerste volzin, van de wet][ref2]
      of voor het opnieuw bepalen van het bijbehorende, in de DNA-databank vastgelegde DNA-profiel naar het instituut.
      Hij voorziet de verpakking met daarin het celmateriaal van een sporenidentificatienummer en van een of meer
      fraudebestendige sluitzegels of een fraudebestendige afsluiting en zorgt ervoor dat deze bij het instituut wordt
      bezorgd.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel151a
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel195b
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 151a
      - id: ref2
        bwb_id: BWBR0001903
        artikel: 195b
  - number: 4a.4
    text: |-
      De opsporingsambtenaar voorziet het proces-verbaal van het veiligstellen van het celmateriaal of het afnemen van
      het celmateriaal op een in beslag genomen voorwerp, bedoeld in het eerste lid, van een sporenidentificatienummer.
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel4a
  - number: 4a.5
    text: |-
      De deskundige die het DNA-onderzoek verricht, rapporteert vooruitlopend op het uitbrengen van het verslag, bedoeld
      in [artikel 10][ref1], de resultaten van het DNA-onderzoek aan de opdrachtgever van het DNA-onderzoek en in
      afschrift aan de opsporingsambtenaar die het apparaat heeft bediend.


      [ref1]: https://wetten.overheid.nl/BWBR0012791#Artikel10
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0012791
        artikel: '10'
        paragraaf: '3'
  - number: 4a.6
    text: |-
      Het landelijk politiekorps vernietigt de data die met het mobiele apparaat, bedoeld in het eerste lid, zijn
      verkregen, vier jaar na het jaar waarin die data zijn verkregen.
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel4a
  - number: '5.1'
    text: |-
      Indien een opsporingsambtenaar celmateriaal van een onbekende verdachte heeft veiliggesteld of een voorwerp in
      beslag heeft genomen waarop zich mogelijkerwijs celmateriaal van die persoon bevindt, en er geen sprake is van een
      geval als bedoeld in [artikel 4a, eerste lid][ref1], zendt hij dat celmateriaal ten behoeve van het verrichten van
      een DNA-onderzoek na een daartoe verstrekte opdracht van de officier van justitie, de hulpofficier van justitie of
      de rechter-commissaris naar een laboratorium als bedoeld in dat artikellid. De [artikelen 4, vierde lid][ref2], en
      4a, derde lid, laatste volzin, en vierde lid, zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0012791#Artikel4a
      [ref2]: https://wetten.overheid.nl/BWBR0012791#Artikel4
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0012791
        artikel: 4a
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0012791
        artikel: '4'
        paragraaf: '2'
  - number: '5.2'
    text: |-
      In dit artikel wordt onder opsporingsambtenaar tevens verstaan de opsporingsambtenaar, bedoeld in
      [artikel 1, onder b, van de Wet op de bijzondere opsporingsdiensten][ref1], die werkzaam is bij de bijzondere
      opsporingsdienst, bedoeld in [artikel 2, onder a, van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0019919#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0019919#Artikel2
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0019919
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0019919
        artikel: '2'
  - number: '6.1'
    text: |-
      Het laboratorium waaraan de deskundige is verbonden die het DNA-onderzoek verricht, verstrekt ten aanzien van het
      celmateriaal waarmee dat onderzoek wordt verricht, terstond na ontvangst van dat celmateriaal aan het instituut de
      volgende gegevens die het instituut in een centraal bestand vastlegt:
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel6
  - number: 6.1.a
    text: |-
      het sporenidentificatienummer, bedoeld in de [artikelen 4, eerste lid, onder a, onderdeel 1°, en b][ref1], en
      [5, eerste en tweede lid][ref2], alsmede het proces-verbaalnummer van de strafzaak waarin het celmateriaal is
      afgenomen en het parketnummer,


      [ref1]: https://wetten.overheid.nl/BWBR0012791#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0012791#Artikel5
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0012791
        artikel: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0012791
        artikel: '5'
        paragraaf: '2'
  - number: 6.1.b
    text: |-
      een aanduiding van het misdrijf in verband waarmee het DNA-onderzoek wordt verricht, de maximale gevangenisstraf
      die op dat misdrijf is gesteld en andere gegevens die van belang zijn in verband met het tijdstip waarop het
      celmateriaal en het bijbehorende DNA-profiel dienen te worden vernietigd,
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel6
  - number: 6.1.c
    text: |-
      de naam van de officier van justitie, de hulpofficier van justitie onderscheidenlijk rechter-commissaris die de
      opdracht tot het verrichten van het DNA-onderzoek heeft gegeven,
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel6
  - number: 6.1.d
    text: |-
      de naam van het laboratorium waaraan de deskundige is verbonden die het DNA-onderzoek verricht en de datum waarop
      het laboratorium het celmateriaal heeft ontvangen, en
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel6
  - number: 6.1.e
    text: |-
      indien het celmateriaal van een verdachte, een veroordeelde, een persoon als bedoeld in
      [artikel 14, vierde lid, onder g][ref1], of een derde betreft, de naam, de geboortedatum en -plaats en het
      geboorteland van deze persoon of, indien deze gegevens onbekend zijn, andere gegevens waarmee zijn identiteit kan
      worden vastgesteld, en indien het celmateriaal van een verdachte of veroordeelde betreft, het aan hem toegekende
      strafrechtsketennummer.


      [ref1]: https://wetten.overheid.nl/BWBR0012791#Artikel14
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0012791
        artikel: '14'
        paragraaf: '4'
  - number: '6.2'
    text: |-
      Ten aanzien van het celmateriaal van een veroordeelde of een persoon als bedoeld in
      [artikel 14, vierde lid, onder g][ref1], is het eerste lid, onder b, voor zover dit betrekking heeft op het proces-
      verbaalnummer van de strafzaak waarin het celmateriaal is afgenomen en het parketnummer, niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0012791#Artikel14
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0012791
        artikel: '14'
        paragraaf: '4'
  - number: '6.3'
    text: Onze Minister is voor het centrale bestand, bedoeld in het eerste lid, verantwoordelijk.
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel6
  - number: '6.4'
    text: De directeur van het instituut voert het beheer over het centrale bestand.
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel6
  - number: 6a.1
    text: |-
      Indien het DNA-onderzoek zal worden verricht in een ander laboratorium dan het laboratorium dat het celmateriaal
      heeft ontvangen, zorgt het ontvangende laboratorium ervoor dat dat celmateriaal zo spoedig mogelijk in een
      verpakking dat voorzien is van het sporenidentificatienummer, bedoeld in [artikel 6, eerste lid, onder a][ref1], en
      van een of meer fraudebestendige sluitzegels of een fraudebestendige afsluiting, wordt bezorgd bij het laboratorium
      dat het DNA-onderzoek zal verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0012791#Artikel6
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0012791
        artikel: '6'
        paragraaf: '2'
  - number: 6a.2
    text: |-
      Op het ontvangende laboratorium, bedoeld in het eerste lid, is [artikel 6, eerste lid, onder d][ref1], van
      overeenkomstige toepassing. Op het laboratorium dat het DNA-onderzoek zal verrichten, is artikel 6, eerste lid, van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0012791#Artikel6
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0012791
        artikel: '6'
        paragraaf: '2'
  - number: '7.1'
    text: |-
      DNA-onderzoek wordt verricht in het laboratorium van het instituut dat daarvoor door de Raad voor Accreditatie is
      geaccrediteerd aan de hand van de eisen, genoemd in de NEN-EN ISO/IEC 17 025, genoemd in de NEN-EN ISO/IEC 17 025,
      en deskundig is op het terrein van forensisch DNA-onderzoek.
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel7
  - number: '7.2'
    text: |-
      Het DNA-onderzoek kan in een ander laboratorium dan het laboratorium van het instituut worden verricht, indien dat
      vanwege de capaciteit van het laboratorium van het instituut noodzakelijk is of indien de officier van justitie
      onderscheidenlijk de rechter-commissaris opdracht heeft gegeven dat het DNA-onderzoek in een ander laboratorium
      wordt verricht.
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel7
  - number: '7.3'
    text: 'Als ander laboratorium als bedoeld in het tweede lid komt slechts in aanmerking:'
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel7
  - number: 7.3.a
    text: |-
      een laboratorium dat door de Raad voor Accreditatie is geaccrediteerd aan de hand van de eisen, genoemd in de
      NEN-EN ISO/IEC 17 025, genoemd in de NEN-EN ISO/IEC 17 025, en deskundig is op het terrein van forensisch DNA-
      onderzoek, dan wel
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel7
  - number: 7.3.b
    text: |-
      een laboratorium dat gevestigd is in het buitenland, door een met de Raad voor Accreditatie vergelijkbare instantie
      is geaccrediteerd aan de hand van eisen die vergelijkbaar zijn met de eisen, bedoeld onder a, en deskundig is op
      het terrein van forensisch DNA-onderzoek.
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel7
  - number: '7.4'
    text: |-
      Met toepassing van [artikel 28, eerste lid, laatste zinsnede, van de Dienstenwet][ref1] is
      [paragraaf 4.1.3.3. van de Algemene wet bestuursrecht][ref2] niet van toepassing op de aanvraag om accreditatie,
      bedoeld in het eerste en derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: '7.5'
    text: |-
      Indien de accreditatie van een laboratorium als bedoeld in het eerste of derde lid is ingetrokken, is geschorst of
      na haar vervaldatum niet is verlengd, kan in dit laboratorium niet langer DNA-onderzoek worden verricht.
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel7
  - number: '7.6'
    text: |-
      Het DNA-onderzoek, bedoeld in [artikel 151a, zesde lid, eerste volzin][ref1], of
      [artikel 195b, eerste lid, eerste volzin, van de wet][ref2] wordt niet verricht door:


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel151a
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel195b
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 151a
      - id: ref2
        bwb_id: BWBR0001903
        artikel: 195b
  - number: 7.6.a
    text: |-
      de deskundige die het DNA-onderzoek als bedoeld in [artikel 151a, eerste lid, eerste volzin][ref1],
      onderscheidenlijk [artikel 195a, eerste lid, eerste volzin, van de wet][ref2] heeft verricht, dan wel


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel151a
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel195a
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 151a
      - id: ref2
        bwb_id: BWBR0001903
        artikel: 195a
  - number: 7.6.b
    text: een deskundige die aan hetzelfde laboratorium is verbonden als de deskundige, bedoeld onder a.
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel7
  - number: '9.1'
    text: |-
      De deskundige verricht het DNA-onderzoek binnen de termijn die de officier van justitie, de hulpofficier van
      justitie onderscheidenlijk de rechter-commissaris die de opdracht tot het verrichten van het DNA-onderzoek heeft
      gegeven, heeft gesteld. De termijn wordt na overleg met het laboratorium waaraan de deskundige is verbonden,
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel9
  - number: '9.2'
    text: |-
      De deskundige verricht het DNA-onderzoek volgens een van de methoden die zijn goedgekeurd bij het verlenen van de
      accreditatie aan het laboratorium waaraan hij is verbonden.
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel9
  - number: '10.1'
    text: De deskundige stelt een verslag op van de resultaten van het DNA-onderzoek en ondertekent het verslag.
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel10
  - number: '10.2'
    text: 'Het verslag bevat in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel10
  - number: 10.2.a
    text: |-
      een vermelding van de gegevens, bedoeld in [artikel 6, eerste lid, onder a tot en met c en e][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0012791#Artikel6
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0012791
        artikel: '6'
        paragraaf: '2'
  - number: 10.2.b
    text: de methode met behulp waarvan het DNA-profiel uit het DNA-onderzoek is verkregen, en
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel10
  - number: 10.2.c
    text: de resultaten en de conclusies van het DNA-onderzoek.
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel10
  - number: '10.3'
    text: 'Na dagtekening van het verslag zorgt de deskundige ervoor dat:'
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel10
  - number: 10.3.a
    text: |-
      de DNA-profielen die uit het DNA-onderzoek zijn verkregen en die het instituut op grond van
      [artikel 14, vierde lid][ref1], verplicht is in de DNA-databank vast te leggen, terstond aan het instituut worden
      gezonden, onder vermelding van de gegevens, bedoeld in [artikel 6, eerste lid, onder a tot en met c en e][ref2],


      [ref1]: https://wetten.overheid.nl/BWBR0012791#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0012791#Artikel6
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0012791
        artikel: '14'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0012791
        artikel: '6'
        paragraaf: '2'
  - number: 10.3.b
    text: binnen een week het verslag aan de opdrachtgever van het DNA-onderzoek wordt gezonden,
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel10
  - number: 10.3.c
    text: |-
      binnen een week een afschrift van het verslag aan de opsporingsambtenaar wordt gezonden die betrokken is bij het
      opsporingsonderzoek of het uit hoofde van de [artikelen 181][ref1] of [182 van de wet][ref2] ingesteld onderzoek
      in het kader waarvan het DNA-onderzoek is verricht waarover de deskundige het verslag heeft opgesteld, met dien
      verstande dat dit afschrift geen DNA-profiel bevat, en


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel181
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel182
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '181'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '182'
  - number: 10.3.d
    text: binnen zes maanden het overgebleven celmateriaal aan het instituut wordt gezonden.
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel10
  - number: '10.4'
    text: |-
      Indien de opdrachtgever van het DNA-onderzoek de hulpofficier van justitie is, zendt de deskundige het verslag
      tevens aan de officier van justitie.
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel10
  - number: '10.5'
    text: 'Het derde lid, onder b en c, is niet van toepassing indien:'
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel10
  - number: 10.5.a
    text: |-
      het DNA-onderzoek ingevolge een bevel als bedoeld in
      [artikel 2, eerste lid, van de Wet DNA-onderzoek bij veroordeelden][ref1] is verricht en het DNA-profiel van de
      veroordeelde niet overeenkomt met een ander in de DNA-databank vastgelegd DNA-profiel, of


      [ref1]: https://wetten.overheid.nl/BWBR0017212#Artikel2
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0017212
        artikel: '2'
  - number: 10.5.b
    text: |-
      het DNA-profiel van een onbekende verdachte na vergelijking in de DNA-databank geen overeenkomst met andere in die
      databank vastgelegde DNA-profielen oplevert en er in dezelfde strafzaak geen ander DNA-profiel van een onbekende
      verdachte een overeenkomst met die DNA-profielen heeft opgeleverd.
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel10
  - number: '10.6'
    text: |-
      Indien de deskundige aan een ander laboratorium is verbonden dan het laboratorium van het instituut, voorziet dat
      laboratorium het buisje met het celmateriaal, bedoeld in het derde lid, onder b, van een sporenidentificatienummer
      dat gelijk is aan het sporenidentificatienummer waarmee het laboratorium het celmateriaal heeft ontvangen, of
      het laboratoriumidentificatienummer en voorziet de verpakking van het buisje met het celmateriaal van een of meer
      fraudebestendige sluitzegels of een fraudebestendige afsluiting.
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel10
  - number: '10.7'
    text: |-
      De directeur van het instituut meldt de officier van justitie onderscheidenlijk de rechter-commissaris zo spoedig
      mogelijk of:
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel10
  - number: 10.7.a
    text: |-
      het DNA-profiel dat is verkregen uit het celmateriaal van een persoon, bedoeld in het tweede lid, onder a,
      overeenkomt met het DNA-profiel dat in verband met hetzelfde strafbare feit is verkregen uit het celmateriaal van
      een onbekende verdachte, dan wel overeenkomt met een ander DNA-profiel dat is vastgelegd in de DNA-databank of
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel10
  - number: 10.7.b
    text: |-
      het DNA-profiel dat is verkregen uit het celmateriaal van een onbekende verdachte overeenkomt met een DNA-profiel
      dat is vastgelegd in de DNA-databank.
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel10
  - number: '10.8'
    text: |-
      In geval van [artikel 2, vijfde lid, van de Wet DNA-onderzoek bij veroordeelden][ref1] geeft de officier
      van justitie de functionaris, bedoeld in [artikel 1, onder d, van de Penitentiaire beginselenwet][ref2],
      [artikel 1, onder g, van de Beginselenwet verpleging ter beschikking gestelden][ref3] of
      [artikel 1, onder h, van de Beginselenwet justitiële jeugdinrichtingen][ref4] schriftelijk kennis van de uitslag
      van het DNA-onderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0017212#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0009709#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0008765#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0011756#Artikel1
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0017212
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0009709
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0008765
        artikel: '1'
      - id: ref4
        bwb_id: BWBR0011756
        artikel: '1'
  - number: '10.9'
    text: |-
      De officier van justitie geeft een persoon als bedoeld in [artikel 14, vierde lid, onder g][ref1], schriftelijk
      kennis van de uitslag van het DNA-onderzoek indien zijn DNA-profiel overeenkomt met een ander verwerkt DNA-profiel
      en het belang van het onderzoek dat toelaat.


      [ref1]: https://wetten.overheid.nl/BWBR0012791#Artikel14
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0012791
        artikel: '14'
        paragraaf: '4'
  - number: '11'
    text: |-
      Indien het DNA-onderzoek, bedoeld in [artikel 151a, zesde lid, eerste volzin][ref1], of
      [artikel 195b, eerste lid, eerste volzin, van de wet][ref2] in een ander laboratorium dan het laboratorium
      van het instituut zal worden verricht, zorgt het instituut ervoor dat het buisje met het celmateriaal voor
      het verrichten van dat DNA-onderzoek, van een sporenidentificatienummer wordt voorzien dat gelijk is aan het
      sporenidentificatienummer waarmee het instituut heeft ontvangen, of het laboratoriumidentificatienummer, en dat dat
      buisje zo spoedig mogelijk in een verpakking die voorzien is van een of meer fraudebestendige sluitzegels of een
      fraudebestendige afsluiting, bij dat laboratorium wordt bezorgd.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel151a
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel195b
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 151a
      - id: ref2
        bwb_id: BWBR0001903
        artikel: 195b
  - number: '12.1'
    text: |-
      Het aan de verdachte in rekening te brengen deel van de kosten, bedoeld in de [artikelen 151a, zevende lid][ref1],
      en [195b, tweede lid, van de wet][ref2], voor het verrichten van een DNA-onderzoek op verzoek van de verdachte
      bedraagt € 136.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel151a
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel195b
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 151a
      - id: ref2
        bwb_id: BWBR0001903
        artikel: 195b
  - number: '12.2'
    text: |-
      Een DNA-onderzoek op verzoek van de verdachte wordt niet verricht dan nadat hij het bedrag, genoemd in het eerste
      lid, aan het laboratorium dat het DNA-onderzoek verricht, heeft betaald.
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel12
  - number: '13.1'
    text: |-
      Het instituut bewaart na afloop van een DNA-onderzoek het overgebleven celmateriaal, bedoeld in
      [artikel 10, derde lid, onder d][ref1], ten behoeve van de uitvoering van een DNA-onderzoek als bedoeld in
      [artikel 151a, zesde lid, eerste volzin][ref2], of [artikel 195b, eerste lid, eerste volzin, van de wet][ref3] of
      met het oog op het opnieuw bepalen van het bijbehorende, in de DNA-databank vastgelegde DNA-profiel.


      [ref1]: https://wetten.overheid.nl/BWBR0012791#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel151a
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel195b
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0012791
        artikel: '10'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: 151a
      - id: ref3
        bwb_id: BWBR0001903
        artikel: 195b
  - number: '13.2'
    text: |-
      In afwijking van het eerste lid vernietigt het instituut het celmateriaal van een derde die niet tevens een persoon
      als bedoeld in [artikel 14, vierde lid, onder a of b][ref1], is, terstond:


      [ref1]: https://wetten.overheid.nl/BWBR0012791#Artikel14
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0012791
        artikel: '14'
        paragraaf: '4'
  - number: 13.2.a
    text: |-
      indien is vastgesteld dat het DNA-profiel van de derde niet overeenkomt of geen verwantschap vertoont met het
      DNA-profiel dat in verband met dezelfde strafzaak is verkregen uit het celmateriaal van een onbekende verdachte
      of een overleden slachtoffer, tenzij de derde schriftelijk toestemming heeft gegeven dat zijn celmateriaal
      wordt vernietigd zodra de strafzaak in het kader waarvan zijn celmateriaal is afgenomen, is geëindigd in een
      beslissing om van vervolging of verdere vervolging van de verdachte af te zien, een einduitspraak als bedoeld
      in [artikel 351][ref1] of [352 van de wet][ref2] of een onherroepelijke strafbeschikking of overeenkomstig de
      termijnen, genoemd in [artikel 18a][ref3], in het geval waarin de strafzaak is geëindigd in een einduitspraak die
      een vrijspraak inhoudt, dan wel


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel351
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel352
      [ref3]: https://wetten.overheid.nl/BWBR0012791#Artikel18a
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '351'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '352'
      - id: ref3
        bwb_id: BWBR0012791
        artikel: 18a
        paragraaf: '4'
  - number: 13.2.b
    text: |-
      zodra het instituut van de derde een afschrift heeft ontvangen van zijn aan het openbaar ministerie verzonden
      kennisgeving tot intrekking van zijn toestemming tot het verwerken van zijn celmateriaal.
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel13
  - number: '13.3'
    text: |-
      In het geval, bedoeld in het tweede lid, onder a, laatste zinsnede, bewaart het instituut het DNA-profiel van de
      derde in het dossier over de strafzaak in het kader waarvan dat DNA-profiel is bepaald en mag het instituut dat
      DNA-profiel uitsluitend vergelijken met het DNA-profiel van een onbekende verdachte of van een slachtoffer in die
      strafzaak.
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel13
  - number: '13.4'
    text: |-
      Met het celmateriaal van de derde, bedoeld in het tweede lid, vernietigt het instituut tevens het DNA-profiel dat
      uit dat celmateriaal is verkregen, de gegevens over hem, bedoeld in [artikel 6, eerste lid][ref1], het afschrift
      van het verslag, bedoeld in [artikel 10, eerste lid][ref2], indien het verslag is opgesteld door een deskundige die
      aan het laboratorium van het instituut is verbonden, alsmede de gegevens over hem in het dossier, bedoeld in het
      derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0012791#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0012791#Artikel10
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0012791
        artikel: '6'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0012791
        artikel: '10'
        paragraaf: '3'
  - number: '13.5'
    text: Het instituut houdt aantekening van iedere vernietiging ingevolge het eerste tot en met vierde lid.
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel13
  - number: '13.6'
    text: |-
      Het openbaar ministerie verstrekt het instituut de informatie die nodig is om te kunnen voldoen aan het tweede lid,
      onder a, laatste zinsnede.
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel13
  - number: '13.7'
    text: |-
      Het instituut verstrekt de informatie, bedoeld in het tweede lid, door aan het laboratorium waaraan de deskundige
      is verbonden die het DNA-onderzoek met behulp van het celmateriaal van de derde verricht of heeft verricht indien
      die deskundige nog niet de verplichting, bedoeld in [artikel 10, derde lid, onder b][ref1], is nagekomen. Het
      tweede, vierde en vijfde lid is op dat laboratorium van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0012791#Artikel10
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0012791
        artikel: '10'
        paragraaf: '3'
  - number: '14.1'
    text: |-
      Er is een DNA-databank voor strafzaken die tot doel heeft het voorkomen, opsporen, vervolgen en berechten van
      strafbare feiten en het vaststellen van de identiteit van een lijk te bevorderen.
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel14
  - number: '14.2'
    text: Onze Minister is voor de DNA-databank verantwoordelijk.
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel14
  - number: '14.3'
    text: De directeur van het instituut voert het beheer over de DNA-databank.
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel14
  - number: '14.4'
    text: |-
      Het instituut legt in de DNA-databank het sporenidentificatienummer, bedoeld in
      [artikel 6, eerste lid, onder a][ref1], vast, alsmede


      [ref1]: https://wetten.overheid.nl/BWBR0012791#Artikel6
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0012791
        artikel: '6'
        paragraaf: '2'
  - number: 14.4.a
    text: |-
      het bijbehorende DNA-profiel van onbekende en bekende overleden slachtoffers van misdrijven als omschreven in
      [artikel 67, eerste lid, van de wet][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel67
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '67'
  - number: 14.4.b
    text: |-
      het bijbehorende DNA-profiel van personen van wie vermoed wordt dat zij als gevolg van misdrijven als omschreven in
      [artikel 67, eerste lid, van de wet][ref1], vermist zijn,


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel67
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '67'
  - number: 14.4.c
    text: het bijbehorende DNA-profiel van onbekende verdachten,
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel14
  - number: 14.4.d
    text: |-
      het bijbehorende DNA-profiel van verdachten ter zake van misdrijven als omschreven in
      [artikel 67, eerste lid, van de wet][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel67
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '67'
  - number: 14.4.e
    text: het bijbehorende DNA-profiel van gewezen verdachten,
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel14
  - number: 14.4.f
    text: |-
      het bijbehorende DNA-profiel van veroordeelden ter zake van misdrijven als omschreven in
      [artikel 67, eerste lid, van de wet][ref1], dan wel


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel67
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '67'
  - number: 14.4.g
    text: |-
      het bijbehorende DNA-profiel van personen die hun straf of maatregel volledig hebben ondergaan ter zake van
      misdrijven als omschreven in [artikel 67, eerste lid, van de wet][ref1] en die schriftelijk hebben toegestemd in
      het afnemen van celmateriaal ten behoeve van het bepalen en verwerken van hun DNA-profiel.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel67
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '67'
  - number: '14.5'
    text: |-
      De directeur van het instituut kan de DNA-profielen die in de DNA-databank zijn vastgelegd, opnieuw bepalen indien
      de stand van de techniek dat noodzakelijk maakt.
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel14
  - number: '14.6'
    text: |-
      De directeur van het instituut kan de DNA-profielen die in de DNA-databank zijn vastgelegd, onderling vergelijken
      met het oog op het doel, bedoeld in het eerste lid. Indien de vergelijking een positief resultaat heeft, stelt hij
      de officier van justitie of de rechter-commissaris van dit resultaat in kennis.
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel14
  - number: '14.7'
    text: |-
      In afwijking van het vierde lid, onder a en c, bewaart het instituut het DNA-profiel dat niet voldoet aan de
      criteria voor verwerking in de DNA-databank, in het dossier over de strafzaak in het kader waarvan dat DNA-profiel
      is bepaald. Het vijfde en zesde lid zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel14
  - number: '14.8'
    text: |-
      In afwijking van het zesde lid kan de directeur het DNA-profiel van een gewezen verdachte, bedoeld in het vierde
      lid, onder e, dat in de DNA-databank is vastgelegd of het DNA-profiel van een onbekende verdachte, bedoeld in
      het vierde lid, onder c, dat in de strafzaak waarin de gewezen verdachte is vrijgesproken of ontslagen van alle
      rechtsvervolging, met dat profiel overeenkwam, uitsluitend onderling of met andere met die strafzaak in verband
      staande DNA-profielen van onbekende verdachten als bedoeld in het vierde lid, onder c, vergelijken indien
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel14
  - number: 14.8.a
    text: |-
      de vergelijking plaatsvindt met het oog op de herziening ten nadele op de in
      [artikel 482a, eerste lid, onder a, van de wet][ref1] bedoelde grond, en


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel482a
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 482a
  - number: 14.8.b
    text: de rechter-commissaris, op vordering van de officier van justitie, opdracht tot de vergelijking heeft gegeven.
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel14
  - number: '14.9'
    text: |-
      In geval van toepassing van het achtste lid geeft de rechter-commissaris die de opdracht tot de vergelijking heeft
      gegeven, de gewezen verdachte, zodra het belang van het onderzoek dat toelaat, schriftelijk kennis van de uitslag
      van het onderzoek.
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel14
  - number: '14.10'
    text: |-
      De directeur van het instituut kan de DNA-profielen van de personen die ingevolge
      [artikel 4:2, eerste lid, onder k, onderdeel 3°, van het Besluit politiegegevens][ref1] aan Onze Minister worden
      verstrekt, vergelijken met de DNA-profielen van de personen, bedoeld in het vierde lid, onder d, f en g. Indien
      de vergelijking een positief resultaat heeft, stelt hij de officier van justitie of de rechter-commissaris en een
      landelijke eenheid als bedoeld in [artikel 25, eerste lid, onder b, van de Politiewet 2012][ref2] van dit resultaat
      in kennis.


      [ref1]: https://wetten.overheid.nl/BWBR0023086#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel25
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0023086
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0031788
        artikel: '25'
  - number: '15.1'
    text: 'Rechtstreekse toegang tot de DNA-databank hebben:'
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel15
  - number: 15.1.a
    text: |-
      de directeur van het instituut, voor zover hij deze nodig heeft ten behoeve van het voeren van het beheer over de
      DNA-databank, bedoeld in [artikel 14, derde lid][ref1], of het verrichten van een DNA-onderzoek,


      [ref1]: https://wetten.overheid.nl/BWBR0012791#Artikel14
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0012791
        artikel: '14'
        paragraaf: '4'
  - number: 15.1.b
    text: |-
      de directeur van het laboratorium, bedoeld in
      [artikel 23, eerste lid, van het Besluit vergelijkend onderzoek celmateriaal BES][ref1], voor
      zover hij deze nodig heeft ten behoeve van het verrichten van een onderzoek als bedoeld in
      [artikel 79, eerste lid, van het Wetboek van Strafvordering BES][ref2] en het de DNA-profielen van de personen,
      bedoeld in [artikel 14, vierde lid, onder a tot en met c, d, f en g][ref3], betreft,


      [ref1]: https://wetten.overheid.nl/BWBR0028458#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel79
      [ref3]: https://wetten.overheid.nl/BWBR0012791#Artikel14
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0028458
        artikel: '23'
      - id: ref2
        bwb_id: BWBR0028681
        artikel: '79'
      - id: ref3
        bwb_id: BWBR0012791
        artikel: '14'
        paragraaf: '4'
  - number: 15.1.c
    text: |-
      de directeur van het laboratorium, bedoeld in artikel 23, eerste lid, van het Landsbesluit vergelijkend onderzoek
      celmateriaal (AB 1997, 49), voor zover hij deze nodig heeft ten behoeve van het verrichten van een onderzoek
      als bedoeld in artikel 79, eerste lid, van het Wetboek van Strafvordering van Aruba (AB 1996, 75) en het de DNA-
      profielen van de personen, bedoeld in [artikel 14, vierde lid, onder a tot en met c, d, f en g][ref1], betreft,


      [ref1]: https://wetten.overheid.nl/BWBR0012791#Artikel14
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0012791
        artikel: '14'
        paragraaf: '4'
  - number: 15.1.d
    text: |-
      de directeur van het laboratorium, bedoeld in artikel 23, eerste lid, van het Landsbesluit vergelijkend onderzoek
      celmateriaal (P.B. 1997, 245), voor zover hij deze nodig heeft ten behoeve van het verrichten van een onderzoek als
      bedoeld in artikel 79, eerste lid, van het Wetboek van Strafvordering (P.B. 1996, 164) en het de DNA-profielen van
      de personen, bedoeld in [artikel 14, vierde lid, onder a tot en met c, d, f en g][ref1], betreft,


      [ref1]: https://wetten.overheid.nl/BWBR0012791#Artikel14
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0012791
        artikel: '14'
        paragraaf: '4'
  - number: 15.1.e
    text: |-
      de directeur van het laboratorium, bedoeld in artikel 23, eerste lid, van het Landsbesluit vergelijkend onderzoek
      celmateriaal (AB 2013, 169 ), voor zover hij deze nodig heeft ten behoeve van het verrichten van een onderzoek als
      bedoeld in artikel 79, eerste lid, van het Wetboek van Strafvordering (P.B. 1996, 164) en het de DNA-profielen van
      de personen, bedoeld in [artikel 14, vierde lid, onder a tot en met c, d, f en g][ref1], betreft, en


      [ref1]: https://wetten.overheid.nl/BWBR0012791#Artikel14
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0012791
        artikel: '14'
        paragraaf: '4'
  - number: 15.1.f
    text: |-
      de medewerkers van de nationale contactpunten, bedoeld in artikel 6, eerste lid, van het Besluit 2008/615/JBZ van
      de Raad van de Europese Unie van 23 juni 2008 inzake de intensivering van de grensoverschrijdende samenwerking in
      het bijzonder ter bestrijding van terrorisme en grensoverschrijdende criminaliteit (Pb. EU L 210), voor zover zij
      deze nodig hebben ter uitvoering van de artikelen 3, eerste lid, en 4, eerste lid, van dat besluit en het de DNA-
      profielen van de personen, bedoeld in [artikel 14, vierde lid, onder a tot en met c, d, f en g][ref1], betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0012791#Artikel14
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0012791
        artikel: '14'
        paragraaf: '4'
  - number: '15.2'
    text: |-
      Het instituut verstrekt slechts gegevens uit de DNA-databank en het centrale bestand, bedoeld in
      [artikel 6, eerste lid][ref1], aan:


      [ref1]: https://wetten.overheid.nl/BWBR0012791#Artikel6
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0012791
        artikel: '6'
        paragraaf: '2'
  - number: 15.2.a
    text: |-
      de deskundigen die aan een laboratorium als bedoeld in [artikel 7, eerste of tweede lid][ref1], verbonden zijn en,
      voor zover zij aan een Nederlands laboratorium verbonden zijn, door de officier van justitie, de hulpofficier van
      justitie of de rechter-commissaris benoemd zijn met de opdracht een DNA-onderzoek te verrichten, of, voor zover zij
      aan een laboratorium verbonden zijn dat in het buitenland gevestigd is, beschikken over een opdracht van de in dat
      land bevoegde autoriteit, voor zover zij deze nodig hebben voor het verrichten van een DNA-onderzoek,


      [ref1]: https://wetten.overheid.nl/BWBR0012791#Artikel7
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0012791
        artikel: '7'
        paragraaf: '3'
  - number: 15.2.b
    text: |-
      de met vervolging belaste leden van de rechterlijke macht, voor zover zij deze nodig hebben voor de
      toepassing van het strafrecht, daarin begrepen de uitvoering van een verzoek om rechtshulp als bedoeld in
      [artikel 552h van de wet][ref1], of voor de uitvoering van de [Wet DNA-onderzoek bij veroordeelden][ref2],


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel552h
      [ref2]: https://wetten.overheid.nl/BWBR0017212
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 552h
      - id: ref2
        bwb_id: BWBR0017212
  - number: 15.2.c
    text: |-
      de met rechtspraak belaste leden van de rechterlijke macht, voor zover zij deze nodig hebben voor de toepassing van
      het strafrecht,
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel15
  - number: 15.2.d
    text: |-
      de ambtenaren van politie, bedoeld in [artikel 2, onder a, c en d, van de Politiewet 2012][ref1], die zijn
      aangesteld voor de uitvoering van de politietaak, en de militairen van de Koninklijke marechaussee, bedoeld
      in [artikel 141, onder c, van het Wetboek van Strafvordering][ref2], voor zover zij deze nodig hebben voor de
      strafrechtelijke handhaving van de rechtsorde,


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '141'
  - number: 15.2.e
    text: |-
      een landelijke eenheid als bedoeld in [artikel 25, eerste lid, onder b, van de Politiewet 2012][ref1], voor zover
      zij deze nodig heeft voor de strafrechtelijke handhaving van de rechtsorde, en ten behoeve van de vaststelling van
      de identiteit van de overleden slachtoffers, bedoeld in [artikel 14, vierde lid, onder a][ref2], en


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0012791#Artikel14
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '25'
      - id: ref2
        bwb_id: BWBR0012791
        artikel: '14'
        paragraaf: '4'
  - number: 15.2.f
    text: |-
      Onze Minister, voor zover hij deze nodig heeft ten behoeve van het ondersteunen van de leden van de rechterlijke
      macht, de ambtenaren van politie en de militairen van de Koninklijke marechaussee, bedoeld onder d, en ten behoeve
      van de uitvoering van zijn taken.
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel15
  - number: '15.3'
    text: |-
      Het instituut beperkt de verstrekking van gegevens aan de ambtenaren van politie en de militairen van de
      Koninklijke Marechaussee, bedoeld in het tweede lid, onder d, tot de naam van degene wiens DNA-profiel in de DNA-
      databank is vastgelegd, alsmede zijn geboortedatum, -plaats en -land of, indien deze gegevens onbekend zijn, andere
      gegevens waarmee zijn identiteit kan worden vastgesteld, alsmede het parketnummer dat bij het DNA-profiel hoort.
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel15
  - number: '15.4'
    text: |-
      Het instituut verstrekt aan de landelijke eenheid, bedoeld in het tweede lid, onder e, ten behoeve van de
      vaststelling van de identiteit van de overleden slachtoffers, bedoeld in [artikel 14, vierde lid, onder a][ref1],
      hun DNA-profielen, voor zover de identiteit van deze personen onbekend is, en beperkt de verstrekking van gegevens,
      voor zover het deze nodig heeft voor de strafrechtelijke handhaving van de rechtsorde, tot de strafzaken die
      nog niet zijn opgelost en in het kader waarvan een opdracht tot DNA-onderzoek is gegeven, waarbij vermelding
      plaatsvindt


      [ref1]: https://wetten.overheid.nl/BWBR0012791#Artikel14
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0012791
        artikel: '14'
        paragraaf: '4'
  - number: 15.4.a
    text: |-
      van het feit dat in die strafzaken geen celmateriaal is gevonden waaruit het DNA-profiel van een onbekende of
      bekende verdachte is verkregen, alsmede van de bij die strafzaken behorende proces-verbaalnummers,
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel15
  - number: 15.4.b
    text: |-
      van het feit dat in die strafzaken celmateriaal is gevonden waaruit het DNA-profiel van een of meer onbekende of
      bekende verdachten is verkregen, alsmede van de bij die strafzaken behorende proces-verbaalnummers en de naam,
      de geboortedatum en -plaats en het geboorteland van de bekende verdachte of verdachten of, indien deze gegevens
      onbekend zijn, andere gegevens waarmee de identiteit van de verdachte of de verdachten kan worden vastgesteld en
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel15
  - number: 15.4.c
    text: |-
      van het feit dat in meer van die strafzaken het DNA-profiel van een of meer dezelfde onbekende of bekende
      verdachten voorkomt, alsmede van de bij die strafzaken behorende proces-verbaalnummers en de naam, de geboortedatum
      en -plaats en het geboorteland van de bekende verdachte of verdachten of, indien deze gegevens onbekend zijn,
      andere gegevens waarmee de identiteit van de verdachte of de verdachten kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel15
  - number: '15.5'
    text: |-
      Het instituut beperkt de verstrekking van gegevens aan de Justitiële Informatiedienst tot de naam van degene wiens
      DNA-profiel in de DNA-databank is vastgelegd, alsmede zijn geboortedatum, -plaats en -land of, indien deze gegevens
      onbekend zijn, andere gegevens waarmee zijn identiteit kan worden vastgesteld, het nummer waaronder zijn DNA-
      profiel in de DNA-databank is vastgelegd en een melding van een overeenkomst tussen zijn DNA-profiel en het DNA-
      profiel van een onbekende verdachte.
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel15
  - number: '15.6'
    text: |-
      Het instituut verstrekt de gegevens slechts op schriftelijk verzoek, tenzij het een verstrekking aan de landelijke
      eenheid, bedoeld in het tweede lid, onder e, of de Justitiële Informatiedienst betreft. In de laatste gevallen
      vindt de verstrekking rechtstreeks langs geautomatiseerde weg plaats.
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel15
  - number: '15.7'
    text: |-
      Bij iedere verstrekking van gegevens wordt aantekening gehouden van de datum van de verstrekking, de identiteit van
      de verzoeker en de aard van de verstrekte gegevens.
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel15
  - number: '15.8'
    text: |-
      Zodra zich een omstandigheid als bedoeld in [artikel 16][ref1] of [18][ref2] voordoet op grond waarvan het
      instituut een DNA-profiel dat in de DNA-databank is vastgelegd, dient te vernietigen, stelt het instituut de
      landelijke eenheid, bedoeld in het tweede lid, onder e, en de Justitiële Informatiedienst daarvan in kennis.
      Terstond nadat de landelijke eenheid, bedoeld in het tweede lid, onder e, en de Justitiële Informatiedienst deze
      kennisgeving hebben ontvangen, vernietigen zij de gegevens die bij hen over dat profiel zijn vastgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0012791#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0012791#Artikel18
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0012791
        artikel: '16'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0012791
        artikel: '18'
        paragraaf: '4'
  - number: 15a
    text: |-
      Indien een ander laboratorium dan het laboratorium van het instituut voornemens is zijn werkzaamheden op het
      terrein van forensisch DNA-onderzoek te beëindigen, zorgt dat laboratorium ervoor dat de afschriften van de
      verslagen, bedoeld in [artikel 10, eerste lid][ref1], die bij dat laboratorium worden bewaard, en de andere
      gegevens die het in verband daarmee bewaart, voor de beëindiging van die werkzaamheden worden overgedragen aan het
      instituut, tenzij het laboratorium fuseert met een ander laboratorium als bedoeld in [artikel 7, derde lid][ref2].
      In het laatste geval worden de afschriften van de verslagen en de andere gegevens die het laboratorium in verband
      daarmee bewaart, in dat andere laboratorium bewaard.


      [ref1]: https://wetten.overheid.nl/BWBR0012791#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0012791#Artikel7
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0012791
        artikel: '10'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0012791
        artikel: '7'
        paragraaf: '3'
  - number: '16.1'
    text: |-
      Het instituut vernietigt het DNA-profiel van een verdachte terstond, zodra zich een omstandigheid voordoet die
      meebrengt dat hij niet langer kan worden aangemerkt als verdachte ter zake van een misdrijf als omschreven in
      [artikel 67, eerste lid, van de wet][ref1] en in het kader van het misdrijf het DNA-profiel is verwerkt en het een
      kennisgeving als bedoeld in [artikel 17, eerste lid][ref2], heeft ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel67
      [ref2]: https://wetten.overheid.nl/BWBR0012791#Artikel17
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '67'
      - id: ref2
        bwb_id: BWBR0012791
        artikel: '17'
        paragraaf: '4'
  - number: '16.2'
    text: |-
      Van een omstandigheid als bedoeld in het eerste lid is in ieder geval sprake bij een beslissing tot niet-
      vervolging, een kennisgeving van niet verdere vervolging, een onherroepelijke buitenvervolgingstelling, een
      rechterlijke verklaring dat de zaak geëindigd is, een onherroepelijke vrijspraak of een onherroepelijk ontslag van
      alle rechtsvervolging waarbij niet een maatregel als bedoeld in [artikel 37][ref1], [37a][ref2] juncto [37b][ref3]
      of [38][ref4], [38m][ref5] of [77s van het Wetboek van Strafrecht][ref6] is opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel37a
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel37b
      [ref4]: https://wetten.overheid.nl/BWBR0001854#Artikel38
      [ref5]: https://wetten.overheid.nl/BWBR0001854#Artikel38m
      [ref6]: https://wetten.overheid.nl/BWBR0001854#Artikel77s
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '37'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: 37a
      - id: ref3
        bwb_id: BWBR0001854
        artikel: 37b
      - id: ref4
        bwb_id: BWBR0001854
        artikel: '38'
      - id: ref5
        bwb_id: BWBR0001854
        artikel: 38m
      - id: ref6
        bwb_id: BWBR0001854
        artikel: 77s
  - number: '16.3'
    text: |-
      In afwijking van het eerste lid bewaart het instituut het DNA-profiel indien dat profiel in een
      andere zaak overeenkomt met het DNA-profiel van een onbekende verdachte en degene wiens DNA-profiel
      het betreft, in die zaak als een verdachte is aangemerkt ter zake van een misdrijf als omschreven in
      [artikel 67, eerste lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel67
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '67'
  - number: '16.4'
    text: |-
      Het instituut vernietigt met het DNA-profiel van de verdachte, bedoeld in het eerste lid, tevens de gegevens over
      hem, bedoeld in [artikel 6][ref1], het celmateriaal waaruit dat DNA-profiel is verkregen, het afschrift van het
      verslag, bedoeld in [artikel 10, eerste lid][ref2], indien het verslag is opgesteld door een deskundige die aan het
      laboratorium van het instituut is verbonden, en de andere gegevens die het instituut over hem heeft bewaard in het
      dossier over de strafzaak in het kader waarvan zijn DNA-profiel is bewaard.


      [ref1]: https://wetten.overheid.nl/BWBR0012791#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0012791#Artikel10
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0012791
        artikel: '6'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0012791
        artikel: '10'
        paragraaf: '3'
  - number: '16.5'
    text: |-
      [Artikel 13, vijfde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0012791#Artikel13
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0012791
        artikel: '13'
        paragraaf: '4'
  - number: '17.1'
    text: |-
      De Justitiële Informatiedienst stelt het instituut in kennis van een omstandigheid als bedoeld in
      [artikel 16, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012791#Artikel16
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0012791
        artikel: '16'
        paragraaf: '4'
  - number: '17.2'
    text: |-
      In afwijking van het eerste lid blijft een kennisgeving achterwege indien sprake is van een
      gewezen verdachte, tenzij die gewezen verdachte in een herzieningsprocedure als bedoeld in
      [Titel VIII van het Derde Boek van de wet][ref1] is vrijgesproken of ontslagen van alle rechtsvervolging.


      [ref1]: https://wetten.overheid.nl/BWBR0001903
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0001903
  - number: '17.3'
    text: |-
      Het instituut verstrekt de kennisgeving, bedoeld in het eerste lid, door aan het laboratorium waaraan de deskundige
      is verbonden die het DNA-onderzoek verricht of heeft verricht in het kader van het misdrijf waarin de kennisgeving
      is gedaan en de deskundige nog niet de verplichting, bedoeld in [artikel 10, derde lid, onder b][ref1], is
      nagekomen. [Artikel 16][ref2] is op dat laboratorium van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0012791#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0012791#Artikel16
    url: https://wetten.overheid.nl/BWBR0012791/2020-11-01#Artikel17
