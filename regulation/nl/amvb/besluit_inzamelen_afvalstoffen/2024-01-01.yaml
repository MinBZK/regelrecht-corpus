  - number: '2'
    text: Een aanvraag voor vermelding op de lijst van inzamelaars wordt gedaan bij de instantie.
    url: https://wetten.overheid.nl/BWBR0016530/2024-01-01#Artikel2
  - number: '3'
    text: |-
      Bij regeling van Onze Minister wordt bepaald op welke wijze de aanvraag geschiedt en welke gegevens daarbij worden
      verstrekt.
    url: https://wetten.overheid.nl/BWBR0016530/2024-01-01#Artikel3
  - number: '4'
    text: |-
      Een inzamelaar die staat vermeld op de lijst van inzamelaars, meldt een verandering van de gegevens, bedoeld in
      [artikel 3][ref1], onverwijld aan de instantie op een door Onze Minister te bepalen wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0016530#Artikel3
    url: https://wetten.overheid.nl/BWBR0016530/2024-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0016530
        artikel: '3'
        paragraaf: '2'
  - number: '6'
    text: |-
      De inzamelaar heeft tijdens het inzamelen een gewaarmerkte kopie, zichtbaar ten behoeve van de handhaving, aanwezig
      van het certificaat waaruit blijkt dat hij op de lijst van inzamelaars staat vermeld.
    url: https://wetten.overheid.nl/BWBR0016530/2024-01-01#Artikel6
  - number: '8'
    text: |-
      Het verbod, bedoeld in [artikel 10.45, eerste lid, van de Wet milieubeheer][ref1], om zonder vermelding op een
      lijst van inzamelaars bedrijfsafvalstoffen of gevaarlijke afvalstoffen in te zamelen, geldt niet voor het niet-
      beroepsmatig inzamelen van bedrijfsafvalstoffen of gevaarlijke afvalstoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10.45
    url: https://wetten.overheid.nl/BWBR0016530/2024-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10.45'
  - number: '9'
    text: |-
      Een vergunning van Onze Minister is vereist voor het inzamelen van:

      a. afgewerkte olie die voldoet aan de vereisten van
      [artikel 1, eerste lid, onderdeel c, onder 2°, het eerste tot en met vierde streepje][ref1], met uitzondering van
      afgewerkte olie afkomstig van schepen,

      b. klein gevaarlijk afval, met uitzondering van klein gevaarlijk afval afkomstig van schepen, of

      c. scheepsafvalstoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0016530#Artikel1
    url: https://wetten.overheid.nl/BWBR0016530/2024-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0016530
        artikel: '1'
        paragraaf: '1'
  - number: '10'
    text: |-
      1 De aanvraag om een vergunning bevat:

      a. een opgave van de afvalstoffen die de aanvrager wil inzamelen en de daarbij behorende code volgens de
      afvalstoffenlijst, genoemd in [artikel 1, eerste lid, van de Regeling Europese afvalstoffenlijst][ref1],

      b. een schatting van de hoeveelheid afvalstoffen die de aanvrager per jaar beoogt in te zamelen,

      c. een beschrijving van de procedures van acceptatie, administratieve organisatie en interne controle van de
      ingezamelde afvalstoffen,

      d. een beschrijving van de vervoermiddelen en installaties die bij de inzameling worden gebruikt,

      e. een beschrijving van de voorzieningen die worden getroffen om te voorkomen dat bij het inzamelen stagnatie
      optreedt, en

      f. een beschrijving van de wijze waarop de ingezamelde afvalstoffen verder worden beheerd.

      2 De aanvraag om een vergunning wordt gedaan met een daartoe door Onze Minister vastgesteld formulier.


      [ref1]: https://wetten.overheid.nl/BWBR0013546#Artikel1
    url: https://wetten.overheid.nl/BWBR0016530/2024-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0013546
        artikel: '1'
  - number: '11'
    text: |-
      1 Bij de aanvraag om een vergunning worden de volgende gegevens verstrekt:

      a. een niet ouder dan drie maanden zijnde verklaring omtrent het gedrag, afgegeven overeenkomstig de bepalingen van
      de [Wet op de justitiële documentatie en op de verklaringen omtrent het gedrag][ref1], van de natuurlijke persoon
      die permanent en daadwerkelijk leiding geeft aan het inzamelen, of indien de leiding bij meer personen berust, van
      ieder van hen,

      b. een niet ouder dan drie maanden zijnd bewijs dat de natuurlijke persoon of rechtspersoon die inzamelt, of indien
      meer natuurlijke personen of rechtspersonen gezamenlijk als zodanig optreden, door hen gezamenlijk, ten minste
      € 18 000 in eigen vermogen heeft of hebben, aan te tonen met een door een accountant ondertekende verklaring inzake
      het minimaal aanwezige risicodragend kapitaal, en

      c. een vakdiploma op het terrein van afvalstoffen dat is afgegeven door een instantie die door Onze Minister is
      erkend, ten behoeve van de natuurlijke persoon die permanent en daadwerkelijk leiding geeft aan het inzamelen, of
      indien de leiding bij meer personen berust, ten behoeve van ten minste een van hen.

      2 In afwijking van het eerste lid verstrekt een aanvrager, wiens land van oorsprong of herkomst een andere lidstaat
      van de Europese Unie is dan Nederland, dan wel een andere staat, die partij is bij de Overeenkomst betreffende de
      Europese Economische Ruimte, de volgende gegevens die in de betrokken staat zijn afgegeven:

      a. een gelijkwaardige niet ouder dan drie maanden zijnde verklaring omtrent betrouwbaarheid,

      b. een gelijkwaardige niet ouder dan drie maanden zijnde verklaring omtrent financiële draagkracht, afgegeven door
      banken dan wel door andere organen die de in de aanhef bedoelde staat daartoe heeft aangewezen, waaruit blijkt dat
      de aanvrager ten minste € 18 000 in eigen vermogen heeft, en

      c. een door een daartoe bevoegde instantie afgegeven verklaring waaruit blijkt dat de natuurlijke persoon die
      permanent en daadwerkelijk leiding geeft aan het inzamelen, of indien de leiding bij meer personen berust, ten
      minste een van hen vakbekwaam is op het gebied van afvalstoffen.

      3 In plaats van de gegevens, bedoeld in het eerste of tweede lid, kan de aanvrager de volgende gegevens
      verstrekken:

      a. het registratienummer van de communautaire vergunning, bedoeld in
      [artikel 1.1 van de Wet wegvervoer goederen][ref2], of van de vergunning, bedoeld in
      [artikel 7.1 van die wet][ref3];

      b. een kopie van een door een andere lidstaat van de Europese Unie afgegeven communautaire vergunning als
      bedoeld in [verordening (EEG) nr. 881/92](31992R0881) van de Raad van de Europese Gemeenschappen van 26 maart
      1992 betreffende de toegang tot de markt van het goederenvervoer over de weg in de Gemeenschap van of naar het
      grondgebied van een Lid-Staat of over het grondgebied van een of meer Lid-Staten (PbEG L 95);

      c. een vergunning als bedoeld in [artikel 28, eerste lid, van de Spoorwegwet][ref4] en een veiligheidscertificaat
      als bedoeld in [artikel 32, eerste lid, van de Spoorwegwet][ref5].

      4 In plaats van de gegevens, bedoeld in het eerste lid, onder c, of het tweede lid, onder
      c, kan de aanvrager een afschrift verstrekken van het bewijs van vakbekwaamheid, bedoeld in
      [artikel 6, eerste lid, van de Binnenvaartwet][ref6].


