  - number: 1b
    text: |-
      Bedrijfsafvalstoffen en gevaarlijke afvalstoffen die behoren tot een categorie van afvalstoffen
      als bedoeld in [bijlage II bij het Besluit activiteiten leefomgeving][ref1] en die gescheiden
      worden afgegeven, worden afzonderlijk ingezameld, tenzij in een vergunning, afgeven krachtens
      [artikel 10.48, eerste lid, van de Wet milieubeheer][ref2] anders is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0041330
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel10.48
    url: https://wetten.overheid.nl/BWBR0016530/2024-01-01#Artikel1b
