  - number: '15'
    text: |-
      Vergunningen voor het inzamelen van afgewerkte olie, klein gevaarlijk afval of scheepsafvalstoffen, die zijn
      verleend voor het tijdstip van inwerkingtreding van dit besluit, worden aangemerkt als vergunningen verleend op
      grond van dit besluit.
    url: https://wetten.overheid.nl/BWBR0016530/2024-01-01#Artikel15
  - number: '16'
    text: Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0016530/2024-01-01#Artikel16
  - number: '17'
    text: 'Dit besluit wordt aangehaald als: Besluit inzamelen afvalstoffen.'
    url: https://wetten.overheid.nl/BWBR0016530/2024-01-01#Artikel17
