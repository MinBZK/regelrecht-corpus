  - number: '14'
    text: |-
      1 In afwijking van [artikel 11, eerste en tweede lid][ref1], kan tot uiterlijk drie jaar na het tijdstip
      van inwerkingtreding van dit besluit worden volstaan met het verstrekken van de gegevens, bedoeld in
      [artikel 11, eerste lid, onderdelen a en b][ref2], of [artikel 11, tweede lid, onderdelen a en b][ref3].

      2 Indien toepassing wordt gegeven aan het eerste lid, verstrekt de aanvrager uiterlijk op het tijdstip,
      bedoeld in het eerste lid, de gegevens, bedoeld in [artikel 11, eerste lid, onderdeel c][ref4], of
      [artikel 11, tweede lid, onderdeel c][ref5].


