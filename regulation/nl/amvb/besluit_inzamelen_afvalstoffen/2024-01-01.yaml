    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 31 oktober
    2003, nr. MJZ2003108190, Centrale Directie Juridische Zaken, Afdeling Wetgeving;

    Gelet op richtlijn nr. 75/442/EEG van de Raad van de Europese Gemeenschappen van 15 juli 1975 betreffende
    afvalstoffen (PbEG L 194), zoals laatstelijk gewijzigd bij beschikking nr. 96/350/EG van de Commissie van de
    Europese Gemeenschappen van 24 mei 1996 houdende aanpassing ingevolge artikel 17 van de bijlagen II A en II B
