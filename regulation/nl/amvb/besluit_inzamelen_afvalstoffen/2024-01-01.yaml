    de verwijdering van afgewerkte olie (PbEG L 194), zoals gewijzigd door richtlijn nr. 87/101/EEG van de Raad van
    de Europese Gemeenschappen van 22 december 1986 tot wijziging van Richtlijn 75/439/EEG inzake de verwijdering van
    afgewerkte olie (PbEG L 42), alsmede de artikelen 10.45, tweede lid, 10.46 en 10.48, eerste lid, in samenhang met
    artikel 8.5, van de Wet milieubeheer;

    De Raad van State gehoord (advies van 23 januari 2004, no. W.08.03.0461/V);

    Gezien het nader rapport van de Staatssecretaris van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 16
