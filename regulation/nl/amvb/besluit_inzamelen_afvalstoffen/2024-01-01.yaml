  - number: '12'
    text: |-
      1 Degene die op het tijdstip van inwerkingtreding van dit besluit bedrijfsafvalstoffen of gevaarlijke afvalstoffen
      inzamelt waarvoor een vermelding op de lijst van inzamelaars is vereist, dient zo spoedig mogelijk doch uiterlijk
      binnen drie maanden na dat tijdstip een aanvraag in voor vermelding op de lijst van inzamelaars.

      2 De instantie verstrekt de aanvrager die een ontvankelijke aanvraag heeft ingediend per omgaand een bewijs van
      ontvangst.

      3 Voor de aanvrager die onmiddellijk voor het tijdstip van inwerkingtreding van dit besluit stond vermeld op de
      lijst van inzamelaars, blijft deze vermelding geldig totdat is beslist op de aanvraag.

      4 Voor de aanvrager die onmiddellijk voor het tijdstip van inwerkingtreding van dit besluit beschikt over een
      rechtsgeldige vergunning voor het inzamelen van de afvalstoffen, bedoeld in het eerste lid, geldt die vergunning
      als een vermelding op de lijst totdat is beslist op de aanvraag.

      5 In andere gevallen dan bedoeld in het derde en vierde lid, geldt het bewijs van ontvangst van een ontvankelijke
      aanvraag als vermelding op de lijst van inzamelaars totdat is beslist op de aanvraag.
    url: https://wetten.overheid.nl/BWBR0016530/2024-01-01#Artikel12
  - number: '13'
    text: |-
      1 Degene die op het tijdstip van inwerkingtreding van dit besluit bedrijfsafvalstoffen of gevaarlijke afvalstoffen
      inzamelt waarvoor een vergunning is vereist, maar waarvoor voor dat tijdstip geen vergunning was vereist, dient zo
      spoedig mogelijk doch uiterlijk binnen drie maanden na dat tijdstip een aanvraag om een vergunning in.

      2 Onze Minister verstrekt de aanvrager die een ontvankelijke aanvraag heeft ingediend per omgaand een bewijs
      van ontvangst van de aanvraag. Dit bewijs geldt als een vergunning als bedoeld in [artikel 9][ref1] totdat op de
      aanvraag is beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0016530#Artikel9
    url: https://wetten.overheid.nl/BWBR0016530/2024-01-01#Artikel13
