articles:
  - number: '1'
    text: |-
      1 In dit besluit wordt verstaan onder:

      a. beschikking nr. 2000/532/EG: beschikking nr. 2000/532/EG van de Commissie van de Europese Gemeenschappen
      van 3 mei 2000 tot vervanging van beschikking nr. 94/3/EG houdende vaststelling van een lijst van afvalstoffen
      overeenkomstig artikel 1, onder a), van [Richtlijn 75/442/EEG](31975L0442) van de Raad van de Europese
      Gemeenschappen betreffende afvalstoffen en Beschikking nr. 94/904/EG van de Raad van de Europese Unie tot
      vaststelling van een lijst van gevaarlijke afvalstoffen overeenkomstig artikel 1, lid 4, van [Richtlijn nr. 91/689/
      EEG](31991L0689) van de Raad van de Europese Gemeenschappen betreffende gevaarlijke afvalstoffen (PbEG L 226/3);

      b. afgewerkte olie: elke soort minerale of synthetische smeerolie of industriële olie die ongeschikt is geworden
      voor het gebruik waarvoor zij oorspronkelijk bestemd was, waaronder in ieder geval worden begrepen gebruikte olie
      van verbrandingsmotoren en versnellingsbakken, alsmede smeerolie, olie voor turbines en hydraulische oliën;

      c. klein gevaarlijk afval: gevaarlijke afvalstoffen als bedoeld in een van de volgende categorieën waarvan de
      houder zich ontdoet door afgifte:

      1º. in een hoeveelheid van ten hoogste 200 kilogram per afvalstof per afgifte:

        - laboratoriumchemicaliën;
        - restanten van de toepassing van amalgaam in de tandheelkunde;
        - afvalstoffen afkomstig van de toepassing van verven, lakken, beitsen en andere soortgelijke vloeibare en pasteuze
      middelen;
        - fotografisch gevaarlijke afvalstoffen;
        - zuren, logen, galvanische en etsbaden die zijn gebruikt voor de reiniging of bewerking van metaaloppervlakken,
      voor het opbrengen van een beschermende metaallaag op producten of halffabrikaten dan wel voor het ontlakken van
      geverfde producten;

      2°. in een hoeveelheid van ten hoogste 200 liter per afgifte in verpakking: afgewerkte olie, indien:

        - het gehalte aan polychloorbifenylen kleiner is dan of gelijk is aan 0,5 mg/kg (as received) per congeneer 28, 52,
      101, 118, 138, 153 of 180;
        - het gehalte aan organische halogeenverbindingen, berekend als chloor kleiner is dan of gelijk is aan 1.000 mg/kg
      (as received);
        - de olie na het gebruik waarvoor zij oorspronkelijk was bestemd niet vermengd is met andere stoffen, en
        - de olie na het gebruik waarvoor zij oorspronkelijk was bestemd, separaat is verzameld en opgeslagen;

      d. scheepsafvalstoffen: afvalstoffen die bij het in bedrijf zijn of het onderhoud van een schip aan boord ontstaan,
      bestaande uit:

      1º. bilgewater, afgewerkte olie en overige olie- en vethoudende afvalstoffen,

      2º. gevaarlijke afvalstoffen die vrijkomen bij reinigingswerkzaamheden,

      3º. andere afvalstoffen dan bedoeld onder 1° of 2°, voorzover het gevaarlijke afvalstoffen betreft;

      e. lijst van inzamelaars: lijst van inzamelaars als bedoeld in
      [artikel 10.45, eerste lid, onder a, van de Wet milieubeheer][ref1];

      f. instantie: instantie als bedoeld in [artikel 10.45, derde lid, van de Wet milieubeheer][ref2].

      2 Een wijziging van de bijlage bij beschikking nr. 2000/532/EG gaat voor de toepassing van dit besluit gelden met
      ingang van de dag waarop aan die wijziging uitvoering moet zijn gegeven, tenzij bij ministerieel besluit, dat in de
      Staatscourant wordt bekendgemaakt, een ander tijdstip wordt vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10.45
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel10.45
