    Zaken en Wetgeving, gedaan mede namens Onze Minister van Landbouw, Natuur en Voedselkwaliteit;

    Gelet op de artikelen 2.24, eerste lid, 4.3, eerste lid, 12.24, vierde lid, 12.37, derde lid, 13.11, eerste en
    tweede lid, 13.15, derde lid, 13.17, tweede lid, 13.20, zesde lid, 13.22, eerste lid, 16.139, eerste lid, en 18.3
    van de Omgevingswet, artikel 44, eerste lid, van de Uitvoeringswet grondkamers, artikel 15, tweede lid, van de
    Vorderingswet 1962 en artikel 2, eerste lid, van de Wet kenbaarheid publiekrechtelijke beperkingen onroerende
    zaken;

    De Afdeling advisering van de Raad van State gehoord (advies van 16 september 2020, nr. W04.20.0069/I);

