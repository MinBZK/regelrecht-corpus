---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_bescherming_waterleidingbedrijven_1989
regulatory_layer: AMVB
publication_date: '2009-09-03'
valid_from: '1994-01-01'
bwb_id: BWBR0004603
url: https://wetten.overheid.nl/BWBR0004603/1994-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 11 juli 1988,
    Directoraat-Generaal Milieubeheer, Directie Drinkwater, Water en Bodem, Hoofdafdeling Drinkwater, nr. 1178407,
    Centrale Directie Juridische Zaken, Afdeling Wetgeving, nr. MJZ 1178016;

    Overwegende, dat als gevolg van het grotendeels intrekken van de Wet bescherming bevolking het Besluit bescherming
    waterleidingbedrijven dient te worden vervangen;

    Gelet op artikel 14a van de Waterleidingwet (Stb. 1957, 150) en artikel 29 van de Intrekkingswet BB (Stb. 1986,
    312);

    Gezien het advies van de Raad voor de Drinkwatervoorziening van 19 februari 1988;

    De Raad van State gehoord (advies van 28 september 1988, nr. W08.88.0413);

    Gezien het nader rapport van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 17 juli
    1989, Centrale Directie Juridische Zaken, Afdeling Wetgeving, nr. MJZ 17789035;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0004603/1994-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt onder wet verstaan: de [Waterleidingwet][ref1] (*Stb.*
      1957, 150).


      [ref1]: https://wetten.overheid.nl/BWBR0002246
    url: https://wetten.overheid.nl/BWBR0004603/1994-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002246
  - number: '2.1'
    text: |-
      De eigenaar van een waterleidingbedrijf neemt voor de instandhouding van de openbare drinkwatervoorziening in
      buitengewone omstandigheden als bedoeld in artikel 14*a* van de wet, in ieder geval de maatregelen die in de
      bij dit besluit behorende bijlage zijn aangegeven, in overeenstemming met een beschermingsplan als bedoeld in
      [artikel 3][ref1], waarvoor een verklaring van geen bezwaar is afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0004603#Artikel3
    url: https://wetten.overheid.nl/BWBR0004603/1994-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0004603
        artikel: '3'
  - number: '2.2'
    text: |-
      De eigenaar vormt een beschermingsorganisatie en houdt deze vervolgens in stand. Hij wijst het hoofd van deze
      beschermingsorganisatie aan.
    url: https://wetten.overheid.nl/BWBR0004603/1994-01-01#Artikel2
  - number: '3'
    text: |-
      De eigenaar van een waterleidingbedrijf draagt zorg voor de vaststelling van een beschermingsplan. In het plan
      worden in ieder geval aangegeven:
    url: https://wetten.overheid.nl/BWBR0004603/1994-01-01#Artikel3
  - number: 3.a
    text: het tijdstip waarop elk van de in de bij dit besluit behorende bijlage aangegeven maatregelen zal zijn uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0004603/1994-01-01#Artikel3
  - number: 3.b
    text: de taak van de beschermingsorganisatie en de taakverdeling in deze organisatie.
    url: https://wetten.overheid.nl/BWBR0004603/1994-01-01#Artikel3
  - number: '4.1'
    text: |-
      Binnen vier weken na de vaststelling van het beschermingsplan dient de eigenaar van het waterleidingbedrijf het in
      bij Onze Minister.
    url: https://wetten.overheid.nl/BWBR0004603/1994-01-01#Artikel4
  - number: '4.2'
    text: |-
      Hij verstrekt op verzoek van Onze Minister de gegevens, die deze nodig heeft om het beschermingsplan te kunnen
      beoordelen.
    url: https://wetten.overheid.nl/BWBR0004603/1994-01-01#Artikel4
  - number: '5.1'
    text: Het beschermingsplan behoeft een verklaring van geen bezwaar van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0004603/1994-01-01#Artikel5
  - number: '5.2'
    text: |-
      De afgifte van de verklaring van geen bezwaar wordt slechts geweigerd, indien het beschermingsplan naar het
      oordeel van Onze Minister niet voorziet in een redelijke bescherming van de openbare drinkwatervoorziening door het
      betrokken waterleidingbedrijf.
    url: https://wetten.overheid.nl/BWBR0004603/1994-01-01#Artikel5
  - number: '5.3'
    text: |-
      Onze Minister doet van de afgifte van de verklaring van geen bezwaar of de weigering ervan schriftelijk mededeling
      aan Onze Minister van Binnenlandse Zaken, alsmede aan burgemeester en wethouders van de gemeenten in het
      voorzieningsgebied van het betrokken waterleidingbedrijf.
    url: https://wetten.overheid.nl/BWBR0004603/1994-01-01#Artikel5
  - number: '6.1'
    text: |-
      In het geval van weigering van de verklaring wijzigt de eigenaar het plan binnen een door Onze Minister aan te
      geven termijn met inachtneming van de door deze gemaakte opmerkingen.
    url: https://wetten.overheid.nl/BWBR0004603/1994-01-01#Artikel6
  - number: '6.2'
    text: Hij dient het plan binnen vier weken na wijziging in bij Onze Minister.
    url: https://wetten.overheid.nl/BWBR0004603/1994-01-01#Artikel6
  - number: '6.3'
    text: |-
      De [artikelen 4, tweede lid][ref1], en [5][ref2] zijn van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004603#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0004603#Artikel5
    url: https://wetten.overheid.nl/BWBR0004603/1994-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0004603
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0004603
        artikel: '5'
  - number: '7.1'
    text: |-
      Indien de eigenaar van een waterleidingbedrijf van oordeel is dat het beschermingsplan waarvoor een verklaring van
      geen bezwaar is afgegeven, niet langer voorziet in een redelijke bescherming van de openbare drinkwatervoorziening
      door het betrokken waterleidingbedrijf, wijzigt hij het plan.
    url: https://wetten.overheid.nl/BWBR0004603/1994-01-01#Artikel7
  - number: '7.2'
    text: |-
      De [artikelen 4, tweede lid][ref1], [5][ref2] en [6, eerste en tweede lid][ref3], zijn van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004603#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0004603#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0004603#Artikel6
    url: https://wetten.overheid.nl/BWBR0004603/1994-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0004603
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0004603
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0004603
        artikel: '6'
  - number: '8.1'
    text: |-
      Indien naar het oordeel van Onze Minister een beschermingsplan, waarvoor een verklaring van geen bezwaar is
      afgegeven, niet langer voorziet in een redelijke bescherming van de openbare drinkwatervoorziening door het
      betrokken waterleidingbedrijf, kan hij de eigenaar opdragen het plan binnen een door hem aan te geven termijn te
      wijzigen.
    url: https://wetten.overheid.nl/BWBR0004603/1994-01-01#Artikel8
  - number: '8.2'
    text: |-
      Onze Minister van Binnenlandse Zaken alsmede burgemeester en wethouders van de gemeenten in het voorzieningsgebied
      van het betrokken waterleidingbedrijf worden schriftelijk in kennis gesteld van dit besluit.
    url: https://wetten.overheid.nl/BWBR0004603/1994-01-01#Artikel8
  - number: '8.3'
    text: |-
      De eigenaar van het waterleidingbedrijf wijzigt het beschermingsplan met inachtneming van de door Onze Minister
      gemaakte opmerkingen.
    url: https://wetten.overheid.nl/BWBR0004603/1994-01-01#Artikel8
  - number: '8.4'
    text: |-
      De [artikelen 4, tweede lid][ref1], [5][ref2] en [6, eerste en tweede lid][ref3], zijn van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004603#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0004603#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0004603#Artikel6
    url: https://wetten.overheid.nl/BWBR0004603/1994-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004603
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0004603
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0004603
        artikel: '6'
  - number: '9.1'
    text: Het Besluit bescherming waterleidingbedrijven (*Stb.* 1963, 381) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0004603/1994-01-01#Artikel9
  - number: '9.2'
    text: |-
      Beschermingsplannen waarvoor op grond van het in het eerste lid genoemde besluit een verklaring van geen bezwaar is
      afgegeven, worden gelijkgesteld met plannen die overeenkomstig dit besluit tot stand zijn gekomen.
    url: https://wetten.overheid.nl/BWBR0004603/1994-01-01#Artikel9
  - number: '9.3'
    text: |-
      Beschermingsorganisaties die tot stand zijn gekomen op grond van het in het eerste lid bedoelde besluit, worden
      gelijkgesteld met organisaties die overeenkomstig dit besluit zijn gevormd.
    url: https://wetten.overheid.nl/BWBR0004603/1994-01-01#Artikel9
  - number: '12'
    text: 'Dit besluit kan worden aangehaald als: Besluit bescherming waterleidingbedrijven 1989.'
    url: https://wetten.overheid.nl/BWBR0004603/1994-01-01#Artikel12
