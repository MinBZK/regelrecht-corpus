articles:
  - number: '24'
    text: >-
      1


      2 Een aanhangwagen of oplegger, die behoort tot de fabrieks- of handelsvoorraad van een bedrijf, of die voor
      herstel of bewerking ter beschikking is gesteld van een bedrijf, mag met een motorrijtuig over een weg worden
      voortbewogen, ook indien voor die aanhangwagen of oplegger geen registratiebewijs is afgegeven, mits aan dat
      bedrijf, ingevolge het derde lid een bijzonder registratiebewijs is afgegeven dat zijn geldigheid niet heeft
      verloren en waarvan gebruik wordt gemaakt volgens de in het vierde lid bedoelde voorschriften.


      3 Met inachtneming van door Onze Minister vast te stellen regelen kan de Directeur aan een bedrijf op aanvraag één
      of meer bijzondere kentekenbewijzen of registratiebewijzen afgeven, tegen betaling van de kosten daarvan.


      4 De Directeur geeft voorschriften omtrent de gevallen waarin en de wijze waarop van een bijzonder kentekenbewijs
      of registratiebewijs gebruik mag worden gemaakt.
