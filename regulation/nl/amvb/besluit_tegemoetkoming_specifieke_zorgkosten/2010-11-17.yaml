  - number: '4'
    text: |-
      1 Indien als gevolg van een navorderingsaanslag inkomstenbelasting of een ambtshalve vermindering blijkt dat
      de beschikking, bedoeld in [artikel 3][ref1], ten onrechte of tot een onjuist bedrag is vastgesteld, stelt de
      inspecteur de tegemoetkoming, onder verrekening van de eerder vastgestelde tegemoetkoming, opnieuw bij beschikking
      vast binnen zes maanden na het tijdstip waarop de navorderingsaanslag onherroepelijk is geworden, onderscheidenlijk
      binnen zes maanden na de dagtekening van de beschikking inzake ambtshalve vermindering. Artikel 3, derde lid,
      tweede volzin, is hierbij van overeenkomstige toepassing.

      2 Indien uit anderen hoofde dan bedoeld in het eerste lid blijkt dat de beschikking, bedoeld in [artikel 3][ref2],
      ten onrechte of tot een onjuist bedrag is vastgesteld, stelt de inspecteur de tegemoetkoming opnieuw bij
      beschikking vast binnen een jaar na de dagtekening van de beschikking, bedoeld in artikel 3. De eerste volzin is
      niet van toepassing wanneer de inspecteur ten tijde van de vaststelling van de beschikking, bedoeld in artikel 3,
      bekend was of redelijkerwijs bekend had kunnen zijn met de feiten die aanleiding geven tot het opnieuw vaststellen
      van de tegemoetkoming, tenzij blijkt dat de belastingplichtige of zijn partner ter zake van deze feiten te kwader
      trouw is.

      3 Indien blijkt dat de beschikking, bedoeld in [artikel 3][ref3], ten onrechte achterwege is gebleven, stelt de
      inspecteur de beschikking alsnog vast binnen acht weken nadat hij met dit feit bekend is geworden.

      4 Toepassing van het eerste, tweede en derde lid blijft achterwege indien:

      a. het bij toepassing van het eerste of tweede lid terug te vorderen bedrag niet meer zou bedragen dan € 50;

      b. het bij toepassing van het eerste, tweede of derde lid uit te betalen bedrag niet meer zou bedragen dan € 15.


      [ref1]: https://wetten.overheid.nl/BWBR0027859#Artikel3
