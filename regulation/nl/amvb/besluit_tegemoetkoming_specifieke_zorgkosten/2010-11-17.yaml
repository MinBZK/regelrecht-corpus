        artikel: '9.6'
  - number: '2'
    text: |-
      1 De belastingplichtige bij wie bij de vaststelling van de aanslag inkomstenbelasting over een kalenderjaar
      uitgaven voor specifieke zorgkosten in aanmerking zijn genomen, heeft aanspraak op een tegemoetkoming indien
      de gecombineerde inkomensheffing over dat kalenderjaar lager is dan de gecombineerde heffingskorting over dat
      kalenderjaar.

      2 Voor de berekening van de tegemoetkoming wordt verstaan onder:

      a. *factor A:* de gecombineerde inkomensheffing over het kalenderjaar;

      b. *factor B:* de gecombineerde heffingskorting over het kalenderjaar;

      c. *factor C:* de gecombineerde inkomensheffing over het kalenderjaar, indien bij de berekening daarvan de uitgaven
      voor specifieke zorgkosten niet in aanmerking zouden zijn genomen, met dien verstande dat de overige onderdelen van
      de persoonsgebonden aftrek hierbij op een gelijk bedrag worden gesteld als in aanmerking genomen bij de factor A.

      3 Indien factor C kleiner is dan factor B, is de tegemoetkoming gelijk aan het verschil tussen factor C en factor
      A. In andere gevallen is de tegemoetkoming gelijk aan het verschil tussen factor B en factor A.

      4 Indien de belastingplichtige in het kalenderjaar een partner heeft, hebben de belastingplichtige en zijn partner
      in afwijking in zoverre van het eerste lid een gezamenlijke aanspraak op een tegemoetkoming die wordt berekend met
      toepassing van het vijfde lid.

      5 De berekening van de tegemoetkoming, bedoeld in het vierde lid, vindt plaats overeenkomstig het tweede en
      derde lid, waarbij in afwijking in zoverre van het tweede lid het gezamenlijke bedrag van de gecombineerde
      inkomensheffing, het gezamenlijke bedrag van de gecombineerde heffingskorting en het gezamenlijke bedrag van de
      uitgaven voor specifieke zorgkosten van de belastingplichtige en zijn partner in aanmerking worden genomen.

      6 Indien het eerste lid niet van toepassing is, ontstaat eveneens een aanspraak op een tegemoetkoming indien als
      gevolg van een navorderingsaanslag inkomstenbelasting of een ambtshalve vermindering over een kalenderjaar uitgaven
      voor specifieke zorgkosten in aanmerking zijn genomen en de gecombineerde inkomensheffing over dat kalenderjaar
      lager is dan de gecombineerde heffingskorting over dat kalenderjaar. Het tweede tot en met vijfde lid zijn daarbij
      van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0027859/2010-11-17#Artikel2
  - number: '3'
    text: |-
      1 De tegemoetkoming wordt door de inspecteur vastgesteld bij beschikking. De beschikking wordt afgegeven aan degene
      bij wie uitgaven voor specifieke zorgkosten in aanmerking zijn genomen. Indien de tegemoetkoming niet meer bedraagt
      dan € 15, wordt geen tegemoetkoming vastgesteld.

      2 Indien zowel bij de belastingplichtige als bij zijn partner uitgaven voor specifieke zorgkosten in aanmerking
      zijn genomen, wordt de beschikking in afwijking van het eerste lid, tweede volzin, afgegeven aan degene met het
      hoogste verzamelinkomen. Indien het verzamelinkomen van de belastingplichtige en het verzamelinkomen van zijn
      partner aan elkaar gelijk zijn, wordt de beschikking afgegeven aan degene met de hoogste leeftijd.

      3 De inspecteur stelt de tegemoetkoming vast binnen zes maanden na het tijdstip waarop de aanslag
      inkomstenbelasting van de belastingplichtige onherroepelijk is geworden. Bij een gezamenlijke aanspraak als bedoeld
      in [artikel 2, vierde lid][ref1], stelt de inspecteur de tegemoetkoming vast binnen zes maanden na het tijdstip
      waarop zowel de aanslag inkomstenbelasting van de belastingplichtige als de aanslag inkomstenbelasting van zijn
      partner onherroepelijk zijn geworden. Indien ingevolge [artikel 9.4 van de Wet inkomstenbelasting 2001][ref2]
      geen aanslag inkomstenbelasting over het kalenderjaar aan de partner wordt opgelegd, stelt de inspecteur
      de tegemoetkoming bij een gezamenlijke aanspraak vast binnen zes maanden na het tijdstip waarop de aanslag
      inkomstenbelasting van de belastingplichtige onherroepelijk is geworden.

      4 Ingeval de aanspraak op de tegemoetkoming eerst ontstaat als gevolg van een navorderingsaanslag of een
      ambtshalve vermindering, stelt de inspecteur de tegemoetkoming vast binnen zes maanden na het tijdstip waarop de
      navorderingsaanslag van de belastingplichtige onherroepelijk is geworden, onderscheidenlijk binnen zes maanden
      na de dagtekening van de beschikking inzake ambtshalve vermindering. Het derde lid, tweede en derde volzin, zijn
      hierbij van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0027859#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel9.4
    url: https://wetten.overheid.nl/BWBR0027859/2010-11-17#Artikel3
