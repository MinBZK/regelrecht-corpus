preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Volksgezondheid, Welzijn en Sport van 19 januari 2010, kenmerk DWJZ/SWW-
    2979296, gedaan mede namens de Staatssecretaris van Financiën en in overeenstemming met Onze Minister van Justitie
    en Onze Minister voor Wonen, Wijken en Integratie;

    Gelet op artikel 24 van de Wet tegemoetkoming chronisch zieken en gehandicapten, artikel 24, tweede lid, van de Wet
    bescherming persoonsgegevens, artikel 6.1, vierde lid, van de Wet inkomstenbelasting 2001, artikel 6, vierde lid,
    van de Algemene Wet Bijzondere Ziektekosten en artikel 55, zesde lid, van de Wet op de huurtoeslag;

    De Raad van State gehoord (advies van 10 februari 2010, no. W13.09.0466/I);

    Gezien het nader rapport van Onze Minister van Volksgezondheid, Welzijn en Sport van 25 mei 2010, DWJZ/SWW-3003737,
    uitgebracht mede namens Onze Minister van Financiën en in overeenstemming met Onze Minister voor Wonen, Wijken
    en Integratie;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0027859/2010-11-17#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. *belastingplichtige:* een belastingplichtige als bedoeld in
      [artikel 2.1 van de Wet inkomstenbelasting 2001][ref1];

      b. *aanslag:* een aanslag als bedoeld in [artikel 11 van de Algemene wet inzake rijksbelastingen][ref2];

      c. *uitgaven voor specifieke zorgkosten:* uitgaven voor specifieke zorgkosten als bedoeld in
      [afdeling 6.5 van de Wet inkomstenbelasting 2001][ref3];

      d. *gecombineerde inkomensheffing:* het bedrag van de gecombineerde inkomensheffing, bedoeld in
      [artikel 8.1, onderdeel b, van de Wet inkomstenbelasting 2001][ref4];

      e. *gecombineerde heffingskorting:* het bedrag van de gecombineerde heffingskorting, bedoeld in
      [artikel 8.1, onderdeel d, van de Wet inkomstenbelasting 2001][ref5], dat in aanmerking zou zijn genomen indien
      [artikel 8.8 van die wet][ref6] buiten toepassing zou zijn gebleven;

      f. *persoonsgebonden aftrek:* de persoongebonden aftrek, bedoeld in
      [artikel 6.1, eerste lid, van de Wet inkomstenbelasting 2001][ref7];

      g. *partner:* een partner als bedoeld in [artikel 1.2 van de Wet inkomstenbelasting 2001][ref8] die het gehele
      kalenderjaar als zodanig is aan te merken dan wel voor de toepassing van [artikel 2.17 van die wet][ref9] geacht
      wordt het gehele kalenderjaar partner te zijn geweest;

      h. *inspecteur:* de functionaris van de rijksbelastingdienst die als zodanig bij regeling van Onze Minister van
      Financiën is aangewezen;

      i. *ontvanger:* de functionaris van de rijksbelastingdienst die als zodanig bij regeling van Onze Minister van
      Financiën is aangewezen;

      j. *verzamelinkomen:* het verzamelinkomen, bedoeld in [artikel 2.18 van de Wet inkomstenbelasting 2001][ref10];

      k. *navorderingsaanslag:* een navorderingsaanslag als bedoeld in
      [artikel 16 van de Algemene wet inzake rijksbelastingen][ref11];

      l. *ambtshalve vermindering:* een ambtshalve vermindering als bedoeld in
      [artikel 9.6 van de Wet inkomstenbelasting 2001][ref12] van een aanslag of navorderingsaanslag inkomstenbelasting.


