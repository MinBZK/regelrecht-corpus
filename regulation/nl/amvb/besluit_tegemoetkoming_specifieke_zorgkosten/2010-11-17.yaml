  - number: '5'
    text: |-
      De ontvanger is belast met de uitbetaling van een door de inspecteur vastgestelde tegemoetkoming en is belast met
      de invordering van een door de inspecteur vastgesteld bedrag aan terugvordering van tegemoetkoming.
    url: https://wetten.overheid.nl/BWBR0027859/2010-11-17#Artikel5
  - number: '6'
    text: |-
      1 Indien een belastingplichtige bij wie over een kalenderjaar uitgaven voor specifieke zorgkosten in aanmerking
      zijn genomen zeven maanden na het tijdstip waarop de aanslag inkomstenbelasting over dat jaar onherroepelijk is
      geworden geen beschikking tegemoetkoming specifieke zorgkosten over dat jaar heeft ontvangen, en hij van mening
      is dat hij daar wel recht op heeft, kan hij binnen een jaar na het verstrijken van de genoemde termijn van zeven
      maanden een verzoek om toekenning van een tegemoetkoming indienen bij de inspecteur. Binnen acht weken na de
      ontvangst van het verzoek stelt de inspecteur met toepassing van [artikel 3][ref1] een tegemoetkoming vast of wijst
      hij het verzoek bij beschikking af.

      2 In afwijking in zoverre van het eerste lid geldt bij een gezamenlijke aanspraak een termijn van
      zeven maanden na het tijdstip waarop zowel de aanslag inkomstenbelasting van de belastingplichtige
      als de aanslag inkomstenbelasting van zijn partner onherroepelijk zijn geworden. Indien ingevolge
      [artikel 9.4 van de Wet inkomstenbelasting 2001][ref2] geen aanslag inkomstenbelasting over het kalenderjaar aan de
      partner wordt opgelegd, geldt bij een gezamenlijke aanspraak een termijn van zeven maanden na het tijdstip waarop
      de aanslag van de belastingplichtige onherroepelijk is geworden.

      3 Ingeval de aanspraak op de tegemoetkoming eerst ontstaat als gevolg van een navorderingsaanslag of een
      ambtshalve vermindering, zijn het eerste en tweede lid van overeenkomstige toepassing, met dien verstande dat
      de termijn voor het indienen van het verzoek om toekenning van een tegemoetkoming in dat geval aanvangt zeven
      maanden na het tijdstip waarop de navorderingsaanslag inkomstenbelasting over dat jaar onherroepelijk is geworden
      onderscheidenlijk zeven maanden na de dagtekening van de beschikking inzake de ambtshalve vermindering.

      4 Het eerste, tweede en derde lid zijn van overeenkomstige toepassing met betrekking tot het niet toepassen van
      [artikel 4][ref3].


