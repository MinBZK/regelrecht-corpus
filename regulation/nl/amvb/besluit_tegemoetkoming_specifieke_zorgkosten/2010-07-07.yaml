  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0027859/2010-07-07#Artikel1
  - number: 1.a
    text: |-
      *belastingplichtige:* een belastingplichtige als bedoeld in [artikel 2.1 van de Wet inkomstenbelasting 2001][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel2
    url: https://wetten.overheid.nl/BWBR0027859/2010-07-07#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '2'
  - number: 1.b
    text: |-
      *aanslag:* een aanslag als bedoeld in [artikel 11 van de Algemene wet inzake rijksbelastingen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel11
    url: https://wetten.overheid.nl/BWBR0027859/2010-07-07#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '11'
  - number: 1.c
    text: |-
      *uitgaven voor specifieke zorgkosten:* uitgaven voor specifieke zorgkosten als bedoeld in
      [afdeling 6.5 van de Wet inkomstenbelasting 2001][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Afdeling6.5
    url: https://wetten.overheid.nl/BWBR0027859/2010-07-07#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0011353
        afdeling: '6.5'
  - number: 1.d
    text: |-
      *gecombineerde inkomensheffing:* het bedrag van de gecombineerde inkomensheffing, bedoeld in
      [artikel 8.1, onderdeel b, van de Wet inkomstenbelasting 2001][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel8
    url: https://wetten.overheid.nl/BWBR0027859/2010-07-07#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '8'
  - number: 1.e
    text: |-
      *gecombineerde heffingskorting:* het bedrag van de gecombineerde heffingskorting, bedoeld in
      [artikel 8.1, onderdeel d, van de Wet inkomstenbelasting 2001][ref1], dat in aanmerking zou zijn genomen indien
      [artikel 8.8 van die wet][ref2] buiten toepassing zou zijn gebleven;


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel8
    url: https://wetten.overheid.nl/BWBR0027859/2010-07-07#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '8'
  - number: 1.f
    text: |-
      *persoonsgebonden aftrek:* de persoongebonden aftrek, bedoeld in
      [artikel 6.1, eerste lid, van de Wet inkomstenbelasting 2001][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel6
    url: https://wetten.overheid.nl/BWBR0027859/2010-07-07#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '6'
  - number: 1.g
    text: |-
      *partner:* een partner als bedoeld in [artikel 1.2 van de Wet inkomstenbelasting 2001][ref1] die het gehele
      kalenderjaar als zodanig is aan te merken dan wel voor de toepassing van [artikel 2.17 van die wet][ref2] geacht
      wordt het gehele kalenderjaar partner te zijn geweest;


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel2
    url: https://wetten.overheid.nl/BWBR0027859/2010-07-07#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '2'
  - number: 1.h
    text: |-
      *inspecteur:* de functionaris van de rijksbelastingdienst die als zodanig bij regeling van Onze Minister van
      Financiën is aangewezen;
    url: https://wetten.overheid.nl/BWBR0027859/2010-07-07#Artikel1
  - number: 1.i
    text: |-
      *ontvanger:* de functionaris van de rijksbelastingdienst die als zodanig bij regeling van Onze Minister van
      Financiën is aangewezen;
    url: https://wetten.overheid.nl/BWBR0027859/2010-07-07#Artikel1
  - number: 1.j
    text: |-
      *verzamelinkomen:* het verzamelinkomen, bedoeld in [artikel 2.18 van de Wet inkomstenbelasting 2001][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel2
    url: https://wetten.overheid.nl/BWBR0027859/2010-07-07#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '2'
  - number: 1.k
    text: |-
      *navorderingsaanslag:* een navorderingsaanslag als bedoeld in
      [artikel 16 van de Algemene wet inzake rijksbelastingen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel16
    url: https://wetten.overheid.nl/BWBR0027859/2010-07-07#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '16'
  - number: 1.l
    text: |-
      *ambtshalve vermindering:* een ambtshalve vermindering als bedoeld in
      [artikel 65 van de Algemene wet inzake rijksbelastingen][ref1] van een aanslag of navorderingsaanslag
      inkomstenbelasting.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel65
    url: https://wetten.overheid.nl/BWBR0027859/2010-07-07#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '65'
  - number: '2.1'
    text: |-
      De belastingplichtige bij wie bij de vaststelling van de aanslag inkomstenbelasting over een kalenderjaar
      uitgaven voor specifieke zorgkosten in aanmerking zijn genomen, heeft aanspraak op een tegemoetkoming indien
      de gecombineerde inkomensheffing over dat kalenderjaar lager is dan de gecombineerde heffingskorting over dat
      kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0027859/2010-07-07#Artikel2
  - number: '2.2'
    text: 'Voor de berekening van de tegemoetkoming wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0027859/2010-07-07#Artikel2
  - number: 2.2.a
    text: '*factor A:* de gecombineerde inkomensheffing over het kalenderjaar;'
    url: https://wetten.overheid.nl/BWBR0027859/2010-07-07#Artikel2
  - number: 2.2.b
    text: '*factor B:* de gecombineerde heffingskorting over het kalenderjaar;'
    url: https://wetten.overheid.nl/BWBR0027859/2010-07-07#Artikel2
  - number: 2.2.c
    text: |-
      *factor C:* de gecombineerde inkomensheffing over het kalenderjaar, indien bij de berekening daarvan de uitgaven
      voor specifieke zorgkosten niet in aanmerking zouden zijn genomen, met dien verstande dat de overige onderdelen van
      de persoonsgebonden aftrek hierbij op een gelijk bedrag worden gesteld als in aanmerking genomen bij de factor A.
    url: https://wetten.overheid.nl/BWBR0027859/2010-07-07#Artikel2
  - number: '2.3'
    text: |-
      Indien factor C kleiner is dan factor B, is de tegemoetkoming gelijk aan het verschil tussen factor C en factor A.
      In andere gevallen is de tegemoetkoming gelijk aan het verschil tussen factor B en factor A.
    url: https://wetten.overheid.nl/BWBR0027859/2010-07-07#Artikel2
  - number: '2.4'
    text: |-
      Indien de belastingplichtige in het kalenderjaar een partner heeft, hebben de belastingplichtige en zijn partner
      in afwijking in zoverre van het eerste lid een gezamenlijke aanspraak op een tegemoetkoming die wordt berekend met
      toepassing van het vijfde lid.
    url: https://wetten.overheid.nl/BWBR0027859/2010-07-07#Artikel2
  - number: '2.5'
    text: |-
      De berekening van de tegemoetkoming, bedoeld in het vierde lid, vindt plaats overeenkomstig het tweede en
      derde lid, waarbij in afwijking in zoverre van het tweede lid het gezamenlijke bedrag van de gecombineerde
      inkomensheffing, het gezamenlijke bedrag van de gecombineerde heffingskorting en het gezamenlijke bedrag van de
      uitgaven voor specifieke zorgkosten van de belastingplichtige en zijn partner in aanmerking worden genomen.
    url: https://wetten.overheid.nl/BWBR0027859/2010-07-07#Artikel2
  - number: '2.6'
    text: |-
      Indien het eerste lid niet van toepassing is, ontstaat eveneens een aanspraak op een tegemoetkoming indien als
      gevolg van een navorderingsaanslag inkomstenbelasting of een ambtshalve vermindering over een kalenderjaar uitgaven
      voor specifieke zorgkosten in aanmerking zijn genomen en de gecombineerde inkomensheffing over dat kalenderjaar
      lager is dan de gecombineerde heffingskorting over dat kalenderjaar. Het tweede tot en met vijfde lid zijn daarbij
      van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0027859/2010-07-07#Artikel2
  - number: '3.1'
    text: |-
      De tegemoetkoming wordt door de inspecteur vastgesteld bij beschikking. De beschikking wordt afgegeven aan degene
      bij wie uitgaven voor specifieke zorgkosten in aanmerking zijn genomen. Indien de tegemoetkoming niet meer bedraagt
      dan € 15, wordt geen tegemoetkoming vastgesteld.
    url: https://wetten.overheid.nl/BWBR0027859/2010-07-07#Artikel3
  - number: '3.2'
    text: |-
      Indien zowel bij de belastingplichtige als bij zijn partner uitgaven voor specifieke zorgkosten in aanmerking zijn
      genomen, wordt de beschikking in afwijking van het eerste lid, tweede volzin, afgegeven aan degene met het hoogste
      verzamelinkomen. Indien het verzamelinkomen van de belastingplichtige en het verzamelinkomen van zijn partner aan
      elkaar gelijk zijn, wordt de beschikking afgegeven aan degene met de hoogste leeftijd.
    url: https://wetten.overheid.nl/BWBR0027859/2010-07-07#Artikel3
  - number: '3.3'
    text: |-
      De inspecteur stelt de tegemoetkoming vast binnen zes maanden na het tijdstip waarop de aanslag inkomstenbelasting
      van de belastingplichtige onherroepelijk is geworden. Bij een gezamenlijke aanspraak als bedoeld in
      [artikel 2, vierde lid][ref1], stelt de inspecteur de tegemoetkoming vast binnen zes maanden na het tijdstip waarop
      zowel de aanslag inkomstenbelasting van de belastingplichtige als de aanslag inkomstenbelasting van zijn partner
      onherroepelijk zijn geworden. Indien ingevolge [artikel 9.4 van de Wet inkomstenbelasting 2001][ref2] geen aanslag
      inkomstenbelasting over het kalenderjaar aan de partner wordt opgelegd, stelt de inspecteur de tegemoetkoming bij
      een gezamenlijke aanspraak vast binnen zes maanden na het tijdstip waarop de aanslag inkomstenbelasting van de
      belastingplichtige onherroepelijk is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0027859#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel9
    url: https://wetten.overheid.nl/BWBR0027859/2010-07-07#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0027859
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '9'
  - number: '3.4'
    text: |-
      Ingeval de aanspraak op de tegemoetkoming eerst ontstaat als gevolg van een navorderingsaanslag of een
      ambtshalve vermindering, stelt de inspecteur de tegemoetkoming vast binnen zes maanden na het tijdstip waarop de
      navorderingsaanslag van de belastingplichtige onherroepelijk is geworden, onderscheidenlijk binnen zes maanden
      na de dagtekening van de beschikking inzake ambtshalve vermindering. Het derde lid, tweede en derde volzin, zijn
      hierbij van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0027859/2010-07-07#Artikel3
  - number: '4.1'
    text: |-
      Indien als gevolg van een navorderingsaanslag inkomstenbelasting of een ambtshalve vermindering blijkt dat
      de beschikking, bedoeld in [artikel 3][ref1], ten onrechte of tot een onjuist bedrag is vastgesteld, stelt de
      inspecteur de tegemoetkoming, onder verrekening van de eerder vastgestelde tegemoetkoming, opnieuw bij beschikking
      vast binnen zes maanden na het tijdstip waarop de navorderingsaanslag onherroepelijk is geworden, onderscheidenlijk
      binnen zes maanden na de dagtekening van de beschikking inzake ambtshalve vermindering. Artikel 3, derde lid,
      tweede volzin, is hierbij van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0027859#Artikel3
    url: https://wetten.overheid.nl/BWBR0027859/2010-07-07#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0027859
        artikel: '3'
        hoofdstuk: '2'
  - number: '4.2'
    text: |-
      Indien uit anderen hoofde dan bedoeld in het eerste lid blijkt dat de beschikking, bedoeld in [artikel 3][ref1],
      ten onrechte of tot een onjuist bedrag is vastgesteld, stelt de inspecteur de tegemoetkoming opnieuw bij
      beschikking vast binnen een jaar na de dagtekening van de beschikking, bedoeld in artikel 3. De eerste volzin is
      niet van toepassing wanneer de inspecteur ten tijde van de vaststelling van de beschikking, bedoeld in artikel 3,
      bekend was of redelijkerwijs bekend had kunnen zijn met de feiten die aanleiding geven tot het opnieuw vaststellen
      van de tegemoetkoming, tenzij blijkt dat de belastingplichtige of zijn partner ter zake van deze feiten te kwader
      trouw is.


      [ref1]: https://wetten.overheid.nl/BWBR0027859#Artikel3
    url: https://wetten.overheid.nl/BWBR0027859/2010-07-07#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0027859
        artikel: '3'
        hoofdstuk: '2'
  - number: '4.3'
    text: |-
      Indien blijkt dat de beschikking, bedoeld in [artikel 3][ref1], ten onrechte achterwege is gebleven, stelt de
      inspecteur de beschikking alsnog vast binnen acht weken nadat hij met dit feit bekend is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0027859#Artikel3
    url: https://wetten.overheid.nl/BWBR0027859/2010-07-07#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0027859
        artikel: '3'
        hoofdstuk: '2'
  - number: '4.4'
    text: 'Toepassing van het eerste, tweede en derde lid blijft achterwege indien:'
    url: https://wetten.overheid.nl/BWBR0027859/2010-07-07#Artikel4
  - number: 4.4.a
    text: het bij toepassing van het eerste of tweede lid terug te vorderen bedrag niet meer zou bedragen dan € 50;
    url: https://wetten.overheid.nl/BWBR0027859/2010-07-07#Artikel4
  - number: 4.4.b
    text: het bij toepassing van het eerste, tweede of derde lid uit te betalen bedrag niet meer zou bedragen dan € 15.
    url: https://wetten.overheid.nl/BWBR0027859/2010-07-07#Artikel4
  - number: '5'
    text: |-
      De ontvanger is belast met de uitbetaling van een door de inspecteur vastgestelde tegemoetkoming en is belast met
      de invordering van een door de inspecteur vastgesteld bedrag aan terugvordering van tegemoetkoming.
    url: https://wetten.overheid.nl/BWBR0027859/2010-07-07#Artikel5
  - number: '6.1'
    text: |-
      Indien een belastingplichtige bij wie over een kalenderjaar uitgaven voor specifieke zorgkosten in aanmerking zijn
      genomen zeven maanden na het tijdstip waarop de aanslag inkomstenbelasting over dat jaar onherroepelijk is geworden
      geen beschikking tegemoetkoming specifieke zorgkosten over dat jaar heeft ontvangen, en hij van mening is dat hij
      daar wel recht op heeft, kan hij binnen een jaar na het verstrijken van de genoemde termijn van zeven maanden een
      verzoek om toekenning van een tegemoetkoming indienen bij de inspecteur. Binnen acht weken na de ontvangst van het
      verzoek stelt de inspecteur met toepassing van [artikel 3][ref1] een tegemoetkoming vast of wijst hij het verzoek
      bij beschikking af.


      [ref1]: https://wetten.overheid.nl/BWBR0027859#Artikel3
    url: https://wetten.overheid.nl/BWBR0027859/2010-07-07#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0027859
        artikel: '3'
        hoofdstuk: '2'
  - number: '6.2'
    text: |-
      In afwijking in zoverre van het eerste lid geldt bij een gezamenlijke aanspraak een termijn van
      zeven maanden na het tijdstip waarop zowel de aanslag inkomstenbelasting van de belastingplichtige
      als de aanslag inkomstenbelasting van zijn partner onherroepelijk zijn geworden. Indien ingevolge
      [artikel 9.4 van de Wet inkomstenbelasting 2001][ref1] geen aanslag inkomstenbelasting over het kalenderjaar aan de
      partner wordt opgelegd, geldt bij een gezamenlijke aanspraak een termijn van zeven maanden na het tijdstip waarop
      de aanslag van de belastingplichtige onherroepelijk is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel9
    url: https://wetten.overheid.nl/BWBR0027859/2010-07-07#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '9'
  - number: '6.3'
    text: |-
      Ingeval de aanspraak op de tegemoetkoming eerst ontstaat als gevolg van een navorderingsaanslag of een ambtshalve
      vermindering, zijn het eerste en tweede lid van overeenkomstige toepassing, met dien verstande dat de termijn
      voor het indienen van het verzoek om toekenning van een tegemoetkoming in dat geval aanvangt zeven maanden
      na het tijdstip waarop de navorderingsaanslag inkomstenbelasting over dat jaar onherroepelijk is geworden
      onderscheidenlijk zeven maanden na de dagtekening van de beschikking inzake de ambtshalve vermindering.
    url: https://wetten.overheid.nl/BWBR0027859/2010-07-07#Artikel6
  - number: '6.4'
    text: |-
      Het eerste, tweede en derde lid zijn van overeenkomstige toepassing met betrekking tot het niet toepassen van
      [artikel 4][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0027859#Artikel4
    url: https://wetten.overheid.nl/BWBR0027859/2010-07-07#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0027859
        artikel: '4'
        hoofdstuk: '2'
  - number: '7'
    text: De tegemoetkomingen komen ten laste van de begroting van het ministerie van Volksgezondheid, Welzijn en Sport.
    url: https://wetten.overheid.nl/BWBR0027859/2010-07-07#Artikel7
  - number: '12'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin het wordt
      geplaatst en werkt met uitzondering van [artikel 8][ref1] terug tot en met 1 januari 2009.


      [ref1]: https://wetten.overheid.nl/BWBR0027859#Artikel8
    url: https://wetten.overheid.nl/BWBR0027859/2010-07-07#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0027859
        artikel: '8'
        hoofdstuk: '3'
  - number: '13'
    text: 'Dit besluit wordt aangehaald als: Besluit tegemoetkoming specifieke zorgkosten.'
    url: https://wetten.overheid.nl/BWBR0027859/2010-07-07#Artikel13
