  - number: '10.2'
    text: |-
      Ten aanzien van inbeslaggenomen levende dieren overlegt de bewaarder zo spoedig mogelijk met het openbaar
      ministerie over hetzij een passende wijze van bewaring hetzij een geschikte machtiging tot het prijsgeven of
      vervreemding om niet of om baat. In het geval dat de onttrekking aan het verkeer zal worden gevorderd, geeft het
      openbaar ministerie een last tot vernietiging.
    url: https://wetten.overheid.nl/BWBR0007823/2025-01-01#Artikel10
  - number: '10.3'
    text: |-
      Onder de voorwerpen, bedoeld in [artikel 117, tweede lid, onder b, van het Wetboek van Strafvordering][ref1],
      waarvan de kosten van de bewaring niet in een redelijke verhouding staan tot hun waarde, zijn in ieder geval
      begrepen:


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel117
    url: https://wetten.overheid.nl/BWBR0007823/2025-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '117'
  - number: 10.3.1°
    text: motoren en auto’s of onderdelen daarvan met een waarde van minder dan € 600;
    url: https://wetten.overheid.nl/BWBR0007823/2025-01-01#Artikel10
  - number: 10.3.2°
    text: fietsen en bromfietsen of onderdelen daarvan met een waarde van minder dan € 120;
    url: https://wetten.overheid.nl/BWBR0007823/2025-01-01#Artikel10
  - number: 10.3.3°
    text: hulpmiddelen bij de jacht of het stropen.
    url: https://wetten.overheid.nl/BWBR0007823/2025-01-01#Artikel10
  - number: '10.4'
    text: |-
