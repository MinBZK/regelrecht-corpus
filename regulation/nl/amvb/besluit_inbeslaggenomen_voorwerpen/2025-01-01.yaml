  - number: 1.i
    text: Domeinen Roerende Zaken van het Ministerie van Financiën voor bewaring van alle overige inbeslaggenomen voorwerpen.
    url: https://wetten.overheid.nl/BWBR0007823/2025-01-01#Artikel1
  - number: '2'
    text: |-
      Zo spoedig mogelijk na de inbeslagneming beschrijft de inbeslagnemende ambtenaar en buitengewone
      opsporingsambtenaar het voorwerp zorgvuldig en, zo mogelijk na verpakking, waarmerkt deze het voorwerp deugdelijk,
      zodat te allen tijde de aard van het voorwerp, de herkomst en de reden van de inbeslagneming kan worden
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0007823/2025-01-01#Artikel2
  - number: '3'
    text: |-
      De bewaarder geeft een voorwerp niet af dan tegen een bewijs, waarin de datum van de afgifte, de aard van het
      voorwerp en de naam en de hoedanigheid van de ontvanger zijn vermeld.
    url: https://wetten.overheid.nl/BWBR0007823/2025-01-01#Artikel3
  - number: '4'
    text: |-
      Inbeslaggenomen geld wordt zo spoedig mogelijk op de bankrekening van de bewaarder als bedoeld in
      [artikel 1, onderdeel a][ref1], gestort, tenzij de officier van justitie bepaalt dat de bewaarder, bedoeld in
      artikel 1, onderdeel d, e of i, dit geld onder zich houdt.


      [ref1]: https://wetten.overheid.nl/BWBR0007823#Artikel1
    url: https://wetten.overheid.nl/BWBR0007823/2025-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0007823
        artikel: '1'
  - number: '5'
    text: |-
      Indien de Koninklijke Nederlandse Munt N.V. de voorwerpen die bij hem in bewaring zijn gegeven, nog niet heeft
      beoordeeld wanneer afgifte van die voorwerpen wordt gevraagd, vormt hij zijn oordeel, alvorens tot afgifte over te
      gaan, zo spoedig mogelijk.
    url: https://wetten.overheid.nl/BWBR0007823/2025-01-01#Artikel5
  - number: '6'
    text: |-
      De bewaarder draagt zorg dat een voorwerp zodanig wordt opgeslagen, dat het steeds met het minst mogelijk oponthoud
      voor het onderzoek beschikbaar kan worden gesteld.
    url: https://wetten.overheid.nl/BWBR0007823/2025-01-01#Artikel6
  - number: '7.1'
    text: |-
      De bewaarders en de ambtenaren die inbeslaggenomen voorwerpen onder zich hebben, nemen de nodige maatregelen tegen
      beschadiging, waardevermindering en ontvreemding van deze voorwerpen en tegen het ontstaan van gevaar voor personen
      of goederen door deze voorwerpen.
    url: https://wetten.overheid.nl/BWBR0007823/2025-01-01#Artikel7
  - number: '7.2'
    text: |-
      Met betrekking tot voorwerpen, inbeslaggenomen ter zake van een overtreding van het bepaalde bij of krachtens de
      [Gezondheids- en welzijnswet voor dieren][ref1] dan wel de [Plantenziektenwet][ref2] wordt, indien de daartoe te
      raadplegen ambtenaar van het Ministerie van Economische Zaken, Landbouw en Innovatie van mening is dat de wering
      van besmettingsgevaar dat eist, door de bewaarder zo spoedig mogelijk na de inbeslagneming de door deze ambtenaar
      aan te geven maatregelen genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005662
      [ref2]: https://wetten.overheid.nl/BWBR0002075
    url: https://wetten.overheid.nl/BWBR0007823/2025-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005662
      - id: ref2
        bwb_id: BWBR0002075
  - number: '8'
    text: |-
      Voorwerpen die om bijzondere redenen niet kunnen worden opgeslagen in een onder beheer van de bewaarder staande
      opslagplaats, mogen door hem op een andere geschikte plaats in bewaring worden gegeven.
    url: https://wetten.overheid.nl/BWBR0007823/2025-01-01#Artikel8
  - number: '9.1'
    text: |-
      Indien en voor zolang de opslag ingevolge het vorige artikel geschiedt in een ruimte in beheer bij een andere in
      [artikel 1][ref1] genoemde bewaarder, wordt deze als de bewaarder van de voorwerpen aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0007823#Artikel1
    url: https://wetten.overheid.nl/BWBR0007823/2025-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0007823
        artikel: '1'
  - number: '9.2'
    text: |-
