    url: https://wetten.overheid.nl/BWBR0007823/2025-01-01#Artikel10
  - number: '11.1'
    text: |-
      De bewaring, het onderhoud en de teruggave van inbeslaggenomen voorwerpen of de opbrengst daarvan geschieden zonder
      kosten voor degene bij wie het voorwerp werd inbeslaggenomen en voor degene aan wie zij moeten worden teruggegeven.
    url: https://wetten.overheid.nl/BWBR0007823/2025-01-01#Artikel11
  - number: '11.2'
    text: |-
      Niettemin mogen de werkelijke kosten van opslag en onderhoud aan de rechthebbende in rekening worden gebracht vanaf
      de tiende dag na die, waarop opdracht tot teruggave werd verleend, indien en voor zolang buiten de schuld van de
      bewaarder aan die opdracht niet kon worden voldaan.
    url: https://wetten.overheid.nl/BWBR0007823/2025-01-01#Artikel11
  - number: '11.3'
    text: |-
      De bewaarder houdt het voorwerp, waarvan de teruggave is gelast, ter beschikking van de rechthebbende, totdat deze
      daarop aanspraak maakt, doch niet langer dan drie maanden nadat opdracht tot teruggave is verkregen.
    url: https://wetten.overheid.nl/BWBR0007823/2025-01-01#Artikel11
  - number: '11.4'
    text: |-
      Tijdens het beslag geboren nakomelingen van inbeslaggenomen dieren worden aan de rechthebbende afgegeven tegen
      betaling van de noodzakelijke kosten, gemaakt voor de geboorte en voor de verzorging van de nakomelingen.
    url: https://wetten.overheid.nl/BWBR0007823/2025-01-01#Artikel11
  - number: '11.5'
    text: |-
      Tijdens het beslag voortgebrachte producten van dieren en planten worden aan de rechthebbende afgegeven tegen
      betaling van de noodzakelijke kosten gemaakt voor de oogst en bewaring van deze producten.
    url: https://wetten.overheid.nl/BWBR0007823/2025-01-01#Artikel11
  - number: '11.6'
    text: |-
      Wanneer opdracht tot teruggave van gelden, dan wel de opbrengst van inbeslaggenomen voorwerpen, is gegeven,
      is de bewaarder de rechthebbende over deze gelden de wettelijke rente voor niet-handelstransacties als bedoeld
      in [artikel 4:98 van de Algemene wet bestuursrecht][ref1] verschuldigd. De termijn waarover wettelijke rente
      verschuldigd is begint te lopen vanaf de dag van inbeslagneming van de gelden, dan wel de dag waarop de
      inbeslaggenomen voorwerpen zijn vervreemd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0007823/2025-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '11.7'
    text: 'De in het zesde lid bedoelde verplichting geldt niet voor inbeslaggenomen geld:'
    url: https://wetten.overheid.nl/BWBR0007823/2025-01-01#Artikel11
  - number: 11.7.a
    text: waarvan het beslag dient om de waarheid aan de dag te brengen;
    url: https://wetten.overheid.nl/BWBR0007823/2025-01-01#Artikel11
  - number: 11.7.b
    text: dat uit incourante valuta bestaat; of
    url: https://wetten.overheid.nl/BWBR0007823/2025-01-01#Artikel11
  - number: 11.7.c
    text: dat op last van de officier van justitie wegens een bijzondere reden niet giraal wordt bewaard.
    url: https://wetten.overheid.nl/BWBR0007823/2025-01-01#Artikel11
  - number: '12'
    text: |-
      De bewaarders zijn na het verstrijken van de termijn bedoeld in [artikel 11, derde lid][ref1], bevoegd met
      betrekking tot voorwerpen, ten aanzien waarvan het niet mogelijk is gebleken de last tot teruggave uit te voeren
      omdat de rechthebbende geen aanspraak heeft gemaakt op afgifte, te handelen op dezelfde wijze als met betrekking
      tot verbeurd verklaarde voorwerpen.


      [ref1]: https://wetten.overheid.nl/BWBR0007823#Artikel11
    url: https://wetten.overheid.nl/BWBR0007823/2025-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0007823
        artikel: '11'
  - number: '13.1'
    text: |-
      De opsporingsambtenaar die een inbeslaggenomen voorwerp bedoeld in [artikel 10, eerste lid, onder][ref1] zich
      heeft, stelt zich onverwijld met het openbaar ministerie in verbinding, met het verzoek tot het verlenen van
      een machtiging tot vernietiging. De opsporingsambtenaar draagt tevens zorg voor de uitvoering van de machtiging
      tot vernietiging van middelen als bedoeld in de [artikelen 2 en 3 van de Opiumwet][ref2] op de wijze bepaald in
      [artikel 15][ref3]. [Artikel 14][ref4] blijft buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007823#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0001941#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0007823#Artikel15
      [ref4]: https://wetten.overheid.nl/BWBR0007823#Artikel14
    url: https://wetten.overheid.nl/BWBR0007823/2025-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0007823
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0001941
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0007823
        artikel: '15'
      - id: ref4
        bwb_id: BWBR0007823
        artikel: '14'
  - number: '13.2'
    text: |-
      Indien het betreft een voorwerp, inbeslaggenomen terzake van het bepaalde bij of krachtens een van de in
      [artikel 7, tweede lid][ref1], genoemde wetten, verzoekt de bewaarder of de opsporingsambtenaar, die het voorwerp
      onder zich heeft, terstond machtiging tot onverwijlde vernietiging, indien de daartoe te raadplegen ambtenaar van
      het Ministerie van Economische Zaken, Landbouw en Innovatie van mening is, dat zulks ter wering van besmettelijke
      dier- en plantenziekten is vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0007823#Artikel7
    url: https://wetten.overheid.nl/BWBR0007823/2025-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0007823
        artikel: '7'
  - number: '13.3'
    text: |-
      Indien machtiging tot vernietiging of vervreemding is verleend aan de opsporingsambtenaar die het voorwerp onder
      zich heeft, stelt deze het voorwerp onverwijld ter beschikking van de daarvoor in [artikel 1][ref1] aangewezen
      bewaarder.


      [ref1]: https://wetten.overheid.nl/BWBR0007823#Artikel1
    url: https://wetten.overheid.nl/BWBR0007823/2025-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0007823
        artikel: '1'
  - number: '14.1'
    text: |-
      Alvorens aan een verkregen machtiging tot het vernietigen, prijsgeven of bestemmen tot een ander doel dan het
      onderzoek uitvoering wordt gegeven, wordt de prijs geschat, die het betrokken voorwerp bij verkoop redelijkerwijs
      zou moeten opbrengen.
    url: https://wetten.overheid.nl/BWBR0007823/2025-01-01#Artikel14
  - number: '14.2'
    text: |-
      De schatting geschiedt door of namens de bewaarder. Indien aannemelijk is dat de waarde van het voorwerp meer
      bedraagt dan € 35.000 of indien de specifieke aard van het voorwerp daartoe aanleiding geeft, vraagt deze daartoe
      het oordeel van tenminste één persoon die geacht kan worden goed op de hoogte te zijn van de marktprijzen van
      dergelijke voorwerpen.
    url: https://wetten.overheid.nl/BWBR0007823/2025-01-01#Artikel14
  - number: '14.3'
    text: |-
      De geschatte prijs en het oordeel van de in het tweede lid bedoelde deskundige worden in een rapport aan de
      officier van justitie vermeld.
    url: https://wetten.overheid.nl/BWBR0007823/2025-01-01#Artikel14
  - number: '15.1'
    text: |-
      Aan een machtiging tot het vernietigen of prijsgeven van een voorwerp wordt zo spoedig mogelijk gevolg
      gegeven op de voor het betrokken voorwerp geschikte wijze, met dien verstande dat in het geval, bedoeld in het
      [tweede lid van artikel 7][ref1], aan een machtiging tot vernietiging gevolg wordt gegeven op de door de daartoe te
      raadplegen ambtenaar van het Ministerie van Economische Zaken, Landbouw en Innovatie aan te geven wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0007823#Artikel7
    url: https://wetten.overheid.nl/BWBR0007823/2025-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0007823
        artikel: '7'
  - number: '15.2'
    text: |-
      Middelen als bedoeld in [artikel 2 en 3 van de Opiumwet][ref1], worden pas vernietigd nadat daarvan een monster is
      genomen. De vernietiging van deze middelen geschiedt onder toezicht van een hulpofficier van justitie.


      [ref1]: https://wetten.overheid.nl/BWBR0001941#Artikel2
    url: https://wetten.overheid.nl/BWBR0007823/2025-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0001941
        artikel: '2'
  - number: '15.3'
    text: De vernietiging is voltooid wanneer aan het voorwerp zijn kenmerkende eigenschappen voorgoed zijn ontnomen.
    url: https://wetten.overheid.nl/BWBR0007823/2025-01-01#Artikel15
  - number: '15.4'
    text: |-
      De vernietiging geschiedt voor rekening en verantwoording van de bewaarder of de opsporingsambtenaar aan wie de
      machtiging is verleend. Met hetgeen na de vernietiging verkoopwaarde heeft, wordt gehandeld als met voorwerpen
      waarvoor machtiging tot vervreemding is verleend.
    url: https://wetten.overheid.nl/BWBR0007823/2025-01-01#Artikel15
  - number: '15.5'
    text: |-
      De datum en de wijze van uitvoering van de in dit artikel genoemde maatregelen worden vermeld in een rapport aan de
      officier van justitie.
    url: https://wetten.overheid.nl/BWBR0007823/2025-01-01#Artikel15
  - number: '16'
    text: |-
      De bewaarder die een machtiging tot vervreemding om baat heeft uitgevoerd ten aanzien van voorwerpen die op
      grond van [artikel 94][ref1] of [94a van het Wetboek van Strafvordering][ref2] inbeslaggenomen zijn, draagt na de
      uitvoering van deze last de opbrengst over aan de bewaarder genoemd in [artikel 1, onderdeel a][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel94
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel94a
      [ref3]: https://wetten.overheid.nl/BWBR0007823#Artikel1
    url: https://wetten.overheid.nl/BWBR0007823/2025-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '94'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: 94a
      - id: ref3
        bwb_id: BWBR0007823
        artikel: '1'
  - number: '17'
    text: Het besluit van 6 augustus 1993, *Stb.* 440 wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0007823/2025-01-01#Artikel17
  - number: '18'
    text: Dit besluit treedt in werking op 1 januari 1996.
    url: https://wetten.overheid.nl/BWBR0007823/2025-01-01#Artikel18
  - number: '19'
    text: Dit besluit kan worden aangehaald als Besluit inbeslaggenomen voorwerpen.
    url: https://wetten.overheid.nl/BWBR0007823/2025-01-01#Artikel19
