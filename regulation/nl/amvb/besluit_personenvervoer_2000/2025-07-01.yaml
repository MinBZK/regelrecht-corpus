      [hoofdstuk III, paragrafen 4a][ref1] en [4b, van de wet][ref2] gestelde regels van overeenkomstige toepassing op
      het vervoer, bedoeld in het eerste lid, voor zover dat vervoer wordt verricht in opdracht van een bestuursorgaan
      behorend tot een openbaar lichaam als bedoeld in [artikel 63a van de wet][ref3]. Bij ministeriële regeling kunnen
