      [ref10]: https://wetten.overheid.nl/BWBR0011982#Artikel91
      [ref11]: https://wetten.overheid.nl/BWBR0011982#Artikel98
      [ref12]: https://wetten.overheid.nl/BWBR0011982#Artikel114
      [ref13]: https://wetten.overheid.nl/BWBR0002063#Artikel1
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel118
