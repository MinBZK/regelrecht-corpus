  - number: 8.1.a
    text: naar en van de werkplek, voorafgaand aan onderscheidenlijk na afloop van de werkzaamheden,
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel8
  - number: 8.1.b
    text: |-
      dat wordt verricht met bussen dan wel met auto's ingericht voor vervoer van meer dan zeven personen, de bestuurder
      daaronder niet begrepen en
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel8
  - number: 8.1.c
    text: |-
      waarvoor subsidie wordt verleend door een bestuursorgaan als bedoeld in [artikel 20 van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel20
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '20'
  - number: '8.2'
    text: |-
      Het vervoer, bedoeld in het eerste lid, is vervoer als bedoeld in [artikel 69, eerste lid, van de wet][ref1] dat
      door een gemeentelijk vervoerbedrijf mag worden verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel69
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '69'
  - number: 9a.1
    text: |-
      Het verbod openbaar vervoer anders dan per trein te verrichten zonder geldige communautaire vergunning,
      bedoeld in [artikel 7, eerste lid, van de wet][ref1], is niet van toepassing op een vervoerder die openbaar
      vervoer per auto verricht en beschikt over een vergunning voor het verrichten van taxivervoer als bedoeld in
      [artikel 76, eerste lid, van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel76
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0011470
        artikel: '76'
  - number: 9a.2
    text: |-
      Het verbod openbaar vervoer anders dan per trein te verrichten zonder de aanwezigheid in het
      voertuig van een eensluidend gewaarmerkt afschrift van de communautaire vergunning, bedoeld in
      [artikel 7, tweede lid, van de wet][ref1], is niet van toepassing op een vervoerder als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel7
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '7'
  - number: 9b.1
    text: |-
      Bij ministeriële regeling kan, in voorkomend geval met inachtneming van bindende EU-rechtshandelingen en voor zover
      de belangen van reizigers zich daar niet tegen verzetten, vrijstelling worden verleend van één of meer regels van
      dit besluit die krachtens de [artikelen 2, vijfde lid][ref1], [76c][ref2], [79][ref3] en [104 van de wet][ref4]
      zijn vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel76c
      [ref3]: https://wetten.overheid.nl/BWBR0011470#Artikel79
      [ref4]: https://wetten.overheid.nl/BWBR0011470#Artikel104
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel9b
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0011470
        artikel: 76c
      - id: ref3
        bwb_id: BWBR0011470
        artikel: '79'
      - id: ref4
        bwb_id: BWBR0011470
        artikel: '104'
  - number: 9b.2
    text: 'Een vrijstelling kan worden verleend met het oog op:'
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel9b
  - number: 9b.2.a
    text: het stimuleren van ontwikkelingen in het personenvervoer;
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel9b
  - number: 9b.2.b
    text: het voorkomen van onnodige regeldruk bij marktdeelnemers in het personenvervoer.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel9b
  - number: 9b.3
    text: 'Bij een vrijstelling worden regels gesteld, die onder meer betrekking kunnen hebben op:'
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel9b
  - number: 9b.3.a
    text: de maximale duur van de vrijstelling;
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel9b
  - number: 9b.3.b
    text: de afbakening van de doelgroep;
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel9b
  - number: 9b.3.c
    text: overige noodzakelijk geachte voorwaarden en beperkingen in het belang van veilig personenvervoer.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel9b
  - number: 9b.4
    text: Een vrijstelling kan tevens worden verleend in het kader van een experiment.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel9b
  - number: 9b.5
    text: 'Bij een zodanig experiment worden in ieder geval regels gesteld over:'
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel9b
  - number: 9b.5.a
    text: de inkadering van het doel van het experiment;
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel9b
  - number: 9b.5.b
    text: de maximale duur van het experiment;
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel9b
  - number: 9b.5.c
    text: de afbakening van de doelgroep;
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel9b
  - number: 9b.5.d
    text: |-
      de monitoring en evaluatie van het experiment, onder meer in verband met mogelijke aanpassing van relevante
      regelgeving na afloop van het experiment.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel9b
  - number: '10.1'
    text: |-
      Een vervoerder die openbaar vervoer verricht, verstrekt aan degene, die daarom verzoekt ten behoeve van het voeden
      en actualiseren van een reisinformatiesysteem ten minste gegevens inzake:
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel10
  - number: 10.1.a
    text: de door de vervoerder gehanteerde dienstregeling met de geldigheidsduur daarvan,
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel10
  - number: 10.1.b
    text: de door de vervoerder gegarandeerde overstapmogelijkheden binnen de dienstregeling,
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel10
  - number: 10.1.c
    text: |-
      de wijzigingen van de dienstregeling als gevolg van geplande werkzaamheden ten behoeve van aanleg van en onderhoud
      aan de door de vervoerder benodigde infrastructuur,
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel10
  - number: 10.1.d
    text: |-
      de wijzigingen van de dienstregeling die ten minste 24 uur van tevoren bekend zijn, gerekend vanaf de eerste dienst
      die op een dag wordt verzorgd,
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel10
  - number: 10.1.e
    text: |-
      de door de vervoerder gehanteerde tarieven of de informatie die nodig is om de prijs per reis met een of meer
      openbaar vervoersmodaliteiten te berekenen,
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel10
  - number: 10.1.f
    text: |-
      de actuele informatie met betrekking tot de dienstuitvoering ten opzichte van de door hem gehanteerde
      dienstregeling en
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel10
  - number: 10.1.g
    text: |-
      de mate van toegankelijkheid voor reizigers met een handicap van haltes, stations en voertuigen die door de
      desbetreffende vervoerder worden gebruikt voor het verrichten van openbaar vervoer.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel10
  - number: '10.2'
    text: |-
      Een vervoerder die vervoer verricht als bedoeld in [artikel 6, eerste lid][ref1], verstrekt aan de exploitant van
      een reisinformatiesysteem op diens verzoek ten minste gegevens inzake:


      [ref1]: https://wetten.overheid.nl/BWBR0011982#Artikel6
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0011982
        artikel: '6'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: 10.2.a
    text: het gebied waarbinnen en de tijdstippen waartussen vervoer wordt verricht;
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel10
  - number: 10.2.b
    text: het telefoonnummer voor het bestellen van de ritten;
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel10
  - number: 10.2.c
    text: de vooraanmeldingstijd;
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel10
  - number: 10.2.d
    text: de ophaal- of aankomstmarge;
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel10
  - number: 10.2.e
    text: de door de vervoerder gehanteerde tarieven en de daarbij behorende zone-indeling;
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel10
  - number: 10.2.f
    text: de mate van toegankelijkheid van het vervoer voor reizigers met een handicap.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel10
  - number: '10.3'
    text: 'Bij ministeriële regeling kan:'
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel10
  - number: 10.3.a
    text: nadere invulling worden gegeven aan de aard van de gegevens, bedoeld in het eerste lid, onderdelen e, f en g,
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel10
  - number: 10.3.b
    text: |-
      worden bepaald dat andere gegevens dan de gegevens, bedoeld in het eerste lid, worden verstrekt ten behoeve van het
      voeden en actualiseren van een reisinformatiesysteem.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel10
  - number: '11.1'
    text: |-
      Onze Minister kan ambtshalve of op aanvraag een exploitant van een reisinformatiesysteem met een landelijk bereik
      aanwijzen als bedoeld in [artikel 14 van de wet][ref1], indien niet meer voorzien kan worden in ten minste één
      doelmatig en voor de reiziger toegankelijk reisinformatiesysteem met een landelijk bereik.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel14
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '14'
  - number: '11.2'
    text: Voordat Onze Minister een exploitant aanwijst, maakt hij in de Staatscourant zijn voornemen daartoe bekend.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel11
  - number: '11.3'
    text: |-
      Bij de bekendmaking, bedoeld in het tweede lid, wordt de termijn aangegeven waarbinnen bij Onze Minister een
      aanvraag kan worden ingediend tot aanwijzing als exploitant van een reisinformatiesysteem.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel11
  - number: '11.4'
    text: |-
      De aanvraag, bedoeld in het derde lid, bevat ten minste een voorstel tot exploitatie van een doelmatig en voor
      de reiziger toegankelijk reisinformatiesysteem met een landelijk bereik en de daarbij gedurende een bepaalde
      periode behorende jaarlijkse financiële bijdrage van de vervoerders die openbaar vervoer verrichten waardoor de
      instandhouding van het desbetreffende reisinformatiesysteem is gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel11
  - number: '11.5'
    text: |-
      Indien de aanvraag naar het oordeel van Onze Minister aan redelijke eisen van doelmatigheid en toegankelijkheid
      voor de reiziger kan voldoen, legt hij deze voor advies voor aan de vervoerders die openbaar vervoer verrichten.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel11
  - number: '11.6'
    text: |-
      De vervoerders, bedoeld in het vijfde lid, leggen Onze Minister binnen een door hem bepaalde termijn een met
      redenen omkleed advies voor over het voorstel, bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel11
  - number: '11.7'
    text: De vervoerders stellen de aanvrager in de gelegenheid met hen overleg te voeren voordat advies wordt uitgebracht.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel11
  - number: '11.8'
    text: |-
      Onze Minister wijst na afloop van de termijn, genoemd in het zesde lid, een exploitant aan van een
      reisinformatiesysteem dat het meest doelmatig is en waarvan de toegankelijkheid voor de reiziger en het landelijk
      bereik optimaal is gewaarborgd en stelt de daarbij behorende jaarlijkse financiële bijdrage vast die een vervoerder
      die openbaar vervoer verricht aan de aangewezen exploitant van het reisinformatiesysteem verleent.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel11
  - number: '11.9'
    text: Onze Minister geeft een aanwijzing voor bepaalde tijd.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel11
  - number: '12.1'
    text: Onze Minister besluit binnen twaalf weken op een aanvraag om verlening, wijziging of intrekking van een vergunning.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel12
  - number: '12.2'
    text: |-
      Onze Minister neemt een aanvraag om verlening of wijziging van een vergunning in behandeling nadat de bij
      ministeriële regeling vastgestelde vergoeding voor de kosten van deze behandeling is ontvangen.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel12
  - number: '13.1'
    text: |-
      Van het voornemen tot ambtshalve wijziging, schorsing of intrekking van een vergunning doet Onze Minister
      mededeling aan de houder van de vergunning, waarna de houder van de vergunning ten minste vier weken in de
      gelegenheid wordt gesteld zijn zienswijze naar voren te brengen.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel13
  - number: '13.2'
    text: |-
      Onze Minister neemt een besluit over de voorgenomen wijziging, schorsing of intrekking van de vergunning binnen
      acht weken na afloop van de termijn, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel13
  - number: '13.3'
    text: |-
      Indien een besluit als bedoeld in het tweede lid wordt genomen ten aanzien van een communautaire vergunning en de
      houder van de vergunning ten tijde van het voornemen, bedoeld in het eerste lid, openbaar vervoer verricht, wordt
      de concessieverlener tevens ten minste vier weken in de gelegenheid gesteld zijn zienswijze naar voren te brengen.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel13
  - number: '13.4'
    text: |-
      Indien Onze Minister besluit tot wijziging of intrekking van een vergunning, vermeldt hij in de beschikking de
      datum van ingang van de wijziging of de intrekking, die niet eerder mag liggen dan twaalf weken na verzending van
      de beschikking of zoveel later als de redelijke belangen van de vergunninghouder en van anderen die door wijziging
      of intrekking van de vergunning in hun belangen kunnen worden getroffen, vereisen.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel13
  - number: '13.5'
    text: |-
      Het vierde lid is van overeenkomstige toepassing op een besluit tot schorsing van de vergunning, met dien verstande
      dat een termijn geldt van ten minste zes weken.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel13
  - number: '14.1'
    text: Vergunningen worden op naam van de vervoerder gesteld.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel14
  - number: '14.2'
    text: |-
      Indien natuurlijke personen of rechtspersonen gezamenlijk als vervoerder optreden, worden de vergunningen op hun
      namen tezamen gesteld, met, in voorkomend geval, toevoeging van de naam waaronder zij gezamenlijk als vervoerder
      optreden.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel14
  - number: '14.3'
    text: |-
      De vervoerder doet een aanvraag tot wijziging van de vergunning bij wijziging van de naam van de vervoerder, van
      een van de namen van de natuurlijke personen of rechtspersonen die gezamenlijk als vervoerder optreden of van de
      naam waaronder natuurlijke personen of rechtspersonen gezamenlijk als vervoerder optreden.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel14
  - number: '15.1'
    text: |-
      Onverminderd [artikel 14][ref1] worden in de vergunning vermeld:


      [ref1]: https://wetten.overheid.nl/BWBR0011982#Artikel14
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0011982
        artikel: '14'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 15.1.a
    text: het vervoer waarvoor de vergunning is verleend en
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel15
  - number: 15.1.b
    text: |-
      het adres van de vervoerder aan wie de vergunning is verleend of, indien [artikel 14, tweede lid][ref1], toepassing
      heeft gevonden, de adressen van de natuurlijke personen, bedoeld in dat artikel, dan wel het gezamenlijk adres van
      deze personen.


      [ref1]: https://wetten.overheid.nl/BWBR0011982#Artikel14
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0011982
        artikel: '14'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '15.2'
    text: |-
      In de vergunning worden, voor zover van toepassing, de voorschriften vermeld die aan de vergunning zijn verbonden
      en de beperkingen waaronder de vergunning is verleend.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel15
  - number: '17.1'
    text: Vergunningbewijzen worden op aanvraag door Onze Minister verleend aan de vergunninghouder.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel17
  - number: '17.2'
    text: |-
      Onze Minister neemt een aanvraag om verlening van een vergunningbewijs in behandeling nadat de bij ministeriële
      regeling vastgestelde vergoeding voor de kosten van deze behandeling is ontvangen.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel17
  - number: '17.3'
    text: |-
      Vergunningbewijzen zijn geldig voor een periode van ten hoogste vijf jaar, gerekend vanaf het moment van verlening
      van de vergunning.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel17
  - number: '17.4'
    text: |-
      Onze Minister kan de verlening van het aantal vergunningbewijzen beperken tot het aantal bussen of auto's waarvan
      de vergunninghouder aantoont dat hij daarover duurzaam de beschikking heeft.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel17
  - number: '18.1'
    text: 'Op het vergunningbewijs worden vermeld:'
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel18
  - number: 18.1.a
    text: de naam en het adres van de vervoerder aan wie de vergunning is verleend,
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel18
  - number: 18.1.b
    text: het vervoer waarvoor de vergunning is verleend,
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel18
  - number: 18.1.c
    text: de beschikking waarbij de vergunning is verleend of laatstelijk is gewijzigd.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel18
  - number: '18.2'
    text: 'Op het vergunningbewijs worden voorts voor zover van toepassing vermeld:'
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel18
  - number: 18.2.a
    text: |-
      de naam van de personen, bedoeld in [artikel 14, tweede lid][ref1], dan wel de naam waaronder zij gezamenlijk als
      vervoerder optreden,


      [ref1]: https://wetten.overheid.nl/BWBR0011982#Artikel14
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0011982
        artikel: '14'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 18.2.b
    text: |-
      de adressen van de personen, bedoeld in [artikel 14, tweede lid][ref1], dan wel het gezamenlijk adres van deze
      personen,


      [ref1]: https://wetten.overheid.nl/BWBR0011982#Artikel14
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0011982
        artikel: '14'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 18.2.c
    text: |-
      de voorschriften die aan de vergunning zijn verbonden en de beperkingen waaronder de vergunning is verleend
      voorzover van belang voor het toezicht op de rechtmatigheid van het verrichte vervoer, en
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel18
  - number: 18.2.d
    text: de geldigheidstermijn van het vergunningbewijs.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel18
  - number: '19.1'
    text: |-
      Een vergunningbewijs is niet geldig vanaf het tijdstip waarop de vergunning is ingetrokken, gedurende de periode
      waarin de op het vergunningbewijs vermelde gegevens niet overeenstemmen met de feitelijke situatie en gedurende de
      periode waarin een vergunning is geschorst.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel19
  - number: '19.2'
    text: |-
      Met uitzondering van de periode waarin een vergunning is geschorst en met uitzondering van het geval dat de
      geldigheidstermijn, bedoeld in [artikel 18, tweede lid, onderdeel d][ref1], is verlopen, levert de vervoerder
      binnen vier weken na het tijdstip, bedoeld in het eerste lid, het vergunningbewijs in bij Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0011982#Artikel18
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0011982
        artikel: '18'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '20'
    text: Het is verboden een bewerkt vergunningbewijs te gebruiken.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel20
  - number: '21.1'
    text: |-
      De vervoerder die openbaar vervoer, besloten busvervoer of taxivervoer verricht, voldoet aan de eis van
      betrouwbaarheid.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel21
  - number: '21.2'
    text: |-
      Indien meer natuurlijke personen of rechtspersonen gezamenlijk als vervoerder optreden, voldoet een ieder van de
      natuurlijke personen en een ieder van de bestuurders van de rechtspersonen aan de eis, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel21
  - number: '21.3'
    text: |-
      Indien de vervoerder een rechtspersoon is, voldoet een ieder van de bestuurders van deze rechtspersoon aan de eis,
      bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel21
  - number: '21.4'
    text: |-
      Indien de vervoerder een dienst of bedrijf van een gemeente is, voldoet het hoofd van de dienst of het bedrijf aan
      de eis, bedoeld in het eerste lid, en indien er meer hoofden zijn aangewezen, ieder van hen.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel21
  - number: '21.5'
    text: |-
      Indien de natuurlijke personen of rechtspersonen, bedoeld in het eerste tot en met het vierde lid, niet of slechts
      gedeeltelijk zijn betrokken bij de permanente en daadwerkelijke leiding van de onderneming, de dienst of het
      bedrijf, voldoet degene die is belast met de permanente of daadwerkelijke leiding, mede aan de eis, bedoeld in het
      eerste lid.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel21
  - number: '22.1'
    text: |-
      De vervoerder voldoet aan de eis van betrouwbaarheid, indien hij een met het oog op een communautaire
      vergunning of taxivervoer verleende verklaring omtrent het gedrag overeenkomstig de bepalingen van de
      [Wet justitiële gegevens][ref1] heeft overgelegd die niet ouder is dan twee maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0014194
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0014194
  - number: '22.2'
    text: |-
      De vervoerder wiens land van vestiging een andere lidstaat is dan Nederland, dan wel een andere staat die partij is
      bij de EER, voldoet aan de eis van betrouwbaarheid indien hij een niet ouder dan twee maanden zijnde, in die staat
      daartoe afgegeven verklaring heeft overgelegd.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel22
  - number: '23.1'
    text: |-
      Het verlies van de betrouwbaarheid van een vervoerder is een onevenredig strenge sanctie indien naar het oordeel
      van Onze Minister een door hem vast te stellen minimumaantal veroordelingen en sancties jegens een vervoerder niet
      is overschreden. Bij het bepalen van dit aantal houdt Onze Minister rekening met de aard van de overtreding die
      ten grondslag ligt aan een veroordeling of sanctie en het aantal gewaarmerkte afschriften van de vergunning van
      de vervoerder.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel23
  - number: '23.2'
    text: |-
      Indien het in het eerste lid bedoelde aantal is overschreden, kan Onze Minister het verlies van de betrouwbaarheid
      van een vervoerder als een onevenredig strenge sanctie aanmerken indien:
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel23
  - number: 23.2.a
    text: |-
      de totstandkoming van een aan een veroordeling of sanctie ten grondslag liggende overtreding de vervoerder of de
      voor hem werkzame personen niet of slechts ten dele kan worden verweten;
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel23
  - number: 23.2.b
    text: |-
      de wijze waarop de vervoerder de bedrijfsvoering van de vervoeronderneming heeft ingericht dan wel de handelwijze
      van een of meer leidinggevenden in die onderneming, het begaan van de aan een veroordeling of sanctie ten grondslag
      liggende overtreding heeft beperkt; of
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel23
  - number: 23.2.c
    text: |-
      het aantal aan een veroordeling of sanctie ten grondslag liggende overtredingen naar het oordeel van Onze Minister
      niet in redelijke verhouding staat tot de omvang van de vervoeronderneming, gemeten naar het aantal gewaarmerkte
      afschriften van de vergunning van die onderneming.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel23
  - number: 23a.1
    text: |-
      Het verlies van de betrouwbaarheid van een vervoersmanager is een onevenredig strenge sanctie indien naar het
      oordeel van Onze Minister een door hem vast te stellen minimumaantal veroordelingen en sancties jegens een
      vervoersmanager niet is overschreden. Bij het bepalen van dit aantal houdt Onze Minister rekening met de aard van
      de overtreding die ten grondslag ligt aan een veroordeling of sanctie en het aantal gewaarmerkte afschriften van de
      vergunning van de vervoerder of vervoerders waarvoor de vervoersmanager werkzaam is.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel23a
  - number: 23a.2
    text: |-
      Indien het in het eerste lid bedoelde aantal is overschreden, kan Onze Minister het verlies van de betrouwbaarheid
      van een vervoersmanager als een onevenredig strenge sanctie aanmerken indien:
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel23a
  - number: 23a.2.a
    text: |-
      de totstandkoming van een aan een veroordeling of sanctie ten grondslag liggende overtreding de vervoersmanager
      niet of slechts ten dele kan worden verweten;
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel23a
  - number: 23a.2.b
    text: |-
      de mate waarin de wijze waarop de vervoersmanager de bedrijfsvoering van een of meer vervoerondernemingen onder
      zijn verantwoordelijkheid heeft ingericht dan wel zijn handelwijze in die ondernemingen, het begaan van de aan een
      veroordeling of sanctie ten grondslag liggende overtreding heeft beperkt; of
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel23a
  - number: 23a.2.c
    text: |-
      het aantal aan een veroordeling of sanctie ten grondslag liggende overtredingen naar het oordeel van Onze Minister
      niet in redelijke verhouding staat tot de omvang van de vervoeronderneming of vervoerondernemingen waarvoor hij
      als zodanig werkzaam is, gemeten naar het aantal gewaarmerkte afschriften van de vergunning van die onderneming
      of ondernemingen.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel23a
  - number: 23a.3
    text: |-
      Het eerste en tweede lid zijn van overeenkomstige toepassing indien het gaat om de in [artikel 23][ref1] bedoelde
      veroordelingen en sancties jegens de vervoerder waarvoor de vervoersmanager werkzaam is.


      [ref1]: https://wetten.overheid.nl/BWBR0011982#Artikel23
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel23a
    references:
      - id: ref1
        bwb_id: BWBR0011982
        artikel: '23'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 23b
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld over de toepassing van de [artikelen 23][ref1] en
      [23a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011982#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0011982#Artikel23a
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel23b
    references:
      - id: ref1
        bwb_id: BWBR0011982
        artikel: '23'
        hoofdstuk: '2'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0011982
        artikel: 23a
        hoofdstuk: '2'
        paragraaf: '4'
  - number: '26.1'
    text: De vervoerder die taxivervoer verricht, moet aan de eis van vakbekwaamheid voldoen.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel26
  - number: '26.2'
    text: |-
      Degene die permanent en daadwerkelijk leiding geeft aan het vervoer, bedoeld in het eerste lid, voldoet aan de eis,
      bedoeld in het eerste lid, of, indien deze leiding bij meer personen berust, tenminste een van hen.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel26
  - number: '26.3'
    text: De vervoerder meldt Onze Minister de vervanging van een persoon als bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel26
  - number: '27'
    text: |-
      De vervoerder die openbaar vervoer of besloten busvervoer verricht, voldoet aan de eis van vakbekwaamheid door
      overlegging van een getuigschrift, dat is afgegeven door een door Onze Minister erkend exameninstituut, waarbij ten
      minste de kennis is vastgesteld van de onderwerpen en het opleidingsniveau van bijlage I, deel I, van verordening
      1071/2009/EG en die overeenkomstig die bijlage zijn georganiseerd.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel27
  - number: '28.1'
    text: 'De vervoerder die taxivervoer verricht voldoet aan de eis van vakbekwaamheid indien wordt overgelegd:'
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel28
  - number: 28.1.a
    text: |-
      een door Onze Minister erkend getuigschrift van met goed gevolg afgelegde examens waarbij ten minste de kennis is
      vastgesteld van de door Onze Minister vastgestelde onderwerpen, of
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel28
  - number: 28.1.b
    text: |-
      een voor het beroep van vervoerder die taxivervoer verricht afgegeven erkenning van EU-beroepskwalificaties als
      bedoeld in [artikel 6 van de Algemene wet erkenning EU-beroepskwalificaties][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0023066#Artikel6
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0023066
        artikel: '6'
  - number: '28.2'
    text: |-
      Een getuigschrift als bedoeld in het eerste lid, onderdeel a, geldt als een erkenning van EG-beroepskwalificaties
      als bedoeld in [artikel 6 van de Algemene wet erkenning EU-beroepskwalificaties][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0023066#Artikel6
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0023066
        artikel: '6'
  - number: '28.3'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over de gevallen waarin en de wijze waarop een erkenning van
      EU-beroepskwalificaties als bedoeld in het eerste lid, onderdeel b, wordt verstrekt.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel28
  - number: '28.4'
    text: |-
      Onze Minister neemt een aanvraag om verlening van een erkenning van EU-beroepskwalificaties voor taxivervoer in
      behandeling nadat de door Onze Minister vastgestelde vergoeding voor de kosten van deze behandeling is ontvangen.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel28
  - number: '28.5'
    text: |-
      Bij ministeriële regeling kan worden bepaald van welke onderwerpen, bedoeld in het eerste lid, onder a,
      vrijstelling kan worden verleend aan houders van in die regeling genoemde diploma's.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel28
  - number: '29.1'
    text: |-
      Indien de vervoerder door overlijden, wettelijke of lichamelijke onbekwaamheid van degene die op grond van
      [artikel 26][ref1] voldeed aan de eis van vakbekwaamheid in een onderneming, dienst of bedrijf van een gemeente,
      niet langer aan deze eis voldoet, kan Onze Minister, te rekenen vanaf dit moment, de belanghebbende die het
      vervoer wenst voort te zetten, onverminderd het vereiste van een vergunning, op verzoek voor ten hoogste een jaar
      ontheffing verlenen van deze eis in die onderneming of die dienst of dat bedrijf van een gemeente.


      [ref1]: https://wetten.overheid.nl/BWBR0011982#Artikel26
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0011982
        artikel: '26'
        hoofdstuk: '2'
        paragraaf: '6'
  - number: '29.2'
    text: |-
      Onze Minister neemt een aanvraag om verlening van een ontheffing in behandeling nadat de bij ministeriële regeling
      vastgestelde vergoeding voor de kosten van deze behandeling is ontvangen.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel29
  - number: '29.3'
    text: De periode, bedoeld in het eerste lid, kan in bijzondere gevallen met maximaal zes maanden worden verlengd.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel29
  - number: '29.4'
    text: |-
      Indien de vervoerder door overlijden, wettelijke of lichamelijke onbekwaamheid van degene die op grond van
      [artikel 27][ref1] voldeed aan de eis van vakbekwaamheid in een onderneming, dienst of bedrijf van een gemeente,
      niet langer aan deze eis voldoet, kan Onze Minister, te rekenen vanaf dit moment, degene die beschikt over een
      praktische ervaring van ten minste drie jaar in de dagelijkse leiding van die onderneming, die dienst of dat
      bedrijf, in bijzondere gevallen op verzoek voor bepaalde tijd ontheffing verlenen van deze eis in die onderneming,
      die dienst of dat bedrijf.


      [ref1]: https://wetten.overheid.nl/BWBR0011982#Artikel27
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0011982
        artikel: '27'
        hoofdstuk: '2'
        paragraaf: '6'
  - number: '29.5'
    text: |-
      Aan de ontheffing, bedoeld in het eerste lid, kan het voorschrift worden verbonden dat de belanghebbende binnen de
      periode waarvoor een ontheffing geldt, alsnog zal voldoen aan de eis van vakbekwaamheid.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel29
  - number: '30.1'
    text: |-
      De vervoerder die taxivervoer verricht overlegt elke vijf jaar, gerekend vanaf de dag waarop de vergunning is
      verleend, aan Onze Minister een verklaring omtrent het gedrag als bedoeld in [artikel 22, eerste lid][ref1], en
      toont aan dat hij voldoet aan de eis van vakbekwaamheid, bedoeld in [artikel 28, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011982#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0011982#Artikel28
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0011982
        artikel: '22'
        hoofdstuk: '2'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0011982
        artikel: '28'
        hoofdstuk: '2'
        paragraaf: '6'
  - number: '30.2'
    text: |-
      Indien Onze Minister vermoedt dat een persoon als bedoeld in [artikel 21][ref1] niet langer voldoet aan de eisen
      voor het afgeven van een verklaring omtrent het gedrag, kan Onze Minister verlangen dat, in afwijking van het
      eerste lid, die persoon binnen een door Onze Minister vast te stellen termijn opnieuw een verklaring omtrent het
      gedrag overlegt.


      [ref1]: https://wetten.overheid.nl/BWBR0011982#Artikel21
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0011982
        artikel: '21'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 30a
    text: |-
      De vervoerder die openbaar vervoer of besloten busvervoer verricht, voldoet aan de voorwaarden inzake de
      vestigingseis, bedoeld in artikel 5, eerste en tweede lid, van [verordening 1071/2009/EG](32009R1071).
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel30a
  - number: '31'
    text: |-
      Consumentenorganisaties die ingevolge de [artikelen 27, eerste lid][ref1], [31, eerste lid][ref2], en
      [44, derde lid, van de wet][ref3] om advies worden gevraagd:


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel31
      [ref3]: https://wetten.overheid.nl/BWBR0011470#Artikel44
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '27'
      - id: ref2
        bwb_id: BWBR0011470
        artikel: '31'
      - id: ref3
        bwb_id: BWBR0011470
        artikel: '44'
  - number: 31.a
    text: bezitten rechtspersoonlijkheid,
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel31
  - number: 31.b
    text: |-
      behartigen krachtens hun statutaire doelstellingen of hun feitelijke werkzaamheden de belangen van de reizigers in
      het openbaar vervoer en
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel31
  - number: 31.c
    text: zijn werkzaam op nationale of regionale schaal.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel31
  - number: '33.1'
    text: |-
      De onderwerpen, bedoeld in [artikel 31, derde lid, van de wet ][ref1]waarover de concessiehouder krachtens
      de concessie ten minste eenmaal per jaar advies vraagt aan consumentenorganisaties als bedoeld in
      [artikel 31 van dit besluit][ref2] betreffen, voor zover de concessiehouder ten aanzien van die onderwerpen
      maatregelen heeft getroffen:


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0011982#Artikel31
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '31'
      - id: ref2
        bwb_id: BWBR0011982
        artikel: '31'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 33.1.a
    text: de uitvoering van de dienstregeling,
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel33
  - number: 33.1.b
    text: de wijze waarop de concessiehouder de reiziger informeert over de dienstregeling en de tarieven,
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel33
  - number: 33.1.c
    text: de vervoervoorwaarden waartegen openbaar vervoer wordt verricht,
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel33
  - number: 33.1.d
    text: de modellen van vervoerbewijzen die de concessiehouder uitgeeft,
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel33
  - number: 33.1.e
    text: de wijze waarop en de mate waarin vervoerbewijzen verkrijgbaar zijn gesteld,
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel33
  - number: 33.1.f
    text: de wijze waarop reizigers de prijs van het vervoerbewijs kunnen voldoen,
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel33
  - number: 33.1.g
    text: |-
      de voorzieningen die de concessiehouder treft ten aanzien van de toegankelijkheid van het openbaar vervoer voor
      reizigers met een handicap en
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel33
  - number: 33.1.h
    text: |-
      de voorzieningen die de concessiehouder treft ten behoeve van het waarborgen van een verantwoorde mate van
      veiligheid van reizigers en van het voor hem werkzame personeel.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel33
  - number: '33.2'
    text: |-
      Het eerste lid is van toepassing op de concessieverlener indien hij op grond van
      [artikel 31, zevende lid, van de wet][ref1], een wijziging initieert van een onderwerp als bedoeld in het eerste
      lid.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel31
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '31'
  - number: '33.3'
    text: |-
      Voor zover de concessieverlener ten aanzien van die onderwerpen voorschriften aan de concessie heeft verbonden en
      voor zover de concessiehouder ten aanzien van die onderwerpen maatregelen heeft getroffen, is de aanhef van het
      eerste lid, mede van toepassing op:
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel33
  - number: 33.3.a
    text: |-
      de procedure voor de behandeling van klachten van de reiziger en de wijze waarop de concessiehouder de reiziger
      hierover informeert,
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel33
  - number: 33.3.b
    text: een regeling over een vergoeding aan de reiziger in geval van vertraging in de uitvoering van de dienstregeling en
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel33
  - number: 33.3.c
    text: |-
      aan het publiek kenbaar gemaakte doelstellingen van de concessiehouder over de kwaliteit van het door hem te
      verrichten openbaar vervoer.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel33
  - number: '34'
    text: |-
      De concessieverlener informeert consumentenorganisaties als bedoeld in [artikel 31][ref1] ten minste over
      resultaten van maatregelen ten aanzien van:


      [ref1]: https://wetten.overheid.nl/BWBR0011982#Artikel31
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0011982
        artikel: '31'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 34.a
    text: de mate van bereikbaarheid van het concessiegebied en
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel34
  - number: 34.b
    text: de aanleg en onderhoud van infrastructuur ten behoeve van het openbaar vervoer.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel34
  - number: '35'
    text: |-
      De plicht te gedogen, bedoeld in [artikel 35 van de wet][ref1], geldt ten aanzien van het gebruik door de
      concessiehouder van in bijlage I opgenomen categorieën of onderdelen van infrastructuur.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel35
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '35'
  - number: 35a.1
    text: |-
      Aan een concessie als bedoeld in [artikel 19 van de wet][ref1] die wordt verleend of gewijzigd wordt het
      voorschrift verbonden dat de concessiehouder verplicht om reizigers in staat te stellen een OV-chipkaart die
      voldoet aan bij ministeriële regeling gestelde regels als elektronisch vervoerbewijs te gebruiken op het openbaar
      vervoer dat de concessiehouder aanbiedt.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel19
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel35a
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '19'
  - number: 35a.2
    text: |-
      Het voorschrift, bedoeld in het eerste lid, geldt niet ten aanzien van door de concessiehouder aangeboden openbaar
      vervoer per auto, internationale passagiersvervoersdiensten en bij ministeriële regeling aangewezen soorten
      openbaar vervoer die daarmee gelijkenis vertonen, tenzij de desbetreffende concessieverlener anders voorschrijft.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel35a
  - number: '36.1'
    text: |-
      De duur van een concessie voor openbaar vervoer per trein bedraagt ten hoogste vijf jaar. Indien de concessie
      tevens wordt verleend voor het verrichten van openbaar vervoer anders dan per trein, bedraagt de duur van de
      concessie ten hoogste acht jaar.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel36
  - number: '36.2'
    text: |-
      In afwijking van het eerste lid kan de duur van een concessie voor openbaar vervoer per trein op ten hoogste
      tien jaar worden vastgesteld, indien dit naar het oordeel van de concessieverlener wordt gerechtvaardigd door het
      bestaan van commerciële overeenkomsten, specifieke investeringen of bijzondere risico’s.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel36
  - number: '36.3'
    text: |-
      In afwijking van het eerste lid kan de duur van een concessie voor openbaar vervoer per trein op ten hoogste
      vijftien jaar worden vastgesteld, indien dit naar het oordeel van de concessieverlener wordt gerechtvaardigd door
      het bestaan van omvangrijke investeringen voor lange termijn.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel36
  - number: 36a.1
    text: |-
      Onverminderd in de situaties, bedoeld in artikel 5, lid 3bis, van de [verordening (EG) nr. 1370/2007]
      (32007R1370), kan bij wijze van tijdelijke maatregel een concessie voor openbaar vervoer per trein als bedoeld in
      [artikel 20, vierde lid, van de wet][ref1], worden verleend zonder dat een aanbesteding wordt gehouden:


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel20
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel36a
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '20'
  - number: 36a.1.a
    text: in afwachting van tot stand te brengen infrastructuur;
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel36a
  - number: 36a.1.b
    text: in afwachting van de vorming van nieuwe concessiegebieden, of
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel36a
  - number: 36a.1.c
    text: gedurende een periode waarin aanbesteding wordt voorbereid.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel36a
  - number: 36a.2
    text: Van een concessieverlening, bedoeld in het eerste lid, wordt melding gedaan bij Onze Minister.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel36a
  - number: 36b
    text: |-
      Bevoegd tot het verlenen, wijzigen, of intrekken van concessies als bedoeld in
      [artikel 20, tweede lid, van de wet][ref1], is:


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel20
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel36b
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '20'
  - number: 36b.a
    text: |-
      in het in [bijlage II][ref1] weergegeven gebied het dagelijks bestuur van het openbaar lichaam Vervoerregio
      Amsterdam;


      [ref1]: https://wetten.overheid.nl/BWBR0011982
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel36b
    references:
      - id: ref1
        bwb_id: BWBR0011982
  - number: 36b.b
    text: |-
      in het in [bijlage III][ref1] weergegeven gebied het dagelijks bestuur van het openbaar lichaam Metropoolregio
      Rotterdam Den Haag.


      [ref1]: https://wetten.overheid.nl/BWBR0011982
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel36b
    references:
      - id: ref1
        bwb_id: BWBR0011982
  - number: '37.1'
    text: |-
      Bij ministeriële regeling kunnen in het belang van een goede uitvoering van [Verordening (EG) 1370/2007]
      (32007R1370) nadere regels worden gesteld ten aanzien van de wijze waarop aanbesteding van concessies voor openbaar
      vervoer plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel37
  - number: '37.2'
    text: |-
      Voor zover de [wet][ref1] niet anders bepaalt, wendt een concessieverlener zich zonder discriminatie en onder
      dezelfde voorwaarden als die welke hij voor gegadigden of inschrijvers in Nederland stelt, tot ondernemers in
      andere lidstaten en in overige staten die partij zijn bij de Overeenkomst betreffende de Europese Economische
      Ruimte, die voldoen aan de vereisten gesteld krachtens richtlijn nr. 2004/18/EG, en handelt hierbij transparant.


      [ref1]: https://wetten.overheid.nl/BWBR0011470
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0011470
  - number: '38'
    text: |-
      Het besluit tot concessieverlening geschiedt op grond van gunningscriteria nadat de geschiktheid van de vervoerders
      die niet uit hoofde van de wet, [artikel 37][ref1] of andere door de concessieverlener bij de aanbesteding gestelde
      voorwaarden zijn uitgesloten, door de concessieverlener is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0011982#Artikel37
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0011982
        artikel: '37'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '39.1'
    text: |-
      Onverminderd hetgeen bij de concessieverlening is bepaald, verstrekt een concessiehouder van een concessie die is
      verleend vóór de inwerkingtreding van artikel III, onderdeel K, van de Wet van 30 januari 2019 (Stb. 61) met het
      oog op de voorbereiding van aanbesteding van een concessie desgevraagd aan een concessieverlener:
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel39
  - number: 39.1.a
    text: gegevens over de vervoeromvang per lijn of traject in absolute reizigersaantallen of in reizigerskilometers,
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel39
  - number: 39.1.b
    text: gegevens over de gerealiseerde kosten van de uitvoering van de concessie,
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel39
  - number: 39.1.c
    text: |-
      gegevens over de tijdens de concessieperiode door de concessiehouder verkochte vervoerbewijzen op jaarbasis met de
      bijbehorende opbrengsten per kaartsoort en per tarief en
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel39
  - number: 39.1.d
    text: |-
      overige gegevens die naar het oordeel van de concessieverlener noodzakelijk zijn voor de voorbereiding van
      aanbesteding van een concessie.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel39
  - number: '39.2'
    text: |-
      De in het eerste lid, onderdeel b, bedoelde kosten worden ingedeeld naar de kostensoorten personeel en materieel
      en zodanig gespecificeerd en toegelicht dat een overzichtelijk beeld ontstaat van de samenstelling ervan, van de
      samenhang tussen kostensoorten en van de relatie met het niveau van de dienstverlening.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel39
  - number: '39.3'
    text: |-
      De concessiehouder verstrekt de gegevens, bedoeld in het eerste lid, onderdelen b en c,
      desgevraagd vergezeld van een toelichting en een verklaring van een accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '39.4'
    text: |-
      Het eerste, tweede en derde lid zijn van overeenkomstige toepassing op een vervoerder die openbaar vervoer verricht
      zonder een daartoe verleende concessie, indien de gegevens noodzakelijk zijn voor de voorbereiding van aanbesteding
      van een concessie voor dat openbaar vervoer.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel39
  - number: '40.1'
    text: |-
      De concessieverleners die een concessie hebben verleend, zenden een kennisgeving betreffende het verloop en de
      uitslag van de aanbestedingsprocedure aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel40
  - number: '40.2'
    text: Bij ministeriële regeling worden regels vastgesteld over de gegevens die de kennisgeving tenminste moet bevatten.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel40
  - number: '44'
    text: Een reiziger is voor het vervoer een vervoerprijs verschuldigd overeenkomstig het daarvoor geldende tarief.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel44
  - number: '45.1'
    text: |-
      Het verbod, bedoeld in [artikel 70, eerste lid, van de wet][ref1] is niet van toepassing op:


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel70
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '70'
  - number: 45.1.a
    text: |-
      kinderen onder geleide die de leeftijd van vier jaar nog niet hebben bereikt en voor wie geen eigen zitplaats wordt
      verlangd,
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel45
  - number: 45.1.b
    text: |-
      één persoon van ten minste twaalf jaar oud die een persoon begeleidt die is voorzien van een legitimatiebewijs
      voor gehandicapten,
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel45
  - number: 45.1.c
    text: |-
      ambtenaren en personen als bedoeld in de [artikelen 87][ref1] en [89 van de wet][ref2], belast met toezicht en
      opsporing, bij de uitoefening van de hun in die artikelen opgedragen taak.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel87
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel89
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '87'
      - id: ref2
        bwb_id: BWBR0011470
        artikel: '89'
  - number: '45.2'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over een legitimatiebewijs als bedoeld in het eerste lid,
      onderdeel b, alsmede over de afgifte ervan.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel45
  - number: '46.1'
    text: |-
      Geen vervoerprijs is verschuldigd voor het vervoer van handbagage en een hond die een persoon begeleidt die is
      voorzien van een legitimatiebewijs voor gehandicapten.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel46
  - number: '46.2'
    text: |-
      Onder handbagage wordt verstaan zaken die een reiziger als gemakkelijk mee te voeren, draagbaar, dan wel met de
      hand verrijdbaar bij zich heeft en geen zitplaats in het vervoermiddel innemen, waaronder een vouwfiets, levende
      dieren die gemakkelijk zijn mee te voeren en die geen zitplaats innemen, alsmede zaken die door de vervoerder als
      handbagage zijn toegelaten.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel46
  - number: '46.3'
    text: |-
      Tenzij de concessieverlener en concessiehouder anders regelen, is geen vervoerprijs verschuldigd voor het vervoer
      van:
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel46
  - number: 46.3.a
    text: een fiets, niet zijnde een zaak als bedoeld in het tweede lid,
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel46
  - number: 46.3.b
    text: levende dieren die niet als handbagage kunnen worden meegenomen.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel46
  - number: '46.4'
    text: |-
      Het derde lid is niet van toepassing op openbaar vervoer per trein waarvoor door Onze Minister een concessie is
      verleend.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel46
  - number: '47.1'
    text: |-
      De reiziger is met uitzondering van de gevallen, bedoeld in [artikel 45][ref1], en met uitzondering van de door de
      vervoerder bepaalde gevallen, verplicht zich van een geldig elektronisch vervoerbewijs te voorzien:


      [ref1]: https://wetten.overheid.nl/BWBR0011982#Artikel45
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0011982
        artikel: '45'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 47.1.a
    text: |-
      voordat hij, hetzij het vervoermiddel betreedt, hetzij een gedeelte van een station of halte betreedt waar hij
      blijkens duidelijke aanwijzingen van de vervoerder in het bezit moet zijn van een geldig elektronisch vervoerbewijs
      of
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel47
  - number: 47.1.b
    text: |-
      zo spoedig mogelijk nadat hij het vervoermiddel of het gedeelte van het station of de halte heeft betreden, voor
      zover daar een met afgifte of ontwaarding belaste functionaris of een voor afgifte of ontwaarding bestemd apparaat
      aanwezig is.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel47
  - number: '47.2'
    text: 'Een elektronisch vervoerbewijs is geldig indien:'
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel47
  - number: 47.2.a
    text: het een op grond van de concessie door of namens de concessiehouder afgegeven elektronisch vervoerbewijs betreft,
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel47
  - number: 47.2.b
    text: |-
      de reismogelijkheden van het elektronisch vervoerbewijs toereikend zijn voor de te maken reis en het vertrekpunt
      elektronisch is geregistreerd,
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel47
  - number: 47.2.c
    text: |-
      het elektronisch vervoerbewijs, voor zover het op naam is gesteld, overeenstemt met de identiteit van de houder
      daarvan en
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel47
  - number: 47.2.d
    text: |-
      de te betalen vervoerprijs voor de reis ten minste gelijk is aan het tarief dat de gebruiker van het elektronisch
      vervoerbewijs daarvoor verschuldigd is.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel47
  - number: '47.3'
    text: Een elektronisch vervoerbewijs is niet geldig indien het gewijzigd of anderszins bewerkt is.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel47
  - number: '48.1'
    text: |-
      De reiziger die het vervoerbewijs waarvan hij moet zijn voorzien desgevraagd ter controle niet toont of
      overhandigt, is op vordering van de vervoerder de vervoerprijs verschuldigd die geldt voor het traject tussen
      vertrekpunt en plaats van bestemming van de reiziger.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel48
  - number: '48.2'
    text: |-
      Onverminderd het eerste lid, is de reiziger op vordering van de vervoerder een bij ministeriële regeling vast te
      stellen bedrag verschuldigd indien hij:
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel48
  - number: 48.2.a
    text: |-
      niet voldoet aan de in [artikel 47, eerste lid][ref1], bedoelde verplichting,


      [ref1]: https://wetten.overheid.nl/BWBR0011982#Artikel47
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0011982
        artikel: '47'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 48.2.b
    text: het vervoerbewijs waarvan hij moet zijn voorzien desgevraagd niet toont of overhandigt,
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel48
  - number: 48.2.c
    text: een onbevoegd gewijzigd of anderszins bewerkt vervoerbewijs gebruikt,
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel48
  - number: 48.2.d
    text: een vervoerbewijs misbruikt of
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel48
  - number: 48.2.e
    text: de controle van vervoerbewijzen belemmert of verhindert.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel48
  - number: '48.3'
    text: |-
      Indien de vervoerder die gelegenheid biedt, betaalt de reiziger het bedrag, bedoeld in het tweede lid, terstond
      tezamen met de krachtens het eerste lid verschuldigde vervoerprijs.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel48
  - number: '48.4'
    text: |-
      Indien de reiziger de in het tweede en derde lid bedoelde bedragen terstond betaalt, is de vervoerder verplicht een
      betalingsbewijs af te geven, dat voor zover nodig tevens geldt als vervoerbewijs.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel48
  - number: '48.5'
    text: |-
      Indien de reiziger de in het tweede en derde lid bedoelde bedragen niet terstond betaalt, stelt de vervoerder
      hem in de gelegenheid deze bedragen alsnog te betalen binnen veertien dagen nadat het feit is geconstateerd. De
      vervoerder kan aan de reiziger een bewijs verstrekken op grond waarvan deze zijn reis kan aanvangen of voortzetten.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel48
  - number: '48.6'
    text: |-
      Indien de reiziger de in het tweede en derde lid bedoelde bedragen niet binnen de termijn, bedoeld in het vijfde
      lid, heeft betaald, stelt de vervoerder hem nogmaals in de gelegenheid deze bedragen, verhoogd met een bij
      ministeriële regeling vast te stellen bedrag aan administratiekosten, te betalen binnen veertien dagen na afloop
      van de termijn, bedoeld in het vijfde lid.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel48
  - number: '48.7'
    text: |-
      Zodra de reiziger voldoet aan het in het tweede, derde, vijfde of zesde lid bepaalde, vervalt het recht van
      strafvervolging ter zake van overtreding van [artikel 70, eerste lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel70
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '70'
  - number: '49'
    text: |-
      Zolang een opeisbare schuld ter zake van vervoerbewijzen niet is voldaan, heeft de betrokkene geen recht op afgifte
      van een op naam gesteld vervoerbewijs.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel49
  - number: '51'
    text: |-
      Bij intrekking van een vervoerbewijs of gedeelte van een vervoerbewijs geven de in de [artikelen 87][ref1] en
      [89 van de wet][ref2] bedoelde ambtenaren en personen daarvan een bewijs af aan de reiziger.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel87
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel89
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '87'
      - id: ref2
        bwb_id: BWBR0011470
        artikel: '89'
  - number: '52.1'
    text: |-
      Onder verstoring van orde, rust, veiligheid of een goede bedrijfsgang als bedoeld in
      [artikel 72 van de wet ][ref1]worden verstaan:


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel72
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '72'
  - number: 52.1.a
    text: |-
      gedragingen waardoor de bediening en het gebruik van voorzieningen of van een vervoermiddel dan wel de
      taakuitoefening van het personeel van de vervoerder worden verhinderd of belemmerd,
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel52
  - number: 52.1.b
    text: |-
      misbruik maken van voorzieningen dan wel gebruik maken van voorzieningen of van een vervoermiddel op een tijdstip
      waarop deze niet voor gebruik beschikbaar zijn dan wel op een andere wijze dan waarvoor deze bestemd zijn,
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel52
  - number: 52.1.c
    text: uit een vervoermiddel werpen van stoffen of van voorwerpen,
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel52
  - number: 52.1.d
    text: zich in kennelijke staat van dronkenschap of onder kennelijke invloed van verdovende middelen bevinden,
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel52
  - number: 52.1.e
    text: afsteken van vuurwerk, of op zodanige wijze geluid voortbrengen dat anderen daarvan hinder ondervinden,
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel52
  - number: 52.1.f
    text: uitoefenen van beroep of bedrijf of het aanbieden van diensten,
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel52
  - number: 52.1.g
    text: |-
      tentoonstellen van voorwerpen, maken van reclame of propaganda, verspreiden van drukwerken, bedelen of houden van
      inzamelingen,
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel52
  - number: 52.1.h
    text: |-
      meenemen in een vervoermiddel van dieren, stoffen of voorwerpen, die hinder, gevaar, verontreiniging of
      beschadiging veroorzaken of kunnen veroorzaken,
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel52
  - number: 52.1.i
    text: |-
      roken in een vervoermiddel, station of halte, of gedeelten daarvan, ten aanzien waarvan de vervoerder heeft
      aangegeven dat roken niet is toegestaan,
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel52
  - number: 52.1.j
    text: |-
      zich bevinden op een station of halte op een tijdstip dat deze kenbaar gesloten is of op een gedeelte van een
      station of halte dat kenbaar daartoe niet toegankelijk is,
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel52
  - number: 52.1.k
    text: zich op een station of halte begeven langs een andere dan de daarvoor bestemde weg,
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel52
  - number: 52.1.l
    text: op een andere wijze hinder, gevaar, verontreiniging of beschadiging veroorzaken of kunnen veroorzaken.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel52
  - number: '52.2'
    text: |-
      Het eerste lid is niet van toepassing voor zover de vervoerder daarvoor, met inachtneming van de belangen van de
      reizigers, toestemming heeft gegeven.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel52
  - number: '53'
    text: |-
      Onder aanwijzingen betreffende orde, rust, veiligheid of een goede bedrijfsgang wordt mede verstaan de door of
      vanwege de vervoerder kenbaar gemaakte aanduidingen in beeld of geschrift.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel53
  - number: 72a
    text: |-
      Bij ministeriële regeling worden regels gesteld over de verplichting voor de vervoerder die taxivervoer verricht
      om in of op de auto waarmee taxivervoer wordt verricht dan wel anderszins duidelijk kenbaar te maken op welke wijze
      een klacht als bedoeld in [artikel 78, eerste lid, van de wet][ref1] kan worden ingediend en op welke wijze deze
      wordt behandeld.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel78
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel72a
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '78'
  - number: '73.1'
    text: |-
      Bij ministeriële regeling worden regels gesteld over de verplichting voor de vervoerder om het ten tijde van het
      aanbieden van het taxivervoer te hanteren tarief duidelijk leesbaar te tonen zowel aan de buitenzijde van als
      binnen in de auto waarmee dat vervoer wordt verricht of dit tarief op een andere wijze kenbaar te maken.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel73
  - number: '73.2'
    text: |-
      Bij ministeriële regeling worden regels gesteld over de verplichting voor de vervoerder om de reiziger na afloop
      van het verrichtte taxivervoer een automatisch gegenereerd ritbewijs te verstrekken en over de verplicht op het
      ritbewijs te vermelden gegevens.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel73
  - number: '73.3'
    text: |-
      De regels, bedoeld in het tweede lid, kunnen voor bij ministeriële regeling aan te wijzen soorten taxidiensten
      verschillend luiden.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel73
  - number: '73.4'
    text: |-
      In de regels, bedoeld in het tweede lid, kan een uitzondering worden opgenomen voor taxivervoer dat wordt verricht
      ter uitvoering van een schriftelijke overeenkomst waarbij gedurende in een bij die overeenkomst vastgestelde
      periode meermalen taxivervoer wordt verricht tegen een in die overeenkomst vastgelegd tarief.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel73
  - number: '74.1'
    text: |-
      Met het besturen van een bus wordt slechts diegene belast, die in het bezit is van een niet ouder dan vijf
      jaar zijnde geneeskundige verklaring waaruit blijkt dat hij geen lichamelijke of geestelijke afwijkingen heeft
      welke hem zouden kunnen beletten een bus naar behoren te besturen en dat hij beschikt over voldoende gehoor-
      en gezichtsvermogen. De geneeskundige verklaring wordt afgegeven door een deskundige persoon als bedoeld in
      [artikel 14, eerste lid, van de Arbeidsomstandighedenwet][ref1] die belast is met de taken, bedoeld in de
      onderdelen b of c, van dat lid, of een arts die deel uitmaakt van een arbodienst als bedoeld in [die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0010346
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0010346
  - number: '74.2'
    text: |-
      Indien Onze Minister vermoedt dat de bestuurder van een bus, werkzaam in het openbaar vervoer of besloten
      busvervoer, niet meer voldoet aan de eisen, bedoeld in het eerste lid, kan Onze Minister verlangen dat die
      bestuurder zich binnen een door Onze Minister vast te stellen termijn aan een nieuw geneeskundig onderzoek
      onderwerpt. Indien dit onderzoek daartoe aanleiding geeft, kan de geneeskundige verklaring worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel74
  - number: '74.3'
    text: De bestuurder van een bus is verplicht de geneeskundige verklaring bij zich te hebben.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel74
  - number: '74.4'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld over de afgifte van een geneeskundige verklaring en
      een geneeskundig onderzoek.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel74
  - number: '75'
    text: |-
      Met het oog op de herkenbaarheid en toegankelijkheid van het vervoer van personen kunnen bij ministeriële regeling
      regels worden gesteld inzake de inrichting en uitrusting van trein, metro, tram, bus en auto.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel75
  - number: '76.1'
    text: |-
      Het is verboden openbaar vervoer met een bus of besloten busvervoer te verrichten indien in het kentekenregister
      de vermelding ontbreekt dat het voertuig is goedgekeurd als bus. Het is verboden taxivervoer of openbaar vervoer
      met een auto te verrichten indien in het kentekenregister de vermelding ontbreekt dat het voertuig is goedgekeurd
      als taxi.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel76
  - number: '76.2'
    text: |-
      Een keuringsbewijs als bedoeld in [artikel 72 van de Wegenverkeerswet 1994][ref1], dat is afgegeven voor het
      verrichten van openbaar vervoer, besloten busvervoer of taxivervoer met een bus of auto, verliest zijn geldigheid
      indien hieruit niet blijkt dat is voldaan aan de eisen, bedoeld in het derde lid, onderdeel b.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel72
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '72'
  - number: '76.3'
    text: |-
      Bij ministeriële regeling kunnen, onverminderd het bepaalde bij of krachtens de [Wegenverkeerswet 1994][ref1],
      regels worden gesteld inzake de inrichting, uitrusting en keuring van bussen en auto's, alsmede de voor de keuring
      verschuldigde vergoedingen, ten behoeve van de afgifte van:


      [ref1]: https://wetten.overheid.nl/BWBR0006622
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0006622
  - number: 76.3.a
    text: de aanduiding in het kentekenregister, bedoeld in het eerste lid,
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel76
  - number: 76.3.b
    text: |-
      het keuringsbewijs, bedoeld in [artikel 72 van de Wegenverkeerswet 1994][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel72
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '72'
  - number: '77.1'
    text: |-
      In het kentekenregister wordt het hoogste aantal personen, buiten de bestuurder, dat met een bus of auto mag worden
      vervoerd, vermeld, waarbij rekening kan worden gehouden met het soort vervoer dat wordt verricht en met de wijze
      waarop wordt plaats genomen in de bus of auto.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel77
  - number: '77.2'
    text: |-
      Het is verboden met een bus of auto meer personen te vervoeren, dan wel deze voor ander vervoer te gebruiken dan
      blijkens het kentekenregister is toegestaan.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel77
  - number: '77.3'
    text: |-
      Bij ministeriële regeling kunnen regels worden vastgesteld omtrent de wijze waarop het aantal personen, bedoeld in
      het eerste lid, wordt bepaald.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel77
  - number: '78.1'
    text: |-
      De vervoerder die taxivervoer verricht draagt er zorg voor dat in een auto waarmee taxivervoer wordt verricht, een
      taxameter aanwezig is die zichtbaar voor de reiziger de vervoerprijs overeenkomstig de kenbaar gemaakte tarieven
      aangeeft.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel78
  - number: '78.2'
    text: |-
      De taxameter voldoet aan de regels die bij of krachtens de [Metrologiewet][ref1] zijn gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0019517
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0019517
  - number: '78.3'
    text: |-
      Behoudens in geval schriftelijk in een overeenkomst tarieven zijn vastgelegd voor gedurende een bepaalde periode
      meermalen te verrichten taxivervoer, wordt taxivervoer slechts verricht indien de in de auto aanwezige taxameter
      wordt gebruikt.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel78
  - number: '78.4'
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld over de instelling van de taxameter en
      de tijdvakken waarop een controle van de taxameter moet plaatsvinden tegen de in het tweede lid
      bedoelde eisen voor een in gebruik genomen taxameter. De [artikelen 14, tweede lid][ref1], en
      [artikel 22 van het Besluit meetinstrumenten en marktdeelnemers][ref2] zijn daarbij van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0037835#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0037835#Artikel22
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0037835
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0037835
        artikel: '22'
  - number: '78.6'
    text: |-
      Het eerste lid is niet van toepassing indien de auto uitsluitend wordt gebruikt voor taxivervoer dat wordt verricht
      ter uitvoering van een schriftelijke overeenkomst waarbij gedurende in een bij die overeenkomst vastgestelde
      periode meermalen taxivervoer wordt verricht tegen een in die overeenkomst vastgelegd tarief en in door Onze
      Minister te bepalen gevallen waarbij de auto uitsluitend wordt gebruikt voor vervoer tegen eenheidsprijzen.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel78
  - number: 78a
    text: |-
      De vervoerder en de bestuurder die taxivervoer verrichten maken tijdens het verrichten van taxivervoer gebruik
      van een boordcomputer overeenkomstig de [artikelen 79 tot en met 83][ref1], dan wel van de centrale database
      taxivervoer overeenkomstig [paragraaf 4][ref2] van dit hoofdstuk. Indien gebruik wordt gemaakt van de centrale
      database taxivervoer overeenkomstig paragraaf 4 van dit hoofdstuk, geldt [artikel 81, derde lid][ref3], onverkort.


      [ref1]: https://wetten.overheid.nl/BWBR0011982#Artikel79
      [ref2]: https://wetten.overheid.nl/BWBR0011982#Hoofdstuk6
      [ref3]: https://wetten.overheid.nl/BWBR0011982#Artikel81
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel78a
    references:
      - id: ref1
        bwb_id: BWBR0011982
        artikel: '79'
        hoofdstuk: '6'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0011982
        hoofdstuk: '6'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0011982
        artikel: '81'
        hoofdstuk: '6'
        paragraaf: '3'
  - number: '79.1'
    text: |-
      De vervoerder die taxivervoer verricht, draagt er zorg voor dat in een auto waarmee taxivervoer wordt verricht een
      op correcte wijze functionerende boordcomputer aanwezig is waarvoor een typegoedkeuring is verleend, als bedoeld in
      [artikel 22, eerste lid, van de Wegenverkeerswet 1994][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel22
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '22'
  - number: '79.2'
    text: |-
      De boordcomputer, bedoeld in het eerste lid, heeft een activeringskeuring en, voor zover bepaald bij ministeriële
      regeling, een periodiek onderzoek ondergaan, die zijn uitgevoerd door erkende natuurlijke of rechtspersonen, als
      bedoeld in [artikel 9:1, eerste lid, van de Arbeidstijdenwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel9
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0007671
        artikel: '9'
  - number: '79.3'
    text: |-
      De vervoerder die taxivervoer verricht draagt er zorg voor dat de boordcomputer te allen tijde de volgende gegevens
      registreert:
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel79
  - number: 79.3.a
    text: de kilometerstand van de auto;
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel79
  - number: 79.3.b
    text: het kenteken van de auto;
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel79
  - number: 79.3.c
    text: de datum en de tijd;
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel79
  - number: 79.3.d
    text: de door de auto afgelegde route;
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel79
  - number: 79.3.e
    text: informatie over de werking van de boordcomputer.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel79
  - number: '79.4'
    text: |-
      De vervoerder die taxivervoer verricht draagt er tevens zorg voor dat de boordcomputer de arbeids- en rusttijden
      van de bestuurder registreert.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel79
  - number: '79.5'
    text: |-
      Indien de bestuurder taxivervoer verricht, draagt de vervoerder er, onverminderd het derde en vierde lid, zorg voor
      dat de boordcomputer de volgende gegevens registreert:
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel79
  - number: 79.5.a
    text: |-
      het personenvervoernummer dat staat aangegeven op de vergunning, bedoeld in
      [artikel 4, eerste lid, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel4
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '4'
  - number: 79.5.b
    text: |-
      het aan de vervoerder toegekende unieke nummer, als bedoeld in
      [artikel 9, onderdeel a, van de Handelsregisterwet 2007][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0021777#Artikel9
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0021777
        artikel: '9'
  - number: 79.5.c
    text: het nummer van de chauffeurskaart van de bestuurder;
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel79
  - number: 79.5.d
    text: de datum en het tijdstip van aankomst en vertrek per rit;
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel79
  - number: 79.5.e
    text: de locatie van vertrek en aankomst per rit;
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel79
  - number: 79.5.f
    text: |-
      de afstand, de prijs van het vervoer per rit in beladen en onbeladen staat en eventueel in rekening gebrachte
      toeslagen.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel79
  - number: '79.6'
    text: |-
      Indien de boordcomputer buiten toedoen van de bestuurder en de vervoerder buiten gebruik is, geldt
      in plaats van de verplichting, bedoeld in het derde tot en met het vijfde lid, het bepaalde krachtens
      [artikel 80, vijfde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011982#Artikel80
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0011982
        artikel: '80'
        hoofdstuk: '6'
        paragraaf: '3'
  - number: '79.7'
    text: |-
      Bij ministeriële regeling worden regels gesteld over de keuring ter activering van de boordcomputer, het periodiek
      onderzoek en de tijdvakken waarop een onderzoek van de boordcomputer plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel79
  - number: '79.8'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld over het erkennen van natuurlijke of rechtspersonen
      die een boordcomputer activeren, herstellen en periodiek onderzoeken, de aanvraag van de erkenning, de voor de
      erkenning gestelde eisen, de aan de erkenning te verbinden voorschriften en de intrekking of schorsing van een
      erkenning.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel79
  - number: '80.1'
    text: |-
      De bestuurder en de vervoerder die taxivervoer verrichten, gebruiken de boordcomputer overeenkomstig het bij
      ministeriële regeling bepaalde, tenzij de boordcomputer buiten toedoen van de bestuurder en de vervoerder buiten
      gebruik is.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel80
  - number: '80.2'
    text: |-
      De vervoerder die taxivervoer verricht bewaart de door de boordcomputer geregistreerde gegevens, bedoeld in
      [artikel 79, derde en vijfde lid][ref1], en de gegevens, bedoeld in het vijfde lid, ten minste 104 weken, gerekend
      vanaf de datum waarop de gegevens betrekking hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0011982#Artikel79
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0011982
        artikel: '79'
        hoofdstuk: '6'
        paragraaf: '3'
  - number: '80.3'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over de wijze van bewaren van de gegevens, bedoeld in
      [artikel 79, derde en vijfde lid][ref1], en het overbrengen van de in de boordcomputer en de op de chauffeurskaart
      geregistreerde gegevens naar de vestiging van de vervoerder die taxivervoer verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0011982#Artikel79
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0011982
        artikel: '79'
        hoofdstuk: '6'
        paragraaf: '3'
  - number: '80.4'
    text: |-
      Het derde lid is van overeenkomstige toepassing op de gegevens bedoeld in [artikel 79, vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011982#Artikel79
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0011982
        artikel: '79'
        hoofdstuk: '6'
        paragraaf: '3'
  - number: '80.5'
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld over de registratieverplichtingen die op de vervoerder en
      de bestuurder rusten indien de boordcomputer buiten gebruik is en de gegevens die in dat geval aanwezig zijn in de
      auto waarmee taxivervoer wordt verricht.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel80
  - number: '80.6'
    text: |-
      Indien de boordcomputer niet op correcte wijze functioneert of buiten gebruik is, draagt de vervoerder er zorg
      voor dat de boordcomputer, binnen een bij ministeriële regeling te bepalen termijn, hersteld wordt door erkende
      natuurlijke of rechtspersonen, als bedoeld in [artikel 9:1, eerste lid, van de Arbeidstijdenwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel9
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0007671
        artikel: '9'
  - number: '80.7'
    text: |-
      De vervoerder verstrekt de bestuurder op diens verzoek een kopie van de gegevens die ingevolge het derde lid van de
      chauffeurskaart zijn overgebracht naar de vestiging van de vervoerder.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel80
  - number: '80.8'
    text: 'Het is de vervoerder die taxivervoer verricht verboden:'
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel80
  - number: 80.8.a
    text: |-
      om de boordcomputer ondeugdelijk te maken, of te doen maken, te vernietigen of te doen vernietigen, dan wel toe te
      laten dat de boordcomputer ondeugdelijk gemaakt, of vernietigd wordt;
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel80
  - number: 80.8.b
    text: |-
      om in de auto waarmee taxivervoer wordt verricht een voorziening aanwezig te hebben die kennelijk bedoeld is om
      voor misbruik, als bedoeld in onderdeel a, aan te wenden.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel80
  - number: '80.9'
    text: Het achtste lid is van overeenkomstige toepassing op de bestuurder van een auto waarmee taxivervoer wordt verricht.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel80
  - number: '81.1'
    text: |-
      De vervoerder die taxivervoer verricht, gebruikt ten behoeve van een deugdelijke registratie van de gegevens,
      bedoeld in [artikel 79, derde tot en met vijfde lid][ref1], een door Onze Minister verstrekte ondernemerskaart.


      [ref1]: https://wetten.overheid.nl/BWBR0011982#Artikel79
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0011982
        artikel: '79'
        hoofdstuk: '6'
        paragraaf: '3'
  - number: '81.2'
    text: |-
      De erkende natuurlijke persoon of rechtspersoon, als bedoeld in
      [artikel 9:1, eerste lid, van de Arbeidstijdenwet][ref1] gebruikt ten behoeve van het installeren, onderzoeken of
      herstellen van de boordcomputer een door Onze Minister verstrekte keuringskaart.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel9
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0007671
        artikel: '9'
  - number: '81.3'
    text: |-
      Met het besturen van een auto waarmee taxivervoer wordt verricht, wordt slechts diegene belast, die in het bezit is
      van een geldige, behoorlijk leesbare, door Onze Minister verstrekte chauffeurskaart.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel81
  - number: '81.4'
    text: |-
      Voor bij ministeriële regeling aan te wijzen soorten taxidiensten waarbij gedurende een bepaalde periode meermalen
      taxivervoer wordt verricht volgens een schriftelijke overeenkomst waarin tarieven zijn vastgelegd, kan in de plaats
      van de in het derde lid bedoelde chauffeurskaart volstaan worden met een chauffeurskaart onder beperkingen.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel81
  - number: '81.5'
    text: |-
      De bestuurder van een auto waarmee taxivervoer wordt verricht, is in het bezit van een door Onze Minister
      verstrekte chauffeurskaart of chauffeurskaart onder beperkingen en gebruikt deze kaart ten behoeve van een
      deugdelijke registratie van de gegevens, bedoeld in [artikel 79, derde tot en met vijfde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011982#Artikel79
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0011982
        artikel: '79'
        hoofdstuk: '6'
        paragraaf: '3'
  - number: '81.6'
    text: |-
      Ten behoeve van het toezicht op de naleving van het bepaalde krachtens het vierde lid, is in een auto waarmee een
      in het vierde lid bedoelde taxidienst wordt verricht het deel van de administratie aanwezig waarmee kan worden
      aangetoond dat daadwerkelijk de in het vierde lid bedoelde soort taxidienst wordt verricht.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel81
  - number: '81.7'
    text: Bij ministeriële regeling kunnen eisen gesteld worden aan het deel van de administratie, bedoeld in het zesde lid.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel81
  - number: '81.8'
    text: |-
      Ingeval van verlies, diefstal, beschadiging of een defect van de ondernemerskaart respectievelijk de
      chauffeurskaart geldt in plaats van de verplichtingen, bedoeld in het eerste en vijfde lid, het bij ministeriële
      regeling bepaalde.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel81
  - number: '82.1'
    text: 'Bij de aanvraag voor de chauffeurskaart worden de volgende documenten overgelegd:'
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel82
  - number: 82.1.a
    text: |-
      een rijbewijs als bedoeld in de [Wegenverkeerswet 1994](onbekend) dan wel een door het bevoegde gezag buiten
      Nederland afgegeven rijbewijs, dat geldig is voor het besturen van het motorrijtuig waarmee wordt gereden;
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel82
  - number: 82.1.b
    text: |-
      een geneeskundige verklaring die niet ouder is dan vier maanden, die voldoet aan de eisen, bedoeld in
      [artikel 74, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011982#Artikel74
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0011982
        artikel: '74'
        hoofdstuk: '6'
        paragraaf: '1'
  - number: 82.1.c
    text: |-
      een met het oog op het uitoefenen van het beroep van taxichauffeur verleende verklaring omtrent het gedrag
      overeenkomstig de bepalingen van de [Wet justitiële en strafvorderlijke gegevens][ref1], die niet ouder is dan
      vier maanden;


      [ref1]: https://wetten.overheid.nl/BWBR0014194
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0014194
  - number: 82.1.d
    text: |-
      een door Onze Minister erkend getuigschrift van met goed gevolg afgelegde examens waarbij ten minste de kennis
      is vastgesteld van de door Onze Minister vastgestelde onderwerpen, waarbij onderscheid gemaakt kan worden tussen
      verschillende soorten taxidiensten;
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel82
  - number: 82.1.e
    text: |-
      een niet beschadigde, recente, goed gelijkende pasfoto van de aanvrager, die voldoet aan alle acceptatiecriteria
      zoals die zijn opgenomen in de bij de [Paspoortuitvoeringsregeling Nederland 2001][ref1] behorende fotomatrix.


      [ref1]: https://wetten.overheid.nl/BWBR0012811
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0012811
  - number: '82.2'
    text: |-
      Op de aanvrager die woonachtig is in een andere lidstaat dan Nederland, dan wel een andere staat die partij is bij
      de EER, is voor wat betreft de verklaring omtrent het gedrag, [artikel 22, tweede lid][ref1], van overeenkomstige
      toepassing, met dien verstande dat het document of de verklaring niet ouder is dan vier maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0011982#Artikel22
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0011982
        artikel: '22'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: '82.3'
    text: |-
      Bij ministeriële regeling kan worden bepaald van welke onderwerpen, bedoeld in het eerste lid, onderdeel d,
      vrijstelling kan worden verleend.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel82
  - number: '82.4'
    text: |-
      Onze Minister kan onder voorwaarden en beperkingen vrijstelling verlenen van de verplichting om het getuigschrift,
      bedoeld in het eerste lid, onderdeel d, over te leggen.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel82
  - number: '82.5'
    text: |-
      Indien naar het oordeel van Onze Minister niet of niet langer wordt voldaan aan de voorwaarden en beperkingen,
      bedoeld in het vierde lid, kan de vrijstelling worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel82
  - number: '82.6'
    text: |-
      Indien Onze Minister vermoedt dat de bestuurder van een auto waarmee taxivervoer wordt verricht, niet meer voldoet
      aan de eisen voor het afgeven van een geneeskundige verklaring of een verklaring omtrent het gedrag, als bedoeld in
      het eerste lid, onderdeel b, respectievelijk c, kan Onze Minister verlangen dat die bestuurder zich binnen een door
      hem vast te stellen termijn aan een nieuw geneeskundig onderzoek onderwerpt, respectievelijk opnieuw verzoekt om
      afgifte van een verklaring omtrent het gedrag. De bestuurder overlegt binnen een door Onze Minister vast te stellen
      termijn de nieuwe geneeskundige verklaring of de nieuwe verklaring omtrent het gedrag.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel82
  - number: '82.7'
    text: |-
      Een aanvrager van een chauffeurskaart die voorafgaand aan de verlening van die chauffeurskaart in het bezit is van
      een geldige chauffeurskaart, hoeft bij zijn aanvraag geen verklaring omtrent het gedrag als bedoeld in het eerste
      lid, onderdeel c, te overleggen, onverminderd de bevoegdheid om opnieuw afgifte van een verklaring omtrent het
      gedrag te verlangen, bedoeld in het zesde lid.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel82
  - number: '83.1'
    text: |-
      Onze Minister neemt een aanvraag om verlening van een boordcomputerkaart in behandeling nadat de bij ministeriële
      regeling vastgestelde vergoeding voor de kosten van deze behandeling is ontvangen.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel83
  - number: '83.2'
    text: De boordcomputerkaarten hebben een geldigheidsduur van vijf jaar.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel83
  - number: '83.3'
    text: |-
      Een boordcomputerkaart verliest zijn geldigheid door intrekking of schorsing en door het verstrijken van de
      geldigheidsduur.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel83
  - number: '83.4'
    text: |-
      Een binnen de geldigheidsduur verloren, gestolen, defect geraakt, of beschadigde boordcomputerkaart, wordt
      vervangen door een vervangende kaart voor de resterende termijn van geldigheid.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel83
  - number: '83.5'
    text: |-
      De houder van een chauffeurskaart of ondernemerskaart meldt verlies of diefstal van zijn boordcomputerkaart aan
      Onze Minister.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel83
  - number: '83.6'
    text: |-
      De houder van een chauffeurskaart of ondernemerskaart levert een defecte, beschadigde of ingetrokken
      boordcomputerkaart in bij Onze Minister binnen een bij ministeriële regeling te bepalen termijn.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel83
  - number: '83.7'
    text: Het vijfde en zesde lid zijn van overeenkomstige toepassing op de houder van een keuringskaart.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel83
  - number: '83.8'
    text: 'Bij ministeriële regeling worden regels gesteld over:'
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel83
  - number: 83.8.a
    text: de wijze waarop de bestuurder en de vervoerder de chauffeurskaart, respectievelijk de ondernemerskaart gebruiken;
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel83
  - number: 83.8.b
    text: |-
      de wijze waarop erkende natuurlijke of rechtspersonen, als bedoeld in
      [artikel 9:1, eerste lid, van de Arbeidstijdenwet][ref1], de keuringskaart gebruiken;


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel9
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0007671
        artikel: '9'
  - number: 83.8.c
    text: de aanvraag van de boordcomputerkaarten en van vervangende boordcomputerkaarten;
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel83
  - number: 83.8.d
    text: |-
      de verlening, afgifte, weigering, schorsing, intrekking en inname van de boordcomputerkaarten en de gronden
      daarvoor;
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel83
  - number: 83.8.e
    text: de wijze van melden in geval van verloren, gestolen, defecte of beschadigde boordcomputerkaarten;
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel83
  - number: 83.8.f
    text: de wijze van inleveren van de boordcomputerkaarten.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel83
  - number: '83.9'
    text: |-
      In het kader van leer-werktrajecten en in het kader van tijdelijke en incidentele dienstverrichting als
      bedoeld in [artikel 21 van de Algemene wet erkenning EU-beroepskwalificaties][ref1], kan door Onze Minister een
      chauffeurskaart worden verstrekt met een kortere geldigheidsduur dan de in het tweede lid bedoelde geldigheidsduur,
      dan wel ontheffing worden verleend van de in [artikel 81, vijfde lid][ref2], bedoelde eis.


      [ref1]: https://wetten.overheid.nl/BWBR0023066#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0011982#Artikel81
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0023066
        artikel: '21'
      - id: ref2
        bwb_id: BWBR0011982
        artikel: '81'
        hoofdstuk: '6'
        paragraaf: '3'
  - number: 83a.1
    text: |-
      Er is een centrale database taxivervoer. Onze Minister is beheerder van en verwerkingsverantwoordelijke voor deze
      database.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel83a
  - number: 83a.2
    text: |-
      De gegevens, waaronder mede begrepen persoonsgegevens als genoemd in [artikel 83b, tweede lid][ref1], worden in
      de centrale database taxivervoer verzameld en verwerkt met als doel toezicht op de naleving en handhaving van het
      bepaalde bij of krachtens de [wet][ref2] en de [Arbeidstijdenwet][ref3] voor zover dat ziet op taxivervoer en op
      arbeids- en rusttijden.


      [ref1]: https://wetten.overheid.nl/BWBR0011982#Artikel83b
      [ref2]: https://wetten.overheid.nl/BWBR0011470
      [ref3]: https://wetten.overheid.nl/BWBR0007671
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel83a
    references:
      - id: ref1
        bwb_id: BWBR0011982
        artikel: 83b
        hoofdstuk: '6'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0011470
      - id: ref3
        bwb_id: BWBR0007671
  - number: 83a.3
    text: |-
      De gegevens in de centrale database taxivervoer worden gedurende twee jaar in die database bewaard, waarna ze
      worden vernietigd.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel83a
  - number: 83b.1
    text: |-
      Er is een deugdelijk registratiemiddel. De vervoerder die taxivervoer verricht is verwerkingsverantwoordelijke voor
      een registratiemiddel.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel83b
  - number: 83b.2
    text: |-
      De vervoerder en de bestuurder die taxivervoer verrichten dragen er zorg voor dat in een auto waarmee taxivervoer
      wordt verricht met gebruikmaking van een deugdelijk registratiemiddel de volgende gegevens op correcte wijze worden
      geregistreerd:
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel83b
  - number: 83b.2.a
    text: het kenteken van de auto;
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel83b
  - number: 83b.2.b
    text: de datum en de tijd van de aanvang en de beëindiging van de werkzaamheden aan boord van de auto;
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel83b
  - number: 83b.2.c
    text: de arbeids- en rusttijden van de bestuurder;
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel83b
  - number: 83b.2.d
    text: |-
      het personenvervoernummer dat staat aangegeven op de vergunning, bedoeld
      in[ artikel 4, eerste lid, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel4
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel83b
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '4'
  - number: 83b.2.e
    text: |-
      het aan de vervoerder toegekende unieke nummer, als bedoeld in
      [artikel 9, onderdeel a, van de Handelsregisterwet 2007][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0021777#Artikel9
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel83b
    references:
      - id: ref1
        bwb_id: BWBR0021777
        artikel: '9'
  - number: 83b.2.f
    text: het nummer van het rijbewijs van de bestuurder;
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel83b
  - number: 83b.2.g
    text: het chauffeursnummer;
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel83b
  - number: 83b.2.h
    text: de datum en het tijdstip van aankomst en vertrek per rit;
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel83b
  - number: 83b.2.i
    text: de locatie van vertrek per rit;
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel83b
  - number: 83b.2.j
    text: de afstand per rit;
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel83b
  - number: 83b.2.k
    text: de prijs van het vervoer per rit in beladen staat en de eventueel in rekening gebrachte toeslagen;
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel83b
  - number: 83b.2.l
    text: andere werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel83b
  - number: 83b.3
    text: |-
      Bij ministeriële regeling worden regels gesteld over de wijze waarop de gegevens, bedoeld in het tweede lid,
      worden geregistreerd en worden aangeleverd in de centrale database taxivervoer. Deze regels hebben betrekking op de
      authenticiteit, de kwaliteit, de wijze waarop en de voorwaarden waaronder wordt geregistreerd en aangeleverd.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel83b
  - number: 83b.4
    text: |-
      De vervoerder die taxivervoer verricht, levert de gegevens, bedoeld in het tweede lid, in de centrale database
      taxivervoer, realtime aan volgens de regels als bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel83b
  - number: 83c.1
    text: |-
      Onze Minister zendt in overeenstemming met Onze Minister van Sociale Zaken en Werkgelegenheid binnen 3 jaar na de
      inwerkingtreding van de regels omtrent de centrale database taxivervoer aan de Staten Generaal een verslag over de
      doeltreffendheid en de effecten van deze regelgeving in de praktijk.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel83c
  - number: 83c.2
    text: |-
      In deze evaluatie wordt in ieder geval aandacht besteed aan de wijze waarop in de praktijk uitvoering wordt gegeven
      aan de voorschriften die zien op de registratie en aanleververplichting van de taxivervoergegevens in de centrale
      database taxivervoer.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel83c
  - number: '89'
    text: 'Voor de toepassing van dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel89
  - number: 89.a
    text: |-
      *ASOR*: Overeenkomst betreffende internationaal ongeregeld personenvervoer over de weg met autobussen als bedoeld
      in Besluit 82/505/EEG van de Raad van de Europese Gemeenschappen houdende afsluiting van deze overeenkomst (PbEG
      L 230),
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel89
  - number: 89.b
    text: |-
      *Interbus-overeenkomst*: Overeenkomst betreffende het ongeregeld internationaal vervoer van personen met
      touringcars en met autobussen als bedoeld in Besluit 2002/917/EG van de Raad van de Europese Unie van 3 oktober
      2002 houdende goedkeuring van deze overeenkomst (PbEG L 321),
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel89
  - number: 89.c
    text: |-
      *Beneluxbeschikking*: Beschikking van het Comité van Ministers van 20 december 1994 M(94)7, houdende de
      vaststelling van additionele bepalingen inzake het reizigersvervoer met touringcars en met autobussen op het
      grondgebied van een Beneluxstaat,
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel89
  - number: 89.d
    text: |-
      *derde land*: overeenkomstsluitende partij bij de ASOR, niet zijnde de Europese Gemeenschappen, een lidstaat dan
      wel een staat die partij is bij de EER of bij de Interbus-overeenkomst,
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel89
  - number: 89.e
    text: '*ander land*: land, niet zijnde een lidstaat, land dat partij is bij de Interbus-overeenkomst of een derde land,'
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel89
  - number: 89.f
    text: '*geregeld vervoer*:'
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel89
  - number: 89.f.1°
    text: 'in de relatie met derde landen: geregeld vervoer als bedoeld in artikel 3, eerste lid, van de ASOR,'
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel89
  - number: 89.f.2°
    text: |-
      in de relatie met andere landen: geregeld vervoer als bedoeld in artikel 3, eerste lid, van de ASOR, tenzij anders
      bepaald in de met deze landen gesloten overeenkomsten,
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel89
  - number: 89.f.3°
    text: |-
      in de relatie met landen die partij zijn bij de Interbus-overeenkomst: geregeld vervoer als bedoeld in artikel 3,
      derde lid, van de Interbus-overeenkomst,
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel89
  - number: 89.g
    text: '*een bijzondere vorm van geregeld vervoer*:'
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel89
  - number: 89.g.1°
    text: |-
      in de relatie met derde landen: een bijzondere vorm van geregeld vervoer in de zin van artikel 3, tweede lid, van
      de ASOR,
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel89
  - number: 89.g.2°
    text: |-
      in de relatie met andere landen: een bijzondere vorm van geregeld vervoer als bedoeld in artikel 3, tweede lid, van
      de ASOR, tenzij anders bepaald in de met deze landen gesloten overeenkomsten,
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel89
  - number: 89.g.3°
    text: |-
      in de relatie met landen die partij zijn bij de Interbus-overeenkomst: een bijzondere vorm van geregeld vervoer als
      bedoeld in artikel 3, vierde lid, van de Interbus-overeenkomst,
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel89
  - number: 89.h
    text: '*pendelvervoer*:'
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel89
  - number: 89.h.1°
    text: 'in de relatie met derde landen: pendelvervoer als bedoeld in artikel 4, eerste lid, van de ASOR,'
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel89
  - number: 89.h.2°
    text: |-
      in de relatie met andere landen: pendelvervoer als bedoeld in artikel 4, eerste lid, van de ASOR, tenzij anders
      bepaald in de met deze landen gesloten overeenkomsten,
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel89
  - number: 89.h.3°
    text: |-
      in de relatie met landen die partij zijn bij de Interbus-overeenkomst: pendelvervoer als bedoeld in artikel 3,
      vijfde lid, van de Interbus-overeenkomst,
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel89
  - number: 89.i
    text: '*ongeregeld vervoer*:'
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel89
  - number: 89.i.1°
    text: 'in de relatie met andere Beneluxlanden: ongeregeld vervoer in de zin van artikel 4 van de Beneluxbeschikking,'
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel89
  - number: 89.i.2°
    text: |-
      in de relatie met derde landen: ongeregeld vervoer in de zin van artikel 2, eerste lid, van de ASOR voor zover dat
      vervoer beantwoordt aan de voorwaarden, bedoeld in artikel 1 van deze overeenkomst,
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel89
  - number: 89.i.3°
    text: |-
      in de relatie met andere landen: het grensoverschrijdend vervoer van personen met autobussen dat noch aan de
      definitie van geregeld vervoer in de onderdeel i, noch aan de definitie van pendelvervoer in onderdeel i voldoet,
      omvattende: '- het vervoer in gesloten rondritten, daaronder begrepen vervoer met hetzelfde voertuig dat dezelfde'
      groep reizigers over het gehele traject vervoert en naar de plaats van vertrek terugbrengt,
        - het vervoer waarbij de heenreis met en de terugreis zonder reizigers plaatsvindt,
        - alle andere vormen van vervoer.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel89
  - number: 89.i.4°
    text: |-
      in relatie met landen die partij zijn bij de Interbus-overeenkomst: ongeregeld internationaal vervoer als bedoeld
      in artikel 3, tweede lid, van de Interbusovereenkomst,
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel89
  - number: '91.1'
    text: |-
      Onze Minister beslist op een aanvraag om een vergunning, een attest of een bewijs van toelating voor internationaal
      vervoer als bedoeld in dit hoofdstuk. Hij kan ambtshalve of op verzoek de vergunning, het attest of het bewijs van
      toelating vernieuwen, wijzigen of intrekken. De vergunning kan tevens ambtshalve worden geschorst.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel91
  - number: '91.2'
    text: |-
      Reisbladenboekjes als bedoeld in artikel 7, eerste lid, van de ASOR, alsmede in artikel 11 van de Interbus-
      overeenkomst worden voor Nederland afgegeven door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel91
  - number: '91.3'
    text: |-
      Een kopie van het reisblad als bedoeld in artikel 13 van de ASOR, alsmede in artikel 13 van de Interbus-
      overeenkomst wordt op het hoofdkantoor van de desbetreffende vervoerder tenminste twee jaar bewaard.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel91
  - number: '94'
    text: |-
      Hoofdstuk 2, paragrafen 1, 2 en 3, zijn van overeenkomstige toepassing op de verlening, wijziging of intrekking van
      vergunningen en documenten als bedoeld in dit hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel94
  - number: '98.1'
    text: |-
      Het is verboden geregeld vervoer of een bijzondere vorm van geregeld vervoer van en naar derde landen, landen die
      partij zijn bij de Interbus-overeenkomst of andere landen te verrichten zonder een daartoe strekkende vergunning.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel98
  - number: '98.2'
    text: |-
      Een vergunning als bedoeld in het eerste lid wordt aan de in Nederland gevestigde vervoerder slechts verleend
      indien hem een communautaire vergunning is verleend.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel98
  - number: '98.3'
    text: |-
      Tenzij met een land is overeengekomen dat geen vergunning is vereist, is het eerste lid eveneens van toepassing
      op vervoer dat voor niet-lucratieve en niet-commerciële doeleinden door een natuurlijke of rechtspersoon wordt
      verricht, en dat slechts een bijkomstige activiteit vormt.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel98
  - number: '99.1'
    text: |-
      Indien de vervoerder, aan wie een vergunning is verleend voor het verrichten van geregeld vervoer, het voornemen
      heeft de exploitatie te beëindigen voordat de vergunning haar geldigheid heeft verloren, stelt hij uiterlijk drie
      maanden vóór het tijdstip waarop hij zich voorstelt de exploitatie te beëindigen, Onze Minister schriftelijk in
      kennis van dit voornemen onder opgave van de redenen.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel99
  - number: '99.2'
    text: |-
      De vervoerder maakt zijn voornemen op zodanige wijze kenbaar, dat de betrokken reizigers en overige belanghebbenden
      ervan kunnen kennis nemen.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel99
  - number: '100'
    text: |-
      De vervoerder die geregeld vervoer of een bijzondere vorm van geregeld vervoer van en naar derde landen, landen
      die partij zijn bij de Interbus-overeenkomst of andere landen verricht, draagt er zorg voor dat in de bus waarmee
      dat vervoer wordt verricht de vergunning krachtens welke het vervoer wordt verricht of het door Onze Minister
      gewaarmerkt afschrift daarvan aanwezig is.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel100
  - number: '101.1'
    text: |-
      De in Nederland gevestigde vervoerder die geregeld vervoer of een bijzondere vorm van geregeld vervoer van en naar
      derde landen, landen die partij zijn bij de Interbus-overeenkomst of andere landen verricht, verstrekt aan Onze
      Minister binnen twee maanden na afloop van ieder kalenderjaar van elk in dat jaar per kwartaal verricht vervoer de
      gegevens in een vervoerverslag.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel101
  - number: '101.2'
    text: Onze Minister stelt het model vast voor het vervoerverslag.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel101
  - number: '102.1'
    text: |-
      Het is verboden pendelvervoer van en naar derde landen, landen die partij zijn bij de Interbus-overeenkomst en
      andere landen te verrichten zonder een daartoe strekkende vergunning, tenzij met een land is overeengekomen dat
      geen vergunning is vereist.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel102
  - number: '102.2'
    text: |-
      Een vergunning als bedoeld in het eerste lid wordt aan de in Nederland gevestigde vervoerder slechts verleend
      indien hem een communautaire vergunning is verleend.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel102
  - number: '103'
    text: |-
      De vervoerder die pendelvervoer van en naar derde landen, landen die partij zijn bij de Interbus-overeenkomst
      of andere landen verricht, draagt er zorg voor dat in de bus waarmee dat vervoer wordt verricht de vergunning
      krachtens welke het vervoer wordt verricht of het door Onze Minister gewaarmerkt afschrift daarvan aanwezig is.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel103
  - number: '104.1'
    text: |-
      Het is vervoerders die in Nederland, België of Luxemburg zijn gevestigd, verboden ongeregeld vervoer te verrichten
      in strijd met de Beneluxbeschikking.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel104
  - number: '104.2'
    text: |-
      Het is verboden met bussen die blijkens het kenteken zijn ingeschreven in derde landen, ongeregeld vervoer te
      verrichten in strijd met de ASOR.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel104
  - number: '104.3'
    text: |-
      Het is verboden met bussen die blijkens het kenteken zijn ingeschreven in landen die partij zijn bij de Interbus-
      overeenkomst ongeregeld vervoer te verrichten in strijd met de Interbus-overeenkomst.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel104
  - number: '105.1'
    text: |-
      Het is verboden ongeregeld vervoer als bedoeld in artikel 2, eerste lid, onderdeel c, van de ASOR, van en naar
      derde landen te verrichten zonder een daartoe strekkende vergunning, met uitzondering van het vervoer, bedoeld in
      artikel 5, tweede lid, van die overeenkomst.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel105
  - number: '105.2'
    text: |-
      Het is verboden ongeregeld vervoer als bedoeld in artikel 3, tweede lid, van de Interbus-overeenkomst te verrichten
      zonder een daartoe strekkende vergunning als bedoeld in artikel 15 van de Interbus-overeenkomst, met uitzondering
      van het vervoer bedoeld in artikel 6 van die overeenkomst.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel105
  - number: '106'
    text: |-
      Het is verboden met bussen die blijkens het kenteken zijn ingeschreven in een andere staat, ongeregeld vervoer te
      verrichten zonder een daartoe strekkende vergunning, tenzij met een staat is overeengekomen dat geen vergunning
      is vereist.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel106
  - number: '107'
    text: |-
      De in Nederland gevestigde vervoerder die ongeregeld vervoer als bedoeld in deze paragraaf verricht, is houder van
      een communautaire vergunning.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel107
  - number: '108'
    text: |-
      De vervoerder die ongeregeld vervoer verricht met bussen van en naar staten die partij zijn bij de Interbus-
      overeenkomst dan wel derde landen, draagt zorg dat in de bus waarmee het vervoer wordt verricht aanwezig is:
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel108
  - number: 108.a
    text: |-
      indien het betreft vervoer als bedoeld in artikel 5, eerste en tweede lid, van de ASOR van en naar derde landen en
      het wordt verricht door een in Nederland gevestigde vervoerder: het reisblad en het gewaarmerkt afschrift van de
      communautaire vergunning,
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel108
  - number: 108.b
    text: |-
      indien het betreft vervoer als bedoeld in artikel 5, derde lid, van de ASOR van en naar derde landen en het
      wordt verricht door een in Nederland gevestigde vervoerder: een gewaarmerkt afschrift van de vergunning en het
      gewaarmerkt afschrift van de communautaire vergunning,
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel108
  - number: 108.c
    text: |-
      indien het betreft vervoer als bedoeld in artikel 6 van de Interbus-overeenkomst van en naar landen die partij zijn
      bij die overeenkomst en het vervoer wordt verricht door een in Nederland gevestigde vervoerder: het reisblad en het
      gewaarmerkt afschrift van de communautaire vergunning,
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel108
  - number: 108.d
    text: |-
      indien het betreft vervoer als bedoeld in artikel 7 van de Interbus-overeenkomst van en naar landen die partij zijn
      bij die overeenkomst en het vervoer wordt verricht door een in Nederland gevestigde vervoerder: een gewaarmerkt
      afschrift van de vergunning en het gewaarmerkt afschrift van de communautaire vergunning.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel108
  - number: '109'
    text: |-
      De vervoerder die ongeregeld vervoer van en naar derde landen verricht, draagt er zorg voor dat in de bus waarmee
      dat vervoer wordt verricht, indien het vervoer betreft waarvoor op grond van [artikel 105][ref1] een vergunning is
      vereist, de vergunning krachtens welke het vervoer wordt verricht of het door Onze Minister gewaarmerkt afschrift
      daarvan aanwezig is.


      [ref1]: https://wetten.overheid.nl/BWBR0011982#Artikel105
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel109
    references:
      - id: ref1
        bwb_id: BWBR0011982
        artikel: '105'
        hoofdstuk: '8'
        paragraaf: '6'
  - number: '114'
    text: |-
      De vervoerder die vervoer voor eigen rekening van en naar derde landen, landen die partij zijn bij de Interbus-
      overeenkomst of andere landen verricht, draagt er zorg voor dat in de bus waarmee vervoer wordt verricht, de
      vergunning krachtens welke het vervoer wordt verricht of een door Onze Minister gewaarmerkt afschrift daarvan
      aanwezig is.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel114
  - number: '115.1'
    text: |-
      [Artikel 76 van de wet][ref1] is niet van toepassing op taxivervoer met een auto die blijkens het kenteken buiten
      Nederland is geregistreerd, mits het betreft:


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel76
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel115
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '76'
  - number: 115.1.a
    text: |-
      vervoer in gesloten rondritten, dat wil zeggen vervoer dat begint en eindigt in het land waar de auto is
      ingeschreven en dat wordt uitgevoerd met dezelfde auto waarbij over het gehele traject dezelfde reizigers worden
      vervoerd,
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel115
  - number: 115.1.b
    text: |-
      vervoer waarbij de heenreis met reizigers en de terugreis naar het land waar de auto is ingeschreven, zonder
      reizigers geschiedt,
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel115
  - number: 115.1.c
    text: |-
      vervoer waarbij de heenreis zonder reizigers geschiedt teneinde reizigers op te halen die worden vervoerd naar een
      bestemming buiten Nederland,
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel115
  - number: 115.1.d
    text: |-
      vervoer waarbij de heenreis met reizigers geschiedt en waarbij de terugreis met andere reizigers geschiedt en de
      bestemming buiten Nederland ligt.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel115
  - number: '115.2'
    text: |-
      [Artikel 76 van de wet][ref1] is evenmin van toepassing op taxivervoer met een auto die blijkens het kenteken is
      geregistreerd in België of Luxemburg, waarbij de heenreis zonder reizigers geschiedt teneinde reizigers op te nemen
      die de auto hadden besteld voordat de auto Nederland was binnengekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel76
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel115
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '76'
  - number: '115.3'
    text: |-
      De vervoerder, bedoeld in het eerste en tweede lid, beschikt over een vergunning voor het verrichten van
      taxivervoer van het land waar de auto is geregistreerd.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel115
  - number: '117'
    text: |-
      De vervoerder, bedoeld in [artikel 115][ref1], draagt er zorg voor dat in de auto aanwezig is:


      [ref1]: https://wetten.overheid.nl/BWBR0011982#Artikel115
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel117
    references:
      - id: ref1
        bwb_id: BWBR0011982
        artikel: '115'
        hoofdstuk: '8'
        paragraaf: '8'
  - number: 117.a
    text: |-
      een vergunning als bedoeld in [artikel 115][ref1] of een gewaarmerkt afschrift hiervan,


      [ref1]: https://wetten.overheid.nl/BWBR0011982#Artikel115
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel117
    references:
      - id: ref1
        bwb_id: BWBR0011982
        artikel: '115'
        hoofdstuk: '8'
        paragraaf: '8'
  - number: 117.b
    text: |-
      een volledig en naar waarheid voor de aanvang van de rit ingevuld, bij ministeriële regeling vastgesteld
      controledocument waarop tenminste is aangeven naam en adres van de vervoerder, naam van de bestuurder, datum,
      kenteken en zo nodig plaatsnummer van de auto, plaats en tijdstip van vertrek van de rit en plaats en tijdstip van
      instappen en uitstappen van reizigers.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel117
  - number: '118'
    text: |-
      Overtreding van elk van de voorschriften gesteld bij de [artikelen 76, derde lid][ref1],
      [77, eerste en tweede lid][ref2], [78, eerste lid][ref3] en [80 van de wet][ref4], en van de voorschriften gesteld
      bij of krachtens de [artikelen 14][ref5], [19][ref6], [20][ref7], [26][ref8], [72a tot en met 83][ref9], 83a en
      83b, [91][ref10], [98 tot en met 109][ref11] en [114 tot en met 117][ref12] van het besluit, vormt een strafbaar
      feit als bedoeld in [artikel 1, onder 4°, van de Wet op de economische delicten][ref13].


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel76
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel77
      [ref3]: https://wetten.overheid.nl/BWBR0011470#Artikel78
