preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Verkeer en Waterstaat, van 10 juli 2000, Centrale Directie Juridische Zaken,
    nr. CDJZ/WVW/2000-767;

    Gelet op de artikelen 2, 3, 8, 9, 14, 27, 28, 29, 30, 31, 32, 35, 44, 46, 49, 70, 74, 82, 83, 86, 99, 102 en 104
    van de Wet personenvervoer 2000, de Wegenverkeerswet 1994, artikel 5:12, tweede lid, van de Arbeidstijdenwet,
    artikel 22 van de Wet aansprakelijkheidsverzekering motorrijtuigen, artikel VI, tweede lid, van de wet van
    26 februari 1996 tot wijziging van de Wet op de rechterlijke organisatie en andere wetten in verband met de
    opheffing van de functie van verkeersschout (Stb. 155), artikel 12 van boek 5 van het Burgerlijk Wetboek,
    artikel 5, vierde lid, en 15, derde lid, van de Wet goederenvervoer over de weg, de artikelen 8 en 9 van de Wet
    Infrastructuurfonds, de artikelen 27 en 32 van de Spoorwegwet, artikel 74c van het Wetboek van Strafrecht, artikel
    16 van de Wet op de belasting van personenauto's en motorrijwielen 1992, artikel 72, eerste lid, van de Wet op de
    motorrijtuigenbelasting 1994, en de Vreemdelingenwet;

    De Raad van State gehoord (advies van 18 september 2000, no. WO9.00.0283/V);

    Gezien het nader rapport van Onze Minister van Verkeer en Waterstaat, van 7 december 2000, Centrale Directie
    Juridische Zaken, nr. CDJZ/WVW/2000-41452;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder: - boordcomputerkaart: geheugenkaart met
      chip voor gebruik in de boordcomputer waarmee de boordcomputer de identiteit van de kaarthouder kan vaststellen;
        - centrale database taxivervoer: technische voorziening voor het ontvangen van berichten met taxivervoergegevens;
        - chauffeurskaart: aan een bestuurder afgegeven boordcomputerkaart waarmee de boordcomputer de identiteit van de
      desbetreffende bestuurder kan vaststellen en waarop gegevens kunnen worden opgeslagen;
        - chauffeursnummer: nummer dat door Kiwa N.V. wordt uitgegeven aan een persoon die de bevoegdheid voor taxivervoer
      heeft ontvangen;
        - EER: Overeenkomst betreffende de Europese Economische Ruimte,
        - keuringskaart: aan een erkende werkplaats afgegeven boordcomputerkaart die de desbetreffende werkplaats
      identificeert en waarmee gegevens kunnen worden overgebracht;
        - lidstaat: lidstaat van de Europese Unie,
        - ondernemerskaart: aan een vervoerder afgegeven boordcomputerkaart die de desbetreffende vervoerder identificeert
      en waarmee de voor deze in de boordcomputer opgeslagen gegevens zichtbaar kunnen worden gemaakt en overgebracht
      kunnen worden;
        - passagiersschip: schip als bedoeld in de in [artikel 1 van het Binnenvaartbesluit][ref1] opgenomen definitie
      van passagiersschip,
        - realtime: direct, onmiddellijk of zonder enige vertragingsinterval;
        - registratiemiddel: middel dat voor een bestuurder beschikbaar is om taxivervoergegevens te registreren en
      versturen aan de centrale database taxivervoer;
        - richtlijn nr. 2004/18/EG: richtlijn nr. 2004/18/EG van het Europees Parlement en de Raad van de Europese Unie van
      31 maart 2004 betreffende de coördinatie van de procedures voor het plaatsen van overheidsopdrachten voor werken,
      leveringen en diensten (PbEU L 134),
        - veerboot: schip als bedoeld in de in [artikel 1 van het Binnenvaartbesluit][ref2] opgenomen definitie van
      veerboot,
        - Verordening (EG) 1370/2007: Verordening (EG) nr. 1370/2007 van het Europees Parlement en de Raad van 23 oktober
      2007 betreffende het openbaar personenvervoer per spoor en over de weg en tot intrekking van Verordening (EEG) nr
      1191/69 van de Raad en Verordening (EEG) nr. 1107/70 van de Raad (PbEU L 315),
        - wet: [Wet personenvervoer 2000][ref3].


