  - number: '119.1'
    text: |-
      [Artikel 6][ref1] is van toepassing op vervoer als bedoeld in artikel 5b van het Besluit personenvervoer, waarvan
      de overeenkomst op het moment van inwerkingtreding van dit besluit nog niet was beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0011982#Artikel6
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel119
    references:
      - id: ref1
        bwb_id: BWBR0011982
        artikel: '6'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: '119.2'
    text: |-
      [Artikel 7][ref1] is van toepassing op vervoer als bedoeld in artikel 5c van het Besluit personenvervoer, waarvan
      de overeenkomst op het moment van inwerkingtreding van dit besluit nog niet was beëindigd


      [ref1]: https://wetten.overheid.nl/BWBR0011982#Artikel7
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel119
    references:
      - id: ref1
        bwb_id: BWBR0011982
        artikel: '7'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: '120'
    text: |-
      In afwijking van [artikel 12][ref1] geldt voor een beslissing op een aanvraag om verlening van een vergunning voor
      het verrichten van taxivervoer een termijn van zes maanden, voorzover deze aanvraag is gedaan voor 1 januari 2001.


      [ref1]: https://wetten.overheid.nl/BWBR0011982#Artikel12
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel120
    references:
      - id: ref1
        bwb_id: BWBR0011982
        artikel: '12'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '121.1'
    text: |-
      Gedurende de periode dat vergunningen die krachtens de Wet personenvervoer zijn verleend, overeenkomstig
      [artikel 112][ref1] of [113 van de Wet personenvervoer 2000][ref2] geldig blijven, behouden ook de op deze
      vergunningen verstrekte vergunningbewijzen hun geldigheid, behoudens het bepaalde in [artikel 14][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel112
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel113
      [ref3]: https://wetten.overheid.nl/BWBR0011982#Artikel14
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel121
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '112'
      - id: ref2
        bwb_id: BWBR0011470
        artikel: '113'
      - id: ref3
        bwb_id: BWBR0011982
        artikel: '14'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '121.2'
    text: |-
      [Artikel 16][ref1] is niet van toepassing op vergunningen als bedoeld in het eerste lid, die zijn verleend voor het
      verrichten van openbaar vervoer.


      [ref1]: https://wetten.overheid.nl/BWBR0011982#Artikel16
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel121
    references:
      - id: ref1
        bwb_id: BWBR0011982
        artikel: '16'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '122'
    text: .
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel122
  - number: '124'
    text: |-
      Degene die in het bezit is van een verklaring die voor 1 oktober 1999 overeenkomstig artikel 10 van [richtlijn nr.
      96/26/EG](31996L0026) is afgegeven door Onze Minister of door een andere lidstaat dan Nederland, dan wel door een
      andere staat die partij is bij de EER, voldoet aan de eis van vakbekwaamheid.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel124
  - number: '125'
    text: |-
      Tot 1 juli 2001, wordt, in afwijking van [artikel 28][ref1], aan de eis van vakbekwaamheid voor het verrichten van
      taxivervoer voldaan indien:


      [ref1]: https://wetten.overheid.nl/BWBR0011982#Artikel28
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel125
    references:
      - id: ref1
        bwb_id: BWBR0011982
        artikel: '28'
        hoofdstuk: '2'
        paragraaf: '6'
  - number: 125.a
    text: |-
      een vervoerder die taxivervoer verricht bij de aanvraag van een vergunning voor het verrichten van taxivervoer
      ten genoegen van Onze Minister aantoont in de periode van 1 juli 1999 tot 1 december 1999 gemiddeld minimaal 30
      uur per week per auto taxivervoer te hebben verricht, waarbij is voldaan aan de eisen, gesteld bij of krachtens de
      artikelen 62 en 63 van de Wet personenvervoer en artikel 159 van het Besluit personenvervoer, zoals deze golden tot
      1 januari 2000 en
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel125
  - number: 125.b
    text: |-
      voor 1 juli 2001 aan [artikel 28, eerste lid][ref1], wordt voldaan, dan wel voor die datum, blijkens een door Onze
      Minister afgegeven verklaring wordt aangetoond dat een persoon als bedoeld in [artikel 26][ref2], de laatste 5 jaar
      belast is geweest met het dagelijks beheer van een onderneming met als hoofdactiviteit taxivervoer krachtens een
      geldige vergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0011982#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0011982#Artikel26
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel125
    references:
      - id: ref1
        bwb_id: BWBR0011982
        artikel: '28'
        hoofdstuk: '2'
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0011982
        artikel: '26'
        hoofdstuk: '2'
        paragraaf: '6'
  - number: '126'
    text: |-
      Degene aan wie op grond van artikel 29 van het Besluit personenvervoer, zoals dat luidde voor de inwerkingtreding
      van [artikel 29][ref1], een ontheffing is verleend van de eis van vakbekwaamheid, blijft vanaf de inwerkingtreding
      van dit besluit ontheven van de eis van vakbekwaamheid onder de voorwaarden waaronder en gedurende de periode
      waarvoor die ontheffing is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0011982#Artikel29
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel126
    references:
      - id: ref1
        bwb_id: BWBR0011982
        artikel: '29'
        hoofdstuk: '2'
        paragraaf: '6'
  - number: '128'
    text: |-
      Een geneeskundige verklaring die voor de inwerkingtreding van dit besluit op grond van artikel 157 van het Besluit
      personenvervoer is afgegeven en zijn geldigheid niet heeft verloren, wordt vanaf de inwerkingtreding van dit
      besluit gelijkgesteld met de verklaring, bedoeld in [artikel 74][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011982#Artikel74
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel128
    references:
      - id: ref1
        bwb_id: BWBR0011982
        artikel: '74'
        hoofdstuk: '6'
        paragraaf: '1'
  - number: '129'
    text: |-
      Een wijziging van [richtlijn nr. 96/26/EG](31996L0026) en [richtlijn nr. 92/50/EEG](31992L0050) gaat voor de
      toepassing van dit besluit gelden met ingang van de dag waarop aan de betrokken wijzigingsrichtlijn uitvoering
      moet zijn gegeven, tenzij bij ministerieel besluit, dat in de Staatscourant wordt bekendgemaakt, een ander tijdstip
      wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel129
  - number: '143'
    text: |-
      Na de inwerkingtreding van dit besluit berusten de hierna genoemde ministeriële regelingen op de daarbij vermelde
      artikelen van dit besluit:
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel143
  - number: 143.a
    text: |-
      de Regeling aanwijzing instanties afgifte legitimatiebewijs voor gehandicapten berust op
      [artikel 45, eerste lid, onderdeel b][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0011982#Artikel45
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel143
    references:
      - id: ref1
        bwb_id: BWBR0011982
        artikel: '45'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 143.b
    text: |-
      de Regeling rijksbijdrage openbaar vervoer berust op de [artikelen 54 tot en met 59][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0011982#Artikel54
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel143
    references:
      - id: ref1
        bwb_id: BWBR0011982
        artikel: '54'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: 143.c
    text: |-
      het besluit van de Minister van Verkeer en Waterstaat van 27 maart 2000, nr. CDJZ/WVW/2000-343 (Stcrt. 77) berust
      op [artikel 71][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0011982#Artikel71
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel143
    references:
      - id: ref1
        bwb_id: BWBR0011982
        artikel: '71'
        hoofdstuk: '5'
        paragraaf: '4'
  - number: 143.d
    text: |-
      de Regeling experiment meerjarenafspraken openbaar vervoer 2000 berust op [artikel 72][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011982#Artikel72
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel143
    references:
      - id: ref1
        bwb_id: BWBR0011982
        artikel: '72'
        hoofdstuk: '5'
        paragraaf: '5'
  - number: 143.e
    text: |-
      de Regeling maximumtarief en bekendmaking tarieven taxivervoer berust mede op [artikel 73][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0011982#Artikel73
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel143
    references:
      - id: ref1
        bwb_id: BWBR0011982
