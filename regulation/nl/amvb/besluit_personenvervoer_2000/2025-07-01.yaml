      militair vervoer met vervoermiddelen voorzien van een militair kenteken, op vervoer met door een militaire
      autoriteit gevorderde vervoermiddelen en op door een militaire autoriteit gevorderd vervoer,
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel2
  - number: 2.b
    text: |-
      vervoer met daarvoor bestemde vervoermiddelen, van ambtenaren van politie die zijn aangesteld voor de uitvoering
      van de politietaak, in de uitoefening van hun functie en van personen onder strafrechtelijke geleide van politie
      of justitie,
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel2
  - number: 2.c
    text: |-
      vervoer met daarvoor bestemde vervoermiddelen ten behoeve van de brandweerzorg en ten behoeve van door Onze
      Minister aan te wijzen diensten voor de ongevallen- en rampenbestrijding,
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel2
  - number: 2.d
    text: |-
      overig vervoer voor de uitoefening van de openbare dienst in de zin van [artikel 1 van de Ambtenarenwet][ref1] met
      daarvoor bestemde vervoermiddelen,


