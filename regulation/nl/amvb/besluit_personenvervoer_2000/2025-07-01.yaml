    text: |-
      Met het in het eerste lid genoemde personenvervoer wordt tevens bedoeld vervoer van personen die zich verplaatsen
      per motorrijtuig, bedoeld in [artikel 1, eerste lid, onderdeel c, van de Wegenverkeerswet 1994][ref1], met
      uitzondering van vrachtauto’s als bedoeld in [artikel 1.1 van de Wet wegvervoer goederen][ref2]. De bedoelde
      motorrijtuigen kunnen voorzien zijn van een aanhangwagen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0024800#Artikel1
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0024800
        artikel: '1'
  - number: 7a.3
    text: |-
      Onze Minister verleent concessies voor het personenvervoer, bedoeld in het eerste lid, voor de duur van ten hoogste
      15 jaar nadat daartoe een aanbesteding is gehouden. Artikel 5, derde lid, van Verordening (EG) 1370/2007 is daarbij
      van toepassing.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel7a
  - number: 7a.4
    text: |-
      Onze Minister kan in afwijking van het derde lid, de in dat lid genoemde concessie voor de eerste maal verlenen
      zonder dat daartoe een aanbesteding is gehouden, indien die concessie voldoet aan een van de kenmerken betreffende
      personenvervoer, anders dan per spoor, als bedoeld in artikel 5, vierde lid, van Verordening (EG) 1370/2007. Indien
      Onze Minister een concessie als bedoeld in de eerste volzin verleent, wordt het programma van eisen, bedoeld in
      [artikel 44 van de wet][ref1], voorafgaand aan de concessieverlening gepubliceerd.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel44
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '44'
  - number: 7a.5
    text: |-
      Voor de toepassing van de artikelen van de wet en het besluit op het vervoer, bedoeld in het eerste lid, wordt
      gelezen voor:
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel7a
  - number: 7a.5.a
    text: 'trein: het in het eerste lid bedoelde vervoer;'
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel7a
  - number: 7a.5.b
    text: 'station, stations, halteplaats of perron: de in het eerste lid bedoelde aanlegplaatsen;'
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel7a
  - number: 7a.5.c
    text: 'aanbesteding van een concessie of concessies: verlening van een concessie of concessies;'
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel7a
  - number: 7a.5.d
    text: 'aanbestedingsreglement: reglement;'
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel7a
  - number: 7a.5.e
    text: 'auto, bus, trein, metro, tram of via geleidesysteem voortbewogen voertuig: het in het eerste lid bedoelde vervoer;'
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel7a
  - number: 7a.5.f
    text: 'openbaar vervoer: het in het eerste lid bedoelde vervoer.'
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel7a
  - number: 7a.6
    text: |-
      De plicht te gedogen, bedoeld in [artikel 35 van de wet][ref1], geldt voor het in het eerste lid bedoelde vervoer
      ten aanzien van het gebruik door de concessiehouder van de haveninfrastructuur waaronder wordt verstaan:


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel35
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '35'
  - number: 7a.6.a
    text: haventerreinen;
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel7a
  - number: 7a.6.b
    text: aanleginrichtingen.
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel7a
  - number: '8.1'
    text: |-
      In afwijking van [artikel 2, aanhef en onderdeel l][ref1], zijn de [artikelen 73][ref2], [74][ref3],
      [87][ref4], [88, eerste lid][ref5], [89 tot en met 91][ref6], [93][ref7], [97][ref8], [98][ref9],[105][ref10] en
      [106 van de wet][ref11] en de [artikelen 52][ref12], [53][ref13], van dit besluit van overeenkomstige toepassing op
      door of vanwege de werkgever verzorgd vervoer van werknemers:


      [ref1]: https://wetten.overheid.nl/BWBR0011982#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel73
      [ref3]: https://wetten.overheid.nl/BWBR0011470#Artikel74
