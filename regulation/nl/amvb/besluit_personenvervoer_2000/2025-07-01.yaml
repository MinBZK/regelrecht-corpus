      terugbrengen van de deelnemers,
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel2
  - number: 2.g
    text: |-
      vervoer met vervoermiddelen die in gebruik zijn als onderdeel van een historische verzameling, voor zover het niet
      commercieel van aard is dan wel een geringe weerslag heeft op de vervoersmarkt,
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel2
  - number: 2.h
    text: |-
      vervoer met vervoermiddelen die deelnemen aan een optocht die in overeenstemming met een gemeentelijke verordening
      wordt gehouden,
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel2
  - number: 2.i
    text: |-
      vervoer met vervoermiddelen ten tijde dat zij worden gebruikt voor het geven van onderricht en het afnemen van
      proeven in praktische rijvaardigheid onder toezicht, mits zich niet meer dan vijf personen in het vervoermiddel
      bevinden,
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel2
  - number: 2.j
    text: vervoer binnen Nederland met takelwagens en getakelde vervoermiddelen,
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel2
  - number: 2.k
    text: |-
      vervoer met vervoermiddelen die worden verplaatst ten behoeve van stalling, onderhoud en reparatie dan wel bij
      wijze van een korte proefrit,
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel2
  - number: 2.l
    text: |-
      vervoer met auto's, voor eigen rekening en risico verricht door ondernemingen ten behoeve van hun werknemers,
      onderwijsinstellingen ten behoeve van hun leerlingen, kindercentra ten behoeve van kinderopvang als bedoeld
      in [artikel 1.1. van de Wet kinderopvang][ref1], tehuizen ten behoeve van hun vaste bewoners, alsmede
      verpleeginrichtingen, psychiatrische instellingen, medische verzorgingstehuizen, medische dagverblijven of
      soortgelijke instellingen ten behoeve van hun patiënten,


