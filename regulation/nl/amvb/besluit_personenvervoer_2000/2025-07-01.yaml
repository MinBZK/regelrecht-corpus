      [ref11]: https://wetten.overheid.nl/BWBR0011470#Artikel106
      [ref12]: https://wetten.overheid.nl/BWBR0011982#Artikel52
      [ref13]: https://wetten.overheid.nl/BWBR0011982#Artikel53
    url: https://wetten.overheid.nl/BWBR0011982/2025-07-01#Artikel8
