  - number: '23'
    text: |-
      1 Voor het verstrekken door gedeputeerde staten van de betrokken provincies van gegevens aan Onze Ministers,
      bedoeld in [artikel 44, derde lid, van de wet][ref1], bepalen Onze Ministers bij ministeriële regeling:

      a. welke gegevens worden verstrekt;

      b. de wijze waarop de gegevens worden verstrekt;

      c. de tijdvakken waarop de gegevens die worden verstrekt betrekking hebben;

      d. de termijnen waarbinnen de gegevens worden verstrekt.

      2 Bij de regeling, bedoeld in het eerste lid, kan worden verwezen naar een door Onze Ministers goed te keuren
      informatieprotocol.


