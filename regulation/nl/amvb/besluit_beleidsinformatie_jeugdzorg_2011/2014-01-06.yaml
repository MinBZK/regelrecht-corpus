        artikel: 77hh
  - number: '19'
    text: |-
      1 De aanvaarde rechtspersoon registreert ten behoeve van de verstrekking van gegevens aan Onze Minister
      van Veiligheid en Justitie, bedoeld in [artikel 44, tweede lid, van de wet][ref1], per minderjarige de
      volgende gegevens die verband houden met de taken en bevoegdheden van de aanvaarde rechtspersoon op grond van
      [Boek 1 van het Burgerlijk Wetboek][ref2]:

      a. de datum van aanmelding;

      b. de geboortedatum;

      c. het geslacht;

      d. het geboorteland of de geboortestreek, alsmede het geboorteland of de geboortestreek van zijn ouders;

      e. de dagbesteding;

      f. de leefsituatie;

      g. de gemeente waar de jeugdige volgens de basisregistratie personen zijn adres heeft;

      h. de soort verblijfsvergunning.

      2 Onverminderd het eerste lid registreert de aanvaarde rechtspersoon per minderjarige bij de taken, bedoeld in
      [artikel 10 eerste lid, onder a of b, van de wet][ref3], de volgende gegevens:

      a. de datum waarop een taak als bedoeld in [artikel 10, eerste lid, onder a, van de wet][ref4] aanvangt en eindigt,
      met een aanduiding van de soort voogdij en de reden van beëindiging;

      b. de datum waarop de taak, bedoeld in [artikel 10, eerste lid, onder b, van de wet][ref5] aanvangt of wordt
      verlengd;

      c. de datum waarop een taak als bedoeld in [artikel 10, eerste lid, onder b, van de wet][ref6] eindigt, met een
      aanduiding van de reden daarvan;

      d. de datum waarop de rechter een machtiging tot uithuisplaatsing heeft gegeven en de duur van de machtiging;

      e. de datum waarop de aanvaarde rechtspersoon aan de minderjarige, zijn ouders of degene die
      hem als behorende tot hun gezin verzorgen en opvoeden meedeelt dat een taak als bedoeld in
      [artikel 10, eerste lid, onder a of b, van de wet][ref7], is aangevangen;

      f. de datum waarop een medewerker van de aanvaarde rechtspersoon over een taak als bedoeld in
      [artikel 10, eerste lid, onder a of b, van de wet][ref8], een eerste contact heeft met de cliënt;

      g. de datum waarop de aanvaarde rechtspersoon het plan, bedoeld in [artikel 13, derde lid, van de wet][ref9]
      vaststelt.


