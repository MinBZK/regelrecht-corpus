  - number: '15'
    text: |-
      Voor de verwerking van de gegevens, bedoeld in [artikel 42 van de wet][ref1], registreert de stichting per jeugdige
      over de taak, bedoeld in [artikel 10, eerste lid, onder e, van de wet][ref2]:

      a. het type eerste contact;

      b. de hoedanigheid van de melder;

      c. de datum van de melding van kindermishandeling of een vermoeden daarvan;

      d. de datum waarop het onderzoek, bedoeld in [artikel 11, eerste lid, onder a, van de wet][ref3] aanvangt en
      eindigt;

      e. of het onderzoek heeft geleid tot de vaststelling van kindermishandeling;

      f. het vervolg voor de jeugdige naar aanleiding van het onderzoek.


