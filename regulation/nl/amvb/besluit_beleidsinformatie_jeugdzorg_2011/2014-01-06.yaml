  - number: '6'
    text: |-
      Voor de verwerking van de gegevens, bedoeld in [artikel 42 van de wet][ref1], registreert de stichting van elk
      cliënttraject:

      a. de datum waarop de stichting aanvangt met het cliënttraject;

      b. of het cliënttraject is gestart in het vrijwillig kader dan wel met de uitvoering van een maatregel
      jeugdreclassering of een maatregel jeugdbescherming;

      c. of sprake is van spoedeisende zorg;

      d. de datum waarop de stichting het cliënttraject beëindigt.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel42
    url: https://wetten.overheid.nl/BWBR0030591/2014-01-06#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '42'
  - number: '7'
    text: |-
      Voor de verwerking van de gegevens, bedoeld in [artikel 42 van de wet][ref1], registreert de stichting bij de
      aanvang van een cliënttraject in het vrijwillig kader, of sprake is van een aanmelding:

      a. via een beroepsmatige verwijzer;

      b. op eigen initiatief van een cliënt;

      c. op basis van signalen van een derde.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel42
    url: https://wetten.overheid.nl/BWBR0030591/2014-01-06#Artikel7
