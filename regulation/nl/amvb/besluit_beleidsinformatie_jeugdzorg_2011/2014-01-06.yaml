    text: |-
      1 De in de [artikelen 2 tot en met 15][ref1] bedoelde gegevens worden zodanig geregistreerd dat het mogelijk is
      kruiselingse verbanden te leggen tussen de gegevens die op grond van dit besluit geregistreerd moeten worden.

      2 De gegevens worden ook overigens op zodanige wijze geregistreerd dat zij op eenvoudige wijze in kwantitatieve en
      kwalitatieve zin zijn te verwerken tot beleidsinformatie voor het beleid, bedoeld in [artikel 42 van de wet][ref2].


