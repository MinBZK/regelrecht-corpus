  - number: '21'
    text: |-
      1 Voor het verstrekken door de stichting van gegevens, als bedoeld in [artikel 44, eerste lid van de wet][ref1],
      en door de zorgaanbieders ten behoeve van het verstrekken van de gegevens als bedoeld in [artikel 20][ref2]
      en artikel 44, tweede lid, van de wet, bepalen Onze Ministers met het oog op de registratie, bedoeld in de
      [artikelen 2 tot en met 15][ref3], bij ministeriële regeling:

      a. de wijze waarop de gegevens worden geregistreerd;

      b. welke gegevens worden verstrekt en de wijze waarop deze worden verstrekt;

      c. de tijdvakken waarop de gegevens die worden verstrekt betrekking hebben;

      d. de termijnen waarbinnen de gegevens worden verstrekt.

      2 Bij de regeling, bedoeld in het eerste lid, kan worden verwezen naar een door Onze Ministers goed te keuren
      informatieprotocol.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0016637#Artikel20
      [ref3]: https://wetten.overheid.nl/BWBR0030591#Artikel2
