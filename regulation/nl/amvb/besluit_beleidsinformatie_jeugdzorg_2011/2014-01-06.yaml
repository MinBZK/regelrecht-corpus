  - number: '5'
    text: |-
      1 Voor de verwerking van de gegevens, bedoeld in [artikel 42 van de wet][ref1], registreert de stichting van elke
      aanmelding in het vrijwillig kader de datum van aanmelding en of de aanmelding leidt tot een vervolg.

      2 Indien de aanmelding in het vrijwillig kader leidt tot een vervolg, registreert de stichting of sprake is van:

      a. een vervolg binnen de stichting;

      b. een verwijzing naar een voorliggende voorziening, of

      c. het verstrekken van informatie en advies.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel42
    url: https://wetten.overheid.nl/BWBR0030591/2014-01-06#Artikel5
