  - number: '17'
    text: |-
      De raad voor de kinderbescherming registreert ten behoeve van de verstrekking van gegevens aan Onze
      Minister van Veiligheid en Justitie en gedeputeerde staten van de betrokken provincies, bedoeld in
      [artikel 44, tweede lid, van de wet][ref1], per minderjarige de volgende gegevens die verband houden met de taken
      en bevoegdheden van de raad, bedoeld in de [titels 13][ref2] en [14 van Boek 1 van het Burgerlijk Wetboek][ref3]:

      a. de datum van meldingen bij de raad op grond waarvan een maatregel met betrekking tot het gezag over een
      minderjarige overwogen dient te worden met een aanduiding van de instantie of de hoedanigheid van de melder en het
      vervolg dat aan de melding wordt gegeven;

      b. de datum en aard van een verzoek van de raad waarin de rechter wordt verzocht een maatregel met betrekking tot
      het gezag te nemen;

      c. de datum van aanvang en einde van het onderzoek van de raad om te bepalen of een maatregel met betrekking tot
      het gezag overwogen dient te worden;

      d. de datum waarop de raad, na onderzoek om te bepalen of een maatregel met betrekking tot het gezag als bedoeld
      onder a overwogen dient te worden, tot de conclusie komt dat verdere bemoeienis van de raad niet meer noodzakelijk
      is en de raad de cliënt adviseert zich elders voor hulp te vervoegen.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0002656
