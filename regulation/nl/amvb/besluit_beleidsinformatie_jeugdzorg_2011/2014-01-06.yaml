      Voor de verwerking van de gegevens, bedoeld in [artikel 42 van de wet][ref1], registreert de stichting per jeugdige
      over de taak, bedoeld in [artikel 9 van de wet][ref2], de datum waarop zij de kindbedreigende situatie vaststelt.


