  - number: '3'
    text: |-
      Voor de verwerking van de gegevens, bedoeld in [artikel 42 van de wet][ref1], registreert de
      stichting bij zowel de aanvang van een cliënttraject als de aanvang van een onderzoek als bedoeld in
      [artikel 11, eerste lid, onder a, van de wet][ref2], per jeugdige de volgende gegevens:

      a. de geboortedatum;

      b. het geslacht;

      c. het geboorteland of de geboortestreek, alsmede het geboorteland of de geboortestreek van de ouders.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0016637#Artikel11
