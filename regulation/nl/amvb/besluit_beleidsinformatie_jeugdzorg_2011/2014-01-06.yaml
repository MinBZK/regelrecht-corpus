  - number: '8'
    text: |-
      Voor de verwerking van de gegevens, bedoeld in [artikel 42 van de wet][ref1], registreert de stichting per cliënt
      over de taak, bedoeld in [artikel 5, tweede lid, van de wet][ref2]:

      a. de datum van vestiging van de aanspraak;

      b. het type aanspraak.


