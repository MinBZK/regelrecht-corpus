  - number: '18'
    text: |-
      De raad voor de kinderbescherming registreert ten behoeve van de verstrekking van gegevens aan Onze
      Minister van Veiligheid en Justitie en gedeputeerde staten van de betrokken provincies, bedoeld in
      [artikel 44, tweede lid, van de wet][ref1], per jeugdige gegevens over de datum waarop hij de stichting inschakelt
      voor vrijwillige begeleiding als bedoeld in [artikel 77hh, tweede lid, van het Wetboek van Strafrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel77hh
