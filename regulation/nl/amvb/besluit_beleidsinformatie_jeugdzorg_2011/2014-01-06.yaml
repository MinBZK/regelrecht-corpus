articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

        - *aanmelding in het vrijwillig kader:* het eerste contact van de stichting met een persoon in het kader van de
      uitvoering van haar taak als bedoeld in [artikel 5, eerste lid, van de wet][ref1];
        - *aanmelding jeugdreclassering:* aanmelding door de raad voor de kinderbescherming of door de officier van
      justitie van een jeugdige bij jeugdreclassering;
        - *aanspraak:* het recht van een cliënt op de zorg zoals dat ontstaan is door het vaststellen van het
      indicatiebesluit of een daaraan gelijkgesteld document, óf door een besluit in een crisissituatie;
        - *aanvaarde rechtspersoon:* de rechtspersoon bedoeld in [artikel 254, tweede lid][ref2], of
      [artikel 302, tweede lid, van Boek 1 van het Burgerlijk Wetboek][ref3];
        - *advies- en meldpunt kindermishandeling:* een advies- en meldpunt kindermishandeling als bedoeld in
      [artikel 10, eerste lid, onder e, van de wet][ref4];
        - *Casusoverleg Bescherming:* overleg tussen de stichting en de raad voor de kinderbescherming over een door de
      stichting of de raad ingebrachte melding, waarin wordt besloten of de raad naar aanleiding van de ingebrachte
      melding een onderzoek start en wordt besproken op welke wijze de veiligheid van de jeugdige kan worden gewaarborgd
      tot het einde van de keten;
        - *cliënttraject:* het traject waarin een cliënt te maken heeft met jeugdzorg, gedwongen
      of vrijwillig, waarbij het traject start op het moment dat de stichting start met de
      uitvoering van één van haar taken zoals opgenomen in [artikel 5, eerste lid][ref5],
      [artikel 10, eerste lid, onderdeel a tot en met d en onderdeel f tot en met j en derde lid, van de wet][ref6]
      en het cliënttraject eindigt als alle taken van de stichting of verlening van jeugdzorg waarop ingevolge de wet
      aanspraak bestaat, zijn afgerond;
        - *de wet:* de [Wet op de jeugdzorg][ref7];
        - *gesloten jeugdzorg:* onderdeel van een cliënttraject, waarbij de jeugdige met een machtiging voor gesloten
      jeugdzorg in de zin van [artikel 29b van de wet][ref8] in een accommodatie als bedoeld in artikel 29k van de wet
      verblijft en gedurende dat verblijf jeugdzorg ontvangt;
        - *indicatiebesluit:* een besluit waarbij wordt vastgesteld of een cliënt is aangewezen op zorg als bedoeld in
      [artikel 5, tweede lid, van de wet][ref9];
        - *jeugdreclassering:* de stichting bij de uitvoering van de taken, bedoeld in
      [artikel 10, eerste lid, onder c en d, van de wet][ref10];
        - *leefsituatie:* de situatie waarin de jeugdige duurzaam verblijft overeenkomstig de categorie adoptief gezin,
      één-oudergezin, meer-oudergezin, pleeggezin, residentieel, zelfstandig, zwervend, anders, dan wel onbekend;
        - *persoonsgegeven:* persoonsgegeven zoals bedoeld in
      [artikel 1, onder a, van de Wet bescherming persoonsgegevens][ref11];
        - *traject jeugdbescherming:* onderdeel van een cliënttraject, waarbij een of meer aaneensluitende maatregelen
      betreffende beperking dan wel beëindiging van het ouderlijk gezag zijn opgelegd;
        - *traject jeugdreclassering:* onderdeel van een cliënttraject, waarbij door de jeugdreclassering een of meer
      aaneensluitende maatregelen worden uitgevoerd;
        - *verblijfsituatie:* de situatie waarin de jeugdige verblijft overeenkomstig de categorie gesloten jeugdzorg,
      pleeggezin, residentieel, thuis, verblijf GGZ, dan wel overigen;
        - *zorgtraject:* onderdeel van een cliënttraject, waarbij een zorgaanbieder als bedoeld in
      [artikel 18 van de wet][ref12] jeugdzorg aanbiedt waarop ingevolge de wet aanspraak bestaat, uitgezonderd gesloten
      jeugdzorg;
        - *zorgvorm:* de vorm van jeugdzorg die de cliënt ontvangt overeenkomstig de categorie jeugdhulp, verblijf
      accommodatie exclusief gesloten jeugdzorg, verblijf accommodatie deeltijd, verblijf gesloten, dan wel verblijf
      pleegzorg.


