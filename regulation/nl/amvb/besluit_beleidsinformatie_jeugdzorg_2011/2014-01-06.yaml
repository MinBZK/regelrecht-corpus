    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Volksgezondheid, Welzijn en Sport, mede namens de Staatssecretaris van
    Veiligheid en Justitie, van 8 juni 2011, kenmerk DWJZ-3066997;

    Gelet op artikel 43 en 44, tweede en zesde lid, van de Wet op de jeugdzorg;

    De Afdeling advisering van de Raad van State gehoord (advies van 20 juli 2011), no. W13.11.0233/III;

    Gezien het nader rapport van de Staatssecretaris van Volksgezondheid, Welzijn en Sport van 31 augustus 2011,
    kenmerk DWJZ-3075074, uitgebracht mede namens de Staatssecretaris van Veiligheid en Justitie;

    Hebben goedgevonden en verstaan:
