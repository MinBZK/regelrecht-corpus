  - number: '22'
    text: |-
      1 De [artikelen 20][ref1] en [21][ref2] zijn van overeenkomstige toepassing op de raad voor de kinderbescherming
      en de aanvaarde rechtspersoon voor het verstrekken van gegevens als bedoeld in [artikel 44, tweede lid][ref3], met
      dien verstande dat de raad en de aanvaarde rechtspersoon geen gegevens verstrekken aan zorgverzekeraars.

      2 [Artikel 16][ref4] is van overeenkomstige toepassing op de aanvaarde rechtspersoon.

      3 De raad voor de kinderbescherming en de aanvaarde rechtspersoon verstrekken op verzoek van Onze Minister
      van Veiligheid en Justitie of gedeputeerde staten van de betrokken provincie gegevens met het oog op de
      registratie, bedoeld in de [artikelen 17][ref5] en [18][ref6], ten behoeve van de verwerking, bedoeld in
      [artikel 42, van de wet][ref7].


