    text: |-
      Voor de verwerking van de gegevens, bedoeld in [artikel 42 van de wet][ref1], registreert de stichting in geval van
      verwijzing naar een voorliggende voorziening de opgegeven woonplaats van de jeugdige.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel42
