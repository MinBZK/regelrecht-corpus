  - number: '10'
    text: |-
      1 Voor de verwerking van de gegevens, bedoeld in [artikel 42 van de wet][ref1], registreert de stichting per cliënt
      over de verlening van ambulante jeugdzorg als bedoeld in [artikel 10, derde lid, onder b, van de wet][ref2]:

      a. de aanvangsdatum van het verlenen van de zorg;

      b. de einddatum van het verlenen van de zorg.

      2 Voor de verwerking van de gegevens, bedoeld in [artikel 42 van de wet][ref3], registreert de stichting per cliënt
      over het door zorgaanbieders verlenen van ambulante jeugdzorg zonder indicatiebesluit de aanvangsdatum van het
      verlenen van de zorg.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel42
