  - number: '20'
    text: |-
      1 De stichting verwerkt ten behoeve van de verstrekking van de gegevens, bedoeld in
      [artikel 44, eerste lid van de wet][ref1], de krachtens dit besluit te registreren persoonsgegevens tot niet tot de
      persoon herleidbare gegevens.

      2 De stichting verstrekt geen persoonsgegevens ten behoeve van de verwerking van gegevens, bedoeld in
      [artikel 42 van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0016637#Artikel42
