  - number: '4'
    text: |-
      Voor de verwerking van de gegevens, bedoeld in [artikel 42 van de wet][ref1], registreert de stichting:

      a. bij aanvang van een cliënttraject, een onderzoek als bedoeld in
      [artikel 11, eerste lid, onder a van de wet][ref2], de uitvoering van één van de taken bedoeld in
      [artikel 10, eerste lid, onder a tot en met d van de wet][ref3] en bij de vestiging van de eerste aanspraak: zowel
      de leefsituatie van de jeugdige als de gemeente waar de jeugdige volgens de basisregistratie personen zijn adres
      heeft;

      b. bij aanvang van gesloten jeugdzorg: de leefsituatie van de jeugdige;

      c. bij aanvang van een zorgtraject: de gemeente waar de jeugdige volgens de basisregistratie personen zijn adres
      heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0016637#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0016637#Artikel10
