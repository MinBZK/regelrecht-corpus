  - number: '9'
    text: |-
      Voor de verwerking van de gegevens, bedoeld in [artikel 42 van de wet][ref1], dragen de stichting en de raad
      voor de kinderbescherming ten aanzien van elke door hen in het overleg ingebrachte casus die in het Casusoverleg
      Bescherming wordt besproken, zorg voor registratie van het gegeven:

      a. of de casus is ingebracht door de stichting of de raad voor de kinderbescherming;

      b. de datum van de eerste bespreking in het Casusoverleg Bescherming;

      c. of het Casusoverleg Bescherming besluit de behandeling voort te zetten en zo ja, of behandeling geschiedt door
      de stichting of de raad voor de kinderbescherming


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel42
