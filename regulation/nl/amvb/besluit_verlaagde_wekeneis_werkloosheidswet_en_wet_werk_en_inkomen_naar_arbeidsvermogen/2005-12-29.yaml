  - number: '2'
    text: |-
      1 Het aantal weken, bedoeld in [artikel 17, onderdeel ][ref1] en
      [artikel 58, eerste lid, onderdeel a, van de Wet werk en inkomen naar arbeidsvermogen][ref2], waarin ten minste als
      werknemer arbeid moet zijn verricht, wordt ten aanzien van een werknemer als bedoeld in het tweede, derde of vierde
      lid, die in de periode van 39 weken onmiddellijk voorafgaande aan het intreden van zijn werkloosheid grotendeels
      arbeid in dienstbetrekking heeft verricht als omschreven in die leden, voor zover die arbeid naar zijn aard slechts
      beschikbaar is gedurende een of meer jaarlijks terugkerende perioden, gesteld op het bij die arbeid omschreven
      aantal.

      2 Het aantal weken wordt gesteld op 13 ten aanzien van een werknemer die arbeid heeft verricht in de
      beetwortelindustrie.

      3 Het aantal weken wordt gesteld op 16 ten aanzien van een werknemer die:

      a. agrarische arbeid in het algemeen heeft verricht;

      b. arbeid heeft verricht in de aardappelmeelindustrie;

      c. arbeid heeft verricht bij transportbedrijven ten behoeve van vervoer van aardappels en suikerbieten;

      d. arbeid heeft verricht in de groente- en fruitverwerkende industrie;

      e. arbeid heeft verricht in de visconservenindustrie, of

      f. arbeid heeft verricht als kermismusicus.

      4 Het aantal weken wordt gesteld op 20 ten aanzien van een werknemer die:

      a. arbeid heeft verricht in de hotel-, restaurant-, café-, pension- en aanverwante bedrijven;

      b. arbeid heeft verricht in bakkersbedrijven, mits de aard van die arbeid overeenkomt met de in onderdeel *a.*
      genoemde arbeid;

      c. arbeid heeft verricht als aardappelkarteerder en controleur;

      d. arbeid heeft verricht bij reisbureaus, toerwagenondernemingen, verenigingen voor vreemdelingenverkeer,
      jeugdherbergen, vakantieverblijven, kampeercentra, strandexploitanten, speeltuinen, speelterreinen, instellingen en
      inrichtingen voor lichamelijke opvoeding en sportbeoefening, bad- en zweminrichtingen, tentoonstellingen of musea;

      e. arbeid heeft verricht in bedrijven die rondvaarten en toerwagenreizen organiseren;

      f. arbeid heeft verricht als expeditie- of pakhuispersoneel, in dienst van groothandelaren of commissionairs in
      land- en tuinbouwproducten;

      g. sorteer- en dergelijke arbeid heeft verricht bij tuinbouwveilingen, tuinbouwverenigingen en bij de detailhandel
      in bloembollen;

      h. arbeid heeft verricht in het winkelbedrijf;

      i. arbeid heeft verricht in het veenbedrijf;

      j. arbeid heeft verricht in het bontbedrijf, de bontverwerkende en garnerende bedrijven;

      k. arbeid heeft verricht in de spoelderij en pakkerij van het witlofbedrijf; of

      l. arbeid heeft verricht in luchtvaartbedrijven.

      5 Indien een werknemer in de periode van 39 weken, bedoeld in het eerste lid, arbeid als genoemd in het tweede,
      derde of vierde lid, heeft verricht die onder meer leden of onderdelen is gerangschikt, wordt het aantal weken
      gesteld op het aantal weken behorende bij de arbeid die in het grootste aantal weken is verricht.

      6 Indien een werknemer in de periode van 39 weken, bedoeld in het eerste lid, in een gelijk aantal weken arbeid
      als genoemd in het tweede, derde of vierde lid, heeft verricht die onder meer leden of onderdelen is gerangschikt,
      wordt het aantal weken gesteld op het aantal behorende bij de arbeid waarbij het kleinste aantal weken staat
      vermeld.


