articles:
  - number: '1'
    text: |-
      1 Het aantal weken, bedoeld in [artikel 17, onderdeel ][ref1] en
      [artikel 58, eerste lid, onderdeel a, van de Wet werk en inkomen naar arbeidsvermogen][ref2], waarin ten minste als
      werknemer arbeid moet zijn verricht wordt gesteld op 16 ten aanzien van de werknemer die in de periode van 39 weken
      onmiddellijk voorafgaande aan het intreden van zijn werkloosheid in een onregelmatig arbeidspatroon uitsluitend of
      vrijwel uitsluitend als musicus of anderszins als artiest, dan wel als filmmedewerker arbeid in dienstbetrekking
      heeft verricht.

      2 Het eerste lid is van overeenkomstige toepassing op de werknemer die de in het eerste lid bedoelde artiest of
      musicus in hetzelfde of nagenoeg hetzelfde arbeidspatroon in zijn optreden technisch heeft ondersteund.


