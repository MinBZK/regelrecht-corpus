  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Op de voordracht van Onze Minister van Verkeer en Waterstaat van 13 december 2004, nr. HDJZ/SCH/2004-2993,
    Hoofddirectie Juridische Zaken;


    Gelet op richtlijn nr. 2002/59/EG van het Europees Parlement en de Raad van de Europese Unie van 27 juni 2002
    betreffende de invoering van een communautair monitoring- en informatiesysteem voor de zeescheepvaart en tot
    intrekking van Richtlijn 93/75/EEG van de Raad (PbEG L 208), en op artikel 4, eerste lid, onderdeel e, en vierde
    lid, van de Scheepvaartverkeerswet;


    De Raad van State gehoord (advies van 23 december 2004, nr. W09.04.0604/V);


    Gezien het nader rapport van Onze Minister van Verkeer en Waterstaat van 24 december 2004, nr. HDJZ/SCH/2004-3139,
    Hoofddirectie Juridische Zaken;


    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0017874/2005-01-12#ArtikelAanhef
articles:
  - number: '1'
    text: >-
      In dit besluit wordt verstaan onder:


      richtlijn: [richtlijn nr. 2002/59/EG](32002L0059) van het Europees Parlement en de Raad van de Europese Unie van 27
      juni 2002 betreffende de invoering van een communautair monitoring- en informatiesysteem voor de zeescheepvaart en
      tot intrekking van [richtlijn 93/75/EEG](31993L0075) van de Raad (PbEG L 208).
    url: https://wetten.overheid.nl/BWBR0017874/2005-01-12#Artikel1
  - number: '2'
    text: |-
      1 Indien aan een autoriteit op grond van een krachtens [artikel 4 van de Scheepvaartverkeerswet][ref1] vastgestelde
      algemene maatregel van bestuur, gegevens meegedeeld worden als bedoeld in de artikelen 4 en 13 van de richtlijn,
      meldt zij dit onverwijld aan de zich bij de *European Maritime Safety Agency* bevindende indexserver. Bij de
      melding worden de bij ministeriële regeling aangeduide gegevens verstrekt, op een bij die regeling aangegeven
      wijze.

      2 De in het eerste lid bedoelde autoriteit verstrekt de gegevens die door middel van een in het eerste lid bedoelde
      melding zijn verkregen, op een bij ministeriële regeling aangegeven wijze aan een bevoegde instantie als bedoeld
      in artikel 3, onderdeel k, van de richtlijn, van een andere lidstaat van de Europese Unie, indien deze daarom
      verzoekt.

      3 De in het eerste lid bedoelde autoriteit bewaart de door middel van een in het eerste lid bedoelde melding
      verkregen gegevens gedurende een termijn van minstens dertig dagen.


      [ref1]: https://wetten.overheid.nl/BWBR0004364#Artikel4
    url: https://wetten.overheid.nl/BWBR0017874/2005-01-12#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0004364
        artikel: '4'
  - number: '3'
    text: >-
      1 Het Nederlands Kustwachtcentrum deelt bij hem bekende relevante informatie met betrekking tot in artikel 16,
      eerste lid, van de richtlijn bedoelde schepen onverwijld, op een bij ministeriële regeling aangegeven wijze, mede
      aan de betrokken kuststations, bedoeld in artikel 3, onderdeel n, van de richtlijn, van de overige lidstaten van de
      Europese Unie langs de door het zeeschip te volgen route.


      2 Het Nederlands Kustwachtcentrum verstrekt de in artikel 17 van de richtlijn bedoelde informatie, op een bij
      ministeriële regeling aangegeven wijze aan een bevoegde instantie als bedoeld in artikel 3, onderdeel k, van de
      richtlijn, van een andere lidstaat van de Europese Unie, die daar uit veiligheidsoverwegingen om verzoekt.
    url: https://wetten.overheid.nl/BWBR0017874/2005-01-12#Artikel3
  - number: '4'
    text: >-
      Het Nederlands Kustwachtcentrum maakt door middel van een radiobericht in het betrokken zeegebied openbaar:


      a. een aan hem gemeld ongeval of incident op zee, als bedoeld in artikel 17, eerste lid, van de richtlijn, met
      een zeeschip;


      b. een aan hem bekende aanwezigheid van zeeschepen die een bedreiging vormen voor de veiligheid op zee, de
      veiligheid van personen of het mariene milieu.
    url: https://wetten.overheid.nl/BWBR0017874/2005-01-12#Artikel4
  - number: '5'
    text: >-
      1 De exploitant van een zeeschip die door de kapitein van dat schip op de hoogte is gesteld van een incident of
      ongeval met dat schip op zee, als bedoeld in artikel 17, eerste lid, van de richtlijn, neemt onmiddellijk contact
      op met het Nederlands Kustwachtcentrum en houdt zich voorzover nodig ter beschikking van dit centrum.


      2 Overtreding van het eerste lid is een strafbaar feit.
    url: https://wetten.overheid.nl/BWBR0017874/2005-01-12#Artikel5
  - number: '6'
    text: |-
      De [artikelen 1 tot en met 5][ref1] zijn niet van toepassing met betrekking tot gegevens verkregen van:

      a. een oorlogsschip, een ander marineschip, of een ander schip in eigendom of in dienst van de overheid, dat voor
      niet-commerciële doeleinden wordt gebruikt;

      b. een historisch schip of een replica daarvan, met inbegrip van een schip dat ontworpen is om traditionele
      vaardigheden en zeemanschap aan te moedigen en te bevorderen, dat als levend cultuurmonument volgens de
      traditionele beginselen van zeemanschap en techniek wordt bestuurd;

      c. een vissersschip;

      d. een pleziervaartuig met een lengte van minder dan 45 meter.


      [ref1]: https://wetten.overheid.nl/BWBR0017874#Artikel1
    url: https://wetten.overheid.nl/BWBR0017874/2005-01-12#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0017874
        artikel: '1'
  - number: '7'
    text: >-
      Een wijziging van de richtlijn gaat voor de toepassing van dit besluit gelden met ingang van de dag waarop
      aan de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven, tenzij bij ministerieel besluit, dat in de
      Staatscourant wordt bekendgemaakt, een ander tijdstip wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0017874/2005-01-12#Artikel7
  - number: '8'
    text: Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0017874/2005-01-12#Artikel8
  - number: '9'
    text: 'Dit besluit wordt aangehaald als: Besluit gegevens scheepvaart.'
    url: https://wetten.overheid.nl/BWBR0017874/2005-01-12#Artikel9
