  - number: '10'
    text: |-
      Onze Minister kan, gelet op het belang dat dit besluit beoogt te beschermen, artikelen buiten toepassing laten of
      daarvan afwijken voor zover strikte toepassing leidt tot een onbillijkheid van overwegende aard.
    url: https://wetten.overheid.nl/BWBR0009936/2002-01-01#Artikel10
  - number: '11'
    text: Dit besluit treedt in werking met ingang van 1 januari 1999.
    url: https://wetten.overheid.nl/BWBR0009936/2002-01-01#Artikel11
  - number: '12'
    text: |-
      Dit besluit wordt aangehaald als: Besluit specifieke uitkeringen maatschappelijke opvang, vrouwenopvang en
      verslavingsbeleid.
    url: https://wetten.overheid.nl/BWBR0009936/2002-01-01#Artikel12
