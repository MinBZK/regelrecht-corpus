preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister en de Staatssecretaris van Volksgezondheid, Welzijn en Sport van 10 juli
    1998, GVM/Vz/983833, in overeenstemming met de Staatssecretaris van Binnenlandse Zaken mevrouw A. G. M. van de
    Vondervoort;

    Gelet op artikel 10a, eerste tot en met vierde lid, van de Welzijnswet 1994;

    De Raad van State gehoord (advies van 3 augustus 1998, No. W13.98.0308);

    Gezien het nader rapport van Onze Minister van Volksgezondheid, Welzijn en Sport van 30 september 1998, GVM/
    Vz/985051, in overeenstemming met Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties en Onze Minister voor
    Grote Steden- en Integratiebeleid;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0009936/2002-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0009936/2002-01-01#Artikel1
  - number: 1.a
    text: |-
      wet: [Welzijnswet 1994][ref1];

      [ref1]: https://wetten.overheid.nl/BWBR0006705
    url: https://wetten.overheid.nl/BWBR0009936/2002-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006705
  - number: 1.b
    text: |-
      uitkering: specifieke uitkering als bedoeld in [art. 10a van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006705#Artikel10a
    url: https://wetten.overheid.nl/BWBR0009936/2002-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006705
        artikel: 10a
  - number: 1.c
    text: 'maatschappelijke opvang: maatschappelijke opvang, vrouwenopvang daaronder niet begrepen.'
    url: https://wetten.overheid.nl/BWBR0009936/2002-01-01#Artikel1
  - number: '2'
    text: |-
      Aan de in de bij dit besluit behorende bijlage, onder A, opgenomen gemeenten, wordt een uitkering verstrekt
      ten behoeve van activiteiten op het terrein van maatschappelijke opvang bestaande uit het tijdelijk bieden van
      onderdak, begeleiding, informatie en advies aan personen die, door een of meerdere problemen, al dan niet gedwongen
      de thuissituatie hebben verlaten en niet in staat zijn zich op eigen kracht te handhaven in de samenleving,
      alsmede ten behoeve van activiteiten op het terrein van verslavingsbeleid, bestaande uit ambulante hulpverlening,
      gericht op verslavingsproblemen en preventie van verslavingsproblemen, inclusief activiteiten in het kader van de
      bestrijding van overlast door verslaving.
    url: https://wetten.overheid.nl/BWBR0009936/2002-01-01#Artikel2
  - number: '3'
    text: |-
      Aan de in de bij dit besluit behorende bijlage, onder B, opgenomen gemeenten, wordt een uitkering verstrekt ten
      behoeve van activiteiten op het terrein van vrouwenopvang, bestaande uit het tijdelijk bieden van onderdak en
      begeleiding aan vrouwen die, al dan niet gedwongen, de thuissituatie hebben verlaten in verband met problemen van
      relationele aard of geweld.
    url: https://wetten.overheid.nl/BWBR0009936/2002-01-01#Artikel3
  - number: '4'
    text: |-
      Uitkeringen aan gemeenten ten behoeve van door hun besturen te voeren beleid op de terreinen van maatschappelijke
      opvang, vrouwenopvang en verslavingsbeleid worden door Onze Minister toegekend met inachtneming van de
      [artikelen 5][ref1] tot en met [10][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009936#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0009936#Artikel10
    url: https://wetten.overheid.nl/BWBR0009936/2002-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0009936
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0009936
        artikel: '10'
  - number: '5.1'
    text: |-
      Onze Minister beslist voor 15 januari van het kalenderjaar omtrent de verlening. De beschikking bevat de wijze
      waarop het bedrag dat wordt verleend, is bepaald.
    url: https://wetten.overheid.nl/BWBR0009936/2002-01-01#Artikel5
  - number: '5.2'
    text: |-
      Op de verleende uitkering wordt maandelijks een voorschot verleend van één twaalfde deel van de verleende
      uitkering.
    url: https://wetten.overheid.nl/BWBR0009936/2002-01-01#Artikel5
  - number: '5.3'
    text: |-
      De [artikelen 4:48][ref1] en [4:50 van de Algemene wet bestuursrecht][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0009936/2002-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '6.1'
    text: |-
      Bij de verlening van een uitkering kan Onze Minister bepalen dat het uitkeringsbedrag door hem wordt bijgesteld,
      rekening houdend met de ontwikkeling van het prijspeil of de ontwikkeling in de kosten van de arbeidsvoorwaarden.
    url: https://wetten.overheid.nl/BWBR0009936/2002-01-01#Artikel6
  - number: '6.2'
    text: |-
      Met het oog op de toepassing van het eerst lid kan Onze Minister bij de verlening van de uitkering tevens bepalen
      welk deel van het uitkeringsbedrag in aanmerking zal worden genomen voor een bijstelling in verband met de
      ontwikkeling van het prijspeil, onderscheidenlijk van de kosten van de arbeidsvoorwaarden.
    url: https://wetten.overheid.nl/BWBR0009936/2002-01-01#Artikel6
  - number: '6.3'
    text: |-
      Indien een uitkering met toepassing van het eerste lid wordt bijgesteld, kan de bevoorschotting overeenkomstig
      worden gewijzigd.
    url: https://wetten.overheid.nl/BWBR0009936/2002-01-01#Artikel6
  - number: '7.1'
    text: |-
      Voor zover na afloop van het kalenderjaar de uitkering niet is besteed aan het doel van de uitkering, kan het
      worden gereserveerd. De aldus gereserveerde bedragen kunnen uitsluitend worden besteed aan het doel waarvoor de
      uitkering werd verstrekt.
    url: https://wetten.overheid.nl/BWBR0009936/2002-01-01#Artikel7
  - number: '7.2'
    text: |-
      Het totaal van de reservering, bedoeld in het eerste lid, gaat een percentage van 30% van de verleende uitkering
      niet te boven.
    url: https://wetten.overheid.nl/BWBR0009936/2002-01-01#Artikel7
  - number: '8.1'
    text: |-
      Binnen tien maanden na afloop van het kalenderjaar waarin een uitkering is verstrekt, legt de gemeente een
      verklaring over, waaruit blijkt in hoeverre de verleende uitkering is besteed ten behoeve van het doel waarvoor zij
      was bestemd. Indien de uitkering meer bedroeg dan € 125 000 is de verantwoording voorzien van een verklaring van
      een accountant als bedoeld in [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0009936/2002-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '8.2'
    text: |-
      Indien de in het eerste lid bedoelde gegevens voldoende blijken uit de vastgestelde rekening van de gemeente, kan
      worden volstaan met de toezending van de rekening, voorzien van een verklaring van een accountant bij de rekening
      als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0009936/2002-01-01#Artikel8
  - number: '9'
    text: |-
      Binnen zes maanden na ontvangst van een verantwoording als bedoeld in [artikel 8, eerste lid][ref1],
      of de rekening, bedoeld in [artikel 8, tweede lid][ref2], geeft Onze Minister een beschikking tot
      vaststelling van de uitkering. De [artikelen 4:46][ref3], [4:49][ref4], [4;52][ref5], [4:56][ref6] en
      [4:57 van de Algemene wet bestuursrecht][ref7] zijn van overeenkomstige toepassing, met dien verstande dat de
      uitkering eveneens op een lager bedrag kan worden vastgesteld indien niet uit een verantwoording blijkt dat de
      uitkering is besteed ten behoeve van het doel waarvoor zij is bestemd.


      [ref1]: https://wetten.overheid.nl/BWBR0009936#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0009936#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref6]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref7]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0009936/2002-01-01#Artikel9
    references:
