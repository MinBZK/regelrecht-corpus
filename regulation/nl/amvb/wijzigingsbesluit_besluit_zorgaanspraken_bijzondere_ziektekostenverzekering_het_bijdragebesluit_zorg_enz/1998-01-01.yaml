preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Volksgezondheid, Welzijn en Sport en de Staatssecretaris van
    Volksgezondheid, Welzijn en Sport van 15 mei 1997, VPZ/VU-971768, gedaan in overeenstemming met de Staatssecretaris
    van Sociale Zaken en Werkgelegenheid;

    Gelet op de artikelen 6, eerste en derde lid, 8, tweede lid, 9a en 16 van de Algemene Wet Bijzondere
    Ziektekosten, artikel 8, tweede lid, van de Ziekenfondswet, artikel 2, tweede lid, van de Wet op de toegang tot
    ziektekostenverzekeringen en artikel 15, tweede lid, van de Overgangswet verzorgingshuizen;

    De Raad van State gehoord (advies van 12 augustus, no. W13.07 0277);

    Gezien het nader rapport van Onze Minister van Volksgezondheid, Welzijn en Sport en de Staatssecretaris van
    Volksgezondheid, Welzijn en Sport van 21 augustus 1997, VPZ/VU-973065, uitgebracht in overeenstemming met de
    Staatssecretaris van Sociale Zaken en Werkgelegenheid;

    Hebben goedgevonden en verstaan:
