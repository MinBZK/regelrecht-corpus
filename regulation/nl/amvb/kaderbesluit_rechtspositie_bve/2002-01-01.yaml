  - number: '9'
    text: De salarisbedragen, genoemd in de bijlagen bij dit besluit, kunnen worden gewijzigd bij ministeriële regeling.
    url: https://wetten.overheid.nl/BWBR0008190/2002-01-01#Artikel9
  - number: '10'
    text: |-
      1 De betrokkene heeft aanspraak op een vakantie-uitkering voor de tijd gedurende welke hij als zodanig
      salaris heeft genoten. Voor de toepassing van de eerste volzin wordt onder tijd, gedurende welke salaris is
      ontvangen, niet begrepen tijd gedurende welke de betrokkene wegens verplichte militaire dienst, anders dan voor
      herhalingsoefeningen, niet verlof zijnde, slechts salaris heeft ontvangen tot een bedrag van het op hem te verhalen
      gedeelte van de pensioenbijdrage.

      2 Tenzij uit het derde en het vierde lid anders voortvloeit, bedraagt de vakantie-uitkering per kalendermaand 8%
      van het bedrag dat de betrokkene in die maand aan salaris heeft ontvangen. Voor de toepassing van de eerste volzin
      wordt in de gevallen, bedoeld in de[artikelen 7][ref1] en [8][ref2], steeds uitgegaan van het volledige aan zijn
      betrekking verbonden salaris.

      3 Voor de betrokkene die in de van toepassing zijnde maand op grond van het eerste lid aanspraak heeft op een
      bedrag dat lager is dan het bedrag dat in [bijlage 2][ref3] bij zijn leeftijd is vermeld, wordt de vakantie-
      uitkering vastgesteld op laatstbedoeld bedrag.

      4 Het in het derde lid bedoelde bedrag wordt naar evenredigheid verminderd, indien:

      a. de betrokkene is aangesteld in een betrekking met een omvang van minder dan een normbetrekking.

      b. het salaris van de betrokkene op een andere dag dan de eerste dag van die maand is aangevangen dan wel indien
      hij in een deel van die maand geen salaris heeft ontvangen;

      c. de betrokkene in de loop van die maand slechts een gedeelte van zijn salaris heeft ontvangen wegens verleend
      verlof, in verband met non-activiteit, bij wijze van disciplinaire straf of uit hoofde van schorsing.

      5 De vakantie-uitkering wordt aan de betrokkene eenmaal per jaar in de maand mei uitbetaald over de periode
      van twaalf maanden die eindigt met de maand mei. In afwijking hiervan vindt bij ontslag van de betrokkene de
      uitbetaling plaats over het tijdvak, gelegen tussen het einde van de laatst verstreken periode waarover de
      vakantie-uitkering werd uitbetaald en de datum van ontslag.


      [ref1]: https://wetten.overheid.nl/BWBR0008190#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0008190#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0008190
