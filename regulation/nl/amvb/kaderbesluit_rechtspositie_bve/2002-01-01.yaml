preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Onderwijs, Cultuur en Wetenschappen, gedaan mede namens Onze Minister van
    Landbouw, Natuurbeheer en Visserij, van 24 mei 1996, nr. 96010633, directie Arbeidsvoorwaarden en Beroepskwaliteit;

    Gelet op de artikelen 4.1.2, tweede lid, en 4.3.2, tweede lid, van de Wet educatie en beroepsonderwijs;

    De Raad van State gehoord (advies van 18 juni 1996, nr. W05.96.0226);

    Gezien het nader rapport van Onze Minister van Onderwijs, Cultuur en Wetenschappen, uitgebracht mede namens Onze
    Minister van Landbouw, Natuurbeheer en Visserij, van 11 juli 1996, nr. 96016974, directie Arbeidsvoorwaarden en
    Beroepskwaliteit;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0008190/2002-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Tenzij anders vermeld, wordt in dit besluit verstaan onder:

      a. instelling: een openbare of uit de openbare kas bekostigde bijzondere instelling als bedoeld in de
      [artikelen 1.3.1][ref1], [1.3.2][ref2], [1.3.3][ref3], [1.3.4][ref4], [1.5.1][ref5], [12.3.5][ref6], [12.3.8][ref7]
      en [12.3.12, van de Wet educatie en beroepsonderwijs][ref8];

      b. betrokkene: een lid van het door het bevoegd gezag benoemde personeel;

      c. functie: het samenstel van werkzaamheden door de betrokkene te verrichten krachtens en overeenkomstig hetgeen
      hem door het bevoegd gezag is opgedragen;

      d. Onze minister: Onze Minister van Onderwijs, Cultuur en Wetenschappen en, voor wat betreft het landbouwonderwijs,
      Onze Minister van Landbouw, Natuurbeheer en Visserij;

      e. bevoegd gezag: wat betreft:

        - een gemeentelijke instelling: het college van burgemeester en wethouders, voor zover de raad dit niet anders
      bepaalt en, indien de raad dit wenselijk oordeelt, met inachtneming van door hem te stellen regels;
        - een bijzondere instelling; het instellingsbestuur;

      f. normbetrekking: de betrekking waarvan de omvang gelijk is aan die van de door het bevoegd gezag vastgestelde
      volledige weektaak;

      g. benoeming: de benoeming bij het bijzonder onderwijs en de aanstelling bij het openbaar onderwijs;

      h. aanlooptraject: de reeks salarisbedragen die voorafgaat aan de maximumschaal bij een functie waarop
      [bijlage 1D][ref9] van toepassing is.


