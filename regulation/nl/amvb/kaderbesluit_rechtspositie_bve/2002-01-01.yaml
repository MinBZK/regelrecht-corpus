        artikel: '3'
      - id: ref2
        bwb_id: BWBR0008190
  - number: '8'
    text: |-
      1 Indien het salaris minder is dan het maandbedrag van het minimumloon dat krachtens de [artikelen 7][ref1],
      [8][ref2] en [14][ref3] van de Wet minimumloon en minimumvakantie-uitkering geldt voor werknemers van dezelfde
      leeftijd als betrokkene, wordt hem een toelage toegekend ten bedrage van het verschil.

      2 Voor de betrokkene met een onvolledige werktijd wordt het voor werknemers van dezelfde leeftijd geldende
      minimumloon geacht te zijn vastgesteld op een evenredig deel van het minimumloon bij een volledige werktijd.


      [ref1]: https://wetten.overheid.nl/BWBR0008190#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0008190#Artikel8
