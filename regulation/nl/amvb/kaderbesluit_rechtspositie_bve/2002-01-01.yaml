  - number: 10a
    text: |-
      1 Onze minister kan bij ministeriële regeling bepalen dat recht bestaat op een algemene eindejaarsuitkering en
      daarbij de wijze waarop deze uitkering wordt berekend, vaststellen.

      2 In de ministeriële regeling, bedoeld in het eerste lid, kan worden bepaald dat de ministeriële regeling
      terugwerkt tot en met 1 augustus 1996.
    url: https://wetten.overheid.nl/BWBR0008190/2002-01-01#Artikel10a
  - number: '11'
    text: |-
      De bepalingen in dit besluit zijn regelen voor het openbaar onderwijs en tevens voorwaarden voor de bekostiging
      voor het bijzonder onderwijs.
    url: https://wetten.overheid.nl/BWBR0008190/2002-01-01#Artikel11
  - number: '12'
    text: Dit besluit wordt aangehaald als Kaderbesluit rechtspositie BVE.
    url: https://wetten.overheid.nl/BWBR0008190/2002-01-01#Artikel12
  - number: '13'
    text: |-
      Met ingang van het tijdstip waarop dit besluit voor onderscheiden instellingen in werking treedt vindt het
      [Rechtspositiebesluit onderwijspersoneel][ref1] geen toepassing meer op die instellingen en het aan die
      instellingen benoemde personeel.


      [ref1]: https://wetten.overheid.nl/BWBR0003771
