  - number: '2'
    text: |-
      1 De algemene arbeidsduur bestaat uit de componenten werktijd en verlof.

      2 De werktijd van de betrokkene die is benoemd in een normbetrekking bedraagt 1659 uur per jaar, aangevuld met 51
      uur verlof, waarbij de gemiddelde weektaak op jaarbasis gelijk is aan 36,86 uur.

      3 In afwijking van het tweede lid kan de algemene arbeidsduur van de betrokkene die is benoemd in een
      normbetrekking ten hoogste 1790 uur per jaar bedragen, waarbij het aantal uren verlof gelijk is aan die arbeidsduur
      verminderd met 1659 uur. De eerste volzin vindt slechts toepassing mits hieruit geen verdringing van ander
      personeel voortvloeit.

      4 De verlofuren, bedoeld in het tweede en derde lid, kunnen ofwel in de vorm van een jaarverlof ofwel als meerjarig
      spaarverlof worden opgenomen.
    url: https://wetten.overheid.nl/BWBR0008190/2002-01-01#Artikel2
  - number: '3'
    text: |-
      1 Het bevoegd gezag stelt de formatie voor de instelling vast. De formatie omvat het geheel van functies in
      aantallen en niveaus voor het personeel van de instelling.

      2 Aard en niveau van de functie worden bepaald aan de hand van taakkarakteristieken en functietyperingen die door
      het bevoegd gezag worden vastgesteld, volgens het door het bevoegd gezag te hanteren functiewaarderingssysteem,
      daarbij uitgaande van de[ artikelen 4][ref1] en [5][ref2]. Het bevoegd gezag stelt een bezwarencommissie
      functiewaardering in.

      3 Het bevoegd gezag stelt ingevolge het tweede lid voor elke functie een maximumsalarisschaal vast waarbij het
      gebruik maakt van de in de [bijlage 1A][ref3] bij dit besluit vermelde reeks van genummerde salarissen, behorende
      bij een normbetrekking.

      4 Het bevoegd gezag stelt regels vast omtrent de wijze waarop de betrokkene het maximumsalaris van de bij zijn
      functie behorende maximumschaal bereikt, waarbij het gebruik maakt van de in de [bijlagen 1A][ref4], [1C][ref5]
      of [1D][ref6] vermelde salarisbedragen en stelt regels vast met betrekking tot de in [bijlage 1E][ref7] vermelde
      toelage.


