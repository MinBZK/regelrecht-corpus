    text: |-
      Bij de vaststelling van aard en niveau van de functie, bedoeld in [artikel 3][ref1], gelden als uitgangspunt de in
      het schooljaar 1994/1995 geldende functiestructuur en beloningsverhoudingen.


      [ref1]: https://wetten.overheid.nl/BWBR0008190#Artikel3
