  - number: '5'
    text: |-
      1 De hoogst bereikbare salarisschaal voor de voorzitter van het college van bestuur is schaal 18 van
      [bijlage 1A][ref1].

      2 De hoogst bereikbare salarisschaal voor de voorzitter van de centrale directie is schaal 17 van
      [bijlage 1A][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008190
