  - number: '6'
    text: |-
      1 De betrokkene wordt aan een instelling benoemd in een van de functies die aan de instelling beschikbaar zijn
      ingevolge de door het bevoegd gezag vastgestelde formatie.

      2 Het bevoegd gezag stelt, met inachtneming van dit artikel en van artikel 3, regels vast met betrekking tot de
      wijze waarop het salaris van de betrokkene bij zijn indiensttreding wordt bepaald.

      3 Het salaris van de betrokkene met een onvolledige werktijd wordt vastgesteld op een evenredig deel van het
      salaris bij een volledige werktijd.
    url: https://wetten.overheid.nl/BWBR0008190/2002-01-01#Artikel6
  - number: '7'
    text: |-
      1 In afwijking van [artikel 3, derde lid][ref1], wordt het salaris van een betrokkene die de leeftijd van 22
      jaar nog niet heeft bereikt, vastgesteld op het bedrag dat in de voor hem geldende schaal is opgenomen bij het
      salarisnummer bestaande uit de letter J en het getal dat overeenkomt met zijn leeftijd in jaren, voor zover de
      schaal in [bijlage 1B][ref2] dit aangeeft.

      2 Het salaris van de betrokkene die de leeftijd van 22 jaar bereikt wordt met ingang van de eerste dag van de maand
      waarin hij die leeftijd bereikt, vastgesteld:

      a. op het laagste bedrag van het aanlooptraject;

      b. indien bij de functie geen aanlooptraject behoort, op het bedrag dat in de voor hem van toepassing zijnde schaal
      is vermeld bij salarisnummer 0.


      [ref1]: https://wetten.overheid.nl/BWBR0008190#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0008190
    url: https://wetten.overheid.nl/BWBR0008190/2002-01-01#Artikel7
    references:
