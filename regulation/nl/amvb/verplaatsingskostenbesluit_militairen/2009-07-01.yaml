---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: verplaatsingskostenbesluit_militairen
regulatory_layer: AMVB
publication_date: '2012-11-30'
valid_from: '2009-07-01'
bwb_id: BWBR0005137
url: https://wetten.overheid.nl/BWBR0005137/2009-07-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Defensie van 1 februari 1991, Afdeling arbeidsvoorwaardenbeleid, nr. D
    91/099/2198;

    Gelet op artikel 12 van de Militaire Ambtenarenwet 1931 (Stb. 519) en artikel 125 van de Ambtenarenwet 1929 (Stb.
    530);

    De Raad van State gehoord (advies van 22 mei 1991, nr. W07.91.0062);

    Gezien het nader rapport van de voornoemde Minister van 3 juli 1991, nr. D 91/099/2917;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0005137/2009-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0005137/2009-07-01#Artikel1
  - number: 1.a
    text: 'afstand:'
    url: https://wetten.overheid.nl/BWBR0005137/2009-07-01#Artikel1
  - number: 1.a.1
    text: 'indien er sprake is van een tabeltegemoetkoming : de kortste gebruikelijke reisroute;'
    url: https://wetten.overheid.nl/BWBR0005137/2009-07-01#Artikel1
  - number: 1.a.2
    text: 'indien er geen sprake is van een tabeltegemoetkoming:'
    url: https://wetten.overheid.nl/BWBR0005137/2009-07-01#Artikel1
  - number: 1.a.2.a
    text: 'bij gebruik van openbaar vervoer: de kortste gebruikelijke reisroute;'
    url: https://wetten.overheid.nl/BWBR0005137/2009-07-01#Artikel1
  - number: 1.a.2.b
    text: |-
      bij gebruik van ander vervoer dan openbaar vervoer: het aantal kilometers gemeten langs de kortste gebruikelijke
      openbare weg; tussen de woning of de plaats van legering en de plaats van tewerkstelling; bij meer dan één plaats
      van tewerkstelling die zich niet binnen één complex of terrein bevinden geldt de grootste afstand;
    url: https://wetten.overheid.nl/BWBR0005137/2009-07-01#Artikel1
  - number: 1.b
    text: |-
      ambts- of dienstwoning: de door het bevoegde gezag aan de militair in verband met de uitoefening van zijn functie
      toegewezen woning;
    url: https://wetten.overheid.nl/BWBR0005137/2009-07-01#Artikel1
  - number: 1.c
    text: |-
      achtergebleven kind: het buiten het land van plaatsing verblijf houdende ongehuwde kind van de militair, dat
      minderjarig is of waarvoor aanspraak bestaat op kinderbijslag dan wel op studiefinanciering in de zin van de
      [Wet studiefinanciering 2000][ref1] ; het kind wordt geacht minderjarig te zijn tot en met 31 december van het
      kalenderjaar waarin het de leeftijd van 18 jaar bereikt;


      [ref1]: https://wetten.overheid.nl/BWBR0011453
    url: https://wetten.overheid.nl/BWBR0005137/2009-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0011453
  - number: 1.d
    text: |-
      berekeningsbasis: de tot een jaarbedrag te herleiden inkomstenbestanddelen, die deel uitmaken van de
      berekeningsgrondslag voor pensioenen ingevolge de bij of krachtens de [Kaderwet militaire pensioenen][ref1]
      vastgestelde regelingen, die de militair op het berekeningstijdstip geniet bij verhuizing naar of in een gebied
      buiten Nederland, te verhogen met de toelage buitenland;


      [ref1]: https://wetten.overheid.nl/BWBR0011955
    url: https://wetten.overheid.nl/BWBR0005137/2009-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0011955
  - number: 1.e
    text: 'berekeningstijdstip: de datum waarop de verhuizing aanvangt, met dien verstande dat daarvoor geldt:'
    url: https://wetten.overheid.nl/BWBR0005137/2009-07-01#Artikel1
  - number: 1.e.1
    text: 'bij verhuizing vooruitlopend op een verplaatsing: de datum van de verplaatsing;'
    url: https://wetten.overheid.nl/BWBR0005137/2009-07-01#Artikel1
  - number: 1.e.2
    text: 'bij overlijden of ontslag van de militair: de datum waarop laatstelijk bezoldiging werd genoten;'
    url: https://wetten.overheid.nl/BWBR0005137/2009-07-01#Artikel1
  - number: 1.f
    text: 'bevoegd gezag: de bij ministeriële regeling aan te wijzen functionarissen;'
    url: https://wetten.overheid.nl/BWBR0005137/2009-07-01#Artikel1
  - number: 1.g
    text: |-
      detachering: verandering van de standplaats die naar het oordeel van het bevoegde gezag een tijdelijk karakter
      heeft;
    url: https://wetten.overheid.nl/BWBR0005137/2009-07-01#Artikel1
  - number: 1.h
    text: |-
      een eigen huishouding voeren: het zelfstandig bewonen van woonruimte, anders dan bij de eigen, stief- of
      pleegouders van de militair of van zijn echtgenote, voorzien van eigen meubilair en stoffering;
    url: https://wetten.overheid.nl/BWBR0005137/2009-07-01#Artikel1
  - number: 1.i
    text: 'Europa: Europa inclusief Turkije;'
    url: https://wetten.overheid.nl/BWBR0005137/2009-07-01#Artikel1
  - number: 1.j
    text: |-
      gezinsleden: de echtgenote van de militair en de eigen, stief- of pleegkinderen van de militair zelf of van zijn
      echtgenote, voor zover zij met hem samenwonen en in geval van vestiging buiten Nederland ter zake goedkeuring is
      verkregen van de minister;
    url: https://wetten.overheid.nl/BWBR0005137/2009-07-01#Artikel1
  - number: 1.k
    text: |-
      echtgenote: degene met de militair naar Nederlands recht is gehuwd, alsmede degene die met inachtneming van
      [artikel 1, derde tot en met vijfde lid, van het Algemeen militair ambtenarenreglement][ref1] mede onder dit begrip
      wordt verstaan;


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel1
    url: https://wetten.overheid.nl/BWBR0005137/2009-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '1'
  - number: 1.l
    text: 'militair (tenzij uitdrukkelijk anders is bepaald):'
    url: https://wetten.overheid.nl/BWBR0005137/2009-07-01#Artikel1
  - number: 1.l.1
    text: |-
      de militair in de zin van
      [artikel 1, eerste lid, onderdeel c, ten eerste, van het Algemeen militair ambtenarenreglement][ref1]
        - daaronder begrepen hij die is aangesteld in burgerlijke openbare dienst om in de krijgsmacht
      als geestelijk verzorger doorlopend werkzaam te zijn - met uitzondering van de militair op wie
      [artikel 16 van het Inkomstenbesluit militairen (IBM)][ref2] van toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007816#Artikel16
    url: https://wetten.overheid.nl/BWBR0005137/2009-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0007816
        artikel: '16'
  - number: 1.l.2
    text: |-
      Onder militair wordt mede begrepen de ambtenaar, bedoeld in
      [artikel 8a, eerste lid, van het Burgerlijk ambtenarenreglement defensie (Bard)][ref1] die als gevolg van een
      functiewisseling in het kader van de mobiliteitsbevordering van standplaats verandert. Waar in dit besluit wordt
      verwezen naar [artikel 143 van het Algemeen militair ambtenarenreglement][ref2], wordt voor deze ambtenaren
      gelezen: [artikel 75 Bard][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel8a
      [ref2]: https://wetten.overheid.nl/BWBR0003482#Artikel143
      [ref3]: https://wetten.overheid.nl/BWBR0006040#Artikel75
    url: https://wetten.overheid.nl/BWBR0005137/2009-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: 8a
      - id: ref2
        bwb_id: BWBR0003482
        artikel: '143'
      - id: ref3
        bwb_id: BWBR0006040
        artikel: '75'
  - number: 1.m
    text: |-
      minister: 'Onze Minister van Defensie; n. plaats van legering: de voor de militair gebruikelijke ingang van het'
      gebouw, gebouwencomplex, terrein of vaartuig waar hem door het bevoegde gezag nachtverblijf van rijkswege wordt
      geboden;
    url: https://wetten.overheid.nl/BWBR0005137/2009-07-01#Artikel1
  - number: 1.o
    text: |-
      plaats van tewerkstelling: de gebruikelijke ingang van het gebouw, gebouwencomplex, terrein of vaartuig waar de
      militair gewoonlijk zijn werkzaamheden verricht, dan wel een door het bevoegde gezag aangewezen plaats;
    url: https://wetten.overheid.nl/BWBR0005137/2009-07-01#Artikel1
  - number: 1.p
    text: |-
      standplaats: de gemeente of het bij name genoemde deel van die gemeente, waar de plaats van tewerkstelling van
      de militair is gelegen, dan wel indien de plaats van tewerkstelling een vaartuig is, de door het bevoegde gezag
      aangewezen plaats;
    url: https://wetten.overheid.nl/BWBR0005137/2009-07-01#Artikel1
  - number: 1.q
    text: |-
      toelage buitenland: de toelage ter zake van het verblijf van de militair buiten Nederland, bedoeld in
      [artikel 16, eerste lid, onder c van het Inkomstenbesluit militairen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007816#Artikel16
    url: https://wetten.overheid.nl/BWBR0005137/2009-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007816
        artikel: '16'
  - number: 1.r
    text: 'verhuizen: veranderen van woning;'
    url: https://wetten.overheid.nl/BWBR0005137/2009-07-01#Artikel1
  - number: 1.s
    text: 'verplaatsing: verandering van standplaats die naar het oordeel van het bevoegde gezag een permanent karakter heeft;'
    url: https://wetten.overheid.nl/BWBR0005137/2009-07-01#Artikel1
  - number: 1.t
    text: |-
      voor het eerst in dienst treden: in dienst treden bij het Rijk of een van zijn diensten, bedrijven of instellingen,
      anders dan in geval van overgang binnen een maand:
    url: https://wetten.overheid.nl/BWBR0005137/2009-07-01#Artikel1
  - number: 1.t.1
    text: van de ene naar de andere tak van rijksdienst;
    url: https://wetten.overheid.nl/BWBR0005137/2009-07-01#Artikel1
  - number: 1.t.2
    text: van een andere overheidsdienst of een door het Rijk bekostigde onderwijsinstelling naar de rijksdienst;
    url: https://wetten.overheid.nl/BWBR0005137/2009-07-01#Artikel1
  - number: 1.u
    text: 'woning: woonruimte anders dan van rijkswege waaronder mede te verstaan de ambts- of dienstwoning;'
    url: https://wetten.overheid.nl/BWBR0005137/2009-07-01#Artikel1
  - number: 1.v
    text: |-
      woongebied: zodanig gebied dat de kortste gebruikelijke openbare weg van de woning naar de plaats van
      tewerkstelling niet meer bedraagt dan 25 kilometer alsmede een door het bevoegde gezag bepaalde limitatieve
      opsomming van goedgekeurde plaatsen van vestiging, behorende bij een standplaats waarvan het woongebied in
      onvoldoende mate mogelijkheid biedt tot vestiging.
    url: https://wetten.overheid.nl/BWBR0005137/2009-07-01#Artikel1
  - number: '2.1'
    text: |-
      De militair die ingevolge een op grond van [artikel 143 van het Algemeen militair ambtenarenreglement][ref1]
      opgelegde verplichting verhuist naar een nader door het bevoegd gezag aangegeven plaats of gebied, heeft aanspraak
      op een tegemoetkoming in de verhuiskosten, mits de verhuizing plaatsvindt uiterlijk twee jaren na de datum waarop
      de verplichting is opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel143
    url: https://wetten.overheid.nl/BWBR0005137/2009-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '143'
  - number: '2.2'
    text: |-
      De militair, bedoeld in het eerste lid, die is verhuisd en van de in het eerste lid bedoelde verplichting wordt
      ontheven, heeft aanspraak op een tegemoetkoming in de verhuiskosten, mits de verhuizing plaatsvindt binnen twee
      jaren na de ontheffing.
    url: https://wetten.overheid.nl/BWBR0005137/2009-07-01#Artikel2
  - number: '2.3'
    text: |-
      De militair die bij verplaatsing verhuist naar het woongebied van zijn nieuwe standplaats omdat hij naar zijn
      oordeel niet dagelijks heen en weer kan reizen, heeft aanspraak op een tegemoetkoming in de verhuiskosten mits de
      verhuizing plaatsvindt binnen twee jaren na de datum van de verplaatsing, dan wel binnen zes maanden voor de datum
      van zijn verplaatsing en indien door de verhuizing de reisafstand tussen de woning en de plaats van tewerkstelling
      met ten minste 50% wordt bekort.
    url: https://wetten.overheid.nl/BWBR0005137/2009-07-01#Artikel2
  - number: '2.4'
    text: |-
      Het bevoegd gezag kan de militair die bij indiensttreding een eigen huishouding voert, eenmalig aanspraak verlenen
      op een tegemoetkoming in de verhuiskosten mits de verhuizing plaatsvindt binnen twee jaren na de datum van de
      indiensttreding.
    url: https://wetten.overheid.nl/BWBR0005137/2009-07-01#Artikel2
  - number: '3.1'
    text: |-
      De militair die voor het eerst in dienst treedt heeft, in afwijking van [artikel 2][ref1], slechts aanspraak op een
      tegemoetkoming in de verhuiskosten, indien hij schriftelijk heeft ingestemd met een terugbetalingsverplichting bij
      ontslag op aanvraag of op grond van aan hem te wijten feiten of omstandigheden, binnen twee jaren na de verhuizing.


      [ref1]: https://wetten.overheid.nl/BWBR0005137#Artikel2
    url: https://wetten.overheid.nl/BWBR0005137/2009-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005137
        artikel: '2'
  - number: '3.2'
    text: |-
      Overgang binnen een maand naar een andere functie binnen de rijksdienst wordt niet beschouwd als een ontslag
      op aanvraag als bedoeld in het eerste lid, tenzij de bedoelde militair als gevolg van die overgang opnieuw moet
      verhuizen met aanspraak op een tegemoetkoming in de verhuiskosten.
    url: https://wetten.overheid.nl/BWBR0005137/2009-07-01#Artikel3
  - number: '5'
    text: |-
      De militair die met toekenning van een tegemoetkoming in de verhuiskosten is verhuisd naar een buiten Nederland
      gelegen land of naar een ambts- of dienstwoning en wordt ontslagen heeft aanspraak op een tegemoetkoming in de
      kosten van een verhuizing naar of in Nederland indien het een ontslag betreft:
    url: https://wetten.overheid.nl/BWBR0005137/2009-07-01#Artikel5
  - number: 5.a
    text: |-
      met recht op een uitkering ingevolge de [Uitkeringswet gewezen militairen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002540
    url: https://wetten.overheid.nl/BWBR0005137/2009-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002540
  - number: 5.b
    text: met recht op dadelijk ingaand pensioen;
    url: https://wetten.overheid.nl/BWBR0005137/2009-07-01#Artikel5
  - number: 5.c
    text: anders dan op eigen aanvraag en niet het gevolg zijnde van aan hem te wijten feiten of omstandigheden.
    url: https://wetten.overheid.nl/BWBR0005137/2009-07-01#Artikel5
  - number: '6'
    text: |-
      Aan de gezinsleden van de militair wordt een tegemoetkoming in de kosten van verhuizing naar of in Nederland
      toegekend, indien de militair komt te overlijden, nadat hij met de gezinsleden onder toekenning van een
      tegemoetkoming in de verhuiskosten is verhuisd naar een buiten Nederland gelegen land of naar een ambts- of
      dienstwoning.
    url: https://wetten.overheid.nl/BWBR0005137/2009-07-01#Artikel6
  - number: '7'
    text: |-
      Indien verhuizing in het belang van de militair of zijn gezinsleden naar het oordeel van de militair geneeskundige
      dienst medisch noodzakelijk is, kan het bevoegde gezag hem aanspraak verlenen op een tegemoetkoming in de
      verhuiskosten.
    url: https://wetten.overheid.nl/BWBR0005137/2009-07-01#Artikel7
  - number: '8'
    text: |-
      De aanspraak op een tegemoetkoming in de verhuiskosten ingevolge de [artikelen 5][ref1], [6][ref2] en [7][ref3]
      vervalt indien de verhuizing niet plaatsvindt binnen één jaar na de datum van het ontslag, het overlijden of de
      datum waarop het bevoegde gezag wegens medische noodzaak aanspraak heeft verleend op een tegemoetkoming in de
      verhuiskosten.


      [ref1]: https://wetten.overheid.nl/BWBR0005137#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005137#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0005137#Artikel7
    url: https://wetten.overheid.nl/BWBR0005137/2009-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0005137
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005137
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0005137
        artikel: '7'
  - number: '9.1'
    text: |-
      De militair die aanspraak heeft op een tegemoetkoming in de verhuiskosten en samen met zijn gezinsleden naar, of in
      een buiten Nederland gelegen gebied, dan wel naar Nederland verhuist, heeft aanspraak op tijdelijke onderbrenging
      van hemzelf en zijn gezinsleden indien:
    url: https://wetten.overheid.nl/BWBR0005137/2009-07-01#Artikel9
  - number: 9.1.a
    text: hij ten gevolge van de verscheping van de inboedel daarover niet kan beschikken;
    url: https://wetten.overheid.nl/BWBR0005137/2009-07-01#Artikel9
  - number: 9.1.b
    text: hij nog niet over een woning kan beschikken.
    url: https://wetten.overheid.nl/BWBR0005137/2009-07-01#Artikel9
  - number: '9.2'
    text: |-
      Indien de militair buiten Nederland blijft geplaatst, maar zijn gezinsleden naar Nederland terugkeren, wordt onder
      toepassing van de voorwaarden bedoeld in het eerste lid, aanspraak verleend op tijdelijke onderbrenging van zijn
      gezinsleden.
    url: https://wetten.overheid.nl/BWBR0005137/2009-07-01#Artikel9
  - number: '9.3'
    text: |-
      Indien niet over de woning, bedoeld in het eerste lid, onder b, kan worden beschikt, zijn de eventuele kosten
      van opslag van de inboedel voor rekening van het Rijk. Deze aanspraak bestaat eveneens voor de militair zonder
      gezinsleden met aanspraak op een tegemoetkoming in de verhuiskosten die naar of in een buiten Nederland gelegen
      gebied dan wel naar Nederland verhuist.
    url: https://wetten.overheid.nl/BWBR0005137/2009-07-01#Artikel9
  - number: '9.4'
    text: |-
      Teneinde de duur van de aanspraak te beperken is de militair gehouden al het mogelijke te doen om een woning te
      verkrijgen.
    url: https://wetten.overheid.nl/BWBR0005137/2009-07-01#Artikel9
  - number: '9.5'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent de duur, de aard, de kosten en de eigen
      bijdrage van de tijdelijke onderbrenging als mede de opslag van de inboedel.
    url: https://wetten.overheid.nl/BWBR0005137/2009-07-01#Artikel9
  - number: '10'
    text: |-
      Ten aanzien van verhuizingen als bedoeld in [artikel 2, eerste lid][ref1], is de tegemoetkoming in de verhuiskosten
      gelijk aan een tegemoetkoming in:


      [ref1]: https://wetten.overheid.nl/BWBR0005137#Artikel2
    url: https://wetten.overheid.nl/BWBR0005137/2009-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0005137
        artikel: '2'
  - number: 10.a
    text: |-
      de reis- en verblijfkosten binnen Nederland die voor de militair en zijn echtgenote zijn verbonden aan één reis ter
      bezichtiging van woonruimte;
    url: https://wetten.overheid.nl/BWBR0005137/2009-07-01#Artikel10
  - number: 10.b
    text: |-
      de reis- en verblijfkosten die voor de militair en zijn gezinsleden zijn verbonden aan de reis naar de nieuwe
      woning;
    url: https://wetten.overheid.nl/BWBR0005137/2009-07-01#Artikel10
  - number: 10.c
    text: de transportkosten;
    url: https://wetten.overheid.nl/BWBR0005137/2009-07-01#Artikel10
  - number: 10.d
    text: de dubbele woonlasten;
    url: https://wetten.overheid.nl/BWBR0005137/2009-07-01#Artikel10
  - number: 10.e
    text: de kosten van de tussenpersoon, voor zover deze in rekening wordt gebracht ter verwerving van een huurwoning;
    url: https://wetten.overheid.nl/BWBR0005137/2009-07-01#Artikel10
  - number: 10.f
    text: |-
      overige kosten, mits een eigen huishouding wordt gevoerd op de datum van de verplaatsing of de indiensttreding en
      de eigen huishouding wordt voorgezet na de verhuizing.
    url: https://wetten.overheid.nl/BWBR0005137/2009-07-01#Artikel10
  - number: '11'
    text: |-
      Ten aanzien van verhuizingen anders dan als bedoeld in [artikel 2, eerste lid][ref1], is de tegemoetkoming in de
      verhuiskosten gelijk aan een tegemoetkoming in:


      [ref1]: https://wetten.overheid.nl/BWBR0005137#Artikel2
    url: https://wetten.overheid.nl/BWBR0005137/2009-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0005137
        artikel: '2'
  - number: 11.a
    text: |-
      de reis- en verblijfkosten die voor de militair en zijn gezin zijn verbonden aan de reis naar de nieuwe woning,
      mits het een verhuizing betreft van, naar of in een buiten Nederland gelegen land;
    url: https://wetten.overheid.nl/BWBR0005137/2009-07-01#Artikel11
  - number: 11.b
    text: transportkosten;
    url: https://wetten.overheid.nl/BWBR0005137/2009-07-01#Artikel11
  - number: 11.c
    text: |-
      overige kosten, mits een eigen huishouding wordt gevoerd op de datum van de verplaatsing of de indiensttreding en
      de eigen huishouding wordt voortgezet na de verhuizing.
    url: https://wetten.overheid.nl/BWBR0005137/2009-07-01#Artikel11
  - number: '13'
    text: |-
      Indien het bevoegde gezag bij verplaatsing uit, naar en buiten Nederland heeft bepaald dat de militair
      geen gezinsleden op rijkskosten kan meenemen, is de tegemoetkoming in de verhuiskosten, in afwijking van de
      [artikelen 10][ref1] en [11][ref2], gelijk aan de kosten van:


      [ref1]: https://wetten.overheid.nl/BWBR0005137#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0005137#Artikel11
    url: https://wetten.overheid.nl/BWBR0005137/2009-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0005137
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0005137
        artikel: '11'
  - number: 13.a
    text: |-
      het transport van de bagage, welke bij een verplaatsing over zee is beperkt tot ten hoogste de kosten van het
      vervoer per schip van een hoeveelheid van 1 m3;
    url: https://wetten.overheid.nl/BWBR0005137/2009-07-01#Artikel13
  - number: 13.b
    text: |-
      de verschuldigde invoerrechten alsmede de verzekering van die bagage tegen schade tengevolge van of in verband met
      het transport;
    url: https://wetten.overheid.nl/BWBR0005137/2009-07-01#Artikel13
  - number: 13.c
    text: |-
      de reizen die in het land van vertrek worden gemaakt ter voldoening aan een oproep tot het vervullen van
      formaliteiten, vereist in verband met de reis.
    url: https://wetten.overheid.nl/BWBR0005137/2009-07-01#Artikel13
  - number: '14'
    text: |-
      De tegemoetkoming in de reis- en verblijfkosten, bedoeld in de [artikelen 10][ref1] en [11][ref2], wordt bepaald
      aan de hand van het gestelde bij of krachtens het [Besluit dienstreizen defensie][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005137#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0005137#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0007956
    url: https://wetten.overheid.nl/BWBR0005137/2009-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0005137
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0005137
        artikel: '11'
      - id: ref3
        bwb_id: BWBR0007956
  - number: '15.1'
    text: |-
      Onder de transportkosten, bedoeld in de [artikelen 10][ref1] en [11][ref2], worden bij een verhuizing binnen
      Nederland verstaan de kosten van:


      [ref1]: https://wetten.overheid.nl/BWBR0005137#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0005137#Artikel11
    url: https://wetten.overheid.nl/BWBR0005137/2009-07-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005137
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0005137
        artikel: '11'
  - number: 15.1.a
    text: het transport van de inboedel en de bagage van de militair en de medeverhuizende gezinsleden;
    url: https://wetten.overheid.nl/BWBR0005137/2009-07-01#Artikel15
  - number: 15.1.b
    text: het in- en uitpakken van de inboedel alsmede het (de)monteren van het meubilair;
    url: https://wetten.overheid.nl/BWBR0005137/2009-07-01#Artikel15
  - number: 15.1.c
    text: de verzekering van de inboedel en de bagage tegen schade ten gevolge van of in verband met de verhuizing.
    url: https://wetten.overheid.nl/BWBR0005137/2009-07-01#Artikel15
  - number: '15.2'
    text: |-
      Onder de transportkosten, bedoeld in [artikel 10][ref1] en [11][ref2], worden bij een verhuizing van, naar of in
      het buitenland verstaan de kosten van:


      [ref1]: https://wetten.overheid.nl/BWBR0005137#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0005137#Artikel11
    url: https://wetten.overheid.nl/BWBR0005137/2009-07-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005137
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0005137
        artikel: '11'
  - number: 15.2.a
    text: |-
      het transport van de inboedel van de militair en de medeverhuizende gezinsleden; de tegemoetkoming is echter bij
      verhuizingen van en naar een land gelegen buiten Europa met uitzondering van Kreta, beperkt tot de kosten van het
      vervoer van een 20-voets container;
    url: https://wetten.overheid.nl/BWBR0005137/2009-07-01#Artikel15
  - number: 15.2.b
    text: het in- en uitpakken van de inboedel alsmede het (de)monteren van meubilair en de afvoer van emballage;
    url: https://wetten.overheid.nl/BWBR0005137/2009-07-01#Artikel15
  - number: 15.2.c
    text: |-
      de opslag en het transport van de in Nederland achtergelaten inboedel voor zover het een verhuizing betreft naar
      een land gelegen buiten Europa met uitzondering van Kreta;
    url: https://wetten.overheid.nl/BWBR0005137/2009-07-01#Artikel15
  - number: 15.2.d
    text: |-
      het transport van de bagage van de militair en de gezinsleden; de tegemoetkoming wordt in geval van transport per
      vliegtuig - onverminderd de vrijdom van vracht - beperkt tot 20 kg per persoon;
    url: https://wetten.overheid.nl/BWBR0005137/2009-07-01#Artikel15
  - number: 15.2.e
    text: de verschuldigde invoerrechten bij invoer van de bagage en de inboedel;
    url: https://wetten.overheid.nl/BWBR0005137/2009-07-01#Artikel15
  - number: 15.2.f
    text: |-
      de verzekering van de bagage en de inboedel tegen schade ten gevolge van of in verband met de verhuizing alsmede de
      verzekering van de inboedel in geval van opslag;
    url: https://wetten.overheid.nl/BWBR0005137/2009-07-01#Artikel15
  - number: 15.2.g
    text: |-
      het transport van één personenauto of motorrijwiel indien het betreft een verplaatsing naar een land buiten Europa
      en terug;
    url: https://wetten.overheid.nl/BWBR0005137/2009-07-01#Artikel15
  - number: 15.2.h
    text: |-
      de aanschaf ter plaatse van een personenauto, indien bij een verplaatsing naar de Nederlandse Antillen, Aruba,
      de Verenigde Staten van Amerika of Canada geen kosten als bedoeld onder *g* in rekening worden gebracht; de
      tegemoetkoming bedraagt in dat geval US $ 600.
    url: https://wetten.overheid.nl/BWBR0005137/2009-07-01#Artikel15
  - number: '15.3'
    text: |-
      Het bevoegde gezag kan, indien de uitoefening van de functie zulks naar zijn oordeel vereist of om reden van
      doelmatigheid, afwijken van de beperking bedoeld in het tweede lid, onder *a*, tot maximaal het vervoer van een 40-
      voets container.
    url: https://wetten.overheid.nl/BWBR0005137/2009-07-01#Artikel15
  - number: '15.4'
    text: |-
      Het bevoegde gezag kan één of meer transportondernemers aanwijzen ter verzorging van het transport, bedoeld in het
      eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0005137/2009-07-01#Artikel15
  - number: '16'
    text: |-
      De tegemoetkoming in de dubbele woonlasten, bedoeld in [artikel 10][ref1], wordt vastgesteld met inachtneming van
      bij ministeriële regeling te stellen regels.


      [ref1]: https://wetten.overheid.nl/BWBR0005137#Artikel10
    url: https://wetten.overheid.nl/BWBR0005137/2009-07-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0005137
        artikel: '10'
  - number: '17'
    text: |-
      De tegemoetkoming in de kosten van de tussenpersoon, bedoeld in [artikel 10][ref1], wordt toegekend indien
      inschakeling van een tussenpersoon naar het oordeel van het bevoegde gezag voor het Rijk tot aanmerkelijk voordeel
      leidt.


      [ref1]: https://wetten.overheid.nl/BWBR0005137#Artikel10
    url: https://wetten.overheid.nl/BWBR0005137/2009-07-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0005137
        artikel: '10'
  - number: '18'
    text: |-
      De tegemoetkoming in de overige kosten, bedoeld in de [artikelen 10][ref1] en [11][ref2], is gelijk aan 12% van de
      berekeningsbasis met een minimum van € 2 268,90 en een maximum van € 5 445.


      [ref1]: https://wetten.overheid.nl/BWBR0005137#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0005137#Artikel11
    url: https://wetten.overheid.nl/BWBR0005137/2009-07-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0005137
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0005137
        artikel: '11'
  - number: '19.1'
    text: |-
      De militair heeft aanspraak op een tegemoetkoming in de kosten van het dagelijks reizen over de afstand tussen de
      woning en de plaats van tewerkstelling, indien:
    url: https://wetten.overheid.nl/BWBR0005137/2009-07-01#Artikel19
  - number: 19.1.a
    text: de te reizen afstand meer dan 10 kilometer bedraagt, en
    url: https://wetten.overheid.nl/BWBR0005137/2009-07-01#Artikel19
  - number: 19.1.b
    text: hij een eigen huishouding voert, en
    url: https://wetten.overheid.nl/BWBR0005137/2009-07-01#Artikel19
  - number: 19.1.c
    text: hij dagelijks reist.
    url: https://wetten.overheid.nl/BWBR0005137/2009-07-01#Artikel19
  - number: '19.2'
    text: |-
      Aan de militair die dagelijks met het openbaar vervoer reist, kan door Defensie een openbaar vervoerbewijs
      verstrekt worden. Deze militair maakt alsdan geen aanspraak op de in het eerste lid bedoelde tegemoetkoming en kan
      hiervoor een bedrag in rekening worden gebracht.
    url: https://wetten.overheid.nl/BWBR0005137/2009-07-01#Artikel19
  - number: '20'
    text: |-
      De militair heeft aanspraak op een tegemoetkoming in de kosten van het niet dagelijks reizen over de afstand tussen
      de woning en de plaats van tewerkstelling, indien hij een eigen huishouding voert en niet dagelijks reist, van:
    url: https://wetten.overheid.nl/BWBR0005137/2009-07-01#Artikel20
  - number: 20.a
    text: |-
      vier maal per periode van vier weken, indien de plaats van tewerkstelling in Nederland, België of Duitsland en de
      woning in Nederland, België of Duitsland is gelegen;
    url: https://wetten.overheid.nl/BWBR0005137/2009-07-01#Artikel20
  - number: 20.b
    text: |-
      vier maal per periode van vier weken, indien de plaats van tewerkstelling en de woning beide in Nederland zijn
      gelegen en hij verplicht huisvesting van rijkswege ontvangt;
    url: https://wetten.overheid.nl/BWBR0005137/2009-07-01#Artikel20
  - number: 20.c
    text: |-
      eenmaal per periode van twee weken, indien de plaats van tewerkstelling en de woning beide in Europa zijn gelegen,
      terwijl a of b niet van toepassing is;
    url: https://wetten.overheid.nl/BWBR0005137/2009-07-01#Artikel20
  - number: 20.d
    text: eenmaal per plaatsingsperiode van negen maanden, indien de plaats van tewerkstelling buiten Europa is gelegen.
    url: https://wetten.overheid.nl/BWBR0005137/2009-07-01#Artikel20
  - number: '21'
    text: |-
      De militair die geen eigen huishouding voert, heeft aanspraak op een tegemoetkoming in de kosten van het reizen
      over de afstand tussen zijn woning en de plaats van tewerkstelling:
    url: https://wetten.overheid.nl/BWBR0005137/2009-07-01#Artikel21
  - number: 21.a
    text: eenmaal per twee weken, indien de woning en de plaats van tewerkstelling zijn gelegen in Nederland, òf
    url: https://wetten.overheid.nl/BWBR0005137/2009-07-01#Artikel21
  - number: 21.b
    text: |-
      eenmaal per vier weken, indien de woning en de plaats van tewerkstelling zijn gelegen in Europa, terwijl het
      gestelde onder a niet van toepassing is, òf
    url: https://wetten.overheid.nl/BWBR0005137/2009-07-01#Artikel21
  - number: 21.c
    text: eenmaal per plaatsingsperiode van negen maanden, indien de plaats van tewerkstelling is gelegen buiten Europa.
    url: https://wetten.overheid.nl/BWBR0005137/2009-07-01#Artikel21
  - number: '22.1'
    text: |-
      De militair, die met toekenning van een tegemoetkoming in de verhuiskosten is verhuisd naar een buiten Europa
      gelegen land, heeft, indien de duur van de plaatsing is gesteld voor een periode langer dan twee jaren, gedurende
      de plaatsingstermijn eenmaal per periode van twee jaren aanspraak op een tegemoetkoming in de kosten van het reizen
      tussen de woning in het buitenland en een plaats naar keuze in Nederland voor zichzelf en voor de eveneens in het
      land van plaatsing gevestigde gezinsleden.
    url: https://wetten.overheid.nl/BWBR0005137/2009-07-01#Artikel22
  - number: '22.2'
    text: |-
      De militair die met toekenning van een tegemoetkoming in de verhuiskosten is verhuisd naar een land gelegen buiten
      Europa te zamen met een of meer gezinsleden heeft - indien de duur van de plaatsing is gesteld op ten minste
      twee jaren - ter zake van gezinshereniging met een achtergebleven kind, voor dat kind, hemzelf of één van zijn
      gezinsleden, eenmaal per plaatsingsperiode van 12 maanden aanspraak op een tegemoetkoming in de kosten van het
      reizen tussen de woonplaats van het kind en de woonplaats van de militair buiten Europa.
    url: https://wetten.overheid.nl/BWBR0005137/2009-07-01#Artikel22
  - number: '23'
    text: |-
      De militair die aanspraak heeft op een tegemoetkoming, bedoeld in [artikel 20, onderdeel a][ref1], heeft eveneens
      aanspraak op een tegemoetkoming in de kosten van het dagelijks reizen voor de tussen de plaats van legering en de
      plaats van tewerkstelling af te leggen afstand, indien de te reizen afstand meer dan 10 kilometer bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0005137#Artikel20
    url: https://wetten.overheid.nl/BWBR0005137/2009-07-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0005137
        artikel: '20'
  - number: '24.1'
    text: |-
      Het bevoegde gezag kan bepalen dat de militair die de mogelijkheid heeft om te reizen met van rijkswege ingezet
      vervoer, in afwijking van de [artikelen 19 tot en met 23][ref1], geen aanspraak heeft op de in die artikelen
      bedoelde tegemoetkoming.


      [ref1]: https://wetten.overheid.nl/BWBR0005137#Artikel19
    url: https://wetten.overheid.nl/BWBR0005137/2009-07-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0005137
        artikel: '19'
  - number: '24.2'
    text: |-
      De militair die op grond van het eerste lid geen aanspraak heeft op een tegemoetkoming in de kosten van het
      dagelijks reizen voor de tussen de woning of de plaats van legering en de plaats van tewerkstelling af te leggen
      afstand is, indien gebruik wordt gemaakt van het van rijkswege ingezette vervoer, een door het bevoegde gezag te
      bepalen bijdrage verschuldigd.
    url: https://wetten.overheid.nl/BWBR0005137/2009-07-01#Artikel24
  - number: '25.1'
    text: |-
      De tegemoetkomingen, bedoeld in de [artikelen 19 tot en met 23][ref1], worden vastgesteld volgens nader door de
      minister te stellen regels.


      [ref1]: https://wetten.overheid.nl/BWBR0005137#Artikel19
    url: https://wetten.overheid.nl/BWBR0005137/2009-07-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0005137
        artikel: '19'
  - number: '25.2'
    text: |-
      Van de bevoegdheid tot het vaststellen van ministeriële regelingen als bedoeld in het eerste lid kan mandaat worden
      verleend aan de hoofddirecteur personeel van het Ministerie van Defensie.
    url: https://wetten.overheid.nl/BWBR0005137/2009-07-01#Artikel25
  - number: '26.1'
    text: |-
      Indien ook de echtgenote van de militair ingevolge dit besluit aanspraak kan maken op de tegemoetkomingen bedoeld
      in de [artikelen 9 tot en met 18][ref1] worden deze tegemoetkomingen slechts toegekend aan diegene die ingevolge
      het gestelde in [artikel 18][ref2] aanspraak heeft op de hoogste tegemoetkoming.


      [ref1]: https://wetten.overheid.nl/BWBR0005137#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0005137#Artikel18
    url: https://wetten.overheid.nl/BWBR0005137/2009-07-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0005137
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0005137
        artikel: '18'
  - number: '26.2'
    text: |-
      Indien de militair uit anderen hoofde reeds in enigerlei vorm aanspraak heeft op vergoedingen voor de in de
      [artikelen 9 tot en met 18][ref1] van dit besluit genoemde kosten, worden deze aanspraken in mindering gebracht op
      de tegemoetkomingen in deze kosten ingevolge dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0005137#Artikel9
    url: https://wetten.overheid.nl/BWBR0005137/2009-07-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0005137
        artikel: '9'
  - number: '26.3'
    text: |-
      Indien de militair aanspraak heeft op tegemoetkomingen ingevolge dit besluit en zijn echtgenote ontvangt anders
      dan op grond van dit besluit vergoedingen voor de in de [artikelen 9 tot en met 18][ref1] van dit besluit genoemde
      kosten, dan worden deze vergoedingen in mindering gebracht op de tegemoetkomingen van de militair.


      [ref1]: https://wetten.overheid.nl/BWBR0005137#Artikel9
    url: https://wetten.overheid.nl/BWBR0005137/2009-07-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0005137
        artikel: '9'
  - number: '27'
    text: |-
      De aanvraag voor een tegemoetkoming in de verhuiskosten dient binnen een door het bevoegde gezag te bepalen termijn
      te zijn ingediend.
    url: https://wetten.overheid.nl/BWBR0005137/2009-07-01#Artikel27
  - number: '28'
    text: |-
      Het bevoegde gezag kan voor zover nodig in afwijking van de bij of krachtens dit besluit gestelde regelen beslissen
      in individuele gevallen, waarin deze regelen naar zijn oordeel niet of niet in redelijkheid voorzien.
    url: https://wetten.overheid.nl/BWBR0005137/2009-07-01#Artikel28
  - number: '29'
    text: |-
      Het Verplaatsingskostenbesluit 1962 houdt op de datum dat dit besluit in werking treedt op te gelden voor de
      militair.
    url: https://wetten.overheid.nl/BWBR0005137/2009-07-01#Artikel29
  - number: '30.1'
    text: |-
      De militair met een plaats van tewerkstelling in Nederland, Belgie of Duitsland en de woning in Nederland, Belgie
      of Duitsland, die – louter in verband met de periode doorgebracht in de plaats van tewerkstelling – inmiddels één
      maal per twee weken aanspraak heeft op een vergoeding in de kosten van het niet dagelijks reizen, heeft met ingang
      van 1 oktober 2007 aanspraak op de vergoeding als bedoeld in [artikel 20, onderdeel a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005137#Artikel20
    url: https://wetten.overheid.nl/BWBR0005137/2009-07-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0005137
        artikel: '20'
  - number: '30.2'
    text: |-
      Voor de militair die vóór 1 oktober 2006 is verplaatst naar Turkije, Kreta of IJsland zijn het
      [eerste en tweede lid van artikel 22][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005137#Artikel22
    url: https://wetten.overheid.nl/BWBR0005137/2009-07-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0005137
        artikel: '22'
  - number: '31'
    text: Dit besluit treedt in werking op een nader bij koninklijk besluit te bepalen datum.
    url: https://wetten.overheid.nl/BWBR0005137/2009-07-01#Artikel31
  - number: '32'
    text: Dit besluit wordt aangehaald als "Verplaatsingskostenbesluit militairen".
    url: https://wetten.overheid.nl/BWBR0005137/2009-07-01#Artikel32
