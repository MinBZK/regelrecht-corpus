        artikel: '11'
  - number: '14'
    text: |-
      De tegemoetkoming in de reis- en verblijfkosten, bedoeld in de [artikelen 10][ref1], [11][ref2] en [12][ref3],
      wordt bepaald aan de hand van het gestelde bij of krachtens het [Besluit dienstreizen defensie](onbekend).


      [ref1]: https://wetten.overheid.nl/BWBR0005137#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0005137#Artikel11
