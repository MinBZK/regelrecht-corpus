    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Defensie van 1 februari 1991, Afdeling arbeidsvoorwaardenbeleid, nr. D
    91/099/2198;

    Gelet op artikel 12 van de Militaire Ambtenarenwet 1931 (Stb. 519) en artikel 125 van de Ambtenarenwet 1929 (Stb.
    530);

    De Raad van State gehoord (advies van 22 mei 1991, nr. W07.91.0062);

    Gezien het nader rapport van de voornoemde Minister van 3 juli 1991, nr. D 91/099/2917;

    Hebben goedgevonden en verstaan:
