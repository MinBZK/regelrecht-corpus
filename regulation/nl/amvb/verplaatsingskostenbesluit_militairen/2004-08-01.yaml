    text: |-
      1 De militair die ingevolge een op grond van [artikel 143 van het Algemeen militair ambtenarenreglement][ref1]
      opgelegde verplichting verhuist naar een nader door het bevoegd gezag aangegeven plaats of gebied, heeft aanspraak
      op een tegemoetkoming in de verhuiskosten, mits de verhuizing plaatsvindt uiterlijk twee jaren na de datum waarop
      de verplichting is opgelegd.

      2 De militair, bedoeld in het eerste lid, die is verhuisd en van de in het eerste lid bedoelde verplichting wordt
      ontheven, heeft aanspraak op een tegemoetkoming in de verhuiskosten, mits de verhuizing plaatsvindt binnen twee
      jaren na de ontheffing.

      3 De militair die bij verplaatsing verhuist naar het woongebied van zijn nieuwe standplaats omdat hij naar zijn
      oordeel niet dagelijks heen en weer kan reizen, heeft aanspraak op een tegemoetkoming in de verhuiskosten mits de
      verhuizing plaatsvindt binnen twee jaren na de datum van de verplaatsing, dan wel binnen zes maanden voor de datum
      van zijn verplaatsing en indien door de verhuizing de reisafstand tussen de woning en de plaats van tewerkstelling
      met ten minste 50% wordt bekort.

      4 Het bevoegd gezag kan de militair die bij indiensttreding een eigen huishouding voert, eenmalig aanspraak
      verlenen op een tegemoetkoming in de verhuiskosten mits de verhuizing plaatsvindt binnen twee jaren na de datum van
      de indiensttreding.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel143
    url: https://wetten.overheid.nl/BWBR0005137/2004-08-01#Artikel2
