        artikel: '7'
  - number: '9'
    text: |-
      1 De militair die aanspraak heeft op een tegemoetkoming in de verhuiskosten en samen met zijn gezinsleden
      naar, of in een buiten Nederland gelegen gebied, dan wel naar Nederland verhuist, heeft aanspraak op tijdelijke
      onderbrenging van hemzelf en zijn gezinsleden indien:

      a. hij ten gevolge van de verscheping van de inboedel daarover niet kan beschikken;

      b. hij nog niet over een woning kan beschikken.

      2 Indien de militair buiten Nederland blijft geplaatst, maar zijn gezinsleden naar Nederland terugkeren, wordt
      onder toepassing van de voorwaarden bedoeld in het eerste lid, aanspraak verleend op tijdelijke onderbrenging van
      zijn gezinsleden.

      3 Indien niet over de woning, bedoeld in het eerste lid, onder b, kan worden beschikt, zijn de eventuele kosten
      van opslag van de inboedel voor rekening van het Rijk. Deze aanspraak bestaat eveneens voor de militair zonder
      gezinsleden met aanspraak op een tegemoetkoming in de verhuiskosten die naar of in een buiten Nederland gelegen
      gebied dan wel naar Nederland verhuist.

      4 Teneinde de duur van de aanspraak te beperken is de militair gehouden al het mogelijke te doen om een woning
      te verkrijgen.

      5 Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent de duur, de aard, de kosten en de eigen
      bijdrage van de tijdelijke onderbrenging als mede de opslag van de inboedel.
    url: https://wetten.overheid.nl/BWBR0005137/2004-08-01#Artikel9
  - number: '10'
    text: |-
      Ten aanzien van verhuizingen als bedoeld in [artikel 2, eerste lid][ref1], is de tegemoetkoming in de verhuiskosten
      gelijk aan een tegemoetkoming in:

      a. de reis- en verblijfkosten binnen Nederland die voor de militair en zijn echtgenote zijn verbonden aan één reis
      ter bezichtiging van woonruimte;

      b. de reis- en verblijfkosten die voor de militair en zijn gezinsleden zijn verbonden aan de reis naar de nieuwe
      woning;

      c. de transportkosten;

      d. de dubbele woonlasten;

      e. de kosten van de tussenpersoon, voor zover deze in rekening wordt gebracht ter verwerving van een huurwoning;

      f. overige kosten, mits een eigen huishouding wordt gevoerd op de datum van de verplaatsing of de indiensttreding
      en de eigen huishouding wordt voorgezet na de verhuizing.


      [ref1]: https://wetten.overheid.nl/BWBR0005137#Artikel2
    url: https://wetten.overheid.nl/BWBR0005137/2004-08-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0005137
        artikel: '2'
  - number: '11'
    text: |-
      Ten aanzien van verhuizingen anders dan als bedoeld in [artikel 2, eerste lid][ref1], is de tegemoetkoming in de
      verhuiskosten gelijk aan een tegemoetkoming in:

      a. de reis- en verblijfkosten die voor de militair en zijn gezin zijn verbonden aan de reis naar de nieuwe woning,
      mits het een verhuizing betreft van, naar of in een buiten Nederland gelegen land;

      b. transportkosten;

      c. overige kosten, mits een eigen huishouding wordt gevoerd op de datum van de verplaatsing of de indiensttreding
      en de eigen huishouding wordt voortgezet na de verhuizing.


      [ref1]: https://wetten.overheid.nl/BWBR0005137#Artikel2
    url: https://wetten.overheid.nl/BWBR0005137/2004-08-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0005137
        artikel: '2'
  - number: '13'
    text: |-
      Indien het bevoegde gezag bij verplaatsing uit, naar en buiten Nederland heeft bepaald dat de militair
      geen gezinsleden op rijkskosten kan meenemen, is de tegemoetkoming in de verhuiskosten, in afwijking van de
      [artikelen 10][ref1] en [11][ref2], gelijk aan de kosten van:

      a. het transport van de bagage, welke bij een verplaatsing over zee is beperkt tot ten hoogste de kosten van het
      vervoer per schip van een hoeveelheid van 1 m3;

      b. de verschuldigde invoerrechten alsmede de verzekering van die bagage tegen schade tengevolge van of in verband
      met het transport;

      c. de reizen die in het land van vertrek worden gemaakt ter voldoening aan een oproep tot het vervullen van
      formaliteiten, vereist in verband met de reis.


      [ref1]: https://wetten.overheid.nl/BWBR0005137#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0005137#Artikel11
    url: https://wetten.overheid.nl/BWBR0005137/2004-08-01#Artikel13
    references:
