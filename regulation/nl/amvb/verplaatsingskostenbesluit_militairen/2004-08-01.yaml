  - number: '15'
    text: |-
      1 Onder de transportkosten, bedoeld in de [artikelen 10][ref1] en [11][ref2], worden bij een verhuizing binnen
      Nederland verstaan de kosten van:

      a. het transport van de inboedel en de bagage van de militair en de medeverhuizende gezinsleden;

      b. het in- en uitpakken van de inboedel alsmede het (de)monteren van het meubilair;

      c. de verzekering van de inboedel en de bagage tegen schade ten gevolge van of in verband met de verhuizing.

      2 Onder de transportkosten, bedoeld in [artikel 10][ref3] en [11][ref4], worden bij een verhuizing van, naar of in
      het buitenland verstaan de kosten van:

      a. het transport van de inboedel van de militair en de medeverhuizende gezinsleden; de tegemoetkoming is echter bij
      verhuizingen van en naar een land gelegen buiten Europa met uitzondering van Kreta, beperkt tot de kosten van het
      vervoer van een 20-voets container;

      b. het in- en uitpakken van de inboedel alsmede het (de)monteren van meubilair en de afvoer van emballage;

      c. de opslag en het transport van de in Nederland achtergelaten inboedel voor zover het een verhuizing betreft naar
      een land gelegen buiten Europa met uitzondering van Kreta;

      d. het transport van de bagage van de militair en de gezinsleden; de tegemoetkoming wordt in geval van transport
      per vliegtuig - onverminderd de vrijdom van vracht - beperkt tot 20 kg per persoon;

      e. de verschuldigde invoerrechten bij invoer van de bagage en de inboedel;

      f. de verzekering van de bagage en de inboedel tegen schade ten gevolge van of in verband met de verhuizing alsmede
      de verzekering van de inboedel in geval van opslag;

      g. het transport van één personenauto of motorrijwiel indien het betreft een verplaatsing naar een land buiten
      Europa en terug;

      h. de aanschaf ter plaatse van een personenauto, indien bij een verplaatsing naar de Nederlandse Antillen, Aruba,
      de Verenigde Staten van Amerika of Canada geen kosten als bedoeld onder *g* in rekening worden gebracht; de
      tegemoetkoming bedraagt in dat geval US $ 600.

      3 Het bevoegde gezag kan, indien de uitoefening van de functie zulks naar zijn oordeel vereist of om reden van
      doelmatigheid, afwijken van de beperking bedoeld in het tweede lid, onder *a*, tot maximaal het vervoer van een 40-
      voets container.

      4 Het bevoegde gezag kan één of meer transportondernemers aanwijzen ter verzorging van het transport, bedoeld in
      het eerste en tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005137#Artikel10
