        artikel: '10'
  - number: '17'
    text: |-
      De tegemoetkoming in de kosten van de tussenpersoon, bedoeld in [artikel 10][ref1], wordt toegekend indien
      inschakeling van een tussenpersoon naar het oordeel van het bevoegde gezag voor het Rijk tot aanmerkelijk voordeel
      leidt.


      [ref1]: https://wetten.overheid.nl/BWBR0005137#Artikel10
    url: https://wetten.overheid.nl/BWBR0005137/2004-08-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0005137
        artikel: '10'
  - number: '18'
    text: |-
      De tegemoetkoming in de overige kosten, bedoeld in de [artikelen 10][ref1] en [11][ref2], is gelijk aan 12% van de
      berekeningsbasis met een minimum van € 2 268,90 en een maximum van € 5 445.


      [ref1]: https://wetten.overheid.nl/BWBR0005137#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0005137#Artikel11
    url: https://wetten.overheid.nl/BWBR0005137/2004-08-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0005137
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0005137
        artikel: '11'
  - number: '19'
    text: |-
      De militair heeft aanspraak op een tegemoetkoming in de kosten van het dagelijks reizen over de afstand tussen de
      woning en de plaats van tewerkstelling, indien:

      a. de te reizen afstand meer dan 10 kilometer bedraagt, en

      b. hij een eigen huishouding voert, en

      c. hij dagelijks reist.
    url: https://wetten.overheid.nl/BWBR0005137/2004-08-01#Artikel19
  - number: '20'
    text: |-
      De militair heeft aanspraak op een tegemoetkoming in de kosten van het niet dagelijks reizen over de afstand tussen
      de woning en de plaats van tewerkstelling, indien hij een eigen huishouding voert en niet dagelijks reist, van:

      a. vier maal per vier weken voor een periode van maximaal drie jaren, vanaf de datum dat hij aanspraak heeft op
      een tegemoetkoming in de verhuiskosten, indien de woning in Nederland is gelegen en de plaats van tewerkstelling in
      Nederland, België of Duitsland is gelegen;

      b. vier maal per vier weken, indien de woning en de plaats van tewerkstelling beide in Nederland zijn gelegen en
      hij verplicht huisvesting van rijkswege ontvangt;

      c. eenmaal per twee weken, indien de woning en de plaats van tewerkstelling zijn gelegen in Europa, terwijl het
      gestelde onder a of b niet van toepassing is;

      d. eenmaal per plaatsingsperiode van negen maanden, indien de plaats van tewerkstelling is gelegen buiten Europa.
    url: https://wetten.overheid.nl/BWBR0005137/2004-08-01#Artikel20
  - number: '21'
    text: |-
      De militair die geen eigen huishouding voert, heeft aanspraak op een tegemoetkoming in de kosten van het reizen
      over de afstand tussen zijn woning en de plaats van tewerkstelling:

      a. eenmaal per twee weken, indien de woning en de plaats van tewerkstelling zijn gelegen in Nederland, òf

      b. eenmaal per vier weken, indien de woning en de plaats van tewerkstelling zijn gelegen in Europa, terwijl het
      gestelde onder a niet van toepassing is, òf

      c. eenmaal per plaatsingsperiode van negen maanden, indien de plaats van tewerkstelling is gelegen buiten Europa.
    url: https://wetten.overheid.nl/BWBR0005137/2004-08-01#Artikel21
  - number: '22'
    text: |-
      1 De militair, die met toekenning van een tegemoetkoming in de verhuiskosten is verhuisd naar een buiten Europa
      gelegen land, heeft, indien de duur van de plaatsing is gesteld voor een periode langer dan twee jaren, gedurende
      de plaatsingstermijn eenmaal per periode van twee jaren aanspraak op een tegemoetkoming in de kosten van het reizen
      tussen de woning in het buitenland en een plaats naar keuze in Nederland voor zichzelf en voor de eveneens in het
      land van plaatsing gevestigde gezinsleden.

      2 De militair die met toekenning van een tegemoetkoming in de verhuiskosten is verhuisd naar een land gelegen
      buiten Europa te zamen met een of meer gezinsleden heeft - indien de duur van de plaatsing is gesteld op ten minste
      twee jaren - ter zake van gezinshereniging met een achtergebleven kind, voor dat kind, hemzelf of één van zijn
      gezinsleden, eenmaal per plaatsingsperiode van 12 maanden aanspraak op een tegemoetkoming in de kosten van het
      reizen tussen de woonplaats van het kind en de woonplaats van de militair buiten Europa.
    url: https://wetten.overheid.nl/BWBR0005137/2004-08-01#Artikel22
  - number: '23'
    text: |-
      De militair die aanspraak heeft op een tegemoetkoming, bedoeld in [artikel 20, onderdeel a][ref1], heeft eveneens
      aanspraak op een tegemoetkoming in de kosten van het dagelijks reizen voor de tussen de plaats van legering en de
      plaats van tewerkstelling af te leggen afstand, indien de te reizen afstand meer dan 10 kilometer bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0005137#Artikel20
    url: https://wetten.overheid.nl/BWBR0005137/2004-08-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0005137
        artikel: '20'
  - number: '24'
    text: |-
      1 Het bevoegde gezag kan bepalen dat de militair die de mogelijkheid heeft om te reizen met van rijkswege ingezet
      vervoer, in afwijking van de [artikelen 19 tot en met 23][ref1], geen aanspraak heeft op de in die artikelen
      bedoelde tegemoetkoming.

      2 De militair die op grond van het eerste lid geen aanspraak heeft op een tegemoetkoming in de kosten van het
      dagelijks reizen voor de tussen de woning of de plaats van legering en de plaats van tewerkstelling af te leggen
      afstand is, indien gebruik wordt gemaakt van het van rijkswege ingezette vervoer, een door het bevoegde gezag te
      bepalen bijdrage verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0005137#Artikel19
    url: https://wetten.overheid.nl/BWBR0005137/2004-08-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0005137
        artikel: '19'
  - number: '25'
    text: |-
      1 De tegemoetkomingen, bedoeld in de [artikelen 19 tot en met 23][ref1], worden vastgesteld volgens nader door de
      minister te stellen regels.

      2 Van de bevoegdheid tot het vaststellen van ministeriële regelingen als bedoeld in het eerste lid kan mandaat
      worden verleend aan de directeur-generaal personeel en materieel van het Ministerie van Defensie.


      [ref1]: https://wetten.overheid.nl/BWBR0005137#Artikel19
    url: https://wetten.overheid.nl/BWBR0005137/2004-08-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0005137
        artikel: '19'
  - number: '26'
    text: |-
      1 Indien ook de echtgenote van de militair ingevolge dit besluit aanspraak kan maken op de tegemoetkomingen bedoeld
      in de [artikelen 9 tot en met 18][ref1] worden deze tegemoetkomingen slechts toegekend aan diegene die ingevolge
      het gestelde in [artikel 18][ref2] aanspraak heeft op de hoogste tegemoetkoming.

      2 Indien de militair uit anderen hoofde reeds in enigerlei vorm aanspraak heeft op vergoedingen voor de in de
      [artikelen 9 tot en met 18][ref3] van dit besluit genoemde kosten, worden deze aanspraken in mindering gebracht op
      de tegemoetkomingen in deze kosten ingevolge dit besluit.

      3 Indien de militair aanspraak heeft op tegemoetkomingen ingevolge dit besluit en zijn echtgenote ontvangt anders
      dan op grond van dit besluit vergoedingen voor de in de [artikelen 9 tot en met 18][ref4] van dit besluit genoemde
      kosten, dan worden deze vergoedingen in mindering gebracht op de tegemoetkomingen van de militair.


      [ref1]: https://wetten.overheid.nl/BWBR0005137#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0005137#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0005137#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0005137#Artikel9
    url: https://wetten.overheid.nl/BWBR0005137/2004-08-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0005137
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0005137
        artikel: '18'
      - id: ref3
        bwb_id: BWBR0005137
        artikel: '9'
      - id: ref4
        bwb_id: BWBR0005137
        artikel: '9'
  - number: '27'
    text: |-
      1 De aanvraag voor een tegemoetkoming in de verhuiskosten dient binnen een door het bevoegde gezag te bepalen
      termijn te zijn ingediend.

      2 Het bevoegde gezag kan ter zake van de in dit besluit bedoelde tegemoetkomingen een voorschot verlenen.
    url: https://wetten.overheid.nl/BWBR0005137/2004-08-01#Artikel27
  - number: '28'
    text: |-
      Het bevoegde gezag kan voor zover nodig in afwijking van de bij of krachtens dit besluit gestelde regelen beslissen
      in individuele gevallen, waarin deze regelen naar zijn oordeel niet of niet in redelijkheid voorzien.
    url: https://wetten.overheid.nl/BWBR0005137/2004-08-01#Artikel28
  - number: '29'
    text: |-
      Het Verplaatsingskostenbesluit 1962 houdt op de datum dat dit besluit in werking treedt op te gelden voor de
      militair.
    url: https://wetten.overheid.nl/BWBR0005137/2004-08-01#Artikel29
  - number: '30'
    text: |-
      1 In afwijking van [artikel 20, onderdeel a][ref1], behoudt de militair die aanspraak had op het gestelde in
      [artikel 19, derde lid, onder a][ref2], zoals dit luidde op 31 mei 1999, deze aanspraak uiterlijk tot en met 31
      december 1999.

      2 In afwijking van het gestelde in [artikel 20, onderdeel b][ref3], heeft de militair als bedoeld in het eerste
      lid, vanaf 1 januari 2000 aanspraak op een tegemoetkoming in de kosten van het reizen over de afstand tussen zijn
      woning en de plaats van tewerkstelling van vier maal per vier weken, gedurende de resterende termijn zoals die op
      31 mei 1999 voor hem gold.


      [ref1]: https://wetten.overheid.nl/BWBR0005137#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0005137#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0005137#Artikel20
    url: https://wetten.overheid.nl/BWBR0005137/2004-08-01#Artikel30
