  - number: '3'
    text: |-
      1 De militair die voor het eerst in dienst treedt heeft, in afwijking van [artikel 2][ref1], slechts aanspraak op
      een tegemoetkoming in de verhuiskosten, indien hij schriftelijk heeft ingestemd met een terugbetalingsverplichting
      bij ontslag op aanvraag of op grond van aan hem te wijten feiten of omstandigheden, binnen twee jaren na de
      verhuizing.

      2 Overgang binnen een maand naar een andere functie binnen de rijksdienst wordt niet beschouwd als een ontslag
      op aanvraag als bedoeld in het eerste lid, tenzij de bedoelde militair als gevolg van die overgang opnieuw moet
      verhuizen met aanspraak op een tegemoetkoming in de verhuiskosten.


      [ref1]: https://wetten.overheid.nl/BWBR0005137#Artikel2
    url: https://wetten.overheid.nl/BWBR0005137/2004-08-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005137
        artikel: '2'
  - number: '5'
    text: |-
      De militair die met toekenning van een tegemoetkoming in de verhuiskosten is verhuisd naar een buiten Nederland
      gelegen land of naar een ambts- of dienstwoning en wordt ontslagen heeft aanspraak op een tegemoetkoming in de
      kosten van een verhuizing naar of in Nederland indien het een ontslag betreft:

      a. met recht op een uitkering ingevolge de [Uitkeringswet gewezen militairen][ref1];

      b. met recht op dadelijk ingaand pensioen;

      c. anders dan op eigen aanvraag en niet het gevolg zijnde van aan hem te wijten feiten of omstandigheden.


      [ref1]: https://wetten.overheid.nl/BWBR0002540
    url: https://wetten.overheid.nl/BWBR0005137/2004-08-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002540
  - number: '6'
    text: |-
      Aan de gezinsleden van de militair wordt een tegemoetkoming in de kosten van verhuizing naar of in Nederland
      toegekend, indien de militair komt te overlijden, nadat hij met de gezinsleden onder toekenning van een
      tegemoetkoming in de verhuiskosten is verhuisd naar een buiten Nederland gelegen land of naar een ambts- of
      dienstwoning.
    url: https://wetten.overheid.nl/BWBR0005137/2004-08-01#Artikel6
  - number: '7'
    text: |-
      Indien verhuizing in het belang van de militair of zijn gezinsleden naar het oordeel van de militair geneeskundige
      dienst medisch noodzakelijk is, kan het bevoegde gezag hem aanspraak verlenen op een tegemoetkoming in de
      verhuiskosten.
    url: https://wetten.overheid.nl/BWBR0005137/2004-08-01#Artikel7
  - number: '8'
    text: |-
      De aanspraak op een tegemoetkoming in de verhuiskosten ingevolge de [artikelen 5][ref1], [6][ref2] en [7][ref3]
      vervalt indien de verhuizing niet plaatsvindt binnen één jaar na de datum van het ontslag, het overlijden of de
      datum waarop het bevoegde gezag wegens medische noodzaak aanspraak heeft verleend op een tegemoetkoming in de
      verhuiskosten.


      [ref1]: https://wetten.overheid.nl/BWBR0005137#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005137#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0005137#Artikel7
    url: https://wetten.overheid.nl/BWBR0005137/2004-08-01#Artikel8
