  - number: '16'
    text: |-
      De tegemoetkoming in de dubbele woonlasten, bedoeld in [artikel 10][ref1], wordt, voor zover deze kosten door het
      bevoegde gezag als noodzakelijk worden beoordeeld, toegekend voor een periode van ten hoogste vier maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0005137#Artikel10
    url: https://wetten.overheid.nl/BWBR0005137/2004-08-01#Artikel16
