  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. afstand:

      1° indien er sprake is van een tabeltegemoetkoming : de kortste gebruikelijke reisroute;

      2. indien er geen sprake is van een tabeltegemoetkoming:

      a. bij gebruik van openbaar vervoer:

      de kortste gebruikelijke reisroute;

      b. bij gebruik van ander vervoer dan openbaar vervoer:

      het aantal kilometers gemeten langs de kortste gebruikelijke openbare weg;

      tussen de woning of de plaats van legering en de plaats van tewerkstelling; bij meer dan één plaats van
      tewerkstelling die zich niet binnen één complex of terrein bevinden geldt de grootste afstand;

      b. ambts- of dienstwoning:

      de door het bevoegde gezag aan de militair in verband met de uitoefening van zijn functie toegewezen woning;

      c. achtergebleven kind:

      het buiten het land van plaatsing verblijf houdende ongehuwde kind van de militair, dat minderjarig
      is of waarvoor aanspraak bestaat op kinderbijslag dan wel op studiefinanciering in de zin van de
      [Wet studiefinanciering 2000][ref1] ; het kind wordt geacht minderjarig te zijn tot en met 31 december van het
      kalenderjaar waarin het de leeftijd van 18 jaar bereikt;

      d. berekeningsbasis:

      de tot een jaarbedrag te herleiden inkomstenbestanddelen, die deel uitmaken van de berekeningsgrondslag voor
      pensioenen ingevolge de bij of krachtens de [Kaderwet militaire pensioenen][ref2] vastgestelde regelingen, die de
      militair op het berekeningstijdstip geniet bij verhuizing naar of in een gebied buiten Nederland, te verhogen met
      de toelage buitenland;

      e. berekeningstijdstip:

      de datum waarop de verhuizing aanvangt, met dien verstande dat daarvoor geldt:

      1. bij verhuizing vooruitlopend op een verplaatsing: de datum van de verplaatsing;

      2. bij overlijden of ontslag van de militair: de datum waarop laatstelijk bezoldiging werd genoten;

      f. bevoegd gezag: de bij ministeriële regeling aan te wijzen functionarissen;

      g. detachering:

      verandering van de standplaats die naar het oordeel van het bevoegde gezag een tijdelijk karakter heeft;

      h. een eigen huishouding voeren: het zelfstandig bewonen van woonruimte, anders dan bij de eigen, stief- of
      pleegouders van de militair of van zijn echtgenote, voorzien van eigen meubilair en stoffering;

      i. Europa:

      Europa, met uitzondering van Kreta en IJsland;

      j. gezinsleden: de echtgenote van de militair en de eigen, stief- of pleegkinderen van de militair zelf of van zijn
      echtgenote, voor zover zij met hem samenwonen en in geval van vestiging buiten Nederland ter zake goedkeuring is
      verkregen van de minister;

      k. echtgenote: degene met de militair naar Nederlands recht is gehuwd, alsmede degene die met inachtneming van
      [artikel 1, derde tot en met vijfde lid, van het Algemeen militair ambtenarenreglement][ref3] mede onder dit begrip
      wordt verstaan;

      l. militair (tenzij uitdrukkelijk anders is bepaald):

      1° de militair in de zin van [artikel 1, eerste lid, onderdeel ][ref4] - daaronder begrepen hij die is aangesteld
      in burgerlijke openbare dienst om in de krijgsmacht als geestelijk verzorger doorlopend werkzaam te zijn - met
      uitzondering van de militair op wie [artikel 16 van het Inkomstenbesluit militairen (IBM)][ref5] van toepassing is;

      2° Onder militair wordt mede begrepen de ambtenaar, bedoeld in
      [artikel 8a, eerste lid, van het Burgerlijk ambtenarenreglement defensie (Bard)][ref6] die als gevolg van een
      functiewisseling in het kader van de mobiliteitsbevordering van standplaats verandert. Waar in dit besluit wordt
      verwezen naar [artikel 143 van het Algemeen militair ambtenarenreglement][ref7], wordt voor deze ambtenaren
      gelezen: [artikel 75 Bard][ref8].

      m. minister:

      Onze Minister van Defensie; n. plaats van legering:

      de voor de militair gebruikelijke ingang van het gebouw, gebouwencomplex, terrein of vaartuig waar hem door het
      bevoegde gezag nachtverblijf van rijkswege wordt geboden;

      o. plaats van tewerkstelling:

      de gebruikelijke ingang van het gebouw, gebouwencomplex, terrein of vaartuig waar de militair gewoonlijk zijn
      werkzaamheden verricht, dan wel een door het bevoegde gezag aangewezen plaats;

      p. standplaats:

      de gemeente of het bij name genoemde deel van die gemeente, waar de plaats van tewerkstelling van de militair is
      gelegen, dan wel indien de plaats van tewerkstelling een vaartuig is, de door het bevoegde gezag aangewezen plaats;

      q. *toelage buitenland:* de toelage ter zake van het verblijf van de militair buiten Nederland, bedoeld in
      [artikel 16, eerste lid, onder c van het Inkomstenbesluit militairen][ref9];

      r. verhuizen:

      veranderen van woning;

      s. verplaatsing:

      verandering van standplaats die naar het oordeel van het bevoegde gezag een permanent karakter heeft;

      t. voor het eerst in dienst treden:

      in dienst treden bij het Rijk of een van zijn diensten, bedrijven of instellingen, anders dan in geval van overgang
      binnen een maand:

      1. van de ene naar de andere tak van rijksdienst;

      2. van een andere overheidsdienst of een door het Rijk bekostigde onderwijsinstelling naar de rijksdienst;

      u. woning:

      woonruimte anders dan van rijkswege waaronder mede te verstaan de ambts- of dienstwoning;

      v. woongebied:

      zodanig gebied dat de kortste gebruikelijke openbare weg van de woning naar de plaats van tewerkstelling niet
      meer bedraagt dan 25 kilometer alsmede een door het bevoegde gezag bepaalde limitatieve opsomming van goedgekeurde
      plaatsen van vestiging, behorende bij een standplaats waarvan het woongebied in onvoldoende mate mogelijkheid biedt
      tot vestiging;


