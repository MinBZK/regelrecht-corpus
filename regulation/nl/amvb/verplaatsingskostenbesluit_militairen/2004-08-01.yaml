  - number: '31'
    text: Dit besluit treedt in werking op een nader bij koninklijk besluit te bepalen datum.
    url: https://wetten.overheid.nl/BWBR0005137/2004-08-01#Artikel31
  - number: '32'
    text: Dit besluit wordt aangehaald als "Verplaatsingskostenbesluit militairen".
    url: https://wetten.overheid.nl/BWBR0005137/2004-08-01#Artikel32
