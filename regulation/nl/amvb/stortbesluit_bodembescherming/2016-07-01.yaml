$id: stortbesluit_bodembescherming
regulatory_layer: AMVB
publication_date: '2006-07-06'
valid_from: '2016-07-01'
bwb_id: BWBR0005858
url: https://wetten.overheid.nl/BWBR0005858/2016-07-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 3 april 1991, nr.
    MJZ03491020, Centrale Directie Juridische Zaken, afdeling Wetgeving;

    Gelet op de richtlijnen van de Raad van de Europese Gemeenschappen van 17 december 1979, nr. 80/68/EEG (PbEG L
    20) betreffende de bescherming van het grondwater tegen verontreiniging veroorzaakt door de lozing van bepaalde
    gevaarlijke stoffen, en van 19 maart 1987, nr. 87/217/EEG (PbEG L 85) inzake voorkoming en vermindering van
    verontreiniging van het milieu door asbest, alsmede op de artikelen 8.45 en 21.7 van de Wet milieubeheer, en, voor
    zover het betreft artikel 15, op artikel 43 van de Wet bodembescherming;

    Gezien de adviezen van de Centrale raad voor de milieuhygiëne en de Technische commissie bodembescherming;

    De Raad van State gehoord (advies van 5 augustus 1992, nr. W08.91.0177);

    Gezien het nader rapport van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 15
    januari 1993, nr. MJZ 15193037, Centrale Directie Juridische Zaken, afdeling Wetgeving;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder: asbest: de volgende vezelachtige
      silicaten: crocidoliet (blauw asbest), actinoliet, anthofylliet, chrysotiel (wit asbest), amosiet (bruin asbest)
      of tremoliet; cel: stortvak of een deel daarvan met een bepaalde hoogte; gemiddeld hoogste grondwaterstand:
      rekenkundig gemiddelde over ten minste acht achtereenvolgende jaren van de drie hoogste grondwaterstanden
      per hydrologisch jaar; gemiddeld laagste grondwaterstand: rekenkundig gemiddelde over ten minste acht
      achtereenvolgende jaren van de drie laagste grondwaterstanden per hydrologisch jaar; hydrologisch jaar: periode
      van 1 april tot en met 31 maart van het daarop volgende kalenderjaar; inrichting: inrichting die behoort
      tot een categorie van inrichtingen, die is aangewezen krachtens [artikel 1.1, derde lid, van de wet][ref1];
      ondergrondse stortplaats: stortplaats waar afvalstoffen in de diepe ondergrond worden gebracht; percolaat:
      vloeistof die uit de gestorte afvalstoffen komt of daarmee in contact is geweest; stortplaats: inrichting waar
      afvalstoffen worden gestort, dan wel het gedeelte van een inrichting, waar afvalstoffen worden gestort, indien
      in de inrichting niet uitsluitend afvalstoffen worden gestort; vergunning: vergunning voor een stortplaats
      krachtens [artikel 2.1, aanhef en onder e, van de Wet algemene bepalingen omgevingsrecht][ref2]; wet:
      [Wet milieubeheer][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0003245
  - number: '1.2'
    text: |-
      Onder stortplaats wordt mede verstaan een stortplaats waar het storten van afvalstoffen is beëindigd. Tot de
      stortplaats wordt mede gerekend het gedeelte van de stortplaats waar het storten van afvalstoffen is beëindigd.
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel1
  - number: '1.3'
    text: Onder asbest worden mede verstaan produkten waarin asbest is verwerkt, en asbeststof.
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel1
  - number: '1.4'
    text: |-
      Onze Minister kan nadere regels stellen, inhoudende de verplichting voor het bevoegd gezag voorschriften aan de
      vergunning te verbinden, waarvan de inhoud in die regels is aangegeven, met betrekking tot de wijze waarop de
      gemiddeld hoogste grondwaterstand en de gemiddeld laagste grondwaterstand worden bepaald.
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel1
  - number: '2.1'
    text: 'Dit besluit is niet van toepassing op het storten van afvalstoffen:'
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel2
  - number: 2.1.a
    text: |-
      voor zover daaromtrent regels gelden, die zijn gesteld bij of krachtens het
      [Activiteitenbesluit milieubeheer][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0022762
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0022762
  - number: 2.1.b
    text: |-
      voor zover het betreft het begraven van stoffelijke resten of het op of in de bodem verspreiden van as, afkomstig
      van de verbranding van stoffelijke resten.
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel2
  - number: '2.2'
    text: Dit besluit is niet van toepassing op stortplaatsen waar uitsluitend baggerspecie wordt gestort.
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel2
  - number: '2.3'
    text: 'Dit besluit is niet van toepassing op stortplaatsen:'
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel2
  - number: 2.3.a
    text: waar het storten van afvalstoffen is beëindigd vóór 1 maart 1995, of
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel2
  - number: 2.3.b
    text: |-
      waar op of na 1 maart 1995 uitsluitend afvalstoffen worden gestort ten behoeve van het aanbrengen van een
      bovenafdichting op die stortplaats, en de gestorte hoeveelheid ten hoogste 0,3 m3 afvalstof per m2 stortoppervlak
      bedraagt.
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel2
  - number: 2a
    text: |-
      Het bevoegd gezag verbindt aan de vergunning voorschriften ten aanzien van de vakbekwaamheid van degene die de
      inrichting drijft en ten aanzien van de opleiding van de in de inrichting werkzame personen.
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel2a
  - number: '3.1'
    text: |-
      Het bevoegd gezag verbindt aan de vergunning voorschriften, inhoudende de verplichting dat het storten van
      afvalstoffen zodanig plaatsvindt dat de gestorte afvalstoffen - na zetting van de bodem - niet beneden 0,7 meter
      boven de te verwachten gemiddeld hoogste grondwaterstand kunnen geraken.
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel3
  - number: '3.2'
    text: |-
      In afwijking van het eerste lid verbindt het bevoegd gezag in gevallen waarin het ingevolge
      [artikel 4, eerste lid][ref1], aan de vergunning voorschriften heeft verbonden, inhoudende de verplichting dat als
      onderdeel van de onderafdichting een capillair onderbrekende laag van ten minste 0,2 meter wordt aangebracht, aan
      de vergunning voorschriften, inhoudende de verplichting dat het storten van afvalstoffen zodanig plaatsvindt dat de
      gestorte afvalstoffen - na zetting van de bodem - niet beneden 0,5 meter boven de te verwachten gemiddeld hoogste
      grondwaterstand kunnen geraken.


      [ref1]: https://wetten.overheid.nl/BWBR0005858#Artikel4
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005858
        artikel: '4'
        hoofdstuk: II
  - number: '3.3'
    text: |-
      Indien het niet meer mogelijk is te voldoen aan voorschriften als opgenomen in het eerste lid onderscheidenlijk
      het tweede lid, kan het bevoegd gezag in afwijking van het eerste lid onderscheidenlijk het tweede lid aan
      de vergunning voorschriften verbinden, inhoudende de verplichting dat daarin aangegeven civieltechnische of
      geohydrologische maatregelen worden getroffen, die eveneens voldoende waarborgen bieden dat het grondwater niet met
      de gestorte afvalstoffen in contact kan komen.
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel3
  - number: '4.1'
    text: |-
      Het bevoegd gezag verbindt aan de vergunning voorschriften, inhoudende de verplichting dat aan de onderkant van de
      gestorte afvalstoffen een onderafdichting aanwezig is, die tegengaat dat verontreinigende stoffen uit de gestorte
      afvalstoffen in de bodem kunnen geraken, en betrekt daarbij de bijzonderheden van de stortplaats waarvoor de
      vergunning wordt verleend, en de aard van de afvalstoffen die op die stortplaats worden gestort.
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel4
  - number: '4.2'
    text: |-
      Indien een onderafdichting onvoldoende bijdraagt aan de noodzakelijke bescherming van de bodem omdat, vanwege
      de stortplaatsspecifieke geohydrologische situatie, geen sprake is van een voldoende geohydrologische barrière,
      verbindt het bevoegd gezag aan de vergunning tevens voorschriften, inhoudende de verplichting dat daarin aangegeven
      andere civieltechnische of geohydrologische maatregelen worden getroffen, die een adequaat beschermingsniveau
      opleveren; de kunstmatige geohydrologische barrière is in ieder geval niet dunner dan 0,5 meter.
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel4
  - number: '4.3'
    text: |-
      Indien een onderafdichting naar het oordeel van het bevoegd gezag niet meer kan worden aangebracht, verbindt
      het bevoegd gezag aan de vergunning in plaats van voorschriften die verplichten tot het aanbrengen van
      een onderafdichting, voorschriften, inhoudende de verplichting dat daarin aangegeven civieltechnische of
      geohydrologische maatregelen worden getroffen, die voldoende tegengaan dat verontreinigende stoffen zich uit de
      gestorte afvalstoffen in de bodem verspreiden.
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel4
  - number: '4.4'
    text: |-
      Het bevoegd gezag verbindt aan de vergunning voorschriften, inhoudende de verplichting dat zo spoedig als technisch
      mogelijk, maar uiterlijk na een in het voorschrift aangegeven termijn die niet later eindigt dan 30 jaar na het
      aanbrengen van de onderafdichting of het treffen van de in het tweede of derde lid bedoelde maatregelen, aan de
      bovenkant van de gestorte afvalstoffen een bovenafdichting wordt aangebracht die tegengaat dat water in de gestorte
      afvalstoffen infiltreert.
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel4
  - number: '4.5'
    text: |-
      Onze Minister kan in het belang van de bescherming van de bodem nadere regels stellen, inhoudende de verplichting
      voor het bevoegd gezag met betrekking tot de uitvoering van de bovenafdichting dan wel de uitvoering van de in het
      tweede of derde lid bedoelde maatregelen, aan de vergunning voor een stortplaats de voorschriften te verbinden,
      waarvan de inhoud in die regels is aangegeven.
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel4
  - number: '5'
    text: |-
      Het bevoegd gezag verbindt aan de vergunning voorschriften, inhoudende de verplichting dat percolaat wordt
      opgevangen, verzameld en gezuiverd of afgevoerd op een zodanige wijze dat geen gevaar bestaat voor verontreiniging
      van de bodem, en betrekt daarbij de bijzonderheden van de stortplaats waarvoor de vergunning wordt verleend, en de
      aard van de afvalstoffen die op die stortplaats worden gestort.
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel5
  - number: 5a.1
    text: 'Het bevoegd gezag verbindt aan de vergunning voor een ondergrondse stortplaats de verplichting dat:'
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel5a
  - number: 5a.1.a
    text: |-
      voor zover van toepassing, de voorzieningen, bedoeld in bijlage A bij de bijlage bij de beschikking nr. 2003/33/
      EG van de Raad van de Europese Unie van 19 december 2002 tot vaststelling van criteria en procedures voor het
      aanvaarden van afvalstoffen op stortplaatsen overeenkomstig artikel 16 en bijlage II van Richtlijn 1999/31/EG
      betreffende het storten van afvalstoffen (Pb EG L 11), worden getroffen,
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel5a
  - number: 5a.1.b
    text: |-
      de afvalstoffen in de diepe ondergrond worden gebracht in overeenstemming met het bepaalde in bijlage A, bedoeld
      onder a, en
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel5a
  - number: 5a.1.c
    text: |-
      degene die een ondergrondse stortplaats drijft, er voor zorgdraagt dat op die stortplaats een rapport, inhoudende
      een veiligheidsbeoordeling, aanwezig is die voldoet aan onderdeel 2.5 van de bijlage bij de beschikking, bedoeld
      onder a.
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel5a
  - number: 5a.2
    text: |-
      Een wijziging van de bijlage bij de beschikking, bedoeld in het eerste lid, gaat voor de toepassing van het
      eerste lid gelden met ingang van de dag waarop aan de betrokken wijziging uitvoering moet zijn gegeven, tenzij bij
      ministerieel besluit, dat in de Staatscourant wordt bekendgemaakt, een ander tijdstip wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel5a
  - number: '6'
    text: 'Het bevoegd gezag verbindt aan de vergunning voorschriften, inhoudende de verplichting dat:'
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel6
  - number: 6.a
    text: |-
      zodanige voorzieningen worden getroffen dat asbesthoudende afvalstoffen niet met andere afvalstoffen vermengd
      kunnen raken,
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel6
  - number: 6.b
    text: |-
      asbesthoudende afvalstoffen die niet deugdelijk zijn verpakt, aan het einde van iedere werkdag zodanig worden
      afgedekt dat geen verspreiding van vezels kan plaatsvinden,
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel6
  - number: 6.c
    text: |-
      asbesthoudende afvalstoffen die niet zijn verpakt of afgedekt, zodanig vochtig worden gehouden, dat geen
      verspreiding van vezels kan plaatsvinden,
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel6
  - number: 6.d
    text: |-
      het stortgebied van asbesthoudende afvalstoffen voorafgaand aan het betreden van deze afvalstoffen met materieel,
      wordt afgedekt,
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel6
  - number: 6.e
    text: |-
      op de stortplaats geen andere activiteiten dan stortactiviteiten worden verricht waardoor asbestvezels uit de
      gestorte afvalstoffen kunnen vrijkomen,
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel6
  - number: 6.f
    text: |-
      degene die een stortplaats drijft, er voor zorgdraagt dat op de stortplaats een overzicht aanwezig is waarop de
      plaatsen zijn aangegeven waar asbesthoudende afvalstoffen zijn gestort en gegevens aanwezig zijn waaruit blijkt hoe
      die plaatsen worden afgeschermd ter voorkoming van menselijk contact met asbesthoudende afvalstoffen,
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel6
  - number: 6.g
    text: |-
      indien ten aanzien van de stortplaats een verklaring als bedoeld in
      [artikel 8.47, derde lid, van de Wet milieubeheer][ref1] is afgegeven, het overzicht, bedoeld in onderdeel f, wordt
      overgelegd aan gedeputeerde staten van de provincie waarin de stortplaats ten aanzien waarvan de verklaring is
      afgegeven, is gelegen, en


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
  - number: 6.h
    text: |-
      asbesthoudend afval in een voor asbesthoudende afvalstoffen bestemde cel wordt gestort, voor zover het een
      vergunning voor een stortplaats voor niet-gevaarlijke afvalstoffen betreft.
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel6
  - number: 6a.1
    text: 'Het bevoegd gezag verbindt aan de vergunning voorschriften, inhoudende de verplichting om:'
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel6a
  - number: 6a.1.a
    text: |-
      vanaf het tijdstip van opbouw van de stortplaats voorzieningen te treffen en toe te passen om het uit de
      stortplaats vrijkomende stortgas op te vangen en te verwerken;
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel6a
  - number: 6a.1.b
    text: dit stortgas hetzij te benutten binnen of buiten de inrichting, hetzij af te fakkelen;
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel6a
  - number: 6a.1.c
    text: de samenstelling en de atmosferische druk van de gasuitstoot in beginsel maandelijks te meten.
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel6a
  - number: 6a.2
    text: |-
      Indien het stortgas wordt afgefakkeld, wordt aan de vergunning het voorschrift verbonden dat de fakkelinstallatie
      voldoet aan de volgende eisen:
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel6a
  - number: 6a.2.a
    text: de uittreedtemperatuur bedraagt ten minste 900° C;
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel6a
  - number: 6a.2.b
    text: de verblijftijd van de verbrandingsgassen in de fakkel bedraagt ten minste 0,3 seconden;
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel6a
  - number: 6a.2.c
    text: de fakkel behoort tot het gesloten type.
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel6a
  - number: 6a.3
    text: |-
      Het tweede lid is niet van toepassing op een fakkelinstallatie die uitsluitend in gebruik is tijdens
      onderhoudsbeurten en storingen van de in het eerste lid bedoelde voorzieningen.
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel6a
  - number: 6a.4
    text: |-
      Het eerste tot en met derde lid is niet van toepassing indien de vergunninghouder aan de hand van de samenstelling
      van de massa van het stortpakket genoegzaam kan aantonen dat het milieurendement van voorzieningen als bedoeld in
      het eerste lid, gering is.
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel6a
  - number: 6a.5
    text: |-
      Onze Minister kan regels stellen, inhoudende de verplichting voor het bevoegd gezag aan de vergunning in die regels
      aangegeven voorschriften te verbinden met betrekking tot inhoud, frequentie en plaats van de in het eerste lid,
      onder c, bedoelde metingen.
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel6a
  - number: '7'
    text: |-
      Het bevoegd gezag verbindt aan de vergunning voorschriften, inhoudende de verplichting dat het storten zodanig
      plaatsvindt dat de gestorte afvalstoffen en de voorzieningen die ingevolge de in het belang van de bescherming van
      de bodem aan de vergunning verbonden voorschriften zijn getroffen op de stortplaats, kunnen worden teruggenomen
      zonder ingrijpende aantasting van de bodem.
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel7
  - number: '8.1'
    text: 'Het bevoegd gezag verbindt aan de vergunning voorschriften, inhoudende de verplichting dat:'
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel8
  - number: 8.1.a
    text: |-
      een deugdelijk controlesysteem aanwezig is, waarmee de hoedanigheden van de bodem kunnen worden onderzocht,
      bestaande uit:
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel8
  - number: 8.1.a.1°
    text: beneden de gemiddeld laagste grondwaterstand gelegen, horizontaal aangebrachte drainagebuizen en
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel8
  - number: 8.1.a.2°
    text: |-
      bovenstrooms van de stortplaats ten minste één in het grondwater aangebrachte grondwaterbemonsteringsbuis en
      benedenstrooms ten minste twee grondwaterbemonsteringsbuizen;
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel8
  - number: 8.1.b
    text: |-
      de bemonstering en de vaststelling van de hoedanigheden van de bodem voor elke drainagebuis of
      grondwaterbemonsteringsbuis afzonderlijk kunnen geschieden.
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel8
  - number: '8.2'
    text: |-
      Indien de aanleg van voorzieningen als bedoeld in het eerste lid, onder *a*, onder 1°, naar het oordeel van
      het bevoegd gezag technisch niet mogelijk is, verbindt het bevoegd gezag in afwijking van het eerste lid aan de
      vergunning voorschriften, inhoudende de verplichting dat er een deugdelijk controlesysteem aanwezig is teneinde de
      hoedanigheden van de bodem te kunnen onderzoeken, bestaande uit:
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel8
  - number: 8.2.a
    text: |-
      benedenstrooms van de stortplaats een bij het voorschrift aan te geven aantal van ten minste twee in het grondwater
      aangebrachte grondwaterbemonsteringsbuizen en
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel8
  - number: 8.2.b
    text: bovenstrooms van de stortplaats ten minste een in het grondwater aangebrachte grondwaterbemonsteringsbuis.
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel8
  - number: 8a.1
    text: |-
      Het bevoegd gezag verbindt aan de vergunning voorschriften, inhoudende de verplichting de hoeveelheid en de
      samenstelling van het in de omgeving van de stortplaats aanwezig oppervlaktewater driemaandelijks vast te stellen;
      bemonstering geschiedt op ten minste twee door het bevoegd gezag aan te geven punten, één stroomopwaarts en één
      stroomafwaarts.
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel8a
  - number: 8a.2
    text: |-
      In afwijking van het eerste lid kan het bevoegd gezag bepalen dat de metingen van de hoeveelheid en samenstelling
      van het oppervlaktewater:
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel8a
  - number: 8a.2.a
    text: op grond van kenmerken van de stortplaats niet vereist zijn, dan wel
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel8a
  - number: 8a.2.b
    text: |-
      minder frequent mogen worden uitgevoerd als de evaluatie van de gegevens aangeeft dat langere tussenpozen even
      effectief zijn.
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel8a
  - number: '9.1'
    text: 'Het bevoegd gezag verbindt aan de vergunning voorschriften, inhoudende de verplichting dat:'
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel9
  - number: 9.1.a
    text: |-
      een daarin aangegeven aantal malen per jaar wordt nagegaan of wordt voldaan aan de voorschriften die ingevolge
      [artikel 3][ref1] aan de vergunning zijn verbonden;


      [ref1]: https://wetten.overheid.nl/BWBR0005858#Artikel3
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005858
        artikel: '3'
        hoofdstuk: II
  - number: 9.1.b
    text: |-
      de voorzieningen die ingevolge de in het belang van de bescherming van de bodem aan de vergunning verbonden
      voorschriften op de stortplaats zijn getroffen, worden geïnspecteerd;
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel9
  - number: 9.1.c
    text: onderzoek wordt gedaan met betrekking tot de hoedanigheden van de bodem onder de stortplaats;
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel9
  - number: 9.1.d
    text: |-
      een urgentieplan op hoofdlijnen wordt opgesteld, zijnde het plan waarin wordt aangegeven welke maatregelen dienen
      te worden getroffen als het interventiepunt, bedoeld in het tweede lid, onder b, wordt bereikt.
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel9
  - number: '9.2'
    text: |-
      Onze Minister kan nadere regels stellen, inhoudende de verplichting voor het bevoegd gezag aan de vergunning
      voorschriften te verbinden, waarvan de inhoud in die regels is aangegeven, met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel9
  - number: 9.2.a
    text: de bemonstering en vaststelling van de hoedanigheden van de bodem;
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel9
  - number: 9.2.b
    text: |-
      het vaststellen van een interventiepunt, zijnde het punt waarbij een significante verslechtering van de
      grondwaterkwaliteit optreedt;
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel9
  - number: 9.2.c
    text: de inhoud van een urgentieplan op hoofdlijnen;
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel9
  - number: 9.2.d
    text: de bemonstering van het oppervlaktewater.
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel9
  - number: '9.3'
    text: |-
      Het bevoegd gezag verbindt aan de vergunning voorschriften, inhoudende de verplichting dat de volgende resultaten
      in afschrift aan het bevoegd gezag worden gezonden, waarbij de frequentie door het bevoegd gezag wordt bepaald doch
      ten minste eenmaal per jaar bedraagt:
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel9
  - number: 9.3.a
    text: de resultaten van de inspectie en het onderzoek, bedoeld in het eerste lid;
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel9
  - number: 9.3.b
    text: |-
      de resultaten van de metingen van de hoeveelheid en samenstelling van de in de omgeving van de stortplaats
      aanwezige wateren, bedoeld in [artikel 8a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005858#Artikel8a
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005858
        artikel: 8a
        hoofdstuk: II
  - number: 9.3.c
    text: |-
      de resultaten van de metingen van de samenstelling en de atmosferische druk van de gasuitstoot, bedoeld in
      [artikel 6a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005858#Artikel6a
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005858
        artikel: 6a
        hoofdstuk: II
  - number: 9.3.d
    text: |-
      de resultaten van de metingen van het niveau en de samenstelling van het grondwater, bedoeld in de
      [artikelen 3][ref1] en [8][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005858#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005858#Artikel8
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005858
        artikel: '3'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0005858
        artikel: '8'
        hoofdstuk: II
  - number: 9a
    text: |-
      Het bevoegd gezag verbindt aan de vergunning voorschriften, inhoudende de verplichting, dat indien een voor de
      stortplaats vastgesteld interventiepunt wordt bereikt:
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel9a
  - number: 9a.a
    text: de overschrijding terstond aan het bevoegd gezag wordt gemeld;
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel9a
  - number: 9a.b
    text: |-
      op basis van het urgentieplan op hoofdlijnen in overleg met het bevoegd gezag een uitgewerkt urgentieplan wordt
      opgesteld;
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel9a
  - number: 9a.c
    text: het uitgewerkte urgentieplan binnen een door het bevoegd gezag gestelde termijn wordt opgesteld.
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel9a
  - number: '10.1'
    text: 'Het bevoegd gezag verbindt aan de vergunning voorschriften, inhoudende de verplichting dat:'
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel10
  - number: 10.1.a
    text: |-
      alvorens voor de eerste keer wordt gestort en voorts telkens na verloop van twee jaar, in opdracht van de
      vergunninghouder door een ter zake kundige:
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel10
  - number: 10.1.a.1°
    text: |-
      wordt nagegaan of wordt voldaan aan de voorschriften die ingevolge [artikel 3][ref1] aan de vergunning zijn
      verbonden,


      [ref1]: https://wetten.overheid.nl/BWBR0005858#Artikel3
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0005858
        artikel: '3'
        hoofdstuk: II
  - number: 10.1.a.2°
    text: |-
      de voorzieningen die ingevolge de in het belang van de bescherming van de bodem aan de vergunning verbonden
      voorschriften op de stortplaats zijn getroffen, worden gekeurd, alsmede
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel10
  - number: 10.1.a.3°
    text: onderzoek wordt gedaan met betrekking tot de hoedanigheden van de bodem onder de stortplaats;
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel10
  - number: 10.1.b
    text: |-
      onmiddellijk nadat een bovenafdichting als bedoeld in [artikel 4, vierde lid][ref1], is aangebracht, in opdracht
      van de vergunninghouder door een ter zake kundige een keuring wordt verricht van de voorzieningen die ingevolge
      de in het belang van de bescherming van de bodem aan de vergunning verbonden voorschriften op de stortplaats
      zijn getroffen, alsmede een onderzoek wordt gedaan met betrekking tot de hoedanigheden van de bodem onder de
      stortplaats;


      [ref1]: https://wetten.overheid.nl/BWBR0005858#Artikel4
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0005858
        artikel: '4'
        hoofdstuk: II
  - number: 10.1.c
    text: |-
      de resultaten van de keuring en het onderzoek zodanig op schrift worden gesteld dat een duidelijk inzicht wordt
      gegeven in de beheersbaarheid van de situatie;
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel10
  - number: 10.1.d
    text: |-
      de resultaten van de keuring en het onderzoek zo spoedig mogelijk nadat de keuring en het onderzoek hebben
      plaatsgevonden, in afschrift worden toegezonden aan het bevoegd gezag;
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel10
  - number: 10.1.e
    text: de op schrift gestelde resultaten van de keuring en het onderzoek worden bewaard.
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel10
  - number: '10.2'
    text: |-
      Onze Minister kan met betrekking tot de keuring en het onderzoek nadere regels stellen, inhoudende de verplichting
      voor het bevoegd gezag aan de vergunning de voorschriften te verbinden, waarvan de inhoud in die regels is
      aangegeven.
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel10
  - number: '11'
    text: 'Het bevoegd gezag verbindt aan de vergunning voorschriften, inhoudende de verplichting dat:'
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel11
  - number: 11.a
    text: |-
      de voorzieningen die ingevolge de in het belang van de bodembescherming aan de vergunning verbonden voorschriften
      op de stortplaats zijn getroffen, in goede staat van onderhoud worden gehouden en zo nodig worden hersteld;
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel11
  - number: 11.b
    text: |-
      indien herstel niet mogelijk is, vervangende maatregelen worden getroffen, die voldoende tegengaan dat het
      grondwater met de gestorte afvalstoffen in contact komt.
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel11
  - number: '12.1'
    text: |-
      Het bevoegd gezag verbindt aan de vergunning voorschriften, inhoudende de verplichting dat voor het nakomen
      van de voorschriften met betrekking tot een bovenafdichting als bedoeld in [artikel 4, vierde lid][ref1],
      financiële zekerheid wordt gesteld totdat de in [artikel 10, eerste lid, onder b][ref2], bedoelde keuring heeft
      plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0005858#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005858#Artikel10
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005858
        artikel: '4'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0005858
        artikel: '10'
        hoofdstuk: II
  - number: '12.2'
    text: |-
      Indien een gemeente-, een provinciebestuur dan wel het Rijk vergunninghouder is, kan in afwijking van het eerste
      lid in plaats van het stellen van financiële zekerheid een daaraan gelijkwaardige voorziening worden getroffen.
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel12
  - number: '12.3'
    text: |-
      Het bevoegd gezag stelt in de voorschriften die ingevolge het eerste lid aan de vergunning worden verbonden, het
      bedrag vast, waarvoor zekerheid wordt gesteld. Het bedrag wordt niet hoger vastgesteld dan overeenkomt met een
      bedrag van € 2,27 per ton gestorte afvalstoffen.
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel12
  - number: '12.4'
    text: |-
      Het bevoegd gezag verbindt aan de vergunning voorschriften, inhoudende de verplichting, dat de vergunninghouder het
      bevoegd gezag:
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel12
  - number: 12.4.a
    text: |-
      schriftelijk bewijs van de financiële zekerheid onderscheidenlijk van de gelijkwaardige voorziening overlegt
      alvorens voor de eerste keer wordt gestort, dan wel schriftelijk bewijs overlegt na overdracht van de inrichting;
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel12
  - number: 12.4.b
    text: |-
      ten minste twee maanden vóór een overdracht van de inrichting aan een ander plaatsvindt, de voorgenomen overdracht
      meldt.
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel12
  - number: '13'
    text: |-
      Het bevoegd gezag kan aan een vergunning strengere voorschriften verbinden dan de voorschriften die het ingevolge
      dit besluit en de daarop berustende bepalingen aan de vergunning dient te verbinden, indien:
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel13
  - number: 13.a
    text: |-
      de inrichting waarvoor de vergunning wordt verleend, zal zijn of is gelegen in een gebied dat krachtens
      [artikel 1.2, tweede lid, onder ][ref1] is aangewezen in een provinciale milieuverordening, voor zover dat nodig is
      in het belang van de bescherming van de kwaliteit van het grondwater met het oog op de waterwinning in dat gebied;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel1
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '1'
  - number: 13.b
    text: |-
      de inrichting waarvoor de vergunning wordt verleend, zal zijn of is gelegen in een gebied waarop een provinciale
      milieuverordening van toepassing is, waarin regels zijn gesteld ter bescherming van de bodem, voor zover dat nodig
      is in het belang van de bescherming van de bodem in dat gebied;
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel13
  - number: 13.c
    text: |-
      de inrichting waarvoor de vergunning wordt verleend, zal zijn of is gelegen in een gebied met een diepe
      grondwaterstand, een hoge stroomsnelheid van het grondwater of een dik watervoerend pakket, voor zover dat nodig is
      in het belang van de bescherming van de bodem in die omstandigheid;
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel13
  - number: 13.d
    text: |-
      in verband met de aard van de afvalstoffen een bijzonder risico bestaat dat het storten van die stoffen nadelige
      gevolgen heeft voor de kwaliteit van de bodem.
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel13
  - number: '14'
    text: |-
      Het bevoegd gezag verbindt aan de vergunning voor een stortplaats waar op of na 1 september 1996 afvalstoffen
      worden gestort, voorschriften, inhoudende dat de voorschriften die ingevolge de [artikelen 4, vierde lid][ref1],
      [5][ref2], [9][ref3], [10][ref4], [11][ref5] en [12, eerste en tweede lid][ref6], aan de vergunning zijn
      verbonden, nadat de vergunning haar geldigheid heeft verloren, nog van kracht blijven totdat de stortplaats
      ingevolge [artikel 8.47, derde lid, van de Wet milieubeheer][ref7] voor gesloten is verklaard.


      [ref1]: https://wetten.overheid.nl/BWBR0005858#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005858#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005858#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0005858#Artikel10
      [ref5]: https://wetten.overheid.nl/BWBR0005858#Artikel11
      [ref6]: https://wetten.overheid.nl/BWBR0005858#Artikel12
      [ref7]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0005858
        artikel: '4'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0005858
        artikel: '5'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0005858
        artikel: '9'
        hoofdstuk: II
      - id: ref4
        bwb_id: BWBR0005858
        artikel: '10'
        hoofdstuk: II
      - id: ref5
        bwb_id: BWBR0005858
        artikel: '11'
        hoofdstuk: II
      - id: ref6
        bwb_id: BWBR0005858
        artikel: '12'
        hoofdstuk: II
      - id: ref7
        bwb_id: BWBR0003245
        artikel: '8'
  - number: '15'
    text: |-
      Het gezag dat bevoegd is een vergunning voor de stortplaats te verlenen kan, indien het in het belang van de
      bescherming van de bodem een onderzoek op de stortplaats dan wel in de onmiddellijke omgeving daarvan nodig
      oordeelt, aan de rechthebbenden ten aanzien van het gedeelte van de bodem waar dat onderzoek wordt ingesteld,
      de verplichting opleggen dat het verrichten van het onderzoek, alsmede het aanbrengen, het aanwezig zijn, het
      onderhoud, het gebruik en het verwijderen van de voor dat onderzoek nodige middelen, worden gedoogd.
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel15
  - number: '16.1'
    text: |-
      Het bevoegd gezag kan degene die een stortplaats drijft, waarvoor op het tijdstip van inwerkingtreding van dit
      besluit een vergunning is verleend, verzoeken de bij het verzoek aangegeven gegevens binnen een daarbij aangegeven
      termijn te verstrekken.
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel16
  - number: '16.2'
    text: Het verzoek kan uitsluitend betrekking hebben op gegevens betreffende de bij dit besluit aangegeven voorschriften.
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel16
  - number: '16.3'
    text: |-
      De vergunninghouder verstrekt de gegevens die in het verzoek zijn aangegeven, zo nodig na het verrichten van
      daartoe noodzakelijk onderzoek.
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel16
  - number: '17.1'
    text: |-
      Indien dit ter uitvoering van een richtlijn of een verordening van de Europese Gemeenschappen noodzakelijk is, kan
      Onze Minister het bevoegd gezag verzoeken met betrekking tot de stortplaatsen waarvoor het bevoegd is de vergunning
      te verlenen, aan hem de bij het verzoek aangegeven gegevens toe te zenden binnen een daarin aangegeven termijn.
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel17
  - number: '17.2'
    text: Het bevoegd gezag zendt de in het eerste lid bedoelde gegevens aan Onze Minister toe.
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel17
  - number: 17a
    text: |-
      In dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder: - *experiment:* experiment duurzaam
      stortbeheer, bedoeld in [artikel 17b, eerste lid][ref1];
        - *looptijd van het experiment:* periode van tien jaar vanaf het tijdstip van inwerkingtreding van dit hoofdstuk;
        - *nazorg:* maatregelen, bedoeld in [artikel 8.49, eerste lid, van de wet][ref2];
        - *pilotstortplaats:* in [artikel 17b, tweede lid][ref3], aangewezen stortplaats of gedeelte daarvan;
        - *toetswaarde:* krachtens [artikel 17e, eerste lid][ref4], vastgestelde toetswaarde.


      [ref1]: https://wetten.overheid.nl/BWBR0005858#Artikel17b
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0005858#Artikel17b
      [ref4]: https://wetten.overheid.nl/BWBR0005858#Artikel17e
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0005858
        artikel: 17b
        hoofdstuk: IIIa
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0005858
        artikel: 17b
        hoofdstuk: IIIa
      - id: ref4
        bwb_id: BWBR0005858
        artikel: 17e
        hoofdstuk: IIIa
  - number: 17b.1
    text: Er vindt een experiment duurzaam stortbeheer plaats.
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel17b
  - number: 17b.2
    text: 'Het experiment wordt uitgevoerd op de volgende pilotstortplaatsen:'
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel17b
  - number: 17b.2.a
    text: Kragge II te Bergen op Zoom;
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel17b
  - number: 17b.2.b
    text: Wieringermeer te Middenmeer;
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel17b
  - number: 17b.2.c
    text: Braambergen te Almere.
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel17b
  - number: 17b.3
    text: |-
      Bij ministeriële regeling worden de grenzen van de cellen van pilotstortplaatsen weergegeven waarbinnen het
      experiment plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel17b
  - number: 17b.4
    text: |-
      Het experiment heeft tot doel ter voorbereiding van de eventuele invoering van duurzaam stortbeheer, in aanvulling
      op andere vormen van stortbeheer, te onderzoeken of met betrekking tot de pilotstortplaatsen een substantiële
      vermindering van het emissiepotentieel en beperking van de nazorg kan worden bereikt.
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel17b
  - number: 17b.5
    text: |-
      Het experiment houdt in dat op de pilotstortplaatsen het afvalpakket wordt gestabiliseerd door het stimuleren van
      natuurlijke processen onder invloed van infiltratie van water of beluchting van het afvalpakket, waardoor in het
      afvalpakket aanwezige organische stoffen worden afgebroken en anorganische stoffen worden vastgelegd.
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel17b
  - number: 17b.6
    text: 'Het experiment is gericht op het verkrijgen van informatie over:'
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel17b
  - number: 17b.6.a
    text: de mate van vermindering van het emissiepotentieel van de stortplaats, die met duurzaam stortbeheer wordt bereikt;
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel17b
  - number: 17b.6.b
    text: de mate van beperking van de nazorg na sluiting van de stortplaats, die met duurzaam stortbeheer wordt bereikt;
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel17b
  - number: 17b.6.c
    text: de methode waarmee het emissiepotentieel van de stortplaats betrouwbaar kan worden vastgesteld;
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel17b
  - number: 17b.6.d
    text: een passende eindafwerking van de stortplaats in geval van toepassing van duurzaam stortbeheer.
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel17b
  - number: 17b.7
    text: |-
      Degene die een pilotstortplaats drijft, voert zijn aandeel in het experiment uit overeenkomstig een plan van aanpak
      dat hij voor die stortplaats met het bevoegd gezag is overeengekomen.
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel17b
  - number: 17c.1
    text: |-
      Op stortplaatsen of gedeelten daarvan die bij ministeriële regeling afzonderlijk of per categorie zijn aangewezen,
      hoeft aan de bovenkant van de gestorte afvalstoffen geen bovenafdichting te worden aangebracht die tegengaat dat
      water in de gestorte afvalstoffen infiltreert.
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel17c
  - number: 17c.2
    text: |-
      Op stortplaatsen of gedeelten daarvan die bij ministeriële regeling afzonderlijk of per categorie zijn aangewezen,
      worden zo spoedig als technisch mogelijk, maar uiterlijk binnen een bij die regeling voor de betrokken stortplaats
      of het betrokken gedeelte van de stortplaats aangegeven termijn die niet later eindigt dan 50 jaar na het
      aanbrengen van de onderafdichting of het treffen van de in het tweede of derde lid bedoelde maatregelen, aan de
      bovenkant van de gestorte afvalstoffen een bovenafdichting aangebracht die tegengaat dat water in de gestorte
      afvalstoffen infiltreert.
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel17c
  - number: 17c.3
    text: |-
      In gevallen als bedoeld in het eerste of tweede lid blijven gedurende de werkingsduur van hoofdstuk IIIa de
      voorschriften in de vergunning, gesteld ter uitvoering van [artikel 4, vierde lid][ref1], buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005858#Artikel4
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel17c
    references:
      - id: ref1
        bwb_id: BWBR0005858
        artikel: '4'
        hoofdstuk: II
  - number: 17c.4
    text: |-
      Bij ministeriële regeling op grond van het eerste of tweede lid kunnen uitsluitend categorieën van stortplaatsen,
      stortplaatsen of gedeelten van stortplaatsen worden aangewezen, die na een succesvol verloop van het experiment in
      aanmerking komen voor toepassing van duurzaam stortbeheer.
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel17c
  - number: 17d.1
    text: |-
      Bij ministeriële regeling worden met betrekking tot de pilotstortplaatsen en de stortplaatsen of gedeelten daarvan,
      bedoeld in [artikel 17c, eerste en tweede lid][ref1], regels gesteld in het belang van de bescherming van het
      milieu. De regels kunnen per stortplaats verschillend worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005858#Artikel17c
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel17d
    references:
      - id: ref1
        bwb_id: BWBR0005858
        artikel: 17c
        hoofdstuk: IIIa
  - number: 17d.2
    text: |-
      De regels krachtens het eerste lid hebben in elk geval betrekking op de maatregelen en voorzieningen die moeten
      worden getroffen ten behoeve van de uitvoering van het experiment en de monitoring van het experiment ten behoeve
      van de evaluaties, bedoeld in [artikel 17e, vierde en zevende lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005858#Artikel17e
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel17d
    references:
      - id: ref1
        bwb_id: BWBR0005858
        artikel: 17e
        hoofdstuk: IIIa
  - number: 17e.1
    text: Bij ministeriële regeling worden voor elke pilotstortplaats toetswaarden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel17e
  - number: 17e.2
    text: |-
      Een toetswaarde is de concentratie van een verontreinigende stof die na afloop van de looptijd van het experiment
      ten hoogste in het percolaat van de pilotstortplaats aanwezig mag zijn.
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel17e
  - number: 17e.3
    text: |-
      Bij de regeling, bedoeld in het eerste lid, worden in elk geval regels gesteld over de wijze waarop wordt bepaald
      of de pilotstortplaats aan de toetswaarden voldoet.
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel17e
  - number: 17e.4
    text: |-
      Na vijf jaar na de aanvang van de looptijd van het experiment vindt voor elke pilotstortplaats een tussenevaluatie
      plaats.
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel17e
  - number: 17e.5
    text: |-
      Het bevoegd gezag kan besluiten het experiment op een pilotstortplaats op een daarbij aangegeven tijdstip
      voortijdig beëindigen.
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel17e
  - number: 17e.5.a
    text: indien het experiment naar zijn verwachting op grond van de tussenevaluatie niet succesvol zal verlopen;
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel17e
  - number: 17e.5.b
    text: in het belang van de bescherming van het milieu.
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel17e
  - number: 17e.6
    text: |-
      Indien toepassing is gegeven aan het vijfde lid vervalt op het tijdstip waarop met betrekking tot die
      stortplaats een besluit op grond het vijfde lid van kracht wordt, de aanwijzing van de pilotstortplaats in
      [artikel 17b, tweede lid][ref1], onderscheidenlijk [artikel 17c, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005858#Artikel17b
      [ref2]: https://wetten.overheid.nl/BWBR0005858#Artikel17c
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel17e
    references:
      - id: ref1
        bwb_id: BWBR0005858
        artikel: 17b
        hoofdstuk: IIIa
      - id: ref2
        bwb_id: BWBR0005858
        artikel: 17c
        hoofdstuk: IIIa
  - number: 17e.7
    text: |-
      Na afloop van de looptijd van het experiment vindt voor elke pilotstortplaats een eindevaluatie van het experiment
      plaats, tenzij het experiment op grond van het zesde lid voortijdig is beëindigd.
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel17e
  - number: 17e.8
    text: |-
      Het experiment is op een pilotstortplaats succesvol verlopen indien uit de eindevaluatie blijkt dat het percolaat
      van de pilotstortplaats voldoet aan de toetswaarden of naar het oordeel van Onze Minister aannemelijk is dat het
      percolaat van de pilotstortplaats door het treffen van maatregelen alsnog aan de toetswaarden kan voldoen.
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel17e
  - number: 17f.1
    text: |-
      Dit hoofdstuk vervalt elf jaar na het tijdstip van inwerkingtreding, tenzij toepassing is gegeven aan het tweede
      lid.
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel17f
  - number: 17f.2
    text: |-
      Bij koninklijk besluit kan een later tijdstip worden vastgesteld waarop dit hoofdstuk vervalt, dat niet op een
      later tijdstip is gelegen dan dertien jaar na het tijdstip van inwerkingtreding van dit hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel17f
  - number: '18'
    text: |-
      Voor zover het betreft stortplaatsen waarvoor op het tijdstip van inwerkingtreding van dit besluit een vergunning
      is verleend, verbindt het bevoegd gezag de voorschriften die ingevolge dit besluit aan een vergunning dienen te
      worden verbonden, uiterlijk 1 maart 1995 aan de vergunning.
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel18
  - number: '19.1'
    text: |-
      Dit besluit treedt in werking op het tijdstip waarop de Wet tot uitbreiding en wijziging van de Wet algemene
      bepalingen milieuhygiëne en daarmee samenhangende wijzigingen van andere wetten (vergunningen en algemene regels
      voor inrichtingen; procedures voor vergunningen en ontheffingen; handhaving) in werking treedt.
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel19
  - number: '20'
    text: 'Dit besluit wordt aangehaald als: Stortbesluit bodembescherming.'
    url: https://wetten.overheid.nl/BWBR0005858/2016-07-01#Artikel20
