preamble:
  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Op de voordracht van de Staatssecretaris van Sociale Zaken en Werkgelegenheid, J. F. Hoogervorst, van 6 mei 1999,
    Nr. SV/WV/99/23540, gedaan mede namens Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties;


    Gelet op artikel 8b van de Ziektewet en artikel 7 van de Werkloosheidswet;


    De Raad van State gehoord (advies van 15 juni 1999, No. W12.99.0237/IV);


    Gezien het nader rapport van de Staatssecretaris van Sociale Zaken en Werkgelegenheid, J. F. Hoogervorst, van
    15 september 1999, Directie Sociale Verzekeringen nr. SV/WV/99/35068, uitgebracht mede namens Onze Minister van
    Binnenlandse Zaken en Koninkrijksrelaties;


    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0010744/1999-10-20#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. de wet: de [Wet overheidspersoneel onder de werknemersverzekeringen][ref1];

      b. overheidswerknemer: de overheidswerknemer, [bedoeld in artikel 1, onderdeel l, van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009267
      [ref2]: https://wetten.overheid.nl/BWBR0009267#Artikel1
    url: https://wetten.overheid.nl/BWBR0010744/1999-10-20#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009267
      - id: ref2
        bwb_id: BWBR0009267
        artikel: '1'
  - number: '2'
    text: |-
      1 Het tijdstip, bedoeld in [artikel 8b, eerste lid, van de Ziektewet][ref1], is het tijdstip van aanvang van fase
      2, bedoeld in [artikel 48 van de wet][ref2].

      2 In afwijking van het eerste lid is het tijdstip, bedoeld in [artikel 8b, eerste lid, van de Ziektewet][ref3],
      voor de overheidswerknemers die op de dag voorafgaande aan het tijdstip van aanvang van fase 2, bedoeld in
      [artikel 48 van de wet][ref4], uit hoofde van hun dienstverband recht hebben op bezoldiging of uitkering ingeval
      van ziekte, waarvan de uitkeringsduur niet verstrijkt op dat tijdstip, het tijdstip waarop de bezoldiging
      of uitkering ingeval van ziekte eindigt, doch in ieder geval het tijdstip van aanvang van fase 3, bedoeld in
      [artikel 49 van de wet][ref5].

      3 In afwijking van het eerste en het tweede lid kan, bij regeling van Onze Minister van Sociale Zaken en
      Werkgelegenheid in overeenstemming met Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties, voor
      groepen van overheidswerknemers als bedoeld in [artikel 8b, eerste lid, onderdeel a, van de Ziektewet][ref6],
      alsmede voor groepen van overheidswerknemers en gewezen overheidswerknemers met recht op een
      uitkering op grond van de [Wet op de arbeidsongeschiktheidsverzekering][ref7] als bedoeld in
      [artikel 8b, eerste lid, onderdeel b, van de Ziektewet][ref8], een ander tijdstip worden vastgesteld.

      4 Bij regeling van Onze Minister van Sociale Zaken en Werkgelegenheid in overeenstemming met Onze Minister van
      Binnenlandse Zaken en Koninkrijksrelaties kunnen nadere en, zo nodig, tijdelijk van de [Ziektewet][ref9] afwijkende
      regels worden gesteld.


