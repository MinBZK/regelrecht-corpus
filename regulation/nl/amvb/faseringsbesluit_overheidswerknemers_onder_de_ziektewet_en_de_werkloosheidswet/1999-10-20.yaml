  - number: '4'
    text: |-
      1 Van de bevoegdheid, bedoeld in [artikel 2, derde lid][ref1], en [artikel 3, tweede lid][ref2], kan slechts
      gebruik worden gemaakt indien de [Ziektewet][ref3], de [Werkloosheidswet][ref4] of een daarbij aansluitende
      arbeidsvoorwaardelijke regeling op het tijdstip, bedoeld in [artikel 2, eerste en tweede lid][ref5],
      respectievelijk [artikel 3, eerste lid][ref6], niet kan worden uitgevoerd voor een beperkt aantal groepen van
      overheidswerknemers of gewezen overheids-werknemers als bedoeld in die artikelen.

      2 Van de bevoegdheid tot het stellen van tijdelijk van de [Ziektewet][ref7] en de [Werkloosheidswet][ref8]
      afwijkende regels, bedoeld in [artikel 2, vierde lid][ref9], en [artikel 3, derde lid][ref10], kan slechts gebruik
      worden gemaakt indien dat noodzakelijk is voor een goede uitvoering van die wetten voor de overheidswerknemers en
      gewezen overheidswerknemers, bedoeld in die artikelen.


