  - number: '3'
    text: |-
      1 Het tijdstip, bedoeld in [artikel 7, eerste lid, van de Werkloosheidswet][ref1], is het tijdstip van aanvang van
      fase 2, [bedoeld in artikel 53 van de wet][ref2].

      2 In afwijking van het eerste lid kan bij regeling van Onze Minister van Sociale Zaken en Werkgelegenheid
      in overeenstemming met Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties voor groepen van
      overheidswerknemers als bedoeld in [artikel 7, eerste lid, van de Werkloosheidswet][ref3], een ander tijdstip
      worden vastgesteld.

      3 Bij regeling van Onze Minister van Sociale Zaken en Werkgelegenheid in overeenstemming met Onze Minister van
      Binnenlandse Zaken en Koninkrijksrelaties kunnen nadere en, zo nodig, tijdelijk van de [Werkloosheidswet][ref4]
      afwijkende regels worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0009267#Artikel53
      [ref3]: https://wetten.overheid.nl/BWBR0004045#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0004045
