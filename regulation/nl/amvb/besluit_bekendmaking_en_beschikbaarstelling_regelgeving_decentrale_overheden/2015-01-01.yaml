preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Binnenlandse Zaken en Koninkrijksrelaties van 14 oktober 2008, nr.
    2008-0000472808, directie Constitutionele Zaken en Wetgeving, afdeling Wetgeving Staatsinrichting en Grondrechten;

    Gelet op de artikelen 139 en 140 van de Gemeentewet, de artikelen 136 en 137 van de Provinciewet, de artikelen 73
    en 73a van de Waterschapswet en de artikelen 38, 38a en 106a van de Wet op de bedrijfsorganisatie;

    De Raad van State gehoord (advies van 24 oktober 2008, nr. W04.08.0447/I);

    Gezien het nader rapport van de Staatssecretaris van Binnenlandse Zaken en Koninkrijksrelaties van 2 december
    2008, nr. 2008-0000578308, directie Constitiutionele Zaken en Wetgeving, afdeling Wetgeving Staatsinrichting en
    Grondrechten;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0024917/2015-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: Het gemeenteblad wordt uitgegeven op een door het college van burgemeester en wethouders te bepalen internetadres.
    url: https://wetten.overheid.nl/BWBR0024917/2015-01-01#Artikel1
  - number: '1.2'
    text: |-
      Het college van burgemeester en wethouders draagt er zorg voor dat het gemeenteblad na de uitgifte elektronisch op
      een algemeen toegankelijke wijze beschikbaar blijft en dat daarbij wordt vermeld wanneer het is uitgegeven.
    url: https://wetten.overheid.nl/BWBR0024917/2015-01-01#Artikel1
  - number: 1a.1
    text: |-
      Indien het afkondigingsblad, bedoeld in
      [artikel 142, tweede lid, van de Wet openbare lichamen Bonaire, Sint Eustatius en Saba][ref1], elektronisch wordt
      uitgegeven, geschiedt dat door plaatsing op een door het bestuurscollege te bepalen internetadres.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel142
    url: https://wetten.overheid.nl/BWBR0024917/2015-01-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0028142
        artikel: '142'
  - number: 1a.2
    text: |-
      Het bestuurscollege draagt er zorg voor dat het afkondigingsblad na de uitgifte elektronisch op een algemeen
      toegankelijke wijze beschikbaar blijft en dat daarbij wordt vermeld wanneer het is uitgegeven.
    url: https://wetten.overheid.nl/BWBR0024917/2015-01-01#Artikel1a
  - number: '2.1'
    text: Het provinciaal blad wordt uitgegeven op een door gedeputeerde staten te bepalen internetadres.
    url: https://wetten.overheid.nl/BWBR0024917/2015-01-01#Artikel2
  - number: '2.2'
    text: |-
      Gedeputeerde staten dragen er zorg voor dat het provinciaal blad na de uitgifte elektronisch op een algemeen
      toegankelijke wijze beschikbaar blijft en dat daarbij wordt vermeld wanneer het is uitgegeven.
    url: https://wetten.overheid.nl/BWBR0024917/2015-01-01#Artikel2
  - number: '3.1'
    text: Het waterschapsblad wordt uitgegeven op een door het dagelijks bestuur van het waterschap te bepalen internetadres.
    url: https://wetten.overheid.nl/BWBR0024917/2015-01-01#Artikel3
  - number: '3.2'
    text: |-
      Het dagelijks bestuur van het waterschap draagt er zorg voor dat het waterschapsblad na de uitgifte elektronisch op
      een algemeen toegankelijke wijze beschikbaar blijft en dat daarbij wordt vermeld wanneer het is uitgegeven.
    url: https://wetten.overheid.nl/BWBR0024917/2015-01-01#Artikel3
  - number: '5.1'
    text: |-
      Het college van burgemeester en wethouders, het bestuurscollege, gedeputeerde staten onderscheidenlijk het
      dagelijks bestuur van het waterschap draagt er zorg voor dat de nodige maatregelen worden getroffen ter waarborging
      van de betrouwbaarheid en de beveiliging van de elektronische uitgifte en de beschikbaarstelling van het
      gemeenteblad, het afkondigingsblad, het provinciaal blad onderscheidenlijk het waterschapsblad.
    url: https://wetten.overheid.nl/BWBR0024917/2015-01-01#Artikel5
  - number: '5.2'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent het eerste lid.
    url: https://wetten.overheid.nl/BWBR0024917/2015-01-01#Artikel5
  - number: 5a
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties stelt nadere regels over de uitgifte en de
      beschikbaarheid van publicatiebladen als bedoeld in de [artikelen 32ja][ref1], [45ba][ref2], [50daa][ref3],
      [56aa][ref4], [65aa][ref5], [78aa][ref6] en [88aa van de Wet gemeenschappelijke regelingen][ref7], alsmede over de
      kosten in verband met de uitgifte en de beschikbaarheid.


