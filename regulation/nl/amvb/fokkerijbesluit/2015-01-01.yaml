      betreffende de toelating van raszuivere fokrunderen tot de voortplanting (PbEG L 167);




                  [richtlijn 88/661/EEG](31988L0661):


                  [richtlijn nr. 88/661/EEG](31988L0661) van de Raad van de Europese Gemeenschappen van 19 december 1988
      betreffende de zoötechnische normen die gelden voor fokvarkens (PbEG L 382);




                  [richtlijn 89/361/EEG](31989L0361):


                  [richtlijn nr. 89/361/EEG](31989L0361) van de Raad van de Europese Gemeenschappen van 30 mei 1989
      betreffende raszuivere fokschapen en -geiten (PbEG L 153);




                  [richtlijn 90/118/EEG](31990L0118):


                  [richtlijn nr. 90/118/EEG](31990L0118) van de Raad van de Europese Gemeenschappen van 5 maart 1990
      betreffende de toelating van raszuivere fokvarkens tot de voortplanting (PbEG L 71);




                  [richtlijn 90/119/EEG](31990L0119):


                  [richtlijn nr. 90/119/EEG](31990L0119) van de Raad van de Europese Gemeenschappen van 5 maart 1990
      betreffende de toelating van hybride fokvarkens tot de voortplanting (PbEG L 71);




                  [richtlijn 90/427/EEG](31990L0427):


                  [richtlijn 90/427/EEG](31990L0427) van de Raad van de Europese Gemeenschappen van 26 juni 1990 tot
      vaststelling van zoötechnische en genealogische voorschriften voor het intracommunautaire handelsverkeer in
      paardachtigen (PbEG L 224);




                  [richtlijn 91/174/EEG](31991L0174):


                  [richtlijn nr. 91/174/EEG](31991L0174) van de Raad van de Europese Gemeenschappen van 25 maart
      1991 inzake zoötechnische en genealogische voorschriften voor de handel in rasdieren en tot wijziging van de
      [richtlijnen 77/504/EEG](31977L0504) en [90/425/EEG](31990L0425) (PbEG L 85);




                  [richtlijn 94/28/EG](31994L0028):


                  [richtlijn nr. 94/28/EG](31994L0028) van de Raad van de Europese Unie van 23 juni 1994 tot vaststelling
      van de beginselen inzake de zoötechnische en genealogische voorschriften voor de invoer uit derde landen
      van dieren, alsmede van sperma, eicellen en embryo's en tot wijziging van [Richtlijn 77/504/EEG](31977L0504)
      betreffende raszuivere fokrunderen (PbEG L 178);




                  richtlijn 2009/157/EG:


                  richtlijn 2009/157/EG van de Raad van 30 november 2009 betreffende raszuivere fokrunderen (PbEU 2009,
      L 323);




                  verordening (EG) nr. 999/2001:


                  verordening (EG) nr. 999/2001 van het Europees Parlement en de Raad van de Europese Unie van 22 mei
      2001 houdende vaststelling van voorschriften inzake preventie, bestrijding en uitroeiing van bepaalde overdraagbare
      spongiforme encefalopathieën (PbEG 2001, L 147);




                  beschikking 89/507/EEG:


                  beschikking 89/507/EEG van de Commissie van 18 juli 1989 tot vaststelling van methoden inzake
      prestatieonderzoek en bepaling van de fokwaarde van raszuivere en hybride fokvarkens (PbEG 1989, L 247);




                  beschikking 90/256/EEG:


                  beschikking 90/256/EEG van de Commissie van 10 mei 1990 houdende vaststelling van methoden inzake
      prestatieonderzoek en beoordeling van de genetische waarde van raszuivere fokschapen en -geiten (PbEG 1990, L 145);




                  beschikking 2006/427/EG:


                  beschikking 2006/427/EG van de Commissie van 20 juni 2006 houdende vaststelling van methoden inzake
      prestatieonderzoek en van methoden voor de beoordeling van de genetische waarde van raszuivere fokrunderen (PbEU
      2006, L 169);




                  paardachtigen:


                  als huisdier gehouden paarden, ezels of kruisingen daarvan;




                  derde land:


                  land dat geen Lid-Staat van de Europese Unie is;




                  raszuiver:


                  ingeschreven in: - een stamboek als bedoeld in artikel 1 van richtlijn 2009/157/EG, [artikel 1][ref1]
      van [richtlijn 88/661/EEG](31988L0661), artikel 2 van [richtlijn 89/361/EEG](31989L0361) of artikel 2 van
      [richtlijn 90/427/EEG](31990L0427); - een stamboek of register als bedoeld in [artikel 1][ref2] van [richtlijn
      91/174/EEG](31991L0174), of - een stamboek of register als bedoeld in [artikel 4][ref3], eerste gedachtenstreepje,
      van [richtlijn 94/28/EG](31994L0028), dan wel, zolang de lijst, bedoeld in [artikel 3, eerste lid][ref4], van
      [richtlijn 94/28/EG](31994L0028) nog niet is vastgesteld, in een stamboek of register in een derde land;




                  hybride:


                  ingeschreven in: - een register als bedoeld in ratikel 1 van [richtlijn 88/661/EEG](31988L0661).


