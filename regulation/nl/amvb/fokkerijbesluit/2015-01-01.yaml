  - number: '2'
    text: |-
      1 Met betrekking tot runderen, buffels, varkens, schapen, geiten en paardachtigen geschieden de inschrijving van
      dieren in een stamboek of register, de inrichting van certificaten die worden afgegeven voor aldus ingeschreven
      dieren en hun sperma, eicellen en embryo’s, het prestatie-onderzoek en de beoordeling van de genetische waarden van
      de dieren in overeenstemming met de regelen die daaromtrent krachtens [artikel 7, eerste lid][ref1], zijn gesteld
      en

      a. voor runderen en buffels: bij artikel 3 van richtlijn 2009/157/EG en bij regelgeving van de Europese Gemeenschap
      op grond van artikel 6 van die richtlijn zijn gesteld;

      b. voor varkens: bij artikel 4 van [richtlijn 88/661/EEG](31988L0661) en bij regelgeving van de Europese
      Gemeenschap op grond van de artikelen 6 en 10 van die richtlijn zijn gesteld;

      c. voor schapen en geiten: bij regelgeving van de Europese Gemeenschap op grond van artikel 4 van [richtlijn
      89/361/EEG](31989L0361) zijn gesteld;

      d. voor paardachtigen: bij artikel 6 van de [richtlijn 90/427/EEG](31990L0427) en bij regelgeving van de Europese
      Gemeenschap op grond van de artikelen 4, tweede lid, en 7 van die richtlijn zijn gesteld.

      2 Onze Minister doet mededeling in de *Staatscourant* van de in het eerste lid bedoelde regelgeving van de Europese
      Gemeenschap, waarbij tevens de datum van inwerkingtreding van deze regelgeving wordt vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0006862#Artikel7
    url: https://wetten.overheid.nl/BWBR0006862/2015-01-01#Artikel2
    references:
