  - number: '6'
    text: |-
      1 Voor de inschrijving in een stamboek of register moet mede zijn voldaan aan hetgeen omtrent de toelating van
      raszuivere runderen, buffels, varkens, schapen, geiten en paardachtigen, onderscheidenlijk hybride varkens tot de
      voortplanting is voorgeschreven krachtens [artikel 7, eerste lid][ref1], en

      a. voor runderen en buffels: bij artikel 3 van [richtlijn 87/328/EEG](31987L0328);

      b. voor varkens: bij artikel 2 van [richtlijn 90/118/EEG](31990L0118) en bij artikel 1 van [richtlijn 90/119/EEG]
      (31990L0119);

      c. voor schapen en geiten: bij regelgeving van de Europese Gemeenschap op grond van artikel 4 van [richtlijn
      89/361/EEG](31989L0361);

      d. voor paardachtigen: bij regelgeving van de Europese Gemeenschap op grond van artikel 7 van [richtlijn 90/427/
      EEG](31990L0427).

      2 Onze Minister doet mededeling in de *Staatscourant* van de in het eerste lid bedoelde regelgeving van de Europese
      Gemeenschap, waarbij tevens de datum van inwerkingtreding van deze regelgeving wordt vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0006862#Artikel7
