        artikel: '7'
  - number: '3'
    text: |-
      1 Onze Minister erkent op aanvraag een organisatie als bedoeld in artikel 1, onderdeel b, onder i, van richtlijn
      2009/157/EG, artikel 1, onderdeel c, eerste streepje, en onderdeel d, eerste streepje, van richtlijn 88/661/EEG,
      artikel 2, onderdeel b, eerste streepje, van richtlijn 89/361/EEG of artikel 2, onderdeel c, eerste streepje, van
      richtlijn 90/427/EEG, indien is voldaan aan de voorwaarden die:

      a. voor runderen en buffels: bij regelgeving van de Europese Gemeenschap op grond van artikel 6 van richtlijn
      2009/157/EG zijn gesteld;

      b. voor varkens: bij regelgeving van de Europese Gemeenschap op grond van de artikelen 6 en 10 van [richtlijn
      88/661/EEG](31988L0661) zijn gesteld;

      c. voor schapen en geiten: bij regelgeving van de Europese Gemeenschap op grond van artikel 4 van [richtlijn
      89/361/EEG](31989L0361) zijn gesteld;

      d. voor paardachtigen: bij regelgeving van de Europese Gemeenschap op grond van artikel 4 van [richtlijn 90/427/
      EEG](31990L0427) zijn gesteld.

      2 Onze Minister erkent op aanvraag een organisatie voor het reglementeren van prestatieonderzoek als bedoeld in
      beschikking 2006/427/EG, beschikking 90/256/EEG of beschikking 89/507/EEG.

      3 Onze Minister erkent op aanvraag een organisatie voor het reglementeren van fokwaardeschattingen en de publicatie
      van de geschatte waarden als bedoeld in beschikking 2006/427/EG, beschikking 90/256/EEG of beschikking 89/507/EEG.

      4 Een erkenning als bedoeld in het tweede en derde lid wordt verleend, indien is voldaan aan de daaraan krachtens
      [artikel 7, eerste lid][ref1], gestelde voorwaarden.

      5 Onze Minister doet mededeling in de *Staatscourant* van de in het eerste lid bedoelde regelgeving van de Europese
      Gemeenschap, waarbij tevens de datum van inwerkingtreding van deze regelgeving wordt vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0006862#Artikel7
