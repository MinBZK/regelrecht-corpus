  - number: 3a
    text: |-
      1 Een erkenning als bedoeld in [artikel 3, eerste, tweede en derde lid][ref1], wordt niet verleend indien niet
      gewaarborgd is dat de betrokken organisatie [artikel 2, eerste lid][ref2], en [artikel 6, eerste lid][ref3], in
      acht neemt.

      2 Onze Minister trekt een erkenning in indien:

      a. een organisatie niet meer voldoet aan de erkenningsvoorwaarden;

      b. een organisatie de in [artikel 2, eerste lid][ref4] of [artikel 6, eerste lid][ref5], bedoelde regels niet
      naleeft.


