  - number: '11'
    text: |-
      1 Erkenningen die zijn verleend op grond van artikel 3, eerste lid, onderdeel a, van de Verordening
      erkenningsvoorwaarden voor stamboeken, prestatieonderzoek en fokwaardeschatting (PVV) 2010 worden beschouwd als
      erkenningen als bedoeld in [artikel 3, eerste lid][ref1].

      2 Erkenningen die zijn verleend op grond van artikel 3, eerste lid, onderdeel b, van de Verordening
      erkenningsvoorwaarden voor stamboeken, prestatieonderzoek en fokwaardeschatting (PVV) 2010 worden beschouwd als
      erkenningen als bedoeld in [artikel 3, tweede lid][ref2].

      3 Erkenningen die zijn verleend op grond van artikel 3, eerste lid, onderdeel c, van de Verordening
      erkenningsvoorwaarden voor stamboeken, prestatieonderzoek en fokwaardeschatting (PVV) 2010 worden beschouwd als
      erkenningen als bedoeld in [artikel 3, derde lid][ref3].


