  - number: '4'
    text: |-
      1 Een ingevolge [artikel 3, eerste, tweede of derde lid][ref1] erkende organisatie rapporteert jaarlijks voor 1
      juni aan Onze Minister over de activiteiten waarvoor de erkenning is verleend.

      2 De rapportage, bedoeld in het eerste lid, wordt opgesteld met gebruikmaking van een door Onze Minister
      vastgesteld formulier.

      3 Een organisatie als bedoeld in het eerste lid meldt omstandigheden die ertoe leiden dat niet langer is voldaan
      aan de betreffende erkenningsvoorwaarden of dat onvoldoende gewaarborgd is dat de in [artikel 2, eerste lid][ref2],
      of [artikel 6, eerste lid][ref3], bedoelde voorschriften worden nageleefd, zo spoedig mogelijk aan Onze Minister.


