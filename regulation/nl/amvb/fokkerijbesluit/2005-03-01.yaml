  - number: '5'
    text: |-
      Onze Minister trekt een ingevolge [artikel 3, eerste lid][ref1], verleende erkenning in, indien hij van oordeel
      is dat niet meer wordt voldaan aan de in die bepaling bedoelde voorwaarden voor die erkenning of dat onvoldoende
      gewaarborgd is dat de betrokken organisatie de in [artikel 2, eerste lid][ref2], en [artikel 6, eerste lid][ref3],
      bedoelde voorschriften naleeft.


      [ref1]: https://wetten.overheid.nl/BWBR0006862#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0006862#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0006862#Artikel6
