    text: |-
      Bij ministeriële regeling kunnen nadere regelen worden gesteld ter uitvoering van het bij en krachtens de
      [artikelen 8][ref1] en [9][ref2] bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0006862#Artikel8
