        artikel: '11'
  - number: '3'
    text: |-
      1 Een organisatie kan na een daartoe strekkend verzoek worden erkend als een instelling, die één of meer stamboeken
      of registers voor runderen, buffels, varkens, schapen, geiten en paardachtigen bijhoudt, indien voldaan wordt
      aan de voorwaarden die daaromtrent krachtens de [artikelen 7, eerste lid][ref1], en [11, tweede lid][ref2], zijn
      gesteld en

      a. voor runderen en buffels: bij regelgeving van de Europese Gemeenschap op grond van artikel 6 van de [richtlijn
      77/504/EEG](31977L0504) zijn gesteld;

      b. voor varkens: bij regelgeving van de Europese Gemeenschap op grond van de artikelen 6 en 10 van [richtlijn
      88/661/EEG](31988L0661) zijn gesteld;

      c. voor schapen en geiten: bij regelgeving van de Europese Gemeenschap op grond van artikel 4 van [richtlijn
      89/361/EEG](31989L0361) zijn gesteld;

      d. voor paardachtigen: bij regelgeving van de Europese Gemeenschap op grond van artikel 4 van [richtlijn 90/427/
      EEG](31990L0427) zijn gesteld.

      2 Een erkenning als bedoeld in het eerste lid wordt niet verleend indien niet gewaarborgd is dat de betrokken
      organisatie [artikel 2, eerste lid][ref3], in acht neemt.

      3 Onze Minister doet mededeling in de *Staatscourant* van de in het eerste lid bedoelde regelgeving van de Europese
      Gemeenschap, waarbij tevens de datum van inwerkingtreding van deze regelgeving wordt vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0006862#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0006862#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0006862#Artikel2
