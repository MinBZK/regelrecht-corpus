  - number: '11'
    text: |-
      1 Ter uitvoering van de [artikelen 2][ref1], [3][ref2] en [5][ref3] en van het bepaalde krachtens
      [artikel 7, tweede lid][ref4], van dit besluit wordt medewerking gevorderd van het bestuur van het Productschap Vee
      en Vlees.

      2 De gevorderde medewerking bestaat uit het verrichten van werkzaamheden en het bij verordening stellen van nadere
      regelen, die noodzakelijk zijn voor:

      a. het verlenen van de erkenning als een instelling die één of meer stamboeken of registers voor runderen, buffels,
      varkens, schapen, geiten of paardachtigen bijhoudt, op grond van [artikel 3][ref5];

      b. het verlenen van de erkenning als fokkersorganisatie, bedoeld in [artikel 7, tweede lid][ref6];

      c. de intrekking van de in de onderdelen a en b bedoelde erkenning op grond van [artikel 5][ref7],
      onderscheidenlijk het bepaalde krachtens [artikel 7, tweede lid][ref8].

      3 Onverminderd het tweede lid bestaat de gevorderde medewerking uit:

      a. het verlenen van de erkenningen, bedoeld in het tweede lid, onderdelen a en b, en het intrekken van de
      erkenningen, bedoeld in het tweede lid, onderdeel c;

      b. het verrichten van werkzaamheden en het bij verordening stellen van nadere regels ter uitvoering van
      [artikel 2][ref9], voor zover dit betrekking heeft op het prestatie-onderzoek en de beoordeling van genetische
      waarden bij dieren.


