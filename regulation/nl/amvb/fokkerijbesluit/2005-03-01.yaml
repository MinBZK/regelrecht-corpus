  - number: '4'
    text: |-
      Een ingevolge [artikel 3, eerste lid][ref1], erkende organisatie maakt een inschrijving, die niet voldoet aan
      hetgeen daaromtrent ingevolge [artikel 2, eerste lid][ref2], of [artikel 6, eerste lid][ref3], is bepaald,
      ongedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0006862#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0006862#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0006862#Artikel6
