  - number: '12'
    text: |-
      1 Een wijziging van een of meer onderdelen van de in [artikel 1][ref1] genoemde richtlijnen treedt voor de
      toepassing van de artikelen van dit besluit, waarin naar die onderdelen wordt verwezen, in werking met ingang van
      de dag waarop aan de betrokken wijzigingsrichtlijn uiterlijk uitvoering moet zijn gegeven, tenzij bij ministerieël
      besluit, dat in de *Staatscourant* wordt bekendgemaakt, een eerder of een ander aan die richtlijn ontleend tijdstip
      wordt vastgesteld.

      2 Een wijziging van een of meer onderdelen van de op de in het eerste lid bedoelde richtlijnen gebaseerde
      uitvoeringsregelgeving van de Europese Gemeenschap treedt voor de toepassing van de artikelen van dit
      besluit, waarin naar die onderdelen wordt verwezen, in werking met ingang van de dag waarop aan de betrokken
      wijzigingsregelgeving uitvoering moet zijn gegeven.

      3 Onze Minister doet van een wijzigingsrichtlijn of van wijzigingsregelgeving als bedoeld in de voorgaande leden,
      mededeling in de *Staatscourant*, waarbij tevens de datum van inwerkingtreding van deze regelgeving wordt vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0006862#Artikel1
    url: https://wetten.overheid.nl/BWBR0006862/2005-03-01#Artikel12
