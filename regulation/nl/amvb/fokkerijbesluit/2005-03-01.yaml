  - number: '8'
    text: |-
      1 Het is verboden om raszuivere dieren en hybride varkens als zodanig vanuit een derde land in Nederland te
      brengen, indien niet wordt voldaan aan artikel 4 van [richtlijn 94/28/EG](31994L0028) en, in voorkomend geval,
      aan de door de Commissie van de Europese Gemeenschappen vastgestelde zoötechnische of genealogische voorschriften,
      bedoeld in artikel 8 van [richtlijn 94/28/EG](31994L0028).

      2 Het is verboden om sperma, eicellen en embryo’s van raszuivere dieren of hybride varkens als zodanig vanuit
      een derde land in Nederland te brengen, indien niet wordt voldaan aan de artikelen 5, 6, onderscheidenlijk 7 van
      [richtlijn 94/28/EG](31994L0028) en, in voorkomend geval, aan de door de Commissie van de Europese Gemeenschappen
      vastgestelde zoötechnische of genealogische voorschriften, bedoeld in artikel 8 van [richtlijn 94/28/EG]
      (31994L0028).

      3 Zolang de voorschriften voor het vanuit een derde land op het grondgebied van de Europese Gemeenschap brengen
      van raszuivere dieren, hybride varkens en hun sperma, eicellen of embryo’s nog niet volledig ingevolge [richtlijn
      94/28/EG](31994L0028) zijn vastgesteld, is het verboden om raszuivere dieren, hybride varkens en hun sperma,
      eicellen of embryo’s in Nederland te brengen indien:

      a. voor zover het raszuivere dieren of hybride varkens betreft, die zijn bestemd voor Nederland, zij niet vergezeld
      gaan van een certificaat waaruit blijkt dat de dieren in het derde land van verzending zijn ingeschreven in een
      stamboek of een register en van een document waaruit blijkt dat de dieren in een stamboek of register in Nederland
      zijn dan wel zullen worden ingeschreven;

      b. voor zover het sperma, eicellen of embryo’s van raszuivere dieren of hybride varkens betreft, die zijn bestemd
      voor Nederland, zij niet vergezeld gaan van een certificaat waaruit blijkt dat deze produkten afkomstig zijn van
      raszuivere dieren of hybride varkens die in het derde land van verzending zijn ingeschreven in een stamboek of
      register;

      c. voor zover het raszuivere dieren of hybride varkens betreft, dan wel hun sperma, eicellen of embryo’s, die zijn
      bestemd voor een Lid-Staat, zij niet vergezeld gaan van een certificaat waaruit blijkt dat de dieren of produkten
      voldoen aan de zoötechnische of genealogische voorschriften van de Lid-Staat van bestemming.

      4 Het is verboden om sperma van dieren, niet zijnde raszuivere dieren en hybride varkens, dat is bestemd voor
      een Lid-Staat, vanuit een derde land in Nederland te brengen, indien niet wordt voldaan aan de zoötechnische of
      genealogische voorschriften van de Lid-Staat van bestemming.
    url: https://wetten.overheid.nl/BWBR0006862/2005-03-01#Artikel8
  - number: '9'
    text: |-
      1 Het is verboden om raszuivere paardachtigen als zodanig vanuit een Lid-Staat in Nederland te brengen dan wel
      buiten Nederland te brengen naar of over het grondgebied van een andere Lid-Staat, indien zij tijdens het transport
      niet vergezeld gaan van een document als bedoeld in artikel 8, onderdeel 1, van [richtlijn 90/427/EEG](31990L0427)
      en dat voldoet aan de vorenbedoelde bepaling.

      2 Het eerste lid is van overeenkomstige toepassing op sperma, eicellen en embryo’s van raszuivere paardachtigen,
      met dien verstande dat een document als bedoeld in artikel 8, onderdeel 2, van [richtlijn 90/427/EEG](31990L0427),
      aanwezig moet zijn.

      3 Het is verboden om raszuivere runderen en buffels, raszuivere varkens, schapen en geiten, hybride varkens
      alsmede sperma, eicellen en embryo’s daarvan, als zodanig buiten Nederland te brengen naar of over het grondgebied
      van een andere Lid-Staat zonder dat zij vergezeld gaan van hun stamboekcertificaten, indien de aanwezigheid van
      dergelijke documenten door de vorenbedoelde Lid-Staat is voorgeschreven in verband met hun vervoer naar of over het
      grondgebied van die Lid-Staat.

      4 Bij ministeriële regeling kan worden verboden om raszuivere runderen en buffels, raszuivere varkens, schapen en
      geiten, hybride varkens alsmede sperma, eicellen en embryo’s daarvan, als zodanig vanuit een Lid-Staat in Nederland
      te brengen, indien zij niet vergezeld gaan van hun stamboekcertificaten.
    url: https://wetten.overheid.nl/BWBR0006862/2005-03-01#Artikel9
