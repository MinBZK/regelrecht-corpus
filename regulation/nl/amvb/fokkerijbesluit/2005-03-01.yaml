preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Landbouw, Natuurbeheer en Visserij van 1 februari 1994, No. J. 941220,
    Directie Juridische en Bedrijfsorganisatorische Zaken;

    Gelet op richtlijn nr. 77/504/EEG van de Raad van de Europese Gemeenschappen van 25 juli 1977 betreffende
    raszuivere fokrunderen (PbEG L 206), richtlijn nr. 87/328/EEG van de Raad van de Europese Gemeenschappen van 18
    juni 1987 betreffende de toelating van raszuivere fokrunderen tot de voortplanting (PbEG L 167), richtlijn nr.
    88/661/EEG van de Raad van de Europese Gemeenschappen van 19 december 1988 betreffende zoötechnische normen die
    gelden voor fokvarkens (PbEG L 382), richtlijn nr. 89/361/EEG van de Raad van de Europese Gemeenschappen van 30
    mei 1989 betreffende raszuivere fokschapen en -geiten (PbEG L 153), richtlijn nr. 90/118/EEG van de Raad van de
    Europese Gemeenschappen van 5 maart 1990 betreffende de toelating van raszuivere fokvarkens tot de voortplanting
    (PbEG L 71), richtlijn nr. 90/119/EEG van de Raad van de Europese Gemeenschappen van 5 maart 1990 betreffende de
    toelating van hybride fokvarkens tot de voortplanting (PbEG L 71), richtlijn nr. 90/427/EEG van de Raad van de
    Europese Gemeenschappen van 26 juni 1990 tot vaststelling van zoötechnische en genealogische voorschriften voor
    het intracommunautaire handelsverkeer in paardachtigen (PbEG L 224), richtlijn nr. 91/174/EEG van de Raad van
    de Europese Gemeenschappen van 25 maart 1991 inzake zoötechnische en genealogische voorschriften voor de handel
    in rasdieren en tot wijziging van de richtlijnen 77/504/EEG en 90/425/EEG (PbEG L 85), richtlijn nr. 94/28/EG
    van de Raad van de Europese Unie van 23 juni 1994 tot vaststelling van de beginselen inzake de zoötechnische en
    genealogische voorschriften voor de invoer uit derde landen van dieren, alsmede van sperma, eicellen en embryo’s
    en tot wijziging van Richtlijn 77/504/EEG betreffende raszuivere fokrunderen (PbEG L 178) en op de op voormelde
    richtlijnen gebaseerde regelgeving van de Europese Gemeenschap alsmede op de artikelen 76, eerste lid, 108, 111 en
    130, eerste lid, van de Gezondheids- en welzijnswet voor dieren;

    Gezien het advies van de Raad voor Dierenaangelegenheden en het advies van het Landbouwschap;

    De Raad van State gehoord (advies van 11 juli 1994, no. W11.94.0060);

    Gezien het nader rapport van Onze Minister van Landbouw, Natuurbeheer en Visserij van 27 juli 1994, No. J. 9412185,
    Directie Juridische en Bedrijfsorganisatorische Zaken;

    Hebben goedgevonden en verstaan:
