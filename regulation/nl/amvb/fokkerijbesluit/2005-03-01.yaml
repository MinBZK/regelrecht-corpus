  - number: '7'
    text: |-
      1 Ter uitvoering van de in de [artikelen 2][ref1] en [6][ref2] genoemde richtlijnen kunnen bij ministeriële
      regeling nadere regelen worden gesteld.

      2 In verband met de uitvoering van [richtlijn 91/174/EEG](31991L0174) kunnen bij ministeriële regeling met
      betrekking tot andere dan de in [artikel 2, eerste lid][ref3], genoemde diersoorten regelen worden gesteld inzake
      de erkenning van fokkersorganisaties, de inschrijving of registratie in registers of stamboeken, de toelating van
      rasdieren tot de fokkerij, het gebruik van sperma, eicellen en embryo’s van rasdieren en de handel in rasdieren en
      hun sperma, eicellen en embryo’s, met inbegrip van het daarbij vereiste certificaat.

      3 De in het eerste en het tweede lid bedoelde regelen kunnen mede betrekking hebben op de procedure inzake de
      erkenning, de intrekking van een erkenning en de doorhaling van een inschrijving in een stamboek of register.


      [ref1]: https://wetten.overheid.nl/BWBR0006862#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006862#Artikel6
