        artikel: '1'
  - number: '13'
    text: |-
      De artikelen 76 en 129, onderdeel *a*, van de [Gezondheids- en welzijnswet voor dieren][ref1] alsmede dit besluit
      treden in werking met ingang van de dag na de datum van uitgifte van het *Staatsblad* waarin het wordt geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0005662
