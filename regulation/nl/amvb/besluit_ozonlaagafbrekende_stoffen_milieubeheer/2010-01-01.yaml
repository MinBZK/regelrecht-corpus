$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_ozonlaagafbrekende_stoffen_milieubeheer
regulatory_layer: AMVB
publication_date: '2011-06-15'
valid_from: '2010-01-01'
bwb_id: BWBR0015507
url: https://wetten.overheid.nl/BWBR0015507/2010-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 16 juli 2002, nr.
    MJZ2002060834, Centrale Directie Juridische Zaken, Afdeling Wetgeving;

    Gelet op verordening (EG) nr. 2037/2000 van het Europees Parlement en de Raad van de Europese Unie van 29 juni 2000
    betreffende de ozonlaag afbrekende stoffen (PbEG L 244) en artikel 24 van de Wet milieugevaarlijke stoffen;

    De Raad van State gehoord (advies van 22 oktober 2002, nr. WO8.02.0336/V);

    Gezien het nader rapport van de Staatssecretaris van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 22
    juli 2003, nr. MJZ 2003070049, Centrale Directie Juridische Zaken, Afdeling Wetgeving;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0015507/2010-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0015507/2010-01-01#Artikel1
  - number: 1.a
    text: |-
      ozonverordening: [verordening (EG) nr. 2037/2000](32000R2037) van het Europees Parlement en de Raad van de Europese
      Unie van 29 juni 2000 betreffende de ozonlaag afbrekende stoffen (PbEG L 244);
    url: https://wetten.overheid.nl/BWBR0015507/2010-01-01#Artikel1
  - number: 1.b
    text: 'gereguleerde stoffen: stoffen, genoemd in artikel 2 van de ozonverordening.'
    url: https://wetten.overheid.nl/BWBR0015507/2010-01-01#Artikel1
  - number: '2'
    text: |-
      Daar waar de ozonverordening een bevoegdheid toekent aan de bevoegde instantie van een lidstaat is Onze Minister
      bevoegd te handelen.
    url: https://wetten.overheid.nl/BWBR0015507/2010-01-01#Artikel2
  - number: '3'
    text: 'Het is verboden:'
    url: https://wetten.overheid.nl/BWBR0015507/2010-01-01#Artikel3
  - number: 3.a
    text: |-
      te handelen in strijd met de verboden, gesteld bij artikel 3, eerste lid, artikel 4, eerste lid in samenhang met
      het vierde lid, zesde lid, artikel 5, eerste lid, in samenhang met het tweede tot en met vijfde lid, artikel 8,
      artikel 9, eerste lid, artikel 11, artikel 14, eerste lid, in samenhang met de artikelen 8, 9 en 11, tweede en
      derde lid, en artikel 22, eerste lid, van de ozonverordening;
    url: https://wetten.overheid.nl/BWBR0015507/2010-01-01#Artikel3
  - number: 3.b
    text: |-
      te handelen in strijd met de voorschriften gesteld bij artikel 3, derde lid, artikel 4, derde en vijfde lid,
      artikel 12, derde lid, artikel 16, eerste tot en met vierde lid, en artikel 19, eerste, derde en vierde lid en lid
      4 bis, van de ozonverordening;
    url: https://wetten.overheid.nl/BWBR0015507/2010-01-01#Artikel3
  - number: 3.c
    text: |-
      te handelen in strijd met een voorschrift dat is verbonden aan een vergunning, verleend krachtens artikel 6, eerste
      lid, of artikel 12, eerste en vierde lid, van de ozonverordening;
    url: https://wetten.overheid.nl/BWBR0015507/2010-01-01#Artikel3
  - number: 3.d
    text: te handelen in strijd met de toestemming, verleend krachtens artikel 13 van de ozonverordening;
    url: https://wetten.overheid.nl/BWBR0015507/2010-01-01#Artikel3
  - number: 3.e
    text: methylbromide te produceren.
    url: https://wetten.overheid.nl/BWBR0015507/2010-01-01#Artikel3
  - number: '4.1'
    text: |-
      Bij ministeriële regeling worden regels gesteld ter uitvoering van artikel 16, vijfde lid, eerste volzin, van de
      ozonverordening.
    url: https://wetten.overheid.nl/BWBR0015507/2010-01-01#Artikel4
  - number: '4.2'
    text: |-
      Degene die een inrichting drijft draagt er zorg voor dat de gegevens over de hoeveelheden gebruikte gereguleerde
      stoffen als bedoeld in artikel 16, zesde lid, van de ozonverordening, overeenkomstig door Onze Minister te stellen
      regels worden geregistreerd en worden toegezonden aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0015507/2010-01-01#Artikel4
  - number: '5.1'
    text: |-
      Het is verboden gereguleerde stoffen bedrijfsmatig toe te passen of voorhanden te hebben in apparatuur, indien die
      apparatuur onvoldoende lekdicht is.
    url: https://wetten.overheid.nl/BWBR0015507/2010-01-01#Artikel5
  - number: '5.2'
    text: |-
      Bij ministeriële regeling worden regels gesteld ter uitvoering van artikel 17, eerste lid, eerste volzin, derde en
      vierde lid, van de ozonverordening.
    url: https://wetten.overheid.nl/BWBR0015507/2010-01-01#Artikel5
  - number: '6.1'
    text: |-
      Bij ministeriële regeling worden regels gesteld inzake de examinering en diplomering van personen die werkzaamheden
      aan apparatuur als bedoeld in artikel 16, eerste lid, van de ozonverordening verrichten.
    url: https://wetten.overheid.nl/BWBR0015507/2010-01-01#Artikel6
  - number: '6.2'
    text: |-
      Bij ministeriële regeling worden regels gesteld inzake de certificering van bedrijven die werkzaamheden aan
      apparatuur als bedoeld in artikel 16, eerste lid, van de ozonverordening verrichten.
    url: https://wetten.overheid.nl/BWBR0015507/2010-01-01#Artikel6
  - number: '6.3'
    text: |-
      Bij ministeriële regeling worden regels gesteld inzake de aanwijzing van instellingen die met de examinering en
      diplomering van personen, bedoeld in het eerste lid, of met de certificering van bedrijven, bedoeld in het tweede
      lid, zijn belast.
    url: https://wetten.overheid.nl/BWBR0015507/2010-01-01#Artikel6
  - number: '7'
    text: |-
      Het is verboden in strijd te handelen met de krachtens de [artikelen 4, eerste lid][ref1], [5, tweede lid][ref2],
      en [6][ref3] te stellen regels.


      [ref1]: https://wetten.overheid.nl/BWBR0015507#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0015507#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0015507#Artikel6
    url: https://wetten.overheid.nl/BWBR0015507/2010-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0015507
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0015507
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0015507
        artikel: '6'
  - number: '8'
    text: |-
      Na de inwerkingtreding van dit besluit berusten de
      [artikelen 1 tot en met 6 van de Inzamelingsregeling CFK en halonen][ref1] op [artikel 4, eerste lid][ref2], en
      [artikel 6, eerste lid][ref3], van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0013984#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0015507#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0015507#Artikel6
    url: https://wetten.overheid.nl/BWBR0015507/2010-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0013984
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0015507
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0015507
        artikel: '6'
  - number: '10'
    text: |-
      Dit besluit berust mede op [artikel 9.2.2.1 van de Wet milieubeheer][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0015507/2010-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
  - number: '13'
    text: |-
      Dit besluit treedt in werking met ingang van de dag waarop vier weken zijn verstreken sedert de datum van uitgifte
      van het Staatsblad waarin het wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0015507/2010-01-01#Artikel13
  - number: '14'
    text: 'Dit besluit wordt aangehaald als: Besluit ozonlaagafbrekende stoffen milieubeheer.'
    url: https://wetten.overheid.nl/BWBR0015507/2010-01-01#Artikel14
