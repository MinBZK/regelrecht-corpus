articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. Verordening: [verordening (EG) nr. 2037/2000](32000R2037) van het Europees Parlement en de Raad van de Europese
      Unie van 29 juni 2000 betreffende de ozonlaag afbrekende stoffen (PbEG L 244);

      b. gereguleerde stoffen: stoffen, genoemd in artikel 2 van de Verordening.
    url: https://wetten.overheid.nl/BWBR0015507/2004-06-09#Artikel1
  - number: '2'
    text: |-
      Daar waar de Verordening een bevoegdheid toekent aan de bevoegde instantie van een lidstaat is Onze Minister
      bevoegd te handelen.
    url: https://wetten.overheid.nl/BWBR0015507/2004-06-09#Artikel2
  - number: '3'
    text: |-
      Het is verboden:

      a. te handelen in strijd met de verboden, gesteld bij artikel 3, eerste lid, artikel 4, eerste lid in samenhang
      met het vierde lid, zesde lid, artikel 5, eerste lid, in samenhang met het tweede tot en met vijfde lid, artikel
      8, artikel 9, eerste lid, artikel 11, artikel 14, eerste lid, in samenhang met de artikelen 8, 9 en 11, tweede en
      derde lid, en artikel 22, eerste lid, van de Verordening;

      b. te handelen in strijd met de voorschriften gesteld bij artikel 3, derde lid, artikel 4, derde en vijfde lid,
      artikel 12, derde lid, artikel 16, derde en vierde lid, en artikel 19, eerste, derde en vierde lid en lid 4 bis,
      van de Verordening;

      c. te handelen in strijd met een voorschrift dat is verbonden aan een vergunning, verleend krachtens artikel 6,
      eerste lid, of artikel 12, eerste en vierde lid, van de Verordening;

      d. te handelen in strijd met de toestemming, verleend krachtens artikel 13 van de Verordening;

      e. methylbromide te produceren.
    url: https://wetten.overheid.nl/BWBR0015507/2004-06-09#Artikel3
  - number: '4'
    text: |-
      1 Een eigenaar van de apparatuur, bedoeld in artikel 16, eerste en tweede lid, van de Verordening, waarin zich
      gereguleerde stoffen bevinden, draagt er zorg voor dat bij het onderhoud van de apparatuur of voor de ontmanteling
      of verwijdering daarvan, emissie van gereguleerde stoffen zoveel mogelijk wordt beperkt en dat de gereguleerde
      stoffen worden teruggewonnen voor recycling, regeneratie of vernietiging met door Onze Minister goedgekeurde
      technieken.

      2 Bij ministeriële regeling worden voorschriften gegeven ter bevordering van de terugwinning, recycling,
      regeneratie en vernietiging van gereguleerde stoffen.

      3 Bij ministeriële regeling worden opleidingseisen gegeven waaraan het personeel dat werkzaam is in een
      terugwinnings-, vernietigings-, recycling- of regeneratie-installatie voor gereguleerde stoffen ten minste voldoet,
      alsmede voorschriften omtrent een te verkrijgen diploma en de geldigheidsduur van dat diploma.

      4 Handelingen als bedoeld in het tweede lid, zijn uitsluitend toegestaan aan een natuurlijke persoon die beschikt
      over een diploma als bedoeld in het derde lid, dat is afgegeven door een instelling die door Onze Minister van
      Onderwijs, Cultuur en Wetenschappen is erkend.

      5 De eigenaar, bedoeld in het eerste lid, draagt er zorg voor dat de gegevens over de hoeveelheden gebruikte
      gereguleerde stoffen die zijn teruggewonnen, gerecycleerd, geregenereerd of vernietigd, overeenkomstig door Onze
      Minister te stellen regels worden geregistreerd en zendt deze toe aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0015507/2004-06-09#Artikel4
  - number: '5'
    text: |-
      1 Het is verboden gereguleerde stoffen bedrijfsmatig toe te passen of voorhanden te hebben in apparatuur, indien
      die apparatuur onvoldoende lekdicht is.

      2 Bij ministeriële regeling worden regels gegeven om lekkage van gereguleerde stoffen te voorkomen of tot een
      minimum te beperken. Tot deze regels kunnen tevens regels behoren met betrekking tot het voorkomen van lekkage
      of het tot een minimum beperken daarvan in het geval de gereguleerde stoffen als grondstof of technische hulpstof
      in chemicaliën worden gebruikt of onopzettelijk bij de vervaardiging van andere chemicaliën worden geproduceerd
      en deze regels hebben in elk geval betrekking op het controleren van vaste apparatuur met meer dan 3 kilogram
      koelvloeistof.

      3 Voorzover niet krachtens de

      [Bestrijdingsmiddelenwet 1962][ref1] voorschriften zijn gegeven omtrent opleiding en examinering, worden bij
      ministeriële regeling zodanige voorschriften gegeven waaraan degenen die werken met gereguleerde stoffen en degenen
      die controles verrichten op apparatuur waaruit gereguleerde stoffen kunnen lekken, ten minste voldoen. Tot die
      voorschriften behoren in elk geval voorschriften omtrent een te verkrijgen diploma en de geldigheidsduur van dat
      diploma.

      4 Het tijdens onderhouds- of installatiewerkzaamheden aan apparatuur bedrijfsmatig toepassen van gereguleerde
      stoffen is uitsluitend toegestaan aan een natuurlijke persoon die beschikt over een diploma als bedoeld in het
      derde lid, dat is afgegeven door een instelling die door Onze Minister of door Onze Minister van Onderwijs, Cultuur
      en Wetenschappen is erkend.

      5 Bij ministeriële regeling kunnen voorschriften worden gegeven waaraan een instelling als bedoeld in het vierde
      lid voldoet om te kunnen worden erkend.


