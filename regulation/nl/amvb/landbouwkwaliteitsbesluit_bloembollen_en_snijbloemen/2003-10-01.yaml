        artikel: '2'
  - number: 1a
    text: |-
      Het is verboden om bloembollen en snijbloemen in de handel te brengen die niet voldoen aan [verordening nr. 315/68]
      (31968R0315), [verordening nr. 316/68](31968R0316), de bij die verordeningen behorende bijlagen of het bij of
      krachtens dit besluit bepaalde.
    url: https://wetten.overheid.nl/BWBR0003358/2003-10-01#Artikel1a
  - number: 1b
    text: |-
      1 Bloembollen worden slechts in de handel gebracht indien zij voldoen aan elk van de volgende voorwaarden:

      a. ze zijn nagenoeg vrij van, althans met het blote oog waarneembare, schadelijke organismen die de kwaliteit van
      de bloembollen aantasten, dan wel tekenen of symptomen daarvan die de bruikbaarheid van de bloembollen schaden;

      b. ze zijn nagenoeg vrij van gebreken die de kwaliteit van de bloembollen kunnen aantasten;

      c. ze hebben voldoende groeikracht en afmetingen met het oog op hun bruikbaarheid als bloembollen;

      d. ze zijn rechtstreeks afkomstig van teeltmateriaal dat in het stadium van staand gewas bij controle nagenoeg vrij
      is bevonden van schadelijke organismen en ziekten, dan wel tekenen of symptomen daarvan;

      e. ze bezitten, indien verhandeld met een verwijzing naar het ras overeenkomstig [artikel 1d][ref1], voldoende
      rasidentiteit en raszuiverheid.

      2 Bloembollen die op basis van zichtbare tekenen of symptomen niet nagenoeg vrij zijn van schadelijke organismen
      worden op adequate wijze behandeld of, zo nodig, verwijderd.

      3 De vorige leden zijn niet van toepassing op bloembollen bestemd voor proeven of wetenschappelijke doeleinden,
      voor selectie of voor instandhouding van de genetische diversiteit.


      [ref1]: https://wetten.overheid.nl/BWBR0003358#Artikel1d
    url: https://wetten.overheid.nl/BWBR0003358/2003-10-01#Artikel1b
    references:
      - id: ref1
        bwb_id: BWBR0003358
        artikel: 1d
  - number: 1c
    text: |-
      1 Leveranciers van bloembollen houden gegevens bij met betrekking tot kritische punten in hun productieproces die
      de kwaliteit van het teeltmateriaal beïnvloeden en nemen zonodig monsters voor analyse in een laboratorium dat
      beschikt over passende faciliteiten en over passende deskundigheid.

      2 Leveranciers van bloembollen zorgen ervoor dat partijen bloembollen tijdens de productie afzonderlijk
      identificeerbaar blijven.

      3 Leveranciers brengen bloembollen in afzonderlijke partijen in de handel, vergezeld van een etiket of een ander
      document dat door de leverancier is opgemaakt.

      4 In afwijking van het derde lid kunnen bloembollen van verschillende partijen in een zending in de handel worden
      gebracht mits de leverancier registers bijhoudt van de samenstelling en oorsprong van de verschillende partijen.

      5 Het in het derde lid bedoelde etiket of document bevat in ieder geval de volgende gegevens:

      a. de vermelding «EG-kwaliteit»;

      b. de vermelding «NL»;

      c. de vermelding «BKD»;

      d. het registratienummer van de stichting BKD;

      e. de datum van afgifte;

      f. de botanische benaming;

      g. de naam van het ras of de plantengroep;

      h. de hoeveelheid;

      i. bij invoer uit een derde land, naam van het land van productie.

      6 Het derde tot en met het vijfde lid zijn niet van toepassing op bloembollen die in de handel worden gebracht voor
      personen die zich niet beroepshalve bezighouden met de productie of verkoop van bloembollen.
    url: https://wetten.overheid.nl/BWBR0003358/2003-10-01#Artikel1c
  - number: 1d
    text: |-
      1 Bloembollen worden alleen met een verwijzing naar het ras in de handel gebracht, indien het betrokken ras:

      a. wettelijke bescherming geniet uit hoofde van een kwekersrecht overeenkomstig het bepaalde bij of krachtens de
      [Zaaizaad- en Plantgoedwet][ref1];

      b. officieel geregistreerd is op basis van de [][ref2]

      [Zaaizaad- en Plantgoedwet][ref3];

      c. algemeen bekend is, of

      d. voorkomt op een lijst van een leverancier met zijn benaming en een gedetailleerde beschrijving.

      2 Indien bloembollen in de handel worden gebracht met verwijzing naar een andere plantengroep en niet naar een ras
      als bedoeld in het eerste lid, beschrijft de leverancier deze plantengroep zodanig dat verwarring met een rasnaam
      wordt voorkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002541
      [ref2]: https://wetten.overheid.nl/BWBR0002541
      [ref3]: https://wetten.overheid.nl/BWBR0002541
    url: https://wetten.overheid.nl/BWBR0003358/2003-10-01#Artikel1d
    references:
      - id: ref1
        bwb_id: BWBR0002541
      - id: ref2
        bwb_id: BWBR0002541
      - id: ref3
        bwb_id: BWBR0002541
  - number: 1e
    text: |-
      1 Bloembollen afkomstig uit derde landen worden slechts in de handel gebracht nadat de invoer, tezamen met
      een schriftelijke verklaring dat het ingevoerde materiaal in alle opzichten dezelfde garanties verschaft als
      bloembollen die in de Europese Unie overeenkomstig [richtlijn nr. 98/56/EG](31998L0056) zijn geproduceerd, vooral
      wat kwaliteit, identificatie en fytosanitaire aspecten betreft, is gemeld aan de stichting BKD.

      2 De importeur houdt inkoopdocumenten of een ander schriftelijk bewijs bij van het contract met de leverancier in
      een derde land.
    url: https://wetten.overheid.nl/BWBR0003358/2003-10-01#Artikel1e
  - number: 1f
    text: |-
      1 Leveranciers worden geregistreerd door de stichting BKD.

      2 Aan het eerste lid is in ieder geval voldaan:

      a. indien de leveranciers zijn aangesloten bij de stichting BKD, of

      b. indien de leveranciers zijn geregistreerd op grond van
      [artikel 17 van de Regeling invoer, uitvoer en verkeer van planten][ref1].

      3 De in het eerste lid bedoelde registratie omvat tenminste elk van de volgende gegevens:

      a. naam en handelsnaam van de leverancier;

      b. adres en woonplaats of plaats van vestiging van de leverancier;

      c. een aanduiding van het gewas, de gewassen of de gewasgroepen ter zake van de productie van bloembollen.

      4 Het eerste lid is niet van toepassing op leveranciers die alleen verkopen of leveren aan personen die zich niet
      beroepshalve bezighouden met de productie of verkoop van bloembollen.

      5 Indien bloembollen in de handel worden gebracht, houden de geregistreerde leveranciers ten minste twaalf maanden
      lang een register van hun verkoop of aankoop bij.


      [ref1]: https://wetten.overheid.nl/BWBR0005997#Artikel17
    url: https://wetten.overheid.nl/BWBR0003358/2003-10-01#Artikel1f
    references:
      - id: ref1
        bwb_id: BWBR0005997
        artikel: '17'
  - number: 1g
    text: |-
      De artikelen 1c, vijfde lid, 1d, eerste lid, en 1f zijn niet van toepassing op bloembollen die zijn voortgebracht
      of in het verkeer gebracht in een andere lidstaat van de Europese Unie, voldoen aan de bij of krachtens [richtlijn
      nr. 98/56/EG](31998L0056) gestelde eisen en ten bewijze daarvan worden begeleid door een officieel document.
    url: https://wetten.overheid.nl/BWBR0003358/2003-10-01#Artikel1g
  - number: '2'
    text: |-
      1 Onze Minister kan nadere regels stellen over het telen van bloembollen.

      2 Onze Minister kan tevens nadere regels stellen over het in de handel brengen van bloembollen of snijbloemen:

      a. voor zover hiermee een nadere invulling wordt gegeven aan de in [artikel 1b, eerste lid][ref1], bedoelde
      voorwaarden, of

      b. voor het treffen van afwijkende maatregelen met betrekking tot de kwaliteitsnormen bij de uitvoer naar derde
      landen van bloembollen, onderscheidenlijk snijbloemen, als bedoeld in [verordening 537/70](31970R0537) en de bij
      die verordening behorende bijlage, onderscheidenlijk als bedoeld in [verordening 801/71](31971R0801).


      [ref1]: https://wetten.overheid.nl/BWBR0003358#Artikel1b
    url: https://wetten.overheid.nl/BWBR0003358/2003-10-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003358
        artikel: 1b
  - number: '3'
    text: |-
      De in [artikel 2][ref1] bedoelde nadere regelen kunnen per cultuurgewas, soort of ras verschillen en mede
      betrekking hebben op:

        - de indeling in kwaliteitsklassen, de groottesortering, de oorsprong, alsmede de aanduiding daarvan;
        - de hoedanigheid en het gebruik van verpakkingsmiddelen;
        - de inrichting en het gebruik van bedrijfsgebouwen en vervoermiddelen;
        - het gebruik van machines, werktuigen en gereedschappen;
        - de benaming.


      [ref1]: https://wetten.overheid.nl/BWBR0003358#Artikel2
    url: https://wetten.overheid.nl/BWBR0003358/2003-10-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003358
        artikel: '2'
  - number: '5'
    text: |-
      1 Bloembollen van door Onze Minister aan te wijzen cultuurgewassen, soorten of rassen die overeenkomstig hiertoe
      door hem gestelde nadere regelen zijn behandeld, kunnen worden voorzien van een krachtens [artikel 8][ref1]
      hiervoor vastgesteld merk.

      2 De regelen, als bedoeld in het eerste lid, kunnen verschillen naar gelang van het gebruiksdoel of de geografische
      bestemming. Zij kunnen mede betrekking hebben op het tijdstip en de wijze van vervoer.


      [ref1]: https://wetten.overheid.nl/BWBR0003358#Artikel8
    url: https://wetten.overheid.nl/BWBR0003358/2003-10-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003358
        artikel: '8'
  - number: '6'
    text: |-
      1 Onze Minister kan bepalen dat de in [artikel 2][ref1] en 5 bedoelde nadere regelen bij verordening worden gesteld
      door het bestuur van het productschap.

      2 Onze Minister kan bepalen dat krachtens verordening, als bedoeld in het eerste lid, genomen besluiten de
      goedkeuring behoeven van een door hem aangewezen autoriteit.


      [ref1]: https://wetten.overheid.nl/BWBR0003358#Artikel2
    url: https://wetten.overheid.nl/BWBR0003358/2003-10-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0003358
        artikel: '2'
  - number: '7'
    text: |-
      Onderworpen aan een keuring, volgens door Onze Minister te stellen regelen, zijn

      a. bloembollen waarvoor nadere regelen op grond van [artikel 2][ref1] zijn gesteld;

      b. bloembollen waarvoor een merk als bedoeld in [artikel 5, eerste lid][ref2], wordt gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0003358#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003358#Artikel5
    url: https://wetten.overheid.nl/BWBR0003358/2003-10-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0003358
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0003358
        artikel: '5'
  - number: '8'
    text: |-
      1 Onze Minister kan merken, tekenen en bewijsstukken vaststellen, als bedoeld in artikel 7, eerste lid, van de wet,
      welke kunnen verschillen naar ras, soort, cultuurgewas, behandeling of kwaliteitsklasse van de bloembollen.

      2 Onze Minister kan regelen stellen inzake de gebruikmaking van merken, tekenen en bewijsstukken.

      3 Onze Minister kan regelen stellen betreffende het vervaardigen, voorhanden en in voorraad hebben zomede het
      afleveren en gebruiken van in het eerste lid bedoelde merken, tekenen of bewijsstukken en van cliché's, stempels en
      andere werktuigen tot het vervaardigen of aanbrengen van die merken, tekenen of bewijsstukken.
    url: https://wetten.overheid.nl/BWBR0003358/2003-10-01#Artikel8
  - number: '9'
    text: |-
      1 Het is verboden de in [artikel 8][ref1] bedoelde merken, tekenen of bewijsstukken te bezigen in strijd met het
      bij of krachtens dit besluit bepaalde.

      2 Het is verboden voor bloembollen aanduidingen te bezigen welke sterk gelijken op de in [artikel 8][ref2] bedoelde
      merken, tekenen of bewijsstukken.


      [ref1]: https://wetten.overheid.nl/BWBR0003358#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0003358#Artikel8
    url: https://wetten.overheid.nl/BWBR0003358/2003-10-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003358
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0003358
        artikel: '8'
  - number: '10'
    text: |-
      Het telen en het behandelen van bloembollen, die op grond van [artikel 7][ref1] aan een keuring onderworpen zijn,
      is uitsluitend toegestaan aan aangeslotenen van de in [artikel 11][ref2] genoemde instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0003358#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0003358#Artikel11
    url: https://wetten.overheid.nl/BWBR0003358/2003-10-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003358
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0003358
        artikel: '11'
  - number: '11'
    text: |-
      De stichting BKD:

      a. is belast met de registratie van leveranciers, bedoeld in [artikel 1f, eerste lid][ref1];

      b. is belast met het toezicht op de naleving van de bij haar aangeslotenen van het bij of krachtens het besluit ten
      aanzien van bloembollen bepaalde;

      c. is belast met de keuring, bedoeld in [artikel 7][ref2];

      d. is bevoegd tot het uitreiken van de merken, tekenen of bewijsstukken, bedoeld in de [artikelen 5][ref3] en
      [8][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0003358#Artikel1f
      [ref2]: https://wetten.overheid.nl/BWBR0003358#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0003358#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0003358#Artikel8
    url: https://wetten.overheid.nl/BWBR0003358/2003-10-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0003358
        artikel: 1f
      - id: ref2
        bwb_id: BWBR0003358
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0003358
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0003358
        artikel: '8'
  - number: '12'
    text: |-
      1 De voorzitter van de in [artikel 11][ref1] genoemde instelling wordt door Onze Minister telkens voor ten hoogte
      vier jaren benoemd. Hij is terstond weder benoembaar.

      2 Het bestuur van de in [artikel 11][ref2] genoemde instelling doet aan Onze Minister een voordracht voor de
      benoeming.

      3 De voorzitter mag niet rechtstreeks betrokken zijn bij de teelt van of de handel in bloembollen.


      [ref1]: https://wetten.overheid.nl/BWBR0003358#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0003358#Artikel11
    url: https://wetten.overheid.nl/BWBR0003358/2003-10-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0003358
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0003358
        artikel: '11'
  - number: '13'
    text: |-
      1 Onze Minister kan vrijstelling en, op aanvraag, ontheffing verlenen van het bepaalde bij of krachtens dit
      besluit.

      2 Onze Minister kan bepalen dat een ontheffing als in het eerste lid bedoeld, door de in [artikel 11][ref1]
      genoemde instelling kan worden verleend.

      3 Onze Minister kan bepalen dat een vrijstelling of een ontheffing als in het eerste lid bedoeld, door het
      productschap wordt verleend. Hij kan voorts bepalen dat een besluit, waarbij een zodanige vrijstelling wordt
      verleend, de goedkeuring behoeft van een door hem aangewezen autoriteit.


      [ref1]: https://wetten.overheid.nl/BWBR0003358#Artikel11
    url: https://wetten.overheid.nl/BWBR0003358/2003-10-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003358
        artikel: '11'
  - number: '14'
    text: Het Uitvoercontrolebesluit 1951 (Bloembollen) (*Stb.* 329) is buiten werking gesteld.
    url: https://wetten.overheid.nl/BWBR0003358/2003-10-01#Artikel14
  - number: '15'
    text: Dit besluit kan worden aangehaald als "Landbouwkwaliteitsbesluit bloembollen en snijbloemen".
    url: https://wetten.overheid.nl/BWBR0003358/2003-10-01#Artikel15
  - number: '16'
    text: Dit besluit treedt in werking met ingang van 1 augustus 1981.
    url: https://wetten.overheid.nl/BWBR0003358/2003-10-01#Artikel16
