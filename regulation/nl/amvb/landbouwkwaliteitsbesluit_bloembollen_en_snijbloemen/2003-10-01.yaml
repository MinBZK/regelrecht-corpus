preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Ministers van Landbouw en Visserij en van Economische Zaken van 30 januari 1980, Directie
    Juridische en Bedrijfsorganisatorische Zaken, no. J 385;

    Gehoord het Produktschap voor Siergewassen, het Landbouwschap, de Stichting Bloembollenkeuringsdienst;

    Overwegende dat, ter bevordering van de afzet van bloembollen, regelen betreffende het technische en genetische
    peil van de produktie van bloembollen dienen te worden gesteld; dat deze regelen in het bijzonder de kwaliteit van
    bloembollen, die als uitgangsmateriaal voor de bloembollenproduktie dan wel de bolbloemenproduktie dienen, moeten
    betreffen;

    Gelet op de artikelen 2, 3, 4, 7, 8 en 9, eerste lid, 12, eerste lid, en 19, eerste lid, van de
    Landbouwkwaliteitswet (Stb. 1971, 371);

    De Raad van State gehoord (advies van 19 maart 1980, no. 19);

    Gezien het nader rapport van Onze Ministers van Landbouw en Visserij en van Economische Zaken van 12 november 1980,
    Directie Juridische en Bedrijfsorganisatorische Zaken, no. J 4435;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0003358/2003-10-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. Onze Minister: Minister van Landbouw, Natuur en Voedselkwaliteit;

      b. wet: [Landbouwkwaliteitswet][ref1];

      c. bloembollen: bollen, knollen, wortelstokken en andere voor vermeerdering of bloemproductie bestemde plantendelen
      van de in de bijlage van dit besluit onder I genoemde gewassen, voor zover zij behoren tot de daarachter onder II
      vermelde botanische families, geslachten of soorten;

      d. snijbloemen: gewassen als bedoeld in artikel 1, eerste lid, van [verordening nr. 316/68](31968R0316);

      e. teeltmateriaal: hetgeen daaronder wordt verstaan in artikel 2, eerste lid, van [richtlijn nr. 98/56/EG]
      (31998L0056);

      f. leverancier: hetgeen daaronder wordt verstaan in artikel 2, tweede lid, van [richtlijn nr. 98/56/EG]
      (31998L0056);

      g. in de handel brengen: hetgeen daaronder wordt verstaan in artikel 2, derde lid, van [richtlijn nr. 98/56/EG]
      (31998L0056);

      h. partij: hetgeen daaronder wordt verstaan in artikel 2, vijfde lid, van [richtlijn nr. 98/56/EG](31998L0056);

      i. telen: het bedrijfsmatig voortbrengen van een gewas, alsmede elke handeling die hiermede rechtstreeks verband
      houdt;

      j. ras: hetgeen daaronder wordt verstaan in [artikel 2 van de Zaaizaad- en Plantgoedwet][ref2];

      k. behandelen: het bedrijfsmatig verrichten van handelingen, die bloembollen geschikt maken voor het gebruiksdoel
      of de geografische bestemming;

      l. productschap: Productschap Tuinbouw;

      m. stichting BKD: Stichting Bloembollenkeuringsdienst te Hillegom;

      n. [verordening nr. 315/68](31968R0315): [verordening (EEG) nr. 315/68](31968R0315) van de Raad van de Europese
      Gemeenschappen van 12 maart 1968 houdende vaststelling van kwaliteitsnormen voor bloembollen en bloemknollen (PbEG
      L 71);

      o. [verordening nr. 316/68](31968R0316): [verordening (EEG) nr. 316/68](31968R0316) van de Raad van de Europese
      Gemeenschappen van 12 maart 1968 houdende vaststelling van kwaliteitsnormen voor verse snijbloemen en vers
      snijgroen (PbEG L 71);

      p. [verordening 537/70](31970R0537): [verordening (EEG) nr. 537/70](31970R0537) van de Commissie van de Europese
      Gemeenschappen van 23 maart 1970 houdende machtiging van de lidstaten tot het treffen van maatregelen die afwijken
      van bepaalde criteria van de kwaliteitsnormen bij uitvoer naar derde landen van bloembollen en bloemknollen (PbEG
      L 67);

      q. [verordening 801/71](31971R0801): [verordening (EEG) nr. 801/71](31971R0801) van de Commissie van de Europese
      Gemeenschappen van 19 april 1971 houdende machtiging van de lidstaten tot het treffen van maatregelen die afwijken
      van bepaalde criteria voor de kwaliteitsnormen bij uitvoer van verse snijbloemen naar derde landen (PbEG L 88);

      r. [richtlijn nr. 98/56/EG](31998L0056): [richtlijn nr. 98/56/EG](31998L0056) van de Raad van de Europese Unie van
      20 juli 1998 betreffende het in de handel brengen van teeltmateriaal van siergewassen (PbEG L 226);

      s. derde landen: landen die geen deel uitmaken van de Europese Unie.


      [ref1]: https://wetten.overheid.nl/BWBR0002755
      [ref2]: https://wetten.overheid.nl/BWBR0002541#Artikel2
    url: https://wetten.overheid.nl/BWBR0003358/2003-10-01#Artikel1
    references:
      - id: ref1
