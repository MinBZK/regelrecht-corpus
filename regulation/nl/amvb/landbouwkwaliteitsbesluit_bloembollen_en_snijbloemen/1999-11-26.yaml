---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.5.2/schema.json
$id: landbouwkwaliteitsbesluit_bloembollen_en_snijbloemen
regulatory_layer: AMVB
publication_date: '2007-09-27'
valid_from: '1999-11-26'
bwb_id: BWBR0003358
url: https://wetten.overheid.nl/BWBR0003358/1999-11-26
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Ministers van Landbouw en Visserij en van Economische Zaken van 30 januari 1980, Directie
    Juridische en Bedrijfsorganisatorische Zaken, no. J 385;

    Gehoord het Produktschap voor Siergewassen, het Landbouwschap, de Stichting Bloembollenkeuringsdienst;

    Overwegende dat, ter bevordering van de afzet van bloembollen, regelen betreffende het technische en genetische
    peil van de produktie van bloembollen dienen te worden gesteld; dat deze regelen in het bijzonder de kwaliteit van
    bloembollen, die als uitgangsmateriaal voor de bloembollenproduktie dan wel de bolbloemenproduktie dienen, moeten
    betreffen;

    Gelet op de artikelen 2, 3, 4, 7, 8 en 9, eerste lid, 12, eerste lid, en 19, eerste lid, van de
    Landbouwkwaliteitswet (Stb. 1971, 371);

    De Raad van State gehoord (advies van 19 maart 1980, no. 19);

    Gezien het nader rapport van Onze Ministers van Landbouw en Visserij en van Economische Zaken van 12 november 1980,
    Directie Juridische en Bedrijfsorganisatorische Zaken, no. J 4435;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0003358/1999-11-26#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      "wet": [Landbouwkwaliteitswet][ref1] (*Stb.* 1971, 371);

      productschap: Productschap Tuinbouw;

      "bloembollen": bollen, knollen, wortelstokken en andere voor vermeerdering of bloemproductie bestemde plantendelen
      van de in de bijlage van dit besluit onder I genoemde gewassen, voor zover zij behoren tot de daarachter onder II
      vermelde botanische families, geslachten of soorten;

      "verhandelen": het bedrijfsmatig ten verkoop voorhanden of in voorraad hebben, te koop aanbieden, verkopen of
      afleveren;

      "telen": het bedrijfsmatig voortbrengen van een gewas, alsmede elke handeling die hiermede rechtstreeks verband
      houdt;

      "ras": een tot een cultuurgewas behorende groep van planten, die voor cultuurdoeleinden als een zelfstandige
      eenheid wordt beschouwd;

      "behandelen": het bedrijfsmatig verrichten van handelingen, die inhouden bloembollen geschikt te maken voor het
      gebruiksdoel of de geografische bestemming.


      [ref1]: https://wetten.overheid.nl/BWBR0002755
    url: https://wetten.overheid.nl/BWBR0003358/1999-11-26#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002755
  - number: '2'
    text: |-
      1 Onze Minister kan nadere regelen stellen ten aanzien van het telen van bloembollen.

      2 Het is verboden bloembollen, waarvoor nadere regelen als bedoeld in het eerste lid zijn gesteld, te telen anders
      dan overeenkomstig zodanige regelen.

      3 Het is verboden bloembollen te verhandelen of bedrijfsmatig te vervoeren indien zij niet

      a. gezond, soortecht of rasecht, vrij van vreemde bestanddelen, intact, vrij van abnormale uitwendige vochtigheid,
      goed ontwikkeld en practisch vrij van gebreken zijn;

      b. in verband met het gebruiksdoel of de geografische bestemming voldoende groei- en bloeikracht bezitten;

      een en ander met inachtneming van dienaangaande, krachtens het vierde lid gestelde nadere regelen.

      4 Onze Minister kan nadere regelen stellen ten aanzien van het verhandelen en bedrijfsmatig vervoeren van
      bloembollen.

      5 Het in het derde lid bedoelde verbod geldt niet voor het verhandelen of bedrijfsmatig vervoeren van bloembollen,
      die kennelijk bestemd zijn te worden afgezet aan de uiteindelijke verbruiker voor zijn persoonlijke behoefte.
    url: https://wetten.overheid.nl/BWBR0003358/1999-11-26#Artikel2
  - number: '3'
    text: |-
      De in [artikel 2][ref1] bedoelde nadere regelen kunnen per cultuurgewas, soort of ras verschillen en mede
      betrekking hebben op:

        - de indeling in kwaliteitsklassen, de groottesortering, de oorsprong, alsmede de aanduiding daarvan;
        - de hoedanigheid en het gebruik van verpakkingsmiddelen;
        - de inrichting en het gebruik van bedrijfsgebouwen en vervoermiddelen;
        - het gebruik van machines, werktuigen en gereedschappen;
        - de benaming.


      [ref1]: https://wetten.overheid.nl/BWBR0003358#Artikel2
    url: https://wetten.overheid.nl/BWBR0003358/1999-11-26#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003358
        artikel: '2'
  - number: '4'
    text: |-
      De eisen gesteld in [artikel 2, derde lid][ref1], gelden niet ten aanzien van bloembollen die binnen Nederland door
      de teler bedrijfsmatig worden vervoerd naar een onderdeel van zijn bedrijf.


      [ref1]: https://wetten.overheid.nl/BWBR0003358#Artikel2
    url: https://wetten.overheid.nl/BWBR0003358/1999-11-26#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003358
        artikel: '2'
  - number: '5'
    text: |-
      1 Bloembollen van door Onze Minister aan te wijzen cultuurgewassen, soorten of rassen die overeenkomstig hiertoe
      door hem gestelde nadere regelen zijn behandeld, kunnen worden voorzien van een krachtens [artikel 8][ref1]
      hiervoor vastgesteld merk.

      2 De regelen, als bedoeld in het eerste lid, kunnen verschillen naar gelang van het gebruiksdoel of de geografische
      bestemming. Zij kunnen mede betrekking hebben op het tijdstip en de wijze van vervoer.


      [ref1]: https://wetten.overheid.nl/BWBR0003358#Artikel8
    url: https://wetten.overheid.nl/BWBR0003358/1999-11-26#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003358
        artikel: '8'
  - number: '6'
    text: |-
      1 Onze Minister kan bepalen dat de in [artikel 2][ref1] en 5 bedoelde nadere regelen bij verordening worden gesteld
      door het bestuur van het productschap.

      2 Onze Minister kan bepalen dat krachtens verordening, als bedoeld in het eerste lid, genomen besluiten de
      goedkeuring behoeven van een door hem aangewezen autoriteit.


      [ref1]: https://wetten.overheid.nl/BWBR0003358#Artikel2
    url: https://wetten.overheid.nl/BWBR0003358/1999-11-26#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0003358
        artikel: '2'
  - number: '7'
    text: |-
      Onderworpen aan een keuring, volgens door Onze Minister te stellen regelen, zijn

      a. bloembollen waarvoor nadere regelen op grond van [artikel 2][ref1] zijn gesteld;

      b. bloembollen waarvoor een merk als bedoeld in [artikel 5, eerste lid][ref2], wordt gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0003358#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003358#Artikel5
    url: https://wetten.overheid.nl/BWBR0003358/1999-11-26#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0003358
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0003358
        artikel: '5'
  - number: '8'
    text: |-
      1 Onze Minister kan merken, tekenen en bewijsstukken vaststellen, als bedoeld in artikel 7, eerste lid, van de wet,
      welke kunnen verschillen naar ras, soort, cultuurgewas, behandeling of kwaliteitsklasse van de bloembollen.

      2 Onze Minister kan regelen stellen inzake de gebruikmaking van merken, tekenen en bewijsstukken.

      3 Onze Minister kan regelen stellen betreffende het vervaardigen, voorhanden en in voorraad hebben zomede het
      afleveren en gebruiken van in het eerste lid bedoelde merken, tekenen of bewijsstukken en van cliché's, stempels en
      andere werktuigen tot het vervaardigen of aanbrengen van die merken, tekenen of bewijsstukken.
    url: https://wetten.overheid.nl/BWBR0003358/1999-11-26#Artikel8
  - number: '9'
    text: |-
      1 Het is verboden de in [artikel 8][ref1] bedoelde merken, tekenen of bewijsstukken te bezigen in strijd met het
      bij of krachtens dit besluit bepaalde.

      2 Het is verboden voor bloembollen aanduidingen te bezigen welke sterk gelijken op de in [artikel 8][ref2] bedoelde
      merken, tekenen of bewijsstukken.


      [ref1]: https://wetten.overheid.nl/BWBR0003358#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0003358#Artikel8
    url: https://wetten.overheid.nl/BWBR0003358/1999-11-26#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003358
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0003358
        artikel: '8'
  - number: '10'
    text: |-
      Het telen en het behandelen van bloembollen, die op grond van [artikel 7][ref1] aan een keuring onderworpen zijn,
      is uitsluitend toegestaan aan aangeslotenen van de in [artikel 11][ref2] genoemde instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0003358#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0003358#Artikel11
    url: https://wetten.overheid.nl/BWBR0003358/1999-11-26#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003358
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0003358
        artikel: '11'
  - number: '11'
    text: |-
      De Stichting Bloembollenkeuringsdienst te Hillegom:

        - is belast met het toezicht op de naleving door de bij haar aangeslotenen van het bij of krachtens dit besluit
      bepaalde;
        - is belast met de keuring als bedoeld in [artikel 7][ref1];
        - is bevoegd tot het uitreiken van de merken, tekenen of bewijsstukken, bedoeld in de [artikelen 5][ref2] en
      [8][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003358#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0003358#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0003358#Artikel8
    url: https://wetten.overheid.nl/BWBR0003358/1999-11-26#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0003358
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0003358
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0003358
        artikel: '8'
  - number: '12'
    text: |-
      1 De voorzitter van de in [artikel 11][ref1] genoemde instelling wordt door Onze Minister telkens voor ten hoogte
      vier jaren benoemd. Hij is terstond weder benoembaar.

      2 Het bestuur van de in [artikel 11][ref2] genoemde instelling doet aan Onze Minister een voordracht voor de
      benoeming.

      3 De voorzitter mag niet rechtstreeks betrokken zijn bij de teelt van of de handel in bloembollen.


      [ref1]: https://wetten.overheid.nl/BWBR0003358#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0003358#Artikel11
    url: https://wetten.overheid.nl/BWBR0003358/1999-11-26#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0003358
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0003358
        artikel: '11'
  - number: '13'
    text: |-
      1 Onze Minister kan vrijstelling en, op aanvraag, ontheffing verlenen van het bepaalde bij of krachtens dit
      besluit.

      2 Onze Minister kan bepalen dat een ontheffing als in het eerste lid bedoeld, door de in [artikel 11][ref1]
      genoemde instelling kan worden verleend.

      3 Onze Minister kan bepalen dat een vrijstelling of een ontheffing als in het eerste lid bedoeld, door het
      productschap wordt verleend. Hij kan voorts bepalen dat een besluit, waarbij een zodanige vrijstelling wordt
      verleend, de goedkeuring behoeft van een door hem aangewezen autoriteit.


      [ref1]: https://wetten.overheid.nl/BWBR0003358#Artikel11
    url: https://wetten.overheid.nl/BWBR0003358/1999-11-26#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003358
        artikel: '11'
  - number: '14'
    text: Het Uitvoercontrolebesluit 1951 (Bloembollen) (*Stb.* 329) is buiten werking gesteld.
    url: https://wetten.overheid.nl/BWBR0003358/1999-11-26#Artikel14
  - number: '15'
    text: Dit besluit kan worden aangehaald als "Landbouwkwaliteitsbesluit bloembollen".
    url: https://wetten.overheid.nl/BWBR0003358/1999-11-26#Artikel15
  - number: '16'
    text: Dit besluit treedt in werking met ingang van 1 augustus 1981.
    url: https://wetten.overheid.nl/BWBR0003358/1999-11-26#Artikel16
