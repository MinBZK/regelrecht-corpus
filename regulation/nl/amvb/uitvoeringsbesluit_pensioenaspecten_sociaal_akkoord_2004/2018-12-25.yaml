articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      - deelnemingsjaren: perioden als bedoeld in [artikel 10ab van het Uitvoeringsbesluit loonbelasting 1965][ref1];
      - pensioenuitvoerder: bestuur van een pensioenfonds, beroepspensioenfonds of verzekeraar;
      - waardeoverdracht: afkoop van pensioen of aanspraken op pensioen, onder aanwending van de afkoopsom voor het
      verwerven van pensioen of aanspraken op pensioen bij een andere pensioenuitvoerder.


      [ref1]: https://wetten.overheid.nl/BWBR0002489#Artikel10ab
    url: https://wetten.overheid.nl/BWBR0018605/2018-12-25#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002489
        artikel: 10ab
  - number: '2'
    text: >-
      1 Een pensioenuitvoerder verstrekt binnen drie maanden na ontvangst van een daartoe strekkend verzoek van een
      deelnemer of gewezen deelnemer een opgave van de geadministreerde deelnemingsjaren en alle schriftelijke bescheiden
      die de perioden, voorafgaand aan een voor 1 januari 2005 gedane waardeoverdracht naar de pensioenuitvoerder, kunnen
      staven die als deelnemingsjaren kunnen worden aangemerkt.


      2 De opgave van de geadministreerde deelnemingsjaren bevat tevens:


      a. een zo nauwkeurig mogelijke opgave van de perioden waarin de geadministreerde deelnemingsjaren zijn opgebouwd;
      en


      b. een zo nauwkeurig mogelijke opgave van de deeltijdfactor per geadministreerd deelnemingsjaar.


      3 De pensioenuitvoerder kan een vergoeding vragen voor de aan de verstrekking van de opgave verbonden kosten.
    url: https://wetten.overheid.nl/BWBR0018605/2018-12-25#Artikel2
  - number: '3'
    text: |-
      1 In geval van waardeoverdracht verstrekt de overdragende pensioenuitvoerder
      aan de overnemende pensioenuitvoerder bij de opgave, bedoeld in
      [artikel 18 van het Besluit uitvoering Pensioenwet en Wet verplichte beroepspensioenregeling][ref1], een opgave van
      de geadministreerde deelnemingsjaren als bedoeld in [artikel 2][ref2]. Tevens verstrekt de pensioenuitvoerder alle
      schriftelijke bescheiden die de als deelnemingsjaren aan te merken perioden, voorafgaand aan een voor 1 januari
      2005 gedane waardeoverdracht naar de overdragende pensioenuitvoerder, kunnen staven.

      2 De overnemende pensioenuitvoerder administreert de deelnemingsjaren, opgegeven door de overdragende
      pensioenuitvoerder en de gegevens, bedoeld in [artikel 2, tweede lid][ref3], en de met de in het eerste lid
      bedoelde bescheiden gestaafde deelnemingsjaren, of bewaart deze bescheiden.


      [ref1]: https://wetten.overheid.nl/BWBR0020892#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0018605#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0018605#Artikel2
    url: https://wetten.overheid.nl/BWBR0018605/2018-12-25#Artikel3
