        artikel: 19g
      - id: ref2
        bwb_id: BWBR0018605
        artikel: '6'
        paragraaf: '4'
  - number: '9'
    text: |-
      De overdragende pensioenuitvoerder betaalt de afkoopsom binnen een maand na ontvangst van het daartoe strekkende
      verzoek, bedoeld in [artikel 8][ref1], aan de uitvoerder van de levensloopregeling, bedoeld in artikel
      [19g, eerste lid, van de Wet op de loonbelasting 1964][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0018605#Artikel8
