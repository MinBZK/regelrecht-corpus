        artikel: '4'
        paragraaf: '3'
  - number: '6'
    text: |-
      1 De pensioenuitvoerder heeft de opgave, bedoeld in
      [artikel 17, zesde lid, van de Pensioen- en spaarfondsenwet][ref1], binnen een jaar na het tijdstip van
      inwerkingtreding van dit besluit verstrekt.

      2 De opgave bevat:

      a. indien de pensioenregeling deze mogelijkheid biedt, de aanspraken op extra ouderdomspensioen voor de situatie
      waarin de premievrije waarde wordt omgezet in ouderdomspensioenaanspraken;

      b. de afkoopsom voor de situatie waarin de premievrije waarde wordt aangewend ten behoeve van een
      levensloopregeling als bedoeld in [artikel 19g, eerste lid, van de Wet op de loonbelasting 1964][ref2], van de
      deelnemer of gewezen deelnemer; en

      c. de aanspraken op een of meerdere pensioenuitkeringen voorafgaand aan de datum waarop de deelnemer of gewezen
      deelnemer de leeftijd van 65 jaren bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0002089#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel19g
    url: https://wetten.overheid.nl/BWBR0018605/2018-12-25#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002089
        artikel: '17'
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 19g
  - number: '7'
    text: |-
      1 Pensioenuitvoerders berekenen:

      a. de pensioenaanspraken, bedoeld in [artikel 6, tweede lid, onderdeel a][ref1], overeenkomstig [artikel 76][ref2]
      en [83 van de Pensioenwet][ref3] en [artikel 91 van de Wet verplichte beroepspensioenregeling][ref4];

      b. de afkoopsom, bedoeld in [artikel 6, tweede lid, onderdeel b][ref5], op basis van de actuariële grondslagen; en

      c. de aanspraken, bedoeld in [artikel 6, tweede lid, onderdeel c][ref6], overeenkomstig
      [artikel 55 van de Pensioenwet][ref7] en [artikel 66 van de Wet verplichte beroepspensioenregeling][ref8].

      2

      3 Wanneer de in de pensioenregeling van de betrokken deelnemer of gewezen deelnemer vastgestelde ingangsdatum van
      het pensioen lager is dan 65 jaren, vinden de berekeningen, bedoeld in het eerste lid, onderdelen b en c, plaats
      na eerst de premievrije waarde van de totale evenredige aanspraken in de pensioenregeling te hebben verminderd met
      de evenredige aanspraken in de pensioenregeling voor zover die na het bereiken van de leeftijd van 65 jaren worden
      uitgekeerd.

      4 In dit artikel wordt onder de actuariële grondslagen verstaan:

      a. de grondslagen die een pensioenfonds of beroepspensioenfonds volgens zijn actuariële en bedrijfstechnische nota
      hanteert voor de waardering van zijn pensioenverplichtingen; onderscheidenlijk

      b. de actuariële methoden die een verzekeraar hanteert voor de vaststelling van de technische voorzieningen.


