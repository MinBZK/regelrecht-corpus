  - number: '5'
    text: |-
      Bij toepassing van [artikel 4][ref1] verstrekt een pensioenuitvoerder gedurende de periode dat de toegezegde
      aanspraken nog niet of niet volledig zijn gefinancierd jaarlijks aan de betrokken deelnemer informatie over de in
      totaal toegezegde aanspraken en de reeds gefinancierde pensioenaanspraken.


      [ref1]: https://wetten.overheid.nl/BWBR0018605#Artikel4
    url: https://wetten.overheid.nl/BWBR0018605/2018-12-25#Artikel5
    references:
      - id: ref1
