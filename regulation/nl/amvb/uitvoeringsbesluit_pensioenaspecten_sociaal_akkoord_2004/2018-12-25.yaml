  - number: '8'
    text: |-
      Indien de deelnemer of gewezen deelnemer in de gelegenheid wordt gesteld zijn aanspraken, opgebouwd ten behoeve van
      een pensioenuitkering voorafgaand aan de datum waarop de deelnemer of gewezen deelnemer de leeftijd van 65 jaren
      bereikt, aan te wenden ten behoeve van een voor de deelnemer of gewezen deelnemer bestemde levensloopregeling als
      bedoeld in [artikel 19g van de Wet op de loonbelasting 1964][ref1] en de deelnemer of gewezen deelnemer daarvan
      gebruik wil maken, dient de deelnemer of gewezen deelnemer binnen twee maanden na ontvangst van de opgave, bedoeld
      in [artikel 6][ref2], een daartoe strekkend verzoek bij de pensioenuitvoerder in.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel19g
      [ref2]: https://wetten.overheid.nl/BWBR0018605#Artikel6
    url: https://wetten.overheid.nl/BWBR0018605/2018-12-25#Artikel8
    references:
