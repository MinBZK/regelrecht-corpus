  - number: '4'
    text: |-
      1 Aanspraken die worden toegezegd op de wijze, bedoeld in dit artikel, en die zullen worden verkregen door
      middel van inkoop over perioden in het verleden waarin minder pensioenaanspraken zijn opgebouwd dan op basis van
      [hoofdstuk IIB van de Wet op de loonbelasting 1964][ref1] is toegestaan, hoeven niet evenredig in de tijd te worden
      opgebouwd en gefinancierd.

      2 De opbouw en financiering vinden plaats binnen een termijn van vijftien jaren na de datum waarop de
      toezegging, bedoeld in het eerste lid, is gedaan of, indien de in de pensioenregeling vastgestelde ingangsdatum
      van het pensioen voor het verstrijken van de termijn van vijftien jaren ligt, voor die ingangsdatum. Een
      pensioenfonds kan de aanspraken uitsluitend financieren uit het vermogen dat ter dekking van de technische
      voorzieningen wordt aangehouden of het eigen vermogen indien voldaan is aan de voorwaarden, bedoeld in
      [artikel 129 van de Pensioenwet][ref2]. In afwijking van de vorige zin kan een pensioenfonds een lager inkooptarief
      vaststellen, mits bij de vaststelling van dat tarief geen tariefgrondslagen worden gehanteerd die nadeliger
      zijn voor de financiële positie van het pensioenfonds dan de tariefgrondslagen die ten grondslag liggen aan de
      vaststelling van de feitelijke premie voor de basispensioenregeling. Een pensioenfonds stelt het inkooptarief vast
      na overleg met de organen van het pensioenfonds.

      3 Aanspraken als bedoeld in het eerste lid kunnen worden toegezegd gedurende twee jaren na het tijdstip van
      inwerkingtreding van dit besluit.

      4 De pensioenuitvoerder informeert de deelnemer of gewezen deelnemer over de aanspraken, bedoeld in het eerste lid.
      De in het vijfde lid vervatte tekst wordt door de pensioenuitvoerder opgenomen in:

      a. de eerste schriftelijke informatieverstrekking aan de deelnemer of gewezen deelnemer dat er aanspraken over
      verstreken dienstjaren met uitgestelde financiering worden toegezegd;

      b. de jaarlijkse opgaven, bedoeld in [artikel 5][ref3];

      c. de schriftelijke informatie over de in dit artikel bedoelde toezegging die op verzoek van de deelnemer of
      gewezen deelnemer wordt verstrekt.

      5 Het pensioen dat voor u zal worden ingekocht omdat u in het verleden gedurende uw dienstbetrekking(en) een of
      meer perioden hebt gehad waarin minder pensioen is opgebouwd dan op grond van de fiscale regelgeving mogelijk
      is, wordt pas opgebouwd op het moment dat en voor zover de toegezegde aanspraken zijn gefinancierd. Wanneer uw
      deelname aan de pensioenregeling eindigt voordat deze aanspraken (volledig) zijn gefinancierd, heeft u alleen recht
      op het op dat moment gefinancierde en opgebouwde deel van deze pensioenaanspraken. Indien bij beëindiging van de
      deelname aan de pensioenregeling nog geen toegezegd pensioen over verstreken dienstjaren voor u is ingekocht en
      opgebouwd, heeft u dus ook geen recht op dit deel van uw toezegging. Als aan u is toegezegd dat pensioenaanspraken
      over verstreken dienstjaren worden ingekocht, dan moeten deze uiterlijk binnen vijftien jaren nadat de toezegging
      is gedaan, zijn gefinancierd. Wanneer u binnen die vijftien jaar met pensioen zou gaan, moeten de in te kopen
      pensioenaanspraken al eerder zijn gefinancierd, namelijk uiterlijk op het moment van uw pensionering. Een eenmaal
      gedane toezegging tot inkoop van aanspraken over het verleden kan in beginsel niet worden ingetrokken of gewijzigd.

      6 Bij aanspraken op grond van een beroepspensioenregeling is het tweede lid van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#HoofdstukIIB
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel129
      [ref3]: https://wetten.overheid.nl/BWBR0018605#Artikel5
