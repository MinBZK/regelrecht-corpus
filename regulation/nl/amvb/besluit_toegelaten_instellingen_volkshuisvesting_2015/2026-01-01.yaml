      [Wet normering bezoldiging topfunctionarissen publieke en semipublieke sector][ref1], voor zover het de in
      [bijlage 1 bij die wet][ref2] opgenomen rechtspersonen of instellingen betreft met betrekking tot welke Onze
      Minister wie het aangaat is in de zin van [artikel 1.1, onderdeel o, onder 5°, van die wet][ref3].


