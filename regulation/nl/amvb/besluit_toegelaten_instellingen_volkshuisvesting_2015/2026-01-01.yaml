  - number: '64.4'
    text: |-
      Op toegelaten instellingen als bedoeld in het eerste lid is [artikel 80, eerste, tweede, derde en vijfde lid][ref1],
      van overeenkomstige toepassing, met dien verstande dat in het tweede lid, onderdeel a, voor «administratief naar de
      niet-daeb-tak over te brengen» wordt gelezen: in de kostenverdeelstaat, bedoeld in [artikel 64, eerste lid][ref2],
      te rangschikken onder de werkzaamheden die niet behoren tot de diensten van algemeen economisch belang.


