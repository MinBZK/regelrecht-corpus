      het oogmerk te bewerkstelligen dat die rechtspersoon of vennootschap alle handelingen verricht en aan de toegelaten
      instelling alle inlichtingen verstrekt die voor haar noodzakelijk zijn om aan [artikel 48, vierde lid][ref1], en
      [artikel 55, derde lid, van de wet][ref2] en het eerste tot en met derde lid van dit artikel te voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel55
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '48'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '55'
  - number: '54.5'
    text: |-
      Het is de toegelaten instelling verboden een overeenkomst met een rechtspersoon of vennootschap
      ter zake van de huur en verhuur van woongelegenheden waarop het bepaalde bij en krachtens
      [artikel 46, tweede lid, van de wet][ref1] van toepassing is aan te gaan, die in de weg staat aan de juiste
      toepassing van [artikel 48, vierde lid][ref2], en [artikel 55, derde lid, van de wet][ref3] en het eerste tot en
      met derde lid van dit artikel. Indien een voor het tijdstip waarop dit besluit in werking is getreden aangegane
      zodanige overeenkomst ertoe leidt dat die toegelaten instelling niet over alle gegevens beschikt die noodzakelijk
      zijn voor een beoordeling als bedoeld in het zesde lid, wordt dat die toegelaten instelling bij die beoordeling
      niet aangerekend.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel48
      [ref3]: https://wetten.overheid.nl/BWBR0005181#Artikel55
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '46'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '48'
      - id: ref3
        bwb_id: BWBR0005181
        artikel: '55'
  - number: '54.6'
    text: |-
      Onze Minister beoordeelt jaarlijks voor 1 december of de toegelaten instelling in het aan die datum voorafgaande
      jaar dit artikel en [artikel 56][ref1] heeft nageleefd of doen naleven, en verstrekt dat oordeel aan de toegelaten
      instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0036702#Artikel56
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0036702
        artikel: '56'
        hoofdstuk: V
        afdeling: '3'
  - number: 54a
    text: |-
      Op verzoek van een uit een of meer personen die de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a van de Algemene Ouderdomswet][ref1] hebben bereikt, bestaand huishouden waarvan de rendementsgrondslag,
      bedoeld in [artikel 5.3, eerste lid, van de Wet inkomstenbelasting 2001][ref2], meer bedraagt dan het in
      [artikel 2a van de Wet op de zorgtoeslag][ref3] genoemde van toepassing zijnde bedrag, kan de toegelaten instelling
      ten aanzien van dat huishouden het in [artikel 46, tweede lid, eerste volzin, van de wet][ref4] over de huurprijs
      buiten toepassing laten.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0018451#Artikel2a
      [ref4]: https://wetten.overheid.nl/BWBR0005181#Artikel46
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel54a
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: 7a
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0018451
        artikel: 2a
      - id: ref4
        bwb_id: BWBR0005181
        artikel: '46'
  - number: '55.1'
    text: |-
      De administratie van de toegelaten instelling of een rechtspersoon of vennootschap als bedoeld in
      [artikel 54, derde lid][ref1], is zodanig, dat een juiste, volledige en tijdige vastlegging daarin is gewaarborgd
      van de gegevens met betrekking tot het huishoudinkomen. Die gegevens worden voor de toepassing van het bepaalde bij
      en krachtens [artikel 46, tweede lid, van de wet][ref2] voor een kalenderjaar niet langer daarin bewaard dan tot
      het tijdstip dat de compensatie over dat kalenderjaar voor werkzaamheden van de toegelaten instelling die behoren
      tot de diensten van algemeen economisch belang onherroepelijk is komen vast te staan.


      [ref1]: https://wetten.overheid.nl/BWBR0036702#Artikel54
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel46
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0036702
        artikel: '54'
        hoofdstuk: V
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '46'
  - number: '55.2'
    text: |-
      De toegelaten instelling is verplicht tot geheimhouding van de gegevens met betrekking tot het huishoudinkomen,
      behoudens voor zover enig wettelijk voorschrift haar tot mededeling verplicht of uit haar taak de noodzaak tot
      mededeling voortvloeit.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel55
  - number: '56.1'
    text: |-
      De toegelaten instelling of een rechtspersoon of vennootschap als bedoeld in [artikel 54, derde lid][ref1],
      geeft toepassing aan het bepaalde bij en krachtens [artikel 46, tweede lid, van de wet][ref2], overeenkomstig
      [bijlage 4][ref3] bij dit besluit. Zij geeft hieraan slechts toepassing nadat degene die als huurder een
      woongelegenheid waarop dat bepaalde van toepassing is wenst te betrekken, ten behoeve van de vaststelling of hij in
      de zin van dat bepaalde in aanmerking komt voor een huurtoeslag in de zin van de [Wet op de huurtoeslag][ref4], aan
      haar heeft overgelegd:


      [ref1]: https://wetten.overheid.nl/BWBR0036702#Artikel54
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel46
      [ref3]: https://wetten.overheid.nl/BWBR0036702
      [ref4]: https://wetten.overheid.nl/BWBR0008659
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0036702
        artikel: '54'
        hoofdstuk: V
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '46'
      - id: ref3
        bwb_id: BWBR0036702
      - id: ref4
        bwb_id: BWBR0008659
  - number: 56.1.a
    text: een door hem opgestelde en ondertekende verklaring over de samenstelling van zijn huishouden;
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel56
  - number: 56.1.b
    text: |-
      gegevens waaruit het huishoudinkomen blijkt, of op grond waarvan dat inkomen zo nauwkeurig als redelijkerwijs
      mogelijk kan worden geschat; en
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel56
  - number: 56.1.c
    text: |-
      indien de verhuurder heeft verzocht om toepassing van [artikel 54a][ref1], gegevens waaruit de in dat artikel
      bedoelde grondslag sparen en beleggen van zijn huishouden blijkt.


      [ref1]: https://wetten.overheid.nl/BWBR0036702#Artikel54a
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0036702
        artikel: 54a
        hoofdstuk: V
        afdeling: '3'
  - number: '56.2'
    text: |-
      De toegelaten instelling voegt in haar administratie, onverwijld na de toepassing, bedoeld in het eerste lid, bij
      de in verband daarmee afgegeven verklaring, bedoeld in het eerste lid, onderdeel a, een door haar ondertekende
      verklaring dat zij geen redenen heeft om aan de juistheid van de eerstbedoelde verklaring te twijfelen.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel56
  - number: '56.3'
    text: |-
      Indien degenen die de woongelegenheid wensen te betrekken uitsluitend vreemdelingen zijn die in Nederland rechtmatig
      verblijf hebben als bedoeld in [artikel 8, onderdelen a tot en met d, van de Vreemdelingenwet 2000][ref1] en
      behoren tot de groep verblijfsgerechtigden die in aanmerking wordt genomen bij het bepalen van de taakstelling
      overeenkomstig [artikel 29, eerste lid, van de Huisvestingswet 2014][ref2], dan geeft de toegelaten instelling
      of een rechtspersoon of vennootschap als bedoeld in [artikel 54, derde lid][ref3], in afwijking van het
      eerste lid, slechts toepassing aan het bepaalde bij of krachtens [artikel 46 van de wet][ref4], overeenkomstig
      [bijlage 4][ref5] bij dit besluit, nadat een van diegenen die als huurder de woongelegenheid wenst te
      betrekken, ten behoeve van de vaststelling of hij in aanmerking komt voor huurtoeslag als bedoeld in de
      [Wet op de huurtoeslag][ref6], aan haar een inkomstenverklaring als bedoeld in het vijfde lid, onderdeel a, heeft
      overgelegd, waaruit de samenstelling van het huishouden blijkt.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0035303#Artikel29
      [ref3]: https://wetten.overheid.nl/BWBR0036702#Artikel54
      [ref4]: https://wetten.overheid.nl/BWBR0005181#Artikel46
      [ref5]: https://wetten.overheid.nl/BWBR0036702
      [ref6]: https://wetten.overheid.nl/BWBR0008659
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0035303
        artikel: '29'
      - id: ref3
        bwb_id: BWBR0036702
        artikel: '54'
        hoofdstuk: V
        afdeling: '3'
      - id: ref4
        bwb_id: BWBR0005181
        artikel: '46'
      - id: ref5
        bwb_id: BWBR0036702
      - id: ref6
        bwb_id: BWBR0008659
  - number: '56.4'
    text: 'Het eerste lid, aanhef en onderdeel b, is niet van toepassing:'
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel56
  - number: 56.4.a
    text: |-
      indien degenen die de woongelegenheid wensen te betrekken uitsluitend, en ten hoogste twee, personen zijn die
      studiefinanciering op grond van de [Wet studiefinanciering 2000][ref1] ontvangen of een tegemoetkoming als
      bedoeld in [artikel 1.1, eerste lid, van de Wet tegemoetkoming onderwijsbijdrage en schoolkosten][ref2], en degene
      die als huurder de woongelegenheid wenst te betrekken bewijzen daarvan aan de toegelaten instelling of aan een
      rechtspersoon of vennootschap als bedoeld in [artikel 54, derde lid][ref3], heeft overgelegd, en


      [ref1]: https://wetten.overheid.nl/BWBR0011453
      [ref2]: https://wetten.overheid.nl/BWBR0012438#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0036702#Artikel54
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0011453
      - id: ref2
        bwb_id: BWBR0012438
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0036702
        artikel: '54'
        hoofdstuk: V
        afdeling: '3'
  - number: 56.4.b
    text: |-
      indien degenen die de woongelegenheid wensen te betrekken van buiten Nederland afkomstige personen
      zijn, die zich hebben ingeschreven bij een instelling voor hoger onderwijs in de zin van de
      [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1], en bewijzen daarvan of verklaringen ter zake aan
      de toegelaten instelling of aan een rechtspersoon of vennootschap als bedoeld in [artikel 54, derde lid][ref2],
      zijn overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005682
      [ref2]: https://wetten.overheid.nl/BWBR0036702#Artikel54
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0005682
      - id: ref2
        bwb_id: BWBR0036702
        artikel: '54'
        hoofdstuk: V
        afdeling: '3'
  - number: '56.5'
    text: 'De gegevens, bedoeld in het eerste lid, onderdeel b, zijn, behoudens het zesde en zevende lid:'
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel56
  - number: 56.5.a
    text: |-
      in geval van vreemdelingen als bedoeld in het derde lid: een inkomstenverklaring, welke niet langer dan zes
      maanden voordat de overeenkomst van huur en verhuur zou moeten ingaan is afgegeven door het Centraal Orgaan opvang
      asielzoekers, bedoeld in [artikel 2 van de Wet Centraal Orgaan opvang asielzoekers][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006685#Artikel2
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0006685
        artikel: '2'
  - number: 56.5.b
    text: |-
      in geval van personen die algemene bijstand ontvangen op grond van de [Participatiewet][ref1]: een bewijs van
      toekenning van algemene bijstand;


      [ref1]: https://wetten.overheid.nl/BWBR0015703
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0015703
  - number: 56.5.c
    text: |-
      in geval van andere personen dan de personen, bedoeld in de onderdelen a en b: de
      aanslag of voorlopige aanslag inkomstenbelasting of de inkomensgegevens, bedoeld in
      [artikel 21, onderdeel e, van de Algemene wet inzake rijksbelastingen][ref1], van ieder van die personen, over een
      van de twee kalenderjaren die direct voorafgaan aan het kalenderjaar waarin de overeenkomst van huur van verhuur
      zou moeten ingaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel21
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '21'
  - number: '56.6'
    text: |-
      Voor zover gegevens als bedoeld in het vijfde lid, onderdeel c, niet beschikbaar zijn blijkens een schriftelijke
      verklaring van een functionaris van de rijksbelastingdienst die bij regeling van de Minister van Financiën als
      inspecteur is aangewezen, zijn de gegevens, bedoeld in het eerste lid, onderdeel b, voorts:
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel56
  - number: 56.6.a
    text: die verklaring en
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel56
  - number: 56.6.b
    text: |-
      indien een van degenen die de betrokken woongelegenheid wensen te betrekken dusdanig kort een inkomen in Nederland
      geniet of dusdanig recent een inkomen in Nederland genoten heeft, dat dat inkomen nog niet bekend is bij de
      rijksbelastingdienst:
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel56
  - number: 56.6.b.1°
    text: |-
      een door degene die als huurder die woongelegenheid wenst te betrekken opgestelde en ondertekende
      inkomensverklaring waarin ten minste het door hem geschatte huishoudinkomen is opgenomen en, indien die verklaring
      melding maakt van het benutten van fiscale aftrekposten of van winst uit onderneming, stukken die aantonen dat die
      verklaring met betrekking tot die aspecten juist en volledig is, en
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel56
  - number: 56.6.b.2°
    text: |-
      hetzij een jaaropgave van de werkgever of werkgevers van degenen, bedoeld in de aanhef, over het kalenderjaar
      dat direct voorafgaat aan het kalenderjaar waarin de overeenkomst ter zake van een verhuur als bedoeld in
      [artikel 46, tweede lid, eerste volzin, van de wet][ref1] zou moeten ingaan, dan wel een jaaropgave over
      eerstbedoeld kalenderjaar van de instantie of instanties die aan diegenen een uitkering verstrekken, hetzij
      loonstroken of uitkeringsspecificaties van die werkgever of werkgevers respectievelijk die instantie of instanties
      met betrekking tot één kalendermaand, welke maand geen eerdere is dan de zesde kalendermaand voorafgaand aan de
      dagtekening van de verklaring, bedoeld onder 1°.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel46
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '46'
  - number: '56.7'
    text: |-
      De huurder kan de toegelaten instelling of een rechtspersoon of vennootschap als bedoeld in
      [artikel 54, derde lid][ref1], verzoeken om andere gegevens dan de gegevens, bedoeld in het vijfde lid, te
      gebruiken voor de vaststelling van het huishoudinkomen indien uit de gegevens, bedoeld in het vijfde lid, een
      huishoudinkomen blijkt dat:


      [ref1]: https://wetten.overheid.nl/BWBR0036702#Artikel54
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0036702
        artikel: '54'
        hoofdstuk: V
        afdeling: '3'
  - number: 56.7.a
    text: |-
      hoger is dan het voor het betrokken huishouden toepasselijke bedrag, bedoeld in
      [artikel 14 van de Wet op de huurtoeslag][ref1], terwijl naar het oordeel van degene die als huurder de betrokken
      woongelegenheid wenst te betrekken het huishoudinkomen niet hoger is dan dat bedrag, of


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel14
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: '14'
  - number: 56.7.b
    text: |-
      lager of gelijk is aan het voor het betrokken huishouden toepasselijke bedrag, bedoeld in
      [artikel 14 van de Wet op de huurtoeslag][ref1], terwijl naar het oordeel van degene die als huurder de betrokken
      woongelegenheid wenst te betrekken het huishoudinkomen hoger is dan dat bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel14
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: '14'
  - number: '56.8'
    text: |-
      In afwijking van het eerste lid kan een rechtspersoon of vennootschap als eerstbedoeld
      in [artikel 54, derde lid][ref1], overeenkomsten ter zake van verhuur als bedoeld in
      [artikel 46, tweede lid, eerste volzin, van de wet][ref2] aangaan zonder dat daaraan voorafgaand een verklaring
      en gegevens als bedoeld in het eerste lid, onderdelen a en b, zijn overgelegd, indien degene die als huurder een
      woongelegenheid waarop het bepaalde bij en krachtens [artikel46, tweede lid, eerste volzin, van de wet][ref3] van
      toepassing is, wenst te betrekken een onderdaan is van een lidstaat en voor het verrichten van arbeid in Nederland
      verblijft. Aan de eerste volzin kan slechts toepassing worden gegeven door een rechtspersoon of vennootschap
      die beschikt over een keurmerk van de Stichting keurmerk internationale arbeidsbemiddeling of van de Stichting
      normering flexwonen en bij het aangaan van de betrokken overeenkomst van huur en verhuur een bewijs van de
      toekenning van dat keurmerk aan de toegelaten instelling overlegt.


      [ref1]: https://wetten.overheid.nl/BWBR0036702#Artikel54
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel46
      [ref3]: https://wetten.overheid.nl/BWBR0005181#Artikel46
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0036702
        artikel: '54'
        hoofdstuk: V
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '46'
      - id: ref3
        bwb_id: BWBR0005181
        artikel: '46'
  - number: '56.9'
    text: |-
      De rechtspersoon of vennootschap, eerstbedoeld in [artikel 54, derde lid][ref1], legt op de laatste dag van elk
      kalenderkwartaal ten aanzien van de huurders, bedoeld in het achtste lid, met wie in dat kwartaal een overeenkomst
      van huur en verhuur is aangegaan aan de toegelaten instelling over:


      [ref1]: https://wetten.overheid.nl/BWBR0036702#Artikel54
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0036702
        artikel: '54'
        hoofdstuk: V
        afdeling: '3'
  - number: 56.9.a
    text: het adres van de woongelegenheid die de huurder, bedoeld in het achtste lid, heeft betrokken;
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel56
  - number: 56.9.b
    text: de naam van de huurder en de datum waarop de huurder de woongelegenheid heeft betrokken;
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel56
  - number: 56.9.c
    text: een verklaring over de samenstelling van het huishouden van de huurder, en
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel56
  - number: 56.9.d
    text: |-
      gegevens waaruit het huishoudinkomen van de huurder en in voorkomend geval de grondslag sparen en beleggen blijkt,
      of op grond waarvan dat inkomen en in voorkomend geval die grondslag zo nauwkeurig als redelijkerwijs mogelijk kan
      worden geschat.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel56
  - number: '56.10'
    text: |-
      De in [bijlage 4][ref1] genoemde index l1 en index l2 worden bij ministeriële regeling vastgesteld en jaarlijks met
      ingang van 1 januari van elk jaar bij ministeriële regeling gewijzigd met de procentuele wijziging per 1 januari
      van het peiljaar, bedoeld in [artikel 252a, tweede lid, onderdeel f, van Boek 7 van het Burgerlijk Wetboek][ref2],
      van het bedrag, genoemd in [artikel 17, eerste lid, onderdeel b, van de Wet op de huurtoeslag][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0036702
