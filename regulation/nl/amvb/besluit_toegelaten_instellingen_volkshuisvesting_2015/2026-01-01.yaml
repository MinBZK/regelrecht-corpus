    text: |-
      haar baten en lasten, naar de mate waarin zij betrekking hebben op activa of passiva als bedoeld in de onderdelen
      a, b en c, of, voor zover die baten en lasten niet aldus aan activa of passiva kunnen worden gerelateerd, het
      deel van die baten en lasten dat verhoudingsgewijs gelijk is aan het aandeel van de onroerende zaken, bedoeld in
      onderdeel a, in het totaal van haar onroerende zaken, welk aandeel en totaal blijken uit haar laatstelijk voor het
      geven van uitvoering van dit artikel vastgestelde balans.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel81
  - number: '81.2'
    text: |-
      Voor zover passiva of lasten als bedoeld in het eerste lid bestaan uit schulden en andere verplichtingen jegens
      derden, brengt de toegelaten instelling deze niet onder in een woningvennootschap, indien de betrokken derde
      daarmee niet instemt.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel81
  - number: '81.3'
    text: |-
      De toegelaten instelling kan woongelegenheden met een huurprijs van ten hoogste het in
      [artikel 13, eerste lid, onderdeel a, van de Wet op de huurtoeslag][ref1] genoemde bedrag, waarvan de waardering
      van de kwaliteit, bedoeld in [artikel 5 van het Besluit huurprijzen woonruimte][ref2], kan leiden tot een huurprijs
      die hoger is dan dat bedrag, alsmede gemengde geliberaliseerde complexen, in een woningvennootschap onderbrengen,
      zolang het aantal daarin ondergebrachte zodanige woongelegenheden niet hoger wordt dan 10% van het aantal zodanige
      woongelegenheden dat de toegelaten instelling op 31 december 2014 in eigendom had. Voor de toepassing van de eerste
      volzin worden de woongelegenheden in gemengde geliberaliseerde complexen met een huurprijs van ten hoogste het in
      artikel 13, eerste lid, onderdeel a, van de Wet op de huurtoeslag genoemde bedrag, waarvan de waardering van de
      kwaliteit, bedoeld in artikel 5 van het Besluit huurprijzen woonruimte, niet kan leiden tot een huurprijs die hoger
      is dan dat bedrag, niet meegerekend. Onze Minister kan op verzoek van de toegelaten instelling een hoger percentage
      dan dat, genoemd in de eerste volzin, vaststellen, indien de toegelaten instelling bij dat verzoek:


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0003237#Artikel5
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: '13'
      - id: ref2
        bwb_id: BWBR0003237
        artikel: '5'
  - number: 81.3.a
    text: |-
      aannemelijk heeft gemaakt dat toepassing van dat hogere percentage noodzakelijk is om haar financiële continuïteit
      of die van de betrokken woningvennootschap voldoende te waarborgen, of
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel81
  - number: 81.3.b
    text: |-
      aantoont dat toereikend toepassing gegeven kan worden aan [artikel 42, eerste lid, eerste volzin, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel42
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '42'
  - number: '81.4'
    text: |-
      Bij ministeriële regeling kunnen nadere voorschriften worden gegeven omtrent hetgeen de toegelaten instelling in
      een woningvennootschap onderbrengt of kan onderbrengen.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel81
  - number: '82.1'
    text: |-
      Indien de toepassing van het bepaalde bij en krachtens [artikel 81][ref1] er zonder nadere maatregelen toe
      zou leiden, dat de financiële continuïteit van een woningvennootschap niet in dezelfde mate is gewaarborgd als
      die van de toegelaten instelling, verstrekt de toegelaten instelling bij die toepassing een startlening aan de
      woningvennootschap. De startlening kan een hypothecaire lening zijn. Op het rentepercentage en de aflossing van die
      lening is het bepaalde bij en krachtens [artikel 10, tweede en derde lid][ref2], van overeenkomstige toepassing,
      met dien verstande dat het rentepercentage, bedoeld in dat artikel, geldt als minimumpercentage.


      [ref1]: https://wetten.overheid.nl/BWBR0036702#Artikel81
      [ref2]: https://wetten.overheid.nl/BWBR0036702#Artikel10
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0036702
        artikel: '81'
        hoofdstuk: V
        paragraaf: '1'
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0036702
        artikel: '10'
        hoofdstuk: III
        paragraaf: '3'
  - number: '82.2'
    text: |-
      De woningvennootschap zet voor de aflossing van de startlening het gedeelte van de netto-opbrengst in van de
      vervreemding van haar onroerende zaken, niet zijnde woongelegenheden waarin natuurlijke personen als eigenaar hun
      hoofdverblijf zullen hebben, dat verhoudingsgewijs gelijk is aan het aandeel van de modelmatige marktwaarde van
      die zaken in de totale modelmatige marktwaarde van haar onroerende zaken op het tijdstip van die vervreemding.
      De eerste volzin is niet van toepassing, indien zij de in die volzin bedoelde netto-opbrengst besteedt aan het
      bouwen of verwerven van, of het treffen van ingrijpende voorzieningen aan, woongelegenheden of gebouwen, of zij
      ten overstaan van Onze Minister aannemelijk maakt dat aanhouding daarvan noodzakelijk is voor haar voortbestaan in
      financieel opzicht.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel82
  - number: '82.3'
    text: |-
      Indien de toepassing van het bepaalde bij en krachtens [artikel 81][ref1] er zonder nadere maatregelen toe zou
      leiden, dat de financiële continuïteit van de woningvennootschap in onvoldoende mate is gewaarborgd, kan de
      toegelaten instelling bij die toepassing, in afwijking van artikel 81, eerste lid, onderdeel b, besluiten andere
      leningen dan die, genoemd in [artikel 66, eerste lid, onderdeel f][ref2], niet in die woningvennootschap onder
      te brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0036702#Artikel81
      [ref2]: https://wetten.overheid.nl/BWBR0036702#Artikel66
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0036702
        artikel: '81'
        hoofdstuk: V
        paragraaf: '1'
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0036702
        artikel: '66'
        hoofdstuk: V
        paragraaf: '3'
        afdeling: '5'
  - number: '82.4'
    text: Bij ministeriële regeling kunnen nadere voorschriften worden gegeven omtrent de toepassing van dit artikel.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel82
  - number: '83.1'
    text: |-
      De toegelaten instelling verschaft bij de bewerkstelliging van een juridische scheiding niet anderszins
      financiële middelen aan een woningvennootschap dan door middel van een startlening als bedoeld in
      [artikel 82, eerste lid][ref1], of in de vorm van aandelenkapitaal. Er zijn geen preferente aandelen, indien die
      ertoe zouden leiden dat de toegelaten instelling die een meerderheid van de aandelen houdt niet in staat is een
      dienovereenkomstige invloed op de gang van zaken in de woningvennootschap uit te oefenen.


      [ref1]: https://wetten.overheid.nl/BWBR0036702#Artikel82
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0036702
        artikel: '82'
        hoofdstuk: V
        paragraaf: '1'
        afdeling: '6'
  - number: '83.2'
    text: De toegelaten instelling stelt zich in generlei opzicht garant voor een woningvennootschap.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel83
  - number: '84.1'
    text: |-
      De toegelaten instelling stelt, voordat zij een verzoek om goedkeuring van een voorgenomen juridische
      scheiding indient, de colleges van burgemeester en wethouders van de gemeente waar zij haar woonplaats heeft,
      van de gemeenten waar zij feitelijk werkzaam is, van die waar woningvennootschappen na die scheiding hun
      woonplaats zullen hebben en van die waar zij na die scheiding feitelijk werkzaam zullen zijn, de betrokken
      bewonersorganisaties en de huurders van haar gebouwen die een maatschappelijke gebruiksbestemming hebben als
      bedoeld in [artikel 45, tweede lid, onderdeel d, van de wet][ref1] in de gelegenheid om hun zienswijze op die
      scheiding te geven. De personen en instanties, bedoeld in de eerste volzin, kunnen binnen zes weken hun zienswijzen
      aan de toegelaten instelling doen toekomen. De betrokken bewonersorganisaties kunnen binnen zes weken hun adviezen,
      bedoeld in [artikel 5, eerste lid, van de Wet op het overleg huurders verhuurder][ref2], aan haar doen toekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0009810#Artikel5
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '45'
      - id: ref2
        bwb_id: BWBR0009810
        artikel: '5'
  - number: '84.2'
    text: |-
      De toegelaten instelling verstrekt de personen en instanties, bedoeld in het eerste lid, eerste volzin, alle
      inlichtingen die redelijkerwijs kunnen bijdragen aan het zich vormen van hun zienswijze, of aan het opstellen van
      een advies als bedoeld in [artikel 5, eerste lid, van de Wet op het overleg huurders verhuurder][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009810#Artikel5
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0009810
        artikel: '5'
  - number: '84.3'
    text: Bij ministeriële regeling kunnen nadere voorschriften worden gegeven omtrent de toepassing van het tweede lid.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel84
  - number: '85.1'
    text: |-
      De toegelaten instelling voert overleg over het verzoek om goedkeuring van de voorgenomen juridische scheiding met
      de gemeente waar zij haar woonplaats heeft, die waar zij feitelijk werkzaam is, die waar de woningvennootschappen
      na die scheiding hun woonplaats zullen hebben en die waar zij daarna feitelijk werkzaam zullen zijn, alsmede met de
      betrokken bewonersorganisaties.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel85
  - number: '85.2'
    text: |-
      De toegelaten instelling stelt de huurders van haar andere gebouwen dan woongelegenheden in de gelegenheid met haar
      overleg te voeren over het verzoek, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel85
  - number: '86.1'
    text: 'Het verzoek om goedkeuring van de voorgenomen juridische scheiding gaat in elk geval vergezeld van:'
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel86
  - number: 86.1.a
    text: een voorstel voor die scheiding en een schriftelijke toelichting daarop;
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel86
  - number: 86.1.b
    text: |-
      de gegevens over de beoogde toepassing van het bepaalde bij en krachtens de [artikelen 82][ref1] en [83][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0036702#Artikel82
      [ref2]: https://wetten.overheid.nl/BWBR0036702#Artikel83
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0036702
        artikel: '82'
        hoofdstuk: V
        paragraaf: '1'
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0036702
        artikel: '83'
        hoofdstuk: V
        paragraaf: '1'
        afdeling: '6'
  - number: 86.1.c
    text: |-
      een overzicht van de woongelegenheden van de toegelaten instelling met een huurprijs van ten hoogste het in
      [artikel 13, eerste lid, onderdeel a, van de Wet op de huurtoeslag][ref1] genoemde bedrag, waarvan de waardering
      van de kwaliteit, bedoeld in [artikel 5 van het Besluit huurprijzen woonruimte][ref2], kan leiden tot een huurprijs
      die hoger is dan dat bedrag, die zij voornemens is in een woningvennootschap onder te brengen;


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0003237#Artikel5
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: '13'
      - id: ref2
        bwb_id: BWBR0003237
        artikel: '5'
  - number: 86.1.d
    text: |-
      de zienswijzen daarop van de personen en instanties, bedoeld in [artikel 84, eerste lid][ref1], en, in geval van
      een negatieve zodanige zienswijze, een onderbouwde reactie daarop van de toegelaten instelling, dan wel, bij het
      uitgebleven zijn van een zienswijze, bescheiden waaruit blijkt dat zij om die zienswijze heeft gevraagd;


      [ref1]: https://wetten.overheid.nl/BWBR0036702#Artikel84
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0036702
        artikel: '84'
        hoofdstuk: V
        paragraaf: '2'
        afdeling: '6'
  - number: 86.1.e
    text: |-
      de adviezen, bedoeld in [artikel 5, eerste lid, van de Wet op het overleg huurders verhuurder][ref1], en, in geval
      van een negatief zodanig advies, een onderbouwde reactie daarop van de toegelaten instelling, dan wel, bij het
      uitgebleven zijn van een advies, bescheiden waaruit blijkt dat zij om dat advies heeft gevraagd en


      [ref1]: https://wetten.overheid.nl/BWBR0009810#Artikel5
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0009810
        artikel: '5'
  - number: 86.1.f
    text: de ontwerpstatuten van de beoogde woningvennootschappen.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel86
  - number: '86.2'
    text: 'In de toelichting op het voorstel voor de voorgenomen juridische scheiding wordt in elk geval opgenomen:'
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel86
  - number: 86.2.a
    text: de motieven voor die scheiding;
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel86
  - number: 86.2.b
    text: |-
      de motieven voor het bij die scheiding toepassing geven aan
      [artikel 50a, tweede lid, tweede volzin, van de wet][ref1], waarbij in elk geval wordt ingegaan op:


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel50
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '50'
  - number: 86.2.b.1°
    text: |-
      het door de toegelaten instelling na die toepassing kunnen naleven van
      [artikel 48, eerste lid, eerste volzin, van de wet][ref1] en


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel48
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '48'
  - number: 86.2.b.2°
    text: |-
      het door die toepassing bijdragen aan het beschikbaar komen van geliberaliseerde woongelegenheden voor huishoudens
      met een huishoudinkomen dat hoger is dan de betrokken inkomensgrens, genoemd in [artikel 16, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0036702#Artikel16
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0036702
        artikel: '16'
        hoofdstuk: III
        paragraaf: '4'
  - number: 86.2.c
    text: |-
      een overzicht van haar werkzaamheden, baten, lasten, activa en passiva, bedoeld in
      [artikel 50a, tweede lid, tweede volzin, van de wet][ref1], die zij voornemens is in de woningvennootschap
      onder te brengen, waarin zijn opgenomen de huurprijs en de waardering van de kwaliteit, bedoeld in
      [artikel 5 van het Besluit huurprijzen woonruimte][ref2], van de betrokken woongelegenheden;


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel50a
      [ref2]: https://wetten.overheid.nl/BWBR0003237#Artikel5
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 50a
      - id: ref2
        bwb_id: BWBR0003237
        artikel: '5'
  - number: 86.2.d
    text: |-
      een uiteenzetting over de organisatorische, bestuurlijke en financiële relaties die als gevolg van die scheiding
      tussen de toegelaten instelling en de woningvennootschappen zullen bestaan;
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel86
  - number: 86.2.e
    text: |-
      een uiteenzetting over de beoogde prestaties op het terrein van de volkshuisvesting van de toegelaten instelling
      en de woningvennootschappen na die scheiding, inhoudende een uiteenzetting over de wijze waarop de toegelaten
      instelling toepassing zal geven aan [artikel 42, eerste lid, eerste volzin, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel42
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '42'
  - number: 86.2.f
    text: |-
      een uiteenzetting over de financiële continuïteit van de toegelaten instelling en de woningvennootschappen na
      die scheiding, mede inhoudende een uiteenzetting over de financiële gevolgen van de in verband met die scheiding
      verwachte wijzigingen in het beleid van de toegelaten instelling;
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel86
  - number: 86.2.g
    text: |-
      een uiteenzetting over de mogelijkheden voor en de bereidheid van financiële instellingen om de
      woningvennootschappen financiële middelen te verschaffen ten behoeve van de uitvoering van hun werkzaamheden en
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel86
  - number: 86.2.h
    text: |-
      een uiteenzetting over het beleid dat de woningvennootschappen beogen te voeren inzake het gewenste op hun aandelen
      te behalen rendement, dat mede is gebaseerd op de mogelijkheden, bedoeld in onderdeel g, en dat is gericht op
      het door die woningvennootschappen kunnen uitkeren van dividend aan de toegelaten instelling en haar andere
      aandeelhouders.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel86
  - number: '86.3'
    text: Bij ministeriële regeling kunnen nadere voorschriften worden gegeven omtrent de toepassing van dit artikel.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel86
  - number: '87'
    text: |-
      Op verzoek van Onze Minister verstrekt de toegelaten instelling hem nadere inlichtingen over de voorgenomen
      juridische scheiding, voor zover dat naar zijn oordeel voor de beoordeling van het verzoek om goedkeuring daarvan
      noodzakelijk is. Bij ministeriële regeling kunnen voorschriften worden gegeven omtrent de inlichtingen die de
      toegelaten instelling dient te verstrekken.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel87
  - number: '88.1'
    text: |-
      Onze Minister betrekt bij zijn beoordeling van de financiële continuïteit van een toegelaten instelling na
      goedkeuring van de voorgenomen juridische scheiding in elk geval:
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel88
  - number: 88.1.a
    text: haar geraamde solvabiliteit na die scheiding;
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel88
  - number: 88.1.b
    text: |-
      de verhouding tussen het saldo van haar operationele kasstromen en haar rentelasten gedurende de eerste vijf jaren
      na die scheiding en
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel88
  - number: 88.1.c
    text: |-
      de meest recente beoordeling van haar kredietwaardigheid door de borgingsvoorziening, indien zij leningen als
      bedoeld in [artikel 66, eerste lid, onderdeel f][ref1], heeft aangetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0036702#Artikel66
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel88
    references:
      - id: ref1
        bwb_id: BWBR0036702
        artikel: '66'
        hoofdstuk: V
        paragraaf: '3'
        afdeling: '5'
  - number: '88.2'
    text: |-
      Onze Minister betrekt bij zijn beoordeling van de financiële continuïteit van een woningvennootschap na goedkeuring
      van de voorgenomen juridische scheiding in elk geval haar geraamde solvabiliteit na die scheiding.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel88
  - number: '88.3'
    text: Bij ministeriële regeling kunnen nadere voorschriften worden gegeven omtrent de toepassing van dit artikel.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel88
  - number: '89'
    text: |-
      Op de goedkeuring van de juridische scheiding is
      [artikel 9, eerste lid, aanhef en onderdelen a, b, c en d, en derde lid][ref1] van overeenkomstige toepassing, met
      dien verstande dat Onze Minister op verzoek van de toegelaten instelling een hoger percentage dan dat, genoemd in
      artikel 9, eerste lid, onderdeel c, kan vaststellen, indien de toegelaten instelling bij dat verzoek aantoont dat
      zonder toepassing van dat hogere percentage de financiële continuïteit van de toegelaten instelling respectievelijk
      de woningvennootschap onvoldoende gewaarborgd is.


      [ref1]: https://wetten.overheid.nl/BWBR0036702#Artikel9
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0036702
        artikel: '9'
        hoofdstuk: III
        paragraaf: '3'
  - number: '90.1'
    text: |-
      Onze Minister kan toepassing geven aan [artikel 50c, tweede lid, van de wet][ref1], indien naar zijn oordeel
      vervreemding van aandelen in een woningvennootschap noodzakelijk is uit het oogpunt van het waarborgen van de
      financiële continuïteit van de toegelaten instelling of van het door de toegelaten instelling kunnen voldoen aan
      [artikel 42, eerste lid, eerste volzin, van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel50c
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel42
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 50c
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '42'
  - number: '90.2'
    text: |-
      Een aanbieding als bedoeld in [artikel 50c, tweede lid, van de wet][ref1] geschiedt tegen de intrinsieke waarde.
      Bij de aanbieding geeft de toegelaten instelling te kennen welke invloed wijzigingen die na de vervreemding van de
      aandelen zullen optreden in het beleid inzake de verhuur van de woongelegenheden van de woningvennootschap zullen
      hebben op de prijs waartegen zij de aandelen vervreemdt.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel50c
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 50c
  - number: '90.3'
    text: |-
      Onze Minister kan in afwijking van het tweede lid goedkeuren dat de aanbieding plaatsvindt tegen een andere waarde
      dan de intrinsieke waarde wanneer de toegelaten instelling aannemelijk maakt dat de intrinsieke waarde in het
      desbetreffende geval geen juist beeld geeft van de waarde bij verkoop.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel90
  - number: '91'
    text: |-
      Indien toegelaten instellingen beogen met elkaar te fuseren, dienen zij gezamenlijk een verzoek in om goedkeuring
      daarvan, en verrichten zij gezamenlijk alle daartoe vereiste andere voorbereidingshandelingen.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel91
  - number: '92.1'
    text: |-
      De fuserende toegelaten instelling informeert zo spoedig mogelijk de colleges van burgemeester en wethouders van de
      gemeenten waar zij haar woonplaats heeft, waar zij feitelijk werkzaam is, waar de fuserende toegelaten instelling
      na de voorgenomen fusie haar woonplaats zal hebben en waar zij na die fusie feitelijk werkzaam zal zijn over:
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel92
  - number: 92.1.a
    text: haar fusievoornemens en haar motieven daarvoor; en
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel92
  - number: 92.1.b
    text: |-
      de verwachte gevolgen van die fusie voor de huurders van haar woongelegenheden en gebouwen, voor de bijdragen van
      toegelaten instellingen aan de gemeentelijke woonvisie en voor de overige belanghebbenden.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel92
  - number: '92.2'
    text: |-
      De fuserende toegelaten instelling verstrekt de instanties, bedoeld in [artikel 53, derde lid, van de wet][ref1],
      alle inlichtingen die redelijkerwijs kunnen bijdragen aan het zich vormen van hun zienswijze en haar oordeel.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel53
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '53'
  - number: '92.3'
    text: |-
      De fuserende toegelaten instelling voert, naast het overleg, bedoeld in
      [artikel 53, tweede lid, derde volzin, van de wet][ref1], overleg over het verzoek om goedkeuring van de
      voorgenomen fusie met de colleges van burgemeester en wethouders van de gemeenten als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel53
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '53'
  - number: '92.4'
    text: |-
      Bij ministeriële regeling kunnen nadere voorschriften worden gegeven omtrent de toepassing van het eerste en tweede
      lid.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel92
  - number: '95.1'
    text: |-
      Het verzoek om goedkeuring van de voorgenomen fusie, als bedoeld in
      [artikel 53, tweede lid, eerste volzin, van de wet][ref1], gaat, naast hetgeen waarvan het ingevolge artikel 53,
      derde lid, van de wet vergezeld gaat, vergezeld van:


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel53
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '53'
  - number: 95.1.a
    text: |-
      een fusievoorstel en een schriftelijke toelichting daarop, als bedoeld in de [artikelen 312][ref1] en
      [313 van Boek 2 van het Burgerlijk Wetboek][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel312
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel313
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '312'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '313'
  - number: 95.1.b
    text: |-
      de zienswijzen daarop van de gemeenten, bedoeld in [artikel 92, eerste lid][ref1], voor zover niet reeds bij het
      verzoek gevoegd ingevolge [artikel 53, derde lid, onderdeel a, van de wet][ref2], en, in geval van een negatieve
      zodanige zienswijze of andere zienswijze als bedoeld in artikel 53, derde lid, van de wet, een onderbouwde reactie
      daarop van de fuserende toegelaten instelling, dan wel, bij het uitblijven van een zienswijze na zes weken nadat
      hierom is gevraagd, bescheiden waaruit blijkt dat zij om die zienswijze heeft gevraagd; en


      [ref1]: https://wetten.overheid.nl/BWBR0036702#Artikel92
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel53
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0036702
        artikel: '92'
        hoofdstuk: V
        afdeling: '7'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '53'
  - number: 95.1.c
    text: |-
      indien die fusie een concentratie is waarop [Hoofdstuk 5 van de Mededingingswet][ref1] van toepassing is:


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0008691
        hoofdstuk: '5'
  - number: 95.1.c.1°
    text: |-
      een onvoorwaardelijke mededeling als bedoeld in [artikel 37, eerste lid, van die wet][ref1] dat voor die
      concentratie geen vergunning is vereist, of een verklaring dat geen mededeling als bedoeld in dat lid is gedaan
      binnen vier weken na de melding van die fusie aan de Autoriteit Consument en Markt;


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel37
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '37'
  - number: 95.1.c.2°
    text: |-
      een voorwaardelijke mededeling als bedoeld in [artikel 37, eerste lid, van die wet][ref1] dat voor die concentratie
      geen vergunning is vereist, vergezeld van bescheiden waarmee wordt aangetoond dat tijdig aan de in die mededeling
      gestelde voorwaarden is voldaan;


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel37
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '37'
  - number: 95.1.c.3°
    text: |-
      de voor die concentratie ingevolge [artikel 37 van die wet][ref1] vereiste vergunning of


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel37
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '37'
  - number: 95.1.c.4°
    text: |-
      in geval van een negatief oordeel als bedoeld in [artikel 53, derde lid, onderdeel b, van de wet][ref1]: een
      onderbouwde reactie daarop van de fuserende toegelaten instelling, dan wel, bij het uitblijven van een oordeel,
      bescheiden waaruit blijkt dat zij om dat oordeel heeft gevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel53
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '53'
  - number: '95.2'
    text: |-
      Het eerste lid, onderdeel b, is niet van toepassing indien sprake is van een fusie als bedoeld in
      [artikel 53, vijfde lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel53
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '53'
  - number: '95.3'
    text: Bij ministeriële regeling kunnen nadere voorschriften worden gegeven omtrent de toepassing van dit artikel.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel95
  - number: '96.1'
    text: |-
      In de toelichting, bedoeld in [artikel 313 van Boek 2 van het Burgerlijk Wetboek][ref1], wordt in elk geval
      opgenomen:


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel313
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '313'
  - number: 96.1.a
    text: de motieven voor de voorgenomen fusie;
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel96
  - number: 96.1.b
    text: |-
      een uiteenzetting over de alternatieven voor die fusie, waarin de verwachte effecten van die fusie en de verwachte
      meerwaarde ervan worden vergeleken met die van minder vergaande vormen van samenwerking, en
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel96
  - number: 96.1.c
    text: een fusie-effectrapportage overeenkomstig het tweede lid.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel96
  - number: '96.2'
    text: 'De fusie-effectrapportage omvat in elk geval een weergave van de gevolgen van de voorgenomen fusie voor:'
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel96
  - number: 96.2.a
    text: 'de lokale binding, inhoudende:'
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel96
  - number: 96.2.a.1°
    text: |-
      een overzicht van de organisatorische en bestuurlijke structuur van de verkrijgende toegelaten instelling, waaruit
      blijkt dat er een lokaal aanspreekpunt zal zijn in die gemeenten waar de verkrijgende toegelaten instelling 100 of
      meer woongelegenheden in bezit heeft, en
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel96
  - number: 96.2.a.2°
    text: |-
      een uiteenzetting over de gevolgen van de met die fusie gepaard gaande schaalvergroting op de samenwerking met de
      gemeenten waar de verkrijgende toegelaten instelling haar woonplaats zal hebben en die waar zij feitelijk werkzaam
      zal zijn;
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel96
  - number: 96.2.b
    text: |-
      de prestaties op het terrein van de volkshuisvesting, inhoudende een uiteenzetting
      over de wijze waarop de verkrijgende toegelaten instelling toepassing zal geven aan
      [artikel 42, eerste lid, eerste volzin, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel42
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '42'
  - number: 96.2.c
    text: |-
      de financiële continuïteit van de verkrijgende toegelaten instelling, inhoudende een uiteenzetting over de
      financiële gevolgen van de in verband met die fusie verwachte wijzigingen in het beleid van de fuserende toegelaten
      instelling, en
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel96
  - number: 96.2.d
    text: de financiële draagkracht van de verkrijgende toegelaten instelling.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel96
  - number: '96.3'
    text: |-
      Het eerste lid, onderdeel c, en het tweede lid zijn niet van toepassing indien sprake is van een fusie als bedoeld
      in [artikel 53, vijfde lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel53
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '53'
  - number: '96.4'
    text: Bij ministeriële regeling kunnen nadere voorschriften worden gegeven omtrent de toepassing van dit artikel.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel96
  - number: '97'
    text: |-
      Op verzoek van Onze Minister verstrekt de fuserende toegelaten instelling hem nadere inlichtingen over de
      voorgenomen fusie, voor zover dat naar zijn oordeel voor de beoordeling van het verzoek om goedkeuring daarvan
      noodzakelijk is. Bij ministeriële regeling kunnen voorschriften worden gegeven omtrent de inlichtingen die de
      toegelaten instelling dient te verstrekken.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel97
  - number: '98.1'
    text: |-
      Onze Minister keurt de voorgenomen fusie niet goed, indien naar zijn oordeel de lokale binding van de verkrijgende
      toegelaten instelling niet voldoende gewaarborgd zal zijn.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel98
  - number: '98.2'
    text: |-
      Het percentage, bedoeld in [artikel 53, vierde lid, onderdeel d, van de wet][ref1], is 70.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel53
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel98
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '53'
  - number: '99'
    text: |-
      De verkrijgende toegelaten instelling doet onverwijld een gewaarmerkt afschrift van de notariële akte waarbij
      de fusie is geschied en, indien de fusie gepaard is gegaan met een wijziging van de statuten van de fuserende
      toegelaten instelling, van de notariële akte waarin die wijziging is vervat, aan Onze Minister toekomen.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel99
  - number: '100.1'
    text: |-
      Onze Minister keurt de voorgenomen splitsing niet goed, indien deze niet leidt tot een zich verbinden als bedoeld
      in [artikel 21 van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel21
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel100
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '21'
  - number: '100.2'
    text: |-
      Op voorgenomen splitsingen die geen juridische scheiding zijn, is het bepaalde bij en krachtens [afdeling 7][ref1]
      van overeenkomstige toepassing:


      [ref1]: https://wetten.overheid.nl/BWBR0036702#HoofdstukV
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel100
    references:
      - id: ref1
        bwb_id: BWBR0036702
        hoofdstuk: V
        afdeling: '7'
  - number: 100.2.a
    text: |-
      met uitzondering van de [artikelen 95, eerste lid, onderdeel c][ref1], [96, eerste lid, onderdeel b][ref2], en
      [98][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0036702#Artikel95
      [ref2]: https://wetten.overheid.nl/BWBR0036702#Artikel96
      [ref3]: https://wetten.overheid.nl/BWBR0036702#Artikel98
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel100
    references:
      - id: ref1
        bwb_id: BWBR0036702
        artikel: '95'
        hoofdstuk: V
        afdeling: '7'
      - id: ref2
        bwb_id: BWBR0036702
        artikel: '96'
        hoofdstuk: V
        afdeling: '7'
      - id: ref3
        bwb_id: BWBR0036702
        artikel: '98'
        hoofdstuk: V
        afdeling: '7'
  - number: 100.2.b
    text: |-
      voorts met uitzondering van de bepalingen van [afdeling 7][ref1] in het onderwerp waarvan wordt voorzien door het
      bepaalde bij en krachtens [artikel 21, eerste tot en vierde lid, van de wet][ref2] en


      [ref1]: https://wetten.overheid.nl/BWBR0036702#HoofdstukV
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel21
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel100
    references:
      - id: ref1
        bwb_id: BWBR0036702
        hoofdstuk: V
        afdeling: '7'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '21'
  - number: 100.2.c
    text: |-
      met dien verstande dat onder de instanties, bedoeld in [artikel 92, tweede lid][ref1], niet de Autoriteit Consument
      en Markt wordt begrepen.


      [ref1]: https://wetten.overheid.nl/BWBR0036702#Artikel92
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel100
    references:
      - id: ref1
        bwb_id: BWBR0036702
        artikel: '92'
        hoofdstuk: V
        afdeling: '7'
  - number: '101'
    text: |-
      Het percentage, bedoeld in [artikel 54, eerste lid, van de wet][ref1], is een bij ministeriële regeling te bepalen
      percentage.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel54
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel101
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '54'
  - number: '102.1'
    text: |-
      Onze Minister kan bepalen dat het toetsingskader van Aedes vereniging van woningcorporaties inzake de kosten van de
      bedrijfsvoering van toegelaten instellingen van toepassing is op alle toegelaten instellingen.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel102
  - number: '102.2'
    text: |-
      Bij ministeriële regeling kunnen nadere voorschriften worden gegeven omtrent de berekening van de kosten, bedoeld
      in het eerste lid, en de toegestane hoogte daarvan.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel102
  - number: '103.1'
    text: |-
      Het reglement, bedoeld in [artikel 55a, tweede lid, van de wet][ref1], wordt vastgesteld door het bestuur. Het is
      onderworpen aan de goedkeuring van de raad van commissarissen en Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel55a
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel103
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 55a
  - number: '103.2'
    text: |-
      Een wijziging van een reeds vastgesteld en goedgekeurd reglement is onderworpen aan de goedkeuring van de raad van
      commissarissen en wordt verantwoord in het jaarverslag, bedoeld in [artikel 36, eerste lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel36
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel103
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '36'
  - number: '103.3'
    text: |-
      Een wijziging als bedoeld in het tweede lid die geheel of mede betrekking heeft op het beleid en beheer van
      het aantrekken of aanhouden van financiële derivaten door de toegelaten instelling, de dochtermaatschappij of
      de verbonden onderneming waarvan de toegelaten instelling meer dan de helft van de bestuurders kan benoemen of
      ontslaan, is tevens onderworpen aan de goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel103
  - number: '103.4'
    text: Bij ministeriële regeling kunnen nadere voorschriften worden gegeven omtrent de toepassing van dit artikel.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel103
  - number: '104.1'
    text: |-
      Het reglement, bedoeld in [artikel 55a, tweede lid, van de wet][ref1], bevordert dat het financiële beleid en
      beheer van de toegelaten instelling, de dochtermaatschappij en de verbonden onderneming waarvan de toegelaten
      instelling meer dan de helft van de bestuurders kan benoemen of ontslaan, dienstbaar is aan het bereiken van
      haar doelstellingen op het terrein van de volkshuisvesting en gericht is op het waarborgen van haar financiële
      continuïteit. Het reglement bevordert voorts het optimaal beheersen van financiële risico’s en het voorkomen van
      misbruik en oneigenlijk gebruik van wettelijke voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel55a
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 55a
  - number: '104.2'
    text: 'Het reglement bepaalt:'
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel104
  - number: 104.2.a
    text: |-
      de doelstellingen van het financiële beleid en beheer en de samenhang tussen die doelstellingen en de
      doelstellingen van de toegelaten instelling, de dochtermaatschappij en de verbonden onderneming waarvan de
      toegelaten instelling meer dan de helft van de bestuurders kan benoemen of ontslaan, op het terrein van de
      volkshuisvesting;
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel104
  - number: 104.2.b
    text: |-
      dat de toegelaten instelling, de dochtermaatschappij en de verbonden onderneming waarvan de toegelaten instelling
      meer dan de helft van de bestuurders kan benoemen of ontslaan, beschikt over een meerjarenbegroting voor ten minste
      de vijf kalenderjaren volgend op het laatst afgesloten boekjaar;
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel104
  - number: 104.2.c
    text: |-
      de voor die kalenderjaren te hanteren streefwaarden en prestatieindicatoren, die betrekking hebben op de in die
      jaren verwachte financiële situatie en financiële risico’s, en in elk geval het verwachte kasstroomsaldo, de
      verwachte liquiditeitspositie, de verwachte solvabiliteit en de verwachte financieringsbehoefte van de toegelaten
      instelling, de dochtermaatschappij en de verbonden onderneming waarvan de toegelaten instelling meer dan de helft
      van de bestuurders kan benoemen of ontslaan, betreffen;
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel104
  - number: 104.2.d
    text: |-
      dat de toegelaten instelling in het jaarverslag, bedoeld in [artikel 36, eerste lid, van de wet][ref1], op bij
      ministeriële regeling te bepalen wijze melding maakt van de met haar verbonden ondernemingen, en


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel36
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '36'
  - number: 104.2.e
    text: |-
      de, door de raad van commissarissen vast te stellen, bedragen die ten hoogste met een besluit van het bestuur
      gemoeid mogen zijn zonder dat het onderworpen is aan goedkeuring van de raad van commissarissen, en de criteria
      voor die goedkeuring.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel104
  - number: '104.3'
    text: |-
      Het reglement omvat nadere bepalingen voor collegiale leningen en beleggingen, overeenkomstig bij ministeriële
      regeling daaromtrent te geven voorschriften.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel104
  - number: '105.1'
    text: |-
      Het reglement, bedoeld in [artikel 55a, tweede lid, van de wet][ref1], omvat voorts, steeds mede ten aanzien
      van het aantrekken en gebruiken van financiële derivaten ten aanzien van collegiale leningen en ten aanzien van
      beleggingsactiviteiten:


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel55a
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel105
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 55a
  - number: 105.1.a
    text: |-
      de bepaling dat de administratie zodanig wordt ingericht, dat het bestuur steeds op de hoogte kan zijn van de
      ontwikkeling van de waarden en indicatoren, bedoeld in [artikel 104, tweede lid, onderdeel c][ref1], en daarover de
      raad van commissarissen kan inlichten;


      [ref1]: https://wetten.overheid.nl/BWBR0036702#Artikel104
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel105
    references:
      - id: ref1
        bwb_id: BWBR0036702
        artikel: '104'
        hoofdstuk: V
        paragraaf: '3'
        afdeling: '9'
  - number: 105.1.b
    text: de bepaling dat de beheersing van financiële risico’s wordt geïntegreerd in de bedrijfsvoering;
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel105
  - number: 105.1.c
    text: |-
      de bepaling dat de wijze van beheersing van financiële risico’s en hetgeen daaromtrent van de daarmee belaste
      functionarissen wordt verwacht wordt vastgelegd in proces- en functiebeschrijvingen, welke aan dat reglement worden
      gehecht;
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel105
  - number: 105.1.d
    text: |-
      voorschriften omtrent de organisatiestructuur met betrekking tot het financiële beleid en beheer, waaronder in elk
      geval voorschriften omtrent bevoegdheden en mandatering daarvan en omtrent de betrokkenheid daarbij van de raad
      van commissarissen en degene aan wie hij de opdracht, bedoeld in [artikel 37, eerste lid, van de wet][ref1], heeft
      gegeven;


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel37
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel105
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '37'
  - number: 105.1.e
    text: 'bepalingen met betrekking tot de financiële functie en de controlfunctie, die in elk geval inhouden:'
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel105
  - number: 105.1.e.1°
    text: dat hetzij een lid van het bestuur hetzij een lid van de directie voor die functies eindverantwoordelijk is;
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel105
  - number: 105.1.e.2°
    text: dat die functies steeds betrokken zijn bij voorgenomen besluiten met verstrekkende financiële gevolgen;
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel105
  - number: 105.1.e.3°
    text: |-
      dat de controlfunctie mede de aspecten van de interne bedrijfsvoering alsmede de effectiviteit en de efficiency van
      de organisatie omvat;
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel105
  - number: 105.1.e.4°
    text: |-
      dat de controlfunctie bij een toegelaten instelling of dochtermaatschappij die meer dan 5.000 verhuureenheden in
      eigendom heeft in een afzonderlijke organisatie-eenheid is opgenomen en zowel gevraagd als ongevraagd het bestuur
      en de raad van commissarissen kan adviseren omtrent in het kader van het financiële beleid en beheer te nemen
      maatregelen;
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel105
  - number: 105.1.f
    text: voorschriften die waarborgen dat de raad van commissarissen voldoende kennis heeft van financieel beleid en beheer;
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel105
  - number: 105.1.g
    text: |-
      de bepaling dat de raad van commissarissen van een toegelaten instelling die meer dan 10.000 woongelegenheden in
      eigendom heeft, uit zijn midden een auditcommissie instelt;
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel105
  - number: 105.1.h
    text: |-
      de bepaling dat de belangrijkste financiële risico’s ten minste twee maal per jaar worden besproken door het
      bestuur en de raad van commissarissen, aan de hand van een door het bestuur opgestelde rapportage waarin inzicht
      wordt gegeven in de aard, waarschijnlijkheid, mogelijke omvang en financiële gevolgen van die risico’s, alsmede in
      genomen of mogelijk te nemen maatregelen ten aanzien van die risico’s;
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel105
  - number: 105.1.i
    text: |-
      de bepaling dat het de raad van commissarissen is toegestaan om de financiële risico’s zonder dat het
      bestuur daarbij aanwezig of vertegenwoordigd is te bespreken met degene aan wie hij de opdracht, bedoeld in
      [artikel 37, eerste lid, van de wet][ref1], heeft gegeven en met de functionarissen die met de beheersing van die
      risico’s belast zijn;


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel37
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel105
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '37'
  - number: 105.1.j
    text: de bepaling dat het bestuur het financiële jaarplan ter goedkeuring aan de raad van commissarissen voorlegt en
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel105
  - number: 105.1.k
    text: |-
      de bepaling dat de raad van commissarissen jaarlijks, na overleg met het bestuur en, indien deze geen lid van
      het bestuur is, de persoon, bedoeld in onderdeel e, onder 1°, in samenspraak met degene aan wie de raad van
      commissarissen de opdracht, bedoeld in [artikel 37, eerste lid, van de wet][ref1], heeft gegeven, de controleaanpak
      en de speciale aandachtspunten voor de controle vaststelt.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel37
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel105
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '37'
  - number: '105.2'
    text: |-
      Het aantal verhuureenheden als bedoeld in het eerste lid, onderdeel e, onder 4,
      wordt bepaald overeenkomstig de bepaling daarvan voor de toepassing van de bij de
      [Regeling bezoldigingsmaxima topfunctionarissen toegelaten instellingen volkshuisvesting 2014][ref1] behorende
      tabel.


      [ref1]: https://wetten.overheid.nl/BWBR0034245
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel105
    references:
      - id: ref1
        bwb_id: BWBR0034245
  - number: '105.3'
    text: Bij ministeriële regeling kunnen nadere voorschriften worden gegeven omtrent de toepassing van dit artikel.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel105
  - number: '106.1'
    text: |-
      Het reglement, bedoeld in [artikel 55a, tweede lid, van de wet][ref1], bepaalt dat de toegelaten instelling,
      de dochtermaatschappij en de verbonden onderneming waarvan de toegelaten instelling meer dan de helft van de
      bestuurders kan benoemen of ontslaan:


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel55a
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel106
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 55a
  - number: 106.1.a
    text: inzake financiële derivaten, collegiale leningen en beleggingen geen rentevisie hanteren;
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel106
  - number: 106.1.b
    text: |-
      financiële derivaten en beleggingsactiviteiten uitsluitend aantrekken en afstoten met als doel risico’s van het
      financiële beleid en beheer te beperken;
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel106
  - number: 106.1.c
    text: geen financiële derivaten vervreemden, anders dan door het sluiten van derivaatposities, en
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel106
  - number: 106.1.d
    text: geen gelden lenen met het doel deze uit te zetten bij dezelfde of een andere partij.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel106
  - number: '106.2'
    text: |-
      Het reglement bepaalt voorts dat in of ten aanzien van financiële derivaten geen clausules worden gehanteerd, die
      op enigerlei wijze de uitoefening van het toezicht op toegelaten instellingen, dochtermaatschappijen en verbonden
      ondernemingen waarvan de toegelaten instelling meer dan de helft van de bestuurders kan benoemen of ontslaan kunnen
      belemmeren, en dat een toegelaten instelling die op het tijdstip waarop dit besluit in werking is getreden een
      derivatenportefeuille heeft die financiële derivaten met zodanige clausules bevat, een plan van aanpak heeft dat is
      gericht op het zo spoedig mogelijk afstoten van die derivaten.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel106
  - number: '106.3'
    text: |-
      Onze Minister kan nadere eisen stellen aan het plan van aanpak, bedoeld in het tweede lid, en de te hanteren
      termijn voor het in dat lid bedoelde afstoten van financiële derivaten.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel106
  - number: '107.1'
    text: |-
      Het reglement, bedoeld in [artikel 55a, tweede lid, van de wet][ref1], bepaalt voorts dat de toegelaten instelling,
      de dochtermaatschappij en de verbonden onderneming waarvan de toegelaten instelling meer dan de helft van de
      bestuurders kan benoemen of ontslaan:


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel55a
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 55a
  - number: 107.1.a
    text: |-
      geen andere financiële derivaten als bedoeld in [artikel 1, eerste lid][ref1], begripsomschrijving van financiële
      derivaten, onderdeel a, aantrekt dan rentecaps of payer swaps ter hedging van variabele leningen die voor of
      tegelijk met het tijdstip van aantrekken van dat derivaat zijn aangetrokken, welke payer swaps geen langere
      looptijd hebben dan 10 kalenderjaren, waarvan het kalenderjaar waarin zij worden aangetrokken het eerste is, en


      [ref1]: https://wetten.overheid.nl/BWBR0036702#Artikel1
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0036702
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
  - number: 107.1.b
    text: |-
      geen andere financiële derivaten als bedoeld in [artikel 1, eerste lid][ref1], begripsomschrijving van
      financiële derivaten, onderdeel b, aantrekt dan basisrenteleningen, indien dat geschiedt in het kader van een
      schuldvernieuwing van een reeds aangetrokken basisrentelening, waarbij de dag waarop de looptijd van de nieuwe
      basisrentelening eindigt niet later is dan het einde van de looptijd van de reeds aangetrokken basisrentelening
      indien deze niet vernieuwd was, en de omvang van de ontstane vordering niet groter is dan de vordering op grond van
      de reeds aangetrokken basisrentelening.


      [ref1]: https://wetten.overheid.nl/BWBR0036702#Artikel1
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0036702
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
  - number: '107.2'
    text: |-
      Het reglement bepaalt voorts dat de toegelaten instelling, de dochtermaatschappij en de verbonden onderneming
      waarvan de toegelaten instelling meer dan de helft van de bestuurders kan benoemen of ontslaan:
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel107
  - number: 107.2.a
    text: |-
      uitsluitend financiële derivaten aantrekt, indien de instelling van welke zij die
      derivaten aantrekt haar heeft aangemerkt als een niet-professionele belegger als bedoeld in
      [artikel 4:18d van de Wet op het financieel toezicht;][ref1]


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 107.2.b
    text: |-
      uitsluitend financiële derivaten aantrekt, nadat zij met de instelling van welke zij die derivaten aantrekt een
      raamovereenkomst, overeenkomstig een bij ministeriële regeling vast te stellen model daarvoor, heeft gesloten;
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel107
  - number: 107.2.c
    text: |-
      uitsluitend financiële derivaten als bedoeld in [artikel 1, eerste lid][ref1], begripsomschrijving van financiële
      derivaten, onderdeel a, aantrekt onder het sluiten van een modelovereenkomst, overeenkomstig een bij ministeriële
      regeling vast te stellen model daarvoor, met de instelling van welke zij die derivaten aantrekt en


      [ref1]: https://wetten.overheid.nl/BWBR0036702#Artikel1
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0036702
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
  - number: 107.2.d
    text: uitsluitend financiële derivaten aantrekt, die luiden in euro’s.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel107
  - number: '107.3'
    text: |-
      Het reglement bepaald voorts dat een bank, waarbij een dochtermaatschappij financiële derivaten afsluit of middelen
      uitzet, voldoet aan de eisen, genoemd in [artikel 13, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0036702#Artikel13
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0036702
        artikel: '13'
        hoofdstuk: III
        paragraaf: '3'
  - number: '108.1'
    text: |-
      Het reglement, bedoeld in [artikel 55a, tweede lid, van de wet][ref1], bepaalt voorts dat:


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel55a
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 55a
  - number: 108.1.a
    text: |-
      toegelaten instellingen, dochtermaatschappijen en verbonden ondernemingen waarvan de toegelaten instelling
      meer dan de helft van de bestuurders kan benoemen of ontslaan die financiële derivaten gebruiken daartoe een
      liquiditeitsbuffer aanhouden van een zodanige omvang, dat daaruit, met inachtneming van redelijkerwijs voorzienbare
      beroepen daarop in verband met andere bedrijfsrisico’s dan dat gebruik, aan de uit dat gebruik voortvloeiende
      liquiditeitsverplichtingen ten gevolge van een daling van de vaste rente in de markt van rentederivaten met 2%-punt
      kan worden voldaan;
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel108
  - number: 108.1.b
    text: |-
      indien die liquiditeitsbuffer een geringere omvang heeft dan ingevolge onderdeel a vereist, de toegelaten
      instelling, de dochtermaatschappij en de verbonden onderneming waarvan de toegelaten instelling meer dan de
      helft van de bestuurders kan benoemen of ontslaan, dat terstond aan Onze Minister meedeelt en na overleg met hem
      maatregelen vaststelt om die situatie op te heffen en
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel108
  - number: 108.1.c
    text: |-
      de toegelaten instelling, de dochtermaatschappij en de verbonden onderneming waarvan de toegelaten instelling meer
      dan de helft van de bestuurders kan benoemen of ontslaan, geen payer swaps aantrekt, indien en zolang de omvang
      van die liquiditeitsbuffer zodanig gering is, dat niet kan worden voldaan aan de uit het gebruik van financiële
      derivaten voortvloeiende liquiditeitsverplichtingen ten gevolge van een daling van de vaste rente in de markt van
      rentederivaten met 1%-punt.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel108
  - number: '108.2'
    text: |-
      Bij ministeriële regeling kunnen nadere voorschriften worden gegeven omtrent de toepassing van het eerste lid,
      onderdeel a.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel108
  - number: '110.1'
    text: |-
      De toegelaten instellingen zijn niet betrokken bij de volkshuisvesting buiten Nederland waarop
      [artikel 40 van de wet][ref1] niet van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel40
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel110
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '40'
  - number: '110.2'
    text: |-
      Garanties die met goedkeuring van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer, Onze
      Minister voor Wonen, Wijken en Integratie, Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties of Onze
      Minister voor 1 juli 2015 zijn verleend in verband met een betrokkenheid als bedoeld in het eerste lid, kunnen
      worden aangesproken overeenkomstig de voorwaarden waaronder zij zijn verleend.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel110
  - number: 110a.1
    text: 'De adviescommissie noodzakelijke werkzaamheden bestaat uit vijf leden, waaronder:'
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel110a
  - number: 110a.1.a
    text: de voorzitter;
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel110a
  - number: 110a.1.b
    text: een lid, op schriftelijke voordracht van de in het belang van de toegelaten instellingen werkzame organisaties; en
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel110a
  - number: 110a.1.c
    text: |-
      een lid dat beschikt over financiële kennis, waaronder kennis van de herstructurering en het herstel van
      organisaties.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel110a
  - number: 110a.2
    text: |-
      Onze Minister benoemt de leden voor een periode van ten hoogste vier jaar, en zij kunnen tweemaal voor ten hoogste
      vier jaar worden herbenoemd.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel110a
  - number: 110a.3
    text: |-
      Ieder lid kan te allen tijde door Onze Minister worden geschorst of ontslagen op verzoek of indien de
      omstandigheden daar aanleiding toe geven.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel110a
  - number: 110a.4
    text: |-
      De leden hebben zitting op persoonlijke titel en oefenen hun functie uit zonder last of ruggespraak. De leden
      beschikken gezamenlijk over de deskundigheid, ervaring en affiniteit voor het uitvoeren van de taken, bedoeld in
      [artikel 56a, tweede lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel56a
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel110a
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 56a
  - number: 110a.5
    text: |-
      Een lid vervult geen functie waarvan de uitoefening ongewenst is met het oog op een goede vervulling van diens
      lidmaatschap of het behoud van en het vertrouwen in diens onpartijdigheid en onafhankelijkheid.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel110a
  - number: 110b.1
    text: |-
      De adviescommissie noodzakelijke werkzaamheden stelt haar eigen werkwijze vast die de goedkeuring behoeft van Onze
      Minister.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel110b
  - number: 110b.2
    text: Onze Minister voorziet in het secretariaat van de adviescommissie noodzakelijke werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel110b
  - number: 110b.3
    text: |-
      De leden van de adviescommissie noodzakelijke werkzaamheden ontvangen per
      vergadering een vergoeding, voor zover zij niet vallen onder de uitzondering van
      [artikel 2, derde lid, van de Wet vergoedingen adviescolleges en commissies][ref1] en hiermee niet het in
      [artikel 6, eerste lid, van het Besluit vergoedingen adviescolleges en commissies][ref2] bedoelde maximumbedrag
      overschrijden.


      [ref1]: https://wetten.overheid.nl/BWBR0024775#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0025279#Artikel6
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel110b
    references:
      - id: ref1
        bwb_id: BWBR0024775
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0025279
        artikel: '6'
  - number: 110b.4
    text: |-
      De adviescommissie noodzakelijke werkzaamheden brengt uiterlijk twaalf weken nadat het adviesverzoek, bedoeld in
      [artikel 56a, tweede lid, van de wet][ref1] bij haar is ingediend advies uit. De adviescommissie noodzakelijke
      werkzaamheden kan deze termijn door schriftelijke kennisgeving daarvan aan de verzoekende toegelaten instelling
      telkens gemotiveerd verlengen met een door haar daarbij te bepalen termijn van ten hoogste vier weken, van welke
      verlenging zij kennis geeft voor het verstrijken van de beslistermijn.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel56a
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel110b
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 56a
  - number: 110b.5
    text: |-
      De adviescommissie noodzakelijke werkzaamheden draagt zo spoedig mogelijk na het afronden van een advies of, indien
      de omstandigheden daartoe aanleiding geven zoveel eerder, de bescheiden betreffende die werkzaamheden voor een
      advies over aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel110b
  - number: 110b.6
    text: |-
      Bij ministeriële regeling kunnen nadere voorschriften worden gegeven omtrent wijze van verantwoording en
      ondersteuning van de adviescommissie noodzakelijke werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel110b
  - number: 110c.1
    text: |-
      Een verzoek waarbij een advies als bedoeld in [artikel 56a, tweede lid, van de wet][ref1] aan de adviescommissie
      noodzakelijke werkzaamheden wordt gevraagd, wordt door de verzoekende partij ondertekend en bevat ten minste:


      [ref1]: https://wetten.overheid.nl/BWBR0005181
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel110c
    references:
      - id: ref1
        bwb_id: BWBR0005181
  - number: 110c.1.a
    text: de dagtekening;
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel110c
  - number: 110c.1.b
    text: de naam en het adres van de betrokken toegelaten instelling;
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel110c
  - number: 110c.1.c
    text: |-
      een beschrijving van de situatie als bedoeld in [artikel 29, eerste lid, eerste volzin, van de wet][ref1] van de
      betrokken toegelaten instelling; en


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel29
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel110c
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '29'
  - number: 110c.1.d
    text: |-
      een beschrijving van de volkshuisvestelijke situatie op de korte, middellange en lange termijn, waaronder in ieder
      geval de bevolkingssamenstelling en vraag naar typen woningen.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel110c
  - number: 110c.2
    text: |-
      De toegelaten instelling die een verzoek als bedoeld in het eerste lid aan de adviescommissie noodzakelijke
      werkzaamheden voorlegt, verschaft voorts de bescheiden die voor het advies van de adviescommissie noodzakelijke
      werkzaamheden nodig zijn en waarover hij redelijkerwijs de beschikking kan krijgen. Tot deze gegevens behoren in
      ieder geval:
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel110c
  - number: 110c.2.a
    text: |-
      de bescheiden, bedoeld in [artikel 38, eerste lid en tweede lid, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel38
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel110c
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '38'
  - number: 110c.2.b
    text: |-
      de in de betreffende gemeente geldende woonvisie, bedoeld in [artikel 42, eerste lid, van de wet][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel42
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel110c
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '42'
  - number: 110c.2.c
    text: de bescheiden, bedoeld in artikel 44a, eerste lid en tweede lid, van de wet.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel110c
  - number: 110c.3
    text: |-
      De toegelaten instelling die het verzoek tot advies aan de adviescommissie noodzakelijke werkzaamheden richt,
      zendt een afschrift van het verzoek aan toegelaten instellingen die feitelijk werkzaam zijn in hetzelfde gebied,
      bedoeld in [artikel 41b, tweede lid, van de wet][ref1] als de verzoekende instelling en de partijen genoemd in
      [artikel 110f, onderdelen b, c, d, g, h en i][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel41b
      [ref2]: https://wetten.overheid.nl/BWBR0036702#Artikel110f
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel110c
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 41b
      - id: ref2
        bwb_id: BWBR0036702
        artikel: 110f
        hoofdstuk: VI
        paragraaf: '4'
        afdeling: '1'
  - number: 110d.1
    text: |-
      De adviescommissie noodzakelijke werkzaamheden betrekt in haar advies ten aanzien van
      [artikel 56a, tweede lid, van de wet][ref1] in ieder geval:


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel56a
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel110d
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 56a
  - number: 110d.1.a
    text: |-
      de zienswijzen van de autoriteit en een organisatie die zich ten doel stelt de belangen van toegelaten instellingen
      te behartigen over de omvang van de in [artikel 56a, tweede lid, onderdeel a, van de wet][ref1] bedoelde
      noodzakelijke werkzaamheden alsmede de mogelijkheden, waaronder en de financiële draagkracht om die werkzaamheden
      binnen een redelijke termijn voort te zetten, van de toegelaten instellingen die feitelijk werkzaam zijn in
      hetzelfde gebied aangewezen op grond van [artikel 41b, eerste lid][ref2], als de verzoekende toegelaten instelling;


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel56a
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel41b
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel110d
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 56a
      - id: ref2
        bwb_id: BWBR0005181
        artikel: 41b
  - number: 110d.1.b
    text: |-
      de zienswijzen van de colleges van burgemeester en wethouders van de gemeenten waar de verzoekende toegelaten
      instelling meer dan 5% van het totaal van de diensten bedoeld in [artikel 47, eerste lid, van de wet][ref1] in
      die gemeente verricht, over de omvang van de in [artikel 56a, tweede lid, onderdeel a, van de wet][ref2] bedoelde
      noodzakelijke werkzaamheden;


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel56a
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel110d
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '47'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: 56a
  - number: 110d.1.c
    text: |-
      de zienswijzen van de in het belang van de huurders van de woongelegenheden van de verzoekende
      toegelaten instelling werkzame huurdersorganisaties en bewonerscommissies over de omvang van de in
      [artikel 56a, tweede lid, onderdeel a, van de wet][ref1], bedoelde noodzakelijke werkzaamheden;


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel56a
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel110d
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 56a
  - number: 110d.1.d
    text: |-
      de zienswijzen van de toegelaten instellingen die feitelijk werkzaam zijn in hetzelfde gebied aangewezen op grond
      van in [artikel 41b, eerste lid, van de wet][ref1] als de verzoekende instelling; en


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel41b
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel110d
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 41b
  - number: 110d.1.e
    text: |-
      de zienswijze van de borgingsvoorziening over de risico’s voor de borgstelling van het conceptadvies dat de
      Adviescommissie noodzakelijke werkzaamheden voornemens is uit te brengen.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel110d
  - number: 110d.2
    text: |-
      De adviescommissie noodzakelijke werkzaamheden stelt de in het eerste lid bedoelde partijen in de gelegenheid hun
      zienswijze aan haar kenbaar te maken binnen een termijn van:
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel110d
  - number: 110d.2.a
    text: vier weken, voor de zienswijzen bedoeld in het eerste lid, onderdelen a, b, c en d;
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel110d
  - number: 110d.2.b
    text: twee weken, voor de zienswijze bedoeld in het eerste lid, onderdeel e.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel110d
  - number: 110e.1
    text: |-
      De adviescommissie noodzakelijke werkzaamheden hanteert de volgende uitgangspunten voor de vaststelling van haar
      advies:
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel110e
  - number: 110e.1.a
    text: |-
      de omvang van de in [artikel 56a, tweede lid, onderdeel a, van de wet][ref1] bedoelde noodzakelijke werkzaamheden
      is niet groter dan hetgeen in de zienswijzen, bedoeld in [artikel 110d, eerste lid, onderdeel b][ref2], naar voren
      is gebracht;


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel56a
      [ref2]: https://wetten.overheid.nl/BWBR0036702#Artikel110d
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel110e
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 56a
      - id: ref2
        bwb_id: BWBR0036702
        artikel: 110d
        hoofdstuk: VI
        paragraaf: '3'
        afdeling: '1'
  - number: 110e.1.b
    text: |-
      bij het onderzoek naar de in [artikel 56a, tweede lid, onderdeel b, van de wet ][ref1]bedoelde mogelijkheden wordt
      de investeringscapaciteit van toegelaten instellingen vastgesteld aan de hand van informatie uit het overzicht,
      bedoeld in artikel 44a, eerste lid, onderdeel a, van de wet en de door de autoriteit kenbaar gemaakte financiële
      normen.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel56a
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel110e
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 56a
  - number: 110e.1.c
    text: |-
      het onderzoek naar de in [artikel 56a, tweede lid, onderdeel b, van de wet][ref1] bedoelde mogelijkheden
      wordt gericht op toegelaten instellingen die feitelijk werkzaam zijn in hetzelfde gebied aangewezen op grond
      van [artikel 41b, eerste lid, van de wet][ref2] als de verzoekende toegelaten instelling, waarbij voorts als
      prioritering geldt, tenzij afwijking daarvan in het belang van de volkshuisvesting is:


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel56a
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel41b
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel110e
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 56a
      - id: ref2
        bwb_id: BWBR0005181
        artikel: 41b
  - number: 110e.1.c.1°
    text: |-
      de toegelaten instellingen die feitelijk werkzaam zijn in dezelfde gemeenten als de verzoekende toegelaten
      instelling;
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel110e
  - number: 110e.1.c.2°
    text: |-
      de toegelaten instellingen die feitelijk werkzaam zijn in gemeenten die grenzen aan de gemeenten waar de
      verzoekende toegelaten instelling feitelijk werkzaam is;
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel110e
  - number: 110e.1.c.3°
    text: |-
      de toegelaten instellingen die feitelijk werkzaam zijn in de nabijheid van de gemeenten waar de verzoekende
      toegelaten instelling feitelijk werkzaam is.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel110e
  - number: 110e.2
    text: 'De adviescommissie noodzakelijke werkzaamheden betrekt bij haar advies:'
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel110e
  - number: 110e.2.a
    text: |-
      de woonvisie, bedoeld in [artikel 42, eerste lid, van de wet][ref1] van de betrokken gemeente(n); en


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel42
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel110e
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '42'
  - number: 110e.2.b
    text: |-
      de afspraken als bedoeld in [artikel 44, eerste lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel44
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel110e
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '44'
  - number: 110e.3
    text: 'De adviescommissie noodzakelijke werkzaamheden weegt in ieder geval mee in haar advies:'
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel110e
  - number: 110e.3.a
    text: |-
      de financiële en de volkshuisvestelijke gevolgen van de door de adviescommissie noodzakelijke
      werkzaamheden verschillende te overwegen scenario’s in het kader van het advies, bedoeld in
      [artikel 56a, tweede lid, van de wet][ref1] voor alle daarbij betrokken partijen; en


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel56a
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel110e
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 56a
  - number: 110e.3.b
    text: |-
      de kwaliteit van de woningen, waaronder de mogelijkheden tot verduurzaming in het kader van het advies bedoeld in
      [artikel 56a, tweede lid, onder c, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel56a
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel110e
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 56a
  - number: 110e.4
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld over het eerste en derde lid.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel110e
  - number: 110f
    text: |-
      De adviezen, bedoeld in [artikel 56a, tweede lid, van de wet][ref1] worden verstrekt aan:


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel56a
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel110f
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 56a
  - number: 110f.a
    text: |-
      de verzoekende toegelaten instelling, bedoeld in [artikel 56a, tweede lid, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel56a
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel110f
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 56a
  - number: 110f.b
    text: de gemeenten waar de verzoekende toegelaten instelling feitelijk werkzaam is;
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel110f
  - number: 110f.c
    text: |-
      de in het belang van de huurders van de woongelegenheden van de verzoekende toegelaten instelling werkzame
      huurdersorganisaties;
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel110f
  - number: 110f.d
    text: |-
      toegelaten instellingen die feitelijk werkzaam zijn in hetzelfde gebied als bedoeld in
      [artikel 41b, tweede lid][ref1], als de verzoekende toegelaten instelling;


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel41b
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel110f
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 41b
  - number: 110f.e
    text: |-
      de toegelaten instellingen die op grond van het advies van belang zijn om de in
      [artikel 56a, tweede lid, onder a, van de wet][ref1] bedoelde noodzakelijke werkzaamheden binnen een redelijke
      termijn voort te zetten;


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel56a
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel110f
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 56a
  - number: 110f.f
    text: |-
      de toegelaten instellingen die op grond van [artikel 56, derde lid][ref1], inlichtingen hebben verschaft aan de
      adviescommissie noodzakelijke werkzaamheden;


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel56
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel110f
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '56'
  - number: 110f.g
    text: de in het belang van de toegelaten instellingen werkzame organisaties;
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel110f
  - number: 110f.h
    text: de borgingsvoorziening; en
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel110f
  - number: 110f.i
    text: de autoriteit.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel110f
  - number: 110g.1
    text: |-
      Indien de minister een aanwijzing geeft als bedoeld in [artikel 56b, eerste lid, van de wet][ref1] geschiedt de
      overdracht tegen de getaxeerde marktwaarde.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel56b
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel110g
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 56b
  - number: 110g.2
    text: |-
      De minister stelt de borgingsvoorziening in de gelegenheid haar zienswijzen als bedoeld in
      [artikel 56b, eerste lid, onderdeel d, van de wet][ref1] aan hem kenbaar te maken binnen een termijn van twee
      weken. Indien de borgingsvoorziening binnen die termijn geen zienswijze heeft verstrekt, wordt zij geacht geen
      bezwaren te hebben tegen de voorgenomen aanwijzing.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel56b
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel110g
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 56b
  - number: '111.1'
    text: |-
      De aanvraag om een subsidie als bedoeld in [artikel 57, eerste lid, aanhef en onderdeel a, van de wet][ref1], door
      de toegelaten instelling die niet beschikt over de financiële middelen om haar werkzaamheden te kunnen voortzetten,
      gaat in elk geval vergezeld van:


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel57
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel111
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '57'
  - number: 111.1.a
    text: |-
      een analyse van de oorzaken die hebben geleid tot de situatie dat de toegelaten instelling niet beschikt over de
      financiële middelen om haar werkzaamheden te kunnen voortzetten;
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel111
  - number: 111.1.b
    text: |-
      een overzicht en een analyse van de financiële situatie van de toegelaten instelling op het tijdstip van indiening
      van die aanvraag, waaronder in elk geval haar balans, haar liquiditeits- en solvabiliteitspositie, een aan
      die posities gerelateerde en naar baten en lasten gespecificeerde meerjarenanalyse van de door haar verwachte
      kasstromen, en een analyse van haar leningportefeuille;
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel111
  - number: 111.1.c
    text: 'meerjarenanalyses ten aanzien van in elk geval:'
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel111
  - number: 111.1.c.1°
    text: |-
      mogelijke besparingen op de kosten van de bedrijfsvoering van de toegelaten instelling en de naar haar oordeel
      noodzakelijke kosten van de instandhouding van en het treffen van voorzieningen aan haar onroerende zaken;
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel111
  - number: 111.1.c.2°
    text: |-
      de verhuurbaarheid van haar onroerende zaken en mogelijke optimalisatie van haar huuropbrengsten, gelet op de vraag
      naar en het aanbod van woongelegenheden in de gemeenten waar zij feitelijk werkzaam is;
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel111
  - number: 111.1.c.3°
    text: de mogelijkheden voor het vervreemden van haar onroerende zaken en
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel111
  - number: 111.1.c.4°
    text: |-
      de mogelijkheden om haar werkzaamheden die behoren tot de diensten van algemeen economisch belang door andere
      toegelaten instellingen te laten voortzetten;
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel111
  - number: 111.1.d
    text: |-
      het laatstelijk opgestelde overzicht, bedoeld in [artikel 44a, eerste lid, onderdeel a, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel44a
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel111
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 44a
  - number: 111.1.e
    text: |-
      het door Onze Minister goed te keuren saneringsplan waarover de toegelaten instelling overleg heeft gevoerd met de
      gemeenten waar zij feitelijk werkzaam is en met de borgingsvoorziening;
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel111
  - number: 111.1.f
    text: de uitkomsten van het overleg, bedoeld in onderdeel e en;
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel111
  - number: 111.1.g
    text: |-
      het advies, bedoeld in [artikel 56a, tweede lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel56a
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel111
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 56a
  - number: '111.2'
    text: |-
      Indien uit de analyse, bedoeld in het eerste lid, onderdeel a, naar het oordeel van Onze Minister blijkt dat de
      daarin genoemde oorzaken geheel of ten dele voortvloeien uit de werkzaamheden van de toegelaten instelling die
      niet behoren tot de diensten van algemeen economisch belang, neemt de toegelaten instelling in het saneringsplan
      mogelijke maatregelen op om die werkzaamheden zo spoedig mogelijk te beëindigen of door andere rechtspersonen of
      vennootschappen te laten voortzetten.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel111
  - number: '111.3'
    text: |-
      Het saneringsplan bestrijkt een daarin op te nemen periode van ten hoogste 10 jaar. De stukken, bedoeld in het
      eerste lid, onderdelen b en c, bestrijken de periode die het saneringsplan bestrijkt.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel111
  - number: '111.4'
    text: |-
      Het doel van het saneringsplan is dat een toegelaten instelling, na de periode die het saneringsplan bestrijkt, de
      in [artikel 56a, tweede lid, onderdeel a, van de wet][ref1] bedoelde werkzaamheden kan verrichten of voortzetten.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel56a
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel111
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 56a
  - number: '111.5'
    text: 'Het saneringsplan omvat in elk geval:'
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel111
  - number: 111.5.a
    text: |-
      een overzicht van de maatregelen die de toegelaten instelling, al dan niet in samenwerking met andere personen of
      instanties, neemt of zal nemen in relatie tot de meerjarenanalyses, bedoeld in het eerste lid, onderdeel c;
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel111
  - number: 111.5.b
    text: |-
      een overzicht van de maatregelen die de toegelaten instelling neemt of zal nemen om te voldoen aan het reglement,
      bedoeld in [artikel 55a, tweede lid, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel55a
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel111
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 55a
  - number: 111.5.c
    text: |-
      de uitkomsten van overleg met personen en instanties die betrokken zijn bij de financiering of de werkzaamheden van
      de toegelaten instelling over het door hen financieel bijdragen aan de uitvoering van het saneringsplan en
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel111
  - number: 111.5.d
    text: |-
      een raming, in relatie tot de meerjarenanalyse, bedoeld in het eerste lid, onderdeel b, van de benodigde subsidie
      als bedoeld in [artikel 57, eerste lid, aanhef en onderdeel a, van de wet][ref1], alsmede de gewenste vorm van die
      subsidie en het gewenste tijdstip of de gewenste tijdstippen van uitbetaling van die subsidie.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel57
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel111
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '57'
  - number: '111.6'
    text: |-
      Indien op grond van het saneringsplan uitsluitend een of meerdere andere toegelaten instellingen dan de toegelaten
      instelling, bedoeld in het eerste lid, een subsidie als bedoeld in dat lid zullen aanvragen, dan zendt de
      laatstbedoelde toegelaten instelling zo spoedig mogelijk na de goedkeuring van het saneringsplan de stukken,
      bedoeld in dat lid, aan Onze Minister ten behoeve van de behandeling van de aanvragen van een of meerdere van
      die andere toegelaten instellingen, met dien verstande dat het tijdstip, bedoeld in onderdeel b van dat lid, het
      tijdstip van verzending van die stukken betreft.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel111
  - number: '111.7'
    text: |-
      Bij ministeriële regeling kunnen voorschriften worden gegeven omtrent de inrichting van de stukken, bedoeld in het
      eerste lid.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel111
  - number: '112.1'
    text: |-
      Onze Minister verstrekt uitsluitend een subsidie als bedoeld in
      [artikel 57, eerste lid, aanhef en onderdeel a, van de wet][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel57
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '57'
  - number: 112.1.a
    text: |-
      indien naar zijn oordeel zonder die subsidie een toegelaten instelling niet in staat is om de betrokken
      werkzaamheden die behoren tot de diensten van algemeen economisch belang te kunnen verrichten of voortzetten;
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel112
  - number: 112.1.b
    text: |-
      indien het verrichten of voortzetten van die werkzaamheden naar het oordeel van burgemeester en wethouders van de
      gemeenten waar zij worden verricht noodzakelijk is voor het in stand houden van voldoende woongelegenheden in die
      gemeenten, als bedoeld in [artikel 47, eerste lid, onderdelen b en c, van de wet][ref1] en


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel47
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '47'
  - number: 112.1.c
    text: |-
      voor zover hij over voldoende middelen daarvoor beschikt als verkregen of te verkrijgen uit de bijdragen, bedoeld
      in [artikel 58, tweede lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel58
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '58'
  - number: '112.2'
    text: |-
      De subsidie is niet hoger dan het bedrag dat naar het oordeel van Onze Minister noodzakelijk is om te waarborgen
      dat een toegelaten instelling na uitvoering van het saneringsplan over voldoende financiële middelen beschikt om de
      in [artikel 56a, tweede lid, onderdeel a, van de wet][ref1] bedoelde werkzaamheden te verrichten of voort te zetten
      in het geval:


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel56a
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 56a
  - number: 112.2.a
    text: |-
      de werkzaamheden worden verricht of voortgezet door een andere toegelaten instelling dan de toegelaten instelling
      die de subsidie ontvangt, wordt de hoogte vastgesteld met inachtneming van het verschil tussen de waarde waartegen
      de andere toegelaten instelling met inachtneming van haar financiële continuïteit die werkzaamheden kan verkrijgen
      en de getaxeerde marktwaarde daarvan; of
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel112
  - number: 112.2.b
    text: |-
      de werkzaamheden worden verricht of voortgezet door de toegelaten instelling die de subsidie ontvangt, wordt de
      hoogte vastgesteld met inachtneming van haar financiële continuïteit en, voor zover werkzaamheden worden verricht
      zonder dat daartoe een wettelijke verplichting bestaat, voor die werkzaamheden aan de hand van een benchmark met
      andere toegelaten instellingen waarbij het niveau gelijk is aan de bovenkant van het onderste kwintiel.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel112
  - number: '112.3'
    text: |-
      Onze Minister kan aan de verstrekking van de subsidie voorwaarden en verplichtingen verbinden ter waarborging van
      de uitvoering van het saneringsplan.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel112
  - number: '113.1'
    text: |-
      In de aanvraag om een subsidie als bedoeld in [artikel 57, eerste lid, aanhef en onderdeel b, van de wet][ref1]
      maakt de toegelaten instelling aannemelijk, dat:


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel57
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel113
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '57'
  - number: 113.1.a
    text: |-
      zij over onvoldoende financiële middelen beschikt om bepaalde, in de aanvraag op te nemen, werkzaamheden te kunnen
      verrichten;
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel113
  - number: 113.1.b
    text: |-
      de werkzaamheden in verband met welke die subsidie wordt aangevraagd zijn opgenomen in het overzicht, bedoeld
      in [artikel 44a, eerste lid, onderdeel a, van de wet][ref1], of ingevolge een aanwijzing als bedoeld in
      [artikel 61d van de wet][ref2] aan haar zijn opgedragen, en


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel44a
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel61d
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel113
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 44a
      - id: ref2
        bwb_id: BWBR0005181
        artikel: 61d
  - number: 113.1.c
    text: |-
      personen of instanties die geen toegelaten instelling zijn niet of niet volledig bereid zijn die werkzaamheden te
      verrichten of daarvoor financiële middelen te verstrekken.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel113
  - number: '113.2'
    text: |-
      De aanvraag om een subsidie als bedoeld in [artikel 57, eerste lid, aanhef en onderdeel b, van de wet][ref1] gaat
      in elk geval vergezeld van:


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel57
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel113
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '57'
  - number: 113.2.a
    text: |-
      het projectplan met betrekking tot de werkzaamheden in verband met welke die subsidie wordt aangevraagd, dat in
      elk geval inzicht geeft in aard en duur van die werkzaamheden, alsmede de financiële baten en lasten die met die
      werkzaamheden samenhangen;
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel113
  - number: 113.2.b
    text: |-
      de zienswijze op dat projectplan van de gemeente of gemeenten waar die werkzaamheden zijn voorzien, en van de
      betrokken bewonersorganisaties;
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel113
  - number: 113.2.c
    text: een toelichting op de omstandigheden, bedoeld in het eerste lid, onderdeel c;
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel113
  - number: 113.2.d
    text: |-
      de bijdragen aan de werkzaamheden, die kunnen worden verkregen door toepassing van
      [artikel 42, tweede lid, van de wet][ref1] en van personen of instanties die geen toegelaten instelling zijn, en


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel42
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel113
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '42'
  - number: 113.2.e
    text: een raming, in relatie tot de bijdragen, bedoeld in onderdeel d, van de benodigde zodanige subsidie.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel113
  - number: '113.3'
    text: |-
      Bij ministeriële regeling kunnen voorschriften worden gegeven omtrent de inrichting van de stukken, bedoeld in het
      tweede lid.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel113
  - number: '114.1'
    text: |-
      Onze Minister verstrekt uitsluitend een subsidie als bedoeld in
      [artikel 57, eerste lid, aanhef en onderdeel b, van de wet][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel57
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel114
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '57'
  - number: 114.1.a
    text: |-
      indien de werkzaamheden in verband met welke de toegelaten instelling die subsidie heeft aangevraagd behoren tot de
      diensten van algemeen economisch belang;
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel114
  - number: 114.1.b
    text: |-
      indien de toegelaten instelling de werkzaamheden in verband met welke zij die subsidie heeft aangevraagd naar het
      oordeel van Onze Minister niet zonder die subsidie kan verrichten en
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel114
  - number: 114.1.c
    text: |-
      voor zover hij over voldoende middelen daarvoor beschikt als verkregen of te verkrijgen uit de bijdragen, bedoeld
      in [artikel 58, tweede lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel58
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel114
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '58'
  - number: '114.2'
    text: |-
      Bij de verstrekking van een subsidie als bedoeld in
      [artikel 57, eerste lid, aanhef en onderdeel b, van de wet][ref1] geeft Onze Minister voorrang aan
      aanvragen om een zodanige subsidie van toegelaten instellingen op welke een situatie als bedoeld in
      [artikel 29, eerste lid, eerste volzin, of tweede lid, eerste volzin, van de wet][ref2] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel57
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel29
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel114
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '57'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '29'
  - number: '114.3'
    text: |-
      De subsidie is niet hoger dan de kosten van de werkzaamheden ter tegemoetkoming in de kosten waarvan zij wordt
      verstrekt, verminderd met de door Onze Minister geraamde opbrengsten daaruit, en verminderd met bijdragen als
      bedoeld in [artikel 113, tweede lid, onderdeel d][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0036702#Artikel113
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel114
    references:
      - id: ref1
        bwb_id: BWBR0036702
        artikel: '113'
        hoofdstuk: VI
        paragraaf: '2'
        afdeling: '2'
  - number: '114.4'
    text: |-
      Bij ministeriële regeling kunnen nadere voorschriften worden gegeven omtrent de berekening van de subsidie, bedoeld
      in [artikel 57, eerste lid, aanhef en onderdeel b, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel57
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel114
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '57'
  - number: '115.1'
    text: |-
      De bijdrage, bedoeld in [artikel 58, tweede lid, van de wet][ref1], voor alle toegelaten instellingen gezamenlijk
      bestaat uit de som van:


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel58
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel115
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '58'
  - number: 115.1.a
    text: |-
      een door Onze Minister begroot bedrag ten behoeve van het verstrekken van subsidies als bedoeld in
      [artikel 57, eerste lid, aanhef en onderdeel a, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel57
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel115
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '57'
  - number: 115.1.b
    text: |-
      een door hem begroot bedrag ten behoeve van het verstrekken van subsidies als bedoeld in
      [artikel 57, eerste lid, aanhef en onderdeel b, van de wet][ref1] en


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel57
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel115
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '57'
  - number: 115.1.c
    text: |-
      een door hem begroot bedrag ten behoeve van de dekking van de kosten die zijn gemoeid met de verstrekking van
      subsidies als bedoeld in [artikel 57, eerste lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel57
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel115
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '57'
  - number: '115.2'
    text: |-
      Onze Minister begroot de bedragen, bedoeld in het eerste lid, zodanig, dat hij naar zijn oordeel over voldoende
      financiële middelen beschikt om uitvoering te geven aan [artikel 57, eerste lid, van de wet][ref1], met
      dien verstande dat het bedrag, bedoeld in het eerste lid, onderdeel a, en het bedrag, bedoeld in het eerste
      lid, onderdeel b, niet hoger is dan 5% onderscheidenlijk 1% van de gerealiseerde jaarhuuropbrengst van de
      woongelegenheden, als volgens het overzicht, bedoeld in [artikel 36a, vierde lid, van de wet][ref2], voor
      de bijdrageplichtige toegelaten instellingen gezamenlijk bepaald over het kalenderjaar voorafgaand aan het
      kalenderjaar waarover de bijdrage verschuldigd is.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel57
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel36a
