      statutenwijzigingen zijn opgenomen;
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel5
  - number: 5.b
    text: |-
      het bewijs dat de vereniging of de stichting is ingeschreven in een openbaar register, gehouden door de Kamer van
      Koophandel;
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel5
  - number: 5.c
    text: |-
      het bewijs dat een authentiek afschrift van de akte van oprichting of van de notariële akte waarin de statuten
      zijn opgenomen, dan wel een authentiek uittreksel van die akte, authentieke afschriften van de notariële akten
      waarin statutenwijzigingen zijn opgenomen en de statuten als laatstelijk gewijzigd ten kantore van die Kamer zijn
      neergelegd;
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel5
  - number: 5.d
    text: de reglementen van de vereniging of de stichting;
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel5
  - number: 5.e
    text: de meest recente balans, winst- en verliesrekening en begroting van de vereniging of de stichting;
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel5
  - number: 5.f
    text: |-
      andere bescheiden die bijdragen aan een juist en volledig inzicht van Onze Minister in de financiële situatie van
      de vereniging of de stichting en
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel5
  - number: 5.g
    text: |-
      afzonderlijke gegevens omtrent de te verhuren woongelegenheden van de vereniging of de stichting als bedoeld
      in [artikel 46, eerste lid, onderdeel b, van de wet][ref1], de te verhuren overige woongelegenheden van
      de vereniging of de stichting, de te verhuren gebouwen van de vereniging of de stichting als bedoeld in
      [artikel 45, tweede lid, onderdeel d, van de wet][ref2] en de te verhuren overige gebouwen van de vereniging of
      de stichting.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel45
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '46'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '45'
  - number: '6'
    text: |-
      Onze Minister beslist op het verzoek, bedoeld in [artikel 19, eerste lid, tweede volzin, van de wet][ref1], binnen
      zes weken na ontvangst van de zienswijzen, bedoeld in artikel 19, tweede lid, eerste volzin, van de wet. Indien
      een college van burgemeester en wethouders of een bewonersorganisatie zijn of haar zodanige zienswijze niet of
      niet tijdig aan Onze Minister heeft doen toekomen, beslist Onze Minister binnen zes weken na het verstrijken van de
      termijn, bedoeld in artikel 19, tweede lid, tweede volzin, van de wet.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel19
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '19'
  - number: '7.1'
    text: |-
      Teneinde te voldoen aan [artikel 20, vijfde lid, tweede volzin, van de wet][ref1] verkoopt Onze
      Minister of de persoon of instantie, bedoeld in de eerste volzin van dat lid, het overschot, bedoeld in
      [artikel 23b lid 1 van Boek 2 van het Burgerlijk Wetboek][ref2], voor zover daartoe iets anders dan geld
      behoort en de statuten van de ontbonden vereniging of stichting of een rechterlijke beschikking geen
      nadere aanwijzing behelzen. De verkoop geschiedt in het openbaar naar de plaatselijke gewoonten en op
      de gebruikelijke voorwaarden. Onze Minister of die persoon of instantie kan bepalen in welke volgorde
      woongelegenheden als bedoeld in [artikel 46, eerste lid, onderdeel b, van de wet][ref3] en gebouwen als bedoeld
      in [artikel 45, tweede lid, onderdeel d, van de wet][ref4] ter verkoop worden aangeboden aan de verschillende
      categorieën mogelijke verkrijgers van die woongelegenheden of gebouwen.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel23b
      [ref3]: https://wetten.overheid.nl/BWBR0005181#Artikel46
      [ref4]: https://wetten.overheid.nl/BWBR0005181#Artikel45
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '20'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: 23b
      - id: ref3
        bwb_id: BWBR0005181
        artikel: '46'
      - id: ref4
        bwb_id: BWBR0005181
        artikel: '45'
  - number: '7.2'
    text: |-
      Teneinde te voldoen aan [artikel 20, vijfde lid, tweede volzin, van de wet][ref1] besteedt Onze Minister de netto-
      opbrengst van de verkoop aan subsidies als bedoeld in [artikel 57, eerste lid, van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel57
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '20'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '57'
  - number: '9.1'
    text: |-
      Onze Minister keurt het zich verbinden, bedoeld in [artikel 21, eerste lid, eerste volzin, van de wet][ref1], niet
      goed, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel21
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '21'
  - number: 9.1.a
    text: |-
      het aantal potentieel te liberaliseren woongelegenheden van de toegelaten instelling, die zij voornemens is
      in de rechtspersoon of vennootschap onder te brengen, waaronder mede worden begrepen zodanige woongelegenheden
      in gemengde geliberaliseerde complexen en waaronder niet worden begrepen andere woongelegenheden in zodanige
      complexen, hoger is dan 10% van het aantal zodanige woongelegenheden dat de toegelaten instelling op 31 december
      2014 in eigendom had;
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel9
  - number: 9.1.b
    text: |-
      door dat zich verbinden strijdigheid zou ontstaan met
      [artikel 81, derde lid, eerste volzin, onverminderd de tweede, derde en vierde volzin van dat lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0036702#Artikel81
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0036702
        artikel: '81'
        hoofdstuk: V
        paragraaf: '1'
        afdeling: '6'
  - number: 9.1.c
    text: |-
      de verrekening tussen de betrokken rechtspersoon of vennootschap en de toegelaten instelling voor meer dan 60%
      geschiedt in de vorm van het inbrengen van kapitaal;
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel9
  - number: 9.1.d
    text: |-
      indien de toegelaten instelling in verband met dat onderbrengen een lening aan die rechtspersoon of vennootschap
      verstrekt: 'die lening:'
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel9
  - number: 9.1.d.1°
    text: geen hypothecaire geldlening is of
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel9
  - number: 9.1.d.2°
    text: |-
      niet voldoet aan het bepaalde bij en krachtens [artikel 10, tweede lid][ref1] en in verband daarmee vierde lid,
      onverminderd het bepaalde bij en krachtens artikel 10, derde lid en in verband daarmee vierde lid;


      [ref1]: https://wetten.overheid.nl/BWBR0036702#Artikel10
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0036702
        artikel: '10'
        hoofdstuk: III
        paragraaf: '3'
  - number: 9.1.e
    text: |-
      indien het voornemen bestaat zich te verbinden met een naamloze vennootschap als bedoeld in
      [artikel 64 van Boek 2 van het Burgerlijk Wetboek][ref1] of een besloten vennootschap met beperkte
      aansprakelijkheid als bedoeld in [artikel 175 van dat boek][ref2], de statuten van die naamloze of besloten
      vennootschap:


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel64
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel175
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '64'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '175'
  - number: 9.1.e.1°
    text: |-
      niet uitsluitend aandelen op naam kennen, geen blokkeringsregeling bevatten of toelaten dat met medewerking van
      de vennootschap certificaten aan toonder worden uitgegeven in het geval van een naamloze vennootschap en geen
      blokkeringsregeling bevatten in het geval van een besloten vennootschap;
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel9
  - number: 9.1.e.2°
    text: |-
      bepalingen bevatten die afwijken van [artikel 89 lid 1 tweede volzin][ref1], [92 lid 1][ref2], [105 lid 1][ref3],
      [135 lid 4][ref4], [198 lid 1][ref5], [201 lid 1][ref6] of [245 lid 1 van dat boek][ref7];


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel89
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel92
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Artikel105
      [ref4]: https://wetten.overheid.nl/BWBR0003045#Artikel135
      [ref5]: https://wetten.overheid.nl/BWBR0003045#Artikel198
      [ref6]: https://wetten.overheid.nl/BWBR0003045#Artikel201
      [ref7]: https://wetten.overheid.nl/BWBR0003045#Artikel245
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '89'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '92'
      - id: ref3
        bwb_id: BWBR0003045
        artikel: '105'
      - id: ref4
        bwb_id: BWBR0003045
        artikel: '135'
      - id: ref5
        bwb_id: BWBR0003045
        artikel: '198'
      - id: ref6
        bwb_id: BWBR0003045
        artikel: '201'
      - id: ref7
        bwb_id: BWBR0003045
        artikel: '245'
  - number: 9.1.e.3°
    text: |-
      bepalingen bevatten als bedoeld in de [artikelen 192 lid 1 aanhef en onder a][ref1] en
      [242 lid 1 eerste volzin van dat boek][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel192
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel242
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '192'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '242'
  - number: 9.1.e.4°
    text: |-
      niet bepalen dat de voorafgaande goedkeuring van de algemene vergadering van die naamloze of besloten vennootschap
      is vereist voor besluiten van haar bestuur over:
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel9
  - number: 9.1.e.4°.i
    text: |-
      dienovereenkomstige aangelegenheden als die, bedoeld in
      [artikel 26, eerste lid, onderdelen c en i, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel26
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '26'
  - number: 9.1.e.4°.ii
    text: |-
      het oprichten van een dochtermaatschappij of het deelnemen in een rechtspersoon of vennootschap in de zin van
      [artikel 24c van Boek 2 van het Burgerlijk Wetboek][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel24c
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 24c
  - number: 9.1.e.4°.iii
    text: |-
      het verstrekken van een lening aan of het zich in enigerlei opzicht garant stellen voor een dochtermaatschappij of
      een rechtspersoon of vennootschap als bedoeld onder ii; of
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel9
  - number: 9.1.e.5°
    text: |-
      niet bepalen, indien en zolang die naamloze of besloten vennootschap een dochtermaatschappij van de toegelaten
      instelling is, dat haar bestuur zich gedraagt naar de aanwijzingen van de algemene vergadering, welke bepaling in
      de statuten van die naamloze vennootschap kan worden beperkt tot aanwijzingen van die vergadering die de algemene
      lijnen van het te voeren beleid op nader in die statuten aangegeven terreinen betreffen.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel9
  - number: '9.2'
    text: |-
      Onze Minister betrekt bij zijn oordeel, bedoeld in [artikel 21, eerste lid, onderdeel b, van de wet][ref1], in
      elk geval:


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel21
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '21'
  - number: 9.2.a
    text: de geraamde solvabiliteit van de toegelaten instelling na een zich verbinden als bedoeld in dat lid;
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel9
  - number: 9.2.b
    text: |-
      de verhouding tussen het saldo van de operationele kasstromen en de rentelasten van de toegelaten instelling
      gedurende de eerste vijf jaren na een zich zodanig verbinden en
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel9
  - number: 9.2.c
    text: |-
      de meest recente beoordeling door de borgingsvoorziening van de kredietwaardigheid van de toegelaten instelling,
      indien zij leningen als bedoeld in [artikel 66, eerste lid, onderdeel f][ref1], heeft aangetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0036702#Artikel66
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0036702
        artikel: '66'
        hoofdstuk: V
        paragraaf: '3'
        afdeling: '5'
  - number: '9.3'
    text: |-
      Onze Minister kan op verzoek van de toegelaten instelling een hoger percentage dan dat, genoemd in het eerste lid,
      onderdeel a, vaststellen, indien:
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel9
  - number: 9.3.a
    text: |-
      de toegelaten instelling bij dat verzoek aannemelijk heeft gemaakt dat toepassing van dat hogere percentage
      noodzakelijk is om haar financiële continuïteit of die van de betrokken rechtspersoon of vennootschap voldoende te
      waarborgen, of
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel9
  - number: 9.3.b
    text: |-
      aantoont dat toereikend toepassing gegeven kan worden aan [artikel 42, eerste lid, eerste volzin, van de wet][ref1]
      wat betreft haar werkzaamheden die diensten van algemeen economisch belang zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel42
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '42'
  - number: '9.4'
    text: Bij ministeriële regeling kunnen nadere voorschriften worden gegeven omtrent de toepassing van dit artikel.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel9
  - number: '10.1'
    text: |-
      De financiële continuïteit, bedoeld in [artikel 21, eerste lid, tweede volzin, onderdeel e, van de wet][ref1],
      is niet voldoende gewaarborgd, indien Onze Minister van oordeel is dat de financiële middelen van de betrokken
      toegelaten instelling of rechtspersoon of vennootschap onvoldoende zullen blijken te zijn om hun voorgenomen
      werkzaamheden te kunnen verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel21
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '21'
  - number: '10.2'
    text: |-
      Een lening als bedoeld in [artikel 21, eerste lid, tweede volzin, onderdeel f, van de wet][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel21
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '21'
  - number: 10.2.a
    text: |-
      heeft een rentepercentage dat gelijk is aan de op het tijdstip van indiening van het verzoek om een goedkeuring als
      bedoeld in [artikel 21, eerste lid, eerste volzin, van de wet][ref1] geldende rente op tienjarige staatsleningen,
      vermeerderd met een bij ministeriële regeling te bepalen percentage, en


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel21
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '21'
  - number: 10.2.b
    text: |-
      wordt binnen vijftien jaar afgelost in liquide middelen en zodanig, dat na vijf en tien jaar ten minste een derde
      respectievelijk twee derde deel is afgelost.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel10
  - number: '10.3'
    text: |-
      De toegelaten instelling kan Onze Minister verzoeken om de aflossing, bedoeld in het tweede lid, onderdeel b,
      op een later tijdstip te stellen of het af te lossen bedrag lager vast te stellen. Onze Minister willigt het
      verzoek uitsluitend in, indien naar zijn oordeel daardoor wordt voorkomen dat de financiële continuïteit van de
      rechtspersoon of vennootschap niet meer is gewaarborgd en de financiële continuïteit van de toegelaten instelling
      gewaarborgd blijft. Hij kan aan dat inwilligen nadere voorwaarden verbinden.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel10
  - number: '10.4'
    text: Bij ministeriële regeling kunnen nadere voorschriften worden gegeven omtrent de toepassing van dit artikel.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel10
  - number: '11'
    text: |-
      Onze Minister willigt een verzoek als bedoeld in [artikel 21, vijfde lid, van de wet][ref1] uitsluitend in, indien
      de betrokken samenwerkingsvennootschap uitsluitend is opgericht:


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel21
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '21'
  - number: 11.a
    text: |-
      met het oogmerk om mogelijk te maken dat de daarin samenwerkende toegelaten instellingen bijdragen aan elkaars
      werkzaamheden met het oog op het voldoen aan [artikel 42, eerste lid, eerste volzin, van de wet][ref1] of


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel42
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '42'
  - number: 11.b
    text: |-
      met het oogmerk dat het in stand houden van of het treffen van voorzieningen aan woongelegenheden van een
      toegelaten instelling, die zijn gelegen in een gemeente of regio als bedoeld in [artikel 41b van de wet][ref1] waar
      die toegelaten instelling niet feitelijk werkzaam is, geschiedt door een toegelaten instelling die in die gemeente
      of regio feitelijk werkzaam is.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel41b
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 41b
  - number: '12.1'
    text: |-
      Onze Minister kan ontheffing als bedoeld [21a, derde lid, van de wet][ref1] verlenen indien:


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel21a
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 21a
  - number: 12.1.a
    text: |-
      het verschaffen van vermogen plaatsvindt door het kwijtschelden van schulden van de met haar verbonden onderneming,
      indien:
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel12
  - number: 12.1.a.1
    text: de toegelaten instelling enig aandeelhouder is van de verbonden onderneming;
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel12
  - number: 12.1.a.2
    text: de verbonden onderneming uitsluitend schulden heeft bij de toegelaten instelling;
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel12
  - number: 12.1.a.3
    text: de waarde van de activa van de verbonden onderneming nihil is, en
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel12
  - number: 12.1.a.4
    text: de verbonden onderneming na kwijtschelding van de schulden wordt ontbonden;
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel12
  - number: 12.1.b
    text: |-
      het verstrekken van vermogen plaatsvindt bij het bewerkstelligen van een administratieve scheiding of
      juridische scheiding als bedoeld in [Hoofdstuk IV, Afdeling 3, paragraaf 4][ref1], onderscheidenlijk
      [paragraaf 5, van de wet][ref2] aan een dochtermaatschappij en het verschaffen van vermogen voor maximaal 60%
      geschiedt in de vorm van het inbrengen van kapitaal;


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Paragraaf4
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Paragraaf5
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005181
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0005181
        paragraaf: '5'
  - number: 12.1.c
    text: 'dat naar zijn oordeel noodzakelijk is:'
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel12
  - number: 12.1.c.i
    text: |-
      om te voorkomen dat de toegelaten instelling gehouden is om schulden van de betrokken verbonden onderneming te
      voldoen, of
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel12
  - number: 12.1.c.ii
    text: ten behoeve van de herfinanciering van leningen die bestonden op 1 juli 2015, of
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel12
  - number: 12.1.c.iii
    text: |-
      ten behoeve van de herfinanciering van leningen die bestaan op het tijdstip waarop een juridische scheiding wordt
      bewerkstelligd, of
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel12
  - number: 12.1.d
    text: 'naar zijn oordeel:'
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel12
  - number: 12.1.d.i
    text: |-
      voldoende gewaarborgd is dat het te verschaffen vermogen is bestemd voor diensten van algemeen economisch belang,
      als bedoeld in [artikel 47, eerste lid, van de wet][ref1], of voor werkzaamheden die bijdragen aan die diensten van
      algemeen economisch belang, en


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel47
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '47'
  - number: 12.1.d.ii
    text: de financiële continuïteit van de toegelaten instelling gewaarborgd blijft.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel12
  - number: '12.2'
    text: |-
      Onze Minister kan bij zijn oordeel, als bedoeld in het eerste lid, onderdeel d, de zienswijze van de in het belang
      van de huurders van de woongelegenheden van de toegelaten instelling werkzame huurdersorganisaties en de zienswijze
      van de gemeenten waar de toegelaten instelling feitelijk werkzaam is, betrekken.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel12
  - number: '13.1'
    text: |-
      De categorieën van instellingen, bedoeld in [artikel 21c, eerste lid, van de wet][ref1], zijn:


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel21c
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 21c
  - number: 13.1.a
    text: Nederlandse overheden;
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel13
  - number: 13.1.b
    text: |-
      Nederlandse banken als bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref1], met ten minste
      een single B-rating of een daarmee vergelijkbare rating, afgegeven door ten minste twee van de bij ministeriële
      regeling te noemen ratingbureaus;


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
  - number: 13.1.c
    text: |-
      banken met een vergunning als bedoeld in [artikel 2:15, eerste lid][ref1], of
      [2:16, eerste lid, van de Wet op het financieel toezicht][ref2], met ten minste een single B-rating of een daarmee
      vergelijkbare rating, afgegeven door ten minste twee van de bij ministeriële regeling te noemen ratingbureaus, en


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel2
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '2'
  - number: 13.1.d
    text: |-
      professionele beleggers als bedoeld in [artikel 1:1][ref1], begripsomschrijving van professionele belegger,
      onderdelen b tot en met r, van de[Wet op het financieel toezicht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0020368
  - number: '13.2'
    text: |-
      In afwijking van het eerste lid, onderdelen b en c, zijn de categorieën van instellingen, bedoeld in
      [artikel 21c, eerste lid, van de wet][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel21a
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 21a
  - number: 13.2.a
    text: |-
      banken als bedoeld in de onderdelen b en c met ten minste een single A-rating of een daarmee vergelijkbare rating,
      afgegeven door ten minste twee van de bij ministeriële regeling te noemen ratingbureaus, indien de transacties
      betrekking hebben op beleggingen of financiële derivaten;
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel13
  - number: 13.2.b
    text: |-
      banken als bedoeld in de onderdelen b en c met een lagere dan single B-rating of zonder rating indien de
      transacties uitsluitend betrekking hebben op het aantrekken van leningen.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel13
  - number: '13.3'
    text: |-
      Bij ministeriële regeling kunnen andere daarbij te bepalen categorieën van instellingen worden aangewezen, indien
      zonder die aanwijzing het aangaan van financiële transacties door toegelaten instellingen op een wijze zou worden
      belemmerd die strijdig is met het belang van de volkshuisvesting.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel13
  - number: '13.4'
    text: |-
      Het percentage, bedoeld in [artikel 21c, tweede lid, van de wet][ref1], is 70.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel21c
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 21c
  - number: '13.5'
    text: |-
      De eisen ten aanzien van de rating, bedoeld in het eerste lid, onderdelen b en c, en het tweede lid,
      onderdelen a en b, zijn niet van toepassing voor een bank die een volledige dochtermaatschappij is van een
      bank die aan die eisen voldoet en ten aanzien waarvan die bank een schriftelijke verklaring als bedoeld in
      [artikel 403 lid 1 onder f van Boek 2 van het Burgerlijk Wetboek][ref1] heeft afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel403
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '403'
  - number: 13a.1
    text: |-
      Een toegelaten instelling trekt de financiële middelen voor werkzaamheden op het gebied van de volkshuisvesting die
      niet behoren tot de diensten van algemeen economisch belang uitsluitend aan bij categorieën van instellingen als
      bedoeld in het bepaalde bij en krachtens [artikel 13, eerste, tweede en derde lid][ref1], en zonder gebruikmaking
      van de borgingsvoorziening. Zij kan uitsluitend op een andere wijze financiële middelen voor die werkzaamheden
      inzetten:


      [ref1]: https://wetten.overheid.nl/BWBR0036702#Artikel13
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0036702
        artikel: '13'
        hoofdstuk: III
        paragraaf: '3'
  - number: 13a.1.a
    text: in geval van herstructurering, of
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel13a
  - number: 13a.1.b
    text: |-
      indien zij ten overstaan van Onze Minister aannemelijk heeft gemaakt dat zij geen gevolg kan geven aan de eerste
      volzin.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel13a
  - number: 13a.2
    text: |-
      De toegelaten instelling stelt ten behoeve van toepassing van het eerste lid, tweede volzin, een voorziening in,
      ten laste waarvan zij een interne lening verstrekt, die aan de niet-daeb-tak ten goede komt. Op het rentepercentage
      van die lening is het bepaalde bij en krachtens [artikel 10, tweede lid, onderdeel a][ref1], van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0036702#Artikel10
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0036702
        artikel: '10'
        hoofdstuk: III
        paragraaf: '3'
  - number: 13a.3
    text: |-
      De voorziening, bedoeld in het tweede lid, bevat uitsluitend de netto-opbrengsten van vervreemdingen op 1 januari
      2012 of nadien van woongelegenheden als bedoeld in [artikel 66, eerste lid, onderdelen a en b][ref1], en
      [artikel 47, eerste lid, onderdeel c, van de wet][ref2], verminderd met het per jaar aan die woongelegenheden
      toe te rekenen deel van de leningen, bedoeld in artikel 66, eerste lid, onderdeel f, welk deel verhoudingsgewijs
      gelijk is aan het quotiënt van het totaalbedrag van die leningen en dat van de WOZ-waarde van die woongelegenheden,
      welke totaalbedragen blijken uit de voor dat jaar vastgestelde balans van de toegelaten instelling. De voorziening
      bevat die aldus verminderde netto-opbrengsten voorts uitsluitend, voor zover er een batig saldo over het betrokken
      jaar is uit de verhuur en de vervreemding van woongelegenheden als bedoeld in de eerste volzin, bepaald op grond
      van waardering van die woongelegenheden tegen de modelmatige marktwaarde. De eerste en tweede volzin zijn van
      overeenkomstige toepassing op de jaarlijks aan de voorziening toe te voegen middelen.


      [ref1]: https://wetten.overheid.nl/BWBR0036702#Artikel66
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel47
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0036702
        artikel: '66'
        hoofdstuk: V
        paragraaf: '3'
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '47'
  - number: 13a.4
    text: |-
      Op de aflossing van de lening, bedoeld in het tweede lid, is [artikel 70, tweede lid][ref1], van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0036702#Artikel70
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0036702
        artikel: '70'
        hoofdstuk: V
        paragraaf: '3'
        afdeling: '5'
  - number: '14.1'
    text: |-
      De toegelaten instelling maakt in elk stuk tot het verstrekken waarvan zij ingevolge de wet of dit besluit
      verplicht is, en in elk van haar reglementen inzichtelijk welke feiten, omstandigheden en bepalingen betrekking
      hebben op hetzij haar daeb-tak, hetzij haar niet-daeb-tak, hetzij haar gehele organisatie.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel14
  - number: '14.2'
    text: |-
      Onze Minister maakt in elk besluit jegens en in elke andere mededeling aan een toegelaten instelling inzichtelijk
      welke elementen daarvan betrekking hebben op hetzij haar daeb-tak, hetzij haar niet-daeb-tak, hetzij haar gehele
      organisatie.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel14
  - number: '14.3'
    text: |-
      Het eerste en tweede lid zijn, ten aanzien van toegelaten instellingen op welke
      [artikel 49, eerste lid, eerste volzin, van de wet][ref1] ingevolge de tweede volzin van dat lid niet van
      toepassing is, van overeenkomstige toepassing op hetzij hun werkzaamheden die behoren respectievelijk niet behoren
      tot de diensten van algemeen economisch belang, hetzij haar gehele organisatie.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel49
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '49'
  - number: '14.4'
    text: |-
      Dit artikel is niet van toepassing, indien en zodra de toegelaten instelling toepassing heeft gegeven aan
      [artikel 50a van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel50a
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 50a
  - number: '16.1'
    text: |-
      De inkomensgrens, bedoeld in [artikel 1, eerste lid, van de wet][ref1], is € 51.537. In afwijking van de
      eerste volzin is de inkomensgrens, bedoeld in artikel 1, eerste lid, van de wet tot 1 januari 2030 voor een
      meerpersoonshuishouden als bedoeld in [artikel 2, onderdeel a, van de Wet op de huurtoeslag][ref2] € 56.910.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0008659#Artikel2
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0008659
        artikel: '2'
  - number: '16.2'
    text: |-
      De bedragen, genoemd in het eerste lid, worden met ingang van 1 januari van elk jaar bij ministeriële
      regeling gewijzigd met de procentuele wijziging per 1 januari van het peiljaar, bedoeld in
      [artikel 252a, tweede lid, onderdeel f, van Boek 7 van het Burgerlijk Wetboek][ref1], van het bedrag, genoemd
      in [artikel 17, eerste lid, onderdeel b, van de Wet op de huurtoeslag][ref2]. De bedragen, genoemd in de in
      [artikel 36a, vierde lid, van de wet][ref3] bedoelde ministeriële regeling, worden met ingang van elk kalenderjaar,
      voor het eerst op 1 januari 2017, bij ministeriële regeling vervangen door de bedragen zoals die op 1 januari van
      het daaraan voorafgaande jaar overeenkomstig de eerste volzin zijn gewijzigd.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel252a
      [ref2]: https://wetten.overheid.nl/BWBR0008659#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0005181#Artikel36a
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 252a
      - id: ref2
        bwb_id: BWBR0008659
        artikel: '17'
      - id: ref3
        bwb_id: BWBR0005181
        artikel: 36a
  - number: '16.3'
    text: |-
      Onze Minister zendt binnen vijf jaar na de inwerkingtreding van het Besluit van 18 december 2024 tot wijziging
      van het Besluit toegelaten instellingen volkshuisvesting 2015 in verband met aanpassingen met betrekking tot
      inbreng van vermogen in verbindingen, overcompensatie, de differentiatie van de inkomensgrens, verlening van
      administratieve diensten, inkomensbewijzen voor DAEB-toewijzing en novatie van basisrenteleningen (Stb. 2024, 430)
      aan de Staten-Generaal een verslag over de doeltreffendheid en de effecten van de verlenging van de tijdelijke
      verhoging DAEB-inkomensgrens voor meerpersoonshuishoudens.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel16
  - number: '17'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met het oog op de toepassing van de
      [artikelen 21a, tweede lid, tweede volzin][ref1], en [47, vierde lid, van de wet][ref2], en de
      [artikelen 63, eerste lid][ref3], en [69, derde lid][ref4], en kunnen stukken worden aangewezen uit welke blijkt
      dat de toegelaten instelling beoogt een aanvang met bepaalde werkzaamheden te maken.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel21a
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel47
      [ref3]: https://wetten.overheid.nl/BWBR0036702#Artikel63
      [ref4]: https://wetten.overheid.nl/BWBR0036702#Artikel69
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 21a
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '47'
      - id: ref3
        bwb_id: BWBR0036702
        artikel: '63'
        hoofdstuk: V
        paragraaf: '2'
        afdeling: '4'
      - id: ref4
        bwb_id: BWBR0036702
        artikel: '69'
        hoofdstuk: V
        paragraaf: '3'
        afdeling: '5'
  - number: '18.1'
    text: |-
      De zienswijze, bedoeld in [artikel 59b, tweede lid, van de wet][ref1], heeft in elk geval betrekking op:


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel59b
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 59b
  - number: 18.1.a
    text: |-
      de geschiktheid van de beoogde bestuurder of commissaris, blijkend uit diens opleiding, diens werkervaring en
      vakinhoudelijke kennis en diens competenties; en
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel18
  - number: 18.1.b
    text: |-
      de betrouwbaarheid van de beoogde bestuurder of commissaris, blijkend uit diens handelen of nalaten of voornemens
      daartoe, een door de beoogde bestuurder of commissaris verkregen verklaring omtrent zijn gedrag, als bedoeld
      in [artikel 28 van de Wet justitiële en strafvorderlijke gegevens][ref1], en uit de antecedenten, genoemd in
      [bijlage 1][ref2] bij dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0036702
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0036702
  - number: '18.2'
    text: |-
      Bij ministeriële regeling kunnen nadere voorschriften worden gegeven omtrent het uitbrengen van de zienswijze en
      voorschriften worden gegeven omtrent de door de borgingsvoorziening aan Onze Minister te verstrekken inlichtingen
      ten behoeve van het opstellen van die zienswijze.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel18
  - number: '19.1'
    text: |-
      De zienswijze, bedoeld in de [artikelen 25, tweede lid][ref1], en [30, derde lid, van de wet][ref2], heeft in elk
      geval betrekking op:


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel30
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '25'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '30'
  - number: 19.1.a
    text: |-
      de geschiktheid van de beoogde bestuurder of commissaris, blijkend uit diens opleiding, diens werkervaring en
      vakinhoudelijke kennis en diens competenties, en
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel19
  - number: 19.1.b
    text: |-
      de betrouwbaarheid van de beoogde bestuurder of commissaris, blijkend uit diens handelen of nalaten of voornemens
      daartoe, een door de beoogde bestuurder of commissaris verkregen verklaring omtrent zijn gedrag, als bedoeld
      in [artikel 28 van de Wet justitiële en strafvorderlijke gegevens][ref1], en uit de antecedenten, genoemd in
      [bijlage 1][ref2] bij dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0036702
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0036702
  - number: '19.2'
    text: |-
      Onze Minister betrekt bij zijn zienswijze de aard en zwaarte van de functie waarvoor de beoogde bestuurder
      of commissaris in aanmerking wordt gebracht, en de aard en de omvang van de werkzaamheden van de toegelaten
      instelling.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel19
  - number: '19.3'
    text: |-
      Bij ministeriële regeling kunnen nadere voorschriften worden gegeven omtrent het uitbrengen van de zienswijze,
      bedoeld in de [artikelen 25, tweede lid][ref1], en [30, derde lid, van de wet][ref2], en voorschriften worden
      gegeven omtrent de door de toegelaten instelling aan Onze Minister te verstrekken inlichtingen ten behoeve van het
      opstellen van die zienswijze.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel30
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '25'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '30'
  - number: '21.1'
    text: |-
      De goedkeuring, bedoeld in [artikel 26, eerste lid, aanhef en onderdeel c, van de wet][ref1], is niet vereist in
      geval van investeringen ten behoeve van het in stand houden van of treffen van voorzieningen aan onroerende zaken
      in eigendom van de toegelaten instelling, tenzij de statuten bepalen dat die goedkeuring in dat geval wel vereist
      is.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel26
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '26'
  - number: '21.2'
    text: |-
      De goedkeuring, bedoeld in [artikel 26, eerste lid, aanhef en onderdeel i, van de wet][ref1], is niet vereist,
      indien:


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel26
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '26'
  - number: 21.2.a
    text: met het betrokken besluit van het bestuur een bedrag van minder dan € 10.000.000 gemoeid is;
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel21
  - number: 21.2.b
    text: |-
      de betrokken besluiten van het bestuur transacties als bedoeld in dat onderdeel betreffen met betrekking tot
      woongelegenheden van welke de beoogde verkrijger een natuurlijke persoon is en waarin die persoon of een bloed- of
      aanverwant in de eerste graad van die persoon zijn hoofdverblijf heeft of zal hebben, tenzij de statuten bepalen
      dat die goedkeuring in die gevallen wel vereist is.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel21
  - number: '22.1'
    text: |-
      De goedkeuring, bedoeld in [artikel 27, eerste lid, aanhef en onderdeel a, van de wet][ref1], is niet vereist voor:


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel27
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '27'
  - number: 22.1.a
    text: 'de vervreemding van woongelegenheden of complexen met woongelegenheden, indien het een vervreemding betreft:'
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel22
  - number: 22.1.a.1°
    text: aan een toegelaten instelling;
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel22
  - number: 22.1.a.2°
    text: 'aan een natuurlijk persoon voor eigen gebruik:'
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel22
  - number: 22.1.a.2°.i
    text: tegen een prijs van ten minste 90% van de getaxeerde marktwaarde vrij van huur en gebruik of de WOZ-waarde; of
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel22
  - number: 22.1.a.2°.ii
    text: |-
      tegen een prijs tussen de 50% en 90% van de getaxeerde marktwaarde vrij van huur en gebruik of de WOZ-waarde en de
      bij ministeriële regeling bepaalde voorwaarden;
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel22
  - number: 22.1.b
    text: 'de vervreemding van onroerende zaken, anders dan woongelegenheden en complexen met woongelegenheden, indien:'
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel22
  - number: 22.1.b.1°
    text: |-
      het een verhuurd gebouw met een maatschappelijke gebruiksbestemming als bedoeld in artikel 45, tweede
      lid, onderdeel d, van de wet, betreft of een verhuurd gebouw met een zorgfunctie als bedoeld in
      [bijlage 2][ref1] bij dit besluit, dat functioneel een eenheid vormt met woongelegenheden als bedoeld in
      [artikel 47, eerste lid, onderdeel d, van de wet][ref2], dat wordt vervreemd aan:


      [ref1]: https://wetten.overheid.nl/BWBR0036702
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel47
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0036702
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '47'
  - number: 22.1.b.1°.i
    text: een toegelaten instelling; of
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel22
  - number: 22.1.b.1°.ii
    text: degene die het direct voorafgaand aan die vervreemding huurde;
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel22
  - number: 22.1.b.2°
    text: het een onroerende zaak, anders dan een verhuurd gebouw, bedoeld onder 1°, betreft;
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel22
  - number: 22.1.c
    text: |-
      de vestiging van een recht van erfpacht, opstal of vruchtgebruik op een andere gebouwde onroerende
      zaak dan een woongelegenheid, een gebouw dat een maatschappelijke gebruiksbestemming als bedoeld in
      [artikel 45, tweede lid, onderdeel d, van de wet][ref1], heeft of op onbebouwde grond, of overdracht van de
      economische eigendom van een zodanige onroerende zaak;


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel45
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '45'
  - number: 22.1.d
    text: |-
      de vestiging van een recht van opstal of vruchtgebruik op een woongelegenheid of op een zaak die zich in of nabij
      een woongelegenheid bevindt, in bij ministeriële regeling bepaalde gevallen.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel22
  - number: '22.2'
    text: |-
      In de ministeriële regeling als bedoeld in het eerste lid, onderdeel a, onder 2°, onder ii, kunnen voorwaarden
      worden verbonden aan de deling van de waardeontwikkeling tussen de toegelaten instelling en de verkrijger, waarbij
      onderscheid kan worden gemaakt tussen personen met een huishoudinkomen van ten hoogste € 57.500 en personen met een
      huishoudinkomen hoger dan dat bedrag. Het in de eerste zin genoemde bedrag wordt met ingang van 1 januari van elk
      jaar bij ministeriële regeling gewijzigd met de procentuele wijziging per 1 januari van het peiljaar, bedoeld in
      [artikel 252a, tweede lid, onderdeel f, van Boek 7 van het Burgerlijk Wetboek][ref1], van het bedrag, genoemd in
      [artikel 17, eerste lid, onderdeel b, van de Wet op de huurtoeslag][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel252a
      [ref2]: https://wetten.overheid.nl/BWBR0008659#Artikel17
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 252a
      - id: ref2
        bwb_id: BWBR0008659
        artikel: '17'
  - number: '22.3'
    text: |-
      Vervreemdingen waarvoor geen goedkeuring is vereist op grond van het eerste lid, onderdelen a, onder 1°,
      b, onder 1°, subonderdeel i of 2°, vinden, indien aan een toegelaten instelling wordt vervreemd, plaats
      tegen een bij ministeriële regeling bepaalde waarde, tenzij de toegelaten instelling het noodzakelijk
      acht een andere prijs te hanteren, in welk geval zij dit verantwoordt in het jaarverslag, bedoeld in
      [artikel 36, eerste lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel36
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '36'
  - number: '22.4'
    text: |-
      De toegelaten instelling verantwoordt in het jaarverslag, bedoeld in [artikel 36, eerste lid, van de wet][ref1],
      een vervreemding waarvoor geen goedkeuring is vereist op grond van het eerste lid, onderdeel b, onder 1°,
      subonderdeel ii, of onder 2°, indien die vervreemding plaatsvindt tegen een prijs die lager is dan de getaxeerde
      marktwaarde.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel36
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '36'
  - number: '23.1'
    text: |-
      Het verzoek, bedoeld in [artikel 27, eerste lid, aanhef en onderdeel a, van de wet][ref1], betreffende de
      vervreemding van blijvend gereguleerde daeb-woongelegenheden of blijvend gereguleerde daeb-complexen, aan
      natuurlijke personen niet voor eigen gebruik of aan rechtspersonen, niet zijnde andere toegelaten instellingen,
      gaat vergezeld van:


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel27
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '27'
  - number: 23.1.a
    text: een uiteenzetting van het belang van de volkshuisvesting van het ter goedkeuring voorgelegde besluit;
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel23
  - number: 23.1.b
    text: |-
      de ontwerpkoopovereenkomst die de toegelaten instelling voornemens is met de beoogde verkrijger te sluiten, met
      daarin het beding dat die woongelegenheid of de van dat complex deel uitmakende woongelegenheden ten minste zeven
      jaar na de eigendomsoverdracht als gevolg van de vervreemding voor verhuur bestemd blijven;
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel23
  - number: 23.1.c
    text: |-
      een verklaring omtrent het gedrag als bedoeld in
      [artikel 28 van de Wet justitiële en strafvorderlijke gegevens][ref1] van de beoogde verkrijger, tenzij deze een
      dochtermaatschappij van de vervreemdende toegelaten instelling is;


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel28
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: '28'
  - number: 23.1.d
    text: |-
      de zienswijze van de gemeente waar die woongelegenheid of dat complex is gelegen en van de betrokken
      bewonersorganisatie;
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel23
  - number: 23.1.e
    text: een verklaring van de beoogde verkrijger dat hij zich als een sociale verhuurder zal gedragen; en
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel23
  - number: 23.1.f
    text: de getaxeerde marktwaarde van die woongelegenheid of dat complex.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel23
  - number: '23.2'
    text: |-
      Het verzoek gaat, tenzij de beoogde verkrijger een dochtermaatschappij van de vervreemdende toegelaten instelling
      is, tevens vergezeld van bescheiden waaruit blijkt dat:
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel23
  - number: 23.2.a
    text: |-
      bij een verhuurde woongelegenheid die een zelfstandige woning, bedoeld in
      [artikel 234 van Boek 7 van het Burgerlijk Wetboek][ref1], is: dat deze gedurende ten minste vier weken te koop is
      aangeboden aan de huurder tegen een prijs van ten hoogste de marktwaarde vrij van huur en gebruik;


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel234
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '234'
  - number: 23.2.b
    text: |-
      bij een niet-verhuurde woongelegenheid die een eengezinswoning is: dat deze gedurende ten minste vier weken voor
      eigen gebruik te koop is aangeboden aan de huurders van DAEB-woongelegenheden van toegelaten instellingen in ten
      minste de gemeente waar de woning is gelegen onder bekendmaking van de getaxeerde marktwaarde;
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel23
  - number: 23.2.c
    text: |-
      bij een woongelegenheid of complex: dat deze gedurende ten minste vier weken te koop is aangeboden aan andere
      toegelaten instellingen; en
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel23
  - number: 23.2.d
    text: |-
      bij een woongelegenheid of complex: dat deze gedurende ten minste vier weken in het openbaar te koop is aangeboden
      aan elke gegadigde, tenzij de toegelaten instelling 5% of meer van de aandelen van de beoogde verkrijger houdt.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel23
  - number: '23.3'
    text: |-
      Uit de bescheiden, bedoeld in het tweede lid, volgen, voor zover van toepassing, de afwegingen die ertoe hebben
      geleid dat niet achtereenvolgens aan de huurder, huurders van DAEB-woongelegenheden van toegelaten instellingen
      bedoeld in het tweede lid, onder b of andere toegelaten instellingen is vervreemd.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel23
  - number: 23a.1
    text: |-
      Het verzoek, bedoeld in [artikel 27, eerste lid, aanhef en onderdeel a, van de wet][ref1], betreffende de
      vervreemding van potentieel te liberaliseren daeb-woongelegenheden of potentieel te liberaliseren daeb-complexen,
      aan natuurlijke personen niet voor eigen gebruik of aan rechtspersonen, niet zijnde andere toegelaten instellingen,
      gaat vergezeld van:


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel27
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel23a
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '27'
  - number: 23a.1.a
    text: een uiteenzetting van het belang van de volkshuisvesting van het ter goedkeuring voorgelegde besluit;
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel23a
  - number: 23a.1.b
    text: de ontwerpkoopovereenkomst die de toegelaten instelling voornemens is met de beoogde verkrijger te sluiten;
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel23a
  - number: 23a.1.c
    text: |-
      een verklaring omtrent het gedrag als bedoeld in
      [artikel 28 van de Wet justitiële en strafvorderlijke gegevens][ref1] van de beoogde verkrijger, tenzij deze een
      dochtermaatschappij van de vervreemdende toegelaten instelling is;


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel28
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel23a
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: '28'
  - number: 23a.1.d
    text: 'de zienswijze van de gemeente waar die woongelegenheid of dat complex is gelegen, tenzij:'
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel23a
  - number: 23a.1.d.1°
    text: |-
      met die gemeente op grond van [artikel 44, eerste lid, van de wet][ref1], afspraken zijn gemaakt over de omvang van
      de voorraad van woongelegenheden als bedoeld in [artikel 47, eerste lid, onderdelen b, c en d, van de wet][ref2],
      en de eventuele vervreemding van een deel van die voorraad, en


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel47
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel23a
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '44'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '47'
  - number: 23a.1.d.2°
    text: |-
      die woongelegenheid of de van dat complex deel uitmakende woongelegenheden worden vervreemd onder het beding dat
      zij ten minste zeven jaar na de eigendomsoverdracht als gevolg van de vervreemding voor verhuur met een huurprijs
      van ten hoogste € 1000,– bestemd blijven; en
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel23a
  - number: 23a.1.e
    text: de getaxeerde marktwaarde van die woongelegenheid of dat complex.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel23a
  - number: 23a.2
    text: |-
      Het verzoek gaat, tenzij de beoogde verkrijger een dochtermaatschappij van de vervreemdende toegelaten instelling
      is, tevens vergezeld van bescheiden waaruit blijkt dat:
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel23a
  - number: 23a.2.a
    text: |-
      bij een verhuurde woongelegenheid die een eengezinswoning is: dat deze gedurende ten minste vier weken te koop is
      aangeboden aan de huurder tegen een prijs van ten hoogste de marktwaarde vrij van huur en gebruik;
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel23a
  - number: 23a.2.b
    text: |-
      bij een niet-verhuurde woongelegenheid die een eengezinswoning is: dat deze gedurende ten minste vier weken voor
      eigen gebruik te koop is aangeboden aan de huurders van DAEB-woongelegenheden van toegelaten instellingen in ten
      minste de gemeente waar de woning is gelegen onder bekendmaking van de getaxeerde marktwaarde;
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel23a
  - number: 23a.2.c
    text: |-
      die woongelegenheid of dat complex gedurende ten minste vier weken in het openbaar te koop is aangeboden aan elke
      gegadigde, tenzij de toegelaten instelling 5% of meer van de aandelen van de beoogde verkrijger houdt.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel23a
  - number: 23a.3
    text: |-
      Uit de bescheiden, bedoeld in het tweede lid, volgen, voor zover van toepassing, de afwegingen die ertoe hebben
      geleid dat niet achtereenvolgens aan de huurder, bedoeld in het tweede lid, onder a, of aan andere huurders als
      bedoeld in het tweede lid, onder b, is vervreemd.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel23a
  - number: 23b.1
    text: |-
      Het verzoek, bedoeld in [artikel 27, eerste lid, aanhef en onderdeel a, van de wet][ref1], betreffende de
      vervreemding van niet-daeb woongelegenheden of niet-daeb complexen, aan natuurlijke personen niet voor eigen
      gebruik of aan rechtspersonen, niet zijnde andere toegelaten instellingen, gaat vergezeld van:


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel27
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel23b
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '27'
  - number: 23b.1.a
    text: een uiteenzetting van het belang van de volkshuisvesting van het ter goedkeuring voorgelegde besluit;
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel23b
  - number: 23b.1.b
    text: de ontwerpkoopovereenkomst die de toegelaten instelling voornemens is met de beoogde verkrijger te sluiten;
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel23b
  - number: 23b.1.c
    text: |-
      een verklaring omtrent het gedrag als bedoeld in
      [artikel 28 van de Wet justitiële en strafvorderlijke gegevens][ref1] van de beoogde verkrijger, tenzij deze een
      dochtermaatschappij van de vervreemdende toegelaten instelling is; en


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel28
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel23b
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: '28'
  - number: 23b.1.d
    text: de getaxeerde marktwaarde van die woongelegenheid of dat complex.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel23b
  - number: 23b.2
    text: |-
      Het verzoek gaat, tenzij de beoogde verkrijger een dochtermaatschappij van de vervreemdende toegelaten instelling
      is, tevens vergezeld van bescheiden waaruit blijkt dat die woongelegenheid of dat complex gedurende ten minste vier
      weken in het openbaar te koop is aangeboden aan elke gegadigde, tenzij de toegelaten instelling 5% of meer van de
      aandelen van de beoogde verkrijger houdt.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel23b
  - number: 23c.1
    text: |-
      Het verzoek, bedoeld in [artikel 27, eerste lid, aanhef en onderdeel a, van de wet][ref1], betreffende
      de vervreemding van een verhuurd gebouw dat een maatschappelijke gebruiksbestemming heeft als bedoeld in
      [artikel 45, tweede lid, onderdeel d, van de wet][ref2], of een verhuurd gebouw met een zorgfunctie als bedoeld
      in [bijlage 2][ref3] bij dit besluit, dat functioneel een eenheid vormt met woongelegenheden als bedoeld in
      [artikel 47, eerste lid, onderdeel d, van de wet][ref4], gaat vergezeld van:


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel45
      [ref3]: https://wetten.overheid.nl/BWBR0036702
      [ref4]: https://wetten.overheid.nl/BWBR0005181#Artikel47
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel23c
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '27'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '45'
      - id: ref3
        bwb_id: BWBR0036702
      - id: ref4
        bwb_id: BWBR0005181
        artikel: '47'
  - number: 23c.1.a
    text: een uiteenzetting van het belang van de volkshuisvesting van het ter goedkeuring voorgelegde besluit;
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel23c
  - number: 23c.1.b
    text: de ontwerpkoopovereenkomst die de toegelaten instelling voornemens is met de beoogde verkrijger te sluiten;
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel23c
  - number: 23c.1.c
    text: |-
      een verklaring omtrent het gedrag als bedoeld in
      [artikel 28 van de Wet justitiële en strafvorderlijke gegevens][ref1] van de beoogde verkrijger, tenzij deze een
      dochtermaatschappij van de vervreemdende toegelaten instelling is;


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel28
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel23c
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: '28'
  - number: 23c.1.d
    text: de zienswijze van de gemeente waar dat gebouw is gelegen en van de huurder; en
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel23c
  - number: 23c.1.e
    text: de getaxeerde marktwaarde van dat gebouw.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel23c
  - number: 23c.2
    text: |-
      Het verzoek gaat, tenzij de beoogde verkrijger een dochtermaatschappij van de vervreemdende toegelaten instelling
      is, tevens vergezeld van bescheiden waaruit blijkt dat dit gebouw:
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel23c
  - number: 23c.2.a
    text: gedurende ten minste vier weken te koop is aangeboden aan de huurder; en
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel23c
  - number: 23c.2.b
    text: |-
      gedurende ten minste vier weken in het openbaar te koop aangeboden aan elke gegadigde, tenzij de toegelaten
      instelling 5% of meer van de aandelen van de beoogde verkrijger houdt.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel23c
  - number: 23c.3
    text: |-
      Uit de bescheiden, bedoeld in het tweede lid, volgen, voor zover van toepassing, de afwegingen die ertoe hebben
      geleid dat niet aan de huurder is vervreemd.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel23c
  - number: 23d.1
    text: |-
      Het verzoek, bedoeld in [artikel 27, eerste lid, aanhef en onderdeel a, van de wet][ref1], betreffende de
      vervreemding van een onroerende zaak waarop de [artikelen 23 tot en met 23c][ref2] niet van toepassing zijn,
      de vestiging van een recht van erfpacht, opstal of vruchtgebruik op een onroerende zaak of de overdracht van de
      economische eigendom van een onroerende zaak gaat vergezeld van:


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0036702#Artikel23
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel23d
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '27'
      - id: ref2
        bwb_id: BWBR0036702
        artikel: '23'
        hoofdstuk: IV
        paragraaf: '3'
  - number: 23d.1.a
    text: een uiteenzetting van het belang van de volkshuisvesting van het ter goedkeuring voorgelegde besluit;
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel23d
  - number: 23d.1.b
    text: |-
      in geval van vervreemding: de ontwerpovereenkomst die de toegelaten instelling voornemens is met de beoogde
      verkrijger te sluiten;
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel23d
  - number: 23d.1.c
    text: |-
      een verklaring omtrent het gedrag als bedoeld in
      [artikel 28 van de Wet justitiële en strafvorderlijke gegevens][ref1] van de beoogde verkrijger of begunstigde,
      tenzij deze een dochtermaatschappij van de vervreemdende toegelaten instelling is;


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel28
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel23d
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: '28'
  - number: 23d.1.d
    text: |-
      de zienswijze van de gemeente waar die onroerende zaak is gelegen en de bij ministeriële regeling bepaalde andere
      zienswijzen; en
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel23d
  - number: 23d.1.e
    text: de getaxeerde marktwaarde van de onroerende zaak.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel23d
  - number: 23d.2
    text: |-
      Indien het verzoek betrekking heeft op een vervreemding als bedoeld in het eerste lid, gaat het verzoek, tenzij
      de beoogde verkrijger een dochtermaatschappij van de vervreemdende toegelaten instelling is of de toegelaten
      instelling 5% of meer van de aandelen van de beoogde verkrijger houdt, tevens vergezeld van bescheiden waaruit
      blijkt dat die onroerende zaak gedurende ten minste vier weken in het openbaar te koop is aangeboden aan elke
      gegadigde.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel23d
  - number: 23d.3
    text: |-
      Het eerste lid, onderdelen c en d, is niet van toepassing in geval van een vervreemding als bedoeld in het eerste
      lid aan een toegelaten instelling of een natuurlijk persoon voor eigen gebruik.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel23d
  - number: 23e.1
    text: |-
      Het verzoek, bedoeld in de [artikelen 23 tot en met 23d][ref1], wordt ingediend met gebruikmaking van een door Onze
      Minister beschikbaar te stellen formulier. Onze Minister bevestigt binnen twee weken de ontvangst van een zodanig
      verzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0036702#Artikel23
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel23e
    references:
      - id: ref1
        bwb_id: BWBR0036702
        artikel: '23'
        hoofdstuk: IV
        paragraaf: '3'
  - number: 23e.2
    text: |-
      Bij ministeriële regeling kunnen nadere voorschriften worden gegeven omtrent de bij een verzoek om een goedkeuring
      als bedoeld in [artikel 27, eerste lid, aanhef en onderdeel a, van de wet][ref1], over te leggen gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel27
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel23e
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '27'
  - number: '24.1'
    text: |-
      Onze Minister kan besluiten om een besluit als bedoeld in
      [artikel 27, eerste lid, aanhef en onderdeel a, van de wet][ref1], niet goed te keuren, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel27
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '27'
  - number: 24.1.a
    text: |-
      indien van toepassing: de verklaring omtrent het gedrag, bedoeld in
      [artikel 28 van de Wet justitiële en strafvorderlijke gegevens][ref1] van de beoogde verkrijger of begunstigde,
      of de verklaring, bedoeld in [artikel 23, eerste lid, onderdeel e][ref2], niet is overgelegd, en, in geval van een
      vervreemding, indien en zolang [artikel 4][ref3] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0036702#Artikel23
      [ref3]: https://wetten.overheid.nl/BWBR0036702#Artikel4
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0036702
        artikel: '23'
        hoofdstuk: IV
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0036702
        artikel: '4'
        hoofdstuk: II
  - number: 24.1.b
    text: |-
      het belang van de volkshuisvesting naar zijn oordeel beter is gediend met het niet nemen van een zodanig besluit
      ten aanzien van de betrokken onroerende zaak of het nemen van een zodanig besluit ten aanzien van die zaak, waarbij
      de verkrijger of de begunstigde een ander is dan de blijkens het ter goedkeuring voorgelegde besluit beoogde
      verkrijger of begunstigde;
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel24
  - number: 24.1.c
    text: |-
      dat besluit er naar zijn oordeel toe zou leiden dat de financiële continuïteit van de toegelaten instelling niet
      voldoende is gewaarborgd; of
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel24
  - number: 24.1.d
    text: |-
      de betrokken over te leggen bescheiden niet zijn overgelegd of onjuist zijn, of indien een overgelegde andere
      verklaring of een overgelegde zienswijze daartoe naar zijn oordeel aanleiding geeft.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel24
  - number: '24.2'
    text: |-
      Onze Minister kan besluiten om een besluit als bedoeld in
      [artikel 27, eerste lid, aanhef en onderdeel a, van de wet][ref1] niet goed te keuren, bij vervreemding van:


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel27
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '27'
  - number: 24.2.a
    text: 'een blijvend gereguleerde daeb-woongelegenheid of een blijvend gereguleerd daeb-complex, indien:'
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel24
  - number: 24.2.a.1°
    text: deze wordt vervreemd tegen een prijs die lager is dan de getaxeerde marktwaarde; of
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel24
  - number: 24.2.a.2°
    text: |-
      deze wordt vervreemd zonder het beding dat die woongelegenheid of de van dat complex deel uitmakende
      woongelegenheden ten minste zeven jaar na de eigendomsoverdracht als gevolg van die vervreemding voor verhuur
      bestemd blijven.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel24
  - number: 24.2.b
    text: |-
      een potentieel te liberaliseren daeb-woongelegenheid of potentieel te liberaliseren daeb-complex, indien deze wordt
      vervreemd tegen een prijs die lager is dan de getaxeerde marktwaarde.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel24
  - number: 24.2.c
    text: |-
      een niet-daeb-woongelegenheid of niet-daeb-complex, indien deze wordt vervreemd tegen een prijs die lager is dan de
      getaxeerde marktwaarde.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel24
  - number: 24.2.d
    text: |-
      een verhuurd gebouw dat een maatschappelijke gebruiksbestemming heeft als bedoeld in
      [artikel 45, tweede lid, onderdeel d, van de wet][ref1], of een verhuurd gebouw met een zorgfunctie als bedoeld
      in [bijlage 2][ref2] bij dit besluit dat functioneel een eenheid vormt met woongelegenheden als bedoeld in
      [artikel 47, eerste lid, onderdeel d, van de wet][ref3], indien deze wordt vervreemd tegen een prijs die lager is
      dan de getaxeerde marktwaarde.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0036702
      [ref3]: https://wetten.overheid.nl/BWBR0005181#Artikel47
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '45'
      - id: ref2
        bwb_id: BWBR0036702
      - id: ref3
        bwb_id: BWBR0005181
        artikel: '47'
  - number: '24.3'
    text: |-
      In afwijking van het eerste en tweede lid keurt Onze Minister een verzoek om een goedkeuring
      omtrent de vervreemding van een gebouw dat de status heeft van rijksmonument als bedoeld in
      [artikel 1.1. van de Erfgoedwet][ref1], of de status heeft van monument op grond van een provinciale of
      gemeentelijke verordening, goed, indien het wordt vervreemd:


      [ref1]: https://wetten.overheid.nl/BWBR0037521#Artikel1
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0037521
        artikel: '1'
  - number: 24.3.a
    text: aan een rechtspersoon met de status van professionele organisatie voor monumentenbehoud;
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel24
  - number: 24.3.b
    text: |-
      tegen een prijs van ten minste de getaxeerde waarde die zij met behoud van haar huidige bestemming
      vertegenwoordigt; en
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel24
  - number: 24.3.c
    text: |-
      onder het beding dat zij gedurende ten minste zeven jaar na de eigendomsoverdracht als gevolg van die vervreemding
      voor verhuur bestemd blijft.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel24
  - number: '24.4'
    text: |-
      Onze Minister kan het bepaalde bij of krachtens het eerste en tweede lid buiten toepassing laten, of bepalen
      dat het door de toegelaten instelling overleggen van bescheiden waaruit blijkt dat een aanbieding aan de
      huurder als bedoeld in het [tweede lid, onderdeel a, van de artikelen 23][ref1], [23a][ref2] of [23c][ref3]
      heeft plaatsgevonden niet vereist is, indien ten aanzien van de betrokken toegelaten instelling een situatie
      als bedoeld in [artikel 29, eerste lid, eerste volzin, of tweede lid, eerste volzin, van de wet][ref4], of
      [57, eerste lid, onderdeel a, van de wet][ref5], van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0036702#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0036702#Artikel23a
      [ref3]: https://wetten.overheid.nl/BWBR0036702#Artikel23c
      [ref4]: https://wetten.overheid.nl/BWBR0005181#Artikel29
      [ref5]: https://wetten.overheid.nl/BWBR0005181#Artikel57
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0036702
        artikel: '23'
        hoofdstuk: IV
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0036702
        artikel: 23a
        hoofdstuk: IV
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0036702
        artikel: 23c
        hoofdstuk: IV
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0005181
        artikel: '29'
      - id: ref5
        bwb_id: BWBR0005181
        artikel: '57'
  - number: '24.5'
    text: |-
      Bij ministeriële regeling kunnen nadere voorschriften worden gegeven omtrent de toepassing van het tweede en vierde
      lid.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel24
  - number: 24a
    text: |-
      Vervreemdingen waarvoor geen goedkeuring is vereist op grond van
      [artikel 24, onderdelen a of d, onder 1°, of onderdeel e][ref1], zoals dat luidde onmiddellijk voorafgaand
      aan het tijdstip van inwerkingtreding van artikel I, onderdeel N, van het Besluit van 17 november 2021 tot
      wijziging van het Besluit toegelaten instellingen volkshuisvesting 2015 naar aanleiding van de evaluatie van
      de herziene Woningwet (Stb. 2021, 570), voor zover deze artikel 24 wijzigt, vinden, indien aan een toegelaten
      instelling wordt vervreemd, van 1 januari 2021 tot het tijdstip van inwerkingtreding van dat besluit plaats
      tegen een bij ministeriële regeling bepaalde waarde, tenzij de toegelaten instelling het noodzakelijk
      acht een andere prijs te hanteren, in welk geval zij dit verantwoordt in het jaarverslag, bedoeld in
      [artikel 36, eerste lid, van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0036702#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel36
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel24a
    references:
      - id: ref1
        bwb_id: BWBR0036702
        artikel: '24'
        hoofdstuk: IV
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '36'
  - number: '25.1'
    text: |-
      Onze Minister beslist binnen twaalf weken na ontvangst daarvan op een verzoek om goedkeuring als bedoeld
      in [artikel 27, eerste lid, aanhef en onderdeel a, van de wet][ref1], welke termijn hij, door schriftelijke
      kennisgeving daarvan aan de toegelaten instelling binnen die termijn, eenmalig kan verlengen met een door hem
      daarbij te bepalen termijn van ten hoogste twee weken.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel27
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '27'
  - number: '25.2'
    text: |-
      Onze Minister kan, indien hij toepassing geeft aan [artikel 27, derde lid, van de wet][ref1], de in het eerste lid
      genoemde termijn of ingevolge dat lid verlengde termijn schorsen totdat het advies, bedoeld in artikel 27, derde
      lid, van de wet, is uitgebracht. Hij geeft binnen die termijn schriftelijk kennis van een zodanige schorsing aan de
      betrokken toegelaten instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel27
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '27'
  - number: '28.1'
    text: |-
      Onze Minister keurt een vervreemding als bedoeld in [artikel 27, eerste lid, onderdeel b, van de wet][ref1] aan
      anderen dan toegelaten instellingen niet goed, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel27
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '27'
  - number: 28.1.a
    text: |-
      die vervreemding naar zijn oordeel ertoe leidt dat de financiële continuïteit van de toegelaten instelling niet
      langer is gewaarborgd;
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel28
  - number: 28.1.b
    text: die vervreemding geschiedt tegen een prijs die naar zijn oordeel onvoldoende overeenkomt met de intrinsieke waarde;
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel28
  - number: 28.1.c
    text: |-
      de toegelaten instelling een lening of een garantie aan de dochtermaatschappij heeft verstrekt of voor haar
      schulden aansprakelijk is, en die vervreemding ertoe zou leiden dat zij de helft of minder van de stemrechten in de
      algemene vergadering van de dochtermaatschappij overhoudt of
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel28
  - number: 28.1.d
    text: |-
      degene aan wie wordt vervreemd hem geen verklaring omtrent het gedrag als bedoeld in
      [artikel 28 van de Wet justitiële en strafvorderlijke gegevens][ref1] kan overleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel28
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: '28'
  - number: '28.2'
    text: |-
      Onze Minister kan in afwijking van het eerste lid, onderdeel b, een vervreemding goedkeuren die onvoldoende
      overeenkomt met de intrinsieke waarde wanneer de toegelaten instelling aannemelijk maakt dat de intrinsieke waarde
      in het desbetreffende geval geen juist beeld geeft van de waarde bij verkoop.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel28
  - number: '28.3'
    text: |-
      Bij ministeriële regeling kunnen nadere voorschriften worden gegeven omtrent de toepassing van het eerste lid,
      onderdelen a en b.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel28
  - number: '29.1'
    text: |-
      Voor zover het bestuur van de toegelaten instelling Onze Minister niet reeds schriftelijk mededeling heeft gedaan
      omtrent de aan deze werkzaamheden ten grondslag liggende omstandigheden, stelt de raad van commissarissen Onze
      Minister schriftelijk op de hoogte van zijn werkzaamheden ter uitoefening van zijn taak:
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel29
  - number: 29.1.a
    text: |-
      indien naar zijn oordeel of dat van Onze Minister sprake is van door de betrokken toegelaten instelling berokkende
      schade of mogelijke schade aan het belang van de volkshuisvesting die zij niet binnen een afzienbare termijn kan
      herstellen respectievelijk voorkomen;
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel29
  - number: 29.1.b
    text: |-
      indien sprake is van een onoverbrugbaar geschil tussen het bestuur en de raad van commissarissen van de toegelaten
      instelling, tussen individuele leden van de raad van commissarissen van de toegelaten instelling onderling, of
      tussen de toegelaten instelling en een dochtermaatschappij;
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel29
  - number: 29.1.c
    text: |-
      indien naar zijn oordeel twijfel bestaat aan de rechtmatigheid van het handelen of nalaten, de governance of de
      integriteit van beleid en beheer van de toegelaten instelling, en het bestuur die twijfel niet heeft weggenomen of
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel29
  - number: 29.1.d
    text: |-
      indien sprake is van liquiditeits- of solvabiliteitsproblemen in de toegelaten instelling of een
      dochtermaatschappij van die toegelaten instelling.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel29
  - number: '29.2'
    text: Bij ministeriële regeling kunnen nadere voorschriften worden gegeven omtrent de toepassing van dit artikel.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel29
