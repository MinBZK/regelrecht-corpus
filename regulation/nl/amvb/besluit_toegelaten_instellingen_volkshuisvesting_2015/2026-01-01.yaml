    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister voor Wonen en Rijksdienst van 24 maart 2015, nr. 2015-0000176563, Directie
