        artikel: '16'
        hoofdstuk: III
        paragraaf: '4'
  - number: '126.3'
    text: |-
      Toegelaten instellingen kunnen tot 1 januari 2021, ten aanzien van 25% van het bruto-vloeroppervlak
      van de gebouwen, genoemd in de tweede volzin, het aangaan van overeenkomsten van huur en verhuur
      in de daeb-tak onderbrengen, indien het voornemen daartoe is opgenomen in het overzicht, bedoeld in
      [artikel 44a, eerste lid, onderdeel a, van de wet][ref1] over het jaar 2017. De gebouwen, bedoeld in de eerste
      volzin, zijn de gebouwen waarin na 31 december 2011 zorg is verleend door een instelling die behoort tot
      een categorie als bedoeld in [artikel 5, eerste lid, van de Wet toelating zorginstellingen][ref2] en die is
      toegelaten voor de zorgvorm verblijf als bedoeld in het [Besluit zorgaanspraken AWBZ][ref3] zoals dat luidde
      op 31 december 2014, in combinatie met een of meer van de zorgvormen persoonlijke verzorging, verpleging
      en begeleiding als bedoeld in dat besluit, en voor welke zorg de Nederlandse Zorgautoriteit, genoemd in
      [artikel 3 van de Wet marktordening gezondheidszorg][ref4], een vergoeding voor kapitaallasten heeft vastgesteld op
      grond van [artikel 57 van die wet][ref5]. Tot het bruto-vloeroppervlak, bedoeld in de eerste volzin, behoort mede
      het vloeroppervlak van de bij die gebouwen behorende overdekte parkeervoorzieningen en de oppervlakte van de bij
      die gebouwen behorende overige parkeervoorzieningen.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel44a
      [ref2]: https://wetten.overheid.nl/BWBR0018906#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0014149
      [ref4]: https://wetten.overheid.nl/BWBR0020078#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0020078#Artikel57
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel126
    references:
      - id: ref1
