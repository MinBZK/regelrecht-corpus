    text: |-
      de betrokken woongelegenheden, tegen hun modelmatige marktwaarde, onder een gelijktijdige verrekening tussen
      haar niet-daeb-tak en haar daeb-tak waarmee een geldbedrag gemoeid is dat hetzij gelijk is aan die modelmatige
      marktwaarde, hetzij lager is dan die modelmatige marktwaarde, in welk geval zij voorts tegelijkertijd ten laste van
      de voorziening, bedoeld in [artikel 13a, tweede lid][ref1], een interne lening verstrekt welke aan de niet-daeb-
      tak ten goede komt, ter hoogte van het verschil tussen het verrekende bedrag en die modelmatige marktwaarde, welke
      lening een rentepercentage heeft dat gelijk is aan de op het tijdstip van verstrekking daarvan geldende rente op
      tienjarige staatsleningen, vermeerderd met een bij ministeriële regeling te bepalen percentage, en wordt afgelost
      onder overeenkomstige toepassing van [artikel 10, tweede lid, onderdeel b, en derde lid][ref2], en


