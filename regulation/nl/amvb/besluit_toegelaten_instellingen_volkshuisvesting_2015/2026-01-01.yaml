    text: 'Het verzoek gaat in elk geval vergezeld van:'
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel80
  - number: 80.2.a
    text: |-
      een overzicht van haar woongelegenheden of gebouwen als bedoeld in het eerste lid, onderdeel a, b, c, d of e,
      die zij voornemens is administratief naar de niet-daeb-tak over te brengen, dat is uitgesplitst per gemeente
      waar die woongelegenheden of gebouwen gelegen zijn, en waarin zijn opgenomen de modelmatige marktwaarde
      van die woongelegenheden of gebouwen, alsmede de huurprijs en de waardering van de kwaliteit, bedoeld in
      [artikel 5 van het Besluit huurprijzen woonruimte][ref1], van die woongelegenheden, en


      [ref1]: https://wetten.overheid.nl/BWBR0003237#Artikel5
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel80
    references:
