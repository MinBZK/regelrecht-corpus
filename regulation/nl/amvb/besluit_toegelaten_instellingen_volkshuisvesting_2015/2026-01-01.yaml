        hoofdstuk: IV
  - number: '128'
    text: |-
      Het [Besluit centraal Fonds voor de Volkshuisvesting][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0004418
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel128
    references:
      - id: ref1
        bwb_id: BWBR0004418
  - number: '130'
    text: |-
      Op verzoeken om een goedkeuring als bedoeld in [artikel 27, eerste lid, aanhef en onderdeel a, van de wet][ref1],
      die zijn ingediend voor het tijdstip van inwerkingtreding van het Besluit van 27 maart 2017 tot wijziging van het
      Besluit toegelaten instellingen volkshuisvesting 2015 in verband met het wijzigen van de voorschriften omtrent
      het vervreemden van geliberaliseerde en potentieel te liberaliseren woongelegenheden door toegelaten instellingen
      (Stb. 2017, 129), zijn de [artikelen 25][ref2] en [26 van dit besluit][ref3] zoals dat luidde voor dat tijdstip,
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0036702#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0036702#Artikel26
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel130
    references:
