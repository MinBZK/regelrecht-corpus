    text: |-
      degenen die ingevolge [artikel 266 lid 1][ref1] of [267 lid 1 van Boek 7 van het Burgerlijk Wetboek][ref2]
      medehuurder van de betrokken woongelegenheid waren en de overeenkomst van huur en verhuur voortzetten
      overeenkomstig artikel 266 lid 3, 267 lid 6 of [268 lid 1 van dat boek][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel266
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel267
