  - number: '58.2'
    text: |-
      Het is de toegelaten instelling verboden een overeenkomst met een rechtspersoon of vennootschap ter zake van
      de huur en verhuur van woongelegenheden waarop [artikel 48, eerste lid, van de wet][ref1] van toepassing is
      aan te gaan, die in de weg staat aan de juiste toepassing van artikel 48, eerste, tweede of vierde lid, van de
      wet, [55, derde of vierde lid, van de wet][ref2] of het eerste lid van dit artikel. Indien een voor 18 mei 2013
      aangegane zodanige overeenkomst ertoe leidt dat die toegelaten instelling niet over alle gegevens beschikt die
      noodzakelijk zijn voor een beoordeling als bedoeld in artikel 48, achtste lid, van de wet, wordt dat die toegelaten
      instelling bij die beoordeling niet aangerekend.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel55
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel58
    references:
