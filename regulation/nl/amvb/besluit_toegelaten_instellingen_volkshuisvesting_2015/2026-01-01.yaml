  - number: '60.1'
    text: |-
      Het verzoek, bedoeld in [artikel 48, vijfde lid, eerste volzin, van de wet][ref1], omvat in elk geval:


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel48
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel60
    references:
