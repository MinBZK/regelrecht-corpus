    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel52b
  - number: 52b.a.2°
    text: |-
      toegelaten instellingen of een of meer van hun dochtermaatschappijen alleen of samen meer dan de helft van de
      bestuurders van laatstgenoemde verbonden onderneming kunnen benoemen of ontslaan.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel52b
  - number: 52b.b
    text: |-
      worden door een toegelaten instelling of een met haar verbonden onderneming uitsluitend verleend ten behoeve van
      de bedrijfsvoering of administratie van een verbonden onderneming van een andere toegelaten instelling, indien
