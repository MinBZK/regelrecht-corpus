      met die gemeenten en bewonersorganisaties op grond van [artikel 44, eerste lid, van de wet][ref1], afspraken heeft
      gemaakt over de omvang van de voorraad van woongelegenheden of gebouwen als bedoeld in het eerste lid, onderdeel a,
      b, c, d of e, en de vervreemding van een deel van die voorraad.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel44
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel80
    references:
