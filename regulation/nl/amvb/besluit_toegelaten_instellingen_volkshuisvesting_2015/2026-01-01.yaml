        artikel: '52'
        hoofdstuk: V
        afdeling: '2'
  - number: '127.1'
    text: |-
      Het [Besluit beheer sociale-huursector][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0005686
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel127
    references:
      - id: ref1
        bwb_id: BWBR0005686
  - number: '127.2'
    text: |-
      Het bepaalde bij en krachtens het [Besluit beheer sociale-huursector][ref1] blijft van toepassing:


      [ref1]: https://wetten.overheid.nl/BWBR0005686
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel127
    references:
      - id: ref1
        bwb_id: BWBR0005686
  - number: 127.2.a
    text: |-
      indien het tijdstip, bedoeld in [artikel 126, eerste lid][ref1], een ander is dan 1 januari van enig kalenderjaar:
      op de jaarrekening, het jaarverslag en het volkshuisvestingsverslag van de toegelaten instelling over het
      kalenderjaar waarin dat tijdstip valt, en het onderzoeken en beoordelen van die verslagen;


      [ref1]: https://wetten.overheid.nl/BWBR0036702#Artikel126
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel127
    references:
      - id: ref1
        bwb_id: BWBR0036702
        artikel: '126'
        hoofdstuk: IX
        afdeling: '1'
  - number: 127.2.b
    text: |-
      indien dat tijdstip 1 januari van enig kalenderjaar is: op de in onderdeel a genoemde verslagen over het aan dat
      kalenderjaar direct voorafgaande kalenderjaar, en het onderzoeken en beoordelen van die verslagen, en
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel127
  - number: 127.2.c
    text: |-
      voor zover de toegelaten instellingen ingevolge [artikel 126, eerste lid][ref1], ten overstaan van Onze Minister
      aannemelijk hebben gemaakt dat het verrichten van werkzaamheden in verband met het toepassing geven aan artikel II,
      tweede lid, van de Herzieningswet toegelaten instellingen volkshuisvesting naar redelijkheid in de weg staat aan
      het door hen toepassing geven aan [hoofdstuk IV van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0036702#Artikel126
      [ref2]: https://wetten.overheid.nl/BWBR0005181#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel127
    references:
