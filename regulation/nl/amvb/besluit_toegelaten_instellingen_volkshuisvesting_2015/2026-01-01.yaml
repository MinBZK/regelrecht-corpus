      de liquiditeit van de toegelaten instelling, waaronder in elk geval de risico’s daarvoor vanwege het bezit van
      financiële derivaten;
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel33
  - number: 33.1.b
