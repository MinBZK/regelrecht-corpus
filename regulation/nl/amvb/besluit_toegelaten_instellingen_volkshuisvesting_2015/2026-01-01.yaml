  - number: '59.2'
    text: |-
      Na het geven van voorrang overeenkomstig het eerste lid houdt de toegelaten instelling bij het
      aangaan van overeenkomsten van huur en verhuur met betrekking tot haar woongelegenheden, bedoeld in
      [artikel 47, eerste lid, onderdelen b en c, van de wet][ref1], in de gevallen dat het huishoudinkomen hoger is
      dan de betrokken inkomensgrens, genoemd in [artikel 16, eerste lid][ref2], de volgorde aan die voortvloeit uit het
      daarover door haar vast te stellen beleid.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0036702#Artikel16
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel59
