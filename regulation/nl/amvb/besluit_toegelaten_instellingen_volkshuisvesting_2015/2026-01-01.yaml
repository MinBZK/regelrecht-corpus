  - number: '31.1'
    text: |-
      De waardering, bedoeld in [artikel 35, tweede lid, van de wet][ref1], vindt plaats tegen de modelmatige
      marktwaarde, en onder gebruikmaking van een berekeningssystematiek door middel waarvan de toekomstige inkomende en
      uitgaande kasstromen contant worden gemaakt naar het heden.


