  - number: '76'
    text: |-
      Op verzoek van Onze Minister verstrekt de toegelaten instelling hem nadere inlichtingen over de voorgenomen
      administratieve scheiding, voor zover dat naar zijn oordeel voor de beoordeling van het verzoek om goedkeuring
      daarvan noodzakelijk is. Bij ministeriële regeling kunnen voorschriften worden gegeven omtrent de inlichtingen die
      de toegelaten instelling dient te verstrekken.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel76
  - number: '77.1'
    text: |-
      Onze Minister betrekt bij zijn beoordeling van de financiële continuïteit van de daeb-tak na goedkeuring van de
      voorgenomen administratieve scheiding in elk geval:
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel77
  - number: 77.1.a
    text: zijn geraamde solvabiliteit na die scheiding;
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel77
  - number: 77.1.b
    text: |-
      de verhouding tussen het saldo van zijn operationele kasstromen en zijn rentelasten gedurende de eerste vijf jaren
      na die scheiding en
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel77
  - number: 77.1.c
    text: |-
      de meest recente beoordeling van zijn kredietwaardigheid door de borgingsvoorziening, indien de toegelaten
      instelling leningen als bedoeld in [artikel 66, eerste lid, onderdeel f][ref1], heeft aangetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0036702#Artikel66
