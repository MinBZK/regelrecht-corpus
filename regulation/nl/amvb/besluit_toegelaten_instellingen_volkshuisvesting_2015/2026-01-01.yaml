  - number: 60.1.c
    text: |-
      voor hoeveel jaren dat lagere en hogere percentage van toepassing zouden moeten zijn, welk aantal jaren ten hoogste
      4 is, en
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel60
  - number: 60.1.d
    text: |-
      de wijze waarop gedurende die jaren wordt bewerkstelligd dat na die jaren zal worden voldaan aan
      [artikel 48, eerste lid, eerste volzin, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel48
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '48'
  - number: '60.2'
    text: |-
      Voordat Onze Minister op het verzoek beslist, stelt hij de gemeenten die gelegen zijn in de gebieden, bedoeld in
      het eerste lid, onderdelen a en b, en waar een of meer van de bij het verzoek betrokken toegelaten instellingen
      feitelijk werkzaam zijn, in de gelegenheid hun zienswijzen daarop aan hem kenbaar te maken. Die gemeenten kunnen
      die zienswijzen binnen vier weken aan hem doen toekomen.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel60
  - number: '60.3'
    text: |-
      Onze Minister bepaalt voor elke toegelaten instelling afzonderlijk het lagere percentage, bedoeld in
      [artikel 48, vijfde lid, eerste volzin, van de wet][ref1], en het hogere percentage, bedoeld in de derde
      volzin van dat lid, met gebruikmaking van de formule: in welke formule voorstelt: - *wgl/geb (woongelegenheden
      gebieden):* het aantal woongelegenheden, bedoeld in [artikel 47, eerste lid, onderdelen b en c, van de wet][ref2],
      van de betrokken toegelaten instelling volgens de gegevens, opgenomen in het overzicht, bedoeld in
      [artikel 36a, vierde lid, van de wet][ref3], dat gelegen is in het gebied, bedoeld in het eerste lid, onderdeel a
      respectievelijk b, van dit artikel;
        - *perc/geb (percentage gebieden):* het lagere of hogere percentage, bedoeld in het eerste lid, onderdeel a
      respectievelijk b;
        - *wgl/ov (woongelegenheden overig):* het aantal woongelegenheden, bedoeld in
      [artikel 47, eerste lid, onderdelen b en c, van de wet][ref4], van de betrokken toegelaten instelling volgens de
      gegevens, opgenomen in het overzicht, bedoeld in [artikel 36a, vierde lid, van de wet][ref5], dat niet gelegen is
      in het gebied, bedoeld in het eerste lid, onderdeel a respectievelijk b, van dit artikel;
        - *wgl/tot (woongelegenheden totaal):* het totale aantal woongelegenheden, bedoeld in
      [artikel 47, eerste lid, onderdelen b en c, van de wet][ref6], van de betrokken toegelaten instelling volgens de
      gegevens, opgenomen in het overzicht, bedoeld in [artikel 36a, vierde lid, van de wet][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel47
      [ref3]: https://wetten.overheid.nl/BWBR0005181#Artikel36a
      [ref4]: https://wetten.overheid.nl/BWBR0005181#Artikel47
      [ref5]: https://wetten.overheid.nl/BWBR0005181#Artikel36a
      [ref6]: https://wetten.overheid.nl/BWBR0005181#Artikel47
      [ref7]: https://wetten.overheid.nl/BWBR0005181#Artikel36a
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel60
    references:
