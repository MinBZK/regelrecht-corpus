  - number: '64.5'
    text: Bij ministeriële regeling kunnen nadere voorschriften worden gegeven omtrent de toepassing van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel64
  - number: '65.1'
    text: |-
      De toegelaten instellingen op welke [artikel 49, eerste lid, eerste volzin, van de wet][ref1]
      van toepassing is, nemen in het voorstel, bedoeld in
      [artikel II, derde lid, tweede volzin, van de Herzieningswet toegelaten instellingen volkshuisvesting][ref2], zoals
      dat luidde onmiddellijk voorafgaand aan het tijdstip waarop die wet werd ingetrokken, voor elke wijk of buurt waar
      onroerende zaken zijn gelegen welke zij voornemens is in haar daeb-tak onder te brengen, een bedrag op dat gelijk
      is aan 5% van de WOZ-waarde van die zaken op 31 december 2015.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0036530#ArtikelII
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '49'
      - id: ref2
        bwb_id: BWBR0036530
        artikel: II
  - number: '65.2'
    text: |-
      De toegelaten instellingen, bedoeld in artikel 64, eerste lid, nemen in het jaarverslag, bedoeld in
      [artikel 36, eerste lid, van de wet][ref1], over het jaar 2015, voor elke wijk of buurt waar onroerende zaken
      zijn gelegen welke ingevolge [artikel 66][ref2] in de daeb-tak zouden kunnen zijn ondergebracht, een bedrag op dat
      gelijk is aan 5% van de WOZ-waarde van die zaken op 31 december 2015.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0036702#Artikel66
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '36'
      - id: ref2
        bwb_id: BWBR0036702
        artikel: '66'
        hoofdstuk: V
        paragraaf: '3'
        afdeling: '5'
  - number: '65.3'
    text: |-
      De toegelaten instellingen op welke [artikel 49, eerste lid, eerste volzin, van de wet][ref1], van toepassing is,
      nemen in het voorstel, bedoeld in [artikel 49a, van de wet][ref2], voor elke wijk of buurt waar onroerende zaken
      zijn gelegen welke zij voornemens is in haar daeb-tak onder te brengen, een bedrag op dat gelijk is aan 5% van de
      WOZ-waarde van die zaken.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel49a
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '49'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: 49a
  - number: '65.4'
    text: |-
      Indien de in de betrokken gemeente geldende woonvisie mede de aanwijzing van een gebied inhoudt waar
      herstructurering wordt beoogd en dat gebied meer dan een wijk of buurt beslaat, kan de toegelaten instelling voor
      de toepassing van het eerste, tweede of derde lid uitgaan van de WOZ-waarde van haar onroerende zaken die gelegen
      zijn in dat gebied.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel65
  - number: '65.5'
    text: |-
      Bij ministeriële regeling wordt bepaald welke delen van een gemeente voor de toepassing van het eerste tot en met
      vierde lid als wijk of buurt worden beschouwd.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel65
  - number: '66.1'
    text: |-
      De toegelaten instelling brengt, onverminderd [artikel 50, tweede lid, onderdeel e, van de wet][ref1], in de daeb-
      tak onder:


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel50
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '50'
  - number: 66.1.a
    text: |-
      haar verhuurde woongelegenheden met een huurprijs van ten hoogste het in
      [artikel 13, eerste lid, onderdeel a, van de Wet op de huurtoeslag][ref1] genoemde bedrag, alsmede haar
      geprojecteerde woongelegenheden die zij voornemens is tegen een zodanige huurprijs te verhuren;


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel13
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: '13'
  - number: 66.1.b
    text: haar niet verhuurde woongelegenheden die laatstelijk waren verhuurd tegen een huurprijs als bedoeld in onderdeel a;
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel66
  - number: 66.1.c
    text: |-
      haar woongelegenheden, bedoeld in [artikel 47, eerste lid, onderdelen c en d, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel47
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '47'
  - number: 66.1.d
    text: |-
      haar bestaande en geprojecteerde gebouwen, bedoeld in [artikel 45, tweede lid, onderdeel d, van de wet][ref1]
      alsmede haar niet verhuurde gebouwen die laatstelijk waren verhuurd overeenkomstig dat artikel;


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel45
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '45'
  - number: 66.1.e
    text: |-
      haar onbebouwde grond, voor zover daarop ingevolge een bestemmingsplan woningbouw zal moeten plaatsvinden, en zij
      voornemens is daarop binnen tien jaar na het verwerven van die grond woongelegenheden te doen bouwen, van welke ten
      minste 90% zal behoren tot de woongelegenheden, bedoeld in onderdeel a;
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel66
  - number: 66.1.f
    text: |-
      de door haar aangetrokken leningen met gebruikmaking van de borgingsvoorziening, of van borgstelling daarvan door
      overheden;
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel66
  - number: 66.1.g
    text: |-
      de voorziening, bedoeld in [artikel 13a, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0036702#Artikel13a
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0036702
        artikel: 13a
        hoofdstuk: III
        paragraaf: '3'
  - number: 66.1.h
    text: |-
      haar financieel waardeerbare rechten en verplichtingen uit hoofde van bedingen die betrekking hebben op een
      opvolgende vervreemding door de verkrijger van een woongelegenheid van de toegelaten instelling, indien die
      woongelegenheid op het tijdstip dat deze laatstelijk door de toegelaten instelling werd verhuurd, was aan te merken
      als een woongelegenheid als bedoeld in onderdeel a of c, en is vervreemd aan een natuurlijke persoon, en
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel66
  - number: 66.1.i
    text: |-
      haar baten en lasten, naar de mate waarin zij betrekking hebben op activa of passiva als bedoeld in de onderdelen
      a tot en met h, of, voor zover die baten en lasten niet aldus aan activa of passiva kunnen worden gerelateerd,
      jaarlijks het deel van die baten en lasten dat verhoudingsgewijs gelijk is aan het aandeel van de onroerende zaken,
      bedoeld in de onderdelen a tot en met e, in het totaal van haar onroerende zaken, welk aandeel en totaal blijken
      uit haar laatstelijk vastgestelde balans.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel66
  - number: '66.2'
    text: |-
      Bij ministeriële regeling kunnen nadere voorschriften worden gegeven omtrent hetgeen de toegelaten instelling in de
      daeb-tak onderbrengt.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel66
  - number: '67.1'
    text: |-
      De toegelaten instelling brengt, onverminderd [artikel 50, tweede lid, onderdeel e, van de wet][ref1], in de niet-
      daeb-tak onder:


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel50
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '50'
  - number: 67.1.a
    text: |-
      haar bestaande en geprojecteerde onroerende zaken die zij niet ingevolge
      [artikel 66, eerste lid, onderdelen a tot en met e][ref1], of het bepaalde krachtens artikel 66, tweede lid, in de
      daeb-tak onderbrengt;


      [ref1]: https://wetten.overheid.nl/BWBR0036702#Artikel66
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0036702
        artikel: '66'
        hoofdstuk: V
        paragraaf: '3'
        afdeling: '5'
  - number: 67.1.b
    text: |-
      de andere door haar aangetrokken leningen dan die, bedoeld in [artikel 66, eerste lid, onderdeel f][ref1], niet
      zijnde vlottende schuld;


      [ref1]: https://wetten.overheid.nl/BWBR0036702#Artikel66
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0036702
        artikel: '66'
        hoofdstuk: V
        paragraaf: '3'
        afdeling: '5'
  - number: 67.1.c
    text: |-
      haar financieel waardeerbare rechten en verplichtingen uit hoofde van bedingen die betrekking hebben op een
      opvolgende vervreemding door de verkrijger van een woongelegenheid van de toegelaten instelling, indien die
      woongelegenheid op het tijdstip dat deze laatstelijk door de toegelaten instelling werd verhuurd, niet was aan te
      merken als een woongelegenheid als bedoeld in onderdeel a of c, en is vervreemd aan een natuurlijke persoon;
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel67
  - number: 67.1.d
    text: |-
      de met haar verbonden ondernemingen, alsmede haar financieel waardeerbare rechten en verplichtingen jegens die
      ondernemingen, en
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel67
  - number: 67.1.e
    text: |-
      haar baten en lasten, naar de mate waarin zij betrekking hebben op activa of passiva als bedoeld in de onderdelen
      a, b en c, of, voor zover die baten en lasten niet aldus aan activa of passiva kunnen worden gerelateerd, jaarlijks
      het deel van die baten en lasten dat verhoudingsgewijs gelijk is aan het aandeel van de onroerende zaken, bedoeld
      in onderdeel a, in het totaal van haar onroerende zaken, welk aandeel en totaal blijken uit haar laatstelijk
      vastgestelde balans.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel67
  - number: '67.2'
    text: |-
      Bij ministeriële regeling kunnen nadere voorschriften worden gegeven omtrent hetgeen de toegelaten instelling in de
      niet-daeb-tak onderbrengt of kan onderbrengen.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel67
  - number: '68.1'
    text: |-
      Ten behoeve van de toepassing van [artikel 69][ref1] tot en met 31 december 2025 hanteren de toegelaten
      instellingen op welke [artikel 49, eerste lid, eerste volzin, van de wet][ref2] van toepassing is, het bedrag,
      bedoeld in [artikel 65, eerste lid][ref3], dat deel uitmaakt van een goedgekeurd voorstel als bedoeld in
      [artikel II, derde lid, tweede volzin, van de Herzieningswet toegelaten instellingen volkshuisvesting][ref4], zoals
      dat luidde onmiddellijk voorafgaand aan het tijdstip waarop die wet werd ingetrokken, of dat deel uitmaakt van een
      goedgekeurd voorstel als bedoeld in [artikel 49a van de wet][ref5]. Ten behoeve van die toepassing na die datum
      stellen die toegelaten instellingen, voor elke wijk of buurt waar onroerende zaken zijn gelegen welke zij in de
      daeb-tak hebben ondergebracht, een bedrag vast dat gelijk is aan 5% van de WOZ-waarde van die zaken op 31 december
      2025.


      [ref1]: https://wetten.overheid.nl/BWBR0036702#Artikel69
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel49
      [ref3]: https://wetten.overheid.nl/BWBR0036702#Artikel65
      [ref4]: https://wetten.overheid.nl/BWBR0036530#ArtikelII
      [ref5]: https://wetten.overheid.nl/BWBR0005181#Artikel49a
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0036702
        artikel: '69'
        hoofdstuk: V
        paragraaf: '3'
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '49'
      - id: ref3
        bwb_id: BWBR0036702
        artikel: '65'
        hoofdstuk: V
        paragraaf: '2'
        afdeling: '5'
      - id: ref4
        bwb_id: BWBR0036530
        artikel: II
      - id: ref5
        bwb_id: BWBR0005181
        artikel: 49a
  - number: '68.2'
    text: |-
      Ten behoeve van de toepassing van [artikel 69, eerste tot en met derde lid][ref1], tot en met 31 december
      2025 hanteren de toegelaten instellingen, bedoeld in [artikel 64, eerste lid][ref2], het bedrag, bedoeld in
      [artikel 65, tweede lid][ref3]. Ten behoeve van die toepassing na die datum nemen zij in het jaarverslag, bedoeld
      in [artikel 36, eerste lid, van de wet][ref4], over het jaar 2025, op de wijze, bedoeld in artikel 65, tweede lid,
      een bedrag op dat gelijk is aan 5% van de WOZ-waarde van de betrokken onroerende zaken op 31 december 2025.


      [ref1]: https://wetten.overheid.nl/BWBR0036702#Artikel69
      [ref2]: https://wetten.overheid.nl/BWBR0036702#Artikel64
      [ref3]: https://wetten.overheid.nl/BWBR0036702#Artikel65
      [ref4]: https://wetten.overheid.nl/BWBR0005181#Artikel36
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0036702
        artikel: '69'
        hoofdstuk: V
        paragraaf: '3'
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0036702
        artikel: '64'
        hoofdstuk: V
        paragraaf: '1'
        afdeling: '5'
      - id: ref3
        bwb_id: BWBR0036702
        artikel: '65'
        hoofdstuk: V
        paragraaf: '2'
        afdeling: '5'
      - id: ref4
        bwb_id: BWBR0005181
        artikel: '36'
  - number: '68.3'
    text: |-
      [Artikel 65, derde en vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0036702#Artikel65
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0036702
        artikel: '65'
        hoofdstuk: V
        paragraaf: '2'
        afdeling: '5'
  - number: '69.1'
    text: 'De toegelaten instelling kan in geval van herstructurering ten laste van de daeb-tak brengen:'
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel69
  - number: 69.1.a
    text: |-
      voor zover die herstructurering bestaat uit werkzaamheden als bedoeld in [artikel 1, eerste lid][ref1],
      begripsomschrijving van herstructurering, aanhef en onderdeel a: de kosten die zijn gemoeid met het verwerven
      van de betrokken onroerende zaken die verband houden met werkzaamheden die behoren tot de diensten van algemeen
      economisch belang, dan wel met de afboeking van die onroerende zaken, vermeerderd met de kosten van de sloop
      van die onroerende zaken en het bouwrijp maken van de grond ter plaatse van die sloop, en verminderd met de op
      residuele wijze, uitgaande van de voorgenomen bouw van onroerende zaken die verband houden met werkzaamheden die
      niet behoren tot de diensten van algemeen economisch belang, bepaalde marktwaarde van die grond na het bouwrijp
      maken daarvan;


      [ref1]: https://wetten.overheid.nl/BWBR0036702#Artikel1
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0036702
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
  - number: 69.1.b
    text: |-
      voor zover die herstructurering bestaat uit werkzaamheden als bedoeld in [artikel 1, eerste lid][ref1],
      begripsomschrijving van herstructurering, aanhef en onderdeel b: de kosten die zijn gemoeid met het verwerven
      van de betrokken onroerende zaken die verband houden met werkzaamheden die behoren tot de diensten van algemeen
      economisch belang, dan wel met de afboeking van die onroerende zaken, verminderd met de op residuele wijze,
      uitgaande van het voorgenomen treffen van ingrijpende voorzieningen of de voorgenomen samenvoeging, bepaalde
      marktwaarde van die onroerende zaken.


      [ref1]: https://wetten.overheid.nl/BWBR0036702#Artikel1
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0036702
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
  - number: '69.2'
    text: |-
      Bij toepassing van het eerste lid kan in het tijdvak dat aanvangt op het ingangstijdstip, bedoeld in
      [artikel II, vierde lid, tweede volzin, van de Herzieningswet toegelaten instellingen volkshuisvesting][ref1],
      zoals dat luidde onmiddellijk voorafgaand aan het tijdstip waarop die wet werd ingetrokken, of het
      ingangstijdstip, bedoeld in [artikel 49a, derde lid, tweede volzin, van de wet][ref2], en dat eindigt op
      31 december 2025, ten hoogste het bedrag, bedoeld in [artikel 65, eerste of tweede lid][ref3], ten laste van de
      daeb-tak worden gebracht. Bij toepassing van dat lid kan per daaropvolgend tijdvak van tien jaar, waarvan het
      eerste aanvangt op 1 januari 2026 en de volgende telkens tien jaar nadien, ten hoogste het bedrag, bedoeld in
      [artikel 68, eerste of tweede lid][ref4], ten laste van die tak worden gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0036530#ArtikelII
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel49a
      [ref3]: https://wetten.overheid.nl/BWBR0036702#Artikel65
      [ref4]: https://wetten.overheid.nl/BWBR0036702#Artikel1
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0036530
        artikel: II
      - id: ref2
        bwb_id: BWBR0005181
        artikel: 49a
      - id: ref3
        bwb_id: BWBR0036702
        artikel: '65'
        hoofdstuk: V
        paragraaf: '2'
        afdeling: '5'
      - id: ref4
        bwb_id: BWBR0036702
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
  - number: '69.3'
    text: |-
      Het ten laste brengen in enig tijdvak, bedoeld in het eerste en tweede lid, is uitsluitend van toepassing op
      herstructurering, met welke in dat tijdvak een aanvang is gemaakt, of met betrekking tot welke uit schriftelijke,
      uitsluitend op die herstructurering betrekking hebbende, stukken blijkt dat het maken van die aanvang wordt beoogd.
      Bij ministeriële regeling kunnen voorschriften worden gegeven omtrent de toepassing van dit lid.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel69
  - number: '69.4'
    text: |-
      Bij toepassing van het eerste lid, aanhef en onderdeel a, gaat onverwijld na het bouwrijp maken van de grond,
      bedoeld in dat onderdeel, die grond over naar de niet-daeb-tak onder verrekening tussen de daeb-tak en de niet-
      daeb-tak van de marktwaarde daarvan, bepaald overeenkomstig dat onderdeel.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel69
  - number: '70.1'
    text: |-
      Indien de toepassing van het bepaalde bij en krachtens de [artikelen 66][ref1] en [67][ref2] er zonder nadere
      maatregelen toe zou leiden, dat de financiële continuïteit van de daeb-tak niet in dezelfde mate is gewaarborgd als
      die van de niet-daeb-tak, voert de toegelaten instelling bij die toepassing onder de naam «interne startlening» een
      vordering van de daeb-tak op de niet-daeb-tak op. Op het rentepercentage van die vordering is het bepaalde bij en
      krachtens [artikel 10, tweede lid, onderdeel a][ref3], van overeenkomstige toepassing, met dien verstande dat het
      rentepercentage, bedoeld in dat artikel, geldt als minimumpercentage.


      [ref1]: https://wetten.overheid.nl/BWBR0036702#Artikel66
      [ref2]: https://wetten.overheid.nl/BWBR0036702#Artikel67
      [ref3]: https://wetten.overheid.nl/BWBR0036702#Artikel10
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0036702
        artikel: '66'
        hoofdstuk: V
        paragraaf: '3'
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0036702
        artikel: '67'
        hoofdstuk: V
        paragraaf: '3'
        afdeling: '5'
      - id: ref3
        bwb_id: BWBR0036702
        artikel: '10'
        hoofdstuk: III
        paragraaf: '3'
  - number: '70.2'
    text: |-
      Van de vordering, bedoeld in het eerste lid, wordt ten minste een maal per vijf jaar een bedrag ingelost,
      dat verhoudingsgewijs gelijk is aan het periodiek af te lossen bedrag op de leningen die zijn aangetrokken
      met gebruikmaking van de borgingsvoorziening. Bij de toepassing van de eerste volzin wordt uitgegaan van
      die vordering en die leningen als opgenomen in het door Onze Minister goedgekeurde voorstel, bedoeld in
      [artikel II, derde lid, tweede volzin, van de Herzieningswet toegelaten instellingen volkshuisvesting][ref1], zoals
      dat luidde onmiddellijk voorafgaand aan het tijdstip waarop die wet werd ingetrokken, of het door Onze Minister
      goedgekeurde voorstel, bedoeld in [artikel 49a, eerste lid, tweede volzin, van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0036530#ArtikelII
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel49a
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0036530
        artikel: II
      - id: ref2
        bwb_id: BWBR0005181
        artikel: 49a
  - number: '70.3'
    text: |-
      De toegelaten instelling kan Onze Minister verzoeken om de inlossing, bedoeld in het tweede lid, op een later
      tijdstip te stellen of het in te lossen bedrag lager vast te stellen. Onze Minister willigt het verzoek uitsluitend
      in, indien naar zijn oordeel daardoor wordt voorkomen dat de financiële continuïteit van de niet-daeb-tak niet meer
      is gewaarborgd en de financiële continuïteit van de daeb-tak gewaarborgd blijft. Hij kan aan dat inwilligen nadere
      voorwaarden verbinden.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel70
  - number: '70.4'
    text: Bij ministeriële regeling kunnen nadere voorschriften worden gegeven omtrent de toepassing van dit artikel.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel70
  - number: '71.1'
    text: |-
      Overdrachten door de toegelaten instelling tussen haar daeb-tak en haar niet-daeb-tak van garanties of rechten van
      pand of hypotheek op zaken en daarmee verbonden rechten na 1 juli 2015 leiden op generlei wijze tot een wijziging
      voor derden in het kunnen inroepen van hun rechten jegens de toegelaten instelling.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel71
  - number: '71.2'
    text: |-
      De toegelaten instelling verschaft vanuit haar daeb-tak niet anderszins financiële middelen aan haar
      niet-daeb-tak dan door middel van een voorziening als bedoeld in [artikel 13a, tweede lid][ref1],
      een interne startlening als bedoeld in artikel 70, eerste lid, of een interne lening als bedoeld in
      [artikel 79, tweede lid, onderdeel a][ref2]. Zij verschaft vanuit haar daeb-tak geen garanties aan haar niet-daeb-
      tak.


      [ref1]: https://wetten.overheid.nl/BWBR0036702#Artikel13a
      [ref2]: https://wetten.overheid.nl/BWBR0036702#Artikel79
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0036702
        artikel: 13a
        hoofdstuk: III
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0036702
        artikel: '79'
        hoofdstuk: V
        paragraaf: '5'
        afdeling: '5'
  - number: '71.3'
    text: |-
      De toegelaten instelling kan Onze Minister verzoeken om een ontheffing van het verbod, bedoeld in het tweede lid.
      Onze Minister willigt het verzoek uitsluitend in, indien dat naar zijn oordeel noodzakelijk is:
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel71
  - number: 71.3.a
    text: |-
      om te voorkomen dat de toegelaten instelling gehouden is om schulden van de niet-daeb-tak uit haar daeb-tak te
      voldoen of
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel71
  - number: 71.3.b
    text: |-
      ten behoeve van de herfinanciering van leningen die bestonden op 1 juli 2015 en nadien in de niet-daeb-tak zijn
      ondergebracht.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel71
  - number: '72'
    text: |-
      De administratie van de toegelaten instelling wordt met inachtneming van het bepaalde bij en krachtens de
      [artikelen 66 tot en met 71][ref1] ingericht. In die administratie wordt elke overdracht van financiële middelen
      vanuit de niet-daeb-tak van de toegelaten instelling aan haar daeb-tak afzonderlijk verantwoord.


      [ref1]: https://wetten.overheid.nl/BWBR0036702#Artikel66
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0036702
        artikel: '66'
        hoofdstuk: V
        paragraaf: '3'
        afdeling: '5'
  - number: '73.1'
    text: |-
      De toegelaten instelling stelt, voordat zij een verzoek om goedkeuring van een voorgenomen administratieve
      scheiding indient, de colleges van burgemeester en wethouders van de gemeente waar zij haar woonplaats
      heeft en van de gemeenten waar zij feitelijk werkzaam is, de betrokken bewonersorganisaties en
      de huurders van haar gebouwen die een maatschappelijke gebruiksbestemming hebben als bedoeld in
      [artikel 45, tweede lid, onderdeel d, van de wet][ref1] in de gelegenheid om hun zienswijze op die scheiding
      te geven. De personen en instanties, bedoeld in de eerste volzin, kunnen binnen zes weken hun zienswijzen aan
      de toegelaten instelling doen toekomen. De betrokken bewonersorganisaties kunnen binnen zes weken hun adviezen,
      bedoeld in [artikel 5, eerste lid, van de Wet op het overleg huurders verhuurder][ref2], aan haar doen toekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0009810#Artikel5
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '45'
      - id: ref2
        bwb_id: BWBR0009810
        artikel: '5'
  - number: '73.2'
    text: |-
      De toegelaten instelling verstrekt de personen en instanties, bedoeld in het eerste lid, eerste volzin, alle
      inlichtingen die redelijkerwijs kunnen bijdragen aan het zich vormen van hun zienswijze, of aan het opstellen van
      een advies als bedoeld in [artikel 5, eerste lid, van de Wet op het overleg huurders verhuurder][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009810#Artikel5
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0009810
        artikel: '5'
  - number: '73.3'
    text: Bij ministeriële regeling kunnen nadere voorschriften worden gegeven omtrent de toepassing van het tweede lid.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel73
  - number: '74.1'
    text: |-
      De toegelaten instelling voert overleg over het verzoek om goedkeuring van de voorgenomen administratieve scheiding
      met de gemeente waar zij haar woonplaats heeft en de gemeenten waar zij feitelijk werkzaam is, alsmede met de
      betrokken bewonersorganisaties.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel74
  - number: '74.2'
    text: |-
      De toegelaten instelling stelt de huurders van haar andere gebouwen dan woongelegenheden in de gelegenheid met haar
      overleg te voeren over het verzoek, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel74
  - number: '75.1'
    text: 'Het verzoek om goedkeuring van de voorgenomen administratieve scheiding gaat in elk geval vergezeld van:'
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel75
  - number: 75.1.a
    text: |-
      het voorstel, bedoeld in [artikel 49a, van de wet][ref1], en een schriftelijke toelichting daarop;


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel49a
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 49a
  - number: 75.1.b
    text: |-
      de gegevens over de beoogde toepassing van het bepaalde bij en krachtens de [artikelen 13a][ref1], [70][ref2] en
      [71][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0036702#Artikel13a
