  - number: '121.1'
    text: |-
      Elke toegelaten instelling die op 1 januari van een kalenderjaar als zodanig bestaat, is over dat kalenderjaar een
      bijdrage aan Onze Minister verschuldigd in de kosten die in het algemeen gemoeid zijn met de uitoefening van het
      toezicht. Onze Minister begroot de bijdrage voor alle toegelaten instellingen gezamenlijk.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel121
