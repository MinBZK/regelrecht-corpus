    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel33
  - number: 33.1.c
    text: |-
      haar ruimte voor het doen van investeringen in de eerstvolgende vijf kalenderjaren na het verslagjaar waarop het
      oordeel betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel33
  - number: 33.1.d
    text: |-
      haar beschikbare financiële middelen in verhouding tot de werkzaamheden die zijn opgenomen in het overzicht,
      bedoeld in [artikel 44a, eerste lid, onderdeel a, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel44a
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 44a
  - number: 33.1.e
    text: |-
      de mate waarin het risico bestaat dat haar vermogen niet bestemd blijft voor het behartigen van het belang van de
      volkshuisvesting en
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel33
  - number: 33.1.f
    text: de kwaliteit van haar organisatiestructuur.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel33
  - number: '33.2'
    text: |-
      Bij ministeriële regeling kan worden bepaald welke onderwerpen voorts in elk geval worden beoordeeld bij de
      toepassing van de [artikelen 38, vierde lid][ref1], en [artikel 44a, derde lid, van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel44a
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '38'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: 44a
  - number: '34.1'
    text: |-
      Onze Minister keurt een voornemen als bedoeld in [artikel 41a, eerste lid, van de wet][ref1] niet goed, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel41a
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 41a
  - number: 34.1.a
    text: |-
      de gemeente waarop dat voornemen betrekking heeft niet direct grenst aan een gemeente in Nederland waar de
      toegelaten instelling feitelijk werkzaam is;
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel34
  - number: 34.1.b
    text: |-
      die toegelaten instelling in de gemeenten in Nederland waar zij feitelijk werkzaam is niet alle personen kan
      huisvesten die aldaar door hun inkomen of door andere omstandigheden moeilijkheden ondervinden bij het vinden van
      hun passende huisvesting, of
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel34
  - number: 34.1.c
    text: |-
      zienswijzen op dat voornemen van de gemeente waarop het betrekking heeft, van de direct aan die gemeente grenzende
      gemeenten in Nederland of van de betrokken bewonersorganisaties hem daartoe naar zijn oordeel aanleiding geven.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel34
  - number: '34.2'
    text: |-
      Bij ministeriële regeling kunnen nadere voorschriften worden gegeven omtrent de toepassing van het eerste lid,
      onderdelen b en c.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel34
  - number: '35.1'
    text: |-
      Een verzoek als bedoeld in [artikel 41b, eerste lid, van de wet][ref1] omvat in elk geval:


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel41b
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 41b
  - number: 35.1.a
    text: een overzicht van de toegelaten instellingen die feitelijk werkzaam zijn in de gemeenten die dat verzoek indienen;
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel35
  - number: 35.1.b
    text: het aantal in die gemeenten gezamenlijk woonachtige huishoudens en
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel35
  - number: 35.1.c
    text: |-
      de zienswijzen op dat verzoek van die toegelaten instellingen, van andere gemeenten waar die toegelaten
      instellingen feitelijk werkzaam zijn of van de betrokken bewonersorganisaties.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel35
  - number: '35.2'
    text: |-
      Het verzoek kan mede inhouden dat de goedkeuring, bedoeld in [artikel 41b, eerste lid, van de wet][ref1],
      uitsluitend betrekking heeft op die, in dat verzoek te noemen, toegelaten instellingen zonder de bijdrage van welke
      een of meer van de betrokken gemeenten geen uitvoering kan geven aan haar woonvisie, of die in een of meer van
      die gemeenten een zodanig groot deel van hun werkzaamheden verrichten dat die goedkeuring naar het oordeel van die
      gemeenten om die reden noodzakelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel41b
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 41b
  - number: '35.3'
    text: |-
      Onze Minister kan besluiten om een verzoek als bedoeld in [artikel 41b, eerste lid, van de wet][ref1] niet in te
      willigen, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel41b
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 41b
  - number: 35.3.a
    text: |-
      een van de gemeenten die dat verzoek indienen voordien een zodanig verzoek heeft ingediend, en Onze Minister dat
      verzoek heeft ingewilligd of
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel35
  - number: 35.3.b
    text: indien in die gemeenten gezamenlijk minder dan 100 000 huishoudens woonachtig zijn.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel35
  - number: '35.4'
    text: |-
      Onze Minister kan bij de inwilliging van een verzoek als bedoeld in [artikel 41b, eerste lid, van de wet][ref1]
      bepalen dat zijn goedkeuring uitsluitend betrekking heeft op de in zijn besluit te noemen in de betrokken gemeenten
      feitelijk werkzame toegelaten instellingen, op welke het tweede lid naar zijn oordeel van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel41b
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 41b
  - number: '35.5'
    text: |-
      Bij ministeriële regeling kunnen nadere voorschriften worden gegeven omtrent hetgeen een verzoek als bedoeld in
      [artikel 41b, eerste lid, van de wet][ref1] dient te omvatten.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel41b
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 41b
  - number: '36'
    text: |-
      De categorieën van personen, bedoeld in [artikel 41c, tweede lid, eerste volzin, van de wet][ref1], zijn:


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel41c
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 41c
  - number: 36.a
    text: |-
      personen die zijn ingeschreven bij een universiteit of hogeschool als bedoeld in
      [artikel 1.2, onderdelen a en b, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1], of bij een
      instelling als bedoeld in [artikel 1.1.1 van de Wet educatie en beroepsonderwijs][ref2], of die zich voorbereiden
      op een promotie als bedoeld in artikel 7.18 van eerstgenoemde wet;


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '1'
  - number: 36.b
    text: ouderen, gehandicapten en andere personen die zorg of begeleiding behoeven en
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel36
  - number: 36.c
    text: |-
      andere personen, voor welke de voorziening in de behoefte aan huisvesting dringend noodzakelijk is uit het oogpunt
      van gezondheid, veiligheid, sociale factoren, overmacht of calamiteiten.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel36
  - number: '37.1'
    text: |-
      Een verzoek om een ontheffing als bedoeld in [artikel 41c, tweede lid, tweede volzin, van de wet][ref1] omvat in
      elk geval:


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel41c
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 41c
  - number: 37.1.a
    text: de gemeenten waar die ontheffing van toepassing zou moeten zijn;
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel37
  - number: 37.1.b
    text: |-
      een uiteenzetting over de gevolgen van het niet verlenen van die ontheffing voor de uitvoering door toegelaten
      instellingen van de woonvisies die in die gemeenten gelden;
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel37
  - number: 37.1.c
    text: |-
      een uiteenzetting over het aandeel van de werkzaamheden van de toegelaten instelling in die gemeenten in het totaal
      van haar werkzaamheden en
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel37
  - number: 37.1.d
    text: |-
      indien de toegelaten instelling zienswijzen op dat verzoek heeft ontvangen van de gemeenten, bedoeld in
      onderdeel a, van de gemeenten waar zij feitelijk werkzaam mag zijn uit hoofde van het inwilligen van het in
      [artikel 41b, eerste lid, van de wet][ref1] bedoelde verzoek, dat tot het in dit lid bedoelde verzoek heeft
      geleid, van de in een van die gemeenten feitelijk werkzame toegelaten instellingen, of van de betrokken
      bewonersorganisaties: die zienswijzen.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel41b
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 41b
  - number: '37.2'
    text: |-
      Onze Minister kan besluiten om geen ontheffing als bedoeld in het eerste lid te verlenen, indien de uitvoering door
      toegelaten instellingen van de woonvisies die gelden in de gemeenten waar de betrokken ontheffing van toepassing
      zou zijn naar zijn oordeel door dat besluit niet nadelig wordt beïnvloed. In afwijking van de eerste zin kan Onze
      Minister besluiten om een ontheffing te verlenen indien:
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel37
  - number: 37.2.a
    text: |-
      de gemeenten waar die ontheffing van toepassing zou moeten zijn direct grenzen aan een gebied als bedoeld in
      [artikel 41b van de wet][ref1] waarin de toegelaten instelling feitelijk werkzaam is, in welke gemeenten de
      toegelaten instelling reeds woongelegenheden in bezit heeft; en


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel41b
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 41b
  - number: 37.2.b
    text: de zienswijzen, bedoeld in het eerste lid, onderdeel d, daartoe aanleiding geven.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel37
  - number: '37.3'
    text: |-
      Onze Minister kan aan het verlenen van een ontheffing als bedoeld in het eerste lid het gevolg, bedoeld in
      [artikel 41c, eerste lid, van de wet][ref1], verbinden ten aanzien van de gemeenten waar de toegelaten instelling
      feitelijk werkzaam mag zijn uit hoofde van het inwilligen van het in [artikel 41b, eerste lid, van de wet][ref2]
      bedoelde verzoek, dat tot het in dit lid bedoelde verzoek heeft geleid, indien de uitvoering door toegelaten
      instellingen van de woonvisies die in die gemeenten gelden naar zijn oordeel daardoor niet nadelig wordt beïnvloed.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel41c
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel41b
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 41c
      - id: ref2
        bwb_id: BWBR0005181
        artikel: 41b
  - number: '37.4'
    text: |-
      Bij ministeriële regeling kunnen nadere voorschriften worden gegeven omtrent hetgeen een verzoek om een ontheffing
      als bedoeld in [artikel 41c, tweede lid, tweede volzin, van de wet][ref1] dient te omvatten, en omtrent de
      toepassing van het tweede of derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel41c
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 41c
  - number: 37a.1
    text: |-
      Onze Minister kan op verzoek van een toegelaten instelling ontheffing verlenen van het verbod, bedoeld in
      [artikel 41c, eerste lid, van de wet][ref1], ten aanzien van werkzaamheden die zich, gezien de aard en omvang
      daarvan, in hoofdzaak beperken tot het gebied ter plaatse van voordien daartoe gesloopte woongelegenheden of hun
      onroerende of infrastructurele aanhorigheden.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel41c
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel37a
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 41c
  - number: 37a.2
    text: |-
      [Artikel 37][ref1] is niet van toepassing op het verzoek, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0036702#Artikel37
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel37a
    references:
      - id: ref1
        bwb_id: BWBR0036702
        artikel: '37'
        hoofdstuk: V
        paragraaf: '1'
        afdeling: '1'
  - number: '38.1'
    text: |-
      Onze Minister draagt er zorg voor dat jaarlijks voor 1 juli elke gemeente met betrekking tot de toegelaten
      instellingen die aldaar feitelijk werkzaam zijn en elke betrokken bewonersorganisatie beschikt over een
      indicatie van de middelen welke die toegelaten instellingen ter beschikking staan voor de uitvoering van
      [artikel 42, eerste lid, eerste volzin, van de wet][ref1] in ten minste het op die datum eerstvolgende
      kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel42
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '42'
  - number: '38.2'
    text: |-
      Bij ministeriële regeling kunnen voorschriften worden gegeven omtrent de wijze van bepaling van de indicatie,
      bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel38
  - number: '39.1'
    text: |-
      De toegelaten instelling betrekt bij het vaststellen van het overzicht, bedoeld in
      [artikel 43, eerste lid, van de wet][ref1], de door Onze Minister vast te stellen rijksprioriteiten met betrekking
      tot het terrein van de volkshuisvesting. Onze Minister stelt die prioriteiten ten minste een maal per vier jaar
      vast voor een tijdvak van de vier op dat jaar volgende kalenderjaren en doet deze voor de aanvang van dat tijdvak
      toekomen aan beide kamers der Staten-Generaal. In het kalenderjaar dat direct voorafgaat aan een zodanig tijdvak
      voert hij overleg over de voor dat tijdvak voorgenomen prioriteiten met in elk geval personen of instanties uit de
      kring van de toegelaten instellingen, de gemeenten en de bewonersorganisaties.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel43
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '43'
  - number: '39.2'
    text: |-
      Indien de colleges van burgemeester en wethouders van de gemeenten waar de toegelaten instelling feitelijk werkzaam
      is geen woonvisie aan de toegelaten instelling hebben verstrekt, neemt de toegelaten instelling in het overzicht,
      bedoeld in [artikel 43, eerste lid, van de wet][ref1], in elk geval op:


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel43
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '43'
  - number: 39.2.a
    text: |-
      haar voornemens voor het doen bouwen of verwerven van woongelegenheden als bedoeld in
      [artikel 47, eerste lid, onderdeel b, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel47
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '47'
  - number: 39.2.b
    text: |-
      haar voornemens met betrekking tot het toepassing geven aan
      [artikel 45, tweede lid, onderdelen d en f, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel45
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '45'
  - number: 39.2.c
    text: |-
      haar voornemens met betrekking tot de samenstelling van haar woningvoorraad, waaronder in elk geval haar voornemens
      met betrekking tot vervreemding van haar woongelegenheden en haar voornemens tot het bij het aangaan van nieuwe
      overeenkomsten van huur en verhuur zodanig verhogen van huurprijzen van haar woongelegenheden, dat zij komen te
      liggen boven het in [artikel 13, eerste lid, onderdeel a, van de Wet op de huurtoeslag][ref1] genoemde bedrag;


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel13
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: '13'
  - number: 39.2.d
    text: |-
      haar voornemens met betrekking tot de kwaliteit en de duurzaamheid van haar woningvoorraad en de direct daaraan
      grenzende omgeving;
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel39
  - number: 39.2.e
    text: |-
      haar voornemens met betrekking tot de betaalbaarheid en de bereikbaarheid van haar woongelegenheden voor degenen,
      bedoeld in [artikel 46, eerste lid, onderdeel a, van de wet][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel46
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '46'
  - number: 39.2.f
    text: |-
      haar voornemens met betrekking tot de huisvesting van de categorieën van personen, genoemd in [artikel 36][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0036702#Artikel36
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0036702
        artikel: '36'
        hoofdstuk: V
        paragraaf: '1'
        afdeling: '1'
  - number: '39.3'
    text: |-
      Het overzicht, bedoeld in [artikel 43, eerste lid, van de wet][ref1], heeft geen betrekking op de met de toegelaten
      instelling verbonden ondernemingen van welke zij minder dan 2% van het kapitaal inbrengt.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel43
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '43'
  - number: '40.1'
    text: |-
      Onze Minister stelt een commissie in, die hem adviseert over de behandeling van geschillen als bedoeld in
      [artikel 44, derde lid, van de wet][ref1]. De commissie bestaat uit personen uit de kring van organisaties
      die zich ten doel stellen de belangen van toegelaten instellingen te behartigen, uit personen uit de kring
      van organisaties die zich ten doel stellen de belangen van gemeenten te behartigen, en personen uit de kring
      van bewonersorganisaties. De commissie is zodanig samengesteld, dat geen van die categorieën van personen de
      meerderheid van de commissie kan uitmaken.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel44
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '44'
  - number: '40.2'
    text: |-
      Bij ministeriële regeling kunnen nadere voorschriften gegeven worden over de behandeling van geschillen als bedoeld
      in [artikel 44, derde en vierde lid, van de wet][ref1], en de werkwijze en samenstelling van de commissie, bedoeld
      in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel44
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '44'
  - number: 45a.1
    text: |-
      Het financieel voordeel, bedoeld in [artikel 44d, tweede lid, van de wet][ref1], is het verschil tussen:


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel44d
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel45a
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 44d
  - number: 45a.1.a
    text: |-
      de canon die de gemeente op basis van de actuele grondwaarde zou opleggen bij uitgifte van de grond,
      indien die bestemd is voor huurwoningen met een aanvangshuurprijs van ten minste het bedrag, bedoeld in
      [artikel 13, eerste lid, onder a, van de Wet op de huurtoeslag][ref1], en ten hoogste een in de gemeentelijke
      verordening bepaalde, jaarlijks te indexeren aanvangshuurprijs, en;


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel13
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel45a
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: '13'
  - number: 45a.1.b
    text: |-
      de canon die de gemeente op basis van de actuele grondwaarde zou opleggen bij uitgifte van de grond met de
      bestemming voorafgaand aan een wijziging daarvan als bedoeld in [artikel 44d, eerste lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel44d
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel45a
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 44d
  - number: 45a.2
    text: |-
      De grondwaarden, bedoeld in het eerste lid, worden uiterlijk een maand na wijziging van de bestemming bepaald door
      een onafhankelijke taxateur als bedoeld in [artikel 1, eerste lid][ref1], die door de gemeente en de toegelaten
      instelling gezamenlijk is aangesteld voor rekening van de toegelaten instelling. De taxateur rapporteert aan beide
      partijen.


      [ref1]: https://wetten.overheid.nl/BWBR0036702#Artikel1
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel45a
    references:
      - id: ref1
        bwb_id: BWBR0036702
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
  - number: '46'
    text: |-
      Een verbonden onderneming voldoet in een kalenderjaar aan [artikel 45, eerste lid, tweede volzin, van de wet][ref1],
      indien zij over dat jaar een percentage van haar omzet genereert uit werkzaamheden op het gebied van de
      volkshuisvesting, dat ten minste gelijk is aan het percentage van het kapitaal dat een toegelaten instelling in
      haar inbrengt.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel45
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '45'
  - number: 46a
    text: |-
      De werkzaamheden, genoemd in [artikel 45, tweede lid, onderdelen a en b, van de wet][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel45
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel46a
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '45'
  - number: 46a.a
    text: |-
      worden door een toegelaten instelling niet verricht ten aanzien van de in die onderdelen bedoelde woongelegenheden
      en aanhorigheden van een met een toegelaten instelling verbonden onderneming;
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel46a
  - number: 46a.b
    text: |-
      worden door een met een toegelaten instelling verbonden onderneming uitsluitend verricht ten aanzien van de in dat
      onderdeel bedoelde woongelegenheden en aanhorigheden van een andere verbonden onderneming:
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel46a
  - number: 46a.b.1°
    text: indien en zolang alle aandelen in die andere verbonden onderneming door toegelaten instellingen worden gehouden, of
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel46a
  - number: 46a.b.2°
    text: |-
      indien en zolang toegelaten instellingen of een of meer van de met hen verbonden ondernemingen alleen of samen alle
      bestuurders van de verbonden onderneming kunnen benoemen of ontslaan.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel46a
  - number: '47.1'
    text: |-
      Tot de diensten, bedoeld in [artikel 45, tweede lid, onderdeel c, van de wet][ref1], behoren mede de in de [bijlage
      bij het Besluit servicekosten](onbekend) genoemde zaken en diensten.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel45
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '45'
  - number: '47.2'
    text: |-
      Diensten als bedoeld in [artikel 45, tweede lid, onderdeel c, onder 1° en 2°, van de wet][ref1] mogen uitsluitend
      worden geleverd aan:


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel45
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '45'
  - number: 47.2.a
    text: bewoners van eigen woongelegenheden;
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel47
  - number: 47.2.b
    text: bewoners van woongelegenheden van een toegelaten instelling;
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel47
  - number: 47.2.c
    text: |-
      leden van verenigingen van eigenaars als bedoeld in
      [artikel 112 lid 1 onder e van Boek 5 van het Burgerlijk Wetboek][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005288#Artikel112
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0005288
        artikel: '112'
  - number: 47.2.d
    text: |-
      bewoners van woongelegenheden die bouwkundig een geheel vormen met de eigen woongelegenheden of de woongelegenheden
      van een toegelaten instelling;
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel47
  - number: 47.2.e
    text: |-
      indien de diensten worden geleverd door een aan een toegelaten instelling verbonden onderneming, bewoners van
      woongelegenheden van een verbonden onderneming waarvan alle aandelen door toegelaten instellingen worden gehouden;
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel47
  - number: 47.2.f
    text: |-
      bewoners van woongelegenheden als bedoeld in [artikel 45, zevende lid, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel45
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '45'
  - number: 47.2.g
    text: |-
      leden van wooncoöperaties waaraan de toegelaten instelling woongelegenheden heeft vervreemd voor zover het
      werkzaamheden, bedoeld in [artikel 48, eerste lid, onderdeel b][ref1], betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0036702#Artikel48
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0036702
        artikel: '48'
        hoofdstuk: V
        afdeling: '2'
  - number: '48.1'
    text: 'De toegelaten instelling stelt uitsluitend financiële middelen ter beschikking in de vorm van:'
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel48
  - number: 48.1.a
    text: 'tegemoetkomingen in de kosten van activiteiten die door de bewoners van haar woongelegenheden worden georganiseerd:'
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel48
  - number: 48.1.a.1°
    text: in het belang van het behoud of de verbetering van die woongelegenheden of de direct daaraan grenzende omgeving, en
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel48
  - number: 48.1.a.2°
    text: gericht op ontmoeting van bewoners van die woongelegenheden;
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel48
  - number: 48.1.b
    text: |-
      reserveringen voor leden van wooncoöperaties met een huishoudinkomen dat niet hoger is dan de betrokken
      inkomensgrens, genoemd in [artikel 16, eerste lid][ref1], in verband met het onderhoud aan hun woongelegenheden;


      [ref1]: https://wetten.overheid.nl/BWBR0036702#Artikel16
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0036702
        artikel: '16'
        hoofdstuk: III
        paragraaf: '4'
  - number: 48.1.c
    text: |-
      tegemoetkomingen in het blijkens een geldleningsovereenkomst te betalen bedrag aan rente over een hypothecaire
      geldlening, overeenkomstig het tweede lid, of
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel48
  - number: 48.1.d
    text: |-
      tegemoetkomingen ter voldoening aan het bepaalde in [artikel 2, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0036702#Artikel2
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0036702
        artikel: '2'
        hoofdstuk: II
  - number: '48.2'
    text: 'Tegemoetkomingen als bedoeld in het eerste lid, onderdeel c, worden uitsluitend verstrekt:'
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel48
  - number: 48.2.a
    text: |-
      over ten hoogste 20% van de verwervingskosten overeenkomstig de onder auspiciën van de Stichting Waarborgfonds
      Eigen Woningen ontwikkelde Nationale Hypotheek Garantie, welke kosten worden gefinancierd door een instelling die
      behoort tot een categorie als bedoeld in het bepaalde bij en krachtens [artikel 13, eerste en tweede lid][ref1], of
      aan welke een vergunning als bedoeld in [artikel 2:60 van de Wet op het financieel toezicht][ref2] is verleend;


      [ref1]: https://wetten.overheid.nl/BWBR0036702#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel2
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0036702
        artikel: '13'
        hoofdstuk: III
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '2'
  - number: 48.2.b
    text: |-
      in geval van het verstrekt zijn van de hypothecaire geldlening onder de voorwaarden en normen van de onder
      auspiciën van de Stichting Waarborgfonds Eigen Woningen ontwikkelde Nationale Hypotheek Garantie;
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel48
  - number: 48.2.c
    text: |-
      aan instellingen als bedoeld in onderdeel a ten behoeve van personen die voor de eerste maal als eigenaar een
      woning bewonen, zolang het huishoudinkomen van die personen niet hoger is dan de betrokken inkomensgrens, genoemd
      in [artikel 16, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0036702#Artikel16
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0036702
        artikel: '16'
        hoofdstuk: III
        paragraaf: '4'
  - number: 48.2.d
    text: 'indien niet tevens een tegemoetkoming wordt verstrekt:'
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel48
  - number: 48.2.d.1°
    text: |-
      op grond van de [Wet bevordering eigenwoningbezit][ref1] of


      [ref1]: https://wetten.overheid.nl/BWBR0011919
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0011919
  - number: 48.2.d.2°
    text: |-
      door de toegelaten instelling, voor zover ertoe leidend dat de woning aan een persoon als bedoeld in onderdeel c
      wordt vervreemd tegen een prijs die lager is dan 90% van de getaxeerde marktwaarde vrij van huur en gebruik of de
      WOZ-waarde, of met het oogmerk een zodanige persoon anderszins zodanig te bevoordelen dat een dienovereenkomstige
      uitkomst wordt bereikt, en
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel48
  - number: 48.2.e
    text: |-
      indien uit overeenkomsten tussen de betrokken persoon en een instelling als bedoeld in onderdeel a, en tussen
      die instelling en de toegelaten instelling, blijkt dat de tegemoetkoming wordt verlaagd of beëindigd, indien
      het huishoudinkomen van die persoon daartoe aanleiding geeft blijkens een periodieke beoordeling van dat inkomen
      overeenkomstig in die overeenkomsten neergelegde bepalingen.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel48
  - number: '48.3'
    text: |-
      Bij ministeriële regeling kan worden bepaald onder welke modellen voor of bepalingen in overeenkomsten als
      bedoeld in het tweede lid, onderdeel e, een tegemoetkoming als bedoeld in het eerste lid, onderdeel c, kan worden
      verstrekt.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel48
  - number: '49.1'
    text: |-
      De gebouwen, bedoeld in [artikel 45, tweede lid, onderdeel d, van de wet][ref1], zijn:


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel45
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '45'
  - number: 49.1.a
    text: |-
      de gebouwen en categorieën van gebouwen, genoemd in [bijlage 2][ref1] bij dit besluit en


      [ref1]: https://wetten.overheid.nl/BWBR0036702
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0036702
  - number: 49.1.b
    text: |-
      de gebouwen en categorieën van gebouwen, genoemd in [bijlage 3][ref1] bij dit besluit, welke ten aanzien van een
      toegelaten instelling uitsluitend tot het gebied van de volkshuisvesting behoren, indien zij deze op het tijdstip
      waarop dit besluit in werking is getreden in eigendom had.


      [ref1]: https://wetten.overheid.nl/BWBR0036702
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0036702
  - number: '49.2'
    text: |-
      Onze Minister kan op verzoek van een toegelaten instelling bepalen dat het doen bouwen of verwerven van andere
      gebouwen met een maatschappelijke gebruiksbestemming dan die, bedoeld in het eerste lid, ten aanzien van die
      toegelaten instelling tot het gebied van de volkshuisvesting behoort, indien die gebouwen naar zijn oordeel behoren
      tot een aan een categorie als genoemd in [bijlage 2][ref1] bij dit besluit nauw verwante categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0036702
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0036702
  - number: '49.3'
    text: |-
      De werkzaamheden ten aanzien van welke Onze Minister toepassing heeft gegeven aan het tweede lid, behoren tot de
      diensten van algemeen economisch belang.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel49
  - number: 49a.1
    text: |-
      Een toegelaten instelling kan gebouwen verwerven die geen verband houden met werkzaamheden op het gebied van de
      volkshuisvesting indien zij binnen vijf jaar na verwerving die gebouwen:
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel49a
  - number: 49a.1.a
    text: |-
      zal slopen en ter plaatse gebouwen zal doen bouwen die verband houden met werkzaamheden op het gebied van de
      volkshuisvesting; of
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel49a
  - number: 49a.1.b
    text: zal verbouwen tot onroerende zaken die verband houden met werkzaamheden op het gebied van de volkshuisvesting.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel49a
  - number: 49a.2
    text: |-
      Onze Minister kan op verzoek van een toegelaten instelling bepalen dat het verhuren van gebouwen als bedoeld
      in het eerste lid, of gedeelten daarvan, aan personen die daar op het tijdstip van indiening van dat verzoek
      huurder van zijn, ten aanzien van die toegelaten instelling tot het gebied van de volkshuisvesting behoort, indien
      die toegelaten instelling ten overstaan van hem aannemelijk maakt dat zij binnen vijf jaar na dat tijdstip die
      gebouwen:
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel49a
  - number: 49a.2.a
    text: |-
      zal slopen en ter plaatse gebouwen zal doen bouwen die verband houden met werkzaamheden op het gebied van de
      volkshuisvesting; of
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel49a
  - number: 49a.2.b
    text: zal verbouwen tot onroerende zaken die verband houden met werkzaamheden op het gebied van de volkshuisvesting.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel49a
  - number: '50.1'
    text: |-
      De toegelaten instelling kan met betrekking tot ten hoogste 10% van het bruto-vloeroppervlak van haar gebouwen,
      bedoeld in [artikel 49, eerste lid][ref1], overeenkomsten van huur en verhuur aangaan met anderen dan die, bedoeld
      in [artikel 48, zesde lid, van de wet][ref2]. Tot het bruto-vloeroppervlak, bedoeld in de eerste volzin, behoort
      mede het vloeroppervlak van de bij die gebouwen behorende overdekte parkeervoorzieningen en de oppervlakte van de
      bij die gebouwen behorende overige parkeervoorzieningen.


      [ref1]: https://wetten.overheid.nl/BWBR0036702#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel48
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0036702
        artikel: '49'
        hoofdstuk: V
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '48'
  - number: '50.2'
    text: |-
      De toegelaten instelling kan met betrekking tot ruimten van gebouwen die kantoorruimten van de toegelaten
      instelling zijn en waarvan meer dan 50% van het bruto-vloeroppervlak als zodanig door de toegelaten instelling
      wordt gebruikt, indien de toegelaten instelling dat gebouw op 1 juli 2015 in bezit had, overeenkomsten van huur en
      verhuur aangaan met anderen dan die, bedoeld in [artikel 48, zesde lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel48
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '48'
  - number: '50.3'
    text: |-
      [Artikel 45, vierde lid, onderdeel a, van de wet][ref1], is niet van toepassing op de ruimten, bedoeld in het
      vorige lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel45
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '45'
  - number: '51'
    text: 'Het bijdragen aan de leefbaarheid houdt uitsluitend in:'
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel51
  - number: 51.a
    text: |-
      woonmaatschappelijk werk, met inbegrip van het leveren van een bijdrage aan uitvoering van achter-de-voordeur-
      programma’s onder verantwoordelijkheid van maatschappelijke organisaties en uitsluitend ten behoeve van de huurders
      van de woongelegenheden van de toegelaten instelling;
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel51
  - number: 51.b
    text: |-
      aanleg en onderhoud van kleinschalige infrastructuur in de directe nabijheid van woongelegenheden of andere
      onroerende zaken van de toegelaten instelling;
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel51
  - number: 51.c
    text: 'bijdragen aan de uitvoering van plannen:'
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel51
  - number: 51.c.1°
    text: ter bevordering van een schone woonomgeving,
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel51
  - number: 51.c.2°
    text: ter voorkoming van overlast,
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel51
  - number: 51.c.3°
    text: ter bevordering van de veiligheid, en
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel51
  - number: 51.d
    text: bijdragen aan activiteiten gericht op ontmoeting van huurders van woongelegenheden van de toegelaten instelling.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel51
  - number: 52a
    text: |-
      Tot de werkzaamheden, bedoeld in de [artikelen 45, tweede lid, onderdeel i][ref1], en
      [47, eerste lid, onderdeel g, van de wet][ref2], behoren niet transacties die zijn gericht op het wijzigen van
      eigendomsverhoudingen en zakelijke rechten zonder dat er sprake is van feitelijke overdracht van bezit, behalve
      indien die transacties noodzakelijk zijn om werkzaamheden als bedoeld in de andere onderdelen van die artikelleden
      te kunnen verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel47
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel52a
