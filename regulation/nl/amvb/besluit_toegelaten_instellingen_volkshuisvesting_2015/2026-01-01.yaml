    text: |-
      Indien de toegelaten instelling woongelegenheden waarop het bepaalde bij en krachtens
      [artikel 46, tweede lid, van de wet][ref1] van toepassing is verhuurt aan of heeft ondergebracht in een
      rechtspersoon of vennootschap welke overeenkomsten van huur en verhuur ten aanzien van zodanige woongelegenheden
      aangaat met natuurlijke personen, of een rechtspersoon of vennootschap welke zodanige woongelegenheden
      verhuurt aan een rechtspersoon of vennootschap welke zodanige overeenkomsten aangaat, draagt zij er zorg voor
      dat die rechtspersoon of vennootschap met betrekking tot die woongelegenheden dat bepaalde naleeft, en is
      [artikel 56][ref2] van toepassing op de aan die rechtspersoon of vennootschap te verstrekken gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0036702#Artikel56
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel54
    references:
