      worden verricht op grond van een overeenkomst van opdracht betreffende lastgeving als bedoeld in
      [artikel 414, eerste lid, van Boek 7 van het Burgerlijk Wetboek][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel414
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel52d
