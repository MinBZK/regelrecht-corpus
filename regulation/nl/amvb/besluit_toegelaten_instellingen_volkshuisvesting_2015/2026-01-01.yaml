articles:
  - number: '1.1'
    text: |-
      Voor de toepassing van het bij of krachtens dit besluit bepaalde wordt verstaan
      onder: '- *Autoriteit Consument en Markt:* Autoriteit Consument en Markt, genoemd in'
      [artikel 2, eerste lid, van de Instellingswet Autoriteit Consument en Markt][ref1];
        - *basisrentelening:* lening met een vaste contractrente vermeerderd met een opslag die periodiek door de instantie
      die die lening verstrekt wordt herzien, welke voldoet aan de eisen voor het verstrekken van borging als opgenomen
      in de standaardleningovereenkomst van de borgingsvoorziening;
        - *beleggingen:* door toegelaten instellingen of dochtermaatschappijen uitgezette middelen die tijdelijk niet
      benodigd zijn om aan hun lopende financiële verplichtingen te voldoen, met uitzondering van collegiale leningen en
      financiële derivaten;
        - *bewonersorganisaties:* in het belang van huurders van woongelegenheden van toegelaten instellingen werkzame
      huurdersorganisaties en bewonerscommissies;
        - *blijvend gereguleerd daeb-complex:* complex waarvan ten minste 10% van de woongelegenheden blijvend gereguleerde
      daeb-woongelegenheden zijn;
        - *blijvend gereguleerde daeb-woongelegenheid:* daeb-woongelegenheid die een blijvend gereguleerde woongelegenheid
      is;
        - *blijvend gereguleerde woongelegenheid:* woongelegenheid met een huurprijs van ten hoogste het in
      [artikel 13, eerste lid, onderdeel a, van de Wet op de huurtoeslag][ref2] genoemde bedrag, waarvan de waardering
      van de kwaliteit, bedoeld in [artikel 5 van het Besluit huurprijzen woonruimte][ref3], niet kan leiden tot een
      huurprijs die hoger is dan dat bedrag;
        - *collegiale leningen:* door toegelaten instellingen aan andere toegelaten instellingen verstrekte leningen;
        - *complex:* een verzameling van meer dan één in elkaars nabijheid gelegen woongelegenheden welke financieel,
      administratief, bouwkundig of anderszins een eenheid vormen;
        - *daeb-tak:* administratief afzonderlijk ingericht deel van de toegelaten instelling, dat werkzaamheden verricht
      die behoren tot de diensten van algemeen economisch belang;
        - *daeb-woongelegenheid:* woongelegenheid als bedoeld in
      [artikel 47, eerste lid, aanhef en onderdeel b, c of d, van de wet][ref4];
        - *financiële derivaten:* a. financiële contracten waarvan de waarde is afgeleid van een onderliggende waarde of
      een referentieprijs, of b. onderdelen van financiële contracten die, op zichzelf beschouwd, financiële contracten
      als bedoeld in onderdeel a zijn;
        - *financiële onderneming:* onderneming die in een lidstaat het bedrijf van kredietinstelling mag uitoefenen,
      beleggingsdiensten mag verlenen, beleggingsinstellingen mag beheren, rechten van deelneming in een
      beleggingsmaatschappij mag aanbieden, of het bedrijf van verzekeraar mag uitoefenen;
        - *fuserende toegelaten instelling:* toegelaten instelling of instellingen die, al dan niet gezamenlijk met andere
      bij een fusie betrokken rechtspersonen of vennootschappen, een verzoek om goedkeuring van een door haar of hen
      voorgenomen fusie indient of indienen, of die indiening voorbereiden;
        - *fusie:* fusie als bedoeld in [artikel 309 van Boek 2 van het Burgerlijk Wetboek][ref5];
        - *geliberaliseerde woongelegenheid:* woongelegenheid die is verhuurd of laatstelijk was verhuurd tegen een
      huurprijs die hoger is dan het in [artikel 13, eerste lid, onderdeel a, van de Wet op de huurtoeslag][ref6]
      genoemde bedrag;
        - *gemengd complex:* complex waarvan zowel woongelegenheden deel uitmaken met betrekking tot welke de waardering
      van de kwaliteit, bedoeld in [artikel 5 van het Besluit huurprijzen woonruimte][ref7], kan leiden tot een huurprijs
      van ten hoogste het in [artikel 13, eerste lid, onderdeel a, van de Wet op de huurtoeslag][ref8] genoemde bedrag,
      als woongelegenheden deel uitmaken met betrekking tot welke die waardering kan leiden tot een huurprijs die hoger
      is dan dat bedrag;
        - *gemengd geliberaliseerd complex:* gemengd complex waarin met betrekking tot minder dan 10%
      van de daarvan deel uitmakende woongelegenheden de waardering van de kwaliteit, bedoeld in
      [artikel 5 van het Besluit huurprijzen woonruimte][ref9], kan leiden tot een huurprijs van ten hoogste het in
      [artikel 13, eerste lid, onderdeel a, van de Wet op de huurtoeslag][ref10] genoemde bedrag;
        - *getaxeerd:* na een taxatie overeenkomstig bij ministeriële regeling te geven voorschriften opgenomen in een
      taxatierapport dat is opgesteld door een onafhankelijke taxateur die is ingeschreven in een register dat tot doel
      heeft zijn deskundigheid te waarborgen, dan wel opgenomen in een document dat als ten minste even betrouwbaar kan
      worden beschouwd als een zodanig taxatierapport;
        - *hedging:* door het sluiten van payer swaps afdekken dan wel beperken van risico’s die gepaard gaan met een
      stijging van de rente op variabele leningen;
        - *herstructurering:* a. transformeren van onroerende zaken die verband houden met werkzaamheden die behoren
      tot de diensten van algemeen economisch belang in onroerende zaken die verband houden met werkzaamheden die niet
      behoren tot de diensten van algemeen economisch belang, door middel van: 1°. het slopen van onroerende zaken
      als eerstgenoemd in de aanhef en het ter plaatse van die sloop bouwen van onroerende zaken als laatstgenoemd in
      de aanhef, of 2°. het zodanig treffen van ingrijpende voorzieningen aan of het samenvoegen van onroerende zaken
      als eerstgenoemd in de aanhef, dat die zaken nadien onroerende zaken als laatstgenoemd in de aanhef zijn, of
      b. verwerven van onroerende zaken die verband houden met werkzaamheden die behoren tot de diensten van algemeen
      economisch belang teneinde die zaken te transformeren overeenkomstig onderdeel a, en vervolgens dat zodanig
      transformeren;
        - *intrinsieke waarde:* waarde van een aandeel in een rechtspersoon of vennootschap, verkregen door het saldo van
      activa en schulden van die rechtspersoon of vennootschap te delen door het aantal aandelen in die rechtspersoon
      of vennootschap;
        - *investering:* aangaan van een verplichting of achtereenvolgende samenhangende verplichtingen tot het doen bouwen
      of verwerven van onroerende of roerende zaken respectievelijk met elkaar samenhangende onroerende of roerende
      zaken, of het beschikbaar stellen van eigen of vreemd vermogen of verlenen van garanties aan of ten behoeve van een
      verbonden onderneming;
        - *lidstaat:* lidstaat van de Europese Unie, andere staat die partij is bij de Overeenkomst betreffende de Europese
      Economische Ruimte, en Zwitserland;
        - *liquiditeitsbuffer:* som van de liquide middelen van een toegelaten instelling, haar direct of vrijwel direct
      liquide te maken beleggingen en de direct opeisbare en met het oog op het bereiken van een voldoende omvang van die
      buffer aan te wenden leningsfaciliteiten;
        - *marktwaarde:* waarde waartegen een onroerende zaak in de gebruiksstaat waarin die zich bevindt, wordt
      overgedragen in een situatie waarin partijen volledig geïnformeerd, prudent en niet onder enigerlei dwang handelen;
        - *marktwaarde vrij van huur en gebruik:* prijs, die bij onderhandse verkoop bij aanbieding vrij van huur en
      gebruik en op de voor de onroerende zaak meest geschikte wijze, na de beste voorbereiding, door de meest biedende
      gegadigde zou zijn besteed;
        - *modelmatige marktwaarde:* waarde van een onroerende zaak in verhuurde staat, bepaald overeenkomstig het bepaalde
      bij en krachtens [artikel 31][ref11];
        - *niet-daeb-complex:* complex waarvan minder dan 10% van de woongelegenheden daeb-woongelegenheden zijn;
        - *niet-daeb-tak:* administratief afzonderlijk ingericht deel van de toegelaten instelling, dat werkzaamheden
      verricht die niet behoren tot de diensten van algemeen economisch belang;
        - *niet-daeb-woongelegenheid:* woongelegenheid die niet een daeb-woongelegenheid is;
        - *onrendabele top:* het verschil tussen de stichtingskosten, bestaande uit de bouwkosten en de aanschafkosten van
      de grond, en de marktwaarde van een project, indien de stichtingskosten hoger zijn dan de marktwaarde is;
        - *payer swap:* renteswap van de partij die een vaste rente betaalt en een variabele rente ontvangt;
        - *potentieel te liberaliseren daeb-complex:* complex waarvan minder dan 10% van de woongelegenheden blijvend
      gereguleerde daeb-woongelegenheden zijn en ten minste 10% van de woongelegenheden daeb-woongelegenheden zijn;
        - *potentieel te liberaliseren daeb-woongelegenheid:* daeb-woongelegenheid die een potentieel te liberaliseren
      woongelegenheid is;
        - *potentieel te liberaliseren woongelegenheid:* woongelegenheid met een huurprijs van ten hoogste het in
      [artikel 13, eerste lid, onderdeel a, van de Wet op de huurtoeslag][ref12] genoemde bedrag, waarvan de waardering
      van de kwaliteit, bedoeld in [artikel 5 van het Besluit huurprijzen woonruimte][ref13], kan leiden tot een
      huurprijs die hoger is dan dat bedrag;
        - *rating:* taxatie van de kredietwaardigheid van een financiële onderneming of een lidstaat;
        - *ratingbureau:* bureau dat een rating verstrekt;
        - *rentecap:* financieel derivaat tussen twee partijen bij of inzake een financiering, waarbij de koper tegen
      betaling van een geldsom gedurende een bij dat derivaat overeengekomen periode de garantie van een ten hoogste te
      betalen rentetarief verkrijgt;
        - *renteswap:* financieel derivaat tussen twee partijen om gedurende een bij dat derivaat overeengekomen periode
      kasstromen in de vorm van rentebetalingen uit te wisselen;
        - *saneringsplan:* plan als bedoeld in [artikel 29, tweede lid, tweede volzin, van de wet][ref14];
        - *splitsing:* splitsing als bedoeld in [artikel 334a van Boek 2 van het Burgerlijk Wetboek][ref15];
        - *variabele lening:* lening waarvan de rente elke 12 maanden of vaker wordt herzien;
        - *vervreemding van een woongelegenheid voor eigen gebruik:* vervreemding van een woongelegenheid aan een
      natuurlijke persoon, waarin die persoon of een bloed- of aanverwant in de eerste graad van die persoon zijn
      hoofdverblijf heeft of zal hebben;
        - *vervreemding van een woongelegenheid niet voor eigen gebruik:* vervreemding van een woongelegenheid aan een
      natuurlijke persoon, waarin die persoon of een bloed- of aanverwant in de eerste graad van die persoon niet zijn
      hoofdverblijf heeft of zal hebben;
        - *wet:* [Woningwet][ref16];
        - *WOZ-waarde:* aan een onroerende zaak overeenkomstig de [artikelen 17][ref17] en
      [18 van de Wet waardering onroerende zaken][ref18] toegekende waarde, vastgesteld overeenkomstig
      [artikel 22, eerste lid, van die wet][ref19].


