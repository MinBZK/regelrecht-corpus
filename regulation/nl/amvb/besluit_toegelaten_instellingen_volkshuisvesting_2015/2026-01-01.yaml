      [artikel 58, tweede lid, van de wet][ref1] verschuldigde bijdrage, of een deel daarvan, kwijtschelden,
      indien naar zijn oordeel de verzoekende toegelaten instelling na het uitbrengen van het advies, bedoeld in
      [artikel 56a, tweede lid, van de wet][ref2] of gedurende de periode, bedoeld in [artikel 111, vierde lid][ref3],
