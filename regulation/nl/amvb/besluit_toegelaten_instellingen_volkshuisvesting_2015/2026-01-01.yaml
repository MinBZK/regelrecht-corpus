      mogelijkheid tot herstel, onterecht niet is meegezonden.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel80
  - number: '80.4'
    text: |-
      [Artikel 79, tweede lid, onderdeel a][ref1], is van overeenkomstige toepassing op de woongelegenheden en gebouwen,
      bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0036702#Artikel79
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel80
    references:
