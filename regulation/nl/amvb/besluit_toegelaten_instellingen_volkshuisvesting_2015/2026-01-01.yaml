  - number: '32.2'
    text: |-
      Het volkshuisvestingsverslag omvat voorts een overzicht van de met de toegelaten instelling verbonden
      ondernemingen, met uitzondering van de ondernemingen van welke de toegelaten instelling minder dan 2% van het
      kapitaal inbrengt, en een uiteenzetting over hun werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel32
  - number: '33.1'
    text: |-
      Onze Minister beoordeelt bij de toepassing van de [artikelen 38, vierde lid][ref1], en
      [44a, derde lid, van de wet][ref2] in elk geval:


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel44a
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel33
