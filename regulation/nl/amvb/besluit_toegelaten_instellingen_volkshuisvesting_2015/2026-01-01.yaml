        bwb_id: BWBR0005181
        artikel: '48'
  - number: 60.1.a
    text: |-
      het gebied waarin de verzoekende toegelaten instelling of instellingen een lager percentage dan het op grond van
      [artikel 48, eerste lid, eerste volzin, van de wet][ref1] geldende percentage van toepassing willen laten zijn, en
      welk percentage dat zou moeten zijn;


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel48
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel60
    references:
