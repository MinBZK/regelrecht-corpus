  - number: '126.5'
    text: |-
      [Artikel 52, eerste lid][ref1], zoals dat luidde op 30 juni 2016, blijft van toepassing op werkzaamheden,
      als bedoeld in dat artikel waarmee voor die datum een aanvang is gemaakt, of met betrekking tot welke uit
      schriftelijke, uitsluitend op die werkzaamheden betrekking hebbende, stukken blijkt dat het maken van die aanvang
      voor die datum werd beoogd.


      [ref1]: https://wetten.overheid.nl/BWBR0036702#Artikel52
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel126
    references:
      - id: ref1
