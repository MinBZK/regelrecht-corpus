      - id: ref5
        bwb_id: BWBR0020078
        artikel: '57'
  - number: '126.4'
    text: |-
      Tot en met 31 december 2015 behoren tot de categorieën van personen, bedoeld in
      [artikel 48, eerste lid, derde volzin, van de wet][ref1], personen die worden gehuisvest op grond van een
      indicatiebesluit als bedoeld in [artikel 1 van het Zorgindicatiebesluit][ref2] zoals dat luidde op 31 december
      2014, voor persoonlijke verzorging als bedoeld in [artikel 4 van het Besluit zorgaanspraken AWBZ][ref3] zoals dat
      luidde op die datum, verpleging als bedoeld in [artikel 5 van dat besluit][ref4] zoals dat luidde op die datum,
      of individuele begeleiding als bedoeld in [artikel 6 van dat besluit][ref5] zoals dat luidde op die datum, in welk
      indicatiebesluit ten minste 10 uur zorg per week wordt toegekend, en welk indicatiebesluit een geldigheidsduur
      heeft van ten minste een jaar of, indien het is afgegeven in de periode van 28 juli 2014 tot en met 31 december
      2014, van ten minste zes maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0008946#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0014149#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0014149#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0014149#Artikel6
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel126
