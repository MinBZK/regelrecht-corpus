  - number: '118.3'
    text: |-
      De kwijtschelding betreft ten hoogste de verschuldigde bijdragen gedurende het jaar waarin het verzoek is ingediend
      en de vijf kalenderjaren die hier direct op volgen.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel118
  - number: '118.4'
    text: |-
      Indien Onze Minister een verzoek als bedoeld in het eerste of tweede lid inwilligt en de bijdrage in het jaar
      van het verzoek reeds door de toegelaten instelling voldaan is, betaalt hij een als gevolg daarvan ten onrechte
      betaald bedrag terug aan de toegelaten instelling, vermeerderd met de wettelijke rente van niet-handelstransacties
      vanaf het tijdstip van betaling van de bijdrage tot het tijdstip van terugbetaling van de onverschuldigd betaalde
      bijdrage.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel118
  - number: '119'
    text: |-
