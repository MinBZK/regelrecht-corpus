  - number: '61.1'
    text: 'De compensatie in enig boekjaar bedraagt:'
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel61
  - number: 61.1.a
    text: |-
      het in dat jaar door de toegelaten instelling genoten voordeel uit het aantrekken van leningen met gebruikmaking
      van de borgingsvoorziening, of van borgstelling daarvan door overheden, welk voordeel wordt bepaald op 0,7% van de
      zodanige leningen die de toegelaten instelling op 31 december van dat jaar in portefeuille had;
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel61
  - number: 61.1.b
    text: |-
      de in dat jaar aan de toegelaten instelling toegekende subsidies als bedoeld in
      [artikel 57, eerste lid, onderdeel a, van de wet][ref1]. De toegekende subsidies worden evenredig toegerekend aan
      het lopende kalenderjaar en de negen daaropvolgende jaren;


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel57
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '57'
  - number: 61.1.c
    text: |-
      de in dat jaar door de toegelaten instelling ontvangen subsidies als bedoeld in
      [artikel 57, eerste lid, onderdeel b, van de wet][ref1], voor zover deze subsidies hoger zijn dan de onrendabele
      top van de werkzaamheden waarvoor de subsidies zijn verleend; en


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel57
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '57'
  - number: 61.1.d
    text: |-
      het in dat jaar door de toegelaten instelling genoten voordeel uit het verwerven van grond ten behoeve van het
      verrichten van werkzaamheden die behoren tot de diensten van algemeen economisch belang tegen een prijs die ligt
      beneden de marktwaarde van die grond op het tijdstip van die verwerving.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel61
  - number: '61.2'
    text: |-
      Onze Minister berekent de overcompensatie in enig boekjaar overeenkomstig de formule: dnr-daeb-gesch +
      tc -/- rn X mw-daeb, met dien verstande dat de overcompensatie niet hoger is dan de overeenkomstig het
      eerste lid berekende compensatie en niet hoger is dan dnr-daeb, in welke formule voorstelt: - dnr-daeb-
      gesch: het directe netto resultaat uit exploitatie in het betrokken boekjaar van de onroerende zaken in
      eigendom van de toegelaten instelling, die verband houden met haar werkzaamheden die behoren tot de diensten
      van algemeen economisch belang, voor de afdracht van de verschuldigde vennootschapsbelasting, bedoeld in
      [artikel 1 van de Wet op de vennootschapsbelasting 1969][ref1] en geschoond voor rentelasten, rentebaten,
      schenkingen en baten en lasten uit deelnemingen, beleggingen en liquiditeiten en andere baten en lasten uit
      overhead;
        - tc: de in het betreffende boekjaar verkregen compensatie, berekend overeenkomstig het eerste lid;
        - mw-daeb: de waarde op 31 december van het betrokken boekjaar van de onroerende zaken in eigendom van de
      toegelaten instelling, die verband houden met haar werkzaamheden die behoren tot de diensten van algemeen
      economisch belang;
        - rn: de rendementsnorm genoemd in het derde of vierde lid;
        - dnr-daeb: het directe netto resultaat uit exploitatie in het betrokken boekjaar van de onroerende zaken in
      eigendom van de toegelaten instelling, die verband houden met haar werkzaamheden die behoren tot de diensten van
      algemeen economisch belang.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel1
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '1'
  - number: '61.3'
    text: De rendementsnorm voor de boekjaren 2024 tot en met 2029 bedraagt 0,0369.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel61
  - number: '61.4'
    text: 'In afwijking van het derde lid bedraagt de rendementsnorm:'
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel61
  - number: 61.4.a
    text: |-
      0,057 voor toegelaten instellingen als bedoeld in [artikel 41c, tweede lid, van de wet][ref1], die zich
      bij hun werkzaamheden in het bijzonder richten op de huisvesting van categorieën van personen, bedoeld in
      [artikel 36, onderdeel b][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel41c
      [ref2]: https://wetten.overheid.nl/BWBR0036702#Artikel36
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 41c
      - id: ref2
        bwb_id: BWBR0036702
        artikel: '36'
        hoofdstuk: V
        paragraaf: '1'
        afdeling: '1'
  - number: 61.4.b
    text: |-
      0,0455 voor toegelaten instellingen waarvan minimaal 50% van hun woongelegenheden is gelegen in de bij ministeriële
      regeling vastgestelde gebieden.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel61
  - number: '61.5'
    text: |-
      Met ingang van het boekjaar 2024 worden de rendementsnormen, genoemd in het derde en vierde lid, telkens voor een
      periode van 5 jaren opnieuw vastgesteld.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel61
  - number: '61.6'
    text: |-
      Indien een saneringsplan de eigen toegelaten instelling betreft toetst Onze Minister in het geval van een positieve
      uitkomst van de formule, bedoeld in het tweede lid, of die positieve uitkomst in overeenstemming is met de
      uitgangspunten van het saneringsplan. Voor zover de toets uitwijst dat dat het geval is wordt die uitkomst niet
      beschouwd als overcompensatie.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel61
  - number: '61.7'
    text: |-
      De in enig boekjaar af te dragen overcompensatie bedraagt het gemiddelde van de op grond van het tweede lid
      berekende overcompensatie in dat boekjaar en de twee direct daaraan voorafgaande boekjaren, waarbij de af te dragen
      overcompensatie op nihil wordt vastgesteld indien de berekening leidt tot een negatieve uitkomst.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel61
  - number: '61.8'
    text: |-
      Onze Minister stelt de af te dragen overcompensatie, bedoeld in het zevende, vast en vordert de af te dragen
      overcompensatie terstond terug nadat deze is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel61
  - number: '62.1'
    text: 'Indien:'
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel62
