  - number: '63.1'
    text: |-
      Onze Minister kan in een geval als bedoeld in [artikel 62, eerste lid, onderdeel a, b of c][ref1],
      uitsluitend terstond nadat hij heeft vastgesteld dat een zodanig geval zich heeft
      voorgedaan, bepalen dat een toegelaten instelling, zolang zij niet voldoet aan
      [artikel 48, eerste lid, eerste volzin, van de wet][ref2], geen compensatie toekomt in de vorm, bedoeld
      in [artikel 1, eerste lid, begripsomschrijving van compensatie, onderdeel a of c, van de wet][ref3], voor
      werkzaamheden met betrekking tot welke na zijn besluit uit schriftelijke, uitsluitend op die werkzaamheden
      betrekking hebbende, stukken komt te blijken dat wordt beoogd daarmee een aanvang te maken. Bij de toepassing van
      de eerste volzin wordt, indien van toepassing, het overeenkomstig [artikel 60][ref4] vastgestelde percentage in
      aanmerking genomen. [Artikel 62, tweede lid][ref5], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0036702#Artikel62
