    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel52b
  - number: 52b.b.2°
    text: |-
      toegelaten instellingen of een of meer van hun dochtermaatschappijen alleen of samen meer dan de helft van de
