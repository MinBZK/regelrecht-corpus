  - number: 52b.b.3°
    text: zij ook diensten ten behoeve van de bedrijfsvoering of administratie van die andere toegelaten instelling verleent.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel52b
  - number: 52c
    text: |-
      De diensten, bedoeld in [artikel 45, tweede lid, onderdeel k, van de wet][ref1], worden door een toegelaten
      instelling of een met een toegelaten instelling verbonden onderneming uitsluitend verleend aan een in dat onderdeel
      bedoelde huurdersorganisatie of bewonerscommissie:


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel45
