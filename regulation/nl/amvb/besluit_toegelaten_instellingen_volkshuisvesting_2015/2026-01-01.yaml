  - number: '121.3'
    text: |-
      Onze Minister stelt per toegelaten instelling de bijdrage, bedoeld in het eerste lid, vast en maakt deze uiterlijk
      op 1 oktober van het jaar waarover deze verschuldigd is bekend aan de toegelaten instellingen.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel121
  - number: '121.4'
    text: |-
      Onze Minister kan een verrekening toepassen op de, op grond van het tweede lid vastgestelde bijdrage, indien
      de totale kosten van het toezicht in het voorafgaande jaar meer of minder bedragen dan de voor dat jaar begrote
      kosten. De totale som waarmee de gezamenlijke bijdragen voor de toegelaten instellingen wordt verhoogd of verlaagd
      is in dat geval gelijk aan het verschil tussen de daadwerkelijke en begrote kosten van het toezicht voor het
      voorafgaande jaar.
    url: https://wetten.overheid.nl/BWBR0036702/2026-01-01#Artikel121
  - number: '121.5'
    text: |-
