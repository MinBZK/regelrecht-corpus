  - number: '111'
    text: |-
      1 De aanvraag om een subsidie als bedoeld in [artikel 57, eerste lid, aanhef en onderdeel a, van de wet][ref1],
      door de toegelaten instelling die niet beschikt over de financiële middelen om haar werkzaamheden te kunnen
      voortzetten, gaat in elk geval vergezeld van:

      a. een analyse van de oorzaken die hebben geleid tot de situatie dat de toegelaten instelling niet beschikt over de
      financiële middelen om haar werkzaamheden te kunnen voortzetten;

      b. een overzicht en een analyse van de financiële situatie van de toegelaten instelling op het tijdstip van
      indiening van die aanvraag, waaronder in elk geval haar balans, haar liquiditeits- en solvabiliteitspositie, een
      aan die posities gerelateerde en naar baten en lasten gespecificeerde meerjarenanalyse van de door haar verwachte
      kasstromen, en een analyse van haar leningportefeuille;

      c. meerjarenanalyses ten aanzien van in elk geval:

      1°. mogelijke besparingen op de kosten van de bedrijfsvoering van de toegelaten instelling en de naar haar oordeel
      noodzakelijke kosten van de instandhouding van en het treffen van voorzieningen aan haar onroerende zaken;

      2°. de verhuurbaarheid van haar onroerende zaken en mogelijke optimalisatie van haar huuropbrengsten, gelet op de
      vraag naar en het aanbod van woongelegenheden in de gemeenten waar zij feitelijk werkzaam is;

      3°. de mogelijkheden voor het vervreemden van haar onroerende zaken en

      4°. de mogelijkheden om haar werkzaamheden die behoren tot de diensten van algemeen economisch belang door andere
      toegelaten instellingen te laten voortzetten;

      d. het laatstelijk opgestelde overzicht, bedoeld in [artikel 44a, eerste lid, onderdeel a, van de wet][ref2];

      e. het saneringsplan dat Onze Minister heeft goedgekeurd en waarover de toegelaten instelling overleg heeft gevoerd
      met de gemeenten waar zij feitelijk werkzaam is en met de borgingsvoorziening en

      f. de uitkomsten van het overleg, bedoeld in onderdeel e.

      2 Indien uit de analyse, bedoeld in het eerste lid, onderdeel a, naar het oordeel van Onze Minister blijkt dat
      de daarin genoemde oorzaken geheel of ten dele voortvloeien uit de werkzaamheden van de toegelaten instelling die
      niet behoren tot de diensten van algemeen economisch belang, neemt de toegelaten instelling in het saneringsplan
      mogelijke maatregelen op om die werkzaamheden zo spoedig mogelijk te beëindigen of door andere rechtspersonen of
      vennootschappen te laten voortzetten.

      3 Het saneringsplan bestrijkt een daarin op te nemen periode van ten hoogste 10 jaar. De stukken, bedoeld in het
      eerste lid, onderdelen b en c, bestrijken de periode die het saneringsplan bestrijkt.

      4 Het doel van het saneringsplan is in elk geval dat een toegelaten instelling, na de periode die het saneringsplan
      bestrijkt, de financiële middelen kan aantrekken om de betrokken werkzaamheden die behoren tot de diensten van
      algemeen economisch belang te kunnen verrichten of voortzetten.

      5 Het saneringsplan omvat in elk geval:

      a. een overzicht van de maatregelen die de toegelaten instelling, al dan niet in samenwerking met andere personen
      of instanties, neemt of zal nemen in relatie tot de meerjarenanalyses, bedoeld in het eerste lid, onderdeel c;

      b. een overzicht van de maatregelen die de toegelaten instelling neemt of zal nemen om te voldoen aan het
      reglement, bedoeld in [artikel 55a, tweede lid, van de wet][ref3];

      c. de uitkomsten van overleg met personen en instanties die betrokken zijn bij de financiering of de werkzaamheden
      van de toegelaten instelling over het door hen financieel bijdragen aan de uitvoering van het saneringsplan en

      d. een raming, in relatie tot de meerjarenanalyse, bedoeld in het eerste lid, onderdeel b, van de benodigde
      subsidie als bedoeld in [artikel 57, eerste lid, aanhef en onderdeel a, van de wet][ref4], alsmede de gewenste vorm
      van die subsidie en het gewenste tijdstip of de gewenste tijdstippen van uitbetaling van die subsidie.

      6 Indien op grond van het saneringsplan uitsluitend een of meerdere andere toegelaten instellingen dan de
      toegelaten instelling, bedoeld in het eerste lid, een subsidie als bedoeld in dat lid zullen aanvragen, dan zendt
      de laatstbedoelde toegelaten instelling zo spoedig mogelijk na de goedkeuring van het saneringsplan de stukken,
      bedoeld in dat lid, aan Onze Minister ten behoeve van de behandeling van de aanvragen van een of meerdere van
      die andere toegelaten instellingen, met dien verstande dat het tijdstip, bedoeld in onderdeel b van dat lid, het
      tijdstip van verzending van die stukken betreft.

      7 Bij ministeriële regeling kunnen voorschriften worden gegeven omtrent de inrichting van de stukken, bedoeld in
      het eerste lid.


