  - number: '97'
    text: |-
      Op verzoek van Onze Minister verstrekt de fuserende toegelaten instelling hem nadere inlichtingen over de
      voorgenomen fusie, voor zover dat naar zijn oordeel voor de beoordeling van het verzoek om goedkeuring daarvan
      noodzakelijk is. Bij ministeriële regeling kunnen voorschriften worden gegeven omtrent de inlichtingen die de
      toegelaten instelling dient te verstrekken.
    url: https://wetten.overheid.nl/BWBR0036702/2022-01-01#Artikel97
  - number: '98'
    text: |-
      1 Onze Minister keurt de voorgenomen fusie niet goed, indien naar zijn oordeel de lokale binding van de
      verkrijgende toegelaten instelling niet voldoende gewaarborgd zal zijn.

      2 Het percentage, bedoeld in [artikel 53, vierde lid, onderdeel d, van de wet][ref1], is 70.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel53
    url: https://wetten.overheid.nl/BWBR0036702/2022-01-01#Artikel98
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '53'
  - number: '99'
    text: |-
      De verkrijgende toegelaten instelling doet onverwijld een gewaarmerkt afschrift van de notariële akte waarbij
      de fusie is geschied en, indien de fusie gepaard is gegaan met een wijziging van de statuten van de fuserende
      toegelaten instelling, van de notariële akte waarin die wijziging is vervat, aan Onze Minister toekomen.
    url: https://wetten.overheid.nl/BWBR0036702/2022-01-01#Artikel99
  - number: '100'
    text: |-
      1 Onze Minister keurt de voorgenomen splitsing niet goed, indien deze niet leidt tot een zich verbinden als bedoeld
      in [artikel 21 van de wet][ref1].

      2 Op voorgenomen splitsingen die geen juridische scheiding zijn, is het bepaalde bij en krachtens
      [afdeling 7][ref2] van overeenkomstige toepassing:

      a. met uitzondering van de [artikelen 95, eerste lid, onderdeel c][ref3], [96, eerste lid, onderdeel b][ref4],
      en [98][ref5];

      b. voorts met uitzondering van de bepalingen van [afdeling 7][ref6] in het onderwerp waarvan wordt voorzien door
      het bepaalde bij en krachtens [artikel 21, eerste tot en vierde lid, van de wet][ref7] en

      c. met dien verstande dat onder de instanties, bedoeld in [artikel 92, tweede lid][ref8], niet de Autoriteit
      Consument en Markt wordt begrepen.


