  - number: 52e
    text: |-
      1 In afwijking van [artikel 52d][ref1] zijn de werkzaamheden, bedoeld in
      [artikel 45, zevende lid, van de wet][ref2], voor zover deze worden verricht vanuit de niet-daeb-tak of door de met
      de toegelaten instelling verbonden onderneming of samenwerkingsvennootschap, slechts toegestaan indien:

      a. zij worden verricht in gebieden waar woongelegenheden in eigendom van de toegelaten instelling gelegen zijn, en
      voor zover de gebouwen, bedoeld in [artikel 45, tweede lid, onderdelen d en g, van de wet][ref3], een op een wijk,
      buurt of buurtschap in een zodanig gebied gerichte functie hebben; en

      b. die werkzaamheden bijdragen aan het verrichten van andere werkzaamheden van de toegelaten instelling op het
      gebied van de volkshuisvesting.

      2 Bij ministeriële regeling kunnen nadere voorschriften worden gegeven omtrent de toepassing van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0036702#Artikel52d
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel45
