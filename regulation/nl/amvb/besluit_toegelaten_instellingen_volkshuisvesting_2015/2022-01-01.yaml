    text: |-
      1 De toegelaten instelling brengt, onverminderd [artikel 50, tweede lid, onderdeel e, van de wet][ref1], in de
      niet-daeb-tak onder:

      a. haar bestaande en geprojecteerde onroerende zaken die zij niet ingevolge
      [artikel 66, eerste lid, onderdelen a tot en met e][ref2], of het bepaalde krachtens artikel 66, tweede lid, in de
      daeb-tak onderbrengt;

      b. de andere door haar aangetrokken leningen dan die, bedoeld in [artikel 66, eerste lid, onderdeel f][ref3], niet
      zijnde vlottende schuld;

      c. haar financieel waardeerbare rechten en verplichtingen uit hoofde van bedingen die betrekking hebben op een
      opvolgende vervreemding door de verkrijger van een woongelegenheid van de toegelaten instelling, indien die
      woongelegenheid op het tijdstip dat deze laatstelijk door de toegelaten instelling werd verhuurd, niet was aan te
      merken als een woongelegenheid als bedoeld in onderdeel a of c, en is vervreemd aan een natuurlijke persoon;

      d. de met haar verbonden ondernemingen, alsmede haar financieel waardeerbare rechten en verplichtingen jegens die
      ondernemingen, en

      e. haar baten en lasten, naar de mate waarin zij betrekking hebben op activa of passiva als bedoeld in de
      onderdelen a, b en c, of, voor zover die baten en lasten niet aldus aan activa of passiva kunnen worden
      gerelateerd, jaarlijks het deel van die baten en lasten dat verhoudingsgewijs gelijk is aan het aandeel van de
      onroerende zaken, bedoeld in onderdeel a, in het totaal van haar onroerende zaken, welk aandeel en totaal blijken
      uit haar laatstelijk vastgestelde balans.

      2 Bij ministeriële regeling kunnen nadere voorschriften worden gegeven omtrent hetgeen de toegelaten instelling in
      de niet-daeb-tak onderbrengt of kan onderbrengen.


