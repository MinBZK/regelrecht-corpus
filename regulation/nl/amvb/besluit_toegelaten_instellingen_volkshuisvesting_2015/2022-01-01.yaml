  - number: '39'
    text: |-
      1 De toegelaten instelling betrekt bij het vaststellen van het overzicht, bedoeld in
      [artikel 43, eerste lid, van de wet][ref1], de door Onze Minister vast te stellen rijksprioriteiten met betrekking
      tot het terrein van de volkshuisvesting. Onze Minister stelt die prioriteiten ten minste een maal per vier jaar
      vast voor een tijdvak van de vier op dat jaar volgende kalenderjaren en doet deze voor de aanvang van dat tijdvak
      toekomen aan beide kamers der Staten-Generaal. In het kalenderjaar dat direct voorafgaat aan een zodanig tijdvak
      voert hij overleg over de voor dat tijdvak voorgenomen prioriteiten met in elk geval personen of instanties uit de
      kring van de toegelaten instellingen, de gemeenten en de bewonersorganisaties.

      2 Indien de colleges van burgemeester en wethouders van de gemeenten waar de toegelaten instelling feitelijk
      werkzaam is geen woonvisie aan de toegelaten instelling hebben verstrekt, neemt de toegelaten instelling in het
      overzicht, bedoeld in [artikel 43, eerste lid, van de wet][ref2], in elk geval op:

      a. haar voornemens voor het doen bouwen of verwerven van woongelegenheden als bedoeld in
      [artikel 47, eerste lid, onderdeel b, van de wet][ref3];

      b. haar voornemens met betrekking tot het toepassing geven aan
      [artikel 45, tweede lid, onderdelen d en f, van de wet][ref4];

      c. haar voornemens met betrekking tot de samenstelling van haar woningvoorraad, waaronder in elk geval haar
      voornemens met betrekking tot vervreemding van haar woongelegenheden en haar voornemens tot het bij het aangaan van
      nieuwe overeenkomsten van huur en verhuur zodanig verhogen van huurprijzen van haar woongelegenheden, dat zij komen
      te liggen boven het in [artikel 13, eerste lid, onderdeel a, van de Wet op de huurtoeslag][ref5] genoemde bedrag;

      d. haar voornemens met betrekking tot de kwaliteit en de duurzaamheid van haar woningvoorraad en de direct daaraan
      grenzende omgeving;

      e. haar voornemens met betrekking tot de betaalbaarheid en de bereikbaarheid van haar woongelegenheden voor
      degenen, bedoeld in [artikel 46, eerste lid, onderdeel a, van de wet][ref6]; en

      f. haar voornemens met betrekking tot de huisvesting van de categorieën van personen, genoemd in
      [artikel 36][ref7].

      3 Het overzicht, bedoeld in [artikel 43, eerste lid, van de wet][ref8], heeft geen betrekking op de met de
      toegelaten instelling verbonden ondernemingen van welke zij minder dan 2% van het kapitaal inbrengt.


