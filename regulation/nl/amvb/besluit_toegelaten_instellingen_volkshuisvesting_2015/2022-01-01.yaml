  - number: '21'
    text: |-
      1 De goedkeuring, bedoeld in [artikel 26, eerste lid, aanhef en onderdeel c, van de wet][ref1], is niet vereist in
      geval van investeringen ten behoeve van het in stand houden van of treffen van voorzieningen aan onroerende zaken
      in eigendom van de toegelaten instelling, tenzij de statuten bepalen dat die goedkeuring in dat geval wel vereist
      is.

      2 De goedkeuring, bedoeld in [artikel 26, eerste lid, aanhef en onderdeel i, van de wet][ref2], is niet vereist,
      indien:

      a. met het betrokken besluit van het bestuur een bedrag van minder dan € 10.000.000 gemoeid is;

      b. de betrokken besluiten van het bestuur transacties als bedoeld in dat onderdeel betreffen met betrekking tot
      woongelegenheden van welke de beoogde verkrijger een natuurlijke persoon is en waarin die persoon of een bloed- of
      aanverwant in de eerste graad van die persoon zijn hoofdverblijf heeft of zal hebben, tenzij de statuten bepalen
      dat die goedkeuring in die gevallen wel vereist is.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel26
