  - number: '60'
    text: |-
      1 Het verzoek, bedoeld in [artikel 48, vijfde lid, eerste volzin, van de wet][ref1], omvat in elk geval:

      a. het gebied waarin de verzoekende toegelaten instelling of instellingen een lager percentage dan het op grond van
      [artikel 48, eerste lid, eerste volzin, van de wet][ref2] geldende percentage van toepassing willen laten zijn, en
      welk percentage dat zou moeten zijn;

      b. het gebied waarin de in het verzoek te noemen andere toegelaten instelling of instellingen een hoger percentage
      dan het op grond van [artikel 48, eerste lid, eerste volzin, van de wet][ref3] geldende percentage van toepassing
      willen laten zijn, en welk percentage dat zou moeten zijn;

      c. voor hoeveel jaren dat lagere en hogere percentage van toepassing zouden moeten zijn, welk aantal jaren ten
      hoogste 4 is, en

      d. de wijze waarop gedurende die jaren wordt bewerkstelligd dat na die jaren zal worden voldaan aan
      [artikel 48, eerste lid, eerste volzin, van de wet][ref4].

      2 Voordat Onze Minister op het verzoek beslist, stelt hij de gemeenten die gelegen zijn in de gebieden, bedoeld
      in het eerste lid, onderdelen a en b, en waar een of meer van de bij het verzoek betrokken toegelaten instellingen
      feitelijk werkzaam zijn, in de gelegenheid hun zienswijzen daarop aan hem kenbaar te maken. Die gemeenten kunnen
      die zienswijzen binnen vier weken aan hem doen toekomen.

      3 Onze Minister bepaalt voor elke toegelaten instelling afzonderlijk het lagere percentage, bedoeld in
      [artikel 48, vijfde lid, eerste volzin, van de wet][ref5], en het hogere percentage, bedoeld in de derde volzin van
      dat lid, met gebruikmaking van de formule:

      in welke formule voorstelt:

        - *wgl/geb (woongelegenheden gebieden):* het aantal woongelegenheden, bedoeld in
      [artikel 47, eerste lid, onderdelen b en c, van de wet][ref6], van de betrokken toegelaten instelling volgens de
      gegevens, opgenomen in het overzicht, bedoeld in [artikel 36a, vierde lid, van de wet][ref7], dat gelegen is in het
      gebied, bedoeld in het eerste lid, onderdeel a respectievelijk b, van dit artikel;
        - *perc/geb (percentage gebieden):* het lagere of hogere percentage, bedoeld in het eerste lid, onderdeel a
      respectievelijk b;
        - *wgl/ov (woongelegenheden overig):* het aantal woongelegenheden, bedoeld in
      [artikel 47, eerste lid, onderdelen b en c, van de wet][ref8], van de betrokken toegelaten instelling volgens de
      gegevens, opgenomen in het overzicht, bedoeld in [artikel 36a, vierde lid, van de wet][ref9], dat niet gelegen is
      in het gebied, bedoeld in het eerste lid, onderdeel a respectievelijk b, van dit artikel;
        - *wgl/tot (woongelegenheden totaal):* het totale aantal woongelegenheden, bedoeld in
      [artikel 47, eerste lid, onderdelen b en c, van de wet][ref10], van de betrokken toegelaten instelling volgens de
      gegevens, opgenomen in het overzicht, bedoeld in [artikel 36a, vierde lid, van de wet][ref11].


