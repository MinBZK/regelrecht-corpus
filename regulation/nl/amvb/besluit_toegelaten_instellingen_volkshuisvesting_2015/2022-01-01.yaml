  - number: '64'
    text: |-
      1 De toegelaten instellingen op welke [artikel 49, eerste lid, eerste volzin, van de wet][ref1] ingevolge de
      tweede volzin van dat lid niet van toepassing is, delen door middel van het opstellen van een kostenverdeelstaat
      jaarlijks hun baten en lasten toe aan werkzaamheden die behoren respectievelijk niet behoren tot de diensten van
      algemeen economisch belang. Daarbij maken zij inzichtelijk dat de compensatie uitsluitend ten goede is gekomen aan
      werkzaamheden die behoren tot de diensten van algemeen economisch belang.

      2 Op toegelaten instellingen als bedoeld in het eerste lid zijn de
      [artikelen 13a, tweede, derde en vierde lid][ref2], [66][ref3], [67][ref4], [69, vierde lid][ref5],
      [70 tot en met 78][ref6], [79, tweede lid][ref7], en [80, vierde lid][ref8], niet van toepassing.

      3 Op toegelaten instellingen als bedoeld in het eerste lid is
      [artikel 69, eerste tot en met derde en vijfde lid][ref9], van overeenkomstige toepassing, met dien verstande dat:

      a. in de aanhef van het eerste lid voor «ten laste van de daeb-tak brengen» wordt gelezen «in de
      kostenverdeelstaat, bedoeld in [artikel 64, eerste lid][ref10], onder de werkzaamheden die behoren tot de diensten
      van algemeen economisch belang rangschikken»;

      b. in het tweede lid:

      1°. voor «ten laste van de daeb-tak worden gebracht» wordt gelezen «in de kostenverdeelstaat, bedoeld in
      [artikel 64, eerste lid][ref11], onder de werkzaamheden die behoren tot de diensten van algemeen economisch belang
      worden gerangschikt» en

      2°. voor «ten laste van die tak worden gebracht» wordt gelezen «zodanig worden gerangschikt» en

      c. in het vijfde lid voor «tweede, derde en vierde lid» wordt gelezen: tweede en derde lid.

      4 Op toegelaten instellingen als bedoeld in het eerste lid is
      [artikel 80, eerste, tweede, derde en vijfde lid][ref12], van overeenkomstige toepassing, met dien verstande dat
      in het tweede lid, onderdeel a, voor «administratief naar de niet-daeb-tak over te brengen» wordt gelezen: in de
      kostenverdeelstaat, bedoeld in [artikel 64, eerste lid][ref13], te rangschikken onder de werkzaamheden die niet
      behoren tot de diensten van algemeen economisch belang.

      5 Bij ministeriële regeling kunnen nadere voorschriften worden gegeven omtrent de toepassing van het eerste lid.


