    text: |-
      Onze Minister willigt een verzoek als bedoeld in [artikel 21, vijfde lid, van de wet][ref1] uitsluitend in, indien
      de betrokken samenwerkingsvennootschap uitsluitend is opgericht:

      a. met het oogmerk om mogelijk te maken dat de daarin samenwerkende toegelaten instellingen bijdragen aan elkaars
      werkzaamheden met het oog op het voldoen aan [artikel 42, eerste lid, eerste volzin, van de wet][ref2] of

      b. met het oogmerk dat het in stand houden van of het treffen van voorzieningen aan woongelegenheden van een
      toegelaten instelling, die zijn gelegen in een gemeente of regio als bedoeld in [artikel 41b van de wet][ref3] waar
      die toegelaten instelling niet feitelijk werkzaam is, geschiedt door een toegelaten instelling die in die gemeente
      of regio feitelijk werkzaam is.


