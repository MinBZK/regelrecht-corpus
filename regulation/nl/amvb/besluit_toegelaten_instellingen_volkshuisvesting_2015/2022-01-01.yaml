  - number: '79'
    text: |-
      1 Indien de toegelaten instelling met betrekking tot een woongelegenheid een overeenkomst van huur
      en verhuur aangaat met een opvolgende huurder, waarbij de huurprijs hoger wordt of, in geval van een
      woongelegenheid als bedoeld in [artikel 47, eerste lid, onderdeel c, van de wet][ref1], hoger blijft dan het
      in [artikel 13, eerste lid, onderdeel a, van de Wet op de huurtoeslag][ref2] genoemde bedrag, behoren vanaf het
      tijdstip waarop die overeenkomst ingaat de werkzaamheden met betrekking tot die woongelegenheid niet meer tot de
      diensten van algemeen economisch belang.

      2 In een geval als bedoeld in het eerste lid brengt de toegelaten instelling in haar niet-daeb-tak onder:

      a. de betrokken woongelegenheden, tegen hun modelmatige marktwaarde, onder een gelijktijdige verrekening tussen
      haar niet-daeb-tak en haar daeb-tak waarmee een geldbedrag gemoeid is dat hetzij gelijk is aan die modelmatige
      marktwaarde, hetzij lager is dan die modelmatige marktwaarde, in welk geval zij voorts tegelijkertijd ten laste van
      de voorziening, bedoeld in [artikel 13a, tweede lid][ref3], een interne lening verstrekt welke aan de niet-daeb-
      tak ten goede komt, ter hoogte van het verschil tussen het verrekende bedrag en die modelmatige marktwaarde, welke
      lening een rentepercentage heeft dat gelijk is aan de op het tijdstip van verstrekking daarvan geldende rente op
      tienjarige staatsleningen, vermeerderd met een bij ministeriële regeling te bepalen percentage, en wordt afgelost
      onder overeenkomstige toepassing van [artikel 10, tweede lid, onderdeel b, en derde lid][ref4], en

      b. de aan die woongelegenheden toe te rekenen gedeelten van de verplichtingen, baten en lasten, bedoeld in
      [artikel 66, eerste lid, onderdelen f, h en i][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0008659#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0036702#Artikel13a
