        artikel: 55a
  - number: '107'
    text: |-
      1 Het reglement, bedoeld in [artikel 55a, tweede lid, van de wet][ref1], bepaalt voorts dat de toegelaten
      instelling, de dochtermaatschappij en de verbonden onderneming waarvan de toegelaten instelling meer dan de helft
      van de bestuurders kan benoemen of ontslaan:

      a. geen andere financiële derivaten als bedoeld in [artikel 1, eerste lid][ref2], begripsomschrijving van
      financiële derivaten, onderdeel a, aantrekt dan rentecaps of payer swaps ter hedging van variabele leningen die
      voor of tegelijk met het tijdstip van aantrekken van dat derivaat zijn aangetrokken, welke payer swaps geen langere
      looptijd hebben dan 10 kalenderjaren, waarvan het kalenderjaar waarin zij worden aangetrokken het eerste is, en

      b. geen andere financiële derivaten als bedoeld in [artikel 1, eerste lid][ref3], begripsomschrijving van
      financiële derivaten, onderdeel b, aantrekt dan basisrenteleningen, indien dat geschiedt in het kader van een plan
      van aanpak als bedoeld in [artikel 106, tweede lid][ref4].

      2 Het reglement bepaalt voorts dat de toegelaten instelling, de dochtermaatschappij en de verbonden onderneming
      waarvan de toegelaten instelling meer dan de helft van de bestuurders kan benoemen of ontslaan:

      a. uitsluitend financiële derivaten aantrekt, indien de instelling van welke zij die
      derivaten aantrekt haar heeft aangemerkt als een niet-professionele belegger als bedoeld in
      [artikel 4:18d van de Wet op het financieel toezicht;][ref5]

      b. uitsluitend financiële derivaten aantrekt, nadat zij met de instelling van welke zij die derivaten aantrekt een
      raamovereenkomst, overeenkomstig een bij ministeriële regeling vast te stellen model daarvoor, heeft gesloten;

      c. uitsluitend financiële derivaten als bedoeld in [artikel 1, eerste lid][ref6], begripsomschrijving van
      financiële derivaten, onderdeel a, aantrekt onder het sluiten van een modelovereenkomst, overeenkomstig een bij
      ministeriële regeling vast te stellen model daarvoor, met de instelling van welke zij die derivaten aantrekt en

      d. uitsluitend financiële derivaten aantrekt, die luiden in euro’s.

      3 Het reglement bepaald voorts dat een bank, waarbij een dochtermaatschappij financiële derivaten afsluit of
      middelen uitzet, voldoet aan de eisen, genoemd in [artikel 13, eerste lid][ref7].


