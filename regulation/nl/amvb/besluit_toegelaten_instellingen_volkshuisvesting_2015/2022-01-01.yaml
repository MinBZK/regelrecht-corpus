  - number: '105'
    text: |-
      1 Het reglement, bedoeld in [artikel 55a, tweede lid, van de wet][ref1], omvat voorts, steeds mede ten aanzien
      van het aantrekken en gebruiken van financiële derivaten ten aanzien van collegiale leningen en ten aanzien van
      beleggingsactiviteiten:

      a. de bepaling dat de administratie zodanig wordt ingericht, dat het bestuur steeds op de hoogte kan zijn van de
      ontwikkeling van de waarden en indicatoren, bedoeld in [artikel 104, tweede lid, onderdeel c][ref2], en daarover de
      raad van commissarissen kan inlichten;

      b. de bepaling dat de beheersing van financiële risico’s wordt geïntegreerd in de bedrijfsvoering;

      c. de bepaling dat de wijze van beheersing van financiële risico’s en hetgeen daaromtrent van de daarmee belaste
      functionarissen wordt verwacht wordt vastgelegd in proces- en functiebeschrijvingen, welke aan dat reglement worden
      gehecht;

      d. voorschriften omtrent de organisatiestructuur met betrekking tot het financiële beleid en beheer, waaronder in
      elk geval voorschriften omtrent bevoegdheden en mandatering daarvan en omtrent de betrokkenheid daarbij van de raad
      van commissarissen en degene aan wie hij de opdracht, bedoeld in [artikel 37, eerste lid, van de wet][ref3], heeft
      gegeven;

      e. bepalingen met betrekking tot de financiële functie en de controlfunctie, die in elk geval inhouden:

      1°. dat hetzij een lid van het bestuur hetzij een lid van de directie voor die functies eindverantwoordelijk is;

      2°. dat die functies steeds betrokken zijn bij voorgenomen besluiten met verstrekkende financiële gevolgen;

      3°. dat de controlfunctie mede de aspecten van de interne bedrijfsvoering alsmede de effectiviteit en de efficiency
      van de organisatie omvat;

      4°. dat de controlfunctie bij een toegelaten instelling of dochtermaatschappij die meer dan 5.000 verhuureenheden
      in eigendom heeft in een afzonderlijke organisatie-eenheid is opgenomen en zowel gevraagd als ongevraagd het
      bestuur en de raad van commissarissen kan adviseren omtrent in het kader van het financiële beleid en beheer te
      nemen maatregelen;

      f. voorschriften die waarborgen dat de raad van commissarissen voldoende kennis heeft van financieel beleid en
      beheer;

      g. de bepaling dat de raad van commissarissen van een toegelaten instelling die meer dan 10.000 woongelegenheden in
      eigendom heeft, uit zijn midden een auditcommissie instelt;

      h. de bepaling dat de belangrijkste financiële risico’s ten minste twee maal per jaar worden besproken door het
      bestuur en de raad van commissarissen, aan de hand van een door het bestuur opgestelde rapportage waarin inzicht
      wordt gegeven in de aard, waarschijnlijkheid, mogelijke omvang en financiële gevolgen van die risico’s, alsmede in
      genomen of mogelijk te nemen maatregelen ten aanzien van die risico’s;

      i. de bepaling dat het de raad van commissarissen is toegestaan om de financiële risico’s zonder dat het
      bestuur daarbij aanwezig of vertegenwoordigd is te bespreken met degene aan wie hij de opdracht, bedoeld in
      [artikel 37, eerste lid, van de wet][ref4], heeft gegeven en met de functionarissen die met de beheersing van die
      risico’s belast zijn;

      j. de bepaling dat het bestuur het financiële jaarplan ter goedkeuring aan de raad van commissarissen voorlegt en

      k. de bepaling dat de raad van commissarissen jaarlijks, na overleg met het bestuur en, indien deze geen lid
      van het bestuur is, de persoon, bedoeld in onderdeel e, onder 1°, in samenspraak met degene aan wie de raad van
      commissarissen de opdracht, bedoeld in [artikel 37, eerste lid, van de wet][ref5], heeft gegeven, de controleaanpak
      en de speciale aandachtspunten voor de controle vaststelt.

      2 Het aantal verhuureenheden als bedoeld in het eerste lid, onderdeel e, onder 4,
      wordt bepaald overeenkomstig de bepaling daarvan voor de toepassing van de bij de
      [Regeling bezoldigingsmaxima topfunctionarissen toegelaten instellingen volkshuisvesting 2014][ref6] behorende
      tabel.

      3 Bij ministeriële regeling kunnen nadere voorschriften worden gegeven omtrent de toepassing van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel55a
      [ref2]: https://wetten.overheid.nl/BWBR0036702#Artikel104
      [ref3]: https://wetten.overheid.nl/BWBR0005181#Artikel37
      [ref4]: https://wetten.overheid.nl/BWBR0005181#Artikel37
      [ref5]: https://wetten.overheid.nl/BWBR0005181#Artikel37
