      1 De zienswijze, bedoeld in [artikel 59b, tweede lid, van de wet][ref1], heeft in elk geval betrekking op:

      a. de geschiktheid van de beoogde bestuurder of commissaris, blijkend uit diens opleiding, diens werkervaring en
      vakinhoudelijke kennis en diens competenties; en

      b. de betrouwbaarheid van de beoogde bestuurder of commissaris, blijkend uit diens handelen of nalaten of
      voornemens daartoe, een door de beoogde bestuurder of commissaris verkregen verklaring omtrent zijn gedrag, als
      bedoeld in [artikel 28 van de Wet justitiële en strafvorderlijke gegevens][ref2], en uit de antecedenten, genoemd
      in [bijlage 1][ref3] bij dit besluit.

      2 Bij ministeriële regeling kunnen nadere voorschriften worden gegeven omtrent het uitbrengen van de zienswijze en
      voorschriften worden gegeven omtrent de door de toegelaten instelling aan Onze Minister te verstrekken inlichtingen
      ten behoeve van het opstellen van die zienswijze.


