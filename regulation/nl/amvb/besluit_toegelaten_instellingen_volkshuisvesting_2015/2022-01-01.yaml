        artikel: '27'
      - id: ref2
        bwb_id: BWBR0014194
        artikel: '28'
  - number: '29'
    text: |-
      1 Voor zover het bestuur van de toegelaten instelling Onze Minister niet reeds schriftelijk mededeling heeft gedaan
      omtrent de aan deze werkzaamheden ten grondslag liggende omstandigheden, stelt de raad van commissarissen Onze
      Minister schriftelijk op de hoogte van zijn werkzaamheden ter uitoefening van zijn taak:

      a. indien naar zijn oordeel of dat van Onze Minister sprake is van door de betrokken toegelaten instelling
      berokkende schade of mogelijke schade aan het belang van de volkshuisvesting die zij niet binnen een afzienbare
      termijn kan herstellen respectievelijk voorkomen;

      b. indien sprake is van een onoverbrugbaar geschil tussen het bestuur en de raad van commissarissen van de
      toegelaten instelling, tussen individuele leden van de raad van commissarissen van de toegelaten instelling
      onderling, of tussen de toegelaten instelling en een dochtermaatschappij;

      c. indien naar zijn oordeel twijfel bestaat aan de rechtmatigheid van het handelen of nalaten, de governance of de
      integriteit van beleid en beheer van de toegelaten instelling, en het bestuur die twijfel niet heeft weggenomen of

      d. indien sprake is van liquiditeits- of solvabiliteitsproblemen in de toegelaten instelling of een
      dochtermaatschappij van die toegelaten instelling.

      2 Bij ministeriële regeling kunnen nadere voorschriften worden gegeven omtrent de toepassing van dit artikel.
    url: https://wetten.overheid.nl/BWBR0036702/2022-01-01#Artikel29
  - number: '30'
    text: |-
      1 Op de jaarrekening, bedoeld in [artikel 35, eerste lid, van de wet][ref1], en het jaarverslag, bedoeld
      in [artikel 36, eerste lid, van de wet][ref2], zijn niet van toepassing de volgende artikelen van
      [Boek 2 van het Burgerlijk Wetboek][ref3]:

      a. [artikel 361 lid 2 eerste volzin, zinsnede][ref4] «en de in artikel 360 lid 3 bedoelde stichtingen en
      verenigingen»;

      b. [artikel 362 lid 7 eerste volzin en tweede volzin][ref5] vanaf «omschreven», en leden 8 en 9;

      c. [artikel 373 lid 5][ref6];

      d. [artikel 378 leden 2, 3 en 4][ref7];

      e. [artikel 383a][ref8];

      f. [artikel 384 lid 1 tweede volzin][ref9], voor zover die volzin betrekking heeft op de waardering van onroerende
      zaken;

      g. [artikel 384 lid 6][ref10], voor zover dat lid betrekking heeft op de waardering van onroerende zaken;

      h. [artikel 388][ref11], voor zover dat artikel betrekking heeft op de waardering van onroerende zaken;

      i. [artikel 389 leden 4 en 5][ref12];

      j. [artikel 391 lid 1 vijfde volzin][ref13] vanaf «gesteld»;

      k. [artikel 392 lid 1 onder a en e, en leden 3, 4 en 5][ref14];

      l. [artikel 394 lid 1 tweede volzin, zinsnede][ref15] «of, als dat niet is vervaardigd, een exemplaar in het Frans,
      Duits of Engels,», en lid 4 eerste volzin, zinsnede «de zelfde taal of» en tweede volzin, zinsnede «a,»,

      m. [artikel 395 lid 2 vierde volzin][ref16];

      m. [artikel 395a][ref17];

      o. [artikel 396][ref18];

      p. [artikel 397][ref19];

      q. [artikel 398 leden 3 en 5][ref20];

      r. [artikel 406 leden 3, 4 en 5][ref21];

      s. [artikel 408 lid 1 onder d en e][ref22] en

      t. [artikel 414 lid 5][ref23].

      2 Voor de toepassing van de [afdelingen 2 tot en met 8][ref24], [10][ref25], [11][ref26],
      [13][ref27] en [16 van titel 9 van Boek 2 van het Burgerlijk Wetboek][ref28] op de jaarrekening,
      bedoeld in [artikel 35, eerste lid, van de wet][ref29], en het jaarverslag, bedoeld in
      [artikel 36, eerste lid, van de wet][ref30], wordt in die afdelingen:

      a. in [artikel 379 lid 2 onder b][ref31] voor «leden 1 tot en met 7» gelezen «leden 1, 2, 3, 6 en 7»;

      b. in [artikel 397 lid 7][ref32] voor «onderdelen e en f» gelezen «onderdeel f»;

      c. in [artikel 398 lid 2][ref33] voor «leden 3 tot en met 8» gelezen «leden 3, 4 en 5».


