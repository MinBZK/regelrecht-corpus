  - number: 13a
    text: |-
      1 Een toegelaten instelling trekt de financiële middelen voor werkzaamheden op het gebied van de volkshuisvesting
      die niet behoren tot de diensten van algemeen economisch belang uitsluitend aan bij categorieën van instellingen
      als bedoeld in het bepaalde bij en krachtens [artikel 13, eerste, tweede en derde lid][ref1], en zonder
      gebruikmaking van de borgingsvoorziening. Zij kan uitsluitend op een andere wijze financiële middelen voor die
      werkzaamheden inzetten:

      a. in geval van herstructurering, of

      b. indien zij ten overstaan van Onze Minister aannemelijk heeft gemaakt dat zij geen gevolg kan geven aan de eerste
      volzin.

      2 De toegelaten instelling stelt ten behoeve van toepassing van het eerste lid, tweede volzin, een voorziening in,
      ten laste waarvan zij een interne lening verstrekt, die aan de niet-daeb-tak ten goede komt. Op het rentepercentage
      van die lening is het bepaalde bij en krachtens [artikel 10, tweede lid, onderdeel a][ref2], van overeenkomstige
      toepassing.

      3 De voorziening, bedoeld in het tweede lid, bevat uitsluitend de netto-opbrengsten van vervreemdingen op
      1 januari 2012 of nadien van woongelegenheden als bedoeld in [artikel 66, eerste lid, onderdelen a en b][ref3],
      en [artikel 47, eerste lid, onderdeel c, van de wet][ref4], verminderd met het per jaar aan die woongelegenheden
      toe te rekenen deel van de leningen, bedoeld in artikel 66, eerste lid, onderdeel f, welk deel verhoudingsgewijs
      gelijk is aan het quotiënt van het totaalbedrag van die leningen en dat van de WOZ-waarde van die woongelegenheden,
      welke totaalbedragen blijken uit de voor dat jaar vastgestelde balans van de toegelaten instelling. De voorziening
      bevat die aldus verminderde netto-opbrengsten voorts uitsluitend, voor zover er een batig saldo over het betrokken
      jaar is uit de verhuur en de vervreemding van woongelegenheden als bedoeld in de eerste volzin, bepaald op grond
      van waardering van die woongelegenheden tegen de modelmatige marktwaarde. De eerste en tweede volzin zijn van
      overeenkomstige toepassing op de jaarlijks aan de voorziening toe te voegen middelen.

      4 Op de aflossing van de lening, bedoeld in het tweede lid, is [artikel 70, tweede lid][ref5], van overeenkomstige
      toepassing.


