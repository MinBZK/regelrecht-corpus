    text: |-
      Het bijdragen aan de leefbaarheid houdt uitsluitend in:

      a. woonmaatschappelijk werk, met inbegrip van het leveren van een bijdrage aan uitvoering van achter-de-voordeur-
      programma’s onder verantwoordelijkheid van maatschappelijke organisaties en uitsluitend ten behoeve van de huurders
      van de woongelegenheden van de toegelaten instelling;

      b. aanleg en onderhoud van kleinschalige infrastructuur in de directe nabijheid van woongelegenheden of andere
      onroerende zaken van de toegelaten instelling;

      c. bijdragen aan de uitvoering van plannen:

      1°. ter bevordering van een schone woonomgeving,

      2°. ter voorkoming van overlast,

      3°. ter bevordering van de veiligheid, en

      d. bijdragen aan activiteiten gericht op ontmoeting van huurders van woongelegenheden van de toegelaten instelling.
    url: https://wetten.overheid.nl/BWBR0036702/2022-01-01#Artikel51
  - number: 52a
    text: |-
      Tot de werkzaamheden, bedoeld in de [artikelen 45, tweede lid, onderdeel i][ref1], en
      [47, eerste lid, onderdeel g, van de wet][ref2], behoren niet transacties die zijn gericht op het wijzigen van
      eigendomsverhoudingen en zakelijke rechten zonder dat er sprake is van feitelijke overdracht van bezit, behalve
      indien die transacties noodzakelijk zijn om werkzaamheden als bedoeld in de andere onderdelen van die artikelleden
      te kunnen verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel47
    url: https://wetten.overheid.nl/BWBR0036702/2022-01-01#Artikel52a
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '45'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '47'
  - number: 52b
    text: |-
      De diensten, bedoeld in [artikel 45, tweede lid, onderdeel j, van de wet][ref1]:

      a. worden door een toegelaten instelling of een met haar verbonden onderneming uitsluitend verleend ten behoeve van
      de bedrijfsvoering of administratie van een met die toegelaten instelling verbonden onderneming, indien en zolang
      laatstgenoemde verbonden onderneming:

      1°. een dochtermaatschappij van die toegelaten instelling is, of

      2°. een verbonden onderneming is waarvan die toegelaten instelling of een of meer met haar verbonden ondernemingen
      alleen of samen meer dan de helft van de bestuurders kunnen benoemen of ontslaan;

      b. worden door een toegelaten instelling of een met haar verbonden onderneming uitsluitend verleend ten behoeve
      van de bedrijfsvoering of administratie van een verbonden onderneming van een andere toegelaten instelling, indien
      en zolang:

      1°. meer dan de helft van de aandelen in laatstgenoemde verbonden onderneming door toegelaten instellingen wordt
      gehouden, of

      2°. toegelaten instellingen of een of meer van haar dochtermaatschappijen alleen of samen meer dan de helft van de
      bestuurders van laatstgenoemde verbonden onderneming kunnen benoemen of ontslaan, en

      3°. zij ook diensten ten behoeve van de bedrijfsvoering of administratie van die andere toegelaten instelling
      verleent.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel45
    url: https://wetten.overheid.nl/BWBR0036702/2022-01-01#Artikel52b
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '45'
  - number: 52c
    text: |-
      De diensten, bedoeld in [artikel 45, tweede lid, onderdeel k, van de wet][ref1], worden door een toegelaten
      instelling of een met een toegelaten instelling verbonden onderneming uitsluitend verleend aan een in dat onderdeel
      bedoelde huurdersorganisatie of bewonerscommissie:

      a. die de belangen van de huurders van een met een toegelaten instelling verbonden onderneming behartigt, of

      b. waarvan de achterban mede bestaat uit huurders van woongelegenheden van de dienstverlenende toegelaten
      instelling of verbonden onderneming.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel45
