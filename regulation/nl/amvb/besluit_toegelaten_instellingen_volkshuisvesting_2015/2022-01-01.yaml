  - number: '58'
    text: |-
      1 De toegelaten instelling voert overleg met de rechtspersoon of vennootschap, eerstbedoeld in
      [artikel 48, tweede lid, van de wet][ref1], met het oogmerk te bewerkstelligen dat die rechtspersoon
      of vennootschap alle handelingen verricht en aan de toegelaten instelling alle inlichtingen verstrekt
      die voor haar noodzakelijk zijn om aan de [artikelen 48, eerste, tweede en vierde lid][ref2], en
      [55, derde en vierde lid, van de wet][ref3] te voldoen.

      2 Het is de toegelaten instelling verboden een overeenkomst met een rechtspersoon of vennootschap ter zake van
      de huur en verhuur van woongelegenheden waarop [artikel 48, eerste lid, van de wet][ref4] van toepassing is
      aan te gaan, die in de weg staat aan de juiste toepassing van artikel 48, eerste, tweede of vierde lid, van de
      wet, [55, derde of vierde lid, van de wet][ref5] of het eerste lid van dit artikel. Indien een voor 18 mei 2013
      aangegane zodanige overeenkomst ertoe leidt dat die toegelaten instelling niet over alle gegevens beschikt die
      noodzakelijk zijn voor een beoordeling als bedoeld in artikel 48, achtste lid, van de wet, wordt dat die toegelaten
      instelling bij die beoordeling niet aangerekend.


