  - number: '71'
    text: |-
      1 Overdrachten door de toegelaten instelling tussen haar daeb-tak en haar niet-daeb-tak van garanties of rechten
      van pand of hypotheek op zaken en daarmee verbonden rechten na 1 juli 2015 leiden op generlei wijze tot een
      wijziging voor derden in het kunnen inroepen van hun rechten jegens de toegelaten instelling.

      2 De toegelaten instelling verschaft vanuit haar daeb-tak niet anderszins financiële middelen aan
      haar niet-daeb-tak dan door middel van een voorziening als bedoeld in [artikel 13a, tweede lid][ref1],
      een interne startlening als bedoeld in artikel 70, eerste lid, of een interne lening als bedoeld in
      [artikel 79, tweede lid, onderdeel a][ref2]. Zij verschaft vanuit haar daeb-tak geen garanties aan haar niet-daeb-
      tak.

      3 De toegelaten instelling kan Onze Minister verzoeken om een ontheffing van het verbod, bedoeld in het tweede lid.
      Onze Minister willigt het verzoek uitsluitend in, indien dat naar zijn oordeel noodzakelijk is:

      a. om te voorkomen dat de toegelaten instelling gehouden is om schulden van de niet-daeb-tak uit haar daeb-tak te
      voldoen of

      b. ten behoeve van de herfinanciering van leningen die bestonden op 1 juli 2015 en nadien in de niet-daeb-tak zijn
      ondergebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0036702#Artikel13a
      [ref2]: https://wetten.overheid.nl/BWBR0036702#Artikel79
