      1 Onze Minister keurt een voornemen als bedoeld in [artikel 41a, eerste lid, van de wet][ref1] niet goed, indien:

      a. de gemeente waarop dat voornemen betrekking heeft niet direct grenst aan een gemeente in Nederland waar de
      toegelaten instelling feitelijk werkzaam is;

      b. die toegelaten instelling in de gemeenten in Nederland waar zij feitelijk werkzaam is niet alle personen kan
      huisvesten die aldaar door hun inkomen of door andere omstandigheden moeilijkheden ondervinden bij het vinden van
      hun passende huisvesting, of

      c. zienswijzen op dat voornemen van de gemeente waarop het betrekking heeft, van de direct aan die gemeente
      grenzende gemeenten in Nederland of van de betrokken bewonersorganisaties hem daartoe naar zijn oordeel aanleiding
      geven.

      2 Bij ministeriële regeling kunnen nadere voorschriften worden gegeven omtrent de toepassing van het eerste lid,
      onderdelen b en c.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel41a
