  - number: '96'
    text: |-
      1 In de toelichting, bedoeld in [artikel 313 van Boek 2 van het Burgerlijk Wetboek][ref1], wordt in elk geval
      opgenomen:

      a. de motieven voor de voorgenomen fusie;

      b. een uiteenzetting over de alternatieven voor die fusie, waarin de verwachte effecten van die fusie en de
      verwachte meerwaarde ervan worden vergeleken met die van minder vergaande vormen van samenwerking, en

      c. een fusie-effectrapportage overeenkomstig het tweede lid.

      2 De fusie-effectrapportage omvat in elk geval een weergave van de gevolgen van de voorgenomen fusie voor:

      a. de lokale binding, inhoudende:

      1°. een overzicht van de organisatorische en bestuurlijke structuur van de verkrijgende toegelaten instelling,
      waaruit blijkt dat er een lokaal aanspreekpunt zal zijn in die gemeenten waar de verkrijgende toegelaten instelling
      100 of meer woongelegenheden in bezit heeft, en

      2°. een uiteenzetting over de gevolgen van de met die fusie gepaard gaande schaalvergroting op de samenwerking
      met de gemeenten waar de verkrijgende toegelaten instelling haar woonplaats zal hebben en die waar zij feitelijk
      werkzaam zal zijn;

      b. de prestaties op het terrein van de volkshuisvesting, inhoudende een uiteenzetting
      over de wijze waarop de verkrijgende toegelaten instelling toepassing zal geven aan
      [artikel 42, eerste lid, eerste volzin, van de wet][ref2];

      c. de financiële continuïteit van de verkrijgende toegelaten instelling, inhoudende een uiteenzetting over de
      financiële gevolgen van de in verband met die fusie verwachte wijzigingen in het beleid van de fuserende toegelaten
      instelling, en

      d. de financiële draagkracht van de verkrijgende toegelaten instelling.

      3 Het eerste lid, onderdeel c, en het tweede lid zijn niet van toepassing indien sprake is van een fusie als
      bedoeld in [artikel 53, vijfde lid, van de wet][ref3].

      4 Bij ministeriële regeling kunnen nadere voorschriften worden gegeven omtrent de toepassing van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel313
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel42
      [ref3]: https://wetten.overheid.nl/BWBR0005181#Artikel53
