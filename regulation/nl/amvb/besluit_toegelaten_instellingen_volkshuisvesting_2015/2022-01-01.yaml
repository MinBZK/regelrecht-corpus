  - number: '55'
    text: |-
      1 De administratie van de toegelaten instelling of een rechtspersoon of vennootschap als bedoeld in
      [artikel 54, derde lid][ref1], is zodanig, dat een juiste, volledige en tijdige vastlegging daarin is gewaarborgd
      van de gegevens met betrekking tot het huishoudinkomen. Die gegevens worden voor de toepassing van het bepaalde bij
      en krachtens [artikel 46, tweede lid, van de wet][ref2] voor een kalenderjaar niet langer daarin bewaard dan tot
      het tijdstip dat de compensatie over dat kalenderjaar voor werkzaamheden van de toegelaten instelling die behoren
      tot de diensten van algemeen economisch belang onherroepelijk is komen vast te staan.

      2 De toegelaten instelling is verplicht tot geheimhouding van de gegevens met betrekking tot het huishoudinkomen,
      behoudens voor zover enig wettelijk voorschrift haar tot mededeling verplicht of uit haar taak de noodzaak tot
      mededeling voortvloeit.


      [ref1]: https://wetten.overheid.nl/BWBR0036702#Artikel54
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel46
    url: https://wetten.overheid.nl/BWBR0036702/2022-01-01#Artikel55
