    text: |-
      1 De gebouwen, bedoeld in [artikel 45, tweede lid, onderdeel d, van de wet][ref1], zijn:

      a. de gebouwen en categorieën van gebouwen, genoemd in [bijlage 2][ref2] bij dit besluit en

      b. de gebouwen en categorieën van gebouwen, genoemd in [bijlage 3][ref3] bij dit besluit, welke ten aanzien van een
      toegelaten instelling uitsluitend tot het gebied van de volkshuisvesting behoren, indien zij deze op het tijdstip
      waarop dit besluit in werking is getreden in eigendom had.

      2 Onze Minister kan op verzoek van een toegelaten instelling bepalen dat het doen bouwen of verwerven van andere
      gebouwen met een maatschappelijke gebruiksbestemming dan die, bedoeld in het eerste lid, ten aanzien van die
      toegelaten instelling tot het gebied van de volkshuisvesting behoort, indien die gebouwen naar zijn oordeel behoren
      tot een aan een categorie als genoemd in [bijlage 2][ref4] bij dit besluit nauw verwante categorie.

      3 De werkzaamheden ten aanzien van welke Onze Minister toepassing heeft gegeven aan het tweede lid, behoren tot de
      diensten van algemeen economisch belang.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel45
