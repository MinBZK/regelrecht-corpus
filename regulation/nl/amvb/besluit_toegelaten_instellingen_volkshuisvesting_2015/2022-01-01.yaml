  - number: '62'
    text: |-
      1 Indien:

      a. het percentage woongelegenheden, bedoeld in [artikel 47, eerste lid, onderdelen b en c, van de wet][ref1],
      met betrekking tot welke de toegelaten instelling overeenkomsten van huur en verhuur heeft aangegaan
      in gevallen dat het huishoudinkomen niet hoger is dan de betrokken inkomensgrens, genoemd in
      [artikel 16, eerste lid][ref2], in een boekjaar meer dan 5 procentpunt lager is dan het op grond van
      [artikel 48, eerste lid, eerste volzin, van de wet][ref3] geldende dan wel het overeenkomstig [artikel 60][ref4]
      vastgestelde percentage;

      b. de toegelaten instelling gedurende twee achtereenvolgende boekjaren niet voldoet aan
      [artikel 48, eerste lid, eerste volzin, van de wet][ref5], waarbij, indien van toepassing, het overeenkomstig
      [artikel 60][ref6] vastgestelde percentage in aanmerking wordt genomen of

      c. het percentage woongelegenheden, bedoeld in onderdeel a, in een boekjaar minder dan 5 procentpunt lager is dan
      het op grond van [artikel 48, eerste lid, eerste volzin, van de wet][ref7] geldende dan wel het overeenkomstig
      artikel 60 vastgestelde percentage, en in het daaropvolgende boekjaar niet zodanig hoger is dan het op grond van
      artikel 48, eerste lid, eerste volzin, van de wet geldende percentage dan wel het overeenkomstig [artikel 60][ref8]
      vastgestelde percentage, dat over de twee betrokken boekjaren gezamenlijk bezien voldaan is aan artikel 48, eerste
      lid, eerste volzin, van de wet,

      vordert Onze Minister, tenzij hij toepassing geeft aan [artikel 63][ref9], de compensatie, uitsluitend terstond
      nadat hij heeft vastgesteld dat een geval als bedoeld in onderdeel a, b of c zich heeft voorgedaan, terug, voor
      zover deze te hoog is gebleken.

      2 Indien het, door een toegelaten instelling of een rechtspersoon of vennootschap ten aanzien van welke zij
      toepassing heeft gegeven aan [artikel 48, tweede lid, van de wet][ref10], in een boekjaar aangaan van één
      overeenkomst van huur van verhuur met betrekking tot een andere woongelegenheid van die toegelaten instelling
      dan die, bedoeld in [artikel 47, eerste lid, onderdeel b of c, van de wet][ref11], aanleiding zou geven tot een
      terugvordering als bedoeld in het eerste lid, wordt geen toepassing aan dat lid gegeven.


