      1 De zienswijze, bedoeld in de [artikelen 25, tweede lid][ref1], en [30, derde lid, van de wet][ref2], heeft in elk
      geval betrekking op:

      a. de geschiktheid van de beoogde bestuurder of commissaris, blijkend uit diens opleiding, diens werkervaring en
      vakinhoudelijke kennis en diens competenties, en

      b. de betrouwbaarheid van de beoogde bestuurder of commissaris, blijkend uit diens handelen of nalaten of
      voornemens daartoe, een door de beoogde bestuurder of commissaris verkregen verklaring omtrent zijn gedrag, als
      bedoeld in [artikel 28 van de Wet justitiële en strafvorderlijke gegevens][ref3], en uit de antecedenten, genoemd
      in [bijlage 1][ref4] bij dit besluit.

      2 Onze Minister betrekt bij zijn zienswijze de aard en zwaarte van de functie waarvoor de beoogde bestuurder
      of commissaris in aanmerking wordt gebracht, en de aard en de omvang van de werkzaamheden van de toegelaten
      instelling.

      3 Bij ministeriële regeling kunnen nadere voorschriften worden gegeven omtrent het uitbrengen van de zienswijze,
      bedoeld in de [artikelen 25, tweede lid][ref5], en [30, derde lid, van de wet][ref6], en voorschriften worden
      gegeven omtrent de door de toegelaten instelling aan Onze Minister te verstrekken inlichtingen ten behoeve van het
      opstellen van die zienswijze.


