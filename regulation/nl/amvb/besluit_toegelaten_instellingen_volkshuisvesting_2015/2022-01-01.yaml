    text: |-
      1 Het reglement, bedoeld in [artikel 55a, tweede lid, van de wet][ref1], bepaalt voorts dat:

      a. toegelaten instellingen, dochtermaatschappijen en verbonden ondernemingen waarvan de toegelaten instelling
      meer dan de helft van de bestuurders kan benoemen of ontslaan die financiële derivaten gebruiken daartoe een
      liquiditeitsbuffer aanhouden van een zodanige omvang, dat daaruit, met inachtneming van redelijkerwijs voorzienbare
      beroepen daarop in verband met andere bedrijfsrisico’s dan dat gebruik, aan de uit dat gebruik voortvloeiende
      liquiditeitsverplichtingen ten gevolge van een daling van de vaste rente in de markt van rentederivaten met 2%-punt
      kan worden voldaan;

      b. indien die liquiditeitsbuffer een geringere omvang heeft dan ingevolge onderdeel a vereist, de toegelaten
      instelling, de dochtermaatschappij en de verbonden onderneming waarvan de toegelaten instelling meer dan de
      helft van de bestuurders kan benoemen of ontslaan, dat terstond aan Onze Minister meedeelt en na overleg met hem
      maatregelen vaststelt om die situatie op te heffen en

      c. de toegelaten instelling, de dochtermaatschappij en de verbonden onderneming waarvan de toegelaten instelling
      meer dan de helft van de bestuurders kan benoemen of ontslaan, geen payer swaps aantrekt, indien en zolang de
      omvang van die liquiditeitsbuffer zodanig gering is, dat niet kan worden voldaan aan de uit het gebruik van
      financiële derivaten voortvloeiende liquiditeitsverplichtingen ten gevolge van een daling van de vaste rente in de
      markt van rentederivaten met 1%-punt.

      2 Bij ministeriële regeling kunnen nadere voorschriften worden gegeven omtrent de toepassing van het eerste lid,
      onderdeel a.


