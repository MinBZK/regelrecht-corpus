  - number: '82'
    text: |-
      1 Indien de toepassing van het bepaalde bij en krachtens [artikel 81][ref1] er zonder nadere maatregelen toe
      zou leiden, dat de financiële continuïteit van een woningvennootschap niet in dezelfde mate is gewaarborgd als
      die van de toegelaten instelling, verstrekt de toegelaten instelling bij die toepassing een startlening aan de
      woningvennootschap. De startlening kan een hypothecaire lening zijn. Op het rentepercentage en de aflossing van die
      lening is het bepaalde bij en krachtens [artikel 10, tweede en derde lid][ref2], van overeenkomstige toepassing,
      met dien verstande dat het rentepercentage, bedoeld in dat artikel, geldt als minimumpercentage.

      2 De woningvennootschap zet voor de aflossing van de startlening het gedeelte van de netto-opbrengst in van de
      vervreemding van haar onroerende zaken, niet zijnde woongelegenheden waarin natuurlijke personen als eigenaar hun
      hoofdverblijf zullen hebben, dat verhoudingsgewijs gelijk is aan het aandeel van de modelmatige marktwaarde van
      die zaken in de totale modelmatige marktwaarde van haar onroerende zaken op het tijdstip van die vervreemding.
      De eerste volzin is niet van toepassing, indien zij de in die volzin bedoelde netto-opbrengst besteedt aan het
      bouwen of verwerven van, of het treffen van ingrijpende voorzieningen aan, woongelegenheden of gebouwen, of zij
      ten overstaan van Onze Minister aannemelijk maakt dat aanhouding daarvan noodzakelijk is voor haar voortbestaan in
      financieel opzicht.

      3 Indien de toepassing van het bepaalde bij en krachtens [artikel 81][ref3] er zonder nadere maatregelen toe
      zou leiden, dat de financiële continuïteit van de woningvennootschap in onvoldoende mate is gewaarborgd, kan de
      toegelaten instelling bij die toepassing, in afwijking van artikel 81, eerste lid, onderdeel b, besluiten andere
      leningen dan die, genoemd in [artikel 66, eerste lid, onderdeel f][ref4], niet in die woningvennootschap onder
      te brengen.

      4 Bij ministeriële regeling kunnen nadere voorschriften worden gegeven omtrent de toepassing van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0036702#Artikel81
      [ref2]: https://wetten.overheid.nl/BWBR0036702#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0036702#Artikel81
