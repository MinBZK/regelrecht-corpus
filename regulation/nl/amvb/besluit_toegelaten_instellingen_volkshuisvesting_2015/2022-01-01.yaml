  - number: '76'
    text: |-
      Op verzoek van Onze Minister verstrekt de toegelaten instelling hem nadere inlichtingen over de voorgenomen
      administratieve scheiding, voor zover dat naar zijn oordeel voor de beoordeling van het verzoek om goedkeuring
      daarvan noodzakelijk is. Bij ministeriële regeling kunnen voorschriften worden gegeven omtrent de inlichtingen die
      de toegelaten instelling dient te verstrekken.
    url: https://wetten.overheid.nl/BWBR0036702/2022-01-01#Artikel76
  - number: '77'
    text: |-
      1 Onze Minister betrekt bij zijn beoordeling van de financiële continuïteit van de daeb-tak na goedkeuring van de
      voorgenomen administratieve scheiding in elk geval:

      a. zijn geraamde solvabiliteit na die scheiding;

      b. de verhouding tussen het saldo van zijn operationele kasstromen en zijn rentelasten gedurende de eerste vijf
      jaren na die scheiding en

      c. de meest recente beoordeling van zijn kredietwaardigheid door de borgingsvoorziening, indien de toegelaten
      instelling leningen als bedoeld in [artikel 66, eerste lid, onderdeel f][ref1], heeft aangetrokken.

      2 Onze Minister betrekt bij zijn beoordeling van de financiële continuïteit van de niet-daeb-tak na goedkeuring van
      de voorgenomen administratieve scheiding in elk geval zijn geraamde solvabiliteit na die scheiding.

      3 Bij ministeriële regeling kunnen nadere voorschriften worden gegeven omtrent de toepassing van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0036702#Artikel66
