  - number: '126'
    text: |-
      1 De toegelaten instellingen geven, behoudens
      [artikel II, derde tot en met elfde lid, van de Herzieningswet toegelaten instellingen volkshuisvesting][ref1]
      en het tweede lid van dit artikel, terstond na het tijdstip waarop [artikel I van die wet][ref2] in werking is
      getreden toepassing aan het bepaalde bij en krachtens [hoofdstuk IV van de wet][ref3], voor zover zij niet binnen
      het in artikel II, tweede lid, van genoemde wet bedoelde tijdvak ten overstaan van Onze Minister aannemelijk maken
      dat het verrichten van werkzaamheden in verband met het toepassing geven aan dat lid daaraan naar redelijkheid in
      de weg staat.

      2 Indien het tijdstip, bedoeld in het eerste lid, een ander is dan 1 januari van enig kalenderjaar:

      a. geven de toegelaten instellingen met ingang van 1 januari van het op dat kalenderjaar eerstvolgende
      kalenderjaar toepassing aan het bepaalde bij en krachtens de [artikelen 35 tot en met 38][ref4] en
      [46, tweede lid, van de wet][ref5];

      b. dragen de toegelaten instellingen, in afwijking van [artikel 44, eerste lid, van de wet][ref6], er zorg voor
      dat de in dat lid genoemde instanties op 1 november van dat kalenderjaar beschikken over het overzicht, bedoeld
      in [artikel 43, eerste lid, van de wet][ref7], dat betrekking heeft op de op dat kalenderjaar eerstvolgende vijf
      kalenderjaren, en

      c. wordt bij de verslaglegging over het uitvoering geven aan het bepaalde bij en krachtens
      [artikel 48 van de wet][ref8] de betrokken inkomensgrens, genoemd in [artikel 16, eerste lid][ref9], op dezelfde
      wijze betrokken als in de situatie dat die grens had gegolden gedurende het gehele kalenderjaar waarin dat tijdstip
      valt.

      3 Toegelaten instellingen kunnen tot 1 januari 2021, ten aanzien van 25% van het bruto-vloeroppervlak
      van de gebouwen, genoemd in de tweede volzin, het aangaan van overeenkomsten van huur en verhuur
      in de daeb-tak onderbrengen, indien het voornemen daartoe is opgenomen in het overzicht, bedoeld in
      [artikel 44a, eerste lid, onderdeel a, van de wet][ref10] over het jaar 2017. De gebouwen, bedoeld in de
      eerste volzin, zijn de gebouwen waarin na 31 december 2011 zorg is verleend door een instelling die behoort
      tot een categorie als bedoeld in [artikel 5, eerste lid, van de Wet toelating zorginstellingen][ref11] en
      die is toegelaten voor de zorgvorm verblijf als bedoeld in het [Besluit zorgaanspraken AWBZ][ref12] zoals dat
      luidde op 31 december 2014, in combinatie met een of meer van de zorgvormen persoonlijke verzorging, verpleging
      en begeleiding als bedoeld in dat besluit, en voor welke zorg de Nederlandse Zorgautoriteit, genoemd in
      [artikel 3 van de Wet marktordening gezondheidszorg][ref13], een vergoeding voor kapitaallasten heeft vastgesteld
      op grond van [artikel 57 van die wet][ref14]. Tot het bruto-vloeroppervlak, bedoeld in de eerste volzin, behoort
      mede het vloeroppervlak van de bij die gebouwen behorende overdekte parkeervoorzieningen en de oppervlakte van de
      bij die gebouwen behorende overige parkeervoorzieningen.

      4 Tot en met 31 december 2015 behoren tot de categorieën van personen, bedoeld in
      [artikel 48, eerste lid, derde volzin, van de wet][ref15], personen die worden gehuisvest op grond van een
      indicatiebesluit als bedoeld in [artikel 1 van het Zorgindicatiebesluit][ref16] zoals dat luidde op 31 december
      2014, voor persoonlijke verzorging als bedoeld in [artikel 4 van het Besluit zorgaanspraken AWBZ][ref17] zoals dat
      luidde op die datum, verpleging als bedoeld in [artikel 5 van dat besluit][ref18] zoals dat luidde op die datum,
      of individuele begeleiding als bedoeld in [artikel 6 van dat besluit][ref19] zoals dat luidde op die datum, in
      welk indicatiebesluit ten minste 10 uur zorg per week wordt toegekend, en welk indicatiebesluit een geldigheidsduur
      heeft van ten minste een jaar of, indien het is afgegeven in de periode van 28 juli 2014 tot en met 31 december
      2014, van ten minste zes maanden.

      5 [Artikel 52, eerste lid][ref20], zoals dat luidde op 30 juni 2016, blijft van toepassing op werkzaamheden,
      als bedoeld in dat artikel waarmee voor die datum een aanvang is gemaakt, of met betrekking tot welke uit
      schriftelijke, uitsluitend op die werkzaamheden betrekking hebbende, stukken blijkt dat het maken van die aanvang
      voor die datum werd beoogd.


