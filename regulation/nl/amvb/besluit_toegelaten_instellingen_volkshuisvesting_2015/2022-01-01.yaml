      1 Het volkshuisvestingsverslag, bedoeld in [artikel 36a, eerste lid, van de wet][ref1], omvat in elk geval een
      uiteenzetting inzake het verslagjaar over:

      a. de uitvoering van de in de gemeenten waar de toegelaten instelling feitelijk werkzaam is geldende woonvisie, en
      van in het in [artikel 44, eerste lid, van de wet][ref2] bedoelde overleg gemaakte afspraken daarover;

      b. het inzetten van haar middelen, bedoeld in [artikel 42, tweede en derde lid, van de wet][ref3];

      c. het gevoerde overleg als bedoeld in [artikel 44, eerste lid, van de wet][ref4] met de gemeenten waar zij
      feitelijk werkzaam is;

      d. het gevoerde overleg met de betrokken bewonersorganisaties;

      e. de uitvoering van elk van haar werkzaamheden, bedoeld in [artikel 45 van de wet][ref5];

      f. de uitvoering van [artikel 46 van de wet][ref6];

      g. de uitvoering van het reglement, bedoeld in [artikel 55a, tweede lid, van de wet][ref7];

      h. de uitvoering van het reglement, bedoeld in [artikel 55b, derde lid, van de wet][ref8], en

      i. de uitvoering van haar andere reglementen.

      2 Het volkshuisvestingsverslag omvat voorts een overzicht van de met de toegelaten instelling verbonden
      ondernemingen, met uitzondering van de ondernemingen van welke de toegelaten instelling minder dan 2% van het
      kapitaal inbrengt, en een uiteenzetting over hun werkzaamheden.


