      eerste volzin is de inkomensgrens, bedoeld in artikel 1, eerste lid, van de wet tot 1 januari 2025 voor een
      meerpersoonshuishouden als bedoeld in [artikel 2, onderdeel a, van de Wet op de huurtoeslag][ref2] € 45.014.

      2 De bedragen, genoemd in het eerste lid, worden met ingang van elk kalenderjaar bij
      ministeriële regeling gewijzigd met het percentage waarmee per gelijke datum het in
