      bedragen, genoemd in de in [artikel 36a, vierde lid, van de wet][ref4] bedoelde ministeriële regeling, worden met
      ingang van elk kalenderjaar, voor het eerst op 1 januari 2017, bij ministeriële regeling vervangen door de bedragen
      zoals die op 1 januari van het daaraan voorafgaande jaar overeenkomstig de eerste volzin zijn gewijzigd.


