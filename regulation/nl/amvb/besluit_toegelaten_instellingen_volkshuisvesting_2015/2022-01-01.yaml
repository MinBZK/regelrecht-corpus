  - number: '25'
    text: |-
      1 Onze Minister beslist binnen twaalf weken na ontvangst daarvan op een verzoek om goedkeuring als bedoeld
      in [artikel 27, eerste lid, aanhef en onderdeel a, van de wet][ref1], welke termijn hij, door schriftelijke
      kennisgeving daarvan aan de toegelaten instelling binnen die termijn, eenmalig kan verlengen met een door hem
      daarbij te bepalen termijn van ten hoogste twee weken.

      2 Onze Minister kan, indien hij toepassing geeft aan [artikel 27, derde lid, van de wet][ref2], de in het eerste
      lid genoemde termijn of ingevolge dat lid verlengde termijn schorsen totdat het advies, bedoeld in artikel 27,
      derde lid, van de wet, is uitgebracht. Hij geeft binnen die termijn schriftelijk kennis van een zodanige schorsing
      aan de betrokken toegelaten instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel27
    url: https://wetten.overheid.nl/BWBR0036702/2022-01-01#Artikel25
