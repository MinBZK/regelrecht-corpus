  - number: '5'
    text: |-
      Het verzoek, bedoeld in [artikel 19, eerste lid, tweede volzin, van de wet][ref1], gaat in elk geval vergezeld van:

      a. een authentiek afschrift van de akte van oprichting van de vereniging of de stichting of van de notariële
      akte waarin de statuten van de vereniging na haar oprichting zijn opgenomen, en van de notariële akten waarin
      statutenwijzigingen zijn opgenomen;

      b. het bewijs dat de vereniging of de stichting is ingeschreven in een openbaar register, gehouden door de Kamer
      van Koophandel;

      c. het bewijs dat een authentiek afschrift van de akte van oprichting of van de notariële akte waarin de statuten
      zijn opgenomen, dan wel een authentiek uittreksel van die akte, authentieke afschriften van de notariële akten
      waarin statutenwijzigingen zijn opgenomen en de statuten als laatstelijk gewijzigd ten kantore van die Kamer zijn
      neergelegd;

      d. de reglementen van de vereniging of de stichting;

      e. de meest recente balans, winst- en verliesrekening en begroting van de vereniging of de stichting;

      f. andere bescheiden die bijdragen aan een juist en volledig inzicht van Onze Minister in de financiële situatie
      van de vereniging of de stichting en

      g. afzonderlijke gegevens omtrent de te verhuren woongelegenheden van de vereniging of de stichting als
      bedoeld in [artikel 46, eerste lid, onderdeel b, van de wet][ref2], de te verhuren overige woongelegenheden
      van de vereniging of de stichting, de te verhuren gebouwen van de vereniging of de stichting als bedoeld in
      [artikel 45, tweede lid, onderdeel d, van de wet][ref3] en de te verhuren overige gebouwen van de vereniging of
      de stichting.


