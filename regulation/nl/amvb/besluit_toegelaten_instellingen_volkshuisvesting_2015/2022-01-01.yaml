      1 De toegelaten instelling brengt, onverminderd [artikel 50, tweede lid, onderdeel e, van de wet][ref1], in de
      daeb-tak onder:

      a. haar verhuurde woongelegenheden met een huurprijs van ten hoogste het in
      [artikel 13, eerste lid, onderdeel a, van de Wet op de huurtoeslag][ref2] genoemde bedrag, alsmede haar
      geprojecteerde woongelegenheden die zij voornemens is tegen een zodanige huurprijs te verhuren;

      b. haar niet verhuurde woongelegenheden die laatstelijk waren verhuurd tegen een huurprijs als bedoeld in onderdeel
      a;

      c. haar woongelegenheden, bedoeld in [artikel 47, eerste lid, onderdelen c en d, van de wet][ref3];

      d. haar bestaande en geprojecteerde gebouwen, bedoeld in [artikel 45, tweede lid, onderdeel d, van de wet][ref4]
      alsmede haar niet verhuurde gebouwen die laatstelijk waren verhuurd overeenkomstig dat artikel;

      e. haar onbebouwde grond, voor zover daarop ingevolge een bestemmingsplan woningbouw zal moeten plaatsvinden,
      en zij, blijkens het overzicht, bedoeld in [artikel 44a, eerste lid, onderdeel a, van de wet][ref5],
      voornemens is daarop binnen vijf jaar na het ingangstijdstip, bedoeld in
      __REF001___________________________________________________________________________________________________________
      ___, zoals dat luidde onmiddellijk voorafgaand aan het tijdstip waarop die wet werd ingetrokken, indien zij die
      grond op dat tijdstip in eigendom had, of binnen vijf jaar na het verwerven van die grond woongelegenheden te doen
      bouwen, van welke ten minste 90% zal behoren tot de woongelegenheden, bedoeld in onderdeel a;

      f. de door haar aangetrokken leningen met gebruikmaking van de borgingsvoorziening, of van borgstelling daarvan
      door overheden;

      g. de voorziening, bedoeld in [artikel 13a, tweede lid][ref7];

      h. haar financieel waardeerbare rechten en verplichtingen uit hoofde van bedingen die betrekking hebben op een
      opvolgende vervreemding door de verkrijger van een woongelegenheid van de toegelaten instelling, indien die
      woongelegenheid op het tijdstip dat deze laatstelijk door de toegelaten instelling werd verhuurd, was aan te merken
      als een woongelegenheid als bedoeld in onderdeel a of c, en is vervreemd aan een natuurlijke persoon, en

      i. haar baten en lasten, naar de mate waarin zij betrekking hebben op activa of passiva als bedoeld in de
      onderdelen a tot en met h, of, voor zover die baten en lasten niet aldus aan activa of passiva kunnen worden
      gerelateerd, jaarlijks het deel van die baten en lasten dat verhoudingsgewijs gelijk is aan het aandeel van de
      onroerende zaken, bedoeld in de onderdelen a tot en met e, in het totaal van haar onroerende zaken, welk aandeel en
      totaal blijken uit haar laatstelijk vastgestelde balans.

      2 Bij ministeriële regeling kunnen nadere voorschriften worden gegeven omtrent hetgeen de toegelaten instelling in
      de daeb-tak onderbrengt.


