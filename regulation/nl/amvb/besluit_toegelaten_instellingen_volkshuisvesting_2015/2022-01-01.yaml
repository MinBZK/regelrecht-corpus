    text: |-
      1 Onze Minister verstrekt uitsluitend een subsidie als bedoeld in
      [artikel 57, eerste lid, aanhef en onderdeel b, van de wet][ref1]:

      a. indien de werkzaamheden in verband met welke de toegelaten instelling die subsidie heeft aangevraagd behoren tot
      de diensten van algemeen economisch belang;

      b. indien de toegelaten instelling de werkzaamheden in verband met welke zij die subsidie heeft aangevraagd naar
      het oordeel van Onze Minister niet zonder die subsidie kan verrichten en

      c. voor zover hij over voldoende middelen daarvoor beschikt als verkregen of te verkrijgen uit de bijdragen,
      bedoeld in [artikel 58, tweede lid, van de wet][ref2].

      2 Bij de verstrekking van een subsidie als bedoeld in
      [artikel 57, eerste lid, aanhef en onderdeel b, van de wet][ref3] geeft Onze Minister voorrang aan
      aanvragen om een zodanige subsidie van toegelaten instellingen op welke een situatie als bedoeld in
      [artikel 29, eerste lid, van de wet][ref4] van toepassing is.

      3 De subsidie is niet hoger dan de kosten van de werkzaamheden ter tegemoetkoming in de kosten waarvan zij wordt
      verstrekt, verminderd met de door Onze Minister geraamde opbrengsten daaruit, en verminderd met bijdragen als
      bedoeld in [artikel 113, tweede lid, onderdeel d][ref5].

      4 Bij ministeriële regeling kunnen nadere voorschriften worden gegeven omtrent de berekening van de subsidie,
      bedoeld in [artikel 57, eerste lid, aanhef en onderdeel b, van de wet][ref6].


