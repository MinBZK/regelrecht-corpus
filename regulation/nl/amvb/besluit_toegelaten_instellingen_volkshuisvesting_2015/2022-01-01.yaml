  - number: '80'
    text: |-
      1 Een verzoek als bedoeld in [artikel 50, eerste lid, van de wet][ref1] kan uitsluitend betrekking hebben op
      werkzaamheden als bedoeld in [artikel 47, eerste lid, onderdelen b tot en met f, van de wet][ref2] met betrekking
      tot:

      a. potentieel te liberaliseren woongelegenheden;

      b. blijvend gereguleerde woongelegenheden, indien die woongelegenheden deel uitmaken van een gemengd
      geliberaliseerd complex;

      c. woongelegenheden als bedoeld in [artikel 47, eerste lid, onderdeel c, van de wet][ref3];

      d. gebouwen als bedoeld in [artikel 45, tweede lid, onderdeel d, van de wet][ref4], of

      e. gebouwen ten aanzien van welke Onze Minister toepassing heeft gegeven aan [artikel 49, tweede lid][ref5],

      en de werkzaamheden die noodzakelijkerwijs uit het verrichten van die werkzaamheden voortvloeien.

      2 Het verzoek gaat in elk geval vergezeld van:

      a. een overzicht van haar woongelegenheden of gebouwen als bedoeld in het eerste lid, onderdeel a, b, c, d
      of e, die zij voornemens is administratief naar de niet-daeb-tak over te brengen, dat is uitgesplitst per
      gemeente waar die woongelegenheden of gebouwen gelegen zijn, en waarin zijn opgenomen de modelmatige marktwaarde
      van die woongelegenheden of gebouwen, alsmede de huurprijs en de waardering van de kwaliteit, bedoeld in
      [artikel 5 van het Besluit huurprijzen woonruimte][ref6], van die woongelegenheden, en

      b. de zienswijze van de betrokken gemeenten en bewonersorganisaties op het verzoek, tenzij de toegelaten instelling
      met die gemeenten en bewonersorganisaties op grond van [artikel 44, eerste lid, van de wet][ref7], afspraken heeft
      gemaakt over de omvang van de voorraad van woongelegenheden of gebouwen als bedoeld in het eerste lid, onderdeel a,
      b, c, d of e, en de vervreemding van een deel van die voorraad.

      3 Onze Minister willigt het verzoek niet in, indien:

      a. de uitvoering van de daarin vervatte voornemens er naar zijn oordeel toe zou leiden dat de toegelaten instelling
      niet voldoet aan [artikel 48, eerste lid, derde volzin, van de wet][ref8] of

      b. een zienswijze als bedoeld in het tweede lid, onderdeel b, daartoe naar zijn oordeel aanleiding geeft of, na
      mogelijkheid tot herstel, onterecht niet is meegezonden.

      4 [Artikel 79, tweede lid, onderdeel a][ref9], is van overeenkomstige toepassing op de woongelegenheden en
      gebouwen, bedoeld in het eerste lid.

      5 Bij ministeriële regeling kunnen nadere voorschriften worden gegeven omtrent hetgeen waarvan een verzoek als
      bedoeld in [artikel 50, eerste lid, van de wet][ref10] vergezeld gaat, en de gronden waarop Onze Minister het
      verzoek niet inwilligt.


