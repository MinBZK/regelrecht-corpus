  - number: '22'
    text: |-
      1 De goedkeuring, bedoeld in [artikel 27, eerste lid, aanhef en onderdeel a, van de wet][ref1], is niet vereist
      voor:

      a. de vervreemding van woongelegenheden of complexen met woongelegenheden, indien het een vervreemding betreft:

      1°. aan een toegelaten instelling;

      2°. aan een natuurlijk persoon voor eigen gebruik:

      i. tegen een prijs van ten minste 90% van de getaxeerde marktwaarde vrij van huur en gebruik of de WOZ-waarde; of

      ii. tegen een prijs tussen de 50% en 90% van de getaxeerde marktwaarde vrij van huur en gebruik of de WOZ-waarde en
      de bij ministeriële regeling bepaalde voorwaarden;

      b. de vervreemding van onroerende zaken, anders dan woongelegenheden en complexen met woongelegenheden, indien:

      1°. het een verhuurd gebouw met een maatschappelijke gebruiksbestemming als bedoeld in artikel 45,
      tweede lid, onderdeel d, van de wet, betreft of een verhuurd gebouw met een zorgfunctie als bedoeld in
      [bijlage 2][ref2] bij dit besluit, dat functioneel een eenheid vormt met woongelegenheden als bedoeld in
      [artikel 47, eerste lid, onderdeel d, van de wet][ref3], dat wordt vervreemd aan:

      i. een toegelaten instelling; of

      ii. degene die het direct voorafgaand aan die vervreemding huurde;

      2°. het een onroerende zaak, anders dan een verhuurd gebouw, bedoeld onder 1°, betreft;

      c. de vestiging van een recht van erfpacht, opstal of vruchtgebruik op een andere gebouwde onroerende
      zaak dan een woongelegenheid, een gebouw dat een maatschappelijke gebruiksbestemming als bedoeld in
      [artikel 45, tweede lid, onderdeel d, van de wet][ref4], heeft of op onbebouwde grond, of overdracht van de
      economische eigendom van een zodanige onroerende zaak;

      d. de vestiging van een recht van opstal of vruchtgebruik op een woongelegenheid of op een zaak die zich in of
      nabij een woongelegenheid bevindt, in bij ministeriële regeling bepaalde gevallen.

      2 In de ministeriële regeling als bedoeld in het eerste lid, onderdeel a, onder 2°, onder ii, kunnen
      voorwaarden worden verbonden aan de deling van de waardeontwikkeling tussen de toegelaten instelling en de
      verkrijger, waarbij onderscheid kan worden gemaakt tussen personen met een huishoudinkomen van ten hoogste
      € 45.482,– en personen met een huishoudinkomen hoger dan dat bedrag. Dit bedrag wordt met ingang van
      elk kalenderjaar bij ministeriële regeling gewijzigd met het percentage waarmee per gelijke datum het in
      [artikel 18, eerste lid, onderdeel d, van de Wet op de huurtoeslag][ref5] genoemde bedrag wordt gewijzigd.

      3 Vervreemdingen waarvoor geen goedkeuring is vereist op grond van het eerste lid, onderdelen a, onder 1°,
      b, onder 1°, subonderdeel i of 2°, vinden, indien aan een toegelaten instelling wordt vervreemd, plaats
      tegen een bij ministeriële regeling bepaalde waarde, tenzij de toegelaten instelling het noodzakelijk
      acht een andere prijs te hanteren, in welk geval zij dit verantwoordt in het jaarverslag, bedoeld in
      [artikel 36, eerste lid, van de wet][ref6].

      4 De toegelaten instelling verantwoordt in het jaarverslag, bedoeld in [artikel 36, eerste lid, van de wet][ref7],
      een vervreemding waarvoor geen goedkeuring is vereist op grond van het eerste lid, onderdeel b, onder 1°,
      subonderdeel ii, of onder 2°, indien die vervreemding plaatsvindt tegen een prijs die lager is dan de getaxeerde
      marktwaarde.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel27
