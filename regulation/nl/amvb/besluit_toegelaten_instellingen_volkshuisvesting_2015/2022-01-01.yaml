  - number: '89'
    text: |-
      Op de goedkeuring van de juridische scheiding is
      [artikel 9, eerste lid, aanhef en onderdelen a, b, c en d, en derde lid][ref1] van overeenkomstige toepassing, met
      dien verstande dat Onze Minister op verzoek van de toegelaten instelling een hoger percentage dan dat, genoemd in
      artikel 9, eerste lid, onderdeel c, kan vaststellen, indien de toegelaten instelling bij dat verzoek aantoont dat
      zonder toepassing van dat hogere percentage de financiële continuïteit van de toegelaten instelling respectievelijk
      de woningvennootschap onvoldoende gewaarborgd is.


      [ref1]: https://wetten.overheid.nl/BWBR0036702#Artikel9
    url: https://wetten.overheid.nl/BWBR0036702/2022-01-01#Artikel89
