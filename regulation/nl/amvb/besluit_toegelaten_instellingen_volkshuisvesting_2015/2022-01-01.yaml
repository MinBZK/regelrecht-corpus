  - number: '127'
    text: |-
      1 Het [Besluit beheer sociale-huursector][ref1] wordt ingetrokken.

      2 Het bepaalde bij en krachtens het [Besluit beheer sociale-huursector][ref2] blijft van toepassing:

      a. indien het tijdstip, bedoeld in [artikel 126, eerste lid][ref3], een ander is dan 1 januari van enig
      kalenderjaar: op de jaarrekening, het jaarverslag en het volkshuisvestingsverslag van de toegelaten instelling over
      het kalenderjaar waarin dat tijdstip valt, en het onderzoeken en beoordelen van die verslagen;

      b. indien dat tijdstip 1 januari van enig kalenderjaar is: op de in onderdeel a genoemde verslagen over het aan dat
      kalenderjaar direct voorafgaande kalenderjaar, en het onderzoeken en beoordelen van die verslagen, en

      c. voor zover de toegelaten instellingen ingevolge [artikel 126, eerste lid][ref4], ten overstaan van Onze Minister
      aannemelijk hebben gemaakt dat het verrichten van werkzaamheden in verband met het toepassing geven aan artikel II,
      tweede lid, van de Herzieningswet toegelaten instellingen volkshuisvesting naar redelijkheid in de weg staat aan
      het door hen toepassing geven aan [hoofdstuk IV van de wet][ref5].


