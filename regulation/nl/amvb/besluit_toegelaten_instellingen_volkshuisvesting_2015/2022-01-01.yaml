    text: |-
      1 In de aanvraag om een subsidie als bedoeld in [artikel 57, eerste lid, aanhef en onderdeel b, van de wet][ref1]
      maakt de toegelaten instelling aannemelijk, dat:

      a. zij over onvoldoende financiële middelen beschikt om bepaalde, in de aanvraag op te nemen, werkzaamheden te
      kunnen verrichten;

      b. de werkzaamheden in verband met welke die subsidie wordt aangevraagd zijn opgenomen in het overzicht,
      bedoeld in [artikel 44a, eerste lid, onderdeel a, van de wet][ref2], of ingevolge een aanwijzing als bedoeld in
      [artikel 61d van de wet][ref3] aan haar zijn opgedragen, en

      c. personen of instanties die geen toegelaten instelling zijn niet of niet volledig bereid zijn die werkzaamheden
      te verrichten of daarvoor financiële middelen te verstrekken.

      2 De aanvraag om een subsidie als bedoeld in [artikel 57, eerste lid, aanhef en onderdeel b, van de wet][ref4] gaat
      in elk geval vergezeld van:

      a. het projectplan met betrekking tot de werkzaamheden in verband met welke die subsidie wordt aangevraagd, dat in
      elk geval inzicht geeft in aard en duur van die werkzaamheden, alsmede de financiële baten en lasten die met die
      werkzaamheden samenhangen;

      b. de zienswijze op dat projectplan van de gemeente of gemeenten waar die werkzaamheden zijn voorzien, en van de
      betrokken bewonersorganisaties;

      c. een toelichting op de omstandigheden, bedoeld in het eerste lid, onderdeel c;

      d. de bijdragen aan de werkzaamheden, die kunnen worden verkregen door toepassing van
      [artikel 42, tweede lid, van de wet][ref5] en van personen of instanties die geen toegelaten instelling zijn, en

      e. een raming, in relatie tot de bijdragen, bedoeld in onderdeel d, van de benodigde zodanige subsidie.

      3 Bij ministeriële regeling kunnen voorschriften worden gegeven omtrent de inrichting van de stukken, bedoeld in
      het tweede lid.


