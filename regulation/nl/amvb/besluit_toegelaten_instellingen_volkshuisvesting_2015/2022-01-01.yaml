  - number: 52d
    text: |-
      1 Het verhuren van woongelegenheden en aanhorigheden van derden, bedoeld in
      [artikel 45, zevende lid, onderdeel a, van de wet][ref1], is slechts toegestaan indien een overeenkomst van huur en
      verhuur wordt aangegaan:

      a. met een huishouden waarvan het huishoudinkomen niet hoger is dan de inkomensgrens, bedoeld in
      [artikel 1 van de wet][ref2], of

      b. met categorieën van personen als bedoeld in [artikel 57][ref3], en

      c. tegen een huurprijs van ten hoogste het in
      [artikel 13, eerste lid, onderdeel a, van de Wet op de huurtoeslag][ref4] genoemde bedrag.

      2 Het in stand houden van en treffen van kleinschalige voorzieningen aan gebouwen van derden, bedoeld in
      [artikel 45, zevende lid, onderdeel b, van de wet][ref5], is slechts toegestaan indien:

      a. de werkzaamheden die zijn gericht op het geschikt maken van het gebouw voor bewoning, een investering vergen van
      ten hoogste een bij ministeriële regeling bepaald bedrag per beoogde verhuureenheid;

      b. de gebouwen en aanhorigheden ten aanzien waarvan de werkzaamheden worden verricht van de derde worden gehuurd
      als bedoeld in [artikel 45, zevende lid, onderdeel c, van de wet][ref6] of indien ten aanzien van de gebouwen en
      aanhorigheden tevens diensten ten behoeve van de bedrijfsvoering of administratie worden uitgevoerd als bedoeld in
      artikel 45, zevende lid, onderdeel d, van de wet, en

      c. voor zover de werkzaamheden worden verricht in gebouwen en aanhorigheden, ten aanzien
      waarvan tevens diensten ten behoeve van de bedrijfsvoering of administratie als bedoeld in
      [artikel 45, zevende lid, onderdeel c van de wet][ref7] worden uitgevoerd, de werkzaamheden
      worden verricht op grond van een overeenkomst van opdracht betreffende lastgeving als bedoeld in
      [artikel 414, eerste lid, van Boek 7 van het Burgerlijk Wetboek][ref8].

      3 Het huren van gebouwen van derden, bedoeld in [artikel 45, zevende lid, onderdeel c, van de wet][ref9], is
      slechts toegestaan indien:

      a. de toegelaten instelling deze gebouwen huurt met het oogmerk deze te verhuren op grond van
      [artikel 45, zevende lid, onderdeel a, van de wet][ref10];

      b. de ontwerphuurovereenkomst tussen de toegelaten instelling en de derde, bedoeld in
      [artikel 45, zevende lid, onderdeel c][ref11], voldoet aan de bij ministeriële regeling daaraan te stellen
      voorwaarden, en

      c. er voldoende vermogen beschikbaar is om de verplichtingen die volgen uit de overeenkomst te kunnen opvangen.

      4 Het verlenen van diensten ten behoeve van de bedrijfsvoering of administratie van derden, bedoeld in
      [artikel 45, zevende lid, onderdeel d, van de wet][ref12], is slechts toegestaan indien:

      a. met betrekking tot ten minste 90% van de woongelegenheden een overeenkomst van huur en verhuur is aangegaan:

      1°. met een huishouden waarvan het huishoudinkomen niet hoger is dan de inkomensgrens, of

      2°. met categorieën van personen als bedoeld in [artikel 57][ref13], en

      3°. tegen een huurprijs van ten hoogste het in
      [artikel 13, eerste lid, onderdeel a, van de Wet op de huurtoeslag][ref14] genoemde bedrag, waarbij met ten minste
      95% van de huishoudens als bedoeld in artikel 46, tweede lid, van de wet een huurprijs is overeengekomen van ten
      hoogste de huurprijs als bedoeld in dat lid;

      b. de diensten worden verricht op grond van een overeenkomst van opdracht betreffende lastgeving als bedoeld in
      [artikel 414, eerste lid, van Boek 7 van het Burgerlijk Wetboek][ref15], en

      c. de ontwerpovereenkomst van opdracht, bedoeld in onderdeel b, is opgenomen in het overzicht met
      verantwoordingsgegevens, bedoeld in [artikel 36a, vierde lid, van de wet][ref16].

      5 Bij ministeriële regeling kunnen nadere voorschriften worden gegeven omtrent de toepassing van dit artikel.


