    text: |-
      1 Onze Minister verstrekt uitsluitend een subsidie als bedoeld in
      [artikel 57, eerste lid, aanhef en onderdeel a, van de wet][ref1]:

      a. indien naar zijn oordeel zonder die subsidie een toegelaten instelling niet in staat is om de betrokken
      werkzaamheden die behoren tot de diensten van algemeen economisch belang te kunnen verrichten of voortzetten;

      b. indien het verrichten of voortzetten van die werkzaamheden naar het oordeel van burgemeester en wethouders van
      de gemeenten waar zij worden verricht noodzakelijk is voor het in stand houden van voldoende woongelegenheden in
      die gemeenten, als bedoeld in [artikel 47, eerste lid, onderdelen b en c, van de wet][ref2] en

      c. voor zover hij over voldoende middelen daarvoor beschikt als verkregen of te verkrijgen uit de bijdragen,
      bedoeld in [artikel 58, tweede lid, van de wet][ref3].

      2 De subsidie is niet hoger dan het bedrag dat naar het oordeel van Onze Minister noodzakelijk is om te waarborgen
      dat een toegelaten instelling na uitvoering van het saneringsplan over voldoende financiële middelen beschikt om
      de betrokken werkzaamheden die behoren tot de diensten van algemeen economisch belang te verrichten of voort te
      zetten.

      3 Indien de subsidie wordt besteed aan het verrichten of voortzetten van werkzaamheden die behoren tot de diensten
      van algemeen economisch belang door een andere toegelaten instelling dan de toegelaten instelling die de subsidie
      ontvangt, betaalt de ontvangende toegelaten instelling die subsidie door aan die andere toegelaten instelling.

      4 Onze Minister kan aan de verstrekking van de subsidie voorwaarden en verplichtingen verbinden ter waarborging van
      de uitvoering van het saneringsplan.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel57
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel47
      [ref3]: https://wetten.overheid.nl/BWBR0005181#Artikel58
