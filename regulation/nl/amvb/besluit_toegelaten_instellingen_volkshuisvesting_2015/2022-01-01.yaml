      1 Het verzoek, bedoeld in de [artikelen 23 tot en met 23d][ref1], wordt ingediend met gebruikmaking van een door
      Onze Minister beschikbaar te stellen formulier. Onze Minister bevestigt binnen twee weken de ontvangst van een
      zodanig verzoek.

      2 Bij ministeriële regeling kunnen nadere voorschriften worden gegeven omtrent de bij een verzoek om een
      goedkeuring als bedoeld in [artikel 27, eerste lid, aanhef en onderdeel a, van de wet][ref2], over te leggen
