    text: |-
      1 Onze Minister stelt per toegelaten instelling de bijdrage, bedoeld in [artikel 58, tweede lid, van de wet][ref1],
      vast en maakt deze uiterlijk op 1 oktober van het jaar waarover deze verschuldigd is bekend aan de toegelaten
      instelling.

      2 De bijdrage dient te worden betaald binnen een maand na dagtekening van de bekendmaking, bedoeld in het eerste
      lid. Bij niet tijdige betaling is vanaf de datum van het verstrijken van die termijn de verplichting van toepassing
      tot betaling van een rente, bepaald overeenkomstig [afdeling 4.4.2 van de Algemene wet bestuursrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel58
