  - number: '7'
    text: |-
      1 Teneinde te voldoen aan [artikel 20, vijfde lid, tweede volzin, van de wet][ref1] verkoopt Onze
      Minister of de persoon of instantie, bedoeld in de eerste volzin van dat lid, het overschot, bedoeld in
      [artikel 23b lid 1 van Boek 2 van het Burgerlijk Wetboek][ref2], voor zover daartoe iets anders dan geld
      behoort en de statuten van de ontbonden vereniging of stichting of een rechterlijke beschikking geen
      nadere aanwijzing behelzen. De verkoop geschiedt in het openbaar naar de plaatselijke gewoonten en op
      de gebruikelijke voorwaarden. Onze Minister of die persoon of instantie kan bepalen in welke volgorde
      woongelegenheden als bedoeld in [artikel 46, eerste lid, onderdeel b, van de wet][ref3] en gebouwen als bedoeld
      in [artikel 45, tweede lid, onderdeel d, van de wet][ref4] ter verkoop worden aangeboden aan de verschillende
      categorieën mogelijke verkrijgers van die woongelegenheden of gebouwen.

      2 Teneinde te voldoen aan [artikel 20, vijfde lid, tweede volzin, van de wet][ref5] besteedt Onze Minister de
      netto-opbrengst van de verkoop aan subsidies als bedoeld in [artikel 57, eerste lid, van de wet][ref6].


