  - number: '147'
    text: |-
      De artikelen van dit besluit treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld. Bij dat koninklijk besluit kan
      worden bepaald dat artikelen van dit besluit of onderdelen daarvan terugwerken tot en met een bij dat koninklijk
      besluit te bepalen tijdstip, dat voor die artikelen of onderdelen verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0036702/2022-01-01#Artikel147
