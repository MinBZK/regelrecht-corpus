  - number: '74'
    text: |-
      1 De toegelaten instelling voert overleg over het verzoek om goedkeuring van de voorgenomen administratieve
      scheiding met de gemeente waar zij haar woonplaats heeft en de gemeenten waar zij feitelijk werkzaam is, alsmede
      met de betrokken bewonersorganisaties.

      2 De toegelaten instelling stelt de huurders van haar andere gebouwen dan woongelegenheden in de gelegenheid met
      haar overleg te voeren over het verzoek, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0036702/2022-01-01#Artikel74
  - number: '75'
    text: |-
      1 Het verzoek om goedkeuring van de voorgenomen administratieve scheiding gaat in elk geval vergezeld van:

      a. het voorstel, bedoeld in [artikel 49a, van de wet][ref1], en een schriftelijke toelichting daarop;

      b. de gegevens over de beoogde toepassing van het bepaalde bij en krachtens de [artikelen 13a][ref2], [70][ref3]
      en [71][ref4];

      c. de zienswijzen daarop van de personen en instanties, bedoeld in [artikel 73, eerste lid][ref5], en, in geval van
      een negatieve zodanige zienswijze, een onderbouwde reactie daarop van de toegelaten instelling, dan wel, bij het
      uitgebleven zijn van een zienswijze, bescheiden waaruit blijkt dat zij om die zienswijze heeft gevraagd;

      d. de adviezen, bedoeld in [artikel 5, eerste lid, van de Wet op het overleg huurders verhuurder][ref6], en, in
      geval van een negatief zodanig advies, een onderbouwde reactie daarop van de toegelaten instelling, dan wel, bij
      het uitgebleven zijn van een advies, bescheiden waaruit blijkt dat zij om dat advies heeft gevraagd en

      e. de balans van de toegelaten instelling zoals zij die na de goedkeuring van die scheiding beoogt in te richten.

      2 In de toelichting op het voorstel voor de voorgenomen administratieve scheiding wordt in elk geval opgenomen:

      a. de motieven voor het bij die scheiding toepassing geven aan [artikel 49a, tweede lid, van de wet][ref7],
      waarbij in elk geval wordt ingegaan op het door de toegelaten instelling na die toepassing kunnen naleven van
      [artikel 48, eerste lid, eerste volzin, van de wet][ref8];

      b. een overzicht van haar werkzaamheden, baten, lasten, activa en passiva, bedoeld in
      [artikel 49a, tweede lid, van de wet][ref9], in samenhang met [artikel 50, eerste en tweede lid, van de wet][ref10],
      die zij voornemens is in de niet-daeb-tak onder te brengen, welk overzicht wat betreft haar woongelegenheden en
      gebouwen is uitgesplitst per gemeente waar zij gelegen zijn, en waarin zijn opgenomen de modelmatige marktwaarde
      van die woongelegenheden en gebouwen, alsmede de huurprijs en de waardering van de kwaliteit, bedoeld in
      [artikel 5 van het Besluit huurprijzen woonruimte][ref11], van die woongelegenheden;

      c. een uiteenzetting over de financiële relaties die als gevolg van die scheiding tussen de daeb-tak en de niet-
      daeb-tak zullen bestaan;

      d. een uiteenzetting over de beoogde prestaties op het terrein van de volkshuisvesting van de daeb-tak en de niet-
      daeb-tak na die scheiding, inhoudende een uiteenzetting over de wijze waarop de toegelaten instelling toepassing
      zal geven aan [artikel 42, eerste lid, eerste volzin, van de wet][ref12];

      e. een uiteenzetting over de financiële continuïteit van de daeb-tak en de niet-daeb-tak na die scheiding, mede
      inhoudende een uiteenzetting over de financiële gevolgen van de in verband met die scheiding verwachte wijzigingen
      in het beleid van de toegelaten instelling en

      f. een uiteenzetting over de mogelijkheden voor en de bereidheid van financiële instellingen om de niet-daeb-tak
      financiële middelen te verschaffen ten behoeve van de uitvoering van zijn werkzaamheden.

      3 Bij ministeriële regeling kunnen nadere voorschriften worden gegeven omtrent de toepassing van dit artikel.


