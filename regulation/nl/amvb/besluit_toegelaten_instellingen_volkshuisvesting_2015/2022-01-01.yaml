    text: |-
      1 Onze Minister kan ontheffing als bedoeld [21a, derde lid, van de wet][ref1] verlenen indien:

      a. het verschaffen van vermogen plaatsvindt door het kwijtschelden van schulden van de met haar verbonden
      onderneming, indien:

      1°. de toegelaten instelling enig aandeelhouder is van de verbonden onderneming;

      2°. de verbonden onderneming uitsluitend schulden heeft bij de toegelaten instelling;

      3°. de waarde van de activa van de verbonden onderneming nihil is, en

      4°. de verbonden onderneming na kwijtschelding van de schulden wordt ontbonden;

      b. het verstrekken van vermogen plaatsvindt bij het bewerkstelligen van een administratieve scheiding
      of juridische scheiding als bedoeld in [Hoofdstuk IV, Afdeling 3, paragraaf 4][ref2], onderscheidenlijk
      [paragraaf 5, van de wet][ref3] aan een dochtermaatschappij en het verschaffen van vermogen voor maximaal 60%
      geschiedt in de vorm van het inbrengen van kapitaal.

      2 Naast de gevallen, bedoeld in het eerste lid, kan Onze Minister uitsluitend een ontheffing als bedoeld in
      [artikel 21a, derde lid, van de wet][ref4] verlenen, indien dat naar zijn oordeel noodzakelijk is:

      a. om te voorkomen dat de toegelaten instelling gehouden is om schulden van de betrokken verbonden onderneming
      te voldoen;

      b. ten behoeve van de herfinanciering van leningen die bestonden op 1 juli 2015, of

      c. ten behoeve van de herfinanciering van leningen die bestaan op het tijdstip waarop een juridische scheiding
      wordt bewerkstelligd.


