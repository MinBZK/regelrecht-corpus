  - number: '9'
    text: |-
      1 Onze Minister keurt het zich verbinden, bedoeld in [artikel 21, eerste lid, eerste volzin, van de wet][ref1],
      niet goed, indien:

      a. het aantal potentieel te liberaliseren woongelegenheden van de toegelaten instelling, die zij voornemens is
      in de rechtspersoon of vennootschap onder te brengen, waaronder mede worden begrepen zodanige woongelegenheden
      in gemengde geliberaliseerde complexen en waaronder niet worden begrepen andere woongelegenheden in zodanige
      complexen, hoger is dan 10% van het aantal zodanige woongelegenheden dat de toegelaten instelling op 31 december
      2014 in eigendom had;

      b. door dat zich verbinden strijdigheid zou ontstaan met
      [artikel 81, derde lid, eerste volzin, onverminderd de tweede, derde en vierde volzin van dat lid][ref2];

      c. de verrekening tussen de betrokken rechtspersoon of vennootschap en de toegelaten instelling voor meer dan 60%
      geschiedt in de vorm van het inbrengen van kapitaal;

      d. indien de toegelaten instelling in verband met dat onderbrengen een lening aan die rechtspersoon of vennootschap
      verstrekt: 'die lening:'

      1°. geen hypothecaire geldlening is of

      2°. niet voldoet aan het bepaalde bij en krachtens [artikel 10, tweede lid][ref3] en in verband daarmee vierde lid,
      onverminderd het bepaalde bij en krachtens artikel 10, derde lid en in verband daarmee vierde lid;

      e. indien het voornemen bestaat zich te verbinden met een naamloze vennootschap als bedoeld in
      [artikel 64 van Boek 2 van het Burgerlijk Wetboek][ref4] of een besloten vennootschap met beperkte
      aansprakelijkheid als bedoeld in [artikel 175 van dat boek][ref5], de statuten van die naamloze of besloten
      vennootschap:

      1°. niet uitsluitend aandelen op naam kennen, geen blokkeringsregeling bevatten of toelaten dat met medewerking
      van de vennootschap certificaten aan toonder worden uitgegeven in het geval van een naamloze vennootschap en geen
      blokkeringsregeling bevatten in het geval van een besloten vennootschap;

      2°. bepalingen bevatten die afwijken van [artikel 89 lid 1 tweede volzin][ref6], [92 lid 1][ref7],
      [105 lid 1][ref8], [135 lid 4][ref9], [198 lid 1][ref10], [201 lid 1][ref11] of [245 lid 1 van dat boek][ref12];

      3°. bepalingen bevatten als bedoeld in de [artikelen 192 lid 1 aanhef en onder a][ref13] en
      [242 lid 1 eerste volzin van dat boek][ref14];

      4°. niet bepalen dat de voorafgaande goedkeuring van de algemene vergadering van die naamloze of besloten
      vennootschap is vereist voor besluiten van haar bestuur over:

      i. dienovereenkomstige aangelegenheden als die, bedoeld in
      [artikel 26, eerste lid, onderdelen c en i, van de wet][ref15];

      ii. het oprichten van een dochtermaatschappij of het deelnemen in een rechtspersoon of vennootschap in de zin van
      [artikel 24c van Boek 2 van het Burgerlijk Wetboek][ref16]; of

      iii. het verstrekken van een lening aan of het zich in enigerlei opzicht garant stellen voor een
      dochtermaatschappij of een rechtspersoon of vennootschap als bedoeld onder ii; of

      5°. niet bepalen, indien en zolang die naamloze of besloten vennootschap een dochtermaatschappij van de toegelaten
      instelling is, dat haar bestuur zich gedraagt naar de aanwijzingen van de algemene vergadering, welke bepaling in
      de statuten van die naamloze vennootschap kan worden beperkt tot aanwijzingen van die vergadering die de algemene
      lijnen van het te voeren beleid op nader in die statuten aangegeven terreinen betreffen.

      2 Onze Minister betrekt bij zijn oordeel, bedoeld in [artikel 21, eerste lid, onderdeel b, van de wet][ref17], in
      elk geval:

      a. de geraamde solvabiliteit van de toegelaten instelling na een zich verbinden als bedoeld in dat lid;

      b. de verhouding tussen het saldo van de operationele kasstromen en de rentelasten van de toegelaten instelling
      gedurende de eerste vijf jaren na een zich zodanig verbinden en

      c. de meest recente beoordeling door de borgingsvoorziening van de kredietwaardigheid van de toegelaten instelling,
      indien zij leningen als bedoeld in [artikel 66, eerste lid, onderdeel f][ref18], heeft aangetrokken.

      3 Onze Minister kan op verzoek van de toegelaten instelling een hoger percentage dan dat, genoemd in het eerste
      lid, onderdeel a, vaststellen, indien:

      a. de toegelaten instelling bij dat verzoek aannemelijk heeft gemaakt dat toepassing van dat hogere percentage
      noodzakelijk is om haar financiële continuïteit of die van de betrokken rechtspersoon of vennootschap voldoende te
      waarborgen, of

      b. aantoont dat toereikend toepassing gegeven kan worden aan
      [artikel 42, eerste lid, eerste volzin, van de wet][ref19] wat betreft haar werkzaamheden die diensten van algemeen
      economisch belang zijn.

      Het bepaalde bij en krachtens [artikel 10, eerste lid][ref20] en in verband daarmee vierde lid, is van
      overeenkomstige toepassing.

      4 Bij ministeriële regeling kunnen nadere voorschriften worden gegeven omtrent de toepassing van dit artikel.


