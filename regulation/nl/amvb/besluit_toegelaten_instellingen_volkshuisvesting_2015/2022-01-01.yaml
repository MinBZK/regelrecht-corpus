  - number: '85'
    text: |-
      1 De toegelaten instelling voert overleg over het verzoek om goedkeuring van de voorgenomen juridische
      scheiding met de gemeente waar zij haar woonplaats heeft, die waar zij feitelijk werkzaam is, die waar de
      woningvennootschappen na die scheiding hun woonplaats zullen hebben en die waar zij daarna feitelijk werkzaam
      zullen zijn, alsmede met de betrokken bewonersorganisaties.

      2 De toegelaten instelling stelt de huurders van haar andere gebouwen dan woongelegenheden in de gelegenheid met
      haar overleg te voeren over het verzoek, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0036702/2022-01-01#Artikel85
  - number: '86'
    text: |-
      1 Het verzoek om goedkeuring van de voorgenomen juridische scheiding gaat in elk geval vergezeld van:

      a. een voorstel voor die scheiding en een schriftelijke toelichting daarop;

      b. de gegevens over de beoogde toepassing van het bepaalde bij en krachtens de [artikelen 82][ref1] en [83][ref2];

      c. een overzicht van de woongelegenheden van de toegelaten instelling met een huurprijs van ten hoogste het in
      [artikel 13, eerste lid, onderdeel a, van de Wet op de huurtoeslag][ref3] genoemde bedrag, waarvan de waardering
      van de kwaliteit, bedoeld in [artikel 5 van het Besluit huurprijzen woonruimte][ref4], kan leiden tot een huurprijs
      die hoger is dan dat bedrag, die zij voornemens is in een woningvennootschap onder te brengen;

      d. de zienswijzen daarop van de personen en instanties, bedoeld in [artikel 84, eerste lid][ref5], en, in geval van
      een negatieve zodanige zienswijze, een onderbouwde reactie daarop van de toegelaten instelling, dan wel, bij het
      uitgebleven zijn van een zienswijze, bescheiden waaruit blijkt dat zij om die zienswijze heeft gevraagd;

      e. de adviezen, bedoeld in [artikel 5, eerste lid, van de Wet op het overleg huurders verhuurder][ref6], en, in
      geval van een negatief zodanig advies, een onderbouwde reactie daarop van de toegelaten instelling, dan wel, bij
      het uitgebleven zijn van een advies, bescheiden waaruit blijkt dat zij om dat advies heeft gevraagd en

      f. de ontwerpstatuten van de beoogde woningvennootschappen.

      2 In de toelichting op het voorstel voor de voorgenomen juridische scheiding wordt in elk geval opgenomen:

      a. de motieven voor die scheiding;

      b. de motieven voor het bij die scheiding toepassing geven aan
      [artikel 50a, tweede lid, tweede volzin, van de wet][ref7], waarbij in elk geval wordt ingegaan op:

      1°. het door de toegelaten instelling na die toepassing kunnen naleven van
      [artikel 48, eerste lid, eerste volzin, van de wet][ref8] en

      2°. het door die toepassing bijdragen aan het beschikbaar komen van geliberaliseerde woongelegenheden
      voor huishoudens met een huishoudinkomen dat hoger is dan de betrokken inkomensgrens, genoemd in
      [artikel 16, eerste lid][ref9];

      c. een overzicht van haar werkzaamheden, baten, lasten, activa en passiva, bedoeld in
      [artikel 50a, tweede lid, tweede volzin, van de wet][ref10], die zij voornemens is in de woningvennootschap
      onder te brengen, waarin zijn opgenomen de huurprijs en de waardering van de kwaliteit, bedoeld in
      [artikel 5 van het Besluit huurprijzen woonruimte][ref11], van de betrokken woongelegenheden;

      d. een uiteenzetting over de organisatorische, bestuurlijke en financiële relaties die als gevolg van die scheiding
      tussen de toegelaten instelling en de woningvennootschappen zullen bestaan;

      e. een uiteenzetting over de beoogde prestaties op het terrein van de volkshuisvesting van de toegelaten instelling
      en de woningvennootschappen na die scheiding, inhoudende een uiteenzetting over de wijze waarop de toegelaten
      instelling toepassing zal geven aan [artikel 42, eerste lid, eerste volzin, van de wet][ref12];

      f. een uiteenzetting over de financiële continuïteit van de toegelaten instelling en de woningvennootschappen na
      die scheiding, mede inhoudende een uiteenzetting over de financiële gevolgen van de in verband met die scheiding
      verwachte wijzigingen in het beleid van de toegelaten instelling;

      g. een uiteenzetting over de mogelijkheden voor en de bereidheid van financiële instellingen om de
      woningvennootschappen financiële middelen te verschaffen ten behoeve van de uitvoering van hun werkzaamheden en

      h. een uiteenzetting over het beleid dat de woningvennootschappen beogen te voeren inzake het gewenste op hun
      aandelen te behalen rendement, dat mede is gebaseerd op de mogelijkheden, bedoeld in onderdeel g, en dat is gericht
      op het door die woningvennootschappen kunnen uitkeren van dividend aan de toegelaten instelling en haar andere
      aandeelhouders.

      3 Bij ministeriële regeling kunnen nadere voorschriften worden gegeven omtrent de toepassing van dit artikel.


