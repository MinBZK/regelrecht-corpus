        artikel: '45'
  - number: '47'
    text: |-
      1 Tot de diensten, bedoeld in [artikel 45, tweede lid, onderdeel c, van de wet][ref1], behoren mede de in de
      [bijlage bij het Besluit servicekosten](onbekend) genoemde zaken en diensten.

      2 Diensten als bedoeld in [artikel 45, tweede lid, onderdeel c, onder 1° en 2°, van de wet][ref2] mogen
      uitsluitend worden geleverd aan:

      a. bewoners van eigen woongelegenheden;

      b. bewoners van woongelegenheden van een toegelaten instelling;

      c. leden van verenigingen van eigenaars als bedoeld in
      [artikel 112 lid 1 onder e van Boek 5 van het Burgerlijk Wetboek][ref3];

      d. bewoners van woongelegenheden die bouwkundig een geheel vormen met de eigen woongelegenheden of de
      woongelegenheden van een toegelaten instelling;

      e. indien de diensten worden geleverd door een aan een toegelaten instelling verbonden onderneming, bewoners van
      woongelegenheden van een verbonden onderneming waarvan alle aandelen door toegelaten instellingen worden gehouden;

      f. bewoners van woongelegenheden als bedoeld in [artikel 45, zevende lid, van de wet][ref4];

      g. leden van wooncoöperaties waaraan de toegelaten instelling woongelegenheden heeft vervreemd voor zover het
      werkzaamheden, bedoeld in [artikel 48, eerste lid, onderdeel b][ref5], betreft.


