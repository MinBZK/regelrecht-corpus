  - number: '24'
    text: |-
      1 Onze Minister kan besluiten om een besluit als bedoeld in
      [artikel 27, eerste lid, aanhef en onderdeel a, van de wet][ref1], niet goed te keuren, indien:

      a. indien van toepassing: de verklaring omtrent het gedrag, bedoeld in
      [artikel 28 van de Wet justitiële en strafvorderlijke gegevens][ref2] van de beoogde verkrijger of begunstigde,
      of de verklaring, bedoeld in [artikel 23, eerste lid, onderdeel e][ref3], niet is overgelegd, en, in geval van een
      vervreemding, indien en zolang [artikel 4][ref4] van toepassing is.

      b. het belang van de volkshuisvesting naar zijn oordeel beter is gediend met het niet nemen van een zodanig besluit
      ten aanzien van de betrokken onroerende zaak of het nemen van een zodanig besluit ten aanzien van die zaak, waarbij
      de verkrijger of de begunstigde een ander is dan de blijkens het ter goedkeuring voorgelegde besluit beoogde
      verkrijger of begunstigde;

      c. dat besluit er naar zijn oordeel toe zou leiden dat de financiële continuïteit van de toegelaten instelling niet
      voldoende is gewaarborgd; of

      d. de betrokken over te leggen bescheiden niet zijn overgelegd of onjuist zijn, of indien een overgelegde andere
      verklaring of een overgelegde zienswijze daartoe naar zijn oordeel aanleiding geeft.

      2 Onze Minister kan besluiten om een besluit als bedoeld in
      [artikel 27, eerste lid, aanhef en onderdeel a, van de wet][ref5] niet goed te keuren, bij vervreemding van:

      a. een blijvend gereguleerde daeb-woongelegenheid of een blijvend gereguleerd daeb-complex, indien:

      1°. deze wordt vervreemd tegen een prijs die lager is dan de getaxeerde marktwaarde; of

      2°. deze wordt vervreemd zonder het beding dat die woongelegenheid of de van dat complex deel uitmakende
      woongelegenheden ten minste zeven jaar na de eigendomsoverdracht als gevolg van die vervreemding voor verhuur
      bestemd blijven.

      b. een potentieel te liberaliseren daeb-woongelegenheid of potentieel te liberaliseren daeb-complex, indien deze
      wordt vervreemd tegen een prijs die lager is dan de getaxeerde marktwaarde.

      c. een niet-daeb-woongelegenheid of niet-daeb-complex, indien deze wordt vervreemd tegen een prijs die lager is dan
      de getaxeerde marktwaarde.

      d. een verhuurd gebouw dat een maatschappelijke gebruiksbestemming heeft als bedoeld in
      [artikel 45, tweede lid, onderdeel d, van de wet][ref6], of een verhuurd gebouw met een zorgfunctie als bedoeld
      in [bijlage 2][ref7] bij dit besluit dat functioneel een eenheid vormt met woongelegenheden als bedoeld in
      [artikel 47, eerste lid, onderdeel d, van de wet][ref8], indien deze wordt vervreemd tegen een prijs die lager is
      dan de getaxeerde marktwaarde.

      3 In afwijking van het eerste en tweede lid keurt Onze Minister een verzoek om een goedkeuring
      omtrent de vervreemding van een gebouw dat de status heeft van rijksmonument als bedoeld in
      [artikel 1.1. van de Erfgoedwet][ref9], of de status heeft van monument op grond van een provinciale of
      gemeentelijke verordening, goed, indien het wordt vervreemd:

      a. aan een rechtspersoon met de status van professionele organisatie voor monumentenbehoud;

      b. tegen een prijs van ten minste de getaxeerde waarde die zij met behoud van haar huidige bestemming
      vertegenwoordigt; en

      c. onder het beding dat zij gedurende ten minste zeven jaar na de eigendomsoverdracht als gevolg van die
      vervreemding voor verhuur bestemd blijft.

      4 Onze Minister kan het bepaalde bij of krachtens het eerste en tweede lid buiten toepassing laten, of bepalen
      dat het door de toegelaten instelling overleggen van bescheiden waaruit blijkt dat een aanbieding aan de huurder
      als bedoeld in het [tweede lid, onderdeel a, van de artikelen 23][ref10] of [23c][ref11] heeft plaatsgevonden
      niet vereist is, indien ten aanzien van de betrokken toegelaten instelling een situatie als bedoeld in
      [artikel 29, eerste lid, van de wet][ref12], of [57, eerste lid, onderdeel a, van de wet][ref13], van toepassing
      is.

      5 Bij ministeriële regeling kunnen nadere voorschriften worden gegeven omtrent de toepassing van het tweede en
      vierde lid.


