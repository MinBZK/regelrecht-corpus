  - number: '122'
    text: |-
      Onze Minister stelt de betrokken raden van commissarissen en besturen van dochtermaatschappijen op de hoogte van:

      a. zijn voornemens om toepassing te geven aan [artikel 19, vierde lid][ref1], [48, achtste lid][ref2],
      [61d][ref3], [61g, eerste, tweede of derde lid][ref4], [61h, eerste lid][ref5], [104a, eerste lid][ref6],
      [105, eerste lid][ref7], of [120b van de wet][ref8], alsmede zijn besluiten daartoe;

      b. zijn voornemens om een goedkeuring als bedoeld in [artikel 21, eerste lid][ref9],
      [27, eerste lid][ref10], [41b, eerste lid][ref11], [49a, tweede lid][ref12], [50b, eerste lid][ref13], of
      [53, tweede lid, eerste volzin, van de wet][ref14], niet te verlenen, alsmede zijn besluiten daartoe;

      c. zijn activiteiten en voorgenomen activiteiten jegens toegelaten instellingen ten aanzien van welke een situatie
      als bedoeld in [artikel 29, eerste lid, van de wet][ref15] of [57, eerste lid, onderdeel a, van de wet][ref16] van
      toepassing is;

      d. de saneringsplannen die hij heeft goedgekeurd;

      e. zijn oordeel over de stukken, bedoeld in [artikel 38, eerste, tweede en derde lid, van de wet][ref17], indien
      daaruit kan worden opgemaakt dat hij van oordeel is dat de betrokken toegelaten instellingen schade aan het belang
      van de volkshuisvesting hebben berokkend, en

      f. zijn andere activiteiten, besluiten en voornemens daartoe, in de gevallen waarin hij van oordeel is dat
      kennisneming daarvan door de betrokken raden van commissarissen of besturen van dochtermaatschappijen uit het
      oogpunt van een goede uitvoering van hun toezicht noodzakelijk is.


