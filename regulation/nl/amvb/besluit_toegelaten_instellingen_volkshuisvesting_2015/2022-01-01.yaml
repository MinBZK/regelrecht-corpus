  - number: '57'
    text: |-
      De categorieën van personen, bedoeld in [artikel 48, eerste lid, eerste volzin, van de wet][ref1], zijn:

      a. de categorieën van personen, genoemd in [artikel 54, tweede lid, onderdelen a en b][ref2];

      b. personen die zijn of worden gehuisvest op grond van een indicatiebesluit als bedoeld in
      [artikel 1.1.1 van de Wet langdurige zorg][ref3] voor:

      1°. verblijf als bedoeld in [artikel 3.1.1, eerste lid, onderdeel a, van die wet][ref4] of

      2°. direct oproepbare assistentie bij algemene dagelijkse levensverrichtingen als bedoeld in
      [artikel 10.1.4 van die wet][ref5].

      c. personen die op grond van [artikel 2.1 van het Besluit zorgverzekering][ref6] voor een periode van ten minste
      een jaar ten minste 10 uur per week verpleging of verzorging als bedoeld in [artikel 2.10 van dat besluit][ref7]
      ontvangen en

      d. personen die zijn of worden gehuisvest op grond van een indicatiebesluit als bedoeld in
      [artikel 1 van het Zorgindicatiebesluit][ref8] zoals dat luidde op 31 december 2014 voor:

      1°. verblijf als bedoeld in [artikel 9 van het Besluit zorgaanspraken AWBZ][ref9] zoals dat luidde op die datum of

      2°. ADL-assistentie als bedoeld in [artikel 34 van dat besluit][ref10] zoals dat luidde op die datum.


