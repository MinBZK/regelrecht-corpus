      1 De toegelaten instellingen zijn niet betrokken bij de volkshuisvesting buiten Nederland waarop
      [artikel 40 van de wet][ref1] niet van toepassing is.

      2 Garanties die met goedkeuring van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer, Onze
      Minister voor Wonen, Wijken en Integratie, Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties of Onze
      Minister voor 1 juli 2015 zijn verleend in verband met een betrokkenheid als bedoeld in het eerste lid, kunnen
      worden aangesproken overeenkomstig de voorwaarden waaronder zij zijn verleend.


