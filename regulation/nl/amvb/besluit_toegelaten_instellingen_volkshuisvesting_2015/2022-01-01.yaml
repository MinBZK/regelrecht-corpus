  - number: '56'
    text: |-
      1 De toegelaten instelling of een rechtspersoon of vennootschap als bedoeld in [artikel 54, derde lid][ref1],
      geeft toepassing aan het bepaalde bij en krachtens [artikel 46, tweede lid, van de wet][ref2], overeenkomstig
      [bijlage 4][ref3] bij dit besluit. Zij geeft hieraan slechts toepassing nadat degene die als huurder een
      woongelegenheid waarop dat bepaalde van toepassing is wenst te betrekken, ten behoeve van de vaststelling of hij in
      de zin van dat bepaalde in aanmerking komt voor een huurtoeslag in de zin van de [Wet op de huurtoeslag][ref4], aan
      haar heeft overgelegd:

      a. een door hem opgestelde en ondertekende verklaring over de samenstelling van zijn huishouden;

      b. gegevens waaruit het huishoudinkomen blijkt, of op grond waarvan dat inkomen zo nauwkeurig als redelijkerwijs
      mogelijk kan worden geschat; en

      c. indien de verhuurder heeft verzocht om toepassing van [artikel 54a][ref5], gegevens waaruit de in dat artikel
      bedoelde grondslag sparen en beleggen van zijn huishouden blijkt.

      2 De toegelaten instelling voegt in haar administratie, onverwijld na de toepassing, bedoeld in het eerste lid,
      bij de in verband daarmee afgegeven verklaring, bedoeld in het eerste lid, onderdeel a, een door haar ondertekende
      verklaring dat zij geen redenen heeft om aan de juistheid van de eerstbedoelde verklaring te twijfelen.

      3 Het eerste lid is niet van toepassing indien degenen die de woongelegenheid wensen te betrekken
      uitsluitend vreemdelingen zijn die in Nederland rechtmatig verblijf hebben als bedoeld in
      [artikel 8, onderdelen a tot en met d, van de Vreemdelingenwet 2000][ref6] en behoren tot de groep
      verblijfsgerechtigden die in aanmerking wordt genomen bij het bepalen van de taakstelling overeenkomstig
      [artikel 29, eerste lid, van de Huisvestingswet 2014][ref7].

      4 Het eerste lid, aanhef en onderdeel b, is niet van toepassing:

      a. indien degenen die de woongelegenheid wensen te betrekken uitsluitend, en ten hoogste twee, personen zijn
      die studiefinanciering op grond van de [Wet studiefinanciering 2000][ref8] ontvangen of een tegemoetkoming als
      bedoeld in [artikel 1.1, eerste lid, van de Wet tegemoetkoming onderwijsbijdrage en schoolkosten][ref9], en degene
      die als huurder de woongelegenheid wenst te betrekken bewijzen daarvan aan de toegelaten instelling of aan een
      rechtspersoon of vennootschap als bedoeld in [artikel 54, derde lid][ref10], heeft overgelegd, en

      b. indien degenen die de woongelegenheid wensen te betrekken van buiten Nederland afkomstige
      personen zijn, die zich hebben ingeschreven bij een instelling voor hoger onderwijs in de zin van de
      [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref11], en bewijzen daarvan of verklaringen ter zake aan
      de toegelaten instelling of aan een rechtspersoon of vennootschap als bedoeld in [artikel 54, derde lid][ref12],
      zijn overgelegd.

      5 De gegevens, bedoeld in het eerste lid, onderdeel b, zijn, behoudens het zesde en zevende lid:

      a. in geval van vreemdelingen als bedoeld in het derde lid: een inkomstenverklaring, welke niet langer dan zes
      maanden voordat de overeenkomst van huur en verhuur zou moeten ingaan is afgegeven door het Centraal Orgaan opvang
      asielzoekers, bedoeld in [artikel 2 van de Wet Centraal Orgaan opvang asielzoekers][ref13];

      b. in geval van personen die algemene bijstand ontvangen op grond van de [Participatiewet][ref14]: een bewijs van
      toekenning van algemene bijstand;

      c. in geval van andere personen dan de personen, bedoeld in de onderdelen a en b: de
      aanslag of voorlopige aanslag inkomstenbelasting of de inkomensgegevens, bedoeld in
      [artikel 21, onderdeel e, van de Algemene wet inzake rijksbelastingen][ref15], van ieder van die personen, over een
      van de twee kalenderjaren die direct voorafgaan aan het kalenderjaar waarin de overeenkomst van huur van verhuur
      zou moeten ingaan.

      6 Voor zover gegevens als bedoeld in het vijfde lid, onderdeel c, niet beschikbaar zijn blijkens een schriftelijke
      verklaring van een functionaris van de rijksbelastingdienst die bij regeling van de Minister van Financiën als
      inspecteur is aangewezen, zijn de gegevens, bedoeld in het eerste lid, onderdeel b, voorts:

      a. die verklaring en

      b. indien een van degenen die de betrokken woongelegenheid wensen te betrekken dusdanig kort een inkomen in
      Nederland geniet of dusdanig recent een inkomen in Nederland genoten heeft, dat dat inkomen nog niet bekend is bij
      de rijksbelastingdienst:

      1°. een door degene die als huurder die woongelegenheid wenst te betrekken opgestelde en ondertekende
      inkomensverklaring waarin ten minste het door hem geschatte huishoudinkomen is opgenomen en, indien die verklaring
      melding maakt van het benutten van fiscale aftrekposten of van winst uit onderneming, stukken die aantonen dat die
      verklaring met betrekking tot die aspecten juist en volledig is, en

      2°. hetzij een jaaropgave van de werkgever of werkgevers van degenen, bedoeld in de aanhef, over het kalenderjaar
      dat direct voorafgaat aan het kalenderjaar waarin de overeenkomst ter zake van een verhuur als bedoeld in
      [artikel 46, tweede lid, eerste volzin, van de wet][ref16] zou moeten ingaan, dan wel een jaaropgave over
      eerstbedoeld kalenderjaar van de instantie of instanties die aan diegenen een uitkering verstrekken, hetzij
      loonstroken of uitkeringsspecificaties van die werkgever of werkgevers respectievelijk die instantie of instanties
      met betrekking tot één kalendermaand, welke maand geen eerdere is dan de zesde kalendermaand voorafgaand aan de
      dagtekening van de verklaring, bedoeld onder 1°.

      7 De huurder kan de toegelaten instelling of een rechtspersoon of vennootschap als bedoeld in
      [artikel 54, derde lid][ref17], verzoeken om andere gegevens dan de gegevens, bedoeld in het vijfde lid, te
      gebruiken voor de vaststelling van het huishoudinkomen indien uit de gegevens, bedoeld in het vijfde lid, een
      huishoudinkomen blijkt dat:

      a. hoger is dan het voor het betrokken huishouden toepasselijke bedrag, bedoeld in
      [artikel 14 van de Wet op de huurtoeslag][ref18], terwijl naar het oordeel van degene die als huurder de betrokken
      woongelegenheid wenst te betrekken het huishoudinkomen niet hoger is dan dat bedrag, of

      b. lager of gelijk is aan het voor het betrokken huishouden toepasselijke bedrag, bedoeld in
      [artikel 14 van de Wet op de huurtoeslag][ref19], terwijl naar het oordeel van degene die als huurder de betrokken
      woongelegenheid wenst te betrekken het huishoudinkomen hoger is dan dat bedrag.

      In deze gevallen overlegt de huurder dat oordeel met een onderbouwing daarvan aan de toegelaten instelling of aan
      een rechtspersoon of vennootschap als bedoeld in [artikel 54, derde lid][ref20], in welk geval de gegevens, bedoeld
      in het eerste lid, aanhef en onderdeel b, voorts zijn de gegevens overeenkomstig het zesde lid, onderdeel b, onder
      1° en 2°.

      8 In afwijking van het eerste lid kan een rechtspersoon of vennootschap als eerstbedoeld
      in [artikel 54, derde lid][ref21], overeenkomsten ter zake van verhuur als bedoeld in
      [artikel 46, tweede lid, eerste volzin, van de wet][ref22] aangaan zonder dat daaraan voorafgaand een verklaring
      en gegevens als bedoeld in het eerste lid, onderdelen a en b, zijn overgelegd, indien degene die als huurder een
      woongelegenheid waarop het bepaalde bij en krachtens [artikel46, tweede lid, eerste volzin, van de wet][ref23] van
      toepassing is, wenst te betrekken een onderdaan is van een lidstaat en voor het verrichten van arbeid in Nederland
      verblijft. Aan de eerste volzin kan slechts toepassing worden gegeven door een rechtspersoon of vennootschap
      die beschikt over een keurmerk van de Stichting keurmerk internationale arbeidsbemiddeling of van de Stichting
      normering flexwonen en bij het aangaan van de betrokken overeenkomst van huur en verhuur een bewijs van de
      toekenning van dat keurmerk aan de toegelaten instelling overlegt.

      9 De rechtspersoon of vennootschap, eerstbedoeld in [artikel 54, derde lid][ref24], legt op de laatste dag van elk
      kalenderkwartaal ten aanzien van de huurders, bedoeld in het achtste lid, met wie in dat kwartaal een overeenkomst
      van huur en verhuur is aangegaan aan de toegelaten instelling over:

      a. het adres van de woongelegenheid die de huurder, bedoeld in het achtste lid, heeft betrokken;

      b. de naam van de huurder en de datum waarop de huurder de woongelegenheid heeft betrokken;

      c. een verklaring over de samenstelling van het huishouden van de huurder, en

      d. gegevens waaruit het huishoudinkomen van de huurder en in voorkomend geval de grondslag sparen en beleggen
      blijkt, of op grond waarvan dat inkomen en in voorkomend geval die grondslag zo nauwkeurig als redelijkerwijs
      mogelijk kan worden geschat.

      10 De in [bijlage 4][ref25] genoemde index I1 en index I2 worden bij ministeriële regeling vastgesteld
      en jaarlijks bij ministeriële regeling gewijzigd met het percentage waarmee per gelijke datum het in
      [artikel 18, eerste lid, onderdeel d, van de Wet op de huurtoeslag][ref26] genoemde bedrag wordt gewijzigd.


