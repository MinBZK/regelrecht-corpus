  - number: '84'
    text: |-
      1 De toegelaten instelling stelt, voordat zij een verzoek om goedkeuring van een voorgenomen juridische
      scheiding indient, de colleges van burgemeester en wethouders van de gemeente waar zij haar woonplaats heeft,
      van de gemeenten waar zij feitelijk werkzaam is, van die waar woningvennootschappen na die scheiding hun
      woonplaats zullen hebben en van die waar zij na die scheiding feitelijk werkzaam zullen zijn, de betrokken
      bewonersorganisaties en de huurders van haar gebouwen die een maatschappelijke gebruiksbestemming hebben als
      bedoeld in [artikel 45, tweede lid, onderdeel d, van de wet][ref1] in de gelegenheid om hun zienswijze op die
      scheiding te geven. De personen en instanties, bedoeld in de eerste volzin, kunnen binnen zes weken hun zienswijzen
      aan de toegelaten instelling doen toekomen. De betrokken bewonersorganisaties kunnen binnen zes weken hun adviezen,
      bedoeld in [artikel 5, eerste lid, van de Wet op het overleg huurders verhuurder][ref2], aan haar doen toekomen.

      2 De toegelaten instelling verstrekt de personen en instanties, bedoeld in het eerste lid, eerste volzin, alle
      inlichtingen die redelijkerwijs kunnen bijdragen aan het zich vormen van hun zienswijze, of aan het opstellen van
      een advies als bedoeld in [artikel 5, eerste lid, van de Wet op het overleg huurders verhuurder][ref3].

      3 Bij ministeriële regeling kunnen nadere voorschriften worden gegeven omtrent de toepassing van het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0009810#Artikel5
