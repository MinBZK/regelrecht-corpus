  - number: '102'
    text: |-
      1 Onze Minister kan bepalen dat het toetsingskader van Aedes vereniging van woningcorporaties inzake de kosten van
      de bedrijfsvoering van toegelaten instellingen van toepassing is op alle toegelaten instellingen.

      2 Bij ministeriële regeling kunnen nadere voorschriften worden gegeven omtrent de berekening van de kosten, bedoeld
      in het eerste lid, en de toegestane hoogte daarvan.
    url: https://wetten.overheid.nl/BWBR0036702/2022-01-01#Artikel102
  - number: '103'
    text: |-
      1 Het reglement, bedoeld in [artikel 55a, tweede lid, van de wet][ref1], wordt vastgesteld door het bestuur. Het is
      onderworpen aan de goedkeuring van de raad van commissarissen en Onze Minister.

      2 Een wijziging van een reeds vastgesteld en goedgekeurd reglement is onderworpen aan de goedkeuring van de raad
      van commissarissen en wordt verantwoord in het jaarverslag, bedoeld in [artikel 36, eerste lid, van de wet][ref2].

      3 Een wijziging als bedoeld in het tweede lid die geheel of mede betrekking heeft op het beleid en beheer van
      het aantrekken of aanhouden van financiële derivaten door de toegelaten instelling, de dochtermaatschappij of
      de verbonden onderneming waarvan de toegelaten instelling meer dan de helft van de bestuurders kan benoemen of
      ontslaan, is tevens onderworpen aan de goedkeuring van Onze Minister.

      4 Bij ministeriële regeling kunnen nadere voorschriften worden gegeven omtrent de toepassing van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel55a
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel36
