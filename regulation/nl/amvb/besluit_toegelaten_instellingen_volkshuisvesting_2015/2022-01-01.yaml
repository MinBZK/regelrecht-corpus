  - number: '118'
    text: |-
      1 Onze Minister kan op verzoek van een toegelaten instelling de op grond van
      [artikel 58, tweede lid, van de wet][ref1] verschuldigde bijdrage kwijtschelden, indien die toegelaten instelling
      naar zijn oordeel niet over de financiële middelen beschikt om haar werkzaamheden te kunnen voortzetten.

      2 Onze Minister kan op verzoek van een toegelaten instelling een gedeelte van de op grond van
      [artikel 58, tweede lid, van de wet][ref2] verschuldigde bijdrage kwijtschelden, indien naar zijn oordeel de
      verzoekende toegelaten instelling gedurende de periode, bedoeld in [artikel 111, vierde lid][ref3], bij een andere
      toegelaten instelling betrokken is geweest door middel van:

      a. het verwerven van woongelegenheden als bedoeld in [artikel 47, eerste lid, onderdelen b en c, van de wet][ref4]
      van die toegelaten instelling tegen ten minste de marktwaarde in verhuurde staat van die woongelegenheden op het
      tijdstip van die verwerving en onder het beding deze vanaf dat tijdstip ten minste zeven jaar te zullen verhuren;

      b. het financieel bijdragen aan werkzaamheden van die toegelaten instelling, indien naar
      zijn oordeel zonder dat bijdragen aan die toegelaten instelling een subsidie als bedoeld in
      [artikel 57, eerste lid, aanhef en onderdeel b, van de wet][ref5] had kunnen worden verstrekt, of

      c. het fuseren met die toegelaten instelling.

      3 De kwijtschelding, bedoeld in het tweede lid, bedraagt ten hoogste:

      a. in geval van een verwerving als bedoeld in het tweede lid, onderdeel a: 20% van de gemiddelde WOZ-waarde van de
      verworven woongelegenheden op het tijdstip van die verwerving;

      b. in geval van een financieel bijdragen als bedoeld in het tweede lid, onderdeel b: de door Onze Minister geraamde
      subsidie, bedoeld in dat onderdeel, respectievelijk

      c. in geval van een fusie als bedoeld in het tweede lid, onderdeel c: de subsidie, bedoeld in
      [artikel 57, eerste lid, aanhef en onderdeel a, van de wet][ref6], die de verzoekende toegelaten instelling naar
      het oordeel van Onze Minister had kunnen verkrijgen, indien zij niet was gefuseerd met een toegelaten instelling
      als bedoeld in de aanhef van het tweede lid.

      4 Het tweede lid vindt geen toepassing, indien de uitgaven, gemoeid met de in het tweede lid, onderdelen a en
      b, bedoelde transacties, en de gedorven subsidie, bedoeld in het tweede lid, onderdeel b, gezamenlijk in de twee
      kalenderjaren die direct voorafgaan aan de indiening van het verzoek minder bedragen dan 0,5% van de WOZ-waarde van
      de onroerende zaken in eigendom van de verzoekende toegelaten instelling op 31 december van het kalenderjaar dat
      voorafgaat aan het kalenderjaar waarover de bijdrage verschuldigd is.

      5 De kwijtschelding betreft ten hoogste de verschuldigde bijdragen gedurende de vijf kalenderjaren die direct
      volgen op het jaar waarin het verzoek is ingediend.

      6 Indien Onze Minister een verzoek als bedoeld in het eerste of tweede lid inwilligt en de bijdrage in het jaar
      van het verzoek reeds door de toegelaten instelling voldaan is, betaalt hij een als gevolg daarvan ten onrechte
      betaald bedrag terug aan de toegelaten instelling, vermeerderd met de wettelijke rente van niet-handelstransacties
      vanaf het tijdstip van betaling van de bijdrage tot het tijdstip van terugbetaling van de onverschuldigd betaalde
      bijdrage.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel58
