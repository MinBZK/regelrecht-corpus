    text: |-
      1 De waardering, bedoeld in [artikel 35, tweede lid, van de wet][ref1], vindt plaats tegen de modelmatige
      marktwaarde, en onder gebruikmaking van een berekeningssystematiek door middel waarvan de toekomstige inkomende en
      uitgaande kasstromen contant worden gemaakt naar het heden.

      2 Bij de waardering, bedoeld in [artikel 35, tweede lid, van de wet][ref2], wordt onderscheid gemaakt tussen:

      a. woongelegenheden, met uitzondering van woongelegenheden als bedoeld in
      [artikel 47, eerste lid, onderdeel d, van de wet][ref3];

      b. gebouwen als bedoeld in [artikel 45, tweede lid, onderdelen d en g, van de wet][ref4];

      c. parkeervoorzieningen en

      d. woongelegenheden als bedoeld in [artikel 47, eerste lid, onderdeel d, van de wet][ref5].

      3 Ten behoeve van de waardering wordt, behoudens in bij ministeriële regeling bepaalde gevallen, een waarde bepaald
      voor zowel het geval dat de toegelaten instelling de onroerende zaak gedurende een bij ministeriële regeling
      bepaald tijdvak blijft verhuren, als het geval dat de toegelaten instelling die zaak na het in dat tijdvak eindigen
      van een overeenkomst van huur en verhuur zal vervreemden. De modelmatige marktwaarde is de hoogste van die waarden.

      4 Bij ministeriële regeling worden nadere voorschriften gegeven omtrent de toepassing van dit artikel, welke
      voorschriften kunnen afwijken van het eerste, tweede en derde lid of voor bij die regeling te bepalen categorieën
      van toegelaten instellingen verschillend kunnen worden vastgesteld, een en ander met het oog op het bewerkstelligen
      van een goede verhouding tussen de lasten voor toegelaten instellingen om te komen tot de waardering, bedoeld in
      [artikel 35, tweede lid, van de wet][ref6], en een goede uitvoering van het toezicht.


