    text: |-
      1 De toegelaten instelling maakt in elk stuk tot het verstrekken waarvan zij ingevolge de wet of dit besluit
      verplicht is, en in elk van haar reglementen inzichtelijk welke feiten, omstandigheden en bepalingen betrekking
      hebben op hetzij haar daeb-tak, hetzij haar niet-daeb-tak, hetzij haar gehele organisatie.

      2 Onze Minister maakt in elk besluit jegens en in elke andere mededeling aan een toegelaten instelling inzichtelijk
      welke elementen daarvan betrekking hebben op hetzij haar daeb-tak, hetzij haar niet-daeb-tak, hetzij haar gehele
      organisatie.

      3 Het eerste en tweede lid zijn, ten aanzien van toegelaten instellingen op welke
      [artikel 49, eerste lid, eerste volzin, van de wet][ref1] ingevolge de tweede volzin van dat lid niet van
      toepassing is, van overeenkomstige toepassing op hetzij hun werkzaamheden die behoren respectievelijk niet behoren
      tot de diensten van algemeen economisch belang, hetzij haar gehele organisatie.

      4 Dit artikel is niet van toepassing, indien en zodra de toegelaten instelling toepassing heeft gegeven aan
      [artikel 50a van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel50a
