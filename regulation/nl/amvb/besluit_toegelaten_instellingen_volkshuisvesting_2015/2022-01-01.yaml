  - number: '48'
    text: |-
      1 De toegelaten instelling stelt uitsluitend financiële middelen ter beschikking in de vorm van:

      a. tegemoetkomingen in de kosten van activiteiten die door de bewoners van haar woongelegenheden worden
      georganiseerd:

      1°. in het belang van het behoud of de verbetering van die woongelegenheden of de direct daaraan grenzende
      omgeving, en

      2°. gericht op ontmoeting van bewoners van die woongelegenheden;

      b. reserveringen voor leden van wooncoöperaties met een huishoudinkomen dat niet hoger is dan de betrokken
      inkomensgrens, genoemd in [artikel 16, eerste lid][ref1], in verband met het onderhoud aan hun woongelegenheden;

      c. tegemoetkomingen in het blijkens een geldleningsovereenkomst te betalen bedrag aan rente over een hypothecaire
      geldlening, overeenkomstig het tweede lid, of

      d. tegemoetkomingen ter voldoening aan het bepaalde in [artikel 2, derde lid][ref2].

      2 Tegemoetkomingen als bedoeld in het eerste lid, onderdeel c, worden uitsluitend verstrekt:

      a. over ten hoogste 20% van de verwervingskosten overeenkomstig de onder auspiciën van de Stichting Waarborgfonds
      Eigen Woningen ontwikkelde Nationale Hypotheek Garantie, welke kosten worden gefinancierd door een instelling die
      behoort tot een categorie als bedoeld in het bepaalde bij en krachtens [artikel 13, eerste en tweede lid][ref3], of
      aan welke een vergunning als bedoeld in [artikel 2:60 van de Wet op het financieel toezicht][ref4] is verleend;

      b. in geval van het verstrekt zijn van de hypothecaire geldlening onder de voorwaarden en normen van de onder
      auspiciën van de Stichting Waarborgfonds Eigen Woningen ontwikkelde Nationale Hypotheek Garantie;

      c. aan instellingen als bedoeld in onderdeel a ten behoeve van personen die voor de eerste maal als eigenaar een
      woning bewonen, zolang het huishoudinkomen van die personen niet hoger is dan de betrokken inkomensgrens, genoemd
      in [artikel 16, eerste lid][ref5];

      d. indien niet tevens een tegemoetkoming wordt verstrekt:

      1°. op grond van de [Wet bevordering eigenwoningbezit][ref6] of

      2°. door de toegelaten instelling, voor zover ertoe leidend dat de woning aan een persoon als bedoeld in onderdeel
      c wordt vervreemd tegen een prijs die lager is dan 90% van de getaxeerde marktwaarde vrij van huur en gebruik of de
      WOZ-waarde, of met het oogmerk een zodanige persoon anderszins zodanig te bevoordelen dat een dienovereenkomstige
      uitkomst wordt bereikt, en

      e. indien uit overeenkomsten tussen de betrokken persoon en een instelling als bedoeld in onderdeel a, en tussen
      die instelling en de toegelaten instelling, blijkt dat de tegemoetkoming wordt verlaagd of beëindigd, indien
      het huishoudinkomen van die persoon daartoe aanleiding geeft blijkens een periodieke beoordeling van dat inkomen
      overeenkomstig in die overeenkomsten neergelegde bepalingen.

      3 Bij ministeriële regeling kan worden bepaald onder welke modellen voor of bepalingen in overeenkomsten als
      bedoeld in het tweede lid, onderdeel e, een tegemoetkoming als bedoeld in het eerste lid, onderdeel c, kan worden
      verstrekt.


