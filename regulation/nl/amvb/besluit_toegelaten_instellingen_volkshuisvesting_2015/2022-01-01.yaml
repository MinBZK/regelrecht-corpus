      1 De bijdrage, bedoeld in [artikel 58, tweede lid, van de wet][ref1], voor alle toegelaten instellingen gezamenlijk
      bestaat uit de som van:

      a. een door Onze Minister begroot bedrag ten behoeve van het verstrekken van subsidies als bedoeld in
      [artikel 57, eerste lid, aanhef en onderdeel a, van de wet][ref2];

      b. een door hem begroot bedrag ten behoeve van het verstrekken van subsidies als bedoeld in
      [artikel 57, eerste lid, aanhef en onderdeel b, van de wet][ref3] en

      c. een door hem begroot bedrag ten behoeve van de dekking van de kosten die zijn gemoeid met de verstrekking van
      subsidies als bedoeld in [artikel 57, eerste lid, van de wet][ref4].

      2 Onze Minister begroot de bedragen, bedoeld in het eerste lid, zodanig, dat hij naar zijn oordeel over
      voldoende financiële middelen beschikt om uitvoering te geven aan [artikel 57, eerste lid, van de wet][ref5],
      met dien verstande dat het bedrag, bedoeld in het eerste lid, onderdeel a, en het bedrag, bedoeld in het
      eerste lid, onderdeel b, niet hoger is dan 5% onderscheidenlijk 1% van de gerealiseerde jaarhuuropbrengst van
      de woongelegenheden, als volgens het overzicht, bedoeld in [artikel 36a, vierde lid, van de wet][ref6], voor
      de bijdrageplichtige toegelaten instellingen gezamenlijk bepaald over het kalenderjaar voorafgaand aan het
      kalenderjaar waarover de bijdrage verschuldigd is.

      3 Onze Minister begroot de bedragen, bedoeld in het eerste lid, zo veel mogelijk aan de hand van de ingevolge
      [artikel 38, eerste lid, van de wet][ref7] aan hem gezonden bescheiden.

      4 Bij ministeriële regeling kunnen nadere voorschriften worden gegeven omtrent de toepassing van dit artikel.


