  - number: '106'
    text: |-
      1 Het reglement, bedoeld in [artikel 55a, tweede lid, van de wet][ref1], bepaalt dat de toegelaten instelling,
      de dochtermaatschappij en de verbonden onderneming waarvan de toegelaten instelling meer dan de helft van de
      bestuurders kan benoemen of ontslaan:

      a. inzake financiële derivaten, collegiale leningen en beleggingen geen rentevisie hanteren;

      b. financiële derivaten en beleggingsactiviteiten uitsluitend aantrekken en afstoten met als doel risico’s van het
      financiële beleid en beheer te beperken;

      c. geen financiële derivaten vervreemden, anders dan door het sluiten van derivaatposities, en

      d. geen gelden lenen met het doel deze uit te zetten bij dezelfde of een andere partij.

      2 Het reglement bepaalt voorts dat in of ten aanzien van financiële derivaten geen clausules worden gehanteerd, die
      op enigerlei wijze de uitoefening van het toezicht op toegelaten instellingen, dochtermaatschappijen en verbonden
      ondernemingen waarvan de toegelaten instelling meer dan de helft van de bestuurders kan benoemen of ontslaan kunnen
      belemmeren, en dat een toegelaten instelling die op het tijdstip waarop dit besluit in werking is getreden een
      derivatenportefeuille heeft die financiële derivaten met zodanige clausules bevat, een plan van aanpak heeft dat is
      gericht op het zo spoedig mogelijk afstoten van die derivaten.

      3 Onze Minister kan nadere eisen stellen aan het plan van aanpak, bedoeld in het tweede lid, en de te hanteren
      termijn voor het in dat lid bedoelde afstoten van financiële derivaten.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel55a
    url: https://wetten.overheid.nl/BWBR0036702/2022-01-01#Artikel106
    references:
