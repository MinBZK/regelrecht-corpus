  - number: '104'
    text: |-
      1 Het reglement, bedoeld in [artikel 55a, tweede lid, van de wet][ref1], bevordert dat het financiële beleid en
      beheer van de toegelaten instelling, de dochtermaatschappij en de verbonden onderneming waarvan de toegelaten
      instelling meer dan de helft van de bestuurders kan benoemen of ontslaan, dienstbaar is aan het bereiken van
      haar doelstellingen op het terrein van de volkshuisvesting en gericht is op het waarborgen van haar financiële
      continuïteit. Het reglement bevordert voorts het optimaal beheersen van financiële risico’s en het voorkomen van
      misbruik en oneigenlijk gebruik van wettelijke voorschriften.

      2 Het reglement bepaalt:

      a. de doelstellingen van het financiële beleid en beheer en de samenhang tussen die doelstellingen en de
      doelstellingen van de toegelaten instelling, de dochtermaatschappij en de verbonden onderneming waarvan de
      toegelaten instelling meer dan de helft van de bestuurders kan benoemen of ontslaan, op het terrein van de
      volkshuisvesting;

      b. dat de toegelaten instelling, de dochtermaatschappij en de verbonden onderneming waarvan de toegelaten
      instelling meer dan de helft van de bestuurders kan benoemen of ontslaan, beschikt over een meerjarenbegroting voor
      ten minste de vijf kalenderjaren volgend op het laatst afgesloten boekjaar;

      c. de voor die kalenderjaren te hanteren streefwaarden en prestatieindicatoren, die betrekking hebben op de in
      die jaren verwachte financiële situatie en financiële risico’s, en in elk geval het verwachte kasstroomsaldo, de
      verwachte liquiditeitspositie, de verwachte solvabiliteit en de verwachte financieringsbehoefte van de toegelaten
      instelling, de dochtermaatschappij en de verbonden onderneming waarvan de toegelaten instelling meer dan de helft
      van de bestuurders kan benoemen of ontslaan, betreffen;

      d. dat de toegelaten instelling in het jaarverslag, bedoeld in [artikel 36, eerste lid, van de wet][ref2], op bij
      ministeriële regeling te bepalen wijze melding maakt van de met haar verbonden ondernemingen, en

      e. de, door de raad van commissarissen vast te stellen, bedragen die ten hoogste met een besluit van het bestuur
      gemoeid mogen zijn zonder dat het onderworpen is aan goedkeuring van de raad van commissarissen, en de criteria
      voor die goedkeuring.

      3 Het reglement omvat nadere bepalingen voor collegiale leningen en beleggingen, overeenkomstig bij ministeriële
      regeling daaromtrent te geven voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel55a
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel36
    url: https://wetten.overheid.nl/BWBR0036702/2022-01-01#Artikel104
