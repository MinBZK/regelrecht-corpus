  - number: 23c
    text: |-
      1 Het verzoek, bedoeld in [artikel 27, eerste lid, aanhef en onderdeel a, van de wet][ref1], betreffende
      de vervreemding van een verhuurd gebouw dat een maatschappelijke gebruiksbestemming heeft als bedoeld in
      [artikel 45, tweede lid, onderdeel d, van de wet][ref2], of een verhuurd gebouw met een zorgfunctie als bedoeld
      in [bijlage 2][ref3] bij dit besluit, dat functioneel een eenheid vormt met woongelegenheden als bedoeld in
      [artikel 47, eerste lid, onderdeel d, van de wet][ref4], gaat vergezeld van:

      a. een uiteenzetting van het belang van de volkshuisvesting van het ter goedkeuring voorgelegde besluit;

      b. de ontwerpkoopovereenkomst die de toegelaten instelling voornemens is met de beoogde verkrijger te sluiten;

      c. een verklaring omtrent het gedrag als bedoeld in
      [artikel 28 van de Wet justitiële en strafvorderlijke gegevens][ref5] van de beoogde verkrijger, tenzij deze een
      dochtermaatschappij van de vervreemdende toegelaten instelling is;

      d. de zienswijze van de gemeente waar dat gebouw is gelegen en van de huurder; en

      e. de getaxeerde marktwaarde van dat gebouw.

      2 Het verzoek gaat, tenzij de beoogde verkrijger een dochtermaatschappij van de vervreemdende toegelaten instelling
      is, tevens vergezeld van bescheiden waaruit blijkt dat dit gebouw:

      a. gedurende ten minste vier weken te koop is aangeboden aan de huurder; en

      b. gedurende ten minste vier weken in het openbaar te koop aangeboden aan elke gegadigde, tenzij de toegelaten
      instelling 5% of meer van de aandelen van de beoogde verkrijger houdt.

      3 Uit de bescheiden, bedoeld in het tweede lid, volgen, voor zover van toepassing, de afwegingen die ertoe hebben
      geleid dat niet aan de huurder is vervreemd.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel27
