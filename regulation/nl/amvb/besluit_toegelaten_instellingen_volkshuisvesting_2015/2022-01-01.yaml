  - number: 52f
    text: |-
      Een toegelaten instelling, een met haar verbonden onderneming of een samenwerkingsvennootschap beëindigt in ieder
      geval de werkzaamheden, bedoeld in [artikel 45, zevende lid, van de wet][ref1], indien:

      a. niet aan de voorwaarden van de [artikelen 52d][ref2] en [52e][ref3] wordt voldaan; of

      b. de aan het verrichten van de werkzaamheden verbonden financiële risico’s of de financiële positie van de
      toegelaten instelling, een met haar verbonden onderneming of een samenwerkingsvennootschap zodanig zijn, dat
      het onverantwoord is dat zij deze uitvoert. Bij ministeriële regeling kunnen nadere voorschriften worden gegeven
      omtrent de toepassing van dit onderdeel.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0036702#Artikel52d
