  - number: '10'
    text: |-
      1 De financiële continuïteit, bedoeld in [artikel 21, eerste lid, tweede volzin, onderdeel e, van de wet][ref1],
      is niet voldoende gewaarborgd, indien Onze Minister van oordeel is dat de financiële middelen van de betrokken
      toegelaten instelling of rechtspersoon of vennootschap onvoldoende zullen blijken te zijn om hun voorgenomen
      werkzaamheden te kunnen verrichten.

      2 Een lening als bedoeld in [artikel 21, eerste lid, tweede volzin, onderdeel f, van de wet][ref2]:

      a. heeft een rentepercentage dat gelijk is aan de op het tijdstip van indiening van het verzoek om een
      goedkeuring als bedoeld in [artikel 21, eerste lid, eerste volzin, van de wet][ref3] geldende rente op tienjarige
      staatsleningen, vermeerderd met een bij ministeriële regeling te bepalen percentage, en

      b. wordt binnen vijftien jaar afgelost in liquide middelen en zodanig, dat na vijf en tien jaar ten minste een
      derde respectievelijk twee derde deel is afgelost.

      3 De toegelaten instelling kan Onze Minister verzoeken om de aflossing, bedoeld in het tweede lid, onderdeel
      b, op een later tijdstip te stellen of het af te lossen bedrag lager vast te stellen. Onze Minister willigt het
      verzoek uitsluitend in, indien naar zijn oordeel daardoor wordt voorkomen dat de financiële continuïteit van de
      rechtspersoon of vennootschap niet meer is gewaarborgd en de financiële continuïteit van de toegelaten instelling
      gewaarborgd blijft. Hij kan aan dat inwilligen nadere voorwaarden verbinden.

      4 Bij ministeriële regeling kunnen nadere voorschriften worden gegeven omtrent de toepassing van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel21
