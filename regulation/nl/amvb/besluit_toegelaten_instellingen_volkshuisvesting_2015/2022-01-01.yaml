      1 Ten behoeve van de toepassing van [artikel 69][ref1] tot en met 31 december 2025 hanteren de toegelaten
      instellingen op welke [artikel 49, eerste lid, eerste volzin, van de wet][ref2] van toepassing is, het bedrag,
      bedoeld in [artikel 65, eerste lid][ref3], dat deel uitmaakt van een goedgekeurd voorstel als bedoeld in
      [artikel II, derde lid, tweede volzin, van de Herzieningswet toegelaten instellingen volkshuisvesting][ref4], zoals
      dat luidde onmiddellijk voorafgaand aan het tijdstip waarop die wet werd ingetrokken, of dat deel uitmaakt van een
      goedgekeurd voorstel als bedoeld in [artikel 49a van de wet][ref5]. Ten behoeve van die toepassing na die datum
      stellen die toegelaten instellingen, voor elke wijk of buurt waar onroerende zaken zijn gelegen welke zij in de
      daeb-tak hebben ondergebracht, een bedrag vast dat gelijk is aan 5% van de WOZ-waarde van die zaken op 31 december
      2025.

      2 Ten behoeve van de toepassing van [artikel 69, eerste tot en met derde lid][ref6], tot en met 31 december
      2025 hanteren de toegelaten instellingen, bedoeld in [artikel 64, eerste lid][ref7], het bedrag, bedoeld in
      [artikel 65, tweede lid][ref8]. Ten behoeve van die toepassing na die datum nemen zij in het jaarverslag, bedoeld
      in [artikel 36, eerste lid, van de wet][ref9], over het jaar 2025, op de wijze, bedoeld in artikel 65, tweede lid,
      een bedrag op dat gelijk is aan 5% van de WOZ-waarde van de betrokken onroerende zaken op 31 december 2025.

      3 [Artikel 65, derde en vierde lid][ref10], is van overeenkomstige toepassing.

      4 Dit artikel is niet van toepassing, indien de betrokken gemeente een gemeente is als genoemd in
      [artikel 1.11, tweede lid, onderdeel b, van de Wet maatregelen woningmarkt II][ref11], of een deelgemeente van de
      gemeente Rotterdam is als genoemd in artikel 1.11, tweede lid, onderdeel a, van die wet.


