  - number: '121'
    text: |-
      1 Elke toegelaten instelling die op 1 januari van een kalenderjaar als zodanig bestaat, is over dat kalenderjaar
      een bijdrage aan Onze Minister verschuldigd in de kosten die in het algemeen gemoeid zijn met de uitoefening van
      het toezicht. Onze Minister begroot de bijdrage voor alle toegelaten instellingen gezamenlijk.

      2 De bijdrage, bedoeld in de eerste volzin van het eerste lid, bedraagt de som van:

      a. de helft van het ingevolge de tweede volzin van het eerste lid begrote bedrag, gedeeld door het totale
      aantal woongelegenheden die de toegelaten instellingen en de dochtermaatschappijen op 31 december van het jaar
      voorafgaand aan het jaar waarover die bijdrage verschuldigd is in eigendom hadden volgens de gegevens, opgenomen
      in het overzicht, bedoeld in [artikel 36a, vierde lid, van de wet][ref1], en vervolgens vermenigvuldigd met het
      op dienovereenkomstige wijze bepaalde aantal woongelegenheden die de betrokken toegelaten instelling en haar
      dochtermaatschappijen in eigendom hadden, en

      b. de helft van het ingevolge de tweede volzin van het eerste lid begrote bedrag, gedeeld door de totale WOZ-waarde
      van de woongelegenheden die de toegelaten instellingen en de dochtermaatschappijen op 31 december van het jaar
      voorafgaand aan het jaar waarover die bijdrage verschuldigd is in eigendom hadden volgens de gegevens, opgenomen
      in het overzicht, bedoeld in [artikel 36a, vierde lid, van de wet][ref2], en vervolgens vermenigvuldigd met de op
      dienovereenkomstige wijze bepaalde WOZ-waarde van de woongelegenheden die de betrokken toegelaten instelling en
      haar dochtermaatschappijen in eigendom hadden.

      3 Onze Minister stelt per toegelaten instelling de bijdrage, bedoeld in het eerste lid, vast en maakt deze
      uiterlijk op 1 oktober van het jaar waarover deze verschuldigd is bekend aan de toegelaten instellingen.

      4 Onze Minister kan een verrekening toepassen op de, op grond van het tweede lid vastgestelde bijdrage, indien
      de totale kosten van het toezicht in het voorafgaande jaar meer of minder bedragen dan de voor dat jaar begrote
      kosten. De totale som waarmee de gezamenlijke bijdragen voor de toegelaten instellingen wordt verhoogd of verlaagd
      is in dat geval gelijk aan het verschil tussen de daadwerkelijke en begrote kosten van het toezicht voor het
      voorafgaande jaar.

      5 De bijdrage wordt betaald binnen een maand na dagtekening van de bekendmaking, bedoeld in het derde lid. Bij niet
      tijdige betaling is vanaf de datum van het verstrijken van die termijn de verplichting van toepassing tot betaling
      van een rente, bepaald overeenkomstig [afdeling 4.4.2 van de Algemene wet bestuursrecht][ref3].

      6 De kosten die gemoeid zijn met de ingevolge de [artikelen 48, zevende lid][ref4], [61d][ref5],
      [61g, eerste, tweede en derde lid][ref6], [61h, eerste lid][ref7], [104a, eerste lid][ref8],
      [105, eerste lid][ref9], en [120b van de wet][ref10] gegeven aanwijzingen en genomen maatregelen, worden in
      rekening gebracht bij de toegelaten instelling jegens welke of jegens welker dochtermaatschappij de betrokken
      aanwijzing of maatregel is gegeven respectievelijk genomen.


