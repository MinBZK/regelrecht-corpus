    text: |-
      Onze Minister beslist op het verzoek, bedoeld in [artikel 19, eerste lid, tweede volzin, van de wet][ref1], binnen
      zes weken na ontvangst van de zienswijzen, bedoeld in artikel 19, tweede lid, eerste volzin, van de wet. Indien
      een college van burgemeester en wethouders of een bewonersorganisatie zijn of haar zodanige zienswijze niet of
      niet tijdig aan Onze Minister heeft doen toekomen, beslist Onze Minister binnen zes weken na het verstrijken van de
      termijn, bedoeld in artikel 19, tweede lid, tweede volzin, van de wet.


