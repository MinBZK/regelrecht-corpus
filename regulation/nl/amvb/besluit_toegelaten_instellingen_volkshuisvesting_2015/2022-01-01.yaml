    text: |-
      1 De categorieën van instellingen, bedoeld in [artikel 21c, eerste lid, van de wet][ref1], zijn:

      a. Nederlandse overheden;

      b. Nederlandse banken als bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref2], met ten minste
      een single B-rating of een daarmee vergelijkbare rating, afgegeven door ten minste twee van de bij ministeriële
      regeling te noemen ratingbureaus;

      c. banken met een vergunning als bedoeld in [artikel 2:15, eerste lid][ref3], of
      [2:16, eerste lid, van de Wet op het financieel toezicht][ref4], met ten minste een single B-rating of een daarmee
      vergelijkbare rating, afgegeven door ten minste twee van de bij ministeriële regeling te noemen ratingbureaus, en

      d. professionele beleggers als bedoeld in [artikel 1:1][ref5], begripsomschrijving van professionele belegger,
      onderdelen b tot en met r, van de[Wet op het financieel toezicht][ref6].

      2 In afwijking van het eerste lid, onderdelen b en c, zijn de categorieën van instellingen, bedoeld in
      [artikel 21c, eerste lid, van de wet][ref7]:

      a. banken als bedoeld in de onderdelen b en c met ten minste een single A-rating of een daarmee vergelijkbare
      rating, afgegeven door ten minste twee van de bij ministeriële regeling te noemen ratingbureaus, indien de
      transacties betrekking hebben op beleggingen of financiële derivaten;

      b. banken als bedoeld in de onderdelen b en c met een lagere dan single B-rating of zonder rating indien de
      transacties uitsluitend betrekking hebben op het aantrekken van leningen.

      3 Bij ministeriële regeling kunnen andere daarbij te bepalen categorieën van instellingen worden aangewezen, indien
      zonder die aanwijzing het aangaan van financiële transacties door toegelaten instellingen op een wijze zou worden
      belemmerd die strijdig is met het belang van de volkshuisvesting.

      4 Het percentage, bedoeld in [artikel 21c, tweede lid, van de wet][ref8], is 70.

      5 De eisen ten aanzien van de rating, bedoeld in het eerste lid, onderdelen b en c, en het tweede lid,
      onderdelen a en b, zijn niet van toepassing voor een bank die een volledige dochtermaatschappij is van een
      bank die aan die eisen voldoet en ten aanzien waarvan die bank een schriftelijke verklaring als bedoeld in
      [artikel 403 lid 1 onder f van Boek 2 van het Burgerlijk Wetboek][ref9] heeft afgegeven.


