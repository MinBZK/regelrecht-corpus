    text: |-
      De categorieën van personen, bedoeld in [artikel 41c, tweede lid, eerste volzin, van de wet][ref1], zijn:

      a. personen die zijn ingeschreven bij een universiteit of hogeschool als bedoeld in
      [artikel 1.2, onderdelen a en b, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref2], of bij
      een instelling als bedoeld in [artikel 1.1.1, onderdeel b, van de Wet educatie en beroepsopleidingen][ref3], of die
      zich voorbereiden op een promotie als bedoeld in [artikel 7.18 van eerstgenoemde wet][ref4];

      b. ouderen, gehandicapten en andere personen die zorg of begeleiding behoeven en

      c. andere personen, voor welke de voorziening in de behoefte aan huisvesting dringend noodzakelijk is uit het
      oogpunt van gezondheid, veiligheid, sociale factoren, overmacht of calamiteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel41c
