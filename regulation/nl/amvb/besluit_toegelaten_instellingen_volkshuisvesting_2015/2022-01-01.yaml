    text: |-
      1 Een verzoek om een ontheffing als bedoeld in [artikel 41c, tweede lid, tweede volzin, van de wet][ref1] omvat in
      elk geval:

      a. de gemeenten waar die ontheffing van toepassing zou moeten zijn;

      b. een uiteenzetting over de gevolgen van het niet verlenen van die ontheffing voor de uitvoering door toegelaten
      instellingen van de woonvisies die in die gemeenten gelden;

      c. een uiteenzetting over het aandeel van de werkzaamheden van de toegelaten instelling in die gemeenten in het
      totaal van haar werkzaamheden en

      d. indien de toegelaten instelling zienswijzen op dat verzoek heeft ontvangen van de gemeenten, bedoeld in
      onderdeel a, van de gemeenten waar zij feitelijk werkzaam mag zijn uit hoofde van het inwilligen van het in
      [artikel 41b, eerste lid, van de wet][ref2] bedoelde verzoek, dat tot het in dit lid bedoelde verzoek heeft
      geleid, van de in een van die gemeenten feitelijk werkzame toegelaten instellingen, of van de betrokken
      bewonersorganisaties: die zienswijzen.

      2 Onze Minister kan besluiten om geen ontheffing als bedoeld in het eerste lid te verlenen, indien de uitvoering
      door toegelaten instellingen van de woonvisies die gelden in de gemeenten waar de betrokken ontheffing van
      toepassing zou zijn naar zijn oordeel door dat besluit niet nadelig wordt beïnvloed. In afwijking van de eerste zin
      kan Onze Minister besluiten om een ontheffing te verlenen indien:

      a. de gemeenten waar die ontheffing van toepassing zou moeten zijn direct grenzen aan een gebied als bedoeld
      in [artikel 41b van de wet][ref3] waarin de toegelaten instelling feitelijk werkzaam is, in welke gemeenten de
      toegelaten instelling reeds woongelegenheden in bezit heeft; en

      b. de zienswijzen, bedoeld in het eerste lid, onderdeel d, daartoe aanleiding geven.

      3 Onze Minister kan aan het verlenen van een ontheffing als bedoeld in het eerste lid het gevolg, bedoeld in
      [artikel 41c, eerste lid, van de wet][ref4], verbinden ten aanzien van de gemeenten waar de toegelaten instelling
      feitelijk werkzaam mag zijn uit hoofde van het inwilligen van het in [artikel 41b, eerste lid, van de wet][ref5]
      bedoelde verzoek, dat tot het in dit lid bedoelde verzoek heeft geleid, indien de uitvoering door toegelaten
      instellingen van de woonvisies die in die gemeenten gelden naar zijn oordeel daardoor niet nadelig wordt beïnvloed.

      4 Bij ministeriële regeling kunnen nadere voorschriften worden gegeven omtrent hetgeen een verzoek om een
      ontheffing als bedoeld in [artikel 41c, tweede lid, tweede volzin, van de wet][ref6] dient te omvatten, en omtrent
      de toepassing van het tweede of derde lid.


