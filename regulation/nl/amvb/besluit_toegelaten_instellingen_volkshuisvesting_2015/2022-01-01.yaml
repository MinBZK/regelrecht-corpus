        artikel: '45'
  - number: 46a
    text: |-
      De werkzaamheden, genoemd in [artikel 45, tweede lid, onderdelen a en b, van de wet][ref1]:

      a. worden door een toegelaten instelling niet verricht ten aanzien van de in die onderdelen bedoelde
      woongelegenheden en aanhorigheden van een met een toegelaten instelling verbonden onderneming;

      b. worden door een met een toegelaten instelling verbonden onderneming uitsluitend verricht ten aanzien van de in
      dat onderdeel bedoelde woongelegenheden en aanhorigheden van een andere verbonden onderneming:

      1°. indien en zolang alle aandelen in die andere verbonden onderneming door toegelaten instellingen worden
      gehouden, of

      2°. indien en zolang toegelaten instellingen of een of meer van de met hen verbonden ondernemingen alleen of samen
      alle bestuurders van de verbonden onderneming kunnen benoemen of ontslaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel45
    url: https://wetten.overheid.nl/BWBR0036702/2022-01-01#Artikel46a
