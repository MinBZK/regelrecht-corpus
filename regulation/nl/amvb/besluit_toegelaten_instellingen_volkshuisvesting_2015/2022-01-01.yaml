  - number: '91'
    text: |-
      Indien toegelaten instellingen beogen met elkaar te fuseren, dienen zij gezamenlijk een verzoek in om goedkeuring
      daarvan, en verrichten zij gezamenlijk alle daartoe vereiste andere voorbereidingshandelingen.
    url: https://wetten.overheid.nl/BWBR0036702/2022-01-01#Artikel91
  - number: '92'
    text: |-
      1 De fuserende toegelaten instelling informeert zo spoedig mogelijk de colleges van burgemeester en wethouders
      van de gemeenten waar zij haar woonplaats heeft, waar zij feitelijk werkzaam is, waar de fuserende toegelaten
      instelling na de voorgenomen fusie haar woonplaats zal hebben en waar zij na die fusie feitelijk werkzaam zal zijn
      over:

      a. haar fusievoornemens en haar motieven daarvoor; en

      b. de verwachte gevolgen van die fusie voor de huurders van haar woongelegenheden en gebouwen, voor de bijdragen
      van toegelaten instellingen aan de gemeentelijke woonvisie en voor de overige belanghebbenden.

      2 De fuserende toegelaten instelling verstrekt de instanties, bedoeld in [artikel 53, derde lid, van de wet][ref1],
      alle inlichtingen die redelijkerwijs kunnen bijdragen aan het zich vormen van hun zienswijze en haar oordeel.

      3 De fuserende toegelaten instelling voert, naast het overleg, bedoeld in
      [artikel 53, tweede lid, derde volzin, van de wet][ref2], overleg over het verzoek om goedkeuring van de
      voorgenomen fusie met de colleges van burgemeester en wethouders van de gemeenten als bedoeld in het eerste lid.

      4 Bij ministeriële regeling kunnen nadere voorschriften worden gegeven omtrent de toepassing van het eerste en
      tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel53
    url: https://wetten.overheid.nl/BWBR0036702/2022-01-01#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '53'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '53'
  - number: '95'
    text: |-
      1 Het verzoek om goedkeuring van de voorgenomen fusie, als bedoeld in
      [artikel 53, tweede lid, eerste volzin, van de wet][ref1], gaat, naast hetgeen waarvan het ingevolge artikel 53,
      derde lid, van de wet vergezeld gaat, vergezeld van:

      a. een fusievoorstel en een schriftelijke toelichting daarop, als bedoeld in de [artikelen 312][ref2] en
      [313 van Boek 2 van het Burgerlijk Wetboek][ref3];

      b. de zienswijzen daarop van de gemeenten, bedoeld in [artikel 92, eerste lid][ref4], voor zover niet reeds bij het
      verzoek gevoegd ingevolge [artikel 53, derde lid, onderdeel a, van de wet][ref5], en, in geval van een negatieve
      zodanige zienswijze of andere zienswijze als bedoeld in artikel 53, derde lid, van de wet, een onderbouwde reactie
      daarop van de fuserende toegelaten instelling, dan wel, bij het uitblijven van een zienswijze na zes weken nadat
      hierom is gevraagd, bescheiden waaruit blijkt dat zij om die zienswijze heeft gevraagd; en

      c. indien die fusie een concentratie is waarop [Hoofdstuk 5 van de Mededingingswet][ref6] van toepassing is:

      1°. een onvoorwaardelijke mededeling als bedoeld in [artikel 37, eerste lid, van die wet][ref7] dat voor die
      concentratie geen vergunning is vereist, of een verklaring dat geen mededeling als bedoeld in dat lid is gedaan
      binnen vier weken na de melding van die fusie aan de Autoriteit Consument en Markt;

      2°. een voorwaardelijke mededeling als bedoeld in [artikel 37, eerste lid, van die wet][ref8] dat voor die
      concentratie geen vergunning is vereist, vergezeld van bescheiden waarmee wordt aangetoond dat tijdig aan de in die
      mededeling gestelde voorwaarden is voldaan;

      3°. de voor die concentratie ingevolge [artikel 37 van die wet][ref9] vereiste vergunning of

      4°. in geval van een negatief oordeel als bedoeld in [artikel 53, derde lid, onderdeel b, van de wet][ref10]: een
      onderbouwde reactie daarop van de fuserende toegelaten instelling, dan wel, bij het uitblijven van een oordeel,
      bescheiden waaruit blijkt dat zij om dat oordeel heeft gevraagd.

      2 Het eerste lid, onderdeel b, is niet van toepassing indien sprake is van een fusie als bedoeld in
      [artikel 53, vijfde lid, van de wet][ref11].

      3 Bij ministeriële regeling kunnen nadere voorschriften worden gegeven omtrent de toepassing van dit artikel.


