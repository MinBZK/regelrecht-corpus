  - number: '59'
    text: |-
      1 De toegelaten instelling geeft bij het aangaan van overeenkomsten van huur en verhuur met betrekking
      tot haar woongelegenheden, bedoeld in [artikel 47, eerste lid, onderdelen b en c, van de wet][ref1],
      in de gevallen dat het huishoudinkomen hoger is dan de betrokken inkomensgrens, genoemd in
      [artikel 16, eerste lid][ref2], voorrang aan huishoudens overeenkomstig een huisvestingsverordening als bedoeld
      in [artikel 4 van de Huisvestingswet 2014][ref3], indien een zodanige verordening van toepassing is, en vervolgens
      aan:

      a. huishoudens voor welke de voorziening in de behoefte aan huisvesting dringend noodzakelijk is uit het oogpunt
      van gezondheid, veiligheid, sociale factoren, overmacht of calamiteiten;

      b. huishoudens die woongelegenheden met elkaar ruilen en

      c. degenen die ingevolge [artikel 266 lid 1][ref4] of [267 lid 1 van Boek 7 van het Burgerlijk Wetboek][ref5]
      medehuurder van de betrokken woongelegenheid waren en de overeenkomst van huur en verhuur voortzetten
      overeenkomstig artikel 266 lid 3, 267 lid 6 of [268 lid 1 van dat boek][ref6].

      2 Na het geven van voorrang overeenkomstig het eerste lid houdt de toegelaten instelling bij het
      aangaan van overeenkomsten van huur en verhuur met betrekking tot haar woongelegenheden, bedoeld in
      [artikel 47, eerste lid, onderdelen b en c, van de wet][ref7], in de gevallen dat het huishoudinkomen hoger is
      dan de betrokken inkomensgrens, genoemd in [artikel 16, eerste lid][ref8], de volgorde aan die voortvloeit uit het
      daarover door haar vast te stellen beleid.


