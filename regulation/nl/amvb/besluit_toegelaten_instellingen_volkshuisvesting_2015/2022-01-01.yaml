  - number: 1a
    text: |-
      De termijn voor de inbreng van zienswijzen waarvoor ingevolge dit besluit de gelegenheid wordt geboden bedraagt
      acht weken, tenzij anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0036702/2022-01-01#Artikel1a
  - number: '2'
    text: |-
      1 Op het tijdstip van de oprichting van een wooncoöperatie bestaat de meerderheid van haar leden uit personen met
      een huishoudinkomen dat niet hoger is dan de betrokken inkomensgrens, genoemd in [artikel 16, eerste lid][ref1].

      2 De wooncoöperatie heeft bij haar oprichting een coöperatieplan, waarover met toegelaten instellingen overleg is
      gevoerd. Het coöperatieplan bevat in elk geval een regeling omtrent de wijze waarop de wooncoöperatie bijdraagt
      aan het onderhoud en het beheer van de woongelegenheden die door haar leden worden bewoond, en, indien de
      wooncoöperatie zich ten doel stelt aan dat onderhoud en beheer bij te dragen nadat haar leden de door hen bewoonde
      woongelegenheden in eigendom hebben verworven, een regeling omtrent het na haar oprichting door toegelaten
      instellingen aan hen vervreemden van die woongelegenheden.

      3 De betrokken toegelaten instelling stelt voor het opstellen van het coöperatieplan eenmalig financiële middelen,
      ter hoogte van een door haar te bepalen bedrag van ten minste € 5.000, ter beschikking op verzoek van degenen
      die ten overstaan van haar aannemelijk hebben gemaakt dat zij de leden van de wooncoöperatie zullen zijn, onder
      vermelding van de door hen bewoonde woongelegenheden. Indien meerdere toegelaten instellingen woongelegenheden in
      eigendom hebben die worden bewoond door personen die lid van de wooncoöperatie zullen zijn, wordt dat verzoek op
      hetzelfde tijdstip bij die toegelaten instellingen ingediend en stelt elk van die toegelaten instellingen een deel
      van de in de eerste volzin bedoelde financiële middelen ter beschikking naar rato van het aandeel van haar zodanige
      woongelegenheden in het totaal van die zodanige woongelegenheden, in welk geval die toegelaten instellingen het
      bedrag van die financiële middelen gezamenlijk bepalen op ten minste € 5.000.

      4 De betrokken toegelaten instelling doet verzoeken als bedoeld in het derde lid, eerste volzin, aan Onze Minister
      toekomen. Zij willigt elk verzoek van degenen, bedoeld in het derde lid, eerste volzin, in om met hen overleg over
      het coöperatieplan te voeren. In het geval, bedoeld in de tweede volzin van het derde lid, is de verplichting,
      bedoeld in de tweede volzin van dit lid, uitsluitend van toepassing op een zodanig verzoek aan de betrokken
      toegelaten instellingen gezamenlijk.


      [ref1]: https://wetten.overheid.nl/BWBR0036702#Artikel16
