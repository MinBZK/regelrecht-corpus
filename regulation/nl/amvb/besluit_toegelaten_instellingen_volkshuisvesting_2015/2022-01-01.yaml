  - number: '3'
    text: |-
      De toegelaten instelling die een woongelegenheid aan een lid van de wooncoöperatie vervreemdt, reserveert voor
      dat lid of de wooncoöperatie een bedrag ter hoogte van de door die toegelaten instelling voorziene uitgaven aan
      onderhoud aan die woongelegenheid in de eerste vijf jaar na die vervreemding.
    url: https://wetten.overheid.nl/BWBR0036702/2022-01-01#Artikel3
  - number: '4'
    text: |-
      Een toegelaten instelling vervreemdt of sloopt geen woongelegenheden als bedoeld in
      [artikel 2, derde lid, eerste volzin][ref1], gedurende de eenmalige periode die aanvangt op het tijdstip van
      indiening van het verzoek, bedoeld in die volzin, en eindigt hetzij op het tijdstip van oprichting van de
      wooncoöperatie, hetzij zes maanden na die indiening ingeval de wooncoöperatie niet binnen die zes maanden is
      opgericht.


      [ref1]: https://wetten.overheid.nl/BWBR0036702#Artikel2
    url: https://wetten.overheid.nl/BWBR0036702/2022-01-01#Artikel4
