  - number: '23'
    text: |-
      1 Het verzoek, bedoeld in [artikel 27, eerste lid, aanhef en onderdeel a, van de wet][ref1], betreffende de
      vervreemding van blijvend gereguleerde daeb-woongelegenheden of blijvend gereguleerde daeb-complexen, aan
      natuurlijke personen niet voor eigen gebruik of aan rechtspersonen, niet zijnde andere toegelaten instellingen,
      gaat vergezeld van:

      a. een uiteenzetting van het belang van de volkshuisvesting van het ter goedkeuring voorgelegde besluit;

      b. de ontwerpkoopovereenkomst die de toegelaten instelling voornemens is met de beoogde verkrijger te sluiten, met
      daarin het beding dat die woongelegenheid of de van dat complex deel uitmakende woongelegenheden ten minste zeven
      jaar na de eigendomsoverdracht als gevolg van de vervreemding voor verhuur bestemd blijven;

      c. een verklaring omtrent het gedrag als bedoeld in
      [artikel 28 van de Wet justitiële en strafvorderlijke gegevens][ref2] van de beoogde verkrijger, tenzij deze een
      dochtermaatschappij van de vervreemdende toegelaten instelling is;

      d. de zienswijze van de gemeente waar die woongelegenheid of dat complex is gelegen en van de betrokken
      bewonersorganisatie;

      e. een verklaring van de beoogde verkrijger dat hij zich als een sociale verhuurder zal gedragen; en

      f. de getaxeerde marktwaarde van die woongelegenheid of dat complex.

      2 Het verzoek gaat, tenzij de beoogde verkrijger een dochtermaatschappij van de vervreemdende toegelaten instelling
      is, tevens vergezeld van bescheiden waaruit blijkt dat:

      a. bij een verhuurde woongelegenheid die een zelfstandige woning, bedoeld in
      [artikel 234 van Boek 7 van het Burgerlijk Wetboek][ref3], is: dat deze gedurende ten minste vier weken te koop is
      aangeboden aan de huurder tegen een prijs van ten hoogste de marktwaarde vrij van huur en gebruik;

      b. bij een woongelegenheid of complex: dat deze gedurende ten minste vier weken te koop is aangeboden aan andere
      toegelaten instellingen; en

      c. bij een woongelegenheid of complex: dat deze gedurende ten minste vier weken in het openbaar te koop is
      aangeboden aan elke gegadigde, tenzij de toegelaten instelling 5% of meer van de aandelen van de beoogde verkrijger
      houdt.

      3 Uit de bescheiden, bedoeld in het tweede lid, volgen, voor zover van toepassing, de afwegingen die ertoe hebben
      geleid dat niet achtereenvolgens aan de huurder of andere toegelaten instellingen is vervreemd.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0014194#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel234
