      a. zijn de [artikelen 111][ref2], [112][ref3] en [115 tot en met 118][ref4] van overeenkomstige toepassing op de
      borgingsvoorziening en

      b. is [artikel 111, eerste lid, onderdeel e][ref5], niet van toepassing, waar het het in dat onderdeel bedoelde
      overleg met de borgingsvoorziening betreft.


