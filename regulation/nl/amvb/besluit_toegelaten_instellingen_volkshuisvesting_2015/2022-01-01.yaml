  - number: '69'
    text: |-
      1 De toegelaten instelling kan in geval van herstructurering ten laste van de daeb-tak brengen:

      a. voor zover die herstructurering bestaat uit werkzaamheden als bedoeld in [artikel 1, eerste lid][ref1],
      begripsomschrijving van herstructurering, aanhef en onderdeel a: de kosten die zijn gemoeid met het verwerven
      van de betrokken onroerende zaken die verband houden met werkzaamheden die behoren tot de diensten van algemeen
      economisch belang, dan wel met de afboeking van die onroerende zaken, vermeerderd met de kosten van de sloop
      van die onroerende zaken en het bouwrijp maken van de grond ter plaatse van die sloop, en verminderd met de op
      residuele wijze, uitgaande van de voorgenomen bouw van onroerende zaken die verband houden met werkzaamheden die
      niet behoren tot de diensten van algemeen economisch belang, bepaalde marktwaarde van die grond na het bouwrijp
      maken daarvan;

      b. voor zover die herstructurering bestaat uit werkzaamheden als bedoeld in [artikel 1, eerste lid][ref2],
      begripsomschrijving van herstructurering, aanhef en onderdeel b: de kosten die zijn gemoeid met het verwerven
      van de betrokken onroerende zaken die verband houden met werkzaamheden die behoren tot de diensten van algemeen
      economisch belang, dan wel met de afboeking van die onroerende zaken, verminderd met de op residuele wijze,
      uitgaande van het voorgenomen treffen van ingrijpende voorzieningen of de voorgenomen samenvoeging, bepaalde
      marktwaarde van die onroerende zaken.

      2 Bij toepassing van het eerste lid kan in het tijdvak dat aanvangt op het ingangstijdstip, bedoeld in
      [artikel II, vierde lid, tweede volzin, van de Herzieningswet toegelaten instellingen volkshuisvesting][ref3],
      zoals dat luidde onmiddellijk voorafgaand aan het tijdstip waarop die wet werd ingetrokken, of het
      ingangstijdstip, bedoeld in [artikel 49a, derde lid, tweede volzin, van de wet][ref4], en dat eindigt op
      31 december 2025, ten hoogste het bedrag, bedoeld in [artikel 65, eerste of tweede lid][ref5], ten laste van de
      daeb-tak worden gebracht. Bij toepassing van dat lid kan per daaropvolgend tijdvak van tien jaar, waarvan het
      eerste aanvangt op 1 januari 2026 en de volgende telkens tien jaar nadien, ten hoogste het bedrag, bedoeld in
      [artikel 68, eerste of tweede lid][ref6], ten laste van die tak worden gebracht.

      3 Het ten laste brengen in enig tijdvak, bedoeld in het eerste en tweede lid, is uitsluitend van toepassing op
      herstructurering, met welke in dat tijdvak een aanvang is gemaakt, of met betrekking tot welke uit schriftelijke,
      uitsluitend op die herstructurering betrekking hebbende, stukken blijkt dat het maken van die aanvang wordt beoogd.
      Bij ministeriële regeling kunnen voorschriften worden gegeven omtrent de toepassing van dit lid.

      4 Bij toepassing van het eerste lid, aanhef en onderdeel a, gaat onverwijld na het bouwrijp maken van de grond,
      bedoeld in dat onderdeel, die grond over naar de niet-daeb-tak onder verrekening tussen de daeb-tak en de niet-
      daeb-tak van de marktwaarde daarvan, bepaald overeenkomstig dat onderdeel.

      5 Het tweede, derde en vierde lid zijn niet van toepassing, indien de betrokken gemeente een gemeente is
      als genoemd in [artikel 1.11, tweede lid, onderdeel b, van de Wet maatregelen woningmarkt II][ref7], of een
      deelgemeente van de gemeente Rotterdam is als genoemd in artikel 1.11, tweede lid, onderdeel a, van die wet.


