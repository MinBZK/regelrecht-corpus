  - number: 23a
    text: |-
      1 Het verzoek, bedoeld in [artikel 27, eerste lid, aanhef en onderdeel a, van de wet][ref1], betreffende de
      vervreemding van potentieel te liberaliseren daeb-woongelegenheden of potentieel te liberaliseren daeb-complexen,
      aan natuurlijke personen niet voor eigen gebruik of aan rechtspersonen, niet zijnde andere toegelaten instellingen,
      gaat vergezeld van:

      a. een uiteenzetting van het belang van de volkshuisvesting van het ter goedkeuring voorgelegde besluit;

      b. de ontwerpkoopovereenkomst die de toegelaten instelling voornemens is met de beoogde verkrijger te sluiten;

      c. een verklaring omtrent het gedrag als bedoeld in
      [artikel 28 van de Wet justitiële en strafvorderlijke gegevens][ref2] van de beoogde verkrijger, tenzij deze een
      dochtermaatschappij van de vervreemdende toegelaten instelling is;

      d. de zienswijze van de gemeente waar die woongelegenheid of dat complex is gelegen, tenzij:

      1°. met die gemeente op grond van [artikel 44, eerste lid, van de wet][ref3], afspraken
      zijn gemaakt over de omvang van de voorraad van woongelegenheden als bedoeld in
      [artikel 47, eerste lid, onderdelen b, c en d, van de wet][ref4], en de eventuele vervreemding van een deel van die
      voorraad, en

      2°. die woongelegenheid of de van dat complex deel uitmakende woongelegenheden worden vervreemd onder het beding
      dat zij ten minste zeven jaar na de eigendomsoverdracht als gevolg van de vervreemding voor verhuur met een
      huurprijs van ten hoogste € 1000,– bestemd blijven; en

      e. de getaxeerde marktwaarde van die woongelegenheid of dat complex.

      2 Het verzoek gaat, tenzij de beoogde verkrijger een dochtermaatschappij van de vervreemdende toegelaten instelling
      is, tevens vergezeld van bescheiden waaruit blijkt dat die woongelegenheid of dat complex gedurende ten minste vier
      weken in het openbaar te koop is aangeboden aan elke gegadigde, tenzij de toegelaten instelling 5% of meer van de
      aandelen van de beoogde verkrijger houdt.


