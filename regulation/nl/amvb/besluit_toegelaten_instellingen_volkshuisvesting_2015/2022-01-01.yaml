  - number: '81'
    text: |-
      1 De toegelaten instelling brengt in een woningvennootschap onder:

      a. haar bestaande en geprojecteerde onroerende zaken die zij bij een administratieve scheiding niet ingevolge
      [artikel 66, eerste lid, onderdelen a tot en met e][ref1], of het bepaalde krachtens artikel 66, tweede lid, in de
      daeb-tak zou onderbrengen;

      b. de andere door haar aangetrokken leningen dan die, bedoeld in [artikel 66, eerste lid, onderdeel f][ref2], niet
      zijnde vlottende schuld;

      c. haar financieel waardeerbare rechten en verplichtingen uit hoofde van bedingen, inhoudende dat
      bij vervreemding door de koper van een door haar aan hem vervreemde woongelegenheid die laatstelijk
      voordien niet een woongelegenheid als bedoeld in [artikel 66, eerste lid, onderdeel a of b][ref3], of
      [artikel 47, eerste lid, onderdeel c, van de wet][ref4] was, die koper aan haar of zij aan die koper een bedrag
      verschuldigd is, en

      d. de met haar verbonden ondernemingen, alsmede haar financieel waardeerbare rechten en verplichtingen jegens die
      ondernemingen, en

      e. haar baten en lasten, naar de mate waarin zij betrekking hebben op activa of passiva als bedoeld in de
      onderdelen a, b en c, of, voor zover die baten en lasten niet aldus aan activa of passiva kunnen worden
      gerelateerd, het deel van die baten en lasten dat verhoudingsgewijs gelijk is aan het aandeel van de onroerende
      zaken, bedoeld in onderdeel a, in het totaal van haar onroerende zaken, welk aandeel en totaal blijken uit haar
      laatstelijk voor het geven van uitvoering van dit artikel vastgestelde balans.

      2 Voor zover passiva of lasten als bedoeld in het eerste lid bestaan uit schulden en andere verplichtingen jegens
      derden, brengt de toegelaten instelling deze niet onder in een woningvennootschap, indien de betrokken derde
      daarmee niet instemt.

      3 De toegelaten instelling kan woongelegenheden met een huurprijs van ten hoogste het in
      [artikel 13, eerste lid, onderdeel a, van de Wet op de huurtoeslag][ref5] genoemde bedrag, waarvan de waardering
      van de kwaliteit, bedoeld in [artikel 5 van het Besluit huurprijzen woonruimte][ref6], kan leiden tot een huurprijs
      die hoger is dan dat bedrag, alsmede gemengde geliberaliseerde complexen, in een woningvennootschap onderbrengen,
      zolang het aantal daarin ondergebrachte zodanige woongelegenheden niet hoger wordt dan 10% van het aantal zodanige
      woongelegenheden dat de toegelaten instelling op 31 december 2014 in eigendom had. Voor de toepassing van de eerste
      volzin worden de woongelegenheden in gemengde geliberaliseerde complexen met een huurprijs van ten hoogste het in
      artikel 13, eerste lid, onderdeel a, van de Wet op de huurtoeslag genoemde bedrag, waarvan de waardering van de
      kwaliteit, bedoeld in artikel 5 van het Besluit huurprijzen woonruimte, niet kan leiden tot een huurprijs die hoger
      is dan dat bedrag, niet meegerekend. Onze Minister kan op verzoek van de toegelaten instelling een hoger percentage
      dan dat, genoemd in de eerste volzin, vaststellen, indien de toegelaten instelling bij dat verzoek:

      a. aannemelijk heeft gemaakt dat toepassing van dat hogere percentage noodzakelijk is om haar financiële
      continuïteit of die van de betrokken woningvennootschap voldoende te waarborgen, of

      b. aantoont dat toereikend toepassing gegeven kan worden aan
      [artikel 42, eerste lid, eerste volzin, van de wet][ref7].

      Het bepaalde bij en krachtens [artikel 10, eerste lid][ref8] en in verband daarmee vierde lid, is van
      overeenkomstige toepassing.

      4 Bij ministeriële regeling kunnen nadere voorschriften worden gegeven omtrent hetgeen de toegelaten instelling in
      een woningvennootschap onderbrengt of kan onderbrengen.


      [ref1]: https://wetten.overheid.nl/BWBR0036702#Artikel66
