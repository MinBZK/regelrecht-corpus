  - number: '65'
    text: |-
      1 De toegelaten instellingen op welke [artikel 49, eerste lid, eerste volzin, van de wet][ref1]
      van toepassing is, nemen in het voorstel, bedoeld in
      [artikel II, derde lid, tweede volzin, van de Herzieningswet toegelaten instellingen volkshuisvesting][ref2], zoals
      dat luidde onmiddellijk voorafgaand aan het tijdstip waarop die wet werd ingetrokken, voor elke wijk of buurt waar
      onroerende zaken zijn gelegen welke zij voornemens is in haar daeb-tak onder te brengen, een bedrag op dat gelijk
      is aan 5% van de WOZ-waarde van die zaken op 31 december 2015.

      2 De toegelaten instellingen, bedoeld in artikel 64, eerste lid, nemen in het jaarverslag, bedoeld in
      [artikel 36, eerste lid, van de wet][ref3], over het jaar 2015, voor elke wijk of buurt waar onroerende zaken
      zijn gelegen welke ingevolge [artikel 66][ref4] in de daeb-tak zouden kunnen zijn ondergebracht, een bedrag op dat
      gelijk is aan 5% van de WOZ-waarde van die zaken op 31 december 2015.

      3 De toegelaten instellingen op welke [artikel 49, eerste lid, eerste volzin, van de wet][ref5], van toepassing is,
      nemen in het voorstel, bedoeld in [artikel 49a, van de wet][ref6], voor elke wijk of buurt waar onroerende zaken
      zijn gelegen welke zij voornemens is in haar daeb-tak onder te brengen, een bedrag op dat gelijk is aan 5% van de
      WOZ-waarde van die zaken.

      4 Indien de in de betrokken gemeente geldende woonvisie mede de aanwijzing van een gebied inhoudt waar
      herstructurering wordt beoogd en dat gebied meer dan een wijk of buurt beslaat, kan de toegelaten instelling voor
      de toepassing van het eerste, tweede of derde lid uitgaan van de WOZ-waarde van haar onroerende zaken die gelegen
      zijn in dat gebied.

      5 Bij ministeriële regeling wordt bepaald welke delen van een gemeente voor de toepassing van het eerste tot en met
      vierde lid als wijk of buurt worden beschouwd.

      6 Dit artikel is niet van toepassing, indien de betrokken gemeente een gemeente is als genoemd in
      [artikel 1.11, tweede lid, onderdeel b, van de Wet maatregelen woningmarkt II][ref7], of een deelgemeente van de
      gemeente Rotterdam is als genoemd in artikel 1.11, tweede lid, onderdeel a, van die wet.


