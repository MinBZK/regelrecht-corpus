  - number: '35'
    text: |-
      1 Een verzoek als bedoeld in [artikel 41b, eerste lid, van de wet][ref1] omvat in elk geval:

      a. een overzicht van de toegelaten instellingen die feitelijk werkzaam zijn in de gemeenten die dat verzoek
      indienen;

      b. het aantal in die gemeenten gezamenlijk woonachtige huishoudens en

      c. de zienswijzen op dat verzoek van die toegelaten instellingen, van andere gemeenten waar die toegelaten
      instellingen feitelijk werkzaam zijn of van de betrokken bewonersorganisaties.

      2 Het verzoek kan mede inhouden dat de goedkeuring, bedoeld in [artikel 41b, eerste lid, van de wet][ref2],
      uitsluitend betrekking heeft op die, in dat verzoek te noemen, toegelaten instellingen zonder de bijdrage van welke
      een of meer van de betrokken gemeenten geen uitvoering kan geven aan haar woonvisie, of die in een of meer van
      die gemeenten een zodanig groot deel van hun werkzaamheden verrichten dat die goedkeuring naar het oordeel van die
      gemeenten om die reden noodzakelijk is.

      3 Onze Minister kan besluiten om een verzoek als bedoeld in [artikel 41b, eerste lid, van de wet][ref3] niet in te
      willigen, indien:

      a. een van de gemeenten die dat verzoek indienen voordien een zodanig verzoek heeft ingediend, en Onze Minister dat
      verzoek heeft ingewilligd of

      b. indien in die gemeenten gezamenlijk minder dan 100 000 huishoudens woonachtig zijn.

      4 Onze Minister kan bij de inwilliging van een verzoek als bedoeld in [artikel 41b, eerste lid, van de wet][ref4]
      bepalen dat zijn goedkeuring uitsluitend betrekking heeft op de in zijn besluit te noemen in de betrokken gemeenten
      feitelijk werkzame toegelaten instellingen, op welke het tweede lid naar zijn oordeel van toepassing is.

      5 Bij ministeriële regeling kunnen nadere voorschriften worden gegeven omtrent hetgeen een verzoek als bedoeld in
      [artikel 41b, eerste lid, van de wet][ref5] dient te omvatten.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel41b
