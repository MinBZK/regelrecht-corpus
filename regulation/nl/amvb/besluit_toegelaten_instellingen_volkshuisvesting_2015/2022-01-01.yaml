      1 Onze Minister beoordeelt bij de toepassing van de [artikelen 38, vierde lid][ref1], en
      [44a, derde lid, van de wet][ref2] in elk geval:

      a. de liquiditeit van de toegelaten instelling, waaronder in elk geval de risico’s daarvoor vanwege het bezit van
      financiële derivaten;

      b. haar solvabiliteit;

      c. haar ruimte voor het doen van investeringen in de eerstvolgende vijf kalenderjaren na het verslagjaar waarop het
      oordeel betrekking heeft;

      d. haar beschikbare financiële middelen in verhouding tot de werkzaamheden die zijn opgenomen in het overzicht,
      bedoeld in [artikel 44a, eerste lid, onderdeel a, van de wet][ref3];

      e. de mate waarin het risico bestaat dat haar vermogen niet bestemd blijft voor het behartigen van het belang van
      de volkshuisvesting en

      f. de kwaliteit van haar organisatiestructuur.

      2 Bij ministeriële regeling kan worden bepaald welke onderwerpen voorts in elk geval worden beoordeeld bij de
      toepassing van de [artikelen 38, vierde lid][ref4], en [artikel 44a, derde lid, van de wet][ref5].


