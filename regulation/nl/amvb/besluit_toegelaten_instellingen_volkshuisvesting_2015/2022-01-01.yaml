  - number: '54'
    text: |-
      1 Het percentage, bedoeld in [artikel 46, tweede lid, eerste volzin, van de wet][ref1], is, gerekend over twee
      opeenvolgende kalenderjaren, 95.

      2 Tot de huishoudens, bedoeld in [artikel 46, tweede lid, eerste volzin, van de wet][ref2], worden mede gerekend:

      a. personen die als een- of tweepersoonshuishouden een woongelegenheid wensen te betrekken en:

      1°. ingeschreven staan bij een universiteit of hogeschool als bedoeld in
      [artikel 1.2, onderdelen a en b, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref3] of bij een
      instelling als bedoeld in [artikel 1.1.1, onderdeel b, van de Wet educatie en beroepsopleidingen][ref4], en daar
      voltijds studeren of

      2°. zich voltijds voorbereiden op een promotie als bedoeld in [artikel 7.18 van eerstgenoemde wet][ref5] of

      3°. recht hebben op een tegemoetkoming als bedoeld in
      [artikel 1.1, eerste lid, van de Wet tegemoetkoming onderwijsbijdrage en schoolkosten][ref6] en

      b. vreemdelingen die in Nederland een verblijfsvergunning asiel voor bepaalde tijd hebben
      aangevraagd en als gevolg daarvan een verblijfsvergunning hebben ontvangen als bedoeld in
      [artikel 8, onderdeel a, b, c of d, van de Vreemdelingenwet 2000][ref7].

      3 Indien de toegelaten instelling woongelegenheden waarop het bepaalde bij en krachtens
      [artikel 46, tweede lid, van de wet][ref8] van toepassing is verhuurt aan of heeft ondergebracht in een
      rechtspersoon of vennootschap welke overeenkomsten van huur en verhuur ten aanzien van zodanige woongelegenheden
      aangaat met natuurlijke personen, of een rechtspersoon of vennootschap welke zodanige woongelegenheden
      verhuurt aan een rechtspersoon of vennootschap welke zodanige overeenkomsten aangaat, draagt zij er zorg voor
      dat die rechtspersoon of vennootschap met betrekking tot die woongelegenheden dat bepaalde naleeft, en is
      [artikel 56][ref9] van toepassing op de aan die rechtspersoon of vennootschap te verstrekken gegevens.

      4 De toegelaten instelling voert overleg met de rechtspersoon of vennootschap, eerstbedoeld in het derde lid, met
      het oogmerk te bewerkstelligen dat die rechtspersoon of vennootschap alle handelingen verricht en aan de toegelaten
      instelling alle inlichtingen verstrekt die voor haar noodzakelijk zijn om aan [artikel 48, vierde lid][ref10], en
      [artikel 55, derde lid, van de wet][ref11] en het eerste tot en met derde lid van dit artikel te voldoen.

      5 Het is de toegelaten instelling verboden een overeenkomst met een rechtspersoon of vennootschap
      ter zake van de huur en verhuur van woongelegenheden waarop het bepaalde bij en krachtens
      [artikel 46, tweede lid, van de wet][ref12] van toepassing is aan te gaan, die in de weg staat aan de juiste
      toepassing van [artikel 48, vierde lid][ref13], en [artikel 55, derde lid, van de wet][ref14] en het eerste tot
      en met derde lid van dit artikel. Indien een voor het tijdstip waarop dit besluit in werking is getreden aangegane
      zodanige overeenkomst ertoe leidt dat die toegelaten instelling niet over alle gegevens beschikt die noodzakelijk
      zijn voor een beoordeling als bedoeld in het zesde lid, wordt dat die toegelaten instelling bij die beoordeling
      niet aangerekend.

      6 Onze Minister beoordeelt jaarlijks voor 1 december of de toegelaten instelling in het aan die datum voorafgaande
      jaar dit artikel en [artikel 56][ref15] heeft nageleefd of doen naleven, en verstrekt dat oordeel aan de toegelaten
      instelling.


