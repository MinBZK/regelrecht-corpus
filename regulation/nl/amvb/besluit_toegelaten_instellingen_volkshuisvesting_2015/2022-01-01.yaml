    text: |-
      1 Het verzoek, bedoeld in [artikel 27, eerste lid, aanhef en onderdeel a, van de wet][ref1], betreffende de
      vervreemding van een onroerende zaak waarop de [artikelen 23 tot en met 23c][ref2] niet van toepassing zijn,
      de vestiging van een recht van erfpacht, opstal of vruchtgebruik op een onroerende zaak of de overdracht van de
      economische eigendom van een onroerende zaak gaat vergezeld van:

      a. een uiteenzetting van het belang van de volkshuisvesting van het ter goedkeuring voorgelegde besluit;

      b. in geval van vervreemding: de ontwerpovereenkomst die de toegelaten instelling voornemens is met de beoogde
      verkrijger te sluiten;

      c. een verklaring omtrent het gedrag als bedoeld in
      [artikel 28 van de Wet justitiële en strafvorderlijke gegevens][ref3] van de beoogde verkrijger of begunstigde,
      tenzij deze een dochtermaatschappij van de vervreemdende toegelaten instelling is;

      d. de zienswijze van de gemeente waar die onroerende zaak is gelegen en de bij ministeriële regeling bepaalde
      andere zienswijzen; en

      e. de getaxeerde marktwaarde van de onroerende zaak.

      2 Indien het verzoek betrekking heeft op een vervreemding als bedoeld in het eerste lid, gaat het verzoek, tenzij
      de beoogde verkrijger een dochtermaatschappij van de vervreemdende toegelaten instelling is of de toegelaten
      instelling 5% of meer van de aandelen van de beoogde verkrijger houdt, tevens vergezeld van bescheiden waaruit
      blijkt dat die onroerende zaak gedurende ten minste vier weken in het openbaar te koop is aangeboden aan elke
      gegadigde.

      3 Het eerste lid, onderdelen c en d, is niet van toepassing in geval van een vervreemding als bedoeld in het eerste
      lid aan een toegelaten instelling of een natuurlijk persoon voor eigen gebruik.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel27
