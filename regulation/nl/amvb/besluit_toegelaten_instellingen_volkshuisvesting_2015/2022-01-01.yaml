        artikel: '27'
  - number: '28'
    text: |-
      1 Onze Minister keurt een vervreemding als bedoeld in [artikel 27, eerste lid, onderdeel b, van de wet][ref1] aan
      anderen dan toegelaten instellingen niet goed, indien:

      a. die vervreemding naar zijn oordeel ertoe leidt dat de financiële continuïteit van de toegelaten instelling niet
      langer is gewaarborgd;

      b. die vervreemding geschiedt tegen een prijs die naar zijn oordeel onvoldoende overeenkomt met de intrinsieke
      waarde;

      c. de toegelaten instelling een lening of een garantie aan de dochtermaatschappij heeft verstrekt of voor haar
      schulden aansprakelijk is, en die vervreemding ertoe zou leiden dat zij de helft of minder van de stemrechten in de
      algemene vergadering van de dochtermaatschappij overhoudt of

      d. degene aan wie wordt vervreemd hem geen verklaring omtrent het gedrag als bedoeld in
      [artikel 28 van de Wet justitiële en strafvorderlijke gegevens][ref2] kan overleggen.

      2 Onze Minister kan in afwijking van het eerste lid, onderdeel b, een vervreemding goedkeuren die onvoldoende
      overeenkomt met de intrinsieke waarde wanneer de toegelaten instelling aannemelijk maakt dat de intrinsieke waarde
      in het desbetreffende geval geen juist beeld geeft van de waarde bij verkoop.

      3 Bij ministeriële regeling kunnen nadere voorschriften worden gegeven omtrent de toepassing van het eerste lid,
      onderdelen a en b.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0014194#Artikel28
    url: https://wetten.overheid.nl/BWBR0036702/2022-01-01#Artikel28
