    text: |-
      De bijdrage, bedoeld in [artikel 58, tweede lid, van de wet][ref1], bedraagt de som van:

      a. de helft van de som van de ingevolge [artikel 115, eerste lid][ref2], begrote bedragen, gedeeld door het
      totale aantal woongelegenheden die de toegelaten instellingen op 31 december van het jaar voorafgaand aan het jaar
      waarover die bijdrage verschuldigd is in eigendom hadden volgens de gegevens, opgenomen in het overzicht, bedoeld
      in [artikel 36a, vierde lid, van de wet][ref3], en vervolgens vermenigvuldigd met het op dienovereenkomstige wijze
      bepaalde aantal woongelegenheden die de betrokken toegelaten instelling in eigendom had, en

      b. de helft van de som van de ingevolge [artikel 115, eerste lid][ref4], begrote bedragen, gedeeld door de totale
      WOZ-waarde van de woongelegenheden die de toegelaten instellingen op 31 december van het jaar voorafgaand aan het
      jaar waarover die bijdrage verschuldigd is in eigendom hadden volgens de gegevens, opgenomen in het overzicht,
      bedoeld in [artikel 36a, vierde lid, van de wet][ref5], en vervolgens vermenigvuldigd met de op dienovereenkomstige
      wijze bepaalde WOZ-waarde van de woongelegenheden die de betrokken toegelaten instelling in eigendom had.


