  - number: '78'
    text: |-
      Onze Minister keurt een voorgenomen administratieve scheiding niet goed, indien:

      a. de uitvoering van de daarin vervatte voornemens ertoe zou leiden dat de toegelaten instelling niet voldoet aan
      [artikel 48, eerste lid, eerste volzin, van de wet][ref1] of

      b. de zienswijze van een college of bewonersorganisatie als bedoeld in [artikel 73, eerste lid][ref2], daartoe naar
      zijn oordeel aanleiding geeft.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0036702#Artikel73
