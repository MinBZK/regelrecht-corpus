  - number: '61'
    text: |-
      1 De compensatie in enig boekjaar bedraagt:

      a. het in dat jaar door de toegelaten instelling genoten voordeel uit het aantrekken van leningen met gebruikmaking
      van de borgingsvoorziening, of van borgstelling daarvan door overheden, welk voordeel wordt bepaald op 0,7% van de
      zodanige leningen die de toegelaten instelling op 31 december van dat jaar in portefeuille had;

      b. de in dat jaar aan de toegelaten instelling toegekende subsidies als bedoeld in
      [artikel 57, eerste lid, onderdeel a, van de wet][ref1]. De toegekende subsidies worden evenredig toegerekend aan
      het lopende kalenderjaar en de negen daaropvolgende jaren;

      c. de in dat jaar door de toegelaten instelling ontvangen subsidies als bedoeld in
      [artikel 57, eerste lid, onderdeel b, van de wet][ref2]; en

      d. het in dat jaar door de toegelaten instelling genoten voordeel uit het verwerven van grond ten behoeve van het
      verrichten van werkzaamheden die behoren tot de diensten van algemeen economisch belang tegen een prijs die ligt
      beneden de marktwaarde van die grond op het tijdstip van die verwerving.

      2 Onze Minister berekent de overcompensatie in enig boekjaar overeenkomstig de formule:

      dnr-daeb-gesch **x** {(((dnr-daeb-gesch + tc)/mw-daeb) – rn)/((dnr-daeb-gesch + tc)/mw-daeb)},

      met dien verstande dat de overcompensatie niet hoger is dan de overeenkomstig het eerste lid berekende compensatie
      en niet hoger is dan dnr-daeb,

      in welke formule voorstelt:

        - dnr-daeb-gesch: het directe netto resultaat uit exploitatie in het betrokken boekjaar van de onroerende
      zaken in eigendom van de toegelaten instelling, die verband houden met haar werkzaamheden die behoren tot de
      diensten van algemeen economisch belang, voor de afdracht van de verschuldigde vennootschapsbelasting, bedoeld
      in [artikel 1 van de Wet op de vennootschapsbelasting 1969][ref3] en geschoond voor rentelasten, rentebaten,
      schenkingen en baten en lasten uit deelnemingen, beleggingen en liquiditeiten en andere baten en lasten uit
      overhead;
        - tc: de in het betreffende boekjaar verkregen compensatie, berekend overeenkomstig het eerste lid;
        - mw-daeb: de waarde op 31 december van het betrokken boekjaar van de onroerende zaken in eigendom van de
      toegelaten instelling, die verband houden met haar werkzaamheden die behoren tot de diensten van algemeen
      economisch belang;
        - rn: de rendementsnorm genoemd in het derde of vierde lid;
        - dnr-daeb: het directe netto resultaat uit exploitatie in het betrokken boekjaar van de onroerende zaken in
      eigendom van de toegelaten instelling, die verband houden met haar werkzaamheden die behoren tot de diensten van
      algemeen economisch belang.

      3 De rendementsnorm voor de boekjaren 2019 tot en met 2023 bedraagt 0,050.

      4 in afwijking van het derde lid bedraagt de rendementsnorm:

      a. 0,062 voor toegelaten instellingen als bedoeld in [artikel 41c, tweede lid, van de wet][ref4], die zich
      bij hun werkzaamheden in het bijzonder richten op de huisvesting van categorieën van personen, bedoeld in
      [artikel 36, onderdeel b][ref5];

      b. 0,057 voor toegelaten instellingen waarvan minimaal 50% van hun woongelegenheden is gelegen in regio’s
      die volgens de regionale bevolkings- en huishoudensprognose van het Centraal Bureau voor de Statistiek en het
      Planbureau voor de Leefomgeving nu of in de nabije toekomst kampen met bevolkingsdaling.

      5 Met ingang van het boekjaar 2024 worden de rendementsnormen, genoemd in het derde en vierde lid, telkens voor een
      periode van 5 jaren opnieuw vastgesteld.

      6 Indien een saneringsplan de eigen toegelaten instelling betreft toetst Onze Minister in het geval van een
      positieve uitkomst van de formule, bedoeld in het tweede lid, of die positieve uitkomst in overeenstemming is met
      de uitgangspunten van het saneringsplan. Voor zover de toets uitwijst dat dat het geval is wordt die uitkomst niet
      beschouwd als overcompensatie.

      7 De in enig boekjaar af te dragen overcompensatie bedraagt het gemiddelde van de op grond van het tweede lid
      berekende overcompensatie in dat boekjaar en de twee direct daaraan voorafgaande boekjaren, waarbij de af te dragen
      overcompensatie op nihil wordt vastgesteld indien de berekening leidt tot een negatieve uitkomst.

      8 In afwijking van het zevende lid:

      a. wordt de af te dragen overcompensatie over de boekjaren 2018 en 2019 vastgesteld op nihil;

      b. bedraagt de af te dragen overcompensatie over het boekjaar 2020 de som van de overcompensatie in het boekjaar
      2018, twee derde deel van de op grond van het tweede lid berekende overcompensatie in het boekjaar 2019 en één
      derde deel van de op grond van het tweede lid berekende overcompensatie in het boekjaar 2020.

      9 Onze Minister stelt de af te dragen overcompensatie, bedoeld in het zevende of achtste lid, vast en vordert de af
      te dragen overcompensatie terstond terug nadat deze is vastgesteld.

      10 In afwijking van het tweede lid wordt de overcompensatie in het boekjaar 2018 berekend op grond van artikel
      61 van dit besluit zoals dit luidde onmiddellijk voorafgaand aan inwerkingtreding van het besluit van 4 mei 2021
      houdende wijziging van het Besluit toegelaten instellingen volkshuisvesting 2015 in verband met de aanpassing van
      de wijze waarop overcompensatie voor toegelaten instellingen wordt bepaald (Stb. 2021, 247).


