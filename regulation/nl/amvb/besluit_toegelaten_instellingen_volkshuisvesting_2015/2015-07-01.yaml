    text: |-
      de aan die woongelegenheden toe te rekenen gedeelten van de leningen, verplichtingen, baten en lasten, bedoeld in
      [artikel 66, eerste lid, onderdelen f, h en i][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0036702#Artikel66
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel79
    references:
