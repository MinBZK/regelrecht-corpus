      [45, eerste lid, onderdeel a, zinsnede][ref2] «en tweede, derde en vierde lid,», [66][ref3], [67][ref4],
      [69, vierde lid][ref5], [70 tot en met 78][ref6], [79, tweede lid][ref7], en [80, vierde lid][ref8], niet van
      toepassing.


