  - number: '56.9'
    text: |-
      Aan het eerste lid, onderdeel b, en het achtste lid, onderdeel d, wordt toepassing gegeven overeenkomstig
      [bijlage 5][ref1] bij dit besluit. In die bijlage wordt met ingang van elk kalenderjaar bij ministeriële
      regeling de factor waarmee het verzamelinkomen als vastgesteld door de rijksbelastingdienst wordt
      vermenigvuldigd om tot het huishoudinkomen te komen gewijzigd met het percentage waarmee per gelijke datum het
      in [artikel 18, eerste lid, onderdeel d, van de Wet op de huurtoeslag][ref2] genoemde bedrag wordt gewijzigd. Bij
      ministeriële regeling worden over de kalenderjaren 2014 en eerder zodanige factoren vastgesteld, voor zover dat
      voor de toepassing van dit artikel noodzakelijk is, welke vaststelling zodanig geschiedt dat dezelfde factoren
      zouden zijn vastgesteld in het geval dat in die kalenderjaren de tweede volzin van toepassing was geweest.


