        afdeling: '5'
  - number: '80.1'
    text: |-
      Een verzoek als bedoeld in [artikel 50, eerste lid, van de wet][ref1] kan uitsluitend betrekking hebben op
      werkzaamheden als bedoeld in [artikel 47, eerste lid, onderdelen b tot en met f, van de wet][ref2] met betrekking
      tot:


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel50
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel47
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel80
