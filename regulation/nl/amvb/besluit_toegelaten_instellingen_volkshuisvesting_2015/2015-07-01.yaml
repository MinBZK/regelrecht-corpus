      of vennootschap alle handelingen verricht en aan de toegelaten instelling alle inlichtingen verstrekt
      die voor haar noodzakelijk zijn om aan de [artikelen 48, eerste, tweede en vierde lid][ref2], en
      [55, derde en vierde lid, van de wet][ref3] te voldoen.


