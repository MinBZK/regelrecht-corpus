        artikel: '111'
        hoofdstuk: VI
        paragraaf: '1'
        afdeling: '1'
  - number: '120'
    text: |-
      De autoriteit oefent toezicht uit op de juiste toepassing van de
      [Wet normering bezoldiging topfunctionarissen publieke en semipublieke sector][ref1], voor zover het de in
      [bijlage 1 bij die wet][ref2] opgenomen rechtspersonen of instellingen betreft met betrekking tot welke Onze
      Minister Onze Minister wie het aangaat is in de zin van [artikel 1.1, onderdeel o, onder 5°, van die wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0032249
      [ref2]: https://wetten.overheid.nl/BWBR0032249
      [ref3]: https://wetten.overheid.nl/BWBR0032249#Artikel1
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel120
    references:
      - id: ref1
        bwb_id: BWBR0032249
      - id: ref2
        bwb_id: BWBR0032249
      - id: ref3
        bwb_id: BWBR0032249
        artikel: '1'
  - number: '121.1'
    text: |-
      Elke toegelaten instelling die op 1 januari van een kalenderjaar als zodanig bestaat, is over dat kalenderjaar een
      bijdrage aan Onze Minister verschuldigd in de kosten die in het algemeen gemoeid zijn met de uitoefening van het
      toezicht. Onze Minister begroot de bijdrage voor alle toegelaten instellingen gezamenlijk.
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel121
  - number: '121.2'
    text: 'De bijdrage, bedoeld in de eerste volzin van het eerste lid, bedraagt de som van:'
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel121
  - number: 121.2.a
    text: |-
      de helft van het ingevolge de tweede volzin van het eerste lid begrote bedrag, gedeeld door het totale aantal
      woongelegenheden die de toegelaten instellingen en de dochtermaatschappijen op 31 december van het jaar
      voorafgaand aan het jaar waarover die bijdrage verschuldigd is in eigendom hadden volgens de gegevens, opgenomen
      in het overzicht, bedoeld in [artikel 36a, vierde lid, van de wet][ref1], en vervolgens vermenigvuldigd met het
      op dienovereenkomstige wijze bepaalde aantal woongelegenheden die de betrokken toegelaten instelling en haar
      dochtermaatschappijen in eigendom hadden, en


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel36a
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel121
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 36a
  - number: 121.2.b
    text: |-
      de helft van het ingevolge de tweede volzin van het eerste lid begrote bedrag, gedeeld door de totale WOZ-waarde
      van de woongelegenheden die de toegelaten instellingen en de dochtermaatschappijen op 31 december van het jaar
      voorafgaand aan het jaar waarover die bijdrage verschuldigd is in eigendom hadden volgens de gegevens, opgenomen
      in het overzicht, bedoeld in [artikel 36a, vierde lid, van de wet][ref1], en vervolgens vermenigvuldigd met de op
      dienovereenkomstige wijze bepaalde WOZ-waarde van de woongelegenheden die de betrokken toegelaten instelling en
      haar dochtermaatschappijen in eigendom hadden.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel36a
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel121
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 36a
  - number: '121.3'
    text: |-
      Onze Minister stelt per toegelaten instelling de bijdrage, bedoeld in het eerste lid, vast en maakt deze uiterlijk
      op 1 oktober van het jaar waarover deze verschuldigd is bekend aan de toegelaten instellingen.
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel121
  - number: '121.4'
    text: |-
      De bijdrage wordt betaald binnen een maand na dagtekening van de bekendmaking, bedoeld in het derde lid. Bij niet
      tijdige betaling is vanaf de datum van het verstrijken van die termijn de verplichting van toepassing tot betaling
      van een rente, bepaald overeenkomstig [afdeling 4.4.2 van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.4.2
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel121
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 4.4.2
  - number: '121.5'
    text: |-
      De kosten die gemoeid zijn met de ingevolge de [artikelen 48, zevende lid][ref1], [61d][ref2],
      [61g, eerste, tweede en derde lid][ref3], [61h, eerste lid][ref4], [104a, eerste lid][ref5],
      [105, eerste lid][ref6], en [120b van de wet][ref7] gegeven aanwijzingen en genomen maatregelen, worden in rekening
      gebracht bij de toegelaten instelling jegens welke of jegens welker dochtermaatschappij de betrokken aanwijzing of
      maatregel is gegeven respectievelijk genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel61d
      [ref3]: https://wetten.overheid.nl/BWBR0005181#Artikel61g
      [ref4]: https://wetten.overheid.nl/BWBR0005181#Artikel61h
