        artikel: '45'
  - number: 80.1.e
    text: |-
      gebouwen ten aanzien van welke Onze Minister toepassing heeft gegeven aan [artikel 49, tweede lid][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0036702#Artikel49
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0036702
        artikel: '49'
        hoofdstuk: V
        afdeling: '2'
  - number: '80.2'
    text: 'Het verzoek gaat in elk geval vergezeld van:'
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel80
  - number: 80.2.a
    text: |-
      een overzicht van haar woongelegenheden of gebouwen als bedoeld in het eerste lid, onderdeel a, b, c,
      d of e, die zij voornemens is administratief naar de niet-daeb-tak over te brengen, dat is uitgesplitst
      per gemeente waar die woongelegenheden of gebouwen gelegen zijn, en waarin zijn opgenomen de marktwaarde
      van die woongelegenheden of gebouwen, alsmede de huurprijs en de waardering van de kwaliteit, bedoeld in
      [artikel 5 van het Besluit huurprijzen woonruimte][ref1], van die woongelegenheden, en


      [ref1]: https://wetten.overheid.nl/BWBR0003237#Artikel5
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0003237
        artikel: '5'
  - number: 80.2.b
    text: de zienswijze van de betrokken gemeenten op het verzoek.
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel80
  - number: '80.3'
    text: 'Onze Minister willigt het verzoek niet in, indien:'
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel80
  - number: 80.3.a
    text: |-
      de uitvoering van de daarin vervatte voornemens er naar zijn oordeel toe zou leiden dat de toegelaten instelling
      niet voldoet aan [artikel 48, eerste lid, eerste volzin, van de wet][ref1] of


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel48
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '48'
  - number: 80.3.b
    text: een zienswijze als bedoeld in het tweede lid, onderdeel b, daartoe naar zijn oordeel aanleiding geeft.
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel80
  - number: '80.4'
    text: |-
      [Artikel 79, tweede lid, onderdeel a][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0036702#Artikel79
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel80
    references:
      - id: ref1
