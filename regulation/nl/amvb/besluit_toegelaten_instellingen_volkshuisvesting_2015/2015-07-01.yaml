  - number: '63.2'
    text: |-
      Onze Minister kan, indien de toegelaten instelling compensatie heeft verkregen in strijd met een besluit als
      bedoeld in het eerste lid, die compensatie terugvorderen.
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel63
  - number: '64.1'
    text: |-
      De toegelaten instellingen op welke [artikel 49, eerste lid, eerste volzin, van de wet][ref1] ingevolge de
      tweede volzin van dat lid niet van toepassing is, delen door middel van het opstellen van een kostenverdeelstaat
      jaarlijks hun baten en lasten toe aan werkzaamheden die behoren respectievelijk niet behoren tot de diensten van
      algemeen economisch belang. Daarbij maken zij inzichtelijk dat de compensatie uitsluitend ten goede is gekomen aan
      werkzaamheden die behoren tot de diensten van algemeen economisch belang.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel49
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '49'
  - number: '64.2'
    text: |-
