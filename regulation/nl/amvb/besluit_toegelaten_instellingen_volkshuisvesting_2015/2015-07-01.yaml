    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel75
  - number: '75.3'
    text: Bij ministeriële regeling kunnen nadere voorschriften worden gegeven omtrent de toepassing van dit artikel.
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel75
  - number: '76'
    text: |-
      Op verzoek van Onze Minister verstrekt de toegelaten instelling hem nadere inlichtingen over de voorgenomen
      administratieve scheiding, voor zover dat naar zijn oordeel voor de beoordeling van het verzoek om goedkeuring
      daarvan noodzakelijk is. Bij ministeriële regeling kunnen voorschriften worden gegeven omtrent de inlichtingen die
      de toegelaten instelling dient te verstrekken.
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel76
  - number: '77.1'
    text: |-
      Onze Minister betrekt bij zijn beoordeling van de financiële continuïteit van de daeb-tak na goedkeuring van de
      voorgenomen administratieve scheiding in elk geval:
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel77
  - number: 77.1.a
    text: zijn geraamde solvabiliteit na die scheiding;
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel77
  - number: 77.1.b
    text: |-
      de verhouding tussen het saldo van zijn operationele kasstromen en zijn rentelasten gedurende de eerste vijf jaren
      na die scheiding en
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel77
  - number: 77.1.c
    text: |-
      de meest recente beoordeling van zijn kredietwaardigheid door de borgingsvoorziening, indien de toegelaten
      instelling leningen als bedoeld in [artikel 66, eerste lid, onderdeel f][ref1], heeft aangetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0036702#Artikel66
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0036702
        artikel: '66'
        hoofdstuk: V
        paragraaf: '3'
        afdeling: '5'
  - number: '77.2'
    text: |-
      Onze Minister betrekt bij zijn beoordeling van de financiële continuïteit van de niet-daeb-tak na goedkeuring van
      de voorgenomen administratieve scheiding in elk geval zijn geraamde solvabiliteit na die scheiding.
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel77
  - number: '77.3'
    text: Bij ministeriële regeling kunnen nadere voorschriften worden gegeven omtrent de toepassing van dit artikel.
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel77
  - number: '78'
    text: 'Onze Minister keurt een voorgenomen administratieve scheiding niet goed, indien:'
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel78
  - number: 78.a
    text: |-
      de uitvoering van de daarin vervatte voornemens ertoe zou leiden dat de toegelaten instelling niet voldoet aan
      [artikel 48, eerste lid, eerste volzin, van de wet][ref1] of


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel48
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '48'
  - number: 78.b
    text: |-
      de zienswijze van een college als bedoeld in [artikel 73, eerste lid][ref1], daartoe naar zijn oordeel aanleiding
      geeft.


      [ref1]: https://wetten.overheid.nl/BWBR0036702#Artikel73
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel78
