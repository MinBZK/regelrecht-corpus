        bwb_id: BWBR0036702
        artikel: '64'
        hoofdstuk: V
        paragraaf: '1'
        afdeling: '5'
      - id: ref3
        bwb_id: BWBR0036702
        artikel: '65'
        hoofdstuk: V
        paragraaf: '2'
        afdeling: '5'
      - id: ref4
        bwb_id: BWBR0005181
        artikel: '36'
  - number: '68.3'
    text: |-
      [Artikel 65, derde en vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0036702#Artikel65
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0036702
        artikel: '65'
        hoofdstuk: V
        paragraaf: '2'
        afdeling: '5'
  - number: '68.4'
    text: |-
      Dit artikel is niet van toepassing, indien de betrokken gemeente een gemeente is als genoemd in
      [artikel 1.11, tweede lid, onderdeel b, van de Wet maatregelen woningmarkt II][ref1], of een deelgemeente van de
      gemeente Rotterdam is als genoemd in artikel 1.11, tweede lid, onderdeel a, van die wet.


      [ref1]: https://wetten.overheid.nl/BWBR0034553#Artikel1
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0034553
        artikel: '1'
  - number: '69.1'
    text: 'De toegelaten instelling kan in geval van herstructurering ten laste van de daeb-tak brengen:'
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel69
  - number: 69.1.a
    text: |-
      voor zover die herstructurering bestaat uit werkzaamheden als bedoeld in [artikel 1, eerste lid][ref1],
      begripsomschrijving van herstructurering, aanhef en onderdeel a: de kosten die zijn gemoeid met het verwerven
      van de betrokken onroerende zaken die verband houden met werkzaamheden die behoren tot de diensten van algemeen
      economisch belang, dan wel met de afboeking van die onroerende zaken, vermeerderd met de kosten van de sloop
      van die onroerende zaken en het bouwrijp maken van de grond ter plaatse van die sloop, en verminderd met de op
      residuele wijze, uitgaande van de voorgenomen bouw van onroerende zaken die verband houden met werkzaamheden die
      niet behoren tot de diensten van algemeen economisch belang, bepaalde marktwaarde van die grond na het bouwrijp
      maken daarvan;


      [ref1]: https://wetten.overheid.nl/BWBR0036702#Artikel1
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0036702
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
  - number: 69.1.b
    text: |-
      voor zover die herstructurering bestaat uit werkzaamheden als bedoeld in [artikel 1, eerste lid][ref1],
      begripsomschrijving van herstructurering, aanhef en onderdeel b: de kosten die zijn gemoeid met het verwerven
      van de betrokken onroerende zaken die verband houden met werkzaamheden die behoren tot de diensten van algemeen
      economisch belang, dan wel met de afboeking van die onroerende zaken, verminderd met de op residuele wijze,
      uitgaande van het voorgenomen treffen van ingrijpende voorzieningen of de voorgenomen samenvoeging, bepaalde
      marktwaarde van die onroerende zaken.


      [ref1]: https://wetten.overheid.nl/BWBR0036702#Artikel1
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0036702
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
  - number: '69.2'
    text: |-
      Bij toepassing van het eerste lid kan in het tijdvak dat aanvangt op het ingangstijdstip, bedoeld in
      [artikel II, vierde lid, tweede volzin, van de Herzieningswet toegelaten instellingen volkshuisvesting][ref1], en
      eindigt op 31 december 2025, ten hoogste het bedrag, bedoeld in [artikel 65, eerste of tweede lid][ref2], ten laste
      van de daeb-tak worden gebracht. Bij toepassing van dat lid kan per daaropvolgend tijdvak van tien jaar, waarvan
      het eerste aanvangt op 1 januari 2026 en de volgende telkens tien jaar nadien, ten hoogste het bedrag, bedoeld in
      [artikel 68, eerste of tweede lid][ref3], ten laste van die tak worden gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0036530#ArtikelII
      [ref2]: https://wetten.overheid.nl/BWBR0036702#Artikel65
      [ref3]: https://wetten.overheid.nl/BWBR0036702#Artikel1
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0036530
        artikel: II
      - id: ref2
        bwb_id: BWBR0036702
        artikel: '65'
        hoofdstuk: V
        paragraaf: '2'
        afdeling: '5'
      - id: ref3
        bwb_id: BWBR0036702
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
  - number: '69.3'
    text: |-
      Het ten laste brengen in enig tijdvak, bedoeld in het eerste en tweede lid, is uitsluitend van toepassing op
      herstructurering, met welke in dat tijdvak een aanvang is gemaakt, of met betrekking tot welke uit schriftelijke,
      uitsluitend op die herstructurering betrekking hebbende, stukken blijkt dat het maken van die aanvang wordt beoogd.
      Bij ministeriële regeling kunnen voorschriften worden gegeven omtrent de toepassing van dit lid.
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel69
  - number: '69.4'
    text: |-
      Bij toepassing van het eerste lid, aanhef en onderdeel a, gaat onverwijld na het bouwrijp maken van de grond,
      bedoeld in dat onderdeel, die grond over naar de niet-daeb-tak onder verrekening tussen de daeb-tak en de niet-
      daeb-tak van de marktwaarde daarvan, bepaald overeenkomstig dat onderdeel.
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel69
  - number: '69.5'
    text: |-
      Het tweede, derde en vierde lid zijn niet van toepassing, indien de betrokken gemeente een gemeente is als genoemd
      in [artikel 1.11, tweede lid, onderdeel b, van de Wet maatregelen woningmarkt II][ref1], of een deelgemeente van de
      gemeente Rotterdam is als genoemd in artikel 1.11, tweede lid, onderdeel a, van die wet.


      [ref1]: https://wetten.overheid.nl/BWBR0034553#Artikel1
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0034553
        artikel: '1'
  - number: '70.1'
    text: |-
      Indien de toepassing van het bepaalde bij en krachtens de [artikelen 66][ref1] en [67][ref2] er zonder nadere
      maatregelen toe zou leiden, dat de financiële continuïteit van de daeb-tak niet in dezelfde mate is gewaarborgd als
      die van de niet-daeb-tak, voert de toegelaten instelling bij die toepassing onder de naam «interne startlening» een
      vordering van de daeb-tak op de niet-daeb-tak op. Op het rentepercentage van die vordering is het bepaalde bij en
      krachtens [artikel 10, tweede lid, onderdeel a][ref3], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0036702#Artikel66
      [ref2]: https://wetten.overheid.nl/BWBR0036702#Artikel67
      [ref3]: https://wetten.overheid.nl/BWBR0036702#Artikel10
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0036702
        artikel: '66'
        hoofdstuk: V
        paragraaf: '3'
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0036702
        artikel: '67'
        hoofdstuk: V
        paragraaf: '3'
        afdeling: '5'
      - id: ref3
        bwb_id: BWBR0036702
        artikel: '10'
        hoofdstuk: III
        paragraaf: '3'
  - number: '70.2'
    text: |-
      Van de vordering, bedoeld in het eerste lid, wordt ten minste een maal per vijf jaar een bedrag
      ingelost, dat verhoudingsgewijs gelijk is aan het periodiek af te lossen bedrag op de leningen die
      zijn aangetrokken met gebruikmaking van de borgingsvoorziening. Bij de toepassing van de eerste
      volzin wordt uitgegaan van die vordering en die leningen als opgenomen in het voorstel, bedoeld in
      [artikel II, derde lid, tweede volzin, van de Herzieningswet toegelaten instellingen volkshuisvesting][ref1], dat
      Onze Minister ingevolge artikel II, vierde lid, eerste volzin, van die wet heeft goedgekeurd.


      [ref1]: https://wetten.overheid.nl/BWBR0036530#ArtikelII
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0036530
        artikel: II
  - number: '70.3'
    text: |-
      De toegelaten instelling kan Onze Minister verzoeken om de inlossing, bedoeld in het tweede lid, op een later
      tijdstip te stellen of het in te lossen bedrag lager vast te stellen. Onze Minister willigt het verzoek uitsluitend
      in, indien naar zijn oordeel daardoor wordt voorkomen dat de financiële continuïteit van de niet-daeb-tak niet meer
      is gewaarborgd en de financiële continuïteit van de daeb-tak gewaarborgd blijft. Hij kan aan dat inwilligen nadere
      voorwaarden verbinden.
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel70
  - number: '70.4'
    text: Bij ministeriële regeling kunnen nadere voorschriften worden gegeven omtrent de toepassing van dit artikel.
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel70
  - number: '71.1'
    text: |-
      Overdrachten door de toegelaten instelling tussen haar daeb-tak en haar niet-daeb-tak van garanties of rechten
      van pand of hypotheek op zaken en daarmee verbonden rechten na het tijdstip waarop artikel I van de Herzieningswet
      toegelaten instellingen volkshuisvesting in werking is getreden leiden op generlei wijze tot een wijziging voor
      derden in het kunnen inroepen van hun rechten jegens de toegelaten instelling.
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel71
  - number: '71.2'
    text: |-
      De toegelaten instelling verschaft vanuit haar daeb-tak niet anderszins financiële middelen aan haar
      niet-daeb-tak dan door middel van een voorziening als bedoeld in [artikel 44, tweede lid][ref1],
      een interne startlening als bedoeld in artikel 70, eerste lid, of een interne lening als bedoeld in
      [artikel 79, tweede lid, onderdeel a][ref2]. Zij verschaft vanuit haar daeb-tak geen garanties aan haar niet-daeb-
      tak.


      [ref1]: https://wetten.overheid.nl/BWBR0036702#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0036702#Artikel79
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0036702
        artikel: '44'
        hoofdstuk: V
        paragraaf: '4'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0036702
        artikel: '79'
        hoofdstuk: V
        paragraaf: '5'
        afdeling: '5'
  - number: '71.3'
    text: |-
      De toegelaten instelling kan Onze Minister verzoeken om een ontheffing van het verbod, bedoeld in het tweede lid.
      Onze Minister willigt het verzoek uitsluitend in, indien dat naar zijn oordeel noodzakelijk is:
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel71
  - number: 71.3.a
    text: |-
      om te voorkomen dat de toegelaten instelling gehouden is om schulden van de niet-daeb-tak uit haar daeb-tak te
      voldoen of
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel71
  - number: 71.3.b
    text: |-
      ten behoeve van de herfinanciering van leningen die bestonden op het tijdstip waarop
      [artikel I van de Herzieningswet toegelaten instellingen volkshuisvesting][ref1] in werking is getreden en nadien
      in de niet-daeb-tak zijn ondergebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0036530#ArtikelI
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0036530
        artikel: I
  - number: '72'
    text: |-
      De administratie van de toegelaten instelling wordt met inachtneming van het bepaalde bij en krachtens de
      [artikelen 66 tot en met 71][ref1] ingericht. In die administratie wordt elke overdracht van financiële middelen
      vanuit de niet-daeb-tak van de toegelaten instelling aan haar daeb-tak afzonderlijk verantwoord.


      [ref1]: https://wetten.overheid.nl/BWBR0036702#Artikel66
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0036702
        artikel: '66'
        hoofdstuk: V
        paragraaf: '3'
        afdeling: '5'
  - number: '73.1'
    text: |-
      De toegelaten instelling stelt, voordat zij een verzoek om goedkeuring van een voorgenomen administratieve
      scheiding indient, de colleges van burgemeester en wethouders van de gemeente waar zij haar woonplaats heeft
      en van de gemeenten waar zij feitelijk werkzaam is, de betrokken bewonersorganisaties en de huurders van
      haar andere gebouwen dan woongelegenheden in de gelegenheid om hun zienswijze op die scheiding te geven. De
      personen en instanties, bedoeld in de eerste volzin, kunnen binnen zes weken hun zienswijzen aan de toegelaten
      instelling doen toekomen. De betrokken bewonersorganisaties kunnen binnen zes weken hun adviezen, bedoeld in
      [artikel 5, eerste lid, van de Wet op het overleg huurders verhuurder][ref1], aan haar doen toekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0009810#Artikel5
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0009810
        artikel: '5'
  - number: '73.2'
    text: |-
      De toegelaten instelling verstrekt de personen en instanties, bedoeld in het eerste lid, eerste volzin, alle
      inlichtingen die redelijkerwijs kunnen bijdragen aan het zich vormen van hun zienswijze, of aan het opstellen van
      een advies als bedoeld in [artikel 5, eerste lid, van de Wet op het overleg huurders verhuurder][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009810#Artikel5
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0009810
        artikel: '5'
  - number: '73.3'
    text: Bij ministeriële regeling kunnen nadere voorschriften worden gegeven omtrent de toepassing van het tweede lid.
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel73
  - number: '74.1'
    text: |-
      De toegelaten instelling voert overleg over het verzoek om goedkeuring van de voorgenomen administratieve scheiding
      met de gemeente waar zij haar woonplaats heeft en de gemeenten waar zij feitelijk werkzaam is, alsmede met de
      betrokken bewonersorganisaties.
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel74
  - number: '74.2'
    text: |-
      De toegelaten instelling stelt de huurders van haar andere gebouwen dan woongelegenheden in de gelegenheid met haar
      overleg te voeren over het verzoek, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel74
  - number: '75.1'
    text: 'Het verzoek om goedkeuring van de voorgenomen administratieve scheiding gaat in elk geval vergezeld van:'
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel75
  - number: 75.1.a
    text: |-
      het voorstel, bedoeld in
      [artikel II, derde lid, tweede volzin, van de Herzieningswet toegelaten instellingen volkshuisvesting][ref1], en
      een schriftelijke toelichting daarop;


      [ref1]: https://wetten.overheid.nl/BWBR0036530#ArtikelII
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0036530
        artikel: II
  - number: 75.1.b
    text: |-
      de gegevens over de beoogde toepassing van het bepaalde bij en krachtens de [artikelen 44][ref1], [70][ref2] en
      [71][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0036702#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0036702#Artikel70
      [ref3]: https://wetten.overheid.nl/BWBR0036702#Artikel71
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0036702
        artikel: '44'
        hoofdstuk: V
        paragraaf: '4'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0036702
        artikel: '70'
        hoofdstuk: V
        paragraaf: '3'
        afdeling: '5'
      - id: ref3
        bwb_id: BWBR0036702
        artikel: '71'
        hoofdstuk: V
        paragraaf: '3'
        afdeling: '5'
  - number: 75.1.c
    text: |-
      de zienswijzen daarop van de personen en instanties, bedoeld in [artikel 73, eerste lid][ref1], en, in geval van
      een negatieve zodanige zienswijze, een onderbouwde reactie daarop van de toegelaten instelling, dan wel, bij het
      uitgebleven zijn van een zienswijze, bescheiden waaruit blijkt dat zij om die zienswijze heeft gevraagd;


      [ref1]: https://wetten.overheid.nl/BWBR0036702#Artikel73
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0036702
        artikel: '73'
        hoofdstuk: V
        paragraaf: '4'
        afdeling: '5'
  - number: 75.1.d
    text: |-
      de adviezen, bedoeld in [artikel 5, eerste lid, van de Wet op het overleg huurders verhuurder][ref1], en, in geval
      van een negatief zodanig advies, een onderbouwde reactie daarop van de toegelaten instelling, dan wel, bij het
      uitgebleven zijn van een advies, bescheiden waaruit blijkt dat zij om dat advies heeft gevraagd en


      [ref1]: https://wetten.overheid.nl/BWBR0009810#Artikel5
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0009810
        artikel: '5'
  - number: 75.1.e
    text: de balans van de toegelaten instelling zoals zij die na de goedkeuring van die scheiding beoogt in te richten.
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel75
  - number: '75.2'
    text: 'In de toelichting op het voorstel voor de voorgenomen administratieve scheiding wordt in elk geval opgenomen:'
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel75
  - number: 75.2.a
    text: |-
      de motieven voor het bij die scheiding toepassing geven aan
      [artikel II, derde lid, derde volzin, van de Herzieningswet toegelaten instellingen volkshuisvesting][ref1],
      waarbij in elk geval wordt ingegaan op het door de toegelaten instelling na die toepassing kunnen naleven van
      [artikel 48, eerste lid, eerste volzin, van de wet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0036530#ArtikelII
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel48
