  - number: 24.c
    text: een vervreemding onder voorwaarden;
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel24
  - number: 24.d
    text: |-
      de vervreemding van een gebouw als bedoeld in [artikel 45, tweede lid, onderdeel d, van de wet][ref1] tegen een
      prijs van ten minste de getaxeerde leegwaarde of de WOZ-waarde aan degene die het direct voorafgaand aan die
      vervreemding huurde;


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel45
