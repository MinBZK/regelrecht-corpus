    text: |-
      de vervreemding van een andere onroerende zaak dan een woongelegenheid of een gebouw als bedoeld in
      [artikel 45, tweede lid, onderdeel d, van de wet][ref1] of


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel45
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel24
    references:
