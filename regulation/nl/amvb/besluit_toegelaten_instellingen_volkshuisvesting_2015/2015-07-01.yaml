        artikel: '47'
      - id: ref2
        bwb_id: BWBR0008659
        artikel: '13'
  - number: '79.2'
    text: 'In een geval als bedoeld in het eerste lid brengt de toegelaten instelling in haar niet-daeb-tak onder:'
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel79
  - number: 79.2.a
    text: |-
      de betrokken woongelegenheden, tegen hun marktwaarde, onder een gelijktijdige verrekening tussen haar niet-
      daeb-tak en haar daeb-tak waarmee een geldbedrag gemoeid is dat hetzij gelijk is aan die marktwaarde, hetzij
      lager is dan die marktwaarde, in welk geval zij voorts tegelijkertijd ten laste van de voorziening, bedoeld in
      [artikel 44, tweede lid][ref1], een interne lening verstrekt welke aan de niet-daeb-tak ten goede komt, ter hoogte
      van het verschil tussen het verrekende bedrag en die marktwaarde, welke lening een rentepercentage heeft dat
      gelijk is aan de op het tijdstip van verstrekking daarvan geldende rente op tienjarige staatsleningen, vermeerderd
      met een bij ministeriële regeling te bepalen percentage, en wordt afgelost onder overeenkomstige toepassing van
      [artikel 10, tweede lid, onderdeel b, en derde lid][ref2], en


      [ref1]: https://wetten.overheid.nl/BWBR0036702#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0036702#Artikel10
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel79
