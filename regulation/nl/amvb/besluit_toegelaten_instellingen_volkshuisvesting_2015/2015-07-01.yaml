        artikel: '13'
      - id: ref2
        bwb_id: BWBR0003237
        artikel: '5'
  - number: 80.1.b
    text: |-
      woongelegenheden met een huurprijs van ten hoogste het in
      [artikel 13, eerste lid, onderdeel a, van de Wet op de huurtoeslag][ref1] genoemde bedrag, waarvan de waardering
      van de kwaliteit, bedoeld in [artikel 5 van het Besluit huurprijzen woonruimte][ref2], niet kan leiden tot een
