        paragraaf: '4'
        afdeling: '5'
  - number: '79.1'
    text: |-
      Indien de toegelaten instelling met betrekking tot een woongelegenheid een overeenkomst van huur en verhuur
      aangaat met een opvolgende huurder, waarbij de huurprijs hoger wordt of, in geval van een woongelegenheid
      als bedoeld in [artikel 47, eerste lid, onderdeel c, van de wet][ref1], hoger blijft dan het in
      [artikel 13, eerste lid, onderdeel a, van de Wet op de huurtoeslag][ref2] genoemde bedrag, behoren vanaf het
      tijdstip waarop die overeenkomst ingaat de werkzaamheden met betrekking tot die woongelegenheid niet meer tot de
      diensten van algemeen economisch belang.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0008659#Artikel13
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel79
    references:
