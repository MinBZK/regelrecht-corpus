    text: |-
      een uiteenzetting over de financiële continuïteit van de daeb-tak en de niet-daeb-tak na die scheiding, mede
      inhoudende een uiteenzetting over de financiële gevolgen van de in verband met die scheiding verwachte wijzigingen
      in het beleid van de toegelaten instelling en
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel75
