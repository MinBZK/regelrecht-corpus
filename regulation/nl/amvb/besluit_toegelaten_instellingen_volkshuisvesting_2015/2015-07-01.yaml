    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '44'
  - number: 32.1.d
    text: het gevoerde overleg met de betrokken bewonersorganisaties;
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel32
  - number: 32.1.e
    text: |-
      de uitvoering van elk van haar werkzaamheden, bedoeld in [artikel 45 van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel45
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '45'
  - number: 32.1.f
    text: |-
      de uitvoering van [artikel 46 van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel46
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '46'
  - number: 32.1.g
    text: |-
      de uitvoering van het reglement, bedoeld in [artikel 55a, tweede lid, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel55a
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 55a
  - number: 32.1.h
    text: |-
      de uitvoering van het reglement, bedoeld in [artikel 55b, derde lid, van de wet][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel55b
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 55b
  - number: 32.1.i
    text: de uitvoering van haar andere reglementen.
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel32
  - number: '32.2'
    text: |-
      Het volkshuisvestingsverslag omvat voorts een overzicht van de met de toegelaten instelling verbonden
      ondernemingen, met uitzondering van de ondernemingen van welke de toegelaten instelling minder dan 2% van de
      aandelen houdt, en een uiteenzetting over hun werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel32
  - number: '33.1'
    text: |-
      Onze Minister beoordeelt bij de toepassing van de [artikelen 38, vierde lid][ref1], en
      [44a, tweede lid, van de wet][ref2] in elk geval:


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel44a
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '38'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: 44a
  - number: 33.1.a
    text: |-
      de liquiditeit van de toegelaten instelling, waaronder in elk geval de risico’s daarvoor vanwege het bezit van
      financiële derivaten;
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel33
  - number: 33.1.b
    text: haar solvabiliteit;
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel33
  - number: 33.1.c
    text: haar ruimte voor het doen van investeringen in de eerstvolgende vijf kalenderjaren na het verslagjaar;
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel33
  - number: 33.1.d
    text: |-
      haar beschikbare financiële middelen in verhouding tot de werkzaamheden die zijn opgenomen in het overzicht,
      bedoeld in [artikel 44a, eerste lid, onderdeel a, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel44a
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 44a
  - number: 33.1.e
    text: |-
      de mate waarin het risico bestaat dat haar vermogen niet bestemd blijft voor het behartigen van het belang van de
      volkshuisvesting en
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel33
  - number: 33.1.f
    text: de kwaliteit van haar organisatiestructuur.
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel33
  - number: '33.2'
    text: |-
      Bij ministeriële regeling kan worden bepaald welke onderwerpen voorts in elk geval worden beoordeeld bij de
      toepassing van de [artikelen 38, vierde lid][ref1], en [44a, tweede lid, van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel44a
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '38'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: 44a
  - number: '34.1'
    text: |-
      Onze Minister keurt een voornemen als bedoeld in [artikel 41a, eerste lid, van de wet][ref1] niet goed, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel41a
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 41a
  - number: 34.1.a
    text: |-
      de gemeente waarop dat voornemen betrekking heeft niet direct grenst aan een gemeente in Nederland waar de
      toegelaten instelling feitelijk werkzaam is;
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel34
  - number: 34.1.b
    text: |-
      die toegelaten instelling in de gemeenten in Nederland waar zij feitelijk werkzaam is niet alle personen kan
      huisvesten die aldaar door hun inkomen of door andere omstandigheden moeilijkheden ondervinden bij het vinden van
      hun passende huisvesting, of
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel34
  - number: 34.1.c
    text: |-
      zienswijzen op dat voornemen van de gemeente waarop het betrekking heeft of de direct aan die gemeente grenzende
      gemeenten in Nederland hem daartoe naar zijn oordeel aanleiding geven.
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel34
  - number: '34.2'
    text: |-
      Bij ministeriële regeling kunnen nadere voorschriften worden gegeven omtrent de toepassing van het eerste lid,
      onderdelen b en c.
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel34
  - number: '38.1'
    text: |-
      Onze Minister draagt er zorg voor dat jaarlijks voor 1 juli elke gemeente met betrekking tot de toegelaten
      instellingen die aldaar feitelijk werkzaam zijn en elke betrokken bewonersorganisatie beschikt over een
      indicatie van de middelen welke die toegelaten instellingen ter beschikking staan voor de uitvoering van
      [artikel 42, eerste lid, eerste volzin, van de wet][ref1] in ten minste het op die datum eerstvolgende
      kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel42
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '42'
  - number: '38.2'
    text: |-
      Bij ministeriële regeling kunnen voorschriften worden gegeven omtrent de wijze van bepaling van de indicatie,
      bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel38
  - number: '39.1'
    text: |-
      De toegelaten instelling neemt in het overzicht, bedoeld in [artikel 43, eerste lid, van de wet][ref1], in elk
      geval op:


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel43
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '43'
  - number: 39.1.a
    text: |-
      haar voornemens voor het doen bouwen of verwerven van woongelegenheden als bedoeld in
      [artikel 47, eerste lid, onderdeel b, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel47
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '47'
  - number: 39.1.b
    text: |-
      haar voornemens met betrekking tot het toepassing geven aan
      [artikel 45, tweede lid, onderdelen d en f, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel45
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '45'
  - number: 39.1.c
    text: |-
      haar voornemens met betrekking tot de samenstelling van haar woningvoorraad, waaronder in elk geval
      haar voornemens met betrekking tot vervreemding van haar woongelegenheden en haar voornemens tot
      het zodanig verhogen van huurprijzen van haar woongelegenheden, dat zij komen te liggen boven het in
      [artikel 13, eerste lid, onderdeel a, van de Wet op de huurtoeslag][ref1] genoemde bedrag, een en ander
      gespecificeerd naar wijken of buurten aan de hand van de cijfers van de postcodes;


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel13
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: '13'
  - number: 39.1.d
    text: |-
      haar voornemens met betrekking tot de kwaliteit en de duurzaamheid van haar woningvoorraad en de direct daaraan
      grenzende omgeving;
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel39
  - number: 39.1.e
    text: |-
      haar voornemens met betrekking tot de betaalbaarheid en de bereikbaarheid van haar woongelegenheden voor degenen,
      bedoeld in [artikel 46, eerste lid, onderdeel a, van de wet][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel46
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '46'
  - number: 39.1.f
    text: |-
      haar voornemens met betrekking tot de huisvesting van de categorieën van personen, genoemd in [artikel 36][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0036702#Artikel36
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0036702
        artikel: '36'
        hoofdstuk: V
        paragraaf: '1'
        afdeling: '1'
  - number: '39.2'
    text: |-
      De toegelaten instelling betrekt bij het vaststellen van het overzicht, bedoeld in
      [artikel 43, eerste lid, van de wet][ref1], de door Onze Minister vast te stellen rijksprioriteiten met betrekking
      tot het terrein van de volkshuisvesting. Onze Minister stelt die prioriteiten ten minste een maal per vier jaar
      vast voor een tijdvak van de vier op dat jaar volgende kalenderjaren, doet deze voor de aanvang van dat tijdvak
      toekomen aan beide kamers der Staten-Generaal en maakt deze bekend in de Staatscourant. In het kalenderjaar dat
      direct voorafgaat aan een zodanig tijdvak voert hij overleg over de voor dat tijdvak voorgenomen prioriteiten
      met in elk geval personen of instanties uit de kring van de toegelaten instellingen, de gemeenten en de
      bewonersorganisaties.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel43
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '43'
  - number: '39.3'
    text: |-
      Het overzicht, bedoeld in [artikel 43, eerste lid, van de wet][ref1], heeft geen betrekking op de met de toegelaten
      instelling verbonden ondernemingen van welke zij minder dan 2% van de aandelen houdt.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel43
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '43'
  - number: '41'
    text: |-
      [Artikel 44c, eerste lid, van de wet][ref1] is niet van toepassing op de werkzaamheden, bedoeld in
      [artikel 45, tweede lid, onderdeel b, van de wet][ref2], die niet behoren tot de diensten van algemeen economisch
      belang, en op de werkzaamheden, bedoeld in artikel 45, tweede lid, onderdeel h, van de wet, alsmede, voor zover
      daarmee verband houdende, op de werkzaamheden, bedoeld in artikel 45, tweede lid, onderdeel i, van de wet.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel44c
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel45
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 44c
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '45'
  - number: '42'
    text: |-
      [Artikel 44c, eerste lid, onderdelen b, c en d, van de wet][ref1] is niet van toepassing, indien de werkzaamheden
      die niet behoren tot de diensten van algemeen economisch belang bestaan uit herstructurering die plaatsvindt op
      grond die de toegelaten instelling voor 1 januari 2015 heeft verworven, in welk geval de mededeling, bedoeld in
      artikel 44c, eerste lid, onderdeel f, van de wet, dient te zijn gedaan onverwijld na de toepassing van onderdeel a
      van dat lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel44c
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 44c
  - number: '43.1'
    text: |-
      De verklaring, bedoeld in [artikel 44c, eerste lid, onderdeel c, van de wet][ref1], houdt mede in dat de colleges,
      bedoeld in artikel 44c, eerste lid, onderdeel b, van de wet:


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel44c
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 44c
  - number: 43.1.a
    text: |-
      met de algemene bekendmaking, bedoeld in laatstgenoemd onderdeel, dezelfde inlichtingen over de in
      [artikel 44c, eerste lid, aanhef, van de wet][ref1] bedoelde voornemens hebben verstrekt aan alle ontvangers
      daarvan en


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel44c
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 44c
  - number: 43.1.b
    text: |-
      wijzigingen van die voornemens of de voorwaarden waaronder zij zouden moeten worden uitgevoerd onverwijld, door
      middel van een algemene bekendmaking langs elektronische weg die voldoet aan onderdeel a, aan alle ontvangers,
      bedoeld in onderdeel a, hebben medegedeeld, en die ontvangers in de gelegenheid hebben gesteld aan die colleges
      kenbaar te maken of zij die voornemens in hun gewijzigde vorm wensen uit te voeren.
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel43
  - number: '43.2'
    text: |-
      Bij ministeriële regeling kunnen voorschriften of nadere voorschriften worden gegeven omtrent hetgeen een
      verklaring als bedoeld in [artikel 44c, eerste lid, onderdeel c, d of e, van de wet][ref1] dient te omvatten.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel44c
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 44c
  - number: '44.1'
    text: |-
      De toegelaten instelling trekt de financiële middelen voor de uitvoering van de voornemens, bedoeld in
      [artikel 44c, eerste lid, aanhef, van de wet][ref1], uitsluitend aan bij categorieën van instellingen als
      bedoeld in het bepaalde bij en krachtens [artikel 13, eerste en tweede lid][ref2], en zonder gebruikmaking van de
      borgingsvoorziening. Zij kan uitsluitend op een andere wijze financiële middelen voor die uitvoering inzetten:


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel44c
      [ref2]: https://wetten.overheid.nl/BWBR0036702#Artikel13
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 44c
      - id: ref2
        bwb_id: BWBR0036702
        artikel: '13'
        hoofdstuk: III
        paragraaf: '3'
  - number: 44.1.a
    text: in geval van herstructurering of
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel44
  - number: 44.1.b
    text: |-
      indien zij ten overstaan van Onze Minister aannemelijk heeft gemaakt dat zij geen gevolg kan geven aan de eerste
      volzin.
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel44
  - number: '44.2'
    text: |-
      De toegelaten instelling stelt ten behoeve van toepassing van het eerste lid, tweede volzin, een voorziening
      in, ten laste waarvan zij een interne lening verstrekt, welke aan de niet-daeb-tak ten goede komt. Op het
      rentepercentage van die lening is het bepaalde bij en krachtens [artikel 10, tweede lid, onderdeel a][ref1], van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0036702#Artikel10
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0036702
        artikel: '10'
        hoofdstuk: III
        paragraaf: '3'
  - number: '44.3'
    text: |-
      De voorziening, bedoeld in het tweede lid, bevat uitsluitend de netto-opbrengsten van vervreemdingen op 1 januari
      2012 of nadien van woongelegenheden als bedoeld in [artikel 66, eerste lid, onderdelen a en b][ref1], en
      [artikel 47, eerste lid, onderdeel c, van de wet][ref2], verminderd met het per jaar aan die woongelegenheden
      toe te rekenen deel van de leningen, bedoeld in artikel 66, eerste lid, onderdeel f, welk deel verhoudingsgewijs
      gelijk is aan het quotiënt van het totaalbedrag van die leningen en dat van de WOZ-waarde van die woongelegenheden,
      welke totaalbedragen blijken uit de voor dat jaar vastgestelde balans van de toegelaten instelling. De voorziening
      bevat die aldus verminderde netto-opbrengsten voorts uitsluitend, voor zover er een batig saldo over het betrokken
      jaar is uit de verhuur en de vervreemding van woongelegenheden als bedoeld in de eerste volzin, bepaald op grond
      van waardering van die woongelegenheden tegen de marktwaarde. De eerste en tweede volzin zijn van overeenkomstige
      toepassing op de jaarlijks aan de voorziening toe te voegen middelen.


      [ref1]: https://wetten.overheid.nl/BWBR0036702#Artikel66
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel47
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0036702
        artikel: '66'
        hoofdstuk: V
        paragraaf: '3'
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '47'
  - number: '44.4'
    text: |-
      Op de aflossing van de lening, bedoeld in het tweede lid, is [artikel 70, tweede lid][ref1], van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0036702#Artikel70
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0036702
        artikel: '70'
        hoofdstuk: V
        paragraaf: '3'
        afdeling: '5'
  - number: '45.1'
    text: |-
      Onze Minister onthoudt zijn goedkeuring op grond van
      [artikel 44c, derde lid, aanhef en onderdeel b, van de wet][ref1], indien blijkens de zienswijze, bedoeld in het
      eerste lid, onderdeel i, van dat artikel, naar het oordeel van Onze Minister niet aannemelijk is dat:


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel44c
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 44c
  - number: 45.1.a
    text: |-
      bij toepassing van [artikel 44, eerste lid, tweede volzin, en tweede, derde en vierde lid][ref1], een rendement op
      de werkzaamheden, bedoeld in [artikel 44c, eerste lid, aanhef en onderdeel f, van de wet][ref2], wordt behaald dat
      ten minste gelijk is aan een bij ministeriële regeling te bepalen rendement dat kan worden behaald bij toepassing
      van artikel 44, eerste lid, eerste volzin, en dat verschillend kan worden bepaald naar gelang de aard van die
      werkzaamheden;


      [ref1]: https://wetten.overheid.nl/BWBR0036702#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel44c
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0036702
        artikel: '44'
        hoofdstuk: V
        paragraaf: '4'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: 44c
  - number: 45.1.b
    text: |-
      bij het verrichten van die werkzaamheden, ingevolge bij ministeriële regeling daaromtrent te geven voorschriften,
      voldoende financiële middelen beschikbaar zullen zijn om andere werkzaamheden van de toegelaten instelling die niet
      behoren tot de diensten van algemeen economisch belang te kunnen verrichten of
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel45
  - number: 45.1.c
    text: |-
      bij het verrichten van de werkzaamheden, bedoeld in
      [artikel 44c, eerste lid, aanhef en onderdeel f, van de wet][ref1], de financiële continuïteit van de toegelaten
      instelling voldoende is gewaarborgd.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel44c
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 44c
  - number: '45.2'
    text: |-
      Onze Minister kan zijn goedkeuring aan een voornemen als bedoeld in
      [artikel 44c, eerste lid, aanhef, van de wet][ref1] onthouden, indien de toegelaten instelling niet voldoet aan
      [artikel 44][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel44c
      [ref2]: https://wetten.overheid.nl/BWBR0036702#Artikel44
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 44c
      - id: ref2
        bwb_id: BWBR0036702
        artikel: '44'
        hoofdstuk: V
        paragraaf: '4'
        afdeling: '1'
  - number: '46'
    text: |-
      Een verbonden onderneming voldoet in een kalenderjaar aan [artikel 45, eerste lid, tweede volzin, van de wet][ref1],
      indien zij over dat jaar een percentage van haar omzet genereert uit werkzaamheden op het gebied van de
      volkshuisvesting, dat ten minste gelijk is aan het percentage van haar aandelen dat een toegelaten instelling in
      haar houdt.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel45
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '45'
  - number: '47'
    text: |-
      Tot diensten als bedoeld in [artikel 45, tweede lid, onderdeel c, van de wet][ref1] behoren niet:


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel45
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '45'
  - number: 47.a
    text: |-
      het bijdragen aan de leefbaarheid, bedoeld in [artikel 45, tweede lid, onderdeel f, van de wet][ref1], en
      [artikel 51, eerste lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0036702#Artikel51
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '45'
      - id: ref2
        bwb_id: BWBR0036702
        artikel: '51'
        hoofdstuk: V
        afdeling: '2'
  - number: 47.b
    text: |-
      diensten die door nutsbedrijven kunnen worden geleverd, voor zover die levering niet geschiedt met gebruikmaking
      van een in of nabij de woongelegenheid aanwezige voorziening;
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel47
  - number: 47.c
    text: zorgdiensten, maaltijddiensten en medische diensten;
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel47
  - number: 47.d
    text: het exploiteren van een radio- of televisiezender;
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel47
  - number: 47.e
    text: |-
      het verzorgen van opleidingen, behoudens die aan personen in dienst van de toegelaten instelling of die met
      betrekking tot het terrein van de volkshuisvesting;
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel47
  - number: 47.f
    text: |-
      het schoonmaken van woongelegenheden, behoudens in geval van het daarin huisvesten van nieuwe bewoners of van het
      voorkomen van overlast voor of aantasting van het woongenot van bewoners van naburige woongelegenheden;
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel47
  - number: 47.g
    text: |-
      woninginrichting, behoudens die in het kader van de verhuur van gestoffeerde of gemeubileerde woongelegenheden door
      de toegelaten instelling;
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel47
  - number: 47.h
    text: |-
      hypotheekadvisering en makelaarsdiensten in verband met andere woongelegenheden dan die in eigendom van of tot
      stand gebracht door de toegelaten instelling;
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel47
  - number: 47.i
    text: |-
      het ter beschikking stellen van financiële middelen, anders dan overeenkomstig [artikel 48][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0036702#Artikel48
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0036702
        artikel: '48'
        hoofdstuk: V
        afdeling: '2'
  - number: 47.j
    text: notariële diensten;
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel47
  - number: 47.k
    text: het aanbieden van verzekeringen;
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel47
  - number: 47.l
    text: |-
      het bemiddelen bij verzekeringen in verband met andere woongelegenheden dan die in eigendom van of tot stand
      gebracht door de toegelaten instelling;
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel47
  - number: 47.m
    text: het aanbieden van voor-, tussen- en naschoolse opvang;
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel47
  - number: 47.n
    text: het aanbieden van hulp bij het voorkomen van schooluitval;
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel47
  - number: 47.o
    text: het aanbieden van ondersteuning bij de opvoeding van kinderen en
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel47
  - number: 47.p
    text: |-
      diensten ten behoeve van bewoners van woongelegenheden die deze als eigenaar bewonen, met uitzondering van leden van
      verenigingen van eigenaars als bedoeld in [artikel 112 lid 1 onder e van Boek 5 van het Burgerlijk Wetboek][ref1],
      en van bewoners van woongelegenheden die bouwkundig een geheel vormen met woongelegenheden van de betrokken
      toegelaten instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0005288#Artikel112
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0005288
        artikel: '112'
  - number: '48.1'
    text: 'De toegelaten instelling kan uitsluitend financiële middelen ter beschikking stellen in de vorm van:'
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel48
  - number: 48.1.a
    text: |-
      tegemoetkomingen in de kosten van activiteiten die door de bewoners van haar woongelegenheden worden georganiseerd
      in het belang van het behoud of de verbetering van die woongelegenheden of de direct daaraan grenzende omgeving;
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel48
  - number: 48.1.b
    text: |-
      reserveringen voor leden van wooncoöperaties met een huishoudinkomen dat niet hoger is dan de inkomensgrens,
      genoemd in [artikel 16, eerste lid, onderdeel b][ref1], in verband met het onderhoud aan hun woongelegenheden, of


      [ref1]: https://wetten.overheid.nl/BWBR0036702#Artikel16
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0036702
        artikel: '16'
        hoofdstuk: III
        paragraaf: '4'
  - number: 48.1.c
    text: |-
      tegemoetkomingen in het blijkens een geldleningsovereenkomst te betalen bedrag aan rente over een hypothecaire
      geldlening, overeenkomstig het tweede lid.
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel48
  - number: '48.2'
    text: 'Tegemoetkomingen als bedoeld in het eerste lid, onderdeel c, worden uitsluitend verstrekt:'
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel48
  - number: 48.2.a
    text: |-
      over ten hoogste 20% van de verwervingskosten overeenkomstig de onder auspiciën van de Stichting Waarborgfonds
      Eigen Woningen ontwikkelde Nationale Hypotheek Garantie, welke kosten worden gefinancierd door een instelling die
      behoort tot een categorie als bedoeld in het bepaalde bij en krachtens [artikel 13, eerste en tweede lid][ref1], of
      aan welke een vergunning als bedoeld in [artikel 2:60 van de Wet op het financieel toezicht][ref2] is verleend;


      [ref1]: https://wetten.overheid.nl/BWBR0036702#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel2
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0036702
        artikel: '13'
        hoofdstuk: III
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '2'
  - number: 48.2.b
    text: |-
      in geval van het verstrekt zijn van de hypothecaire geldlening onder de voorwaarden en normen van de onder
      auspiciën van de Stichting Waarborgfonds Eigen Woningen ontwikkelde Nationale Hypotheek Garantie;
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel48
  - number: 48.2.c
    text: |-
      aan instellingen als bedoeld in onderdeel a ten behoeve van personen die voor de eerste maal als eigenaar een
      woning bewonen, zolang het huishoudinkomen van die personen niet hoger is dan de inkomensgrens, genoemd in
      [artikel 16, eerste lid, onderdeel b][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0036702#Artikel16
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0036702
        artikel: '16'
        hoofdstuk: III
        paragraaf: '4'
  - number: 48.2.d
    text: 'indien niet tevens een tegemoetkoming wordt verstrekt:'
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel48
  - number: 48.2.d.1°
    text: |-
      op grond van de [Wet bevordering eigenwoningbezit][ref1] of


      [ref1]: https://wetten.overheid.nl/BWBR0011919
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0011919
  - number: 48.2.d.2°
    text: |-
      door de toegelaten instelling, voor zover ertoe leidend dat de woning aan een persoon als bedoeld in onderdeel
      c wordt vervreemd tegen een prijs die lager is dan 90% van de getaxeerde leegwaarde of de WOZ-waarde, of met het
      oogmerk een zodanige persoon anderszins zodanig te bevoordelen dat een dienovereenkomstige uitkomst wordt bereikt,
      en
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel48
  - number: 48.2.e
    text: |-
      indien uit overeenkomsten tussen de betrokken persoon en een instelling als bedoeld in onderdeel a, en tussen
      die instelling en de toegelaten instelling, blijkt dat de tegemoetkoming wordt verlaagd of beëindigd, indien
      het huishoudinkomen van die persoon daartoe aanleiding geeft blijkens een periodieke beoordeling van dat inkomen
      overeenkomstig in die overeenkomsten neergelegde bepalingen.
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel48
  - number: '48.3'
    text: |-
      Bij ministeriële regeling kan worden bepaald onder welke modellen voor of bepalingen in overeenkomsten als
      bedoeld in het tweede lid, onderdeel e, een tegemoetkoming als bedoeld in het eerste lid, onderdeel c, kan worden
      verstrekt.
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel48
  - number: '49.1'
    text: |-
      De gebouwen, bedoeld in [artikel 45, tweede lid, onderdeel d, van de wet][ref1], zijn uitsluitend:


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel45
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '45'
  - number: 49.1.a
    text: |-
      de gebouwen en categorieën van gebouwen, genoemd in [bijlage 3][ref1] bij dit besluit en


      [ref1]: https://wetten.overheid.nl/BWBR0036702
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0036702
  - number: 49.1.b
    text: |-
      de gebouwen en categorieën van gebouwen, genoemd in [bijlage 4][ref1] bij dit besluit, welke ten aanzien van een
      toegelaten instelling uitsluitend tot het gebied van de volkshuisvesting behoren, indien zij deze op het tijdstip
      waarop dit besluit in werking is getreden in eigendom had.


      [ref1]: https://wetten.overheid.nl/BWBR0036702
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0036702
  - number: '49.2'
    text: |-
      Onze Minister kan op verzoek van een toegelaten instelling bepalen dat het doen bouwen of verwerven van andere
      gebouwen met een maatschappelijke gebruiksbestemming dan die, bedoeld in het eerste lid, ten aanzien van die
      toegelaten instelling tot het gebied van de volkshuisvesting behoort, indien:
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel49
  - number: 49.2.a
    text: |-
      in geval van basisscholen en centra voor jeugd en gezin: naar zijn oordeel aannemelijk wordt gemaakt dat het tot
      stand brengen, in stand houden en verhuren daarvan ingevolge bij ministeriële regeling te geven voorschriften
      voldoende renderend is, en
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel49
  - number: 49.2.b
    text: |-
      in geval van andere zodanige gebouwen: die gebouwen naar zijn oordeel behoren tot een aan een categorie als genoemd
      in [bijlage 3][ref1] bij dit besluit nauw verwante categorie, en bouwkundig een geheel vormen met een voor bewoning
      bestemd gebouw in eigendom van die toegelaten instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0036702
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0036702
  - number: '49.3'
    text: |-
      Onze Minister kan op verzoek van een toegelaten instelling bepalen dat het verwerven van andere gebouwen met een
      maatschappelijke gebruiksbestemming dan die, bedoeld in het eerste lid, ten aanzien van die toegelaten instelling
      tot het gebied van de volkshuisvesting behoort, indien die toegelaten instelling ten overstaan van hem aannemelijk
      maakt dat zij binnen vijf jaar na het tijdstip van indiening van dat verzoek die gebouwen:
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel49
  - number: 49.3.a
    text: |-
      zal slopen en ter plaatse gebouwen zal doen bouwen als bedoeld in het eerste lid of onder toepassing van
      [artikel 52, eerste lid][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0036702#Artikel52
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0036702
        artikel: '52'
        hoofdstuk: V
        afdeling: '2'
  - number: 49.3.b
    text: |-
      zal verbouwen tot onroerende zaken die verband houden met werkzaamheden op het gebied van de volkshuisvesting die
      niet behoren tot de diensten van algemeen economisch belang.
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel49
  - number: '49.4'
    text: |-
      De werkzaamheden, bedoeld in [artikel 45, tweede lid, onderdeel d, van de wet][ref1], en de werkzaamheden ten
      aanzien van welke Onze Minister toepassing heeft gegeven aan het tweede lid, behoren alle tot de diensten van
      algemeen economisch belang.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel45
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '45'
  - number: '50'
    text: |-
      De toegelaten instelling kan met betrekking tot ten hoogste 10% van het bruto-vloeroppervlak van haar gebouwen,
      bedoeld in [artikel 49, eerste lid][ref1], overeenkomsten van huur en verhuur aangaan met anderen dan die, bedoeld
      in [artikel 48, zesde lid, van de wet][ref2]. Tot het bruto-vloeroppervlak, bedoeld in de eerste volzin, behoort
      mede het vloeroppervlak van de bij die gebouwen behorende overdekte parkeervoorzieningen en de oppervlakte van de
      bij die gebouwen behorende overige parkeervoorzieningen.


      [ref1]: https://wetten.overheid.nl/BWBR0036702#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel48
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0036702
        artikel: '49'
        hoofdstuk: V
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '48'
  - number: '51.1'
    text: 'Het bijdragen aan de leefbaarheid houdt uitsluitend in:'
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel51
  - number: 51.1.a
    text: |-
      woonmaatschappelijk werk, met inbegrip van het leveren van een bijdrage aan uitvoering van achter-de-voordeur-
      programma’s onder verantwoordelijkheid van maatschappelijke organisaties en uitsluitend ten behoeve van de huurders
      van de woongelegenheden van de toegelaten instelling;
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel51
  - number: 51.1.b
    text: |-
      aanleg en onderhoud van kleinschalige infrastructuur in de directe nabijheid van woongelegenheden of andere
      onroerende zaken van de toegelaten instelling en
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel51
  - number: 51.1.c
    text: |-
      bijdragen aan de uitvoering van plannen ter bevordering van een schone woonomgeving, ter voorkoming van overlast en
      ter bevordering van de veiligheid.
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel51
  - number: '51.2'
    text: |-
      Het bedrag, bedoeld in [artikel 45, tweede lid, onderdeel f, onder 2°, van de wet][ref1], is € 125. Het in de
      eerste volzin genoemde bedrag wordt met ingang van elk kalenderjaar bij ministeriële regeling gewijzigd met het
      in januari van het daaraan voorafgaande kalenderjaar in de Staatscourant bekendgemaakte percentage waarmee de
      consumentenprijzen (alle huishoudens) ten opzichte van het aan die bekendmaking voorafgaande jaar zijn gewijzigd.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel45
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '45'
  - number: '51.3'
    text: |-
      De werkzaamheden, bedoeld in [artikel 45, tweede lid, onderdeel f, van de wet][ref1], behoren alle tot de diensten
      van algemeen economisch belang.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel45
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '45'
  - number: '52.1'
    text: |-
      Het doen bouwen en verwerven van gebouwen als bedoeld in [artikel 45, tweede lid, onderdeel g, van de wet][ref1],
      en de werkzaamheden, bedoeld in artikel 45, tweede lid, onderdeel h, van de wet, behoren uitsluitend tot het gebied
      van de volkshuisvesting:


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel45
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '45'
  - number: 52.1.a
    text: indien die gebouwen kantoorruimten van de toegelaten instelling zijn of
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel52
  - number: 52.1.b
    text: |-
      in andere gevallen: indien per investering het bruto-vloeroppervlak van die gebouwen niet meer bedraagt dan 25%
      van het bruto-vloeroppervlak van alle van die investering deel uitmakende onroerende zaken, tot welk oppervlak
      mede behoort het vloeroppervlak van de bij die gebouwen of zaken behorende overdekte parkeervoorzieningen en de
      oppervlakte van de bij die gebouwen of zaken behorende overige parkeervoorzieningen, en per investering de kosten
      van de in de aanhef bedoelde werkzaamheden niet hoger zijn dan € 10.000.000.
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel52
  - number: '52.2'
    text: |-
      Onze Minister kan op verzoek van een toegelaten instelling bepalen dat het verwerven van andere gebouwen met een
      bedrijfsmatige gebruiksbestemming dan die, bedoeld in het eerste lid, ten aanzien van die toegelaten instelling
      tot het gebied van de volkshuisvesting behoort, indien die toegelaten instelling ten overstaan van hem aannemelijk
      maakt dat zij binnen vijf jaar na het tijdstip van indiening van dat verzoek die gebouwen:
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel52
  - number: 52.2.a
    text: |-
      zal slopen en ter plaatse gebouwen zal doen bouwen onder toepassing van het eerste lid of als bedoeld in
      [artikel 49, eerste lid][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0036702#Artikel49
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0036702
        artikel: '49'
        hoofdstuk: V
        afdeling: '2'
  - number: 52.2.b
    text: |-
      zal verbouwen tot onroerende zaken die verband houden met werkzaamheden op het gebied van de volkshuisvesting die
      behoren tot de diensten van algemeen economisch belang.
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel52
  - number: '53'
    text: |-
      Tot de werkzaamheden, bedoeld in de [artikelen 45, tweede lid, onderdeel i][ref1], en
      [47, eerste lid, onderdeel g, van de wet][ref2], behoren niet transacties die zijn gericht op het wijzigen van
      eigendomsverhoudingen en zakelijke rechten zonder dat er sprake is van feitelijke overdracht van bezit, behalve
      indien die transacties noodzakelijk zijn om werkzaamheden als bedoeld in de andere onderdelen van die artikelleden
      te kunnen verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel47
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '45'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '47'
  - number: '54.1'
    text: |-
      Het percentage, bedoeld in [artikel 46, tweede lid, eerste volzin, van de wet][ref1], is 95.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel46
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '46'
  - number: '54.2'
    text: |-
      Tot de huishoudens, bedoeld in [artikel 46, tweede lid, eerste volzin, van de wet][ref1], worden mede gerekend:


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel46
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '46'
  - number: 54.2.a
    text: 'personen die als een- of tweepersoonshuishouden een woongelegenheid wensen te betrekken en:'
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel54
  - number: 54.2.a.1°
    text: |-
      ingeschreven staan bij een universiteit of hogeschool als bedoeld in
      [artikel 1.2, onderdelen a en b, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1] of bij een
      instelling als bedoeld in [artikel 1.1.1, onderdeel b, van de Wet educatie en beroepsopleidingen][ref2], en daar
      voltijds studeren of


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '1'
  - number: 54.2.a.2°
    text: |-
      zich voltijds voorbereiden op een promotie als bedoeld in [artikel 7.18 van eerstgenoemde wet][ref1] en


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
  - number: 54.2.b
    text: |-
      vreemdelingen die in Nederland een verblijfsvergunning asiel voor bepaalde tijd hebben
      aangevraagd en als gevolg daarvan een verblijfsvergunning hebben ontvangen als bedoeld in
      [artikel 8, onderdeel a, b, c of d, van de Vreemdelingenwet 2000][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: '54.3'
    text: |-
      Indien de toegelaten instelling woongelegenheden waarop het bepaalde bij en krachtens
      [artikel 46, tweede lid, van de wet][ref1] van toepassing is verhuurt aan of heeft ondergebracht in een
      rechtspersoon of vennootschap welke overeenkomsten van huur en verhuur ten aanzien van zodanige woongelegenheden
      aangaat met natuurlijke personen, of een rechtspersoon of vennootschap welke zodanige woongelegenheden verhuurt
      aan een rechtspersoon of vennootschap welke zodanige overeenkomsten aangaat, draagt zij er zorg voor dat die
      rechtspersoon of vennootschap met betrekking tot die woongelegenheden dat bepaalde naleeft, en is artikel 56 van
      toepassing op de aan die rechtspersoon of vennootschap te verstrekken gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel46
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '46'
  - number: '54.4'
    text: |-
      De toegelaten instelling voert overleg met de rechtspersoon of vennootschap, eerstbedoeld in het derde
      lid, met het oogmerk te bewerkstelligen dat die rechtspersoon of vennootschap alle handelingen verricht
      en aan de toegelaten instelling alle inlichtingen verstrekt die voor haar noodzakelijk zijn om aan
      [artikel 48, vierde lid, van de wet][ref1] en het eerste tot en met derde, zevende en achtste lid van dit artikel
      te voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel48
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '48'
  - number: '54.5'
    text: |-
      Het is de toegelaten instelling verboden een overeenkomst met een rechtspersoon of vennootschap
      ter zake van de huur en verhuur van woongelegenheden waarop het bepaalde bij en krachtens
      [artikel 46, tweede lid, van de wet][ref1] van toepassing is aan te gaan, die in de weg staat aan de juiste
      toepassing van [artikel 48, vierde lid, van de wet][ref2] of het eerste tot en met vierde, zevende of achtste
      lid van dit artikel. Indien een voor het tijdstip waarop dit besluit in werking is getreden aangegane zodanige
      overeenkomst ertoe leidt dat die toegelaten instelling niet over alle gegevens beschikt die noodzakelijk zijn
      voor een beoordeling als bedoeld in het zesde lid, wordt dat die toegelaten instelling bij die beoordeling niet
      aangerekend.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel48
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '46'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '48'
  - number: '54.6'
    text: |-
      Onze Minister beoordeelt jaarlijks voor 1 december of de toegelaten instelling in het aan die datum voorafgaande
      jaar dit artikel en [artikel 56][ref1] heeft nageleefd of doen naleven, en verstrekt dat oordeel aan de toegelaten
      instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0036702#Artikel56
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0036702
        artikel: '56'
        hoofdstuk: V
        afdeling: '3'
  - number: '55.1'
    text: |-
      De administratie van de toegelaten instelling of een rechtspersoon of vennootschap als bedoeld in
      [artikel 54, derde lid][ref1], is zodanig, dat een juiste, volledige en tijdige vastlegging daarin is gewaarborgd
      van de gegevens met betrekking tot het huishoudinkomen. Die gegevens worden voor de toepassing van het bepaalde bij
      en krachtens [artikel 46, tweede lid, van de wet][ref2] voor een kalenderjaar niet langer daarin bewaard dan tot
      het tijdstip dat de compensatie over dat kalenderjaar voor werkzaamheden van de toegelaten instelling die behoren
      tot de diensten van algemeen economisch belang onherroepelijk is komen vast te staan.


      [ref1]: https://wetten.overheid.nl/BWBR0036702#Artikel54
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel46
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0036702
        artikel: '54'
        hoofdstuk: V
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '46'
  - number: '55.2'
    text: |-
      De toegelaten instelling is verplicht tot geheimhouding van de gegevens met betrekking tot het huishoudinkomen,
      behoudens voor zover enig wettelijk voorschrift haar tot mededeling verplicht of uit haar taak de noodzaak tot
      mededeling voortvloeit.
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel55
  - number: '56.1'
    text: |-
      De toegelaten instelling of een rechtspersoon of vennootschap als bedoeld in [artikel 54, derde lid][ref1],
      geeft slechts toepassing aan het bepaalde bij en krachtens [artikel 46, tweede lid, van de wet][ref2], nadat
      degene die als huurder een woongelegenheid waarop dat bepaalde van toepassing is wenst te betrekken, ten behoeve
      van de vaststelling of hij in de zin van dat bepaalde in aanmerking komt voor een huurtoeslag in de zin van de
      [Wet op de huurtoeslag][ref3], aan haar heeft overgelegd:


      [ref1]: https://wetten.overheid.nl/BWBR0036702#Artikel54
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel46
      [ref3]: https://wetten.overheid.nl/BWBR0008659
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0036702
        artikel: '54'
        hoofdstuk: V
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '46'
      - id: ref3
        bwb_id: BWBR0008659
  - number: 56.1.a
    text: |-
      een door hem opgestelde en ondertekende verklaring over de samenstelling van zijn huishouden, met uitzondering van
      kinderen in de zin van , en
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel56
  - number: 56.1.b
    text: |-
      gegevens waaruit het huishoudinkomen blijkt, of op grond waarvan dat inkomen zo nauwkeurig als redelijkerwijs
      mogelijk kan worden geschat.
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel56
  - number: '56.2'
    text: |-
      De toegelaten instelling voegt in haar administratie, onverwijld na de toepassing, bedoeld in het eerste lid, bij
      de in verband daarmee afgegeven verklaring, bedoeld in het eerste lid, onderdeel a, een door haar ondertekende
      verklaring dat zij geen redenen heeft om aan de juistheid van de eerstbedoelde verklaring te twijfelen.
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel56
  - number: '56.3'
    text: 'Het eerste lid, aanhef en onderdeel b, is niet van toepassing:'
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel56
  - number: 56.3.a
    text: |-
      indien degenen die de woongelegenheid wensen te betrekken uitsluitend vreemdelingen zijn die in Nederland rechtmatig
      verblijf hebben als bedoeld in [artikel 8, onderdelen a tot en met d, van de Vreemdelingenwet 2000][ref1] en
      behoren tot de groep verblijfsgerechtigden die in aanmerking wordt genomen bij het bepalen van de taakstelling
      overeenkomstig [artikel 29, eerste lid, van de Huisvestingswet 2014][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0035303#Artikel29
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0035303
        artikel: '29'
  - number: 56.3.b
    text: |-
      indien degenen die de woongelegenheid wensen te betrekken uitsluitend, en ten hoogste twee, personen zijn die
      studiefinanciering op grond van de [Wet studiefinanciering 2000][ref1] ontvangen, en degene die als huurder de
      woongelegenheid wenst te betrekken bewijzen daarvan aan de toegelaten instelling of aan een rechtspersoon of
      vennootschap als bedoeld in [artikel 54, derde lid][ref2], heeft overgelegd, en


      [ref1]: https://wetten.overheid.nl/BWBR0011453
      [ref2]: https://wetten.overheid.nl/BWBR0036702#Artikel54
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0011453
      - id: ref2
        bwb_id: BWBR0036702
        artikel: '54'
        hoofdstuk: V
        afdeling: '3'
  - number: 56.3.c
    text: |-
      indien degenen die de woongelegenheid wensen te betrekken van buiten Nederland afkomstige personen
      zijn, die zich hebben ingeschreven bij een instelling voor hoger onderwijs in de zin van de
      [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1], en bewijzen daarvan of verklaringen ter zake aan
      de toegelaten instelling of aan een rechtspersoon of vennootschap als bedoeld in [artikel 54, derde lid][ref2],
      zijn overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005682
      [ref2]: https://wetten.overheid.nl/BWBR0036702#Artikel54
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0005682
      - id: ref2
        bwb_id: BWBR0036702
        artikel: '54'
        hoofdstuk: V
        afdeling: '3'
  - number: '56.4'
    text: 'De gegevens, bedoeld in het eerste lid, onderdeel b, zijn, behoudens het vijfde en zesde lid:'
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel56
  - number: 56.4.a
    text: |-
      in geval van vreemdelingen als bedoeld in het derde lid, onderdeel a: een inkomstenverklaring, welke niet langer
      dan zes maanden voordat de overeenkomst van huur en verhuur zou moeten ingaan is afgegeven door het Centraal Orgaan
      opvang asielzoekers, bedoeld in [artikel 2 van de Wet Centraal Orgaan opvang asielzoekers][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0006685#Artikel2
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0006685
        artikel: '2'
  - number: 56.4.b
    text: |-
      in geval van andere personen dan zodanige vreemdelingen: de aanslag of voorlopige aanslag inkomstenbelasting of
      de inkomensgegevens, bedoeld in [artikel 21, onderdeel e, van de Algemene wet inzake rijksbelastingen][ref1], van
      ieder van die personen, over een van de twee kalenderjaren die direct voorafgaan aan het kalenderjaar waarin de
      overeenkomst van huur van verhuur zou moeten ingaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel21
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '21'
  - number: '56.5'
    text: |-
      Voor zover gegevens als bedoeld in het vierde lid, onderdeel b, niet beschikbaar zijn blijkens een schriftelijke
      verklaring van een functionaris van de rijksbelastingdienst die bij regeling van de Minister van Financiën als
      inspecteur is aangewezen, zijn de gegevens, bedoeld in het eerste lid, onderdeel b, voorts:
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel56
  - number: 56.5.a
    text: die verklaring en
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel56
  - number: 56.5.b
    text: |-
      indien een van degenen die de betrokken woongelegenheid wensen te betrekken dusdanig kort een inkomen in Nederland
      geniet of dusdanig recent een inkomen in Nederland genoten heeft, dat dat inkomen nog niet bekend is bij de
      rijksbelastingdienst:
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel56
  - number: 56.5.b.1°
    text: |-
      een door degene die als huurder die woongelegenheid wenst te betrekken opgestelde en ondertekende
      inkomensverklaring waarin ten minste het door hem geschatte huishoudinkomen is opgenomen en, indien die verklaring
      melding maakt van het benutten van fiscale aftrekposten of van winst uit onderneming, stukken die aantonen dat die
      verklaring met betrekking tot die aspecten juist en volledig is, en
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel56
  - number: 56.5.b.2°
    text: |-
      hetzij een jaaropgave van de werkgever of werkgevers van degenen, bedoeld in de aanhef, over het kalenderjaar
      dat direct voorafgaat aan het kalenderjaar waarin de overeenkomst ter zake van een verhuur als bedoeld in
      [artikel 46, tweede lid, eerste volzin, van de wet][ref1] zou moeten ingaan, dan wel een jaaropgave over
      eerstbedoeld kalenderjaar van de instantie of instanties die aan diegenen een uitkering verstrekken, hetzij
      loonstroken of uitkeringsspecificaties van die werkgever of werkgevers respectievelijk die instantie of instanties
      met betrekking tot één kalendermaand, welke maand geen eerdere is dan de zesde kalendermaand voorafgaand aan de
      dagtekening van de verklaring, bedoeld onder 1°.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel46
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '46'
  - number: '56.6'
    text: |-
      Indien uit de gegevens, bedoeld in het vierde lid, een huishoudinkomen blijkt dat hoger is dan het voor het
      huishouden toepasselijke rekeninkomen, bedoeld in [artikel 14, derde lid, van de Wet op de huurtoeslag][ref1],
      terwijl naar het oordeel van degene die als huurder de betrokken woongelegenheid wenst te betrekken het
      huishoudinkomen niet hoger is dan die grens, kan hij dat oordeel met een onderbouwing daarvan aan de toegelaten
      instelling of aan een rechtspersoon of vennootschap als bedoeld in [artikel 54, derde lid][ref2], overleggen, in
      welk geval de gegevens, bedoeld in het eerste lid, onderdeel b, voorts zijn de gegevens overeenkomstig het vijfde
      lid, onderdeel b, onder 1° en 2°.


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0036702#Artikel54
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0036702
        artikel: '54'
        hoofdstuk: V
        afdeling: '3'
  - number: '56.7'
    text: |-
      In afwijking van het eerste lid kan een rechtspersoon of vennootschap als eerstbedoeld
      in [artikel 54, derde lid][ref1], overeenkomsten ter zake van verhuur als bedoeld in
      [artikel 46, tweede lid, eerste volzin, van de wet][ref2] aangaan zonder dat daaraan voorafgaand een verklaring
      en gegevens als bedoeld in het eerste lid, onderdelen a en b, zijn overgelegd, indien degene die als huurder een
      woongelegenheid waarop het bepaalde bij en krachtens [artikel46, tweede lid, eerste volzin, van de wet][ref3] van
      toepassing is, wenst te betrekken een onderdaan is van een lidstaat en voor het verrichten van arbeid in Nederland
      verblijft. Aan de eerste volzin kan slechts toepassing worden gegeven door een rechtspersoon of vennootschap
      die beschikt over een keurmerk van de Stichting keurmerk internationale arbeidsbemiddeling of van de Stichting
      normering flexwonen en bij het aangaan van de betrokken overeenkomst van huur en verhuur een bewijs van de
      toekenning van dat keurmerk aan de toegelaten instelling overlegt.


      [ref1]: https://wetten.overheid.nl/BWBR0036702#Artikel54
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel46
      [ref3]: https://wetten.overheid.nl/BWBR0005181#Artikel46
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0036702
        artikel: '54'
        hoofdstuk: V
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '46'
      - id: ref3
        bwb_id: BWBR0005181
        artikel: '46'
  - number: '56.8'
    text: |-
      De rechtspersoon of vennootschap, eerstbedoeld in [artikel 54, derde lid][ref1], legt op de laatste dag van elk
      kalenderkwartaal ten aanzien van de huurders, bedoeld in het zevende lid, met wie in dat kwartaal een overeenkomst
      van huur en verhuur is aangegaan aan de toegelaten instelling over:


      [ref1]: https://wetten.overheid.nl/BWBR0036702#Artikel54
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0036702
        artikel: '54'
        hoofdstuk: V
        afdeling: '3'
  - number: 56.8.a
    text: het adres van de woongelegenheid die de huurder, bedoeld in het zevende lid, heeft betrokken;
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel56
