  - number: 122.f
    text: |-
      zijn andere activiteiten, besluiten en voornemens daartoe, in de gevallen waarin hij van oordeel is dat
      kennisneming daarvan door de betrokken raden van toezicht of besturen van dochtermaatschappijen uit het oogpunt van
      een goede uitvoering van hun toezicht noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel122
  - number: '123.1'
    text: |-
      Onze Minister verleent de autoriteit mandaat van zijn bevoegdheden, bedoeld in [hoofdstuk III, paragrafen 1][ref1],
      [3][ref2] en [4][ref3], [hoofdstuk IV][ref4] en [hoofdstuk V][ref5], met uitzondering van de
      [artikelen 35][ref6], [36][ref7], [37][ref8] en [40][ref9].


