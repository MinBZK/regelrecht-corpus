        artikel: '24'
        hoofdstuk: IV
        paragraaf: '3'
  - number: 25.2.d.1°
    text: de zienswijze van de gemeente waar dat gebouw is gelegen en, indien dat gebouw verhuurd is, van de huurder;
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel25
  - number: 25.2.d.2°
    text: de getaxeerde marktwaarde of de WOZ-waarde van dat gebouw, en
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel25
  - number: 25.2.d.3°
    text: |-
      tenzij de beoogde verkrijger een dochtermaatschappij van de vervreemdende toegelaten instelling is: bescheiden
      waaruit blijkt dat dat gebouw gedurende ten minste vier weken te koop is aangeboden aan toegelaten instellingen en,
      in het openbaar, aan elke andere gegadigde in Nederland, en, indien het verhuurd is, dat het gedurende ten minste
      vier weken te koop is aangeboden aan de huurder, met dien verstande dat uit die bescheiden niet behoeft te blijken
      van een zodanige aanbieding aan elke andere gegadigde in Nederland, indien de toegelaten instelling 5% of meer van
      de aandelen van de beoogde verkrijger houdt, of
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel25
  - number: 25.2.e
    text: |-
      in geval van vervreemding van een andere onroerende zaak dan die, genoemd in onderdeel a of de aanhef van onderdeel
      b, c of d, van vestiging van een recht van erfpacht, opstal of vruchtgebruik op een onroerende zaak of van
      overdracht van de economische eigendom van een onroerende zaak: de zienswijze van de gemeente waar die onroerende
      zaak is gelegen en de bij ministeriële regeling bepaalde andere zienswijzen.
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel25
  - number: '25.3'
    text: |-
      Het verzoek, bedoeld in het eerste lid, wordt ingediend met gebruikmaking van een door Onze Minister beschikbaar te
      stellen formulier. Onze Minister bevestigt binnen twee weken de ontvangst van een zodanig verzoek.
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel25
  - number: '25.4'
    text: |-
      Bij ministeriële regeling kunnen nadere voorschriften worden gegeven omtrent de bij een verzoek om een goedkeuring
      als bedoeld in [artikel 27, eerste lid, aanhef en onderdeel a, van de wet][ref1] over te leggen gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel27
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '27'
  - number: '26.1'
    text: |-
      Onze Minister keurt een besluit als bedoeld in [artikel 27, eerste lid, aanhef en onderdeel a, van de wet][ref1]
      uitsluitend goed, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel27
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '27'
  - number: 26.1.a
    text: |-
      in geval van een vervreemding als bedoeld in de aanhef van [artikel 25, tweede lid, onderdeel b][ref1], van een
      woongelegenheid:


      [ref1]: https://wetten.overheid.nl/BWBR0036702#Artikel25
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0036702
        artikel: '25'
        hoofdstuk: IV
        paragraaf: '3'
  - number: 26.1.a.1°
    text: |-
      indien de betrokken woongelegenheid niet verhuurd is: zij wordt vervreemd tegen een prijs van ten minste de
      getaxeerde marktwaarde of de WOZ-waarde en
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel26
  - number: 26.1.a.2°
    text: |-
      indien de betrokken woongelegenheid verhuurd is: zij wordt vervreemd tegen een prijs van ten minste
      75% van de getaxeerde leegwaarde of WOZ-waarde, of een prijs die in bij ministeriële regeling bepaalde
      gevallen lager is dan 75% van die waarde en ten minste gelijk is aan de leegwaarderatio, bedoeld in
      [artikel 17a, tweede lid, van het Uitvoeringsbesluit inkomstenbelasting 2001][ref1], en onder het beding dat zij
      gedurende ten minste zeven jaar na de eigendomsoverdracht als gevolg van die vervreemding voor verhuur bestemd
      blijft, en, bij een opvolgende vervreemding binnen 30 jaar na die eigendomsoverdracht die ertoe leidt dat de
      verkrijger de woongelegenheid als eigenaar zal bewonen, de vervreemder het verschil tussen de prijs die hij voor de
      woongelegenheid heeft ontvangen en de prijs die de toegelaten instelling voor die woongelegenheid heeft ontvangen
      in de gevallen dat de eerstgenoemde prijs hoger is dan de laatstgenoemde voor de helft deelt met de toegelaten
      instelling;


      [ref1]: https://wetten.overheid.nl/BWBR0012066#Artikel17a
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0012066
        artikel: 17a
  - number: 26.1.b
    text: 'in geval van vervreemding van een gemengd gereguleerd complex:'
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel26
  - number: 26.1.b.1°
    text: |-
      voor zover de betrokken woongelegenheden niet verhuurd zijn: zij worden vervreemd tegen een prijs van ten minste de
      getaxeerde marktwaarde of de WOZ-waarde en
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel26
  - number: 26.1.b.2°
    text: 'voor zover de betrokken woongelegenheden verhuurd zijn: zij worden vervreemd overeenkomstig onderdeel a, onder 2°;'
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel26
  - number: 26.1.c
    text: |-
      in geval van een vervreemding als bedoeld in de aanhef van [artikel 25, tweede lid, onderdeel c][ref1], van een
      woongelegenheid of een vervreemding als bedoeld in de aanhef van artikel 25, tweede lid, onderdeel d: de betrokken
      woongelegenheid of het betrokken gebouw wordt vervreemd tegen een prijs van ten minste de getaxeerde marktwaarde of
      de WOZ-waarde of


      [ref1]: https://wetten.overheid.nl/BWBR0036702#Artikel25
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0036702
        artikel: '25'
        hoofdstuk: IV
        paragraaf: '3'
  - number: 26.1.d
    text: |-
      in geval van vervreemding van een gemengd geliberaliseerd complex: alle woongelegenheden in dat complex worden
      vervreemd tegen een prijs van ten minste de getaxeerde marktwaarde of de WOZ-waarde.
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel26
  - number: '26.2'
    text: |-
      Onze Minister keurt een besluit als bedoeld in
      [artikel 27, eerste lid, aanhef en onderdeel a, van de wet][ref1] niet goed, indien de verklaring, bedoeld in
      [artikel 25, eerste lid, onderdeel c, of tweede lid, onderdeel b, onder 2°][ref2], niet is overgelegd, en, in
      geval van een vervreemding, indien en zolang [artikel 4][ref3] van toepassing is. Hij kan voorts besluiten een
      besluit als bedoeld in artikel 27, eerste lid, aanhef en onderdeel a, van de wet niet goed te keuren, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0036702#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0036702#Artikel4
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '27'
      - id: ref2
        bwb_id: BWBR0036702
        artikel: '25'
        hoofdstuk: IV
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0036702
        artikel: '4'
        hoofdstuk: II
  - number: 26.2.a
    text: |-
      het belang van de volkshuisvesting naar zijn oordeel beter is gediend met het niet nemen van een zodanig besluit
      ten aanzien van de betrokken onroerende zaak of het nemen van een zodanig besluit ten aanzien van die zaak, waarbij
      de verkrijger of de begunstigde een ander is dan de blijkens het ter goedkeuring voorgelegde besluit beoogde
      verkrijger of begunstigde;
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel26
  - number: 26.2.b
    text: |-
      dat besluit er naar zijn oordeel toe zou leiden dat de financiële continuïteit van de toegelaten instelling niet
      voldoende is gewaarborgd of
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel26
  - number: 26.2.c
    text: |-
      de betrokken ingevolge het bepaalde bij en krachtens [artikel 25, tweede lid][ref1], over te leggen bescheiden niet
      zijn overgelegd of onjuist zijn, of indien een overgelegde andere verklaring dan die, bedoeld in de eerste volzin,
      of een overgelegde zienswijze daartoe naar zijn oordeel aanleiding geeft.


      [ref1]: https://wetten.overheid.nl/BWBR0036702#Artikel25
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0036702
        artikel: '25'
        hoofdstuk: IV
        paragraaf: '3'
  - number: '26.3'
    text: |-
      Onze Minister kan het bepaalde bij of krachtens het eerste en tweede lid buiten toepassing laten, of bepalen
      dat het door de toegelaten instelling overleggen van bescheiden waaruit blijkt dat een aanbieding aan de
      huurder, als bedoeld in [artikel 25, tweede lid, onderdeel b, onder 4°, of onderdeel d, onder 3°][ref1], heeft
      plaatsgevonden niet vereist is, indien ten aanzien van de betrokken toegelaten instelling een situatie als bedoeld
      in [artikel 29, eerste lid, van de wet][ref2] of [57, eerste lid, onderdeel a, van de wet][ref3] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0036702#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel29
      [ref3]: https://wetten.overheid.nl/BWBR0005181#Artikel57
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0036702
        artikel: '25'
        hoofdstuk: IV
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '29'
      - id: ref3
        bwb_id: BWBR0005181
        artikel: '57'
  - number: '26.4'
    text: |-
      Bij ministeriële regeling kunnen nadere voorschriften worden gegeven omtrent de toepassing van het tweede en derde
      lid.
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel26
  - number: '27.1'
    text: |-
      Onze Minister beslist binnen twaalf weken na ontvangst daarvan op een verzoek om goedkeuring als bedoeld
      in [artikel 27, eerste lid, aanhef en onderdeel a, van de wet][ref1], welke termijn hij, door schriftelijke
      kennisgeving daarvan aan de toegelaten instelling binnen die termijn, eenmalig kan verlengen met een door hem
      daarbij te bepalen termijn van ten hoogste twee weken.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel27
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '27'
  - number: '27.2'
    text: |-
      Onze Minister kan, indien hij toepassing geeft aan [artikel 27, derde lid, van de wet][ref1], de in het eerste lid
      genoemde termijn of ingevolge dat lid verlengde termijn schorsen totdat het advies, bedoeld in artikel 27, derde
      lid, van de wet, is uitgebracht. Hij geeft binnen die termijn schriftelijk kennis van een zodanige schorsing aan de
      betrokken toegelaten instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel27
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '27'
  - number: '28.1'
    text: |-
      Onze Minister keurt een vervreemding als bedoeld in [artikel 27, eerste lid, onderdeel b, van de wet][ref1] aan
      anderen dan toegelaten instellingen niet goed, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel27
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '27'
  - number: 28.1.a
    text: |-
      die vervreemding naar zijn oordeel ertoe leidt dat de financiële continuïteit van de toegelaten instelling niet
      langer is gewaarborgd;
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel28
  - number: 28.1.b
    text: die vervreemding geschiedt tegen een prijs die naar zijn oordeel onvoldoende overeenkomt met de intrinsieke waarde;
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel28
  - number: 28.1.c
    text: |-
      de toegelaten instelling een lening of een garantie aan de dochtermaatschappij heeft verstrekt of voor haar
      schulden aansprakelijk is, en die vervreemding ertoe zou leiden dat zij de helft of minder van de stemrechten in de
      algemene vergadering van de dochtermaatschappij overhoudt of
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel28
  - number: 28.1.d
    text: |-
      degene aan wie wordt vervreemd hem geen verklaring omtrent het gedrag als bedoeld in
      [artikel 28 van de Wet justitiële en strafvorderlijke gegevens][ref1] kan overleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel28
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: '28'
  - number: '28.2'
    text: |-
      Bij ministeriële regeling kunnen nadere voorschriften worden gegeven omtrent de toepassing van het eerste lid,
      onderdelen a en b.
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel28
  - number: '29.1'
    text: |-
      De raad van toezicht stelt Onze Minister schriftelijk op de hoogte van zijn werkzaamheden ter uitoefening van zijn
      taak:
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel29
  - number: 29.1.a
    text: |-
      indien naar zijn oordeel of dat van Onze Minister sprake is van door de betrokken toegelaten instelling berokkende
      schade of mogelijke schade aan het belang van de volkshuisvesting die zij niet binnen een afzienbare termijn kan
      herstellen respectievelijk voorkomen;
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel29
  - number: 29.1.b
    text: |-
      indien sprake is van een onoverbrugbaar geschil tussen het bestuur en de raad van toezicht van de toegelaten
      instelling of tussen de toegelaten instelling en een dochtermaatschappij;
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel29
  - number: 29.1.c
    text: |-
      indien naar zijn oordeel twijfel bestaat aan de rechtmatigheid van het handelen of nalaten, de governance of de
      integriteit van beleid en beheer van de toegelaten instelling, en het bestuur die twijfel niet heeft weggenomen of
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel29
  - number: 29.1.d
    text: |-
      indien sprake is van liquiditeits- of solvabiliteitsproblemen in de toegelaten instelling of een
      dochtermaatschappij van die toegelaten instelling.
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel29
  - number: '29.2'
    text: Bij ministeriële regeling kunnen nadere voorschriften worden gegeven omtrent de toepassing van dit artikel.
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel29
