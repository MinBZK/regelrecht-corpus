  - number: 122.e
    text: |-
      zijn oordeel over de stukken, bedoeld in [artikel 38, eerste, tweede en derde lid, van de wet][ref1], indien
      daaruit kan worden opgemaakt dat hij van oordeel is dat de betrokken toegelaten instellingen schade aan het belang
      van de volkshuisvesting hebben berokkend, en


