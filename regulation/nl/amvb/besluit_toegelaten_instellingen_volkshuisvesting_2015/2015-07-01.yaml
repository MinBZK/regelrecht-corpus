    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel25
  - number: 25.1.c
    text: |-
      een verklaring als bedoeld in [artikel 28 van de Wet justitiële en strafvorderlijke gegevens][ref1] omtrent het
      gedrag van de beoogde verkrijger of begunstigde.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel28
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: '28'
  - number: '25.2'
    text: 'Het verzoek, bedoeld in het eerste lid, gaat voorts vergezeld van:'
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel25
  - number: 25.2.a
    text: |-
      in geval van vervreemding van een woongelegenheid aan een natuurlijke persoon, waarin die persoon of een bloed- of
      aanverwant in de eerste graad van die persoon zijn hoofdverblijf heeft of zal hebben: de getaxeerde leegwaarde of
      de WOZ-waarde van de woongelegenheid;
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel25
  - number: 25.2.b
    text: |-
      in geval van vervreemding van een woongelegenheid aan een natuurlijke persoon, waarin die persoon of een bloed-
      of aanverwant in de eerste graad van die persoon niet zijn hoofdverblijf heeft of zal hebben, of aan een andere
      rechtspersoon dan een toegelaten instelling, met betrekking tot welke woongelegenheid de waardering van de
      kwaliteit, bedoeld in [artikel 5 van het Besluit huurprijzen woonruimte][ref1], kan leiden tot een huurprijs van
      ten hoogste het in [artikel 13, eerste lid, onderdeel a, van de Wet op de huurtoeslag][ref2] genoemde bedrag,
      of in geval van vervreemding van een gemengd gereguleerd complex aan een andere rechtspersoon dan een toegelaten
      instelling:


      [ref1]: https://wetten.overheid.nl/BWBR0003237#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0008659#Artikel13
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0003237
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0008659
        artikel: '13'
  - number: 25.2.b.1°
    text: |-
      de zienswijze van de gemeente waar die woongelegenheid of dat complex is gelegen en van de betrokken
      bewonersorganisatie;
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel25
  - number: 25.2.b.2°
    text: een verklaring van de beoogde verkrijger dat hij zich als een sociale verhuurder zal gedragen;
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel25
  - number: 25.2.b.3°
    text: de getaxeerde marktwaarde of de WOZ-waarde van die woongelegenheid of dat complex en
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel25
  - number: 25.2.b.4°
    text: |-
      tenzij de beoogde verkrijger een dochtermaatschappij van de vervreemdende toegelaten instelling is: bescheiden
      waaruit blijkt dat die woongelegenheid of dat complex gedurende ten minste vier weken te koop is aangeboden aan
      toegelaten instellingen en, in het openbaar, aan elke andere gegadigde in Nederland, en dat die woongelegenheid,
      indien zij verhuurd is, gedurende ten minste vier weken te koop is aangeboden aan de huurder tegen een prijs van
      ten hoogste de getaxeerde leegwaarde of de WOZ-waarde, met dien verstande dat uit die bescheiden niet behoeft te
      blijken van een zodanige aanbieding aan elke andere gegadigde in Nederland, indien de toegelaten instelling 5% of
      meer van de aandelen van de beoogde verkrijger houdt;
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel25
  - number: 25.2.c
    text: |-
      in geval van vervreemding van een woongelegenheid aan een natuurlijke persoon, waarin die persoon of een bloed-
      of aanverwant in de eerste graad van die persoon niet zijn hoofdverblijf heeft of zal hebben, of aan een andere
      rechtspersoon dan een toegelaten instelling, met betrekking tot welke woongelegenheid de waardering van de
      kwaliteit, bedoeld in [artikel 5 van het Besluit huurprijzen woonruimte][ref1], kan leiden tot een huurprijs die
      hoger is dan het in [artikel 13, eerste lid, onderdeel a, van de Wet op de huurtoeslag][ref2] genoemde bedrag, of
      in geval van vervreemding van een gemengd geliberaliseerd complex aan een andere rechtspersoon dan een toegelaten
      instelling:


      [ref1]: https://wetten.overheid.nl/BWBR0003237#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0008659#Artikel13
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0003237
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0008659
        artikel: '13'
  - number: 25.2.c.1°
    text: de zienswijze van de gemeente waar die woongelegenheid of dat complex is gelegen;
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel25
  - number: 25.2.c.2°
    text: de getaxeerde marktwaarde of de WOZ-waarde van die woongelegenheid of dat complex en
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel25
  - number: 25.2.c.3°
    text: |-
      tenzij de beoogde verkrijger een dochtermaatschappij van de vervreemdende toegelaten instelling is: bescheiden
      waaruit blijkt dat die woongelegenheid of dat complex gedurende ten minste vier weken te koop is aangeboden aan
      toegelaten instellingen en, in het openbaar, aan elke andere gegadigde in Nederland, met dien verstande dat uit die
      bescheiden niet behoeft te blijken van een zodanige aanbieding aan elke andere gegadigde in Nederland, indien de
      toegelaten instelling 5% of meer van de aandelen van de beoogde verkrijger houdt;
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel25
  - number: 25.2.d
    text: |-
      in geval van vervreemding van een gebouw als bedoeld in [artikel 45, tweede lid, onderdeel d, van de wet][ref1],
      anders dan bedoeld in [artikel 24, onderdelen a en d][ref2]:


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0036702#Artikel24
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel25
