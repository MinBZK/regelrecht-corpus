      toepassing heeft gegeven aan [artikel 48, tweede lid, van de wet][ref1], in een boekjaar aangaan van één
      overeenkomst van huur van verhuur met betrekking tot een andere woongelegenheid van die toegelaten instelling
      dan die, bedoeld in [artikel 47, eerste lid, onderdeel b of c, van de wet][ref2], aanleiding zou geven tot een
      terugvordering als bedoeld in het eerste lid, wordt geen toepassing aan dat lid gegeven.


