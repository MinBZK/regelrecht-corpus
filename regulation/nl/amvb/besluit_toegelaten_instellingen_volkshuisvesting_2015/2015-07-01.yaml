  - number: '64.5'
    text: Bij ministeriële regeling kunnen nadere voorschriften worden gegeven omtrent de toepassing van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel64
  - number: '65.1'
    text: |-
      De toegelaten instellingen op welke [artikel 49, eerste lid, eerste volzin, van de wet][ref1]
      van toepassing is, nemen in het voorstel, bedoeld in
      [artikel II, derde lid, tweede volzin, van de Herzieningswet toegelaten instellingen volkshuisvesting][ref2], voor
      elke wijk of buurt waar onroerende zaken zijn gelegen welke zij voornemens is in haar daeb-tak onder te brengen,
      een bedrag op dat gelijk is aan 5% van de WOZ-waarde van die zaken op 31 december 2015.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0036530#ArtikelII
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '49'
      - id: ref2
        bwb_id: BWBR0036530
        artikel: II
  - number: '65.2'
    text: |-
      De toegelaten instellingen, bedoeld in artikel 64, eerste lid, nemen in het jaarverslag, bedoeld in
      [artikel 36, eerste lid, van de wet][ref1], over het jaar 2015, voor elke wijk of buurt waar onroerende zaken
      zijn gelegen welke ingevolge [artikel 66][ref2] in de daeb-tak zouden kunnen zijn ondergebracht, een bedrag op dat
      gelijk is aan 5% van de WOZ-waarde van die zaken op 31 december 2015.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0036702#Artikel66
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '36'
      - id: ref2
        bwb_id: BWBR0036702
        artikel: '66'
        hoofdstuk: V
        paragraaf: '3'
        afdeling: '5'
  - number: '65.3'
    text: |-
      Indien het in de betrokken gemeente geldende volkshuisvestingsbeleid mede de aanwijzing van een gebied inhoudt waar
      herstructurering wordt beoogd en dat gebied meer dan een wijk of buurt beslaat, kan de toegelaten instelling voor
      de toepassing van het eerste of tweede lid uitgaan van de WOZ-waarde van haar onroerende zaken die gelegen zijn in
      dat gebied.
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel65
  - number: '65.4'
    text: |-
      Bij ministeriële regeling wordt bepaald welke delen van een gemeente voor de toepassing van het eerste, tweede en
      derde lid als wijk of buurt worden beschouwd.
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel65
  - number: '65.5'
    text: |-
      Dit artikel is niet van toepassing, indien de betrokken gemeente een gemeente is als genoemd in
      [artikel 1.11, tweede lid, onderdeel b, van de Wet maatregelen woningmarkt II][ref1], of een deelgemeente van de
      gemeente Rotterdam is als genoemd in artikel 1.11, tweede lid, onderdeel a, van die wet.


      [ref1]: https://wetten.overheid.nl/BWBR0034553#Artikel1
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0034553
        artikel: '1'
