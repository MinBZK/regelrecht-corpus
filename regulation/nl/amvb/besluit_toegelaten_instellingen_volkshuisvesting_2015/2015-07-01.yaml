        artikel: '47'
  - number: '31.3'
    text: |-
      Ten behoeve van de waardering wordt, behoudens in bij ministeriële regeling bepaalde gevallen, een waarde bepaald
      voor zowel het geval dat de toegelaten instelling de onroerende zaak gedurende een bij ministeriële regeling
      bepaald tijdvak blijft verhuren, als het geval dat de toegelaten instelling die zaak na het in dat tijdvak eindigen
      van een overeenkomst van huur en verhuur zal vervreemden. De marktwaarde is de hoogste van die waarden.
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel31
  - number: '31.4'
    text: |-
      Bij ministeriële regeling worden nadere voorschriften gegeven omtrent de toepassing van dit artikel, welke
      voorschriften kunnen afwijken van het eerste, tweede en derde lid of voor bij die regeling te bepalen categorieën
      van toegelaten instellingen verschillend kunnen worden vastgesteld, een en ander met het oog op het bewerkstelligen
      van een goede verhouding tussen de lasten voor toegelaten instellingen om te komen tot de waardering, bedoeld in
      [artikel 35, tweede lid, van de wet][ref1], en een goede uitvoering van het toezicht.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel35
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '35'
