  - number: 5.a
    text: |-
      een authentiek afschrift van de akte van oprichting van de vereniging of de stichting of van de notariële
      akte waarin de statuten van de vereniging na haar oprichting zijn opgenomen, en van de notariële akten waarin
      statutenwijzigingen zijn opgenomen;
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel5
  - number: 5.b
    text: |-
      het bewijs dat de vereniging of de stichting is ingeschreven in een openbaar register, gehouden door de Kamer van
      Koophandel;
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel5
  - number: 5.c
    text: |-
      het bewijs dat een authentiek afschrift van de akte van oprichting of van de notariële akte waarin de statuten
      zijn opgenomen, dan wel een authentiek uittreksel van die akte, authentieke afschriften van de notariële akten
      waarin statutenwijzigingen zijn opgenomen en de statuten als laatstelijk gewijzigd ten kantore van die Kamer zijn
      neergelegd;
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel5
  - number: 5.d
    text: de reglementen van de vereniging of de stichting;
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel5
  - number: 5.e
    text: de meest recente balans, winst- en verliesrekening en begroting van de vereniging of de stichting;
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel5
  - number: 5.f
    text: |-
      andere bescheiden die bijdragen aan een juist en volledig inzicht van Onze Minister in de financiële situatie van
      de vereniging of de stichting en
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel5
  - number: 5.g
    text: |-
      afzonderlijke gegevens omtrent de te verhuren woongelegenheden van de vereniging of de stichting als bedoeld
      in [artikel 46, eerste lid, onderdeel b, van de wet][ref1], de te verhuren overige woongelegenheden van
      de vereniging of de stichting, de te verhuren gebouwen van de vereniging of de stichting als bedoeld in
      [artikel 45, tweede lid, onderdeel d, van de wet][ref2] en de te verhuren overige gebouwen van de vereniging of
      de stichting.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel45
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '46'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '45'
  - number: '6'
    text: |-
      Onze Minister beslist op het verzoek, bedoeld in [artikel 19, eerste lid, tweede volzin, van de wet][ref1], binnen
      zes weken na ontvangst van de zienswijzen, bedoeld in artikel 19, tweede lid, eerste volzin, van de wet. Indien
      een college van burgemeester en wethouders of een bewonersorganisatie zijn of haar zodanige zienswijze niet of
      niet tijdig aan Onze Minister heeft doen toekomen, beslist Onze Minister binnen zes weken na het verstrijken van de
      termijn, bedoeld in artikel 19, tweede lid, tweede volzin, van de wet.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel19
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '19'
  - number: '7.1'
    text: |-
      Teneinde te voldoen aan [artikel 20, vijfde lid, tweede volzin, van de wet][ref1] verkoopt Onze
      Minister of de persoon of instantie, bedoeld in de eerste volzin van dat lid, het overschot, bedoeld in
      [artikel 23b lid 1 van Boek 2 van het Burgerlijk Wetboek][ref2], voor zover daartoe iets anders dan geld
      behoort en de statuten van de ontbonden vereniging of stichting of een rechterlijke beschikking geen
      nadere aanwijzing behelzen. De verkoop geschiedt in het openbaar naar de plaatselijke gewoonten en op
      de gebruikelijke voorwaarden. Onze Minister of die persoon of instantie kan bepalen in welke volgorde
      woongelegenheden als bedoeld in [artikel 46, eerste lid, onderdeel b, van de wet][ref3] en gebouwen als bedoeld
      in [artikel 45, tweede lid, onderdeel d, van de wet][ref4] ter verkoop worden aangeboden aan de verschillende
      categorieën mogelijke verkrijgers van die woongelegenheden of gebouwen.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel23b
      [ref3]: https://wetten.overheid.nl/BWBR0005181#Artikel46
      [ref4]: https://wetten.overheid.nl/BWBR0005181#Artikel45
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '20'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: 23b
      - id: ref3
        bwb_id: BWBR0005181
        artikel: '46'
      - id: ref4
        bwb_id: BWBR0005181
        artikel: '45'
  - number: '7.2'
    text: |-
      Teneinde te voldoen aan [artikel 20, vijfde lid, tweede volzin, van de wet][ref1] besteedt Onze Minister de netto-
      opbrengst van de verkoop aan subsidies als bedoeld in [artikel 57, eerste lid, van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel57
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '20'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '57'
  - number: '8.1'
    text: |-
      Het verzoek om een goedkeuring als bedoeld in [artikel 21, tweede lid, eerste volzin, van de wet][ref1] gaat in elk
      geval vergezeld van:


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel21
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '21'
  - number: 8.1.a
    text: |-
      een uiteenzetting waarin de toegelaten instelling aannemelijk maakt dat het voornemen om zich in de zin van
      [artikel 21 van de wet][ref1] te verbinden met een andere rechtspersoon of vennootschap in het belang van de
      volkshuisvesting is;


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel21
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '21'
  - number: 8.1.b
    text: |-
      de zienswijzen van de gemeenten waar de toegelaten instelling of die rechtspersoon of vennootschap feitelijk
      werkzaam is;
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel8
  - number: 8.1.c
    text: de statuten en reglementen of ontwerpstatuten en -reglementen van die rechtspersoon of vennootschap;
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel8
  - number: 8.1.d
    text: |-
      een overzicht van het door de toegelaten instelling verschafte eigen of vreemd vermogen aan elk van de op het
      tijdstip van indiening van dat verzoek met haar verbonden ondernemingen, en van de door haar aan of ten behoeve van
      elk van die ondernemingen op dat tijdstip verleende garanties;
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel8
  - number: 8.1.e
    text: |-
      het ondernemingsplan of voorgenomen ondernemingsplan van de betrokken rechtspersoon of vennootschap, waarin in
      elk geval haar werkzaamheden of voorgenomen werkzaamheden zijn opgenomen en waaruit blijkt welk aandeel haar
      werkzaamheden of voorgenomen werkzaamheden op het gebied van de volkshuisvesting hebben in het geheel van haar
      werkzaamheden of voorgenomen werkzaamheden;
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel8
  - number: 8.1.f
    text: |-
      het financieringsplan of voorgenomen financieringsplan met betrekking tot die rechtspersoon of vennootschap,
      waarin in elk geval is opgenomen welke partijen voor welk aandeel eigen of vreemd vermogen aan die rechtspersoon of
      vennootschap zullen verschaffen;
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel8
  - number: 8.1.g
    text: |-
      een overzicht en een analyse van de financiële situatie van de toegelaten instelling en die van de betrokken
      rechtspersoon of vennootschap op het tijdstip van indiening van dat verzoek, waaronder in elk geval de meest
      recente balans van de toegelaten instelling, hun liquiditeits- en solvabiliteitspositie, een aan die posities
      gerelateerde en naar baten en lasten gespecificeerde meerjarenanalyse van de door hen verwachte kasstromen,
      hun mogelijkheden tot het aangaan van financiële transacties ten behoeve van het kunnen verrichten van hun
      werkzaamheden en een analyse van hun leningportefeuille;
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel8
  - number: 8.1.h
    text: |-
      een overzicht van de woongelegenheden van de toegelaten instelling met een huurprijs van ten hoogste het in
      [artikel 13, eerste lid, onderdeel a, van de Wet op de huurtoeslag][ref1] genoemde bedrag, waarvan de waardering
      van de kwaliteit, bedoeld in [artikel 5 van het Besluit huurprijzen woonruimte][ref2], kan leiden tot een huurprijs
      die hoger is dan dat bedrag, die zij voornemens is in de rechtspersoon of vennootschap onder te brengen;


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0003237#Artikel5
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: '13'
      - id: ref2
        bwb_id: BWBR0003237
        artikel: '5'
  - number: 8.1.i
    text: |-
      indien van toepassing: de meest recente balans, winst- en verliesrekening en begroting van die rechtspersoon of
      vennootschap;
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel8
  - number: 8.1.j
    text: |-
      de mededeling, bedoeld in [artikel 21, tweede lid, tweede volzin, onderdeel b, van de wet][ref1] en


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel21
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '21'
  - number: 8.1.k
    text: |-
      andere bescheiden die bijdragen aan een juist en volledig inzicht in de bedrijfsvoering of voorgenomen
      bedrijfsvoering en de financiering of voorgenomen financiering van die rechtspersoon of vennootschap.
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel8
  - number: '8.2'
    text: De toegelaten instelling doet het verzoek en de stukken, bedoeld in het eerste lid, aan Onze Minister toekomen.
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel8
  - number: '8.3'
    text: Bij ministeriële regeling kunnen nadere voorschriften worden gegeven omtrent de toepassing van dit artikel.
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel8
  - number: '9.1'
    text: |-
      Onze Minister keurt het zich verbinden, bedoeld in [artikel 21, tweede lid, eerste volzin, van de wet][ref1], niet
      goed, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel21
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '21'
  - number: 9.1.a
    text: |-
      naar zijn oordeel sprake is van een uit dat zich verbinden voortvloeiend niet aanvaardbaar risico dat door
      de toegelaten instelling in de betrokken rechtspersoon of vennootschap in te brengen vermogen niet voor de
      volkshuisvesting bestemd blijft;
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel9
  - number: 9.1.b
    text: |-
      het aantal woongelegenheden, bedoeld in [artikel 8, eerste lid, onderdeel h][ref1], waaronder mede worden
      begrepen zodanige woongelegenheden in gemengde geliberaliseerde complexen en waaronder niet worden begrepen andere
      woongelegenheden in zodanige complexen, hoger is dan 10% van het aantal zodanige woongelegenheden dat de toegelaten
      instelling op 31 december 2014 in eigendom had;


      [ref1]: https://wetten.overheid.nl/BWBR0036702#Artikel8
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0036702
        artikel: '8'
        hoofdstuk: III
        paragraaf: '3'
  - number: 9.1.c
    text: |-
      door dat zich verbinden strijdigheid zou ontstaan met
      [artikel 81, derde lid, eerste volzin, onverminderd de tweede, derde en vierde volzin van dat lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0036702#Artikel81
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0036702
        artikel: '81'
        hoofdstuk: V
        paragraaf: '1'
        afdeling: '6'
  - number: 9.1.d
    text: |-
      de verrekening tussen de betrokken rechtspersoon of vennootschap en de toegelaten instelling die het gevolg is van
      het onderbrengen, bedoeld in [artikel 8, eerste lid, onderdeel h][ref1], voor meer dan 60% geschiedt in de vorm
      van aandelen;


      [ref1]: https://wetten.overheid.nl/BWBR0036702#Artikel8
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0036702
        artikel: '8'
        hoofdstuk: III
        paragraaf: '3'
  - number: 9.1.e
    text: |-
      indien de toegelaten instelling in verband met dat onderbrengen een lening aan die rechtspersoon of vennootschap
      verstrekt: 'die lening:'
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel9
  - number: 9.1.e.1°
    text: geen hypothecaire geldlening is of
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel9
  - number: 9.1.e.2°
    text: |-
      niet voldoet aan het bepaalde bij en krachtens [artikel 10, tweede lid][ref1] en in verband daarmee vierde lid,
      onverminderd het bepaalde bij en krachtens artikel 10, derde lid en in verband daarmee vierde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0036702#Artikel10
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0036702
        artikel: '10'
        hoofdstuk: III
        paragraaf: '3'
  - number: 9.1.f
    text: |-
      indien het zich verbinden niet inhoudt dat toepassing wordt gegeven aan
      [artikel 50a, eerste lid, van de wet][ref1]: de betrokken in het belang van de huurders van de woongelegenheden van
      de betrokken toegelaten instelling werkzame bewonersorganisaties niet met dat zich verbinden instemmen.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel50a
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 50a
  - number: '9.2'
    text: 'Onze Minister betrekt bij zijn oordeel, bedoeld in het eerste lid, onderdeel a, in elk geval:'
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel9
  - number: 9.2.a
    text: de geraamde solvabiliteit van de toegelaten instelling na een zich verbinden als bedoeld in dat lid;
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel9
  - number: 9.2.b
    text: |-
      de verhouding tussen het saldo van de operationele kasstromen en de rentelasten van de toegelaten instelling
      gedurende de eerste vijf jaren na een zich zodanig verbinden en
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel9
  - number: 9.2.c
    text: |-
      de meest recente beoordeling door de borgingsvoorziening van de kredietwaardigheid van de toegelaten instelling,
      indien zij leningen als bedoeld in [artikel 66, eerste lid, onderdeel f][ref1], heeft aangetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0036702#Artikel66
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0036702
        artikel: '66'
        hoofdstuk: V
        paragraaf: '3'
        afdeling: '5'
  - number: '9.3'
    text: |-
      Onze Minister kan op verzoek van de toegelaten instelling een hoger percentage dan dat, genoemd in het eerste lid,
      onderdeel b, vaststellen, indien:
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel9
  - number: 9.3.a
    text: |-
      de toegelaten instelling bij dat verzoek aannemelijk heeft gemaakt dat toepassing van dat hogere percentage
      noodzakelijk is om haar financiële continuïteit of die van de betrokken rechtspersoon of vennootschap voldoende te
      waarborgen, of
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel9
  - number: 9.3.b
    text: |-
      aantoont dat toereikend toepassing gegeven kan worden aan [artikel 42, eerste lid, eerste volzin, van de wet][ref1]
      wat betreft haar werkzaamheden die diensten van algemeen economisch belang zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel42
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '42'
  - number: '9.4'
    text: Bij ministeriële regeling kunnen nadere voorschriften worden gegeven omtrent de toepassing van dit artikel.
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel9
  - number: '10.1'
    text: |-
      De financiële continuïteit, bedoeld in [artikel 21, tweede lid, tweede volzin, onderdeel d, van de wet][ref1],
      is niet voldoende gewaarborgd, indien Onze Minister van oordeel is dat de financiële middelen van de betrokken
      toegelaten instelling of rechtspersoon of vennootschap onvoldoende zullen blijken te zijn om hun voorgenomen
      werkzaamheden te kunnen verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel21
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '21'
  - number: '10.2'
    text: |-
      Een lening als bedoeld in [artikel 21, tweede lid, tweede volzin, onderdeel e, van de wet][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel21
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '21'
  - number: 10.2.a
    text: |-
      heeft een rentepercentage dat gelijk is aan de op het tijdstip van indiening van het verzoek om een goedkeuring als
      bedoeld in [artikel 21, tweede lid, eerste volzin, van de wet][ref1] geldende rente op tienjarige staatsleningen,
      vermeerderd met een bij ministeriële regeling te bepalen percentage, en


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel21
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '21'
  - number: 10.2.b
    text: |-
      wordt afgelost binnen 15 jaar en zodanig, dat na vijf en tien jaar ten minste een derde respectievelijk twee derde
      deel is afgelost.
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel10
  - number: '10.3'
    text: |-
      De toegelaten instelling kan Onze Minister verzoeken om de aflossing, bedoeld in het tweede lid, onderdeel b,
      op een later tijdstip te stellen of het af te lossen bedrag lager vast te stellen. Onze Minister willigt het
      verzoek uitsluitend in, indien naar zijn oordeel daardoor wordt voorkomen dat de financiële continuïteit van de
      rechtspersoon of vennootschap niet meer is gewaarborgd en de financiële continuïteit van de toegelaten instelling
      gewaarborgd blijft. Hij kan aan dat inwilligen nadere voorwaarden verbinden.
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel10
  - number: '10.4'
    text: Bij ministeriële regeling kunnen nadere voorschriften worden gegeven omtrent de toepassing van dit artikel.
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel10
  - number: '11'
    text: |-
      Onze Minister willigt een verzoek als bedoeld in [artikel 21, vijfde lid, van de wet][ref1] uitsluitend in, indien
      de betrokken samenwerkingsvennootschap uitsluitend is opgericht:


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel21
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '21'
  - number: 11.a
    text: |-
      met het oogmerk om mogelijk te maken dat de daarin samenwerkende toegelaten instellingen bijdragen aan elkaars
      werkzaamheden met het oog op het voldoen aan [artikel 42, eerste lid, eerste volzin, van de wet][ref1] of


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel42
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '42'
  - number: 11.b
    text: |-
      met het oogmerk dat het in stand houden van of het treffen van voorzieningen aan woongelegenheden van een
      toegelaten instelling, die zijn gelegen in een gemeente of regio als bedoeld in [artikel 41b van de wet][ref1] waar
      die toegelaten instelling niet feitelijk werkzaam is, geschiedt door een toegelaten instelling die in die gemeente
      of regio feitelijk werkzaam is.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel41b
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 41b
  - number: '12'
    text: |-
      Een ontheffing als bedoeld in [artikel 21a, derde lid, van de wet][ref1] wordt uitsluitend verleend, indien dat
      naar het oordeel van Onze Minister noodzakelijk is:


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel21a
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 21a
  - number: 12.a
    text: |-
      om te voorkomen dat de toegelaten instelling gehouden is om schulden van de betrokken verbonden onderneming te
      voldoen;
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel12
  - number: 12.b
    text: |-
      ten behoeve van de herfinanciering van leningen die bestonden op het tijdstip waarop
      [artikel I van de Herzieningswet toegelaten instellingen volkshuisvesting][ref1] in werking is getreden of


      [ref1]: https://wetten.overheid.nl/BWBR0036530#ArtikelI
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0036530
        artikel: I
  - number: 12.c
    text: |-
      ten behoeve van de herfinanciering van leningen die bestaan op het tijdstip waarop een juridische scheiding wordt
      bewerkstelligd.
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel12
  - number: '13.1'
    text: |-
      De categorieën van instellingen, bedoeld in [artikel 21c, eerste lid, van de wet][ref1], zijn:


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel21c
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 21c
  - number: 13.1.a
    text: Nederlandse overheden;
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel13
  - number: 13.1.b
    text: |-
      Nederlandse banken als bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref1], met ten minste
      een single A-rating of een daarmee vergelijkbare rating, afgegeven door ten minste twee van de bij ministeriële
      regeling te noemen ratingbureaus;


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
  - number: 13.1.c
    text: |-
      banken met een vergunning als bedoeld in [artikel 2:15, eerste lid][ref1], of
      [2:16, eerste lid, van de Wet op het financieel toezicht][ref2], met ten minste een single A-rating of een daarmee
      vergelijkbare rating, afgegeven door ten minste twee van de bij ministeriële regeling te noemen ratingbureaus, en


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel2
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '2'
  - number: 13.1.d
    text: |-
      professionele beleggers als bedoeld in [artikel 1:1][ref1], begripsomschrijving van professionele belegger,
      onderdelen b tot en met r, van de[Wet op het financieel toezicht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0020368
  - number: '13.2'
    text: |-
      Bij ministeriële regeling kunnen andere daarbij te bepalen categorieën van instellingen worden aangewezen, indien
      zonder die aanwijzing het aangaan van financiële transacties door toegelaten instellingen op een wijze zou worden
      belemmerd die strijdig is met het belang van de volkshuisvesting.
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel13
  - number: '13.3'
    text: |-
      Het percentage, bedoeld in [artikel 21c, tweede lid, van de wet][ref1], is 50.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel21c
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 21c
  - number: '14.1'
    text: |-
      De toegelaten instelling maakt in elk stuk tot het verstrekken waarvan zij ingevolge de wet of dit besluit
      verplicht is, en in elk van haar reglementen inzichtelijk welke feiten, omstandigheden en bepalingen betrekking
      hebben op hetzij haar daeb-tak, hetzij haar niet-daeb-tak, hetzij haar gehele organisatie.
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel14
  - number: '14.2'
    text: |-
      Onze Minister maakt in elk besluit jegens en in elke andere mededeling aan een toegelaten instelling inzichtelijk
      welke elementen daarvan betrekking hebben op hetzij haar daeb-tak, hetzij haar niet-daeb-tak, hetzij haar gehele
      organisatie.
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel14
  - number: '14.3'
    text: |-
      Het eerste en tweede lid zijn, ten aanzien van toegelaten instellingen op welke
      [artikel 49, eerste lid, eerste volzin, van de wet][ref1] ingevolge de tweede volzin van dat lid niet van
      toepassing is, van overeenkomstige toepassing op hetzij hun werkzaamheden die behoren respectievelijk niet behoren
      tot de diensten van algemeen economisch belang, hetzij haar gehele organisatie.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel49
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '49'
  - number: '14.4'
    text: |-
      Dit artikel is niet van toepassing, indien en zodra de toegelaten instelling toepassing heeft gegeven aan
      [artikel 50a van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel50a
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 50a
  - number: '15'
    text: |-
      Onze Minister betrekt bij een besluit tot het nemen waarvan hij ingevolge de wet of dit besluit bevoegd is, behalve
      de op grond van de bij de wet of in het bepaalde bij of krachtens dit besluit gegeven daarop betrekking hebbende
      voorschriften, de daarover uitgebrachte zienswijzen en adviezen en de uitkomsten van daarover gevoerd overleg. Hij
      kan daarnaast bij die besluiten het belang van de volkshuisvesting betrekken, indien dat naar zijn oordeel naast
      die voorschriften, zienswijzen, adviezen of uitkomsten in het geding is.
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel15
  - number: '16.1'
    text: |-
      De inkomensgrens in de zin van [artikel 1, eerste lid, van de wet][ref1] is:


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel1
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '1'
  - number: 16.1.a
    text: |-
      € 34.911 ten aanzien van ten minste 80% van haar woongelegenheden, bedoeld in
      [artikel 47, eerste lid, onderdelen b en c, van de wet][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel47
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '47'
  - number: 16.1.b
    text: |-
      totdat de eerste vijf volle kalenderjaren na het tijdstip waarop dit besluit in werking is getreden zijn
      verstreken: € 38.950 ten aanzien van een zodanig percentage van haar zodanige woongelegenheden, dat wordt voldaan
      aan [artikel 48, eerste lid, eerste volzin, van de wet][ref1], waarbij, indien van toepassing, het overeenkomstig
      [artikel 60][ref2] vastgestelde percentage in aanmerking wordt genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0036702#Artikel60
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '48'
      - id: ref2
        bwb_id: BWBR0036702
        artikel: '60'
        hoofdstuk: V
        paragraaf: '1'
        afdeling: '4'
  - number: '16.2'
    text: |-
      De bedragen, genoemd in het eerste lid, worden met ingang van elk kalenderjaar bij
      ministeriële regeling gewijzigd met het percentage waarmee per gelijke datum het in
      [artikel 18, eerste lid, onderdeel d, van de Wet op de huurtoeslag][ref1] genoemde bedrag wordt gewijzigd. De
      bedragen, genoemd in de in [artikel 36a, vierde lid, van de wet][ref2] bedoelde ministeriële regeling, worden met
      ingang van elk kalenderjaar, voor het eerst op 1 januari 2017, bij ministeriële regeling vervangen door de bedragen
      zoals die op 1 januari van het daaraan voorafgaande jaar overeenkomstig de eerste volzin zijn gewijzigd.


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel36a
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: '18'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: 36a
  - number: '17'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met het oog op de toepassing van de
      [artikelen 21a, tweede lid, tweede volzin][ref1], en [47, vierde lid, van de wet][ref2],
      [artikel II, tiende lid, van de Herzieningswet toegelaten instellingen volkshuisvesting][ref3], en de
      [artikelen 63, eerste lid][ref4], en [69, derde lid][ref5], en kunnen stukken worden aangewezen uit welke blijkt
      dat de toegelaten instelling beoogt een aanvang met bepaalde werkzaamheden te maken.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel21a
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel47
      [ref3]: https://wetten.overheid.nl/BWBR0036530#ArtikelII
      [ref4]: https://wetten.overheid.nl/BWBR0036702#Artikel63
      [ref5]: https://wetten.overheid.nl/BWBR0036702#Artikel69
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 21a
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '47'
      - id: ref3
        bwb_id: BWBR0036530
        artikel: II
      - id: ref4
        bwb_id: BWBR0036702
        artikel: '63'
        hoofdstuk: V
        paragraaf: '2'
        afdeling: '4'
      - id: ref5
        bwb_id: BWBR0036702
        artikel: '69'
        hoofdstuk: V
        paragraaf: '3'
        afdeling: '5'
  - number: '18'
    text: |-
      Op verzoek van Onze Minister verstrekt de borgingsvoorziening hem inlichtingen over haar werkzaamheden ten aanzien
      van het door toegelaten instellingen aantrekken van leningen, voor zover dat naar zijn oordeel in verband met het
      door de Staat der Nederlanden faciliteren van de borgingsvoorziening noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel18
  - number: '19.1'
    text: |-
      De zienswijze, bedoeld in de [artikelen 25, tweede lid][ref1], en [30, derde lid, van de wet][ref2], heeft in elk
      geval betrekking op:


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel30
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '25'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '30'
  - number: 19.1.a
    text: |-
      de geschiktheid van de beoogde bestuurder of commissaris, blijkend uit diens opleiding, diens werkervaring
      vakinhoudelijke kennis en de competenties, genoemd in [bijlage 1][ref1] bij dit besluit, en


      [ref1]: https://wetten.overheid.nl/BWBR0036702
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0036702
  - number: 19.1.b
    text: |-
      de betrouwbaarheid van de beoogde bestuurder of commissaris, blijkend uit diens handelen of nalaten of voornemens
      daartoe en uit de antecedenten, genoemd in [bijlage 2][ref1] bij dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0036702
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0036702
  - number: '19.2'
    text: |-
      Onze Minister betrekt bij zijn zienswijze de aard en zwaarte van de functie waarvoor de beoogde bestuurder
      of commissaris in aanmerking wordt gebracht, en de aard en de omvang van de werkzaamheden van de toegelaten
      instelling.
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel19
  - number: '19.3'
    text: |-
      Bij ministeriële regeling kunnen nadere voorschriften worden gegeven omtrent het uitbrengen van de zienswijze,
      bedoeld in de [artikelen 25, tweede lid][ref1], en [30, derde lid, van de wet][ref2], en voorschriften worden
      gegeven omtrent de door de toegelaten instelling aan Onze Minister te verstrekken inlichtingen ten behoeve van het
      opstellen van die zienswijze.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel30
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '25'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '30'
  - number: '20'
    text: |-
      De rijksbelastingdienst verstrekt Onze Minister op zijn verzoek de gegevens die naar zijn oordeel noodzakelijk
      zijn om ten aanzien van de beoogde bestuurder of commissaris te kunnen beoordelen of sprake is van een fiscaal-
      bestuursrechtelijk antecedent als bedoeld in [bijlage 2, onder 5][ref1], bij dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0036702
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0036702
  - number: '21.1'
    text: |-
      De goedkeuring, bedoeld in [artikel 26, eerste lid, aanhef en onderdeel c, van de wet][ref1], is niet vereist in
      geval van investeringen ten behoeve van het in stand houden van of treffen van voorzieningen aan onroerende zaken
      in eigendom van de toegelaten instelling, tenzij de statuten bepalen dat die goedkeuring in dat geval wel vereist
      is.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel26
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '26'
  - number: '21.2'
    text: |-
      De goedkeuring, bedoeld in [artikel 26, eerste lid, aanhef en onderdeel i, van de wet][ref1], is niet vereist,
      indien:


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel26
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '26'
  - number: 21.2.a
    text: met het betrokken besluit van het bestuur een bedrag van minder dan € 10.000.000 gemoeid is;
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel21
  - number: 21.2.b
    text: |-
      de betrokken besluiten van het bestuur transacties als bedoeld in dat onderdeel betreffen met betrekking tot
      woongelegenheden van welke de beoogde verkrijger een natuurlijke persoon is en waarin die persoon of een bloed- of
      aanverwant in de eerste graad van die persoon zijn hoofdverblijf heeft of zal hebben, tenzij de statuten bepalen
      dat die goedkeuring in die gevallen wel vereist is.
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel21
  - number: '22'
    text: |-
      Voor de toepassing van deze paragraaf wordt ten aanzien van een onroerende zaak, vanaf het
      tijdstip dat die zaak voorwerp wordt van een besluit tot vervreemding daarvan als bedoeld in
      [artikel 27, eerste lid, aanhef en onderdeel a, van de wet][ref1] tot het tijdstip dat daaropvolgende
      vervreemdingen van die zaak geen gevolgen voor de bij dat besluit of die vervreemdingen betrokkenen meer kunnen
      hebben, door die betrokkenen steeds uitgegaan van hetzij de getaxeerde markt- of leegwaarde van die zaak, hetzij de
      WOZ-waarde van die zaak, in de gevallen dat die keuze blijkens deze paragraaf mogelijk wordt gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel27
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '27'
  - number: '23.1'
    text: |-
      Voor de toepassing van [artikel 24][ref1] wordt onder vervreemding onder voorwaarden verstaan de vervreemding van
      een woongelegenheid door een toegelaten instelling aan een natuurlijke persoon tegen een prijs van minder dan 90%
      van de getaxeerde leegwaarde of de WOZ-waarde, indien die persoon of een bloed- of aanverwant in de eerste graad
      van die persoon daarin zijn hoofdverblijf heeft of zal hebben:


      [ref1]: https://wetten.overheid.nl/BWBR0036702#Artikel24
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0036702
        artikel: '24'
        hoofdstuk: IV
        paragraaf: '3'
  - number: 23.1.a
    text: tegen een prijs van ten minste 50% van de getaxeerde leegwaarde of de WOZ-waarde en
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel23
  - number: 23.1.b
    text: |-
      onder een van de bij ministeriële regeling bepaalde bedingen of combinaties van bedingen inzake de opvolgende
      vervreemding van de woongelegenheid, de wijze van bepaling van de financiële gevolgen van die vervreemding en de
      toerekening daarvan aan de toegelaten instelling of haar rechtsopvolger en de verkrijgende natuurlijke persoon of
      diens erfopvolger.
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel23
  - number: '23.2'
    text: |-
      Voor de toepassing van [artikel 24][ref1] wordt onder vervreemding onder voorwaarden tevens verstaan een
      vervreemding van een woongelegenheid door een toegelaten instelling aan een natuurlijke persoon als bedoeld in de
      aanhef van het eerste lid:


      [ref1]: https://wetten.overheid.nl/BWBR0036702#Artikel24
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0036702
        artikel: '24'
        hoofdstuk: IV
        paragraaf: '3'
  - number: 23.2.a
    text: tegen een prijs van ten minste 75% van de getaxeerde leegwaarde of de WOZ-waarde;
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel23
  - number: 23.2.b
    text: |-
      indien die persoon een huishoudinkomen heeft van ten hoogste € 38.950, vastgesteld aan de hand van aan de
      toegelaten instelling te verstrekken gegevens overeenkomstig bij ministeriële regeling te geven voorschriften en
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel23
  - number: 23.2.c
    text: onder een beding als bedoeld in het bepaalde bij en krachtens het eerste lid, onderdeel b.
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel23
  - number: '23.3'
    text: |-
      Het bedrag, genoemd in het tweede lid, onderdeel b, wordt met ingang van elk kalenderjaar
      bij ministeriële regeling gewijzigd met het percentage waarmee per gelijke datum het in
      [artikel 18, eerste lid, onderdeel d, van de Wet op de huurtoeslag][ref1] genoemde bedrag wordt gewijzigd.


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel18
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: '18'
  - number: '24'
    text: |-
      De goedkeuring, bedoeld in [artikel 27, eerste lid, aanhef en onderdeel a, van de wet][ref1], is niet vereist, voor
      zover het betrokken besluit van het bestuur betreft:


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel27
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '27'
  - number: 24.a
    text: |-
      de vervreemding van een woongelegenheid of van een gebouw als bedoeld in
      [artikel 45, tweede lid, onderdeel d, van de wet][ref1] aan een toegelaten instelling;


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel45
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '45'
  - number: 24.b
    text: |-
      de vervreemding van een woongelegenheid aan een natuurlijke persoon tegen ten minste 90% van de getaxeerde
      leegwaarde of de WOZ-waarde, indien die persoon of een bloed- of aanverwant in de eerste graad van die persoon
      daarin zijn hoofdverblijf heeft of zal hebben;
