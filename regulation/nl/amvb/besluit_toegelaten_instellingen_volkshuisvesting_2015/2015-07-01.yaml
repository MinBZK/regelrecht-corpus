        artikel: '126'
        hoofdstuk: IX
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005181
        hoofdstuk: IV
  - number: '128'
    text: |-
      Het [Besluit centraal Fonds voor de Volkshuisvesting][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0004418
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel128
    references:
