        artikel: '47'
  - number: 80.1.d
    text: |-
      gebouwen als bedoeld in [artikel 45, tweede lid, onderdeel d, van de wet][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel45
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel80
    references:
      - id: ref1
