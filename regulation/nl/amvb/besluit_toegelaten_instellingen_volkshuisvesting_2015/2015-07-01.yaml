  - number: '124'
    text: |-
      Voor zover gemeenten bevoegdheden die hen ingevolge dit besluit toekomen hebben overgedragen aan een
      samenwerkingsverband als bedoeld in de [Wet gemeenschappelijke regelingen][ref1], zijn de bepalingen van dit
      besluit die op die bevoegdheden betrekking hebben van overeenkomstige toepassing op dat samenwerkingsverband.


      [ref1]: https://wetten.overheid.nl/BWBR0003740
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel124
    references:
      - id: ref1
        bwb_id: BWBR0003740
  - number: '125.1'
    text: |-
      Onze Minister kan van dit besluit afwijken of afwijking daarvan toestaan ten behoeve van experimenten die naar zijn
      oordeel in het belang van de volkshuisvesting zijn.
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel125
  - number: '125.2'
    text: |-
      Onze Minister kan besluiten dat een afwijking als bedoeld in het eerste lid van kracht blijft zolang een door hem
      op basis van het experiment noodzakelijk geoordeelde wijziging van dit besluit nog niet in werking is getreden.
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel125
  - number: '126.1'
    text: |-
      De toegelaten instellingen geven, behoudens
      [artikel II, derde tot en met elfde lid, van de Herzieningswet toegelaten instellingen volkshuisvesting][ref1]
      en het tweede lid van dit artikel, terstond na het tijdstip waarop [artikel I van die wet][ref2] in werking is
      getreden toepassing aan het bepaalde bij en krachtens [hoofdstuk IV van de wet][ref3], voor zover zij niet binnen
      het in artikel II, tweede lid, van genoemde wet bedoelde tijdvak ten overstaan van Onze Minister aannemelijk maken
      dat het verrichten van werkzaamheden in verband met het toepassing geven aan dat lid daaraan naar redelijkheid in
      de weg staat.


      [ref1]: https://wetten.overheid.nl/BWBR0036530#ArtikelII
      [ref2]: https://wetten.overheid.nl/BWBR0036530#ArtikelI
      [ref3]: https://wetten.overheid.nl/BWBR0005181#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel126
    references:
      - id: ref1
        bwb_id: BWBR0036530
        artikel: II
      - id: ref2
        bwb_id: BWBR0036530
        artikel: I
      - id: ref3
        bwb_id: BWBR0005181
        hoofdstuk: IV
  - number: '126.2'
    text: 'Indien het tijdstip, bedoeld in het eerste lid, een ander is dan 1 januari van enig kalenderjaar:'
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel126
  - number: 126.2.a
    text: |-
      geven de toegelaten instellingen met ingang van 1 januari van het op dat kalenderjaar eerstvolgende
      kalenderjaar toepassing aan het bepaalde bij en krachtens de [artikelen 35 tot en met 38][ref1] en
      [46, tweede lid, van de wet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel46
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel126
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '35'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '46'
  - number: 126.2.b
    text: |-
      dragen de toegelaten instellingen, in afwijking van [artikel 44, eerste lid, van de wet][ref1], er zorg voor dat
      de in dat lid genoemde instanties op 1 november van dat kalenderjaar beschikken over het overzicht, bedoeld in
      [artikel 43, eerste lid, van de wet][ref2], dat betrekking heeft op de op dat kalenderjaar eerstvolgende vijf
      kalenderjaren, en


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel43
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel126
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '44'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '43'
  - number: 126.2.c
    text: |-
      wordt bij de verslaglegging over het uitvoering geven aan het bepaalde bij en krachtens
      [artikel 48 van de wet][ref1] de inkomensgrens, genoemd in [artikel 16, eerste lid, onderdeel b][ref2], op dezelfde
      wijze betrokken als in de situatie dat die grens had gegolden gedurende het gehele kalenderjaar waarin dat tijdstip
      valt.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0036702#Artikel16
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel126
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '48'
      - id: ref2
        bwb_id: BWBR0036702
        artikel: '16'
        hoofdstuk: III
        paragraaf: '4'
  - number: '126.3'
    text: |-
      In afwijking van [artikel 49, eerste lid][ref1], kunnen de toegelaten instellingen tot 1 januari 2021, ten
      aanzien van 25% van het bruto-vloeroppervlak van de gebouwen, genoemd in de tweede volzin, het aangaan van
      overeenkomsten van huur en verhuur in de daeb-tak onderbrengen, indien het voornemen daartoe is opgenomen in het
      overzicht, bedoeld in [artikel 44a, eerste lid, onderdeel a, van de wet][ref2] over het jaar 2017. De gebouwen,
      bedoeld in de eerste volzin, zijn de gebouwen waarin na 31 december 2011 zorg is verleend door een instelling
      die behoort tot een categorie als bedoeld in [artikel 5, eerste lid, van de Wet toelating zorginstellingen][ref3]
      en die is toegelaten voor de zorgvorm verblijf als bedoeld in het [Besluit zorgaanspraken AWBZ][ref4] zoals dat
      luidde op 31 december 2014, in combinatie met een of meer van de zorgvormen persoonlijke verzorging, verpleging
      en begeleiding als bedoeld in dat besluit, en voor welke zorg de Nederlandse Zorgautoriteit, genoemd in
      [artikel 3 van de Wet marktordening gezondheidszorg][ref5], een vergoeding voor kapitaallasten heeft vastgesteld op
      grond van [artikel 57 van die wet][ref6]. Tot het bruto-vloeroppervlak, bedoeld in de eerste volzin, behoort mede
      het vloeroppervlak van de bij die gebouwen behorende overdekte parkeervoorzieningen en de oppervlakte van de bij
      die gebouwen behorende overige parkeervoorzieningen.


      [ref1]: https://wetten.overheid.nl/BWBR0036702#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel44a
      [ref3]: https://wetten.overheid.nl/BWBR0018906#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0014149
      [ref5]: https://wetten.overheid.nl/BWBR0020078#Artikel3
      [ref6]: https://wetten.overheid.nl/BWBR0020078#Artikel57
    url: https://wetten.overheid.nl/BWBR0036702/2015-07-01#Artikel126
