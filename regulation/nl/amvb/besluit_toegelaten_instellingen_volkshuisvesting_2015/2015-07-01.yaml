    text: |-
      de vestiging van een recht van erfpacht, opstal of vruchtgebruik op een andere gebouwde onroerende zaak dan
      een woongelegenheid, een gebouw als bedoeld in [artikel 45, tweede lid, onderdeel d, van de wet][ref1], of op
