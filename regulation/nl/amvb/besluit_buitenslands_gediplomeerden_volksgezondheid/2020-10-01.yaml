    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Op de voordracht van Onze Minister van Volksgezondheid, Welzijn en Sport van 24 november 1994, PAO/BOG 9414146;


    Gelet op de artikelen 41, vijfde lid, 42, tweede lid, en 45, derde lid, van de Wet op de beroepen in de individuele
    gezondheidszorg;


    De Raad van State gehoord (advies van 1 maart 1995, no. W13.94.0726);


    Gezien het nader rapport van Onze Minister van Volksgezondheid, Welzijn en Sport van 2 mei 1995, DGVgz/PAO/BOG-
    953685;


    Hebben goedgevonden en verstaan:
