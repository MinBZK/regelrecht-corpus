  - number: '5'
    text: Een advies van de commissie bevat de gronden waarop het berust.
    url: https://wetten.overheid.nl/BWBR0007397/2020-10-01#Artikel5
  - number: '6'
    text: |-
      1 De commissie regelt haar werkwijze met inachtneming van dit besluit.

      2 De commissie kan externe deskundigen raadplegen.

      3 De commissie beraadslaagt en brengt advies uit in de overeenkomstig [artikel 2, eerste lid][ref1], voor het
      desbetreffende beroep bedoelde samenstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0007397#Artikel2
