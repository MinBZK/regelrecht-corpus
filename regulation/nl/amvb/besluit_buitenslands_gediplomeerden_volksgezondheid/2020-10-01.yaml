  - number: 3a
    text: |-
      1 De commissie kan bepalen dat de buitenslands gediplomeerde die beschikt over een getuigschrift dat is afgegeven
      door de autoriteiten van een staat die is gelegen buiten het EER-gebied, een kennis- en vaardighedentoets dient af
      te leggen ten behoeve van het advies, bedoeld in [artikel 3][ref1].

      2 Onze Minister stelt per beroepsgroep een tarief vast voor de kennis- en vaardighedentoets.

      3 De in het eerste lid bedoelde buitenslands gediplomeerde voldoet voor het afleggen van de kennis- en
      vaardighedentoets het in het tweede lid genoemde tarief.


      [ref1]: https://wetten.overheid.nl/BWBR0007397#Artikel3
    url: https://wetten.overheid.nl/BWBR0007397/2020-10-01#Artikel3a
