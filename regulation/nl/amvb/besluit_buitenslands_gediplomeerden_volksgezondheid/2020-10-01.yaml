  - number: 6a
    text: |-
      1 Bij een aanvraag om erkenning van een getuigschrift als bedoeld in
      [artikel 41, eerste lid, onder a, van de wet][ref1], worden de volgende bescheiden overgelegd:

      a. een door Onze Minister beschikbaar te stellen formulier, dat door de aanvrager is ingevuld;

      b. het in [artikel 41, eerste lid, onder a, van de wet][ref2] bedoelde getuigschrift;

      c. een bewijs van zijn nationaliteit alsmede:

      1° indien de aanvrager een onder 2° aangewezen migrerende beroepsbeoefenaar is, als bedoeld in
      [artikel 1, Algemene wet erkenning EU-beroepskwalificaties][ref3], een door Nederland afgegeven EG-
      verblijfsvergunning voor langdurig ingezetenen als bedoeld in artikel 8 van [Richtlijn 2003/109/EG](32003L0109)
      van de Raad van de Europese Unie van 25 november 2003 betreffende de status van langdurig ingezeten onderdanen
      van derde landen (PbEU 2004, L 16), of een door een andere betrokken staat dan Nederland afgegeven zodanige EG-
      verblijfsvergunning en een verblijfsvergunning als bedoeld in [artikel 14 van de Vreemdelingenwet 2000][ref4];

      2° indien de aanvrager een onder 3° aangewezen migrerende beroepsbeoefenaar is, als bedoeld in
      [artikel 1, Algemene wet erkenning EU-beroepskwalificaties][ref5], een verblijfskaart van een familielid van
      een burger van de Unie of een duurzame verblijfskaart of een ander bewijsmiddel waaruit blijkt dat de aanvrager
      het verblijfsrecht of het duurzaam verblijfsrecht heeft verkregen als bedoeld in hoofdstuk III, respectievelijk
      hoofdstuk IV van [Richtlijn 2004/38/EG](32004L0038) van het Europees Parlement en de Raad van de Europese Unie
      van 29 april 2004 betreffende het recht van vrij verkeer en verblijf op het grondgebied van de lidstaten voor de
      burgers van de Unie en hun familieleden (PbEU 2004, L 158 en L 229).

      2 Van een getuigschrift als bedoeld in het eerste lid, onderdeel b, wordt het originele exemplaar verstrekt dan
      wel een kopie die is gewaarmerkt door een in Nederland gevestigde notaris, de instelling die het betreffende
      getuigschrift heeft afgegeven, of door de daartoe bevoegde autoriteit in een lidstaat van de Europese Unie of
      andere staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte of Zwitserland.

      3 Het getuigschrift, bedoeld in [artikel 41, onder a, van de wet][ref6], is gesteld, dan
      wel door een beëdigd vertaler vertaald in de taal waarin de getuigschriften in bijlage V van
      [richtlijn nr. 2005/36/EG](32005L0036) van de Raad van de Europese Unie van 7 september 2005
      betreffende de erkenning van beroepskwalificaties (PBEU 2005 L 255) onderscheidenlijk in
      [bijlagen 1 tot en met 5 van de Regeling aanwijzing buitenlandse diploma’s volksgezondheid][ref7] zijn
      weergegeven.


