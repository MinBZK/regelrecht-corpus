  - number: '3'
    text: |-
      1 De commissie heeft tot taak Onze Minister met betrekking tot een in het buitenland genoten opleiding tot een in
      [artikel 3 van de wet][ref1] genoemd beroep of een krachtens [artikel 34 van de wet][ref2] aangewezen beroep van
      advies te dienen over de vraag:

      a. welke buiten het EER-gebied behaalde getuigschriften in aanmerking komen voor aanwijzing krachtens
      [artikel 41, eerste lid, onder a][ref3], dan wel [45, eerste lid, onder a, van de wet][ref4];

      b. of aan een buitenslands gediplomeerde op aanvraag een verklaring als bedoeld in
      [artikel 41, eerste lid, onder b, van de wet][ref5] behoort te worden afgegeven;

      c. of aan een buitenslands gediplomeerde op aanvraag een verklaring als bedoeld in
      [artikel 45, eerste lid, onder b, van de wet][ref6] behoort te worden afgegeven;

      d. of aan de onder b bedoelde verklaring beperkingen als bedoeld in [artikel 41, derde lid, van de wet][ref7]
      moeten worden verbonden;

      e. of sprake is van een bijzonder geval als bedoeld in [artikel 41, vierde lid, van de wet][ref8].

      2 De commissie heeft voorts tot taak Onze Minister van advies te dienen over de vraag of werkervaring als bedoeld
      in [artikel 8, tweede lid, onderdeel c, van de wet][ref9], welke is opgedaan buiten het EER-gebied en buiten
      Zwitserland, kan meetellen bij het vaststellen van het aantal uren waarbinnen de werkzaamheden zijn verricht op het
      terrein van het desbetreffende beroep binnen de individuele gezondheidszorg.

      3 Op verzoek van Onze Minister adviseert de commissie Onze Minister over de vraag of de werkervaring die een
      fysiotherapeut, een gezondheidszorgpsycholoog, een psychotherapeut, een physician assistant, een orthopedagoog-
      generalist of een klinisch technoloog heeft opgedaan buiten Nederland, doch binnen het EER-gebied of in
      Zwitserland, kan meetellen bij het vaststellen van het aantal uren waarbinnen de werkzaamheden zijn verricht op
      het terrein van de fysiotherapie, de gezondheidszorgpsychologie, de psychotherapie, de physician assistant, de
      orthopedagoog-generalist onderscheidenlijk het terrein van de klinisch technoloog.


