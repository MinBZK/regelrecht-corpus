articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. wet: de [Wet op de beroepen in de individuele gezondheidszorg][ref1];

      b. Onze Minister: Onze Minister van Volksgezondheid, Welzijn en Sport;

      c. commissie: de Commissie buitenslands gediplomeerden volksgezondheid;

      d. EER-overeenkomst: de overeenkomst van Oporto van 2 mei 1992 betreffende de Europese Economische Ruimte (*Trb.*
      1992, 132);

      e. EER-gebied: het grondgebied van de staten die partij zijn bij de EER-overeenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0006251
    url: https://wetten.overheid.nl/BWBR0007397/2020-10-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006251
  - number: '2'
    text: |-
      1 De commissie bestaat uit een voorzitter, tevens lid, alsmede uit minimaal twee en maximaal vier leden-deskundigen
      per in [artikel 3 van de wet][ref1] genoemd, onderscheidenlijk krachtens [artikel 34 van de wet][ref2] aangewezen,
      beroep. De leden-deskundigen zijn deskundig ter zake van de opleiding tot het desbetreffende beroep of ter zake van
      de uitoefening van dat beroep.

      2 Onze Minister benoemt en ontslaat de voorzitter en de andere leden van de commissie.

      3 De leden worden voor vier jaar benoemd. Zij zijn herbenoembaar. De zittingsduur van een tussentijds benoemd lid
      eindigt op het tijdstip waarop de zittingsduur van degene in wiens plaats hij is benoemd, eindigt.

      4 De leden, bedoeld in het eerste lid, tweede volzin, worden niet benoemd dan nadat Onze Minister de organisatie
      die naar zijn oordeel voldoende representatief is voor de instellingen die opleiden tot het desbetreffende beroep
      onderscheidenlijk voor de beoefenaren van dat beroep, heeft uitgenodigd binnen een door hem aan te geven termijn
      een voordracht tot benoeming te doen en deze termijn is verstreken.

      5 Onze Minister benoemt voor de voorzitter en voor elk van de andere leden een plaatsvervanger. Zij worden
      door Onze Minister ontslagen. Het derde en vierde lid zijn ten aanzien van de plaatsvervangende leden van
      overeenkomstige toepassing.

      6 Onze Minister kan een of meer ambtenaren aanwijzen als adviserend lid van de commissie.

      7 Onze Minister voorziet in het secretariaat van de commissie.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel34
    url: https://wetten.overheid.nl/BWBR0007397/2020-10-01#Artikel2
