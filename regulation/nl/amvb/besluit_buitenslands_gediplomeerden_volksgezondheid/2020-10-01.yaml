  - number: '4'
    text: |-
      De commissie heeft voorts tot taak Onze Minister met betrekking tot de toepassing van
      [artikel 41, eerste lid, onder c][ref1], dan wel [artikel 45, eerste lid, onder c, van de wet][ref2] van advies te
      dienen over de vraag of voor de beoordeling van de aanvraag tot erkenning van beroepskwalificaties, bedoeld in de
      [Algemene wet erkenning EU-beroepskwalificaties][ref3], een proeve van bekwaamheid dan wel een aanpassingsstage als
      bedoeld in de [Algemene wet erkenning EU-beroepskwalificaties][ref4] vereist is. Indien dat het geval is, adviseert
      de commissie Onze Minister over de inhoud van de af te leggen proeve van bekwaamheid dan wel over de inhoud en de
      duur van de aanpassingsstage.


