  - number: '7'
    text: |-
      1 Bij een aanvrage om een verklaring als bedoeld in [artikel 41, eerste lid, onder b, van de wet][ref1], of
      een verklaring als bedoeld in [artikel 45, eerste lid, onder b, van de wet][ref2] worden de volgende bescheiden
      overgelegd:

      a. het desbetreffende door Onze Minister beschikbaar te stellen aanvraagformulier, dat door de aanvrager is
      ingevuld;

      b. een fotokopie van het deel van een geldig identiteitsbewijs dat de persoonsgegevens bevat;

      c. het getuigschrift inzake het betreffende beroep dat door het in het land van herkomst daartoe bij of krachtens
      de wet bevoegd verklaarde gezag aan de aanvrager is afgegeven;

      d. het op naam gestelde programma van de opleiding tot het betreffende beroep, onderverdeeld in theorie- en
      praktijkvakken, met een omschrijving van die vakken, met opgave van de duur van het onderwijs in die vakken,
      afkomstig van de instelling waarbij de aanvrager het getuigschrift heeft behaald;

      e. indien in het land van herkomst een door een overheidsorgaan of een organisatie van beoefenaren van het
      desbetreffende beroep ingesteld register in stand wordt gehouden: een bewijs van inschrijving van de aanvrager in
      dat register, niet ouder dan drie maanden;

      f. bewijsstukken van eventuele beroepservaring.

      2 De bescheiden, bedoeld in het eerste lid, onder c tot en met f, zijn gesteld, dan wel door een beëdigd vertaler
      vertaald, in het Nederlands of Engels.

      3 De fotokopie, bedoeld in het eerste lid, onder b, dient te zijn gewaarmerkt door de uitgevende instantie of een
      in Nederland gevestigde notaris.

      4 Van de bescheiden, bedoeld in het eerste lid, onder c tot en met e, wordt een origineel verstrekt, dan wel een
      fotokopie die is gewaarmerkt door de instelling die het document heeft afgegeven of een in Nederland gevestigde
      notaris. Van de bescheiden als bedoeld in het eerste lid, onder f, wordt een originele verklaring door de werkgever
      verstrekt, een fotokopie die is gewaarmerkt door een in Nederland gevestigde notaris, danwel, indien geen sprake is
      van een dienstverband, enig ander document op grond waarvan aannemelijk kan worden gemaakt dat de beroepservaring
      is opgedaan.

      5 De minister kan ter vaststelling van de getrouwheid van een fotokopie van een getuigschrift, verzoeken om het
      originele getuigschrift als bedoeld in artikel 7, eerste lid, onderdeel c.


