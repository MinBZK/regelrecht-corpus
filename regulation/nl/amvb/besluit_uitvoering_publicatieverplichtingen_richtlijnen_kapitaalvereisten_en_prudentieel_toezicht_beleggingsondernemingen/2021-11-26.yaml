    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Financiën van 26 juni 2014, FM/2014/1019 M, directie Financiële Markten,
    gedaan mede namens Onze Minister van Veiligheid en Justitie;

    Gelet op artikel 3:74a, derde lid, van de Wet op het financieel toezicht en de artikelen 391, vijfde lid, en 417
    van Boek 2 van het Burgerlijk Wetboek;

    De Afdeling advisering van de Raad van State gehoord (advies van 25 juli 2014, nr. W06.14.0209/III);

    Gezien het nader rapport van Onze Minister van Financiën van 5 september 2014, FM/2014/1241 U, directie Financiële
    Markten, uitgebracht mede namens Onze Minister van Veiligheid en Justitie;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0035575/2021-11-26#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder: - *bank:* een bank als bedoeld in
      [artikel 1:1 van de Wet op het financieel toezicht][ref1];
        - *beleggingsonderneming in de zin van de richtlijn prudentieel toezicht beleggingsondernemingen:* een
      beleggingsonderneming met zetel in Nederland waaraan een vergunning als bedoeld in [artikel 2:96 van de wet][ref2]
      is verleend, niet zijnde een beleggingsonderneming onder de verordening kapitaalvereisten en niet zijnde een
      kleine en niet-verweven beleggingsonderneming als bedoeld in artikel 12, eerste lid, van de verordening prudentiële
      vereisten voor beleggingsondernemingen;
        - *beleggingsonderneming onder de verordening kapitaalvereisten:* een beleggingsonderneming met zetel in Nederland
      waaraan een vergunning als bedoeld in [artikel 2:96 van de wet][ref3] is verleend en die op grond van artikel 1,
      tweede lid, onderdeel a of b, of vijfde lid, van de verordening prudentiële vereisten voor beleggingsondernemingen
      de vereisten van de verordening kapitaalvereisten toepast, of ten aanzien waarvan de Nederlandsche Bank een besluit
      als bedoeld in [artikel 3:4a, eerste lid, van de wet][ref4] heeft genomen;
        - *bijkantoor:* een bijkantoor als bedoeld in artikel 4, eerste lid, punt 17, van de verordening kapitaalvereisten;
        - *richtlijn kapitaalvereisten:* [richtlijn 2013/36](32013L0036)/EU van het Europees Parlement en de Raad
      van 26 juni 2103 betreffende toegang tot het bedrijf van kredietinstellingen en het prudentieel toezicht op
      kredietinstellingen en beleggingsondernemingen, tot wijziging van [Richtlijn 2002/87/EG](32002L0087) en tot
      intrekking van de [Richtlijnen 2006/48/EG](32006L0048) en [2006/49/EG](32006L0049) (PbEU 2013, L 176);
        - *richtlijn prudentieel toezicht beleggingsondernemingen:* [richtlijn (EU) 2019/2034](32019L2034) van het Europees
      Parlement en de Raad van 27 november 2019 betreffende het prudentiële toezicht op beleggingsondernemingen en tot
      wijziging van [Richtlijnen 2002/87/EG](32002L0087), [2009/65/EG](32009L0065), [2011/61](32011L0061)/EU, [2013/36]
      (32013L0036)/EU, [2014/59](32014L0059)/EU en [2014/65](32014L0065)/EU (PbEU 2019, L 314);
        - *verordening kapitaalvereisten:* verordening (EU) nr. 575/2013 van het Europees Parlement en de Raad van
      26 juni 2013 betreffende prudentiële vereisten voor kredietinstellingen en beleggingsondernemingen en tot
      wijziging van Verordening (EU) nr. 648/2012 (PbEU 2013, L 176); - *verordening prudentiële vereisten voor
      beleggingsondernemingen:* [verordening (EU) 2019/2033](32033R2019) van het Europees Parlement en de Raad van
      27 november 2019 betreffende prudentiële vereisten voor beleggingsondernemingen en tot wijziging van Verordeningen
      (EU) nr. 1093/2010, (EU) nr. 575/2013, (EU) nr. 600/2014 en (EU) nr. 806/2014 (PbEU 2019, L 314);
        - *wet:* [Wet op het financieel toezicht][ref5].


