  - number: '2'
    text: |-
      Dit besluit is van toepassing op banken met zetel in Nederland, op beleggingsondernemingen onder de
      verordening kapitaalvereisten en op beleggingsondernemingen in de zin van de richtlijn prudentieel toezicht
      beleggingsondernemingen.
    url: https://wetten.overheid.nl/BWBR0035575/2021-11-26#Artikel2
  - number: '3.1'
    text: |-
      Een bank of beleggingsonderneming onder de verordening kapitaalvereisten doet op geconsolideerde basis mededeling
      over de volgende informatie, voor elke staat waarin zij of haar dochterondernemingen een vestiging hebben:
    url: https://wetten.overheid.nl/BWBR0035575/2021-11-26#Artikel3
  - number: 3.1.a
    text: de naam, aard van de activiteiten en geografische locatie;
    url: https://wetten.overheid.nl/BWBR0035575/2021-11-26#Artikel3
  - number: 3.1.b
    text: de omzet;
    url: https://wetten.overheid.nl/BWBR0035575/2021-11-26#Artikel3
  - number: 3.1.c
    text: het gemiddelde aantal werknemers, uitgedrukt in voltijdequivalenten;
    url: https://wetten.overheid.nl/BWBR0035575/2021-11-26#Artikel3
  - number: 3.1.d
    text: de winst of het verlies voor belasting;
    url: https://wetten.overheid.nl/BWBR0035575/2021-11-26#Artikel3
  - number: 3.1.e
    text: de belasting over winst of verlies; en
    url: https://wetten.overheid.nl/BWBR0035575/2021-11-26#Artikel3
  - number: 3.1.f
    text: de ontvangen overheidssubsidies.
    url: https://wetten.overheid.nl/BWBR0035575/2021-11-26#Artikel3
  - number: '3.2'
    text: |-
      De in het eerste lid bedoelde informatie wordt onderzocht overeenkomstig
      [artikel 393, derde lid, van Boek 2 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0035575/2021-11-26#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '3.3'
    text: |-
      De in het eerste lid bedoelde informatie wordt, indien mogelijk, gelijktijdig met de jaarrekening van de
      onderneming of de geconsolideerde jaarrekening van de onderneming openbaar gemaakt. Indien de informatie niet in de
      jaarrekening wordt opgenomen, maakt de onderneming bekend waar en wanneer de informatie kan worden gevonden.
    url: https://wetten.overheid.nl/BWBR0035575/2021-11-26#Artikel3
  - number: '3.4'
    text: Dit artikel is van toepassing op de boekjaren die aanvangen op of na 1 januari 2014.
    url: https://wetten.overheid.nl/BWBR0035575/2021-11-26#Artikel3
  - number: '3.5'
    text: |-
      Het eerste tot en met derde lid zijn van overeenkomstige toepassing op beleggingsondernemingen in de zin van de
      richtlijn prudentieel toezicht beleggingsondernemingen, met dien verstande dat voor de toepassing van het eerste
      lid voor «dochterondernemingen» wordt gelezen «dochterondernemingen die een financiële instelling zijn als bedoeld
      in [artikel 1:1 van de wet][ref1]».


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0035575/2021-11-26#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
  - number: '4.1'
    text: |-
      Een bank of beleggingsonderneming onder de verordening kapitaalvereisten maakt, in aanvulling op
      [artikel 3, eerste lid][ref1], de in de onderdelen a, b en c van dat lid bedoelde informatie over het laatst
      afgesloten boekjaar binnen vier weken na de inwerkingtreding van dit besluit openbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0035575#Artikel3
    url: https://wetten.overheid.nl/BWBR0035575/2021-11-26#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0035575
        artikel: '3'
  - number: '4.2'
    text: |-
      Een bank of beleggingsonderneming onder de verordening kapitaalvereisten die door de Financial Stability Board
      is aangemerkt als mondiaal systeemrelevant, overlegt binnen vier weken na de inwerkingtreding van dit besluit de
      informatie, bedoeld in [artikel 3, eerste lid, onderdelen d, e en f][ref1], over het laatst afgesloten boekjaar op
      vertrouwelijke basis aan de Europese Commissie en aan de Nederlandsche Bank.


      [ref1]: https://wetten.overheid.nl/BWBR0035575#Artikel3
    url: https://wetten.overheid.nl/BWBR0035575/2021-11-26#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0035575
        artikel: '3'
  - number: '4.3'
    text: |-
      [Artikel 393 van Boek 2 van het Burgerlijk Wetboek][ref1] is niet van toepassing op de informatie, bedoeld in het
      eerste en tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0035575/2021-11-26#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '5.1'
    text: |-
      Een bank of beleggingsonderneming onder de verordening kapitaalvereisten maakt in haar bestuursverslag als een
      van de belangrijkste indicatoren haar rendement op activa bekend, berekend als de nettowinst gedeeld door het
      balanstotaal.
    url: https://wetten.overheid.nl/BWBR0035575/2021-11-26#Artikel5
  - number: '5.2'
    text: |-
      Dit artikel is van toepassing op de bestuursverslagen die worden opgesteld over de boekjaren die aanvangen op of na
      1 januari 2014.
    url: https://wetten.overheid.nl/BWBR0035575/2021-11-26#Artikel5
  - number: '6'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin het wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0035575/2021-11-26#Artikel6
  - number: '7'
    text: |-
      Dit besluit wordt aangehaald als: Besluit uitvoering publicatieverplichtingen richtlijnen kapitaalvereisten en
      prudentieel toezicht beleggingsondernemingen.
    url: https://wetten.overheid.nl/BWBR0035575/2021-11-26#Artikel7
