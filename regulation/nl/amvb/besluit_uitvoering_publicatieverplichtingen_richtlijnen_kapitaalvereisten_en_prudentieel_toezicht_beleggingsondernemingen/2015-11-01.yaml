  - number: '5'
    text: |-
      1 Een bank of beleggingsonderneming maakt in haar bestuursverslag als een van de belangrijkste indicatoren haar
      rendement op activa bekend, berekend als de nettowinst gedeeld door het balanstotaal.

      2 Dit artikel is van toepassing op de bestuursverslagen die worden opgesteld over de boekjaren die aanvangen op of
      na 1 januari 2014.
    url: https://wetten.overheid.nl/BWBR0035575/2015-11-01#Artikel5
