articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

        - *bank:* een bank als bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref1];
        - *beleggingsonderneming:* een beleggingsonderneming als bedoeld in artikel 4, eerste lid, punt 2, van de
      verordening kapitaalvereisten;
        - *bijkantoor:* een bijkantoor als bedoeld in artikel 4, eerste lid, punt 17, van de verordening kapitaalvereisten;
        - *richtlijn kapitaalvereisten:* [richtlijn 2013/36](32013L0036)/EU van het Europees Parlement en de Raad
      van 26 juni 2103 betreffende toegang tot het bedrijf van kredietinstellingen en het prudentieel toezicht op
      kredietinstellingen en beleggingsondernemingen, tot wijziging van [Richtlijn 2002/87/EG](32002L0087) en tot
      intrekking van de [Richtlijnen 2006/48/EG](32006L0048) en [2006/49/EG](32006L0049) (PbEU 2013, L 176);
        - *verordening kapitaalvereisten:* verordening (EU) nr. 575/2013 van het Europees Parlement en de Raad van 26 juni
      2013 betreffende prudentiële vereisten voor kredietinstellingen en beleggingsondernemingen en tot wijziging van
      Verordening (EU) nr. 648/2012 (PbEU 2013, L 176).


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel11
    url: https://wetten.overheid.nl/BWBR0035575/2015-11-01#Artikel1
