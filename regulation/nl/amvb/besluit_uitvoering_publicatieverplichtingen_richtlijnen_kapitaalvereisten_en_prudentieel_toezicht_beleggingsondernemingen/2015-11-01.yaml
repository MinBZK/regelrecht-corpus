  - number: '2'
    text: Dit besluit is van toepassing op banken en beleggingsondernemingen met zetel in Nederland.
    url: https://wetten.overheid.nl/BWBR0035575/2015-11-01#Artikel2
  - number: '3'
    text: |-
      1 Een bank of beleggingsonderneming doet op geconsolideerde basis mededeling over de volgende informatie, voor elke
      staat waarin zij of haar dochterondernemingen een vestiging hebben:

      a. de naam, aard van de activiteiten en geografische locatie;

      b. de omzet;

      c. het gemiddelde aantal werknemers, uitgedrukt in voltijdequivalenten;

      d. de winst of het verlies voor belasting;

      e. de belasting over winst of verlies; en

      f. de ontvangen overheidssubsidies.

      2 De in het eerste lid bedoelde informatie wordt onderzocht overeenkomstig
      [artikel 393, derde lid, van Boek 2 van het Burgerlijk Wetboek][ref1].

      3 De in het eerste lid bedoelde informatie wordt, indien mogelijk, gelijktijdig met de jaarrekening van de
      onderneming of de geconsolideerde jaarrekening van de onderneming openbaar gemaakt. Indien de informatie niet in de
      jaarrekening wordt opgenomen, maakt de onderneming bekend waar en wanneer de informatie kan worden gevonden.

      4 Dit artikel is van toepassing op de boekjaren die aanvangen op of na 1 januari 2014.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0035575/2015-11-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '4'
    text: |-
      1 Een bank of beleggingsonderneming maakt, in aanvulling op [artikel 3, eerste lid][ref1], de in de onderdelen a,
      b en c van dat lid bedoelde informatie over het laatst afgesloten boekjaar binnen vier weken na de inwerkingtreding
      van dit besluit openbaar.

      2 Een bank of beleggingsonderneming die door de Financial Stability Board is aangemerkt als mondiaal
      systeemrelevant, overlegt binnen vier weken na de inwerkingtreding van dit besluit de informatie, bedoeld in
      [artikel 3, eerste lid, onderdelen d, e en f][ref2], over het laatst afgesloten boekjaar op vertrouwelijke basis
      aan de Europese Commissie en aan de Nederlandsche Bank.

      3 [Artikel 393 van Boek 2 van het Burgerlijk Wetboek][ref3] is niet van toepassing op de informatie, bedoeld in het
      eerste en tweede lid.


