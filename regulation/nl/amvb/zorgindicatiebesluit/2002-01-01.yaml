---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: zorgindicatiebesluit
regulatory_layer: AMVB
publication_date: '2005-11-22'
valid_from: '2002-01-01'
bwb_id: BWBR0008946
url: https://wetten.overheid.nl/BWBR0008946/2002-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Volksgezondheid, Welzijn en Sport van 11 juli 1997, kenmerk DBO/
    PBO/971311;

    Gelet op de artikelen 9a, eerste en tweede lid, 9b, tweede lid, en artikel 11 van de Algemene Wet Bijzondere
    Ziektekosten, en artikel 60, tweede en derde lid, van de Wet bijzondere opnemingen in psychiatrische ziekenhuizen;

    De Raad van State gehoord (advies van 24 september 1997, nr. W.13.97.0470);

    Gezien het nader rapport van de Staatssecretaris van Volksgezondheid, Welzijn en Sport van 30 september 1997,
    kenmerk DBO 97975;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0008946/2002-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0008946/2002-01-01#Artikel1
  - number: 1.a
    text: |-
      de AWBZ: de [Algemene Wet Bijzondere Ziektekosten][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002614
    url: https://wetten.overheid.nl/BWBR0008946/2002-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002614
  - number: 1.b
    text: 'indicatieorgaan: een indicatieorgaan als bedoeld in artikel 9*a* van de AWBZ;'
    url: https://wetten.overheid.nl/BWBR0008946/2002-01-01#Artikel1
  - number: 1.c
    text: 'zorgvrager: degene ten behoeve van wie een aanvraag om een indicatiebesluit is ingediend;'
    url: https://wetten.overheid.nl/BWBR0008946/2002-01-01#Artikel1
  - number: 1.d
    text: |-
      indicatiebesluit: het besluit van een indicatieorgaan waarbij beoordeeld wordt of e+in welke omvang een zorgvrager
      in aanmerking komt voor een of meer vormen van zorg als bedoeld in [artikel 2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008946#Artikel2
    url: https://wetten.overheid.nl/BWBR0008946/2002-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0008946
        artikel: '2'
        paragraaf: '1'
  - number: '2'
    text: |-
      Als vormen van zorg als bedoeld in [artikel 9a, eerste lid, van de AWBZ][ref1] worden aangewezen de
      zorg, bedoeld in de [artikelen 11 tot en met 14][ref2], [15, aanhef en onder a en b][ref3], [16][ref4] en
      [21 tot en met 25 van het Besluit zorgaanspraken bijzondere ziektekostenverzekering][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel9a
      [ref2]: https://wetten.overheid.nl/BWBR0005283#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0005283#Artikel15
      [ref4]: https://wetten.overheid.nl/BWBR0005283#Artikel16
      [ref5]: https://wetten.overheid.nl/BWBR0005283#Artikel21
    url: https://wetten.overheid.nl/BWBR0008946/2002-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: 9a
      - id: ref2
        bwb_id: BWBR0005283
        artikel: '11'
      - id: ref3
        bwb_id: BWBR0005283
        artikel: '15'
      - id: ref4
        bwb_id: BWBR0005283
        artikel: '16'
      - id: ref5
        bwb_id: BWBR0005283
        artikel: '21'
  - number: '3'
    text: |-
      Het indicatieorgaan wordt, voor zover het betreft opneming en verder
      verblijf in een verpleeg- of zwakzinnigeninrichting als bedoeld in
      [artikel 1, eerste lid, onder h, van de Wet bijzondere opnemingen in psychiatrische ziekenhuizen][ref1], aangewezen
      als commissie als bedoeld in [artikel 60, derde lid, van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005700#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005700#Artikel60
    url: https://wetten.overheid.nl/BWBR0008946/2002-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005700
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0005700
        artikel: '60'
  - number: '4.1'
    text: Het indicatieorgaan bestaat uit ten minste vijf leden.
    url: https://wetten.overheid.nl/BWBR0008946/2002-01-01#Artikel4
  - number: '4.2'
    text: |-
      In ieder geval worden de navolgende, in het werkgebied van het indicatieorgaan werkzame, organisaties in de
      gelegenheid gesteld telkens ten minste één persoon aan te wijzen als lid van het indicatieorgaan:
    url: https://wetten.overheid.nl/BWBR0008946/2002-01-01#Artikel4
  - number: 4.2.1°
    text: patiënten/consumentenorganisaties;
    url: https://wetten.overheid.nl/BWBR0008946/2002-01-01#Artikel4
  - number: 4.2.2°
    text: |-
      instellingen die zorg verlenen als bedoeld in [artikel 2][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008946#Artikel2
    url: https://wetten.overheid.nl/BWBR0008946/2002-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0008946
        artikel: '2'
        paragraaf: '1'
  - number: 4.2.3°
    text: huisartsenorganisaties;
    url: https://wetten.overheid.nl/BWBR0008946/2002-01-01#Artikel4
  - number: 4.2.4°
    text: uitvoeringsorganen.
    url: https://wetten.overheid.nl/BWBR0008946/2002-01-01#Artikel4
  - number: '4.3'
    text: |-
      De gemeente of gemeenten die in het werkgebied van het indicatieorgaan gelegen zijn, wijzen een persoon aan als lid
      van het indicatieorgaan.
    url: https://wetten.overheid.nl/BWBR0008946/2002-01-01#Artikel4
  - number: '5.1'
    text: |-
      Bij of onmiddellijk na het indienen van de aanvraag om een indicatiebesluit gaat het indicatieorgaan na of de
      zorgvrager toestemming geeft tot het zonodig raadplegen van behandelend artsen en het gebruik maken van bij hen
      aanwezige medische gegevens en maakt hier schriftelijk melding van.
    url: https://wetten.overheid.nl/BWBR0008946/2002-01-01#Artikel5
  - number: '5.2'
    text: |-
      Indien de aanvraag door een vertegenwoordiger van de zorgvrager wordt gedaan, wordt nagegaan wat de reden daarvan
      is en wordt die reden schriftelijk vermeld.
    url: https://wetten.overheid.nl/BWBR0008946/2002-01-01#Artikel5
  - number: '6'
    text: 'Voor zover dit voor het nemen van een indicatiebesluit van belang is, wordt onderzoek verricht naar:'
    url: https://wetten.overheid.nl/BWBR0008946/2002-01-01#Artikel6
  - number: 6.a
    text: de algemene gezondheidstoestand van de zorgvrager;
    url: https://wetten.overheid.nl/BWBR0008946/2002-01-01#Artikel6
  - number: 6.b
    text: |-
      de beperkingen die de zorgvrager in zijn lichamelijk, zintuiglijk of verstandelijk functioneren ondervindt als
      gevolg van ziekte of een lichamelijke, zintuiglijke of verstandelijke beperking;
    url: https://wetten.overheid.nl/BWBR0008946/2002-01-01#Artikel6
  - number: 6.c
    text: de woning en de woonomgeving van de zorgvrager;
    url: https://wetten.overheid.nl/BWBR0008946/2002-01-01#Artikel6
  - number: 6.d
    text: het psychisch en sociaal functioneren van de zorgvrager;
    url: https://wetten.overheid.nl/BWBR0008946/2002-01-01#Artikel6
  - number: 6.e
    text: de sociale omstandigheden van de zorgvrager;
    url: https://wetten.overheid.nl/BWBR0008946/2002-01-01#Artikel6
  - number: 6.f
    text: |-
      de aard en de omvang van de aan de zorgvrager geboden professionele en niet-professionele hulp en zorg en de
      mogelijkheden tot continuering en uitbreiding daarvan.
    url: https://wetten.overheid.nl/BWBR0008946/2002-01-01#Artikel6
  - number: '7.1'
    text: |-
      Bij het onderzoek wordt zoveel mogelijk gebruik gemaakt van gegevens die bij de aanvraag zijn gevoegd of tijdens
      het onderzoek ter beschikking zijn gesteld.
    url: https://wetten.overheid.nl/BWBR0008946/2002-01-01#Artikel7
  - number: '7.2'
    text: |-
      Indien daartoe aanleiding bestaat, worden de behandelende artsen van de zorgvrager tijdens het onderzoek
      geraadpleegd.
    url: https://wetten.overheid.nl/BWBR0008946/2002-01-01#Artikel7
  - number: '7.3'
    text: |-
      Het gebruik maken van gegevens als bedoeld in het eerste lid en het raadplegen van behandelend artsen als bedoeld
      in het tweede lid geschiedt slechts met toestemming van de zorgvrager.
    url: https://wetten.overheid.nl/BWBR0008946/2002-01-01#Artikel7
  - number: '8'
    text: |-
      Het onderzoek wordt verricht door personen dan wel organisaties die over voldoende deskundigheid beschikken om de
      aanvraag om een indicatiebesluit te kunnen beoordelen.
    url: https://wetten.overheid.nl/BWBR0008946/2002-01-01#Artikel8
  - number: '9.1'
    text: |-
      Indien uit de aanvraag blijkt dat de zorgvrager langdurige opname gedurende de dag en de nacht of langdurige
      intensieve zorg thuis wenst, dan wel na het indienen van de aanvraag blijkt dat redelijkerwijs te verwachten is
      dat een indicatiebesluit zal worden genomen, waaruit blijkt dat een zorgvrager voor zodanige opname of zorg in
      aanmerking komt, wordt de aanvraag onderzocht door een team van deskundigen.
    url: https://wetten.overheid.nl/BWBR0008946/2002-01-01#Artikel9
  - number: '9.2'
    text: |-
      In een team als bedoeld in het eerste lid is, voor zover dat voor de beoordeling van de aanvraag van
      belang kan zijn, deskundigheid aanwezig op de terreinen van de zorg, bedoeld in artikel 2, alsmede op
      de terreinen van woningaanpassing en voorzieningen die op grond van de [Welzijnswet 1994][ref1] en de
      [Wet voorzieningen gehandicapten][ref2] verstrekt kunnen worden.


      [ref1]: https://wetten.overheid.nl/BWBR0006705
      [ref2]: https://wetten.overheid.nl/BWBR0006169
    url: https://wetten.overheid.nl/BWBR0008946/2002-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006705
      - id: ref2
        bwb_id: BWBR0006169
  - number: '9.3'
    text: |-
      Indien uit de aanvraag tevens blijkt dat de zorgvrager zorg
      wenst als bedoeld in de [artikelen 11 tot en met 13][ref1] en
      [21 tot en met 25 van het Besluit zorgaanspraken bijzondere ziektekostenverzekering][ref2] of indien na het
      indienen van de aanvraag blijkt dat een zorgvrager voor zodanige zorg in aanmerking komt, wordt in afwijking van
      het eerste en tweede lid de aanvraag onderzocht door de op grond van artikel 9a, eerste lid, aangewezen instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0005283#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0005283#Artikel21
    url: https://wetten.overheid.nl/BWBR0008946/2002-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005283
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0005283
        artikel: '21'
  - number: 9a.1
    text: |-
      Onze Minister wijst op aanvraag voor ten hoogste drie jaar een landelijk werkende instelling aan die beschikt over
      specifieke deskundigheid op het gebied van de gehandicaptenzorg en welke instelling uitsluitend tot doel heeft om
      alle in Nederland werkzame indicatieorganen kosteloos te adviseren over aanvragen als bedoeld in artikel 9, derde
      lid.
    url: https://wetten.overheid.nl/BWBR0008946/2002-01-01#Artikel9a
  - number: 9a.2
    text: 'Onze Minister kan de aanwijzing intrekken indien de betrokken instelling:'
    url: https://wetten.overheid.nl/BWBR0008946/2002-01-01#Artikel9a
  - number: 9a.2.a
    text: |-
      haar taak de indicatieorganen kosteloos te adviseren over aanvragen als bedoeld in artikel 9, derde lid, niet naar
      behoren vervult;
    url: https://wetten.overheid.nl/BWBR0008946/2002-01-01#Artikel9a
  - number: 9a.2.b
    text: daarom verzoekt.
    url: https://wetten.overheid.nl/BWBR0008946/2002-01-01#Artikel9a
  - number: '10'
    text: |-
      Onderzoek als bedoeld in deze paragraaf kan achterwege blijven, indien spoedige verlening van zorg redelijkerwijs
      noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0008946/2002-01-01#Artikel10
  - number: '11.1'
    text: |-
      Het indicatieorgaan stelt een of meer protocollen vast met betrekking tot de door het indicatieorgaan te volgen
      procedure bij een aanvraag om een indicatiebesluit, waaronder het terzake te verrichten onderzoek.
    url: https://wetten.overheid.nl/BWBR0008946/2002-01-01#Artikel11
  - number: '11.2'
    text: 'In protocollen als bedoeld in het eerste lid:'
    url: https://wetten.overheid.nl/BWBR0008946/2002-01-01#Artikel11
  - number: 11.2.a
    text: wordt aangegeven welke deskundigheid bij de beoordeling van een aanvraag om een indicatiebesluit betrokken wordt,
    url: https://wetten.overheid.nl/BWBR0008946/2002-01-01#Artikel11
  - number: 11.2.b
    text: |-
      wordt aangegeven welke zorginhoudelijke criteria worden gehanteerd bij de beoordeling van een aanvraag om een
      indicatiebesluit,
    url: https://wetten.overheid.nl/BWBR0008946/2002-01-01#Artikel11
  - number: 11.2.c
    text: |-
      wordt een onderscheid gemaakt tussen aanvragen waarop direct een indicatiebesluit kan volgen, aanvragen waarop met
      spoed een indicatiebesluit moet volgen, aanvragen waarbij onderzoek plaatsvindt door een team van deskundigen en
      overige aanvragen, en
    url: https://wetten.overheid.nl/BWBR0008946/2002-01-01#Artikel11
  - number: 11.2.d
    text: worden termijnen opgenomen waarbinnen de bij de verschillende aanvragen behorende onderzoeken verricht worden.
    url: https://wetten.overheid.nl/BWBR0008946/2002-01-01#Artikel11
  - number: '11.3'
    text: |-
      Voorts waarborgen protocollen dat ten behoeve van aanvragen om een indicatiebesluit een of meerdere formulieren
      worden vastgesteld, tijdens het onderzoek een analyse van de zorgbehoefte van de zorgvrager wordt opgesteld en
      bezien wordt of er meerdere mogelijkheden zijn om in die behoefte te voorzien. In ieder geval wordt bezien of aan
      de zorgbehoefte, al dan niet in combinatie met andere zorg en hulp, doelmatig voldaan kan worden door het verlenen
      van extramurale zorg.
    url: https://wetten.overheid.nl/BWBR0008946/2002-01-01#Artikel11
  - number: '11.4'
    text: |-
      Onze Minister kan bij ministeriële regeling nadere regels stellen met betrekking tot een door een indicatieorgaan
      vast te stellen protocol en een door een indicatieorgaan vast te stellen formulier als bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0008946/2002-01-01#Artikel11
  - number: '12.1'
    text: Het indicatieorgaan stelt binnen zes weken nadat de aanvraag is ingediend een indicatiebesluit vast.
    url: https://wetten.overheid.nl/BWBR0008946/2002-01-01#Artikel12
  - number: '12.2'
    text: |-
      In afwijking van het eerste lid stelt het indicatieorgaan in situaties waarin spoedige verlening van zorg
      redelijkerwijs noodzakelijk is, binnen twee weken nadat de aanvraag is ingediend, een indicatiebesluit vast.
    url: https://wetten.overheid.nl/BWBR0008946/2002-01-01#Artikel12
  - number: '13.1'
    text: |-
      Indien een indicatieorgaan een indicatiebesluit neemt, waaruit blijkt dat de zorgvrager in aanmerking komt voor een
      of meer vormen van zorg als bedoeld in [artikel 2][ref1], geeft het:


      [ref1]: https://wetten.overheid.nl/BWBR0008946#Artikel2
    url: https://wetten.overheid.nl/BWBR0008946/2002-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0008946
        artikel: '2'
        paragraaf: '1'
  - number: 13.1.a
    text: de omvang waarin hij in aanmerking komt voor die zorg zo mogelijk in termen van bandbreedtes aan,
    url: https://wetten.overheid.nl/BWBR0008946/2002-01-01#Artikel13
  - number: 13.1.b
    text: de urgentie waarmee die zorg verleend moet worden aan, en
    url: https://wetten.overheid.nl/BWBR0008946/2002-01-01#Artikel13
  - number: 13.1.c
    text: |-
      in de situatie dat uit dat besluit blijkt dat de zorgvrager voor meer dan één vorm van zorg als bedoeld in
      [artikel 2][ref1] in aanmerking komt, zo mogelijk aan voor welke van die vormen van zorg naar zijn oordeel de
      zorgvrager het meest in aanmerking komt.


      [ref1]: https://wetten.overheid.nl/BWBR0008946#Artikel2
    url: https://wetten.overheid.nl/BWBR0008946/2002-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0008946
        artikel: '2'
        paragraaf: '1'
  - number: '13.2'
    text: |-
      Indien het indicatieorgaan van oordeel is dat andere professionele zorg of hulp dan de zorg, bedoeld in
      [artikel 2][ref1], noodzakelijk, dan wel mede noodzakelijk is, geeft het indicatieorgaan zo mogelijk dat en vanuit
      welke categorie van organisaties of personen die zorg of hulp naar zijn oordeel verleend kan worden aan.


      [ref1]: https://wetten.overheid.nl/BWBR0008946#Artikel2
    url: https://wetten.overheid.nl/BWBR0008946/2002-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0008946
        artikel: '2'
        paragraaf: '1'
  - number: '14'
    text: 'Het nemen van indicatiebesluiten waaruit blijkt dat een zorgvrager in aanmerking komt voor:'
    url: https://wetten.overheid.nl/BWBR0008946/2002-01-01#Artikel14
  - number: 14.a
    text: |-
      langdurige opneming gedurende de dag en de nacht of langdurige intensieve zorg thuis, wordt niet gemandateerd aan
      instellingen die zodanige zorg verlenen;
    url: https://wetten.overheid.nl/BWBR0008946/2002-01-01#Artikel14
  - number: 14.b
    text: |-
      zorg als bedoeld in de [artikelen 11 tot en met 13][ref1] en
      [21 tot en met 25 van het Besluit zorgaanspraken bijzondere ziektekostenverzekering][ref2], wordt niet
      gemandateerd.


      [ref1]: https://wetten.overheid.nl/BWBR0005283#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0005283#Artikel21
    url: https://wetten.overheid.nl/BWBR0008946/2002-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0005283
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0005283
        artikel: '21'
  - number: '15.1'
    text: |-
      In het indicatiebesluit wordt de geldigheidsduur ervan vermeld. De geldigheidsduur van een indicatiebesluit is
      niet onbepaald, tenzij het indicatieorgaan besluit dat zorg is aangewezen die gepaard gaat met langdurige opneming
      gedurende de dag en de nacht.
    url: https://wetten.overheid.nl/BWBR0008946/2002-01-01#Artikel15
  - number: '15.2'
    text: |-
      Indien om reden dat spoedige verlening van zorg redelijkerwijs noodzakelijk is, onderzoek als bedoeld in
      [paragraaf 4][ref1] achterwege is gebleven, stelt het indicatieorgaan de geldigheidsduur van het besluit op ten
      hoogste vier weken.


      [ref1]: https://wetten.overheid.nl/BWBR0008946#Paragraaf4
    url: https://wetten.overheid.nl/BWBR0008946/2002-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0008946
        paragraaf: '4'
  - number: '16'
    text: |-
      Een uitvoeringsorgaan kan in situaties waarin onmiddelijke verlening van zorg als bedoeld in [artikel 2][ref1]
      redelijkerwijs noodzakelijk is, besluiten dat een verzekerde zijn aanspraak op zorg gedurende ten hoogste twee
      weken tot gelding kan brengen, zonder dat hij beschikt over een indicatiebesluit, waaruit blijkt dat hij op
      zodanige zorg is aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0008946#Artikel2
    url: https://wetten.overheid.nl/BWBR0008946/2002-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0008946
        artikel: '2'
        paragraaf: '1'
  - number: 16a
    text: |-
      Het indicatieorgaan draagt er zorg voor dat gedurende de geldigheid van het indicatiebesluit de gegevens die aan
      het indicatiebesluit ten grondslag hebben gelegen, worden bewaard en houdt de gegevens die voor een mogelijk nieuw
      indicatiebesluit van belang zijn, zoals naam, adres, woonplaats of verblijfplaats, burgerlijke staat en wettelijke
      vertegenwoordiging, zo veel mogelijk actueel.
    url: https://wetten.overheid.nl/BWBR0008946/2002-01-01#Artikel16a
  - number: '17.1'
    text: |-
      Voordat het indicatieorgaan een indicatiebesluit neemt, waaruit blijkt dat opneming en verder verblijf in een
      instelling als bedoeld in [artikel 3][ref1] noodzakelijk wordt geoordeeld, wordt de zorgvrager, tenzij gebleken is
      dat hij de nodige bereidheid bezit tot zodanige opneming en verder verblijf, schriftelijk en mondeling medegedeeld
      dat hij bedenkingen kan inbrengen tegen zodanige opneming en verder verblijf.


      [ref1]: https://wetten.overheid.nl/BWBR0008946#Artikel3
    url: https://wetten.overheid.nl/BWBR0008946/2002-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0008946
        artikel: '3'
        paragraaf: '1'
  - number: '17.2'
    text: |-
      Indien een besluit als bedoeld in het eerste lid wordt genomen, wordt, tenzij gebleken is dat de zorgvrager de
      nodige bereidheid bezit tot zodanige opneming en verder verblijf, in dat besluit melding gemaakt van:
    url: https://wetten.overheid.nl/BWBR0008946/2002-01-01#Artikel17
  - number: 17.2.a
    text: de aard van de stoornis van de geestvermogens;
    url: https://wetten.overheid.nl/BWBR0008946/2002-01-01#Artikel17
  - number: 17.2.b
    text: |-
      de omstandigheden die meebrengen dat hij zich ten gevolge van die stoornis niet buiten een een inrichting als
      bedoeld in [artikel 3][ref1] kan handhaven;


      [ref1]: https://wetten.overheid.nl/BWBR0008946#Artikel3
    url: https://wetten.overheid.nl/BWBR0008946/2002-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0008946
        artikel: '3'
        paragraaf: '1'
  - number: 17.2.c
    text: |-
      de wijze waarop aan hem is meegedeeld dat hij bedenkingen kan inbrengen tegen zodanige opneming en verder verblijf
      en diens reactie daarop.
    url: https://wetten.overheid.nl/BWBR0008946/2002-01-01#Artikel17
  - number: '18.1'
    text: 'Eenmaal per jaar zendt het indicatieorgaan Onze Minister een verslag, waaruit blijkt:'
    url: https://wetten.overheid.nl/BWBR0008946/2002-01-01#Artikel18
  - number: 18.1.a
    text: het aantal bij het indicatieorgaan ingediende aanvragen in het daaraan voorafgaande jaar,
    url: https://wetten.overheid.nl/BWBR0008946/2002-01-01#Artikel18
  - number: 18.1.b
    text: met betrekking tot welke vorm van zorg deze aanvragen zijn ingediend, en
    url: https://wetten.overheid.nl/BWBR0008946/2002-01-01#Artikel18
  - number: 18.1.c
    text: de met betrekking tot deze aanvragen genomen indicatiebesluiten.
    url: https://wetten.overheid.nl/BWBR0008946/2002-01-01#Artikel18
  - number: '18.2'
    text: |-
      Het indicatieorgaan zendt binnen een maand na vaststelling van een protocol als bedoeld in [artikel 11][ref1] een
      afschrift daarvan aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0008946#Artikel11
    url: https://wetten.overheid.nl/BWBR0008946/2002-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0008946
        artikel: '11'
        paragraaf: '5'
  - number: '19'
    text: Het Besluit indicatiebeoordeling verpleging en verzorging wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0008946/2002-01-01#Artikel19
  - number: '20.1'
    text: 'Dit besluit is niet van toepassing ten aanzien van diegenen die:'
    url: https://wetten.overheid.nl/BWBR0008946/2002-01-01#Artikel20
  - number: 20.1.a
    text: |-
      onmiddellijk vóór 1 januari 1997 zorg als bedoeld in de [artikelen 10][ref1] en
      [14 van het Besluit zorgaanspraken bijzondere ziektekostenverzekering][ref2] zoals dat besluit tot dat tijdstip
      luidde verleend werd en aan wie die zorg onmiddellijk voorafgaand aan de inwerkingtreding van dit besluit nog
      steeds verleend werd;


      [ref1]: https://wetten.overheid.nl/BWBR0005283#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0005283#Artikel14
    url: https://wetten.overheid.nl/BWBR0008946/2002-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0005283
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0005283
        artikel: '14'
  - number: 20.1.b
    text: |-
      in het bezit zijn van een advies op grond van het
      [Besluit indicatie-advisering bejaardenoorden en verpleeginrichtingen][ref1], zoals dat besluit luidde
      tot de intrekking van de Wet op de bejaardenoorden, waaruit blijkt dat zij voor zorg als bedoeld in de
      [artikelen 10][ref2] en [14 van het Besluit zorgaanspraken bijzondere ziektekostenverzekering][ref3] zoals dat
      besluit tot dat tijdstip luidde in aanmerking komen, en mits aan hen binnen twee jaar na inwerkingtreding van dit
      besluit die zorg ook verleend wordt.


      [ref1]: https://wetten.overheid.nl/BWBR0004408
      [ref2]: https://wetten.overheid.nl/BWBR0005283#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0005283#Artikel14
    url: https://wetten.overheid.nl/BWBR0008946/2002-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0004408
      - id: ref2
        bwb_id: BWBR0005283
        artikel: '10'
      - id: ref3
        bwb_id: BWBR0005283
        artikel: '14'
  - number: 20.1.c
    text: |-
      onmiddellijk vóór 1 januari 1997 zorg als bedoeld in [artikel 15, eerste lid, onder ][ref1], zoals dat besluit
      luidde tot dat tijdstip, verleend werd, bestaande uit verpleging of verzorging door of vanwege een kruisorganisatie
      en mits aan hen die zorg op het tijdstip van inwerkingtreding van dit besluit nog verleend wordt.


      [ref1]: https://wetten.overheid.nl/BWBR0005283#Artikel15
    url: https://wetten.overheid.nl/BWBR0008946/2002-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0005283
        artikel: '15'
  - number: '20.2'
    text: |-
      Onze Minister kan bij ministeriële regeling een tijdstip bepalen met ingang waarvan dit besluit van toepassing is
      op personen dan wel categorieën van personen, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0008946/2002-01-01#Artikel20
  - number: '21'
    text: |-
      Een indicatiebeoordeling als bedoeld in artikel 1, eerste lid, onder *c*, van het Besluit indicatiebeoordeling
      verpleging en verzorging, zoals dat besluit luidde tot de intrekking daarvan, wordt gelijkgesteld met een
      indicatiebesluit als bedoeld in [artikel 1, eerste lid, onder ][ref1], met dien verstande dat, indien de
      geldigheidsduur van de indicatiebeoordeling door het indicatieorgaan op onbepaald gesteld is, Onze Minister voor
      categorieën van indicatiebeoordelingen bij ministeriële regeling alsnog kan bepalen dat die indicatiebeoordelingen
      een bij die regeling te bepalen geldigheidsduur hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0008946#Artikel1
    url: https://wetten.overheid.nl/BWBR0008946/2002-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0008946
        artikel: '1'
        paragraaf: '1'
  - number: '25.1'
    text: Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0008946/2002-01-01#Artikel25
  - number: '25.2'
    text: |-
      [Artikel 9, derde lid][ref1], en [artikel 9a][ref2] vervallen drie jaar nadat zij in werking zijn getreden.


      [ref1]: https://wetten.overheid.nl/BWBR0008946#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0008946#Artikel9a
    url: https://wetten.overheid.nl/BWBR0008946/2002-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0008946
        artikel: '9'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0008946
        artikel: 9a
        paragraaf: '4'
  - number: '26'
    text: 'Dit besluit wordt aangehaald als: Zorgindicatiebesluit.'
    url: https://wetten.overheid.nl/BWBR0008946/2002-01-01#Artikel26
