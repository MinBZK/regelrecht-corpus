  - number: '11'
    text: Onze Minister kan beleidsregels stellen over de wijze waarop het indicatieorgaan zijn activiteiten uitvoert.
    url: https://wetten.overheid.nl/BWBR0008946/2009-01-01#Artikel11
  - number: '12'
    text: |-
      1 Het indicatieorgaan stelt binnen zes weken nadat de aanvraag is ingediend een indicatiebesluit vast.

      2 In afwijking van het eerste lid stelt het indicatieorgaan in situaties waarin spoedige verlening van zorg
      redelijkerwijs noodzakelijk is, binnen twee weken nadat de aanvraag is ingediend, een indicatiebesluit vast.
    url: https://wetten.overheid.nl/BWBR0008946/2009-01-01#Artikel12
  - number: '13'
    text: |-
      1 Indien een zorgvrager op een vorm van zorg of op vormen van zorg is aangewezen, worden in het indicatiebesluit
      aangegeven:

      a. de vorm van zorg of vormen van zorg, bedoeld in [artikel 2][ref1], waarop de zorgvrager is aangewezen;

      b. de hoeveelheid zorg in tijd per zorgvorm dan wel, indien de verzekerde is aangewezen op
      verblijf als bedoeld in [artikel 9, eerste lid][ref2], of op voortgezet verblijf als bedoeld in
      [artikel 13, tweede lid, van het besluit][ref3], de hoeveelheid zorg in tijd voor de zorgvormen tezamen;

      c. de aandoening, beperking of handicap als gevolg waarvan de verzekerde op de vorm van zorg of vormen van zorg
      is aangewezen.

      2 In het indicatiebesluit wordt aangegeven met ingang van welke datum de zorgvrager op de geïndiceerde vorm van
      zorg of vormen van zorg is aangewezen.

      3 Indien een indicatieorgaan van mening is dat andere professionele zorg dan de zorg, bedoeld in [artikel 2][ref4],
      noodzakelijk, dan wel mede noodzakelijk is, geeft het indicatieorgaan daarover zo mogelijk advies.


      [ref1]: https://wetten.overheid.nl/BWBR0008946#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0014149#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0014149#Artikel13
      [ref4]: https://wetten.overheid.nl/BWBR0008946#Artikel2
    url: https://wetten.overheid.nl/BWBR0008946/2009-01-01#Artikel13
