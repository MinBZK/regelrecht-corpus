  - number: '15'
    text: |-
      1 In het indicatiebesluit wordt de geldigheidsduur ervan vermeld.

      2 Bij ministeriële regeling kunnen regels over de geldigheidsduur van indicatiebesluiten worden gesteld.
    url: https://wetten.overheid.nl/BWBR0008946/2009-01-01#Artikel15
  - number: '16'
    text: |-
      Een zorgverzekeraar kan in situaties waarin onmiddelijke verlening van zorg als bedoeld in [artikel 2][ref1]
      redelijkerwijs noodzakelijk is, besluiten dat een verzekerde zijn aanspraak op zorg gedurende ten hoogste twee
      weken tot gelding kan brengen, zonder dat hij beschikt over een indicatiebesluit, waaruit blijkt dat hij op
      zodanige zorg is aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0008946#Artikel2
    url: https://wetten.overheid.nl/BWBR0008946/2009-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0008946
        artikel: '2'
        paragraaf: '1'
  - number: 16a
    text: |-
      Het indicatieorgaan draagt er zorg voor dat gedurende de geldigheid van het indicatiebesluit de gegevens die aan
      het indicatiebesluit ten grondslag hebben gelegen, worden bewaard en houdt de gegevens die voor een mogelijk nieuw
      indicatiebesluit van belang zijn, zoals naam, adres, woonplaats of verblijfplaats, burgerlijke staat en wettelijke
      vertegenwoordiging, zo veel mogelijk actueel.
    url: https://wetten.overheid.nl/BWBR0008946/2009-01-01#Artikel16a
  - number: '17'
    text: |-
      1 Voordat het indicatieorgaan een indicatiebesluit neemt, waaruit blijkt dat opneming en verder verblijf in een
      instelling als bedoeld in [artikel 3][ref1] noodzakelijk wordt geoordeeld, wordt de zorgvrager, tenzij gebleken is
      dat hij de nodige bereidheid bezit tot zodanige opneming en verder verblijf, schriftelijk en mondeling medegedeeld
      dat hij bedenkingen kan inbrengen tegen zodanige opneming en verder verblijf.

      2 Indien een besluit als bedoeld in het eerste lid wordt genomen, wordt, tenzij gebleken is dat de zorgvrager de
      nodige bereidheid bezit tot zodanige opneming en verder verblijf, in dat besluit melding gemaakt van:

      a. de aard van de stoornis van de geestvermogens;

      b. de omstandigheden die meebrengen dat hij zich ten gevolge van die stoornis niet buiten een een inrichting als
      bedoeld in [artikel 3][ref2] kan handhaven;

      c. de wijze waarop aan hem is meegedeeld dat hij bedenkingen kan inbrengen tegen zodanige opneming en verder
      verblijf en diens reactie daarop.


      [ref1]: https://wetten.overheid.nl/BWBR0008946#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0008946#Artikel3
    url: https://wetten.overheid.nl/BWBR0008946/2009-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0008946
        artikel: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0008946
        artikel: '3'
        paragraaf: '1'
  - number: '18'
    text: |-
      1 Het indicatieorgaan registreert de resultaten van zijn onderzoeken en de inhoud van de door hem gegeven
      indicatiebesluiten volgens bij ministeriële regeling te bepalen regels.

      2 De ministeriële regeling bevat ten minste een beschrijving van:

      a. de technische standaarden voor de wijze waarop gegevens worden vastgelegd;

      b. de afzonderlijke gegevenselementen die vastgelegd worden en de ordening van deze elementen;

      c. de functionele beveiligingseisen voor het bewerken en vastleggen van gegevens.
    url: https://wetten.overheid.nl/BWBR0008946/2009-01-01#Artikel18
  - number: '20'
    text: |-
      1 Dit besluit is niet van toepassing ten aanzien van diegenen die:

      a. onmiddellijk vóór 1 januari 1997 zorg als bedoeld in de [artikelen 10][ref1] en
      [14 van het Besluit zorgaanspraken bijzondere ziektekostenverzekering][ref2] zoals dat besluit tot dat tijdstip
      luidde verleend werd en aan wie die zorg onmiddellijk voorafgaand aan de inwerkingtreding van dit besluit nog
      steeds verleend werd;

      b. in het bezit zijn van een advies op grond van het
      [Besluit indicatie-advisering bejaardenoorden en verpleeginrichtingen][ref3], zoals dat besluit luidde
      tot de intrekking van de Wet op de bejaardenoorden, waaruit blijkt dat zij voor zorg als bedoeld in de
      [artikelen 10][ref4] en [14 van het Besluit zorgaanspraken bijzondere ziektekostenverzekering][ref5] zoals dat
      besluit tot dat tijdstip luidde in aanmerking komen, en mits aan hen binnen twee jaar na inwerkingtreding van dit
      besluit die zorg ook verleend wordt.

      c. onmiddellijk vóór 1 januari 1997 zorg als bedoeld in [artikel 15, eerste lid, onder ][ref6], zoals dat besluit
      luidde tot dat tijdstip, verleend werd, bestaande uit verpleging of verzorging door of vanwege een kruisorganisatie
      en mits aan hen die zorg op het tijdstip van inwerkingtreding van dit besluit nog verleend wordt.

      2 Onze Minister kan bij ministeriële regeling een tijdstip bepalen met ingang waarvan dit besluit van toepassing is
      op personen dan wel categorieën van personen, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005283#Artikel10
