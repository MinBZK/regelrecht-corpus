  - number: '3'
    text: |-
      Het indicatieorgaan wordt, voor zover het betreft opneming en verder
      verblijf in een verpleeg- of zwakzinnigeninrichting als bedoeld in
      [artikel 1, eerste lid, onder h, van de Wet bijzondere opnemingen in psychiatrische ziekenhuizen][ref1], aangewezen
      als commissie als bedoeld in [artikel 60, derde lid, van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005700#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005700#Artikel60
    url: https://wetten.overheid.nl/BWBR0008946/2009-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005700
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0005700
        artikel: '60'
  - number: '5'
    text: |-
      1 Een indicatiebesluit kan zowel schriftelijk als mondeling worden aangevraagd.

      2 Bij of onmiddellijk na het indienen van de aanvraag gaat het indicatieorgaan na of de zorgvrager toestemming
      geeft tot het zonodig raadplegen van behandelende beroepsbeoefenaren en het gebruik maken van bij hen aanwezige
      medische gegevens, en het maakt hier schriftelijk melding van.

      3 Indien de aanvraag door een vertegenwoordiger van de zorgvrager wordt gedaan, wordt nagegaan wat de reden daarvan
      is en wordt die reden schriftelijk vermeld.

      4 Het indicatieorgaan tekent onverwijld de datum van ontvangst van de aanvraag aan.

      5 Het indicatieorgaan zendt de aanvrager een bewijs van ontvangst, waarin die datum is vermeld.
    url: https://wetten.overheid.nl/BWBR0008946/2009-01-01#Artikel5
  - number: '6'
    text: |-
      Voor zover dit voor het nemen van een indicatiebesluit van belang is, wordt onderzoek verricht naar:

      a. de algemene gezondheidstoestand van de zorgvrager;

      b. de beperkingen die de zorgvrager in zijn functioneren ondervindt als gevolg van een somatische,
      psychogeriatrische of psychiatrische aandoening of beperking, of een verstandelijke, lichamelijke of zintuiglijke
      handicap;

      c. de woning en de woonomgeving van de zorgvrager;

      d. het psychisch en sociaal functioneren van de zorgvrager;

      e. de sociale omstandigheden van de zorgvrager;

      f. de aard en de omvang van de aan de zorgvrager geboden professionele en niet-professionele hulp en zorg en de
      mogelijkheden tot continuering en uitbreiding daarvan.
    url: https://wetten.overheid.nl/BWBR0008946/2009-01-01#Artikel6
  - number: '7'
    text: |-
      1 Bij het onderzoek wordt zoveel mogelijk gebruik gemaakt van gegevens die bij de aanvraag zijn gevoegd of tijdens
      het onderzoek ter beschikking zijn gesteld.

      2 Indien daartoe aanleiding bestaat, worden de behandelende beroepsbeoefenaren van de zorgvrager tijdens het
      onderzoek geraadpleegd.

      3 Het gebruik maken van gegevens als bedoeld in het eerste lid en het raadplegen van behandelende
      beroepsbeoefenaren als bedoeld in het tweede lid geschiedt slechts met toestemming van de zorgvrager.
    url: https://wetten.overheid.nl/BWBR0008946/2009-01-01#Artikel7
  - number: '8'
    text: |-
      Het onderzoek wordt verricht door personen dan wel organisaties die over voldoende deskundigheid beschikken om de
      aanvraag om een indicatiebesluit te kunnen beoordelen.
    url: https://wetten.overheid.nl/BWBR0008946/2009-01-01#Artikel8
  - number: '9'
    text: |-
      1 Indien uit de aanvraag blijkt dat de zorgvrager langdurig verblijf of langdurige intensieve zorg thuis wenst, dan
      wel na het indienen van de aanvraag blijkt dat redelijkerwijs te verwachten is dat een indicatiebesluit zal worden
      genomen, waaruit blijkt dat een zorgvrager voor zodanig verblijf of zodanige zorg in aanmerking komt, wordt de
      aanvraag onderzocht door een team van deskundigen.

      2 In een team als bedoeld in het eerste lid is, voor zover dat voor de beoordeling van de aanvraag van belang kan
      zijn, deskundigheid aanwezig op de terreinen van de zorg, bedoeld in [artikel 2][ref1], alsmede op de terreinen van
      woningaanpassing en voorzieningen die op grond van de [Wet maatschappelijke ondersteuning][ref2] verstrekt kunnen
      worden.


      [ref1]: https://wetten.overheid.nl/BWBR0008946#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0020031
    url: https://wetten.overheid.nl/BWBR0008946/2009-01-01#Artikel9
