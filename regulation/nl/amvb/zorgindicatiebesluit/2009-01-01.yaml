  - number: '2'
    text: |-
      Als vormen van zorg als bedoeld in [artikel 9a, eerste lid, van de AWBZ][ref1] worden aangewezen
      de vormen van zorg, bedoeld in de [artikelen 4 tot en met 6][ref2] en [8 tot en met 10][ref3] en
      [13, tweede lid, van het besluit][ref4], met uitzondering van:

      a. de zorg, bedoeld in [artikel 5 van het besluit][ref5], voor zover het betreft advies, instructie en voorlichting
      door een aan de instelling verbonden gespecialiseerde verpleegkundige ten behoeve van een niet in de instelling
      verblijvende verzekerde;

      b. de zorg, bedoeld in [artikel 8 van het besluit][ref6], voor zover het betreft consultatie van een aan de
      instelling verbonden verpleeghuisarts of arts voor verstandelijk gehandicapten ten behoeve van een niet in de
      instelling verblijvende verzekerde;

      c. de zorg, bedoeld in [artikel 9, tweede lid, van het besluit][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel9a
      [ref2]: https://wetten.overheid.nl/BWBR0014149#Artikel4
