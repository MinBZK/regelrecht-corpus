  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Volksgezondheid, Welzijn en Sport van 11 juli 1997, kenmerk DBO/
    PBO/971311;

    Gelet op de artikelen 9a, eerste en tweede lid, 9b, tweede lid, en artikel 11 van de Algemene Wet Bijzondere
    Ziektekosten, en artikel 60, tweede en derde lid, van de Wet bijzondere opnemingen in psychiatrische ziekenhuizen;

    De Raad van State gehoord (advies van 24 september 1997, nr. W.13.97.0470);

    Gezien het nader rapport van de Staatssecretaris van Volksgezondheid, Welzijn en Sport van 30 september 1997,
    kenmerk DBO 97975;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0008946/2009-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. de AWBZ: de [Algemene Wet Bijzondere Ziektekosten][ref1];

      b. indicatieorgaan: een indicatieorgaan als bedoeld in [artikel 9a van de AWBZ][ref2];

      c. zorgvrager: degene ten behoeve van wie een aanvraag om een indicatiebesluit is ingediend;

      d. indicatiebesluit: het besluit van een indicatieorgaan waarbij beoordeeld wordt of en in welke omvang een
      zorgvrager in aanmerking komt voor een of meer vormen van zorg als bedoeld in [artikel 2][ref3];

      e. het besluit: het [Besluit zorgaanspraken AWBZ][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0002614
      [ref2]: https://wetten.overheid.nl/BWBR0002614#Artikel9a
      [ref3]: https://wetten.overheid.nl/BWBR0008946#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0014149
