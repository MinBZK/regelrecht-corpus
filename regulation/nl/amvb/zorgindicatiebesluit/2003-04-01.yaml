preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Volksgezondheid, Welzijn en Sport van 11 juli 1997, kenmerk DBO/
    PBO/971311;

    Gelet op de artikelen 9a, eerste en tweede lid, 9b, tweede lid, en artikel 11 van de Algemene Wet Bijzondere
    Ziektekosten, en artikel 60, tweede en derde lid, van de Wet bijzondere opnemingen in psychiatrische ziekenhuizen;

    De Raad van State gehoord (advies van 24 september 1997, nr. W.13.97.0470);

    Gezien het nader rapport van de Staatssecretaris van Volksgezondheid, Welzijn en Sport van 30 september 1997,
    kenmerk DBO 97975;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0008946/2003-04-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0008946/2003-04-01#Artikel1
  - number: 1.a
    text: |-
      de AWBZ: de [Algemene Wet Bijzondere Ziektekosten][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002614
    url: https://wetten.overheid.nl/BWBR0008946/2003-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002614
  - number: 1.b
    text: |-
      indicatieorgaan: een indicatieorgaan als bedoeld in [artikel 9][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel9a
    url: https://wetten.overheid.nl/BWBR0008946/2003-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: 9a
  - number: 1.c
    text: 'zorgvrager: degene ten behoeve van wie een aanvraag om een indicatiebesluit is ingediend;'
    url: https://wetten.overheid.nl/BWBR0008946/2003-04-01#Artikel1
  - number: 1.d
    text: |-
      indicatiebesluit: het besluit van een indicatieorgaan waarbij beoordeeld wordt of en in welke omvang een zorgvrager
      in aanmerking komt voor een of meer vormen van zorg als bedoeld in [artikel 2][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008946#Artikel2
    url: https://wetten.overheid.nl/BWBR0008946/2003-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0008946
        artikel: '2'
        paragraaf: '1'
  - number: 1.e
    text: |-
      klasse: een in tijd uitgedrukte hoeveelheid zorg als bedoeld in de [artikelen 3][ref1], [4][ref2], [5][ref3],
      [6][ref4] en [7 van het Besluit zorgaanspraken AWBZ][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0014149#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0014149#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0014149#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0014149#Artikel6
      [ref5]: https://wetten.overheid.nl/BWBR0014149#Artikel7
    url: https://wetten.overheid.nl/BWBR0008946/2003-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0014149
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0014149
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0014149
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0014149
        artikel: '6'
      - id: ref5
        bwb_id: BWBR0014149
        artikel: '7'
  - number: '2'
    text: |-
      Als vormen van zorg als bedoeld in [artikel 9a, eerste lid, van de AWBZ][ref1] worden aangewezen de vormen van
      zorg, bedoeld in de [artikelen 3 tot en met 10 van het Besluit zorgaanspraken AWBZ][ref2], met uitzondering van:


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel9a
      [ref2]: https://wetten.overheid.nl/BWBR0014149#Artikel3
    url: https://wetten.overheid.nl/BWBR0008946/2003-04-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: 9a
      - id: ref2
        bwb_id: BWBR0014149
        artikel: '3'
  - number: 2.a
    text: |-
      de zorg, bedoeld in [artikel 8 van het Besluit zorgaanspraken AWBZ][ref1], die in verband met een psychiatrische
      aandoening wordt verleend;


      [ref1]: https://wetten.overheid.nl/BWBR0014149#Artikel8
    url: https://wetten.overheid.nl/BWBR0008946/2003-04-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0014149
        artikel: '8'
  - number: 2.b
    text: |-
      gedurende een periode van 365 dagen, de zorg, bedoeld in [artikel 9 van het Besluit zorgaanspraken AWBZ][ref1],
      die in verband met een psychiatrische aandoening wordt verleend, mits deze gepaard gaat met de zorg, bedoeld in
      [artikel 8 van dat besluit][ref2], en al dan niet gepaard gaande met de zorg bedoeld in de [artikelen 4][ref3],
      [5][ref4], [6][ref5] of [7 van dat besluit][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0014149#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0014149#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0014149#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0014149#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0014149#Artikel6
      [ref6]: https://wetten.overheid.nl/BWBR0014149#Artikel7
    url: https://wetten.overheid.nl/BWBR0008946/2003-04-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0014149
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0014149
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0014149
        artikel: '4'
      - id: ref4
        bwb_id: BWBR0014149
        artikel: '5'
      - id: ref5
        bwb_id: BWBR0014149
        artikel: '6'
      - id: ref6
        bwb_id: BWBR0014149
        artikel: '7'
  - number: '3'
    text: |-
      Het indicatieorgaan wordt, voor zover het betreft opneming en verder
      verblijf in een verpleeg- of zwakzinnigeninrichting als bedoeld in
      [artikel 1, eerste lid, onder h, van de Wet bijzondere opnemingen in psychiatrische ziekenhuizen][ref1], aangewezen
      als commissie als bedoeld in [artikel 60, derde lid, van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005700#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005700#Artikel60
    url: https://wetten.overheid.nl/BWBR0008946/2003-04-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005700
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0005700
        artikel: '60'
  - number: '4.1'
    text: Het indicatieorgaan bestaat uit ten minste vijf leden.
    url: https://wetten.overheid.nl/BWBR0008946/2003-04-01#Artikel4
  - number: '4.2'
    text: |-
      De in het werkgebied van het indicatieorgaan werkzame patiënten- en consumentenorganisaties worden in de
      gelegenheid gesteld ten minste een persoon aan te wijzen als lid van het indicatieorgaan.
    url: https://wetten.overheid.nl/BWBR0008946/2003-04-01#Artikel4
  - number: '4.3'
    text: |-
      De gemeente of gemeenten die in het werkgebied van het indicatieorgaan gelegen zijn, wijzen een persoon aan als lid
      van het indicatieorgaan.
    url: https://wetten.overheid.nl/BWBR0008946/2003-04-01#Artikel4
  - number: '5.1'
    text: Een indicatiebesluit kan zowel schriftelijk als mondeling worden aangevraagd.
    url: https://wetten.overheid.nl/BWBR0008946/2003-04-01#Artikel5
  - number: '5.2'
    text: |-
      Bij of onmiddellijk na het indienen van de aanvraag gaat het indicatieorgaan na of de zorgvrager toestemming geeft
      tot het zonodig raadplegen van behandelende beroepsbeoefenaren en het gebruik maken van bij hen aanwezige medische
      gegevens, en het maakt hier schriftelijk melding van.
    url: https://wetten.overheid.nl/BWBR0008946/2003-04-01#Artikel5
  - number: '5.3'
    text: |-
      Indien de aanvraag door een vertegenwoordiger van de zorgvrager wordt gedaan, wordt nagegaan wat de reden daarvan
      is en wordt die reden schriftelijk vermeld.
    url: https://wetten.overheid.nl/BWBR0008946/2003-04-01#Artikel5
  - number: '5.4'
    text: Het indicatieorgaan tekent onverwijld de datum van ontvangst van de aanvraag aan.
    url: https://wetten.overheid.nl/BWBR0008946/2003-04-01#Artikel5
  - number: '5.5'
    text: Het indicatieorgaan zendt de aanvrager een bewijs van ontvangst, waarin die datum is vermeld.
    url: https://wetten.overheid.nl/BWBR0008946/2003-04-01#Artikel5
  - number: '6'
    text: 'Voor zover dit voor het nemen van een indicatiebesluit van belang is, wordt onderzoek verricht naar:'
    url: https://wetten.overheid.nl/BWBR0008946/2003-04-01#Artikel6
  - number: 6.a
    text: de algemene gezondheidstoestand van de zorgvrager;
    url: https://wetten.overheid.nl/BWBR0008946/2003-04-01#Artikel6
  - number: 6.b
    text: |-
      de beperkingen die de zorgvrager in zijn functioneren ondervindt als gevolg van een somatische, psychogeriatrische
      of psychiatrische aandoening of beperking, een verstandelijke, lichamelijke of zintuiglijke handicap of een
      psychosociaal probleem;
    url: https://wetten.overheid.nl/BWBR0008946/2003-04-01#Artikel6
  - number: 6.c
    text: de woning en de woonomgeving van de zorgvrager;
    url: https://wetten.overheid.nl/BWBR0008946/2003-04-01#Artikel6
  - number: 6.d
    text: het psychisch en sociaal functioneren van de zorgvrager;
    url: https://wetten.overheid.nl/BWBR0008946/2003-04-01#Artikel6
  - number: 6.e
    text: de sociale omstandigheden van de zorgvrager;
    url: https://wetten.overheid.nl/BWBR0008946/2003-04-01#Artikel6
  - number: 6.f
    text: |-
      de aard en de omvang van de aan de zorgvrager geboden professionele en niet-professionele hulp en zorg en de
      mogelijkheden tot continuering en uitbreiding daarvan.
    url: https://wetten.overheid.nl/BWBR0008946/2003-04-01#Artikel6
  - number: '7.1'
    text: |-
      Bij het onderzoek wordt zoveel mogelijk gebruik gemaakt van gegevens die bij de aanvraag zijn gevoegd of tijdens
      het onderzoek ter beschikking zijn gesteld.
    url: https://wetten.overheid.nl/BWBR0008946/2003-04-01#Artikel7
  - number: '7.2'
    text: |-
      Indien daartoe aanleiding bestaat, worden de behandelende beroepsbeoefenaren van de zorgvrager tijdens het
      onderzoek geraadpleegd.
    url: https://wetten.overheid.nl/BWBR0008946/2003-04-01#Artikel7
  - number: '7.3'
    text: |-
      Het gebruik maken van gegevens als bedoeld in het eerste lid en het raadplegen van behandelende beroepsbeoefenaren
      als bedoeld in het tweede lid geschiedt slechts met toestemming van de zorgvrager.
    url: https://wetten.overheid.nl/BWBR0008946/2003-04-01#Artikel7
  - number: '8'
    text: |-
      Het onderzoek wordt verricht door personen dan wel organisaties die over voldoende deskundigheid beschikken om de
      aanvraag om een indicatiebesluit te kunnen beoordelen.
    url: https://wetten.overheid.nl/BWBR0008946/2003-04-01#Artikel8
  - number: '9.1'
    text: |-
      Indien uit de aanvraag blijkt dat de zorgvrager langdurig verblijf of langdurige intensieve zorg thuis wenst, dan
      wel na het indienen van de aanvraag blijkt dat redelijkerwijs te verwachten is dat een indicatiebesluit zal worden
      genomen, waaruit blijkt dat een zorgvrager voor zodanig verblijf of zodanige zorg in aanmerking komt, wordt de
      aanvraag onderzocht door een team van deskundigen.
    url: https://wetten.overheid.nl/BWBR0008946/2003-04-01#Artikel9
  - number: '9.2'
    text: |-
      In een team als bedoeld in het eerste lid is, voor zover dat voor de beoordeling van de aanvraag van
      belang kan zijn, deskundigheid aanwezig op de terreinen van de zorg, bedoeld in [artikel 2][ref1], alsmede
      op de terreinen van woningaanpassing en voorzieningen die op grond van de [Welzijnswet 1994][ref2] en de
      [Wet voorzieningen gehandicapten][ref3] verstrekt kunnen worden.


      [ref1]: https://wetten.overheid.nl/BWBR0008946#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006705
      [ref3]: https://wetten.overheid.nl/BWBR0006169
    url: https://wetten.overheid.nl/BWBR0008946/2003-04-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0008946
        artikel: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006705
      - id: ref3
        bwb_id: BWBR0006169
  - number: '9.3'
    text: |-
      Indien uit de aanvraag tevens blijkt dat de zorgvrager zorg wenst als bedoeld in de
      [artikelen 3 tot en met 10 van het Besluit zorgaanspraken AWBZ][ref1] in verband met een handicap of een
      psychiatrische aandoening of indien na het indienen van de aanvraag blijkt dat een zorgvrager voor zodanige zorg
      in aanmerking komt, wordt in afwijking van het eerste en tweede lid de aanvraag onderzocht door de op grond van
      [artikel 9a, eerste lid][ref2], aangewezen instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0014149#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0008946#Artikel9a
    url: https://wetten.overheid.nl/BWBR0008946/2003-04-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0014149
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0008946
        artikel: 9a
        paragraaf: '4'
  - number: 9a.1
    text: |-
      Onze Minister wijst op aanvraag een landelijk werkende rechtspersoon aan die beschikt over specifieke deskundigheid
      op het gebied van zorg als bedoeld in [artikel 2][ref1] en die tot doel heeft:


      [ref1]: https://wetten.overheid.nl/BWBR0008946#Artikel2
    url: https://wetten.overheid.nl/BWBR0008946/2003-04-01#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0008946
        artikel: '2'
        paragraaf: '1'
  - number: 9a.1.a
    text: |-
      het adviseren van alle in Nederland werkzame indicatieorganen over aanvragen als bedoeld in
      [artikel 9, derde lid][ref1], alsmede, op verzoek van het indicatieorgaan, over andere aanvragen;


      [ref1]: https://wetten.overheid.nl/BWBR0008946#Artikel9
    url: https://wetten.overheid.nl/BWBR0008946/2003-04-01#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0008946
        artikel: '9'
        paragraaf: '4'
  - number: 9a.1.b
    text: |-
      het adviseren van alle in Nederland werkzame indicatieorganen en gemeenten over de werkwijze van indicatieorganen;
      en
    url: https://wetten.overheid.nl/BWBR0008946/2003-04-01#Artikel9a
  - number: 9a.1.c
    text: op verzoek van Onze Minister rapporteren over de wijze waarop de indicatieorganen indiceren.
    url: https://wetten.overheid.nl/BWBR0008946/2003-04-01#Artikel9a
  - number: 9a.2
    text: 'Onze Minister kan de aanwijzing intrekken indien de betrokken rechtspersoon:'
    url: https://wetten.overheid.nl/BWBR0008946/2003-04-01#Artikel9a
  - number: 9a.2.a
    text: |-
      haar taak de indicatieorganen kosteloos te adviseren over aanvragen als bedoeld in [artikel 9, derde lid][ref1],
      niet naar behoren vervult;


      [ref1]: https://wetten.overheid.nl/BWBR0008946#Artikel9
    url: https://wetten.overheid.nl/BWBR0008946/2003-04-01#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0008946
        artikel: '9'
        paragraaf: '4'
  - number: 9a.2.b
    text: daarom verzoekt.
    url: https://wetten.overheid.nl/BWBR0008946/2003-04-01#Artikel9a
  - number: '11'
    text: Onze Minister kan beleidsregels stellen over de wijze waarop het indicatieorgaan zijn activiteiten uitvoert.
    url: https://wetten.overheid.nl/BWBR0008946/2003-04-01#Artikel11
  - number: '12.1'
    text: Het indicatieorgaan stelt binnen zes weken nadat de aanvraag is ingediend een indicatiebesluit vast.
    url: https://wetten.overheid.nl/BWBR0008946/2003-04-01#Artikel12
  - number: '12.2'
    text: |-
      In afwijking van het eerste lid stelt het indicatieorgaan in situaties waarin spoedige verlening van zorg
      redelijkerwijs noodzakelijk is, binnen twee weken nadat de aanvraag is ingediend, een indicatiebesluit vast.
    url: https://wetten.overheid.nl/BWBR0008946/2003-04-01#Artikel12
  - number: '13.1'
    text: |-
      Indien een zorgvrager op een vorm van zorg of op vormen van zorg is aangewezen, worden in het indicatiebesluit
      aangegeven:
    url: https://wetten.overheid.nl/BWBR0008946/2003-04-01#Artikel13
  - number: 13.1.a
    text: |-
      de vorm van zorg of vormen van zorg, bedoeld in [artikel 2][ref1], waarop de zorgvrager is aangewezen;


      [ref1]: https://wetten.overheid.nl/BWBR0008946#Artikel2
    url: https://wetten.overheid.nl/BWBR0008946/2003-04-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0008946
        artikel: '2'
        paragraaf: '1'
  - number: 13.1.b
    text: de klasse van de vorm of vormen van zorg waarop de zorgvrager is aangewezen; en
    url: https://wetten.overheid.nl/BWBR0008946/2003-04-01#Artikel13
  - number: 13.1.c
    text: |-
      de aandoening, beperking of handicap of het probleem als gevolg waarvan de verzekerde op de vorm van zorg of vormen
      van zorg is aangewezen.
    url: https://wetten.overheid.nl/BWBR0008946/2003-04-01#Artikel13
  - number: '13.2'
    text: |-
      In het indicatiebesluit wordt aangegeven met ingang van welke datum de zorgvrager op de geïndiceerde vorm van zorg
      of vormen van zorg is aangewezen.
    url: https://wetten.overheid.nl/BWBR0008946/2003-04-01#Artikel13
  - number: '13.3'
    text: |-
      Indien een indicatieorgaan van mening is dat andere professionele zorg dan de zorg, bedoeld in [artikel 2][ref1],
      noodzakelijk, dan wel mede noodzakelijk is, geeft het indicatieorgaan daarover zo mogelijk advies.


      [ref1]: https://wetten.overheid.nl/BWBR0008946#Artikel2
    url: https://wetten.overheid.nl/BWBR0008946/2003-04-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0008946
        artikel: '2'
        paragraaf: '1'
  - number: '15.1'
    text: In het indicatiebesluit wordt de geldigheidsduur ervan vermeld.
    url: https://wetten.overheid.nl/BWBR0008946/2003-04-01#Artikel15
  - number: '15.2'
    text: Bij ministeriële regeling kunnen regels over de geldigheidsduur van indicatiebesluiten worden gesteld.
    url: https://wetten.overheid.nl/BWBR0008946/2003-04-01#Artikel15
  - number: '16'
    text: |-
      Een uitvoeringsorgaan kan in situaties waarin onmiddelijke verlening van zorg als bedoeld in [artikel 2][ref1]
      redelijkerwijs noodzakelijk is, besluiten dat een verzekerde zijn aanspraak op zorg gedurende ten hoogste twee
      weken tot gelding kan brengen, zonder dat hij beschikt over een indicatiebesluit, waaruit blijkt dat hij op
      zodanige zorg is aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0008946#Artikel2
    url: https://wetten.overheid.nl/BWBR0008946/2003-04-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0008946
        artikel: '2'
        paragraaf: '1'
  - number: 16a
    text: |-
      Het indicatieorgaan draagt er zorg voor dat gedurende de geldigheid van het indicatiebesluit de gegevens die aan
      het indicatiebesluit ten grondslag hebben gelegen, worden bewaard en houdt de gegevens die voor een mogelijk nieuw
      indicatiebesluit van belang zijn, zoals naam, adres, woonplaats of verblijfplaats, burgerlijke staat en wettelijke
      vertegenwoordiging, zo veel mogelijk actueel.
    url: https://wetten.overheid.nl/BWBR0008946/2003-04-01#Artikel16a
  - number: '17.1'
    text: |-
      Voordat het indicatieorgaan een indicatiebesluit neemt, waaruit blijkt dat opneming en verder verblijf in een
      instelling als bedoeld in [artikel 3][ref1] noodzakelijk wordt geoordeeld, wordt de zorgvrager, tenzij gebleken is
      dat hij de nodige bereidheid bezit tot zodanige opneming en verder verblijf, schriftelijk en mondeling medegedeeld
      dat hij bedenkingen kan inbrengen tegen zodanige opneming en verder verblijf.


      [ref1]: https://wetten.overheid.nl/BWBR0008946#Artikel3
    url: https://wetten.overheid.nl/BWBR0008946/2003-04-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0008946
        artikel: '3'
        paragraaf: '1'
  - number: '17.2'
    text: |-
      Indien een besluit als bedoeld in het eerste lid wordt genomen, wordt, tenzij gebleken is dat de zorgvrager de
      nodige bereidheid bezit tot zodanige opneming en verder verblijf, in dat besluit melding gemaakt van:
    url: https://wetten.overheid.nl/BWBR0008946/2003-04-01#Artikel17
  - number: 17.2.a
    text: de aard van de stoornis van de geestvermogens;
    url: https://wetten.overheid.nl/BWBR0008946/2003-04-01#Artikel17
  - number: 17.2.b
    text: |-
      de omstandigheden die meebrengen dat hij zich ten gevolge van die stoornis niet buiten een een inrichting als
      bedoeld in [artikel 3][ref1] kan handhaven;


      [ref1]: https://wetten.overheid.nl/BWBR0008946#Artikel3
    url: https://wetten.overheid.nl/BWBR0008946/2003-04-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0008946
        artikel: '3'
        paragraaf: '1'
  - number: 17.2.c
    text: |-
      de wijze waarop aan hem is meegedeeld dat hij bedenkingen kan inbrengen tegen zodanige opneming en verder verblijf
      en diens reactie daarop.
    url: https://wetten.overheid.nl/BWBR0008946/2003-04-01#Artikel17
  - number: '18.1'
    text: |-
      Het indicatieorgaan registreert de resultaten van zijn onderzoeken en de inhoud van de door hem gegeven
      indicatiebesluiten volgens bij ministeriële regeling te bepalen regels.
    url: https://wetten.overheid.nl/BWBR0008946/2003-04-01#Artikel18
  - number: '18.2'
    text: 'De ministeriële regeling bevat ten minste een beschrijving van:'
    url: https://wetten.overheid.nl/BWBR0008946/2003-04-01#Artikel18
  - number: 18.2.a
    text: de technische standaarden voor de wijze waarop gegevens worden vastgelegd;
    url: https://wetten.overheid.nl/BWBR0008946/2003-04-01#Artikel18
  - number: 18.2.b
    text: de afzonderlijke gegevenselementen die vastgelegd worden en de ordening van deze elementen;
    url: https://wetten.overheid.nl/BWBR0008946/2003-04-01#Artikel18
  - number: 18.2.c
    text: de functionele beveiligingseisen voor het bewerken en vastleggen van gegevens.
    url: https://wetten.overheid.nl/BWBR0008946/2003-04-01#Artikel18
  - number: '20.1'
    text: 'Dit besluit is niet van toepassing ten aanzien van diegenen die:'
    url: https://wetten.overheid.nl/BWBR0008946/2003-04-01#Artikel20
  - number: 20.1.a
    text: |-
      onmiddellijk vóór 1 januari 1997 zorg als bedoeld in de [artikelen 10][ref1] en
      [14 van het Besluit zorgaanspraken bijzondere ziektekostenverzekering][ref2] zoals dat besluit tot dat tijdstip
      luidde verleend werd en aan wie die zorg onmiddellijk voorafgaand aan de inwerkingtreding van dit besluit nog
      steeds verleend werd;


      [ref1]: https://wetten.overheid.nl/BWBR0005283#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0005283#Artikel14
    url: https://wetten.overheid.nl/BWBR0008946/2003-04-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0005283
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0005283
        artikel: '14'
  - number: 20.1.b
    text: |-
      in het bezit zijn van een advies op grond van het
      [Besluit indicatie-advisering bejaardenoorden en verpleeginrichtingen][ref1], zoals dat besluit luidde
      tot de intrekking van de Wet op de bejaardenoorden, waaruit blijkt dat zij voor zorg als bedoeld in de
      [artikelen 10][ref2] en [14 van het Besluit zorgaanspraken bijzondere ziektekostenverzekering][ref3] zoals dat
      besluit tot dat tijdstip luidde in aanmerking komen, en mits aan hen binnen twee jaar na inwerkingtreding van dit
      besluit die zorg ook verleend wordt.


      [ref1]: https://wetten.overheid.nl/BWBR0004408
      [ref2]: https://wetten.overheid.nl/BWBR0005283#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0005283#Artikel14
    url: https://wetten.overheid.nl/BWBR0008946/2003-04-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0004408
      - id: ref2
        bwb_id: BWBR0005283
        artikel: '10'
      - id: ref3
        bwb_id: BWBR0005283
        artikel: '14'
  - number: 20.1.c
    text: |-
      onmiddellijk vóór 1 januari 1997 zorg als bedoeld in [artikel 15, eerste lid, onder ][ref1], zoals dat besluit
      luidde tot dat tijdstip, verleend werd, bestaande uit verpleging of verzorging door of vanwege een kruisorganisatie
      en mits aan hen die zorg op het tijdstip van inwerkingtreding van dit besluit nog verleend wordt.


      [ref1]: https://wetten.overheid.nl/BWBR0005283#Artikel15
    url: https://wetten.overheid.nl/BWBR0008946/2003-04-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0005283
        artikel: '15'
  - number: '20.2'
    text: |-
      Onze Minister kan bij ministeriële regeling een tijdstip bepalen met ingang waarvan dit besluit van toepassing is
      op personen dan wel categorieën van personen, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0008946/2003-04-01#Artikel20
  - number: '21'
    text: |-
      Een indicatiebeoordeling als bedoeld in artikel 1, eerste lid, onder *c*, van het Besluit indicatiebeoordeling
      verpleging en verzorging, zoals dat besluit luidde tot de intrekking daarvan, wordt gelijkgesteld met een
      indicatiebesluit als bedoeld in [artikel 1, eerste lid, onder ][ref1], met dien verstande dat, indien de
      geldigheidsduur van de indicatiebeoordeling door het indicatieorgaan op onbepaald gesteld is, Onze Minister voor
      categorieën van indicatiebeoordelingen bij ministeriële regeling alsnog kan bepalen dat die indicatiebeoordelingen
      een bij die regeling te bepalen geldigheidsduur hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0008946#Artikel1
    url: https://wetten.overheid.nl/BWBR0008946/2003-04-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0008946
        artikel: '1'
        paragraaf: '1'
  - number: '25.1'
    text: Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0008946/2003-04-01#Artikel25
  - number: '25.2'
    text: |-
      [Artikel 9, derde lid][ref1], en [artikel 9a][ref2] vervallen drie jaar nadat zij in werking zijn getreden.


      [ref1]: https://wetten.overheid.nl/BWBR0008946#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0008946#Artikel9a
    url: https://wetten.overheid.nl/BWBR0008946/2003-04-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0008946
        artikel: '9'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0008946
        artikel: 9a
        paragraaf: '4'
  - number: '26'
    text: 'Dit besluit wordt aangehaald als: Zorgindicatiebesluit.'
    url: https://wetten.overheid.nl/BWBR0008946/2003-04-01#Artikel26
