$id: besluit_staten_verzekeringsbedrijf_1994
regulatory_layer: AMVB
publication_date: '2006-12-07'
valid_from: '2002-01-01'
bwb_id: BWBR0006735
url: https://wetten.overheid.nl/BWBR0006735/2002-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Financiën van 22 februari 1994, no. BGW 94-252, Generale Thesaurie, Directie
    Binnenlands Geldwezen, Afdeling Verzekeringswezen;

    Gelet op de artikelen 67, tweede lid, 72, vijfde lid, 95, tweede lid, 100, vijfde lid, en 187, eerste lid, van de
    Wet toezicht verzekeringsbedrijf 1993;

    Gezien de adviezen van de Verzekeringskamer en van het Verbond van Verzekeraars;

    De Raad van State gehoord (advies van 5 april 1994, no. W06.94 0097);

    Gezien het nader rapport van Onze Minister van Financiën van 2 juni 1994, no. 94-427;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0006735/2002-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      De modellen van de staten, bedoeld in de [artikelen 72][ref1], vijfde lid, en
      [100, vijfde lid, van de Wet toezicht verzekeringsbedrijf 1993][ref2], en de modellen van de bij de staten
      behorende omslagen worden vastgesteld zoals zij zijn opgenomen in [bijlage A][ref3] bij dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel72
      [ref2]: https://wetten.overheid.nl/BWBR0006509#Artikel100
      [ref3]: https://wetten.overheid.nl/BWBR0006735
    url: https://wetten.overheid.nl/BWBR0006735/2002-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006509
        artikel: '72'
      - id: ref2
        bwb_id: BWBR0006509
        artikel: '100'
      - id: ref3
        bwb_id: BWBR0006735
  - number: '1.2'
    text: |-
      De Pensioen- & Verzekeringskamer kan met betrekking tot het invullen van de staten aanwijzingen geven en deze
      aanwijzingen wijzigen of aanvullen.
    url: https://wetten.overheid.nl/BWBR0006735/2002-01-01#Artikel1
  - number: '1.3'
    text: |-
      De modellen van de staten en van de omslagen worden, evenals de aanwijzingen van de Pensioen- & Verzekeringskamer,
      vanwege de Pensioen- & Verzekeringskamer tegen door haar vast te stellen prijzen beschikbaar gesteld.
    url: https://wetten.overheid.nl/BWBR0006735/2002-01-01#Artikel1
  - number: '1.4'
    text: |-
      Als staten en omslagen kunnen ook andere formulieren worden gebruikt, mits deze naar indeling en inhoud geen - en
      wat betreft hun formaat geen wezenlijke - afwijking vertonen van de vastgestelde modellen, met dien verstande dat
      de tekst op de voorzijde van deze modellen niet behoeft te worden overgenomen indien de voorgeschreven aanduiding
      van de verzekeraar wordt opgenomen in het hoofd van de staat en de voorgeschreven ondertekening en waarmerking
      plaatsvinden aan het einde van de staat.
    url: https://wetten.overheid.nl/BWBR0006735/2002-01-01#Artikel1
  - number: '1.5'
    text: |-
      De Pensioen- & Verzekeringskamer kan toestaan dat als staten en omslagen ook andere informatiedragers worden
      gebruikt, mits deze naar indeling en inhoud geen afwijking vertonen van de vastgestelde modellen. Zij kan
      daarbij, in afwijking van [artikel 2, eerste en tweede lid][ref1], nadere regels stellen ter zake van de wijze van
      indiening, ondertekening en waarmerking.


      [ref1]: https://wetten.overheid.nl/BWBR0006735#Artikel2
    url: https://wetten.overheid.nl/BWBR0006735/2002-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006735
        artikel: '2'
  - number: '2.1'
    text: |-
      De staten worden met de verklaring omtrent de getrouwheid
      bedoeld in de [artikelen 72a, eerste lid, eerste volzin][ref1],
      of [100a, eerste lid, eerste volzin, van de Wet toezicht verzekeringsbedrijf 1993][ref2], in de bij de staten
      behorende omslag bij de Pensioen- & Verzekeringskamer ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel72a
      [ref2]: https://wetten.overheid.nl/BWBR0006509#Artikel100a
    url: https://wetten.overheid.nl/BWBR0006735/2002-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006509
        artikel: 72a
      - id: ref2
        bwb_id: BWBR0006509
        artikel: 100a
  - number: '2.2'
    text: |-
      De door een verzekeraar met zetel in Nederland in te dienen staten worden ondertekend door het bestuur. Bestaat
      het bestuur uit meer dan twee personen, dan zijn de handtekeningen van twee bestuursleden voldoende. De door een
      verzekeraar met zetel buiten de Unie in te dienen staten worden ondertekend door de vertegenwoordiger, bedoeld in
      artikel 1, eerste lid, onderdeel *s*, van de [Wet toezicht verzekeringsbedrijf 1993][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006509
    url: https://wetten.overheid.nl/BWBR0006735/2002-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006509
  - number: '2.3'
    text: |-
      Staten die niet van toepassing zijn voor de verzekeraar behoeven niet te worden ingediend. Bij verschil van mening
      hierover beslist de Pensioen- & Verzekeringskamer.
    url: https://wetten.overheid.nl/BWBR0006735/2002-01-01#Artikel2
  - number: '2.4'
    text: |-
      De Pensioen- & Verzekeringskamer kan aan een verzekeraar ontheffing verlenen van de invulling en indiening van
      op hem van toepassing zijnde staten of van de invulling en indiening van bepaalde gedeelten daarvan. Aan een
      ontheffing kunnen voorwaarden worden verbonden en zij kan worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0006735/2002-01-01#Artikel2
  - number: '3'
    text: Bijvoeging van posten of rubrieken in de staten is niet geoorloofd, tenzij dit in de modellen is voorzien.
    url: https://wetten.overheid.nl/BWBR0006735/2002-01-01#Artikel3
  - number: '4'
    text: |-
      De staten van een verzekeraar met zetel buiten de Unie mogen uitsluitend de gegevens bevatten die betrekking hebben
      op het verzekeringsbedrijf uitgeoefend vanuit de bijkantoren in Nederland.
    url: https://wetten.overheid.nl/BWBR0006735/2002-01-01#Artikel4
  - number: '5'
    text: |-
      Vergezeld van de verklaring omtrent de getrouwheid, bedoeld in de [artikelen 72a, eerste lid, eerste volzin][ref1],
      of [100a, eerste lid, eerste volzin, van de Wet toezicht verzekeringsbedrijf 1993][ref2], worden openbaar gemaakt:
        - voor het schadeverzekeringsbedrijf: de staten 100, 101, 110, 111, 200 of 200.1, 201 of 201.1, 210, 211, 212 en
      400;
        - voor het levensverzekeringsbedrijf: de staten 100, 101, 110, 111, 200, 201, 210, 211, 212, 220, 221, 222, 223,
      400, 500 en 510.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel72a
      [ref2]: https://wetten.overheid.nl/BWBR0006509#Artikel100a
    url: https://wetten.overheid.nl/BWBR0006735/2002-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0006509
        artikel: 72a
      - id: ref2
        bwb_id: BWBR0006509
        artikel: 100a
  - number: 5a.1
    text: |-
      Het bedrag van de boete, bedoeld in
      [artikel 188d, vijfde lid, eerste volzin, van de Wet toezicht verzekeringsbedrijf 1993][ref1], wordt bepaald op de
      wijze, voorzien in [bijlage B][ref2] bij dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel188d
      [ref2]: https://wetten.overheid.nl/BWBR0006735
    url: https://wetten.overheid.nl/BWBR0006735/2002-01-01#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0006509
        artikel: 188d
      - id: ref2
        bwb_id: BWBR0006735
  - number: 5a.2
    text: |-
      De Pensioen- & Verzekeringskamer kan het bedrag van de boete lager stellen dan in [bijlage B][ref1] is bepaald,
      indien het bedrag van de boete in een bepaald geval op grond van bijzondere omstandigheden onevenredig hoog is.


      [ref1]: https://wetten.overheid.nl/BWBR0006735
    url: https://wetten.overheid.nl/BWBR0006735/2002-01-01#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0006735
  - number: '6'
    text: |-
      De ingevolge dit besluit in te dienen staten worden voor de eerste maal ingediend over het in 1995 geëindigde
      boekjaar.
    url: https://wetten.overheid.nl/BWBR0006735/2002-01-01#Artikel6
  - number: '7.1'
    text: |-
      Ten aanzien van de staten over het in 1994 geëindigde boekjaar, blijft het bepaalde bij en krachtens het
      Statenbesluit schade- en levensverzekeringsbedrijf van toepassing.
    url: https://wetten.overheid.nl/BWBR0006735/2002-01-01#Artikel7
  - number: '7.2'
    text: |-
      Een verzekeraar met zetel in een andere lid-staat dan Nederland dient de staten over het in 1994 geëindigde
      boekjaar die betrekking hebben op de bijkantoren in Nederland, vóór 1 juli 1995 bij de Pensioen- &
      Verzekeringskamer in. De Pensioen- & Verzekeringskamer zendt deze staten onverwijld aan de toezichthoudende
      autoriteit van de lid-staat waar de verzekeraar zijn zetel heeft.
    url: https://wetten.overheid.nl/BWBR0006735/2002-01-01#Artikel7
  - number: '8'
    text: Dit besluit treedt in werking met ingang van 1 juli 1994.
    url: https://wetten.overheid.nl/BWBR0006735/2002-01-01#Artikel8
  - number: '9'
    text: 'Dit besluit wordt aangehaald als: Besluit staten verzekeringsbedrijf 1994.'
    url: https://wetten.overheid.nl/BWBR0006735/2002-01-01#Artikel9
