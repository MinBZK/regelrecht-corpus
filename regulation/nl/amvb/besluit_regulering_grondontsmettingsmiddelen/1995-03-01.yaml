preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Landbouw, Natuurbeheer en Visserij van 16 december 1992, No. J. 9219
    659, Directie Juridische en Bedrijfsorganisatorische Zaken, gedaan in overeenstemming met de Staatssecretaris van
    Welzijn, Volksgezondheid en Cultuur, Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer en
    Onze Minister van Sociale Zaken en Werkgelegenheid;

    Gelet op artikel 13, eerste lid, van de Bestrijdingsmiddelenwet 1962;

    Gezien het advies van de Bestrijdingsmiddelencommissie;

    De Raad van State gehoord (advies van 10 maart 1993, No W11.93 0001);

    Gezien het nader rapport van de Staatssecretaris van Landbouw, Natuurbeheer en Visserij van 29 maart 1993,
    No. J. 933845, Directie Juridische en Bedrijfsorganisatorische Zaken, uitgebracht in overeenstemming met de
    Staatssecretaris van Welzijn, Volksgezondheid en Cultuur, Onze Minister van Volkshuisvesting, Ruimtelijke Ordening
    en Milieubeheer en Onze Minister van Sociale Zaken en Werkgelegenheid;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0005949/1995-03-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      Onze Minister: Onze Minister van Landbouw, Natuurbeheer en Visserij;

      handel: het als uitoefening van een bedrijf aan- en verkopen van bestrijdingsmiddelen;

      grondontsmettingsmiddel: ingevolge [artikel 4 van de Bestrijdingsmiddelenwet 1962][ref1] toegelaten
      gewasbeschermingsmiddel dat tenminste dichloorpropeen, cis-dichloorpropeen of metam-natrium bevat;

      gebruiksgerechtigde: eigenaar van een perceel of perceelsgedeelte, degeen die een goederenrechtelijk gebruiksrecht
      op een perceel of perceelsgedeelte heeft of degeen die het gebruikersrecht van een perceel of perceelsgedeelte op
      basis van een door de grondkamer goedgekeurde pachtovereenkomst heeft;

      loonontsmettingsbedrijf: het als uitoefening van een bedrijf ten behoeve van derden gebruiken van een
      grondontsmettingsmiddel.


      [ref1]: https://wetten.overheid.nl/BWBR0002380#Artikel4
    url: https://wetten.overheid.nl/BWBR0005949/1995-03-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002380
        artikel: '4'
  - number: '2'
    text: |-
      1 Het is verboden een grondontsmettingsmiddel voorhanden of in voorraad te hebben zonder of in strijd met een
      daarbij behorende vergunning als bedoeld in [artikel 5, eerste lid][ref1].

      2 Het eerste lid is niet van toepassing ten aanzien van fabrikanten, importeurs en handelaren indien het
      grondontsmettingsmiddel kennelijk voor de handel is bestemd.

      3 Het eerste lid is niet van toepassing ten aanzien van een loonontsmettingsbedrijf mits deze een administratie
      bijhoudt op een door Onze betrokken Minister bij ministeriële regeling vastgestelde wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0005949#Artikel5
    url: https://wetten.overheid.nl/BWBR0005949/1995-03-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005949
        artikel: '5'
  - number: '3'
    text: |-
      Het is verboden een grondontsmettingsmiddel te gebruiken of door middel van derden te gebruiken zonder of in strijd
      met een daarbij behorende vergunning als bedoeld in [artikel 5, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005949#Artikel5
    url: https://wetten.overheid.nl/BWBR0005949/1995-03-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005949
        artikel: '5'
  - number: '4'
    text: |-
      1 Het is verboden een grondontsmettingsmiddel af te leveren zonder een gewaarmerkte kopie van de daarbij behorende
      vergunning in ontvangst te nemen.

      2 Het is verboden een grondontsmettingsmiddel af te leveren in strijd met de gewaarmerkte kopie van de daarbij
      behorende vergunning.

      3 Het eerste en tweede lid zijn niet van toepassing ten aanzien van fabrikanten, importeurs en handelaren indien
      het grondontsmettingsmiddel kennelijk ter aflevering aan de handel of aan een loonontsmettingsbedrijf is bestemd.
    url: https://wetten.overheid.nl/BWBR0005949/1995-03-01#Artikel4
  - number: '5'
    text: |-
      1 Indien aan het bepaalde bij of krachtens dit besluit is voldaan, verleent Onze Minister op aanvraag van de
      gebruiksgerechtigde ten behoeve van zijn perceel of perceelsgedeelte betreffende een grondontsmettingsmiddel een
      vergunning alsmede een gewaarmerkte kopie daarvan.

      2 Tot 1 januari 2001 kan slechts éénmaal in een periode van vier kalenderjaren en vanaf 1 januari 2001 éénmaal in
      een periode van vijf kalenderjaren ten behoeve van hetzelfde perceel of perceelsgedeelte een vergunning alsmede een
      gewaarmerkte kopie daarvan worden verleend.

      3 De periodes van vier kalenderjaren beginnen op 1 mei 1993 onderscheidenlijk 1 januari 1997 en eindigen op 31
      december 1996 onderscheidenlijk 31 december 2000. De eerste periode van vijf kalenderjaren begint op 1 januari
      2001. De periodes van vijf kalenderjaren beginnen en eindigen telkens op 1 januari onderscheidenlijk 31 december.

      4 Indien de gebruiksgerechtigde een grondontsmettingsmiddel waarvoor een vergunning is verleend, niet heeft
      gebruikt en die vergunning alsmede de gewaarmerkte kopie binnen één maand na afloop van de geldigheidsduur
      daarvan aan Onze Minister terug stuurt, wordt in afwijking van het tweede lid, op aanvraag in dezelfde periode,
      bedoeld in het tweede lid, opnieuw ten behoeve van hetzelfde perceel of perceelsgedeelte een vergunning alsmede de
      gewaarmerkte kopie verleend.

      5 Indien de gebruiksgerechtigde in het laatste jaar van een periode als bedoeld in het tweede lid, een
      grondontsmettingsmiddel waarvoor een vergunning in dat jaar is verleend, niet heeft gebruikt en die vergunning
      alsmede de gewaarmerkte kopie binnen één maand na afloop van de geldigheidsduur daarvan aan Onze Minister terug
      stuurt, wordt, in afwijking van het tweede lid, op aanvraag in het eerste jaar van de daaropvolgende periode een
      vergunning alsmede de gewaarmerkte kopie voor hetzelfde perceel of perceelsgedeelte verleend, waarbij in laatst
      bedoelde periode alsnog het recht op een vergunning voor hetzelfde perceel of perceelsgedeelte blijft behouden.
    url: https://wetten.overheid.nl/BWBR0005949/1995-03-01#Artikel5
  - number: '6'
    text: |-
      1 Onze betrokken Minister kan bij ministeriële regeling voor daarbij aan te wijzen teelten,
      teeltwijzen, grondsoorten, inrichting of ligging van het perceel of perceelsgedeelte afwijken van
      [artikel 5, tweede en derde lid][ref1]. Onze betrokken Minister kan daarbij nadere voorwaarden stellen voor het in
      aanmerking komen voor een vergunning.

      2 In afwijking van [artikel 5, tweede lid][ref2], verleent Onze Minister op aanvraag van de gebruiksgerechtigde een
      of meer vergunningen:

      a. ten behoeve van een door Onze Minister aangewezen teelt voor een bepaald perceel of perceelsgedeelte waarin door
      Onze Minister aangewezen schadelijke organismen ten genoegen van Onze Minister door de gebruiksgerechtigde zijn
      aangetoond of;

      b. indien, ten behoeve van de vergroting van landbouwkundige kennis door onderzoek, voor een bepaald perceel of
      perceelsgedeelte de aanvraag wordt vergezeld van een onderzoeksplan dat voldoet aan door Onze betrokken Minister
      bij ministeriële regeling vastgestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0005949#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005949#Artikel5
    url: https://wetten.overheid.nl/BWBR0005949/1995-03-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005949
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005949
        artikel: '5'
  - number: '7'
    text: |-
      Een vergunning wordt niet verleend ter bestrijding van een bij ministeriële regeling aan te wijzen organisme
      indien de aanwezigheid van dat organisme niet ten genoegen van Onze Minister op het perceel of perceelsgedeelte ten
      behoeve waarvan de vergunning wordt aangevraagd, is aangetoond.
    url: https://wetten.overheid.nl/BWBR0005949/1995-03-01#Artikel7
  - number: '8'
    text: |-
      1 De vergunning, bedoeld in [artikel 5, eerste lid][ref1], behelst in ieder geval:

      a. de naam en het adres van de gebruiksgerechtigde;

      b. het betreffende perceel of perceelgedeelte en de oppervlakte daarvan;

      c. de teelt of categorie teelten ten behoeve waarvan de vergunning is aangevraagd;

      d. ingeval het een teelt betreft zoals bedoeld in het tweede lid, de periode waarbinnen de teelt een aanvang moet
      hebben genomen;

      e. voor zover van toepassing het organisme, bedoeld in [artikel 7][ref2], ter bestrijding waarvan de vergunning
      is aangevraagd;

      f. de periode waarbinnen op basis van die vergunning de ontsmetting moet hebben plaatsgevonden.

      2 Aan de vergunning kan het voorschrift worden verbonden dat met een door Onze betrokken Minister aangewezen teelt
      een aanvang moet zijn genomen binnen één jaar na afloop van de geldigheidsduur van de vergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0005949#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005949#Artikel7
    url: https://wetten.overheid.nl/BWBR0005949/1995-03-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0005949
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005949
        artikel: '7'
  - number: '9'
    text: |-
      1 Onze betrokken Minister stelt regelen omtrent het indienen van een aanvraag voor een vergunning, de daarbij
      te verstrekken gegevens, de wijze van behandeling en verlening van de vergunning en omtrent de geldigheidsduur
      daarvan.

      2 In ieder geval betreffen de te verschaffen gegevens, bedoeld in het eerste lid, ten behoeve van de aanvraag voor
      een vergunning:

      a. de naam en het adres van de gebruiksgerechtigde;

      b. een op een kaart op schaal weergegeven aanduiding van het perceel of perceelsgedeelte en de oppervlakte daarvan;

      c. de teelt, ten behoeve waarvan de vergunning wordt aangevraagd.
    url: https://wetten.overheid.nl/BWBR0005949/1995-03-01#Artikel9
  - number: '10'
    text: |-
      De vergunning onderscheidenlijk de gewaarmerkte kopie daarvan dient gedurende een periode van vijf kalenderjaren
      door de gebruiksgerechtigde onderscheidenlijk het loonontsmettingsbedrijf of de handelaar te worden bewaard.
    url: https://wetten.overheid.nl/BWBR0005949/1995-03-01#Artikel10
  - number: '11'
    text: |-
      [Artikel 2][ref1] van dit besluit is tot 1 januari 1994 niet van toepassing op degene die een
      grondontsmettingsmiddel voorhanden of in voorraad heeft indien hij op de wijze vast te stellen bij regeling van
      Onze betrokken Minister vóór 1 juni 1993 aantoont dat hij dat grondontsmettingsmiddel vóór 1 mei 1993 in zijn bezit
      heeft gekregen.


      [ref1]: https://wetten.overheid.nl/BWBR0005949#Artikel2
    url: https://wetten.overheid.nl/BWBR0005949/1995-03-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0005949
        artikel: '2'
  - number: '12'
    text: |-
      Op bij ministeriële regeling aan te geven wijze geeft de handelaar vóór 1 juni 1993 aan Onze Minister naar waarheid
      op de hoeveelheid van elk grondontsmettingsmiddel dat hij op 1 mei 1993 in voorraad of voorhanden heeft.
    url: https://wetten.overheid.nl/BWBR0005949/1995-03-01#Artikel12
  - number: '13'
    text: Dit besluit treedt in werking met ingang van 1 mei 1993.
    url: https://wetten.overheid.nl/BWBR0005949/1995-03-01#Artikel13
  - number: '14'
    text: 'Dit besluit kan aangehaald worden als: Besluit regulering grondontsmettingsmiddelen.'
    url: https://wetten.overheid.nl/BWBR0005949/1995-03-01#Artikel14
