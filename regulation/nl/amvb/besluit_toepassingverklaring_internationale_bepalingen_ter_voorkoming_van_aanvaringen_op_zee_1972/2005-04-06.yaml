        artikel: '4'
  - number: '2'
    text: |-
      Voor de toepassing van dit besluit geldt de Nederlandse vertaling van de Internationale Bepalingen ter voorkoming
      van aanvaringen op zee, 1972, zoals bekend gemaakt in het *Tractatenblad*.
    url: https://wetten.overheid.nl/BWBR0004644/2005-04-06#Artikel2
  - number: '3'
    text: |-
      1 Onze minister is bevoegd aanvullende of afwijkende voorschriften, bedoeld in Voorschrift 1, onder *c* en *e*, van
      de Internationale Bepalingen ter voorkoming van aanvaringen op zee, 1972, vast te stellen.

      2 Onze minister maakt de verkeersscheidingsstelsels, bedoeld in Voorschrift 1, onder *d*, van de Internationale
      Bepalingen ter voorkoming van aanvaringen op zee, 1972, bekend in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0004644/2005-04-06#Artikel3
  - number: '4'
    text: |-
      1 De in [artikel 1, eerste lid][ref1], bedoelde lijn loopt langs de zuidwestelijke grens van de Eemsmonding zoals
      omschreven in het Eems-Dollardverdrag (*Trb.* 1960, 69) tot het punt waar zij wordt gesneden door de lijn die
      loopt van de Grote Kaap op Rottumeroog (53°32'.7 N, 06°34'.7 O) over de lichttoren op Schiermonnikoog (53°29'.2 N,
      06°08'.9 O) naar de Oostkaap op Ameland (53°27'.8 N, 05°55'.8 O), vervolgens van de lichttoren op Ameland (53°27'.0
      N, 05°37'.6 O) naar de Noordkaap op Terschelling (53°26'.6 N, 05°32'.8 O), voorts van de lichttoren Brandaris op
      Terschelling (53°21'.7 N, 05°12'.8 O) naar de lichttoren Vuurduin op Vlieland (53°17'.8 N, 05°03'.6 O), dan van
      paal 35 ZW op Vlieland (53°13'.3 N, 04°52'.2 O) naar de lichttoren Eierland op Texel (53°11'.0 N, 04°51'.4 O),
      vervolgens van paal Onrust Z op Texel (52°59'.6 N, 04°43'.7 O) naar de lichttoren Kijkduin bij Den Helder (52°57'.4
      N, 04°43'.7 O), vandaar langs de Noord- en Zuidhollandse kustlijn en de kustlijn van de Maasvlakte, van Voorne,
      Goeree, Schouwen, Noord-Beveland en Walcheren - en van de dammen daartussen - tot het snijpunt van de kustlijn van
      Walcheren met de lijn over de kerktorens van Aagtekerke en Domburg, vandaar tot de positie 51°37'.0 N, 03°27'.2
      O, vandaar tot de positie 51°35'.6 N, 03°23'.3 O, vandaar tot de positie 51°34'.0 N, 03°22'.2 O, vandaar tot de
      positie 51°24'.7 N, 03°17'.9 O, en vandaar naar grenspaal 369 op de grens tussen Nederland en België. De lijn loopt
      over de zeehoofden van de havens.

      2 De in het eerste lid beschreven lijn is aangegeven op de bij dit besluit gevoegde kaart.


