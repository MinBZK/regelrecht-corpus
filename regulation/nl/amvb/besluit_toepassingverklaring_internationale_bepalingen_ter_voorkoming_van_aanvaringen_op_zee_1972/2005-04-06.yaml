preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Verkeer en Waterstaat van 21 juli 1989, nr. S/J 31.149/89, Directoraat-
    Generaal Scheepvaart en Maritieme Zaken, Hoofdafdeling Wetgeving en Juridische Zaken;

    Overwegende dat het noodzakelijk is uitvoering te geven aan de Internationale Bepalingen ter voorkoming van
    aanvaringen op zee, 1972, bedoeld in artikel 1 van het op 20 oktober 1972 te Londen tot stand gekomen Verdrag
    inzake de Internationale Bepalingen ter voorkoming van aanvaringen op zee, 1972, (Trb. 1974, 51) zoals gewijzigd;

    Gelet op de artikelen 4, 20 en 31, tiende lid, van de Scheepvaartverkeerswet (Stb. 1988, 352);

    De Raad van State gehoord (advies van 27 september 1989, nr. W09.89.0439);

    Gezien het nader rapport van Onze Minister van Verkeer en Waterstaat van 6 november 1989, nr. S/J 31.839/89,
    Directoraat-Generaal Scheepvaart en Maritieme Zaken, Hoofdafdeling Wetgeving en Juridische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0004644/2005-04-06#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 De voor Nederland van kracht zijnde Internationale Bepalingen ter voorkoming van aanvaringen op zee, 1972,
      bedoeld in artikel 1 van het op 20 oktober 1972 te Londen tot stand gekomen Verdrag inzake de Internationale
      Bepalingen ter voorkoming van aanvaringen op zee, 1972, (*Trb.* 1974, 51) zoals gewijzigd, zijn van toepassing op:

      a. alle schepen die in Nederland zijn geregistreerd of die gerechtigd zijn de Nederlandse vlag te voeren, met
      uitzondering van schepen die het recht daartoe ontlenen aan de regels die in de Nederlandse Antillen of in Aruba
      terzake gelden:

      1°. in volle zee;

      2°. in de Nederlandse territoriale zee waaronder begrepen de wateren zeewaarts van de in [artikel 4][ref1]
      vastgestelde lijn;

      3°. op alle niet-Nederlandse wateren die met de volle zee in verbinding staan en bevaarbaar zijn voor zeegaande
      schepen;

      b. alle andere schepen in de Nederlandse territoriale zee waaronder begrepen de wateren zeewaarts van de in
      [artikel 4][ref2] vastgestelde lijn.

      2 Het bepaalde in het eerste lid, aanhef en onder *a*, ten 2° en onder *b*, is niet van toepassing voor zover
      bij of krachtens de wet dan wel bij of krachtens een voor Nederland van kracht zijnd verdrag of besluit van een
      volkenrechtelijke organisatie afwijkende voorschriften zijn vastgesteld.

      3 Het bepaalde in het eerste lid, aanhef en onder *a*, ten 3°, is niet van toepassing voor zover door de daartoe
      bevoegde autoriteiten afwijkende voorschriften voor bedoelde wateren zijn vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004644#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0004644#Artikel4
    url: https://wetten.overheid.nl/BWBR0004644/2005-04-06#Artikel1
