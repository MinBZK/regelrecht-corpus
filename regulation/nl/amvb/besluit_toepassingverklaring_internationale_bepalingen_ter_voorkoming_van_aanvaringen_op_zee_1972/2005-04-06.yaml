    text: |-
      1 Overtreding van de tot de Internationale Bepalingen ter voorkoming van aanvaringen op zee, 1972, behorende
      Voorschriften 2, onder *a*, 5 tot en met 7, 8 onder *a, b* en *d* tot en met *f*, 9, 10 onder *b* tot en met *j*,
      12 onder *a*, 13 onder *a, c* en *d*, 14 onder *a* en *c*, 15 tot en met 18, 19 onder *b* tot en met *e*, 22 tot en
      met 24, 25 onder *a* en *c* tot en met *e*, 26 onder *a* tot en met *c* en *e*, 27 onder *a* tot en met *f*, 29, 30
      onder *a, c* en *d*, 31, 33, 34, 35 onder *a* tot en met *j*, 36 en 37, is een strafbaar feit.

      2 Onze Minister maakt de wijzigingen in de tot de Internationale Bepalingen ter voorkoming van aanvaringen op
      zee, 1972, behorende voorschriften, die gevolgen hebben voor de strafbaarheid ingevolge het eerste lid, bekend in
      de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0004644/2005-04-06#Artikel5
  - number: '6'
    text: |-
      1 Het besluit van 4 augustus 1976 (*Stb.* 773), houdende vaststelling van Bepalingen ter voorkoming van
      aanvaringen op zee, 1972, wordt ingetrokken, met dien verstande dat de krachtens dat besluit bekend gemaakte
      verkeersscheidingsstelsels worden geacht te zijn bekend gemaakt krachtens dit besluit.

      2 Het besluit van 13 mei 1981 (*Stb.* 314), houdende vaststelling van de lijn bedoeld in
      [artikel 2, tweede lid, onder a][ref1], ten 2° en onder *b*, van de Zeeaanvaringswet 1977 (*Stb.* 1979, 196), wordt
      ingetrokken.


