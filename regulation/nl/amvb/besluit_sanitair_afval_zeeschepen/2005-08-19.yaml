  - number: '6'
    text: >-
      1 Het Internationaal certificaat van voorkoming van verontreiniging door sanitair afval wordt door de inspecteur-
      generaal afgegeven voor een periode van ten hoogste vijf jaar.


      2 In afwijking van het eerste lid is, indien het hernieuwde onderzoek binnen drie maanden voor de vervaldatum
      van het bestaande certificaat wordt voltooid, het nieuwe certificaat geldig vanaf de datum van voltooiing van dit
      onderzoek tot een datum niet later dan vijf jaar na de vervaldatum van het bestaande certificaat.


      3 Indien het hernieuwde onderzoek wordt voltooid na de vervaldatum van het bestaande certificaat, is het nieuwe
      certificaat geldig vanaf de datum van voltooiing van dit onderzoek tot een datum niet later dan vijf jaar na de
      vervaldatum van het bestaande certificaat.


      4 Indien het hernieuwde onderzoek meer dan drie maanden voor de vervaldatum van het bestaande certificaat wordt
      voltooid, is het nieuwe certificaat geldig vanaf de datum van voltooiing van dit onderzoek tot een datum niet later
      dan vijf jaar daarna.


      5 Indien een hernieuwd onderzoek wordt voltooid en geen nieuw certificaat ten behoeve van het schip kan worden
      afgegeven vóór de vervaldatum van het bestaande certificaat, kan de inspecteur-generaal daarvan een aantekening op
      het bestaande certificaat plaatsen. In afwijking van het eerste lid wordt in dat geval de geldigheidsduur van het
      certificaat verlengd voor een periode van niet langer dan vijf maanden na de vervaldatum.


      6 In afwijking van het eerste lid kan, indien het schip zich op het tijdstip waarop het certificaat zijn geldigheid
      verliest niet in een haven bevindt waar het hernieuwde onderzoek kan plaatsvinden, de inspecteur-generaal de
      geldigheidsduur van het certificaat verlengen voor een periode van ten hoogste drie maanden na de vervaldatum,
      uitsluitend om het schip in staat te stellen de reis naar de haven waar het moet worden onderzocht te voltooien. Na
      de voltooiing van het hernieuwde onderzoek in die haven is het nieuwe certificaat geldig tot een datum niet later
      dan vijf jaar na de oorspronkelijke vervaldatum van het bestaande certificaat.


      7 In afwijking van het eerste lid kan, indien een certificaat is afgegeven ten behoeve van een schip dat korte
      reizen maakt en de geldigheidsduur van het certificaat niet is verlengd op grond van een van de andere leden, de
      inspecteur-generaal de geldigheidsduur van het certificaat verlengen voor een periode van ten hoogste een maand na
      de vervaldatum. Na de voltooiing van het hernieuwde onderzoek is het nieuwe certificaat geldig tot een datum niet
      later dan vijf jaar na de oorspronkelijke vervaldatum van het bestaande certificaat.


      8 In bijzondere omstandigheden, vastgesteld door de inspecteur-generaal, behoeft een nieuw certificaat niet te
      worden gedateerd vanaf de vervaldatum van het bestaande certificaat. Na de voltooiing van het hernieuwde onderzoek
      in deze bijzondere omstandigheden is het nieuwe certificaat geldig tot een datum niet later dan vijf jaar na de
      datum van voltooiing van het hernieuwde onderzoek.
    url: https://wetten.overheid.nl/BWBR0018625/2005-08-19#Artikel6
  - number: '7'
    text: >-
      1 Het certificaat kan door de inspecteur-generaal worden ingetrokken:


      a. wanneer het schip schade van betekenis heeft opgelopen en de herstelling daarvan niet naar behoren is geschied,
      of


      b. wanneer uit een onderzoek van de bevoegde ambtenaar van de divisie Scheepvaart is gebleken dat het schip niet
      zonder gevaar voor verontreiniging van het mariene milieu de haven kan verlaten.


      Van de intrekking wordt de eigenaar bericht gezonden onder vermelding van de redenen welke tot de intrekking hebben
      geleid.


      2 Een vervallen of ingetrokken certificaat moet door de eigenaar zo spoedig mogelijk aan de inspecteur-generaal
      worden ingezonden door tussenkomst van ambtenaren van de divisie Scheepvaart, de ambtenaren met de in- of
      uitklaring belast, dan wel de Nederlandse diplomatieke of consulaire ambtenaren.


      3 Voor een ingezonden certificaat wordt desverlangd een bewijs van ontvangst afgegeven.
    url: https://wetten.overheid.nl/BWBR0018625/2005-08-19#Artikel7
  - number: '8'
    text: >-
      1 Elk schip is voorzien van:


      a. een behandelingsinstallatie voor sanitair afval die is voorzien van het merk van overeenstemming, bedoeld in
      artikel 11 van [richtlijn nr. 96/98/EG](31996L0098) van de Raad van de Europese Unie van 20 december 1996 inzake
      uitrusting van zeeschepen (PbEG 1997, L 46),


      b. een door de inspecteur-generaal goedgekeurd systeem voor de versnijding en ontsmetting van sanitair afval,
      alsmede voorzieningen voor de tijdelijke opslag van sanitair afval wanneer het schip minder dan 3 zeemijlen van het
      dichtstbijzijnde land is, of


      c. een naar het oordeel van de inspecteur-generaal geschikte verzameltank met voldoende capaciteit voor de opslag
      van al het sanitair afval, afhankelijk van de reizen van het schip, het aantal personen aan boord en andere
      relevante factoren.


      2 De omvang van de inhoud van de in het eerste lid, onderdeel c, bedoelde verzameltank moet visueel kunnen worden
      vastgesteld.


      3 Aan boord van een schip dat zich in het Antarctisch gebied bevindt zijn één of meer verzameltanks aanwezig met
      voldoende capaciteit voor het opslaan van sanitair afval.
    url: https://wetten.overheid.nl/BWBR0018625/2005-08-19#Artikel8
  - number: '9'
    text: |-
      1 De leidingen van ontvangstvoorzieningen en de scheepsleidingen bestemd voor afgifte van sanitair afval zijn
      uitgerust met een standaardaansluiting voor afgifte, overeenkomstig de volgende tabel:








                    Omschrijving


                    Afmeting






                    Uitwendige flensdiameter


                    210 mm




                    Inwendige flensdiameter


                    Overeenkomstig de uitwendige flensdiameter van de pijp




                    Diameter van de steekcirkel van de bouten


                    170 mm




                    Boutgaten


                    4 gaten van 18 mm diameter, op onderling gelijke afstand aangebracht op een steekcirkel van
      bovengenoemde diameter, met sleuven radiaal doorgetrokken tot de omtrek; sleufbreedte: 18 mm




                    Flensdikte


                    16 mm




                    Bouten en moeren: hoeveelheid en diameter


                    4, elk van 16 mm diameter en van voldoende lengte




                    De flens is zo ontworpen dat er pijpleidingen op kunnen worden aangesloten met een inwendige diameter
      van ten hoogste 100 mm; deze flens is van staal of een ander gelijkwaardig materiaal en is voorzien van een vlakke
      voorzijde. Deze flens is, tezamen met een passende pakking, geschikt voor een werkdruk van 600 kPa.






      2 Schepen waarvan de holte na de mal niet groter is dan 5 m mogen zijn voorzien van een standaardaansluiting met
      een inwendige flensdiameter van 38 mm.

      3 Voor schepen die varen in bepaalde diensten, zoals veerdiensten voor passagiers, kan de inspecteur-generaal een
      alternatieve aansluiting toestaan, zoals snelkoppelingen.
    url: https://wetten.overheid.nl/BWBR0018625/2005-08-19#Artikel9
  - number: '10'
    text: |-
      1 Het is verboden:

      a. sanitair afval in zee te lozen, of

      b. in het Antarctisch gebied sanitair afval te lozen binnen 12 zeemijlen van het land of van ijsplaten.

      2 Het eerste lid, aanhef en onderdeel a, is niet van toepassing op:

      a. het lozen door middel van een behandelingsinstallatie voor sanitair afval als bedoeld in
      [artikel 8, eerste lid, onderdeel a][ref1], waarvan de testresultaten zijn opgenomen in het Internationaal
      certificaat van voorkoming van verontreiniging door sanitair afval en de geloosde vloeistof geen zichtbare
      drijvende vaste deeltjes of verkleuring van het water ten gevolge heeft;

      b. het lozen van versneden en ontsmet sanitair afval door middel van een goedgekeurd systeem als bedoeld in
      [artikel 8, eerste lid, onderdeel b][ref2], op een afstand van meer dan 3 zeemijlen of niet-versneden en niet-
      ontsmet sanitair afval op een afstand van meer dan 12 zeemijlen van het dichtstbijzijnde land;

      c. het lozen vanaf een schip dat zich in wateren binnen de jurisdictie van een andere staat bevindt en plaatsvindt
      in overeenstemming met de voorschriften van die staat welke minder streng zijn dan de voorschriften, opgenomen in
      dit besluit.

      3 Het eerste lid, aanhef en onderdeel b, is niet van toepassing op het lozen door middel van een
      behandelingsinstallatie voor sanitair afval als bedoeld in [artikel 8, eerste lid, onderdeel a][ref3], waarvan de
      testresultaten zijn opgenomen in het Internationaal certificaat van voorkoming van verontreiniging door sanitair
      afval en de geloosde vloeistof geen zichtbare drijvende vaste deeltjes of verkleuring van het water ten gevolge
      heeft.

      4 Het lozen van sanitair afval als bedoeld in het tweede lid, onderdeel b, vanuit een verzameltank, geschiedt
      in een matig tempo waarbij het schip de vaarroute vervolgt met een snelheid van ten minste vier knopen. Bij
      ministeriële regeling kunnen regels worden gesteld omtrent het tempo.

      5 Het lozen van sanitair afval vanuit een verzameltank in het Antarctisch gebied op een afstand van ten minste 12
      zeemijlen van het land of van ijsplaten geschiedt in een matig tempo waarbij het schip, voor zover mogelijk, de
      vaarroute vervolgt met een snelheid van ten minste vier knopen.

      6 Indien het sanitair afval is vermengd met afval of afvalwater waarvoor op grond van
      [artikel 5 van de Wet voorkoming verontreiniging door schepen][ref4] andere voorschriften voor het lozen van
      toepassing zijn, dient tevens te worden voldaan aan die voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0018625#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0018625#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0018625#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0003642#Artikel5
