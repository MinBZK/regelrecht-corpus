    text: |-
      1 Elk schip is onderworpen aan:

      a. een eerste onderzoek dat wordt verricht voordat het schip in dienst wordt gesteld of voordat het certificaat,
      bedoeld in [artikel 4][ref1], voor de eerste maal wordt uitgegeven, en dat een volledig onderzoek van de bouw,
      uitrusting, systemen, onderdelen, voorzieningen en materialen van het schip omvat teneinde na te gaan of wordt
      voldaan aan de regels bij of krachtens dit besluit gesteld;

      b. een hernieuwd onderzoek dat wordt verricht met door de inspecteur-generaal vast te stellen tussenpozen die,
      behoudens indien [artikel 6, tweede, vijfde of zesde lid][ref2], van toepassing is, niet langer dan vijf jaar zijn
      en dat de bouw, uitrusting, systemen, onderdelen, voorzieningen en materialen van het schip omvat teneinde na te
      gaan of wordt voldaan aan de regels bij of krachtens dit besluit gesteld, en

      c. een aanvullend onderzoek dat afhankelijk van de omstandigheden hetzij geheel, hetzij gedeeltelijk wordt
      verricht indien een herstelling is uitgevoerd op grond van een onderzoek als bedoeld in het vijfde lid, of
      indien belangrijke reparaties of vernieuwingen hebben plaatsgevonden, waarbij wordt nagegaan of de noodzakelijke
      reparaties of vernieuwingen deugdelijk zijn uitgevoerd, het materiaal en het vakmanschap waarmee deze reparaties en
      vernieuwingen zijn uitgevoerd in alle opzichten voldoende zijn en wordt voldaan aan de regels bij of krachtens dit
      besluit gesteld.

      2 Bij ministeriële regeling worden regels gesteld ten aanzien van onderzoeken van andere schepen dan die, bedoeld
      in [artikel 2, eerste lid][ref3]. Op verzoek van de reder geeft de inspecteur-generaal ten aanzien van dergelijke
      onderzoeken een verklaring af.

      3 De toestand van het schip en de uitrusting ervan worden gehandhaafd in overeenstemming met de regels bij of
      krachtens dit besluit gesteld om zeker te stellen dat het schip in alle opzichten geschikt blijft tot het verlaten
      van een haven zonder dat het een gevaar vormt voor verontreiniging van het mariene milieu.

      4 Nadat een onderzoek als bedoeld in het eerste en tweede lid is voltooid wordt zonder de toestemming van de
      inspecteur-generaal geen verandering aangebracht in de bouw, uitrusting, systemen, onderdelen, voorzieningen en
      materialen die aan het onderzoek zijn onderworpen, tenzij het de onmiddellijke vervanging van dergelijke uitrusting
      en onderdelen betreft.

      5 Indien een schip een ongeval overkomt of indien gebreken worden geconstateerd die de hechtheid van het schip of
      de doelmatigheid of de volledigheid van de uitrusting, voorzover deze valt onder de bepalingen van dit besluit,
      in belangrijke mate beïnvloeden, meldt de kapitein of de eigenaar van het schip dit zo spoedig mogelijk aan
      de inspecteur-generaal. Indien het schip zich in een haven buiten Nederland bevindt, licht de kapitein tevens
      onmiddellijk de ter plaatse bevoegde autoriteiten in.


      [ref1]: https://wetten.overheid.nl/BWBR0018625#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0018625#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0018625#Artikel2
