  - number: '2'
    text: |-
      1 Dit besluit is van toepassing op de volgende schepen die een internationale reis maken:

      a. nieuwe schepen met een bruto-tonnage van 400 of meer;

      b. nieuwe schepen met een bruto-tonnage van minder dan 400 die gerechtigd zijn meer dan 15 personen te vervoeren;

      c. bestaande schepen met een bruto-tonnage van 400 of meer met ingang van 28 september 2008;

      d. bestaande schepen met een bruto-tonnage van minder dan 400 die gerechtigd zijn meer dan 15 personen te
      vervoeren, met ingang van 28 september 2008.

      2 In afwijking van het eerste lid:

      a. zijn de [artikelen 8, derde lid][ref1], [10, eerste lid, aanhef en onderdeel b, en vijfde lid][ref2], en
      [12][ref3] van toepassing op alle schepen die zich in het Antarctisch gebied bevinden;

      b. is [artikel 3, tweede lid][ref4], van toepassing op andere schepen dan bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0018625#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0018625#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0018625#Artikel12
      [ref4]: https://wetten.overheid.nl/BWBR0018625#Artikel3
