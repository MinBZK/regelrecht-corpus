  - number: '5'
    text: |-
      1 Op verzoek van een daartoe bevoegde buitenlandse autoriteit kan namens de inspecteur-generaal een buitenlands
      schip aan de in [artikel 3, eerste lid][ref1], genoemde onderzoeken worden onderworpen en kan ten behoeve van dat
      schip een certificaat als bedoeld in [artikel 4, eerste lid][ref2], worden afgegeven of, voorzover van toepassing,
      daarop een aantekening worden geplaatst.

      2 Een afschrift van het certificaat en een afschrift van het rapport van onderzoek worden zo spoedig mogelijk
      toegezonden aan de autoriteit die het verzoek heeft gedaan.

      3 Een krachtens het eerste lid afgegeven certificaat bevat een verklaring inhoudende dat het is afgegeven op
      verzoek van de betrokken autoriteit.


      [ref1]: https://wetten.overheid.nl/BWBR0018625#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0018625#Artikel4
