  - number: '4'
    text: |-
      1 Het Internationaal certificaat van voorkoming van verontreiniging door sanitair afval wordt door de
      inspecteur-generaal afgegeven na de voltooiing van een eerste of een hernieuwd onderzoek als bedoeld in
      [artikel 3, eerste lid, onderdelen a en b][ref1], ten behoeve van een schip dat internationale reizen maakt. Het
      model van het certificaat is het model, opgenomen in het aanhangsel bij Bijlage IV van het Verdrag.

      2 De inspecteur-generaal kan een daartoe bevoegde buitenlandse autoriteit verzoeken de onderzoeken, bedoeld in
      [artikel 3, eerste lid][ref2], uit te voeren en het certificaat, bedoeld in het eerste lid, af te geven, of,
      voorzover van toepassing, daarop een aantekening te plaatsen.

      3 Er wordt geen certificaat als bedoeld in het eerste lid afgegeven aan een schip dat gerechtigd is de vlag te
      voeren van een staat die geen partij is bij het Verdrag.

      4 Bij ministeriële regeling kunnen nadere regels worden gesteld betreffende de aanvraag tot afgifte van een
      certificaat en de daarbij over te leggen bescheiden.


      [ref1]: https://wetten.overheid.nl/BWBR0018625#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0018625#Artikel3
    url: https://wetten.overheid.nl/BWBR0018625/2005-08-19#Artikel4
