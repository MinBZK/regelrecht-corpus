  - number: '11'
    text: |-
      1 [Artikel 8, eerste lid][ref1], is niet van toepassing op de in [artikel 2, eerste lid, onderdelen c en d][ref2],
      bedoelde schepen waarvan de kiel is gelegd of waarvan de bouw zich in een soortgelijk stadium bevond vóór 2 oktober
      1983. Zij moeten zoveel als praktisch uitvoerbaar en redelijk is, zijn uitgerust met voorzieningen om het sanitair
      afval overeenkomstig [artikel 10][ref3] te kunnen lozen.

      2 [Artikel 10][ref4] is niet van toepassing op:

      a. het lozen in zee van sanitair afval indien dit noodzakelijk is om de veiligheid van het schip en opvarenden
      zeker te stellen of om mensenlevens op zee te redden, of

      b. het buiten het Antarctisch gebied lozen in zee van sanitair afval in geval van schade aan het schip of aan de
      uitrusting daarvan, mits na het ontstaan van de schade of na het ontdekken van de lozing alle redelijke voorzorgen
      zijn getroffen om de lozing te voorkomen of tot een minimum te beperken.

      3 [Artikel 10, eerste lid, aanhef en onderdeel b, en vijfde lid][ref5], is niet van toepassing op schepen waarvoor
      een certificaat is afgegeven voor het vervoer van ten hoogste tien passagiers.


      [ref1]: https://wetten.overheid.nl/BWBR0018625#Artikel8
