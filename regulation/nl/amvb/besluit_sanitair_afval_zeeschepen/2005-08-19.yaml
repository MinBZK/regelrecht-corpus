preamble:
  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Op de voordracht van Onze Minister van Verkeer en Waterstaat van 24 februari 2005, nr. HDJZ/SCH/2005-578,
    Hoofddirectie Juridische Zaken, gedaan mede namens de Staatssecretaris van Volkshuisvesting, Ruimtelijke Ordening
    en Milieubeheer;


    Gelet op Bijlage IV van het op 2 november 1973 te Londen tot stand gekomen Internationaal Verdrag ter voorkoming
    van verontreiniging door schepen, met Protocollen en Bijlagen met Aanhangsels (Trb. 1975, 147), en met het op 17
    februari 1978 te Londen tot stand gekomen Protocol bij dat Verdrag met Bijlage en Aanhangsels (Trb. 1978, 188),
    op Bijlage IV van het op 4 oktober 1991 te Madrid tot stand gekomen Protocol betreffende milieubescherming bij
    het Verdrag inzake Antarctica, met Bijlagen (Trb. 1992, 110), en op Resolutie MEPC.115(51) van 1 april 2004 van de
    Mariene Milieucommissie van de Internationale Maritieme Organisatie, alsmede op de artikelen 1, onderdeel h, 5, 7,
    8, 8a, 9, eerste lid, onderdeel e, 10, 11 en 38 van de Wet voorkoming verontreiniging door schepen;


    De Raad van State gehoord (advies van 29 april 2005, nr. W09.05.0052/V);


    Gezien het nader rapport van Onze Minister van Verkeer en Waterstaat van 8 juli 2005, nr. HDJZ/SCH/2005-1491,
    Hoofddirectie Juridische Zaken, uitgebracht mede namens de Staatssecretaris van Volkshuisvesting, Ruimtelijke
    Ordening en Milieubeheer;


    Hebben goedgevonden en verstaan:
