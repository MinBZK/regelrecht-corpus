preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Verkeer en Waterstaat van 16 juni 1997, nr. HDTP/97/1043/JH, Hoofddirectie
    Telecommunicatie en Post;

    Gelet op de artikelen 13a , eerste lid, 13b , 13g , 13h , 13k , en 41 van de Wet op de
    telecommunicatievoorzieningen;

    De Raad van State gehoord (advies van 8 juli 1997, nr. WO9.97.0342);

    Gezien het nader rapport van Onze Minister van Verkeer en Waterstaat van 20 november 1997, nr. HDTP/97/2501/NG,
    Hoofddirectie Telecommunicatie en Post;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0009037/1997-12-01#ArtikelAanhef
articles:
  - number: II
    text: Het Besluit aanwijzing DCS 1800 wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0009037/1997-12-01#ArtikelII
  - number: III.1
    text: |-
      Onze Minister maakt in de *Staatscourant* bekend wanneer de procedure voor het aanvragen van een vergunning zal
      beginnen.
    url: https://wetten.overheid.nl/BWBR0009037/1997-12-01#ArtikelIII
  - number: III.2
    text: |-
      Onze Minister stelt een aanvraagdocument op, waarin een overzicht wordt gegeven van de gestelde regels omtrent
      de indiening en behandeling van de aanvragen om een vergunning en van de gestelde regels omtrent de inhoud van
      de aanvragen en de daarbij over te leggen gegevens. In het aanvraagdocument wordt voorts informatie gegeven over
      de aanvraagprocedure.
    url: https://wetten.overheid.nl/BWBR0009037/1997-12-01#ArtikelIII
  - number: III.3
    text: |-
      Vanaf de inwerkingtreding van dit besluit tot aan een door Onze Minister te bepalen moment waarop de aanvragen
      moeten zijn ontvangen, kan een ieder aan Onze Minister een verzoek doen om toezending van het aanvraagdocument.
      Het aanvraagdocument wordt uitsluitend verzonden aan degene die daarvoor een bedrag van f 500,- heeft betaald als
      tegemoetkoming in de kosten van de vervaardiging.
    url: https://wetten.overheid.nl/BWBR0009037/1997-12-01#ArtikelIII
  - number: III.4
    text: |-
      Onze Minister beslist op een aanvraag om een vergunning binnen zesentwintig weken na aanvang van de procedure voor
      het aanvragen van een vergunning.
    url: https://wetten.overheid.nl/BWBR0009037/1997-12-01#ArtikelIII
  - number: IV
    text: Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0009037/1997-12-01#ArtikelIV
