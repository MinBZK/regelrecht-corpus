  - number: '2.2'
    text: |-
      De Europese Centrale Bank treedt in de plaats van de Nederlandsche Bank als bevoegde autoriteit als bedoeld in
      het eerste lid, indien dit volgt uit de artikelen 4, 5 en 6 van verordening (EU) nr. 1024/2013 van de Raad van
      15 oktober 2013 waarbij aan de Europese Centrale Bank specifieke taken worden opgedragen betreffende het beleid
      inzake het prudentieel toezicht op kredietinstellingen (PbEU 2013, L 287).
    url: https://wetten.overheid.nl/BWBR0032230/2016-07-03#Artikel2
  - number: 2a.1
    text: 'De Nederlandsche Bank vraagt advies aan de Autoriteit Financiële Markten voordat zij:'
    url: https://wetten.overheid.nl/BWBR0032230/2016-07-03#Artikel2a
  - number: 2a.1.a
    text: |-
      beslist op een aanvraag als bedoeld in de artikelen 14, 15 en 17 van verordening (EU) nr. 648/2012 (EMIR), of in
      het kader van [artikel 3:28a van de wet][ref1], voor zover betrekking hebbend op de artikelen 26 tot en met 35 en
      51 tot en met 54 van die verordening, indien in dat kader dient te worden beoordeeld of wordt voldaan aan het bij
      of krachtens het [Deel Gedragstoezicht financiële ondernemingen][ref2] bepaalde; of


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0032230/2016-07-03#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
  - number: 2a.1.b
    text: een vergunning intrekt op grond van artikel 20 van verordening (EU) nr. 648/2012 (EMIR).
    url: https://wetten.overheid.nl/BWBR0032230/2016-07-03#Artikel2a
  - number: 2a.2
    text: De Autoriteit Financiële Markten brengt het advies schriftelijk uit binnen zes weken na het verzoek.
    url: https://wetten.overheid.nl/BWBR0032230/2016-07-03#Artikel2a
  - number: 2a.3
    text: |-
      De Nederlandsche Bank volgt het advies, bedoeld in het eerste lid, tenzij zwaarwegende redenen betreffende de
      soliditeit van de aanvrager of de stabiliteit van het financiële stelsel naar het oordeel van de Nederlandsche
      Bank aanleiding tot afwijking geven. Indien de Nederlandsche Bank overweegt af te wijken, stelt zij de Autoriteit
      Financiële Markten in de gelegenheid om haar advies mondeling toe te lichten. De Nederlandsche Bank motiveert een
      afwijking schriftelijk.
    url: https://wetten.overheid.nl/BWBR0032230/2016-07-03#Artikel2a
  - number: 2a.4
    text: |-
      Het advies, bedoeld in het eerste lid, maakt deel uit van het besluit ten aanzien van de vergunning, instemming
      of intrekking.
    url: https://wetten.overheid.nl/BWBR0032230/2016-07-03#Artikel2a
  - number: 2b.1
    text: |-
      Indien de Autoriteit Financiële Markten voornemens is een vergunning te verlenen als bedoeld in de artikelen 16 of
      19 van verordening (EU) nr. 909/2014 (centrale effectenbewaarinstellingen), een vergunning in te trekken op grond
      van artikel 20 van die verordening of op grond van [artikel 1:79][ref1] of [1:80 van de wet][ref2] een besluit te
      nemen ter zake van overtreding van de artikelen 26 tot en met 31 en 48 tot en met 53 van die verordening, stelt zij
      de Nederlandsche Bank van het voorgenomen besluit in kennis.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0032230/2016-07-03#Artikel2b
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '1'
  - number: 2b.2
    text: |-
      Indien de Nederlandsche Bank naar aanleiding van een inkennisstelling als bedoeld in het eerste lid, oordeelt dat
      zwaarwegende redenen betreffende de soliditeit van de betrokken onderneming of de stabiliteit van het financiële
      stelsel daar aanleiding toe geven, kan zij een bindende aanbeveling doen aan de Autoriteit Financiële Markten
      omtrent een besluit als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0032230/2016-07-03#Artikel2b
  - number: 2b.3
    text: |-
      Een bindende aanbeveling als bedoeld in het tweede lid is met redenen omkleed en wordt binnen zes weken na de
      inkennisstelling, bedoeld in het eerste lid, schriftelijk ingediend.
    url: https://wetten.overheid.nl/BWBR0032230/2016-07-03#Artikel2b
  - number: 2b.4
    text: |-
      De Autoriteit Financiële Markten geeft uitvoering aan de bindende aanbeveling, bedoeld in het tweede lid. Indien de
      Autoriteit Financiële Markten uitvoering geeft aan de aanbeveling door een besluit te nemen, maakt de aanbeveling
      deel uit van het te nemen besluit.
    url: https://wetten.overheid.nl/BWBR0032230/2016-07-03#Artikel2b
  - number: '3'
    text: |-
      Als orgaan als bedoeld in artikel 11, eerste lid, van de verordening (EG) nr. 924/2009 (grensoverschrijdende
      betalingen) en artikel 12 van de verordening (EU) nr. 260/2012 (betaaldiensten) wordt aangewezen de Stichting
      Klachteninstituut Financiële Dienstverlening.
    url: https://wetten.overheid.nl/BWBR0032230/2016-07-03#Artikel3
  - number: 3a
    text: |-
      Als nationale afwikkelingsautoriteit in de zin van verordening (EU) nr. 806/2014 (gemeenschappelijk
      afwikkelingsmechanisme), belast met de uitvoering en handhaving van de bij of krachtens die verordening gestelde
      regels, wordt aangewezen de Nederlandsche Bank. De [artikelen 4][ref1] en [5][ref2] zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0032230#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0032230#Artikel5
    url: https://wetten.overheid.nl/BWBR0032230/2016-07-03#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0032230
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0032230
        artikel: '5'
  - number: '4'
    text: |-
      De bevoegde autoriteit kan ter zake van overtreding van voorschriften gesteld ingevolge de in de [bijlage 1][ref1]
      genoemde artikelen een last onder dwangsom opleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0032230
    url: https://wetten.overheid.nl/BWBR0032230/2016-07-03#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0032230
  - number: '5.1'
    text: |-
      De bevoegde autoriteit kan ter zake van overtreding van voorschriften gesteld ingevolge de in de [bijlage 2][ref1]
      genoemde artikelen, met toepassing van de in die bijlage aangegeven tariefnummers, een bestuurlijke boete opleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0032230
    url: https://wetten.overheid.nl/BWBR0032230/2016-07-03#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0032230
  - number: '5.2'
    text: |-
      [Paragraaf 1 van het Besluit bestuurlijke boetes financiële sector][ref1] is voor de toepassing van het eerste lid
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0026204#Paragraaf1
    url: https://wetten.overheid.nl/BWBR0032230/2016-07-03#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0026204
        paragraaf: '1'
  - number: '6'
    text: |-
      De bevoegde autoriteit maakt een besluit tot het opleggen van een bestuurlijke boete openbaar, indien de
      bestuurlijke boete is opgelegd ter zake van overtreding van de artikelen 5, eerste en tweede lid, 6, eerste en
      tweede lid, 7 eerste en tweede lid, 8, 9, eerste lid, eerste volzin en tweede lid, 17, zevende en negende tot en
