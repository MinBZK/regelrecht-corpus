      Als bevoegde autoriteit in de zin van de hierna genoemde verordeningen, belast met de uitvoering en handhaving
      van de bij of krachtens die verordeningen gestelde regels, worden aangewezen: a. voor verordening (EU) nr.
      2017/1129 (prospectus): de Autoriteit Financiële Markten; b. voor [verordening (EG) nr. 924/2009](32009R0924)
      (grensoverschrijdende betalingen): de Autoriteit Financiële Markten; c. voor verordening (EG) nr. 1060/2009
      (ratingbureaus): 1°. ten aanzien van de gehele verordening met uitzondering van artikel 4, eerste lid, voor zover
      het een bank, centrale tegenpartij, herverzekeraar, pensioenfonds, premiepensioeninstelling of verzekeraar betreft,
      en artikel 5 bis, eerste lid: de Autoriteit Financiële Markten; 2°. ten aanzien van artikel 4, eerste lid, voor
      zover het een bank, centrale tegenpartij, herverzekeraar, pensioenfonds, premiepensioeninstelling of verzekeraar
      betreft, en artikel 5 bis, eerste lid: de Nederlandsche Bank; d. voor verordening (EU) nr. 583/2010 (essentiële
      beleggersinformatie): de Autoriteit Financiële Markten; e. voor verordening (EU) nr. 1031/2010 (veiling van
      broeikasgasemissierechten), voor zover het betreft de bevoegdheid tot het verlenen van vergunningen als bedoeld in
      artikel 18, tweede en derde lid, en tot het geheel of gedeeltelijk intrekken van die vergunningen: de Autoriteit
      Financiële Markten; f. voor verordening (EU) nr. 236/2012 (short selling en kredietverzuimswaps): de Autoriteit
      Financiële Markten; g. voor verordening (EU) nr. 260/2012 (betaaldiensten): 1°. ten aanzien van de artikelen 3
      tot en met 6 en 9 de Nederlandsche Bank; 2°. ten aanzien van artikel 8 de Autoriteit Consument en Markt; h. voor
      verordening (EU) nr. 648/2012 (EMIR): 1°. ten aanzien van de artikelen 4, eerste tot en met derde lid, 4 bis,
      6 bis, tweede lid, 11, 12, voor zover de tegenpartij een bank, verzekeraar, herverzekeraar of pensioenfonds is,
      alsmede ten aanzien van de artikelen 14 tot en met 21, 25, tot en met 35 en 40 tot en met 54: de Nederlandsche
      Bank; 2°. ten aanzien van de artikelen 4, eerste tot en met derde lid, 4 bis, 6 bis, tweede lid, 11, 12, voor zover
      de tegenpartij geen bank, verzekeraar, herverzekeraar of pensioenfonds is, alsmede ten aanzien van de artikelen 4,
      derde lid bis, 5 tot en met 10, 36 tot en met 39, 57, 59, 61 tot en met 63, 68 en 71 tot en met 74: de Autoriteit
      Financiële Markten; i. voor verordening (EU) nr. 345/2013 (Europese durfkapitaalfondsen): de Autoriteit Financiële
      Markten; j. voor verordening (EU) nr. 346/2013 (Europese sociaalondernemerschapsfondsen): de Autoriteit Financiële
      Markten; k. voor verordening (EU) nr. 575/2013 (Kapitaalvereisten): de Nederlandsche Bank; l. voor verordening
      (EU) nr. 596/2014 (marktmisbruik): de Autoriteit Financiële Markten; m. voor verordening (EU) nr. 600/2014 (MiFIR):
      de Autoriteit Financiële Markten; n. voor verordening (EU) nr. 909/2014 (centrale effectenbewaarinstelllingen):
      1°. ten aanzien van de artikelen 9, voor zover het een bank betreft, 39 tot en met 47, 54 tot en met 57 en 59
      en 60: de Nederlandsche Bank; 2°. ten aanzien van de artikelen 3 tot en met 7, 9, voor zover het een andere
      onderneming dan een bank betreft, 16 tot en met 20, 23, 26 tot en met 38 en 48 tot en met 53: de Autoriteit
      Financiële Markten; o. voor verordening (EU) br. 1286/2014 (PRIIP’s): de Autoriteit Financiële Markten; p. voor
      verordening (EU) nr. 2015/760 (Europese langetermijnbeleggingsinstellingen): de Autoriteit Financiële Markten; q.
      voor verordening (EU) nr. 2015/35 (Solvabiliteit II): de Nederlandsche Bank; r. voor verordening (EU) nr. 2015/751
      (afwikkelingsvergoedingen voor op kaarten gebaseerde betalingstransacties): 1°. ten aanzien van de artikelen 3 tot
      en met 6, 8, eerste lid en derde tot en met zesde lid, 10 en 11: de Autoriteit Consument en Markt; 2°. ten aanzien
      van artikel 7: de Nederlandsche Bank; 3°. ten aanzien van de artikelen 8, tweede lid, 9 en 12: de Autoriteit
      Financiële Markten; s. voor verordening (EU) nr. 2016/1011 (benchmarks): de Autoriteit Financiële Markten; t. voor
      verordening (EU) nr. 2017/565 (MiFID II organisatorische vereisten): de Autoriteit Financiële Markten; u. voor
      verordening (EU) nr. 2017/2358 (productontwikkeling en -governance): de Autoriteit Financiële Markten; v. voor
      verordening (EU) nr. 2017/2359 (verzekeringen met een beleggingscomponent): de Autoriteit Financiële Markten; w.
      voor verordening (EU) nr. 2015/2365 (SFTR): 1°. ten aanzien van de artikelen 4, 13, 14 en, 24, derde lid, voor
      wat betreft de verwijzing naar artikel 4: de Autoriteit Financiële Markten; 2°. ten aanzien van andere artikelen
      dan die, genoemd onder 1°: i. voor zover de tegenpartij een bank, verzekeraar, herverzekeraar of pensioenfonds
      is: de Nederlandsche Bank; ii. voor zover de tegenpartij geen bank, verzekeraar, herverzekeraar of pensioenfonds
      is: 'de Autoriteit Financiële Markten; x. voor [verordening (EU) nr. 2017/2402](32402R2017) (securitisaties):'
      1°. de Nederlandsche Bank: ten aanzien van: – de artikelen 6 tot en met 9, 30, tweede lid, onderdeel a, en derde
      lid, indien het een SSPE betreft als bedoeld in artikel 29, vierde lid, van de verordening (EU) nr. 2017/2402
      (securitisaties), die is verbonden aan een initiator, oorspronkelijke kredietverstrekker of sponsor met een door
      de Nederlandsche Bank verleende vergunning; – de artikelen 5 tot en met 9, 29, zesde lid, 30, tweede lid, onderdeel
      a, en derde lid, 43, vijfde tot en met achtste lid, voor zover het betreft een bank, tenzij de Europese Centrale
      Bank bevoegd is toezicht uit te oefenen op grond van de artikelen 4 en 6 van de verordening bankentoezicht,
      beleggingsonderneming onder de verordening kapitaalvereisten, verzekeringsonderneming of herverzekeringsonderneming
      als bedoeld in artikel 13, eerste onderdeel, onderscheidenlijk vierde onderdeel, van de richtlijn solvabiliteit
      II, een pensioenfonds of premiepensioeninstelling; en – de artikelen 18, 27, 30, tweede lid, onderdelen b en c, 43,
      tweede lid, en 43 bis, eerste en tweede lid; 2°. de Autoriteit Financiële Markten: ten aanzien van: – de artikelen
      3, 4, aanhef en onderdelen a tot en met b, en 28; – de artikelen 6 tot en met 9, 30, tweede lid, onderdeel a, en
      derde lid, indien het een SSPE betreft als bedoeld in artikel 29, vierde lid, van de verordening (EU) nr. 2017/2402
      (securitisaties), die is verbonden aan een initiator, oorspronkelijke kredietverstrekker of sponsor zonder door een
      toezichthouder verleende vergunning of met een door de Autoriteit Financiële Markten verleende vergunning of indien
      het een initiator of oorspronkelijke kredietverstrekker als bedoeld in artikel 29, vierde lid, van die verordening
      betreft; en – de artikelen 5 tot en met 9, 29, zesde lid, 30, tweede lid, onderdeel a, en derde lid, en artikel
      43, vijfde tot en met achtste lid, voor zover het een beleggingsinstelling, of icbe betreft; y. voor verordening
      (EU) nr. 2017/1131 (geldmarktfondsen): 1°. ten aanzien van de gehele verordening met uitzondering van de artikelen
      28 en 37, tweede lid, onderdeel c: de Autoriteit Financiële Markten; 2°. ten aanzien van de artikelen 28 en 37,
      tweede lid, onderdeel c: de Nederlandsche Bank; z. voor verordening (EU) nr. 2019/1156 (grensoverschrijdende
      distributie van beleggingsinstellingen en icbe’s): de Autoriteit Financiële Markten; aa. voor [verordening (EU)
      nr. 2019/1238](33138R2019) (PEPP): 1°. ten aanzien van de artikelen 4 tot en met 13, de hoofdstukken III en IV,
      de artikelen 42 tot en met 44, 45, tweede lid, 48 en 50, zesde lid, de hoofdstukken VII en VIII, artikel 63 en
      hoofdstuk X: de Autoriteit Financiële Markten; 2°. ten aanzien van de artikelen 41, 45, eerste lid, 46, en 49,
      tweede en derde lid: de Nederlandsche Bank; ab. voor [verordening (EU) nr. 2019/2033](32033R2019) (prudentiële
      vereisten beleggingsondernemingen): 1°. ten aanzien van de gehele verordening met uitzondering van de artikelen 48,
      51 en 53: de Nederlandsche Bank; 2°. ten aanzien van de artikelen 48, 51 en 53: de Autoriteit Financiële Markten;
      ac. voor verordening (EU) nr. 2019/2088 (informatieverstrekking over duurzaamheid): de Autoriteit Financiële
      Markten; ad. voor verordening (EU) nr. 2020/852 (kader duurzame beleggingen): de Autoriteit Financiële Markten;
      ae. voor [verordening (EU) 2020/1503](33403R2020) (crowdfundingdienstverleners voor bedrijven): 1°. ten aanzien
      van ten aanzien van de gehele verordening met uitzondering van artikel 11: de Autoriteit Financiële Markten; 2°.
      ten aanzien van artikel 11: De Nederlandsche Bank; af. voor [verordening (EU) nr. 2021/23](31923R2021) (herstel en
      afwikkeling centrale tegenpartijen): de Nederlandsche Bank.
    url: https://wetten.overheid.nl/BWBR0032230/2022-09-03#Artikel2
  - number: '2.2'
    text: |-
      De Europese Centrale Bank treedt in de plaats van de Nederlandsche Bank als bevoegde autoriteit als bedoeld in
      het eerste lid, indien dit volgt uit de artikelen 4, 5 en 6 van verordening (EU) nr. 1024/2013 van de Raad van
      15 oktober 2013 waarbij aan de Europese Centrale Bank specifieke taken worden opgedragen betreffende het beleid
      inzake het prudentieel toezicht op kredietinstellingen (PbEU 2013, L 287).
    url: https://wetten.overheid.nl/BWBR0032230/2022-09-03#Artikel2
  - number: 2a.1
    text: 'De Nederlandsche Bank vraagt advies aan de Autoriteit Financiële Markten voordat zij:'
    url: https://wetten.overheid.nl/BWBR0032230/2022-09-03#Artikel2a
  - number: 2a.1.a
    text: |-
      beslist op een aanvraag als bedoeld in de artikelen 14, 15 en 17 van verordening (EU) nr. 648/2012 (EMIR), of in
      het kader van [artikel 3:28a van de wet][ref1], voor zover betrekking hebbend op de artikelen 26 tot en met 35 en
      51 tot en met 54 van die verordening, indien in dat kader dient te worden beoordeeld of wordt voldaan aan het bij
      of krachtens het [Deel Gedragstoezicht financiële ondernemingen][ref2] bepaalde; of


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0032230/2022-09-03#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
  - number: 2a.1.b
    text: een vergunning intrekt op grond van artikel 20 van verordening (EU) nr. 648/2012 (EMIR).
    url: https://wetten.overheid.nl/BWBR0032230/2022-09-03#Artikel2a
  - number: 2a.2
    text: De Autoriteit Financiële Markten brengt het advies schriftelijk uit binnen zes weken na het verzoek.
    url: https://wetten.overheid.nl/BWBR0032230/2022-09-03#Artikel2a
  - number: 2a.3
    text: |-
      De Nederlandsche Bank volgt het advies, bedoeld in het eerste lid, tenzij zwaarwegende redenen betreffende de
      soliditeit van de aanvrager of de stabiliteit van het financiële stelsel naar het oordeel van de Nederlandsche
      Bank aanleiding tot afwijking geven. Indien de Nederlandsche Bank overweegt af te wijken, stelt zij de Autoriteit
      Financiële Markten in de gelegenheid om haar advies mondeling toe te lichten. De Nederlandsche Bank motiveert een
      afwijking schriftelijk.
    url: https://wetten.overheid.nl/BWBR0032230/2022-09-03#Artikel2a
  - number: 2a.4
    text: |-
      Het advies, bedoeld in het eerste lid, maakt deel uit van het besluit ten aanzien van de vergunning, instemming
      of intrekking.
    url: https://wetten.overheid.nl/BWBR0032230/2022-09-03#Artikel2a
  - number: 2b.1
    text: |-
      Indien de Autoriteit Financiële Markten voornemens is een vergunning te verlenen als bedoeld in de artikelen 16 of
      19 van verordening (EU) nr. 909/2014 (centrale effectenbewaarinstellingen), een vergunning in te trekken op grond
      van artikel 20 van die verordening of op grond van [artikel 1:79][ref1] of [1:80 van de wet][ref2] een besluit te
      nemen ter zake van overtreding van de artikelen 26 tot en met 31 en 48 tot en met 53 van die verordening, stelt zij
      de Nederlandsche Bank van het voorgenomen besluit in kennis.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0032230/2022-09-03#Artikel2b
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '1'
  - number: 2b.2
    text: |-
      Indien de Nederlandsche Bank naar aanleiding van een inkennisstelling als bedoeld in het eerste lid, oordeelt dat
      zwaarwegende redenen betreffende de soliditeit van de betrokken onderneming of de stabiliteit van het financiële
      stelsel daar aanleiding toe geven, kan zij een bindende aanbeveling doen aan de Autoriteit Financiële Markten
      omtrent een besluit als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0032230/2022-09-03#Artikel2b
  - number: 2b.3
    text: |-
      Een bindende aanbeveling als bedoeld in het tweede lid is met redenen omkleed en wordt binnen zes weken na de
      inkennisstelling, bedoeld in het eerste lid, schriftelijk ingediend.
    url: https://wetten.overheid.nl/BWBR0032230/2022-09-03#Artikel2b
  - number: 2b.4
    text: |-
      De Autoriteit Financiële Markten geeft uitvoering aan de bindende aanbeveling, bedoeld in het tweede lid. Indien de
      Autoriteit Financiële Markten uitvoering geeft aan de aanbeveling door een besluit te nemen, maakt de aanbeveling
      deel uit van het te nemen besluit.
    url: https://wetten.overheid.nl/BWBR0032230/2022-09-03#Artikel2b
  - number: 2c.1
    text: |-
      Voordat de Autoriteit Financiële Markten beslist op een aanvraag tot registratie van een paneuropees persoonlijk
      pensioenproduct als bedoeld in artikel 6, eerste lid, van verordening (EU) nr. 2019/1238 (PEPP), vraagt zij advies
      aan de Nederlandsche Bank inzake de beoordeling van de regelingen betreffende portefeuille- en risicobeheer en
      administratie met betrekking tot het paneuropese persoonlijke pensioenproduct en de identiteit van de aanvrager
      indien de aanvrager een onderneming als bedoeld in artikel 6, eerste lid, onderdeel a, b of c, van genoemde
      verordening is, en, indien van toepassing, de identiteit van de bewaarder, indien de aanvrager een onderneming als
      bedoeld in artikel 6, eerste lid, onderdeel d, e of f, van genoemde verordening is.
    url: https://wetten.overheid.nl/BWBR0032230/2022-09-03#Artikel2c
  - number: 2c.2
    text: De Nederlandsche Bank brengt schriftelijk advies uit binnen zes weken na ontvangst van het verzoek.
    url: https://wetten.overheid.nl/BWBR0032230/2022-09-03#Artikel2c
  - number: 2c.3
    text: |-
      Indien de Nederlandsche Bank naar aanleiding van de adviesaanvraag als bedoeld in het eerste lid oordeelt dat de
      aanvraag tot registratie, met inachtneming van artikel 6, vierde lid, van verordening (EU) nr. 2019/1238 (PEPP),
      afgewezen dient te worden, doet zij een bindende aanbeveling tot afwijzing van de aanvraag tot registratie en geeft
      de Autoriteit Financiële Markten uitvoering aan die aanbeveling.
    url: https://wetten.overheid.nl/BWBR0032230/2022-09-03#Artikel2c
  - number: 2c.4
    text: Een bindende aanbeveling als bedoeld in het derde lid is met redenen omkleed.
    url: https://wetten.overheid.nl/BWBR0032230/2022-09-03#Artikel2c
  - number: 2c.5
    text: |-
      Indien de Autoriteit Financiële Markten uitvoering geeft aan de aanbeveling door een besluit te nemen, maakt de
      aanbeveling deel uit van het te nemen besluit.
    url: https://wetten.overheid.nl/BWBR0032230/2022-09-03#Artikel2c
  - number: 2d.1
    text: |-
      De Autoriteit Financiële Markten stelt de Nederlandsche Bank in kennis van het voornemen om op grond van artikel 8,
      eerste lid, van [verordening (EU) nr. 2019/1238](33138R2019) (PEPP) de registratie van een paneuropees persoonlijk
      pensioenproduct door te halen.
    url: https://wetten.overheid.nl/BWBR0032230/2022-09-03#Artikel2d
  - number: 2d.2
    text: |-
      De Nederlandsche Bank kan de Autoriteit Financiële Markten een bindende aanbeveling doen om op grond van artikel 8
      van de in het eerste lid genoemde verordening de registratie van een paneuropees persoonlijk pensioenproduct door
      te halen op een of meer van de volgende gronden:
    url: https://wetten.overheid.nl/BWBR0032230/2022-09-03#Artikel2d
  - number: 2d.2.a
    text: |-
      de PEPP-aanbieder heeft, naar later blijkt, bij de aanvraag van de registratie onjuiste of onvolledige gegevens
      verstrekt, en kennis omtrent de juiste en volledige gegevens zou ertoe hebben geleid dat de Nederlandsche Bank op
      grond van [artikel 2c, tweede lid][ref1], had geadviseerd om de aanvraag tot registratie af te wijzen;


      [ref1]: https://wetten.overheid.nl/BWBR0032230#Artikel2c
    url: https://wetten.overheid.nl/BWBR0032230/2022-09-03#Artikel2d
    references:
      - id: ref1
        bwb_id: BWBR0032230
        artikel: 2c
  - number: 2d.2.b
    text: |-
      de PEPP-aanbieder heeft omstandigheden of feiten verzwegen op grond waarvan, zo zij voor het tijdstip waarop
      het paneuropese persoonlijke pensioenproduct was geregistreerd zich hadden voorgedaan of bekend waren geweest,
      de Nederlandsche Bank op grond van [artikel 2c, tweede lid][ref1], zou hebben geadviseerd om de aanvraag van de
      registratie af te wijzen;


      [ref1]: https://wetten.overheid.nl/BWBR0032230#Artikel2c
    url: https://wetten.overheid.nl/BWBR0032230/2022-09-03#Artikel2d
    references:
      - id: ref1
        bwb_id: BWBR0032230
        artikel: 2c
  - number: 2d.2.c
    text: |-
      de PEPP-aanbieder heeft de in het eerste lid genoemde verordening ernstig of stelselmatig geschonden en de
      Nederlandsche Bank is ervan overtuigd dat er redelijke gronden zijn om aan te nemen dat de schending of schendingen
      een risico vormen voor de stabiliteit van het financiële stelsel of een deel daarvan in ten minste één lidstaat;
    url: https://wetten.overheid.nl/BWBR0032230/2022-09-03#Artikel2d
  - number: 2d.2.d
    text: |-
      de PEPP-aanbieder of het paneuropese persoonlijke pensioenproduct voldoet niet meer aan de voorwaarden waaronder
      het paneuropese persoonlijke pensioenproduct is geregistreerd, en de Nederlandsche Bank is ervan overtuigd dat er
      redelijke gronden zijn om aan te nemen dat dat een risico vormt voor de stabiliteit van het financiële stelsel of
      een deel daarvan in ten minste één lidstaat.
    url: https://wetten.overheid.nl/BWBR0032230/2022-09-03#Artikel2d
  - number: 2d.3
    text: |-
      Indien de Nederlandsche Bank op grond van het tweede lid een bindende aanbeveling doet om de registratie door te
      halen, geeft de Autoriteit Financiële Markten uitvoering aan die aanbeveling.
    url: https://wetten.overheid.nl/BWBR0032230/2022-09-03#Artikel2d
  - number: 2d.4
    text: Een bindende aanbeveling als bedoeld in het derde lid is met redenen omkleed.
    url: https://wetten.overheid.nl/BWBR0032230/2022-09-03#Artikel2d
  - number: 2d.5
    text: |-
      Indien de Autoriteit Financiële Markten uitvoering geeft aan de aanbeveling door een besluit te nemen, maakt de
      aanbeveling deel uit van het te nemen besluit.
    url: https://wetten.overheid.nl/BWBR0032230/2022-09-03#Artikel2d
  - number: 2e.1
    text: |-
      De Autoriteit Financiële Markten stelt de Nederlandsche Bank in kennis van het voornemen om op grond van artikel
      63, eerste lid, van de verordening (EU) nr. 2019/1238 (PEPP) het op de markt brengen en distribueren van een
      paneuropees persoonlijk pensioenproduct te verbieden of te beperken.
    url: https://wetten.overheid.nl/BWBR0032230/2022-09-03#Artikel2e
  - number: 2e.2
    text: |-
      De Nederlandsche Bank kan de Autoriteit Financiële Markten een bindende aanbeveling doen om op grond van artikel
      63, eerste lid, van de in het eerste lid genoemde verordening het op de markt brengen en distribueren van een
      paneuropees persoonlijk pensioenproduct te verbieden of te beperken op de grond dat redelijkerwijs is aan te nemen
      dat het paneuropese persoonlijke pensioenproduct een risico vormt voor de stabiliteit van het financiële stelsel of
      een deel daarvan in ten minste een lidstaat, mits is voldaan aan artikel 63, eerste lid, onderdelen b tot en met d.
    url: https://wetten.overheid.nl/BWBR0032230/2022-09-03#Artikel2e
  - number: 2e.3
    text: |-
      Indien de Nederlandsche Bank op grond van het tweede lid de Autoriteit Financiële Markten een bindende aanbeveling
      doet om te besluiten tot het verbieden of beperken van het op de markt brengen en distribueren van een paneuropees
      persoonlijk pensioenproduct, geeft de Autoriteit Financiële Markten uitvoering aan die aanbeveling.
    url: https://wetten.overheid.nl/BWBR0032230/2022-09-03#Artikel2e
  - number: 2e.4
    text: Een bindende aanbeveling als bedoeld in het derde lid is met redenen omkleed.
    url: https://wetten.overheid.nl/BWBR0032230/2022-09-03#Artikel2e
  - number: 2e.5
    text: |-
      Indien de Autoriteit Financiële Markten besluit tot het verbieden of beperken van het op de markt brengen en
      distribueren van een paneuropees Europees persoonlijk pensioenproduct naar aanleiding van een bindende aanbeveling
      van De Nederlandsche Bank, maakt dat advies deel uit van het besluit.
    url: https://wetten.overheid.nl/BWBR0032230/2022-09-03#Artikel2e
  - number: '3.1'
    text: |-
      De Stichting Klachteninstituut Financiële Dienstverlening wordt aangewezen als orgaan als bedoeld in: - a. artikel
      11, eerste lid, van [verordening (EG) nr. 924/2009](32009R0924) (grensoverschrijdende betalingen); b artikel 12
      van [verordening (EU) nr. 260/2012](32012R0260) (betaaldiensten); c. artikel 15 van [verordening (EU) nr. 2015/751]
      (32651R2015) (afwikkelingsvergoedingen voor op kaarten gebaseerde betalingstransacties); d. artikel 51 van
      [verordening (EU) nr. 2019/1238](33138R2019) (PEPP).
    url: https://wetten.overheid.nl/BWBR0032230/2022-09-03#Artikel3
  - number: '3.2'
    text: |-
      Op de behandeling van klachten en geschillen en op de Stichting Klachteninstituut Financiële
      Dienstverlening in haar hoedanigheid van orgaan als bedoeld in artikel 15 van verordening (EU) nr.
      2015/751 (afwikkelingsvergoedingen voor op kaarten gebaseerde betalingstransacties) zijn, voor zover een
      begunstigde in de zin van die verordening niet tevens een consument is in de zin van de Implementatiewet
      buitengerechtelijke geschillenbeslechting consumenten, de [artikelen 3, tweede tot en met vierde lid][ref1],
      en [4 tot en met 11 van de Implementatiewet buitengerechtelijke geschillenbeslechting consumenten][ref2]
      en de [artikelen 40 tot en met 44][ref3], [45, eerste en tweede lid][ref4], [46 tot en met 48a][ref5] en
      [48d tot en met 48f van het Besluit Gedragstoezicht financiële ondernemingen Wft][ref6] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0036550#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0036550#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0020421#Artikel40
      [ref4]: https://wetten.overheid.nl/BWBR0020421#Artikel45
      [ref5]: https://wetten.overheid.nl/BWBR0020421#Artikel46
      [ref6]: https://wetten.overheid.nl/BWBR0020421#Artikel48d
    url: https://wetten.overheid.nl/BWBR0032230/2022-09-03#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0036550
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0036550
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0020421
        artikel: '40'
      - id: ref4
        bwb_id: BWBR0020421
        artikel: '45'
      - id: ref5
        bwb_id: BWBR0020421
        artikel: '46'
      - id: ref6
        bwb_id: BWBR0020421
        artikel: 48d
  - number: 3a
    text: |-
      Als nationale afwikkelingsautoriteit in de zin van [verordening (EU) nr. 806/2014](32014R0806) (gemeenschappelijk
      afwikkelingsmechanisme) en [verordening (EU) nr. 2021/23](31923R2021) (herstel en afwikkeling centrale
      tegenpartijen), belast met de uitvoering en handhaving van de bij of krachtens die verordeningen gestelde regels,
      wordt aangewezen de Nederlandsche Bank. De [artikelen 4][ref1] en [5][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0032230#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0032230#Artikel5
    url: https://wetten.overheid.nl/BWBR0032230/2022-09-03#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0032230
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0032230
        artikel: '5'
  - number: '4'
    text: |-
      De bevoegde autoriteit kan ter zake van overtreding van voorschriften gesteld ingevolge de in de [bijlage 1][ref1]
      genoemde artikelen een last onder dwangsom opleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0032230
    url: https://wetten.overheid.nl/BWBR0032230/2022-09-03#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0032230
  - number: '5.1'
    text: |-
      De bevoegde autoriteit kan ter zake van overtreding van voorschriften gesteld ingevolge de in de [bijlage 2][ref1]
      genoemde artikelen een bestuurlijke boete opleggen, met toepassing van het basisbedrag, maximumbedrag en, indien
      van toepassing, het percentage van de netto-omzet van de boetecategorie waarin het voorschrift is gerangschikt.


      [ref1]: https://wetten.overheid.nl/BWBR0032230
    url: https://wetten.overheid.nl/BWBR0032230/2022-09-03#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0032230
  - number: '5.2'
    text: |-
      Indien de bijlage, ter uitvoering van [artikel 1:81, derde lid][ref1], een verhoogd maximumbedrag of, ter
      uitvoering van [artikel 1:82, tweede lid][ref2], een percentage van de netto-omzet vermeldt, geldt dat
      maximumbedrag of percentage.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0032230/2022-09-03#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '1'
  - number: '5.3'
    text: |-
      Indien de bijlage, ter uitvoering van [artikel 1:81, derde lid][ref1], een verhoogd maximumbedrag vermeldt, geldt
      als basisbedrag de helft van dat maximumbedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0032230/2022-09-03#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
  - number: '5.4'
    text: |-
      [Paragraaf 1 van het Besluit bestuurlijke boetes financiële sector][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0026204#Paragraaf1
    url: https://wetten.overheid.nl/BWBR0032230/2022-09-03#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0026204
        paragraaf: '1'
  - number: '6'
    text: |-
      Als in [bijlage 2][ref1] in de kolom «Bijzondere termijn openbaarmaking» een «P» staat opgenomen, maakt de
      toezichthouder op grond van [artikel 1:97, derde lid, van de Wet op het financieel toezicht][ref2] het besluit tot
      het opleggen van een bestuurlijke boete zo spoedig mogelijk openbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0032230
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0032230/2022-09-03#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0032230
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '1'
  - number: 6a
    text: |-
      De maximale afwikkelingsvergoeding voor een binnenlandse debetkaarttransactie, bedoeld in artikel 3, tweede lid,
      onderdeel b, eerste volzin, van verordening (EU) nr. 2015/751 (afwikkelingsvergoedingen voor op kaarten gebaseerde
      betalingstransacties), bedraagt € 0,02 per transactie.
    url: https://wetten.overheid.nl/BWBR0032230/2022-09-03#Artikel6a
  - number: 6aa
    text: |-
      De bevoegde autoriteit kan ter zake van overtreding van voorschriften gesteld ingevolge de in [bijlage 3][ref1]
      genoemde artikelen aan de overtreder of, indien de overtreding is begaan door een rechtspersoon, de natuurlijke
      personen die tot de betrokken gedraging opdracht hebben gegeven of daaraan feitelijk leiding hebben gegeven,
      tijdelijk de bevoegdheid ontzeggen om de in die bijlage genoemde functies uit te oefenen bij andere ondernemingen
      dan die, genoemd in [artikel 1:87, eerste lid, van de Wet op het financieel toezicht][ref2].


