preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Financiën van 5 september 2012, Directie Financiële Markten, FM/2012/1280M;

    Gelet op de artikelen 1:24, derde lid, 1:25, derde lid, 1:25a, tweede lid, 1:25c, 1:79, eerste lid, onderdeel b,
    1:80, eerste lid, onderdeel b, 1:81, en 1:97, eerste lid, onderdeel e, van de Wet op het financieel toezicht;

    De Afdeling advisering van de Raad van State gehoord (advies van 5 oktober 2012, nr. W06.12.0379/III);

    Gezien het nader rapport van Onze Minister van Financiën van 2 november 2012, Directie Financiële Markten,
    nr. FM/2012/1478 M;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0032230/2022-09-03#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder: - *bevoegde autoriteit:* de bevoegde autoriteit, bedoeld in [artikel 2][ref1];
        - *verordening (EG) nr. 924/2009 (grensoverschrijdende betalingen):* verordening (EG) nr. 924/2009 van het Europees
      Parlement en de Raad van 16 september 2009 betreffende grensoverschrijdende betalingen in de Gemeenschap en tot
      intrekking van Verordening (EG) nr. 2560/2001 (PbEU 2009 L 266);
        - *verordening (EG) nr. 1060/2009 (ratingbureaus):* verordening (EG) nr. 1060/2009 van het Europees Parlement en de
      Raad van 16 september 2009 inzake ratingbureaus (PbEU 2009 L 302);
        - *verordening (EU) nr. 583/2010 (essentiële beleggersinformatie):* verordening (EU) nr. 583/2010 van de Europese
      Commissie van 1 juli 2010 tot uitvoering van [Richtlijn 2009/65/EG](32009L0065) van het Europees Parlement en de
      Raad wat betreft essentiële beleggersinformatie en de voorwaarden waaraan moet worden voldaan als de essentiële
      beleggersinformatie of het prospectus op een andere duurzame drager dan papier of via een website wordt verstrekt
      (PbEU 2010 L 176);
        - *verordening (EU) nr. 1031/2010 (veiling van broeikasgasemissierechten):* verordening (EU) nr. 1031/2010 van
      de Europese Commissie van 12 november 2010 inzake de tijdstippen, het beheer en andere aspecten van de veiling
      van broeikasgasemissierechten overeenkomstig Richtlijn 2003/87/EG van het Europees Parlement en de Raad tot
      vaststelling van een regeling voor de handel in broeikasgasemissierechten binnen de Gemeenschap (PbEU 2010 L 302);
        - *verordening (EU) nr. 236/2012 (short selling en kredietverzuimswaps):* verordening (EU) nr. 236/2012
      van het Europees Parlement en de Raad van 14 maart 2012 betreffende short selling en bepaalde aspecten van
      kredietverzuimswaps (PbEU 2012 L 86);
        - *verordening (EU) nr. 260/2012 (betaaldiensten):* verordening (EU) nr. 260/2012 van 14 maart 2012 van het
      Europees Parlement en de Raad tot vaststelling van technische en bedrijfsmatige vereisten voor overmakingen en
      automatische afschrijvingen in euro en tot wijziging van Verordening (EG) nr. 924/2009 (PbEU 2012 L 94);
        - *verordening (EU) nr. 648/2012 (EMIR):* verordening (EU) nr. 648/2012 van het Europees Parlement en de Raad van
      4 juli inzake otc-derivaten, centrale tegenpartijen en transactieregisters (PbEU 2012, L 201);
        - *verordening (EU) nr. 345/2013 (Europese durfkapitaalfondsen):* verordening (EU) nr. 345/2013 van het Europees
      Parlement en de Raad van 17 april 2013 betreffende Europese durfkapitaalfondsen (PbEU 2013, L 115);
        - *verordening (EU) nr. 346/2013 (Europese sociaalondernemerschapsfondsen):* verordening (EU) nr. 346/2013 van het
      Europees Parlement en de Raad van 17 april 2013 inzake Europese sociaalondernemerschapsfondsen (PbEU 2013, L 115);
        - *verordening (EU) nr. 575/2013 (Kapitaalvereisten):* verordening (EU) nr. 575/2013 van het Europees Parlement en
      de Raad van 26 juni 2013 betreffende prudentiële vereisten voor kredietinstellingen en beleggingsondernemingen en
      tot wijziging van Verordening (EU) nr. 648/2012 (PbEU 2013, L 176);
        - *verordening (EU) nr. 596/2014 (marktmisbruik):* verordening (EU) nr. 596/2014 van het Europees Parlement
      en de Raad van 16 april 2014 betreffende marktmisbruik (Verordening marktmisbruik) en houdende intrekking van
      Richtlijn 2003/6/EG van het Europees Parlement en de Raad en Richtlijnen 2003/124, 2003/125/EG en 2004/72/EG van
      de Commissie;
        - *verordening (EU) nr. 600/2014 (MiFIR):* verordening (EU) nr. 600/2014 van het Europees parlement en de Raad van
      15 mei 2014 betreffende markten voor financiële instrumenten en tot wijziging van verordening (EU) nr. 648/2012
      (PbEU 2014, L 173);
        - *verordening (EU) nr. 806/2014 (gemeenschappelijk afwikkelingsmechanisme):* verordening (EU) nr. 806/2014
      van het Europees parlement en de Raad van 15 juli 2014 tot vaststelling van eenvormige regels en een eenvormige
      procedure voor de afwikkeling van kredietinstellingen en bepaalde beleggingsondernemingen in het kader van
      een gemeenschappelijk afwikkelingsmechanisme en een gemeenschappelijk afwikkelingsfonds en tot wijziging van
      Verordening (EU) nr. 1093/2010 (PbEU 2014, L 225);
        - *verordening (EU) nr. 909/2014 (centrale effectenbewaarinstellingen):* verordening (EU) nr. 909/2014 van het
      Europees Parlement en de Raad van 23 juli 2014 betreffende de verbetering van de effectenafwikkeling in de Europese
      Unie, betreffende centrale effectenbewaarinstellingen en tot wijziging van Richtlijnen 98/26/EG en 2014/65/EU en
      Verordening (EU) nr. 236/2012 (PbEU 2014, L 257);
        - *verordening (EU) nr. 1286/2014 (PRIIP’s):* verordening (EU) Nr. 1286/2014 van het Europees Parlement en
      de Raad van 26 november 2014 over essentiële-informatiedocumenten voor verpakte retailbeleggingsproducten en
      verzekeringsgebaseerde beleggingsproducten (PbEU 2014, L 352);
        - *Verordening (EU) nr. 2015/760 (Europese langetermijnbeleggingsinstellingen):* verordening (EU) nr. 2015/760 van
      het Europees Parlement en de Raad van 29 april 2015 betreffende Europese langetermijnbeleggingsinstellingen (PbEU
      2015, L 123);
        - *verordening (EU) nr. 2015/35 (Solvabiliteit II):* gedelegeerde verordening (EU) nr. 2015/35 van de Commissie
      van 10 oktober 2014 tot aanvulling van Richtlijn 2009/138/EG van het Europees Parlement en de Raad betreffende de
      toegang tot en uitoefening van het verzekerings- en het herverzekeringsbedrijf (Solvabiliteit II) (PbEU L 12);
        - *verordening (EU) nr. 2015/751 (afwikkelingsvergoedingen voor op kaarten gebaseerde betalingstransacties):*
      verordening (EU) nr. 2015/751 van het Europees Parlement en de Raad van 29 april 2015 betreffende
      afwikkelingsvergoedingen voor op kaarten gebaseerde betalingstransacties (PbEU 2015, L 123);
        - *verordening (EU) nr. 2016/1011 (benchmarks):* Verordening (EU) nr. 2016/1011 van het Europees Parlement en
      de Raad van 8 juni 2016 betreffende indices die worden gebruikt als benchmarks voor financiële instrumenten en
      financiële overeenkomsten of om de prestatie van beleggingsfondsen te meten en tot wijziging van [Richtlijnen
      2008/48/EG](32008L0048) en [2014/17](32014L0017)/EU en Verordening (EU) nr. [596/2014](32496L2014) (PbEU 2016,
      L 171);
        - *verordening (EU) nr. 2017/565 (MiFID II organisatorische vereisten):* gedelegeerde verordening (EU) nr. 2017/565
      van de Commissie van 25 april 2016 houdende aanvulling van [Richtlijn 2014/65](32014L0065)/EU van het Europees
      Parlement en de Raad wat betreft de door beleggingsondernemingen in acht te nemen organisatorische eisen en
      voorwaarden voor de bedrijfsuitoefening en wat betreft de definitie van begrippen voor de toepassing van genoemde
      richtlijn (PbEU 2017, L 87);
        - *verordening (EU) nr. 2017/1129 (prospectus):* verordening (EU) nr. 2017/1129 van het Europees Parlement en de
      Raad van 14 juni 2017 betreffende het prospectus dat moet worden gepubliceerd wanneer effecten aan het publiek
      worden aangeboden of tot de handel op een gereglementeerde markt worden toegelaten en tot intrekking van [Richtlijn
      2003/71/EG](32003L0071) (PbEU 2017, L 168);
        - *verordening (EU) nr. 2015/2365 (SFTR):* verordening (EU) nr. 2015/2365 van het Europees Parlement en de Raad
      van 25 november 2015 betreffende de transparantie van effectenfinancieringstransacties en van hergebruik en tot
      wijziging van Verordening (EU) nr. 648/2012 (PbEU 2015, L 337);
        - *verordening (EU) nr. 2017/2358 (productontwikkeling en -governance):* gedelegeerde verordening (EU)
      nr. 2017/2358 van de Commissie van 21 september 2017 tot aanvulling van [Richtlijn 2016/97](32016L0097)/EU
      van het Europees Parlement en de Raad met betrekking tot vereisten inzake producttoezicht en -governance voor
      verzekeringsondernemingen en verzekeringsdistributeurs (PbEU 2017, L 341);
        - *verordening (EU) nr. 2017/2359 (verzekeringen met een beleggingscomponent):* gedelegeerde verordening (EU)
      nr. 2017/2359 van de Commissie van 21 september 2017 tot aanvulling van [Richtlijn 2016/97](32016L0097)/EU van het
      Europees Parlement en de Raad ten aanzien van informatievereisten en gedragsregels die van toepassing zijn op de
      distributie van verzekeringsgebaseerde beleggingsproducten (PbEU 2017, L 341);
        - *verordening (EU) nr. 2017/2402 (securitisaties):* verordening (EU) nr. 2017/2402 van het Europees Parlement en
      de Raad van 12 december 2017 tot vaststelling van een algemeen kader voor securitisatie en tot vaststelling van
      een specifiek kader voor eenvoudige, transparante en gestandaardiseerde securitisatie, en tot wijziging van de
      [Richtlijnen 2009/65/EG](32009L0065), [2009/138/EG](32009L0138) en [2011/61](32011L0061)/EU en de Verordeningen
      (EG) nr. [1060/2009](32960L2009) en (EU) nr. [648/2012](32548L2012) (PbEU 2017, L 347);
        - *verordening (EU) nr. 2017/1131 (geldmarktfondsen):* verordening (EU) nr. 2017/1131 van het Europees Parlement en
      de Raad van 14 juni 2017 inzake geldmarktfondsen (PbEU 2017, L 169);
        - *verordening (EU) nr. 2019/1156 (grensoverschrijdende distributie van beleggingsinstellingen en icbe’s):*
      Verordening (EU) 2019/1156 van het Europees Parlement en de Raad van 20 juni 2019 betreffende het faciliteren
      van de grensoverschrijdende distributie van instellingen voor collectieve belegging en houdende wijziging van de
      Verordeningen (EU) nr. 345/2013, (EU) nr. 346/2013 en (EU) nr. 1286/2014 (PbEU 2019, L 188);
        - *verordening (EU) nr. 2019/1238 (PEPP):* Verordening (EU) nr. 2019/1238 van het Europees Parlement en de Raad van
      20 juni 2019 inzake een pan-Europees persoonlijk pensioenproduct (PEPP) (PbEU 2019, L 198);
        - *verordening (EU) nr. 2019/2033 (prudentiële vereisten beleggingsondernemingen):* [verordening (EU) 2019/2033]
      (32033R2019) van het Europees Parlement en de Raad van 27 november 2019 betreffende prudentiële vereisten voor
      beleggingsondernemingen en tot wijziging van [verordeningen (EU) nr. 1093/2010](32010R1093), [(EU) nr. 575/2013]
      (32013R0575), [(EU) nr. 600/2014](32014R0600) en [(EU) nr. 806/2014](32014R0806) (PbEU 2019, L 134);
        - *verordening (EU) nr. 2019/2088 (informatieverstrekking over duurzaamheid):* Verordening (EU) 2019/2088 van
      het Europees Parlement en de Raad van 27 november 2019 betreffende informatieverschaffing over duurzaamheid in de
      financiëledienstensector (PbEU 2019, L 317);
        - *verordening (EU) nr. 2020/852 (kader duurzame beleggingen):* Verordening (EU) 2020/852 van het Europees
      Parlement en de Raad van 18 juni 2020 betreffende de totstandbrenging van een kader ter bevordering van duurzame
      beleggingen en tot wijziging van Verordening (EU) 2019/2088 (PbEU 2020, L 198);
        - *verordening (EU) 2020/1503 (crowdfundingdienstverleners voor bedrijven):* [Verordening (EU)
      2020/1503](33403R2020) van het Europees Parlement en de Raad van 7 oktober 2020 betreffende Europese
      crowdfundingdienstverleners voor bedrijven en tot wijziging van [Verordening (EU) 2017/1129](33029R2017) en
      [Richtlijn (EU) 2019/1937](32019L1937) (PbEU 2020, L 347);
        - *verordening (EU) nr. 2021/23 (herstel en afwikkeling centrale tegenpartijen):* [verordening (EU) nr. 2021/23]
      (31923R2021) van het Europees Parlement en de Raad van 16 december 2020 betreffende een kader voor het herstel en
      de afwikkeling van centrale tegenpartijen en tot wijziging van de [Verordeningen (EU) nr. 1095/2010](32010R1095),
      [(EU) nr. 648/2012](32012R0648), [(EU) nr. 600/2014](32014R0600), [(EU) nr. 806/2014](32014R0806) en [(EU)
      2015/2365](32365R2015), en de [Richtlijnen 2002/47/EG](32002L0047), [2004/25/EG](32004L0025), [2007/36/EG]
      (32007L0036), [2014/59](32014L0059)/EU en (EU) [2017/1132](32017L1132) (PbEU 2021, L 22).


