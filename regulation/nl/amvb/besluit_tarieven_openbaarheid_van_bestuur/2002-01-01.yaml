preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister-President, Minister van Algemene Zaken van 9 oktober 1992, nr. 92 MOO6978,
    gedaan mede namens Onze Minister van Binnenlandse Zaken;

    Gelet op artikel 12 van de Wet openbaarheid van bestuur (Stb. 1991, 703);

    De Raad van State gehoord (advies van 16 november 1992, nr. W01.92.0484);

    Gezien het nader rapport van Onze Minister-President, Minister van Algemene Zaken en Onze Minister van Binnenlandse
    Zaken van 20 januari 1993, nr. 92 MOO9347;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0005869/2002-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Dit besluit is van toepassing op het verstrekken van informatie op verzoek op grond van de
      [Wet openbaarheid van bestuur][ref1] (*Stb.* 1991, 703) door overheidsorganen behorend tot de centrale overheid.


      [ref1]: https://wetten.overheid.nl/BWBR0005252
    url: https://wetten.overheid.nl/BWBR0005869/2002-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005252
  - number: '2.1'
    text: |-
      Voor het verstrekken van kopieën van documenten op grond van artikel 7, eerste lid, onder *a*, van de
      [Wet openbaarheid van bestuur][ref1] kan een vergoeding in rekening worden gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0005252
    url: https://wetten.overheid.nl/BWBR0005869/2002-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005252
  - number: '2.2'
    text: |-
      Indien een vergoeding in rekening wordt gebracht voor het verstrekken van kopieën van schriftelijke stukken,
      bedraagt deze: voor minder dan 6 kopieën: gratis; voor 6 tot 13 kopieën: € 4,50; voor 14 of meer kopieën: € 0,35
      per kopie.
    url: https://wetten.overheid.nl/BWBR0005869/2002-01-01#Artikel2
  - number: '2.3'
    text: |-
      Indien een vergoeding in rekening wordt gebracht voor het verstrekken van kopieën van ander materiaal dat gegevens
      bevat, bedraagt deze niet meer dan de kostprijs.
    url: https://wetten.overheid.nl/BWBR0005869/2002-01-01#Artikel2
  - number: '3.1'
    text: |-
      Voor het verstrekken van een uittreksel van een document of een samenvatting van de inhoud van een document op
      grond van artikel 7, eerste lid, onder *c*, van de [Wet openbaarheid van bestuur][ref1] kan een vergoeding in
      rekening worden gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0005252
    url: https://wetten.overheid.nl/BWBR0005869/2002-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005252
  - number: '3.2'
    text: |-
      Indien een vergoeding in rekening wordt gebracht, bedraagt deze € 2,25 per pagina van het uittreksel of de
      samenvatting.
    url: https://wetten.overheid.nl/BWBR0005869/2002-01-01#Artikel3
  - number: '4'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het *Staatsblad* waarin het wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0005869/2002-01-01#Artikel4
  - number: '5'
    text: 'Dit besluit wordt aangehaald als: Besluit tarieven openbaarheid van bestuur.'
    url: https://wetten.overheid.nl/BWBR0005869/2002-01-01#Artikel5
