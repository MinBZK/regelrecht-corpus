  - number: '2'
    text: >-
      1 De belastingplichtige bij wie bij de vaststelling van de aanslag inkomstenbelasting over het voorgaande
      kalenderjaar buitengewone uitgaven in aanmerking zijn genomen, heeft aanspraak op een financiële tegemoetkoming,
      indien de gecombineerde inkomensheffing over dat kalenderjaar lager is dan de gecombineerde heffingskorting. Het
      bedrag van de tegemoetkoming wordt berekend met toepassing van het derde lid.


      2 Voor de berekening van de tegemoetkoming wordt verstaan onder:


      a. A: de gecombineerde inkomensheffing over het voorgaande kalenderjaar;


      b. B: de gecombineerde heffingskorting over het voorgaande kalenderjaar;


      c. C: de gecombineerde inkomensheffing over het voorgaande kalenderjaar, indien bij de berekening daarvan de
      buitengewone uitgaven niet in aanmerking zouden zijn genomen.


      3 Indien C kleiner is dan B, is de tegemoetkoming gelijk aan het verschil tussen C en A. In andere gevallen is de
      tegemoetkoming gelijk aan het verschil tussen B en A.


      4 De tegemoetkoming wordt vastgesteld bij beschikking van de inspecteur. Indien binnen vijf jaren na het
      kalenderjaar waarop de tegemoetkoming betrekking heeft, blijkt dat de beschikking ten onrechte of tot een onjuist
      bedrag is vastgesteld, kan de inspecteur de beschikking herzien.


      5 De ontvanger is belast met het uitbetalen van de tegemoetkoming en met het invorderen van de geldschuld aan het
      Rijk die voortvloeit uit een herziening als bedoeld in het vierde lid.


      6 Bij regeling van Onze Minister en Onze Minister van Financiën kunnen nadere regels inzake de uitbetaling en
      invordering worden gesteld.


      7 Bij regeling van Onze Minister van Financiën worden de functionarissen van de rijksbelastingdienst aangewezen die
      voor de uitvoering van dit besluit als inspecteur en ontvanger fungeren.
    url: https://wetten.overheid.nl/BWBR0016555/2004-04-16#Artikel2
  - number: '3'
    text: >-
      1 De rijksbelastingdienst is belast met de uitvoering van dit besluit.


      2 De tegemoetkomingen op grond van dit besluit komen ten laste van de begroting van het ministerie van
      Volksgezondheid, Welzijn en Sport.
    url: https://wetten.overheid.nl/BWBR0016555/2004-04-16#Artikel3
  - number: '5'
    text: >-
      1 Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin het wordt
      geplaatst.


      2 Het besluit vervalt met ingang van 1 januari 2006, tenzij op dat tijdstip een voorstel van wet tot regeling van
      een met de regeling in dit besluit overeenkomende tegemoetkoming bij de Staten-Generaal is ingediend. Indien het
      voorstel wordt ingetrokken of indien een van beide kamers der Staten-Generaal besluit het voorstel niet aan te
      nemen, wordt het besluit ingetrokken met ingang van 1 januari daaropvolgend. Wordt het voorstel van wet tot wet
      verheven, dan wordt het besluit ingetrokken op het tijdstip van inwerkingtreding van die wet.


      3 Na het vervallen van dit besluit blijven de in dit besluit gestelde regels van toepassing ten aanzien van reeds
      verstreken kalenderjaren waarop de tegemoetkoming betrekking heeft.


      4
