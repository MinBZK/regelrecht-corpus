articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. Onze Minister: Onze Minister van Volksgezondheid, Welzijn en Sport;

      b. belastingplichtige: een belastingplichtige als bedoeld in
      [artikel 2.1, eerste lid, aanhef en onder a, van de Wet IB 2001][ref1];

      c. buitengewone uitgaven: buitengewone uitgaven als bedoeld in [afdeling 6.5 van de Wet IB 2001][ref2];

      d. verzamelinkomen: het verzamelinkomen, bedoeld in [artikel 2.18 van de Wet IB 2001][ref3];

      e. gecombineerde inkomensheffing: het bedrag van de gecombineerde inkomensheffing, bedoeld in
      [artikel 8.1, onderdeel b, van de Wet IB 2001][ref4];

      f. gecombineerde heffingskorting: het bedrag van de gecombineerde heffingskorting, bedoeld in
      [artikel 8.1, onderdeel d, van de Wet IB 2001][ref5], dat in aanmerking zou zijn genomen indien
      [artikel 8.8 van die wet][ref6] buiten toepassing zou zijn gebleven en verhoging op de voet van
      [artikel 8.9 van die wet][ref7] geen toepassing zou hebben gevonden.


