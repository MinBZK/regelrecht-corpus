  - number: '2.1'
    text: |-
      De belastingplichtige bij wie bij de vaststelling van de aanslag inkomstenbelasting over het voorgaande
      kalenderjaar buitengewone uitgaven in aanmerking zijn genomen, heeft aanspraak op een financiële tegemoetkoming,
      indien de gecombineerde inkomensheffing over dat kalenderjaar lager is dan de gecombineerde heffingskorting. Het
      bedrag van de tegemoetkoming wordt berekend met toepassing van het derde lid.
    url: https://wetten.overheid.nl/BWBR0016555/2006-01-01#Artikel2
  - number: '2.2'
    text: 'Voor de berekening van de tegemoetkoming wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0016555/2006-01-01#Artikel2
  - number: 2.2.a
    text: 'A: de gecombineerde inkomensheffing over het voorgaande kalenderjaar;'
    url: https://wetten.overheid.nl/BWBR0016555/2006-01-01#Artikel2
  - number: 2.2.b
    text: 'B: de gecombineerde heffingskorting over het voorgaande kalenderjaar;'
    url: https://wetten.overheid.nl/BWBR0016555/2006-01-01#Artikel2
  - number: 2.2.c
    text: |-
      C: de gecombineerde inkomensheffing over het voorgaande kalenderjaar, indien bij de berekening daarvan de
      buitengewone uitgaven niet in aanmerking zouden zijn genomen.
    url: https://wetten.overheid.nl/BWBR0016555/2006-01-01#Artikel2
  - number: '2.3'
    text: |-
      Indien C kleiner is dan B, is de tegemoetkoming gelijk aan het verschil tussen C en A. In andere gevallen is de
      tegemoetkoming gelijk aan het verschil tussen B en A.
    url: https://wetten.overheid.nl/BWBR0016555/2006-01-01#Artikel2
  - number: '2.4'
    text: |-
      Indien de belastingplichtige gedurende het gehele voorgaande kalenderjaar een partner heeft als bedoeld in
      [artikel 1.2 van de Wet inkomstenbelasting 2001][ref1], geldt voor de toepassing van het eerste, tweede en derde
      lid in plaats van de gecombineerde inkomensheffing en de gecombineerde heffingskorting het gezamenlijke bedrag van
      de gecombineerde inkomensheffing en de gecombineerde heffingskorting van de belastingplichtige en zijn partner.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel1
    url: https://wetten.overheid.nl/BWBR0016555/2006-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '1'
  - number: '2.5'
    text: |-
      De tegemoetkoming wordt vastgesteld bij beschikking van de inspecteur. Indien binnen vijf jaren na het kalenderjaar
      waarop de tegemoetkoming betrekking heeft, blijkt dat de beschikking ten onrechte of tot een onjuist bedrag is
      vastgesteld, kan de inspecteur de beschikking herzien.
    url: https://wetten.overheid.nl/BWBR0016555/2006-01-01#Artikel2
  - number: '2.6'
    text: |-
      De ontvanger is belast met het uitbetalen van de tegemoetkoming en met het invorderen van de geldschuld aan het
      Rijk die voortvloeit uit een herziening als bedoeld in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0016555/2006-01-01#Artikel2
  - number: '2.7'
    text: |-
      Bij regeling van Onze Minister en Onze Minister van Financiën kunnen nadere regels inzake de uitbetaling en
      invordering worden gesteld.
    url: https://wetten.overheid.nl/BWBR0016555/2006-01-01#Artikel2
  - number: '2.8'
    text: |-
      Bij regeling van Onze Minister van Financiën worden de functionarissen van de rijksbelastingdienst aangewezen die
      voor de uitvoering van dit besluit als inspecteur en ontvanger fungeren.
    url: https://wetten.overheid.nl/BWBR0016555/2006-01-01#Artikel2
  - number: '3.1'
    text: De rijksbelastingdienst is belast met de uitvoering van dit besluit.
    url: https://wetten.overheid.nl/BWBR0016555/2006-01-01#Artikel3
  - number: '3.2'
    text: |-
      De tegemoetkomingen op grond van dit besluit komen ten laste van de begroting van het ministerie van
      Volksgezondheid, Welzijn en Sport.
    url: https://wetten.overheid.nl/BWBR0016555/2006-01-01#Artikel3
  - number: '5'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin het wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0016555/2006-01-01#Artikel5
  - number: '6'
    text: 'Dit besluit wordt aangehaald als: Tijdelijk besluit tegemoetkoming buitengewone uitgaven.'
    url: https://wetten.overheid.nl/BWBR0016555/2006-01-01#Artikel6
