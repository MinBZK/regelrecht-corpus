      2 Het bestuur van de veiligheidsregio bepaalt bij het vaststellen van gewijzigde eisen, bedoeld in het eerste lid,
      een termijn waarbinnen aan die eisen moet zijn voldaan.

      3 [Artikel 7.3, vierde en zesde lid][ref2], is van overeenkomstige toepassing.


