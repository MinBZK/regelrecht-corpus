  - number: '7.3'
    text: |-
      1 Indien het bestuur van de veiligheidsregio van oordeel is dat de locatie, waarop een of meer milieubelastende
      activiteiten worden verricht of de inrichting, bedoeld in [artikel 15, onderdeel b, van de Kernenergiewet][ref1],
      in geval van een brand of ongeval bijzonder gevaar kan opleveren voor de openbare veiligheid, wijst het bestuur die
      locatie of inrichting aan als bedrijfsbrandweerplichtig. Het bestuur bepaalt daarbij de termijn waarbinnen over een
      bedrijfsbrandweer dient te worden beschikt.

      2 Als voor een milieubelastende activiteit als bedoeld in [artikel 7.1, eerste lid][ref2], een aanvraag om
      een omgevingsvergunning is ingediend vindt de aanwijzing bedoeld in het eerste lid, plaats binnen 26 weken na
      ontvangst van het rapport inzake de bedrijfsbrandweer. Als op het moment van het verstrijken van die termijn de
      omgevingsvergunning nog niet onherroepelijk is, vindt de aanwijzing in afwijking van de eerste zin plaats binnen 8
      weken na het onherroepelijk worden van de omgevingsvergunning.

      3 In de aanwijzing stelt het bestuur van de veiligheidsregio de begrenzing vast van de locatie of de inrichting
      waarop de aanwijzing van toepassing is.

      4 Het bestuur van de veiligheidsregio gaat niet over tot het aanwijzen dan nadat de bestuursorganen, bedoeld in
      [artikel 7.2, vierde lid][ref3], door het bestuur in de gelegenheid zijn gesteld advies ter zake uit te brengen.

      5 Het bestuur van de veiligheidsregio kan locaties of inrichtingen aanwijzen waarvoor degenen die de
      milieubelastende activiteiten verrichten op die locaties respectievelijk de exploitanten van die inrichtingen
      gezamenlijk dienen te beschikken over een bedrijfsbrandweer. Het vierde lid is van overeenkomstige toepassing.

      6 Het bestuur van de veiligheidsregio stuurt een afschrift van de aanwijzing aan de bestuursorganen, bedoeld in
      [artikel 7.2, vierde lid][ref4].

      7 Het bestuur van de veiligheidsregio kan in de aanwijzing, bedoeld in het eerste en vijfde lid, slechts eisen
      stellen aan:

      a. de geoefendheid en de samenstelling van de bedrijfsbrandweer waarbij de functies genoemd in het
      [Besluit personeel veiligheidsregio’s][ref5], kunnen worden aangewezen;

      b. de voorzieningen inzake bluswater, melding, alarmering en verbindingen;

      c. het blusmaterieel;

      d. de beschermende middelen;

      e. de alarmering van en samenwerking met de brandweer en andere hulpverleningsorganisaties; en

      f. de omvang van het personeel en het materieel van de bedrijfsbrandweer.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
