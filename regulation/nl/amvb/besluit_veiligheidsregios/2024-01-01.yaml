  - number: '7.4'
    text: |-
      1 Na wijziging of uitbreiding van een aangewezen locatie, van een milieubelastende activiteit op een aangewezen
      locatie of van een inrichting, bedoeld in [artikel 15, onderdeel b, van de Kernenergiewet][ref1], dan wel
      verandering van de gebezigde processen die in betekenende mate consequenties hebben voor de inhoud van het
      rapport, verstrekt degene die de milieubelastende activiteit verricht of de exploitant van de inrichting zo spoedig
      mogelijk een dienovereenkomstig gewijzigd rapport aan het bestuur van de veiligheidsregio. Als voor de wijziging,
      uitbreiding of verandering een aanvraag om een omgevingsvergunning is ingediend wordt het gewijzigd rapport
      gelijktijdig met die aanvraag verstrekt aan het bestuur van de veiligheidsregio.

      2 [Artikel 7.2, derde tot en met vijfde lid][ref2], is van overeenkomstige toepassing.

      3 Indien het gewijzigde rapport, het veiligheidsrapport of de wijziging daarvan daartoe aanleiding geven, kan het
      bestuur van de veiligheidsregio de aanwijzing intrekken dan wel de bij de aanwijzing gestelde eisen wijzigen.

      4 Het bestuur van de veiligheidsregio bepaalt bij het vaststellen van gewijzigde eisen, bedoeld in het derde lid,
      een termijn waarbinnen aan die eisen moet zijn voldaan.

      5 [Artikel 7.3, vierde en zesde lid][ref3], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0027844#Artikel7.2
