  - number: '7.6'
    text: |-
      1 Op een aanwijzing die Onze Minister geeft ten aanzien van een locatie of inrichting die is gelegen op of deel
      uitmaakt van een bij de krijgsmacht in gebruik zijnd terrein, zijn de [artikelen 7.1 tot en met 7.5][ref1] van
      overeenkomstige toepassing met dien verstande dat Onze Minister tevens een exemplaar van het rapport zendt aan de
      Minister van Defensie en het bestuur van de veiligheidsregio.

      2 Onze Minister zendt een rapport aan het bestuur van de veiligheidsregio nadat hij het rapport zodanig heeft
      bewerkt dat de gegevens waarvoor geheimhouding geboden is, daarin niet voorkomen of daaruit niet kunnen worden
      afgeleid.


      [ref1]: https://wetten.overheid.nl/BWBR0027844#Artikel7.1
    url: https://wetten.overheid.nl/BWBR0027844/2024-01-01#Artikel7.6
    references:
      - id: ref1
        bwb_id: BWBR0027844
        artikel: '7.1'
        hoofdstuk: '7'
  - number: '8.1'
    text: |-
      1 Onze Minister stelt, onder voorbehoud van goedkeuring van de begroting van de uitgaven en de ontvangsten van
      het Ministerie van Veiligheid en Justitie, jaarlijks vóór 1 juli voor het eerstvolgende jaar de bijdrage voor de
      doeluitkering aan de veiligheidsregio’s vast. Het voor de doeluitkering beschikbare totaalbedrag, bestaat uit de
      bedragen, bedoeld in [artikel 8.2][ref1] en uit een vast en een variabel deel. Het vaste en variabele deel worden
      verdeeld volgens het verdeelsysteem in [bijlage 2][ref2] bij dit besluit.

      2 Onze Minister kan de jaarlijkse bijdrage bijstellen in verband met loon- en prijsmutaties die tot wijziging van
      het voor de doeluitkering beschikbare bedrag leiden.

      3 Onze Minister kan de jaarlijkse bijdrage bijstellen in verband met andere dan in het tweede lid bedoelde
      wijzigingen van het voor de doeluitkering beschikbare bedrag.

      4 Onze Minister stelt het bestuur van de veiligheidsregio zo spoedig mogelijk op de hoogte van een besluit tot
      bijstelling als bedoeld in het tweede en derde lid.

      5 Verrekening van bijstellingen in de jaarlijkse bijdrage vindt uiterlijk plaats op 1 december van het jaar waarop
      de jaarlijkse bijdrage betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0027844#Artikel8.2
      [ref2]: https://wetten.overheid.nl/BWBR0027844
    url: https://wetten.overheid.nl/BWBR0027844/2024-01-01#Artikel8.1
    references:
      - id: ref1
        bwb_id: BWBR0027844
        artikel: '8.2'
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0027844
  - number: '8.2'
    text: |-
      1 In verband met extra voorzieningen voor de Waddeneilanden ontvangt de veiligheidsregio Fryslân jaarlijks een
      bedrag van € 150.000,– en de veiligheidsregio Noord-Holland-Noord jaarlijks een bedrag van € 28.000,–.

      2 In verband met extra voorzieningen voor de luchthaven Schiphol ontvangt de veiligheidsregio Kennemerland
      jaarlijks een bedrag van € 5.000.000,–.

      3 Voor de interregionale versterking van de veiligheidsregio’s Amsterdam-Amstelland en Kennemerland in verband met
      de luchthaven Schiphol ontvangt de veiligheidsregio Kennemerland jaarlijks een bedrag van € 2.500.000,–.

      4 Voor de uitvoering van de taak, bedoeld in [artikel 4.1.6][ref1], ontvangen de veiligheidsregio’s, genoemd in
      [bijlage 1][ref2] bij dit besluit, elk jaarlijks een bedrag van € 175.000,–.


      [ref1]: https://wetten.overheid.nl/BWBR0027844#Artikel4.1.6
      [ref2]: https://wetten.overheid.nl/BWBR0027844
    url: https://wetten.overheid.nl/BWBR0027844/2024-01-01#Artikel8.2
    references:
      - id: ref1
        bwb_id: BWBR0027844
        artikel: 4.1.6
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0027844
  - number: '8.3'
    text: |-
      1 Onze Minister kan aan een veiligheidsregio een incidentele bijdrage verstrekken.

      2 Een incidentele bijdrage kan onder voorwaarden worden verleend.
    url: https://wetten.overheid.nl/BWBR0027844/2024-01-01#Artikel8.3
  - number: '8.4'
    text: |-
      De betaling van de ingevolge de [artikelen 8.1][ref1] en [8.2][ref2] toegekende bijdragen vindt plaats in vier
      gelijke termijnen, op de eerste werkdag na de 14e van de eerste maand van ieder kwartaal.


      [ref1]: https://wetten.overheid.nl/BWBR0027844#Artikel8.1
      [ref2]: https://wetten.overheid.nl/BWBR0027844#Artikel8.2
    url: https://wetten.overheid.nl/BWBR0027844/2024-01-01#Artikel8.4
    references:
      - id: ref1
        bwb_id: BWBR0027844
        artikel: '8.1'
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0027844
        artikel: '8.2'
        hoofdstuk: '8'
  - number: '8.5'
    text: |-
      Het bestuur van de veiligheidsregio besteedt de bijdrage voor de doeluitkering aan de uitvoering van taken die aan
      het bestuur op grond van [artikel 10 van de wet][ref1] zijn toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0027466#Artikel10
    url: https://wetten.overheid.nl/BWBR0027844/2024-01-01#Artikel8.5
    references:
      - id: ref1
        bwb_id: BWBR0027466
        artikel: '10'
  - number: '8.6'
    text: |-
      Indien de accountant een afkeurende verklaring of een verklaring met beperking of oordeelsonthouding heeft gegeven,
      kan Onze Minister de jaarlijkse bijdrage voor de doeluitkering voor een volgend jaar verminderen.
    url: https://wetten.overheid.nl/BWBR0027844/2024-01-01#Artikel8.6
  - number: '9.1'
    text: |-
      1 De rampbestrijdingsplannen die op grond van het [Besluit rampbestrijdingsplannen inrichtingen][ref1]
      zijn vastgesteld door de burgemeester, blijven van kracht. Onverminderd het bepaalde in
      [artikel 6.1.7, tweede lid][ref2], worden zij door het bestuur van de veiligheidsregio opnieuw vastgesteld indien
      deze dit nodig oordeelt.

      2 De rampbestrijdingsplannen die op grond van het [Besluit rampbestrijdingsplannen luchtvaartterreinen][ref3] zijn
      vastgesteld door de burgemeester, blijven van kracht. Zij worden door het bestuur van de veiligheidsregio opnieuw
      vastgesteld indien deze dit nodig oordeelt.


      [ref1]: https://wetten.overheid.nl/BWBR0010506
      [ref2]: https://wetten.overheid.nl/BWBR0027844#Artikel6.1.7
      [ref3]: https://wetten.overheid.nl/BWBR0012703
    url: https://wetten.overheid.nl/BWBR0027844/2024-01-01#Artikel9.1
    references:
      - id: ref1
        bwb_id: BWBR0010506
      - id: ref2
        bwb_id: BWBR0027844
        artikel: 6.1.7
        hoofdstuk: '6'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0012703
  - number: '9.2'
    text: |-
      Een aanwijzing, vastgesteld op grond van [artikel 4 van het Besluit bedrijfsbrandweren][ref1], blijft van kracht
      met dien verstande dat de aanwijzing kan worden ingetrokken of de bij de aanwijzing gestelde eisen kunnen worden
      gewijzigd met toepassing van de [artikelen 7.4 tot en met 7.6][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004694#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0027844#Artikel7.4
    url: https://wetten.overheid.nl/BWBR0027844/2024-01-01#Artikel9.2
    references:
      - id: ref1
        bwb_id: BWBR0004694
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0027844
        artikel: '7.4'
        hoofdstuk: '7'
  - number: '9.3'
    text: |-
      Dit besluit treedt in werking op het tijdstip waarop de [Wet veiligheidsregio’s][ref1] in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0027466
    url: https://wetten.overheid.nl/BWBR0027844/2024-01-01#Artikel9.3
    references:
      - id: ref1
        bwb_id: BWBR0027466
  - number: '9.4'
    text: 'Dit besluit wordt aangehaald als: Besluit veiligheidsregio’s.'
    url: https://wetten.overheid.nl/BWBR0027844/2024-01-01#Artikel9.4
