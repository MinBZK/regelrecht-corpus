  - number: '7.1'
    text: |-
      1 Het bestuur van de veiligheidsregio kan als bedrijfsbrandweerplichtig aanwijzen een locatie waarop een of meer
      van de volgende milieubelastende activiteiten worden verricht:

      a. het exploiteren van een Seveso-inrichting, bedoeld in
      [artikel 3.50, eerste lid, van het Besluit activiteiten leefomgeving][ref1];

      b. het opslaan van gevaarlijke stoffen, bedoeld in
      [artikel 3.27, eerste lid, van het Besluit activiteiten leefomgeving][ref2], voor zover het gaat om het opslaan in
      een opslagplaats voor korte tijd en in afwachting van aansluitend vervoer naar een vooraf bekende ontvanger van:

      1°. 10.000 kg of meer gevaarlijke stoffen, als het geheel of gedeeltelijk gaat om brandbare gevaarlijke stoffen
      met fluor-, chloor-, broom-, stikstof- of zwavelhoudende verbindingen, of zowel brandbare gevaarlijke stoffen als
      gevaarlijke stoffen met die verbindingen;

      2°. meer dan 1.500 l giftige of bijtende gassen van ADR-klasse 2 in gasflessen; of

      3°. meer dan 1.500 l tot vloeistof verdichte gassen in de gevarenklasse acute toxiciteit, categorie 1, 2 of 3,
      bedoeld in bijlage I, deel 3, bij de CLP-verordening, in gasflessen;

      c. het voor het vervoer van stoffen of goederen opslaan van stoffen of goederen, bedoeld in
      [artikel 3.285 van het Besluit activiteiten leefomgeving][ref3], voor zover het gaat om het opslaan voor korte tijd
      en in afwachting van aansluitend vervoer naar een vooraf bekende ontvanger van:

      1°. vuurwerk of pyrotechnische artikelen voor theatergebruik;

      2°. ontplofbare stoffen van ADR-klasse 1 door een ander dan de Nederlandse of een bondgenootschappelijke
      krijgsmacht; of

      3°. gevaarlijke stoffen als bedoeld in artikel 3, tiende lid, van de Seveso-richtlijn, in een hoeveelheid van ten
      minste de drempelwaarde, genoemd in bijlage I, deel 1, kolom 2, of deel 2, kolom 2, bij de Seveso-richtlijn, met
      inachtneming van de aantekeningen bij die bijlage;

      d. het voor het vervoer van stoffen of goederen opstellen van voertuigen, opleggers of aanhangers met gevaarlijke
      stoffen, bedoeld in [artikel 3.285 van het Besluit activiteiten leefomgeving][ref4], voor zover het gaat om:

      1°. het voor meer dan 24 uur opstellen van voertuigen, opleggers of aanhangers met gevaarlijke stoffen als bedoeld
      in [artikel 3.27, eerste lid, onder a, b of c][ref5]; of

      2°. het opstellen van meer dan drie voertuigen, opleggers of aanhangers met gevaarlijke stoffen als bedoeld in
      [artikel 3.27, eerste lid, onder a, b of c][ref6]; en

      e. het exploiteren van een spoorwegemplacement, bedoeld in
      [artikel 3.295a van het Besluit activiteiten leefomgeving][ref7].

      2 Het bestuur van de veiligheidsregio kan ook als bedrijfsbrandweerplichtig aanwijzen een inrichting als
      bedoeld in [artikel 15, onderdeel b, van de Kernenergiewet][ref8], met uitzondering van een inrichting waarop
      [artikel 44 van het Besluit kerninstallaties, splijtstoffen en ertsen][ref9] van toepassing is.


