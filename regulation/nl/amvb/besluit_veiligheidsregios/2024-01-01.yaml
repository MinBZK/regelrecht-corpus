  - number: '7.2'
    text: |-
      1 Alvorens tot aanwijzing over te gaan, verzoekt het bestuur van de veiligheidsregio degene die de
      milieubelastende activiteit op de locatie verricht of de exploitant van de inrichting, bedoeld in
      [artikel 15, onderdeel b, van de Kernenergiewet][ref1], waarvan het bestuur redelijkerwijs kan vermoeden dat deze
      in geval van een brand of ongeval bijzonder gevaar voor de openbare veiligheid kan opleveren, binnen een door het
      bestuur te stellen termijn een rapport inzake de bedrijfsbrandweer over te leggen, dat de volgende gegevens bevat:

      a. een aanduiding van de begrenzing van de locatie en een algemene beschrijving van:

      1°. de locatie waarop een of meer milieubelastende activiteiten worden verricht of de inrichting, bedoeld in
      [artikel 15, onderdeel b, van de Kernenergiewet][ref2];

      2°. de milieubelastende activiteiten die worden verricht op de locatie en andere milieubelastende activiteiten die
      de milieubelastende activiteiten op de locatie functioneel ondersteunen;

      3°. de op de locatie of in de inrichting, bedoeld in [artikel 15, onderdeel b, van de Kernenergiewet][ref3],
      voorkomende stoffen; en

      4°. de eigenschappen van deze stoffen;

      b. een algemene beschrijving van de processen die op de locatie waarop de milieubelastende activiteiten worden
      verricht of in de inrichting, bedoeld in [artikel 15, onderdeel b, van de Kernenergiewet][ref4], plaatsvinden;

      c. een beschrijving van de aard, de omvang, het verloop in de tijd en de bestrijding of de beheersing van een
      brand of een ongeval op de locatie waarop de milieubelastende activiteiten worden verricht of op het terrein van de
      inrichting, bedoeld in [artikel 15, onderdeel b, van de Kernenergiewet][ref5]:

      1°. die gegeven de aard van een installatie of de milieubelastende activiteiten die op de locatie worden verricht
      of gegeven de aard van de inrichting, bedoeld in [artikel 15, onderdeel b, van de Kernenergiewet][ref6], rekening
      houdend met de daarin aangebrachte preventieve voorzieningen, als reëel en typerend wordt geacht;

      2°. waarbij schade aan gebouwen of personen in de omgeving van de locatie waarop de
      milieubelastende activiteiten worden verricht of in de omgeving van de inrichting, bedoeld in
      [artikel 15, onderdeel b, van de Kernenergiewet][ref7], kan ontstaan, en

      3°. waarbij van preventieve of repressieve maatregelen duidelijk effect verwacht mag worden, waardoor escalatie
      daarvan wordt voorkomen;

      d. de maatgevende incidentscenario’s dat wil zeggen de geloofwaardige incidentscenario’s, bedoeld in onderdeel c,
      die bepalend zijn voor de omvang en de uitrusting van de bedrijfsbrandweer;

      e. een beschrijving van de organisatie van de nodig geachte bedrijfsbrandweer, waaronder de omvang van het
      personeel en het materieel.

      2 Als voor een milieubelastende activiteit als bedoeld in [artikel 7.1, eerste lid][ref8], een aanvraag
      om een omgevingsvergunning wordt ingediend, wordt het verzoek, bedoeld in het eerste lid, zo spoedig
      mogelijk gedaan nadat het bestuur van de veiligheidsregio in de gelegenheid is gesteld advies als bedoeld in
      [artikel 4.33 van het Omgevingsbesluit][ref9] uit te brengen.

      3 Indien gegevens als bedoeld in het eerste lid reeds zijn opgenomen in een veiligheidsrapport, kan in het rapport
      worden volstaan met een verwijzing naar de desbetreffende gegevens.

      4 Het bestuur van de veiligheidsregio zendt een exemplaar van het rapport aan:

      a. de toezichthouder, bedoeld in [artikel 1, derde lid, onderdeel d, van de Arbeidsomstandighedenwet][ref10];

      b. het college van burgemeester en wethouders van de gemeente waarin de locatie of de inrichting, bedoeld in
      [artikel 15, onderdeel b, van de Kernenergiewet][ref11], is gelegen;

      c. het bestuursorgaan dat beslist op een aanvraag om een omgevingsvergunning voor de
      milieubelastende activiteit of op een aanvraag om een vergunning voor de inrichting, bedoeld in
      [artikel 15, onderdeel b, van de Kernenergiewet][ref12]; en

      d. Onze Minister van Infrastructuur en Milieu, indien de locatie of inrichting, bedoeld in
      [artikel 15, onderdeel b, van de Kernenergiewet][ref13], is gelegen op of deel uitmaakt van, een luchthaven als
      bedoeld in [artikel 1.1, eerste lid, van de Wet luchtvaart][ref14].

      5 Het bestuur van de veiligheidsregio kan degene die de milieubelastende activiteiten op de locatie verricht of de
      exploitant van de inrichting, bedoeld in [artikel 15, onderdeel b, van de Kernenergiewet][ref15], verzoeken om aan
      het bestuur aanvullende gegevens te verschaffen.


