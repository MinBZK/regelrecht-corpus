  - number: 6.3.2
    text: |-
      Degene die de winningsafvalvoorziening categorie A exploiteert, verstrekt bij een aanvraag om een
      omgevingsvergunning voor het exploiteren van die afvalvoorziening of op enig ander tijdstip aan het bevoegd gezag,
      bedoeld in [artikel 6.3.1, derde lid][ref1], en het bestuur van de veiligheidsregio de gegevens die nodig zijn
      opdat zij hun taken in het kader van de voorbereiding van bestrijding van een ramp naar behoren kunnen uitvoeren.
      Dit geldt niet voor zover deze gegevens reeds op grond van andere voorschriften zijn verschaft of kunnen worden
      verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0027844#Artikel6.3.1
