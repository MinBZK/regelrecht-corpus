articles:
  - number: '1.1'
    text: |-
      In dit besluit wordt verstaan onder:

        - *commando plaats incident:* commando plaats incident als bedoeld in [artikel 2.1.2][ref1];
        - *gemeentelijk beleidsteam:* gemeentelijk beleidsteam als bedoeld in [artikel 2.1.5][ref2];
        - *grootschalige alarmering:* het bij een ramp of crisis onverwijld en volledig alarmeren van
      de onderdelen van de hoofdstructuur van de rampenbestrijding en crisisbeheersing, bedoeld in
      [artikel 2.1.1, onderdelen b tot en met d][ref3];
        - *hogedrempelinrichting:* hogedrempelinrichting als bedoeld in
      [bijlage I bij het Besluit activiteiten leefomgeving][ref4];
        - *hoofdstructuur van de rampenbestrijding en crisisbeheersing:* hoofdstructuur van de rampenbestrijding en
      crisisbeheersing als bedoeld in [artikel 2.1.1][ref5];
        - *meldkamer:* gemeenschappelijke meldkamer, bedoeld in [artikel 35, eerste lid, van de wet][ref6];
        - *omgevingsvergunning:* omgevingsvergunning voor een milieubelastende activiteit als bedoeld in
      [artikel 5.1, tweede lid, aanhef en onderdeel b, van de Omgevingswet][ref7];
        - *opkomsttijd:* de tijd tussen aanname van de melding door de meldkamer en de aankomst van de eerste
      brandweereenheid op de plaats van het incident;
        - *rapport:* rapport inzake de bedrijfsbrandweer, bedoeld in [artikel 7.2, eerste lid][ref8];
        - *regionaal beleidsteam:* regionaal beleidsteam als bedoeld in [artikel 39, tweede lid, van de wet][ref9];
        - *regionaal operationeel team:* regionaal operationeel team als bedoeld in [artikel 2.1.4][ref10];
        - *risicoprofiel:* risicoprofiel als bedoeld in [artikel 15 van de wet][ref11];
        - *Seveso-inrichting:* Seveso-inrichting als bedoeld in
      [bijlage I bij het Besluit activiteiten leefomgeving][ref12];
        - *Seveso-richtlijn:* [Richtlijn 2012/18](32012L0018)/EU van het Europees Parlement en de Raad van 4 juli 2012
      betreffende de beheersing van de gevaren van zware ongevallen waarbij gevaarlijke stoffen zijn betrokken, houdende
      wijziging en vervolgens intrekking van [Richtlijn 96/82/EG](31996L0082) van de Raad (PbEU 2012, L 197);
        - *team bevolkingszorg:* team bevolkingszorg als bedoeld in [artikel 2.1.3][ref13];
        - *veiligheidsrapport:* rapport als bedoeld in [artikel 4.14 van het Besluit activiteiten leefomgeving][ref14];
        - *wet:* [Wet veiligheidsregio’s][ref15].


