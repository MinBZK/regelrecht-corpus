      1 Na wijziging van de omgeving van een aangewezen locatie of inrichting die in betekenende mate
      consequenties heeft voor gegevens over de geloofwaardige en maatgevende incidentscenario’s, bedoeld in
      [artikel 7.2, eerste lid, onderdeel c en d][ref1], kan het bestuur van de veiligheidsregio de aanwijzing intrekken
