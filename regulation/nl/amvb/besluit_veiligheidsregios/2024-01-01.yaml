  - number: '1.2'
    text: |-
      Een wijziging van de Seveso-richtlijn geldt voor de toepassing van dit besluit met ingang van de dag waarop aan de
      betrokken wijziging uitvoering moet zijn gegeven, tenzij bij ministerieel besluit, dat in de Staatscourant wordt
      bekendgemaakt, een ander tijdstip wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0027844/2024-01-01#Artikel1.2
  - number: 2.1.1
    text: |-
      Het bestuur van de veiligheidsregio draagt zorg voor de inrichting van de hoofdstructuur van de rampenbestrijding
      en crisisbeheersing, die bestaat uit de volgende onderdelen:

      a. de meldkamer;

      b. een of meer commando’s plaats incident, afhankelijk van de aard van de ramp of crisis en de wijze waarop deze
      zich ontwikkelt;

      c. een of meer teams bevolkingszorg, afhankelijk van de aard van de ramp of crisis en de wijze waarop deze zich
      ontwikkelt;

      d. een regionaal operationeel team, en

      e. een gemeentelijk beleidsteam of, bij een bovenlokale ramp of crisis, een regionaal beleidsteam.
    url: https://wetten.overheid.nl/BWBR0027844/2024-01-01#Artikel2.1.1
  - number: 2.1.2
    text: |-
      1 Een commando plaats incident bestaat ten minste uit:

      a. een leider commando plaats incident;

      b. een officier van dienst van de brandweer;

      c. een officier van dienst geneeskundig;

      d. een officier van dienst van de politie of van de Koninklijke marechaussee;

      e. een informatiemanager commando plaats incident, en

      f. een functionaris crisiscommunicatie commando plaats incident.

      2 Een commando plaats incident is belast met de operationele leiding ter plaatse, de afstemming met andere
      betrokken partijen als bedoeld in [artikel 16, tweede lid, van de wet][ref1], en het adviseren van het regionaal
      operationeel team.


      [ref1]: https://wetten.overheid.nl/BWBR0027466#Artikel16
    url: https://wetten.overheid.nl/BWBR0027844/2024-01-01#Artikel2.1.2
    references:
      - id: ref1
        bwb_id: BWBR0027466
        artikel: '16'
  - number: 2.1.3
    text: |-
      1 Een team bevolkingszorg bestaat ten minste uit de door het college van burgemeester en wethouders aangewezen
      functionarissen, van wie één functionaris is belast met de leiding van het team, één functionaris met het
      informatiemanagement, en één functionaris met de coördinatie van de crisiscommunicatie.

      2 Een team bevolkingszorg zorgt dat de volgende taken worden uitgevoerd:

      a. het verzorgen van de crisiscommunicatie;

      b. het voorzien in opvang en verzorging van de bevolking;

      c. het verzorgen van nazorg voor de bevolking;

      d. het registreren van de slachtoffers,

      e. het registreren van schadegevallen, en

      f. het adviseren van het regionaal operationeel team.
    url: https://wetten.overheid.nl/BWBR0027844/2024-01-01#Artikel2.1.3
  - number: 2.1.4
    text: |-
      1 Een regionaal operationeel team bestaat ten minste uit:

      a. een regionaal operationeel leider;

      b. een sectie brandweer;

      c. een sectie GHOR;

      d. een sectie politie;

      e. een sectie bevolkingszorg;

      f. een sectie informatiemanagement, en

      g. een functionaris crisiscommunicatie regionaal operationeel team.

      2 Een regionaal operationeel team is belast met de operationele leiding, de afstemming met andere bij de ramp of
      crisis betrokken partijen en het adviseren van het gemeentelijk of regionaal beleidsteam.

      3 Indien er meer commando’s plaats incident zijn, is het regionaal operationeel team belast met de coördinatie
      daarvan.
    url: https://wetten.overheid.nl/BWBR0027844/2024-01-01#Artikel2.1.4
  - number: 2.1.5
    text: |-
      1 Een gemeentelijk beleidsteam bestaat bij opkomst ten minste uit leidinggevenden van de brandweer, de GHOR, de
      politie en de bevolkingszorg.

      2 Een gemeentelijk beleidsteam ondersteunt de burgemeester bij de rampenbestrijding en crisisbeheersing.
    url: https://wetten.overheid.nl/BWBR0027844/2024-01-01#Artikel2.1.5
  - number: 2.2.1
    text: |-
      Het bestuur van de veiligheidsregio stelt criteria vast voor de situaties waarin de meldkamer tot grootschalige
      alarmering overgaat.
    url: https://wetten.overheid.nl/BWBR0027844/2024-01-01#Artikel2.2.1
  - number: 2.2.2
    text: |-
      1 Zodra is vastgesteld dat is voldaan aan de criteria voor grootschalige alarmering wordt de meldkamer door één
      leidinggevende aangestuurd.

      2 Het bestuur van de veiligheidsregio stemt met de korpschef af op welke wijze de meldingen die geen verband houden
      met een ramp of crisis worden afgehandeld.
    url: https://wetten.overheid.nl/BWBR0027844/2024-01-01#Artikel2.2.2
  - number: 2.2.3
    text: |-
      1 Binnen twee minuten nadat is vastgesteld dat is voldaan aan de criteria voor grootschalige alarmering,
      begint de meldkamer met de alarmering van de onderdelen van de hoofdstructuur van de rampenbestrijding en
      crisisbeheersing, bedoeld in [artikel 2.1.1, onderdelen b tot en met d][ref1], en wordt de burgemeester of in
      het geval [artikel 39 van de wet][ref2] van toepassing is, de voorzitter van de veiligheidsregio en de betrokken
      burgemeesters geïnformeerd.

      2 Afhankelijk van de aard en omstandigheden van de ramp of crisis, alarmeert de meldkamer andere functionarissen en
      eenheden die nodig zijn voor de rampenbestrijding en crisisbeheersing.


      [ref1]: https://wetten.overheid.nl/BWBR0027844#Artikel2.1.1
      [ref2]: https://wetten.overheid.nl/BWBR0027466#Artikel39
    url: https://wetten.overheid.nl/BWBR0027844/2024-01-01#Artikel2.2.3
    references:
      - id: ref1
        bwb_id: BWBR0027844
        artikel: 2.1.1
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0027466
        artikel: '39'
  - number: 2.2.4
    text: |-
      Binnen vijf minuten nadat is vastgesteld dat is voldaan aan de criteria voor grootschalige alarmering geeft de
      meldkamer, op grond van de beschikbare gegevens, een zo volledig mogelijke beschrijving van het incident aan de
      onderdelen van de hoofdstructuur van de rampenbestrijding en crisisbeheersing en aan andere functionarissen of
      eenheden als bedoeld in [artikel 2.2.3, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0027844#Artikel2.2.3
    url: https://wetten.overheid.nl/BWBR0027844/2024-01-01#Artikel2.2.4
    references:
      - id: ref1
        bwb_id: BWBR0027844
        artikel: 2.2.3
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 2.2.5
    text: |-
      Het bestuur van de veiligheidsregio draagt zorg voor een voorziening waardoor in het geval dat de meldkamer
      uitvalt, de functie en taken van de meldkamer worden gecontinueerd.
    url: https://wetten.overheid.nl/BWBR0027844/2024-01-01#Artikel2.2.5
  - number: 2.3.1
    text: |-
      1 De besturen van de veiligheidsregio’s hanteren een uniforme opschalingsprocedure.

      2 Onze Minister kan nadere regels geven over de opschalingsprocedure.
    url: https://wetten.overheid.nl/BWBR0027844/2024-01-01#Artikel2.3.1
  - number: 2.3.2
    text: |-
      1 Vanaf het moment dat is vastgesteld dat is voldaan aan de criteria, bedoeld in [artikel 2.2.1][ref1] beginnen de
      volgende onderdelen of functionarissen binnen de gestelde tijd met de uitvoering van hun taken:

      a. een eerste commando plaats incident binnen dertig minuten;

      b. de leidinggevenden binnen een regionaal operationeel team binnen vijfenveertig minuten, met uitzondering van de
      leidinggevende van de sectie informatiemanagement, die binnen dertig minuten begint;

      c. functionaris crisiscommunicatie regionaal operationeel team binnen dertig minuten;

      d. de sectie informatiemanagement van een regionaal operationeel team binnen veertig minuten;

      e. de overige secties van een regionaal operationeel team binnen zestig minuten;

      f. een team bevolkingszorg binnen negentig minuten met uitzondering van de functionaris die met de coördinatie van
      de crisiscommunicatie is belast, die binnen dertig minuten begint, en

      g. een gemeentelijk beleidsteam binnen zestig minuten vanaf het moment dat de burgemeester het beleidsteam bijeen
      heeft geroepen.

      2 Het bestuur van de veiligheidsregio draagt er zorg voor dat de hoofdstructuur van de rampenbestrijding en
      crisisbeheersing in staat is gedurende een ramp of crisis onafgebroken te functioneren.


      [ref1]: https://wetten.overheid.nl/BWBR0027844#Artikel2.2.1
    url: https://wetten.overheid.nl/BWBR0027844/2024-01-01#Artikel2.3.2
    references:
      - id: ref1
        bwb_id: BWBR0027844
        artikel: 2.2.1
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 2.4.1
    text: |-
      1 Het bestuur van de veiligheidsregio draagt er zorg voor dat binnen de hoofdstructuur van de rampenbestrijding en
      crisisbeheersing tijdens een ramp of crisis een totaalbeeld wordt bijgehouden.

      2 Het totaalbeeld is opgebouwd uit ten minste de beschikbare gegevens over het incident, over de hulpverlening,
      over de prognose en de aanpak en over de getroffen maatregelen en de resultaten ervan.

      3 Het totaalbeeld wordt langs geautomatiseerde weg zo spoedig mogelijk en voor zover dat redelijkerwijs mogelijk is
      geverifieerd, beschikbaar gesteld aan:

      a. de onderdelen van de hoofdstructuur van de rampenbestrijding en crisisbeheersing;

      b. andere bij de ramp of crisis betrokken partijen, voor zover zij deze gegevens nodig hebben voor de uitvoering
      van hun taken en bevoegdheden, en

      c. Onze Minister.
    url: https://wetten.overheid.nl/BWBR0027844/2024-01-01#Artikel2.4.1
  - number: 2.4.2
    text: |-
      1 De onderdelen van de hoofdstructuur van de rampenbestrijding en crisisbeheersing, bedoeld in
      [artikel 2.1.1, onderdelen a tot en met d][ref1], houden bij de rampenbestrijding en crisisbeheersing een eigen
      beeld bij.

      2 Het eigen beeld bestaat uit de beschikbare gegevens over de ontwikkeling en effecten van een incident, de
      risico’s voor de veiligheid van de hulpverleners en de personen in het getroffen gebied, de aanpak van het incident
      en de daarvoor benodigde mensen en middelen.

      3 De gegevens worden nadat zij beschikbaar zijn binnen tien minuten verwerkt in het eigen beeld en voor zover
      mogelijk geverifieerd.

      4 De gegevens worden langs geautomatiseerde weg beschikbaar gesteld aan:

      a. de onderdelen van de hoofdstructuur van de rampenbestrijding en crisisbeheersing;

      b. andere de bij de ramp of crisis betrokken partijen die deze gegevens nodig hebben voor de uitvoering van hun
      taken en bevoegdheden, en

      c. het onderdeel dat het totaalbeeld bijhoudt.


      [ref1]: https://wetten.overheid.nl/BWBR0027844#Artikel2.1.1
    url: https://wetten.overheid.nl/BWBR0027844/2024-01-01#Artikel2.4.2
    references:
      - id: ref1
        bwb_id: BWBR0027844
        artikel: 2.1.1
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.4.3
    text: |-
      Een advies of opdracht van een onderdeel van de hoofdstructuur van de rampenbestrijding en crisisbeheersing is
      gebaseerd op het actuele eigen beeld van dat onderdeel en op het actuele totaalbeeld.
    url: https://wetten.overheid.nl/BWBR0027844/2024-01-01#Artikel2.4.3
  - number: 2.4.4
    text: |-
      In het geval dat een advies of een opdracht niet of niet volledig is opgevolgd of uitgevoerd, wordt het onderdeel
      van de hoofdstructuur van de rampenbestrijding en crisisbeheersing dat dit advies of deze opdracht heeft gegeven,
      daarvan op de hoogte gesteld. De opdracht wordt vervolgens in overeenstemming met [artikel 2.4.3][ref1] opnieuw
      geformuleerd.


      [ref1]: https://wetten.overheid.nl/BWBR0027844#Artikel2.4.3
    url: https://wetten.overheid.nl/BWBR0027844/2024-01-01#Artikel2.4.4
    references:
      - id: ref1
        bwb_id: BWBR0027844
        artikel: 2.4.3
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 2.5.1
    text: |-
      Het bestuur van de veiligheidsregio draagt er zorg voor dat de onderdelen van de hoofdstructuur van de
      rampenbestrijding en crisisbeheersing jaarlijks gezamenlijk een oefening houden met een fictieve ramp of crisis.
    url: https://wetten.overheid.nl/BWBR0027844/2024-01-01#Artikel2.5.1
  - number: 3.1.1
    text: |-
      Ten behoeve van de uitvoering van de taken, genoemd in [artikel 25, eerste lid, onderdelen a en b][ref1],
      van de wet, draagt het bestuur van de veiligheidsregio er zorg voor dat de brandweer basisbrandweereenheden,
      ondersteuningseenheden voor redden en blussen op hoogte en ondersteuningseenheden voor hulpverlening heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0027466#Artikel25
    url: https://wetten.overheid.nl/BWBR0027844/2024-01-01#Artikel3.1.1
    references:
      - id: ref1
        bwb_id: BWBR0027466
        artikel: '25'
  - number: 3.1.2
    text: |-
      1 Een basisbrandweereenheid bestaat uit:

      a. een bevelvoerder,

      b. een chauffeur, tevens voertuigbediener, en

      c. twee ploegen van twee manschappen.

      2 De eenheid is belast met:

      a. brandbestrijding en redding;

      b. technische hulpverlening;

      c. basishandelingen bij de bestrijding van ongevallen met gevaarlijke stoffen;

      d. ondersteuning bij waterongevallen.

      3 De eenheid beschikt over een tankautospuit met uitrusting.
    url: https://wetten.overheid.nl/BWBR0027844/2024-01-01#Artikel3.1.2
  - number: 3.1.3
    text: |-
      1 Een ondersteuningseenheid voor redden en blussen op hoogte bestaat uit:

      a. een bevelvoerder of een manschap, en

      b. een chauffeur, tevens voertuigbediener.

      2 De eenheid is belast met:

      a. het redden van mensen en dieren op hoogte;

      b. ondersteuning van basisbrandweereenheden bij het blussen op hoogte, en

      c. het verlenen van hulp op hoogte.

      3 De eenheid beschikt over een redvoertuig met uitrusting.
    url: https://wetten.overheid.nl/BWBR0027844/2024-01-01#Artikel3.1.3
  - number: 3.1.4
    text: |-
      1 Een ondersteuningseenheid voor hulpverlening bestaat uit:

      a. een bevelvoerder of een manschap, en

      b. een chauffeur, tevens voertuigbediener.

      2 De eenheid is belast met:

      a. ondersteuning bij het bevrijden van beknelde en ingesloten mensen en dieren;

      b. ondersteuning van basishandelingen bij de bestrijding van ongevallen met gevaarlijke stoffen;

      c. ondersteuning bij waterongevallen.

      3 De eenheid beschikt over een hulpverleningsvoertuig met uitrusting.
    url: https://wetten.overheid.nl/BWBR0027844/2024-01-01#Artikel3.1.4
  - number: 3.1.5
    text: |-
      1 In afwijking van [artikel 3.1.2, eerste lid][ref1], kan het bestuur van de veiligheidsregio besluiten tot een
      andere samenstelling van basisbrandweereenheden, mits daarmee wordt voorzien in een gelijkwaardig niveau van
      brandweerzorg en geen afbreuk wordt gedaan aan de veiligheid en gezondheid van het brandweerpersoneel.

      2 Toepassing van het eerste lid doet geen afbreuk aan de afspraken, bedoeld in
      [artikel 51, vijfde lid, van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0027844#Artikel3.1.2
      [ref2]: https://wetten.overheid.nl/BWBR0027466#Artikel51
    url: https://wetten.overheid.nl/BWBR0027844/2024-01-01#Artikel3.1.5
    references:
      - id: ref1
        bwb_id: BWBR0027844
        artikel: 3.1.2
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0027466
        artikel: '51'
  - number: 3.2.1
    text: |-
      1 Het bestuur van de veiligheidsregio hanteert bij het vaststellen van de opkomsttijden van een
      basisbrandweereenheid de volgende tijdnormen:

      a. vijf minuten bij gebouwen met een winkelfunctie met een gesloten constructie, gebouwen met een woonfunctie boven
      een gebouw met een winkelfunctie of gebouwen met een celfunctie;

      b. zes minuten bij portiekwoningen, portiekflats of gebouwen met een woonfunctie voor verminderd zelfredzamen;

      c. acht minuten bij gebouwen met een andere woonfunctie dan bedoeld onder a en b, of met een winkelfunctie,
      gezondheidszorgfunctie, onderwijsfunctie of logiesfunctie, en

      d. tien minuten bij gebouwen met een kantoorfunctie, industriefunctie, sportfunctie, bijeenkomstfunctie of een
      overige gebruiksfunctie.

      2 Indien het bestuur van de veiligheidsregio voor bepaalde locaties opkomsttijden vaststelt die afwijken van de
      tijdnormen, motiveert het de keuze van de locatie en de mate van de afwijking.

      3 Het bestuur van de veiligheidsregio stelt geen opkomsttijd vast die hoger is dan achttien minuten.
    url: https://wetten.overheid.nl/BWBR0027844/2024-01-01#Artikel3.2.1
  - number: 3.2.2
    text: |-
      Het bestuur van de veiligheidsregio stelt vast voor welke objecten de inzet van een ondersteuningseenheid
      voor redden en blussen op hoogte altijd noodzakelijk is. Het bestuur stelt bij deze objecten voor de
      ondersteuningseenheden dezelfde opkomsttijden vast als voor de basisbrandweereenheden.
    url: https://wetten.overheid.nl/BWBR0027844/2024-01-01#Artikel3.2.2
  - number: 3.2.3
    text: Het bestuur van de veiligheidsregio draagt zorg voor een sluitende registratie van de gerealiseerde opkomsttijden.
    url: https://wetten.overheid.nl/BWBR0027844/2024-01-01#Artikel3.2.3
  - number: 3.3.1
    text: |-
      Bij ministeriële regeling kunnen ten behoeve van de standaardisatie en uitwisselbaarheid eisen worden gesteld aan
      het materieel en de uitrusting van de basisbrandweereenheden, de ondersteuningseenheden voor hulpverlening en de
      ondersteuningseenheden voor redden en blussen op hoogte.
    url: https://wetten.overheid.nl/BWBR0027844/2024-01-01#Artikel3.3.1
  - number: 4.1.1
    text: |-
      Ten behoeve van de taak, bedoeld in [artikel 25, eerste lid, onderdelen b, c en d, van de wet][ref1] draagt het
      bestuur van de veiligheidsregio er zorg voor dat de brandweer een eenheid voor het verkennen van gevaarlijke
      stoffen en een eenheid voor de bestrijding van ongevallen met gevaarlijke stoffen heeft en beschikt over een
      adviseur gevaarlijke stoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0027466#Artikel25
    url: https://wetten.overheid.nl/BWBR0027844/2024-01-01#Artikel4.1.1
    references:
      - id: ref1
        bwb_id: BWBR0027466
        artikel: '25'
  - number: 4.1.2
    text: |-
      1 Een eenheid voor het verkennen van gevaarlijke stoffen bestaat uit:

      a. een meetplanleider, en

      b. ten minste vier meetploegen die elk bestaan uit twee verkenners gevaarlijke stoffen.

      2 Een meetploeg is belast met het verkennen en meten van gevaarlijke stoffen.
    url: https://wetten.overheid.nl/BWBR0027844/2024-01-01#Artikel4.1.2
  - number: 4.1.3
    text: |-
      1 Een eenheid bestrijding van ongevallen met gevaarlijke stoffen bestaat ten minste uit:

      a. een officier van dienst,

      b. twee bevelvoerders,

      c. acht gaspakdragers,

      d. zes manschappen, en

      e. twee chauffeurs.

      2 Een eenheid bestrijding van ongevallen met gevaarlijke stoffen is belast met:

      a. het redden van mensen en dieren uit een met gevaarlijke stoffen besmet gebied;

      b. het bestrijden van de bron van het ongeval met gevaarlijke stoffen, en

      c. het ontsmetten van hulpverleners en burgers.
    url: https://wetten.overheid.nl/BWBR0027844/2024-01-01#Artikel4.1.3
  - number: 4.1.5
    text: |-
      1 In geval van bedreiging van de gezondheid van de bevolking werken een eenheid voor het verkennen van gevaarlijke
      stoffen, een eenheid bestrijding van ongevallen met gevaarlijke stoffen en een adviseur gevaarlijke stoffen samen
      met de in de regio werkzame instellingen, zorgaanbieders, ambulancevervoerders en gezondheidsdiensten, bedoeld in
      [artikel 33, eerste lid, van de wet][ref1].

      2 Een eenheid voor de bestrijding van ongevallen met gevaarlijke stoffen en een adviseur gevaarlijke stoffen treden
      op in aanvulling op de basisbrandweereenheden, bedoeld in [artikel 3.1.1][ref2].

      3 Voor de bestrijding van ongevallen met gevaarlijke stoffen beschikt de regionale brandweer over beschreven
      procedures voor:

      a. de aanpak van de bestrijding van ongevallen met gevaarlijke stoffen;

      b. het verkennen en meten van gevaarlijke stoffen, en

      c. het waarschuwen en informeren van de bevolking.


      [ref1]: https://wetten.overheid.nl/BWBR0027466#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0027844#Artikel3.1.1
    url: https://wetten.overheid.nl/BWBR0027844/2024-01-01#Artikel4.1.5
    references:
      - id: ref1
        bwb_id: BWBR0027466
        artikel: '33'
      - id: ref2
        bwb_id: BWBR0027844
        artikel: 3.1.1
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 4.1.6
    text: |-
      1 De veiligheidsregio’s, genoemd in [bijlage 1][ref1] bij dit besluit, hebben mede ten behoeve van de genoemde
      omliggende veiligheidsregio’s, een ontsmettingseenheid voor grootschalige chemische, biologische, radiologische en
      nucleaire incidenten.

      2 Een ontsmettingseenheid voor grootschalige chemische, biologische, radiologische en nucleaire incidenten bestaat
      uit:

      a. een leider ontsmettingseenheid, zijnde een officier van dienst;

      b ten minste twee bevelvoerders;

      c. ten minste veertien manschappen;

      d. twee chauffeurs, en

      e. een adviseur gevaarlijke stoffen.

      3 Een ontsmettingseenheid voor grootschalige chemische, biologische, radiologische en nucleaire incidenten is
      belast met:

      a. het leveren van middelen en kennis ten behoeve van de bestrijding van chemische, biologische, radiologische en
      nucleaire incidenten;

      b. het leveren van ondersteuning aan een eenheid bestrijding van ongevallen met gevaarlijke stoffen bij het redden
      van mensen en dieren, en

      c. voor zover het grootschalige chemische, biologische, radiologische en nucleaire incidenten betreft, het
      ontsmetten van besmette personen.

      4 In geval van bedreiging van de gezondheid van de bevolking werkt een ontsmettingseenheid voor grootschalige
      chemische, biologische, radiologische en nucleaire incidenten samen met de in de regio werkzame instellingen,
      zorgaanbieders, ambulancevervoerders en gezondheidsdiensten, bedoeld in [artikel 33, eerste lid, van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0027844
      [ref2]: https://wetten.overheid.nl/BWBR0027466#Artikel33
    url: https://wetten.overheid.nl/BWBR0027844/2024-01-01#Artikel4.1.6
    references:
      - id: ref1
        bwb_id: BWBR0027844
      - id: ref2
        bwb_id: BWBR0027466
        artikel: '33'
  - number: 4.2.1
    text: |-
      1 Een meetplanleider begint direct na alarmering met de uitvoering van zijn taken en is binnen dertig minuten na
      alarmering bij de meldkamer of het regionaal operationeel team.

      2 Eén en afhankelijk van de aard van het ongeval een tweede, meetploeg begint binnen dertig minuten na alarmering
      met de uitvoering van zijn taken op de aangegeven meetlocatie.

      3 Afhankelijk van de aard van het ongeval begint een derde of een vierde meetploeg binnen zestig minuten na
      alarmering met de uitvoering van zijn taken op de aangegeven meetlocatie.
    url: https://wetten.overheid.nl/BWBR0027844/2024-01-01#Artikel4.2.1
  - number: 4.2.2
    text: |-
      1 Een eenheid bestrijding van ongevallen met gevaarlijke stoffen begint binnen dertig minuten na alarmering met de
      uitvoering van haar taken op de plaats van het incident.

      2 Een adviseur gevaarlijke stoffen begint afhankelijk van het regionaal vastgestelde risicoprofiel binnen dertig of
      zestig minuten na alarmering met de uitvoering van zijn taken op de plaats van het incident.
    url: https://wetten.overheid.nl/BWBR0027844/2024-01-01#Artikel4.2.2
  - number: 4.2.3
    text: |-
      1 Een ontsmettingseenheid voor grootschalige chemische, biologische, radiologische en nucleaire incidenten is
      binnen dertig minuten na alarmering gereed voor vertrek.

      2 De ontsmettingseenheid kan minimaal acht uur lang dienst doen.

      3 De ontsmettingseenheid kan minimaal vijftig personen per uur ontsmetten.
    url: https://wetten.overheid.nl/BWBR0027844/2024-01-01#Artikel4.2.3
  - number: 4.3.1
    text: |-
      Bij ministeriële regeling kunnen ten behoeve van de standaardisatie en uitwisselbaarheid eisen worden gesteld aan
      het materieel en de uitrusting van de eenheden voor het verkennen van gevaarlijke stoffen, de eenheden voor de
      bestrijding van ongevallen met gevaarlijke stoffen, de adviseur gevaarlijke stoffen en de ontsmettingseenheden voor
      grootschalige chemische, biologische, radiologische en nucleaire incidenten.
    url: https://wetten.overheid.nl/BWBR0027844/2024-01-01#Artikel4.3.1
  - number: '5.1'
    text: |-
      De schriftelijke afspraken over de geneeskundige hulpverlening tussen het bestuur van de veiligheidsregio en de in
      die veiligheidsregio werkzame instellingen, zorgaanbieders, ambulancevervoerders en gezondheidsdiensten, bedoeld in
      [artikel 33, eerste lid, van de wet][ref1], betreffen:

      a. de procedures die gevolgd worden bij een ramp of crisis, waarbij het in ieder geval gaat over grootschalige
      alarmering, opschaling, coördinatie, informatiemanagement en evaluatie;

      b. de wijze waarop en de mate waarin personeel en materieel worden ingezet;

      c. de bereikbaarheid en beschikbaarheid van personeel, ruimte en materieel;

      d. de wijze van trainen en oefenen met het oog op het gezamenlijk optreden bij de rampenbestrijding en
      crisisbeheersing en de frequentie waarin getraind en geoefend wordt;

      e. de samenwerking met:

      1°. de functionarissen van de GHOR,

      2°. andere instellingen, en

      3°. andere hulpverleningsinstanties, en

      f. het onderhoud en beheer van materieel voor de geneeskundige hulpverlening bij ongevallen en rampen dat eigendom
      is van de veiligheidsregio of het Rijk.


      [ref1]: https://wetten.overheid.nl/BWBR0027466#Artikel33
    url: https://wetten.overheid.nl/BWBR0027844/2024-01-01#Artikel5.1
    references:
      - id: ref1
        bwb_id: BWBR0027466
        artikel: '33'
  - number: 6.1.1
    text: |-
      1 Het bestuur van de veiligheidsregio stelt een rampbestrijdingsplan vast voor locaties waarop
      hogedrempelinrichtingen worden geëxploiteerd.

      2 Het eerste lid is van overeenkomstige toepassing ten aanzien van een calamiteit op locaties waarop
      hogedrempelinrichtingen worden geëxploiteerd die in een andere staat zijn gelegen, welke calamiteit tot een ramp in
      Nederland kan leiden. De artikelen in deze paragraaf worden daarbij voor zover mogelijk toegepast.
    url: https://wetten.overheid.nl/BWBR0027844/2024-01-01#Artikel6.1.1
  - number: 6.1.2
    text: |-
      Onverminderd [artikel 6.1.7, tweede lid][ref1], worden het rampbestrijdingsplan of wijzigingen daarvan vastgesteld
      uiterlijk een jaar na het tijdstip waarop het bestuur van de veiligheidsregio de delen van het veiligheidsrapport
      waarvan een aanvraag om een omgevingsvergunning vergezeld gaat, heeft ontvangen van het bestuursorgaan dat bevoegd
      is te beslissen op de aanvraag om een omgevingsvergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0027844#Artikel6.1.7
    url: https://wetten.overheid.nl/BWBR0027844/2024-01-01#Artikel6.1.2
    references:
      - id: ref1
        bwb_id: BWBR0027844
        artikel: 6.1.7
        hoofdstuk: '6'
        paragraaf: '1'
  - number: 6.1.3
    text: |-
      Het rampbestrijdingsplan bevat in ieder geval:

      a. de naam of functie van de aan de hogedrempelinrichting verbonden personen die bevoegd zijn om procedures van
      alarmering binnen en buiten de hogedrempelinrichting en van inwerkingstelling van bestrijdingsacties binnen de
      hogedrempelinrichting in werking te doen treden;

      b. de naam of functie van de personen die belast zijn met de operationele leiding van het geheel van de
      bestrijdingsacties;

      c. de maatregelen en voorzieningen die zijn getroffen opdat degene die is belast met het opperbevel en de
      hulpverleningsdiensten snel worden geïnformeerd en de bij de bestrijding betrokken personen snel worden opgeroepen;

      d. het schema met betrekking tot de leiding over en de gecoördineerde inzet van diensten en organisaties die bij de
      bestrijding kunnen worden betrokken;

      e. de maatregelen en voorzieningen die zijn getroffen met het oog op de bestrijding op en buiten de locatie waarop
      een hogedrempelinrichting wordt geëxploiteerd;

      f. de maatregelen en voorzieningen die zijn getroffen om de bevolking te informeren over de ramp of de dreiging van
      een ramp en over de door haar te volgen gedragslijn;

      g. de maatregelen en voorzieningen die zijn getroffen om de hulpverleningsdiensten van een andere staat te
      informeren, indien de bevolking of het milieu van die staat door de ramp kunnen worden getroffen of dreigen te
      worden getroffen.
    url: https://wetten.overheid.nl/BWBR0027844/2024-01-01#Artikel6.1.3
  - number: 6.1.4
    text: |-
      1 [Afdeling 3:4 van de Algemene wet bestuursrecht][ref1] is van overeenkomstige toepassing op de vaststelling van
      het rampbestrijdingsplan.

      2 Indien met betrekking tot de hogedrempelinrichting met toepassing van
      [artikel 19.3 van de Wet milieubeheer][ref2] van een document een tweede tekst is overgelegd waaruit vertrouwelijke
      gegevens als in dat artikel bedoeld zijn weggelaten, wordt alleen deze tekst ter inzage gelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel19.3
    url: https://wetten.overheid.nl/BWBR0027844/2024-01-01#Artikel6.1.4
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '19.3'
  - number: 6.1.5
    text: |-
      Indien de bevolking van een andere staat kan worden getroffen door de gevolgen van een ramp op een locatie waarop
      een hogedrempelinrichting wordt geëxploiteerd waarop het rampbestrijdingsplan betrekking heeft, verzoekt het
      bestuur van de veiligheidsregio waarin die locatie geheel of gedeeltelijk is gelegen de bevoegde autoriteit van
      de andere staat de bevolking te informeren over de mogelijkheid haar zienswijze over het ontwerp naar voren te
      brengen.
    url: https://wetten.overheid.nl/BWBR0027844/2024-01-01#Artikel6.1.5
  - number: 6.1.6
    text: |-
      Het bestuur van de veiligheidsregio verleent op verzoek van de bevoegde autoriteit van een andere staat medewerking
      aan de terinzagelegging van documenten die in de andere staat zijn opgesteld in het kader van de voorbereiding van
      een met een rampbestrijdingsplan gelijk te stellen plan voor een in die staat gelegen hogedrempelinrichting.
    url: https://wetten.overheid.nl/BWBR0027844/2024-01-01#Artikel6.1.6
  - number: 6.1.7
    text: |-
      Het bestuur van de veiligheidsregio draagt er zorg voor dat met passende tussenpozen doch ten minste éénmaal
      per drie jaar het rampbestrijdingsplan opnieuw wordt bezien, beproefd en zo nodig bijgewerkt. Bij de herziening
      wordt rekening gehouden met veranderingen die zich op de betrokken locaties waarop hogedrempelinrichtingen worden
      geëxploiteerd en bij de betrokken veiligheidsregio hebben voorgedaan, met nieuwe technische kennis en met inzichten
      omtrent de bij rampen te nemen maatregelen.
    url: https://wetten.overheid.nl/BWBR0027844/2024-01-01#Artikel6.1.7
  - number: 6.1.8
    text: |-
      1 Indien het bestuur van de veiligheidsregio besluit dat voor een locatie waarop een hogedrempelinrichting wordt
      geëxploiteerd geen rampbestrijdingsplan behoeft te worden vastgesteld, zendt het een afschrift van zijn besluit
      aan:

      a. degene die de hogedrempelinrichting exploiteert;

      b. de burgemeester van de gemeente waarin de hogedrempelinrichting is gelegen;

      c. het bestuursorgaan dat bevoegd is voor het exploiteren van de hogedrempelinrichting een omgevingsvergunning
      te verlenen;

      d. de daartoe door Onze Minister van Sociale Zaken en Werkgelegenheid aangewezen toezichthouder, bedoeld in
      [artikel 1, derde lid, onderdeel d, van de Arbeidsomstandighedenwet][ref1], en

      e. Onze Minister.

      2 Indien het besluit van het bestuur van de veiligheidsregio een hogedrempelinrichting betreft die geheel of
      gedeeltelijk is gelegen in een aan een andere staat grenzende gemeente, zendt Onze Minister een afschrift van het
      besluit aan de andere staat.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel1
    url: https://wetten.overheid.nl/BWBR0027844/2024-01-01#Artikel6.1.8
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '1'
  - number: 6.2.1
    text: |-
      1 Het bestuur van de veiligheidsregio stelt, na overleg met de exploitant van een burgerluchthaven, respectievelijk
      de basiscommandant van een militaire luchthaven, een rampbestrijdingsplan vast voor een vliegtuigongeval op een
      luchthaven binnen de veiligheidsregio, dat op grond van onderdeel 9.2.5. en tabel 9-1 in bijlage 14, volume 1 van
      het op 7 december 1944 te Chicago tot stand gekomen Verdrag inzake de internationale burgerluchtvaart (Trb. 1973,
      109) is ingedeeld in brandrisicoklasse 3 of hoger, of in geval van een militaire luchthaven, het terrein dat in
      overleg met Onze Minister van Defensie is aangewezen.

      2 Het rampbestrijdingsplan ziet mede op de onmiddellijke omgeving van een luchthaven. Het bestuur van de
      veiligheidsregio stelt in overleg met de exploitant van een burgerluchthaven, respectievelijk de basiscommandant
      van een militaire luchthaven vast welk gebied tot de onmiddellijke omgeving wordt gerekend.

      3 [Afdeling 3.4 van de Algemene wet bestuursrecht][ref1] is van overeenkomstige toepassing op de vaststelling van
      het rampbestrijdingsplan.

      4 Het bestuur van de veiligheidsregio zendt het rampbestrijdingsplan aan Onze Minister van Infrastructuur en
      Milieu.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0027844/2024-01-01#Artikel6.2.1
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: 6.2.2
    text: |-
      Het rampbestrijdingsplan bevat in ieder geval:

      a. de functies van de aan de luchthaven verbonden personen die bevoegd zijn om procedures van alarmering binnen en
      buiten de luchthaven en van bestrijdingsacties op de luchthaven in werking te doen treden;

      b. de functies van de personen die belast zijn met de operationele leiding van het geheel van de
      bestrijdingsacties;

      c. de maatregelen en de voorzieningen die zijn getroffen opdat degene die is belast met de operationele leiding,
      en de hulpverleningsdiensten snel worden geïnformeerd en de bij de bestrijding betrokken personen snel worden
      opgeroepen;

      d. het schema met betrekking tot de leiding over en de gecoördineerde inzet van diensten en organisaties die bij de
      bestrijding kunnen worden betrokken;

      e. de maatregelen en voorzieningen die zijn getroffen met het oog op de bestrijding van op en in de onmiddellijke
      omgeving van de luchthaven;

      f. een plan in hoofdlijnen met betrekking tot de geneeskundige organisatie, waaronder een plan op hoofdlijnen met
      betrekking tot de opvang en verzorging van de slachtoffers;

      g. de wijze waarop de bevolking wordt geïnformeerd en over de door haar te volgen gedragslijn;

      h. de maatregelen en voorzieningen die worden getroffen om de hulpverleningsdiensten van een andere staat te
      informeren, indien de bevolking of het milieu van die staat door het vliegtuigongeval worden getroffen of dreigen
      te worden getroffen;

      i. de wijze waarop slachtoffers, verwanten van slachtoffers, reizigers, medewerkers van de luchthaven en van
      vliegtuigmaatschappijen, binnen- en buitenlandse overheden en de media worden geïnformeerd, en

      j. een overzichtskaart van de indeling van de luchthaven en de onmiddellijke omgeving daarvan.
    url: https://wetten.overheid.nl/BWBR0027844/2024-01-01#Artikel6.2.2
  - number: 6.2.3
    text: |-
      1 Het bestuur van de veiligheidsregio draagt er zorg voor dat gezamenlijk met de onderdelen van de hoofdstructuur
      van de rampenbestrijding en crisisbeheersing met passende tussenpozen een oefening wordt gehouden waarbij het
      rampbestrijdingsplan op juistheid, volledigheid en bruikbaarheid wordt getoetst.

      2 In ieder geval vindt één maal per twee jaar een multidisciplinaire stafoefening en één maal per vier jaar een
      multidisciplinaire oefening van staf en operationele eenheden plaats.

      3 Bij de oefeningen, bedoeld in het tweede lid, wordt het calamiteitenplan van de luchthaven mede geoefend.

      4 Het bestuur van de veiligheidsregio draagt zorg voor de evaluatie van de oefeningen, bedoeld in het tweede lid.
      Bij de uitvoering van de evaluatie worden de exploitant van een burgerluchthaven en de basiscommandant, bedoeld in
      [artikel 6.2.1][ref1], betrokken.

      5 Het bestuur van de veiligheidsregio draagt er zorg voor dat het rampbestrijdingsplan één maal per vier jaar wordt
      geactualiseerd.


      [ref1]: https://wetten.overheid.nl/BWBR0027844#Artikel6.2.1
