  - number: 6.3.1
    text: |-
      1 Het bestuur van de veiligheidsregio stelt een rampbestrijdingsplan vast voor locaties waarop
      winningsafvalvoorzieningen categorie A als bedoeld in [artikel 1.1, eerste lid, van de Wet milieubeheer][ref1]
      worden geëxploiteerd.

      2 [Artikel 6.1.3][ref2] is van overeenkomstige toepassing op het rampbestrijdingsplan, bedoeld in het eerste lid.

      3 Een rampbestrijdingsplan, bedoeld in het eerste lid, wordt vastgesteld uiterlijk een jaar na het tijdstip
      waarop het bevoegd gezag een afschrift van een aanvraag om een omgevingsvergunning voor het exploiteren van een
      winningsafvalvoorziening categorie A heeft ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel1.1
