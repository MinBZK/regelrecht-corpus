  - number: '3'
    text: |-
      1 Voor de toepassing van [artikel 5.2b, vierde lid, van de wet][ref1] geldt dat een tijdelijke achteruitgang van de
      toestand van een waterlichaam is toegelaten indien:

      a. deze het resultaat is van omstandigheden die zich door een natuurlijke oorzaak of overmacht voordoen en
      die uitzonderlijk zijn of niet redelijkerwijze waren te voorzien, met name extreme overstromingen en lange
      droogteperioden, of het gevolg zijn van omstandigheden die zijn veroorzaakt door redelijkerwijs niet te voorziene
      ongevallen,

      b. aan alle voorwaarden van artikel 4, zesde en achtste lid, van de kaderrichtlijn water is voldaan, en

      c. de reden van de afwijking voor dat waterlichaam wordt vermeld in het eerstvolgende beheerplan voor de
      rijkswateren, indien het rijkswateren betreft, dan wel het eerstvolgende regionale waterplan, indien het regionale
      wateren of grondwater betreft.

      2 Voor de toepassing van [artikel 5.2b, vierde lid, van de wet][ref2] geldt dat een achteruitgang van de toestand
      van een waterlichaam is toegelaten indien:

      a. het niet voorkomen van die achteruitgang het gevolg is van nieuwe veranderingen van de fysische kenmerken van
      een oppervlaktewaterlichaam of wijzigingen in de stand van grondwaterlichamen, dan wel het niet voorkomen van
      achteruitgang van een zeer goede toestand van een oppervlaktewaterlichaam naar een goede toestand het gevolg is van
      nieuwe duurzame activiteiten van menselijke ontwikkeling,

      b. aan alle voorwaarden van artikel 4, zevende en achtste lid, van de kaderrichtlijn water is voldaan, en

      c. de reden van de afwijking voor dat waterlichaam is vermeld in het beheerplan voor de rijkswateren, indien het
      rijkswateren betreft, dan wel het regionale waterplan, indien het regionale wateren of grondwater betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel5.2b
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel5.2b
