  - number: '2'
    text: |-
      1 Van een ingevolge dit besluit te verwezenlijken Europese milieukwaliteitseis voor water kan uitsluitend worden
      afgeweken in de gevallen waarin en volgens de voorwaarden waaronder dit is toegestaan volgens de bepalingen van de
      kaderrichtlijn water, waarnaar in dit besluit wordt verwezen.

      2 Indien voor een waterlichaam ingevolge dit besluit of andere regelgeving meer dan een milieudoelstelling geldt,
      is de strengste van toepassing.

      3 Van een ingevolge dit besluit te verwezenlijken Europese milieukwaliteitseis voor water kan met betrekking tot de
      daarbij behorende termijn worden afgeweken indien:

      a. de toestand van het waterlichaam niet achteruitgaat overeenkomstig [artikel 16][ref1],

      b. is voldaan aan alle voorwaarden van artikel 4, vierde en achtste lid, van de kaderrichtlijn water, en

      c. de reden van de afwijking voor dat waterlichaam is vermeld in het beheerplan voor de rijkswateren, indien het
      rijkswateren betreft, dan wel het regionale waterplan, indien het regionale wateren of grondwater betreft.

      4 Van een ingevolge dit besluit te verwezenlijken Europese milieukwaliteitseis voor water kan worden afgeweken
      indien:

      a. de toestand van het waterlichaam niet achteruitgaat overeenkomstig [artikel 16][ref2],

      b. het desbetreffende waterlichaam in een zodanige mate door menselijke activiteiten is aangetast of zijn
      natuurlijke gesteldheid van dien aard is dat het bereiken van de richtwaarde niet haalbaar of onevenredig kostbaar
      is,

      c. is voldaan aan alle voorwaarden van artikel 4, vijfde en achtste lid, van de kaderrichtlijn water, en

      d. de reden van de afwijking voor dat waterlichaam is vermeld in het beheerplan voor de rijkswateren, indien het
      rijkswateren betreft, dan wel het regionale waterplan, indien het regionale wateren of grondwater betreft.

      5 Van een ingevolge dit besluit te verwezenlijken Europese milieukwaliteitseis voor water kan met betrekking tot
      een goede ecologische toestand of een goede grondwatertoestand voorts worden afgeweken indien:

      a. het niet bereiken daarvan het gevolg is van nieuwe veranderingen van de fysische kenmerken van een
      oppervlakterwaterlichaam of wijzigingen in de stand van een grondwaterlichaam,

      b. is voldaan aan alle voorwaarden van artikel 4, zevende en achtste lid, van de kaderrichtlijn water, en

      c. de reden van de afwijking voor dat waterlichaam is vermeld in het beheerplan voor de rijkswateren, indien het
      rijkswateren betreft, dan wel het regionale waterplan, indien het regionale wateren betreft.

      6 Voor een kunstmatig of sterk veranderd oppervlaktewaterlichaam zijn het tweede, derde en vierde lid van
      overeenkomstige toepassing met betrekking tot het goede ecologische potentieel dat voor een oppervlaktewaterlichaam
      is vastgesteld overeenkomstig [artikel 6, tweede lid][ref3].

      7 Van een ingevolge dit besluit te verwezenlijken Europese milieukwaliteitseis voor water kan worden afgeweken
      indien:

      a. de afwijking te wijten is aan een buiten Nederland gelegen verontreinigingsbron,

      b. naleving van de richtwaarde ten gevolge van de grensoverschrijdende verontreiniging niet mogelijk is, en

      c. is voldaan aan alle voorwaarden van artikel 6, eerste lid, onder c, en tweede lid, van de richtlijn prioritaire
      stoffen.


