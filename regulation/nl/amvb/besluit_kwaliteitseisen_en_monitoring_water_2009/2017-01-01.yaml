    text: |-
      Bij ministeriële regeling kunnen met inachtneming van het daaromtrent bepaalde in de kaderrichtlijn water, in
      het bijzonder bijlage V, paragraaf 1.2.6, bij die richtlijn, de grondwaterrichtlijn en de richtlijn prioritaire
      stoffen regels worden gesteld met betrekking tot de onderdelen van het monitoringsprogramma die zijn vermeld in
      [artikel 13, eerste lid][ref1].


