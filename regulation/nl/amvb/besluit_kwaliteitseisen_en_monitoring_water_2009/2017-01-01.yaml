  - number: '16'
    text: |-
      1 In het monitoringsprogramma wordt, met inachtneming van het tweede lid, aangegeven op welke wijze aan het
      eind van de planperiode voor elk waterlichaam wordt vastgesteld of gedurende de planperiode is voldaan aan
      [artikel 5.2b, vierde lid, van de wet][ref1].

      2 Er is niet voldaan aan de verplichting tot voorkoming van achteruitgang van de toestand van een waterlichaam
      als bedoeld in [artikel 5.2b, vierde lid, van de wet][ref2] indien voor een stof of kwaliteitselement waarvoor
      ingevolge dit besluit een Europese milieukwaliteitseis voor water geldt:

      a. de toestand van een waterlichaam in een lagere toestandklasse terecht is gekomen, of

      b. de kwaliteit van het waterlichaam in de laagste toestandklasse, bepaald overeenkomstig het monitoringsprogramma,
      is verslechterd.

      3 Het tweede lid geldt, voor zover het de stoffen betreft waarvoor dit in [bijlage I][ref3] bij dit besluit is
      aangegeven, met ingang van 22 december 2021.

      4 De indeling van een oppervlaktewaterlichaam in een toestandklasse komt overeen met de laagste toestandklasse
      waarin de chemische toestand, de ecologische toestand, onderscheidenlijk het ecologische potentieel, verkeert.

      5 De indeling van een grondwaterlichaam in een toestandklasse komt overeen met de laagste toestand waarin de
      kwantitatieve toestand, onderscheidenlijk de chemische toestand, verkeert.

      6 Voor de toepassing van het tweede lid worden de volgende toestandklassen onderscheiden:

      a. voor oppervlaktewaterlichamen:

      1°. wat betreft de chemische toestand: de toestandklasse goed als bedoeld in [artikel 5][ref4], of niet goed;

      2°. wat betreft de ecologische toestand: de toestandklasse zeer goed, goed als bedoeld in
      [artikel 6, eerste lid][ref5], matig, ontoereikend of slecht, bepaald voor het type natuurlijk oppervlaktewater
      waartoe het oppervlaktewaterlichaam behoort, zoals omschreven in bijlage V, paragraaf 1.2, de tabellen 1.2.1 tot en
      met 1.2.4, bij de kaderrichtlijn water;

      3°. wat betreft het ecologisch potentieel, indien van toepassing: de toestandklasse goed als bedoeld in
      [artikel 6, derde lid][ref6], matig, ontoereikend of slecht, zoals omschreven in paragraaf 1.2, tabel 1.2.5, bij
      de kaderrichtlijn water, overeenkomstig hetgeen daaromtrent is aangegeven in het plan, bedoeld in artikel 6, tweede
      lid, onder b;

      b. voor grondwaterlichamen:

      1°. wat betreft de kwantitatieve toestand: goed als bedoeld in [artikel 8][ref7], en ontoereikend;

      2°. wat betreft de chemische toestand: goed als bedoeld in [artikel 9][ref8], en ontoereikend.

      7 Bij ministeriële regeling worden nadere regels gesteld omtrent de toepassing van dit artikel.


