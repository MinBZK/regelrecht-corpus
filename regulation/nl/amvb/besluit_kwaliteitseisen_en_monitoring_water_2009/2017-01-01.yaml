articles:
  - number: '1'
    text: |-
      1 In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

        - *beheerplan voor de rijkswateren:* plan als bedoeld in [artikel 4.6, eerste lid, van de Waterwet][ref1] dat op
      rijkswateren betrekking heeft;
        - *beheerplan voor de regionale wateren:* plan als bedoeld in [artikel 4.6, eerste lid, van de Waterwet][ref2] dat
      op regionale wateren betrekking heeft;
        - *Europese milieukwaliteitseis voor water:* milieukwaliteitseis als bedoeld in
      [artikel 5.1, eerste lid, juncto derde lid, onder c, van de wet][ref3], ter uitvoering van de kaderrichtlijn
      water, de grondwaterrichtlijn, de richtlijn prioritaire stoffen of een andere EU-richtlijn of EU-verordening
      uit hoofde van artikel 16 of 17 van de kaderrichtlijn water of een andere bindende EU-rechtshandeling waarbij
      milieukwaliteitseisen zijn gesteld ter bescherming van grondwater of oppervlaktewater en waarnaar in de
      kaderrichtlijn water wordt verwezen;
        - *grondwaterlichaam:* grondwaterlichaam als bedoeld in artikel 2 van de kaderrichtlijn water, dat krachtens
      [artikel 4.10 van het Waterbesluit][ref4] is aangewezen in het regionale waterplan;
        - *grondwaterrichtlijn:* [richtlijn nr. 2006/118/EG](32006L0118) van het Europees Parlement en de Raad van
      de Europese Unie van 12 december 2006 betreffende de bescherming van het grondwater tegen verontreiniging en
      achteruitgang van de toestand (PbEU L 372);
        - *kunstmatig oppervlaktewaterlichaam:* krachtens [artikel 4.5][ref5] of [4.10 van het Waterbesluit][ref6]
      in het nationale waterplan of het regionale waterplan als kunstmatig oppervlaktewaterlichaam aangewezen
      oppervlaktewaterlichaam;
        - *milieukwaliteitseis:* milieudoelstelling, vastgesteld als eis als bedoeld in
      [artikel 5.1, eerste lid, van de wet][ref7];
        - *monitoringsprogramma:* monitoringsprogramma als bedoeld in [artikel 5.3, derde lid, van de wet][ref8];
        - *nationaal waterplan:* plan als bedoeld in [artikel 4.1, eerste lid, van de Waterwet][ref9];
        - *oppervlaktewaterlichaam:* oppervlaktewaterlichaam als bedoeld in artikel 2 van de kaderrichtlijn water, dat
      krachtens [artikel 4.5][ref10] of [4.10 van het Waterbesluit][ref11] is aangewezen in het nationale waterplan of
      het regionale waterplan;
        - *Onze Ministers:* Onze Minister en, voor zover het aangelegenheden betreft, die mede tot zijn
      verantwoordelijkheid behoren, Onze Minister van Economische Zaken;
        - *regionale wateren:* regionale wateren als bedoeld in [artikel 1.1 van de Waterwet][ref12];
        - *regionaal waterplan:* plan als bedoeld in [artikel 4.4, eerste lid, van de Waterwet][ref13];
        - *richtlijn prioritaire stoffen:* [Richtlijn 2008/105/EG](32008L0105) van het Europees Parlement en de Raad
      van 16 december 2008 inzake milieukwaliteitsnormen op het gebied van het waterbeleid tot wijziging en vervolgens
      intrekking van de [Richtlijnen 82/176/EEG](31982L0176), [83/513/EEG](31983L0513), [84/156/EEG](31984L0156),
      [84/491/EEG](31984L0491) en [86/280/EEG](31986L0280) van de Raad, en tot wijziging van [Richtlijn 2000/60/EG]
      (32000L0060);
        - *rijkswateren:* rijkswateren als bedoeld in [artikel 1.1 van de Waterwet][ref14];
        - *sterk veranderd oppervlaktewaterlichaam:* oppervlaktewaterlichaam dat als zodanig krachtens [artikel 4.5][ref15]
      of [4.10 van het Waterbesluit][ref16] is aangewezen in het nationale waterplan of het regionale waterplan;
        - *stroomgebieddistrict:* stroomgebieddistrict als bedoeld in [artikel 1.1 van de Waterwet][ref17], gevormd door
      een of meer stroomgebieden en daarvan deel uitmakende deelstroomgebieden;
        - *typen natuurlijk oppervlaktewaterlichaam:* rivieren, meren, overgangswateren of kustwateren als omschreven
      in bijlage II, punt 1.2 bij de kaderrichtlijn water, waarvoor de typespecifieke referentieomstandigheden voor
      Nederland zijn uitgewerkt in de ministeriële regeling op grond van artikel 15 en in het monitoringsprogramma
      overeenkomstig bijlage II, punt 1.3, bij de kaderrichtlijn water;
        - *verontreinigende stof:* verontreinigende stof als bedoeld in artikel 1, onder 31, van de kaderrichtlijn water,
      met name de stoffen, bedoeld in bijlage VIII bij die richtlijn;
        - *waterlichaam:* oppervlaktewaterlichaam of grondwaterlichaam;
        - *waterwinlocatie:* onttrekkingspunt van oppervlaktewater of grondwater dat wordt gebruikt voor de bereiding van
      voor menselijke consumptie bestemd water, of een samenstel van dergelijke onttrekkingspunten;
        - *wet:* [Wet milieubeheer][ref18].

      2 In dit besluit en de daarop berustende bepalingen wordt onder de volgende begrippen verstaan wat daaronder
      in artikel 2 van de kaderrichtlijn water wordt verstaan: beschikbare grondwatervoorraad, binnenwateren,
      deelstroomgebied, ecologische toestand, gevaarlijke stoffen, goede ecologische toestand, goed ecologisch
      potentieel, goede chemische toestand van oppervlaktewater, goede chemische toestand van grondwater, goede
      grondwatertoestand, goede kwantitatieve grondwatertoestand, goede oppervlaktewatertoestand, grondwater,
      grondwatertoestand, kustwateren, kwantitatieve grondwatertoestand, meer, milieudoelstelling, milieukwaliteitsnorm,
      oppervlaktewater, oppervlaktewatertoestand, overgangswater, prioritaire stoffen, rivier, stroomgebied,
      verontreiniging, voor menselijke consumptie bestemd water.

      3 In dit besluit en de daarop berustende bepalingen wordt onder de volgende begrippen verstaan wat daaronder in
      artikel 2 van de grondwaterrichtlijn wordt verstaan: drempelwaarde, significante en aanhoudend stijgende trend.

      4 In dit besluit en de daarop berustende bepalingen wordt onder «matrix» en «biotataxon» verstaan hetgeen daaronder
      in artikel 2 van de richtlijn prioritaire stoffen wordt verstaan.


