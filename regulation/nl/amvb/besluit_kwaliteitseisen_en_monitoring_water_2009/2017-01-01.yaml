  - number: '8'
    text: |-
      Een grondwaterlichaam verkeert in een goede kwantitatieve toestand indien is voldaan aan alle voorwaarden van
      bijlage V, punt 2.1.2, bij de kaderrichtlijn water.
    url: https://wetten.overheid.nl/BWBR0027061/2017-01-01#Artikel8
  - number: '9'
    text: |-
      Een grondwaterlichaam verkeert in een goede chemische toestand indien overeenkomstig het monitoringsprogramma is
      vastgesteld dat:

      a. is voldaan aan alle voorwaarden van bijlage V, punt 2.3.2, bij de kaderrichtlijn water en de Europese
      milieukwaliteitseisen voor water, genoemd in [bijlage II][ref1], tabellen 1 en 2, bij dit besluit;

      b. in een of meer monitoringspunten niet is voldaan aan een Europese milieukwaliteitseis voor water als
      bedoeld in onderdeel a, maar gedeputeerde staten door een passend onderzoek overeenkomstig bijlage III bij de
      grondwaterrichtlijn hebben bevestigd dat is voldaan aan alle voorwaarden van artikel 4, tweede lid, onderdeel c, en
      vijfde lid, van die richtlijn.


      [ref1]: https://wetten.overheid.nl/BWBR0027061
    url: https://wetten.overheid.nl/BWBR0027061/2017-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0027061
  - number: '10'
    text: |-
      1 Tenzij een afwijkingsgrond als bedoeld in dit besluit van toepassing is, is de vaststelling van een regionaal
      waterplan voor elk daarin opgenomen grondwaterlichaam gericht op de verwezenlijking van de volgende Europese
      milieukwaliteitseis voor water: in een grondwaterlichaam vinden met ingang van 22 december 2009 geen significante
      en aanhoudend stijgende trends plaats in de concentraties van verontreinigende stoffen, groepen verontreinigende
      stoffen of indicatoren van verontreiniging, die een significant schaderisico opleveren voor de kwaliteit van
      een aquatisch of terrestrisch ecosysteem, de menselijke gezondheid of voor het rechtmatig gebruik, feitelijk of
      potentieel, van het watermilieu.

      2 Een significante en aanhoudend stijgende trend levert een significant schaderisico als bedoeld in het eerste lid,
      op, indien het beginpunt voor een trendomkering wordt of dreigt te worden overschreden, en niet de overeenkomstig
      artikel 5, tweede lid, van de grondwaterrichtlijn vereiste maatregelen worden genomen.

      3 Het beginpunt voor een trendomkering, bedoeld in het tweede lid, bedraagt 75 procent van de Europese
      milieukwaliteitseisen voor water die in [bijlage II][ref1], tabellen 1 en 2, bij dit besluit zijn opgenomen.

      4 Van de ingevolge het eerste lid te verwezenlijken Europese milieukwaliteitseis voor water kan met betrekking tot
      het in het derde lid vermelde percentage worden afgeweken indien:

      a. sprake is van een situatie als bedoeld in bijlage IV, deel B, punt 1, onder c, van de grondwaterrichtlijn,

      b. in het regionale waterplan voor een grondwaterlichaam een hoger percentage is vermeld,

      c. is voldaan aan alle voorwaarden van de in onderdeel a genoemde bepaling, en

      d. de reden van de afwijking is vermeld in het in onderdeel b bedoelde plan.


      [ref1]: https://wetten.overheid.nl/BWBR0027061
    url: https://wetten.overheid.nl/BWBR0027061/2017-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0027061
  - number: '11'
    text: |-
      Voor de toepassing van [artikel 12][ref1] wordt onder een waterwinlocatie verstaan een locatie die als zodanig is
      opgenomen in het beheerplan voor de rijkswateren, indien het rijkswateren betreft, dan wel het regionale waterplan,
      indien het regionale wateren of grondwater betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0027061#Artikel12
    url: https://wetten.overheid.nl/BWBR0027061/2017-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0027061
        artikel: '12'
        paragraaf: '4'
  - number: '12'
    text: |-
      1 Tenzij een afwijkingsgrond als bedoeld in dit besluit van toepassing is, wordt de vaststelling van het nationale
      waterplan, het beheerplan voor de rijkswateren, een regionaal waterplan of een beheerplan voor de regionale wateren
      voor elke waterwinlocatie waar oppervlaktewater wordt onttrokken, gericht op de verwezenlijking van de Europese
      milieukwaliteitseisen voor water die voor het onttrokken water zijn opgenomen in [bijlage III][ref1] bij dit
      besluit.

      2 Aan de in het eerste lid bedoelde Europese milieukwaliteitseisen voor water wordt met ingang van 22 december
      2009 voldaan.

      3 Bij de vaststelling van een plan als bedoeld in het eerste lid wordt gestreefd naar de volgende Europese
      milieukwaliteitseis voor water: een verbetering van de kwaliteit, bepaald overeenkomstig het monitoringsprogramma,
      van elk daarin opgenomen oppervlaktewaterlichaam dan wel grondwaterlichaam waarin een waterwinlocatie is gelegen,
      en van elk daarin opgenomen oppervlaktewaterlichaam waaruit na oeverinfiltratie op een waterwinlocatie water wordt
      onttrokken, teneinde het niveau van zuivering van het onttrokken water dat is vereist voor de bereiding van voor
      menselijke consumptie bestemd water te verlagen.

      4 Op de in het derde lid bedoelde Europese milieukwaliteitseis voor water is [artikel 2][ref2] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0027061
      [ref2]: https://wetten.overheid.nl/BWBR0027061#Artikel2
    url: https://wetten.overheid.nl/BWBR0027061/2017-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0027061
      - id: ref2
        bwb_id: BWBR0027061
        artikel: '2'
        paragraaf: '1'
  - number: 12a
    text: |-
      Bij de vaststelling van het nationale waterplan, het beheerplan voor de rijkswateren, een regionaal waterplan
      of een beheerplan voor de regionale wateren geldt dat het plan voor elk daarin opgenomen waterlichaam waarin
      een waterwinlocatie is gelegen, de volgende Europese milieukwaliteitseis voor water verwezenlijkt: er is
      geen sprake van een zodanige achteruitgang van de kwaliteit van het waterlichaam, bepaald overeenkomstig het
      monitoringsprogramma, dat het risico bestaat dat het niveau van zuivering dat bij de bereiding van voor menselijke
      consumptie bestemd water wordt toegepast, moet worden verhoogd.
    url: https://wetten.overheid.nl/BWBR0027061/2017-01-01#Artikel12a
  - number: '13'
    text: |-
      1 Onze Ministers stellen met inachtneming van het daaromtrent bepaalde in de kaderrichtlijn water, de
      grondwaterrichtlijn en de richtlijn prioritaire stoffen voor elk stroomgebieddistrict een monitoringsprogramma
      vast. Het programma omvat een aanduiding van de monitoringspunten, en een beschrijving van de wijze van:

      a. monitoring van de toestand van een waterlichaam, voor zover het stoffen en kwaliteitselementen betreft, die
      relevant zijn voor de toestand van het waterlichaam,

      b. monitoring van de opkomende stoffen die zijn opgenomen in de aandachtstoffenlijst Rps, bedoeld in artikel 8 ter,
      eerste lid, van de richtlijn prioritaire stoffen;

      c. monitoring van de stoffen die daarbij zijn aangewezen als indicatoren voor een mogelijke bedreiging voor de
      kwaliteit van oppervlaktewater of grondwater dat wordt onttrokken voor de bereiding van voor menselijke consumptie
      bestemd water;

      d. monitoring van tendensen met betrekking tot de concentraties van stoffen,

      e. monitoring van de kwantitatieve toestand van een grondwaterlichaam, met inbegrip van een beoordeling van de
      beschikbare grondwatervoorraad,

      f. interpretatie en presentatie van de monitoringsresultaten,

      g. indeling van een waterlichaam in een toestandsklasse,

      h. verslaglegging over de monitoringsresultaten en de conclusies die daaraan zijn verbonden, en

      i. vaststelling van de toestandsklasse waarin een waterlichaam zich bevindt, per stof en kwaliteitselement, ten
      behoeve van de toepassing van [artikel 16][ref1],

      teneinde representatieve monitoringsgegevens te verkrijgen, die een samenhangend totaalbeeld van de toestand van de
      waterlichamen binnen het stroomgebieddistrict geven.

      2 In het monitoringsprogramma kan overeenkomstig punt 1.3.4 van bijlage V bij de kaderrichtlijn water worden
      bepaald dat statistische methoden worden toegepast, waaronder een percentielberekening, zodat een aanvaardbaar
      niveau van betrouwbaarheid en nauwkeurigheid wordt gewaarborgd wanneer wordt bepaald of is voldaan aan een
      Europese milieukwaliteitseis voor water die in dit besluit is vastgesteld. De statistische methoden voldoen aan
      overeenkomstig de procedure van artikel 9, tweede lid, van de richtlijn prioritaire stoffen vastgestelde regels.

      3 Ingeval de overeenkomstig het monitoringsprogramma voor een waterlichaam bepaalde gemiddelde waarde van een stof
      die is opgenomen in bijlage I bij dit besluit, lager is dan de bepalingsgrens en de bepalingsgrens de ingevolge
      [bijlage I][ref2] bij dit besluit voor die stof geldende Europese milieukwaliteitseis voor water overschrijdt,
      wordt de voor die stof bepaalde gemiddelde waarde aangemerkt als «lager dan de bepalingsgrens» en niet in
      aanmerking genomen bij de beoordeling van de chemische toestand van het waterlichaam.

      4 Het monitoringsprogramma wordt getoetst en bijgesteld in gevallen waarin dat vereist wordt door de kaderrichtlijn
      water.

      5 In afwijking van het eerste lid wordt een onderdeel van het monitoringsprogramma dat betrekking heeft op
      monitoring voor nader onderzoek, in gevallen als bedoeld in bijlage V, onder 1.3.3, bij de kaderrichtlijn water,
      of op monitoring voor aanvullende trendbeoordeling, in gevallen als bedoeld in artikel 5, vijfde lid, van de
      grondwaterrichtlijn, met inachtneming van het daaromtrent bepaalde in die richtlijnen, vastgesteld door het
      bestuursorgaan dat krachtens [artikel 14][ref3] verantwoordelijk is voor de monitoring van het desbetreffende
      waterlichaam.

      6 Van een monitoringsprogramma of een onderdeel daarvan als bedoeld in het vierde lid en een bijstelling van dat
      programma of onderdeel geeft Onze Minister openbaar kennis.


      [ref1]: https://wetten.overheid.nl/BWBR0027061#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0027061
      [ref3]: https://wetten.overheid.nl/BWBR0027061#Artikel14
    url: https://wetten.overheid.nl/BWBR0027061/2017-01-01#Artikel13
    references:
