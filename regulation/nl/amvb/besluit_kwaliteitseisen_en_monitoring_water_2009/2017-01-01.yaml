  - number: '5'
    text: |-
      Een oppervlaktewaterlichaam verkeert in een goede chemische toestand indien overeenkomstig het monitoringsprogramma
      is vastgesteld dat is voldaan aan de Europese milieukwaliteitseisen voor water, genoemd in [bijlage I][ref1] bij
      dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0027061
    url: https://wetten.overheid.nl/BWBR0027061/2017-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0027061
  - number: 5a
    text: |-
      Bij de vaststelling van het nationale waterplan, het beheerplan voor de rijkswateren, een regionaal waterplan of
      een beheerplan voor de regionale wateren geldt dat het plan voor elk daarin opgenomen waterlichaam de volgende
      Europese milieukwaliteitseis voor water verwezenlijkt: de concentratie van een prioritaire stof die de neiging
      heeft te accumuleren in sediment of in biota is, bepaald overeenkomstig het monitoringsprogramma, aan het eind van
      de planperiode in sediment en biota niet significant toegenomen.
    url: https://wetten.overheid.nl/BWBR0027061/2017-01-01#Artikel5a
  - number: '6'
    text: |-
      1 Een oppervlaktewaterlichaam verkeert in een goede ecologische toestand indien overeenkomstig het
      monitoringsprogramma is vastgesteld dat voor de kwaliteitselementen die voor het type natuurlijk
      oppervlaktewaterlichaam waartoe het oppervlaktewaterlichaam behoort, zijn genoemd in bijlage V, paragraaf 1.1, bij
      de kaderrichtlijn water, is voldaan aan de volgende Europese milieukwaliteitseisen voor water:

      de algemene definities van de goede ecologische toestand die voor het desbetreffende type zijn opgenomen in bijlage
      V, paragraaf 1.2, de tabellen 1.2.1 tot en met 1.2.4, bij de kaderrichtlijn water.

      2 Van de in het eerste lid bedoelde Europese milieukwaliteitseisen voor water kan worden afgeweken indien:

      a. het een kunstmatig waterlichaam of sterk veranderd waterlichaam betreft, en

      b. voor dat waterlichaam, onder vermelding van de reden van de afwijking, een goed ecologisch potentieel is
      vastgesteld in het beheerplan voor de rijkswateren, indien het rijkswateren betreft, dan wel het regionale
      waterplan, indien het regionale wateren betreft.

      3 Een goed ecologisch potentieel als bedoeld in het tweede lid komt, gegeven de fysische omstandigheden die
      voortvloeien uit de kunstmatige of sterk veranderde kenmerken van het oppervlaktewaterlichaam, zoveel mogelijk
      overeen met de Europese milieukwaliteitseisen voor water voor de biologische, hydromorfologische en fysisch-
      chemische kwaliteitselementen van de goede ecologische toestand van de meest vergelijkbare typen natuurlijk
      oppervlaktewaterlichaam. Het wordt vastgesteld met inachtneming van de algemene definities van een goed ecologisch
      potentieel die zijn opgenomen in bijlage V, paragraaf 1.2, tabel 1.2.5, bij de kaderrichtlijn water.
    url: https://wetten.overheid.nl/BWBR0027061/2017-01-01#Artikel6
  - number: '7'
    text: |-
      1 Tenzij toepassing wordt gegeven aan een mogelijkheid tot afwijken als bedoeld in de
      [artikelen 2, derde tot en met zevende lid][ref1], [3][ref2] of [6, tweede lid][ref3], geldt bij de vaststelling
      van een regionaal waterplan dat het plan voor elk daarin opgenomen grondwaterlichaam de volgende Europese
      milieukwaliteitseis voor water verwezenlijkt: met ingang van 22 december 2015 is een goede grondwatertoestand
      bereikt.

      2 Een goede toestand als bedoeld in het eerste lid houdt in dat zowel de kwantitatieve toestand, bedoeld in
      [artikel 8][ref4], als de chemische toestand, bedoeld in [artikel 9][ref5], vastgesteld overeenkomstig die
      artikelen goed zijn.


