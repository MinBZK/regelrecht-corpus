  - number: '14'
    text: |-
      Voor de uitvoering van het monitoringsprogramma zijn, ieder voor zover hun bevoegdheid strekt, verantwoordelijk:

      a. voor oppervlaktewaterlichamen: de bestuursorganen die bevoegd zijn een vergunning krachtens
      [artikel 6.2, eerste lid, van de Waterwet][ref1] te verlenen;

      b. voor grondwaterlichamen: gedeputeerde staten.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel6.2
