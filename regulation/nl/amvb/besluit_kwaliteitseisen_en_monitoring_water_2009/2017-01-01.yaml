  - number: '4'
    text: |-
      1 Tenzij toepassing wordt gegeven aan een mogelijkheid tot afwijken als bedoeld in de
      [artikelen 2, derde tot en met zevende lid][ref1], [3][ref2] of [6, tweede lid][ref3], geldt bij de vaststelling
      van het nationale waterplan, het beheerplan voor de rijkswateren, een regionaal waterplan of een beheerplan
      voor de regionale wateren dat het plan voor elk daarin opgenomen oppervlaktewaterlichaam de volgende Europese
      milieukwaliteitseis voor water verwezenlijkt: met ingang van 22 december 2015 is een goede oppervlaktewatertoestand
      bereikt.

      2 In afwijking van het eerste lid geldt bij de vaststelling van een plan als bedoeld in dat lid dat
      betrekking heeft op een periode die na 21 december 2015 begint, dat een goede chemische toestand van een
      oppervlaktewaterlichaam, voor zover het de stoffen betreft waarvoor dit in [bijlage I][ref4] bij dit besluit is
      bepaald, is bereikt met ingang van 22 december 2021.

      3 In afwijking van het eerste lid geldt bij de vaststelling van een plan als bedoeld in dat lid dat
      betrekking heeft op een periode die na 21 december 2015 begint, dat een goede chemische toestand van een
      oppervlaktewaterlichaam, voor zover het de in [artikel 5a][ref5] gestelde milieukwaliteitseis betreft, is bereikt
      met ingang van 22 december 2021.

      4 In een geval als bedoeld in [artikel 3, lid 8 ter][ref6], van de richtlijn prioritaire stoffen geldt in afwijking
      van het tweede lid in plaats van de datum 21 december 2015 de datum 21 december 2018 en in plaats van de datum 22
      december 2021 de datum 22 december 2027.

      5 In afwijking van het eerste lid geldt bij de vaststelling van een plan als bedoeld in dat lid dat
      betrekking heeft op een periode die na 21 december 2021 begint, dat een goede chemische toestand van een
      oppervlaktewaterlichaam, voor zover het de stoffen betreft waarvoor dit in [bijlage I][ref7] bij dit besluit is
      bepaald, is bereikt met ingang van 22 december 2027.

      6 Voor de oppervlaktewaterlichamen die in het nationale waterplan als schelpdierwater zijn aangewezen, houdt een
      goede oppervlaktewatertoestand tevens in dat in schelpdieren geen bacteriële besmetting aanwezig is in een mate die
      schadelijk kan zijn voor de volksgezondheid.

      7 Een goede oppervlaktewatertoestand als bedoeld in het eerste lid houdt in dat zowel de chemische toestand,
      bedoeld in de [artikelen 5][ref8] en [5a][ref9], als de ecologische toestand, bedoeld in [artikel 6][ref10],
      vastgesteld overeenkomstig die artikelen goed zijn.


