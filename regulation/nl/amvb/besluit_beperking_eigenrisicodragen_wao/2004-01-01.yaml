articles:
  - number: '1'
    text: |-
      1 Met ingang van 2 januari 2003 wordt de toestemming, bedoeld in
      [artikel 75, eerste lid, van de Wet op de arbeidsongeschiktheidsverzekering][ref1], niet verleend aan de werkgever,
      bedoeld in [artikel 1, eerste lid, onderdeel e, van het Besluit premiedifferentiatie WAO][ref2].

      2 In afwijking van het eerste lid wordt de toestemming, bedoeld in
      [artikel 75, eerste lid, van de Wet op de arbeidsongeschiktheidsverzekering][ref3], wel per 1 juli 2004 verleend
      aan de werkgever, bedoeld in het eerste lid.


