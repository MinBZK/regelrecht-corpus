$id: besluit_ex_artikel_28_wet_op_de_justitiele_documentatie
regulatory_layer: AMVB
publication_date: '2004-03-31'
valid_from: '1986-03-01'
bwb_id: BWBR0002274
url: https://wetten.overheid.nl/BWBR0002274/1986-03-01
preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Op de voordracht van Onze Minister van Binnenlandse Zaken, Bezitsvorming en Publiekrechtelijke Bedrijfsorganisatie
    van 27 december 1957, no. U 22377, Directie Binnenlands Bestuur, Afdeling Bestuurszaken, mede namens Onze Minister
    van Justitie;

    Gelet op artikel 28, tweede lid, van de Wet op de justitiële documentatie en op de verklaringen omtrent het gedrag
    (Stb. 1955, 395);

    De Raad van State gehoord (advies van 21 januari 1958, no. 34);

    Gezien het nader rapport van Onze voornoemde Minister van 31 januari 1958, no. 22621. Directie Binnenlands Bestuur,
    Afdeling Bestuurszaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0002274/1986-03-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      De leden van een commissie van advies als bedoeld in
      [artikel 28, eerste lid, van de Wet op de justitiële documentatie en op de verklaringen omtrent het gedrag][ref1]
      worden benoemd door de burgemeester.


      [ref1]: https://wetten.overheid.nl/BWBR0002195#Artikel28
    url: https://wetten.overheid.nl/BWBR0002274/1986-03-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002195
        artikel: '28'
  - number: '1.2'
    text: De burgemeester wijst een der leden tot voorzitter aan.
    url: https://wetten.overheid.nl/BWBR0002274/1986-03-01#Artikel1
  - number: '2'
    text: De commissie bestaat uit ten minste drie en ten hoogste vijftien leden.
    url: https://wetten.overheid.nl/BWBR0002274/1986-03-01#Artikel2
  - number: '3.1'
    text: |-
      De burgemeester benoemt ten minste een derde van het aantal leden uit een voordracht van de Reclasseringsraad in
      het arrondissement waarin de gemeente is gelegen, welke voordracht voor iedere te vervullen plaats de namen van
      twee personen bevat.
    url: https://wetten.overheid.nl/BWBR0002274/1986-03-01#Artikel3
  - number: '3.2'
    text: |-
      De burgemeester streeft bij de benoeming van de overige leden naar een zodanige samenstelling der commissie, dat
      daarvan een of meer personen, behorende tot de volgende categorieën deel uitmaken:
    url: https://wetten.overheid.nl/BWBR0002274/1986-03-01#Artikel3
  - number: 3.2.a
    text: |-
      werkgevers, daaronder begrepen personen, belast met de dagelijkse leiding van een overheidsdienst of -bedrijf, en
      personen, belast met personeelsbeheer;
    url: https://wetten.overheid.nl/BWBR0002274/1986-03-01#Artikel3
  - number: 3.2.b
    text: werknemers;
    url: https://wetten.overheid.nl/BWBR0002274/1986-03-01#Artikel3
  - number: 3.2.c
    text: personen, werkzaam op het gebied der arbeidsbemiddeling;
    url: https://wetten.overheid.nl/BWBR0002274/1986-03-01#Artikel3
  - number: 3.2.d
    text: rechterlijke ambtenaren.
    url: https://wetten.overheid.nl/BWBR0002274/1986-03-01#Artikel3
  - number: '4.1'
    text: |-
      Indien een commissie van advies wordt ingesteld voor twee of meer gemeenten die niet binnen één arrondissement
      zijn gelegen, wordt de bij [artikel 3, eerste lid][ref1], bedoelde voordracht gedaan door de stichting, bedoeld in
      [artikel 4 van de Reclasseringsregeling][ref2] 1986 in het arrondissement waarbinnen de zetel der commissie wordt
      gevestigd.


      [ref1]: https://wetten.overheid.nl/BWBR0002274#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0007120#Artikel4
    url: https://wetten.overheid.nl/BWBR0002274/1986-03-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002274
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0007120
        artikel: '4'
  - number: '4.2'
    text: |-
      Deze raad pleegt, alvorens een voordracht te doen, overleg met de stichtingen, bedoeld in
      [artikel 4 van de Reclasseringsregeling][ref1] 1986 in andere arrondissementen waarbinnen gemeenten zijn gelegen
      voor welke de commissie van advies wordt ingesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007120#Artikel4
    url: https://wetten.overheid.nl/BWBR0002274/1986-03-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0007120
        artikel: '4'
  - number: '5'
    text: |-
      Dit besluit treedt in werking met ingang van de dag waarop de
      [Wet op de justitiële documentatie en op de verklaringen omtrent het gedrag][ref1] in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0002195
    url: https://wetten.overheid.nl/BWBR0002274/1986-03-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002195
