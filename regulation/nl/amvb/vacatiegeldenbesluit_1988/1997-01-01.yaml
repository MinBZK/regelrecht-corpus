preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Financiën van 23 december 1987, Generale Thesaurie, Directie
    Financieringen, nr. 387-12027;

    Overwegende dat nieuwe regelen gesteld dienen te worden ten aanzien van de toekenning van vacatiegelden door het
    Rijk;

    Gelet op artikel 89, eerste lid, van de Grondwet;

    De Raad van State gehoord (advies van 8 maart 1988, nr. W06.88.0002);

    Gezien het nader rapport van de Staatssecretaris van Financiën van 13 april 1988, Generale Thesaurie, Directie
    Financieringen, nr. 388-2949;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0004317/1997-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Aan de leden van een bij of krachtens wet bij koninklijk besluit of bij ministerieel besluit ingestelde
      commissie, aan haar secretarissen en adjunct-secretarissen, alsmede aan de deskundigen die aan de werkzaamheden
      van de commissie deelnemen, kan voor het bijwonen van een vergadering hetzij van de commissie zelf, hetzij van een
      van haar subcommissies, een vacatiegeld worden toegekend. Twee of meer vergaderingen op dezelfde dag gelden als
      één vergadering.

      2 Het vacatiegeld wordt vastgesteld bij beschikking van Onze Minister onder wiens ministerie de commissie
      ressorteert.

      3 Onze Minister van Financiën stelt maximumbedragen voor vacatiegeld vast voor naar zwaarte van taak onderscheiden
      categorieën van commissies, en voor voorzitterschappen.
    url: https://wetten.overheid.nl/BWBR0004317/1997-01-01#Artikel1
  - number: '2'
    text: |-
      1 Van de toekenning van vacatiegeld zijn uitgesloten:

      a. functionarissen in dienst van het Rijk, van een ander publiekrechtelijk lichaam dan het Rijk of van een door
      het Rijk in het leven geroepen instelling, dan wel van een instelling welker personeelskosten door het Rijk worden
      vergoed, indien hun benoeming haar oorzaak vindt in de functie die zij vervullen;

      b. vertegenwoordigers van organisaties die gelegenheid hebben op te komen voor groepen of individuele personen
      wier belangen bij de arbeid van de commissie zijn betrokken, tenzij door Onze Minister onder wiens ministerie de
      commissie ressorteert, en Onze Minister van Financiën gezamenlijk in bijzondere gevallen anders wordt beslist.

      2 Indien deskundigen, secretarissen en adjunct-secretarissen op andere wijze voor hun aandeel in de werkzaamheden
      van de commissie worden beloond, wordt aan hen geen vacatiegeld toegekend.
    url: https://wetten.overheid.nl/BWBR0004317/1997-01-01#Artikel2
  - number: '3'
    text: |-
      1 In plaats van vacatiegeld kan een vaste beloning worden toegekend bij een koninklijk besluit te nemen op
      voordracht van Onze Minister, onder wiens ministerie de commissie ressorteert.

      2 De vaste beloning wordt, al naar gelang het tijdsbeslag en de zwaarte van de werkzaamheden, vastgesteld op een
      bedrag overeenkomende met een evenredig deel van de jaarwedde volgens de schalen van de bezoldiging van burgerlijke
      rijksambtenaren, met een maximum van 50% van de jaarwedde volgens het eerste niveau na schaal 18.
    url: https://wetten.overheid.nl/BWBR0004317/1997-01-01#Artikel3
  - number: 3a
    text: |-
      Dit besluit is niet van toepassing op leden van een adviescollege als bedoeld in de
      [Kaderwet adviescolleges][ref1], niet zijnde een adviescollege als bedoeld in artikel 3 van die wet.


      [ref1]: https://wetten.overheid.nl/BWBR0008159
    url: https://wetten.overheid.nl/BWBR0004317/1997-01-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0008159
  - number: '4'
    text: |-
      1 Het Vacatiegeldenbesluit 1970 (*Stb.* 577) wordt ingetrokken. Ingevolge dat besluit toegekende vacatiegelden en
      vaste beloningen blijven gelden.

      2 Dit besluit treedt in werking met ingang van de dag na uitgifte van het *Staatsblad* waarin het wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0004317/1997-01-01#Artikel4
  - number: '5'
    text: Dit besluit kan worden aangehaald als "Vacatiegeldenbesluit 1988".
    url: https://wetten.overheid.nl/BWBR0004317/1997-01-01#Artikel5
