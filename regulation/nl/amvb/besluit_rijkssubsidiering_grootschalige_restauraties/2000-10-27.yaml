  url: https://wetten.overheid.nl/BWBR0011525/2000-10-27#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. de wet: de [Monumentenwet 1988][ref1];

      b. eigenaar: een natuurlijke persoon of rechtspersoon die het recht van eigendom of een ander zakelijk recht heeft
      op een beschermd monument;

      c. restauratie: werkzaamheden aan een beschermd monument, het normale onderhoud te boven gaand, die voor het
      herstel van het beschermde monument noodzakelijk zijn;

      d. subsidiabele restauratiekosten: kosten als bedoeld in artikel 16 van het Besluit rijkssubsidiëring restauratie
      monumenten 1997.


      [ref1]: https://wetten.overheid.nl/BWBR0004471
    url: https://wetten.overheid.nl/BWBR0011525/2000-10-27#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004471
  - number: '2'
    text: |-
      Onze minister kan aan de eigenaar van een beschermd monument subsidie verstrekken in de subsidiabele
      restauratiekosten van dat monument, indien die kosten na toepassing van artikel 17 van het Besluit
      rijkssubsidiëring restauratie monumenten 1997 en na te zijn verminderd met voor de restauratie van dat monument
      reeds verleende subsidies:

      a. meer bedragen dan 3 miljoen gulden dan wel;

      b. minder bedragen dan 3 miljoen gulden, maar meer bedragen dan 1 miljoen gulden en bovendien meer bedragen dan
      zes maal het budget, bedoeld in artikel 5, eerste of tweede lid, van het Besluit rijkssubsidiëring restauratie
      monumenten 1997, zoals dat in 1999 ten behoeve van de categorie monumenten waartoe het monument in dat jaar
      behoorde, voor het jaar 2005 door Onze minister is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0011525/2000-10-27#Artikel2
  - number: '3'
    text: |-
      Het Besluit rijkssubsidiëring restauratie monumenten 1997 is van toepassing met uitzondering van de
      [artikelen 1][ref1], [2][ref2], [4][ref3] tot en met 13, 15, eerste lid, tweede volzin, vierde lid, tweede
      volzin, en zesde lid, 18, 21 en 38 tot en met 49.


      [ref1]: https://wetten.overheid.nl/BWBR0011525#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0011525#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0011525#Artikel4
    url: https://wetten.overheid.nl/BWBR0011525/2000-10-27#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0011525
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0011525
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0011525
        artikel: '4'
  - number: '4'
    text: |-
      Onverminderd artikel 3 van het Besluit rijkssubsidiëring restauratie monumenten 1997 wordt subsidie in ieder geval
      niet verstrekt, indien:

      a. de financiering van het gedeelte van de kosten van de voorgenomen restauratie, dat niet door subsidie wordt
      gedekt, naar het oordeel van Onze minister onvoldoende is gewaarborgd; of

      b. het huidige of het beoogde gebruik van het te restaureren monument naar het oordeel van Onze minister een
      belemmering vormt voor de instandhouding van het monument.
    url: https://wetten.overheid.nl/BWBR0011525/2000-10-27#Artikel4
  - number: '5'
    text: |-
      Een aanvraag voor subsidie als bedoeld in [artikel 2][ref1] wordt vóór 1 november 2000 ingediend en wordt vóór 14
      december 2000 naar Onze minister doorgezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0011525#Artikel2
    url: https://wetten.overheid.nl/BWBR0011525/2000-10-27#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0011525
        artikel: '2'
  - number: '6'
    text: |-
      1 Het subsidieplafond voor de periode 2000 tot en met 2006 is 140 miljoen gulden, tenzij Onze minister vóór 1
      februari 2001 een hoger subsidieplafond vaststelt.

      2 Vóór 1 februari 2001 voorziet Onze minister in een gelijktijdige beslissing op de ingediende aanvragen.

      3 Bij de beslissing, bedoeld in het tweede lid, houdt Onze minister rekening met:

      a. de mate waarin het monument stedenbouwkundige of landschappelijke waarde heeft;

      b. de mate waarin het monument een publieksfunctie heeft of toeristen aantrekt; en

      c. de mate waarin de restauratie leidt tot investeringen, zowel in het monument zelf als in de omgeving daarvan
      vanwege de waarde van het monument.
    url: https://wetten.overheid.nl/BWBR0011525/2000-10-27#Artikel6
  - number: '7'
    text: |-
      Onverminderd artikel 19, eerste lid, van het Besluit rijkssubsidiëring restauratie monumenten 1997, vermeldt Onze
      minister in de beschikking tot subsidieverlening tevens het jaar of de jaren waarin de verleende subsidie kan
      worden betaald.
    url: https://wetten.overheid.nl/BWBR0011525/2000-10-27#Artikel7
  - number: '8'
    text: Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0011525/2000-10-27#Artikel8
  - number: '9'
    text: 'Dit besluit wordt aangehaald als: Besluit rijkssubsidiëring grootschalige restauraties.'
    url: https://wetten.overheid.nl/BWBR0011525/2000-10-27#Artikel9
