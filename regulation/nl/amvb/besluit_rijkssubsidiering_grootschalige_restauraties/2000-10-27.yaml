    De Raad van State gehoord (advies van 8 juni 2000, no. W05.00.0190/III);

    Gezien het nader rapport van de Staatssecretaris van Onderwijs, Cultuur en Wetenschappen, dr. F. van der Ploeg, van
    19 juli 2000, WJZ/2000/26336(8101), directie Wetgeving en Juridische Zaken;

