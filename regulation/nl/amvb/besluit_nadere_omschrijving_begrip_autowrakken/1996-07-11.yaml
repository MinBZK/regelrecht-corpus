articles:
  - number: '1'
    text: |-
      In gevallen waarin motorrijtuigen op meer dan twee wielen, die rijtechnisch in onvoldoende staat van onderhoud
      en in een kennelijk verwaarloosde toestand verkeren, niet zijn voorzien van een bij deze motorrijtuigen behorend
      kenteken als bedoeld in [artikel 36, eerste lid, van de Wegenverkeerswet 1994][ref1] of een geldig kentekenbewijs
      als bedoeld in [artikel 36, tweede lid, van de Wegenverkeerswet 1994][ref2], worden deze aangemerkt als
      autowrakken.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel36
