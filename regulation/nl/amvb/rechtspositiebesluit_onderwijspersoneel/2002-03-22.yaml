      voor hem geldt bij de functie waarin hij reeds aan de instelling is benoemd.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S903
  - number: I-S904
    text: |-
      Indien een instelling als bedoeld in artikel I-A1 onder *d*6 deel uit maakt van een horizontale scholengemeenschap
      als bedoeld in artikel I-Q101, eerste lid, onderdeel *c*, sub 2, zijn voor de betrokkenen de bepalingen van
      paragraaf 15 van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S904
  - number: I-S1001
    text: 'In deze paragraaf wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S1001
  - number: I-S1001.a
    text: 'wet: de Wet op de onderwijsverzorging;'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S1001
  - number: I-S1001.b
    text: 'instelling: de instelling bedoeld in artikel I-A1, onder *d*12;'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S1001
  - number: I-S1001.c
    text: |-
      betrokkene: de betrokkene bedoeld in artikel I-A1, onder *e*12, voorzover het betreft het inhoudelijk en
      ondersteunend personeel;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S1001
  - number: I-S1001.d
    text: |-
      inhoudelijk personeel: het personeel dat is belast met activiteiten op het terrein van de onderwijsverzorging
      bedoeld in de wet;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S1001
  - number: I-S1001.e
    text: |-
      ondersteunend personeel: het personeel dat is belast met werkzaamheden ter ondersteuning van de directie en het
      inhoudelijk personeel;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S1001
  - number: I-S1001.f
    text: 'algemene instellingen: landelijke pedagogische centra en schoolbegeleidingsdiensten;'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S1001
  - number: I-S1001.g
    text: |-
      specifieke instellingen: het Instituut voor Onderzoek van het Onderwijs, het Instituut voor Toetsontwikkeling en
      het Instituut voor Leerplanontwikkeling.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S1001
