    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q901
  - number: I-Q901.a
    text: 'directeur/coördinator: de directeur/coördinator van een instelling als bedoeld in artikel I-A1, onder *d*6;'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q901
  - number: I-Q901.b
    text: |-
      adjunct-directeur/coördinator: de adjunct-directeur/coördinator van een instelling als bedoeld in artikel I-A1,
      onder *d*6;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q901
  - number: I-Q901.c
    text: |-
      plaatsvervangend directeur/coördinator: de adjunct-directeur/coördinator die tevens is benoemd tot plaatsvervangend
      directeur/coördinator van een instelling als bedoeld in artikel I-A1 , onder *d*6;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q901
  - number: I-Q901.d
    text: |-
      directie: de directeur/coördinator of directeuren/coördinator, de eventuele adjunct-directeur of adjunct-
      directeuren/coördinator en de eventuele andere betrokkenen die zijn benoemd in een functie die is ingedeeld in
      hoofdstuk I-Q gezamenlijk;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q901
  - number: I-Q901.e
    text: 'betrokkene: degene die deel uitmaakt van de directie;'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q901
  - number: I-Q901.f
    text: 'deelnemersuur: een eenheid van 60 minuten gedurende welke een deelnemer daadwerkelijk aan een programma deelneemt.'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q901
  - number: I-Q902
    text: |-
      Naast de normfunctie van directeur/coördinator, kunnen de normfuncties van adjunct-directeur/coördinator en
      adjunct-directeur/coördinator tevens plaatsvervangend directeur/coördinator voorkomen met een maximumschaal als
      aangegeven in artikel I-Q905. In de bijlage Q8 bij dit besluit is voor deze normfuncties een taakkarakteristiek
      gegeven.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q902
  - number: I-Q903
    text: |-
      Het totaal aantal deelnemersuren in een kalenderjaar, bedoeld in artikel I-Q905 is voor de toepassing van deze
      paragraaf gelijk aan het aantal deelnemersuren, dat voor de instelling is opgenomen in het voor dat kalenderjaar
      door de desbetreffende gemeenteraad vastgestelde programma basiseducatie en de daarbij behorende opgave van
      geraamde kosten.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q903
  - number: I-Q904
    text: |-
      De maximumschaal die voor de in artikel I-Q902 genoemde normfuncties gelden, worden afhankelijk van het aantal
      deelnemersuren vastgesteld volgens onderstaand schema:
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q904
  - number: I-Q905
    text: |-
      Indien een instelling als bedoeld in artikel I-A1 onder *d*6 deel uit maakt van een horizontale scholengemeenschap
      als bedoeld in artikel I-Q101, eerste lid, onderdeel *c*, sub 2, zijn voor de betrokkenen de bepalingen van
      paragraaf 15 van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q905
  - number: I-Q1001
    text: 'In deze paragraaf wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q1001
  - number: I-Q1001.a
    text: 'instelling: de instelling bedoeld in artikel I-A1 onder *d*12;'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q1001
  - number: I-Q1001.b
    text: 'directeur: de directeur van een instelling;'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q1001
  - number: I-Q1001.c
    text: 'adjunct-directeur: de adjunct-directeur van een instelling;'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q1001
  - number: I-Q1001.d
    text: |-
      plaatsvervangend directeur: de adjunct-directeur die tevens is benoemd tot plaatsvervangend directeur van een
      instelling;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q1001
  - number: I-Q1001.e
    text: |-
      directie: de directeur, de adjunct-directeuren en de eventuele andere betrokkenen die zijn benoemd in een functie
      die is ingedeeld in hoofdstuk I-Q gezamenlijk;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q1001
  - number: I-Q1001.f
    text: 'betrokkene: degene die deel uitmaakt van de directie;'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q1001
  - number: I-Q1001.g
    text: 'algemene instellingen: landelijke en pedagogische centra en schoolbegeleidingsdiensten;'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q1001
  - number: I-Q1001.h
    text: |-
      specifieke instellingen: het Instituut voor Onderzoek van het Onderwijs, het Instituut voor Toetsontwikkeling en
      het Instituut voor Leerplanontwikkeling.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q1001
  - number: I-Q1002
    text: |-
      De normfuncties die met inachtneming van het in het Uitvoeringsbesluit WOV gestelde in de directie kunnen voorkomen
      zijn die van directeur, adjunct-directeur en adjunct-directeur tevens plaatsvervangend directeur. In de bijlage Q9
      is voor deze normfuncties een taakkarakteristiek gegeven.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q1002
  - number: I-Q1003
    text: 'De maximumschalen voor de normfuncties voor de directie van de landelijke pedagogische centra zijn:'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q1003
  - number: I-Q1003.a
    text: voor de directeur schaal 16;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q1003
  - number: I-Q1003.b
    text: voor de plaatsvervangend directeur schaal 15;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q1003
  - number: I-Q1003.c
    text: voor de adjunct-directeur schaal 14.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q1003
  - number: I-Q1004
    text: |-
      De maximumschaal voor de normfunctie van directeur, plaatsvervangend directeur en adjunct-directeur bij
      schoolbegeleidingsdiensten wordt vastgesteld volgens het onderstaande schema:
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q1004
  - number: I-Q1005
    text: De maximumschaal voor de normfunctie van directeur van het Instituut voor Onderzoek van het Onderwijs is schaal 16.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q1005
  - number: I-Q1006
    text: 'De maximumschalen voor de normfuncties voor de directie van het Instituut voor Toetsontwikkeling zijn:'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q1006
  - number: I-Q1006.a
    text: voor de directeur schaal 16;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q1006
  - number: I-Q1006.b
    text: voor de plaatsvervangend directeur schaal 15;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q1006
  - number: I-Q1006.c
    text: voor de adjunct-directeur schaal 14.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q1006
  - number: I-Q1007
    text: 'De maximumschalen voor de normfuncties voor de directie van het Instituut voor Leerplanontwikkeling zijn:'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q1007
  - number: I-Q1007.a
    text: voor directeur schaal 16;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q1007
  - number: I-Q1007.b
    text: voor de plaatsvervangend directeur schaal 15;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q1007
  - number: I-Q1007.c
    text: voor de adjunct-directeur schaal 14.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q1007
  - number: I-Q1101
    text: 'In deze paragraaf wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q1101
  - number: I-Q1101.a
    text: 'directeur: de directeur van een instelling, als bedoeld in artikel I-A1, onder *d*13;'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q1101
  - number: I-Q1101.b
    text: 'adjunct-directeur: de adjunct-directeur van een instelling, als bedoeld in artikel I-A1, onder *d*13;'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q1101
  - number: I-Q1101.c
    text: |-
      plaatsvervangend directeur: de adjunct-directeur van de landelijke instelling "Centrum voor de Innovatie van
      Beroepsonderwijs Bedrijfsleven", bedoeld in de artikelen I-Q1102 en I-Q1108 tot en met I-Q1110, die tevens is
      benoemd tot plaatsvervangend directeur van die instelling;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q1101
  - number: I-Q1101.d
    text: |-
      directie: de directeur, de eventuele adjunct-directeuren en de eventuele andere betrokkenen die zijn benoemd in een
      functie die is ingedeeld in hoofdstuk I-Q gezamenlijk;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q1101
  - number: I-Q1101.e
    text: 'betrokkene: degene die deel uitmaakt van de directie.'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q1101
  - number: I-Q1102.1
    text: 'De normfuncties die in de directie kunnen voorkomen zijn die van:'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q1102
  - number: I-Q1102.1.a
    text: |-
      directeur voor zover het betreft de landelijke instelling het "Landelijk studie- en ontwikkelingscentrum voor de
      volwasseneneducatie";
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q1102
  - number: I-Q1102.1.b
    text: |-
      directeur en adjunct-directeur voor zover het betreft de landelijke instelling het "Centrum voor de Innovatie van
      Beroepsonderwijs Bedrijfsleven";
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q1102
  - number: I-Q1102.1.c
    text: directeur en adjunct-directeur voor zover het betreft de regionale, plaatselijke en provinciale instellingen.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q1102
  - number: I-Q1102.2
    text: |-
      Aan de regionale instellingen, genoemd in het eerste lid, onder *c*, kan slechts een adjunct-directeur worden
      benoemd, indien de maximumschaal voor de normfunctie directeur gelijk is aan of hoger is dan schaal 12.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q1102
  - number: I-Q1104.1
    text: De maximumschaal voor de normfunctie van directeur van een regionale instelling is schaal 11.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q1104
  - number: I-Q1104.2
    text: |-
      In afwijking van het eerste lid is de maximumschaal voor de normfunctie van directeur van een regionale instelling
      als bedoeld in artikel I-A1, onder *d*13 sub *a*, schaal 12 indien:
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q1104
  - number: I-Q1104.2.a
    text: |-
      de instelling uit de door de desbetreffende provincie van het Rijk ontvangen bijdrage een subsidie krijgt die
      gelijk is aan of groter is dan een bepaald door Onze minister vast te stellen bedrag;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q1104
  - number: I-Q1104.2.b
    text: |-
      de subsidie die de instelling krijgt uit de door de desbetreffende provincie van het Rijk ontvangen bijdrage
      samen met eigen bijdragen van gemeente of provincie en eventueel op andere wijze verworven middelen het door Onze
      minister vast te stellen bedrag, bedoeld onder *a*, te boven gaat en Onze minister op een daartoe strekkend verzoek
      van het bevoegd gezag heeft goedgekeurd dat schaal 12 wordt toegepast.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q1104
  - number: I-Q1104.3
    text: |-
      In afwijking van het eerste lid is de maximumschaal voor de normfunctie van directeur van een regionale instelling
      als bedoeld in artikel I-A1, onder *d*13 sub *b*, schaal 12 indien de van het rijk ontvangen bijdrage samen met
      op andere wijze verworven middelen gelijk is aan of groter is dan een door Onze minister vast te stellen bedrag
      en Onze minister op een daartoe strekkend verzoek van het bevoegd gezag heeft goedgekeurd dat schaal 12 wordt
      toegepast.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q1104
  - number: I-Q1105
    text: De maximumschaal voor de normfunctie van directeur van een plaatselijke of provinciale instelling is schaal 12.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q1105
  - number: I-Q1106
    text: |-
      De maximumschaal voor de normfunctie van adjunct-directeur van een regionale, plaatselijke of provinciale
      instelling is schaal 11.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q1106
  - number: I-Q1107
    text: |-
      De maximumschaal voor de normfunctie van directeur van de landelijke instelling het "Landelijk studie- en
      ontwikkelingscentrum voor de volwasseneneducatie" is schaal 14.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q1107
  - number: I-Q1108
    text: |-
      De maximumschaal voor de normfunctie van directeur van de landelijke instelling het "Centrum voor de Innovatie
      Beroepsonderwijs Bedrijfsleven" is schaal 16.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q1108
  - number: I-Q1109
    text: |-
      De maximumschaal voor de normfunctie van plaatsvervangend directeur van de landelijke instelling het "Centrum voor
      de Innovatie Beroepsonderwijs Bedrijfsleven" is schaal 15.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q1109
  - number: I-Q1110
    text: |-
      De maximumschaal voor de normfunctie van adjunct-directeur van de landelijke instelling het "Centrum voor de
      Innovatie van Beroepsonderwijs Bedrijfsleven" is schaal 14.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q1110
  - number: I-Q1201
    text: 'In deze paragraaf wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q1201
  - number: I-Q1201.a
    text: '"instelling": de instelling als bedoeld in artikel I-A1, onder *d*14;'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q1201
  - number: I-Q1201.b
    text: '"centrale directie": de centrale directie van een instelling als bedoeld in artikel I-Q1202;'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q1201
  - number: I-Q1201.c
    text: |-
      "voorzitter van de centrale directie": het lid van de centrale directie dat door het bevoegd gezag is benoemd tot
      voorzitter van de centrale directie;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q1201
  - number: I-Q1201.d
    text: |-
      "directie": de leden van de centrale directie, de adjunct-directeur en de eventuele andere betrokkenen die zijn
      benoemd in een functie die is ingedeeld in hoofdstuk I-Q gezamenlijk;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q1201
  - number: I-Q1201.e
    text: '"*y*": het aantal leerlingen van de instelling dat middelbaar beroepsonderwijs volgt;'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q1201
  - number: I-Q1201.g
    text: |-
      "verticale scholengemeenschap: een scholengemeenschap, bedoeld in artikel I-Q101, eerste lid, onderdeel *c*, onder
      3;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q1201
  - number: I-Q1201.h
    text: '"adjunct-directeur": de adjunct-directeur, bedoeld in artikel I-Q1203 en artikel I-Q1209.'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q1201
  - number: I-Q1201.i
    text: '"betrokkene": degene die deel uitmaakt van de directie.'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q1201
  - number: I-Q1202.1
    text: |-
      Behoudens het bepaalde in artikel I-Q1203 benoemt het bevoegd gezag in de centrale directie ten hoogste vijf leden
      op maximaal drie formatieplaatsen.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q1202
  - number: I-Q1202.2
    text: |-
      De centrale directie van een horizontale scholengemeenschap kan worden uitgebreid tot ten hoogste het aantal
      formatieplaatsen als is aangegeven in onderstaand schema:
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q1202
  - number: I-Q1202.3
    text: |-
      In een centrale directie van vier formatieplaatsen kunnen maximaal zes leden, in een centrale directie van vijf
      formatieplaatsen kunnen maximaal zeven leden worden benoemd.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q1202
  - number: I-Q1202.4
    text: |-
      In de bijlage Q11 bij dit besluit is voor de functies voorzitter van de centrale directie en lid van de centrale
      directie een taakkarakteristiek gegeven.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q1202
  - number: I-Q1202.5
    text: |-
      In het georganiseerd overleg op instellingsniveau als bedoeld in hoofdstuk IV-E kan worden overeengekomen af te
      wijken van het bepaalde in artikel I-P3, tweede lid, mits daarbij de taakomvang op jaarbasis ongewijzigd blijft.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q1202
  - number: I-Q1203
    text: |-
      Aan instellingen die deel uitmaken van een onderwijsgemeenschap als bedoeld in artikel I-Q101, onder *d*, kan de
      normfunctie van adjunct-directeur voorkomen, onverminderd het bepaalde in artikel I-Q1209. De maximumschaal voor de
      functie wordt vastgesteld overeenkomstig artikel I-Q404 voor de normfunctie plaatsvervangend directeur.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q1203
  - number: I-Q1204
    text: |-
      Het bevoegd gezag stelt een regeling op met betrekking tot de werktijd alsmede met betrekking tot de autorisatie en
      registratie van afwezigheid.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q1204
  - number: I-Q1205.1
    text: |-
      Voor de leden van de centrale directie gelden de maximumschalen als aangegeven in onderstaand schema.





                    functie indien y is maximumschaal




                    voorzitter 600 of meer doch minder dan 1000 schaal 13




                    1000 of meer doch minder dan 4000 schaal 14




                    4000 of meer doch minder dan 8000 schaal 15




                    8000 of meer schaal 16




                    lid 600 of meer doch minder dan 1000 schaal 12




                    1000 of meer doch minder dan 4000 schaal 13




                    4000 of meer doch minder dan 8000 schaal 14




                    8000 of meer schaal 15
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q1205
  - number: I-Q1205.2
    text: |-
      Indien het bevoegd gezag hem bij wettelijk voorschrift opgedragen taken en bevoegdheden heeft overgedragen aan de
      centrale directie, worden de in het eerste lid genoemde schalen met één verhoogd.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q1205
  - number: I-Q1206
    text: |-
      Indien *y* van de instelling minder dan 600 bedraagt, worden de maximumschalen van de centrale directie vastgesteld
      overeenkomstig artikel I-Q404, met dien verstande dat in dat artikel voor directeur wordt gelezen: voorzitter en
      voor plaatsvervangend directeur: lid.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q1206
  - number: I-Q1206a.1
    text: |-
      Indien de horizontale scholengemeenschap bestaat uit 5 componenten als aangegeven in artikel I-Q1202, tweede lid,
      worden de maximumschalen genoemd in artikel I-Q1205, eerste lid, met een verhoogd.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q1206a
  - number: I-Q1206a.2
    text: |-
      Indien de vaststelling van de maximumschalen op basis van het bepaalde in de artikelen I-Q1405 en I-Q1406 dan wel
      de artikelen I-Q1505 en I-Q1506, hoger is dan de uitkomst van de vaststelling van de maximumschalen overeenkomstig
      het eerste lid, worden de maximumschalen overeenkomstig de artikelen I-Q1405 en I-Q1406 dan wel de artikelen I-
      Q1505 en I-Q1506 vastgesteld, met dien verstande dat de maximumschaal niet hoger dan schaal 18 kan zijn.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q1206a
  - number: I-Q1206a.3
    text: Artikel I-Q1205, tweede lid, is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q1206a
  - number: I-Q1207
    text: |-
