  - number: I-R1507.1
    text: |-
      Voor de betrokkene die bij wijze van waarneming tijdelijk wordt belast met de volledige vervanging van een
      functionaris bij wiens functie een hogere maximumschaal behoort, die gedurende meer dan 30 aaneengesloten
      kalenderdagen anders dan wegens vakantieverlof verhinderd is de werkzaamheden voortvloeiende uit zijn functie te
      verrichten, wordt met ingang van de 31e dag van de vervanging en zolang hij met de volledige vervanging is belast,
      een salaris vastgesteld alsof hij in die functie was benoemd.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R1507
  - number: I-R1507.2
    text: |-
      Na de beëindiging van de volledige vervanging, bedoeld in het eerste lid, wordt het salaris van de betrokkene die
      met de vervanging was belast, vastgesteld op het bedrag dat behoort bij de schaal en het salarisnummer die voor hem
      zouden hebben gegolden indien de vervanging niet zou hebben plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R1507
  - number: I-R1508.1
    text: |-
      De omvang van de betrekking van de betrokkene die aan de instelling is of wordt verbonden en die daarnaast
      vervangingswerkzaamheden verricht of gaat verrichten aan die instelling of aan een andere instelling waaraan hij
      uit hoofde van zijn benoeming verbonden kan worden, wordt voor de duur van die vervangingswerkzaamheden tijdelijk
      uitgebreid met ingang van de dag waarop hij feitelijk met de vervanging wordt belast.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R1508
  - number: I-R1508.2
    text: |-
      Indien een betrokkene wordt belast met werkzaamheden van kennelijk tijdelijke aard ten behoeve van derden en voor
      zover hij daarvoor niet een vergoeding ontvangt of verlof krijgt, kan het bevoegd gezag bepalen dat de omvang van
      de betrekking van de betrokkene tijdelijk wordt uitgebreid.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R1508
  - number: I-R1508.3
    text: |-
      De in het eerste en tweede lid bedoelde uitbreiding wordt voor de duur waarvoor zij geldt afzonderlijk in de akte
      van benoeming vermeld. De bezoldiging behorende bij deze uitbreiding wordt berekend op grond van het salaris dat
      voor hem geldt bij de functie waarin hij reeds aan de instelling is benoemd.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R1508
  - number: I-S101.1
    text: 'In dit hoofdstuk wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S101
  - number: I-S101.1.a
    text: |-
      betrokkene: de betrokkene, bedoeld in artikel I-A1, onder e1, e2 en e16, voor zover het betreft het
      onderwijsondersteunend personeel;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S101
  - number: I-S101.1.b
    text: 'instelling: de instelling, genoemd in artikel I-A1, onder d1, d2 en d16;'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S101
  - number: I-S101.1.c
    text: |-
      salaris per uur: 1/166 deel van het salaris bij een normbetrekking; voor de betrokkene genoemd in artikel I-A1,
      *e*4 tot en met *e*6, *e*10, *e* 13 tot en met *e*15, *e*17 en *e*18 is dit 1/165 deel.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S101
  - number: I-S101.2
    text: |-
      Voor zover uit het eerste lid niet anders blijkt, zijn in dit hoofdstuk de begripsbepalingen van artikel I-P1, I-
      P50 en I-P75 van toepassing.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S101
  - number: I-S102.1
    text: |-
      Aan iedere instelling kan onderwijsondersteunend personeel verbonden zijn voor zover dit binnen de door het bevoegd
      gezag vastgestelde formatie mogelijk is.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S102
  - number: I-S102.2
    text: In de paragrafen 2 en 3 en 6 tot en met 16 wordt voor elke normfunctie de bijbehorende maximumschaal aangegeven.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S102
  - number: I-S102.3
    text: |-
      Bij elke maximumschaal behoort een aanloopschaal als aangegeven in onderstaand schema.





                    Aanloopschaal Maximumschaal Aanloopschaal Maximumschaal




                      - 1 8 9




                      - 2 8 10




                    2 3 10 11




                    3 4 11 12




                    4 5 12 13




                    5 6 13 14




                    6 7 14 15




                    7 8 15 16
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S102
  - number: I-S102a.1
    text: |-
      Bij de functie van de betrokkene die is benoemd in het kader van de Regeling extra werkgelegenheid voor langdurig
      werklozen 1995 (*Stcrt.* 1995, 13), behoort maximumschaal 1.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S102a
  - number: I-S102a.2
    text: |-
      In afwijking van artikel I-S102 behoort bij de maximumschaal die geldt voor de betrokkene bedoeld in het eerste
      lid, een aanlooptraject.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S102a
  - number: I-S102a.3
    text: |-
      De functie van de betrokkene bedoeld in het eerste lid, komt bij een benoeming aan een instelling als bedoeld in
      artikel I-P75, onder *a*, uitsluitend ten laste van eigen middelen.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S102a
  - number: I-S103.1
    text: |-
      Bij de benoeming van de betrokkene wordt het salaris na toepassing van de artikelen I-P7 tot en met I-P11
      vastgesteld in de hoogst mogelijke schaal van het carrièrepatroon dat behoort bij zijn functie.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S103
  - number: I-S103.2
    text: |-
      Indien de betrokkene direct voorafgaand aan zijn benoeming een onderwijsfunctie heeft vervuld waarin hij
      laatstelijk reeds voor de duur van een jaar werd bezoldigd naar een bedrag vermeld achter het voorlaatste
      salarisnummer beginnend met de letter U van een van dezelfde schalen 1 tot en met 4 als die waarin het salaris,
      bedoeld in het eerste lid, wordt vastgesteld, wordt die periode van tenminste een jaar in mindering gebracht op de
      periode van twee jaar, bedoeld in artikel I-P13, tweede lid, in die nieuwe functie.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S103
  - number: I-S103.3
    text: |-
      Indien aan de functie waarin betrokkene werkzaam is als gevolg van herwaardering een hogere maximumschaal wordt
      verbonden, wordt het salaris vastgesteld op de in het eerste lid aangegeven wijze.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S103
  - number: I-S103a.1
    text: |-
      Bij de benoeming van de betrokkene bedoeld in artikel I-S102a, eerste lid, zijn de artikelen I-P8 tot en met I-P11
      en artikel I-S103 niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S103a
  - number: I-S103a.2
    text: |-
      Behoudens het derde lid wordt het salaris van de in het eerste lid bedoelde betrokkene bij zijn benoeming
      vastgesteld op het laagste bedrag van het aanlooptraject.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S103a
  - number: I-S103a.3
    text: |-
      In afwijking van het tweede lid wordt het salaris van de in het eerste lid bedoelde betrokkene die de leeftijd van
      23 jaar nog niet heeft bereikt, bij zijn benoeming vastgesteld overeenkomstig het wettelijk minimumjeugdloon dat
      bij zijn leeftijd behoort.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S103a
  - number: I-S104
    text: |-
      Zodra aan de betrokkene, wiens salaris wordt vastgesteld volgens de aanloopschaal, op grond van artikel I-P13
      een periodieke verhoging wordt toegekend en deze daarmee een salaris krijgt dat gelijk is aan of hoger is dan het
      laagste bedrag in de maximumschaal, wordt zijn salaris bepaald op het naasthogere bedrag in de bij zijn functie
      behorende maximumschaal.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S104
  - number: I-S104a
    text: |-
      Indien aan de betrokkene bedoeld in artikel I-S102a, eerste lid, wiens salaris wordt vastgesteld volgens nummer
      2 van het aanlooptraject, op grond van artikel I-P13 een periodieke verhoging wordt toegekend, wordt zijn salaris
      bepaald op het bedrag dat in schaal 1 is vermeld bij salarisnummer 0.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S104a
  - number: I-S105.1
    text: |-
      De functie van de betrokkene wordt vervuld binnen de gebouwen of ruimten waarin de instelling of instellingen zijn
      gehuisvest en op de daarbij behorende terreinen, tenzij de aard van de te verrichten werkzaamheden zich daartegen
      verzet.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S105
  - number: I-S105.2
    text: |-
      Het bevoegd gezag stelt na overleg met de betrokkene zo mogelijk aan het begin van het school-, cursus- dan wel
      kalenderjaar een werktijdenregeling vast. De werktijdenregeling wordt met instemming van de betrokkene vastgesteld
      indien in deze regeling is bepaald dat arbeidsduurverkorting niet in regelmatige terugkerende perioden van een week
      wordt genoten.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S105
  - number: I-S105.3
    text: |-
      Het bevoegd gezag stelt na overleg met de betrokkene de dagelijkse werktijden vast, waarbij doorgaans per dag niet
      meer dan 8 uur wordt gewerkt.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S105
  - number: I-S105.4
    text: |-
      Van de op grond van het tweede en derde lid vastgestelde tijden wordt in opdracht van het bevoegd gezag na overleg
      met de betrokkene incidenteel afgeweken, indien om school-organisatorische redenen de werkzaamheden noodzakelijk op
      andere tijden dan bedoeld in het tweede lid moeten worden verricht.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S105
  - number: I-S106.1
    text: |-
      Aan de betrokkene voor wie het salaris wordt vastgesteld volgens één der schalen 1 tot en met 10 en die in opdracht
      van het bevoegd gezag overwerk verricht, wordt, behoudens het derde lid, een vergoeding toegekend.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S106
  - number: I-S106.2
    text: |-
      Onder overwerk wordt verstaan arbeid verricht buiten de voor de betrokkene vastgestelde dagelijkse werktijd, voor
      zover daardoor deze werktijd wordt overschreden.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S106
  - number: I-S106.3
    text: |-
      Voor overwerk dat gedurende korter dan een half uur aansluitend aan de vastgestelde dagelijkse werktijd wordt
      verricht, wordt geen vergoeding toegekend.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S106
  - number: I-S106.4
    text: 'De vergoeding voor overwerk bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S106
  - number: I-S106.4.a
    text: |-
      voor betrokkene verbonden aan een instelling als bedoeld in artikel I-A1, onder *d*2 en*d*6, *d*12, *d*13 en *d*16
      uit:
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S106
  - number: I-S106.4.a.1
    text: verlof, gelijk aan het aantal uren overschrijding van de voor de betrokkene vastgestelde dagelijkse werktijd, en
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S106
  - number: I-S106.4.a.2
    text: extra verlof, dat voor elk uur een percentage van die overschrijding is.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S106
  - number: I-S106.4.b
    text: |-
      voor betrokkenen verbonden aan een instelling als bedoeld in artikel I-A1, onder *d*1, *d*4, *d*5, *d*10, *d*14,
      *d* 15, *d*17 uit:
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S106
  - number: I-S106.4.b.1
    text: verlof, gelijk aan het aantal uren overschrijding van de voor de betrokkene vastgestelde dagelijkse werktijd, en
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S106
  - number: I-S106.4.b.2
    text: |-
      een bedrag in geld, dat voor elk uur van die overschrijding een percentage van het voor betrokkene geldende salaris
      per uur bedraagt.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S106
  - number: I-S106.5
    text: |-
      De vergoeding in verlof wordt zo spoedig mogelijk toegekend, doch in de regel niet later dan in de kalendermaand
      volgende op die waarin de overschrijding plaats had, waarbij zoveel mogelijk rekening wordt gehouden met de wensen
      van de betrokkene.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S106
  - number: I-S106.6
    text: |-
      Indien naar het oordeel van het bevoegd gezag het dienstbelang zich verzet tegen het toekennen van verlof, bedoeld
      in het vierde lid, onder *b*1 wordt in plaats van dit verlof voor ieder uur een bedrag in geld toegekend gelijk aan
      het voor de betrokkene geldende salaris per uur.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S106
  - number: I-S106.7
    text: 'Het in het vierde lid bedoelde percentage bedraagt:'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S106
  - number: I-S106.7.a
    text: |-
      behoudens het gestelde onder *b* en *c*, het getal, vermeld in de onderstaande tabel:





                        Overwerk verricht Op zondag Op maandag Op dinsdag, woensdag, Op zaterdag




                        donderdag of vrijdag






                        tussen 0 en 6 uur 100 100 50 50




                        tussen 6 en 18 uur 100 25 25 50




                        tussen 18 en 20 uur 100 25 25 75




                        tussen 20 en 24 uur 100 50 50 75
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S106
  - number: I-S106.7.b
    text: |-
      50, indien gedurende langer dan twee uur overwerk is verricht, voor zover het overwerk betreft, dat na de eerste
      twee uur is verricht op maandag, dinsdag, woensdag, donderdag of vrijdag tussen 6 en 20 uur, behoudens het gestelde
      onder *c*;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S106
  - number: I-S106.7.c
    text: |-
      100, indien het overwerk is verricht op een met de zondag gelijkgestelde dag, dan wel op de daarop volgende dag
      tussen 0 en 6 uur.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S106
  - number: I-S106.8
    text: |-
      Voor het vaststellen van de duur van de overschrijding gelden de uren waarop krachtens het vierde lid of krachtens
      hoofdstuk I-C vakantie of verlof is genoten, als uren waarop is gewerkt.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S106
  - number: I-S107.1
    text: |-
      Aan de betrokkene voor wie het salaris wordt vastgesteld volgens een der schalen 1 tot en met 10 en die anders dan
      bedoeld in artikel I-S106 regelmatig of vrij regelmatig arbeid verricht op andere tijden dan op de dagen maandag
      tot en met vrijdag tussen 8 en 18 uur, wordt een toelage toegekend.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S107
  - number: I-S107.2
    text: 'De toelage bedraagt per gewerkt uur een percentage van het voor betrokkene geldende salaris per uur en wel:'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S107
  - number: I-S107.2.a
    text: 20% voor de uren op maandag tot en met vrijdag tussen 6 en 8 uur en tussen 18 en 22 uur;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S107
  - number: I-S107.2.b
    text: 40% voor de uren op maandag tot en met vrijdag tussen 0 en 6 uur en tussen 22 en 24 uur;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S107
  - number: I-S107.2.c
    text: 45% voor de uren op zaterdag;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S107
  - number: I-S107.2.d
    text: 70% voor de uren op zondag;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S107
  - number: I-S107.2.e
    text: |-
      100% voor de uren op feestdagen, met dien verstande dat genoemde percentages worden berekend over ten hoogste het
      salaris behorende bij salarisnummer 10 van schaal 7.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S107
  - number: I-S107.3
    text: |-
      Voor de in het tweede lid onder *a* genoemde uren wordt de toelage slechts toegekend, indien de arbeid is
      aangevangen vóór 7 uur, respectievelijk is beëindigd na 19 uur.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S107
  - number: I-S107.4
    text: |-
      In afwijking van het eerste en tweede lid ontvangt de betrokkene met ingang van de maand waarin hij de leeftijd van
      55 jaar bereikt een vaste toelage, mits hij op dat moment gedurende tenminste 5 jaar zonder wezenlijke onderbreking
      een toelage als bedoeld in het eerste lid heeft genoten.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S107
  - number: I-S107.5
    text: |-
      De toelage bedoeld in het vierde lid wordt vastgesteld op het bedrag dat de betrokkene over de twaalf
      kalendermaanden direct voorafgaande aan de maand waarin hij de leeftijd van 55 jaar bereikt gemiddeld per maand aan
      toelage als bedoeld in het eerste lid heeft genoten en wordt aangepast aan algemene salariswijzigingen.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S107
  - number: I-S107.6
    text: |-
      Voor de toepassing van het vierde lid wordt onder wezenlijke onderbreking verstaan een onderbreking van langer dan
      twee maanden.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S107
  - number: I-S108.1
    text: |-
      Aan de betrokkene wiens bezoldiging, als gevolg van het buiten zijn toedoen, beëindigen of verminderen van een
      toelage als bedoeld in artikel I-S107, een blijvende verlaging ondergaat welke ten minste 3% bedraagt van de
      bezoldiging, wordt een aflopende toelage toegekend, mits hij eerstgenoemde toelage, direct voorafgaande aan het
      tijdstip van vorenbedoelde beëindiging of vermindering ervan, gedurende ten minste twee jaren zonder wezenlijke
      onderbreking heeft genoten.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S108
  - number: I-S108.2
    text: |-
      Voor de toepassing van het eerste lid wordt onder wezenlijke onderbreking verstaan een onderbreking van langer dan
      twee maanden.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S108
  - number: I-S108.3
    text: Onze minister geeft nadere voorschriften voor de toepassing van dit artikel.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S108
  - number: I-S109.1
    text: |-
      Aan de betrokkene, die in een kalenderjaar is benoemd of benoemd is geweest in één of meer functies met één der
      maximumschalen 1 tot en met 8 wordt, met inachtneming van het bepaalde in het derde lid, een eindejaarsuitkering
      toegekend.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S109
  - number: I-S109.2
    text: |-
      Het bedrag per maand van de in het eerste lid bedoelde eindejaarsuitkering bij een normbetrekking wordt,
      onderscheiden naar de maximumschalen 1 tot en met 5 respectievelijk 6 tot en met 8, door Onze minister vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S109
  - number: I-S109.3
    text: |-
      Voor elke kalendermaand van het desbetreffende kalenderjaar waarin de betrokkene in de desbetreffende functies
      werkzaam is geweest en salaris heeft genoten, wordt per functie het bedrag berekend door de toe te passen bedragen
      bij normbetrekking te vermenigvuldigen met het bedrag van het door de betrokkene in die maand genoten salaris en te
      delen door het salaris bij normbetrekking behorende bij de desbetreffende functie.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S109
  - number: I-S109.4
    text: |-
      De uitkering wordt vastgesteld op de som van de volgens het derde lid berekende bedragen en wordt rekenkundig
      afgerond op centen.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S109
  - number: I-S109.5
    text: |-
      De uitkering wordt eenmaal per jaar uitbetaald in de maand december over de periode van twaalf maanden die eindigt
      met de maand december.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S109
  - number: I-S109.6
    text: |-
      In afwijking van het bepaalde in het vijfde lid vindt bij ontslag van de betrokkene de uitbetaling plaats over het
      tijdvak januari tot en met de datum van ontslag van het desbetreffende kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S109
  - number: I-S109.7
    text: |-
      De in het eerste lid bedoelde uitkering wordt niet aangemerkt als bezoldiging en maakt geen deel uit van het
      inkomen, bedoeld in het pensioenreglement.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S109
  - number: I-S110.1
    text: |-
      Voor de betrokkene die aan de instelling waaraan hij is verbonden of aan een andere instelling waaraan hij
      uit hoofde van zijn benoeming verbonden kan worden, die bij wijze van waarneming wordt belast met de volledige
      vervanging van een tijdelijk afwezige functionaris voor wie een hogere maximumschaal geldt en die gedurende meer
      dan 30 aaneengesloten kalenderdagen ander dan wegens vakantieverlof verhinderd is de werkzaamheden voortvloeiende
      uit zijn functie te verrichten, wordt met ingang van de 31e dag van de vervanging en zolang hij met de volledige
      vervanging is belast, een salaris vastgesteld alsof hij in die functie was benoemd.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S110
  - number: I-S110.2
    text: |-
      Na de beëindiging van de volledige vervanging bedoeld in het eerste lid, wordt het salaris van de betrokkene die
      met de vervanging was belast, vastgesteld op het bedrag dat behoort bij het salarisnummer en de schaal die voor hem
      zouden hebben gegolden indien de vervanging niet zou hebben plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S110
  - number: I-S110.3
    text: |-
      Het eerste en de tweede lid zijn niet van toepassing ten aanzien van de betrokkene voor wie de vervanging van de
      afwezige functionaris tot de functie behoort.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S110
  - number: I-S111.1
    text: |-
      Voor de betrokkene, benoemd in een volledige weektaak, die de leeftijd van 60 jaar heeft bereikt, wordt op zijn
      schriftelijk verzoek de dagelijkse werktijd met een half uur verkort, mits hij geen bezoldigde nevenwerkzaamheden
      verricht of gaat verrichten. In dat geval vervalt tevens het recht op een eventuele ontslaguitkering als bedoeld in
      hoofdstuk I-H ter zake van beëindigde nevenwerkzaamheden.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S111
  - number: I-S111.2
    text: |-
      De betrokkene op wie het eerste lid van toepassing is verklaard, alsmede de betrokkene die gebruik maakt van
      hoofdstuk I-V kunnen niet met overwerk als bedoeld in artikel I-S106 worden belast.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S111
  - number: I-S111.3
    text: |-
      Indien de betrokkene, bedoeld in het eerste lid, tevens gebruik maakt van het verlof, bedoeld in hoofdstuk I-V,
      wordt het verlof, bedoeld in het eerste lid, samengevoegd en in gehele of halve werkdagen verleend.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S111
  - number: I-S112
    text: |-
      Degene die werkzaam wordt in meerdere componenten van een horizontale scholengemeenschap als bedoeld in artikel I-
      Q101, eerste lid, onderdeel *c*, sub 2, wordt bij het bevoegd gezag benoemd in de formatie van de component waaraan
      hij het grootste deel van zijn werkzaamheden verricht.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S112
  - number: I-S302
    text: |-
      In het navolgende schema is een aantal normfuncties vermeld die aan de instelling, bedoeld in artikel I-A1, onder
      d1 of d2, kunnen voorkomen met de daarbij behorende maximumschaal.





                  Functie Maximumschaal




                  1a. Administratief medewerker 3




                  1b. Administratief medewerker 4




                  2. Psychologisch assistent 4




                  3. Conciërge 3




                  4. Technisch assistent 5




                  5a. Klassenassistent 3




                  5b. Klassenassistent 4




                  5c. Onderwijsassistent 4




                  6. Instructeur mobiliteit 7




                  7. Speltherapeut/creatieve therapeut 8




                  8. Ergotherapeut 8




                  9. Fysiotherpeut 8




                  10. Logopedist/akoepedist 8




                  11. Maatschappelijk deskundige 8




                  12. Orthopedagoog/psycholoog 11




                  13. Audioloog 11




                  14. Medisch specialist 13




                  15. Technicus 4




         In de bijlage S1 bij dit besluit zijn voor de normfuncties taakkarakteristieken en zonodig benoemingsvereisten
      gegeven.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S302
  - number: I-S303.1
    text: |-
      De betrokkene die in een normbetrekking is benoemd in de functie van klassenassistent, onderwijsassistent of
      technisch assistent is en die het verlof, bedoeld in artikel I-C41, per jaar geniet, wordt gemiddeld voor ten
      hoogste 930 uren per jaar belast met lesgebonden taken. Voor de betrokkene, bedoeld in de eerste volzin, die
      gebruik maakt van het verlof, bedoeld in artikel I-C41, zevende lid, en voor wie een arbeidsduur op jaarbasis
      geldt van 1710 uren respectievelijk 1790 uren wordt in de eerste volzin voor «930 uren» gelezen «961 uren»
      respectievelijk «1010 uren».
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S303
  - number: I-S303.2
    text: |-
      De betrokkene die in een normbetrekking is benoemd in de functie van logopedist en die het verlof, bedoeld in
      artikel I-C41, per jaar geniet, wordt voor gemiddeld ten hoogste 930 uren per jaar belast met behandeltaken. Voor
      de betrokkene, bedoeld in de eerste volzin, die gebruik maakt van het verlof, bedoeld in artikel I-C41, zevende
      lid, en voor wie een arbeidsduur op jaarbasis geldt van 1710 uren respectievelijk 1790 uren wordt in de eerste
      volzin voor «930 uren» gelezen «961 uren» respectievelijk «1010 uren».
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S303
  - number: I-S303.3
    text: |-
      De betrokkene die in een normbetrekking is benoemd in een andere functie dan die genoemd in het eerste en tweede
      lid en voor wie ook sprake is van lesgebonden taken of behandeltaken en die het verlof, bedoeld in artikel I-C41,
      per jaar geniet, wordt gemiddeld voor ten hoogste 930 uren per jaar belast met lesgebonden of behandel taken. Voor
      de betrokkene, bedoeld in de eerste volzin, die gebruik maakt van het verlof, bedoeld in artikel I-C41, zevende
      lid, en voor wie een arbeidsduur op jaarbasis geldt van 1710 uren respectievelijk 1790 uren wordt in de eerste
      volzin voor «930 uren» gelezen «961 uren» respectievelijk «1010 uren».
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S303
  - number: I-S303.4
    text: |-
      Van het eerste lid kan met het oog op de invulling van de algemene arbeidsduur per jaar bedoeld in artikel I-
      P3, tweede en derde lid, in het bijzonder onderwijs worden afgeweken op grond van een overeenkomst bedoeld in de
      [Wet op de collectieve arbeidsovereenkomst][ref1] en in het openbaar onderwijs op grond van een overeenkomst die
      voldoet aan de voorwaarden zoals die zijn gesteld in genoemde wet.


      [ref1]: https://wetten.overheid.nl/BWBR0001937
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S303
    references:
      - id: ref1
        bwb_id: BWBR0001937
  - number: I-S303.5
    text: |-
      Binnen een normbetrekking is 10% van de normbetrekking en indien gebruik wordt gemaakt van artikel I-C41, zevende
      lid, 10% van de arbeidsduur op jaarbasis, bedoeld in artikel I-P3, tweede of derde lid, bestemd voor activiteiten
      in het kader van de deskundigheidsbevordering. De besteding van het in de eerste volzin bedoelde deel van de
      normbetrekking respectievelijk de arbeidsduur op jaarbasis wordt door betrokkene bepaald, met dien verstande dat
      het bevoegd gezag in individuele gevallen en schriftelijk gemotiveerd daarvan kan afwijken.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S303
  - number: I-S303.6
    text: |-
      Na verkregen instemming van het decentraal georganiseerd overleg kan aan instellingen waarvoor op jaarbasis een
      onderwijstijd geldt van meer dan 1010 doch ten hoogste 1040 uur betrokkene voor maximaal die aan de instelling
      geldende onderwijstijd worden belast met het geven van onderwijs.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S303
  - number: I-S303.7
    text: |-
      Voor de betrokkene die is benoemd in een betrekking met een omvang van minder dan een normbetrekking wordt het
      maximum aantal uren, bedoeld in het eerste lid, en de deskundigheidsbevordering, bedoeld in het tweede lid, naar
      evenredigheid van de werktijdfactor berekend en rekenkundig afgerond op gehele uren.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S303
  - number: I-S303.8
    text: |-
      In individuele gevallen kunnen door het bevoegd gezag en betrokkene van het percentage genoemd in het vijfde lid
      afwijkende afspraken worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S303
  - number: I-S304.1
    text: |-
      De omvang van de betrekking van de betrokkene die aan de instelling is of wordt verbonden en die daarnaast
      vervangingswerkzaamheden verricht of gaat verrichten aan die instelling of aan een andere instelling waaraan hij
      uit hoofde van zijn benoeming verbonden kan worden, dan wel die daarnaast werkzaamheden verricht dan wel gaat
      verrichten waarvoor hem een gedeelte van een normbetrekking is of wordt toebedeeld die op grond van artikel I-
      P80 van rechtswege vervalt, wordt voor de duur en de omvang van die werkzaamheden tijdelijk uitgebreid met
      overeenkomstige toepassing van het bepaalde in artikel I-P22.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S304
  - number: I-S304.2
    text: |-
      De omvang van de tijdelijke uitbreiding van de betrekking bedoeld in het eerste lid, wordt voor de duur waarvoor
      dit geschiedt afzonderlijk in de akte van benoeming vermeld.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S304
  - number: I-S304.3
    text: |-
      Indien de betrekkingsomvang van een betrokkene die uitsluitend is benoemd voor het verrichten van
      vervangingswerkzaamheden, tijdelijk is uitgebreid op grond van het eerste lid, wordt die tijdelijke uitbreiding bij
      beëindiging van eerstbedoelde vervangingswerkzaamheden omgezet in een benoeming.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S304
  - number: I-S601
    text: 'In deze paragraaf wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S601
  - number: I-S601.a
    text: 'instelling: een instelling als bedoeld in artikel I-A1, onder *d*4;'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S601
  - number: I-S601.b
    text: |-
      betrokkene: de betrokkene, bedoeld in artikel I-A1, onder *e*4, voor zover het betreft het ondersteunend en
      beheerspersoneel.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S601
  - number: I-S602
    text: |-
      Het bevoegd gezag stelt met inachtneming van het bepaalde in artikel I-S605, het beleid met betrekking tot de
      formatie van het ondersteunend en beheerspersoneel vast.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S602
  - number: I-S603
    text: |-
      In het georganiseerd overleg op instellingsniveau als bedoeld in hoofdstuk IV-E kan worden overeengekomen af te
      wijken van het bepaalde in artikel I-P3, tweede lid, onder *a*, mits daarbij de taakomvang op jaarbasis ongewijzigd
      blijft.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S603
  - number: I-S604
    text: |-
      Het bevoegd gezag stelt een regeling op met betrekking tot de werktijd alsmede met betrekking tot de autorisatie en
      registratie van afwezigheid.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S604
  - number: I-S605.1
    text: |-
      Onverminderd het bepaalde in het tweede lid stelt Onze minister voor de normfuncties taakkarakteristieken of
      functiebeschrijvingen en maximumschalen vast.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S605
  - number: I-S605.2
    text: |-
      Binnen de formatie die is vastgesteld met inachtneming van artikel I-S602 kunnen betrokkenen worden benoemd in
      normfuncties als is aangegeven in onderstaand schema. De daarbij vermelde maximumschalen zijn van toepassing indien
      het aantal leerovereenkomsten 12 000 of meer bedraagt. Bij een kleinere instelling stelt het bevoegd gezag de
      maximumschaal vast, rekening houdend met de voor het Rijkspersoneel ter zake geldende normen en in samenhang met
      de formatie.





                    Functie Maximumschaal




                    hoofd administratie 12




                    hoofd afdeling financiële zaken 12




                    hoofd afdeling personeelszaken 11




           In de bijlage S4 bij dit besluit, zijn voor de normfuncties, vermeld in bovenstaand schema,
      functiebeschrijvingen gegeven.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S605
  - number: I-S605.3
    text: |-
      Voor de vaststelling van het aantal leerovereenkomsten is artikel I-Q604, tweede lid van overeenkomstige
      toepassing.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S605
  - number: I-S606.1
    text: Artikel I-S104 is niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S606
  - number: I-S606.2
    text: |-
      Zodra aan de betrokkene op grond van artikel I-P13 een periodieke verhoging wordt toegekend en zijn salaris ten
      minste gelijk is aan het laagste bedrag in de bij zijn functie behorende maximumschaal, wordt, tenzij naar het
      oordeel van het bevoegd gezag zijn wijze van functioneren zich daar nog tegen verzet, zijn salaris bepaald op het
      naasthogere bedrag in de bij zijn functie behorende maximumschaal.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S606
  - number: I-S606.3
    text: |-
      Zo nodig wordt het bedrag in de maximumschaal dat is vastgesteld op grond van het tweede lid, verhoogd tot een
      bedrag in de maximumschaal om te bereiken dat het salaris in de maximumschaal te allen tijde uitgaat boven het
      salaris dat voor de betrokkene in de aanloopschaal zou hebben gegolden.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S606
  - number: I-S606.4
    text: |-
      Het bevoegd gezag kan regels opstellen ten aanzien van het carrièrepatroon en het doorlopen daarvan die in voor de
      betrokkene gunstige zin afwijken van het tweede en derde lid.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S606
  - number: I-S607
    text: |-
      Het bevoegd gezag kan regels opstellen ten aanzien van de criteria waaraan de betrokkene moet hebben voldaan
      alvorens te kunnen worden bezoldigd volgens de bij zijn functie behorende maximumschaal.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S607
  - number: I-S608
    text: Het bepaalde in artikel I-P53, eerste en derde lid, is niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S608
  - number: I-S609
    text: Het bepaalde in artikel I-S110, derde lid, is niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S609
  - number: I-S610.1
    text: |-
      De omvang van de betrekking van de betrokkene die aan de instelling is of wordt verbonden en die daarnaast
      vervangingswerkzaamheden verricht of gaat verrichten aan die instelling of aan een andere instelling waaraan hij
      uit hoofde van zijn benoeming verbonden kan worden, wordt voor de duur van die vervangingswerkzaamheden tijdelijk
      uitgebreid met ingang van de dag waarop hij feitelijk met de vervanging wordt belast.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S610
  - number: I-S610.2
    text: |-
      Indien een betrokkene wordt belast met werkzaamheden van kennelijk tijdelijke aard ten behoeve van derden en voor
      zover hij daarvoor niet een vergoeding ontvangt of verlof krijgt, kan het bevoegd gezag bepalen dat de omvang van
      de betrekking van de betrokkene tijdelijk wordt uitgebreid.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S610
  - number: I-S610.3
    text: |-
      De in het eerste en tweede lid bedoelde uitbreiding wordt voor de duur waarvoor zij geldt afzonderlijk in de akte
      van benoeming vermeld. De bezoldiging behorende bij deze uitbreiding wordt berekend op grond van het salaris dat
      voor hem geldt bij de functie waarin hij reeds aan de instelling is benoemd.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S610
  - number: I-S611
    text: |-
      In afwijking van artikel I-P13, eerste lid, wordt ten aanzien van de betrokkenen in deze paragraaf voor "1
      augustus" gelezen: 1 januari.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S611
  - number: I-S701
    text: 'In deze paragraaf wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S701
  - number: I-S701.a
    text: '"instelling": een instelling als bedoeld in artikel I-A1, onder *d*5;'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S701
  - number: I-S701.b
    text: '"betrokkene": degene die bij een instelling is benoemd in een functie als bedoeld in artikel I-S705.'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S701
  - number: I-S702
    text: |-
      Het bevoegd gezag stelt met inachtneming van het bepaalde in artikel I-S703, het beleid met betrekking tot de
      formatie van het ondersteunend en beheerspersoneel vast.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S702
  - number: I-S703
    text: |-
      In het georganiseerd overleg op instellingsniveau als bedoeld in hoofdstuk IV-E kan worden overeengekomen af te
      wijken van het bepaalde in artikel I-P3, derde lid, mits daarbij de taakomvang op jaarbasis ongewijzigd blijft.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S703
  - number: I-S704
    text: |-
      Het bevoegd gezag stelt een regeling op met betrekking tot de werktijd alsmede met betrekking tot de autorisatie en
      registratie van afwezigheid.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S704
  - number: I-S705
    text: |-
      Binnen de formatie die is vastgesteld met inachtneming van artikel I-S702 kunnen betrokkenen worden benoemd in een
      normfunctie als is aangegeven in onderstaand schema. De daarbij vermelde maximumschaal is van toepassing indien de
      aanspraak op vergoeding uit ’s Rijks kas van personele en exploitatiekosten gezamenlijk gelijk is aan of meer is
      dan f 1 500 000. Bij een kleinere instelling stelt het bevoegd gezag de maximumschaal vast, rekening houdend met de
      voor het Rijkspersoneel terzake geldende normen en in samenhang met de formatie.





                  Functie Maximumschaal




                  hoofd administratie 8




         In de bijlage S5 is voor de normfunctie, vermeld in bovenstaand schema, een taakkarakteristiek gegeven.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S705
  - number: I-S706.1
    text: Artikel I-S104 is niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S706
  - number: I-S706.2
    text: |-
      Zodra aan de betrokkene op grond van artikel I-P13 een periodieke verhoging wordt toegekend en zijn salaris ten
      minste gelijk is aan het laagste bedrag in de bij zijn functie behorende maximumschaal, wordt, tenzij naar het
      oordeel van het bevoegd gezag zijn wijze van functioneren zich daar nog tegen verzet, zijn salaris bepaald op het
      naasthogere bedrag in de bij zijn functie behorende maximumschaal.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S706
  - number: I-S706.3
    text: |-
      Zo nodig wordt het bedrag in de maximumschaal dat is vastgesteld op grond van het tweede lid, verhoogd tot een
      bedrag in de maximumschaal om te bereiken dat het salaris in de maximumschaal te allen tijde uitgaat boven het
      salaris dat voor de betrokkene in de aanloopschaal zou hebben gegolden.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S706
  - number: I-S706.4
    text: |-
      Het bevoegd gezag kan regels opstellen ten aanzien van het carrièrepatroon en het doorlopen daarvan die in voor de
      betrokkene gunstige zin afwijken van het tweede en derde lid.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S706
  - number: I-S707
    text: |-
      Het bevoegd gezag kan regels opstellen ten aanzien van de criteria waaraan de betrokkene moet hebben voldaan
      alvorens te kunnen worden bezoldigd volgens de bij zijn functie behorende maximumschaal.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S707
  - number: I-S708
    text: Het bepaalde in artikel I-P53, eerste en derde lid, is niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S708
  - number: I-S709
    text: Het bepaalde in artikel I-S110, derde lid, is niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S709
  - number: I-S710.1
    text: |-
      De omvang van de betrekking van de betrokkene die reeds aan de instelling is verbonden en die
      vervangingswerkzaamheden verricht aan die instelling of aan een andere instelling waaraan hij uit hoofde van zijn
      benoeming verbonden kan worden, wordt voor de duur van die vervangingswerkzaamheden tijdelijk uitgebreid met ingang
      van de dag waarop hij feitelijk met de vervanging wordt belast.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S710
  - number: I-S710.2
    text: |-
      Indien een betrokkene wordt belast met werkzaamheden van kennelijk tijdelijke aard ten behoeve van derden en voor
      zover hij daarvoor niet een vergoeding ontvangt of verlof krijgt, kan het bevoegd gezag bepalen dat de omvang van
      de betrekking van de betrokkene tijdelijk wordt uitgebreid.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S710
  - number: I-S710.3
    text: |-
      De in het eerste en tweede lid bedoelde uitbreiding wordt voor de duur waarvoor zij geldt afzonderlijk in de akte
      van benoeming vermeld. De bezoldiging behorende bij deze uitbreiding wordt berekend op grond van het salaris dat
      voor hem geldt bij de functie waarin hij reeds aan de instelling is benoemd.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S710
  - number: I-S801.a
    text: '"instelling": de instelling, bedoeld in artikel I-A1, onder *d*10;'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S801
  - number: I-S801.b
    text: '"betrokkene": de betrokkene, bedoeld in artikel I-A1, onder *e*10,'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S801
  - number: I-S802
    text: |-
      Het bevoegd gezag stelt met inachtneming van het bepaalde in artikel I-S805, het beleid met betrekking tot de
      formatie van het ondersteunend en beheerspersoneel vast.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S802
  - number: I-S803
    text: |-
      In het georganiseerd overleg op instellingsniveau als bedoeld in hoofdstuk IV-E kan worden overeengekomen af te
      wijken van het bepaalde in artikel I-P3, tweede lid, onder *a*, mits daarbij de taakomvang op jaarbasis ongewijzigd
      blijft.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S803
  - number: I-S804
    text: |-
      Het bevoegd gezag stelt een regeling op met betrekking tot de werktijd alsmede met betrekking tot de autorisatie en
      registratie van afwezigheid.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S804
  - number: I-S805.1
    text: |-
      Onverminderd het bepaalde in het tweede lid stelt Onze minister voor de normfuncties taakkarakteristieken of
      functiebeschrijvingen en maximumschalen vast.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S805
  - number: I-S805.2
    text: |-
      Binnen de formatie die is vastgesteld met inachtneming van artikel I-S802 kunnen betrokkenen worden benoemd in
      functies met een maximumschaal als is aangegeven in onderstaand schema.





                    Functie Maximumschaal




                    1. Hoofd algemene zaken 9, 10 of 11




                    2. Hoofd bedrijven 10 of 11




                    3. Hoofd interne dienst 7




                    4. Beheerder logeergebouw 8 of 9
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S805
  - number: I-S805.3
    text: |-
      In de bijlage S6 bij dit besluit zijn voor de normfuncties, vermeld in bovenstaand schema, functiebeschrijvingen
      gegeven. Indien bij een functie meer dan een schaal is vermeld, is de maximumschaal afhankelijk van de
      functieinhoud of de omvang van de instelling, als is aangegeven in de bijlage S6 bij dit besluit.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S805
  - number: I-S806.1
    text: Artikel I-S104 is niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S806
  - number: I-S806.2
    text: |-
      Zodra aan de betrokkene op grond van artikel I-P13 een periodieke verhoging wordt toegekend en zijn salaris ten
      minste gelijk is aan het laagste bedrag in de bij zijn functie behorende maximumschaal, wordt, tenzij naar het
      oordeel van het bevoegd gezag zijn wijze van functioneren zich daar nog tegen verzet, zijn salaris bepaald op het
      naasthogere bedrag in de bij zijn functie behorende maximumschaal.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S806
  - number: I-S806.3
    text: |-
      Zo nodig wordt het bedrag in de maximumschaal dat is vastgesteld op grond van het tweede lid, verhoogd tot een
      bedrag in de maximumschaal om te bereiken dat het salaris in de maximumschaal te allen tijde uitgaat boven het
      salaris dat voor de betrokkene in de aanloopschaal zou hebben gegolden.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S806
  - number: I-S806.4
    text: |-
      Het bevoegd gezag kan regels opstellen ten aanzien van het carrièrepatroon en het doorlopen daarvan die in voor de
      betrokkene gunstige zin afwijken van het tweede en derde lid.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S806
  - number: I-S807
    text: |-
      Het bevoegd gezag kan regels opstellen ten aanzien van criteria waaraan de betrokkene moet hebben voldaan alvorens
      te kunnen worden bezoldigd volgens de bij zijn functie behorende maximumschaal.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S807
  - number: I-S808
    text: Het bepaalde in artikel I-P53, eerste en derde lid, is niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S808
  - number: I-S809
    text: |-
      Het is het bevoegd gezag niet toegestaan de betrokkene extra beloning toe te kennen in de vorm van periodieke
      verhoging, bedoeld in artikel I-P53, in de vorm van buitengewone toelage, bedoeld in artikel I-P55, in de vorm
      van gratificatie, bedoeld in artikel I-P56, dan wel in de vorm van uitkering of toelage om redenen van werving en
      behoud als bedoeld in de artikelen I-P57 en I-P58, in situaties waarin tevens sprake is van gedwongen ontslag van
      een of meer personeelsleden.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S809
  - number: I-S810
    text: Het bepaalde in artikel I-S110, derde lid, is niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S810
