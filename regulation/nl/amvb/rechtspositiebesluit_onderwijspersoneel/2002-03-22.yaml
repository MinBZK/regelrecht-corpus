  - number: I-Q602.1
    text: Het bevoegd gezag benoemt in de directie ten hoogste vijf leden op maximaal drie formatieplaatsen.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q602
  - number: I-Q602.2
    text: |-
      In de bijlage Q5 bij dit besluit is voor de normfuncties directeur en adjunct-directeur een taakkarakteristiek
      gegeven.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q602
  - number: I-Q602.3
    text: |-
      In het georganiseerd overleg op instellingsniveau als bedoeld in hoofdstuk IV-E kan worden overeengekomen af te
      wijken van het bepaalde in artikel I-P3, tweede lid, mits daarbij de taakomvang op jaarbasis ongewijzigd blijft.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q602
  - number: I-Q603
    text: |-
      Het bevoegd gezag stelt een regeling op met betrekking tot de werktijd alsmede met betrekking tot de autorisatie en
      registratie van afwezigheid.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q603
  - number: I-Q604.1
    text: Voor de normfuncties van de directie gelden de maximumschalen als aangegeven in onderstaand schema.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q604
  - number: I-Q604.2
    text: |-
      Het aantal leerovereenkomsten wordt bepaald op dezelfde wijze als deze in aanmerking worden genomen voor de
      bekostiging in artikel I-H4.2 onder *a* van het Uitvoeringsbesluit WCBO.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q604
  - number: I-Q605
    text: |-
      Het bevoegd gezag kan regels opstellen ten aanzien van criteria waaraan de betrokkene moet hebben voldaan alvorens
      te kunnen worden bezoldigd volgens de bij zijn functie behorende maximumschaal.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q605
  - number: I-Q606
    text: Het bepaalde in artikel I-P53, eerste en derde lid, is niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q606
