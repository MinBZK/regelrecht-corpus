  - number: V-S101.1
    text: |-
      De betrokkene die op 30 april 1987 en op 1 mei 1987 aan een instelling is verbonden en die op grond van
      overgangsrecht zoals dat op grond van hoofdstuk V-T op 30 april 1987 luidde uitzicht had op een salarisbedrag dat
      hoger is dan het hoogste bedrag in de bij zijn functie behorende maximumschaal, behoudt dat uitzicht zolang hij in
      dezelfde functie aan dezelfde instelling verbonden blijft.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-S101
  - number: V-S101.2
    text: |-
      Zolang het salaris van de betrokkene, bedoeld in het eerste lid, nog niet is vastgesteld op het hoogste bedrag in
      de bij zijn functie behorende maximumschaal wordt hem jaarlijks met toepassing van artikel I-P13 een periodieke
      verhoging toegekend. Indien hij het bij zijn functie behorende maximumsalaris gedurende twaalf maanden heeft
      genoten, wordt hem vervolgens jaarlijks op de voet van artikel I-P13 een periodieke verhoging toegekend. Deze
      jaarlijkse periodieke verhoging wordt hem toegekend in de laagste schaal waarin het naasthogere bedrag voorkomt,
      tot het moment waarop het salarisniveau is bereikt dat gelijk is aan het voor hem vastgestelde uitzicht, bedoeld in
      het eerste lid.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-S101
  - number: V-S102
    text: |-
      Voor de toepassing van artikel I-S107, vierde lid, wordt voor de betrokkene die op de datum van inwerkingtreding
      van dit besluit de leeftijd van 55 jaar reeds heeft bereikt, de in genoemd artikellid bedoelde toelage vastgesteld
      op het bedrag dat de betrokkene over de twaalf kalendermaanden direct voorafgaande aan de dag voor inwerkingtreding
      van dit besluit gemiddeld per maand heeft genoten aan toelagen als bedoeld in artikel I-S107, eerste lid, of
      artikel I-S108 zoals dat luidde op de dag voor de inwerkingtreding van dit besluit, welk bedrag wordt aangepast aan
      algemene salariswijzigingen.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-S102
  - number: V-S103.1
    text: |-
      De betrokkene, bedoeld in I-A1, onder e1, e2, en e16, die op 31 december 1999 was benoemd in een functie als
      bedoeld in hoofdstuk I-S en die op 1 januari 2000 in diezelfde functie blijft benoemd, heeft met ingang van 1
      januari 2000 aanspraak op een salaris bij het op hem van toepassing zijnde salarisnummer als bedoeld in bijlage S13
      indien hij op 31 december 1999 voldeed aan een van de volgende voorwaarden:
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-S103
  - number: V-S103.1.a
    text: |-
      hij werd voor het tweede, derde of vierde achtereenvolgende jaar bezoldigd naar het bij zijn functie behorende
      maximumsalaris in schaal 1, 2, 3, 4 of 5, of
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-S103
  - number: V-S103.1.b
    text: hij werd bezoldigd naar een bedrag vermeld achter een salarisnummer beginnend met de letter U.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-S103
  - number: V-S103.2
    text: |-
      Van de betrokkene, bedoeld in artikel I-A1, onder e1, e2 en e16, die op 31 december 1999 was benoemd in een functie
      als bedoeld in hoofdstuk I-S en die op 1 januari 2000 wordt benoemd in een functie als bedoeld in hoofdstuk I-S of
      een functie als bedoeld in hoofdstuk I-Q of I-R, wordt ten behoeve van de vaststelling van het salaris in de nieuwe
      functie het in die vorige onderwijsfunctie genoten salaris vastgesteld zoals het zou zijn vastgesteld op grond van
      het eerste lid, indien op 31 december 1999 is voldaan aan een van de voorwaarden, bedoeld in het eerste lid, onder
      a en b. De eerste volzin is niet van toepassing op de betrokkene die wordt benoemd in een functie als bedoeld in
      artikel I-P9, tweede lid.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-S103
  - number: V-S201.1
    text: |-
      De belanghebbende voor wie met toepassing van artikel II van het besluit van 30 november 1993 (*Stb.* 1993, 696)
      een uitzicht is vastgesteld, behoudt aanspraak op vaststelling van zijn salaris overeenkomstig dat uitzicht zolang
      hij in dezelfde functie aan dezelfde instelling verbonden blijft.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-S201
  - number: V-S201.2
    text: |-
      Zolang het salaris van de belanghebbende bedoeld in het eerste lid nog niet is vastgesteld op het hoogste bedrag
      in de bij zijn functie behorende maximumschaal wordt hem jaarlijks met toepassing van artikel I-P13 een periodieke
      verhoging toegekend. Indien hij het bij zijn functie behorende maximumsalaris gedurende twaalf maanden heeft
      genoten, wordt hem vervolgens jaarlijks op de voet van artikel I-P13 een periodieke verhoging toegekend. Deze
      jaarlijkse periodieke verhoging wordt hem toegekend in de laagste schaal waarin het naasthogere bedrag voorkomt,
      tot het moment waarop het salarisniveau is bereikt dat gelijk is aan het voor hem vastgestelde uitzicht.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-S201
  - number: V-S301.1
    text: |-
