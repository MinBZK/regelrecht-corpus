    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-S701
  - number: V-S702.1
    text: |-
      Op de betrokkene, bedoeld in artikel I-A1, onder *e*5, bij wiens functie op 1 augustus 1994 een lagere
      maximumschaal behoort dan bij de functie volgens hoofdstuk I-Q, hoofdstuk I-R dan wel hoofdstuk I-S, zoals die
      hoofdstukken op 31 juli 1994 luidden, die hij op die datum vervulde, behoudt aanspraak op bezoldiging volgens
      het carrièrepatroon dat behoorde bij de functie die hij op 31 juli 1994 bekleedde, zolang hij als zodanig aan de
      instelling verbonden blijft, onverminderd het bepaalde in artikel V-S703.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-S702
  - number: V-S702.2
    text: |-
      Op de betrokkene, bedoeld in artikel I-A1, onder *e*5, bij wiens functie op 1 augustus 1994 een lagere
      maximumschaal behoort dan bij de functie die hij op 31 juli 1994, volgens hoofdstuk I-R zoals dat op die datum
      luidde, vervulde, is artikel V-R703 van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-S702
  - number: V-S703
    text: |-
      Op de betrokkene bedoeld in artikel I-A1, onder *e*5, voor wie tot en met 31 juli 1994 op grond van artikel IV,
      onderdeel 3, onder *a*, sub 1, van het besluit van 3 juli 1992 (*Stb* 1992, 389) (Formatiebudgetsysteem) een
      of meer van de artikelen V-Q701, V-Q702, V-Q703, V-R702, eerste en tweede lid, en V-R703, van toepassing zijn
      gebleven, zijn de artikelen V-Q701, V-Q702, V-Q703, V-R701, V-R702, en V-R703 van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-S703
  - number: V-S901
    text: Het bepaalde in artikel V-S101 is niet van toepassing op de betrokkene bedoeld in artikel I-S901, onder *b*.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-S901
  - number: V-S902
    text: |-
      De betrokkene behorend tot het onderwijsondersteunend personeel op wie het bepaalde in de Overgangsregeling
      basiseducatie, met uitzondering van artikel A2 van dat besluit, van toepassing is, behoudt bij een instelling als
      bedoeld in artikel I-A1 onder *d*6, waaraan hij op de dag van overgang daarnaartoe wordt verbonden als lid van
      het onderwijsondersteunend personeel, uitzicht op vaststelling van zijn salaris volgens het bedrag bij het hoogste
      salarisnummer van de schaal waarin hij is ingepast op de dag waarop de overgang naar die instelling plaatsvindt.
      Indien de schaal bedoeld in de vorige volzin een lager nummer heeft dan de hoogste aanloopschaal, die behoorde bij
      de functie die de betrokkene vervulde op de dag voorafgaande aan de overgang naar de instelling, bedoeld in artikel
      I-A1 onder *d*6, behoudt hij, in afwijking van het bepaalde in de vorige volzin, uitzicht op vaststelling van zijn
      salaris volgens het bedrag bij het hoogste salarisnummer van die hoogste aanloopschaal.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-S902
  - number: V-S904
    text: |-
      Ten aanzien van de betrokkene voor wie de Overgangsregeling gewijzigde ondersteuningsstructuur VE van toepassing
      is, is het bepaalde in artikel V-Q1104 van overeenkomstige toepassing, zolang hij zonder onderbreking van meer
      dan twee maanden verbonden blijft aan een instelling als bedoeld in artikel A1, tweede lid, onder *b*, van de
      Overgangsregeling gewijzigde ondersteuningsstructuur VE, voor zover het betreft een instelling, bedoeld in artikel
      I-A1, onder *d*6.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-S904
  - number: V-S1001
    text: |-
      In deze paragraaf wordt verstaan onder: Betrokkene: degene, die op 31 december 1988 in dienst is van een instelling
      bedoeld in artikel 8 van de Wet op de onderwijsverzorging als lid van het inhoudelijk dan wel ondersteunend
      personeel.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-S1001
  - number: V-S1002.1
    text: |-
      De betrokkene die per 1 januari 1989 door het bevoegd gezag een functie toegedeeld heeft gekregen waarbij een
      maximumschaal behoort waarvan het hoogste salaris lager is dan het hoogste salaris van de schaal die voor de
      betrokkene gold op 31 december 1988, behoudt vanaf 1 januari 1989 aanspraak op bezoldiging volgens die schaal,
      die voor hem ingevolge artikel C1 of C2 van de Invoeringsregeling WOV-personeel is vastgesteld, onverminderd het
      bepaalde in het tweede en derde lid.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-S1002
  - number: V-S1002.2
    text: |-
      De betrokkene, die per 1 januari 1989 door het bevoegd gezag een functie toegedeeld heeft gekregen en voor wie
      vanaf 1 januari 1989 ingevolge artikel C2, derde lid, van de Invoeringsregeling WOV-personeel een salarisschaal is
      gaan gelden waarvan het hoogste salaris hoger is dan het hoogste salaris bij de functie per 1 januari 1989, behoudt
      aanspraak op een salarisbedrag dat gelijk is aan het hoogste salaris van de voor hem op 31 december 1988 geldende
      schaal, onverminderd het bepaalde in het derde lid.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-S1002
  - number: V-S1002.3
    text: |-
      Het salarisuitzicht bedoeld in het eerste en tweede lid blijft tot 1 januari 2004 behouden zolang de betrokkene
      zonder wezenlijke onderbreking aan een instelling benoemd blijft in een functie met een maximumschaal die ten
      minste gelijk is aan de maximumschaal welke geldt voor de functie waarin hij op 1 januari 1989 werd benoemd.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-S1002
  - number: V-S1002.4
    text: |-
      Met een wezenlijke onderbreking als aangegeven in het eerste lid, wordt een periode van langer dan twee maanden
      bedoeld. De tijd gedurende welke een ontslaguitkering als bedoeld in hoofdstuk I-H dan wel een uitkering als
      bedoeld in het [Besluit Werkloosheid onderwijs- en onderzoekpersoneel][ref1] wordt genoten, wordt niet als
      onderbreking aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0006445
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-S1002
    references:
      - id: ref1
        bwb_id: BWBR0006445
  - number: V-S1002.5
    text: |-
      Wat betreft het carrièrepatroon van de betrokkene, bedoeld in het eerste lid, is het bepaalde in artikel V-P1,
      tweede lid, van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-S1002
  - number: V-S1003.1
    text: |-
      De betrokkene voor wie vóór 1 januari 1989 met goedkeuring van Onze minister het behoud van een bepaalde
      salarisschaal dan wel een bepaald salarisuitzicht gold, behoudt die salarisschaal dan wel dat salarisuitzicht
      zolang hij aan dezelfde instelling verbonden blijft in dezelfde functie dan wel in de functie, die hem per 1
      januari 1989 door het bevoegd gezag is toegedeeld.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-S1003
  - number: V-S1003.2
    text: |-
      De betrokkene aan wie vóór 1 januari 1989 in overeenstemming met de door Onze minister tot stand gebrachte
      regelingen aantoonbaar het behoud van een bepaalde salarisschaal dan wel van een bepaald salarisuitzicht is
      toegezegd in een bepaalde functie behoudt die salarisschaal dan wel dat salarisuitzicht zolang hij aan dezelfde
      instelling verbonden blijft in dezelfde functie dan wel in de functie, die hem per 1 januari 1989 door het bevoegd
      gezag is toegedeeld.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-S1003
  - number: V-S1004.1
    text: |-
      De onderwijskundig medewerker B of de onderwijskundig medewerker A bij een landelijk pedagogisch centrum die sedert
      31 juli 1981 als pedagogisch-didactisch medewerker aanspraak had op een salaris dat hoger is dan het maximumsalaris
      van schaal 12 behoudt vanaf 1 januari 1989 aanspraak op een salaris volgens onderstaand schema zolang hij zonder
      wezenlijke onderbreking bij dezelfde instelling in dienst blijft als onderwijskundig medewerker B of A dan wel in
      de functie, die hem per 1 januari 1989 door het bevoegd gezag is toegedeeld.





                    salaris sedert 31 juli 1981 volgens de bij de schaal vermelde leeftijd in jaren salaris vanaf 1
      januari 1989




                    in schaal 13 bij




                    salarisnummer




                    IA IB A B C




                    39 42 38 41 42 5




                    40 43 39 42 43 6




                    41 44 40 43 44 7




                    42 - 41 - - 7
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-S1004
  - number: V-S1004.2
    text: |-
      Onverminderd het bepaalde in het eerste lid, behoudt de onderwijskundig medewerker B wiens salaris op 31 december
      1988 werd vastgesteld volgens een der schalen IA, IB, A, B of C voor pedagogisch-didactisch medewerkers vanaf 1
      januari 1989 aanspraak op bezoldiging volgens schaal 12 zolang hij zonder wezenlijke onderbreking bij dezelfde
      instelling in dienst blijft als onderwijskundig medewerker B dan wel in de functie, die hem per 1 januari 1989 door
      het bevoegd gezag is toegedeeld.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-S1004
  - number: V-S1004.3
    text: |-
      Met een wezenlijke onderbreking als aangegeven in het eerste en tweede lid wordt een periode van langer dan twee
      maanden bedoeld. De tijd gedurende welke een ontslaguitkering als bedoeld in hoofdstuk I-H dan wel een uitkering
      als bedoeld in het [Besluit Werkloosheid onderwijs- en onderzoekpersoneel][ref1] wordt genoten, wordt niet als
      onderbreking aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0006445
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-S1004
    references:
      - id: ref1
        bwb_id: BWBR0006445
  - number: V-S1101.1
    text: |-
      De betrokkene op wie het bepaalde in de Overgangsregeling ondersteuning VE, met uitzondering van artikel A2 van dat
      besluit, van toepassing is, behoudt bij een instelling als bedoeld in artikel I-A1, onder *d*13, waaraan hij op de
      dag van de overgang, bedoeld in artikel A1, tweede lid, van de Overgangsregeling ondersteuning VE wordt verbonden
      als lid van het inhoudelijk dan wel van het ondersteunend personeel uitzicht op de vaststelling van zijn salaris
      volgens het bedrag bij het hoogste salarisnummer van de schaal waarop hij is ingepast op de dag waarop de overgang
      naar die instelling plaatsvindt. Indien de schaal, bedoeld in de vorige volzin, een lager nummer heeft dan de
      hoogste aanloopschaal die behoorde bij de functie die de betrokkene vervulde op de dag voorafgaande aan de overgang
      naar die instelling bedoeld in artikel I-A1, onder *d*13, behoudt hij, in afwijking van het bepaalde in de vorige
      volzin, uitzicht op de vaststelling zijn salaris volgens het bedrag bij het hoogste salarisnummer van die hoogste
      aanloopschaal.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-S1101
  - number: V-S1101.2
    text: |-
      Het bepaalde in het eerste lid is van overeenkomstige toepassing ten aanzien van de betrokkene die op 1 april 1989
      als lid van het inhoudelijk dan wel van het ondersteunend personeel wordt verbonden aan de landelijke instelling
      het "Centrum voor de Innovatie van Beroepsonderwijs" en op wie de [Overgangsregeling CIBB][ref1], met uitzondering
      van artikel 2 van die regeling, van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0004686
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-S1101
    references:
      - id: ref1
        bwb_id: BWBR0004686
  - number: V-S1102.1
    text: |-
      De betrokkene voor wie een uitzicht is vastgesteld met toepassing van een der artikelen V-R402 dan wel V-R701 en
      die met ingang van de dag waarop zijn overgang als bedoeld in artikel A1, tweede lid, van de Overgangsregeling
      ondersteuning VE heeft plaatsgevonden, vanuit de door hem beklede functie van leraar of vormingswerker is benoemd
      aan een instelling als bedoeld in artikel I-A1, onder *d*13, in een functie als bedoeld in paragraaf 11 van
      hoofdstuk I-S behoudt, in afwijking van het bepaalde in artikel V-S1101, aanspraak op vaststelling van zijn salaris
      overeenkomstig dat uitzicht zolang hij zonder wezenlijke onderbreking aan een instelling als bedoeld in artikel I-
      A1, onder *d*13, verbonden blijft in een functie waarbij een maximumschaal hoort die ten minste gelijk is aan de
      maximumschaal die behoort bij de functie die hem is toebedeeld bij zijn overgang naar meergenoemde instelling.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-S1102
  - number: V-S1102.2
    text: |-
      De betrokkene voor wie een uitzicht is vastgesteld met toepassing van een der artikelen V-Q401, V-Q402 of V-Q701
      en die met ingang van de dag van zijn overgang als bedoeld in artikel A1, tweede lid, van de Overgangsregeling
      ondersteuning VE, naar een instelling als bedoeld in artikel I-A1 onder *d*13, vanuit de door hem beklede functie
      van directeur of adjunct-directeur anders dan op eigen verzoek is benoemd aan die instelling in een functie als
      bedoeld in paragraaf 11 van hoofdstuk I-S, behoudt in afwijking van het bepaalde in artikel V-S1101 aanspraak
      op vaststelling van zijn salaris overeenkomstig dat uitzicht zolang hij zonder wezenlijke onderbreking aan een
      instelling als bedoeld in artikel I-A1 onder *d*13, verbonden blijft in een functie, waarbij een maximumschaal
      hoort die ten minste gelijk is aan de maximumschaal, die behoort bij de functie die hem is toebedeeld bij zijn
      overgang naar meergenoemde instelling.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-S1102
  - number: V-S1102.3
    text: |-
      Met een wezenlijke onderbreking als aangegeven in het eerste en tweede lid, wordt een periode van langer dan twee
      maanden bedoeld. De tijd gedurende welke een ontslaguitkering als bedoeld in hoofdstuk I-H dan wel een uitkering
      als bedoeld in het [Besluit Werkloosheid onderwijs- en onderzoekpersoneel][ref1] wordt genoten, wordt niet als
      onderbreking aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0006445
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-S1102
    references:
      - id: ref1
        bwb_id: BWBR0006445
  - number: V-S1104.1
    text: |-
      De betrokkene op wie het bepaalde in de Overgangsregeling gewijzigde ondersteuningsstructuur VE, met uitzondering
      van artikel A2 van dat besluit van toepassing is, behoudt bij een instelling als bedoeld in artikel I-A1, onder
      *d*13, sub *b*, waaraan hij op de dag van overgang, bedoeld in artikel I-A1, tweede lid, van de Overgangsregeling
      gewijzigde ondersteuningsstructuur VE wordt verbonden als lid van het inhoudelijk dan wel het ondersteunend
      personeel, het uitzicht op de vaststelling van zijn salaris overeenkomstig het bepaalde in de artikelen V-S1101 en
      V-S1102.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-S1104
  - number: V-S1104.2
    text: |-
      De betrokkene, bedoeld in het eerste lid, aan wie met toepassing van artikel V-Q1103 dan wel V-S1103 een toelage
      is toegekend, behoudt overeenkomstig het bepaalde in artikel V-Q1103 die toelage bij een instelling als bedoeld in
      artikel I-A1, onder *d*13, sub *b*, waaraan hij op de dag van overgang, bedoeld in artikel A1, tweede lid, van de
      Overgangsregeling gewijzigde ondersteuningsstructuur VE, wordt verbonden als lid van het inhoudelijk dan wel het
      ondersteunend personeel.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-S1104
  - number: V-S1201.1
    text: |-
      Op de betrokkene, bedoeld in artikel I-A1, onder *e*14, bij wiens functie op 1 augustus 1990 een lagere
      maximumschaal behoort dan bij de functie volgens hoofdstuk I-Q, hoofdstuk I-R dan wel hoofdstuk I-S, zoals die
      hoofdstukken op 31 juli 1990 luidden, die hij op die datum vervulde, behoudt aanspraak op bezoldiging volgens
      het carrièrepatroon dat behoorde bij de functie die hij op 31 juli 1990 bekleedde, zolang hij als zodanig aan de
      instelling verbonden blijft, onverminderd het bepaalde in artikel V-S1203.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-S1201
  - number: V-S1201.2
    text: |-
      Op de betrokkene, bedoeld in artikel I-A1, onder *e*14, bij wiens functie op 1 augustus 1990 een lagere
      maximumschaal behoort dan bij de functie die hij op 31 juli 1990, volgens hoofdstuk I-R zoals dat op die datum
      luidde, vervulde, is artikel V-R1201 van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-S1201
  - number: V-S1201.3
    text: |-
      Op de betrokkene, bedoeld in artikel I-A1, onder *e*14, voor wie op 31 juli 1990 een of meer der artikelen V-S404
      en V-S407, zoals die artikelen op die datum luidden, van toepassing waren, zijn de artikelen V-S404 en V-S405 van
      overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-S1201
  - number: V-S1202
    text: |-
      Voor de betrokkene bedoeld in artikel I-A1, onder *e*14, voor wie op 31 juli 1990 artikel V-Q404 dan wel V-
      R406, zoals die artikelen op die datum luidden, van toepassing was en die op 1 augustus 1990 in dienst is bij
      een instelling, bedoeld in artikel I-A1, onder *d*14, en voor wie een betrekkingsomvang van meer dan 38 uur is
      berekend, komt niet voor bezoldiging in aanmerking het verschil tussen 38 uur en de voor hem op 1 augustus 1990
      geldende betrekkingsomvang.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-S1202
  - number: V-S1203.1
    text: |-
      Op de betrokkene bedoeld in artikel I-A1, onder *e*14, voor wie op 31 juli 1990 één of meer der artikelen V-Q402,
      V-Q403, V-Q405, V-Q406, V-R402, eerste en tweede lid, V-R403, V-R404, V-R404*a*, V-R407, V-R408 dan wel een of
      meer der artikelen in hoofdstuk V-S, paragraaf 4, zoals die artikelen op die datum luidden, van toepassing waren,
      zijn de artikelen V-P6, V-Q401, V-Q402, V-Q405, V-Q406, V-R401, V-R402, V-R403, V-R405 en V-R406 en bovenbedoelde
      artikelen in hoofdstuk V-S, paragraaf 4, van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-S1203
  - number: V-S1203.2
    text: |-
      De betrokkene bedoeld in artikel I-A1, onder *e*14, en de betrokkene in dienst van een instelling als bedoeld in
      artikel I-Q101, onderdeel *c* onder 3, op wie op 31 juli 1990 een of meer der artikelen V-Q402, V-Q403, V-Q406,
      V-R404 en V-R408, zoals die artikelen op die datum luidden, van toepassing waren, behoudt de in die artikelen
      bedoelde aanspraak indien hij op of na 1 augustus 1990 vrijwillig een functie aanvaardt met een maximumschaal die
      ten hoogste één lager is dan de maximumschaal bij de functie die hij op 31 juli 1990 bekleedde, mits:
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-S1203
  - number: V-S1203.2.a
    text: |-
      in de door hem niet aanvaarde dan wel nadien opgegeven functie een andere betrokkene wordt benoemd die boventallig
      is en
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-S1203
  - number: V-S1203.2.b
    text: |-
      die andere betrokkene een aanspraak heeft als bedoeld in de in de aanhef genoemde artikelen die tenminste gelijk is
      aan het maximumsalaris van de maximumschaal van de functie die behoort bij de functie waarin hij wordt benoemd en
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-S1203
  - number: V-S1203.2.c
    text: de boventalligheid aan een instelling als bedoeld in artikel I-A1, onder *d*14, wordt verminderd en
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-S1203
  - number: V-S1203.2.d
    text: |-
      in een verticale scholengemeenschap: het verschil in salaris van de in het gestelde onder *a* bedoelde beide
      betrokkenen niet meer bedraagt dan twee periodieke verhogingen.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-S1203
  - number: V-S1204
    text: Artikel V-S401 is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-S1204
  - number: V-S1205.1
    text: |-
      De artikelen V-S1201 tot en met V-S1204 zijn niet van toepassing op het lid van het ondersteunend en
      beheerspersoneel dat benoemd is in de formatie, bedoeld in artikel I-S1211, onder *b*, dan wel het deel van zijn
      benoeming dat daarop betrekking heeft indien hij tevens is benoemd in de formatie als bedoeld in artikel I-S1211,
      onder *a*.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-S1205
  - number: V-S1205.2
    text: |-
      Op de in het eerste lid bedoelde betrokkene zijn: - de artikelen V-S401 tot en met V-S404 van overeenkomstige
      toepassing indien hij voor de datum waarop de compartimentering heeft plaatsgevonden deel uitmaakte van het
      onderwijsondersteunend personeel, dan wel
        - de artikelen V-Q401 tot en met V-Q409 van overeenkomstige toepassing indien hij voor de datum waarop de
      compartimentering heeft plaatsgevonden deel uitmaakte van de directie, dan wel
        - de artikelen V-R401 tot en met V-R409 van overeenkomstige toepassing indien hij voor de datum waarop de
      compartimentering heeft plaatsgevonden leraar was.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-S1205
  - number: V-S1301.1
    text: |-
      De betrokkene, bedoeld in artikel I-A1, onder *e*15, bij wiens functie op 1 augustus 1990 een lagere maximumschaal
      behoort dan bij de functie volgens hoofdstuk I-Q, hoofdstuk I-R dan wel hoofdstuk I-S, zoals die hoofdstukken op
      31 juli 1990 luidden, die hij op die datum vervulde, behoudt aanspraak op bezoldiging volgens het carrièrepatroon
      dat behoorde bij de functie die hij op 31 juli 1990 bekleedde, zolang hij als zodanig aan de instelling verbonden
      blijft, onverminderd het bepaalde in artikel V-S1303.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-S1301
  - number: V-S1301.2
    text: |-
      Op de betrokkene, bedoeld in artikel I-A1, onder *e*15, bij wiens functie op 1 augustus 1990 een lagere
      maximumschaal behoort dan bij de functie die hij op 31 juli 1990, volgens hoofdstuk I-R zoals dat op die datum
      luidde, vervulde, is artikel V-R1301 van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-S1301
  - number: V-S1301.3
    text: |-
      Op de betrokkene, bedoeld in artikel I-A1, onder *e*15, voor wie op 31 juli 1990 een of meer der artikelen V-S404
      en V-S407, zoals die artikelen op die datum luidden, van toepassing waren, zijn de artikelen V-S404 en V-S405 van
      overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-S1301
  - number: V-S1302
    text: |-
      Voor de betrokkene bedoeld in artikel I-A1, onder *e*15, voor wie op 31 juli 1990 artikel V-Q404 dan wel V-
      R406, zoals die artikelen op die datum luidden, van toepassing was en die op 1 augustus 1990 in dienst is bij
      een instelling, bedoeld in artikel I-A1, onder *d*15, en voor wie een betrekkingsomvang van meer dan 38 uur is
      berekend, komt niet voor bezoldiging in aanmerking het verschil tussen 38 uur en de voor hem op 1 augustus 1990
      geldende betrekkingsomvang.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-S1302
  - number: V-S1303.1
    text: |-
      Op de betrokkene bedoeld in artikel I-A1, onder *e*15, voor wie op 31 juli 1990 één of meer der artikelen V-Q402,
      V-Q403, V-Q405, V-Q406, V-R402, eerste en tweede lid, V-R403, V-R404, V-R404*a*, V-R407, V-R408 dan wel een of
      meer der artikelen in hoofdstuk V-S, paragraaf 4, zoals die artikelen op die datum luidden, van toepassing waren,
      zijn de artikelen V-P6, V-Q401, V-Q402, V-Q405, V-Q406, V-R401, V-R402, V-R403, V-R405 en V-R406 en bovenbedoelde
      artikelen in hoofdstuk V-S, paragraaf 4, van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-S1303
  - number: V-S1303.2
    text: |-
      De betrokkene bedoeld in artikel I-A1, onder *e*15, voor wie op 31 juli 1990 een of meer der artikelen V-Q402, V-
      Q403, V-Q406, V-R404 en V-R408, zoals die artikelen op die datum luidden, van toepassing waren, behoudt de in
      die artikelen bedoelde aanspraak indien hij op of na 1 augustus 1990 vrijwillig een functie aanvaardt met een
      maximumschaal die ten hoogste één lager is dan de maximumschaal bij de functie die hij op 31 juli 1990 bekleedde,
      mits:
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-S1303
  - number: V-S1303.2.a
    text: |-
      in de door hem niet aanvaarde dan wel nadien opgegeven functie een andere betrokkene wordt benoemd die boventallig
      is en
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-S1303
  - number: V-S1303.2.b
    text: |-
      die andere betrokkene een aanspraak heeft als bedoeld in de in de aanhef genoemde artikelen die tenminste gelijk is
      aan het maximumsalaris van de maximumschaal van de functie die behoort bij de functie waarin hij wordt benoemd en
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-S1303
  - number: V-S1303.2.c
    text: de boventalligheid aan een instelling als bedoeld in artikel I-A1, onder *d*15, wordt verminderd en
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-S1303
  - number: V-S1303.2.d
    text: |-
      het verschil in salaris van de in het gestelde onder *a* bedoelde beide betrokkenen niet meer bedraagt dan twee
      periodieke verhogingen.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-S1303
  - number: V-S1304
    text: Artikel V-S401 is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-S1304
  - number: V-S1401.1
    text: |-
      Op de betrokkene, bedoeld in artikel I-A1, onder *e*17, bij wiens functie op 1 augustus 1993 een lagere
      maximumschaal behoort dan bij de functie volgens hoofdstuk I-Q, hoofdstuk I-R dan wel hoofdstuk I-S, zoals die
      hoofdstukken op 31 juli 1993 luidden, die hij op die datum vervulde, behoudt aanspraak op bezoldiging volgens
      het carrièrepatroon dat behoorde bij de functie die hij op 31 juli 1993 bekleedde, zolang hij als zodanig aan de
      instelling verbonden blijft, onverminderd het bepaalde in artikel V-S1403.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-S1401
  - number: V-S1401.2
    text: |-
      Op de betrokkene, bedoeld in artikel I-A1, onder *e*17, bij wiens functie op 1 augustus 1993 een lagere
      maximumschaal behoort dan bij de functie die hij op 31 juli 1993, volgens hoofdstuk I-R zoals dat op die datum
      luidde, vervulde, is artikel V-R1401 van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-S1401
  - number: V-S1401.3
    text: |-
      Op de betrokkene, bedoeld in artikel I-A1, onder *e*17, voor wie op 31 juli 1993 een of meer der artikelen V-S404
      en V-S407, zoals die artikelen op die datum luidden, van toepassing waren, zijn de artikelen V-S404 en V-S405 van
      overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-S1401
  - number: V-S1402
    text: |-
      De betrokkene bedoeld in artikel I-A1, onder *e*17, voor wie op 31 juli 1993 artikel V-Q404 dan wel V-R404, zoals
      die artikelen op die datum luidden, van toepassing was en die op 1 augustus 1993 in dienst is bij een instelling,
      bedoeld in artikel I-A1, onder *d*17, en voor wie een betrekkingsomvang van meer dan 38 uur is berekend, komt
      niet voor bezoldiging in aanmerking voor het verschil tussen 38 uur en de voor hem op 1 augustus 1993 geldende
      betrekkingsomvang.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-S1402
  - number: V-S1403
    text: |-
      Op de betrokkene bedoeld in artikel I-A1, onder *d*17, voor wie tot en met 31 juli 1993 op grond van artikel IV,
      onderdeel 3, onder *a* ,sub 1, van het besluit van 3 juli 1992 (*Stb* 1992, 389) (Formatiebudgetsysteem) een of
      meer van de artikelen V-Q402, V-Q403, V-Q405, V-Q406, V-R402, eerste en tweede lid, V-R403, V-R404, V-R404*a*, V-
      R407 en V-R408, van toepassing zijn gebleven, zijn de artikelen V-P6, V-Q401, V-Q402, V-Q405, V-Q406, V-R401, V-
      R402, V-R403, V-R405 en V-R406 van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-S1403
  - number: V-S1404
    text: Artikel V-S401 is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-S1404
  - number: V-S1405.1
    text: |-
      De artikelen V-S1401 tot en met V-S1404 zijn niet van toepassing op het lid van het ondersteunend en
      beheerspersoneel dat benoemd is in de formatie, bedoeld in artikel I-S1411, onder *b*, dan wel het deel van zijn
      benoeming dat daarop betrekking heeft indien hij tevens is benoemd in de formatie als bedoeld in artikel I-S1411,
      onder *a*.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-S1405
  - number: V-S1405.2
    text: |-
      Op de in het eerste lid bedoelde betrokkene zijn: - de artikelen V-S401 tot en met V-S404 van overeenkomstige
      toepassing indien hij voor de datum waarop de compartimentering heeft plaatsgevonden deel uitmaakte van het
      onderwijsondersteunend personeel, dan wel
        - de artikelen V-Q401 tot en met V-Q409 van overeenkomstige toepassing indien hij voor de datum waarop de
      compartimentering heeft plaatsgevonden deel uitmaakte van de directie, dan wel
        - de artikelen V-R401 tot en met V-R409 van overeenkomstige toepassing indien hij voor de datum waarop de
      compartimentering heeft plaatsgevonden leraar was.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-S1405
  - number: V-S1501.1
    text: |-
      Op de betrokkene, bedoeld in artikel I-A1, onder *e*18, bij wiens functie op 1 augustus 1993 een lagere
      maximumschaal behoort dan bij de functie volgens hoofdstuk I-Q, hoofdstuk I-R dan wel hoofdstuk I-S, zoals die
      hoofdstukken op 31 juli 1993 luidden, die hij op die datum vervulde, behoudt aanspraak op bezoldiging volgens
      het carrièrepatroon dat behoorde bij de functie die hij op 31 juli 1993 bekleedde, zolang hij als zodanig aan de
      instelling verbonden blijft, onverminderd het bepaalde in artikel V-S1503.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-S1501
  - number: V-S1501.2
    text: |-
      Op de betrokkene, bedoeld in artikel I-A1, onder *e*18, bij wiens functie op 1 augustus 1993 een lagere
      maximumschaal behoort dan bij de functie die hij op 31 juli 1993, volgens hoofdstuk I-R zoals dat op die datum
      luidde, vervulde, is artikel V-R1501 van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-S1501
  - number: V-S1501.3
    text: |-
      Op de betrokkene, bedoeld in artikel I-A1, onder *e*18, voor wie op 31 juli 1993 een of meer der artikelen V-S404
      en V-S407, zoals die artikelen op die datum luidden, van toepassing waren, zijn de artikelen V-S404 en V-S405 van
      overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-S1501
  - number: V-S1502
    text: |-
      De betrokkene bedoeld in artikel I-A1, onder *e*18, voor wie op 31 juli 1993 artikel V-Q404 dan wel V-R404, zoals
      die artikelen op die datum luidden, van toepassing was en die op 1 augustus 1993 in dienst is bij een instelling,
      bedoeld in artikel I-A1, onder *d*18, en voor wie een betrekkingsomvang van meer dan 38 uur is berekend, komt
      niet voor bezoldiging in aanmerking voor het verschil tussen 38 uur en de voor hem op 1 augustus 1993 geldende
      betrekkingsomvang.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-S1502
  - number: V-S1503
    text: |-
      Op de betrokkene bedoeld in artikel I-A1, onder *d*17, voor wie tot en met 31 juli 1993 op grond van artikel IV,
      onderdeel 3, onder *a* ,sub 1, van het besluit van 3 juli 1992 (*Stb* 1992, 389) (Formatiebudgetsysteem) een of
      meer van de artikelen V-Q402, V-Q403, V-Q405, V-Q406, V-R402, eerste en tweede lid, V-R403, V-R404, V-R404*a*, V-
      R407 en V-R408, van toepassing zijn gebleven, zijn de artikelen V-P6, V-Q401, V-Q402, V-Q405, V-Q406, V-R401, V-
      R402, V-R403, V-R405 en V-R406 van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-S1503
  - number: V-S1504
    text: Artikel V-S401 is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-S1504
  - number: V-S1505.1
    text: |-
      De artikelen V-S1501 tot en met V-S1504 zijn niet van toepassing op het lid van het ondersteunend en
      beheerspersoneel dat benoemd is in de formatie, bedoeld in artikel I-S1511, onder *b*, dan wel het deel van zijn
      benoeming dat daarop betrekking heeft indien hij tevens is benoemd in de formatie als bedoeld in artikel I-S1511,
      onder *a*.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-S1505
  - number: V-S1505.2
    text: |-
      Op de in het eerste lid bedoelde betrokkene zijn: - de artikelen V-S401 tot en met V-S404 van overeenkomstige
      toepassing indien hij voor de datum waarop de compartimentering heeft plaatsgevonden deel uitmaakte van het
      onderwijsondersteunend personeel, dan wel
        - de artikelen V-Q401 tot en met V-Q409 van overeenkomstige toepassing indien hij voor de datum waarop de
      compartimentering heeft plaatsgevonden deel uitmaakte van de directie, dan wel
        - de artikelen V-R401 tot en met V-R409 van overeenkomstige toepassing indien hij voor de datum waarop de
      compartimentering heeft plaatsgevonden leraar was.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-S1505
  - number: V-VI.1
    text: |-
      Voor de betrokkene bedoeld in artikel I-V3, tweede lid, die op 31 juli 1994 verlof genoot op grond van hoofdstuk I-
      V zoals dat toen luidde, geldt dat voor het percentage genoemd in artikel I-V4 gedurende het schooljaar 1994-1995
      wordt gelezen "70%" en gedurende het schooljaar 1995-1996 "60%".
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-VI
  - number: V-VI.2
    text: |-
      Voor de betrokkene bedoeld in artikel I-V3, derde lid, die op 31 juli 1994 verlof genoot op grond van hoofdstuk
      I-V zoals dat toen luidde, geldt dat voor het percentage genoemd in artikel I-V4 gedurende het schooljaar 1994-
      1995 wordt gelezen "80%", voor het schooljaar 1995-1996 "75%", voor het schooljaar 1996-1997 "70%" en voor het
      schooljaar 1997-1998 "60%", mits de betrokkene de leeftijd van 56 jaar heeft bereikt vóór 1 februari 1994.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-VI
  - number: V-VI.3
    text: |-
      Voor de betrokkene bedoeld in artikel I-V3, derde lid, die op 31 juli 1994 verlof genoot op grond van hoofdstuk I-
      V zoals dat toen luidde en de leeftijd van 56 jaar heeft bereikt op of na 1 februari 1994 is het eerste lid van
      overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-VI
  - number: V-VI.4
    text: |-
      Voor de betrokkene bedoeld in artikel I-V3, tweede en derde lid, die op 31 juli 1994 op grond van artikel V-V1,
      zoals dat toen luidde, verlof genoot voor meer dan 5,26% van zijn betrekkingsomvang zoals die op 1 augustus 1994
      gaat gelden, is het eerste, tweede en derde lid van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-VI
  - number: V-V2.1
    text: |-
      Voor de betrokkene van 60 jaar en ouder op wie op 31 juli 1994 artikel I-S111 van toepassing is en die tevens
      gebruik maakt van het verlof bedoeld in artikel I-V2, geldt dat artikel I-S111, eerste lid, in afwijking van het
      derde lid van artikel I-S111 van toepassing is.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-V2
  - number: V-V2.2
    text: Het eerste lid geldt tot het moment dat de betrokkene de pensioengerechtigde leeftijd heeft bereikt.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-V2
  - number: V-V3.1
    text: |-
      Artikel I-C42 is van overeenkomstige toepassing voor de betrokkene als bedoeld in artikel I-A1, onder *e*4, *e*17
      en *e*18, die in het schooljaar 1991/1992 en 1992/1993 gebruik heeft gemaakt van de regeling verlof in verband met
      niet genoten arbeidsduurverkorting onderwijsgevend personeel.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-V3
  - number: V-V3.2
    text: |-
      Artikel I-C42 is van overeenkomstige toepassing voor de betrokkene als bedoeld in artikel I-A1 onder *e*5 en *e*10
      die in het schooljaar 1991/1992, 1992/1993 en 1993/1994 tot en met 31 december 1993 gebruik heeft gemaakt van de
      regeling verlof in verband met niet genoten arbeidsduurverkorting onderwijsgevend personeel.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-V3
  - number: V-Z4.1
    text: |-
      Artikel IV-A1 onder *c*, wordt tot 1 augustus 1985 als volgt gelezen: *c.* onderwijspersoneel: het aan de
      instellingen, bedoeld in artikel I-A1, onder *d*3 tot en met *d*5, alsmede *d*7 tot en met *d*9, verbonden
      personeel, alsmede het personeel verbonden kleuterscholen, gewone lagere scholen en scholen voor buitengewoon
      onderwijs, waarvoor de salaris- en overige rechtspositieregelingen bij algemene maatregel van bestuur worden
      vastgesteld;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-Z4
  - number: V-Z4.2
    text: |-
      Artikel IV-A3, eerste lid, onderdeel *a*, wordt tot 1 augustus 1985 als volgt gelezen: Afdeling 1 voor het
      onderwijzend personeel werkzaam bij het kleuteronderwijs, het gewoon en het buitengewoon lager onderwijs.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-Z4
  - number: V-Z4.3
    text: |-
      Artikel IV-A12, zesde lid, wordt tot 1 augustus 1985 als volgt gelezen: De secretaris draagt er zorg voor dat de
      Bijzondere commissie in afschrift alle stukken ontvangt welke worden toegezonden aan het informatief overleg dat
      Onze minister voert met organisaties van school- en gemeentebesturen.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-Z4
  - number: V-Z5.1
    text: |-
      De koninklijke besluiten van 11 juli 1968, *Stb.* 377 (Rechtspositiebesluit W.V.O.), 14 november 1968, *Stb.* 622
      (Rechtspositiebesluit W.L.W.) en 27 februari 1975, *Stb.* 156 (Besluit G.O.-onderwijs 1975) worden ingetrokken met
      ingang van de datum waarop dit besluit in werking treedt.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-Z5
  - number: V-Z5.2
    text: |-
      Het koninklijk besluit van 13 april 1978, *Stb.* 228 (Rechtspositiebesluit K.O./L.O.) wordt ingetrokken met ingang
      van 1 augustus 1985.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-Z5
  - number: V-Z6.1
    text: |-
      Dit besluit treedt in werking met ingang van de tweede dag na uitgifte van het *Staatsblad* waarin het wordt
      geplaatst, behoudens het bepaalde in het tweede lid en derde lid.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-Z6
  - number: V-Z6.2
    text: |-
      Dit besluit treedt in werking met ingang van 1 augustus 1985, ten aanzien van de belanghebbende bedoeld in artikel
      1-A1, onder *e*1 en *e*2.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-Z6
  - number: V-Z6.3
    text: |-
      Artikel IV-A3, tweede lid, hoofdstuk IV-B en artikel V-2, tweede en vijfde lid, treden in werking met ingang van 1
      augustus 1985.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-Z6
  - number: V-Z7
    text: 'Dit besluit kan worden aangehaald als: Rechtspositiebesluit onderwijspersoneel.'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-Z7
