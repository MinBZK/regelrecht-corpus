preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Onderwijs en Wetenschappen, mede namens Onze Ministers van Landbouw en
    Visserij en van Binnenlandse Zaken van 5 oktober 1984, nr. 148 927, Directie Arbeidsvoorwaardenbeleid;

    Overwegende, dat het wenselijk is te komen tot het onderbrengen van de verschillende voor het onderwijspersoneel
    geldende rechtspositieregelingen in één rechtspositiebesluit voor het onderwijspersoneel;

    Gelet op artikel 5 van de Kleuteronderwijswet;

    artikel 9 bis van de Lager-onderwijswet 1920;

    de artikelen 17Artikel 17 van de WBO komt niet meer voor in de WPO., 32, vierde lid, 33, tweede lid, 52, 59, eerste
    lid, 62, vijfde lid, en 64 van de Wet op het primair onderwijs;

    de artikelen 32, vierde lid, 33, tweede lid, 55, 65, vijfde lid, en 66 van de Wet op de expertisecentra;

    de artikelen 152, vierde lid, 153, tweede lid, 173, 183, vijfde lid, en 184 van deel II van de Wet op het
    voortgezet onderwijs;

    de artikelen 4 en 4a van de Experimentenwet onderwijs;

    de artikelen 38, 39, tweede lid, 40, 43, derde lid, 53, vierde lid, 61, 62 en 63 van de Wet op het voortgezet
    onderwijs;

    de artikelen 21, eerste lid, 23, tweede en derde lid, 25, vierde lid, en 26 van de Wet op het leerlingwezen;

    de artikelen 19, 21, tweede lid, en 22 van het Besluit vormingswerk voor jeugdigen;

    de artikelen 27, eerste lid, 29, eerste lid, en 30, eerste lid, van het Besluit proefprojecten nieuw vervolg/
    beroepsonderwijs en de artikelen 25, eerste lid, 27, eerste lid, en 28, eerste lid, van het Besluit proefprojecten
    deeltijd vervolg/beroepsonderwijs;

    De Raad van State gehoord (advies van 11 februari 1985, nr. W 05.84.0594/07.5.96);

    Gezien het nader rapport van Onze Minister van Onderwijs en Wetenschappen, mede namens Onze Ministers van Landbouw
    en Visserij en Binnenlandse Zaken van 15 februari 1985, nr. 149431, directie Arbeidsvoorwaardenbeleid;

    Hebben goedgevonden en verstaan:

    Het Rechtspositiebesluit onderwijspersoneel wordt als volgt vastgesteld:
