  - number: I-Q302
    text: |-
      De normfuncties voor de directie die in de formatie van een instelling kunnen voorkomen zijn de normfunctie van
      directeur en van adjunct-directeur. In de bijlage Q2 bij dit besluit is voor deze functies een taakkarakteristiek
      gegeven.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q302
  - number: I-Q303.1
    text: |-
      De betrokkene die is benoemd in een normbetrekking en die het verlof, bedoeld in artikel I-C41, per jaar
      geniet, wordt gemiddeld voor ten hoogste 930 uren per jaar belast met het geven van onderwijs als bedoeld in de
      taakkarakteristiek van de normfunctie leraar als opgenomen in de bijlage R2 van dit besluit. Voor de betrokkene
      die gebruik maakt van het verlof, bedoeld in artikel I-C41, zevende lid, en voor wie een arbeidsduur op jaarbasis
      geldt van 1710 uren respectievelijk 1790 uren wordt in de eerste volzin voor «930 uren» gelezen «961 uren»
      respectievelijk «1010 uren».
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q303
  - number: I-Q303.2
    text: |-
      Binnen een normbetrekking is 10% van de normbetrekking en indien gebruik wordt gemaakt van artikel I-C41, zevende
      lid, 10% van de arbeidsduur op jaarbasis, bedoeld in artikel I-P3, tweede of derde lid, bestemd voor activiteiten
      in het kader van de deskundigheidsbevordering. De besteding van het in de eerste volzin bedoelde deel van de
      normbetrekking respectievelijk de arbeidsduur op jaarbasis wordt door betrokkene bepaald, met dien verstande dat
      het bevoegd gezag in individuele gevallen en schriftelijk gemotiveerd daarvan kan afwijken.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q303
  - number: I-Q303.3
    text: |-
      Na verkregen instemming van het decentraal georganiseerd overleg kan aan instellingen waarvoor op jaarbasis een
      onderwijstijd geldt van meer dan 1010 doch ten hoogste 1040 uur betrokkene voor maximaal die aan de instelling
      geldende onderwijstijd worden belast met het geven van onderwijs.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q303
  - number: I-Q303.4
    text: |-
      Voor de betrokkene die is benoemd in een betrekking met een omvang van minder dan een normbetrekking wordt het
      maximum aantal uren, bedoeld in het eerste lid, en de deskundigheidsbevordering, bedoeld in het tweede lid, naar
      evenredigheid van de werktijdfactor berekend en rekenkundig afgerond op gehele uren.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q303
  - number: I-Q303.5
    text: |-
      In individuele gevallen kunnen door het bevoegd gezag en betrokkene van het percentage genoemd in het tweede lid
      afwijkende afspraken worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q303
  - number: I-Q304
    text: |-
      De maximumschaal die voor de normfunctie van directeur geldt, wordt afhankelijk van Q vastgesteld volgens het
      onderstaande schema.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q304
  - number: I-Q305
    text: |-
      De maximumschaal die voor de normfunctie adjunct-directeur geldt, wordt afhankelijk van Q vastgesteld volgens het
      onderstaande schema.





                  Q maximumschaal




                  kleiner dan 24 10




                  gelijk aan of groter dan 24 11
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q305
  - number: I-Q306
    text: |-
      Indien ingevolge de door het bevoegd gezag vastgestelde formatie bedoeld in artikel I-P76, tweede lid, onder *a*
      niet langer een adjunct-directeur als bedoeld in artikel I-Q305 kan zijn benoemd, blijft de betrokkene bedoeld in
      artikel I-R301 die als adjunct-directeur was benoemd aanspraak houden op het carrièrepatroon dat voor hem op de
      laatste dag van het voorafgaande schooljaar gold, indien dit carrièrepatroon gedurende ten minste drie onmiddellijk
      voorafgaande schooljaren aan die instelling of, in voorkomende gevallen, instellingen voor hem als leraar tevens
      adjunct-directeur heeft gegolden. De betrokkene behoudt deze aanspraak zolang hij aan dezelfde instelling of
      instellingen verbonden blijft.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q306
  - number: I-Q307.1
    text: Zonder voorafgaand ontslag kan een benoeming als leraar tevens adjunct-directeur niet worden beëindigd.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q307
  - number: I-Q307.2
    text: |-
      Het bepaalde in het eerste lid is niet van toepassing op de leraar die als adjunct-directeur is benoemd en op wie
      artikel I-Q306 van toepassing is.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q307
  - number: I-Q307.3
    text: |-
      Zolang aan de instelling of, in voorkomende gevallen, instellingen een leraar is verbonden voor wie het bepaalde in
      artikel I-Q306 geldt, kan geen andere leraar tevens tot adjunct-directeur worden benoemd.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q307
  - number: I-Q308.1
    text: |-
      Indien op grond van [artikel 29, eerste lid, derde volzin, van de Wet op de expertisecentra][ref1] of
      [artikel 149, eerste lid, derde volzin, van de Wet op het voortgezet onderwijs][ref2] een directeur van een
      instelling tevens is belast met de leiding van een andere instelling waar de functie van directeur vacant is,
      kan het bevoegd gezag, zolang deze situatie zich voordoet en uitsluitend ten laste van eigen middelen aan die
      directeur boven zijn salaris een maandelijkse toelage toekennen te bedrage van het verschil tussen het bedrag bij
      salarisnummer 9 in schaal 11 en het bedrag bij salarisnummer 8 in die schaal.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel149
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q308
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '29'
      - id: ref2
        bwb_id: BWBR0002399
        artikel: '149'
  - number: I-Q308.2
    text: |-
      De in het eerste lid bedoelde toelage behoort niet tot het inkomen, bedoeld in het
      pensioenreglement, en telt niet mee voor de berekening en vaststelling van uitkeringen ingevolge het
      [Besluit werkloosheid onderwijs- en onderzoekpersoneel][ref1], het Besluit ziekte en arbeidsongeschiktheid
      onderwijs- en onderzoekpersoneel, alsmede de regeling voor vervroegde uittreding.


      [ref1]: https://wetten.overheid.nl/BWBR0006445
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q308
    references:
      - id: ref1
        bwb_id: BWBR0006445
  - number: I-Q308.3
    text: |-
      Indien de betrokkene niet in een normbetrekking is benoemd, wordt de toelage berekend naar evenredigheid van zijn
      betrekkingsomvang.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q308
