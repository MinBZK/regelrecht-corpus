      rekenkundig wordt afgerond op vier cijfers achter de komma.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-A1
  - number: I-A1.h
    text: 'inspectie: de inspectie belast met het toezicht op de desbetreffende instelling;'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-A1
  - number: I-A1.i
    text: |-
      normbetrekking: de betrekking of de betrekkingen waarvan de omvang op jaarbasis na aftrek van het verlof op grond
      van artikel I-C2 respectievelijk artikel I-C7, tweede lid, eerste volzin en na aftrek van het verlof op grond van
      artikel I-C41, gelijk is aan 1659 uren en waarbij de gemiddelde weektaak op jaarbasis gelijk is aan 36,86 uren.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-A1
  - number: I-A1.j
    text: |-
      bezoldiging: de som van het salaris en de toelagen, genoemd in de artikelen I-P5, vierde lid, I-P16, I-P55, tweede
      lid, I-P58, I-P60, I-P83, I-Q209b, I-S107, I-S108, V-P4, V-P5, V-R102, tweede lid, derde lid en vierde lid, en V-
      R103, tweede lid, derde lid en vierde lid waarop de betrokkene ingevolge dit besluit aanspraak heeft;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-A1
  - number: I-A1.k
    text: |-
      diensttijd: de tijd die in aanmerking komt voor pensioen dan wel daarvoor in aanmerking zou komen, indien van
      het recht van inkoop was gebruik gemaakt, alsmede ten aanzien van de betrokkene genoemd onder *e*5, *e*6, *e*8 of
      *e*9, vermeerderd met de diensttijd doorgebracht in dienst van een vormingsinstituut vóór het daarop van toepassing
      verklaren van de WPA en het daarop berustende pensioenreglement;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-A1
  - number: I-A1.l
    text: |-
      WPA: de [Wet privatisering ABP][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007791
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-A1
    references:
      - id: ref1
        bwb_id: BWBR0007791
  - number: I-A1.ll
    text: 'het pensioenreglement: het pensioenreglement van de Stichting Pensioenfonds ABP;'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-A1
  - number: I-A1.m
    text: 'pensioen: een pensioen, als bedoeld in en vastgesteld bij of krachtens de WPA;'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-A1
  - number: I-A1.n
    text: |-
      schooljaar: het administratieve schooljaar, zijnde het tijdvak van 1 augustus tot en met 31 juli, dan wel, voor de
      instellingen bedoeld in artikel I-A1, onder *d*6, en *d*12, het kalenderjaar;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-A1
  - number: I-A1.o
    text: |-
      benoeming of aanstelling: de benoeming in algemene dienst van het bevoegd gezag
      als bedoeld in [artikel 34, eerste lid, van de Wet op het primair onderwijs][ref1],
      [artikel 34, eerste lid, van de Wet op de expertisecentra][ref2],
      [artikel 154, eerste lid, van de Wet op het voortgezet onderwij][ref3]s of artikel 2.47, eerste lid onder
      *h*, van de Wet op het cursorisch beroepsonderwijs, onderscheidenlijk de benoeming bij een privaatrechtelijke
      verzorgingsinstelling of bij een privaatrechtelijke instelling als bedoeld onder *d*13 en de aanstelling bij een
      publiekrechtelijke verzorgingsinstelling of bij een publiekrechtelijke instelling als bedoeld onder *d*13.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel34
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel154
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-A1
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '34'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '34'
      - id: ref3
        bwb_id: BWBR0002399
        artikel: '154'
  - number: I-A1.p
    text: |-
      bestuursbenoeming: de benoeming in algemene dienst bedoeld in
      [artikel 34 van de Wet op het primair onderwijs][ref1], [artikel 34 van de Wet op de expertisecentra][ref2] of
      [artikel 154 van de Wet op het voortgezet onderwijs][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel34
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel154
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-A1
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '34'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '34'
      - id: ref3
        bwb_id: BWBR0002399
        artikel: '154'
  - number: I-A1.q
    text: |-
      "akte van benoeming": de akte van benoeming bij het bijzonder onderwijs dan wel de arbeidsovereenkomst met het
      bestuur van een privaatrechtelijke verzorgingsinstelling of van een privaatrechtelijke instelling als bedoeld onder
      *d*13 en de akte van aanstelling bij het openbaar onderwijs, bij een publiekrechtelijke verzorgingsinstelling of
      bij een publiekrechtelijke instelling als bedoeld onder *d*13, een en ander als bedoeld in hoofdstuk I-B, dan wel
      het Koninklijk besluit bedoeld in artikel 82, eerste lid, van de Wet op het hoger beroepsonderwijs;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-A1
  - number: I-A1.r
    text: '"dagschool": de instelling waaraan de te geven lessen geheel of in overwegende mate aanvangen vóór 18.00 uur;'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-A1
  - number: I-A1.s
    text: '"avondschool": de instelling waaraan de te geven lessen geheel of in overwegende mate aanvangen na 18.00 uur;'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-A1
  - number: I-A1.t
    text: |-
      "contractactiviteiten": werkzaamheden die aan een instelling naast de door het Rijk bekostigde taken worden
      verricht ingevolge een daartoe met een derde door het bevoegd gezag gesloten overeenkomst en waarvoor de door het
      Rijk bekostigde formatie door het bevoegd gezag wordt uitgebreid, een en ander als bedoeld in artikel 3, derde lid,
      van het Besluit vormingswerk voor jeugdigen artikel 2.7 van de Wet op het cursorisch beroepsonderwijs;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-A1
  - number: I-A1.u
    text: |-
      "contractperiode": de periode gedurende welke het bevoegd gezag de voor een instelling door het Rijk
      bekostigde formatie heeft uitgebreid in verband met een overeenkomst met een derde tot het verrichten van
      contractactiviteiten;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-A1
  - number: I-A1.v
    text: |-
      echtgeno(o)t(e): voor de toepassing van dit besluit wordt onder echtgenote of echtgenoot mede begrepen de
      levensparter met wie de ambtenaar samenwoont en - met het oogmerk duurzaam samen te leven - een gemeenschappelijke
      huishouding voert op basis van een notarieel verleden samenlevingscontract bevattende de wederzijdse rechten
      en verplichtingen ter zake van die samenwoning en gemeenschappelijke huishouding, dan wel de persoon met wie
      een geregistreerd partnerschap is aangegaan. Onder weduwe of weduwnaar wordt mede begrepen de achtergebleven
      levenspartner, dan wel de achtergebleven geregistreerde partner. Tot gezinslid wordt in voorkomend geval mede
      gerekend de levenspartner of geregistreerde partner. Tegelijkertijd kan slechts één persoon als levenspartner of
      geregistreerde partner worden aangemerkt. Onze Minister kan verlangen dat een schriftelijke verklaring van een
      notaris wordt overgelegd waaruit blijkt dat een samenlevingscontract als bedoeld in de eerste volzin is gesloten.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-A1
  - number: I-A2
    text: |-
      Het bevoegd gezag draagt er zorg voor dat een bijgewerkt exemplaar van dit besluit en de overige van toepassing
      zijnde rechtspositionele regelingen op een voor de betrokkene steeds toegankelijke plaats op de instelling ter
      inzage beschikbaar is.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-A2
  - number: I-A3
    text: |-
      Indien de betrokkene ten genoege van de bevoegde instantie aannemelijk maakt dat de aanvang van een in dit besluit
      gestelde termijn gedurende welke een aanspraak kan worden geldend gemaakt, hem niet tijdig bekend kon zijn en
      hij hierdoor in zijn belangen is geschaad, wordt de termijn geacht te zijn aangevangen op het tijdstip waarop de
      betrokkene naar het oordeel van de bevoegde instantie redelijkerwijs heeft kunnen kennisdragen van het ontstaan van
      zijn aanspraken.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-A3
  - number: I-A4
    text: |-
      De [Algemene termijnenwet][ref1] (*Stb.* 1964, 314) is niet van toepassing op de termijnen in dit besluit gesteld,
      met uitzondering van die, genoemd in de artikelen II-A8, eerste lid, II-C4, tweede en vierde lid, en II-D10, tweede
      en vierde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002448
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-A4
    references:
      - id: ref1
        bwb_id: BWBR0002448
  - number: I-A5
    text: |-
      De salarisbedragen, tegemoetkomingen en toelagen, genoemd in de bijlagen van dit besluit, kunnen worden gewijzigd
      bij ministeriële regeling.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-A5
  - number: I-A6
    text: |-
      Indien het ingevolge de desbetreffende bekostigingswet mogelijk is dan wel toegestaan wordt, personeel te
      benoemen voor wie de salaris- en andere kosten niet voor vergoeding van Rijkswege in aanmerking komen, is - tenzij
      uitdrukkelijk anders bepaald - ten aanzien van dit personeel het bepaalde in dit besluit van toepassing.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-A6
  - number: I-A8.1
    text: In gevallen waarin dit besluit niet of niet naar billijkheid voorziet, beslist Onze minister.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-A8
  - number: I-A8.2
    text: |-
      Onze minister geeft nadere voorschriften omtrent de toepassing van dit besluit in geval van samenvoeging of
      splitsing van instellingen.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-A8
  - number: I-A8.3
    text: Onze minister kan nadere regelen geven voor de uitvoering van dit besluit.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-A8
  - number: I-B2.1
    text: 'Bij zijn indiensttreding ontvangt de betrokkene een akte van benoeming waarin tenminste is vermeld:'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-B2
  - number: I-B2.1.a
    text: de datum van ingang van de benoeming;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-B2
  - number: I-B2.1.b
    text: de functie waarin de betrokkene wordt benoemd en de daarbij behorende maximumschaal;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-B2
  - number: I-B2.1.c
    text: |-
      de bepaling of de benoeming in vaste of in tijdelijke dienst geschiedt en in het laatste geval de gronden voor de
      tijdelijkheid en de duur van de benoeming;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-B2
  - number: I-B2.1.d
    text: de omvang van de betrekking, uitgedrukt in een werktijdfactor.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-B2
  - number: I-B2.1.e
    text: |-
      het op de dag van zijn benoeming van toepassing zijnde begintraject, aanlooptraject of de van toepassing zijnde
      schaal en het salarisnummer;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-B2
  - number: I-B2.1.f
    text: |-
      de instelling of instellingen waaraan de betrokkene werkzaam zal zijn en de verdeling van de uren over die
      instellingen.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-B2
  - number: I-B2.1.g
    text: de van toepassing zijnde afvloeiingsregeling.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-B2
  - number: I-B2.1.h
    text: andere voor de rechtspositie van belang zijnde zaken.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-B2
  - number: I-B2.2
    text: 'Wijziging van:'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-B2
  - number: I-B2.2.a
    text: de aard van het dienstverband,
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-B2
  - number: I-B2.2.b
    text: de functie waarin hij is benoemd, of
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-B2
  - number: I-B2.2.c
    text: de omvang van de betrekking, uitgedrukt in een werktijdfactor, of
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-B2
  - number: I-B2.2.d
    text: de instelling of instellingen waaraan de betrokkene werkzaam zal zijn.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-B2
  - number: I-B2.3
    text: |-
      Wanneer voor de betrokkene die nog niet volgens de bij zijn functie behorende maximumschaal bedoeld in artikel I-
      P1, onder *d*, wordt bezoldigd, een schaal met een hoger maximumsalaris bedoeld in artikel I-P1, onder *g*, gaat
      gelden, wordt hem schriftelijk medegedeeld:
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-B2
  - number: I-B2.3.a
    text: de datum waarop voor hem een andere schaal gaat gelden;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-B2
  - number: I-B2.3.b
    text: de schaal welke vanaf de onder *a* bedoelde datum van toepassing zal zijn;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-B2
  - number: I-B2.3.c
    text: |-
      het op de onder *a* bedoelde datum binnen de onder *b* bedoelde schaal van toepassing zijnde salarisnummer en het
      daarbij behorende bruto maandsalaris bij een normbetrekking.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-B2
  - number: I-B2.4
    text: |-
      Bij het einde van zijn dienstverband ontvangt de betrokkene van het bevoegd gezeg een schriftelijke verklaring
      waarin is vermeld:
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-B2
  - number: I-B2.4.a
    text: |-
      het begintraject, aanlooptraject of de schaal welke op de dag direct voorafgaande aan het ontslag van toepassing
      was;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-B2
  - number: I-B2.4.b
    text: |-
      het op de dag direct voorafgaande aan het ontslag van toepassing zijnde salarisnummer binnen het onder *a* bedoelde
      begintraject of aanlooptraject dan wel binnen de onder *a* bedoelde schaal;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-B2
  - number: I-B2.4.c
    text: |-
      de datum vanaf welke voor de betrokkene het onder *a* bedoelde begintraject of aanlooptraject dan wel de onder *a*
      bedoelde aanloopschaal en het onder *b* bedoelde salarisnummer gold en de mate waarin de betrokkene aan de voor hem
      geldende promotiecriteria heeft voldaan.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-B2
  - number: I-B3
    text: |-
      De verklaring omtrent het gedrag, welke vereist is voor benoeming bij een bevoegd gezag van aan een instelling als
      bedoeld in artikel I-A1, onder *d*1, *d*2, en *d*4 tot en met *d*6, *d*10, *d*12 tot en met *d*15 alsmede *d*17
      en *d*18, afgegeven volgens de [Wet op de justitiële documentatie en op de verklaringen omtrent het gedrag][ref1]
      (*Stb.* 1955, 395), is bij overlegging aan het bevoegd gezag niet ouder dan zes maanden, te rekenen vanaf de dag
      van afgifte.


      [ref1]: https://wetten.overheid.nl/BWBR0002195
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-B3
    references:
      - id: ref1
        bwb_id: BWBR0002195
  - number: I-B4.1
    text: Ter zake van werving en selectie van personeel neemt het bevoegd gezag een sollicitatiecode in acht.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-B4
  - number: I-B4.2
    text: |-
      De sollicitatiecode wordt niet vastgesteld dan nadat met de personeelsorganisaties, bedoeld in
      [artikel 64 van de Wet op het primair onderwijs][ref1], [artikel 66 van de Wet op de expertisecentra][ref2],
      [artikel 184 van de Wet op het voortgezet onderwijs][ref3]” artikel 2.51 en 2.59 van de Wet op het cursorisch
      beroepsonderwijs, artikel 20 van het Besluit vormingswerk voor jeugdigen, artikel 61 van de Wet op de
      onderwijsverzorging of artikel 9 van de Kaderwet volwasseneneducatie 1991 dan wel met verenigingen van het aan de
      instellingen, bedoeld in artikel I-A1, onder *d*6 en *d*7, verbonden personeel, voor zover deze hun werkzaamheden
      uitstrekken over het aan zodanige instellingen verbonden personeel, overleg is gepleegd.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel64
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel66
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel184
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-B4
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '64'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '66'
      - id: ref3
        bwb_id: BWBR0002399
        artikel: '184'
  - number: I-B4.3
    text: |-
      Het bevoegd gezag draagt er zorg voor dat de sollicitatiecode op een voor de betrokkene toegankelijke plaats
      ter inzage in de instelling beschikbaar is en hem op diens verzoek een exemplaar van de sollicitatiecode ter
      beschikking wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-B4
  - number: I-B8
    text: Onze minister kan nadere regels geven ter uitvoering van het bepaalde in dit hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-B8
  - number: I-C1
    text: 'In deze paragraaf wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C1
  - number: I-C1.a
    text: 'betrokkene: de betrokkene, bedoeld in artikel I-A1, voor zover het betreft, onder:'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C1
  - number: I-C1.a.1
    text: '*e*1, de directeur, de adjunct-directeur of het lid van het onderwijsgevend personeel;'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C1
  - number: I-C1.a.2
    text: '*e*2, de directeur, de adjunct-directeur of het lid van het onderwijsgevend personeel;'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C1
  - number: I-C1.a.3.b
    text: |-
      *e*15, het lid van de centrale directie als bedoeld in artikel I-Q1302 en het lid van het onderwijzend personeel
      als bedoeld in artikel I-R1305;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C1
  - number: I-C1.a.3
    text: |-
      e16, een lid van het onderwijsgevend personeel dat is benoemd op basis van formatierekeneenheden als bedoeld in
      [artikel 68, eerste lid, onder d, van de Wet op het primair onderwijs][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel68
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C1
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '68'
  - number: I-C1.b
    text: 'vakanties: de voor de instelling van de betrokkene geldende vakanties;'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C1
  - number: I-C1.c
    text: |-
      dag: iedere dag die volgens het schema van werkzaamheden dan wel het normale lesrooster een werkdag is van de
      instelling; een dag kan worden verdeeld in 2 halve dagen.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C1
  - number: I-C2.1
    text: |-
      Tenzij uitdrukkelijk anders is bepaald, geniet de betrokkene gedurende de schoolvakanties dan wel de periode waarin
      de instelling geen onderwijs verzorgt of examens afneemt, vakantieverlof met behoud van bezoldiging.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C2
  - number: I-C2.2
    text: 'Het bevoegd gezag kan op verzoek na omzetting van de dienst verlof verlenen op andere tijdstippen aan:'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C2
  - number: I-C2.2.a
    text: de directeur, de adjunct-directeur en de leraar die is benoemd als adjunct-directeur;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C2
  - number: I-C2.2.b
    text: het lid van de centrale directie.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C2
  - number: I-C2.3
    text: |-
      Het bevoegd gezag kan, in bijzondere gevallen en nadat vóór de contractperiode met de betrokkene die werkzaamheden
      in het kader van contractactiviteiten gaat verrichten daarover overeenstemming is bereikt, in plaats van het verlof
      bedoeld in het eerste lid, verlof verlenen op andere tijdstippen. Het bevoegd gezag doet hiervan mededeling aan
      de inspectie.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C2
  - number: I-C2.4
    text: |-
      De betrokkene houdt zich zo nodig gedurende enkele dagen van het verlof ter beschikking van het bevoegd gezag ten
      behoeve van werkzaamheden van onderwijskundige of schoolorganisatorische aard.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C2
  - number: I-C2.5
    text: |-
      Het totale vakantieverlof van de betrokkene, bedoeld in artikel I-C1, onder *a*1, a2 en a3, kan bij toepassing van
      het vierde lid met niet meer dan twee dagen per schooljaar worden verminderd. Voor die vermindering komen slechts
      in aanmerking de eerste en de laatste twee dagen van de zomervakantie.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C2
  - number: I-C2.7
    text: |-
      Het bevoegd gezag bepaalt tijdig na overleg met de betrokkene of, en zo ja, welke dagen voor de toepassing van het
      vierde lid van dit artikel in aanmerking komen.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C2
  - number: I-C2.8
    text: |-
      Van het eerste tot en met het zevende lid kan met het oog op de invulling van de algemene arbeidsduur per jaar
      bedoeld in artikel I-P3, tweede en derde lid, in het bijzonder onderwijs worden afgeweken op grond van een
      overeenkomst bedoeld in de [Wet op de collectieve arbeidsovereenkomst][ref1] en in het openbaar onderwijs op een
      overeenkomst die voldoet aan de voorwaarden zoals die zijn gesteld in genoemde wet.


      [ref1]: https://wetten.overheid.nl/BWBR0001937
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C2
    references:
      - id: ref1
        bwb_id: BWBR0001937
  - number: I-C3.1
    text: |-
      De betrokkene, werkzaam in deelbetrekking aan meer dan één instelling, waarvan de zomervakanties ten gevolge van
      vakantiespreiding niet in dezelfde periode vallen, heeft aanspraak op een aaneengesloten lesvrije periode van ten
      minste drie weken. Het bevoegd gezag van de instelling of instellingen waar de zomervakantie het laatst aanvangt,
      verleent daartoe aan de betrokkene desgevraagd zoveel dagen bijzonder vakantieverlof dat genoemde termijn wordt
      bereikt. Dit bijzondere vakantieverlof wordt verleend in de periode die direct voorafgaat aan de aanvang van de
      zomervakantie van bedoelde instelling of instellingen.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C3
  - number: I-C3.2
    text: |-
      Ten aanzien van de betrokkene, bedoeld in het eerste lid, is het bepaalde in artikel I-C2, vierde tot en met
      zevende lid, niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C3
  - number: I-C4.1
    text: |-
      Voor de betrokkene, die een benoeming heeft voor korter dan één jaar aan een instelling of instellingen met een
      jaarcursus, geldt artikel I-C2, eerste lid, met dien verstande, dat alleen in aanmerking komen de vakanties,
      gelegen tussen de eerste en de laatste dag van zijn werkzaamheden, tenzij de betrokkene is benoemd vóór 1 maart
      en zijn werkzaamheden voortzet tot aan de zomervakantie, in welk geval in aanmerking komen de vakanties, gelegen
      tussen de eerste dag van zijn werkzaamheden en het einde van het schooljaar.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C4
  - number: I-C4.2
    text: Het eerste lid laat onverlet de aanspraak op een evenredig gedeelte van vier weken vakantie per schooljaar.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C4
  - number: I-C5.1
    text: |-
      Bij rampen en in andere zeer buitengewone omstandigheden kan het bevoegd gezag het vakantieverlof van de betrokkene
      intrekken. Het bevoegd gezag doet hiervan zo spoedig mogelijk mededeling aan de inspectie.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C5
  - number: I-C5.2
    text: |-
      Indien de betrokkene als gevolg van de intrekking van het verlof materiële schade lijdt, wordt deze schade hem door
      het bevoegd gezag vergoed.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C5
  - number: I-C6.1
    text: |-
      Bij rampen en in andere zeer buitengewone omstandigheden kan het bevoegd gezag het vakantieverlof van de betrokkene
      intrekken. Het bevoegd gezag doet hiervan zo spoedig mogelijk mededeling aan de inspectie.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C6
  - number: I-C6.2
    text: |-
      Indien de betrokkene als gevolg van de intrekking van het verlof materiële schade lijdt, wordt deze schade hem door
      het bevoegd gezag vergoed.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C6
  - number: I-C7.1
    text: |-
      Aan de betrokkene verleent het bevoegd gezag vakantieverlof met behoud van bezoldiging. Het verlof wordt bij
      voorkeur in de schoolvakanties verleend.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C7
  - number: I-C7.2
    text: |-
      De duur van het vakantieverlof per kalenderjaar bedraagt 184 uren. De duur van het verlof wordt met 8 uren
      verlengd indien de bezoldiging of de som van de bezoldigingen in de desbetreffende betrekking bij de aanvang
      van het kalenderjaar, dan wel, in geval van indiensttreding in de loop van het kalenderjaar, op het tijdstip van
      indiensttreding, gelijk is aan of hoger is dan het maximum van schaal 8 vermeld in de bijlagen 1A en 1B.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C7
  - number: I-C7.3
    text: |-
      De ingevolge het tweede lid vastgestelde duur van het vakantieverlof wordt afhankelijk van de leeftijd, die de
      betrokkene in het desbetreffende kalenderjaar bereikt, verlengd overeenkomstig de hierna volgende tabel:





                    Leeftijd Verlenging




                    18 jaar (en jonger) 24 uren




                    19 jaar 16 uren




                    20 jaar 8 uren




                    van 30 tot en met 39 jaar 8 uren




                    van 40 tot en met 44 jaar 16 uren




                    van 45 tot en met 49 jaar 24 uren




                    van 50 tot en met 54 jaar 32 uren




                    van 55 tot en met 59 jaar 40 uren




                    60 jaar en ouder 48 uren
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C7
  - number: I-C7.4
    text: |-
      Met ingang van de dag waarop de betrokkene gebruik maakt van hoofdstuk I-V, wordt zijn aanspraak op vakantieverlof-
      uren verminderd in verhouding tot de vermindering van zijn werktijd.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C7
  - number: I-C7.5
    text: |-
      Op verzoek van de betrokkene, en voor zover de werkzaamheden aan de instelling dit toelaten, wordt hem
      het vakantieverlof ononderbroken verleend. Bij splitsing wordt ten minste de helft van het vakantieverlof
      aaneengesloten verleend.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C7
  - number: I-C8.1
    text: |-
      Op verzoek van de betrokkene trekt het bevoegd gezag in geval van samenloop met andere vormen van verlof en in
      andere daarvoor redelijkerwijs in aanmerking komende gevallen het verleende vakantieverlof in. Het niet genoten
      vakantieverlof wordt in overleg met de betrokkene opnieuw verleend.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C8
  - number: I-C8.2
    text: |-
      Bij rampen en in andere zeer buitengewone omstandigheden kan het bevoegd gezag het vakantieverlof van de betrokkene
      intrekken.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C8
  - number: I-C8.3
    text: |-
      Indien de betrokkene als gevolg van de intrekking van het verlof materiële schade lijdt, wordt deze schade hem door
      het bevoegd gezag vergoed.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C8
  - number: I-C8.4
    text: |-
      Het geheel of gedeeltelijk ingetrokken aantal uren vakantieverlof komt niet in aanmerking bij de berekening van het
      aantal genoten verlofuren.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C8
  - number: I-C10
    text: 'In deze paragraaf wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C10
  - number: I-C10.a
    text: 'betrokkene: de betrokkene, bedoeld in artikel I-A1, onder *e*4;'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C10
  - number: I-C10.b
    text: 'uur: klokuur'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C10
  - number: I-C11.1
    text: Aan de betrokkene verleent het bevoegd gezag in elk kalenderjaar vakantieverlof met behoud van bezoldiging.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C11
  - number: I-C11.2
    text: |-
      De duur van het vakantieverlof per kalenderjaar wordt afhankelijk van het salaris in de desbetreffende betrekking
      bij de aanvang van het kalenderjaar, dan wel, in geval van indiensttreding in de loop van het kalenderjaar, op
      het tijdstip van indiensttreding vastgesteld volgens onderstaande tabel, waarbij onder schaal wordt verstaan de
      desbetreffende schaal bedoeld in hoofdstuk I-P.






                    Bezoldiging


                    Duur van het vakantieverlof






                    a. lager dan het maximum van schaal 8


                    184 uren




                    b. gelijk aan of hoger dan het maximum van schaal 8


                    192 uren
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C11
  - number: I-C11.3
    text: |-
      De ingevolge het tweede lid vastgestelde duur van het vakantieverlof wordt afhankelijk van de leeftijd die de
      betrokkene in het desbetreffende kalenderjaar bereikt, verlengd overeenkomstig de hierna volgende tabel:





                    Leeftijd Verlenging




                    18 jaar (en jonger) 24 uren




                    19 jaar 16 uren




                    20 jaar 8 uren




                    van 30 tot en met 39 jaar 8 uren




                    van 40 tot en met 44 jaar 16 uren




                    van 45 tot en met 49 jaar 24 uren




                    van 50 tot en met 54 jaar 32 uren




                    van 55 tot en met 59 jaar 40 uren




                    60 jaar en ouder 48 uren
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C11
  - number: I-C11.4
    text: Het derde lid is niet van toepassing op de betrokkene die gebruik maakt van hoofdstuk I-V.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C11
  - number: I-C11.5
    text: |-
      Met ingang van de dag waarop de betrokkene gebruik maakt van hoofdstuk I-V, wordt zijn aanspraak op vakantieverlof-
      uren verminderd in verhouding tot de vermindering van zijn werktijd.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C11
  - number: I-C11.6
    text: |-
      Op verzoek van de betrokkene en voor zover de werkzaamheden aan de instelling dit toelaten, wordt hem
      het vakantieverlof ononderbroken verleend. Bij splitsing wordt ten minste de helft van het vakantieverlof
      aaneengesloten verleend.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C11
  - number: I-C12.1
    text: |-
      Onverminderd het bepaalde in artikel I-C11, vierde lid, heeft de betrokkene gedurende de eerste 6 maanden van zijn
      betrekking slechts aanspraak op vakantieverlof naar reden van 1/12 gedeelte van het naar artikel I-C11, tweede
      en derde lid, berekende aantal uren vakantieverlof voor iedere volle kalendermaand, dat hij in genoemd tijdvak
      werkelijke dienst heeft vervuld.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C12
  - number: I-C12.2
    text: |-
      Het aantal uren waarop ingevolge het vorige lid aanspraak op vakantie bestaat wordt zonodig naar beneden afgerond
      op hele uren.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C12
  - number: I-C13.1
    text: |-
      Op verzoek van de betrokkene trekt het bevoegd gezag in geval van samenloop met andere vormen van verlof en in
      andere daarvoor redelijkerwijs in aanmerking komende gevallen het verleende vakantieverlof in. Het niet genoten
      vakantieverlof wordt in overleg met de betrokkene opnieuw verleend.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C13
  - number: I-C13.2
    text: |-
      Bij rampen en in andere zeer buitengewone omstandigheden kan het bevoegd gezag het vakantieverlof van de betrokkene
      intrekken. Het bevoegd gezag doet hiervan zo spoedig mogelijk mededeling aan de inspectie.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C13
  - number: I-C13.3
    text: |-
      Indien de betrokkene als gevolg van de intrekking van het verlof materiële schade lijdt, wordt deze schade hem door
      het bevoegd gezag vergoed.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C13
  - number: I-C13.4
    text: |-
      Het geheel of gedeeltelijk ingetrokken aantal uren vakantieverlof komt niet in aanmerking bij de berekening van het
      aantal genoten verlofuren.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C13
  - number: I-C15
    text: 'In deze paragraaf wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C15
  - number: I-C15.a
    text: 'betrokkene: de betrokkene bedoeld in artikel I-A1, onder *e*6;'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C15
  - number: I-C15.b
    text: |-
      betrokkene behorend tot het educatief personeel: de betrokkene, bedoeld in artikel I-A1, onder *e*6, voor zover het
      betreft de directeur/coördinator, adjunct-directeur/coördinator en educatief werker;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C15
  - number: I-C15.c
    text: |-
      betrokkene behorend tot het overige personeel: de betrokkene, bedoeld in artikel I-A1, onder *e*6, voor zover het
      betreft een lid van het onderwijsondersteunend personeel;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C15
  - number: I-C15.d
    text: |-
      betrokkene bij het vormingswerk, mbo, vavo en bbo: de betrokkene, bedoeld in artikel I-A1, onder *e*5, *e*14, *e*17
      en *e*18 voor zover het betreft:
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C15
  - number: I-C15.d.1
    text: het lid van de centrale directie;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C15
  - number: I-C15.d.2
    text: |-
      de leraar, met uitzondering van de leraar, bedoeld in de artikelen I-R1212, eerste of derde lid, I-R1412, eerste of
      derde lid en I-R1512, eerste of derde lid;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C15
  - number: I-C15.e
    text: 'uur: klokuur.'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C15
  - number: I-C16.1
    text: |-
      De betrokkene behorend tot het educatief personeel, bedoeld in artikel I-C15, onderdeel *b*, en onderdeel *d* heeft
      per kalenderjaar recht op 184 uren vakantieverlof met behoud van bezoldiging.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C16
  - number: I-C16.2
    text: |-
      Aan de betrokkene, behorend tot het overige personeel, verleent het bevoegd gezag vakantieverlof met behoud van
      bezoldiging. De duur van het vakantieverlof per kalenderjaar wordt afhankelijk van het salaris in de desbetreffende
      betrekking bij de aanvang van het kalenderjaar, dan wel, in geval van indiensttreding in de loop van het
      kalenderjaar, op het tijdstip van indiensttreding vastgesteld volgens onderstaande tabel, waarbij onder schaal
      wordt verstaan de desbetreffende schaal, bedoeld in hoofdstuk I-P.






                    Bezoldiging


                    Duur van het vakantieverlof






                    a. lager dan het maximum van schaal 9


                    184 uren




                    b. gelijk aan of hoger dan het maximum van schaal 9


                    192 uren
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C16
  - number: I-C16.3
    text: |-
      De ingevolge het vorige lid vastgestelde duur van het vakantieverlof wordt afhankelijk van de leeftijd, die de
      betrokkene in het desbetreffende kalenderjaar bereikt, verlengd overeenkomstig de hierna volgende tabel:





                    Leeftijd Verlenging




                    18 jaar (en jonger) 24 uren




                    19 jaar 16 uren




                    20 jaar 8 uren




                    van 30 tot en met 39 jaar 8 uren




                    van 40 tot en met 44 jaar 16 uren




                    van 45 tot en met 49 jaar 24 uren




                    van 50 tot en met 54 jaar 32 uren




                    van 55 tot en met 59 jaar 40 uren




                    60 jaar en ouder 48 uren
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C16
  - number: I-C16.4
    text: |-
      Voor zover de werkzaamheden aan de instelling dit toelaten, wordt het vakantieverlof ononderbroken verleend. Bij
      splitsing wordt ten minste de helft van het vakantieverlof aaneengesloten verleend.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C16
  - number: I-C16.5
    text: |-
      Het tijdstip van het vakantieverlof wordt na overleg met de betrokkene door het bevoegd gezag vastgesteld.
      Ten aanzien van de betrokkene, bedoeld in artikel I-A1, onder *e*5, geschiedt dit in de periode, waarin geen
      vormingsactiviteiten met de deelnemers plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C16
  - number: I-C16.6
    text: |-
      In bijzondere gevallen kan het bevoegd gezag op verzoek van de betrokkene vakantieverlof verlenen buiten de
      periode, genoemd in het vijfde lid.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C16
  - number: I-C16.7
    text: |-
      Het bevoegd gezag kan, in bijzondere gevallen en nadat vóór de contractperiode met de betrokkene die werkzaamheden
      in verband met contractactiviteiten gaat verrichten daarover overeenstemming is bereikt, in plaats van het verlof,
      bedoeld in het eerste, tweede en derde lid, verlof verlenen in de periode waarin vormingsactiviteiten met de
      deelnemers plaatsvinden. Het bevoegd gezag doet hiervan mededeling aan de inspectie.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C16
  - number: I-C16.8
    text: Het vierde lid is niet van toepassing op de betrokkene die gebruik maakt van hoofdstuk I-V.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C16
  - number: I-C16.9
    text: |-
      Met ingang van de dag waarop de betrokkene gebruik maakt van hoofdstuk I-V, wordt zijn aanspraak op vakantieverlof-
      uren verminderd in verhouding tot de vermindering van zijn werktijd.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C16
  - number: I-C17.1
    text: |-
      De betrokkene, die slechts een gedeelte van het kalenderjaar in dienst is, heeft in dat kalenderjaar recht op een
      evenredig deel van het in artikel I-C16, eerste en tweede lid, vastgestelde aantal uren vakantieverlof met behoud
      van bezoldiging.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C17
  - number: I-C17.2
    text: Het derde en vierde lid van artikel I-C16 is van toepassing.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C17
  - number: I-C18.1
    text: |-
      Op verzoek van de betrokkene trekt het bevoegd gezag in geval van samenloop met andere vormen van verlof en in
      andere daarvoor redelijkerwijs in aanmerking komende gevallen het verleende vakantieverlof in. Het niet genoten
      vakantieverlof wordt in overleg met de betrokkene opnieuw verleend.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C18
  - number: I-C18.2
    text: |-
      Bij rampen en in andere zeer buitengewone omstandigheden kan het bevoegd gezag met goedvinden van de betrokkene het
      vakantieverlof intrekken.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C18
  - number: I-C18.3
    text: |-
      Indien de betrokkene als gevolg van de intrekking van het vakantieverlof materiële schade lijdt, wordt deze schade
      hem door het bevoegd gezag vergoed.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C18
  - number: I-C18.4
    text: |-
      Voor de betrokkene komt het geheel of gedeeltelijk ingetrokken aantal uren vakantieverlof niet in aanmerking bij de
      berekening van het aantal genoten verlofuren.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C18
  - number: I-C19.1
    text: |-
      Aan de betrokkene, behorend tot het educatief dan wel onderwijzend personeel, wordt bovendien, boven het
      vakantieverlof bedoeld in de artikelen I-C16 en I-C17, verlof met behoud van bezoldiging verleend met Kerstmis
      en Pasen.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C19
  - number: I-C19.2
    text: |-
      Het verlof met Kerstmis omvat de dagen in een aaneengesloten periode van 10 kalenderdagen. Eerste kerstdag, tweede
      kerstdag en nieuwjaarsdag moeten binnen de in de eerste volzin bedoelde periode vallen.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C19
  - number: I-C19.3
    text: |-
      Het verlof met Pasen omvat de dagen in een aaneengesloten periode van 10 kalenderdagen. Goede Vrijdag, eerste
      paasdag en tweede paasdag moeten binnen de in de eerste volzin bedoelde periode vallen.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C19
  - number: I-C19.4
    text: Het bevoegd gezag stelt de begindata vast van de in het tweede en derde lid van dit artikel bedoelde periode.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C19
  - number: I-C19.5
    text: Het bepaalde in artikel I-C18, eerste tot en met derde lid, is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C19
  - number: I-C20
    text: |-
      In het georganiseerd overleg op instellingsniveau als bedoeld in hoofdstuk IV-E kan worden overeengekomen af te
      wijken van het bepaalde in artikel I-C19 mits daarbij de taakomvang op jaarbasis ongewijzigd blijft en voor zover
      het dienstbelang zich niet tegen die afwijking verzet.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C20
  - number: I-C21
    text: |-
      In deze paragraaf wordt verstaan onder: betrokkene: de betrokkene, bedoeld in artikel I-A1, onder *e*7, *e*12 en
      *e*13.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C21
  - number: I-C22
    text: |-
      Aan de betrokkene verleent het bevoegd gezag vakantieverlof met behoud van bezoldiging met inachtneming van de
      regelen, gesteld in deze paragraaf.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C22
  - number: I-C23.1
    text: |-
      Het bevoegd gezag verleent het vakantieverlof in beginsel gedurende de perioden waarom de betrokkene heeft
      verzocht. De perioden kunnen vallen buiten de vakanties van de instellingen, bedoeld in artikel I-A1, onder *d*1
      of *d*2. Slechts in bijzondere omstandigheden kan het bevoegd gezag in verband met het dienstbelang beslissen dat
      het vakantieverlof niet of niet geheel in de gevraagde periode wordt verleend. Bij splitsing van het vakantieverlof
      wordt dit voor ten minste de helft van de ingevolge artikel I-C24 geldende duur aaneengesloten verleend.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C23
  - number: I-C23.2
    text: |-
      Aan de betrokkene wordt in enig kalenderjaar niet genoten vakantieverlof zoveel mogelijk in een volgend
      kalenderjaar verleend, met dien verstande dat in geen kalenderjaar meer uren vakantieverlof kunnen worden opgenomen
      dan anderhalf maal het hem volgens artikel I-C24 toekomende aantal.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C23
  - number: I-C23.3
    text: |-
      Indien de betrokkene in enig kalenderjaar meer vakantie heeft genoten, dan waarop hij ingevolge deze paragraaf
      recht heeft, wordt dit meerdere verrekend met het hem over één of meer volgende kalenderjaren toekomende
      vakantieverlof. Het bepaalde in de vorige volzin geldt met dien verstande, dat uit dien hoofde in enig kalenderjaar
      het vakantieverlof nimmer met meer dan een derde gedeelte van hetgeen de betrokkene ingevolge het bepaalde in de
      artikelen I-C24 en I-C25 toekomt, mag worden verminderd.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C23
  - number: I-C24.1
    text: |-
      De duur van het vakantieverlof per kalenderjaar bedraagt 184 uren. De duur van het verlof wordt met 8 uren
      verlengd indien de bezoldiging of de som van de bezoldigingen in de desbetreffende betrekking bij de aanvang
      van het kalenderjaar, dan wel, in geval van indiensttreding in de loop van het kalenderjaar, op het tijdstip van
      indiensttreding, gelijk is aan of hoger is dan het maximum van schaal 9 vermeld in de bijlagen 1A en 1B.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C24
  - number: I-C24.2
    text: |-
      De ingevolge het eerste lid vastgestelde duur van het vakantieverlof wordt afhankelijk van de leeftijd, die de
      betrokkene in het desbetreffende kalenderjaar bereikt, verlengd overeenkomstig de hierna volgende tabel:





                    Leeftijd Verlenging




                    18 jaar (en jonger) 24 uren




                    19 jaar 16 uren




                    20 jaar 8 uren




                    van 30 tot en met 39 jaar 8 uren




                    van 40 tot en met 44 jaar 16 uren




                    van 45 tot en met 49 jaar 24 uren




                    van 50 tot en met 54 jaar 32 uren




                    van 55 tot en met 59 jaar 40 uren




                    60 jaar en ouder 48 uren
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C24
  - number: I-C24.3
    text: |-
      Met ingang van de dag waarop de betrokkene gebruik maakt van hoofdstuk I-V, wordt zijn aanspraak op vakantieverlof-
      uren verminderd in verhouding tot de vermindering van zijn werktijd.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C24
  - number: I-C25.1
    text: |-
      Indien het dienstverband van de betrokkene zich niet over een geheel kalenderjaar uitstrekt, wordt de duur van
      het vakantieverlof, bedoeld in artikel I-C24, verminderd naar evenredigheid met de werkelijke duur van zijn
      dienstverband.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C25
  - number: I-C25.2
    text: |-
      Indien de betrokkene niet met een volledige weektaak is belast, heeft hij aanspraak op vakantieverlof gedurende een
      tijd die evenredig is aan de duur van het vakantieverlof in een normbetrekking.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C25
  - number: I-C25.3
    text: |-
      De uitkomst van de berekening, bedoeld in het eerste en tweede lid, wordt zonodig naar boven afgerond op een geheel
      aantal uren.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C25
  - number: I-C26.1
    text: |-
      Op verzoek van de betrokkene trekt het bevoegd gezag in geval van samenloop met andere vormen van verlof en in
      andere daarvoor redelijkerwijs in aanmerking komende gevallen het verleende vakantieverlof in. Het niet genoten
      vakantieverlof wordt in overleg met de betrokkene op een ander tijdstip verleend.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C26
  - number: I-C26.2
    text: |-
      Bij rampen en in andere zeer buitengewone omstandigheden kan het bevoegd gezag het vakantieverlof van de betrokkene
      intrekken. Het bepaalde in de laatste zin van het eerste lid is van toepassing.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C26
  - number: I-C26.3
    text: |-
      Indien de betrokkene als gevolg van de intrekking van het vakantieverlof materiële schade lijdt, wordt deze schade
      hem door het bevoegd gezag vergoed.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C26
  - number: I-C28
    text: 'In deze paragraaf wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C28
  - number: I-C28.a
    text: 'jaar:'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C28
  - number: I-C28.a.1
    text: |-
      ten aanzien van de betrokkene, bedoeld in artikel I-A1, onder e1, e2 of e16, voor zover het niet betreft een lid
      van het onderwijsondersteunend personeel: een schooljaar;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C28
  - number: I-C28.a.2
    text: |-
      ten aanzien van de betrokkene, bedoeld in artikel I-A1, onder e1, e2 of e16, voor zover het betreft een lid van
      het onderwijsondersteunend personeel, alsmede de betrokkene, bedoeld in artikel I-A1, onder *e*4 tot en met *e*7 en
      *e*10, *e*12 tot en met 18: een kalenderjaar;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C28
  - number: I-C28.b
    text: |-
      dag: elke dag die volgens het schema van werkzaamheden dan wel het lesrooster een werkdag is van de instelling; een
      dag kan worden verdeeld in twee halve dagen, tenzij de verlofgrond zich daartegen verzet.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C28
  - number: I-C29.1
    text: |-
      Het bevoegd gezag verleent de betrokkene kort buitengewoon verlof met behoud van bezoldiging, behoudens
      het bepaalde in het derde lid, voor zover zijn werkzaamheden samenvallen met één of meer van de navolgende
      omstandigheden:
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C29
  - number: I-C29.1.a
    text: |-
      de uitoefening van het kiesrecht, indien en voor zover deze niet in vrije tijd kan geschieden en omzetting van
      dienst niet mogelijk is;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C29
  - number: I-C29.1.b
    text: |-
      het voldoen aan een wettelijke verplichting, indien en voor zover dit niet in vrije tijd kan geschieden en
      omzetting van dienst niet mogelijk is;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C29
  - number: I-C29.1.c
    text: |-
      het afleggen van een van rijkswege afgenomen of erkend examen of tentamen, voor zover die niet in vrije tijd kan
      geschieden en omzetting van dienst niet mogelijk is;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C29
  - number: I-C29.1.d
    text: |-
      het bijwonen van vergaderingen of zittingen van of het verrichten van werkzaamheden voor publiekrechtelijke
      colleges, waarin de betrokkene is benoemd of gekozen, voor zover dit niet in vrije tijd kan geschieden;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C29
  - number: I-C29.1.e
    text: |-
      , het uitoefenen van het lidmaatschap van een van rijkswege ingestelde of erkende examencommissie of het optreden
      als rijksgecommitteerde bij een examen, voor in totaal ten hoogste 14 dagen per jaar in overleg met het bevoegd
      gezag vast te stellen;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C29
  - number: I-C29.1.f
    text: |-
      verhuizing in geval van verandering van standplaats: indien de betrokkene een eigen huishouding heeft, voor twee,
      in bijzondere gevallen ten hoogste vier dagen en indien de betrokkene geen eigen huishouding heeft, voor ten
      hoogste twee dagen;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C29
  - number: I-C29.1.g
    text: |-
      verhuizing anders dan in geval van verandering van standplaats: indien de betrokkene een eigen huishouding heeft,
      voor ten hoogste twee dagen per jaar;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C29
  - number: I-C29.1.h
    text: het zoeken van een woning in geval van verandering van standplaats, voor ten hoogste twee dagen;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C29
  - number: I-C29.1.i
    text: |-
      ondertrouw of de aangifte van het voornemen om een geregistreerd partnerschap aan te gaan, van de betrokkene, voor
      één dag;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C29
  - number: I-C29.1.j
    text: |-
      burgerlijk of kerkelijk huwelijk of registratie van het partnerschap van de betrokkene, voor in totaal vier dagen,
      voor zover de huwelijksdag of -dagen of de dag van registratie van het partnerschap hier binnen vallen;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C29
  - number: I-C29.1.k
    text: |-
      huwelijk of registratie van het partnerschap van bloed- of aanverwanten van de eerste of tweede graad, voor één dag
      of ten hoogste twee dagen, al naar gelang dit huwelijk of deze registratie van het partnerschap wordt gesloten in
      of buiten de woonplaats van de betrokkene;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C29
  - number: I-C29.1.l
    text: |-
      ernstige ziekte van echtgenoot, ouders of kinderen, stief-, schoon- of pleegfamilieleden daaronder begrepen, voor
      ten hoogste twee weken, tenzij blijkens een over te leggen geneeskundige verklaring gedurende een langere termijn
      de voortdurende aanwezigheid van de betrokkene bij de zieke, anders dan ter verpleging, noodzakelijk is;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C29
  - number: I-C29.1.m
    text: |-
      overlijden van de onder *l* bedoelde personen, voor vier dagen; van bloed- of aanverwanten in de tweede graad, voor
      twee dagen; van bloed- of aanverwanten in de derde of vierde graad, voor ten hoogste één dag; is de betrokkene in
      de twee laatstgenoemde gevallen belast met de regeling van de begrafenis of van de nalatenschap, dan wordt verlof
      verleend voor ten hoogste vier dagen;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C29
  - number: I-C29.1.n
    text: bevalling van de echtgenote, voor ten hoogste twee dagen;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C29
  - number: I-C29.1.o
    text: |-
      het 25-, 40- en 50-jarig ambts- of huwelijksjubileum dan wel jubileum van de registratie van het partnerschap
      van de betrokkene en het 25-, 40-, 50- en 60-jarig huwelijksjubileum dan wel jubileum van de registratie van het
      partnerschap van zijn ouders, stief-, schoon- of pleegouders daaronder begrepen, voor één dag;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C29
  - number: I-C29.1.p
    text: |-
      kerkelijke bevestiging of eerste communie van de betrokkene, zijn echtgenote en kinderen, stief-, schoon- of
      pleegkinderen daaronder begrepen, voor één dag;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C29
  - number: I-C29.1.q
    text: |-
      adoptie van een kind, voor ten hoogste vijf dagen; in geval van adoptie van een buitenlands kind wordt, indien
      verlof noodzakelijk is om de betrokkene in staat te stellen in het desbetreffende land het nodige te verrichten,
      éénmaal per geval van adoptie, verlof verleend voor de duur van de noodzakelijke reis- en verblijftijd tot ten
      hoogste zes weken;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C29
  - number: I-C29.1.r
    text: |-
      het voldoen aan een verzoek van een commissie van beroep, als bedoeld
      in [artikel 60, eerste lid, van de Wet op het primair onderwijs][ref1],
      [artikel 63, eerste lid, van de Wet op de expertisecentra][ref2],
      [artikel 181, eerste lid, van de Wet op het voortgezet onderwijs][ref3]” artikel 93 van de Wet op het hoger
      beroepsonderwijs, artikel 2.49 en 2.57 van de Wet op het cursorisch beroepsonderwijs, artikel 22 van het Besluit
      vormingswerk voor jeugdigen, artikel 64 van de Wet op de onderwijsverzorging en artikel 11 van de Kaderwet
      Volwasseneducatie 1991, van dit besluit, om als getuige of deskundige te worden gehoord, voor zover dit niet in
      vrije tijd kan geschieden en omzetting van dienst niet mogelijk is;


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel60
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel63
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel181
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C29
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '60'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '63'
      - id: ref3
        bwb_id: BWBR0002399
        artikel: '181'
  - number: I-C29.1.s
    text: |-
      jeugd- en jongerenwerk als bedoeld in de door Onze Minister getroffen regeling, voor telkens ten hoogste 5 dagen,
      met dien verstande dat per schooljaar in totaal niet meer dan 10 dagen verlof worden verleend;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C29
  - number: I-C29.1.t
    text: |-
      voor zover het betreft de betrokkene, bedoeld in artikel I-A1 onder *e*1: het vervullen van een stage in het
      kader van deelname aan een door Onze Minister aan te wijzen applicatiecursus basisonderwijs, voor twee dagen per
      schooljaar;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C29
  - number: I-C29.1.u
    text: |-
      voor zover het betreft de betrokkene, bedoeld in artikel I-A1, onder *e*6: het volgen van een cursus, die naar het
      oordeel van het bevoegd gezag in het belang van de basiseducatie wordt geacht, en voor zover Onze minister op een
      verzoek van het betrokken bevoegd gezag instemmend heeft beschikt;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C29
  - number: I-C29.1.v
    text: |-
      een calamiteit, waaronder wordt verstaan een plotseling optredende gebeurtenis, die uit zijn aard niet te voorzien
      is en waarvoor zonder uitstel maatregelen door betrokkene moeten worden genomen, voor ten hoogste een werkdag en
      maximaal 3 calamiteiten per jaar.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C29
  - number: I-C29.2
    text: |-
      Indien de in het eerste lid, onder *d,* genoemde omstandigheid zich voordoet en de betrokkene een vaste vergoeding
      ontvangt in verband met de aktiviteiten waarvoor hem verlof wordt verleend, wordt op zijn bezoldiging een inhouding
      toegepast over de tijd, dat hij het verlof geniet. Deze inhouding gaat hetgeen de betrokkene kan worden geacht te
      ontvangen als vaste vergoeding voor de aktiviteiten verricht gedurende de met het verlof overeenkomende tijd niet
      te boven.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C29
  - number: I-C29.3
    text: |-
      Indien de betrokkene er naar het oordeel van het bevoegd gezag niet in slaagt achteraf aannemelijk te maken dat er
      daadwerkelijk sprake is van een situatie als bedoeld in het eerste lid, onder *v*, kan het op het verlof betrekking
      hebbende salaris in mindering worden gebracht op het salaris, dan wel kan het verlof bij een betrokkene in de zin
      van hoofdstuk I-S, in mindering worden gebracht op het vakantieverlof.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C29
  - number: I-C29a
    text: |-
      Het bevoegd gezag verleent de betrokkene gedurende een door Onze minister te bepalen aantal dagen of uren kort
      buitengewoon verlof met behoud van bezoldiging indien deze met toestemming van het bevoegd gezag deelneemt aan een
      door Onze Minister aan te wijzen nascholingscursus en voor zover zijn werkzaamheden daarmee samenvallen.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C29a
  - number: I-C30
    text: |-
      In andere dan in artikel I-C29, eerste en tweede lid, bedoelde gevallen kan het bevoegd gezag de betrokkene
      bovendien kort buitengewoon verlof verlenen voor ten hoogste vier dagen per jaar, al dan niet met behoud van
      bezoldiging.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C30
  - number: I-C31.1
    text: |-
      Het bevoegd gezag kan aan een betrokkene op diens verzoek uit het geheel of een deel van zijn werkzaamheden lang
      buitengewoon verlof verlenen. Indien dit verlof wordt verleend is het bepaalde in één van de artikelen I-C32, I-
      C33 of I-C34 van toepassing, al naar gelang het betreft verlof uitsluitend in het persoonlijk belang, mede in het
      algemeen belang, dan wel overwegend in het algemeen belang.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C31
  - number: I-C31.2
    text: |-
      Het verlof gaat niet eerder in dan nadat de betrokkene zich schriftelijk akkoord heeft verklaard met de voorwaarden
      waaronder het verlof wordt verleend.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C31
  - number: I-C31.3
    text: |-
      De voorwaarden bevatten in ieder geval een regeling met betrekking tot de betaling van door de betrokkene
      aan het bevoegd gezag verschuldigde premiebijdragen ter zake van pensioenen, vervroegde uittreding en sociale
      verzekeringen, volgens bij of krachtens dit besluit nader te stellen regels.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C31
  - number: I-C31.4
    text: |-
      Het verlof strekt zich naar evenredigheid geheel of gedeeltelijk uit over de schoolvakantie dan wel wordt het
      vakantieverlof naar evenredigheid verminderd.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C31
  - number: I-C31.5
    text: |-
      Op verzoek van de betrokkene kan het bevoegd gezag in geval van samenloop met andere vormen van verlof, niet
      zijnde vakantieverlof en in andere daarvoor in aanmerking komende gevallen het verleende verlof opschorten dan wel
      intrekken en op een ander tijdstip opnieuw verlenen.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C31
  - number: I-C31.6
    text: |-
      De voorschriften in dit artikel zijn niet van toepassing, indien met medewerking van alle betrokkenen het beoogde
      doel door een omzetting van dienst is te bereiken.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C31
  - number: I-C32
    text: |-
      Het verlof, bedoeld in artikel I-C31, dat uitsluitend strekt in het persoonlijk belang van de betrokkene, kan voor
      ten hoogste 6 maanden worden verleend en kan ten hoogste tweemaal voor ten hoogste 6 maanden worden verlengd. Dit
      verlof wordt verleend zonder behoud van bezoldiging.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C32
  - number: I-C33
    text: 'Het verlof, bedoeld in artikel I-C31, dat:'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C33
  - number: I-C33.a
    text: is aan te merken als studieverlof, dan wel,
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C33
  - number: I-C33.b
    text: ten doel heeft de betrokkene in de gelegenheid te stellen een andere functie te vervullen,
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C33
  - number: I-C34.1
    text: |-
      Het verlof, bedoeld in artikel I-C31, dat ten doel heeft de betrokkene in de gelegenheid te stellen anders dan in
      vaste dienst een functie te vervullen:
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C34
  - number: I-C34.1.a
    text: in dienst van een volkenrechtelijke organisatie,
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C34
  - number: I-C34.1.b
    text: ten behoeve van de Nederlandse Antillen of Aruba,
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C34
  - number: I-C34.1.c
    text: als deskundige ten behoeve van een vreemde mogendheid,
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C34
  - number: I-C34.1.d
    text: |-
      in het kader van internationale hulpverlening aan ontwikkelingslanden, kan, indien Onze minister heeft verklaard,
      dat met de verlofverlening het algemeen belang in overwegende mate wordt gediend, voor ten hoogste drie jaren
      worden verleend en kan ten hoogste tweemaal voor ten hoogste 1 jaar worden verlengd. Dit verlof wordt in beginsel
      verleend zonder behoud van bezoldiging.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C34
  - number: I-C34.2
    text: |-
      Verlof verleend voor de vervulling van functies aan een instelling van onderwijs, door de regering van het
      ontvangende land in stand gehouden dan wel erkend, wordt in ieder geval geacht in overwegende mate het algemeen
      belang te dienen.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C34
  - number: I-C35.1
    text: 'De betrokkene die:'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C35
  - number: I-C35.1.a
    text: het lidmaatschap van de Tweede Kamer der Staten-Generaal,
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C35
  - number: I-C35.1.b
    text: de functie van lid van Gedeputeerde Staten van een provincie,
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C35
  - number: I-C35.1.c
    text: de functie van substituut-ombudsman,
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C35
  - number: I-C35.2
    text: |-
      Aan de betrokkene die de functie van wethouder van een gemeente aanvaardt, verleent het bevoegd gezag op zijn
      verzoek voor het geheel of een deel van zijn werkzaamheden lang buitengewoon verlof zonder behoud van bezoldiging.
      Voor zover de uitoefening van de taak bij de instelling wordt geschaad, kan dit verlof door het bevoegd gezag onder
      goedkeuring van Onze minister ook eigener beweging worden verleend, mits de betrokkene te voren is gehoord.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C35
  - number: I-C35.3
    text: |-
      Tijdens dit verlof heeft de betrokkene zo nodig aanspraak op een nonactiviteitswedde op de voet van het daaromtrent
      in de [Wet Incompatibiliteiten Staten-Generaal en Europees Parlement][ref1] ten aanzien van de leden van de Tweede
      Kamer der Staten-Generaal bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0006612
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C35
    references:
      - id: ref1
        bwb_id: BWBR0006612
  - number: I-C36.1
    text: |-
      Indien de betrokkene na afloop van een hem verleend lang buitengewoon verlof, als bedoeld in de artikelen I-C31 tot
      en met I-C35, als gevolg van beperking van de formatieomvang van de instelling zijn werkzaamheden, mede gezien de
      afvloeiingsregeling, geheel of gedeeltelijk niet kan hervatten, vormt zulks een grond voor ontslag, respectievelijk
      vermindering van de taakomvang.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C36
  - number: I-C36.2
    text: |-
      De betrokkene die na afloop van een hem verleend lang buitengewoon verlof zijn werkzaamheden niet te bestemder tijd
      hervat, wordt voor de toepassing van dit besluit geacht te zijn ontslagen.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C36
  - number: I-C36.3
    text: |-
      Het tweede lid is niet van toepassing indien de betrokkene binnen een redelijke termijn aannemelijk maakt dat hij
      geldige redenen had zijn dienst niet te hervatten, in welk geval het verlof geacht wordt te zijn verlengd tot het
      tijdstip, waarop bedoelde redenen hebben opgehouden te bestaan.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C36
  - number: I-C37
    text: |-
      Het bevoegd gezag verleent aan de vrouwelijke betrokkene die een borstkind heeft en die hiervan aan hem kennis
      heeft gegeven behoorlijke gelegenheid haar kind te zogen.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C37
  - number: I-C38.1
    text: |-
      Het bevoegd gezag verleent de betrokkene, indien daartoe volgens door Onze minister te geven nadere regels
      aanleiding bestaat, desgevraagd kort of lang buitengewoon verlof uit het geheel of een deel van zijn werkzaamheden
      voor:
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C38
  - number: I-C38.1.a
    text: |-
      het verrichten van werkzaamheden van rechtspositionele aard in of ten behoeve van commissies voor georganiseerd
      overleg als bedoeld in onderscheidenlijk de hoofdstukken IV-C, IV-E en IV-F van dit besluit en het
      [Overlegbesluit onderwijspersoneel][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006446
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C38
    references:
      - id: ref1
        bwb_id: BWBR0006446
  - number: I-C38.1.b
    text: |-
      het verrichten van werkzaamheden ten behoeve van een in de Raad voor het Overheidspersoneelsbeleid
      vertegenwoordigde centrale van verenigingen van ambtenaren of een bij zo’n centrale aangesloten vereniging waarvan
      hij lid is;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C38
  - number: I-C38.1.c
    text: |-
      het op uitnodiging van een Centrale of vereniging als bedoeld onder *b*, als cursist deelnemen aan een cursus voor
      ten hoogste 6 dagen per twee schooljaren, voor zover omzetting van de dienst niet mogelijk is.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C38
  - number: I-C38.2
    text: |-
      Het bevoegd gezag verleent de betrokkene, indien daartoe volgens door Onze minister te geven nadere regels
      aanleiding bestaat, desgevraagd kort of lang buitengewoon verlof uit het geheel of een deel van zijn werkzaamheden
      voor:
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C38
  - number: I-C38.2.a
    text: |-
      het verrichten van werkzaamheden van onderwijskundige aard in of ten behoeve van de Centrale Commissie voor
      Onderwijsoverleg, dan wel één van de onder de Centrale Commissie voor Onderwijsoverleg ressorterende commissies
      voor onderwijsoverleg;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C38
  - number: I-C38.2.b
    text: het verrichten van werkzaamheden ten behoeve van door Onze minister aan te wijzen adviescommissies.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C38
  - number: I-C38.3
    text: |-
      Het verlof, bedoeld in het eerste of het tweede lid, wordt verleend met behoud van bezoldiging. Omtrent de wijze
      waarop dit verlof wordt aangevraagd, de maximumduur en de omvang, alsmede de overige voorwaarden en gevolgen van
      dit verlof, geeft Onze minister nadere regels.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C38
  - number: I-C38.4
    text: |-
      In afwijking van het bepaalde in het derde lid wordt het verlof, bedoeld in het eerste lid, dat met name ten doel
      heeft de betrokkene in staat te stellen de functie van bezoldigd bestuurder van een onder *b* van dat lid bedoelde
      Centrale of vereniging te vervullen, voor ten hoogste twee jaren en zonder behoud van bezoldiging verleend.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C38
  - number: I-C38.5
    text: |-
      Indien op grond van het eerste of het tweede lid lang buitengewoon verlof wordt verleend, is ten aanzien van de
      afloop daarvan het bepaalde in artikel I-C36 van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C38
  - number: I-C39.1
    text: |-
      Het bevoegd gezag verleent de betrokkene desgevraagd buitengewoon verlof in verband met ouderschap. Het
      ouderschapsverlof wordt zonder behoud van bezoldiging verleend en wordt uitsluitend verleend aan de betrokkene
      van wie het dienstverband in het onderwijs ten minste twaalf maanden heeft geduurd op de ingangsdatum van het
      verlof. De aanvraag gaat vergezeld van bewijsstukken waarmee het recht op verlof en de omvang van dat recht worden
      aangetoond en wordt afgehandeld uiterlijk 4 weken nadat deze door het bevoegd gezag is ontvangen.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C39
  - number: I-C39.2
    text: |-
      Een betrokkene die als ouder in familierechtelijke betrekking staat totéé n kind heeft recht op 995 uur
      ouderschapsverlof. Indien een betrokkene als ouder tegelijkertijd tot meer dan één kind in een familierechtelijke
      betrekking staat, bestaat er ten aanzien van elk ander kind dan het eerste kind recht op 415 uur ouderschapsverlof.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C39
  - number: I-C39.3
    text: |-
      Een betrokkene die blijkens een verklaring uit de gemeentelijke basisadministratie op hetzelfde adres woont als
      één kind en met het oog op adoptie de verzorging en opvoeding van dat kind op zich heeft genomen, heeft recht op
      995 uur ouderschapsverlof. Indien een betrokkene tegelijkertijd de verzorging en opvoeding van meer dan één kind op
      zich heeft genomen, bestaat er ten aanzien van elk ander kind recht op 415 uur ouderschapsverlof.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C39
  - number: I-C39.4
    text: |-
      Een betrokkene die blijkens een verklaring uit de gemeentelijke basisadministratie op hetzelfde adres woont als één
      of meer kinderen en duurzaam de verzorging en opvoeding van dat kind of die kinderen als eigen kind of kinderen op
      zich heeft genomen, heeft recht op 995 uur ouderschapsverlof.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C39
  - number: I-C39.5
    text: |-
      Voor de betrokkene die is benoemd in een betrekking met een omvang die afwijkt van een normbetrekking wordt het
      ouderschapsverlof naar evenredigheid van de werktijdfactor berekend en rekenkundig afgerond op hele uren.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C39
  - number: I-C39.6
    text: Geen recht op ouderschapsverlof bestaat na de datum waarop een kind de leeftijd van acht jaren heeft bereikt.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C39
  - number: I-C39.7
    text: |-
      Het ouderschapsverlof wordt opgenomen gedurende een aaneengesloten periode van ten hoogste één jaar. In afwijking
      van de vorige volzin kan een betrokkene het bevoegd gezag vragen het ouderschapsverlof te kunnen opnemen over een
      langere periode dan één jaar. Het bevoegd gezag stemt in met het verzoek tenzij gewichtige redenen zich daartegen
      verzetten.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C39
  - number: I-C39.8
    text: Voor een betrokkene, bedoeld in het tweede dan wel derde lid, geldt het zevende lid telkens per kind.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C39
  - number: I-C39.9
    text: |-
      Een betrokkene vraagt het ouderschapsverlof schriftelijk aan, ten minste acht weken voor het gewenste tijdstip
      van ingang van het verlof en onder opgave van de periode, het aantal verlofuren per week en de spreiding daarvan
      over de week. Zodra dat mogelijk is, deelt de betrokkene ook de naam en geboortedatum mee van het kind of de
      kinderen waarvoor ouderschapsverlof wordt gevraagd. De betrokkene kan de tijdstippen van ingang en einde van het
      ouderschapsverlof afhankelijk stellen van de datum van bevalling, van het einde van het bevallingsverlof of van de
      aanvang van de verzorging.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C39
  - number: I-C39.10
    text: |-
      Het bevoegd gezag kan, na overleg met de betrokkene, de spreiding van de verlofuren over de week op grond van
      gewichtige redenen wijzigen, tot vier weken voor het beoogde tijdstip van ingang van het ouderschapsverlof.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C39
  - number: I-C39.11
    text: |-
      Het bevoegd gezag stemt in met een verzoek van de betrokkene om het ouderschapsverlof niet op te nemen of niet
      voort te zetten op grond van onvoorziene omstandigheden, tenzij gewichtige redenen zich hiertegen verzetten. Het
      bevoegd gezag beslist uiterlijk vier weken nadat het verzoek is gedaan, in voorkomend geval onder opgave van de
      gewichtige redenen. In het geval dat het ouderschapsverlof met toepassing van de eerste volzin na het tijdstip van
      ingang daarvan niet wordt voortgezet, vervalt het recht op het overige deel van dat verlof tenzij het verlof wegens
      ziekte van de betrokkene op zijn verzoek wordt opgeschort.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C39
  - number: I-C41.1
    text: |-
      Voor de betrokkene die is benoemd in een normbetrekking geldt op jaarbasis een arbeidsduur van 1710 uren
      respectievelijk 1790 uren, waarbij aanspraak bestaat op 51 uren respectievelijk 131 uren verlof.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C41
  - number: I-C41.2
    text: |-
      Voor de betrokkene die is benoemd in een betrekking met een omvang van minder dan een normbetrekking wordt het
      verlof, bedoeld in het eerste lid, naar evenredigheid van de werktijdfactor berekend en rekenkundig afgerond op
      hele uren.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C41
  - number: I-C41.3
    text: |-
      Het verlof, bedoeld in het eerste lid, wordt in gehele werkdagen opgenomen, met dien verstande dat een restant dat
      kleiner is dan een gehele werkdag voor een gedeelte van een werkdag wordt genoten. Tenzij het dienstbelang zich
      daartegen verzet, kan het verlof op verzoek van betrokkene anders dan in gehele werkdagen worden verleend.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C41
  - number: I-C41.4
    text: |-
      Teneinde voor een betrokkene als bedoeld in hoofdstuk I-Q, hoofdstuk I-R, artikel I-S203 en artikel I-S303, het
      verbruik van het verlof, bedoeld in het eerste en tweede lid, te berekenen, wordt de in het eerste en het tweede
      lid bedoelde verlofaanspraak uitgedrukt in lesgevende taken, lesgebonden taken of behandeltaken en wel door de in
      het eerste lid bedoelde verlofaanspraak bij een arbeidsduur op jaarbasis van 1710 uren vast te stellen op 31 uren
      en bij een arbeidsduur op jaarbasis van 1790 uren op 80 uren. Vervolgens wordt voor elk dagdeel dat een betrokkene
      als bedoeld in hoofdstuk I-Q, hoofdstuk I-R, artikel I-S203 en artikel I-S303, verlof geniet op grond van dit
      artikel, de verlofaanspraak van betrokkene verminderd met het aantal uren dat op de betreffende dagdelen in de vier
      hoogste groepen wordt lesgegeven.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C41
  - number: I-C41.5
    text: |-
      Na verkregen instemming van het decentraal georganiseerd overleg kunnen van het vierde lid afwijkende afspraken
      worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C41
  - number: I-C41.6
    text: |-
      Het bevoegd gezag en betrokkene maken afspraken over het tijdstip waarop het verlof, bedoeld in dit artikel,
      wordt opgenomen. Indien geen overeenstemming wordt bereikt over het tijdstip van opnemen van het verlof,
      beslist het bevoegd gezag. Voor de betrokkene die is benoemd in een functie als bedoeld in hoofdstuk I-S met
      uitzondering van een functie als bedoeld in artikel I-S203 of artikel I-S303 geldt dat 51 uur van het verlof op
      grond van dit artikel op verzoek van betrokkene buiten de schoolvakanties wordt verleend en wordt vermeld in de
      werktijdenregeling, bedoeld in artikel I-S105, tweede lid.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C41
  - number: I-C41.7
    text: |-
      Onder door Onze minister te stellen voorwaarden kan het verlof, bedoeld in dit artikel, worden opgenomen in een
      later schooljaar.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C41
  - number: I-C42.1
    text: |-
      Tot een nader door Onze Minister te bepalen datum kan aan de betrokkene behorend tot het onderwijsgevend personeel
      die op zijn verzoek geen gebruik maakt van de voor hem geldende arbeidsduurverkorting door een verlaging van de
      normbetrekking met ingang van 1 augustus 1991, na een periode van minimaal 4 jaar en maximaal 8 jaar verlof worden
      verleend, waarvan de tijdsduur overeenkomt met de tijd van de niet genoten arbeidsduurverkorting.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C42
  - number: I-C42.2
    text: |-
      Het in het eerste lid bedoelde verlof wordt vermeerderd met extra verlof waarvan de tijdsduur overeenkomt met een
      percentage van de niet genoten arbeidsduurverkorting.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C42
  - number: I-C42.3
    text: Onze Minister geeft nadere voorschriften voor de toepassing van het in dit artikel bedoelde verlof.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-C42
  - number: I-D1
    text: 'In dit hoofdstuk wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-D1
  - number: I-D1.a
    text: 'burgerlijke beloning: de bezoldiging, bedoeld in artikel I-A1, onder *j*;'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-D1
  - number: I-D1.b
    text: 'militaire beloning: hetgeen als zodanig door Onze Ministers van Defensie en Financiën is aangemerkt.'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-D1
  - number: I-D2.1
    text: |-
      De betrokkene die ingevolge wettelijke verplichting op grond van de [Kaderwet dienstplicht][ref1] als militair in
      werkelijke dienst is, geniet van rechtswege verlof.


      [ref1]: https://wetten.overheid.nl/BWBR0008589
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-D2
    references:
      - id: ref1
        bwb_id: BWBR0008589
  - number: I-D2.2
    text: |-
      Hij behoudt tijdens dit verlof zijn burgerlijke beloning, voor zover de bepalingen van dit hoofdstuk hem daarop
      aanspraak geven.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-D2
  - number: I-D2.3
    text: |-
      Op de betrokkene die is benoemd in tijdelijke dienst, zijn de bepalingen van dit hoofdstuk slechts van toepassing,
      zolang hij aan de instelling is verbonden.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-D2
  - number: I-D2.4
    text: |-
      Op de betrokkene, die is benoemd in één of meer betrekkingen die elk voor zich kleiner zijn dan de omvang van een
      normbetrekking, zijn de voorschriften in de artikelen I-D3 en I-D7 van toepassing naar evenredigheid van:
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-D2
  - number: I-D2.4.a
    text: |-
      de omvang van de betrekking die kleiner is dan de omvang van een normbetrekking ten opzichte van de totale omvang
      van de betrekkingen;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-D2
  - number: I-D2.4.b
    text: |-
        - ingeval de totale omvang van de betrekkingen kleiner is dan een normbetrekking - die omvang van de betrekking die
      kleiner is dan de omvang van een normbetrekking ten opzichte van de normbetrekking.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-D2
  - number: I-D3
    text: |-
      De betrokkene die ingevolge wettelijke verplichting voor opleiding en oefening als militair in werkelijke dienst
      is, geniet de aan zijn betrekking verbonden burgerlijke beloning tot een bedrag, gelijk aan het op hem te verhalen
      gedeelte van de pensioenbijdrage en de Vut-bijdrage ingevolge de regels van het bestuur VUT-fonds met betrekking
      tot financiering VUT-aanspraken.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-D3
  - number: I-D4.1
    text: |-
      De belanghebbende die voor een herhalingsoefening als militair in werkelijke dienst is, geniet de aan zijn
      betrekking verbonden burgerlijke beloning, voor zover deze meer bedraagt dan zijn militaire beloning.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-D4
  - number: I-D4.2
    text: |-
      Voor de toepassing van het eerste lid wordt de militaire beloning verminderd met een eventueel bedrag wegens genot
      van voeding en huisvesting.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-D4
  - number: I-D4.3
    text: 'Voor de toepassing van dit hoofdstuk worden met herhalingsoefening gelijkgesteld:'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-D4
  - number: I-D4.3.a
    text: |-
      het in dienst komen dan wel het in aansluiting aan een herhalingsoefening langer in dienst blijven voor een
      onderzoek omtrent een strafbaar feit of een krijgstuchtelijk vergrijp, waarvan de militair wordt verdacht of
      beklaagd;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-D4
  - number: I-D4.3.b
    text: |-
      het in dienst komen dan wel het in aansluiting aan een herhalingsoefening langer in dienst blijven teneinde
      rekening en verantwoording af te leggen van gevoerd beheer;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-D4
  - number: I-D4.3.c
    text: |-
      het in dienst komen om gehoord te worden omtrent een bij de Kroon of bij Onze Minister van Defensie ingediend
      bezwaarschrift;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-D4
  - number: I-D4.3.d
    text: 'het in aansluiting aan een herhalingsoefening langer in dienst blijven wegens:'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-D4
  - number: I-D4.3.d.1
    text: ziekte;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-D4
  - number: I-D4.3.d.2
    text: net niet tijdig bereiken van de vereiste graad van geoefendheid als gevolg van ziekte;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-D4
  - number: I-D4.3.d.3
    text: het heersen of geheerst hebben van een besmettelijke ziekte;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-D4
  - number: I-D4.3.e
    text: hetgeen voorts door Onze Minister van Defensie als zodanig is aangemerkt.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-D4
  - number: I-D5.1
    text: |-
      Gedurende 2 weken na zijn opkomst in werkelijke dienst geniet de betrokkene de volle aan zijn betrekking verbonden
      burgerlijke beloning indien hij bij zijn opkomst in werkelijke dienst anders dan voor herhalingsoefening de eerste
      12 maanden van de opleiding en oefening of zoveel korter als deze opleiding en oefening duurt reeds in werkelijke
      dienst heeft doorgebracht.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-D5
  - number: I-D5.2
    text: Na afloop van de in het eerste lid bedoelde termijn is het bepaalde in artikel I-D3, van toepassing.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-D5
  - number: I-D6
    text: |-
      Voor zover de werkelijke dienst, niet zijnde de opleiding en oefening, wordt vervuld tijdens zijn vakantieverlof,
      geniet de betrokkene de volle aan zijn betrekking verbonden burgerlijke beloning.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-D6
  - number: I-D7.1
    text: 'Het bepaalde in dit hoofdstuk is van overeenkomstige toepassing ten aanzien van de betrokkene die:'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-D7
  - number: I-D7.1.a
    text: |-
      is te werk gesteld in de zin van [artikel 9 van de Wet gewetensbezwaren militaire dienst][ref1] (*Stb.* 1962, 370);


      [ref1]: https://wetten.overheid.nl/BWBR0002386#Artikel9
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-D7
    references:
      - id: ref1
        bwb_id: BWBR0002386
        artikel: '9'
  - number: I-D7.1.b
    text: op grond van een verbintenis bij het Korps Nationale Reserve in werkelijke dienst is;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-D7
  - number: I-D7.1.c
    text: op grond van een verbintenis bij het reservepersoneel der krijgsmacht als militair in werkelijke dienst is;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-D7
  - number: I-D7.1.d
    text: |-
      op grond van een verbintenis als vrijwilliger in de zin van artikel 2, eerste lid onder *a* of *b*, van de
      Rechtstoestandregeling reserve-politie (*Stb.* 1964, 473) of van een overeenkomstige verbintenis als bedoeld in de
      artikelen 53 en 54 van die regeling in werkelijke dienst is;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-D7
  - number: I-D7.1.e
    text: |-
      op grond van een tijdelijke verbintenis als legeraalmoezenier, legerpredikant of anderszins als geestelijk
      verzorger in werkelijke dienst is;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-D7
  - number: I-D7.1.f
    text: |-
      op grond van een verbintenis als monumentenwachter in de zin van het Besluit Monumentenwacht (*Stb.* 1964, 477) in
      werkelijke dienst is;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-D7
  - number: I-D7.1.g
    text: |-
      op grond van een andere bijzondere verbintenis in werkelijke of daarmee gelijk te stellen dienst is, indien dit bij
      koninklijk besluit is bepaald.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-D7
  - number: I-D7.2
    text: |-
      De betrokkenen, bedoeld in het eerste lid onder *d* en *e*, worden gelijkgesteld met de betrokkene, die voor een
      herhalingsoefening als militair in werkelijke dienst is.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-D7
  - number: I-F1
    text: 'In dit hoofdstuk wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-F1
  - number: I-F1.a
    text: 'overledene: hij, die op de dag van zijn overlijden betrokkene was.'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-F1
  - number: I-F1.b
    text: 'uitkeringsbasis:'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-F1
  - number: I-F1.b.1
    text: |-
      in het geval, bedoeld onder *a*1: de tot een maandbedrag herleide bezoldiging welke voor de betrokkene gold op de
      dag van overlijden, vermeerderd met het bedrag van de vakantie-uitkering over de desbetreffende maand, met dien
      verstande dat de overledene die werkzaam was aan een instelling voor voortgezet onderwijs met een cursusduur van
      minder dan 12 maanden, voor de toepassing van dit hoofdstuk geacht wordt zijn totale jaarlijkse bezoldiging te
      hebben ontvangen in 12 gelijke maandelijkse termijnen;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-F1
  - number: I-F1.c
    text: 'bevoegd gezag: voor wat betreft:'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-F1
  - number: I-F1.c.1
    text: 'een betrokkene als bedoeld onder *a*1: het bevoegd gezag, bedoeld in artikel I-A1, onder *f*;'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-F1
  - number: I-F1.c.2
    text: 'een gewezen betrokkene als bedoeld onder *a*2 en *a*3: Onze minister.'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-F1
  - number: I-F2.1
    text: 'In aanmerking voor een uitkering bij overlijden komen in navolgende rangorde:'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-F2
  - number: I-F2.1.a
    text: de weduwe of weduwnaar, van wie de overledene niet duurzaam gescheiden leefde;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-F2
  - number: I-F2.1.b
    text: de minderjarige kinderen van de overledene;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-F2
  - number: I-F2.1.c
    text: de meerderjarige kinderen, ouders, broers of zusters voor wie de overledene kostwinner was.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-F2
  - number: I-F2.2
    text: |-
      Onder kinderen in de zin van het eerste lid worden mede begrepen natuurlijke kinderen en kinderen voor wie de
      overledene de pleegouderlijke zorg droeg. Onder pleegouderlijke zorg wordt verstaan de zorg voor het onderhoud
      en de opvoeding van het kind als was het een eigen kind, onafhankelijk van enige verplichting daartoe of van het
      genieten van een vergoeding daarvoor.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-F2
  - number: I-F3.1
    text: |-
      De uitkering bij overlijden is gelijk aan het bedrag dat gevormd wordt door de uitkeringsbasis met 3 te
      vermenigvuldigen.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-F3
  - number: I-F3.2
    text: |-
      Het bedrag, bedoeld in het eerste lid, wordt zo spoedig mogelijk, in ieder geval binnen een maand na het
      overlijden, door het bevoegd gezag uitgekeerd.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-F3
  - number: I-F4.1
    text: |-
      Gedurende de maand van het overlijden en de volgende drie maanden behouden de achterblijvende gezinsleden het recht
      op het gebruik van de dienstwoning waarin zij met de overledene woonden.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-F4
  - number: I-F4.2
    text: |-
      Indien door de overledene voor het gebruik van de dienstwoning of voor het verbruik van verwarming, gas,
      elektriciteit en water een vergoeding verschuldigd was, voldoen de achtergebleven gezinsleden deze over de tijd,
      gedurende welke zij het gebruik van de dienstwoning behouden.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-F4
  - number: I-F5.1
    text: |-
      Indien de nabestaanden, bedoeld in artikel I-F2, aanspraak hebben op een overlijdensuitkering als bedoeld in
      artikel 1639*l*, tweede lid, van het Burgerlijk Wetboek, wordt de uitkering bij overlijden bedoeld in dit hoofdstuk
      slechts uitbetaald, voor zover deze de eerstgenoemde uitkering te boven gaat.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-F5
  - number: I-F5.2
    text: |-
      In geval van overlijden als militair in werkelijke dienst wordt de uitkering bij overlijden verminderd met het
      bedrag van de overeenkomstige uitkering, die uit hoofde van militaire dienst ter zake wordt gedaan.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-F5
  - number: I-F5.3
    text: |-
      In geval van overlijden als gewezen betrokkene, bedoeld in artikel I-F1, onder *a*3, wordt de uitkering bij
      overlijden verminderd met het bedrag van de uitkering waarop de nabestaanden van de gewezen betrokkene ter zake van
      diens overlijden aanspraak kunnen maken krachtens artikel Q6 van de pensioenwet dan wel krachtens enige wettelijk
      voorgeschreven verzekering wegens ziekte of arbeidsongeschiktheid.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-F5
  - number: I-F6
    text: |-
      Op de ingevole de voorgaande artikelen berekende uitkering bij overlijden wordt de reeds vóór zijn overlijden aan
      de betrokkene uitbetaalde bezoldiging over een na zijn overlijden gelegen tijdvak, in mindering gebracht.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-F6
  - number: I-F7
    text: |-
      Indien de overledene geen nabestaanden als bedoeld in artikel I-F2 nalaat, kan het bedrag, bedoeld in artikel I-
      F3, door het bevoegd gezag geheel of gedeeltelijk worden uitgekeerd voor de betaling van de kosten van de laatste
      ziekte en van de lijkbezorging, voor zover de nalatenschap voor de betaling van die kosten ontoereikend is.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-F7
  - number: I-G1
    text: |-
      Ontslag op grond van opheffing van de instelling of de betrekking dan wel wegens zodanige verandering in de
      inrichting of de dienst van de instelling dat de werkzaamheden van een of meer betrokkenen overbodig worden,
      geschiedt aan de hand van een afvloeiingsregeling.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-G1
  - number: I-G2.1
    text: |-
      Het bevoegd gezag stelt zo spoedig mogelijk, doch in ieder geval binnen drie maanden na de datum waarop dit besluit
      voor de instelling van toepassing is geworden, een afvloeiingsregeling vast voor het personeel in vaste dienst,
      waarin de belangen van de instelling en van de betrokkenen zoveel mogelijk gelijkelijk in acht worden genomen.
      Het bevoegd gezag kan deze taak overdragen aan de vereniging van instellingsbesturen waarbij de instelling is
      aangesloten.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-G2
  - number: I-G2.2
    text: |-
      De regeling wordt niet vastgesteld dan nadat met verenigingen als bedoeld in
      [artikel 64 van de Wet op het primair onderwijs][ref1], [artikel 66 van de Wet op de expertisecentra][ref2],
      [artikel 184 van de Wet op het voortgezet onderwijs][ref3]” artikel 2.51 en 2.59 van de Wet op het cursorisch
      beroepsonderwijs, artikel 20 van het Besluit vormingswerk voor jeugdigen, artikel 61 van de Wet op de
      onderwijsverzorging of artikel 9 van de Kaderwet volwasseneneducatie dan wel verenigingen van het aan de
      instellingen, bedoeld in artikel I-A1, onder *d*6 en *d*7, verbonden personeel, voor zover deze hun werkzaamheden
      uitstrekken over het aan zodanige instellingen verbonden personeel, overleg is gepleegd.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel64
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel66
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel184
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-G2
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '64'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '66'
      - id: ref3
        bwb_id: BWBR0002399
        artikel: '184'
  - number: I-G2.3
    text: |-
      Bij samenvoeging stelt het bevoegd gezag een afvloeiingsregeling vast met inachtneming van het bepaalde in
      het eerste en tweede lid. Van de in de eerste volzin bedoelde afvloeiingsregeling dient een overgangsregeling
      deel uit te maken. In de overgangsregeling is vastgelegd op welke wijze op het moment van samenvoeging de
      afvloeiingsvolgorden, zoals vastgesteld aan de bij de samenvoeging betrokken scholen tot één volgorde worden
      gemaakt.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-G2
  - number: I-G2.4
    text: |-
      Bij omzetting van een benoeming in een bestuursbenoeming stelt het bevoegd gezag een afvloeiingsregeling vast met
      inachtneming van het bepaalde in het eerste en tweede lid. Van de in de eerste volzin bedoelde afvloeiingsregeling
      dient een overgangsregeling deel uit te maken. In de overgangsregeling wordt een voorziening geboden voor het reeds
      aan de instelling benoemde personeel dat geen omzetting van de benoeming wenst.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-G2
  - number: I-G2.5
    text: |-
      Ter vermijding van kennelijke onbillijkheid en wanneer het belang van de instelling dit kennelijk vereist, kan
      bij de verlening van ontslag van de vastgestelde afvloeiingsregeling worden afgeweken, met dien verstande, dat
      indien de omvang van de voorgenomen afvloeiing daartoe aanleiding geeft, deze geschiedt naar een bepaald vooraf
      vastgesteld en aan de betrokkenen kenbaar gemaakt plan.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-G2
  - number: I-G3
    text: |-
      Het bevoegd gezag draagt er zorg voor dat de regeling steeds op een voor de betrokkenen toegankelijke plaats ter
      inzage in de instelling beschikbaar is.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-G3
  - number: I-J1.1
    text: 'In dit hoofdstuk wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-J1
  - number: I-J1.1.a
    text: |-
      betrokkene: de betrokkene bedoeld in artikel I-A1 onder*e*1, *e*2, *e*4, *e*5, *e*6, *e*7, *e*10, *e*12 tot en
      met *e*18;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-J1
  - number: I-J1.1.b
    text: |-
      instelling: de instelling, bedoeld in artikel I-A1, onder *d*1, *d*2, *d*4, *d*5, *d*6, *d*7, *d*10, *d*12 tot en
      met *d*18;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-J1
  - number: I-J1.1.c
    text: |-
      hoofdinstelling: 'indien de betrokkene werkzaam is aan: - één instelling: de desbetreffende instelling;'
        - twee of meer instellingen: de instelling waaraan hij de meeste tijd werkzaam is;
        - twee of meer instellingen waaraan hij dezelfde tijd werkzaam is: de instelling met de kleinste afstand tot de
      woning van betrokkene.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-J1
  - number: I-J1.1.d
    text: |-
      standplaats: de gemeente of het met name bekende afzonderlijk liggend deel van die gemeente, waarin door
      belanghebbende voor de hoofdinstelling de meeste werkzaamheden worden verricht. Indien door belanghebbende voor
      de hoofdinstelling in verschillende gemeenten evenveel werkzaamheden worden verricht: de gemeente of het met name
      bekende afzonderlijk liggend deel van die gemeente, met de kleinste afstand tot de woning van belanghebbende;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-J1
  - number: I-J1.1.e
    text: |-
      standplaatsbetrekking: een betrekking of een combinatie van betrekkingen met een omvang van tenminste het 6/10 deel
      van de normbetrekking;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-J1
  - number: I-J1.1.f
    text: 'gebouw: de plaats waar de belanghebbende zijn werkzaamheden verricht;'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-J1
  - number: I-J1.1.g
    text: |-
      plaats van tewerkstelling: het gebouw van de hoofdinstelling in de standplaats waar belanghebbende werkzaam
      is. Wanneer in de standplaats binnen de hoofdinstelling sprake is van meerdere gebouwen is de plaats van
      tewerkstelling het gebouw waar belanghebbende de meeste werkzaamheden verricht. Wanneer in de standplaats binnen de
      hoofdinstelling sprake is van meerdere gebouwen, waar door belanghebbende evenveel werkzaamheden worden verricht,
      wordt het gebouw met de kleinste afstand tot de woning van belanghebbende als plaats van tewerkstelling aangemerkt.
      Indien de uitoefening van de functie van belanghebbende aan de hoofdinstelling zich uitstrekt over een meer of
      minder omvangrijk geografisch gebied (rayon of regio): de door het bevoegde gezag aangewezen plaats;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-J1
  - number: I-J1.1.h
    text: |-
      woonplaats: de gemeente of het met name bekende afzonderlijk liggend deel van die gemeente, waar de belanghebbende
      metterwoon is gevestigd;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-J1
  - number: I-J1.1.i
    text: |-
      zone: de eenheid waarin het bus- en tramlijnennet is verdeeld en die de basis vormt van de strippenkaart in het
      stad- en streekvervoer;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-J1
  - number: I-J1.1.j
    text: |-
      jaarbezoldiging: de bezoldiging of de som van de bezoldigingen in de maand van verhuizen, tot ten hoogste
      de bezoldiging verbonden aan een normbetrekking vermeerderd met het percentage van de vakantieuitkering met
      inachtneming van het minimumbedrag, in voorkomende gevallen verhoogd met:
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-J1
  - number: I-J1.1.j.1
    text: |-
      een eventueel in die maand genoten uitkering als bedoeld in het
      [Besluit werkloosheid onderwijs- en onderzoekpersoneel][ref1], alsmede de daarmede overeenkomende
      uitkeringsregelingen, als door Onze minister aan te geven;


      [ref1]: https://wetten.overheid.nl/BWBR0006445
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-J1
    references:
      - id: ref1
        bwb_id: BWBR0006445
  - number: I-J1.1.j.2
    text: |-
      een eventueel in die maand genoten uitkering krachtens dan wel overeenkomstig de Regeling uitkering wegens
      functioneel leeftijdsontslag of de [Uitkeringswet gewezen militairen][ref1], zoals deze uitkering is of zou
      zijn vastgesteld indien de leeftijd van 50 jaar nog niet is of zou zijn bereikt; een en ander herleid tot een
      jaarbedrag;


      [ref1]: https://wetten.overheid.nl/BWBR0002540
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-J1
    references:
      - id: ref1
        bwb_id: BWBR0002540
  - number: I-J1.1.k
    text: |-
      gezamenlijke jaarbezoldiging: de jaarbezoldiging vermeerderd met de inkomsten onder welke benaming dan ook genoten,
      door de echtgenoot die geen belanghebbende is;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-J1
  - number: I-J1.1.l
    text: berekeningstijdstip
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-J1
  - number: I-J1.1.l.1e
    text: de datum waarop de belanghebbende verhuist;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-J1
  - number: I-J1.1.l.2e
    text: |-
      indien de belanghebbende verhuist voor de datum dat de functie feitelijk wordt vervuld, de datum van ingang van het
      werkzaam zijn in een standplaatsbetrekking;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-J1
  - number: I-J1.1.m
    text: |-
      voor het eerst in diensttreden: in dienst treden bij een instelling anders dan in geval van een overgang binnen
      een maand:
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-J1
  - number: I-J1.1.m.1e
    text: van de ene naar een andere instelling,
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-J1
  - number: I-J1.1.m.2e
    text: |-
      van de overheid naar een instelling, terwijl de tijd gedurende welke een ontslaguitkering wordt genoten niet als
      een onderbreking tussen beide benoemingen wordt beschouwd;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-J1
  - number: I-J1.1.n
    text: 'verplaatsing: verandering van de standplaats van de belanghebbende in opdracht van het bevoegd gezag;'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-J1
  - number: I-J1.1.o
    text: |-
      gezinsleden: de echtgeno(o)t(e) van de belanghebbende en de eigen kinderen, stief- en pleegkinderen die deel
      uitmaken van het gezin;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-J1
  - number: I-J1.1.p
    text: |-
      dienstwoning: de door het bevoegd gezag aan de belanghebbende in verband met de uitoefening van de functie ter
      bewoning aangewezen woning, waarvoor van rijkswege een tegemoetkoming in de stichtingskosten of onderhoudskosten
      aan het bevoegd gezag is verleend;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-J1
  - number: I-J1.1.q
    text: |-
      dienstreis: de reis, welke, anders dan bedoeld in artikel I-J9, in het belang van het onderwijs dan wel van de
      instelling en in opdracht van het bevoegd gezag in of buiten de standplaats wordt gemaakt;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-J1
  - number: I-J2
    text: |-
      Voor het ontstaan van een standplaatsbetrekking blijven vervangingswerkzaamheden en werkzaamheden die voor een
      periode van drie of minder aaneengesloten schooljaren aan een belanghebbende zijn toegekend in het kader van
      contractactiviteiten, buiten beschouwing.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-J2
  - number: I-J3.1
    text: |-
      De belanghebbende, die is verhuisd en een woning heeft betrokken die gelegen is op of binnen een afstand van 5
      zones van de plaats van tewerkstelling, wordt een tegemoetkoming in de verhuiskosten verleend indien:
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-J3
  - number: I-J3.1.a
    text: hij is benoemd in een standplaatsbetrekking;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-J3
  - number: I-J3.1.b
    text: hij voor tenminste één jaar is benoemd;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-J3
  - number: I-J3.1.c
    text: hij op een afstand van 6 of meer zones woonde van de plaats van tewerkstelling;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-J3
  - number: I-J3.1.d
    text: |-
      de reisafstand tussen de woonplaats en de plaats van tewerkstelling als gevolg van de verhuizing met tenminste 5
      zones is bekort.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-J3
  - number: I-J3.2
    text: |-
      Een tegemoetkoming in de verhuiskosten wordt slechts éénmaal in de vijf jaar verleend, tenzij de verhuizing verband
      houdt met een verandering van betrekking die het gevolg is van een ontslag of van het vooruitzicht op ontslag, dat
      niet op eigen verzoek is verleend en niet aan schuld of toedoen van de belanghebbende is te wijten.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-J3
  - number: I-J3.3
    text: |-
      De tegemoetkoming in verhuiskosten wordt verleend onder de voorwaarde dat de belanghebbende vooraf schriftelijk
      heeft verklaard dat hij bekend is met de terugbetalingsverplichting bedoeld in artikel I-J8.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-J3
  - number: I-J4.1
    text: |-
      De belanghebbende, die in opdracht van het bevoegd gezag, een dienstwoning betrekt of verlaat, wordt een
      tegemoetkoming in verhuiskosten verleend, tenzij het verlaten van de dienstwoning het gevolg is van een ontslag,
      dat op zijn verzoek anders dan wegens het bereiken of bereikt hebben van de pensioengerechtigde leeftijd, of anders
      dan met recht op uitkering voor vervroegd uittreden is verleend, of aan schuld of toedoen van de belanghebbende is
      te wijten.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-J4
  - number: I-J4.2
    text: |-
      Indien het verlaten van een dienstwoning verband houdt met het overlijden van de belanghebbende, wordt een
      tegemoetkoming in de verhuiskosten verleend aan de nagelaten gezinsleden.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-J4
  - number: I-J5.1
    text: 'De tegemoetkoming in verhuiskosten kan slechts bestaan uit:'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-J5
  - number: I-J5.1.a
    text: |-
      Een tegemoetkoming in de kosten van transport van de bagage en van de inboedel van de belanghebbende en zijn
      gezinsleden naar de nieuwe woning, waaronder begrepen de kosten van het in- en uitpakken van breekbare zaken, en
      in de te maken reiskosten ter bezichtiging van woonruimte en in de eventuele opknapkosten aan de nieuwe woning en
      dubbele woonkosten, van in totaal een bedrag als aangegeven in de bijlage J1 onder 1, van dit besluit.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-J5
  - number: I-J5.1.b
    text: een tegemoetkoming voor alle andere direct uit de verhuizing voortvloeiende kosten.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-J5
  - number: I-J5.2
    text: |-
      Indien de verhuizing door belanghebbende in eigen beheer wordt uitgevoerd, ontvangt belanghebbende slechts de helft
      van het in het eerste lid, onder *a*, bedoelde bedrag.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-J5
  - number: I-J5.3
    text: |-
      Het in het eerste lid, onder *b*, bedoelde bedrag wordt, afhankelijk van het aantal woon/slaapvertrekken dat de
      achter te laten woning telde, gesteld op een percentage van de jaarbezoldiging die de belanghebbende genoot op de
      dag waarop de nieuwe woning kon worden betrokken zoals aangegeven in de bijlage J1, onder 2, van dit besluit.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-J5
  - number: I-J5.4
    text: |-
      Voor de belanghebbende, die inwonend was bij de ouders is het laagst genoemde percentage zoals aangegeven in de
      bijlage J1, onder 2, van dit besluit van toepassing.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-J5
  - number: I-J5.5
    text: |-
      De belanghebbende, die een woning heeft betrokken op een reisafstand van meer dan 2 zones van de plaats
      van tewerkstelling, ontvangt slechts 80% van het bedrag van de in het eerste lid onder *a* en *b* bedoelde
      tegemoetkomingen.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-J5
  - number: I-J5.6
    text: |-
      De tegemoetkoming in de verhuiskosten voor de belanghebbende, die voor het eerst bij een instelling in dienst
      treedt en op enig tijdstip wordt benoemd in een standplaatsbetrekking, bedraagt in afwijking van het bepaalde in
      het eerste tot en met vijfde lid, de helft van de vergoeding waarop hij ingevolge die leden aanspraak zou hebben.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-J5
  - number: I-J6.1
    text: |-
      Bij een verhuizing van een gezin, waarvan beide echtgenoten terzake van de verhuizing aanspraak kunnen maken op
      een tegemoetkoming in de verhuiskosten op grond van dit hoofdstuk, ontvangt, met overeenkomstige toepassing van
      artikel I-J5, tweede tot en met zesde lid: ieder van beiden de helft van de in artikel I-J5, eerste lid, onder *a*
      en *b* bedoelde vergoedingen. De volgens artikel I-J5, derde lid, vast te stellen vergoeding wordt berekend over de
      gezamenlijke jaarbezoldiging.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-J6
  - number: I-J6.2
    text: |-
      Indien het betreft een verhuizing van een gezin waarvan een van de echtgenoten aanspraak kan maken op een
      tegemoetkoming in de verhuiskosten op grond van dit hoofdstuk en de andere echtgenoot uit anderen hoofde terzake
      van deze verhuizing aanspraak maakt op een tegemoetkoming, wordt de tegemoetkoming in verhuiskosten aan de
      belanghebbende slechts verleend voorzover deze de tegemoetkoming welke uit anderen hoofde wordt ontvangen te boven
      gaat.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-J6
  - number: I-J6.3
    text: |-
      De berekening van de tegemoetkoming voor de in het tweede lid bedoelde belanghebbende geschiedt door, met
      overeenkomstige toepassing van artikel I-J5, tweede tot en met zesde lid, het totaal van de tegemoetkomingen
      bedoeld in artikel I-J5, eerste lid, te verminderen met de tegemoetkoming die de echtgenoot uit andere hoofde
      ontvangt. De volgens artikel I-J5, derde lid, vast te stellen vergoeding wordt berekend over de gezamenlijke
      jaarbezoldiging.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-J6
  - number: I-J7.1
    text: |-
      Aan de betrokkene wordt geen tegemoetkoming in de verhuiskosten voor een verhuizing verleend, indien de verhuizing
      niet heeft plaatsgevonden binnen drie jaar na de datum waarop betrokkene is benoemd in een standplaatsbetrekking
      doch binnen twee jaar na benoeming in vaste dienst in een standplaatsbetrekking.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-J7
  - number: I-J7.2
    text: |-
      Aan de belanghebbende wordt geen tegemoetkoming in de verhuiskosten voor een verhuizing in verband met een
      verplaatsing verleend, indien de verhuizing niet heeft plaatsgevonden binnen twee jaar na de datum van de
      verplaatsing.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-J7
  - number: I-J8.1
    text: |-
      De betrokkene, aan wie een tegemoetkoming in de verhuiskosten wordt verleend, is, behoudens het tweede lid,
      gehouden de ontvangen tegemoetkoming terug te betalen indien zijn dienstverband op zijn verzoek of ten gevolge van
      aan hemzelf te wijten feiten of omstandigheden wordt beëindigd, tenzij deze beëindiging ingaat twee jaren of langer
      na de datum waarop de betrokkene in een standplaatsbetrekking is benoemd of is verplaatst en deze beëindiging heeft
      plaatsgevonden een jaar of langer na de datum van de verhuizing.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-J8
  - number: I-J8.2
    text: |-
      Geen terugbetalingsverplichting bestaat, indien de belanghebbende bedoeld in het eerste lid, ontslag neemt uit een
      standplaatsbetrekking teneinde aansluitend een zodanige betrekking aan een andere instelling te aanvaarden, mits de
      plaats van tewerkstelling binnen of op een afstand van 5 zones van zijn woonplaats is gelegen.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-J8
  - number: I-J8.3
    text: |-
      De belanghebbende, die binnen twee jaar na de verhuizing, anders dan in verband met het beëindigen van het
      dienstverband bij de instelling waarvoor hem deze tegemoetkoming werd toegekend of wegens een verplaatsing van deze
      instelling, verhuist naar een woonplaats die verder weg is gelegen van de plaats van tewerkstelling, is gehouden de
      ontvangen tegemoetkoming in de verhuiskosten terug te betalen:
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-J8
  - number: I-J8.3.a
    text: |-
      gedeeltelijk, indien hij zich in een woonplaats binnen of op een afstand van 5 zones van zijn plaats van
      tewerkstelling gevestigd heeft en wel voor zover de tegemoetkoming meer bedraagt dan de tegemoetkoming die hem zou
      zijn toegekend indien hij zich direct in deze woonplaats zou hebben gevestigd;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-J8
  - number: I-J8.3.b
    text: |-
      geheel, indien hij zich in een woonplaats op een afstand van meer dan 5 zones van zijn plaats van tewerkstelling
      gevestigd heeft.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-J8
  - number: I-J9.1
    text: |-
      Aan de belanghebbende wordt door het bevoegd gezag maandelijks, onverminderd het bepaalde in artikel I-J11, een
      tegemoetkoming in de reiskosten tussen de woning en het gebouw of de gebouwen verleend, indien de te reizen afstand
      tussen de woning en het gebouw of de gebouwen meer dan twee zones bedraagt.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-J9
  - number: I-J9.2
    text: |-
      De tegemoetkoming wordt per betrekking, en voor elk gebouw binnen de betrekking afzonderlijk, afhankelijk van de
      reisafstand in zones tussen de woning en het gebouw of de gebouwen en van het aantal dagen dat per week naar dit
      gebouw of deze gebouwen wordt gereisd, vastgesteld aan de hand van de in de bijlage J2 bij dit besluit opgenomen
      tabel.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-J9
  - number: I-J9.3
    text: |-
      De in het tweede lid bedoelde tabel is slechts van toepassing indien in een maand gemiddeld ten minste één keer
      per week wordt gereisd tussen de woning en hetzelfde gebouw. Voor de toepassing van de tabel in hiervan afwijkende
      gevallen zijn in de bijlage J2 richtlijnen gegeven.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-J9
  - number: I-J10.1
    text: |-
      Indien door een betrokkene over een aaneengesloten tijdvak van meer dan één week anders dan in verband met
      vakantieverlof niet is gereisd tussen de woning en het gebouw of de gebouwen, wordt de aan de betrokkene toe te
      kennen tegemoetkoming in de reiskosten vanaf de tweede week naar evenredigheid verlaagd.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-J10
  - number: I-J10.2
    text: |-
      Indien door een belanghebbende in verband met de datum van indiensttreding of ontslag slechts een deel van een
      maand tenminste één keer per week wordt gereisd tussen de woning en hetzelfde gebouw, dient de tegemoetkoming in de
      reiskosten naar evenredigheid te worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-J10
  - number: I-J11.1
    text: |-
      De belanghebbende, bedoeld in paragraaf 1 van hoofdstuk I-C, die voor een heel schooljaar is benoemd, heeft per
      betrekking slechts aanspraak op een tegemoetkoming in de reiskosten over ten hoogste tien kalendermaanden per
      schooljaar. De tegemoetkoming wordt niet uitbetaald over de maanden juli en augustus.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-J11
  - number: I-J11.2
    text: |-
      De belanghebbende, bedoeld in de paragrafen 2 tot en met 5 van hoofdstuk I-C, die voor een geheel schooljaar
      is benoemd, heeft per betrekking slechts aanspraak op een tegemoetkoming in de reiskosten over ten hoogste elf
      kalendermaanden per schooljaar. De tegemoetkoming wordt niet uitbetaald over de maand juli.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-J11
  - number: I-J11.3
    text: |-
      Indien de belanghebbende in een betrekking is benoemd voor een kortere periode dan een geheel schooljaar, vindt er,
      voor zover de in het eerste respectievelijk tweede lid, genoemde termijnen niet worden overschreden, geen inhouding
      plaats van de tegemoetkoming in de gemaakte reiskosten.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-J11
  - number: I-J12.1
    text: |-
      De aan belanghebbende toe te kennen tegemoetkoming in reiskosten bedraagt per schooljaar per betrekking of
      combinatie van betrekkingen niet meer dan het bedrag als aangegeven in bijlage J1 onder 3, van dit besluit.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-J12
  - number: I-J12.2
    text: |-
      De tegemoetkoming in de reiskosten bedraagt per betrekking vanaf het tweede jaar na indiensttreding voor het totaal
      van het gebouw of de gebouwen binnen deze betrekking niet meer dan het volgens de tabel in de bijlage J2 vanaf het
      tweede jaar na indiensttreding geldende bedrag bij vier of meer reisdagen per week over een reisafstand van vijf
      zones.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-J12
  - number: I-J13.1
    text: |-
      Een belanghebbende, die bij een verhuizing in aanmerking zou komen voor een tegemoetkoming in verhuiskosten, en
      die naar het oordeel van het bevoegd gezag niet in de gelegenheid is dagelijks heen en weer te reizen tussen zijn
      woning en de plaats van tewerkstelling, heeft gedurende het eerste jaar, gerekend vanaf de datum waarop betrokkene
      in een standplaatsbetrekking is benoemd, aanspraak op een tegemoetkoming in pensionkosten, indien hij een pension
      betrekt dat gelegen is op of binnen een afstand van 5 zones van de plaats van tewerkstelling.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-J13
  - number: I-J13.2
    text: |-
      De in het eerste lid bedoelde tegemoetkoming bedraagt 90% van de werkelijk gemaakte pensionkosten, met een maximum
      als aangegeven in de bijlage J1 onder 4, bij dit besluit.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-J13
  - number: I-J13.3
    text: |-
      De belanghebbende heeft slechts aanspraak op een tegemoetkoming in de te maken reiskosten binnen Nederland, voor
      zover hij die éénmaal per week maakt voor het bezoeken van zijn woonplaats.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-J13
  - number: I-J14.1
    text: |-
      Aan de belanghebbende die een dienstreis maakt, wordt door het bevoegd gezag een tegemoetkoming toegekend in de
      gemaakte reis- en verblijfkosten volgens nader door Onze minister vast te stellen regels.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-J14
  - number: I-J14.2
    text: |-
      De belanghebbende ontvangt voor het gebruik van een eigen motorvoertuig, waarvoor door het bevoegd gezag een
      machtiging is verleend, een kilometervergoeding:
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-J14
  - number: I-J14.2.a
    text: |-
      voor de eerste 10000 kilometer het bedrag dat per gereisde kilometer in het desbetreffende kalenderjaar
      belastingvrij mag worden toegekend;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-J14
  - number: I-J14.2.b
    text: voor de overige kilometers wordt het bedrag vastgesteld volgens nader door Onze minister vast te stellen regels.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-J14
  - number: I-J15.1
    text: |-
      Het verzoek om toekenning van een tegemoetkoming in de verhuiskosten dient zo spoedig mogelijk doch uiterlijk
      binnen 6 maanden na de verhuizing door de belanghebbende bij het bevoegd gezag te worden ingediend.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-J15
  - number: I-J15.2
    text: |-
      Het verzoek om toekenning van een tegemoetkoming in de reis- en pensionkosten dient voor 1 januari volgend op het
      betreffende schooljaar bij het bevoegd gezag te worden ingediend.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-J15
  - number: I-J16
    text: |-
      Degene die een geneeskundig onderzoek ondergaat in verband met benoeming of wijziging van het dienstverband,
      ontvangt van het bevoegd gezag een vergoeding van reis- en verblijfkosten volgens daartoe door het bevoegd gezag
      vastgestelde regels. De kosten van een geneeskundig onderzoek komen voor rekening van het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-J16
  - number: I-K1
    text: 'In dit hoofdstuk wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-K1
  - number: I-K1.a
    text: 'diensttijd: de tijd, doorgebracht:'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-K1
  - number: I-K1.a.1
    text: |-
      in een betrekking bij een bevoegd gezag aan een instelling als bedoeld in artikel I-A1, onder *d*, met dien
      verstande dat de tijd vóór 1 januari 1956 doorgebracht aan scholen voor kleuteronderwijs slechts medetelt indien
      daartoe naar het oordeel van Onze minister aanleiding bestaat;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-K1
  - number: I-K1.a.2
    text: in een burgerlijke dienstbetrekking bij de Nederlandse overheid;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-K1
  - number: I-K1.a.3
    text: |-
      in een betrekking waarbij betrokkene in dienst is van een lichaam als bedoeld in artikel 2, eerste lid, onder *b,
      c, d, e* en *f*, dan wel als bedoeld in artikel 2, derde lid, onderdeel *b*, jo. artikel 3 van de WPA;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-K1
  - number: I-K1.a.4
    text: |-
      in een betrekking bij een bevoegd gezag aan een instelling als bedoeld in artikel I-A1, onder *d*7, voordat deze
      werd aangewezen als lichaam, bedoeld in artikel 1, eerste lid onder *g*, van de WPA, dan wel als bedoeld in artikel
      2, derde lid onderdeel *b*, juncto artikel 3 van de WPA;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-K1
  - number: I-K1.a.5
    text: vóór 1 januari 1966 in een betrekking als bedoeld in artikel 4, eerste lid, van de Pensioenwet 1922 (*Stb.* 240);
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-K1
  - number: I-K1.a.6
    text: |-
      in een burgerlijke dienstbetrekking bij de overheid van de Nederlandse Antillen, Aruba en, vóór 25 november
      1975, Suriname, bij de voormalige gouvernementen van Suriname, Curaçao en Nieuw-Guinea alsmede, vóór 27 december
      1949, bij de voormalige Nederlands Indische overheid, waaronder mede worden begrepen de voormalige Indische
      Pensioenfondsen;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-K1
  - number: I-K1.a.7
    text: |-
      in een dienstbetrekking bij het niet-openbaar onderwijs in de onder 6 vermelde voormalige Rijksdelen, voor zover
      zulks de betrokkene onder de werkingssfeer van een overheidspensioenregeling heeft gebracht of zou hebben gebracht,
      indien hij in vaste dienst zou zijn aangesteld;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-K1
  - number: I-K1.a.8
    text: |-
      vóór 1 januari 1955 in dienst van de Republiek Indonesië, voor zover die tijd door de
      [Garantiewet Burgerlijk Overheidspersoneel Indonesië][ref1] (*Stb.* 1950, K 178) wordt bestreken;


      [ref1]: https://wetten.overheid.nl/BWBR0002060
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-K1
    references:
      - id: ref1
        bwb_id: BWBR0002060
  - number: I-K1.a.9
    text: |-
      in Nederlandse militaire dienst of daarmede voor de toepassing van de desbetreffende rechtspositieregelingen
      gelijkgestelde dienst, waaronder mede worden begrepen het voormalige KNIL en de troepen in de Nederlandse Antillen,
      Aruba en, vóór 25 november 1975, Suriname.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-K1
  - number: I-K1.a.10
    text: als volontair met een volledige dagtaak in een betrekking bij de Nederlandse overheid;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-K1
  - number: I-K1.b
    text: 'jubileumdatum: de datum waarop de betrokkene een diensttijd van 25, 40 dan wel 50 jaren volbrengt;'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-K1
  - number: I-K1.c
    text: |-
      bezoldiging: 'voor zover het betreft: een betrekking bij een bevoegd gezag aan een instelling als bedoeld in artikel'
      I-A1, onder *d*1, *d*2, *d*4 tot en met *d*7 en *d* 10, *d* 12 tot en met *d*18: de tot een maandbedrag herleide
      bezoldiging of som der bezoldigingen welke voor de betrokkene op de jubileumdatum aan één of meer instellingen
      geldt, tot ten hoogste de bezoldiging behorende bij een normbetrekking; een en ander vermeerderd met: de vakantie-
      uitkering over de desbetreffende maand; en de toelage wegens onregelmatige dienst over één maand, berekend naar
      hetgeen de betrokkene in de 3 aan de jubileumdatum voorafgaande kalendermaanden gemiddeld aan zodanige toelage
      heeft ontvangen.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-K1
  - number: I-K2
    text: |-
      De betrokkene heeft bij het bereiken van de jubileumdatum aanspraak op een door het bevoegd gezag uit te betalen
      jubileumgratificatie.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-K2
  - number: I-K3
    text: |-
      De jubileumgratificatie bedraagt bij een 25-jarig jubileum 50% en bij een 40- of 50-jarig jubileum 100% van de
      bezoldiging. De bedragen worden op een veelvoud van 5 gulden naar boven afgerond.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-K3
  - number: I-K4
    text: |-
      Indien betrokkene op de jubileumdatum een betrekking aan meer dan een instelling heeft, wordt de
      jubileumgratificatie uitbetaald door ieder van de betrokken bevoegde gezagsorganen voor een evenredig deel.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-K4
  - number: I-K5
    text: |-
      De tijd gedurende welke de betrokkene twee of meer betrekkingen naast elkaar vervulde, komt slechts eenmaal in
      aanmerking voor de berekening van de diensttijd voor de jubileumgratificatie.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-K5
  - number: I-K6
    text: |-
      De betrokkene die ter zake van zijn dienstvervulling voor een 25-, 40- of 50-jarig jubileum reeds krachtens een
      andere regeling een overeenkomstige gratificatie heeft ontvangen, heeft voor datzelfde jubileum geen aanspraak op
      een jubileumgratificatie als bedoeld in dit hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-K6
  - number: I-K7.1
    text: |-
      Indien de jubileumdatum valt in een periode waarin de betrokkene lang buitengewoon verlof geniet dat, naar het
      oordeel van Onze minister, overwegend of mede in het algemeen belang is verleend, heeft hij, onverminderd het
      bepaalde in artikel I-K6, eerst aanspraak op een jubileumgratificatie zodra hij na afloop van het verlof zijn
      werkzaamheden aan een instelling hervat.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-K7
  - number: I-K7.2
    text: |-
      Bij toepassing van het eerste lid wordt de jubileumgratificatie uitbetaald door het bevoegd gezag van de instelling
      waaraan de betrokkene na afloop van het verlof werkzaam is.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-K7
  - number: I-K7.3
    text: |-
      Daarbij geldt als bezoldiging de bezoldiging die de betrokkene gedurende de maand waarin de jubileumdatum valt
      zou hebben genoten indien hij in de functie en met het salarisnummer welke hij had op de dag voorafgaande aan het
      ingaan van het verlof, op de jubileumdatum in actieve dienst was geweest.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-K7
  - number: I-L1.1
    text: |-
      De betrokkene heeft aanspraak op een vakantie-uitkering voor de tijd gedurende welke hij als zodanig bezoldiging
      heeft genoten.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-L1
  - number: I-L1.2
    text: |-
      Voor de toepassing van het eerste lid wordt onder tijd, gedurende welke bezoldiging is genoten niet begrepen
      tijd gedurende welke de betrokkene wegens verplichte militaire dienst, anders dan voor herhalingsoefeningen,
      niet verlof zijnde, slechts bezoldiging heeft genoten tot een bedrag van het op hem te verhalen gedeelte van de
      pensioenbijdrage.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-L1
  - number: I-L2.1
    text: |-
      Tenzij in de volgende leden anders is bepaald, bedraagt de vakantie-uitkering per kalendermaand 8% van het bedrag
      dat de betrokkene in die maand aan bezoldiging met uitzondering van de vakantie-uitkering heeft genoten.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-L2
  - number: I-L2.2
    text: |-
      Voor de toepassing van het eerste lid wordt in de gevallen bedoeld in artikel 4 en 5 van het Besluit ziekte en
      arbeidsongeschiktheid onderwijs- en onderzoekpersoneel steeds uitgegaan van de volledige aan zijn betrekking
      verbonden bezoldiging.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-L2
  - number: I-L2.3
    text: |-
      Voor de betrokkene die in de van toepassing zijnde maand op grond van het bepaalde in het eerste lid aanspraak
      heeft op een bedrag dat lager is dan het bedrag dat in bijlage 2, onder 2, bij zijn leeftijd is vermeld, wordt de
      vakantie-uitkering vastgesteld op laatstbedoeld bedrag, met dien verstande dat dit bedrag naar evenredigheid wordt
      verminderd voor de betrokkene die is aangesteld in een betrekking met een omvang van minder dan een normbetrekking.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-L2
  - number: I-L2.4
    text: 'Het in het derde lid bedoelde bedrag wordt naar evenredigheid verminderd indien:'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-L2
  - number: I-L2.4.a
    text: de betrokkene in de desbetreffende maand of gedurende een deel daarvan een deelbetrekking heeft vervuld;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-L2
  - number: I-L2.4.b
    text: |-
      de bezoldiging van de betrokkene op een andere dag dan de eerste dag van die maand is aangevangen dan wel indien
      hij in een deel van die maand geen bezoldiging heeft genoten;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-L2
  - number: I-L2.4.c
    text: |-
      de betrokkene in de loop van die maand slechts een gedeelte van zijn bezoldiging heeft genoten wegens verleend
      verlof, in verband met non-activiteit, bij wijze van disciplinaire straf of uit hoofde van schorsing.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-L2
  - number: I-L3.1
    text: |-
      Het bepaalde in dit hoofdstuk is mede van toepassing op de gewezen betrokkene, die ingevolge artikel 39, eerste,
      tweede, vierde of zesde lid van het Besluit ziekte en arbeidsongeschiktheid onderwijs- en onderzoekpersoneel nog
      bezoldiging geniet.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-L3
  - number: I-L3.2
    text: |-
      Voor de betrokkene op wie het bepaalde in artikel I-D3, tweede lid, van toepassing is wordt de vakantie-uitkering
      berekend op basis van de volle aan zijn betrekking verbonden bezoldiging. Hij geniet deze uitkering slechts voor
      zoveel die uitgaat boven de vakantie-uitkering, waarop hij als militair aanspraak heeft.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-L3
  - number: I-L4.1
    text: |-
      De vakantie-uitkering wordt per instelling eenmaal per jaar in de maand mei uitbetaald over de periode van twaalf
      maanden die eindigt met de maand mei.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-L4
  - number: I-L4.2
    text: |-
      In afwijking van het bepaalde in het eerste lid vindt bij ontslag van de betrokkene de uitbetaling plaats over het
      tijdvak, gelegen tussen het einde van de laatst verstreken periode waarover de vakantie-uitkering werd uitbetaald
      en de datum van ontslag.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-L4
  - number: I-L4.3
    text: |-
      Voor de toepassing van dit artikel wordt met ontslag van de betrokkene gelijkgesteld de beëindiging van de
      doorbetaling van de bezoldiging van de gewezen betrokkene, bedoeld in artikel I-L3, eerste lid.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-L4
  - number: I-M1
    text: 'In deze paragraaf wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-M1
  - number: I-M1.a
    text: 'betrokkene:'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-M1
  - number: I-M1.a.1
    text: |-
      de betrokkene, bedoeld in artikel I-A1 onder e1, e2 en e16, e4, e5 en e6, alsmede e10, e13 tot en met e15, e17 en
      e18, voor zover het betreft een lid van het onderwijsondersteunend of ondersteunend personeel en e12 voorzover het
      niet de directie bedoeld in artikel I-Q1001, onder f, betreft;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-M1
  - number: I-M1.a.2
    text: de betrokkene, bedoeld in artikel I-A1, onder *e*7;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-M1
  - number: I-M1.b
    text: |-
      studie: een opleiding die van belang is voor het persoonlijk welbevinden van de betrokkene in zijn arbeidssituatie
      en, naar het oordeel van het bevoegd gezag, tevens van belang is voor de uitoefening van zijn functie;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-M1
  - number: I-M1.c
    text: 'studiefaciliteiten:'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-M1
  - number: I-M1.c.1
    text: verlof als bedoeld in artikel I-M3;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-M1
  - number: I-M1.c.2
    text: een tegemoetkoming in de studiekosten als bedoeld in artikel I-M4;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-M1
  - number: I-M1.d
    text: 'ontslag: elke beëindiging van het dienstverband.'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-M1
  - number: I-M2.1
    text: |-
      De betrokkene die voor studiefaciliteiten in aanmerking wenst te komen, dient het verzoek daartoe in de regel in
      voor de aanvang van de studie. Hij laat dit verzoek vergezeld gaan van de voor de beoordeling door het bevoegd
      gezag noodzakelijke gegevens en van een schatting van de te maken studiekosten.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-M2
  - number: I-M2.2
    text: |-
      Het bevoegd gezag kan, alvorens studiefaciliteiten te verlenen, een studieadvies of in bijzondere gevallen
      na overleg met de betrokkene een psychologisch advies inwinnen. Tenzij deze adviezen worden ingewonnen op
      uitdrukkelijk verzoek van de betrokkene, komen de daaraan verbonden kosten voor rekening van het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-M2
  - number: I-M2.3
    text: |-
      Studiefaciliteiten worden verleend voor een bepaalde termijn, die wordt afgeleid van de normaal te achten duur van
      de studie. Het bevoegd gezag kan deze termijn verlengen.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-M2
  - number: I-M2.4
    text: |-
      Verleende studiefaciliteiten kunnen, al dan niet tijdelijk, worden ingetrokken indien het bevoegd gezag op grond
      van verkregen inlichtingen van oordeel is, dat de betrokkene niet in die mate studeert of vorderingen maakt dat
      hij in staat kan worden geacht de studie binnen de in het derde lid bedoelde termijn te voltooien. De intrekking
      geschiedt niet indien de betrokkene aannemelijk maakt, dat deze omstandigheid niet aan hem te wijten is.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-M2
  - number: I-M2.5
    text: |-
      Aan de betrokkene, die krachtens een op hem van toepassing zijnde regeling aanspraak heeft op een verhoging
      van zijn bezoldiging uitsluitend op grond van het voltooien van een studie, worden ter zake van die studie geen
      studiefaciliteiten verleend.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-M2
  - number: I-M3.1
    text: |-
      Tenzij het belang van de instelling zich daartegen verzet, kan aan de betrokkene studieverlof met behoud van
      bezoldiging worden verleend voor ten hoogste een halve dag per week, met dien verstande dat indien lessen in de
      normale werktijd moeten worden gevolgd, het verlof tot maximaal één dag per week kan worden verleend.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-M3
  - number: I-M3.2
    text: |-
      Onverminderd het bepaalde in het eerste lid kan studieverlof worden verleend op de dag, waarop wordt deelgenomen
      aan een examen of een tentamen, dat aan het einde van de studie is gelegen dan wel volgt op een duidelijk afgerond
      onderdeel van de studie.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-M3
  - number: I-M3.3
    text: |-
      Ter voorbereiding op een examen en tentamen als bovenbedoeld kan bovendien studieverlof worden verleend voor ten
      hoogste vijf halve dagen per jaar.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-M3
  - number: I-M4.1
    text: 'Voor volledige tegemoetkoming komen in aanmerking:'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-M4
  - number: I-M4.1.a
    text: |-
      indien de studie in een andere plaats dan de woon- of standplaats moet worden gevolgd; de noodzakelijk gemaakte
      reiskosten voor interlokaal vervoer en het daarmee in samenhang optredende vervoer in de plaats waar de cursus of
      het examen wordt gehouden, op basis van het laagste tarief van het gebezigde middel van openbaar vervoer, waarvan
      redelijkerwijs gebruik kan worden gemaakt, voor zover de betrokkene voor deze kosten niet uit anderen hoofde een
      vergoeding geniet; kan van openbaar vervoer redelijkerwijs geen gebruik worden gemaakt, dan worden de noodzakelijk
      gemaakte kosten vergoed tegen het tarief genoemd in artikel 6, tweede lid, van de Regeling vergoeding reis- en
      verblijfkosten bij dienstreizen voor onderwijspersoneel;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-M4
  - number: I-M4.1.b
    text: |-
      de werkelijk gemaakte kosten, welke in verband met het afleggen van een examen noodzakelijkerwijze worden gemaakt
      voor nachtverblijf en het gebruik van maaltijden, met dien verstande dat de daarvoor in artikel 17 van de Regeling
      vergoeding van reis- en verblijfkosten bij dienstreizen voor onderwijspersoneel geldende bedragen niet worden
      overschreden.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-M4
  - number: I-M4.2
    text: 'Voor een tegemoetkoming van maximaal 50% komen in aanmerking de noodzakelijk gemaakte:'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-M4
  - number: I-M4.2.a
    text: aanschaffingskosten van het verplicht gestelde studiemateriaal;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-M4
  - number: I-M4.2.b
    text: cursus- of lesgelden;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-M4
  - number: I-M4.2.c
    text: examen- of diplomakosten.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-M4
  - number: I-M4.3
    text: |-
      In bijzondere gevallen kan met toestemming van Onze minister, het in het tweede lid genoemde percentage op 75
      worden gesteld.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-M4
  - number: I-M4.4
    text: |-
      Een tegemoetkoming in studiekosten wordt eerst verleend nadat de betrokkene schriftelijk heeft verklaard dat hij
      bekend is met de verplichting tot gehele of gedeeltelijke terugbetaling, bedoeld in artikel I-M5.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-M4
  - number: I-M5.1
    text: 'De betrokkene is verplicht tot terugbetaling van de aan hem verleende tegemoetkoming in de studiekosten in geval:'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-M5
  - number: I-M5.1.a
    text: hem ontslag wordt verleend vóórdat de studie met goed gevolg is afgesloten;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-M5
  - number: I-M5.1.b
    text: |-
      de studie niet met goed gevolg is afgesloten op grond van omstandigheden die naar het oordeel van het bevoegd gezag
      aan de betrokkene te wijten zijn;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-M5
  - number: I-M5.1.c
    text: |-
      hem ontslag wordt verleend binnen een termijn van drie jaren sedert de datum, waarop de studie met goed gevolg
      is afgesloten.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-M5
  - number: I-M5.2
    text: 'De in het eerste lid bedoelde verplichting tot terugbetaling wordt beperkt:'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-M5
  - number: I-M5.2.a
    text: |-
      in de gevallen, bedoeld in het eerste lid onder *a* en *b*, tot het bedrag dat de betrokkene is uitbetaald in het
      tijdvak van drie jaren, voorafgaande aan de datum, waarop de desbetreffende omstandigheid zich heeft voorgedaan;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-M5
  - number: I-M5.2.b
    text: |-
      in het geval, bedoeld in het eerste lid onder *c*, voor elke maand welke ontbreekt aan de in die bepaling
      genoemde termijn, tot 1/36 gedeelte van het bedrag dat de betrokkene is uitbetaald in het tijdvak van drie jaren
      voorafgaande aan de datum waarop de studie is afgesloten.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-M5
  - number: I-M5.3
    text: 'De in het eerste lid bedoelde verplichting geldt niet indien:'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-M5
  - number: I-M5.3.a
    text: |-
      de betrokkene ter zake van het ontslag aanspraak heeft op een uitkering als bedoeld in het
      [Besluit werkloosheid onderwijs- en onderzoekpersoneel][ref1] of op een direct ingaand pensioen;


      [ref1]: https://wetten.overheid.nl/BWBR0006445
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-M5
    references:
      - id: ref1
        bwb_id: BWBR0006445
  - number: I-M5.3.b
    text: |-
      de betrekking waaruit de betrokkene is ontslagen aansluitend wordt gevolgd door een nieuwe betrekking bij het
      onderwijs dan wel in overheidsdienst.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-M5
  - number: I-P1
    text: 'In dit hoofdstuk wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P1
  - number: I-P1.a
    text: |-
      betrokkene: de betrokkene genoemd in artikel I-A1, onder *e*1, *e*2, *e*4 tot en met *e*6, alsmede *e*10, *e*12 tot
      en met *e*18;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P1
  - number: I-P1.b
    text: |-
      salaris: het bedrag dat met inachtneming van de bepalingen van dit besluit voor de betrokkene is vastgesteld aan de
      hand van de bijlagen 1A tot en met 1D en 1F van dit besluit;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P1
  - number: I-P1.c
    text: |-
      schaal: een als zodanig in een der bijlagen 1A en 1B van dit besluit vermelde reeks van genummerde salarissen,
      behorende bij een normbetrekking;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P1
  - number: I-P1.d
    text: 'maximumschaal: de hoogste schaal die behoort bij een functie;'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P1
  - number: I-P1.e
    text: 'aanloopschaal: een bij een functie behorende lagere schaal dan de maximumschaal;'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P1
  - number: I-P1.f
    text: |-
      salarisnummer: een aanduiding, bestaande uit een getal of uit een letter en een getal, dat in een salarisschaal bij
      een salaris is vermeld;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P1
  - number: I-P1.g
    text: |-
      maximumsalaris: het hoogste bedrag dat in een schaal voorkomt, waarvan het salarisnummer uitsluitend uit een getal
      bestaat;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P1
  - number: I-P1.h
    text: |-
      functie: het samenstel van werkzaamheden aan één of meer instellingen door de betrokkene in dienst van hetzelfde
      bevoegd gezag te verrichten krachtens en overeenkomstig hetgeen hem uit hoofde van een benoeming als bedoeld in
      artikel I-A1, onder *o*, door het bevoegd gezag is opgedragen; een en ander conform het bepaalde in de hoofdstukken
      I-Q, I-R of I-S;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P1
  - number: I-P1.i
    text: |-
      normfunctie: een functie waarvan de inhoud en het niveau zijn omschreven in de bijlage Q1, Q2 en Q5 tot en met Q14,
      R1 en R2, R5 tot en met R11*a*, S1 en S4 tot en met S12 bij dit besluit;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P1
  - number: I-P1.j
    text: |-
      carrièrepatroon: de wijze waarop de betrokkene op grond van het bepaalde in hoofdstuk I-Q, I-R of I-S het
      maximumsalaris van de bij zijn functie behorende maximumschaal bereikt;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P1
  - number: I-P1.k
    text: |-
      formatie: 'het samenstel van functies voor het gehele personeel in niveaus en aantallen, uitgedrukt in de omvang:'
      van een normbetrekking of een gedeelte daarvan;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P1
  - number: I-P1.l
    text: |-
      tijdelijke uitbreiding betrekkingsomvang: de tijdelijke uitbreiding van de betrekkingsomvang op grond van dit
      besluit van een reeds bij het bevoegd gezag benoemd personeelslid;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P1
  - number: I-P1.m
    text: |-
      begintraject: de reeks salarisbedragen die voorafgaat aan de aanloopschaal bij een functie als bedoeld in hoofdstuk
      I-R, zoals aangegeven in bijlage 1D;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P1
  - number: I-P1.n
    text: 'eindejaarsuitkering: de uitkering als bedoeld in artikel I-P30;'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P1
  - number: I-P1.o
    text: |-
      aanlooptraject: de reeks salarisbedragen die voorafgaat aan de maximumschaal bij een functie als bedoeld in artikel
      I-S102*a*, zoals aangegeven in bijlage 1F.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P1
  - number: I-P2.1
    text: De betrokkene wordt benoemd in één van de functies die door het bevoegd gezag beschikbaar is gesteld.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P2
  - number: I-P2.2
    text: |-
      Het salaris van de betrokkene wordt vastgesteld aan de hand van de functie waarin hij is benoemd, een en ander met
      inachtneming van het bepaalde in dit hoofdstuk en in de hoofdstukken I-Q, I-R of I-S.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P2
  - number: I-P2.3
    text: |-
      De betrokkene kan bij een bevoegd gezag aan de instelling of instellingen waaraan hij uit hoofde van zijn
      benoeming verbonden kan worden, slechts in één functie zijn benoemd, met dien verstande dat in het kader van de
      bestuursbenoeming, bedoeld in artikel I-A1, onderdeel p, als één functie worden aangemerkt:
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P2
  - number: I-P2.3.a
    text: onderwijsgevende functies met dezelfde maximumschaal en hetzelfde carrièrepatroon;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P2
  - number: I-P2.3.b
    text: gelijksoortige onderwijsondersteunende functies met dezelfde maximumschaal en hetzelfde carrièrepatroon.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P2
  - number: I-P2.4
    text: |-
      Het bevoegd gezag kan naast of in plaats van de normfuncties andere functies voor de instelling vaststellen
      waarbij taken behorend tot die normfunctie worden verzelfstandigd of andere taken dan wel taken behorende tot
      verschillende normfuncties worden samengevoegd tot één nieuwe functie. Voor het bevoegd gezag van een instelling
      bedoeld in artikel I-A1, onder *d*1 tot en met *d*6, *d*10 en *d*13 tot en met *d*15, *d*17 en *d*18 geldt dat
      de maximumschaal van de in de eerste volzin bedoelde nieuwe functie ten hoogste één schaal hoger kan zijn dan de
      maximumschaal die op grond van hoofdstuk I-Q behoort bij de normfunctie directeur aan de desbetreffende instelling
      doch niet hoger dan schaal 18. Zonodig in afwijking van het bepaalde in de tweede volzin geldt voor het bevoegd
      gezag van een instelling bedoeld in artikel I-A1, onder *d*1 en *d*2, dat de maximumschaal van de in de eerste
      volzin bedoelde nieuwe functie in het kader van [artikel 29, tweede lid, van de Wet op het primair onderwijs][ref1],
      [artikel 29, tweede lid, van de Wet op de expertisecentra][ref2], of
      [artikel 149, tweede lid, van de Wet op het voortgezet onderwijs][ref3], ten hoogste schaal 13 kan zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel29
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel149
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P2
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '29'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '29'
      - id: ref3
        bwb_id: BWBR0002399
        artikel: '149'
  - number: I-P2.5
    text: |-
      In de situaties bedoeld in het vierde lid stelt het bevoegd gezag een functiebeschrijving op en geeft daarbij
      de plaats in de organisatie aan voor de nieuwe functie. Tevens wordt de maximumschaal aangegeven op basis van
      de aard en het niveau van de werkzaamheden die in de functie zijn samengebracht rekening houdend met de voor
      het rijkspersoneel ter zake geldende normen en in samenhang met de formatie, en geeft het bevoegd gezag aan of
      hoofdstuk I-Q, I-R of I-S op die functie van toepassing is.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P2
  - number: I-P2.6
    text: |-
      De betrokkene die zich niet kan verenigen met de uitkomst van de waardering van zijn functie als bedoeld in het
      vijfde lid, kan het bevoegd gezag verzoeken die waarderingsuitkomst opnieuw in overweging te nemen. Onze minister
      geeft nadere voorschriften voor de behandeling van verzoeken als bedoeld in de eerste volzin.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P2
  - number: I-P2.7
    text: 'In afwijking van het derde lid kan een betrokkene in het in dat lid bedoelde geval worden benoemd:'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P2
  - number: I-P2.7.a
    text: |-
      in twee functies als bedoeld in hoofdstuk I-S dan wel hoofdstuk I-R en I-S, indien er een verschil van meer dan
      drie schalen is tussen de bij die functies behorende maximumschalen, of
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P2
  - number: I-P2.7.b
    text: |-
      in twee functies als bedoeld in hoofdstuk I-R indien die functies bestaan uit een normfunctie leraar voor
      basisscholen enerzijds en een normfunctie leraar voor speciale scholen voor basisonderwijs anderzijds.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P2
  - number: I-P2.8
    text: |-
      Over belangrijke facetten van de concrete taakinhoud en over wijziging daarvan pleegt het bevoegd gezag overleg met
      de betrokken betrokkene. De werkzaamheden moeten redelijkerwijs aan de betrokkene kunnen worden opgedragen.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P2
  - number: I-P3.1
    text: De betrokkene wordt benoemd in een normbetrekking of een deel daarvan, onverminderd het vijfde lid.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P3
  - number: I-P3.2
    text: |-
      De normbetrekking op jaarbasis wordt gerealiseerd door met inachtneming van het verlof op grond van artikel I-C2
      respectievelijk artikel I-C7, tweede lid eerste volzin, op jaarbasis uit te gaan van een arbeidsduur van 1710 uren,
      waaruit verlof wordt verleend op grond van artikel I-C41.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P3
  - number: I-P3.3
    text: |-
      In afwijking van het tweede lid wordt de normbetrekking door het bevoegd gezag op verzoek van betrokkene
      gerealiseerd door middel van een arbeidsduur op jaarbasis die met inachtneming van het verlof op grond van
      artikel I-C2 respectievelijk artikel I-C7, tweede lid eerste volzin, wordt gelijkgesteld met 1790 uren, tenzij het
      dienstbelang zich daartegen verzet.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P3
  - number: I-P3.4
    text: |-
      Aan het derde lid kan geen toepassing worden gegeven indien dat op enigerlei wijze direct leidt tot een plaatsing
      in de formatie, bedoeld in artikel I-P76, tweede lid onder b, dan wel tot enige uitkering op grond van het
      [Besluit Werkloosheid onderwijs- en onderzoekpersoneel][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006445
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P3
    references:
      - id: ref1
        bwb_id: BWBR0006445
  - number: I-P3.5
    text: |-
      Voor de betrokkene geldt dat de omvang van zijn betrekking of betrekkingen, waaronder tevens zijn begrepen
      werkzaamheden al of niet in dienstverband buiten het onderwijs verricht en waarmee inkomen wordt verworven, de
      omvang van 120% van een normbetrekking niet te boven mag gaan.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P3
  - number: I-P4.1
    text: |-
      Het salaris van de betrokkene die is benoemd in een betrekking met een omvang anders dan die van een normbetrekking
      wordt naar evenredigheid van die betrekkingsomvang berekend. De aldus berekende uitkomst wordt op rekenkundige
      wijze afgerond op centen.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P4
  - number: I-P4.2
    text: |-
      Waar dit in hoofdstuk of in de hoofdstukken I-Q, I-R of I-S sprake is van een vergelijking van salarisbedragen
      ten einde een inpassingsschaalbedrag te kunnen vaststellen moet worden uitgegaan van het salarisbedrag behorende
      bij een normbetrekking. Zonodig wordt het voor een betrokkene feitelijk geldende salaris omgerekend naar een
      salarisbedrag behorende bij een normbetrekking.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P4
  - number: I-P5.1
    text: |-
      Zonder voorafgaand ontslag kan voor een betrokkene geen andere functie gaan gelden dan de functie waarin hij reeds
      is benoemd, behoudens het bepaalde in de artikelen I-Q106, I-Q107, I-Q209 en I-S110. De eerste volzin is niet van
      toepassing indien het bevoegd gezag bij de bepaling van het functieniveau met de betrokkene is overeengekomen dat
      zijn functie een tijdelijk karakter heeft en de schaal in verband daarmee slechts tijdelijk zal gelden.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P5
  - number: I-P5.2
    text: |-
      De omvang van de betrekking van een betrokkene die in vaste dienst is benoemd, wordt niet tegen zijn wil verkleind,
      behoudens de mogelijkheid van het verval van rechtswege op grond van artikel I-P80.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P5
  - number: I-P5.3
    text: |-
      Het eerste lid is niet van toepassing op het personeel genoemd in artikel I-A1, onder *e*5, *e*6, *e*10, *e*13 tot
      en met *e*15, *e*17 en *e*18, *e*17 en *e*18.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P5
  - number: I-P5.4
    text: |-
      Indien een betrokkene, als bedoeld in artikel I-A1, onder *e*5, *e*10, *e*14, *e*15, *e*17 en *e*18, in verband
      met de opheffing van zijn functie, aan dezelfde instelling direct aansluitend wordt benoemd in een functie met
      een lager functieniveau dan het functieniveau dat behoorde bij zijn oude functie en indien het salaris dat hij
      op de dag direct voorafgaande aan de benoeming in die oude functie genoot, hoger is dan het hoogste bedrag in de
      maximumschaal van de functie waarin benoeming plaatsvindt, wordt aan hem voor de duur van die benoeming een toelage
      toegekend ter grootte van het verschil tussen het bedrag behorende bij het salarisnummer dat op hem van toepassing
      was op de dag voorafgaande aan de benoeming in de bedoelde functie en het hoogste bedrag in de maximumschaal
      behorend bij de functie waarin de benoeming plaatsvindt. De toelage vervalt indien hij aan een andere instelling
      wordt benoemd danwel indien hij wordt benoemd in een functie met een hogere maximumschaal.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P5
  - number: I-P6.1
    text: |-
      Bij elke functie behoren één of meer schalen, een aantal schalen en een begintraject, of één schaal en een
      aanlooptraject. Het salaris van de in die functie benoemde betrokkene wordt vastgesteld aan de hand van één van de
      salarisbedragen die in het begintraject, het aanlooptraject of die schaal dan wel schalen voorkomen.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P6
  - number: I-P6.2
    text: |-
      Indien het bepaalde in hoofdstuk I-Q, I-R of I-S dit voorschrijft, wordt het salaris van de betrokkene eerst
      vastgesteld op een der salarisbedragen in het begintraject, aanlooptraject, de aanloopschaal of -schalen en,
      nadat hij die volgens het bepaalde in het desbetreffende hoofdstuk heeft doorlopen, op een salarisbedrag in de
      maximumschaal.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P6
  - number: I-P6.3
    text: |-
      De bij elke functie behorende maximumschaal, aanloopschaal of -schalen, begintraject en aanlooptraject zijn
      aangegeven in hoofdstuk I-Q, I-R of I-S.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P6
  - number: I-P7
    text: |-
      Behoudens het bepaalde in de artikelen I-P8 tot en met I-P11, I-Q104, I-R105 en I-S103 wordt het salaris van de
      betrokkene bij zijn benoeming vastgesteld op het laagste bedrag:
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P7
  - number: I-P7.a
    text: van het begintraject of aanlooptraject dan wel;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P7
  - number: I-P7.b
    text: |-
      indien bij de functie geen begintraject of aanlooptraject behoort, op het laagste bedrag in de laagste schaal
      behorend bij de functie waarin hij wordt benoemd dan wel;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P7
  - number: I-P7.c
    text: |-
      indien bij de functie bedoeld in hoofdstuk I-R schaal 12 als maximumschaal behoort, op het bedrag behorende bij
      salarisnummer 1 in schaal 10.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P7
  - number: I-P8.1
    text: |-
      Het salaris van de betrokkene die reeds eerder in een schooljaar gedurende ten minste 60 werkdagen in een
      onderwijsfunctie werkzaam en bezoldigd is geweest en die wordt benoemd in hetzij een functie met een lagere
      maximumschaal hetzij een functie met eenzelfde maximumschaal en hetzelfde of een ongunstiger carrièrepatroon dan
      die welke behoorde respectievelijk behoorden bij die vorige onderwijsfunctie, wordt vastgesteld in het begintraject
      dan wel, indien het bedrag hoger is of indien er bij de functie geen begintraject behoort in de laagst mogelijke
      schaal die bij zijn nieuwe functie behoort, op hetzelfde bedrag volgens welk hij in die vorige functie werd
      bezoldigd in dat schooljaar.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P8
  - number: I-P8.2
    text: |-
      Indien de in het eerste lid bedoelde betrokkene in enig aan zijn benoeming voorafgaand schooljaar reeds gedurende
      ten minste 60 werkdagen in zijn vorige onderwijsfunctie werkzaam en bezoldigd is geweest, wordt, voor zover het bij
      die vorige functie behorende carrièrepatroon zulks mogelijk maakt, zijn salaris vastgesteld in het begintraject dan
      wel, indien het bedrag hoger is of indien er bij de functie geen begintraject behoort in de laagst mogelijke schaal
      die bij zijn nieuwe functie behoort, op een bedrag dat één periodieke verhoging hoger is dan het salaris dat hij in
      die vorige functie genoot in dat voorafgaande schooljaar.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P8
  - number: I-P8.3
    text: |-
      Het salaris van de betrokkene die reeds eerder in een schooljaar gedurende ten minste 60 werkdagen in een
      onderwijsfunctie werkzaam en bezoldigd is geweest en die wordt benoemd in hetzij een functie met een hogere
      maximumschaal hetzij een functie met een gunstiger carrièrepatroon en ten minste eenzelfde maximumschaal dan die
      welke behoorde respectievelijk behoorden bij die vorige onderwijsfunctie, wordt vastgesteld in het begintraject dan
      wel, indien het bedrag hoger is of indien er bij de functie geen begintraject behoort in de laagst mogelijke schaal
      die bij zijn nieuwe functie behoort op het salarisbedrag dat onmiddellijk gelegen is boven het bedrag volgens welk
      hij in die vorige functie werd bezoldigd in dat schooljaar.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P8
  - number: I-P8.4
    text: |-
      Indien de in het derde lid bedoelde betrokkene in enig aan zijn benoeming voorafgaand schooljaar reeds gedurende
      ten minste 60 werkdagen in zijn vorige onderwijsfunctie werkzaam en bezoldigd is geweest, wordt, voor zover het bij
      die vorige functie behorende carrièrepatroon zulks mogelijk maakt, zijn salaris vastgesteld in het begintraject dan
      wel, indien het bedrag hoger is of indien er bij de functie geen begintraject behoort in de laagst mogelijke schaal
      die bij zijn nieuwe functie behoort, op het salarisbedrag dat onmiddellijk gelegen is boven het bedrag dat volgens
      het bij die vorige functie behorende carrièrepatroon één periodieke verhoging hoger is dan het salaris dat hij in
      die vorige functie genoot in dat voorafgaande schooljaar.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P8
  - number: I-P8.5
    text: |-
      Voor de toepassing van het bepaalde in het eerste tot en met het vierde lid wordt met een schooljaar waarin de
      betrokkene gedurende ten minste 60 werkdagen werkzaam en bezoldigd is geweest in zijn vorige onderwijsfunctie,
      gelijkgesteld een schooljaar waarin de betrokkene gedurende alle schoolweken in die onderwijsfunctie benoemd is
      geweest.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P8
  - number: I-P8.6
    text: |-
      Bij een benoeming in een onderwijsfunctie wordt het salaris van de betrokkene die reeds meer dan één
      onderwijsfunctie vervulde, vastgesteld op de in het eerste tot en met vierde lid aangegeven wijze, met dien
      verstande dat hierbij wordt uitgegaan van
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P8
  - number: I-P8.6.a
    text: |-
      het schooljaar waarin de betrokkene voor het laatst in alle door hem vervulde onderwijsfuncties gezamenlijk
      gedurende alle schoolweken benoemd dan wel gedurende ten minste 60 werkdagen werkzaam en bezoldigd is geweest;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P8
  - number: I-P8.6.b
    text: |-
      de vorige onderwijsfunctie met de hoogst mogelijke maximumschaal waarin de betrokkene tezamen met andere vorige
      onderwijsfuncties met eenzelfde of een hogere maximumschaal in het onder *a* bedoelde schooljaar gedurende alle
      schoolweken benoemd dan wel gedurende ten minste 60 werkdagen werkzaam en bezoldigd is geweest.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P8
  - number: I-P8.7
    text: 'Voor de toepassing van het zesde lid:'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P8
  - number: I-P8.7.a
    text: |-
      worden dagen waarop de betrokkene gelijktijdig in meer dan één onderwijsfunctie werkzaam en bezoldigd was als één
      werkdag geteld; indien hierbij sprake was van twee of meer onderwijsfuncties met dezelfde maximumschaal waarin de
      betrokkene volgens verschillende salarisbedragen werd bezoldigd, worden de dagen waarop deze functies gelijktijdig
      zijn vervuld toegerekend aan de onderwijsfunctie waarin hij op die dagen volgens het hoogste salarisbedrag werd
      bezoldigd; dagen waarop de betrokkene gelijktijdig twee of meer onderwijsfuncties heeft vervuld met verschillende
      maximumschalen, worden toegerekend aan de onderwijsfunctie die hij op die dagen heeft vervuld met de hoogste
      maximumschaal;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P8
  - number: I-P8.7.b
    text: |-
      wordt bij de telling van het aantal werkdagen, bedoeld in het eerste tot en met het vierde lid, uitgegaan van het
      aantal werkdagen waarop de betrokkene in het schooljaar, bedoeld in het zesde lid onder *a*, werkzaam en bezoldigd
      is geweest in alle door hem vervulde onderwijsfuncties gezamenlijk;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P8
  - number: I-P8.7.c
    text: |-
      wordt bij een benoeming in het, in het zesde lid, onder *a*, bedoelde schooljaar of in het onmiddellijk daarop
      volgende schooljaar, voor de betrokkene die op 1 augustus van het in het zesde lid, onder *a*, bedoelde schooljaar
      dezelfde onderwijsfuncties vervulde als op 31 juli van het onmiddellijk daaraan voorafgaande schooljaar, uitgegaan
      van het laatstbedoelde schooljaar indien dit leidt tot vaststelling van een hoger salaris en mits hij in dat
      schooljaar in alle door hem vervulde onderwijsfuncties gezamenlijk gedurende alle schoolweken benoemd dan wel
      gedurende ten minste 60 werkdagen werkzaam en bezoldigd is geweest.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P8
  - number: I-P8.7.d
    text: |-
      wordt bij een benoeming aan dezelfde instelling of ingeval van een bestuursbenoeming bij hetzelfde bevoegd gezag,
      de vorige onderwijsfunctie met een hogere maximumschaal dan die welke behoort bij de functie waarin de benoeming
      plaatsvindt, buiten beschouwing gelaten indien de belanghebbende niet tenminste drie schooljaren in die vorige
      functie werkzaam is geweest en hij bij dezelfde instelling of ingeval van een bestuursbenoeming bij hetzelfde
      bevoegd gezag eveneens werkzaam is geweest in een functie met een lagere maximumschaal dan die behoorde bij die
      vorige functie. Voor de vaststelling van het salaris wordt uitgegaan van het salaris dat zou zijn genoten in de
      functie met de lagere maximumschaal. Het bepaalde in het vijfde lid is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P8
  - number: I-P8.8
    text: |-
      Vaststelling van het salaris bij benoeming als bedoeld in het eerste tot en met het zevende lid mag er niet toe
      leiden dat het vastgestelde bedrag hoger is dan het hoogste bedrag in de bij de desbetreffende functie behorende
      maximumschaal noch lager dan het laagste bedrag van het bij de functie behorende begintraject dan wel van de
      laagste aanloopschaal indien bij de functie geen begintraject behoort. Indien het salarisbedrag dat de betrokkene
      in zijn vorige functie genoot niet voorkomt in het begintraject of de laagst mogelijke schaal behorende bij de
      functie waarin hij wordt benoemd, wordt het salaris vastgesteld op het naasthogere bedrag in dat begintraject of
      deze schaal. Indien het salaris dat de betrokkene in zijn vorige functie genoot hoger is dan het hoogste bedrag in
      de bij zijn functie behorende maximumschaal wordt zijn salaris vastgesteld op dat hoogste bedrag.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P8
  - number: I-P9.1
    text: |-
      Ten aanzien van de vaststelling van het salaris van de betrokkene die reeds één of meer functies bij het onderwijs
      vervult en die daarnaast wordt benoemd in een andere onderwijsfunctie is het bepaalde in artikel I-P8 van
      overeenkomstige toepassing met dien verstande dat hierbij een aangehouden functie wordt gelijkgesteld met een
      vorige functie.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P9
  - number: I-P9.2
    text: |-
      Het salaris van de in het eerste lid bedoelde betrokkene die wordt benoemd in een functie met een maximumschaal
      en een carrièrepatroon die gelijk zijn aan de maximumschaal en het carrièrepatroon die bij de aangehouden functie
      respectievelijk bij één van de aangehouden functies behoren, wordt, in afwijking van het bepaalde in het eerste
      lid, vastgesteld op hetzelfde bedrag en in hetzelfde begintraject of in dezelfde schaal volgens welke hij wordt
      bezoldigd in de aangehouden functie met die gelijke maximumschaal en carrièrepatroon.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P9
  - number: I-P10.1
    text: |-
      Het salaris van de betrokkene die een inkomen geniet of heeft genoten voor werkzaamheden die buiten het onderwijs
      al dan niet in dienstbetrekking zijn verricht en waarin hij relevante ervaring heeft opgedaan, wordt vastgesteld op
      een bedrag dat ten hoogste één periodieke verhoging hoger is dan evenbedoeld inkomen per maand, in het begintraject
      of in een salarisschaal die voorkomt in het bij zijn functie behorende carrièrepatroon.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P10
  - number: I-P10.2
    text: Onze minister geeft nadere voorschriften voor de uitvoering van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P10
  - number: I-P11.1
    text: |-
      Het salaris van de betrokkene die op het moment dat hij in een onderwijsfunctie wordt benoemd gedurende vier of
      meer achtereenvolgende schooljaren geen functie in het onderwijs heeft vervuld, wordt, onverminderd het bepaalde
      in artikel I-P10 vastgesteld op een bedrag dat hoger is dan het bedrag dat voor hem bij toepassing van artikel I-
      P8 zou gelden en wel voor elke periode van vier schooljaren na het schooljaar waarin de betrokkene voor het laatst
      in alle door hem vervulde onderwijsfuncties gezamenlijk gedurende alle schoolweken benoemd dan wel gedurende ten
      minste 60 werkdagen werkzaam en bezoldigd is geweest, één periodieke verhoging in het begintraject of de laagst
      mogelijke schaal die behoort bij de functie waarin hij wordt benoemd een en ander voor zover dit binnen het bij
      zijn vorige functie behorende carrièrepatroon mogelijk is.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P11
  - number: I-P11.2
    text: |-
      Het salaris van de belanghebbende, niet zijnde de belanghebbende als bedoeld in artikel I-P9, tweede lid, wordt
      bij zijn benoeming in een onderwijsfunctie in afwijking van het bepaalde in het eerste lid en de artikelen I-P7, I-
      P8, I-P9, eerste lid en I-P10, ten minste vastgesteld op een bedrag dat hoger is dan het in artikel I-P7 bedoelde
      bedrag indien hij de voor zijn onderwijsfunctie vereiste kwalificaties of bevoegdheden reeds vier jaar of langer
      geleden heeft verworven. De verhoging bedraagt één periodieke verhoging in het begintraject dan wel de laagst
      mogelijk bij zijn functie behorende schaal voor elke periode van vier volledige jaren die sedert de verwerving van
      de voor zijn functie vereiste kwalificaties of bevoegdheden is verstreken.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P11
  - number: I-P11.3
    text: |-
      Voor de betrokkene bedoeld in artikel I-A1, onder e1, e2 en e16, *e*4 tot en met *e*6, *e*10 en *e*13 tot en
      met *e*15, *e*17 en *e*18, wordt voor de toepassing van het eerste lid, de in dat lid bedoelde periode van vier
      schooljaren verkort tot drie schooljaren voor de eerste periode van zes schooljaren na het schooljaar waarin de
      betrokkene voor het laatst in alle door hem vervulde onderwijsfuncties gezamenlijk gedurende alle schoolweken
      benoemd dan wel gedurende ten minste 60 werkdagen werkzaam en bezoldigd is geweest;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P11
  - number: I-P11.4
    text: |-
      Voor de toepassing van het eerste tot en met het derde lid wordt een schooljaar waarin de betrokkene niet gedurende
      alle schoolweken benoemd en evenmin gedurende ten minste 60 werkdagen werkzaam en bezoldigd is geweest in één of
      meer onderwijsfuncties, gelijkgesteld aan een schooljaar waarin de betrokkene geen functie in het onderwijs heeft
      vervuld.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P11
  - number: I-P12.1
    text: |-
      In afwijking van het bepaalde in de artikelen I-P7 tot en met I-P11 en in de artikelen I-P13 en I-P14 wordt het
      salaris van een betrokkene die de leeftijd van 22 jaar nog niet heeft bereikt, vastgesteld op het bedrag dat in de
      voor hem geldende schaal is opgenomen bij het salarisnummer bestaande uit de letter J en het getal dat overeenkomt
      met zijn leeftijd in jaren voor zover de schaal in bijlage 1B dit aangeeft.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P12
  - number: I-P12.2
    text: |-
      Het salaris van de betrokkene die de leeftijd van 22 jaar bereikt wordt met ingang van de eerste dag van de maand
      waarin hij die leeftijd bereikt, vastgesteld:
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P12
  - number: I-P12.2.a
    text: op het laagste bedrag van het aanlooptraject;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P12
  - number: I-P12.2.b
    text: |-
      Indien bij de functie geen aanlooptraject behoort, op het bedrag dat in de voor hem van toepassing zijnde schaal is
      vermeld bij salarisnummer 0.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P12
  - number: I-P13.1
    text: |-
      Het salaris van de betrokkene van wie het dienstverband niet wordt onderbroken wordt binnen het begintraject,
      aanlooptraject of de schaal jaarlijks op 1 augustus verhoogd tot het naasthogere bedrag onverminderd het bepaalde
      in artikel I-P14.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P13
  - number: I-P13.2
    text: |-
      In afwijking van het eerste lid wordt het salaris van de betrokkene wanneer het voorlaatste salarisnummer beginnend
      met de letter U van schaal 1, 2, 3 of 4 is bereikt, na twee jaar verhoogd tot het naasthogere bedrag.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P13
  - number: I-P14.1
    text: |-
      Behoudens het bepaalde in het tweede lid wordt het salaris van de betrokkene die reeds bij het bevoegd gezag
      benoemd is en die wordt benoemd in hetzij een functie met een hogere maximumschaal hetzij een functie met een
      gunstiger carrièrepatroon en tenminste dezelfde maximumschaal dan die welke behoorde bij zijn vorige functie,
      vastgesteld overeenkomstig het bepaalde in de artikelen I-P8 en I-P9, tweede lid dan wel artikel I-P51, met ingang
      van de datum waarop hij zijn werkzaamheden in die functie aanvangt.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P14
  - number: I-P14.2
    text: |-
      Het bepaalde in het eerste lid is niet van toepassing op de betrokkene voor wie een hogere maximumschaal of
      gunstiger carrièrepatroon ter beschikking komt uitsluitend ten gevolge van de grootte van de instelling.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P14
  - number: I-P14.3
    text: |-
      Indien op grond van het eerste lid een periodieke verhoging wordt toegekend aan een betrokkene wiens salaris werd
      vastgesteld volgens één der schalen 1 tot en met 6, wordt het salarisnummer in de nieuwe schaal zodanig vastgesteld
      dat het salaris in die schaal blijft uitgaan boven het salaris dat voor de betrokkene in de oude schaal zou hebben
      gegolden tot het hoogste bedrag in de bij de nieuwe functie behorende maximumschaal is bereikt.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P14
  - number: I-P15.1
    text: |-
      Indien het salaris van een betrokkene als gevolg van enige bepaling in dit hoofdstuk dan wel in de hoofdstukken I-
      Q, I-R of I-S moet worden vastgesteld over een periode die korter is dan een kalendermaand, wordt uitgegaan van
      de bezoldiging per dag berekend door het bedrag van de bezoldiging per maand te delen door het aantal dagen dat de
      desbetreffende maand telt.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P15
  - number: I-P15.2
    text: |-
      Indien voor een betrokkene die wordt benoemd voor een periode van 6 maanden of korter het salaris als gevolg van
      enige bepaling in dit hoofdstuk dan wel in de hoofdstukken I-Q, I-R of I-S moet worden vastgesteld over een periode
      die korter is dan een kalendermaand geschiedt dit in afwijking van het bepaalde in het eerste lid aan de hand
      van de formule: (w x q + r) x (3:13) x s waarin: w = de werktijdfactor die voor betrokkene geldt; q = het aantal
      volledige kalenderweken gedurende welke betrokkene in de desbetreffende maand werkzaam is; r = het aantal uren
      dat betrokkene feitelijk heeft gewerkt in de niet volledige kalenderweek of kalenderweken gedurende welke hij in
      de desbetreffende maand is benoemd, gedeeld door 36,86; s = het salaris bij een normbetrekking. De uitkomst wordt
      rekenkundig afgerond op centen.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P15
  - number: I-P15.3
    text: |-
      het salaris van de betrokkene die bij een bevoegd gezag reeds benoemd is en van wie de betrekkingsomvang waarin
      hij is benoemd tijdelijk wordt uitgebreid, wordt voor zover het de kalendermaanden betreft waarover die tijdelijke
      uitbreiding zich niet volledig uitstrekt, voor de tijdelijke werkzaamheden vastgesteld overeenkomstig het bepaalde
      in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P15
  - number: I-P16.1
    text: |-
      Indien het salaris bij een normbetrekking minder is dan het maandbedrag van het minimumloon als vermeld in
      bijlage 2, onder 1 bij de leeftijd die de betrokkene heeft wordt aan hem een toelage toegekend ten bedrage van
      het verschil.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P16
  - number: I-P16.2
    text: |-
      Voor de betrokkene bedoeld in het eerste lid met een betrekkingsomvang anders dan een normbetrekking, wordt het
      voor werknemers van dezelfde leeftijd geldende minimumloon geacht te zijn vastgesteld op een evenredig deel van het
      in het eerste lid bedoelde maandbedrag.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P16
  - number: I-P17.1
    text: |-
      De betrokkene is voor door het bevoegd gezag verstrekte genot van woning, verstrekkingen in de woning, kost en
      inwoning een bedrag verschuldigd overeenkomende met een percentage van de voor hem geldende berekeningsbasis tot
      ten hoogste de door Onze minister vastgestelde maximumbedragen als aangegeven in bijlage 3 bij dit besluit.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P17
  - number: I-P17.2
    text: |-
      De berekeningsbasis bedoeld in het eerste lid, komt overeen met de som van salaris bij normbetrekking en toelagen
      op grond van dit besluit. Van de berekeningsbasis maakt geen deel uit de toelage onregelmatige dienst, als bedoeld
      in artikel I-S107 of de garantietoelage onregelmatige dienst als bedoeld in artikel I-S108.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P17
  - number: I-P17.3
    text: |-
      Indien de betrokkene aantoont dat de huurwaarde van de woning voor de heffing van de inkomsten- en loonbelasting
      minder bedraagt dan het op grond van het bepaalde in het eerste lid geldende bedrag wegens genot van de woning,
      wordt het verschuldigde bedrag op dat van die huurwaarde gesteld.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P17
  - number: I-P17.4
    text: |-
      Bij geoorloofde afwezigheid wordt het bedrag dat voor het genot van kost verschuldigd zou zijn voor elke dag dat
      dit emolument niet wordt genoten, verminderd met een bedrag als is aangegeven in bijlage 3.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P17
  - number: I-P17.5
    text: |-
      De op grond van de bepalingen van dit artikel door betrokkene verschuldigde bedragen worden verrekend bij de
      uitbetalingen van het salaris dan wel, indien dat niet mogelijk is, afzonderlijk in rekening gebracht.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P17
  - number: I-P17.6
    text: |-
      In bijzondere gevallen kan een regeling worden getroffen die afwijkt van het bepaalde in het eerste en het vierde
      lid.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P17
  - number: I-P17.7
    text: |-
      In geval andere dan de in dit artikel en bijlage 3 genoemde voordelen worden genoten kan een regeling worden
      getroffen, waarbij de hiervoor door betrokkene verschuldigde bedragen worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P17
  - number: I-P17.8
    text: |-
      Een regeling als bedoeld in het zesde en zevende lid wordt getroffen bij gemeenschappelijke beschikking van Onze
      minister en Onze minister van Binnenlandse Zaken.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P17
  - number: I-P17.9
    text: |-
      Voor zover een verstrekking niet gedurende een hele maand wordt genoten wordt het bedrag van de inhouding over het
      gedeelte van de maand berekend door het maandbedrag van de inhouding te vermenigvuldigen met q * 3/13, waarbij "q"
      gelijk is aan het aantal volledige kalenderweken waarin de desbetreffende verstrekking wordt genoten.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P17
  - number: I-P17.10
    text: |-
      De maximumbedragen als bedoeld in het eerste en het vierde lid worden door Onze minister vastgesteld overeenkomstig
      de bedragen die gelden voor het rijkspersoneel.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P17
  - number: I-P19.1
    text: |-
      Het salaris, de toelagen en de vergoedingen voor extra diensten vastgesteld volgens de bepalingen van dit besluit
      worden per maand uitbetaald.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P19
  - number: I-P19.2
    text: |-
      Het bevoegd gezag verstrekt de betrokkene bij zijn indiensttreding en indien er een wijziging optreedt in het
      salaris, de toelagen of de vergoedingen voor extra diensten, een specificatie van de door hem genoten bezoldiging.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P19
  - number: I-P20.1
    text: De betrokkene is verplicht de werkzaamheden behorende bij de functie waarin hij is benoemd op zich te nemen.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P20
  - number: I-P20.2
    text: |-
      De betrokkene ontvangt geen bezoldiging over de tijd, gedurende welke hij in strijd met zijn verplichtingen
      opzettelijk nalaat zijn werkzaamheden te verrichten en over de tijd, gedurende welke hij bij het einde van zijn
      dienstverband meer verlof op grond van artikel I-C41 of hoofdstuk I-V heeft genoten dan waarop hij aanspraak had.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P20
  - number: I-P20.3
    text: Onze minister geeft voor de toepassing van het bepaalde in het tweede lid nadere voorschriften.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P20
  - number: I-P21.1
    text: |-
      Het bevoegd gezag kan voor ten hoogste 1/3 gedeelte de bezoldiging inhouden van de betrokkene die bij wijze van
      straf is geschorst wegens het feit dat:
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P21
  - number: I-P21.1.a
    text: een strafrechtelijke vervolging wegens misdrijf tegen hem is ingesteld;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P21
  - number: I-P21.1.b
    text: hij krachtens een wettelijke maatregel van zijn vrijheid is beroofd;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P21
  - number: I-P21.1.c
    text: hij de bevoegdheid tot het geven van onderwijs door een nog niet onherroepelijk geworden vonnis heeft verloren.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P21
  - number: I-P21.2
    text: |-
      De ingehouden bezoldiging wordt alsnog uitbetaald indien door de strafrechter geen straf wordt opgelegd of de
      beslissing van het bevoegd gezag tot inhouding van bezoldiging wordt vernietigd alsmede voor zover op andere
      gronden alsnog tot uitbetaling wordt besloten. Op de aldus uit te keren bezoldiging worden in mindering gebracht
      de inkomsten welke de betrokkene sedert de schorsing heeft genoten uit arbeid die hij als gevolg van de schorsing
      heeft kunnen verrichten, tenzij zulks naar het oordeel van het bevoegd gezag onredelijk of onbillijk is.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P21
  - number: I-P21.3
    text: |-
      Van de inhouding en de uitbetaling van de bezoldiging als bedoeld in dit artikel doet het bevoegd gezag terstond
      mededeling aan Onze minister.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P21
  - number: I-P22.1
    text: |-
      De benoeming gaat in op de dag waarop de betrokkene zijn werkzaamheden aanvangt, onverminderd het bepaalde in
      artikel I-R108.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P22
  - number: I-P22.2
    text: |-
      De betrokkene heeft in geval van ontslag aanspraak op bezoldiging tot de dag waarop het ontslag ingaat,
      onverminderd het bepaalde in artikel I-R108.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P22
  - number: I-P22.3
    text: |-
      De betrokkene die blijkens een beslissing als bedoeld in artikel P5 van de pensioenwet blijvend ongeschikt is
      verklaard voor de vervulling van zijn betrekking, blijft benoemd voor ten hoogste de duur van de voor hem geldende
      opzegtermijn, te rekenen vanaf de dag waarop de beslissing onherroepelijk is geworden.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P22
  - number: I-P22.4
    text: |-
      Het dienstverband van de betrokkene die overlijdt, is beëindigd met ingang van de dag volgende op die van het
      overlijden.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P22
  - number: I-P22.5
    text: |-
      Het dienstverband van de betrokkene die krachtens rechterlijke uitspraak tot het geven van onderwijs is uitgesloten
      kan zich uitstrekken tot uiterlijk de dag waarop de rechterlijke uitspraak onherroepelijk is geworden.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P22
  - number: I-P27
    text: |-
      De betrokkene kan op zijn verzoek of met zijn instemming voor bepaalde tijd worden belast met werkzaamheden bij het
      bevoegd gezag van een andere instelling of instellingen dan wel buiten het onderwijs.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P27
  - number: I-P28.1
    text: |-
      Indien aan een bevoegd gezag door Onze minister een vergoeding is verstrekt ten behoeve van het bestrijden van
      al dan niet schoolspecifieke knelpunten in de personeelsvoorziening kan dat bevoegd gezag, uitsluitend ten laste
      van de eigen middelen aan een betrokkene met het oog op deze knelpunten een nader door het bevoegd gezag vast te
      stellen tegemoetkoming verstrekken.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P28
  - number: I-P28.2
    text: |-
      De tegemoetkoming, bedoeld in het eerste lid, maakt geen deel uit van het inkomen, bedoeld in het
      pensioenreglement.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P28
  - number: I-P29
    text: |-
      Het bevoegd gezag kan uitsluitend ten laste van eigen middelen een premie toekennen in het kader van een
      premiespaarregeling in de zin van de [Wet op de loonbelasting 1964][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002471
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P29
    references:
      - id: ref1
        bwb_id: BWBR0002471
  - number: I-P30.1
    text: |-
      Onze minister kan bij ministeriële regeling bepalen dat recht bestaat op een algemene eindejaarsuitkering en
      daarbij de wijze waarop deze uitkering wordt berekend, vaststellen.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P30
  - number: I-P30.2
    text: |-
      In de ministeriële regeling, bedoeld in het eerste lid, kan worden bepaald dat de ministeriële regeling terugwerkt
      tot en met 1 januari 1996.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P30
  - number: I-P50
    text: In afwijking van het bepaalde in artikel I-P1, wordt in deze paragraaf verstaan onder
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P50
  - number: I-P50.a
    text: |-
      instelling: de instelling bedoeld in artikel I-A1, onder *d*4 tot en met *d*6, *d*10, *d*13 tot en met *d*15
      alsmede *d*17 en *d*18;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P50
  - number: I-P50.b
    text: |-
      betrokkene: de betrokkene bedoeld in artikel I-A1, onder *e*4 tot en met *e*6, *e*10, *e*13 tot en met *e*15
      alsmede *e*17 en *e*18.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P50
  - number: I-P51
    text: |-
      Bij de vaststelling van het salaris bij indiensttreding van een betrokkene kan het bevoegd gezag in voor de
      betrokkene gunstige zin afwijken van de artikelen I-P7 tot en met I-P11.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P51
  - number: I-P52
    text: |-
      Het bevoegd gezag kan regels opstellen ten aanzien van het carrièrepatroon en het doorlopen daarvan die afwijken
      van de artikelen I-Q105, I-R106, I-R107 I-S104 en I-S104*a*.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P52
  - number: I-P53.1
    text: |-
      In afwijking van het bepaalde in de artikelen I-P12 en I-P13 geschiedt de verhoging van het salaris bedoeld in die
      artikelen indien de betrokkene naar het oordeel van het bevoegd gezag zijn functie naar behoren vervult.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P53
  - number: I-P53.2
    text: |-
      Bij de toepassing van het bepaalde in de artikelen I-P12 en I-P13 kan het salaris worden vastgesteld op een hoger
      bedrag in het carrièrepatroon dan dat bedoeld in de artikelen I-P12 en I-P13, indien hij naar het oordeel van het
      bevoegd gezag zijn werkzaamheden zeer goed of uitstekend vervult.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P53
  - number: I-P53.3
    text: |-
      Vervult de betrokkene zijn functie naar het oordeel van het bevoegd gezag niet naar behoren, dan blijft
      salarisverhoging als bedoeld in het eerste lid achterwege.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P53
  - number: I-P53.4
    text: |-
      Het tijdstip waarop ingevolge artikel I-P13 een salarisverhoging wordt toegekend, kan worden vervroegd indien
      daartoe naar het oordeel van het bevoegd gezag aanleiding bestaat.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P53
  - number: I-P53.5
    text: Voor de toepassing van het bepaalde in het eerste en tweede lid kan het bevoegd gezag nadere regels vaststellen.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P53
  - number: I-P54
    text: |-
      De betrokkene is verplicht eventuele geldelijke vergoedingen voor nevenwerkzaamheden af te dragen aan de instelling
      of instellingen waar hij werkzaam is, voor zover hij deze verricht gedurende werktijd en voor zover het bevoegd
      gezag hem niet van deze verplichting ontheffing heeft verleend.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P54
  - number: I-P55.1
    text: |-
      Slechts indien naar het oordeel van het bevoegd gezag sprake is van zeer goede of uitstekende vervulling van
      de functie kan voor de duur van een jaar aan de betrokkene die het hoogste bedrag van de voor hem geldende
      maximumschaal heeft bereikt, een toelage worden toegekend.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P55
  - number: I-P55.2
    text: |-
      Slechts indien naar het oordeel van het bevoegd gezag sprake is van zeer goede of uitstekende vervulling van de
      functie en daartoe op grond van bijzondere omstandigheden aanleiding bestaat, kan een toelage voor een langere duur
      dan één jaar worden toegekend.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P55
  - number: I-P55.3
    text: |-
      De in het eerste en het tweede lid bedoelde toelage bedraagt voor de betrokkene voor wie een maximumschaal geldt
      als vermeld in kolom I van onderstaand schema ten hoogste het daarnaast in kolom II genoemde percentage van het
      voor hem geldende salaris.





                    Kolom I (maximumschaal) Kolom II (percentage)




                    tot en met schaal 5 3




                    schaal 6 tot en met schaal 9 6




                    schaal 10 tot en met schaal 13 9




                    schaal 14 en 15 12




                    schaal 16 en hoger 15
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P55
  - number: I-P55.4
    text: De toelage, bedoeld in het eerste lid, maakt geen deel uit van het ambtelijk inkomen als bedoeld in de pensioenwet.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P55
  - number: I-P55.5
    text: Voor de toepassing van het eerste en tweede lid kan het bevoegd gezag nadere regels vaststellen.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P55
  - number: I-P56.1
    text: Bij bijzondere prestaties kan door het bevoegd gezag aan een betrokkene een gratificatie worden toegekend.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P56
  - number: I-P56.2
    text: |-
      Een gratificatie als bedoeld in het eerste lid wordt niet aangemerkt als bezoldiging en maakt geen deel uit van het
      ambtelijk inkomen als bedoeld in de pensioenwet.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P56
  - number: I-P56.3
    text: Voor de toepassing van het eerste lid kan het bevoegd gezag nadere regels vaststellen.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P56
  - number: I-P57.1
    text: |-
      Het bevoegd gezag kan aan de betrokkene die een functie vervult als bedoeld in hoofdstuk I-R of hoofdstuk I-S om
      redenen van werving of behoud een uitkering toekennen. De uitkering maakt geen deel uit van het ambtelijk inkomen
      bedoeld in de pensioenwet.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P57
  - number: I-P57.2
    text: |-
      De in het eerste lid bedoelde uitkering wordt toegekend aan het einde van het tijdvak dat tevoren door het bevoegd
      gezag is vastgesteld. Het bevoegd gezag kan aan de toekenning nadere voorwaarden verbinden.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P57
  - number: I-P57.3
    text: |-
      Aan de betrokkene die niet heeft kunnen voldoen aan de in het tweede lid bedoelde voorwaarden door een naar
      het oordeel van het bevoegd gezag niet aan hem zelf te wijten oorzaak, kan de uitkering niettemin geheel of
      gedeeltelijk worden toegekend.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P57
  - number: I-P57.4
    text: |-
      Aan de betrokkene worden de nadere voorwaarden als bedoeld in het tweede lid, evenals de grootte van de uitkering
      en de maand en het jaar van toekenning, voor zover deze niet reeds in de akte van benoeming zijn vermeld, zo
      spoedig mogelijk schriftelijk medegedeeld.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P57
  - number: I-P58.1
    text: |-
      Het bevoegd gezag kan aan de betrokkene die een functie vervult als bedoeld in hoofdstuk I-R of hoofdstuk I-S om
      redenen van werving of behoud een maandelijkse toelage toekennen.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P58
  - number: I-P58.2
    text: |-
      Een toegekende toelage als bedoeld in het eerste lid wordt door het bevoegd gezag ingetrokken indien de gronden
      waarop de toelage werd toegekend niet meer aanwezig zijn, tenzij het bevoegd gezag van oordeel is dat er
      omstandigheden zijn om de toelage geheel of gedeeltelijk te handhaven.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P58
  - number: I-P59.1
    text: |-
      Indien het niet mogelijk is de betrokkene in relatie tot zijn betrekkingsomvang voldoende bij zijn functie
      behorende werkzaamheden op te dragen, kunnen hem andere werkzaamheden worden opgedragen, mits deze in verband met
      zijn persoonlijkheid en omstandigheden en gelet op zijn functieniveau passend zijn. De betrokkene is verplicht deze
      werkzaamheden te aanvaarden.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P59
  - number: I-P59.2
    text: |-
      Indien het na een zorgvuldig onderzoek in redelijkheid niet mogelijk is gebleken de betrokkene een mede in
      verband met zijn persoonlijkheid en omstandigheden voor hem passende functie bij het bevoegd gezag aan te bieden
      dan wel indien deze een passende functie weigert te aanvaarden, kan ontslag wegens opheffing van de betrekking
      plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P59
  - number: I-P60
    text: |-
      Het bevoegd gezag kan één of meer personeelsleden die in het bezit zijn van een geldig EHBO-diploma maandelijks een
      toelage als vermeld in bijlage 2, onder 3, toekennen.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P60
  - number: I-P75
    text: 'In deze paragraaf wordt, in afwijking van artikel I-P1, verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P75
  - number: I-P75.a
    text: 'instelling: een instelling, bedoeld in artikel I-A1, onder *d*1 of *d*2, *d*12 en *d*16;'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P75
  - number: I-P75.b
    text: 'betrokkene: de betrokkene, bedoeld in artikel I-A1, onder *e*1 en *e*2, *e*12 en *e*16;'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P75
  - number: I-P75.c
    text: |-
      rekeneenheid: de eenheid die voor de instelling beschikbaar is op grond van het het [Formatiebesluit WPO][ref1],
      het [Formatiebesluit WEC][ref2], [deel II van het Formatiebesluit W.V.O.][ref3] of het
      [Besluit trekkende bevolking WPO][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0005446
      [ref2]: https://wetten.overheid.nl/BWBR0005442
      [ref3]: https://wetten.overheid.nl/BWBR0005446
      [ref4]: https://wetten.overheid.nl/BWBR0003833
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P75
    references:
      - id: ref1
        bwb_id: BWBR0005446
      - id: ref2
        bwb_id: BWBR0005442
      - id: ref3
        bwb_id: BWBR0005446
      - id: ref4
        bwb_id: BWBR0003833
  - number: I-P75.d
    text: 'formatiebudget: het totaal aan rekeneenheden dat voor een instelling beschikbaar is.'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P75
  - number: I-P76.1
    text: |-
      Het bevoegd gezag van een instelling als bedoeld in artikel I-A1, onder *d*1 en *d*2, *d*16, stelt vóór 1 mei van
      ieder jaar de formatie van de instelling voor het daaropvolgend schooljaar vast. Het bevoegd gezag, doet vóór het
      begin van het schooljaar mededeling aan Onze minister van de aldus bestede formatierekeneenheden.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P76
  - number: I-P76.2
    text: 'De formatie bedoeld in het eerste lid wordt onderscheiden in de volgende categorieën:'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P76
  - number: I-P76.2.a
    text: de door het bevoegd gezag structureel gewenste functies naar aard, niveau en omvang;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P76
  - number: I-P76.2.b
    text: functies die naar het oordeel van het bevoegd gezag nog slechts één schooljaar kunnen worden gehandhaafd;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P76
  - number: I-P76.2.c
    text: |-
      functies in verband met een project waarvoor door het bevoegd gezag dan wel door Onze minister gedurende 3 of
      minder schooljaren uit additionele middelen formatie beschikbaar is gesteld en die door het bevoegd gezag niet in
      de onder *a* bedoelde formatie zijn opgenomen.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P76
  - number: I-P76.3
    text: |-
      Het bevoegd gezag van een instelling als bedoeld in het eerste lid, neemt in de vast te stellen formatie bedoeld
      in het tweede lid, onder *a* in elk geval de functies van de reeds in deze formatie opgenomen en in vaste dienst
      verbonden betrokkenen op voor de omvang van de betrekking waarin zij zijn benoemd, tenzij dit in het licht van een
      goede en doelmatige uitvoering van de aan de instelling te verrichten werkzaamheden in redelijkheid niet van het
      bevoegd gezag kan worden gevergd.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P76
  - number: I-P76.4
    text: |-
      Indien in de vast te stellen formatie bedoeld in het tweede lid, onder *a*, daarvoor ruimte is ontstaan, neemt het
      bevoegd gezag onder gelijke voorwaarden als genoemd in het derde lid, hierin tevens op functies van in vaste dienst
      verbonden betrokkenen die deel uitmaken van de formatie bedoeld in het tweede lid, onder *b*.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P76
  - number: I-P76.5
    text: |-
      Indien Onze Minister voor korter dan een schooljaar formatierekeneenheden beschikbaar heeft gesteld, wordt in
      afwijking van het bepaalde in het eerste lid, de formatie bedoeld in het tweede lid, onder *c*, tijdens het
      schooljaar opnieuw vastgesteld voor zover de toekenning dan wel het vervallen van deze formatierekeneenheden
      geschiedt tijdens het schooljaar.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P76
  - number: I-P76.7
    text: |-
      Het bevoegd gezag van een instelling als bedoeld in artikel I-A1, onder *d*12, stelt de formatie van de instelling
      vast met inachtneming van het bepaalde in het Uitvoeringsbesluit W.O.V. (*Stb.* 1988, 128). Het bevoegd gezag
      bedoeld in de eerste volzin, neemt in de formatie in elk geval de functies van de aan de instelling verbonden
      betrokkenen op voor de betrekkingsomvang waarvoor zij zijn benoemd, tenzij dit gezien de in artikel D6, tweede lid,
      van het Uitvoeringsbesluit W.O.V. neergelegde uitgangspunten in redelijkheid niet van het bevoegd gezag kan worden
      gevergd.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P76
  - number: I-P77.1
    text: |-
      Indien in de formatie bedoeld in artikel I-P76, tweede lid, onder *a*, een functie beschikbaar komt, wordt die
      functie door het bevoegd gezag van een instelling als bedoeld in artikel I-A1, onder *d*1 en *d*2 en *d*16,
      toegedeeld aan de betrokkene wiens functie is opgenomen in de formatie bedoeld in artikel I-P76, tweede lid
      onder *b*, tenzij dit in het licht van een goede en doelmatige uitvoering van de aan de instelling te verrichten
      werkzaamheden in redelijkheid niet van het bevoegd gezag kan worden gevergd.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P77
  - number: I-P77.2
    text: |-
      Indien een bevoegd gezag van een instelling als bedoeld in het eerste lid, voornemens is over te gaan tot
      herbenoeming van een betrokkene wiens dienstverband is beëindigd in verband met ziekte en arbeidsongeschiktheid
      wordt de betrokkene benoemd voor ten hoogste de betrekkingsomvang die overeenkomt met zijn restvaliditeit en voor
      ten hoogste de betrekkingsomvang die vóór de beëindiging van het dienstverband voor hem in de formatie bedoeld in
      artikel I-P76, tweede lid, was opgenomen.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P77
  - number: I-P78.1
    text: |-
      Voor iedere functie aan een instelling als bedoeld in artikel I-A1, onder d1, d2 en d16, die voor rijksbekostiging
      in aanmerking wordt gebracht, wordt bij een normbetrekking een aantal rekeneenheden verbruikt als is aangegeven in
      onderstaand schema.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P78
  - number: I-P78.1a
    text: |-
      Voor de functie van leraar in opleiding, bedoeld in hoofdstuk I-T, die voor rijksbekostiging in aanmerking wordt
      gebracht, worden bij een normbetrekking aan een instelling als bedoeld in artikel I-A1, onder d1, voor zover
      het betreft een basisschool 76 rekeneenheden verbruikt en voor zover het een speciale school voor basisonderwijs
      betreft 81 eenheden verbruikt, en worden bij een normbetrekking aan een instelling als bedoeld in artikel I-A1,
      onder d2, 81 rekeneenheden verbruikt.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P78
  - number: I-P78.2
    text: |-
      Voor de toepassing van het eerste lid wordt voor de functie van de betrokkene bedoeld in artikel I-Q101, onder *b*,
      uitgegaan van de maximumschaal die op grond van het bepaalde in één van de paragrafen 2 en 3 van hoofdstuk I-Q bij
      de desbetreffende functie behoort.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P78
  - number: I-P78.3
    text: |-
      Indien voor een betrokkene bedoeld in artikel I-S601, V-S201 en V-S301 een hogere salarisschaal geldt of zal gelden
      dan de maximumschaal die behoort bij de functie waarin hij is benoemd, wordt in afwijking van het bepaalde in het
      eerste lid voor zijn functie een aantal rekeneenheden verbruikt dat overeenkomt met de hogere salarisschaal. Het
      bepaalde in de vorige volzin is van overeenkomstige toepassing ten aanzien van een betrokkene bedoeld in artikel I-
      R401, onder *b*, die is benoemd in een functie waarvoor schaal 10 de maximumschaal is en voor wie een salaris geldt
      of zal gelden in maximumschaal 12.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P78
  - number: I-P78.4
    text: |-
      Bij benoeming van een betrokkene als bedoeld in artikel I-A1, onder e1, e2 en e16, dan wel bij benoeming van een
      betrokkene als bedoeld in artikel I-T3, onder a, in een betrekking waarvan de omvang niet gelijk is aan die van
      een normbetrekking wordt het aantal rekeneenheden, bedoeld in het eerste tot en met derde lid, naar evenredigheid
      vastgesteld. De aldus berekende uitkomst wordt op rekenkundige wijze afgerond op 2 decimalen.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P78
  - number: I-P78.5
    text: |-
      Voor de toepassing van het bepaalde in het eerste tot en met derde lid en in afwijking van het bepaalde in het
      vierde lid, geldt dat voor de betrokkene wiens salaris wordt berekend op grond van artikel I-P15, een aantal
      eenheden wordt verbruikt dat wordt berekend aan de hand van de formule w x (d : e) x f, waarin w = de omvang van
      de werktijdfactor waarvoor betrokkene is benoemd voor zover die voor rijksbekostiging in aanmerking wordt gebracht;
      d = het aantal kalenderdagen gedurende welke de betrokkene in die functie in de desbetreffende kalendermaand is
      benoemd; e = het aantal kalenderdagen dat in de desbetreffende maand geldt; f = het aantal rekeneenheden dat op
      grond van het eerste tot en met derde lid bij de desbetreffende functie behoort. De aldus berekende uitkomst wordt
      op rekenkundige wijze afgerond op 2 decimalen.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P78
  - number: I-P78.6
    text: |-
      Indien een betrokkene als bedoeld in artikel I-A1, onder e1, e2 en e16, verlof als bedoeld in artikel I-C32, I-C33,
      I-C34 of I-C35 geniet, is het bepaalde in het eerste tot en met vijfde lid van toepassing, indien de functie van
      de betrokkene gedurende ten minste een gedeelte van het voorafgaande schooljaar voor rijksbekostiging in aanmerking
      werd gebracht.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P78
  - number: I-P80.1
    text: |-
      Indien en voorzover die werkzaamheden niet langer aan de betrokkene worden opgedragen vervalt van rechtswege het
      gedeelte van de betrekkingsomvang van een betrokkene dat bestaat uit:
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P80
  - number: I-P80.1.a
    text: uren boven de normbetrekking; of
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P80
  - number: I-P80.1.b
    text: tijdelijke uitbreiding van de betrekkingsomvang of benoeming
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P80
  - number: I-P80.1.b.1
    text: in verband met vervanging of
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P80
  - number: I-P80.1.b.2
    text: in verband met een tijdelijke voorziening in een vacature voor ten hoogste één jaar;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P80
  - number: I-P80.1.c
    text: |-
      tijdelijke uitbreiding van de betrekkingsomvang of benoeming in verband met een project waarvoor door het bevoegd
      gezag dan wel Onze minister gedurende 3 of minder schooljaren uit additionele middelen formatie beschikbaar is
      gesteld en die door het bevoegd gezag niet in de in artikel I-P76, tweede lid, onder *a*, bedoelde formatie is
      opgenomen.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P80
  - number: I-P80.1.d
    text: |-
      uitbreiding of tijdelijke uitbreiding van de betrekkingsomvang of benoeming in verband met contractactiviteiten die
      gedurende een periode van 3 jaar of minder is toegekend; alsmede
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P80
  - number: I-P80.1.e
    text: |-
      uitbreiding of tijdelijke uitbreiding van de betrekkingsomvang of benoeming gedurende een periode van 3 jaar
      of minder ten gevolge van het toekennen van werkzaamheden in verband met contractactiviteiten aan een andere
      betrokkene.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P80
  - number: I-P80.2
    text: |-
      Het gedeelte van de betrekkingsomvang bedoeld in het eerste lid, wordt voor de duur waarvoor het wordt toegekend
      afzonderlijk in de akte van benoeming vermeld.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P80
  - number: I-P81.1
    text: |-
      Het bevoegd gezag kan, uitsluitend ten laste van eigen middelen en volgens door het bevoegd gezag vast te stellen
      beleidsregels, aan een betrokkene een gratificatie toekennen of een maandelijkse toelage.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P81
  - number: I-P81.2
    text: Het bevoegd gezag kan aan de toekenning van een maandelijkse toelage voorwaarden verbinden.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P81
  - number: I-P81.3
    text: |-
      Het bevoegd gezag trekt een maandelijkse toelage in, indien de gronden voor toekenning van de toelage niet meer
      aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P81
  - number: I-P81.4
    text: |-
      De in het eerste lid bedoelde toelage behoort tot de bezoldiging, bedoeld in het
      [Besluit ziekte- en arbeidsongeschiktheid onderwijs- en onderzoekpersoneel.][ref1]


      [ref1]: https://wetten.overheid.nl/BWBR0007800
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P81
    references:
      - id: ref1
        bwb_id: BWBR0007800
  - number: I-P83.1
    text: |-
      Onze minister kent aan een instelling als bedoeld in artikel I-A1, onder *d*2 een toelage als vermeld in bijlage
      2, onder 3, toe indien het bevoegd gezag deze toekent aan één of meer personeelsleden die in het bezit zijn van een
      geldig EHBO-diploma.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P83
  - number: I-P83.2
    text: |-
      Indien de in het eerste lid bedoelde instelling is gehuisvest in verschillende gebouwen wordt per gebouw dat niet
      in de onmiddellijke nabijheid van de hoofdvestiging staat, door Onze Minister een toelage overeenkomstig het eerste
      lid toegekend.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P83
  - number: I-P83.3
    text: |-
      Onverminderd het bepaalde in het eerste en tweede lid kan het bevoegd gezag uitsluitend ten laste van eigen
      middelen één of meer personeelsleden die in het bezit zijn van een geldig EHBO-diploma maandelijks een toelage als
      vermeld in bijlage 2, onder 3, toekennen.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P83
  - number: I-P84.1
    text: |-
      De betrokkene niet zijnde de betrokkene bedoeld in artikel I-A1, onder *e*12, voor wie de functie is opgenomen
      in de formatie bedoeld in artikel I-P76, tweede lid , onder *b*, is verplicht andere hem door het bevoegd gezag
      opgedragen werkzaamheden die in het kader van de door hem vervulde functie passend zijn te achten, te verrichten,
      dan wel bij een ander bevoegd gezag dan wel buiten het onderwijs een passende betrekking te aanvaarden.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P84
  - number: I-P84.2
    text: |-
      Onverminderd het bepaalde in het eerste lid, kan het bevoegd gezag een betrokkene bedoeld in het eerste lid, een
      sollicitatieplicht of, met inachtneming van artikel I-P86, een scholingsplicht opleggen.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P84
  - number: I-P84.3
    text: |-
      De betrokkene voor wie op grond van het tweede lid een sollicitatieverplichting geldt, is verplicht zich als
      werkzoekende te laten registreren bij de Centrale organisatie werk en inkomen en een andere passende betrekking
      binnen dan wel buiten het onderwijs te aanvaarden.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P84
  - number: I-P85.1
    text: |-
      Ontslag in verband met opheffing van de betrekking kan niet eerder worden verleend dan nadat de functie bedoeld
      in artikel I-P76, tweede lid, onder *a*, gedurende een geheel schooljaar is geplaatst in de formatie bedoeld
      in artikel I-P76, tweede lid, onder *b*. Ontslag wegens opheffing van de betrekking kan niet plaatsvinden om
      herbenoeming in een functie voor een kleinere betrekkingsomvang mogelijk te maken.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P85
  - number: I-P85.2
    text: |-
      Indien het bevoegd gezag van een instelling als bedoeld in artikel I-A1, onder *d*1, *d*2, en *d*16, besluit over
      te gaan tot opheffing van een betrekking dient het eerst zorgvuldig te onderzoeken of het in redelijkheid mogelijk
      is de betrokkene een mede in verband met zijn persoonlijkheid en omstandigheden voor hem passende functie bij het
      bevoegd gezag aan te bieden. Indien een in de eerste volzin bedoelde functie beschikbaar is, vindt ontslag wegens
      opheffing van de betrekking plaats onder gelijktijdige benoeming in de nieuwe functie.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P85
  - number: I-P85.3
    text: |-
      Indien geen passende functie als bedoeld in het eerste lid beschikbaar is, dan wel de betrokkene een passende
      functie weigert te aanvaarden, wordt de betrekking opgeheven indien de functie van de betrokkene niet langer in de
      formatie als bedoeld in artikel I-P76, tweede lid, onder *a* of *b*, is opgenomen.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P85
  - number: I-P85.4
    text: |-
      Het bepaalde in artikel I-P59 is van overeenkomstige toepassing voor de betrokkene aan een instelling als bedoeld
      in artikel I-A1, onder *d*12.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P85
  - number: I-P86
    text: |-
      Indien het bevoegd gezag van een instelling als bedoeld in artikel I-A1, onder *d*1, *d*2, en *d*16, met toepassing
      van het bepaalde in artikel I-P84, tweede lid, aan de betrokkene een scholingsplicht oplegt, gelden hierbij de
      volgende voorwaarden.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P86
  - number: I-P86.a
    text: |-
      Het bevoegd gezag stelt de betrokkene vrij van het verrichten van passende werkzaamheden bedoeld in artikel I-P84,
      eerste lid, voor zover dit noodzakelijk is voor het volgen van de scholing.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P86
  - number: I-P86.b
    text: |-
      Het bevoegd gezag belast de betrokkene niet met het geven van onderwijs bedoeld in de taakkarakteristiek, voor
      zover deze lesgebonden taken zouden samenvallen met het volgen van de scholing.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P86
  - number: I-P86.c
    text: |-
      Tussen het bevoegd gezag en de betrokkene wordt een redelijke termijn afgesproken waarbinnen de betrokkene de
      scholing met succes kan afronden.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P86
  - number: I-P86.d
    text: |-
      Het bevoegd gezag is verplicht de betrokkene te benoemen in een, gelet op de scholing die is of wordt gevolgd,
      passende vacante functie bij het bevoegd gezag. Indien voor de in de eerste volzin bedoelde benoeming ontheffing
      van de bevoegdheidseisen noodzakelijk is omdat de betrokkene de scholing nog niet heeft afgerond, is het bevoegd
      gezag verplicht die ontheffing aan te vragen. Indien de ontheffing wordt verleend, geldt de in de eerste volzin
      bedoelde verplichting.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P86
  - number: I-P87.1
    text: |-
      De bezoldiging van de betrokkene voor wie de betrekkingsomvang is opgenomen in de formatie bedoeld in artikel I-
      P76, tweede lid onder *b*, wordt verminderd met:
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P87
  - number: I-P87.1.a
    text: |-
      neveninkomsten uit de betrekkingen bij het onderwijs die hij reeds genoot op de dag waarop van zijn
      betrekkingsomvang niet langer in de formatie bedoeld in artikel I-P76, tweede lid, onder *a* is opgenomen, voor
      zover de totale omvang van de betrekking de omvang van de normbetrekking overschrijdt;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P87
  - number: I-P87.1.b
    text: |-
      neveninkomsten die hij gaat genieten uit of in verband met arbeid of bedrijf ter hand genomen in verband met de
      verplichting bedoeld in artikel I-P84, eerste lid.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P87
  - number: I-P87.2
    text: |-
      Over het bedrag dat op grond van het eerste lid in mindering wordt gebracht kan door het bevoegd gezag worden
      beschikt.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P87
  - number: I-P88.1
    text: |-
      Onze minister kan bepalen dat aan een betrokkene bedoeld in artikel I-A1, onder *e*1 en *e*2 en *e*16 die wordt
      belast met externe taken ten behoeve van het onderwijs, voor zover hij daarvoor geen vergoeding of verlof op de
      voet van artikel I-C38 verkrijgt, tijdelijk een gedeelte van een normbetrekking wordt toegekend.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P88
  - number: I-P88.2
    text: |-
      Het in het eerste lid bedoelde gedeelte van een normbetrekking wordt voor de duur waarvoor het wordt toegekend
      afzonderlijk in de akte van benoeming vermeld. De bezoldiging voor dit gedeelte bedraagt een evenredig gedeelte van
      het voor de betrokkene geldende salarisbedrag behorende bij een normbetrekking.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P88
  - number: I-P88.3
    text: |-
      Zodra voor de betrokkene het gedeelte van de normbetrekking bedoeld in het eerste lid wordt verminderd, wordt de
      omvang van de betrekking dienovereenkomstig verkleind.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P88
  - number: I-P89.1
    text: |-
      Onze minister: - wijst jaarlijks van de instellingen als bedoeld in artikel I-A1, onder d1, d2 en d16 die
      categorieën van instellingen aan, die bindingspremies om redenen van werving of behoud kunnen toekennen;
        - bepaalt daarbij tevens tot welk totaalbedrag deze instellingen bindingspremies kunnen toekennen;
        - wijst jaarlijks de categorie betrokkenen aan, aan wie de premie kan worden toegekend;
        - stelt jaarlijks de hoogte van het bedrag vast dat maximaal aan de door het bevoegd gezag aangewezen betrokkene
      wordt uitgekeerd en bepaalt daarbij tevens de periode die maximaal met de betrokkene kan worden overeengekomen.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P89
  - number: I-P89.2
    text: |-
      Het bevoegd gezag van een instelling als bedoeld in het eerste lid kan aan een betrokkene die in dienst is
      of treedt en die behoort tot de categorie betrokkenen als bedoeld in het eerste lid, om redenen van werving
      of behoud een bindingspremie toekennen. De bindingspremie maakt geen deel uit van het inkomen, bedoeld in het
      pensioenreglement.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P89
  - number: I-P89.3
    text: |-
      Het bevoegd gezag verbindt aan de toekenning als bedoeld in het tweede lid de voorwaarde dat de betrokkene, als
      bedoeld in het tweede lid, gedurende een bepaalde, tevoren overeengekomen periode, aan de instelling verbonden zal
      blijven. Bij voortijdig vertrek dient de toegekende uitkering geheel of gedeeltelijk te worden terugbetaald. Het
      bevoegd gezag kan aan de toekenning nadere voorwaarden verbinden.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P89
  - number: I-P89.4
    text: |-
      Indien de betrokkene bedoeld in het tweede lid voor het einde van de in het tweede lid bedoelde periode de dienst
      verlaat of indien hij niet voldoet aan de in het derde lid bedoelde nadere voorwaarden door een naar het oordeel
      van het bevoegd gezag niet aan hemzelf te wijten oorzaak, ontheft het bevoegd gezag hem van de verplichtingen tot
      terugbetaling.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P89
  - number: I-P89.5
    text: |-
      De voorwaarden bedoeld in het derde lid worden aan de betrokkene, bedoeld in het tweede lid evenals de grootte
      van de uitkering alsmede de maand en jaar van toekenning, voor zover deze niet reeds in de akte van benoeming zijn
      vermeld, zo spoedig mogelijk schriftelijk medegedeeld.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-P89
  - number: I-Q101.1
    text: 'In dit hoofdstuk wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q101
  - number: I-Q101.1.a
    text: |-
      instelling: de instelling, genoemd in artikel I-A1, onder *d*1, *d*2, *d*4 tot en met *d*6, *d*10, *d*12 tot en met
      *d*15, *d* 17 en *d*18;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q101
  - number: I-Q101.1.b
    text: |-
      betrokkene: de directeur, directeur/coördinator, plaatsvervangend directeur, plaatsvervangend directeur/
      coördinator, adjunct-directeur en adjunct-directeur/-coördinator bedoeld in de paragrafen 2 en 3, 6 en 9 tot en met
      11 alsmede het lid van de centrale directie bedoeld in de paragrafen 7, 8 en 12 tot en met 15 alsmede de betrokkene
      is benoemd in een functie die door het bevoegd gezag is aangemerkt als een functie in hoofdstuk I-Q;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q101
  - number: I-Q101.1.c
    text: '"scholengemeenschap":'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q101
  - number: I-Q101.1.c.1
    text: |-
      een instelling als bedoeld in artikel I-A1, onder *d*5 onder *b*, *d*14 onder *b*, dan wel onder *d*15, dan wel
      onder *d*17, onder *b*, dan wel onder *d*18, onder *b*, (horizontale scholengemeenschap);
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q101
  - number: I-Q101.1.c.2
    text: een instelling als bedoeld in artikel I-A1, onder *d*14, *d*17 of *d*18;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q101
  - number: I-Q101.1.d
    text: |-
      "onderwijsgemeenschap": een samenstel van instellingen voor hoger beroepsonderwijs als bedoeld in
      [artikel 1.8 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1], met een of meer instellingen
      als bedoeld onder *d*14 en *d*15, vallende onder hetzelfde bevoegd gezag.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q101
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
  - number: I-Q101.2
    text: |-
      Voor zover uit het eerste lid niet anders blijkt, zijn in dit hoofdstuk de begripsbepalingen van artikel I-P1, I-
      P50 en I-P75 van toepassing.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q101
  - number: I-Q102.1
    text: |-
      Aan het hoofd van een instelling staat een directeur of directeuren, een directeur/coördinator, een centrale
      directie of een college van bestuur.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q102
  - number: I-Q102.2
    text: |-
      De directie als bedoeld in de paragrafen 2 en 3 en 6 tot en met 15 wordt gevormd door de directeur of directeuren
      of de centrale directie of het college van bestuur en voor zover de door het bevoegd gezag vastgestelde formatie
      dit mogelijk maakt een of meer adjunct-directeuren en een of meer andere betrokkenen die zijn benoemd in een
      functie die door het bevoegd gezag is aangemerkt als een functie in hoofdstuk I-Q.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q102
  - number: I-Q102.3
    text: |-
      Aan het hoofd van een instelling als bedoeld in artikel I-A1, onder *d*14 en *d*15, staat,
      indien deze instellingen een onderwijsgemeenschap vormen met een een instelling als bedoeld in
      [artikel 1.8 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1], een college van bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q102
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
  - number: I-Q103.1
    text: In de paragrafen 2 en 3 en 6 tot en met 15 wordt voor elke normfunctie de bijbehorende maximumschaal aangegeven.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q103
  - number: I-Q103.2
    text: |-
      Bij elke maximumschaal behoort een aanloopschaal als aangegeven in onderstaand schema.





                    aanloopschaalmaximumschaal






                    89




                    810




                    10 11




                    11 12




                    12 13




                    13 14




                    14 15




                    15 16




                    16 17




                    17 18
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q103
  - number: I-Q104.1
    text: |-
      Bij benoeming van een betrokkene niet zijnde een betrokkene als bedoeld in artikel I-A1 onder *e*5, *e*6, *e*10,
      *e*13 tot en met *e*15, *e*17 en *e*18 tot in een functie als bedoeld in dit hoofdstuk wordt in afwijking van het
      bepaalde in de artikelen I-P7 tot en met I-P11 het voor hem geldende salarisbedrag vastgesteld als volgt:
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q104
  - number: I-Q104.1.a
    text: |-
      eerst wordt bepaald welk salarisbedrag voor hem in de functie bedoeld in dit hoofdstuk zou gelden op de voet
      van het bepaalde in de artikelen I-P7 tot en met I-P11, waarbij voor de toepassing van die artikelen elke schaal
      voorkomende in de bijlage 1A bij dit besluit geacht wordt te behoren bij die functies.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q104
  - number: I-Q104.1.b
    text: |-
      vervolgens wordt bezien van welke salarisschalen die behoren bij de desbetreffende functie het minimumsalaris
      lager is dan het onder *a* bepaalde bedrag, de betrokkene wordt vervolgens ingeschaald in de hoogste van deze
      salarisschalen en wel op het onder *a* bepaalde salarisbedrag of indien dat bedrag in die salarisschaal niet
      voorkomt op het naasthogere bedrag.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q104
  - number: I-Q104.1.c
    text: |-
      indien het onder *a* bepaalde salarisbedrag lager is dan het laagste salarisbedrag in de aanloopschaal behorende
      bij de desbetreffende functie wordt het salaris vastgesteld op het onder *a* gevonden bedrag in de hoogst mogelijke
      in de bijlage bij dit besluit voorkomende salarisschaal welke gelegen is onder evenbedoelde aanloopschaal; indien
      het onder *a* bedoelde bedrag in die schaal niet voorkomt vindt de inschaling plaats op het naasthogere in die
      schaal voorkomende bedrag.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q104
  - number: I-Q104.2
    text: |-
      Indien het bepaalde in het eerste lid leidt tot een salarisbedrag dat lager is dan het laagste bedrag van het
      begintraject dan wel de laagste aanloopschaal behorende bij de hoogste maximumschaal die ingevolge het bepaalde in
      hoofdstuk I-R aan de instelling geldt voor de betrokkene bedoeld in artikel I-R101, eerste lid, onder *b*, wordt
      het salaris van de betrokkene die in een functie als bedoeld in dit hoofdstuk wordt benoemd, vastgesteld op dat
      laagste bedrag.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q104
  - number: I-Q105.1
    text: |-
      Zodra aan de betrokkene op grond van het bepaalde in artikel I-P13 een periodieke verhoging wordt toegekend
      en zijn salaris dan ten minste gelijk is aan het aanvangsbedrag van een naasthogere schaal, wordt zijn salaris
      bepaald volgens die hogere schaal, evenwel niet volgens een hogere schaal dan de maximumschaal die bij zijn functie
      behoort.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q105
  - number: I-Q105.2
    text: |-
      Zolang voor de betrokkene het salaris wordt bepaald volgens een lagere schaal dan de bij zijn functie behorende
      aanloopschaal en toekenning van een periodieke verhoging als bedoeld in artikel I-P13 en toepassing van het
      bepaalde in het eerste lid nog niet leiden tot een salarisbedrag dat ten minste gelijk is aan het laagste bedrag
      in de aanloopschaal, wordt hem telkens bij de toepassing van artikel I-P13 op de in dat artikel vermelde datum één
      extra periodieke verhoging toegekend. Het bepaalde in het eerste lid ten aanzien van de salarisvaststelling volgens
      de naasthogere schaal is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q105
  - number: I-Q106.1
    text: |-
      Indien het bepaalde in één der paragrafen 2 en 3 en 6 tot en met 10 gedurende drie achtereenvolgende schooljaren
      tot een hogere maximumschaal voor de desbetreffende functie bij de instelling leidt, geldt met ingang van het derde
      schooljaar het carrièrepatroon dat behoort bij de functie met die hogere maximumschaal voor de betrokkene.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q106
  - number: I-Q106.2
    text: |-
      De betrokkene die gedurende een periode van drie aaneengesloten schooljaren benoemd is in dezelfde functie waarbij
      op grond van het bepaalde in één der paragrafen 2 tot en met 15 dezelfde maximumschaal behoort, behoudt aanspraak
      op bezoldiging volgens het carrièrepatroon dat behoort bij de functie met die maximumschaal zolang hij in de
      desbetreffende functie aan dezelfde instelling of instellingen benoemd blijft.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q106
  - number: I-Q106.3
    text: |-
      De betrokkene wiens bezoldiging wordt vastgesteld volgens de voor hem geldende maximumschaal, behoudt aanspraak op
      bezoldiging volgens die schaal zolang hij in de desbetreffende functie benoemd blijft.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q106
  - number: I-Q106.4
    text: |-
      Ten aanzien van de betrokkene bedoeld in artikel I-A1, onder *e*6 en *e*13 wordt in het eerste en tweede lid voor
      "schooljaar" dan wel "schooljaren" gelezen: "kalenderjaar" dan wel "kalenderjaren".
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q106
  - number: I-Q107.1
    text: |-
      Indien de directeur van een instelling waarbij geen andere functie als bedoeld in hoofdstuk I-Q in de formatie is
      opgenomen gedurende meer dan 30 aaneengesloten kalenderdagen anders dan wegens vakantieverlof verhinderd is zijn
      werkzaamheden te verrichten, wordt voor de aan de instelling werkzame betrokkene bedoeld in hoofdstuk I-R die
      de directeurstaken volledig waarneemt met ingang van de 31e dag van de vervanging en zolang hij met de volledige
      vervanging is belast, een salaris en een toelage als bedoeld in artikel I-Q209b vastgesteld alsof hij in die
      functie was benoemd.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q107
  - number: I-Q107.2
    text: |-
      Indien de directeur van een instelling gedurende meer dan één jaar verhinderd is zijn werkzaamheden te verrichten,
      wordt indien vervanging is toegestaan voor de aan de instelling benoemde adjunct-directeur die de directeurstaken
      volledig waarneemt na één jaar volledige vervanging en zolang hij met de volledige vervanging is belast, een
      salaris en een toelage als bedoeld in artikel I-Q209b vastgesteld alsof hij in die functie was benoemd.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q107
  - number: I-Q107.3
    text: |-
      Het tweede lid is, indien vervanging is toegestaan, voor zover het de vaststelling van het salaris betreft, van
      overeenkomstige toepassing ten aanzien van de betrokkene bedoeld in hoofdstuk I-R, voor zover hij de adjunct-
      directeurstaken langer dan één jaar volledig waarneemt.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q107
  - number: I-Q107.4
    text: |-
      Na de beëindiging van de volledige vervanging bedoeld in het eerste tot en met derde lid, wordt het salaris van de
      betrokkene die de functie van directeur dan wel adjunct-directeur heeft waargenomen vastgesteld op het bedrag dat
      behoort bij het salarisnummer en de schaal die voor hem zouden hebben gegolden indien de waarneming niet zou hebben
      plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q107
  - number: I-Q108
    text: |-
      Nadat toepassing is gegeven aan het bepaalde in artikel I-R102, tweede lid, verdeelt het bevoegd gezag de
      werkzaamheden onder de leden van de directie na overleg met de betrokkenen zodanig dat een zo veel mogelijk
      evenwichtige taakbelasting plaatsvindt in verhouding tot de functie en de omvang van ieders betrekking.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q108
  - number: I-Q201
    text: 'In deze paragraaf wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q201
  - number: I-Q201.a
    text: |-
      directeur: de directeur van een basisschool of een speciale school voor basisonderwijs als bedoeld in artikel A1,
      onder d1;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q201
  - number: I-Q201.b
    text: |-
      adjunct-directeur: degene die is benoemd in een functie bedoeld in paragraaf 2 van hoofdstuk I-R die tevens is
      benoemd tot adjunct-directeur;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q201
  - number: I-Q201.c
    text: |-
      directie: de directeur of directeuren, de eventuele adjunct-directeuren en de eventuele andere betrokkenen die zijn
      benoemd in een functie die is ingedeeld in hoofdstuk I-Q gezamenlijk.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q201
  - number: I-Q201.d
    text: 'betrokkene: degene die deel uitmaakt van de directie;'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q201
  - number: I-Q201.e
    text: |-
      y: het aantal leerlingen op 1 oktober van het voorafgaande schooljaar, welk aantal voor basisscholen wordt verhoogd
      met 3% van dat aantal leerlingen en naar beneden afgerond op een geheel getal;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q201
  - number: I-Q201.f
    text: 'instelling: een basisschool of een speciale school voor basisonderwijs als bedoeld in artikel I-A1, onder d1.'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q201
  - number: I-Q202
    text: |-
      De normfuncties voor de directie die in de formatie van een instelling kunnen voorkomen zijn de normfunctie van
      directeur en van adjunct-directeur. In de bijlage Q1 bij dit besluit is voor deze functies een taakkarakteristiek
      gegeven voor onderscheidenlijk basisscholen en speciale scholen voor basisonderwijs.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q202
  - number: I-Q203.1
    text: |-
      De betrokkene die is benoemd in een normbetrekking en die het verlof, bedoeld in artikel I-C41, per jaar
      geniet, wordt gemiddeld voor ten hoogste 930 uren per jaar belast met het geven van onderwijs als bedoeld in de
      taakkarakteristiek van de normfunctie leraar als opgenomen in bijlage R1 van dit besluit. Voor de betrokkene die
      gebruik maakt van het verlof, bedoeld in artikel I-C41, zevende lid, en voor wie een arbeidsduur op jaarbasis
      geldt van 1710 uren respectievelijk 1790 uren wordt in de eerste volzin voor «930 uren» gelezen «961 uren»
      respectievelijk «1010 uren».
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q203
  - number: I-Q203.2
    text: |-
      Binnen een normbetrekking is 10% van de normbetrekking en indien gebruik wordt gemaakt van artikel I-C41, zevende
      lid, 10% van de arbeidsduur op jaarbasis, bedoeld in artikel I-P3, tweede of derde lid, bestemd voor activiteiten
      in het kader van de deskundigheidsbevordering. De besteding van het in de eerste volzin bedoelde deel van de
      normbetrekking respectievelijk de arbeidsduur op jaarbasis wordt door betrokkene bepaald, met dien verstande dat
      het bevoegd gezag in individuele gevallen en schriftelijk gemotiveerd daarvan kan afwijken.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q203
  - number: I-Q203.3
    text: |-
      Na verkregen instemming van het decentraal georganiseerd overleg kan aan instellingen waarvoor op jaarbasis een
      onderwijstijd geldt van meer dan 1010 doch ten hoogste 1040 uur betrokkene voor maximaal die aan de instelling
      geldende onderwijstijd worden belast met het geven van onderwijs.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q203
  - number: I-Q203.4
    text: |-
      Voor de betrokkene die is benoemd in een betrekking met een omvang van minder dan een normbetrekking wordt het
      maximum aantal uren, bedoeld in het eerste lid, en de deskundigheidsbevordering, bedoeld in het tweede lid, naar
      evenredigheid van de werktijdfactor berekend en rekenkundig afgerond op gehele uren.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q203
  - number: I-Q203.5
    text: |-
      In individuele gevallen kunnen door het bevoegd gezag en betrokkene van het percentage genoemd in het tweede lid
      afwijkende afspraken worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q203
  - number: I-Q204.1
    text: |-
      De maximumschaal die voor de normfunctie van directeur geldt, wordt afhankelijk van y vastgesteld volgens
      onderstaand schema:
