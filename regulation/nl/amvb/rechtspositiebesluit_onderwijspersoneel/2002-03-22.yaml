    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q205
  - number: I-Q205.2
    text: Het bepaalde in artikel I-P78, tweede lid, is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q205
  - number: I-Q206
    text: |-
      De maximumschaal die voor de normfunctie adjunct-directeur geldt, wordt afhankelijk van y vastgesteld volgens het
      onderstaande schema.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q206
  - number: I-Q206.a
    text: |-
