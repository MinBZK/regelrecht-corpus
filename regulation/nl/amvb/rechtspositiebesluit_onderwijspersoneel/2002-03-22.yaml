  - number: I-Q1302.1
    text: |-
      Behoudens het bepaalde in artikel I-Q1303 benoemt het bevoegd gezag in de centrale directie ten hoogste vijf leden
      op maximaal drie formatieplaatsen.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q1302
  - number: I-Q1302.2
    text: |-
      In de bijlage Q12 bij dit besluit is voor de functies voorzitter van de centrale directie en lid van de centrale
      directie een taakkarakteristiek gegeven.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q1302
  - number: I-Q1302.3
    text: |-
      In het georganiseerd overleg op instellingsniveau als bedoeld in hoofdstuk IV-E kan worden overeengekomen af te
      wijken van het bepaalde in artikel I-P3, tweede lid, mits daarbij de taakomvang op jaarbasis ongewijzigd blijft.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q1302
  - number: I-Q1303
    text: |-
      Aan instellingen die deel uitmaken van een onderwijsgemeenschap als bedoeld in artikel I-Q101, onder *d*, kan de
      normfunctie van adjunct-directeur voorkomen. De maximumschaal voor de functie wordt vastgesteld overeenkomstig
      artikel I-Q404 voor de normfunctie van plaatsvervangend directeur.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q1303
  - number: I-Q1304
    text: |-
      Het bevoegd gezag stelt een regeling op met betrekking tot de werktijd alsmede met betrekking tot de autorisatie en
      registratie van afwezigheid.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q1304
  - number: I-Q1305.1
    text: |-
      Voor de leden van de centrale directie gelden de maximumschalen als aangegeven in onderstaand schema.





                    functie indien y is maximumschaal




                    voorzitter 600 of meer doch minder dan 1000 schaal 13




                    1000 of meer doch minder dan 4000 schaal 14




                    4000 of meer doch minder dan 8000 schaal 15




                    8000 of meer schaal 16




                    lid 600 of meer doch minder dan 1000 schaal 12




                    1000 of meer doch minder dan 4000 schaal 13




                    4000 of meer doch minder dan 8000 schaal 14




                    8000 of meer schaal 15
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q1305
  - number: I-Q1305.2
    text: |-
      Indien het bevoegd gezag hem bij wettelijk voorschrift opgedragen taken en bevoegdheden heeft overgedragen aan de
      centrale directie, worden de in het eerste lid genoemde schalen met één verhoogd.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q1305
  - number: I-Q1306
    text: |-
      Indien y van de instelling minder dan 600 bedraagt, worden de maximumschalen van de centrale directie vastgesteld
      overeenkomstig artikel I-Q404, met dien verstande dat in dat artikel voor directeur wordt gelezen: voorzitter en
      voor plaatsvervangend directeur: lid.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q1306
  - number: I-Q1307
    text: |-
      Het bevoegd gezag kan regels opstellen ten aanzien van criteria waaraan de betrokkene moet hebben voldaan alvorens
      te kunnen worden bezoldigd volgens de bij zijn functie behorende maximumschaal.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q1307
  - number: I-Q1308
    text: Het bepaalde in artikel I-P53, eerste en derde lid, is niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q1308
  - number: I-Q1309
    text: |-
      Het is het bevoegd gezag niet toegestaan de betrokkene extra beloning toe te kennen in de vorm van periodieke
      verhoging, bedoeld in artikel I-P53, in de vorm van buitengewone toelage, bedoeld in artikel I-P55, dan wel in de
      vorm van gratificatie, bedoeld in artikel I-P56, in situaties waarin tevens sprake is van gedwongen ontslag van een
      of meer personeelsleden.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q1309
