    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q204
  - number: I-Q204.3
    text: Bij de toepassing van het tweede lid wordt, in afwijking van artikel I-P1, onder g,
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q204
  - number: I-Q204.3.a
    text: |-
      voor de normfunctie van directeur van een basisschool waarvan y kleiner is dan 200, het maximumsalaris van schaal
      10 vastgesteld op het bedrag dat is vermeld bij salarisnummer 10 in die schaal;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q204
  - number: I-Q204.3.b
    text: voor de normfunctie van directeur van een speciale school voor basisonderwijs waarvan y
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q204
  - number: I-Q204.3.b.1°
    text: kleiner is dan 100, het maximumsalaris vastgesteld op het bedrag dat is vermeld bij salarisnummer 6 in schaal 11;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q204
  - number: I-Q204.3.b.2°
    text: |-
      gelijk is aan of groter dan 100 en kleiner dan 200, het maximumsalaris vastgesteld op het bedrag dat is vermeld bij
      salarisnummer 7 in schaal 11;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q204
  - number: I-Q204.3.b.3°
    text: |-
      gelijk is aan of groter dan 200, het maximumsalaris vastgesteld op het bedrag dat is vermeld bij salarisnummer 7 in
      schaal 12.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q204
  - number: I-Q204.4
    text: |-
      Het bevoegd gezag kan een besluit tot het doen vervullen van twee normfuncties directeur niet nemen zolang aan de
      instelling een directeur is benoemd voor wie het salaris vastgesteld wordt op een bedrag dat hoger is dan het voor
      hem in het tweede en derde lid bij de aldaar vermelde leerlingenaantallen aangegeven maximumsalaris.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q204
  - number: I-Q204.5
    text: |-
      Indien aan een instelling met toepassing van het bepaalde in het tweede lid twee normfuncties directeur worden
      vervuld, is het bepaalde in artikel I-Q107 niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q204
  - number: I-Q204.6
    text: Onze minister geeft voorschriften ter uitvoering van het bepaalde in het tweede, derde en vierde lid.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q204
  - number: I-Q205.1
    text: |-
      In afwijking van het bepaalde in artikel I-P78, eerste lid, wordt aan een instelling waarvan y kleiner is dan
      200 en waaraan met toepassing van het bepaalde in artikel I-Q204, tweede lid, twee normfuncties directeur worden
      vervuld, voor elk van deze functies bij een normbetrekking, afhankelijk van y, een aantal rekeneenheden verbruikt
      als is aangegeven in onderstaand schema:
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q205
  - number: I-Q205.1.a
    text: |-
      voor wat betreft basisscholen;






