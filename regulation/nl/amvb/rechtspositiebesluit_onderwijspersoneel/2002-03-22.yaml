    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S1103
  - number: I-S1104
    text: |-
      Het bevoegd gezag van de landelijke instelling het "Landelijk studie- en ontwikkelingscentrum volwasseneneducatie"
      kan betrokkenen behorend tot het inhoudelijk personeel benoemen in functies met een maximumschaal als aangegeven in
      onderstaand schema:





                  Functie Maximumschaal




                  1. Inhoudelijk medewerker B 11




                  2. Inhoudelijk medewerker A 12




                  3. Afdelingscoördinator 13
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S1104
  - number: I-S1105.1
    text: |-
      Ten behoeve van de functie van afdelingscoördinator van de landelijke instelling het "Landelijk studie- en
      ontwikkelingscentrum volwasseneneducatie" staan drie formatieplaatsen ter beschikking.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S1105
  - number: I-S1105.2
    text: |-
      Eén van de afdelingscoördinatoren kan worden belast met de waarneming van de directeur van de landelijke instelling
      bij diens afwezigheid.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S1105
  - number: I-S1106
    text: |-
      Het bevoegd gezag van een landelijke instelling het "Landelijk studie- en ontwikkelingscentrum volwasseneneducatie"
      kan betrokkenen behorend tot het ondersteunend personeel benoemen in functies met een maximumschaal als aangegeven
      in onderstaand schema:
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S1106
  - number: I-S1107
    text: |-
      Het bevoegd gezag van de landelijke instelling het "Centrum voor de Innovatie van Beroepsonderwijs Bedrijfsleven"
      kan betrokkenen behorend tot het inhoudelijk personeel benoemen in functies met een maximumschaal als aangegeven in
      onderstaand schema:





                  Functie Maximumschaal




                  1. Inhoudelijk medewerker B 11




                  2. Inhoudelijk medewerker A 12




                  3. Sectiecoördinator 13




                  4. Stafmedewerker bestuurlijke ondersteuning 13




                  5. Internationaal projectmanager 13
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S1107
  - number: I-S1108
    text: |-
      Het bevoegd gezag van de landelijke instelling het "Centrum voor de Innovatie van Beroepsonderwijs Bedrijfsleven"
      kan betrokkenen behorend tot het ondersteunend personeel benoemen in functies met een maximumschaal als aangegeven
      in onderstaand schema:
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S1108
  - number: I-S1109
    text: |-
      In de bijlage S9 bij dit besluit zijn voor de normfuncties, vermeld in de artikelen I-S1102 tot en met I-S1108
      taakkarakteristieken gegeven. Indien in genoemde artikelen bij een functie meer dan één maximumschaal is vermeld,
      is de maximumschaal afhankelijk van de functie-inhoud als is aangegeven in de bijlage S9.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S1109
  - number: I-S1110.1
    text: |-
      De omvang van de betrekking van de betrokkene die reeds aan de instelling is verbonden en die
      vervangingswerkzaamheden verricht, wordt voor de duur van die vervangingswerkzaamheden tijdelijk uitgebreid met
      ingang van de dag waarop hij feitelijk met de vervanging wordt belast.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S1110
  - number: I-S1110.2
    text: |-
      Indien een betrokkene wordt belast met werkzaamheden van kennelijk tijdelijke aard ten behoeve van derden en
      voor zover hij daarvoor niet een vergoeding of verlof krijgt, kan het bevoegd gezag bepalen dat de omvang van de
      betrekking tijdelijk wordt uitgebreid.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S1110
  - number: I-S1110.3
    text: |-
      De in het eerste en tweede lid bedoelde uitbreiding wordt voor de duur waarvoor zij geldt afzonderlijk in de akte
      van benoeming vermeld. De bezoldiging behorende bij deze uitbreiding wordt berekend op grond van het salaris dat
      voor hem geldt bij de functie waarin hij reeds aan de instelling is benoemd.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S1110
  - number: I-S1201
    text: 'In deze paragraaf wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S1201
  - number: I-S1201.a
    text: '"instelling": een instelling als bedoeld in artikel I-A1, onder *d*14;'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S1201
  - number: I-S1201.b
    text: |-
      "betrokkene": degene die bij een bevoegd gezag aan een instelling is benoemd in een functie als bedoeld in de
      artikelen I-S1205, I-S1213 en I-S1214;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S1201
  - number: I-S1201.c
    text: '"y1": het aantal leerlingen van de instelling dat middelbaar beroepsonderwijs volgt;'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S1201
  - number: I-S1201.d
    text: |-
      "verticale scholengemeenschap": een scholengemeenschap, bedoeld in artikel I-Q101, onderdeel *c* onder 3, bestaande
      uit een instelling en een of meer scholen als bedoeld in artikel I-A1, onder *d*3 en *d*9.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S1201
  - number: I-S1202
    text: |-
      Het bevoegd gezag stelt met inachtneming van het bepaalde in artikel I-S1203, het beleid met betrekking tot de
      formatie van het ondersteunend en beheerspersoneel vast.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S1202
  - number: I-S1203
    text: |-
      In het georganiseerd overleg op instellingsniveau als bedoeld in hoofdstuk IV-E kan worden overeengekomen af te
      wijken van het bepaalde in artikel I-P3, tweede lid, mits daarbij de taakomvang op jaarbasis ongewijzigd blijft.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S1203
  - number: I-S1204
    text: |-
      Het bevoegd gezag stelt een regeling op met betrekking tot de werktijd alsmede met betrekking tot de autorisatie en
      registratie van afwezigheid.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S1204
  - number: I-S1205.1
    text: |-
      Onverminderd het bepaalde in het tweede lid stelt Onze minister voor de normfuncties taakkarakteristieken of
      functiebeschrijvingen en maximumschalen vast.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S1205
  - number: I-S1205.2
    text: |-
      Binnen de formatie die is vastgesteld met inachtneming van artikel I-S1202 kunnen betrokkenen worden benoemd in
      normfuncties als is aangegeven in onderstaand schema. De daarbij vermelde maximumschalen zijn van toepassing indien
      y1 van de instelling 4000 of meer bedraagt. Bij een kleinere instelling stelt het bevoegd gezag de maximumschaal
      vast, rekening houdend met de voor het Rijkspersoneel ter zake geldende normen en in samenhang met de formatie.





                    Functie Maximumschaal




                    hoofd afdeling financiën zaken schaal 12




                    hoofd afdeling personeelszaken schaal 11




                    hoofd afdeling automatisering schaal 11




                    hoofd afdeling documentaire informatievoorziening schaal 10




                    hoofd technische dienst schaal 10




           In de bijlage S10 bij dit besluit, zijn voor de normfuncties, vermeld in bovenstaand schema,
      functiebeschrijvingen gegeven.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S1205
  - number: I-S1206.1
    text: Artikel I-S104 is niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S1206
  - number: I-S1206.2
    text: |-
      Zodra aan de betrokkene op grond van artikel I-P13 een periodieke verhoging wordt toegekend en zijn salaris ten
      minste gelijk is aan het laagste bedrag in de bij zijn functie behorende maximumschaal, wordt, tenzij naar het
      oordeel van het bevoegd gezag zijn wijze van functioneren zich daar nog tegen verzet, zijn salaris bepaald op het
      naasthogere bedrag in de bij zijn functie behorende maximumschaal.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S1206
  - number: I-S1206.3
    text: |-
      Zo nodig wordt het bedrag in de maximumschaal dat is vastgesteld op grond van het tweede lid, verhoogd tot een
      bedrag in de maximumschaal om te bereiken dat het salaris in de maximumschaal te allen tijde uitgaat boven het
      salaris dat voor de betrokkene in de aanloopschaal zou hebben gegolden.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S1206
  - number: I-S1206.4
    text: |-
      Het bevoegd gezag kan regels opstellen ten aanzien van het carrièrepatroon en het doorlopen daarvan die in voor de
      betrokkene gunstige zin afwijken van het tweede en derde lid.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S1206
  - number: I-S1207
    text: |-
      Het bevoegd gezag kan regels opstellen ten aanzien van de criteria waaraan de betrokkene moet hebben voldaan
      alvorens te kunnen worden bezoldigd volgens de bij zijn functie behorende maximumschaal.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S1207
  - number: I-S1208
    text: Het bepaalde in artikel I-P53, eerste en derde lid, is niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S1208
  - number: I-S1209
    text: Het bepaalde in artikel I-S110, derde lid, is niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S1209
  - number: I-S1210.1
    text: |-
