  - number: V-S401.2
    text: |-
      De betrokkene die is benoemd in een functie als bedoeld in hoofdstuk I-S ten behoeve van het verrichten van
      werkzaamheden aan een afdeling voor voortgezet speciaal onderwijs aan moeilijk lerende kinderen van een speciale
      school voor basisonderwijs en voor wie een aanspraak geldt als bedoeld in het eerste lid, behoudt die aanspraak
      indien genoemde afdeling wordt omgevormd tot een school voor praktijkonderwijs als bedoeld in [deel I van de
      Wet op het voortgezet onderwijs](onbekend) en zijn benoeming wordt voortgezet ten behoeve van het verrichten van
      werkzaamheden aan die school. Het eerste lid, tweede volzin, is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-S401
  - number: V-S601.1
    text: |-
      Indien voor de functie van de betrokkene op 1 januari 1990 ten gevolge van de wijziging op 1 januari 1990 van
      hoofdstuk I-S een lagere maximumschaal gaat gelden dan volgens de regeling zoals die op 31 december 1989 luidde,
      behoudt hij aanspraak op vaststelling van zijn salaris volgens de maximumschaal die op 31 december 1989 voor hem
      gold, zolang hij in dezelfde functie aan dezelfde instelling verbonden blijft.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-S601
  - number: V-S601.2
    text: |-
      Indien het salaris van de betrokkene bedoeld in het eerste lid op 31 december 1989 werd vastgesteld volgens de
      maximumschaal van de functie waarin hij op 31 december 1989 was benoemd, wordt hem jaarlijks met toepassing van het
      bepaalde in artikel I-P13 een periodieke verhoging toegekend tot het moment waarop het hoogste bedrag in de voor
      hem op 31 december 1989 geldende maximumschaal is bereikt.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-S601
  - number: V-S601.3
    text: |-
      Indien het salaris van de betrokkene bedoeld in het eerste lid op 31 december 1989 nog niet werd vastgesteld
      volgens de maximumschaal van de functie waarin hij op 31 december 1989 was benoemd, wordt hem, nadat hij gedurende
      12 maanden het maximumsalaris van de voor hem sinds 1 januari 1990 geldende maximumschaal heeft genoten, jaarlijks
      met toepassing van het bepaalde in artikel I-P13 een periodieke verhoging toegekend. Deze jaarlijkse periodieke
      verhoging wordt hem toegekend in de maximumschaal van de functie waarin hij op 31 december 1989 was benoemd, tot
      het moment waarop het hoogste bedrag in deze maximumschaal is bereikt.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-S601
  - number: V-S602.1
    text: |-
      Op de betrokkene, bedoeld in artikel I-A1, onder *e*4, bij wiens functie op 1 augustus 1993 een lagere
      maximumschaal behoort dan bij de functie volgens hoofdstuk I-Q, hoofdstuk I-R dan wel hoofdstuk I-S, zoals die
      hoofdstukken op 31 juli 1993 van toepassing waren, die hij op die datum vervulde, behoudt aanspraak op bezoldiging
      volgens het carrièrepatroon dat behoorde bij de functie die hij op 31 juli 1993 bekleedde, zolang hij als zodanig
      aan de instelling verbonden blijft, onverminderd het bepaalde in artikel V-S601.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-S602
  - number: V-S602.2
    text: |-
      Op de betrokkene, bedoeld in artikel I-A1, onder *e*4, bij wiens functie op 1 augustus 1993 een lagere
      maximumschaal behoort dan bij de functie die hij op 31 juli 1993, volgens hoofdstuk I-R zoals dat op die datum
      luidde, vervulde, is artikel V-R602 van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-S602
  - number: V-S701.1
    text: |-
