    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S1007
  - number: I-S1008.1
    text: |-
      Indien een betrokkene wordt belast met werkzaamheden van kennelijk tijdelijke aard, voortvloeiend uit middelen
      die beschikbaar worden gesteld op grond van artikel 52, 54, 55 of 118 van de wet, en voor zover hij daarvoor niet
      een vergoeding of verlof krijgt, kan het bevoegd gezag bepalen dat de omvang van de betrekking tijdelijk wordt
      uitgebreid.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S1008
  - number: I-S1008.2
    text: |-
      De omvang van de tijdelijke uitbreiding van de betrekking bedoeld in het eerste lid, wordt voor de duur waarvoor
      dit geschiedt afzonderlijk in de akte van benoeming vermeld.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S1008
  - number: I-S1009
    text: |-
      In de bijlage S8 bij dit besluit zijn voor de normfuncties, vermeld in de artikelen I-S1002 tot en met I-S1007
      taakkarakteristieken gegeven. Indien in genoemde artikelen bij een functie meer dan een maximumschaal is vermeld,
      is de maximumschaal afhankelijk van de functie-inhoud als is aangegeven in de bijlage S8.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S1009
  - number: I-S1101
    text: 'In deze paragraaf wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S1101
  - number: I-S1101.a
    text: 'instelling: de instelling genoemd in artikel I-A1, onder *d*13;'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S1101
  - number: I-S1101.b
    text: |-
      betrokkene: de betrokkene bedoeld in artikel I-A1, onder *e*13, voor zover het betreft het inhoudelijk en
      ondersteunend personeel;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S1101
  - number: I-S1101.c
    text: |-
      inhoudelijk personeel: het personeel, bedoeld onder *b*, dat is belast met activiteiten op het terrein van de
      ondersteuning van de volwasseneneducatie, bedoeld in de Kaderwet volwasseneneducatie;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S1101
