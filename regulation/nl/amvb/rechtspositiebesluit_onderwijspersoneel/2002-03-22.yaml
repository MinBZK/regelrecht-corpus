      hoofdstuk I-S een lagere maximumschaal gaat gelden dan volgens de regeling zoals die op 31 december 1989 luidde,
      behoudt hij aanspraak op vaststelling van zijn salaris volgens de maximumschaal die op 31 december 1989 voor hem
