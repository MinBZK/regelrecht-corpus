  - number: I-R101.2
    text: |-
      Voor zover uit het eerste lid niet anders blijkt, zijn in dit hoofdstuk de begripsbepalingen van artikel I-P1, I-
      P50 en I-P75 van toepassing.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R101
  - number: I-R102.1
    text: |-
      Aan iedere instelling kan onderwijsgevend, docerend, onderzoeks-, pedagogische en educatief personeel
      verbonden zijn voor zover dit binnen de door het bevoegd gezag vastgestelde formatie mogelijk is. Deze functies
      worden onderscheiden in onderwijsgevenden functies voor het basisonderwijs en centrale diensten (§ 2 van dit
      hoofdstuk), het speciaal onderwijs, voortgezet speciaal onderwijs (§ 3), alsmede in pedagogische functies
      voor het leerlingwezen (§ 6), in een leraarsfunctie voor het vormingswerk (§ 7), in instructeursfuncties voor
      het landbouwpraktijkonderwijs (§ 8), in de functie van educatief werker in de basiseducatie (§ 9), in een
      leraarsfunctie voor het middelbaar beroepsonderwijs als bedoeld in artikel I-A1, onder *e*14 (§ 12), in een
      leraarsfunctie aan een scholengemeenschap als bedoeld in artikel I-A1, onder *d*15 (§ 13), in een leraarsfunctie
      voor het voortgezet algemeen volwassenenonderwijs (§ 14) en in een leraarsfunctie voor beroepsbegeleidend onderwijs
      (§ 15).
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R102
  - number: I-R102.2
    text: |-
      De werkzaamheden die aan de instelling moeten worden verricht, worden in onderling overleg verdeeld tussen de
      directie en de betrokkenen zodanig dat een zoveel mogelijk evenwichtige taakbelasting plaatsvindt in verhouding tot
      de aard en de omvang van de functies. Indien dit overleg niet tot overeenstemming leidt, beslist het bevoegd gezag,
      de betrokkenen gehoord.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R102
  - number: I-R103.1
    text: |-
      Indien een betrokkene met inachtneming van het voor hem geldende carrièrepatroon, het begintraject en de
      aanloopschaal of -schalen behorend bij de functie waarin hij is benoemd, heeft doorlopen en hij heeft voldaan
      aan de in voorkomend geval door Onze minister dan wel het bevoegd gezag vastgestelde promotiecriteria wordt hij
      met inachtneming van het bepaalde in artikel I-R107 en in de paragrafen 2 en 3 en 6 tot en met 9, 12 en 13 tot
      en met 15 van dit hoofdstuk bezoldigd volgens de bij zijn functie behorende maximumschaal. Het bevoegd gezag kan
      promotiecriteria vaststellen uitsluitend indien over die criteria overeenstemming is bereikt in het overleg bedoeld
      in hoofdstuk IV-E en IV-F.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R103
  - number: I-R103.2
    text: |-
      Het bevoegd gezag is onverminderd het bepaalde in artikel I-R107, vijfde lid, gehouden de betrokkene in staat te
      stellen aan de voor hem geldende promotiecriteria te voldoen.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R103
  - number: I-R104.1
    text: |-
      Voor elke functie met maximumschaal 9, 10 of 11 geldt dat bij elke maximumschaal een aanloopschaal behoort die één
      nummer lager is dan de maximumschaal. Bij de de functies met maximumschaal 9, 10 of 11 behoort een begintraject dat
      voorafgaat aan de aanloopschaal. Voor elke functie met maximumschaal 12 of hoger geldt dat bij elke maximumschaal
      twee aanloopschalen behoren die één respectievelijk twee nummers lager zijn dan de maximumschaal.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R104
  - number: I-R104.2
    text: |-
      De betrokkene doorloopt het begintraject en de aanloopschalen bij zijn functie volgens het voor hem geldende
      carrièrepatroon.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R104
  - number: I-R105
    text: |-
      Bij benoeming van een betrokkene in een functie als bedoeld in paragrafen 2 en 3 en 6 tot en met 9, 12 en 13 tot
      en met 15 met maximumschaal 12 of hoger wordt, in afwijking van het bepaalde in de artikelen I-P7, I-P8, I-P9 en I-
      P11, het voor hem geldende salarisbedrag vastgesteld als volgt:
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R105
  - number: I-R105.a
    text: |-
      eerst wordt bepaald welk salarisbedrag in een salarisschaal voor hem in de functie bedoeld in de paragraaf 2 tot en
      met 9, 12 en 13 tot en met 15 zou gelden op de voet van het bepaalde in de artikelen I-P7, I-P8, I-P9 en I-P11;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R105
  - number: I-R105.b
    text: |-
      indien de onder *a* bepaalde salarisschaal de laagste bij zijn functie behorende aanloopschaal is en aan hem in
      die schaal in één of meer vorige onderwijsfuncties met een laagste aanloopschaal met hetzelfde nummer dan wel bij
      de toepassing van onderdeel a reeds vier maal een periodieke verhoging als bedoeld in de artikelen I-P8, tweede
      en vierde lid, I-P11, eerste en tweede lid, en I-P13, is toegekend, vindt de inschaling plaats in de naasthogere
      aanloopschaal op het bedrag dat gelijk is aan het onder *a* bepaalde bedrag, of indien dat bedrag in die schaal
      niet voorkomt op het naasthogere bedrag.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R105
  - number: I-R106.1
    text: |-
      De bezoldiging van de betrokkene die op 31 juli van enig schooljaar werd bezoldigd volgens het hoogste bedrag van
      het voor hem op die datum van toepassing zijnde begintraject, wordt per 1 augustus vastgesteld volgens het laagste
      bedrag dat hoger is in de bij zijn functie behorende aanloopschaal.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R106
  - number: I-R106.2
    text: |-
      De bezoldiging van de betrokkene die is benoemd in een functie met maximumschaal 12 of hoger en die op 31 juli
      van enig schooljaar werd bezoldigd volgens schaal 11, salarisnummer 10 of schaal 12, salarisnummer 9, welke niet
      de hoogste aanloopschaal is die bij zijn functie behoort, wordt per 1 augustus vastgesteld volgens de naasthogere
      aanloopschaal, waarbij het salaris wordt vastgesteld op het bedrag, dat is gelegen onmiddellijk boven het salaris
      dat voor hem op 31 juli daaraan voorafgaand gold.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R106
  - number: I-R106.3
    text: |-
      De bezoldiging van de betrokkene voor wie schaal 12 of hoger de bij zijn functie behorende maximumschaal is en die
      op 31 juli van enig schooljaar volgens de laagste bij zijn functie behorende aanloopschaal werd bezoldigd en aan
      wie in die aanloopschaal vier maal een periodieke verhoging als bedoeld in de artikelen I-P8, tweede en vierde lid,
      I-P11, eerste en tweede lid, of I-P13, is toegekend, waarbij het aantal malen dat hem een dergelijke periodieke
      verhoging in die aanloopschaal in een andere functie met een laagste aanloopschaal met hetzelfde nummer reeds is
      toegekend mede in aanmerking wordt genomen, wordt per 1 augustus vastgesteld volgens de naasthogere aanloopschaal,
      waarbij het salaris wordt vastgesteld op een bedrag dat onmiddellijk is gelegen boven het salaris dat voor hem op
      31 juli daaraan voorafgaand gold.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R106
  - number: I-R106.4
    text: |-
      De bezoldiging van de betrokkene, voor wie schaal 13 de bij zijn functie behorende maximumschaal is, die op 31 juli
      van enig schooljaar wordt vastgesteld volgens de schaal en het salarisnummer vermeld in kolom A van onderstaand
      schema wordt, in afwijking van het bepaalde in het derde lid en in artikel I-P13, op 1 augustus daarop volgend
      vastgesteld volgens de daarnaast vermelde schaal en het salarisnummer in kolom B.





                    Kolom A Kolom B




                    Schaal 11, sal.nr. 2 Schaal 11, sal.nr. 4




                    Schaal 11, sal.nr. 4 Schaal 11, sal.nr. 6
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R106
  - number: I-R107.1
    text: |-
      Behoudens het vijfde lid heeft de betrokkene die is benoemd in een functie met maximumschaal 11 of lager en wiens
      salaris op 31 juli van enig schooljaar is vastgesteld op het hoogste bedrag in de bij zijn functie behorende
      aanloopschaal met ingang van 1 augustus van het daarop volgende schooljaar recht op vaststelling van zijn salaris
      volgens de bij zijn functie behorende maximumschaal op het bedrag dat is gelegen onmiddellijk boven het salaris dat
      op 31 juli daaraan voorafgaand voor hem gold. De eerste volzin is van overeenkomstige toepassing op de betrokkene
      die is benoemd in een functie met maximumschaal 12 en wiens salaris op 31 juli van enig schooljaar is vastgesteld
      op het hoogste bedrag in de hoogste bij zijn functie behorende aanloopschaal.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R107
  - number: I-R107.2
    text: |-
      Behoudens het bepaalde in het vijfde lid heeft de betrokkene die is benoemd in een functie met maximumschaal 13
      en wiens salaris gedurende twee achtereenvolgende schooljaren is vastgesteld op het hoogste bedrag in de hoogste
      bij zijn functie behorende aanloopschaal met ingang van 1 augustus van het daarop volgende schooljaar recht op
      vaststelling van zijn salaris volgens de bij zijn functie behorende maximumschaal. Zijn salaris wordt in dat geval
      vastgesteld volgens de maximumschaal op het bedrag dat is gelegen onmiddellijk boven het salaris dat op 31 juli
      daaraan voorafgaand voor hem gold.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R107
  - number: I-R107.3
    text: |-
      In afwijking van het tweede lid en behoudens het vijfde lid wordt het salaris van de betrokkene zoveel eerder
      vastgesteld volgens de bij zijn functie behorende maximumschaal als zijn salaris in een vorige functie reeds langer
      dan één schooljaar is vastgesteld geweest volgens het maximum van de bij die vorige functie behorende hoogste
      aanloopschaal.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R107
  - number: I-R107.4
    text: |-
      Voor de toepassing van het bepaalde in het derde lid wordt mede in aanmerking genomen het schooljaar waarin de
      betrokkene gedurende ten minste 60 werkdagen in een vorige functie werkzaam is geweest en is bezoldigd volgens het
      hoogste bedrag in de hoogste bij die functie behorende aanloopschaal.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R107
  - number: I-R107.5
    text: |-
      De betrokkene bedoeld in het eerste, tweede en derde lid heeft geen recht op vaststelling van zijn salaris volgens
      de bij zijn functie behorende maximumschaal, indien de betrokkene niet aan de in artikel I-R103, eerste lid,
      bedoelde promotiecriteria heeft voldaan als gevolg van feitelijkheden die voor zijn rekening komen. In dat geval
      rust op het bevoegd gezag niet de verplichting bedoeld in artikel I-R103, tweede lid.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R107
  - number: I-R108.1
    text: |-
      De benoeming van een lid van het onderwijsgevend personeel bedoeld in artikel 1-A1, onder e1, e2 en e16 in een
      functie welke vanaf de aanvang van het schooljaar beschikbaar is, gaat in op de eerste dag na de zomervakantie.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R108
  - number: I-R108.2
    text: |-
      Indien het lid van het onderwijsgevend personeel bedoeld in artikel I-A, onder e1, e2 en e16 in het voorafgaande
      schooljaar als lid van het onderwijzend personeel bij een instelling in de zin van dit besluit dan wel bij
      een andere door Onze minister bekostigde onderwijsinstelling benoemd en bezoldigd is geweest gedurende een
      aaneengesloten periode van langer dan 2 maanden, welke periode is geëindigd op of na 1 juni van het voorafgaande
      schooljaar, gaat de benoeming in op 1 augustus mits het lid van het onderwijsgevend personeel voor langer dan 2
      maanden wordt benoemd.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R108
  - number: I-R108.3
    text: |-
      Het lid van het onderwijsgevend personeel bedoeld in artikel I-A, onder e1, e2 en e16 dat in tijdelijke dienst is
      benoemd, heeft aanspraak op bezoldiging tot en met de dag waarop zijn benoeming in tijdelijke dienst afloopt, met
      dien verstande dat hij, ingeval de benoeming is ingegaan op of na 1 maart van een schooljaar, in elk geval geen
      aanspraak op bezoldiging heeft over de dagen na de laatste dag voor de zomervakantie, ook al strekt de duur van
      zijn dienstverband zich wel over die dagen uit. Indien de duur van zijn dienstverband zich tot in het volgende
      schooljaar uitstrekt, ontstaat weer aanspraak op bezoldiging met ingang van de eerste dag na de zomervakantie,
      behoudens indien zich de in het tweede lid bedoelde omstandigheid voordoet, in welk geval weer aanspraak op
      bezoldiging ontstaat met in gang van 1 augustus van het nieuwe schooljaar. Voor de toepassing van dit lid worden
      aansluitende benoemingen dan wel bestuursbenoemingen binnen eenzelfde schooljaar als één benoeming beschouwd.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R108
  - number: I-R108.4
    text: |-
      De duur van het dienstverband van het in het eerste lid bedoelde lid van het onderwijsgevend personeel dat in vaste
      dienst is benoemd en dat in verband met ontslag zijn werkzaamheden na de zomervakantie niet voortzet, kan zich
      uitstrekken uiterlijk tot en met de laatste dag van het schooljaar.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R108
  - number: I-R108.5
    text: |-
      Het lid van het onderwijsgevend personeel bedoeld in artikel I-A, onder e1, e2 en e16 aan wie ontslag is verleend
      en die in een nieuwe betrekking is benoemd met ingang van een dag waarop het ontslag uit de oude betrekking nog
      niet is ingegaan, heeft in de oude betrekking aanspraak op bezoldiging tot de dag waarop de nieuwe betrekking
      aanvangt indien de nieuwe betrekking een voortzetting van de oude betrekking geacht kan worden te zijn. Indien de
      nieuwe betrekking niet bij het onderwijs wordt bekleed, behoudt hij, voor zover hem nog vakantieverlof toekomt,
      aanspraak op bezoldiging tot en met de dag waarop dat vakantieverlof afloopt.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R108
  - number: I-R108.6
    text: |-
      Indien het lid van het onderwijsgevend personeel, bedoeld in artikel I-A1, onder e1, e2 en e16, als gevolg van het
      bepaalde in het derde lid of van artikel I-P22, tweede lid, gedurende een gedeelte van de zomervakantie benoemd is
      geweest en aanspraak had op bezoldiging heeft hij niettemin aanspraak op bezoldiging gedurende de zomervakantie,
      indien hij een periode van 12 achtereenvolgende maanden gedurende alle schoolweken aan een of meer scholen was
      verbonden en indien de zomervakantie in die periode valt.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R108
  - number: I-R109
    text: |-
      Degene die werkzaam wordt in meerdere componenten van een horizontale scholengemeenschap als bedoeld in artikel I-
      Q101, eerste lid, onderdeel *c*, sub 2, wordt benoemd in de formatie van de component waaraan hij het grootste deel
      van zijn werkzaamheden verricht.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R109
  - number: I-R201
    text: 'In deze paragraaf wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R201
  - number: I-R201.a
    text: 'instelling: een instelling als bedoeld in artikel I-A1, onder *d*1 en d16;'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R201
  - number: I-R201.b
    text: |-
      betrokkene: een lid van het onderwijsgevend personeel benoemd bij een bevoegd gezag aan een instelling bedoeld in
      artikel I-A1, onder *d*1 en d16.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R201
  - number: I-R202
    text: 'De normfuncties voor het onderwijsgevend personeel die in de formatie van een instelling kunnen voorkomen zijn:'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R202
  - number: I-R202.a
    text: 'voor wat betreft basisscholen: de functie van leraar waarvoor als maximumschaal geldt schaal 9;'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R202
  - number: I-R202.b
    text: |-
      voor wat betreft speciale scholen voor basisonderwijs: de functie van leraar waarvoor als maximumschaal geldt
      schaal 10;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R202
  - number: I-R202.c
    text: |-
      voor wat betreft centrale diensten: de functie van leraar waarvoor als maximumschaal geldt schaal 9,
      onderscheidenlijk de functie van leraar waarvoor als maximumschaal geldt schaal 10.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R202
  - number: I-R203.1
    text: |-
      De betrokkene die is benoemd in een normbetrekking en die het verlof, bedoeld in artikel I-C41, per jaar
      geniet, wordt gemiddeld voor ten hoogste 930 uren per jaar belast met het geven van onderwijs bedoeld in de
      taakkarakteristiek. Voor de betrokkene, die gebruik maakt van het verlof, bedoeld in artikel I-C41, zevende lid, en
      voor wie een arbeidsduur op jaarbasis geldt van 1710 uren respectievelijk 1790 uren wordt in de eerste volzin voor
      «930 uren» gelezen «961 uren» respectievelijk «1010 uren».
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R203
  - number: I-R203.2
    text: |-
      Van het eerste lid kan met het oog op de invulling van de algemene arbeidsduur per jaar bedoeld in artikel I-
      P3, tweede en derde lid, in het bijzonder onderwijs worden afgeweken op grond van een overeenkomst bedoeld in de
      [Wet op de collectieve arbeidsovereenkomst][ref1] en in het openbaar onderwijs op grond van een overeenkomst die
      voldoet aan de voorwaarden zoals die zijn gesteld in genoemde wet.


      [ref1]: https://wetten.overheid.nl/BWBR0001937
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R203
    references:
      - id: ref1
        bwb_id: BWBR0001937
  - number: I-R203.3
    text: |-
      Binnen een normbetrekking is 10% van de normbetrekking en indien gebruik wordt gemaakt van artikel I-C41, zevende
      lid, 10% van de arbeidsduur op jaarbasis, bedoeld in artikel I-P3, tweede en derde lid, bestemd voor activiteiten
      in het kader van de deskundigheidsbevordering. De besteding van het in de eerste volzin bedoelde deel van de
      normbetrekking respectievelijk de arbeidsduur op jaarbasis wordt door betrokkene bepaald, met dien verstande dat
      het bevoegd gezag in individuele gevallen en schriftelijk gemotiveerd daarvan kan afwijken.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R203
  - number: I-R203.4
    text: |-
      Na verkregen instemming van het decentraal georganiseerd overleg kan aan instellingen waarvoor op jaarbasis een
      onderwijstijd geldt van meer dan 1010 doch ten hoogste 1040 uur een betrokkene voor maximaal die aan de instelling
      geldende onderwijstijd worden belast met het geven van onderwijs.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R203
  - number: I-R203.5
    text: |-
      Voor de betrokkene die is benoemd in een betrekking met een omvang van minder dan een normbetrekking wordt het
      maximum aantal uren, bedoeld in het eerste lid, en de deskundigheidsbevordering, bedoeld in het tweede lid, naar
      evenredigheid van de werktijdfactor berekend en rekenkundig afgerond op gehele uren.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R203
  - number: I-R203.6
    text: |-
      In individuele gevallen kunnen door het bevoegd gezag en betrokkene van het percentage genoemd in het derde lid
      afwijkende afspraken worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R203
  - number: I-R204.1
    text: |-
      De omvang van de betrekking van de betrokkene die aan de instelling is of wordt verbonden en die daarnaast
      vervangingswerkzaamheden verricht of gaat verrichten aan die instelling of aan een andere instelling waaraan hij
      uit hoofde van zijn benoeming verbonden kan worden, dan wel die daarnaast werkzaamheden verricht dan wel gaat
      verrichten waarvoor hem een gedeelte van een normbetrekking is of wordt toebedeeld die op grond van artikel I-
      P80 van rechtswege vervalt, wordt voor de duur en de omvang van die werkzaamheden tijdelijk uitgebreid met
      overeenkomstige toepassing van het bepaalde in de artikelen I-P22 en I-R108, waarbij voor benoeming wordt gelezen
      tijdelijke uitbreiding van de betrekkingsomvang en voor benoemd wordt gelezen een tijdelijke uitbreiding van de
      betrekkingsomvang had.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R204
  - number: I-R204.2
    text: |-
      De omvang van de tijdelijke uitbreiding van de betrekking bedoeld in het eerste lid, wordt voor de duur waarvoor
      dit geschiedt afzonderlijk in de akte van benoeming vermeld.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R204
  - number: I-R204.3
    text: |-
      Indien de betrekkingsomvang van een betrokkene die uitsluitend is benoemd voor het verrichten van
      vervangingswerkzaamheden, tijdelijk is uitgebreid op grond van het eerste lid, wordt die tijdelijke uitbreiding bij
      beëindiging van eerstbedoelde vervangingswerkzaamheden omgezet in een benoeming.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R204
  - number: I-R205.1
    text: |-
      Voor de betrokkene die is benoemd in verband met de vervanging van een leraar wordt voor de vaststelling van de
      factor r in artikel I-P15, tweede lid, de werktijdfactor per dag gelijkgesteld met 0,2306, per ochtend met 0,1356
      en per middag met 0,095. De werktijdfactor voor een dag waarop aan de school structureel uitsluitend gedurende de
      ochtend onderwijs wordt gegeven, is bepaald op 0,1628.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R205
  - number: I-R205.2
    text: |-
      Indien de in het eerste lid bedoelde vervanging geschiedt voor korter dan een ochtend dan wel een middag, wordt
      voor de vaststelling van de factor r in artikel I-P15, tweede lid, het feitelijk aantal uren bepaald op de uitkomst
      van de formule l x 1,5385, waarbij l gelijk is aan het aantal uren gedurende welke de betrokkene op die dag wordt
      belast met het geven van onderwijs, bedoeld in de taakkarakteristiek.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R205
  - number: I-R205a.1
    text: |-
      Voor de betrokkene, bedoeld in artikel I-Q201, onder a, wiens benoeming als directeur anders dan wegens ziekte en
      arbeidsongeschiktheid wordt beëindigd en die werd bezoldigd volgens de bij deze functie behorende maximumschaal op
      een bedrag dat hoger is dan het hoogste bedrag in de aanloopschaal van een leraar wordt, in afwijking van artikel
      I-P78, eerste lid, voor zijn functie waarop hoofdstuk I-R van toepassing is, bij hetzelfde bevoegd gezag aan
      dezelfde instelling of instellingen een aantal rekeneenheden verbruikt dat overeenkomt met het aantal rekeneenheden
      dat behoorde bij zijn functie als directeur. De eerste volzin is niet van toepassing indien op grond van artikel I-
      R107, eerste lid, het salaris van de betrokkene reeds kon worden vastgesteld volgens de bij zijn functie behorende
      maximumschaal.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R205a
  - number: I-R205a.2
    text: |-
      Het eerste lid is niet van toepassing op directeuren van wie de betrekking is opgeheven wegens samenvoeging van de
      desbetreffende instelling of instellingen waaraan de directeur is verbonden, met een of meer andere instellingen.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R205a
  - number: I-R205a.3
    text: |-
      Het verbruik van rekeneenheden wordt in gevallen, bedoeld in het tweede lid, berekend met inachtneming van de in
      artikel I-A8, tweede lid, bedoelde voorschriften.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R205a
  - number: I-R206.1
    text: |-
      Voor de betrokkene bedoeld in artikel I-Q201, onder *b*, wiens benoeming als leraar tevens adjunct-directeur anders
      dan wegens ziekte en arbeidsongeschiktheid wordt beëindigd, wordt in afwijking van het bepaalde in artikel I-
      P78, eerste lid, voor zijn functie als leraar bij hetzelfde bevoegd gezag aan dezelfde instelling of instellingen
      een aantal rekeneenheden verbruikt dat overeenkomt met het aantal rekeneenheden dat behoorde bij zijn functie als
      leraar tevens adjunct-directeur, indien:
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R206
  - number: I-R206.1.a
    text: |-
      de betrokkene als leraar tevens adjunct-directeur werd bezoldigd volgens de bij die functie behorende maximumschaal
      op een bedrag dat hoger is dan het hoogste bedrag in de aanloopschaal behorende bij de functie van leraar; of
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R206
  - number: I-R206.1.b
    text: op de betrokkene artikel I-Q207 van toepassing is.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R206
  - number: I-R206.2
    text: Het bepaalde in het eerste lid is niet van toepassing indien
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R206
  - number: I-R206.2.a
    text: |-
      voor de betrokkene, bedoeld in artikel I-R201, onder b, de beëindiging van de benoeming als leraar tevens adjunct-
      directeur het gevolg is van een gelijktijdige daling van:
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R206
  - number: I-R206.2.a.1°
    text: |-
      voor wat betreft een leraar tevens adjunct-directeur aan een basisschool: het aantal formatierekeneenheden, bedoeld
      in [artikel 13a, derde lid, van het Formatiebesluit WPO][ref1] tot 54 formatierekeneenheden,


      [ref1]: https://wetten.overheid.nl/BWBR0005441#Artikel13a
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R206
    references:
      - id: ref1
        bwb_id: BWBR0005441
        artikel: 13a
  - number: I-R206.2.a.2°
    text: |-
      voor wat betreft een leraar tevens adjunct-directeur aan een speciale school voor basisonderwijs: het
      aantal formatierekeneenheden, bedoeld in [artikel 16b, vierde lid, van het Formatiebesluit WPO][ref1] tot 65
      formatierekeneenheden, en


      [ref1]: https://wetten.overheid.nl/BWBR0005441#Artikel16b
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R206
    references:
      - id: ref1
        bwb_id: BWBR0005441
        artikel: 16b
  - number: I-R206.2.b
    text: |-
      in redelijkheid niet van het bevoegd gezag kon worden gevergd dat deze functie van leraar tevens adjunct-directeur
      in de formatie zou worden gehandhaafd.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R206
  - number: I-R301
    text: 'In deze paragraaf wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R301
  - number: I-R301.a
    text: 'instelling: een instelling als bedoeld in artikel I-A1, onder *d*2;'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R301
  - number: I-R301.b
    text: |-
      betrokkene: een lid van het onderwijsgevend personeel, benoemd bij een bevoegd gezag aan een instelling bedoeld in
      artikel I-A1, onder *d*2.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R301
  - number: I-R302
    text: |-
      De normfunctie van het onderwijsgevend personeel aan een instelling kan zijn opgenomen is de functie van leraar
      waarvoor als maximumschaal geldt schaal 10. In de bijlage R2 bij dit besluit is voor de in de eerste volzin
      genoemde normfunctie een taakkarakteristiek gegeven.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R302
  - number: I-R303.1
    text: |-
      De betrokkene die is benoemd in een normbetrekking en die het verlof, bedoeld in artikel I-C41, per jaar
      geniet, wordt gemiddeld voor ten hoogste 930 uren per jaar belast met het geven van onderwijs bedoeld in de
      taakkarakteristiek. Voor de betrokkene, die gebruik maakt van het verlof, bedoeld in artikel I-C41, zevende lid, en
      voor wie een arbeidsduur op jaarbasis geldt van 1710 uren respectievelijk 1790 uren wordt in de eerste volzin voor
      «930 uren» gelezen «961 uren» respectievelijk «1010 uren».
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R303
  - number: I-R303.2
    text: |-
      Van het eerste lid kan met het oog op de invulling van de algemene arbeidsduur per jaar bedoeld in artikel I-
      P3, tweede en derde lid, in het bijzonder onderwijs worden afgeweken op grond van een overeenkomst bedoeld in de
      [Wet op de collectieve arbeidsovereenkomst][ref1] en in het openbaar onderwijs op grond van een overeenkomst die
      voldoet aan de voorwaarden zoals die zijn gesteld in genoemde wet.


      [ref1]: https://wetten.overheid.nl/BWBR0001937
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R303
    references:
      - id: ref1
        bwb_id: BWBR0001937
  - number: I-R303.3
    text: |-
      Binnen een normbetrekking is 10% van de normbetrekking en indien gebruik wordt gemaakt van artikel I-C41, zevende
      lid, 10% van de arbeidsduur op jaarbasis, bedoeld in artikel I-P3, tweede of derde lid, bestemd voor activiteiten
      in het kader van de deskundigheidsbevordering. De besteding van het in de eerste volzin bedoelde deel van de
      normbetrekking respectievelijk de arbeidsduur op jaarbasis wordt door betrokkene bepaald, met dien verstande dat
      het bevoegd gezag in individuele gevallen en schriftelijk gemotiveerd daarvan kan afwijken.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R303
  - number: I-R303.4
    text: |-
      Na verkregen instemming van het decentraal georganiseerd overleg kan aan instellingen waarvoor op jaarbasis een
      onderwijstijd geldt van meer dan 1010 doch ten hoogste 1040 uur betrokkene voor maximaal die aan de instelling
      geldende onderwijstijd worden belast met het geven van onderwijs.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R303
  - number: I-R303.5
    text: |-
      Voor de betrokkene die is benoemd in een betrekking met een omvang van minder dan een normbetrekking wordt het
      maximum aantal uren, bedoeld in het eerste lid, en de deskundigheidsbevordering, bedoeld in het tweede lid, naar
      evenredigheid van de werktijdfactor berekend en rekenkundig afgerond op gehele uren.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R303
  - number: I-R303.6
    text: |-
      In individuele gevallen kunnen door het bevoegd gezag en betrokkene van het percentage genoemd in het derde lid
      afwijkende afspraken worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R303
  - number: I-R304.1
    text: |-
      De omvang van de betrekking van de betrokkene die aan de instelling is of wordt verbonden en die daarnaast
      vervangingswerkzaamheden verricht of gaat verrichten aan die instelling of aan een andere instelling waaraan
      hij uit hoofde van zijn benoeming verbonden kan worden waarvoor hem een gedeelte van een normbetrekking is of
      wordt toebedeeld die op grond van artikel I-P80 van rechtswege vervalt, wordt voor de duur en de omvang van die
      werkzaamheden tijdelijk uitgebreid met overeenkomstige toepassing van het bepaalde in de artikelen I-P22 en I-R108,
      waarbij voor benoeming wordt gelezen tijdelijke uitbreiding van de betrekkingsomvang en voor benoemd wordt gelezen
      een tijdelijke uitbreiding van de betrekkingsomvang had.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R304
  - number: I-R304.2
    text: |-
      De omvang van de tijdelijke uitbreiding van de betrekking bedoeld in het eerste lid wordt voor de duur waarvoor dit
      geschiedt afzonderlijk in de akte van benoeming vermeld.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R304
  - number: I-R304.3
    text: |-
      Indien de betrekkingsomvang van een betrokkene die uitsluitend is benoemd voor het verrichten van
      vervangingswerkzaamheden, tijdelijk is uitgebreid op grond van het eerste lid, wordt die tijdelijke uitbreiding bij
      beëindiging van eerstbedoelde vervangingswerkzaamheden omgezet in een benoeming.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R304
  - number: I-R305.1
    text: |-
      Voor de betrokkene die is benoemd in verband met de vervanging van een leraar wordt voor de vaststelling van de
      factor r in artikel I-P15, tweede lid, de werktijdfactor per dag gelijkgesteld met 0,2306, per ochtend met 0,1356
      en per middag met 0,095. De werktijdfactor voor een dag waarop aan de school structureel uitsluitend gedurende de
      ochtend onderwijs wordt gegeven, is bepaald op 0,1628.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R305
  - number: I-R305.2
    text: |-
      Indien de in het eerste lid bedoelde vervanging geschiedt voor korter dan een ochtend dan wel een middag, wordt
      voor de vaststelling van de factor r in artikel I-P15, tweede lid, het feitelijk aantal uren bepaald op de uitkomst
      van de formule l x 1,5385, waarbij l gelijk is aan het aantal uren gedurende welke de betrokkene op die dag wordt
      belast met het geven van onderwijs, bedoeld in de taakkarakteristiek.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R305
  - number: I-R305a.1
    text: |-
      Voor de betrokkene, bedoeld in artikel I-Q301, onder a, wiens benoeming als directeur anders dan wegens ziekte en
      arbeidsongeschiktheid wordt beëindigd en die werd bezoldigd volgens de bij deze functie behorende maximumschaal op
      een bedrag dat hoger is dan het hoogste bedrag in de aanloopschaal van een leraar wordt, in afwijking van artikel
      I-P78, eerste lid, voor zijn functie waarop hoofdstuk I-R van toepassing is, bij hetzelfde bevoegd gezag aan
      dezelfde instelling of instellingen een aantal rekeneenheden verbruikt dat overeenkomt met het aantal rekeneenheden
      dat behoorde bij zijn functie als directeur. De eerste volzin is niet van toepassing indien op grond van artikel I-
      R107, eerste lid, het salaris van de betrokkene reeds kon worden vastgesteld volgens de bij zijn functie behorende
      maximumschaal.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R305a
  - number: I-R305a.2
    text: |-
      Het eerste lid is niet van toepassing op directeuren van wie de betrekking is opgeheven wegens samenvoeging van de
      desbetreffende instelling of instellingen waaraan de directeur is verbonden, met een of meer andere instellingen.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R305a
  - number: I-R305a.3
    text: |-
      Het verbruik van rekeneenheden wordt in gevallen, bedoeld in het tweede lid, berekend met inachtneming van de in
      artikel I-A8, tweede lid, bedoelde voorschriften.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R305a
  - number: I-R306.1
    text: |-
      Voor de betrokkene bedoeld in artikel I-Q301, onder *b*, wiens benoeming als leraar tevens adjunct-directeur anders
      dan wegens ziekte en arbeidsongeschiktheid wordt beëindigd, wordt in afwijking van het bepaalde in artikel I-
      P78, eerste lid, voor zijn functie als leraar bij hetzelfde bevoegd gezag aan dezelfde instelling of instellingen
      een aantal rekeneenheden verbruikt dat overeenkomt met het aantal rekeneenheden dat behoorde bij zijn functie als
      leraar tevens adjunct-directeur, indien:
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R306
  - number: I-R306.1.a
    text: |-
      de betrokkene als leraar tevens adjunct-directeur werd bezoldigd volgens de bij die functie behorende maximumschaal
      op een bedrag dat hoger is dan het hoogste bedrag in de aanloopschaal behorende bij de functie van leraar, of
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R306
  - number: I-R306.1.b
    text: op de betrokkene artikel I-Q307 van toepassing is.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R306
  - number: I-R306.2
    text: |-
      Het bepaalde in het eerste lid is niet van toepassing voor de betrokkene, bedoeld in artikel I-
      R301, onder *b*, voor wie de beëindiging van de benoeming als leraar tevens adjunct-
      directeur het gevolg is van een gelijktijdige daling van het aantal formatierekeneenheden,
      bedoeld in [artikel 16, derde en vierde lid, van het Formatiebesluit WEC][ref1] of
      [artikel 25, derde en vierde lid, van het Formatiebesluit W.V.O.][ref2] van 236 naar 171, 98 of 65, van 171 naar
      65, van 131 naar 98 of 65, van 98 naar 65 formatierekeneenheden en in redelijkheid niet van het bevoegd gezag kon
      worden gevergd dat deze functie van leraar tevens adjunct-directeur in de formatie zou worden gehandhaafd.


      [ref1]: https://wetten.overheid.nl/BWBR0005442#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0005446#Artikel25
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R306
    references:
      - id: ref1
        bwb_id: BWBR0005442
        artikel: '16'
      - id: ref2
        bwb_id: BWBR0005446
        artikel: '25'
  - number: I-R601
    text: 'In deze paragraaf wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R601
  - number: I-R601.a
    text: 'instelling: een instelling als bedoeld in artikel I-A1, onder *d*4;'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R601
  - number: I-R601.b
    text: |-
      betrokkene, bedoeld in artikel I-A1, onder *e*4, voorzover het betreft de consulent dan wel een ander lid van het
      pedagogisch personeel.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R601
  - number: I-R602
    text: |-
      Het bevoegd gezag stelt, met inachtneming van het bepaalde in artikel I-R604, het beleid met betrekking tot de
      formatie van de consulentenfuncties vast.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R602
  - number: I-R603
    text: |-
      In het georganiseerd overleg op instellingsniveau als bedoeld in hoofdstuk IV-E kan worden overeengekomen af te
      wijken van het bepaalde in artikel I-P3, tweede lid, mits daarbij de taakomvang op jaarbasis ongewijzigd blijft.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R603
  - number: I-R604.1
    text: |-
      Onverminderd het bepaalde in het tweede lid, stelt Onze minister voor de normfunctie een taakkarakteristiek en
      functiebeschrijving en de maximumschaal vast.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R604
  - number: I-R604.2
    text: |-
      In het navolgende schema is een normfunctie vermeld die in de formatie van de consulenten kan zijn opgenomen, met
      de daarbij behorende maximumschaal.





                    functie maximumschaal




                    consulent 10




           In de bijlage R5 bij dit besluit zijn voor deze normfunctie een functiebeschrijving en taakkarakteristiek
      opgenomen.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R604
  - number: I-R605.1
    text: |-
      De betrokkene vervult zijn functie binnen de gebouwen of ruimten waarin de instelling is gehuisvest en op de
      daarbij behorende terreinen. Het bevoegd gezag dient een voorstel in bij het overlegorgaan op instellingsniveau
      als bedoeld in hoofdstuk IV-E waarin nadere regels zijn getroffen met betrekking tot de mate waarin de weektaak
      plaatsgebonden is, met dien verstande dat de plaatsgebondenheid ten minste 65% van de betrekkingomvang bedraagt.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R605
  - number: I-R605.2
    text: |-
      Het bevoegd gezag stelt voor de betrokkene werktijdregelingen vast. Onder werktijdregeling wordt verstaan een voor
      een periode van langer dan een week opgesteld en van te voren bekendgemaakt schema van aanvang en einde van de
      dagelijkse werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R605
  - number: I-R605.3
    text: Het bevoegd gezag stelt een regeling op met betrekking tot de autorisatie en registratie van afwezigheid.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R605
  - number: I-R606
    text: Het bepaalde in artikel I-P53, eerste en derde lid, is niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R606
  - number: I-R607.1
    text: |-
      De omvang van de betrekking van de betrokkene die aan de instelling is of wordt verbonden en die daarnaast
      vervangingswerkzaamheden verricht of gaat verrichten aan die instelling of aan een andere instelling waaraan hij
      uit hoofde van zijn benoeming verbonden kan worden, wordt voor de duur van die vervangingswerkzaamheden tijdelijk
      uitgebreid met ingang van de dag waarop hij feitelijk met de vervanging wordt belast.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R607
  - number: I-R607.2
    text: |-
      Indien een betrokkene wordt belast met werkzaamheden van kennelijk tijdelijke aard ten behoeve van derden en voor
      zover hij daarvoor niet een vergoeding ontvangt of verlof krijgt, kan het bevoegd gezag bepalen dat de omvang van
      de betrekking van de betrokkene tijdelijk wordt uitgebreid.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R607
  - number: I-R607.3
    text: |-
      De in het eerste en tweede lid bedoelde uitbreiding wordt voor de duur waarvoor zij geldt afzonderlijk in de akte
      van benoeming vermeld. De bezoldiging behorende bij deze uitbreiding wordt berekend op grond van het salaris dat
      voor hem geldt bij de functie waarin hij reeds aan de instelling is benoemd.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R607
  - number: I-R608
    text: |-
      Waar in hoofdstuk I-P en in de artikelen I-R101 tot en met I-R107 sprake is van "31 juli" en "1 augustus" wordt
      daarvoor bij de toepassing van deze paragraaf gelezen: 31 december respectievelijk 1 januari.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R608
  - number: I-R701
    text: 'In deze paragraaf wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R701
  - number: I-R701.a
    text: '"instelling": een instelling als bedoeld in artikel I-A1, onder *d*5;'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R701
  - number: I-R701.b
    text: '"betrokkene": degene die bij een instelling is benoemd in een leraarsfunctie voor het vormingswerk.'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R701
  - number: I-R702
    text: |-
      Het bevoegd gezag stelt, met inachtneming van het bepaalde in artikel I-R704, het beleid met betrekking tot de
      formatie van de leraarsfuncties vast.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R702
  - number: I-R703
    text: |-
      In het georganiseerd overleg op instellingsniveau als bedoeld in hoofdstuk IV-E kan worden overeengekomen af te
      wijken van het bepaalde in artikel I-P3, tweede lid, onder *a*, mits daarbij de taakomvang op jaarbasis ongewijzigd
      blijft.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R703
  - number: I-R704.1
    text: |-
      De normfunctie die in de formatie van de leraren kan zijn opgenomen is de functie van leraar vormingswerk waarvoor
      als maximumschaal geldt schaal 9. In de bijlage R6 bij dit besluit is voor deze normfunctie een taakkarakteristiek
      gegeven.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R704
  - number: I-R704.2
    text: |-
      Indien de instelling deel uitmaakt van een horizontale scholengemeenschap als bedoeld in artikel I-Q101, eerste
      lid, onderdeel *c*, sub 2, die programma’s aanbiedt overeenkomstig het bepaalde in artikel 2.12 van de Wet op het
      cursorisch beroepsonderwijs, is voor de betrokkene die in overwegende mate de werkzaamheden behorende bij deze
      programma’s verzorgt, in afwijking van het eerste lid, de in de bijlage R11 opgenomen taakkarakteristiek voor de
      normfunctie van leraar C van overeenkomstige toepassing. Voor deze betrokkene is schaal 10 de maximumschaal.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R704
  - number: I-R705.1
    text: |-
      De betrokkene vervult zijn functie binnen de gebouwen of ruimten waarin de instelling is gehuisvest en op de
      daarbij behorende terreinen. Het bevoegd gezag dient een voorstel in bij het overlegorgaan op instellingsniveau
      als bedoeld in hoofdstuk IV-E waarin nadere regels zijn getroffen met betrekking tot de mate waarin de weektaak
      plaatsgebonden is, met dien verstande dat de plaatsgebondenheid ten minste 65% van de betrekkingsomvang bedraagt.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R705
  - number: I-R705.2
    text: |-
      Het bevoegd gezag stelt voor de betrokkene werktijdregelingen vast. Onder werktijdregeling wordt verstaan een voor
      een periode van langer dan een week opgesteld en van te voren bekendgemaakt schema van aanvang en einde van de
      dagelijkse werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R705
  - number: I-R705.3
    text: |-
      Het bevoegd gezag stelt een regeling op met betrekking tot de werktijd alsmede met betrekking tot de autorisatie en
      registratie van afwezigheid.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R705
  - number: I-R706
    text: Het bepaalde in artikel I-P53, eerste en derde lid, is niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R706
  - number: I-R707.1
    text: |-
      Voor de betrokkene die bij wijze van waarneming tijdelijk wordt belast met de volledige vervanging van een
      functionaris bij wiens functie een hogere maximumschaal behoort, die gedurende meer dan 30 aaneengesloten
      kalenderdagen anders dan wegens vakantieverlof verhinderd is de werkzaamheden voortvloeiende uit zijn functie te
      verrichten, wordt met ingang van de 31e dag van de vervanging en zolang hij met de volledige vervanging is belast,
      een salaris vastgesteld alsof hij in die functie was benoemd.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R707
  - number: I-R707.2
    text: |-
      Na de beëindiging van de volledige vervanging, bedoeld in het eerste lid, wordt het salaris van de betrokkene die
      met de vervanging was belast, vastgesteld op het bedrag dat behoort bij de schaal en het salarisnummer die voor hem
      zouden hebben gegolden indien de vervanging niet zou hebben plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R707
  - number: I-R708.1
    text: |-
      De omvang van de betrekking van de betrokkene die reeds aan de instelling is verbonden en die
      vervangingswerkzaamheden verricht aan die instelling of aan een andere instelling waaraan hij uit hoofde van zijn
      benoeming verbonden kan worden, wordt voor de duur van die vervangingswerkzaamheden tijdelijk uitgebreid met ingang
      van de dag waarop hij feitelijk met de vervanging wordt belast.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R708
  - number: I-R708.2
    text: |-
      Indien een betrokkene wordt belast met werkzaamheden van kennelijk tijdelijke aard ten behoeve van derden en voor
      zover hij daarvoor niet een vergoeding ontvangt of verlof krijgt, kan het bevoegd gezag bepalen dat de omvang van
      de betrekking van de betrokkene tijdelijk wordt uitgebreid.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R708
  - number: I-R708.3
    text: |-
      De in het eerste en tweede lid bedoelde uitbreiding wordt voor de duur waarvoor zij geldt afzonderlijk in de akte
      van benoeming vermeldt. De bezoldiging behorende bij deze uitbreiding wordt berekend op grond van het salaris dat
      voor hem geldt bij de functie waarin hij reeds aan de instelling is benoemd.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R708
  - number: I-R801
    text: 'In deze paragraaf wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R801
  - number: I-R801.a
    text: '"instelling": een instelling als bedoeld in artikel I-A1, onder *d*10;'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R801
  - number: I-R801.b
    text: '"betrokkene": degene die bij een instelling is benoemd in een functie als bedoeld in artikel I-R804.'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R801
  - number: I-R802
    text: |-
      Het bevoegd gezag stelt, in afwijking van artikel I-P3, derde lid, tweede tot en met vierde volzin, en
      met inachtneming van het bepaalde in artikel I-R804, het beleid met betrekking tot de formatie van het
      instructiepersoneel vast.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R802
  - number: I-R803
    text: |-
      In het georganiseerd overleg op instellingsniveau als bedoeld in hoofdstuk IV-E kan worden overeengekomen af te
      wijken van het bepaalde in artikel I-P3, tweede lid, onder *a*, mits daarbij de taakomvang op jaarbasis ongewijzigd
      blijft.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R803
  - number: I-R804.1
    text: |-
      Onverminderd het bepaalde in het tweede lid, stelt Onze Minister voor de normfuncties taakkarakteristieken of
      functiebeschrijvingen en maximumschalen vast.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R804
  - number: I-R804.2
    text: |-
      In onderstaand schema zijn normfuncties vermeld die in de formatie van het instructiepersoneel kunnen zijn
      opgenomen, met de daarbij behorende maximumschalen.





                    Functie Maximumschaal




                    1. Instructeur 9




                    2. Hoofdinstructeur 10




                    3. Stafinstructeur A 11




                    4. Stafinstructeur B 12




           In de bijlage R7 zijn voor de normfuncties, vermeld in bovenstaand schema, functiebeschrijvingen en
      taakkarakteristieken opgenomen.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R804
  - number: I-R805.1
    text: |-
      De betrokkene vervult zijn functie binnen de gebouwen of ruimten waarin de instelling is gehuisvest en op de
      daarbij behorende terreinen. Het bevoegd gezag dient een voorstel in bij het overlegorgaan op instellingsniveau
      als bedoeld in hoofdstuk IV-E waarin nadere regels zijn getroffen met betrekking tot de mate waarin de weektaak
      plaatsgebonden is, met dien verstande dat de plaatsgebondenheid ten minste 65% van de betrekkingsomvang bedraagt.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R805
  - number: I-R805.2
    text: |-
      Het bevoegd gezag stelt voor de betrokkene werktijdregelingen vast. Onder werktijdregeling wordt verstaan een voor
      een periode van langer dan een week opgesteld en van te voren bekendgemaakt schema van aanvang en einde van de
      dagelijkse werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R805
  - number: I-R805.3
    text: |-
      Het bevoegd gezag stelt een regeling op met betrekking tot de werktijd alsmede met betrekking tot de autorisatie en
      registratie van afwezigheid.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R805
  - number: I-R806
    text: Het bepaalde in artikel I-P53, eerste en derde lid, is niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R806
  - number: I-R807
    text: |-
      Het is het bevoegd gezag niet toegestaan de betrokkene extra beloning toe te kennen in de vorm van een periodieke
      verhoging, bedoeld in artikel I-P53, in de vorm van een buitengewone toelage, bedoeld in artikel I-P55, in de vorm
      van een gratificatie, bedoeld in artikel I-P56, dan wel in de vorm van uitkering of toelage om redenen van werving
      en behoud als bedoeld in de artikelen I-P57 en I-P58, in situaties waarin tevens sprake is van gedwongen ontslag
      van een of meer personeelsleden.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R807
  - number: I-R808.1
    text: |-
      Voor de betrokkene, die bij wijze van waarneming tijdelijk wordt belast met de volledige vervanging van een
      functionaris bij wiens functie een hogere maximumschaal behoort, die gedurende meer dan 30 aaneengesloten
      kalenderdagen anders dan wegens vakantieverlof verhinderd is de werkzaamheden uit zijn functie te verrichten,
      wordt met ingang van de 31e dag van de vervanging en zolang hij met de volledige vervanging is belast, een salaris
      vastgesteld alsof hij in die functie was benoemd.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R808
  - number: I-R808.2
    text: |-
      Na de beëindiging van de volledige vervanging, bedoeld in het eerste lid, wordt het salaris van de betrokkene, die
      met de vervanging was belast, vastgesteld op het bedrag dat behoort bij de schaal en het salarisnummer die voor hem
      zouden hebben gegolden indien de vervanging niet zou hebben plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R808
  - number: I-R809.1
    text: |-
      De omvang van de betrekking van de betrokkene die reeds aan de instelling is verbonden en die
      vervangingswerkzaamheden verricht aan die instelling of aan een andere instelling waaraan hij uit hoofde van zijn
      benoeming verbonden kan worden, wordt voor de duur van die vervangingswerkzaamheden tijdelijk uitgebreid met ingang
      van de dag waarop hij feitelijk met de vervanging wordt belast.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R809
  - number: I-R809.2
    text: |-
      Indien een betrokkene wordt belast met werkzaamheden van kennelijk tijdelijke aard ten behoeve van derden en voor
      zover hij daarvoor niet een vergoeding ontvangt of verlof krijgt, kan het bevoegd gezag bepalen dat de omvang van
      de betrekking van de betrokkene tijdelijk wordt uitgebreid.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R809
  - number: I-R809.3
    text: |-
      De in het eerste en tweede lid bedoelde uitbreiding wordt voor de duur waarvoor zij geldt afzonderlijk in de akte
      van benoeming vermeld. De bezoldiging behorende bij deze uitbreiding wordt berekend op grond van het salaris dat
      voor hem geldt bij de functie waarin hij reeds aan de instelling is benoemd.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R809
  - number: I-R901
    text: 'In deze paragraaf wordt verstaat onder:'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R901
  - number: I-R901.a
    text: 'instelling: een instelling als bedoeld in artikel I-A1, onder *d*6;'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R901
  - number: I-R901.b
    text: |-
      betrokkene: een lid van het educatief personeel dat bij een bevoegd gezag is benoemd aan een instelling bedoeld in
      artikel I-A1, onder *d*6.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R901
  - number: I-R902
    text: |-
      De normfunctie die aan een instelling kan voorkomen, is die van educatief werker en de daarbij behorende
      maximumschaal is schaal 9. In de bijlage R8 bij dit besluit is voor de normfunctie een taakkarakteristiek gegeven.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R902
  - number: I-R903
    text: |-
      Het salaris van de educatief werker, die voorafgaand aan zijn benoeming bij een bevoegd gezag aan een instelling
      als bedoeld in artikel I-A1, onder *d*6, gedurende ten minste 4 jaar jaarlijks 60 of meer werkdagen aan zo’n
      instelling werkzaamheden heeft verricht waaraan geen inkomsten uit of in verband met arbeid waren verbonden, en
      die daarbij relevante ervaring heeft opgedaan, wordt onverminderd het bepaalde in de artikelen I-P7 tot en met I-
      P10 vastgesteld op het salaris dat één periodieke verhoging hoger is dan de aanvang van het carrièrepatroon dat bij
      zijn functie hoort.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R903
  - number: I-R904
    text: |-
      De betrokkene wordt voor ten hoogste 3/5 deel van zijn weektaakomvang belast met begeleiding van groepen deelnemers
      en individuele deelnemers.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R904
  - number: I-R905.1
    text: |-
      De functie van de betrokkene wordt vervuld binnen de gebouwen of ruimten waarin de instelling of instellingen zijn
      gehuisvest en op de daarbij behorende terreinen, tenzij de aard van de te verrichten werkzaamheden zich daartegen
      verzet.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R905
  - number: I-R905.2
    text: |-
      Het bevoegd gezag stelt voor de betrokkene werktijdregelingen vast. Onder werktijdregeling wordt verstaan een voor
      een periode van langer dan een week opgesteld en van te voren bekendgemaakt schema van aanvang en einde van de
      dagelijkse werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R905
  - number: I-R906.1
    text: |-
      De omvang van de betrekking van de betrokkene die aan de instelling is of wordt verbonden en die daarnaast
      vervangingswerkzaamheden verricht of gaat verrichten aan die instelling of aan een andere instelling waaraan hij
      uit hoofde van zijn benoeming verbonden kan worden, wordt voor de duur van die vervangingswerkzaamheden tijdelijk
      uitgebreid met ingang van de dag waarop hij feitelijk met de vervanging wordt belast.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R906
  - number: I-R906.2
    text: |-
      Indien een betrokkene wordt belast met werkzaamheden van kennelijk tijdelijke aard ten behoeve van derden en voor
      zover hij daarvoor niet een vergoeding ontvangt of verlof krijgt, kan het bevoegd gezag bepalen dat de omvang van
      de betrekking van de betrokkene tijdelijk wordt uitgebreid.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R906
  - number: I-R906.3
    text: |-
      De in het eerste en tweede lid bedoelde uitbreiding wordt voor de duur waarvoor zij geldt afzonderlijk in de akte
      van benoeming vermeld. De bezoldiging behorende bij deze uitbreiding wordt berekend op grond van het salaris dat
      voor hem geldt bij de functie waarin hij reeds aan de instelling is benoemd.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R906
  - number: I-R907
    text: |-
      Voor de betrokkene die in overwegende mate werkzaam is in de component basiseducatie van een horizontale
      scholengemeenschap als bedoeld in artikel I-Q101, eerste lid, onderdeel *c*, sub 2, zijn de artikelen I-R1502, I-
      R1503 en I-R1505 tot en met I-R1508 van overeenkomstige toepassing. De artikelen I-R902 tot en met I-R905 zijn
      eveneens van overeenkomstige toepassing, met dien verstande dat deze artikelen slechts toepassing vinden voor het
      gedeelte dat de betrokkene werkzaam is in de component basiseducatie.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R907
  - number: I-R1201
    text: 'In deze paragraaf wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R1201
