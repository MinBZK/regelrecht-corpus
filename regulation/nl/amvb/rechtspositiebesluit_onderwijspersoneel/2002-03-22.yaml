    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R1206
  - number: I-R1207.1
    text: |-
      Voor de betrokkene die bij wijze van waarneming tijdelijk wordt belast met de volledige vervanging van een
      functionaris bij wiens functie een hogere maximumschaal behoort, die gedurende meer dan 30 aaneengesloten
      kalenderdagen anders dan wegens vakantieverlof verhinderd is de werkzaamheden voortvloeiende uit zijn functie te
      verrichten, wordt met ingang van de 31e dag van de vervanging en zo lang hij met de volledige vervanging is belast,
      een salaris vastgesteld alsof hij in die functie was benoemd.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R1207
  - number: I-R1207.2
    text: |-
      Na de beëindiging van de volledige vervanging, bedoeld in het eerste lid, wordt het salaris van de betrokkene die
      met de vervanging was belast, vastgesteld op het bedrag dat behoort bij de schaal en het salarisnummer die voor hem
      zouden hebben gegolden indien de vervanging niet zou hebben plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R1207
  - number: I-R1208.1
    text: |-
      De omvang van de betrekking van de betrokkene die aan de instelling is of wordt verbonden en die daarnaast
      vervangingswerkzaamheden verricht of gaat verrichten aan die instelling of aan een andere instelling waaraan hij
      uit hoofde van zijn benoeming verbonden kan worden, wordt voor de duur van die vervangingswerkzaamheden tijdelijk
      uitgebreid met ingang van de dag waarop hij feitelijk met de vervanging wordt belast.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R1208
  - number: I-R1208.2
    text: |-
      Indien een betrokkene wordt belast met werkzaamheden van kennelijk tijdelijke aard ten behoeve van derden en voor
      zover hij daarvoor niet een vergoeding ontvangt of verlof krijgt, kan het bevoegd gezag bepalen dat de omvang van
      de betrekking van de betrokkene tijdelijk wordt uitgebreid.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R1208
  - number: I-R1208.3
    text: |-
      De in het eerste en tweede lid bedoelde uitbreiding wordt voor de duur waarvoor zij geldt afzonderlijk in de akte
      van benoeming vermeld. De bezoldiging behorende bij deze uitbreiding wordt berekend op grond van het salaris dat
      voor hem geldt bij de functie waarin hij reeds aan de instelling is benoemd.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R1208
  - number: I-R1301
    text: 'In deze paragraaf wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R1301
  - number: I-R1301.a
    text: '"instelling": een instelling als bedoeld in artikel I-A1, onder *d*15;'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R1301
  - number: I-R1301.b
    text: |-
      "betrokkene": degene die bij een bevoegd gezag aan een instelling is benoemd in een functie als bedoeld in artikel
      I-R1305.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R1301
  - number: I-R1302.1
    text: |-
      Het bevoegd gezag stelt met inachtneming van het bepaalde in artikel I-R1304, het beleid met betrekking tot de
      formatie van de leraarsfuncties vast.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R1302
  - number: I-R1302.2
    text: 'De formatie voor de instelling wordt onderscheidenlijk vastgesteld voor:'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R1302
  - number: I-R1302.2.a
    text: de component lager landbouwonderwijs; en
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R1302
  - number: I-R1302.2.b
    text: de component, niet zijnde lager landbouwonderwijs.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R1302
  - number: I-R1303
    text: |-
      De in gevolge artikel I-R1302, tweede lid, vastgestelde formatie ten behoeve van de component lager
      landbouwonderwijs wordt uitsluitend ingezet ten behoeve van die component.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R1303
  - number: I-R1304
    text: |-
      In het georganiseerd overleg op instellingsniveau als bedoeld in hoofdstuk IV-E kan worden overeengekomen af te
      wijken van het bepaalde in artikel I-P3, tweede lid, mits daarbij de taakomvang op jaarbasis ongewijzigd blijft.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R1304
  - number: I-R1305.1
    text: |-
      Onverminderd het bepaalde in de volgende leden, stelt Onze minister voor de normfuncties taakkarakteristieken of
      functiebeschrijvingen en maximumschalen vast.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R1305
  - number: I-R1305.2
    text: |-
      In het navolgende schema is een aantal normfuncties vermeld die in de formatie van de leraren, werkzaam in de
      component niet zijnde lager landbouwonderwijs dan wel beroepsbegeleidend onderwijs, kunnen zijn opgenomen, met de
      daarbij behorende maximumschaal.





                    Functie Maximumschaal




                    leraar A 12




                    leraar B 11




                    leraar C 10




           In de bijlage R9 bij dit besluit, zijn voor de normfuncties, vermeld in bovenstaand schema,
      functiebeschrijvingen en taakkarakteristieken opgenomen.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R1305
  - number: I-R1305.3
    text: |-
      Voor de leraar, in overwegende mate werkzaam in de component lager landbouwonderwijs is in afwijking van het
      eerste lid, de in de bijlage R3 bij dit besluit opgenomen taakkarakteristiek voor de normfunctie leraar voortgezet
      onderwijs van overeenkomstige toepassing. Voor deze leraar is schaal 10 de maximumschaal.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R1305
  - number: I-R1305.4
    text: |-
      Voor de leraar in overwegende mate werkzaam in de component beroepsbegeleidend onderwijs is in afwijking van het
      eerste lid artikel I-R1504 van overeenkomstige toepassing met inbegrip van de daarbij behorende bijlage R11, dan
      wel geldt de normfunctie leraar/consulent beroepsbegeleidend onderwijs. In bijlage R11*a* bij dit besluit zijn
      voor de normfunctie leraar/consulent beroepsbegeleidend onderwijs functiebeschrijvingen en taakkarakteristieken
      opgenomen.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R1305
  - number: I-R1306.1
    text: |-
      De betrokkene vervult zijn functie binnen de gebouwen of ruimten waarin de instelling of instellingen zijn
      gehuisvest en op de daarbij behorende terreinen. Het bevoegd gezag dient een voorstel in bij het overlegorgaan
      op instellingsniveau als bedoeld in hoofdstuk IV-E waarin nadere regels zijn getroffen met betrekking tot de
      mate waarin de weektaak plaatsgebonden is, met dien verstande dat de plaatsgebondenheid ten minste 65% van de
      betrekkingsomvang bedraagt.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R1306
  - number: I-R1306.2
    text: |-
      Het bevoegd gezag stelt voor de betrokkene werktijdregelingen vast. Onder werktijdregeling wordt verstaan een voor
      een periode van langer dan een week opgesteld en van te voren bekendgemaakt schema van aanvang en einde van de
      dagelijkse werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R1306
  - number: I-R1306.3
    text: |-
      Het bevoegd gezag stelt een regeling op met betrekking tot de werktijd alsmede met betrekking tot de autorisatie en
      registratie van afwezigheid.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R1306
  - number: I-R1307
    text: Het bepaalde in artikel I-P53, eerste en derde lid, is niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R1307
  - number: I-R1308
    text: |-
      Het is het bevoegd gezag niet toegestaan de betrokkene extra beloning toe te kennen in de vorm van periodieke
      verhoging, bedoeld in artikel I-P53, in de vorm van buitengewone toelage, bedoeld in artikel I-P55, in de vorm
      van gratificatie, bedoeld in artikel I-P56, dan wel in de vorm van uitkering of toelage om redenen van werving en
      behoud als bedoeld in de artikelen I-P57 en I-P58, in situaties waarin tevens sprake is van gedwongen ontslag van
      een of meer personeelsleden.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R1308
