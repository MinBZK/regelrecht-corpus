    text: '"instelling": een instelling als bedoeld in artikel I-A1, onder *d*14;'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-R1201
  - number: I-R1201.b
    text: |-
      "betrokkene": degene die bij een bevoegd gezag aan een instelling is benoemd in een functie als bedoeld in de
      artikelen I-R1204, I-R1211 en I-R1212;
