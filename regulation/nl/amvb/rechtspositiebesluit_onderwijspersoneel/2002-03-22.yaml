                      200 en hoger


                      11
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q206
  - number: I-Q207
    text: |-
      Indien ingevolge de door het bevoegd gezag vastgestelde formatie bedoeld in artikel I-P76, tweede lid, onder *a*
      niet langer een adjunct-directeur als bedoeld in artikel I-Q206 kan zijn benoemd, blijft de betrokkene bedoeld in
      artikel I-R201 die als adjunct-directeur was benoemd aanspraak houden op het carrièrepatroon dat voor hem op de
      laatste dag van het voorafgaande schooljaar gold, indien dit carrièrepatroon gedurende ten minste drie onmiddellijk
      voorafgaande schooljaren aan die instelling of, in voorkomende gevallen, instellingen voor hem als leraar tevens
      adjunct-directeur heeft gegolden. De betrokkene behoudt deze aanspraak zolang hij aan dezelfde instelling of
      instellingen verbonden blijft.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q207
  - number: I-Q208.1
    text: Zonder voorafgaand ontslag kan een benoeming als leraar tevens adjunct-directeur niet worden beëindigd.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q208
  - number: I-Q208.2
    text: |-
      Het bepaalde in het eerste lid is niet van toepassing ten aanzien van de leraar die als adjunct-directeur is
      benoemd en op wie artikel I-Q207 van toepassing is.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q208
  - number: I-Q208.3
    text: |-
      Zolang aan de instelling of, in voorkomende gevallen, instellingen een leraar is verbonden voor wie het bepaalde in
      artikel I-Q207 geldt, kan geen andere leraar tevens tot adjunct-directeur worden benoemd.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q208
  - number: I-Q209.1
    text: |-
      Indien het bepaalde in artikel I-Q204, tweede lid, onder a” aan een basisschool met twee normfuncties directeur
      gedurende drie achtereenvolgende schooljaren tot een hoger maximumsalaris voor de directeursfunctie leidt als
      gevolg van het feit dat y groter dan of gelijk aan 200 wordt, geldt met ingang van het derde schooljaar het
      carrièrepatroon dat behoort bij de functie met dat hogere maximumsalaris voor de directeur.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q209
  - number: I-Q209.2
    text: |-
      De directeur van een basisschool met twee normfuncties directeur die gedurende een periode van drie aaneengesloten
      schooljaren in de normfunctie van directeur benoemd is waarbij op grond van het bepaalde in artikel I-Q204, tweede
      lid, onder a” hetzelfde maximumsalaris behoort, behoudt in geval y kleiner wordt dan 200 aanspraak op bezoldiging
      volgens het carrièrepatroon dat behoort bij die functie met dat maximumsalaris zolang hij in de normfunctie van
      directeur aan dezelfde basisschool benoemd blijft.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q209
  - number: I-Q209.3
    text: |-
      Indien y kleiner wordt dan 200 blijft voor de directeur van een basisschool met twee normfuncties directeur wiens
      bezoldiging wordt vastgesteld volgens schaal 10, het maximumsalaris bepaald op het hoogste bedrag in die schaal
      zolang hij in de desbetreffende functie aan dezelfde basisschool verbonden blijft.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q209
  - number: I-Q209.4
    text: |-
      Indien op een andere grond dan een wijziging van y het bepaalde in artikel I-Q204 tot een hogere dan wel een lagere
      maximumschaal voor de normfunctie van directeur van de basisschool leidt, is het bepaalde in artikel I-Q106 niet
      van toepassing ten aanzien van deze wijzigingen van de maximumschaal.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q209
  - number: I-Q209a.1
    text: |-
      Indien het bepaalde in artikel I-Q204, derde lid, onder b, aan een speciale school voor basisonderwijs met
      twee normfuncties directeur gedurende drie achtereenvolgende schooljaren tot een hoger maximumsalaris voor
      de directeursfunctie leidt als gevolg van het feit dat y groter dan of gelijk aan 100, onderscheidenlijk 200
      wordt, geldt met ingang van het derde schooljaar het carrièrepatroon dat behoort bij de functie met dat hogere
      maximumsalaris voor de directeur.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q209a
  - number: I-Q209a.2
    text: |-
      De directeur van een speciale school voor basisonderwijs met twee normfuncties directeur die gedurende een periode
      van drie aaneengesloten schooljaren in de normfunctie van directeur benoemd is waarbij op grond van het bepaalde
      in artikel I-Q204, derde lid, onder b, hetzelfde maximumsalaris behoort, behoudt in geval y kleiner wordt dan 100,
      onderscheidenlijk 200, aanspraak op bezoldiging volgens het carrièrepatroon dat behoort bij die functie met dat
      maximumsalaris zolang hij in de normfunctie van directeur aan dezelfde school benoemd blijft.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q209a
  - number: I-Q209a.3
    text: |-
      Indien y kleiner wordt dan 100, onderscheidenlijk 200, blijft voor de directeur van een speciale school
      voor basisonderwijs met twee normfuncties directeur wiens bezoldiging wordt vastgesteld volgens schaal 11,
      onderscheidenlijk schaal 12, het maximumsalaris bepaald op het bedrag genoemd in artikel I-Q204, derde lid, onder
      b, sub 2°, onderscheidenlijk sub 3° zolang hij in de desbetreffende functie aan dezelfde school verbonden blijft.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q209a
  - number: I-Q209a.4
    text: |-
      Indien op een andere grond dan een wijziging van y het bepaalde in artikel I-Q204 tot een hogere dan wel een lagere
      maximumschaal voor de normfunctie van directeur van de school leidt, is het bepaalde in artikel I-Q106 niet van
      toepassing ten aanzien van deze wijzigingen van de maximumschaal.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q209a
  - number: I-Q209b.1
    text: |-
      Een betrokkene die is benoemd in de normfunctie van directeur of adjunct-directeur van een basisschool ontvangt een
      toelage als vermeld in bijlage 2, onder 4, bij de voor die betrokkene geldende maximumschaal.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q209b
  - number: I-Q209b.2
    text: |-
      In afwijking van het eerste lid ontvangt een betrokkene met ingang van het derde schooljaar de toelage, vermeld in
      bijlage 2, onder 5, indien deze is benoemd:
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q209b
  - number: I-Q209b.2.a
    text: |-
      in een normfunctie directeur aan een basisschool waarvan de factor y gedurende drie achtereenvolgende schooljaren
      gelijk is aan of groter is dan 400 en het carrièrepatroon geldt dat behoort bij maximumschaal 11;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q209b
  - number: I-Q209b.2.b
    text: |-
      in een normfunctie adjunct-directeur aan een basisschool waarvan de factor y gedurende drie achtereenvolgende
      schooljaren gelijk is aan of groter is dan 200 en het carrièrepatroon geldt dat behoort bij maximumschaal 9.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q209b
  - number: I-Q209b.3
    text: |-
      Indien de factor y kleiner is dan 900 en geen personeelslid is benoemd in de normfunctie directeur en maximaal één
      personeelslid in de normfunctie adjunct-directeur, geldt de toelage die in bijlage 2, onder 5, is vermeld:
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q209b
  - number: I-Q209b.3.a
    text: |-
      voor het personeelslid dat is benoemd in een door het bevoegd gezag op grond van artikel I-P2, vierde lid,
      vastgestelde functie waarin hij onder leiding van een aan die school verbonden directeur is belast met
      directiewerkzaamheden;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q209b
  - number: I-Q209b.3.b
    text: |-
      voor het personeelslid dat is benoemd als directeur van die school indien geen personeelslid een toelage op grond
      van a, ontvangt.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q209b
  - number: I-Q209b.4
    text: |-
      Een betrokkene die is benoemd in een normfunctie directeur van een basisschool voor wie het carrièrepatroon geldt
      dat behoort bij maximumschaal 11 en een betrokkene die is benoemd in een normfunctie adjunct-directeur van een
      basisschool voor wie het carrièrepatroon geldt dat behoort bij maximumschaal 9, voor wie de toelage, bedoeld in
      het tweede lid, geldt, behoudt aanspraak op die toelage zolang hij benoemd blijft in de desbetreffende functie aan
      dezelfde instelling of instellingen en voor hem dezelfde maximumschaal blijft gelden.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q209b
  - number: I-Q209b.5
    text: |-
      De toelage, bedoeld in het eerste tot en met vierde lid, van de betrokkene die is benoemd in een betrekking met
      een omvang anders dan die van een normbetrekking wordt berekend naar evenredigheid van die betrekkingsomvang. De
      aldus berekende uitkomst wordt op rekenkundige wijze afgerond op centen. Een toelage die op grond van dit artikel
      wordt berekend, kan nooit hoger zijn dan de toelage die volgens bijlage 2, onder 4 en 5, voor betrokkene zou gelden
      indien die betrokkene in een normbetrekking zou zijn benoemd.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q209b
  - number: I-Q209b.6
    text: |-
      Een toelage als bedoeld in dit artikel, telt niet mee voor de toepassing of overeenkomstige toepassing van artikel
      I-P8.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q209b
  - number: I-Q210.1
    text: |-
      Indien op grond van [artikel 29, eerste lid, derde volzin, van de Wet op het primair onderwijs][ref1] een directeur
      van een basisschool tevens is belast met de leiding van een andere instelling waar de functie van directeur vacant
      is, kan het bevoegd gezag, zolang deze situatie zich voordoet en uitsluitend ten laste van eigen middelen aan die
      directeur boven zijn salaris een maandelijkse toelage toekennen ten bedrage van het verschil tussen het bedrag bij
      salarisnummer 12 in schaal 10 en het bedrag bij salarisnummer 11 in die schaal. Indien het een directeur van een
      speciale school voor basisonderwijs betreft, bedraagt de in de vorige volzin bedoelde toelage het verschil tussen
      het bedrag bij salarisnummer 9 in schaal 11 en het bedrag bij salarisnummer 8 in die schaal.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel29
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q210
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '29'
  - number: I-Q210.2
    text: |-
      De in het eerste lid bedoelde toelage behoort niet tot het inkomen, als bedoeld in het
      pensioenreglement, en telt niet mee voor de berekening en vaststelling van uitkeringen ingevolge het
      [Besluit werkloosheid onderwijs- en onderzoekpersoneel][ref1], het Besluit ziekte en arbeidsongeschiktheid
      onderwijs- en onderzoekpersoneel, alsmede de regeling voor vervroegde uittreding.


      [ref1]: https://wetten.overheid.nl/BWBR0006445
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q210
    references:
      - id: ref1
        bwb_id: BWBR0006445
  - number: I-Q210.3
    text: |-
      Indien de betrokkene niet in een normbetrekking is benoemd, wordt de toelage berekend naar evenredigheid van zijn
      betrekkingsomvang.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q210
  - number: I-Q301
    text: 'In deze paragraaf wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q301
  - number: I-Q301.a
    text: 'directeur: de directeur van een instelling als bedoeld in artikel I-A1, onder *d*2;'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q301
  - number: I-Q301.b
    text: |-
      adjunct-directeur: degene die is benoemd in een functie bedoeld in paragraaf 3 van hoofdstuk I-R die tevens is
      benoemd tot adjunct-directeur;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q301
  - number: I-Q301.c
    text: |-
      directie: de directeur of directeuren, de eventuele adjunct-directeuren en de eventuele andere betrokkenen die zijn
      benoemd in een functie die is ingedeeld in hoofdstuk I-Q gezamenlijk;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q301
  - number: I-Q301.d
    text: 'betrokkene: degene die deel uitmaakt van de directie;'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q301
  - number: I-Q301.e
    text: 'instelling: een instelling als bedoeld in artikel I-A1, onder *d*2;'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q301
  - number: I-Q301.f
    text: |-
      Q: de totale normatieve formatie naar boven afgerond op hele formatieplaatsen,
      berekend volgens [artikel 16, vijfde lid, van het Formatiebesluit WEC][ref1] of
      [artikel 25, vijfde lid, van het Formatiebesluit W.V.O.][ref2], dan wel, indien het een
      instelling voor onderwijs aan visueel gehandicapte kinderen betreft, berekend volgens
      [artikel 26a van het Formatiebesluit WEC][ref3] vermeerderd met de formatie toegekend op grond van
      [artikel 117, vijfde lid, van de Wet op de expertisecentra][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0005442#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0005446#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0005442#Artikel26a
      [ref4]: https://wetten.overheid.nl/BWBR0003549#Artikel117
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q301
    references:
