    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S1407
  - number: I-S1408
    text: Het bepaalde in artikel I-P53, eerste en derde lid, is niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S1408
  - number: I-S1409
    text: Het bepaalde in artikel I-S110, derde lid, is niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S1409
  - number: I-S1410.1
    text: |-
      De omvang van de betrekking van de betrokkene die aan de instelling is of wordt verbonden en die daarnaast
      vervangingswerkzaamheden verricht of gaat verrichten aan die instelling of aan een andere instelling waaraan hij
      uit hoofde van zijn benoeming verbonden kan worden, wordt voor de duur van die vervangingswerkzaamheden tijdelijk
      uitgebreid met ingang van de dag waarop hij feitelijk met de vervanging wordt belast.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S1410
  - number: I-S1410.2
    text: |-
      Indien een betrokkene wordt belast met werkzaamheden van kennelijk tijdelijke aard ten behoeve van derden en voor
      zover hij daarvoor niet een vergoeding ontvangt of verlof krijgt, kan het bevoegd gezag bepalen dat de omvang van
      de betrekking van de betrokkene tijdelijk wordt uitgebreid.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S1410
  - number: I-S1410.3
    text: |-
      De in het eerste en tweede lid bedoelde uitbreiding wordt voor de duur waarvoor zij geldt afzonderlijk in de akte
      van benoeming vermeld. De bezoldiging behorende bij deze uitbreiding wordt berekend op grond van het salaris dat
      voor hem geldt bij de functie waarin hij reeds aan de instelling is benoemd.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S1410
  - number: I-S1501
    text: 'In deze paragraaf wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S1501
  - number: I-S1501.a
    text: '"instelling": een instelling als bedoeld in artikel I-A1, onder *d*18;'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S1501
  - number: I-S1501.b
    text: |-
      "betrokkene": degene die bij een bevoegd gezag aan een instelling is benoemd in een functie als bedoeld in de
      artikelen I-S1505, I-S1513 en I-S1514;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S1501
  - number: I-S1501.c
    text: |-
      "y": het aantal deeltijdequivalenten, zoals dat op basis van leerovereenkomsten overeenkomstig artikel E-3 van
      het Uitvoeringsbesluit WCBO voor de bekostiging van een instelling voor beroepsbegeleidend onderwijs in aanmerking
      wordt genomen;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S1501
  - number: I-S1501.d
    text: |-
      "verticale scholengemeenschap": een scholengemeenschap, bedoeld in artikel I-Q101, onderdeel *c* onder 3, bestaande
      uit een instelling en een of meer scholen als bedoeld in artikel I-A1,onder *d*3.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S1501
  - number: I-S1502
    text: |-
      Het bevoegd gezag stelt met inachtneming van het bepaalde in artikel I-S1503, het beleid met betrekking tot de
      formatie van het ondersteunend en beheerspersoneel vast.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S1502
  - number: I-S1503
    text: |-
      In het georganiseerd overleg op instellingsniveau als bedoeld in hoofdstuk IV-E kan worden overeengekomen af te
      wijken van het bepaalde in artikel I-P3, derde lid, mits daarbij de taakomvang op jaarbasis ongewijzigd blijft.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S1503
  - number: I-S1504
    text: |-
      Het bevoegd stelt een regeling op met betrekking tot de werktijd alsmede met betrekking tot de autorisatie en
      registratie van afwezigheid.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S1504
  - number: I-S1505.1
    text: |-
      Onverminderd het bepaalde in het tweede lid stelt Onze minister voor de normfuncties taakkarakteristieken of
      functiebeschrijvingen en maximumschalen vast.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S1505
  - number: I-S1505.2
    text: |-
      Binnen de formatie die is vastgesteld met inachtneming van artikel I-S1502 kunnen betrokkenen worden benoemd in
      functies als is aangegeven in onderstaand schema. De daarbij vermelde maximumschalen zijn van toepassing indien
      *y* van de instelling 4000 of meer bedraagt. Bij een kleinere instelling stelt het bevoegd gezag de maximumschaal
      vast, rekening houdend met de voor het Rijkspersoneel terzake geldende normen en in samenhang met de formatie. In
      de bijlage S12 zijn voor de normfuncties, vermeld in bovenstaand schema, functiebeschrijvingen gegeven.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S1505
  - number: I-S1506.1
    text: Artikel I-S104 is niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S1506
  - number: I-S1506.2
    text: |-
      Zodra aan de betrokkene op grond van artikel I-P13 een periodieke verhoging wordt toegekend en zijn salaris ten
      minste gelijk is aan het laagste bedrag in de bij zijn functie behorende maximumschaal, wordt, tenzij naar het
      oordeel van het bevoegd gezag zijn wijze van functioneren zich daar nog tegen verzet, zijn salaris bepaald op het
      naasthogere bedrag in de bij zijn functie behorende maximumschaal.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S1506
  - number: I-S1506.3
    text: |-
      Zo nodig wordt het bedrag in de maximumschaal dat is vastgesteld op grond van het tweede lid, verhoogd tot een
      bedrag in de maximumschaal om te bereiken dat het salaris in de maximumschaal te allen tijde uitgaat boven het
      salaris dat voor de betrokkene in de aanloopschaal zou hebben gegolden.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S1506
  - number: I-S1506.4
    text: |-
      Het bevoegd gezag kan regels opstellen ten aanzien van het carrièrepatroon en het doorlopen daarvan die in voor de
      betrokkene gunstige zin afwijken van het tweede en derde lid.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S1506
  - number: I-S1507
    text: |-
      Het bevoegd gezag kan regels opstellen ten aanzien van de criteria waaraan de betrokkene moet hebben voldaan
      alvorens te kunnen worden bezoldigd volgens de bij zijn functie behorende maximumschaal.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S1507
  - number: I-S1508
    text: Het bepaalde in artikel I-P53, eerste en derde lid, is niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S1508
  - number: I-S1509
    text: Het bepaalde in artikel I-S110, derde lid, is niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S1509
  - number: I-S1510.1
    text: |-
      De omvang van de betrekking van de betrokkene die aan de instelling is of wordt verbonden en die daarnaast
      vervangingswerkzaamheden verricht of gaat verrichten aan die instelling of aan een andere instelling waaraan hij
      uit hoofde van zijn benoeming verbonden kan worden, wordt voor de duur van die vervangingswerkzaamheden tijdelijk
      uitgebreid met ingang van de dag waarop hij feitelijk met de vervanging wordt belast.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S1510
  - number: I-S1510.2
    text: |-
      Indien een betrokkene wordt belast met werkzaamheden van kennelijk tijdelijke aard ten behoeve van derden en voor
      zover hij daarvoor niet een vergoeding ontvangt of verlof krijgt, kan het bevoegd gezag bepalen dat de omvang van
      de betrekking van de betrokkene tijdelijk wordt uitgebreid.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S1510
  - number: I-S1510.3
    text: |-
      De in het eerste en tweede lid bedoelde uitbreiding wordt voor de duur waarvoor zij geldt afzonderlijk in de akte
      van benoeming vermeld. De bezoldiging behorende bij deze uitbreiding wordt berekend op grond van het salaris dat
      voor hem geldt bij de functie waarin hij reeds aan de instelling is benoemd.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S1510
  - number: I-S1601.1
    text: |-
      Artikel I-S302 is van overeenkomstige toepassing op een instelling, bedoeld in artikel I-
      A1, onder e16, voor zover die instelling over formatierekeneenheden beschikt als bedoeld in
      [artikel 68, eerste lid onder d, van de Wet op het primair onderwijs][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel68
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S1601
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '68'
  - number: I-S1601.2
    text: |-
      Het bevoegd gezag stelt voor de betrokkene bedoeld in artikel I-A1, onder *e*16, de functie en de daarbij behorende
      maximumschaal vast.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S1601
  - number: I-S1601.3
    text: |-
      Onverminderd het eerste lid, stelt het bevoegd gezag daartoe een functiebeschrijving op en stelt voor deze functie
      een maximumschaal vast op basis van de aard en de inhoud van de werkzaamheden die in de functie zijn samengebracht,
      met inachtneming van de voor de Rijksoverheid geldende normen ten aanzien van functiewaardering.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S1601
  - number: I-T1.1
    text: Dit hoofdstuk heeft uitsluitend betrekking op de leraar in opleiding.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-T1
  - number: I-T1.2
    text: |-
      Tenzij uitdrukkelijk anders bepaald zijn de hoofdstukken I-A, I-B, I-C, I-D, I-F, I-G, I-J, I-K, I-L, I-P, I-R, II-
      A, II-B, II-C. II-D, III-A, IV-B, IV-F van toepassing op de leraar in opleiding.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-T1
  - number: I-T2
    text: |-
      Niet van toepassing op de leraar in opleiding zijn de artikelen I-L2, derde lid, I-P6, I-P7, I-P8, I-P9, I-P10, I-
      P11, I-P12, I-P16, I-R 204.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-T2
  - number: I-T3
    text: 'In dit hoofdstuk wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-T3
  - number: I-T3.a
    text: |-
      leraar in opleiding: de laatstejaars student van een lerarenopleiding basisonderwijs of speciaal onderwijs, die
      wordt benoemd op een leerarbeidsplaats bij een instelling als bedoeld in artikel I-A1, onder d1 of d2;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-T3
  - number: I-T3.b
    text: 'leerarbeidsplaats: een functie waarin uitsluitend een leraar in opleiding kan worden benoemd;'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-T3
  - number: I-T3.c
    text: |-
      leer-arbeidsovereenkomst: een overeenkomst die bestaat uit de benoeming bedoeld in artikel I-A1, onder o, alsmede
      een leerovereenkomst die wordt gesloten tussen de leraar in opleiding, de instelling waar de leraar in opleiding is
      benoemd en de lerarenopleiding waar de leraar in opleiding is ingeschreven;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-T3
  - number: I-T3.d
    text: |-
      lioschap: de periode gedurende welke de leraar in opleiding bij een instelling als bedoeld in artikel I-A1, onder
      d1 of d2, is benoemd;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-T3
  - number: I-T3.e
    text: |-
      leer-werkplan: een door de leraar in opleiding opgesteld plan, waarin, in overleg met de lerarenopleiding waar de
      leraar in opleiding is ingeschreven en het bevoegd gezag van de instelling waar de leraar in opleiding is benoemd,
      de leer- en werkactiviteiten zijn vastgelegd die de leraar in opleiding tijdens zijn lioschap zal verrichten.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-T3
  - number: I-T4.1
    text: |-
      De leraar in opleiding wordt benoemd in tijdelijke dienst voor een termijn van vijf maanden bij een normbetrekking
      of een termijn van tien maanden bij een werktijdfactor van 0,5.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-T4
  - number: I-T4.2
    text: |-
      De in het eerste lid bedoelde perioden eindigen voor de datum waarop de zomervakantie van de instelling waaraan de
      leraar in opleiding is benoemd, aanvangt.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-T4
  - number: I-T4.3
    text: Het eerste lid geldt voor de leraar in opleiding in het openbaar onderwijs in afwijking van hoofdstuk II-A.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-T4
  - number: I-T5.1
    text: |-
      De functie leraar in opleiding is een normfunctie die is afgeleid van de normfuncties leraar zoals deze zijn
      vastgelegd in de taakkarakteristieken opgenomen in de bijlagen R1 en R2.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-T5
  - number: I-T5.2
    text: |-
      De functie leraar in opleiding omvat de in het derde lid aangegeven taakkarakteronderdelen waarbij de zelfstandige
      uitoefening van die taken geleidelijk toeneemt tijdens het lioschap.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-T5
  - number: I-T5.3
    text: 'De taakkarakteristiek van de functie leraar in opleiding is het leren van het beroep leraar door middel van:'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-T5
  - number: I-T5.3.a
    text: het geven van onderwijs, alsmede de daaruit rechtstreeks voortvloeiende werkzaamheden;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-T5
  - number: I-T5.3.b
    text: 'algemene werkzaamheden, die redelijkerwijs voortvloeien uit het onderwijs aan de instelling, zoals:'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-T5
  - number: I-T5.3.b.1
    text: het deelnemen aan teamvergaderingen;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-T5
  - number: I-T5.3.b.2
    text: het onderhouden van contacten met collega’s van de instelling, ouders, begeleidingsdiensten e.d.;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-T5
  - number: I-T5.3.b.3
    text: het verrichten van overige werkzaamheden ten behoeve van de goede gang van zaken aan de instelling.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-T5
  - number: I-T6.1
    text: |-
      Tussen de leraar in opleiding, de instelling waar de leraar in opleiding is benoemd en de lerarenopleiding waar de
      leraar in opleiding is ingeschreven wordt een leer-arbeidsovereenkomst gesloten.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-T6
  - number: I-T6.2
    text: De omvang van het leeraandeel en het arbeidsaandeel worden aan elkaar gelijk gesteld.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-T6
  - number: I-T6.3
    text: |-
      De leer-arbeidsovereenkomst bevat tenminste bepalingen over: a. de begeleiding van de leraar in opleiding; b.
      dat deel van de eindtermen dat de leraar in opleiding tijdens het lioschap dient te realiseren en de beoordeling
      daarvan, alsmede de onderdelen genoemd in artikel I-B2, eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-T6
  - number: I-T7.1
    text: |-
      De leraar in opleiding stelt voor aanvang van de leer-arbeidsovereenkomst een leer-werkplan op. Het leer-werkplan
      wordt getoetst door:
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-T7
  - number: I-T7.1.a
    text: de lerarenopleiding waar de leraar in opleiding is ingeschreven en
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-T7
  - number: I-T7.1.b
    text: het bevoegd gezag van de instelling waar de leraar in opleiding is benoemd.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-T7
  - number: I-T7.2
    text: |-
      De lerarenopleiding waar de leraar in opleiding is ingeschreven toetst het leer-werkplan aan de eindtermen van
      de opleiding.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-T7
  - number: I-T7.3
    text: |-
      Het bevoegd gezag van de instelling waar de leraar in opleiding is benoemd toetst het leer-werkplan voor zover het
      gaat om de werkzaamheden die verricht moeten worden.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-T7
  - number: I-T8
    text: |-
      Artikel I-J9 is niet van toepassing indien de leraar in opleiding gebruik kan maken van een reisvoorziening als
      bedoeld in [artikel 3.7 van de Wet studiefinanciering 2000][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel3
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-T8
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '3'
  - number: I-T9
    text: |-
      Het salaris van de leraar in opleiding wordt met met inachtneming van de bepalingen van dit besluit vastgesteld aan
      de hand van bijlage IG van dit besluit.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-T9
  - number: I-U1
    text: 'In dit hoofdstuk wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-U1
  - number: I-U1.a
    text: 'betrokkene: de betrokkene, bedoeld in artikel I-A1, onder *e*7.'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-U1
  - number: I-U1.b
    text: |-
      formatieruimte; dat deel van de door Onze minister ter beschikking gestelde financiële middelen dat wordt aangewend
      voor functies van personeel bedoeld in artikel I-A1, onder *e*7.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-U1
  - number: I-U2.1
    text: |-
      De functie van de betrokkene wordt vervuld binnen de gebouwen of ruimten waarin de instelling is gehuisvest en op
      de daarbij behorende terreinen, tenzij de aard van de te verrichten werkzaamheden zich daartegen verzet.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-U2
  - number: I-U2.2
    text: De arbeidsduur bedraagt gemiddeld ten hoogste 38 uur per week.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-U2
  - number: I-U2.3
    text: |-
      Het bevoegd gezag stelt na overleg met de betrokkene zo mogelijk aan het begin van het kalenderjaar een
      werktijdenregeling vast. De werktijdenregeling wordt met instemming van de betrokkene vastgesteld, indien in deze
      regeling is bepaald dat arbeidsduurverkorting niet in regelmatige terugkerende perioden van een week wordt genoten.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-U2
  - number: I-U2.4
    text: |-
      Het bevoegd gezag stelt na overleg met de betrokkene de dagelijkse werktijden vast, waarbij doorgaans per dag niet
      meer dan 8 uur wordt gewerkt.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-U2
  - number: I-U2.5
    text: |-
      Van de op grond van het derde en vierde lid vastgestelde tijden wordt in opdracht van het bevoegd gezag na overleg
      met de betrokkene incidenteel afgeweken indien om schoolorganisatorische redenen de werkzaamheden noodzakelijk op
      andere tijden dan bedoeld in het derde en vierde lid moeten worden verricht.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-U2
  - number: I-U4
    text: |-
      Aan de betrokkene voor wie het salaris wordt vastgesteld volgens een schaal met een lager maximum dan dat van
      schaal 11 van bijlage IA van het Rechtspositiebesluit onderwijspersoneel, aan wie met goedkeuring van Onze minister
      buiten de voor hem vastgestelde werktijden arbeid wordt opgedragen, waardoor het voor hem vastgestelde aantal
      dagelijkse arbeidsuren wordt overschreden, wordt voor de gedurende deze overschrijding verrichte arbeid (aan te
      duiden als overwerk), met uitzondering van de arbeid verricht gedurende minder dan een half uur aansluitend aan de
      voor hem geldende werktijden, een vergoeding toegekend overeenkomstig het bepaalde in artikel I-S106, vierde lid,
      onder *b* en vijfde tot en met achtste lid.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-U4
  - number: I-U5.1
    text: |-
      Aan de betrokkene, wiens salaris wordt vastgesteld volgens een schaal met een lager maximum dan dat van schaal 11
      van bijlage 1A van het Rechtspositiebesluit onderwijspersoneel en die, anders dan bij wijze van overwerk, bedoeld
      in artikel I-U2, geregeld of vrij geregeld arbeid verricht op andere tijden dan op de werkdagen maandag tot en
      met vrijdag tussen 8.00 en 18.00 uur, wordt deswege een toelage toegekend overeenkomstig het bepaalde in artikel
      I-S107.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-U5
  - number: I-U5.2
    text: |-
      Aan de betrokkene, wiens salaris, als gevolg van het buiten zijn toedoen beëindigen of verminderen van de toelage,
      bedoeld in het eerste lid, een blijvende verlaging ondergaat van ten minste 3%, wordt een overgangstoelage
      toegekend overeenkomstig het bepaalde in artikel I-S108, eerste lid.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-U5
  - number: I-U6
    text: |-
      De betrokkene ontvangt geen bezoldiging over de tijd, gedurende welke hij in strijd met zijn verplichtingen
      opzettelijk nalaat zijn werkzaamheden te verrichten.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-U6
  - number: I-U7.1
    text: |-
      Voor de betrokkene, benoemd in een volledige weektaak, die de leeftijd van 60 jaar heeft bereikt, wordt op zijn
      schriftelijk verzoek, de dagelijkse werktijd met een half uur verkort, mits hij geen bezoldigde nevenwerkzaamheden
      verricht of gaat verrichten. In dat geval vervalt tevens het recht op een eventuele ontslaguitkering ter zake van
      beëindiging van nevenwerkzaamheden.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-U7
  - number: I-U7.2
    text: |-
      Het eerste lid vindt geen toepassing zolang voor de betrokkene de duur van het vakantieverlof, bedoeld in artikel
      I-C24, met meer dan een door Onze minister te bepalen aantal dagen per kalenderjaar wordt verlengd.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-U7
  - number: I-U7.3
    text: Het eerste lid is niet van toepassing op de betrokkene die gebruik maakt van hoofdstuk I-V.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-U7
  - number: I-U7.4
    text: |-
      De betrokkene, op wie het bepaalde in het eerste lid van toepassing is verklaard, alsmede de betrokkene die gebruik
      maakt van hoofdstuk I-V kunnen niet met overwerk als bedoeld in artikel I-U2 worden belast.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-U7
  - number: I-VI
    text: 'In dit hoofdstuk wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-VI
  - number: I-VI.a
    text: '«betrokkene»: de betrokkene, bedoeld in artikel I-A1, onder e1, e2 en e16'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-VI
  - number: I-VI.b
    text: '"verlof": verlof bedoeld in artikel I-V2.'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-VI
  - number: I-V2.1
    text: |-
      De betrokkene heeft op grond van dit hoofdstuk op zijn verzoek aanspraak op verlof als bedoeld in artikel I-V3 met
      gedeeltelijk behoud van bezoldiging als aangegeven in artikel I-V4 indien hij:
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-V2
  - number: I-V2.1.a
    text: |-
      direct voorafgaande aan de ingangsdatum van het verlof gedurende ten minste vijf jaren aaneengesloten in dienst is
      geweest van een door Onze minister bekostigde onderwijs- of onderzoekinstelling, dan wel een door de Minister van
      Landbouw, Natuurbeheer en Visserij bekostigde onderwijsinstelling, waarbij de periode gedurende welke de betrokkene
      een werkloosheidsuitkering genoot in verband met het beëindigd zijn van een bij bedoelde onderwijs- of onderzoek
      instelling betrekking als diensttijd wordt aangemerkt en
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-V2
  - number: I-V2.1.b
    text: de leeftijd van 52 jaar heeft bereikt.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-V2
  - number: I-V2.2
    text: |-
      Het verlof gaat niet eerder in dan op de eerste dag van de maand volgend op die waarin de leeftijd genoemd in
      artikel I-V3, tweede en derde lid, is bereikt.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-V2
  - number: I-V2.3
    text: |-
      Om redenen van dienstbelang kan de ingangsdatum van het verlof worden opgeschort tot uiterlijk de eerste dag van
      het daaropvolgend schooljaar.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-V2
  - number: I-V3.1
    text: |-
      De omvang van het verlof bedraagt voor alle betrokkenen zowel bij een normbetrekking als bij een deel van de
      normbetrekking op jaarbasis ten minste 45 uren.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-V3
  - number: I-V3.2
    text: |-
      De omvang van het verlof bedraagt voor de betrokkene die is benoemd in een functie als bedoeld in hoofdstuk I-Q of
      I-R en die de leeftijd van 52 jaar heeft bereikt maar jonger is dan 56 jaar bij een normbetrekking op jaarbasis ten
      hoogste 170 uren.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-V3
  - number: I-V3.3
    text: |-
      De omvang van het verlof bedraagt voor de betrokkene die is benoemd in een functie als bedoeld in hoofdstuk I-
      Q of hoofdstuk I-R en die de leeftijd van 56 jaar heeft bereikt bij een normbetrekking op jaarbasis ten hoogste
      340 uren.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-V3
  - number: I-V3.4
    text: |-
      De omvang van het verlof bedraagt voor de betrokkene die is benoemd in een functie als bedoeld in hoofdstuk I-S, op
      jaarbasis het aantal uren dat de uitkomst is van de formule (1659 – (a + b)) x L ---------------------------, 1659
      waarbij a = het bij de leeftijd van betrokkene behorende aantal verlofuren op grond van artikel I-C7, derde lid, of
      artikel I-C24, tweede lid, b = 112,5 uren voor de betrokkene, bedoeld in artikel I-S111, eerste lid, en L = voor de
      betrokkene die de leeftijd van 52 jaar heeft bereikt maar jonger is dan 56 jaar 170 uren en voor de betrokkene van
      56 jaar of ouder 340 uren.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-V3
  - number: I-V3.5
    text: |-
      Voor de betrokkene met een betrekkingsomvang van minder dan een normbetrekking, wordt het aantal uren verlof,
      bedoeld in het tweede, derde en vierde lid, vastgesteld naar evenredigheid van die betrekkingsomvang en rekenkundig
      afgerond op gehele of halve uren.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-V3
  - number: I-V3a.1
    text: |-
      Het verlof, bedoeld in artikel I-V3, kan voor zover het dienstbelang zich daartegen niet verzet op verzoek van
      betrokkene geheel of gedeeltelijk in een later schooljaar worden opgenomen bij hetzelfde of een ander bevoegd gezag
      dan het bevoegd gezag waarbij het verlof is gespaard.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-V3a
  - number: I-V3a.2
    text: |-
      Het aantal uren op te nemen verlof op grond van dit hoofdstuk tezamen met het verlof op grond van artikel I-C41 mag
      jaarlijks ten hoogste 50% van de betrekkingsomvang bedragen.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-V3a
  - number: I-V3a.3
    text: |-
      De betrokkene die is benoemd in een normbetrekking en die op grond van artikel 5, eerste of vierde lid, van
      het FPU-reglement basis- en aanvullende uitkering, op de leeftijd van 61 jaar doch uiterlijk op de laatste dag
      van het schooljaar waarin hij die leeftijd heeft bereikt, zal uittreden voor het gedeelte van de werktijdfactor
      dat overeenkomt met het aantal uren waarop in de maand voorafgaand aan de datum van uittreden artikel I-V4 van
      toepassing is, wordt de omvang van het verlof, bedoeld in artikel I-V3, verhoogd met 170 uren extra verlof.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-V3a
  - number: I-V3a.4
    text: |-
      De omvang van het verlof, bedoeld in artikel I-V3, wordt eveneens verhoogd met 170 uren extra verlof indien de
      in het derde lid bedoelde betrokkene uittreedt voor een kleiner gedeelte van de werktijdfactor dan het gedeelte
      dat overeenkomt met het aantal uren waarop in de maand voorafgaand aan de datum van uittreden artikel I-V4 van
      toepassing is, doch voor ten minste het gedeelte van de werktijdfactor dat overeenkomt met het aantal uren verlof
      dat voor hem geldt op grond van artikel I-V3.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-V3a
  - number: I-V3a.5
    text: |-
      Het derde en het vierde lid zijn van overeenkomstige toepassing op de betrokkene die is benoemd in een
      normbetrekking en die een aanvullende uitkering ontvangt op grond van artikel 4.3. onder a, van het FPU-reglement
      basis- en aanvullende uitkering, en die zal uittreden op de leeftijd van 62 jaar en op de betrokkene die zal
      uittreden op grond van artikel 5.7.1. van dat reglement.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-V3a
  - number: I-V3a.6
    text: |-
      Voor de betrokkene op wie de in het derde, vierde of vijfde lid genoemde bepalingen van het FPU-reglement basis-
      en aanvullende uitkering van toepassing zijn en die is benoemd in een betrekking met een omvang van minder dan
      een normbetrekking, wordt het extra verlof, genoemd in het derde lid, naar evenredigheid van de betrekkingsomvang
      berekend en afgerond op gehele uren.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-V3a
  - number: I-V4.1
    text: |-
      De bezoldiging voor het gedeelte van de betrekkingsomvang waarvoor betrokkene verlof op grond van dit hoofdstuk
      geniet, bedraagt voor personeel dat is benoemd in een functie met maximumschaal 8 of lager 75% en voor het overige
      personeel 65% van de bezoldiging die voor hem bij die betrekkingsomvang op grond van de hoofdstukken I-Q, I-R, I-S,
      V-Q, V-R of V-S zou gelden.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-V4
  - number: I-V4.2
    text: |-
      Voor de betrokkene op wie artikel 5, eerste of vierde lid, van het FPU-reglement basis- en aanvullende uitkering
      van toepassing is, maar die geen gebruik maakt van de in die regeling geboden mogelijkheid om uit te treden, geldt,
      dat hij voor het aantal uren verlof dat ligt boven het aantal uren dat voor hem geldt op grond van artikel I-V3,
      geen bezoldiging ontvangt vanaf de datum waarop hij gebruik zou kunnen maken van die uittredingsmogelijkheid.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-V4
  - number: I-V5.1
    text: |-
      Voor de toepassing van de [artikelen 4, eerste lid][ref1], en
      [5 van het Tijdelijk Besluit ziekte en arbeidsongeschiktheid onderwijs-en onderzoekpersoneel][ref2] wordt,
      gedurende een termijn van de eerste 18 maanden van verhindering volgend op de kalendermaand waarin de verhindering
      is ontstaan, ten aanzien van de betrokkene die verlof op grond van dit hoofdstuk geniet, onder "betrekking"
      verstaan: het deel van zijn betrekkingsomvang waaruit geen verlof is verleend en wordt voor wat betreft het deel
      van zijn betrekkingsomvang waarvoor dat verlof is verleend onder "volle bezoldiging" en "bezoldiging" verstaan: de
      bezoldiging vastgesteld met toepassing van artikel I-V4.


      [ref1]: https://wetten.overheid.nl/BWBR0007800#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0007800#Artikel5
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-V5
    references:
      - id: ref1
        bwb_id: BWBR0007800
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0007800
        artikel: '5'
  - number: I-V5.2
    text: |-
      Voor de toepassing van
      __REF000___________________________________________________________________________________________________________
      ______ wordt na een termijn van 18 maanden van verhindering volgend op de kalendermaand waarin de verhindering is
      ontstaan, uitgegaan van de bezoldiging die voor de betrokkene zou gelden indien hem geen verlof op grond van dit
      hoofdstuk zou zijn verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0007800#Artikel4
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-V5
    references:
      - id: ref1
        bwb_id: BWBR0007800
        artikel: '4'
  - number: I-V5.3
    text: |-
      Voor de toepassing van de hoofdstukken I-F, I-K en I-L wordt uitgegaan van de bezoldiging die voor de betrokkene op
      grond van de hoofdstukken I-Q, I-R, I-S, V-Q, V-R en V-S zou gelden indien hem dat verlof niet zou zijn verleend.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-V5
  - number: I-V5.4
    text: |-
      Het derde lid is niet van toepassing op het aantal uren verlof waarover betrokkene op grond van artikel I-V4,
      tweede lid, geen bezoldiging ontvangt.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-V5
  - number: I-V6.1
    text: |-
      Het verlof op grond van dit hoofdstuk wordt in gehele of in halve werkdagen opgenomen, tenzij bevoegd gezag en
      betrokkene hierover afwijkende afspraken maken. Het tijdstip waarop het verlof op grond van dit hoofdstuk wordt
      genoten, wordt in overleg met betrokkene vastgesteld en vastgelegd in het voor de school geldende overzicht van
      onderwijstijd.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-V6
  - number: I-V6.2
    text: |-
      Teneinde voor een betrokkene als bedoeld in hoofdstuk I-Q of hoofdstuk I-R het verbruik van het verlof, bedoeld in
      dit hoofdstuk, te berekenen, wordt de verlofaanspraak uitgedrukt in lesgevende taken en wel door de in artikel I-
      V3, tweede lid, bedoelde verlofaanspraak vast te stellen op ten hoogste 104 uren en de verlofaanspraak, bedoeld
      in artikel I-V3, derde lid, op ten hoogste 208 uren. Vervolgens wordt voor elk dagdeel dat een in de eerste volzin
      bedoelde betrokkene verlof geniet op grond van dit hoofdstuk, de verlofaanspraak van betrokkene verminderd met het
      aantal uren dat op de betreffende dagdelen in de vier hoogste groepen wordt lesgegeven.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-V6
  - number: I-V6.3
    text: |-
      Teneinde voor een betrokkene als bedoeld in artikel I-S203 of artikel I-S303 het verbruik van het verlof, bedoeld
      in dit hoofdstuk, te berekenen, wordt de verlofaanspraak uitgedrukt in lesgebonden of behandeltaken en wel door
      de uitkomst van de formule van artikel I-V3, vierde lid, te vermenigvuldigen met 104 indien de betrokkene 52 jaar
      of ouder doch jonger is dan 56 jaar en met 208 indien de betrokkene 56 jaar of ouder is en vervolgens de uitkomst
      van deze vermenigvuldiging te delen door het bij de leeftijd van betrokkene behorende aantal uren op grond van
      de factor L in artikel I-V3, vierde lid. Vervolgens wordt voor elk dagdeel dat een in de eerste volzin bedoelde
      betrokkene verlof geniet op grond van dit hoofdstuk, de verlofaanspraak van betrokkene verminderd met het aantal
      uren dat op de betreffende dagdelen in de vier hoogste groepen wordt lesgegeven.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-V6
  - number: I-V6.4
    text: |-
      Voor een betrokkene als bedoeld in het tweede of derde lid die is benoemd in een betrekking met een omvang van
      minder dan een normbetrekking wordt het aantal lesgebonden of behandeltaken vastgesteld naar evenredigheid van de
      betrekkingsomvang en rekenkundig afgerond op gehele of halve uren.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-V6
  - number: I-V7
    text: |-
      Over de verrekening van extra inkomsten uit arbeid of bedrijf met de bezoldiging van de betrokkene zijn de
      artikelen 7 en 8 van de Wet uitkering wegens vrijwillig vervroegd uittreden van overeenkomstige toepassing, met
      dien verstande dat de verrekening van de extra inkomsten niet kan leiden tot een lager bedrag dan de bezoldiging
      van de betrokkene met een gelijke onvolledige werktijd.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-V7
  - number: I-V8.1
    text: |-
      De betrokkene kan het bevoegd gezag jaarlijks verzoeken met ingang van de eerste dag van het schooljaar de omvang
      van het verlof te wijzigen.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-V8
  - number: I-V8.2
    text: |-
      Het bevoegd gezag verleent geen toestemming voor wijziging van de omvang van het verlof,
      indien dit op enigerlei wijze direct of op termijn leidt tot uitkeringen krachtens het
      [Besluit Werkloosheid onderwijs- en onderzoekpersoneel][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006445
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-V8
    references:
      - id: ref1
        bwb_id: BWBR0006445
  - number: I-V9
    text: |-
      De betrokkene die krachtens artikel 3 van de Wetten doorstroming onderwijspersoneel (*Stb.* 1988, 253 en *Stb.*
      1989, 283) gedeeltelijk is uitgetreden, kan geen aanspraak op verlof op grond van dit hoofdstuk maken.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-V9
  - number: I-V10.1
    text: |-
      Betrokkene die van hoofdstuk I-V gebruik wenst te maken, dient hiertoe ten minste tien weken voor de gewenste
      ingangsdatum een schriftelijk verzoek in bij het bevoegd gezag van de instelling.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-V10
  - number: I-V10.2
    text: |-
      Indien de betrokkene kiest voor een ingangsdatum in de periode 1 mei tot en met 1 augustus, dient hij zijn verzoek
      uiterlijk op 1 maart daaraanvoorafgaand in.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-V10
  - number: I-V10.3
    text: |-
      Betrokkene die gebruik wenst te maken van de mogelijkheid, genoemd in artikel I-V3a, eerste lid, geeft bij zijn
      verzoek tevens aan in welke schooljaren hij het verlof wil opnemen alsmede het aantal uren verlof in het eerste
      schooljaar waarin het verlof zal worden genoten.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-V10
  - number: I-Z1.1
    text: |-
      Voorzover voor de toepassing van de artikelen I-B2, tweede lid, I-C31, tweede lid, I-C35, tweede lid, I-
      F4, eerste en tweede lid, I-M4, derde lid en I-P17 alsmede artikel 16, tweede lid van het Besluit ziekte en
      arbeidsongeschiktheid onderwijs- en onderzoekpersoneel een voorwaarde wordt gesteld die inhoudt: - toestemming,
      oordeel of goedkeuring van, dan wel
        - mededeling aan Onze minister, is deze voorwaarde niet van toepassing ten aanzien van de scholen, genoemd in
      artikel I-A1, onder *d*1 voorzover het betreft onderwijsondersteunend personeel en onder *d*2 voorzover het betreft
      onderwijsondersteunend personeel als bedoeld in artikel I-S301 onder *c*, sub 2, en evenmin van toepassing ten
      aanzien van de instellingen, genoemd in artikel I-A1 , onder *d*4, *d*5, *d*6, *d*10, *d*13 tot en met *d*15, *d*17
      en *d*18.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Z1
  - number: I-Z1.2
    text: |-
      De voorwaarde in artikel I-C29, eerste lid, onder *u*, inhoudend dat de instemming van Onze minister is vereist, is
      niet van toepassing ten aanzien van de instellingen genoemd in artikel I-A1, onder *d*6.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Z1
  - number: I-Z1.3
    text: |-
      Waar in de artikelen 15, eerste en tweede lid, 17, eerste lid, 18, eerste lid en 20, eerste lid van het Besluit
      ziekte en arbeidsongeschiktheid onderwijs en onderzoekpersoneel, aan Onze minister een bevoegdheid is toegekend,
      bestaat die bevoegdheid niet ten aanzien van de instellingen, genoemd in artikel I-A1, onder *d*1 voorzover het
      betreft onderwijsondersteunend personeel en onder *d*2 voorzover het betreft onderwijsondersteunend personeel als
      bedoeld in artikel I-S301 onder *c*, sub 2, en evenmin ten aanzien van de instellingen, genoemd in artikel I-A1,
      onder *d*4, *d*5, *d*6, *d* 10, *d*13 tot en met *d*15, *d*17 en *d*18.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Z1
  - number: I-Z1.4
    text: |-
      Waar in de artikelen I-C29, eerste lid onder *e*, I-D3, derde lid, alsmede de artikelen 6, eerste lid, 39, eerste
      lid, en 43 van het Besluit ziekte en arbeidsongeschiktheid onderwijs- en onderzoekpersoneel aan Onze minister
      een bevoegdheid is toegekend, wordt deze bevoegdheid, voor wat betreft de instellingen genoemd in artikel I-
      A1, onder *d*1 voorzover het betreft onderwijsondersteunend personeel en onder *d*2 voorzover het betreft
      onderwijsondersteunend personeel als bedoeld in artikel I-S301 onder *c*, sub 2, alsmede voor wat betreft de
      instellingen, genoemd in artikel I-A1, onder *d*4, *d*5, *d*6, *d*10, *d*13 tot en met *d*15, *d* 17 en *d*18
      toegekend aan het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Z1
  - number: I-Z1.5
    text: |-
      Ten aanzien van de instellingen, genoemd in artikel I-A1, onder *d*1 voorzover het betreft onderwijsondersteunend
      personeel en onder *d*2 voorzover het betreft onderwijsondersteunend personeel als bedoeld in artikel I-S301 onder
      *c*, sub 2, alsmede ten aanzien van de instellingen, genoemd in artikel I-A1, onder *d*4, *d* 5, *d*6, *d*10, *d*13
      tot en met *d*15, *d*17 en *d*18, is de bevoegdheid tot het verlenen van verlof, bedoeld in artikel I-C30, niet
      beperkt tot vier dagen per jaar.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Z1
  - number: I-Z1.6
    text: |-
      In artikel I-C29, eerste lid onder 1, wordt voor de woorden "Onze minister" ten aanzien van de instellingen genoemd
      in artikel I-A1, onder *d*1 voorzover het betreft onderwijsondersteunend personeel en onder *d*2 voorzover het
      betreft onderwijsondersteunend personeel als bedoeld in artikel I-S301 onder *c*, sub 2, alsmede ten aanzien van
      de instellingen, genoemd in artikel I-A1, onder *d*4, *d*5, *d*6, *d*10, *d*13 tot en met *d*15, *d*17 en *d*18
      gelezen: het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Z1
  - number: I-Z2
    text: |-
      Het bepaalde in artikel I-Z1 is niet van toepassing ten aanzien van de betrokkene, bedoeld in artikel I-Q1209,
      I-Q1409, I-Q1509, I-R1212, eerste lid, artikel I-R1212, derde lid, voor zover het betreft zijn benoeming in de
      formatie als bedoeld in artikel I-R1209, onder *b*, I-R1412, eerste lid, artikel I-R1412, derde lid, voor zover
      het betreft zijn benoeming in de formatie als bedoeld in artikel I-R1409 onder *b*, artikel I-R1512, eerste lid,
      artikel I-R1512, derde lid, voor zover het betreft zijn benoeming in de formatie als bedoeld in artikel I-R1509,
      onder *b*, I-S1214, eerste lid, artikel I-S1214, derde lid, voor zover het betreft zijn benoeming in de formatie
      als bedoeld in artikel I-S1211, onder *b*, I-S1414, eerste lid, I-S1414, derde lid, voor zover het betreft zijn
      benoeming in de formatie als bedoeld in artikel I-S1411, onder *b*, I-S1514, eerste lid, en I-S1514, derde lid,
      voor zover het betreft zijn benoeming in de formatie als bedoeld in artikel I-S1511, onder *b*.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Z2
  - number: II-A1.a
    text: |-
      betrokkene: de betrokkene, bedoeld in artikel I-A1, onder *e*1, *e*2, *e*4 tot en met *e*6, *e*12 tot en met *e*14,
      *e*17 en *e* 18 voor zover deze werkzaam is aan een instelling als bedoeld in artikel I-A1, onder *d*1, *d*2, *d*4,
      *d*5, *d*6 , *d*12 tot en met *d*14, *d*17 en *d*18 voor zover het een publiekrechtelijke instelling betreft;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-A1
  - number: II-A1.b
    text: |-
      "overurenbetrekking" een betrekking bij een bevoegd gezag aan een instelling voor openbaar onderwijs als bedoeld
      in artikel I-A1, onder *d*, die op grond van artikel I-P3, vijfde lid, geheel uit uren boven de normbetrekking
      bestaat.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-A1
  - number: II-A2
    text: Aanstelling geschiedt in vaste of in tijdelijke dienst.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-A2
  - number: II-A3
    text: Behoudens het bepaalde in artikel II-A4 geschiedt aanstelling in vaste dienst.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-A3
  - number: II-A4.1
    text: 'Aanstelling in tijdelijke dienst vindt plaats:'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-A4
  - number: II-A4.1.a
    text: |-
      van degene die tijdelijk afwezig personeel vervangt anders dan bedoeld onder *b* of *e*, behoudens het bepaalde in
      artikel II-A6;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-A4
  - number: II-A4.1.c
    text: van degene die met toepassing van artikel I-B2, eerste lid, dan wel artikel I-B3 wordt aangesteld;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-A4
  - number: II-A4.1.f
    text: |-
      van degene, die wordt aangesteld in verband met een tijdelijke voorziening in een vacature voor een termijn van
      maximaal 6 maanden, met dien verstande dat deze termijn in bijzondere gevallen eenmaal kan worden verlengd met ten
      hoogste 6 maanden.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-A4
  - number: II-A4.1.g
    text: |-
      ten aanzien van de betrokkene bedoeld in artikel I-A1 onder *e*1 en *e*2 die is aangesteld op grond van
      faciliteiten die door Onze minister ter beschikking zijn gesteld in het kader van het project "Werkgelegenheid
      Impuls Onderwijs" en waaraan door hem de uitdrukkelijke voorwaarde is verbonden dat de aanstelling in tijdelijke
      dienst dient plaats te vinden.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-A4
  - number: II-A4.2
    text: Aanstelling in tijdelijke dienst kan plaatsvinden
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-A4
  - number: II-A4.2.a
    text: |-
      indien een betrokkene uitsluitend is belast met het verrichten van werkzaamheden in het kader van
      contractactiviteiten, dan wel uitsluitend is belast met formatieruimte die is toegekend ten gevolge van het
      toekennen van formatieruimte in het kader van contractactiviteiten aan een andere leraar, behoudens het bepaalde in
      artikel II-A6, tweede lid, dan wel
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-A4
  - number: II-A4.2.b
    text: indien het bevoegd gezag een proeftijd als bedoeld in artikel II-A5 wenselijk acht.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-A4
  - number: II-A4.3
    text: |-
      Aanstelling in tijdelijke dienst op grond van het eerste lid onderdeel *b* tot en met *c* of het tweede lid
      geschiedt ten aanzien van de betrokkene, bedoeld in artikel I-A1, onder *e*1 en *e*2, voor ten hoogste één jaar.
      In bijzondere gevallen kan met toestemming van Onze minister van het bepaalde in de vorige volzin worden afgeweken.
      Aanstelling in tijdelijke dienst op grond van het eerste lid onderdeel *a* respectievelijk onderdeel *g* geschiedt
      ten aanzien van de betrokkene bedoeld in artikel I-A1 onder *e*1 en *e*2 telkens voor ten hoogste één jaar met dien
      verstande dat een aanstelling in tijdelijke dienst op grond van het eerste lid, onderdeel *g*, voor een periode van
      ten hoogste 4 jaar kan geschieden.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-A4
  - number: II-A4.4
    text: |-
      Aanstelling in tijdelijke dienst op grond van het eerste of tweede lid geschiedt ten aanzien van de betrokkene,
      bedoeld in artikel I-A1, onder *e*5, *e*6, *e*12 tot en met *e*14, *e*17 en *e*18, telkens voor ten hoogste één
      jaar.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-A4
  - number: II-A4.5
    text: |-
      Aan de betrokkene wordt ten minste drie maanden vóór het verstrijken van de termijn waarvoor het tijdelijk
      dienstverband werd aangegaan, schriftelijk meegedeeld of het bevoegd gezag het dienstverband al dan niet wenst
      voort te zetten, voor zover dit redelijkerwijs mogelijk is.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-A4
  - number: II-A5.1
    text: |-
      De duur van de proeftijd bedraagt ten aanzien van de betrokkene, bedoeld in artikel I-A1, onder *e*1 en *e*2, ten
      hoogste één jaar.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-A5
  - number: II-A5.2
    text: |-
      De duur van de proeftijd bedraagt ten aanzien van de betrokkene, bedoeld in artikel I-A1, onder *e*5, *e*6, *e*12
      tot en met *e*14, *e*17 en *e*18, in de regel ten hoogste één jaar, zonodig in bijzondere gevallen tot niet meer
      dan twee jaar te verlengen.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-A5
  - number: II-A5.3
    text: |-
      Ten aanzien van de betrokkene, bedoeld in artikel I-A1, onder *e*5, *e*6, *e*12 tot en met *e*14, *e*17 en *e*18,
      kan de proeftijd zonodig door het bevoegd gezag worden verlengd met de tijd die de betrokkene niet in werkelijke
      dienst aan de instelling heeft doorgebracht.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-A5
  - number: II-A5.4
    text: Het bevoegd gezag deelt de betrokkene tijdig voor het einde van de proeftijd het oordeel hierover mee.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-A5
  - number: II-A5.5
    text: 'Een proeftijd kan achterwege blijven:'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-A5
  - number: II-A5.5.a
    text: indien de betrokkene reeds in vaste dienst bij het onderwijs werkzaam is in een overeenkomstige functie;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-A5
  - number: II-A5.5.b
    text: |-
      indien het dienstverband van de betrokkene wordt voortgezet, nadat zijn tijdelijk dienstverband op grond van het
      bepaalde in artikel II-A4, eerste lid, is geëindigd;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-A5
  - number: II-A5.5.c
    text: in andere daarvoor naar het oordeel van het bevoegd gezag in aanmerking komende gevallen.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-A5
  - number: II-A6.1
    text: |-
      Ten aanzien van de betrokkene, bedoeld in artikel I-A1, onder *e*5, *e*6, *e*12 tot en met *e*14, *e*17 en
      *e*18, kan in het geval, bedoeld in artikel II-A4, eerste lid onder *a*, voor zover het betreft de vervanging van
      eenzelfde personeelslid, aanstelling in tijdelijke dienst na 5 jaar ononderbroken dienst aan dezelfde instelling of
      instellingen gevolgd worden door een aanstelling in vaste dienst.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-A6
  - number: II-A6.2
    text: |-
      Indien de aanstelling van een betrokkene, bedoeld in artikel II-A4, tweede lid onder *a*, na een ononderbroken
      tijdelijke aanstelling van 3 jaar aan de instelling of instellingen wordt voortgezet, dient aanstelling in vaste
      dienst plaats te vinden.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-A6
  - number: II-A6.3
    text: |-
      Indien de betrekkingsomvang van een betrokkene gedurende een aaneengesloten periode van 3 jaar tijdelijk is
      uitgebreid in verband met het verrichten van werkzaamheden in het kader van contractactiviteiten wordt, indien
      hem die werkzaamheden ook in het vierde jaar worden opgedragen, met ingang van het vierde jaar een nieuwe
      betrekkingsomvang vastgesteld die gelijk is aan de oorspronkelijke betrekkingsomvang vermeerderd met het kleinste
      deel van de formatieruimte waarmee de oorspronkelijke betrekkingsomvang gedurende 3 aaneengesloten jaren tijdelijk
      is uitgebreid en voorzover die formatieruimte in het vierde jaar beschikbaar is.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-A6
  - number: II-A6.4
    text: |-
      Het bepaalde in het tweede en derde lid is van overeenkomstige toepassing ten aanzien van de leraar die tijdelijk
      is benoemd of wiens betrekkingsomvang tijdelijk is uitgebreid op grond van formatie-eenheden die zijn toegekend ten
      gevolge van het toekennen van formatie-eenheden in het kader van contractactiviteiten aan een andere leraar.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-A6
  - number: II-A8.1
    text: |-
      Het bevoegd gezag verstrekt aan de betrokkene zo mogelijk voor de indiensttreding, doch in elk geval uiterlijk
      vier weken na indiensttreding, kosteloos een gedagtekende akte van aanstelling, hieronder begrepen het besluit tot
      verlenging van een aanstelling dan wel heraanstelling in tijdelijke dienst. In het geval uitreiking van de akte
      van aanstelling voor de indiensttreding niet heeft plaatsgevonden, ontvangt de betrokkene voor de indiensttreding
      kosteloos een schriftelijke mededeling van het voornemen om tot aanstelling over te gaan.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-A8
  - number: II-A8.2
    text: |-
      De akte van aanstelling van de betrokkene die bij een bevoegd gezag is aangesteld aan een instelling als bedoeld in
      artikel I-A1, onder *d*5, *d*6, *d*12 tot en met *d*14, *d*17 en *d*18, vermeldt ten minste:
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-A8
  - number: II-A8.2.a
    text: de naam en het adres van het bevoegd gezag;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-A8
  - number: II-A8.2.b
    text: de naam, de voornamen en de geboortedatum van de betrokkene;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-A8
  - number: II-A8.2.c
    text: de datum van ingang van de aanstelling;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-A8
  - number: II-A8.2.d
    text: de functie waarin de betrokkene wordt aangesteld;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-A8
  - number: II-A8.2.e
    text: |-
      de bepaling of de aanstelling in vaste of in tijdelijke dienst geschiedt en in het laatste geval tevens de gronden
      voor en de duur van de aanstelling;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-A8
  - number: II-A8.2.f
    text: de aard en zo mogelijk het niveau en de omvang van de betrekking bij de aanvang daarvan;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-A8
  - number: II-A8.2.g
    text: het feit dat dit besluit van toepassing is;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-A8
  - number: II-A8.2.h
    text: de op de dag van zijn aanstelling van toepassing zijnde schaal en het salarisnummer;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-A8
  - number: II-A8.2.i
    text: de instelling of instellingen waaraan de betrokkene werkzaam zal zijn;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-A8
  - number: II-A8.2.j
    text: |-
      in voorkomende gevallen, overeenkomstig de ter zake van verplaatsingskosten geldende bepalingen de verplichting te
      wonen in een bepaalde gemeente, in een bepaald deel daarvan, in een bepaalde bij de instelling behorende woning of
      in het internaat van de instelling;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-A8
  - number: II-A8.2.k
    text: de van toepassing zijnde afvloeiingsregeling;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-A8
  - number: II-A8.2.l
    text: in voorkomende gevallen bijzondere bepalingen die van toepassing zijn.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-A8
  - number: II-A8.3
    text: |-
      Het bepaalde in het tweede lid, onder *g*, *j*, en *l*, geldt eveneens in geval van aanstelling van de betrokkene
      bij een bevoegd gezag aan een instelling als bedoeld in artikel I-A1 , onder *d*1 en *d*2.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-A8
  - number: II-A8.4
    text: Het bevoegd gezag deelt wijzigingen van de inhoud van de akte van aanstelling schriftelijk aan de betrokkene mee.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-A8
  - number: II-A8.5
    text: Onze minister kan omtrent de inhoud van de akte van aanstelling nadere voorschriften vaststellen.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-A8
  - number: II-A8.6
    text: De betrokkene voor wie een instructie is vastgesteld, ontvangt tevens een afschrift daarvan.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-A8
  - number: II-A8.7
    text: |-
      Aan de betrokkene wordt bij het overleg inzake zijn eventuele aanstelling tijdig een model van de akte van
      aanstelling waarin de eventuele bijzondere bepalingen, bedoeld in het tweede lid onder *l*, zijn opgenomen, ter
      beschikking gesteld alsmede een model van de instructie voor zover deze voor hem zal gaan gelden.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-A8
  - number: II-A8.8
    text: |-
      Indien het bevoegd gezag zulks wenst, geeft de betrokkene een ondertekende verklaring af, dat hij de in het eerste,
      zesde en zevende lid bedoelde bescheiden heeft ontvangen.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-A8
  - number: II-A8.9
    text: |-
      Wanneer de werkzaamheden feitelijk zijn aangevangen, worden de volledige en juiste gegevens met betrekking tot het
      niveau en omvang van de betrekking in de akte van aanstelling aangetekend, indien deze ingevolge het eerste lid
      is uitgereikt.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-A8
  - number: II-B1.1
    text: |-
      Schorsing is iedere tijdelijke ontheffing van de gehele of gedeeltelijke uitoefening van de functie van een
      betrokkene onder welke benaming dan ook op andere gronden dan wegens verlof bedoeld in de hoofdstukken I-C, I-D
      of op grond van het bepaalde in het Besluit ziekte en arbeidsongeschiktheid onderwijs- en onderzoekpersoneel van
      dit besluit.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-B1
  - number: II-B1.2
    text: Schorsing geschiedt van rechtswege dan wel door het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-B1
  - number: II-B1.3
    text: |-
      Tijdens de schorsing heeft de betrokkene slechts toegang tot de instelling na verkregen toestemming van het bevoegd
      gezag. Deze toestemming is niet vereist in het geval dat de betrokkene dit besluit wenst in te zien, tenzij dit
      besluit door het bevoegd gezag elders op een voor de betrokkene redelijkerwijs bereikbare plaats ter inzage is
      gelegd.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-B1
  - number: II-B2
    text: 'Van rechtswege is geschorst de betrokkene:'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-B2
  - number: II-B2.a
    text: |-
      die krachtens een wettelijke maatregel van zijn vrijheid is beroofd, tenzij de vrijheidsbeneming het gevolg is van
      een maatregel, anders dan op grond van de [Wet bijzondere opnemingen in psychiatrische ziekenhuizen][ref1], genomen
      in het belang van de volksgezondheid;


      [ref1]: https://wetten.overheid.nl/BWBR0005700
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-B2
    references:
      - id: ref1
        bwb_id: BWBR0005700
  - number: II-B2.b
    text: |-
      die krachtens een rechterlijke uitspraak die nog niet onherroepelijk is geworden van het geven van onderwijs is
      uitgesloten.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-B2
  - number: II-B3.1
    text: 'Het bevoegd gezag kan de betrokkene schorsen:'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-B3
  - number: II-B3.1.a
    text: |-
      in gevallen waarin het belang van de instelling dit vereist, voor ten hoogste drie maanden met dien verstande dat
      deze termijn in bijzondere gevallen eenmaal kan worden verlengd met ten hoogste drie maanden;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-B3
  - number: II-B3.1.b
    text: |-
      in dringende bijzondere gevallen indien dit in het belang van de instelling noodzakelijk voorkomt, als voorlopige
      maatregel voor ten hoogste één week, met dien verstande dat deze termijn uitsluitend in het geval dat het bevoegd
      gezag tegelijk met de ingang van deze schorsing de betrokkene in kennis heeft gesteld van het voornemen hem te
      schorsen op grond van het bepaalde onder *a*, kan worden verlengd met ten hoogste drie weken.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-B3
  - number: II-B3.2
    text: |-
      In het geval dat de in het eerste lid onder *b*, bedoelde schorsing wordt verlengd, wordt de duur van deze
      verlengde schorsing in mindering gebracht op de termijn van de daarop op grond van het eerste lid onder *a*,
      volgende schorsing.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-B3
  - number: II-B4.1
    text: |-
      Betrokkene brengt, indien gewenst, binnen drie weken, nadat hij door het bevoegd gezag schriftelijk van het
      voornemen tot schorsing, bedoeld in artikel II-B3, onder *a* in kennis is gesteld, zijn zienswijze schriftelijk of
      mondeling naar voren.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-B4
  - number: II-B4.2
    text: |-
      Betrokkene brengt, indien, gewenst, onmiddellijk nadat hij door het bevoegd gezag schriftelijk van de maatregel tot
      schorsing, bedoeld in artikel II B-3, onder *b*, in kennis is gesteld, zijn zienswijze schriftelijk of mondeling
      naar voren.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-B4
  - number: II-B4.3
    text: |-
      Indien betrokkene mondeling zijn zienswijze kenbaar maakt wordt hiervan door het bevoegd gezag een verslag gemaakt.
      Dit verslag wordt getekend door het bevoegd gezag en door betrokkene. Weigert de betrokkene de ondertekening, dan
      wordt daarvan, zo mogelijk met vermelding van de redenen, melding gemaakt. Een afschrift van het verslag wordt aan
      betrokkene uitgereikt.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-B4
  - number: II-B4.4
    text: |-
      Het besluit tot schorsing, bedoeld in artikel II-B3, onder *a*, wordt uiterlijk binnen een week nadat betrokkene
      zijn zienswijze heeft kenbaar gemaakt, genomen.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-B4
  - number: II-B4.5
    text: |-
      Het besluit tot schorsing, bedoeld in artikel II-B3, onder *b*, wordt onverwijld doch uiterlijk de tweede dag
      nadat betrokkene zijn zienswijze heeft kenbaar gemaakt, genomen. Het bevoegd gezag kan betrokkene de toegang tot de
      school ontzeggen voor zolang het besluit nog niet te zijner kennis is gebracht.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-B4
  - number: II-B4.6
    text: |-
      Van het intreden van een schorsing van rechtswege stelt het bevoegd gezag de betrokkene onverwijld doch uiterlijk
      binnen twee dagen in kennis.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-B4
  - number: II-B5
    text: De schorsing, bedoeld in artikel II-B3, kan door het bevoegd gezag te allen tijde worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-B5
  - number: II-C1
    text: |-
      De betrokkene die de hem opgelegde verplichtingen niet nakomt of enig voorschrift overtreedt, dan wel datgene doet
      of nalaat dat hij bij een goede uitoefening van zijn functie in gelijke omstandigheden behoort na te laten of te
      doen, maakt zich schuldig aan plichtsverzuim en kan om die reden door het bevoegd gezag met inachtneming van de
      artikelen II-C2 tot en met II-C6 disciplinair worden gestraft.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-C1
  - number: II-C2.1
    text: 'De disciplinaire straffen of maatregelen zijn:'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-C2
  - number: II-C2.1.a
    text: schriftelijke berisping;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-C2
  - number: II-C2.1.b
    text: verplaatsing naar een andere instelling onder hetzelfde bevoegd gezag met al dan niet gevolgen voor de bezoldiging;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-C2
  - number: II-C2.1.c
    text: inhouding van bezoldiging volgens het bepaalde in artikel II-C3, eerste lid;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-C2
  - number: II-C2.1.d
    text: schorsing voor maximaal 6 maanden;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-C2
  - number: II-C2.1.e
    text: ontslag.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-C2
  - number: II-C2.2
    text: |-
      Met uitzondering van de in het eerste lid onder *c* en *d*, bedoelde straffen, welke naast elkaar kunnen worden
      opgelegd, kan het bevoegd gezag ter zake van één en hetzelfde feit slechts één disciplinaire straf of maatregel
      opleggen.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-C2
  - number: II-C2.3
    text: |-
      Bij het opleggen van een straf of maatregel kan worden bepaald dat zij eerst ten uitvoer zal worden gelegd indien
      de betrokkene zich gedurende een vast te stellen termijn schuldig maakt aan soortgelijk plichtsverzuim als waarvoor
      de bestraffing plaatsvindt, dan wel zich niet houdt aan bij het opleggen van de straf eventueel gestelde bijzondere
      voorschriften.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-C2
  - number: II-C3.1
    text: |-
      Inhouding van bezoldiging als zelfstandige disciplinaire straf of maatregel op grond van artikel II-C2, eerste lid
      onder *c*, kan geschieden tot een bedrag van ten hoogste de bezoldiging over een halve maand.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-C3
  - number: II-C3.2
    text: |-
      Inhouding van bezoldiging als disciplinaire straf of maatregel opgelegd naast de in artikel II-C2, eerste lid onder
      *d*, genoemde schorsing, kan geheel of gedeeltelijk geschieden voor ten hoogste de duur van de schorsing.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-C3
  - number: II-C3.3
    text: |-
      De ingehouden bezoldiging wordt alsnog uitbetaald, indien door de rechter geen straf wordt opgelegd of het besluit
      wordt vernietigd, alsmede voor zover op andere andere gronden alsnog tot uitbetaling wordt besloten. Op de aldus
      uit te keren bezoldiging worden in mindering gebracht de inkomsten, welke de betrokkene sedert de schorsing bedoeld
      in het tweede lid heeft genoten uit arbeid die hij als gevolg van de schorsing heeft kunnen verrichten, tenzij
      zulks naar het oordeel van het bevoegd gezag onredelijk of onbillijk is.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-C3
  - number: II-C3.4
    text: |-
      Van de inhouding en de uitbetaling van de bezoldiging als bedoeld in dit artikel doet het bevoegd gezag terstond
      mededeling aan Onze minister.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-C3
  - number: II-C4.1
    text: |-
      Betrokkene brengt, indien gewenst, binnen drie weken, nadat hij door het bevoegd gezag schriftelijk van het
      voornemen tot het opleggen van een disciplinaire straf of maatregel in kennis is gesteld, zijn zienswijze
      schriftelijk of mondeling naar voren.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-C4
  - number: II-C4.2
    text: |-
      Indien betrokkene mondeling zijn zienswijze kenbaar maakt wordt hiervan door het bevoegd gezag een verslag gemaakt.
      Dit verslag wordt getekend door het bevoegd gezag en door betrokkene. Weigert de betrokkene de ondertekening, dan
      wordt daarvan, zo mogelijk met vermelding van de redenen, melding gemaakt. Een afschrift van het verslag wordt aan
      betrokkene uitgereikt.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-C4
  - number: II-C4.3
    text: |-
      Het besluit tot het opleggen van een disciplinaire straf of maatregel wordt uiterlijk een week, nadat betrokkene
      zijn zienswijze kenbaar heeft gemaakt, genomen.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-C4
  - number: II-C5
    text: |-
      Het recht tot het opleggen van een disciplinaire straf of maatregel vervalt, indien meer dan 9 maanden zijn
      verlopen na het tijdstip waarop het plichtsverzuim aan het bevoegd gezag bekend is geworden.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-C5
  - number: II-C6
    text: |-
      De straf of maatregel, behalve die van schriftelijke berisping, wordt niet ten uitvoer gelegd zolang zij niet
      onherroepelijk is geworden, tenzij bij de strafoplegging onmiddellijke tenuitvoerlegging is bevolen.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-C6
  - number: II-D1
    text: |-
      Beëindiging van het dienstverband geschiedt door het bevoegd gezag al dan niet op verzoek van de betrokkene dan wel
      van rechtswege.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-D1
  - number: II-D2.1
    text: Het bevoegd gezag beëindigt het dienstverband van de betrokkene op diens schriftelijk verzoek.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-D2
  - number: II-D2.2
    text: |-
      Het bevoegd gezag behoeft dit verzoek niet in te willigen, indien een strafrechtelijke vervolging ter zake van
      misdrijf tegen de betrokkene is ingesteld of indien het overweegt de disciplinaire straf van ontslag op te leggen.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-D2
  - number: II-D2.3
    text: |-
      Het bevoegd gezag beëindigt het dienstverband van de betrokkene die zulks heeft verzocht met het oog op een
      uitkering op grond van de Regeling flexibel pensioen en uittreden, bedoeld in artikel 3 van de Centrale vut-
      overeenkomst overheids- en onderwijspersoneel en artikel 1.5 van het pensioenreglement, indien het bestuur
      van de Stichting fonds vrijwillig vervroegd uittreden overheidspersoneel alsmede het bestuur van de Stichting
      Pensioenfonds ABP op grond van een desbetreffende aanvraag hebben vastgesteld dat na beëindiging van het
      dienstverband recht bestaat op een uitkering. Het dienstverband wordt niet eerder beëindigd dan met ingang van de
      dag waarop het recht op genoemde uitkering ontstaat.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-D2
  - number: II-D2.4
    text: |-
      Op verzoek van de betrokkene kan de in het derde lid genoemde beëindiging van het dienstverband ook voor een
      gedeelte van de voor hem geldende betrekkingsomvang worden verleend, tenzij de belangen van de dienst zich
      hiertegen verzetten. Het gedeelte van de betrekkingsomvang waarvoor beëindiging van het dienstverband wordt
      gevraagd, bedraagt ten minste 10% van de betrekkingsomvang. Beëindiging van het dienstverband voor een gedeelte
      van een betrekkingsomvang uit een betrekking waaruit reeds eerder gedeeltelijke beëindiging met het oog op
      de in het derde lid bedoelde uitkering heeft plaatsgevonden, bedraagt ten minste 10% van de oorspronkelijke
      betrekkingsomvang.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-D2
  - number: II-D3.1
    text: 'Het bevoegd gezag beëindigt het dienstverband van de betrokkene op grond van:'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-D3
  - number: II-D3.1.a
    text: |-
      opheffing van de instelling of de betrekking of zodanige verandering in de inrichting van het onderwijs of de
      dienst van de instelling dat zijn werkzaamheden overbodig zullen worden;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-D3
  - number: II-D3.1.b
    text: |-
      het bereiken van de pensioengerechtigde leeftijd, onverminderd het bepaalde in artikel II-D5, vijfde lid, en
      artikel II-D6, derde lid;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-D3
  - number: II-D3.1.c
    text: |-
      het geraken in een toestand van ongeschiktheid ten gevolge van lichamelijke of psychische oorzaken, zulks met
      inachtneming van de bepalingen in artikel 20 van het Besluit ziekte en arbeidsongeschiktheid onderwijs- en
      onderzoekpersoneel, onverminderd het bepaalde in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-D3
  - number: II-D3.2
    text: 'Het bevoegd gezag kan het dienstverband van de betrokkene beëindigen:'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-D3
  - number: II-D3.2.a
    text: |-
      wanneer hij in ernstige mate onbekwaam of ongeschikt blijkt te zijn voor de beklede betrekking anders dan in de
      gevallen bedoeld in het eerste lid onder *c*;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-D3
  - number: II-D3.2.b
    text: bij wijze van disciplinaire straf of maatregel in de gevallen en op de wijze als omschreven in hoofdstuk II-C;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-D3
  - number: II-D3.2.c
    text: indien de betrokkene bij onherroepelijk geworden vonnis is veroordeeld tot vrijheidsstraf wegens misdrijf;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-D3
  - number: II-D3.2.d
    text: |-
      indien hij in verband met aanstelling of keuring opzettelijk onjuiste of onvolledige inlichtingen heeft verstrekt,
      zonder welke handelwijze niet tot benoeming of geschiktverklaring zou zijn overgegaan, tenzij meer dan 6 maanden
      zijn verstreken sinds de vaststelling van dit feit;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-D3
  - number: II-D3.2.e
    text: |-
      indien ten aanzien van de overurenbetrekking van de betrokkene als bedoeld in artikel I-A1, onder *e*10 is komen
      vast te staan dat in redelijkheid de overuren aan een andere betrokkene binnen een normbetrekking kunnen worden
      opgedragen;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-D3
  - number: II-D3.2.f
    text: op grond van andere met name genoemde en aan de betrokkene schriftelijk meegedeelde redenen van gewichtige aard.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-D3
  - number: II-D3.3
    text: |-
      Indien het dienstverband van de betrokkene, bedoeld in artikel I-A1, onder *e*1, *e*2, *e*5 *e*10, *e*12, *e*14,
      *e*17 en *e*18, wordt beëindigd op grond van de gevallen genoemd in het tweede lid onder *a* en *f*, wordt de
      inspectie gehoord.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-D3
  - number: II-D4
    text: 'Het dienstverband van de betrokkene eindigt van rechtswege:'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-D4
  - number: II-D4.a
    text: door het verstrijken van de tijd waarvoor het blijkens de akte van aanstelling is aangegaan;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-D4
  - number: II-D4.b
    text: indien de betrokkene krachtens onherroepelijke rechterlijke uitspraak van het geven van onderwijs is uitgesloten;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-D4
  - number: II-D5.1
    text: 'Bij tussentijdse beëindiging van een tijdelijk dienstverband bedraagt de termijn van opzegging:'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-D5
  - number: II-D5.1.a
    text: één maand indien het dienstverband ten tijde van de opzegging korter dan 6 maanden onafgebroken heeft bestaan;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-D5
  - number: II-D5.1.b
    text: |-
      twee maanden indien het dienstverband ten tijde van de opzegging ten minste 6 maanden doch korter dan 12 maanden
      onafgebroken heeft bestaan;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-D5
  - number: II-D5.1.c
    text: |-
      drie maanden indien het dienstverband ten tijde van de opzegging ten minste twaalf maanden onafgebroken heeft
      bestaan.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-D5
  - number: II-D5.2
    text: |-
      In het geval, bedoeld in artikel II-D2, eerste lid, zijn de opzeggingstermijnen, bedoeld in het eerste lid, van
      overeenkomstige toepassing, onverminderd het bepaalde in artikel II-D7.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-D5
  - number: II-D5.3
    text: |-
      Opzegging als bedoeld in het eerste lid kan niet geschieden gedurende de zwangerschap van de vrouwelijke
      betrokkene, noch gedurende het zwangerschaps- en bevallingsverlof bedoeld in artikel 9, eerste lid van het Besluit
      ziekte en arbeidsongeschiktheid onderwijs- en onderzoekpersoneel, noch, indien zij haar dienst heeft hervat,
      gedurende een periode van zes weken volgend op dat verlof. Het bevoegd gezag kan ter staving van de zwangerschap
      een verklaring van een arts of van een verloskundige verlangen.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-D5
  - number: II-D5.4
    text: |-
      Opzegging als bedoeld in het eerste lid kan niet plaats vinden wegens het feit dat de betrokkene door een
      centrale als bedoeld in [artikel 1, onder ][ref1] of door een daarbij aangesloten vereniging is aangewezen om
      bestuurlijke of vertegenwoordigende activiteiten te ontplooien binnen zijn centrale of een daarbij aangesloten
      vereniging c.q. binnen de organisatie van de werkgever, die er toe strekken de doelstellingen van zijn centrale van
      overheidspersoneel en de daarbij aangesloten verenigingen te ondersteunen.


      [ref1]: https://wetten.overheid.nl/BWBR0006446#Artikel1
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-D5
    references:
      - id: ref1
        bwb_id: BWBR0006446
        artikel: '1'
  - number: II-D5.5
    text: |-
      In het geval, bedoeld in artikel II-D3, eerste lid onder b, eindigt het dienstverband op de laatste dag van
      de maand waarin de pensioengerechtigde leeftijd werd bereikt, tenzij in overeenstemming met de betrokkene de
      ontslagdatum naar een later tijdstip wordt verschoven.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-D5
  - number: II-D5.6
    text: |-
      In de gevallen bedoeld in artikel II-D3, tweede lid, kan het dienstverband eerst worden beëindigd met ingang van de
      dag, volgende op die, waarop de reden van het ontslag voor het eerst aanwezig was.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-D5
  - number: II-D5.7
    text: |-
      In het geval de betrokkene blijkens het doorlopen van de procedure, bedoeld in artikel 20 van het Besluit ziekte
      en arbeidsongeschiktheid onderwijs- en onderzoekpersoneel, blijvend ongeschikt is verklaard voor de vervulling
      van zijn functie, eindigt het dienstverband niet eerder dan op de dag waarop het ontslagbesluit hem ter kennis
      is gesteld.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-D5
  - number: II-D6.1
    text: |-
      In het geval, bedoeld in artikel II-D2, eerste en derde lid, bedraagt de opzeggingstermijn drie maanden,
      onverminderd het bepaalde in artikel II-D7.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-D6
  - number: II-D6.2
    text: |-
      Bij beëindiging van het dienstverband op grond van artikel II-D3, eerste lid onder *a*, en artikel II-D3, tweede
      lid onder *e*, bedraagt de opzeggingstermijn 3 maanden.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-D6
  - number: II-D6.3
    text: |-
      In het geval, bedoeld in artikel II-D3, eerste lid onder b, eindigt het dienstverband op de laatste dag van
      de maand waarin de pensioengerechtigde leeftijd werd bereikt, tenzij in overeenstemming met de betrokkene de
      ontslagdatum naar een later tijdstip wordt verschoven.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-D6
  - number: II-D6.4
    text: |-
      In de gevallen, bedoeld in artikel II-D3, tweede lid, kan het dienstverband eerst worden beëindigd met ingang van
      de dag, volgende op die, waarop de reden van het ontslag voor het eerst aanwezig was.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-D6
  - number: II-D6.5
    text: |-
      In het geval de betrokkene blijkens het doorlopen van de procedure, bedoeld
      in[ artikel 20 van het Besluit ziekte en arbeidsongeschiktheid onderwijs- en onderzoekpersoneel][ref1], blijvend
      ongeschikt is verklaard voor de vervulling van zijn functie, eindigt het dienstverband niet eerder dan op de dag
      waarop het ontslagbesluit hem ter kennis is gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007800#Artikel20
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-D6
    references:
      - id: ref1
        bwb_id: BWBR0007800
        artikel: '20'
  - number: II-D7
    text: |-
      In het geval, bedoeld in artikel II-D2, eerste lid, kan van de voor de beëindiging van het dienstverband in de
      artikelen II-D5, eerste lid, en II-D6, eerste lid, geldende opzeggingstermijnen worden afgeweken:
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-D7
  - number: II-D7.a
    text: indien wordt overwogen de betrokkene een disciplinaire straf op te leggen;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-D7
  - number: II-D7.b
    text: |-
      indien het belang van het onderwijs zulks vordert, met dien verstande, dat de termijn van drie maanden tot
      ten hoogste zes maanden kan worden verlengd en met niet meer dan twee maanden kan worden bekort en dat bij een
      afwijking in redelijkheid met het belang van de betrokkene rekening wordt gehouden;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-D7
  - number: II-D7.c
    text: op verzoek van de betrokkene.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-D7
  - number: II-D8.1
    text: |-
      Over de tijd die aan de in artikel II-D5 en artikel II-D6 bedoelde opzeggingstermijnen bij beëindiging van het
      dienstverband niet op verzoek mocht ontbreken, heeft de betrokkene recht op doorbetaling van de bezoldiging.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-D8
  - number: II-D8.2
    text: 'De aanspraak op bezoldiging vervalt geheel of gedeeltelijk met ingang van de dag waarop de betrokkene:'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-D8
  - number: II-D8.2.a
    text: gedurende de opzeggingstermijn uit eigen beweging de dienst verlaat;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-D8
  - number: II-D8.2.b
    text: |-
      gedurende de opzeggingstermijn een andere betrekking gaat bekleden, tenzij en voor zover deze betrekking samenvalt
      met een hem nog toekomend vakantieverlof.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-D8
  - number: II-D9.1
    text: Het dienstverband kan worden beëindigd onder de kwalificatie eervol dan wel zonder nadere kwalificatie.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-D9
  - number: II-D9.2
    text: |-
      In de gevallen, bedoeld in de de artikelen II-D2, eerste lid, II-D3, eerste lid en tweede lid onder *a*, en II-
      D4 onder *a*, wordt het dienstverband steeds onder de kwalificatie eervol beëindigd, tenzij de beëindiging van het
      dienstverband aan eigen schuld of toedoen is te wijten.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-D9
  - number: II-D10.1
    text: |-
      Betrokkene brengt, indien gewenst, binnen drie weken, nadat hij door het bevoegd gezag schriftelijk van het
      voornemen tot beëindiging van het dienstverband, anders dan op grond van de omstandigheid, bedoeld in artikel II-
      D3, eerste lid, onder *b*, in kennis is gesteld, zijn zienswijze schriftelijk of mondeling naar voren.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-D10
  - number: II-D10.2
    text: |-
      Indien betrokkene mondeling zijn zienswijze kenbaar maakt wordt hiervan door het bevoegd gezag een verslag gemaakt.
      Dit verslag wordt getekend door het bevoegd gezag en door betrokkene. Weigert de betrokkene de ondertekening, dan
      wordt daarvan, zo mogelijk met vermelding van de redenen, melding gemaakt. Een afschrift van het verslag wordt aan
      betrokkene uitgereikt.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-D10
  - number: II-D10.3
    text: |-
      Het besluit tot beëindiging van het dienstverband wordt uiterlijk een week, nadat betrokkene zijn zienswijze
      kenbaar heeft gemaakt, genomen.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-D10
  - number: II-D10.4
    text: |-
      Van een beëindiging van het dienstverband van rechtswege stelt het bevoegd gezag de betrokkene zo spoedig mogelijk
      in kennis.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelII-D10
  - number: III-A1
    text: 'In dit hoofdstuk wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIII-A1
  - number: III-A1.a
    text: |-
      commissie b.o.: commissie van beroep, bedoeld in [artikel 62, vijfde lid, van de Wet op het primair onderwijs][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel62
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIII-A1
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '62'
  - number: III-A1.b
    text: |-
      commissie s.o. en v.s.o.: commissie van beroep, bedoeld in
      [artikel 65, vijfde lid, van de Wet op de expertisecentra][ref1] of
      [artikel 183, vijfde lid, van de Wet op het voortgezet onderwijs][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel65
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel183
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIII-A1
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '65'
      - id: ref2
        bwb_id: BWBR0002399
        artikel: '183'
  - number: III-A1.c
    text: |-
      commissie vo/bbo: commissie van beroep, bedoeld in [artikel 53 van de Wet op het voortgezet onderwijs][ref1] en
      artikel 2.50 van de Wet op het Cursorisch beroepsonderwijs, alsmede ten behoeve van de betrokkene, bedoeld in
      artikel I-A1, onder *e*10, *e*14, *e*15 en *e*17;


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel53
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIII-A1
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '53'
  - number: III-A1.d
    text: |-
      commissie landelijke organen: commissie van beroep bedoeld in artikel 2.57 van de Wet op het cursorisch
      beroepsonderwijs
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIII-A1
  - number: III-A1.e
    text: 'commissie v.j.: commissie van beroep, bedoeld in artikel 7 van het Besluit vormingswerk voor jeugdigen;'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIII-A1
  - number: III-A1.f
    text: |-
      commissie basiseducatie en ondersteuning VE: commissie van beroep, bedoeld in artikel 11 van de Kaderwet
      volwasseneneducatie 1991;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIII-A1
  - number: III-A1.g
    text: 'commissie w.o.v.: commissie van beroep, bedoeld in artikel 64 van de Wet op de onderwijsverzorging;'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIII-A1
  - number: III-A1.h
    text: 'commissie: de commissie van beroep, bedoeld onder *a* tot en met *h*.'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIII-A1
  - number: III-A2.1
    text: |-
      Een commissie b.o., s.o. en v.s.o., vo/bbo, v.j., landelijke organen, basiseducatie en ondersteuning VE en w.o.v.
      wordt ingesteld door de besturen van de bijzondere instellingen waarover zij haar werkkring zal uitstrekken. De
      commissie v.j. strekt haar werkkring uit over alle bij deze organisatie aangesloten instellingen, met uitzondering
      van de vormingsinstituten waarvan het bevoegd gezag zich heeft aangesloten bij een commissie vo/bbo.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIII-A2
  - number: III-A2.2
    text: De commissie deelt Onze minister mee, welke instellingen bij haar zijn aangesloten.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIII-A2
  - number: III-A3.1
    text: |-
      Met inachtneming van de in het tweede tot en met het zesde lid van dit artikel neergelegde voorschriften geschiedt
      de verkiezing van de commissie aan de hand van een door de besturen van de instellingen dan wel, indien het betreft
      een commissie v.j., het bestuur van een landelijke organisatie op te stellen verkiezingsregeling.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIII-A3
  - number: III-A3.2
    text: |-
      De commissie bestaat uit 5 leden en 5 plaatsvervangende leden, waarvan 2 leden en 2 plaatsvervangende leden,
      en ingeval het betreft een commissie v.j. op voordracht van een landelijke organisatie, worden gekozen door de
      instellingsbesturen, en 2 leden en 2 plaatsvervangende leden door het personeel van de bij de commissie aangesloten
      instellingen. De 2 leden gekozen door de instellingsbesturen en de 2 leden gekozen door het personeel van de
      instelling kiezen gezamenlijk het vijfde lid, tevens voorzitter, en zijn plaatsvervanger. Bij staking van stemmen
      beslist het lot, desgewenst na herstemming, tenzij partijen een arbitraire oplossing aanvaarden.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIII-A3
  - number: III-A3.3
    text: |-
      Om de 3 jaar treedt één van de door de instellingsbesturen en één van de door het personeel gekozen leden en
      plaatsvervangende leden af volgens een door de commissie op te stellen rooster.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIII-A3
  - number: III-A3.4
    text: De voorzitter en de plaatsvervangend voorzitter worden gekozen voor de tijd van 3 jaar.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIII-A3
  - number: III-A3.5
    text: |-
      De voorzitter en de plaatsvervangend voorzitter en de overige leden en plaatsvervangende leden zijn bij aftreden
      onmiddellijk herkiesbaar.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIII-A3
  - number: III-A3.6
    text: In een opengevallen plaats wordt binnen 6 weken voorzien.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIII-A3
  - number: III-A4.1
    text: 'Voorzitter, plaatsvervangend voorzitter, lid en plaatsvervangend lid van een commissie kan niet zijn hij die:'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIII-A4
  - number: III-A4.1.a
    text: |-
      zitting heeft in of in dienst is van het instellingsbestuur of het bestuur van een vereniging van
      instellingsbesturen of organen dan wel van de landelijke organisatie, of deel uitmaakt van het personeel van een
      instelling waarover die commissie waarvan hij deel uitmaakt, haar werkkring uitstrekt;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIII-A4
  - number: III-A4.1.b
    text: |-
      in dienst is van een vereniging als bedoeld in [artikel 64 van de Wet op het primair onderwijs][ref1],
      [artikel 66 van de Wet op de expertisecentra][ref2], [artikel 40][ref3] en
      [artikel 184 van de Wet op het voortgezet onderwijs][ref4], artikel 2.51 en 2.59 van de Wet op het cursorisch
      beroepsonderwijs, artikel 61 van de Wet op de onderwijsverzorging of artikel 9 van de Kaderwet volwasseneneducatie,
      waarvan het lidmaatschap openstaat voor personeel van instellingen waarvoor de desbetreffende commissie waarvan hij
      deel uitmaakt is ingesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel64
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel66
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel40
      [ref4]: https://wetten.overheid.nl/BWBR0002399#Artikel184
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIII-A4
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '64'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '66'
      - id: ref3
        bwb_id: BWBR0002399
        artikel: '40'
      - id: ref4
        bwb_id: BWBR0002399
        artikel: '184'
  - number: III-A4.1.c
    text: deel uitmaakt van de rijksinspectie;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIII-A4
  - number: III-A4.2
    text: |-
      Voorzitter en plaatsvervangend voorzitter kan slechts zijn hij die de hoedanigheid van meester in de rechten heeft
      verkregen op grond van een met goed gevolg afgelegd doctoraal examen in het Nederlands recht aan een Nederlandse
      universiteit of hogeschool.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIII-A4
  - number: III-A5.1
    text: |-
      Zodra hij verkozen is, geeft de voorzitter aan Onze minister en de bij de commissie aangesloten instellingsbesturen
      onverwijld kennis van de samenstelling van de commissie, onder vermelding van zijn adres en eventuele andere
      gegevens die hij van belang acht.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIII-A5
  - number: III-A5.2
    text: Wijziging van deze gegevens deelt de voorzitter onverwijld eveneens mee.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIII-A5
  - number: III-A6.1
    text: |-
      De commissie legt de regeling van haar werkzaamheden binnen 6 maanden na haar verkiezing vast in een huishoudelijk
      reglement en voorziet daarin in haar secretariaat.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIII-A6
  - number: III-A6.2
    text: |-
      De voorzitter brengt dit reglement, alsmede wijzigingen daarvan ter kennis van Onze minister en de bij de commissie
      aangesloten instellingsbesturen.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIII-A6
  - number: III-A7.1
    text: |-
      Het instellingsbestuur draagt er zorg voor, dat een kennisgeving van de samenstelling van de commissie waarbij de
      instelling is aangesloten en van het adres van de voorzitter, alsmede een exemplaar van het huishoudelijk reglement
      van de commissie steeds op een voor de betrokkene toegankelijke plaats ter inzage in de instelling beschikbaar
      zijn.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIII-A7
  - number: III-A7.2
    text: |-
      Deze kennisgeving en dit huishoudelijk reglement worden steeds onverwijld aangepast aan de wijzigingen, bedoeld in
      artikel III-A5, tweede lid, en artikel III-A6, tweede lid.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIII-A7
  - number: III-A7.3
    text: |-
      Stukken, die moeten worden ingediend bij de voorzitter of de commissie, kunnen worden toegezonden aan het bekend
      gemaakte kantooradres van de secretaris.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIII-A7
  - number: III-A8.1
    text: 'De betrokkene kan in beroep komen tegen een door het instellingsbestuur genomen besluit inhoudende:'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIII-A8
  - number: III-A8.1.a
    text: ontzegging van de toegang tot de instelling;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIII-A8
  - number: III-A8.1.b
    text: oplegging van een straf;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIII-A8
  - number: III-A8.1.c
    text: |-
      ontslag anders dan op eigen verzoek, voordat hij de pensioengerechtigde leeftijd heeft bereikt, of het tijdvak
      waarvoor hij is benoemd, is verstreken;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIII-A8
  - number: III-A8.1.d
    text: schorsing;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIII-A8
  - number: III-A8.1.e
    text: het direct of indirect onthouden van promotie;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIII-A8
  - number: III-A8.1.f
    text: |-
      de beslissing van het instellingsbestuur ten aanzien van een personeelslid op basis waarvan op termijn opheffing
      van zijn betrekking kan plaatsvinden;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIII-A8
  - number: III-A8.1.g
    text: de beëindiging van een verlengd tijdelijk dienstverband;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIII-A8
  - number: III-A8.1.h
    text: |-
      de aanwijzing als personeelslid boven de reguliere formatie voortvloeiend uit een algemeen verbindend voorschrift
      welke aanwijzing op termijn kan leiden tot ontslag of beëindiging van een verlengd tijdelijk dienstverband;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIII-A8
  - number: III-A8.1.i
    text: de aanwijzing van een andere school of andere scholen waaraan een betrokkene werkzaamheden zal verrichten.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIII-A8
  - number: III-A8.2
    text: |-
      Indien in de gevallen, bedoeld in het eerste lid, de betrokkene voor het verstrijken van de beroepstermijn is
      overleden, kunnen in beroep komen zijn nagelaten betrekkingen die recht hebben op een uitkering bij overlijden.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIII-A8
  - number: III-A8.3
    text: |-
      De appellant dient bij de voorzitter van de commissie een door hem of door zijn raadsman ondertekend beroepschrift
      in, waarbij wordt gevoegd:
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIII-A8
  - number: III-A8.3.a
    text: een afschrift van het bestuursbesluit waartegen het beroep wordt ingesteld;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIII-A8
  - number: III-A8.3.b
    text: een afschrift van de akte van benoeming;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIII-A8
  - number: III-A8.3.c
    text: afschriften van de voornaamste op de zaak betrekking hebbende stukken.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIII-A8
  - number: III-A8.4
    text: 'Het beroepschrift bevat:'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIII-A8
  - number: III-A8.4.a
    text: |-
      een opgave van de naam, de voornamen en het adres van de appellant en zo nodig de gekozen woonplaats ten aanzien
      van de procedure;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIII-A8
  - number: III-A8.4.b
    text: een zo volledig mogelijke aanduiding van de naam en het adres van de tegenpartij;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIII-A8
  - number: III-A8.4.c
    text: een mededeling van de vordering en de gronden waarop deze berust.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIII-A8
  - number: III-A8.5
    text: |-
      Het beroepschrift moet worden ingediend bij de voorzitter van de commissie binnen 6 weken, gerekend vanaf de dag na
      die waarop het bestuursbesluit waartegen het beroep wordt ingesteld, aan appellant is verzonden.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIII-A8
  - number: III-A8.6
    text: |-
      Indien het beroepschrift niet voldoet aan de eisen gesteld in het tweede en derde lid van dit artikel, wijst de
      voorzitter de appellant op het gepleegde verzuim en nodigt hem uit binnen 2 weken een hersteld beroepschrift in
      te zenden.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIII-A8
  - number: III-A9.1
    text: |-
      Indien het geschil kennelijk bij een andere commissie moet worden aangebracht, deelt de voorzitter dit onverwijld
      bij aangetekende brief aan de appellant mee. Over andere gevallen van onbevoegdheid beslist de commissie.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIII-A9
  - number: III-A9.2
    text: |-
      Indien het beroepschrift na de daarvoor gestelde termijn is ingediend, laat de commissie niet-
      ontvankelijkverklaring op die grond achterwege, indien de appellant aantoont dat hij de voorziening in beroep heeft
      gevraagd zo spoedig als dit redelijkerwijs verlangd kon worden.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIII-A9
  - number: III-A9.3
    text: |-
      Tenzij de behandeling in het eerste en tweede lid er toe leidt het beroepschrift niet in behandeling te
      nemen, zendt de voorzitter onmiddellijk na ontvangst van het beroepschrift of hersteld beroepschrift een
      exemplaar daarvan, vergezeld van de in artikel III-A8, tweede lid, genoemde afschriften, aan het betrokken
      instellingsbestuur.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIII-A9
  - number: III-A10.1
    text: |-
      Binnen twee weken na ontvangst van het door de voorzitter van de commissie toegezonden beroepschrift en de daarbij
      behorende afschriften doet het instellingsbestuur de voorzitter een verweerschrift in drievoud toekomen. Bij elk
      exemplaar voegt het instellingsbestuur afschriften van de voornaamste op de zaak betrekking hebbende stukken. De
      voorzitter kan op tijdig verzoek van het instellingsbestuur de termijn voor verweer in uitzonderlijke gevallen
      verlengen tot een door hem te bepalen datum.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIII-A10
  - number: III-A10.2
    text: |-
      Na ontvangst van het verweerschrift zendt de voorzitter onverwijld een exemplaar daarvan, vergezeld van de daarbij
      behorende afschriften, aan de appellant.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIII-A10
  - number: III-A11.1
    text: De voorzitter bepaalt de dag en het uur waarop de zaak zal worden behandeld.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIII-A11
  - number: III-A11.2
    text: |-
      Die dag zal niet later mogen worden gesteld dan zes weken na ontvangst van het beroepschrift of het hersteld
      beroepschrift, tenzij de betrokkene zulks verzoekt wegens niet tijdige ontvangst. Overschrijding van deze termijn
      wordt alleen in uitzonderlijke gevallen toegestaan en dient te worden gemotiveerd.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIII-A11
  - number: III-A11.3
    text: |-
      De voorzitter geeft binnen twee weken na ontvangst van het beroepschrift of van het hersteld beroepschrift aan
      beide partijen per aangetekende brief kennis van de plaats, de dag en het uur, waarop de zaak zal worden behandeld.
      Overschrijding van deze termijn is slechts in uitzonderlijke gevallen toegestaan en dient te worden gemotiveerd.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIII-A11
  - number: III-A12
    text: |-
      Met eenstemmig goedvinden van de commissie en partijen kan de behandeling van het geschil ook schriftelijk
      geschieden.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIII-A12
  - number: III-A13.1
    text: |-
      Voor de aanvang van de behandeling van de zaak op de zitting kan op verzoek van een partij een lid van de commissie
      worden gewraakt:
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIII-A13
  - number: III-A13.1.a
    text: indien hij persoonlijk belang bij het geschil heeft;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIII-A13
  - number: III-A13.1.b
    text: |-
      indien hij aan de appellant, dan wel aan een van de leden van het bij de zaak betrokken instellingsbestuur in
      bloed- of aanverwantschap bestaat tot in de vierde graad ingesloten;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIII-A13
  - number: III-A13.1.c
    text: indien hij een advies in de zaak heeft gegeven of met een van de partijen een bespreking erover heeft gevoerd;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIII-A13
  - number: III-A13.1.d
    text: indien er een hoge graad van vijandschap of vriendschap bestaat tussen hem en een van de partijen;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIII-A13
  - number: III-A13.1.e
    text: |-
      indien hij binnen een tijdvak van vijf jaren, voorafgaande aan de datum van ontvangst van het beroepschrift door de
      voorzitter, lid is geweest van het instellingsbestuur of in dienst van het bestuur is geweest;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIII-A13
  - number: III-A13.1.f
    text: in andere gevallen waarin daartoe een ernstige reden aanwezig is.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIII-A13
  - number: III-A13.2
    text: In dezelfde gevallen kan een lid van de commissie zich verschonen.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIII-A13
  - number: III-A13.3
    text: Over de wraking of de verschoning wordt zo spoedig mogelijk beslist door de overige leden der commissie.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIII-A13
  - number: III-A13.4
    text: Bij staking van stemmen wordt de wraking geacht te zijn toegewezen.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIII-A13
  - number: III-A14
    text: |-
      Indien de commissie zulks ter beslissing van de zaak nodig acht, kan zij al dan niet op grond van een daartoe
      strekkend verzoek van een partij getuigen en deskundigen ter zitting horen. Indien zij van deze bevoegdheid gebruik
      maakt, doet de voorzitter hiervan vooraf mededeling aan partijen.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIII-A14
  - number: III-A15.1
    text: De zittingen van de commissie zijn openbaar.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIII-A15
  - number: III-A15.2
    text: Indien een partij daarom verzoekt, vindt de zitting geheel of gedeeltelijk achter gesloten deuren plaats.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIII-A15
  - number: III-A15.3
    text: |-
      In het belang van de openbare orde of zedelijkheid of om gewichtige in het proces-verbaal van de zitting te
      vermelden redenen, kan de commissie bepalen, dat de zitting geheel of gedeeltelijk achter gesloten deuren zal
      plaatshebben.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIII-A15
  - number: III-A15.4
    text: 'Tijdens de zitting wordt aan partijen de gelegenheid gegeven:'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIII-A15
  - number: III-A15.4.a
    text: haar belangen voor te dragen of te doen voordragen;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIII-A15
  - number: III-A15.4.b
    text: getuigen en deskundigen te doen horen;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIII-A15
  - number: III-A15.4.c
    text: |-
      kennis te nemen van alle op het geschil betrekking hebbende stukken, waarvan, voor zover mogelijk, ten minste 1
      week voor de zitting aan partijen inzage wordt gegeven.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIII-A15
  - number: III-A16.1
    text: Binnen 2 weken na de laatste zitting waarop de zaak is behandeld, beslist de commissie op het beroepschrift.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIII-A16
  - number: III-A16.2
    text: |-
      Deze dag zal niet later mogen worden gesteld dan 16 weken na de indiening van het beroepschrift of het hersteld
      beroepschrift. Overschrijding van deze termijn is slechts in uitzonderlijke gevallen toegestaan en wordt in de
      beslissing gemotiveerd.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIII-A16
  - number: III-A16.3
    text: |-
      De beslissing, bedoeld in het eerste lid, wordt zoveel mogelijk genomen in een voltallige vergadering. Het is de
      leden van de commissie niet toegestaan de gevoelens die tijdens deze vergadering over het geschil zijn geuit te
      openbaren.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIII-A16
  - number: III-A16.4
    text: |-
      Een beslissing is slechts van kracht, indien genomen door ten minste 3 leden die de zaak hebben behandeld,
      waaronder de voorzitter of plaatsvervangend voorzitter, met dien verstande dat van de leden of plaatsvervangende
      leden, gekozen door de besturen en door het personeel, een gelijk getal van beide zijden aan de beslissing zal
      deelnemen en dat bij ongelijk getal het jongste lid in leeftijd van de zijde die het sterkst is vertegenwoordigd,
      zich van de stemming zal onthouden. De overige leden onthouden zich niet van stemmen, noch stemmen zij blanco.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIII-A16
  - number: III-A16.5
    text: |-
      De beslissing wordt met redenen omkleed en door de voorzitter binnen 2 weken, nadat zij is genomen, bij aangetekend
      schrijven aan de partij toegezonden.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIII-A16
  - number: III-A16.6
    text: De voorzitter zendt een afschrift van de beslissing naar Onze minister.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIII-A16
  - number: III-A16.7
    text: Het instellingsbestuur onderwerpt zich aan de uitspraak van de commissie.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIII-A16
  - number: III-A17
    text: |-
      De kosten van de commissie komen ten laste van de bij haar aangesloten instellingsbesturen, dan wel, indien het
      betreft de commissie v.j., van de landelijke organisatie.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIII-A17
  - number: IV-E1
    text: 'In dit hoofdstuk wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIV-E1
  - number: IV-E1.a
    text: |-
      instelling: een instelling als bedoeld in artikel I-A1, onder *d*4, *d*5, *d*6, *d*10, *d*13, *d*14, *d*15, *d*17
      en *d*18;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIV-E1
  - number: IV-E1.b
    text: 'overlegorgaan: een overlegorgaan als bedoeld in artikel IV-E2;'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIV-E1
  - number: IV-E1.c
    text: |-
      Sectorcommissie Onderwijs en Wetenschappen: de commissie, bedoeld in
      [artikel 2, eerste lid, van het Overlegbesluit onderwijs- en onderzoekpersoneel][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006446#Artikel2
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIV-E1
    references:
      - id: ref1
        bwb_id: BWBR0006446
        artikel: '2'
  - number: IV-E1.d
    text: |-
      Centrale Commissie: de Centrale Commissie voor Georganiseerd Overleg in Ambtenarenzaken, bedoeld in
      [artikel 105 van het Algemeen Rijksambtenarenreglement][ref1] (*Stb.* 1931, 248);


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel105
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIV-E1
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '105'
  - number: IV-E1.e
    text: 'Commissie besturenorganisatie: de commissie, bedoeld in artikel IV-B2.'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIV-E1
  - number: IV-E2.1
    text: Bij de instelling is een orgaan van georganiseerd overleg.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIV-E2
  - number: IV-E2.2
    text: |-
      Een bevoegd gezag kan of bevoegde gezagsorganen kunnen besluiten dat over bepaalde zaken die meer dan één
      instelling aangaan overleg wordt gevoerd in een overkoepelend overlegorgaan.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIV-E2
  - number: IV-E2.3
    text: |-
      Een bevoegd gezag of bevoegde gezagsorganen kunnen in afwijking van het bepaalde in het eerste lid, besluiten dat
      in plaats van een overlegorgaan bij elke instelling, een gezamenlijk orgaan wordt ingesteld, waarin overleg wordt
      gevoerd over alle zaken die de desbetreffende instellingen aangaan.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIV-E2
  - number: IV-E3.1
    text: |-
      In een overlegorgaan als bedoeld in artikel IV-E2, eerste lid, wordt het personeel vertegenwoordigd door
      vertegenwoordigers van de tot de Centrale Commissie toegelaten centrales.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIV-E3
  - number: IV-E3.2
    text: |-
      Overlegorganen als bedoeld in artikel IV-E2, tweede en derde lid, bestaan uit vertegenwoordigers van de tot de
      Centrale Commissie toegelaten centrales en uit vertegenwoordigers, aangewezen door de desbetreffende bevoegde
      gezagsorganen.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIV-E3
  - number: IV-E3.3
    text: |-
      De bevoegde gezagsoganen, als bedoeld in artikel IV-E2, tweede lid, kunnen bepalen dat zij zich in het overleg,
      als bedoeld in artikel IV-E2, tweede lid, doen vertegenwoordigen door vertegenwoordigers van een of meer tot de
      Commissie besturenorganisaties toegelaten centrales.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIV-E3
  - number: IV-E4.1
    text: |-
      In een overlegorgaan wordt overleg gevoerd over aangelegenheden van algemeen belang voor de bijzondere
      rechtstoestand van het personeel, met inbegrip van de belanghebbenden bedoeld in de artikelen I-Q1209, I-Q1409, I-
      Q1509, I-R1212, eerste en derde lid, I-R1412, eerste en derde lid, I-R1512, eerste en derde lid, I-S1214, eerste
      en derde lid, I-S1414, eerste en derde lid en I-S1514, eerste en derde lid van de instelling of de instellingen
      met inbegrip van de bijzondere regels volgens welke het personeelsbeleid bij de instelling of de instellingen zal
      worden gevoerd alsmede over een reglement voor het overleg.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIV-E4
  - number: IV-E4.2
    text: |-
      Indien over een bepaalde zaak overleg is gevoerd in een overlegorgaan, als bedoeld in artikel IV-E2, tweede
      lid, kan hierover geen overleg meer worden gevoerd in de overlegorganen van de desbetreffende afzonderlijke
      instellingen.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIV-E4
  - number: IV-E4.3
    text: |-
      Het eerste lid blijft buiten toepassing ten aanzien van aangelegenheden waarover overleg is gevoerd met de
      Sectorcommissie Onderwijs en Wetenschappen of de Centrale Commissie.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIV-E4
  - number: IV-E5
    text: |-
      Over zaken die behoren tot de competentie van het overlegorgaan, wordt overleg gevoerd dat is gericht op
      het bereiken van overeenstemming. Het bevoegd gezag dan wel de door de bevoegde gezagsorganen aangewezen
      vertegenwoordigers overeenkomstig het bepaalde in artikel IV-E3, tweede en derde lid, enerzijds en de
      vertegenwoordigers van de tot de Centrale Commissie toegelaten centrales als bedoeld in artikel IV-E3 anderzijds
      bepalen voor elk overlegorgaan in onderling overleg wat wordt verstaan onder overeenstemming. Zolang zulks niet
      is bepaald, wordt in het desbetreffende overlegorgaan onder overeenstemming verstaan het geval waarin het geval
      waarin het bevoegd gezag dan wel de door de bevoegde gezagsorganen aangewezen vertegenwoordigers overeenkomstig
      het bepaalde in artikel IV-E3, tweede en derde lid, enerzijds en de vertegenwoordigers in dat overlegorgaan van
      alle tot de Centrale Commisie toegelaten centrales anderzijds instemmen met de uitkomst van het overleg, over een
      bepaald onderwerp.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIV-E5
  - number: IV-E6.1
    text: |-
      Elke instelling is aangesloten bij een geschillencommissie. Deze commissie strekt haar werkkring uit over ten
      minste 5 instellingen. In bijzondere gevallen kan Onze minister dit aantal op een met redenen omkleed verzoek van
      één of meer bevoegde gezagsorganen lager stellen.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIV-E6
  - number: IV-E6.2
    text: |-
      De geschillencommissie wordt samengesteld door de desbetreffende bevoegde gezagsorganen en de vertegenwoordigers
      van de tot de Centrale Commissie toegelaten centrales.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIV-E6
  - number: IV-E7.1
    text: |-
      Indien één of meer personeelsvertegenwoordigers over een zaak, die behoort tot de competentie van het
      overlegorgaan, tot het oordeel komen dat het overleg daarover niet tot een uitkomst zal leiden die de instemming
      van alle deelnemers aan dat overleg zal hebben, kunnen zij dat oordeel binnen drie dagen nadat zij daarvan in het
      overleg blijk hebben gegeven schriftelijk ter kennis brengen van de overige deelnemers aan het overleg.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIV-E7
  - number: IV-E7.2
    text: |-
      Binnen vijf dagen na de kennisgeving, bedoeld in het eerste lid, schrijft de voorzitter van het orgaan een
      overlegvergadering uit. De vergadering wordt gehouden binnen zeven dagen nadat deze is uitgeschreven.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIV-E7
  - number: IV-E7.3
    text: |-
      In het overlegorgaan wordt dan alsnog bezien of een uitkomst van het overleg mogelijk is, die de instemming van
      alle deelnemers aan het overleg heeft.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIV-E7
  - number: IV-E8.1
    text: |-
      Elk der personeelsvertegenwoordigers is bevoegd binnen vijf dagen nadat in de overlegvergadering, bedoeld in
      artikel IV-E7, tweede lid, is geconstateerd dat geen overeenstemming als bedoeld in artikel IV-E5 kan worden
      bereikt over een door of namens het bevoegd gezag aan het overleg voorgelegd beleidsvoornemen, het geschil voor te
      leggen aan de geschillencommissie waarbij de instelling is aangesloten. Indien alle personeelsvertegenwoordigers
      tijdens het overleg bedoeld in artikel IV-E5 hebben verklaard af te zien van hernieuwd overleg als aangegeven
      in artikel IV-E7, kan de in de eerste volzin aangegeven bevoegdheid door elk der personeelsvertegenwoordigers
      worden uitgeoefend binnen vijf dagen nadat in het in artikel IV-E5 bedoelde overleg is geconstateerd dat geen
      overeenstemming kan worden bereikt.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIV-E8
  - number: IV-E8.2
    text: |-
      De commissie beoordeelt of het bevoegd gezag bij afweging van de betrokken belangen in redelijkheid het aan het
      overlegorgaan voorgelegde beleidsvoornemen, als bedoeld in het eerste lid, tot uitvoering kan brengen.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIV-E8
  - number: IV-E8.3
    text: De commissie doet uitspraak binnen 30 dagen nadat het geschil aan haar is voorgelegd.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIV-E8
  - number: IV-E9.1
    text: |-
      Op gronden die verband houden met de godsdienstige of levensbeschouwelijke overtuiging die aan de bijzondere
      instelling als bedoeld in artikel IV-E1 onder *a* ten grondslag ligt, kan Onze minister op verzoek van het
      bevoegd gezag toestaan dat een overlegorgaan bestaat uit vertegenwoordigers van het bevoegd gezag of de bevoegde
      gezagsorganen en de vertegenwoordigers van de naar het oordeel van het bevoegd gezag in aanmerking komende
      personeelsorganisaties. Onze minister kan bij het verlenen van de toestemming nadere voorzieningen treffen voor de
      toepassing van dit hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIV-E9
  - number: IV-E9.2
    text: |-
      Het bevoegd gezag toont bij het verzoek aan dat dit verzoek wordt ondersteund door een meerderheid van twee derde
      van het personeel van de instelling.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIV-E9
  - number: IV-E9.3
    text: |-
      Onze minister trekt de toestemming in indien het verzoek bedoeld in het eerste lid niet langer wordt ondersteund
      door twee derde van het personeel van de instelling.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIV-E9
  - number: IV-F1
    text: 'In dit hoofdstuk wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIV-F1
  - number: IV-F1.a
    text: '"instelling": een instelling als bedoeld in artikel I-A1, onder *d*1 en *d*2, *d*12 en *d*16;'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIV-F1
  - number: IV-F1.b
    text: '"overlegorgaan": een overlegorgaan als bedoeld in artikel IV-F2;'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIV-F1
  - number: IV-F1.c
    text: |-
      Sectorcommissie Onderwijspersoneel: de commissie, bedoeld in
      [artikel 2, eerste lid, van het Overlegbesluit onderwijspersoneel][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006446#Artikel2
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIV-F1
    references:
      - id: ref1
        bwb_id: BWBR0006446
        artikel: '2'
  - number: IV-F2.1
    text: |-
      Ten behoeve van de van één bevoegd gezag uitgaande gezamenlijke instellingen die behoren tot eenzelfde categorie
      als bedoeld in artikel I-A1, onder *d*, is er een orgaan van georganiseerd overleg.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIV-F2
  - number: IV-F2.2
    text: |-
      Bevoegde gezagsorganen kunnen besluiten dat over bepaalde zaken die meer dan één orgaan van georganiseerd overleg
      aan eenzelfde categorie van instellingen aangaan, overleg wordt gevoerd in een overkoepelend overlegorgaan.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIV-F2
  - number: IV-F2.3
    text: |-
      Indien over een bepaalde zaak overleg is gevoerd in een overkoepelend overlegorgaan kan hierover geen overleg meer
      worden gevoerd in de desbetreffende afzonderlijke organen.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIV-F2
  - number: IV-F2.4
    text: |-
      Een bevoegd gezag kan in overleg met het orgaan als bedoeld in het eerste lid, in afwijking van het bepaalde in het
      eerste lid besluiten dat het overleg over alle zaken die een of een aantal instellingen als bedoeld in het eerste
      lid aangaan wordt gevoerd in deelorganen.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIV-F2
  - number: IV-F2.5
    text: |-
      Bevoegde gezagsorganen kunnen in afwijking van het bepaalde in het eerste lid besluiten dat in plaats van een
      overlegorgaan bij elk bevoegd gezag het overleg over alle zaken wordt gevoerd in een overkoepelend overlegorgaan.
      Dit overkoepelend overleg kan meerdere categorieën van instellingen als bedoeld in artikel I-A1, onder *d*,
      betreffen.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIV-F2
  - number: IV-F2.6
    text: |-
      Bevoegde gezagsorganen kunnen in afwijking van het tweede lid besluiten dat over de zaken, genoemd in artikel IV-
      F4a, eerste lid, in een overkoepelend overlegorgaan overleg wordt gevoerd dat meerdere categorieën van instellingen
      als bedoeld in artikel I-A1, onder d, kan betreffen.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIV-F2
  - number: IV-F3.1
    text: |-
      In een overlegorgaan als bedoeld in artikel IV-F2, eerste lid, wordt het personeel vertegenwoordigd door
      vertegenwoordigers van de tot de Raad voor het Overheidspersoneelsbeleid toegelaten centrales.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIV-F3
  - number: IV-F3.2
    text: |-
      Overlegorganen als bedoeld in artikel IV-F2, tweede, vierde, vijfde en zesde lid, bestaan uit vertegenwoordigers
      van de tot de Raad voor het Overheidspersoneelsbeleid toegelaten centrales en uit vertegenwoordigers aangewezen
      door de desbetreffende bevoegde gezagsorganen.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIV-F3
  - number: IV-F4.1
    text: |-
      In een overlegorgaan wordt overleg gevoerd over aangelegenheden van algemeen belang voor de bijzondere
      rechtstoestand van het personeel van de instelling of de instellingen met inbegrip van de bijzondere regels volgens
      welke het personeelsbeleid bij de instelling of de instellingen zal worden gevoerd alsmede over een reglement voor
      het overleg.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIV-F4
  - number: IV-F4.2
    text: |-
      Het eerste lid blijft buiten toepassing ten aanzien van aangelegenheden waarover overleg is gevoerd met de
      Sectorcommissie Onderwijspersoneel of de Raad voor het Overheidspersoneelsbeleid alsmede ten aanzien van
      aangelegenheden waarin het bevoegd gezag toepassing geeft aan een ter zake van die aangelegenheid overeengekomen
      regeling tussen de tot de Raad voor het Overheidspersoneelsbeleid toegelaten centrales en de vereniging van
      instellingsbesturen waarbij het bevoegd gezag is aangesloten.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIV-F4
  - number: IV-F4.3
    text: |-
      Het bevoegd gezag danwel de bevoegde gezagsorganen en de vertegenwoordigers van het personeel in het overlegorgaan
      kunnen gezamenlijk besluiten dat het overleg over de in het eerste lid bedoelde aangelegenheden, voor zover
      dit betrekking heeft op een of meer door het bevoegd gezag in stand gehouden scholen, wordt gevoerd met de
      personeelsgeleding van de medezeggenschapsraad, bedoeld in de [Wet medezeggenschap onderwijs 1992][ref1], van
      de desbetreffende instelling of instellingen. Het bepaalde in artikel IV-F5, derde en vierde volzin, is van
      overeenkomstige toepassing. Het bevoegd gezag en de vertegenwoordigers van het personeel bepalen daarbij onder
      welke voorwaarden dat overleg wordt gevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0005746
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIV-F4
    references:
      - id: ref1
        bwb_id: BWBR0005746
  - number: IV-F4.5
    text: |-
      Indien het overleg, bedoeld in het derde lid, niet leidt tot een afronding overeenkomstig de op grond van dat lid
      vastgestelde voorwaarden, wordt alsnog over de desbetreffende aangelegenheden het overleg, bedoeld in het eerste
      lid, gevoerd.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIV-F4
  - number: IV-F4a.1
    text: |-
      Onverminderd artikel IV-F4, eerste lid, wordt in een overlegorgaan overleg gevoerd over de arbeidsvoorwaardelijke
      gevolgen van:
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIV-F4a
  - number: IV-F4a.1.a
    text: |-
      een door de gemeenteraad voorgenomen vaststelling of wijziging van een onderwijsachterstandenplan
      of een door de gemeenteraad voorgenomen besluit omtrent de verdeling van de middelen als bedoeld in
      [artikel 166, eerste lid, van de Wet op het primair onderwijs][ref1],__REF001______________________________________
      ___________________ of [artikel 268, eerste lid, van de Wet op het voortgezet onderwijs][ref3] en


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel166
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel153
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel268
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIV-F4a
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '166'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '153'
      - id: ref3
        bwb_id: BWBR0002399
        artikel: '268'
  - number: IV-F4a.1.b
    text: |-
      een door de gemeenteraad voorgenomen vaststelling of wijziging van een plan inzake onderwijs in
      allochtone levende talen of een door de gemeenteraad voorgenomen besluit omtrent de verdeling van
      de middelen als bedoeld in [artikel 171, eerste lid, van de Wet op het primair onderwijs][ref1],
      [artikel 157, eerste lid, van de Wet op de expertisecentra][ref2] of
      [artikel 272, eerste lid, van de Wet op voortgezet onderwijs][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel171
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel157
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel272
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIV-F4a
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '171'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '157'
      - id: ref3
        bwb_id: BWBR0002399
        artikel: '272'
  - number: IV-F4a.2
    text: |-
      Het overleg, bedoeld in het eerste lid, vindt plaats op een zodanig tijdstip dat een in een overlegorgaan
      vertegenwoordigd bevoegd gezag in staat is de uitkomsten daarvan onderdeel te maken van het op overeenstemming
      gericht overleg dat het voert met de betrokken gemeenteraad voorafgaand aan de vaststelling of wijziging van een
      plan of het nemen van een besluit als bedoeld in het eerste lid, onder a of b.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIV-F4a
  - number: IV-F5
    text: |-
      Over zaken die behoren tot de competentie van het overlegorgaan, wordt overleg gevoerd dat is gericht op
      het bereiken van overeenstemming. Indien zulks bij wet of bij algemene maatregel van bestuur ten aanzien van
      een onderwerp is bepaald, neemt het bevoegd gezag uitsluitend een besluit indien daarover overeenstemming is
      bereikt. Het bevoegd gezag dan wel de door de bevoegde gezagsorganen aangewezen vertegenwoordigers enerzijds
      en de vertegenwoordigers van de tot de Raad voor het Overheidspersoneelsbeleid toegelaten centrales als bedoeld
      in artikel IV-F3 anderzijds bepalen voor alle overlegorgaan in onderling overleg wat wordt verstaan onder
      overeenstemming. Zolang zulks niet is bepaald, wordt in het desbetreffende overlegorgaan onder overeenstemming
      verstaan het geval waarin het bevoegd gezag dan wel de door de bevoegde gezagsorganen aangewezen vertegenwoordigers
      enerzijds en de vertegenwoordigers in dat overlegorgaan van alle tot de Raad voor het Overheidspersoneelsbeleid
      toegelaten centrales anderzijds instemmen met de uitkomst van het overleg, over een bepaald onderwerp.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIV-F5
  - number: IV-F6.1
    text: |-
      Indien één of meer personeelsvertegenwoordigers over een zaak, die behoort tot de competentie van het
      overlegorgaan, tot het oordeel komen dat het overleg daarover niet tot een uitkomst zal leiden die de instemming
      van alle deelnemers aan dat overleg zal hebben, kunnen zij dat oordeel binnen drie dagen nadat zij daarvan in het
      overleg blijk hebben gegeven schriftelijk ter kennis brengen van de overige deelnemers aan het overleg.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIV-F6
  - number: IV-F6.2
    text: |-
      Binnen vijf dagen na de kennisgeving, bedoeld in het eerste lid, schrijft de voorzitter van het orgaan een
      overlegvergadering uit. De vergadering wordt gehouden binnen zeven dagen nadat deze is uitgeschreven.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIV-F6
  - number: IV-F6.3
    text: |-
      In het overlegorgaan wordt dan alsnog bezien of een uitkomst van het overleg mogelijk is, die de instemming van
      alle deelnemers aan het overleg heeft.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIV-F6
  - number: IV-F7.1
    text: |-
      Elk der personeelsvertegenwoordigers is bevoegd binnen vijf dagen nadat in de overlegvergadering, bedoeld in
      artikel IV-F6, tweede lid is geconstateerd dat geen overeenstemming als bedoeld in artikel IV-F5 kan worden bereikt
      over een door of namens het bevoegd gezag aan het overleg voorgelegd beleidsvoornemen, het geschil voor te leggen
      aan de geschillencommissie als bedoeld in [artikel 38 van de Wet op het primair onderwijs][ref1], respectievelijk
      [artikel 38 van de Wet op de expertisecentra][ref2] of [158 van de Wet op het voortgezet onderwijs][ref3],
      respectievelijk artikel 26*a* van de Wet op het leerlingwezen, respectievelijk artikel 61*a* van de Wet op de
      onderwijsverzorging, waarbij de instelling is aangesloten. De desbetreffende personeelsvertegenwoordiger stelt
      het bevoegd gezag onverwijld in kennis van het voorleggen van een geschil als bedoeld in de vorige volzin. Indien
      alle personeelsvertegenwoordigers tijdens het overleg bedoeld in artikel IV-F5 hebben verklaard af te zien van
      hernieuwd overleg als aangegeven in artikel IV-F6, kan de in de eerste volzin aangegeven bevoegdheid door elk der
      personeelsvertegenwoordigers worden uitgeoefend binnen vijf dagen nadat in het in artikel IV-F5 bedoelde overleg is
      geconstateerd dat een overeenstemming kan worden bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel38
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel158
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIV-F7
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '38'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '38'
      - id: ref3
        bwb_id: BWBR0002399
        artikel: '158'
  - number: IV-F7.2
    text: De commissie doet uitspraak binnen 30 dagen nadat het geschil aan haar is voorgelegd.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIV-F7
  - number: IV-F8.1
    text: |-
      Op gronden die verband houden met de godsdienstige of levensbeschouwelijke overtuiging, die aan de bijzondere
      instelling ten grondslag ligt, kan Onze Minister op verzoek van het bevoegd gezag toestaan dat een overlegorgaan
      bestaat uit vertegenwoordigers van het bevoegd gezag of de bevoegde gezagsorgaan en de vertegenwoordigers van de
      naar het oordeel van het bevoegd gezag in aanmerking komende personeelsorganisaties. Onze Minister kan bij het
      verlenen van de toestemming nadere voorzieningen betreffen voor de toepassing van dit hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIV-F8
  - number: IV-F8.2
    text: |-
      Het bevoegd gezag toont bij zijn verzoek aan dat dit verzoek wordt ondersteund door een meerderheid van twee derden
      van het personeel van de instelling.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIV-F8
  - number: IV-F8.3
    text: |-
      Onze Minister trekt de toestemming in indien het verzoek bedoeld in het verzoek bedoeld in het eerste lid niet
      langer wordt ondersteund door twee derden van het personeel van de instelling.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelIV-F8
  - number: V-A1
    text: |-
      Ten aanzien van de betrokkene, bedoeld in artikel I-A1, onder *e*4, geldt dat bij twijfel of aangelegenheden die
      betrekking hebben op een tijdvak of tijdstip, gelegen vóór 31 juli 1968, moeten worden behandeld volgens de oude of
      de nieuwe bepalingen, Onze minister beslist volgens welke bepalingen de behandeling geschiedt.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-A1
  - number: V-A2
    text: |-
      Voor zover een betrokkene, bedoeld in artikel I-A1, onder *e*7, kan aantonen dat hem bij zijn indiensttreding
      bij een instelling vóór de inwerkingtreding van dit besluit dan wel het "B3-reglement onderwijs", uitdrukkelijk
      door of namens Onze minister is toegezegd dat hem bij inwerkingtreding van dit besluit dan wel het "B3-reglement
      onderwijs", aanspraken die hij ontleende aan de op hem bij indiensttreding van toepassing zijnde regelingen, zouden
      worden gegarandeerd, behoudt hij die aanspraken zolang zijn dienstverband bij diezelfde instelling voortduurt.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-A2
  - number: V-A4.1
    text: |-
      Ten aanzien van de betrokkene die was benoemd bij een instelling als bedoeld in artikel 32 van de Rijksregeling
      basiseducatie welke vóór 2 augustus 1987 geheel of ten dele opgaat in een reeds bestaande instelling als bedoeld
      in artikel I-A1, onder *d*6, en die op de dag van samenvoeging wordt benoemd bij laatstgenoemde instelling,
      zijn de bepalingen in deze titel inzake de overgang van personeel naar instellingen als bedoeld in artikel I-A1,
      onder *d*6, van overeenkomstige toepassing, een en ander met inachtneming van de functie die hij op de dag van
      samenvoeging gaat bekleden.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-A4
  - number: V-A4.2
    text: |-
      Onder de aanduiding " artikel I-A1, onder *d*6," in het eerste lid en in de artikelen V-Q403, V-Q703, V-Q901, V-
      Q902. V-Q903, V-R403, V-R702, V-R901, V-R902 en V-S902 wordt verstaan artikel I-A1, onder *d*6, zoals dat met
      ingang van 1 augustus 1987 is gaan luiden.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-A4
  - number: V-C
    text: |-
      De betrokkene, bedoeld in artikel I-A1, onder *e*10, die op de dag voorafgaande aan de inwerkingtreding van dit
      artikel, extra verlofdagen in de vorm van zogenoemde bestuursdagen genoot, heeft gedurende de in de kolom I van
      onderstaand schema genoemde periodes naast het in artikel I-C7 genoemde aantal vakantieverlofdagen, recht op
      toekenning van het in kolom II genoemde aantal vakantieverlofdagen met behoud van bezoldiging.





                  Periode Aantal extra vakantieverlofdagen






                  tot 1-8-1986 5




                  1-8-1986 t/m 31-7-1987 3




                  1-8-1987 t/m 31-7-1988 1
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-C
  - number: V-C1.1
    text: |-
      De betrokkene, bedoeld in artikel I-A1, onder *e*14, *e*17 en *e*18, behorende tot het personeel waarvoor in
      hoofdstuk I-Q dan wel hoofdstuk I-R voorschriften zijn gegeven, heeft, in afwijking van het bepaalde in hoofdstuk
      I-C, paragraaf 4, aanspraak op vaststelling van het vakantieverlof volgens paragraaf 1 van dat hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-C1
  - number: V-C1.2
    text: |-
      Het bepaalde in het eerste lid is van overeenkomstige toepassing op de betrokkene bedoeld in artikel I-A1, onder
      *e*14 en de betrokkene bedoeld in artikel I-A1, onder *e*17 en *e* 18, die vóór 1 augustus 1991 respectievelijk
      voor 1 augustus 1993 bij de instelling was benoemd in een functie als bedoeld in hoofdstuk I-Q dan wel in hoofdstuk
      I-R en die op 1 augustus 1991 respectievelijk op 1 augustus 1993 werkzaam is in een functie als bedoeld in de
      paragrafen 12, 14 of 15 van hoofdstuk I-S.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-C1
  - number: V-C2.1
    text: |-
      Het bevoegd gezag verleent de betrokkene, bedoeld in artikel I-A1, onder *e*, met uitzondering van de betrokkene
      bedoeld in artikel I-A1 onder *e*11:
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-C2
  - number: V-C2.1.a
    text: |-
      aan wie in de maand augustus 1992 voor een periode van 6 maanden ouderschapsverlof volgens de Wet op het
      ouderschapsverlof is verleend en die na afloop van dit verlof, indien de regeling als bedoeld in artikel I-C39
      reeds van kracht zou zijn geweest, gebruik zou hebben gemaakt van laatstbedoelde regeling, op diens verzoek en met
      inachtneming van de bepalingen in de volgende leden in de maand februari 1993 doch uiterlijk met ingang van 1 maart
      1993 ouderschapsverlof in de zin van artikel I-C39;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-C2
  - number: V-C2.1.b
    text: |-
      die op 28 februari 1993 ouderschapsverlof geniet volgens de Wet op het ouderschapsverlof en die op 1 maart 1993
      gebruik wenst te maken van de regeling ouderschapsverlof als bedoeld in artikel I-C39 op diens verzoek en met
      inachtneming van het derde lid, ouderschapsverlof volgens deze regeling.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-C2
  - number: V-C2.2
    text: |-
      Voor de betrokkene, bedoeld in het eerste lid, onder *a*, blijft, vanaf het tijdstip, dat hij gebruik maakt van de
      regeling als bedoeld in artikel I-C39, indien het dienstbelang dit vereist, tot uiterlijk 1 maart 1993 het aantal
      uren, dat hij op 31 januari 1993 ingevolge de Wet op het ouderschapsverlof werkzaam was, ongewijzigd.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-C2
  - number: V-C2.3
    text: |-
      In afwijking van het bepaalde in artikel I-C39 wordt de op grond van de Wet op het ouderschapsverlof overeengekomen
      tijd met ten hoogste 6 maanden verlengd.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-C2
  - number: V-E1
    text: |-
      Artikel I-E19 is van toepassing op de gewezen betrokkene op wie dat artikel op 31 juli 1995 van toepassing was
      wegens ziekte ontstaan voor het tijdstip waarop zijn taak is verminderd op grond van artikel I-P79 danwel artikel
      I-Q408, zoals die artikelen luidden op 31 juli 1995.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-E1
  - number: V-H1
    text: |-
      Ten aanzien van de betrokkene die ter zake van ontslag voor de datum waarop dit besluit in werking treedt recht
      had op een ontslaguitkering op grond van het bepaalde in hoofdstuk I-H van de Regeling ontslaguitkeringen K.O./L.O.
      (*Stb.* 1971, 479), het Rechtspositiebesluit W.V.O. (*Stb.* 1968, 322), de Rechtspositieregeling vormingswerk voor
      jeugdigen, het B3-reglement onderwijs, hoofdstuk H van het Rechtspositiebesluit W.L.W. (*Stb.* 1968, 622) danwel
      ten aanzien van de betrokkene die ter zake van ontslag voor 1 augustus 1985 recht had op een ontslaguitkering
      op grond van het bepaalde in hoofdstuk I-H van het Rechtspositiebesluit K.O./L.O. (*Stb.* 1978, 228), blijven
      de rechten en verplichtingen, die hij op grond van de bovengenoemde [uitkeringsregeling][ref1] heeft, behouden
      gedurende de loop van die uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0002537
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-H1
    references:
      - id: ref1
        bwb_id: BWBR0002537
  - number: V-H2
    text: |-
      Artikel I-H15 blijft buiten toepassing ten aanzien van de betrokkene, bedoeld in artikel I-A1, onder *e*14, *e*15,
      *e*17 en *e*18, die op 31 juli 1968 in vaste dienst was van een instelling waarop het Wachtgeldbesluit N.O. (*Stb.*
      1960, 378) van toepassing was en die aanspraak maakt op wachtgeld wegens ontslag uit die betrekking.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-H2
  - number: V-H5
    text: |-
      In afwijking van het bepaalde in artikel I-H26, derde lid, worden bij instelling van de
      Wachtgeldcommissie bijzonder onderwijs de personen benoemd die zitting hadden in de Commissie, bedoeld in
      [artikel 21 van het Rijkswachtgeldbesluit 1959][ref1] (*Stb.* 1979, 621).


      [ref1]: https://wetten.overheid.nl/BWBR0002326#Artikel21
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-H5
    references:
      - id: ref1
        bwb_id: BWBR0002326
        artikel: '21'
  - number: V-H6
    text: |-
      Onze minister verleent desgevraagd aan de betrokkene wiens betrekking per 1 augustus 1991 gedeeltelijk is opgeheven
      in verband met de beëindiging van samenvoegingsboventalligheid als bedoeld in de circulaire BO/BO-87017 334 van 27
      november 1987, met ingang van eerstgenoemde datum een wachtgeld over het opgeheven deel van de betrekking.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-H6
  - number: V-H7.1
    text: |-
      Op de ontslaguitkeringen toegekend krachtens de bepalingen van hoofdstuk I-H, zoals deze luidden op 31 maart 1991,
      worden voor de resterende duur na 30 maart 1991 de bepalingen van hoofdstuk I-H van toepassing, zoals deze luiden
      met ingang van 1 april 1991.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-H7
  - number: V-H7.2
    text: |-
      Ten aanzien van de ontslaguitkeringen als bedoeld in het eerste lid, die voortduren na 30 maart 1991, wordt op
      basis van de desbetreffende bepalingen in hoofdstuk I-H, zoals deze luiden met ingang van 1 april 1991, de duur
      opnieuw berekend. Indien de aldus berekende duur langer is dan de oorspronkelijk vastgestelde duur, wordt deze
      laatstgenoemde duur verlengd met het verschil tussen beide.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-H7
  - number: V-H7.3
    text: |-
      Voor de toepassing van artikel I-H3, derde lid, wordt onder eerder toegekende ontslaguitkering tevens begrepen de
      ontslaguitkering, waarvan de duur is vastgesteld krachtens de artikelen I-H3 en I-H6, zoals die luidden op 31 maart
      1991.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-H7
  - number: V-H8.1
    text: |-
      De betrokkene die vóór 1 januari 1987 in het genot was van wachtgeld als bedoeld in artikel I-H2, zoals dit luidde
      op 28 februari 1994, waarvan de duur, nadat toepassing is gegeven aan artikel V-H7, tweede lid, verstrijkt in de
      periode van 1 april 1991 tot en met 31 december 1997, heeft recht op een overgangsuitkering.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-H8
  - number: V-H8.2
    text: |-
      De duur van de overgangsuitkering is een jaar, met dien verstande dat de uitkering uiterlijk 1 januari 1998
      eindigt. De overgangsuitkering gaat in direct na het verstrijken van het wachtgeld als bedoeld in het eerste lid en
      wordt in maandelijkse termijnen betaald.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-H8
  - number: V-H8.3
    text: |-
      Het bedrag van de overgangsuitkering is gelijk aan het maandbedrag van het minimumloon als vermeld in bijlage 2,
      onder 1, bij de leeftijd die de betrokkene heeft, vermeerderd met de daarvoor berekende vakantiebijslag bedoeld in
      [artikel 15 van de Wet minimumloon en minimumvakantiebijslag][ref1], met dien verstande dat dit bedrag nooit meer
      kan bedragen dan 70% van de laatstelijk genoten bezoldiging.


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel15
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-H8
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '15'
  - number: V-H8.4
    text: Hoofdstuk I-H, zoals dat luidde op 28 februari 1994 is voor zoveel mogelijk van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-H8
  - number: V-J1
    text: |-
      Voor de betrokkene die op grond van artikel 12 van het Besluit sociaal beleidskader inzake sectorvorming en
      vernieuwing van het middelbaar beroepsonderwijs dan wel artikel 9 van het Besluit sociaal beleidskader AOC
      ontheffing van de verhuisplicht heeft gekregen en die op het moment van het ontstaan van de verhuisplicht 52 jaar
      of ouder was of boventallig is, blijft de aanspraak op een reiskostenvergoeding overeenkomstig artikel I-J9 van
      het hoofdstuk I-J zoals dat op 31 december 1993 luidde gelden, zolang hij aan dezelfde instelling verbonden blijft
      in een betrekking met een omvang van tenminste 7/10 weektaak en zolang hij buiten het standplaatsgebied van de
      instelling woont.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-J1
  - number: V-J2.1
    text: |-
      Voor de betrokkene bedoeld in artikel I-A1, onder *e*14 en *e*15, die werkzaam is aan een instelling, die in meer
      dan één gebouw is gehuisvest, geldt als standplaats het gebouw waar hij de grootste taakomvang heeft.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-J2
  - number: V-J2.2
    text: |-
      De betrokkene, bedoeld in het eerste lid, ontvangt gedurende de periode tot 1 januari 1994 voor het reizen tussen
      de gebouwen waar de instelling is gehuisvest een vergoeding van de reiskosten bij dienstreizen - met uitzondering
      van verblijfkosten - overeenkomstig artikel I-J13 van het hoofdstuk I-J zoals dat op 31 december 1993 luidde.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-J2
  - number: V-K1
    text: |-
      De diensttijd doorgebracht in een burgerlijke dienstbetrekking bij de N.V. Nederlandse Spoorwegen en de voormalige
      N.V. Artillerie-Inrichtingen telt in afwijking van artikel I-K1, eerste lid, onder *a*, mee voor de bepaling van de
      jubileumgratificatie, indien de betrokkene op het moment van inwerkingtreding van dit besluit in dienst is van een
      instelling als bedoeld in artikel I-K1, onderdeel *a*, onder 1, 3 en 4, en binnen drie jaar na invoering van dit
      besluit zijn 25-jarige dan wel 40-jarige jubileum bereikt.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-K1
  - number: V-L1
    text: |-
      Voor de op 31 december 1985 in dienst zijnde betrokkene die op deze datum aanspraak had op een bedrag aan vakantie-
      uitkering dat hoger was dan voor hem met toepassing van het bepaalde in artikel I-L2 vanaf 1 januari 1986 wordt
      vastgesteld, blijft de aanspraak op vakantie-uitkering gehandhaafd op tenminste het bedrag waarop hij op 31
      december 1985 aanspraak had.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-L1
  - number: V-M1
    text: |-
      De betrokkene bedoeld in artikel I-A1, onder *e*1, voorzover het betreft een lid van het overig personeel en de
      betrokkene, bedoeld in artikel I-A1, onder *e*2, voorzover het betreft een lid van het overig personeel bedoeld in
      artikel I-S301, onderdeel *c* sub 2, die op grond van een op 31 december 1985 geldende studiefaciliteitenregeling
      in verband met een op die datum gevolgde studie dan wel een na die datum nog te volgen studie ten aanzien waarvan
      deze regeling overeengekomen was, aanspraken had die uitgaan boven de aanspraken op grond van hoofdstuk I-M van dit
      besluit, behoudt deze hogere aanspraken terzake van deze studie.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-M1
  - number: V-P1.1
    text: |-
      De betrokkene voor wie op grond van het [Besluit overgangsmaatregelen b.o. 1985][ref1] (*Stb.* 316), het
      [Besluit overgangsmaatregelen s.o. 1985][ref2] (*Stb.* 317), het Besluit overgangsmaatregelen l.w. 1985
      (*Stb.* 165), of het Besluit overgangsmaatregelen v.j. en v. j. v. 1985 (*Stb.* 163), dan wel de Beschikking
      overgangsmaatregelen a.l.o. 1985 of de Beschikking overgangsmaatregelen NLO 1985 een uitzicht is vastgesteld op een
      salaris dat hoger is dan het maximumsalaris behorende bij de functie waarin hij is benoemd, heeft tot ten hoogste
      het voor hem vastgestelde uitzicht aanspraak op bezoldiging volgens een hogere schaal dan de maximumschaal die
      behoort bij de functie waarin hij is benoemd, voor zover het bepaalde in dit hoofdstuk en in de hoofdstukken V-Q of
      V-R zulks bepalen.


      [ref1]: https://wetten.overheid.nl/BWBR0003807
      [ref2]: https://wetten.overheid.nl/BWBR0003808
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-P1
    references:
      - id: ref1
        bwb_id: BWBR0003807
      - id: ref2
        bwb_id: BWBR0003808
  - number: V-P1.2
    text: |-
      Zolang het salaris van de in het eerste lid bedoelde betrokkene nog niet wordt vastgesteld op het hoogste bedrag
      in de bij zijn functie behorende maximumschaal, wordt hem jaarlijks met toepassing van artikel I-P13 een periodieke
      verhoging toegekend indien en voor zover het bij zijn functie behorende carrièrepatroon dat mogelijk maakt. Hem
      wordt vervolgens jaarlijks op de voet van het bepaalde in artikel I-P13 een periodieke verhoging toegekend, voor
      het eerst op 1 augustus van het schooljaar volgende op het schooljaar waarin hij, behoudens het bepaalde in het
      vijfde lid, volgens het maximumsalaris dat bij zijn functie behoort, wordt bezoldigd. Deze jaarlijkse periodieke
      verhoging wordt toegekend volgens de reeks bedragen, genoemd in bijlage 1C onder A, kolom 2, tot het voor hem
      vastgestelde uitzicht genoemd in kolom 1 is bereikt.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-P1
  - number: V-P1.3
    text: |-
      Het bepaalde in het tweede lid is van overeenkomstige toepassing ten aanzien van de betrokkene, bedoeld in het
      Besluit overgangsmaatregelen l.w. 1985, met dien verstande dat voor "1 augustus" wordt gelezen: 1 januari en voor
      "schooljaar" kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-P1
  - number: V-P1.4
    text: |-
      Het bepaalde in het tweede lid is van overeenkomstige toepassing ten aanzien van de betrokkene, bedoeld in het
      [Besluit overgangsmaatregelen v.j. en v.j.v. 1985][ref1], met dien verstande dat voor "schooljaar" wordt gelezen:
      cursusjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0003778
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-P1
    references:
      - id: ref1
        bwb_id: BWBR0003778
  - number: V-P1.5
    text: Bij de toepassing van het bepaalde in het eerste tot en met vierde lid wordt voor de betrokkene
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-P1
  - number: V-P1.5.a
    text: |-
      voor wie een uitzicht is vastgesteld dat hoger is dan het bedrag dat in bijlage 1C, onder B, bij de voor hem
      geldende maximumschaal is vermeld en
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-P1
  - number: V-P1.5.b
    text: |-
      wiens salaris op 31 juli van enig schooljaar werd vastgesteld op het een na hoogste bedrag van zijn maximumschaal
      indien dat schaal 12, schaal 13 of schaal 14 is, bij de toekenning van een periodieke verhoging het salaris
      vastgesteld op het naasthogere bedrag dat is vermeld in bijlage 1C, onder A, kolom 2.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-P1
  - number: V-P2.1
    text: |-
      De bezoldiging van de betrokkene, bedoeld in artikel I-A1, met uitzondering van de betrokkene bedoeld in artikel I-
      A1, onder *e*1, *e*2, *e*4, *e*5 en *e*6, wordt met ingang van de datum die volgt op de datum waarop de waarneming,
      als bedoeld in hoofdstuk I-Q zoals dat op 31 maart 1985 luidde, waarmee de betrokkene op 31 maart 1985 en vanaf 1
      april 1985 was belast, is beëindigd, vastgesteld alsof de waarneming niet heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-P2
  - number: V-P2.2
    text: 'Ten aanzien van de betrokkene bedoeld in:'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-P2
  - number: V-P2.2.a
    text: |-
      [artikel B5 van het Besluit overgangsmaatregelen b.o. 1985][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003807
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-P2
    references:
      - id: ref1
        bwb_id: BWBR0003807
  - number: V-P2.2.b
    text: |-
      [artikel B6 van het Besluit overgangsmaatregelen s.o. 1985][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003808
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-P2
    references:
      - id: ref1
        bwb_id: BWBR0003808
  - number: V-P2.2.c
    text: artikel B4 van het Besluit overgangsmaatregelen l.w. 1985;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-P2
  - number: V-P2.2.d
    text: |-
      [artikel B5 van het Besluit overgangsmaatregelen v.j. en v.j.v. 1985][ref1], is het bepaalde in het eerste lid van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003778
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-P2
    references:
      - id: ref1
        bwb_id: BWBR0003778
  - number: V-P2.3
    text: |-
      Indien de betrokkene, bedoeld in het eerste en tweede lid, die met de waarneming was belast, met ingang van de
      dag volgend op de beëindiging van de waarneming wordt benoemd in de functie die hij heeft waargenomen, wordt zijn
      salaris bij een normbetrekking, in afwijking van het bepaalde in artikel I-P14, bij zijn benoeming vastgesteld op
      het bedrag dat op die datum bij voortzetting van de waarneming voor hem gegolden zou hebben.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-P2
  - number: V-P3
    text: |-
      Indien voor de betrokkene die op 31 december 1988 en 1 januari 1989 aan een instelling als bedoeld in artikel I-
      A1, onder *d*12, is verbonden een andere periodiekdatum geldt dan 1 augustus blijft deze periodiekdatum voor de
      betrokkene gelden zolang hij aan dezelfde instelling benoemd blijft.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-P3
  - number: V-P4.1
    text: |-
      Voor de vaststelling van de toelage minimumloon als bedoeld in artikel I-P16, ten aanzien van de betrokkene die
      op 31 mei 1985 reeds een dergelijke toelage genoot, wordt het in dat artikel bedoelde bedrag van het minimumloon
      fictief verhoogd met 10%.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-P4
  - number: V-P4.2
    text: |-
      Bij de toepassing van het bepaalde in het eerste lid wordt voor de betrokkene het voor hem geldende salaris fictief
      verhoogd met 7,1%.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-P4
  - number: V-P4.3
    text: |-
      Het bepaalde in het tweede lid is niet van toepassing voor de betrokkene, bedoeld in artikel I-A1, onder *e*4 tot
      en met *e*9, die op 31 augustus 1985, ambtenaar in de zin van de pensioenwet zijnde, reeds in het genot was van de
      toelage overeenkomstig het bepaalde in artikel I-P16, zoals dat artikel op die datum luidde.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-P4
  - number: V-P4.4
    text: |-
      Het bepaalde in het tweede lid is niet van toepassing ten aanzien van de betrokkene, bedoeld in artikel I-A1, onder
      *e*1 en *e*2, die op 15 februari 1985, ambtenaar in de zin van de pensioenwet zijnde, reeds in het genot was van de
      toelage overeenkomstig het bepaalde in artikel I-P16, zoals dat artikel op die datum luidde.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-P4
  - number: V-P5
    text: |-
      Het salaris van de betrokkene die op of na 1 augustus 2000 wordt benoemd en voor wie vóór die datum een salaris
      is vastgesteld op grond van artikel I-P18, zoals dat luidde op 31 juli 2000, wordt laatstbedoeld salaris voor de
      toepassing van de artikelen I-P7 tot en met I-P11 buiten beschouwing gelaten.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-P5
  - number: V-P12.1
    text: 'Voor de toepassing van artikel I-P8 wordt ten aanzien van de betrokkene:'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-P12
  - number: V-P12.1.a
    text: |-
      die op of na 1 augustus 1997 wordt benoemd aan een instelling als bedoeld in artikel I-A1 onder d1 of d2, in een
      functie als bedoeld in hoofdstuk I-Q of I-R,
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-P12
  - number: V-P12.1.b
    text: wiens vorige onderwijsfunctie, bedoeld in artikel I-P8, een functie is als bedoeld in hoofdstuk I-Q, en
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-P12
  - number: V-P12.1.c
    text: |-
      die in de vorige onderwijsfunctie, bedoeld in artikel I-P8 een toeslag begininkomens genoot ingevolge de artikelen
      I-P23 tot en met I-P26 zoals die artikelen op 31 juli 1997 luidden, het in de vorige onderwijsfunctie genoten
      salaris verhoogd met de onder c bedoelde toeslag.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-P12
  - number: V-P12.2
    text: |-
      Voor de toepassing van het eerste lid wordt uitgegaan van het salaris en de toeslag begin-inkomens behorende bij
      een normbetrekking.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-P12
  - number: V-P12.3
    text: |-
      Indien het in het eerste lid bepaalde bedrag niet voorkomt in het vanaf 1 augustus 1997 geldende carrièrepatroon
      behorende bij de op 31 juli 1997 vervulde onderwijsfunctie respectievelijk de vorige onderwijsfunctie bedoeld
      in artikel I-P8, wordt de uitkomst van het eerste of tweede lid bepaald op het naasthogere bedrag in dat
      carrièrepatroon.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-P12
  - number: V-P12.4
    text: |-
      Van 1 augustus 1997 tot 1 augustus 1998 is dit artikel, zoals dat op 1 augustus 1997 luidde, niet van toepassing
      op de betrokkene voor wie ingevolge artikel V-P17 het salaris in de vorige onderwijsfunctie wordt vastgesteld
      overeenkomstig een van de tabellen, opgenomen in de bijlage 1H.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-P12
  - number: V-P15
    text: |-
      In afwijking van artikel I-P76 kan het bevoegd gezag gedurende het schooljaar 1997–1998 besluiten tot een verhoging
      van de omvang van de voor dat schooljaar vastgestelde formatie als bedoeld in artikel I-P76, tweede lid, onder a.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-P15
  - number: V-P16
    text: |-
      Het bestuur van een school die wordt omgezet in een speciale school voor basisonderwijs met één of meer afdelingen,
      stelt vóór 1 mei 1998 doch uiterlijk 1 augustus 1998 een plan vast op basis waarvan het dienstverband van het
      personeel van de school per 1 augustus 1998 wordt voortgezet ten behoeve van werkzaamheden aan de speciale school
      voor basisonderwijs of een afdeling van die school.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-P16
  - number: V-P17.1
    text: |-
      Voor de toepassing van artikel I-P8 wordt het salaris dat de betrokkene, bedoeld in het tweede lid onder a dan wel
      b, genoot in de vorige onderwijsfunctie vastgesteld overeenkomstig een van de tabellen, opgenomen in bijlage 1H.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-P17
  - number: V-P17.2
    text: 'Het eerste lid is van toepassing op een betrokkene die:'
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-P17
  - number: V-P17.2.a
    text: |-
      de vorige onderwijsfunctie vervulde aan een instelling als bedoeld in artikel I-A1 onder d1 of d2, in een functie
      als bedoeld in hoofdstuk I-R, die functie eindigde voor 1 augustus 1997, en van wie benoeming plaatsvindt op of
      na 1 augustus 1997 aan een instelling als bedoeld in artikel I-A1 onder d1 of d2 in een functie als bedoeld in
      hoofdstuk I-Q of I-R, dan wel,
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-P17
  - number: V-P17.2.b
    text: |-
      de vorige onderwijsfunctie vervulde aan een school als bedoeld in
      [artikel 1 van de Wet op het voortgezet onderwijs][ref1], aan een instelling als bedoeld in artikel I-A1 onder
      d4, d5 onder a, d6, d10, d13, d14, d15, d17 of d18, aan een instelling als bedoeld in artikel 1.3.1, 1.3.3, 1.3.4,
      1.5.1 dan wel aan een instelling als bedoeld in [artikel 12.3.2 van de Wet educatie en beroepsonderwijs][ref2],
      in een functie als bedoeld in hoofdstuk I-R, die functie eindigde voor 1 augustus 1996, en van wie benoeming
      plaatsvindt op of na 1 augustus 1997 aan een instelling als bedoeld in artikel I-A1 onder d1 of d2 in een functie
      als bedoeld in hoofdstuk I-Q of I-R.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel12
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-P17
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '12'
  - number: V-P17.3
    text: Voor de toepassing van het eerste lid wordt uitgegaan van het salaris behorende bij een normbetrekking.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-P17
  - number: V-P17.4
    text: |-
      Dit artikel is niet van toepassing op de salarisvaststelling in het schooljaar 1997–1998 van een betrokkene die in
      het schooljaar 1996–1997 als leraar gedurende alle schoolweken benoemd dan wel gedurende ten minste 60 werkdagen
      werkzaam en bezoldigd is geweest in het primair onderwijs.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-P17
  - number: V-Q101.1
    text: |-
      De betrokkene aan wie op grond van het bepaalde in [artikel B3 van het Besluit overgangsmaatregelen b.o. 1985][ref1],
      in [artikel B4 van het Besluit overgangsmaatregelen s.o. 1985][ref2], in artikel B6 van het Besluit
      overgangsmaatregelen l.w. 1985 of in artikel B9 van de Beschikking overgangsmaatregelen a.l.o. 1985 extra
      taakomvang is toegekend, behoudt aanspraak op toekenning daarvan zolang hij in dezelfde functie bij dezelfde
      instelling verbonden blijft.


      [ref1]: https://wetten.overheid.nl/BWBR0003807
      [ref2]: https://wetten.overheid.nl/BWBR0003808
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-Q101
    references:
      - id: ref1
        bwb_id: BWBR0003807
      - id: ref2
        bwb_id: BWBR0003808
  - number: V-Q101.2
    text: |-
      Indien de betrekkingsomvang van een betrokkene bij het bevoegd gezag waar hem extra taakomvang is toegekend,
      toeneemt dan wel indien de totale betrekkingsomvang in al zijn betrekkingen tezamen toeneemt, wordt de hem
      ingevolge het eerste lid toegekende extra taakomvang verminderd met eenzelfde hoeveelheid als waarmee zijn
      betrekkingsomvang is toegenomen, echter tot ten hoogste de omvang van die extra taakomvang. Het bepaalde in de
      eerste volzin geldt niet ten aanzien van een toename in verband met vervangingswerkzaamheden.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-Q101
  - number: V-Q101.3
    text: |-
      Indien formatieruimte in de functie adjunct-directeur ontstaat, wordt die ruimte toegedeeld aan de adjunct-
      directeur aan wie extra taakomvang is toegekend in deze functie voor de omvang van die taakomvang, met dien
      verstande dat de totale omvang van de betrekking niet mag uitgaan boven de omvang van een normbetrekking.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-Q101
  - number: V-Q101.4
    text: |-
      De bezoldiging voor de extra taakomvang, bedoeld in het eerste lid van de betrokkene wiens betrekkingsomvang
      wegens vervangingswerkzaamheden is toegenomen, wordt verminderd met de bezoldiging die voortvloeit uit
      de vervangingswerkzaamheden voor zolang hij die bezoldiging geniet en voor zover die werkzaamheden de
      betrekkingsomvang zoals daags voor de aanvang van de vervangingswerkzaamheden vermeld in zijn akte van benoeming -
      indien hij aan instellingen van verschillende bevoegde gezagsorganen is benoemd: akten van benoeming - bedoeld in
      artikel I-B7, te boven gaan, onverminderd het bepaalde in artikel I-P87.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-Q101
  - number: V-Q101.5
    text: |-
      De aan een betrokkene toegekende fictieve extra taakomvang blijft buiten beschouwing bij de toepassing van artikel
      I-P78.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-Q101
  - number: V-Q201.1
    text: |-
      De directeur voor wie met toepassing van [artikel C1 van het Besluit overgangsmaatregelen b.o. 1985][ref1] een
      uitzicht is vastgesteld, behoudt aanspraak op vaststelling van zijn salaris overeenkomstig dat uitzicht zolang hij
      in de desbetreffende directeursfunctie benoemd blijft dan wel zonder wezenlijke onderbreking in het basisonderwijs
      werkzaam blijft in een functie als directeur met een maximumschaal die ten minste gelijk is aan die welke voor hem
      geldt in de functie waarin hij op 1 augustus 1985 is benoemd.


      [ref1]: https://wetten.overheid.nl/BWBR0003807#ArtikelC1
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-Q201
    references:
      - id: ref1
        bwb_id: BWBR0003807
        artikel: C1
  - number: V-Q201.2
    text: |-
      Met een wezenlijke onderbreking als aangegeven in het eerste lid, wordt een periode van langer dan twee maanden
      bedoeld. De tijd gedurende welke een ontslaguitkering als bedoeld in hoofdstuk I-H dan wel een uitkering als
      bedoeld in het [Besluit Werkloosheid onderwijs- en onderzoekpersoneel][ref1] wordt genoten, wordt niet als
      onderbreking aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0006445
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-Q201
    references:
      - id: ref1
        bwb_id: BWBR0006445
  - number: V-Q202.1
    text: |-
      De adjunct-directeur voor wie met toepassing van [artikel C1 van het Besluit overgangsmaatregelen b.o. 1985][ref1]
      een uitzicht is vastgesteld, behoudt aanspraak op vaststelling van zijn salaris overeenkomstig dat uitzicht, zolang
      hij in de desbetreffende adjunct-directeursfunctie benoemd blijft dan wel zonder wezenlijke onderbreking in het
      basisonderwijs werkzaam blijft in een functie als adjunct-directeur met een maximumschaal die ten minste gelijk is
      aan die welke voor hem geldt in de functie waarin hij op 1 augustus 1985 is benoemd.


      [ref1]: https://wetten.overheid.nl/BWBR0003807#ArtikelC1
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-Q202
    references:
      - id: ref1
        bwb_id: BWBR0003807
        artikel: C1
  - number: V-Q202.2
    text: |-
      In afwijking van het bepaalde in het eerste lid blijft de adjunct-directeur die op 31 juli 1985 in dienst was
      als hoofd van een lagere school, als bedoeld in [artikel A1, tweede lid, onder ][ref1], aanspraak behouden op
      vaststelling van zijn salaris overeenkomstig het uitzicht bedoeld in artikel C1 van laatstgenoemd Besluit, zolang
      hij zonder wezenlijke onderbreking werkzaam blijft bij het basisonderwijs in een functie met een maximumschaal die
      ten minste gelijk is aan die welke voor hem geldt in de functie waarin hij op 1 augustus 1985 is benoemd.


      [ref1]: https://wetten.overheid.nl/BWBR0003807
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-Q202
    references:
      - id: ref1
        bwb_id: BWBR0003807
  - number: V-Q202.3
    text: |-
      Het bepaalde in het eerste en tweede lid laat onverlet de aanspraak op bezoldiging volgens het uitzicht dat voor de
      betrokkene kan zijn vastgesteld in zijn kwaliteit als onderwijzer op 31 juli 1985, als aangegeven in artikel C1 dan
      wel als uitkeringsgenietende bedoeld in artikel C5 van het in het eerste lid genoemde Besluit. Ten aanzien van dit
      uitzicht is het bepaalde in artikel V-R201 van toepassing.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-Q202
  - number: V-Q202.4
    text: |-
      Met een wezenlijke onderbreking als aangegeven in het eerste en tweede lid, wordt een periode van langer dan twee
      maanden bedoeld. De tijd gedurende welke een ontslaguitkering als bedoeld in hoofdstuk I-H dan wel een uitkering
      als bedoeld in het [Besluit Werkloosheid onderwijs- en onderzoekpersoneel][ref1] wordt genoten, wordt niet als
      onderbreking aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0006445
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-Q202
    references:
      - id: ref1
        bwb_id: BWBR0006445
  - number: V-Q301.1
    text: |-
      De directeur voor wie met toepassing van [artikel C1 van het Besluit overgangsmaatregelen s.o. 1985][ref1] een
      uitzicht is vastgesteld, behoudt aanspraak op vaststelling van zijn salaris overeenkomstig dat uitzicht, zolang
      hij in de desbetreffende directeursfunctie benoemd blijft dan wel zonder wezenlijke onderbreking in het onderwijs,
      genoemd in de tweede volzin, werkzaam blijft in een functie als directeur met een maximumschaal die ten minste
      gelijk is aan die welke voor hem geldt in de functie waarin hij op 1 augustus 1985 is benoemd. Onder onderwijs
      als bedoeld in de eerste volzin wordt verstaan: het speciaal onderwijs of het voortgezet speciaal onderwijs
      als bedoeld in de [Wet op de expertisecentra][ref2], het voortgezet speciaal onderwijs als bedoeld in [deel
      II van de Wet op het voortgezet onderwijs](onbekend), het onderwijs aan speciale scholen voor basisonderwijs,
      al dan niet met een afdeling, als bedoeld in de [Wet op het primair onderwijs][ref3] en het onderwijs aan
      scholen voor praktijkonderwijs als bedoeld in [deel I van de Wet op het voortgezet onderwijs](onbekend). Ten
      aanzien van de directeur van een speciale school voor basisonderwijs, al dan niet met een afdeling, wordt
      onder onderwijs als bedoeld in de eerste volzin mede verstaan het onderwijs aan basisscholen als bedoeld in de
      [Wet op het primair onderwijs][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0003808#ArtikelC1
      [ref2]: https://wetten.overheid.nl/BWBR0003549
      [ref3]: https://wetten.overheid.nl/BWBR0003420
      [ref4]: https://wetten.overheid.nl/BWBR0003420
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-Q301
    references:
      - id: ref1
        bwb_id: BWBR0003808
        artikel: C1
      - id: ref2
        bwb_id: BWBR0003549
      - id: ref3
        bwb_id: BWBR0003420
      - id: ref4
        bwb_id: BWBR0003420
  - number: V-Q301.2
    text: |-
      In afwijking van het bepaalde in het eerste lid vervalt voor de directeur de aanspraak op vaststelling van
      zijn salaris overeenkomstig het uitzicht bedoeld in artikel C1, vijfde lid, van het in het eerste lid genoemde
      Besluit, met ingang van de datum waarop de directeur niet langer werkzaam is aan een school voor voortgezet
      speciaal onderwijs of een school of instelling voor speciaal en voortgezet speciaal onderwijs als bedoeld in de
      [Wet op de expertisecentra][ref1], een school voor voortgezet speciaal onderwijs als bedoeld in [deel II van de Wet
      op het voortgezet onderwijs](onbekend), een speciale school voor basisonderwijs met een afdeling voor voortgezet
      speciaal onderwijs als bedoeld in de [Wet op het primair onderwijs][ref2] of een school voor praktijkonderwijs als
      bedoeld in [deel I van de Wet op het voortgezet onderwijs](onbekend).


      [ref1]: https://wetten.overheid.nl/BWBR0003549
      [ref2]: https://wetten.overheid.nl/BWBR0003420
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-Q301
    references:
      - id: ref1
        bwb_id: BWBR0003549
      - id: ref2
        bwb_id: BWBR0003420
  - number: V-Q301.3
    text: |-
      De directeur voor wie een uitzicht is vastgesteld als bedoeld in artikel C1, vijfde lid, van het in het
      eerste lid genoemde Besluit en die op grond van het bepaalde in het tweede lid zijn aanspraak op vaststelling
      van zijn salaris overeenkomstig dit uitzicht verliest, verkrijgt daarna slechts aanspraak op vaststelling
      van zijn salaris overeenkomstig het uitzicht bedoeld in artikel C1, vijfde lid, van het in het eerste lid
      genoemde Besluit, indien hij vóór 1 augustus 2000 een functie als directeur aanvaardt aan een school voor
      voortgezet speciaal onderwijs of een school of instelling voor speciaal en voortgezet speciaal onderwijs als
      bedoeld in de [Wet op de expertisecentra][ref1], een school voor voortgezet speciaal onderwijs als bedoeld
      in [deel II van de Wet op het voortgezet onderwijs](onbekend), een speciale school voor basisonderwijs met
      een afdeling voor voortgezet speciaal onderwijs als bedoeld in de [Wet op het primair onderwijs][ref2] of
      een school voor praktijkonderwijs als bedoeld in [deel I van de Wet op het voortgezet onderwijs](onbekend)
      met een maximumschaal die ten minste gelijk is aan die welke voor hem geldt in de functie waarin hij op 1
      augustus 1985 is benoemd, mits hij vanaf 1 augustus 1985 zonder wezenlijke onderbreking werkzaam is geweest
      in een functie als directeur in het speciaal onderwijs of het voortgezet speciaal onderwijs, als bedoeld in de
      [Interimwet op het speciaal onderwijs en het voortgezet speciaal onderwijs][ref3], onderscheidenlijk het onderwijs
      als bedoeld in de eerste volzin van het eerste lid, dan wel werkzaam is geweest in een functie in het voortgezet
      onderwijs als bedoeld in de [Wet op het voortgezet onderwijs][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0003549
      [ref2]: https://wetten.overheid.nl/BWBR0003420
      [ref3]: https://wetten.overheid.nl/BWBR0003549
      [ref4]: https://wetten.overheid.nl/BWBR0002399
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-Q301
    references:
      - id: ref1
        bwb_id: BWBR0003549
      - id: ref2
        bwb_id: BWBR0003420
      - id: ref3
        bwb_id: BWBR0003549
      - id: ref4
        bwb_id: BWBR0002399
  - number: V-Q301.4
    text: |-
      Met een wezenlijke onderbreking als aangegeven in het eerste en derde lid, wordt een periode van langer dan twee
      maanden bedoeld. De tijd gedurende welke een ontslaguitkering als bedoeld in hoofdstuk I-H dan wel een uitkering
      als bedoeld in het [Besluit Werkloosheid onderwijs- en onderzoekpersoneel][ref1] wordt genoten, wordt niet als
      onderbreking aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0006445
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-Q301
    references:
      - id: ref1
        bwb_id: BWBR0006445
  - number: V-Q302.1
    text: |-
      De adjunct-directeur voor wie met toepassing van [artikel C1 van het Besluit overgangsmaatregelen s.o. 1985][ref1]
      een uitzicht is vastgesteld, behoudt aanspraak op vaststelling van zijn salaris overeenkomstig dat uitzicht, zolang
      hij in de desbetreffende adjunct-directeursfunctie benoemd blijft dan wel zonder wezenlijke onderbreking in het
      onderwijs, genoemd in de tweede volzin, werkzaam blijft in een functie als adjunct-directeur met een maximumschaal
      die ten minste gelijk is aan die welke voor hem geldt in de functie waarin hij op 1 augustus 1985 is benoemd.
      Onder onderwijs als bedoeld in de eerste volzin wordt verstaan: het speciaal onderwijs of het voortgezet speciaal
      onderwijs als bedoeld in de [Wet op de expertisecentra][ref2], het voortgezet speciaal onderwijs als bedoeld in
      [deel II van de Wet op het voortgezet onderwijs](onbekend), het onderwijs aan speciale scholen voor basisonderwijs,
      al dan niet met een afdeling, als bedoeld in de [Wet op het primair onderwijs][ref3] en het onderwijs aan scholen
      voor praktijkonderwijs als bedoeld in [deel I van de Wet op het voortgezet onderwijs](onbekend). Ten aanzien van de
      adjunct-directeur van een speciale school voor basisonderwijs wordt onder onderwijs als bedoeld in de eerste volzin
      mede verstaan het onderwijs aan basisscholen als bedoeld in de [Wet op het primair onderwijs][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0003808#ArtikelC1
      [ref2]: https://wetten.overheid.nl/BWBR0003549
      [ref3]: https://wetten.overheid.nl/BWBR0003420
      [ref4]: https://wetten.overheid.nl/BWBR0003420
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-Q302
    references:
      - id: ref1
        bwb_id: BWBR0003808
        artikel: C1
      - id: ref2
        bwb_id: BWBR0003549
      - id: ref3
        bwb_id: BWBR0003420
      - id: ref4
        bwb_id: BWBR0003420
  - number: V-Q302.2
    text: |-
      In afwijking van het bepaalde in het eerste lid vervalt voor de adjunct-directeur de aanspraak op vaststelling
      van zijn salaris overeenkomstig het uitzicht bedoeld in artikel C1, vijfde lid, van het in het eerste lid genoemde
      Besluit, met ingang van de datum waarop de adjunct-directeur niet langer werkzaam is aan een school voor voortgezet
      speciaal onderwijs of een school of instelling voor speciaal en voortgezet speciaal onderwijs als bedoeld in de
      [Wet op de expertisecentra][ref1], een school voor voortgezet speciaal onderwijs als bedoeld in [deel II van de Wet
      op het voortgezet onderwijs](onbekend), een speciale school voor basisonderwijs met een afdeling voor voortgezet
      speciaal onderwijs als bedoeld in de [Wet op het primair onderwijs][ref2] of een school voor praktijkonderwijs als
      bedoeld in [deel I van de Wet op het voortgezet onderwijs](onbekend).


      [ref1]: https://wetten.overheid.nl/BWBR0003549
      [ref2]: https://wetten.overheid.nl/BWBR0003420
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-Q302
    references:
      - id: ref1
        bwb_id: BWBR0003549
      - id: ref2
        bwb_id: BWBR0003420
  - number: V-Q302.3
    text: |-
      De adjunct-directeur voor wie een uitzicht is vastgesteld als bedoeld in artikel C1, vijfde lid, van het in het
      eerste lid genoemde Besluit en die op grond van het bepaalde in het tweede lid zijn aanspraak op vaststelling
      van zijn salaris overeenkomstig dit uitzicht verliest, verkrijgt daarna slechts aanspraak op vaststelling
      van zijn salaris overeenkomstig het uitzicht bedoeld in artikel C1, vijfde lid , van het in het eerste lid
      genoemde Besluit indien hij vóór 1 augustus 2000 een functie als adjunct-directeur aanvaardt aan een school
      voor voortgezet speciaal onderwijs of een school of instelling voor speciaal en voortgezet speciaal onderwijs
      als bedoeld in de [Wet op de expertisecentra][ref1], een school voor voortgezet speciaal onderwijs als bedoeld
      in [deel II van de Wet op het voortgezet onderwijs](onbekend), een afdeling voor voortgezet speciaal onderwijs
      van een speciale school voor basisonderwijs als bedoeld in de [Wet op het primair onderwijs][ref2] of een
      school voor praktijkonderwijs als bedoeld in [deel I van de Wet op het voortgezet onderwijs](onbekend) met een
      maximumschaal die ten minste gelijk is aan die welke voor hem geldt in de functie waarin hij op 1 augustus 1985
      is benoemd mits hij vanaf 1 augustus 1985 zonder wezenlijke onderbreking werkzaam is geweest in een functie als
      adjunct-directeur of directeur in het speciaal onderwijs of het voortgezet speciaal onderwijs, als bedoeld in de
      [Interimwet op het speciaal onderwijs en het voortgezet speciaal onderwijs][ref3], onderscheidenlijk het onderwijs
      als bedoeld in de eerste volzin van het eerste lid, dan wel werkzaam is geweest in een functie in het voortgezet
      onderwijs als bedoeld in de [Wet op het voortgezet onderwijs][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0003549
      [ref2]: https://wetten.overheid.nl/BWBR0003420
      [ref3]: https://wetten.overheid.nl/BWBR0003549
      [ref4]: https://wetten.overheid.nl/BWBR0002399
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-Q302
    references:
      - id: ref1
        bwb_id: BWBR0003549
      - id: ref2
        bwb_id: BWBR0003420
      - id: ref3
        bwb_id: BWBR0003549
      - id: ref4
        bwb_id: BWBR0002399
  - number: V-Q302.4
    text: |-
      Het bepaalde in de voorgaande leden laat onverlet de aanspraak op bezoldiging volgens het uitzicht dat voor de
      betrokkene kan zijn vastgesteld in zijn kwaliteit als onderwijzer op 31 juli 1985, als aangegeven in artikel C1 dan
      wel als uitkeringsgenietende bedoeld in artikel C5 van het in het eerste lid genoemde Besluit. Ten aanzien van dit
      uitzicht is het bepaalde in artikel V-R301 van toepassing.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-Q302
  - number: V-Q302.5
    text: |-
      Met een wezenlijke onderbreking als aangegeven in het eerste en derde lid, wordt een periode van langer dan twee
      maanden bedoeld. De tijd gedurende welke een ontslaguitkering als bedoeld in hoofdstuk I-H dan wel een uitkering
      als bedoeld in het [Besluit Werkloosheid onderwijs- en onderzoekpersoneel][ref1] wordt genoten, wordt niet als
      onderbreking aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0006445
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-Q302
    references:
      - id: ref1
        bwb_id: BWBR0006445
  - number: V-Q401.1
    text: |-
      In het schooljaar 1998–1999 wordt de maximumschaal die geldt voor de normfuncties directeur en adjunct-directeur
      aan een speciale school voor basisonderwijs, onderscheidenlijk de normfunctie adjunct-directeur aan een afdeling
      van een speciale school voor basisonderwijs, vastgesteld met toepassing van hoofdstuk I-Q, paragraaf 3, van dit
      besluit, zoals luidend op 31 juli 1998.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-Q401
  - number: V-Q401.2
    text: |-
      Indien de speciale school voor basisonderwijs is ontstaan uit een scholengemeenschap voor speciaal of voortgezet
      speciaal onderwijs aan kinderen met leer- en opvoedingsmoeilijkheden en moeilijk lerende kinderen, wordt het eerste
      lid ten aanzien van de adjunct-directeur of adjunct-directeuren van de school afzonderlijk toegepast voor de beide
      delen van de voormalige scholengemeenschap, met inachtneming van de gescheiden formatieberekening zoals geldend op
      31 juli 1998.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-Q401
  - number: V-Q401.3
    text: |-
      Met ingang van het schooljaar 1999–2000 is de maximumschaal die geldt voor de normfunctie adjunct-directeur aan een
      afdeling van een speciale school voor basisonderwijs gelijk aan schaal 10. Indien genoemde afdeling op grond van
      artikel XLIV van dit besluit aanspraak heeft op 65 formatierekeneenheden voor de schoolleiding, is de maximumschaal
      die geldt voor de normfunctie adjunct-directeur gelijk aan schaal 11.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-Q401
  - number: V-Q401.4
    text: |-
      Bij de vaststelling van de factor y, bedoeld in artikel I-Q201, onderdeel e, voor een speciale school voor
      basisonderwijs, blijven de leerlingen van een afdeling van die school buiten beschouwing.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-Q401
  - number: V-Q402.1
    text: |-
      De betrokkene die bij het bevoegd gezag van een speciale school voor basisonderwijs gedurende de schooljaren 1997–
      1998 en 1998–1999 was benoemd in dezelfde functie als bedoeld in hoofdstuk I-Q waarbij dezelfde maximumschaal
      hoorde, behoudt met ingang van het schooljaar 1999–2000 aanspraak op bezoldiging volgens het carrièrepatroon
      dat hoort bij de functie met die maximumschaal zolang hij in de desbetreffende functie aan dezelfde instelling
      of instellingen benoemd blijft. Onder maximumschaal in dit lid wordt de maximumschaal verstaan die volgens het
      [Formatiebesluit ISOVSO 1992][ref1] beschikbaar was voor de desbetreffende functie.


      [ref1]: https://wetten.overheid.nl/BWBR0005442
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-Q402
    references:
      - id: ref1
        bwb_id: BWBR0005442
  - number: V-Q402.2
    text: |-
      De betrokkene die werkzaam is aan een speciale school voor basisonderwijs met een afdeling voor voortgezet
      speciaal onderwijs en voor wie een salarisuitzicht geldt als bedoeld in artikel C1, vijfde lid, van het
      [Besluit overgangsmaatregelen s.o. 1985][ref1], behoudt aanspraak op vaststelling van zijn salaris overeenkomstig
      dat uitzicht indien hij werkzaam blijft aan genoemde school nadat de afdeling ervan is omgevormd tot of
      samengevoegd met een school voor voortgezet onderwijs. De aanspraak blijft voorts behouden indien de betrokkene
      uit hoofde van zijn bestuursaanstelling werkzaamheden gaat verrichten ten behoeve van andere scholen van hetzelfde
      bevoegd gezag.


      [ref1]: https://wetten.overheid.nl/BWBR0003808
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-Q402
    references:
      - id: ref1
        bwb_id: BWBR0003808
  - number: V-Q402.3
    text: |-
      De betrokkene die bij het bevoegd gezag van een speciale school voor basisonderwijs is benoemd in een functie
      als bedoeld in hoofdstuk I-Q en voor wie een salarisuitzicht geldt als bedoeld in het eerste lid, artikel I-
      Q106, tweede of derde lid of [artikel C1 van het Besluit overgangsmaatregelen s.o. 1985][ref1], behoudt
      aanspraak op vaststelling van zijn salaris overeenkomstig dat uitzicht bij een herplaatsing overeenkomstig
      __REF001___________________________________________________________________________________________________________
      ___________________________________________________________________________________________________________________
      ________________________ (Stb. 1998, 228). Deze aanspraak geldt zolang de betrokkene bij het bevoegd gezag waarbij
      hij is herplaatst in dezelfde functie benoemd blijft. Indien de betrokkene uit deze functie ontslag wordt verleend,
      wordt hij voor de toepassing van artikel V-Q301 of V-Q302 in deze functie geacht benoemd te zijn gebleven in de
      functie die hij vervulde voordat hij in eerstgenoemde functie werd benoemd.


      [ref1]: https://wetten.overheid.nl/BWBR0003808#ArtikelC1
      [ref2]: https://wetten.overheid.nl/BWBR0009525#ArtikelXLII
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-Q402
    references:
      - id: ref1
        bwb_id: BWBR0003808
        artikel: C1
      - id: ref2
        bwb_id: BWBR0009525
        artikel: XLII
  - number: V-Q402.4
    text: |-
      De betrokkene die bij het bevoegd gezag van een speciale school voor basisonderwijs is benoemd in een functie als
      bedoeld in hoofdstuk I-Q en voor wie een salarisgarantie geldt uit hoofde van een samenvoeging van scholen, behoudt
      die garantie bij een herplaatsing als bedoeld in het derde lid. Deze garantie geldt zolang de betrokkene bij het
      bevoegd gezag waarbij hij is herplaatst in dezelfde functie benoemd blijft. De garantie blijft behouden indien de
      betrokkene in aansluiting op deze functie een andere functie in het onderwijs aanvaardt, waarvan het salarisniveau
      hoger is dan dat behorende bij de functie die hij vervulde voorafgaand aan zijn herplaatsing als bedoeld in het
      derde lid, en wel voor de duur van de benoeming in die andere functie. Indien de benoeming in deze andere functie
      in tijdelijke dienst geschiedt, blijft de garantie behouden als in aansluiting op deze benoeming een benoeming
      plaatsvindt in een functie in het onderwijs, waarvan het salarisniveau tenminste gelijk is aan dat behorende
      bij de functie die hij vervulde voorafgaand aan zijn herplaatsing als bedoeld in het derde lid. Onder onderwijs
      als bedoeld in dit lid wordt verstaan: het onderwijs als bedoeld in de [Wet op het primair onderwijs][ref1], de
      [Wet op de expertisecentra][ref2] of [deel II van de Wet op het voortgezet onderwijs](onbekend), onderscheidenlijk
      het onderwijs aan scholen voor praktijkonderwijs als bedoeld in [deel I van de Wet op het voortgezet onderwijs]
      (onbekend).


      [ref1]: https://wetten.overheid.nl/BWBR0003420
      [ref2]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-Q402
    references:
      - id: ref1
        bwb_id: BWBR0003420
      - id: ref2
        bwb_id: BWBR0003549
  - number: V-Q402.5
    text: |-
      De betrokkene die is benoemd in een functie als bedoeld in hoofdstuk I-Q bij het bevoegd gezag van een school voor
      voortgezet speciaal onderwijs aan moeilijk lerende kinderen of een speciale school voor basisonderwijs met een
      afdeling voor voortgezet speciaal onderwijs aan moeilijk lerende kinderen en voor wie een aanspraak of garantie
      geldt als bedoeld in het derde of vierde lid, behoudt die aanspraak, onderscheidenlijk die garantie indien genoemde
      school of afdeling wordt omgevormd tot een school voor praktijkonderwijs als bedoeld in [deel I van de Wet op het
      voortgezet onderwijs](onbekend) en zijn benoeming wordt voortgezet ten behoeve van het verrichten van werkzaamheden
      aan die school. Het derde lid, tweede en derde volzin, en het vierde lid, tweede tot en met vijfde volzin, zijn van
      overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-Q402
  - number: V-Q601.1
    text: |-
      De directeur voor wie met toepassing van hoofdstuk C van het Besluit overgangsmaatregelen lw. 1985 een uitzicht
      is vastgesteld, behoudt aanspraak op vaststelling van zijn salaris overeenkomstig dat uitzicht, zolang hij in
      de desbetreffende directeursfunctie benoemd blijft dan wel zonder wezenlijke onderbreking in het leerlingwezen
      werkzaam blijft in een functie als directeur met een maximumschaal die ten minste gelijk is aan die welke voor hem
      geldt in de functie waarin hij op 1 april 1985 is benoemd.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-Q601
  - number: V-Q601.2
    text: |-
      Met een wezenlijke onderbreking als aangegeven in het eerste lid wordt een periode langer dan twee maanden bedoeld.
      De tijd gedurende welke een ontslaguitkering als bedoeld in hoofdstuk I-H dan wel een uitkering als bedoeld in
      het [Besluit Werkloosheid onderwijs- en onderzoekpersoneel][ref1] wordt genoten, wordt niet als onderbreking
      aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0006445
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-Q601
    references:
      - id: ref1
        bwb_id: BWBR0006445
  - number: V-Q602.1
    text: |-
      De adjunct-directeur voor wie met toepassing van hoofdstuk C van het besluit overgangsmaatregelen lw. 1985 een
      uitzicht is vastgesteld, behoudt aanspraak op vaststelling van zijn salaris overeenkomstig dat uitzicht, zolang
      hij in de desbetreffende adjunct-directeursfunctie benoemd blijft dan wel zonder wezenlijke onderbreking in het
      leerlingwezen werkzaam blijft in een functie als adjunct-directeur met een maximumschaal die tenminste gelijk is
      aan die welke voor hem geldt in de functie waarin hij op 1 april 1985 is benoemd.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-Q602
  - number: V-Q602.2
    text: |-
      Met een wezenlijke onderbreking als aangegeven in het eerste lid wordt een periode langer dan twee maanden bedoeld.
      De tijd gedurende welke een ontslaguitkering als bedoeld in hoofdstuk I-H dan wel een uitkering als bedoeld in
      het [Besluit Werkloosheid onderwijs- en onderzoekpersoneel][ref1] wordt genoten, wordt niet als onderbreking
      aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0006445
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-Q602
    references:
      - id: ref1
        bwb_id: BWBR0006445
  - number: V-Q603
    text: |-
      De betrokkene, bedoeld in artikel I-A1, onder *e*4, die is benoemd als lid van de directie, bij wiens functie
      op 1 augustus 1993 een lagere maximumschaal behoort dan bij de functie die hij op 31 juli 1993 vervulde, behoudt
      aanspraak op bezoldiging volgens het carrièrepatroon dat behoorde bij de functie die hij op 31 juli 1993 bekleedde,
      zolang hij als zodanig aan de instelling verbonden blijft, onverminderd het bepaalde in de artikelen V-Q601 en
      V-Q602.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-Q603
  - number: V-Q701.1
    text: |-
      De directeur of de directeur/coördinator voor wie met toepassing van
      [artikel C4 van het Besluit overgangsmaatregelen v.j. en v.j.v. 1985][ref1] een uitzicht is vastgesteld, behoudt
      aanspraak op vaststelling van zijn salaris overeenkomstig dat uitzicht, zolang hij in de desbetreffende functie
      benoemd blijft dan wel zonder wezenlijke onderbreking in het vormingswerk werkzaam blijft in een functie als
      directeur met een maximumschaal die tenminste gelijk is aan die welke voor hem geldt in de functie waarin hij op 1
      april 1985 is benoemd.


      [ref1]: https://wetten.overheid.nl/BWBR0003778#ArtikelC4
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-Q701
    references:
      - id: ref1
        bwb_id: BWBR0003778
        artikel: C4
  - number: V-Q701.2
    text: |-
      Het bepaalde in het eerste lid laat onverlet de aanspraak op bezoldiging volgens het uitzicht dat voor de
      betrokkene bedoeld in [artikel C4, tweede lid, van het Besluit overgangsmaatregelen v.j. en v.j.v. 1985][ref1] kan
      zijn vastgesteld in zijn kwaliteit als vormingsleider op 31 maart 1985, als aangegeven in artikel C2 dan wel als
      uitkeringsgenietende bedoeld in artikel C7 van vorengenoemd besluit. Ten aanzien van dit uitzicht is het bepaalde
      in artikel V-R701 van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003778#ArtikelC4
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-Q701
    references:
      - id: ref1
        bwb_id: BWBR0003778
        artikel: C4
  - number: V-Q701.3
    text: |-
      Met een wezenlijke onderbreking als aangegeven in het eerste lid wordt een periode langer dan twee maanden bedoeld.
      De tijd gedurende welke een ontslaguitkering als bedoeld in hoofdstuk I-H dan wel een uitkering als bedoeld in
      het [Besluit Werkloosheid onderwijs- en onderzoekpersoneel][ref1] wordt genoten, wordt niet als onderbreking
      aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0006445
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-Q701
    references:
      - id: ref1
        bwb_id: BWBR0006445
  - number: V-Q702.1
    text: |-
      De adjunct-directeur voor wie met toepassing van
      [artikel C3 van het Besluit overgangsmaatregelen v.j. en v.j.v. 1985][ref1] een uitzicht is vastgesteld, behoudt
      aanspraak op vaststelling van zijn salaris overeenkomstig dat uitzicht, zolang hij in de desbetreffende adjunct-
      directeursfunctie benoemd blijft dan wel zonder wezenlijke onderbreking in het vormingswerk werkzaam blijft in een
      functie als adjunct-directeur met een maximumschaal die ten minste gelijk is aan die welke voor hem geldt in de
      functie waarin hij op 1 april 1985 is benoemd.


      [ref1]: https://wetten.overheid.nl/BWBR0003778#ArtikelC3
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-Q702
    references:
      - id: ref1
        bwb_id: BWBR0003778
        artikel: C3
  - number: V-Q702.2
    text: |-
      Het bepaalde in het eerste lid laat onverlet de aanspraak op bezoldiging volgens het uitzicht dat voor de
      betrokkene kan zijn vastgesteld in zijn kwaliteit als vormingsleider op 31 maart 1985, als aangegeven in artikel C2
      dan wel als uitkeringsgenietende bedoeld in artikel C7 van het in het eerste lid genoemde Besluit. Ten aanzien van
      dit uitzicht is het bepaalde in artikel V-R701 van toepassing.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-Q702
  - number: V-Q702.3
    text: |-
      Met een wezenlijke onderbreking als aangegeven in het eerste lid wordt een periode langer dan twee maanden bedoeld.
      De tijd gedurende welke een ontslaguitkering als bedoeld in hoofdstuk I-H dan wel een uitkering als bedoeld in
      het [Besluit Werkloosheid onderwijs- en onderzoekpersoneel][ref1] wordt genoten, wordt niet als onderbreking
      aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0006445
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-Q702
    references:
      - id: ref1
        bwb_id: BWBR0006445
  - number: V-Q703.1
    text: |-
      Bij de toepassing van het bepaalde in artikel V-Q701 en artikel V-Q702 wordt niet als onderbreking aangemerkt
      de periode gedurende welke de betrokkene zonder onderbreking van meer dan twee maanden bleef benoemd bij een
      instelling als bedoeld in artikel I-A1, onder *d*6 die is ontstaan of mede is ontstaan uit een instelling voor
      vormingswerk voor jonge volwassenen waaraan hij op de dag voorafgaande aan de overgang vanuit die instelling
      voor vormingswerk voor jonge volwassenen naar eerstgenoemde instelling als directeur/coördinator of als adjunct-
      directeur was verbonden, mits het bepaalde in artikel V-Q902 dan wel artikel V-R902 op hem van toepassing is
      gebleven.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-Q703
  - number: V-Q703.2
    text: |-
      Het bepaalde in het eerste lid is van overeenkomstige toepassing ten aanzien van de betrokkene die zonder
      onderbreking van meer dan twee maanden bleef benoemd bij een instelling als bedoeld in artikel I-A1, onder *d*13,
      waarnaar zijn overgang als bedoeld in artikel A1, tweede lid, van de Overgangsregeling ondersteuning VE heeft
      plaatsgevonden vanuit een instelling voor vormingswerk voor jonge volwassenen waaraan hij op de dag voorafgaande
      aan die overgang als directeur/coördinator of als adjunct-directeur was verbonden, mits het bepaalde in artikel V-
      Q1102 dan wel artikel V-S1102 op hem van toepassing is gebleven.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-Q703
  - number: V-Q704
    text: |-
      De betrokkene, bedoeld in artikel I-A1, onder *e*5, die is benoemd als lid van de centrale directie, bij wiens
      functie op 1 augustus 1994 een lagere maximumschaal behoort dan bij de functie die hij op 31 juli 1994 vervulde,
      behoudt aanspraak op bezoldiging volgens het carrièrepatroon dat behoorde bij de functie die hij op 31 juli 1994
      bekleedde, zolang hij als zodanig aan de instelling verbonden blijft, onverminderd het bepaalde in artikel V-Q705.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-Q704
  - number: V-Q705
    text: |-
      Op de betrokkene bedoeld in artikel I-A1, onder *e*5, voor wie tot en met 31 juli 1994 op grond van artikel IV,
      onderdeel 3, onder *a*, sub 1, van het besluit van 3 juli 1992 (*Stb* 1992, 389) (Formatiebudgetsysteem) een
      of meer van de artikelen V-Q701, V-Q702, V-Q703, V-R702, eerste en tweede lid, en V-R703, van toepassing zijn
      gebleven, zijn de artikelen V-Q701, V-Q702, V-Q703, V-R701, V-R702, en V-R703 van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-Q705
  - number: V-Q801.1
    text: |-
      De directeur of adjunct-directeur, in dienst van een instelling voor landbouwpraktijkonderwijs, die tot 1 april
      1985 werd bezoldigd op de voet van de in hoofdstuk I-Q genoemde schalen voor directies of leraren, zoals die op 31
      maart 1985 luidden, heeft aanspraak op het in hoofdstuk C van het Besluit overgangsmaatregelen v.o. 1985 gegeven
      overgangsrecht ter zake van salarisuitzichten.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-Q801
  - number: V-Q801.2
    text: |-
      Het bepaalde in de artikelen V-Q401 en V-Q402 is ten aanzien van de betrokkene, bedoeld in het eerste lid, van
      overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-Q801
  - number: V-Q901
    text: |-
      De directeur/coördinator of adjunct-directeur/coördinator op wie het bepaalde in de Overgangsregeling basiseducatie
      (*Stb.* 1988, 42), met uitzondering van artikel A2 van dat besluit, van toepassing is, behoudt bij een instelling,
      als bedoeld in artikel I-A1, onder *d*6, waaraan hij op de dag van overgang daar naar toe wordt verbonden als
      directeur/coördinator of adjunct-directeur/coördinator, uitzicht op vaststelling van zijn salaris volgens het
      bedrag bij het hoogste salarisnummer van de schaal waarin hij is ingepast op de dag waarop de overgang naar die
      instelling plaatsvindt. Indien de schaal, bedoeld in de vorige volzin, een lager nummer heeft dan de hoogste
      aanloopschaal, die behoorde bij de functie die de directeur/coördinator of adjunct-directeur/coördinator vervulde
      op de dag voorafgaande aan de overgang naar de instelling, bedoeld in artikel I-A1, onder *d*6, behoudt hij, in
      afwijking van het bepaalde in de vorige volzin, uitzicht op vaststelling van zijn salaris volgens het bedrag bij
      het hoogste salarisnummer van die hoogste aanloopschaal.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-Q901
  - number: V-Q902.1
    text: |-
      De betrokkene voor wie een uitzicht is vastgesteld met toepassing of overeenkomstige toepassing van een der
      artikelen V-Q401, V-Q402, V-Q701 of V-Q702 en die met ingang van de dag waarop in verband met de invoering van
      de Rijksregeling basiseducatie de overgang naar een instelling als bedoeld in artikel I-A1, onder *d*6, heeft
      plaatsgevonden, vanuit de door hem beklede functie van directeur, directeur/coördinator of van adjunct-directeur
      is benoemd aan die instelling in een functie als bedoeld in paragraaf 9 van hoofdstuk I-Q behoudt, in afwijking van
      het bepaalde in artikel V-Q901, aanspraak op vaststelling van zijn salaris overeenkomstig dat uitzicht zolang hij
      zonder wezenlijke onderbreking aan een instelling als bedoeld in artikel 1-A1, onder *d*6, verbonden blijft, in een
      functie waarbij een maximumschaal hoort die tenminste gelijk is aan de maximumschaal die behoort bij de functie die
      hem is toebedeeld bij de overgang naar meergenoemde instelling.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-Q902
  - number: V-Q902.2
    text: |-
      Met een wezenlijke onderbreking als aangegeven in het eerste lid wordt een periode van langer dan twee maanden
      bedoeld. De tijd gedurende welke een ontslaguitkering als bedoeld in hoofdstuk I-H dan wel een uitkering als
      bedoeld in het [Besluit Werkloosheid onderwijs- en onderzoekpersoneel][ref1] wordt genoten, wordt niet als
      onderbreking aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0006445
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-Q902
    references:
      - id: ref1
        bwb_id: BWBR0006445
  - number: V-Q904
    text: |-
      Ten aanzien van de betrokkene voor wie de Overgangsregeling gewijzigde ondersteuningsstructuur VE van toepassing
      is, is het bepaalde in artikel V-Q1104 van overeenkomstige toepassing, zolang hij zonder onderbreking van meer
      dan twee maanden verbonden blijft aan een instelling als bedoeld in artikel A1, tweede lid, onder *b*, van de
      Overgangsregeling gewijzigde ondersteuningsstructuur VE, voor zover het betreft een instelling, bedoeld in artikel
      I-A1, onder *d*6.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-Q904
  - number: V-Q1001
    text: |-
      In deze paragraaf wordt verstaan onder: betrokkene: degene, die op 31 december 1988 in dienst is van een instelling
      bedoeld in artikel 8 van de Wet op de onderwijsverzorging als lid van de directie.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-Q1001
  - number: V-Q1002.1
    text: |-
      De betrokkene die per 1 januari 1989 door het bevoegd gezag een functie toegedeeld heeft gekregen waarbij een
      maximumschaal behoort met een maximumsalaris dat lager is dan het maximumsalaris van de schaal die voor de
      betrokkene gold op 31 december 1988, behoudt vanaf 1 januari 1989 aanspraak op bezoldiging volgens de schaal,
      die voor hem ingevolge artikel C1 of C2 van de Invoeringsregeling WOV-personeel is vastgesteld, onverminderd het
      bepaalde in het tweede en derde lid.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-Q1002
  - number: V-Q1002.2
    text: |-
      De betrokkene, die per 1 januari 1989 door het bevoegd gezag een functie toegedeeld heeft gekregen en voor wie
      vanaf 1 januari 1989 ingevolge artikel C2, derde lid, van de Invoeringsregeling WOV-personeel een salarisschaal
      is gaan gelden met een hoger maximumsalaris, behoudt aanspraak op een salarisbedrag dat gelijk is aan het
      maximumsalaris van de door hem op 31 december 1988 geldende schaal, onverminderd het bepaalde in het derde lid.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-Q1002
  - number: V-Q1002.3
    text: |-
      Het salarisuitzicht bedoeld in het eerste en tweede lid blijft tot 1 januari 2004 behouden zolang de betrokkene
      zonder wezenlijke onderbreking aan een instelling werkzaam blijft in een zelfde functie als die waarin hij per
      1 januari 1989 werd benoemd en met een maximumschaal die tenminste gelijk is aan die welke geldt voor de functie
      waarin hij op 1 januari 1989 werd benoemd.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-Q1002
  - number: V-Q1002.4
    text: |-
      Wat betreft het carrièrepatroon van de betrokkene, bedoeld in het eerste lid, is het bepaalde in artikel V-P1,
      tweede lid, van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-Q1002
  - number: V-Q1002.5
    text: |-
      Met een wezenlijke onderbreking als aangegeven in het derde lid wordt een periode van langer dan twee maanden
      bedoeld. De tijd gedurende welke een uitkering als bedoeld in hoofdstuk I-H dan wel een uitkering als bedoeld
      in het [Besluit Werkloosheid onderwijs- en onderzoekpersoneel][ref1] wordt genoten, wordt niet als onderbreking
      aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0006445
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-Q1002
    references:
      - id: ref1
        bwb_id: BWBR0006445
  - number: V-Q1003.1
    text: |-
      De betrokkene voor wie vóór 1 januari 1989 met goedkeuring van Onze minister het behoud van een bepaalde
      salarisschaal dan wel een bepaald salarisuitzicht gold, behoudt die salarisschaal dan wel dat salarisuitzicht
      zolang hij aan dezelfde instelling verbonden blijft in dezelfde functie dan wel in de functie die hem per 1 januari
      1989 door het bevoegd gezag is toegedeeld.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-Q1003
  - number: V-Q1003.2
    text: |-
      De betrokkene aan wie vóór 1 januari 1989 in overeenstemming met de door Onze minister tot stand gebrachte
      regelingen aantoonbaar het behoud van een bepaalde salarisschaal dan wel van een bepaald salarisuitzicht is
      toegezegd in een bepaalde functie behoudt die salarisschaal dan wel dat salarisuitzicht zolang hij aan dezelfde
      instelling verbonden blijft in dezelfde functie dan wel in de andere functie, die hem per 1 januari 1989 door het
      bevoegd gezag is toegedeeld.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-Q1003
  - number: V-Q1101.1
    text: |-
      De directeur of de adjunct-directeur op wie het bepaalde in de Overgangsregeling ondersteuning VE, met uitzondering
      van artikel A2 van dat besluit van toepassing is, behoudt bij een instelling als bedoeld in artikel I-A1,
      onder *d*13, waaraan hij op de dag van overgang als bedoeld in artikel A1, tweede lid, van de Overgangsregeling
      ondersteuning VE wordt verbonden als directeur respectievelijk als adjunct-directeur, uitzicht op de vaststelling
      van zijn salaris volgens het bedrag bij het hoogste salarisnummer van de schaal waarop hij is ingepast op de
      dag waarop de overgang naar de instelling plaatsvindt. Indien de schaal, bedoeld in de vorige volzin, een lager
      nummer heeft dan de hoogste aanloopschaal die behoorde bij de functie die de betrokkene vervulde op de dag
      voorafgaande aan de overgang naar de instelling, bedoeld in artikel I-A1, onder *d*13, behoudt hij, in afwijking
      van het bepaalde in de vorige volzin, uitzicht op vaststelling van zijn salaris volgens het bedrag bij het hoogste
      salarisnummer van die hoogste aanloopschaal.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-Q1101
  - number: V-Q1101.2
    text: |-
      Het bepaalde in het eerste lid is van overeenkomstige toepassing ten aanzien van de directeur of de adjunct-
      directeur die op 1 april 1989 als directeur respectievelijk als adjunct-directeur wordt verbonden aan de landelijke
      instelling het "Centrum voor de Innovatie van Beroepsonderwijs" en op wie de [Overgangsregeling CIBB][ref1] (*Stb.*
      1990, 41), met uitzondering van artikel 2 van de regeling, van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0004686
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-Q1101
    references:
      - id: ref1
        bwb_id: BWBR0004686
  - number: V-Q1102.1
    text: |-
      De betrokkene voor wie een uitzicht is vastgesteld met toepassing of overeenkomstige toepassing van een der
      artikelen V-Q401, V-Q402, V-Q701 of V-Q702 en die met ingang van de dag van overgang als bedoeld in artikel A1,
      tweede lid, van de Overgangsregeling ondersteuning VE naar een instelling als bedoeld in artikel I-A1, onder *d*13,
      vanuit de door hem beklede functie van directeur, directeur/coördinator of van adjunct-directeur is benoemd aan
      die instelling in een functie als bedoeld in paragraaf 11 van hoofdstuk I-Q behoudt, in afwijking van het bepaalde
      in artikel V-Q1101, aanspraak op vaststelling van zijn salaris overeenkomstig dat uitzicht zolang hij zonder
      wezenlijke onderbreking aan een instelling als bedoeld in artikel I-A1, onder *d*13, verbonden blijft, in een
      functie waarbij een maximumschaal hoort die tenminste gelijk is aan de maximumschaal die behoort bij de functie die
      hem is toebedeeld bij de oprichting van meergenoemde instelling.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-Q1102
  - number: V-Q1102.2
    text: |-
      Met een wezenlijke onderbreking als aangegeven in het eerste lid wordt een periode van langer dan twee maanden
      bedoeld. De tijd gedurende welke een ontslaguitkering als bedoeld in hoofdstuk I-H dan wel een uitkering als
      bedoeld in het [Besluit Werkloosheid onderwijs- en onderzoekpersoneel][ref1] wordt genoten, wordt niet als
      onderbreking aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0006445
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-Q1102
    references:
      - id: ref1
        bwb_id: BWBR0006445
  - number: V-Q1104.1
    text: |-
      De directeur of adjunct-directeur op wie het bepaalde in de Overgangsregeling gewijzigde ondersteuningsstructuur
      VE, met uitzondering van artikel A2 van dat besluit van toepassing is, behoudt bij een instelling als bedoeld in
      artikel I-A1, onder *d*13, sub *b*, waaraan hij op de dag van overgang, bedoeld in artikel A1, tweede lid, van de
      Overgangsregeling gewijzigde ondersteuningsstructuur VE, wordt verbonden als directeur respectievelijk als adjunct-
      directeur, het uitzicht op de vaststelling van zijn salaris overeenkomstig het bepaalde in de artikelen V-Q1101 en
      V-Q1102.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-Q1104
  - number: V-Q1104.2
    text: |-
      De betrokkene, bedoeld in het eerste lid, aan wie met toepassing van artikel V-Q1103 een toelage is toegekend,
      behoudt overeenkomstig het bepaalde in dat artikel die toelage bij een instelling als bedoeld in artikel I-
      A1, onder *d*13, sub *b*, waaraan hij op de dag van overgang, bedoeld in artikel I-A1, tweede lid, van de
      Overgangsregeling gewijzigde ondersteuningsstructuur VE, wordt verbonden als directeur respectievelijk als adjunct-
      directeur.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-Q1104
  - number: V-Q1201
    text: |-
      De betrokkene, bedoeld in artikel I-A1, onder *e*14, die is benoemd als lid van de centrale directie, bij wiens
      functie op 1 augustus 1990 een lagere maximumschaal behoort dan bij de functie die hij op 31 juli 1990 vervulde,
      behoudt aanspraak op bezoldiging volgens het carrièrepatroon dat behoorde bij de functie die hij op 31 juli 1990
      bekleedde, zolang hij als zodanig aan de instelling verbonden blijft, onverminderd het bepaalde in artikel V-Q1203.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-Q1201
  - number: V-Q1202
    text: |-
      Voor de betrokkene bedoeld in artikel I-A1, onder *e*14, voor wie op 31 juli 1990 artikel V-Q404, zoals dat
      artikel op die datum luidde, van toepassing was en die op 1 augustus 1990 in dienst is bij een instelling, bedoeld
      in artikel I-A1, onder *d*14, en voor wie een betrekkingsomvang van meer dan 38 uur is berekend, komt niet voor
      bezoldiging in aanmerking het verschil tussen 38 uur en de voor hem op 1 augustus 1990 geldende betrekkingsomvang.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-Q1202
  - number: V-Q1203.1
    text: |-
      Op de betrokkene bedoeld in artikel I-A1, onder *e*14, voor wie op 31 juli 1990 een of meer der artikelen V-
      Q402, V-Q403, V-Q405, V-Q406, V-R402, eerste en tweede lid, V-R403, V-R404, V-R404*a*, V-R407 en V-R408, zoals die
      artikelen op die datum luidden, van toepassing waren, zijn de artikelen V-P6, V-Q401, V-Q402, V-Q405, V-Q406, V-
      R401, V-R402, V-R403, V-R405 en V-R406 van overeenkomstig toepassing.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-Q1203
  - number: V-Q1203.2
    text: |-
      De betrokkene bedoeld in artikel I-A1, onder *e*14, die op 31 juli 1990 en 1 augustus 1990 bij de instelling dan
      wel een instelling als bedoeld in artikel I-Q101, onderdeel *c* onder 3, in dienst is en voor wie op 31 juli 1990
      een of meer der artikelen V-Q402, V-Q403, V-Q406, V-R404 en V-R408, zoals die artikelen op die datum luidden, van
      toepassing waren, behoudt de in die artikelen bedoelde aanspraak indien hij op of na 1 augustus 1990 vrijwillig een
      functie aanvaardt met een maximumschaal die ten hoogste één lager is dan de maximumschaal bij de functie die hij op
      31 juli 1990 bekleedde, mits:
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-Q1203
  - number: V-Q1203.2.a
    text: |-
      in de door hem niet aanvaarde dan wel nadien opgegeven functie een andere betrokkene wordt benoemd die boventallig
      is en
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-Q1203
  - number: V-Q1203.2.b
    text: |-
      die andere betrokkene een aanspraak heeft als bedoeld in de in de aanhef genoemde artikelen die tenminste gelijk is
      aan het maximumsalaris van de maximumschaal van de functie die behoort bij de functie waarin hij wordt benoemd en
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-Q1203
  - number: V-Q1203.2.c
    text: de boventalligheid aan een instelling als bedoeld in artikel I-A1, onder *d*14, wordt verminderd en
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-Q1203
  - number: V-Q1203.2.d
    text: |-
      in een verticale scholengemeenschap: het verschil in salaris van de in het gestelde onder *a* bedoelde beide
      betrokkenen niet meer bedraagt dan twee periodieke verhogingen.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-Q1203
  - number: V-Q1204.1
    text: |-
      De artikelen V-Q1201 tot en met V-Q1203 zijn niet van toepassing op de adjunct-directeur, bedoeld in artikel I-
      Q1209.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-Q1204
  - number: V-Q1204.2
    text: |-
      Op de in het eerste lid bedoelde adjunct-directeur zijn de artikelen V-Q401 tot en met V-Q409 van overeenkomstige
      toepassing.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-Q1204
  - number: V-Q1205
    text: |-
      De betrokkene die op 31 juli 1993 benoemd is als lid van de centrale directie in een scholengemeenschap op grond
      van artikel I-Q1202 zoals dat artikel op 31 juli 1993 luidde, behoudt op 1 augustus 1993 in afwijking van het
      bepaalde in de artikelen I-Q1202, I-Q1402 en I-Q1502 aanspraak op een plaats in de centrale directie, indien voor
      hem geen formatieplaats beschikbaar blijkt te zijn als gevolg van op grond van deze artikelen minder beschikbaar
      komende formatie dan voorheen op grond van artikel I-Q1202.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-Q1205
  - number: V-Q1301
    text: |-
      De betrokkene, bedoeld in artikel I-A1, onder *e*15, die is benoemd als lid van de centrale directie, bij wiens
      functie op 1 augustus 1990 een lagere maximumschaal behoort dan bij de functie die hij op 31 juli 1990 vervulde,
      behoudt aanspraak op bezoldiging volgens het carrièrepatroon dat behoorde bij de functie die hij op 31 juli 1990
      bekleedde, zolang hij als zodanig aan de instelling verbonden blijft, onverminderd het bepaalde in artikel V-Q1303.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-Q1301
  - number: V-Q1302
    text: |-
      Voor de betrokkene bedoeld in artikel I-A1, onder *e*15, voor wie op 31 juli 1990 artikel V-Q404, zoals dat
      artikel op die datum luidde, van toepassing was en die op 1 augustus 1990 in dienst is bij een instelling, bedoeld
      in artikel I-A1, onder *d*15, en voor wie een betrekkingsomvang van meer dan 38 uur is berekend, komt niet voor
      bezoldiging in aanmerking het verschil tussen 38 uur en de voor hem op 1 augustus 1990 geldende betrekkingsomvang.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-Q1302
  - number: V-Q1303.1
    text: |-
      Op de betrokkene bedoeld in artikel I-A1, onder *e*15, voor wie op 31 juli 1990 een of meer der artikelen V-
      Q402, V-Q403, V-Q405, V-Q406, V-R402, eerste en tweede lid, V-R403, V-R404, V-R404*a*, V-R407 en V-R408 zoals die
      artikelen op die datum luidden, van toepassing waren, zijn de artikelen V-P6, V-Q401, V-Q402, V-Q405, V-Q406, V-
      R401, V-R402, V-R403, V-R405 en V-R406 van overeenkomstig toepassing.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-Q1303
  - number: V-Q1303.2
    text: |-
      De betrokkene bedoeld in artikel I-A1, onder *e*15 die op 31 juli 1990 en 1 augustus 1990 bij de instelling in
      dienst is en voor wie op 31 juli 1990 een of meer der artikelen V-Q402, V-Q403, V-Q406, V-R404 en V-R408, zoals die
      artikelen op die datum luidden, van toepassing waren, behoudt de in die artikelen bedoelde aanspraak indien hij op
      of na 1 augustus 1990 vrijwillig een functie aanvaardt met een maximumschaal die ten hoogste één lager is dan de
      maximumschaal bij de functie die hij op 31 juli 1990 bekleedde, mits:
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-Q1303
  - number: V-Q1303.2.a
    text: |-
      in de door hem niet aanvaarde dan wel nadien opgegeven functie een andere betrokkene wordt benoemd die boventallig
      is en
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-Q1303
  - number: V-Q1303.2.b
    text: |-
      die andere betrokkene een aanspraak heeft als bedoeld in de in de aanhef genoemde artikelen die tenminste gelijk is
      aan het maximumsalaris van de maximumschaal van de functie die behoort bij de functie waarin hij wordt benoemd en
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-Q1303
  - number: V-Q1303.2.c
    text: de boventalligheid aan een instelling als bedoeld in artikel I-A1, onder *d*15, wordt verminderd en
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-Q1303
  - number: V-Q1303.2.d
    text: |-
      het verschil in salaris van de in het gestelde onder *a* bedoelde beide betrokkenen niet meer bedraagt dan twee
      periodieke verhogingen.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-Q1303
  - number: V-Q1401
    text: |-
      De betrokkene, bedoeld in artikel I-A1, onder *e*17, die is benoemd als lid van de centrale directie, bij wiens
      functie op 1 augustus 1993 een lagere maximumschaal behoort dan bij de functie die hij op 31 juli 1993 vervulde,
      behoudt aanspraak op bezoldiging volgens het carrièrepatroon dat behoorde bij de functie die hij op 31 juli 1993
      bekleedde, zolang hij als zodanig aan de instelling verbonden blijft, onverminderd het bepaalde in artikel V-Q1403.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-Q1401
  - number: V-Q1402
    text: |-
      De betrokkene bedoeld in artikel I-A1, onder *e*17, voor wie op 31 juli 1993 artikel V-Q404, zoals dat artikel op
      die datum luidde, van toepassing was en die op 1 augustus 1993 in dienst is bij een instelling, bedoeld in artikel
      I-A1, onder *d*17, en voor wie een betrekkingsomvang van meer dan 38 uur is berekend, komt niet voor bezoldiging in
      aanmerking voor het verschil tussen 38 uur en de voor hem op 1 augustus 1993 geldende betrekkingsomvang.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-Q1402
  - number: V-Q1403
    text: |-
      Op de betrokkene bedoeld in artikel I-A1, onder *e*17, voor wie tot en met 31 juli 1993 op grond van artikel IV,
      onderdeel 3, onder *a*, sub 1, van het besluit van 3 juli 1992 (*Stb* 1992, 389) (Formatiebudgetsysteem) een of
      meer van de artikelen V-Q402, V-Q403, V-Q405, V-Q406, V-R402, eerste en tweede lid, V-R403, V-R404, V-R404*a*, V-
      R407 en V-R408, van toepassing zijn gebleven, zijn de artikelen V-P6, V-Q401, V-Q402, V-Q405, V-Q406, V-R401, V-
      R402, V-R403, V-R405 en V-R406 van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-Q1403
  - number: V-Q1404.1
    text: |-
      De artikelen V-Q1401 tot en met V-Q1403 zijn niet van toepassing op de adjunct-directeur, bedoeld in artikel I-
      Q1409.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-Q1404
  - number: V-Q1404.2
    text: |-
      Op de in het eerste lid bedoelde adjunct-directeur zijn de artikelen V-Q401 tot en met V-Q409 van overeenkomstige
      toepassing.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-Q1404
  - number: V-Q1501
    text: |-
      De betrokkene, bedoeld in artikel I-A1, onder *e*18, die is benoemd als lid van de centrale directie, bij wiens
      functie op 1 augustus 1993 een lagere maximumschaal behoort dan bij de functie die hij op 31 juli 1993 vervulde,
      behoudt aanspraak op bezoldiging volgens het carrièrepatroon dat behoorde bij de functie die hij op 31 juli 1993
      bekleedde, zolang hij als zodanig aan de instelling verbonden blijft, onverminderd het bepaalde in artikel V-Q1503.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-Q1501
  - number: V-Q1502
    text: |-
      De betrokkene bedoeld in artikel I-A1, onder *e*18, voor wie op 31 juli 1993 artikel V-Q404, zoals dat artikel op
      die datum luidde, van toepassing was en die op 1 augustus 1993 in dienst is bij een instelling, bedoeld in artikel
      I-A1, onder *d*18, en voor wie een betrekkingsomvang van meer dan 38 uur is berekend, komt niet voor bezoldiging in
      aanmerking het verschil tussen 38 uur en de voor hem op 1 augustus 1993 geldende betrekkingsomvang.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-Q1502
  - number: V-Q1503
    text: |-
      Op de betrokkene bedoeld in artikel I-A1, onder *d*17, voor wie tot en met 31 juli 1993 op grond van artikel IV,
      onderdeel 3, onder *a*, sub 1, van het besluit van 3 juli 1992 (*Stb* 1992, 389) (Formatiebudgetsysteem) een of
      meer van de artikelen V-Q402, V-Q403, V-Q405, V-Q406, V-R402, eerste en tweede lid, V-R403, V-R404, V-R404*a*, V-
      R407 en V-R408, van toepassing zijn gebleven, zijn de artikelen V-P6, V-Q401, V-Q402, V-Q405, V-Q406, V-R401, V-
      R402, V-R403, V-R405 en V-R406 van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-Q1503
  - number: V-Q1504.1
    text: |-
      De artikelen V-Q1501 tot en met V-Q1503 zijn niet van toepassing op de adjunct-directeur, bedoeld in artikel I-
      Q1509.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-Q1504
  - number: V-Q1504.2
    text: |-
      Op de in het eerste lid bedoelde adjunct-directeur zijn de artikelen V-Q401 tot en met V-Q409 van overeenkomstige
      toepassing.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-Q1504
  - number: V-R101.1
    text: |-
      De betrokkene aan wie op grond van het bepaalde in [artikel B3 van het Besluit overgangsmaatregelen b.o. 1985][ref1],
      in [artikel B4 van het Besluit overgangsmaatregelen s.o. 1985][ref2], in artikel B6 van het Besluit
      overgangsmaatregelen lw. 1985 of in artikel B9 van de Beschikking overgangsmaatregelen a.l.o. 1985 extra taakomvang
      is toegekend, behoudt aanspraak op toekenning daarvan zolang hij in een functie bedoeld in hoofdstuk I-R en
      waarvoor eenzelfde maximumschaal geldt als voor de functie waarin hem op 31 december 1991 extra taakomvang was
      toegekend bij dezelfde instelling verbonden blijft.


      [ref1]: https://wetten.overheid.nl/BWBR0003807
      [ref2]: https://wetten.overheid.nl/BWBR0003808
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-R101
    references:
      - id: ref1
        bwb_id: BWBR0003807
      - id: ref2
        bwb_id: BWBR0003808
  - number: V-R101.2
    text: |-
      Indien de betrekkingsomvang van een betrokkene bij het bevoegd gezag waarbij hem extra taakomvang is toegekend,
      toeneemt dan wel indien de totale betrekkingsomvang in al zijn betrekkingen tezamen toeneemt, wordt de hem
      ingevolge het eerste lid toegekende extra taakomvang verminderd met eenzelfde hoeveelheid als waarmee zijn
      betrekkingsomvang is toegenomen, echter tot ten hoogste de omvang van die extra taakomvang. Het bepaalde in de
      eerste volzin geldt niet ten aanzien van een toename in verband met vervangingswerkzaamheden.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-R101
  - number: V-R101.3
    text: |-
      Indien formatieruimte in de functie van leraar ontstaat, wordt die ruimte toegedeeld aan de leraar aan wie extra
      taakomvang is toegekend in deze functie voor de omvang van die taakomvang, met dien verstande dat de totale omvang
      van de betrekking niet mag uitgaan boven de omvang van een normbetrekking.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-R101
  - number: V-R101.4
    text: |-
      De bezoldiging voor de extra taakomvang, bedoeld in het eerste lid, van de betrokkene wiens betrekkingsomvang
      wegens vervangingswerkzaamheden is toegenomen, wordt verminderd met de bezoldiging die voortvloeit uit
      de vervangingswerkzaamheden voor zolang hij die bezoldiging geniet en voor zover die werkzaamheden de
      betrekkingsomvang zoals daags voor de aanvang van de vervangingswerkzaamheden vermeld in zijn akte van benoeming -
      indien hij aan instellingen van verschillende bevoegde gezagsorganen is benoemd: akten van benoeming - bedoeld in
      artikel I-B7, te boven gaan, onverminderd het bepaalde in artikel I-P87.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-R101
  - number: V-R101.5
    text: |-
      De aan een betrokkene toegekende fictieve extra taakomvang blijft buiten beschouwing bij de toepassing van artikel
      I-P78.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-R101
  - number: V-R102.1
    text: |-
      De betrokkene, bedoeld in artikel I-A1, onder e1, e2 en e16, die op 31 december 1999 was benoemd in een functie als
      bedoeld in hoofdstuk I-R en die op 1 januari 2000 in diezelfde functie blijft benoemd, heeft onverminderd artikel
      I-R103, eerste lid, en met inachtneming van het voor hem geldende carrièrepatroon met ingang van 1 januari 2000
      aanspraak op een salarisbedrag dat is gelegen onmiddellijk boven het bedrag dat hij op 31 december 1999 genoot
      indien:
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-R102
  - number: V-R102.1.a
    text: |-
      hij op 31 december 1999 op grond van artikel I-R107, eerste lid, voor het tweede of derde achtereenvolgende
      schooljaar werd bezoldigd naar het hoogste bedrag in de bij zijn functie behorende aanloopschaal;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-R102
  - number: V-R102.1.b
    text: |-
      hij op 31 december 1999 op grond van artikel I-R107, tweede lid, voor het tweede achtereenvolgende schooljaar werd
      bezoldigd naar het hoogste bedrag in de hoogste bij zijn functie behorende aanloopschaal of
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-R102
  - number: V-R102.1.c
    text: |-
      hij op 31 december 1999 werd bezoldigd naar een bedrag van de bij zijn functie behorende maximumschaal anders dan
      het maximumsalaris.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-R102
  - number: V-R102.2
    text: |-
      De betrokkene, bedoeld in het eerste lid, aanhef, heeft met ingang van 1 januari 2000 aanspraak op een toelage als
      bedoeld in bijlage 2, onderdeel 6, overeenkomstig de bij de functie behorende maximumschaal, indien:
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-R102
  - number: V-R102.2.a
    text: |-
      hij op 31 december 1999 werd bezoldigd naar het maximumsalaris van de bij zijn functie behorende maximumschaal als
      bedoeld in hoofdstuk I-R of
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-R102
  - number: V-R102.2.b
    text: |-
      hij op 31 december 1999 werd bezoldigd naar een salaris overeenkomstig het voor hem op grond van artikel V-R201,
      V-R301 of V-R401 vastgestelde uitzicht dan wel op die datum werd bezoldigd op grond van artikel V-P1, tweede lid,
      tweede volzin en derde volzin.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-R102
  - number: V-R102.3
    text: |-
      De betrokkene die op grond van het eerste lid aanspraak maakte op een salarisverhoging, en die in de functie,
      bedoeld in het eerste lid, blijft benoemd, heeft met ingang van 1 augustus van het jaar, bedoeld in bijlage 2,
      onderdeel 7, aanspraak op een toelage als bedoeld in bijlage 2, onderdeel 6, overeenkomstig de bij de functie
      behorende maximumschaal.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-R102
  - number: V-R102.4
    text: |-
      De betrokkene die geen aanspraak maakte op een salarisverhoging op grond van het eerste lid, uitsluitend om de
      reden dat hij op 1 januari 2000 niet voldeed aan de promotiecriteria, bedoeld in artikel I-R103, eerste lid, en in
      de functie, bedoeld in het eerste lid, blijft benoemd, heeft met ingang van 1 augustus volgend op het jaar waarin
      hij is bezoldigd naar het maximumsalaris van de bij zijn functie behorende maximumschaal aanspraak op de op hem
      van toepassing zijnde toelage, bedoeld in bijlage 2, onderdeel 6, indien hij vóór 1 augustus 2001 alsnog aan die
      promotiecriteria voldoet.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-R102
  - number: V-R102.5
    text: |-
      De betrokkene die op grond van het tweede, het derde of het vierde lid aanspraak heeft op een maandelijkse toelage
      en die op enig moment na 1 januari 2000 wordt benoemd in een functie als bedoeld in hoofdstuk I-R met dezelfde
      maximumschaal als welke direct voorafgaand aan die benoeming voor hem gold, behoudt die aanspraak. De tijd
      gedurende welke een uitkering ingevolge het Besluit Werkloosheid onderwijs- en onderzoekpersoneel werd genoten,
      wordt niet als onderbreking van het dienstverband aangemerkt.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-R102
  - number: V-R102.6
    text: |-
      De toelage, bedoeld in het tweede, het derde, het vierde en het vijfde lid, bedraagt een evenredig deel van
      het in bijlage 2, onderdeel 6, bedoelde maandbedrag rekenkundig afgerond op centen, indien de betrokkene een
      betrekkingsomvang anders dan een normbetrekking heeft.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-R102
  - number: V-R103.1
    text: |-
      Van de betrokkene, bedoeld in artikel I-A1, onder e1, e2 en e16, die op 31 december 1999 was benoemd in een functie
      als bedoeld in hoofdstuk I-R en die op 1 januari 2000 wordt benoemd in een functie als bedoeld in hoofdstuk I-
      R of een functie als bedoeld in hoofdstuk I-Q of I-S, wordt ten behoeve van de vaststelling van het salaris in
      de nieuwe functie, het in die vorige onderwijsfunctie genoten salaris onverminderd artikel I-R103, eerste lid, en
      met inachtneming van het toen voor hem geldende carrièrepatroon, vastgesteld op een salarisbedrag dat is gelegen
      onmiddellijk boven het bedrag dat hij op 31 december 1999 genoot indien is voldaan aan een van de voorwaarden,
      bedoeld in artikel V-R102, eerste lid, onder a, b en c. De eerste volzin is niet van toepassing op de betrokkene
      die wordt benoemd in een functie als bedoeld in artikel I-P9, tweede lid.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-R103
  - number: V-R103.2
    text: |-
      Op de betrokkene, bedoeld in het eerste lid, aanhef, die op 1 januari 2000 wordt benoemd in een functie als bedoeld
      in hoofdstuk I-R met dezelfde maximumschaal als welke direct voorafgaand aan die benoeming voor hem gold, is
      artikel V-R102, tweede lid, van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-R103
  - number: V-R103.3
    text: |-
      Op de betrokkene die op 1 januari 2000 wordt benoemd in een functie als bedoeld in hoofdstuk I-R met dezelfde
      maximumschaal als welke direct voorafgaand aan die benoeming voor hem gold, en wiens salaris op grond van het
      eerste lid hoger werd vastgesteld en die voorts in diezelfde functie blijft benoemd, is artikel V-R102, derde lid,
      van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-R103
  - number: V-R103.4
    text: |-
      Op de betrokkene die op 1 januari 2000 wordt benoemd in een functie als bedoeld in hoofdstuk I-R met dezelfde
      maximumschaal als welke direct voorafgaand aan die benoeming voor hem gold, en wiens salaris niet hoger werd
      vastgesteld op grond van het eerste lid, uitsluitend om de reden dat hij op 1 januari 2000 niet voldeed aan de
      promotiecriteria, bedoeld in artikel I-R103, eerste lid, en die voorts in diezelfde functie blijft benoemd, is
      artikel V-R102, vierde lid, van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-R103
  - number: V-R103.5
    text: |-
      De betrokkene die op grond van het tweede, het derde of het vierde lid aanspraak heeft op een maandelijkse toelage
      en die op enig moment na 1 januari 2000 wordt benoemd in een functie als bedoeld in hoofdstuk I-R met dezelfde
      maximumschaal als welke direct voorafgaand aan die benoeming voor hem gold, behoudt die aanspraak. De tijd
      gedurende welke een uitkering ingevolge het Besluit Werkloosheid onderwijs- en onderzoekpersoneel werd genoten,
      wordt niet als onderbreking van het dienstverband aangemerkt.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-R103
  - number: V-R103.6
    text: |-
      De toelage, bedoeld in het tweede, het derde, het vierde en het vijfde lid, bedraagt een evenredig deel van
      het in bijlage 2, onderdeel 6, bedoelde maandbedrag rekenkundig afgerond op centen, indien de betrokkene een
      betrekkingsomvang anders dan een normbetrekking heeft.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-R103
  - number: V-R201.1
    text: |-
      De betrokkene voor wie als leraar met toepassing van
      [artikel C1 van het Besluit overgangsmaatregelen b.o. 1985][ref1] een uitzicht is vastgesteld, behoudt aanspraak
      op vaststelling van zijn salaris overeenkomstig dat uitzicht, zolang hij zonder wezenlijke onderbreking werkzaam
      blijft in een functie als bedoeld in hoofdstuk I-Q of I-R in het basisonderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0003807#ArtikelC1
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-R201
    references:
      - id: ref1
        bwb_id: BWBR0003807
        artikel: C1
  - number: V-R201.2
    text: |-
      Met een wezenlijke onderbreking als aangegeven in het eerste lid, wordt een periode van langer dan twee maanden
      bedoeld. De tijd gedurende welke een ontslaguitkering als bedoeld in hoofdstuk I-H dan wel een uitkering als
      bedoeld in het [Besluit Werkloosheid onderwijs- en onderzoekpersoneel][ref1] wordt genoten, wordt niet als
      onderbreking aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0006445
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-R201
    references:
      - id: ref1
        bwb_id: BWBR0006445
  - number: V-R201.3
    text: |-
      Ten aanzien van de leraar die op 1 augustus 1985 in het genot is van een ontslaguitkering en voor wie met
      toepassing van [artikel C5 van het Besluit overgangsmaatregelen b.o. 1985][ref1] een uitzicht is vastgesteld, is
      het bepaalde in het eerste en tweede lid van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003807#ArtikelC5
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-R201
    references:
      - id: ref1
        bwb_id: BWBR0003807
        artikel: C5
  - number: V-R201.4
    text: |-
      Zolang de betrokkene bedoeld in het eerste tot en met het derde lid is benoemd in een functie waarvan het
      maximumsalaris lager is dan het voor hem ingevolge [artikel C1 van het Besluit overgangsmaatregelen b.o. 1985][ref1]
      vastgestelde uitzicht, is hij ontheven van de verplichting te voldoen aan de promotiecriteria, bedoeld in artikel
      I-R103.


      [ref1]: https://wetten.overheid.nl/BWBR0003807#ArtikelC1
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-R201
    references:
      - id: ref1
        bwb_id: BWBR0003807
        artikel: C1
  - number: V-R301.1
    text: |-
      De betrokkene voor wie als leraar met toepassing van
      [artikel C1 van het Besluit overgangsmaatregelen s.o. 1985][ref1] een uitzicht is vastgesteld, behoudt aanspraak
      op vaststelling van zijn salaris overeenkomstig dat uitzicht, zolang hij zonder wezenlijke onderbreking werkzaam
      blijft in een functie als bedoeld in hoofdstuk I-Q of I-R in het onderwijs, genoemd in de tweede volzin,. Onder
      onderwijs als bedoeld in de eerste volzin wordt verstaan: het speciaal onderwijs of het voortgezet speciaal
      onderwijs als bedoeld in de [Wet op de expertisecentra][ref2], het voortgezet speciaal onderwijs als bedoeld in
      [deel II van de Wet op het voortgezet onderwijs](onbekend), het onderwijs aan speciale scholen voor basisonderwijs,
      al dan niet met een afdeling, als bedoeld in de [Wet op het primair onderwijs][ref3] en het onderwijs aan scholen
      voor praktijkonderwijs als bedoeld in [deel I van de Wet op het voortgezet onderwijs](onbekend). Ten aanzien van
      de leraar aan een speciale school voor basisonderwijs wordt onder onderwijs als bedoeld in de eerste volzin mede
      verstaan het onderwijs aan basisscholen als bedoeld in de [Wet op het primair onderwijs][ref4] in een functie met
      een maximumschaal die ten minste gelijk is aan schaal 10.


      [ref1]: https://wetten.overheid.nl/BWBR0003808#ArtikelC1
      [ref2]: https://wetten.overheid.nl/BWBR0003549
      [ref3]: https://wetten.overheid.nl/BWBR0003420
      [ref4]: https://wetten.overheid.nl/BWBR0003420
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-R301
    references:
      - id: ref1
        bwb_id: BWBR0003808
        artikel: C1
      - id: ref2
        bwb_id: BWBR0003549
      - id: ref3
        bwb_id: BWBR0003420
      - id: ref4
        bwb_id: BWBR0003420
  - number: V-R301.2
    text: |-
      Zonodig in afwijking van het bepaalde in het eerste lid vervalt voor de betrokkene de aanspraak op vaststelling
      van zijn salaris overeenkomstig het uitzicht bedoeld in artikel C1, vijfde lid, van het in het eerste lid
      genoemde Besluit, met ingang van de datum waarop hij niet langer werkzaam is aan een school voor voortgezet
      speciaal onderwijs of een school of instelling voor speciaal en voortgezet speciaal onderwijs als bedoeld in de
      [Wet op de expertisecentra][ref1], een school voor voortgezet speciaal onderwijs als bedoeld in [deel II van de Wet
      op het voortgezet onderwijs](onbekend), een speciale school voor basisonderwijs met een afdeling voor voortgezet
      speciaal onderwijs als bedoeld in de [Wet op het primair onderwijs][ref2] of een school voor praktijkonderwijs als
      bedoeld in [deel I van de Wet op het voortgezet onderwijs](onbekend).


      [ref1]: https://wetten.overheid.nl/BWBR0003549
      [ref2]: https://wetten.overheid.nl/BWBR0003420
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-R301
    references:
      - id: ref1
        bwb_id: BWBR0003549
      - id: ref2
        bwb_id: BWBR0003420
  - number: V-R301.3
    text: |-
      De betrokkene voor wie als leraar een uitzicht is vastgesteld als bedoeld in artikel C1, vijfde lid, van het in
      het eerste lid genoemde Besluit en die op grond van het bepaalde in het tweede lid zijn aanspraak op vaststelling
      van zijn salaris overeenkomstig dit uitzicht verliest, verkrijgt daarna slechts aanspraak op vaststelling van zijn
      salaris overeenkomstig het uitzicht bedoeld in artikel C1, vijfde lid , van het in het eerste lid genoemde Besluit,
      indien hij vóór 1 augustus 2000 een functie bedoeld in hoofdstuk I-R met maximumschaal 10 aanvaardt aan een school
      voor voortgezet speciaal onderwijs of een school of instelling voor speciaal en voortgezet speciaal onderwijs
      als bedoeld in de [Wet op de expertisecentra][ref1], een school voor voortgezet speciaal onderwijs als bedoeld
      in [deel II van de Wet op het voortgezet onderwijs](onbekend), een afdeling voor voortgezet speciaal onderwijs
      van een speciale school voor basisonderwijs als bedoeld in de [Wet op het primair onderwijs][ref2] of een school
      voor praktijkonderwijs als bedoeld in [deel I van de Wet op het voortgezet onderwijs](onbekend), mits hij vanaf
      1 augustus 1985 zonder wezenlijke onderbreking werkzaam is geweest in een functie in het speciaal onderwijs het
      voortgezet speciaal onderwijs of het voortgezet onderwijs, als bedoeld in de Interimwet op het speciaal onderwijs
      en het voortgezet speciaal onderwijs, onderscheidenlijk het onderwijs als bedoeld in de eerste volzin van het
      eerste lid” als bedoeld in de [Wet op het voortgezet onderwijs][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003549
      [ref2]: https://wetten.overheid.nl/BWBR0003420
      [ref3]: https://wetten.overheid.nl/BWBR0002399
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-R301
    references:
      - id: ref1
        bwb_id: BWBR0003549
      - id: ref2
        bwb_id: BWBR0003420
      - id: ref3
        bwb_id: BWBR0002399
  - number: V-R301.4
    text: |-
      Met een wezenlijke onderbreking als aangegeven in het eerste en derde lid, wordt een periode van langer dan twee
      maanden bedoeld. De tijd gedurende welke een ontslaguitkering als bedoeld in hoofdstuk I-H dan wel een uitkering
      als bedoeld in het [Besluit Werkloosheid onderwijs- en onderzoekpersoneel][ref1] wordt genoten, wordt niet als
      onderbreking aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0006445
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-R301
    references:
      - id: ref1
        bwb_id: BWBR0006445
  - number: V-R301.5
    text: |-
      Ten aanzien van de betrokkene die op 1 augustus 1985 in het genot is van een ontslaguitkering en voor wie als
      leraar met toepassing van [artikel C5 van het Besluit overgangsmaatregelen s.o. 1985][ref1] een uitzicht is
      vastgesteld, is het bepaalde in de voorgaande leden van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003808#ArtikelC5
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-R301
    references:
      - id: ref1
        bwb_id: BWBR0003808
        artikel: C5
  - number: V-R301.6
    text: |-
      Zolang de betrokkene bedoeld in het eerste tot en met het vijfde lid is benoemd in een functie waarvan het
      maximumsalaris lager is dan het voor hem ingevolge [artikel C1 van het Besluit overgangsmaatregelen s.o. 1985][ref1]
      vastgestelde uitzicht, is hij ontheven van de verplichting te voldoen aan de promotiecriteria, bedoeld in artikel
      I-R103.


      [ref1]: https://wetten.overheid.nl/BWBR0003808#ArtikelC1
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-R301
    references:
      - id: ref1
        bwb_id: BWBR0003808
        artikel: C1
  - number: V-R401.1
    text: |-
      De betrokkene die werkzaam is in een functie als bedoeld in hoofdstuk I-R aan een speciale school voor
      basisonderwijs met een afdeling voor voortgezet speciaal onderwijs en voor wie een salarisuitzicht geldt als
      bedoeld in [artikel C1, vijfde lid, van het Besluit overgangsmaatregelen s.o. 1985][ref1], behoudt aanspraak op
      vaststelling van zijn salaris overeenkomstig dat uitzicht indien hij werkzaam blijft aan genoemde school nadat
      de afdeling ervan is omgevormd tot of samengevoegd met een school voor voortgezet onderwijs. De aanspraak blijft
      voorts behouden indien de betrokkene uit hoofde van zijn bestuursbenoeming werkzaamheden gaat verrichten ten
      behoeve van andere scholen van hetzelfde bevoegd gezag.


      [ref1]: https://wetten.overheid.nl/BWBR0003808#ArtikelC1
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-R401
    references:
      - id: ref1
        bwb_id: BWBR0003808
        artikel: C1
  - number: V-R401.2
    text: |-
      De betrokkene die is benoemd in een functie als bedoeld in hoofdstuk I-R ten behoeve van
      het verrichten van werkzaamheden aan een speciale school voor basisonderwijs en voor wie
      een aanspraak op bezoldiging geldt als bedoeld in artikel I-Q306 of een salarisuitzicht
      als bedoeld in [artikel C1 van het Besluit overgangsmaatregelen s.o. 1985][ref1],
      behoudt die aanspraak, onderscheidenlijk dat uitzicht bij een herplaatsing overeenkomstig
      __REF001___________________________________________________________________________________________________________
      ___________________________________________________________________________________________________________________
      ________________________ (Stb. 1998, 228). De aanspraak geldt zolang de betrokkene bij het bevoegd gezag waarbij
      hij is herplaatst in dezelfde functie benoemd blijft. Indien de betrokkene uit deze functie ontslag wordt verleend,
      wordt hij voor de toepassing van artikel V-R301 in deze functie geacht benoemd te zijn gebleven in de functie die
      hij vervulde voordat hij in eerstgenoemde functie werd benoemd.


      [ref1]: https://wetten.overheid.nl/BWBR0003808#ArtikelC1
      [ref2]: https://wetten.overheid.nl/BWBR0009525#ArtikelXLII
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-R401
    references:
      - id: ref1
        bwb_id: BWBR0003808
        artikel: C1
      - id: ref2
        bwb_id: BWBR0009525
        artikel: XLII
  - number: V-R401.3
    text: |-
      De betrokkene die is benoemd in een functie als bedoeld in hoofdstuk I-R ten behoeve van het verrichten van
      werkzaamheden aan een speciale school voor basisonderwijs en voor wie een salarisgarantie geldt uit hoofde van
      een samenvoeging van scholen, behoudt die garantie bij een herplaatsing als bedoeld in het tweede lid. Deze
      garantie geldt zolang de betrokkene bij het bevoegd gezag waarbij hij is herplaatst in dezelfde functie benoemd
      blijft. De garantie blijft behouden indien de betrokkene in aansluiting op deze functie een andere functie in
      het onderwijs aanvaardt, waarvan het salarisniveau hoger is dan dat behorende bij de functie die hij vervulde
      voorafgaand aan zijn herplaatsing als bedoeld in het tweede lid, en wel voor de duur van de benoeming in die
      andere functie. Indien de benoeming in deze andere functie in tijdelijke dienst geschiedt, blijft de garantie
      behouden als in aansluiting op deze benoeming een benoeming plaatsvindt in een functie in het onderwijs,
      waarvan het salarisniveau tenminste gelijk is aan dat behorende bij de functie die hij vervulde voorafgaand
      aan zijn herplaatsing als bedoeld in het tweede lid. Onder onderwijs als bedoeld in dit lid wordt verstaan:
      het onderwijs als bedoeld in de [Wet op het primair onderwijs][ref1], de [Wet op de expertisecentra][ref2]
      of [deel II van de Wet op het voortgezet onderwijs][ref3], onderscheidenlijk het onderwijs aan scholen voor
      praktijkonderwijs als bedoeld in [deel I van de Wet op het voortgezet onderwijs][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0003420
      [ref2]: https://wetten.overheid.nl/BWBR0003549
      [ref3]: https://wetten.overheid.nl/BWBR0002399
      [ref4]: https://wetten.overheid.nl/BWBR0002399
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-R401
    references:
      - id: ref1
        bwb_id: BWBR0003420
      - id: ref2
        bwb_id: BWBR0003549
      - id: ref3
        bwb_id: BWBR0002399
      - id: ref4
        bwb_id: BWBR0002399
  - number: V-R401.4
    text: |-
      De betrokkene die is benoemd in een functie als bedoeld in hoofdstuk I-R ten behoeve van het verrichten van
      werkzaamheden aan een school voor voortgezet speciaal onderwijs aan moeilijk lerende kinderen of een afdeling
      voor voortgezet speciaal onderwijs aan moeilijk lerende kinderen van een speciale school voor basisonderwijs
      en voor wie een aanspraak of garantie geldt als bedoeld in het tweede of derde lid, behoudt die aanspraak
      of garantie indien genoemde afdeling wordt omgevormd tot een school voor praktijkonderwijs als bedoeld in
      [deel I van de Wet op het voortgezet onderwijs][ref1] en zijn benoeming wordt voortgezet ten behoeve van het
      verrichten van werkzaamheden aan die school. Het tweede lid, tweede en derde volzin, en het derde lid, tweede tot
      en met vijfde volzin, zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002399
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-R401
    references:
      - id: ref1
        bwb_id: BWBR0002399
  - number: V-R601.1
    text: |-
      De consulent voor wie met toepassing van hoofdstuk C van het Besluit overgangsmaatregelen lw. 1985 een uitzicht
      is vastgesteld en die met ingang van 1 april 1985 wordt benoemd in een functie waarin het hoogste bedrag in de
      daarbij behorende maximumschaal lager is dan dat uitzicht, behoudt, behoudens het bepaalde in het tweede lid,
      aanspraak op vaststelling van zijn salaris overeenkomstig dat uitzicht, zolang hij zonder wezenlijke onderbreking
      werkzaam blijft bij het leerlingwezen in een functie waarvan het maximumsalaris niet lager is dan het bij zijn
      huidige functie behorende maximumsalaris en waarvan het maximumsalaris lager is dan het bedrag van het voor hem
      vastgestelde uitzicht.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-R601
  - number: V-R601.2
    text: |-
      De consulent, bedoeld in het eerste lid die na 1 april 1985 een functie aanvaardt met een hoger maximumsalaris dan
      het bedrag van het voor hem vastgestelde uitzicht, behoudt nadien de aanspraak op vaststelling van zijn salaris
      overeenkomstig het voor hem vastgestelde uitzicht slechts indien hij uit die functie met een hoger maximumsalaris
      wordt ontslagen met recht op een ontslaguitkering als bedoeld in hoofdstuk I-H dan wel een uitkering als bedoeld
      in het [Besluit Werkloosheid onderwijs- en onderzoekpersoneel][ref1] en hij daarna zonder wezenlijke onderbreking,
      doch vóór 1 april 2000 een functie aanvaardt met een maximumsalaris dat lager is dan het voor hem vastgestelde
      uitzicht.


      [ref1]: https://wetten.overheid.nl/BWBR0006445
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-R601
    references:
      - id: ref1
        bwb_id: BWBR0006445
  - number: V-R601.3
    text: |-
      Met een wezenlijke onderbreking als aangegeven in het eerste en het tweede lid wordt een periode van langer dan
      twee maanden bedoeld. De tijd gedurende welke een ontslaguitkering als bedoeld in hoofdstuk I-H dan wel als bedoeld
      in het [Besluit Werkloosheid onderwijs- en onderzoekpersoneel][ref1] wordt genoten, wordt niet als onderbreking
      aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0006445
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-R601
    references:
      - id: ref1
        bwb_id: BWBR0006445
  - number: V-R601.4
    text: |-
      Ten aanzien van de consulent die op 1 april 1985 in het genot is van een ontslaguitkering en voor wie met
      toepassing van artikel C5 van het Besluit overgangsmaatregelen lw. 1985 een uitzicht is vastgesteld, is het
      bepaalde in de voorgaande leden van overeenkomstige toepassing met dien verstande dat voor de datum "1 april 1985"
      wordt gelezen: de dag waarop hij na 1 april 1985 zijn functie als consulent aanvaardt.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-R601
  - number: V-R601.5
    text: |-
      Zolang de consulent, bedoeld in het eerste tot en met vierde lid, is benoemd in een functie waarvan het
      maximumsalaris lager is dan het voor hem ingevolge artikel C1 en C2 van het Besluit overgangsmaatregelen lw. 1985
      vastgestelde uitzicht, is hij ontheven van de verplichting te voldoen aan de promotiecriteria bedoeld in artikel
      I-R103.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-R601
  - number: V-R602.1
    text: |-
      De consulent bedoeld in artikel I-A1, onder *e*4, bij wiens functie op 1 augustus 1993 een lagere maximumschaal
      behoort dan bij de functie die hij op 31 juli 1993 vervulde, behoudt aanspraak op bezoldiging volgens de hoogste
      aanloopschaal die behoorde bij de functie die hij op 31 juli 1993 bekleedde, zolang hij als zodanig aan de
      instelling verbonden blijft, onverminderd het bepaalde in artikel V-R601.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-R602
  - number: V-R602.2
    text: |-
      In afwijking van het eerste lid behoudt de betrokkene, bedoeld in artikel I-A1, onder *e*4, die bij voortzetting
      van de functie die hij op 31 juli 1993 bekleedde, op 1 augustus 1994 wordt bezoldigd volgens de maximumschaal bij
      die functie, aanspraak op bezoldiging volgens die maximumschaal zolang hij als zodanig aan de instelling verbonden
      blijft, onverminderd het bepaalde in artikel V-R601.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-R602
  - number: V-R602.3
    text: |-
      De betrokkene bedoeld in artikel I-A1, onder *e*4, bij wiens functie op 1 augustus 1993 een lagere schaal behoort
      dan bij de functie volgens hoofdstuk I-Q zoals dat op 31 juli 1993 luidde, die hij op die datum vervulde, behoudt
      aanspraak op bezoldiging volgens het carrièrepatroon dat behoorde bij de functie die hij op 31 juli 1993 bekleedde,
      zolang hij aan de instelling verbonden blijft, onverminderd het bepaalde in artikel V-R601.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-R602
  - number: V-R603
    text: |-
      Voor zover de specifieke gebouwensituatie van de instelling dit noodzakelijk maakt, is in het georganiseerd overleg
      als bedoeld in artikel IV-E2, eerste lid, onderwerp van overleg de wijze waarop en de periode waarin de minimaal
      gebonden weektaak wordt bereikt.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-R603
  - number: V-R701.1
    text: |-
      De vormingsleider voor wie met toepassing van
      [artikel C2, eerste lid, van het Besluit overgangsmaatregelen v.j. en v.j.v. 1985][ref1] een uitzicht is
      vastgesteld en die met ingang van 1 april 1985 wordt benoemd in een functie waarin het hoogste bedrag in de daarbij
      behorende maximumschaal lager is dan dat uitzicht, behoudt, behoudens het bepaalde in het vierde en vijfde lid,
      aanspraak op vaststelling van zijn salaris overeenkomstig dat uitzicht, zolang hij zonder wezenlijke onderbreking
      werkzaam blijft in een functie als bedoeld in hoofdstuk I-Q en I-R in het vormingswerk.


      [ref1]: https://wetten.overheid.nl/BWBR0003778#ArtikelC2
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-R701
    references:
      - id: ref1
        bwb_id: BWBR0003778
        artikel: C2
  - number: V-R701.2
    text: |-
      De vormingsleider, bedoeld in het eerste lid, die na 1 april 1985 een functie aanvaardt met een hoger
      maximumsalaris dan het bedrag van het voor hem vastgestelde uitzicht, behoudt nadien de aanspraak op vaststelling
      van zijn salaris overeenkomstig het voor hem vastgestelde uitzicht slechts indien hij uit die functie met een
      hoger maximumsalaris wordt ontslagen met recht op een ontslaguitkering als bedoeld in hoofdstuk I-H dan wel
      een uitkering als bedoeld in het [Besluit Werkloosheid onderwijs- en onderzoekpersoneel][ref1] of, voor wat
      betreft de vormingsleider van een instituut voor vormingswerk voor jonge volwassenen, een uitkering ingevolge
      het Besluit van 4 december 1979, houdende vaststelling van een algemene maatregel van bestuur als bedoeld
      in [artikel 6, derde lid, van de Werkloosheidswet][ref2] (*Stb.* 1979, 769) en hij daarna zonder wezenlijke
      onderbreking, doch vóór 1 april 2000 een functie aanvaardt met een maximumsalaris dat lager is dan het voor hem
      vastgestelde uitzicht.


      [ref1]: https://wetten.overheid.nl/BWBR0006445
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel6
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-R701
    references:
      - id: ref1
        bwb_id: BWBR0006445
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '6'
  - number: V-R701.3
    text: |-
      Met een wezenlijke onderbreking als aangegeven in het eerste en tweede lid wordt een periode van langer
      dan twee maanden bedoeld. De tijd gedurende welke een ontslaguitkering als bedoeld in hoofdstuk I-H dan wel
      een uitkering als bedoeld in het [Besluit Werkloosheid onderwijs- en onderzoekpersoneel][ref1] of, voor wat
      betreft de vormingsleider van een instituut voor vormingswerk voor jonge volwassenen, een uitkering ingevolge
      het Besluit van 4 december 1979, houdende vaststelling van een algemene maatregel van bestuur als bedoeld in
      [artikel 6, derde lid, van de Werkloosheidswet][ref2] (*Stb.* 1979, 769) wordt genoten, wordt niet als onderbreking
      aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0006445
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel6
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-R701
    references:
      - id: ref1
        bwb_id: BWBR0006445
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '6'
  - number: V-R701.4
    text: |-
      Ten aanzien van de vormingsleider die op 1 april 1985 in het genot is van een ontslaguitkering en voor wie
      met toepassing van [artikel C7 van het Besluit overgangsmaatregelen v.j. en v.j.v. 1985][ref1] een uitzicht is
      vastgesteld, is het bepaalde in de voorgaande leden van overeenkomstige toepassing met dien verstande dat voor de
      datum "1 april 1985" wordt gelezen: de dag waarop hij na 1 april 1985 zijn functie als vormingsleider aanvaardt.


      [ref1]: https://wetten.overheid.nl/BWBR0003778#ArtikelC7
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-R701
    references:
      - id: ref1
        bwb_id: BWBR0003778
        artikel: C7
  - number: V-R701.5
    text: |-
      Zolang de vormingsleider, bedoeld in het eerste tot en met vierde lid, is benoemd
      in een functie waarvan het maximumsalaris lager is dan het voor hem ingevolge
      [artikel C2, eerste lid, van het Besluit overgangsmaatregelen v.j. en v.j.v. 1985][ref1] vastgesteld uitzicht, is
      hij ontheven van de verplichting te voldoen aan de promotiecriteria bedoeld in artikel I-R103.


      [ref1]: https://wetten.overheid.nl/BWBR0003778#ArtikelC2
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-R701
    references:
      - id: ref1
        bwb_id: BWBR0003778
        artikel: C2
  - number: V-R702.1
    text: |-
      Bij de toepassing van het bepaalde in artikel V-R701 wordt niet als onderbreking aangemerkt de periode gedurende
      welke de betrokkene zonder onderbreking van meer dan twee maanden bleef verbonden aan een instelling als bedoeld
      in artikel I-A1, onder *d*6, die is ontstaan of mede is ontstaan uit een instelling voor vormingswerk voor jonge
      volwassenen waaraan hij op de dag voorafgaande aan de overgang vanuit die instelling voor vormingswerk voor jonge
      volwassenen naar eerstgenoemde instelling als vormingswerker was verbonden, mits het bepaalde in artikel V-R902 op
      hem van toepassing is gebleven.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-R702
  - number: V-R702.2
    text: |-
      Het bepaalde in het eerste lid is van overeenkomstige toepassing ten aanzien van de betrokkene die zonder
      onderbreking van meer dan twee maanden bleef verbonden aan een instelling als bedoeld in artikel I-A1, onder *d*13,
      waarnaar zijn overgang als bedoeld in artikel A1, tweede lid, van de Overgangsregeling ondersteuning VE heeft
      plaatsgevonden vanuit een instelling voor vormingswerk voor jonge volwassenen waaraan hij op de dag voorafgaande
      aan die overgang als vormingswerker was verbonden, mits het bepaalde in artikel V-Q1102 dan wel artikel V-S1102 op
      hem van toepassing is gebleven.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-R702
  - number: V-R703.1
    text: |-
      De leraar bedoeld in artikel I-A1, onder *e*5, bij wiens functie op 1 augustus 1994 een lagere maximumschaal
      behoort dan bij de functie die hij op 31 juli 1994 vervulde, behoudt aanspraak op bezoldiging volgens de hoogste
      aanloopschaal die behoorde bij de functie die hij op 31 juli 1994 bekleedde, zolang hij als zodanig aan de
      instelling verbonden blijft, onverminderd het bepaalde in artikel V-R704.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-R703
  - number: V-R703.2
    text: |-
      In afwijking van het eerste lid behoudt de betrokkene, bedoeld in artikel I-A1, onder *e*5, die bij voortzetting
      van de functie die hij op 31 juli 1994 bekleedde, op 1 augustus 1995 zou worden bezoldigd volgens de maximumschaal
      bij die functie, aanspraak op bezoldiging volgens die maximumschaal zolang hij als zodanig aan de instelling
      verbonden blijft, onverminderd het bepaalde in artikel V-R704.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-R703
  - number: V-R703.3
    text: |-
      De betrokkene bedoeld in artikel I-A1, onder *e*5, bij wiens functie op 1 augustus 1994 een lagere schaal behoort
      dan bij de functie volgens hoofdstuk I-Q zoals dat op 31 juli 1994 luidde, die hij op die datum vervulde, behoudt
      aanspraak op bezoldiging volgens het carrièrepatroon dat behoorde bij de functie die hij op 31 juli 1994 bekleedde,
      zolang hij aan de instelling verbonden blijft, onverminderd het bepaalde in artikel V-R704.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-R703
  - number: V-R704
    text: |-
      Op de betrokkene bedoeld in artikel I-A1, onder *e*5, voor wie tot en met 31 juli 1994 op grond van artikel IV,
      onderdeel 3, onder *a*, sub 1, van het besluit van 3 juli 1992 (*Stb* 1992, 389) (Formatiebudgetsysteem) een
      of meer van de artikelen V-Q701, V-Q702, V-Q703, V-R702, eerste en tweede lid, en V-R703, van toepassing zijn
      gebleven, zijn de artikelen V-Q701, V-Q702, V-Q703, V-R701, V-R702, en V-R703 van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-R704
  - number: V-R705
    text: |-
      Voor zover de specifieke gebouwensituatie van de instelling dit noodzakelijk maakt, is in het georganiseerd overleg
      als bedoeld in artikel IV-E2, eerste lid, onderwerp van overleg de wijze waarop en de periode waarin de minimaal
      gebonden weektaak wordt bereikt.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-R705
  - number: V-R801
    text: |-
      In deze paragraaf wordt verstaan onder: "betrokkene": de betrokkene, bedoeld in artikel I-A1 onder *e*10, voor
      zover betreft een lid van het onderwijsgevend personeel wiens functie tot 1 augustus 1992 werd aangeduid als
      instructeur als bedoeld in artikel I-R801, onder *a*, zoals dat artikel tot die datum luidde.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-R801
  - number: V-R802.1
    text: |-
      De betrokkene die tot 1 april 1985 werd bezoldigd op de voet van de in hoofdstuk I-Q genoemde schalen voor leraren,
      zoals die op 31 maart 1985 luidden, heeft aanspraak op het in hoofdstuk C van het Besluit overgangsmaatregelen v.o.
      1985 gegeven overgangsrecht ter zake van salarisuitzichten.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-R802
  - number: V-R802.2
    text: Artikel V-R402 is ten aanzien van de betrokkene, bedoeld in het eerste lid, van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-R802
  - number: V-R803
    text: |-
      De betrekking van de betrokkene die op 28 februari 1987 aan een landbouwpraktijkschool was verbonden en sindsdien
      als instructeur aan deze instelling verbonden is gebleven, wordt eerst opgeheven nadat zijn functie voor de totale
      omvang gedurende een schooljaar niet meer is opgenomen geweest in de formatie bedoeld in artikel I-P76, tweede lid,
      onder *a*.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-R803
  - number: V-R804
    text: |-
      De betrokkene die op 28 februari 1987 60 jaar of ouder was en op deze datum aan een landbouwpraktijkschool
      was verbonden en sindsdien als betrokkene aan deze instelling verbonden is gebleven, behoudt aanspraak op
      werktijdverkorting op de voet van artikel I-T12, zoals die luidde op 28 februari 1987.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-R804
  - number: V-R805
    text: |-
      De betrokkene die op 28 februari 1987 jonger is dan 28 jaar en op deze datum aan een landbouwpraktijkschool
      was verbonden en sindsdien als betrokkene aan deze instelling verbonden is gebleven, behoudt, zolang hij
      de 28-jarige leeftijd nog niet heeft bereikt, aanspraak op arbeidsduurverkorting op de voet van de voor het
      onderwijsondersteunend personeel van landbouwpraktijkscholen geldende regeling zoals die luidde op 28 februari
      1987.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-R805
  - number: V-R806
    text: |-
      Het salaris van de betrokkene die op 28 februari 1987 aan een landbouwpraktijkschool was verbonden en sindsdien
      als betrokkene aan deze instelling verbonden is gebleven en aan wie, wegens werkzaamheden buiten de normale
      werktijden, met instemming van Onze Minister een toelage was toegekend en voor wie deze toelage als gevolg van de
      inwerkingtreding van paragraaf 8 van hoofdstuk I-R komt te vervallen wordt voor zover daarmee het hoogste bedrag in
      de bij deze functie behorende maximumschaal niet wordt overschreden, met ingang van 1 maart 1987 verhoogd volgens
      nader door Onze Minister vast te stellen regels.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-R806
  - number: V-R807
    text: |-
      Voor zover de specifieke gebouwensituatie van de instelling dit noodzakelijk maakt, is in het georganiseerd overleg
      als bedoeld in artikel IV-E2, eerste lid, onderwerp van overleg de wijze waarop en de periode waarin de minimaal
      gebonden weektaak wordt bereikt.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-R807
  - number: V-R901.1
    text: |-
      De betrokkene op wie het bepaalde in de Overgangsregeling basiseducatie, met uitzondering van artikel A2 van dat
      besluit, van toepassing is, behoudt bij een instelling als bedoeld in artikel I-A1, onder *d*6, waaraan hij op
      de dag van overgang daar naar toe wordt verbonden als educatief werker, uitzicht op vaststelling van zijn salaris
      volgens het bedrag bij het hoogste salarisnummer van de schaal waarin hij is ingepast op de dag waarop de overgang
      naar die instelling plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-R901
  - number: V-R901.2
    text: |-
      Indien de schaal, bedoeld in het eerste lid, een lager nummer heeft dan de hoogste aanloopschaal, die behoorde bij
      de functie die de educatief werker vervulde op de dag voorafgaande aan de overgang naar de instelling, bedoeld in
      artikel I-A1, onder *d*6, behoudt hij, in afwijking van het bepaalde in het eerste lid, uitzicht op vaststelling
      van zijn salaris volgens het bedrag bij het hoogste salarisnummer van die hoogste aanloopschaal.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-R901
  - number: V-R902.1
    text: |-
      De betrokkene voor wie een uitzicht is vastgesteld met toepassing of overeenkomstige toepassing van een
      der artikelen V-R402 dan wel V-R701 en die met ingang van de dag waarop in verband met de uitvoering van
      de Rijksregeling basiseducatie overgang naar een instelling als bedoeld in artikel I-A1, onder *d*6 heeft
      plaatsgevonden, vanuit de door hem beklede functie van leraar of vormingswerker is benoemd aan die instelling
      in een functie als bedoeld in paragraaf 9 van hoofdstuk I-R behoudt, in afwijking van het bepaalde in artikel
      V-R901, aanspraak op vaststelling van zijn salaris overeenkomstig dat uitzicht zolang hij zonder wezenlijke
      onderbreking aan een instelling als bedoeld in artikel I-A1 onder *d*6, verbonden blijft in een functie waarbij een
      maximumschaal hoort die ten minste gelijk is aan de maximumschaal die behoort bij de functie die hem is toebedeeld
      bij de overgang naar meergenoemde instelling.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-R902
  - number: V-R902.2
    text: |-
      De betrokkene voor wie een uitzicht is vastgesteld met toepassing van of overeenkomstige toepassing van een
      der artikelen V-Q401, V-Q402, V-Q701 of V-Q702 en die met ingang van de dag waarop in verband met de invoering
      van de Rijksregeling basiseducatie overgang naar een instelling als bedoeld in artikel I-A1 onder *d*6, heeft
      plaatsgevonden, vanuit de door hem beklede functie van directeur, directeur/coördinator of adjunct-directeur anders
      dan op eigen verzoek is benoemd aan die instelling in een functie als bedoeld in paragraaf 9 van hoofdstuk I-R,
      behoudt in afwijking van het bepaalde in artikel V-R901 aanspraak op vaststelling van zijn salaris overeenkomstig
      dat uitzicht zolang hij zonder wezenlijke onderbreking aan een instelling als bedoeld in artikel I-A1 onder *d*6,
      verbonden blijft in een functie, waarbij een maximumschaal hoort die ten minste gelijk is aan de maximumschaal, die
      behoort bij de functie die hem is toebedeeld bij de overgang naar meergenoemde instelling.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-R902
  - number: V-R902.3
    text: |-
      Met een wezenlijke onderbreking als aangegeven in het eerste en tweede lid, wordt een periode van langer dan twee
      maanden bedoeld. De tijd gedurende welke een ontslaguitkering als bedoeld in hoofdstuk I-H dan wel een uitkering
      als bedoeld in het [Besluit Werkloosheid onderwijs- en onderzoekpersoneel][ref1] wordt genoten, wordt niet als
      onderbreking aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0006445
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-R902
    references:
      - id: ref1
        bwb_id: BWBR0006445
  - number: V-R1201.1
    text: |-
      De leraar bedoeld in artikel I-A1, onder *e*14, bij wiens functie op 1 augustus 1990 een lagere maximumschaal
      behoort dan bij de functie die hij op 31 juli 1990 vervulde, behoudt aanspraak op bezoldiging volgens de hoogste
      aanloopschaal die behoorde bij de functie die hij op 31 juli 1990 bekleedde, zoals hij als zodanig aan de
      instelling verbonden blijft, onverminderd het bepaalde in artikel V-R1203.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-R1201
  - number: V-R1201.2
    text: |-
      In afwijking van het eerste lid behoudt de betrokkene, bedoeld in artikel I-A1, onder *e*14, die bij voortzetting
      van de functie die hij op 31 juli 1990 bekleedde, op 31 juli 1992 zou worden bezoldigd volgens de maximumschaal bij
      die functie, aanspraak op bezoldiging volgens die maximumschaal zolang hij als zodanig aan de instelling verbonden
      blijft, onverminderd het bepaalde in artikel V-R1203.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-R1201
  - number: V-R1201.3
    text: |-
      De betrokkene bedoeld in artikel I-A1, onder *e*14, bij wiens functie op 1 augustus 1990 een lagere schaal behoort
      dan bij de functie volgens hoofdstuk I-Q zoals dat op 31 juli 1990 luidde, die hij op die datum vervulde, behoudt
      aanspraak op bezoldiging volgens het carrièrepatroon dat behoorde bij de functie die hij op 31 juli 1990 bekleedde,
      zoals hij aan de instelling verbonden blijft, onverminderd het bepaalde in artikel V-R1203.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-R1201
  - number: V-R1202
    text: |-
      Op de leraar bedoeld in artikel I-A1, onder *e*14, voor wie op 31 juli 1990 artikel V-Q404 dan wel artikel V-
      R406, zoals die artikelen op die datum luidden, van toepassing was en die op 1 augustus 1990 in dienst is bij
      een instelling, bedoeld in artikel I-A1, onder *d*14, en voor wie een betrekkingsomvang van meer dan 38 uur is
      berekend, komt niet voor bezoldiging in aanmerking het verschil tussen 38 uur en de voor hem 1 augustus 1990
      geldende betrekkingsomvang.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-R1202
  - number: V-R1203.1
    text: |-
      Op de betrokkene bedoeld in artikel I-A1, onder *e*14, voor wie op 31 juli 1990 een of meer der artikelen V-
      Q402, V-Q403, V-Q405, V-Q406, V-R402, eerste en tweede lid, V-R403, V-R404, V-R404*a*, V-R407 en V-R408, zoals die
      artikelen op die datum luidden, van toepassing waren, zijn in afwijking van artikel V-R1201 de artikelen V-P6, V-
      Q401, V-Q402, V-Q405, V-Q406, V-R401, V-R402, V-R403, V-R405 en V-R406 van overeenkomstig toepassing.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-R1203
  - number: V-R1203.2
    text: |-
      De betrokkene bedoeld in artikel I-A1, onder *e*14, die op 31 juli 1990 en 1 augustus 1990 bij de instelling dan
      wel een instelling als bedoeld in artikel I-Q101, onderdeel *c* onder 3, in dienst is en voor wie op 31 juli 1990
      een of meer der artikelen V-Q402, V-Q403, V-Q406, V-R404 en V-R408, zoals die artikelen op die datum luidden, van
      toepassing waren, behoudt de in die artikelen bedoelde aanspraak indien hij op of na 1 augustus 1990 vrijwillig een
      functie aanvaardt met een maximumschaal die ten hoogste één lager is dan de maximumschaal bij de functie die hij op
      31 juli 1990 bekleedde, mits:
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-R1203
  - number: V-R1203.2.a
    text: |-
      in de door hem niet aanvaarde dan wel nadien opgegeven functie een andere betrokkene wordt benoemd die boventallig
      is en
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-R1203
  - number: V-R1203.2.b
    text: |-
      die andere betrokkene een aanspraak heeft als bedoeld in de in de aanhef genoemde artikelen die tenminste gelijk is
      aan het maximumsalaris van de maximumschaal van de functie die behoort bij de functie waarin hij wordt benoemd en
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-R1203
  - number: V-R1203.2.c
    text: de boventalligheid aan een instelling als bedoeld in artikel I-A1, onder *d*14, wordt verminderd en
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-R1203
  - number: V-R1203.2.d
    text: |-
      in een verticale scholengemeenschap: het verschil in salaris van de in het gestelde onder *a.* bedoelde beide
      betrokkenen niet meer bedraagt dan twee periodieke verhogingen.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-R1203
  - number: V-R1204
    text: |-
      Voor zover de specifieke gebouwensituatie van de instelling dit noodzakelijk maakt, is in het georganiseerd overleg
      als bedoeld in artikel IV-E2, eerste lid, onderwerp van overleg de wijze waarop en de periode waarin de minimaal
      gebonden weektaak wordt bereikt.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-R1204
  - number: V-R1205.1
    text: |-
      De artikelen V-R1201 tot en met V-R1204 zijn niet van toepassing op de leraar die benoemd is in de formatie,
      bedoeld in artikel I-R1209, onder *b*, dan wel het deel van zijn benoeming dat daarop betrekking heeft indien hij
      tevens is benoemd in de formatie als bedoeld in artikel I-R1209, onder *a*.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-R1205
  - number: V-R1205.2
    text: |-
      Op de in het eerste lid bedoelde leraar zijn de artikelen V-P6, V-R401 tot en met V-R409 van overeenkomstige
      toepassing.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-R1205
  - number: V-R1206
    text: |-
      De leraar die is of wordt aangesteld om voor meer dan de helft van zijn betrekkingsomvang werkzaamheden te
      verrichten aan de h.a.v.o./m.b.o.-afdeling van de school of de horizontale scholengemeenschap, bekleedt een functie
      als eerstegraads leraar. De maximumschaal bij deze functie is schaal 12.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-R1206
  - number: V-R1207.1
    text: |-
      Ten behoeve van de v.w.o./a.v.o.-sector in de horizontale scholengemeenschap, bedoeld in artikel I-Q101, onderdeel
      *c* onder 2, zijn in plaats van de in artikel I-R1204, tweede lid, genoemde functies, voor leraren de normfuncties
      van eerstegraads en tweedegraads leraar beschikbaar, overeenkomstig het bepaalde in artikel I-R402.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-R1207
  - number: V-R1207.2
    text: |-
      Indien van de scholengemeenschap, bedoeld in artikel I-Q101, onderdeel *c*, onder 2, een instelling of cursus voor
      algemeen en op het beroep gericht onderwijs of een instituut voor deeltijd vervolg/beroepsonderwijs deel uitmaakt,
      zijn in plaats van de in artikel I-R1204, tweede lid, genoemde functies voor leraren de normfuncties van leraar
      primaire opleidingen beschikbaar, overeenkomstig het bepaalde in artikel I-R402.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-R1207
  - number: V-R1301.1
    text: |-
      De leraar bedoeld in artikel I-A1, onder *e*15, bij wiens functie op 1 augustus 1990 een lagere maximumschaal
      behoort dan bij de functie die hij op 31 juli 1990 vervulde, behoudt aanspraak op bezoldiging volgens de hoogste
      aanloopschaal die behoorde bij de functie die hij op 31 juli 1990 bekleedde, zolang hij als zodanig aan de
      instelling verbonden blijft, onverminderd het bepaalde in artikel V-R1303.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-R1301
  - number: V-R1301.2
    text: |-
      In afwijking van het eerste lid behoudt de betrokkene, bedoeld in artikel I-A1, onder *e*15, die bij voortzetting
      van de functie die hij op 31 juli 1990 bekleedde, op 31 juli 1993 zou worden bezoldigd volgens de maximumschaal bij
      die functie, aanspraak op bezoldiging volgens die maximumschaal zolang hij als zodanig aan de instelling verbonden
      blijft, onverminderd het bepaalde in artikel V-R1303.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-R1301
  - number: V-R1301.3
    text: |-
      De betrokkene, bedoeld in artikel I-A1, onder *e*15, bij wiens functie op 1 augustus 1990 een lagere schaal behoort
      dan bij de functie volgens hoofdstuk I-Q zoals dat op 31 juli 1990 luidde, die hij op die datum vervulde, behoudt
      aanspraak op bezoldiging volgens het carrièrepatroon dat behoorde bij de functie die hij op 31 juli 1990 bekleedde,
      zolang hij aan de instelling verbonden blijft, onverminderd het bepaalde in artikel V-R1303.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-R1301
  - number: V-R1301.4
    text: |-
      De leraar bedoeld in artikel I-A1, onder *e*15, die op 1 augustus 1993 wordt geplaatst in een functie aan de bbo-
      component waarbij een lagere maximumschaal behoort dan bij de functie die hij op 31 juli 1993 vervulde, behoudt
      aanspraak op bezoldiging volgens de hoogste aanloopschaal die behoorde bij de functie die hij op 31 juli 1993
      bekleedde, zolang hij als zodanig aan de instelling verbonden blijft, onverminderd het bepaalde in artikel V-R1303.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-R1301
  - number: V-R1301.5
    text: |-
      In afwijking van het vierde lid behoudt de betrokkene, bedoeld in artikel I-A1, onder *e*15, die bij voortzetting
      van de functie die hij op 31 juli 1993 bekleedde, op 1 augustus 1994 zou worden bezoldigd volgens de maximumschaal
      bij die functie, aanspraak op bezoldiging volgens die maximumschaal zolang hij als zodanig aan de instelling
      verbonden blijft, onverminderd het bepaalde in artikel V-R1303.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-R1301
  - number: V-R1302
    text: |-
      Op de leraar bedoeld in artikel I-A1, onder *e*15, voor wie op 31 juli 1990 artikel V-Q404 dan wel artikel V-
      R406, zoals die artikelen op die datum luidden, van toepassing was en die op 1 augustus 1990 in dienst is bij
      een instelling, bedoeld in artikel I-A1, onder *d*15, en voor wie een betrekkingsomvang van meer dan 38 uur is
      berekend, komt niet voor bezoldiging in aanmerking het verschil tussen 38 uur en de voor hem op 1 augustus 1990
      geldende betrekkingsomvang.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-R1302
  - number: V-R1303.1
    text: |-
      Op de betrokkene bedoeld in artikel I-A1, onder *e*15, voor wie op 31 juli 1990 een of meer der artikelen V-
      Q402, V-Q403, V-Q405, V-Q406, V-R402, eerste en tweede lid, V-R403, V-R404, V-R404*a*, V-R407 en V-R408, zoals die
      artikelen op die datum luidden, van toepassing waren, zijn in afwijking van artikel V-R1301 de artikelen V-P6, V-
      Q401, V-Q402, V-Q405, V-Q406, V-R401, V-R402, V-R403, V-R405 en V-R406 van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-R1303
  - number: V-R1303.2
    text: |-
      De betrokkene bedoeld in artikel I-A1, onder *e*15, die op 31 juli 1990 en 1 augustus 1990 bij de instelling in
      dienst is en voor wie op 31 juli 1990 een of meer der artikelen V-Q402, V-Q403, V-Q406, V-R404 en V-R408, zoals die
      artikelen op die datum luidden, van toepassing waren, behoudt de in die artikelen bedoelde aanspraak indien hij op
      of na 1 augustus 1990 vrijwillig een functie aanvaardt met een maximumschaal die ten hoogste één lager is dan de
      maximumschaal bij de functie die hij op 31 juli 1990, bekleedde, mits:
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-R1303
  - number: V-R1303.2.a
    text: |-
      in de door hem niet aanvaarde dan wel nadien opgegeven functie een andere betrokkene wordt benoemd die boventallig
      is en
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-R1303
  - number: V-R1303.2.b
    text: |-
      die andere betrokkene een aanspraak heeft als bedoeld in de in de aanhef genoemde artikelen die tenminste gelijk is
      aan het maximumsalaris van de maximumschaal van de functie die behoort bij de functie waarin hij wordt benoemd en
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-R1303
  - number: V-R1303.2.c
    text: de boventalligheid aan een instelling als bedoeld in artikel I-A1, onder *d*15, wordt verminderd en
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-R1303
  - number: V-R1303.2.d
    text: |-
      het verschil in salaris van de in het gestelde onder *a.* bedoelde beide betrokkenen niet meer bedraagt dan twee
      periodieke verhogingen.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-R1303
  - number: V-R1304
    text: |-
      Voor zover de specifieke gebouwensituatie van de instelling dit noodzakelijk maakt, is in het georganiseerd overleg
      als bedoeld in artikel IV-E2, eerste lid, onderwerp van overleg de wijze waarop en de periode waarin de minimaal
      gebonden weektaak wordt bereikt.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-R1304
  - number: V-R1401.1
    text: |-
      De leraar bedoeld in artikel I-A1, onder *e*17, bij wiens functie op 1 augustus 1993 een lagere maximumschaal
      behoort dan bij de functie die hij op 31 juli 1993 vervulde, behoudt aanspraak op bezoldiging volgens de hoogste
      aanloopschaal die behoorde bij de functie die hij op 31 juli 1993 bekleedde, zolang hij als zodanig aan de
      instelling verbonden blijft, onverminderd het bepaalde in artikel V-R1403.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-R1401
  - number: V-R1401.2
    text: |-
      In afwijking van het eerste lid behoudt de betrokkene, bedoeld in artikel I-A1, onder *e*17, die bij voortzetting
      van de functie die hij op 31 juli 1993 bekleedde, op 1 augustus 1994 zou worden bezoldigd volgens de maximumschaal
      bij die functie, aanspraak op bezoldiging volgens die maximumschaal zolang hij als zodanig aan de instelling
      verbonden blijft, onverminderd het bepaalde in artikel V-R1403.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-R1401
  - number: V-R1401.3
    text: |-
      De betrokkene bedoeld in artikel I-A1, onder *e*17, bij wiens functie op 1 augustus 1993 een lagere schaal behoort
      dan bij de functie volgens hoofdstuk I-Q zoals dat op 31 juli 1993 luidde, die hij op die datum vervulde, behoudt
      aanspraak op bezoldiging volgens het carrièrepatroon dat behoorde bij de functie die hij op 31 juli 1993 bekleedde,
      zolang hij aan de instelling verbonden blijft, onverminderd het bepaalde in artikel V-R1403.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-R1401
  - number: V-R1402
    text: |-
      De leraar bedoeld in artikel I-A1, onder *e*17, voor wie op 31 juli 1993 artikel V-Q404 dan wel artikel V-
      R404, zoals die artikelen op die datum luidden, van toepassing was en die op 1 augustus 1993 in dienst is bij
      een instelling, bedoeld in artikel I-A1, onder *d*17, en voor wie een betrekkingsomvang van meer dan 38 uur is
      berekend, komt niet voor bezoldiging in aanmerking voor het verschil tussen 38 uur en de voor hem 1 augustus 1993
      geldende betrekkingsomvang.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-R1402
  - number: V-R1403
    text: |-
      Op de betrokkene bedoeld in artikel I-A1, onder *e*17, voor wie tot en met 31 juli 1993 op grond van artikel IV,
      onderdeel 3, onder *a* ,sub 1, van het besluit van 3 juli 1992 (*Stb* 1992, 389) (Formatiebudgetsysteem) een of
      meer van de artikelen V-Q402, V-Q403, V-Q405, V-Q406, V-R402, eerste en tweede lid, V-R403, V-R404, V-R404*a*, V-
      R407 en V-R408, van toepassing zijn gebleven, zijn de artikelen V-P6, V-Q401, V-Q402, V-Q405, V-Q406, V-R401, V-
      R402, V-R403, V-R405 en V-R406 van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-R1403
  - number: V-R1404
    text: |-
      Voor zover de specifieke gebouwensituatie van de instelling dit noodzakelijk maakt, is in het georganiseerd overleg
      als bedoeld in artikel IV-E2, eerste lid, onderwerp van overleg de wijze waarop en de periode waarin de minimaal
      gebonden weektaak wordt bereikt.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-R1404
  - number: V-R1405.1
    text: |-
      De artikelen V-R1401 tot en met V-R1404 zijn niet van toepassing op de leraar die benoemd is in de formatie,
      bedoeld in artikel I-R1409, onder *b*, dan wel het deel van zijn benoeming dat daarop betrekking heeft indien hij
      tevens is benoemd in de formatie als bedoeld in artikel I-R1409, onder *a*.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-R1405
  - number: V-R1405.2
    text: |-
      Op de in het eerste lid bedoelde leraar zijn de artikelen V-P6, V-R401 tot en met V-R409 van overeenkomstige
      toepassing.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-R1405
  - number: V-R1501.1
    text: |-
      De leraar bedoeld in artikel I-A1, onder *e*18, bij wiens functie op 1 augustus 1993 een lagere maximumschaal
