    text: Het bevoegd gezag benoemt in de centrale directie ten hoogste vijf leden op maximaal drie formatieplaatsen.
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-Q702
  - number: I-Q702.2
    text: |-
      De centrale directie van een horizontale scholengemeenschap kan worden uitgebreid tot ten hoogste het aantal
