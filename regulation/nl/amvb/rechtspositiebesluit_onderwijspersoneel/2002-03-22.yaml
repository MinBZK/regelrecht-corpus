    text: |-
      ondersteunend personeel: het personeel, bedoeld onder *b*, dat is belast met werkzaamheden ter ondersteuning van de
      directie en het inhoudelijk personeel;
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S1101
  - number: I-S1102
    text: |-
      Het bevoegd gezag van een plaatselijke, regionale danwel een provinciale instelling kan de betrokkenen behorend tot
      het inhoudelijk personeel benoemen in functies met een maximumschaal als aangegeven in onderstaand schema:
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelI-S1102
