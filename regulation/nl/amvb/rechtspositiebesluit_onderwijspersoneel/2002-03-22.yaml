  - number: V-S401.1
    text: |-
      De betrokkene die is benoemd in een functie als bedoeld in hoofdstuk I-S ten behoeve van het verrichten
      van werkzaamheden aan een speciale school voor basisonderwijs en voor wie een salarisuitzicht geldt als
      bedoeld in [artikel II van het Besluit van 30 november 1993][ref1] (Stb. 1993, 696), behoudt aanspraak
      op vaststelling van zijn salaris overeenkomstig dat uitzicht bij een herplaatsing overeenkomstig
      __REF001___________________________________________________________________________________________________________
      ___________________________________________________________________________________________________________________
      ________________________ (Stb. 1998, 228). Deze aanspraak geldt zolang de betrokkene bij het bevoegd gezag waarbij
      hij is herplaatst in dezelfde functie benoemd blijft.


      [ref1]: https://wetten.overheid.nl/BWBR0006279#ArtikelII
      [ref2]: https://wetten.overheid.nl/BWBR0009525#ArtikelXLII
    url: https://wetten.overheid.nl/BWBR0003771/2002-03-22#ArtikelV-S401
