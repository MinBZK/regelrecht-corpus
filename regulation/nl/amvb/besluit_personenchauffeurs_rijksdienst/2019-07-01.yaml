preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties van 18 september 1998, nummer
    AD1998/U50458, directoraat-generaal Management en Personeelsbeleid, directie Personeelsmanagement Rijksdienst,
    afdeling Arbeidsvoorwaarden en Sociaal Beleid;

    Gelet op artikel 125 van de Ambtenarenwet;

    De Raad van State gehoord (advies van 22 oktober 1998, nr. W04.98.0437)

    Gezien het nader rapport van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties van 12 november
    1998, nummer AD1998/U56042 directoraat-generaal Management en Personeelsbeleid, directie Personeelsmanagement
    Rijksdienst, afdeling Arbeidsvoorwaarden en Sociaal beleid;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0010015/2019-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0010015/2019-07-01#Artikel1
  - number: 1.a
    text: 'Onze Minister: het hoofd van het betrokken departement van algemeen bestuur;'
    url: https://wetten.overheid.nl/BWBR0010015/2019-07-01#Artikel1
  - number: 1.b
    text: |-
      personenchauffeur: de ambtenaar aangesteld op grond van het [Algemeen Rijksambtenarenreglement][ref1], het
      [Reglement Dienst Buitenlandse Zaken][ref2] of het [Ambtenarenreglement Staten-Generaal][ref3] die belast is met
      het vervoer van bewindslieden en hoge ambtelijke functionarissen en als zodanig door Onze Minister is aangewezen;


      [ref1]: https://wetten.overheid.nl/BWBR0001950
      [ref2]: https://wetten.overheid.nl/BWBR0004052
      [ref3]: https://wetten.overheid.nl/BWBR0003229
    url: https://wetten.overheid.nl/BWBR0010015/2019-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001950
      - id: ref2
        bwb_id: BWBR0004052
      - id: ref3
        bwb_id: BWBR0003229
  - number: 1.c
    text: |-
      arbeidsduurfactor: de breuk waarvan de teller bestaat uit de voor de personenchauffeur vastgestelde arbeidsduur en
      de noemer bestaat uit het getal 48.
    url: https://wetten.overheid.nl/BWBR0010015/2019-07-01#Artikel1
  - number: '2'
    text: |-
      Ten aanzien van toepassing van dit besluit op de personenchauffeurs bij de Eerste en Tweede Kamer der Staten-
      Generaal, de Algemene Rekenkamer, de Hoge Raad van Adel, het Kabinet van de Koning, de Kanselarij der Nederlandse
      Orden, de Nationale ombudsman, de Raad van State of het secretariaat van de commissie van toezicht op de
      inlichtingen- en veiligheidsdiensten wordt voor Onze Minister telkens respectievelijk gelezen de Voorzitters van
      elk der beide kamers der Staten-Generaal, het College van de Algemene Rekenkamer, respectievelijk de voorzitter
      van de Hoge Raad van Adel, de directeur van het Kabinet van de Koning, de kanselier der Nederlandse Orden, de
      Nationale ombudsman, de vice-president van de Raad van State of de voorzitter van de commissie van toezicht op de
      inlichtingen- en veiligheidsdiensten.
    url: https://wetten.overheid.nl/BWBR0010015/2019-07-01#Artikel2
  - number: '3.1'
    text: |-
      Op de personenchauffeur zijn niet van toepassing: - [artikel 21, tweede tot en met vierde lid][ref1], en
      [artikel 21a, eerste lid, tweede volzin van het Algemeen Rijksambtenarenreglement][ref2];
        - [artikel 34, tweede tot en met vierde lid][ref3], en
      [artikel 34a, eerste lid, tweede volzin, van het Ambtenarenreglement Staten-Generaal][ref4];
        - [artikel 37, tweede tot en met vierde lid][ref5], en
      [artikel 38, eerste lid, tweede volzin, van het Reglement Dienst Buitenlandse Zaken][ref6];
        - de [artikelen 17][ref7], [17a][ref8], [18a][ref9] en
      [23, van het Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref10].


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0001950#Artikel21a
      [ref3]: https://wetten.overheid.nl/BWBR0003229#Artikel34
      [ref4]: https://wetten.overheid.nl/BWBR0003229#Artikel34a
      [ref5]: https://wetten.overheid.nl/BWBR0004052#Artikel37
      [ref6]: https://wetten.overheid.nl/BWBR0004052#Artikel38
      [ref7]: https://wetten.overheid.nl/BWBR0003630#Artikel17
      [ref8]: https://wetten.overheid.nl/BWBR0003630#Artikel17a
      [ref9]: https://wetten.overheid.nl/BWBR0003630#Artikel18a
      [ref10]: https://wetten.overheid.nl/BWBR0003630#Artikel23
    url: https://wetten.overheid.nl/BWBR0010015/2019-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '21'
      - id: ref2
        bwb_id: BWBR0001950
        artikel: 21a
      - id: ref3
        bwb_id: BWBR0003229
        artikel: '34'
      - id: ref4
        bwb_id: BWBR0003229
        artikel: 34a
      - id: ref5
        bwb_id: BWBR0004052
        artikel: '37'
      - id: ref6
        bwb_id: BWBR0004052
        artikel: '38'
      - id: ref7
        bwb_id: BWBR0003630
        artikel: '17'
      - id: ref8
        bwb_id: BWBR0003630
        artikel: 17a
      - id: ref9
        bwb_id: BWBR0003630
        artikel: 18a
      - id: ref10
        bwb_id: BWBR0003630
        artikel: '23'
  - number: '3.2'
    text: |-
      Voor de toepassing van [artikel 21a van het Algemeen Rijksambtenarenreglement][ref1],
      [artikel 34a van het Ambtenarenreglement Staten-Generaal][ref2] en
      [artikel 38 van het Reglement Dienst Buitenlandse Zaken][ref3] wordt de aanvulling op zijn salaris als bedoeld in
      [artikel 6][ref4], aangemerkt als salaris.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel21a
      [ref2]: https://wetten.overheid.nl/BWBR0003229#Artikel34a
      [ref3]: https://wetten.overheid.nl/BWBR0004052#Artikel38
      [ref4]: https://wetten.overheid.nl/BWBR0010015#Artikel6
    url: https://wetten.overheid.nl/BWBR0010015/2019-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 21a
      - id: ref2
        bwb_id: BWBR0003229
        artikel: 34a
      - id: ref3
        bwb_id: BWBR0004052
        artikel: '38'
      - id: ref4
        bwb_id: BWBR0010015
        artikel: '6'
  - number: '4'
    text: |-
      Voor de personenchauffeur die mede belast is met het uitvoeren van beveiligingstaken geldt salarisschaal 4 van het
      [Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003630
    url: https://wetten.overheid.nl/BWBR0010015/2019-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003630
  - number: '5.1'
    text: |-
      De arbeidsduur voor de personenchauffeur met een volledige arbeidsduur, bedraagt voor de toepassing van dit besluit
      gemiddeld 48 uur per week.
    url: https://wetten.overheid.nl/BWBR0010015/2019-07-01#Artikel5
  - number: '5.2'
    text: |-
      In afwijking van [artikel 21, eerste lid, van het Algemeen Rijksambtenarenreglement][ref1],
      [artikel 34, eerste lid, van het Ambtenarenreglement Staten-Generaal][ref2] en
      [artikel 37, eerste lid, van het Reglement Dienst Buitenlandse Zaken][ref3] kan het in het arbeidstijdpatroon
      opgenomen aantal te werken uren op jaarbasis voor de personenchauffeur niet hoger zijn dan gemiddeld 48 uur per
      week.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0003229#Artikel34
      [ref3]: https://wetten.overheid.nl/BWBR0004052#Artikel37
    url: https://wetten.overheid.nl/BWBR0010015/2019-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '21'
      - id: ref2
        bwb_id: BWBR0003229
        artikel: '34'
      - id: ref3
        bwb_id: BWBR0004052
        artikel: '37'
  - number: '5.3'
    text: |-
      Op de arbeidsduur voor de personenchauffeur die uitsluitend of nagenoeg uitsluitend is belast met het vervoer van
      doorgaans dezelfde persoon per auto, is [paragraaf 5.7 van het Arbeidstijdenbesluit][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007687#Paragraaf5.7
    url: https://wetten.overheid.nl/BWBR0010015/2019-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007687
        paragraaf: '5.7'
  - number: '6.1'
    text: De personenchauffeur ontvangt een aanvulling op zijn salaris.
    url: https://wetten.overheid.nl/BWBR0010015/2019-07-01#Artikel6
  - number: '6.2'
    text: |-
      De aanvulling, bedoeld in het eerste lid, bedraagt per maand 52/156 maal het voor de personenchauffeur geldende
      salaris uit [bijlage B van het Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref1], vermenigvuldigd met de
      factor 1,5.


      [ref1]: https://wetten.overheid.nl/BWBR0003630
    url: https://wetten.overheid.nl/BWBR0010015/2019-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0003630
  - number: '6.3'
    text: |-
      Het salaris, bedoeld in het tweede lid, bedraagt ten hoogste het salaris behorende bij salarisnummer 10 van
      salarisschaal 4 uit [bijlage B van het Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003630
    url: https://wetten.overheid.nl/BWBR0010015/2019-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0003630
  - number: '6.4'
    text: |-
      De aanvulling, bedoeld in het eerste lid, wordt vermenigvuldigd met de voor de personenchauffeur geldende
      arbeidsduurfactor.
    url: https://wetten.overheid.nl/BWBR0010015/2019-07-01#Artikel6
  - number: '7.1'
    text: |-
      De personenchauffeur ontvangt maandelijks een vaste toelage voor het werken op onregelmatige uren ter hoogte van €
      169,37 vermenigvuldigd met de arbeidsduurfactor.
    url: https://wetten.overheid.nl/BWBR0010015/2019-07-01#Artikel7
  - number: '7.2'
    text: |-
      Het bedrag, genoemd in het eerste lid, wordt bij ministeriële regeling gewijzigd overeenkomstig een algemene
      wijziging van het salaris van het burgerlijk rijkspersoneel met ingang van de dag waarop de salariswijziging van
      kracht wordt.
    url: https://wetten.overheid.nl/BWBR0010015/2019-07-01#Artikel7
  - number: '7.3'
    text: |-
      Het bedrag, genoemd in het eerste lid, bedroeg van 1 januari 2007 tot 1 april 2008 € 145,35 en van 1 april 2008 tot
      1 april 2009 € 148,26.
    url: https://wetten.overheid.nl/BWBR0010015/2019-07-01#Artikel7
  - number: '8'
    text: |-
      In afwijking van [artikel 49gg, tweede en vijfde lid, van het Algemeen Rijksambtenarenreglement][ref1]
      wordt voor de berekeningsbasis bij het bepalen van de hoogte van de salarisgarantie
      en salarissuppletie uitgegaan van de som van het salaris op basis van
      [artikel 5, tweede lid, van het Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref2], de vakantie-uitkering,
      de eindejaarsuitkering en de aanvulling op het salaris, bedoeld in [artikel 6][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel49gg
      [ref2]: https://wetten.overheid.nl/BWBR0003630#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0010015#Artikel6
    url: https://wetten.overheid.nl/BWBR0010015/2019-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 49gg
      - id: ref2
        bwb_id: BWBR0003630
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0010015
        artikel: '6'
  - number: '9'
    text: |-
      De in de [artikelen 6][ref1] en [7][ref2] genoemde aanvulling op het salaris respectievelijk
      vaste toelage voor het werken op onregelmatige uren behoren tot de bezoldiging, bedoeld in
      [artikel 2, onderdeel f, van het Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0010015#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0010015#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0003630#Artikel2
    url: https://wetten.overheid.nl/BWBR0010015/2019-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0010015
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0010015
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0003630
        artikel: '2'
  - number: '10'
    text: |-
      Over de in de [artikelen 6][ref1] en [7][ref2] genoemde aanvulling op het salaris respectievelijk vaste toelage
      voor het werken op onregelmatige uren heeft de personenchauffeur recht op een eindejaarsuitkering als bedoeld in
      [artikel 20a van het Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0010015#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0010015#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0003630#Artikel20a
    url: https://wetten.overheid.nl/BWBR0010015/2019-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0010015
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0010015
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0003630
        artikel: 20a
  - number: '11'
    text: |-
      In afwijking van [artikel 22, vierde lid, van het Algemeen Rijksambtenarenreglement][ref1],
      [artikel 41, vierde lid, van het Reglement Dienst Buitenlandse Zaken][ref2] bedraagt voor de personenchauffeur
      met een volledige werktijd de aanspraak op wettelijke vakantie-uren 192 uren en de aanspraak op bovenwettelijke
      vakantie-uren 28,8 uren per kalenderjaar. Onder volledige werktijd wordt verstaan een werktijd welke gemiddeld 48
      werkuren per week omvat.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0004052#Artikel41
    url: https://wetten.overheid.nl/BWBR0010015/2019-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '22'
      - id: ref2
        bwb_id: BWBR0004052
        artikel: '41'
  - number: '12'
    text: |-
      Voor de personenchauffeur voor wie op de dag voor de inwerkingtreding van dit besluit reeds een salarisschaal gold
      die hoger is dan salarisschaal 4 van het [Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref1] blijft de
      hogere salarisschaal gelden.


      [ref1]: https://wetten.overheid.nl/BWBR0003630
    url: https://wetten.overheid.nl/BWBR0010015/2019-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0003630
  - number: 12a.1
    text: |-
      Aan de personenchauffeur aan wie een andere functie, niet zijnde personenchauffeur, wordt opgedragen, kan een
      aflopende compensatietoelage worden toegekend, mits hij gedurende twee jaar voorafgaande aan de andere functie,
      zonder wezenlijke onderbreking als personenchauffeur is aangesteld.
    url: https://wetten.overheid.nl/BWBR0010015/2019-07-01#Artikel12a
  - number: 12a.2
    text: |-
      Voor de toepassing van het eerste lid wordt onder wezenlijke onderbreking verstaan een onderbreking van langer dan
      twaalf maanden.
    url: https://wetten.overheid.nl/BWBR0010015/2019-07-01#Artikel12a
  - number: 12b.1
    text: |-
      De personenchauffeur die op de dag voorafgaande aan het vervallen van [artikel 8][ref1] een toelage ontving op
      grond van dat artikel, ontvangt een toelage.


      [ref1]: https://wetten.overheid.nl/BWBR0010015#Artikel8
    url: https://wetten.overheid.nl/BWBR0010015/2019-07-01#Artikel12b
    references:
      - id: ref1
        bwb_id: BWBR0010015
        artikel: '8'
  - number: 12b.2
    text: |-
      De toelage bedraagt per maand 2,66% van het voor de personenchauffeur geldende salaris uit
      [bijlage B van het Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003630
    url: https://wetten.overheid.nl/BWBR0010015/2019-07-01#Artikel12b
    references:
      - id: ref1
        bwb_id: BWBR0003630
  - number: 12b.3
    text: |-
      Het salaris, bedoeld in het tweede lid, bedraagt ten hoogste het salaris behorende bij salarisnummer 10 van
      salarisschaal 4 uit [bijlage B van het Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003630
    url: https://wetten.overheid.nl/BWBR0010015/2019-07-01#Artikel12b
    references:
      - id: ref1
        bwb_id: BWBR0003630
  - number: 12b.4
    text: De toelage wordt vermenigvuldigd met de voor de personenchauffeur geldende arbeidsduurfactor.
    url: https://wetten.overheid.nl/BWBR0010015/2019-07-01#Artikel12b
  - number: 12b.5
    text: |-
      De toelage behoort tot de bezoldiging, bedoeld in [artikel 2, onderdeel f][ref1],
      en tot de berekeningsbasis voor de eindejaarsuitkering, bedoeld in
      [artikel 20a, eerste lid, van het Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0010015#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003630#Artikel20a
    url: https://wetten.overheid.nl/BWBR0010015/2019-07-01#Artikel12b
    references:
      - id: ref1
        bwb_id: BWBR0010015
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0003630
        artikel: 20a
  - number: '13'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin het
      wordt geplaatst. Indien dit geen verslechtering van de rechtspositie van de betrokken personenchauffeurs met
      zich meebrengt, kan Onze Minister voor de onder hem ressorterende personenchauffeurs bepalen dat het besluit
      terugwerkende kracht heeft uiterlijk tot en met 1 januari 1998. Het besluit van Onze Minister wordt in de
      Staatscourant gepubliceerd.
    url: https://wetten.overheid.nl/BWBR0010015/2019-07-01#Artikel13
  - number: '14'
    text: 'Dit besluit wordt aangehaald als: Besluit personenchauffeurs Rijksdienst.'
    url: https://wetten.overheid.nl/BWBR0010015/2019-07-01#Artikel14
