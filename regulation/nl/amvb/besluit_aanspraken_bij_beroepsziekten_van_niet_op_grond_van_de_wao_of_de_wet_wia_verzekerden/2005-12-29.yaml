  - number: '3'
    text: |-
      Degene, die ingevolge het bepaalde in [artikel 1][ref1] beschouwd wordt alsof hij verzekerd is ingevolge de
      [Wet op de arbeidsongeschiktheidsverzekering][ref2] dan wel de [Wet werk en inkomen naar arbeidsvermogen][ref3]
      wordt geacht te zijn verzekerd bij het Uitvoeringsinstituut werknemersverzekeringen.


