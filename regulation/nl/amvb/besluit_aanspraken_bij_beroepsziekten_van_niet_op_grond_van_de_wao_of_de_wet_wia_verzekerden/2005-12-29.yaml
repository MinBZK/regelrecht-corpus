  - number: '2'
    text: |-
      Het bepaalde in het vorige artikel blijft buiten toepassing ten aanzien van:

      a. degene, die bij de intreding van de arbeidsongeschiktheid in verband met het bepaalde in
      [artikel 6, eerste lid, onder ][ref1] niet verzekerd is;

      b. degene, die ter zake van de arbeidsongeschiktheid recht op uitkering ontleent aan de
      [Liquidatiewet ongevallenwetten][ref2];

      c. degene die bij het intreden van de volledige en duurzame arbeidsongeschiktheid of de gedeeltelijke
      arbeidsgeschiktheid op grond van [artikel 8, eerste lid, van de Wet werk en inkomen naar arbeidsvermogen][ref3]
      in samenhang met [artikel 6, eerste lid, onder a of b, van de Ziektewet][ref4] niet verzekerd is op grond van de
      [Wet werk en inkomen naar arbeidsvermogen][ref5].


