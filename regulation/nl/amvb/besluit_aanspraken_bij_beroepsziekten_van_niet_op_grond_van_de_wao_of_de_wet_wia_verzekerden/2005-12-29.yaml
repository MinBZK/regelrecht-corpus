articles:
  - number: '1'
    text: |-
      1 Degene die niet op grond van de [Wet op de arbeidsongeschiktheidsverzekering][ref1] en niet op grond van
      de [Wet werk en inkomen naar arbeidsvermogen][ref2] verzekerd is en die arbeidsongeschikt wordt of wiens
      arbeidsongeschiktheid is toegenomen als gevolg van een beroepsziekte, genoemd in kolom I van de bijlage bij dit
      besluit, wordt voor het recht op toekenning onderscheidenlijk herziening van een arbeidsongeschiktheidsuitkering
      beschouwd alsof hij verzekerd is op grond van [Wet op de arbeidsongeschiktheidsverzekering][ref3], indien de
      beroepsziekte veroorzaakt is door de in kolom II van de bijlage achter de ziekte vermelde, door de betrokkene
      verrichte werkzaamheden en hij ter zake van die werkzaamheden op grond van laatstgenoemde wet verzekerd was doch
      nimmer verzekerd is geweest op grond van de [Wet werk en inkomen naar arbeidsvermogen][ref4].

      2 Degene die niet op grond van de [Wet op de arbeidsongeschiktheidsverzekering][ref5] en niet op grond van de
      [Wet werk en inkomen naar arbeidsvermogen][ref6] verzekerd is en die volledig en duurzaam arbeidsongeschikt of
      gedeeltelijk arbeidsgeschikt wordt als gevolg van een beroepsziekte genoemd in kolom I van de bijlage, wordt voor
      het recht op een uitkering op grond van de [Wet werk en inkomen naar arbeidsvermogen][ref7] beschouwd alsof hij
      verzekerd is op grond van die wet, indien de beroepsziekte veroorzaakt is door de in kolom II van de bijlage achter
      de ziekte vermelde door de betrokkene verrichte werkzaamheden en hij ter zake van die werkzaamheden op grond van
      die wet verzekerd was.

      3 Voorzover het betreft door de betrokkene voor 1 juli 1967 verrichte werkzaamheden wordt bij
      de toepassing van het eerste lid in plaats van «beschouwd alsof hij verzekerd is op grond van
      [Wet op de arbeidsongeschiktheidsverzekering][ref8]» gelezen: beschouwd alsof hij verzekerd is op grond van de
      wettelijke ongevallenverzekering.

      4 Arbeidsongeschiktheid als gevolg van een ziekte, genoemd in kolom I van de bijlage van dit besluit, wordt, tenzij
      het tegendeel blijkt, geacht te zijn veroorzaakt door de in het eerste lid bedoelde door de betrokkene verrichte
      werkzaamheden.


