        artikel: '16'
      - id: ref2
        bwb_id: BWBR0036385
        artikel: '2'
        paragraaf: '2'
  - number: '12.1'
    text: |-
      In afwijking van de [artikelen 40 tot en met 41d][ref1] en [42 van de wet][ref2] zendt de houder van de ontheffing
      aan de Autoriteit Consument en Markt de berekeningsmethode van de tarieven die nodig zijn voor de uitvoering
      van taken als bedoeld in artikel 40 van de wet te onderscheiden naar de [artikelen 28, eerste lid][ref3],
      [29, eerste lid][ref4], en [30a van de wet][ref5] voor de goedkeuring van deze berekeningsmethode.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel42
      [ref3]: https://wetten.overheid.nl/BWBR0009755#Artikel28
      [ref4]: https://wetten.overheid.nl/BWBR0009755#Artikel29
      [ref5]: https://wetten.overheid.nl/BWBR0009755#Artikel30a
    url: https://wetten.overheid.nl/BWBR0036385/2015-04-01#Artikel12
