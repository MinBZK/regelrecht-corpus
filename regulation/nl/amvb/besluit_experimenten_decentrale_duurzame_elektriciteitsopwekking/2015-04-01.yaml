        artikel: '13'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: 13a
  - number: '10.3'
    text: |-
      Overeenkomstig [artikel 85, eerste lid, van de wet][ref1], kan bij ministeriële regeling worden voorzien in een
      vergoeding voor het in rekening brengen van kosten aan een houder van een ontheffing.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel85
    url: https://wetten.overheid.nl/BWBR0036385/2015-04-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '85'
  - number: '10.4'
    text: |-
      In aanvulling op het eerste lid zijn de volgende afwijkende regels van toepassing bij een project met een
      projectnet:
    url: https://wetten.overheid.nl/BWBR0036385/2015-04-01#Artikel10
  - number: 10.4.a
    text: |-
      het projectnet is niet een ander net als bedoeld in [artikel 10, negende lid, van de wet][ref1] en


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel10
    url: https://wetten.overheid.nl/BWBR0036385/2015-04-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '10'
  - number: 10.4.b
    text: |-
      de [artikelen 15, vijfde lid][ref1], en
      [16, eerste lid, met uitzondering van de onderdelen h, j, en m van de wet][ref2], zijn van overeenkomstige
      toepassing voor de houder van de ontheffing, tenzij uit een overeenkomst tussen de houder van de ontheffing en
      de netbeheerder van het net, waarop het projectnet is aangesloten, blijkt dat de netbeheerder bereid is taken als
      bedoeld in die artikelen te verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel16
    url: https://wetten.overheid.nl/BWBR0036385/2015-04-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: '16'
  - number: '11'
    text: |-
      In afwijking van [artikel 16, eerste lid, met uitzondering van de onderdelen h, j en m, van de wet][ref1] is een
      netbeheerder niet gehouden een taak als bedoeld in dat artikel te verrichten, indien die taak door een houder van
      een ontheffing als bedoeld in [artikel 2][ref2] krachtens die ontheffing wordt verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0036385#Artikel2
    url: https://wetten.overheid.nl/BWBR0036385/2015-04-01#Artikel11
