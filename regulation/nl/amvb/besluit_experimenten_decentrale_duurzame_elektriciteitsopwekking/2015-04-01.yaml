  - number: '3.1'
    text: |-
      De ontheffing, bedoeld in [artikel 2][ref1], kan worden verleend aan een vereniging voor een project dat bijdraagt
      aan ontwikkelingen op het gebied van decentraal opgewekte duurzame elektriciteit of elektriciteit opgewekt in een
      installatie voor warmtekrachtkoppeling als bedoeld in [artikel 7a, tweede lid, van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0036385#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel7a
    url: https://wetten.overheid.nl/BWBR0036385/2015-04-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0036385
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: 7a
  - number: '3.2'
    text: |-
      De ontheffing heeft mede betrekking op handelingen van andere personen, die in het project zijn beschreven,
      waaronder de netbeheerder en leveranciers.
    url: https://wetten.overheid.nl/BWBR0036385/2015-04-01#Artikel3
  - number: '4.1'
    text: |-
      Onze Minister kan aan een ontheffing voorschriften of beperkingen verbinden in verband met belangen van
      transportzekerheid, leveringszekerheid, veiligheid, milieu en bescherming van consumenten, tenzij uit de bij de
      aanvraag overgelegde documenten blijkt dat in voldoende mate met deze belangen is rekening gehouden en de door de
      aanvrager in deze documenten beschreven voorzieningen voldoende concreet zijn omschreven.
    url: https://wetten.overheid.nl/BWBR0036385/2015-04-01#Artikel4
  - number: '4.2'
    text: |-
      Aan de ontheffing is het voorschrift verbonden het project uit te voeren in overeenstemming met de aanvraag en de
      bij de aanvraag overgelegde documenten.
    url: https://wetten.overheid.nl/BWBR0036385/2015-04-01#Artikel4
  - number: '4.3'
    text: De ontheffing kan slechts worden overgedragen aan een andere houder met toestemming van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0036385/2015-04-01#Artikel4
  - number: '4.4'
    text: |-
      Voorschriften en beperkingen die betrekking hebben op een handeling die in het project is beschreven en door een
      andere persoon dan de aanvrager wordt uitgevoerd, gelden eveneens voor die andere persoon.
    url: https://wetten.overheid.nl/BWBR0036385/2015-04-01#Artikel4
  - number: '5.1'
    text: |-
      Bij ministeriële regeling wordt een periode vastgesteld waarin een aanvraag wordt ingediend bij een door Onze
      Minister aangewezen instantie.
    url: https://wetten.overheid.nl/BWBR0036385/2015-04-01#Artikel5
  - number: '5.2'
    text: Voor de aanvraag wordt gebruikgemaakt van een door Onze Minister beschikbaar gesteld middel.
    url: https://wetten.overheid.nl/BWBR0036385/2015-04-01#Artikel5
  - number: '6.1'
    text: |-
      Bij de ministeriële regeling, bedoeld in [artikel 5, eerste lid][ref1], wordt een maximum gesteld aan het aantal
      ontheffingen dat wordt verstrekt krachtens [artikel 2, eerste lid, onderdeel a][ref2], respectievelijk artikel 2,
      eerste lid, onderdeel b.


      [ref1]: https://wetten.overheid.nl/BWBR0036385#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0036385#Artikel2
    url: https://wetten.overheid.nl/BWBR0036385/2015-04-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0036385
        artikel: '5'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0036385
        artikel: '2'
        paragraaf: '2'
  - number: '6.2'
    text: |-
      Bij de ministeriële regeling, bedoeld in [artikel 5, eerste lid][ref1], wordt de maximale opwekkingscapaciteit voor
      projecten vastgesteld in samenhang met het verwachte gebruik van de afnemers die deelnemen in die projecten.


      [ref1]: https://wetten.overheid.nl/BWBR0036385#Artikel5
    url: https://wetten.overheid.nl/BWBR0036385/2015-04-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0036385
        artikel: '5'
        paragraaf: '2'
  - number: '7.1'
    text: 'Onze Minister weigert een ontheffing te verlenen, indien:'
    url: https://wetten.overheid.nl/BWBR0036385/2015-04-01#Artikel7
  - number: 7.1.a
    text: de aanvraag niet voldoet aan een bepaling van dit besluit;
    url: https://wetten.overheid.nl/BWBR0036385/2015-04-01#Artikel7
  - number: 7.1.b
    text: |-
      voor de totstandkoming van het project in ontheffing krachtens een ander artikel dan [artikel 7a van de wet][ref1]
      kan worden voorzien;


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel7a
    url: https://wetten.overheid.nl/BWBR0036385/2015-04-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 7a
  - number: 7.1.c
    text: voor de totstandkoming van het project geen ontheffing nodig is;
    url: https://wetten.overheid.nl/BWBR0036385/2015-04-01#Artikel7
  - number: 7.1.d
    text: |-
      er aanwijzingen zijn dat de betrouwbaarheid van de elektriciteitsvoorziening, waaronder de transportzekerheid of
      leveringszekerheid van elektriciteit aan één of meer afnemers, in één van de aangesloten netten in gevaar wordt
      gebracht;
    url: https://wetten.overheid.nl/BWBR0036385/2015-04-01#Artikel7
  - number: 7.1.e
    text: 'er aanwijzingen zijn dat het project:'
    url: https://wetten.overheid.nl/BWBR0036385/2015-04-01#Artikel7
  - number: 7.1.e.1°
    text: niet veilig kan worden uitgevoerd,
    url: https://wetten.overheid.nl/BWBR0036385/2015-04-01#Artikel7
  - number: 7.1.e.2°
    text: onvoldoende waarborgen biedt voor de bescherming van consumenten of
    url: https://wetten.overheid.nl/BWBR0036385/2015-04-01#Artikel7
  - number: 7.1.e.3°
    text: in strijd is met het belang van bescherming van het milieu;
    url: https://wetten.overheid.nl/BWBR0036385/2015-04-01#Artikel7
  - number: 7.1.f
    text: |-
      aan het project een afnemer deelneemt, die geen lid is van de vereniging, tenzij de afnemer een rechtspersoon is
      waarover de vereniging volledige zeggenschap heeft;
    url: https://wetten.overheid.nl/BWBR0036385/2015-04-01#Artikel7
  - number: 7.1.g
    text: |-
      niet alle afnemers zijn aangesloten op hetzelfde midden- of laagspanningsnet van de netbeheerder waarop de aanvraag
      betrekking heeft of binnen een half jaar na verlening van de ontheffing kunnen worden aangesloten;
    url: https://wetten.overheid.nl/BWBR0036385/2015-04-01#Artikel7
  - number: 7.1.h
    text: |-
      een handeling die onderdeel is van het project niet geheel onder de verantwoordelijkheid van de houder van de
      ontheffing wordt uitgevoerd, tenzij die handeling door de netbeheerder of een houder van een vergunning als bedoeld
      in [artikel 95a van de wet][ref1] tegen een redelijke vergoeding wordt uitgevoerd, indien daarvan blijkt uit een
      door de netbeheerder of de vergunninghouder ondertekend document;


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95a
    url: https://wetten.overheid.nl/BWBR0036385/2015-04-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 95a
  - number: 7.1.i
    text: |-
      een ander dan de vereniging, met uitzondering van een rechtspersoon waarover de vereniging volledige zeggenschap
      heeft, de duurzame elektriciteit opwekt;
    url: https://wetten.overheid.nl/BWBR0036385/2015-04-01#Artikel7
  - number: 7.1.j
    text: |-
      een persoon of rechtspersoon die binnen de Europese Unie of in een derde land direct of indirect netbeheerder
      is dan wel direct of indirect leverancier of producent is van elektriciteit met een omvang groter dan het in de
      aanvraag vermelde op te wekken maximale vermogen in de vereniging enige vorm van zeggenschap uitoefent;
    url: https://wetten.overheid.nl/BWBR0036385/2015-04-01#Artikel7
  - number: 7.1.k
    text: |-
      de algemene ledenvergadering van de vereniging in statutaire bepalingen, reglementen of overeenkomsten op enige
      wijze is uitgesloten van zeggenschap over de inrichting, voortgang of kostenverdeling van het project;
    url: https://wetten.overheid.nl/BWBR0036385/2015-04-01#Artikel7
  - number: 7.1.l
    text: |-
      het niet aannemelijk is dat de leden van de vereniging de kosten van het project op korte en lange termijn kunnen
      dragen;
    url: https://wetten.overheid.nl/BWBR0036385/2015-04-01#Artikel7
  - number: 7.1.m
    text: |-
      de vereniging niet genoegzaam aantoont te beschikken over de benodigde organisatorische, financiële en technische
      kwaliteiten voor een goede uitvoering van zijn taak;
    url: https://wetten.overheid.nl/BWBR0036385/2015-04-01#Artikel7
  - number: 7.1.n
    text: |-
      het project geen redelijke kans van slagen heeft met het oog op de gekozen vorm van organisatie, de benodigde
      kennis en expertise;
    url: https://wetten.overheid.nl/BWBR0036385/2015-04-01#Artikel7
  - number: 7.1.o
    text: |-
      er geen voorziening is getroffen voor het geval een afnemer als bedoeld in [artikel 95a van de wet][ref1],
      elektriciteit wil betrekken van een andere leverancier dan de vereniging;


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95a
    url: https://wetten.overheid.nl/BWBR0036385/2015-04-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 95a
  - number: 7.1.p
    text: |-
      afnemers over een aansluiting beschikken met een hogere doorlaatwaarde dan bedoeld in
      [artikel 95a van de wet][ref1], met uitzondering van een afnemer die beschikt over een aansluiting voor een
      installatie die voor het project duurzame elektriciteit opwekt met een maximale capaciteit van 5 MW;


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95a
    url: https://wetten.overheid.nl/BWBR0036385/2015-04-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 95a
  - number: 7.1.q
    text: minder dan 80% van de afnemers consument zijn;
    url: https://wetten.overheid.nl/BWBR0036385/2015-04-01#Artikel7
  - number: 7.1.r
    text: |-
      de capaciteit tot opwekking van elektriciteit van de vereniging en zijn leden gezamenlijk en door Onze Minister
      krachtens [artikel 6][ref1] vastgestelde capaciteit te boven gaat;


      [ref1]: https://wetten.overheid.nl/BWBR0036385#Artikel6
    url: https://wetten.overheid.nl/BWBR0036385/2015-04-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0036385
        artikel: '6'
        paragraaf: '2'
  - number: 7.1.s
    text: |-
      de vereniging onvoldoende voorzieningen heeft getroffen voor het opvangen van een tekort of overschot aan
      elektriciteit door veranderingen in het opgewekte vermogen in de installaties van de vereniging en de leden van
      de vereniging;
    url: https://wetten.overheid.nl/BWBR0036385/2015-04-01#Artikel7
  - number: 7.1.t
    text: |-
      afnemers in het project deelnemen die elektriciteit afnemen van een directe lijn, een gesloten distributiesysteem,
      een projectnet dat geen onderdeel is van dat project, of een hoogspanningsnet;
    url: https://wetten.overheid.nl/BWBR0036385/2015-04-01#Artikel7
  - number: 7.1.u
    text: het project door zijn aard in Nederland niet herhaalbaar is;
    url: https://wetten.overheid.nl/BWBR0036385/2015-04-01#Artikel7
  - number: 7.1.v
    text: |-
      de technische voorzieningen in het project niet worden uitgevoerd op een niveau dat gelijkwaardig is aan het
      technische niveau dat door een netbeheerder wordt gehanteerd;
    url: https://wetten.overheid.nl/BWBR0036385/2015-04-01#Artikel7
  - number: 7.1.w
    text: het project niet inpasbaar is in het net van een netbeheerder;
    url: https://wetten.overheid.nl/BWBR0036385/2015-04-01#Artikel7
  - number: 7.1.x
    text: |-
      er door de aanvrager onvoldoende voorzieningen zijn getroffen om taken als bedoeld in de [artikelen 16][ref1]
      en [16a van de wet][ref2], waarvoor ontheffing is verleend, na afloop van het project, of zo nodig gedurende
      het project, over te kunnen dragen aan een netbeheerder, met name indien het project voorziet in het bouwen of
      aanleggen van een object waarin gebruikelijk door de netbeheerder wordt voorzien;


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel16a
    url: https://wetten.overheid.nl/BWBR0036385/2015-04-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '16'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: 16a
  - number: 7.1.y
    text: |-
      er door de aanvrager onvoldoende voorzieningen zijn getroffen om verplichtingen die voortvloeien uit het houden
      van een vergunning voor het leveren van elektriciteit na afloop van het project, of zo nodig gedurende het project,
      over te kunnen dragen aan een houder van een vergunning als bedoeld in [artikel 95a van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95a
    url: https://wetten.overheid.nl/BWBR0036385/2015-04-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 95a
  - number: '7.2'
    text: Het eerste lid, onderdeel q, is niet van toepassing op een aanvraag die betrekking heeft op een projectnet.
    url: https://wetten.overheid.nl/BWBR0036385/2015-04-01#Artikel7
  - number: '8.1'
    text: |-
      Indien in de periode, bedoeld in [artikel 5][ref1], meer aanvragen worden ingediend dan bedoeld in
      [artikel 6, eerste lid][ref2], stelt Onze Minister een rangschikking op.


      [ref1]: https://wetten.overheid.nl/BWBR0036385#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0036385#Artikel6
    url: https://wetten.overheid.nl/BWBR0036385/2015-04-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0036385
        artikel: '5'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0036385
        artikel: '6'
        paragraaf: '2'
  - number: '8.2'
    text: |-
      Onze Minister rangschikt een project zonder projectnet hoger naar mate het project meer dan andere projecten in
      vergelijking met de bestaande situatie:
    url: https://wetten.overheid.nl/BWBR0036385/2015-04-01#Artikel8
  - number: 8.2.a
    text: |-
      het aandeel duurzame elektriciteit in het totale energieverbruik van de afnemers vergroot, waaronder in het geval
      van warmtekrachtkoppeling wordt verstaan: de bijdrage van het project in het verhogen van het rendement van de
      totale verbruikte energie door de afnemers,
    url: https://wetten.overheid.nl/BWBR0036385/2015-04-01#Artikel8
  - number: 8.2.b
    text: |-
      de netbelasting verlaagt door het synchroniseren van de vraag naar elektriciteit met het aanbod van elektriciteit
      en het sturen van vraag en aanbod,
    url: https://wetten.overheid.nl/BWBR0036385/2015-04-01#Artikel8
  - number: 8.2.c
    text: |-
      een kans van slagen heeft, gelet op de technische, economische, administratieve en juridische uitvoerbaarheid, de
      benodigde kennis en expertise van de deelnemers in het project alsmede de organisatievorm en de financiering van
      het project gedurende de gehele looptijd, waarbij rekening wordt gehouden met de kans dat deelnemers gedurende de
      looptijd van het project niet langer aan het project wensen deel te nemen,
    url: https://wetten.overheid.nl/BWBR0036385/2015-04-01#Artikel8
  - number: 8.2.d
    text: |-
      kan leiden tot overeenkomstige projecten in Nederland nadat is voorzien in voortzetting ervan anders dan als
      experiment als bedoeld in [artikel 7a, vierde lid, van de wet][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel7a
    url: https://wetten.overheid.nl/BWBR0036385/2015-04-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 7a
  - number: 8.2.e
    text: |-
      kan leiden tot een significant grotere betrokkenheid van consumenten die deelnemen aan het experiment bij de
      gezamenlijke energievoorziening dan elders in Nederland,
    url: https://wetten.overheid.nl/BWBR0036385/2015-04-01#Artikel8
  - number: 8.2.f
    text: |-
      bij de toepassing van de criteria onder a tot en met e afwijkt van andere projecten in Nederland en daardoor
      bijdraagt aan het verwerven van nieuwe kennis met betrekking tot decentraal opgewekte duurzame elektriciteit of
      elektriciteit opgewekt in een installatie voor warmtekrachtkoppeling,
    url: https://wetten.overheid.nl/BWBR0036385/2015-04-01#Artikel8
  - number: 8.2.g
    text: |-
      indien een project na de toepassing van de criteria onder a tot en met f als gelijkwaardig wordt beschouwd, wordt
      dat project hoger gerangschikt dat naar het oordeel van Onze Minister om andere redenen dan genoemd in die criteria
      in hogere mate bijdraagt aan ontwikkelingen als bedoeld in [artikel 7a, tweede lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel7a
    url: https://wetten.overheid.nl/BWBR0036385/2015-04-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 7a
  - number: '8.3'
    text: Voor een project met een projectnet geldt de volgorde van binnenkomst als criterium voor de rangschikking.
    url: https://wetten.overheid.nl/BWBR0036385/2015-04-01#Artikel8
  - number: '9'
    text: |-
      Onze Minister kan een ontheffing wijzigen, nieuwe voorschriften en beperkingen aan de ontheffing verbinden of de
      ontheffing intrekken indien:
    url: https://wetten.overheid.nl/BWBR0036385/2015-04-01#Artikel9
  - number: 9.a
    text: de houder van de ontheffing dit verzoekt;
    url: https://wetten.overheid.nl/BWBR0036385/2015-04-01#Artikel9
  - number: 9.b
    text: |-
      de voorwaarden voor de ontheffing, de bij de ontheffing opgenomen voorschriften of de bij de ontheffing opgelegde
      beperkingen niet worden nagekomen;
    url: https://wetten.overheid.nl/BWBR0036385/2015-04-01#Artikel9
  - number: 9.c
    text: |-
      de krachtens dit besluit in afwijking van de [wet][ref1] van overeenkomstige toepassing verklaarde bepalingen niet
      worden nagekomen of de bepalingen van de wet die van toepassing zijn niet worden nagekomen;


      [ref1]: https://wetten.overheid.nl/BWBR0009755
    url: https://wetten.overheid.nl/BWBR0036385/2015-04-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0009755
  - number: 9.d
    text: |-
      de verstrekte gegevens zodanig onjuist of onvolledig blijken te zijn dat op de aanvraag een andere beslissing zou
      zijn genomen, indien bij de beoordeling daarvan de juiste gegevens bekend waren geweest;
    url: https://wetten.overheid.nl/BWBR0036385/2015-04-01#Artikel9
  - number: 9.e
    text: |-
      de houder van de ontheffing niet langer in staat wordt geacht de activiteit waarvoor ontheffing is verleend of de
      in de ontheffing opgenomen voorschriften na te komen;
    url: https://wetten.overheid.nl/BWBR0036385/2015-04-01#Artikel9
  - number: 9.f
    text: de transportzekerheid van elektriciteit in een net in gevaar is;
    url: https://wetten.overheid.nl/BWBR0036385/2015-04-01#Artikel9
  - number: 9.g
    text: de leveringszekerheid van elektriciteit in een net in gevaar is;
    url: https://wetten.overheid.nl/BWBR0036385/2015-04-01#Artikel9
  - number: 9.h
    text: |-
      zich een nieuw feit voordoet dat, indien dat feit voorzien was bij de beoordeling van de aanvraag dit feit geleid
      zou hebben tot weigering van de ontheffing;
    url: https://wetten.overheid.nl/BWBR0036385/2015-04-01#Artikel9
  - number: 9.i
    text: |-
      na een termijn van ten minste vier jaar en drie maanden na het verlenen van de ontheffing blijkt
      dat het project geen of slechts een geringe bijdrage levert aan ontwikkelingen als bedoeld in
      [artikel 7a, tweede lid, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel7a
    url: https://wetten.overheid.nl/BWBR0036385/2015-04-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 7a
  - number: 9.j
    text: |-
      in verband met verandering van de [wet][ref1], gewijzigde omstandigheden of gewijzigde inzichten de bescherming van
      de belangen met het oog waarmee bij de ontheffing rekening wordt gehouden, zwaarder moeten wegen dan het belang van
      betrokkenen bij een ongewijzigd besluit.


