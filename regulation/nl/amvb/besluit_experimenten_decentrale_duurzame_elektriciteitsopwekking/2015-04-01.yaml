  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Economische Zaken van 13 oktober 2014, nr. WJZ / 14160558;

    Gelet op artikel 16, eerste lid, van Richtlijn 2009/28/EG van het Europees Parlement en de Raad van 23 april
    2009 ter bevordering van het gebruik van energie uit hernieuwbare bronnen en houdende wijziging en intrekking
    van Richtlijn 2001/77/EG en Richtlijn 2003/30/EG (PbEU 2009, L 140) en de artikelen 7, derde lid, eerste en derde
    alinea, 26, vierde lid, 36, onderdelen d en e, 41, van Richtlijn 2009/72/EG van het Europees Parlement en de Raad
    van 13 juli 2009 betreffende gemeenschappelijke regels voor de interne markt voor elektriciteit en tot intrekking
    van Richtlijn 2003/54/EG (PbEU 2009, L 211) en artikel 7a, eerste lid, van de Elektriciteitswet 1998;

    De Afdeling advisering van de Raad van State gehoord (advies van 28 november 2014, nr. W15.14.0370/IV);

    Gezien het nader rapport van Onze Minister van Economische Zaken van 24 februari 2015, nr. WJZ /14202453;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0036385/2015-04-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder: - *beschikbaar
      gesteld middel:* een beschikbaar gestelde elektronische wijze van aanvragen als bedoeld in
      [artikel 2:15, eerste lid, van de Algemene wet bestuursrecht][ref1] en een vastgesteld aanvraagformulier als
      bedoeld in [artikel 4:4 van de Algemene wet bestuursrecht][ref2];
        - *consument:* persoon als bedoeld in
      [artikel 230g, eerste lid, onderdeel a, van Boek 6 van het Burgerlijk Wetboek][ref3];
        - *coöperatie:* een vereniging als bedoeld in [artikel 53 van Boek 2 van het Burgerlijk Wetboek][ref4];
        - *project:* een samenstel van handelingen waarin bij wijze van experiment wordt afgeweken van de [wet][ref5];
        - *projectnet:* een net, niet zijnde het landelijk hoogspanningsnet, 1°. dat met één aansluiting verbonden is aan
      een net dat wordt beheerd door een netbeheerder als bedoeld in [artikel 1, onderdeel k, van de wet][ref6]; 2°. dat
      ligt binnen een geografisch afgebakende locatie of locatie met gedeelde diensten; 3°. waarop maximaal 500 afnemers
      zijn aangesloten en 4°. dat overwegend consumenten van elektriciteit voorziet;
        - *vereniging:* een coöperatie of vereniging van eigenaars;
        - *vereniging van eigenaars:* een vereniging als bedoeld in
      [artikel 124, eerste lid, van Boek 5 van het Burgerlijk Wetboek][ref7];
        - *wet:* de [Elektriciteitswet 1998][ref8].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel2
