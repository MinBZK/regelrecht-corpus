        artikel: 30a
  - number: '12.2'
    text: |-
      De Autoriteit Consument en Markt houdt rekening met artikel 14 van [verordening (EG) nr. 714/2009](32009R0714) en
      artikel 36, onderdelen d en e, van de richtlijn.
    url: https://wetten.overheid.nl/BWBR0036385/2015-04-01#Artikel12
  - number: '12.3'
    text: |-
      De Autoriteit Consument en Markt kan na een klacht van een afnemer of op verzoek van een orgaan van de vereniging
      beoordelen of de door de vereniging vastgestelde tarieven zijn berekend volgens een methode die overeenkomt met de
      eerder goedgekeurde berekeningsmethode. [Artikel 51 van de wet][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel51
    url: https://wetten.overheid.nl/BWBR0036385/2015-04-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '51'
  - number: '13'
    text: |-
