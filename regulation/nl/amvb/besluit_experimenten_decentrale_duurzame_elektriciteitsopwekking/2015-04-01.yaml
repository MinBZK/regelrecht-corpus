  - number: '14'
    text: |-
      In afwijking van de [artikelen 95b, eerste lid, eerste volzin][ref1], en
      [95cb, eerste lid, eerste volzin, van de wet][ref2] is een leverancier, anders dan de houder van
      de ontheffing, niet gehouden zorg te dragen voor de levering van elektriciteit, bedoeld in artikel
      95b, eerste lid, eerste volzin, respectievelijk bedragen te factureren of te innen als bedoeld in
      [artikel 95cb, eerste lid, eerste volzin, van de wet][ref3], met betrekking tot taken die de houder van de
      ontheffing op zich heeft genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95b
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel95cb
