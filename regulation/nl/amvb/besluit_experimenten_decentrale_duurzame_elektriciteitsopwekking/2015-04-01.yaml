  - number: '15.1'
    text: Onze Minister verleent een ontheffing voor een termijn van maximaal tien jaar.
    url: https://wetten.overheid.nl/BWBR0036385/2015-04-01#Artikel15
  - number: '15.2'
    text: |-
      Onze Minister kan de termijn, genoemd in het eerste lid, verlengen tot een redelijke termijn langer dan tien jaar,
      indien:
    url: https://wetten.overheid.nl/BWBR0036385/2015-04-01#Artikel15
  - number: 15.2.a
    text: |-
      niet bij of krachtens de [wet][ref1] is voorzien in voortzetting van het project anders dan als experiment als
      bedoeld in [artikel 7a, vierde lid, van de wet][ref2] en beëindiging van het project in redelijkheid niet gevergd
      kan worden, of


      [ref1]: https://wetten.overheid.nl/BWBR0009755
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel7a
    url: https://wetten.overheid.nl/BWBR0036385/2015-04-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0009755
      - id: ref2
        bwb_id: BWBR0009755
        artikel: 7a
  - number: 15.2.b
    text: |-
      het project voorziet in de aanschaf van goederen waarvoor een afschrijvingstermijn tegen economische waarde geldt
      die langer is dan tien jaar.
    url: https://wetten.overheid.nl/BWBR0036385/2015-04-01#Artikel15
  - number: '16.1'
    text: |-
      Onze Minister kan bij de ontheffing bepalen op welke momenten gedurende de looptijd en na afloop van het project
      een verslag van het project wordt overgelegd om:
    url: https://wetten.overheid.nl/BWBR0036385/2015-04-01#Artikel16
  - number: 16.1.a
    text: |-
      tot een standpunt als bedoeld in [artikel 7a, vierde lid, van de wet][ref1] te komen,


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel7a
    url: https://wetten.overheid.nl/BWBR0036385/2015-04-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 7a
  - number: 16.1.b
    text: |-
      vast te stellen of een project aan haar doel beantwoordt en of de tijdsduur aanpassing behoeft als bedoeld in
      [artikel 7a, derde lid, onderdeel e, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel7a
    url: https://wetten.overheid.nl/BWBR0036385/2015-04-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 7a
  - number: '16.2'
    text: |-
      De houder van de ontheffing zendt in ieder geval binnen vier jaar en drie maanden na het verlenen van de ontheffing
      een verslag over de voortgang en resultaten van het project aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0036385/2015-04-01#Artikel16
  - number: '16.3'
    text: 'Het verslag, bedoeld in het tweede lid, heeft in ieder geval betrekking op de volgende vragen:'
    url: https://wetten.overheid.nl/BWBR0036385/2015-04-01#Artikel16
  - number: 16.3.a
    text: |-
      is het aandeel duurzame energie van het totale eindverbruik van energie bij de afnemers die deelnemen aan het
      project vergroot?
    url: https://wetten.overheid.nl/BWBR0036385/2015-04-01#Artikel16
  - number: 16.3.b
    text: heeft het project geleid tot een significant mindere belasting van het net?
    url: https://wetten.overheid.nl/BWBR0036385/2015-04-01#Artikel16
  - number: 16.3.c
    text: |-
      in welke mate zijn de afnemers tevreden over de geleverde diensten en in hoeverre blijkt dat uit een afname van het
      percentage afnemers in vergelijking met het totaal aantal afnemers in het betrokken gebied of verandering van het
      aantal afnemers?
    url: https://wetten.overheid.nl/BWBR0036385/2015-04-01#Artikel16
  - number: '16.4'
    text: |-
      In het geval het project betrekking heeft op warmtekrachtkoppeling wordt tevens de vraag beantwoord in hoeverre
      door het gebruik van warmtekrachtkoppeling het rendement van de aangevoerde energiedragers verhoogd is.
    url: https://wetten.overheid.nl/BWBR0036385/2015-04-01#Artikel16
  - number: '17'
    text: Dit besluit treedt in werking met ingang van 1 april 2015.
    url: https://wetten.overheid.nl/BWBR0036385/2015-04-01#Artikel17
  - number: '18'
    text: 'Dit besluit wordt aangehaald als: Besluit experimenten decentrale duurzame elektriciteitsopwekking.'
    url: https://wetten.overheid.nl/BWBR0036385/2015-04-01#Artikel18
