  - number: 10.1.a.1°
    text: onder «netbeheerder» wordt verstaan «de houder van de ontheffing voor taken die in het project zijn beschreven» en
    url: https://wetten.overheid.nl/BWBR0036385/2015-04-01#Artikel10
  - number: 10.1.a.2°
    text: 'onder «net» mede wordt verstaan: een verbinding die onderdeel is van het project.'
    url: https://wetten.overheid.nl/BWBR0036385/2015-04-01#Artikel10
  - number: '10.2'
    text: |-
      De [artikelen 13, tweede tot en met tiende lid][ref1], en [13a van de wet][ref2] zijn van overeenkomstige
      toepassing met dien verstande dat onder «netbeheerder» mede wordt verstaan: de houder van de ontheffing.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel13a
    url: https://wetten.overheid.nl/BWBR0036385/2015-04-01#Artikel10
