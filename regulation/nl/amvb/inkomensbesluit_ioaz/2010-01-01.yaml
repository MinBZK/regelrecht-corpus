preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Sociale Zaken en Werkgelegenheid van 12 maart 1987, Directoraat-Generaal
    Sociale Zekerheid, nr. SZ/BZ/ABB/BZ/87/U-2316/GvdW/RM;

    Gelet op artikel 7, derde lid, van de Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen
    zelfstandigen (Stb. 1987, 281);

    De Raad van State gehoord (advies van 30 maart 1987, No. W 12.87.105);

    Gezien het nader rapport van de Staatssecretaris van Sociale Zaken en Werkgelegenheid van 12 juni 1987,
    Directoraat-Generaal Sociale Zekerheid, nr. SZ/DBZ/ABB/BZ/3169/GvdW/RM;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0004167/2010-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder de wet: de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref1] (*Stb.* 1987, 281).


      [ref1]: https://wetten.overheid.nl/BWBR0004163
    url: https://wetten.overheid.nl/BWBR0004167/2010-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004163
  - number: '2.1'
    text: |-
      Voor de toepassing van [artikel 5, tweede lid, 2° en 3°, en derde lid, 2°, van de wet][ref1] wordt onder inkomen
      uit of in verband met arbeid in het bedrijfs- of beroepsleven verstaan:


      [ref1]: https://wetten.overheid.nl/BWBR0004163#Artikel5
    url: https://wetten.overheid.nl/BWBR0004167/2010-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0004163
        artikel: '5'
  - number: 2.1.a
    text: winst uit bedrijf en zelfstandig uitgeoefend beroep;
    url: https://wetten.overheid.nl/BWBR0004167/2010-01-01#Artikel2
  - number: 2.1.b
    text: |-
      de opbrengst van arbeid als bedoeld in de [artikelen 3][ref1], [4][ref2], [5][ref3] en
      [9a van het Inkomensbesluit IOAW][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0004091#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0004091#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0004091#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0004091#Artikel9a
    url: https://wetten.overheid.nl/BWBR0004167/2010-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0004091
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0004091
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0004091
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0004091
        artikel: 9a
  - number: 2.1.c
    text: |-
      behoudens het bepaalde in het tweede lid van dit artikel, inkomen in verband met arbeid in het bedrijfs- of
      beroepsleven, als bedoeld in [artikel 7 van het Inkomensbesluit IOAW][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004091#Artikel7
    url: https://wetten.overheid.nl/BWBR0004167/2010-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0004091
        artikel: '7'
  - number: '2.2'
    text: |-
      Onder inkomen in verband met arbeid, als bedoeld in het eerste lid, onderdeel *c*, wordt mede verstaan een uitkering
      op grond van de [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref1]
      (*Stb.* 1987, 92).


      [ref1]: https://wetten.overheid.nl/BWBR0004044
    url: https://wetten.overheid.nl/BWBR0004167/2010-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0004044
  - number: '2.3'
    text: |-
      Behoudens het bepaalde in [artikel 3, derde lid][ref1], wordt onder inkomen uit of in verband met arbeid, als
      bedoeld in het eerste en tweede lid van dit artikel, niet verstaan het inkomen van de echtgenoot.


      [ref1]: https://wetten.overheid.nl/BWBR0004167#Artikel3
    url: https://wetten.overheid.nl/BWBR0004167/2010-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0004167
        artikel: '3'
  - number: '3.1'
    text: |-
      Onder winst, bedoeld in [artikel 2, eerste lid, onderdeel a][ref1], wordt verstaan:


      [ref1]: https://wetten.overheid.nl/BWBR0004167#Artikel2
    url: https://wetten.overheid.nl/BWBR0004167/2010-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0004167
        artikel: '2'
  - number: 3.1.a
    text: |-
      de belastbare wist uit onderneming, bedoeld in [paragraaf 3.2.1 van de Wet inkomstenbelasting 2001][ref1],
      vermeerderd met de ondernemersaftrek, bedoeld in [paragraaf 3.2.4 van die wet][ref2], en de MKB-winstvrijstelling,
      bedoeld in [paragraaf 3.2.5 van die wet][ref3], indien de gewezen zelfstandige het bedrijf of beroep heeft
      uitgeoefend in de vorm van een éénmanszaak, maatschap, vennootschap onder firma of commanditaire vennootschap;


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Paragraaf3.2.1
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Paragraaf3.2.4
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Paragraaf3.2.5
    url: https://wetten.overheid.nl/BWBR0004167/2010-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0011353
        paragraaf: 3.2.1
      - id: ref2
        bwb_id: BWBR0011353
        paragraaf: 3.2.4
      - id: ref3
        bwb_id: BWBR0011353
        paragraaf: 3.2.5
  - number: 3.1.b
    text: |-
      hetgeen ingevolge het bepaalde bij of krachtens [Hoofdstuk II van de Wet op de vennootschapsbelasting 1969][ref1]
      als winst wordt beschouwd, indien de gewezen zelfstandige de onderneming heeft uitgeoefend in de vorm van een
      naamloze vennootschap of een besloten vennootschap.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0004167/2010-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002672
        hoofdstuk: II
  - number: '3.2'
    text: |-
      Onder winst, bedoeld in het eerste lid, onderdeel *a*, worden niet verstaan de bestanddelen van de winst, bedoeld
      in [artikel 3.78, derde lid, onderdelen a, b en c van de Wet inkomstenbelasting 2001][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0004167/2010-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: '3.3'
    text: |-
      Onder winst als bedoeld in het eerste lid, onderdeel a, worden mede verstaan de partnervergoeding, bedoeld in
      [artikel 3.16, vierde lid, van de Wet inkomstenbelasting 2001][ref1], indien deze vergoeding € 5000 of hoger is,
      en de winst van de echtgenoot van de gewezen zelfstandige, indien het bedrijf of beroep mede voor rekening van
      de echtgenoot wordt uitgeoefend. Onder winst, bedoeld in het eerste lid, onderdeel b, worden mede verstaan de
      betalingen die aan de echtgenoot worden gedaan ter zake van in de onderneming verrichte arbeid.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0004167/2010-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: '3.4'
    text: |-
      De winst, bedoeld in het eerste lid, onderdeel *b*, wordt gecorrigeerd met alle geldelijke voor- en nadelen voor
      de gewezen zelfstandige, die uit diens verhouding tot de besloten of naamloze vennootschap voortvloeien, tenzij het
      inkomen uit of in verband met arbeid betreft, als bedoeld in [artikel 2, eerste lid, onderdelen b of c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004167#Artikel2
    url: https://wetten.overheid.nl/BWBR0004167/2010-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0004167
        artikel: '2'
  - number: '3.5'
    text: |-
      Indien de toepassing van het eerste lid tot een kennelijk onredelijk resultaat leidt, gelet op de aard en strekking
      van de wet, corrigeren burgemeester en wethouders de in dit lid bedoelde winst dienovereenkomstig.
    url: https://wetten.overheid.nl/BWBR0004167/2010-01-01#Artikel3
  - number: '4.1'
    text: 'Voor de toepassing van artikel 8, eerste lid, van de wet wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0004167/2010-01-01#Artikel4
  - number: 4.1.a
    text: |-
      inkomen uit arbeid in het bedrijfs- of beroepsleven: de opbrengst van arbeid, bedoeld in de [artikelen 3][ref1],
      [4][ref2], [5][ref3] en [5a van het Inkomensbesluit IOAW][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0004091#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0004091#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0004091#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0004091#Artikel5a
    url: https://wetten.overheid.nl/BWBR0004167/2010-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0004091
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0004091
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0004091
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0004091
        artikel: 5a
  - number: 4.1.b
    text: |-
      inkomen in verband met arbeid in het bedrijfs- of beroepsleven: het inkomen, als bedoeld in
      [artikel 7 van het Inkomensbesluit IOAW][ref1], met uitzondering van het eerste lid, onderdeel
      *q*, met dien verstande dat hieronder mede wordt verstaan een uitkering op grond van de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004091#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0004044
    url: https://wetten.overheid.nl/BWBR0004167/2010-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0004091
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0004044
  - number: '4.2'
    text: |-
      Het inkomen uit of in verband met arbeid, bedoeld in het eerste lid, wordt in de maand waarover aanspraak op
      uitkering wordt gemaakt vastgesteld op het bedrag dat de gewezen zelfstandige en de echtgenoot over die maand
      verwerven of redelijkerwijs geacht kunnen worden te verwerven.
    url: https://wetten.overheid.nl/BWBR0004167/2010-01-01#Artikel4
  - number: '4.3'
    text: |-
      Indien aannemelijk is, dat een inkomensbestanddeel geen juiste maatstaf biedt voor de bepaling van het in het
      eerste lid bedoelde inkomen, wordt dat bestanddeel per maand vastgesteld op 1/3 onderscheidenlijk 1/12 van het
      bedrag, dat over drie maanden onderscheidenlijk een jaar is verworven.
    url: https://wetten.overheid.nl/BWBR0004167/2010-01-01#Artikel4
  - number: '4.4'
    text: |-
      Indien de toepassing van het tweede en derde lid, gelet op het tijdstip van verwerving van een inkomensbestanddeel,
      tot een kennelijk onredelijk resultaat leidt, bepalen burgemeester en wethouders op welke periode dat
      inkomensbestanddeel geacht moet worden over deze periode te zijn verdeeld.
    url: https://wetten.overheid.nl/BWBR0004167/2010-01-01#Artikel4
  - number: '5'
    text: Dit besluit treedt in werking met ingang van 1 juli 1987.
    url: https://wetten.overheid.nl/BWBR0004167/2010-01-01#Artikel5
  - number: '6'
    text: Dit besluit kan worden aangehaald als Inkomensbesluit IOAZ.
    url: https://wetten.overheid.nl/BWBR0004167/2010-01-01#Artikel6
