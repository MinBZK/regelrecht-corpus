  - number: '4'
    text: |-
      1 Voor de toepassing van artikel 8, eerste lid, van de wet wordt verstaan onder:

      a. inkomen uit arbeid in het bedrijfs- of beroepsleven: de opbrengst van arbeid, bedoeld in de [artikelen 3][ref1],
      [4][ref2], [5][ref3] en [5a van het Inkomensbesluit IOAW][ref4];

      b. inkomen in verband met arbeid in het bedrijfs- of beroepsleven: het inkomen, als bedoeld in
      [artikel 7 van het Inkomensbesluit IOAW][ref5], met uitzondering van het eerste lid, onderdeel
      *q*, met dien verstande dat hieronder mede wordt verstaan een uitkering op grond van de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref6].

      2 Het inkomen uit of in verband met arbeid, bedoeld in het eerste lid, wordt in de maand waarover aanspraak op
      uitkering wordt gemaakt vastgesteld op het bedrag dat de gewezen zelfstandige en de echtgenoot over die maand
      verwerven of redelijkerwijs geacht kunnen worden te verwerven.

      3 Indien aannemelijk is, dat een inkomensbestanddeel geen juiste maatstaf biedt voor de bepaling van het in het
      eerste lid bedoelde inkomen, wordt dat bestanddeel per maand vastgesteld op 1/3 onderscheidenlijk 1/12 van het
      bedrag, dat over drie maanden onderscheidenlijk een jaar is verworven.

      4 Indien de toepassing van het tweede en derde lid, gelet op het tijdstip van verwerving van een
      inkomensbestanddeel, tot een kennelijk onredelijk resultaat leidt, bepalen burgemeester en wethouders op welke
      periode dat inkomensbestanddeel geacht moet worden over deze periode te zijn verdeeld.


