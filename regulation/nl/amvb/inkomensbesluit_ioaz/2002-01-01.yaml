articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder de wet:

      de [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref1] (*Stb.* 1987,
      281).


      [ref1]: https://wetten.overheid.nl/BWBR0004163
    url: https://wetten.overheid.nl/BWBR0004167/2002-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004163
  - number: '2'
    text: |-
      1 Voor de toepassing van [artikel 5, tweede lid][ref1], 2° en 3°, en derde lid, 2°, van de wet wordt onder inkomen
      uit of in verband met arbeid in het bedrijfs- of beroepsleven verstaan:

      a. winst uit bedrijf en zelfstandig uitgeoefend beroep;

      b. opbrengst van arbeid als bedoeld in de [artikelen 3][ref2], [4][ref3], [5 ][ref4]en
      [5a van het Inkomensbesluit IOAW][ref5];.

      c. behoudens het bepaalde in het tweede lid van dit artikel, inkomen in verband met arbeid in het bedrijfs- of
      beroepsleven, als bedoeld in [artikel 7 van het Inkomensbesluit IOAW][ref6].

      2 Onder inkomen in verband met arbeid, als bedoeld in het eerste
      lid, onderdeel *c*, wordt mede verstaan een uitkering op grond van de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref7] (*Stb.* 1987, 92).

      3 Behoudens het bepaalde in [artikel 3, derde lid][ref8], wordt onder inkomen uit of in verband met arbeid, als
      bedoeld in het eerste en tweede lid van dit artikel, niet verstaan het inkomen van de echtgenoot.


