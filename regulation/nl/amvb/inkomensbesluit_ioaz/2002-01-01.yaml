  - number: '3'
    text: |-
      1 Onder winst, bedoeld in [artikel 2, eerste lid, onderdeel a][ref1], wordt verstaan:

      a. de belastbare winst uit onderneming, bedoeld in paragraaf 3.2.1. van de [Wet inkomstenbelasting 2001][ref2],
      vermeerderd met de ondernemersaftrek, bedoeld in paragraaf 3.2.4 van [die wet][ref3], indien de gewezen
      zelfstandige het bedrijf of beroep heeft uitgeoefend in de vorm van een éénmanszaak, maatschap, vennootschap onder
      firma of commanditaire vennootschap;

      b. hetgeen ingevolge het bepaalde bij of krachtens [Hoofdstuk II van de Wet op de vennootschapsbelasting 1969][ref4]
      als winst wordt beschouwd, indien de gewezen zelfstandige de onderneming heeft uitgeoefend in de vorm van een
      naamloze vennootschap of een besloten vennootschap.

      2 Onder winst, bedoeld in het eerste lid, onderdeel *a*, worden niet verstaan de bestanddelen van de winst, bedoeld
      in [artikel 3.78, derde lid, onderdelen a, b en c van de Wet inkomstenbelasting 2001][ref5].

      3 Onder winst als bedoeld in het eerste lid, onderdeel a, worden mede verstaan de partnervergoeding, bedoeld in
      [artikel 3.16, vierde lid, van de Wet inkomstenbelasting 2001][ref6], indien deze vergoeding € 5000 of hoger is,
      en de winst van de echtgenoot van de gewezen zelfstandige, indien het bedrijf of beroep mede voor rekening van
      de echtgenoot wordt uitgeoefend. Onder winst, bedoeld in het eerste lid, onderdeel b, worden mede verstaan de
      betalingen die aan de echtgenoot worden gedaan ter zake van in de onderneming verrichte arbeid.

      4 De winst, bedoeld in het eerste lid, onderdeel *b*, wordt gecorrigeerd met alle geldelijke voor- en nadelen voor
      de gewezen zelfstandige, die uit diens verhouding tot de besloten of naamloze vennootschap voortvloeien, tenzij het
      inkomen uit of in verband met arbeid betreft, als bedoeld in [artikel 2, eerste lid, onderdelen b of c][ref7].

      5 Indien de toepassing van het eerste lid tot een kennelijk onredelijk resultaat leidt, gelet op de aard en
      strekking van de wet, corrigeren burgemeester en wethouders de in dit lid bedoelde winst dienovereenkomstig.


