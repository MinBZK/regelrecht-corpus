      - id: ref1
        bwb_id: BWBR0001898
        artikel: '21'
        paragraaf: B
        afdeling: II
  - number: '21'
    text: |-
      1 De in [artikel 20, eerste lid, letter ][ref1], bedoelde veiligheidskleppen moeten zoodanig ingericht en op den
      ketel of den stoomhouder geplaatst worden, dat zij, wanneer de ketel in werking is, gemakkelijk onderzocht en
      gedurende den rit ontlast kunnen worden.

      2 Aantal, afmetingen, vorm en belasting der veiligheidskleppen worden met inachtneming van de overige bepalingen
      in dit artikel zoodanig gekozen, dat in den ketel geene stoomdrukking kan ontstaan, welke de toe te laten grootste
      drukking, bedoeld in [artikel 23, tweede lid, letter ][ref2], met meer dan 5% daarvan overschrijdt.

      3 Behoudens het bepaalde in het vijfde lid is de middellijn van de in het eerste lid bedoelde kleppen niet kleiner
      te nemen dan die, berekend met de formule:

      In deze formule is: *d.* de klepmiddellijn in millimeters; *p.* de grootste toe te laten overdruk van den stoom in
      kilogrammen per vierkanten centimeter; *R.* het roosteroppervlak in vierkante meters.

      4 Heeft een ketel meer dan twee veiligheidskleppen, dan moet de som van de oppervlakten der klepopeningen ten
      minste gelijk zijn aan de som van de oppervlakten, die de openingen zouden moeten hebben, indien de ketel van
      slechts twee kleppen ware voorzien.

      5 De middellijn van elke klepopening mag niet kleiner zijn dan dertig millimeter.

      6 De veiligheidskleppen moeten met vlakke randen op hare zittingen sluiten; de breedte van het draagvlak mag ten
      hoogste het twintigste gedeelte van de middellijn der opening bedragen, doch mag in geen geval grooter zijn dan
      drie millimeter. Voor de toepassing van veiligheidskleppen van bijzondere constructie, waarvan de kleppen met
      schuine randen op hare zittingen sluiten, kan door de Minister vergunning worden verleend.

      7 De kleppen moeten middellijk of onmiddellijk door veeren worden belast; deze zijn zoodanig te maken, dat de
      klep, alvorens de druk in den ketel den grootsten toegelaten druk met een kilogram per vierkanten centimeter
      overschrijdt, ten minste twee millimeter wordt gelicht. De kleppen moeten ten minste drie millimeter gelicht kunnen
      worden en geborgd zijn tegen het wegslingeren voor het geval, dat een veer mocht breken.


      [ref1]: https://wetten.overheid.nl/BWBR0001898#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0001898#Artikel23
