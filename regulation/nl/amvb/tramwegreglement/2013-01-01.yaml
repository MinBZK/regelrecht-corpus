  - number: '78'
    text: |-
      1 De dienst- en rusttijden der beambten, behalve voor personen, werkzaam op treinen of op trekvoertuigen, voor
      wie registers als genoemd in het derde lid worden bijgehouden, worden, voor zoover deze niet bij algemeene
      aanschrijving zijn geregeld, opgenomen in dienstroosters, waarin achter den naam van elk hunner melding gemaakt
      wordt van de strekking, de dagteekening en het nummer der hem betreffende beschikkingen van den Minister krachtens
      [artikel 73, onder A.][ref1], [74, vierde lid][ref2], [75, tweede lid][ref3] en [artikel 77][ref4] genomen. De
      dienst- en rusttijden van het reserve-personeel, zoomede van hen, belast met de aflossing bij ziekte en verlof,
      worden aangeteekend op daarvoor door de Minister vast te stellen modellen.

      2 Aan elk station, elke halte, elken post, elk kantoor, elke remise of werkplaats, worden de dienstroosters, voor
      zoover die krachtens het in het eerste lid bepaalde worden vereischt binnen vier (4) weken na het in werking treden
      van eene nieuwe dienstregeling op eene zichtbare plaats opgehangen. De Minister kan van deze bepaling ontheffing
      verleenen.

      3 Door bestuurders worden registers aangelegd en geregeld bijgehouden ter plaatse door de Minister te bepalen,
      waarin voor elk persoon, werkzaam op treinen of op trekvoertuigen, wordt aangeteekend tusschen welke tijdstippen
      hij dagelijks dienst heeft gedaan. De registers worden ingericht naar een model, dat door den Minister, bestuurders
      gehoord, wordt vastgesteld. De Minister kan van deze bepaling ontheffing verleenen. Aan de leden van de Minister en
      de door deze aangewezen ambtenaren, wordt te allen tijde op hun verlangen inzage van die registers verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0001898#Artikel73
      [ref2]: https://wetten.overheid.nl/BWBR0001898#Artikel74
      [ref3]: https://wetten.overheid.nl/BWBR0001898#Artikel75
      [ref4]: https://wetten.overheid.nl/BWBR0001898#Artikel77
    url: https://wetten.overheid.nl/BWBR0001898/2013-01-01#Artikel78
