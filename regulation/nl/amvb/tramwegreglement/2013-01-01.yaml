  - number: '8'
    text: >-
      1 De plaats en inrichting van alle seinen ten behoeve van den tramweg behoeven de instemming van de Minister.


      2 Waar de Minister zulks in het belang van het veilig verkeer bepaalt, moeten bestuurders voor het opstellen en
      bedienen van seinen of voor het wijzigen van bestaande seinen zorg dragen.


      3 Bedraagt de grootste toegelaten snelheid meer dan 20 K.M. per uur, dan moeten bestuurders daar, waar de Minister
      zulks in het belang van het veilig verkeer bepaalt, zorgen voor het aanleggen en bedienen van telegraaf- of
      telefoonlijnen met bijbehoorende toestellen.


      4 Bestuurders zorgen, dat beweegbare bruggen in den tramweg van seinen zijn voorzien, waardoor op voldoenden
      afstand aan het personeel der treinen kenbaar wordt gemaakt, of de brug al dan niet veilig kan worden bereden,
      en doen die seinen behoorlijk bedienen en verlichten. De afstand van deze seinen tot en hun verband met de brug
      behoeven de instemming van de Minister.


      5 De Minister kan van het bepaalde in het vierde lid ontheffing verleenen.
    url: https://wetten.overheid.nl/BWBR0001898/2013-01-01#Artikel8
  - number: '9'
    text: >-
      1 De treinen voeren 's nachts van voren tenminste twee witte lichten en van achteren tenminste een rood licht.


      2 De plaats en inrichting van deze lichten behoeven de instemming van de Minister.


      3 Treinen die op het moment van het van kracht worden van dit besluit zijn uitgerust om van voren slechts een wit
      licht te kunnen tonen, voeren 's nachts van voren een wit licht en van achteren tenminste een rood licht.
    url: https://wetten.overheid.nl/BWBR0001898/2013-01-01#Artikel9
  - number: '10'
    text: >-
      1 Alle seinen, welke bij de uitoefening van den dienst op een tramweg gegeven kunnen worden, worden omschreven
      en hun gebruik wordt geregeld in een reglement, seinreglement genoemd, dat na instemming van den Minister door
      bestuurders wordt vastgesteld.


      2 In het seinreglement wordt omschreven welke seinen des daags en welke des nachts zullen worden gegeven. Bij
      mistig weder, sneeuwjacht en bij andere omstandigheden waardoor de dagseinen niet duidelijk te onderscheiden
      zijn moeten des daags, voorzover het dagsein niet door een lichtsein wordt gegeven, naast de dagseinen ook de
      nachtseinen worden getoond, tenzij de Minister afwijking hiervan toestaat.


      3 Bestuurders zorgen, dat voldoende middelen aanwezig zijn, om de in het seinreglement omschreven seinen te geven.
    url: https://wetten.overheid.nl/BWBR0001898/2013-01-01#Artikel10
  - number: '11'
    text: |-
      1 Een ieder is verplicht op overwegen in wegen die niet voor het openbaar verkeer open staan, treinen, rangeerdelen
      en bijzondere voertuigen voor te laten gaan en daarbij de gehele overweg vrij te laten.

      2 Het is een ieder verboden een overweg als bedoeld in het eerste lid, op te gaan, tenzij hij direct kan doorgaan
      en de overweg geheel vrij kan maken.

      3 Het is een ieder verboden een overweg als bedoeld in het eerste lid, op te gaan indien een verkeerslicht, als
      bedoeld in [artikel 20, eerste lid, onderdeel ][ref1], rood licht of rood knipperlicht toont, dan wel een stopteken
      als bedoeld in [artikel 20, eerste lid, onderdeel ][ref2], wordt getoond.


      [ref1]: https://wetten.overheid.nl/BWBR0001898#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0001898#Artikel20
    url: https://wetten.overheid.nl/BWBR0001898/2013-01-01#Artikel11
