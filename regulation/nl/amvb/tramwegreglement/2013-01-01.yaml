  - number: '24'
    text: >-
      1 Behalve vóór de indienststelling worden de stoomketels der trekvoertuigen door de Minister beproefd en
      onderzocht:


      a. telkenmale na het inwendig onderzoek, bedoeld in het tweede lid van dit artikel;


      b. na elke belangrijke herstelling;


      c. uiterlijk drie jaren na de voorafgaande beproeving;


      d. wanneer de Minister zulks om redenen van veiligheid noodig acht.


      2 Ten hoogste acht jaren na de indienststelling van een nieuwen stoomketel en daarna telkens na zes jaren wordt de
      ketel door de Minister inwendig nagezien, nadat daartoe alle vlampijpen zijn uitgenomen.


      3 De Minister is bevoegd aan bestuurders te vergunnen, dat eene, ingevolge het bepaalde in het eerste lid onder *c*
      te verrichten beproeving wordt uitgesteld, alsmede, dat voor een, ingevolge het bepaalde in het tweede lid in te
      stellen onderzoek niet alle vlampijpen worden uitgenomen.
    url: https://wetten.overheid.nl/BWBR0001898/2013-01-01#Artikel24
  - number: '25'
    text: >-
      1 De stoomketels worden in onbekleeden, of, met goedvinden van de Minister, in bekleeden toestand beproefd.


      2 De beproeving geschiedt met water op eene werkelijke drukking, bedragende vijf kilogrammen per vierkanten
      centimeter meer dan de gewenschte werkelijke stoomdrukking.


      3 Zij duurt zoo lang als noodig is om de verschillende deelen van den ketel behoorlijk te onderzoeken. De
      proefdrukking moet direct worden gemeten met een proefmanometer, welks aanwijzing van tijd tot tijd wordt
      onderzocht.


      4 Bij gelegenheid van elke beproeving wordt de juistheid van de belasting der veiligheidskleppen en van de
      aanwijzing van den manometer nagegaan.


      5 De uitkomst van eene beproeving is onvoldoende, zoo eenig deel van den ketel eene nadeelige vervorming heeft
      ondergaan, of zoo andere belangrijke gebreken aan den dag zijn gekomen.
    url: https://wetten.overheid.nl/BWBR0001898/2013-01-01#Artikel25
  - number: '26'
    text: >-
      1 Indien eenige beproeving of eenig onderzoek na de indienststelling onvoldoende uitkomsten heeft opgeleverd, mag
      de stoomketel niet weer in gebruik worden genomen, dan nadat de door de Minister noodig geachte voorzieningen zijn
      aangebracht.


      2 Blijkt uit zoodanige beproeving of zoodanig onderzoek, dat de stoomketel van een trekvoertuig niet meer onder
      de vroeger toegelaten hoogste stoomdrukking veilig werken kan, zoo wordt door de Minister aan bestuurders de keus
      gelaten de door den Raad noodig geachte voorzieningen aan te brengen, of wel de ketel voortaan met aanwending van
      eene op te geven lagere drukking te gebruiken. In het laatste geval wordt de vroeger voor het trekvoertuig, waarop
      de ketel gebruikt wordt, verleende akte van vergunning door eene nieuwe vervangen.
    url: https://wetten.overheid.nl/BWBR0001898/2013-01-01#Artikel26
  - number: '27'
    text: |-
      1 Van elke beproeving en van elk onderzoek, als in de [artikelen 23][ref1] en [24][ref2] bedoeld, wordt door den
      daarmede belasten rijksambtenaar aanteekening gehouden in een register, daartoe door bestuurders onder instemming
      van de Minister aan te leggen.

      2 In dat register wordt tevens aanteekening gehouden van de wijzigingen en de belangrijke herstellingen, die de
      ketel sedert de vorige beproeving heeft ondergaan, en van zijnen toestand.


      [ref1]: https://wetten.overheid.nl/BWBR0001898#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0001898#Artikel24
    url: https://wetten.overheid.nl/BWBR0001898/2013-01-01#Artikel27
