  - number: '28'
    text: |-
      Bij elke beproeving en bij elk inwendig onderzoek in [artikel 24][ref1] bedoeld van den stoomketel op een
      trekvoertuig wordt door bestuurders zorg gedragen, dat:

      a. de ketel, indien deze op het trekvoertuig ter beproeving wordt aangeboden, geplaatst zij boven een
      droogliggenden aschkuil, en in elk geval te bekwamer hoogte voor het onderzoek;

      b. de vuur- en rookkast en de pijpen behoorlijk gereinigd en de aschbak, roosters, vuurbrug, enz. verwijderd zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0001898#Artikel24
    url: https://wetten.overheid.nl/BWBR0001898/2013-01-01#Artikel28
