  - number: '96'
    text: >-
      Uiterlijk op 1 Mei 1921 moeten alle electrische en mechanische inrichtingen, aan, op of in trekvoertuigen, zoomede
      alle electrische inrichtingen aan, op of in rijtuigen en wagens voldoen aan de voorschriften van dit reglement,
      tenzij door den Minister van een dezer voorschriften tijdelijk ontheffing is verleend. In de ontheffing wordt
      behalve de voorwaarden, waaronder zij wordt verleend, tevens de termijn vermeld, waarvoor zij geldt.
    url: https://wetten.overheid.nl/BWBR0001898/2013-01-01#Artikel96
  - number: '97'
    text: >-
      Ten aanzien van buitenlandsche tramwegondernemingen, welke haren dienst hier te lande uitoefenen, kunnen door den
      Minister afwijkingen van dit reglement worden toegestaan.
    url: https://wetten.overheid.nl/BWBR0001898/2013-01-01#Artikel97
  - number: '98'
    text: Dit reglement kan worden aangehaald onder den titel "Tramwegreglement".
    url: https://wetten.overheid.nl/BWBR0001898/2013-01-01#Artikel98
