  - number: '80'
    text: >-
      1 Het is een ieder, behoudens uit de aard van zijn betrekking, verboden zich in of op een station of halte dan wel
      in een trein in een zodanige toestand te bevinden of zich zodanig te gedragen dat orde, rust, veiligheid of een
      goede bedrijfsgang wordt of kan worden verstoord.


      2 Als verstoring van orde, rust, veiligheid of een goede bedrijfsgang worden beschouwd:


      a. gedragingen waardoor de bediening en het gebruik van voorzieningen of van een trein dan wel de taakuitoefening
      van het personeel van de bestuurders worden verhinderd of belemmerd;


      b. misbruik maken van voorzieningen dan wel gebruik maken van voorzieningen of van een trein op een tijdstip waarop
      deze niet voor gebruik beschikbaar zijn dan wel op een andere wijze dan waarvoor deze bestemd zijn;


      c. uit een trein werpen van stoffen of van voorwerpen;


      d. zich in kennelijke staat van dronkenschap of onder kennelijke invloed van verdovende middelen bevinden;


      e. afsteken van vuurwerk, rumoer maken dan wel op zodanige wijze geluid voortbrengen dat anderen daarvan hinder
      ondervinden;


      f. uitoefenen van beroep of bedrijf;


      g. tentoonstellen van voorwerpen, maken van reclame of propaganda, verspreiden van drukwerken, bedelen of houden
      van inzamelingen;


      h. meenemen in een trein van dieren, stoffen of voorwerpen die hinder, gevaar, verontreiniging of beschadiging
      veroorzaken of kunnen veroorzaken;


      i. roken in een trein, station of halte, of gedeelten daarvan, ten aanzien waarvan de bestuurders hebben aangegeven
      dat roken niet is toegestaan;


      j. zich bevinden op een station of halte op een tijdstip dat deze kenbaar gesloten zijn of op een gedeelte van een
      station of halte dat kenbaar daartoe niet toegankelijk is;


      k. zich op een station of halte begeven langs een andere dan de daarvoor bestemde weg;


      l. op een andere wijze hinder, gevaar, verontreiniging of beschadiging veroorzaken of kunnen veroorzaken.


      3 Het bepaalde in het eerste en tweede lid is niet van toepassing voor zover de bestuurders daarvoor, met
      inachtneming van de belangen van reizigers, toestemming hebben gegeven.
    url: https://wetten.overheid.nl/BWBR0001898/2013-01-01#Artikel80
  - number: '81'
    text: >-
      1 Een ieder is verplicht de aanwijzingen betreffende de orde, rust, veiligheid of goede bedrijfsgang op te volgen,
      die door de bestuurders duidelijk kenbaar zijn gemaakt.


      2 Een aanwijzing om zich te verwijderen, kan worden gegeven voor een bij de aanwijzing te bepalen tijdsduur.
    url: https://wetten.overheid.nl/BWBR0001898/2013-01-01#Artikel81
  - number: '85'
    text: >-
      1 Bestuurders zijn verplicht ten minste acht dagen vóór de opening van den dienst op een tramweg:


      a. aankondiging van de opening en van de regeling van den dienst te doen in een of meer door de Minister aan te
      wijzen bladen;


      b. een afdruk of gewaarmerkt afschrift van die aankondiging te zenden aan:


      den Minister;


      Gedeputeerde Staten der provinciën en de besturen der gemeenten, door welke de tramweg loopt;


      de officier van justitie in het arrondissement waarin de rechtbank is gelegen waartoe die gemeenten behoren.


      2 De in het vorig lid bedoelde aankondiging houdt in:


      a. den naam en den zetel van de tramwegonderneming en de namen der bestuurders;


      b. het tijdstip, waarop de dienst geopend zal worden;


      c. de dienstregeling van de treinen voor het reizigersvervoer, waarin alle plaatsen worden opgenomen, waar de
      treinen geregeld stilhouden.
    url: https://wetten.overheid.nl/BWBR0001898/2013-01-01#Artikel85
  - number: '86'
    text: >-
      1 Van elke gewijzigde dienstregeling zenden bestuurders een afdruk of gewaarmerkt afschrift aan de Minister en doen
      zij aankondiging in een of meer door de Minister aan te wijzen bladen.


      2 De in het eerste lid van dit artikel bedoelde aankondiging en kennisgeving geschieden ten minste acht dagen vóór
      het in werking treden van eene gewijzigde dienstregeling. Deze aankondiging moet den datum van in werking treden
      der gewijzigde dienstregeling bevatten en, indien zij de aangebrachte wijziging niet volledig vermeldt, de plaats
      waar zij verkrijgbaar is.


      3 Slechts wanneer bijzondere omstandigheden de naleving van het bepaalde in het vorige lid onmogelijk maken, mag
      deze aankondiging en kennisgeving, laatstbedoelde onder vermelding van deze omstandigheden, later geschieden en wel
      uiterlijk op den dag, waarop de dienstregeling in werking treedt.
    url: https://wetten.overheid.nl/BWBR0001898/2013-01-01#Artikel86
  - number: '87'
    text: >-
      1 Bestuurders zorgen bovendien, dat in elk rijtuig en in elke rijtuigafdeeling, alsmede in of nabij elk
      wachtlokaal, een afdruk van de geldende dienstregeling zoodanig, dat daarvan gemakkelijk kan worden kennis genomen,
      is opgehangen of aangeplakt.


      2 De Minister kan van deze verplichting voor de rijtuigen en rijtuigafdeelingen ontheffing verleenen. Iedere
      conducteur moet in dat geval, terwijl hij als zoodanig dienst doet, van eene dienstregeling voorzien zijn.
    url: https://wetten.overheid.nl/BWBR0001898/2013-01-01#Artikel87
  - number: '92'
    text: |-
      In dit reglement wordt verstaan onder:

      *Minister:* de Minister, belast met de uitvoering van de [wet van 9 April 1875][ref1] (*Staatsblad* n°. 67) en van
      de [Locaalspoor- en Tramwegwet][ref2];

      *bestuurders:* bestuurders van den tramwegdienst;

      *grootste toegelaten snelheid:* de door den Minister ingevolge [artikel 56][ref3] van dit reglement voor elken
      tramweg bepaalde grootste snelheid van vervoer;

      *trekvoertuig:* het voertuig, waarvan de bewegende kracht uitgaat, al of niet tevens voor het vervoer van reizigers
      of (en) goederen ingericht;

      *machinist:* de beambte, belast met de bediening van een door stoomkracht bewogen trekvoertuig;

      *wagenvoerder:* de beambte, belast met de bediening van een door andere dan stoomkracht bewogen trekvoertuig;

      *trein:* elk trekvoertuig in dienstvaardigen staat met of zonder andere voertuigen;

      *rijtuig:* elk voertuig, geheel of gedeeltelijk ingericht voor het vervoer van reizigers;

      *wagen:* elk voertuig, ingericht voor het vervoer van bagage, goederen of levende dieren of ingericht als
      postkantoor;

      *overweg:* een gelijkvloerse kruising van een tramweg en een weg;

      *nacht:* de tijd tussen vijftien minuten na zonsondergang en vijftien minuten vóór zonsopgang.


      [ref1]: https://wetten.overheid.nl/BWBR0001848
      [ref2]: https://wetten.overheid.nl/BWBR0001866
      [ref3]: https://wetten.overheid.nl/BWBR0001898#Artikel56
    url: https://wetten.overheid.nl/BWBR0001898/2013-01-01#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0001848
      - id: ref2
        bwb_id: BWBR0001866
      - id: ref3
        bwb_id: BWBR0001898
        artikel: '56'
        afdeling: III
  - number: '95'
    text: >-
      1 Waar in dit reglement aan den Minister de bevoegdheid is toegekend om ontheffing te verleenen van bepalingen van
      dit reglement, kunnen aan die ontheffingen voorwaarden worden verbonden.


      2 Het niet naleven van de gestelde voorwaarden staat gelijk met overtreding van de bepalingen, van welke onder die
      voorwaarden ontheffing werd verleend.
    url: https://wetten.overheid.nl/BWBR0001898/2013-01-01#Artikel95
  - number: 95a
    text: |-
      1 Ten aanzien van de tramwegen in beheer bij de N.V. Nederlandse Spoorwegen wordt de toepassing van de
      [artikelen 1][ref1], [3][ref2], [4-6][ref3], [8, eerste tot en met vierde lid][ref4], [9][ref5], [12][ref6],
      [14, derde lid][ref7], [15-27][ref8], [29][ref9], [30][ref10], [32][ref11], [33][ref12], [35][ref13],
      [36][ref14], [38-40][ref15], [42][ref16], [43][ref17], [45-50][ref18], [52-55][ref19], [59][ref20], [61][ref21],
      [65][ref22], [66][ref23], en [71][ref24], aldus gewijzigd, dat voor zooveel bij of volgens een dezer bepalingen
      aan de Minister of één zijner ambtenaren eenige bemoeienis is opgedragen, in de plaats hiervan de directie der
      vennootschap daarmede is belast onder verplichting tot inachtneming van door den Minister te geven voorschriften,
      en dat de toezending van de opgaven, bedoeld in de [artikelen 16, derde lid][ref25], [23, tweede lid][ref26],
      [32, tweede lid][ref27], [38, tweede lid][ref28], en [40, vierde lid][ref29], achterwege kan blijven.

      2 Ten aanzien van de tramwegen in beheer bij de N.V. Gemengd Bedrijf Haagsche Tramweg Maatschappij wordt de
      toepassing van de [artikelen 1][ref30], [3][ref31], [4][ref32], [6][ref33], [8][ref34] , [16][ref35], [17][ref36],
      [18][ref37], [29][ref38], [30][ref39], [32][ref40], [33][ref41], [35][ref42], [36][ref43], [39][ref44],
      [40][ref45], [42][ref46], [43][ref47], [45-50][ref48] en [52][ref49], [53][ref50], [55][ref51], [65][ref52],
      [71][ref53], [87][ref54] , [88][ref55] en [90][ref56] aldus gewijzigd, dat voor zoveel bij of volgens een
      dezer bepalingen aan de Minister of een zijner ambtenaren enige bemoeienis is opgedragen, in de plaats hiervan
      de Directie der Vennootschap daarmede is belast, onder verplichting tot inachtneming van door de Minister
      te geven voorschriften, en dat de toezending van de opgaven, bedoeld in de [artikelen 16, derde lid][ref57],
      [32, tweede lid][ref58], en [40, vierde lid][ref59], achterwege kan blijven.


