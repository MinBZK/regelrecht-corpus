  - number: '32'
    text: |-
      1 Mechanische en electrische inrichtingen op trekvoertuigen, welke door andere drijfkracht dan stoom worden
      bewogen, worden niet in gebruik genomen dan na door de Minister te zijn onderzocht, beproefd en geaccordeerd.

      2 Bestuurders zenden van elk zoodanig trekvoertuig aan de Minister eene opgave behelzende:

      a. de gegevens, vermeld in [artikel 18, lid 5, 6, I, lid 6, II, of lid 6, III][ref1];

      b. ingeval zoodanig trekvoertuig elders dienst heeft gedaan, den datum van eerste ingebruikneming en de
      herstellingen, die het in de laatste zes jaren heeft ondergaan.

      3 Indien de in [artikel 16][ref2] bedoelde teekeningen of schakelschema's niet voldoende duidelijk zijn, moeten de
      door de Minister nader noodig geoordeelde detailteekeningen of nader uitgewerkte schakelschema's worden overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001898#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0001898#Artikel16
