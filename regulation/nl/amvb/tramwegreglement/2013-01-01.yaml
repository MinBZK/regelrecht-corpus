  - number: '64'
    text: |-
      Bestuurders zorgen, dat:

      a. met de rijtuigen niet meer personen vervoerd worden dan krachtens [artikel 42][ref1] in elk rijtuig of in elke
      afdeeling en op elk balcon mogen worden vervoerd;

      b. de wagens niet beladen worden boven het draagvermogen, krachtens [artikel 42][ref2] vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0001898#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0001898#Artikel42
    url: https://wetten.overheid.nl/BWBR0001898/2013-01-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0001898
        artikel: '42'
        paragraaf: D
        afdeling: II
      - id: ref2
        bwb_id: BWBR0001898
        artikel: '42'
        paragraaf: D
        afdeling: II
  - number: '65'
    text: >-
      1 De rijtuigen zijn gedurende den tijd, dat zij ten dienste van het publiek gebruikt worden:


      a. des nachts behoorlijk verlicht;


      b. van 1 November tot 1 April behoorlijk verwarmd.


      2 De Minister kan van de verplichting tot verwarming ontheffing verleenen.
    url: https://wetten.overheid.nl/BWBR0001898/2013-01-01#Artikel65
  - number: '66'
    text: |-
      1 Treinen, geheel bestaande uit materiëel van spoorwegen, voor welke de [spoorwegwet][ref1] geldt, daaronder
      begrepen de locaalspoorwegen blijven enz.

      2 De Minister kan van het bepaalde in het eerste lid ontheffing verleenen.


      [ref1]: https://wetten.overheid.nl/BWBR0001848
    url: https://wetten.overheid.nl/BWBR0001898/2013-01-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0001848
  - number: '67'
    text: >-
      Alle beambten, wier werkzaamheden op de veiligheid van het verkeer van invloed kunnen zijn, moeten kunnen lezen en
      schrijven alsmede een voldoend gehoorvermogen en een voldoende gezichtsvermogen bezitten, voor zoover zulks voor de
      behoorlijke uitoefening van hun dienst wordt vereischt.
    url: https://wetten.overheid.nl/BWBR0001898/2013-01-01#Artikel67
  - number: '68'
    text: >-
      1 De machinist of de wagenvoerder moet geheel bekend zijn met de inrichting van het trekvoertuig, met die der
      andere voertuigen en met het gebruik van de verschillende toestellen, handels, enz. op het trekvoertuig. Hij moet
      bovendien kleine herstellingen aan het materieel kunnen uitvoeren.


      2 Hij mag eerst indien hij ten minste 19 jaar oud is worden belast met het besturen van een trekvoertuig in de
      rangeerdienst of van een trein waarmede uitsluitend goederen worden vervoerd en eerst indien hij ten minste 21 jaar
      oud is met het besturen van een trein waarmede reizigers worden vervoerd.
    url: https://wetten.overheid.nl/BWBR0001898/2013-01-01#Artikel68
  - number: '69'
    text: >-
      Dienstvoertuigen al of niet door mechanische kracht bewogen mogen op den tramweg slechts gebruikt worden onder
      verantwoordelijkheid van een begeleidenden beambte en zoodanig, dat het veilig en regelmatig verkeer over den
      tramweg daarvan geen nadeel ondervindt.
    url: https://wetten.overheid.nl/BWBR0001898/2013-01-01#Artikel69
  - number: '70'
    text: >-
      1 Indien zich gedurende den rit feiten of omstandigheden voordoen, waardoor de veiligheid van het verkeer over
      den tramweg in gevaar kan worden gebracht, geeft de beambte, aan wien de leiding van den trein is opgedragen, zoo
      spoedig mogelijk daarvan kennis aan den beambte van het meest nabij gelegen station.


      2 Bij ongevallen neemt eerstgenoemde beambte de noodige maatregelen tot beveiliging van den trein.
    url: https://wetten.overheid.nl/BWBR0001898/2013-01-01#Artikel70
  - number: '71'
    text: >-
      Bestuurders moeten ten genoegen van de Minister de noodige maatregelen nemen, waardoor wordt verzekerd, dat bij een
      ongeval spoedig hulp kan worden verleend en zoo noodig de weg ontruimd en hersteld.
    url: https://wetten.overheid.nl/BWBR0001898/2013-01-01#Artikel71
  - number: '72'
    text: >-
      1 Van alle feiten, die de veiligheid van het verkeer over den tramweg in gevaar hebben gebracht, ook dan wanneer
      daaruit geenerlei noodlottige gevolgen zijn ontstaan, alsmede van alle ongevallen, waarbij personen worden gedood
      of verwond, geven bestuurders zoo spoedig mogelijk schriftelijk kennis aan een der rijksambtenaren, belast met het
      toezicht op de spoorwegen.


      2 Bij ernstige ongevallen wordt bovendien na het onderzoek door bestuurders een verslag, waarin zooveel mogelijk de
      oorzaken van het ongeval zijn vermeld, aan de Minister en aan den bovenbedoelden rijksambtenaar toegezonden.


      3 Zo het voorval de dood of de verwonding, anders dan van lichte aard, van één of meer personen tengevolge heeft
      gehad, geschiedt de in het eerste lid bedoelde kennisgeving telegrafisch of telefonisch en wordt van het gebeurde
      door bestuurders onmiddellijk telefonisch bericht gegeven aan de burgemeester der gemeente, in welke het ongeval
      heeft plaatsgehad, en aan de Officier van Justitie bij de rechtbank, onder welke die gemeente ressorteert. Tot
      lijkschouwing zal slechts in overleg met de laatstgenoemde ambtenaar mogen worden overgegaan.
    url: https://wetten.overheid.nl/BWBR0001898/2013-01-01#Artikel72
  - number: '73'
    text: |-
      In deze afdeeling wordt verstaan:

      A. onder "beambten" alle personen, die bij eene tramwegonderneming in dienst zijn, met uitzondering van de
      personen, op wier arbeid van toepassing zijn de hoofdstukken IV en V der "Arbeidswet 1919" en van hen, te wier
      aanzien de Minister verklaart, dat aan toepasselijkheid van deze afdeeling geen behoefte bestaat;

      B. onder "diensttijd" de tijdruimte, gelegen tusschen twee onafgebroken rusttijden en (of) rustdagen, als genoemd
      in de [artikelen 75][ref1] en [76][ref2], na aftrek van de daarin gelegen rusttijden. Deze aftrek wordt niet
      toegelaten:

      voor rusttijden van minder dan een half uur;

      voor rusttijden, gelegen tusschen negen uur namiddag en negen uur voormiddag;

      voor rusttijden, welke niet op dienstrooster aangegeven, bij algemeene aanschrijving geregeld of op andere wijze
      vóór den aanvang van de dienstindeeling vastgesteld zijn;

      voor rusttijden van ander dan onderhoudspersoneel, welke niet op de standplaats genoten kunnen worden;

      C. onder "rusttijd" of "rustdag" de tijdruimte, waarin de beambte geheel vrij is van elke bemoeienis met den
      tramweg;

      D. onder "week" de kalenderweek;

      E. onder "standplaats" de plaats of plaatsen, waar zich bevindt het kantoor, de werkplaats, het station, de halte
      of de post, het baanvak of het locomotiefdepot, waarbij het personeel is ingedeeld;

      F. onder "jeugdige personen" beambten beneden 18 jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0001898#Artikel75
      [ref2]: https://wetten.overheid.nl/BWBR0001898#Artikel76
    url: https://wetten.overheid.nl/BWBR0001898/2013-01-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0001898
        artikel: '75'
        afdeling: V
      - id: ref2
        bwb_id: BWBR0001898
        artikel: '76'
        afdeling: V
  - number: '74'
    text: >-
      1 Een diensttijd mag twee malen in een tijdvak van twee (2) achtereenvolgende weken meer dan twaalf (12) doch niet
      meer dan veertien (14) uren bedragen en de overige malen niet meer dan twaalf (12) uren.


      2 De gezamenlijke duur van diensttijden en gedeelten van diensttijden mag per twee (2) achtereenvolgende weken niet
      meer bedragen dan:


      a. voor machinisten en wagenvoerders honderd veertien (114) uren;


      b. voor niet onder *a* vallende treinbeambten honderd twintig (120) uren;


      c. voor beambten, die naar het oordeel van de Minister uitsluitend of in hoofdzaak belast zijn met
      bewakingsdiensten honderd vier en veertig (144) uren;


      d. voor beambten, werkzaam in werkplaatsen, hieronder begrepen die, welke zijn belast met dagelijksch onderhoud van
      rollend materieel, zoo in als buiten die werkplaatsen, honderd (100) uren;


      e. voor beambten, werkzaam in remises, hieronder begrepen poetsers van rijtuigen, zoo in als buiten die remises,
      honderd twintig (120) uren;


      f. voor het overig personeel honderd acht en twintig (128) uren.


      3 Met betrekking tot het afwisselend verrichten van werkzaamheden, waarvoor verschillende maximum-diensttijden zijn
      vastgesteld, geldt het volgende:


      a. wanneer in den loop van twee (2) achtereenvolgende weken diensten worden verricht, waarvoor verschillende
      maximum-diensttijden zijn vastgesteld, zal het voor den betrokkene in den regel geldend maximum per twee
      (2) achtereenvolgende weken worden verhoogd of verlaagd met zooveel maal het verschil tusschen de maxima der
      desbetreffende gemiddelde diensttijden per dag, als het aantal dagen bedraagt, dat door hem volledig dienst wordt
      gedaan voor het verrichten van werkzaamheden, waarvoor een hooger of lager maximum in twee (2) achtereenvolgende
      weken is vastgesteld;


      b. onder maximum van den gemiddelden diensttijd wordt verstaan het cijfer, dat verkregen wordt door het maximum,
      voor twee (2) achtereenvolgende weken vastgesteld, door twaalf (12) te deelen;


      c. worden in één diensttijd werkzaamheden verricht, waarvoor verschillende maximum-diensttijden zijn vastgesteld,
      dan wordt dat maximum toegepast, hetwelk van toepassing is op die werkzaamheden, die meer dan den halven diensttijd
      in beslag nemen. Ingeval geene der verschillende werkzaamheden meer dan den halven diensttijd beslaan, gelden de
      bepalingen, waaronder de betrokkene in den regel werkzaam is.


      4 Voor de door den Minister aan te wijzen beambten mag intusschen de diensttijd en de gezamenlijke duur van de
      diensttijden of gedeelten van diensttijden per twee (2) achtereenvolgende weken niet meer bedragen dan een door den
      Minister te bepalen aantal uren, hetwelk lager - doch ten hoogste vier (4) uren voorzooveel betreft den diensttijd
      en ten hoogste achttien (18) uren voorzooveel betreft den gezamenlijken duur per twee (2) weken - is dan voor die
      beambten ingevolge het eerste en het tweede lid zou gelden.
    url: https://wetten.overheid.nl/BWBR0001898/2013-01-01#Artikel74
  - number: 74bis
    text: |-
      Behalve wanneer en voor zoover de Minister in bepaalde gevallen vergunning heeft gegeven, mogen

      a. voor de beambten, genoemd in [artikel 74, tweede lid, letter ][ref1], in een tijdvak van drie (3)
      achtereenvolgende weken niet meer dan twaalf (12) diensttijden geheel of gedeeltelijk gelegen zijn in de tijdruimte
      tusschen twaalf (12) uur des nachts en zes (6) uur des voormiddags;

      b. voor de beambten, genoemd in [artikel 74, tweede lid, letter ][ref2], in een tijdvak van drie (3)
      achtereenvolgende weken niet meer dan twaalf (12) diensttijden geheel of gedeeltelijk gelegen zijn in de tijdruimte
      tusschen twaalf (12) uur des nachts en vier (4) uur des voormiddags.


      [ref1]: https://wetten.overheid.nl/BWBR0001898#Artikel74
      [ref2]: https://wetten.overheid.nl/BWBR0001898#Artikel74
    url: https://wetten.overheid.nl/BWBR0001898/2013-01-01#Artikel74bis
    references:
      - id: ref1
        bwb_id: BWBR0001898
        artikel: '74'
        afdeling: V
      - id: ref2
        bwb_id: BWBR0001898
        artikel: '74'
        afdeling: V
  - number: '75'
    text: >-
      1 Aan de beambten moet in een tijdvak van twee (2) achtereenvolgende weken tusschen twee opeenvolgende diensttijden
      twee malen een onafgebroken rusttijd van ten minste tien (10) uren en de overige malen een van ten minste twaalf
      (12) uren worden gegeven.


      2 Op de door den Minister, bestuurders gehoord, te bepalen stations, halten, baanvakken of posten kan
      voorwaardelijk of onvoorwaardelijk voor de door hem aan te wijzen beambten die onafgebroken rusttijd tot ten minste
      tien (10) uren worden beperkt.


      3 Tusschen twee onafgebroken rusttijden en (of) rustdagen, als in dit artikel en in het volgende genoemd, mag geene
      grootere tijdruimte dan veertien (14) uren gelegen zijn.


      4 Aan de beambten moeten boven de in het eerste en tweede lid van dit artikel bedoelde rusttijden gedurende den
      diensttijd de noodige korte rustpoozen voor het gebruiken van de maaltijden worden toegestaan.
    url: https://wetten.overheid.nl/BWBR0001898/2013-01-01#Artikel75
  - number: 75a
    text: |-
      1 Jeugdige personen mogen tussen 18.00 en 7.00 uur geen dienst doen.

      2 In afwijking van het bepaalde in [artikel 75, eerste en tweede lid][ref1], moet aan jeugdige personen tussen twee
      opeenvolgende diensttijden een onafgebroken rusttijd van tenminste twaalf uren worden gegeven.

      3 Voor jeugdige personen geldt een dagelijkse arbeidstijd van ten hoogste acht uur.

      4 Aan jeugdige personen moet na een arbeidstijd van ten hoogste 4½ uur een ononderbroken rusttijd van tenminste een
      half uur worden gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0001898#Artikel75
    url: https://wetten.overheid.nl/BWBR0001898/2013-01-01#Artikel75a
    references:
      - id: ref1
        bwb_id: BWBR0001898
        artikel: '75'
        afdeling: V
  - number: '76'
    text: |-
      1 De beambten genieten elke week op hun standplaats een rustdag, waarvan in een tijdvak van drie (3)
      achtereenvolgende weken ten minste één moet omvatten den tijd tusschen Zondag 2 uur voormiddag en Maandag 4 uur
      voormiddag.

      2 De duur van elk dier rustdagen moet, indien zij niet onafgebroken op elkander volgen, ten minste dertig (30)
      uren bedragen; volgen eenige rustdagen elkander op, dan behoeft de duur van den tweeden rustdag en van de volgende
      rustdagen niet meer dan vier en twintig (24) uren te bedragen.

      3 Voor beambten, behoorende tot een Kerkgenootschap, dat den wekelijkschen rustdag niet op Zondag viert, wordt,
      wanneer zij aan bestuurders hun verlangen daartoe kenbaar hebben gemaakt, de Zondag als rustdag vervangen door den
      dag, die door hun Kerkgenootschap als wekelijksche rustdag is aangenomen.

      4 Jeugdige personen mogen op zaterdag en zondag geen arbeid verrichten.

      5 Indien op grond van [artikel 77 van het bepaalde in het vierde lid][ref1] ontheffing is verleend geldt voor
      jeugdige personen een wekelijkse rusttijd van tenminste 60 uren of twee ononderbroken rusttijden van elk tenminste
      36 uren, met dien verstande dat die rusttijd van tenminste 60 uren of een van die rusttijden van tenminste 36 uren
      een volle zaterdag of zondag omvat.


      [ref1]: https://wetten.overheid.nl/BWBR0001898#Artikel77
    url: https://wetten.overheid.nl/BWBR0001898/2013-01-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0001898
        artikel: '77'
        afdeling: V
  - number: '77'
    text: |-
      De Minister kan van de bepalingen van de [artikelen 74][ref1], [74bis][ref2], [75][ref3], [75][ref4],
      [76, eerste tot en met vierde lid][ref5], voorwaardelijk of onvoorwaardelijk ontheffing verlenen.


      [ref1]: https://wetten.overheid.nl/BWBR0001898#Artikel74
