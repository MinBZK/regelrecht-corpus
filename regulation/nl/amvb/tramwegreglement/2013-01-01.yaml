  - number: '12'
    text: >-
      1 De treinen moeten bij kruising op gelijke hoogte van den tramweg met een tramweg of anderen spoorweg steeds op
      ten minste twintig meter voor het kruispunt stilhouden en daar blijven staan, totdat een treinbeambte zich naar het
      kruispunt heeft begeven, en van daar uit door een sein heeft bericht, dat de bewaker van den te kruisen spoorweg
      toestemming geeft tot den overgang, of bij ontstentenis van bewaker, dat naar zijn oordeel de kruising veilig
      bereden kan worden.


      2 De Minister kan van het bepaalde in het eerste lid ontheffing verleenen, wanneer naar zijn oordeel op voldoende
      wijze in de beveiliging van de kruising is voorzien.
    url: https://wetten.overheid.nl/BWBR0001898/2013-01-01#Artikel12
  - number: '13'
    text: >-
      1 De Minister kan voor de niet op openbare wegen aangelegde gedeelten van tramwegen, die door of langs bosch-,
      veen-, of heidegronden of gronden met andere licht brandbare gewassen begroeid, aangelegd zijn, bepalen, dat en
      op welke van die gedeelten maatregelen genomen moeten worden, om bij het ontstaan van brand op het terrein van den
      tramweg het overslaan van den brand op de aangrenzende eigendommen te belemmeren.


      2 Op die baangedeelten zorgen bestuurders, dat het terrein van den tramweg door het graven van slooten, door het
      omspitten of bedekken met onbrandbare stoffen van een doorgaande strook grond, of door eenig ander middel van de
      aangrenzende eigendommen zoodanig wordt afgescheiden, dat het bovengenoemde gevaar voor het overslaan van brand
      naar het oordeel van de Minister voldoende beperkt wordt.
    url: https://wetten.overheid.nl/BWBR0001898/2013-01-01#Artikel13
  - number: '14'
    text: >-
      1 Het is verboden langs de niet op openbare wegen aangelegde gedeelten van tramwegen een gebouw, muur, schutting,
      aarden wal of ander verheven voorwerp op te richten of boomen of houtgewas te planten:


      a. binnen den afstand van 5 M. uit de as van het meest nabijgelegen spoor, zoowel op de rechte baan als langs de
      buitenzijde van den boog, waar de tramweg in gebogen richting is aangelegd;


      b. binnen den afstand van 10 M. uit die as langs de binnenzijde van den boog, waar de tramweg in gebogen richting
      is aangelegd;


      c. binnen den afstand van 10 M. uit die as over eene lengte van 25 M. wederzijds van en gemeten uit het midden van
      openbare wegen, die den tramweg kruisen.


      2 Het is verboden langs de niet op openbare wegen aangelegde gedeelten van tramwegen binnen den afstand van 10
      M. uit de as van het meest nabijgelegen spoor riet- of stroodaken te plaatsen, licht ontvlambare stoffen neer te
      leggen, of binnen dien afstand ontgravingen te verrichten.


      3 De Minister kan van het bepaalde in het eerste en tweede lid ontheffing verleenen, waar het zonder nadeel voor de
      openbare veiligheid en voor den tramweg kan geschieden.


      4 Hetgeen vòòr het in werking treden van dit reglement binnen de in het eerste en in het tweede lid bepaalde
      afstanden is opgericht, geplaatst, neergelegd of gegraven, wordt, zoo de openbare veiligheid het vordert, tegen
      voorafgaande schadeloosstelling op last van den Minister door en voor rekening van bestuurders weggenomen of
      gedicht. De schadeloosstelling wordt bij gebreke van minnelijke schikking door den rechter bepaald.
    url: https://wetten.overheid.nl/BWBR0001898/2013-01-01#Artikel14
  - number: '15'
    text: >-
      1 Elk trekvoertuig moet voorzien zijn:


      a. voor en achter van spoorstaafruimers en van eene veerkrachtige koppeling;


      b. van een zich onder het onmiddellijk bereik van de machinist of de wagenvoerder bevindende inrichting om
      geluidseinen te geven;


      c. van de noodige lantaarns en seinlampen;


      d. van eene krachtige gemakkelijk te bedienen rem, werkende op alle assen of wielen;


      e. van inrichtingen, waardoor zooveel mogelijk wordt voorkomen, dat menschen en dieren, die worden aangereden,
      onder de wielen geraken.


      2 De Minister kan ontheffing verleenen van het voorschrift onder *d*, voor zooveel daarin wordt bepaald, dat de rem
      op *alle* assen of wielen moet werken, en van het voorschrift onder *e*.
    url: https://wetten.overheid.nl/BWBR0001898/2013-01-01#Artikel15
  - number: '16'
    text: >-
      1 Alvorens trekvoertuigen aan te schaffen, bieden bestuurders aan den Minister eene volledig uitgewerkte, algemeene
      teekening dier voertuigen ter instemming aan, voor trekvoertuigen, door stoomkracht bewogen, bovendien eene
      volledig uitgewerkte ketelteekening en voor trekvoertuigen, middellijk of onmiddellijk door electriciteit gedreven,
      bovendien volledig uitgewerkte schakelschema's. Zij geven daarbij tevens op, welk aantal trekvoertuigen volgens de
      aangeboden teekeningen zal worden aangeschaft. Voor aanschaffing van een grooter aantal wordt opnieuw instemming
      van de bovenbedoelde teekeningen en schakelschema's vereischt.


      2 Het bepaalde in het eerste lid geldt ook voor tijdelijk in het voertuigpark op te nemen trekvoertuigen, tenzij
      daarvoor door bestuurders van een anderen tramwegdienst reeds aan deze bepalingen voldaan is.


      3 Van elk der in het eerste en tweede lid bedoelde trekvoertuigen zenden bestuurders aan de Minister vóór de
      indienststelling eene opgaaf omtrent het door weging gevonden gewicht van het trekvoertuig in dienstvaardigen
      toestand.
    url: https://wetten.overheid.nl/BWBR0001898/2013-01-01#Artikel16
  - number: '17'
    text: |-
      1 Trekvoertuigen worden niet in dienst gesteld dan na door de Minister te zijn onderzocht en geaccordeerd.

      2 Ten bewijze van die akkoordverklaring strekt de in [artikel 18][ref1] bedoelde akte van vergunning of de
      krachtens dat artikel verleende voorloopige vergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0001898#Artikel18
    url: https://wetten.overheid.nl/BWBR0001898/2013-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0001898
        artikel: '18'
        paragraaf: A
        afdeling: II
  - number: '18'
    text: |-
      1 Wanneer het onderzoek van een trekvoertuig bevredigende uitkomsten heeft opgeleverd en overigens voldaan
      is aan de bepalingen van dit reglement (voor trekvoertuigen, door stoomkracht bewogen, met name aan de
      [artikelen 23][ref1] en [25][ref2]; voor trekvoertuigen, door andere drijfkracht dan stoom bewogen, met name aan de
      [artikelen 32][ref3] en [34][ref4]), dan wordt door de Minister eene akte van vergunning uitgereikt.

      2 In afwachting van de uitreiking van deze akte kan de met het onderzoek belaste rijksambtenaar eene voorloopige
      schriftelijke vergunning tot indienststelling geven. Deze vergunning vervalt, indien zij niet binnen een door
      genoemden ambtenaar bepaalden termijn door uitreiking van de akte van vergunning is gevolgd.

      3 In de akte van vergunning worden vermeld:

      a. de naam van den tramwegdienst, die het trekvoertuig in gebruik neemt;

      b. het volgnummer en de korte omschrijving van het trekvoertuig;

      c. de datum, waarop het onderzoek heeft plaats gehad;

      d. de afwijkingen van dit reglement, die zijn toegestaan of gevorderd volgens [artikel 47][ref5].

      4 Indien het trekvoertuig door stoomkracht wordt bewogen, houdt de akte van vergunning bovendien in:

      a. den vorm en de afmetingen van den ketel en de grootte van het verwarmd oppervlak;

      b. het aantal van de veiligheidstoestellen en hunne voornaamste afmetingen;

      c. de grootste toegelaten werkelijke stoomdrukking in kilogrammen per vierkanten centimeter;

      d. de gegevens, vermeld in het zesde lid onder III *j* tot en met l.

      5 Indien het trekvoertuig door een verbrandingsmotor wordt gedreven, houdt de akte van vergunning bovendien in de
      gegevens, vermeld in het zesde lid onder II 1°. *a* tot en met *h,* en onder III *j* tot en met *l,* alsmede eene
      omschrijving van het stelsel van overbrenging van de drijfkracht.

      6 Indien het trekvoertuig middellijk of onmiddellijk door electriciteit wordt bewogen, houdt de akte van vergunning
      bovendien in:

      I. voor trekvoertuigen, welke eene accumulatorenbatterij voor drijfkracht medevoeren:

      a. den naam en de woonplaats van den fabrikant, het jaar van aanbouw en het type der accumulatorencellen;

      b. het totaal aantal cellen, waaruit de accumulatorenbatterij bestaat, benevens het aantal regelcellen;

      c. de normale ontlaadspanning en de minimum toegelaten ontlaadspanning der accumulatorenbatterij in volt;

      d. de maximum toegelaten laad- en ontlaadstroomen der accumulatorenbatterij in ampère;

      e. de capaciteit der accumulatorenbatterij in ampère-uren bij den in maximum toegelaten ontlaadstroom;

      f. de gegevens, vermeld onder III*c* tot en met l.

      II. Voor trekvoertuigen, welke een verbrandingsmotor gekoppeld met een electrischen generator voor drijfkracht
      medevoeren:

      1°. voor zoover het den verbrandingsmotor met toebehooren betreft;

      a. den naam en de woonplaats van den fabrikant, benevens het jaar van aanbouw;

      b. eene omschrijving van het stelsel;

      c. eene opgave van de constructiehoofdmaten, bij cylindermotoren de cylindermiddellijn en de lengte van den
      zuigerslag;

      d. eene opgave van het aantal omwentelingen per minuut;

      e. eene opgave van het vermogen van den verbrandingsmotor in effectieve paardekrachten;

      f. eene omschrijving van het stelsel der koelinrichting (radiator) en eene opgave van het aantal vierkante meters
      koeloppervlak per paardekracht;

      g. een opgave van het stelsel van de brandstoftoevoer;

      h. eene opgave van den inhoud van het vat, waarin de vloeibare brandstof wordt medegevoerd en van de wijze, waarop
      dit vat wordt gevuld en afgetapt;

      i. eene omschrijving van de koppeling van den verbrandingsmotor aan den electrischen generator;

      2°. voor zoover het den electrischen generator betreft:

      j. den naam en de woonplaats van den fabrikant, benevens het jaar van aanbouw;

      k. eene opgave van het aantal omwentelingen per minuut, van de normale bedrijfsspanning in volt en van het vermogen
      in kilowatt;

      l. eene opgave van de regel- en meetinrichtingen;

      m. de gegevens, vermeld onder III*c* tot en met l.

      III. Voor trekvoertuigen, welke drijfkracht ontleenen aan eene electrische boven- of ondergrondsche geleiding:

      a. het aantal en stelsel der stroomafnemers;

      b. het aantal en stelsel der spanningsveiligheden (bliksemafleiders);

      c. den naam en de woonplaats van den fabrikant, het type en aantal der aandrijvende electromotoren, benevens het
      jaar van aanbouw;

      d. de bedrijfsspanning in volt;

      e. de normale maximum-bedrijfsstroom in ampère;

      f. het uurvermogen der electromotoren in kilowatt;

      g. het stelsel van overbrenging van de motorassen op de drijfassen en de overbrengingsverhouding;

      h. het aantal en stelsel der wagenschakelaars, benevens eene opgave van de schakelingen, welke zij veroorloven tot
      stand te brengen;

      i. het aantal en stelsel der weerstanden, drijf- en stuurstroombeveiligingstoestellen en nooduitschakelaars;

      j. het aantal en stelsel der remmiddelen;

      k. het aantal en stelsel der zandsstrooiinrichtingen;

      l. het aantal en stelsel der geluidseinmiddelen.

      7 De akte van vergunning moet te allen tijde ter inzage aanwezig zijn in een door een der rijksambtenaren,
      belast met het toezicht op de spoorwegen, aan te wijzen werkplaats of kantoor van de tramwegdienst, waaronder het
      trekvoertuig behoort.


