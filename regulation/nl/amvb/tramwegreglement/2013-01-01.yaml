preamble:
  text: >-
    Wij WILHELMINA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.


    Op de voordracht van Onzen Minister van Waterstaat, van 12 Juli 1919, La. G., afdeeling Spoorwegen;


    Gelet op artikel 5, vijfde lid, der Locaalspoor- en Tramwegwet(Staatsblad n°. 99 van 1918);


    Den Raad van State gehoord (advies van 5 Augustus 1919, n°. 25);


    Gelet op het nader rapport van Onzen voornoemden Minister van 20 Februari 1920, n°. 302, afdeeling Spoorwegen;


    Hebben goedgevonden en verstaan:


    met ingang van den dag, op welken de Locaalspoor- en Tramwegwet in werking zal treden:
  url: https://wetten.overheid.nl/BWBR0001898/2013-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: >-
      1 De weg en de daartoe behoorende werken worden voortdurend zoodanig onderhouden, dat zij veilig met de grootste
      toegelaten snelheid kunnen worden bereden.


      2 Bij toepassing van electrische tractie met bovengrondschen stroomtoevoer is het in het eerste lid bepaalde
      ook van toepassing op de contactgeleidingen met al hetgeen tot hare bevestiging, ophanging, ondersteuning en
      beveiliging behoort.


      3 Wanneer de grootste toegelaten snelheid meer bedraagt dan 20 K.M. per uur, kan de Minister voorschrijven, dat
      gedeelten van den weg, welke wegens de uitvoering van werken of om andere redenen niet met die grootste toegelaten
      snelheid kunnen worden bereden, zoowel bij nacht als bij dag, gedurende den dienst, door van den trein duidelijk
      te herkennen seinen aangewezen moeten worden, alsmede dat gedeelten, welke tijdelijk niet te berijden zijn, door
      haltseinen, op voldoenden afstand geplaatst, kenbaar moeten worden gemaakt, ook wanneer geen trein wordt verwacht.
    url: https://wetten.overheid.nl/BWBR0001898/2013-01-01#Artikel1
  - number: '2'
    text: >-
      Bij toepassing van electrische trekkracht met bovengrondschen stroomtoevoer wordt, voor zoover geen
      contactgeleidingen worden toegepast, waarvan de doorhang kan verwaarloosd worden, of de constructie dezer
      geleidingen eene automatische regeling van den doorhang waarborgt, ten minste twee maal per jaar, in het voor- en
      najaar, de spanning en daarmede de doorhang der geleidingen geregeld in overeenstemming met de gemiddelde zomer-
      en wintertemperatuur.
    url: https://wetten.overheid.nl/BWBR0001898/2013-01-01#Artikel2
  - number: '3'
    text: |-
      1 Bij toepassing van electrische trekkracht met bovengrondschen stroomtoevoer wordt op geregelde tijden een
      onderzoek ingesteld:

      a. naar den isolatieweerstand der contactgeleidingen en stroomtoe- en afvoerleidingen, in haar geheel en van elk
      onderdeel daarvan afzonderlijk;

      b. naar den weerstand der terugleiding door de spoorstaven in haar geheel en van elke electrische
      spoorstaafverbinding afzonderlijk;

      c. naar de doorsnede en den weerstand van aardverbindingen en de doorsnede van overige veiligheidsverbindingen;

      d. naar de mate van afslijting der contactgeleiding langs de geheele lijn en den toestand, waarin zich alle
      onderdeelen der bovengrondsche geleiding bevinden.

      2 De Minister kan van het bepaalde in het eerste lid onder *b* ontheffing verleenen.

      3 De tijdstippen, waarop de onderzoekingen in het eerste lid genoemd plaats vinden, worden, bestuurders gehoord,
      door de Minister vastgesteld.

      4 Van de uitkomsten der onderzoekingen, in het eerste lid genoemd en van de regeling der contactgeleidingen, in
      [artikel 2][ref1] omschreven, wordt geregeld aanteekening gehouden in een register, daartoe met toestemming van de
      Minister door bestuurders aan te leggen.


      [ref1]: https://wetten.overheid.nl/BWBR0001898#Artikel2
    url: https://wetten.overheid.nl/BWBR0001898/2013-01-01#Artikel3
    references:
      - id: ref1
