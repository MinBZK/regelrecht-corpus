        artikel: '2'
        afdeling: I
  - number: '4'
    text: >-
      1 De tramweg met zijn vaste voorzieningen moet zodanig worden onderhouden, dat hij veilig kan worden bereden.


      2 De Minister bepaalt met welke frequentie de sporen en de daarin gelegen wissels, kruisingen en beweegbare bruggen
      moeten worden geschouwd.


      3 De frequentie, bedoeld in het tweede lid, bedraagt ten minste


      a. voor sporen waarover reizigerstreinen worden vervoerd en voor de daarin gelegen wissels, kruisingen en
      beweegbare bruggen:


      één maal per week;


      b. voor sporen waarover uitsluitend goederentreinen worden vervoerd: éénmaal per maand; voor de daarin gelegen
      wissels, kruisingen en beweegbare bruggen: drie maal per maand.


      4 Bij elke schouw moet worden gelet zowel op de toestand van de sporen, wissels en kruisingen als op de toestand
      van de baan, de beweegbare bruggen, de overwegen en seininrichtingen.


      5 De bestuurders geven voorschriften omtrent het schouwen van de bovenleiding en de elektrische spoorstaaf-, de
      aard- en de overige veiligheidsverbindingen.
    url: https://wetten.overheid.nl/BWBR0001898/2013-01-01#Artikel4
  - number: '5'
    text: >-
      1 Voor elken tramweg worden door den Minister, bestuurders gehoord, profielen van vrije ruimte vastgesteld.


      2 Het is verboden zonder toestemming van den Minister:


      a. binnen deze profielen een gebouw, muur, schutting, aarden wal of ander verheven voorwerp op te richten of te
      hebben;


      b. binnen deze profielen en in de strooken langs deze profielen, ter breedte van 0,50 M., boomen of houtgewas te
      planten of te hebben.


      3 Bestuurders doen er zooveel mogelijk voor waken, dat zich binnen deze profielen geene voorwerpen bevinden, welke
      den loop der treinen zouden kunnen belemmeren.
    url: https://wetten.overheid.nl/BWBR0001898/2013-01-01#Artikel5
  - number: '6'
    text: >-
      1 Tusschen twee samenloopende of elkander kruisende sporen wordt de grens aangeduid, tot welke zich voertuigen
      op het eene spoor kunnen bewegen, zonder de beweging van voertuigen op het andere spoor te hinderen. Tusschen
      die grens en den wissel of het kruispunt mogen gelijktijdig op de beide sporen geen voertuigen worden geplaatst
      of voortbewogen.


      2 De wijze, waarop die grens wordt aangeduid, wordt, bestuurders gehoord, door de Minister vastgesteld.
    url: https://wetten.overheid.nl/BWBR0001898/2013-01-01#Artikel6
  - number: '7'
    text: |-
      1 Bestuurders kunnen, met toestemming van de Minister, bij overwegen Andreaskruisen volgens model J12 of J13
      van [bijlage 1, behorende bij het RVV 1990][ref1], of hekken plaatsen. De Minister kan aan de toestemming het
      voorschrift verbinden dat de overweg wordt beveiligd.

      2 Op overwegen waar op grond van het bepaalde in het eerste lid Andreaskruisen of hekken
      zijn geplaatst, is het bepaalde in de [artikelen 20][ref2], [21][ref3], [22][ref4] en
      [23, tweede tot en met vierde lid, van het Reglement Dienst Hoofd- en Lokaalspoorwegen][ref5] van overeenkomstige
      toepassing.


