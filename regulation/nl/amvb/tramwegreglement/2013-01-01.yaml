        artikel: '32'
        paragraaf: C
        afdeling: II
      - id: ref5
        bwb_id: BWBR0001898
        artikel: '33'
        paragraaf: C
        afdeling: II
  - number: '52'
    text: >-
      1 Rollend materieel van spoorwegen, waarop dit reglement niet van toepassing is, mag op de onder dit reglement
      vallende tramwegen niet gebruikt worden dan met voorafgaande instemming van de Minister en met inachtneming van de
      daarbij te stellen voorwaarden.


      2 Rollend materieel van een onder dit reglement vallenden tramweg mag op een anderen tramweg worden gebruikt,
      tenzij dit gebruik door de Minister verboden wordt.
    url: https://wetten.overheid.nl/BWBR0001898/2013-01-01#Artikel52
  - number: '53'
    text: >-
      1 Het trekvoertuig wordt steeds aan het hoofd van den trein geplaatst; bij electrische trekkracht moet de
      wagenvoerder den trein van het voorste balcon van het voorste voertuig af of van eene daarmede gelijk te stellen
      plaats besturen.


      2 Wanneer de snelheid niet grooter is dan tien K. M. per uur en het in de richting der beweging zich bevindende
      voorste voertuig aan de voorzijde goed wordt bewaakt, is het duwen van treinen toegelaten en mag bij electrische
      trekkracht de wagenvoerder den trein van eene andere plaats, dan in het eerste lid is voorgeschreven, besturen.


      3 Meer dan twee trekvoertuigen mogen zich niet in een trein bevinden. Zij vormen steeds de eerste twee voertuigen.
      De machinist of wagenvoerder van het voorste trekvoertuig geeft de noodige seinen.


      4 De Minister kan bij electrische trekkracht, bij trekkracht van een verbrandingsmotor en in bijzondere gevallen
      ook bij stoom als trekkracht ontheffing van het bepaalde in de eerste drie leden verleenen.
    url: https://wetten.overheid.nl/BWBR0001898/2013-01-01#Artikel53
  - number: '54'
    text: >-
      1 Op het trekvoertuig moeten twee beambten aanwezig zijn indien geen inrichting aanwezig is die wanneer hij niet
      voortdurend of met korte tussenpozen door de bestuurder wordt bediend, het voertuig automatisch tot stilstand
      brengt;


      2 In rijtuigen voor reizigersvervoer hoeft tijdens de rit geen beambte aanwezig te zijn indien de rijtuigen
      uitgerust zijn met een noodrem, aangebracht op een goed zichtbare en bereikbare plaats.


      3 Het totaal aantal wielassen van een trein mag niet meer dan zestig bedragen. De Minister kan een hoger maximum
      aantal assen toestaan of een lager maximum aantal assen voorschrijven.
    url: https://wetten.overheid.nl/BWBR0001898/2013-01-01#Artikel54
  - number: '55'
    text: |-
      1 Voor treinen, waarmede uitsluitend reizigers en de bij hen behoorende bagage worden vervoerd, is het gebruik van
      zelfwerkend doorgaand remwerk, werkende op ten minste de helft van het aantal voertuigassen, verplicht:

      a. bij een grootste snelheid van 20 K.M. per uur, zoodra de trein bestaat uit meer dan 18 voertuigassen;

      b. bij een grootste snelheid van 35 K.M. per uur, zoodra de trein bestaat uit meer dan 10 voertuigassen.

      Bij grootere snelheid dan 35 K.M. per uur moet de doorgaande rem op alle voertuigassen werken.

      2 Voor treinen, waarmede zoowel reizigers en bagage als goederen worden vervoerd, moet de beremming ten minste zijn
      als volgt:








                    grootste snelheid in K.M. per uur:


                    aantal beremde voertuigassen:




                    tot en met 20 km


                    de helft van het aantal voertuigassen
                    boven de 18 assen;




                    van 21 tot en met 35 km


                    de helft van het aantal voertuigassen
                    boven de 10 assen;




                    meer dan 35 km


                    alle voertuigassen.






      3 Voor treinen, waarmede geene reizigers worden vervoerd, moeten zooveel voertuigassen beremd worden als in den
      volgenden staat is aangegeven:








                    grootste snelheid in K.M. per uur:


                    van het totaal aantal voertuigassen moet beremd zijn:




                    tot en met 20 km


                    1/10 met een minimum van 2 voertuigassen;




                    van 21 tot en met 45 km


                    1/2 met een minimum van 2 voertuigassen;




                    meer dan 45 km


                    alle voertuigassen.






      4 Bij toepassing van het remvoorschrift, gegeven in het tweede en derde lid, wordt van ledige wagens elke as
      slechts voor een halve as in rekening gebracht. Het bepaalde in het derde lid is niet van toepassing op treinen,
      waarvan de snelheid die van 10 K.M. per uur niet overschrijdt.

      5 Bij toepassing van een stelsel van zelfwerkend doorgaand remwerk behoeft dit de instemming van de Minister; het
      remwerk moet zoodanig zijn ingericht, dat de rem zoowel op het trekvoertuig als op elk rijtuig, waarvan de assen
      moeten worden beremd, in werking kan worden gebracht.

      6 De rem van alle in voor reizigers bestemde treinen aanwezige voertuigen, die van zelfwerkend doorgaand remwerk
      zijn voorzien, moet zich in dienstvaardigen staat bevinden; kan hieraan in bijzondere gevallen voor een rijtuig
      niet worden voldaan, dan moet dit rijtuig buiten dienst worden medegenomen.

      7 Bij treinen, welke over hellingen sterker dan 1 op 50 met een hoogteverschil van drie meter of meer worden
      vervoerd, moet het achterste voertuig van een bediend remtoestel zijn voorzien.

      8 De Minister kan van de bepalingen in dit artikel ontheffing verleenen en is bevoegd de doorgaande rem voor
      alle treinen voor reizigersvervoer op een tramweg verplicht te stellen, zelfs al bedraagt de grootste toegelaten
      snelheid niet meer dan 20 K.M. per uur, alsmede om voor gemengde en goederentreinen eene krachtiger beremming, dan
      volgens het tweede en derde lid geëischt wordt, voor te schrijven, indien zulks met het oog op het lengteprofiel
      van den tramweg, de ligging van dezen ten opzichte van bestaande wegen voor openbaar verkeer, de opeenvolging van
      de treinen of andere omstandigheden wenschelijk mocht blijken.

      9 Bij toepassing van de hierboven gegeven voorschriften worden ter berekening van het aantal voertuigassen, dat
      in den trein aanwezig is, de assen van het trekvoertuig medegeteld, met dien verstande, dat voor meerassige door
      stoomkracht bewogen trekvoertuigen niet meer dan twee assen berekend mogen worden.
    url: https://wetten.overheid.nl/BWBR0001898/2013-01-01#Artikel55
  - number: '56'
    text: >-
      1 De Minister stelt voor elken tramweg de grootste toegelaten snelheid van vervoer vast. De snelheid, waarmede de
      treinen worden vervoerd, mag de grootste toegelaten snelheid niet overschrijden.


      2 Ten aanzien van die baangedeelten, waar de Minister zulks in het belang van het veilig verkeer over den tramweg,
      gedeputeerde staten van de betrokken provincie en bestuurders gehoord, bepaalt, moet:


      a. eene beneden de in het eerste lid bedoelde grens liggende, en door hem te bepalen maximum-snelheid in acht
      worden genomen;


      b. elke trein op de daarbij door hem bepaalde punten van dat baangedeelte tot stilstand worden gebracht en
      niet weder in beweging worden gebracht, vóórdat een beambte van den tramwegdienst zich heeft overtuigd, dat het
      aangrenzende baangedeelte veilig berijdbaar is;


      c. een beambte van den tramwegdienst gedurende het berijden van dat baangedeelte vóór den trein uitgaan;


      d. een beambte van den tramwegdienst gedurende het berijden van dat baangedeelte het publiek met behulp van door de
      Minister aan te wijzen seinmiddelen op de komst van den trein opmerkzaam maken.
    url: https://wetten.overheid.nl/BWBR0001898/2013-01-01#Artikel56
  - number: '58'
    text: >-
      Bestuurders zorgen, dat elke trein, voordat hij het station, waar hij is samengesteld, verlaat, geheel wordt
      nagezien, waarbij er in het bijzonder op moet worden gelet, dat:


      a. de voertuigen geene gebreken vertoonen, die voor de veiligheid van het verkeer gevaar kunnen opleveren;


      b. het trekvoertuig en de andere voertuigen onderling goed gekoppeld zijn, hieronder mede gerekend alle gevorderde
      koppelingen voor doorgaande rem, electrische drijf-, rem-, stuur- of lichtstroom, enz.


      c. de gevorderde seinmiddelen aanwezig en zoo noodig aangebracht zijn;


      d. voor zoover de trein met doorgaand remwerk is uitgerust en het stelsel van de reminrichting eene beproeving bij
      stilstaanden trein toelaat, dit goed werkt.
    url: https://wetten.overheid.nl/BWBR0001898/2013-01-01#Artikel58
  - number: '59'
    text: >-
      De machinist of de wagenvoerder is verplicht - in het bijzonder wanneer de trein zich bevindt op een voor het
      openbaar verkeer openstaande weg, alsmede bij de nadering van een niet beveiligde overweg, een niet beveiligd
      overpad of een andere niet beveiligde tramwegovergang, dan wel van een gedeelte van de tramweg dat in een voor het
      openbaar verkeer openstaande weg is gelegen - waarschuwingsseinen te geven, de snelheid tijdig te verminderen of de
      trein tot stilstand te brengen, wanneer de veiligheid van het verkeer zulks vordert.
    url: https://wetten.overheid.nl/BWBR0001898/2013-01-01#Artikel59
  - number: '60'
    text: >-
      Waar dubbel spoor ligt, wordt onder gewone omstandigheden tusschen de stations en halten het ten opzichte van de
      richting van beweging rechts liggende spoor bereden. Bij werktreinen, bij hulptreinen, bij ongevallen en bij andere
      buitengewone omstandigheden kan onder verantwoordelijkheid van den beambte, die zulks beveelt, van dezen regel
      worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0001898/2013-01-01#Artikel60
  - number: '61'
    text: >-
      Een trein mag een andere trein volgen als de afstand tussen beide treinen tenminste zodanig is dat een trein
      daarbinnen tot stilstand kan worden gebracht.
    url: https://wetten.overheid.nl/BWBR0001898/2013-01-01#Artikel61
  - number: '62'
    text: >-
      1 Trekvoertuigen in dienstvaardigen staat staan voortdurend onder behoorlijk toezicht.


      2 Van alle in dienstvaardigen staat stilstaande trekvoertuigen moet het handel of de gangkruk in den ruststand
      zijn gesteld en bij trekvoertuigen, welke hun drijfkracht aan stoom ontleenen, de stoom zijn afgesloten, de
      cylinderkranen open en de remmen vast staan.
    url: https://wetten.overheid.nl/BWBR0001898/2013-01-01#Artikel62
  - number: '63'
    text: |-
      De bepalingen omtrent de treinen, vervat in de [artikelen 9][ref1], [53 onder 1 en 2][ref2], [54][ref3],
      [55][ref4], [57][ref5] en [61][ref6] zijn niet van toepassing op rangeerende treinen.


      [ref1]: https://wetten.overheid.nl/BWBR0001898#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0001898#Artikel53
      [ref3]: https://wetten.overheid.nl/BWBR0001898#Artikel54
      [ref4]: https://wetten.overheid.nl/BWBR0001898#Artikel55
      [ref5]: https://wetten.overheid.nl/BWBR0001898#Artikel57
      [ref6]: https://wetten.overheid.nl/BWBR0001898#Artikel61
    url: https://wetten.overheid.nl/BWBR0001898/2013-01-01#Artikel63
