  - number: '79'
    text: |-
      1 Van het bepaalde bij of krachtens de [artikelen 74][ref1], [75, eerste, tweede en derde lid][ref2], en [76][ref3]
      kan worden afgeweken, wanneer dit in het belang van de behoorlijke uitoefening van den dienst of van de veiligheid
      van het verkeer noodzakelijk is en de afwijking niet door het nemen van andere maatregelen kan worden voorkomen.

      2 Door bestuurders wordt van elke afwijking binnen acht (8) dagen mededeling gedaan aan de Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0001898#Artikel74
      [ref2]: https://wetten.overheid.nl/BWBR0001898#Artikel75
      [ref3]: https://wetten.overheid.nl/BWBR0001898#Artikel76
