  - number: '33'
    text: >-
      1 Behalve voor de indienststelling worden de mechanische en electrische inrichtingen op trekvoertuigen, welke door
      andere drijfkracht dan stoom worden bewogen, door de Minister onderzocht en beproefd:


      a. na elke belangrijke herstelling;


      b. in elk geval om de drie jaren.


      2 De Minister kan aan bestuurders vergunnen, dat een ingevolge het bepaalde in het eerste lid onder *a* of *b* te
      verrichten onderzoek of beproeving wordt uitgesteld.
    url: https://wetten.overheid.nl/BWBR0001898/2013-01-01#Artikel33
  - number: '34'
    text: >-
      De beproeving van de electrische inrichtingen van trekvoertuigen, welke middellijk of onmiddellijk door electrische
      drijfkracht bewogen worden, omvat:


      1°. eene beproeving van den isolatieweerstand der geleidingen en electrische motoren, schakelings-, regelings-,
      bedienings-, beveiligings- en verlichtingstoestellen.


      2°. eene beproeving van de automatische hoofdstroomuitschakelaars.


      De beproeving onder 1°. geschiedt met eene spanning ten minste gelijk aan de bedrijfsspanning gedurende vijf
      minuten tot en met eene bedrijfsspanning van 750 volt. Boven eene bedrijfspanning van 750 volt geschiedt de
      beproeving met wisselstroom gedurende vijf minuten en wel bij indienststelling met eene spanning gelijk aan
      het drievoud der bedrijfsspanning en bij latere beproevingen met eene spanning gelijk aan het anderhalfvoud der
      bedrijfsspanning een en ander met uitzondering van de op het trekvoertuig aanwezige laagspanningstoestellen en
      leidingen, die beproefd worden met de in het bedrijf in deze toestellen en leidingen optredende maximum-spanning.
      Bij de beproeving onder 2°. genoemd wordt nagegaan, of de automatische hoofdstroomuitschakelaar op de juiste
      stroombelasting in werking treedt. De proefspanningen en de proefstroombelastingen hierboven bedoeld worden gemeten
      met nauwkeurigheids-, volt- of ampèremeters, welke op geregelde tijden worden geijkt. De uitkomsten van eene
      beproeving zijn onvoldoende, indien bij de beproeving blijkt van eenigen stroomovergang op daarvoor niet bestemde
      deelen, de isolatie op eenige plaats is doorgeslagen, de automatische hoofdstroomuitschakelaar niet op de juiste
      stroombelasting in werking treedt of na het in werking treden de onderbrekingsvlamboog blijft bestaan of zoo andere
      gebreken aan den dag zijn gekomen.
    url: https://wetten.overheid.nl/BWBR0001898/2013-01-01#Artikel34
  - number: '35'
    text: >-
      Indien eenige beproeving of eenig onderzoek van de mechanische en electrische inrichtingen onvoldoende uitkomsten
      heeft opgeleverd, mag het trekvoertuig niet in gebruik worden gesteld, dan nadat de door de Minister noodig
      geoordeelde voorzieningen zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0001898/2013-01-01#Artikel35
  - number: '36'
    text: |-
      1 Van elke beproeving en van elk onderzoek, als bedoeld in [artikel 34][ref1], wordt door den daarmede belasten
      rijksambtenaar aanteekening gehouden in een daartoe door bestuurders, onder instemming van de Minister, aan te
      leggen register.

      2 In dat register wordt tevens aanteekening gehouden van de wijzigingen en belangrijke herstellingen, welke de
      mechanische en electrische inrichtingen van het trekvoertuig sedert de vorige beproeving hebben ondergaan, en van
      haar toestand.


      [ref1]: https://wetten.overheid.nl/BWBR0001898#Artikel34
    url: https://wetten.overheid.nl/BWBR0001898/2013-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0001898
        artikel: '34'
        paragraaf: C
        afdeling: II
  - number: '37'
    text: >-
      Bij elke beproeving of onderzoek van de mechanische en electrische inrichtingen van een trekvoertuig wordt door
      bestuurders gezorgd:


      a. dat het trekvoertuig geplaatst is boven een droogliggenden werkkuil en in elk geval te bekwamer hoogte;


      b. dat het trekvoertuig in allen deele in- en uitwendig behoorlijk gereinigd is;


      c. dat alle voor het onderzoek of de beproeving benoodigde hulpmiddelen en inrichtingen benevens benoodigde
      hulpkrachten ter beschikking staan van den met het onderzoek of de beproeving belasten rijksambtenaar.
    url: https://wetten.overheid.nl/BWBR0001898/2013-01-01#Artikel37
  - number: '38'
    text: |-
      1 Trekvoertuigen, behoorende aan buitenlandsche spoorwegdiensten en bestemd om dienst te doen op een baanvak,
      dat ten deele op Nederlandsch grondgebied, ten deele op dat van een naburig Rijk gelegen is, mogen krachtens eene
      vergunning van de Minister op het op Nederlandsch grondgebied gelegen gedeelte van het baanvak gebruikt worden,
      zonder dat de bepalingen van dit reglement het onderzoek en de beproeving van trekvoertuigen betreffende worden
      toegepast, mits:

      a. de trekvoertuigen, wat de algemeene inrichting en de hoofdafmetingen aangaat, zonder gevaar voor de veiligheid
      kunnen worden toegelaten, en

      b. door bestuurders het bewijs wordt geleverd, dat voor die trekvoertuigen voldaan is aan de bepalingen
      dienaangaande in het naburige Rijk van kracht.

      2 Door bestuurders moeten aan de Minister aangaande de in het eerste lid bedoelde trekvoertuigen de opgaven
      worden verstrekt, bedoeld in [artikel 23][ref1], onderscheidenlijk [artikel 32][ref2], alsmede die, welke de Raad
      bovendien voor het toezicht noodig oordeelt.

      3 De Minister kan te allen tijde eene vergunning, als in het eerste lid bedoeld, intrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0001898#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0001898#Artikel32
    url: https://wetten.overheid.nl/BWBR0001898/2013-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0001898
        artikel: '23'
        paragraaf: B
        afdeling: II
      - id: ref2
        bwb_id: BWBR0001898
        artikel: '32'
        paragraaf: C
        afdeling: II
  - number: '39'
    text: >-
      1 De rijtuigen en wagens moeten op veeren rusten en onderling en met het trekvoertuig door veerkrachtige
      koppelingen verbonden kunnen worden.


      2 De balcons der rijtuigen moeten van door de Minister goed te keuren beweegbare afsluitingen worden voorzien.


      3 De rijtuigen moeten voorzien zijn van lampen. Het aantal, de lichtsterkte en de lichtbron behoeven de instemming
      van de Minister.


      4 De inrichtingen, die dienen voor verwarming van de rijtuigen, behoeven de instemming van de Minister.
    url: https://wetten.overheid.nl/BWBR0001898/2013-01-01#Artikel39
  - number: '40'
    text: >-
      1 Alvorens rijtuigen of wagens aan te schaffen of tijdelijk in het voertuigpark op te nemen, bieden bestuurders aan
      den Minister volledig uitgewerkte algemeene teekeningen van die voertuigen ter instemming aan.


      2 Van rijtuigen en wagens, welke van electrische inrichtingen zullen worden voorzien, moeten tevens voldoend
      toegelichte schakelschema's dier inrichtingen ter instemming worden overgelegd.


      3 Bestuurders geven daarbij tevens op welk aantal rijtuigen of wagens volgens de aangeboden teekeningen zal
      worden aangeschaft of tijdelijk in het voertuigpark opgenomen. Voor aanschaffing of tijdelijke opneming in het
      voertuigpark van een grooter aantal wordt opnieuw instemming van de bovenbedoelde teekeningen en schakelschema's
      vereischt.


      4 Van elk rijtuig en van elken wagen, bedoeld in het eerste of in het derde lid, zenden bestuurders vóór de
      indienststelling aan de Minister eene opgaaf omtrent het door weging gevonden gewicht van het voertuig in onbeladen
      toestand.
    url: https://wetten.overheid.nl/BWBR0001898/2013-01-01#Artikel40
  - number: '41'
    text: |-
      Electrische inrichtingen en leidingen aan, op of in rijtuigen en wagens moeten aan dezelfde eischen voldoen
      als aan die inrichtingen en leidingen aan, op of in trekvoertuigen gesteld, met name in [artikel 29][ref1] en
      [artikel 34][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001898#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0001898#Artikel34
    url: https://wetten.overheid.nl/BWBR0001898/2013-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0001898
        artikel: '29'
        paragraaf: C
        afdeling: II
      - id: ref2
        bwb_id: BWBR0001898
        artikel: '34'
        paragraaf: C
        afdeling: II
  - number: '42'
    text: >-
      1 Rijtuigen en wagens worden niet in dienst gesteld, voordat zij door de Minister zijn onderzocht en geaccordeerd,
      en voordat door of van wege dezen Raad eene schriftelijke vergunning tot ingebruikneming is uitgereikt.


      2 Bij die akkoordverklaring wordt door de Minister voor de rijtuigen het maximum-aantal personen, dat in elk
      rijtuig of elke afdeeling en op elk balcon mag worden vervoerd, en voor de wagens het draagvermogen vastgesteld.
    url: https://wetten.overheid.nl/BWBR0001898/2013-01-01#Artikel42
  - number: '43'
    text: |-
      Wijzigingen van de inrichting van rijtuigen en wagens behoeven de instemming van den Minister, indien de
      constructie, naar het oordeel van de Minister, tengevolge van die wijzigingen niet meer zou overeenstemmen met die,
      op de in [artikel 40][ref1] bedoelde teekeningen en schakelschema's aangegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0001898#Artikel40
    url: https://wetten.overheid.nl/BWBR0001898/2013-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0001898
        artikel: '40'
        paragraaf: D
        afdeling: II
  - number: '44'
    text: >-
      1 Rijtuigen en wagens, behoorende aan buitenlandsche spoorwegdiensten, mogen op tramwegen hier te lande voor
      doorgaand vervoer worden gebruikt, zonder dat de bepalingen van dit reglement, het onderzoek van rijtuigen en
      wagens betreffende, worden toegepast, mits:


      a. die rijtuigen en wagens, wat de algemeene inrichting en hoofdafmetingen betreft, niet meer afwijken van de
      voorschriften van dit reglement dan zonder bezwaar voor de veiligheid op de tramwegen kan worden toegelaten;


      b. het uiterlijk geen twijfel laat aangaande de deugdelijkheid en den goeden staat van onderhoud van het materieel;


      c. de rijtuigen inwendig zindelijk onderhouden en voor het gemak der reizigers niet minder goed ingericht zijn dan
      op Nederlandsche tramwegen wordt geëischt.


      2 Bestuurders zorgen, dat de algemeene inrichting en de toestand van rijtuigen en wagens van buitenlandsche
      spoorwegdiensten, die in een trein van hun dienst overgaan, vooraf onderzocht worden, teneinde na te gaan, dat
      zij aan de eischen, in het eerste lid gesteld, voldoen, en dat die rijtuigen en wagens niet in den trein worden
      geplaatst, indien zij daaraan niet voldoen.
    url: https://wetten.overheid.nl/BWBR0001898/2013-01-01#Artikel44
  - number: '45'
    text: |-
      1 Het materieel moet voortdurend in goeden staat van onderhoud worden gehouden.

      2 Alle voertuigen moeten ten minste eenmaal in de drie jaren, en voorts zoo dikwijls en zoodra de Minister zulks
      noodig acht, worden gelicht en onderzocht, waarbij de assen, potten en draagveeren worden verwijderd. De termijn
      van drie jaren wordt gerekend van den dag, waarop het voertuig na het laatste onderzoek is in dienst gesteld.

      3 Bij het onderzoek van trekvoertuigen, welke door stoomkracht worden bewogen, wordt de juistheid van de belasting
      der veiligheidskleppen en van de aanwijzing van den manometer nagegaan.

      4 Bij het onderzoek van trekvoertuigen, welke niet door stoomkracht bewogen worden, strekt het onderzoek zich
      uit tot de aanwezige deelen onder [artikel 34][ref1] genoemd en wordt nagegaan, of de mechanische en electrische
      inrichtingen aan de daaraan in dit artikel gestelde eischen voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0001898#Artikel34
    url: https://wetten.overheid.nl/BWBR0001898/2013-01-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0001898
        artikel: '34'
        paragraaf: C
        afdeling: II
  - number: '46'
    text: >-
      Voor alle onderzoekingen en beproevingen van rollend materieel of ketels, welke vóór of na de indienststelling
      door de Minister geschieden, worden door bestuurders de noodige hulpmiddelen, werktuigen en werklieden kosteloos
      beschikbaar gesteld.
    url: https://wetten.overheid.nl/BWBR0001898/2013-01-01#Artikel46
  - number: '47'
    text: >-
      1 Ten behoeve van rollend materieel van bijzondere inrichting, of ten behoeve van bijzondere inrichtingen aan
      dit materieel, in dit reglement niet voorzien, kunnen de bepalingen van dit reglement door den Minister buiten
      toepassing verklaard en door andere bepalingen vervangen worden.


      2 De buiten toepassing verklaarde bepalingen van dit reglement en de gestelde voorwaarden of nieuwe bepalingen
      worden in de vergunning vermeld.
    url: https://wetten.overheid.nl/BWBR0001898/2013-01-01#Artikel47
  - number: '48'
    text: >-
      1 De wielen van alle voertuigen moeten spoorkransen hebben van voldoende afmetingen.


      2 De Minister kan, voor een voertuig met meer dan twee vaste assen, van het bepaalde in het eerste lid ontheffing
      verleenen voor de wielen der assen, gelegen tusschen de buitenste assen.


      3 De breedte van de wielen aan den omtrek moet zoo groot zijn, dat bij de grootst voorkomende speelruimte en
      geheel naar eenen kant verschoven as, de buitenkant van het wiel ten minste vijf en veertig millimeter voorbij den
      binnenkant van de spoorstaaf reikt.
    url: https://wetten.overheid.nl/BWBR0001898/2013-01-01#Artikel48
  - number: '49'
    text: |-
      1 Op eene zichtbare plaats wordt duidelijk aangegeven:

      a. op alle voertuigen: de naam of het merk van den tramwegdienst, het volgnummer, de datum van indienststelling en
      die van de laatste lichting, de radstand en het gewicht met en zonder wielen en assen;

      b. op de rijtuigen: de klasse, waartoe elk rijtuig of elke afdeeling behoort, zoo er althans verschillende
      klassen zijn, alsmede in elk rijtuig of elke rijtuigafdeeling en op elk balcon het door de Minister krachtens
      [artikel 42][ref1] vastgestelde maximum-aantal personen, dat zich daarin of daarop mag bevinden;

      c. op de wagens: het door de Minister krachtens [art. 42][ref2] vastgestelde draagvermogen.

      2 Op de balcons en in de rijtuigen moeten, indien de Minister zulks in het belang van de veiligheid der reizigers
      bepaalt, waarschuwingen voor de reizigers tegen het uitsteken van lichaamsdeelen buiten het rijtuigprofiel en tegen
      het op eene gevaarlijke wijze verlaten van de rijtuigen worden aangebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0001898#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0001898#Artikel42
    url: https://wetten.overheid.nl/BWBR0001898/2013-01-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0001898
        artikel: '42'
        paragraaf: D
        afdeling: II
      - id: ref2
        bwb_id: BWBR0001898
        artikel: '42'
        paragraaf: D
        afdeling: II
  - number: '50'
    text: >-
      Alle voertuigen, die in het voertuigpark van een tramwegdienst worden opgenomen, moeten blijven binnen het
      omgrenzingsprofiel, dat door den Minister bestuurders gehoord, wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0001898/2013-01-01#Artikel50
  - number: '51'
    text: |-
      1 Door bestuurders worden een of meer registers aangelegd, waarin voor elk voertuig afzonderlijk de herstellingen
      en de wijzigingen, alsmede de data van en de bevindingen bij de in [artikel 45][ref1] bedoelde onderzoekingen
      worden opgeteekend.

      2 In die registers wordt bovendien van elk trekvoertuig eene korte omschrijving opgenomen, benevens, zoo het
      trekvoertuig door stoomkracht wordt bewogen, de data van en de bevindingen bij de in de [artikelen 23][ref2] en
      [24][ref3] bedoelde beproevingen en onderzoekingen; zoo het trekvoertuig niet door stoomkracht bewogen wordt, de
      data van en de bevindingen bij de in de [artikelen 32][ref4] en [33][ref5] bedoelde beproevingen en onderzoekingen.


      [ref1]: https://wetten.overheid.nl/BWBR0001898#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0001898#Artikel23
      [ref3]: https://wetten.overheid.nl/BWBR0001898#Artikel24
      [ref4]: https://wetten.overheid.nl/BWBR0001898#Artikel32
      [ref5]: https://wetten.overheid.nl/BWBR0001898#Artikel33
    url: https://wetten.overheid.nl/BWBR0001898/2013-01-01#Artikel51
