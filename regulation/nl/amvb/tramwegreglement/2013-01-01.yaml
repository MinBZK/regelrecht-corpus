  - number: '19'
    text: >-
      1 Elk trekvoertuig, dat door stoomkracht wordt bewogen, moet voorzien zijn:


      a. van een goed aansluitenden aschbak, voorzien van eene of meer trekkleppen, die van de standplaats van den
      machinist of, indien zich een tweede beambte op het trekvoertuig bevindt, althans van die van dezen beambte, kunnen
      worden bewogen; de bak moet zoodanig zijn ingericht, dat bij geopende klep het uitvallen van brandende stoffen
      zooveel mogelijk voorkomen wordt;


      b. van eene inrichting om het ontwijken van vonken en brandende stoffen uit den schoorsteen zooveel mogelijk te
      voorkomen;


      c. van twee van elkander onafhankelijke voedingsinrichtingen, die elk voor zich voldoende zijn om ruimschoots in de
      waterbehoefte van den ketel te voorzien, en waarvan ten minste één niet door het werktuig wordt gedreven. Elke dier
      voedingsinrichtingen moet aan den ketel verbonden zijn door eene afsluitinrichting met klep en kraan.


      2 De Minister kan van het bepaalde in het eerste lid ontheffing verleenen.
    url: https://wetten.overheid.nl/BWBR0001898/2013-01-01#Artikel19
  - number: '20'
    text: |-
      1 De ketel van elk door stoomkracht bewogen trekvoertuig moet voorzien zijn:

      a. van een met goed leesbaar volgnummer gemerkten manometer, welke, rechtstreeks met de stoomruimte van den ketel
      door eene waterhoudende pijp met afsluitkraan verbonden, de drukking van den stoom duidelijk aangeeft en welke ten
      minste twee kilogram per vierkanten centimeter meer drukking kan aanwijzen dan de grootste toegelaten werkelijke
      drukking, welke laatste op de wijzerplaat door een duidelijk merk moet zijn aangewezen;

      b. van eene gebogen afsluitbare pijp met flens van veertig millimeter middellijn en vijf millimeter dikte, om
      daaraan een contrôle-manometer te kunnen verbinden:

      c. van een waterpeilglas met afsluit- en doorblaaskranen, en van ten minste twee proefkranen of een tweede
      peilglas; de waterpeilglazen en de proefkranen moeten van elkander onafhankelijk, dus niet aan dezelfde pijp
      aangebracht zijn; de waterpeilglazen moeten bovendien, tenzij de Minister hiervan ontheffing verleent, voorzien
      zijn van een schermkoker, zoodanig ingericht, dat het waterpeil goed waarneembaar blijft;

      d. van een zelfwerkend middel, waardoor watergebrek in den ketel onafhankelijk van de bediening wordt kenbaar
      gemaakt; als zoodanig kunnen dienen een of meer in de hemelplaat van de vuurkist geschroefde doorboorde pluggen,
      gevuld met een metaal, dat smelt, alvorens de plaat gevaarlijk oververhit wordt; de kleinste doorsnede dezer
      vulling, die ten minste eens per jaar vernieuwd moet worden, mag niet kleiner zijn dan een halve vierkante
      centimeter;

      e. van een spuikraan en van de noodige waschgaten;

      f. van ten minste twee veiligheidskleppen, voldoende aan de bepalingen van [artikel 21][ref1].

      2 Zoowel de waterstand als de stoomdrukking in den ketel moeten van de plaats van den machinist op het trekvoertuig
      gemakkelijk kunnen worden waargenomen.

      3 De toegelaten laagste waterstand alsmede de toegelaten grootste stoomdrukking moeten zoodanig op den ketel zijn
      aangegeven, dat zij van de plaats van den machinist op het trekvoertuig zijn waar te nemen.

      4 De toegelaten laagste waterstand is ten minste honderd millimeter boven het hoogste punt van de vuurkist.

      5 De stand van het peilglas moet zoodanig zijn, dat het water daarin niet lager dan vijftig milimeter beneden den
      toegelaten laagsten waterstand zichtbaar blijft.

      6 Alle kranen aan den ketel, waarvan de aanvoeropening grooter is dan dertig milimeter, moeten zoodanig zijn
      ingericht, dat bij het breken van de pakking- of opsluitbouten de pluggen niet weggeslingerd kunnen worden.

      7 De steunschroefbouten, waarmede de wanden van de vuurkist en van den ketel onderling verbonden zijn, moeten over
      de lengte geheel of ten deele doorboord zijn.

      8 Het gebruik van gegoten ijzer is voor die deelen van den ketel, welke aan de stoomdrukking bloot staan, verboden.

      9 De Minister kan van het bepaalde in het tweede en derde lid ontheffing verleenen.


      [ref1]: https://wetten.overheid.nl/BWBR0001898#Artikel21
    url: https://wetten.overheid.nl/BWBR0001898/2013-01-01#Artikel20
