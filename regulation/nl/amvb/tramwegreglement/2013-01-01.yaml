  - number: '22'
    text: |-
      1 Wijzigingen van de inrichting van trekvoertuigen behoeven de akkoordverklaring van den Minister, indien de
      constructie naar zijn oordeel ten gevolge van die wijzigingen niet meer zou overeenstemmen met die, op de in
      [artikel 16][ref1] bedoelde teekeningen en schakelschema's aangegeven.

      2 Gewijzigde trekvoertuigen mogen niet opnieuw in dienst gesteld worden, tenzij aan het bepaalde in het eerste lid
      is voldaan en alvorens zij door de Minister zijn onderzocht en geaccordeerd.


      [ref1]: https://wetten.overheid.nl/BWBR0001898#Artikel16
