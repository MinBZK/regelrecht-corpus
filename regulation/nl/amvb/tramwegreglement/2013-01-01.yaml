  - number: '23'
    text: |-
      1 Stoomketels op trekvoertuigen worden niet in gebruik genomen dan na door de Minister te zijn onderzocht, beproefd
      en geaccordeerd.

      2 Voor zoover de hieronder bedoelde gegevens niet vermeld zijn op de teekeningen, bedoeld in [artikel 16][ref1],
      zenden bestuurders van elken op een trekvoertuig in gebruik te nemen ketel aan de Minister eene opgave, behelzende:

      a. het dienstnummer, het fabrieksnummer, den naam en de woonplaats van den fabrikant en het jaar van aanbouw;

      b. de materialen, waaruit de verschillende onderdeelen van den ketel en van bijbehoorende, onder druk te bezigen,
      toestellen zijn gemaakt, alsmede de eischen, waaraan die materialen bij hunne keuring hebben voldaan;

      c. de grootte van het verwarmd oppervlak van den ketel, waaronder is te verstaan het oppervlak der met vuur en
      onafgewerkte rookgassen in aanraking zijnde wanden, voor zoover deze voor de verdamping van het water in den
      ketel dienstbaar zijn, alsmede de grootte van het verwarmd oppervlak der te bezigen voorwarmers, in aanraking met
      afgewerkten stoom of met afgewerkte rookgassen;

      d. de grootte van het verwarmd oppervlak van den oververhitter, in aanraking met de niet afgewerkte rookgassen;

      e. de afmetingen van de veiligheidskleppen en toebehooren;

      f. de toestellen, dienende om het waterpeil waar te nemen, die om het op de gevorderde hoogte te houden en die,
      bestemd om watergebrek te verraden;

      g. de gewenschte grootste werkelijke drukking (overdrukking) in kilogrammen per vierkanten centimeter;

      h. ingeval de ketel elders dienst heeft gedaan, den datum van eerste ingebruikneming en de herstellingen, die hij
      in de laatste zes jaren heeft ondergaan.


      [ref1]: https://wetten.overheid.nl/BWBR0001898#Artikel16
    url: https://wetten.overheid.nl/BWBR0001898/2013-01-01#Artikel23
