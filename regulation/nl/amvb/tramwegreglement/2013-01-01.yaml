  - number: '29'
    text: >-
      1 Krachtvoertuigen door een of meer electromotoren voortbewogen, zijn voorzien van:


      a. inrichtingen die beveiligen tegen te grote sterkte van de electrische stroom en inrichtingen die beveiligen
      tegen overspanning tenzij deze laatste inrichtingen elders zijn ondergebracht;


      b. geleidende verbindingen tussen de spoorstaven en alle delen van het krachtvoertuig, die, indien zij tengevolge
      van breuk in de bovenleiding of door andere oorzaken onder spanning zouden komen, gevaar opleveren.


      2 Blanke stroomleidingen, verbindingen met het onderstel uitgezonderd, mogen slechts worden gebruikt indien zij
      onwrikbaar op isolatoren zijn bevestigd en buiten bereik van onbevoegden zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0001898/2013-01-01#Artikel29
  - number: '30'
    text: |-
      Bijaldien de bedrijfsspanning ten opzichte van aarde hooger is dan 1200 volt kunnen de voorschriften van
      [artikel 29][ref1] voor elk geval in het bijzonder door de Minister worden aangevuld.

      Voorschriften betreffende de inrichting van trekvoertuigen, gedreven door verbrandingsmotoren.


      [ref1]: https://wetten.overheid.nl/BWBR0001898#Artikel29
    url: https://wetten.overheid.nl/BWBR0001898/2013-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0001898
        artikel: '29'
        paragraaf: C
        afdeling: II
  - number: 30a
    text: >-
      Bij trekvoertuigen, gedreven door een of meer verbrandingsmotoren, moeten:


      a. de vaten waarin de vloeibare brandstof wordt medegevoerd en de leidingen voor deze vloeistof zodanig ingericht
      zijn, dat daarin geen ongewilde overdruk kan ontstaan en dat zij zoveel mogelijk gewaarborgd zijn tegen het
      ontstaan van lekken;


      b. de vulopeningen dezer vaten zich buiten het voertuig bevinden, voorzover hiermede reizgers of post vervoerd
      worden;


      c. de ruimten, waarin deze vaten zijn aangebracht, van het inwendige van het voertuig door dichte onbrandbare
      wanden gescheiden zijn en met de buitenlucht op zodanige wijze in gemeenschap staan, dat buiten de vaten geraakte
      vloeibare brandstof of brandbare gassen aanstonds naar buiten worden afgevoerd;


      d. de leidingen voor de afvoer van afgewerkte motorgassen, voorzover zij zich in de inwendige ruimte van het
      trekvoertuig bevinden, ononderbroken en, waar zij gevaar voor brand opleveren, geïsoleerd zijn en aan het einde
      buiten het voertuig uitgerust met een inrichting waarin de afgewerkte gassen in die mate worden afgekoeld, dat zij
      bij het verlaten van die inrichting geen brand kunnen veroorzaken;


      e. indien de voertuigen ingericht zijn voor het vervoer van reizigers, de motoren geplaatst zijn in door
      onbrandbare, of met een onbrandbare stof beklede, wanden omgeven ruimten, die niet toegankelijk zijn voor de
      reizigers.
    url: https://wetten.overheid.nl/BWBR0001898/2013-01-01#Artikel30a
  - number: '31'
    text: |-
      Op trekvoertuigen, tevens ingericht voor her vervoer van personen of (en) goederen, zijn mede van toepassing de
      voorschriften, vervat in de [artikelen 39][ref1], [42][ref2], [83][ref3] en [84][ref4].


