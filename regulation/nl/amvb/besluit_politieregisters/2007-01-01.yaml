      - id: ref1
        bwb_id: BWBR0007120
        artikel: '6'
  - number: '11'
    text: |-
      1 Een beheerder is bevoegd verstrekking van gegevens uit een politieregister ingevolge de [artikelen 14][ref1] en
      [15, eerste lid, onder b en c, van de wet][ref2] te weigeren indien:

      a. het gegevens betreft omtrent personen die aan de politie informatie hebben verstrekt omtrent door anderen
      gepleegde of te plegen strafbare feiten;

      b. het gegevens uit een register betreft waarbij, mede gelet op de bijzondere aard van het register, in geval van
      verstrekking direct gevaar voor de geregistreerde of voor derden zou zijn te duchten.

      2 Verstrekking van gegevens uit een politieregister ingevolge de [artikelen 14][ref3] en
      [15, eerste lid, onder b en c, van de wet][ref4] kan achterwege worden gelaten indien de desbetreffende gegevens
      slechts konden worden verkregen onder de voorwaarde dat deze alleen voor een bepaald doel zouden worden gebruikt
      en de verstrekking een ander doel zou betreffen. Het bestaan van een dergelijke voorwaarde kan slechts worden
      aangenomen indien van de voorwaarde blijkt uit een proces-verbaal en van het bestaan van een dergelijke voorwaarde
      aantekening is gehouden in datzelfde register.

      3 Het eerste en tweede lid vinden slechts toepassing indien dit noodzakelijk is voor de goede uitvoering van de
      politietaak. Bij de verstrekking van de daar bedoelde gegevens kunnen beperkingen aan het gebruik van de gegevens
      worden opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0004798#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0004798#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0004798#Artikel14
      [ref4]: https://wetten.overheid.nl/BWBR0004798#Artikel15
