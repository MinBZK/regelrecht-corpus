  - number: '18'
    text: |-
      1 Indien van de verstrekking aantekening wordt gehouden, wordt daarbij de identiteit van de verzoeker, de datum van
      de verstrekking en een omschrijving van de verstrekte gegevens vastgelegd.

      2 In het geval aantekening wordt gehouden van een verstrekking ingevolge [artikel 16, tweede lid][ref1], wordt
      tevens het doel van de verstrekking vastgelegd.

      3 Indien van de verstrekking aantekening wordt gehouden en ten tijde van de verstrekking vaststaat dat het doel
      waartoe is verstrekt, noodzaakt tot bekendmaking aan bepaalde derden, wordt hiervan apart aantekening gehouden.

      4 De ingevolge [artikel 16, tweede en derde lid][ref2], en [17, vijfde lid][ref3], vastgelegde gegevens worden
      gedurende twee jaren bewaard. Deze gegevens kunnen slechts met toepassing van de [artikelen 6, vierde lid][ref4],
      of [18, vierde lid, van de wet][ref5] voor een ander doel worden gebruikt dan het toezicht op de naleving van het
      verstrekkingenregime.

      5 De ingevolge [artikel 13a, zesde lid, van de wet][ref6] vastgelegde gegevens worden gedurende drie jaren bewaard.
      De tweede volzin van het vierde lid is van overeenkomstige toepassing.

      6 Onze Ministers kunnen nadere regels stellen omtrent de uitvoering van dit artikel, het College bescherming
      persoonsgegevens gehoord.


