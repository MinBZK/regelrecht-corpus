  - number: 14a
    text: |-
      1 Uit een politieregister kunnen desgevraagd gegevens worden verstrekt, voorzover zij deze behoeven voor een goede
      uitvoering van hun taak, aan:

      a. Onze Minister van Financiën op grond van de [artikelen 3:11][ref1], [3:65][ref2], [3:100, onderdeel c][ref3],
      [3:101, onderdeel c][ref4], [3:105, derde lid, onderdeel b, en vierde lid, onderdeel c][ref5], [3:109][ref6] en
      [5:26, eerste en tweede lid, van de Wet op het financieel toezicht][ref7];

      b. de Stichting Autoriteit Financiële Markten op grond van de in de [artikelen 1:104][ref8],
      [1:107][ref9], [2:67, eerste lid, onderdelen a en b][ref10], [2:68, eerste lid, onderdelen a en b][ref11],
      [2:99][ref12], [3:95][ref13], [3:105, derde en vierde lid][ref14], [4:9][ref15], [4:10][ref16] en
      [5:26, tweede lid, van de Wet op het financieel toezicht][ref17] toegekende bevoegdheden;

      c. De Nederlandsche Bank N.V. op grond van de in de [artikelen 1:102][ref18], [1:104][ref19],
      [2:21][ref20], [3:9, eerste lid][ref21], [3:11][ref22], [3:16, eerste en tweede lid][ref23], [3:23][ref24],
      [3:31][ref25], [3:43][ref26], [3:46][ref27], [3:54, eerste lid][ref28], [3:58, eerste lid][ref29],
      [3:65][ref30], [3:100, onderdeel c][ref31], [3:101, onderdeel c][ref32], [3:105][ref33], [3:109][ref34] en
      [3:110 van de Wet op het financieel toezicht][ref35] toegekende bevoegdheden;

      d. Onze Minister van Financiën, dan wel de rechtspersoon of rechtspersonen waaraan op grond van
      [artikel 18, eerste lid, van de Wet inzake de geldtransactiekantoren][ref36] taken en bevoegdheden
      zijn overgedragen, op grond van de [artikelen 2, eerste lid, aanhef en onder a][ref37],
      [4, tweede lid, aanhef en onder a][ref38], en [5, tweede lid, onder c, aanhef en onder 1 van die wet][ref39].

      e. De Nederlandsche Bank N.V. op grond van: de
      [artikelen 3, eerste lid, onderdelen a, b, en c en tweede lid][ref40], [4, onderdeel a][ref41],
      [5, eerste en derde lid][ref42] en [6, onderdelen e en f van de Wet toezicht trustkantoren][ref43],

      f.

      g.

      h.

      i. De Stichting Autoriteit Financiële Markten op grond van
      [artikel 15 van de Wet toezicht accountantsorganisaties][ref44].

      2 Verstrekking van gegevens als bedoeld in het eerste lid, of van inlichtingen daarover, vindt alleen plaats door,
      dan wel met bijzondere toestemming van het openbaar ministerie en onder daaraan door het openbaar ministerie te
      stellen voorwaarden. Die voorwaarden kunnen onder meer betreffen het ter beschikking stellen of doorgeven van die
      gegevens of inlichtingen daarover aan derden.

      3 Ingevolge dit artikel verstrekte gegevens worden niet langer dan gedurende een termijn van zes maanden na datum
      van verkrijgen bewaard, tenzij met bijzondere toestemming van het openbaar ministerie. Daarbij kunnen nadere
      voorwaarden worden gesteld.

      4 Onze Ministers kunnen nadere regels vaststellen met betrekking tot de verstrekking en bewaring van gegevens als
      bedoeld in het eerste tot en met het derde lid.


