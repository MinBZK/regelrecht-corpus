        artikel: 13c
  - number: '2'
    text: |-
      De volgende persoonsgegevens zijn antecedenten:

      a. het feit dat een proces-verbaal is opgemaakt van het verhoor van een bepaald persoon ter zake van een strafbaar
      feit waarvoor deze als verdachte is gehoord, daaronder begrepen de aanduiding van de aard van dat strafbare feit;

      b. het feit of al dan niet een proces-verbaal als bedoeld onder *a*, is verzonden aan het openbaar ministerie, en
      zo ja, de datum van verzending en het nummer waarmee het proces-verbaal aldaar kan worden geïdentificeerd en

      c. de beslissing van het openbaar ministerie of de rechter over de aangelegenheid waarop het proces-verbaal
      betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0004996/2007-01-01#Artikel2
  - number: 2a
    text: |-
      Misdrijven als bedoeld in [artikel 1, eerste lid, onder k, onderdeel 3°, van de wet][ref1] zijn de misdrijven,
      genoemd in de bij dit besluit behorende bijlage.


      [ref1]: https://wetten.overheid.nl/BWBR0004798#Artikel1
    url: https://wetten.overheid.nl/BWBR0004996/2007-01-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0004798
        artikel: '1'
  - number: '3'
    text: |-
      1 Persoonsgegevens die betrekking hebben op de in [artikel 5, eerste lid, van de wet ][ref1]genoemde kenmerken,
      worden slechts in een register opgenomen indien het reglement dit uitdrukkelijk toelaat.

      2 Persoonsgegevens met betrekking tot iemands ras, worden slechts opgenomen indien dit onvermijdelijk is

      a. met het oog op diens identificatie;

      b. voor de juiste beoordeling van een strafbaar feit en zulk een gegeven het slachtoffer of de motieven van de
      dader van dat feit betreft;

      c. met het oog op de verlening van hulp door de politie.

      3 Bij de opneming van een gegeven als bedoeld in het eerste lid, wordt tevens een aanduiding omtrent de
      betrouwbaarheid van het gegeven opgenomen. De aanduiding wordt gegeven door personen die daartoe door de beheerder
      zijn aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0004798#Artikel5
    url: https://wetten.overheid.nl/BWBR0004996/2007-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0004798
        artikel: '5'
  - number: 3a
    text: |-
      1 Het sociaal-fiscaal nummer wordt slechts in een register opgenomen voor zover dit noodzakelijk is voor het
      controleren van de juistheid van gegevens omtrent een staande gehouden of aangehouden verdachte.

      2 Het sociaal-fiscaal nummer wordt uit een register verwijderd en vernietigd indien opneming niet langer
      noodzakelijk is voor het doel, bedoeld in het eerste lid, en in elk geval na verloop van een maand na de datum
      van opneming.
    url: https://wetten.overheid.nl/BWBR0004996/2007-01-01#Artikel3a
  - number: '4'
    text: |-
      1 Koppeling is slechts toegestaan van een politieregister met een ander politieregister of met een bestand van
      het Rijk, provincies, gemeenten en andere openbare lichamen met inbegrip van de daaronder ressorterende diensten,
      instellingen en bedrijven.

      2 Koppeling van een tijdelijk register, met een ander register vindt slechts plaats voor zover dit noodzakelijk is
      voor het doel waarvoor het eerstbedoelde register is aangelegd.
    url: https://wetten.overheid.nl/BWBR0004996/2007-01-01#Artikel4
  - number: '5'
    text: |-
      1 Van een koppeling wordt een proces-verbaal opgemaakt dat zo nauwkeurig mogelijk vermeldt:

      a. het doel van de koppeling;

      b. de datum van de koppeling;

      c. degeen in wiens opdracht de koppeling plaatsvond;

      d. de bestanden die zijn gekoppeld, alsmede de naam van de beheerder of de houder van die bestanden;

      e. of de koppeling heeft geleid tot nieuwe persoonsgegevens en zo ja, welke;

      f. of de gegevens, bedoeld onder *e*, zijn opgenomen in een register en zo ja, in welk;

      g. eventuele bijzonderheden.

      2 De beheerder bewaart het proces-verbaal gedurende twee jaren op zodanige wijze dat dit desgevraagd onmiddellijk
      aan de daartoe bevoegde organen ter inzage kan worden gegeven.

      3 Bij reglement kan van het eerste lid worden afgeweken voor zover dat onvermijdelijk is met het oog op een goede
      uitvoering van de politietaak.
    url: https://wetten.overheid.nl/BWBR0004996/2007-01-01#Artikel5
  - number: '6'
    text: |-
      1 De personen die technische werkzaamheden verrichten als bedoeld in
      [artikel 7, tweede lid, tweede volzin, van de wet][ref1], komen niet als geregistreerde voor in de registers
      waarvan zij in dat kader kunnen kennisnemen.

      2 De beheerder bepaalt vooraf schriftelijk welke personen onder welke voorwaarden de werkzaamheden, bedoeld in het
      eerste lid, kunnen verrichten.

      3 Indien de werkzaamheden langs geautomatiseerde weg worden verricht, worden deze vastgelegd.

      4 De gegevens die zijn vastgelegd krachtens het tweede en derde lid, worden gedurende twee jaren bewaard.


      [ref1]: https://wetten.overheid.nl/BWBR0004798#Artikel7
    url: https://wetten.overheid.nl/BWBR0004996/2007-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0004798
        artikel: '7'
  - number: '7'
    text: |-
      1 Een reglement wordt voor een ieder ter inzage gelegd wanneer het betreft een register bij:

      a. het regionale politiekorps: op het hoofdbureau van politie en op de bureaus waar het desbetreffende register
      wordt gevoerd of rechtstreeks toegankelijk is;

      b. het Korps landelijke politiediensten: bij de voorlichtingsdienst van het Ministerie van Binnenlandse Zaken en
      Koninkrijksrelaties en het betrokken onderdeel;

      c. de bijzondere ambtenaren van politie: bij de voorlichtingsdienst van het Ministerie van Justitie;

      d. de Koninklijke marechaussee: bij de voorlichtingsdienst van het Ministerie van Defensie, bij de Commandant van
      de Koninklijke marechaussee, bij het Hoofd van de Centrale Justitiële Dienst Koninklijke marechaussee en op de
      bureaus van de districts-commandanten;

      e. het Meldpunt Ongebruikelijke Transacties: bij de voorlichtingsdienst van het Ministerie van Justitie en ter
      plaatse van de vestiging van het Meldpunt.

      2 Indien de beheerder behoort tot het Rijk, maakt hij het reglement bekend in de *Staatscourant* en doet hij van
      het reglement of het feit van de terinzagelegging mededeling in het *Algemeen Politieblad*.

      3 De beheerder van een regionaal politiekorps maakt het reglement of het feit van de terinzagelegging bekend op een
      in de gemeente waarvan de korpsbeheerder burgemeester is gebruikelijke wijze.

      4 Het reglement met betrekking tot een register mede gemeenschappelijk aan de Koninklijke marechaussee wordt
      bekendgemaakt en ter inzage gelegd op een bij de beslissing krachtens [artikel 1, onder ][ref1] te bepalen wijze.

      5 De bekendmaking van het feit van de terinzagelegging van een reglement vermeldt de aard van het register, de
      datum waarop het reglement is vastgesteld en de beheerder, alsmede de plaatsen waar het reglement voor een ieder
      ter inzage is gelegd.

      6 Ten aanzien van een bekendmaking van een wijziging of de intrekking van een reglement zijn het eerste tot en met
      vijfde lid van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004798#Artikel1
    url: https://wetten.overheid.nl/BWBR0004996/2007-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0004798
        artikel: '1'
  - number: '8'
    text: |-
      1 Indien wordt besloten tot het aanleggen van een tijdelijk register, wordt daarbij vooraf schriftelijk vastgelegd:

      a. het doel van het tijdelijke register met inbegrip van een nauwkeurige omschrijving van het bepaalde geval, zo
      mogelijk aangeduid naar tijd en plaats;

      b. de datum waarop met het aanleggen van het tijdelijke register wordt begonnen.

      2 De beheerder stelt binnen een week nadat is begonnen met het aanleggen van het tijdelijke register, het gezag dat
      verantwoordelijk is voor de uitvoering van de politietaak ten dienste waarvan het is aangelegd, daarvan in kennis,
      tenzij het inmiddels is vernietigd.

      3 De [artikelen 6, tweede lid][ref1], en [9, eerste lid, van de wet][ref2], alsmede
      [artikel 3, eerste lid, van dit besluit][ref3] zijn op het tijdelijke register niet van toepassing gedurende twaalf
      maanden na de datum, bedoeld in het eerste lid, onder *b*. Het bevoegd gezag kan deze termijn één of meer malen
      verlengen voor de duur van ten hoogste zes maanden, indien het doel waarvoor het tijdelijke register is aangelegd
      door de bekendmaking en de terinzagelegging van een reglement ernstig in gevaar zou worden gebracht en de beheerder
      een regeling heeft getroffen met betrekking tot de onderwerpen, bedoeld in [artikel 10 van de wet][ref4]. Van elke
      beslissing tot verlenging wordt melding gemaakt aan het College bescherming persoonsgegevens.

      4 Indien dit uit het doel waarvoor het tijdelijke register is aangelegd, voortvloeit, kan het tijdelijke register
      worden overgedragen aan een andere beheerder of worden samengevoegd met een ander register als bedoeld in het
      eerste lid. Het tweede lid is alsdan van overeenkomstige toepassing met betrekking tot het nieuwe gezag.

      5 Indien het tijdelijke register wordt overgedragen of samengevoegd, wordt de termijn, bedoeld in het derde lid,
      niet geschorst. Bestaat er voor het tijdelijke register een reglement, dan wordt dit dienovereenkomstig aangepast.
      Indien het tijdelijke register wordt overgedragen kan het doel niet worden gewijzigd. Indien het tijdelijke
      register wordt samengevoegd met een ander register kan het doel slechts worden verruimd met toestemming van

      a. de officier van justitie, indien het betreft een register dat is aangelegd met het oog op de uitvoering van een
      taak onder diens gezag of

      b. de burgemeester, indien het betreft een register dat is aangelegd met het oog op de uitvoering van een taak
      onder diens gezag.

      6 Bij dringende noodzakelijkheid kan in plaats van de officier van justitie de hulpofficier van justitie en in
      plaats van de burgemeester een door hem schriftelijk aangewezen politie-ambtenaar de toestemming als bedoeld in het
      vijfde lid, geven, onder de verplichting om van de ondernomen handeling onverwijld schriftelijk kennis te geven aan
      de officier van justitie onderscheidenlijk de burgemeester.

      7 Het College bescherming persoonsgegevens wordt van een samenvoeging of een overdracht zo spoedig mogelijk in
      kennis gesteld, onder vermelding van de datum daarvan.

      8 Indien het doel met het oog waarop het tijdelijke register is aangelegd, is bereikt, worden de daarin opgenomen
      persoonsgegevens zo spoedig mogelijk vernietigd voor zover deze geen betekenis hebben voor een eventueel verder
      strafrechtelijk onderzoek in het bepaalde geval als omschreven krachtens het eerste lid, onder *a*, dan wel het
      vijfde of zesde lid.

      9 Van de vernietiging als bedoeld in het achtste lid, wordt een proces-verbaal opgemaakt, dat gedurende twee jaren
      wordt bewaard op zodanige wijze dat dit desgevraagd onmiddellijk aan de daartoe bevoegde organen ter inzake kan
      worden gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0004798#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0004798#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0004996#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0004798#Artikel10
