  - number: '9'
    text: |-
      Aan de volgende ambtenaren worden, in aanvulling op de ambtenaren, bedoeld in [artikel 14, onder ][ref1], gegevens
      uit een register verstrekt voor zover zij deze behoeven ter uitvoering van opdrachten voortvloeiende uit de
      signalering van personen:

      a. ambtenaren van de dienst invoerrechten en accijnzen;

      b. ambtenaren van het Ministerie van Buitenlandse Zaken voor zover dit noodzakelijk is met het oog op de uitvoering
      van opdrachten in het buitenland.


      [ref1]: https://wetten.overheid.nl/BWBR0004798#Artikel14
    url: https://wetten.overheid.nl/BWBR0004996/2007-01-01#Artikel9
