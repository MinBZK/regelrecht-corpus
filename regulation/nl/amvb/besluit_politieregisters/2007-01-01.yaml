preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Ministers van Justitie, van Binnenlandse Zaken en van Defensie, van 7 januari 1991,
    Stafafdeling Wetgeving Publiekrecht, nr. 41162/91/6;

    Gelet op de artikelen 1, onder e, 3, 5, tweede lid,6, derde lid, 7, tweede lid, 9, derde lid, 13, eerste en vierde
    lid, 14, onder e, 16, eerste lid, onder c, 17, 18, eerste tot en met derde lid, 19 en 25, eerste lid, van de Wet
    politieregisters (Stb. 1990, 414);

    Gehoord de Registratiekamer (advies van 30 november 1990, nr. WGAG/1990/2);

    De Raad van State gehoord (advies van 8 februari 1991, nr. WO 3.91.0017);

    Gezien het nader rapport van Onze Minister van Justitie, mede namens Onze Ministers van Binnenlandse Zaken en van
    Defensie a.i., van 12 februari 1991, Stafafdeling Wetgeving Publiekrecht, nr. 44995/91/6;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0004996/2007-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder

      a. de wet: de [Wet politieregisters][ref1];

      b. het bevoegd gezag:

      1°. bij de handhaving van de openbare orde en bij de hulpverlening: de burgemeester;

      2°. bij de strafrechtelijke handhaving van de rechtsorde: de officier van justitie;

      c. het Meldpunt Ongebruikelijke Transacties: het meldpunt, bedoeld in
      [artikel 2 van de Wet melding ongebruikelijke transacties][ref2];

      d. de criminele-inlichtingeneenheid van een bijzondere opsporingsdienst: de als zodanig door Onze Minister van
      Financiën, van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer, van Landbouw, Natuurbeheer en Visserij of
      van Sociale Zaken en Werkgelegenheid, met inachtneming van [artikel 13c, tweede lid, van de wet][ref3], ingerichte
      eenheid.


      [ref1]: https://wetten.overheid.nl/BWBR0004798
      [ref2]: https://wetten.overheid.nl/BWBR0006331#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0004798#Artikel13c
    url: https://wetten.overheid.nl/BWBR0004996/2007-01-01#Artikel1
