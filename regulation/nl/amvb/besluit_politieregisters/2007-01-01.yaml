  - number: '14'
    text: |-
      1 Gegevens worden desgevraagd uit een politieregister verstrekt, voorzover zij deze behoeven voor een goede
      uitvoering van hun taak, aan

      a. de personen, anders dan die bedoeld in [artikel 14, onder ][ref1], die bij de politie, het Meldpunt
      Ongebruikelijke Transacties of bij de Koninklijke marechaussee werkzaam zijn ten dienste van de uitvoering van de
      politietaak, voor zover zij daartoe door de desbetreffende beheerder schriftelijk zijn geautoriseerd;

      b. De commissie, bedoeld in [artikel 8 van de Wet schadefonds geweldsmisdrijven][ref2];

      c. de Directeur van de Stichting Centraal Bureau Rijvaardigheidsbewijzen voor zover dit noodzakelijk is met het oog
      op het onderzoek, bedoeld in de [artikelen 101][ref3] en [142 van het Reglement rijbewijzen][ref4], en het betreft
      overtreding van [artikel 6][ref5] of [artikel 8 van de Wegenverkeerswet 1994][ref6];

      d. medewerkers van een stichting als bedoeld in [artikel 1 onder f, van de Wet op de jeugdzorg][ref7], voor zover
      zij deze behoeven voor de uitvoering van één van de taken als omschreven in [artikel 5, eerste lid][ref8], en
      [artikel 10, eerste lid, onderdelen b tot en met e, van die wet][ref9].

      e. personen, belast met de uitvoering van de [Vreemdelingenwet 2000][ref10], voor zover het betreft gegevens die
      noodzakelijk zijn voor de vaststelling van de identiteit van personen;

      f. personen die de beheerder heeft benoemd in een commissie van toezicht, voor zover zij de beheerder bijstaan bij
      het toezicht op het beheer en het gebruik van politieregisters;

      g. de directeuren van de inrichtingen, bedoeld in
      [artikel 1, onder b, van de Penitentiaire beginselenwet][ref11], van de inrichtingen, bedoeld in
      [artikel 1, onder b, van de Beginselenwet verpleging ter beschikking gestelden][ref12] en van de inrichtingen,
      bedoeld in [artikel 1, onder b, van de Beginselenwet justitiële jeugdinrichtingen][ref13], en functionarissen van
      de Dienst Justitiële inrichtingen van het ministerie van Justitie, voor zover zij deze behoeven:

      1. voor het nemen van beslissingen over hetzij de aanstelling of het ontslag van personeel;

      2. voor het nemen van beslissingen over de toelating tot de inrichting van personen, die niet worden ingesloten in
      de inrichting;

      3. voor het nemen van beslissingen over het verlaten van de inrichting bij wijze van verlof;

      4. voor het nemen van beslissingen over de erkenning van een penitentiair programma, bedoeld in
      [artikel 4, eerste lid, van de Penitentiaire beginselenwet][ref14] of een scholings- of trainingsprogramma, bedoeld
      in [artikel 3, eerste lid, van de Beginselenwet justitiële jeugdinrichtingen][ref15];

      5. voor het treffen van maatregelen met het oog op de ongestoorde tenuitvoerlegging van een vrijheidsstraf of een
      vrijheidsbenemende maatregel met betrekking tot ingesloten personen.

      h. Onze Minister van Justitie, voor zover dit in het kader van de benoeming, de herbenoeming of het ontslag van de
      leden van de commissies van toezicht bij de inrichtingen, genoemd onder g, noodzakelijk is teneinde na te gaan of
      er bezwaren bestaan tegen de benoeming van betrokkene;

      i. personen die optreden namens een rechtspersoon met volledige rechtsbevoegdheid op ideële grondslag die krachtens
      zijn doelstelling en blijkens zijn feitelijke werkzaamheden in het bijzonder de belangen van slachtoffers van
      strafbare feiten of van verkeersongevallen behartigt, voor zover de gegevens betrekking hebben op deze slachtoffers
      en die rechtspersoon tot het ontvangen van dergelijke gegevens is gemachtigd door de Minister van Justitie, het
      College bescherming persoonsgegevens gehoord;

      j. het bestuur van de Stichting Processen Verbaal, voor zover het betreft gegevens inzake aanrijdingen of
      aanvaringen;

      k. personen en instanties met een publieke taak belast, voor zover het betreft gegevens die op hun verzoek met het
      oog op de signalering van personen zijn opgenomen;

      l. Onze Minister van Justitie, voor zover dit noodzakelijk is met het oog op:

      1°. de afgifte van een verklaring van geen bezwaar in verband met de oprichting van een naamloze of besloten
      vennootschap dan wel de wijziging van de statuten daarvan;

      2°. de uitoefening van de bevoegdheden krachtens de [Wet wapens en munitie][ref16] of de
      [Wet particuliere beveiligingsorganisaties en recherchebureaus][ref17];

      m. de Divisie Vorderingen van het Centraal Bureau Rijvaardigheidsbewijzen, voor zover zij deze behoeft in verband
      met de haar bij de [artikelen 130 tot en met 134a van de Wegenverkeerswet 1994][ref18] opgedragen taak;

      n. de Directeur van de Dienst Wegverkeer, voor zover hij deze behoeft in verband met de uitvoering van de taken van
      de Dienst Wegverkeer;

      o. medewerkers van Halt-bureaus, voor zover deze bureaus op grond van
      [artikel 48g, eerste lid, van de Wet Justitie-subsidies][ref19] zijn aangewezen door Onze Minister van Justitie
      en het gegevens betreft die voor de alternatieve afdoening van strafbare feiten, gepleegd door minderjarigen,
      noodzakelijk zijn.

      p. Onze Minister van Justitie, voor zover dit in het kader van de beoordeling van een verzoek tot het verkrijgen
      van het Nederlanderschap op grond van [artikel 9, eerste lid, van de Rijkswet op het Nederlanderschap][ref20],
      noodzakelijk is teneinde na te gaan of tegen de betrokkene een uitleveringsverzoek is gedaan;

      q. de burgemeester, voor zover dit in het kader van de beoordeling van een verzoek tot het verkrijgen van het
      Nederlanderschap op grond van de [Rijkswet op het Nederlanderschap][ref21], noodzakelijk is;

      r. de burgemeester en de commissaris van de Koning, voor zover dit in het kader van hun adviserende taak, bedoeld
      in het [Reglement op de Orde van de Nederlandse Leeuw en de Orde van Oranje-Nassau][ref22] noodzakelijk is;

      s. ambtenaren aan wie bevoegdheden zijn toegekend met het oog op het toezicht op de naleving van de regels
      die zijn gesteld bij of krachtens de [Wet milieubeheer][ref23], de [Wet milieugevaarlijke stoffen][ref24],
      de [Bestrijdingsmiddelenwet 1962][ref25], de [Wet vervoer gevaarlijke stoffen][ref26], de
      [Wet verontreiniging oppervlaktewateren][ref27], de [Wet inzake de luchtverontreiniging][ref28], de
      [Wet bodembescherming][ref29] en de [Meststoffenwet][ref30], voor zover het gegevens over overtredingen van deze
      wetten betreft en zij deze behoeven voor de goede uitoefening hun toezichthoudende bevoegdheden;

      t. medewerkers van de raad voor de kinderbescherming, voor zover zij deze behoeven voor de uitvoering van één van
      de bij wet aan de raad opgedragen taken.

      u. het bevoegde gezag, bedoeld in
      [artikel 1, eerste lid, onder l, van het Besluit algemene rechtspositie politie][ref31] en het bevoegde gezag,
      bedoeld in [artikel 1, eerste lid, onder e, van het Besluit rechtspositie vrijwillige politie][ref32], voorzover
      zij deze behoeven voor het verrichten van een onderzoek als bedoeld in [artikel 8a, eerste lid][ref33], en
      [artikel 8b, eerste lid, van het Besluit algemene rechtspositie politie][ref34] en [artikel 4a, eerste lid][ref35],
      en [artikel 4b, eerste lid, van het Besluit rechtspositie vrijwillige politie][ref36], of voor het verrichten
      van een onderzoek naar de betrouwbaarheid en geschiktheid ten aanzien van personen die anderszins werkzaamheden
      verrichten voor een politiekorps, de Organisatie Informatie- en Communicatietechnologie OOV, het Landelijk
      selectie- en opleidingsinstituut politie, Politie onderwijs- en kenniscentrum of de Rijksrecherche en waarvoor
      die gezagsinstanties justitiële gegevens als bedoeld in [artikel 23 van het Besluit justitiële gegevens][ref37]
      vragen;

      v. Onze Minister van Justitie ten behoeve van het verwerken van deze gegevens in het Cliënt-Volgsysteem
      Jeugdcriminaliteit;

      w. korpschefs van een regionaal politiekorps voor zover dit noodzakelijk is ter uitvoering van
      [artikel 3.3.2, zevende lid, van het Vuurwerkbesluit][ref38];

      x. de Onderzoeksraad voor veiligheid, bedoeld in [artikel 2 van de Rijkswet Onderzoeksraad voor veiligheid][ref39];

      y. ambtenaren aan wie bevoegdheden zijn toegekend met het oog op het toezicht op de naleving van de regels die
      zijn gesteld bij of krachtens de [Wet luchtvaart][ref40] en de [Luchtvaartwet][ref41] voor zover het gegevens over
      overtredingen van deze wetten betreft en zij deze behoeven voor een goede uitoefening van hun toezichthoudende
      bevoegdheden;

      z. het college van burgemeester en wethouders, indien aan het college bevoegdheden zijn toegekend met het
      oog op het toezicht op de naleving van de regels die zijn gesteld in de gemeentelijke verordening inzake het
      escortbedrijf, bedoeld in [artikel 4, eerste lid, onderdeel c, van het Besluit BIBOB][ref42], voorzover het
      gegevens betreft die het college behoeft voor een goede uitoefening van die toezichthoudende bevoegdheden;

      aa. Onze Ministers, voorzover het betreft gegevens die noodzakelijk zijn voor het uitvoeren van dreigings-
      en risico-evaluaties en het vaststellen van bewakings- en beveiligingsopdrachten en adviezen door de
      evaluatiedriehoek, met het oog op het bewaken en beveiligen van personen, objecten en diensten.

      bb. personen, werkzaam bij de door Onze Minister van Landbouw, Natuur en Voedselkwaliteit aangewezen dienst, als
      bedoeld in [artikel 1, onderdeel d, van het Besluit inbeslaggenomen voorwerpen][ref43], voorzover het betreft
      gegevens met betrekking tot het proces-verbaal en de kennisgeving van inbeslagneming, voorzover zij deze behoeven
      voor een goede toepassing van het [Besluit inbeslaggenomen voorwerpen][ref44].

      cc. de door Onze Minister van Sociale Zaken en Werkgelegenheid aangewezen ambtenaren, die zijn belast met het
      toezicht op de naleving van het bepaalde bij of krachtens de [Wet arbeid vreemdelingen][ref45], voorzover zij
      deze behoeven voor de inschatting van de veiligheidsrisico’s met betrekking tot de uitoefening van vorenbedoeld
      toezicht.

      dd. medewerkers van het Waarborgfonds Motorverkeer, bedoeld in
      [artikel 23, eerste lid, van de Wet aansprakelijkheidsverzekering motorrijtuigen][ref46], voorzover het
      betreft gegevens omtrent de personalia en de verblijfplaats van benadeelden en zij deze gegevens behoeven voor
      de hulp aan benadeelden ten behoeve van het geldend maken van een recht op schadevergoeding, als bedoeld in
      [artikel 25, eerste lid, van die Wet][ref47].

      ee. ambtenaren van de Immigratie- en Naturalisatiedienst, die zijn belast met de uitvoering van
      de [Vreemdelingenwet 2000][ref48], de [Rijkswet op het Nederlanderschap][ref49] of een verdrag
      dan wel een voor Nederland bindend besluit van een volkenrechtelijke organisatie als bedoeld in
      [artikel 112 van de Vreemdelingenwet 2000][ref50], voorzover zij deze behoeven voor het nemen van beslissingen
      omtrent de toegang, het verblijf of de ongewenstverklaring van personen.

      2 In aanvulling op de verstrekking als bedoeld in het eerste lid worden uit een register zware criminaliteit
      desgevraagd gegevens verstrekt aan de personen of instanties, genoemd in het eerste lid, onder a, f, g, h, l, p,
      q, r, u en w, in de in die onderdelen aangegeven gevallen, voorzover zij deze behoeven voor een goede uitvoering
      van hun taak, en aan de personen, genoemd in het eerste lid, onder aa, in de in die onderdelen aangegeven
      gevallen, voorzover zij deze behoeven voor het verrichten van dreigings- en risico-evaluaties en het vaststellen
      van bewakings- en beveiligingsopdrachten en adviezen door de evaluatiedriehoek, met het oog op het bewaken en
      beveiligen van personen, objecten en diensten.

      3 Uit een politieregister worden gegevens verstrekt aan het Meldpunt Ongebruikelijke Transacties, voor zover het
      die behoeft voor een goede uitvoering van zijn taak.

      4 Uit een politieregister kunnen gegevens worden verstrekt aan de gemeentelijke basisadministratie persoonsgegevens
      met het oog op de signalering van veranderingen in de gegevens die in die basisadministratie zijn opgenomen.

      5 Aan de machtiging, bedoeld in het eerste lid, onder i, kunnen voorschriften en beperkingen worden verbonden.

      6 De [artikelen 11][ref51] en [12][ref52] zijn van overeenkomstige toepassing.


