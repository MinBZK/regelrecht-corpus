  - number: '12'
    text: |-
      1 Er worden geen gegevens uit een politieregister verstrekt ingevolge de [artikelen 14][ref1] en
      [15, eerste lid, van de wet][ref2], indien de verstrekking een ander doel zou betreffen dan waarvoor het register
      is aangelegd:

      a. wanneer het register uitsluitend is aangelegd met het oog op de uitvoering van de hulpverleningstaak van de
      politie, tenzij met uitdrukkelijke instemming van de geregistreerde;

      b. wanneer het een register bij het Meldpunt Ongebruikelijke Transacties betreft, tenzij:

      1°. de verstrekking plaatsvindt ten behoeve van de opneming in een register zware criminaliteit of een voorlopig
      register;

      2°. uit de gegevens zelf een redelijk vermoeden voortvloeit dat een bepaalde persoon een misdrijf heeft begaan;

      3°. de gegevensverstrekking plaatsvindt op grond van [artikel 15, eerste lid, onder ][ref3], en deze
      gegevens redelijkerwijs van belang kunnen zijn ter voorkoming of opsporing van misdrijven als bedoeld in
      [artikel 1, eerste lid, onder k, van de wet][ref4];

      4°. de verstrekking plaatsvindt op grond van [artikel 13, derde lid][ref5], en het gegevens betreft die
      noodzakelijk zijn ter opsporing van een misdrijf waardoor de rechtsorde in het verzoekende land ernstig is
      geschokt.

      2 Er worden geen gegevens uit een politieregister verstrekt ingevolge de [artikelen 14][ref6] en
      [15, eerste lid, van de wet][ref7] omtrent de uitoefening door de geregistreerde van het recht op kennisneming of
      verbetering ingevolge de [artikelen 20, eerste lid][ref8], onderscheidenlijk [22, eerste lid, van de wet][ref9].

      3 Gegevens die betrekking hebben op de in [artikel 5, eerste lid, van de wet ][ref10]genoemde kenmerken, worden
      slechts verstrekt

      a. ingevolge [artikel 14 van de wet][ref11] voor zover dit noodzakelijk is voor de goede uitvoering van de
      politietaak;

      b. ingevolge [artikel 15, eerste lid][ref12], [16, eerste lid][ref13], en krachtens [artikel 18 van de wet][ref14]
      voor zover dit onvermijdelijk is voor de goede uitvoering van de taak met het oog waarop wordt verstrekt.

      4 Bij een verstrekking van gegevens als bedoeld in het derde lid, wordt de daarbij ingevolge
      [artikel 3, derde lid][ref15], opgenomen aanduiding omtrent de betrouwbaarheid vermeld.


