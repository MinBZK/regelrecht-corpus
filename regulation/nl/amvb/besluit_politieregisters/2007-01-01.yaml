  - number: 13a
    text: |-
      1 Aan de politieambtenaar uit een andere lidstaat van de Europese Unie die is toegevoegd aan een gemeenschappelijk
      onderzoeksteam als bedoeld in [artikel 552qa van het Wetboek van Strafvordering][ref1] dat gevestigd is in
      Nederland, kunnen gegevens worden verstrekt op gelijke voet als aan Nederlandse politieambtenaren voor zover zij
      deze behoeven voor de doeleinden waarvoor het gemeenschappelijk onderzoeksteam is ingesteld.

      2 Aan de politieambtenaar uit een andere lidstaat van de Europese Unie die is toegevoegd aan een gemeenschappelijk
      onderzoeksteam als bedoeld in [artikel 552qa van het Wetboek van Strafvordering][ref2] dat gevestigd is in
      Nederland, kunnen, in de gevallen als bedoeld in [artikel 13d, tweede lid, onder b, en derde lid, van de wet][ref3],
      gegevens worden verstrekt uit een tijdelijk register, met het oog op de gebruikmaking daarvan in die andere
      lidstaat.

      3 Aan de Nederlandse politieambtenaar die is toegevoegd aan een gemeenschappelijk onderzoeksteam als bedoeld in
      [artikel 552qa van het Wetboek van Strafvordering][ref4] dat gevestigd is in een andere lidstaat van de Europese
      Unie, kunnen gegevens worden verstrekt met het oog op de gebruikmaking daarvan voor de doeleinden waarvoor het
      gemeenschappelijk onderzoeksteam is ingesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel552qa
