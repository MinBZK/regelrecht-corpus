        artikel: '14'
  - number: '10'
    text: |-
      Antecedenten worden op hun verzoek, voorzover zij deze behoeven voor de uitoefening van hun taak, verstrekt aan
      reclasseringswerkers als bedoeld in [artikel 6, eerste lid, van de Reclasseringsregeling 1995][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007120#Artikel6
    url: https://wetten.overheid.nl/BWBR0004996/2007-01-01#Artikel10
