  - number: '15'
    text: |-
      1 Verstrekking van gegevens uit een politieregister ten behoeve van wetenschappelijk onderzoek en statistiek vindt
      slechts plaats nadat aan de betrokken onderzoeker daartoe een machtiging is verleend door:

      a. Onze Minister van Justitie, indien het gegevens betreft uit een register dat is aangelegd met het oog op de
      uitvoering van een taak onder het gezag van de officier van justitie of

      b. de burgemeester, indien het gegevens betreft uit een register dat is aangelegd met het oog op de uitvoering van
      een taak onder het gezag van de burgemeester.

      2 De machtiging als bedoeld in het eerste lid, wordt slechts gegeven indien

      a. het onderzoek een algemeen belang dient;

      b. de organisatie van de politie niet onnodig wordt belast;

      c. het onderzoek niet zonder de betrokken gegevens kan worden uitgevoerd en

      d. de persoonlijke levenssfeer van de geregistreerden niet onevenredig wordt geschaad.

      3 Rechtstreekse benadering van geregistreerden door de onderzoeker vindt niet plaats, tenzij dit uitdrukkelijk
      is toegestaan in de machtiging ingevolge het eerste lid. Deze toestemming kan slechts worden verleend indien
      rechtstreekse benadering voor het doel van het onderzoek onvermijdelijk is.

      4 De beheerder kan een machtiging verlenen tot verstrekking van gegevens uit een politieregister ten behoeve van de
      interne bedrijfsstatistiek aan personen werkzaam binnen de politie-organisatie, indien de persoonlijke levenssfeer
      van de geregistreerden daardoor niet onevenredig wordt geschaad.

      5 Aan de machtiging als bedoeld in het eerste en vierde lid, kunnen beperkingen worden gesteld en voorschriften
      worden verbonden.
    url: https://wetten.overheid.nl/BWBR0004996/2007-01-01#Artikel15
  - number: '16'
    text: |-
      1 In gevallen waarin een verzoek tot verstrekking van gegevens uit een politieregister wordt gedaan en niet
      aanstonds duidelijk is wie de verzoeker is en of deze gerechtigd is tot de verstrekking, wordt de verstrekking
      eerst gedaan nadat dit is vastgesteld.

      2 Indien niet rechtstreeks langs geautomatiseerde weg gegevens uit een politieregister dat niet een register
      zware criminaliteit of een voorlopig register is, worden verstrekt, wordt daarvan aantekening gehouden, tenzij
      overeenkomstig het doel van het register is verstrekt aan personen die blijkens het reglement behoren tot de vaste
      gebruikers van het register.

      3 Van een verstrekking behoeft geen aantekening te worden gehouden ingevolge het tweede lid, indien de verstrekking
      het resultaat is van een koppeling en ingevolge artikel 5, eerste lid, van de koppeling een proces-verbaal is
      opgemaakt.

      4 Van een verstrekking behoeft geen aantekening te worden gehouden indien dit zich niet verdraagt met het belang
      van de veiligheid van de staat.
    url: https://wetten.overheid.nl/BWBR0004996/2007-01-01#Artikel16
  - number: '17'
    text: |-
      1 Een gegeven kan rechtstreeks langs geautomatiseerde weg uit een politieregister worden verstrekt aan de personen
      die daartoe een schriftelijke autorisatie voor een daarbij omschreven doel van de beheerder hebben gekregen. De
      autorisatie kan slechts worden verleend aan de ambtenaren, bedoeld in [artikel 14, onder a en b, van de wet][ref1],
      aan de personen, bedoeld in [artikel 14, eerste lid, onder a, van dit besluit][ref2], aan de leden van het
      openbaar ministerie, bedoeld in [artikel 15, eerste lid, onder a, van de wet][ref3], voorzover noodzakelijk
      voor strafvorderlijke beslissingen omtrent opsporing en vervolging en de hulp aan slachtoffers van strafbare
      feiten, alsmede aan bepaalde, daartoe aangewezen ambtenaren in dienst van Onze Minister van Justitie, als
      bedoeld in [artikel 14, eerste lid, onderdeel ee][ref4], voor de verstrekking van bepaalde categorieën
      van politiegegevens met het oog op het nemen van beslissingen omtrent de toegang, het verblijf of de
      ongewenstverklaring, als bedoeld in de [Vreemdelingenwet 2000][ref5], de [Rijkswet op het Nederlanderschap][ref6]
      of een verdrag dan wel een voor Nederland bindend besluit van een volkenrechtelijke organisatie, als bedoeld in
      [artikel 112 van de Vreemdelingenwet 2000][ref7].

      2 De autorisatie kan tijdelijk of voor onbepaalde tijd worden verleend. Daaraan kunnen beperkingen worden gesteld
      en voorschriften verbonden.

      3 Een gegeven kan rechtstreeks langs geautomatiseerde weg uit een politieregister worden verstrekt aan degenen die
      daartoe gerechtigd zijn met het oog op de uitvoering van opdrachten voortvloeiende uit de signalering van personen.

      4 De beheerder treft de nodige voorzieningen van technische en organisatorische aard die er toe strekken te
      waarborgen dat geen verstrekkingen ingevolge het eerste lid worden gedaan anders dan in overeenstemming met een
      verleende autorisatie.

      5 Van een verstrekking ingevolge het eerste lid wordt in alle gevallen langs geautomatiseerde weg aantekening
      gehouden.

      6 Indien de handhaving van het verstrekkingenregime anderszins afdoende is gewaarborgd, kan, het College
      bescherming persoonsgegevens gehoord, van de verplichting, bedoeld in het vijfde lid, vrijstelling of ontheffing
      worden verleend door

      a. Onze Minister van Justitie, indien het verstrekkingen betreft uit een register dat is aangelegd met het oog op
      de uitvoering van een taak onder het gezag van de officier van justitie of

      b. Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties, indien het verstrekkingen betreft uit een register
      dat is aangelegd met het oog op de uitvoering van een taak onder het gezag van de burgemeester.

      7 Aan een vrijstelling of ontheffing als bedoeld in het zesde lid, kunnen voorschriften worden verbonden.


