  - number: '13'
    text: |-
      1 Uit een politieregister kunnen gegevens worden verstrekt aan politie-autoriteiten in een ander land indien dit
      noodzakelijk is:

      a. voor de goede uitvoering van de politietaak in Nederland of voor de uitvoering van opdrachten voortvloeiende uit
      de signalering van personen door Nederlandse autoriteiten;

      b. ter voorkoming van een ernstig en dreigend gevaar of ter opsporing van een misdrijf waardoor de rechtsorde in
      dat land ernstig is geschokt of

      c. voor de goede uitvoering van de politietaak in dat land, op grond van een verzoek met betrekking tot een
      bepaalde persoon of een bepaald geval.

      2 In de grensgebieden kunnen gegevens als bedoeld in het eerste lid, aanhef en onder *c*, ook zonder een daartoe
      strekkend verzoek worden verstrekt.

      3 Uit een politieregister bij het Meldpunt Ongebruikelijke Transacties kunnen gegevens worden verstrekt aan van
      overheidswege aangewezen administratieve of politiële meldpunten in het buitenland die een vergelijkbare taak
      hebben als het meldpunt. Het zevende lid vindt geen toepassing.

      4 Bij de beoordeling van de vraag of gegevens ingevolge het eerste of derde lid zullen worden verstrekt, wordt
      rekening gehouden met de mate waarin waarborgen in het andere land aanwezig zijn met betrekking tot een juist
      gebruik van de verstrekte gegevens en met betrekking tot de bescherming van de persoonlijke levenssfeer.

      5 De gegevens worden steeds verstrekt onder de algemene voorwaarde dat deze slechts zullen worden gebruikt voor het
      doel waarvoor zij zijn verstrekt. De beheerder kan in bijzondere gevallen op verzoek van de buitenlandse politie-
      autoriteiten toestemmen in gebruik voor een ander doel voor zover dit noodzakelijk is voor de goede uitvoering van
      de politietaak in dat land.

      6 Gegevens die betrekking hebben op de in [artikel 5, eerste lid, van de wet ][ref1]genoemde kenmerken, worden
      slechts verstrekt indien dit met het oog op een juiste beantwoording van een door een buitenlandse politie-
      autoriteit gestelde vraag onvermijdelijk is. Daarbij wordt een aanduiding omtrent de betrouwbaarheid van het
      gegeven vermeld.

      7 De verstrekking vindt plaats door tussenkomst van het Korps landelijke politiediensten. De verstrekking kan
      echter rechtstreeks plaatsvinden overeenkomstig afspraken met politie-autoriteiten in het buitenland, voor zover
      met deze afspraken is ingestemd door:

      a. Onze Minister van Justitie, indien het gegevens betreft uit een register dat is aangelegd met het oog op de
      uitvoering van een taak onder het gezag van de officier van justitie of

      b. Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties, indien het gegevens betreft uit een register dat is
      aangelegd met het oog op de uitvoering van een taak onder het gezag van de burgemeester.

      8 Onverminderd het bepaalde in [artikel 552 ][ref2] worden geen gegevens verstrekt:

      a. wanneer een vermoeden bestaat dat de gegevens zullen worden gebruikt voor een onderzoek, ingesteld met het
      oogmerk een verdachte te vervolgen, te straffen, of op andere wijze te treffen in verband met zijn godsdienstige of
      staatkundige overtuiging, zijn nationaliteit, zijn ras of de groep van de bevolking waartoe hij behoort;

      b. voor zover het verstrekken van gegevens zou strekken tot het verlenen van medewerking aan een vervolging
      of een berechting welke onverenigbaar is met het aan [artikel 68 van het Wetboek van Strafrecht][ref3] en
      [artikel 255, eerste lid, van het Wetboek van Strafvordering][ref4] ten grondslag liggende beginsel;

      c. ten behoeve van een onderzoek naar feiten terzake waarvan de verdachte in Nederland wordt vervolgd;

      d. ten behoeve van een onderzoek naar feiten als bedoeld in [artikel 552][ref5], dan krachtens een overeenkomstig
      die bepaling verleende machtiging van Onze Minister van Justitie.

      9 Indien grond bestaat voor het vermoeden, bedoeld in het achtste lid, onder *a*, wordt het verzoek aan Onze
      Minister van Justitie voorgelegd.

      10 Het eerste, tweede en vierde tot en met zevende lid is niet van toepassing op de politie-ambtenaar uit een
      ander land die als contactambtenaar is geplaatst bij, bij enig politiekorps of bij het Wapen der Koninklijke
      marechaussee, voor zover met het land door welke hij is gezonden, daarvan afwijkende afspraken zijn gemaakt waarmee
      Onze Minister van Justitie heeft ingestemd. Aan hem kunnen gegevens worden verstrekt op gelijke voet als aan
      Nederlandse politie-ambtenaren voor zover in overeenstemming met deze afspraken.

      11 Het eerste, tweede en vierde tot en met zevende lid is evenmin van toepassing op de Nederlandse politie-
      ambtenaar of de ambtenaar van de Koninklijke marechaussee die als contactambtenaar of anderszins is gezonden naar
      het buitenland. Aan hem kunnen gegevens worden verstrekt als ware hij in Nederland. Het eerste, tweede, vierde tot
      en met zesde alsmede het achtste, negende en twaalfde lid zijn van toepassing bij de verstrekking van de door hen
      ontvangen gegevens aan politie-autoriteiten in het land waar zij werkzaam zijn.

      12 De [artikelen 11][ref6] en [12][ref7] zijn van overeenkomstige toepassing.


