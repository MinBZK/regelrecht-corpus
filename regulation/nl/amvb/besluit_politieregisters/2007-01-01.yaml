    text: |-
      1 De op de bijzondere politieregisters betrekking hebbende bepalingen uit de wet en dit besluit zijn, voor zover
      deze registers worden gehouden bij een criminele-inlichtingeneenheid van een bijzondere opsporingsdienst, van
      toepassing op:

        - een register met een doelstelling als omschreven in [artikel 1, eerste lid, onder k, van de wet][ref1], en
        - een register met een doelstelling als omschreven in [artikel 1, eerste lid, onder l, van de wet][ref2].

      2 De ambtenaren, bedoeld in [artikel 13c, vijfde lid, van de wet][ref3], voldoen aan de eindtermen van de door Onze
      Ministers aan te wijzen opleidingen.


