        bwb_id: BWBR0004798
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0004798
        artikel: '1'
  - number: 18a.2
    text: |-
      De ambtenaren, bedoeld in [artikel 13c, vijfde lid, van de wet][ref1], voldoen aan de eindtermen van de door Onze
      Ministers aan te wijzen opleidingen.


      [ref1]: https://wetten.overheid.nl/BWBR0004798#Artikel13c
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel18a
    references:
