      zijn doelstelling en blijkens zijn feitelijke werkzaamheden in het bijzonder de belangen van slachtoffers van
      strafbare feiten of van verkeersongevallen behartigt, voor zover de gegevens betrekking hebben op deze slachtoffers
      en die rechtspersoon tot het ontvangen van dergelijke gegevens is gemachtigd door de Minister van Justitie, het
      College bescherming persoonsgegevens gehoord;
