  - number: 14a.2
    text: |-
      Verstrekking van gegevens als bedoeld in het eerste lid, of van inlichtingen daarover, vindt alleen plaats door,
      dan wel met bijzondere toestemming van het openbaar ministerie en onder daaraan door het openbaar ministerie te
      stellen voorwaarden. Die voorwaarden kunnen onder meer betreffen het ter beschikking stellen of doorgeven van die
      gegevens of inlichtingen daarover aan derden.
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel14a
  - number: 14a.3
    text: |-
      Ingevolge dit artikel verstrekte gegevens worden niet langer dan gedurende een termijn van zes maanden na datum
      van verkrijgen bewaard, tenzij met bijzondere toestemming van het openbaar ministerie. Daarbij kunnen nadere
      voorwaarden worden gesteld.
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel14a
  - number: 14a.4
    text: |-
      Onze Ministers kunnen nadere regels vaststellen met betrekking tot de verstrekking en bewaring van gegevens als
      bedoeld in het eerste tot en met het derde lid.
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel14a
  - number: '15.1'
    text: |-
      Verstrekking van gegevens uit een politieregister ten behoeve van wetenschappelijk onderzoek en statistiek vindt
      slechts plaats nadat aan de betrokken onderzoeker daartoe een machtiging is verleend door:
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel15
  - number: 15.1.a
    text: |-
      Onze Minister van Justitie, indien het gegevens betreft uit een register dat is aangelegd met het oog op de
      uitvoering van een taak onder het gezag van de officier van justitie of
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel15
  - number: 15.1.b
    text: |-
      de burgemeester, indien het gegevens betreft uit een register dat is aangelegd met het oog op de uitvoering van een
      taak onder het gezag van de burgemeester.
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel15
  - number: '15.2'
    text: De machtiging als bedoeld in het eerste lid, wordt slechts gegeven indien
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel15
  - number: 15.2.a
    text: het onderzoek een algemeen belang dient;
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel15
  - number: 15.2.b
    text: de organisatie van de politie niet onnodig wordt belast;
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel15
  - number: 15.2.c
    text: het onderzoek niet zonder de betrokken gegevens kan worden uitgevoerd en
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel15
  - number: 15.2.d
    text: de persoonlijke levenssfeer van de geregistreerden niet onevenredig wordt geschaad.
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel15
  - number: '15.3'
    text: |-
      Rechtstreekse benadering van geregistreerden door de onderzoeker vindt niet plaats, tenzij dit uitdrukkelijk
      is toegestaan in de machtiging ingevolge het eerste lid. Deze toestemming kan slechts worden verleend indien
      rechtstreekse benadering voor het doel van het onderzoek onvermijdelijk is.
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel15
  - number: '15.4'
    text: |-
      De beheerder kan een machtiging verlenen tot verstrekking van gegevens uit een politieregister ten behoeve van de
      interne bedrijfsstatistiek aan personen werkzaam binnen de politie-organisatie, indien de persoonlijke levenssfeer
      van de geregistreerden daardoor niet onevenredig wordt geschaad.
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel15
  - number: '15.5'
    text: |-
      Aan de machtiging als bedoeld in het eerste en vierde lid, kunnen beperkingen worden gesteld en voorschriften
      worden verbonden.
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel15
  - number: '16.1'
    text: |-
      In gevallen waarin een verzoek tot verstrekking van gegevens uit een politieregister wordt gedaan en niet aanstonds
      duidelijk is wie de verzoeker is en of deze gerechtigd is tot de verstrekking, wordt de verstrekking eerst gedaan
      nadat dit is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel16
  - number: '16.2'
    text: |-
      Indien niet rechtstreeks langs geautomatiseerde weg gegevens uit een politieregister dat niet een register
      zware criminaliteit of een voorlopig register is, worden verstrekt, wordt daarvan aantekening gehouden, tenzij
      overeenkomstig het doel van het register is verstrekt aan personen die blijkens het reglement behoren tot de vaste
      gebruikers van het register.
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel16
  - number: '16.3'
    text: |-
      Van een verstrekking behoeft geen aantekening te worden gehouden ingevolge het tweede lid, indien de verstrekking
      het resultaat is van een koppeling en ingevolge artikel 5, eerste lid, van de koppeling een proces-verbaal is
      opgemaakt.
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel16
  - number: '16.4'
    text: |-
      Van een verstrekking behoeft geen aantekening te worden gehouden indien dit zich niet verdraagt met het belang van
      de veiligheid van de staat.
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel16
  - number: '17.1'
    text: |-
      Een gegeven kan rechtstreeks langs geautomatiseerde weg uit een politieregister worden verstrekt aan de personen
      die daartoe een schriftelijke autorisatie voor een daarbij bepaald omschreven doel van de beheerder hebben
      gekregen. De autorisatie kan slechts worden verleend aan de ambtenaren, bedoeld in [artikel 14, onder ][ref1], aan
      de personen, bedoeld in [artikel 14, eerste lid, onder ][ref2], alsmede aan de leden van het openbaar ministerie
      bedoeld in [artikel 15, eerste lid, onder a, van de wet][ref3] voorzover noodzakelijk voor strafvorderlijke
      beslissingen omtrent opsporing en vervolging en de hulp aan slachtoffers van strafbare feiten.


      [ref1]: https://wetten.overheid.nl/BWBR0004798#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0004996#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0004798#Artikel15
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0004798
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0004996
        artikel: '14'
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0004798
        artikel: '15'
  - number: '17.2'
    text: |-
      De autorisatie kan tijdelijk of voor onbepaalde tijd worden verleend. Daaraan kunnen beperkingen worden gesteld en
      voorschriften verbonden.
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel17
  - number: '17.3'
    text: |-
      Een gegeven kan rechtstreeks langs geautomatiseerde weg uit een politieregister worden verstrekt aan degenen die
      daartoe gerechtigd zijn met het oog op de uitvoering van opdrachten voortvloeiende uit de signalering van personen.
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel17
  - number: '17.4'
    text: |-
      De beheerder treft de nodige voorzieningen van technische en organisatorische aard die er toe strekken te
      waarborgen dat geen verstrekkingen ingevolge het eerste lid worden gedaan anders dan in overeenstemming met een
      verleende autorisatie.
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel17
  - number: '17.5'
    text: |-
      Van een verstrekking ingevolge het eerste lid wordt in alle gevallen langs geautomatiseerde weg aantekening
      gehouden.
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel17
  - number: '17.6'
    text: |-
      Indien de handhaving van het verstrekkingenregime anderszins afdoende is gewaarborgd, kan, het College bescherming
      persoonsgegevens gehoord, van de verplichting, bedoeld in het vijfde lid, vrijstelling of ontheffing worden
      verleend door
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel17
  - number: 17.6.a
    text: |-
      Onze Minister van Justitie, indien het verstrekkingen betreft uit een register dat is aangelegd met het oog op de
      uitvoering van een taak onder het gezag van de officier van justitie of
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel17
  - number: 17.6.b
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties, indien het verstrekkingen betreft uit een register dat
      is aangelegd met het oog op de uitvoering van een taak onder het gezag van de burgemeester.
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel17
  - number: '17.7'
    text: Aan een vrijstelling of ontheffing als bedoeld in het zesde lid, kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel17
  - number: '18.1'
    text: |-
      Indien van de verstrekking aantekening wordt gehouden, wordt daarbij de identiteit van de verzoeker, de datum van
      de verstrekking en een omschrijving van de verstrekte gegevens vastgelegd.
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel18
  - number: '18.2'
    text: |-
      In het geval aantekening wordt gehouden van een verstrekking ingevolge [artikel 16, tweede lid][ref1], wordt tevens
      het doel van de verstrekking vastgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0004996#Artikel16
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0004996
        artikel: '16'
        paragraaf: '6'
  - number: '18.3'
    text: |-
      Indien van de verstrekking aantekening wordt gehouden en ten tijde van de verstrekking vaststaat dat het doel
      waartoe is verstrekt, noodzaakt tot bekendmaking aan bepaalde derden, wordt hiervan apart aantekening gehouden.
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel18
  - number: '18.4'
    text: |-
      De ingevolge [artikel 16, tweede en derde lid][ref1], en [17, vijfde lid][ref2], vastgelegde gegevens worden
      gedurende twee jaren bewaard. Deze gegevens kunnen slechts met toepassing van de [artikelen 6, vierde lid][ref3],
      of [18, vierde lid, van de wet][ref4] voor een ander doel worden gebruikt dan het toezicht op de naleving van het
      verstrekkingenregime.


      [ref1]: https://wetten.overheid.nl/BWBR0004996#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0004996#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0004798#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0004798#Artikel18
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0004996
        artikel: '16'
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0004996
        artikel: '17'
        paragraaf: '6'
      - id: ref3
        bwb_id: BWBR0004798
        artikel: '6'
      - id: ref4
        bwb_id: BWBR0004798
        artikel: '18'
  - number: '18.5'
    text: |-
      De ingevolge [artikel 13a, zesde lid, van de wet][ref1] vastgelegde gegevens worden gedurende drie jaren bewaard.
      De tweede volzin van het vierde lid is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004798#Artikel13a
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0004798
        artikel: 13a
  - number: '18.6'
    text: |-
      Onze Ministers kunnen nadere regels stellen omtrent de uitvoering van dit artikel, het College bescherming
      persoonsgegevens gehoord.
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel18
  - number: 18a.1
    text: |-
      De op de bijzondere politieregisters betrekking hebbende bepalingen uit de wet en dit besluit zijn, voor zover deze
      registers worden gehouden bij een criminele-inlichtingeneenheid van een bijzondere opsporingsdienst, van toepassing
      op: '- een register met een doelstelling als omschreven in [artikel 1, eerste lid, onder k, van de wet][ref1], en'
        - een register met een doelstelling als omschreven in [artikel 1, eerste lid, onder l, van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004798#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0004798#Artikel1
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel18a
    references:
