        bwb_id: BWBR0004798
        artikel: 13c
  - number: '19'
    text: |-
      Een verzoek om kennisneming door een geregistreerde van de hem betreffende gegevens, is ontvankelijk na betaling
      van een door de beheerder te bepalen bedrag van ten hoogste € 4,50. De beheerder bepaalt de wijze van betaling.
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel19
  - number: '21'
    text: 'Dit besluit kan worden aangehaald als: Besluit politieregisters.'
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel21
