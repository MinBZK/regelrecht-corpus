---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_politieregisters
regulatory_layer: AMVB
publication_date: '2007-09-04'
valid_from: '2004-09-22'
bwb_id: BWBR0004996
url: https://wetten.overheid.nl/BWBR0004996/2004-09-22
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Ministers van Justitie, van Binnenlandse Zaken en van Defensie, van 7 januari 1991,
    Stafafdeling Wetgeving Publiekrecht, nr. 41162/91/6;

    Gelet op de artikelen 1, onder e, 3, 5, tweede lid,6, derde lid, 7, tweede lid, 9, derde lid, 13, eerste en vierde
    lid, 14, onder e, 16, eerste lid, onder c, 17, 18, eerste tot en met derde lid, 19 en 25, eerste lid, van de Wet
    politieregisters (Stb. 1990, 414);

    Gehoord de Registratiekamer (advies van 30 november 1990, nr. WGAG/1990/2);

    De Raad van State gehoord (advies van 8 februari 1991, nr. WO 3.91.0017);

    Gezien het nader rapport van Onze Minister van Justitie, mede namens Onze Ministers van Binnenlandse Zaken en van
    Defensie a.i., van 12 februari 1991, Stafafdeling Wetgeving Publiekrecht, nr. 44995/91/6;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#ArtikelAanhef
articles:
  - number: '1'
    text: In dit besluit wordt verstaan onder
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel1
  - number: 1.a
    text: |-
      de wet: de [Wet politieregisters][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004798
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004798
  - number: 1.b
    text: 'het bevoegd gezag:'
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel1
  - number: 1.b.1°
    text: 'bij de handhaving van de openbare orde en bij de hulpverlening: de burgemeester;'
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel1
  - number: 1.b.2°
    text: 'bij de strafrechtelijke handhaving van de rechtsorde: de officier van justitie;'
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel1
  - number: 1.c
    text: |-
      het Meldpunt Ongebruikelijke Transacties: het meldpunt, bedoeld in
      [artikel 2 van de Wet melding ongebruikelijke transacties][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006331#Artikel2
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006331
        artikel: '2'
  - number: 1.d
    text: |-
      de criminele-inlichtingeneenheid van een bijzondere opsporingsdienst: de als zodanig door Onze Minister van
      Financiën, van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer, van Landbouw, Natuurbeheer en Visserij of
      van Sociale Zaken en Werkgelegenheid, met inachtneming van [artikel 13c, tweede lid, van de wet][ref1], ingerichte
      eenheid.


      [ref1]: https://wetten.overheid.nl/BWBR0004798#Artikel13c
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004798
        artikel: 13c
  - number: '2'
    text: 'De volgende persoonsgegevens zijn antecedenten:'
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel2
  - number: 2.a
    text: |-
      het feit dat een proces-verbaal is opgemaakt van het verhoor van een bepaald persoon ter zake van een strafbaar
      feit waarvoor deze als verdachte is gehoord, daaronder begrepen de aanduiding van de aard van dat strafbare feit;
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel2
  - number: 2.b
    text: |-
      het feit of al dan niet een proces-verbaal als bedoeld onder *a*, is verzonden aan het openbaar ministerie, en zo
      ja, de datum van verzending en het nummer waarmee het proces-verbaal aldaar kan worden geïdentificeerd en
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel2
  - number: 2.c
    text: |-
      de beslissing van het openbaar ministerie of de rechter over de aangelegenheid waarop het proces-verbaal betrekking
      heeft.
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel2
  - number: 2a
    text: |-
      Misdrijven als bedoeld in [artikel 1, eerste lid, onder k, onderdeel 3°, van de wet][ref1] zijn de misdrijven,
      genoemd in de bij dit besluit behorende bijlage.


      [ref1]: https://wetten.overheid.nl/BWBR0004798#Artikel1
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0004798
        artikel: '1'
  - number: '3.1'
    text: |-
      Persoonsgegevens die betrekking hebben op de in [artikel 5, eerste lid, van de wet ][ref1]genoemde kenmerken,
      worden slechts in een register opgenomen indien het reglement dit uitdrukkelijk toelaat.


      [ref1]: https://wetten.overheid.nl/BWBR0004798#Artikel5
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0004798
        artikel: '5'
  - number: '3.2'
    text: Persoonsgegevens met betrekking tot iemands ras, worden slechts opgenomen indien dit onvermijdelijk is
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel3
  - number: 3.2.a
    text: met het oog op diens identificatie;
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel3
  - number: 3.2.b
    text: |-
      voor de juiste beoordeling van een strafbaar feit en zulk een gegeven het slachtoffer of de motieven van de dader
      van dat feit betreft;
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel3
  - number: 3.2.c
    text: met het oog op de verlening van hulp door de politie.
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel3
  - number: '3.3'
    text: |-
      Bij de opneming van een gegeven als bedoeld in het eerste lid, wordt tevens een aanduiding omtrent de
      betrouwbaarheid van het gegeven opgenomen. De aanduiding wordt gegeven door personen die daartoe door de beheerder
      zijn aangewezen.
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel3
  - number: 3a.1
    text: |-
      Het sociaal-fiscaal nummer wordt slechts in een register opgenomen voor zover dit noodzakelijk is voor het
      controleren van de juistheid van gegevens omtrent een staande gehouden of aangehouden verdachte.
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel3a
  - number: 3a.2
    text: |-
      Het sociaal-fiscaal nummer wordt uit een register verwijderd en vernietigd indien opneming niet langer noodzakelijk
      is voor het doel, bedoeld in het eerste lid, en in elk geval na verloop van een maand na de datum van opneming.
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel3a
  - number: '4.1'
    text: |-
      Koppeling is slechts toegestaan van een politieregister met een ander politieregister of met een bestand van het
      Rijk, provincies, gemeenten en andere openbare lichamen met inbegrip van de daaronder ressorterende diensten,
      instellingen en bedrijven.
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel4
  - number: '4.2'
    text: |-
      Koppeling van een tijdelijk register, met een ander register vindt slechts plaats voor zover dit noodzakelijk is
      voor het doel waarvoor het eerstbedoelde register is aangelegd.
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel4
  - number: '5.1'
    text: 'Van een koppeling wordt een proces-verbaal opgemaakt dat zo nauwkeurig mogelijk vermeldt:'
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel5
  - number: 5.1.a
    text: het doel van de koppeling;
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel5
  - number: 5.1.b
    text: de datum van de koppeling;
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel5
  - number: 5.1.c
    text: degeen in wiens opdracht de koppeling plaatsvond;
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel5
  - number: 5.1.d
    text: de bestanden die zijn gekoppeld, alsmede de naam van de beheerder of de houder van die bestanden;
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel5
  - number: 5.1.e
    text: of de koppeling heeft geleid tot nieuwe persoonsgegevens en zo ja, welke;
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel5
  - number: 5.1.f
    text: of de gegevens, bedoeld onder *e*, zijn opgenomen in een register en zo ja, in welk;
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel5
  - number: 5.1.g
    text: eventuele bijzonderheden.
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel5
  - number: '5.2'
    text: |-
      De beheerder bewaart het proces-verbaal gedurende twee jaren op zodanige wijze dat dit desgevraagd onmiddellijk aan
      de daartoe bevoegde organen ter inzage kan worden gegeven.
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel5
  - number: '5.3'
    text: |-
      Bij reglement kan van het eerste lid worden afgeweken voor zover dat onvermijdelijk is met het oog op een goede
      uitvoering van de politietaak.
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel5
  - number: '6.1'
    text: |-
      De personen die technische werkzaamheden verrichten als bedoeld in
      [artikel 7, tweede lid, tweede volzin, van de wet][ref1], komen niet als geregistreerde voor in de registers
      waarvan zij in dat kader kunnen kennisnemen.


      [ref1]: https://wetten.overheid.nl/BWBR0004798#Artikel7
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0004798
        artikel: '7'
  - number: '6.2'
    text: |-
      De beheerder bepaalt vooraf schriftelijk welke personen onder welke voorwaarden de werkzaamheden, bedoeld in het
      eerste lid, kunnen verrichten.
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel6
  - number: '6.3'
    text: Indien de werkzaamheden langs geautomatiseerde weg worden verricht, worden deze vastgelegd.
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel6
  - number: '6.4'
    text: De gegevens die zijn vastgelegd krachtens het tweede en derde lid, worden gedurende twee jaren bewaard.
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel6
  - number: '7.1'
    text: 'Een reglement wordt voor een ieder ter inzage gelegd wanneer het betreft een register bij:'
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel7
  - number: 7.1.a
    text: |-
      het regionale politiekorps: op het hoofdbureau van politie en op de bureaus waar het desbetreffende register wordt
      gevoerd of rechtstreeks toegankelijk is;
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel7
  - number: 7.1.b
    text: |-
      het Korps landelijke politiediensten: bij de voorlichtingsdienst van het Ministerie van Binnenlandse Zaken en
      Koninkrijksrelaties en het betrokken onderdeel;
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel7
  - number: 7.1.c
    text: 'de bijzondere ambtenaren van politie: bij de voorlichtingsdienst van het Ministerie van Justitie;'
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel7
  - number: 7.1.d
    text: |-
      de Koninklijke marechaussee: bij de voorlichtingsdienst van het Ministerie van Defensie, bij de Commandant van de
      Koninklijke marechaussee, bij het Hoofd van de Centrale Justitiële Dienst Koninklijke marechaussee en op de bureaus
      van de districts-commandanten;
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel7
  - number: 7.1.e
    text: |-
      het Meldpunt Ongebruikelijke Transacties: bij de voorlichtingsdienst van het Ministerie van Justitie en ter plaatse
      van de vestiging van het Meldpunt.
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel7
  - number: '7.2'
    text: |-
      Indien de beheerder behoort tot het Rijk, maakt hij het reglement bekend in de *Staatscourant* en doet hij van het
      reglement of het feit van de terinzagelegging mededeling in het *Algemeen Politieblad*.
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel7
  - number: '7.3'
    text: |-
      De beheerder van een regionaal politiekorps maakt het reglement of het feit van de terinzagelegging bekend op een
      in de gemeente waarvan de korpsbeheerder burgemeester is gebruikelijke wijze.
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel7
  - number: '7.4'
    text: |-
      Het reglement met betrekking tot een register mede gemeenschappelijk aan de Koninklijke marechaussee wordt
      bekendgemaakt en ter inzage gelegd op een bij de beslissing krachtens [artikel 1, onder ][ref1] te bepalen wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0004798#Artikel1
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0004798
        artikel: '1'
  - number: '7.5'
    text: |-
      De bekendmaking van het feit van de terinzagelegging van een reglement vermeldt de aard van het register, de datum
      waarop het reglement is vastgesteld en de beheerder, alsmede de plaatsen waar het reglement voor een ieder ter
      inzage is gelegd.
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel7
  - number: '7.6'
    text: |-
      Ten aanzien van een bekendmaking van een wijziging of de intrekking van een reglement zijn het eerste tot en met
      vijfde lid van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel7
  - number: '8.1'
    text: 'Indien wordt besloten tot het aanleggen van een tijdelijk register, wordt daarbij vooraf schriftelijk vastgelegd:'
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel8
  - number: 8.1.a
    text: |-
      het doel van het tijdelijke register met inbegrip van een nauwkeurige omschrijving van het bepaalde geval, zo
      mogelijk aangeduid naar tijd en plaats;
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel8
  - number: 8.1.b
    text: de datum waarop met het aanleggen van het tijdelijke register wordt begonnen.
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel8
  - number: '8.2'
    text: |-
      De beheerder stelt binnen een week nadat is begonnen met het aanleggen van het tijdelijke register, het gezag dat
      verantwoordelijk is voor de uitvoering van de politietaak ten dienste waarvan het is aangelegd, daarvan in kennis,
      tenzij het inmiddels is vernietigd.
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel8
  - number: '8.3'
    text: |-
      De [artikelen 6, tweede lid][ref1], en [9, eerste lid, van de wet][ref2], alsmede
      [artikel 3, eerste lid, van dit besluit][ref3] zijn op het tijdelijke register niet van toepassing gedurende twaalf
      maanden na de datum, bedoeld in het eerste lid, onder *b*. Het bevoegd gezag kan deze termijn één of meer malen
      verlengen voor de duur van ten hoogste zes maanden, indien het doel waarvoor het tijdelijke register is aangelegd
      door de bekendmaking en de terinzagelegging van een reglement ernstig in gevaar zou worden gebracht en de beheerder
      een regeling heeft getroffen met betrekking tot de onderwerpen, bedoeld in [artikel 10 van de wet][ref4]. Van elke
      beslissing tot verlenging wordt melding gemaakt aan het College bescherming persoonsgegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0004798#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0004798#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0004996#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0004798#Artikel10
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004798
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0004798
        artikel: '9'
      - id: ref3
        bwb_id: BWBR0004996
        artikel: '3'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0004798
        artikel: '10'
  - number: '8.4'
    text: |-
      Indien dit uit het doel waarvoor het tijdelijke register is aangelegd, voortvloeit, kan het tijdelijke register
      worden overgedragen aan een andere beheerder of worden samengevoegd met een ander register als bedoeld in het
      eerste lid. Het tweede lid is alsdan van overeenkomstige toepassing met betrekking tot het nieuwe gezag.
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel8
  - number: '8.5'
    text: |-
      Indien het tijdelijke register wordt overgedragen of samengevoegd, wordt de termijn, bedoeld in het derde lid,
      niet geschorst. Bestaat er voor het tijdelijke register een reglement, dan wordt dit dienovereenkomstig aangepast.
      Indien het tijdelijke register wordt overgedragen kan het doel niet worden gewijzigd. Indien het tijdelijke
      register wordt samengevoegd met een ander register kan het doel slechts worden verruimd met toestemming van
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel8
  - number: 8.5.a
    text: |-
      de officier van justitie, indien het betreft een register dat is aangelegd met het oog op de uitvoering van een
      taak onder diens gezag of
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel8
  - number: 8.5.b
    text: |-
      de burgemeester, indien het betreft een register dat is aangelegd met het oog op de uitvoering van een taak onder
      diens gezag.
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel8
  - number: '8.6'
    text: |-
      Bij dringende noodzakelijkheid kan in plaats van de officier van justitie de hulpofficier van justitie en in plaats
      van de burgemeester een door hem schriftelijk aangewezen politie-ambtenaar de toestemming als bedoeld in het vijfde
      lid, geven, onder de verplichting om van de ondernomen handeling onverwijld schriftelijk kennis te geven aan de
      officier van justitie onderscheidenlijk de burgemeester.
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel8
  - number: '8.7'
    text: |-
      Het College bescherming persoonsgegevens wordt van een samenvoeging of een overdracht zo spoedig mogelijk in kennis
      gesteld, onder vermelding van de datum daarvan.
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel8
  - number: '8.8'
    text: |-
      Indien het doel met het oog waarop het tijdelijke register is aangelegd, is bereikt, worden de daarin opgenomen
      persoonsgegevens zo spoedig mogelijk vernietigd voor zover deze geen betekenis hebben voor een eventueel verder
      strafrechtelijk onderzoek in het bepaalde geval als omschreven krachtens het eerste lid, onder *a*, dan wel het
      vijfde of zesde lid.
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel8
  - number: '8.9'
    text: |-
      Van de vernietiging als bedoeld in het achtste lid, wordt een proces-verbaal opgemaakt, dat gedurende twee jaren
      wordt bewaard op zodanige wijze dat dit desgevraagd onmiddellijk aan de daartoe bevoegde organen ter inzake kan
      worden gegeven.
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel8
  - number: '9'
    text: |-
      Aan de volgende ambtenaren worden, in aanvulling op de ambtenaren, bedoeld in [artikel 14, onder ][ref1], gegevens
      uit een register verstrekt voor zover zij deze behoeven ter uitvoering van opdrachten voortvloeiende uit de
      signalering van personen:


      [ref1]: https://wetten.overheid.nl/BWBR0004798#Artikel14
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0004798
        artikel: '14'
  - number: 9.a
    text: ambtenaren van de dienst invoerrechten en accijnzen;
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel9
  - number: 9.b
    text: |-
      ambtenaren van het Ministerie van Buitenlandse Zaken voor zover dit noodzakelijk is met het oog op de uitvoering
      van opdrachten in het buitenland.
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel9
  - number: '10'
    text: 'Antecedenten worden op hun verzoek, voorzover zij deze behoeven voor de uitoefening van hun taak, verstrekt aan:'
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel10
  - number: 10.a
    text: |-
      reclasseringswerkers als bedoeld in [artikel 6 van de Reclasseringsregeling 1995][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007120#Artikel6
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0007120
        artikel: '6'
  - number: 10.b
    text: |-
      personeel, verbonden aan de raad voor de kinderbescherming als bedoeld in
      [artikel 2 van het Organisatiebesluit raad voor de kinderbescherming][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008125#Artikel2
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0008125
        artikel: '2'
  - number: '11.1'
    text: |-
      Een beheerder is bevoegd verstrekking van gegevens uit een politieregister ingevolge de [artikelen 14][ref1] en
      [15, eerste lid, onder b en c, van de wet][ref2] te weigeren indien:


      [ref1]: https://wetten.overheid.nl/BWBR0004798#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0004798#Artikel15
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0004798
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0004798
        artikel: '15'
  - number: 11.1.a
    text: |-
      het gegevens betreft omtrent personen die aan de politie informatie hebben verstrekt omtrent door anderen gepleegde
      of te plegen strafbare feiten;
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel11
  - number: 11.1.b
    text: |-
      het gegevens uit een register betreft waarbij, mede gelet op de bijzondere aard van het register, in geval van
      verstrekking direct gevaar voor de geregistreerde of voor derden zou zijn te duchten.
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel11
  - number: '11.2'
    text: |-
      Verstrekking van gegevens uit een politieregister ingevolge de [artikelen 14][ref1] en
      [15, eerste lid, onder b en c, van de wet][ref2] kan achterwege worden gelaten indien de desbetreffende gegevens
      slechts konden worden verkregen onder de voorwaarde dat deze alleen voor een bepaald doel zouden worden gebruikt
      en de verstrekking een ander doel zou betreffen. Het bestaan van een dergelijke voorwaarde kan slechts worden
      aangenomen indien van de voorwaarde blijkt uit een proces-verbaal en van het bestaan van een dergelijke voorwaarde
      aantekening is gehouden in datzelfde register.


      [ref1]: https://wetten.overheid.nl/BWBR0004798#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0004798#Artikel15
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0004798
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0004798
        artikel: '15'
  - number: '11.3'
    text: |-
      Het eerste en tweede lid vinden slechts toepassing indien dit noodzakelijk is voor de goede uitvoering van de
      politietaak. Bij de verstrekking van de daar bedoelde gegevens kunnen beperkingen aan het gebruik van de gegevens
      worden opgelegd.
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel11
  - number: '12.1'
    text: |-
      Er worden geen gegevens uit een politieregister verstrekt ingevolge de [artikelen 14][ref1] en
      [15, eerste lid, van de wet][ref2], indien de verstrekking een ander doel zou betreffen dan waarvoor het register
      is aangelegd:


      [ref1]: https://wetten.overheid.nl/BWBR0004798#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0004798#Artikel15
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0004798
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0004798
        artikel: '15'
  - number: 12.1.a
    text: |-
      wanneer het register uitsluitend is aangelegd met het oog op de uitvoering van de hulpverleningstaak van de
      politie, tenzij met uitdrukkelijke instemming van de geregistreerde;
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel12
  - number: 12.1.b
    text: 'wanneer het een register bij het Meldpunt Ongebruikelijke Transacties betreft, tenzij:'
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel12
  - number: 12.1.b.1°
    text: |-
      de verstrekking plaatsvindt ten behoeve van de opneming in een register zware criminaliteit of een voorlopig
      register;
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel12
  - number: 12.1.b.2°
    text: uit de gegevens zelf een redelijk vermoeden voortvloeit dat een bepaalde persoon een misdrijf heeft begaan;
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel12
  - number: 12.1.b.3°
    text: |-
      de gegevensverstrekking plaatsvindt op grond van [artikel 15, eerste lid, onder ][ref1], en deze
      gegevens redelijkerwijs van belang kunnen zijn ter voorkoming of opsporing van misdrijven als bedoeld in
      [artikel 1, eerste lid, onder k, van de wet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0004798#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0004798#Artikel1
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0004798
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0004798
        artikel: '1'
  - number: 12.1.b.4°
    text: |-
      de verstrekking plaatsvindt op grond van [artikel 13, derde lid][ref1], en het gegevens betreft die noodzakelijk
      zijn ter opsporing van een misdrijf waardoor de rechtsorde in het verzoekende land ernstig is geschokt.


      [ref1]: https://wetten.overheid.nl/BWBR0004996#Artikel13
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0004996
        artikel: '13'
        paragraaf: '5'
  - number: '12.2'
    text: |-
      Er worden geen gegevens uit een politieregister verstrekt ingevolge de [artikelen 14][ref1] en
      [15, eerste lid, van de wet][ref2] omtrent de uitoefening door de geregistreerde van het recht op kennisneming of
      verbetering ingevolge de [artikelen 20, eerste lid][ref3], onderscheidenlijk [22, eerste lid, van de wet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0004798#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0004798#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0004798#Artikel20
      [ref4]: https://wetten.overheid.nl/BWBR0004798#Artikel22
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0004798
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0004798
        artikel: '15'
      - id: ref3
        bwb_id: BWBR0004798
        artikel: '20'
      - id: ref4
        bwb_id: BWBR0004798
        artikel: '22'
  - number: '12.3'
    text: |-
      Gegevens die betrekking hebben op de in [artikel 5, eerste lid, van de wet ][ref1]genoemde kenmerken, worden
      slechts verstrekt


      [ref1]: https://wetten.overheid.nl/BWBR0004798#Artikel5
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0004798
        artikel: '5'
  - number: 12.3.a
    text: |-
      ingevolge [artikel 14 van de wet][ref1] voor zover dit noodzakelijk is voor de goede uitvoering van de politietaak;


      [ref1]: https://wetten.overheid.nl/BWBR0004798#Artikel14
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0004798
        artikel: '14'
  - number: 12.3.b
    text: |-
      ingevolge [artikel 15, eerste lid][ref1], [16, eerste lid][ref2], en krachtens [artikel 18 van de wet][ref3] voor
      zover dit onvermijdelijk is voor de goede uitvoering van de taak met het oog waarop wordt verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0004798#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0004798#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0004798#Artikel18
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0004798
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0004798
        artikel: '16'
      - id: ref3
        bwb_id: BWBR0004798
        artikel: '18'
  - number: '12.4'
    text: |-
      Bij een verstrekking van gegevens als bedoeld in het derde lid, wordt de daarbij ingevolge
      [artikel 3, derde lid][ref1], opgenomen aanduiding omtrent de betrouwbaarheid vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0004996#Artikel3
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0004996
        artikel: '3'
        paragraaf: '2'
  - number: '13.1'
    text: |-
      Uit een politieregister kunnen gegevens worden verstrekt aan politie-autoriteiten in een ander land indien dit
      noodzakelijk is:
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel13
  - number: 13.1.a
    text: |-
      voor de goede uitvoering van de politietaak in Nederland of voor de uitvoering van opdrachten voortvloeiende uit de
      signalering van personen door Nederlandse autoriteiten;
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel13
  - number: 13.1.b
    text: |-
      ter voorkoming van een ernstig en dreigend gevaar of ter opsporing van een misdrijf waardoor de rechtsorde in dat
      land ernstig is geschokt of
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel13
  - number: 13.1.c
    text: |-
      voor de goede uitvoering van de politietaak in dat land, op grond van een verzoek met betrekking tot een bepaalde
      persoon of een bepaald geval.
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel13
  - number: '13.2'
    text: |-
      In de grensgebieden kunnen gegevens als bedoeld in het eerste lid, aanhef en onder *c*, ook zonder een daartoe
      strekkend verzoek worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel13
  - number: '13.3'
    text: |-
      Uit een politieregister bij het Meldpunt Ongebruikelijke Transacties kunnen gegevens worden verstrekt aan van
      overheidswege aangewezen administratieve of politiële meldpunten in het buitenland die een vergelijkbare taak
      hebben als het meldpunt. Het zevende lid vindt geen toepassing.
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel13
  - number: '13.4'
    text: |-
      Bij de beoordeling van de vraag of gegevens ingevolge het eerste of derde lid zullen worden verstrekt, wordt
      rekening gehouden met de mate waarin waarborgen in het andere land aanwezig zijn met betrekking tot een juist
      gebruik van de verstrekte gegevens en met betrekking tot de bescherming van de persoonlijke levenssfeer.
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel13
  - number: '13.5'
    text: |-
      De gegevens worden steeds verstrekt onder de algemene voorwaarde dat deze slechts zullen worden gebruikt voor het
      doel waarvoor zij zijn verstrekt. De beheerder kan in bijzondere gevallen op verzoek van de buitenlandse politie-
      autoriteiten toestemmen in gebruik voor een ander doel voor zover dit noodzakelijk is voor de goede uitvoering van
      de politietaak in dat land.
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel13
  - number: '13.6'
    text: |-
      Gegevens die betrekking hebben op de in [artikel 5, eerste lid, van de wet ][ref1]genoemde kenmerken, worden
      slechts verstrekt indien dit met het oog op een juiste beantwoording van een door een buitenlandse politie-
      autoriteit gestelde vraag onvermijdelijk is. Daarbij wordt een aanduiding omtrent de betrouwbaarheid van het
      gegeven vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0004798#Artikel5
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0004798
        artikel: '5'
  - number: '13.7'
    text: |-
      De verstrekking vindt plaats door tussenkomst van het Korps landelijke politiediensten. De verstrekking kan echter
      rechtstreeks plaatsvinden overeenkomstig afspraken met politie-autoriteiten in het buitenland, voor zover met deze
      afspraken is ingestemd door:
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel13
  - number: 13.7.a
    text: |-
      Onze Minister van Justitie, indien het gegevens betreft uit een register dat is aangelegd met het oog op de
      uitvoering van een taak onder het gezag van de officier van justitie of
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel13
  - number: 13.7.b
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties, indien het gegevens betreft uit een register dat is
      aangelegd met het oog op de uitvoering van een taak onder het gezag van de burgemeester.
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel13
  - number: '13.8'
    text: |-
      Onverminderd het bepaalde in [artikel 552 ][ref1] worden geen gegevens verstrekt:


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel552
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '552'
  - number: 13.8.a
    text: |-
      wanneer een vermoeden bestaat dat de gegevens zullen worden gebruikt voor een onderzoek, ingesteld met het oogmerk
      een verdachte te vervolgen, te straffen, of op andere wijze te treffen in verband met zijn godsdienstige of
      staatkundige overtuiging, zijn nationaliteit, zijn ras of de groep van de bevolking waartoe hij behoort;
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel13
  - number: 13.8.b
    text: |-
      voor zover het verstrekken van gegevens zou strekken tot het verlenen van medewerking aan een vervolging
      of een berechting welke onverenigbaar is met het aan [artikel 68 van het Wetboek van Strafrecht][ref1] en
      [artikel 255, eerste lid, van het Wetboek van Strafvordering][ref2] ten grondslag liggende beginsel;


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel68
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel255
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '68'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '255'
  - number: 13.8.c
    text: ten behoeve van een onderzoek naar feiten terzake waarvan de verdachte in Nederland wordt vervolgd;
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel13
  - number: 13.8.d
    text: |-
      ten behoeve van een onderzoek naar feiten als bedoeld in [artikel 552][ref1], dan krachtens een overeenkomstig die
      bepaling verleende machtiging van Onze Minister van Justitie.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel552m
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 552m
  - number: '13.9'
    text: |-
      Indien grond bestaat voor het vermoeden, bedoeld in het achtste lid, onder *a*, wordt het verzoek aan Onze Minister
      van Justitie voorgelegd.
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel13
  - number: '13.10'
    text: |-
      Het eerste, tweede en vierde tot en met zevende lid is niet van toepassing op de politie-ambtenaar uit een
      ander land die als contactambtenaar is geplaatst bij, bij enig politiekorps of bij het Wapen der Koninklijke
      marechaussee, voor zover met het land door welke hij is gezonden, daarvan afwijkende afspraken zijn gemaakt waarmee
      Onze Minister van Justitie heeft ingestemd. Aan hem kunnen gegevens worden verstrekt op gelijke voet als aan
      Nederlandse politie-ambtenaren voor zover in overeenstemming met deze afspraken.
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel13
  - number: '13.11'
    text: |-
      Het eerste, tweede en vierde tot en met zevende lid is evenmin van toepassing op de Nederlandse politie-ambtenaar
      of de ambtenaar van de Koninklijke marechaussee die als contactambtenaar of anderszins is gezonden naar het
      buitenland. Aan hem kunnen gegevens worden verstrekt als ware hij in Nederland. Het eerste, tweede, vierde tot
      en met zesde alsmede het achtste, negende en twaalfde lid zijn van toepassing bij de verstrekking van de door hen
      ontvangen gegevens aan politie-autoriteiten in het land waar zij werkzaam zijn.
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel13
  - number: '13.12'
    text: |-
      De [artikelen 11][ref1] en [12][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004996#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0004996#Artikel12
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0004996
        artikel: '11'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0004996
        artikel: '12'
        paragraaf: '5'
  - number: 13a.1
    text: |-
      Aan de politieambtenaar uit een andere lidstaat van de Europese Unie die is toegevoegd aan een gemeenschappelijk
      onderzoeksteam als bedoeld in [artikel 552qa van het Wetboek van Strafvordering][ref1] dat gevestigd is in
      Nederland, kunnen gegevens worden verstrekt op gelijke voet als aan Nederlandse politieambtenaren voor zover zij
      deze behoeven voor de doeleinden waarvoor het gemeenschappelijk onderzoeksteam is ingesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel552qa
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 552qa
  - number: 13a.2
    text: |-
      Aan de politieambtenaar uit een andere lidstaat van de Europese Unie die is toegevoegd aan een gemeenschappelijk
      onderzoeksteam als bedoeld in [artikel 552qa van het Wetboek van Strafvordering][ref1] dat gevestigd is in
      Nederland, kunnen, in de gevallen als bedoeld in [artikel 13d, tweede lid, onder b, en derde lid, van de wet][ref2],
      gegevens worden verstrekt uit een tijdelijk register, met het oog op de gebruikmaking daarvan in die andere
      lidstaat.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel552qa
      [ref2]: https://wetten.overheid.nl/BWBR0004798#Artikel13d
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 552qa
      - id: ref2
        bwb_id: BWBR0004798
        artikel: 13d
  - number: 13a.3
    text: |-
      Aan de Nederlandse politieambtenaar die is toegevoegd aan een gemeenschappelijk onderzoeksteam als bedoeld in
      [artikel 552qa van het Wetboek van Strafvordering][ref1] dat gevestigd is in een andere lidstaat van de Europese
      Unie, kunnen gegevens worden verstrekt met het oog op de gebruikmaking daarvan voor de doeleinden waarvoor het
      gemeenschappelijk onderzoeksteam is ingesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel552qa
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 552qa
  - number: '14.1'
    text: |-
      Gegevens worden desgevraagd uit een politieregister verstrekt, voorzover zij deze behoeven voor een goede
      uitvoering van hun taak, aan
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel14
  - number: 14.1.a
    text: |-
      de personen, anders dan die bedoeld in [artikel 14, onder ][ref1], die bij de politie, het Meldpunt Ongebruikelijke
      Transacties of bij de Koninklijke marechaussee werkzaam zijn ten dienste van de uitvoering van de politietaak, voor
      zover zij daartoe door de desbetreffende beheerder schriftelijk zijn geautoriseerd;


      [ref1]: https://wetten.overheid.nl/BWBR0004798#Artikel14
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0004798
        artikel: '14'
  - number: 14.1.b
    text: |-
      De commissie, bedoeld in [artikel 8 van de Wet schadefonds geweldsmisdrijven][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002979#Artikel8
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002979
        artikel: '8'
  - number: 14.1.c
    text: |-
      de Directeur van de Stichting Centraal Bureau Rijvaardigheidsbewijzen voor zover dit noodzakelijk is met het oog
      op het onderzoek, bedoeld in de [artikelen 101][ref1] en [142 van het Reglement rijbewijzen][ref2], en het betreft
      overtreding van [artikel 6][ref3] of [artikel 8 van de Wegenverkeerswet 1994][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel101
      [ref2]: https://wetten.overheid.nl/BWBR0008074#Artikel142
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0006622#Artikel8
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: '101'
      - id: ref2
        bwb_id: BWBR0008074
        artikel: '142'
      - id: ref3
        bwb_id: BWBR0006622
        artikel: '6'
      - id: ref4
