  - number: '14.2'
    text: |-
      In aanvulling op de verstrekking als bedoeld in het eerste lid worden uit een register zware criminaliteit
      desgevraagd gegevens verstrekt aan de personen of instanties, genoemd in het eerste lid, onder a, f, g, h, l, p,
      q, r, u en w, in de in die onderdelen aangegeven gevallen, voorzover zij deze behoeven voor een goede uitvoering
      van hun taak, en aan de personen, genoemd in het eerste lid, onder aa, in de in die onderdelen aangegeven
      gevallen, voorzover zij deze behoeven voor het verrichten van dreigings- en risico-evaluaties en het vaststellen
      van bewakings- en beveiligingsopdrachten en adviezen door de evaluatiedriehoek, met het oog op het bewaken en
      beveiligen van personen, objecten en diensten.
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel14
  - number: '14.3'
    text: |-
      Uit een politieregister worden gegevens verstrekt aan het Meldpunt Ongebruikelijke Transacties, voor zover het die
      behoeft voor een goede uitvoering van zijn taak.
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel14
  - number: '14.4'
    text: |-
      Uit een politieregister kunnen gegevens worden verstrekt aan de gemeentelijke basisadministratie persoonsgegevens
      met het oog op de signalering van veranderingen in de gegevens die in die basisadministratie zijn opgenomen.
    url: https://wetten.overheid.nl/BWBR0004996/2004-09-22#Artikel14
  - number: '14.5'
    text: Aan de machtiging, bedoeld in het eerste lid, onder i, kunnen voorschriften en beperkingen worden verbonden.
