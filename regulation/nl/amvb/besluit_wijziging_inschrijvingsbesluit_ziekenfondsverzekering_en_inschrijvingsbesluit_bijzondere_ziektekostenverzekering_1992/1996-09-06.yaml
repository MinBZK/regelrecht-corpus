preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Volksgezondheid, Welzijn en Sport van 18 juni 1996, VPZ/V-96978;

    Gelet op artikel 5, tweede lid, van de Ziekenfondswet en de artikelen 6, zevende lid, en 9, derde lid, van de
    Algemene Wet Bijzondere Ziektekosten;

    Gezien het advies van de Ziekenfondsraad van 28 september 1995, kenmerk VERZ/39381/95;

    De Raad van State gehoord (advies van 30 juni 1996, nummer W13.96 0250);

    Gezien het nader rapport van Onze Minister van Volksgezondheid, Welzijn en Sport van 14 augustus 1996, VPZ/V-
    961784;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0008206/1996-09-06#ArtikelAanhef
articles:
  - number: III
    text: |-
      1 De inschrijving van een verzekerde die op het tijdstip van inwerkingtreding van dit besluit als verzekerde in de
      zin van de [Ziekenfondswet][ref1] bij een ziekenfonds staat ingeschreven, wordt geacht tot stand te zijn gekomen
      met ingang van 1 januari 1996.

      2 De verzekerde die op 31 december 1995 als verzekerde in de zin van de [Ziekenfondswet][ref2] bij een ziekenfonds
      staat ingeschreven, en die op grond van het [Inschrijvingsbesluit ziekenfondsverzekering][ref3], zoals dat luidde
      vóór de inwerkingtreding van dit besluit de inschrijving in 1996 zou kunnen beëindigen, kan de inschrijving tot en
      met 31 december 1996 beëindigen.

      3 De inschrijving van een verzekerde die op het tijdstip van inwerkingtreding van dit besluit als verzekerde
      in de zin van de [Algemene Wet Bijzondere Ziektekosten][ref4] staat ingeschreven bij een ziekenfonds, een
      ziektekostenverzekeraar of een uitvoerend orgaan, wordt geacht tot stand te zijn gekomen met ingang van 1 januari
      1996.

      4 De persoon, bedoeld in [artikel 9, tweede lid, van de Algemene Wet Bijzondere Ziektekosten][ref5], die op 31
      december 1995 bij een ziekenfonds dan wel bij een ziektekostenverzekeraar staat ingeschreven, en die op grond van
      het [Inschrijvingsbesluit bijzondere ziektekostenverzekering 1992][ref6], zoals dat luidde vóór de inwerkingtreding
      van dit besluit, de inschrijving in 1996 zou kunnen beëindigen, kan de inschrijving tot en met 31 december 1996
      beëindigen.


