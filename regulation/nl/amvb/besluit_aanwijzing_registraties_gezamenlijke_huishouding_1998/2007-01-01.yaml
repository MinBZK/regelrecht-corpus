      Dit besluit is van toepassing op registraties in de zin van:

      a. [artikel 3, vierde lid, onderdeel d, van de WWB][ref1];

      b. [artikel 3, vierde lid, onderdeel d, van de ANW][ref2];

      c. [artikel 1, vijfde lid, onderdeel d, van de AOW][ref3];

      d. [artikel 3, vierde lid, onderdeel d, van de IOAW][ref4];

      e. [artikel 3, vierde lid, onderdeel d, van de IOAZ][ref5];

      f. [artikel 1, vijfde lid, onderdeel d, van de TW][ref6];

      g. [artikel 1, vijfde lid, onderdeel d, van de WAJONG][ref7];

      h. [artikel 1, vijfde lid, onderdeel d, van de WAO][ref8];

      i. [artikel 1, vijfde lid, onderdeel d, van de WAZ][ref9];

      j. [artikel 2, vierde lid, onderdeel d, van de Wet WIA][ref10];

      k. [artikel 1, vijfde lid, onderdeel d, van de Wmo][ref11];

      l. [artikel 1, vijfde lid, onderdeel d, van de ZW][ref12]; en

      m. [artikel 2, vierde lid, onderdeel d, van de WWIK][ref13].


