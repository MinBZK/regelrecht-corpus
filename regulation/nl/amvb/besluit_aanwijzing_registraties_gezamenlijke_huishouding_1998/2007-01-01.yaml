  - number: '5'
    text: |-
      Voor de toepassing van artikel 3, tweede tot en met zesde lid, van de ANW wordt voor de vaststelling van het recht
      op nabestaandenuitkering een registratie als bedoeld in [artikel 3][ref1] in aanmerking genomen indien deze:

      a. bestaat op de dag van overlijden van degene met wie een gezamenlijke huishouding wordt gevoerd dan wel in de
      periode van twee jaar voorafgaande aan deze dag op enig moment heeft bestaan;

      b. plaatsvindt gedurende de verlening van nabestaandenuitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0009280#Artikel3
    url: https://wetten.overheid.nl/BWBR0009280/2007-01-01#Artikel5
