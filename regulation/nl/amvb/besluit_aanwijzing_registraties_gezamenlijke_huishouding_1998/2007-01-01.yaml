  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op voordracht van de Staatssecretaris van Sociale Zaken en Werkgelegenheid van 13 november 1997, Directie Sociale
    Verzekeringen, nr. SV/AVF/97/4557;

    Gelet op artikel 3, vijfde lid, van de Algemene bijstandswet, artikel 3, vijfde lid, van de Algemene
    nabestaandenwet, artikel 1, zesde lid, van de Algemene Ouderdomswet, artikel 1, zesde lid, van de
    Coördinatiewet Sociale Verzekering, artikel 3, vijfde lid, van de Wet inkomensvoorziening oudere en gedeeltelijk
    arbeidsongeschikte werkloze werknemers, artikel 3, vijfde lid, van de Wet inkomensvoorziening oudere en
    gedeeltelijk arbeidsongeschikte gewezen zelfstandigen, artikel 1, zesde lid, van de Toeslagenwet, artikel 1,
    zesde lid, van de Wet arbeidsongeschiktheidsvoorziening jongehandicapten, artikel 1, zesde lid, van de Wet
    op de arbeidsongeschiktheidsverzekering, artikel 1, zesde lid, van de Wet arbeidsongeschiktheidsverzekeringen
    zelfstandigen, artikel 1, zesde lid, van de Wet voorzieningen gehandicapten en artikel 1, zesde lid, van de
    Ziektewet;

    De Raad van State gehoord (advies van 17 december 1997, nr. W12.97.0732);

    Gezien het nader rapport van de Staatssecretaris van Sociale Zaken en Werkgelegenheid van 18 december 1997,
    Directie Sociale Verzekeringen, nr. SV/AVF/97/5412;

    Hebben goedgevonden en verstaan:
