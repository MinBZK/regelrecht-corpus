    text: |-
      In dit besluit wordt verstaan onder:

      a. WWB: [Wet werk en bijstand][ref1];

      b. ANW: [Algemene nabestaandenwet][ref2];

      c. AOW: [Algemene Ouderdomswet][ref3];

      d. IOAW: [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref4];

      e. IOAZ: [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref5];

      f. TW: [Toeslagenwet][ref6];

      g. WAJONG: [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref7];

      h. WAO: [Wet op de arbeidsongeschiktheidsverzekering][ref8];

      i. WAZ: [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref9];

      j. Wet WIA: [Wet werk en inkomen naar arbeidsvermogen][ref10];

      k. Wmo: [Wet maatschappelijke ondersteuning][ref11];

      l. ZW: [Ziektewet][ref12];

      m. WWIK: [Wet werk en inkomen kunstenaars][ref13].


