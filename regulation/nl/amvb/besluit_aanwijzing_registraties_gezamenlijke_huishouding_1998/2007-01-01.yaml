  - number: '4'
    text: |-
      Voor de toepassing van [artikel 3, tweede tot en met vijfde lid, van de WWB][ref1],
      [artikel 1, derde tot en met zevende lid, van de AOW][ref2],
      [artikel 3, tweede tot en met zesde lid, van de IOAW][ref3],
      [artikel 3, tweede tot en met zesde lid, van de IOAZ][ref4],
      [artikel 1, derde tot en met zevende lid, van de TW][ref5],
      [artikel 1, derde tot en met zevende lid, van de WAJONG][ref6],
      [artikel 1, derde tot en met zevende lid, van de WAO][ref7],
      [artikel 1, derde tot en met zevende lid, van de WAZ][ref8],
      [artikel 2, tweede tot en met zesde lid, van de Wet WIA][ref9],
      [artikel 1, derde tot en met zevende lid, van de Wmo][ref10],
      [artikel 1, derde tot en met zevende lid, van de ZW][ref11] en
      [artikel 2, tweede tot en met vierde lid, van de WWIK][ref12] wordt een registratie als bedoeld in
      [artikel 3][ref13] in aanmerking genomen indien deze:

      a. bij de aanvraag van bijstand, uitkering of voorziening bestaat;

      b. in een periode van twee jaar voorafgaand aan de aanvraag van bijstand, uitkering of voorziening op enig moment
      heeft bestaan; dan wel

      c. gedurende de verlening van bijstand, uitkering of voorziening plaatsvindt.


