  - number: '3'
    text: |-
      1 Als registraties als bedoeld in [artikel 2][ref1] worden aangewezen de registratie als:

      a. duurzame gezamenlijke huishouding op grond van:

      1. de [Algemene Wet Bijzondere Ziektekosten][ref2];

      2. de [Wet inkomstenbelasting 2001][ref3];

      3. de [Wet op de loonbelasting 1964][ref4];

      4. de [Wet op de studiefinanciering][ref5];

      4a. de [Wet studiefinanciering 2000][ref6];

      5. de [Wet uitkeringen burger-oorlogsslachtoffers 1940-1945][ref7];

      6. de [Wet uitkeringen vervolgingsslachtoffers 1940-1945][ref8].

      b. gezamenlijke huishouding op grond van:

      1. de [WWB][ref9];

      2. de [ANW][ref10];

      3. de [AOW][ref11];

      4. de [IOAW][ref12];

      5. de [IOAZ][ref13];

      6. de [TW][ref14];

      7. de [WAJONG][ref15];

      8. de [WAO][ref16];

      9. de [WAZ][ref17];

      10. de [Wet WIA][ref18];

      11. de [Wmo][ref19];

      12. de [ZW][ref20];

      13. de [WWIK][ref21].

      c. duurzame gemeenschappelijke huishouding op grond van de
      [onderafdeling 3 van afdeling 5 van titel 4 van Boek 7 van het Burgerlijk Wetboek][ref22];

      d. gemeenschappelijke huishouding op grond van:

      1. de [Successiewet 1956][ref23];

      2. een verblijfsrecht ingevolge de [Vreemdelingenwet 2000][ref24] voor verblijf bij partner;

      e. duurzame relatie op grond van de [Rijkswet op het Nederlanderschap][ref25].

      2 Een registratie als bedoeld in het eerste lid is aanwezig gedurende de periode waarin bij de toepassing van
      de in dat lid genoemde wetten op enig moment rechtsgevolgen worden verbonden aan het bestaan van een duurzame
      gezamenlijke huishouding, een gezamenlijke huishouding, een duurzame gemeenschappelijke huishouding, een
      gemeenschappelijke huishouding respectievelijk een duurzame relatie.


