  - number: '6'
    text: |-
      Dit besluit treedt in werking met ingang van de dag waarop de artikelen XVII tot en met XXXII van het
      bij koninklijke boodschap van 29 september 1997 ingediende voorstel van wet houdende nadere wijziging
      van een aantal socialeverzekeringswetten en enige andere wetten, houdende wijziging/intrekking van de
      [Wet Werkloosheidsvoorziening][ref1], eenvormige definiëring van de term gezamenlijke huishouding en technische
      alsmede enige andere wijzigingen ([Veegwet SZW 1997][ref2]; kamerstukken 25 641) in werking treden.


      [ref1]: https://wetten.overheid.nl/BWBR0002470
      [ref2]: https://wetten.overheid.nl/BWBR0009279
    url: https://wetten.overheid.nl/BWBR0009280/2015-01-01#Artikel6
