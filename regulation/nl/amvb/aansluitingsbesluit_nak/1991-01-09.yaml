preamble:
  text: >-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.


    Op de voordracht van Onze Minister van Landbouw en Visserij van 15 februari 1967, no. J. 505, Directie Juridische
    en Bedrijfsorganisatorische Zaken;


    Gelet op artikel 87, eerste lid, van de Zaaizaad- en Plantgoedwet;


    De Raad van State gehoord (advies van 8 maart 1967, no. 50);


    Gezien het nader rapport van Onze voornoemde Minister van 29 maart 1967, No. J. 809, Directie Juridische en
    Bedrijfsorganisatorische Zaken;


    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0002567/1991-01-09#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Het bedrijfsmatig voortbrengen, bewaren en bewerken van teeltmateriaal van de in het tweede en derde lid genoemde
      gewassen, anders dan voor gebruik in eigen bedrijf alsmede het doen verrichten van deze handelingen, is slechts
      toegestaan aan hem, die is aangesloten bij de Stichting Nederlandse Algemene Keuringsdienst voor zaaizaad en
      pootgoed van landbouwgewassen, gevestigd te Ede, hierna te noemen NAK.

      2 De in het eerste lid bedoelde landbouwgewassen zijn de gewassen waarvoor een gemeenschappelijke rassenlijst van
      landbouwgewassen ingevolge artikel 1 van de [Richtlijn 70/457/EEG](31970L0457), betreffende de gemeenschappelijke
      rassenlijst voor landbouwgewassen van de Raad van de Europese Gemeenschappen van 29 september 1970 (*PbEG* L 125)
      bestaat.

      3 Onder de in het eerste lid bedoelde landbouwgewassen worden tevens begrepen de onder I vermelde gewassen, voor
      zover behorend tot de daarachter onder II vermelde botanische soorten:








                    I


                    II




                    fakkelgras


                    Koeleria Cristata
    url: https://wetten.overheid.nl/BWBR0002567/1991-01-09#Artikel1
  - number: '2'
    text: |-
      1 Dit Besluit kan worden aangehaald als "Aansluitingsbesluit N.A.K.".

      2 Het treedt in werking met ingang van het tijdstip, waarop de [Zaaizaad- en Plantgoedwet][ref1] in werking treedt.


