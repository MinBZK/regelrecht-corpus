  - number: III
    text: |-
      Dit besluit treedt in werking met ingang van 1 juli 2022. Indien het Staatsblad waarin dit besluit wordt geplaatst,
      wordt uitgegeven na 30 juni 2022, treedt het in werking met ingang van de dag na de datum van uitgifte van het
      Staatsblad waarin het wordt geplaatst, en werkt het terug tot en met 1 juli 2022.
