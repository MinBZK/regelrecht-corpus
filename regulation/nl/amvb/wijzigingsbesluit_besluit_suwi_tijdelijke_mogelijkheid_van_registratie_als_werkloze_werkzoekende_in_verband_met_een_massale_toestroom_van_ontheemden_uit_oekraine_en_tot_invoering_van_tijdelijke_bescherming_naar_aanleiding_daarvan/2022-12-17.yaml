articles:
  - number: II
    text: |-
      1 Voor de werking van [artikel 3.1, eerste lid, onderdeel d, van het Besluit SUWI][ref1], worden beschouwd als
      vreemdeling als bedoeld in dat artikel:

      a. een onderdaan van Oekraïne;

      b. staatlozen en onderdanen van andere derde landen dan Oekraïne die kunnen aantonen dat zij op 23 februari 2022 in
      Oekraïne internationale of nationale bescherming genoten;

      c. staatlozen en onderdanen van andere derde landen dan Oekraïne die kunnen aantonen dat zij op 23 februari 2022 in
      het bezit waren van een geldige permanente verblijfsvergunning die overeenkomstig Oekraïens recht is afgegeven;

      d. staatlozen en onderdanen van andere derde landen dan Oekraïne die kunnen aantonen dat zij op 23 februari 2022
      in het bezit waren van een geldige tijdelijke verblijfsvergunning die overeenkomstig Oekraïens recht is afgegeven
      en die vóór 19 juli 2022 waren ingeschreven in de Basisregistratie Personen of zich vóór 19 juli 2022 hadden gemeld
      bij de gemeente voor inschrijving in de Basisregistratie Personen.

      2 Het eerste lid is van toepassing tot en met 31 augustus 2022.

      3 De periode, bedoeld in het tweede lid, kan bij ministeriële regeling steeds worden verlengd voor een periode van
      maximaal drie maanden, indien dit noodzakelijk is in verband met de uitvoering.


      [ref1]: https://wetten.overheid.nl/BWBR0013267#Artikel3.1
