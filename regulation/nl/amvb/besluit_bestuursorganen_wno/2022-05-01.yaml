preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister-President, Minister van Algemene Zaken van 15 april 1998, 98M003527, gedaan mede
    namens de Staatssecretaris van Binnenlandse Zaken, mr. J. Kohnstamm;

    Gelet op artikel 1a, eerste lid, onderdeel e, en tweede lid, van de Wet Nationale ombudsman onderscheidenlijk
    artikel 1a, eerste lid, onderdeel d, en tweede lid, van de Wet openbaarheid van bestuur;

    De Raad van State gehoord (advies van 10 juli 1998, nr. W01.98.0149);

    Gezien het nader rapport van Onze Minister-President, Minister van Algemene Zaken, van 8 september 1998, 98M007702,
    uitgebracht mede namens Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0009896/2022-05-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Als bestuursorgaan als bedoeld in [artikel 1a, eerste lid, onderdeel e, van de Wet Nationale ombudsman][ref1],
      zijn uitgezonderd:


      [ref1]: https://wetten.overheid.nl/BWBR0003372#Artikel1a
    url: https://wetten.overheid.nl/BWBR0009896/2022-05-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003372
        artikel: 1a
  - number: 1.a
    text: |-
      de Nederlandse Omroep Stichting, genoemd in [artikel 16 van de Mediawet][ref1], voor zover belast met andere
      werkzaamheden dan welke voortvloeien uit onderscheidenlijk verband houden met de coördinatie van de programma's
      van de instellingen die zendtijd hebben gekregen voor landelijke omroep, onderscheidenlijk met het indelen van de
      zendtijd van de instellingen die zendtijd hebben verkregen voor de landelijke omroep;


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel16
    url: https://wetten.overheid.nl/BWBR0009896/2022-05-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '16'
  - number: 1.b
    text: |-
      de Nederlandsche Bank N.V., voor zover belast met de werkzaamheden die voortvloeien uit dan wel verband houden
      met haar taken op grond van de [artikelen 2, eerste, tweede en derde lid][ref1], en [3 van de Bankwet 1998][ref2],
      en haar taken en bevoegdheden ingevolge [artikel 4, eerste lid, van de Bankwet 1998][ref3], de
      [Pensioenwet][ref4], de [Wet verplichte beroepspensioenregeling][ref5], de [Wet op het notarisambt][ref6],
      de [Wet financiële markten BES][ref7] en de [Wet op het financieel toezicht][ref8], alsmede,
      voor zover nog van toepassing op grond van de [artikelen 2a][ref9], [5][ref10], [8][ref11],
      [17][ref12], [18][ref13], [19][ref14], [20a][ref15], [22][ref16], [25a][ref17], [46][ref18] en
      [49 van de Invoerings- en aanpassingswet Pensioenwet][ref19], de [Pensioen- en spaarfondsenwet][ref20] en de
      [Wet verplichte beroepspensioenregeling][ref21] zoals deze luidden op 31 december 2006;


