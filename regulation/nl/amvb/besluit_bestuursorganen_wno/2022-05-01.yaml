    text: |-
      Als bestuursorgaan als bedoeld in [artikel 1a, eerste lid, onderdeel e, van de Wet Nationale ombudsman][ref1]
      zijn uitgezonderd: regionale commissies voor de toetsing van meldingen van
      gevallen van levensbeëindiging op verzoek en hulp bij zelfdoding als bedoeld in
      [artikel 3 van de Wet toetsing levensbeëindiging op verzoek en hulp bij zelfdoding][ref2], voor zover het betreft
      beoordelingen op grond van [artikel 8, eerste lid, van die wet][ref3].


