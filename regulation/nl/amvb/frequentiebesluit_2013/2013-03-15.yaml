  - number: '15'
    text: |-
      1 Uiterlijk negen weken na ontvangst van een aanvraag die voldoet aan het bepaalde op grond van
      [artikel 14, eerste lid][ref1], maakt Onze Minister in de Staatscourant bekend:

      a. de ontvangst van de aanvraag en de frequentieband waarop deze aanvraag betrekking heeft;

      b. de aanvang van de termijn van zes weken voor het indienen van aanvragen om verlening van een vergunning voor het
      gebruik van dezelfde frequentieband;

      c. voor zover dit redelijkerwijs mogelijk is, de voorschriften en beperkingen die aan een vergunning voor het
      gebruik van de betreffende frequentieband zullen worden verbonden.

      2 Het op grond van [artikel 14][ref2] bepaalde is mede van toepassing op aanvragen als bedoeld in het eerste lid,
      onderdeel b.


      [ref1]: https://wetten.overheid.nl/BWBR0032895#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0032895#Artikel14
