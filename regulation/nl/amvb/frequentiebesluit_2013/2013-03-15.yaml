    text: |-
      1 Bij ministeriële regeling kunnen categorieën radiozendapparaten worden aangewezen ten aanzien waarvan voor het
      gebruik van frequentieruimte geen vergunning is vereist en geen meldingsplicht geldt.

      2 De aanwijzing van categorieën radiozendapparaten, bedoeld in het eerste lid, kan uitsluitend geschieden voor
      zover het radiozendapparaten betreft, die geen of vrijwel geen storing of belemmering veroorzaken in elektrische of
      elektronische apparaten, die geen radiozendapparaten zijn.

      3 Met betrekking tot het gebruik als bedoeld in het eerste lid kunnen bij ministeriële regeling regels worden
      gesteld:

      a. inzake de doelmatigheid van het gebruik;

      b. inzake de aard van de radiozendapparaten en de daarbij behorende antenne-inrichtingen alsmede het vermogen
      waarmee mag worden uitgezonden;

      c. ter uitvoering van verplichtingen die voorvloeien uit verdragen of uit bindende besluiten van volkenrechtelijk
      organisaties aangaande het gebruik van frequentieruimte.
    url: https://wetten.overheid.nl/BWBR0032895/2013-03-15#Artikel2
  - number: '3'
    text: |-
      1 Bij ministeriële regeling kunnen categorieën radiozendapparaten worden aangewezen ten aanzien waarvan voor het
      gebruik van frequentieruimte, behoudens een meldingsplicht, geen vergunning is vereist.

      2 Met betrekking tot het gebruik als bedoeld in het eerste lid kunnen bij ministeriële regeling regels worden
      gesteld inzake:

      a. het door de gebruiker beschikbaar houden van bescheiden;

      b. het veroorzaken van belemmeringen in radiozend- of ontvangapparaten of in elektrische of elektronische
      inrichtingen door het gewenste signaal van een radiozendapparaat.

      3 [Artikel 2, derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0032895#Artikel2
    url: https://wetten.overheid.nl/BWBR0032895/2013-03-15#Artikel3
