  - number: '6'
    text: |-
      Ingeval van een procedure voor de verlening van een vergunning als bedoeld in
      [artikel 3.10, eerste lid, van de wet][ref1] kan bij ministeriële regeling frequentieruimte voor een categorie
      van aanvragers worden gereserveerd. Daarbij kan een maximale hoeveelheid gereserveerde frequentieruimte worden
      vastgesteld die een aanvrager in de procedure kan verwerven.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3.10
