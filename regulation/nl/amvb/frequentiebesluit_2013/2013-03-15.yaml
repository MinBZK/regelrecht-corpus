preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Minister van Economische Zaken, Landbouw en Innovatie van 21 juni 2011, nr. WJZ / 11081232;

    Gelet op de artikelen 3.4, derde lid, 3.9, 3.16, eerste lid, 3.17, eerste tot en met derde lid, 3.22, vierde
    lid, 3.23, tweede tot en met vierde lid, 3.24, eerste lid, 3.25, eerste lid, 10.8, 13.4, 16.1 en 18.12 van de
    Telecommunicatiewet, artikel 1.2, tweede lid, van de Wet luchtvaart en de artikelen 19, eerste lid, en 64 van de
    Zeevaartbemanningswet;

    De Afdeling advisering van de Raad van State gehoord (advies van 15 september 2011, nr. W 15.11.0235/IV);

    Gezien het nader rapport van de Minister van Economische Zaken van 5 februari 2013, nr. WJZ / 12048871;

    Hebben goedgevonden en verstaan:
