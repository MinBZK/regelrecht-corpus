  - number: '12'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld omtrent de indiening van de aanvraag om een vergunning
      en omtrent de inhoud van de aanvraag en de daarbij te overleggen gegevens. Deze regels kunnen per te verlenen
      vergunning verschillen.
    url: https://wetten.overheid.nl/BWBR0032895/2013-03-15#Artikel12
  - number: '13'
    text: |-
      1 In het geval de verlening van een vergunning betrekking heeft op frequentieruimte die is bestemd voor het
      aanbieden van openbare elektronische communicatienetwerken of openbare elektronische communicatiediensten beslist
      Onze Minister op een aanvraag om verlening van de vergunning binnen zes weken na ontvangst van de aanvraag.

      2 Van de termijn, genoemd in het eerste lid, kan worden afgeweken indien internationale frequentie- en
      satellietcoördinatie op grond van het Internationale Telecommunicatieverdrag daartoe noopt.
    url: https://wetten.overheid.nl/BWBR0032895/2013-03-15#Artikel13
  - number: '14'
    text: |-
      1 Bij ministeriële regeling worden regels gesteld omtrent:

      a. de indiening van een aanvraag om verlening van een vergunning voor het gebruik van frequentieruimte als bedoeld
      in [artikel 3.10, eerste lid, onderdeel b, van de wet][ref1];

      b. de inhoud van de aanvraag en de daarbij te overleggen gegevens;

      c. de eisen waaraan de aanvrager moet voldoen.

      2 De in het eerste lid, onderdeel c, bedoelde eisen kunnen slechts betrekking hebben op de:

      a. rechtsvorm van de aanvrager;

      b. financiële positie van de aanvrager;

      c. kennis en ervaring van de aanvrager;

      d. technische middelen waarover de aanvrager kan beschikken;

      e. hoedanigheid van de aanvrager als commerciële omroep;

      f. door de aanvrager te leveren bijdrage aan de overgang van analoge naar digitale techniek.

      3 Voor zover dat op dat moment reeds mogelijk is, stelt Onze Minister bij het besluit om
      vergunningen in een bepaalde frequentieband te verlenen met toepassing van de procedure bedoeld in
      [artikel 3.10, eerste lid, onderdeel b, van de wet][ref2], tevens de voorschriften en beperkingen vast die aan de
      vergunning zullen worden verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3.10
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel3.10
