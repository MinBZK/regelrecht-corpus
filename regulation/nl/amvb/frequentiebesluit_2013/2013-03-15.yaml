  - number: '17'
    text: |-
      1 De aan een vergunning te verbinden voorschriften en beperkingen kunnen slechts betrekking hebben op:

      a. het doelmatig gebruik van de toegewezen frequentieruimte;

      b. de aard van de radiozendapparaten en de daarbij behorende antenne-inrichtingen alsmede het vermogen waarmee mag
      worden uitgezonden;

      c. bescheiden die de vergunninghouder ter beschikking moet houden;

      d. verplichtingen die voortvloeien uit de toezeggingen die de vergunninghouder in het kader van een vergelijkende
      toets of een veiling heeft gedaan, ook indien slechts één aanvrager aan de bij of krachtens de wet gestelde eisen
      voldoet;

      e. het veroorzaken van belemmeringen in radiozend- of ontvangapparaten of in elektrische of elektronische
      inrichtingen door het gewenste signaal van een radiozendapparaat;

      f. het waarborgen van de in [artikel 9, derde lid][ref1], bedoelde belangen;

      g. de diensten die moeten worden aangeboden, het soort elektronisch communicatienetwerk dat moet worden aangeboden
      of de technologie die moet worden gebruikt;

      h. de naleving van verplichtingen die voortvloeien uit verdragen of uit bindende besluiten van volkenrechtelijke
      organisaties betreffende het gebruik van radiofrequenties of posities in de ruimte;

      i. de identificatie van het zendapparaat door middel van een daartoe bij de vergunningverlening toe te kennen
      combinatie van letters of cijfers.

      2 De in het eerste lid, onderdeel a, bedoelde voorschriften en beperkingen kunnen onder meer betrekking hebben op
      de termijn waarop en het geografisch gebied waarbinnen de in het eerste lid, onderdeel g, bedoelde diensten moeten
      worden aangeboden.

      3 Indien samenwerking tussen vergunninghouders noodzakelijk is om gewijzigde of nieuw toegekende frequentieruimte
      in gebruik te kunnen nemen met behoud van continuïteit van dienstverlening, kunnen de in het eerste lid, onderdeel
      a, bedoelde voorschriften en beperkingen onder meer bestaan uit een verplichting voor deze vergunninghouders om
      binnen een bepaalde termijn een overeenkomst te sluiten over deze samenwerking.

      4 Onze Minister kan op verzoek van een van de houders van een vergunning bedoeld in het derde lid of uit eigen
      beweging, voorschriften geven met betrekking tot de wijze waarop de overeenkomst tot stand moet komen. De
      vergunninghouders houden zich aan de door Onze Minister gegeven voorschriften.

      5 Indien op een of meer onderdelen van de overeenkomst bedoeld in het derde lid geen overeenstemming van alle bij
      dat onderdeel of die onderdelen betrokken vergunninghouders dreigt te worden bereikt, kan Onze Minister op verzoek
      of uit eigen beweging een dwingende aanwijzing geven. De vergunninghouders zijn bij het sluiten van de overeenkomst
      gebonden aan de aanwijzing.


      [ref1]: https://wetten.overheid.nl/BWBR0032895#Artikel9
