        bwb_id: BWBR0009950
        artikel: '3.16'
  - number: '11'
    text: |-
      1 Bij ministeriële regeling kunnen eisen worden gesteld waaraan de aanvrager moet voldoen om in aanmerking te komen
      voor een vergunning. Deze eisen kunnen slechts inhouden dat:

      a. de aanvrager een bepaalde leeftijd heeft bereikt;

      b. de aanvrager met goed gevolg een voor het gebruik van de gevraagde frequentieruimte, in samenhang met het doel
      waarvoor die frequentieruimte wordt gebruikt, vereist examen heeft afgelegd;

      c. de aanvrager in het bezit is van een certificaat van bediening;

      d. de aanvrager een redelijk belang heeft bij het voorgenomen gebruik van de gevraagde frequentieruimte.

      2 [Artikel 4, tweede lid][ref1], is van overeenkomstige toepassing.

      3 Voor zover de aard, de omvang of het maatschappelijk belang van de vergunning daartoe naar het oordeel van Onze
      Minister aanleiding geeft, kunnen naast de eisen genoemd in het eerste lid bij ministeriële regeling tevens de
      eisen worden gesteld bedoeld in [artikel 9, tweede en derde lid][ref2], en kunnen voorts regels worden gesteld in
      het belang van een evenwichtige verdeling dan wel een doelmatig gebruik van frequentieruimte.


      [ref1]: https://wetten.overheid.nl/BWBR0032895#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0032895#Artikel9
