  - number: '16'
    text: |-
      1 Uiterlijk negen weken na de uiterste ontvangstdatum, bedoeld in [artikel 15, eerste lid, onderdeel b][ref1],
      neemt Onze Minister:

      a. een besluit omtrent de verlening van een vergunning voor het gebruik van frequentieruimte indien de totale
      omvang van de aangevraagde frequentieruimte kleiner is dan of gelijk is aan de beschikbare frequentieruimte binnen
      het betreffende frequentie- en geografische bereik of

      b. het besluit dat de vergunning wordt verleend door middel van een veiling indien de totale omvang van de
      aangevraagde frequentieruimte groter is dan de beschikbare frequentieruimte binnen het frequentie- en geografische
      bereik.

      2 Bij ministeriële regeling worden regels gesteld omtrent de wijze waarop de verlening, bedoeld in het eerste lid,
      onderdeel a, en de veiling, bedoeld in het eerste lid, onderdeel b, plaatsvindt.

      3 In geval van verlening van een vergunning door middel van een veiling als bedoeld in het eerste lid, onderdeel b,
      maakt Onze Minister uiterlijk twee weken na het besluit, bedoeld in het eerste lid, aanhef en onderdeel b, bekend:

      a. het tijdstip van de aanvang van de veiling;

      b. de vergunningen die door middel van een veiling zullen worden verleend;

      c. voor zover dit redelijkerwijs mogelijk is, de voorschriften en beperkingen die aan het gebruik van de
      betreffende frequentieruimte zullen worden verbonden.

      4 In geval van verlening van een vergunning door middel van een veiling als bedoeld in het eerste
      lid, onderdeel b, neemt Onze Minister uiterlijk 25 weken na de uiterste ontvangstdatum, bedoeld in
      [artikel 15, eerste lid, onderdeel b][ref2], een besluit omtrent de verlening van een vergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0032895#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0032895#Artikel15
