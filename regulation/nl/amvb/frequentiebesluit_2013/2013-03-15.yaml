        hoofdstuk: '4'
  - number: '26'
    text: |-
      Bij ministeriële regeling worden regels gesteld met betrekking tot:

      a. de inrichting van het antenneregister;

      b. het tijdstip waarop de gegevens worden aangeleverd;

      c. de wijze waarop en de vorm waarin de gegevens aangeleverd worden;

      d. de wijze waarop van de gegevens kennis wordt genomen.
    url: https://wetten.overheid.nl/BWBR0032895/2013-03-15#Artikel26
  - number: '27'
    text: |-
      1 Bij ministeriële regeling wordt frequentieruimte als bedoeld in [artikel 3.24, eerste lid, van de wet][ref1],
      aangewezen.

      2 Bij ministeriële regeling kunnen nadere regels worden gesteld als bedoeld in [artikel 3.25 van de wet][ref2].


