  - number: '18'
    text: |-
      1 Voor alle categorieën vergunningen die zijn verleend met toepassing van de procedure, bedoeld in
      [artikel 3.10, eerste lid, onderdeel a, van de wet][ref1], geldt dat een vergunning van rechtswege telkens met een
      periode van vijf jaar wordt verlengd.

      2 Vergunningen die zijn verleend met toepassing van een van de procedures, bedoeld in
      [artikel 3.10, eerste lid, onderdelen b tot en met f, van de wet][ref2], worden niet verlengd, tenzij het
      algemeen maatschappelijk, cultureel of economisch belang verlenging naar het oordeel van Onze Minister vordert of
      verlenging naar het oordeel van Onze Minister van belang is voor de bevordering van de overgang van analoge naar
      digitale techniek, mits de aanvraag om verlenging uiterlijk een jaar, doch niet eerder dan twee jaar voor het
      tijdstip waarop de periode waarvoor de vergunning is verleend, is verstreken, is ontvangen door Onze Minister. Bij
      ministeriële regeling kan voor nader bepaalde vergunningen een afwijkende periode worden bepaald waarbinnen het
      verzoek tot verlenging moet worden ontvangen.

      3 Het eerste en tweede lid zijn van overeenkomstige toepassing op een vergunning die op grond van de
      [artikelen 3.19a][ref3] of [3.20 van de wet][ref4] is verkregen.

      4 Vergunningen die zijn verleend met toepassing van de procedure, bedoeld in
      [artikel 3.6, eerste lid, van de wet][ref5], worden op aanvraag verlengd, tenzij een doelmatige ordening van het
      frequentiespectrum zich daartegen verzet.

      5 In het geval een vergunning wordt verlengd kunnen de aan de vergunning verbonden voorschriften en beperkingen
      worden gewijzigd en kunnen nieuwe voorschriften en beperkingen aan de vergunning worden toegevoegd.

      6 Bij ministeriële regeling kunnen nadere regels gesteld worden omtrent de verlenging van vergunningen. Deze regels
      kunnen per te verlenen vergunning verschillen.


