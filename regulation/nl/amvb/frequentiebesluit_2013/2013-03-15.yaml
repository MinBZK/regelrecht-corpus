      1 Uiterlijk zeven dagen nadat het besluit, bedoeld in [artikel 3.10, derde lid, van de wet][ref1], in werking is
      getreden, maakt Onze Minister bekend:

      a. de regels, bedoeld in de [artikelen 8][ref2], [9, eerste lid][ref3] en [10, eerste lid][ref4];

      b. de regels, bedoeld in [artikel 3.15, eerste lid, van de wet][ref5].

      2 Onze Minister stelt eenieder gedurende een periode van ten minste vier weken in de gelegenheid zijn zienswijze te
      geven over een ontwerp van de regels, bedoeld in het eerste lid.


