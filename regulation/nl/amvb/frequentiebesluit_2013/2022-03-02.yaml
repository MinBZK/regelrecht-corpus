  - number: '38'
    text: |-
      Na de inwerkingtreding van dit besluit berust:

      a. de [Examenregeling frequentiegebruik 2008][ref1] op de [artikelen 4, tweede lid][ref2],
      en [11, tweede lid, van dit besluit][ref3] en de [artikelen 5][ref4] en
      [6 van het Besluit vergoedingen Telecommunicatiewet][ref5];

      b. de [Regeling aanvraag en toelating vergunningen voor het gebruik van frequentiegebruik][ref6] op de
      [artikelen 11, eerste lid][ref7], 11, tweede lid, juncto 4, tweede lid, en [12][ref8] van dit besluit;

      c. de [Regeling aanvraag en vergelijkende toets vergunningen commerciële radio-omroep 2003][ref9] op
      [artikel 3.10, eerste lid, van de Telecommunicatiewet][ref10] en de [artikelen 8][ref11], [9][ref12] en [10][ref13]
      van dit besluit

      d. de [Regeling aanvraag- en veilingprocedure vergunningen 800, 900 en 1800 MHz][ref14] op de [artikelen 6][ref15],
      [8][ref16], [9][ref17] en [10][ref18] van dit besluit;

      e. de [Regeling openbaar antenneregister][ref19] op [artikel 26][ref20] van dit besluit;

      f. de [Regeling gebruik van frequentieruimte zonder vergunning 2008][ref21] op de [artikelen 2, derde lid][ref22],
      [3, eerste en tweede lid][ref23], [4][ref24], en [5, tweede, vierde en vijfde lid][ref25], van dit besluit, en

      g. de [Regeling vervolg verdeling frequenties commerciële radio-omroep 2003][ref26] op
      [artikel 3.10, eerste lid, van de Telecommunicatiewet][ref27] en de [artikelen 8][ref28], [9][ref29] en [10][ref30]
      van dit besluit.


