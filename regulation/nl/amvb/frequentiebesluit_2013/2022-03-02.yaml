  - number: 18a
    text: |-
      1 Vergunningen die betrekking hebben op geharmoniseerde frequentieruimte voor het gebruik voor
      draadlozebreedbanddiensten als bedoeld in artikel 49, tweede lid, van [richtlijn (EU) 2018/1972](32018L1972),
      worden verleend voor een termijn van ten minste vijftien jaar.

      2 Indien de looptijd van de in het eerste lid bedoelde vergunningen minder dan twintig jaar bedraagt, zijn het
      derde tot en met het zesde lid van toepassing.

      3 Bij het besluit, bedoeld in [artikel 3.10, vierde lid, van de wet][ref1], worden algemene criteria
      vastgesteld voor de verlenging ervan tot ten minste een totale looptijd van twintig jaar. De termijn voor
      het naar voren brengen van zienswijzen over het ontwerp van de algemene criteria bedraagt in afwijking van
      [artikel 3:16, eerste lid, van de Algemene wet bestuursrecht][ref2] drie maanden.

      4 De in het derde lid bedoelde algemene criteria hebben betrekking op een doelmatig gebruik van frequentieruimte,
      het bevorderen van breedbanddekking, van de dekking van transportroutes en van technologische ontwikkeling
      betreffende draadloze communicatie, de waarborging van de veiligheid van het leven, de openbare orde, de openbare
      veiligheid, de defensie of de waarborging van ongestoorde mededinging.

      5 Uiterlijk twee jaar voor afloop van een vergunning verlengt Onze Minister op aanvraag die vergunning indien uit
      een beoordeling volgt dat voldaan wordt aan de algemene criteria, tenzij de oplegging van een last onder dwangsom
      of een bestuurlijke boete aan de vergunninghouder of het voornemen daartoe vanwege een overtreding van de bij of
      krachtens de wet dan wel de aan de vergunning verbonden voorschriften en beperkingen zich naar het oordeel van
      Onze Minister daar tegen verzet. [Artikel 18, negende, elfde en twaalfde lid][ref3], zijn van overeenkomstige
      toepassing.

      6 Op de voorbereiding van een besluit tot verlenging als bedoeld in het vijfde lid
      is [afdeling 3.4 van de Algemene wet bestuursrecht][ref4] van toepassing, met dien
      verstande dat de termijn voor het naar voren brengen van zienswijzen in afwijking van
      [artikel 3:16, eerste lid, van de Algemene wet bestuursrecht][ref5] drie maanden bedraagt.

      7 Van het eerste tot en met het zesde lid kan worden afgeweken indien een vergunning als bedoeld in het eerste lid
      wordt verleend:

      a. voor het aanbieden van diensten in een geografisch gebied waar de toegang tot netwerken met hoge snelheid zeer
      gebrekkig is en voor zover noodzakelijk voor het bereiken van de doelstellingen van artikel 45, tweede lid, van
      [richtlijn (EU) 2018/1972](32018L1972);;

      c. voor frequentiegebruik dat kan samengaan met het gebruik voor de in het eerste lid bedoelde
      draadlozebreedbanddiensten;

      d. voor een ander gebruik dan voor de in het eerste lid bedoelde draadlozebreedbanddiensten vanwege het ontbreken
      van vraag naar de frequentieruimte.

      8 Om te bewerkstelligen dat de looptijd van vergunningen, bedoeld in het eerste lid, gelijktijdig verstrijkt met de
      looptijd van andere vergunningen, kan worden afgeweken van het eerste lid tot en met het zesde lid.

      9 Bij besluit van Onze Minister kan ten aanzien van vergunningen als bedoeld in het eerste lid waarop het derde
      tot en met het zesde lid niet van toepassing zijn dan wel in gevallen waarin toepassing is gegeven aan het zevende
      lid of het achtste lid, kan [artikel 18, derde tot en met elfde lid en veertiende lid][ref6], van overeenkomstige
      toepassing worden verklaard.

      10 In het geval een vergunning wordt verlengd overeenkomstig het vijfde lid kunnen de aan de vergunning verbonden
      voorschriften en beperkingen worden gewijzigd en kunnen nieuwe voorschriften en beperkingen aan de vergunning
      worden toegevoegd voor zover dit betrekking heeft op de algemene criteria.

      11 Bij ministeriële regeling kunnen nadere regels gesteld worden omtrent de verlenging van vergunningen op grond
      van dit artikel. Deze regels kunnen per te verlenen vergunning verschillen.


