  - number: '18'
    text: |-
      1 Vergunningen die geen betrekking hebben op geharmoniseerde frequentieruimte en die zijn verleend met toepassing
      van de procedure, bedoeld in [artikel 3.10, eerste lid, onderdeel a, van de wet][ref1], worden van rechtswege
      telkens met een periode van vijf jaar verlengd.

      2 Vergunningen die geen betrekking hebben op geharmoniseerde frequentieruimte en die zijn verleend met toepassing
      van een van de procedures, bedoeld in [artikel 3.10, eerste lid, onderdelen b tot en met f, van de wet][ref2]
      worden niet verlengd, tenzij Onze Minister besluit dat een vergunning geheel of gedeeltelijk verlengbaar is omdat
      hij van oordeel is dat:

      a. een verlenging het algemeen maatschappelijk, cultureel of economisch belang dient, of

      b. verlenging van belang is voor de bevordering van de overgang van analoge naar digitale techniek.

      3 Voor vergunningen voor geharmoniseerde frequentieruimte voor ander gebruik dan gebruik voor
      draadlozebreedbanddiensten als bedoeld in artikel 49, tweede lid, van [richtlijn (EU) 2018/1972](32018L1972), die
      zijn verleend met toepassing van een van de procedures, bedoeld in artikel 3.10, eerste lid, van de wet, besluit
      Onze Minister over de verlengbaarheid ervan, rekening houdend met in elk geval:

      a. de mate waarin naar het oordeel van Onze Minister verlenging bijdraagt aan het verwezenlijken van de
      doelstellingen van artikel 3, artikel 45, tweede lid, en artikel 48, tweede lid, van [richtlijn (EU) 2018/1972]
      (32018L1972) en de mate waarin verlenging het algemeen maatschappelijk, cultureel of economisch belang dient;

      b. geharmoniseerde voorwaarden die zijn vastgesteld met technische uitvoeringsmaatregelen overeenkomstig artikel 4
      van Beschikking nr. 676/2002/EG;

      c. het belang van daadwerkelijke mededinging;

      d. het belang van doelmatig frequentiegebruik en

      e. de noodzaak om ernstige verstoring van de dienstverlening te voorkomen.

      4 Het derde lid is niet van toepassing op vergunningen die niet verlengbaar zijn op grond van bij of krachtens deze
      wet gestelde regels dan wel aan de vergunning verbonden voorschriften en beperkingen.

      5 Onze Minister neemt het besluit, bedoeld in het tweede, onderscheidenlijk het derde lid, in de periode tussen
      vijf en twee jaar voor afloop van de vergunning, met dien verstande dat bij het gebruik van frequentieruimte door
      of ten behoeve van commerciële media-instellingen als bedoeld in [artikel 1.1 van de Mediawet 2008](onbekend) deze
      periode tussen vijf en één jaar voor afloop van de vergunning bedraagt.

      6 Op de voorbereiding van het besluit, bedoeld in het tweede onderscheidenlijk het derde lid, is afdeling 3.4 van
      de Algemene wet bestuursrecht van toepassing.

      7 Onze Minister maakt het besluit, bedoeld in het tweede onderscheidenlijk het derde lid, bekend in de
      Staatscourant, alsmede de verlengingsperiode en, voor zover dit op dat moment reeds mogelijk is, de voorschriften
      en beperkingen die bij verlenging zullen worden gewijzigd of aan de vergunning zullen worden verbonden.

      8 Een aanvraag om verlenging wordt ingediend binnen een bij ministeriële regeling te bepalen periode.

      9 Voorafgaand aan de aanvraagperiode, bedoeld in het achtste lid, maakt Onze Minister in voorkomend geval de
      regels, bedoeld in [artikel 3.15, eerste lid, van de wet][ref3] bekend.

      10 Een aanvraag om verlenging kan worden afgewezen met overeenkomstige toepassing van
      [artikel 3.19 van de wet][ref4].

      11 Indien de continuïteit van dienstverlening naar het oordeel van Onze Minister in het geding is, kan hij, in
      afwijking van het vijfde lid, vanaf twee jaar voor afloop van de vergunning een vergunning ambtshalve verlengen
      voor een door hem te bepalen termijn. Onze Minister maakt tevens met het besluit, bedoeld in de eerste volzin,
      de regels, bedoeld in [artikel 3.15, eerste lid, van de wet][ref5], de verlengingsperiode en de voorschriften
      en beperkingen die bij verlenging zullen worden gewijzigd of aan de vergunning zullen worden verbonden, bekend.
      Indien bij de verlenging, bedoeld in de eerste volzin toepassing gegeven wordt aan het veertiende lid, kunnen de
      wijzigingen en toevoegingen bedoeld in dat lid ingaan op een eerdere datum dan die waarop de looptijd van de te
      verlengen vergunning verstrijkt.

      12 Het eerste, tweede en derde lid zijn van overeenkomstige toepassing op een vergunning die op grond van de
      [artikelen 3.19a][ref6] of [3.20 van de wet][ref7] is verkregen.

      13 Vergunningen die zijn verleend met toepassing van de procedure, bedoeld in
      [artikel 3.6, eerste lid, van de wet][ref8], worden op aanvraag verlengd, tenzij een doelmatige ordening van het
      frequentiespectrum zich daartegen verzet.

      14 In het geval een vergunning wordt verlengd kunnen de aan de vergunning verbonden voorschriften en beperkingen
      worden gewijzigd en kunnen nieuwe voorschriften en beperkingen aan de vergunning worden toegevoegd.

      15 Bij ministeriële regeling kunnen nadere regels gesteld worden omtrent de verlenging van vergunningen. Deze
      regels kunnen per te verlenen vergunning verschillen.


