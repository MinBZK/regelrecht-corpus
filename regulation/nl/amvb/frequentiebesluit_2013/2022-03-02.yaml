  - number: '4'
    text: |-
      1 Bij ministeriële regeling kunnen eisen worden gesteld waaraan een natuurlijke persoon moet voldoen voor het
      gebruik van frequentieruimte als bedoeld in [artikel 3, eerste lid][ref1]. Deze eisen kunnen slechts inhouden dat:

      a. de gebruiker een bepaalde leeftijd heeft bereikt;

      b. de gebruiker met goed gevolg een voor het gebruik van de gevraagde frequentieruimte, in samenhang met het doel
      waarvoor die frequentieruimte wordt gebruikt, vereist examen heeft afgelegd, of

      c. de gebruiker in het bezit is van een certificaat van bediening.

      2 Ten aanzien van het verkrijgen van een certificaat van bediening en het examen, bedoeld in het eerste lid, kunnen
      bij ministeriële regeling regels worden gesteld die betrekking hebben op:

      a. het afleggen en het afnemen van het examen;

      b. de eisen van het examen;

      c. de ontheffing van het examen;

      d. de wijze waarop de vergoeding voor een examen dan wel een ontheffing moet worden voldaan;

      e. het verkrijgen van een certificaat van bediening.

      3 Bij ministeriële regeling kunnen regels worden gesteld voor het gebruik door rechtspersonen van frequentieruimte
      als bedoeld in [artikel 3, eerste lid][ref2].

      4 Voor de toepassing van dit artikel wordt een vennootschap zonder rechtspersoonlijkheid gelijk gesteld met een
      rechtspersoon.


      [ref1]: https://wetten.overheid.nl/BWBR0032895#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0032895#Artikel3
