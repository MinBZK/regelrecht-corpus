  - number: '25'
    text: |-
      1 In het antenneregister worden voor de antennes als bedoeld in [artikel 23, eerste lid, onderdeel c][ref1], de
      volgende gegevens opgenomen:

      a. de locatie van de antenne-installatie, met een nauwkeurigheid van 15 meter, aangeduid met toepassing van het
      World Geodetic System 1984;

      b. het type registratie.

      2 De gegevens, bedoeld in het eerste lid, worden aan Onze Minister verstrekt door de radiozendamateur die zich voor
      het gebruik van frequentieruimte heeft geregistreerd.

      3 Onze Minister kan gegevens die door radiozendamateurs worden verstrekt in het kader van de registratie opnemen in
      het antenneregister.


      [ref1]: https://wetten.overheid.nl/BWBR0032895#Artikel23
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel25
