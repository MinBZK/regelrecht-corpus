  - number: '23'
    text: >-
      1 In het antenneregister worden gegevens opgenomen van:


      a. antennes die zijn geplaatst op een vaste locatie met het doel met een zendvermogen van meer dan 10 dB watt
      Effective Radiated Power (ERP) uit te gaan zenden;


      b. antennes die zijn geplaatst op een vaste locatie en die tot een netwerk behoren, indien meer dan de helft van
      het aantal antennes van het netwerk een zendvermogen van meer dan 10 dB watt ERP heeft;


      c. antennes van radiozendamateurs die zijn geregistreerd als gebruiker van frequentieruimte;


      d. antennes waarop bij of krachtens artikel 57, tweede lid, van [richtlijn (EU) 2018/1972](32018L1972) gestelde
      regels van toepassing zijn.


      2 Van het eerste lid zijn uitgezonderd de gegevens van antennes in gebruik bij overheidsorganen die een taak
      uitoefenen op het terrein van politie, justitie of veiligheid.
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel23
  - number: '24'
    text: |-
      1 In het antenneregister worden voor de antennes, bedoeld in [artikel 23, eerste lid, onderdelen a, b en d][ref1],
      de volgende gegevens opgenomen:

      a. de toepassing van de antenne;

      b. de hoogte gemeten vanaf het maaiveld tot het geometrische midden van de antenne;

      c. de frequentie van de gebruikte toepassing;

      d. de hoofdstraalrichting van de antenne;

      e. het zendvermogen van de antenne in de hoofdstraalrichting aangeduid in dB watt ERP;

      f. de datum van ingebruikname van de antenne;

      g. de locatie van de antenne-installatie, onder vermelding van de geografische positie in graden, minuten, seconden
      volgens het Europees Terrestrisch Referentiesysteem 89 of het World Geodetic System 1984, in ieder geval met een
      nauwkeurigheid van 15 meter;

      h. de verklaring dat de antenne voldoet aan de eisen van de krachtens artikel 57, tweede lid,
      van [richtlijn (EU) 2018/1972](32018L1972) gestelde regels, indien het een antenne als bedoeld in
      [artikel 23, eerste lid, onderdeel d][ref2], betreft.

      2 De gegevens, bedoeld in het eerste lid, worden aan Onze Minister verstrekt door diegene die de frequentie
      gebruikt of wil gebruiken.


      [ref1]: https://wetten.overheid.nl/BWBR0032895#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0032895#Artikel23
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel24
