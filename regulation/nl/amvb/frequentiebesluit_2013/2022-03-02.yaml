  - number: '8'
    text: >-
      Bij ministeriële regeling worden regels gesteld omtrent de indiening van de aanvraag om een vergunning en omtrent
      de inhoud van de aanvraag en de daarbij te overleggen gegevens. Deze regels kunnen per vergunning verschillen.
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel8
  - number: '9'
    text: >-
      1 Tot de veiling en de vergelijkende toets worden slechts toegelaten aanvragers die voldoen aan bij ministeriële
      regeling te stellen eisen. Deze eisen kunnen per vergunning verschillen.


      2 De in het eerste lid bedoelde eisen kunnen slechts betrekking hebben op de:


      a. rechtsvorm van de aanvrager;


      b. financiële positie van de aanvrager;


      c. kennis en ervaring van de aanvrager;


      d. technische middelen waarover de aanvrager kan beschikken;


      e. hoedanigheid van de aanvrager als commerciële omroep;


      f. door de aanvrager te leveren bijdrage aan de overgang van analoge naar digitale techniek.


      3 Indien een te verlenen vergunning betrekking heeft op het gebruik van frequentieruimte die is bestemd voor
      commerciële omroep, kunnen de in het eerste lid bedoelde eisen tevens betrekking hebben op het waarborgen van
      democratische, sociale, taalkundige en culturele belangen die een rol spelen bij het gebruik van frequentieruimte,
      waarbij rekening kan worden gehouden met pluralisme in de media.
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel9
  - number: '10'
    text: |-
      1 Bij ministeriële regeling worden regels gesteld omtrent de toepassing en uitvoering van de veiling of de
      vergelijkende toets. Deze regels kunnen per vergunning verschillen.

      2 In het geval van een veiling hebben de in het eerste lid bedoelde regels in elk geval betrekking op:

      a. de wijze waarop een bod wordt uitgebracht;

      b. de eisen die aan een geldig bod worden gesteld;

      c. de zekerheidstelling dat een bod gestand wordt gedaan of kosten en schade kunnen worden verhaald;

      d. maatregelen ten behoeve van een ongestoord en eerlijk verloop van de veiling, waaronder de gevallen waarin,
      de termijn waarbinnen en de voorwaarden waaronder de veiling tijdelijk kan worden opgeschort, biedingen ongeldig
      kunnen worden verklaard en biedrondes opnieuw kunnen worden gehouden;

      e. de bij veiling toe te passen methode ter vaststelling van het bod waarvan de uitbrenger in aanmerking komt voor
      verlening van de vergunning;

      f. de eisen die gesteld worden met betrekking tot de wijze van betaling en het tijdstip waarop degene aan wie de
      vergunning wordt verleend deze betaling moet hebben verricht.

      3 In het geval van een vergelijkende toets hebben de in het eerste lid bedoelde regels in elk geval betrekking op
      de criteria waarmee de kwaliteit van de aanvraag of de kwaliteit van de aanvrager wordt bepaald.

      4 In het geval van een vergelijkende toets met inbegrip van een financieel bod, kunnen de in het eerste lid
      bedoelde regels eveneens betrekking hebben op:

      a. de gevallen waarin een financieel bod wordt uitgebracht alsmede de wijze waarop dat bod wordt uitgebracht;

      b. de eisen die aan een geldig financieel bod worden gesteld;

      c. de zekerheidstelling dat een financieel bod gestand wordt gedaan of kosten en schade kunnen worden verhaald;

      d. de eisen die gesteld worden met betrekking tot de wijze van betaling van het financieel bod en het tijdstip
      waarop degene aan wie de vergunning wordt verleend deze betaling moet hebben verricht.

      5 In het geval van een vergelijkende toets houdt Onze Minister bij het opstellen van de criteria rekening met de
      doelstellingen, bedoeld in [artikel 1.3, eerste lid, van de wet][ref1].

      6 Bij ministeriële regeling kunnen regels worden gesteld als bedoeld in
      [artikel 3.16, tweede lid, onderdeel b, van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel1.3
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel3.16
