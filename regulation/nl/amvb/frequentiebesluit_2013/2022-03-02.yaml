  - number: '40.1'
    text: |-
      De Wet van 10 mei 2012 houdende wijziging van de Telecommunicatiewet in verband met de Nota frequentiebeleid 2005
      (Staatsblad 2013, 48) treedt in werking met ingang van een maand na de datum van uitgifte van het Staatsblad waarin
      zij wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel40
  - number: '40.2'
    text: |-
      Artikel XXXVII, onderdeel K, van de Wet van 22 december 2011 tot aanpassing van een aantal wetten op het terrein
      van Economische Zaken, Landbouw en Innovatie naar aanleiding van de departementale herindeling en het herstel van
      enkele wetstechnische gebreken en leemten (Staatsblad 2012, 19) treedt in werking op het in het eerste lid bedoelde
      tijdstip, direct na inwerkingtreding van de wet, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel40
