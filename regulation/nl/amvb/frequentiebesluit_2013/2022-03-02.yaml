  - number: '19'
    text: |-
      1 Onze Minister publiceert in de Staatscourant een besluit als bedoeld in:

      a. [artikel 3.19a, eerste lid, van de wet][ref1] houdende dat de houder van een vergunning wordt verplicht om die
      vergunning geheel of gedeeltelijk over te dragen,

      b. [artikel 3.19a, tweede lid, van de wet][ref2] houdende dat Onze Minister de procedure tot overdracht ter hand
      neemt.

      2 Uiterlijk zeven dagen nadat het besluit, bedoeld in het eerste lid, onder a of b, is gepubliceerd, maakt Onze
      Minister bekend:

      a. de termijn, bedoeld in [artikel 3.19a, eerste lid, van de wet][ref3];

      b. de periode, bedoeld in [artikel 3.19a, vijfde lid, van de wet][ref4].


