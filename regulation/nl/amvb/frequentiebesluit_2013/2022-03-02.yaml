---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht-mvp/refs/heads/main/schema/v0.3.1/schema.json
$id: frequentiebesluit_2013
regulatory_layer: AMVB
publication_date: '2022-03-01'
valid_from: '2022-03-02'
bwb_id: BWBR0032895
url: https://wetten.overheid.nl/BWBR0032895/2022-03-02
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Minister van Economische Zaken, Landbouw en Innovatie van 21 juni 2011, nr. WJZ / 11081232;

    Gelet op de artikelen 3.4, derde lid, 3.9, 3.16, eerste lid, 3.17, eerste tot en met derde lid, 3.22, vierde
    lid, 3.23, tweede tot en met vierde lid, 3.24, eerste lid, 3.25, eerste lid, 10.8, 13.4, 16.1 en 18.12 van de
    Telecommunicatiewet, artikel 1.2, tweede lid, van de Wet luchtvaart en de artikelen 19, eerste lid, en 64 van de
    Zeevaartbemanningswet;

    De Afdeling advisering van de Raad van State gehoord (advies van 15 september 2011, nr. W 15.11.0235/IV);

    Gezien het nader rapport van de Minister van Economische Zaken van 5 februari 2013, nr. WJZ / 12048871;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel1
  - number: 1.a
    text: |-
      *wet:* [Telecommunicatiewet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009950
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009950
  - number: 1.b
    text: |-
      *vergunning:* vergunning als bedoeld in [artikel 3.13, eerste lid, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
  - number: 1.c
    text: |-
      *antenneregister:* openbaar antenneregister als bedoeld in [artikel 3.23, eerste lid, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
  - number: 1.d
    text: |-
      *geharmoniseerde frequentieruimte:* frequentieruimte waarvoor door middel van technische uitvoeringsmaatregelen op
      grond van Beschikking nr. 676/2002/EG van het Europees Parlement en de Raad van 7 maart 2002 (PbEG 2002, L 108) of
      een andere vergelijkbare maatregel gebaseerd op artikel 114 van het Verdrag betreffende de Werking van de Europese
      Unie, geharmoniseerde voorwaarden zijn vastgesteld.
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel1
  - number: '2.1'
    text: |-
      Bij ministeriële regeling kunnen categorieën radioapparaten worden aangewezen ten aanzien waarvan voor het gebruik
      van frequentieruimte geen vergunning is vereist en geen meldingsplicht geldt.
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel2
  - number: '2.2'
    text: |-
      De aanwijzing van categorieën radioapparaten, bedoeld in het eerste lid, kan uitsluitend geschieden voor zover het
      radioapparaten betreft, die geen of vrijwel geen storing of belemmering veroorzaken in elektrische of elektronische
      apparaten.
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel2
  - number: '2.3'
    text: |-
      Met betrekking tot het gebruik als bedoeld in het eerste lid en
      [artikel 10.15, tweede lid, onderdelen c en d, van de wet][ref1] kunnen bij ministeriële regeling regels worden
      gesteld:


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel10
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '10'
  - number: 2.3.a
    text: inzake de doelmatigheid van het gebruik;
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel2
  - number: 2.3.b
    text: |-
      inzake de aard van de radioapparaten en de daarbij behorende antenne-inrichtingen alsmede het vermogen waarmee mag
      worden uitgezonden;
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel2
  - number: 2.3.c
    text: |-
      ter uitvoering van verplichtingen die voorvloeien uit verdragen of uit bindende besluiten van volkenrechtelijk
      organisaties aangaande het gebruik van frequentieruimte.
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel2
  - number: '3.1'
    text: |-
      Bij ministeriële regeling kunnen categorieën radioapparaten worden aangewezen ten aanzien waarvan voor het gebruik
      van frequentieruimte, behoudens een meldingsplicht, geen vergunning is vereist.
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel3
  - number: '3.2'
    text: |-
      Met betrekking tot het gebruik als bedoeld in het eerste lid kunnen bij ministeriële regeling regels worden gesteld
      inzake:
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel3
  - number: 3.2.a
    text: het door de gebruiker beschikbaar houden van bescheiden;
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel3
  - number: 3.2.b
    text: |-
      het veroorzaken van belemmeringen in radioapparaten of in elektrische of elektronische inrichtingen door het
      gewenste signaal van een radioapparaat.
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel3
  - number: '3.3'
    text: |-
      [Artikel 2, derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0032895#Artikel2
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0032895
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '4.1'
    text: |-
      Bij ministeriële regeling kunnen eisen worden gesteld waaraan een natuurlijke persoon moet voldoen voor het gebruik
      van frequentieruimte als bedoeld in [artikel 3, eerste lid][ref1]. Deze eisen kunnen slechts inhouden dat:


      [ref1]: https://wetten.overheid.nl/BWBR0032895#Artikel3
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0032895
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 4.1.a
    text: de gebruiker een bepaalde leeftijd heeft bereikt;
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel4
  - number: 4.1.b
    text: |-
      de gebruiker met goed gevolg een voor het gebruik van de gevraagde frequentieruimte, in samenhang met het doel
      waarvoor die frequentieruimte wordt gebruikt, vereist examen heeft afgelegd, of
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel4
  - number: 4.1.c
    text: de gebruiker in het bezit is van een certificaat van bediening.
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel4
  - number: '4.2'
    text: |-
      Ten aanzien van het verkrijgen van een certificaat van bediening en het examen, bedoeld in het eerste lid, kunnen
      bij ministeriële regeling regels worden gesteld die betrekking hebben op:
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel4
  - number: 4.2.a
    text: het afleggen en het afnemen van het examen;
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel4
  - number: 4.2.b
    text: de eisen van het examen;
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel4
  - number: 4.2.c
    text: de ontheffing van het examen;
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel4
  - number: 4.2.d
    text: de wijze waarop de vergoeding voor een examen dan wel een ontheffing moet worden voldaan;
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel4
  - number: 4.2.e
    text: het verkrijgen van een certificaat van bediening.
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel4
  - number: '4.3'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld voor het gebruik door rechtspersonen van frequentieruimte
      als bedoeld in [artikel 3, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0032895#Artikel3
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0032895
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '4.4'
    text: |-
      Voor de toepassing van dit artikel wordt een vennootschap zonder rechtspersoonlijkheid gelijk gesteld met een
      rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel4
  - number: '5.1'
    text: |-
      Degene die voornemens is frequentieruimte waarvoor geen vergunning is vereist te gebruiken als bedoeld in
      [artikel 3, eerste lid][ref1], doet hiervan melding aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0032895#Artikel3
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0032895
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '5.2'
    text: |-
      Onze Minister registreert het in de melding bedoelde frequentiegebruik tenzij niet wordt voldaan aan bij
      ministeriële regeling te stellen regels.
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel5
  - number: '5.3'
    text: |-
      De frequentieruimte voor het gebruik waarvan geen vergunning is vereist, wordt slechts gebruikt indien het gebruik
      is geregistreerd overeenkomstig het tweede lid.
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel5
  - number: '5.4'
    text: |-
      Met het oog op de identificatie van het radioapparaat kent Onze Minister in bij ministeriële regeling te bepalen
      gevallen aan degene die de melding heeft gedaan een combinatie van letters of cijfers toe.
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel5
  - number: '5.5'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld ter zake van de melding, de registratie en de
      toekenning van de combinatie van letters of cijfers.
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel5
  - number: '6'
    text: |-
      Ingeval van een procedure voor de verlening van een vergunning als bedoeld in
      [artikel 3.10, eerste lid, van de wet][ref1] kan bij ministeriële regeling frequentieruimte voor een categorie
      van aanvragers worden gereserveerd. Daarbij kan een maximale hoeveelheid gereserveerde frequentieruimte worden
      vastgesteld die een aanvrager in de procedure kan verwerven.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
  - number: 6a
    text: |-
      Een vergunning wordt geweigerd voor zover verlening daarvan in strijd zou zijn met de bij of krachtens de
      [wet][ref1], dan wel bij of krachtens [artikel 6.23 van de Mediawet 2008][ref2] gestelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0009950
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel6
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0009950
      - id: ref2
        bwb_id: BWBR0025028
        artikel: '6'
  - number: '7.1'
    text: |-
      Uiterlijk zeven dagen nadat het besluit, bedoeld in [artikel 3.10, derde lid, van de wet][ref1], in werking is
      getreden, maakt Onze Minister bekend:


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
  - number: 7.1.a
    text: |-
      de regels, bedoeld in de [artikelen 8][ref1], [9, eerste lid][ref2] en [10, eerste lid][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0032895#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0032895#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0032895#Artikel10
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0032895
        artikel: '8'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0032895
        artikel: '9'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref3
        bwb_id: BWBR0032895
        artikel: '10'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 7.1.b
    text: |-
      de regels, bedoeld in [artikel 3.15, eerste lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
  - number: '7.2'
    text: |-
      Onze Minister stelt eenieder gedurende een periode van ten minste vier weken in de gelegenheid zijn zienswijze te
      geven over een ontwerp van de regels, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel7
  - number: '8'
    text: |-
      Bij ministeriële regeling worden regels gesteld omtrent de indiening van de aanvraag om een vergunning en omtrent
      de inhoud van de aanvraag en de daarbij te overleggen gegevens. Deze regels kunnen per vergunning verschillen.
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel8
  - number: '9.1'
    text: |-
      Tot de veiling en de vergelijkende toets worden slechts toegelaten aanvragers die voldoen aan bij ministeriële
      regeling te stellen eisen. Deze eisen kunnen per vergunning verschillen.
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel9
  - number: '9.2'
    text: 'De in het eerste lid bedoelde eisen kunnen slechts betrekking hebben op de:'
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel9
  - number: 9.2.a
    text: rechtsvorm van de aanvrager;
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel9
  - number: 9.2.b
    text: financiële positie van de aanvrager;
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel9
  - number: 9.2.c
    text: kennis en ervaring van de aanvrager;
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel9
  - number: 9.2.d
    text: technische middelen waarover de aanvrager kan beschikken;
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel9
  - number: 9.2.e
    text: hoedanigheid van de aanvrager als commerciële omroep;
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel9
  - number: 9.2.f
    text: door de aanvrager te leveren bijdrage aan de overgang van analoge naar digitale techniek.
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel9
  - number: '9.3'
    text: |-
      Indien een te verlenen vergunning betrekking heeft op het gebruik van frequentieruimte die is bestemd voor
      commerciële omroep, kunnen de in het eerste lid bedoelde eisen tevens betrekking hebben op het waarborgen van
      democratische, sociale, taalkundige en culturele belangen die een rol spelen bij het gebruik van frequentieruimte,
      waarbij rekening kan worden gehouden met pluralisme in de media.
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel9
  - number: '10.1'
    text: |-
      Bij ministeriële regeling worden regels gesteld omtrent de toepassing en uitvoering van de veiling of de
      vergelijkende toets. Deze regels kunnen per vergunning verschillen.
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel10
  - number: '10.2'
    text: 'In het geval van een veiling hebben de in het eerste lid bedoelde regels in elk geval betrekking op:'
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel10
  - number: 10.2.a
    text: de wijze waarop een bod wordt uitgebracht;
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel10
  - number: 10.2.b
    text: de eisen die aan een geldig bod worden gesteld;
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel10
  - number: 10.2.c
    text: de zekerheidstelling dat een bod gestand wordt gedaan of kosten en schade kunnen worden verhaald;
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel10
  - number: 10.2.d
    text: |-
      maatregelen ten behoeve van een ongestoord en eerlijk verloop van de veiling, waaronder de gevallen waarin, de
      termijn waarbinnen en de voorwaarden waaronder de veiling tijdelijk kan worden opgeschort, biedingen ongeldig
      kunnen worden verklaard en biedrondes opnieuw kunnen worden gehouden;
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel10
  - number: 10.2.e
    text: |-
      de bij veiling toe te passen methode ter vaststelling van het bod waarvan de uitbrenger in aanmerking komt voor
      verlening van de vergunning;
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel10
  - number: 10.2.f
    text: |-
      de eisen die gesteld worden met betrekking tot de wijze van betaling en het tijdstip waarop degene aan wie de
      vergunning wordt verleend deze betaling moet hebben verricht.
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel10
  - number: '10.3'
    text: |-
      In het geval van een vergelijkende toets hebben de in het eerste lid bedoelde regels in elk geval betrekking op de
      criteria waarmee de kwaliteit van de aanvraag of de kwaliteit van de aanvrager wordt bepaald.
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel10
  - number: '10.4'
    text: |-
      In het geval van een vergelijkende toets met inbegrip van een financieel bod, kunnen de in het eerste lid bedoelde
      regels eveneens betrekking hebben op:
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel10
  - number: 10.4.a
    text: de gevallen waarin een financieel bod wordt uitgebracht alsmede de wijze waarop dat bod wordt uitgebracht;
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel10
  - number: 10.4.b
    text: de eisen die aan een geldig financieel bod worden gesteld;
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel10
  - number: 10.4.c
    text: de zekerheidstelling dat een financieel bod gestand wordt gedaan of kosten en schade kunnen worden verhaald;
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel10
  - number: 10.4.d
    text: |-
      de eisen die gesteld worden met betrekking tot de wijze van betaling van het financieel bod en het tijdstip waarop
      degene aan wie de vergunning wordt verleend deze betaling moet hebben verricht.
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel10
  - number: '10.5'
    text: |-
      In het geval van een vergelijkende toets houdt Onze Minister bij het opstellen van de criteria rekening met de
      doelstellingen, bedoeld in [artikel 1.3, eerste lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel1
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '1'
  - number: '10.6'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld als bedoeld in
      [artikel 3.16, tweede lid, onderdeel b, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
  - number: '11.1'
    text: |-
      Bij ministeriële regeling kunnen eisen worden gesteld waaraan de aanvrager moet voldoen om in aanmerking te komen
      voor een vergunning. Deze eisen kunnen slechts inhouden dat:
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel11
  - number: 11.1.a
    text: de aanvrager een bepaalde leeftijd heeft bereikt;
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel11
  - number: 11.1.b
    text: |-
      de aanvrager met goed gevolg een voor het gebruik van de gevraagde frequentieruimte, in samenhang met het doel
      waarvoor die frequentieruimte wordt gebruikt, vereist examen heeft afgelegd;
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel11
  - number: 11.1.c
    text: de aanvrager in het bezit is van een certificaat van bediening;
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel11
  - number: 11.1.d
    text: de aanvrager een redelijk belang heeft bij het voorgenomen gebruik van de gevraagde frequentieruimte.
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel11
  - number: '11.2'
    text: |-
      [Artikel 4, tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0032895#Artikel4
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0032895
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '11.3'
    text: |-
      Voor zover de aard, de omvang of het maatschappelijk belang van de vergunning daartoe naar het oordeel van Onze
      Minister aanleiding geeft, kunnen naast de eisen genoemd in het eerste lid bij ministeriële regeling tevens de
      eisen worden gesteld bedoeld in [artikel 9, tweede en derde lid][ref1], en kunnen voorts regels worden gesteld in
      het belang van een evenwichtige verdeling dan wel een doelmatig gebruik van frequentieruimte.


      [ref1]: https://wetten.overheid.nl/BWBR0032895#Artikel9
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0032895
        artikel: '9'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '12'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld omtrent de indiening van de aanvraag om een vergunning
      en omtrent de inhoud van de aanvraag en de daarbij te overleggen gegevens. Deze regels kunnen per te verlenen
      vergunning verschillen.
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel12
  - number: '13.1'
    text: |-
      In het geval de verlening van een vergunning betrekking heeft op frequentieruimte die is bestemd voor het aanbieden
      van openbare elektronische communicatienetwerken of openbare elektronische communicatiediensten beslist Onze
      Minister op een aanvraag om verlening van de vergunning binnen zes weken na ontvangst van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel13
  - number: '13.2'
    text: |-
      Van de termijn, genoemd in het eerste lid, kan worden afgeweken indien internationale frequentie- en
      satellietcoördinatie op grond van het Internationale Telecommunicatieverdrag daartoe noopt.
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel13
  - number: '14.1'
    text: 'Bij ministeriële regeling worden regels gesteld omtrent:'
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel14
  - number: 14.1.a
    text: |-
      de indiening van een aanvraag om verlening van een vergunning voor het gebruik van frequentieruimte als bedoeld in
      [artikel 3.10, eerste lid, onderdeel b, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
  - number: 14.1.b
    text: de inhoud van de aanvraag en de daarbij te overleggen gegevens;
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel14
  - number: 14.1.c
    text: de eisen waaraan de aanvrager moet voldoen.
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel14
  - number: '14.2'
    text: 'De in het eerste lid, onderdeel c, bedoelde eisen kunnen slechts betrekking hebben op de:'
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel14
  - number: 14.2.a
    text: rechtsvorm van de aanvrager;
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel14
  - number: 14.2.b
    text: financiële positie van de aanvrager;
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel14
  - number: 14.2.c
    text: kennis en ervaring van de aanvrager;
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel14
  - number: 14.2.d
    text: technische middelen waarover de aanvrager kan beschikken;
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel14
  - number: 14.2.e
    text: hoedanigheid van de aanvrager als commerciële omroep;
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel14
  - number: 14.2.f
    text: door de aanvrager te leveren bijdrage aan de overgang van analoge naar digitale techniek.
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel14
  - number: '14.3'
    text: |-
      Voor zover dat op dat moment reeds mogelijk is, stelt Onze Minister bij het besluit om
      vergunningen in een bepaalde frequentieband te verlenen met toepassing van de procedure bedoeld in
      [artikel 3.10, eerste lid, onderdeel b, van de wet][ref1], tevens de voorschriften en beperkingen vast die aan de
      vergunning zullen worden verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
  - number: '15.1'
    text: |-
      Uiterlijk negen weken na ontvangst van een aanvraag die voldoet aan het bepaalde op grond van
      [artikel 14, eerste lid][ref1], maakt Onze Minister in de Staatscourant bekend:


      [ref1]: https://wetten.overheid.nl/BWBR0032895#Artikel14
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0032895
        artikel: '14'
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: 15.1.a
    text: de ontvangst van de aanvraag en de frequentieband waarop deze aanvraag betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel15
  - number: 15.1.b
    text: |-
      de aanvang van de termijn van zes weken voor het indienen van aanvragen om verlening van een vergunning voor het
      gebruik van dezelfde frequentieband;
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel15
  - number: 15.1.c
    text: |-
      voor zover dit redelijkerwijs mogelijk is, de voorschriften en beperkingen die aan een vergunning voor het gebruik
      van de betreffende frequentieband zullen worden verbonden.
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel15
  - number: '15.2'
    text: |-
      Het op grond van [artikel 14][ref1] bepaalde is mede van toepassing op aanvragen als bedoeld in het eerste lid,
      onderdeel b.


      [ref1]: https://wetten.overheid.nl/BWBR0032895#Artikel14
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0032895
        artikel: '14'
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: '16.1'
    text: |-
      Uiterlijk negen weken na de uiterste ontvangstdatum, bedoeld in [artikel 15, eerste lid, onderdeel b][ref1], neemt
      Onze Minister:


      [ref1]: https://wetten.overheid.nl/BWBR0032895#Artikel15
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0032895
        artikel: '15'
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: 16.1.a
    text: |-
      een besluit omtrent de verlening van een vergunning voor het gebruik van frequentieruimte indien de totale omvang
      van de aangevraagde frequentieruimte kleiner is dan of gelijk is aan de beschikbare frequentieruimte binnen het
      betreffende frequentie- en geografische bereik of
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel16
  - number: 16.1.b
    text: |-
      het besluit dat de vergunning wordt verleend door middel van een veiling indien de totale omvang van de
      aangevraagde frequentieruimte groter is dan de beschikbare frequentieruimte binnen het frequentie- en geografische
      bereik.
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel16
  - number: '16.2'
    text: |-
      Bij ministeriële regeling worden regels gesteld omtrent de wijze waarop de verlening, bedoeld in het eerste lid,
      onderdeel a, en de veiling, bedoeld in het eerste lid, onderdeel b, plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel16
  - number: '16.3'
    text: |-
      In geval van verlening van een vergunning door middel van een veiling als bedoeld in het eerste lid, onderdeel b,
      maakt Onze Minister uiterlijk twee weken na het besluit, bedoeld in het eerste lid, aanhef en onderdeel b, bekend:
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel16
  - number: 16.3.a
    text: het tijdstip van de aanvang van de veiling;
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel16
  - number: 16.3.b
    text: de vergunningen die door middel van een veiling zullen worden verleend;
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel16
  - number: 16.3.c
    text: |-
      voor zover dit redelijkerwijs mogelijk is, de voorschriften en beperkingen die aan het gebruik van de betreffende
      frequentieruimte zullen worden verbonden.
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel16
  - number: '16.4'
    text: |-
      In geval van verlening van een vergunning door middel van een veiling als bedoeld in het eerste
      lid, onderdeel b, neemt Onze Minister uiterlijk 25 weken na de uiterste ontvangstdatum, bedoeld in
      [artikel 15, eerste lid, onderdeel b][ref1], een besluit omtrent de verlening van een vergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0032895#Artikel15
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0032895
        artikel: '15'
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: '17.1'
    text: 'De aan een vergunning te verbinden voorschriften en beperkingen kunnen slechts betrekking hebben op:'
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel17
  - number: 17.1.a
    text: het doelmatig gebruik van de toegewezen frequentieruimte;
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel17
  - number: 17.1.b
    text: |-
      de aard van de radioapparaten en de daarbij behorende antenne-inrichtingen alsmede het vermogen waarmee mag worden
      uitgezonden;
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel17
  - number: 17.1.c
    text: bescheiden die de vergunninghouder ter beschikking moet houden;
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel17
  - number: 17.1.d
    text: |-
      verplichtingen die voortvloeien uit de toezeggingen die de vergunninghouder in het kader van een vergelijkende
      toets of een veiling heeft gedaan, ook indien slechts één aanvrager aan de bij of krachtens de wet gestelde eisen
      voldoet;
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel17
  - number: 17.1.e
    text: |-
      het veroorzaken van belemmeringen in radioapparaten of in elektrische of elektronische inrichtingen door het
      gewenste signaal van een radioapparaat;
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel17
  - number: 17.1.f
    text: |-
      het waarborgen van de in [artikel 9, derde lid][ref1], bedoelde belangen;


      [ref1]: https://wetten.overheid.nl/BWBR0032895#Artikel9
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0032895
        artikel: '9'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 17.1.g
    text: |-
      de diensten die moeten worden aangeboden, het soort elektronisch communicatienetwerk dat moet worden aangeboden of
      de technologie die moet worden gebruikt;
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel17
  - number: 17.1.h
    text: |-
      de naleving van verplichtingen die voortvloeien uit verdragen of uit bindende besluiten van volkenrechtelijke
      organisaties betreffende het gebruik van radiofrequenties of posities in de ruimte;
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel17
  - number: 17.1.i
    text: |-
      de identificatie van het zendapparaat door middel van een daartoe bij de vergunningverlening toe te kennen
      combinatie van letters of cijfers;
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel17
  - number: 17.1.j
    text: |-
      algemene criteria voor verlenging als bedoeld in [artikel 18a, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0032895#Artikel18a
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0032895
        artikel: 18a
        hoofdstuk: '3'
        paragraaf: '3.6'
  - number: '17.2'
    text: |-
      De in het eerste lid, onderdeel a, bedoelde voorschriften en beperkingen kunnen onder meer betrekking hebben op
      de termijn waarop en het geografisch gebied waarbinnen de in het eerste lid, onderdeel g, bedoelde diensten moeten
      worden aangeboden.
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel17
  - number: '17.3'
    text: |-
      Indien samenwerking tussen vergunninghouders noodzakelijk is om gewijzigde of nieuw toegekende frequentieruimte in
      gebruik te kunnen nemen met behoud van continuïteit van dienstverlening, kunnen de in het eerste lid, onderdeel a,
      bedoelde voorschriften en beperkingen onder meer bestaan uit een verplichting voor deze vergunninghouders om binnen
      een bepaalde termijn een overeenkomst te sluiten over deze samenwerking.
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel17
  - number: '17.4'
    text: |-
      Onze Minister kan op verzoek van een van de houders van een vergunning bedoeld in het derde lid of uit eigen
      beweging, voorschriften geven met betrekking tot de wijze waarop de overeenkomst tot stand moet komen. De
      vergunninghouders houden zich aan de door Onze Minister gegeven voorschriften.
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel17
  - number: '17.5'
    text: |-
      Indien op een of meer onderdelen van de overeenkomst bedoeld in het derde lid geen overeenstemming van alle bij dat
      onderdeel of die onderdelen betrokken vergunninghouders dreigt te worden bereikt, kan Onze Minister op verzoek of
      uit eigen beweging een dwingende aanwijzing geven. De vergunninghouders zijn bij het sluiten van de overeenkomst
      gebonden aan de aanwijzing.
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel17
  - number: '18.1'
    text: |-
      Vergunningen die geen betrekking hebben op geharmoniseerde frequentieruimte en die zijn verleend met toepassing van
      de procedure, bedoeld in [artikel 3.10, eerste lid, onderdeel a, van de wet][ref1], worden van rechtswege telkens
      met een periode van vijf jaar verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
  - number: '18.2'
    text: |-
      Vergunningen die geen betrekking hebben op geharmoniseerde frequentieruimte en die zijn verleend met toepassing van
      een van de procedures, bedoeld in [artikel 3.10, eerste lid, onderdelen b tot en met f, van de wet][ref1] worden
      niet verlengd, tenzij Onze Minister besluit dat een vergunning geheel of gedeeltelijk verlengbaar is omdat hij van
      oordeel is dat:


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
  - number: 18.2.a
    text: een verlenging het algemeen maatschappelijk, cultureel of economisch belang dient, of
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel18
  - number: 18.2.b
    text: verlenging van belang is voor de bevordering van de overgang van analoge naar digitale techniek.
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel18
  - number: '18.3'
    text: |-
      Voor vergunningen voor geharmoniseerde frequentieruimte voor ander gebruik dan gebruik voor
      draadlozebreedbanddiensten als bedoeld in artikel 49, tweede lid, van [richtlijn (EU) 2018/1972](32018L1972), die
      zijn verleend met toepassing van een van de procedures, bedoeld in artikel 3.10, eerste lid, van de wet, besluit
      Onze Minister over de verlengbaarheid ervan, rekening houdend met in elk geval:
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel18
  - number: 18.3.a
    text: |-
      de mate waarin naar het oordeel van Onze Minister verlenging bijdraagt aan het verwezenlijken van de doelstellingen
      van artikel 3, artikel 45, tweede lid, en artikel 48, tweede lid, van [richtlijn (EU) 2018/1972](32018L1972) en de
      mate waarin verlenging het algemeen maatschappelijk, cultureel of economisch belang dient;
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel18
  - number: 18.3.b
    text: |-
      geharmoniseerde voorwaarden die zijn vastgesteld met technische uitvoeringsmaatregelen overeenkomstig artikel 4 van
      Beschikking nr. 676/2002/EG;
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel18
  - number: 18.3.c
    text: het belang van daadwerkelijke mededinging;
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel18
  - number: 18.3.d
    text: het belang van doelmatig frequentiegebruik en
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel18
  - number: 18.3.e
    text: de noodzaak om ernstige verstoring van de dienstverlening te voorkomen.
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel18
  - number: '18.4'
    text: |-
      Het derde lid is niet van toepassing op vergunningen die niet verlengbaar zijn op grond van bij of krachtens deze
      wet gestelde regels dan wel aan de vergunning verbonden voorschriften en beperkingen.
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel18
  - number: '18.5'
    text: |-
      Onze Minister neemt het besluit, bedoeld in het tweede, onderscheidenlijk het derde lid, in de periode tussen vijf
      en twee jaar voor afloop van de vergunning, met dien verstande dat bij het gebruik van frequentieruimte door of ten
      behoeve van commerciële media-instellingen als bedoeld in [artikel 1.1 van de Mediawet 2008](onbekend) deze periode
      tussen vijf en één jaar voor afloop van de vergunning bedraagt.
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel18
  - number: '18.6'
    text: |-
      Op de voorbereiding van het besluit, bedoeld in het tweede onderscheidenlijk het derde lid, is afdeling 3.4 van de
      Algemene wet bestuursrecht van toepassing.
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel18
  - number: '18.7'
    text: |-
      Onze Minister maakt het besluit, bedoeld in het tweede onderscheidenlijk het derde lid, bekend in de Staatscourant,
      alsmede de verlengingsperiode en, voor zover dit op dat moment reeds mogelijk is, de voorschriften en beperkingen
      die bij verlenging zullen worden gewijzigd of aan de vergunning zullen worden verbonden.
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel18
  - number: '18.8'
    text: Een aanvraag om verlenging wordt ingediend binnen een bij ministeriële regeling te bepalen periode.
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel18
  - number: '18.9'
    text: |-
      Voorafgaand aan de aanvraagperiode, bedoeld in het achtste lid, maakt Onze Minister in voorkomend geval de regels,
      bedoeld in [artikel 3.15, eerste lid, van de wet][ref1] bekend.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
  - number: '18.10'
    text: |-
      Een aanvraag om verlenging kan worden afgewezen met overeenkomstige toepassing van [artikel 3.19 van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
  - number: '18.11'
    text: |-
      Indien de continuïteit van dienstverlening naar het oordeel van Onze Minister in het geding is, kan hij, in
      afwijking van het vijfde lid, vanaf twee jaar voor afloop van de vergunning een vergunning ambtshalve verlengen
      voor een door hem te bepalen termijn. Onze Minister maakt tevens met het besluit, bedoeld in de eerste volzin,
      de regels, bedoeld in [artikel 3.15, eerste lid, van de wet][ref1], de verlengingsperiode en de voorschriften
      en beperkingen die bij verlenging zullen worden gewijzigd of aan de vergunning zullen worden verbonden, bekend.
      Indien bij de verlenging, bedoeld in de eerste volzin toepassing gegeven wordt aan het veertiende lid, kunnen de
      wijzigingen en toevoegingen bedoeld in dat lid ingaan op een eerdere datum dan die waarop de looptijd van de te
      verlengen vergunning verstrijkt.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
  - number: '18.12'
    text: |-
      Het eerste, tweede en derde lid zijn van overeenkomstige toepassing op een vergunning die op grond van de
      [artikelen 3.19a][ref1] of [3.20 van de wet][ref2] is verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '3'
  - number: '18.13'
    text: |-
      Vergunningen die zijn verleend met toepassing van de procedure, bedoeld in
      [artikel 3.6, eerste lid, van de wet][ref1], worden op aanvraag verlengd, tenzij een doelmatige ordening van het
      frequentiespectrum zich daartegen verzet.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
  - number: '18.14'
    text: |-
      In het geval een vergunning wordt verlengd kunnen de aan de vergunning verbonden voorschriften en beperkingen
      worden gewijzigd en kunnen nieuwe voorschriften en beperkingen aan de vergunning worden toegevoegd.
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel18
  - number: '18.15'
    text: |-
      Bij ministeriële regeling kunnen nadere regels gesteld worden omtrent de verlenging van vergunningen. Deze regels
      kunnen per te verlenen vergunning verschillen.
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel18
  - number: 18a.1
    text: |-
      Vergunningen die betrekking hebben op geharmoniseerde frequentieruimte voor het gebruik voor
      draadlozebreedbanddiensten als bedoeld in artikel 49, tweede lid, van [richtlijn (EU) 2018/1972](32018L1972),
      worden verleend voor een termijn van ten minste vijftien jaar.
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel18a
  - number: 18a.2
    text: |-
      Indien de looptijd van de in het eerste lid bedoelde vergunningen minder dan twintig jaar bedraagt, zijn het derde
      tot en met het zesde lid van toepassing.
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel18a
  - number: 18a.3
    text: |-
      Bij het besluit, bedoeld in [artikel 3.10, vierde lid, van de wet][ref1], worden algemene criteria
      vastgesteld voor de verlenging ervan tot ten minste een totale looptijd van twintig jaar. De termijn voor
      het naar voren brengen van zienswijzen over het ontwerp van de algemene criteria bedraagt in afwijking van
      [artikel 3:16, eerste lid, van de Algemene wet bestuursrecht][ref2] drie maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel18a
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '3'
  - number: 18a.4
    text: |-
      De in het derde lid bedoelde algemene criteria hebben betrekking op een doelmatig gebruik van frequentieruimte, het
      bevorderen van breedbanddekking, van de dekking van transportroutes en van technologische ontwikkeling betreffende
      draadloze communicatie, de waarborging van de veiligheid van het leven, de openbare orde, de openbare veiligheid,
      de defensie of de waarborging van ongestoorde mededinging.
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel18a
  - number: 18a.5
    text: |-
      Uiterlijk twee jaar voor afloop van een vergunning verlengt Onze Minister op aanvraag die vergunning indien uit
      een beoordeling volgt dat voldaan wordt aan de algemene criteria, tenzij de oplegging van een last onder dwangsom
      of een bestuurlijke boete aan de vergunninghouder of het voornemen daartoe vanwege een overtreding van de bij of
      krachtens de wet dan wel de aan de vergunning verbonden voorschriften en beperkingen zich naar het oordeel van
      Onze Minister daar tegen verzet. [Artikel 18, negende, elfde en twaalfde lid][ref1], zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0032895#Artikel18
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel18a
    references:
      - id: ref1
        bwb_id: BWBR0032895
        artikel: '18'
        hoofdstuk: '3'
        paragraaf: '3.6'
  - number: 18a.6
    text: |-
      Op de voorbereiding van een besluit tot verlenging als bedoeld in het vijfde lid
      is [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing, met dien
      verstande dat de termijn voor het naar voren brengen van zienswijzen in afwijking van
      [artikel 3:16, eerste lid, van de Algemene wet bestuursrecht][ref2] drie maanden bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel18a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '3'
  - number: 18a.7
    text: |-
      Van het eerste tot en met het zesde lid kan worden afgeweken indien een vergunning als bedoeld in het eerste lid
      wordt verleend:
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel18a
  - number: 18a.7.a
    text: |-
      voor het aanbieden van diensten in een geografisch gebied waar de toegang tot netwerken met hoge snelheid zeer
      gebrekkig is en voor zover noodzakelijk voor het bereiken van de doelstellingen van artikel 45, tweede lid, van
      [richtlijn (EU) 2018/1972](32018L1972);;
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel18a
  - number: 18a.7.c
    text: |-
      voor frequentiegebruik dat kan samengaan met het gebruik voor de in het eerste lid bedoelde
      draadlozebreedbanddiensten;
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel18a
  - number: 18a.7.d
    text: |-
      voor een ander gebruik dan voor de in het eerste lid bedoelde draadlozebreedbanddiensten vanwege het ontbreken van
      vraag naar de frequentieruimte.
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel18a
  - number: 18a.8
    text: |-
      Om te bewerkstelligen dat de looptijd van vergunningen, bedoeld in het eerste lid, gelijktijdig verstrijkt met de
      looptijd van andere vergunningen, kan worden afgeweken van het eerste lid tot en met het zesde lid.
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel18a
  - number: 18a.9
    text: |-
      Bij besluit van Onze Minister kan ten aanzien van vergunningen als bedoeld in het eerste lid waarop het derde tot
      en met het zesde lid niet van toepassing zijn dan wel in gevallen waarin toepassing is gegeven aan het zevende
      lid of het achtste lid, kan [artikel 18, derde tot en met elfde lid en veertiende lid][ref1], van overeenkomstige
      toepassing worden verklaard.


      [ref1]: https://wetten.overheid.nl/BWBR0032895#Artikel18
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel18a
    references:
      - id: ref1
        bwb_id: BWBR0032895
        artikel: '18'
        hoofdstuk: '3'
        paragraaf: '3.6'
  - number: 18a.10
    text: |-
      In het geval een vergunning wordt verlengd overeenkomstig het vijfde lid kunnen de aan de vergunning verbonden
      voorschriften en beperkingen worden gewijzigd en kunnen nieuwe voorschriften en beperkingen aan de vergunning
      worden toegevoegd voor zover dit betrekking heeft op de algemene criteria.
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel18a
  - number: 18a.11
    text: |-
      Bij ministeriële regeling kunnen nadere regels gesteld worden omtrent de verlenging van vergunningen op grond van
      dit artikel. Deze regels kunnen per te verlenen vergunning verschillen.
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel18a
  - number: '19.1'
    text: 'Onze Minister publiceert in de Staatscourant een besluit als bedoeld in:'
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel19
  - number: 19.1.a
    text: |-
      [artikel 3.19a, eerste lid, van de wet][ref1] houdende dat de houder van een vergunning wordt verplicht om die
      vergunning geheel of gedeeltelijk over te dragen,


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
  - number: 19.1.b
    text: |-
      [artikel 3.19a, tweede lid, van de wet][ref1] houdende dat Onze Minister de procedure tot overdracht ter hand
      neemt.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
  - number: '19.2'
    text: |-
      Uiterlijk zeven dagen nadat het besluit, bedoeld in het eerste lid, onder a of b, is gepubliceerd, maakt Onze
      Minister bekend:
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel19
  - number: 19.2.a
    text: |-
      de termijn, bedoeld in [artikel 3.19a, eerste lid, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
  - number: 19.2.b
    text: |-
      de periode, bedoeld in [artikel 3.19a, vijfde lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
  - number: '20'
    text: 'Bij ministeriële regeling worden regels gesteld omtrent:'
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel20
  - number: 20.a
    text: de indiening van de aanvraag om toestemming of overdracht,
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel20
  - number: 20.b
    text: de eisen die ter verkrijging van toestemming of ter overdracht van de vergunning worden gesteld aan de aanvrager,
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel20
  - number: 20.c
    text: de inhoud van de aanvraag en de daarbij te overleggen gegevens.
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel20
  - number: '21.1'
    text: |-
      Tot een procedure ter verkrijging van toestemming en een procedure tot overdracht als bedoeld in
      [artikel 3.19a, eerste en tweede lid, van de wet][ref1] worden slechts toegelaten aanvragers die voldoen aan bij
      ministeriële regeling te stellen eisen. Deze eisen kunnen per vergunning verschillen.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
  - number: '21.2'
    text: 'De in het eerste lid bedoelde eisen kunnen slechts betrekking hebben op de:'
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel21
  - number: 21.2.a
    text: rechtsvorm van de aanvrager;
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel21
  - number: 21.2.b
    text: financiële positie van de aanvrager;
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel21
  - number: 21.2.c
    text: kennis en ervaring van de aanvrager;
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel21
  - number: 21.2.d
    text: technische middelen waarover de aanvrager kan beschikken;
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel21
  - number: 21.2.e
    text: hoedanigheid van de aanvrager als commerciële omroep;
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel21
  - number: 21.2.f
    text: door de aanvrager te leveren bijdrage aan de overgang van analoge naar digitale techniek.
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel21
  - number: '21.3'
    text: |-
      [Artikel 9, derde lid][ref1], is van overeenkomstige toepassing op de in het eerste lid bedoelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0032895#Artikel9
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0032895
        artikel: '9'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '21.4'
    text: |-
      Voor zover de aard, de omvang of het maatschappelijk belang van de vergunning daartoe naar het oordeel van Onze
      Minister aanleiding geeft, kunnen naast de eisen genoemd in het tweede en derde lid bij ministeriële regeling
      tevens regels worden gesteld in het belang van een evenwichtige verdeling dan wel een doelmatig gebruik van
      frequentieruimte.
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel21
  - number: '21.5'
    text: 'Toestemming wordt in ieder geval geweigerd indien:'
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel21
  - number: 21.5.a
    text: de aanvrager de latende vergunninghouder is,
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel21
  - number: 21.5.b
    text: |-
      de aanvrager op de latende vergunninghouder of de latende vergunninghouder op de aanvrager zodanige zeggenschap of
      feitelijke invloed heeft dat deze in belangrijke mate het beleid van de aanvrager of de latende vergunninghouder
      kan bepalen of aanmerkelijke invloed heeft op de inhoud van dat beleid, of
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel21
  - number: 21.5.c
    text: |-
      een natuurlijke persoon of groep van natuurlijke personen direct of indirect een zodanige zeggenschap of feitelijke
      invloed heeft in zowel de aanvrager als de latende vergunninghouder dat deze in belangrijke mate het beleid van
      beiden kan bepalen of aanmerkelijke invloed heeft op de inhoud van het beleid van beiden.
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel21
  - number: '22.1'
    text: |-
      Bij ministeriële regeling worden regels gesteld omtrent de wijze waarop de procedure ter verkrijging van
      toestemming en de procedure om te bepalen aan welke natuurlijke of rechtspersoon de vergunning wordt overgedragen
      plaatsvindt. Deze regeling kan per vergunning verschillen.
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel22
  - number: '22.2'
    text: 'De in het eerste lid bedoelde regels hebben in elk geval betrekking op:'
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel22
  - number: 22.2.a
    text: de door de aanvrager en de latende vergunninghouder in acht te nemen geheimhouding;
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel22
  - number: 22.2.b
    text: de wijze waarop een prijs voor de vergunning wordt geboden;
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel22
  - number: 22.2.c
    text: de wijze om te bepalen wie de hoogste prijs heeft geboden;
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel22
  - number: 22.2.d
    text: de eisen die aan een geldig bod worden gesteld;
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel22
  - number: 22.2.e
    text: |-
      de zekerheidstelling dat een bij of krachtens de [artikelen 3.10][ref1] of [3.15 van de wet][ref2] opgelegde
      financiële verplichting gestand wordt gedaan;


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '3'
  - number: 22.2.f
    text: de maatregelen ten behoeve van een ongestoord verloop van de in het eerste lid bedoelde procedure;
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel22
  - number: 22.2.g
    text: |-
      de door de vergunninghouder toe te passen methode ter vaststelling van het bod waarvan de uitbrenger in aanmerking
      komt voor verlening van de vergunning;
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel22
  - number: 22.2.h
    text: |-
      de eisen die worden gesteld met betrekking tot de wijze van betaling van de in onderdeel e bedoelde financiële
      verplichtingen, en het tijdstip waarop degene aan wie de vergunning wordt overgedragen deze betaling moet hebben
      verricht.
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel22
  - number: 22a
    text: |-
      De overdracht of verhuur van een vergunning als bedoeld in [artikel 3.20, eerste lid, van de wet][ref1],
      respectievelijk [artikel 3.20a, eerste lid, van de wet][ref2], is niet mogelijk voor vergunningen voor commerciële
      omroep, voor zover de overdracht of verhuur betrekking heeft op


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel22a
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '3'
  - number: 22a.a
    text: een gedeelte van een vergunning die betrekking heeft op de frequentieband 87.5 MHz tot 104.9 MHz, en;
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel22a
  - number: 22a.b
    text: |-
      een vergunning voor gebruik van frequentieruimte die ingevolge het Nationaal Frequentieplan slechts tegelijkertijd
      met een vergunning voor gekoppelde frequentieruimte kan worden gebruikt, tenzij de overdracht of verhuur beide
      vergunningen betreft.
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel22a
  - number: '23.1'
    text: 'In het antenneregister worden gegevens opgenomen van:'
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel23
  - number: 23.1.a
    text: |-
      antennes die zijn geplaatst op een vaste locatie met het doel met een zendvermogen van meer dan 10 dB watt
      Effective Radiated Power (ERP) uit te gaan zenden;
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel23
  - number: 23.1.b
    text: |-
      antennes die zijn geplaatst op een vaste locatie en die tot een netwerk behoren, indien meer dan de helft van het
      aantal antennes van het netwerk een zendvermogen van meer dan 10 dB watt ERP heeft;
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel23
  - number: 23.1.c
    text: antennes van radiozendamateurs die zijn geregistreerd als gebruiker van frequentieruimte;
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel23
  - number: 23.1.d
    text: |-
      antennes waarop bij of krachtens artikel 57, tweede lid, van [richtlijn (EU) 2018/1972](32018L1972) gestelde regels
      van toepassing zijn.
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel23
  - number: '23.2'
    text: |-
      Van het eerste lid zijn uitgezonderd de gegevens van antennes in gebruik bij overheidsorganen die een taak
      uitoefenen op het terrein van politie, justitie of veiligheid.
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel23
  - number: '24.1'
    text: |-
      In het antenneregister worden voor de antennes, bedoeld in [artikel 23, eerste lid, onderdelen a, b en d][ref1], de
      volgende gegevens opgenomen:


      [ref1]: https://wetten.overheid.nl/BWBR0032895#Artikel23
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0032895
        artikel: '23'
        hoofdstuk: '4'
  - number: 24.1.a
    text: de toepassing van de antenne;
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel24
  - number: 24.1.b
    text: de hoogte gemeten vanaf het maaiveld tot het geometrische midden van de antenne;
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel24
  - number: 24.1.c
    text: de frequentie van de gebruikte toepassing;
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel24
  - number: 24.1.d
    text: de hoofdstraalrichting van de antenne;
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel24
  - number: 24.1.e
    text: het zendvermogen van de antenne in de hoofdstraalrichting aangeduid in dB watt ERP;
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel24
  - number: 24.1.f
    text: de datum van ingebruikname van de antenne;
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel24
  - number: 24.1.g
    text: |-
      de locatie van de antenne-installatie, onder vermelding van de geografische positie in graden, minuten, seconden
      volgens het Europees Terrestrisch Referentiesysteem 89 of het World Geodetic System 1984, in ieder geval met een
      nauwkeurigheid van 15 meter;
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel24
  - number: 24.1.h
    text: |-
      de verklaring dat de antenne voldoet aan de eisen van de krachtens artikel 57, tweede lid, van
      [richtlijn (EU) 2018/1972](32018L1972) gestelde regels, indien het een antenne als bedoeld in
      [artikel 23, eerste lid, onderdeel d][ref1], betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0032895#Artikel23
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0032895
        artikel: '23'
        hoofdstuk: '4'
  - number: '24.2'
    text: |-
      De gegevens, bedoeld in het eerste lid, worden aan Onze Minister verstrekt door diegene die de frequentie gebruikt
      of wil gebruiken.
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel24
  - number: '25.1'
    text: |-
      In het antenneregister worden voor de antennes als bedoeld in [artikel 23, eerste lid, onderdeel c][ref1], de
      volgende gegevens opgenomen:


      [ref1]: https://wetten.overheid.nl/BWBR0032895#Artikel23
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0032895
        artikel: '23'
        hoofdstuk: '4'
  - number: 25.1.a
    text: |-
      de locatie van de antenne-installatie, met een nauwkeurigheid van 15 meter, aangeduid met toepassing van het World
      Geodetic System 1984;
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel25
  - number: 25.1.b
    text: het type registratie.
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel25
  - number: '25.2'
    text: |-
      De gegevens, bedoeld in het eerste lid, worden aan Onze Minister verstrekt door de radiozendamateur die zich voor
      het gebruik van frequentieruimte heeft geregistreerd.
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel25
  - number: '25.3'
    text: |-
      Onze Minister kan gegevens die door radiozendamateurs worden verstrekt in het kader van de registratie opnemen in
      het antenneregister.
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel25
  - number: '26'
    text: 'Bij ministeriële regeling worden regels gesteld met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel26
  - number: 26.a
    text: de inrichting van het antenneregister;
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel26
  - number: 26.b
    text: het tijdstip waarop de gegevens worden aangeleverd;
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel26
  - number: 26.c
    text: de wijze waarop en de vorm waarin de gegevens aangeleverd worden;
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel26
  - number: 26.d
    text: de wijze waarop van de gegevens kennis wordt genomen.
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel26
  - number: '27.1'
    text: |-
      Bij ministeriële regeling wordt frequentieruimte als bedoeld in [artikel 5a.3, tweede lid, van de wet][ref1],
      aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel5a
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: 5a
  - number: '27.2'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld als bedoeld in [artikel 5a.14, eerste lid][ref1],
      en [5a.15 van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel5a
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel5a
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel27
    references:
      - id: ref1
