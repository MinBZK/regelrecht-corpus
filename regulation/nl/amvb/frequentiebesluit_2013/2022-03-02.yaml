  - number: 22a
    text: |-
      De overdracht of verhuur van een vergunning als bedoeld in [artikel 3.20, eerste lid, van de wet][ref1],
      respectievelijk [artikel 3.20a, eerste lid, van de wet][ref2], is niet mogelijk voor vergunningen voor commerciële
      omroep, voor zover de overdracht of verhuur betrekking heeft op

      a. een gedeelte van een vergunning die betrekking heeft op de frequentieband 87.5 MHz tot 104.9 MHz, en;

      b. een vergunning voor gebruik van frequentieruimte die ingevolge het Nationaal Frequentieplan slechts
      tegelijkertijd met een vergunning voor gekoppelde frequentieruimte kan worden gebruikt, tenzij de overdracht of
      verhuur beide vergunningen betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3.20
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel3.20a
