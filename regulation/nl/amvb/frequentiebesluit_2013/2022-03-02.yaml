    text: |-
      1 Bij ministeriële regeling kunnen categorieën radioapparaten worden aangewezen ten aanzien waarvan voor het
      gebruik van frequentieruimte geen vergunning is vereist en geen meldingsplicht geldt.

      2 De aanwijzing van categorieën radioapparaten, bedoeld in het eerste lid, kan uitsluitend geschieden voor
      zover het radioapparaten betreft, die geen of vrijwel geen storing of belemmering veroorzaken in elektrische of
      elektronische apparaten.

      3 Met betrekking tot het gebruik als bedoeld in het eerste lid en
      [artikel 10.15, tweede lid, onderdelen c en d, van de wet][ref1] kunnen bij ministeriële regeling regels worden
      gesteld:

      a. inzake de doelmatigheid van het gebruik;

      b. inzake de aard van de radioapparaten en de daarbij behorende antenne-inrichtingen alsmede het vermogen waarmee
      mag worden uitgezonden;

      c. ter uitvoering van verplichtingen die voorvloeien uit verdragen of uit bindende besluiten van volkenrechtelijk
      organisaties aangaande het gebruik van frequentieruimte.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel10.15
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel2
