  - number: '5'
    text: |-
      1 Degene die voornemens is frequentieruimte waarvoor geen vergunning is vereist te gebruiken als bedoeld in
      [artikel 3, eerste lid][ref1], doet hiervan melding aan Onze Minister.

      2 Onze Minister registreert het in de melding bedoelde frequentiegebruik tenzij niet wordt voldaan aan bij
      ministeriële regeling te stellen regels.

      3 De frequentieruimte voor het gebruik waarvan geen vergunning is vereist, wordt slechts gebruikt indien het
      gebruik is geregistreerd overeenkomstig het tweede lid.

      4 Met het oog op de identificatie van het radioapparaat kent Onze Minister in bij ministeriële regeling te bepalen
      gevallen aan degene die de melding heeft gedaan een combinatie van letters of cijfers toe.

      5 Bij ministeriële regeling kunnen nadere regels worden gesteld ter zake van de melding, de registratie en de
      toekenning van de combinatie van letters of cijfers.


      [ref1]: https://wetten.overheid.nl/BWBR0032895#Artikel3
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel5
