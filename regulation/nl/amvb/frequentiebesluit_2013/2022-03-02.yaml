  - number: '22'
    text: |-
      1 Bij ministeriële regeling worden regels gesteld omtrent de wijze waarop de procedure ter verkrijging van
      toestemming en de procedure om te bepalen aan welke natuurlijke of rechtspersoon de vergunning wordt overgedragen
      plaatsvindt. Deze regeling kan per vergunning verschillen.

      2 De in het eerste lid bedoelde regels hebben in elk geval betrekking op:

      a. de door de aanvrager en de latende vergunninghouder in acht te nemen geheimhouding;

      b. de wijze waarop een prijs voor de vergunning wordt geboden;

      c. de wijze om te bepalen wie de hoogste prijs heeft geboden;

      d. de eisen die aan een geldig bod worden gesteld;

      e. de zekerheidstelling dat een bij of krachtens de [artikelen 3.10][ref1] of [3.15 van de wet][ref2] opgelegde
      financiële verplichting gestand wordt gedaan;

      f. de maatregelen ten behoeve van een ongestoord verloop van de in het eerste lid bedoelde procedure;

      g. de door de vergunninghouder toe te passen methode ter vaststelling van het bod waarvan de uitbrenger in
      aanmerking komt voor verlening van de vergunning;

      h. de eisen die worden gesteld met betrekking tot de wijze van betaling van de in onderdeel e bedoelde financiële
      verplichtingen, en het tijdstip waarop degene aan wie de vergunning wordt overgedragen deze betaling moet hebben
      verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3.10
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel3.15
