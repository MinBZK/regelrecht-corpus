preamble:
  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Op de voordracht van de Minister van Economische Zaken, Landbouw en Innovatie van 21 juni 2011, nr. WJZ / 11081232;


    Gelet op de artikelen 3.4, derde lid, 3.9, 3.16, eerste lid, 3.17, eerste tot en met derde lid, 3.22, vierde
    lid, 3.23, tweede tot en met vierde lid, 3.24, eerste lid, 3.25, eerste lid, 10.8, 13.4, 16.1 en 18.12 van de
    Telecommunicatiewet, artikel 1.2, tweede lid, van de Wet luchtvaart en de artikelen 19, eerste lid, en 64 van de
    Zeevaartbemanningswet;


    De Afdeling advisering van de Raad van State gehoord (advies van 15 september 2011, nr. W 15.11.0235/IV);


    Gezien het nader rapport van de Minister van Economische Zaken van 5 februari 2013, nr. WJZ / 12048871;


    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. *wet:* [Telecommunicatiewet][ref1];

      b. *vergunning:* vergunning als bedoeld in [artikel 3.13, eerste lid, van de wet][ref2];

      c. *antenneregister:* openbaar antenneregister als bedoeld in [artikel 3.23, eerste lid, van de wet][ref3];

      d. *geharmoniseerde frequentieruimte:* frequentieruimte waarvoor door middel van technische uitvoeringsmaatregelen
      op grond van Beschikking nr. 676/2002/EG van het Europees Parlement en de Raad van 7 maart 2002 (PbEG 2002, L 108)
      of een andere vergelijkbare maatregel gebaseerd op artikel 114 van het Verdrag betreffende de Werking van de
      Europese Unie, geharmoniseerde voorwaarden zijn vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0009950
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel3.13
      [ref3]: https://wetten.overheid.nl/BWBR0009950#Artikel3.23
