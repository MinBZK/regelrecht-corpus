  - number: '20'
    text: >-
      Bij ministeriële regeling worden regels gesteld omtrent:


      a. de indiening van de aanvraag om toestemming of overdracht,


      b. de eisen die ter verkrijging van toestemming of ter overdracht van de vergunning worden gesteld aan de
      aanvrager,


      c. de inhoud van de aanvraag en de daarbij te overleggen gegevens.


      Deze regels kunnen per vergunning verschillen.
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel20
  - number: '21'
    text: |-
      1 Tot een procedure ter verkrijging van toestemming en een procedure tot overdracht als bedoeld in
      [artikel 3.19a, eerste en tweede lid, van de wet][ref1] worden slechts toegelaten aanvragers die voldoen aan bij
      ministeriële regeling te stellen eisen. Deze eisen kunnen per vergunning verschillen.

      2 De in het eerste lid bedoelde eisen kunnen slechts betrekking hebben op de:

      a. rechtsvorm van de aanvrager;

      b. financiële positie van de aanvrager;

      c. kennis en ervaring van de aanvrager;

      d. technische middelen waarover de aanvrager kan beschikken;

      e. hoedanigheid van de aanvrager als commerciële omroep;

      f. door de aanvrager te leveren bijdrage aan de overgang van analoge naar digitale techniek.

      3 [Artikel 9, derde lid][ref2], is van overeenkomstige toepassing op de in het eerste lid bedoelde eisen.

      4 Voor zover de aard, de omvang of het maatschappelijk belang van de vergunning daartoe naar het oordeel van Onze
      Minister aanleiding geeft, kunnen naast de eisen genoemd in het tweede en derde lid bij ministeriële regeling
      tevens regels worden gesteld in het belang van een evenwichtige verdeling dan wel een doelmatig gebruik van
      frequentieruimte.

      5 Toestemming wordt in ieder geval geweigerd indien:

      a. de aanvrager de latende vergunninghouder is,

      b. de aanvrager op de latende vergunninghouder of de latende vergunninghouder op de aanvrager zodanige zeggenschap
      of feitelijke invloed heeft dat deze in belangrijke mate het beleid van de aanvrager of de latende vergunninghouder
      kan bepalen of aanmerkelijke invloed heeft op de inhoud van dat beleid, of

      c. een natuurlijke persoon of groep van natuurlijke personen direct of indirect een zodanige zeggenschap of
      feitelijke invloed heeft in zowel de aanvrager als de latende vergunninghouder dat deze in belangrijke mate het
      beleid van beiden kan bepalen of aanmerkelijke invloed heeft op de inhoud van het beleid van beiden.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3.19a
      [ref2]: https://wetten.overheid.nl/BWBR0032895#Artikel9
