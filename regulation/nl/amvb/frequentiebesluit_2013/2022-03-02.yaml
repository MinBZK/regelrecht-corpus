  - number: '26'
    text: >-
      Bij ministeriële regeling worden regels gesteld met betrekking tot:


      a. de inrichting van het antenneregister;


      b. het tijdstip waarop de gegevens worden aangeleverd;


      c. de wijze waarop en de vorm waarin de gegevens aangeleverd worden;


      d. de wijze waarop van de gegevens kennis wordt genomen.
    url: https://wetten.overheid.nl/BWBR0032895/2022-03-02#Artikel26
  - number: '27'
    text: |-
      1 Bij ministeriële regeling wordt frequentieruimte als bedoeld in [artikel 5a.3, tweede lid, van de wet][ref1],
      aangewezen.

      2 Bij ministeriële regeling kunnen nadere regels worden gesteld als bedoeld in [artikel 5a.14, eerste lid][ref2],
      en [5a.15 van de wet][ref3].


