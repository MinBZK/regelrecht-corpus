preamble:
  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Op de voordracht van Onze Minister van Justitie van 10 maart 2008, directie Wetgeving, nr. 5534775/08/6


    Gelet op de artikelen 15a, achtste lid, en 15b, derde lid, van het Wetboek van Strafrecht;


    De Raad van State gehoord (advies van 17 april 2008, nr. W03.08.0090/II);


    Gezien het nader rapport van Onze Minister van Justitie van 4 juni 2008, directie Wetgeving, nr. 5547481/08/6;


    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0024029/2012-04-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. wet: het [Wetboek van Strafrecht][ref1];

      b. reclassering: een reclasseringsinstelling als bedoeld in
      [artikel 1, onderdeel b, van de Reclasseringsregeling 1995][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001854
      [ref2]: https://wetten.overheid.nl/BWBR0007120#Artikel1
    url: https://wetten.overheid.nl/BWBR0024029/2012-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001854
      - id: ref2
        bwb_id: BWBR0007120
        artikel: '1'
  - number: '2'
    text: >-
      1 Het openbaar ministerie beslist of aan de voorwaardelijke invrijheidstelling, naast de algemene voorwaarde,
      bijzondere voorwaarden worden verbonden.


      2 Indien bijzondere voorwaarden aan de voorwaardelijke invrijheidstelling worden verbonden, beslist het openbaar
      ministerie tevens of:


      a. aan de bijzondere voorwaarden elektronisch toezicht wordt verbonden;


      b. opdracht wordt gegeven aan de reclassering om toezicht te houden op de naleving van de bijzondere voorwaarden
      door de veroordeelde.


      3 Het openbaar ministerie houdt bij de beslissingen, bedoeld in het eerste en twee lid, rekening met de adviezen
      ontvangen van de directeur van de penitentiaire inrichting, waar de veroordeelde staat ingeschreven, en de
      reclassering.


      4 De adviezen van de directeur van de inrichting en de reclassering vermelden welke bijzondere voorwaarden
      worden voorgesteld en de redenen waarom deze voorwaarden worden voorgesteld. De adviezen vermelden voorts of het
      aangewezen is aan enige bijzondere voorwaarde elektronisch toezicht te verbinden.


      5 Indien de reclassering toezicht op de naleving van de voorwaarden aangewezen acht, vermeldt zij wat de aard en
      intensiteit is van het toezicht dat op de veroordeelde dient te worden uitgeoefend.


      6 De adviezen vermelden voorts het standpunt van de veroordeelde over de voorgestelde bijzondere voorwaarden.


      7 Bij de beslissing over bijzondere voorwaarden houdt het openbaar ministerie rekening met bijzondere voorwaarden
      die de veroordeelde eventueel in een ander strafrechtelijk kader zijn opgelegd en waarvan de proeftijd aanvangt of
      wordt voorgezet op het moment van voorwaardelijke invrijheidstelling. In het advies van de reclassering wordt hier
      aandacht aan besteed.
    url: https://wetten.overheid.nl/BWBR0024029/2012-04-01#Artikel2
  - number: '3'
    text: >-
      1 De beslissing om bijzondere voorwaarden te stellen wordt schriftelijk gemotiveerd.


      2 De veroordeelde wordt zo spoedig mogelijk schriftelijk door het openbaar ministerie op de hoogte gesteld van
      de beslissing omtrent de bijzondere voorwaarden. Een afschrift van de beslissing wordt aan de directeur van de
      inrichting en de reclassering verzonden.
    url: https://wetten.overheid.nl/BWBR0024029/2012-04-01#Artikel3
  - number: '4'
    text: >-
      1 Het openbaar ministerie vult de bijzondere voorwaarden aan, wijzigt ze of heft ze op, indien de naleving van de
      voorwaarden door de veroordeelde dan wel wijziging van overige omstandigheden daar aanleiding toe geeft.


      2 Het openbaar ministerie stelt de veroordeelde zo spoedig mogelijk schriftelijk op de hoogte van enige aanvulling,
      wijziging of opheffing van de bijzondere voorwaarden.


      3 Het openbaar ministerie stelt tevens de reclasseringsinstelling die belast is met het toezicht, zo spoedig
      mogelijk op de hoogte van enige aanvulling, wijziging of opheffing van de bijzondere voorwaarden.
    url: https://wetten.overheid.nl/BWBR0024029/2012-04-01#Artikel4
  - number: '5'
    text: >-
      1 In opdracht en onder verantwoordelijkheid van het openbaar ministerie, kan een reclasseringsinstelling
      worden belast met het houden van toezicht op de naleving door de veroordeelde van de aan de voorwaardelijke
      invrijheidstelling verbonden voorwaarden.


      2 Het openbaar ministerie kan de reclasseringsinstelling die belast is met het toezicht, aanwijzingen geven omtrent
      het toezicht op de naleving van de voorwaarden.


      3 Het toezicht op de naleving van de voorwaarden kan te allen tijde door het openbaar ministerie worden beëindigd.
      Het openbaar ministerie stelt de veroordeelde en de reclasseringsinstelling die belast is met het toezicht, zo
      spoedig mogelijk op de hoogte van de beëindiging van het toezicht.
    url: https://wetten.overheid.nl/BWBR0024029/2012-04-01#Artikel5
  - number: '6'
    text: >-
      1 De reclasseringsinstelling die belast is met het toezicht, draagt er zorg voor dat de aard en de intensiteit
      van het toezicht en de verplichtingen waaraan de veroordeelde zich in het kader van het toezicht heeft te houden,
      worden vastgelegd.


      2 De reclassering draagt er zorg voor dat het toezicht aanvangt, zodra de veroordeelde voorwaardelijk in vrijheid
      wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0024029/2012-04-01#Artikel6
  - number: '7'
    text: >-
      1 De veroordeelde volgt de aanwijzingen en opdrachten op die door de reclassering worden gegeven in het kader van
      het toezicht.


      2 De veroordeelde geeft veranderingen in de woon- of werksituatie onmiddellijk door aan de reclassering.
    url: https://wetten.overheid.nl/BWBR0024029/2012-04-01#Artikel7
  - number: '8'
    text: >-
      1 Indien een aan de voorwaardelijke invrijheidstelling verbonden voorwaarde door de veroordeelde niet wordt
      nageleefd, meldt de reclasseringsinstelling die belast is met het toezicht, dit onverwijld aan het openbaar
      ministerie.


      2 Zo spoedig mogelijk na de melding, bedoeld in het eerste lid, brengt de reclasseringsinstelling advies uit aan
      het openbaar ministerie of de melding naar haar oordeel aanleiding zou kunnen geven tot een van de navolgende
      maatregelen:


      a. het aanvullen, wijzigen of opheffen van de bijzondere voorwaarden;


      b. het instellen van een vordering tot herroeping van de voorwaardelijke invrijheidstelling.
    url: https://wetten.overheid.nl/BWBR0024029/2012-04-01#Artikel8
  - number: '9'
    text: >-
      Nadat de proeftijd van de bijzondere voorwaarden is geëindigd, stuurt de reclasseringsinstelling zo spoedig
      mogelijk een afloopbericht dat het toezicht is beëindigd aan het openbaar ministerie. In het afloopbericht wordt
      het feitelijk verloop van het toezicht aangegeven.
    url: https://wetten.overheid.nl/BWBR0024029/2012-04-01#Artikel9
