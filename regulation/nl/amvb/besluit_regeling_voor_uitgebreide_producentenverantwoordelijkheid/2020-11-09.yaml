---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_regeling_voor_uitgebreide_producentenverantwoordelijkheid
regulatory_layer: AMVB
publication_date: '2020-10-12'
valid_from: '2020-11-09'
bwb_id: BWBR0044197
url: https://wetten.overheid.nl/BWBR0044197/2020-11-09
preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister voor Milieu en Wonen van 8 april 2020, nr. IenW/BSK-2020/43287, Hoofddirectie
    Bestuurlijke en Juridische Zaken;

    Gelet op Richtlijn (EU) 2018/851 van het Europees Parlement en de Raad van 30 mei 2018 tot wijziging van Richtlijn
    2008/98/EG betreffende afvalstoffen (PbEU 2018, L 150) alsmede artikel 9.5.2, eerste lid, van de Wet milieubeheer;

    De Afdeling advisering van de Raad van State gehoord (advies van 8 juli 2020, nr.W17.20.0103/IV);

    Gezien het nader rapport van de Staatssecretaris van Infrastructuur en Waterstaat van 11 september 2020, nr. IenW/
    BSK-2020/156218, Hoofddirectie Bestuurlijke en Juridische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0044197/2020-11-09#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder: - *in de handel brengen:* voor het eerst op
      de markt aanbieden van stoffen, mengsels of producten;
        - *producent:* degene die beroepsmatig, ongeacht de gebruikte verkooptechniek, stoffen, mengsels of producten in
      Nederland in de handel brengt;
        - *producentenorganisatie:* de organisatie die namens producenten verplichtingen uit hoofde van een regeling voor
      uitgebreide producentenverantwoordelijkheid nakomt;
        - *wet:* [Wet milieubeheer][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0044197/2020-11-09#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003245
  - number: '1.2'
    text: |-
      Dit besluit is van toepassing wanneer een regeling voor uitgebreide producentenverantwoordelijkheid op grond van
      [artikel 9.5.2 van de wet][ref1] is vastgesteld, vanaf het tijdstip van de vaststelling van die regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0044197/2020-11-09#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
  - number: '2.1'
    text: |-
      De producent is verantwoordelijk voor het nakomen van de verplichtingen die in de regeling voor uitgebreide
      producentenverantwoordelijkheid zijn gesteld, waaronder het behalen van de in die regeling gestelde doelstellingen.
    url: https://wetten.overheid.nl/BWBR0044197/2020-11-09#Artikel2
  - number: '2.2'
    text: |-
      De producent zorgt voor een passende beschikbaarheid van een innamesysteem voor de stoffen, mengsels of producten
      waar de regeling voor uitgebreide producentenverantwoordelijkheid betrekking op heeft. Onder «passend» wordt in
      ieder geval verstaan dat het innamesysteem:
    url: https://wetten.overheid.nl/BWBR0044197/2020-11-09#Artikel2
  - number: 2.2.a
    text: |-
      gedurende het gehele jaar beschikbaar is en niet beperkt is tot gebieden waar de inname en het beheer van de
      betreffende afvalstoffen het meest kostenefficiënt is, en
    url: https://wetten.overheid.nl/BWBR0044197/2020-11-09#Artikel2
  - number: 2.2.b
    text: |-
      degene die voornemens is zich van de betreffende stoffen, mengsels of producten te ontdoen in staat stelt om deze
      kosteloos bij het innamesysteem in te leveren.
    url: https://wetten.overheid.nl/BWBR0044197/2020-11-09#Artikel2
  - number: '2.3'
    text: |-
      De producent informeert afvalstoffenhouders van de stoffen, mengsels of producten die hij in de handel
      brengt en waar de regeling voor uitgebreide producentenverantwoordelijkheid betrekking op heeft over
      afvalpreventiemaatregelen, innamesystemen, voorzieningen voor hergebruik of nuttige toepassing en de preventie
      van zwerfafval.
    url: https://wetten.overheid.nl/BWBR0044197/2020-11-09#Artikel2
  - number: '3.1'
    text: |-
      De producent beschikt over de financiële of financiële en organisatorische middelen die nodig zijn om aan de
      verplichtingen te voldoen die voortvloeien uit de uitgebreide producentenverantwoordelijkheid.
    url: https://wetten.overheid.nl/BWBR0044197/2020-11-09#Artikel3
  - number: '3.2'
    text: |-
      De producent draagt in ieder geval de kosten voor het nakomen van de verplichtingen, bedoeld in [artikel 2][ref1],
      [4][ref2] en [5][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0044197#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0044197#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0044197#Artikel5
    url: https://wetten.overheid.nl/BWBR0044197/2020-11-09#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0044197
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0044197
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0044197
        artikel: '5'
  - number: '3.3'
    text: |-
      De producent zorgt voor een adequaat mechanisme voor zelfbeheer, dat is gericht op het waarborgen van de
      continuïteit van de financiële of financiële en organisatorische middelen, bedoeld in het eerste lid, en de
      kwaliteit van het verslag, bedoeld in [artikel 5][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0044197#Artikel5
    url: https://wetten.overheid.nl/BWBR0044197/2020-11-09#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0044197
        artikel: '5'
  - number: '4.1'
    text: |-
      De producent doet binnen zes weken nadat een regeling voor uitgebreide producentenverantwoordelijkheid op
      de producent van toepassing is geworden melding aan Onze minister over de nakoming van de verplichtingen ter
      uitvoering van de uitgebreide producentenverantwoordelijkheid.
    url: https://wetten.overheid.nl/BWBR0044197/2020-11-09#Artikel4
  - number: '4.2'
    text: 'De melding omvat in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0044197/2020-11-09#Artikel4
  - number: 4.2.a
    text: de naam en het adres van de rechtspersoon die de melding doet;
    url: https://wetten.overheid.nl/BWBR0044197/2020-11-09#Artikel4
  - number: 4.2.b
    text: de dagtekening;
    url: https://wetten.overheid.nl/BWBR0044197/2020-11-09#Artikel4
  - number: 4.2.c
    text: |-
      een omschrijving van de stoffen, mengsels of producten die de producent op de markt brengt en waar de regeling voor
      uitgebreide producentenverantwoordelijkheid betrekking op heeft;
    url: https://wetten.overheid.nl/BWBR0044197/2020-11-09#Artikel4
  - number: 4.2.d
    text: |-
      een omschrijving van de wijze waarop de verplichtingen, bedoeld in [artikel 2, eerste lid][ref1], worden nagekomen;


      [ref1]: https://wetten.overheid.nl/BWBR0044197#Artikel2
    url: https://wetten.overheid.nl/BWBR0044197/2020-11-09#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0044197
        artikel: '2'
  - number: 4.2.e
    text: |-
      een omschrijving van het innamesysteem, bedoeld in [artikel 2, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0044197#Artikel2
    url: https://wetten.overheid.nl/BWBR0044197/2020-11-09#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0044197
        artikel: '2'
  - number: 4.2.f
    text: |-
      een overzicht van de financiële of financiële en organisatorische middelen, als bedoeld in
      [artikel 3, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0044197#Artikel3
    url: https://wetten.overheid.nl/BWBR0044197/2020-11-09#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0044197
        artikel: '3'
  - number: 4.2.g
    text: |-
      een omschrijving van het mechanisme van zelfbeheer, bedoeld in [artikel 3, derde lid][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0044197#Artikel3
    url: https://wetten.overheid.nl/BWBR0044197/2020-11-09#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0044197
        artikel: '3'
  - number: 4.2.h
    text: |-
      een vermelding van de wijze waarop de producent invulling geeft aan de informatieverplichting, bedoeld in
      [artikel 2, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0044197#Artikel2
    url: https://wetten.overheid.nl/BWBR0044197/2020-11-09#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0044197
        artikel: '2'
  - number: '4.3'
    text: |-
      Wanneer gezamenlijk uitvoering wordt gegeven aan de uitgebreide producentenverantwoordelijkheid als bedoeld in
      [artikel 6][ref1], wordt de melding aangevuld met:


      [ref1]: https://wetten.overheid.nl/BWBR0044197#Artikel6
    url: https://wetten.overheid.nl/BWBR0044197/2020-11-09#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0044197
        artikel: '6'
  - number: 4.3.a
    text: een vermelding van de producenten namens wie de melding wordt gedaan;
    url: https://wetten.overheid.nl/BWBR0044197/2020-11-09#Artikel4
  - number: 4.3.b
    text: |-
      de hoogte en de wijze van het berekenen van de financiële bijdragen aan de producentenorganisatie, bedoeld in
      [artikel 6, derde lid][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0044197#Artikel6
    url: https://wetten.overheid.nl/BWBR0044197/2020-11-09#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0044197
        artikel: '6'
  - number: 4.3.c
    text: |-
      de wijze van differentiatie van de financiële bijdragen aan de producentenorganisatie, bedoeld in
      [artikel 6, vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0044197#Artikel6
    url: https://wetten.overheid.nl/BWBR0044197/2020-11-09#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0044197
        artikel: '6'
  - number: '4.4'
    text: |-
      Als de gegevens, bedoeld in het tweede lid onder a en c, en derde lid, onder a, significant wijzigen doet de
      producent binnen zes weken melding van deze wijziging aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0044197/2020-11-09#Artikel4
  - number: '5.1'
    text: |-
      De producent brengt elk jaar op een in de regeling voor uitgebreide producentenverantwoordelijkheid te bepalen
      tijdstip over een daarin te bepalen termijn verslag uit aan Onze Minister met daarin:
    url: https://wetten.overheid.nl/BWBR0044197/2020-11-09#Artikel5
  - number: 5.1.a
    text: |-
      gegevens over het nakomen van de verplichtingen, bedoeld in [artikel 2, eerste lid][ref1], vergezeld van een
      document waarmee de verificatie van deze gegevens mogelijk is;


      [ref1]: https://wetten.overheid.nl/BWBR0044197#Artikel2
    url: https://wetten.overheid.nl/BWBR0044197/2020-11-09#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0044197
        artikel: '2'
  - number: 5.1.b
    text: |-
      gegevens over de uitvoering van het innamesysteem, bedoeld in [artikel 2, tweede lid][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0044197#Artikel2
    url: https://wetten.overheid.nl/BWBR0044197/2020-11-09#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0044197
        artikel: '2'
  - number: 5.1.c
    text: |-
      gegevens over de uitvoering van de informatieplicht, bedoeld in [artikel 2, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0044197#Artikel2
    url: https://wetten.overheid.nl/BWBR0044197/2020-11-09#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0044197
        artikel: '2'
  - number: '5.2'
    text: |-
      Wanneer gezamenlijk uitvoering wordt gegeven aan de uitgebreide producentenverantwoordelijkheid als bedoeld in
      [artikel 6][ref1], wordt het verslag aangevuld met een vermelding van de producenten namens wie het verslag wordt
      ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0044197#Artikel6
    url: https://wetten.overheid.nl/BWBR0044197/2020-11-09#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0044197
        artikel: '6'
  - number: '5.3'
    text: |-
      De producent zorgt ervoor dat de informatie over het behalen van de in de regeling voor uitgebreide
      producentenverantwoordelijkheid vastgestelde doelstellingen in ieder geval digitaal openbaar worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0044197/2020-11-09#Artikel5
  - number: '6.1'
    text: |-
      Producenten kunnen gezamenlijk uitvoering geven aan de verplichtingen, bedoeld in [artikel 2 tot en met 5][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0044197#Artikel2
    url: https://wetten.overheid.nl/BWBR0044197/2020-11-09#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0044197
        artikel: '2'
  - number: '6.2'
    text: |-
      Als uitvoering wordt gegeven aan het eerste lid, berusten de verplichtingen, bedoeld in dat lid, op de
      producentenorganisatie die namens de producenten een melding als bedoeld in [artikel 4][ref1] doet.


      [ref1]: https://wetten.overheid.nl/BWBR0044197#Artikel4
    url: https://wetten.overheid.nl/BWBR0044197/2020-11-09#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0044197
        artikel: '4'
  - number: '6.3'
    text: |-
      Met de financiële bijdragen van de producenten aan de producentenorganisatie worden in ieder geval de kosten gedekt
      die nodig zijn ter uitvoering van de verplichtingen die voortvloeien uit de [artikelen 2][ref1], [4][ref2] en
      [5][ref3], rekening houdend met de inkomsten uit het hergebruik, de verkoop van secundaire grondstoffen van hun
      producten en niet-opgeëist statiegeld.


      [ref1]: https://wetten.overheid.nl/BWBR0044197#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0044197#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0044197#Artikel5
    url: https://wetten.overheid.nl/BWBR0044197/2020-11-09#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0044197
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0044197
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0044197
        artikel: '5'
  - number: '6.4'
    text: |-
      De financiële bijdragen van de producenten aan de producentenorganisatie worden voor afzonderlijke stoffen,
      mengsels of producten of groepen van soortgelijke stoffen, mengsels of producten indien mogelijk gedifferentieerd,
      waarbij rekening wordt gehouden met de gehele levenscyclus, duurzaamheid, repareerbaarheid, herbruikbaarheid en
      recyclebaarheid van de stoffen, mengsels of producten en met de aanwezigheid van gevaarlijke stoffen daarin.
    url: https://wetten.overheid.nl/BWBR0044197/2020-11-09#Artikel6
  - number: '6.5'
    text: |-
      De financiële bijdragen van de producenten aan de producentenorganisatie zijn niet hoger dan nodig om als
      producentenorganisatie goede en kostenefficiënte uitvoering te kunnen geven aan de namens de producent uit te
      voeren verplichtingen.
    url: https://wetten.overheid.nl/BWBR0044197/2020-11-09#Artikel6
  - number: '6.6'
    text: 'De producentenorganisatie maakt de volgende informatie digitaal openbaar:'
    url: https://wetten.overheid.nl/BWBR0044197/2020-11-09#Artikel6
  - number: 6.6.a
    text: een overzicht van de eigenaren en leden van de producentenorganisatie;
    url: https://wetten.overheid.nl/BWBR0044197/2020-11-09#Artikel6
  - number: 6.6.b
    text: de door de producenten betaalde financiële bijdragen, en
    url: https://wetten.overheid.nl/BWBR0044197/2020-11-09#Artikel6
  - number: 6.6.c
    text: de selectieprocedure voor de afvalbeheerders.
    url: https://wetten.overheid.nl/BWBR0044197/2020-11-09#Artikel6
  - number: '7'
    text: |-
      Dit besluit is tot 1 januari 2023 niet van toepassing op een regeling, bedoeld in [artikel 1, tweede lid][ref1],
      die voor 4 juli 2018 is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0044197#Artikel1
    url: https://wetten.overheid.nl/BWBR0044197/2020-11-09#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0044197
        artikel: '1'
  - number: '8'
    text: |-
      Dit besluit treedt in werking met ingang van de datum waarop de
      [Implementatiewet wijziging EU-kaderrichtlijn afvalstoffen][ref1] in werking treedt. Indien het Staatsblad waarin
      dit besluit wordt geplaatst, wordt uitgegeven na de in de eerste volzin bedoelde datum, treedt zij in werking vier
      weken na de datum van uitgifte van het Staatsblad waarin zij wordt geplaatst, en werkt zij terug tot en met de in
      de eerste volzin bedoelde datum.


      [ref1]: https://wetten.overheid.nl/BWBR0043601
    url: https://wetten.overheid.nl/BWBR0044197/2020-11-09#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0043601
  - number: '9'
    text: 'Dit besluit wordt aangehaald als: Besluit regeling voor uitgebreide producentenverantwoordelijkheid.'
    url: https://wetten.overheid.nl/BWBR0044197/2020-11-09#Artikel9
