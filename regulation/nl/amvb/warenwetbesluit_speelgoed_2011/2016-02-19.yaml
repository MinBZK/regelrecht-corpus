$id: warenwetbesluit_speelgoed_2011
regulatory_layer: AMVB
publication_date: '2016-02-18'
valid_from: '2016-02-19'
bwb_id: BWBR0029619
url: https://wetten.overheid.nl/BWBR0029619/2016-02-19
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Volksgezondheid, Welzijn en Sport van 24 november 2010, kenmerk VGP/
    VC 3035418, gedaan in overeenstemming met Onze Ministers van Economische Zaken, Landbouw en Innovatie en van
    Veiligheid en Justitie;

    Gelet op richtlijn nr. 2009/48/EG van het Europees Parlement en de Raad van de Europese Unie van 18 juni 2009
    betreffende de veiligheid van speelgoed (PbEU L 170), alsmede op de artikelen 4, eerste lid, 7a, 8, onderdelen a, b
    en c, 9, onderdeel b, 11, 12 , 13 en 32b van de Warenwet;

    De Afdeling advisering van de Raad van State gehoord (advies van 23 december 2010, nr. W13.10.1541/III);

    Gezien het nader rapport van Onze Minister van Volksgezondheid, Welzijn en Sport van 14 januari 2011, VGP/VC
    3044644, uitgebracht in overeenstemming met Onze Ministers van Economische Zaken, Landbouw en Innovatie en van
    Veiligheid en Justitie;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0029619/2016-02-19#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0029619/2016-02-19#Artikel1
  - number: 1.1.a
    text: |-
      *richtlijn 2009/48/EG:* [richtlijn nr. 2009/48/EG](32009L0048) van het Europees Parlement en de Raad van de
      Europese Unie van 18 juni 2009 betreffende de veiligheid van speelgoed (PbEU L 170);
    url: https://wetten.overheid.nl/BWBR0029619/2016-02-19#Artikel1
  - number: 1.1.b
    text: '*speelgoed:* hetgeen [richtlijn 2009/48/EG](32009L0048) daaronder verstaat;'
    url: https://wetten.overheid.nl/BWBR0029619/2016-02-19#Artikel1
  - number: 1.1.c
    text: '*fabrikant:* hetgeen [richtlijn 2009/48/EG](32009L0048) daaronder verstaat;'
    url: https://wetten.overheid.nl/BWBR0029619/2016-02-19#Artikel1
  - number: 1.1.d
    text: '*gemachtigde:* hetgeen [richtlijn 2009/48/EG](32009L0048) daaronder verstaat;'
    url: https://wetten.overheid.nl/BWBR0029619/2016-02-19#Artikel1
  - number: 1.1.e
    text: '*importeur:* hetgeen [richtlijn 2009/48/EG](32009L0048) daaronder verstaat;'
    url: https://wetten.overheid.nl/BWBR0029619/2016-02-19#Artikel1
  - number: 1.1.f
    text: '*distributeur:* hetgeen [richtlijn 2009/48/EG](32009L0048) daaronder verstaat;'
    url: https://wetten.overheid.nl/BWBR0029619/2016-02-19#Artikel1
  - number: 1.1.g
    text: '*marktdeelnemers:* de fabrikant, de gemachtigde, de importeur en de distributeur;'
    url: https://wetten.overheid.nl/BWBR0029619/2016-02-19#Artikel1
  - number: 1.1.h
    text: '*in de handel brengen:* hetgeen [richtlijn 2009/48/EG](32009L0048) daaronder verstaat;'
    url: https://wetten.overheid.nl/BWBR0029619/2016-02-19#Artikel1
  - number: 1.1.i
    text: '*CE-markering:* hetgeen [richtlijn 2009/48/EG](32009L0048) daaronder verstaat;'
    url: https://wetten.overheid.nl/BWBR0029619/2016-02-19#Artikel1
  - number: 1.1.j
    text: '*keuringsinstantie:* hetgeen [richtlijn 2009/48/EG](32009L0048) daaronder verstaat;'
    url: https://wetten.overheid.nl/BWBR0029619/2016-02-19#Artikel1
  - number: 1.1.k
    text: '*markttoezicht:* hetgeen [richtlijn 2009/48/EG](32009L0048) daaronder verstaat;'
    url: https://wetten.overheid.nl/BWBR0029619/2016-02-19#Artikel1
  - number: 1.1.l
    text: '*op de markt aanbieden:* hetgeen [richtlijn 2009/48/EG](32009L0048) daaronder verstaat.'
    url: https://wetten.overheid.nl/BWBR0029619/2016-02-19#Artikel1
  - number: '1.2'
    text: |-
      Dit besluit is niet van toepassing op speelgoed, bedoeld in artikel 2, tweede lid, van [richtlijn 2009/48/EG]
      (32009L0048).
    url: https://wetten.overheid.nl/BWBR0029619/2016-02-19#Artikel1
  - number: '2.1'
    text: |-
      Het is verboden speelgoed te vervaardigen of te verhandelen dat niet voldoet aan de bij dit besluit gestelde
      voorschriften.
    url: https://wetten.overheid.nl/BWBR0029619/2016-02-19#Artikel2
  - number: '2.2'
    text: |-
      Het is verboden speelgoed te verhandelen anders dan met inachtneming van de bij dit besluit gestelde voorschriften
      met betrekking tot het bezigen van vermeldingen of voorstellingen betreffende de aard, samenstelling, uitvoering,
      hoedanigheid, eigenschappen, bestemming of afmetingen van de waar.
    url: https://wetten.overheid.nl/BWBR0029619/2016-02-19#Artikel2
  - number: '2.3'
    text: |-
      Het is verboden speelgoed binnen Nederlands grondgebied te brengen anders dan met inachtneming van de bij dit
      besluit gestelde voorschriften.
    url: https://wetten.overheid.nl/BWBR0029619/2016-02-19#Artikel2
  - number: '3.1'
    text: 'Fabrikanten voldoen bij het ontwerpen, vervaardigen en in de handel brengen van speelgoed aan:'
    url: https://wetten.overheid.nl/BWBR0029619/2016-02-19#Artikel3
  - number: 3.1.a
    text: artikel 4;
    url: https://wetten.overheid.nl/BWBR0029619/2016-02-19#Artikel3
  - number: 3.1.b
    text: artikel 9;
    url: https://wetten.overheid.nl/BWBR0029619/2016-02-19#Artikel3
  - number: 3.1.c
    text: artikel 10;
    url: https://wetten.overheid.nl/BWBR0029619/2016-02-19#Artikel3
  - number: 3.1.d
    text: artikel 11;
    url: https://wetten.overheid.nl/BWBR0029619/2016-02-19#Artikel3
  - number: 3.1.e
    text: artikel 15;
    url: https://wetten.overheid.nl/BWBR0029619/2016-02-19#Artikel3
  - number: 3.1.f
    text: artikel 18;
    url: https://wetten.overheid.nl/BWBR0029619/2016-02-19#Artikel3
  - number: 3.1.g
    text: artikel 21, derde en vierde lid; en
    url: https://wetten.overheid.nl/BWBR0029619/2016-02-19#Artikel3
  - number: 3.1.h
    text: bijlage II
    url: https://wetten.overheid.nl/BWBR0029619/2016-02-19#Artikel3
  - number: '3.2'
    text: |-
      Instructies en informatie aangaande de veiligheid als bedoeld in artikel 4, zevende lid, van [richtlijn 2009/48/EG]
      (32009L0048)zijn in ieder geval gesteld in de Nederlandse taal.
    url: https://wetten.overheid.nl/BWBR0029619/2016-02-19#Artikel3
  - number: '3.3'
    text: |-
      De EG-verklaring van overeenstemming, bedoeld in artikel 15, tweede lid, van [richtlijn 2009/48/EG](32009L0048) is
      in ieder geval gesteld in de Nederlandse of Engelse taal.
    url: https://wetten.overheid.nl/BWBR0029619/2016-02-19#Artikel3
  - number: '4.1'
    text: |-
      De fabrikant die een gemachtigde aanstelt, voldoet en zorgt dat wordt voldaan aan artikel 5 van [richtlijn 2009/48/
      EG](32009L0048).
    url: https://wetten.overheid.nl/BWBR0029619/2016-02-19#Artikel4
  - number: '4.2'
    text: |-
      De gemachtigde, bedoeld in het eerste lid, voldoet aan artikel 5, derde lid, en artikel 9 van [richtlijn 2009/48/
      EG](32009L0048).
    url: https://wetten.overheid.nl/BWBR0029619/2016-02-19#Artikel4
  - number: '5.1'
    text: 'Importeurs voldoen bij het in de handel brengen van speelgoed aan:'
    url: https://wetten.overheid.nl/BWBR0029619/2016-02-19#Artikel5
  - number: 5.1.a
    text: artikel 6;
    url: https://wetten.overheid.nl/BWBR0029619/2016-02-19#Artikel5
  - number: 5.1.b
    text: artikel 8; en
    url: https://wetten.overheid.nl/BWBR0029619/2016-02-19#Artikel5
  - number: 5.1.c
    text: artikel 9;
    url: https://wetten.overheid.nl/BWBR0029619/2016-02-19#Artikel5
  - number: '5.2'
    text: |-
      Instructies en informatie aangaande de veiligheid als bedoeld in artikel 6, vierde lid, van [richtlijn 2009/48/EG]
      (32009L0048)zijn in ieder geval gesteld in de Nederlandse taal.
    url: https://wetten.overheid.nl/BWBR0029619/2016-02-19#Artikel5
  - number: '6'
    text: 'Distributeurs voldoen bij het op de markt aanbieden van speelgoed aan:'
    url: https://wetten.overheid.nl/BWBR0029619/2016-02-19#Artikel6
  - number: 6.a
    text: artikel 7;
    url: https://wetten.overheid.nl/BWBR0029619/2016-02-19#Artikel6
  - number: 6.b
    text: artikel 8; en
    url: https://wetten.overheid.nl/BWBR0029619/2016-02-19#Artikel6
  - number: 6.c
    text: artikel 9;
    url: https://wetten.overheid.nl/BWBR0029619/2016-02-19#Artikel6
  - number: '7.1'
    text: |-
      Ten aanzien van speelgoed worden waarschuwingen en veiligheidsvoorschriften gebruikt met inachtneming van artikel
      11, eerste en tweede lid, van [richtlijn 2009/48/EG](32009L0048).
    url: https://wetten.overheid.nl/BWBR0029619/2016-02-19#Artikel7
  - number: '7.2'
    text: |-
      De in het eerste lid bedoelde waarschuwingen en veiligheidsvoorschriften zijn in ieder geval gesteld in de
      Nederlandse taal.
    url: https://wetten.overheid.nl/BWBR0029619/2016-02-19#Artikel7
  - number: '8'
    text: |-
      Fabrikanten en importeurs die speelgoed in de handel brengen en distributeurs die speelgoed op de markt aanbieden
      dat in overeenstemming is met geharmoniseerde normen of delen daarvan, waarvan de referentienummers in het
      Publicatieblad van de Europese Unie zijn bekendgemaakt, worden vermoed te voldoen aan de eisen die door die
      normen of delen daarvan worden bestreken, zoals beschreven in artikel 10 en bijlage II van [richtlijn 2009/48/
      EG](32009L0048).
    url: https://wetten.overheid.nl/BWBR0029619/2016-02-19#Artikel8
  - number: '9.1'
    text: |-
      Speelgoed dat op de markt wordt aangeboden, is overeenkomstig artikel 16, eerste en tweede lid, en artikel 17, van
      [richtlijn 2009/48/EG](32009L0048) voorzien van de CE-markering.
    url: https://wetten.overheid.nl/BWBR0029619/2016-02-19#Artikel9
  - number: '9.2'
    text: |-
      Speelgoed dat niet is voorzien van de CE-markering of anderszins niet aan dit besluit voldoet mag op handelsbeurzen
      en tentoonstellingen worden getoond en gebruikt met inachtneming van artikel 16, vierde lid, van [richtlijn
      2009/48/EG](32009L0048).
    url: https://wetten.overheid.nl/BWBR0029619/2016-02-19#Artikel9
  - number: '10.1'
    text: |-
      Aanvragen voor EG-typeonderzoek, de uitvoering en de verlening van certificaten daarvan vinden plaats met
      inachtneming van artikel 20 van [richtlijn 2009/48/EG](32009L0048).
    url: https://wetten.overheid.nl/BWBR0029619/2016-02-19#Artikel10
  - number: '10.2'
    text: |-
      Fabrikanten vragen het EG-typeonderzoek, bedoeld in artikel 19, derde lid, van [richtlijn 2009/48/EG](32009L0048)
      aan bij de keuringsinstantie, bedoeld in [artikel 12][ref1] van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0029619#Artikel12
    url: https://wetten.overheid.nl/BWBR0029619/2016-02-19#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0029619
        artikel: '12'
  - number: '10.3'
    text: |-
      De technische documentatie en correspondentie, bedoeld in artikel 20, vijfde lid, van [richtlijn 2009/48/EG]
      (32009L0048), zijn in ieder geval opgesteld in de Nederlandse of Engelse taal.
    url: https://wetten.overheid.nl/BWBR0029619/2016-02-19#Artikel10
  - number: '11.1'
    text: |-
      Bij de uitoefening van zijn taken als aanmeldende autoriteit, voldoet Onze Minister aan artikel 33 van [richtlijn
      2009/48/EG](32009L0048).
    url: https://wetten.overheid.nl/BWBR0029619/2016-02-19#Artikel11
  - number: '11.2'
    text: Onze Minister verricht de taken, bedoeld in artikel 31, zesde lid, van [richtlijn 2009/48/EG](32009L0048).
    url: https://wetten.overheid.nl/BWBR0029619/2016-02-19#Artikel11
  - number: '12.1'
    text: |-
      Bij een verzoek als bedoeld in [artikel 7a Warenwet][ref1], voldoet de aanvrager aan artikel 30, tweede en derde
      lid, van [richtlijn 2009/48/EG](32009L0048).


      [ref1]: https://wetten.overheid.nl/BWBR0001969#Artikel7a
    url: https://wetten.overheid.nl/BWBR0029619/2016-02-19#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0001969
        artikel: 7a
  - number: '12.2'
    text: 'Keuringsinstanties voldoen aan of zorgen dat wordt voldaan aan:'
    url: https://wetten.overheid.nl/BWBR0029619/2016-02-19#Artikel12
  - number: 12.2.a
    text: artikel 26, tweede tot en met elfde lid;
    url: https://wetten.overheid.nl/BWBR0029619/2016-02-19#Artikel12
  - number: 12.2.b
    text: artikel 31, vijfde lid;
    url: https://wetten.overheid.nl/BWBR0029619/2016-02-19#Artikel12
  - number: 12.2.c
    text: artikel 35; en
    url: https://wetten.overheid.nl/BWBR0029619/2016-02-19#Artikel12
  - number: 12.2.d
    text: artikel 36;
    url: https://wetten.overheid.nl/BWBR0029619/2016-02-19#Artikel12
  - number: '12.3'
    text: |-
      Een keuringsinstantie die aantoont dat zij voldoet aan de criteria in de ter zake doende geharmoniseerde normen
      of delen ervan, waarvan de referentienummers in het Publicatieblad van de Europese Unie zijn bekendgemaakt, wordt
      vermoed aan de eisen in artikel 26 van [richtlijn 2009/48/EG](32009L0048) te voldoen, op voorwaarde dat de van
      toepassing zijnde geharmoniseerde normen deze eisen dekken.
    url: https://wetten.overheid.nl/BWBR0029619/2016-02-19#Artikel12
  - number: '12.4'
    text: |-
      Keuringsinstanties die taken uitbesteden of door ondergeschikte instanties laten uitvoeren, voldoen aan artikel 29
      van [richtlijn 2009/48/EG](32009L0048).
    url: https://wetten.overheid.nl/BWBR0029619/2016-02-19#Artikel12
  - number: '13'
    text: |-
      In het kader van het markttoezicht handelen de in [artikel 25 van de Warenwet][ref1] bedoelde ambtenaren, de
      keuringsinstanties en de marktdeelnemers overeenkomstig de artikelen 41, 42 en 45 van [richtlijn 2009/48/EG]
      (32009L0048).


      [ref1]: https://wetten.overheid.nl/BWBR0001969#Artikel25
    url: https://wetten.overheid.nl/BWBR0029619/2016-02-19#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0001969
        artikel: '25'
  - number: '15'
    text: |-
      Het [Warenwetbesluit Speelgoed][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0005094
    url: https://wetten.overheid.nl/BWBR0029619/2016-02-19#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005094
  - number: '17.1'
    text: |-
      Speelgoed dat voldoet aan het [Warenwetbesluit Speelgoed][ref1] zoals dat onmiddellijk vóór 20 juli 2011 luidde en
      vóór dat tijdstip in de handel is gebracht, mag ook na dat tijdstip op de markt worden aangeboden.


      [ref1]: https://wetten.overheid.nl/BWBR0005094
    url: https://wetten.overheid.nl/BWBR0029619/2016-02-19#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0005094
  - number: '17.2'
    text: |-
      Onverminderd het eerste lid mag speelgoed dat niet voldoet aan de in bijlage II, onderdeel III, van [richtlijn
      2009/48/EG](32009L0048) bedoelde chemische eigenschappen en vóór 20 juli 2013 in de handel is gebracht, ook na
      dat tijdtip op de markt worden aangeboden, voor zover dat speelgoed voldoet aan bijlage II, deel 3, van [richtlijn
      88/378/EEG](31988L0378) van de Raad van de Europese Unie van 3 mei 1988 betreffende de onderlinge aanpassing van de
      wetgevingen van de Lid-Staten inzake de veiligheid van speelgoed (PbEG L 187).
    url: https://wetten.overheid.nl/BWBR0029619/2016-02-19#Artikel17
  - number: '17.3'
    text: |-
      Na de inwerkingtreding van dit besluit berusten de beschikkingen afgegeven op basis van
      [artikel 7, eerste lid, onder a, van het Warenwetbesluit Speelgoed][ref1] tot aanwijzing van een keuringsinstelling
      op [artikel 7a van de Warenwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005094#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0001969#Artikel7a
    url: https://wetten.overheid.nl/BWBR0029619/2016-02-19#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0005094
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0001969
        artikel: 7a
  - number: '18'
    text: Dit besluit treedt in werking met ingang van 20 juli 2011.
    url: https://wetten.overheid.nl/BWBR0029619/2016-02-19#Artikel18
  - number: '19'
    text: 'Dit besluit wordt aangehaald als: Warenwetbesluit speelgoed 2011.'
    url: https://wetten.overheid.nl/BWBR0029619/2016-02-19#Artikel19
