preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Welzijn, Volksgezondheid en Cultuur van 23 januari 1992, VVP/P-
    U 692599, gedaan in overeenstemming met Onze Minister van Economische Zaken en Onze Minister van Sociale Zaken
    en Werkgelegenheid;

    Overwegende dat ingevolge het koninklijk besluit van 20 juli 1989 (Stb. 1989, 331) de bij Onze Minister van
    Economische Zaken berustende verantwoordelijkheid voor de veiligheid en de daarmee verband houdende deugdelijkheid
    en doelmatigheid van elektrische toestellen en installaties met ingang van 1 november 1989 is overgedragen aan Onze
    Minister van Welzijn, Volksgezondheid en Cultuur;

    Overwegende dat in verband hiermee de op artikel 12 van de Electriciteitswet (Stb. 1938, 523) gebaseerde regelingen
    betreffende de veiligheid van elektrotechnische produkten, waaronder het Elektriciteitsbesluit 1976 (Stb. 1976, 75)
    dat uitvoering geeft aan richtlijn 73/23/EEG van de Raad van de Europese Gemeenschappen (PbEG L 77), tot de eerste
    verantwoordelijkheid van Onze Minister van Welzijn, Volksgezondheid en Cultuur zijn gaan behoren;

    Overwegende dat genoemde verantwoordelijkheid het wenselijk maakt de desbetreffende regelingen te baseren op de
    Warenwet (Stb. 1988, 360);

    Gelet op de artikelen 4, eerste lid, onderdeel a, 8, onderdeel c, 13 en 14 van de Warenwet en op artikel 12, tweede
    lid, van de Elektriciteitswet;

    Gehoord de Adviescommissie Warenwet (advies van 18 september 1991, nr. 14317/(49)5);

    De Raad van State gehoord (advies van 25 maart 1992, nr. W13.92.0045);

    Gezien het nader rapport van de Staatssecretaris van Welzijn, Volksgezondheid en Cultuur van 9 juni 1992, DGVgz/
    VVP/P 921195 uitgebracht in overeenstemming met Onze Minister van Economische Zaken en Onze Minister van Sociale
    Zaken en Werkgelegenheid;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0005587/1997-01-29#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In dit besluit en de daarop gebaseerde bepalingen wordt verstaan onder:

      a. elektrotechnische produkten

      1°. produkten bij het gebruik waarvan elektrische energie wordt gebezigd voor zover de nominale spanning waarvoor
      die produkten zijn vervaardigd, hoger is dan 50 V bij wisselstroom en 75 V bij gelijkstroom en niet meer bedraagt
      dan 1000 V bij wisselstroom en 1500 V bij gelijkstroom;

      2°. voorwerpen en materialen welke bestemd zijn om deel uit te maken van, te worden toegepast aan of te worden
      gebruikt bij metingen aan de onder 1° bedoelde produkten of elektrische installaties voor zover deze installaties
      zijn vervaardigd voor een nominale spanning welke overeenkomt met het ten aanzien daarvan onder 1° gestelde;

      3°. elektrische installaties aanwezig in of bestemd voor roerende goederen en voor zover deze installaties zijn
      vervaardigd voor een nominale spanning welke overeenkomt met het ten aanzien daarvan onder 1° gestelde;

      b. richtlijn: de richtlijn van de Raad van de Europese Gemeenschappen van 19 februari 1973, no. 73/23/EEG,
      betreffende de onderlinge aanpassing van de wettelijke voorschriften van de Lid-Staten inzake elektrisch materiaal
      bestemd voor gebruik binnen bepaalde spanningsgrenzen (*PbEG* L 77).

      2 In dit besluit en de daarop gebaseerde bepalingen worden onder elektrotechnische produkten tevens verstaan de
      daartoe als zodanig door Onze Minister aan te wijzen voorwerpen en materialen welke bestemd zijn om aangesloten
      te worden op dan wel op enigerlei andere wijze te worden toegepast met betrekking tot de in het eerste lid, onder
      *a*, bedoelde elektrotechnische produkten. Deze voorwerpen en materialen behoeven niet te zijn vervaardigd voor een
      nominale spanning welke overeenkomt met het ten aanzien daarvan in het eerste lid, onder *a*, 1°, gestelde.

      3 In afwijking van het eerste lid, worden in dit besluit onder elektrotechnische produkten niet verstaan:

      a. toestellen, voorwerpen en materialen welke naar hun aard bestemd zijn om te worden gebruikt:

      1. als onderdeel van een personen- of goederenlift;

      2. op schepen, in vliegtuigen of bij de spoorwegen;

      3. in een omgeving waar ontploffingsgevaar bestaat;

      b. elektriciteitsmeters;

      c. spanninggevers van schrikdraadinstallaties;

      d. medische hulpmiddelen in de zin van de [Wet op de medische hulpmiddelen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002697
    url: https://wetten.overheid.nl/BWBR0005587/1997-01-29#Artikel1
    references:
      - id: ref1
