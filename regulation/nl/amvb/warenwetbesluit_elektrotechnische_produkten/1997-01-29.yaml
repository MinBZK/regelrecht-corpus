  - number: '2'
    text: |-
      1 Het is verboden elektrotechnische produkten te verhandelen, die niet voldoen aan de eisen gesteld bij of
      krachtens dit besluit.

      2 Het is verboden elektrotechnische produkten te verhandelen anders dan met inachtneming van de voorschriften bij
      of krachtens dit besluit gesteld met betrekking tot de aanduiding en het bezigen van vermeldingen.
    url: https://wetten.overheid.nl/BWBR0005587/1997-01-29#Artikel2
  - number: '3'
    text: |-
      1 Elektrotechnische produkten moeten, overeenkomstig de regels van goed vakmanschap die in de Europese Economische
      Gemeenschap dan wel in de staten die partij zijn bij de Overeenkomst betreffende de Europese Economische Ruimte
      gelden, bij juiste installatie, gebruik overeenkomstig hun bestemming en degelijk onderhoud geen gevaar opleveren
      voor personen, huisdieren of goederen. Zij moeten daartoe ten minste voldoen aan de in de bijlage bij dit besluit
      opgenomen eisen.

      2 Onze Minister kan met betrekking tot de in [artikel 1, eerste lid, onder ][ref1] bedoelde en de krachtens
      [artikel 1, tweede lid][ref2], aangewezen voorwerpen en materialen de in het eerste lid gestelde eisen nader
      uitwerken.


      [ref1]: https://wetten.overheid.nl/BWBR0005587#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005587#Artikel1
    url: https://wetten.overheid.nl/BWBR0005587/1997-01-29#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005587
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0005587
        artikel: '1'
  - number: '4'
    text: |-
      1 Een elektrotechnisch produkt wordt vermoed te voldoen aan het bepaalde bij of krachtens [artikel 3][ref1] indien:

      a. het voldoet aan de veiligheidseisen van de daartoe door Onze Minister aan te wijzen normen, bedoeld in artikel 5
      van de richtlijn;

      b. het, voor zover geen normen als onder *a* bedoeld zijn aangewezen, voldoet aan de daarop van toepassing zijnde
      veiligheidsvoorschriften van de Internationale Commissie voor de keuring van elektrisch materiaal (IECEE) of
      van de Internationale Elektrotechnische Commissie (IEC), die overeenkomstig artikel 6 van de richtlijn in het
      Publikatieblad van de Europese Gemeenschappen zijn bekendgemaakt;

      c. het, voor zover geen normen als onder *a* bedoeld zijn aangewezen en geen veiligheidsvoorschriften als onder
      *b* bedoeld zijn bekend gemaakt, voldoet aan de veiligheidseisen van de door Onze Minister daartoe aan te wijzen
      normen, bedoeld in artikel 7 van de richtlijn.

      2 De in het eerste lid genoemde aanwijzingen worden in de *Nederlandse Staatscourant* bekend gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0005587#Artikel3
    url: https://wetten.overheid.nl/BWBR0005587/1997-01-29#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005587
        artikel: '3'
  - number: '5'
    text: |-
      1 Elektrotechnische produkten worden voorzien van de aanduiding, houdende de CE-markering, bedoeld in bijlage III,
      onderdeel A, van de richtlijn en gaan vergezeld van de in bijlage III, onderdeel B, van de richtlijn bedoelde EG-
      verklaring van overeenstemming.

      2 De in het eerste lid bedoelde aanduiding mag uitsluitend worden gebezigd indien voor het elektrotechnische
      produkt de procedure genoemd in bijlage IV van de richtlijn in acht is genomen.

      3 De in het eerste lid bedoelde aanduiding moet duidelijk leesbaar en onuitwisbaar op het elektrotechnische produkt
      of, indien dat niet mogelijk is, op de verpakking, gebruiksaanwijzing of het garantiebewijs zijn aangebracht.

      4 Ten aanzien van elektrotechnische produkten mogen geen vermeldingen, voorstellingen of aanduidingen worden
      gebezigd, welke met de in het eerste lid bedoelde aanduiding kunnen worden verward.

      5 Het bepaalde in het eerste tot en met het derde lid is niet van toepassing op elektrotechnische produkten die
      niet zijn elektrisch materiaal in de zin van artikel 1 van de richtlijn.
    url: https://wetten.overheid.nl/BWBR0005587/1997-01-29#Artikel5
  - number: '6'
    text: |-
      1 Onze Minister wijst de instellingen aan die:

      a. bevoegd zijn deel te nemen aan de vaststelling van normen als bedoeld in artikel 5 van de richtlijn;

      b. bevoegd zijn rapporten op te stellen en adviezen uit te brengen als bedoeld in artikel 8, tweede lid,
      onderscheidenlijk artikel 9, derde lid, van de richtlijn.

      2 De in het eerste lid bedoelde aanwijzingen worden in de *Nederlandse Staatscourant* bekend gemaakt.
    url: https://wetten.overheid.nl/BWBR0005587/1997-01-29#Artikel6
  - number: '7'
    text: |-
      Het Elektriciteitsbesluit (*Stb.* 1968, 493) en het Elektriciteitsbesluit 1976 (*Stb.* 1976, 75) worden
      ingetrokken.
    url: https://wetten.overheid.nl/BWBR0005587/1997-01-29#Artikel7
  - number: '8'
    text: |-
      1 Dit besluit treedt in werking met ingang van de tweede dag na de datum van uitgifte van het *Staatsblad* waarin
      het wordt geplaatst, met dien verstande dat het gedurende een termijn van twaalf maanden na die datum niet geldt
      met betrekking tot elektrotechnische produkten als bedoeld in [artikel 1, eerste lid, onder ][ref1].

      2 Dit besluit kan worden aangehaald als Warenwetbesluit elektrotechnische produkten.


