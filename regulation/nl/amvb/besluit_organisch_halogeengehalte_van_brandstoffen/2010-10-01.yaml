  - number: '4'
    text: |-
      Onze Minister stelt regels omtrent de methoden volgens welke het gehalte aan polychloorbifenylen of het gehalte aan
      andere organische halogeenverbindingen in brandstoffen of grondstoffen voor brandstoffen wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0004501/2010-10-01#Artikel4
  - number: 4a
    text: |-
      Dit besluit berust op [artikel 9.2.2.1 van de Wet milieubeheer][ref1].


