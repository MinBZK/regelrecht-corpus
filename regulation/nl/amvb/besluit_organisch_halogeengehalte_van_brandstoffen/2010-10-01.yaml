preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 26 oktober
    1988, nr. MJZ 2608011, Centrale Directie Juridische Zaken, Afdeling Wetgeving, gedaan in overeenstemming met Onze
    Minister van Economische Zaken;

    Overwegende dat het teneinde ongewenste effecten van polychloorbifenylen en andere organische halogeenverbindingen
    op mens en milieu te voorkomen en teneinde uitvoering te geven aan de Richtlijn van de Raad van de Europese
    Gemeenschappen van 22 december 1986 tot wijziging van Richtlijn 75/439/EEG inzake de verwijdering van afgewerkte
    olie (PbEG 1987, L 42), en aan de Richtlijn van de Raad van de Europese Gemeenschappen van 27 juli 1976 (PbEG
    1976, L 262) betreffende de onderlinge aanpassing van de wettelijke en bestuursrechtelijke bepalingen der Lid-
    Staten inzake de beperking van het op de markt brengen en van het gebruik van bepaalde stoffen en preparaten,
    zoals gewijzigd bij de Richtlijn van de Raad van de Europese Gemeenschappen van 1 oktober 1985 (PbEG 1985, L 269),
    wenselijk is regels te stellen ten aanzien van het gehalte aan die stoffen in brandstoffen en grondstoffen voor
    brandstoffen;

    Gelet op artikel 24 van de Wet milieugevaarlijke stoffen (Stb. 1985, 639);

    De Raad van State gehoord (advies van 21 december 1988, nr. W08.88.0621);

    Gezien het nader rapport van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 21-2-
    1989, nr. MJZ 2129035, Centrale Directie Juridische Zaken, Afdeling Wetgeving, uitgebracht in overeenstemming met
    Onze Minister van Economische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0004501/2010-10-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. brandstoffen: stoffen of preparaten, dienende voor verbranding;

      b. gehalte aan polychloorbifenylen: gehalte aan de afzonderlijke polychloorbifenyl-congeneren 28, 52, 101, 118,
      138, 153 of 180;

      c. gehalte aan organische halogeenverbindingen: gehalte aan organische halogeenverbindingen, berekend als chloor.
    url: https://wetten.overheid.nl/BWBR0004501/2010-10-01#Artikel1
  - number: '2'
    text: |-
      1 Het is verboden brandstoffen toe te passen

      a. met een gehalte aan polychloorbifenylen van meer dan 0,5 mg/kg per congeneer, of

      b. met een gehalte aan organische halogeenverbindingen van meer dan 50 mg/kg.

      2 In afwijking van het eerste lid, onder b, mogen vliegtuigbenzines worden toegepast met een gehalte aan organische
      halogeenverbindingen van meer dan 50 mg/kg, maar niet meer dan 500 mg/kg.

      3 Het is verboden organische halogeenverbindingen, of preparaten waarin een van de in het eerste of tweede lid
      genoemde gehalten wordt overschreden, ten behoeve van de vervaardiging van brandstoffen aan te wenden. Onder
      het ten behoeve van de vervaardiging van brandstoffen aanwenden van de bedoelde stoffen of preparaten wordt mede
      begrepen het mengen van deze stoffen of preparaten in brandstoffen.

      4 Het is voorts verboden organische halogeenverbindingen, of preparaten waarin een van de in het eerste of tweede
      lid genoemde gehalten wordt overschreden, als brandstof of ten behoeve van de vervaardiging van brandstoffen in
      te voeren in Nederland, te bewaren, voorhanden te hebben, ten verkoop aan te bieden, ten verkoop in voorraad te
      hebben, te verkopen of zich ervan te ontdoen door afgifte.
    url: https://wetten.overheid.nl/BWBR0004501/2010-10-01#Artikel2
  - number: '3'
    text: |-
      1 De in [artikel 2][ref1] gestelde verboden gelden niet voor zover het betreft:

      a. de toepassing, het bewaren of het voorhanden hebben in of het zich ontdoen door afgifte vanuit particuliere
      huishoudens;

      b. het invoeren, voorhanden hebben of bewaren van organische halogeenverbindingen of preparaten welke direct
      na invoer in Nederland zijn of worden opgeslagen in een inrichting voor douane-opslag of een douane-entrepot en
      waarvan uit begeleidende documenten blijkt dat zij zonder enigerlei vorm van bewerking zullen worden doorgevoerd
      naar een bestemming buiten Nederland, en waarvan tevens aangetoond wordt dat zij tijdens het vervoer naar die
      bestemming niet als brandstof ingezet zullen worden;

      c. preparaten op basis van tetraethyllood of tetramethyllood, bestemd voor de aanwending als anti-klopmiddel en als
      zodanig aanwezig in lichte olie als bedoeld in de [Wet op de accijns][ref2] van minerale oliën (*Stb.* 1964, 207);

      d. brandstoffen, aanwezig in de brandstoffentank van een vaartuig, voertuig of luchtvaartuig dat binnen Nederlands
      grondgebied wordt gebracht.

      2 De in [artikel 2][ref3] gestelde verboden gelden voorts niet voor zover:

      a. de in [artikel 2][ref4] genoemde handelingen worden verricht in
      overeenstemming met een vergunning of ontheffing, verleend krachtens de
      [artikel 2.1, eerste lid, aanhef en onder e, van de Wet algemene bepalingen omgevingsrecht][ref5],
      de [artikelen 10.54][ref6] juncto [10.63, derde lid, van de Wet milieubeheer][ref7] of
      [artikel 3, eerste lid, van de Wet verontreiniging zeewater][ref8], waarbij uitdrukkelijk de bevoegdheid is
      verleend handelingen te verrichten ten aanzien van gevaarlijke afvalstoffen, waarin zich polychloorbifenylen of
      andere organische halogeenverbindingen bevinden;

      b. het betreft het zich ontdoen door afgifte aan of het bewaren of voorhanden hebben met het oog op het zich
      ontdoen door afgifte aan een persoon als bedoeld onder *a*. Dit moet blijken uit een schriftelijke overeenkomst met
      deze persoon;

      c. het betreft het zich ontdoen door afgifte aan of het bewaren of voorhanden hebben met het oog op het
      zich ontdoen door afgifte aan een in een ander land dan Nederland gevestigd persoon, met wie schriftelijk is
      overeengekomen dat deze de organische halogeenverbindingen of preparaten daarheen brengt;

      d. het betreft invoer en met een persoon als bedoeld onder *a* schriftelijk is overeengekomen dat deze de
      organische halogeenverbindingen of preparaten in ontvangst zal nemen.


