preamble:
  text: |-
    Wij WILHELMINA, bij de gratie Gods Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Op de voordracht van Onzen Minister van Financiën van 5 Februari 1925, n°. 172, Afdeeling Generale Thesaurie;

    Den Raad van State gehoord (advies van 24 Februari 1925, n°. 45);

    Gezien het nader rapport van Onzen voornoemden Minister van 25 Maart 1925, n°. 147, Afdeeling Generale Thesaurie;

    Overwegende, dat het wenschelijk is maatregelen te treffen tot regeling van de wederzijdsche betalingen tusschen
    het Rijk en de Gemeenten.

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0041549/1925-06-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Betalingen van het Rijk aan de gemeenten en van de gemeenten aan het Rijk geschieden voorzoover zij door Onzen
      Minister van Financiën daartoe zijn aangewezen door verorderingen en schulden over en weer te vereffenen.

      Te dien einde zal tusschen het Rijk en elke gemeente of tusschen een door Onzen Minister van Financiën aan te
      wijzen instelling en elke gemeente en in dat geval ook tusschen die instelling en het Rijk eene rekening worden
      geopend, overeenkomstig door Onzen Minister van Financiën te geven voorschriften.
    url: https://wetten.overheid.nl/BWBR0041549/1925-06-01#Artikel1
  - number: '2'
    text: |-
      Onze Minister van Financiën draagt zorg dat de gemeentebesturen omtrent alle wijzigingen in den stand der rekening
      hunner gemeente zoo spoedig mogelijk worden ingelicht en dat zij over de batige saldi der rekening in den door die
      besturen te bepalen vorm kunnen beschikken.
    url: https://wetten.overheid.nl/BWBR0041549/1925-06-01#Artikel2
  - number: '3'
    text: |-
      De Hoofden der Departementen van Algemeen Bestuur dragen zorg, dat van alle bij [artikel 1][ref1] bedoelde
      betalingen, voorzoover zij daarbij betrokken zijn, tijdig opgave wordt gedaan aan de Generale Thesauri van het
      Departement van Financiën, met vermelding van den naam der gemeente, de omschrijving der betaling of der vordering,
      het bedrag, alsmede den datum waarop de betaling moet plaats hebben of de vordering opeischbaar wordt.

      Voorzoover het betalingen betreft ten laste der begrooting moeten die opgaven vergezeld gaan van aanvragen tot
      kredietopening.


      [ref1]: https://wetten.overheid.nl/BWBR0041549#Artikel1
    url: https://wetten.overheid.nl/BWBR0041549/1925-06-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0041549
        artikel: '1'
  - number: '4'
    text: Dit besluit treedt in werking op een nader door Onzen Minister van Financiën te bepalen datum.
    url: https://wetten.overheid.nl/BWBR0041549/1925-06-01#Artikel4
