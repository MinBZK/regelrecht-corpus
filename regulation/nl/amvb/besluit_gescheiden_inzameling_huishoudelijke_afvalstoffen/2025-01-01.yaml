preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister voor Milieu en Wonen van 7 april 2020, nr. IENW/BSK-2019/269999, Hoofddirectie
    Bestuurlijke en Juridische Zaken;

    Gelet op Richtlijn (EU) 2018/851 van het Europees Parlement en de Raad van 30 mei 2018 tot wijziging van Richtlijn
    2008/98/EG betreffende afvalstoffen (PbEU L 150/109) en de artikelen 8.40, eerste lid, 9.2.2.1, eerste lid, 9.5.2,
    eerste lid, 10.29, eerste lid, en 10.41 tot en met 10.43 van de Wet milieubeheer en artikelen 4.3, eerste lid, en
    5.1, tweede lid, van de Omgevingswet;

    De Afdeling advisering van de Raad van State gehoord (advies van 7 mei 2020, nr. W17.20.0101/IV);

    Gezien het nader rapport van de Staatssecretaris van Infrastructuur en Waterstaat van 12 juni 2020, nr. IenW/BSK-
    2020/86006, Hoofddirectie Bestuurlijke en Juridische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0043736/2025-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      De gemeenteraad en burgemeester en wethouders dragen, bij de uitvoering van
      [artikel 10.21 van de Wet milieubeheer][ref1], zorg voor gescheiden inzameling van ten minste de volgende
      bestanddelen van huishoudelijke afvalstoffen:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0043736/2025-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
  - number: 1.a
    text: bioafval;
    url: https://wetten.overheid.nl/BWBR0043736/2025-01-01#Artikel1
  - number: 1.b
    text: papier;
    url: https://wetten.overheid.nl/BWBR0043736/2025-01-01#Artikel1
  - number: 1.c
    text: metaal;
    url: https://wetten.overheid.nl/BWBR0043736/2025-01-01#Artikel1
  - number: 1.d
    text: kunststof;
    url: https://wetten.overheid.nl/BWBR0043736/2025-01-01#Artikel1
  - number: 1.e
    text: glas;
    url: https://wetten.overheid.nl/BWBR0043736/2025-01-01#Artikel1
  - number: 1.f
    text: textiel;
    url: https://wetten.overheid.nl/BWBR0043736/2025-01-01#Artikel1
  - number: 1.g
    text: gevaarlijke afvalstoffen;
    url: https://wetten.overheid.nl/BWBR0043736/2025-01-01#Artikel1
  - number: 1.h
    text: afgedankte elektrische en elektronische apparatuur.
    url: https://wetten.overheid.nl/BWBR0043736/2025-01-01#Artikel1
  - number: '2.1'
    text: |-
      Bij de afvalstoffenverordening of het omgevingsplan kan, in afwijking van [artikel 1][ref1], worden bepaald dat:


      [ref1]: https://wetten.overheid.nl/BWBR0043736#Artikel1
    url: https://wetten.overheid.nl/BWBR0043736/2025-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0043736
        artikel: '1'
  - number: 2.1.a
    text: |-
      bioafval niet gescheiden wordt ingezameld indien aan de voorwaarden uit artikel 10, derde lid, onder c of d, van de
      kaderrichtlijn afvalstoffen is voldaan;
    url: https://wetten.overheid.nl/BWBR0043736/2025-01-01#Artikel2
  - number: 2.1.b
    text: |-
      metaal, kunststof of glas niet gescheiden worden ingezameld indien aan de voorwaarden uit artikel 10, derde lid,
      onder a, van de kaderrichtlijn afvalstoffen is voldaan.
    url: https://wetten.overheid.nl/BWBR0043736/2025-01-01#Artikel2
  - number: '2.2'
    text: |-
      Indien toepassing wordt gegeven aan het eerste lid, is [artikel 10.26, tweede lid, van de Wet milieubeheer][ref1]
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0043736/2025-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
  - number: '3.1'
    text: |-
      De gemeenteraad past de afvalstoffenverordening, voor zover noodzakelijk om te voldoen aan [artikel 1][ref1] en
      [artikel 2, eerste lid][ref2], uiterlijk op 1 januari 2021 aan.


      [ref1]: https://wetten.overheid.nl/BWBR0043736#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0043736#Artikel2
    url: https://wetten.overheid.nl/BWBR0043736/2025-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0043736
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0043736
        artikel: '2'
  - number: '3.2'
    text: |-
      Indien toepassing wordt gegeven aan [artikel 2, eerste lid][ref1], beoordeelt de gemeenteraad regelmatig of nog
      aan de voorwaarden uit artikel 2, eerste lid, is voldaan, rekening houdend met goede praktijken op het gebied
      van de gescheiden inzameling van afvalstoffen en andere relevante ontwikkelingen op het gebied van beheer van
      afvalstoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0043736#Artikel2
    url: https://wetten.overheid.nl/BWBR0043736/2025-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0043736
        artikel: '2'
  - number: '11.1'
    text: |-
      Dit besluit treedt in werking op het tijdstip waarop de
      [Implementatiewet wijziging EU-kaderrichtlijn afvalstoffen][ref1] in werking treedt. Indien het Staatsblad waarin
      dit besluit wordt geplaatst, wordt uitgegeven op of na de dag dat de voorgenoemde wet in werking treedt, treedt dit
      besluit in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin het wordt geplaatst


      [ref1]: https://wetten.overheid.nl/BWBR0043601
    url: https://wetten.overheid.nl/BWBR0043736/2025-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0043601
  - number: '11.2'
    text: |-
      In afwijking van het eerste lid, treedt [artikel 1, onderdelen f en g][ref1], met ingang van 1 januari 2025 in
      werking en treedt [artikel 4, onderdeel F][ref2], met ingang van 5 januari 2021 in werking.


      [ref1]: https://wetten.overheid.nl/BWBR0043736#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0043736#Artikel4
    url: https://wetten.overheid.nl/BWBR0043736/2025-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0043736
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0043736
        artikel: '4'
  - number: '11.3'
    text: |-
      In afwijking van het eerste lid, treden [artikelen 9][ref1] en [10][ref2] op een bij koninklijk besluit te bepalen
      tijdstip in werking.


      [ref1]: https://wetten.overheid.nl/BWBR0043736#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0043736#Artikel10
    url: https://wetten.overheid.nl/BWBR0043736/2025-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0043736
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0043736
        artikel: '10'
  - number: '12'
    text: 'Dit besluit wordt aangehaald als: Besluit gescheiden inzameling huishoudelijke afvalstoffen.'
    url: https://wetten.overheid.nl/BWBR0043736/2025-01-01#Artikel12
