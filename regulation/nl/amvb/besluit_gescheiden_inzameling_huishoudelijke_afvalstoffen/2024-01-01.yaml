        artikel: '10.26'
  - number: '3'
    text: |-
      1 De gemeenteraad past de afvalstoffenverordening, voor zover noodzakelijk om te voldoen aan [artikel 1][ref1] en
      [artikel 2, eerste lid][ref2], uiterlijk op 1 januari 2021 aan.

      2 Indien toepassing wordt gegeven aan [artikel 2, eerste lid][ref3], beoordeelt de gemeenteraad regelmatig of
      nog aan de voorwaarden uit artikel 2, eerste lid, is voldaan, rekening houdend met goede praktijken op het gebied
      van de gescheiden inzameling van afvalstoffen en andere relevante ontwikkelingen op het gebied van beheer van
      afvalstoffen.


