articles:
  - number: '1'
    text: |-
      De gemeenteraad en burgemeester en wethouders dragen, bij de uitvoering van
      [artikel 10.21 van de Wet milieubeheer][ref1], zorg voor gescheiden inzameling van ten minste de volgende
      bestanddelen van huishoudelijke afvalstoffen:

      a. bioafval;

      b. papier;

      c. metaal;

      d. kunststof;

      e. glas;

      f.

      g.

      h. afgedankte elektrische en elektronische apparatuur.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10.21
    url: https://wetten.overheid.nl/BWBR0043736/2024-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10.21'
  - number: '2'
    text: |-
      1 Bij de afvalstoffenverordening of het omgevingsplan kan, in afwijking van [artikel 1][ref1], worden bepaald dat:

      a. bioafval niet gescheiden wordt ingezameld indien aan de voorwaarden uit artikel 10, derde lid, onder c of d, van
      de kaderrichtlijn afvalstoffen is voldaan;

      b. metaal, kunststof of glas niet gescheiden worden ingezameld indien aan de voorwaarden uit artikel 10, derde lid,
      onder a, van de kaderrichtlijn afvalstoffen is voldaan.

      2 Indien toepassing wordt gegeven aan het eerste lid, is [artikel 10.26, tweede lid, van de Wet milieubeheer][ref2]
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0043736#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel10.26
    url: https://wetten.overheid.nl/BWBR0043736/2024-01-01#Artikel2
    references:
