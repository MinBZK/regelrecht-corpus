  - number: '11'
    text: |-
      1 Dit besluit treedt in werking op het tijdstip waarop de
      [Implementatiewet wijziging EU-kaderrichtlijn afvalstoffen][ref1] in werking treedt. Indien het Staatsblad waarin
      dit besluit wordt geplaatst, wordt uitgegeven op of na de dag dat de voorgenoemde wet in werking treedt, treedt dit
      besluit in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin het wordt geplaatst

      2 In afwijking van het eerste lid, treedt [artikel 1, onderdelen f en g][ref2], met ingang van 1 januari 2025 in
      werking en treedt [artikel 4, onderdeel F][ref3], met ingang van 5 januari 2021 in werking.

      3 In afwijking van het eerste lid, treden [artikelen 9][ref4] en [10][ref5] op een bij koninklijk besluit te
      bepalen tijdstip in werking.


