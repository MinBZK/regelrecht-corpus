preamble:
  text: >-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.


    Op de voordracht van Onze Minister van Landbouw, Natuur en Voedselkwaliteit van 30 april 2019, nr. WJZ / 19108910;


    Gelet op Verordening (EU) nr. 2017/625 van het Europees parlement en de Raad van 15 maart 2017 betreffende
    officiële controles en andere officiële activiteiten die worden uitgevoerd om de toepassing van de levensmiddelen-
    en diervoederwetgeving en van de voorschriften inzake diergezondheid, dierenwelzijn, plantgezondheid en
    gewasbeschermingsmiddelen te waarborgen, tot wijziging van de Verordeningen (EG) nr. 999/2001, (EG) nr. 396/2005,
    (EG) nr. 1069/2009, (EG) nr. 1107/2009, (EU) nr. 1151/2012, (EU) nr. 652/2014, (EU) 2016/429 en (EU) 2016/2031
    van het Europees Parlement en de Raad, de Verordeningen (EG) nr. 1/2005 en (EG) nr. 1099/2009 van de Raad en de
    Richtlijnen 98/58/EG, 1999/74/EG, 2007/43/EG, 2008/119/EG en 2008/120/EG van de Raad, en tot intrekking van de
    Verordeningen (EG) nr. 854/2004 en (EG) nr. 882/2004 van het Europees Parlement en de Raad, de Richtlijnen 89/608/
    EEG, 89/662/EEG, 90/425/EEG, 91/496/EEG, 96/23/EG, 96/93/EG en 97/78/EG van de Raad en Besluit 92/438/EEG van de
    Raad (verordening officiële controles) (Pb EU 2017 L 95) en gelet op artikel 111 van de Gezondheids- en welzijnswet
    voor dieren en de artikelen 6.2, 6.3, 6.4 en 10.2 van de Wet dieren;


    De Afdeling advisering van de Raad van State gehoord (advies van 5 juni 2019, no. W11.19.0111/IV);


    Gezien het nader rapport van Onze Minister van Landbouw, Natuur en Voedselkwaliteit van 14 juni 2019, nr.
    WJZ/19139852;


    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0042383/2019-12-14#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      - *EU-besluit:* besluit als bedoeld in artikel 288 van het Verdrag betreffende de werking van de Europese Unie;
      - *EU-rechtshandeling:* EU-verordening, EU-richtlijn of EU-besluit;
      - *EU-richtlijn:* richtlijn als bedoeld in artikel 288 van het Verdrag betreffende de werking van de Europese Unie;
      - *EU-verordening:* verordening als bedoeld in artikel 288 van het Verdrag betreffende de werking van de Europese
      Unie;
      - *Onze Minister:* de Minister van Landbouw, Natuur en Voedselkwaliteit;
      - *verordening (EU) nr. 2017/625:* verordening (EU) 2017/625 van het Europees Parlement en de Raad van 15 maart
      2017 betreffende officiële controles en andere officiële activiteiten die worden uitgevoerd om de toepassing
      van de levensmiddelen- en diervoederwetgeving en van de voorschriften inzake diergezondheid, dierenwelzijn,
      plantgezondheid en gewasbeschermingsmiddelen te waarborgen, tot wijziging van de [Verordeningen (EG) nr. 999/2001]
      (32001R0999), [(EG) nr. 396/2005](32005R0396), [(EG) nr. 1069/2009](32009R1069), [(EG) nr. 1107/2009](32009R1107),
      (EU) [nr. 1151/2012](32012R1151), (EU) [nr. 652/2014](32014R0652), (EU) [2016/429](32329R2016) en (EU) [2016/2031]
      (32031R2016) van het Europees Parlement en de Raad, de Verordeningen [(EG) nr. 1/2005](32005R0001) en [(EG) nr.
      1099/2009](32009R1099) van de Raad en de Richtlijnen [98/58/EG](31958R0098), [1999/74/EG](31974R1999), [2007/43/
      EG](31943R2007), [2008/119/EG](32019R2008) en [2008/120/EG](32020R2008) van de Raad, en tot intrekking van de
      Verordeningen [(EG) nr. 854/2004](32004R0854) en [(EG) nr. 882/2004](32004R0882) van het Europees Parlement en
      de Raad, de Richtlijnen [89/608/EEG](32508R0089), [89/662/EEG](32562R0089), [90/425/EEG](32325R0090), [91/496/
      EEG](32396R0091), [96/23/EG](31923R0096), [96/93/EG](31993R0096) en [97/78/EG](31978R0097) van de Raad en Besluit
      [92/438/EEG](32338R0092) van de Raad (verordening officiële controles) (Pb EU 2017 L 95);
      - *verordening (EU) nr. 882/2004:* [Verordening (EG) nr. 882/2004](32004R0882) van het Europees Parlement en
      de Raad van 29 april 2004 inzake officiële controles op de naleving van de wetgeving inzake diervoeders en
      levensmiddelen en de voorschriften inzake diergezondheid en dierenwelzijn (Pb EU 2004 L 165).
    url: https://wetten.overheid.nl/BWBR0042383/2019-12-14#Artikel1
  - number: '2'
    text: |-
      De [artikelen 3 tot en met 7][ref1] van dit besluit en de daarop berustende bepalingen hebben betrekking op
      voorschriften, gesteld bij of krachtens de [Gezondheids- en welzijnswet voor dieren](onbekend) die de onderwerpen
      diergezondheid en het brengen van dieren en producten van dierlijke oorsprong in en buiten Nederland betreffen.


      [ref1]: https://wetten.overheid.nl/BWBR0042383#Artikel3
    url: https://wetten.overheid.nl/BWBR0042383/2019-12-14#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0042383
        artikel: '3'
  - number: '3'
    text: >-
      Tenzij bij ministeriële regeling anders is bepaald is Onze Minister de bevoegde autoriteit, bedoeld in artikel 4
      van de verordening (EU) nr. 2017/625.
    url: https://wetten.overheid.nl/BWBR0042383/2019-12-14#Artikel3
  - number: '4'
    text: >-
      Het is verboden in strijd te handelen met bij ministeriële regeling aangewezen voorschriften van verordening (EU)
      nr. 2017/625 of van daarop gebaseerde EU-rechtshandelingen.
    url: https://wetten.overheid.nl/BWBR0042383/2019-12-14#Artikel4
  - number: '5'
    text: >-
      Bij ministeriële regeling worden regels gesteld ter uitvoering van bindende onderdelen van verordening (EU) nr.
      2017/625 en daarop gebaseerde EU-verordeningen of EU-besluiten.
    url: https://wetten.overheid.nl/BWBR0042383/2019-12-14#Artikel5
  - number: '6'
    text: Onze Minister is bevoegd besluiten te nemen als bedoeld in artikel 35, derde lid, verordening (EU) nr. 2017/625.
    url: https://wetten.overheid.nl/BWBR0042383/2019-12-14#Artikel6
  - number: '7'
    text: >-
      1 Een wijziging van een EU-rechtshandeling waarnaar in regels, gesteld krachtens de [Gezondheids- en welzijnswet
      voor dieren](onbekend) wordt verwezen, gaat voor de toepassing van die regels gelden met ingang van de dag
      waarop aan die wijziging uitvoering moet zijn gegeven dan wel bij gebreke daarvan, de dag waarop die wijziging
      is vastgesteld.


      2 Onze Minister kan besluiten dat een wijziging als bedoeld in het eerste lid in afwijking van dat lid op een
      eerder tijdstip gaat gelden. Dit besluit wordt in de Staatscourant bekend gemaakt.
    url: https://wetten.overheid.nl/BWBR0042383/2019-12-14#Artikel7
  - number: '8'
    text: >-
      Op een besluit dat vanwege een geconstateerde niet-naleving is genomen en dat is gebaseerd of mede gebaseerd op
      artikel 19, eerste lid, of artikel 54, eerste en tweede lid, van verordening (EU) nr. 882/2004, dat is genomen
      voor 14 december 2019 en waartegen bezwaar is gemaakt, of beroep is ingesteld, wordt besloten met toepassing van
      verordening (EU) nr. 882/2004 zoals die luidde voor 14 december 2019.
    url: https://wetten.overheid.nl/BWBR0042383/2019-12-14#Artikel8
