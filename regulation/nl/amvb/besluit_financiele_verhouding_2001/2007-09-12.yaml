  - number: '24'
    text: |-
      1 Van een redelijk peil van eigen inkomsten van een gemeente, als bedoeld
      in[ artikel 12, tweede lid, van de wet][ref1] is sprake indien:

      a. een door Onze Ministers bij ministeriële regeling vast te stellen tarief per 2268 euro waarde van de onroerende
      zaken wordt geheven;

      b. de door de gemeente gemaakte lasten inzake huisvuil en bedrijfsvuil volledig worden doorberekend in de
      reinigingsheffingen;

      c. de door de gemeente gemaakte lasten inzake de riolering volledig worden doorberekend in de rioolrechten.

      2 Een tekort op de in het eerste lid, onder b en c, bedoelde onderdelen kan worden gecompenseerd door het tarief
      van de onroerendezaakbelastingen, bedoeld in het eerste lid, onder a, met een met het tekort overeenkomend bedrag
      te verhogen.


      [ref1]: https://wetten.overheid.nl/BWBR0008290#Artikel12
    url: https://wetten.overheid.nl/BWBR0012216/2007-09-12#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0008290
        artikel: '12'
  - number: '25'
    text: |-
      Onze Ministers kunnen nadere regels stellen omtrent:

      a. het verslag van gedeputeerde staten, bedoeld in [artikel 20][ref1];

      b. de procedure in verband met de voorbereiding van het besluit omtrent het verlenen van de aanvullende uitkering;

      c. de uitwerking van de in [paragraaf 2.4][ref2]. van dit besluit gehanteerde begrippen.


      [ref1]: https://wetten.overheid.nl/BWBR0012216#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0012216#Hoofdstuk2
