  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties, mede namens de Staatssecretaris
    van Financiën van 23 oktober 2000, nr. FO2000/U89578, directoraat-generaal Openbaar Bestuur/BFO.

    Gelet op de artikelen 8, derde lid, en 22 van de Financiële-verhoudingswet;

    De Raad van State gehoord (advies van 14 december 2000, nr. WO4.00.0505/1)

    Gezien het nader rapport van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties van 19 januari 2001
    (FO2001/U50552), uitgebracht mede namens de Staatssecretaris van Financiën;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0012216/2007-09-12#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. de wet: de [Financiële-verhoudingswet][ref1];

      b. het CBS: het Centraal bureau voor de statistiek;

      c. de uitkeringsfactor: het quotiënt van het voor de algemene uitkeringen beschikbare bedrag en de som van de
      uitkeringsbases, bedoeld in [artikel 11 van de wet][ref2];

      d. rastervierkanten: vierkanten van 500 bij 500 meter, zoals deze worden gebruikt in het geografisch basisregister
      van het CBS;

      e. omgevingsadressendichtheid van een adres: het aantal adressen in de omgeving van het adres, gedeeld door het
      oppervlak in vierkante kilometers van de omgeving. De omgeving van een adres wordt gevormd door het rastervierkant,
      waarin het adres is gelegen en de twaalf meest nabij gelegen rastervierkanten;

      f. woonkern: een verzameling rastervierkanten die ieder 25 adressen of meer omvatten, en een aaneengesloten gebied
      binnen een gemeente vormen. Indien de verzameling meer dan één rastervierkant bevat zijn de rastervierkanten
      tenminste met één zijde aan elkaar gesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0008290
      [ref2]: https://wetten.overheid.nl/BWBR0008290#Artikel11
    url: https://wetten.overheid.nl/BWBR0012216/2007-09-12#Artikel1
