    text: |-
      1 Na de inwerkingtreding van dit besluit berust de Regeling meet- en rekenregels verdeelmaatstaven en vaststelling
      kilometers gewogen weglengte provinciefonds op [artikel 22 van de wet][ref1] en [artikel 4][ref2] van dit besluit.

      2 Na de inwerkingtreding van dit besluit berust de Regeling meet- en rekenregels verdeelmaatstaven gemeentefonds op
      [artikel 22 van de wet][ref3] en [artikel 4][ref4] van dit besluit.

      3 Na de inwerkingtreding van dit besluit berust de Regeling belastingcapaciteit op de [artikelen 4][ref5] en
      [7][ref6] van dit besluit.

      4 Na de inwerkingtreding van dit besluit berust de Regeling aanvullende uitkering gemeentefonds op
      [artikel 12 van de wet][ref7] en [artikel 25][ref8] van dit besluit.


