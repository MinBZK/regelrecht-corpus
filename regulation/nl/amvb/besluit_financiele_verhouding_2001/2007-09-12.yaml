  - number: '7'
    text: |-
      Het college van burgemeester en wethouders verstrekt jaarlijks aan het CBS gegevens omtrent de in
      [artikel 22 van de Wet waardering onroerende zaken][ref1] bedoelde waarden in de gemeente. Bij regeling van Onze
      Ministers worden nadere regels gesteld omtrent de te verstrekken gegevens alsmede de wijze en het moment van
      verstrekking.


      [ref1]: https://wetten.overheid.nl/BWBR0007119#Artikel22
    url: https://wetten.overheid.nl/BWBR0012216/2007-09-12#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0007119
        artikel: '22'
  - number: '11'
    text: |-
      1 Onder slechte grond wordt verstaan: een minimaal 5 meter dik aaneengesloten pakket holocene klei- en/of veenlagen
      dat zich binnen 8 meter onder het maaiveld bevindt. Binnen deze definitie worden onderscheiden:

      a. kleigebied: de cumulatieve veendikte bedraagt in dit gebied maximaal 50 cm;

      b. klei/veengebied: de cumulatieve veendikte bedraagt tussen de 50 en 400 cm;

      c. veengebied: de cumulatieve veendikte bedraagt minimaal 400 cm.

      2 Onder goede grond wordt verstaan grond die niet aan de omschrijvingen onder a, b en c in het eerste lid van dit
      artikel voldoet.
    url: https://wetten.overheid.nl/BWBR0012216/2007-09-12#Artikel11
  - number: '12'
    text: |-
      1 Het percentage slechte grond is het percentage in het totale oppervlak van land en binnenwater binnen de gemeente
      dat wordt ingenomen door slechte grond.

      2 De bodemfactor van een gemeente of van een deelgebied binnen een gemeente is het gewogen gemiddelde aandeel van
      de verschillende grondsoorten in het totale oppervlak van land en binnenwater binnen de gemeente of het deelgebied.
    url: https://wetten.overheid.nl/BWBR0012216/2007-09-12#Artikel12
  - number: '17'
    text: |-
      Onze Ministers stellen de omvang van de maatstaven Historische kernen, Historische waterwegen, Bewoonde oorden 1930
      en Woningen 1930 in historische kernen vast.
    url: https://wetten.overheid.nl/BWBR0012216/2007-09-12#Artikel17
  - number: '18'
    text: |-
      1 De gemeenten ontvangen via de algemene uitkering uit het gemeentefonds een tegemoetkoming in de kosten die zij
      maken als gevolg van de eigen bijdragen die van hen worden verwacht voor investeringen die mede bekostigd worden
      uit het Investeringsbudget voor stedelijke vernieuwing.

      2 Op basis van de verdeling van het Investeringsbudget stedelijke vernieuwing stellen Onze Ministers in overleg
      met Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer de omvang van het totale voor de
      tegemoetkoming beschikbare bedrag vast alsmede de aandelen van de gemeenten daarin.
    url: https://wetten.overheid.nl/BWBR0012216/2007-09-12#Artikel18
  - number: '19'
    text: |-
      1 De gemeenteraad doet een aanvraag voor een aanvullende uitkering voor 1 december van het jaar voorafgaand aan het
      jaar waarvoor zij wordt aangevraagd.

      2 De aanvraag bevat de vastgestelde begroting voor het jaar waarvoor de aanvullende uitkering wordt aangevraagd.

      3 De aanvraag wordt ingediend bij Onze Ministers en gelijktijdig in afschrift gezonden aan gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0012216/2007-09-12#Artikel19
  - number: '20'
    text: |-
      Gedeputeerde staten brengen voor 15 februari van het jaar waarvoor de aanvullende uitkering is aangevraagd dan wel
      verleend, aan Onze Ministers verslag uit over de financiële positie van de gemeente.
    url: https://wetten.overheid.nl/BWBR0012216/2007-09-12#Artikel20
  - number: '21'
    text: |-
      Onze Ministers kunnen bepalen dat de [artikelen 19][ref1] en [20][ref2] geheel of gedeeltelijk buiten toepassing
      blijven in verband met een besluit tot vaststelling van de aanvullende uitkering voor meer dan een jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0012216#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0012216#Artikel20
    url: https://wetten.overheid.nl/BWBR0012216/2007-09-12#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0012216
        artikel: '19'
        hoofdstuk: '2'
        paragraaf: '2.4'
      - id: ref2
        bwb_id: BWBR0012216
        artikel: '20'
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: '22'
    text: |-
      Onze Ministers besluiten omtrent de aanvraag vóór 1 juni van het jaar, volgend op het jaar waarvoor de aanvullende
      uitkering wordt aangevraagd.
    url: https://wetten.overheid.nl/BWBR0012216/2007-09-12#Artikel22
  - number: '23'
    text: |-
      1 Een aanmerkelijk en structureel tekort als bedoeld in [artikel 12, tweede lid, van de wet][ref1] is een tekort
      dat groter of gelijk is aan 2% van de som van:

      a. de belastingcapaciteit van de gemeente met betrekking tot de onroerende zaakbelastingen;

      b. de algemene uitkering aan de gemeente;

      c. de bedragen, bedoeld in [artikel 6 van de Invoeringswet Financiële-verhoudingswet][ref2], waar de gemeente
      recht op heeft; terwijl in het eerste jaar van aanvraag aannemelijk is dat het tekort zich over het begrotingsjaar
      en de gehele periode van de meerjarenraming voor de drie op het begrotingsjaar volgende jaren uitstrekt.

      2 De belastingcapaciteit wordt bepaald door het totaal van de vastgestelde waarden bedoeld in
      [artikel 22 van de Wet waardering onroerende zaken][ref3], in de gemeente, neerwaarts afgerond op een veelvoud van
      500 000 euro, te vermenigvuldigen met de absolute waarde van het bedrag per eenheid behorende bij de maatstaf die
      in [bijlage 2][ref4], onder nummer 1, is vermeld.

      3 Bij de bepaling van de in het tweede lid bedoelde waarden wordt niet meegerekend de waarde van onroerende
      zaken of delen van onroerende zaken waarover het de gemeente verboden is, bij of krachtens wettelijk voorschrift,
      onroerende-zaakbelasting te heffen.


      [ref1]: https://wetten.overheid.nl/BWBR0008290#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0008291#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0007119#Artikel22
      [ref4]: https://wetten.overheid.nl/BWBR0012216
