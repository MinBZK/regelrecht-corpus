        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: '26'
    text: |-
      1 Onze Ministers doen de betalingen in verband met de uitkeringen, bedoeld in
      [artikel 5, eerste en tweede lid, van de wet][ref1], over het lopende uitkeringsjaar, zoveel mogelijk in gelijke
      wekelijkse delen gedurende de eerste vijftig volle weken van het jaar.

      2 Onze Ministers stellen voor ieder uitkeringsjaar een betalingsschema vast ten behoeve van de uitbetaling, bedoeld
      in [artikel 5, derde lid, van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008290#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0008290#Artikel5
    url: https://wetten.overheid.nl/BWBR0012216/2007-09-12#Artikel26
