        artikel: '5'
  - number: '27'
    text: |-
      1 Gedeputeerde staten en het college van burgemeester en wethouders zenden de informatie ten behoeve van de
      verantwoording over de uitvoering van de regeling van een specifieke uitkering die zij moeten verstrekken aan Onze
      Minister wie het aangaat, aan Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties in de vorm van

      a. de jaarrekening en het jaarverslag, bedoeld in [artikel 202, eerste lid, van de Provinciewet][ref1],
      onderscheidenlijk [artikel 198, eerste lid, van de Gemeentewet][ref2];

      b. de accountantsverklaring en het verslag van bevindingen, bedoeld in
      [artikel 217, derde en vierde lid, van de Provinciewet][ref3], onderscheidenlijk
      [artikel 213, derde en vierde lid, van de Gemeentewet][ref4].

      2 Onze Minister van Binnenlandse Zaken en Koninkrijkrelaties kan bij ministeriële regeling nadere regels stellen
      over de wijze van verzenden van de in het eerste lid bedoelde informatie.

      3 Gedeputeerde staten en het college verstrekken desgevraagd inlichtingen omtrent de besteding van een specifieke
      uitkering aan de door Onze Minister wie het aangaat daartoe aangewezen ambtenaren van de accountantsdienst,
      bedoeld in [artikel 66, eerste lid, van de Comptabiliteitswet 2001][ref5]. De ambtenaren van de accountantsdienst
      kunnen tevens informatie inwinnen bij de in [artikel 217, tweede lid, van de Provinciewet][ref6] onderscheidenlijk
      [artikel 213, tweede lid, van de Gemeentewet][ref7] bedoelde accountants.

      4 De informatie, bedoeld in het eerste lid, wordt uiterlijk 15 juli van het jaar volgend op het begrotingsjaar
      gezonden aan Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties. Onze Minister van Binnenlandse Zaken
      en Koninkrijksrelaties brengt de informatie betreffende de specifieke uitkeringen onverwijld ter kennis aan Onze
      Ministers wie het aangaat.


