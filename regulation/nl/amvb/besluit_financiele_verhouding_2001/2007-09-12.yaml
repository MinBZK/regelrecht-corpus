  - number: '6'
    text: |-
      1 Onze Ministers stellen het aantal kilometers gewogen weglengte, bedoeld in de verdeelmaatstaf vermeld onder
      nummer 7 van [bijlage 1][ref1], van de wegen in beheer bij de provincie vast, door het aantal kilometers weglengte
      van de wegen die in beheer zijn bij de provincie te vermenigvuldigen met een wegingsfactor die een maat is voor
      de kosten per kilometer van het onderhoud van de wegen in de provincie, in verhouding met die kosten in alle
      provincies.

      2. Op de voorbereiding van dit besluit is [afdeling 3.4 van de Algemene wet bestuursrecht][ref2] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0012216
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
