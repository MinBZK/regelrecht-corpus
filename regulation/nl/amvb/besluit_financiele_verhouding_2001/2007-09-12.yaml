        artikel: '11'
  - number: '2'
    text: |-
      Vóór 1 juli van het jaar voorafgaand aan het uitkeringsjaar geven Onze Ministers aan gedeputeerde staten en de
      colleges van burgemeester en wethouders kennis van:

      a. de verwachte bedragen per eenheid over het uitkeringsjaar;

      b. de verwachte uitkeringsfactor over het uitkeringsjaar;

      c. de verwachte ontwikkeling van de uitkeringsfactor over de vier jaren na het uitkeringsjaar.
    url: https://wetten.overheid.nl/BWBR0012216/2007-09-12#Artikel2
  - number: '3'
    text: |-
      1 Bij de verdeling van het voor de algemene uitkeringen aan de provincies beschikbare bedrag worden de
      verdeelmaatstaven gehanteerd die zijn omschreven in [bijlage 1][ref1] bij dit besluit.

      2 Bij de verdeling van het voor de algemene uitkeringen aan de gemeenten beschikbare bedrag worden de
      verdeelmaatstaven gehanteerd die zijn omschreven in [bijlage 2][ref2] bij dit besluit.

      3 Bij de vaststelling van de algemene uitkering aan een provincie of gemeente stellen Onze Ministers zo nodig
      het aantal eenheden per verdeelmaatstaf vast. Voor zover in [bijlage 1][ref3] en [bijlage 2][ref4] bij een
      verdeelmaatstaf een bron is vermeld, kunnen Onze Ministers het aantal eenheden ontlenen aan een opgave van het
      vermelde orgaan of de vermelde instantie.

      4 De vaststelling van het aantal eenheden per verdeelmaatstaf voor een provincie of gemeente geschiedt naar de
      toestand op 1 januari van het uitkeringsjaar waarover het aantal wordt vastgesteld, tenzij in [bijlage 1][ref5]
      of [bijlage 2][ref6] een peildatum of andere tijdsaanduiding bij een verdeelmaatstaf is vermeld. In dat geval
      geschiedt de vaststelling naar de toestand op de aangegeven datum of de gegeven tijdsaanduiding.

      5 Indien op grond van het vierde lid een peildatum of tijdsaanduiding moet worden gehanteerd die ligt vóór de datum
      van herindeling van de provincie of gemeente, stellen Onze Ministers het aantal eenheden vast op basis van een
      redelijke schatting van de toestand zoals die op het aangegeven tijdstip zou zijn geweest als de herindeling op dat
      tijdstip reeds was ingegaan.


      [ref1]: https://wetten.overheid.nl/BWBR0012216
      [ref2]: https://wetten.overheid.nl/BWBR0012216
      [ref3]: https://wetten.overheid.nl/BWBR0012216
      [ref4]: https://wetten.overheid.nl/BWBR0012216
