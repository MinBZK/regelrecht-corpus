    text: |-
      Bij de bepaling van het totaal van de in een kalenderjaar ontvangen hoofdsommen van de motorrijtuigenbelasting,
      als bedoeld in de verdeelmaatstaf vermeld onder nummer 1 van [bijlage 1][ref1], wordt het tarief van de
      [Wet op de motorrijtuigenbelasting 1994][ref2] gehanteerd, zoals dat gold op 1 april 1995. De verhoging van de
      belasting, bedoeld in [artikel 23, tweede lid, van die wet][ref3] en de vermindering van de belasting, bedoeld in
      de artikelen [28][ref4] en [68 van die wet][ref5], blijven buiten beschouwing.


      [ref1]: https://wetten.overheid.nl/BWBR0012216
      [ref2]: https://wetten.overheid.nl/BWBR0006324
