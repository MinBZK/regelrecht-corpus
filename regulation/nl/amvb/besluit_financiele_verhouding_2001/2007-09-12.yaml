  - number: '28'
    text: |-
      Vóór 1 oktober van het jaar voorafgaand aan het uitkeringsjaar geven Onze Ministers wie het aangaat aan
      gedeputeerde staten en de colleges van burgemeester en wethouders kennis van:

      a. de verwachte specifieke uitkeringen voor het uitkeringsjaar;

      b. de verwachte wijzigingen in de specifieke uitkeringen voor de vier jaren na het uitkeringsjaar.
    url: https://wetten.overheid.nl/BWBR0012216/2007-09-12#Artikel28
  - number: '29'
    text: |-
      1 De algemene uitkering over de jaren 2001 tot en met 2004, zoals deze voor iedere gemeente wordt berekend
      overeenkomstig dit besluit, wordt vermeerderd of verminderd met een bedrag overeenkomstig de tabel die als
      [bijlage 4][ref1] bij dit besluit is gevoegd. Deze vermeerdering of vermindering komt ten laste van of ten goede
      aan het gemeentefonds.

      2 Indien een gemeente die is vermeld in [bijlage 4][ref2] is opgeheven, vindt de
      vermeerdering of de vermindering plaats ten aanzien van de algemene uitkering van de in
      [artikel 44, eerste lid, van de Wet algemene regels herindeling][ref3] bedoelde gemeente waar alle rechten en
      verplichtingen naar overgaan.


