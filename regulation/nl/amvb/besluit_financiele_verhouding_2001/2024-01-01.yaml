---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_financiele_verhouding_2001
regulatory_layer: AMVB
publication_date: '2025-04-16'
valid_from: '2024-01-01'
bwb_id: BWBR0012216
url: https://wetten.overheid.nl/BWBR0012216/2024-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties, mede namens de Staatssecretaris
    van Financiën van 23 oktober 2000, nr. FO2000/U89578, directoraat-generaal Openbaar Bestuur/BFO.

    Gelet op de artikelen 8, derde lid, en 22 van de Financiële-verhoudingswet;

    De Raad van State gehoord (advies van 14 december 2000, nr. WO4.00.0505/1)

    Gezien het nader rapport van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties van 19 januari 2001
    (FO2001/U50552), uitgebracht mede namens de Staatssecretaris van Financiën;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0012216/2024-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0012216/2024-01-01#Artikel1
  - number: 1.a
    text: |-
      de wet: de [Financiële-verhoudingswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008290
    url: https://wetten.overheid.nl/BWBR0012216/2024-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0008290
  - number: 1.b
    text: 'het CBS: het Centraal bureau voor de statistiek;'
    url: https://wetten.overheid.nl/BWBR0012216/2024-01-01#Artikel1
  - number: 1.c
    text: |-
      de uitkeringsfactor: het quotiënt van het voor de algemene uitkeringen beschikbare bedrag en de som van de
      uitkeringsbases, bedoeld in [artikel 11 van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008290#Artikel11
    url: https://wetten.overheid.nl/BWBR0012216/2024-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0008290
        artikel: '11'
  - number: 1.d
    text: |-
      rastervierkanten: vierkanten van 500 bij 500 meter, zoals deze worden gebruikt in het geografisch basisregister van
      het CBS;
    url: https://wetten.overheid.nl/BWBR0012216/2024-01-01#Artikel1
  - number: 1.e
    text: |-
      omgevingsadressendichtheid van een adres: het aantal adressen in de omgeving van het adres, gedeeld door het
      oppervlak in vierkante kilometers van de omgeving. De omgeving van een adres wordt gevormd door het rastervierkant,
      waarin het adres is gelegen en de twaalf meest nabij gelegen rastervierkanten;
    url: https://wetten.overheid.nl/BWBR0012216/2024-01-01#Artikel1
  - number: 1.f
    text: |-
      woonkern: een verzameling rastervierkanten die ieder 25 adressen of meer omvatten, en een aaneengesloten gebied
      binnen een gemeente vormen. Indien de verzameling meer dan één rastervierkant bevat zijn de rastervierkanten
      tenminste met één zijde aan elkaar gesloten.
    url: https://wetten.overheid.nl/BWBR0012216/2024-01-01#Artikel1
  - number: '2'
    text: |-
      Vóór 1 juli van het jaar voorafgaand aan het uitkeringsjaar geven Onze Ministers aan gedeputeerde staten en de
      colleges van burgemeester en wethouders kennis van:
    url: https://wetten.overheid.nl/BWBR0012216/2024-01-01#Artikel2
  - number: 2.a
    text: de verwachte bedragen per eenheid over het uitkeringsjaar;
    url: https://wetten.overheid.nl/BWBR0012216/2024-01-01#Artikel2
  - number: 2.b
    text: de verwachte uitkeringsfactor over het uitkeringsjaar;
    url: https://wetten.overheid.nl/BWBR0012216/2024-01-01#Artikel2
  - number: 2.c
    text: de verwachte ontwikkeling van de uitkeringsfactor over de vier jaren na het uitkeringsjaar.
    url: https://wetten.overheid.nl/BWBR0012216/2024-01-01#Artikel2
  - number: '3.1'
    text: |-
      Bij de verdeling van het voor de algemene uitkeringen aan de provincies beschikbare bedrag worden de
      verdeelmaatstaven gehanteerd die zijn omschreven in [bijlage 1][ref1] bij dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0012216
    url: https://wetten.overheid.nl/BWBR0012216/2024-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0012216
  - number: '3.2'
    text: |-
      Bij de verdeling van het voor de algemene uitkeringen aan de gemeenten beschikbare bedrag worden de
      verdeelmaatstaven gehanteerd die zijn omschreven in [bijlage 2][ref1] bij dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0012216
    url: https://wetten.overheid.nl/BWBR0012216/2024-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0012216
  - number: '3.3'
    text: |-
      Bij de vaststelling van de algemene uitkering aan een provincie of gemeente stellen Onze Ministers zo nodig
      het aantal eenheden per verdeelmaatstaf vast. Voor zover in [bijlage 1][ref1] en [bijlage 2][ref2] bij een
      verdeelmaatstaf een bron is vermeld, kunnen Onze Ministers het aantal eenheden ontlenen aan een opgave van het
      vermelde orgaan of de vermelde instantie.


      [ref1]: https://wetten.overheid.nl/BWBR0012216
      [ref2]: https://wetten.overheid.nl/BWBR0012216
    url: https://wetten.overheid.nl/BWBR0012216/2024-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0012216
      - id: ref2
        bwb_id: BWBR0012216
  - number: '3.4'
    text: |-
      De vaststelling van het aantal eenheden per verdeelmaatstaf voor een provincie of gemeente geschiedt naar de
      toestand op 1 januari van het uitkeringsjaar waarover het aantal wordt vastgesteld, tenzij in [bijlage 1][ref1]
      of [bijlage 2][ref2] een peildatum of andere tijdsaanduiding bij een verdeelmaatstaf is vermeld. In dat geval
      geschiedt de vaststelling naar de toestand op de aangegeven datum of de gegeven tijdsaanduiding.


      [ref1]: https://wetten.overheid.nl/BWBR0012216
      [ref2]: https://wetten.overheid.nl/BWBR0012216
    url: https://wetten.overheid.nl/BWBR0012216/2024-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0012216
      - id: ref2
        bwb_id: BWBR0012216
  - number: '3.5'
    text: |-
      Indien op grond van het vierde lid een peildatum of tijdsaanduiding moet worden gehanteerd die ligt vóór de datum
      van herindeling van de provincie of gemeente, stellen Onze Ministers het aantal eenheden vast op basis van een
      redelijke schatting van de toestand zoals die op het aangegeven tijdstip zou zijn geweest als de herindeling op dat
      tijdstip reeds was ingegaan.
    url: https://wetten.overheid.nl/BWBR0012216/2024-01-01#Artikel3
  - number: '4'
    text: |-
      Onze Ministers kunnen nadere regels stellen omtrent de uitwerking van de in [bijlage 1][ref1] en [bijlage 2][ref2]
      en in de [paragrafen 2.2][ref3] en [2.3 van dit besluit][ref4] gehanteerde begrippen en omtrent de telling van het
      aantal eenheden per verdeelmaatstaf voor zover dit noodzakelijk is om de verdeelmaatstaven te kunnen toepassen.


      [ref1]: https://wetten.overheid.nl/BWBR0012216
      [ref2]: https://wetten.overheid.nl/BWBR0012216
      [ref3]: https://wetten.overheid.nl/BWBR0012216#Hoofdstuk2
      [ref4]: https://wetten.overheid.nl/BWBR0012216#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0012216/2024-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0012216
      - id: ref2
        bwb_id: BWBR0012216
      - id: ref3
        bwb_id: BWBR0012216
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref4
        bwb_id: BWBR0012216
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: '11.1'
    text: |-
      Onder slechte grond wordt verstaan: een minimaal 5 meter dik aaneengesloten pakket holocene klei- en/of veenlagen
      dat zich binnen 8 meter onder het maaiveld bevindt. Binnen deze definitie worden onderscheiden:
    url: https://wetten.overheid.nl/BWBR0012216/2024-01-01#Artikel11
  - number: 11.1.a
    text: 'kleigebied: de cumulatieve veendikte bedraagt in dit gebied maximaal 50 cm;'
    url: https://wetten.overheid.nl/BWBR0012216/2024-01-01#Artikel11
  - number: 11.1.b
    text: 'klei/veengebied: de cumulatieve veendikte bedraagt tussen de 50 en 400 cm;'
    url: https://wetten.overheid.nl/BWBR0012216/2024-01-01#Artikel11
  - number: 11.1.c
    text: 'veengebied: de cumulatieve veendikte bedraagt minimaal 400 cm.'
    url: https://wetten.overheid.nl/BWBR0012216/2024-01-01#Artikel11
  - number: '11.2'
    text: |-
      Onder goede grond wordt verstaan grond die niet aan de omschrijvingen onder a, b en c in het eerste lid van dit
      artikel voldoet.
    url: https://wetten.overheid.nl/BWBR0012216/2024-01-01#Artikel11
  - number: '12'
    text: |-
      De bodemfactor van een gemeente of van een deelgebied binnen een gemeente is het gewogen gemiddelde aandeel van de
      verschillende grondsoorten in het totale oppervlak van land en binnenwater binnen de gemeente of het deelgebied.
    url: https://wetten.overheid.nl/BWBR0012216/2024-01-01#Artikel12
  - number: '17'
    text: |-
      Onze Ministers stellen de omvang van de maatstaven Historische kernen, Historische waterwegen, Bewoonde oorden 1930
      en Woningen 1930 in historische kernen vast.
    url: https://wetten.overheid.nl/BWBR0012216/2024-01-01#Artikel17
  - number: '18.1'
    text: |-
      De gemeenten ontvangen via de algemene uitkering uit het gemeentefonds een tegemoetkoming in de kosten die zij
      maken als gevolg van de eigen bijdragen die van hen worden verwacht voor investeringen die mede bekostigd worden
      uit het Investeringsbudget voor stedelijke vernieuwing.
    url: https://wetten.overheid.nl/BWBR0012216/2024-01-01#Artikel18
  - number: '18.2'
    text: |-
      Op basis van de verdeling van het Investeringsbudget stedelijke vernieuwing stellen Onze Ministers in overleg met
      Onze Minister wie het aangaat de omvang van het totale voor de tegemoetkoming beschikbare bedrag vast alsmede de
      aandelen van de gemeenten daarin.
    url: https://wetten.overheid.nl/BWBR0012216/2024-01-01#Artikel18
  - number: '19.1'
    text: |-
      De gemeenteraad doet een aanvraag voor een aanvullende uitkering voor 1 december van het jaar voorafgaand aan het
      jaar waarvoor zij wordt aangevraagd.
    url: https://wetten.overheid.nl/BWBR0012216/2024-01-01#Artikel19
  - number: '19.2'
    text: De aanvraag bevat de vastgestelde begroting voor het jaar waarvoor de aanvullende uitkering wordt aangevraagd.
    url: https://wetten.overheid.nl/BWBR0012216/2024-01-01#Artikel19
  - number: '19.3'
    text: De aanvraag wordt ingediend bij Onze Ministers en gelijktijdig in afschrift gezonden aan gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0012216/2024-01-01#Artikel19
  - number: '20'
    text: |-
      Gedeputeerde staten brengen voor 15 februari van het jaar waarvoor de aanvullende uitkering is aangevraagd dan wel
      verleend, aan Onze Ministers verslag uit over de financiële positie van de gemeente.
    url: https://wetten.overheid.nl/BWBR0012216/2024-01-01#Artikel20
  - number: '21'
    text: |-
      Onze Ministers kunnen bepalen dat de [artikelen 19][ref1] en [20][ref2] geheel of gedeeltelijk buiten toepassing
      blijven in verband met een besluit tot vaststelling van de aanvullende uitkering voor meer dan een jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0012216#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0012216#Artikel20
    url: https://wetten.overheid.nl/BWBR0012216/2024-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0012216
        artikel: '19'
        hoofdstuk: '2'
        paragraaf: '2.4'
      - id: ref2
        bwb_id: BWBR0012216
        artikel: '20'
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: '22'
    text: |-
      Onze Ministers besluiten omtrent de aanvraag vóór 1 juni van het jaar, volgend op het jaar waarvoor de aanvullende
      uitkering wordt aangevraagd.
    url: https://wetten.overheid.nl/BWBR0012216/2024-01-01#Artikel22
  - number: '23.1'
    text: |-
      Een gemeente heeft een aanmerkelijk en structureel tekort als bedoeld in
      [artikel 12, tweede lid, van de wet][ref1], indien:


      [ref1]: https://wetten.overheid.nl/BWBR0008290#Artikel12
    url: https://wetten.overheid.nl/BWBR0012216/2024-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0008290
        artikel: '12'
  - number: 23.1.a
    text: 'het tekort van de gemeente groter of gelijk is aan 2% van de som van:'
    url: https://wetten.overheid.nl/BWBR0012216/2024-01-01#Artikel23
  - number: 23.1.a.1°
    text: de belastingcapaciteit van de gemeente met betrekking tot de onroerendezaakbelastingen;
    url: https://wetten.overheid.nl/BWBR0012216/2024-01-01#Artikel23
  - number: 23.1.a.2°
    text: de algemene uitkering aan de gemeente;
    url: https://wetten.overheid.nl/BWBR0012216/2024-01-01#Artikel23
  - number: 23.1.a.3°
    text: de decentralisatie-uitkeringen aan de gemeente;
    url: https://wetten.overheid.nl/BWBR0012216/2024-01-01#Artikel23
  - number: 23.1.a.4°
    text: de integratie-uitkeringen aan de gemeente, en
    url: https://wetten.overheid.nl/BWBR0012216/2024-01-01#Artikel23
  - number: 23.1.b
    text: |-
      de gemeente in het eerste jaar van aanvraag aannemelijk kan maken dat het tekort zich over het begrotingsjaar en de
      drie daarop volgende jaren uitstrekt.
    url: https://wetten.overheid.nl/BWBR0012216/2024-01-01#Artikel23
  - number: '23.2'
    text: |-
      De belastingcapaciteit wordt bepaald door het totaal van de vastgestelde waarden bedoeld in
      [artikel 22 van de Wet waardering onroerende zaken][ref1], in de gemeente, neerwaarts afgerond op een veelvoud van
      500 000 euro, te vermenigvuldigen met de absolute waarde van de bedragen per eenheid behorende bij de maatstaven
      die in [bijlage 2][ref2], onder nummer 1, 1a en 1b zijn vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0007119#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0012216
    url: https://wetten.overheid.nl/BWBR0012216/2024-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0007119
        artikel: '22'
      - id: ref2
        bwb_id: BWBR0012216
  - number: '23.3'
    text: |-
      Bij de bepaling van de in het tweede lid bedoelde waarden wordt niet meegerekend de waarde van onroerende zaken
      of delen van onroerende zaken waarover het de gemeente verboden is, bij of krachtens wettelijk voorschrift,
      onroerende-zaakbelasting te heffen.
    url: https://wetten.overheid.nl/BWBR0012216/2024-01-01#Artikel23
  - number: '24.1'
    text: |-
      Van een redelijk peil van eigen inkomsten van een gemeente, als bedoeld in
      [artikel 12, tweede lid, van de wet][ref1] is sprake indien:


      [ref1]: https://wetten.overheid.nl/BWBR0008290#Artikel12
    url: https://wetten.overheid.nl/BWBR0012216/2024-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0008290
        artikel: '12'
  - number: 24.1.a
    text: een door Onze Ministers bij ministeriële regeling vast te stellen percentage van de heffingsmaatstaf wordt geheven;
    url: https://wetten.overheid.nl/BWBR0012216/2024-01-01#Artikel24
  - number: 24.1.b
    text: |-
      de door de gemeente gemaakte lasten inzake huisvuil en bedrijfsvuil volledig worden doorberekend in de
      reinigingsheffingen;
    url: https://wetten.overheid.nl/BWBR0012216/2024-01-01#Artikel24
  - number: 24.1.c
    text: de door de gemeente gemaakte lasten inzake de riolering volledig worden doorberekend in de rioolheffingen.
    url: https://wetten.overheid.nl/BWBR0012216/2024-01-01#Artikel24
  - number: '24.2'
    text: |-
      Een tekort op de in het eerste lid, onder b en c, bedoelde onderdelen kan worden gecompenseerd door het tarief
      van de onroerendezaakbelastingen, bedoeld in het eerste lid, onder a, met een met het tekort overeenkomend bedrag
      te verhogen.
    url: https://wetten.overheid.nl/BWBR0012216/2024-01-01#Artikel24
  - number: '25'
    text: 'Onze Ministers kunnen nadere regels stellen omtrent:'
    url: https://wetten.overheid.nl/BWBR0012216/2024-01-01#Artikel25
  - number: 25.a
    text: |-
      het verslag van gedeputeerde staten, bedoeld in [artikel 20][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0012216#Artikel20
    url: https://wetten.overheid.nl/BWBR0012216/2024-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0012216
        artikel: '20'
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: 25.b
    text: de procedure in verband met de voorbereiding van het besluit omtrent het verlenen van de aanvullende uitkering;
    url: https://wetten.overheid.nl/BWBR0012216/2024-01-01#Artikel25
  - number: 25.c
    text: |-
      de uitwerking van de in [paragraaf 2.4][ref1]. van dit besluit gehanteerde begrippen.


      [ref1]: https://wetten.overheid.nl/BWBR0012216#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0012216/2024-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0012216
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: '26.1'
    text: |-
      Onze Ministers doen de betalingen in verband met de uitkeringen, bedoeld in
      [artikel 5, eerste en tweede lid, van de wet][ref1], over het lopende uitkeringsjaar, zoveel mogelijk in gelijke
      wekelijkse delen gedurende de eerste vijftig volle weken van het jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0008290#Artikel5
    url: https://wetten.overheid.nl/BWBR0012216/2024-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0008290
        artikel: '5'
  - number: '26.2'
    text: |-
      Onze Ministers stellen voor ieder uitkeringsjaar een betalingsschema vast ten behoeve van de uitbetaling, bedoeld
      in [artikel 5, derde lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008290#Artikel5
    url: https://wetten.overheid.nl/BWBR0012216/2024-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0008290
        artikel: '5'
  - number: '27'
    text: |-
      [Artikel 17a van de Financiële-verhoudingswet][ref1] is van toepassing op de verantwoordingsinformatie van
      gedeputeerde staten en het college van burgemeester en wethouders.


      [ref1]: https://wetten.overheid.nl/BWBR0008290#Artikel17a
    url: https://wetten.overheid.nl/BWBR0012216/2024-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0008290
        artikel: 17a
  - number: '28'
    text: |-
      Vóór 1 oktober van het jaar voorafgaand aan het uitkeringsjaar geven Onze Ministers wie het aangaat aan
      gedeputeerde staten en de colleges van burgemeester en wethouders kennis van:
    url: https://wetten.overheid.nl/BWBR0012216/2024-01-01#Artikel28
  - number: 28.a
    text: de verwachte specifieke uitkeringen voor het uitkeringsjaar;
    url: https://wetten.overheid.nl/BWBR0012216/2024-01-01#Artikel28
  - number: 28.b
    text: de verwachte wijzigingen in de specifieke uitkeringen voor de vier jaren na het uitkeringsjaar.
    url: https://wetten.overheid.nl/BWBR0012216/2024-01-01#Artikel28
  - number: 28a
    text: |-
      Het grensbedrag voor de verzameluitkering, bedoeld in [artikel 15a, derde lid, van de wet][ref1], wordt vastgesteld
      op € 10 miljoen inclusief BTW voor de totale omvang van de beschikbare bijdrage.


      [ref1]: https://wetten.overheid.nl/BWBR0008290#Artikel15a
    url: https://wetten.overheid.nl/BWBR0012216/2024-01-01#Artikel28a
    references:
      - id: ref1
        bwb_id: BWBR0008290
        artikel: 15a
  - number: '29.1'
    text: |-
      Indien de effecten van een nieuwe verdeelmethodiek ertoe leiden dat de uitkering per inwoner van een gemeente
      aanmerkelijk hoger of lager is, kan de algemene uitkering aan de desbetreffende gemeente worden verlaagd of
      verhoogd ten laste van het gemeentefonds. De uitkeringsfactor is op deze bedragen niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0012216/2024-01-01#Artikel29
  - number: '29.2'
    text: |-
      Onze Ministers stellen bij ministeriële regeling vast wat de maximale verlaging per inwoner van de gemeente van de
      algemene uitkering voor de gemeenten mag bedragen.
    url: https://wetten.overheid.nl/BWBR0012216/2024-01-01#Artikel29
  - number: '29.3'
    text: |-
      Onze Ministers maken vóór 1 juli van het jaar voorafgaande aan een uitkeringsjaar bekend op welke bedragen de
      gemeenten voorlopig kunnen rekenen.
    url: https://wetten.overheid.nl/BWBR0012216/2024-01-01#Artikel29
  - number: '29.4'
    text: Bij beschikking wordt het definitieve bedrag van de verhoging of verlaging van de algemene uitkering vastgesteld.
    url: https://wetten.overheid.nl/BWBR0012216/2024-01-01#Artikel29
  - number: '31.1'
    text: |-
