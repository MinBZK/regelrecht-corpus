  - number: '37'
    text: Het Besluit financiële verhouding wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0012216/2024-01-01#Artikel37
  - number: '38.1'
    text: Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0012216/2024-01-01#Artikel38
  - number: '38.2'
    text: |-
      De verdeelmaatstaven die zijn vermeld in
      __REF000___________________________________________________________________________________________________________
      ___________________________________________________________________________________________________________________
      ________________, worden met ingang van de uitkering uit het provinciefonds voor het jaar 2001 vervangen door de
      verdeelmaatstaven die zijn opgenomen in [bijlage 1][ref2] bij dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0008995
      [ref2]: https://wetten.overheid.nl/BWBR0012216
    url: https://wetten.overheid.nl/BWBR0012216/2024-01-01#Artikel38
