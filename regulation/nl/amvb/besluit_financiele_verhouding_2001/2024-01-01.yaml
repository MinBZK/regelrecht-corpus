  - number: '38.3'
    text: |-
      De verdeelmaatstaven die zijn vermeld in [bijlage 2 van de Invoeringswet Financiële-verhoudingswet][ref1],
      en in de [bijlagen bij het Besluit van 14 mei 1998 houdende toevoeging van de categorie vluchtelingen
      aan de verdeelmaatstaf minderheden en enkele andere aanpassingen van de verdeelmaatstaven van
      het gemeentefonds](onbekend), het Wijzigingsbesluit verdeelmaatstaven gemeentefonds 1999 en het
      [Wijzigingsbesluit verdeelmaatstaven gemeentefonds 2000][ref2], worden met ingang van de uitkering uit het
      gemeentefonds voor het jaar 2001 vervangen door de verdeelmaatstaven die zijn opgenomen in [bijlage 2][ref3] bij
      dit besluit.


