preamble:
  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Op de voordracht van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 20 juli 1992, nr.
    MJZ20792030, Centrale Directie Juridische Zaken, Afdeling Wetgeving;


    Gelet op de richtlijnen van de Raad van de Europese Gemeenschappen van 8 juni 1989, nr. 89/369/EEG (PbEG
    L 163/32) ter voorkoming van door nieuwe installaties voor de verbranding van stedelijk afval veroorzaakte
    luchtverontreiniging, en van 21 juni 1989, nr. 89/429/EEG (PbEG L 203/50) ter vermindering van door bestaande
    installaties voor de verbranding van stedelijk afval veroorzaakte luchtverontreiniging, en op artikel 53a van de
    Afvalstoffenwet;


    De Raad van State gehoord (advies van 24 november 1992, no. W08.92.0350);


    Gezien het nader rapport van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 4 januari
    1993, nr. MJZ04193030, Centrale Directie Juridische Zaken, Afdeling Wetgeving;


    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0005836/2000-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. inrichting: inrichting die behoort tot een krachtens [artikel 1.1, derde lid, van de Wet milieubeheer][ref1]
      aangewezen categorie, die in hoofdzaak is bestemd voor het verbranden van huishoudelijke afvalstoffen of van
      afvalstoffen afkomstig van bedrijven, die te zamen met huishoudelijke afvalstoffen worden verbrand;

      b. bevoegd gezag: bestuursorgaan dat bevoegd is een vergunning krachtens
      [artikel 8.1 van de Wet milieubeheer][ref2] voor de betrokken inrichting te verlenen;

      c. zware metalen: de scheikundige elementen Sb, Pb, Cr, Cu, Mn, V, Sn, As, Co, Ni, Se of Te, alsmede hun
      verbindingen, berekend als de onderscheidene elementen;

      d. cadmium: het scheikundige element Cd, alsmede de Cd-verbindingen, berekend als Cd;

      e. kwik: het scheikundige element Hg, alsmede de Hg-verbindingen, berekend als Hg.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel1.1
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel8.1
    url: https://wetten.overheid.nl/BWBR0005836/2000-07-01#Artikel1
    references:
