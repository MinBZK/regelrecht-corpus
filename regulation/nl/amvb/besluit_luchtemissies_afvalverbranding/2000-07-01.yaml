---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_luchtemissies_afvalverbranding
regulatory_layer: AMVB
publication_date: '2004-04-20'
valid_from: '2000-07-01'
bwb_id: BWBR0005836
url: https://wetten.overheid.nl/BWBR0005836/2000-07-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 20 juli 1992, nr.
    MJZ20792030, Centrale Directie Juridische Zaken, Afdeling Wetgeving;

    Gelet op de richtlijnen van de Raad van de Europese Gemeenschappen van 8 juni 1989, nr. 89/369/EEG (PbEG
    L 163/32) ter voorkoming van door nieuwe installaties voor de verbranding van stedelijk afval veroorzaakte
    luchtverontreiniging, en van 21 juni 1989, nr. 89/429/EEG (PbEG L 203/50) ter vermindering van door bestaande
    installaties voor de verbranding van stedelijk afval veroorzaakte luchtverontreiniging, en op artikel 53a van de
    Afvalstoffenwet;

    De Raad van State gehoord (advies van 24 november 1992, no. W08.92.0350);

    Gezien het nader rapport van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 4 januari
    1993, nr. MJZ04193030, Centrale Directie Juridische Zaken, Afdeling Wetgeving;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0005836/2000-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0005836/2000-07-01#Artikel1
  - number: 1.a
    text: |-
      inrichting: inrichting die behoort tot een krachtens [artikel 1.1, derde lid, van de Wet milieubeheer][ref1]
      aangewezen categorie, die in hoofdzaak is bestemd voor het verbranden van huishoudelijke afvalstoffen of van
      afvalstoffen afkomstig van bedrijven, die te zamen met huishoudelijke afvalstoffen worden verbrand;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel1
    url: https://wetten.overheid.nl/BWBR0005836/2000-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '1'
  - number: 1.b
    text: |-
      bevoegd gezag: bestuursorgaan dat bevoegd is een vergunning krachtens [artikel 8.1 van de Wet milieubeheer][ref1]
      voor de betrokken inrichting te verlenen;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0005836/2000-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
  - number: 1.c
    text: |-
      zware metalen: de scheikundige elementen Sb, Pb, Cr, Cu, Mn, V, Sn, As, Co, Ni, Se of Te, alsmede hun verbindingen,
      berekend als de onderscheidene elementen;
    url: https://wetten.overheid.nl/BWBR0005836/2000-07-01#Artikel1
  - number: 1.d
    text: 'cadmium: het scheikundige element Cd, alsmede de Cd-verbindingen, berekend als Cd;'
    url: https://wetten.overheid.nl/BWBR0005836/2000-07-01#Artikel1
  - number: 1.e
    text: 'kwik: het scheikundige element Hg, alsmede de Hg-verbindingen, berekend als Hg.'
    url: https://wetten.overheid.nl/BWBR0005836/2000-07-01#Artikel1
  - number: '2'
    text: 'Degene die een inrichting drijft:'
    url: https://wetten.overheid.nl/BWBR0005836/2000-07-01#Artikel2
  - number: 2.a
    text: |-
      voor het oprichten en in werking hebben waarvan een vergunning geldt krachtens
      [artikel 8.1 van de Wet milieubeheer][ref1], die op of na 1 april 1990 is verleend, dient met betrekking tot die
      verbranding te voldoen aan de voorschriften die zijn opgenomen in de bij dit besluit behorende [bijlage A][ref2],
      alsmede aan de krachtens deze voorschriften door het bevoegd gezag gestelde nadere eisen;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005836
    url: https://wetten.overheid.nl/BWBR0005836/2000-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0005836
  - number: 2.b
    text: |-
      voor het oprichten en in werking hebben waarvan een vergunning geldt krachtens
      [artikel 8.1 van de Wet milieubeheer][ref1], die voor 1 april 1990 is verleend, dient met betrekking tot die
      verbranding te voldoen aan de voorschriften die zijn opgenomen in de bij dit besluit behorende [bijlage B][ref2],
      alsmede aan de krachtens deze voorschriften door het bevoegd gezag gestelde nadere eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005836
    url: https://wetten.overheid.nl/BWBR0005836/2000-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0005836
  - number: '3.1'
    text: |-
      Het bevoegd gezag kan bij het verlenen of het wijzigen van de vergunning voor de inrichtingen, bedoeld in
      [artikel 2][ref1], afwijken van de voorschriften, opgenomen in de bij dit besluit behorende:


      [ref1]: https://wetten.overheid.nl/BWBR0005836#Artikel2
    url: https://wetten.overheid.nl/BWBR0005836/2000-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005836
        artikel: '2'
  - number: 3.1.a
    text: |-
      [bijlage A][ref1], [onder 1][ref2], [onderdeel ][ref3], en [bijlage B][ref4], [onder 2][ref5], [onderdeel ][ref6],
      voor zover daardoor per component geen hogere waarden voor de uitworp met de rookgassen worden bereikt dan
      overeenkomstig deze bijlagen is toegestaan;


      [ref1]: https://wetten.overheid.nl/BWBR0005836
      [ref2]: https://wetten.overheid.nl/BWBR0005836
      [ref3]: https://wetten.overheid.nl/BWBR0005836
      [ref4]: https://wetten.overheid.nl/BWBR0005836
      [ref5]: https://wetten.overheid.nl/BWBR0005836
      [ref6]: https://wetten.overheid.nl/BWBR0005836
    url: https://wetten.overheid.nl/BWBR0005836/2000-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005836
      - id: ref2
        bwb_id: BWBR0005836
      - id: ref3
        bwb_id: BWBR0005836
      - id: ref4
        bwb_id: BWBR0005836
      - id: ref5
        bwb_id: BWBR0005836
      - id: ref6
        bwb_id: BWBR0005836
  - number: 3.1.b
    text: |-
      [bijlage A][ref1], [onder 3][ref2], [onderdeel ][ref3], en [bijlage B][ref4], [onder 1][ref5], indien degene die
      de inrichting drijft, aan het bevoegd gezag aantoont dat de hiertoe behorende installatie voor de reiniging van
      rookgassen ten minste negentig procent van het in de rookgassen aanwezige kwik verwijdert en emissie naar de lucht
      van kwik de grenswaarde 0,1 mg/m3 niet overschrijdt;


      [ref1]: https://wetten.overheid.nl/BWBR0005836
      [ref2]: https://wetten.overheid.nl/BWBR0005836
      [ref3]: https://wetten.overheid.nl/BWBR0005836
      [ref4]: https://wetten.overheid.nl/BWBR0005836
      [ref5]: https://wetten.overheid.nl/BWBR0005836
    url: https://wetten.overheid.nl/BWBR0005836/2000-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005836
      - id: ref2
        bwb_id: BWBR0005836
      - id: ref3
        bwb_id: BWBR0005836
      - id: ref4
        bwb_id: BWBR0005836
      - id: ref5
        bwb_id: BWBR0005836
  - number: 3.1.c
    text: |-
      [bijlage A][ref1], [onder 4.2][ref2], [onderdeel ][ref3], en [bijlage B][ref4], [onder 1][ref5], indien het
      bevoegd gezag na een aantal metingen is gebleken dat aan de emissie-eisen is voldaan, mits in plaats van de in die
      voorschriften tussen de metingen aangegeven periodes, periodes van ten hoogste een jaar worden voorgeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0005836
      [ref2]: https://wetten.overheid.nl/BWBR0005836
      [ref3]: https://wetten.overheid.nl/BWBR0005836
      [ref4]: https://wetten.overheid.nl/BWBR0005836
      [ref5]: https://wetten.overheid.nl/BWBR0005836
    url: https://wetten.overheid.nl/BWBR0005836/2000-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005836
      - id: ref2
        bwb_id: BWBR0005836
      - id: ref3
        bwb_id: BWBR0005836
      - id: ref4
        bwb_id: BWBR0005836
      - id: ref5
        bwb_id: BWBR0005836
  - number: '3.2'
    text: |-
      Het bevoegd gezag kan bij het verlenen of het wijzigen van de vergunning voor de inrichtingen, bedoeld in
      [artikel 2, onder ][ref1], tot een maximum van 0,4 ng I-TEQ/m3 afwijken van het voorschrift, opgenomen in
      de bij dit besluit behorende [bijlage A][ref2], [onder 3][ref3], [onderdeel ][ref4], en [bijlage B][ref5],
      [onder 1][ref6], voor zover naar zijn oordeel de inrichting, gezien de stand der techniek, niet of alleen tegen
      extreem hoge kosten zodanig kan worden aangepast of verbouwd dat aan dat voorschrift kan worden voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005836#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005836
      [ref3]: https://wetten.overheid.nl/BWBR0005836
      [ref4]: https://wetten.overheid.nl/BWBR0005836
      [ref5]: https://wetten.overheid.nl/BWBR0005836
      [ref6]: https://wetten.overheid.nl/BWBR0005836
    url: https://wetten.overheid.nl/BWBR0005836/2000-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005836
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0005836
      - id: ref3
        bwb_id: BWBR0005836
      - id: ref4
        bwb_id: BWBR0005836
      - id: ref5
        bwb_id: BWBR0005836
      - id: ref6
        bwb_id: BWBR0005836
  - number: '4'
    text: |-
      Een beschikking waarin nadere eisen worden gesteld, wordt gezonden aan degene die de inrichting drijft, en aan
      de inspecteur.
    url: https://wetten.overheid.nl/BWBR0005836/2000-07-01#Artikel4
  - number: '5'
    text: |-
      Onze Minister stelt nadere regels over de wijze waarop en de omstandigheden waaronder degene die de inrichting
      drijft, de metingen, bedoeld in de bij dit besluit behorende bijlagen, dient te verrichten. Tevens stelt hij nadere
      regels over de wijze waarop de resultaten van die metingen dienen te worden geregistreerd.
    url: https://wetten.overheid.nl/BWBR0005836/2000-07-01#Artikel5
  - number: '6'
    text: |-
      Het bevoegd gezag stelt de inspecteur jaarlijks op de hoogte van de resultaten van de ingevolge de bij dit besluit
      behorende bijlagen te verrichten metingen.
    url: https://wetten.overheid.nl/BWBR0005836/2000-07-01#Artikel6
  - number: '7.1'
    text: 'Dit besluit treedt in werking:'
    url: https://wetten.overheid.nl/BWBR0005836/2000-07-01#Artikel7
  - number: 7.1.a
    text: |-
      ten aanzien van de inrichtingen, bedoeld in [artikel 2, onder ][ref1]: met ingang van een maand na de datum van
      uitgifte van het *Staatsblad* waarin het wordt geplaatst;


      [ref1]: https://wetten.overheid.nl/BWBR0005836#Artikel2
    url: https://wetten.overheid.nl/BWBR0005836/2000-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005836
        artikel: '2'
  - number: 7.1.b
    text: |-
      ten aanzien van de inrichtingen, bedoeld in [artikel 2, onder ][ref1]: met ingang van 1 januari 1995.


      [ref1]: https://wetten.overheid.nl/BWBR0005836#Artikel2
    url: https://wetten.overheid.nl/BWBR0005836/2000-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005836
        artikel: '2'
  - number: '7.2'
    text: |-
      In afwijking van het eerste lid, onder *a* en *b*, treden de voorschriften in de bij dit besluit behorende
      [bijlage A][ref1], [onder 3][ref2], [onderdeel ][ref3], en [bijlage B][ref4], [onder 2][ref5], [onderdeel ][ref6],
      in werking op een bij koninklijk besluit te bepalen tijdstip dat voor die onderdelen verschillend kan worden
      gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005836
      [ref2]: https://wetten.overheid.nl/BWBR0005836
      [ref3]: https://wetten.overheid.nl/BWBR0005836
      [ref4]: https://wetten.overheid.nl/BWBR0005836
      [ref5]: https://wetten.overheid.nl/BWBR0005836
      [ref6]: https://wetten.overheid.nl/BWBR0005836
    url: https://wetten.overheid.nl/BWBR0005836/2000-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005836
      - id: ref2
        bwb_id: BWBR0005836
      - id: ref3
        bwb_id: BWBR0005836
      - id: ref4
        bwb_id: BWBR0005836
      - id: ref5
        bwb_id: BWBR0005836
      - id: ref6
        bwb_id: BWBR0005836
  - number: '8'
    text: 'Dit besluit kan worden aangehaald als: Besluit luchtemissies afvalverbranding.'
    url: https://wetten.overheid.nl/BWBR0005836/2000-07-01#Artikel8
