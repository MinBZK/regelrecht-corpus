        artikel: '8.1'
  - number: '2'
    text: |-
      Degene die een inrichting drijft:

      a. voor het oprichten en in werking hebben waarvan een vergunning geldt krachtens
      [artikel 8.1 van de Wet milieubeheer][ref1], die op of na 1 april 1990 is verleend, dient met betrekking tot die
      verbranding te voldoen aan de voorschriften die zijn opgenomen in de bij dit besluit behorende [bijlage A][ref2],
      alsmede aan de krachtens deze voorschriften door het bevoegd gezag gestelde nadere eisen;

      b. voor het oprichten en in werking hebben waarvan een vergunning geldt krachtens
      [artikel 8.1 van de Wet milieubeheer][ref3], die voor 1 april 1990 is verleend, dient met betrekking tot die
      verbranding te voldoen aan de voorschriften die zijn opgenomen in de bij dit besluit behorende [bijlage B][ref4],
      alsmede aan de krachtens deze voorschriften door het bevoegd gezag gestelde nadere eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8.1
      [ref2]: https://wetten.overheid.nl/BWBR0005836
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel8.1
      [ref4]: https://wetten.overheid.nl/BWBR0005836
    url: https://wetten.overheid.nl/BWBR0005836/2000-07-01#Artikel2
