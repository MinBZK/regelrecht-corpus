  - number: '3'
    text: |-
      1 Het bevoegd gezag kan bij het verlenen of het wijzigen van de vergunning voor de inrichtingen, bedoeld in
      [artikel 2][ref1], afwijken van de voorschriften, opgenomen in de bij dit besluit behorende:

      a. [bijlage A][ref2], [onder 1][ref3], [onderdeel ][ref4], en [bijlage B][ref5], [onder 2][ref6],
      [onderdeel ][ref7], voor zover daardoor per component geen hogere waarden voor de uitworp met de rookgassen worden
      bereikt dan overeenkomstig deze bijlagen is toegestaan;

      b. [bijlage A][ref8], [onder 3][ref9], [onderdeel ][ref10], en [bijlage B][ref11], [onder 1][ref12], indien degene
      die de inrichting drijft, aan het bevoegd gezag aantoont dat de hiertoe behorende installatie voor de reiniging van
      rookgassen ten minste negentig procent van het in de rookgassen aanwezige kwik verwijdert en emissie naar de lucht
      van kwik de grenswaarde 0,1 mg/m3 niet overschrijdt;

      c. [bijlage A][ref13], [onder 4.2][ref14], [onderdeel ][ref15], en [bijlage B][ref16], [onder 1][ref17], indien het
      bevoegd gezag na een aantal metingen is gebleken dat aan de emissie-eisen is voldaan, mits in plaats van de in die
      voorschriften tussen de metingen aangegeven periodes, periodes van ten hoogste een jaar worden voorgeschreven.

      2 Het bevoegd gezag kan bij het verlenen of het wijzigen van de vergunning voor de inrichtingen, bedoeld in
      [artikel 2, onder ][ref18], tot een maximum van 0,4 ng I-TEQ/m3 afwijken van het voorschrift, opgenomen in de
      bij dit besluit behorende [bijlage A][ref19], [onder 3][ref20], [onderdeel ][ref21], en [bijlage B][ref22],
      [onder 1][ref23], voor zover naar zijn oordeel de inrichting, gezien de stand der techniek, niet of alleen tegen
      extreem hoge kosten zodanig kan worden aangepast of verbouwd dat aan dat voorschrift kan worden voldaan.


