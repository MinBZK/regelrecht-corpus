---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: instellingsbesluit_productschap_tuinbouw
regulatory_layer: AMVB
publication_date: '2014-12-24'
valid_from: '2003-12-31'
bwb_id: BWBR0016235
url: https://wetten.overheid.nl/BWBR0016235/2003-12-31
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op voordracht van Onze Minister van Sociale Zaken en Werkgelegenheid van 20 november 2003, Directie
    Arbeidsverhoudingen, nr. AV/CAM/2003/88544, gedaan mede namens Onze Minister van Economische Zaken en Onze Minister
    van Landbouw, Natuur en Voedselkwaliteit;

    Gelet op artikel 67, 70, 70A, 73, 76, eerste lid, 88a, 102, tweede lid, en 126, derde lid, van de Wet op de
    bedrijfsorganisatie;

    De Raad van State gehoord (advies van 12 december 2003, nr. W12030485/IV);

    Gezien het nader rapport van Onze Minister van Sociale Zaken en Werkgelegenheid van 17 december 2003, Directie
    Arbeidsverhoudingen, nr. AV/CAM/2003/95713, gedaan mede namens Onze Minister van Economische Zaken en Onze Minister
    van Landbouw, Natuur en Voedselkwaliteit;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0016235/2003-12-31#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0016235/2003-12-31#Artikel1
  - number: 1.a
    text: |-
      de wet: de [Wet op de bedrijfsorganisatie][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002058
    url: https://wetten.overheid.nl/BWBR0016235/2003-12-31#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002058
  - number: 1.b
    text: 'de raad: de Sociaal-Economische Raad;'
    url: https://wetten.overheid.nl/BWBR0016235/2003-12-31#Artikel1
  - number: 1.c
    text: 'het productschap: het Productschap Tuinbouw;'
    url: https://wetten.overheid.nl/BWBR0016235/2003-12-31#Artikel1
  - number: 1.d
    text: |-
      sectorcommissie: orgaan als bedoeld in [artikel 88a van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel88a
    url: https://wetten.overheid.nl/BWBR0016235/2003-12-31#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002058
        artikel: 88a
  - number: '2.1'
    text: In dit besluit wordt onder handel mede de werkzaamheid van tussenpersonen verstaan.
    url: https://wetten.overheid.nl/BWBR0016235/2003-12-31#Artikel2
  - number: '2.2'
    text: In dit besluit wordt onder handel niet de doorvoer- en driehoekshandel verstaan.
    url: https://wetten.overheid.nl/BWBR0016235/2003-12-31#Artikel2
  - number: '3.1'
    text: Er is een Productschap Tuinbouw.
    url: https://wetten.overheid.nl/BWBR0016235/2003-12-31#Artikel3
  - number: '3.2'
    text: 'Het productschap is ingesteld voor de ondernemingen waarin:'
    url: https://wetten.overheid.nl/BWBR0016235/2003-12-31#Artikel3
  - number: 3.2.a
    text: de teelt van fruit, groenten of siergewassen wordt uitgeoefend;
    url: https://wetten.overheid.nl/BWBR0016235/2003-12-31#Artikel3
  - number: 3.2.b
    text: |-
      fruit, groenten of daaruit verkregen producten, met uitzondering van slaggrondnoten en kopra, worden be- of
      verwerkt;
    url: https://wetten.overheid.nl/BWBR0016235/2003-12-31#Artikel3
  - number: 3.2.c
    text: 'de handel wordt uitgeoefend in:'
    url: https://wetten.overheid.nl/BWBR0016235/2003-12-31#Artikel3
  - number: 3.2.c.1º
    text: fruit, met uitzondering van slaggrondnoten en kopra;
    url: https://wetten.overheid.nl/BWBR0016235/2003-12-31#Artikel3
  - number: 3.2.c.2º
    text: groenten, met uitzondering van zaden van groenten;
    url: https://wetten.overheid.nl/BWBR0016235/2003-12-31#Artikel3
  - number: 3.2.c.3º
    text: |-
      siergewassen of delen daarvan, met uitzondering van voortkwekingsmateriaal van bloemgewassen en van zaden van
      bloemgewassen, bloemkwekerijproducten en boomkwekerijproducten;
    url: https://wetten.overheid.nl/BWBR0016235/2003-12-31#Artikel3
  - number: 3.2.d
    text: hovenierswerkzaamheden worden verricht.
    url: https://wetten.overheid.nl/BWBR0016235/2003-12-31#Artikel3
  - number: '3.3'
    text: Het productschap is mede ingesteld voor veilingen van de in het tweede lid bedoelde producten.
    url: https://wetten.overheid.nl/BWBR0016235/2003-12-31#Artikel3
  - number: '3.4'
    text: 'In dit artikel wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0016235/2003-12-31#Artikel3
  - number: 3.4.a
    text: 'fruit: vers fruit, bewerkt en verwerkt fruit;'
    url: https://wetten.overheid.nl/BWBR0016235/2003-12-31#Artikel3
  - number: 3.4.b
    text: |-
      groenten: verse groenten, bewerkte en verwerkte groenten, alsmede verse, bewerkte of verwerkte uien, eetbare
      zwammen, specerijen, specerijgewassen, consumptiespecerijzaden, zaden van groenten, plantgoed van groenten en
      aardbeien met uitzondering van plantsjalotten en plantuitjes, groen geoogste landbouwpeulvruchten, noten, kruiden;
    url: https://wetten.overheid.nl/BWBR0016235/2003-12-31#Artikel3
  - number: 3.4.c
    text: |-
      siergewassen: bollen, knollen en wortelstokken van bloemgewassen, daaronder begrepen voortkwekingsmateriaal
      en zaden; bloemkwekerijproducten, daaronder begrepen voortkwekingsmateriaal en zaden; boomkwekerijproducten,
      daaronder begrepen voortkwekingsmateriaal en zaden; vruchtbomen – met inbegrip van kleinfruitteeltgewassen –,
      vruchtboomonderstammen, plantgoed van aardbeien, bos- en hoogplantsoen, rozenonderstammen, kerstbomen en in het
      wild gegroeide producten, welke met het oog op de sierwaarde in het economisch verkeer worden ingebracht.
    url: https://wetten.overheid.nl/BWBR0016235/2003-12-31#Artikel3
  - number: '3.5'
    text: Het productschap is gevestigd te Zoetermeer.
    url: https://wetten.overheid.nl/BWBR0016235/2003-12-31#Artikel3
  - number: '4'
    text: 'Het bestuur van het productschap bestaat uit 24 leden. Hiervan worden benoemd:'
    url: https://wetten.overheid.nl/BWBR0016235/2003-12-31#Artikel4
  - number: 4.a
    text: 'voor ondernemingen op het gebied van het voortkwekingsmateriaal: een lid door organisaties van ondernemers;'
    url: https://wetten.overheid.nl/BWBR0016235/2003-12-31#Artikel4
  - number: 4.b
    text: 'voor ondernemingen op het gebied van de teelt: zes leden door organisaties van ondernemers;'
    url: https://wetten.overheid.nl/BWBR0016235/2003-12-31#Artikel4
  - number: 4.c
    text: 'voor ondernemingen op het gebied van het veilingwezen: twee leden door organisaties van ondernemers;'
    url: https://wetten.overheid.nl/BWBR0016235/2003-12-31#Artikel4
  - number: 4.d
    text: 'voor ondernemingen op het gebied van de industrie: een lid door organisaties van ondernemers;'
    url: https://wetten.overheid.nl/BWBR0016235/2003-12-31#Artikel4
  - number: 4.e
    text: 'voor ondernemingen op het gebied van de handel: vijf leden door organisaties van ondernemers;'
    url: https://wetten.overheid.nl/BWBR0016235/2003-12-31#Artikel4
  - number: 4.f
    text: 'voor ondernemingen op het gebied van het hoveniersbedrijf: een lid door organisaties van ondernemers; en'
    url: https://wetten.overheid.nl/BWBR0016235/2003-12-31#Artikel4
  - number: 4.g
    text: 'voor alle in dit artikel bedoelde ondernemingen: acht leden door organisaties van werknemers.'
    url: https://wetten.overheid.nl/BWBR0016235/2003-12-31#Artikel4
  - number: '5.1'
    text: 'Het productschap heeft commissies voor aangelegenheden betreffende:'
    url: https://wetten.overheid.nl/BWBR0016235/2003-12-31#Artikel5
  - number: 5.1.a
    text: bollen, knollen en wortelstokken van bloemgewassen;
    url: https://wetten.overheid.nl/BWBR0016235/2003-12-31#Artikel5
  - number: 5.1.b
    text: bloemkwekerijproducten;
    url: https://wetten.overheid.nl/BWBR0016235/2003-12-31#Artikel5
  - number: 5.1.c
    text: boomkwekerijproducten;
    url: https://wetten.overheid.nl/BWBR0016235/2003-12-31#Artikel5
  - number: 5.1.d
    text: groenten en fruit;
    url: https://wetten.overheid.nl/BWBR0016235/2003-12-31#Artikel5
  - number: 5.1.e
    text: hovenierswerkzaamheden;
    url: https://wetten.overheid.nl/BWBR0016235/2003-12-31#Artikel5
  - number: 5.1.f
    text: energie.
    url: https://wetten.overheid.nl/BWBR0016235/2003-12-31#Artikel5
  - number: '5.2'
    text: |-
      De leden van de commissies worden benoemd door door de raad aan te wijzen organisaties van ondernemers en van
      werknemers. Voor aanwijzing komen slechts in aanmerking naar het oordeel van de raad representatieve organisaties
      van ondernemers en van werknemers.
    url: https://wetten.overheid.nl/BWBR0016235/2003-12-31#Artikel5
  - number: '5.3'
    text: |-
      De organisaties van ondernemers en van werknemers die leden benoemen voor de in
      [artikel 6 tot en met artikel 11][ref1] genoemde commissies, zijn bevoegd voor elk lid dat zij benoemen tevens een
      plaatsvervanger aan te wijzen.


      [ref1]: https://wetten.overheid.nl/BWBR0016235#Artikel6
    url: https://wetten.overheid.nl/BWBR0016235/2003-12-31#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0016235
        artikel: '6'
        paragraaf: '2'
  - number: '5.4'
    text: |-
      De zittingsperiode van de leden van de commissies valt samen met die van de leden van het bestuur van het
      productschap.
    url: https://wetten.overheid.nl/BWBR0016235/2003-12-31#Artikel5
  - number: '5.5'
    text: De voorzitter van het productschap is tevens voorzitter van de commissies.
    url: https://wetten.overheid.nl/BWBR0016235/2003-12-31#Artikel5
  - number: '5.6'
    text: |-
      De commissies dienen elk voor haar werkgebied het bestuur van advies, voeren de door het bestuur aan hen
      gedelegeerde taken uit en kunnen elk voor haar werkgebied voorstellen doen voor door het bestuur vast te stellen
      verordeningen.
    url: https://wetten.overheid.nl/BWBR0016235/2003-12-31#Artikel5
  - number: '6'
    text: |-
      De Commissie voor bollen, knollen en wortelstokken van bloemgewassen bestaat uit achttien leden. Hiervan worden
      benoemd:
    url: https://wetten.overheid.nl/BWBR0016235/2003-12-31#Artikel6
  - number: 6.a
    text: 'voor ondernemingen op het gebied van het uitgangsmateriaal: een lid door organisaties van ondernemers;'
    url: https://wetten.overheid.nl/BWBR0016235/2003-12-31#Artikel6
  - number: 6.b
    text: |-
      voor ondernemingen op het gebied van de bloementeelt en het veilingwezen van bloembollen: zes leden door
      organisaties van ondernemers en drie leden door organisaties van werknemers;
    url: https://wetten.overheid.nl/BWBR0016235/2003-12-31#Artikel6
  - number: '7'
    text: 'De Commissie voor bloemkwekerijproducten bestaat uit achttien leden. Hiervan worden benoemd:'
    url: https://wetten.overheid.nl/BWBR0016235/2003-12-31#Artikel7
  - number: 7.a
    text: |-
      voor ondernemingen op het gebied van de bloemkwekerij: zeven leden door organisaties van ondernemers en drie leden
      door organisaties van werknemers;
    url: https://wetten.overheid.nl/BWBR0016235/2003-12-31#Artikel7
  - number: 7.b
    text: |-
      voor ondernemingen op het gebied van de groothandel in bloemkwekerijproducten: twee leden door organisaties van
      ondernemers;
    url: https://wetten.overheid.nl/BWBR0016235/2003-12-31#Artikel7
  - number: 7.c
    text: |-
      voor ondernemingen op het gebied van de detailhandel in bloemkwekerijproducten: drie leden door organisaties van
      ondernemers;
    url: https://wetten.overheid.nl/BWBR0016235/2003-12-31#Artikel7
  - number: '8'
    text: 'De Commissie voor boomkwekerijproducten bestaat uit zeventien leden. Hiervan worden benoemd:'
    url: https://wetten.overheid.nl/BWBR0016235/2003-12-31#Artikel8
  - number: 8.a
    text: |-
      voor ondernemingen op het gebied van de boomkwekerij: vijf leden door organisaties van ondernemers en drie leden
      door organisaties van werknemers;
    url: https://wetten.overheid.nl/BWBR0016235/2003-12-31#Artikel8
  - number: 8.b
    text: 'voor ondernemingen op het gebied van het tuincentrabedrijf: een lid door organisaties van ondernemers;'
    url: https://wetten.overheid.nl/BWBR0016235/2003-12-31#Artikel8
  - number: 8.c
    text: |-
      voor ondernemingen op het gebied van de handel in boomkwekerijproducten: vijf leden door organisaties van
      ondernemers;
    url: https://wetten.overheid.nl/BWBR0016235/2003-12-31#Artikel8
  - number: 8.d
    text: 'voor de ondernemingen bedoeld onder b. en c. in dit artikel: drie leden door organisaties van werknemers.'
    url: https://wetten.overheid.nl/BWBR0016235/2003-12-31#Artikel8
  - number: '9'
    text: 'De Commissie voor groenten en fruit bestaat uit 23 leden. Hiervan worden benoemd:'
    url: https://wetten.overheid.nl/BWBR0016235/2003-12-31#Artikel9
  - number: 9.a
    text: |-
      voor ondernemingen op het gebied van de teelt van groenten en fruit: zeven leden door organisaties van ondernemers
      en zes leden door organisaties van werknemers;
    url: https://wetten.overheid.nl/BWBR0016235/2003-12-31#Artikel9
  - number: 9.b
    text: |-
      voor ondernemingen op het gebied van de groenten- en fruitbe- en verwerkende industrie: een lid door organisaties
      van ondernemers en een lid door organisaties van werknemers;
    url: https://wetten.overheid.nl/BWBR0016235/2003-12-31#Artikel9
  - number: 9.c
    text: |-
      voor ondernemingen op het gebied van de groothandel en de werkzaamheid van tussenpersonen in groenten en fruit:
      twee leden door organisaties van ondernemers en twee leden door organisaties van werknemers;
    url: https://wetten.overheid.nl/BWBR0016235/2003-12-31#Artikel9
  - number: 9.d
    text: |-
      voor ondernemingen op het gebied van de detailhandel in groenten en fruit: twee leden door organisaties van
      ondernemers en twee leden door organisaties van werknemers.
    url: https://wetten.overheid.nl/BWBR0016235/2003-12-31#Artikel9
  - number: '10'
    text: |-
      De Commissie voor hovenierswerkzaamheden bestaat uit acht leden. Daarvan worden vijf leden door organisaties van
      ondernemers en drie leden door organisaties van werknemers benoemd.
    url: https://wetten.overheid.nl/BWBR0016235/2003-12-31#Artikel10
  - number: '11'
    text: |-
      De Commissie voor energie bestaat uit zeven leden. Daarvan worden vijf leden door organisaties van ondernemers en
      twee leden door organisaties van werknemers benoemd.
    url: https://wetten.overheid.nl/BWBR0016235/2003-12-31#Artikel11
  - number: '12'
    text: |-
      Het productschap is bevoegd tot de regeling of nadere regeling van de in [artikel 93, tweede lid, van de wet][ref1]
      vermelde onderwerpen of onderdelen daarvan met uitzondering van de onderdelen:


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel93
    url: https://wetten.overheid.nl/BWBR0016235/2003-12-31#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002058
        artikel: '93'
  - number: 12.c
    text: bevordering van professionele bedrijfsvoering;
    url: https://wetten.overheid.nl/BWBR0016235/2003-12-31#Artikel12
  - number: 12.d
    text: de lonen en andere arbeidsvoorwaarden;
    url: https://wetten.overheid.nl/BWBR0016235/2003-12-31#Artikel12
  - number: 12.e
    text: onderzoek op sociaal, economisch en technisch terrein;
    url: https://wetten.overheid.nl/BWBR0016235/2003-12-31#Artikel12
  - number: 12.f
    text: arbeidsmarktvoorzieningen.
    url: https://wetten.overheid.nl/BWBR0016235/2003-12-31#Artikel12
  - number: '13.1'
    text: |-
      Een verordening als bedoeld in [artikel 93][ref1], [artikel 119][ref2], [artikel 123][ref3] of
      [artikel 126 van de wet][ref4] die naar het oordeel van het bestuur ligt op het werkgebied van een sectorcommissie,
      stelt het bestuur vast na advies van die sectorcommissie.


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel93
      [ref2]: https://wetten.overheid.nl/BWBR0002058#Artikel119
      [ref3]: https://wetten.overheid.nl/BWBR0002058#Artikel123
      [ref4]: https://wetten.overheid.nl/BWBR0002058#Artikel126
    url: https://wetten.overheid.nl/BWBR0016235/2003-12-31#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002058
        artikel: '93'
      - id: ref2
        bwb_id: BWBR0002058
        artikel: '119'
      - id: ref3
        bwb_id: BWBR0002058
        artikel: '123'
      - id: ref4
        bwb_id: BWBR0002058
        artikel: '126'
  - number: '13.2'
    text: |-
      Een besluit met betrekking tot andere aangelegenheden dat naar het oordeel van het bestuur ligt op het werkgebied
      van een sectorcommissie, stelt het bestuur vast na advies van die commissie.
    url: https://wetten.overheid.nl/BWBR0016235/2003-12-31#Artikel13
  - number: '14.1'
    text: |-
      Het productschap legt een heffing als bedoeld in [artikel 126, eerste lid van de wet][ref1] op gebaseerd op een
      grondslag welke het bestuur passend acht, met dien verstande dat het tarief voor bepaalde in de heffingsverordening
      aangewezen ondernemingen of groepen van ondernemingen verschillend kunnen zijn. Boven of in de plaats van zodanige
      heffing kan een bedrag worden geheven dat voor alle ondernemingen of groepen daarvan gelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel126
    url: https://wetten.overheid.nl/BWBR0016235/2003-12-31#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002058
        artikel: '126'
  - number: '14.2'
    text: |-
      Heffingen waarvan de opbrengst een bijzondere bestemming heeft, kunnen worden opgelegd naar een grondslag welke het
      bestuur van het productschap in verband met die bestemming passend acht.
    url: https://wetten.overheid.nl/BWBR0016235/2003-12-31#Artikel14
  - number: '15.1'
    text: Het bij verordening van de raad van 17 april 1998 ingestelde Productschap Tuinbouw wordt opgeheven.
    url: https://wetten.overheid.nl/BWBR0016235/2003-12-31#Artikel15
  - number: '15.2'
    text: |-
      Verordeningen en andere besluiten die zijn vastgesteld door het bij verordening van de raad van 17 april 1998
      ingestelde Productschap Tuinbouw blijven van kracht tot de datum waarop de door het op grond van dit besluit
      ingestelde Productschap Tuinbouw vastgestelde verordeningen en andere besluiten terzake in werking zullen treden.
    url: https://wetten.overheid.nl/BWBR0016235/2003-12-31#Artikel15
  - number: '15.3'
    text: |-
      Het personeel, de rechten, de verplichtingen, de vermogensbestanddelen en de archiefbescheiden van het bij
      verordening van de raad van 17 april 1998 ingestelde Productschap Tuinbouw, gaan over naar het op grond van dit
      besluit ingestelde Productschap Tuinbouw.
    url: https://wetten.overheid.nl/BWBR0016235/2003-12-31#Artikel15
  - number: '15.4'
    text: |-
      Wettelijke procedures en rechtsgedingen, ingesteld door of tegen het bij verordening van de raad van 17 april
      1998 ingestelde Productschap Tuinbouw worden geacht te zijn ingesteld door of tegen het op grond van dit besluit
      ingestelde Productschap Tuinbouw.
    url: https://wetten.overheid.nl/BWBR0016235/2003-12-31#Artikel15
  - number: '16'
    text: |-
      De bestuursleden en hun plaatsvervangers van wie de zittingsperiode ingaat op de datum van inwerkingtreding van dit
      besluit, treden af op 1 januari 2006.
    url: https://wetten.overheid.nl/BWBR0016235/2003-12-31#Artikel16
  - number: '17'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin het wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0016235/2003-12-31#Artikel17
  - number: '18'
    text: 'Dit besluit wordt aangehaald als: Instellingsbesluit Productschap Tuinbouw.'
    url: https://wetten.overheid.nl/BWBR0016235/2003-12-31#Artikel18
