preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Verkeer en Waterstaat van 4 juli 2003, nr. HDJZ/AWW/2003-1433, Hoofddirectie
    Juridische Zaken;

    Gelet op richtlijn nr. 2001/85/EG van het Europees Parlement en de Raad van 20 november 2001 betreffende speciale
    voorschriften voor voertuigen bestemd voor het vervoer van passagiers, met meer dan acht zitplaatsen, die van de
    bestuurder niet meegerekend, en tot wijziging van Richtlijn 70/156/EEG van de Raad en van richtlijn 97/27/EG (PbEG
    L42), en de artikelen 21, 22 en 71 van de Wegenverkeerswet 1994;

    De Raad van State gehoord, advies van 3 september 2003, nr. W09.03 0293/V;

    Gezien het nader rapport van Onze Minister van Verkeer en Waterstaat van 5 november 2003, nr. HDJZ/AWW/2003–2427,
    Hoofddirectie Juridische Zaken;

    Hebben goedgevonden en verstaan:
