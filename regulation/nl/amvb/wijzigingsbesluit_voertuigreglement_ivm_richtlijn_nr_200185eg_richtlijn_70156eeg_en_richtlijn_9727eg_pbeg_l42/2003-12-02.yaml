    text: |-
      Op verzoek van de fabrikant wordt tot 13 februari 2004 voor bussen en carrosserieën voor bussen die voldoen aan
      de bij [artikel I][ref1] aan bussen en carrosserieën voor bussen gestelde eisen een typegoedkeuring als bedoeld in
      [artikel 22, eerste lid, van de Wegenverkeerswet 1994][ref2] verleend.


