---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_energierendementseisen_voorschakelapparaten_voor_fluorescentielampen
regulatory_layer: AMVB
publication_date: '2010-01-19'
valid_from: '2002-05-21'
bwb_id: BWBR0012851
url: https://wetten.overheid.nl/BWBR0012851/2002-05-21
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Economische Zaken van 10 juli 2001, nr. WJZ 01035778;

    Gelet op richtlijn nr. 2000/55/EG van het Europees Parlement en de Raad van de Europese Unie van 18 september 2000
    inzake de energierendementseisen voor voorschakelapparaten voor fluorescentielampen (PbEG L 279) en deartikelen 2,
    6 en 21 van de Wet energiebesparing toestellen;

    De Raad van State gehoord (advies van 31 augustus 2001, nr. W10.01.0316/II);

    Gezien het nader rapport van Onze Minister van Economische Zaken van 20 september 2001, nr. WJZ 01046682;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0012851/2002-05-21#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0012851/2002-05-21#Artikel1
  - number: 1.a
    text: |-
      richtlijn: [richtlijn nr. 2000/55/EG](32000L0055) van het Europees Parlement en de Raad van de Europese Unie van 18
      september 2000 inzake de energierendementseisen voor voorschakelapparaten voor fluorescentielampen (PbEG L 279);
    url: https://wetten.overheid.nl/BWBR0012851/2002-05-21#Artikel1
  - number: 1.b
    text: |-
      besluit 93/465/EEG: besluit nr. 93/465/EEG van de Raad van de Europese Gemeenschappen van 22 juli 1993 betreffende
      de modules voor de verschillende fasen van de overeenstemmingsbeoordelingsprocedures en de voorschriften inzake het
      aanbrengen en het gebruik van de CE-markering van overeenstemming (PbEG L 220);
    url: https://wetten.overheid.nl/BWBR0012851/2002-05-21#Artikel1
  - number: 1.c
    text: |-
      voorschakelapparaten: voor aansluiting op het elektriciteitsnet bestemde voorschakelapparaten voor
      fluorescentielampen als omschreven in de geharmoniseerde norm EN 50294 van december 1998, punt 3.4;
    url: https://wetten.overheid.nl/BWBR0012851/2002-05-21#Artikel1
  - number: 1.d
    text: 'EER-gebieden: de gebieden waarop de Overeenkomst betreffende de Europese Economische Ruimte van toepassing is;'
    url: https://wetten.overheid.nl/BWBR0012851/2002-05-21#Artikel1
  - number: 1.e
    text: 'CE-markering: de markering, bedoeld in besluit 93/465/EEG;'
    url: https://wetten.overheid.nl/BWBR0012851/2002-05-21#Artikel1
  - number: 1.f
    text: 'Onze Minister: Onze Minister van Economische Zaken.'
    url: https://wetten.overheid.nl/BWBR0012851/2002-05-21#Artikel1
  - number: '2.1'
    text: |-
      Dit besluit is van toepassing op voorschakelapparaten die als afzonderlijk onderdeel in de EER-gebieden in de
      handel worden gebracht en op voorschakelapparaten die ingebouwd in verlichtingsapparatuur in de EER-gebieden in de
      handel worden gebracht.
    url: https://wetten.overheid.nl/BWBR0012851/2002-05-21#Artikel2
  - number: '2.2'
    text: 'In afwijking van het eerste lid is dit besluit niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0012851/2002-05-21#Artikel2
  - number: 2.2.a
    text: in lampen geïntegreerde voorschakelapparaten;
    url: https://wetten.overheid.nl/BWBR0012851/2002-05-21#Artikel2
  - number: 2.2.b
    text: |-
      voorschakelapparaten die speciaal bestemd zijn voor verlichtingsapparatuur die in meubels wordt aangebracht en die
      daarvan een onvervangbaar onderdeel uitmaken dat niet apart van de verlichtingsapparatuur getest kan worden;
    url: https://wetten.overheid.nl/BWBR0012851/2002-05-21#Artikel2
  - number: 2.2.c
    text: voor uitvoer uit de EER-gebieden bestemde voorschakelapparaten.
    url: https://wetten.overheid.nl/BWBR0012851/2002-05-21#Artikel2
  - number: '3.1'
    text: |-
      Het is de fabrikant van voorschakelapparaten, zijn gemachtigde, gevestigd in de EER-gebieden, en degene die de
      desbetreffende apparatuur in die gebieden in de handel brengt verboden:
    url: https://wetten.overheid.nl/BWBR0012851/2002-05-21#Artikel3
  - number: 3.1.a
    text: |-
      in de periode van 21 mei 2002 tot 21 november 2005 voorschakelapparaten in de handel te brengen die niet voldoen
      aan de in de bijlagen I, II en III bij de richtlijn gestelde eisen met betrekking tot het maximale ingangsvermogen
      van de schakeling tussen het voorschakelapparaat en de lamp;
    url: https://wetten.overheid.nl/BWBR0012851/2002-05-21#Artikel3
  - number: 3.1.b
    text: |-
      vanaf 21 november 2005 voorschakelapparaten in de handel te brengen die niet voldoen aan de in de bijlagen I, II
      en IV bij de richtlijn gestelde eisen met betrekking tot het maximale ingangsvermogen van de schakeling tussen het
      voorschakelapparaat en de lamp;
    url: https://wetten.overheid.nl/BWBR0012851/2002-05-21#Artikel3
  - number: 3.1.c
    text: |-
      voorschakelapparaten in de handel te brengen die niet zijn voorzien van een CE-markering die voldoet aan de in
      [artikel 4][ref1] gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0012851#Artikel4
    url: https://wetten.overheid.nl/BWBR0012851/2002-05-21#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0012851
        artikel: '4'
  - number: '3.2'
    text: |-
      Het is de fabrikant van voorschakelapparaten, zijn gemachtigde, gevestigd in de EER-gebieden, en degene die de
      desbetreffende apparatuur in die gebieden in de handel brengt verboden voorschakelapparaten in de handel te brengen
      waarop markeringen zijn aangebracht die derden kunnen misleiden omtrent de betekenis en de grafische vorm van de
      CE-markering.
    url: https://wetten.overheid.nl/BWBR0012851/2002-05-21#Artikel3
  - number: '4.1'
    text: |-
      De fabrikant van voorschakelapparaten en zijn gemachtigde, gevestigd in de EER-gebieden, voldoet aan de hem
      toebedeelde verplichtingen van module A, de criteria en de algemene richtsnoeren van de bijlage bij besluit 93/465/
      EEG, met dien verstande dat:
    url: https://wetten.overheid.nl/BWBR0012851/2002-05-21#Artikel4
  - number: 4.1.a
    text: de in punt 2 van module A bedoelde periode drie jaar is;
    url: https://wetten.overheid.nl/BWBR0012851/2002-05-21#Artikel4
  - number: 4.1.b
    text: |-
      de technische documentatie als bedoeld in het vierde lid die is samengesteld in overeenstemming met andere
      communautaire regelgeving, kan worden gebruikt, voor zover deze aan de eisen van dat lid voldoet.
    url: https://wetten.overheid.nl/BWBR0012851/2002-05-21#Artikel4
  - number: '4.2'
    text: |-
      Indien de fabrikant van voorschakelapparaten en zijn gemachtigde niet in de EER-gebieden gevestigd zijn, gelden de
      verplichtingen van punt 2 van module A van de bijlage bij besluit 93/465/EEG voor degene die voorschakelapparaten
      in de EER-gebieden in de handel brengt.
    url: https://wetten.overheid.nl/BWBR0012851/2002-05-21#Artikel4
  - number: '4.3'
    text: |-
      De fabrikant van voorschakelapparaten is verantwoordelijk voor de meting van het opgenomen vermogen, bedoeld in
      [artikel 3, eerste lid, onderdelen a en b][ref1], overeenkomstig de procedures van de geharmoniseerde norm EN 50294
      van december 1998 of de normen waarin deze in Nederland dan wel in een andere lidstaat van de Europese Unie of een
      andere staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte is omgezet en waarvan de
      referentienummers in de desbetreffende staat zijn bekendgemaakt, en voor de overeenstemming van de apparaten met de
      eisen van genoemde onderdelen van [artikel 3, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0012851#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0012851#Artikel3
    url: https://wetten.overheid.nl/BWBR0012851/2002-05-21#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0012851
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0012851
        artikel: '3'
  - number: '4.4'
    text: |-
      De technische documentatie, bedoeld in punt 3 van module A van de bijlage bij besluit 93/465/EEG, bevat de volgende
      gegevens:
    url: https://wetten.overheid.nl/BWBR0012851/2002-05-21#Artikel4
  - number: 4.4.a
    text: naam en adres van de fabrikant;
    url: https://wetten.overheid.nl/BWBR0012851/2002-05-21#Artikel4
  - number: 4.4.b
    text: een algemene beschrijving van het model die voldoende is om het op eenduidige wijze te identificeren;
    url: https://wetten.overheid.nl/BWBR0012851/2002-05-21#Artikel4
  - number: 4.4.c
    text: |-
      informatie, zo nodig met tekeningen, over de voornaamste ontwerpkenmerken van het model, met name in verband met
      aspecten die belangrijk zijn voor het elektriciteitsverbruik;
    url: https://wetten.overheid.nl/BWBR0012851/2002-05-21#Artikel4
  - number: 4.4.d
    text: de gebruiksaanwijzing;
    url: https://wetten.overheid.nl/BWBR0012851/2002-05-21#Artikel4
  - number: 4.4.e
    text: |-
      verslagen van de overeenkomstig de eisen van het derde lid uitgevoerde proeven ter bepaling van het opgenomen
      vermogen;
    url: https://wetten.overheid.nl/BWBR0012851/2002-05-21#Artikel4
  - number: 4.4.f
    text: |-
      gegevens over de overeenstemming van de resultaten van de in onderdeel e bedoelde proeven met de in bijlage I bij
      de richtlijn neergelegde eisen inzake energieverbruik.
    url: https://wetten.overheid.nl/BWBR0012851/2002-05-21#Artikel4
  - number: '4.5'
    text: |-
      Zodra aan de op grond van dit artikel op de fabrikant van voorschakelapparaten of zijn gemachtigde, gevestigd in de
      EER-gebieden, rustende verplichting is voldaan door een van hen, is de verplichting van de ander opgeheven.
    url: https://wetten.overheid.nl/BWBR0012851/2002-05-21#Artikel4
  - number: '5.1'
    text: |-
      De fabrikant van voorschakelapparaten of zijn gemachtigde, gevestigd in de EER-gebieden, brengt de CE-markering
      zichtbaar, leesbaar en onuitwisbaar aan:
    url: https://wetten.overheid.nl/BWBR0012851/2002-05-21#Artikel5
  - number: 5.1.a
    text: |-
      op de voorschakelapparaten en op de verpakking daarvan, indien de voorschakelapparaten als afzonderlijk onderdeel
      in de handel worden gebracht;
    url: https://wetten.overheid.nl/BWBR0012851/2002-05-21#Artikel5
  - number: 5.1.b
    text: |-
      op de verlichtingsapparatuur en op de verpakking daarvan, indien de voorschakelapparaten ingebouwd in
      verlichtingsapparatuur in de handel worden gebracht.
    url: https://wetten.overheid.nl/BWBR0012851/2002-05-21#Artikel5
  - number: '5.2'
    text: |-
      Zodra aan de op grond van dit artikel op de fabrikant van voorschakelapparaten of zijn gemachtigde, gevestigd in de
      EER-gebieden, rustende verplichting is voldaan door een van beiden, is de verplichting van de ander opgeheven.
    url: https://wetten.overheid.nl/BWBR0012851/2002-05-21#Artikel5
  - number: '6'
    text: |-
      Voorschakelapparaten die van een CE-markering zijn voorzien worden vermoed te voldoen aan de bij dit besluit
      gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0012851/2002-05-21#Artikel6
  - number: '7.1'
    text: |-
      Indien Onze Minister van oordeel is dat een CE-markering ten onrechte op een voorschakelapparaat is aangebracht,
      neemt hij de nodige maatregelen om dat apparaat uit de handel te nemen.
    url: https://wetten.overheid.nl/BWBR0012851/2002-05-21#Artikel7
  - number: '7.2'
    text: |-
      De fabrikant van voorschakelapparaten, zijn gemachtigde, gevestigd in de EER-gebieden, en degene die de
      desbetreffende apparatuur in die gebieden in de handel brengt verleent alle noodzakelijke medewerking aan
      maatregelen als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0012851/2002-05-21#Artikel7
  - number: '8.1'
    text: |-
      Voor zover in dit besluit wordt verwezen naar besluiten van organen van de Europese Gemeenschappen of een daarbij
      behorende bijlage treedt voor de toepassing van de desbetreffende bepaling een wijziging van het besluit van een
      orgaan van de Europese Gemeenschappen of van een daarbij behorende bijlage in werking met ingang van de dag waarop
      aan het betrokken wijzigingsbesluit uiterlijk uitvoering moet zijn gegeven.
    url: https://wetten.overheid.nl/BWBR0012851/2002-05-21#Artikel8
  - number: '8.2'
    text: Onze Minister doet mededeling van een wijziging als bedoeld in het eerste lid in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0012851/2002-05-21#Artikel8
  - number: '9'
    text: Dit besluit treedt in werking met ingang van 21 mei 2002.
    url: https://wetten.overheid.nl/BWBR0012851/2002-05-21#Artikel9
  - number: '10'
    text: 'Dit besluit wordt aangehaald als: Besluit energierendementseisen voorschakelapparaten voor fluorescentielampen.'
    url: https://wetten.overheid.nl/BWBR0012851/2002-05-21#Artikel10
