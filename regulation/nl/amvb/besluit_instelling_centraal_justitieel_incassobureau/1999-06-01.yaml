articles:
  - number: '1'
    text: |-
      Er is een Centraal Justitieel Incassobureau, gevestigd te Leeuwarden, waarvan de algemene leiding, de organisatie
      en het beheer berusten bij Onze Minister van Justitie.
    url: https://wetten.overheid.nl/BWBR0006713/1999-06-01#Artikel1
  - number: '2'
    text: |-
      1 Het Centraal Justitieel Incassobureau is belast met de taken die hem bij algemene maatregel van bestuur zijn
      opgedragen.

      2 Het Centraal Justitieel Incassobureau verricht de werkzaamheden die uit de taken, als bedoeld in het eerste lid,
      voortvloeien en die Onze Minister van Justitie of het openbaar ministerie van hem verlangen.
    url: https://wetten.overheid.nl/BWBR0006713/1999-06-01#Artikel2
  - number: '3'
    text: |-
      1 Er is een Raad van Toezicht voor het Centraal Justitieel Incassobureau, hierna te noemen: de raad.

      2 De raad bestaat uit een voorzitter, een secretaris en ten hoogste tien andere leden, waarvan twee leden als
      vertegenwoordiger van het Ministerie van Justitie, een lid als vertegenwoordiger van de politie en een lid dat het
      ambt van rechter bekleedt. De voorzitter alsmede zes andere leden zijn lid van het openbaar ministerie.

      3 De voorzitter, de secretaris en de leden, bedoeld in de tweede volzin van het tweede lid, worden benoemd door
      Onze Minister van Justitie, in overeenstemming met het College van procureurs-generaal. De overige leden worden
      benoemd door Onze Minister van Justitie, gehoord het College van procureurs-generaal.

      4 De voorzitter en de andere leden van de raad worden benoemd voor drie jaren. Zij kunnen worden herbenoemd.

      5 De directeur van het Centraal Justitieel Incassobureau woont de vergadering van de raad bij.
    url: https://wetten.overheid.nl/BWBR0006713/1999-06-01#Artikel3
  - number: '4'
    text: |-
      1 De raad adviseert de vergadering van procureurs-generaal desgevraagd of uit eigen beweging over de wijze waarop
      het Centraal Justitieel Incassobureau zijn taak, als bedoeld in [artikel 2, eerste lid][ref1], en de daaruit
      voortvloeiende werkzaamheden verricht, alsmede over al hetgeen met deze taakuitoefening verband houdt.

      2 Het advies wordt ter kennis gebracht van Onze Minister van Justitie.


      [ref1]: https://wetten.overheid.nl/BWBR0006713#Artikel2
