articles:
  - number: '1'
    text: |-
      a. wet: de [Wet voortgezet onderwijs 2020][ref1];

      b. vwo: voorbereidend wetenschappelijk onderwijs als bedoeld in [artikel 2.4 van de wet][ref2];

      c. mavo: middelbaar algemeen voortgezet onderwijs als bedoeld in [artikel 2.6 van de wet][ref3];

      d. avo: hoger algemeen voortgezet onderwijs als bedoeld in [artikel 2.5 van de wet][ref4] of mavo;

      e. vbo: voorbereidend beroepsonderwijs als bedoeld in [artikel 2.7 van de wet][ref5];

      f. praktijkonderwijs: een school voor praktijkonderwijs als bedoeld in [artikel 2.8 van de wet][ref6];

      g. vwo/avo: een scholengemeenschap die ten minste bestaat uit een school voor vwo en een school voor avo;

      h. gemengde leerweg: de leerjaren 3 en 4 van de gemengde leerweg als bedoeld in [artikel 2.27 van de wet][ref7];

      i. vwo/avo/vbo: een scholengemeenschap die ten minste bestaat uit een school voor vbo en een school voor vwo of een
      school voor avo.


