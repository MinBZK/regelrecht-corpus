  - number: '3'
    text: |-
      1 De bruto vloeroppervlakte per gelijktijdig aanwezige leerling die een school voor basisonderwijs tenminste dient
      te bevatten, bedraagt 3,5 m2. Tevens geldt per school en per nevenvestiging een vaste voet van tenminste 70m2.

      2 De bruto vloeroppervlakte per gelijktijdig aanwezige leerling die een speciale school voor basisonderwijs
      tenminste dient te bevatten, bedraagt 6,6 m2. Tevens geldt per school en per nevenvestiging een vaste voet van ten
      minste 90 m2.

      3 Indien aan een speciale school voor basisonderwijs een schoolsoort voor het speciaal of het voortgezet speciaal
      onderwijs is verbonden, is de schoolsoort met het grootste aantal leerlingen bepalend voor de vaste voet van de
      school, bedoeld in [artikel 4][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008562#Artikel4
