      2 Er geldt tevens een vaste voet:

      a. van 890 m2 per scholengemeenschap;

      b. van 890 m2 per school, niet zijnde een school voor praktijkonderwijs, die geen deel uitmaakt van een
      scholengemeenschap;

      c. van 260 m2 per school voor praktijkonderwijs die geen deel uitmaakt van een scholengemeenschap;

      d. van 470 m2 per nevenvestiging die voldoet aan de voorwaarden voor het verkrijgen van aanvullende personele
      bekostiging die zijn gesteld in de [bijlage behorende bij de Regeling aanvullende bekostiging bij nevenvestigingen
      met spreidingsnoodzaak in het voortgezet onderwijs](onbekend).
