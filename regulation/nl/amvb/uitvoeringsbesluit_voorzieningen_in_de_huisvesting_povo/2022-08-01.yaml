      2 Indien aan een school meer dan een schoolsoort is verbonden, is de schoolsoort met het grootste aantal leerlingen
      bepalend voor de vaste voet van de school. Indien aan een school twee of meer schoolsoorten zijn verbonden met
      hetzelfde grootste aantal leerlingen, is de schoolsoort met de grootste vaste voet bepalend.

      3 Voor het toekennen van de vaste voet wordt onder een school of instelling tevens begrepen een nevenvestiging van
      een instelling, genoemd in artikel X van de Wet van 31 mei 1995 (*Stb.* 319).
