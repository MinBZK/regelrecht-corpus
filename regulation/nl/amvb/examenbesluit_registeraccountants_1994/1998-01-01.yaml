preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Economische Zaken van 1 september 1993, nr. 93064764 WJA/W;

    Gelet op de achtste richtlijn (nr. 84/253/EEG) van de Raad van de Europese Gemeenschappen van 10 april 1984 op de
    grondslag van artikel 54, lid 3, sub g) van het Verdrag inzake de toelating van personen, belast met de wettelijke
    controle van boekhoudbescheiden (PbEG L 126), en op artikel 72, tweede lid, en artikel 73, tweede lid, van de Wet
    op de Registeraccountants;

    De Raad van State gehoord (advies van 30 november 1993, nr. W10.93.0597);

    Gezien het nader rapport van Onze Minister van Economische Zaken van 1 februari 1994, nr. 94007473 WJA/W;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0006453/1998-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0006453/1998-01-01#Artikel1
  - number: 1.a
    text: |-
      examen: het examen, bedoeld in [artikel 71 van de Wet op de Registeraccountants][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002374#Artikel71
    url: https://wetten.overheid.nl/BWBR0006453/1998-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002374
        artikel: '71'
  - number: 1.b
    text: |-
      examenbureau: het examenbureau, bedoeld in [artikel 74 van de Wet op de Registeraccountants][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002374#Artikel74
    url: https://wetten.overheid.nl/BWBR0006453/1998-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002374
        artikel: '74'
  - number: 1.c
    text: |-
      curatorium: het curatorium, bedoeld in [artikel 75 van de Wet op de Registeraccountants][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002374#Artikel75
    url: https://wetten.overheid.nl/BWBR0006453/1998-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002374
        artikel: '75'
  - number: '2.1'
    text: |-
      Tot het afleggen van het theoretische gedeelte van het examen wordt toegelaten degene die in
      het bezit is van een diploma dat recht geeft op toelating tot een universiteit in de zin van de
      [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682
    url: https://wetten.overheid.nl/BWBR0006453/1998-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005682
  - number: '2.2'
    text: |-
      Indien het in het eerste lid bedoelde diploma is behaald na het met goed gevolg afleggen van een examen dat een of
      meer vakken niet heeft omvat waarvan het met goed gevolg afgelegd hebben vereist is voor de toelating tot examens
      in de economische wetenschappen aan een universiteit als bedoeld in het eerste lid, dient de daarvoor benodigde
      kennis in dat vak of in die vakken aangetoond te worden door middel van schriftelijke bewijzen of bij een toets
      door het examenbureau.
    url: https://wetten.overheid.nl/BWBR0006453/1998-01-01#Artikel2
  - number: '3.1'
    text: |-
      Degene die niet beschikt over het in [artikel 2, eerste lid][ref1], bedoelde diploma wordt tot het theoretische
      gedeelte van het examen toegelaten, indien hij blijkens overgelegde schriftelijke bewijzen naar het oordeel van het
      examenbureau kennis heeft van de vakken Nederlands, Engels en wiskunde, alsmede van drie van de vakken economie,
      Frans, Duits, geschiedenis en aardrijkskunde, op een niveau dat overeenkomt met het niveau dat voor die vakken
      geëist wordt voor het behalen van het in [artikel 2, eerste lid][ref2], bedoelde diploma.


      [ref1]: https://wetten.overheid.nl/BWBR0006453#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006453#Artikel2
    url: https://wetten.overheid.nl/BWBR0006453/1998-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006453
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006453
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '3.2'
    text: |-
      Bij gebreke van de in het eerste lid bedoelde bewijzen toetst het examenbureau bij een toelatingsonderzoek, met
      inachtneming van door het curatorium vast te stellen beleidsregels, of de betrokkene beschikt over de in dat lid
      vereiste kennis.
    url: https://wetten.overheid.nl/BWBR0006453/1998-01-01#Artikel3
  - number: '4.1'
    text: 'Het theoretische gedeelte van het examen bestaat uit één of meer tentamens in de volgende vakken:'
    url: https://wetten.overheid.nl/BWBR0006453/1998-01-01#Artikel4
  - number: 4.1.a
    text: algemene economie,
    url: https://wetten.overheid.nl/BWBR0006453/1998-01-01#Artikel4
  - number: 4.1.b
    text: bedrijfseconomie,
    url: https://wetten.overheid.nl/BWBR0006453/1998-01-01#Artikel4
  - number: 4.1.c
    text: recht,
    url: https://wetten.overheid.nl/BWBR0006453/1998-01-01#Artikel4
  - number: 4.1.d
    text: wiskunde,
    url: https://wetten.overheid.nl/BWBR0006453/1998-01-01#Artikel4
  - number: 4.1.e
    text: statistiek,
    url: https://wetten.overheid.nl/BWBR0006453/1998-01-01#Artikel4
  - number: 4.1.f
    text: boekhouden,
    url: https://wetten.overheid.nl/BWBR0006453/1998-01-01#Artikel4
  - number: 4.1.g
    text: algemene organisatie,
    url: https://wetten.overheid.nl/BWBR0006453/1998-01-01#Artikel4
  - number: 4.1.h
    text: belastingrecht,
    url: https://wetten.overheid.nl/BWBR0006453/1998-01-01#Artikel4
  - number: 4.1.i
    text: externe verslaggeving,
    url: https://wetten.overheid.nl/BWBR0006453/1998-01-01#Artikel4
  - number: 4.1.j
    text: administratieve organisatie en
    url: https://wetten.overheid.nl/BWBR0006453/1998-01-01#Artikel4
  - number: 4.1.k
    text: leer van de accountantscontrole.
    url: https://wetten.overheid.nl/BWBR0006453/1998-01-01#Artikel4
  - number: '4.2'
    text: |-
      Het theoretische gedeelte van het examen omvat voorts een afstudeeropdracht over een onderwerp op het terrein van
      een van de in het eerste lid, onder *b, i, j* of *k*, genoemde vakken.
    url: https://wetten.overheid.nl/BWBR0006453/1998-01-01#Artikel4
  - number: '5.1'
    text: |-
      Het examenbureau stelt onder goedkeuring van het curatorium de eisen vast voor elk tentamen en voor de
      afstudeeropdracht, alsmede de tot in bijzonderheden uitgewerkte omschrijvingen van de eisen voor elk tentamen met
      vermelding van de te bestuderen literatuur.
    url: https://wetten.overheid.nl/BWBR0006453/1998-01-01#Artikel5
  - number: '5.2'
    text: |-
      Het examenbureau legt de in het eerste lid bedoelde regeling, alsmede de wijzigingen daarvan, na de goedkeuring
      door het curatorium ter inzage op zijn kantoor. Het examenbureau stelt voorts desgevraagd een exemplaar van de
      regeling tegen vergoeding van de kostprijs ter beschikking aan degenen die aan het examen willen deelnemen.
    url: https://wetten.overheid.nl/BWBR0006453/1998-01-01#Artikel5
  - number: '6.1'
    text: |-
      Het examenbureau kan, onder goedkeuring van het curatorium, om onderwijskundige redenen de geldigheidsduur van met
      goed gevolg afgelegde tentamens beperken.
    url: https://wetten.overheid.nl/BWBR0006453/1998-01-01#Artikel6
  - number: '6.2'
    text: |-
      [Artikel 5, tweede lid][ref1], is van overeenkomstige toepassing op de in het eerste lid bedoelde regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0006453#Artikel5
    url: https://wetten.overheid.nl/BWBR0006453/1998-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0006453
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '7'
    text: |-
      Het examenbureau stelt degene die beschikt over schriftelijke bewijzen waaruit blijkt dat hij de kennis heeft die
      is vereist voor het met goed gevolg afleggen van een of meer tentamens, vrij van het afleggen van de desbetreffende
      tentamens.
    url: https://wetten.overheid.nl/BWBR0006453/1998-01-01#Artikel7
  - number: '8'
    text: Tot het praktijkgedeelte van het examen wordt toegelaten degene die
    url: https://wetten.overheid.nl/BWBR0006453/1998-01-01#Artikel8
  - number: 8.1°
    text: |-
      alle tentamens in de in [artikel 4, eerste lid, onder ][ref1], genoemde vakken van het theoretische gedeelte van
      het examen met goed gevolg heeft afgelegd, en voorts ten minste één tentamen met goed gevolg heeft afgelegd in elk
      van de in [artikel 4, eerste lid, onder ][ref2], genoemde vakken, waaruit blijkt dat hij de beginselen van deze
      vakken in theorie beheerst, dan wel van het afleggen daarvan ingevolge [artikel 7][ref3] is vrijgesteld of


      [ref1]: https://wetten.overheid.nl/BWBR0006453#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0006453#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0006453#Artikel7
    url: https://wetten.overheid.nl/BWBR0006453/1998-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0006453
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0006453
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0006453
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 8.2°
    text: |-
      beschikt over schriftelijke bewijzen waaruit blijkt dat hij met de in het eerste lid genoemde tentamens
      vergelijkbare toetsen met goed gevolg heeft afgelegd bij een onderwijsinstelling die beschikt over een verklaring
      van gelijkwaardigheid als bedoeld in [artikel 79][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002374#Artikel79a
    url: https://wetten.overheid.nl/BWBR0006453/1998-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002374
        artikel: 79a
  - number: '9.1'
    text: |-
      Bij het praktijkgedeelte van het examen toetst het examenbureau de vaardigheid in de praktijk in de in
      [artikel 4, eerste lid][ref1], genoemde vakken en in het bijzonder in de vakken externe verslaggeving,
      administratieve organisatie en leer van de accountantscontrole.


      [ref1]: https://wetten.overheid.nl/BWBR0006453#Artikel4
    url: https://wetten.overheid.nl/BWBR0006453/1998-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006453
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '9.2'
    text: |-
      De werkzaamheden aan de hand waarvan de in het eerste lid bedoelde vaardigheid wordt getoetst betreffen in ieder
      geval: '- controleplanning;'
        - vastlegging en beoordeling van administratieve organisatie en interne controlesystemen en daarmee samenhangende
      automatiseringssystemen;
        - opstellen van een gedetailleerd controleprogramma;
        - toepassen van verschillende controletechnieken;
        - beoordelen van jaarrekeningen;
        - opstellen van accountantsrapporten en accountantsverklaringen.
    url: https://wetten.overheid.nl/BWBR0006453/1998-01-01#Artikel9
  - number: '10.1'
    text: |-
      Ten behoeve van de in [artikel 9][ref1] bedoelde toetsing stelt degene die aan het praktijkgedeelte van het examen
      deelneemt gedurende drie jaar na de aanvang van dat gedeelte elk half jaar een praktijkverslag op waarin de aard en
      de omvang van de door hem verrichte werkzaamheden zijn vastgelegd. Het verslag wordt voorzien van een beoordeling
      van die werkzaamheden door degene bij wie de praktijkopleiding wordt gevolgd.


      [ref1]: https://wetten.overheid.nl/BWBR0006453#Artikel9
    url: https://wetten.overheid.nl/BWBR0006453/1998-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0006453
        artikel: '9'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '10.2'
    text: |-
      Degene die deelneemt aan het praktijkgedeelte van het examen stelt voorts ten behoeve van de in
      [artikel 9][ref1] bedoelde toetsing een scriptie op over een onderwerp dat ligt op het terrein van een van de in
      [artikel 4, eerste lid, onder ][ref2], genoemde vakken.


      [ref1]: https://wetten.overheid.nl/BWBR0006453#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0006453#Artikel4
    url: https://wetten.overheid.nl/BWBR0006453/1998-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0006453
        artikel: '9'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0006453
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '11'
    text: |-
      Degene die deelneemt aan het praktijkgedeelte van het examen dient voor de aanvang van het derde jaar van de in
      [artikel 10][ref1] bedoelde drie jaar


      [ref1]: https://wetten.overheid.nl/BWBR0006453#Artikel10
    url: https://wetten.overheid.nl/BWBR0006453/1998-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0006453
        artikel: '10'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 11.1°
    text: |-
      alle tentamens in de in [artikel 4, eerste lid, onder ][ref1], genoemde vakken van het theoretische gedeelte van
      het examen met goed gevolg te hebben afgelegd of


      [ref1]: https://wetten.overheid.nl/BWBR0006453#Artikel4
    url: https://wetten.overheid.nl/BWBR0006453/1998-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0006453
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 11.2°
    text: |-
      een examen ter zake waarvan een verklaring van gelijkwaardigheid als bedoeld in [artikel 79][ref1] is afgegeven,
      met goed gevolg te hebben afgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0002374#Artikel79a
    url: https://wetten.overheid.nl/BWBR0006453/1998-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002374
        artikel: 79a
  - number: '12'
    text: |-
      Indien naar het oordeel van het examenbureau de vaardigheid van degene die aan het praktijkgedeelte van het examen
      deelneemt na afloop van de in [artikel 10][ref1] bedoelde drie jaar onvoldoende is stelt het hem in de gelegenheid
      nog gedurende ten hoogste twee jaar elk half jaar een in [artikel 10][ref2] bedoeld praktijkverslag op te stellen
      aan de hand waarvan het examenbureau de vaardigheid wederom toetst.


      [ref1]: https://wetten.overheid.nl/BWBR0006453#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0006453#Artikel10
    url: https://wetten.overheid.nl/BWBR0006453/1998-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0006453
        artikel: '10'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0006453
        artikel: '10'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '13'
    text: |-
      Het examenbureau stelt degene die beschikt over schriftelijke bewijzen waaruit blijkt dat hij met goed gevolg
      gedurende een bepaalde periode voor het praktijkgedeelte van het examen relevante werkzaamheden heeft verricht
      op het gebied van de controle van jaarrekeningen, geconsolideerde jaarrekeningen of soortgelijke financiële
      opstellingen, vrij van een door het examenbureau te bepalen deel van het praktijkgedeelte van het examen.
    url: https://wetten.overheid.nl/BWBR0006453/1998-01-01#Artikel13
  - number: '14'
    text: |-
      Degene die een of meer tentamens in de vakken, genoemd in de Examenbesluit registeraccountants, met goed
      gevolg heeft afgelegd is vrijgesteld van het afleggen van met die tentamens overeenkomende tentamens in de in
      [artikel 4, eerste lid][ref1], genoemde vakken.


      [ref1]: https://wetten.overheid.nl/BWBR0006453#Artikel4
    url: https://wetten.overheid.nl/BWBR0006453/1998-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0006453
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '15'
    text: Het Examenbesluit registeraccountants wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0006453/1998-01-01#Artikel15
  - number: '16'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het *Staatsblad* waarin het wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0006453/1998-01-01#Artikel16
  - number: '17'
    text: 'Dit besluit wordt aangehaald als: Examenbesluit registeraccountants 1994.'
    url: https://wetten.overheid.nl/BWBR0006453/1998-01-01#Artikel17
