articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder wet: [Wet kenbaarheid publiekrechtelijke beperkingen onroerende zaken][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0016876
    url: https://wetten.overheid.nl/BWBR0021609/2017-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0016876
  - number: '2'
    text: |-
      1 Aangewezen overeenkomstig [artikel 2, eerste lid, van de wet][ref1] worden de categorieën van
      beperkingenbesluiten, genoemd in de bijlage bij dit besluit.

      2 Van de aanwijzing, bedoeld in het eerste lid, is uitgezonderd een tot de betreffende categorie behorend
      beperkingenbesluit waaruit een gedoogplicht voortvloeit die minder dan zes maanden van kracht is.


      [ref1]: https://wetten.overheid.nl/BWBR0016876#Artikel2
    url: https://wetten.overheid.nl/BWBR0021609/2017-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0016876
        artikel: '2'
  - number: '5'
    text: |-
      Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende
      hoofdstukken van de bijlage bij dit besluit of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0021609/2017-01-01#Artikel5
  - number: '6'
    text: |-
      Dit besluit wordt aangehaald als: Aanwijzingsbesluit Wet kenbaarheid publiekrechtelijke beperkingen onroerende
      zaken.
    url: https://wetten.overheid.nl/BWBR0021609/2017-01-01#Artikel6
