  - number: '2'
    text: |-
      1 De invoer van goederen, die van oorsprong zijn uit een der landen of gebieden, aangewezen in de bij dit besluit
      behorende [bijlage B][ref1], dan wel een onbekende oorsprong hebben, zonder vergunning van Onze Minister, is
      verboden.

      2 Het eerste lid geldt niet indien de goederen van herkomst zijn uit het vrije verkeer van de EEG.

      3 Voor de toepassing van het eerste lid worden als goederen die een onbekende oorsprong hebben
      mede aangemerkt goederen, waarvan in de aangifte die ingevolge de wettelijke bepalingen, bedoeld in
      [artikel 2, tweede lid, onderdeel ][ref2], ten behoeve van de invoer wordt ingediend de oorsprong niet is vermeld
      of waarvan de juistheid van de in die aangifte vermelde oorsprong niet ten genoegen van de bij de invoer betrokken
      ambtenaar van de rijksbelastingdienst, bevoegd inzake douane, is aangetoond.


      [ref1]: https://wetten.overheid.nl/BWBR0003448
      [ref2]: https://wetten.overheid.nl/BWBR0007632#Artikel2
    url: https://wetten.overheid.nl/BWBR0003448/1996-06-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003448
      - id: ref2
        bwb_id: BWBR0007632
        artikel: '2'
  - number: '3'
    text: |-
      1 Ingeval bij de invoer van goederen als bedoeld in [artikel 2][ref1] ter voldoening aan een communautaire regeling
      een binnen de Gemeenschap bevoegdelijk afgegeven geldig invoercertificaat wordt overgelegd, geldt dit certificaat
      voor die invoer als een vergunning als bedoeld in [artikel 2][ref2].

      2 Onze Minister wijst het orgaan aan, dat bevoegd is tot het afgeven van invoercertificaten in Nederland, en kan,
      voor zover zulks voor een goede uitvoering van een communautaire regeling nodig is, regelen stellen met betrekking
      tot het afgeven van deze certificaten. Daarbij kan hij onder meer bepalen, dat een waarborgsom moet worden gestort.


      [ref1]: https://wetten.overheid.nl/BWBR0003448#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003448#Artikel2
    url: https://wetten.overheid.nl/BWBR0003448/1996-06-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003448
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0003448
        artikel: '2'
  - number: '4'
    text: |-
      1 Bij de invoer van goederen als bedoeld in [artikel 2, eerste lid][ref1], moeten de regelen in acht worden genomen
      die Onze Minister, voor zover hij dat voor een goede toepassing van dit besluit noodzakelijk acht, stelt met
      betrekking tot:

      a. het kennisgeven van een voorgenomen invoer van in de aanhef bedoelde goederen;

      b. het aangeven in de zin van de wettelijke bepalingen, bedoeld in [artikel 2, tweede lid, onderdeel ][ref2];

      c. het aanbieden van die ten invoer aangegeven goederen voor onderzoek en monsterneming.

      2 Voor zover voor de toepassing van het ingevolge het eerste lid bepaalde de medewerking van de
      rijksbelastingdienst wordt ingeroepen, stelt Onze Minister de aldaar bedoelde regelen vast in overeenstemming met
      Onze Minister van Financiën.


      [ref1]: https://wetten.overheid.nl/BWBR0003448#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007632#Artikel2
    url: https://wetten.overheid.nl/BWBR0003448/1996-06-01#Artikel4
    references:
