    text: |-
      1 Het Invoerbesluit landen 1963 (*Stb.* 127) wordt ingetrokken.

      2 Vergunningen en ontheffingen, krachtens het Invoerbesluit landen 1963 of de Invoerbeschikking landen 1981
      (*Stcrt.* 54) verleend, worden, voor zover zij hun gelding nog niet hebben verloren, geacht te zijn verleend op
      grond van dit besluit.
    url: https://wetten.overheid.nl/BWBR0003448/1996-06-01#Artikel9
