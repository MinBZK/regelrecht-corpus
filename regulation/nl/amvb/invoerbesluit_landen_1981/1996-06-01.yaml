        artikel: '2'
  - number: '5'
    text: |-
      1 Onze Minister kan van het bij [artikel 2, eerste lid][ref1], en [artikel 4, eerste lid][ref2], dan wel van het
      krachtens [artikel 3, tweede lid][ref3], bepaalde vrijstelling en op aanvrage ontheffing verlenen.

      2 Voor zover voor de toepassing van het ingevolge het eerste lid bepaalde de medewerking van de
      rijksbelastingdienst wordt ingeroepen, geschiedt zulks in dier voege, dat Onze Minister, in overeenstemming
      met Onze Minister van Financiën, aan de genoemde dienst opdraagt op aanvragen om ontheffing te beslissen of
      vrijstellingsregelen uit te voeren.


      [ref1]: https://wetten.overheid.nl/BWBR0003448#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003448#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0003448#Artikel3
    url: https://wetten.overheid.nl/BWBR0003448/1996-06-01#Artikel5
