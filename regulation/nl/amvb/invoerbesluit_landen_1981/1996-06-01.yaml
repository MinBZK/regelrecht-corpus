preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Economische Zaken, K.H. Beyen, Onze Minister van Landbouw en
    Visserij en van de Staatssecretaris van Financiën van 26 juni 1981, no. 681/488 W.J.A., gehoord de Commissie
    Regelingen In- en uitvoerwet, door de Sociaal-Economische Raad ingesteld op grond van artikel 43 van de Wet op de
    Bedrijfsorganisatie (Stb. 1950, K 22);

    Overwegende, dat het belang van de volkshuishouding naar Ons oordeel vereist nieuwe regelen te stellen ten aanzien
    van de invoer van goederen, die van oorsprong zijn uit bepaalde landen of gebieden dan wel een onbekende oorsprong
    hebben;

    Gelet op de artikelen 2, 2a en 4 van de In- en uitvoerwet (Stb. 1962, 295);

    De Raad van State gehoord (advies van 17 juli 1981, no. 810715/16);

    Gezien het nader rapport van de voornoemde Staatssecretarissen en van Onze voornoemde Minister van 24 augustus
    1981, no. 681/680 W. J. A.;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0003448/1996-06-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      *landbouwgoederen:*

      a. alle voortbrengselen welke, al dan niet na be- of verwerking, kunnen dienen als voedsel voor mens of dier,
      alsmede de bij be- of verwerking van die voortbrengselen verkregen derivaten en afvallen;

      b. de niet reeds onder *a* begrepen voortbrengselen van akkerbouw, weidebouw, veehouderij, pluimveehouderij
      en tuinbouw - daaronder begrepen fruitteelt en het kweken van bomen, bloemen en bloembollen -, alsmede van de
      teelt van griendhout en van elke andere vorm van bodemcultuur, zoals die hier te lande wordt uitgeoefend, met
      uitzondering van bosbouw;

      c. de niet reeds onder *a* of *b* begrepen goederen, vermeld in de bijlage van het
      [In- en uitvoerbesluit landbouwgoederen 1980][ref1] (*Stb.* 758);

      *Onze Minister:*

      a. Onze Minister van Landbouw en Visserij, voor zover het landbouwgoederen betreft;

      b. Onze Minister van Economische Zaken, voor zover het andere goederen betreft;

      *oorsprong:* hetgeen daaronder wordt verstaan in Titel II, Hoofdstuk 2, Afdeling 1, van het Communautair
      douanewetboek;

      *communautaire regeling:* een door de Raad of de Commissie van de Europese Gemeenschappen vastgestelde verordening
      of beschikking, houdende maatregelen voor het handelsverkeer tussen de Gemeenschap en derde landen of tussen de
      Lid-Staten der Gemeenschap onderling inzake een of meer goederen;

      *invoercertificaat:* een document, dat ingevolge een communautaire regeling bij de invoer van een in die regeling
      omschreven of aangeduid goed moet worden overgelegd en dat het recht en de plicht meebrengt tot het invoeren van
      het in het document omschreven of aangeduide goed tijdens de geldigheidsduur van het document.

      2 In dit besluit en de daarop berustende bepalingen wordt onder goederen niet verstaan de goederen, aangewezen in
      de bij dit besluit behorende [bijlage A][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003360
      [ref2]: https://wetten.overheid.nl/BWBR0003448
