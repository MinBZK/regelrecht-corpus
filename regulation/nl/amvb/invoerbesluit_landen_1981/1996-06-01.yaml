  - number: '6'
    text: |-
      Bij de verlening van een vergunning als bedoeld in [artikel 2, eerste lid][ref1], worden daaraan voor de houder de
      volgende voorschriften verbonden:

      a. de vergunning moet bij de invoer van goederen, waarvoor zij is verleend, in handen worden gesteld van de daarbij
      betrokken ambtenaar van de rijksbelastingdienst, bevoegd inzake douane;

      b. zodra vaststaat dat daarvan geen gebruik meer kan worden gemaakt moet de vergunning terstond teruggezonden
      worden aan degene, die haar heeft verleend;

      c. aan degene, die de vergunning heeft verleend, moeten binnen de daartoe gestelde termijn alle gewenste
      inlichtingen worden verstrekt omtrent het daarvan gemaakte gebruik.


      [ref1]: https://wetten.overheid.nl/BWBR0003448#Artikel2
    url: https://wetten.overheid.nl/BWBR0003448/1996-06-01#Artikel6
