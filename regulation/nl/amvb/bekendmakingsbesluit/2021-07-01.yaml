$id: bekendmakingsbesluit
regulatory_layer: AMVB
publication_date: '2021-04-09'
valid_from: '2021-07-01'
bwb_id: BWBR0025257
url: https://wetten.overheid.nl/BWBR0025257/2021-07-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Justitie van 15 oktober 2008, nr. 556829/08/6, gedaan mede namens de
    Staatssecretaris van Binnenlandse Zaken en Koninkrijksrelaties,

    Gelet op de artikelen 1, vijfde lid, 8 en 10a, eerste en tweede lid, van de Bekendmakingswet;

    De Raad van State gehoord (advies van 12 november 2008, nr. W03.08.0457/II);

    Gezien het nader rapport van Onze Minister van Justitie van 15 december 2008, nr. 5577375/08/6, uitgebracht mede
    namens de Staatssecretaris van Binnenlandse Zaken en Koninkrijksrelaties;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0025257/2021-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder Onze Minister: Onze Minister van Justitie en Veiligheid.'
    url: https://wetten.overheid.nl/BWBR0025257/2021-07-01#Artikel1
  - number: '2.1'
    text: Het Staatsblad wordt uitgegeven op een bij ministeriële regeling te bepalen internetadres.
    url: https://wetten.overheid.nl/BWBR0025257/2021-07-01#Artikel2
  - number: '2.2'
    text: Op het Staatsblad wordt vermeld wanneer het is uitgegeven.
    url: https://wetten.overheid.nl/BWBR0025257/2021-07-01#Artikel2
  - number: '3'
    text: |-
      Onze Minister draagt er zorg voor dat het Staatsblad na de uitgifte elektronisch op een algemeen toegankelijke
      wijze beschikbaar blijft.
    url: https://wetten.overheid.nl/BWBR0025257/2021-07-01#Artikel3
  - number: '4.1'
    text: |-
      Onze Minister draagt er zorg voor dat de nodige maatregelen worden getroffen ter waarborging van de betrouwbaarheid
      en de beveiliging van de uitgifte en de beschikbaarstelling van het Staatsblad.
    url: https://wetten.overheid.nl/BWBR0025257/2021-07-01#Artikel4
  - number: '4.2'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent het eerste lid.
    url: https://wetten.overheid.nl/BWBR0025257/2021-07-01#Artikel4
  - number: '5'
    text: |-
      In het Staatsblad wordt opgenomen al hetgeen waarvan een wet, algemene maatregel van bestuur of ander koninklijk
      besluit waarbij algemeen verbindende voorschriften worden vastgesteld bekendmaking in het Staatsblad voorschrijft,
      alsmede datgene wat in verband hiermee naar het oordeel van Onze Minister moet worden vermeld.
    url: https://wetten.overheid.nl/BWBR0025257/2021-07-01#Artikel5
  - number: '6.1'
    text: |-
      Wetten, algemene maatregelen van bestuur en andere koninklijke besluiten waarbij algemeen verbindende
      voorschriften worden vastgesteld die in het Staatsblad moeten worden geplaatst, worden daartoe na de in
      [artikel 47 van de Grondwet][ref1] bedoelde ondertekening aan Onze Minister toegezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0001840#Artikel47
    url: https://wetten.overheid.nl/BWBR0025257/2021-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0001840
        artikel: '47'
  - number: '6.2'
    text: |-
      De als eerste ondertekenende minister of staatssecretaris draagt er zorg voor dat de toezending op een zodanig
      tijdstip en op zodanige wijze plaatsvindt dat plaatsing in het Staatsblad tijdig kan geschieden.
    url: https://wetten.overheid.nl/BWBR0025257/2021-07-01#Artikel6
  - number: '7'
    text: |-
      Wetten, algemene maatregelen van bestuur en andere koninklijke besluiten waarbij algemeen verbindende voorschriften
      worden vastgesteld, worden na plaatsing in het Staatsblad door Onze Minister teruggezonden aan het Kabinet van
      de Koning.
    url: https://wetten.overheid.nl/BWBR0025257/2021-07-01#Artikel7
  - number: '8'
    text: |-
      Onze Minister past met betrekking tot de plaatsing in het Staatsblad de regels of technische standaarden toe die
      krachtens het [Besluit elektronische publicaties](onbekend) zijn gesteld onderscheidenlijk zijn aangewezen.
    url: https://wetten.overheid.nl/BWBR0025257/2021-07-01#Artikel8
  - number: '13'
    text: |-
      Dit besluit berust op de [artikelen 15][ref1] en [16, eerste, tweede en vierde lid, van de Bekendmakingswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004287#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0004287#Artikel16
    url: https://wetten.overheid.nl/BWBR0025257/2021-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0004287
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0004287
        artikel: '16'
  - number: '14'
    text: |-
      Het [Besluit uitgifte Staatsblad en Staatscourant][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0004484
    url: https://wetten.overheid.nl/BWBR0025257/2021-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0004484
  - number: '15'
    text: |-
      Dit besluit treedt in werking op het tijdstip waarop [artikel I van de Wet elektronische bekendmaking][ref1] in
      werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0024913#ArtikelI
    url: https://wetten.overheid.nl/BWBR0025257/2021-07-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0024913
        artikel: I
  - number: '16'
    text: 'Dit besluit wordt aangehaald als: Bekendmakingsbesluit.'
    url: https://wetten.overheid.nl/BWBR0025257/2021-07-01#Artikel16
