---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_financiering_rechtspraak
regulatory_layer: AMVB
publication_date: '2005-02-10'
valid_from: '2004-07-01'
bwb_id: BWBR0013886
url: https://wetten.overheid.nl/BWBR0013886/2004-07-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Justitie van 8 mei 2002, Directie Wetgeving nr. 5163667/02/6;

    Gelet op de artikelen 97, eerste lid, 98, vierde lid, en 104, zesde lid, van de Wet op de rechterlijke organisatie;

    De Raad van State gehoord (advies van 27 juni 2002, nr. WO3.02.0212/I);

    Gezien het nader rapport van Onze Minister van Justitie van 12 juli 2002, Directie Wetgeving nr. 5175055/02/6;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel1
  - number: 1.a
    text: |-
      wet: de [Wet op de rechterlijke organisatie][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001830
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001830
  - number: 1.b
    text: |-
      werklastmetingssysteem: het systeem van objectieve meting van de werklast, bedoeld in [artikel 2][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013886#Artikel2
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0013886
        artikel: '2'
        hoofdstuk: '2'
  - number: 1.c
    text: 'zaak: een door een gerecht te behandelen rechtszaak;'
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel1
  - number: 1.d
    text: |-
      zaakscategorie: een groep zaken die op gelijksoortige wijze worden behandeld en afgedaan en waarvoor, in voorkomend
      geval per gerechtscategorie, met een gelijk aantal minuten wordt gerekend;
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel1
  - number: 1.e
    text: 'gerechtscategorieën:'
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel1
  - number: 1.e.1°
    text: de sectoren kanton van de rechtbanken;
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel1
  - number: 1.e.2°
    text: de rechtbanken, uitgezonderd de sectoren kanton;
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel1
  - number: 1.e.3°
    text: de gerechtshoven;
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel1
  - number: 1.e.4°
    text: het College van Beroep voor het bedrijfsleven;
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel1
  - number: 1.e.5°
    text: de Centrale Raad van Beroep;
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel1
  - number: 1.f
    text: 'personeelscategorieën:'
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel1
  - number: 1.f.1°
    text: rechtsprekend personeel;
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel1
  - number: 1.f.2°
    text: niet-rechtsprekend personeel;
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel1
  - number: 1.g
    text: |-
      rechtsprekend personeel: bij de in onderdeel e, onder 1° tot en met 3°, werkzame rechterlijke ambtenaren met
      rechtspraak belast alsmede met rechtspraak belaste leden van de Centrale Raad van Beroep of het College van Beroep
      voor het bedrijfsleven;
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel1
  - number: 1.h
    text: |-
      niet-rechtsprekend personeel: gerechtsauditeurs en rechterlijke ambtenaren in opleiding voor zover niet onder
      g begrepen, gerechtsambtenaren, buitengriffiers en overige medewerkers bij de in de onderdeel e genoemde
      gerechtscategorieën voor zover belast met de behandeling en afdoening van zaken;
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel1
  - number: 1.i
    text: |-
      begrotingsvoorstel van de Raad: het begrotingsvoorstel, bedoeld in [artikel 98, eerste lid, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel98
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001830
        artikel: '98'
  - number: 1.j
    text: 'meerjarenraming van de Raad: de meerjarenraming, bedoeld in artikel 98, eerste lid, van de wet;'
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel1
  - number: 1.k
    text: |-
      jaarplan van het gerecht: het jaarplan, bedoeld in [artikel 31, eerste lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel31
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001830
        artikel: '31'
  - number: '2.1'
    text: |-
      Er is een werklastmetingssysteem voor de rechtspraak. Dit systeem houdt in het meten en beschrijven van de werklast
      voor het personeel bij de gerechten, gemoeid met de behandeling en afdoening van de in dat systeem omschreven
      categorieën van zaken.
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel2
  - number: '2.2'
    text: |-
      Het werklastmetingssysteem bestaat uit een overzicht van zaakscategorieën en de daarmee per personeelscategorie, en
      in voorkomend geval per gerechtscategorie, gemoeide landelijke gemiddelde behandeltijd uitgedrukt in minuten, zoals
      weergegeven in bijlage 1 bij deze regeling.
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel2
  - number: '2.3'
    text: |-
      Het aan de indeling in zaakscategorieën ten grondslag liggende systeem van definities en modellen wordt beheerd
      door de Raad. De Raad verschaft Onze Minister jaarlijks een overzicht van dit systeem van definities en modellen.
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel2
  - number: '3.1'
    text: |-
      Van iedere zaakscategorie wordt de daarmee gemoeide actuele werklast tenminste eenmaal in de vijf jaren gemeten
      door middel van door de Raad georganiseerde geobjectiveerde tijdschrijfonderzoeken.
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel3
  - number: '3.2'
    text: |-
      De Raad verschaft Onze Minister jaarlijks een overzicht van de tijdschrijfonderzoeken welke hij de komende vijf
      jaren instelt. In dit overzicht is een beschrijving opgenomen van de opzet van de onderzoeken alsmede van de wijze
      waarop de onderzoeken worden uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel3
  - number: '3.3'
    text: |-
      De Raad doet de opzet van de tijdschrijfonderzoeken alsmede de wijze waarop de onderzoeken worden uitgevoerd
      toetsen door een externe, onafhankelijke deskundige.
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel3
  - number: '4'
    text: |-
      Het jaarlijks aan de Raad toe te kennen budget ten behoeve van de activiteiten van de Raad en de gerechten
      gezamenlijk is gelijk aan het bedrag dat ten behoeve van de Raad is opgenomen in het voor het desbetreffende
      begrotingsjaar vastgestelde hoofdstuk VI van de rijksbegroting.
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel4
  - number: '5'
    text: 'Het budget ten behoeve van de Raad bestaat uit de volgende onderdelen:'
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel5
  - number: 5.a
    text: apparaatskosten, en
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel5
  - number: 5.b
    text: programmakosten.
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel5
  - number: '6'
    text: 'Het budget ten behoeve van de gerechten bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel6
  - number: 6.a
    text: een algemeen budget, samengesteld uit een component werklast en een component gerechtskosten;
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel6
  - number: 6.b
    text: een specifiek budget.
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel6
  - number: '7'
    text: |-
      Voor het bepalen van het onderdeel apparaatskosten stelt de Raad voor het desbetreffende begrotingsjaar een raming
      op die zowel de Raad, het bureau van de Raad als het College van afgevaardigden betreft.
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel7
  - number: '8.1'
    text: |-
      Voor het bepalen van het onderdeel programmakosten stelt de Raad jaarlijks een plan vast waarin een omschrijving
      is opgenomen van de voorgenomen activiteiten ter uitvoering van de in [artikel 91 van de wet][ref1] genoemde taken
      voor het desbetreffende begrotingsjaar en de daarmee nagestreefde, concrete doelstellingen.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel91
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0001830
        artikel: '91'
  - number: '8.2'
    text: In het plan worden de incidentele en structurele kosten zichtbaar gemaakt.
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel8
  - number: '9'
    text: 'Bij het bepalen van de component werklast wordt uitgegaan van:'
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel9
  - number: 9.a
    text: |-
      het bedrag dat wordt verkregen door de uit het werklastmetingssysteem voortvloeiende tijd die per
      personeelscategorie is gemoeid met de behandeling en afdoening van het aantal in het begrotingsjaar af te handelen
      zaken van iedere zaaks- en gerechtscategorie, te vermenigvuldigen met het in [artikel 10][ref1] bedoelde tarief per
      minuut per personeelscategorie;


      [ref1]: https://wetten.overheid.nl/BWBR0013886#Artikel10
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0013886
        artikel: '10'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '2'
  - number: 9.b
    text: |-
      het landelijk beschikbare kader zoals neergelegd in de meerjarenramingen bij de begroting van het Ministerie van
      Justitie.
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel9
  - number: '10.1'
    text: 'Het tarief per minuut per onderscheiden personeelscategorie is opgebouwd uit de volgende componenten:'
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel10
  - number: 10.1.a
    text: de middensom per personeelscategorie (a);
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel10
  - number: 10.1.b
    text: het aantal direct productieve uren (b);
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel10
  - number: 10.1.c
    text: een opslag voor overhead van 27 procent (c).
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel10
  - number: '10.2'
    text: |-
      Het in het eerste lid bedoelde tarief wordt vastgesteld door Onze Minister overeenkomstig de volgende formule: a x
      (1 + c) / (b x 60)
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel10
  - number: '10.3'
    text: |-
      Onder de middensom wordt verstaan: het gemiddeld bedrag aan werkgeverslasten voor de in
      [artikel 1, onderdeel e][ref1], genoemde gerechtscategorieën, opgehoogd met een bedrag voor personeelsgebonden
      kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0013886#Artikel1
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0013886
        artikel: '1'
        hoofdstuk: '1'
  - number: '10.4'
    text: |-
      Onder direct productieve uren wordt verstaan: het aantal uren dat gemiddeld door een personeelslid met een 36-urige
      werkweek in een kalenderjaar wordt besteed aan de behandeling en afdoening van zaken.
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel10
  - number: '11.1'
    text: |-
      In aanvulling op [artikel 9][ref1] omvat de component werklast tevens een bedrag voor het behandelen en afdoen
      van de in bijlage 2 bij deze regeling genoemde zaken alsmede enkele andere bij wet aan de rechter opgedragen
      activiteiten, welke niet zijn begrepen in het werklastmetingssysteem.


      [ref1]: https://wetten.overheid.nl/BWBR0013886#Artikel9
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0013886
        artikel: '9'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '2'
  - number: '11.2'
    text: |-
      Het in het eerste lid bedoelde bedrag wordt bepaald aan de hand van een raming van de Raad van het voor deze zaken
      benodigd budget.
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel11
  - number: '11.3'
    text: |-
      In afwijking van het tweede lid wordt ten behoeve van werkzaamheden van de rechter-commissaris in strafzaken bij
      rechtbanken een bedrag toegekend ter grootte van 25 onderscheidenlijk 19 procent van het totaal aantal minuten
      inzet rechtsprekend onderscheidenlijk niet-rechtsprekend personeel in de in onderdeel IV van bijlage 1 bedoelde
      strafzaken bij rechtbanken, uitgezonderd de sector kanton.
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel11
  - number: '12.1'
    text: |-
      De component gerechtskosten wordt bepaald door de gerechtskosten per zaak te vermenigvuldigen met het aantal af te
      handelen civiele en bestuursrechtelijke zaken in het desbetreffende jaar.
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel12
  - number: '12.2'
    text: |-
      Onder gerechtskosten per zaak wordt verstaan: de gerealiseerde gerechtskosten in civiele en bestuursrechtelijke
      zaken in het meest recente aan het begrotingsjaar voorafgaande jaar gedeeld door het aantal afgehandelde civiele en
      bestuursrechtelijke zaken in het desbetreffende begrotingsjaar.
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel12
  - number: '12.3'
    text: |-
      De Raad zendt Onze Minister binnen een maand na afloop van een viermaandsperiode een verslag van de uitgaven aan
      gerechtskosten die in de afgelopen periode zijn gerealiseerd.
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel12
  - number: '12.4'
    text: |-
      Indien het in het eerste lid bedoelde bedrag niet toereikend is, stelt Onze Minister aanvullende financiële
      middelen ter beschikking van de Raad teneinde de met de gerechtskosten gemoeide uitgaven van de gerechten te kunnen
      bekostigen.
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel12
  - number: '13.1'
    text: 'Specifiek budget wordt toegekend voor:'
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel13
  - number: 13.1.a
    text: lokale innovatieve projecten;
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel13
  - number: 13.1.b
    text: lokaal geïnitieerde projecten die een landelijke uitstraling kunnen hebben;
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel13
  - number: 13.1.c
    text: landelijk te initiëren projecten.
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel13
  - number: '13.2'
    text: |-
      Het budget voor de in het eerste lid, onder a en b, bedoelde projecten bedraagt ten minste 1 procent en ten hoogste
      3 procent van het algemeen budget ten behoeve van de gerechten, bedoeld in [artikel 6, aanhef en onder a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013886#Artikel6
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0013886
        artikel: '6'
        hoofdstuk: '3'
        afdeling: '1'
  - number: '13.3'
    text: |-
      Het budget voor de in het eerste lid, onder c, bedoelde projecten wordt bepaald aan de hand van door de Raad bij
      Onze Minister in te dienen projectplannen.
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel13
  - number: '14'
    text: |-
      De door Onze Minister aan de jaarlijkse budgettoekenning te verbinden voorschriften kunnen slechts betrekking
      hebben op de:
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel14
  - number: 14.a
    text: door de gerechten gezamenlijk te realiseren zaaksaantallen, onderscheiden naar zaaks- en gerechtscategorie;
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel14
  - number: 14.b
    text: |-
      door de gerechten gezamenlijk te realiseren vermindering van het verschil tussen de in [artikel 18][ref1]
      bedoelde voorraad aan het begin van het begrotingsjaar en de normaal te achten werkvoorraad aan het eind van het
      begrotingsjaar;


      [ref1]: https://wetten.overheid.nl/BWBR0013886#Artikel18
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0013886
        artikel: '18'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '5'
  - number: 14.c
    text: |-
      te realiseren doelstellingen zoals opgenomen in het in [artikel 8][ref1] bedoelde plan;


      [ref1]: https://wetten.overheid.nl/BWBR0013886#Artikel8
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0013886
        artikel: '8'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
  - number: 14.d
    text: |-
      met het in [artikel 6, aanhef en onder b][ref1], bedoelde specifieke budget te realiseren verbeteringen in de
      organisatie en werkwijze van de gerechten.


      [ref1]: https://wetten.overheid.nl/BWBR0013886#Artikel6
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0013886
        artikel: '6'
        hoofdstuk: '3'
        afdeling: '1'
  - number: '15.1'
    text: |-
      De Raad doet periodiek onderzoek verrichten naar de omvang van het opslagpercentage bedoeld in
      [artikel 10, eerste lid, onder c][ref1], en de inhoud van de tot de overhead behorende taken die in het
      opslagpercentage zijn begrepen met het oog op een doelmatige inzet van financiële middelen.


      [ref1]: https://wetten.overheid.nl/BWBR0013886#Artikel10
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0013886
        artikel: '10'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '2'
  - number: '15.2'
    text: De Raad stelt Onze Minister jaarlijks op de hoogte van zijn voornemens met betrekking tot het eerste lid.
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel15
  - number: '16'
    text: |-
      De Raad voegt als bijlage bij zijn begrotingsvoorstel het in [artikel 8][ref1] bedoelde plan.


      [ref1]: https://wetten.overheid.nl/BWBR0013886#Artikel8
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0013886
        artikel: '8'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
  - number: '17'
    text: |-
      Ten behoeve van de in [artikel 9][ref1] bedoelde component neemt de Raad met betrekking tot de in het
      werklastmetingssysteem begrepen zaken in zijn begrotingsvoorstel op:


      [ref1]: https://wetten.overheid.nl/BWBR0013886#Artikel9
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0013886
        artikel: '9'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '2'
  - number: 17.a
    text: |-
      een raming van het aantal in het begrotingsjaar door de gerechten af te handelen zaken, uitgesplitst naar zaaks-
      en gerechtscategorie.
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel17
  - number: 17.b
    text: |-
      een voorstel voor de middensom per personeelscategorie, alsmede voor het aantal direct productieve uren, bedoeld in
      [artikel 10, eerste lid, onder a en b][ref1], in het desbetreffende begrotingsjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0013886#Artikel10
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0013886
        artikel: '10'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '2'
  - number: '18.1'
    text: |-
      De raming, bedoeld in [artikel 17][ref1], is gebaseerd op de verwachte instroom aan zaken in het begrotingsjaar,
      de werkvoorraad aan het begin van het begrotingsjaar en de normaal geachte werkvoorraad aan het eind van het
      begrotingsjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0013886#Artikel17
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0013886
        artikel: '17'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '5'
  - number: '18.2'
    text: |-
      De verwachte instroom wordt gebaseerd op de meest recente ervaringscijfers van twee voorafgaande jaren en op de
      door de Raad te onderbouwen instroomontwikkelingen.
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel18
  - number: '18.3'
    text: |-
      De Raad betrekt bij zijn raming uitdrukkelijk de naleving van de aan de budgettoekenning verbonden voorschriften in
      de twee voorafgaande jaren.
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel18
  - number: '19'
    text: |-
      Ten behoeve van de in [artikel 11][ref1] bedoelde component neemt de Raad in zijn begrotingsvoorstel met betrekking
      tot de in bijlage 2 bedoelde zaken en werkzaamheden, per onderdeel, een raming op van het daarvoor benodigd budget.


      [ref1]: https://wetten.overheid.nl/BWBR0013886#Artikel11
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0013886
        artikel: '11'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '2'
  - number: '20.1'
    text: |-
      Ten behoeve van de in [artikel 12][ref1] bedoelde component neemt de Raad in zijn begrotingsvoorstel op het bedrag
      van de gerechtskosten per zaak, bedoeld in [artikel 12, tweede lid][ref2], alsmede een raming van het aantal af te
      handelen civiele en bestuursrechtelijke zaken.


      [ref1]: https://wetten.overheid.nl/BWBR0013886#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0013886#Artikel12
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0013886
        artikel: '12'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0013886
        artikel: '12'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '2'
  - number: '20.2'
    text: |-
      [Artikel 18][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013886#Artikel18
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0013886
        artikel: '18'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '5'
  - number: '21'
    text: |-
      De Raad neemt als bijlage bij zijn begrotingsvoorstel op de projectvoorstellen als bedoeld in
      [artikel 13, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013886#Artikel13
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0013886
        artikel: '13'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '2'
  - number: '22'
    text: |-
      De Raad doet in zijn begrotingsvoorstel voor elk van de in [artikel 14][ref1] genoemde onderwerpen een voorstel
      voor door Onze Minister aan de toekenning van het budget in het desbetreffende begrotingsjaar te verbinden
      voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0013886#Artikel14
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0013886
        artikel: '14'
        hoofdstuk: '3'
        afdeling: '3'
  - number: '23.1'
    text: |-
      Met betrekking tot de scheefgroei geeft de Raad gedurende vijf jaren na inwerkingtreding van deze algemene
      maatregel van bestuur in zijn begrotingsvoorstel aan:
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel23
  - number: 23.1.a
    text: de scheefgroei per gerecht;
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel23
  - number: 23.1.b
    text: wanneer naar verwachting de scheefgroei van de gerechten ten opzichte van elkaar zal zijn gelijk getrokken.
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel23
  - number: '23.2'
    text: |-
      Onder scheefgroei wordt verstaan: het verschil tussen het op grond van de [artikelen 27][ref1] en [28][ref2] aan
      het gerecht feitelijk toegekende budget voor de afhandeling van in het werklastmetingssysteem begrepen zaken en
      het budget dat behoort bij deze zaken indien de berekeningswijze van [artikel 9, onderdeel a][ref3], voor het
      desbetreffende gerecht zou worden gevolgd.


      [ref1]: https://wetten.overheid.nl/BWBR0013886#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0013886#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0013886#Artikel9
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0013886
        artikel: '27'
        hoofdstuk: '4'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0013886
        artikel: '28'
        hoofdstuk: '4'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0013886
        artikel: '9'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '2'
  - number: '24'
    text: 'De Raad voegt als bijlage bij zijn begrotingsvoorstel:'
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel24
  - number: 24.a
    text: |-
      de overzichten, bedoeld in de [artikelen 2, derde lid][ref1], en [3, tweede lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0013886#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0013886#Artikel3
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0013886
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0013886
        artikel: '3'
        hoofdstuk: '2'
  - number: 24.b
    text: |-
      de in [artikel 15, tweede lid][ref1], bedoelde informatie.


      [ref1]: https://wetten.overheid.nl/BWBR0013886#Artikel15
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0013886
        artikel: '15'
        hoofdstuk: '3'
        afdeling: '4'
  - number: '25.1'
    text: |-
      De meerjarenraming van de Raad bevat voor vier op het begrotingsjaar volgende jaren een raming van het benodigd
      budget ten behoeve van de Raad en de gerechten gezamenlijk.
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel25
  - number: '25.2'
    text: De afdelingen 2 en 5 zijn van overeenkomstige toepassing op het opstellen van de in het eerste lid bedoelde raming.
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel25
  - number: '26.1'
    text: |-
      In verband met de verdeling van de in [artikel 9][ref1] bedoelde component, splitst de Raad deze component in een
      deel personeel en een deel overhead.


      [ref1]: https://wetten.overheid.nl/BWBR0013886#Artikel9
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0013886
        artikel: '9'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '2'
  - number: '26.2'
    text: |-
      Het deel personeel wordt berekend door de in het eerste lid bedoelde component werklast te vermenigvuldigen met
      100/127.
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel26
  - number: '26.3'
    text: |-
      Het deel overhead wordt berekend door de in het eerste lid bedoelde component werklast te vermenigvuldigen met
      27/127.
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel26
  - number: '27.1'
    text: |-
      De Raad verdeelt het in [artikel 26, tweede lid][ref1], bedoelde deel personeel over de gerechten overeenkomstig
      het aantal in het werklastmetingssysteem begrepen zaken dat in het begrotingsjaar zal worden afgehandeld,
      uitgesplitst naar zaaks- en gerechtscategorie.


      [ref1]: https://wetten.overheid.nl/BWBR0013886#Artikel26
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0013886
        artikel: '26'
        hoofdstuk: '4'
        afdeling: '1'
  - number: '27.2'
    text: |-
      De Raad kan bij de verdeling uitgaan van de voor de desbetreffende gerechtscategorie geldende,
      door de Raad jaarlijks vast te stellen, middensom, met dien verstande dat de gerechtscategorieën in
      [artikel 1 onderdeel e, onder 1° en 2°][ref1] voor de toepassing van deze bepaling als één categorie gelden.


      [ref1]: https://wetten.overheid.nl/BWBR0013886#Artikel1
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0013886
        artikel: '1'
        hoofdstuk: '1'
  - number: '27.3'
    text: |-
      Gedurende vijf jaren na inwerkingtreding van deze algemene maatregel van bestuur kan de Raad met redenen omkleed
      afwijken van het eerste lid jegens een gerecht.
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel27
  - number: '28.1'
    text: |-
      De Raad verdeelt het in [artikel 26, derde lid][ref1], bedoelde deel overhead, over de gerechten door per gerecht
      een percentage van 27 procent van het voor het desbetreffende gerecht op grond van [artikel 27, eerste lid][ref2],
      bedoelde bedrag, toe te kennen.


      [ref1]: https://wetten.overheid.nl/BWBR0013886#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0013886#Artikel27
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0013886
        artikel: '26'
        hoofdstuk: '4'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0013886
        artikel: '27'
        hoofdstuk: '4'
        afdeling: '1'
  - number: '28.2'
    text: |-
      Gedurende vijf jaren na inwerkingtreding van deze algemene maatregel van bestuur kan de Raad met redenen omkleed
      afwijken van het eerste lid jegens een gerecht.
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel28
  - number: '29.1'
    text: |-
      De Raad verdeelt de in [artikel 11][ref1] bedoelde component over de gerechten overeenkomstig de ramingen van de
      gerechten terzake van de in bijlage 2 opgenomen zaken en werkzaamheden.


      [ref1]: https://wetten.overheid.nl/BWBR0013886#Artikel11
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0013886
        artikel: '11'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '2'
  - number: '29.2'
    text: |-
      In afwijking van het eerste lid ontvangen de in [artikel 1, onderdeel e][ref1], sub 2, bedoelde gerechten een
      bedrag ter grootte van 25 onderscheidenlijk 19 procent van het totaal aantal minuten inzet rechtsprekend personeel
      onderscheidenlijk niet-rechtsprekend personeel in strafzaken als bedoeld in onderdeel IV van bijlage 1 bij het
      desbetreffende gerecht.


      [ref1]: https://wetten.overheid.nl/BWBR0013886#Artikel1
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0013886
        artikel: '1'
        hoofdstuk: '1'
  - number: '30.1'
    text: |-
      De Raad verdeelt het bedrag van de in [artikel 12, eerste lid][ref1], bedoelde component over de gerechten
      overeenkomstig het aantal civiele en bestuursrechtelijke zaken dat in het begrotingsjaar zal worden afgehandeld.


      [ref1]: https://wetten.overheid.nl/BWBR0013886#Artikel12
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0013886
        artikel: '12'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '2'
  - number: '30.2'
    text: |-
      De gerechten zenden de Raad binnen 15 dagen na afloop van elke viermaandsperiode een verslag van de uitgaven aan de
      in het eerste lid bedoelde gerechtskosten die in de afgelopen periode zijn gerealiseerd.
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel30
  - number: '30.3'
    text: |-
      Op verzoek van het bestuur van een gerecht stelt de Raad aanvullende financiële middelen ter beschikking teneinde
      de met de gerechtskosten in civiele en bestuursrechtelijke zaken gemoeide uitgaven van het desbetreffende gerecht
      te bekostigen.
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel30
  - number: 30a
    text: |-
      Bij toepassing van de [artikelen 6a tot en met 6c van het Besluit nevenvestigings- en nevenzittingsplaatsen][ref1]
      kunnen de gerechten onderling de kosten verrekenen die samenhangen met de behandeling van een zaak of zaken in
      een nevenzittingsplaats buiten het rechtsgebied op basis van een door de Raad voor de rechtspraak goedgekeurde
      kostprijs.


      [ref1]: https://wetten.overheid.nl/BWBR0013129#Artikel9
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel30a
    references:
      - id: ref1
        bwb_id: BWBR0013129
        artikel: '9'
  - number: '31.1'
    text: |-
      Het bestuur van een gerecht kan de Raad verzoeken om toekenning van aanvullende financiële middelen ten behoeve
      van specifiek omschreven activiteiten die zijn gericht op de verbetering van de organisatie of de werkwijze van
      het gerecht.
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel31
  - number: '31.2'
    text: 'Het verzoek gaat in elk geval vergezeld van:'
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel31
  - number: 31.2.a
    text: een projectplan, en
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel31
  - number: 31.2.b
    text: een begroting, tenzij deze voor de berekening van het bedrag niet van belang is.
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel31
  - number: '32'
    text: |-
      De aan de toekenning van het jaarlijkse budget door de Raad te verbinden voorschriften kunnen slechts betrekking
      hebben op de in het desbetreffende jaar:
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel32
  - number: 32.a
    text: te realiseren zaaksaantallen, onderscheiden naar zaaks- en gerechtscategorie;
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel32
  - number: 32.b
    text: |-
      met de in [artikel 31][ref1] bedoelde aanvullende financiële middelen te realiseren doelstellingen;


      [ref1]: https://wetten.overheid.nl/BWBR0013886#Artikel31
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0013886
        artikel: '31'
        hoofdstuk: '4'
        afdeling: '2'
  - number: 32.c
    text: het aantal en categorieën van zaken die zijn behandeld als nevenzittingsplaats van een ander gerecht.
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel32
  - number: '33'
    text: |-
      Het bestuur van een gerecht is verplicht medewerking te verlenen aan de onderzoeken bedoeld in de
      [artikelen 3, eerste en derde lid][ref1], en [15, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013886#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0013886#Artikel15
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0013886
        artikel: '3'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0013886
        artikel: '15'
        hoofdstuk: '3'
        afdeling: '4'
  - number: '34.1'
    text: |-
      Het bestuur van het gerecht kan het ingevolge [artikel 30, eerste lid][ref1], aan de gerechten toegekende budget
      voor gerechtskosten in civiele en bestuursrechtelijke zaken uitsluitend voor deze kosten aanwenden.


      [ref1]: https://wetten.overheid.nl/BWBR0013886#Artikel30
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0013886
        artikel: '30'
        hoofdstuk: '4'
        afdeling: '1'
  - number: '34.2'
    text: |-
      Het bestuur van het gerecht kan het op grond van [artikel 29][ref1] toegekende budget voor zaken als bedoeld in
      bijlage 2, onder 12, uitsluitend voor deze zaken aanwenden.


      [ref1]: https://wetten.overheid.nl/BWBR0013886#Artikel29
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0013886
        artikel: '29'
        hoofdstuk: '4'
        afdeling: '1'
  - number: '35.1'
    text: |-
      Het bestuur van het gerecht neemt in zijn jaarplan met betrekking tot de in het werklastmetingssysteem begrepen
      zaken een raming op van de in het begrotingsjaar en de vier daarop volgende jaren door het gerecht af te handelen
      zaken, uitgesplitst naar zaaks- en gerechtscategorie.
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel35
  - number: '35.2'
    text: |-
      [Artikel 18][ref1] is van overeenkomstige toepassing, met dien verstande dat in het tweede en derde lid «de Raad»
      wordt vervangen door: het bestuur van het gerecht.


      [ref1]: https://wetten.overheid.nl/BWBR0013886#Artikel18
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0013886
        artikel: '18'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '5'
  - number: '36'
    text: |-
      Het bestuur van het gerecht neemt in zijn jaarplan met betrekking tot de in bijlage 2 opgenomen zaken en
      werkzaamheden een raming op van het budget dat in het begrotingsjaar en de vier daarop volgende jaren benodigd is
      voor afhandeling daarvan.
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel36
  - number: '37'
    text: |-
      Het bestuur van het gerecht neemt in zijn jaarplan een raming op van de in het begrotingsjaar verwachte uitgaven
      van het gerecht aan gerechtskosten in civiele en bestuursrechtelijke zaken, alsmede in de vier daarop volgende
      jaren.
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel37
  - number: 37_bis
    text: |-
      Het bestuur van het gerecht maakt in zijn jaarplan een onderscheid tussen aantallen en categorieën van af te
      handelen zaken van het gerecht en aantallen en categorieën van af te handelen zaken als nevenzittingsplaats voor
      een ander gerecht. Tevens geeft het bestuur van een gerecht aan de aantallen en categoreiën van zaken die in een
      nevenzittingsplaats buiten het rechtsgebied worden behandeld.
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel37
  - number: '38'
    text: |-
      Het bestuur van het gerecht voegt verzoeken als bedoeld in [artikel 31, eerste lid][ref1], als bijlage bij het
      jaarplan.


      [ref1]: https://wetten.overheid.nl/BWBR0013886#Artikel31
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0013886
        artikel: '31'
        hoofdstuk: '4'
        afdeling: '2'
  - number: '39'
    text: Het door de Raad en de gerechten toe te passen begrotingsstelsel is het geïntegreerd kas-verplichtingenstelsel.
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel39
  - number: '40.1'
    text: |-
      De indeling en de inrichting van het verslag van de Raad, bedoeld in [artikel 104][ref1], onderscheidenlijk van
      het bestuur van het gerecht, bedoeld in [artikel 35][ref2], volgt de indeling en inrichting van de begroting van de
      Raad onderscheidenlijk van het jaarplan van het gerecht.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel104
      [ref2]: https://wetten.overheid.nl/BWBR0013886#Artikel35
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0001830
        artikel: '104'
      - id: ref2
        bwb_id: BWBR0013886
        artikel: '35'
        hoofdstuk: '4'
        afdeling: '5'
  - number: '40.2'
    text: |-
      Bij het verslag van de Raad onderscheidenlijk het bestuur van een gerecht, bedoeld in het eerste lid, dat
      betrekking heeft op de besteding van het algemene budget wordt aangegeven welke aantallen en categorieën van
      zaken van het gerecht zijn afgehandeld, welke aantallen en categorieën van zaken als nevenzittingsplaats van een
      ander gerecht zijn afgehandeld en welke aantallen en categorieën van zaken in een nevenzittingsplaats buiten het
      rechtsgebied zijn afgehandeld.
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel40
  - number: '41'
    text: De door de gerechten te maken gerechtskosten in strafzaken komen ten laste van het College van procureurs-generaal.
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel41
  - number: '42'
    text: Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel42
  - number: '43'
    text: 'Dit besluit wordt aangehaald als: Besluit financiering rechtspraak.'
    url: https://wetten.overheid.nl/BWBR0013886/2004-07-01#Artikel43
