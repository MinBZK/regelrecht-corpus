---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht-mvp/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_randapparaten_en_radioapparaten
regulatory_layer: AMVB
publication_date: '2007-01-18'
valid_from: '2004-05-19'
bwb_id: BWBR0011261
url: https://wetten.overheid.nl/BWBR0011261/2004-05-19
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Verkeer en Waterstaat van 1 september 1999, nr. DGTP/99/2235/NG,
    Directoraat-Generaal Telecommunicatie en Post;

    Gelet op richtlijn nr. 1999/5/EG van het Europees Parlement en de Raad van de Europese Unie van 9 maart 1999
    betreffende radioapparatuur en telecommunicatie-eindapparatuur en de wederzijdse erkenning van hun conformiteit
    (PbEG L 91) en op artikel 3, tweede lid en de sectorbijlage betreffende radioapparatuur en telecommunicatie-
    eindapparatuur van de Overeenkomst inzake wederzijdse erkenning tussen de Europese Gemeenschap en de Verenigde
    Staten van Amerika (PbEG 1999, L 31), artikel 2, derde lid en de sectorbijlage betreffende radioapparatuur en
    telecommunicatie-eindapparatuur van de Overeenkomst inzake wederzijdse erkenning tussen de Europese Gemeenschap
    en Canada (PbEG 1998, L 280), artikel 2, tweede lid en de sectorbijlage betreffende radioapparatuur en
    telecommunicatie-eindapparatuur van de Overeenkomst inzake wederzijdse erkenning van overeenstemmingsbeoordeling,
    certificaten en markeringen tussen de Europese Gemeenschap en Australië (PbEG 1998, L 229) en artikel 2, tweede lid
    en de sectorbijlage betreffende radioapparatuur en telecommunicatie-eindapparatuur van de Overeenkomst inzake de
    wederzijdse erkenning van overeenstemmingsbeoordeling tussen de Europese Gemeenschap en Nieuw-Zeeland (PbEG 1998,
    L 229) en op de artikelen 7.1, eerste lid, 10.1, 10.2, 10.3, tweede lid, 10.4, 10.6, 10.11en 10.15, onderdeel b,
    van de Telecommunicatiewet;

    De Raad van State gehoord (advies van 7 december 1999, nr. W09.99.0470/V);

    Gezien het nader rapport van de Staatssecretaris van Verkeer en Waterstaat van 27 maart 2000, nr. DGTP/00/1438/NG,
    Directoraat-Generaal Telecommunicatie en Post;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0011261/2004-05-19#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0011261/2004-05-19#Artikel1
  - number: 1.a
    text: |-
      wet: [Telecommunicatiewet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009950
    url: https://wetten.overheid.nl/BWBR0011261/2004-05-19#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009950
  - number: 1.b
    text: |-
      [richtlijn nr. 1999/5/EG](31999L0005): [richtlijn nr. 1999/5/EG](31999L0005) van het Europees Parlement en de
      Raad van de Europese Unie van 9 maart 1999 betreffende radioapparatuur en telecommunicatie-eindapparatuur en de
      wederzijdse erkenning van hun conformiteit (PbEG L 91);
    url: https://wetten.overheid.nl/BWBR0011261/2004-05-19#Artikel1
  - number: 1.c
    text: |-
      [richtlijn nr. 73/23/EEG](31973L0023): [richtlijn nr. 73/23/EEG](31973L0023) van de Raad van de Europese
      Gemeenschappen van 19 februari 1973 betreffende de onderlinge aanpassing van de wettelijke voorschriften der Lid-
      Staten inzake elektrisch materiaal bestemd voor gebruik binnen bepaalde spanningsgrenzen (PbEG L 77);
    url: https://wetten.overheid.nl/BWBR0011261/2004-05-19#Artikel1
  - number: 1.d
    text: |-
      [richtlijn nr. 89/336/EEG](31989L0336): [richtlijn nr. 89/336/EEG](31989L0336) van de Raad van de Europese
      Gemeenschappen van 3 mei 1989 betreffende de onderlinge aanpassing van de wetgevingen van de Lid-Staten inzake
      elektromagnetische compatibiliteit (PbEG L 139);
    url: https://wetten.overheid.nl/BWBR0011261/2004-05-19#Artikel1
  - number: 1.e
    text: |-
      [richtlijn nr. 98/13/EG](31998L0013): [richtlijn nr. 98/13/EG](31998L0013) van het Europees Parlement en de Raad
      van de Europese Unie van 12 februari 1998 betreffende eindapparatuur voor telecommunicatie en apparatuur voor
      satelliet-grondstations alsmede inzake de onderlinge erkenning van de conformiteit van die apparatuur (PbEG L 74),
      naar de tekst zoals deze bij die richtlijn is vastgesteld;
    url: https://wetten.overheid.nl/BWBR0011261/2004-05-19#Artikel1
  - number: 1.f
    text: |-
      radioapparaten: radiozendapparaten en apparaten die naar hun aard bestemd zijn voor het ontvangen van
      radiocommunicatiesignalen;
    url: https://wetten.overheid.nl/BWBR0011261/2004-05-19#Artikel1
  - number: 1.g
    text: |-
      geharmoniseerde norm: technische specificatie die door een erkende normalisatie-instelling, in opdracht van
      de Commissie van de Europese Gemeenschappen en in overeenstemming met de procedures van [richtlijn nr. 98/34/
      EG](31998L0034) van het Europees Parlement en de Raad van de Europese Unie van 22 juni 1998 betreffende de
      informatieprocedure op het gebied van normen en technische voorschriften (PbEG L 204), is goedgekeurd;
    url: https://wetten.overheid.nl/BWBR0011261/2004-05-19#Artikel1
  - number: 1.h
    text: 'lidstaat: staat die lid is van de Europese Unie;'
    url: https://wetten.overheid.nl/BWBR0011261/2004-05-19#Artikel1
  - number: 1.i
    text: 'derde land: land dat partij is bij een bij ministeriële regeling genoemde overeenkomst;'
    url: https://wetten.overheid.nl/BWBR0011261/2004-05-19#Artikel1
  - number: 1.j
    text: |-
      aangemelde instantie: instantie die door een lidstaat dan wel die in het kader van een bij ministeriële regeling
      genoemde overeenkomst door de aanwijzende autoriteit van een derde land is aangewezen voor het uitvoeren van de in
      [artikel 10][ref1] van [richtlijn nr. 1999/5/EG](31999L0005) bedoelde conformiteitsbeoordelingsprocedures;


      [ref1]: https://wetten.overheid.nl/BWBR0011261#Artikel10
    url: https://wetten.overheid.nl/BWBR0011261/2004-05-19#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0011261
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 1.k
    text: |-
      verklaring van conformiteit: document waarin degene die randapparaten of radioapparaten in de handel brengt,
      verklaart dat die apparaten voldoen aan het bij of krachtens dit besluit bepaalde;
    url: https://wetten.overheid.nl/BWBR0011261/2004-05-19#Artikel1
  - number: 1.l
    text: |-
      schadelijke interferentie: interferentie die het functioneren van een radionavigatiedienst of van andere
      veiligheidsdiensten in gevaar brengt, of die een overeenkomstig de van toepassing zijnde communautaire of
      nationale voorschriften werkende radiocommunicatiedienst op een andere wijze ernstig doet achteruitgaan, hindert of
      herhaaldelijk onderbreekt.
    url: https://wetten.overheid.nl/BWBR0011261/2004-05-19#Artikel1
  - number: '2.1'
    text: |-
      Het bij of krachtens dit besluit bepaalde is van toepassing in de staten die partij zijn bij de Overeenkomst
      betreffende de Europese Economische Ruimte, niet zijnde lidstaten, vanaf het tijdstip waarop [richtlijn nr. 1999/5/
      EG](31999L0005) ingevolge een besluit van het Gemengd Comité van de EER in de Europese Economische Ruimte van
      kracht is.
    url: https://wetten.overheid.nl/BWBR0011261/2004-05-19#Artikel2
  - number: '2.2'
    text: Onze Minister doet mededeling in de Staatscourant van het in het eerste lid bedoelde tijdstip.
    url: https://wetten.overheid.nl/BWBR0011261/2004-05-19#Artikel2
  - number: '3'
    text: 'Het bij of krachtens dit besluit bepaalde is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0011261/2004-05-19#Artikel3
  - number: 3.a
    text: de randapparaten of radioapparaten, genoemd in bijlage I van [richtlijn nr. 1999/5/EG](31999L0005), en
    url: https://wetten.overheid.nl/BWBR0011261/2004-05-19#Artikel3
  - number: 3.b
    text: |-
      randapparaten of radioapparaten die uitsluitend worden gebruikt bij activiteiten die betrekking hebben op de
      openbare veiligheid, defensie, de staatsveiligheid en bij de activiteiten van de staat op gebieden die onder het
      strafrecht vallen.
    url: https://wetten.overheid.nl/BWBR0011261/2004-05-19#Artikel3
  - number: '4'
    text: |-
      De verplichtingen die bij of krachtens dit besluit worden opgelegd aan degene die randapparaten of radioapparaten
      in de handel brengt en aan degene die het voornemen heeft om radioapparaten, die in frequentiebanden worden
      gebruikt waarvan het gebruik niet in de gehele Europese Unie is geharmoniseerd, in Nederland in de handel te
      brengen, gelden tevens voor de in de Nederland gevestigde vertegenwoordigers van deze personen.
    url: https://wetten.overheid.nl/BWBR0011261/2004-05-19#Artikel4
  - number: '5.1'
    text: |-
      Degene die het voornemen heeft om radioapparaten, die in frequentiebanden worden gebruikt waarvan het gebruik niet
      in de gehele Europese Unie is geharmoniseerd, in Nederland in de handel te brengen, stelt Onze Minister ten minste
      vier weken voordat de apparaten in Nederland in de handel worden gebracht in kennis van dit voornemen.
    url: https://wetten.overheid.nl/BWBR0011261/2004-05-19#Artikel5
  - number: '5.2'
    text: |-
      Bij de kennisgeving, bedoeld in het eerste lid, wordt aan Onze Minister informatie verschaft inzake de
      radiokenmerken van de radioapparaten en wordt, indien bij de conformiteitsbeoordelingsprocedures, bedoeld in
      [artikel 8][ref1], een aangemelde instantie is betrokken, het identificatienummer van deze aangemelde instantie
      verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0011261#Artikel8
    url: https://wetten.overheid.nl/BWBR0011261/2004-05-19#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0011261
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '5.3'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld inzake de wijze waarop de in het eerste lid bedoelde
      kennisgeving geschiedt en de informatie die hierbij wordt verschaft.
    url: https://wetten.overheid.nl/BWBR0011261/2004-05-19#Artikel5
  - number: '6.1'
    text: |-
      Randapparaten en radioapparaten voldoen aan de voorschriften, bedoeld in artikel 3, eerste lid, van [richtlijn nr.
      1999/5/EG](31999L0005), te weten:
    url: https://wetten.overheid.nl/BWBR0011261/2004-05-19#Artikel6
  - number: 6.1.a
    text: |-
      de bescherming van de gezondheid of de veiligheid van de gebruiker of van anderen, met inbegrip van de
      doelstellingen met betrekking tot de veiligheidsvoorschriften van [richtlijn nr. 73/23/EEG](31973L0023), echter
      zonder toepassing van de spanningsgrens, en
    url: https://wetten.overheid.nl/BWBR0011261/2004-05-19#Artikel6
  - number: 6.1.b
    text: |-
      de elektromagnetische compatibiliteit van [richtlijn nr. 89/336/EEG](31989L0336), voor zover deze relevant zijn
      voor randapparaten of radioapparaten.
    url: https://wetten.overheid.nl/BWBR0011261/2004-05-19#Artikel6
  - number: '6.2'
    text: |-
      Onverminderd het eerste lid, voldoen radioapparaten aan artikel 3, tweede lid, van [richtlijn nr. 1999/5/EG]
      (31999L0005).
    url: https://wetten.overheid.nl/BWBR0011261/2004-05-19#Artikel6
  - number: '6.3'
    text: |-
      Indien op grond van artikel 3, derde lid, van [richtlijn nr. 1999/5/EG](31999L0005) voorschriften worden
      gesteld, worden ter uitvoering daarvan bij ministeriële regeling regels gesteld inzake die voorschriften waaraan
      randapparaten of radioapparaten dan wel categorieën of soorten daarvan, onverminderd het eerste en tweede lid,
      voldoen.
    url: https://wetten.overheid.nl/BWBR0011261/2004-05-19#Artikel6
  - number: '7.1'
    text: |-
      Randapparaten en radioapparaten worden vermoed aan een of meer voorschriften, bedoeld in [artikel 6][ref1] te
      voldoen, indien blijkens een van de in [artikel 8][ref2] bedoelde conformiteitsbeoordelingsprocedures is voldaan
      aan de krachtens [richtlijn nr. 1999/5/EG](31999L0005) vastgestelde geharmoniseerde normen of delen daarvan, die
      betrekking hebben op de desbetreffende voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0011261#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0011261#Artikel8
    url: https://wetten.overheid.nl/BWBR0011261/2004-05-19#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0011261
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0011261
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '7.2'
    text: |-
      Naast de mogelijkheid, bedoeld in het eerste lid, worden randapparaten en radioapparaten eveneens vermoed aan de
      voorschriften, bedoeld in [artikel 6, eerste lid, onderdeel a, onderscheidenlijk onderdeel b][ref1], te voldoen,
      indien blijkens een van de in [artikel 8][ref2] bedoelde conformiteitsbeoordelingsprocedures is voldaan aan
      de krachtens [richtlijn nr. 73/23/EEG](31973L0023), onderscheidenlijk [richtlijn nr. 89/336/EEG](31989L0336)
      vastgestelde geharmoniseerde normen of delen daarvan, die betrekking hebben op de desbetreffende voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0011261#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0011261#Artikel8
    url: https://wetten.overheid.nl/BWBR0011261/2004-05-19#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0011261
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0011261
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '7.3'
    text: |-
      Naast de mogelijkheid, bedoeld in het eerste lid, worden randapparaten eveneens vermoed aan de voorschriften,
      bedoeld in [artikel 6, tweede en derde lid][ref1], te voldoen, indien blijkens een van de in [artikel 8][ref2]
      bedoelde conformiteitsbeoordelingsprocedures is voldaan aan de krachtens [richtlijn nr. 98/13/EG](31998L0013)
      vastgestelde gemeenschappelijke technische voorschriften dan wel delen daarvan, die betrekking hebben op de
      desbetreffende voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0011261#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0011261#Artikel8
    url: https://wetten.overheid.nl/BWBR0011261/2004-05-19#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0011261
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0011261
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '7.4'
    text: |-
      Van een vermoeden van overeenstemming als bedoeld in het eerste tot en met het derde lid is slechts sprake indien
      de referentienummers van de bij de conformiteitsbeoordelingsprocedure gehanteerde geharmoniseerde normen of
      gemeenschappelijke technische voorschriften gepubliceerd zijn in het Publicatieblad van de Europese Gemeenschappen
      en deze normen of voorschriften van kracht zijn.
    url: https://wetten.overheid.nl/BWBR0011261/2004-05-19#Artikel7
  - number: '8.1'
    text: |-
      Degene die randapparaten die geen gebruik maken van de frequentieruimte, apparaten die naar hun aard bestemd zijn
      voor het ontvangen van radiocommunicatiesignalen of ontvangende delen van radiozendapparaten in de handel brengt,
      onderwerpt deze apparaten naar keuze aan de in bijlage II, IV of V van [richtlijn nr. 1999/5/EG](31999L0005)
      beschreven conformiteitsbeoordelingsprocedures om vast te stellen of deze apparaten aan de voorschriften, bedoeld
      in [artikel 6][ref1], voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0011261#Artikel6
    url: https://wetten.overheid.nl/BWBR0011261/2004-05-19#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0011261
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '8.2'
    text: |-
      Degene die andere dan de in het eerste lid bedoelde radioapparaten in de handel brengt en de van toepassing zijnde
      geharmoniseerde normen, bedoeld in [artikel 7][ref1], heeft toegepast, onderwerpt deze apparaten naar keuze aan de
      in bijlage III, IV of V van [richtlijn nr. 1999/5/EG](31999L0005) beschreven conformiteitsbeoordelingsprocedures om
      vast te stellen of deze apparaten aan de voorschriften, bedoeld in [artikel 6][ref2], voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0011261#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0011261#Artikel6
    url: https://wetten.overheid.nl/BWBR0011261/2004-05-19#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0011261
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0011261
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '8.3'
    text: |-
      Degene die andere dan de in het eerste lid bedoelde radioapparaten in de handel brengt en de van toepassing zijnde
      geharmoniseerde normen, bedoeld in [artikel 7][ref1], niet of slechts gedeeltelijk heeft toegepast, onderwerpt
      deze apparaten naar keuze aan de in de bijlage IV of V van [richtlijn nr. 1999/5/EG](31999L0005) beschreven
      conformiteitsbeoordelingsprocedures om vast te stellen of deze apparaten aan de voorschriften, bedoeld in
      [artikel 6][ref2], voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0011261#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0011261#Artikel6
    url: https://wetten.overheid.nl/BWBR0011261/2004-05-19#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0011261
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0011261
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '8.4'
    text: |-
      In afwijking van het eerste tot en met het derde lid, kan degene die randapparaten of radioapparaten in
      de handel brengt de conformiteitsbeoordelingsprocedures, bedoeld in bijlage III, paragraaf B, en bijlage
      IV van [richtlijn nr. 73/23/EEG](31973L0023) of de conformiteitsbeoordelingsprocedures, bedoeld in
      [artikel 10, eerste lid][ref1], [artikel 10, tweede lid][ref2], en bijlage I, van [richtlijn nr. 89/336/
      EEG](31989L0336) toepassen, om vast te stellen of deze apparaten aan de voorschriften, bedoeld in
      [artikel 6, eerste lid, onderdeel a, onderscheidenlijk onderdeel b][ref3], voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0011261#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0011261#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0011261#Artikel6
    url: https://wetten.overheid.nl/BWBR0011261/2004-05-19#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0011261
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0011261
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0011261
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '8.5'
    text: |-
      De stukken die betrekking hebben op de in het eerste tot en met het vierde lid bedoelde
      conformiteitsbeoordelingsprocedures zijn gesteld in een officiële taal van de lidstaat waar de
      conformiteitsbeoordelingsprocedure plaatsvindt of in een taal die door de bij de conformiteitsbeoordelingsprocedure
      betrokken aangemelde instantie wordt aanvaard.
    url: https://wetten.overheid.nl/BWBR0011261/2004-05-19#Artikel8
  - number: '9'
    text: |-
      Degene die randapparaten of radioapparaten in de handel brengt, voldoet aan de uit de bijlagen II tot en met V van
      [richtlijn nr. 1999/5/EG](31999L0005) voortvloeiende verplichtingen.
    url: https://wetten.overheid.nl/BWBR0011261/2004-05-19#Artikel9
  - number: '10.1'
    text: |-
      Bij de in [artikel 8][ref1] bedoelde conformiteitsbeoordelingsprocedures kan degene die randapparaten of
      radioapparaten in de handel brengt een aangemelde instantie in een lidstaat inschakelen, mits deze instantie voor
      de desbetreffende procedure of het desbetreffende onderdeel daarvan bij de Commissie van de Europese Gemeenschappen
      is aangemeld op grond van artikel 11, eerste lid, van [richtlijn nr. 1999/5/EG](31999L0005).


      [ref1]: https://wetten.overheid.nl/BWBR0011261#Artikel8
    url: https://wetten.overheid.nl/BWBR0011261/2004-05-19#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0011261
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '10.2'
    text: |-
      In afwijking van het eerste lid kan degene die randapparaten of radioapparaten in de Europese Unie in de handel
      brengt een aangemelde instantie in een derde land inschakelen, mits deze aangemelde instantie is vermeld in de
      sectorbijlage betreffende radioapparatuur en telecommunicatie-eindapparatuur behorend bij een bij ministeriële
      regeling genoemde overeenkomst, de aanwijzing van de instantie op grond van deze overeenkomst niet is geschorst en
      de Europese Gemeenschap haar uit deze overeenkomst voortvloeiende verplichtingen niet geheel of gedeeltelijk heeft
      opgeschort.
    url: https://wetten.overheid.nl/BWBR0011261/2004-05-19#Artikel10
  - number: '11.1'
    text: |-
      Ter bekrachtiging dat randapparaten of radioapparaten aan de voorschriften, bedoeld in [artikel 6][ref1] voldoen,
      stelt degene die deze apparaten in de handel brengt een verklaring van conformiteit op en brengt hij op elk
      apparaat, op de eventuele verpakking hiervan en op de documenten met betrekking tot de apparaten, een door Onze
      Minister aan te wijzen markering aan.


      [ref1]: https://wetten.overheid.nl/BWBR0011261#Artikel6
    url: https://wetten.overheid.nl/BWBR0011261/2004-05-19#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0011261
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '11.2'
    text: |-
      Onverminderd het eerste lid wordt op radioapparaten, in bij ministeriële regeling te bepalen gevallen, een door
      Onze Minister aan te wijzen markering aangebracht ter aanduiding van de categorie waartoe deze radioapparaten
      behoren.
    url: https://wetten.overheid.nl/BWBR0011261/2004-05-19#Artikel11
  - number: '11.3'
    text: |-
      Onverminderd het eerste en tweede lid wordt op radioapparaten die gebruikt worden in frequentiebanden waarvan
      het gebruik niet in de gehele Europese Unie is geharmoniseerd, een door Onze Minister aan te wijzen markering
      aangebracht.
    url: https://wetten.overheid.nl/BWBR0011261/2004-05-19#Artikel11
  - number: '11.4'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld inzake de afmeting en de grafische vorm van de in het
      eerste, tweede en derde lid bedoelde markeringen, de aanvullende aanduidingen bij deze markeringen, de wijze waarop
      deze markeringen wordt aangebracht en omtrent de zichtbaarheid, leesbaarheid en herkenbaarheid hiervan.
    url: https://wetten.overheid.nl/BWBR0011261/2004-05-19#Artikel11
  - number: '12.1'
    text: |-
      Onze Minister wijst een instantie aan voor de uitvoering van de taken die met de in [artikel 8][ref1] bedoelde
      conformiteitsbeoordelingsprocedures samenhangen, indien uit de aanvraag tot aanwijzing volgt, dat de instantie
      blijkens accreditatie aantoonbaar voldoet aan de norm NEN-EN 45011 of de norm NEN-EN 45012.


      [ref1]: https://wetten.overheid.nl/BWBR0011261#Artikel8
    url: https://wetten.overheid.nl/BWBR0011261/2004-05-19#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0011261
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '12.2'
    text: |-
      Onze Minister kan de aanwijzing beperken tot daarbij te omschrijven categorieën van randapparaten of radioapparaten
      of conformiteitsbeoordelingsprocedures, dan wel onderdelen hiervan.
    url: https://wetten.overheid.nl/BWBR0011261/2004-05-19#Artikel12
  - number: '13'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over de wijze waarop een aanvraag tot aanwijzing als bedoeld
      in [artikel 12][ref1] moet worden ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0011261#Artikel12
    url: https://wetten.overheid.nl/BWBR0011261/2004-05-19#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0011261
        artikel: '12'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: '14.1'
    text: |-
      Degene die randapparaten of radioapparaten in de handel brengt, verstrekt aan de gebruiker een afschrift van de
      verklaring van conformiteit en informatie over het gebruik waarvoor deze apparaten bestemd zijn, met dien verstande
      dat:
    url: https://wetten.overheid.nl/BWBR0011261/2004-05-19#Artikel14
  - number: 14.1.a
    text: |-
      indien het radioapparaten betreft, de verpakking of de gebruiksaanwijzing informatie bevat waaruit blijkt voor
      het gebruik in welke lidstaat of in welk geografisch grondgebied binnen een lidstaat deze radioapparaten bedoeld
      zijn en de gebruiker door de op het apparaat aangebrachte markering als bedoeld in [artikel 11, derde lid][ref1],
      geattendeerd wordt op voorschriften inzake het gebruik van deze radioapparaten in bepaalde lidstaten;


      [ref1]: https://wetten.overheid.nl/BWBR0011261#Artikel11
    url: https://wetten.overheid.nl/BWBR0011261/2004-05-19#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0011261
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 14.1.b
    text: |-
      indien het randapparaten betreft, op alle apparaten duidelijk zichtbaar informatie is aangebracht waaruit blijkt
      voor welke netwerkaansluitpunten van openbare telecommunicatienetwerken deze randapparaten zijn bestemd.
    url: https://wetten.overheid.nl/BWBR0011261/2004-05-19#Artikel14
  - number: '14.2'
    text: |-
      Degene die randapparaten of radioapparaten in de handel brengt, draagt er zorg voor dat op de apparaten zijn naam
      of de naam van de fabrikant is aangebracht alsmede een type-, partij- of serienummer, waardoor het mogelijk is hem
      of de fabrikant te identificeren.
    url: https://wetten.overheid.nl/BWBR0011261/2004-05-19#Artikel14
  - number: '14.3'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld inzake de informatie die in de documenten met betrekking tot
      de randapparaten of radioapparaten moet zijn opgenomen.
    url: https://wetten.overheid.nl/BWBR0011261/2004-05-19#Artikel14
  - number: '15.1'
    text: |-
      Een aanbieder van een openbaar telecommunicatienetwerk verschaft het college informatie over de technische
      specificaties van de netwerkaansluitpunten en maakt deze informatie op genoegzame wijze bekend, voordat via deze
      netwerkaansluitpunten diensten aan het publiek beschikbaar worden gesteld.
    url: https://wetten.overheid.nl/BWBR0011261/2004-05-19#Artikel15
  - number: '15.2'
    text: |-
      De in het eerste lid bedoelde technische specificaties moeten nauwkeurig genoeg zijn om randapparaten te kunnen
      ontwerpen waarmee alle via het netwerkaansluitpunt verstrekte diensten kunnen worden gebruikt en moeten in elk
      geval alle informatie bevatten die de fabrikanten in staat stellen naar keuze de relevante tests uit te voeren om
      vast te stellen of de randapparaten voldoen aan de voorschriften, bedoeld in [artikel 6][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011261#Artikel6
    url: https://wetten.overheid.nl/BWBR0011261/2004-05-19#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0011261
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '15.3'
    text: |-
      Een aanbieder van een openbaar telecommunicatienetwerk draagt er zorg voor dat wijzigingen in de informatie,
      bedoeld in het eerste lid, ten minste twee maanden voor de datum waarop die wijzigingen ingaan, bij het college
      bekend zijn en op genoegzame wijze bekend zijn gemaakt.
    url: https://wetten.overheid.nl/BWBR0011261/2004-05-19#Artikel15
  - number: '15.4'
    text: |-
      Een aanbieder van een openbaar telecommunicatienetwerk doet van de wijze van bekendmaking, bedoeld in het eerste en
      derde lid, mededeling in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0011261/2004-05-19#Artikel15
  - number: '16'
    text: |-
      Een aanbieder van een openbaar telecommunicatienetwerk zorgt er voor dat randapparaten die voldoen aan de
      voorschriften, bedoeld in [artikel 6][ref1], op daartoe geschikte netwerkaansluitpunten kunnen worden aangesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0011261#Artikel6
    url: https://wetten.overheid.nl/BWBR0011261/2004-05-19#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0011261
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '17'
    text: |-
      In afwijking van [artikel 16][ref1] is een aanbieder van een openbaar telecommunicatienetwerk gerechtigd om
      randapparaten die voldoen aan de voorschriften, bedoeld in [artikel 6][ref2], niet aan te sluiten of af te sluiten
      dan wel buiten gebruik te stellen indien deze apparaten ernstige schade toebrengen aan een telecommunicatienetwerk,
      schadelijke interferentie veroorzaken of het telecommunicatienetwerk of de werking daarvan schaden, mits hij
      hiertoe voorafgaande toestemming heeft van het college.


      [ref1]: https://wetten.overheid.nl/BWBR0011261#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0011261#Artikel6
    url: https://wetten.overheid.nl/BWBR0011261/2004-05-19#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0011261
        artikel: '16'
        hoofdstuk: '2'
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0011261
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '18.1'
    text: |-
      In afwijking van de [artikelen 16][ref1] en [17][ref2] is een aanbieder van een openbaar telecommunicatienetwerk
      gerechtigd randapparaten af te sluiten, indien dit in verband met de bescherming van het telecommunicatienetwerk
      onmiddellijk dient te geschieden en biedt de gebruiker van het telecommunicatienetwerk direct, en zonder daarvoor
      kosten in rekening te brengen, een alternatieve voorziening.


      [ref1]: https://wetten.overheid.nl/BWBR0011261#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0011261#Artikel17
    url: https://wetten.overheid.nl/BWBR0011261/2004-05-19#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0011261
        artikel: '16'
        hoofdstuk: '2'
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0011261
        artikel: '17'
        hoofdstuk: '2'
        paragraaf: '6'
  - number: '18.2'
    text: |-
      De aanbieder, bedoeld in het eerste lid, doet onmiddellijk mededeling aan het college van het feit dat de
      randapparaten zijn afgesloten.
    url: https://wetten.overheid.nl/BWBR0011261/2004-05-19#Artikel18
  - number: '19.1'
    text: |-
      Indien wordt geconstateerd, dat randapparaten of radioapparaten niet voldoen aan de in [artikel 6][ref1] bedoelde
      voorschriften, kan Onze Minister deze apparaten uit de handel nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0011261#Artikel6
    url: https://wetten.overheid.nl/BWBR0011261/2004-05-19#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0011261
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '19.2'
    text: |-
      Indien wordt geconstateerd, dat een in de handel gebracht randapparaat of radioapparaat niet voldoet aan de in
      [artikel 6][ref1] bedoelde voorschriften ondanks de aanwezigheid van de in [artikel 11, eerste lid][ref2], bedoelde
      markering en van een afschrift van de verklaring van conformiteit, wordt hiervan schriftelijk mededeling gedaan aan
      de betrokkene.


      [ref1]: https://wetten.overheid.nl/BWBR0011261#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0011261#Artikel11
    url: https://wetten.overheid.nl/BWBR0011261/2004-05-19#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0011261
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0011261
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '19.3'
    text: Onze Minister maakt de constatering, bedoeld in het tweede lid, zo spoedig mogelijk bekend in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0011261/2004-05-19#Artikel19
  - number: '19.4'
    text: |-
      Met ingang van de dag na de datum van bekendmaking is het verboden de randapparaten of radioapparaten van dit type
      te verhandelen.
    url: https://wetten.overheid.nl/BWBR0011261/2004-05-19#Artikel19
  - number: '20.1'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld ten aanzien van de vakbekwaamheid voor het beroeps- of
      bedrijfsmatig aanleggen en onderhouden van randapparaten.
    url: https://wetten.overheid.nl/BWBR0011261/2004-05-19#Artikel20
  - number: '20.2'
    text: 'Deze regels betreffen in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0011261/2004-05-19#Artikel20
  - number: 20.2.a
    text: de erkenning van diploma's;
    url: https://wetten.overheid.nl/BWBR0011261/2004-05-19#Artikel20
  - number: 20.2.b
    text: de erkenning van vakopleidingen voor het beroeps- of bedrijfsmatig aanleggen en onderhouden van randapparaten.
    url: https://wetten.overheid.nl/BWBR0011261/2004-05-19#Artikel20
  - number: '21'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld inzake de behandeling van klachten over belemmeringen welke
      bij het gebruik van radiozendapparaten worden ondervonden.
    url: https://wetten.overheid.nl/BWBR0011261/2004-05-19#Artikel21
  - number: '22'
    text: |-
      Het is verboden handelsreclame te maken voor randapparaten of radioapparaten waarvan het in de handel brengen of
      het verhandelen op grond van [artikel 10.5 van de wet][ref1] is verboden.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel10
    url: https://wetten.overheid.nl/BWBR0011261/2004-05-19#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '10'
  - number: '23'
    text: |-
      Voor de toepassing van [paragraaf 10.2.3 van de wet][ref1] worden met radiozendapparaten gelijkgesteld
      radiofrequentvermogensversterkers die geschikt zijn voor gebruik tezamen met radiozendapparaten alsmede andere
      elektrische of elektronische apparaten die geschikt zijn om het radiofrequent signaal van radiozendapparaten te
      wijzigen.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Paragraaf10.2.3
    url: https://wetten.overheid.nl/BWBR0011261/2004-05-19#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0009950
        paragraaf: 10.2.3
  - number: '26'
    text: |-
      Na de inwerkingtreding van dit besluit berust de Regeling storingsklachten op artikel 20 van het Besluit
      elektromagnetische compatibiliteit en op [artikel 21 van dit besluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011261#Artikel21
    url: https://wetten.overheid.nl/BWBR0011261/2004-05-19#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0011261
        artikel: '21'
        hoofdstuk: '5'
  - number: '27'
    text: |-
      Na de inwerkingtreding van dit besluit berust een aanwijzing door Onze Minister van een instantie als aangemelde
      instantie op grond van artikel 15 van het Besluit randapparatuur en apparatuur voor satellietgrondstations, op
      [artikel 12 van dit besluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011261#Artikel12
    url: https://wetten.overheid.nl/BWBR0011261/2004-05-19#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0011261
        artikel: '12'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: '28'
    text: |-
      Een wijziging van [richtlijn nr. 1999/5/EG](31999L0005), van [richtlijn nr. 98/34/EG](31998L0034) van het Europees
      Parlement en de Raad van de Europese Unie van 22 juni 1998 betreffende de informatieprocedure op het gebied van
      normen en technische voorschriften (PbEG L 204), van [richtlijn nr. 73/23/EEG](31973L0023) of van [richtlijn nr.
      89/336/EEG](31989L0336) gaat voor de toepassing van het onderhavige besluit gelden met ingang van de dag waarop
      aan de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven, tenzij bij ministerieel besluit, dat in de
      Staatscourant wordt bekendgemaakt, een ander tijdstip wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0011261/2004-05-19#Artikel28
  - number: '29'
    text: |-
      Het bij of krachtens dit besluit bepaalde is niet van toepassing op apparaten die vóór 8 april 2001
      overeenkomstig het bij of krachtens het Besluit randapparatuur en apparatuur voor satellietgrondstations bepaalde,
      onderscheidenlijk het bij of krachtens het Besluit radio-elektrische inrichtingen bepaalde, in de handel zijn
      gebracht.
    url: https://wetten.overheid.nl/BWBR0011261/2004-05-19#Artikel29
  - number: '30'
    text: |-
      Het Besluit radio-elektrische inrichtingen en het Besluit randapparatuur en apparatuur voor satellietgrondstations
      worden ingetrokken, met dien verstande dat het bij of krachtens deze besluiten bepaalde tot en met 7 april 2001 van
      toepassing blijft met betrekking tot de in [artikel 29][ref1] bedoelde apparaten.


      [ref1]: https://wetten.overheid.nl/BWBR0011261#Artikel29
    url: https://wetten.overheid.nl/BWBR0011261/2004-05-19#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0011261
        artikel: '29'
        hoofdstuk: '9'
  - number: '31'
    text: |-
      [Artikel 19, eerste lid][ref1], is met ingang van 8 april 2001 van overeenkomstige toepassing op apparaten, bedoeld
      in [artikel 29][ref2], indien deze niet of niet meer voldoen aan de voorschriften waaraan deze apparaten op grond
      van het bij of krachtens het Besluit radio-elektrische inrichtingen of het Besluit randapparatuur en apparatuur
      voor satellietgrondstations bepaalde moesten voldoen op het tijdstip dat zij in de handel zijn gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0011261#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0011261#Artikel29
    url: https://wetten.overheid.nl/BWBR0011261/2004-05-19#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0011261
        artikel: '19'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0011261
        artikel: '29'
        hoofdstuk: '9'
  - number: '32'
    text: Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0011261/2004-05-19#Artikel32
  - number: '33'
    text: 'Dit besluit wordt aangehaald als: Besluit randapparaten en radioapparaten.'
    url: https://wetten.overheid.nl/BWBR0011261/2004-05-19#Artikel33
