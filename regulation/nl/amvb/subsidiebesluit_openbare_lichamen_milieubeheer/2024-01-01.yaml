  - number: 6f
    text: |-
      Indien gedeputeerde staten blijkens een rapportage als bedoeld in [artikel 4, onder b ][ref1], de gegevens, bedoeld
      in [artikel 4d, eerste en tweede lid][ref2], niet of onvolledig hebben verstrekt aan het Interprovinciaal Overleg,
      of die rapportage op 1 oktober van het kalenderjaar waarin zij op 1 juli ontvangen had moeten zijn, niet ontvangen
      is, kan Onze Minister gedeputeerde staten verplichten uiterlijk op de eerstvolgende 1 februari te rapporteren over
      de voortgang van de afronding van de uitvoering van de saneringsprogramma's. Artikel 3m, tweede en derde lid, is
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004739#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0004739#Artikel4d
