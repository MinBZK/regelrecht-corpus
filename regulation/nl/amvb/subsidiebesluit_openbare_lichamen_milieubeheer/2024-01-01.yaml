  - number: '50'
    text: |-
      Indien de aanvraag tot subsidieverlening als bedoeld in [hoofdstuk 2][ref1] betrekking heeft op een activiteit die
      nog niet geheel is uitgevoerd, is de aanvrager verplicht zodra de activiteit is uitgevoerd of is stopgezet Onze
      Minister daarvan in kennis te stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0004739#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0004739/2024-01-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0004739
        hoofdstuk: '2'
  - number: '51'
    text: |-
      1 Onze Minister geeft de beschikking op de aanvraag tot verlening van subsidie als bedoeld in [hoofdstuk 2][ref1]
      binnen vijf maanden na de datum waarop de aanvraag is ontvangen.

      2 In de gevallen waarin de aanvraag, bedoeld in het eerste lid, betrekking heeft op een activiteit die is
      uitgevoerd, wordt een aanvraag tot verlening van subsidie geacht een aanvraag tot subsidievaststelling te zijn.
      Voorafgaand aan de subsidievaststelling wordt geen beschikking tot subsidieverlening gegeven.

      3 In de gevallen, bedoeld in [artikel 50][ref2], geeft Onze Minister de beschikking tot subsidievaststelling binnen
      vijf maanden na de ontvangst van de mededeling van de aanvrager dat de activiteit is uitgevoerd of stopgezet.


      [ref1]: https://wetten.overheid.nl/BWBR0004739#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0004739#Artikel50
    url: https://wetten.overheid.nl/BWBR0004739/2024-01-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0004739
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0004739
        artikel: '50'
        hoofdstuk: '3'
  - number: '52'
    text: |-
      1 De beschikking tot subsidieverlening bevat de verplichting voor de subsidie-ontvanger om mededeling te doen van
      gewijzigde omstandigheden die van belang kunnen zijn voor de uitvoering van de activiteit.

      2 Bij de beschikking tot subsidieverlening kunnen verplichtingen worden opgelegd, die:

      a. strekken tot verwezenlijking van het doel van de subsidie, of

      b. betrekking hebben op de wijze waarop of de middelen waarmee de gesubsidieerde activiteit wordt verricht.
    url: https://wetten.overheid.nl/BWBR0004739/2024-01-01#Artikel52
  - number: '55'
    text: |-
      In afwijking van [artikel 51, eerste lid][ref1], kan Onze Minister, in afwachting van een wijziging van het voor
      dat jaar vastgestelde subsidieplafond de beslissing op een subsidie-aanvraag geheel of gedeeltelijk aanhouden
      tot uiterlijk 15 december van het kalenderjaar waarin de subsidie is aangevraagd. Hij deelt de aanhouding aan de
      aanvrager mee.


      [ref1]: https://wetten.overheid.nl/BWBR0004739#Artikel51
    url: https://wetten.overheid.nl/BWBR0004739/2024-01-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0004739
        artikel: '51'
        hoofdstuk: '3'
  - number: '56'
    text: |-
      Indien Onze Minister toepassing heeft gegeven aan [artikel 55][ref1] geeft hij uiterlijk binnen acht weken na
      afloop van de aanhouding een beschikking op de aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0004739#Artikel55
