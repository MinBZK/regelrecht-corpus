      Onze Minister geeft aan het Interprovinciaal Overleg in het kalenderjaar 1994 een beschikking tot vaststelling van
      een bijdrage ten bedrage van € 453 780,22 ten behoeve van:

      a. een jaarlijkse rapportage vóór 1 juli in 1995, 1996, 1997 en 1998 over de voortgang bij de provincies van het
      akoestisch onderzoek met betrekking tot de in [artikel 3a, derde lid, onder b][ref1], bedoelde industrieterreinen,
      en

      b. een jaarlijkse rapportage vóór 1 juli in 1999, 2000, 2001, 2002, 2003, 2004, 2005, 2006, 2007 en 2008 over de
      voortgang van de uitvoering van de programma’s van maatregelen.


      [ref1]: https://wetten.overheid.nl/BWBR0004739#Artikel3a
