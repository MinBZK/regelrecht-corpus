  - number: 4b
    text: |-
      1 Indien een rapportage als bedoeld in [artikel 4, onder a][ref1], te laat of in het geheel niet over een
      kalenderjaar wordt toegezonden, dan wel niet is opgesteld overeenkomstig [artikel 4a, tweede lid][ref2], kan Onze
      Minister de beschikking tot vaststelling van de bijdrage, bedoeld in [artikel 4][ref3], geheel of gedeeltelijk
      intrekken. Onze Minister kan het betaalde bedrag geheel of gedeeltelijk terugvorderen.

      2 Onze Minister kent zo spoedig mogelijk na ontvangst van het teruggevorderde bedrag aan de provincie een twaalfde
      van dat bedrag toe.

      3 Indien het uitblijven van de rapportage mede het gevolg is van het niet of onvolledig verstrekken door
      gedeputeerde staten van gegevens aan het Interprovinciaal Overleg, kent Onze Minister dat de provincie waartoe
      gedeputeerde staten behoren geen gedeelte van het teruggevorderde bedrag toe. Hij verdeelt dan het teruggevorderde
      bedrag over de overige provincies.

      4 Het eerste, tweede en derde lid zijn van overeenkomstige toepassing indien een rapportage als bedoeld in
      [artikel 4, onder b][ref4], te laat of in het geheel niet in één van de in dat artikel, onder *b* , bedoelde
      kalenderjaren is ontvangen, dan wel die rapportage niet is opgesteld overeenkomstig de [artikelen 4a][ref5] en
      [4d][ref6].


