  - number: 6g
    text: |-
      1 In afwijking van [artikel 6][ref1], geeft Onze Minister in het vervolg geen ambtshalve beschikking tot
      subsidievaststelling indien:

      a. een aan gedeputeerde staten krachtens [artikel 6][ref2] opgelegde rapportage als bedoeld in
      [artikel 4, onder ][ref3], door hem op 1 februari niet ontvangen is, of

      b. blijkens de hem toegezonden rapportage gedeputeerde staten aan het Interprovinciaal Overleg niet of onvolledig
      de gevraagde gegevens hebben verstrekt.

      2 [Artikel 3][ref4], is van overeenkomstige toepassing.


