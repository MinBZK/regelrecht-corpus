        afdeling: '1'
  - number: 6e
    text: |-
      1 Indien uit de jaarlijkse rapportage, bedoeld in [artikel 4, onder b][ref1], in 1999, 2000, 2001,
      2002, 2003, 2004, 2005, 2006 of 2007 blijkt dat er nagenoeg geen kans is dat ten aanzien van alle in
      [artikel 4d , tweede lid, onder a][ref2], bedoelde saneringsprogramma’s de daarin genoemde maatregelen vóór
      1 januari 2008 zijn uitgevoerd, kan Onze Minister gedeputeerde staten de verplichting opleggen om op eigen kosten,
      met inachtneming van door Onze Minister te stellen richtlijnen, een onderzoek in te stellen naar de factoren die
      de oorzaak zijn van dit dreigend tekortschieten en de mogelijkheden deze weg te nemen, dan wel daarin verbetering
      te brengen.

      2 Onze Minister maakt uiterlijk binnen 12 weken na ontvangst van de rapportage gebruik van zijn bevoegdheid,
      bedoeld in het eerste lid, of van de hem toekomende bevoegdheden met betrekking tot de vastgestelde subsidie.


      [ref1]: https://wetten.overheid.nl/BWBR0004739#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0004739#Artikel4d
    url: https://wetten.overheid.nl/BWBR0004739/2024-01-01#Artikel6e
