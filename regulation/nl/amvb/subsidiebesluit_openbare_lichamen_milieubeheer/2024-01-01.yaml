    text: |-
      In deze afdeling en de daarop berustende bepalingen wordt verstaan onder:

      a. zone: zone die krachtens of met overeenkomstige toepassing van [artikel 53 van de Wet geluidhinder][ref1] of
      krachtens [artikel 59 van de Wet geluidhinder][ref2] is vastgesteld;

      b. programma van maatregelen: door gedeputeerde staten overeenkomstig
      [artikel 71, tweede, derde en vierde lid, van de Wet geluidhinder][ref3] opgesteld programma van maatregelen;

      c. fase II van het akoestisch onderzoek: het deel van het akoestisch onderzoek dat plaatsvindt met het oog op de
      door gedeputeerde staten te maken keuze uit de mogelijk te treffen maatregelen ter uitvoering van het programma
      van maatregelen;

      d. fase III van het akoestisch onderzoek: het deel van het akoestisch onderzoek dat plaatsvindt met het oog op
      de uitwerking van de keuze en de beschrijving van de mogelijkheden om de uitvoering van de gekozen maatregelen
      te faseren.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel59
      [ref3]: https://wetten.overheid.nl/BWBR0003227#Artikel71
