  - number: 6h
    text: |-
      1 Indien de informatie, bedoeld in [artikel 27, eerste lid van het Besluit financiële verhouding 2001][ref1], over
      het jaar waarin de beschikking tot subsidievaststelling, bedoeld in [artikel 6a, eerste lid][ref2], is genomen,
      niet vóór 15 september is toegezonden, doet Onze Minister daarvan binnen vier weken na het verstrijken van die
      termijn mededeling aan gedeputeerde staten.

      2 Onze Minister stelt bij de in het eerste lid bedoelde mededeling een termijn van ten hoogste acht weken binnen
      welke de ontbrekende informatie alsnog moet worden verstrekt.


