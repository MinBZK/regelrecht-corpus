  - number: '6'
    text: Voorafgaand aan de subsidievaststelling wordt geen beschikking tot subsidieverlening gegeven.
    url: https://wetten.overheid.nl/BWBR0004739/2024-01-01#Artikel6
  - number: 6a
    text: |-
      1 Onze Minister geeft aan het provinciaal bestuur jaarlijks in de kalenderjaren 1995 tot en met 2002 ambtshalve
      een beschikking tot subsidievaststelling terzake van de kosten van het terugbrengen, vóór 1 januari 2003, van
      de geluidsbelasting vanwege alle in de provincie gelegen industrieterreinen, voor zover deze voorkomen op de in
      [artikel 3][ref1] bedoelde lijst en het in [artikel 3b][ref2] bedoelde overzicht, van de binnen de zone rond die
      industrieterreinen gelegen woningen en andere geluidsgevoelige gebouwen.

      2 De subsidie kan uitsluitend worden besteed aan kosten van
      uiterlijk vóór 1 januari 2008 te treffen maatregelen als bedoeld in
      [artikel 2, eerste lid, onder a tot en met e, van het Besluit saneringsmaatregelen industrieterreinen 1994][ref3].
      Voor zover het maatregelen betreft als bedoeld in
      [artikel 2, eerste lid, onder b en c, van het Besluit saneringsmaatregelen industrieterreinen 1994][ref4] kan ten
      hoogste 20% van de met betrekking tot die maatregelen vastgestelde subsidie tevens worden besteed aan kosten van
      voorbereiding, begeleiding en toezicht van deze maatregelen.


      [ref1]: https://wetten.overheid.nl/BWBR0004739#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0004739#Artikel3b
      [ref3]: https://wetten.overheid.nl/BWBR0007107#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0007107#Artikel2
