  - number: 4d
    text: |-
      1 Gedeputeerde staten verstrekken aan het Interprovinciaal Overleg in januari 1996 gegevens omtrent de stand van
      zaken per 1 januari 1996 met betrekking tot de uitvoering van de saneringprogramma's.

      2 Tot die gegevens behoren in ieder geval:

      a. het totale aantal saneringsprogramma’s waarin maatregelen zijn genoemd die vóór 1 januari 2003 geëffectueerd
      moeten zijn;

      b. het aantal saneringsprogramma’s waarvan alle maatregelen als bedoeld in artikel 6*a*, tweede lid, op 1 januari
      1996 zijn uitgevoerd, onder vermelding van de kosten van de uitgevoerde maatregelen per saneringsprogramma, en welk
      percentage daarvan is bekostigd uit de bijdrage, bedoeld in [artikel 6][ref1], voor het jaar 1995;

      c. met betrekking tot de bijdrage, bedoeld in [artikel 6][ref2], voor het jaar 1995:

      1°. het bedrag dat in dat jaar niet is uitgegeven;

      2°. het bedrag dat van het in dat jaar niet-uitgegeven bedrag is verplicht, onder vermelding van het jaar waarin de
      betaling wordt verwacht, en

      3°. het bedrag dat van het in 1995 niet-uitgegeven bedrag is gereserveerd voor het doen van toekomstige uitgaven
      als bedoeld in [artikel 6][ref3];

      d. het aantal saneringsprogramma’s waarvan alle maatregelen als bedoeld in artikel 6*a*, tweede lid, op 1 januari
      1997 zullen zijn uitgevoerd.

      3 Bij de vermelding van de kosten van de uitgevoerde maatregelen per saneringsprogramma worden de kosten
      uitgesplitst naar de in [artikel 2, eerste lid, van het Besluit saneringsmaatregelen industrieterreinen 1994][ref4]
      onderscheiden categorieën van maatregelen.

      4 Voor zover het verlenen, wijzigen of aanvullen van een vergunning deel uitmaakt van de op 1 januari 1996
      uitgevoerde maatregelen, bedoeld in [artikel 6][ref5], verklaren gedeputeerde staten ten aanzien van iedere
      verleende, gewijzigde of aangevulde vergunning dat deze voorziet in een effectuering vóór 1 januari 2003. De
      verklaringen maken deel uit van de gegevens, bedoeld in het tweede lid.

      5 Gedeputeerde staten verstrekken aan het Interprovinciaal Overleg, met ingang van 1997, telkens in januari van
      het lopende kalenderjaar de gegevens, bedoeld in het tweede lid, onder *b* en *c*, over het daaraan voorafgaande
      kalenderjaar en de gegevens, bedoeld in het tweede lid, onder *d*, per 1 januari van het kalenderjaar dat volgt op
      het lopende kalenderjaar. Het derde en vierde lid zijn van overeenkomstige toepassing.

      6 Indien de gegevens niet of onvolledig zijn verstrekt, doet het Interprovinciaal Overleg daarvan mededeling in
      de rapportage.


