  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 2 december 1988,
    no. MJZ 05D8002, Centrale Directie Juridische Zaken, afdeling Wetgeving;

    Gelet op de artikelen 61z en 81 van de Wet algemene bepalingen milieuhygiëne (Stb. 1988, 133) en artikel II van de
    Wet tot uitbreiding van de Wet algemene bepalingen milieuhygiëne met regels met betrekking tot de financiering van
    het beleid op het gebied van de milieuhygiëne (Stb. 1988, 113), alsmede artikel 144b van de Provinciewet en 237b
    van de gemeentewet;

    Gezien het advies van de Centrale raad voor de milieuhygiëne van 17 oktober 1988, nr. ABJ-88/985, het advies van
    de Raad voor de gemeentefinanciën van 31 augustus 1988, 26107 RFG 86/59, en het advies van het Interprovinciaal
    Overleg van 20 oktober 1988, 11 1984/88;

    De Raad van State gehoord (advies van 24 april 1989, No. W08.88 0684);

    Gezien het nader rapport van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 3 april
    1990, nr. MJZ 03490024, Centrale Directie Juridische Zaken, afdeling Wetgeving

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0004739/2024-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. wet: [Wet milieubeheer][ref1];

      b. Rijkswaterstaat: het Directoraat-Generaal Rijkswaterstaat van het Ministerie van Verkeer en Waterstaat;

      c. NMP-2: Tweede Nationaal Milieubeleidsplan (kamerstukken II 1993/94, 23 560, nr. 2);

      d. geluidsgevoelige ruimte van een woning: verblijfsruimte binnen een woning als bedoeld in
      [bijlage I bij het Besluit bouwwerken leefomgeving][ref2], met uitzondering van een keuken met een vloeroppervlak
      van minder dan 11m2;

      e. ander geluidsgevoelig gebouw:

      1°. basisschool;

      2°. school voor voortgezet onderwijs als bedoeld in de [Wet voortgezet onderwijs 2020][ref3];

      3°. instelling voor hoger beroepsonderwijs;

      4°. verpleeghuis of algemeen, categoraal of academisch ziekenhuis;

      5°. ander gezondheidszorggebouw dan bedoeld onder 4°;

      f. geluidsgevoelig terrein: terrein dat behoort bij een gebouw als bedoeld onder e, onder 5°, voor zover dat
      terrein bestemd is of gebruikt wordt voor de in dat gebouw gegeven zorg;

      g. geluidwerende maatregelen: geluidwerende maatregelen aan de uitwendige scheidingsconstructie, bedoeld in
      [bijlage I bij het Besluit bouwwerken leefomgeving][ref4];

      h. verkeersmaatregelen: maatregelen met betrekking tot de weg die het geluid, veroorzaakt door het verkeer op de
      weg, verminderen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245
      [ref2]: https://wetten.overheid.nl/BWBR0041297
      [ref3]: https://wetten.overheid.nl/BWBR0044212
      [ref4]: https://wetten.overheid.nl/BWBR0041297
