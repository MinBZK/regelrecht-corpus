$id: besluit_ontgrondingen_in_rijkswateren
regulatory_layer: AMVB
publication_date: '2020-10-28'
valid_from: '2017-01-01'
bwb_id: BWBR0023362
url: https://wetten.overheid.nl/BWBR0023362/2017-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Verkeer en Waterstaat van 19 oktober 2007, nr. HDJZ/I&O/2007-1188,
    Hoofddirectie Juridische Zaken;

    Gelet op de artikelen 5, eerste lid, 6, 7, eerste en derde lid, en 10, vierde lid, van de Ontgrondingenwet;

    De Raad van State gehoord (advies van 7 december 2007, nr. W09.07.0386/IV);

    Gezien het nader rapport van de Staatssecretaris van Verkeer en Waterstaat van 21 december 2007, nr. HDJZ/I&O/2007-
    1709, Hoofddirectie Juridische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0023362/2017-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      Het verbod van [artikel 3, eerste lid, van de Ontgrondingenwet][ref1] is niet van toepassing op ontgrondingen in
      krachtens [artikel 8, eerste lid, van die wet][ref2] aangewezen rijkswateren voor zover het betreft:


      [ref1]: https://wetten.overheid.nl/BWBR0002505#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002505#Artikel8
    url: https://wetten.overheid.nl/BWBR0023362/2017-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002505
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0002505
        artikel: '8'
  - number: 1.1.a
    text: |-
      het aanleggen, onderhouden, wijzigen of opruimen van watergangen en vaargeulen voor zover deze activiteiten door of
      vanwege Onze Minister worden verricht;
    url: https://wetten.overheid.nl/BWBR0023362/2017-01-01#Artikel1
  - number: 1.1.b
    text: |-
      het aanleggen, onderhouden, wijzigen of opruimen van waterkeringen, bouwwerken, installaties en andere
      rijkswaterstaatswerken dan watergangen en vaargeulen;
    url: https://wetten.overheid.nl/BWBR0023362/2017-01-01#Artikel1
  - number: 1.1.c
    text: het doen van grondboringen en sonderingen;
    url: https://wetten.overheid.nl/BWBR0023362/2017-01-01#Artikel1
  - number: 1.1.d
    text: het leggen, plaatsen, onderhouden, wijzigen of opruimen van buizen, kabels, palen en dergelijke voorwerpen;
    url: https://wetten.overheid.nl/BWBR0023362/2017-01-01#Artikel1
  - number: 1.1.e
    text: het graven van slikgruppen ter bevordering van aanwas.
    url: https://wetten.overheid.nl/BWBR0023362/2017-01-01#Artikel1
  - number: '1.2'
    text: |-
      Indien bij een ontgronding als bedoeld in het eerste lid een archeologisch monument of een vermoedelijk
      archeologisch monument als bedoeld in de [Erfgoedwet][ref1], wordt gevonden, stelt degene die is overgegaan tot
      de ontgronding gegevens en bescheiden waarover hij de beschikking heeft en die informatie kunnen verschaffen
      over de aanwezigheid of te verwachten aanwezigheid van het archeologisch monument, ter beschikking aan Onze
      Minister van Onderwijs, Cultuur en Wetenschap. [Artikel 5.10 van de Erfgoedwet][ref2] en de [artikelen 56][ref3],
      [58, eerste lid][ref4], en [59 van de Monumentenwet 1988][ref5] zoals die [wet][ref6] luidde voor inwerkingtreding
      van de Erfgoedwet zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0037521
      [ref2]: https://wetten.overheid.nl/BWBR0037521#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0004471#Artikel56
      [ref4]: https://wetten.overheid.nl/BWBR0004471#Artikel58
      [ref5]: https://wetten.overheid.nl/BWBR0004471#Artikel59
      [ref6]: https://wetten.overheid.nl/BWBR0004471
    url: https://wetten.overheid.nl/BWBR0023362/2017-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0037521
      - id: ref2
        bwb_id: BWBR0037521
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0004471
        artikel: '56'
      - id: ref4
        bwb_id: BWBR0004471
        artikel: '58'
      - id: ref5
        bwb_id: BWBR0004471
        artikel: '59'
      - id: ref6
        bwb_id: BWBR0004471
  - number: '2.1'
    text: |-
      Het verbod van [artikel 3, eerste lid, van de Ontgrondingenwet][ref1] is niet van toepassing op ontgrondingen in
      verband met het testen van materieel en onderzoek naar winbare hoeveelheden van andere vaste stoffen dan schelpen,
      indien de ontgronding plaatsvindt in de Noordzee zeewaarts van de doorgaande NAP-min 20 meterdieptelijn of in
      andere krachtens [artikel 8, eerste lid, van die wet][ref2] aangewezen rijkswateren, en:


      [ref1]: https://wetten.overheid.nl/BWBR0002505#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002505#Artikel8
    url: https://wetten.overheid.nl/BWBR0023362/2017-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002505
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0002505
        artikel: '8'
  - number: 2.1.a
    text: |-
      plaatsvindt op een afstand van ten minste 500 meter van militaire oefengebieden, buisleidingen, kabels, oevers,
      andere vaste objecten of aanwezige of te verwachten monumenten, en
    url: https://wetten.overheid.nl/BWBR0023362/2017-01-01#Artikel2
  - number: 2.1.b
    text: |-
      niet meer betreft dan een bij ministeriële regeling aangewezen hoeveelheid vaste stoffen die in een daarbij te
      noemen maximum aantal reizen wordt gewonnen en welke hoeveelheid per daarbij aangewezen rijkswater kan verschillen.
    url: https://wetten.overheid.nl/BWBR0023362/2017-01-01#Artikel2
  - number: '2.2'
    text: |-
      Het eerste lid is niet van toepassing op ontgrondingen in een in het Integraal Beheerplan Noordzee 2015
      aangewezen gebied met bijzondere ecologische waarden zolang dat gebied niet is aangewezen krachtens
      [artikel 2.1, eerste lid, van de Wet natuurbescherming][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel2
    url: https://wetten.overheid.nl/BWBR0023362/2017-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '2'
  - number: '3.1'
    text: |-
      Degene die het voornemen heeft over te gaan tot een ontgronding als bedoeld in [artikel 2][ref1] meldt dit
      voornemen ten minste vier weken voordat tot die ontgronding wordt overgegaan aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0023362#Artikel2
    url: https://wetten.overheid.nl/BWBR0023362/2017-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0023362
        artikel: '2'
  - number: '3.2'
    text: 'De melding bevat:'
    url: https://wetten.overheid.nl/BWBR0023362/2017-01-01#Artikel3
  - number: 3.2.a
    text: naam, adres en het beroep of bedrijf van de melder;
    url: https://wetten.overheid.nl/BWBR0023362/2017-01-01#Artikel3
  - number: 3.2.b
    text: naam, type en registratiegegevens van de te gebruiken schepen;
    url: https://wetten.overheid.nl/BWBR0023362/2017-01-01#Artikel3
  - number: 3.2.c
    text: 'de locatie van de ontgronding, weer te geven door:'
    url: https://wetten.overheid.nl/BWBR0023362/2017-01-01#Artikel3
  - number: 3.2.c.1°
    text: 'in de Noordzee: coördinaten, met opgave van het gebruikte coördinatenstelsel;'
    url: https://wetten.overheid.nl/BWBR0023362/2017-01-01#Artikel3
  - number: 3.2.c.2°
    text: |-
      in andere rijkswateren: een kaart met een schaal van ten minste 1:5000 met daarop ingetekende locaties van
      buisleidingen, kabels, oevers, andere vaste objecten of aanwezige of te verwachten monumenten en de coördinaten,
      met opgave van het gebruikte coördinatenstelsel;
    url: https://wetten.overheid.nl/BWBR0023362/2017-01-01#Artikel3
  - number: 3.2.d
    text: een opgave van de oppervlakte, de wijze van uitvoering en de maximale diepte van de ontgronding;
    url: https://wetten.overheid.nl/BWBR0023362/2017-01-01#Artikel3
  - number: 3.2.e
    text: |-
      de periode waarin de ontgronding zal plaatsvinden, de verwachte hoeveelheid en de aard van de vaste stoffen die met
      de ontgronding gewonnen zal worden en de eventuele bestemming van deze stoffen;
    url: https://wetten.overheid.nl/BWBR0023362/2017-01-01#Artikel3
  - number: 3.2.f
    text: een opgave van de reden van de ontgronding.
    url: https://wetten.overheid.nl/BWBR0023362/2017-01-01#Artikel3
  - number: '3.3'
    text: |-
      Degene die is overgegaan tot een ontgronding als bedoeld in [artikel 2][ref1], doet uiterlijk vier weken na de
      uitvoering van die ontgronding aan Onze Minister verslag van:


      [ref1]: https://wetten.overheid.nl/BWBR0023362#Artikel2
    url: https://wetten.overheid.nl/BWBR0023362/2017-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0023362
        artikel: '2'
  - number: 3.3.a
    text: de datum waarop of periode waarin de ontgronding is uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0023362/2017-01-01#Artikel3
  - number: 3.3.b
    text: de hoeveelheid vaste stoffen die is ontgrond en de hoeveelheid vaste stoffen die is afgevoerd;
    url: https://wetten.overheid.nl/BWBR0023362/2017-01-01#Artikel3
  - number: 3.3.c
    text: de aard van de vaste stoffen die zijn ontgrond en de aard van de vaste stoffen die zijn afgevoerd, en
    url: https://wetten.overheid.nl/BWBR0023362/2017-01-01#Artikel3
  - number: 3.3.d
    text: de exacte locatie van de ontgronding.
    url: https://wetten.overheid.nl/BWBR0023362/2017-01-01#Artikel3
  - number: '3.4'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld inzake de wijze van melding en de daarbij te
      verstrekken gegevens en bescheiden.
    url: https://wetten.overheid.nl/BWBR0023362/2017-01-01#Artikel3
  - number: '3.5'
    text: |-
      Op een ontgronding als bedoeld in [artikel 2][ref1], is [artikel 1, tweede lid][ref2] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0023362#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0023362#Artikel1
    url: https://wetten.overheid.nl/BWBR0023362/2017-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0023362
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0023362
        artikel: '1'
  - number: '4.1'
    text: |-
      Een aanvraag tot verlening, wijziging of intrekking van een vergunning voor ontgrondingen in krachtens
      [artikel 8, eerste lid, van de Ontgrondingenwet][ref1] aangewezen rijkswateren wordt bij Onze Minister ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0002505#Artikel8
    url: https://wetten.overheid.nl/BWBR0023362/2017-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002505
        artikel: '8'
  - number: '4.2'
    text: 'Een aanvraag tot verlening van een vergunning vermeldt ten minste:'
    url: https://wetten.overheid.nl/BWBR0023362/2017-01-01#Artikel4
  - number: 4.2.a
    text: het beroep of bedrijf van de aanvrager;
    url: https://wetten.overheid.nl/BWBR0023362/2017-01-01#Artikel4
  - number: 4.2.b
    text: naam, type en registratiegegevens van het te gebruiken schip of de te gebruiken schepen;
    url: https://wetten.overheid.nl/BWBR0023362/2017-01-01#Artikel4
  - number: 4.2.c
    text: 'de locatie van de ontgronding, weer te geven door:'
    url: https://wetten.overheid.nl/BWBR0023362/2017-01-01#Artikel4
  - number: 4.2.c.1°
    text: 'in de Noordzee: coördinaten, met opgave van het gebruikte coördinatenstelsel;'
    url: https://wetten.overheid.nl/BWBR0023362/2017-01-01#Artikel4
  - number: 4.2.c.2°
    text: |-
      in andere rijkswateren met een breedte van meer dan 500 meter: een kaart met een schaal van ten minste 1:50 000,
      met opgave van het gebruikte coördinatenstelsel;
    url: https://wetten.overheid.nl/BWBR0023362/2017-01-01#Artikel4
  - number: 4.2.c.3°
    text: |-
      in de overige rijkswateren, een tekening met kadastrale aanduiding van ten minste 1:2500, waarop de te ontgronden
      onroerende zaken of gedeelten van onroerende zaken en aangrenzende percelen zijn weergegeven, alsmede een
      uittreksel uit de basisregistratie kadaster van elk perceel, waarop de aanvraag betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0023362/2017-01-01#Artikel4
  - number: 4.2.d
    text: een opgave van de oppervlakte, de wijze van uitvoering en de diepte van de ontgronding;
    url: https://wetten.overheid.nl/BWBR0023362/2017-01-01#Artikel4
  - number: 4.2.e
    text: |-
      de periode waarin de ontgronding zal plaatsvinden en de aard en hoeveelheid van de vaste stoffen die met de
      ontgronding gewonnen kan worden;
    url: https://wetten.overheid.nl/BWBR0023362/2017-01-01#Artikel4
  - number: 4.2.f
    text: |-
      een opgave van de redenen van de ontgronding en van de aan het afkomende bodemmateriaal te geven bestemming, de
      aanlandingsplaats en de maximale vaarafstand daarheen;
    url: https://wetten.overheid.nl/BWBR0023362/2017-01-01#Artikel4
  - number: 4.2.g
    text: |-
      een beschrijving van het water waarop de aanvraag betrekking heeft, onder vermelding van het huidige gebruik
      daarvan en, voor zover van toepassing, van de gemeente waarin het water is gelegen, en
    url: https://wetten.overheid.nl/BWBR0023362/2017-01-01#Artikel4
  - number: 4.2.h
    text: |-
      een beschrijving van de toestand waarin het terrein of de bodem van het water na de ontgronding wordt gebracht,
      onder vermelding van de daaraan te geven bestemming.
    url: https://wetten.overheid.nl/BWBR0023362/2017-01-01#Artikel4
  - number: '4.3'
    text: |-
      Op verzoek van Onze Minister verstrekt de aanvrager de resultaten van voor de belangenafweging benodigde
      onderzoeken.
    url: https://wetten.overheid.nl/BWBR0023362/2017-01-01#Artikel4
  - number: '4.4'
    text: |-
      Het tweede en derde lid zijn van toepassing op een aanvraag tot wijziging van een vergunning, voor zover de in die
      leden bedoelde gegevens en bescheiden niet reeds bij de aanvraag tot verlening van de vergunning zijn verstrekt en
      sindsdien niet zijn gewijzigd.
    url: https://wetten.overheid.nl/BWBR0023362/2017-01-01#Artikel4
  - number: '4.5'
    text: |-
      Op een ontgronding als bedoeld in het eerste lid, is [artikel 1, tweede lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0023362#Artikel1
    url: https://wetten.overheid.nl/BWBR0023362/2017-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0023362
        artikel: '1'
  - number: '5.1'
    text: |-
      In afwijking van [artikel 10, eerste lid, van de Ontgrondingenwet][ref1] zijn op de voorbereiding van een beschikking
      als bedoeld in [artikel 8, eerste lid, van die wet][ref2][afdeling 3.4 van de Algemene wet bestuursrecht][ref3] en
      [afdeling 13.2 van de Wet milieubeheer][ref4] niet van toepassing voor zover het betreft:


      [ref1]: https://wetten.overheid.nl/BWBR0002505#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002505#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Afdeling13.2
    url: https://wetten.overheid.nl/BWBR0023362/2017-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002505
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0002505
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0005537
        afdeling: '3.4'
      - id: ref4
        bwb_id: BWBR0003245
        afdeling: '13.2'
  - number: 5.1.a
    text: |-
      de verlenging van een bestaande vergunning, indien de termijn van verlenging, tezamen met eventuele eerdere
      verlengingstermijnen, niet meer bedraagt dan de helft van de oorspronkelijke vergunningstermijn, of
    url: https://wetten.overheid.nl/BWBR0023362/2017-01-01#Artikel5
  - number: 5.1.b
    text: |-
      een ontgronding op een afstand van tenminste 500 meter van buisleidingen, kabels, oevers, andere vaste objecten of
      aanwezige of te verwachten monumenten indien die ontgronding plaatsvindt:
    url: https://wetten.overheid.nl/BWBR0023362/2017-01-01#Artikel5
  - number: 5.1.b.1°
    text: |-
      tot 2 meter diepte ten opzichte van de oorspronkelijke zeebodem in delen van de Noordzee zeewaarts van de
      doorgaande NAP-min 20 meterdieptelijn waar niet eerder tot die diepte is ontgrond, of
    url: https://wetten.overheid.nl/BWBR0023362/2017-01-01#Artikel5
  - number: 5.1.b.2°
    text: |-
      in vaargeulen in krachtens [artikel 8, eerste lid, van de Ontgrondingenwet][ref1] aangewezen rijkswateren.


      [ref1]: https://wetten.overheid.nl/BWBR0002505#Artikel8
    url: https://wetten.overheid.nl/BWBR0023362/2017-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002505
        artikel: '8'
  - number: '5.2'
    text: 'Het eerste lid is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0023362/2017-01-01#Artikel5
  - number: 5.2.a
    text: |-
      activiteiten, genoemd in het [Besluit milieueffectrapportage][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006788
    url: https://wetten.overheid.nl/BWBR0023362/2017-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0006788
  - number: 5.2.b
    text: |-
      ontgrondingen in een gebied als bedoeld in [artikel 2, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0023362#Artikel2
    url: https://wetten.overheid.nl/BWBR0023362/2017-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0023362
        artikel: '2'
  - number: '6.1'
    text: |-
      Ter zake van de behandeling van een aanvraag om een vergunning of wijziging van een vergunning voor ontgrondingen
      in krachtens [artikel 8, eerste lid, van de Ontgrondingenwet][ref1] aangewezen rijkswateren wordt een recht
      geheven.


      [ref1]: https://wetten.overheid.nl/BWBR0002505#Artikel8
    url: https://wetten.overheid.nl/BWBR0023362/2017-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002505
        artikel: '8'
  - number: '6.2'
    text: |-
      Het recht bedraagt € 680,00, vermeerderd met een opslag gerelateerd aan de hoeveelheid vaste stoffen waarvoor de
      vergunning wordt aangevraagd en die wordt berekend overeenkomstig de bijlage bij dit besluit.
    url: https://wetten.overheid.nl/BWBR0023362/2017-01-01#Artikel6
  - number: '6.3'
    text: Bij het niet behandelen van de aanvraag wordt het recht met 100% verminderd.
    url: https://wetten.overheid.nl/BWBR0023362/2017-01-01#Artikel6
  - number: '6.4'
    text: |-
      In geval van volledige afwijzing van de aanvraag of bij intrekking van de aanvraag na het in behandeling nemen van
      de aanvraag, maar vóór de toezending van het ontwerp van het besluit aan de aanvrager, wordt het recht met 50% van
      de opslag verminderd.
    url: https://wetten.overheid.nl/BWBR0023362/2017-01-01#Artikel6
  - number: '6.5'
    text: |-
      Bij intrekking van de aanvraag na de toezending van het ontwerp van het besluit aan de aanvrager, maar vóór de
      toezending van het besluit, wordt het recht met 10% van de opslag verminderd.
    url: https://wetten.overheid.nl/BWBR0023362/2017-01-01#Artikel6
  - number: '6.6'
    text: |-
      Indien de hoeveelheid vaste stoffen waarop de aanvraag betrekking heeft meer bedraagt dan de hoeveelheid waarop
      de vergunning, onderscheidenlijk het besluit tot wijziging van een vergunning betrekking heeft, wordt het recht
      verminderd. Het bedrag waarmee het recht wordt verminderd wordt bepaald door de opslag, berekend met toepassing van
      de bijlage bij dit besluit voor de hoeveelheid waarop de aanvraag betrekking heeft, te verminderen met de opslag
      berekend met toepassing van de bijlage bij dit besluit voor de hoeveelheid waarop de vergunning onderscheidenlijk
      de beschikking tot wijziging van de vergunning betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0023362/2017-01-01#Artikel6
  - number: '6.7'
    text: |-
      Indien ter zake van de behandeling van de aanvraag [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] niet is
      toegepast en het recht meer bedraagt dan € 2250,00 wordt het recht verminderd tot € 2250,00.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0023362/2017-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: '6.8'
    text: |-
      In afwijking van het eerste lid wordt ter zake van de behandeling van een door of vanwege Onze Minister ingediende
      aanvraag om een vergunning of wijziging van een vergunning geen recht geheven.
    url: https://wetten.overheid.nl/BWBR0023362/2017-01-01#Artikel6
  - number: '7.1'
    text: |-
      Het recht, bedoeld in [artikel 6][ref1], wordt binnen twee weken na de dag van indiening van de aanvraag om een
      vergunning of wijziging van een vergunning, betaald aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0023362#Artikel6
    url: https://wetten.overheid.nl/BWBR0023362/2017-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0023362
        artikel: '6'
  - number: '7.2'
    text: |-
      Indien [artikel 6, derde, vierde, vijfde, zesde of zevende lid][ref1] van toepassing is, vindt terugbetaling plaats
      van het bedrag waarmee het recht verminderd wordt.


      [ref1]: https://wetten.overheid.nl/BWBR0023362#Artikel6
    url: https://wetten.overheid.nl/BWBR0023362/2017-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0023362
        artikel: '6'
  - number: '8'
    text: |-
      Het [Rijksreglement ontgrondingen][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0002781
    url: https://wetten.overheid.nl/BWBR0023362/2017-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002781
  - number: '9'
    text: Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0023362/2017-01-01#Artikel9
  - number: '10'
    text: 'Dit besluit wordt aangehaald als: Besluit ontgrondingen in rijkswateren.'
    url: https://wetten.overheid.nl/BWBR0023362/2017-01-01#Artikel10
