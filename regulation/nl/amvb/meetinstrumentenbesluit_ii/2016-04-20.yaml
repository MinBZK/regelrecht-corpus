---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: meetinstrumentenbesluit_ii
regulatory_layer: AMVB
publication_date: '2006-11-28'
valid_from: '2016-04-20'
bwb_id: BWBR0020554
url: https://wetten.overheid.nl/BWBR0020554/2016-04-20
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Economische Zaken van 14 juli 2006, nr. WJZ 6049929;

    Gelet op richtlijn nr. 71/316/EEG van de Raad van de Europese Gemeenschappen van 26 juli 1971 inzake de onderlinge
    aanpassing van de wetgevingen der Lid-Staten betreffende voor meetmiddelen en metrologische controlemethoden
    geldende algemene bepalingen (PbEG L 202) en de bijzondere richtlijnen inzake meetmiddelen 75/107/EEG (PbEG 1975 L
    42), 71/349/EEG (PbEG 1971 L 239), 71/317/EEG (PbEG 1971 L 202), 74/148/EEG (PbEG 1974 L 84), 86/217/EEG (PbEG 1986
    L 152), 71/347/EEG (PbEG 1971 L 239), 76/765/EEG (PbEG 1976 L 262), en 75/33/EEG (PbEG 1975 L 14) en de artikelen
    5, 9, 26, 36 en 51 van de Metrologiewet, artikel 26, onder a en f, van de Wet op de geneesmiddelenvoorziening,
    artikel 3, eerste lid, van de Wet op de medische hulpmiddelen en de artikelen 8, eerste lid, onder c, en 13, onder
    a, van de Warenwet;

    De Raad van State gehoord (advies van 7 september 2006, nr. W10.06.0329/II);

    Gezien het nader rapport van Onze Minister van Economische Zaken van 14 november 2006, nr.WJZ 6076132;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0020554/2016-04-20#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0020554/2016-04-20#Artikel1
  - number: 1.a
    text: |-
      wet: [Metrologiewet][ref1];

      [ref1]: https://wetten.overheid.nl/BWBR0019517
    url: https://wetten.overheid.nl/BWBR0020554/2016-04-20#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0019517
  - number: 1.b
    text: |-
      richtlijn meetinstrumenten: [richtlijn nr. 2004/22/EG](32004L0022) van het Europees Parlement en de Raad van de
      Europese Unie van 31 maart 2004 betreffende meetinstrumenten (PbEU L 135);
    url: https://wetten.overheid.nl/BWBR0020554/2016-04-20#Artikel1
  - number: 1.l
    text: |-
      fabrikant: de natuurlijke persoon of de rechtspersoon die verantwoordelijk is voor de overeenstemming van het
      meetinstrument met de bij of krachtens de wet gestelde eisen aan het instrument voordat het in de handel wordt
      gebracht of in gebruik wordt genomen;
    url: https://wetten.overheid.nl/BWBR0020554/2016-04-20#Artikel1
  - number: 1.m
    text: 'beoordelingsprocedurebijlage: bijlage B, D, E, F of G bij de richtlijn meetinstrumenten;'
    url: https://wetten.overheid.nl/BWBR0020554/2016-04-20#Artikel1
  - number: 1.o
    text: |-
      Nederlandse metrologische markering: markering als bedoeld in [artikel 18][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020554#Artikel18
    url: https://wetten.overheid.nl/BWBR0020554/2016-04-20#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0020554
        artikel: '18'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: '3'
    text: |-
      Een meettaak ten behoeve van een specifieke toepassing als bedoeld in [artikel 5, eerste lid, van de wet][ref1]
      is het bij het drijven van handel, bij levering uit hoofde van beroep of bedrijf en bij het vaststellen van
      belastingen of van andere heffingen


      [ref1]: https://wetten.overheid.nl/BWBR0019517#Artikel5
    url: https://wetten.overheid.nl/BWBR0020554/2016-04-20#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0019517
        artikel: '5'
  - number: 3.a
    text: meten van een hoeveelheid vloeistof in een meetreservoir, anders dan een scheepstank;
    url: https://wetten.overheid.nl/BWBR0020554/2016-04-20#Artikel3
  - number: 3.d
    text: |-
      discontinu meten van een hoeveelheid uit een mengsel van benzine en olie bestaande brandstof, ten behoeve van het
      tanken van voertuigen met een tweetaktmotor.
    url: https://wetten.overheid.nl/BWBR0020554/2016-04-20#Artikel3
  - number: '5'
    text: |-
      Een meetinstrument als bedoeld in de onderdelen a tot en met e voldoet voordat het in de handel wordt gebracht, in
      gebruik wordt genomen of voor in gebruikneming verder wordt verhandeld, aan de bij ministeriële regeling voor het
      instrument gestelde eisen:
    url: https://wetten.overheid.nl/BWBR0020554/2016-04-20#Artikel5
  - number: 5.a
    text: |-
      vloeistofhoogtemeter, die bestaat uit een meetwaarde-opnemer en ten minste één aanwijsinrichting, met een in
      [artikel 3, onderdeel a][ref1], bedoelde taak;


      [ref1]: https://wetten.overheid.nl/BWBR0020554#Artikel3
    url: https://wetten.overheid.nl/BWBR0020554/2016-04-20#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0020554
        artikel: '3'
        hoofdstuk: '2'
  - number: 5.b
    text: |-
      meetreservoir met een in [artikel 3, onderdeel a][ref1], bedoelde taak;


      [ref1]: https://wetten.overheid.nl/BWBR0020554#Artikel3
    url: https://wetten.overheid.nl/BWBR0020554/2016-04-20#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0020554
        artikel: '3'
        hoofdstuk: '2'
  - number: 5.e
    text: |-
      brandstofmeetinstallaties met een in [artikel 3, onderdeel d][ref1], bedoelde taak.


      [ref1]: https://wetten.overheid.nl/BWBR0020554#Artikel3
    url: https://wetten.overheid.nl/BWBR0020554/2016-04-20#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0020554
        artikel: '3'
        hoofdstuk: '2'
  - number: '8.1'
    text: |-
      Bij ministeriële regeling worden regels gesteld met betrekking tot de eisen waar de in de [artikelen 4][ref1] en
      [5][ref2] bedoelde meetinstrumenten bij gebruik aan moeten voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0020554#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020554#Artikel5
    url: https://wetten.overheid.nl/BWBR0020554/2016-04-20#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0020554
        artikel: '4'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0020554
        artikel: '5'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '8.2'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de wijze van installatie en anderszins
      omtrent de omstandigheden waaronder een meetinstrument als bedoeld in [artikel 4][ref1] of [artikel 5][ref2] wordt
      gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0020554#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020554#Artikel5
    url: https://wetten.overheid.nl/BWBR0020554/2016-04-20#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0020554
        artikel: '4'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0020554
        artikel: '5'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '10'
    text: |-
      De meetinstrumenten, bedoeld in [artikel 5][ref1], ondergaan naar keuze van de fabrikant een
      overeenstemmingsbeoordeling overeenkomstig de beoordelingsprocedurebijlagen B+D, B+E, B+F of beoordelingsbijlage
      G van de richtlijn meetinstrumenten en de voorschriften die voor de toepassing van die beoordelingsbijlagen in de
      bijlage bij dit besluit zijn opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0020554#Artikel5
    url: https://wetten.overheid.nl/BWBR0020554/2016-04-20#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0020554
        artikel: '5'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '11.1'
    text: |-
      Voor een geregeld meetinstrument als bedoeld in [artikel 4][ref1] of [artikel 5][ref2] dat in gebruik is genomen,
      bestaat de overeenstemmingsbeoordeling uit een keuring.


      [ref1]: https://wetten.overheid.nl/BWBR0020554#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020554#Artikel5
    url: https://wetten.overheid.nl/BWBR0020554/2016-04-20#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0020554
        artikel: '4'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0020554
        artikel: '5'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '11.2'
    text: Bij ministeriële regeling kunnen nadere regels ten aanzien van de keuring worden gesteld.
    url: https://wetten.overheid.nl/BWBR0020554/2016-04-20#Artikel11
  - number: '12.1'
    text: |-
      De fabrikant verricht de werkzaamheden en komt de verplichtingen na die in verband met de
      overeenstemmingsbeoordeling volgens de kaderrichtlijn en de bijzondere richtlijnen of de in [artikel 10][ref1]
      bedoelde beoordelingsprocedurebijlage en de in de bijlage opgenomen voorschriften, aan hem zijn opgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0020554#Artikel10
    url: https://wetten.overheid.nl/BWBR0020554/2016-04-20#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0020554
        artikel: '10'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '12.2'
    text: |-
      De fabrikant kan een in de Europese Unie gevestigde natuurlijke persoon of rechtspersoon schriftelijk machtigen
      namens hem op te treden ten aanzien van bepaalde in de kaderrichtlijn of in de bijzondere richtlijnen aan hem
      opgedragen verplichtingen en werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0020554/2016-04-20#Artikel12
  - number: '13.1'
    text: |-
      De toetsende werkzaamheden in het kader van een overeenstemmingsbeoordeling als bedoeld in [artikel 10][ref1]
      worden verricht door een aangewezen instantie.


      [ref1]: https://wetten.overheid.nl/BWBR0020554#Artikel10
    url: https://wetten.overheid.nl/BWBR0020554/2016-04-20#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0020554
        artikel: '10'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '13.2'
    text: |-
      De aangewezen instantie draagt zorg voor de uitvoering van de verplichtingen die in een
      beoordelingsprocedurebijlage als bedoeld in [artikel 10][ref1] en de in de bijlage opgenomen voorschriften, aan hem
      zijn opgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0020554#Artikel10
    url: https://wetten.overheid.nl/BWBR0020554/2016-04-20#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0020554
        artikel: '10'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '16'
    text: |-
      De keuring, bedoeld in [artikel 11][ref1], wordt verricht door een aangewezen instantie of door een persoon die
      beschikt over een erkenning als bedoeld in [artikel 11 van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020554#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0019517#Artikel11
    url: https://wetten.overheid.nl/BWBR0020554/2016-04-20#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0020554
        artikel: '11'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0019517
        artikel: '11'
  - number: '18.1'
    text: |-
      De overeenstemming van een in de handel te brengen of in gebruik te nemen meetinstrument als bedoeld in
      [artikel 5][ref1] met de bij of krachtens de [wet][ref2] gestelde eisen blijkt uit de bij ministeriële regeling
      vast te stellen Nederlandse metrologische markering.


      [ref1]: https://wetten.overheid.nl/BWBR0020554#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0019517
    url: https://wetten.overheid.nl/BWBR0020554/2016-04-20#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0020554
        artikel: '5'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0019517
  - number: '18.2'
    text: |-
      De in het eerste lid bedoelde markering wordt duidelijk zichtbaar, gemakkelijk leesbaar en onuitwisbaar op het
      meetinstrument aangebracht. Wanneer een meetinstrument te klein of te gevoelig is om de markering daar op aan te
      brengen, wordt de markering aangebracht op de eventuele verpakking en op de documenten die bij het meetinstrument
      worden gevoegd.
    url: https://wetten.overheid.nl/BWBR0020554/2016-04-20#Artikel18
  - number: '18.3'
    text: |-
      Op de meetinstrumenten mogen andere markeringen worden aangebracht mits de zichtbaarheid en leesbaarheid van de
      Nederlandse metrologische markering niet wordt verminderd.
    url: https://wetten.overheid.nl/BWBR0020554/2016-04-20#Artikel18
  - number: '18.4'
    text: De in het eerste lid bedoelde markering wordt aangebracht door de fabrikant of onder zijn verantwoordelijkheid.
    url: https://wetten.overheid.nl/BWBR0020554/2016-04-20#Artikel18
  - number: '19.1'
    text: |-
      De overeenstemming van een in gebruik genomen geregeld meetinstrument dat ingevolge [artikel 7 van de wet][ref1]
      een overeenstemmingsbeoordeling heeft ondergaan, blijkt uit een merkteken waarvan het model bij ministeriële
      regeling wordt vastgesteld. Bij ministeriële regeling kunnen tevens regels worden gesteld omtrent de plaats en de
      wijze van aanbrengen van het merkteken.


      [ref1]: https://wetten.overheid.nl/BWBR0019517#Artikel7
    url: https://wetten.overheid.nl/BWBR0020554/2016-04-20#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0019517
        artikel: '7'
  - number: '19.2'
    text: |-
      Het in het eerste lid bedoelde merkteken wordt aangebracht door een aangewezen instantie of een persoon die
      beschikt over een erkenning als bedoeld in [artikel 11 van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019517#Artikel11
    url: https://wetten.overheid.nl/BWBR0020554/2016-04-20#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0019517
        artikel: '11'
  - number: '22'
    text: |-
      Bij ministeriële regeling kunnen ten aanzien van de toepassing van de kaderrichtlijn, de bijzondere richtlijnen en
      van de beoordelingsprocedurebijlagen nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0020554/2016-04-20#Artikel22
  - number: '23'
    text: |-
      Indien [artikel 44 van de wet][ref1] nog niet in werking is getreden op het tijdstip waarop
      [artikel 5 van de wet][ref2] en een of meer artikelen van dit besluit of van het [Meetinstrumentenbesluit I][ref3]
      in werking treden, kunnen bij ministeriële regeling nadere regels worden gesteld ten behoeve van de afstemming
      van de taken, rechten en verplichtingen die uit de bij of krachtens de [wet][ref4] en de IJkwet gestelde regels
      voortvloeien.


      [ref1]: https://wetten.overheid.nl/BWBR0019517#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0019517#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0019897
      [ref4]: https://wetten.overheid.nl/BWBR0019517
    url: https://wetten.overheid.nl/BWBR0020554/2016-04-20#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0019517
        artikel: '44'
      - id: ref2
        bwb_id: BWBR0019517
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0019897
      - id: ref4
        bwb_id: BWBR0019517
  - number: '29'
    text: |-
      De artikelen van dit besluit treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0020554/2016-04-20#Artikel29
  - number: '30'
    text: 'Dit besluit wordt aangehaald als: Meetinstrumentenbesluit II.'
    url: https://wetten.overheid.nl/BWBR0020554/2016-04-20#Artikel30
