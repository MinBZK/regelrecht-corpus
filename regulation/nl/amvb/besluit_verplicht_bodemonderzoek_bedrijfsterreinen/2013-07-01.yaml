articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. inrichting: inrichting die behoort tot een categorie, aangewezen krachtens
      [artikel 1.1, derde lid, van de Wet milieubeheer][ref1];

      b. BSB-aktie: aktie, gericht op systematische ondersteuning van de vrijwillige sanering van de bodem van in gebruik
      zijnde bedrijfsterreinen, als bedoeld in [artikel 4a][ref2];

      c. vooronderzoek: onderzoek ter vaststelling van de kwaliteit van de bodem op een wijze als aangegeven in de
      Nederlandse voornorm 5725 «Bodem – leidraad voor het uitvoeren van vooronderzoek bij verkennend, oriënterend en
      nader onderzoek» (uitgave van de Stichting Nederlands Normalisatie-instituut, Delft 1999), dan wel in de door Onze
      Minister aangewezen norm;

      d. verkennend onderzoek: onderzoek ter vaststelling van de kwaliteit van de bodem op een wijze als aangegeven
      in de Nederlandse norm 5740 «Bodem – onderzoeksstrategie bij verkennend bodemonderzoek, onderzoek naar de
      milieuhygiënische kwaliteit van bodem en grond» (uitgave van de Stichting Nederlands Normalisatie-instituut, Delft
      1999), dan wel in de door Onze Minister aangewezen norm;

      e. werkprogramma tankstations: Werkprogramma milieumaatregelen bij tankstations (uitgave van het Ministerie van
      Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer, 's-Gravenhage 1991).


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel1.1
      [ref2]: https://wetten.overheid.nl/BWBR0006155#Artikel4a
