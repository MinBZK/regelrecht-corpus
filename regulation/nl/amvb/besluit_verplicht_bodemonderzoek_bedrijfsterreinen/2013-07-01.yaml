  - number: '2'
    text: |-
      1 Voor de toepassing van dit besluit en de daarop berustende bepalingen zijn gedeputeerde staten van de provincie
      waarin de inrichting geheel of grotendeels is gelegen, het bevoegd gezag.

      2 In afwijking van het eerste lid zijn met betrekking tot een inrichting die geheel of grotendeels is gelegen in de
      gemeenten Almelo, Alkmaar, Amersfoort, Amsterdam, Arnhem, Breda, Deventer, Dordrecht, Eindhoven, Emmen, Enschede,
      's-Gravenhage, Groningen, Haarlem, Heerlen, Helmond, Hengelo, 's-Hertogenbosch, Leeuwarden, Leiden, Maastricht,
      Nijmegen, Rotterdam, Schiedam, Tilburg, Utrecht, Venlo, Zaanstad of Zwolle, burgemeester en wethouders van die
      gemeente het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0006155/2013-07-01#Artikel2
  - number: '4'
    text: |-
      1 Degene die een inrichting drijft, op een locatie waar op 31 december 1989 een inrichting was gevestigd:

      a. die blijkens het register van de Kamer van Koophandel op dat tijdstip wat betreft de hoofd- of nevenactiviteit
      behoorde tot een in [bijlage 1][ref1] bij dit besluit bedoelde bedrijfsgroep, en

      b. waarvoor sinds dat tijdstip niet een krachtens [artikel 8.40][ref2] of [8.44 van de Wet milieubeheer][ref3]
      vastgestelde algemene maatregel van bestuur van toepassing was, verricht op aanwijzing van het bevoegd gezag in
      de inrichting een vooronderzoek en een verkennend onderzoek en legt de onderzoeksresultaten binnen zes maanden na
      ontvangst van de aanwijzing aan het bevoegde gezag over.

      2 Voor zover nodig in afwijking van het eerste lid, onder b, geldt de in het eerste lid bedoelde verplichting
      in ieder geval ten aanzien van een inrichting waarop het Besluit herstelinrichtingen voor motorvoertuigen
      milieubeheer, het [Besluit inrichtingen voor motorvoertuigen milieubeheer][ref4] of het Besluit chemische
      wasserijen milieubeheer van toepassing was.

      3 Het bevoegd gezag doet de in het eerste lid genoemde aanwijzing slechts, indien binnen een jaar na verzending
      van een uitnodiging als bedoeld in [artikel 4a, derde lid, onder b][ref5], geen resultaten van het in dat artikel
      bedoelde onderzoek zijn ontvangen.

      4 Gedeputeerde staten informeren burgemeester en wethouders van de gemeente waar de inrichting geheel of
      grotendeels is gelegen, over de in het eerste lid genoemde aanwijzing en over de resultaten van het verrichte
      onderzoek.

      5 Het eerste lid is niet van toepassing indien:

      a. in het kader van een BSB-aktie een verkennend onderzoek, oriënterend onderzoek of nader onderzoek is verricht
      en de resultaten daarvan zijn overgelegd aan de in [artikel 4a][ref6] bedoelde instantie of aan het bevoegd gezag
      indien geen aanwijzing als bedoeld in artikel 4a, eerste lid, is gedaan;

      b. in het kader van de Interimwet bodemsanering of van [§ 3 van hoofdstuk IV van de Wet bodembescherming][ref7]
      bodemonderzoek is verricht, of

      c. in het kader van het werkprogramma tankstations een bodemonderzoek als omschreven in de handleiding
      bodemsanering tankstations (bijlage VI van dat werkprogramma) is verricht.


