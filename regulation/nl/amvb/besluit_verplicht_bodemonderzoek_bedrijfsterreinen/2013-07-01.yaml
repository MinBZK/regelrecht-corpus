  - number: 4a
    text: |-
      1 Het bevoegd gezag kan een of meer instanties aanwijzen, die belast zijn met het uitvoeren van een BSB-aktie met
      het oog op een onderzoek als bedoeld in [artikel 4, vijfde lid, onder a][ref1].

      2 Indien het bevoegd gezag geen aanwijzing heeft gedaan als bedoeld in het eerste lid, is het bevoegd gezag zelf
      belast met het uitvoeren van een BSB-aktie.

      3 Een BSB-aktie omvat ten minste:

      a. het inventariseren van in gebruik zijnde bedrijfsterreinen waar activiteiten plaatsvinden of hebben
      plaatsgevonden waardoor de bodem kan worden of zijn verontreinigd of aangetast;

      b. het per bedrijfsterrein aangeven met welke prioriteit een onderzoek naar de kwaliteit van de bodem noodzakelijk
      is, en het uitnodigen van de betreffende bedrijven tot het verrichten van dit onderzoek, en

      c. het registreren van de resultaten van de onder b bedoelde bodemonderzoeken.

      4 De in het eerste lid bedoelde instantie meldt het bevoegd gezag eenmaal per kwartaal de prioriteiten, bedoeld
      in het derde lid, onder b, in het eerstvolgende kwartaal, alsmede welke van de in het derde lid, onder b, bedoelde
      onderzoeken in het daaraan voorafgaande kwartaal hebben plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0006155#Artikel4
