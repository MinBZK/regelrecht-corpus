        artikel: '70'
  - number: '7'
    text: |-
      De categorieën bedrijfsterreinen waarvan aannemelijk is dat een geval van ernstige verontreiniging is ontstaan en
      spoedige sanering noodzakelijk zal zijn, bedoeld in [artikel 55ab van de Wet bodembescherming][ref1], zijn de in
      [bijlage 2][ref2] bij dit besluit aangewezen categorieën.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel55ab
      [ref2]: https://wetten.overheid.nl/BWBR0006155
