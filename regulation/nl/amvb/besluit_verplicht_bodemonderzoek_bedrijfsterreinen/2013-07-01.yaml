  - number: '8'
    text: |-
      1 Dit besluit treedt in werking met ingang van de eerste dag van de tweede kalendermaand na de datum van uitgifte
      van het *Staatsblad* waarin het wordt geplaatst.

      2 Indien op de in het eerste lid bedoelde dag het bij koninklijke boodschap van 18 mei 1990 ingediende voorstel
      van wet tot uitbreiding van de [Wet bodembescherming][ref1] met een regeling inzake de sanering van de bodem
      (Kamerstukken II 1989/90, 21 556, nrs. 1-2) nog niet tot wet is verheven en in werking is getreden, treedt dit
      besluit in afwijking van het eerste lid eerst in werking met ingang van de dag waarop dat voorstel van wet, na tot
      wet te zijn verheven, in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0003994
