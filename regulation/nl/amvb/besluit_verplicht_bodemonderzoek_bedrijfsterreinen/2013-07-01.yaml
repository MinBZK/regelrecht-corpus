  - number: '5'
    text: |-
      Onze Minister kan regels stellen met betrekking tot de wijze van monstername en van analyse bij het doen van een
      vooronderzoek of een verkennend onderzoek, en met betrekking tot de rapportage van het resultaat van dat onderzoek.
    url: https://wetten.overheid.nl/BWBR0006155/2013-07-01#Artikel5
  - number: '6'
    text: |-
      1 Op verzoek van degene die op of in een gedeelte van de bodem ten aanzien waarvan hem de nodige bevoegdheid
      ontbreekt, een verkennend onderzoek dient te verrichten ingevolge [artikel 4][ref1], kan het bevoegd
      gezag de rechthebbende ten aanzien van dat gedeelte van de bodem een verplichting opleggen als bedoeld in
      [artikel 70 van de Wet bodembescherming][ref2].

      2 Degene die een verzoek doet als bedoeld in het eerste lid, dient bij het verzoek de volgende gegevens te
      verstrekken:

      a. de naam en het adres van de verzoeker en van de rechthebbende;

      b. de kadastrale gegevens van de plaats waar het onderzoek dient te worden verricht;

      c. een omschrijving van de omvang van het onderzoek;

      d. het tijdstip waarop het onderzoek dient te worden verricht;

      e. een omschrijving van de handelingen die de rechthebbende in het belang van het onderzoek moet nalaten.


      [ref1]: https://wetten.overheid.nl/BWBR0006155#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0003994#Artikel70
    url: https://wetten.overheid.nl/BWBR0006155/2013-07-01#Artikel6
