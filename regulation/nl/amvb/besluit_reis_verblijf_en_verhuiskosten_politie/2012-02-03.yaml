        artikel: '18'
        hoofdstuk: III
        paragraaf: '2'
  - number: '22'
    text: |-
      1 De ambtenaar ontvangt een tegemoetkoming in de in verband met een dienstreis door hem gemaakte verblijfkosten
      voor maaltijd, logies en kleine uitgaven.

      2 Voor de berekening van de tegemoetkoming geldt de tarieflijst, opgenomen in [bijlage I][ref1] bij dit besluit,
      voor de verschillende gebieden waar wordt gereisd.

      3 De tegemoetkoming in de verblijfkosten bestaat uit:

      a. de urencomponent voor kleine uitgaven, ter grootte van 1,5% van het bedrag voor overige kosten opgenomen in de
      tarieflijst, voor ieder uur dat de dienstreis duurt;

      b. de logiescomponent, voor gemaakte logieskosten, per overnachting tot maximaal het in de tarieflijst opgenomen
      bedrag, met dien verstande dat indien een bewijsstuk niet kan worden overlegd waaruit blijkt dat logieskosten
      zijn gemaakt, een bedrag wordt uitgekeerd van € 11,34 per overnachting tot een maximum van vier overnachtingen
      per dienstreis;

      c. de ontbijtcomponent, ter grootte van 12% van het bedrag voor overige kosten, opgenomen in de tarieflijst voor
      iedere periode van 06.00 uur tot 08.00 uur die binnen de dienstreis valt;

      d. de lunchcomponent ter grootte van 20% van het bedrag voor overige kosten, opgenomen in de tarieflijst voor
      iedere periode van 12.00 tot 14.00 uur die binnen de dienstreis valt;

      e. de dinercomponent, ter grootte van 32% van het bedrag voor overige kosten, opgenomen in de tarieflijst voor
      iedere periode van 17.00 tot 20.00 uur die binnen de dienstreis valt.

      4 Indien een bewijsstuk van kosten voor logies en ontbijt wordt overgelegd waaruit niet blijkt welk deel van de
      kosten voor logies en welk deel van de kosten voor ontbijt zijn gemaakt, worden de op het bewijsstuk vermelde
      kosten vergoed, voor zover deze niet meer bedragen dan de som van de tegemoetkomingen, genoemd in het derde lid,
      onderdelen b en c.


      [ref1]: https://wetten.overheid.nl/BWBR0024064
    url: https://wetten.overheid.nl/BWBR0024064/2012-02-03#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0024064
  - number: '23'
    text: |-
      De ambtenaar ontvangt geen tegemoetkoming in verblijfkosten:

      a. voor een reisgedeelte per vliegtuig voor zover het betreft vliegreizen in de businessklasse;

      b. voor de periode dat een ambtenaar voor een bezoekreis als bedoeld in [artikel 21][ref1] in zijn woonplaats
      verblijft.


      [ref1]: https://wetten.overheid.nl/BWBR0024064#Artikel21
