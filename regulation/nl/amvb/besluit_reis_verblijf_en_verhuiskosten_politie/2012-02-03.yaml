  - number: '26'
    text: |-
      1 In dit hoofdstuk wordt verstaan onder:

        - eigen huishouding voeren: het zelfstandig bewonen van woonruimte, voorzien van eigen meubilair en stoffering;
        - voor het eerst aangesteld: aangesteld bij een regionaal politiekorps, bij het Korps landelijke politiediensten,
      bij het LSOP, bij een voorziening tot samenwerking of bij een organisatieonderdeel van de bijzondere ambtenaar
      van politie, anders dan in geval van overgang binnen één maand: a. van de ene naar de andere hiervoor genoemde
      (politie)organisatie; b. van een andere overheidsdienst of een door het Rijk bekostigde onderwijsinstelling naar
      een regionaal politiekorps, het Korps landelijke politiediensten, het LSOP, een voorziening tot samenwerking of een
      organisatieonderdeel van de bijzondere ambtenaren van politie.

      2 Voor de toepassing van dit hoofdstuk wordt onder de echtgenote of echtgenoot mede verstaan: de geregistreerde
      partner of de levenspartner met wie de niet-gehuwde ambtenaar samenwoont – en met het oogmerk duurzaam samen
      te leven – een gemeenschappelijke huishouding voert op basis van een notarieel verleden samenlevingscontract
      bevattende de wederzijdse rechten en verplichtingen ter zake van die samenwoning en gemeenschappelijke huishouding.
    url: https://wetten.overheid.nl/BWBR0024064/2012-02-03#Artikel26
  - number: '27'
    text: |-
      1 De ambtenaar die in verband met een verplaatsing of aanstelling in opdracht van het bevoegde gezag is verhuisd en
      een woning in of nabij een reisafstand van 20 kilometer van zijn plaats van tewerkstelling heeft betrokken, wordt
      een tegemoetkoming in de verhuiskosten verleend overeenkomstig de [artikelen 29 tot en met 31][ref1].

      2 De ambtenaar, bedoeld in het eerste lid, die nog niet is verhuisd en die naar het oordeel van het bevoegd gezag
      niet dagelijks heen en weer kan reizen heeft aanspraak op een tegemoetkoming in de pensionkosten voor verblijf in
      een pension in of nabij het werkgebied, tenzij van overheidswege al dan niet tegen betaling in huisvesting wordt
      voorzien. De tegemoetkoming bedraagt voor de ambtenaar die gewoonlijk met gezinsleden samenwoont 90% en voor de
      overige ambtenaren 60% van de betaalde pensionkosten, voor zover deze kosten redelijk zijn.

      3 De ambtenaar, bedoeld in het tweede lid, heeft aanspraak op een tegemoetkoming in de reiskosten voor maximaal
      eenmaal per week af te leggen gezinsbezoek of voor het reizen naar de woning van de ambtenaar. De tegemoetkoming
      is gelijk aan de kosten voor openbaar vervoer in de tweede vervoersklasse of, bij gebruik van eigen motorvoertuig €
      0,18 per kilometer.

      4 Geen tegemoetkoming in verhuiskosten wordt verleend, indien de verhuizing niet heeft plaatsgevonden binnen twee
      jaren nadat de verplichting tot verhuizen is opgelegd dan wel na de datum van het ontslag, het overlijden of de
      verplaatsing.


      [ref1]: https://wetten.overheid.nl/BWBR0024064#Artikel29
    url: https://wetten.overheid.nl/BWBR0024064/2012-02-03#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0024064
        artikel: '29'
        hoofdstuk: IV
  - number: '28'
    text: |-
      1 De ambtenaar die zich met een verhuizing, zonder dat daartoe opdracht is gegeven door het bevoegd gezag, heeft
      gevestigd binnen een reisafstand van 20 kilometer van zijn plaats van tewerkstelling wordt een tegemoetkoming in de
      verhuiskosten verleend overeenkomstig de [artikelen 29 tot en met 31][ref1], indien de reisafstand tussen de oude
      woning en de plaats van tewerkstelling ten minste 50 kilometer bedraagt.

      2 De ambtenaar dient de hem op grond van het eerste lid toegekende tegemoetkoming in verhuiskosten terug te
      betalen, indien binnen drie jaren na de verhuizing één van de volgende omstandigheden zich voordoet:

      a. aan hem wordt ontslag op aanvraag verleend, anders dan ontslag waarna binnen één maand wordt overgegaan naar
      een bij een regionaal politiekorps, bij het Korps landelijke politiediensten, bij het LSOP, bij een voorziening
      tot samenwerking of bij een organisatieonderdeel van de bijzondere ambtenaar van politie, tenzij de ambtenaar als
      gevolg van die overgang opnieuw moet verhuizen met aanspraak op tegemoetkoming in de verhuiskosten;

      b. aan hem wordt ontslag verleend op grond van aan hem te wijten feiten of omstandigheden;

      c. hij verhuist opnieuw, waarbij de afstand tussen zijn woning en zijn plaats van tewerkstelling met meer dan vijf
      kilometer toeneemt.

      3 Indien op grond van het tweede lid een terugbetalingsverplichting bestaat, wordt de hoogte van het terug te
      betalen bedrag berekend als volgt:

      a. in het eerste jaar na de verhuizing 100% van de tegemoetkoming;

      b. in het tweede jaar na de verhuizing 50% van de tegemoetkoming;

      c. in het derde jaar na de verhuizing 25% van de tegemoetkoming.

      4 De tegemoetkoming op grond van dit artikel wordt slechts toegekend, indien de ambtenaar schriftelijk heeft
      verklaard dat een verplichting tot terugbetalen hem bekend is.


      [ref1]: https://wetten.overheid.nl/BWBR0024064#Artikel29
    url: https://wetten.overheid.nl/BWBR0024064/2012-02-03#Artikel28
