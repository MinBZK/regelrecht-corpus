articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

        - ambtenaar: de ambtenaar, bedoeld in
      [artikel 1, eerste lid, onderdeel i, van het Besluit algemene rechtspositie politie][ref1];
        - aspirant: de aspirant, bedoeld in
      [artikel 1, eerste lid, onderdeel b, van het Besluit algemene rechtspositie politie][ref2];
        - bevoegd gezag: het bevoegd gezag, bedoeld in
      [artikel 1, eerste lid, onderdeel l, van het Besluit algemene rechtspositie politie][ref3];
        - LSOP: Landelijk selectie- en opleidingsinstituut politie, bedoeld in
      [artikel 2, van de Wet op het LSOP en het politieonderwijs][ref4];
        - Onze Minister: Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties;
        - plaats van tewerkstelling: de plaats van tewerkstelling, bedoeld in
      [artikel 1, eerste lid, onderdeel v, van het Besluit algemene rechtspositie politie][ref5];
        - voorziening tot samenwerking: een publiekrechtelijke rechtspersoon als bedoeld in
      [artikel 47a, eerst lid, van de Politiewet 1993][ref6].


