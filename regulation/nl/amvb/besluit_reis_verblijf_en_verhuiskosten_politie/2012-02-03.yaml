        hoofdstuk: III
        paragraaf: '2'
  - number: '24'
    text: |-
      1 Indien door een medisch deskundige aan de ambtenaar vaccinatie of geneesmiddelen zijn voorgeschreven in verband
      met de dienstreis, worden de kosten daarvan aan de ambtenaar vergoed.

      2 Indien een ambtenaar aantoont dat hij tijdens een dienstreis als gevolg van ziekte of van een ongeval kosten
      heeft moeten maken, kan hiervoor door het bevoegd gezag een vergoeding worden toegekend voor zover de kosten ten
      laste van de ambtenaar blijven.

      3 Indien door het bevoegd gezag niet reeds daarin is voorzien, worden aan de ambtenaar vergoed de redelijkerwijs
      gemaakte kosten van een reisverzekering voor de duur van de dienstreis.

      4 Voor de kosten die voor rekening van de ambtenaar blijven in het geval de ambtenaar deze als gevolg van verlies,
      diefstal of beschadiging van voor de dienstreis meegenomen noodzakelijke bagage heeft moeten maken, kan een
      tegemoetkoming worden uitgekeerd tot maximaal € 2268,90 netto per dienstreis.

      5 Aan de ambtenaar die een dienstreis maakt van minimaal vier dagen, de reisdagen inbegrepen, worden de kosten
      vergoed van de noodzakelijk gemaakte kosten voor het wassen van de eigen kleding.

      6 De in verband met een dienstreis gemaakte kosten voor interlokale en internationale telefoongesprekken en voor
      gebruik van internet voor dienstdoeleinden worden op basis van overgelegde bewijsstukken vergoed. Indien geen
      bewijsstukken worden overgelegd, moet de ambtenaar aannemelijk maken dat hij die kosten heeft gemaakt.

      7 Indien klimatologische of andere bijzondere omstandigheden in een tijdens een dienstreis te bezoeken land daartoe
      aanleiding geven, kan aan de ambtenaar een vergoeding worden toegekend in de aangetoonde en noodzakelijk gemaakte
      kosten voor bijzondere kleding en uitrusting. De vergoeding bedraagt de helft van de noodzakelijk gemaakte kosten
      van aanschaf van bijzondere kleding en uitrusting. Per kalenderjaar bedraagt de vergoeding maximaal € 453,78,
      waarvan € 226,89 voor gebieden met tropische warmte en € 226,89 voor gebieden met polaire koude, waartoe in ieder
      geval de gebieden, genoemd in [bijlage II][ref1] bij dit besluit, worden gerekend.


      [ref1]: https://wetten.overheid.nl/BWBR0024064
