  - number: '7'
    text: |-
      1 Het bevoegd gezag bepaalt of de tegemoetkoming, bedoeld in [artikel 6][ref1], als vaste tegemoetkoming per maand
      of als tegemoetkoming op declaratiebasis wordt toegekend.

      2 Bij de berekening van de vaste tegemoetkoming, bedoeld in het eerste lid, wordt bij een gemiddelde werkweek van
      vijf dagen uitgegaan van 206 werkdagen per kalenderjaar.

      3 Indien het aantal te werken dagen minder is dan vijf, wordt de vaste tegemoetkoming berekend naar rato.

      4 In het geval er sprake is van meerdere plaatsen van tewerkstelling, als bedoeld in
      [artikel 10, tweede lid, van het Besluit algemene rechtspositie politie][ref2] wordt de vaste tegemoetkoming per
      dienst bepaald door een gemiddelde afstand die de ambtenaar in een periode van vier weken moet afleggen.

      5 Het bevoegd gezag kan van de termijn, bedoeld in het vierde lid, bij een aspirant, afwijken indien het meer voor
      de hand ligt om het gemiddelde per kwartiel te berekenen.

      6 De vaste tegemoetkoming wordt stopgezet:

      a. bij voorziene afwezigheid van zes weken of langer, veroorzaakt door zwangerschapsverlof, ouderschapsverlof of
      een andere periode van langdurig buitengewoon verlof, met ingang van de eerste dag van en voor de duur van die
      afwezigheid;

      b. bij onvoorziene afwezigheid van zes weken of langer, veroorzaakt door arbeidsongeschiktheid of
      ordemaatregel, met ingang van de eerste dag volgend op die periode van zes weken voor de duur van de resterende
      arbeidsongeschiktheid.

      7 De ambtenaar dient wijzigingen die van invloed zijn op de vaste tegemoetkoming onverwijld en schriftelijk door te
      geven aan het bevoegd gezag.

      8 Het bevoegd gezag kan de te veel betaalde tegemoetkoming terugvorderen, indien de ambtenaar nalaat de
      wijzigingen, bedoeld in het zevende lid, niet uiterlijk de eerste van de maand waarin de wijziging plaatsvindt door
      te geven, tenzij de ambtenaar aannemelijk heeft kunnen maken dat hij niet in staat was de wijziging tijdig door
      te geven.

      9 Geen aanspraak op tegemoetkoming dan wel een vergoeding in reiskosten bestaat indien de aanvraag of de declaratie
      van de in een kalendermaand gemaakte kosten niet binnen drie maanden na die kalendermaand bij het bevoegd gezag is
      ingediend, tenzij het overschrijden van de termijn niet aan de ambtenaar verwijtbaar is.


      [ref1]: https://wetten.overheid.nl/BWBR0024064#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0006516#Artikel10
