  - number: '2'
    text: |-
      Indien uit anderen hoofde aanspraak bestaat op een tegemoetkoming, vergoeding of voorziening voor de in dit besluit
      bedoelde uitgaven, wordt de tegemoetkoming, vergoeding of voorziening, bedoeld in dit besluit, slechts toegekend
      tot het bedrag, waarmee deze de eerstbedoelde aanspraak overschrijdt.
    url: https://wetten.overheid.nl/BWBR0024064/2012-02-03#Artikel2
  - number: '3'
    text: |-
      1 De ambtenaar heeft aanspraak op een tegemoetkoming in de kosten voor het dagelijks reizen tussen:

      a. de woning en de plaats van tewerkstelling;

      b. de woning en de aangewezen meerdere plaatsen van tewerkstelling, indien aan
      de ambtenaar meerdere plaatsen van tewerkstelling zijn aangewezen als bedoeld in
      [artikel 10, tweede lid, van het Besluit algemene rechtspositie politie][ref1];

      c. de tijdelijke huisvesting en de plaats van tewerkstelling, indien aan de ambtenaar de verhuisplicht is opgelegd
      en hij tijdelijk elders is gehuisvest nabij zijn plaats van tewerkstelling;

      d. de tijdelijke huisvesting of de woning en de plaats van tewerkstelling, indien het een ambtenaar betreft tijdens
      de initiële opleiding.

      2 De ambtenaar maakt eenmaal per kalenderjaar de keuze of hij voor de reizen als bedoeld in het eerste lid
      aanspraak maakt op:

      a. een tegemoetkoming voor openbaar vervoer als bedoeld in [artikel 4][ref2] of

      b. een tegemoetkoming voor eigen vervoer al of niet in combinatie met openbaar vervoer als bedoeld in
      [artikel 6][ref3].

      3 Bij wijziging van plaats van tewerkstelling, werktijden of woonplaats wordt de ambtenaar in de gelegenheid
      gesteld zijn keuze tussentijds te herzien.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0024064#Artikel4
