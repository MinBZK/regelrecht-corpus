  - number: '31'
    text: |-
      1 De aanvraag voor tegemoetkoming in de verhuiskosten dient vóór de datum van verhuizing bij het bevoegd gezag te
      zijn ingediend.

      2 De ambtenaar die het transport van zijn inboedel door een verhuizer laat verzorgen, laat het transport uitvoeren
      op de voor het bevoegd gezag minst kostbare wijze.

      3 Het bevoegd gezag kan in afwijking van het tweede lid één verhuizer aanwijzen.

      4 De ambtenaar die het transport van zijn inboedel in eigen beheer uitvoert, heeft aanspraak op een tegemoetkoming
      in huur- en brandstofkosten van een bestel- of vrachtauto.

      5 Indien het transport van zijn inboedel in eigen beheer anders dan op de wijze, bedoeld in het vierde lid,
      plaatsvindt, bestaat er aanspraak op een vergoeding van € 0,18 per kilometer, met dien verstande dat niet meer dan
      twee ritten van en naar de nieuwe woning worden vergoed.

      6 De ambtenaar declareert de op grond van het vierde en vijfde lid gemaakte huurkosten van een auto, vergezeld van
      de rekening van het verhuurbedrijf, binnen zes maanden bij het bevoegd gezag.

      7 De ambtenaar declareert de kosten van verhuizing en, indien van toepassing, de kosten van dubbele woonlasten zo
      spoedig mogelijk doch maximaal zes maanden na de verhuizing onder overlegging van de desbetreffende rekeningen en
      opgevraagde offertes.
    url: https://wetten.overheid.nl/BWBR0024064/2012-02-03#Artikel31
  - number: '35'
    text: |-
      Onze Minister kan in afwijking van dit besluit nadere regels vaststellen ten aanzien van een door hem aan te wijzen
      groep van ambtenaren, indien de afwijking strekt tot het vermijden van onbillijkheden van overwegende aard welke
      uit de toepassing van deze regels zouden voortkomen.
    url: https://wetten.overheid.nl/BWBR0024064/2012-02-03#Artikel35
  - number: '36'
    text: |-
      1 Voor het vaststellen van alle reisafstanden in dit besluit, wordt gebruik gemaakt van een door Onze Minister
      aangewezen routeplanner.

      2 De routeplanner wordt met inachtneming van de volgende bepalingen gebruikt:

      a. de snelste route van de routeplanner bepalend is;

      b. de afstand wordt gemeten met behulp van de postcodes en bestemmingsnummers van het begin- en eindpunt van één
      van de trajecten als bedoeld in dit besluit;

      c. de route niet leidt over zandwegen, karrensporen of keienpaden tenzij dit onvermijdelijk is;

      d. het naleven van verkeersregels staat voorop bij het bepalen van de snelste route;

      e. de tijd dat de ambtenaar verblijft op een veer wordt meegerekend bij het bepalen van de snelste route;

      f. indien bij het verschijnen van een nieuwe versie van de routeplanner, de route een gewijzigde reisafstand geeft,
      is die reisafstand bepalend voor de aanspraak.
    url: https://wetten.overheid.nl/BWBR0024064/2012-02-03#Artikel36
  - number: '37'
    text: |-
      Het bevoegd gezag kan besluiten om in individuele gevallen af te wijken van het gestelde in dit besluit, indien de
      afwijking strekt tot het vermijden van onbillijkheden van overwegende aard welke uit de toepassing van deze regels
      zouden voortkomen.
    url: https://wetten.overheid.nl/BWBR0024064/2012-02-03#Artikel37
  - number: '38'
    text: |-
      1 De bedragen, genoemd in de [artikelen 13, tweede lid][ref1], [14, eerste lid][ref2], en [14a, eerste lid][ref3],
      worden per 1 januari van elk kalenderjaar bij ministeriële regeling gewijzigd, overeenkomstig de geschoonde
      consumentenprijsindex voor restaurants en accommodaties, vastgesteld door het Centraal bureau voor de statistiek.

      2 De [bijlage][ref4], bedoeld in [artikel 22, tweede lid][ref5], wordt per 1 april en 1 oktober van elk
      kalenderjaar bij ministeriële regeling gewijzigd, overeenkomstig de Schedules of Daily Subsistence Allowance Rates
      van de Verenigde Naties van 1 januari respectievelijk 1 juli van dat kalenderjaar.


