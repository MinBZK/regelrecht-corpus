  - number: 14a
    text: |-
      1 De aspirant heeft aanspraak op vergoeding van kosten voor tijdelijke huisvesting, die gelijk is aan 90% van het
      bedrag van de werkelijk gemaakte kosten met een maximum van € 344,76 per maand, indien:

      a. naar het oordeel van het bevoegd gezag de aspirant niet dagelijks heen en weer kan reizen tussen de woning en de
      plaats waar de initiële opleiding wordt gevolgd; en

      b. het bevoegd gezag geen voorziening voor verblijf in de omgeving van de plaats waar de initiële opleiding wordt
      gevolgd, aan de aspirant verstrekt.

      2 De aspirant, bedoeld in het eerste lid, heeft maximaal eenmaal per week aanspraak op een tegemoetkoming in de
      reiskosten naar zijn oorspronkelijke woning. De tegemoetkoming is gelijk aan de kosten voor openbaar vervoer in de
      tweede vervoersklasse of, bij gebruik van eigen vervoer, € 0,18 per kilometer.

      3 Indien de aspirant een vervoersbewijs wenst op basis van eerste klasse of indien de aspirant een vervoersbewijs
      wenst welke ruimere mogelijkheden biedt dan bedoeld in het tweede lid, komen de meerkosten hiervan voor rekening
      van de aspirant.

      4 De vergoedingen, bedoeld in het eerste en tweede lid, worden verstrekt op basis van overgelegde bewijsstukken.
    url: https://wetten.overheid.nl/BWBR0024064/2012-02-03#Artikel14a
  - number: '15'
    text: |-
      1 De ambtenaar declareert de reis- en verblijfkosten op de voorgeschreven wijze onder overlegging van de vereiste
      bewijsstukken.

      2 Indien blijkt dat bij de ingediende reisdeclaratie is afgeweken van de regels in dit besluit, wordt de
      reisdeclaratie ambtshalve gewijzigd en wordt het bedrag waarop aanspraak kan worden gemaakt, bepaald naar die op de
      reisdeclaratie ambtshalve gewijzigde gegevens.

      3 Geen aanspraak op een vergoeding van reiskosten bestaat indien de declaratie van de in een kalendermaand gemaakte
      kosten niet binnen drie maanden na die kalendermaand bij het bevoegd gezag is ingediend, tenzij het overschrijden
      van de termijn niet aan de ambtenaar verwijtbaar is.
    url: https://wetten.overheid.nl/BWBR0024064/2012-02-03#Artikel15
  - number: '16'
    text: |-
      Onder dienstreis wordt in deze paragraaf verstaan: een reis naar, in of uit het buitenland wanneer daartoe door
      het bevoegd gezag een opdracht is gegeven. In bijzondere gevallen kan een dergelijke opdracht ook achteraf worden
      gegeven.
    url: https://wetten.overheid.nl/BWBR0024064/2012-02-03#Artikel16
  - number: '17'
    text: |-
      De ambtenaar maakt bij een dienstreis gebruik van één of meer van de volgende vervoermiddelen:

      a. vliegtuig, boot of openbaar vervoer;

      b. het door het bevoegd gezag ter beschikking gestelde vervoermiddel;

      c. gehuurd vervoermiddel of taxi.
    url: https://wetten.overheid.nl/BWBR0024064/2012-02-03#Artikel17
  - number: '18'
    text: |-
      1 Bij gebruik van vliegtuig, boot en openbaar vervoer worden de reiskosten die in verband met de dienstreis
      noodzakelijkerwijs zijn gemaakt op basis van de overgelegde bewijsstukken vergoed.

      2 Bij gebruik van een vliegtuig, boot of openbaar vervoer mag als volgt worden gereisd:

      a. een vliegreis binnen Europa: in economy class;

      b. een vliegreis buiten Europa: in business class;

      c. bij gebruik van een boot of openbaar vervoer met vervoerklassen: de hoogste klasse.

      3 Indien het dienstbelang of de reisomstandigheden daartoe aanleiding geven, worden tevens als reiskosten vergoed:

      a. toeslag voor bijzondere treinen;

      b. plaatsreserveringskosten in treinen;

      c. kosten voor het gebruik van een slaapwagen;

      d. kosten voor slaapgelegenheid op een boot;

      e. extra kosten voor bagage;

      f. kosten van het vervoer van het station, de haven of het vliegveld van aankomst naar de plaats van bestemming op
      de heen- en terugreis;

      g. kosten van luchthavenrechten;

      h. kosten voor het verkrijgen van een voor de dienstreis noodzakelijk visum.
    url: https://wetten.overheid.nl/BWBR0024064/2012-02-03#Artikel18
  - number: '19'
    text: |-
      Indien het bevoegd gezag aan de ambtenaar een vervoermiddel ter beschikking stelt, maakt de ambtenaar van het
      desbetreffende vervoermiddel gebruik, tenzij dit redelijkerwijs niet van hem kan worden gevergd. De werkelijk
      gemaakte kosten bij het gebruik van een ter beschikking gesteld vervoermiddel worden aan de ambtenaar vergoed op
      basis van overgelegde bewijsstukken.
    url: https://wetten.overheid.nl/BWBR0024064/2012-02-03#Artikel19
  - number: '20'
    text: |-
      Indien het noodzakelijk is dat de ambtenaar tijdens de dienstreis gebruik maakt van openbaar vervoer, een gehuurd
      vervoermiddel of een taxi, worden de hieraan verbonden kosten aan de ambtenaar vergoed op basis van overgelegde
      bewijsstukken.
    url: https://wetten.overheid.nl/BWBR0024064/2012-02-03#Artikel20
  - number: '21'
    text: |-
      1 Aan de ambtenaar kan bij een dienstreis van minimaal drie maanden toestemming worden verleend om met gebruik van
      openbaar vervoer, vliegtuig, boot of eigen vervoer, voor één of meer bezoeken van korte duur naar zijn woonplaats
      terug te keren.

      2 Aan de ambtenaar worden de reiskosten als volgt vergoed:

      a. bij vliegtuig: economy class;

      b. bij openbaar vervoer of een boot: de laagste vervoersklasse.

      3 [Artikel 18, derde lid, onderdelen a tot en met f][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0024064#Artikel18
