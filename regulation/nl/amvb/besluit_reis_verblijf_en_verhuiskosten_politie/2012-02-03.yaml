  - number: '13'
    text: |-
      1 Aan de ambtenaar wordt bij een dienstreis langer dan vier uren een vergoeding toegekend voor tijdens die
      dienstreis gemaakte verblijfkosten.

      2 De maximale vergoeding in verblijfkosten als bedoeld in het eerste lid kan uit zes componenten bestaan, voor
      ieder etmaal dat de dienstreis duurt:

      a. de dagcomponent voor kleine uitgave overdag: € 4,33;

      b. de avondcomponent voor kleine uitgave ’s avonds, mits de ambtenaar voor de dienstreis elders moet overnachten:
      € 12,95;

      c. de lunchcomponent, als de periode tussen 12.00 en 14.00 uur in de dienstreis valt: € 13,63;

      d. de dinercomponent als de ambtenaar tussen 17.00 uur en 20.00 uur niet thuis kan eten omdat de dienstreis in die
      tijd valt: € 20,62 voor een diner;

      e. de logiescomponent, mits de ambtenaar voor de dienstreis elders moet overnachten: € 83,42;

      f. de ontbijtcomponent, mits de ambtenaar voor de dienstreis elders moet overnachten: € 8,15.

      3 De ambtenaar heeft geen aanspraak op een vergoeding in de verblijfkosten als bedoeld in het tweede lid, onderdeel
      c, wanneer de ambtenaar in de gelegenheid is een al of niet meegebrachte maaltijd te eten in een bedrijfskantine
      binnen een gebouw van de politieorganisatie, het LSOP of een voorziening tot samenwerking.

      4 Voor vergoedingen op basis van het tweede lid, onderdelen c, d, e en f geldt dat, met inachtneming van de
      maximale bedragen genoemd in het tweede lid, de werkelijk gemaakte kosten worden vergoed op basis van overgelegde
      bewijsstukken.

      5 Bij een meerdaagse dienstreis kan de avondcomponent niet langer dan voor de eerste tien avonden volledig worden
      toegekend. Voor iedere etmaal dat de dienstreis langer duurt wordt het bedrag van de avondcomponent gehalveerd.
    url: https://wetten.overheid.nl/BWBR0024064/2012-02-03#Artikel13
  - number: '14'
    text: |-
      1 Indien een ambtenaar overeenkomstig [artikel 62 van het Besluit algemene rechtspositie politie][ref1] wordt
      gedetacheerd en op een andere plaats van tewerkstelling werkzaam is, en indien dagelijks heen en weer reizen tussen
      de woning en de plaats van tijdelijke tewerkstelling naar het oordeel van het bevoegd gezag niet mogelijk is,
      heeft de ambtenaar aanspraak op vergoeding van kosten voor logies, welke gelijk is aan het bedrag van de werkelijke
      gemaakte kosten met een maximum van € 83,42 per dag, op basis van overgelegde bewijsstukken.

      2 In geval van een situatie als bedoeld in het eerste lid heeft de ambtenaar tevens aanspraak op een tegemoetkoming
      in de kosten voor maaltijden en kleine uitgaven. Deze tegemoetkoming is gelijk aan 50% van de kosten met een
      maximum van 50% van de tegemoetkoming als bedoeld in [artikel 13][ref2] van dit besluit.

      3 De ambtenaar, bedoeld in het eerste lid, heeft maximaal eenmaal per week aanspraak op een tegemoetkoming in de
      reiskosten naar zijn oorspronkelijke woning. De tegemoetkoming is gelijk aan de kosten voor openbaar vervoer in de
      tweede vervoersklasse of, bij gebruik van eigen vervoer € 0,18 per kilometer.

      4 Indien de ambtenaar een vervoersbewijs wenst op basis van eerste klasse of indien de ambtenaar een vervoersbewijs
      wenst welke ruimere mogelijkheden biedt dan bedoeld in het derde lid, komen de meerkosten hiervan voor rekening van
      de ambtenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel62
      [ref2]: https://wetten.overheid.nl/BWBR0024064#Artikel13
