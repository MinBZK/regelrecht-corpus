  - number: '5'
    text: |-
      1 De ambtenaar, aan wie een tegemoetkoming of een vervoersbewijs is verstrekt als bedoeld in [artikel 4][ref1]
      dient zijn vervoersbewijzen direct na afloop van de geldigheid in te leveren bij het bevoegd gezag.

      2 De ambtenaar, bedoeld in het eerste lid, dient wijzigingen die van invloed zijn op het vervoersbewijs of de
      hoogte van de tegemoetkoming onverwijld en schriftelijk door te geven aan het bevoegd gezag.

      3 Indien de ambtenaar, bedoeld in het eerste lid, nalaat de wijzigingen, bedoeld in het tweede lid, niet uiterlijk
      de eerste van de maand waarin de wijziging plaatsvindt door te geven, kan het bevoegd gezag de teveel gemaakte
      kosten terugvorderen, tenzij de ambtenaar aannemelijk heeft kunnen maken dat hij niet in staat was de wijziging
      tijdig door te geven.

      4 Indien de ambtenaar, aan wie een vervoersbewijs is verstrekt als bedoeld in het eerste lid, voorziet dat hij
      twee maanden of langer afwezig is, wordt het verstrekte vervoersbewijs of combinatie van vervoersbewijzen vóór de
      periode van afwezigheid ingeleverd bij het bevoegd gezag.

      5 Indien de ambtenaar, aan wie een vervoersbewijs is verstrekt als bedoeld in het eerste lid, onvoorzien langer
      dan twee maanden afwezig is, wordt het verstrekte vervoersbewijs of combinatie van vervoersbewijzen direct na twee
      maanden van afwezigheid ingeleverd bij het bevoegd gezag.

      6 Indien de afwezigheid van de ambtenaar wordt veroorzaakt door de dienst, draagt het bevoegd gezag zorg voor
      inname van het vervoersbewijs.


      [ref1]: https://wetten.overheid.nl/BWBR0024064#Artikel4
