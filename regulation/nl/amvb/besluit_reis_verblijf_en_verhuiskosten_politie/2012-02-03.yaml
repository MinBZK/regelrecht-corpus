  - number: '30'
    text: |-
      1 De berekeningsbasis voor de tegemoetkoming in de verhuiskosten, bedoeld in [artikel 29][ref1], is het
      twaalfvoud van de bezoldiging in de zin van het [Besluit bezoldiging politie][ref2] die de ambtenaar
      geniet op het berekeningstijdstip, vermeerderd met de aanspraak op de vakantie-uitkering, bedoeld
      in [artikel 23 van het Besluit bezoldiging politie][ref3], en de eindejaarsuitkering, bedoeld in
      [artikel 25b van het Besluit bezoldiging politie][ref4]. Indien er sprake is van gehele of gedeeltelijke
      werkloosheid of arbeidsongeschiktheid, dan wel prepensionering of levensloopverlof geldt de bezoldiging
      zoals die zou zijn genoten indien er geen sprake was geweest van gehele of gedeeltelijke werkloosheid of
      arbeidsongeschiktheid, dan wel prepensionering of levensloopverlof.

      2 Het berekeningstijdstip voor de tegemoetkoming in de verhuiskosten is de datum waarop de ambtenaar verhuist
      óf, als de ambtenaar is verhuisd vóór de datum dat de functie feitelijk wordt vervuld, de datum van ingang van de
      functievervulling óf bij het overlijden dan wel ontslag van de ambtenaar de datum waarop laatstelijk bezoldiging
      werd genoten.

      3 Voor de toepassing van de in het eerste lid bedoelde berekeningsbasis wordt, indien de ambtenaar een toelage
      geniet als bedoeld in de [artikelen 14][ref5], [15][ref6] of [18 van het Besluit bezoldiging politie][ref7] dit
      bezoldigingsdeel vastgesteld op het bedrag dat de ambtenaar gedurende de drie kalendermaanden voorafgaande aan het
      berekeningstijdstip gemiddeld per maand aan deze toelagen heeft genoten.

      4 Indien de ambtenaar en zijn echtgenoot of echtgenote beiden in aanmerking komen voor een tegemoetkoming in de
      verhuiskosten, wordt aan beide echtgenoten een evenredig deel van de tegemoetkoming toegekend, berekend over het
      gemiddelde van de gezamenlijke berekeningsgrondslag.

      5 De tegemoetkoming in de verhuiskosten op grond van dit besluit, wordt voor de ambtenaar die voor het eerst is
      aangesteld, verminderd met 50%.


