        artikel: '29'
        hoofdstuk: IV
  - number: '29'
    text: |-
      1 De tegemoetkoming in verhuiskosten, voor een verhuizing binnen Nederland, bestaat uit een bedrag voor:

      a. de kosten van transport van de bagage en van de inboedel van de ambtenaar en zijn gezinsleden naar de nieuwe
      woning;

      b. de kosten van het in- en uitpakken van de gehele inboedel evenals de kosten van demontage en montage van het
      meubilair;

      c. de noodzakelijk te maken dubbele woonkosten tot maximaal € 600,00 per maand voor een periode van maximaal vier
      maanden en uitgaande van de kosten van de oude woning;

      d. alle andere direct uit de verhuizing voortvloeiende kosten.

      2 Voor het vaststellen van de tegemoetkoming, bedoeld in het eerste lid, onderdeel d, geldt:

      a. het bedrag wordt gesteld op 3% van de berekeningsbasis, bedoeld in [artikel 30][ref1], voor ieder woon- of
      slaapvertrek tot een maximum van vier vertrekken die de oude woning telt;

      b. de tegemoetkoming bedraagt maximaal € 5.445,00.

      3 Geen aanspraak op een tegemoetkoming als bedoeld in het eerste lid, onderdeel d, bestaat indien de ambtenaar geen
      eigen huishouding voert.

      4 Voor de ambtenaar die geen eigen huishouding voert en indien bijzondere omstandigheden daartoe aanleiding
      geven, kan door het bevoegd gezag voor deze kosten niettemin een tegemoetkoming worden toegekend van 3% van de
      berekeningsbasis, als bedoeld in [artikel 30][ref2].

      5 Indien aan de ambtenaar door het bevoegd gezag is medegedeeld dat de verplaatsing maximaal twee jaren zal duren,
      bestaat slechts aanspraak op vergoeding van transportkosten van de bagage. Voorts kan het bevoegd gezag, indien
      bijzondere omstandigheden daartoe aanleiding geven, een tegemoetkoming als bedoeld in eerste lid, onderdeel d,
      toekennen van 3% van de berekeningsbasis als bedoeld in [artikel 30][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0024064#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0024064#Artikel30
      [ref3]: https://wetten.overheid.nl/BWBR0024064#Artikel30
