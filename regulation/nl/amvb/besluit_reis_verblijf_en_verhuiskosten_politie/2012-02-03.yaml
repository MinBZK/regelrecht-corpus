  - number: '4'
    text: |-
      1 Voor reizen als bedoeld in [artikel 3, tweede lid, onderdeel a][ref1], wordt door het bevoegd gezag een
      vervoersbewijs of een combinatie van vervoersbewijzen verstrekt op basis van het tarief van de tweede klasse van
      het betreffende openbaar vervoer voor één van de trajecten, bedoeld in [artikel 3, eerste lid][ref2].

      2 Het bevoegd gezag kan in plaats van het gestelde in het eerste lid een tegemoetkoming verstrekken welke gelijk
      is aan de gemaakte kosten van openbaar vervoer op basis van het tarief van de tweede klasse van het betreffende
      openbaar vervoer voor één van de trajecten, bedoeld in [artikel 3, eerste lid][ref3].

      3 Indien de ambtenaar een vervoersbewijs wenst op basis van eerste klasse of indien de ambtenaar een vervoersbewijs
      wenst welke ruimere mogelijkheden biedt dan bedoeld in het eerste lid, komen de meerkosten hiervan voor rekening
      van de ambtenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0024064#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0024064#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0024064#Artikel3
