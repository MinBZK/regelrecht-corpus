        artikel: '10'
  - number: '9'
    text: |-
      1 Voor de tegemoetkoming in reis- en verblijfkosten wordt uitgegaan van de plaats van tewerkstelling als begin- en
      eindpunt van een dienstreis.

      2 Het bevoegd gezag kan van het gestelde in het eerste lid afwijken door de woning van de ambtenaar als begin- en/
      of eindpunt van de dienstreis aan te wijzen.
    url: https://wetten.overheid.nl/BWBR0024064/2012-02-03#Artikel9
  - number: '10'
    text: |-
      1 Wordt de dienstreis gemaakt met een door de dienst beschikbaar gesteld vervoermiddel, dan heeft de ambtenaar geen
      aanspraak op een tegemoetkoming in de reiskosten.

      2 Het bevoegd gezag en de ambtenaar kunnen overeenkomen dat het door de dienst beschikbaar gesteld vervoermiddel,
      bedoeld in het eerste lid, een fiets is.

      3 Het bevoegd gezag kan bepalen dat de ambtenaar tijdens de dienstreis gebruik maakt van een door het bevoegd
      gezag gehuurd vervoermiddel of een taxi. De hieraan verbonden kosten worden aan de ambtenaar vergoed op basis van
      overgelegde bewijsstukken.

      4 Indien de ambtenaar gebruik maakt van een dienstvoertuig of een door de dienst gehuurd vervoermiddel en er
      tijdens de dienstreis parkeer-, brug-, tol-, of veerkosten worden gemaakt, worden de gemaakte kosten volledig
      vergoed op basis van overgelegde bewijsstukken.
    url: https://wetten.overheid.nl/BWBR0024064/2012-02-03#Artikel10
  - number: '11'
    text: |-
      1 Indien er geen door de dienst beschikbaar gesteld vervoermiddel voorhanden is, wordt de dienstreis met openbaar
      vervoer gemaakt. De ambtenaar kan gebruikmaken van de eerste vervoersklasse.

      2 Indien het noodzakelijk is, dat tijdens een dienstreis vóór of na gebruik van het openbaar vervoer gebruik wordt
      gemaakt van een taxi of eigen vervoer, worden deze kosten eveneens vergoed.

      3 De vergoeding van de kosten, bedoeld in het eerste en tweede lid, bedraagt:

      a. voor het openbaar vervoer, de werkelijk gemaakte kosten op basis van de overgelegde bewijsstukken;

      b. voor een taxi, de werkelijk gemaakte kosten op basis van de overgelegde bewijsstukken;

      c. voor het eigen motorvoertuig, € 0,28 per kilometer;

      d. voor het gebruik van een fiets of bromfiets, € 0,18 per kilometer.
    url: https://wetten.overheid.nl/BWBR0024064/2012-02-03#Artikel11
  - number: '12'
    text: |-
      1 In afwijking van de [artikelen 10][ref1] en [11][ref2] en indien door het bevoegd gezag aan de ambtenaar is
      verzocht voor het maken van de dienstreis gebruik te maken van een eigen vervoermiddel en de ambtenaar heeft
      hiermee ingestemd, ontvangt de ambtenaar per afgelegde kilometer een vergoeding van:

      a. € 0,28 voor het gebruik van een eigen motorvoertuig;

      b. € 0,18 voor het gebruik van een eigen fiets of bromfiets.

      2 Indien de ambtenaar overeenkomstig het eerste lid gebruik maakt van een eigen motorvoertuig en er tijdens de
      dienstreis parkeer-, brug-, tol-, of veerkosten worden gemaakt, worden de gemaakte kosten volledig vergoed op basis
      van overgelegde bewijsstukken.

      3 Indien door de ambtenaar aan het bevoegd gezag is verzocht om voor het maken van de dienstreis gebruik te maken
      van een eigen motorvoertuig, fiets of bromfiets, terwijl het bevoegd gezag in vervoer kan voorzien dan wel gebruik
      kan worden gemaakt van het openbaar vervoer, en de ambtenaar heeft hiervoor toestemming gekregen, ontvangt de
      ambtenaar per afgelegde kilometer een vergoeding van € 0,09.


      [ref1]: https://wetten.overheid.nl/BWBR0024064#Artikel10
