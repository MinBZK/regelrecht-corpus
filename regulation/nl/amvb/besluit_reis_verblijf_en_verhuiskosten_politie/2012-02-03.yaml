  - number: '6'
    text: |-
      1 Voor reizen waarbij gebruik wordt gemaakt van eigen vervoer en voor iedere combinatie van reizen met openbaar
      vervoer en reizen met eigen vervoer, wordt een tegemoetkoming van € 0,15 per afgelegde kilometer verstrekt.

      2 Voor de tegemoetkoming, bedoeld in het eerste lid, geldt een maximum van 120 kilometer per enkele reis, met een
      maximum van 240 kilometer, heen- en terugreis, per dienst.

      3 In afwijking van het eerste en tweede lid wordt aan de ambtenaar, die geleider is van een politiesurveillancehond
      of een politiespeurhond, die niet de beschikking heeft over een dienstvoertuig, en voor wie het noodzakelijk is
      dat hij in het kader van zijn dienstuitoefening met een politiesurveillancehond of een politiespeurhond met eigen
      vervoer reist, voor de afstand tussen de woning en de plaats van tewerkstelling of oefenterrein een tegemoetkoming
      van € 0,28 per afgelegde kilometer verstrekt.

      4 Indien één van de trajecten als bedoeld in [artikel 3, eerste lid][ref1], leidt over een brug, veer of weg
      waarvoor brug-, veer-, of tolgeld moet worden betaald, worden de daarvoor werkelijk gemaakte kosten volledig
      vergoed op basis van overgelegde bewijsstukken.

      5

      6 Bij ministeriële regeling kan in geval van een reorganisatie als bedoeld in
      [hoofdstuk VII.b van het Besluit algemene rechtspositie politie][ref2], van de beperking van het maximum aantal
      kilometers enkele reis, zoals bedoeld in het tweede lid, worden afgeweken ter voorkoming van negatieve financiële
      gevolgen voor de ambtenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0024064#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0006516#HoofdstukVII.b
