  - number: '2'
    text: |-
      Indien uit anderen hoofde aanspraak bestaat op een tegemoetkoming, vergoeding of voorziening voor de in dit besluit
      bedoelde uitgaven, wordt de tegemoetkoming, vergoeding of voorziening, bedoeld in dit besluit, slechts toegekend
      tot het bedrag, waarmee deze de eerstbedoelde aanspraak overschrijdt.
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel2
  - number: '3.1'
    text: 'De ambtenaar heeft aanspraak op een tegemoetkoming in de kosten voor het dagelijks reizen tussen:'
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel3
  - number: 3.1.a
    text: de woning en de plaats van tewerkstelling;
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel3
  - number: 3.1.b
    text: |-
      de woning en een door de ambtenaar gekozen andere locatie, waar hij zijn werkzaamheden verricht, dan de plaats
      van tewerkstelling;
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel3
  - number: 3.1.c
    text: |-
      de woning en de aangewezen meerdere plaatsen van tewerkstelling, indien aan de
      ambtenaar meerdere plaatsen van tewerkstelling zijn aangewezen als bedoeld in
      [artikel 10, tweede lid, van het Besluit algemene rechtspositie politie][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel10
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '10'
  - number: 3.1.d
    text: |-
      de tijdelijke huisvesting en de plaats van tewerkstelling, indien aan de ambtenaar de verhuisplicht is opgelegd en
      hij tijdelijk elders is gehuisvest nabij zijn plaats van tewerkstelling;
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel3
  - number: 3.1.e
    text: |-
      de tijdelijke huisvesting of de woning en de plaats van tewerkstelling, indien het een ambtenaar betreft tijdens de
      initiële opleiding.
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel3
  - number: '3.2'
    text: |-
      De ambtenaar kan voor de reizen, bedoeld in het eerste lid, onder de voorwaarden genoemd in dit besluit aanspraak
      maken op een tegemoetkoming in de kosten voor:
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel3
  - number: 3.2.a)
    text: openbaar vervoer;
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel3
  - number: 3.2.b)
    text: eigen vervoer dan wel;
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel3
  - number: 3.2.c)
    text: een combinatie van openbaar vervoer en eigen vervoer.
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel3
  - number: '4.1'
    text: |-
      Voor reizen, als bedoeld in [artikel 3, tweede lid, onderdelen a en c][ref1], verstrekt het bevoegd gezag een
      vervoersbewijs op basis van het tarief van de tweede klasse.


      [ref1]: https://wetten.overheid.nl/BWBR0024064#Artikel3
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0024064
        artikel: '3'
        hoofdstuk: II
        paragraaf: '1'
  - number: '4.2'
    text: |-
      Indien de ambtenaar een vervoersbewijs wenst op basis van eerste klasse of indien de ambtenaar een vervoersbewijs
      wenst welke ruimere mogelijkheden biedt dan bedoeld in het eerste lid, komen de meerkosten hiervan voor rekening
      van de ambtenaar.
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel4
  - number: '4.3'
    text: |-
      Behalve voor de reizen, bedoeld in het eerste lid, gebruikt de ambtenaar het vervoersbewijs ter voldoening van de
      gemaakte kosten voor:
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel4
  - number: 4.3.a
    text: |-
      een door hem gebruikte OV-fiets voor het traject tussen de openbaar vervoer locatie en de werklocatie voor reizen
      als bedoeld in [artikel 3, tweede lid, onderdelen a en c][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0024064#Artikel3
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0024064
        artikel: '3'
        hoofdstuk: II
        paragraaf: '1'
  - number: 4.3.b
    text: |-
      de stalling van een fiets bij een openbaar vervoer locatie bij reizen als bedoeld in
      [artikel 3, tweede lid, onderdeel c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024064#Artikel3
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0024064
        artikel: '3'
        hoofdstuk: II
        paragraaf: '1'
  - number: '4.4'
    text: |-
      In het geval de ambtenaar niet beschikt over het vervoersbewijs, bedoeld in het eerste lid, kan het bevoegd gezag
      de ambtenaar de door hem op grond van het eerste en derde lid gemaakte kosten vergoeden.
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel4
  - number: '5.1'
    text: |-
      De ambtenaar, aan wie een tegemoetkoming of een vervoersbewijs is verstrekt als bedoeld in [artikel 4][ref1] dient
      zijn vervoersbewijzen direct na afloop van de geldigheid in te leveren bij het bevoegd gezag.


      [ref1]: https://wetten.overheid.nl/BWBR0024064#Artikel4
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0024064
        artikel: '4'
        hoofdstuk: II
        paragraaf: '2'
  - number: '5.2'
    text: |-
      De ambtenaar, bedoeld in het eerste lid, dient wijzigingen die van invloed zijn op het vervoersbewijs of de hoogte
      van de tegemoetkoming onverwijld en schriftelijk door te geven aan het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel5
  - number: '5.3'
    text: |-
      Indien de ambtenaar, bedoeld in het eerste lid, nalaat de wijzigingen, bedoeld in het tweede lid, niet uiterlijk de
      eerste van de maand waarin de wijziging plaatsvindt door te geven, kan het bevoegd gezag de teveel gemaakte kosten
      terugvorderen, tenzij de ambtenaar aannemelijk heeft kunnen maken dat hij niet in staat was de wijziging tijdig
      door te geven.
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel5
  - number: '5.4'
    text: |-
      Indien de ambtenaar, aan wie een vervoersbewijs is verstrekt als bedoeld in het eerste lid, voorziet dat hij
      twee maanden of langer afwezig is, wordt het verstrekte vervoersbewijs of combinatie van vervoersbewijzen vóór de
      periode van afwezigheid ingeleverd bij het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel5
  - number: '5.5'
    text: |-
      Indien de ambtenaar, aan wie een vervoersbewijs is verstrekt als bedoeld in het eerste lid, onvoorzien langer dan
      twee maanden afwezig is, wordt het verstrekte vervoersbewijs of combinatie van vervoersbewijzen direct na twee
      maanden van afwezigheid ingeleverd bij het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel5
  - number: '5.6'
    text: |-
      Indien de afwezigheid van de ambtenaar wordt veroorzaakt door de dienst, draagt het bevoegd gezag zorg voor inname
      van het vervoersbewijs.
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel5
  - number: '5.7'
    text: |-
      Indien de ambtenaar, bedoeld in het eerste lid, gebruik maakt van het openbaar vervoer wordt de reistijd boven
      een halfuur enkele reis aangemerkt als diensttijd, mits de ambtenaar aannemelijk heeft kunnen maken dat er
      werkzaamheden worden verricht.
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel5
  - number: '6.1'
    text: |-
      Voor reizen waarbij gebruik wordt gemaakt van eigen vervoer, wordt voor woon-werkverkeer een tegemoetkoming van
      € 0,23 per afgelegde kilometer verstrekt. Voor iedere combinatie van reizen met openbaar vervoer en reizen met
      eigen vervoer, wordt voor de afzonderlijke delen een vergoeding toegekend, gelijk aan de voor eigen vervoer en
      openbaar vervoer vastgestelde vergoedingen.
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel6
  - number: '6.2'
    text: |-
      Voor de tegemoetkoming, bedoeld in het eerste lid, geldt een maximum van 300 kilometer per enkele reis, heen- en
      terugreis, per dienst.
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel6
  - number: '6.3'
    text: |-
      In afwijking van het tweede lid geldt voor de ambtenaar, die geleider is van een surveillancehond of een
      politiespeurhond, die niet de beschikking heeft over een dienstvoertuig, en voor wie het noodzakelijk is dat hij in
      het kader van zijn dienstuitoefening met een surveillancehond of een politiespeurhond met eigen vervoer reist, voor
      de afstand tussen de woning en de plaats van tewerkstelling of oefenterrein het maximum van 300 km niet.
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel6
  - number: '6.4'
    text: |-
      Indien één van de trajecten als bedoeld in [artikel 3, eerste lid][ref1], leidt over een brug, veer of weg waarvoor
      brug-, veer-, of tolgeld moet worden betaald, worden de daarvoor werkelijk gemaakte kosten volledig vergoed op
      basis van overgelegde bewijsstukken.


      [ref1]: https://wetten.overheid.nl/BWBR0024064#Artikel3
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0024064
        artikel: '3'
        hoofdstuk: II
        paragraaf: '1'
  - number: '6.5'
    text: |-
      De tegemoetkoming voor reizen, bedoeld in [artikel 3, eerste lid, onderdeel b][ref1], bedraagt ten hoogste het
      bedrag van de tegemoetkoming voor reizen, bedoeld in artikel 3, eerste lid, onderdeel a.


      [ref1]: https://wetten.overheid.nl/BWBR0024064#Artikel3
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0024064
        artikel: '3'
        hoofdstuk: II
        paragraaf: '1'
  - number: '6.6'
    text: |-
      Bij ministeriële regeling kan in geval van een reorganisatie als bedoeld in
      [hoofdstuk VII.b van het Besluit algemene rechtspositie politie][ref1], van de beperking van het maximum aantal
      kilometers enkele reis, zoals bedoeld in het tweede lid, worden afgeweken ter voorkoming van negatieve financiële
      gevolgen voor de ambtenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#HoofdstukVII.b
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0006516
        hoofdstuk: VII.b
  - number: '7.1'
    text: |-
      De tegemoetkoming, bedoeld in [artikel 6][ref1], wordt toegekend op declaratiebasis, tenzij het bevoegd gezag
      bepaalt dat de tegemoetkoming als vaste tegemoetkoming per maand wordt toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0024064#Artikel6
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0024064
        artikel: '6'
        hoofdstuk: II
        paragraaf: '3'
  - number: '7.2'
    text: |-
      Bij de berekening van de vaste tegemoetkoming, bedoeld in het eerste lid, wordt bij een gemiddelde werkweek van
      vijf dagen uitgegaan van 206 werkdagen per kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel7
  - number: '7.3'
    text: Indien het aantal te werken dagen minder is dan vijf, wordt de vaste tegemoetkoming berekend naar rato.
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel7
  - number: '7.4'
    text: |-
      In het geval er sprake is van meerdere plaatsen van tewerkstelling, als bedoeld in
      [artikel 10, tweede lid, van het Besluit algemene rechtspositie politie][ref1] wordt de vaste tegemoetkoming per
      dienst bepaald door een gemiddelde afstand die de ambtenaar in een periode van vier weken moet afleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel10
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '10'
  - number: '7.5'
    text: |-
      Het bevoegd gezag kan van de termijn, bedoeld in het vierde lid, bij een aspirant, afwijken indien het meer voor de
      hand ligt om het gemiddelde per kwartiel te berekenen.
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel7
  - number: '7.6'
    text: 'De vaste tegemoetkoming wordt stopgezet:'
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel7
  - number: 7.6.a
    text: |-
      bij voorziene afwezigheid van zes weken of langer, veroorzaakt door zwangerschapsverlof, ouderschapsverlof of
      een andere periode van langdurig buitengewoon verlof, met ingang van de eerste dag van en voor de duur van die
      afwezigheid;
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel7
  - number: 7.6.b
    text: |-
      bij onvoorziene afwezigheid van zes weken of langer, veroorzaakt door arbeidsongeschiktheid of ordemaatregel, met
      ingang van de eerste dag volgend op die periode van zes weken voor de duur van de resterende arbeidsongeschiktheid.
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel7
  - number: '7.7'
    text: |-
      De ambtenaar dient wijzigingen die van invloed zijn op de vaste tegemoetkoming onverwijld en schriftelijk door te
      geven aan het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel7
  - number: '7.8'
    text: |-
      Het bevoegd gezag kan de te veel betaalde tegemoetkoming terugvorderen, indien de ambtenaar nalaat de wijzigingen,
      bedoeld in het zevende lid, niet uiterlijk de eerste van de maand waarin de wijziging plaatsvindt door te geven,
      tenzij de ambtenaar aannemelijk heeft kunnen maken dat hij niet in staat was de wijziging tijdig door te geven.
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel7
  - number: '7.9'
    text: |-
      Geen aanspraak op tegemoetkoming dan wel een vergoeding in reiskosten bestaat indien de aanvraag of de declaratie
      van de in een kalendermaand gemaakte kosten niet binnen drie maanden na die kalendermaand bij het bevoegd gezag is
      ingediend, tenzij het overschrijden van de termijn niet aan de ambtenaar verwijtbaar is.
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel7
  - number: '8.1'
    text: |-
      Onder dienstreis wordt in deze paragraaf verstaan: het door de ambtenaar, in het kader van zijn werkzaamheden,
      reizen en verblijven binnen Nederland en buiten de plaats van tewerkstelling, tenzij de ambtenaar kiest om zijn
      werkzaamheden te verrichten op een andere locatie dan de plaats van tewerkstelling.
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel8
  - number: '8.2'
    text: |-
      Indien aan de ambtenaar meerdere plaatsen van tewerkstelling zijn aangewezen op grond van
      [artikel 10, tweede lid, van het Besluit algemene rechtspositie politie][ref1], wordt wanneer de ambtenaar
      binnen één dienst reist tussen de aangewezen plaatsen van tewerkstelling, deze reis aangemerkt als dienstreis. De
      dienstreis eindigt in dit geval op het moment dat de ambtenaar zijn andere plaats van tewerkstelling heeft bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel10
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '10'
  - number: '8.3'
    text: |-
      Dienstreizen die binnen Nederland zijn begonnen, waarbij het reisgedeelte buiten Nederland gering is, of waarbij
      de grensoverschrijding niet leidt tot uitgaven voor maaltijden of overnachting in het buitenland worden eveneens
      aangemerkt als dienstreis.
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel8
  - number: '9.1'
    text: |-
      Voor de tegemoetkoming in reis- en verblijfkosten wordt uitgegaan van de plaats van tewerkstelling als begin- en
      eindpunt van een dienstreis.
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel9
  - number: '9.2'
    text: |-
      Het bevoegd gezag kan van het gestelde in het eerste lid afwijken door de woning van de ambtenaar als begin- en/of
      eindpunt van de dienstreis aan te wijzen.
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel9
  - number: '10.1'
    text: |-
      Wordt de dienstreis gemaakt met een door de dienst beschikbaar gesteld vervoermiddel, dan heeft de ambtenaar geen
      aanspraak op een tegemoetkoming in de reiskosten.
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel10
  - number: '10.2'
    text: |-
      Het bevoegd gezag en de ambtenaar kunnen overeenkomen dat het door de dienst beschikbaar gesteld vervoermiddel,
      bedoeld in het eerste lid, een fiets is.
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel10
  - number: '10.3'
    text: |-
      Het bevoegd gezag kan bepalen dat de ambtenaar tijdens de dienstreis gebruik maakt van een door het bevoegd
      gezag gehuurd vervoermiddel of een taxi. De hieraan verbonden kosten worden aan de ambtenaar vergoed op basis van
      overgelegde bewijsstukken.
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel10
  - number: '10.4'
    text: |-
      Indien de ambtenaar gebruik maakt van een dienstvoertuig of een door de dienst gehuurd vervoermiddel en er tijdens
      de dienstreis parkeer-, brug-, tol-, of veerkosten worden gemaakt, worden de gemaakte kosten volledig vergoed op
      basis van overgelegde bewijsstukken.
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel10
  - number: '11.1'
    text: |-
      Indien er geen door de dienst beschikbaar gesteld vervoermiddel voorhanden is, wordt de dienstreis met openbaar
      vervoer gemaakt met gebruikmaking van het vervoersbewijs, bedoeld in [artikel 4, eerste lid][ref1]. De ambtenaar
      kan gebruikmaken van de eerste vervoersklasse.


      [ref1]: https://wetten.overheid.nl/BWBR0024064#Artikel4
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0024064
        artikel: '4'
        hoofdstuk: II
        paragraaf: '2'
  - number: '11.2'
    text: |-
      Indien het noodzakelijk is, dat tijdens een dienstreis vóór of na gebruik van het openbaar vervoer gebruik wordt
      gemaakt van een taxi of eigen vervoer, worden deze kosten eveneens vergoed.
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel11
  - number: '11.3'
    text: 'De vergoeding van de kosten, bedoeld in het tweede lid, bedraagt:'
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel11
  - number: 11.3.a
    text: voor een taxi, de werkelijk gemaakte kosten op basis van de overgelegde bewijsstukken;
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel11
  - number: 11.3.b
    text: voor het gebruik van een eigen motorvoertuig dan wel eigen fiets of bromfiets, € 0,23 per kilometer.
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel11
  - number: '11.4'
    text: |-
      Behalve voor het reizen bedoeld in het eerste lid, gebruikt de ambtenaar het vervoersbewijs ter voldoening van de
      ten behoeve van de dienstreis gemaakte kosten voor:
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel11
  - number: 11.4.a
    text: een door hem gebruikte OV-fiets voor het traject tussen de openbaar vervoer locatie en de werklocatie;
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel11
  - number: 11.4.b
    text: de stalling van een fiets.
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel11
  - number: '11.5'
    text: |-
      In het geval de ambtenaar niet beschikt over het vervoersbewijs, bedoeld in het eerste lid, kan het bevoegd gezag
      de ambtenaar de door hem op grond van het eerste en vierde lid gemaakte kosten vergoeden.
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel11
  - number: '12.1'
    text: |-
      Indien door het bevoegd gezag aan de ambtenaar is verzocht voor het maken van de dienstreis gebruik te maken van
      een eigen vervoermiddel en de ambtenaar heeft hiermee ingestemd, ontvangt de ambtenaar per afgelegde kilometer een
      vergoeding van € 0,23 voor het gebruik van een eigen motorvoertuig dan wel eigen fiets of bromfiets.
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel12
  - number: '12.2'
    text: |-
      Indien de ambtenaar overeenkomstig het eerste lid gebruik maakt van een eigen motorvoertuig en er tijdens de
      dienstreis parkeer-, brug-, tol-, of veerkosten worden gemaakt, worden de gemaakte kosten volledig vergoed op basis
      van overgelegde bewijsstukken.
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel12
  - number: '13.1'
    text: |-
      Aan de ambtenaar wordt bij een dienstreis langer dan vier uren een vergoeding toegekend voor tijdens die dienstreis
      gemaakte verblijfkosten.
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel13
  - number: '13.2'
    text: |-
      De maximale vergoeding in verblijfkosten als bedoeld in het eerste lid kan uit vijf componenten bestaan, voor ieder
      etmaal dat de dienstreis duurt:
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel13
  - number: 13.2.a
    text: |-
      de avondcomponent voor kleine uitgave ’s avonds, mits de ambtenaar voor de dienstreis elders moet overnachten:
      € 20,97;
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel13
  - number: 13.2.b
    text: 'de lunchcomponent, als de periode tussen 12.00 en 14.00 uur in de dienstreis valt: € 21,65;'
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel13
  - number: 13.2.c
    text: |-
      de dinercomponent als de ambtenaar tussen 17.00 uur en 20.00 uur niet thuis kan eten omdat de dienstreis in die
      tijd valt: € 32,75 voor een diner;
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel13
  - number: 13.2.d
    text: 'de logiescomponent, mits de ambtenaar voor de dienstreis elders moet overnachten: € 146,45;'
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel13
  - number: 13.2.e
    text: 'de ontbijtcomponent, mits de ambtenaar voor de dienstreis elders moet overnachten: € 14,30.'
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel13
  - number: '13.3'
    text: |-
      De ambtenaar heeft geen aanspraak op een vergoeding in de verblijfkosten als bedoeld in het tweede lid, onderdeel
      b, wanneer de ambtenaar in de gelegenheid is een al of niet meegebrachte maaltijd te eten in een bedrijfskantine
      binnen een gebouw van de politieorganisatie.
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel13
  - number: '13.4'
    text: |-
      Voor vergoedingen op basis van het tweede lid, onderdelen b, c, d en e geldt dat, met inachtneming van de
      maximale bedragen genoemd in het tweede lid, de werkelijk gemaakte kosten worden vergoed op basis van overgelegde
      bewijsstukken.
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel13
  - number: '13.5'
    text: |-
      Bij een meerdaagse dienstreis kan de avondcomponent niet langer dan voor de eerste tien avonden volledig worden
      toegekend. Voor iedere etmaal dat de dienstreis langer duurt wordt het bedrag van de avondcomponent gehalveerd.
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel13
  - number: '14.1'
    text: |-
      Indien een ambtenaar overeenkomstig [artikel 62 van het Besluit algemene rechtspositie politie][ref1] wordt
      gedetacheerd en op een andere plaats van tewerkstelling werkzaam is, en indien dagelijks heen en weer reizen tussen
      de woning en de plaats van tijdelijke tewerkstelling naar het oordeel van het bevoegd gezag niet mogelijk is,
      heeft de ambtenaar aanspraak op vergoeding van kosten voor logies, welke gelijk is aan het bedrag van de werkelijke
      gemaakte kosten met een maximum van € 146,45 per dag, op basis van overgelegde bewijsstukken.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel62
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '62'
  - number: '14.2'
    text: |-
      In geval van een situatie als bedoeld in het eerste lid heeft de ambtenaar tevens aanspraak op een tegemoetkoming
      in de kosten voor maaltijden en kleine uitgaven. Deze tegemoetkoming is gelijk aan 50% van de kosten met een
      maximum van 50% van de tegemoetkoming als bedoeld in [artikel 13][ref1] van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0024064#Artikel13
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0024064
        artikel: '13'
        hoofdstuk: III
        paragraaf: '1'
  - number: '14.3'
    text: |-
      De ambtenaar, bedoeld in het eerste lid, heeft maximaal eenmaal per week aanspraak op een tegemoetkoming in de
      reiskosten naar zijn oorspronkelijke woning. De tegemoetkoming is gelijk aan de kosten voor openbaar vervoer in de
      tweede vervoersklasse of, bij gebruik van eigen vervoer € 0,23 per kilometer.
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel14
  - number: '14.4'
    text: |-
      Indien de ambtenaar een vervoersbewijs wenst op basis van eerste klasse of indien de ambtenaar een vervoersbewijs
      wenst welke ruimere mogelijkheden biedt dan bedoeld in het derde lid, komen de meerkosten hiervan voor rekening van
      de ambtenaar.
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel14
  - number: 14a.1
    text: |-
      De aspirant heeft aanspraak op vergoeding van kosten voor tijdelijke huisvesting, die gelijk is aan 90% van het
      bedrag van de werkelijk gemaakte kosten met een maximum van € 605,32 per maand, indien:
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel14a
  - number: 14a.1.a
    text: |-
      naar het oordeel van het bevoegd gezag de aspirant niet dagelijks heen en weer kan reizen tussen de woning en
      de plaats waar een krachtens [artikel 2c, eerste lid, van het Besluit algemene rechtspositie][ref1] aangewezen
      politieopleiding wordt gevolgd; en


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel2c
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: 2c
  - number: 14a.1.b
    text: |-
      het bevoegd gezag geen voorziening voor verblijf in de omgeving van de plaats waar deze politieopleiding wordt
      gevolgd, aan de aspirant verstrekt.
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel14a
  - number: 14a.2
    text: |-
      De aspirant, bedoeld in het eerste lid, heeft maximaal eenmaal per week aanspraak op een tegemoetkoming in de
      reiskosten naar zijn oorspronkelijke woning. De tegemoetkoming is gelijk aan de kosten voor openbaar vervoer in de
      tweede vervoersklasse of, bij gebruik van eigen vervoer, € 0,23 per kilometer.
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel14a
  - number: 14a.3
    text: |-
      Indien de aspirant een vervoersbewijs wenst op basis van eerste klasse of indien de aspirant een vervoersbewijs
      wenst welke ruimere mogelijkheden biedt dan bedoeld in het tweede lid, komen de meerkosten hiervan voor rekening
      van de aspirant.
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel14a
  - number: 14a.4
    text: De vergoedingen, bedoeld in het eerste en tweede lid, worden verstrekt op basis van overgelegde bewijsstukken.
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel14a
  - number: 14a.5
    text: Het eerste tot en met vierde lid is van overeenkomstige toepassing op de ambtenaar in opleiding.
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel14a
  - number: '15.1'
    text: |-
      De ambtenaar declareert de reis- en verblijfkosten op de voorgeschreven wijze onder overlegging van de vereiste
      bewijsstukken.
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel15
  - number: '15.2'
    text: |-
      Indien blijkt dat bij de ingediende reisdeclaratie is afgeweken van de regels in dit besluit, wordt de
      reisdeclaratie ambtshalve gewijzigd en wordt het bedrag waarop aanspraak kan worden gemaakt, bepaald naar die op de
      reisdeclaratie ambtshalve gewijzigde gegevens.
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel15
  - number: '15.3'
    text: |-
      Geen aanspraak op een vergoeding van reiskosten bestaat indien de declaratie van de in een kalendermaand gemaakte
      kosten niet binnen drie maanden na die kalendermaand bij het bevoegd gezag is ingediend, tenzij het overschrijden
      van de termijn niet aan de ambtenaar verwijtbaar is.
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel15
  - number: '16'
    text: |-
      Onder dienstreis wordt in deze paragraaf verstaan: een reis naar, in of uit het buitenland wanneer daartoe door
      het bevoegd gezag een opdracht is gegeven. In bijzondere gevallen kan een dergelijke opdracht ook achteraf worden
      gegeven.
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel16
  - number: 16a.1
    text: |-
      Door het bevoegd gezag wordt enkel opdracht gegeven voor een dienstreis indien alternatieve middelen om het
      voorziene doel van de dienstreis te bewerkstelligen niet volstaan.
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel16a
  - number: 16a.2
    text: |-
      Een opdracht voor een dienstreis wordt gegeven aan een zo klein mogelijke delegatie als voor het bewerkstelligen
      van het voorziene doel van de dienstreis noodzakelijk is. Indien het bevoegd gezag voornemens is een opdracht te
      geven voor een dienstreis aan meer dan drie ambtenaren, wordt de noodzaak hiervan gemotiveerd alvorens de opdracht
      wordt gegeven.
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel16a
  - number: 16a.3
    text: |-
      Indien het bevoegd gezag opdracht geeft voor een dienstreis waarvoor de enkele reis een reisafstand van maximaal
      zevenhonderd kilometer vanaf de plaats van tewerkstelling behelst, wordt gebruik gemaakt van de trein of ander
      openbaar vervoer, niet zijnde het vliegtuig. Van deze bepaling kan worden afgeweken met instemming van het bevoegd
      gezag.
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel16a
  - number: 16a.4
    text: |-
      Indien het bevoegd gezag opdracht geeft voor een dienstreis waarvoor de enkele reis een reisafstand van minimaal
      zevenhonderd kilometer van de plaats van tewerkstelling behelst en gebruik wordt gemaakt van het vliegtuig, wordt
      in beginsel gekozen voor de vlucht waarvoor het minste aantal keren overstappen noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel16a
  - number: '17.1'
    text: 'De ambtenaar maakt bij een dienstreis gebruik van één of meer van de volgende vervoermiddelen:'
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel17
  - number: 17.1.a
    text: vliegtuig, boot of openbaar vervoer;
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel17
  - number: 17.1.b
    text: het door het bevoegd gezag ter beschikking gestelde vervoermiddel;
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel17
  - number: 17.1.c
    text: gehuurd vervoermiddel of taxi.
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel17
  - number: '17.2'
    text: |-
      Het bevoegd gezag kan bij geven van een opdracht voor een dienstreis bepalen welke vervoersmiddelen daarvoor mogen
      worden gebruikt, behoudens het bepaalde in [artikel 16a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024064#Artikel16a
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0024064
        artikel: 16a
        hoofdstuk: III
        paragraaf: '2'
  - number: '18.1'
    text: |-
      Bij gebruik van vliegtuig, boot en openbaar vervoer worden de reiskosten die in verband met de dienstreis
      noodzakelijkerwijs zijn gemaakt op basis van de overgelegde bewijsstukken vergoed.
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel18
  - number: '18.2'
    text: |-
      Onverminderd het derde lid, onderdelen a en b, mag in het geval van een vliegreis enkel gebruik worden gemaakt van
      businessclass indien sprake is van een rechtstreekse vlucht van langer dan zes uur en er geen sprake is van reizen
      in het kader van een opleiding, training of stage.
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel18
  - number: '18.3'
    text: 'Bij gebruik van een vliegtuig, boot of openbaar vervoer mag als volgt worden gereisd:'
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel18
  - number: 18.3.a
    text: 'een vliegreis binnen Europa: in economy class;'
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel18
  - number: 18.3.b
    text: |-
      een vliegreis buiten Europa: in economy comfort class of daarmee vergelijkbare reisklasse, waartoe in ieder geval
      worden gerekend economy plus en premium economy;
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel18
  - number: 18.3.c
    text: 'bij gebruik van een boot of openbaar vervoer met vervoerklassen: de hoogste klasse.'
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel18
  - number: '18.4'
    text: 'Indien het dienstbelang of de reisomstandigheden daartoe aanleiding geven, worden tevens als reiskosten vergoed:'
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel18
  - number: 18.4.a
    text: toeslag voor bijzondere treinen;
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel18
  - number: 18.4.b
    text: plaatsreserveringskosten in treinen;
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel18
  - number: 18.4.c
    text: kosten voor het gebruik van een slaapwagen;
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel18
  - number: 18.4.d
    text: kosten voor slaapgelegenheid op een boot;
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel18
  - number: 18.4.e
    text: extra kosten voor bagage;
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel18
  - number: 18.4.f
    text: |-
      kosten van het vervoer van het station, de haven of het vliegveld van aankomst naar de plaats van bestemming op de
      heen- en terugreis;
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel18
  - number: 18.4.g
    text: kosten van luchthavenrechten;
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel18
  - number: 18.4.h
    text: kosten voor het verkrijgen van een voor de dienstreis noodzakelijk visum.
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel18
  - number: '18.5'
    text: |-
      Ingeval de economy comfort class of daarmee vergelijkbare vervoersklasse als bedoeld in het derde lid, onder b,
      niet beschikbaar is, mag worden gereisd in de naast hogere vervoersklasse.
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel18
  - number: '18.6'
    text: |-
      In afwijking van het derde lid, onder b, en het vijfde lid, kan het bevoegd gezag met redenen omkleed toestemming
      verlenen om te reizen in de naast hogere vervoersklasse dan wel in business class.
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel18
  - number: '19'
    text: |-
      Indien het bevoegd gezag aan de ambtenaar een vervoermiddel ter beschikking stelt, maakt de ambtenaar van het
      desbetreffende vervoermiddel gebruik, tenzij dit redelijkerwijs niet van hem kan worden gevergd. De werkelijk
      gemaakte kosten bij het gebruik van een ter beschikking gesteld vervoermiddel worden aan de ambtenaar vergoed op
      basis van overgelegde bewijsstukken.
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel19
  - number: '20'
    text: |-
      Indien het noodzakelijk is dat de ambtenaar tijdens de dienstreis gebruik maakt van openbaar vervoer, een gehuurd
      vervoermiddel of een taxi, worden de hieraan verbonden kosten aan de ambtenaar vergoed op basis van overgelegde
      bewijsstukken.
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel20
  - number: '21.1'
    text: |-
      Aan de ambtenaar kan bij een dienstreis van minimaal drie maanden toestemming worden verleend om met gebruik van
      openbaar vervoer, vliegtuig, boot of eigen vervoer, voor één of meer bezoeken van korte duur naar zijn woonplaats
      terug te keren.
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel21
  - number: '21.2'
    text: 'Aan de ambtenaar worden de reiskosten als volgt vergoed:'
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel21
  - number: 21.2.a
    text: 'bij vliegtuig: economy class;'
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel21
  - number: 21.2.b
    text: 'bij openbaar vervoer of een boot: de laagste vervoersklasse.'
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel21
  - number: '21.3'
    text: |-
      [Artikel 18, vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0024064#Artikel18
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0024064
        artikel: '18'
        hoofdstuk: III
        paragraaf: '2'
  - number: '22.1'
    text: |-
      De ambtenaar ontvangt een tegemoetkoming in de in verband met een dienstreis door hem gemaakte verblijfkosten voor
      maaltijd, logies en kleine uitgaven.
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel22
  - number: '22.2'
    text: |-
      Voor de berekening van de tegemoetkoming geldt voor de verschillende gebieden waar wordt gereisd dezelfde
      tarieflijst die geldt voor rijksambtenaren op grond van de laatstelijk afgesloten collectieve arbeidsovereenkomst
      met betrekking tot de verblijfkosten buitenlandse dienstreizen.
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel22
  - number: '22.3'
    text: 'De tegemoetkoming in de verblijfkosten bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel22
  - number: 22.3.a
    text: |-
      de urencomponent voor kleine uitgaven, ter grootte van 1,5% van het bedrag voor overige kosten opgenomen in de
      tarieflijst, voor ieder uur dat de dienstreis duurt;
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel22
  - number: 22.3.b
    text: |-
      de logiescomponent, voor gemaakte logieskosten, per overnachting tot maximaal het in de tarieflijst opgenomen
      bedrag, met dien verstande dat indien een bewijsstuk niet kan worden overlegd waaruit blijkt dat logieskosten
      zijn gemaakt, een bedrag wordt uitgekeerd van € 11,34 per overnachting tot een maximum van vier overnachtingen
      per dienstreis;
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel22
  - number: 22.3.c
    text: |-
      de ontbijtcomponent, ter grootte van 12% van het bedrag voor overige kosten, opgenomen in de tarieflijst voor
      iedere periode van 06.00 uur tot 08.00 uur die binnen de dienstreis valt;
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel22
  - number: 22.3.d
    text: |-
      de lunchcomponent ter grootte van 20% van het bedrag voor overige kosten, opgenomen in de tarieflijst voor iedere
      periode van 12.00 tot 14.00 uur die binnen de dienstreis valt;
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel22
  - number: 22.3.e
    text: |-
      de dinercomponent, ter grootte van 32% van het bedrag voor overige kosten, opgenomen in de tarieflijst voor iedere
      periode van 17.00 tot 20.00 uur die binnen de dienstreis valt.
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel22
  - number: '22.4'
    text: |-
      Indien een bewijsstuk van kosten voor logies en ontbijt wordt overgelegd waaruit niet blijkt welk deel van de
      kosten voor logies en welk deel van de kosten voor ontbijt zijn gemaakt, worden de op het bewijsstuk vermelde
      kosten vergoed, voor zover deze niet meer bedragen dan de som van de tegemoetkomingen, genoemd in het derde lid,
      onderdelen b en c.
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel22
  - number: '23'
    text: 'De ambtenaar ontvangt geen tegemoetkoming in verblijfkosten:'
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel23
  - number: 23.a
    text: voor een reisgedeelte per vliegtuig voor zover het betreft vliegreizen in de businessklasse;
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel23
  - number: 23.b
    text: |-
      voor de periode dat een ambtenaar voor een bezoekreis als bedoeld in [artikel 21][ref1] in zijn woonplaats
      verblijft.


      [ref1]: https://wetten.overheid.nl/BWBR0024064#Artikel21
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0024064
        artikel: '21'
        hoofdstuk: III
        paragraaf: '2'
  - number: '24.1'
    text: |-
      Indien door een medisch deskundige aan de ambtenaar vaccinatie of geneesmiddelen zijn voorgeschreven in verband met
      de dienstreis, worden de kosten daarvan aan de ambtenaar vergoed.
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel24
  - number: '24.2'
    text: |-
      Indien een ambtenaar aantoont dat hij tijdens een dienstreis als gevolg van ziekte of van een ongeval kosten heeft
      moeten maken, kan hiervoor door het bevoegd gezag een vergoeding worden toegekend voor zover de kosten ten laste
      van de ambtenaar blijven.
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel24
  - number: '24.3'
    text: |-
      Indien door het bevoegd gezag niet reeds daarin is voorzien, worden aan de ambtenaar vergoed de redelijkerwijs
      gemaakte kosten van een reisverzekering voor de duur van de dienstreis.
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel24
  - number: '24.4'
    text: |-
      Voor de kosten die voor rekening van de ambtenaar blijven in het geval de ambtenaar deze als gevolg van verlies,
      diefstal of beschadiging van voor de dienstreis meegenomen noodzakelijke bagage heeft moeten maken, kan een
      tegemoetkoming worden uitgekeerd tot maximaal € 2268,90 netto per dienstreis.
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel24
  - number: '24.5'
    text: |-
      Aan de ambtenaar die een dienstreis maakt van minimaal vier dagen, de reisdagen inbegrepen, worden de kosten
      vergoed van de noodzakelijk gemaakte kosten voor het wassen van de eigen kleding.
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel24
  - number: '24.6'
    text: |-
      De in verband met een dienstreis gemaakte kosten voor interlokale en internationale telefoongesprekken en voor
      gebruik van internet voor dienstdoeleinden worden op basis van overgelegde bewijsstukken vergoed. Indien geen
      bewijsstukken worden overgelegd, moet de ambtenaar aannemelijk maken dat hij die kosten heeft gemaakt.
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel24
  - number: '24.7'
    text: |-
      Indien klimatologische of andere bijzondere omstandigheden in een tijdens een dienstreis te bezoeken land daartoe
      aanleiding geven, kan aan de ambtenaar een vergoeding worden toegekend in de aangetoonde en noodzakelijk gemaakte
      kosten voor bijzondere kleding en uitrusting. De vergoeding bedraagt de helft van de noodzakelijk gemaakte kosten
      van aanschaf van bijzondere kleding en uitrusting. Per kalenderjaar bedraagt de vergoeding maximaal € 453,78,
      waarvan € 226,89 voor gebieden met tropische warmte en € 226,89 voor gebieden met polaire koude, waartoe in ieder
      geval de gebieden, genoemd in [bijlage II][ref1] bij dit besluit, worden gerekend.


      [ref1]: https://wetten.overheid.nl/BWBR0024064
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0024064
  - number: '25'
    text: |-
      [Artikel 15][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0024064#Artikel15
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0024064
        artikel: '15'
        hoofdstuk: III
        paragraaf: '1'
  - number: '26.1'
    text: 'In dit hoofdstuk wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel26
  - number: 26.1.a
    text: '*eigen huishouding voeren:* het zelfstandig bewonen van woonruimte, voorzien van eigen meubilair en stoffering;'
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel26
  - number: 26.1.b
    text: |-
      *voor het eerst aangesteld:* aangesteld bij het landelijk politiekorps, bedoeld in
      [artikel 25, eerste lid, van de Politiewet 2012][ref1], bij de rijksrecherche, bedoeld in
      [artikel 49, eerste lid, van de Politiewet 2012][ref2], of bij de Politieacademie, anders dan in geval van overgang
      binnen één maand:


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel49
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '25'
      - id: ref2
        bwb_id: BWBR0031788
        artikel: '49'
  - number: 26.1.b.1
    text: van de ene naar de andere hiervoor genoemde (politie)organisatie;
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel26
  - number: 26.1.b.2
    text: |-
      van een andere overheidsdienst of een door het Rijk bekostigde onderwijsinstelling naar het landelijk politiekorps,
      bedoeld in [artikel 25, eerste lid van de Politiewet 2012][ref1], de rijksrecherche of de Politieacademie.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel25
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '25'
  - number: '26.2'
    text: |-
      Voor de toepassing van dit hoofdstuk wordt onder de echtgenote of echtgenoot mede verstaan: de geregistreerde
      partner of de levenspartner met wie de niet-gehuwde ambtenaar samenwoont – en met het oogmerk duurzaam samen
      te leven – een gemeenschappelijke huishouding voert op basis van een notarieel verleden samenlevingscontract
      bevattende de wederzijdse rechten en verplichtingen ter zake van die samenwoning en gemeenschappelijke huishouding.
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel26
  - number: '27.1'
    text: |-
      De ambtenaar die in verband met een verplaatsing of aanstelling in opdracht van het bevoegde gezag is verhuisd en
      een woning in of nabij een reisafstand van 20 kilometer van zijn plaats van tewerkstelling heeft betrokken, wordt
      een tegemoetkoming in de verhuiskosten verleend overeenkomstig de [artikelen 29 tot en met 31][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024064#Artikel29
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0024064
        artikel: '29'
        hoofdstuk: IV
  - number: '27.2'
    text: |-
      De ambtenaar, bedoeld in het eerste lid, die nog niet is verhuisd en die naar het oordeel van het bevoegd gezag
      niet dagelijks heen en weer kan reizen heeft aanspraak op een tegemoetkoming in de pensionkosten voor verblijf in
      een pension in of nabij het werkgebied, tenzij van overheidswege al dan niet tegen betaling in huisvesting wordt
      voorzien. De tegemoetkoming bedraagt voor de ambtenaar die gewoonlijk met gezinsleden samenwoont 90% en voor de
      overige ambtenaren 60% van de betaalde pensionkosten, voor zover deze kosten redelijk zijn.
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel27
  - number: '27.3'
    text: |-
      De ambtenaar, bedoeld in het tweede lid, heeft aanspraak op een tegemoetkoming in de reiskosten voor maximaal
      eenmaal per week af te leggen gezinsbezoek of voor het reizen naar de woning van de ambtenaar. De tegemoetkoming
      is gelijk aan de kosten voor openbaar vervoer in de tweede vervoersklasse of, bij gebruik van eigen motorvoertuig
      € 0,23 per kilometer.
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel27
  - number: '27.4'
    text: |-
      Geen tegemoetkoming in verhuiskosten wordt verleend, indien de verhuizing niet heeft plaatsgevonden binnen twee
      jaren nadat de verplichting tot verhuizen is opgelegd dan wel na de datum van het ontslag, het overlijden of de
      verplaatsing.
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel27
  - number: '28.1'
    text: |-
      De ambtenaar die zich met een verhuizing, zonder dat daartoe opdracht is gegeven door het bevoegd gezag, heeft
      gevestigd binnen een reisafstand van 20 kilometer van zijn plaats van tewerkstelling wordt een tegemoetkoming in de
      verhuiskosten verleend overeenkomstig de [artikelen 29 tot en met 31][ref1], indien de reisafstand tussen de oude
      woning en de plaats van tewerkstelling ten minste 50 kilometer bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0024064#Artikel29
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0024064
        artikel: '29'
        hoofdstuk: IV
  - number: '28.2'
    text: |-
      De ambtenaar dient de hem op grond van het eerste lid toegekende tegemoetkoming in verhuiskosten terug te betalen,
      indien binnen drie jaren na de verhuizing één van de volgende omstandigheden zich voordoet:
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel28
  - number: 28.2.a
    text: |-
      aan hem wordt ontslag op aanvraag verleend, anders dan ontslag waarna binnen één maand wordt overgegaan naar een
      landelijke of regionale eenheid, rijksrecherche of naar de Politieacademie, tenzij de ambtenaar als gevolg van die
      overgang opnieuw moet verhuizen met aanspraak op tegemoetkoming in de verhuiskosten;
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel28
  - number: 28.2.b
    text: aan hem wordt ontslag verleend op grond van aan hem te wijten feiten of omstandigheden;
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel28
  - number: 28.2.c
    text: |-
      hij verhuist opnieuw, waarbij de afstand tussen zijn woning en zijn plaats van tewerkstelling met meer dan vijf
      kilometer toeneemt.
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel28
  - number: '28.3'
    text: |-
      Indien op grond van het tweede lid een terugbetalingsverplichting bestaat, wordt de hoogte van het terug te betalen
      bedrag berekend als volgt:
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel28
  - number: 28.3.a
    text: in het eerste jaar na de verhuizing 100% van de tegemoetkoming;
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel28
  - number: 28.3.b
    text: in het tweede jaar na de verhuizing 50% van de tegemoetkoming;
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel28
  - number: 28.3.c
    text: in het derde jaar na de verhuizing 25% van de tegemoetkoming.
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel28
  - number: '28.4'
    text: |-
      De tegemoetkoming op grond van dit artikel wordt slechts toegekend, indien de ambtenaar schriftelijk heeft
      verklaard dat een verplichting tot terugbetalen hem bekend is.
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel28
  - number: '29.1'
    text: 'De tegemoetkoming in verhuiskosten, voor een verhuizing binnen Nederland, bestaat uit een bedrag voor:'
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel29
  - number: 29.1.a
    text: |-
      de kosten van transport van de bagage en van de inboedel van de ambtenaar en zijn gezinsleden naar de nieuwe
      woning;
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel29
  - number: 29.1.b
    text: |-
      de kosten van het in- en uitpakken van de gehele inboedel evenals de kosten van demontage en montage van het
      meubilair;
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel29
  - number: 29.1.c
    text: |-
      de noodzakelijk te maken dubbele woonkosten tot maximaal € 600,00 per maand voor een periode van maximaal vier
      maanden en uitgaande van de kosten van de oude woning;
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel29
  - number: 29.1.d
    text: alle andere direct uit de verhuizing voortvloeiende kosten.
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel29
  - number: '29.2'
    text: 'Voor het vaststellen van de tegemoetkoming, bedoeld in het eerste lid, onderdeel d, geldt:'
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel29
  - number: 29.2.a
    text: |-
      het bedrag wordt gesteld op 3% van de berekeningsbasis, bedoeld in [artikel 30][ref1], voor ieder woon- of
      slaapvertrek tot een maximum van vier vertrekken die de oude woning telt;


      [ref1]: https://wetten.overheid.nl/BWBR0024064#Artikel30
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0024064
        artikel: '30'
        hoofdstuk: IV
  - number: 29.2.b
    text: de tegemoetkoming bedraagt maximaal € 5.445,00.
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel29
  - number: '29.3'
    text: |-
      Geen aanspraak op een tegemoetkoming als bedoeld in het eerste lid, onderdeel d, bestaat indien de ambtenaar geen
      eigen huishouding voert.
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel29
  - number: '29.4'
    text: |-
      Voor de ambtenaar die geen eigen huishouding voert en indien bijzondere omstandigheden daartoe aanleiding
      geven, kan door het bevoegd gezag voor deze kosten niettemin een tegemoetkoming worden toegekend van 3% van de
      berekeningsbasis, als bedoeld in [artikel 30][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024064#Artikel30
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0024064
        artikel: '30'
        hoofdstuk: IV
  - number: '29.5'
    text: |-
      Indien aan de ambtenaar door het bevoegd gezag is medegedeeld dat de verplaatsing maximaal twee jaren zal duren,
      bestaat slechts aanspraak op vergoeding van transportkosten van de bagage. Voorts kan het bevoegd gezag, indien
      bijzondere omstandigheden daartoe aanleiding geven, een tegemoetkoming als bedoeld in eerste lid, onderdeel d,
      toekennen van 3% van de berekeningsbasis als bedoeld in [artikel 30][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024064#Artikel30
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0024064
        artikel: '30'
        hoofdstuk: IV
  - number: '30.1'
    text: |-
      De berekeningsbasis voor de tegemoetkoming in de verhuiskosten, bedoeld in [artikel 29][ref1], is het
      twaalfvoud van de bezoldiging in de zin van het [Besluit bezoldiging politie][ref2] die de ambtenaar
      geniet op het berekeningstijdstip, vermeerderd met de aanspraak op de vakantie-uitkering, bedoeld
      in [artikel 23 van het Besluit bezoldiging politie][ref3], en de eindejaarsuitkering, bedoeld in
      [artikel 25b van het Besluit bezoldiging politie][ref4]. Indien er sprake is van gehele of gedeeltelijke
      werkloosheid of arbeidsongeschiktheid, dan wel prepensionering of levensloopverlof geldt de bezoldiging
      zoals die zou zijn genoten indien er geen sprake was geweest van gehele of gedeeltelijke werkloosheid of
      arbeidsongeschiktheid, dan wel prepensionering of levensloopverlof.


      [ref1]: https://wetten.overheid.nl/BWBR0024064#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0006517
      [ref3]: https://wetten.overheid.nl/BWBR0006517#Artikel23
      [ref4]: https://wetten.overheid.nl/BWBR0006517#Artikel25b
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0024064
        artikel: '29'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0006517
      - id: ref3
        bwb_id: BWBR0006517
        artikel: '23'
      - id: ref4
        bwb_id: BWBR0006517
        artikel: 25b
  - number: '30.2'
    text: |-
      Het berekeningstijdstip voor de tegemoetkoming in de verhuiskosten is de datum waarop de ambtenaar verhuist óf,
      als de ambtenaar is verhuisd vóór de datum dat de functie feitelijk wordt vervuld, de datum van ingang van de
      functievervulling óf bij het overlijden dan wel ontslag van de ambtenaar de datum waarop laatstelijk bezoldiging
      werd genoten.
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel30
  - number: '30.3'
    text: |-
      Voor de toepassing van de in het eerste lid bedoelde berekeningsbasis wordt, indien de ambtenaar een toelage
      geniet als bedoeld in de [artikelen 14][ref1], [15][ref2] of [18 van het Besluit bezoldiging politie][ref3] dit
      bezoldigingsdeel vastgesteld op het bedrag dat de ambtenaar gedurende de drie kalendermaanden voorafgaande aan het
      berekeningstijdstip gemiddeld per maand aan deze toelagen heeft genoten.


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0006517#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0006517#Artikel18
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0006517
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0006517
        artikel: '15'
      - id: ref3
        bwb_id: BWBR0006517
        artikel: '18'
  - number: '30.4'
    text: |-
      Indien de ambtenaar en zijn echtgenoot of echtgenote beiden in aanmerking komen voor een tegemoetkoming in de
      verhuiskosten, wordt aan beide echtgenoten een evenredig deel van de tegemoetkoming toegekend, berekend over het
      gemiddelde van de gezamenlijke berekeningsgrondslag.
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel30
  - number: '30.5'
    text: |-
      De tegemoetkoming in de verhuiskosten op grond van dit besluit, wordt voor de ambtenaar die voor het eerst is
      aangesteld, verminderd met 50%.
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel30
  - number: '31.1'
    text: |-
      De aanvraag voor tegemoetkoming in de verhuiskosten dient vóór de datum van verhuizing bij het bevoegd gezag te
      zijn ingediend.
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel31
  - number: '31.2'
    text: |-
      De ambtenaar die het transport van zijn inboedel door een verhuizer laat verzorgen, laat het transport uitvoeren op
      de voor het bevoegd gezag minst kostbare wijze.
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel31
  - number: '31.3'
    text: Het bevoegd gezag kan in afwijking van het tweede lid één verhuizer aanwijzen.
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel31
  - number: '31.4'
    text: |-
      De ambtenaar die het transport van zijn inboedel in eigen beheer uitvoert, heeft aanspraak op een tegemoetkoming in
      huur- en brandstofkosten van een bestel- of vrachtauto.
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel31
  - number: '31.5'
    text: |-
      Indien het transport van zijn inboedel in eigen beheer anders dan op de wijze, bedoeld in het vierde lid,
      plaatsvindt, bestaat er aanspraak op een vergoeding van € 0,23 per kilometer, met dien verstande dat niet meer dan
      twee ritten van en naar de nieuwe woning worden vergoed.
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel31
  - number: '31.6'
    text: |-
      De ambtenaar declareert de op grond van het vierde en vijfde lid gemaakte huurkosten van een auto, vergezeld van de
      rekening van het verhuurbedrijf, binnen zes maanden bij het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel31
  - number: '31.7'
    text: |-
      De ambtenaar declareert de kosten van verhuizing en, indien van toepassing, de kosten van dubbele woonlasten zo
      spoedig mogelijk doch maximaal zes maanden na de verhuizing onder overlegging van de desbetreffende rekeningen en
      opgevraagde offertes.
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel31
  - number: 31a.1
    text: |-
      In aanvulling op [artikelen 29 tot en met 31][ref1], omvat de verhuiskostenvergoeding in
      geval van dubbele woonlasten voor een politiechef van een regionale eenheid als bedoeld in
      [artikel 1, eerste lid, onderdeel h, van de Politiewet 2012][ref2], welke tussen 1 januari 2013 en 1 januari
      2014 een verzoek daartoe indient, een tegemoetkoming in de kosten voor de duur van ten hoogste twee jaar. Indien
      de politiechef voordat hij aanspraak maakt op deze tegemoetkoming, gebruik heeft gemaakt van de vergoeding van
      pensionkosten, bedoeld in [artikel 27, tweede lid][ref3], wordt de periode waarin daarvan gebruik is gemaakt, in
      mindering gebracht op de in de eerste zin genoemde maximale duur. Deze periode wordt eerst in mindering gebracht op
      het eerste jaar, bedoeld in het tweede lid. Tevens vervalt het recht op de vergoeding voor pensionkosten.


      [ref1]: https://wetten.overheid.nl/BWBR0024064#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0024064#Artikel27
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel31a
    references:
      - id: ref1
        bwb_id: BWBR0024064
        artikel: '29'
      - id: ref2
        bwb_id: BWBR0031788
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0024064
        artikel: '27'
        hoofdstuk: IV
  - number: 31a.2
    text: |-
      De tegemoetkoming bestaat uit het bedrag van de daadwerkelijk gemaakte kosten van de huisvesting en bedraagt het
      eerste jaar ten hoogste 18% en het tweede jaar ten hoogste 15% van de bezoldiging met een maximum van € 1.552,79
      per maand.
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel31a
  - number: 31a.3
    text: 'Onder de daadwerkelijk gemaakte kosten van de huisvesting, bedoeld in het tweede lid, worden verstaan:'
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel31a
  - number: 31a.3.a
    text: |-
      het bedrag van de huur van de (tijdelijke) woning in het werkgebied van de regionale eenheid waar de politiechef is
      aangesteld, vermeerderd met de kosten voor elektriciteit, gas en water; of
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel31a
  - number: 31a.3.b
    text: |-
      de rente van schulden ter verwerving van de woning in het werkgebied van de regionale eenheid waar de politiechef
      is aangesteld, vermeerderd met de kosten voor elektriciteit, gas en water.
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel31a
  - number: 31a.4
    text: |-
      De tegemoetkoming gaat in op de eerste dag van de maand na de benoeming waarop de dubbele woonlasten ontstaan, maar
      niet eerder dan op de eerste dag van de maand waarop de tegemoetkoming wordt aangevraagd, en eindigt met ingang
      van de eerste dag van de maand waarin de woning waar de politiechef tot zijn aanstelling woonde, is verkocht, of
      na afloop van de in het eerste lid bedoelde maximale duur. De datum van verkoop wordt bepaald op de dag dat de akte
      betreffende de overdracht van de woning bij de notaris is gepasseerd.
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel31a
  - number: 31a.5
    text: 'De tegemoetkoming wordt slechts verleend indien:'
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel31a
  - number: 31a.5.a
    text: |-
      de politiechef in het werkgebied van de regionale eenheid binnen een jaar na zijn aanstelling een woning huurt of
      koopt; en
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel31a
  - number: 31a.5.b
    text: |-
      de woning waar de politiechef tot zijn aanstelling woonde kenbaar in de verkoop staat en de rente van de schulden
      ter verwerving van die woning drukt op het huishouden van de politiechef.
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel31a
  - number: 31a.6
    text: |-
      De eventuele verschuldigde loon- en inkomstenbelasting over de tegemoetkoming worden door de regionale eenheid aan
      de politiechef vergoed.
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel31a
  - number: '35'
    text: |-
      Onze Minister kan in afwijking van dit besluit nadere regels vaststellen ten aanzien van een door hem aan te wijzen
      groep van ambtenaren, indien de afwijking strekt tot het vermijden van onbillijkheden van overwegende aard welke
      uit de toepassing van deze regels zouden voortkomen.
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel35
  - number: '36.1'
    text: |-
      Voor het vaststellen van alle reisafstanden in dit besluit, wordt gebruik gemaakt van een door Onze Minister
      aangewezen routeplanner.
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel36
  - number: '36.2'
    text: 'De routeplanner wordt met inachtneming van de volgende bepalingen gebruikt:'
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel36
  - number: 36.2.a
    text: de snelste route van de routeplanner bepalend is;
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel36
  - number: 36.2.b
    text: |-
      de afstand wordt gemeten met behulp van de postcodes en bestemmingsnummers van het begin- en eindpunt van één van
      de trajecten als bedoeld in dit besluit;
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel36
  - number: 36.2.c
    text: de route niet leidt over zandwegen, karrensporen of keienpaden tenzij dit onvermijdelijk is;
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel36
  - number: 36.2.d
    text: het naleven van verkeersregels staat voorop bij het bepalen van de snelste route;
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel36
  - number: 36.2.e
    text: de tijd dat de ambtenaar verblijft op een veer wordt meegerekend bij het bepalen van de snelste route;
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel36
  - number: 36.2.f
    text: |-
      indien bij het verschijnen van een nieuwe versie van de routeplanner, de route een gewijzigde reisafstand geeft, is
      die reisafstand bepalend voor de aanspraak.
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel36
  - number: '37'
    text: |-
      Het bevoegd gezag kan besluiten om in individuele gevallen af te wijken van het gestelde in dit besluit, indien de
      afwijking strekt tot het vermijden van onbillijkheden van overwegende aard welke uit de toepassing van deze regels
      zouden voortkomen.
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel37
  - number: '38'
    text: |-
      De bedragen, genoemd in de [artikelen 13, tweede lid][ref1], [14, eerste lid][ref2], en [14a, eerste lid][ref3],
      worden per 1 januari van elk kalenderjaar bij ministeriële regeling gewijzigd, overeenkomstig de geschoonde
      consumentenprijsindex voor restaurants en accommodaties, vastgesteld door het Centraal bureau voor de statistiek.


      [ref1]: https://wetten.overheid.nl/BWBR0024064#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0024064#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0024064#Artikel14a
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0024064
        artikel: '13'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0024064
        artikel: '14'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0024064
        artikel: 14a
        hoofdstuk: III
        paragraaf: '1'
  - number: 38a
    text: |-
      [Hoofdstuk IV][ref1] is niet van toepassing op de vrijwillige ambtenaar, bedoeld in
      [artikel 1, eerste lid, van het Besluit algemene rechtspositie politie][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0024064#HoofdstukIV
      [ref2]: https://wetten.overheid.nl/BWBR0006516#Artikel1
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel38a
    references:
      - id: ref1
        bwb_id: BWBR0024064
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0006516
        artikel: '1'
  - number: 38b
    text: |-
      Dit besluit berust op de [artikelen 47, eerste lid][ref1], en [81, eerste lid, van de Politiewet 2012][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel81
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel38b
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '47'
      - id: ref2
        bwb_id: BWBR0031788
        artikel: '81'
  - number: '39'
    text: |-
      Het [Besluit vergoeding verplaatsingskosten politie][ref1] en het [Besluit vergoeding dienstreizen politie][ref2]
      worden ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0006520
      [ref2]: https://wetten.overheid.nl/BWBR0006519
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0006520
      - id: ref2
        bwb_id: BWBR0006519
  - number: '40'
    text: Dit besluit treedt in werking met ingang van 1 juli 2008.
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel40
  - number: '41'
    text: 'Dit besluit wordt aangehaald als: Besluit reis-, verblijf-, en verhuiskosten politie.'
    url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#Artikel41
