  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties van 30 mei 2008, nummer 2008-
    0000229974, directoraat-generaal Veiligheid, directie Politie, afdeling Arbeidsvoorwaardenbeleid;

    Gelet op artikel 50, eerste lid, van de Politiewet 1993;

    De Raad van State gehoord (advies van 18 juni 2008, nr. W04.08.0203/I);

    Gezien het nader rapport van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties van 19 juni 2008, nr.
    2008-0000278080, directoraat-generaal Veiligheid, directie Politie, afdeling Arbeidsvoorwaardenbeleid;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0024064/2025-05-13#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder: - *ambtenaar:* de ambtenaar, bedoeld in
      [artikel 1, eerste lid, van het Besluit algemene rechtspositie politie][ref1] met uitzondering van de vrijwillige
      ambtenaar, aangesteld voor de uitvoering van technische, administratieve en andere taken ten dienste van de
      politie, bedoeld in artikel 1, eerste lid, van dat besluit;
        - *ambtenaar in opleiding:* de ambtenaar in opleiding, bedoeld in
      [artikel 1, eerste lid, van het Besluit algemene rechtspositie politie][ref2];
        - *aspirant:* de aspirant, bedoeld in [artikel 1, eerste lid, van het Besluit algemene rechtspositie politie][ref3];
        - *bevoegd gezag:* het bevoegd gezag, bedoeld in
      [artikel 1, eerste lid, van het Besluit algemene rechtspositie politie][ref4];
        - *Onze Minister:* Onze Minister van Justitie en Veiligheid;
        - *plaats van tewerkstelling:* de plaats van tewerkstelling, bedoeld in
      [artikel 1, eerste lid, van het Besluit algemene rechtspositie politie][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0006516#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0006516#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0006516#Artikel1
      [ref5]: https://wetten.overheid.nl/BWBR0006516#Artikel1
