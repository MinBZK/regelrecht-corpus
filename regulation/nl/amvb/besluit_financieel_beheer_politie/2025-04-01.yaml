  - number: '13'
    text: Het eigen vermogen bestaat uitsluitend uit een algemene reserve.
    url: https://wetten.overheid.nl/BWBR0036711/2025-04-01#Artikel13
  - number: '14'
    text: >-
      1 Het rekening-courantkrediet bij het Ministerie van Financiën bedraagt maximaal € 250 miljoen.


      2 De begroting bevat naast de meerjarenraming een financieringsparagraaf met daarin opgenomen een investeringsplan.


      3 Leningen worden slechts aangegaan voor investeringen in vaste activa, voor zover deze onderdeel zijn van het
      investeringsplan, bedoeld in het tweede lid.


      4 De politie maakt gebruik van een door Onze Minister vastgesteld treasurystatuut, waarin in ieder geval de
      algemene doelstellingen en de richtlijnen en limieten van de financieringsfunctie zijn vastgelegd.
    url: https://wetten.overheid.nl/BWBR0036711/2025-04-01#Artikel14
  - number: '15'
    text: >-
      1 Het eigen vermogen van de politie bedraagt ultimo het jaar minimaal 0% en maximaal 5% van de gemiddelde bijdragen
      van de laatste drie jaar voorafgaand aan het jaar waarover het vermogen wordt berekend.


      2 Indien het eigen vermogen het in het eerste lid gestelde maximum overschrijdt, verrekent Onze Minister het
      verschil met de algemene bijdrage van dat jaar.


      3 Indien Onze Minister instemt met een door de korpschef opgesteld bestedingsplan, dat maatregelen bevat waarmee
      het in het eerste lid bedoelde maximum wordt bereikt, wordt het verschil, bedoeld in het tweede lid, wederom
      beschikbaar gesteld aan de politie.


      4 Indien het eigen vermogen minder bedraagt dan 1,5% van de gemiddelde bijdragen, bedoeld in het eerste lid, stelt
      de korpschef een plan van aanpak op om binnen twee jaar boven de 1,5% uit te komen. Het plan van aanpak behoeft de
      goedkeuring van Onze Minister.


      5 Indien uit de jaarrekening blijkt dat sprake is van een negatief eigen vermogen dan dient bij de eerstvolgende
      begrotingswijziging van het Ministerie van Justitie en Veiligheid te worden aangegeven hoe het negatieve eigen
      vermogen door Onze Minister zal worden hersteld binnen het lopende begrotingsjaar en voert Onze Minister overleg
      met de korpschef over te nemen maatregelen, in aanvulling op het plan van aanpak als bedoeld in het vierde lid.


      6 De omvang van het toegestane eigen vermogen wordt ieder jaar berekend op grond van de vastgestelde jaarrekening
      van dat jaar.
    url: https://wetten.overheid.nl/BWBR0036711/2025-04-01#Artikel15
  - number: '17'
    text: |-
      1 In afwijking van [artikel 13][ref1] is in de balans van de politie een bestemmingsreserves toegestaan voor ICT
      tot maximaal € 366 miljoen.

      2 De bestemmingsreserve, bedoeld in het eerste lid, wordt niet meegewogen in de vaststelling van de omvang van het
      eigen vermogen, bedoeld in [artikel 15][ref2].

      3 De bestemmingsreserve ICT blijft uiterlijk in stand tot een door Onze Minister te bepalen tijdstip.


