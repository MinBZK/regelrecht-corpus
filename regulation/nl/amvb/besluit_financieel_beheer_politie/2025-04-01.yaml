preamble:
  text: >-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.


    Op de voordracht van Onze Minister van Veiligheid en Justitie van 19 februari 2015, nr. 616920, gedaan in
    overeenstemming met Onze Minister van Financiën;


    Gelet op artikel 30, tweede lid, van de Politiewet 2012;


    De Afdeling advisering van de Raad van State gehoord (advies van 8 april 205, nr. W03.15.0037/II);


    Gezien het nader rapport van Onze Minister van Veiligheid en Justitie van 3 juni 2015, nr. 635432, uitgebracht mede
    in overeenstemming met Onze Minister van Financiën;


    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0036711/2025-04-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. *algemene bijdrage:* bijdrage voor het geheel van werkzaamheden dat wettelijk tot de taak van de politie
      behoort, niet zijnde een bijzondere bijdrage;

      b. *bijzondere bijdrage:* bijdrage voor een specifiek omschreven doel;

      c. *begrotingsjaar:* het kalenderjaar waarvoor de begroting dient;

      d. *verslagjaar:* het kalenderjaar waarover verslag wordt uitgebracht;

      e. *begroting:* de begroting, bedoeld in [artikel 34 van de Politiewet 2012][ref1];

      f. *meerjarenraming:* de meerjarenraming, bedoeld in [artikel 34 van de Politiewet 2012][ref2];

      g. *managementrapportage:* rapportage van de korpschef aan Onze Minister waarin wordt ingegaan op de financiële
      stand van zaken van de politie;

      h. *jaarrekening:* de jaarrekening, bedoeld in [artikel 35 van de Politiewet 2012][ref3];

      i. *jaaraanschrijving:* de jaaraanschrijving, bedoeld in [artikel 45 van het Besluit beheer politie](onbekend).


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel34
      [ref3]: https://wetten.overheid.nl/BWBR0031788#Artikel35
