  - number: '12'
    text: |-
      1 In de jaarrekening wordt verantwoording afgelegd over de besteding van de bijdragen. In de jaarrekening worden
      tevens de middelen die feitelijk ter beschikking zijn gesteld aan de Politieacademie inzichtelijk gemaakt.

      2 In de jaarrekening is een bedrijfsvoeringsparagraaf opgenomen waarin in ieder geval wordt ingegaan op de
      financiële rechtmatigheid, financieel en materieel beheer en overige aspecten van de bedrijfsvoering.

      3 Onze Minister kan de bij wege van voorschot verstrekte bijzondere bijdragen geheel of gedeeltelijk terugvorderen
      indien uit de jaarrekening blijkt dat deze niet in overeenstemming met de gestelde voorwaarden zijn besteed.

      4 Niet bestede bijzondere bijdragen die al dan niet bij wege van voorschot zijn verstrekt worden:

      a. als «openstaande bijdragen» onder de vlottende passiva verantwoord;

      b. door Onze Minister voorzien van andere voorwaarden als bedoeld in [artikel 9, derde lid][ref1], of

      c. door Onze Minister in mindering gebracht op de bijzondere bijdragen van het volgende jaar dan wel geheel of
      gedeeltelijk teruggevorderd.

      5 Met de vaststelling van de jaarrekening zijn de bij wege van voorschot verstrekte bijzondere bijdragen
      vastgesteld, met uitzondering van de bijdragen die niet in overeenstemming met de gestelde voorwaarden zijn besteed
      en de niet bestede bijdragen.


      [ref1]: https://wetten.overheid.nl/BWBR0036711#Artikel9
