        artikel: '35'
  - number: '2'
    text: >-
      1 De begroting en de meerjarenraming geven duidelijk en stelselmatig inzicht in de geraamde baten en lasten, de
      geraamde investeringen en de financiering hiervan alsmede de ontwikkeling van de vermogenspositie.


      2 De managementrapportages en de jaarrekening geven inzicht in de inzet en de besteding van de financiële middelen
      van de politie.
    url: https://wetten.overheid.nl/BWBR0036711/2025-04-01#Artikel2
  - number: '3'
    text: >-
      1 De jaaraanschrijving heeft tevens betrekking op de managementrapportages alsmede op de ontwerpen van de
      begroting, de meerjarenraming en de jaarrekening.


      2 De jaaraanschrijving bevat in ieder geval de modellen op basis waarvan de managementrapportages worden opgesteld
      alsmede regels over activering.
    url: https://wetten.overheid.nl/BWBR0036711/2025-04-01#Artikel3
  - number: '4'
    text: >-
      1 De korpschef zendt een ontwerp van de begroting van de politie en het daarbij behorende ontwerp van de
      meerjarenraming voor het komende begrotingsjaar voor 1 juli aan Onze Minister.


      2 De door Onze Minister voorgenomen begroting van de politie en de daarbij behorende voorgenomen meerjarenraming
      wordt als bijlage bij de begroting van het Ministerie van Justitie en Veiligheid aan de Staten-Generaal gezonden.


      3 Onze Minister stelt de begroting en de daarbij behorende meerjarenraming voor het komende begrotingsjaar vast na
      goedkeuring van de begroting voor hetzelfde jaar van zijn Ministerie door de Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0036711/2025-04-01#Artikel4
  - number: '5'
    text: |-
      1 De korpschef verstrekt jaarlijks uiterlijk op 1 januari aan Onze Minister de informatie die van belang is voor de
      Voorjaarsnota, bedoeld in [artikel 2.26, derde lid, van de Comptabiliteitswet 2016][ref1].

      2 De korpschef verstrekt jaarlijks uiterlijk op 1 september aan Onze Minister de informatie die van belang is voor
      de Najaarsnota, bedoeld in [artikel 2.26, derde lid, van de Comptabiliteitswet 2016][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel2.26
      [ref2]: https://wetten.overheid.nl/BWBR0039429#Artikel2.26
    url: https://wetten.overheid.nl/BWBR0036711/2025-04-01#Artikel5
