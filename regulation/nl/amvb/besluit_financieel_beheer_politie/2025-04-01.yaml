        artikel: '17'
        hoofdstuk: '7'
  - number: '9'
    text: |-
      1 De politie ontvangt uitsluitend bijdragen als bedoeld in [artikel 33 van de Politiewet 2012][ref1].

      2 De bijdragen bestaan uit algemene en bijzondere bijdragen. Bijzondere bijdragen kunnen bij wege van voorschot
      worden verstrekt.

      3 Aan de algemene bijdragen kunnen voorwaarden worden verbonden en aan de bijzondere bijdragen worden voorwaarden
      verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel33
    url: https://wetten.overheid.nl/BWBR0036711/2025-04-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '33'
  - number: '10'
    text: |-
      1 Het totaal van de bijdragen, bedoeld in [artikel 9][ref1], wordt betaalbaar gesteld in vier termijnen,
      respectievelijk op 15 januari, 15 april, 15 juli en 15 oktober van elk jaar.

      2 De hoogte van de bijdrage per termijn wordt bepaald aan de hand van de liquiditeitsbehoefte van de politie.


      [ref1]: https://wetten.overheid.nl/BWBR0036711#Artikel9
    url: https://wetten.overheid.nl/BWBR0036711/2025-04-01#Artikel10
