        artikel: '9'
        hoofdstuk: '4'
  - number: '11'
    text: |-
      1 Voor zover in dit besluit niet anders is bepaald, zijn de [artikelen 361 tot en met 388][ref1],
      met uitzondering van de [artikelen 362, zevende lid][ref2], [363, zesde lid][ref3], [377][ref4],
      [379][ref5], [380][ref6], [381a][ref7], [381b][ref8], [383][ref9], [383a tot en met 383e][ref10] en
      [384, vierde lid, van Boek 2 van het Burgerlijk Wetboek][ref11] van toepassing, met dien verstande dat in die
      artikelen:

      a. voor «winst- en verliesrekening» wordt gelezen: exploitatierekening;

      b. voor «de winst»: een positieve exploitatieresultaat;

      c. voor «het verlies»: een negatief exploitatieresultaat;

      d. voor «de algemene vergadering waarin zij wordt behandeld»: de datum waarop deze door Onze Minister wordt
      vastgesteld;

      e. voor «het bestuur» wordt gelezen: de korpschef;

      f. voor «de leden of aandeelhouders» wordt gelezen: Onze Minister;

      g. voor «het handelsregister» wordt gelezen: de inspectie, bedoeld in
      [artikel 57 van de Wet Veiligheidsregio’s][ref12];

      h. voor «omzet»: bijdragen van Onze Minister;

      i. voor de inrichting van de jaarrekening, de modellen, bedoeld in [artikel 3][ref13], tweede lid, worden gebruikt.

      2 Om redenen van doelmatigheid kan worden afgeweken van [artikel 374 van Boek 2 van het Burgerlijk Wetboek][ref14].
      In dat geval worden de redenen van doelmatigheid vermeld in de jaarrekening. Dotatie,
      onttrekking en vrijval van voorzieningen worden vermeld en afzonderlijk toegelicht
      in de jaarrekening. Dit lid is niet van toepassing op levensfase-uren als bedoeld in
      [artikel 1, eerste lid, onder rr, van het Besluit algemene rechtspositie politie][ref15].

      3 Op de balans wordt een voorziening voor levensfase-uren als bedoeld in
      [artikel 1, eerste lid, van het Besluit algemene rechtspositie politie][ref16] opgenomen, voor zover door
      levensfase-uren verwachte uitgaven ontstaan.

      4 Ten behoeve van de controle van de jaarrekening door de accountant, bedoeld in
      [artikel 35 van de Politiewet 2012][ref17], wordt het door Onze Minister vastgestelde controleprotocol gebruikt. De
      accountant wordt benoemd door Onze Minister, die de korpschef kan verzoeken daarvoor voorbereidende werkzaamheden
      te verrichten.

      5 Het verslag van de accountant bevat bevindingen over de vraag of het financieel beheer van de politie heeft
      voldaan aan de eisen van getrouwheid.

      6 Het verslag van de accountant, bedoeld in het vijfde lid, wordt ter beschikking gesteld aan Onze Minister.


