        artikel: '2.26'
      - id: ref2
        bwb_id: BWBR0039429
        artikel: '2.26'
  - number: '6'
    text: >-
      1 De korpschef verstrekt aan Onze Minister een 4-maands-, een 8-maands- en een 12-maandsmanagementrapportage en
      afzonderlijke managementrapportages over de maanden tot en met februari, juni en oktober.


      2 De 4-maands-, de 8-maands- en de 12-maandsmanagementrapportage worden telkens uiterlijk op respectievelijk
      1 juni, 1 oktober en 1 februari verstrekt aan Onze Minister.


      3 De managementrapportages over de maanden tot en met februari, juni en oktober worden binnen 4 weken na het einde
      van de betreffende periode verstrekt aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0036711/2025-04-01#Artikel6
  - number: '7'
    text: >-
      1 De korpschef zendt voor 1 april een ontwerp van de jaarrekening over het afgelopen verslagjaar aan Onze Minister.


      2 Onze Minister stelt jaarlijks vóór 15 mei, ten behoeve van zijn verantwoording aan de Staten-Generaal in het jaar
      volgend op het verslagjaar, de jaarrekening vast.


      3 De jaarrekening wordt als bijlage van het jaarverslag van het Ministerie van Justitie en Veiligheid ter
      informatie aan de Staten-Generaal gezonden.
    url: https://wetten.overheid.nl/BWBR0036711/2025-04-01#Artikel7
  - number: '8'
    text: |-
      1 De begroting en meerjarenraming bevatten een jaarlijks sluitende raming van de baten en lasten van de politie.

      2 In afwijking van het eerste lid kunnen de begroting en de meerjarenraming een negatief resultaat bevatten
      voor zover het negatieve resultaat wordt veroorzaakt door lasten waarvoor een bestemmingsreserve als bedoeld in
      [artikel 17][ref1] is gevormd.

      3 Onze Minister kan in overeenstemming met Onze Minister van Financiën, het eigen vermogen van de politie aanwenden
      om de begroting en de meerjarenraming sluitend te maken.


      [ref1]: https://wetten.overheid.nl/BWBR0036711#Artikel17
    url: https://wetten.overheid.nl/BWBR0036711/2025-04-01#Artikel8
    references:
