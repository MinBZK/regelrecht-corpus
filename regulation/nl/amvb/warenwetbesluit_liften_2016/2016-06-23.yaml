  - number: '1.2'
    text: |-
      Dit besluit is niet van toepassing op liften en veiligheidscomponenten voor liften als bedoeld in artikel 1, tweede
      en derde lid, van de richtlijn.
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel1
  - number: '1.3'
    text: Dit besluit is mede van toepassing op liften die voorhanden zijn of worden gebruikt in de particuliere huishouding.
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel1
  - number: '2.1'
    text: |-
      Het is verboden liften in de handel te brengen, in bedrijf te stellen of te gebruiken en veiligheidscomponenten
      voor liften op de markt aan te bieden, in bedrijf te stellen of te gebruiken die niet voldoen aan de bij of
      krachtens dit besluit gestelde voorschriften.
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel2
  - number: '2.2'
    text: |-
      Het is verboden liften in de handel te brengen en veiligheidscomponenten voor liften op de markt aan te bieden
      anders dan met inachtneming van de bij of krachtens dit besluit gestelde voorschriften met betrekking tot het
      bezigen van vermeldingen of aanduidingen.
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel2
  - number: '2.3'
    text: |-
      Het is verboden liften in de handel te brengen, in bedrijf te stellen of te gebruiken en veiligheidscomponenten
      voor liften op de markt aan te bieden, in bedrijf te stellen of te gebruiken, indien de bij of krachtens dit
      besluit voorgeschreven conformiteitbeoordelingsprocedures niet in acht zijn genomen.
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel2
  - number: '2.4'
    text: |-
      Het is verboden liften en veiligheidscomponenten voor liften te gebruiken anders dan met inachtneming van de
      voorschriften bij of krachtens dit besluit gesteld met betrekking tot het voorhanden zijn van documenten.
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel2
