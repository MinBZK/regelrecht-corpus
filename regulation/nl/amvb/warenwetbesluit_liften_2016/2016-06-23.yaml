  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Sociale Zaken en Werkgelegenheid van 18 december 2015, nr. 2015-0000309166;

    Gelet op richtlijn nr. 2014/33/EU van het Europees Parlement en de Raad van 26 februari 2014 betreffende de
    harmonisatie van de wetgevingen van de lidstaten inzake liften en veiligheidscomponenten voor liften (herschikking)
    (PbEU 2014, L 96), alsmede op de artikelen 4, eerste lid, 5, tweede lid, 7, 7a, derde lid, 11, 12, 13, 14 en 32b
    van de Warenwet, artikel 49 van de Mijnbouwwet, de artikelen 2 en 120 van de Woningwet en artikel 16, eerste,
    tweede en derde lid, van de Arbeidsomstandighedenwet;

    De Afdeling advisering van de Raad van State gehoord (advies van 21 januari 2016, nr. W12.15.0456/III);

    Gezien het nader rapport van Onze Minister van Sociale Zaken en Werkgelegenheid van 17 februari 2016, nr. 2016-
    0000017872;

    Hebben goedgevonden en verstaan:
