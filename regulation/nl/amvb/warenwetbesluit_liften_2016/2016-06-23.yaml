        artikel: '9'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0037650
        artikel: '10'
        hoofdstuk: '2'
  - number: '39.1'
    text: |-
      Dit besluit is niet van toepassing op veiligheidscomponenten die zijn voorzien van het EEG-merkteken en vergezeld
      gaan van het certificaat van overeenstemming, bedoeld in artikel 6 van de Regeling van de Staatssecretaris van
      Sociale Zaken en Werkgelegenheid van 16 juni 1987 ter uitvoering van de EEG-[richtlijnen 84/528/EEG](31984L0528)
      en [84/529/EEG](31984L0529) (hef- en verladingsapparatuur; liften met elektrische aandrijving) (Stcrt. 1987,
      124) en voor 1 juli 1999 in de handel zijn gebracht en in bedrijf zijn gesteld, voor zover zij niet alsnog in
      overeenstemming zijn gebracht met de eisen, bedoeld in artikel 3 van de richtlijn.
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel39
  - number: '39.2'
    text: |-
      Met betrekking tot de veiligheidscomponenten, bedoeld in het eerste lid, waarop dit besluit niet wordt toegepast
      en waarop krachtens een andere wettelijke regeling CE-markering wordt aangebracht, worden op de bij die
      veiligheidscomponenten gevoegde documenten, handleidingen en gebruiksaanwijzingen de in het Publicatieblad van
      de Europese Gemeenschappen bekendgemaakte referenties van de aan die wettelijke regelingen ten grondslag liggende
      richtlijnen vermeld.
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel39
  - number: '40'
    text: |-
      De aanwijzing als aangewezen instelling op verzoek als bedoeld in [artikel 23 van het Warenwetbesluit liften][ref1],
      afgegeven op grond van de [wet][ref2] en geldend op de dag voorafgaand aan de datum van inwerkingtreding, genoemd
      in [artikel 42, eerste lid][ref3], van dit besluit, wordt geacht te zijn afgegeven met inachtneming van de bij
      of krachtens dit besluit gestelde bepalingen, onverminderd het bepaalde bij of krachtens de [artikelen 28][ref4],
      [29][ref5] en [30][ref6].


