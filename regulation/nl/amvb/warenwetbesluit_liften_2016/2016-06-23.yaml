  - number: '38.2'
    text: |-
      Met betrekking tot de liften, bedoeld in het eerste lid, waarop de eisen, bedoeld in artikel 3 van de richtlijn,
      en de [artikelen 9][ref1] en [10][ref2] niet worden toegepast en waarop krachtens een of meer andere wettelijke
      regelingen de CE-markering wordt aangebracht, worden op de bij die liften gevoegde documenten, handleidingen of
      gebruiksaanwijzingen de in het Publicatieblad van de Europese Gemeenschappen bekendgemaakte referenties van de aan
      die wettelijke regelingen ten grondslag liggende richtlijnen vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0037650#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0037650#Artikel10
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel38
    references:
