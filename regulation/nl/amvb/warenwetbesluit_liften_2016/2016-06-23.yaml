  - number: '8.1'
    text: Liften voldoen aan de essentiële veiligheids- en gezondheidseisen als vermeld in bijlage I van de richtlijn.
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel8
  - number: '8.2'
    text: |-
      Liften die door installateurs in de handel worden gebracht en veiligheidscomponenten voor liften die door
      fabrikanten of importeurs in de handel worden gebracht of door distributeurs op de markt worden aangeboden,
      die in overeenstemming zijn met geharmoniseerde normen of delen daarvan, waarvan de referentienummers in het
      Publicatieblad van de Europese Unie zijn bekendgemaakt, worden vermoed te voldoen aan de eisen die door die normen
      of delen daarvan worden bestreken, zoals beschreven in artikel 14 en bijlage I van de richtlijn.
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel8
  - number: '9.1'
    text: |-
      Liften en veiligheidscomponenten voor liften die in de handel worden gebracht, zijn overeenkomstig de artikelen 18
      en 19 van de richtlijn, voorzien van de CE-markering.
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel9
  - number: '9.2'
    text: |-
      Liften en veiligheidscomponenten voor liften die niet zijn voorzien van de CE-markering of anderszins niet aan dit
      besluit voldoen, mogen op beurzen en exposities en bij demonstraties worden tentoongesteld met inachtneming van
      artikel 3, tweede lid, van de richtlijn.
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel9
  - number: '10.1'
    text: |-
      De beoordeling van de conformiteit van liften en veiligheidscomponenten voor liften, de afgifte van verklaringen en
      de verlening van goedkeuringen ter zake vinden plaats met inachtneming van de artikelen 15 en 16 van de richtlijn.
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel10
  - number: '10.2'
    text: |-
      Fabrikanten vragen de beoordeling van de conformiteit van veiligheidscomponenten voor liften, bedoeld in artikel 15
      van de richtlijn, aan bij de EU-conformiteitsbeoordelingsinstantie, bedoeld in [artikel 12][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037650#Artikel12
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0037650
        artikel: '12'
        hoofdstuk: '2'
  - number: '10.3'
    text: |-
      Installateurs vragen de beoordeling van de conformiteit van een lift, bedoeld in artikel 16, eerste lid, van de
      richtlijn aan bij de EU-conformiteitsbeoordelingsinstantie, bedoeld in [artikel 12][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037650#Artikel12
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0037650
        artikel: '12'
        hoofdstuk: '2'
  - number: '10.4'
    text: |-
      De bescheiden en briefwisseling betreffende de in de artikelen 15 en 16 van de richtlijn bedoelde
      conformiteitbeoordelingsprocedures zijn in ieder geval gesteld in de Nederlandse taal of in een door de EU-
      conformiteitsbeoordelingsinstantie, bedoeld in [artikel 12][ref1], aanvaarde andere taal.


      [ref1]: https://wetten.overheid.nl/BWBR0037650#Artikel12
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0037650
        artikel: '12'
        hoofdstuk: '2'
  - number: '11'
    text: |-
      De EU-conformiteitsbeoordelingsinstantie trekt een door haar afgegeven verklaring van EU-typeonderzoek of EU-
      ontwerponderzoek of een verleende goedkeuring van een kwaliteitssysteem als bedoeld in bijlage IV tot en met
      XII bij de richtlijn, in als de essentiële veiligheidseisen of voorgeschreven gebruiksomstandigheden, bedoeld in
      bijlage I bij de richtlijn, zodanig zijn gewijzigd dat het type, ontwerp of kwaliteitssysteem niet meer voldoet aan
      de gewijzigde eisen op het tijdstip waarop deze volgens de richtlijn van toepassing zijn.
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel11
  - number: '12.1'
    text: |-
      Bij een verzoek aan Onze Minister als bedoeld in [artikel 7a van de wet][ref1], voldoet de aanvrager aan artikel
      27, eerste en tweede lid, van de richtlijn.


      [ref1]: https://wetten.overheid.nl/BWBR0001969#Artikel7a
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0001969
        artikel: 7a
  - number: '12.2'
    text: |-
      Een EU-conformiteitsbeoordelingsinstantie voldoet aan of zorgt dat wordt voldaan aan de volgende bepalingen van
      de richtlijn:
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel12
  - number: 12.2.a
    text: artikel 24, tweede tot en met elfde lid;
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel12
  - number: 12.2.b
    text: artikel 32; en
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel12
  - number: 12.2.c
    text: artikel 34.
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel12
  - number: '12.3'
    text: |-
      Een EU-conformiteitsbeoordelingsinstantie die taken uitbesteedt of door ondergeschikte instanties laat uitvoeren
      voldoet aan artikel 26 van de richtlijn.
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel12
  - number: '12.4'
    text: |-
      Een EU-conformiteitsbeoordelingsinstantie voldoet aan de criteria, genoemd in het eerste, tweede en derde lid.
      Zij toont dit aan door middel van een accreditatie tegen de van toepassing zijnde geharmoniseerde normen of delen
      daarvan, mits die normen de eisen, bedoeld in de eerste zin, dekken en de referentienummers van die normen in het
      Publicatieblad van de Europese Unie zijn bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel12
  - number: '12.5'
    text: |-
      Indien de EU-conformiteitsbeoordelingsinstantie geen bewijs van accreditatie kan overleggen, verschaft zij Onze
      Minister alle bewijsstukken die nodig zijn om aan te tonen dat zij voldoet aan de criteria, genoemd in het eerste,
      tweede en derde lid.
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel12
  - number: '13.1'
    text: |-
      Onze Minister weigert een aanwijzing als EU-conformiteitsbeoordelingsinstantie indien de aanvrager niet heeft
      voldaan aan het bepaalde bij of krachtens [artikel 12, eerste tot en met vijfde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037650#Artikel12
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0037650
        artikel: '12'
        hoofdstuk: '2'
  - number: '13.2'
    text: |-
      Een aanwijzing kan worden geschorst, ten nadele van de EU-conformiteitsbeoordelingsinstantie worden gewijzigd of
      ingetrokken:
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel13
  - number: 13.2.a
    text: |-
      op grond van door de EU-conformiteitsbeoordelingsinstantie verstrekte onjuiste inlichtingen over feiten of
      omstandigheden, mits de onjuistheid daarvan aan deze instantie bekend was of kon zijn;
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel13
  - number: 13.2.b
    text: |-
      indien de EU-conformiteitsbeoordelingsinstantie niet meer voldoet aan het bepaalde bij of krachtens
      [artikel 12, eerste tot en met vijfde lid][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0037650#Artikel12
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0037650
        artikel: '12'
        hoofdstuk: '2'
  - number: 13.2.c
    text: |-
      indien de EU-conformiteitsbeoordelingsinstantie haar wettelijke verplichtingen niet meer naar behoren nakomt of de
      taken waarvoor zij is aangewezen, niet meer naar behoren uitvoert.
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel13
  - number: '13.3'
    text: |-
      Een aanwijzing kan worden geweigerd of ingetrokken in het geval en onder de voorwaarden, bedoeld in
      [artikel 3 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel3
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '3'
  - number: '13.4'
    text: |-
      Voordat toepassing wordt gegeven aan het derde lid kan het Bureau
      bevordering integriteitsbeoordelingen door het openbaar bestuur, bedoeld in
      [artikel 8 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur,][ref1] om een advies als
      bedoeld in [artikel 9 van die wet][ref2], worden gevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0013798#Artikel9
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0013798
        artikel: '9'
  - number: '14.1'
    text: |-
      Bij de uitoefening van zijn taken als aanmeldende autoriteit voldoet Onze Minister aan de artikelen 22 en 28 van
      de richtlijn.
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel14
  - number: '14.2'
    text: Onze Minister verricht de taken, bedoeld in artikel 21, tweede lid, van de richtlijn.
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel14
  - number: '15.1'
    text: |-
      Tijdens de looptijd van de aanwijzing stelt Onze Minister periodiek vast of de EU-
      conformiteitsbeoordelingsinstantie:
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel15
  - number: 15.1.a
    text: |-
      nog voldoet aan het bepaalde bij of krachtens [artikel 12, eerste tot en met vijfde lid][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0037650#Artikel12
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0037650
        artikel: '12'
        hoofdstuk: '2'
  - number: 15.1.b
    text: haar wettelijke verplichtingen naar behoren nakomt en de taken waarvoor zij is aangewezen, naar behoren uitvoert.
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel15
  - number: '15.2'
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld betreffende het kosteloos gegevens en inlichtingen
      verstrekken door de EU-conformiteitsbeoordelingsinstantie aan Onze Minister of de nationale accreditatie-instantie
      dan wel door Onze Minister of de nationale accreditatie-instantie aan de EU-conformiteitsbeoordelingsinstantie, die
      zijn verkregen door de uitvoering of het toezicht op de naleving van het bepaalde bij of krachtens de [wet][ref1],
      die noodzakelijk zijn voor de uitvoering van hun wettelijke taken.


      [ref1]: https://wetten.overheid.nl/BWBR0001969
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0001969
  - number: '15.3'
    text: |-
      Een EU-conformiteitsbeoordelingsinstantie die haar taken waarvoor zij is aangewezen, beëindigt, of waarvan
      de aanwijzing door Onze Minister wordt ingetrokken, is verplicht tijdig voorafgaand aan de beëindiging van de
      werkzaamheden respectievelijk de datum, waarop de aanwijzing eindigt, haar dossiers over te dragen aan een andere
      EU-conformiteitsbeoordelingsinstantie waarmee de marktdeelnemer een overeenkomst is aangegaan. Indien er geen
      andere EU-conformiteitsbeoordelingsinstantie is, draagt de EU-conformiteitsbeoordelingsinstantie de dossiers over
      aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel15
  - number: '16'
    text: |-
      Degene die verantwoordelijk is voor de verwezenlijking van het gebouw of het bouwwerk en degene die de lift in of
      aan het gebouw of bij het bouwwerk installeert, verstrekken elkaar de nodige gegevens voor de goede werking en het
      veilige gebruik van de lift en treffen passende maatregelen teneinde de goede werking en het veilige gebruik van de
      lift te waarborgen.
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel16
  - number: '17'
    text: |-
      Een wijziging van de richtlijn gaat voor de toepassing van dit besluit gelden met ingang van de dag waarop aan de
      betrokken wijziging uitvoering moet zijn gegeven, tenzij bij ministerieel besluit, dat in de Staatscourant wordt
      bekendgemaakt, een ander tijdstip wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel17
  - number: '18.1'
    text: |-
      Liften worden ten hoogste twaalf maanden na de eerste ingebruikneming en vervolgens telkens na verloop van ten
      hoogste achttien maanden door een NL-conformiteitsbeoordelingsinstantie gekeurd. Bij ministeriële regeling kan
      worden bepaald dat de NL-conformiteitsbeoordelingsinstantie kan verlangen dat een lift, in geval van door haar
      geconstateerde ernstige gebreken, na een kortere termijn dan de termijnen, bedoeld in de eerste zin, wordt
      onderzocht op de staat van veiligheid.
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel18
  - number: '18.2'
    text: |-
      Liften als bedoeld in het eerste lid, die worden gebruikt tijdens de bouwfase van een bouwwerk zoals
      bedoeld in [artikel 1.1, tweede lid, onder b, van het Arbeidsomstandighedenbesluit][ref1], worden vóór
      de eerste ingebruikneming en vervolgens telkens na verloop van ten hoogste drie maanden door een NL-
      conformiteitsbeoordelingsinstantie gekeurd. Het eerste lid, tweede zin, is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel1
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '1'
  - number: '18.3'
    text: |-
      Liften worden vóór de ingebruikneming na elke reparatie of wijziging door een NL-conformiteitsbeoordelingsinstantie
      gekeurd.
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel18
  - number: '18.4'
    text: |-
      Bij de keuring vóór de eerste ingebruikneming, bedoeld in het tweede lid, wordt gecontroleerd of de documenten
      van de conformiteitsprocedures, bedoeld in [artikel 10][ref1], aanwezig en juist zijn. Bij de keuring voor de
      ingebruikneming na reparatie of wijziging, bedoeld in het derde lid, wordt getoetst of ten minste is voldaan aan de
      voor de desbetreffende lift geldende vervaardigingvoorschriften, bedoeld in artikel 16 van de richtlijn.


      [ref1]: https://wetten.overheid.nl/BWBR0037650#Artikel10
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0037650
        artikel: '10'
        hoofdstuk: '2'
  - number: '18.5'
    text: |-
      Bij de keuringen, bedoeld in het eerste en tweede lid, wordt getoetst of nog ten minste is voldaan aan de voor de
      desbetreffende lift geldende vervaardigingsvoorschriften van artikel 16 van de richtlijn en, wat betreft de liften,
      bedoeld in het eerste lid, aan [artikel 7.21, eerste lid, van het Arbeidsomstandighedenbesluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel7
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '7'
  - number: '18.6'
    text: |-
      Als blijk van goedkeuring brengt de NL-conformiteitsbeoordelingsinstantie op een duidelijk zichtbare plaats op de
      lift een kenmerk aan, waarop tevens de herkeuringstermijn, genoemd in het eerste en tweede lid, wordt aangegeven.
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel18
  - number: '18.7'
    text: |-
      Degene die een lift voorhanden heeft verstrekt Onze Minister of, indien Onze Minister een NL-
      conformiteitsbeoordelingsinstantie heeft aangewezen, deze instantie, desgevraagd kosteloos alle informatie die
      nodig is voor de uitvoering van het bepaalde bij of krachtens dit artikel.
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel18
  - number: '18.8'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ter uitvoering van het vierde en vijfde lid.
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel18
  - number: '19'
    text: |-
      Onze Minister of, indien Onze Minister een NL-conformiteitsbeoordelingsinstantie heeft aangewezen, deze instantie,
      geeft op verzoek een certificaat van goedkeuring af wanneer hij respectievelijk zij heeft vastgesteld dat is
      voldaan aan de bij of krachtens [artikel 18, vierde en vijfde lid][ref1], gestelde keuringseisen.


      [ref1]: https://wetten.overheid.nl/BWBR0037650#Artikel18
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0037650
        artikel: '18'
        hoofdstuk: '3'
  - number: '20.1'
    text: |-
      De afgifte van een certificaat van goedkeuring als bedoeld in [artikel 19][ref1], wordt geweigerd indien de
      verzoeker niet heeft voldaan aan het bij of krachtens dit besluit met betrekking tot het certificaat gestelde
      eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0037650#Artikel19
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0037650
        artikel: '19'
        hoofdstuk: '3'
  - number: '20.2'
    text: |-
      Een certificaat van goedkeuring kan worden geschorst, ten nadele van de certificaathouder worden gewijzigd of
      ingetrokken:
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel20
  - number: 20.2.a
    text: |-
      op grond van feiten of omstandigheden waarvan Onze Minister of, indien Onze Minister een NL-
      conformiteitsbeoordelingsinstantie heeft aangewezen, deze instantie, bij het afgeven van het certificaat
      redelijkerwijs niet op de hoogte kon zijn en hij respectievelijk zij het certificaat op grond daarvan niet of
      alleen met voorschriften, bedoeld in [artikel 7a, vierde lid, van de wet][ref1], zou hebben gegeven;


      [ref1]: https://wetten.overheid.nl/BWBR0001969#Artikel7a
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0001969
        artikel: 7a
  - number: 20.2.b
    text: |-
      op grond van door de certificaathouder verstrekte onjuiste inlichtingen over feiten en omstandigheden, mits de
      onjuistheid daarvan aan de certificaathouder bekend was of kon zijn;
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel20
  - number: 20.2.c
    text: |-
      indien de certificaathouder niet meer voldoet aan de bij of krachtens dit besluit met betrekking tot het
      certificaat gestelde eisen of zijn wettelijke verplichtingen niet meer naar behoren nakomt; of
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel20
  - number: 20.2.d
    text: |-
      indien de certificaathouder met zijn werkzaamheden, voor zover die door het certificaat worden gereguleerd, of door
      de wijze waarop hij de werkzaamheden verricht, ernstig gevaar veroorzaakt of kan veroorzaken voor personen.
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel20
  - number: '21.1'
    text: |-
      Een lift gaat vergezeld van de instructies en een liftboek als bedoeld in punt 6.2 van bijlage I van de richtlijn.
      Deze zijn in ieder geval gesteld in de Nederlandse taal.
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel21
  - number: '21.2'
    text: |-
      Een veiligheidscomponent voor liften gaat vergezeld van de instructies, bedoeld in punt 6.1 van bijlage I, van de
      richtlijn. Deze zijn in ieder geval gesteld in de Nederlandse taal.
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel21
  - number: '21.3'
    text: |-
      Het certificaat van goedkeuring, bedoeld in [artikel 19][ref1], en het liftboek, bedoeld in het eerste lid, of een
      afschrift daarvan worden desgevraagd getoond aan de functionaris, bedoeld in [artikel 25 van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037650#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0001969#Artikel25
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0037650
        artikel: '19'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0001969
        artikel: '25'
  - number: '22.1'
    text: |-
      Degene die een lift voorhanden heeft, die in gebruik of voor gebruik gereed is, of die een lift aflevert, zorgt
      ervoor dat die lift en de daarop aangebrachte veiligheidscomponenten voor liften in goede staat van onderhoud
      verkeren.
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel22
  - number: '22.2'
    text: |-
      Degene die een lift voorhanden heeft en gebruikt zorgt ervoor dat die lift en de daarop aangebrachte
      veiligheidscomponenten voor liften overeenkomstig hun bestemming worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel22
  - number: '22.3'
    text: |-
      Het eerste en tweede lid zijn niet van toepassing voor zover de lift hetzij is afgekeurd hetzij onklaar is gemaakt
      hetzij anderszins kennelijk niet meer voor gebruik is bestemd.
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel22
  - number: '23'
    text: 'Degene die een lift bedient, bestuurt of belaadt, zorg ervoor dat:'
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel23
  - number: 23.a
    text: |-
      de toelaatbare belasting en het aantal toe te laten mensen, aangegeven op opschriften in de kooi, niet worden
      overschreden;
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel23
  - number: 23.b
    text: |-
      bij vervoer van goederen de belasting zo gelijkmatig mogelijk over het vloeroppervlak van de kooi wordt verdeeld;
      en
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel23
  - number: 23.c
    text: |-
      ingeval van liften zonder kooiafsluiting, wagens voor het vervoer van goederen, alsmede de beweegbare onderdelen
      van die wagens, in de kooi zijn vastgezet.
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel23
  - number: '24.1'
    text: 'Degene die een lift voorhanden heeft, zorgt ervoor dat:'
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel24
  - number: 24.1.a
    text: |-
      in liftschachten geen leidingen of installaties aanwezig zijn die niet voor de werking of veiligheid van de lift
      zijn vereist;
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel24
  - number: 24.1.b
    text: |-
      machinekamers, schijvenruimten en schachtputten niet worden gebruikt als bergruimte van voorwerpen, welke niet tot
      de lift behoren;
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel24
  - number: 24.1.c
    text: machinekamers, schijvenruimten en luiken, bestemd voor inspectie en onderhoud, zijn afgesloten met slot en sleutel;
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel24
  - number: 24.1.d
    text: |-
      de onder c bedoelde sleutels zijn voorzien van aanduidingen en op een uitsluitend voor bevoegden toegankelijke
      plaats worden bewaard; en
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel24
  - number: 24.1.e
    text: |-
      nabij de tornmiddelen een aanwijzing is opgehangen, waarin is aangegeven, op welke wijze de machine kan worden
      getornd.
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel24
  - number: '24.2'
    text: |-
      Degene die een lift zonder kooiafsluiting voorhanden heeft, welke bestemd is voor het vervoer van goederen onder
      begeleiding van een persoon, zorgt ervoor dat die lift slechts wordt bediend door mensen die met die bediening
      vertrouwd zijn.
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel24
  - number: '25.1'
    text: |-
      Een lift die niet geschikt is voor gebruik, is op zodanige wijze buiten gebruik gesteld, dat deze niet door een
      liftgebruiker weer in gebruik te stellen is. Alle nodige veiligheidsmaatregelen zijn genomen om de bescherming van
      personen te waarborgen.
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel25
  - number: '25.2'
    text: |-
      Degene die een lift voorhanden heeft, die is voorzien van een merk van afkeuring, zorgt ervoor dat de schachtdeuren
      van de lift niet zonder bijzondere hulpmiddelen kunnen worden geopend en op of nabij elke schachtdeur van de lift
      duidelijk en opvallend een opschrift, waaruit blijkt dat de lift is afgekeurd, is aangebracht.
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel25
  - number: '26.1'
    text: |-
      Als NL-conformiteitsbeoordelingsinstantie kunnen worden aangewezen de instellingen die voldoen aan de volgende
      eisen:
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel26
  - number: 26.1.a
    text: artikel 24, tweede, derde, vierde, vijfde, zevende, achtste en negende lid, van de richtlijn;
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel26
  - number: 26.1.b
    text: |-
      zij zijn in staat alle conformiteitsbeoordelingstaken te verrichten waarvoor zij aangewezen zijn, ongeacht of deze
      taken door henzelf of namens hen en onder hun verantwoordelijkheid worden verricht;
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel26
  - number: 26.1.c
    text: |-
      hun medewerkers zijn gebonden aan het beroepsgeheim ten aanzien van alle informatie waarvan zij kennisnemen bij de
      uitoefening van hun wettelijke taken, behalve ten opzichte van de bevoegde autoriteiten;
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel26
  - number: 26.1.d
    text: |-
      zij beschikken over een registratiesysteem waarin de gegevens die samenhangen met en betrekking hebben op het
      verrichten van de conformiteitsbeoordelingstaken waarvoor zij aangewezen willen worden, naar behoren worden
      vastgelegd; en
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel26
  - number: 26.1.e
    text: |-
      zij hebben een schemabeheerder voor het ontwikkelen, onderhouden en publiekelijk en kosteloos toegankelijk maken
      van een schema, dat onverkort door hen wordt gebruikt. De schemabeheerder houdt naar behoren rekening met de
      belangen van alle partijen die belang hebben bij het schema, zonder dat één van de belangen de overhand heeft.
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel26
  - number: '26.2'
    text: 'Indien er meerdere NL-conformiteitsbeoordelingsinstanties zijn aangewezen:'
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel26
  - number: 26.2.a
    text: |-
      nemen zij deel aan het door hen gezamenlijk te organiseren overleg ten einde te komen tot het geharmoniseerd
      verrichten van de conformiteitsbeoordelingstaken waarvoor zij zijn aangewezen;
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel26
  - number: 26.2.b
    text: |-
      wijzen zij een schemabeheerder aan voor het opstellen, onderhouden en publiekelijk en kosteloos toegankelijk maken
      van een gezamenlijk schema, dat onverkort door hen wordt gebruikt;
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel26
  - number: 26.2.c
    text: |-
      hanteren zij de in het overleg genomen administratieve beslissingen en opgestelde documenten als algemene
      richtsnoeren; en
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel26
  - number: 26.2.d
    text: |-
      zorgen zij ervoor dat hun medewerkers die de conformiteitsbeoordelingstaken verrichten, op de hoogte zijn van de
      activiteiten, administratieve beslissingen en opgestelde documenten van het overleg.
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel26
  - number: '26.3'
    text: 'NL-conformiteitsbeoordelingsinstanties brengen Onze Minister op de hoogte van:'
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel26
  - number: 26.3.a
    text: elke weigering, beperking, schorsing of intrekking van goedkeuringen;
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel26
  - number: 26.3.b
    text: omstandigheden die van invloed zijn op de werkingssfeer van of de voorwaarden voor aanwijzing;
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel26
  - number: 26.3.c
    text: informatieverzoeken over conformiteitsbeoordelingsactiviteiten die zij van Onze Minister ontvangen; en
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel26
  - number: 26.3.d
    text: |-
      op verzoek, de binnen de werkingssfeer van hun aanwijzing verrichte conformiteitsbeoordelingsactiviteiten en andere
      activiteiten waaronder uitbesteding.
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel26
  - number: '26.4'
    text: |-
      NL-conformiteitsbeoordelingsinstanties verstrekken de andere uit hoofde van dit besluit aangewezen NL-
      conformiteitsbeoordelingsinstanties die soortgelijke conformiteitsbeoordelingsactiviteiten voor liften verrichten,
      relevante informatie over negatieve conformiteitsbeoordelingsresultaten, en, op verzoek, over positieve
      conformiteitsbeoordelingsresultaten.
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel26
  - number: '26.5'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot dit artikel.
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel26
  - number: '27.1'
    text: |-
      Indien NL-conformiteitsbeoordelingsinstanties conformiteitsbeoordelingstaken uitbesteden of door een
      dochteronderneming laten uitvoeren, waarborgen zij dat de onderaannemer of dochteronderneming aan de eisen, bedoeld
      in [artikel 26, eerste, tweede en derde lid][ref1], voldoet en brengen zij Onze Minister hiervan op de hoogte.


      [ref1]: https://wetten.overheid.nl/BWBR0037650#Artikel26
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0037650
        artikel: '26'
        hoofdstuk: '3'
  - number: '27.2'
    text: |-
      NL-conformiteitsbeoordelingsinstanties nemen de volledige verantwoordelijkheid op zich voor de
      conformiteitsbeoordelingstaken die worden verricht door een onderaannemer of dochteronderneming.
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel27
  - number: '27.3'
    text: |-
      NL-conformiteitsbeoordelingsinstanties zorgen ervoor dat de activiteiten van een onderaannemer of
      dochteronderneming geen afbreuk doen aan de vertrouwelijkheid, objectiviteit en onpartijdigheid van de door henzelf
      te verrichten conformiteitsbeoordelingstaken.
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel27
  - number: '27.4'
    text: |-
      Conformiteitsbeoordelingstaken mogen uitsluitend met instemming van de klant worden uitbesteed of door een
      dochteronderneming worden verricht.
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel27
  - number: '27.5'
    text: |-
      NL-conformiteitsbeoordelingsinstanties houden alle relevante documenten betreffende de beoordeling van
      de kwalificaties van een onderaannemer of dochteronderneming en betreffende de door een onderaannemer of
      dochteronderneming uit hoofde van dit besluit verrichte conformiteitsbeoordelingstaken ter beschikking van Onze
      Minister.
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel27
  - number: '28.1'
    text: |-
      De instelling, bedoeld in [artikel 26][ref1], dient de aanvraag tot aanwijzing in bij Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0037650#Artikel26
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0037650
        artikel: '26'
        hoofdstuk: '3'
  - number: '28.2'
    text: |-
      Een NL-conformiteitsbeoordelingsinstantie toont aan dat zij voldoet aan de criteria, genoemd in de
      [artikelen 26, eerste, tweede, derde en vierde lid][ref1], en [27][ref2] door middel van een accreditatie tegen de
      van toepassing zijnde geharmoniseerde normen of delen daarvan, mits die normen de eerdergenoemde eisen dekken en de
      referentienummers van die normen in het Publicatieblad van de Europese Unie zijn bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0037650#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0037650#Artikel27
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0037650
        artikel: '26'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0037650
        artikel: '27'
        hoofdstuk: '3'
  - number: '28.3'
    text: |-
      Indien de NL-conformiteitsbeoordelingsinstantie geen bewijs van accreditatie kan overleggen, verschaft zij Onze
      Minister alle bewijsstukken die nodig zijn om aan te tonen dat zij voldoet aan de criteria, genoemd in het tweede
      lid.
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel28
  - number: '28.4'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de indiening van de aanvraag en de
      afhandeling van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel28
  - number: '29.1'
    text: |-
      Onze Minister weigert een aanwijzing als NL-conformiteitsbeoordelingsinstantie indien
      de aanvragende instelling niet heeft voldaan aan het bepaalde bij of krachtens de
      [artikelen 26, eerste, tweede, derde, vierde en vijfde lid][ref1], en [27][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037650#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0037650#Artikel27
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0037650
        artikel: '26'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0037650
        artikel: '27'
        hoofdstuk: '3'
  - number: '29.2'
    text: |-
      Een aanwijzing kan worden geschorst, ten nadele van de NL-conformiteitsbeoordelingsinstantie worden gewijzigd of
      ingetrokken:
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel29
  - number: 29.2.a
    text: |-
      op grond van door de NL-conformiteitsbeoordelingsinstantie verstrekte onjuiste inlichtingen over feiten of
      omstandigheden, mits de onjuistheid daarvan aan de instelling bekend was of kon zijn;
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel29
  - number: 29.2.b
    text: |-
      indien de NL-conformiteitsbeoordelingsinstantie niet voldoet aan het bepaalde bij of krachtens de
      [artikelen 26, eerste, tweede, derde, vierde en vijfde lid][ref1], en [27][ref2]; of


      [ref1]: https://wetten.overheid.nl/BWBR0037650#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0037650#Artikel27
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0037650
        artikel: '26'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0037650
        artikel: '27'
        hoofdstuk: '3'
  - number: 29.2.c
    text: |-
      indien de NL-conformiteitsbeoordelingsinstantie haar wettelijke verplichtingen niet naar behoren nakomt of de taken
      waarvoor zij is aangewezen, niet naar behoren uitvoert.
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel29
  - number: '30.1'
    text: 'Tijdens de looptijd van de aanwijzing stelt Onze Minister periodiek vast of de instelling:'
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel30
  - number: 30.1.a
    text: |-
      nog voldoet aan het bepaalde bij of krachtens [artikelen 26, eerste, tweede, derde, vierde en vijfde lid][ref1], en
      [27][ref2]; en


      [ref1]: https://wetten.overheid.nl/BWBR0037650#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0037650#Artikel27
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0037650
        artikel: '26'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0037650
        artikel: '27'
        hoofdstuk: '3'
  - number: 30.1.b
    text: haar wettelijke verplichtingen naar behoren nakomt en de taken waarvoor zij is aangewezen, naar behoren uitvoert.
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel30
  - number: '30.2'
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld betreffende het kosteloos gegevens en inlichtingen
      verstrekken door de NL-conformiteitsbeoordelingsinstantie aan Onze Minister of de nationale accreditatie-instantie
      dan wel door Onze Minister of de nationale accreditatie-instantie aan de NL-conformiteitsbeoordelingsinstantie, die
      zijn verkregen door de uitvoering of het toezicht op de naleving van het bepaalde bij of krachtens de [wet][ref1],
      welke noodzakelijk zijn voor de uitvoering van hun wettelijke taken.


      [ref1]: https://wetten.overheid.nl/BWBR0001969
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0001969
  - number: '30.3'
    text: |-
      Een NL-conformiteitsbeoordelingsinstantie die haar taken waarvoor zij is aangewezen, beëindigt, of waarvan
      de aanwijzing door Onze Minister wordt ingetrokken, is verplicht tijdig voorafgaand aan de beëindiging van de
      werkzaamheden respectievelijk de datum, waarop de aanwijzing eindigt, haar dossiers over te dragen aan een andere
      NL-conformiteitsbeoordelingsinstantie waarmee de marktdeelnemer een overeenkomst is aangegaan. Indien er geen
      andere NL-conformiteitsbeoordelingsinstantie is, draagt de NL-conformiteitsbeoordelingsinstantie de dossiers over
      aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel30
  - number: '34.1'
    text: |-
      Liften en veiligheidscomponenten die voldoen aan het [Warenwetbesluit liften][ref1], zoals dat onmiddellijk vóór
      20 april 2016 luidde, en vóór dat tijdstip in de handel zijn gebracht, mogen ook na dat tijdstip op de markt worden
      aangeboden of in bedrijf worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0008212
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0008212
  - number: '34.2'
    text: |-
      Een certificaat van goedkeuring afgegeven op grond van de [wet][ref1], en geldend op dag, voorafgaand aan de datum
      van inwerkingtreding, genoemd in [artikel 42, tweede lid][ref2], van dit besluit, wordt geacht te zijn afgegeven
      met inachtneming van de bij of krachtens dit besluit gestelde bepalingen, onverminderd het bepaalde bij of
      krachtens de [artikelen 1][ref3], [11][ref4], [18][ref5] en [20][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0001969
      [ref2]: https://wetten.overheid.nl/BWBR0037650#Artikel42
      [ref3]: https://wetten.overheid.nl/BWBR0037650#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0037650#Artikel11
      [ref5]: https://wetten.overheid.nl/BWBR0037650#Artikel18
      [ref6]: https://wetten.overheid.nl/BWBR0037650#Artikel20
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0001969
      - id: ref2
        bwb_id: BWBR0037650
        artikel: '42'
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0037650
        artikel: '1'
        hoofdstuk: '1'
      - id: ref4
        bwb_id: BWBR0037650
        artikel: '11'
        hoofdstuk: '2'
      - id: ref5
        bwb_id: BWBR0037650
        artikel: '18'
        hoofdstuk: '3'
      - id: ref6
        bwb_id: BWBR0037650
        artikel: '20'
        hoofdstuk: '3'
  - number: '35.1'
    text: |-
      De eisen, bedoeld in artikel 3 van de richtlijn, en de [artikelen 9][ref1] en [10][ref2] zijn niet van toepassing
      ten aanzien van liften die vóór 16 augustus 1991 in bedrijf zijn gesteld en die:


      [ref1]: https://wetten.overheid.nl/BWBR0037650#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0037650#Artikel10
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0037650
        artikel: '9'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0037650
        artikel: '10'
        hoofdstuk: '2'
  - number: 35.1.a
    text: geheel voldoen aan de hoofdstukken II tot en met X en XII van N 1081, uitgegeven in december 1950;
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel35
  - number: 35.1.b
    text: |-
      voldoen aan de hoofdstukken II tot en met X en XII van N 1081, uitgegeven in december 1950, met uitzondering
      van de artikelen 5, derde lid, 8, tweede lid, 12, vijfde lid, 13, tweede lid, eerste zin, 16, eerste tot en met
      vierde lid, 17, tweede en derde lid, 19, eerste lid, 20, derde lid, 21, laatste zin, 22, tweede lid, 26, derde
      lid, tweede zin, en vierde lid, 27, derde lid, 28, eerste lid, onder *a*, en tweede lid, onder *e*, 32, 34, eerste
      lid, onder c, en tweede lid, onder a en b, 41, derde lid, onder b2, en vierde lid, 42, tweede lid, 43, eerste lid,
      48, derde lid, en 49, tweede en vierde lid, vanaf de tweede zin, mits zij voldoen aan de met de hiervoor genoemde
      bepalingen van N 1081 overeenkomende bepalingen van NEN 1081, uitgegeven in december 1971, zoals gewijzigd in
      februari 1989, met dien verstande dat, indien de kooiafsluitingen van een lift mechanisch worden aangedreven, de
      blokkeerinrichting in de kooi achterwege mag blijven;
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel35
  - number: 35.1.c
    text: |-
      geheel voldoen aan de hoofdstukken II tot en met X en XII van NEN 1081, uitgegeven in december 1971, zoals
      gewijzigd in februari 1989; of
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel35
  - number: 35.1.d
    text: geheel voldoen aan de hoofdstukken 0 tot en met 16 van NEN-EN 81-1, eerste druk, uitgegeven in juni 1979.
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel35
  - number: '35.2'
    text: |-
      In afwijking van het eerste lid, aanhef en onderdelen a, b en c, voldoen de daar bedoelde liften die in bedrijf
      zijn gesteld op of na 24 januari 1978 ten aanzien van kooitoegangen en de vloeroppervlakte van de kooi aan hetgeen
      daaromtrent is bepaald in NEN-EN 81-1, eerste druk, uitgegeven in juni 1979, met dien verstande dat voor liften
      met hydraulische aandrijving in punt 8.2.1 van die norm, in noot c, onder tabel 1.1 in plaats van «0,16 m2», geldt:
      0,50 m2. Het in de vorige zin bepaalde geldt niet ten aanzien van liften voor de levering waarvan opdracht is
      gegeven vóór 24 oktober 1978 en die voor eerste keuring zijn gereed gekomen vóór 24 juli 1979.
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel35
  - number: '36'
    text: |-
      De eisen, bedoeld in artikel 3 van de richtlijn, en de [artikelen 9][ref1] en [10][ref2] zijn niet van toepassing
      op liften die tussen 16 augustus 1991 en 1 juli 1997 in bedrijf zijn gesteld, indien voor de levering daarvan
      opdracht is gegeven vóór 16 augustus 1991, mits zij voldoen aan [artikel 35, eerste lid, onder c][ref3], en tevens
      aan het tweede lid van dat artikel, dan wel in het geval van een lift met elektrische aandrijving aan artikel 35,
      eerste lid, onder d.


      [ref1]: https://wetten.overheid.nl/BWBR0037650#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0037650#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0037650#Artikel35
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0037650
        artikel: '9'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0037650
        artikel: '10'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0037650
        artikel: '35'
        hoofdstuk: '5'
  - number: '37'
    text: |-
      De eisen, bedoeld in artikel 3 van de richtlijn, en de [artikelen 9][ref1] en [10][ref2] zijn niet van toepassing
      op liften die tussen 16 augustus 1991 en 1 juli 1999 in bedrijf zijn gesteld en die geheel voldoen aan hetgeen ten
      aanzien van de vervaardiging is bepaald in de hoofdstukken 0 tot en met 16 en bijlage Z van NEN-EN 81-1, tweede
      druk, uitgegeven in september 1986, zoals gewijzigd in december 1989, in onderscheidenlijk NEN-EN 81-2, eerste
      druk, uitgegeven in mei 1989, met dien verstande dat in plaats van punt 13.1.1.4 van die normen het volgende geldt:
      «De elektrische installatie van liften dient te voldoen aan de eisen vermeld in de geharmoniseerde documenten van
      het Europees Comité voor elektrotechnische normalisatie (CENELEC) welke zijn goedgekeurd door de nationale comités
      voor de elektrotechniek van de landen van de Europese Economische Gemeenschap».


      [ref1]: https://wetten.overheid.nl/BWBR0037650#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0037650#Artikel10
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0037650
        artikel: '9'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0037650
        artikel: '10'
        hoofdstuk: '2'
  - number: '38.1'
    text: |-
      De eisen, bedoeld in artikel 3 van de richtlijn, en de [artikelen 9][ref1] en [10][ref2] van dit besluit zijn niet
      van toepassing op liften die zijn vervaardigd in overeenstemming met de vervaardigingsvoorschriften, bedoeld in
      [artikel 37][ref3], en die voor 1 juli 1999 in de handel zijn gebracht en in bedrijf zijn gesteld, voor zover zij
      niet alsnog in overeenstemming zijn gebracht met de eisen, bedoeld in artikel 3 van de richtlijn.


      [ref1]: https://wetten.overheid.nl/BWBR0037650#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0037650#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0037650#Artikel37
    url: https://wetten.overheid.nl/BWBR0037650/2016-06-23#Artikel38
    references:
      - id: ref1
