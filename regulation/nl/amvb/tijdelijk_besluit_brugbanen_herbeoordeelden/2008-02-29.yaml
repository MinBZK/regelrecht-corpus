articles:
  - number: '1'
    text: |-
      Voor de toepassing van dit besluit wordt verstaan onder:

        - UWV: het Uitvoeringsinstituut werknemersverzekeringen, genoemd in
      [hoofdstuk 5 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1];
        - WAO: [Wet op de arbeidsongeschiktheidsverzekering][ref2];
        - WAZ: [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref3];
        - WAJONG: [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref4];
        - Wfsv: [Wet financiering sociale verzekeringen][ref5];
        - WW: [Werkloosheidswet][ref6];
        - Wet SUWI: [Wet structuur uitvoeringsorganisatie werk en inkomen][ref7];
        - herbeoordeelde: 'de persoon: a. ten aanzien van wie, op grond van [artikel 34, vierde lid, van de WAO][ref8],'
      [artikel 35, vijfde lid, van de WAZ][ref9] of [artikel 28, vijfde lid, van de WAJONG][ref10],
      is bezien of er in verband met wijziging van de mate van arbeidsongeschiktheid gronden
      zijn voor herziening of intrekking van zijn arbeidsongeschiktheidsuitkering en die niet
      in de hoogste arbeidsongeschiktheidsklasse is ingedeeld, alsmede de persoon, bedoeld in
      [artikel 2, tweede lid, van het Besluit eenmalige herbeoordelingen arbeidsongeschiktheidswetten][ref11], die niet
      in de hoogste arbeidsongeschiktheidsklasse is ingedeeld; en b. die een uitkering ontvangt op grond van een wet
      waaraan uitvoering wordt gegeven door het UWV.


