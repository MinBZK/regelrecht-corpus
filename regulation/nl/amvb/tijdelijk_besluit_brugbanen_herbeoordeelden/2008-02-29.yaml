  - number: '4'
    text: |-
      1 Indien de herbeoordeelde, bedoeld in [artikel 2][ref1], ziekengeld ontvangt op grond van de [Ziektewet][ref2]
      wordt het, naar werkdagen herleide, aan de werkgever verstrekte subsidiebedrag, bedoeld in [artikel 2][ref3],
      verminderd met dit ziekengeld.

      2 In afwijking van het eerste lid wordt het subsidiebedrag, bedoeld in [artikel 2][ref4], niet verminderd met het
      ziekengeld dat wordt uitgekeerd op grond van [artikel 29, tweede lid, onderdeel d, van de Ziektewet][ref5].


