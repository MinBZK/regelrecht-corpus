  - number: '3'
    text: |-
      1 Met betrekking tot de toepassing van [artikel 115 van de Wfsv][ref1] worden de kosten van de subsidie, bedoeld
      in [artikel 2, eerste lid][ref2], voor zover die wordt verstrekt aan de werkgever van de persoon ten aanzien
      van wie, op grond van [artikel 34, vierde lid, van de WAO][ref3] of [artikel 35, vijfde lid, van de WAZ][ref4],
      is bezien of er in verband met wijziging van de mate van arbeidsongeschiktheid gronden zijn voor herziening of
      intrekking van zijn arbeidsongeschiktheidsuitkering, aangemerkt als kosten die verband houden met de uitvoering van
      [artikel 30, eerste lid, onderdeel b, van de Wet SUWI][ref5]. De eerste zin is van overeenkomstige toepassing op de
      subsidie, bedoeld in [artikel 2, eerste lid][ref6], voor zover die wordt verstrekt aan de werkgever van de persoon,
      bedoeld in [artikel 2, tweede lid, van het Besluit eenmalige herbeoordelingen arbeidsongeschiktheidswetten][ref7],
      ten aanzien van wie is bezien of er in verband met wijziging van de mate van arbeidsongeschiktheid gronden
      zijn voor herziening of intrekking van zijn arbeidsongeschiktheidsuitkering op grond van de [WAO][ref8] of de
      [WAZ][ref9].

      2 Met betrekking tot de toepassing van [artikel 65 van de WAJONG][ref10] worden de kosten van de
      subsidie, bedoeld in [artikel 2, eerste lid][ref11], voor zover die wordt verstrekt aan de werkgever
      van de persoon ten aanzien van wie, op grond van [artikel 28, vijfde lid, van de WAJONG][ref12]
      is bezien of er in verband met wijziging van de mate van arbeidsongeschiktheid gronden zijn voor
      herziening of intrekking van zijn arbeidsongeschiktheidsuitkering, aangemerkt als kosten verband
      houdende met de uitvoering van [artikel 30, eerste lid, onderdeel b, van de Wet SUWI][ref13]. De
      eerste zin is van overeenkomstige toepassing op de subsidie, bedoeld in [artikel 2, eerste lid][ref14],
      voor zover die wordt verstrekt aan de werkgever van de persoon, bedoeld in
      [artikel 2, tweede lid, van het Besluit eenmalige herbeoordelingen arbeidsongeschiktheidswetten][ref15], ten
      aanzien van wie is bezien of er in verband met wijziging van de mate van arbeidsongeschiktheid gronden zijn voor
      herziening of intrekking van zijn arbeidsongeschiktheidsuitkering, op grond van de [WAJONG][ref16].

      3 In afwijking van het eerste en tweede lid, worden met betrekking tot de toepassing van
      [artikel 100 van de Wfsv][ref17] de kosten van de subsidie, bedoeld in [artikel 2, eerste lid][ref18], voor zover
      die wordt verstrekt aan de werkgever van de herbeoordeelde die direct voorafgaand aan de dienstbetrekking recht
      had op een uitkering op grond van de [WW][ref19] en geen recht had op een arbeidsongeschiktheidsuitkering op
      grond van de [WAO][ref20], [WAZ][ref21] of [WAJONG][ref22], aangemerkt als kosten in verband met de uitvoering van
      [artikel 30, eerste lid, onderdeel b, van de Wet SUWI][ref23].

      4 In afwijking van het eerste, tweede en derde lid, worden met betrekking tot de toepassing van
      [artikel 108 van de Wfsv][ref24] de kosten van de subsidie, bedoeld in [artikel 2, eerste lid][ref25],
      voor zover die wordt verstrekt aan de werkgever van de herbeoordeelde die direct voorafgaand aan de
      dienstbetrekking recht had op een uitkering die ten laste kwam van het Uitvoeringsfonds voor de overheid
      en geen recht had op een arbeidsongeschiktheidsuitkering op grond van de [WAO][ref26], [WAZ][ref27]
      of [WAJONG][ref28], aangemerkt als kosten die rechtstreeks verband houden met de uitvoering van
      [artikel 30, eerste lid, onderdeel b, van de Wet SUWI][ref29].


