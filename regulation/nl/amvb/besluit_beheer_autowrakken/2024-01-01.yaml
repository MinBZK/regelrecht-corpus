preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 5 november 2001,
    nr. MJZ2001120 768, Centrale Directie Juridische Zaken, Afdeling Wetgeving;

    Gelet op richtlijn nr. 2000/53/EG van het Europees Parlement en de Raad van de Europese Unie van 18 september 2000
    betreffende autowrakken (PbEG L 269), de artikelen 1.1, derde lid, 8.2, tweede lid, 8.40, 8.44, eerste lid, 8.45,
    10.15 tot en met 10.17, 10.22, tweede lid, en 10.61 van de Wet milieubeheer en artikel 119a van het Wetboek van
    Strafvordering;

    De Raad van State gehoord (advies van 22 maart 2002, nr. W08.01.0588/V);

    Gezien het nader rapport van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 22 mei
    2002, nr. MJZ2002043263, Centrale Directie Juridische Zaken, Afdeling Wetgeving;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0013707/2024-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt, voor zover het betreft de onderdelen e en f in afwijking
      van [artikel 1.1, eerste lid, van de Wet milieubeheer][ref1], verstaan onder: a. voertuig: 1°. bedrijfsauto
      als bedoeld in de regeling op grond van [artikel 21, eerste lid, van de Wegenverkeerswet 1994][ref2],
      met een gewicht van niet meer dan 3.500 kg; 2°. personenauto als bedoeld in de regeling op grond
      van [artikel 21, eerste lid, van de Wegenverkeerswet 1994][ref3]; of 3°. bromfiets als bedoeld
      in de regeling op grond van [artikel 21, eerste lid, van de Wegenverkeerswet 1994][ref4], die een
      motorvoertuig op drie of vier wielen is; b. autowrak: 1°. bedrijfsauto als bedoeld in de regeling
      op grond van [artikel 21, eerste lid, van de Wegenverkeerswet 1994][ref5], met een gewicht van niet
      meer dan 3.500 kg, die een afvalstof is; 2°. personenauto als bedoeld in de regeling op grond van
      [artikel 21, eerste lid, van de Wegenverkeerswet 1994][ref6], die een afvalstof is; of 3°. bromfiets als bedoeld
      in de regeling op grond van [artikel 21, eerste lid, van de Wegenverkeerswet 1994][ref7], die een motorvoertuig
      op drie of vier wielen is, die een afvalstof is; c. de producent: degene onder wiens verantwoordelijkheid in de
      uitoefening van zijn beroep of bedrijf voertuigen worden vervaardigd en als eerste in Nederland aan een ander ter
      beschikking worden gesteld; d. de importeur: degene onder wiens verantwoordelijkheid in de uitoefening van zijn
      beroep of bedrijf voertuigen binnen Nederlands grondgebied worden gebracht en als eerste in Nederland aan een ander
      ter beschikking worden gesteld; e. preventie: 1°. vermindering van de hoeveelheid autowrakken en van de daarin
      aanwezige materialen en onderdelen, en 2°. vermindering van de schadelijkheid voor het milieu van autowrakken
      en van de daarin aanwezige materialen en onderdelen; f. verwerking: activiteiten na de afgifte van een autowrak
      die bestaan uit verwijdering van gevaarlijke afvalstoffen, demontage, versnijding, shredding, nuttige toepassing
      of voorbewerking voor de verwijdering van shredderafval, en elke andere handeling voor de nuttige toepassing of
      verwijdering van autowrakken en onderdelen daarvan; g. voorbereiden voor hergebruik: nuttige toepassing bestaande
      uit controleren, schoonmaken of repareren, waarbij producten of componenten van producten, die afvalstoffen zijn
      geworden, worden klaargemaakt zodat ze zullen worden hergebruikt zonder dat verdere voorbehandeling nodig is;
      h. terugwinning van energie: gebruik van brandbare afvalstoffen om energie op te wekken door directe verbranding
      met of zonder andere afvalstoffen, en met terugwinning van de als gevolg daarvan opgewekte warmte; i. recycling:
      nuttige toepassing waardoor afvalstoffen opnieuw worden bewerkt tot producten, materialen of stoffen, voor het
      oorspronkelijke doel of voor een ander doel, met inbegrip van het opnieuw bewerken van organische afvalstoffen,
      en met uitsluiting van energieterugwinning en het opnieuw bewerken tot materialen die bestemd zijn om te worden
      gebruikt als brandstof of als opvulmateriaal; j. gevaarlijke stof: stof waarvoor de criteria van een of meer
      van de volgende gevarenklassen of categorieën van bijlage I bij de EG-verordening indeling, etikettering en
      verpakking van stoffen en mengsels vervuld zijn: 1°. de gevarenklassen 2.1 tot en met 2.4, 2.6 en 2.7, 2.8 typen
      A en B, 2.9, 2.10, 2.12, 2.13 categorieën 1 en 2, 2.14 categorieën 1 en 2, en 2.15 typen A tot en met F, 2°.
      de gevarenklassen 3.1 tot en met 3.6, 3.7 schadelijke effecten op de seksuele functie en de vruchtbaarheid of
      de ontwikkeling, 3.8 andere effecten dan een narcotische werking, 3.9 en 3.10, 3°. de gevarenklasse 4.1, 4°.
      de gevarenklasse 5.1; k. shredderinstallatie: toestel dat voor het stuktrekken of versnijden van autowrakken
      wordt gebruikt; l. autowrakkenrichtlijn: [richtlijn nr. 2000/53/EG](32000L0053) van het Europees Parlement en
      de Raad van de Europese Unie van 18 september 2000 betreffende autowrakken (PbEG L 269); n. marktdeelnemer:
      marktdeelnemer als bedoeld in artikel 3, onderdeel 13, van de EU-verordening markttoezicht; o. aanbieder van
      diensten van de informatiemaatschappij: aanbieder van een dienst zoals gedefinieerd in artikel 1, eerste lid,
      onderdeel b, van Richtlijn (EU) 2015/1535 van het Europees Parlement en de Raad van 9 september 2015 betreffende
      een informatieprocedure op het gebied van technische voorschriften en regels betreffende de diensten van de
      informatiemaatschappij (PbEU 2015, L 241); p. op de markt aanbieden: op de markt aanbieden als bedoeld in artikel
      3, onderdeel 1, van de EU-verordening markttoezicht.


