  - number: '2.2'
    text: |-
      Dit besluit is niet van toepassing op producten voorzover daaromtrent regels zijn
      gesteld in de [Regeling afgedankte elektrische en elektronische apparatuur][ref1], het
      [Besluit beheer batterijen of accu’s 2008][ref2] of de [Regeling beheer batterijen en accu’s 2008][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0034782
      [ref2]: https://wetten.overheid.nl/BWBR0024491
      [ref3]: https://wetten.overheid.nl/BWBR0024492
    url: https://wetten.overheid.nl/BWBR0013707/2024-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0034782
      - id: ref2
        bwb_id: BWBR0024491
      - id: ref3
        bwb_id: BWBR0024492
  - number: '3'
    text: 'De producent neemt maatregelen ter bevordering van preventie die erop gericht zijn dat:'
    url: https://wetten.overheid.nl/BWBR0013707/2024-01-01#Artikel3
  - number: 3.a
    text: |-
      het gebruik van gevaarlijke stoffen in voertuigen beperkt wordt en voorzover mogelijk reeds in de ontwerpfase
      verminderd wordt, teneinde het vrijkomen ervan in het milieu te voorkomen, het voorbereiden voor hergebruik of
      recycling te vergemakkelijken en de verwijdering van gevaarlijke stoffen te vermijden;
    url: https://wetten.overheid.nl/BWBR0013707/2024-01-01#Artikel3
  - number: 3.b
    text: |-
      een nieuw voertuigtype zodanig wordt ontworpen en vervaardigd dat demontage en nuttige toepassing van autowrakken
      en van de daarin aanwezige materialen en onderdelen worden vergemakkelijkt;
    url: https://wetten.overheid.nl/BWBR0013707/2024-01-01#Artikel3
  - number: 3.c
    text: |-
      steeds meer materiaal afkomstig van het voorbereiden voor hergebruik of recycling in voertuigen en in andere
      producten wordt toegepast.
    url: https://wetten.overheid.nl/BWBR0013707/2024-01-01#Artikel3
  - number: '4.1'
    text: |-
      Het is verboden materialen en onderdelen van voertuigen, die lood, kwik, cadmium of zeswaardig chroom bevatten, na
      1 juli 2003 in Nederland voor het eerst aan een ander ter beschikking te stellen.
    url: https://wetten.overheid.nl/BWBR0013707/2024-01-01#Artikel4
  - number: '4.2'
    text: |-
      Het verbod, bedoeld in het eerste lid, geldt niet voor materialen en onderdelen als bedoeld in bijlage II bij de
      autowrakkenrichtlijn indien aan de in die bijlage gestelde voorwaarden is voldaan.
    url: https://wetten.overheid.nl/BWBR0013707/2024-01-01#Artikel4
  - number: '6'
    text: |-
      Bij de afvalstoffenverordening, bedoeld in [artikel 10.23, eerste lid, van de Wet milieubeheer][ref1], of bij
      omgevingsplan wordt bepaald dat een autowrak, zijnde een huishoudelijke afvalstof, slechts mag worden afgegeven
      aan:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0013707/2024-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
  - number: 6.a
    text: |-
      degene die een milieubelastende activiteit als bedoeld in
      [artikel 3.152 van het Besluit activiteiten leefomgeving][ref1] verricht;


      [ref1]: https://wetten.overheid.nl/BWBR0041330#Artikel3
    url: https://wetten.overheid.nl/BWBR0013707/2024-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0041330
        artikel: '3'
  - number: 6.b
    text: |-
      degene die een milieubelastende activiteit als bedoeld in
      [artikel 3.276 van het Besluit activiteiten leefomgeving][ref1] verricht, waar motorvoertuigen worden onderhouden
      anders dan alleen wassen, of


      [ref1]: https://wetten.overheid.nl/BWBR0041330#Artikel3
    url: https://wetten.overheid.nl/BWBR0013707/2024-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0041330
        artikel: '3'
  - number: 6.c
    text: |-
      degene die in een ander land dan Nederland is gevestigd en die overeenkomstig de EG-verordening overbrenging van
      afvalstoffen en [titel 10.7 van de Wet milieubeheer][ref1] het autowrak naar dat land brengt.


      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0013707/2024-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0003245
  - number: '7'
    text: |-
      [Artikel 10.22, eerste lid, van de Wet milieubeheer][ref1] blijft buiten toepassing met betrekking tot autowrakken.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0013707/2024-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
  - number: '8'
    text: |-
      De producent of importeur draagt er zorg voor dat een verwerkingssysteem wordt opgezet voor autowrakken, voor zover
      het voertuigen betreft die onder zijn verantwoordelijkheid in Nederland aan een ander ter beschikking zijn gesteld.
    url: https://wetten.overheid.nl/BWBR0013707/2024-01-01#Artikel8
  - number: 8a
    text: Onze Minister bevordert dat degene die een verwerking verricht, een gecertificeerd milieubeheerssysteem invoert.
    url: https://wetten.overheid.nl/BWBR0013707/2024-01-01#Artikel8a
  - number: '9.1'
    text: |-
      De producent of importeur draagt er zorg voor dat in de periode van 1 januari 2003 tot en met 31 december 2014,
      gedurende een kalenderjaar, van autowrakken, voorzover het voertuigen betreft die onder zijn verantwoordelijkheid
      in Nederland aan een ander ter beschikking zijn gesteld:
    url: https://wetten.overheid.nl/BWBR0013707/2024-01-01#Artikel9
  - number: 9.1.a
    text: ten minste 85 gewichtsprocent voorbereid wordt voor hergebruik of nuttig wordt toegepast, en
    url: https://wetten.overheid.nl/BWBR0013707/2024-01-01#Artikel9
  - number: 9.1.b
    text: ten minste 80 gewichtsprocent voorbereid wordt voor hergebruik of wordt gerecycled.
    url: https://wetten.overheid.nl/BWBR0013707/2024-01-01#Artikel9
  - number: '9.2'
    text: |-
      De producent of importeur draagt er zorg voor dat vanaf 1 januari 2015, gedurende een kalenderjaar, van
      autowrakken, voorzover het voertuigen betreft die onder zijn verantwoordelijkheid in Nederland aan een ander ter
      beschikking zijn gesteld:
    url: https://wetten.overheid.nl/BWBR0013707/2024-01-01#Artikel9
  - number: 9.2.a
    text: ten minste 95 gewichtsprocent voorbereid wordt voor hergebruik of nuttig wordt toegepast, en
    url: https://wetten.overheid.nl/BWBR0013707/2024-01-01#Artikel9
  - number: 9.2.b
    text: ten minste 85 gewichtsprocent voorbereid wordt voor hergebruik of wordt gerecycled.
    url: https://wetten.overheid.nl/BWBR0013707/2024-01-01#Artikel9
  - number: '9.3'
    text: |-
      Het eerste en tweede lid zijn niet van toepassing op voertuigen als bedoeld in artikel 9, eerste lid, onder b,
      van richtlijn 2007/46/EG van het Europees Parlement en de Raad van de Europese Unie van 5 september 2007 tot
      vaststelling van een kader voor de goedkeuring van motorvoertuigen en aanhangwagens daarvan en van systemen,
      onderdelen en technische eenheden die voor dergelijke voertuigen zijn bestemd (Kaderrichtlijn) (Pb EU L 263).
    url: https://wetten.overheid.nl/BWBR0013707/2024-01-01#Artikel9
  - number: '10.1'
    text: |-
      De producent of importeur draagt er zorg voor dat van de voertuigen die onder zijn verantwoordelijkheid in
      Nederland aan een ander ter beschikking worden gesteld, de materialen of onderdelen worden voorzien van een
      aanduiding die in overeenstemming is met de onderdeel- en materiaalcoderingsnormen die door de Commissie van de
      Europese Gemeenschappen overeenkomstig [artikel 8][ref1] van de autowrakkenrichtlijn zijn vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0013707#Artikel8
    url: https://wetten.overheid.nl/BWBR0013707/2024-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0013707
        artikel: '8'
        paragraaf: '3'
  - number: '10.2'
    text: |-
      De bij de beschikking, bedoeld in het eerste lid, vastgestelde normering gaat voor de toepassing van dit besluit
      gelden met ingang van het tijdstip dat door Onze Minister in de Staatscourant wordt bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0013707/2024-01-01#Artikel10
  - number: '11.1'
    text: |-
      De producent of importeur draagt er zorg voor dat binnen zes maanden nadat voertuigen van een nieuw type onder
      zijn verantwoordelijkheid in Nederland voor het eerst aan een ander ter beschikking zijn gesteld, aan een ieder
      die een verwerking met een autowrak van een derde verricht, informatie wordt verstrekt omtrent demontage van die
      voertuigen, voorzover die informatie nodig is om de doelstellingen, bedoeld in [artikel 9,][ref1] te realiseren.


      [ref1]: https://wetten.overheid.nl/BWBR0013707#Artikel9
    url: https://wetten.overheid.nl/BWBR0013707/2024-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0013707
        artikel: '9'
        paragraaf: '4'
  - number: '11.2'
    text: |-
      De informatie, bedoeld in het eerste lid, omvat gegevens met betrekking tot de verschillende materialen en
      onderdelen van het voertuigtype en de plaats van de daarin aanwezige gevaarlijke stoffen.
    url: https://wetten.overheid.nl/BWBR0013707/2024-01-01#Artikel11
  - number: '11.3'
    text: |-
      De leverancier van onderdelen die aan de producent of importeur ter beschikking zijn gesteld, draagt er zorg
      voor dat desgevraagd aan een persoon die een verwerking met een autowrak van een derde verricht, informatie
      wordt verstrekt omtrent demontage, opslag of het testen van die onderdelen met het oog op het voorbereiden voor
      hergebruik, uitgezonderd informatie waarvan de geheimhouding met het oog op de bescherming van bedrijfsgeheimen
      gerechtvaardigd is.
    url: https://wetten.overheid.nl/BWBR0013707/2024-01-01#Artikel11
  - number: '11.4'
    text: |-
      Informatie als bedoeld in het eerste tot en met derde lid wordt verstrekt in de vorm van handboeken of in
      elektronische vorm.
    url: https://wetten.overheid.nl/BWBR0013707/2024-01-01#Artikel11
  - number: '12.1'
    text: |-
      Tegelijkertijd met de melding, bedoeld in
      [artikel 4 van het Besluit regeling voor uitgebreide producentenverantwoordelijkheid][ref1], doet de producent
      mededeling aan Onze Minister over de wijze waarop uitvoering zal worden gegeven aan de verplichting, bedoeld in
      [artikel 3][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0044197#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0013707#Artikel3
    url: https://wetten.overheid.nl/BWBR0013707/2024-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0044197
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0013707
        artikel: '3'
        paragraaf: '2'
  - number: '12.2'
    text: |-
      De mededeling bevat een overzicht van de te nemen maatregelen ter bevordering van preventie alsmede een schatting
      van de daarmee te bereiken resultaten.
    url: https://wetten.overheid.nl/BWBR0013707/2024-01-01#Artikel12
  - number: '13.1'
    text: |-
      De mededeling, bedoeld in [artikel 12, eerste lid][ref1], behoeft de instemming van Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0013707#Artikel12
    url: https://wetten.overheid.nl/BWBR0013707/2024-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0013707
        artikel: '12'
        paragraaf: '6'
  - number: '13.2'
    text: |-
      [Paragraaf 4.1.3.3 van de Algemene wet bestuursrecht][ref1] is van toepassing op het verzoek tot instemming.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0013707/2024-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: '13.3'
    text: Onze Minister kan voorschriften of beperkingen verbinden aan de instemming met de mededeling.
    url: https://wetten.overheid.nl/BWBR0013707/2024-01-01#Artikel13
  - number: '13.4'
    text: |-
      Onze Minister kan de voorschriften of beperkingen, bedoeld in het tweede lid, ambtshalve of op een daartoe
      strekkend verzoek wijzigen of intrekken.
    url: https://wetten.overheid.nl/BWBR0013707/2024-01-01#Artikel13
  - number: '14'
    text: |-
      De producent voert de verplichting, bedoeld in [artikel 3][ref1], uit overeenkomstig de mededeling, zoals Onze
      Minister daarmee heeft ingestemd.


      [ref1]: https://wetten.overheid.nl/BWBR0013707#Artikel3
    url: https://wetten.overheid.nl/BWBR0013707/2024-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0013707
        artikel: '3'
        paragraaf: '2'
  - number: '15.1'
    text: |-
      De producent zendt elk jaar voor 1 augustus aan Onze Minister een verslag over de uitvoering van de verplichting,
      bedoeld in [artikel 3][ref1], in het voorafgaande kalenderjaar, voor zover hij in dat jaar als producent werkzaam
      was.


      [ref1]: https://wetten.overheid.nl/BWBR0013707#Artikel3
    url: https://wetten.overheid.nl/BWBR0013707/2024-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0013707
        artikel: '3'
        paragraaf: '2'
  - number: '15.2'
    text: |-
      Het verslag bevat in ieder geval gegevens omtrent de wijze waarop bij het ontwerp van een nieuw voertuigtype het
      ontstaan van afvalstoffen wordt voorkomen en naar de mogelijkheid van hergebruik als product of materiaal en van
      nuttige toepassing van dat type voertuig wordt gestreefd.
    url: https://wetten.overheid.nl/BWBR0013707/2024-01-01#Artikel15
  - number: '15.3'
    text: |-
      Het verslag, bedoeld in [artikel 5 van het Besluit regeling voor uitgebreide producentenverantwoordelijkheid][ref1],
      wordt jaarlijks voor 1 augustus over het voorafgaande kalenderjaar uitgebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0044197#Artikel5
    url: https://wetten.overheid.nl/BWBR0013707/2024-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0044197
        artikel: '5'
  - number: '16'
    text: |-
      De producenten kunnen gezamenlijk een mededeling als bedoeld in [artikel 12, eerste lid][ref1], doen of een verslag
      als bedoeld in [artikel 15, eerste lid][ref2], toezenden.


      [ref1]: https://wetten.overheid.nl/BWBR0013707#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0013707#Artikel15
    url: https://wetten.overheid.nl/BWBR0013707/2024-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0013707
        artikel: '12'
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0013707
        artikel: '15'
        paragraaf: '6'
  - number: 16a.1
    text: |-
      Het is marktdeelnemers die betrokken zijn of zijn geweest bij het op de markt aanbieden van voertuigen, verboden te
      handelen in strijd met artikel 7, eerste lid, van de EU-verordening markttoezicht.
    url: https://wetten.overheid.nl/BWBR0013707/2024-01-01#Artikel16a
  - number: 16a.2
    text: |-
      Het is een aanbieder van diensten van de informatiemaatschappij die betrokken is of is geweest bij het online te
      koop aanbieden van voertuigen, verboden te handelen in strijd met artikel 7, tweede lid, van de EU-verordening
      markttoezicht.
    url: https://wetten.overheid.nl/BWBR0013707/2024-01-01#Artikel16a
  - number: '17.1'
    text: |-
      Een wijziging van de autowrakkenrichtlijn gaat voor de toepassing van dit besluit gelden met ingang van de
      dag waarop aan de betrokken wijziging uitvoering moet zijn gegeven, tenzij bij ministerieel besluit, dat in de
      Staatscourant wordt bekendgemaakt, een ander tijdstip wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0013707/2024-01-01#Artikel17
  - number: '17.2'
    text: |-
      Een wijziging van de richtlijn, genoemd in [artikel 1, onder j][ref1], gaat voor de toepassing van dit besluit
      gelden met ingang van de dag waarop aan de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0013707#Artikel1
    url: https://wetten.overheid.nl/BWBR0013707/2024-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0013707
        artikel: '1'
        paragraaf: '1'
  - number: '17.3'
    text: |-
      Een wijziging van de richtlijn, genoemd in [artikel 9, derde lid][ref1], gaat voor de toepassing van dit besluit
      gelden met ingang van de dag waarop aan de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0013707#Artikel9
    url: https://wetten.overheid.nl/BWBR0013707/2024-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0013707
        artikel: '9'
        paragraaf: '4'
  - number: '23'
    text: |-
      In afwijking van [artikel 15, eerste lid][ref1], heeft een verslag over de uitvoering van de verplichtingen,
      bedoeld in de [artikelen 3][ref2], [8 tot en met 11][ref3] en [15, vierde lid][ref4], geen betrekking op het
      tijdvak vanaf 1 januari 2002 tot het tijdstip van inwerkingtreding van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0013707#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0013707#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0013707#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0013707#Artikel15
    url: https://wetten.overheid.nl/BWBR0013707/2024-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0013707
        artikel: '15'
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0013707
        artikel: '3'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0013707
        artikel: '8'
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0013707
        artikel: '15'
        paragraaf: '6'
  - number: '24'
    text: |-
      Dit besluit treedt in werking met ingang van 1 juli 2002. Indien het Staatsblad waarin dit besluit wordt geplaatst,
      wordt uitgegeven na 30 mei 2002, treedt het in werking met ingang van de dag waarop vier weken zijn verstreken
      sedert de dag van uitgifte van het Staatsblad waarin het wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0013707/2024-01-01#Artikel24
  - number: '25'
    text: 'Dit besluit wordt aangehaald als: Besluit beheer autowrakken.'
    url: https://wetten.overheid.nl/BWBR0013707/2024-01-01#Artikel25
