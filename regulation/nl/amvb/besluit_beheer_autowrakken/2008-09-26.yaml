articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. voertuig: voertuig als bedoeld in:

      1°. [artikel 1.1, onder h, onderdeel 2, van het Voertuigreglement][ref1] met een maximum gewicht van ten hoogste
      3500 kilogram;

      2°. [artikel 1.1, onder m, van het Voertuigreglement][ref2], niet zijnde een voertuig op twee wielen, of

      3°. [artikel 1.1, onder at, van het Voertuigreglement][ref3];

      b. autowrak: voertuig dat een afvalstof is in de zin van [artikel 1.1, eerste lid, van de Wet milieubeheer][ref4];

      c. de producent: degene onder wiens verantwoordelijkheid in de uitoefening van zijn beroep of bedrijf voertuigen
      worden vervaardigd en als eerste in Nederland aan een ander ter beschikking worden gesteld;

      d. de importeur: degene onder wiens verantwoordelijkheid in de uitoefening van zijn beroep of bedrijf voertuigen
      binnen Nederlands grondgebied worden gebracht en als eerste in Nederland aan een ander ter beschikking worden
      gesteld;

      e. preventie:

      1°. vermindering van de hoeveelheid autowrakken en van de daarin aanwezige materialen en onderdelen, en

      2°. vermindering van de schadelijkheid voor het milieu van autowrakken en van de daarin aanwezige materialen en
      onderdelen;

      f. verwerking: activiteiten na de afgifte van een autowrak aan een inrichting voor de verwijdering van gevaarlijke
      afvalstoffen, demontage, versnijding, shredding, nuttige toepassing of voorbewerking voor de verwijdering van
      shredderafval, en elke andere handeling voor de nuttige toepassing of verwijdering van autowrakken en onderdelen
      daarvan;

      g. hergebruiken als product: opnieuw gebruiken van onderdelen van autowrakken voor hetzelfde doel als waarvoor ze
      zijn ontworpen;

      h. terugwinning van energie: gebruik van brandbare afvalstoffen om energie op te wekken door directe verbranding
      met of zonder andere afvalstoffen, en met terugwinning van de als gevolg daarvan opgewekte warmte;

      i. hergebruiken als materiaal: na een be- of verwerking opnieuw gebruiken van materialen van autowrakken voor
      hetzelfde doel als waarvoor ze zijn ontworpen of voor andere doeleinden, daaronder niet begrepen terugwinning van
      energie;

      j. gevaarlijke stof: stof die overeenkomstig bijlage 1 bij [richtlijn nr. 67/548/EEG](31967L0548) van de Raad van
      de Europese Gemeenschappen van 27 juni 1967 betreffende de aanpassing van de wettelijke en bestuursrechtelijke
      bepalingen inzake de indeling, de verpakking en het kenmerken van gevaarlijke stoffen (PbEG L 196) als een
      gevaarlijke stof is aangemerkt;

      k. vergunning: vergunning als bedoeld in [artikel 8.1 van de Wet milieubeheer][ref5];

      l. shredderinstallatie: toestel dat voor het stuktrekken of versnijden van autowrakken wordt gebruikt;

      m. autowrakkenrichtlijn: [richtlijn nr. 2000/53/EG](32000L0053) van het Europees Parlement en de Raad van de
      Europese Unie van 18 september 2000 betreffende autowrakken (PbEG L 269).


