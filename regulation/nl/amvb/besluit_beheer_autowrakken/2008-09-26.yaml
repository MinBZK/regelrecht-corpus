  - number: '7'
    text: |-
      [Artikel 10.22, eerste lid, van de Wet milieubeheer][ref1] blijft buiten toepassing met betrekking tot autowrakken.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10.22
    url: https://wetten.overheid.nl/BWBR0013707/2008-09-26#Artikel7
