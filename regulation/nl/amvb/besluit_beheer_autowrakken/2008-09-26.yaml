  - number: '12'
    text: |-
      1 De producent of importeur doet binnen dertien weken nadat dit besluit op hem van toepassing is geworden, aan
      Onze Minister mededeling over de wijze waarop uitvoering zal worden geven aan de verplichtingen, bedoeld in de
      [artikelen 3][ref1], [8 tot en met 11][ref2] en [15, eerste en vierde lid][ref3], voorzover die artikelen op hem
      van toepassing zijn.

      2 De mededeling bevat in ieder geval:

      a. een overzicht van de te nemen maatregelen ter bevordering van preventie, alsmede een schatting van de daarmee te
      bereiken resultaten;

      b. gegevens omtrent de wijze waarop de inname van autowrakken zal plaatsvinden;

      c. gegevens omtrent het gewichtspercentage van de onder zijn verantwoordelijkheid in Nederland aan een ander ter
      beschikking gestelde voertuigen dat:

      1°. als product zal worden hergebruikt;

      2°. als materiaal zal worden hergebruikt;

      3°. nuttig zal worden toegepast, en

      4°. zal worden verwijderd;

      d. gegevens omtrent de wijze van financiering van het inname- en verwerkingssysteem;

      e. gegevens omtrent de maatregelen die zullen worden getroffen om de inname en verwerking voort te zetten, ingeval
      voertuigen niet langer onder de verantwoordelijkheid van de producent of importeur in Nederland aan een ander ter
      beschikking worden gesteld;

      f. gegevens omtrent de wijze waarop hetgeen in de mededeling staat vermeld ten aanzien van de onderdelen a tot en
      met e zal worden geregistreerd.


      [ref1]: https://wetten.overheid.nl/BWBR0013707#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0013707#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0013707#Artikel15
