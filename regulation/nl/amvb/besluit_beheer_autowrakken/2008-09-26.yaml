    text: |-
      1 Een wijziging van de autowrakkenrichtlijn gaat voor de toepassing van dit besluit gelden met ingang van de
      dag waarop aan de betrokken wijziging uitvoering moet zijn gegeven, tenzij bij ministerieel besluit, dat in de
      Staatscourant wordt bekendgemaakt, een ander tijdstip wordt vastgesteld.

      2 Een wijziging van de richtlijn, genoemd in [artikel 1, onder j][ref1], gaat voor de toepassing van dit besluit
      gelden met ingang van de dag waarop aan de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven.

      3 Een wijziging van de richtlijn, genoemd in [artikel 9, derde lid][ref2], gaat voor de toepassing van dit besluit
      gelden met ingang van de dag waarop aan de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven.


