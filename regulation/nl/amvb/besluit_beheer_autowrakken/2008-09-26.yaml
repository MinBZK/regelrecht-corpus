  - number: '16'
    text: |-
      De producenten of importeurs kunnen gezamenlijk een mededeling als bedoeld in [artikel 12, eerste lid][ref1], doen
      of een verslag als bedoeld in [artikel 15, eerste lid][ref2], toezenden.


