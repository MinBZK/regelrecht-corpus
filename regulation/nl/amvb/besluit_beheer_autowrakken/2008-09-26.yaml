  - number: '15'
    text: |-
      1 De producent of importeur zendt voor 1 augustus 2003 en vervolgens elk jaar voor 1 augustus aan Onze Minister
      een verslag over de uitvoering van de verplichtingen, bedoeld in het vierde lid en de [artikelen 3][ref1],
      [8 tot en met 11][ref2], in het voorafgaande kalenderjaar, voorzover hij in dat jaar als producent of importeur
      werkzaam was.

      2 Het verslag bevat in ieder geval gegevens omtrent:

      a. de wijze waarop bij het ontwerp van een nieuw voertuigtype het ontstaan van afvalstoffen wordt voorkomen en
      naar de mogelijkheid van hergebruik als product of materiaal en van nuttige toepassing van dat type voertuig wordt
      gestreefd;

      b. de wijze waarop autowrakken worden verwerkt;

      c. de ontwikkeling en verbetering van methoden voor hergebruik als product of materiaal en voor nuttige toepassing
      van autowrakken;

      d. het gewichtspercentage van de door de producent of importeur aan een ander ter beschikking gestelde voertuigen
      dat als product of materiaal wordt hergebruikt of nuttig wordt toegepast.

      3 Onze Minister kan regels stellen over de wijze waarop de in het tweede lid bedoelde gegevens in het verslag
      worden opgenomen.

      4 De producent of importeur draagt er zorg voor dat de gegevens, bedoeld in het tweede lid, worden opgenomen in
      reclamemateriaal ten behoeve van de verkoop van nieuwe voertuigen.


      [ref1]: https://wetten.overheid.nl/BWBR0013707#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0013707#Artikel8
