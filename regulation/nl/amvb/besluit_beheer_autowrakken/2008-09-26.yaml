preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 5 november 2001,
    nr. MJZ2001120 768, Centrale Directie Juridische Zaken, Afdeling Wetgeving;

    Gelet op richtlijn nr. 2000/53/EG van het Europees Parlement en de Raad van de Europese Unie van 18 september 2000
    betreffende autowrakken (PbEG L 269), de artikelen 1.1, derde lid, 8.2, tweede lid, 8.40, 8.44, eerste lid, 8.45,
    10.15 tot en met 10.17, 10.22, tweede lid, en 10.61 van de Wet milieubeheer en artikel 119a van het Wetboek van
    Strafvordering;

    De Raad van State gehoord (advies van 22 maart 2002, nr. W08.01.0588/V);

    Gezien het nader rapport van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 22 mei
    2002, nr. MJZ2002043263, Centrale Directie Juridische Zaken, Afdeling Wetgeving;

    Hebben goedgevonden en verstaan:
