    text: |-
      Dit besluit treedt in werking met ingang van 1 juli 2002. Indien het Staatsblad waarin dit besluit wordt geplaatst,
      wordt uitgegeven na 30 mei 2002, treedt het in werking met ingang van de dag waarop vier weken zijn verstreken
      sedert de dag van uitgifte van het Staatsblad waarin het wordt geplaatst.
