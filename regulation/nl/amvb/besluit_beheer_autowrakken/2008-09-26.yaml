  - number: '11'
    text: |-
      1 De producent of importeur draagt er zorg voor dat binnen zes maanden nadat voertuigen van een nieuw type onder
      zijn verantwoordelijkheid in Nederland voor het eerst aan een ander ter beschikking zijn gesteld, aan een ieder die
      een inrichting drijft als bedoeld in [artikel 5, eerste lid][ref1], informatie wordt verstrekt omtrent demontage
      van die voertuigen, voorzover die informatie nodig is om de doelstellingen, bedoeld in [artikel 9,][ref2] te
      realiseren.

      2 De informatie, bedoeld in het eerste lid, omvat gegevens met betrekking tot de verschillende materialen en
      onderdelen van het voertuigtype en de plaats van de daarin aanwezige gevaarlijke stoffen.

      3 De leverancier van onderdelen die aan de producent of importeur ter beschikking zijn gesteld, draagt er zorg voor
      dat desgevraagd aan een persoon die een inrichting drijft als bedoeld in [artikel 5, eerste lid][ref3], informatie
      wordt verstrekt omtrent demontage, opslag of het testen van die onderdelen met het oog op hergebruik als product,
      uitgezonderd informatie waarvan de geheimhouding met het oog op de bescherming van bedrijfsgeheimen gerechtvaardigd
      is.

      4 Informatie als bedoeld in het eerste tot en met derde lid wordt verstrekt in de vorm van handboeken of in
      elektronische vorm.


      [ref1]: https://wetten.overheid.nl/BWBR0013707#Artikel5
