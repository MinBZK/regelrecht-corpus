  - number: '23'
    text: |-
      In afwijking van [artikel 15, eerste lid][ref1], heeft een verslag over de uitvoering van de verplichtingen,
      bedoeld in de [artikelen 3][ref2], [8 tot en met 11][ref3] en [15, vierde lid][ref4], geen betrekking op het
      tijdvak vanaf 1 januari 2002 tot het tijdstip van inwerkingtreding van dit besluit.


