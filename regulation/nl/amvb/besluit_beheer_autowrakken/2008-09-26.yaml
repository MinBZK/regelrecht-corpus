        artikel: '10.22'
  - number: '8'
    text: |-
      De producent of importeur draagt er zorg voor dat:

      a. een landelijk dekkend innamesysteem wordt opgezet voor autowrakken, voorzover het voertuigen betreft die onder
      zijn verantwoordelijkheid in Nederland aan een ander ter beschikking zijn gesteld;

      b. autowrakken, voorzover het voertuigen betreft die onder zijn verantwoordelijkheid in Nederland aan een ander ter
      beschikking zijn gesteld, ten minste om niet kunnen worden afgegeven;

      c. een verwerkingssysteem wordt opgezet voor autowrakken, voorzover het voertuigen betreft die onder zijn
      verantwoordelijkheid in Nederland aan een ander ter beschikking zijn gesteld.
    url: https://wetten.overheid.nl/BWBR0013707/2008-09-26#Artikel8
  - number: 8a
    text: |-
      Onze Minister bevordert dat degenen die een inrichting drijven waar verwerkingshandelingen worden verricht, een
      gecertificeerd milieubeheerssysteem invoeren.
    url: https://wetten.overheid.nl/BWBR0013707/2008-09-26#Artikel8a
  - number: '9'
    text: |-
      1 De producent of importeur draagt er zorg voor dat in de periode van 1 januari 2003 tot en met 31 december 2014,
      gedurende een kalenderjaar, van autowrakken, voorzover het voertuigen betreft die onder zijn verantwoordelijkheid
      in Nederland aan een ander ter beschikking zijn gesteld:

      a. ten minste 85 gewichtsprocent als product wordt hergebruikt of nuttig wordt toegepast, en

      b. ten minste 80 gewichtsprocent als product of materiaal wordt hergebruikt.

      2 De producent of importeur draagt er zorg voor dat vanaf 1 januari 2015, gedurende een kalenderjaar, van
      autowrakken, voorzover het voertuigen betreft die onder zijn verantwoordelijkheid in Nederland aan een ander ter
      beschikking zijn gesteld:

      a. ten minste 95 gewichtsprocent als product wordt hergebruikt of nuttig wordt toegepast, en

      b. ten minste 85 gewichtsprocent als product of materiaal wordt hergebruikt.

      3 Het eerste en tweede lid zijn niet van toepassing op voertuigen als bedoeld in artikel 4, eerste lid, onder
      a, tweede streepje, van [richtlijn nr. 70/156/EEG](31970L0156) van de Raad van de Europese Gemeenschappen van 6
      februari 1970 inzake de onderlinge aanpassing van de wetgevingen van de Lid-Staten betreffende de goedkeuring van
      motorvoertuigen en aanhangers daarvan (PbEG L 42).
    url: https://wetten.overheid.nl/BWBR0013707/2008-09-26#Artikel9
  - number: '10'
    text: |-
      1 De producent of importeur draagt er zorg voor dat van de voertuigen die onder zijn verantwoordelijkheid in
      Nederland aan een ander ter beschikking worden gesteld, de materialen of onderdelen worden voorzien van een
      aanduiding die in overeenstemming is met de onderdeel- en materiaalcoderingsnormen die door de Commissie van de
      Europese Gemeenschappen overeenkomstig [artikel 8][ref1] van de autowrakkenrichtlijn zijn vastgesteld.

      2 De bij de beschikking, bedoeld in het eerste lid, vastgestelde normering gaat voor de toepassing van dit besluit
      gelden met ingang van het tijdstip dat door Onze Minister in de Staatscourant wordt bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0013707#Artikel8
    url: https://wetten.overheid.nl/BWBR0013707/2008-09-26#Artikel10
