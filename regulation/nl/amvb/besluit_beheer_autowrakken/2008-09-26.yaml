  - number: '3'
    text: |-
      De producent neemt maatregelen ter bevordering van preventie die erop gericht zijn dat:

      a. het gebruik van gevaarlijke stoffen in voertuigen beperkt wordt en voorzover mogelijk reeds in de ontwerpfase
      verminderd wordt, teneinde het vrijkomen ervan in het milieu te voorkomen, hergebruik als product of materiaal te
      vergemakkelijken en de verwijdering van gevaarlijke stoffen te vermijden;

      b. een nieuw voertuigtype zodanig wordt ontworpen en vervaardigd dat demontage en nuttige toepassing van
      autowrakken en van de daarin aanwezige materialen en onderdelen worden vergemakkelijkt;

      c. steeds meer hergebruikt materiaal in voertuigen en in andere producten wordt toegepast.
    url: https://wetten.overheid.nl/BWBR0013707/2008-09-26#Artikel3
  - number: '4'
    text: |-
      1 Het is verboden materialen en onderdelen van voertuigen, die lood, kwik, cadmium of zeswaardig chroom bevatten,
      na 1 juli 2003 in Nederland voor het eerst aan een ander ter beschikking te stellen.

      2 Het verbod, bedoeld in het eerste lid, geldt niet voor materialen en onderdelen als bedoeld in bijlage II bij de
      autowrakkenrichtlijn indien aan de in die bijlage gestelde voorwaarden is voldaan.
    url: https://wetten.overheid.nl/BWBR0013707/2008-09-26#Artikel4
  - number: '5'
    text: |-
      1 Het bevoegd gezag verbindt de in de bijlage bij dit besluit gestelde voorschriften aan een vergunning voor
      een inrichting voor het opslaan van vijf of meer autowrakken en aan een vergunning voor een inrichting voor het
      bewerken, verwerken, vernietigen of overslaan van autowrakken.

      2 Het bevoegd gezag kan nadere eisen stellen ten aanzien van:

      a. het aantal banden dat binnen de inrichting mag worden opgeslagen, bedoeld in voorschrift 2, tweede volzin, van
      onderdeel D van de bijlage bij dit besluit;

      b. de wijze van opslag van afgetapte vloeistoffen of vloeistof bevattende gedemonteerde onderdelen, bedoeld in
      de voorschriften 3 en 4 van onderdeel A van de bijlage bij dit besluit en van afgetapte of gedemonteerde stoffen,
      preparaten of andere producten, bedoeld in de voorschriften 1, 2 en 3 van onderdeel D van de bijlage bij dit
      besluit;

      c. de stapelhoogte voor autowrakken, bedoeld in voorschrift 1 van onderdeel E van de bijlage bij dit besluit;

      d. het ter beschikking stellen van autowrakken aan een instelling voor oefen- en opleidingsdoeleinden, bedoeld in
      voorschrift 3 van onderdeel E van de bijlage bij dit besluit.

      3 Het bevoegd gezag kan nadere eisen als bedoeld in het tweede lid wijzigen in het belang van de bescherming
      van het milieu, of wijzigen of intrekken indien het belang van de bescherming van het milieu zich daartegen niet
      verzet.

      4 Het bevoegd gezag draagt er zorg voor dat aan alle vergunningen die vóór de inwerkingtreding van dit besluit aan
      inrichtingen als bedoeld in het eerste lid zijn verleend, de in de bijlage bij dit besluit gestelde voorschriften
      worden verbonden.
    url: https://wetten.overheid.nl/BWBR0013707/2008-09-26#Artikel5
  - number: '6'
    text: |-
      Bij de afvalstoffenverordening, bedoeld in [artikel 10.23, eerste lid, van de Wet milieubeheer][ref1], wordt
      bepaald dat een autowrak, zijnde een huishoudelijke afvalstof, slechts mag worden afgegeven aan:

      a. degene die een inrichting drijft als bedoeld in [artikel 5, eerste lid][ref2], niet zijnde een inrichting die
      uitsluitend vanwege de aanwezigheid van een shredderinstallatie als een zodanige inrichting is aan te merken;

      b. degene die een inrichting drijft waar onderhoud en reparatie van motorvoertuigen plaatsvindt als bedoeld in
      [categorie II van bijlage 1 bij het Besluit algemene regels voor inrichtingen milieubeheer][ref3], of

      c. degene die in een ander land dan Nederland is gevestigd en die overeenkomstig de EG-verordening overbrenging van
      afvalstoffen en [titel 10.7 van de Wet milieubeheer][ref4] het autowrak naar dat land brengt.


