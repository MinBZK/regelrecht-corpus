  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 26 april 2010,
    nr. BJZ2010011756, Directie Bestuurlijke en Juridische Zaken;

    Gelet op de artikelen 5.1, eerste lid, 5.2, eerste lid, 5.3, eerste en tweede lid, en 9.2.2.1 van de Wet
    milieubeheer en de artikelen 3.37 en 4.3, eerste en tweede lid, van de Wet ruimtelijke ordening;

    De Raad van State gehoord (advies van 17 juni 2010, nr. W08.10.0163/IV);

    Gezien het nader rapport van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 8 juli
    2010, nr. BJZ2010018755, Directie Bestuurlijke en Juridische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0028265/2018-03-31#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder: - *beperkt kwetsbaar object:* a. object
      als bedoeld in [artikel 1, eerste lid, onderdeel b, van het Besluit externe veiligheid inrichtingen][ref1] of b.
      lintbebouwing voor zover deze loodrecht of nagenoeg loodrecht is gelegen op de contouren van het plaatsgebonden
      risico van een buisleiding;
        - *bestemmingsplan:* bestemmingsplan als bedoeld in [artikel 3.1 van de Wet ruimtelijke ordening][ref2];
        - *buisleiding:* leiding bestemd of gebruikt voor het vervoer van gevaarlijke stoffen, met de daarbij behorende
      voorzieningen;
        - *exploitant:* verantwoordelijke voor de aanleg, het beheer, het gebruik en het onderhoud van een buisleiding;
        - *geprojecteerd kwetsbaar object:* nog niet aanwezig kwetsbaar object dat op grond van het voor het desbetreffende
      gebied geldende bestemmingsplan toelaatbaar is;
        - *gevaarlijke stoffen:* stoffen die ingevolge [artikel 2, eerste lid][ref3], zijn aangewezen;
        - *groepsrisico:* cumulatieve kansen per jaar per kilometer buisleiding dat ten minste 10, 100 of 1000 personen
      overlijden als rechtstreeks gevolg van hun aanwezigheid in het invloedsgebied van een buisleiding en een ongewoon
      voorval met die buisleiding;
        - *invloedsgebied:* gebied waarin personen worden meegeteld voor de berekening van het groepsrisico van de
      buisleiding tot de grens waarop de letaliteit van die personen 1% is;
        - *kwetsbaar object:* object als bedoeld in
      [artikel 1, eerste lid, onderdeel l, van het Besluit externe veiligheid inrichtingen][ref4];
        - *plaatsgebonden risico:* risico op een plaats nabij een buisleiding, uitgedrukt als de kans per jaar dat een
      persoon die onafgebroken en onbeschermd op die bepaalde plaats zou verblijven, overlijdt als rechtstreeks gevolg
      van een ongewoon voorval met die buisleiding;
        - *ramp:* ramp of zwaar ongeval als bedoeld in [artikel 1 van de Wet veiligheidsregio’s][ref5];
        - *wet:* [Wet milieubeheer][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0016767#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel3
