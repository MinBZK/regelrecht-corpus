  - number: '1.2'
    text: |-
      In dit besluit wordt onder een bestemmingsplan mede begrepen een inpassingsplan als bedoeld in [artikel 3.26][ref1]
      of [3.28 van de Wet ruimtelijke ordening][ref2], met dien verstande dat bij een inpassingsplan van een provincie
      onderscheidenlijk het Rijk voor «burgemeester en wethouders» wordt gelezen «gedeputeerde staten» onderscheidenlijk
      «Onze Minister».


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0028265/2018-03-31#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020449
        artikel: '3'
  - number: '2.1'
    text: |-
      Dit besluit is van toepassing op het vervoer door buisleidingen van stoffen die behoren tot een bij regeling van
      Onze Minister, na overleg met Onze Minister(s) wie het mede aangaat, aangewezen categorie.
    url: https://wetten.overheid.nl/BWBR0028265/2018-03-31#Artikel2
  - number: '2.2'
    text: |-
      In de regeling, bedoeld in het eerste lid, kan worden bepaald dat de aanwijzing slechts geldt voor stoffen die een
      daarbij aangegeven concentratie overschrijden of zich bevinden in een daarbij aangegeven toestand.
    url: https://wetten.overheid.nl/BWBR0028265/2018-03-31#Artikel2
  - number: '2.3'
    text: |-
      Dit besluit is niet van toepassing op het vervoer van gevaarlijke stoffen door buisleidingen, voor zover die
      buisleidingen:
    url: https://wetten.overheid.nl/BWBR0028265/2018-03-31#Artikel2
  - number: 2.3.a
    text: |-
      deel uitmaken van een inrichting als bedoeld in [artikel 1.1 van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel1
    url: https://wetten.overheid.nl/BWBR0028265/2018-03-31#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '1'
  - number: 2.3.b
    text: |-
      gelegen zijn op het continentaal plat, bedoeld in [artikel 1, onder c, van de Mijnbouwwet][ref1] of in de
      territoriale zee van Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel1
    url: https://wetten.overheid.nl/BWBR0028265/2018-03-31#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '1'
  - number: '3.1'
    text: |-
      Het is een exploitant verboden gevaarlijke stoffen in een buisleiding te hebben of te vervoeren, indien niet wordt
      voldaan aan de bij of krachtens dit besluit aan hem gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0028265/2018-03-31#Artikel3
  - number: '3.2'
    text: |-
      Bij regeling van Onze Minister kunnen categorieën van gevallen worden aangewezen, waarin de in het eerste
      lid bedoelde eisen geheel of voor een daarbij te bepalen gedeelte niet van toepassing zijn, indien onverkorte
      toepassing van de desbetreffende artikelen van dit besluit:
    url: https://wetten.overheid.nl/BWBR0028265/2018-03-31#Artikel3
  - number: 3.2.a
    text: in het belang van de bescherming van de gezondheid van de mens en van het milieu niet noodzakelijk is, of
    url: https://wetten.overheid.nl/BWBR0028265/2018-03-31#Artikel3
  - number: 3.2.b
    text: wegens bij de regeling te benoemen omstandigheden in redelijkheid niet van de exploitant kan worden gevergd.
    url: https://wetten.overheid.nl/BWBR0028265/2018-03-31#Artikel3
  - number: '4.1'
    text: |-
      De exploitant neemt bij het vervoer van gevaarlijke stoffen door een buisleiding de technische of organisatorische
      maatregelen die redelijkerwijs van hem gevergd kunnen worden om de effecten voor de gezondheid van de mens en van
      het milieu te beperken.
    url: https://wetten.overheid.nl/BWBR0028265/2018-03-31#Artikel4
  - number: '4.2'
    text: |-
      De exploitant neemt bij het ontwerp, de aanleg, de ingebruikstelling, het gebruik, een wijziging in de technische
      uitvoering, de exploitatie, het beheer, het onderhoud en het buiten gebruik stellen van een buisleiding de
      technische en organisatorische maatregelen die redelijkerwijs van hem gevergd kunnen worden, om ongewone voorvallen
      te voorkomen, en de gevolgen daarvan voor de gezondheid van de mens en van het milieu, voor zover die gevolgen niet
      kunnen worden voorkomen, zoveel mogelijk te beperken en ongedaan te maken.
    url: https://wetten.overheid.nl/BWBR0028265/2018-03-31#Artikel4
  - number: '4.3'
    text: |-
      De exploitant heeft een document voorhanden waarin het door hem gevoerde beleid ter invulling van de in het tweede
      lid bedoelde zorgplicht, rekening houdend met de aanwezigheid en de omvang van de risico’s van ongewone voorvallen,
      is vastgelegd. Dit document bevat de algemene doelstellingen en beginselen van het beleid inzake de beheersing van
      de risico’s van ongewone voorvallen.
    url: https://wetten.overheid.nl/BWBR0028265/2018-03-31#Artikel4
  - number: '4.4'
    text: De exploitant voert uit en neemt maatregelen overeenkomstig het in het derde lid bedoelde document.
    url: https://wetten.overheid.nl/BWBR0028265/2018-03-31#Artikel4
  - number: '4.5'
    text: |-
      Bij regeling van Onze Minister kunnen de maatregelen als bedoeld in het eerste en tweede lid worden aangewezen die
      de exploitant in ieder geval moet nemen.
    url: https://wetten.overheid.nl/BWBR0028265/2018-03-31#Artikel4
  - number: '4.6'
    text: |-
      Teneinde het beleid ter invulling van de in het tweede lid bedoelde zorgplicht te bepalen en uit te voeren, voert
      de exploitant een veiligheidsbeheerssysteem in. In het veiligheidsbeheerssysteem komen de elementen, genoemd in de
      bij dit besluit behorende bijlage, aan de orde.
    url: https://wetten.overheid.nl/BWBR0028265/2018-03-31#Artikel4
  - number: '4.7'
    text: |-
      Indien bij de aanleg, de ingebruikstelling, het gebruik, de technische uitvoering, de exploitatie, het beheer,
      het onderhoud of het buiten gebruik stellen van een buisleiding een verandering wordt aangebracht die voor de
      risico's van een ongewoon voorval belangrijke gevolgen kan hebben, draagt de exploitant er zorg voor dat het beleid
      ter voorkoming van ongewone voorvallen en het veiligheidsbeheerssysteem worden herzien. Een zodanige herziening
      vindt tevens plaats indien een verandering in het veiligheidsinzicht of een verandering van de best beschikbare
      technieken voor het beheer en onderhoud van buisleidingen, daartoe aanleiding geeft.
    url: https://wetten.overheid.nl/BWBR0028265/2018-03-31#Artikel4
  - number: '4.8'
    text: |-
      Op verzoek van Onze Minister zendt de exploitant het document, bedoeld in het derde lid, aan hem toe. Indien
      Onze Minister van oordeel is dat het document of het veiligheidsbeheerssysteem onjuist of onvolledig is dan wel
      anderszins niet voldoet, kan hij de exploitant verplichten tot het wijzigen, aanvullen of opnieuw opstellen van het
      document of het veiligheidsbeheerssysteem binnen een daarbij aangegeven termijn.
    url: https://wetten.overheid.nl/BWBR0028265/2018-03-31#Artikel4
  - number: '5.1'
    text: |-
      Onze Minister kan de exploitant verplichtingen opleggen tot het nemen van technische en organisatorische
      maatregelen of het verleggen van een buisleiding om het groepsrisico voor de omgeving in relatie tot de buisleiding
      te beperken.
    url: https://wetten.overheid.nl/BWBR0028265/2018-03-31#Artikel5
  - number: '5.2'
    text: |-
      Indien de exploitant zich ten gevolge van de beschikking, bedoeld in het eerste lid, voor kosten ziet gesteld dan
      wel schade lijdt, welke redelijkerwijs niet of niet geheel te zijnen laste behoren te blijven, kent Onze Minister
      hem, voor zover op andere wijze in een redelijke vergoeding niet is of kan worden voorzien, op zijn verzoek een
      naar billijkheid te bepalen vergoeding toe.
    url: https://wetten.overheid.nl/BWBR0028265/2018-03-31#Artikel5
  - number: '6.1'
    text: |-
      Het plaatsgebonden risico voor een kwetsbaar object, veroorzaakt door een buisleiding, mag niet hoger zijn dan 10-6
      per jaar.
    url: https://wetten.overheid.nl/BWBR0028265/2018-03-31#Artikel6
  - number: '6.2'
    text: |-
      De exploitant voert de aanleg of vervanging van een buisleiding zodanig uit dat het plaatsgebonden risico van de
      buisleiding op een afstand van vijf meter gemeten vanuit het hart van de buisleiding niet hoger is dan 10-6 per
      jaar.
    url: https://wetten.overheid.nl/BWBR0028265/2018-03-31#Artikel6
  - number: '6.3'
    text: |-
      Bij regeling van Onze Minister kan voor een bepaalde categorie van buisleidingen een andere afstand tot de
      buisleiding worden vastgesteld waarbuiten het plaatsgebonden risico de norm van 10-6 niet mag overschrijden, of
      tijdelijk een hoger risico worden geaccepteerd.
    url: https://wetten.overheid.nl/BWBR0028265/2018-03-31#Artikel6
  - number: '6.4'
    text: |-
      De aanleg of vervanging van een buisleiding is slechts toegestaan indien die aanleg of vervanging in
      overeenstemming is met het ter plaatse geldende bestemmingsplan of voor die aanleg of vervanging een
      omgevingsvergunning is verleend als bedoeld in [artikel 2.12 van de Wet algemene bepalingen omgevingsrecht][ref1]
      tot afwijking van het bestemmingsplan of de beheersverordening.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0028265/2018-03-31#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
  - number: '7.1'
    text: |-
      De exploitant heeft voor zijn buisleiding op basis van actuele en authentieke gegevens berekeningen voorhanden van
      het plaatsgebonden en het groepsrisico, uitgevoerd volgens bij regeling van Onze Minister gestelde regels.
    url: https://wetten.overheid.nl/BWBR0028265/2018-03-31#Artikel7
  - number: '7.2'
    text: |-
      De exploitant verstrekt op verzoek de gegevens ten behoeve van de besluiten, bedoeld in [artikel 11][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028265#Artikel11
    url: https://wetten.overheid.nl/BWBR0028265/2018-03-31#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0028265
        artikel: '11'
        paragraaf: '3'
  - number: '8.1'
    text: |-
      De exploitant voert bij een voorgenomen wijziging van de gegevens, bedoeld in [artikel 12.12 van de wet][ref1], een
      onderzoek uit naar de invloed van die wijziging op het plaatsgebonden risico en het groepsrisico.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel12
    url: https://wetten.overheid.nl/BWBR0028265/2018-03-31#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '12'
  - number: '8.2'
    text: |-
      Bij een negatieve invloed van de voorgenomen wijziging op het plaatsgebonden risico of het
      groepsrisico kan deze wijziging slechts worden doorgevoerd, indien deze in overeenstemming is met
      het geldende bestemmingsplan of voor die wijziging een omgevingsvergunning is verleend als bedoeld in
      [artikel 2.12 van de Wet algemene bepalingen omgevingsrecht][ref1] tot afwijking van het bestemmingsplan of de
      beheersverordening.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0028265/2018-03-31#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
  - number: '8.3'
    text: De exploitant meldt de wijziging onverwijld aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0028265/2018-03-31#Artikel8
  - number: '9.1'
    text: Wanneer een buisleiding buiten gebruik is, meldt de exploitant dit onverwijld aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0028265/2018-03-31#Artikel9
  - number: '9.2'
    text: |-
      Een buisleiding is in ieder geval buiten gebruik, indien deze gedurende een aaneengesloten periode van ten minste
      een jaar niet in gebruik is geweest voor het vervoer van een gevaarlijke stof.
    url: https://wetten.overheid.nl/BWBR0028265/2018-03-31#Artikel9
  - number: '9.3'
    text: |-
      De exploitant draagt er zorg voor dat een buisleiding die buiten gebruik is geen gevaar voor de gezondheid van de
      mens en van het milieu kan opleveren.
    url: https://wetten.overheid.nl/BWBR0028265/2018-03-31#Artikel9
  - number: '9.4'
    text: |-
      Bij hernieuwde ingebruikname van de buisleiding volgt de exploitant de procedure voor wijziging van de gegevens,
      genoemd in [artikel 8][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028265#Artikel8
    url: https://wetten.overheid.nl/BWBR0028265/2018-03-31#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0028265
        artikel: '8'
        paragraaf: '2'
  - number: '10'
    text: |-
      De exploitant waarbij zich een ongewoon voorval voordoet of heeft voorgedaan, waardoor nadelige
      gevolgen voor de gezondheid van de mens of voor het milieu zijn ontstaan of dreigen te ontstaan,
      meldt dat voorval zo spoedig mogelijk aan Onze Minister en verstrekt daarbij de gegevens bedoeld in
      [artikel 17.2, tweede lid, van de wet][ref1]. Onze minister geeft van de melding en de daarbij verstrekte gegevens
      onverwijld kennis aan de bestuursorganen genoemd in artikel 17.2, derde lid, van de wet.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel17
    url: https://wetten.overheid.nl/BWBR0028265/2018-03-31#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '17'
  - number: '11.1'
    text: |-
      Bij de vaststelling van een bestemmingplan, op grond waarvan de aanleg van een buisleiding of de aanleg, bouw of
      vestiging van een kwetsbaar object bij een buisleiding wordt toegelaten, wordt een grenswaarde in acht genomen van
      10-6 per jaar met betrekking tot het plaatsgebonden risico voor kwetsbare objecten.
    url: https://wetten.overheid.nl/BWBR0028265/2018-03-31#Artikel11
  - number: '11.2'
    text: |-
      Bij de vaststelling van een bestemmingsplan op grond waarvan de aanleg van een buisleiding of de aanleg, bouw of
      vestiging van een beperkt kwetsbaar object bij een buisleiding wordt toegelaten, wordt rekening gehouden met een
      richtwaarde van 10 per jaar met betrekking tot het plaatsgebonden risico voor beperkt kwetsbare objecten.
    url: https://wetten.overheid.nl/BWBR0028265/2018-03-31#Artikel11
  - number: '11.3'
    text: |-
      Met betrekking tot de vaststelling van een bestemmingsplan op grond waarvan de aanleg, bouw of vestiging van een
      risicoverhogend object wordt toegelaten in de directe omgeving van de buisleiding zijn het eerste en tweede lid van
      overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0028265/2018-03-31#Artikel11
  - number: '11.4'
    text: |-
      Bij de toepassing van
      [artikel 2.12, eerste lid, onder a, onder 2 en 3, van de Wet algemene bepalingen omgevingsrecht][ref1] tot
      afwijking van het bestemmingsplan of de beheersverordening en van [artikel 11 van de Woningwet][ref2] tot afwijking
      van de bouwverordening vinden het eerste en tweede lid overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel11
    url: https://wetten.overheid.nl/BWBR0028265/2018-03-31#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '11'
  - number: '12.1'
    text: |-
      Bij de vaststelling van een bestemmingsplan, op grond waarvan de aanleg van een buisleiding of de aanleg, bouw of
      vestiging van een kwetsbaar of een beperkt kwetsbaar object wordt toegelaten, wordt tevens het groepsrisico in het
      invloedsgebied van de buisleiding verantwoord. In de toelichting bij het besluit wordt vermeld:
    url: https://wetten.overheid.nl/BWBR0028265/2018-03-31#Artikel12
  - number: 12.1.a
    text: |-
      de aanwezige en de op grond van het besluit te verwachten dichtheid van personen in het invloedsgebied van de
      buisleiding of buisleidingen die het groepsrisico mede veroorzaakt of veroorzaken;
    url: https://wetten.overheid.nl/BWBR0028265/2018-03-31#Artikel12
  - number: 12.1.b
    text: |-
      het groepsrisico per kilometer buisleiding op het tijdstip waarop het besluit wordt vastgesteld en de bijdrage van
      de in dat besluit toegelaten kwetsbare en beperkt kwetsbare objecten aan de hoogte van het groepsrisico, vergeleken
      met de lijn die de kans weergeeft op een ongeval met 10 of meer dodelijke slachtoffers van ten hoogste 10-4 per
      jaar en de kans op een ongeval met 100 of meer dodelijke slachtoffers van ten hoogste 10-6 per jaar;
    url: https://wetten.overheid.nl/BWBR0028265/2018-03-31#Artikel12
  - number: 12.1.c
    text: |-
      indien mogelijk, de maatregelen ter beperking van het groepsrisico die worden toegepast door de exploitant van de
      buisleiding die dat risico mede veroorzaakt;
    url: https://wetten.overheid.nl/BWBR0028265/2018-03-31#Artikel12
  - number: 12.1.d
    text: andere mogelijkheden voor ruimtelijke ontwikkelingen met een lager groepsrisico en de voor- en nadelen daarvan;
    url: https://wetten.overheid.nl/BWBR0028265/2018-03-31#Artikel12
  - number: 12.1.e
    text: de mogelijkheden en de voorgenomen maatregelen tot beperking van het groepsrisico in de nabije toekomst;
    url: https://wetten.overheid.nl/BWBR0028265/2018-03-31#Artikel12
  - number: 12.1.f
    text: de mogelijkheden tot voorbereiding van bestrijding en beperking van de omvang van een ramp of zwaar ongeval;
    url: https://wetten.overheid.nl/BWBR0028265/2018-03-31#Artikel12
  - number: 12.1.g
    text: |-
      de mogelijkheden voor personen die zich bevinden in het invloedsgebied van de buisleiding of buisleidingen die
      het groepsrisico mede veroorzaakt of veroorzaken, om zich in veiligheid te brengen indien zich een ramp of zwaar
      ongeval voordoet.
    url: https://wetten.overheid.nl/BWBR0028265/2018-03-31#Artikel12
  - number: '12.2'
    text: |-
      Voorafgaand aan de vaststelling van een besluit als bedoeld in het eerste lid stelt het voor dat besluit bevoegde
      gezag het bestuur van de regionale brandweer in wiens regio het gebied ligt waarop dat besluit betrekking heeft, in
      de gelegenheid om in verband met het groepsrisico advies uit te brengen over de mogelijkheden tot voorbereiding van
      bestrijding en beperking van de omvang van een ramp of zwaar ongeval en over de zelfredzaamheid van personen in het
      invloedsgebied van de buisleiding.
    url: https://wetten.overheid.nl/BWBR0028265/2018-03-31#Artikel12
  - number: '12.3'
    text: 'Het eerste lid, onderdelen c tot en met e, is niet van toepassing indien:'
    url: https://wetten.overheid.nl/BWBR0028265/2018-03-31#Artikel12
  - number: 12.3.a
    text: |-
      een bestemmingsplan betrekking heeft op een gebied waarbinnen de letaliteit van personen binnen het invloedsgebied
      minder dan 100% of bij toxische stoffen waarbij het plaatsgebonden risico kleiner dan 10-8 per jaar is, of
    url: https://wetten.overheid.nl/BWBR0028265/2018-03-31#Artikel12
  - number: 12.3.b
    text: |-
      het groepsrisico of de toename van het groepsrisico bij verwezenlijking van het bestemmingsplan niet hoger is dan
      een bij regeling van Onze Minister gestelde waarde, welke waarde voor verschillende categorieën van buisleidingen
      verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0028265/2018-03-31#Artikel12
  - number: '13'
    text: |-
      De berekening van het plaatgebonden risico, bedoeld in [artikel 11][ref1], en het groepsrisico, bedoeld in
      [artikel 12][ref2], worden uitgevoerd volgens bij regeling van Onze Minister gestelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0028265#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0028265#Artikel12
    url: https://wetten.overheid.nl/BWBR0028265/2018-03-31#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0028265
        artikel: '11'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0028265
        artikel: '12'
        paragraaf: '3'
  - number: '14.1'
    text: |-
      Een bestemmingsplan geeft de ligging weer van de in het plangebied aanwezige buisleidingen alsmede de daarbij
      behorende belemmeringenstrook ten behoeve van het onderhoud van de buisleiding. De belemmeringenstrook bedraagt ten
      minste vijf meter aan weerszijden van een buisleiding, gemeten vanuit het hart van de buisleiding.
    url: https://wetten.overheid.nl/BWBR0028265/2018-03-31#Artikel14
  - number: '14.2'
    text: |-
      Een bestemmingsplan waarbij aan gronden de bestemming wordt toegewezen die de aanwezigheid van een buisleiding
      toelaat, bevat in elk geval voor de belemmeringenstrook:
    url: https://wetten.overheid.nl/BWBR0028265/2018-03-31#Artikel14
  - number: 14.2.a
    text: geen nieuwe bestemmingen die het oprichten van bouwwerken toestaan;
    url: https://wetten.overheid.nl/BWBR0028265/2018-03-31#Artikel14
  - number: 14.2.b
    text: |-
      een vergunningenstelsel als bedoeld in [artikel 3.3 van de Wet ruimtelijke ordening][ref1],
      voor werken of werkzaamheden die van invloed kunnen zijn op de integriteit en
      werking van de buisleiding, niet zijnde graafwerkzaamheden als bedoeld in de
      [Wet informatie-uitwisseling bovengrondse en ondergrondse netten en netwerken][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0040728
    url: https://wetten.overheid.nl/BWBR0028265/2018-03-31#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0040728
  - number: '14.3'
    text: |-
      Voor zover in een bestemmingsplan de bevoegdheid wordt opgenomen om in afwijking daarvan bij omgevingsvergunning
      het oprichten van bouwwerken in de belemmeringenstrook toe te staan, wordt daarbij bepaald dat de
      omgevingsvergunning uitsluitend kan worden verleend voor zover de veiligheid met betrekking tot de in de
      belemmeringenstrook gelegen buisleiding niet wordt geschaad en geen kwetsbaar object wordt toegelaten.
    url: https://wetten.overheid.nl/BWBR0028265/2018-03-31#Artikel14
  - number: '15.1'
    text: |-
      Onze Minister kan ontheffing verlenen van de [artikelen 11][ref1], [12][ref2], [13][ref3] en [14][ref4], indien de
      buisleiding gedurende een aaneengesloten periode van ten minste drie jaar niet in gebruik is geweest.


      [ref1]: https://wetten.overheid.nl/BWBR0028265#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0028265#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0028265#Artikel13
      [ref4]: https://wetten.overheid.nl/BWBR0028265#Artikel14
    url: https://wetten.overheid.nl/BWBR0028265/2018-03-31#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0028265
        artikel: '11'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0028265
        artikel: '12'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0028265
        artikel: '13'
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0028265
        artikel: '14'
        paragraaf: '3'
  - number: '15.2'
    text: |-
      De in het eerste lid bedoelde ontheffing kan niet worden verleend met betrekking tot buisleidingen die onderdeel
      uitmaken van het militaire buisleidingstelsel van de Noord-Atlantische Verdragsorganisatie.
    url: https://wetten.overheid.nl/BWBR0028265/2018-03-31#Artikel15
  - number: '16'
    text: |-
      Op een buisleiding die op grond van een bestemmingsplan is toegelaten binnen een veiligheidscontour als bedoeld in
      [artikel 14 van het Besluit externe veiligheid inrichtingen][ref1], zijn de [artikelen 11][ref2] en [17][ref3] van
      dit besluit niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0016767#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0028265#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0028265#Artikel17
    url: https://wetten.overheid.nl/BWBR0028265/2018-03-31#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0016767
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0028265
        artikel: '11'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0028265
        artikel: '17'
        paragraaf: '4'
  - number: '17.1'
    text: |-
      Indien op het tijdstip waarop dit besluit op een buisleiding van toepassing wordt het plaatsgebonden risico voor
      een kwetsbaar object, veroorzaakt door een buisleiding hoger is dan 10-6 per jaar, draagt de exploitant er zorg
      voor dat binnen drie jaar na dat tijdstip het plaatsgebonden risico die waarde niet meer overschrijdt.
    url: https://wetten.overheid.nl/BWBR0028265/2018-03-31#Artikel17
  - number: '17.2'
    text: |-
      Indien op het tijdstip waarop dit besluit op een buisleiding van toepassing wordt het plaatsgebonden risico
      voor een geprojecteerd kwetsbaar object, veroorzaakt door een buisleiding, hoger is dan 10-6 per jaar, draagt de
      exploitant er zorg voor dat binnen drie jaar na de realisatie van het object het plaatsgebonden risico die waarde
      niet meer overschrijdt.
    url: https://wetten.overheid.nl/BWBR0028265/2018-03-31#Artikel17
  - number: '17.3'
    text: |-
      Indien op het tijdstip waarop dit besluit op een buisleiding van toepassing wordt de buisleiding buiten gebruik
      is, draagt de exploitant er zorg voor dat op het tijdstip waarop de buisleiding opnieuw in gebruik wordt genomen,
      het plaatsgebonden risico de waarde 10-6 per jaar voor een kwetsbaar object of een geprojecteerd kwetsbaar object,
      niet overschrijdt.
    url: https://wetten.overheid.nl/BWBR0028265/2018-03-31#Artikel17
  - number: '17.4'
    text: |-
      Bij de toepassing van de [artikelen 11][ref1], [12][ref2], [13][ref3] en [14][ref4] kan rekening worden gehouden
      met de resultaten van de verplichtingen, bedoeld in het eerste, tweede en derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0028265#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0028265#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0028265#Artikel13
      [ref4]: https://wetten.overheid.nl/BWBR0028265#Artikel14
    url: https://wetten.overheid.nl/BWBR0028265/2018-03-31#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0028265
        artikel: '11'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0028265
        artikel: '12'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0028265
        artikel: '13'
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0028265
        artikel: '14'
        paragraaf: '3'
  - number: '18'
    text: |-
      [Artikel 12][ref1] is niet van toepassing op een bestemmingsplan waarvan het ontwerp voor het tijdstip van
      inwerkingtreding van dit besluit ter inzage is gelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0028265#Artikel12
    url: https://wetten.overheid.nl/BWBR0028265/2018-03-31#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0028265
        artikel: '12'
        paragraaf: '3'
  - number: '19'
    text: |-
      In afwijking van [artikel 4.3, tweede lid, van de Wet ruimtelijke ordening][ref1] draagt de gemeenteraad er zorg
      voor dat binnen vijf jaar na de datum van inwerkingtreding van dit besluit een bestemmingsplan in overeenstemming
      is met dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel4
    url: https://wetten.overheid.nl/BWBR0028265/2018-03-31#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '4'
  - number: '20'
    text: |-
      Onze Minister geeft voor 1 januari 2017 aan of de bij dit besluit gestelde waarden en de krachtens dit besluit
      gestelde afstanden herziening behoeven.
    url: https://wetten.overheid.nl/BWBR0028265/2018-03-31#Artikel20
  - number: '22'
    text: |-
      Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip dat voor verschillende artikelen of
      onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0028265/2018-03-31#Artikel22
