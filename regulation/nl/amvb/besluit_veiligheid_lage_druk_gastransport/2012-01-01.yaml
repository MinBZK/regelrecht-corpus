    text: Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0030600/2012-01-01#Artikel5
  - number: '6'
    text: 'Dit besluit wordt aangehaald als: Besluit veiligheid lage druk gastransport.'
    url: https://wetten.overheid.nl/BWBR0030600/2012-01-01#Artikel6
