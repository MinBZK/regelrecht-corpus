  url: https://wetten.overheid.nl/BWBR0030600/2012-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Dit besluit is van toepassing op het gastransportnet dat bestemd is of gebruikt wordt voor het transport van gas
      bij een druk tot en met 16 bar.
    url: https://wetten.overheid.nl/BWBR0030600/2012-01-01#Artikel1
  - number: '2.1'
    text: |-
      Een netbeheerder neemt bij het ontwerp, de aanleg, de ingebruikstelling, de exploitatie, de wijziging, het beheer,
      het onderhoud en de buitengebruikstelling van een gastransportnet de technische en organisatorische maatregelen die
      redelijkerwijs van hem gevergd kunnen worden om voorvallen te voorkomen waardoor nadelige gevolgen voor de mens of
      het milieu kunnen ontstaan.
    url: https://wetten.overheid.nl/BWBR0030600/2012-01-01#Artikel2
  - number: '2.2'
    text: |-
      Indien zich een voorval voordoet waardoor nadelige gevolgen voor de mens of het milieu zijn ontstaan, draagt de
      netbeheerder zorg voor het zoveel mogelijk beperken of ongedaan maken van de nadelige gevolgen voor de mens en
      het milieu.
    url: https://wetten.overheid.nl/BWBR0030600/2012-01-01#Artikel2
  - number: '2.3'
    text: |-
      De netbeheerder heeft een document voorhanden waarin het door hem gevoerde beleid ter invulling van de
      zorgplichten, bedoeld in het eerste en tweede lid, zijn vastgelegd, rekening houdend met de aanwezigheid en de
      omvang van de risico’s op voorvallen waardoor nadelige gevolgen voor de mens of het milieu kunnen ontstaan. Dit
      document bevat ten minste de algemene doelstellingen en beginselen van het beleid inzake de beheersing van de
      risico’s.
    url: https://wetten.overheid.nl/BWBR0030600/2012-01-01#Artikel2
  - number: '3'
    text: |-
      Een netbeheerder stuurt om het jaar het document, bedoeld in [artikel 2, derde lid][ref1], mee bij het kwaliteits-
      en capaciteitsdocument, bedoeld in [artikel 8, tweede lid, van de Gaswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0030600#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel8
    url: https://wetten.overheid.nl/BWBR0030600/2012-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0030600
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0011440
        artikel: '8'
  - number: '4.1'
    text: |-
      Een netbeheerder heeft een veiligheidsmanagementsysteem waarmee voorvallen waardoor nadelige gevolgen voor de mens
      of het milieu kunnen ontstaan zoveel mogelijk worden voorkomen, en de nadelige gevolgen voor de mens of het milieu
      van voorvallen zoveel mogelijk worden beperkt.
    url: https://wetten.overheid.nl/BWBR0030600/2012-01-01#Artikel4
  - number: '4.2'
    text: 'Een veiligheidsmanagementsysteem bevat in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0030600/2012-01-01#Artikel4
  - number: 4.2.a
    text: |-
      de missie, visie en strategie van de netbeheerder met betrekking tot het beheersen van de veiligheid van de mens en
      het milieu;
    url: https://wetten.overheid.nl/BWBR0030600/2012-01-01#Artikel4
  - number: 4.2.b
    text: de doelstellingen en plannen met betrekking tot het beheersen van de veiligheid voor de mens en het milieu;
    url: https://wetten.overheid.nl/BWBR0030600/2012-01-01#Artikel4
  - number: 4.2.c
    text: |-
      een beschrijving van de voorwaardenscheppende, ondersteunende en controlerende processen, waaronder een risico-
      inventarisatie en risico-evaluatie met betrekking tot het beheersen van de veiligheid voor de mens en het milieu;
    url: https://wetten.overheid.nl/BWBR0030600/2012-01-01#Artikel4
  - number: 4.2.d
    text: |-
      een beschrijving van de implementatie en realisatie van systematische en gecoördineerde activiteiten met betrekking
      tot het beheer van de bedrijfsmiddelen ter beheersing van de veiligheid voor de mens en het milieu;
    url: https://wetten.overheid.nl/BWBR0030600/2012-01-01#Artikel4
  - number: 4.2.e
    text: |-
      een beschrijving van het proces en de doelstellingen van de directiebeoordeling, waaronder tevens begrepen de
      beoordeling door de leiding van het meest betrokken bedrijfsonderdeel;
    url: https://wetten.overheid.nl/BWBR0030600/2012-01-01#Artikel4
  - number: 4.2.f
    text: |-
      een beschrijving van de procedures voor het identificeren van verbetermaatregelen met betrekking tot het
      veiligheidsmanagementsysteem en het ontwikkelen, prioriteren en implementeren van de verbetermaatregelen.
    url: https://wetten.overheid.nl/BWBR0030600/2012-01-01#Artikel4
  - number: '4.3'
    text: |-
      Bij het continue verbeterproces van het veiligheidsmanagementsysteem, bedoeld in het tweede lid, onderdeel f, wordt
      rekening gehouden met de ontwikkeling van de op grond van [artikel 8, derde lid, van de Gaswet][ref1] vastgestelde
      veiligheidsindicatoren.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel8
    url: https://wetten.overheid.nl/BWBR0030600/2012-01-01#Artikel4
    references:
