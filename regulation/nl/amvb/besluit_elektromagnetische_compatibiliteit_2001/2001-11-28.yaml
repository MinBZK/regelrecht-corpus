preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Verkeer en Waterstaat van 13 april 2001, nr. DGTP/01/2243/VW,
    Directoraat-Generaal Telecommunicatie en Post;

    Gelet op richtlijn nr. 89/336/EEG van de Raad van de Europese Gemeenschappen van 3 mei 1989 betreffende de
    onderlinge aanpassing van de wetgevingen van de Lid-Staten inzake elektromagnetische compatibiliteit (PbEG L
    139) alsmede op artikel 3, tweede lid en de sectorbijlage betreffende elektromagnetische compatibiliteit van
    de Overeenkomst inzake wederzijdse erkenning tussen de Europese Gemeenschap en de Verenigde Staten van Amerika
    (PbEG 1999, L 31), artikel II, derde lid en de sectorbijlage betreffende elektromagnetische compatibiliteit van
    de Overeenkomst inzake wederzijdse erkenning tussen de Europese Gemeenschap en Canada (PbEG 1998, L 280), artikel
    2, tweede lid, en de sectorbijlage betreffende elektromagnetische compatibiliteit van de Overeenkomst inzake
    wederzijdse erkenning van overeenstemmingsbeoordeling, certificaten en markeringen tussen de Europese Gemeenschap
    en Australië (PbEG 1998, L 229) en artikel 2, tweede lid en de sectorbijlage betreffende elektromagnetische
    compatibiliteit van de Overeenkomst inzake wederzijdse erkenning van overeenstemmingsbeoordeling tussen de Europese
    Gemeenschap en Nieuw-Zeeland (PbEG 1998, L 229) en op de artikelen 10.1, onderdeel a, 10.2, 10.3, tweede lid en
    artikel 10.4 van de Telecommunicatiewet;

    De Raad van State gehoord (advies van 20 juli 2001, no. W09.01.0195/V);

    Gezien het nader rapport van de Staatssecretaris van Verkeer en Waterstaat van 17 oktober 2001, nr. DGTP/01/4685/
    VW, Directoraat-Generaal Telecommunicatie en Post;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0012915/2001-11-28#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. wet: [Telecommunicatiewet][ref1];

      b. richtlijn: [richtlijn nr. 89/336/EEG](31989L0336) van de Raad van de Europese Gemeenschappen van 3 mei 1989
      betreffende de onderlinge aanpassing van de wetgevingen van de Lid-Staten inzake elektromagnetische compatibiliteit
      (PbEG L 139);

      c. derde land: land dat partij is bij een bij ministeriële regeling genoemde overeenkomst;

      d. bevoegde instantie: instantie die door een staat die partij is bij de Overeenkomst betreffende de Europese
      Economische Ruimte dan wel die, in het kader van een bij ministeriële regeling genoemde overeenkomst, door
      de aanwijzende autoriteit van een derde land is aangewezen voor het afgeven van een technisch verslag of een
      certificaat als bedoeld in [artikel 7, eerste lid, onderdeel b][ref2];

      e. aangemelde instantie: instantie die door een staat die partij is bij de Overeenkomst betreffende de Europese
      Economische Ruimte dan wel die, in het kader van een bij ministeriële regeling genoemde overeenkomst, door de
      aanwijzende autoriteit in een derde land is aangewezen voor het afgeven van een EG-typeverklaring als bedoeld in
      [artikel 7, eerste lid, onderdeel c][ref3];

      f. EG-verklaring van overeenstemming: document waarin degene die apparaten in de handel brengt verklaart dat die
      apparaten voldoen aan het bij of krachtens dit besluit bepaalde en dat de in bijlage 1 bedoelde gegevens bevat;

      g. apparaten of systemen voor luchtverkeersafhandeling: apparatuur of systemen, bedoeld in artikel 1 van [richtlijn
      nr. 93/65/EEG](31993L0065) van de Raad van de Europese Gemeenschappen van 19 juli 1993 betreffende de vaststelling
      en het gebruik van compatibele technische normen en specificaties voor de aanschaf van apparatuur en van systemen
      voor luchtverkeersafhandeling (PbEG L 187), voor zover het radiozendapparaten betreft;

      h. EG-typeverklaring: document waarin een aangemelde instantie verklaart dat de onderzochte apparaten of systemen
      voor luchtverkeersafhandeling voldoen aan het in het bij of krachtens dit besluit terzake van die apparatuur of
      systemen bepaalde;

      i. beschermingseisen: voorschriften betreffende de elektromagnetische compatibiliteit, bedoeld in
      [artikel 3][ref4];

      j. markering: CE-markering, bedoeld in bijlage 2.


      [ref1]: https://wetten.overheid.nl/BWBR0009950
      [ref2]: https://wetten.overheid.nl/BWBR0012915#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0012915#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0012915#Artikel3
