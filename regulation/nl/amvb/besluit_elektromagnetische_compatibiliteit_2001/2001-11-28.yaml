  - number: '2'
    text: |-
      De verplichtingen die bij of krachtens dit besluit worden opgelegd aan degene die apparaten in de handel brengt,
      gelden tevens voor de in Nederland gevestigde wettelijke vertegenwoordiger van deze persoon.
    url: https://wetten.overheid.nl/BWBR0012915/2001-11-28#Artikel2
  - number: '3'
    text: |-
      1 Indien apparaten op passende wijze zijn geïnstalleerd en onderhouden en overeenkomstig hun bestemming worden
      gebruikt, voldoen zij aan de voorschriften betreffende de elektromagnetische compatibiliteit, die inhouden dat:

      a. de opwekking van elektromagnetische storingen beperkt blijft tot een zodanig niveau dat apparaten overeenkomstig
      hun bestemming kunnen functioneren, en

      b. apparaten een passend niveau van ongevoeligheid bezitten zodat zij, bij aanwezigheid van een elektromagnetische
      storing, kunnen functioneren zonder dat de kwaliteit van de werking wordt aangetast.

      2 De in het eerste lid bedoelde voorschriften omvatten in elk geval de in bijlage 3 genoemde voorschriften.
    url: https://wetten.overheid.nl/BWBR0012915/2001-11-28#Artikel3
  - number: '4'
    text: |-
      1 Onze Minister stelt normen op het gebied van elektromagnetische compatibiliteit vast.

      2 De door Onze Minister krachtens het eerste lid vast te stellen normen kunnen inhouden:

      a. de omzetting van binnen de Europese Unie geharmoniseerde normen, of

      b. nationale normen van Nederland, voor zover geharmoniseerde normen niet bestaan.

      3 De referenties van de door Onze Minister vastgestelde normen worden bekendgemaakt in de Staatscourant.

      4 Voor zover geharmoniseerde normen niet bestaan, maakt Onze Minister tevens in de Staatscourant bekend de
      referenties van nationale normen van een staat, die partij is bij de Overeenkomst betreffende de Europese
      Economische Ruimte, niet zijnde Nederland.
    url: https://wetten.overheid.nl/BWBR0012915/2001-11-28#Artikel4
  - number: '5'
    text: |-
      Apparaten worden vermoed te voldoen aan de beschermingseisen, indien blijkens de markering en de EG-verklaring van
      overeenstemming is voldaan aan de normen, bedoeld in [artikel 4, eerste of vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012915#Artikel4
    url: https://wetten.overheid.nl/BWBR0012915/2001-11-28#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0012915
        artikel: '4'
        hoofdstuk: '2'
  - number: '6'
    text: |-
      1 Ter bekrachtiging dat apparaten aan de beschermingseisen voldoen, brengt degene die de apparaten in de handel
      brengt op het apparaat of, als dat niet mogelijk is, op de verpakking, de gebruiksaanwijzing of het garantiebewijs,
      de markering aan.

      2 Vermeldingen, vaststellingen of andere aanduidingen, die met de markering kunnen worden verward, worden niet
      gebezigd.
    url: https://wetten.overheid.nl/BWBR0012915/2001-11-28#Artikel6
  - number: '7'
    text: |-
      1 Degene die apparaten in de handel brengt, brengt de markering slechts aan, indien hij:

      a. voor apparaten, niet zijnde apparaten of systemen voor luchtverkeersafhandeling, waarvan de vervaardiging
      plaatsvindt met inachtneming van de in [artikel 4, eerste of vierde lid][ref1], bedoelde normen, de overeenstemming
      van de apparaten met de beschermingseisen heeft bekrachtigd door de afgifte van een EG-verklaring van
      overeenstemming;

      b. voor apparaten, niet zijnde apparaten of systemen voor luchtverkeersafhandeling, waarvan
      de vervaardiging plaatsvindt zonder of zonder volledige inachtneming van de normen, bedoeld in
      [artikel 4, eerste of vierde lid][ref2]:

      I. een technisch constructiedossier heeft samengesteld, waarin zijn opgenomen:

        - een beschrijving van het apparaat;
        - een uiteenzetting van de wijze waarop de overeenstemming met de beschermingseisen is verzekerd;
        - een technisch verslag of een certificaat, dat is verkregen van een bevoegde instantie, en

      II. de overeenstemming van de apparaten met het in het technische constructiedossier beschreven apparaat heeft
      bekrachtigd door de afgifte van een EG-verklaring van overeenstemming;

      c. voor apparaten of systemen voor luchtverkeersafhandeling, voorafgaande aan het afgeven van een EG-verklaring van
      overeenstemming, een EG-typeverklaring heeft verkregen.

      2 Onverminderd het eerste lid wordt de markering slechts op de apparaten aangebracht, indien deze apparaten
      tevens voldoen aan het bepaalde bij of krachtens andere wettelijke voorschriften waarin het aanbrengen van de
      markering verplicht is gesteld, met dien verstande dat indien en voor zolang het aanbrengen van de markering
      in deze andere wettelijke voorschriften optioneel is gesteld, de markering in afwijking van het vorenstaande
      tevens op de apparaten mag worden aangebracht mits de in het Publicatieblad van de Europese Gemeenschappen
      bekendgemaakte referenties van de toegepaste richtlijnen worden vermeld op de vereiste documenten, handleidingen of
      gebruiksaanwijzingen die bij deze apparaten zijn gevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0012915#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0012915#Artikel4
    url: https://wetten.overheid.nl/BWBR0012915/2001-11-28#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0012915
        artikel: '4'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0012915
        artikel: '4'
        hoofdstuk: '2'
  - number: '8'
    text: |-
      1 Degene die apparaten of systemen voor luchtverkeersafhandeling in de handel brengt kan bij de
      overeenstemmingsbeoordelingsprocedure, bedoeld in [artikel 7, eerste lid, onderdeel c][ref1], een aangemelde
      instantie in een staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte inschakelen,
      mits deze instantie voor de desbetreffende procedure bij de Commissie van de Europese Gemeenschappen is aangemeld
      op grond van artikel 10, zesde lid, van de richtlijn.

      2 In afwijking van het eerste lid kan degene die apparaten of systemen voor luchtverkeersafhandeling
      in de Europese Unie in de handel brengt bij de overeenstemmingsbeoordelingsprocedure, bedoeld in
      [artikel 7, eerste lid, onderdeel c][ref2], een aangemelde instantie in een derde land inschakelen, mits deze
      aangemelde instantie is vermeld in de sectorbijlage betreffende elektromagnetische compatibiliteit behorend bij
      een van de bij ministeriële regeling genoemde overeenkomsten, de aanwijzing van de instantie op grond van deze
      overeenkomst niet is geschorst en de Europese Gemeenschap haar uit deze overeenkomst voortvloeiende verplichtingen
      niet geheel of gedeeltelijk heeft opgeschort.

      3 Het tweede lid is van overeenkomstige toepassing voor wat betreft het inschakelen van een bevoegde instantie in
      een derde land bij de overeenstemmingsbeoordelingsprocedure, bedoeld in [artikel 7, eerste lid, onderdeel b][ref3],
      door degene die apparaten in de Europese Unie in de handel brengt.


      [ref1]: https://wetten.overheid.nl/BWBR0012915#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0012915#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0012915#Artikel7
    url: https://wetten.overheid.nl/BWBR0012915/2001-11-28#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0012915
        artikel: '7'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0012915
        artikel: '7'
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0012915
        artikel: '7'
        hoofdstuk: '3'
  - number: '9'
    text: |-
      Het technisch verslag of certificaat, bedoeld in [artikel 7, eerste lid, onderdeel b][ref1], wordt door
      een bevoegde instantie verstrekt en behelst een oordeel van de bevoegde instantie over de wijze waarop de
      overeenstemming van de apparaten met de beschermingseisen is verzekerd.


      [ref1]: https://wetten.overheid.nl/BWBR0012915#Artikel7
    url: https://wetten.overheid.nl/BWBR0012915/2001-11-28#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0012915
        artikel: '7'
        hoofdstuk: '3'
  - number: '10'
    text: |-
      1 De EG-typeverklaring, bedoeld in [artikel 7, eerste lid, onderdeel c][ref1], wordt door een aangemelde instantie
      verleend aan degene die apparaten of systemen voor luchtverkeersafhandeling in de handel brengt, indien de
      aangemelde instantie mede op basis van een uitgevoerde test tot de bevinding is gekomen dat de apparaten of
      systemen voldoen aan de beschermingseisen.

      2 In de EG-typeverklaring is tenminste opgenomen:

      a. de naam en het adres van degene aan wie de EG-typeverklaring is afgegeven;

      b. een beschrijving van de apparaten of systemen voor luchtverkeersafhandeling;

      c. de vermelding van de technische specificaties op basis waarvan de test is uitgevoerd;

      d. de resultaten van het testrapport.

      3 Bij de EG-typeverklaring zijn in elk geval gevoegd:

      a. een bijlage met daarin een volledige technische omschrijving van de apparaten of systemen voor
      luchtverkeersafhandeling;

      b. een bijlage bestaande uit een gewaarmerkt exemplaar van het testrapport.


      [ref1]: https://wetten.overheid.nl/BWBR0012915#Artikel7
    url: https://wetten.overheid.nl/BWBR0012915/2001-11-28#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0012915
        artikel: '7'
        hoofdstuk: '3'
  - number: '11'
    text: |-
      De EG-verklaring van overeenstemming en het technisch constructiedossier, bedoeld in
      [artikel 7, eerste lid, onderdeel b][ref1], worden door degene die de apparaten in de handel brengt, gedurende tien
      jaar na het in de handel brengen van de apparaten ter beschikking gehouden van Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0012915#Artikel7
    url: https://wetten.overheid.nl/BWBR0012915/2001-11-28#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0012915
        artikel: '7'
        hoofdstuk: '3'
  - number: '12'
    text: |-
      1 Degene die apparaten in de handel brengt neemt de informatie die nodig is voor een gebruik conform de bestemming
      van de apparaten op in de gebruiksaanwijzing die bij de apparaten is gevoegd.

      2 Indien apparaten niet voldoen aan de beschermingseisen ten aanzien van alle omgevingen die worden vermeld in
      de in [artikel 4, eerste of vierde lid][ref1], bedoelde normen, neemt degene die apparaten in de handel brengt,
      onverminderd het eerste lid, in de gebruiksaanwijzing informatie op over de beperkingen die voor het gebruik
      van dergelijke apparaten gelden, met dien verstande dat indien de toegepaste normen meerdere klassen apparaten
      onderscheiden in de gebruiksaanwijzing wordt aangegeven tot welke klasse de apparaten behoren.


      [ref1]: https://wetten.overheid.nl/BWBR0012915#Artikel4
    url: https://wetten.overheid.nl/BWBR0012915/2001-11-28#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0012915
        artikel: '4'
        hoofdstuk: '2'
  - number: '13'
    text: |-
      1 Onze Minister wijst een bevoegde instantie of een aangemelde instantie aan, indien deze:

      a. volledige rechtspersoonlijkheid bezit, en

      b. blijkens accreditatie aantoonbaar voldoet aan:

      I. de normen voor kwaliteitsborging voor het onderzoeken en testen van apparaten, respectievelijk van apparaten of
      systemen voor luchtverkeersafhandeling, ter zake van hun elektromagnetische compatibiliteit, welke normen in elk
      geval de in bijlage II bij de richtlijn neergelegde minimum-voorwaarden omvatten, met dien verstande dat in elk
      geval een wettelijke aansprakelijkheidsverzekering is afgesloten;

      II. de door de accreditatie-instelling aan de onder I bedoelde normen gegeven toepassing ten
      aanzien van het onderzoeken en testen van apparaten, respectievelijk van apparaten of systemen voor
      luchtverkeersafhandeling, overeenkomstig [artikel 7, eerste lid, onderdeel b][ref1], respectievelijk
      [artikel 7, eerste lid, onderdeel c][ref2].

      2 Onze Minister kan de aanwijzing beperken tot de daarin genoemde categorieën apparaten.


      [ref1]: https://wetten.overheid.nl/BWBR0012915#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0012915#Artikel7
    url: https://wetten.overheid.nl/BWBR0012915/2001-11-28#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0012915
        artikel: '7'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0012915
        artikel: '7'
        hoofdstuk: '3'
  - number: '14'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over de wijze waarop een aanvraag tot aanwijzing als bedoeld
      in [artikel 13][ref1] wordt ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0012915#Artikel13
    url: https://wetten.overheid.nl/BWBR0012915/2001-11-28#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0012915
        artikel: '13'
        hoofdstuk: '5'
  - number: '15'
    text: |-
      1 Indien uit controlemetingen blijkt dat een in de handel gebracht apparaat niet aan de beschermingseisen voldoet
      ondanks de aanwezigheid van de markering en van de EG-verklaring van overeenstemming, wordt hiervan schriftelijk
      mededeling gedaan aan de betrokkene.

      2 Onze Minister maakt dit daarna zo spoedig mogelijk bekend in de Staatscourant.

      3 Met ingang van de dag na de datum van bekendmaking is het verboden de apparaten van dit type te verhandelen.
    url: https://wetten.overheid.nl/BWBR0012915/2001-11-28#Artikel15
  - number: '16'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld inzake de behandeling van klachten over elektromagnetische
      storingen, ondervonden van het gebruik van apparaten.
    url: https://wetten.overheid.nl/BWBR0012915/2001-11-28#Artikel16
  - number: '18'
    text: |-
      1 Na de inwerkingtreding van dit besluit berust de Regeling storingsklachten op artikel 21 van het
      [Besluit randapparaten en radioapparaten][ref1] en op [artikel 16 van dit besluit](onbekend).

      2 Na de inwerkingtreding van dit besluit berust het Besluit vaststelling EMC-normen 1998 op artikel 4, eerste en
      derde lid, van het onderhavige besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0011261
    url: https://wetten.overheid.nl/BWBR0012915/2001-11-28#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0011261
  - number: '19'
    text: |-
      1 Na de inwerkingtreding van dit besluit wordt een erkenning door Onze Minister van een bevoegde instantie op grond
      van artikel 13 van het Besluit elektromagnetische compatibiliteit gelijkgesteld met een aanwijzing op grond van
      artikel 13, eerste lid, van dit besluit.

      2 De aanwijzing door Onze Minister van instanties op grond van artikel 10, zesde lid, van de richtlijn bij de
      Commissie van de Europese Gemeenschappen vóór de datum van inwerkingtreding van dit besluit, wordt gelijkgesteld
      met een aanwijzing op grond van artikel 13, eerste lid, van dit besluit.
    url: https://wetten.overheid.nl/BWBR0012915/2001-11-28#Artikel19
  - number: '20'
    text: |-
      Een wijziging van de richtlijn gaat voor de toepassing van het onderhavige besluit gelden met ingang van de dag
      waarop aan de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven, tenzij bij ministerieel besluit, dat in
      de Staatscourant wordt bekendgemaakt, een ander tijdstip wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0012915/2001-11-28#Artikel20
  - number: '21'
    text: Het Besluit elektromagnetische compatibiliteit wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0012915/2001-11-28#Artikel21
  - number: '22'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin zij zal
      worden geplaatst.
    url: https://wetten.overheid.nl/BWBR0012915/2001-11-28#Artikel22
  - number: '23'
    text: 'Dit besluit wordt aangehaald als: Besluit elektromagnetische compatibiliteit 2001.'
    url: https://wetten.overheid.nl/BWBR0012915/2001-11-28#Artikel23
