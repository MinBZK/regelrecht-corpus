preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Verkeer en Waterstaat van 6 juli 2007, nr. HDJZ/SCH/2007-895,
    Hoofddirectie Juridische Zaken;

    Gelet op richtlijn nr. 2005/44/EG van het Europees Parlement en de Raad van 7 september 2005 betreffende
    geharmoniseerde River Information Services (RIS) op de binnenwateren in de Gemeenschap (PbEU L 255), op richtlijn
    nr. 2002/59/EG van het Europees Parlement en de Raad van de Europese Unie van 27 juni 2002 betreffende de invoering
    van een communautair monitoring- en informatiesysteem voor de zeescheepvaart (PbEG L 208), op richtlijn nr.
    2001/106/EG van het Europees Parlement en de Raad van de Europese Unie van 19 december 2001 houdende wijziging
    van richtlijn 95/21/EG van de Raad betreffende de naleving, met betrekking tot de schepen die gebruikmaken van
    havens in de Gemeenschap en varen in de onder de jurisdictie van de lidstaten vallende wateren, van internationale
    normen op het gebied van de veiligheid van schepen, voorkoming van verontreiniging en leef- en werkomstandigheden
    aan boord (havenstaatcontrole) (PbEG 2002, L19) en op artikel 4, eerste lid, onderdeel e, derde, vierde, zesde en
    zevende lid, van de Scheepvaartverkeerswet;

    De Raad van State gehoord (advies van 30 juli 2007, nr.W09.07.0201/IV);

    Gezien het nader rapport van de Staatssecretaris van Verkeer en Waterstaat van 26 september 2007, nr.HDJZ/SCH/2007-
    1234, Hoofddirectie Juridische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0022612/2009-08-26#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder: - *applicatie-service provider:*
      service provider, die de van een meldplichtig zeeschip ontvangen meldplichtige gegevens doorzendt naar het LRIT-
      datacentrum;
        - *bevoegde autoriteit:* 1°. voor de wateren in beheer bij het Rijk: de personen die als zodanig zijn aangewezen
      door Onze Minister; 2°. voor de wateren in beheer bij een ander openbaar lichaam: het bestuur van dat openbaar
      lichaam, dan wel de personen die als zodanig door het bestuur zijn aangewezen;
        - *locatiegegevens:* gegevens die worden verwerkt in RIS en waarmee de geografische positie van de randapparatuur
      van een RIS-gebruiker wordt aangegeven;
        - *LRIT:* long range identification and tracking systeem, als bedoeld in Hoofdstuk V, Voorschrift 19-1, onderdeel
      4.1, van het SOLAS-verdrag;
        - *LRIT-datacentrum:* datacentrum waarin meldplichtige gegevens worden opgeslagen;
        - *meldplichtig zeeschip:* een zeeschip als bedoeld in Hoofdstuk V, Voorschrift 19-1, onderdeel 2.1, in
      overeenstemming met de onderdelen 4.1, 4.2 en 7, van het SOLAS-verdrag, waar ter wereld dat zich ook bevindt, en
      dat op grond van de voor Nederland geldende rechtsregels gerechtigd is de vlag van het Koninkrijk der Nederlanden
      te voeren;
        - *meldplichtige gegevens:* de gegevens, bedoeld in Hoofdstuk V, Voorschrift 19-1, onderdeel 5, van het SOLAS-
      verdrag;
        - *richtlijn monitoring- en informatiesysteem zeescheepvaart:* richtlijn nr. 2002/59/EG van het Europees Parlement
      en de Raad van de Europese Unie van 27 juni 2002 betreffende de invoering van een communautair monitoring- en
      informatiesysteem voor de zeescheepvaart (PbEG L 208);
        - *richtlijn River Information Services:* richtlijn nr. 2005/44/EG van het Europees Parlement en de Raad van
      7 september 2005 betreffende geharmoniseerde River Information Services (RIS) op de binnenwateren in de Gemeenschap
      (PbEU L 255);
        - *RIS:* River Information Services als bedoeld in [artikel 1 van de Scheepvaartverkeerswet][ref1];
        - *RIS-centrum:* de plaats waar RIS wordt beheerd;
        - *RIS-gebruikers:* alle gebruikers van RIS, waaronder in elk geval worden begrepen degene die het schip
      of een ander vaartuig voert dan wel verkeersdeelnemer is, RIS-operatoren, bevoegde autoriteiten, haven-
      en terminalexploitanten, operatoren van calamiteitencentra, vlootbeheerders, scheepsagenten, verladers en
      tussenpersonen op het gebied van vervoer;
        - *RIS-toepassing:* het verlenen van RIS via specifieke systemen;
        - *toestemming van een RIS-gebruiker:* toestemming van een betrokkene als bedoeld in
      [artikel 1, onder i, van de Wet bescherming persoonsgegevens][ref2], met dien verstande dat de toestemming mede
      betrekking kan hebben op gegevens van RIS-gebruikers die geen natuurlijke personen zijn;
        - *SOLAS-verdrag:* het op 1 november 1974 te Londen tot stand gekomen Verdrag voor de beveiliging van mensenlevens
      op zee (Trb. 1976, 157), en de bij dat verdrag behorende bindende protocollen, aanhangsels en bijlagen;
        - *verkeersgegevens:* gegevens die worden verwerkt voor het uitwisselen of overbrengen van informatie tussen RIS-
      gebruikers.


      [ref1]: https://wetten.overheid.nl/BWBR0004364#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0011468#Artikel1
    url: https://wetten.overheid.nl/BWBR0022612/2009-08-26#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004364
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0011468
        artikel: '1'
  - number: '2.1'
    text: |-
      Indien aan een bevoegde autoriteit gegevens meegedeeld worden als bedoeld in de artikelen 4 en 13 van de richtlijn
      monitoring- en informatiesysteem zeescheepvaart, meldt zij dit onverwijld aan de zich bij de European Maritime
      Safety Agency bevindende indexserver. Bij de melding worden de bij ministeriële regeling aangeduide gegevens
      verstrekt, op een bij die regeling aangegeven wijze.
    url: https://wetten.overheid.nl/BWBR0022612/2009-08-26#Artikel2
  - number: '2.2'
    text: |-
      De bevoegde autoriteit verstrekt de gegevens die door middel van een in het eerste lid bedoelde melding zijn
      verkregen, op een bij ministeriële regeling aangegeven wijze aan een bevoegde instantie als bedoeld in artikel
      3, onderdeel k, van de richtlijn monitoring- en informatiesysteem zeescheepvaart, van een andere lidstaat van de
      Europese Unie, indien deze daarom verzoekt.
    url: https://wetten.overheid.nl/BWBR0022612/2009-08-26#Artikel2
  - number: '2.3'
    text: |-
      De bevoegde autoriteit bewaart de door middel van een in het eerste lid bedoelde melding verkregen gegevens
      gedurende een termijn van ten minste dertig dagen gerekend vanaf het moment van ontvangst.
    url: https://wetten.overheid.nl/BWBR0022612/2009-08-26#Artikel2
  - number: '3.1'
    text: |-
      Het Nederlands Kustwachtcentrum deelt bij hem bekende relevante informatie met betrekking tot in artikel 16, eerste
      lid, van de richtlijn monitoring- en informatiesysteem zeescheepvaart, bedoelde schepen onverwijld, op een bij
      ministeriële regeling aangegeven wijze, mede aan de betrokken kuststations, bedoeld in artikel 3, onderdeel n, van
      de richtlijn monitoring- en informatiesysteem zeescheepvaart, van de overige lidstaten van de Europese Unie langs
      de door het zeeschip te volgen route.
    url: https://wetten.overheid.nl/BWBR0022612/2009-08-26#Artikel3
  - number: '3.2'
    text: |-
      Het Nederlands Kustwachtcentrum verstrekt de in artikel 17 van de richtlijn monitoring- en informatiesysteem
      zeescheepvaart, bedoelde informatie, op een bij ministeriële regeling aangegeven wijze aan een bevoegde instantie
      als bedoeld in artikel 3, onderdeel k, van de richtlijn monitoring- en informatiesysteem zeescheepvaart, van een
      andere lidstaat van de Europese Unie, die daar uit veiligheidsoverwegingen om verzoekt.
    url: https://wetten.overheid.nl/BWBR0022612/2009-08-26#Artikel3
  - number: '4'
    text: 'Het Nederlands Kustwachtcentrum maakt door middel van een radiobericht in het betrokken zeegebied openbaar:'
    url: https://wetten.overheid.nl/BWBR0022612/2009-08-26#Artikel4
  - number: 4.a
    text: |-
      een aan hem gemeld incident of ongeval op zee als bedoeld in artikel 17, eerste lid, van de richtlijn monitoring-
      en informatiesysteem zeescheepvaart, met een zeeschip;
    url: https://wetten.overheid.nl/BWBR0022612/2009-08-26#Artikel4
  - number: 4.b
    text: |-
      een aan hem bekende aanwezigheid van zeeschepen die een bedreiging vormen voor de veiligheid op zee, de veiligheid
      van personen of het mariene milieu.
    url: https://wetten.overheid.nl/BWBR0022612/2009-08-26#Artikel4
  - number: '5'
    text: |-
      De exploitant van een zeeschip die door de kapitein van dat schip op de hoogte is gesteld van een incident
      of ongeval met dat schip op zee als bedoeld in artikel 17, eerste lid, van de richtlijn monitoring- en
      informatiesysteem zeescheepvaart, neemt onmiddellijk contact op met het Nederlands Kustwachtcentrum en houdt zich
      voor zover nodig ter beschikking van dit centrum.
    url: https://wetten.overheid.nl/BWBR0022612/2009-08-26#Artikel5
  - number: '6'
    text: 'Dit hoofdstuk is niet van toepassing met betrekking tot gegevens verkregen van:'
    url: https://wetten.overheid.nl/BWBR0022612/2009-08-26#Artikel6
  - number: 6.a
    text: |-
      een oorlogsschip, een ander marineschip, of een ander schip in eigendom of in dienst van de overheid, dat voor
      niet-commerciële doeleinden wordt gebruikt;
    url: https://wetten.overheid.nl/BWBR0022612/2009-08-26#Artikel6
  - number: 6.b
    text: |-
      een historisch schip of een replica daarvan, met inbegrip van een schip dat ontworpen is om traditionele
      vaardigheden en zeemanschap aan te moedigen en te bevorderen, dat als levend cultuurmonument volgens de
      traditionele beginselen van zeemanschap en techniek wordt bestuurd;
    url: https://wetten.overheid.nl/BWBR0022612/2009-08-26#Artikel6
  - number: 6.c
    text: een vissersschip;
    url: https://wetten.overheid.nl/BWBR0022612/2009-08-26#Artikel6
  - number: 6.d
    text: een pleziervaartuig met een lengte van minder dan 45 meter.
    url: https://wetten.overheid.nl/BWBR0022612/2009-08-26#Artikel6
  - number: '7'
    text: |-
      Onze Minister draagt, met inachtneming van artikelen 3, onderdelen d en h, 4, eerste lid, tweede lid, derde lid,
      onderdelen a, b, c, eerste volzin, en d, vierde en vijfde lid, en de daarbij behorende bijlagen en artikel 9,
      tweede lid, van de richtlijn River Information Services, zorg voor RIS-toepassing op de in de bijlage bij dit
      besluit genoemde scheepvaartwegen.
    url: https://wetten.overheid.nl/BWBR0022612/2009-08-26#Artikel7
  - number: '8'
    text: |-
      De bij of krachtens verdrag of bij of krachtens [artikel 4 van de Scheepvaartverkeerswet][ref1] vastgestelde
      algemene maatregel van bestuur gemelde gegevens van een schip dat een grens met een naburige lidstaat zal
      overschrijden, worden, voordat dat schip de grens met die naburige lidstaat bereikt, door de bevoegde autoriteit
      van het laatste RIS-centrum in Nederland op de route van dat schip, doorgezonden aan de bevoegde autoriteit van het
      eerste RIS-centrum in die naburige lidstaat op de route van dat schip.


      [ref1]: https://wetten.overheid.nl/BWBR0004364#Artikel4
    url: https://wetten.overheid.nl/BWBR0022612/2009-08-26#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004364
        artikel: '4'
  - number: '9'
    text: |-
      Onverminderd de [Wet bescherming persoonsgegevens][ref1] en de artikelen van deze paragraaf, draagt de bevoegde
      autoriteit zorg voor de bescherming van persoonsgegevens en de bescherming van de persoonlijke levenssfeer van
      RIS-gebruikers.


      [ref1]: https://wetten.overheid.nl/BWBR0011468
    url: https://wetten.overheid.nl/BWBR0022612/2009-08-26#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0011468
  - number: '10.1'
    text: |-
      De bevoegde autoriteit treft in het belang van de bescherming van persoonsgegevens en de bescherming van de
      persoonlijke levenssfeer van RIS-gebruikers passende technische en organisatorische maatregelen ten behoeve van de
      veiligheid en beveiliging van de aangeboden diensten. De maatregelen garanderen, rekening houdend met de stand van
      de techniek en de kosten van de tenuitvoerlegging, een passend beveiligingsniveau dat in verhouding staat tot het
      desbetreffende risico.
    url: https://wetten.overheid.nl/BWBR0022612/2009-08-26#Artikel10
  - number: '10.2'
    text: 'De bevoegde autoriteit draagt er zorg voor dat RIS-gebruikers worden geïnformeerd over:'
    url: https://wetten.overheid.nl/BWBR0022612/2009-08-26#Artikel10
  - number: 10.2.a
    text: |-
      de bijzondere risico’s voor de doorbreking van de veiligheid of de beveiliging van RIS de daarbij aangeboden
      diensten;
    url: https://wetten.overheid.nl/BWBR0022612/2009-08-26#Artikel10
  - number: 10.2.b
    text: |-
      de eventuele middelen waarmee de onder a bedoelde risico’s kunnen worden tegengegaan, voor zover het andere
      maatregelen betreft dan die welke de bevoegde autoriteit op grond van het eerste lid gehouden is te treffen,
      alsmede een indicatie van de te verwachten kosten.
    url: https://wetten.overheid.nl/BWBR0022612/2009-08-26#Artikel10
  - number: '11.1'
    text: |-
      De verwerking van locatiegegevens ten behoeve van de levering van een RIS-dienst, niet zijnde verkeersgegevens,
      betreffende RIS-gebruikers, is slechts geoorloofd, indien:
    url: https://wetten.overheid.nl/BWBR0022612/2009-08-26#Artikel11
  - number: 11.1.a
    text: deze gegevens zijn geanonimiseerd, of
    url: https://wetten.overheid.nl/BWBR0022612/2009-08-26#Artikel11
  - number: 11.1.b
    text: de desbetreffende RIS-gebruiker voor de verwerking van deze gegevens toestemming heeft gegeven.
    url: https://wetten.overheid.nl/BWBR0022612/2009-08-26#Artikel11
  - number: '11.2'
    text: |-
      Voorafgaand aan het verkrijgen van toestemming als bedoeld in het eerste lid, onderdeel b, verstrekt de bevoegde
      autoriteit de volgende informatie:
    url: https://wetten.overheid.nl/BWBR0022612/2009-08-26#Artikel11
  - number: 11.2.a
    text: de soort locatiegegevens die zullen worden verwerkt;
    url: https://wetten.overheid.nl/BWBR0022612/2009-08-26#Artikel11
  - number: 11.2.b
    text: de doeleinden waarvoor de locatiegegevens worden verwerkt;
    url: https://wetten.overheid.nl/BWBR0022612/2009-08-26#Artikel11
  - number: 11.2.c
    text: de duur van de verwerking, en
    url: https://wetten.overheid.nl/BWBR0022612/2009-08-26#Artikel11
  - number: 11.2.d
    text: of de gegevens aan een derde zullen worden verstrekt ten behoeve van de levering van de betreffende RIS-dienst.
    url: https://wetten.overheid.nl/BWBR0022612/2009-08-26#Artikel11
  - number: '11.3'
    text: |-
      De verwerking van de gegevens ten behoeve van de levering van een RIS-dienst als bedoeld in het eerste lid is
      slechts toegestaan voor zover en voor zolang dat noodzakelijk is voor de levering van de betreffende RIS-dienst.
    url: https://wetten.overheid.nl/BWBR0022612/2009-08-26#Artikel11
  - number: '11.4'
    text: |-
      Een RIS-gebruiker kan de verleende toestemming voor de verwerking van de hem betreffende gegevens, op elk moment
      intrekken.
    url: https://wetten.overheid.nl/BWBR0022612/2009-08-26#Artikel11
  - number: '11.5'
    text: |-
      De bevoegde autoriteit biedt de RIS-gebruiker wiens gegevens worden verwerkt, de mogelijkheid om kosteloos en op
      eenvoudige wijze de verwerking van diens gegevens tijdelijk te beletten.
    url: https://wetten.overheid.nl/BWBR0022612/2009-08-26#Artikel11
  - number: '11.6'
    text: |-
      De verwerking van de gegevens mag slechts plaatsvinden door personen die werkzaam zijn onder het gezag van
      de bevoegde autoriteit of de derde, bedoeld in het tweede lid, onder d, en is beperkt tot die gegevens die
      noodzakelijk zijn om de RIS-dienst te kunnen aanbieden.
    url: https://wetten.overheid.nl/BWBR0022612/2009-08-26#Artikel11
  - number: '12.1'
    text: 'De bevoegde autoriteit geeft slechts inzage in RIS-gegevens of verstrekt deze aan:'
    url: https://wetten.overheid.nl/BWBR0022612/2009-08-26#Artikel12
  - number: 12.1.a
    text: |-
      ambtenaren die als toezichthouder belast zijn met het toezicht op de naleving van de
      [Wet bescherming persoonsgegevens][ref1] en de [Scheepvaartverkeerswet][ref2] voor zover gericht naar gegevens
      wordt gevraagd;


      [ref1]: https://wetten.overheid.nl/BWBR0011468
      [ref2]: https://wetten.overheid.nl/BWBR0004364
    url: https://wetten.overheid.nl/BWBR0022612/2009-08-26#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0011468
      - id: ref2
        bwb_id: BWBR0004364
  - number: 12.1.b
    text: |-
      ambtenaren die belast zijn met de opsporing van strafbare feiten bij of krachtens in
      [artikel 141 van het Wetboek van Strafvordering][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0022612/2009-08-26#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
  - number: 12.1.c
    text: ambtenaren aangesteld voor de uitvoering van de politietaak;
    url: https://wetten.overheid.nl/BWBR0022612/2009-08-26#Artikel12
  - number: 12.1.d
    text: |-
      een verzekeraar als bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref1] indien deze verzekeraar
      aannemelijk maakt gegevens nodig te hebben voor het behartigen van de belangen van een RIS-gebruiker die bij hem
      verzekerd is en nadat deze verzekerde daarvoor toestemming heeft verleend;


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0022612/2009-08-26#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
  - number: 12.1.e
    text: |-
      een advocaat indien deze aannemelijk maakt de gegevens nodig te hebben voor het behartigen van de belangen van een
      RIS-gebruiker die zijn cliënt is, en
    url: https://wetten.overheid.nl/BWBR0022612/2009-08-26#Artikel12
  - number: 12.1.f
    text: |-
      het Centraal Bureau voor de Statistiek, voor zover hiervoor bij of krachtens een wettelijke voorschrift een
      verplichting bestaat.
    url: https://wetten.overheid.nl/BWBR0022612/2009-08-26#Artikel12
  - number: '12.2'
    text: Een verzoek om inzage of verstrekking van gegevens wordt schriftelijk ingediend.
    url: https://wetten.overheid.nl/BWBR0022612/2009-08-26#Artikel12
  - number: '12.3'
    text: Aan de inzage of verstrekking kan de bevoegde autoriteit voorwaarden verbinden.
    url: https://wetten.overheid.nl/BWBR0022612/2009-08-26#Artikel12
  - number: '12.4'
    text: |-
      Bij het ter inzage geven of verstrekken van persoonsgegevens worden gegevens van andere personen voor zover
      mogelijk anoniem gemaakt.
    url: https://wetten.overheid.nl/BWBR0022612/2009-08-26#Artikel12
  - number: '12.5'
    text: 'Na inzage of verstrekking van gegevens wordt schriftelijk vastgelegd:'
    url: https://wetten.overheid.nl/BWBR0022612/2009-08-26#Artikel12
  - number: 12.5.a
    text: de naam van de RIS-gebruiker waarop de gegevens betrekking hebben;
    url: https://wetten.overheid.nl/BWBR0022612/2009-08-26#Artikel12
  - number: 12.5.b
    text: de wijze van inzage of verstrekking;
    url: https://wetten.overheid.nl/BWBR0022612/2009-08-26#Artikel12
  - number: 12.5.c
    text: het tijdstip;
    url: https://wetten.overheid.nl/BWBR0022612/2009-08-26#Artikel12
  - number: 12.5.d
    text: welke gegevens het betrof, en
    url: https://wetten.overheid.nl/BWBR0022612/2009-08-26#Artikel12
  - number: 12.5.e
    text: naam en adres van de verzoeker.
    url: https://wetten.overheid.nl/BWBR0022612/2009-08-26#Artikel12
  - number: 12a.1
    text: 'Onze Minister wijst bij besluit aan:'
    url: https://wetten.overheid.nl/BWBR0022612/2009-08-26#Artikel12a
  - number: 12a.1.a
    text: een LRIT-datacentrum;
    url: https://wetten.overheid.nl/BWBR0022612/2009-08-26#Artikel12a
  - number: 12a.1.b
    text: één of meerdere applicatie-service providers;
    url: https://wetten.overheid.nl/BWBR0022612/2009-08-26#Artikel12a
  - number: 12a.1.c
    text: de organisatie of persoon die bevoegd is meldplichtige gegevens bij het LRIT-datacentrum op te vragen;
    url: https://wetten.overheid.nl/BWBR0022612/2009-08-26#Artikel12a
  - number: 12a.1.d
    text: |-
      de organisatie of persoon die bevoegd is aan te geven met welke intervallen meldplichtige gegevens door middel van
      het LRIT worden verzonden;
    url: https://wetten.overheid.nl/BWBR0022612/2009-08-26#Artikel12a
  - number: 12a.1.e
    text: de organisatie of persoon aan wie wordt gemeld dat het LRIT is uitgeschakeld.
    url: https://wetten.overheid.nl/BWBR0022612/2009-08-26#Artikel12a
  - number: 12a.2
    text: Aan een aanwijzing kunnen voorwaarden worden verbonden.
    url: https://wetten.overheid.nl/BWBR0022612/2009-08-26#Artikel12a
  - number: 12a.3
    text: Een besluit als bedoeld in het eerste lid wordt gepubliceerd in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0022612/2009-08-26#Artikel12a
  - number: 12b.1
    text: |-
      De kapitein van een meldplichtig zeeschip meldt door middel van het LRIT de meldplichtige gegevens via een
      aangewezen applicatie-service provider aan het aangewezen LRIT-datacentrum.
    url: https://wetten.overheid.nl/BWBR0022612/2009-08-26#Artikel12b
  - number: 12b.2
    text: |-
      De melding bedoeld in het eerste lid, geschiedt met de intervallen zoals bepaald door de organisatie of persoon die
      daartoe op grond van [artikel 12a, eerste lid, onderdeel d][ref1], is aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0022612#Artikel12a
    url: https://wetten.overheid.nl/BWBR0022612/2009-08-26#Artikel12b
    references:
      - id: ref1
        bwb_id: BWBR0022612
        artikel: 12a
        hoofdstuk: '4'
  - number: 12b.3
    text: |-
      Wanneer het LRIT overeenkomstig het bepaalde in Hoofdstuk V, Voorschrift 19-1, onderdeel 7, van het SOLAS-verdrag
      is uitgeschakeld, meldt de kapitein dit aan de op grond van [artikel 12a, eerste lid, onderdeel e][ref1], daartoe
      aangewezen organisatie of persoon, en maakt hij daarvan een aantekening in het document bedoeld in Hoofdstuk V,
      Voorschrift 28, van het SOLAS-verdrag, waarbij hij aangeeft waarom en hoe lang het LRIT werd uitgeschakeld. De
      melding kan mede geschieden door de eigenaar, de rompbevrachter, de agent, en verder door een ieder die zeggenschap
      heeft over het gebruik van het desbetreffend meldplichtig zeeschip.


      [ref1]: https://wetten.overheid.nl/BWBR0022612#Artikel12a
    url: https://wetten.overheid.nl/BWBR0022612/2009-08-26#Artikel12b
    references:
      - id: ref1
        bwb_id: BWBR0022612
        artikel: 12a
        hoofdstuk: '4'
  - number: 12b.4
    text: |-
      Wanneer een van de in het derde lid genoemde personen aan de daar genoemde meldplicht van de kapitein heeft
      voldaan, is de kapitein daarvan ontslagen.
    url: https://wetten.overheid.nl/BWBR0022612/2009-08-26#Artikel12b
  - number: 12c.1
    text: |-
      De op grond van [artikel 12a, eerste lid, onderdeel c][ref1], aangewezen organisatie of persoon, vraagt gegevens op
      bij het LRIT-datacentrum in overeenstemming met het bepaalde in Hoofdstuk V, Voorschrift 19-1, onderdeel 8.1, van
      het SOLAS-verdrag.


      [ref1]: https://wetten.overheid.nl/BWBR0022612#Artikel12a
    url: https://wetten.overheid.nl/BWBR0022612/2009-08-26#Artikel12c
    references:
      - id: ref1
        bwb_id: BWBR0022612
        artikel: 12a
        hoofdstuk: '4'
  - number: 12c.2
    text: |-
      Een op grond van het eerste lid aangewezen organisatie die een *Search and Rescue dienst* is, kan, voor zover dat
      voor een goede uitvoering van de reddingstaak noodzakelijk is, bij het LRIT-datacentrum gegevens met betrekking tot
      ieder zeeschip opvragen, waar ter wereld dat zich ook bevindt.
    url: https://wetten.overheid.nl/BWBR0022612/2009-08-26#Artikel12c
  - number: '13'
    text: |-
      Een wijziging van de richtlijn monitoring- en informatiesysteem zeescheepvaart of van de richtlijn River
      Information Services of de daarbij behorende bijlagen gaat voor de toepassing van dit besluit of voor de hierop
      berustende bepalingen gelden met ingang van de dag waarop aan de betrokken wijzigingsrichtlijn dan wel de
      gewijzigde bijlagen uitvoering moet zijn gegeven, tenzij bij ministerieel besluit, dat in de Staatscourant wordt
      bekend gemaakt, een ander tijdstip wordt vastgesteld. Wijzigingen van artikel 9, eerste lid, van de richtlijn River
      Information Services zijn hiervan uitgezonderd.
    url: https://wetten.overheid.nl/BWBR0022612/2009-08-26#Artikel13
  - number: 14a
    text: |-
      Overtreding van de [artikelen 5][ref1], [12b, eerste tot en met derde lid][ref2], of [12c, eerste lid][ref3], is
      een strafbaar feit.


      [ref1]: https://wetten.overheid.nl/BWBR0022612#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0022612#Artikel12b
      [ref3]: https://wetten.overheid.nl/BWBR0022612#Artikel12c
    url: https://wetten.overheid.nl/BWBR0022612/2009-08-26#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0022612
        artikel: '5'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0022612
        artikel: 12b
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0022612
        artikel: 12c
        hoofdstuk: '4'
  - number: '15'
    text: |-
      Het [Besluit gegevens scheepvaart][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0017874
    url: https://wetten.overheid.nl/BWBR0022612/2009-08-26#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0017874
  - number: '16'
    text: Dit besluit treedt in werking met ingang van 20 oktober 2007.
    url: https://wetten.overheid.nl/BWBR0022612/2009-08-26#Artikel16
  - number: '17'
    text: 'Dit besluit wordt aangehaald als: Besluit gegevens scheepvaart 2007.'
    url: https://wetten.overheid.nl/BWBR0022612/2009-08-26#Artikel17
