preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Landbouw en Visserij van 22 maart 1982, No. J. 1565, Directie Juridische en
    Bedrijfsorganisatorische Zaken;

    Gelet op de artikelen 29, eerste lid, 30, eerste lid, onder b en d, en tweede lid, 32, derde lid en artikel 34, van
    de Wet agrarisch grondverkeer (Stb. 1981, 248);

    De Raad van State gehoord (advies van 27 april 1982, No. 2163/21/8216);

    Gezien het nader rapport van Onze Minister van Landbouw en Visserij van 7 juli 1982, No. J 2446, Directie
    Juridische en Bedrijfsorganisatorische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0003507/2012-12-07#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt onder wet de [Wet agrarisch grondverkeer][ref1] (*Stb.* 1981, 248) verstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0003386
    url: https://wetten.overheid.nl/BWBR0003507/2012-12-07#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003386
  - number: '2'
    text: |-
      Als ministers bedoeld in de [artikelen 29, eerste lid][ref1], [32, derde lid][ref2], en [34, van de wet][ref3],
      worden aangewezen:

      a. Onze Minister van Defensie;

      b. Onze Minister van Infrastructuur en Milieu;

      c. Onze Minister van Onderwijs, Cultuur en Wetenschap.


      [ref1]: https://wetten.overheid.nl/BWBR0003386#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0003386#Artikel32
      [ref3]: https://wetten.overheid.nl/BWBR0003386#Artikel34
    url: https://wetten.overheid.nl/BWBR0003507/2012-12-07#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003386
        artikel: '29'
      - id: ref2
        bwb_id: BWBR0003386
        artikel: '32'
      - id: ref3
        bwb_id: BWBR0003386
        artikel: '34'
  - number: '3'
    text: |-
      Als ministers bedoeld in [artikel 30, eerste lid, onder b en d, en tweede lid, van de wet][ref1], worden
      aangewezen:

      a. Onze Minister van Financiën;

      b. Onze Minister van Defensie;

      c. Onze Minister van Infrastructuur en Milieu;

      d. Onze Minister van Onderwijs, Cultuur en Wetenschap.


      [ref1]: https://wetten.overheid.nl/BWBR0003386#Artikel30
    url: https://wetten.overheid.nl/BWBR0003507/2012-12-07#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003386
        artikel: '30'
  - number: '4'
    text: |-
      Dit besluit treedt in werking met ingang van de tweede dag na de datum van uitgifte van het *Staatsblad* waarin het
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0003507/2012-12-07#Artikel4
