preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Landbouw en Visserij van 22 maart 1982, No. J. 1565, Directie Juridische en
    Bedrijfsorganisatorische Zaken;

    Gelet op de artikelen 29, eerste lid, 30, eerste lid, onder b en d, en tweede lid, 32, derde lid en artikel 34, van
    de Wet agrarisch grondverkeer (Stb. 1981, 248);

    De Raad van State gehoord (advies van 27 april 1982, No. 2163/21/8216);

    Gezien het nader rapport van Onze Minister van Landbouw en Visserij van 7 juli 1982, No. J 2446, Directie
    Juridische en Bedrijfsorganisatorische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0003507/1982-08-28#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt onder wet de [Wet agrarisch grondverkeer][ref1] (*Stb.* 1981, 248) verstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0003386
    url: https://wetten.overheid.nl/BWBR0003507/1982-08-28#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003386
  - number: '2'
    text: |-
      Als ministers bedoeld in de artikelen 29, eerste lid, 32, derde lid, en 34, van de wet, worden aangewezen:

      a. Onze Minister van Defensie;

      b. Onze Minister van Volkshuisvesting en Ruimtelijke Ordening;

      c. Onze Minister van Cultuur, Recreatie en Maatschappelijk Werk.
    url: https://wetten.overheid.nl/BWBR0003507/1982-08-28#Artikel2
  - number: '3'
    text: |-
      Als ministers bedoeld in artikel 30, eerste lid, onder *b* en *d*, en tweede lid, van de wet, worden aangewezen:

      a. Onze Minister van Financiën;

      b. Onze Minister van Defensie;

      c. Onze Minister van Volkshuisvesting en Ruimtelijke Ordening;

      d. Onze Minister van Verkeer en Waterstaat;

      e. Onze Minister van Cultuur, Recreatie en Maatschappelijk Werk.
    url: https://wetten.overheid.nl/BWBR0003507/1982-08-28#Artikel3
  - number: '4'
    text: |-
      Dit besluit treedt in werking met ingang van de tweede dag na de datum van uitgifte van het *Staatsblad* waarin het
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0003507/1982-08-28#Artikel4
