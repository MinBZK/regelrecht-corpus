        artikel: '32'
  - number: XVI.2
    text: |-
      Het oude recht blijft van toepassing op het aangebracht houden van bouwstoffen, grond of baggerspecie die voor de
      inwerkingtreding van de [artikelen I][ref1] en [VII][ref2] van dit besluit zijn aangebracht of die met toepassing
      van in dit artikel opgenomen overgangsrecht na de inwerkingtreding van de artikelen I en VII van dit besluit zijn
      aangebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0044911#ArtikelI
      [ref2]: https://wetten.overheid.nl/BWBR0044911#ArtikelVII
    url: https://wetten.overheid.nl/BWBR0044911/2024-01-01#ArtikelXVI
    references:
      - id: ref1
        bwb_id: BWBR0044911
        artikel: I
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0044911
        artikel: VII
        hoofdstuk: '2'
  - number: XVI.3
    text: |-
      Als voor de inwerkingtreding van de [artikelen I][ref1] en [VII][ref2] van dit besluit, een melding is
      gedaan op grond van [artikel 42, eerste lid, van het Besluit bodemkwaliteit][ref3] voor het toepassen
      van grond of baggerspecie voor het verondiepen en dempen van een oppervlaktewaterlichaam, bedoeld in
      [artikel 35, eerste lid, onder d, van het Besluit bodemkwaliteit][ref4], blijft, als het een diepe plas betreft
      die is ontstaan als gevolg van zandwinning, grindwinning of kleiwinning of een dijkdoorbraak, op het toepassen van
      grond of baggerspecie in de diepe plas het oude recht van toepassing tot drie jaar na de inwerkingtreding van de
      artikelen I en VII van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0044911#ArtikelI
      [ref2]: https://wetten.overheid.nl/BWBR0044911#ArtikelVII
      [ref3]: https://wetten.overheid.nl/BWBR0022929#Artikel42
      [ref4]: https://wetten.overheid.nl/BWBR0022929#Artikel35
    url: https://wetten.overheid.nl/BWBR0044911/2024-01-01#ArtikelXVI
    references:
      - id: ref1
