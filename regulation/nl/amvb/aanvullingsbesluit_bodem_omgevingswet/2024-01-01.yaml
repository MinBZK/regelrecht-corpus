  - number: XV.1
    text: |-
      Een melding als bedoeld in [artikel 28 van de Wet bodembescherming][ref1], die voor de inwerkingtreding van dit
      besluit is gedaan, als op de activiteit in die melding na de inwerkingtreding van dit besluit een verbodsbepaling
      als bedoeld in [artikel 4.4, eerste lid, van de Omgevingswet][ref2] van toepassing is, geldt als een melding van
      die activiteit als bedoeld in [paragraaf 4.120 van het Besluit activiteiten leefomgeving][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0041330#Paragraaf4.120
