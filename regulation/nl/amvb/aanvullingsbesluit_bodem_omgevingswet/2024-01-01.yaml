        artikel: VII
        hoofdstuk: '2'
  - number: XVI.6
    text: |-
      Een omgevingsvergunning van rechtswege als bedoeld in [artikel 4.14 van de Invoeringswet Omgevingswet][ref1] voor
      een lozingsactiviteit die bestaat uit het opvullen van een diepe plas voor het bevorderen van de natuurwaarde of
      recreatieve waarde van de diepe plas, het ontwikkelen tot landbodem voor het verwezenlijken van bedrijventerreinen,
      woningbouwlocaties, landbouwgronden, natuurgronden of recreatieterreinen of het stabiliseren van wanden, bedoeld
      in [artikel 3.48p van het Besluit activiteiten leefomgeving][ref2], zoals dat luidt na inwerkingtreding van
      [artikel I][ref3] van dit besluit, geldt voor een termijn van drie jaar na de inwerkingtreding van artikel I van
      dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0041330#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0044911#ArtikelI
    url: https://wetten.overheid.nl/BWBR0044911/2024-01-01#ArtikelXVI
