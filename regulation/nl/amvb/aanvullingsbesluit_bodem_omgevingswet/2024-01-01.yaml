  - number: XVI.7
    text: |-
      Een melding die is gedaan voor het tijdelijk opslaan of toepassen van grond of baggerspecie op grond van
      [artikel 42, eerste lid, van het Besluit bodemkwaliteit][ref1], zoals dat luidde voor de inwerkingtreding
      van [artikel VII][ref2], geldt als een melding op grond van [artikel 4.1248, eerste lid][ref3], of
      [artikel 4.1266, eerste lid, van het Besluit activiteiten leefomgeving][ref4] zoals dat luidt na inwerkingtreding
      van [artikel I][ref5] van dit besluit.


