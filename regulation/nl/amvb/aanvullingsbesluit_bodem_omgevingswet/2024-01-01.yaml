        artikel: '35'
  - number: XVI.4
    text: |-
      Baggerspecie uit een watergang mag tot twee jaar na de inwerkingtreding van de [artikelen I][ref1] en [VII][ref2]
      van dit besluit ook over de aan de watergang grenzende percelen worden verspreid als wordt voldaan aan het oude
      recht.


      [ref1]: https://wetten.overheid.nl/BWBR0044911#ArtikelI
      [ref2]: https://wetten.overheid.nl/BWBR0044911#ArtikelVII
    url: https://wetten.overheid.nl/BWBR0044911/2024-01-01#ArtikelXVI
    references:
