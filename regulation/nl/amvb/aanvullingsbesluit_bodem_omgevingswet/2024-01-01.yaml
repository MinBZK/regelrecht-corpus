preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Infrastructuur en Waterstaat van 6 april 2020, nr. IENW/BSK-
    2020/49546, Hoofddirectie Bestuurlijke en Juridische Zaken, gedaan mede namens Onze Minister van Binnenlandse Zaken
    en Koninkrijksrelaties en Onze Minister van Landbouw, Natuur en Voedselkwaliteit;

    Gelet op de kaderrichtlijn afvalstoffen, de kaderrichtlijn water, de nitraatrichtlijn, de nec-richtlijn, Richtlijn
    nr. 86/278/EEG van de Raad van de Europese Gemeenschappen van 12 juni 1986, betreffende de bescherming van het
    milieu, in het bijzonder de bodem, bij het gebruik van zuiveringsslib in de landbouw (PbEG 1986, L 278), de
    artikelen 2.24, eerste lid, 4.3, eerste en tweede lid, 5.1, eerste en tweede lid, 5.11, eerste lid, 5.18, eerste
    lid, 5.26, 5.34, tweede lid, 16.43, eerste en vierde lid, 18.2, vierde en zesde lid, 19.0, 20.10, eerste en tweede
    lid, en 22.2, eerste lid, van de Omgevingswet, artikel 3.6 van de Aanvullingswet bodem, de artikelen 4 en 5 van
    de Kaderwet subsidies I en M, de artikelen 15, eerste en tweede lid, 16, 34, 35 en 40 van de Meststoffenwet,
    artikel 22, tweede lid, van de Wet belastingen op milieugrondslagen, artikel 2, eerste lid, van de Wet kenbaarheid
    publiekrechtelijke beperkingen onroerende zaken, de artikelen 8.40, eerste lid, 9.2.2.1, eerste lid, 9.5.2, eerste
    lid, 10.2, tweede lid, 10.43, eerste lid, en 11a.2, eerste lid, van de Wet milieubeheer;

    De Afdeling advisering van de Raad van State gehoord (advies van 15 juli 2020, nr. W17.20.0100/IV);

    Gezien het nader rapport van de Staatssecretaris van Infrastructuur en Waterstaat van 23 november 2020, nr.
    IENW/BSK-2020/194717, Hoofddirectie Bestuurlijke en Juridische Zaken, uitgebracht mede namens Onze Minister van
    Binnenlandse Zaken en Koninkrijksrelaties en Onze Minister van Landbouw, Natuur en Voedselkwaliteit;

    Hebben goedgevonden en verstaan:
