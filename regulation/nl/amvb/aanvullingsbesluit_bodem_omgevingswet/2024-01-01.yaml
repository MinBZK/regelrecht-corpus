  - number: XV.2
    text: |-
      Een melding als bedoeld in [artikel 28 van de Wet bodembescherming][ref1], die voor de inwerkingtreding
      van dit besluit is gedaan, als op de activiteit in die melding na de inwerkingtreding van dit besluit op
      grond van [artikel 4.3, eerste lid, van de Omgevingswet][ref2] een andere informatieverplichting dan een
      melding van toepassing is, geldt als een verstrekking van informatie over die activiteit als bedoeld in
      [paragraaf 4.119][ref3] of [4.120 van het Besluit activiteiten leefomgeving][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel28
