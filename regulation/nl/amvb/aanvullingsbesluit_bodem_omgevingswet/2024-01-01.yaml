  - number: XVI.1
    text: |-
      Het oude recht blijft van toepassing op het voor toepassing in Nederland of voor handelsdoeleinden voor
      de Nederlandse markt voorhanden hebben, vervoeren of aan een ander ter beschikking stellen van IBC-
      bouwstoffen of het toepassen van IBC-bouwstoffen, uitgezonderd AVI-bodemas, in een werk waarvoor voor de
      inwerkingtreding van de [artikelen I][ref1] en [VII][ref2] van dit besluit een melding is gedaan op grond van
      [artikel 32, tweede lid, van het Besluit bodemkwaliteit][ref3], tot zes maanden na de inwerkingtreding van de
      artikelen I en VII van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0044911#ArtikelI
      [ref2]: https://wetten.overheid.nl/BWBR0044911#ArtikelVII
      [ref3]: https://wetten.overheid.nl/BWBR0022929#Artikel32
    url: https://wetten.overheid.nl/BWBR0044911/2024-01-01#ArtikelXVI
    references:
