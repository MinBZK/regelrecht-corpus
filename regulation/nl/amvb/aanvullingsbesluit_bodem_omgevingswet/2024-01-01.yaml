        artikel: VII
        hoofdstuk: '2'
  - number: XVI.5
    text: |-
      Als met toepassing van [artikel 33b][ref1] in samenhang met
      [hoofdstuk 4, afdeling 1, paragraaf 2, van het Besluit bodemkwaliteit][ref2], zoals dat luidde voor de
      inwerkingtreding van [artikel VII][ref3] van dit besluit, een gebiedsspecifiek toetsingskader is vastgesteld voor
      het toepassen van mijnsteen en mijnsteen dat is vermengd met ten hoogste 80 gewichtsprocent grond of baggerspecie,
      geldt het oude recht tot een bij koninklijk besluit vast te stellen tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel33b
      [ref2]: https://wetten.overheid.nl/BWBR0022929#Paragraaf2
      [ref3]: https://wetten.overheid.nl/BWBR0044911#ArtikelVII
    url: https://wetten.overheid.nl/BWBR0044911/2024-01-01#ArtikelXVI
