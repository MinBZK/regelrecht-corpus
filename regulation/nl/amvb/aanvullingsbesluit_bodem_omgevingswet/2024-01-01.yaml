  - number: XVI.9
    text: |-
      Als in verband met de invoering van dit besluit bepalingen van het [Besluit bodemkwaliteit][ref1] komen te
      vervallen, waarin een overgangsrechtelijke bepaling was opgenomen, blijft die overgangsrechtelijke bepaling van
      toepassing tot die is uitgewerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0022929
