  - number: XVI.8
    text: |-
      Een melding die is gedaan voor het toepassen van mijnsteen of vermengde mijnsteen op grond van
      [artikel 33b][ref1] in samenhang met [artikel 42, eerste lid, van het Besluit bodemkwaliteit][ref2]
      zoals dat luidde voor inwerkingtreding van [artikel VII][ref3], geldt als een melding op grond van
      [artikel 4.1282, eerste lid, van het Besluit activiteiten leefomgeving][ref4] zoals dat luidt na inwerkingtreding
