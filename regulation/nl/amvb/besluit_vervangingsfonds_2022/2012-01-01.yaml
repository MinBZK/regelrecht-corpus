  - number: '2'
    text: |-
      1 Het Vervangingsfonds heeft tot taak het bevoegd gezag de waarborgen te bieden, bedoeld in
      [artikel 183, eerste lid, van de WPO][ref1] en [artikel 169, eerste lid, van de WEC][ref2].

      2 In verband met de uitoefening van de taak, bedoeld in [artikel 183, eerste lid, onderdeel b, van de WPO][ref3]
      en [artikel 169, eerste lid, onderdeel b, van de WEC][ref4], beheert het Vervangingsfonds een noodfonds dat de
      bedragen omvat die Onze Minister op grond van artikel 183, vijfde lid, van de WPO, en artikel 169, vijfde lid, van
      de WEC jaarlijks aan het Vervangingsfonds toekent.

      3 Het Participatiefonds heeft tot taak het bevoegd gezag de waarborgen te bieden, bedoeld in
      [artikel 184, eerste lid, van de WPO][ref5] en [artikel 170, eerste lid, van de WEC][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel183
