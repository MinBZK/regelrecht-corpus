  - number: '4'
    text: |-
      Bij de intrekking van de aanwijzing van het Vervangingsfonds of het Participatiefonds als de rechtspersoon,
      bedoeld in de [artikelen 183, eerste lid][ref1], en [184, eerste lid, van de WPO][ref2] en de
      [artikelen 169, eerste lid][ref3], en [170, eerste lid, van de WEC][ref4]:

      a. wenden het Vervangingsfonds en het Participatiefonds de onder hun beheer staande middelen, bestemd voor het
      verschaffen van de waarborgen, bedoeld in [artikel 2][ref5], aan voor het doel waartoe die middelen aan het
      Vervangingsfonds of het Participatiefonds ter beschikking zijn gesteld; of

      b. dragen het Vervangingsfonds en het Participatiefonds de in onderdeel a bedoelde middelen over aan een andere,
      door Onze Minister op grond van de in de aanhef genoemde artikelen, aan te wijzen rechtspersoon.


