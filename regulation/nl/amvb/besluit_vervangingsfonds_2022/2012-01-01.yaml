  - number: '3'
    text: |-
      1 Onze Minister stemt in met de statuten van het Vervangingsfonds en het Participatiefonds, bedoeld in
      [artikel 187, eerste lid, van de WPO][ref1] en [artikel 172, eerste lid, van de WEC][ref2], uitsluitend indien deze
      statuten ten minste de volgende bepalingen bevatten:

      a. dat het Vervangingsfonds zich ten doel stelt de waarborgen te bieden, bedoeld in
      [artikel 2, eerste en tweede lid][ref3], en dat het Participatiefonds zich ten doelt stelt de waarborgen te bieden,
      bedoeld in artikel 2, derde lid;

      b. de wijze van benoeming, herbenoeming, schorsing en ontslag door het Vervangingsfonds en het Participatiefonds
      van de leden en plaatsvervangend leden van het bestuur;

      c. het aantal leden en plaatsvervangend leden van het bestuur dat wordt benoemd, met dien verstande dat het bestuur
      ten minste drie en ten hoogste negen leden heeft waarvan één voorzitter;

      d. dat de leden en plaatsvervangend leden, met uitzondering van de voorzitter, voor de helft worden benoemd op
      bindende voordracht van de daarvoor in aanmerking komende personeelsorganisaties in het onderwijs en voor de helft
      door de centrale werkgeversorganisatie primair onderwijs;

      e. dat het Vervangingsfonds en het Participatiefonds ten minste eenmaal per jaar overleg voeren met Onze Minister
      of een door Onze Minister aan te wijzen vertegenwoordiger;

      f. dat het bestuur van het Vervangingsfonds en het bestuur van het Participatiefonds in het kader van hun
      taakuitoefening, bedoeld in [artikel 2][ref4], het bevoegd gezag bij algemeen verbindend voorschrift verplichtingen
      van administratieve aard opleggen ten behoeve van:

      1°. de controle van de rechtmatigheid van de uitgaven van het Vervangingsfonds of het Participatiefonds;

      2°. het verkrijgen door het Vervangingsfonds van betrouwbare gegevens met betrekking tot ziekteverzuim, andere
      vormen van afwezigheid en vervanging, of door het Participatiefonds van betrouwbare gegevens met betrekking tot
      het ontstaan van aanspraken op werkloosheidsuitkeringen of uitkeringen wegens ziekte en arbeidsongeschiktheid van
      gewezen personeel anders dan op grond van de [Ziektewet][ref5];

      3°. de doelmatige uitvoering van de werkzaamheden door het Vervangingsfonds of het Participatiefonds;

      4°. het voldoen aan verplichtingen van het Vervangingsfonds of het Participatiefonds uit hoofde van de wet of dit
      besluit;

      5°. het vaststellen van de bijdrage die het bevoegd gezag aan het Vervangingsfonds of het Participatiefonds moet
      voldoen;

      g. dat bij ontbinding of beëindiging van de werkzaamheden van het Vervangingsfonds of het Participatiefonds de
      bestemming van het bij liquidatie aanwezige vermogen wordt vastgesteld in overeenstemming met Onze Minister.

      2 Het eerste lid is van overeenkomstige toepassing bij het verlenen van instemming door Onze Minister met wijziging
      van de statuten.

      3 Onze Minister stemt in ieder geval niet in met een door het Vervangingsfonds of het Participatiefonds
      voorgestelde wijziging van de statuten, indien een dergelijk besluit in strijd is met de
      wet of met dit besluit, dan wel in strijd is met het algemeen belang of met een op grond van
      [artikel 21 van de Kaderwet zelfstandige bestuursorganen][ref6] door Onze Minister vastgestelde beleidsregel, dan
      wel niet is te verenigen met de waarborgen welke het Vervangingsfonds of het Participatiefonds zich ten doel stelt
      te bieden.


