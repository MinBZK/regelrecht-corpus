preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Onderwijs, Cultuur en Wetenschap, van 7 april 2011, nr. WJZ/284390
    (2703), directie Wetgeving en Juridische Zaken, gedaan mede namens Onze Minister van Binnenlandse Zaken en
    Koninkrijksrelaties en in overeenstemming met de Staatssecretaris van Sociale Zaken en Werkgelegenheid;

    Gelet op de artikelen 187, derde lid, en 188, eerste lid, van de Wet op het primair onderwijs, de artikelen 172,
    derde lid, en 173, eerste lid, van de Wet op de expertisecentra en artikel 73, vijfde lid, van de Wet structuur
    uitvoeringsorganisatie werk en inkomen;

    De Raad van State gehoord (advies van 28 april 2011, nr. W05.11.0112/I);

    Gezien het nader rapport van Onze Minister van Onderwijs, Cultuur en Wetenschap, mede namens Onze Minister van
    Binnenlandse Zaken en Koninkrijksrelaties en in overeenstemming met de Staatssecretaris van Sociale Zaken en
    Werkgelegenheid, van 23 mei 2011, nr. WJZ/301971 (2703), directie Wetgeving en Juridische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0030106/2012-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. *WPO:* [Wet op het primair onderwijs][ref1];

      b. *WEC:* [Wet op de expertisecentra][ref2];

      c. *Onze Minister:* Onze Minister van Onderwijs, Cultuur en Wetenschap;

      d. *het bevoegd gezag:* het bevoegd gezag van een school of instelling, dat is aangesloten bij het Vervangingsfonds
      op grond van [artikel 183, eerste lid, van de WPO][ref3] of [artikel 169, eerste lid, van de WEC][ref4]
      of bij het Participatiefonds op grond van [artikel 184, eerste lid, van de WPO][ref5] of
      [artikel 170, eerste lid, van de WEC][ref6];

      e. *het Vervangingsfonds:* de Stichting Vervangingsfonds en Bedrijfsgezondheidszorg voor het
      Onderwijs, zijnde de rechtspersoon, bedoeld in [artikel 183, eerste lid, van de WPO][ref7] en
      [artikel 169, eerste lid, van de WEC][ref8];

      f. *het Participatiefonds:* de Stichting Participatiefonds voor het Onderwijs, zijnde de rechtspersoon, bedoeld in
      [artikel 184, eerste lid, van de WPO][ref9] en [artikel 170, eerste lid, van de WEC][ref10].


