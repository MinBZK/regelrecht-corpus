  - number: '3'
    text: |-
      1 Onze Minister stemt in met de statuten alsmede de wijziging daarvan, bedoeld
      in [artikel 194, eerste lid, van de Wet op het primair onderwijs][ref1] en
      [artikel 173, eerste lid, van de Wet op de expertisecentra][ref2], indien de statuten ten minste de volgende
      bepalingen bevatten:

      a. dat het vervangingsfonds zich ten doel stelt de waarborgen te bieden, bedoeld
      in [artikel 188, eerste lid, van de Wet op het primair onderwijs][ref3] en
      [artikel 167, eerste lid, van de Wet op de expertisecentra][ref4];

      b. de wijze van benoeming, herbenoeming, schorsing en ontslag door het vervangingsfonds van de leden en
      plaatsvervangend leden van het bestuur;

      c. het aantal leden en plaatsvervangend leden van het bestuur dat wordt benoemd, met dien verstande dat het bestuur
      ten minste drie en ten hoogste negen leden heeft, waarvan één voorzitter;

      d. dat de leden en plaatsvervangend leden, met uitzondering van de voorzitter, voor de ene helft worden benoemd op
      bindende voordracht van de daarvoor in aanmerking komende personeelsorganisaties in het onderwijs en voor de andere
      helft worden benoemd op bindende voordracht van de centrale werkgeversorganisatie primair onderwijs;

      e. dat het vervangingsfonds ten minste eenmaal per jaar overleg voert met Onze Minister of een door Onze Minister
      aan te wijzen vertegenwoordiger;

      f. dat het bestuur in het kader van zijn taakuitoefening, bedoeld in
      [artikel 188, eerste lid, van de Wet op het primair onderwijs][ref5] en
      [artikel 167, eerste lid, van de Wet op de expertisecentra][ref6], het bevoegd gezag bij reglement of anderszins
      verplichtingen van administratieve aard oplegt ten behoeve van:

      1°. de controle van de rechtmatigheid van de uitgaven van het vervangingsfonds;

      2°. het verkrijgen door het vervangingsfonds van betrouwbare gegevens met betrekking tot ziekteverzuim, andere
      vormen van afwezigheid en vervanging;

      3°. de doelmatige uitvoering van de werkzaamheden door het vervangingsfonds;

      4°. het voldoen aan verplichtingen van het vervangingsfonds uit hoofde van de wet of dit besluit, en

      5°. het vaststellen van de bijdrage die het bevoegd gezag aan het vervangingsfonds moet voldoen;

      g. dat bij ontbinding of beëindiging van de werkzaamheden van het vervangingsfonds de bestemming van het bij
      liquidatie aanwezige vermogen door het bestuur wordt vastgesteld in overeenstemming met Onze Minister; en

      h. dat het vervangingsfonds een van het bestuur onafhankelijke commissie instelt die is belast met het interne
      toezicht en waarvan de taken zijn vastgelegd in de statuten.

      2 Onze Minister stemt in ieder geval niet in met een door het Vervangingsfonds voorgestelde wijziging van de
      statuten, indien een dergelijk besluit in strijd is met de wet of met dit besluit, dan wel in strijd is met het
      algemeen belang of met een op grond van [artikel 21 van de Kaderwet zelfstandige bestuursorganen][ref7] door Onze
      Minister vastgestelde beleidsregel, dan wel niet is te verenigen met de waarborgen welke het Vervangingsfonds zich
      ten doel stelt te bieden.


