articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      - *bestuur:* bestuur van het vervangingsfonds;
      - *bevoegd gezag:* een bij het vervangingsfonds, op grond van
      [artikel 188, eerste lid, van de Wet op het primair onderwijs][ref1] of
      [artikel 167, eerste lid, van de Wet op de expertisecentra][ref2], aangesloten bevoegd gezag van een school of
      instelling of bestuur van een samenwerkingsverband;
      - *Onze Minister:* Onze Minister voor Primair en Voortgezet Onderwijs en Media;
      - *vervangingsfonds:* de rechtspersoon, bedoeld in
      [artikel 188, eerste lid, van de Wet op het primair onderwijs][ref3] en
      [artikel 167, eerste lid, van de Wet op de expertisecentra][ref4].


