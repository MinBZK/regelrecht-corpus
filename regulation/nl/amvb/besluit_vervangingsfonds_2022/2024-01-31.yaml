  - number: '7'
    text: |-
      Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip en vervalt op het tijdstip
      waarop artikel I, onderdeel E, en artikel II, onderdeel D, van de Wet van 11 oktober 2021 tot wijziging van de
      [Wet op het primair onderwijs][ref1] en de [Wet op de expertisecentra][ref2] in verband met beëindiging van de
      verplichte aansluiting bij een rechtspersoon in verband met kosten van vervanging en in verband met wijziging
      van de wijze waarop de werkloosheidsuitkeringen worden verevend (beëindiging vervangingsfonds en modernisering
      participatiefonds) (Stb. 2021, 538) in werking treden.


