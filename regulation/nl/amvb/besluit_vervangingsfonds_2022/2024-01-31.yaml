  - number: '4'
    text: |-
      Bij de intrekking van de aanwijzing van de rechtspersoon, bedoeld in
      [artikel 188, eerste lid, van de Wet op het primair onderwijs][ref1] en
      [artikel 167, eerste lid, van de Wet op de expertisecentra][ref2]:

      a. wendt het vervangingsfonds de onder zijn beheer staande middelen, bestemd voor het verschaffen
      van de waarborgen, bedoeld in [artikel 188, eerste lid, van de Wet op het primair onderwijs][ref3] en
      [artikel 167, eerste lid, van de Wet op de expertisecentra][ref4], aan voor het doel waartoe die middelen aan het
      vervangingsfonds ter beschikking zijn gesteld; of

      b. draagt het vervangingsfonds de in onderdeel a bedoelde middelen over aan een andere, door Onze Minister op grond
      van de in de aanhef genoemde artikelen, aan te wijzen rechtspersoon.


