articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. *betrokkene*: de ambtenaar in de zin van het [Algemeen Rijksambtenarenreglement][ref1] of het
      [Ambtenarenreglement Staten-Generaal][ref2]

      b. *bezoldigingsbesluit*: [Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref3]

      c. *berekeningsbasis*: de bezoldiging in de zin van het bezoldigingsbesluit met uitzondering van de toelagen als
      bedoeld in de artikelen 17, 17*a*, 17*b*, 18 en 18*a* van dat besluit, met dien verstande dat de bezoldiging bij
      een onvolledige werktijd herleid wordt tot de bezoldiging, geldende bij een volledige werktijd;

      d. dienstauto: auto die ten behoeve van zakelijk gebruik eigendom is van het Rijk of vanwege het Rijk is gehuurd
      of geleast;

      e. Onze minister: het hoofd van het betrokken ministerie;

      f. plaats van tewerkstelling: de gebruikelijke ingang van het gebouw, gebouwencomplex of terrein waar de betrokkene
      gewoonlijk zijn werkzaamheden verricht, dan wel indien de uitoefening van het ambt zich uitstrekt over een
      ambtsgebied, de door het bevoegde gezag aangewezen plaats;

      g. privé-kilometers: alle door de betrokkene met de dienstauto verreden kilometers verminderd met

        - het aantal kilometers tijdens dienstreizen;
        - het aantal woon/werkverkeerkilometers;


      [ref1]: https://wetten.overheid.nl/BWBR0001950
      [ref2]: https://wetten.overheid.nl/BWBR0003229
      [ref3]: https://wetten.overheid.nl/BWBR0003630
    url: https://wetten.overheid.nl/BWBR0003632/2007-06-20#Artikel1
