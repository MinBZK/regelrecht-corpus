  - number: '3'
    text: |-
      1 Betrokkene is voor het van rijkswege verstrekte genot van woning en verdere verstrekkingen in die woning aan het
      Rijk een bedrag verschuldigd overeenkomende met de hierna genoemde percentages van zijn berekeningsbasis:

      a. voor woning: 12%,

      b. voor verwarming van de woning: 2,4%,

      c. voor energie voor kookdoeleinden: 0,9%,

      d. voor elektrische energie, anders dan voor verwarming van de woning en voor kookdoeleinden: 0,9%,

      e. voor leidingwater: 0,4%,

      zulks met inachtneming van door Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties aan te geven maxima
      voor de verstrekkingen, bedoeld onder *b* t/m *e*.

      2 Indien betrokkene aantoont, dat de huurwaarde van de woning voor de heffing van de inkomsten- en loonbelasting
      minder bedraagt dan het op grond van het bepaalde in het vorige lid geldende bedrag wegens het genot van woning,
      wordt het verschuldigde bedrag op dat van die huurwaarde gesteld.
    url: https://wetten.overheid.nl/BWBR0003632/2007-06-20#Artikel3
  - number: 3a
    text: |-
      1 De betrokkene aan wie door Onze minister schriftelijk toestemming is verleend om een dienstauto voor het afleggen
      van privé-kilometers te gebruiken is daarvoor per verreden kilometer een door Onze minister van Binnenlandse Zaken
      en Koninkrijksrelaties vast te stellen bedrag aan het Rijk verschuldigd.

      2 Op basis van een zo nauwkeurig mogelijke inschatting van de af te leggen privé-kilometers wordt bij wijze van
      voorschot een maandelijks verschuldigd bedrag vastgesteld.

      3 De op grond van het eerste lid verschuldigde bedragen worden verrekend met reeds betaalde voorschotten. De
      verrekening geschiedt binnen drie maanden na door Onze minister te bepalen tijdstippen.

      4 De navolgende kosten die verband houden met het onderhoud en gebruik van een voor het afleggen van privé-
      kilometers ter beschikking gestelde dienstauto zijn voor rekening van de betrokkene:

      a. kosten voor boetes en bekeuringen;

      b. kosten voor reiniging van de auto;

      c. kosten voor aanpassingen aan of in de auto, tenzij Onze minister te kennen heeft gegeven dat de aanpassingen in
      verband met de dienstuitoefening noodzakelijk zijn;

      d. parkeer-, veer- en tolgelden bij privé-gebruik van de auto.

      5 De betrokkene kan worden verplicht tot gehele of gedeeltelijke vergoeding van de door de dienst geleden
      schade verband houdende met het gebruik van een voor het afleggen van privé-kilometers ter beschikking gestelde
      dienstauto, voor zover deze aan hem is te wijten dan wel is veroorzaakt door een persoon wiens handelen aan de
      betrokkene kan worden toegerekend.

      6 De kosten die verband houden met een tussentijdse beëindiging van een leasecontract voor een dienstauto kunnen
      geheel of gedeeltelijk op de betrokkene worden verhaald volgens de door Onze minister te stellen regels.

      7 De meerkosten voor zowel het privé-gebruik als het zakelijk gebruik van de op verzoek van de betrokkene ter
      beschikking gestelde dienstauto waarvan de cataloguswaarde uitgaat boven het door Onze minister vastgestelde
      gebruikelijke bedrag worden op de betrokkene verhaald volgens de door Onze minister te stellen regels.
    url: https://wetten.overheid.nl/BWBR0003632/2007-06-20#Artikel3a
  - number: '4'
    text: |-
      1 In bijzondere gevallen kan een regeling worden getroffen, welke afwijkt van de bij of krachtens dit besluit
      gestelde regelen.

      2 Ingeval andere dan de in dit besluit genoemde voordelen worden genoten, kan een regeling worden getroffen,
      waarbij de hiervoor door de betrokkenen verschuldigde bedragen worden vastgesteld.

      3 Regelingen bedoeld in het eerste en tweede lid, worden getroffen bij gemeenschappelijk besluit van Onze minister
      en Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties.
    url: https://wetten.overheid.nl/BWBR0003632/2007-06-20#Artikel4
  - number: 4a
    text: |-
      Van de bevoegdheid tot het stellen van regels met een sterk technisch karakter krachtens dit besluit, kunnen Onze
      Minister van Binnenlandse Zaken en Koninkrijksrelaties en Onze Minister mandaat verlenen.
    url: https://wetten.overheid.nl/BWBR0003632/2007-06-20#Artikel4a
  - number: '5'
    text: |-
      1 De op grond van de bepaling van dit besluit door betrokkenen verschuldigde bedragen worden verrekend bij de
      uitbetaling van het salaris dan wel, indien dit niet mogelijk is, afzonderlijk in rekening gebracht.

      2 Wanneer de verschuldigde bedragen moeten worden berekend over een gedeelte van een kalendermaand, wordt het
      bedrag per dag vastgesteld door het maandbedrag te delen door het aantal dagen van de desbetreffende kalendermaand.

      3 Van het bepaalde in het vorige lid kan worden afgeweken ingeval daartoe op grond van bijzondere omstandigheden
      aanleiding bestaat.
    url: https://wetten.overheid.nl/BWBR0003632/2007-06-20#Artikel5
