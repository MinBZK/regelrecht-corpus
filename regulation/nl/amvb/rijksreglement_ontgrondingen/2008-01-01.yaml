$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: rijksreglement_ontgrondingen
regulatory_layer: AMVB
publication_date: '2005-11-22'
valid_from: '2008-01-01'
bwb_id: BWBR0002781
url: https://wetten.overheid.nl/BWBR0002781/2008-01-01
preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Op de voordracht van Onze Minister van Verkeer en Waterstaat van 2 februari 1971, no. RWW 7189, Hoofddirectie van
    de Waterstaat, Hoofdafdeling Waterstaatsrecht, gedaan in overeenstemming met Onze Ministers van Binnenlandse Zaken,
    van Volkshuisvesting en Ruimtelijke Ordening, van Economische Zaken, van Landbouw en Visserij, van Sociale Zaken en
    Volksgezondheid en van Cultuur, Recreatie en Maatschappelijk Werk;

    De Raad van de Waterstaat gehoord;

    Gelet op artikel 5, eerste lid, en artikel 8, eerste lid onder b, van de Ontgrondingenwet;

    De Raad van State gehoord (advies van 10 maart 1971, nr. 20a);

    Gezien het nader rapport van Onze Minister van Verkeer en Waterstaat van 6 augustus 1971, no. RWW 51264,
    Hoofddirectie van de Waterstaat, Hoofdafdeling Waterstaatsrecht, uitgebracht in overeenstemming met Onze Ministers
    van Binnenlandse Zaken, van Volkshuisvesting en Ruimtelijke Ordening, van Economische Zaken, van Landbouw en
    Visserij, van Volksgezondheid en Milieuhygiëne en van Cultuur, Recreatie en Maatschappelijk Werk;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0002781/2008-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'Dit besluit is van toepassing op ontgrondingen in:'
    url: https://wetten.overheid.nl/BWBR0002781/2008-01-01#Artikel1
  - number: 1.a
    text: |-
      de Noordzee, met inbegrip van het deel waarvan de grenzen samenvallen met die van het continentaal plat, bedoeld in
      [artikel 1, onder c, van de Mijnbouwwet](onbekend), alsmede de Waddenzee;
    url: https://wetten.overheid.nl/BWBR0002781/2008-01-01#Artikel1
  - number: 1.b
    text: 'de navolgende bij het rijk in beheer zijnde wateren:'
    url: https://wetten.overheid.nl/BWBR0002781/2008-01-01#Artikel1
  - number: 1.b.1°
    text: |-
      het IJsselmeer met de daarmee in open verbinding staande of daarvan ten gevolge van de inpolderingswerken
      afgescheiden wateren onder beheer van het Rijk;
    url: https://wetten.overheid.nl/BWBR0002781/2008-01-01#Artikel1
  - number: 1.b.2°
    text: |-
      De bij het Rijk in beheer zijnde rivieren, voorzover het betreft het zomerbed, zijnde de oppervlakte die de rivier
      inneemt bij gewoon hoog zomerwater of gewone vloed;
    url: https://wetten.overheid.nl/BWBR0002781/2008-01-01#Artikel1
  - number: 1.b.3°
    text: het Veerse Meer;
    url: https://wetten.overheid.nl/BWBR0002781/2008-01-01#Artikel1
  - number: 1.b.4°
    text: de Grevelingen;
    url: https://wetten.overheid.nl/BWBR0002781/2008-01-01#Artikel1
  - number: 1.b.5°
    text: het Brielse Meer;
    url: https://wetten.overheid.nl/BWBR0002781/2008-01-01#Artikel1
  - number: 1.b.6°
    text: de bij het rijk in beheer zijnde kanalen;
    url: https://wetten.overheid.nl/BWBR0002781/2008-01-01#Artikel1
  - number: 1.b.7°
    text: |-
      de met de onder 1°–6° vermelde wateren in open verbinding staande havens en overige wateren onder beheer van het
      Rijk.
    url: https://wetten.overheid.nl/BWBR0002781/2008-01-01#Artikel1
  - number: '2'
    text: |-
      De [Ontgrondingenwet][ref1] is ten aanzien van de in [artikel 1][ref2] bedoelde wateren en gebieden niet van
      toepassing op:


      [ref1]: https://wetten.overheid.nl/BWBR0002505
      [ref2]: https://wetten.overheid.nl/BWBR0002781#Artikel1
    url: https://wetten.overheid.nl/BWBR0002781/2008-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002505
      - id: ref2
        bwb_id: BWBR0002781
        artikel: '1'
  - number: 2.a
    text: het aanleggen, onderhouden, wijzigen of opruimen van Rijkswaterstaatswerken;
    url: https://wetten.overheid.nl/BWBR0002781/2008-01-01#Artikel2
  - number: 2.b
    text: |-
      het aanleggen, onderhouden, verbreden of verdiepen van watergangen, voor zover deze een bovenbreedte krijgen van
      niet meer dan 15 m, een bodembreedte van niet meer dan 5 m en een diepte van niet meer dan 2,50 m beneden het
      polder- of boezempeil, of bij gebreke daarvan 3 m beneden de gemiddelde hoogteligging van het aangrenzende terrein;
    url: https://wetten.overheid.nl/BWBR0002781/2008-01-01#Artikel2
  - number: 2.c
    text: het aanleggen of onderhouden van waterkeringen;
    url: https://wetten.overheid.nl/BWBR0002781/2008-01-01#Artikel2
  - number: 2.d
    text: |-
      het wijzigen van de hoogteligging van het terrein ten behoeve en ter plaatse van het aanleggen, onderhouden,
      wijzigen of opruimen van wegen, parkeerterreinen, spoorwegen, vliegvelden, industrieterreinen, sportterreinen,
      parken, plantsoenen, tuinen en werken van tijdelijke aard, een en ander mits
    url: https://wetten.overheid.nl/BWBR0002781/2008-01-01#Artikel2
  - number: 2.d.1e
    text: |-
      de werken plaats vinden ter uitvoering van een rechtsgeldig bestemmingsplan en bovendien de grondlagen op grotere
      diepte dan 3 m beneden het oorspronkelijk niveau ongemoeid blijven, dan wel,
    url: https://wetten.overheid.nl/BWBR0002781/2008-01-01#Artikel2
  - number: 2.d.2e
    text: het terrein niet meer dan 0,50 m beneden het oorspronkelijke niveau komt te liggen;
    url: https://wetten.overheid.nl/BWBR0002781/2008-01-01#Artikel2
  - number: 2.e
    text: |-
      de normale uitoefening van het land-, tuin- of bosbouwbedrijf, alsmede het planten of rooien van bomen, struiken of
      andere gewassen;
    url: https://wetten.overheid.nl/BWBR0002781/2008-01-01#Artikel2
  - number: 2.f
    text: |-
      het maken, onderhouden, wijzigen of opruimen van bouwwerken, kelders en graven, het doen van grondboringen en
      sonderingen, het leggen, plaatsen, onderhouden, wijzigen of opruimen van buizen, kabels, palen en dergelijke
      voorwerpen;
    url: https://wetten.overheid.nl/BWBR0002781/2008-01-01#Artikel2
  - number: 2.g
    text: |-
      het maken, onderhouden, wijzigen of opruimen van waterputten, reservoirs, bassins en soortgelijke werken, mits de
      bodemoppervlakte niet meer dan 50 m² en de inhoud niet meer dan 50 m3 bedraagt en de grondlagen op grotere diepte
      dan 3 m beneden de oorspronkelijke terreinhoogte ongemoeid blijven;
    url: https://wetten.overheid.nl/BWBR0002781/2008-01-01#Artikel2
  - number: 2.h
    text: |-
      het graven van slikgruppen ter bevordering van de aanwas alsmede het baggeren met hand- of hijsbeugel in de in
      [artikel 1 onder ][ref1] bedoelde wateren.


      [ref1]: https://wetten.overheid.nl/BWBR0002781#Artikel1
    url: https://wetten.overheid.nl/BWBR0002781/2008-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002781
        artikel: '1'
  - number: '3.1'
    text: |-
      Onze Minister is bevoegd tot verlening, wijziging of intrekking van een vergunning tot ontgronding in de in
      [artikel 1][ref1] bedoelde wateren en gebieden.


      [ref1]: https://wetten.overheid.nl/BWBR0002781#Artikel1
    url: https://wetten.overheid.nl/BWBR0002781/2008-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002781
        artikel: '1'
  - number: '3.2'
    text: |-
      een aanvrage tot verlening, wijziging of intrekking van een vergunning wordt in tweevoud bij Onze Minister
      ingediend.
    url: https://wetten.overheid.nl/BWBR0002781/2008-01-01#Artikel3
  - number: '3.3'
    text: 'Een aanvrage tot verlening van een vergunning moet inhouden:'
    url: https://wetten.overheid.nl/BWBR0002781/2008-01-01#Artikel3
  - number: 3.3.a
    text: de naam, het adres en het beroep of bedrijf van de aanvrager;
    url: https://wetten.overheid.nl/BWBR0002781/2008-01-01#Artikel3
  - number: 3.3.b
    text: |-
      de naam, het adres en het beroep of bedrijf van de eigenaar of eigenaren van de onroerende goederen, waarop de
      aanvrage betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0002781/2008-01-01#Artikel3
  - number: 3.3.c
    text: |-
      een beschrijving van het terrein of het water, waarop de aanvrage betrekking heeft, onder vermelding van het
      huidige gebruik daarvan en van de gemeente en het waterschap waarin het is gelegen;
    url: https://wetten.overheid.nl/BWBR0002781/2008-01-01#Artikel3
  - number: 3.3.d
    text: |-
      een opgave van de oppervlakte, de wijze van uitvoering en de diepte van de ontgronding dan wel een opgave van de
      wijze van uitvoering, de maximale diepte en van de hoeveelheid vaste stoffen die met de ontgronding gewonnen kan
      worden;
    url: https://wetten.overheid.nl/BWBR0002781/2008-01-01#Artikel3
  - number: 3.3.e
    text: een opgave van de redenen van de ontgronding en van de aan het afkomende bodemmateriaal te geven bestemming;
    url: https://wetten.overheid.nl/BWBR0002781/2008-01-01#Artikel3
  - number: 3.3.f
    text: |-
      een beschrijving van de toestand, waarin het terrein of de bodem van het water na de ontgronding wordt gebracht,
      onder vermelding van de daaraan te geven bestemming.
    url: https://wetten.overheid.nl/BWBR0002781/2008-01-01#Artikel3
  - number: '3.4'
    text: |-
      Bij de aanvrage moet eveneens in tweevoud worden overgelegd een tekening met kadastrale aanduiding op een
      schaal van tenminste 1 : 2500, waarop de te ontgronden onroerende zaken of gedeelten van onroerende zaken en de
      aangrenzende percelen zijn aangegeven, alsmede een uittreksel uit de basisregistratie kadaster van elk perceel,
      waarop de aanvrage betrekking heeft. Voor ontgrondingen in de in [artikel 1, onder a en onder b, 1e-5e][ref1],
      bedoelde wateren kan met overlegging van een kaart op kleinere schaal, doch niet kleiner dan 1 : 50 000,
      aanduidende de plaats van de ontgronding, worden volstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002781#Artikel1
    url: https://wetten.overheid.nl/BWBR0002781/2008-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002781
        artikel: '1'
  - number: '3.5'
    text: |-
      Op een aanvrage tot wijziging van een vergunning is het bepaalde in het derde en vierde lid, voor zover de daarin
      bedoelde gegevens en bescheiden niet reeds bij de aanvrage tot verlening van de vergunning zijn verstrekt, van
      overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0002781/2008-01-01#Artikel3
  - number: '6'
    text: |-
      Onze Minister kan, voor zover andere belangen daarbij niet of nauwelijks zijn betrokken, ten
      aanzien van ontgrondingen in de in [artikel 1, onder ][ref1], bedoelde wateren afwijken van
      [artikel 10, eerste lid, van de Ontgrondingenwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002781#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002505#Artikel10
    url: https://wetten.overheid.nl/BWBR0002781/2008-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002781
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002505
        artikel: '10'
  - number: '7.1'
    text: |-
      Ter zake van de behandeling van een aanvrage om een vergunning of wijziging van een vergunning wordt een recht
      geheven.
    url: https://wetten.overheid.nl/BWBR0002781/2008-01-01#Artikel7
  - number: '7.2'
    text: |-
      Het recht bedraagt € 680,67, vermeerderd met een opslag, die wordt berekend met toepassing van de bij dit besluit
      behorende bijlage.
    url: https://wetten.overheid.nl/BWBR0002781/2008-01-01#Artikel7
  - number: '7.3'
    text: Bij het niet behandelen van de aanvrage wordt het recht met 100% verminderd.
    url: https://wetten.overheid.nl/BWBR0002781/2008-01-01#Artikel7
  - number: '7.4'
    text: |-
      In geval van weigering van een vergunning of volledige afwijzing van een aanvrage om wijziging van een vergunning
      wordt het recht met 50% van de opslag verminderd.
    url: https://wetten.overheid.nl/BWBR0002781/2008-01-01#Artikel7
  - number: '7.5'
    text: |-
      Bij intrekking van de aanvrage na het in behandeling nemen van de aanvrage doch vóór de toezending van het ontwerp
      van de beschikking aan de aanvrager wordt het recht met 50% van de opslag verminderd.
    url: https://wetten.overheid.nl/BWBR0002781/2008-01-01#Artikel7
  - number: '7.6'
    text: |-
      Bij intrekking van de aanvrage na de toezending van het ontwerp van de beschikking doch vóór de toezending van de
      beschikking op de aanvrage aan de aanvrager wordt het recht met 10% van de opslag verminderd.
    url: https://wetten.overheid.nl/BWBR0002781/2008-01-01#Artikel7
  - number: '7.7'
    text: |-
      Indien de hoeveelheid vaste stoffen waarop de aanvrage betrekking heeft of, bij een aanvrage om wijziging van
      een vergunning, de extra hoeveelheid vaste stoffen waarop de aanvrage betrekking heeft, meer bedraagt dan de
      hoeveelheid waarop de vergunning, onderscheidenlijk de beschikking tot wijziging van een vergunning betrekking
      heeft, wordt het recht verminderd met het bedrag, berekend met toepassing van de volgende formule: A – B In
      deze formule: stelt A voor: de ter zake van de aanvrage met toepassing van de bij dit besluit behorende bijlage
      berekende opslag; stelt B voor: de ter zake van de aanvrage met toepassing van de bij dit besluit behorende bijlage
      berekende opslag, indien de aanvraag betrekking zou hebben op de hoeveelheid waarop de vergunning onderscheidenlijk
      de beschikking tot wijziging van de vergunning betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0002781/2008-01-01#Artikel7
  - number: '7.8'
    text: |-
      Indien ter zake van de behandeling van de aanvrage [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] niet is
      toegepast en het recht meer bedraagt dan € 2 268,90, wordt het recht verminderd tot € 2 268,90.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0002781/2008-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: 7a
    text: |-
      In afwijking van [artikel 7, eerste lid][ref1], wordt ter zake van de behandeling van een door of vanwege Onze
      Minister ingediende aanvrage om een vergunning of wijziging van een vergunning geen recht geheven.


      [ref1]: https://wetten.overheid.nl/BWBR0002781#Artikel7
    url: https://wetten.overheid.nl/BWBR0002781/2008-01-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0002781
        artikel: '7'
  - number: 7b
    text: |-
      Het recht, bedoeld in [artikel 7][ref1], wordt binnen twee weken na de dag van indiening van de aanvrage om een
      vergunning of wijziging van een vergunning, betaald aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0002781#Artikel7
    url: https://wetten.overheid.nl/BWBR0002781/2008-01-01#Artikel7b
    references:
      - id: ref1
        bwb_id: BWBR0002781
        artikel: '7'
  - number: '8'
    text: Dit besluit kan worden aangehaald als "Rijksreglement ontgrondingen".
    url: https://wetten.overheid.nl/BWBR0002781/2008-01-01#Artikel8
  - number: '9'
    text: |-
      Dit besluit treedt in werking met ingang van de dag waarop de [Ontgrondingenwet][ref1] in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0002505
    url: https://wetten.overheid.nl/BWBR0002781/2008-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002505
