    text: |-
      Inrichtingen als bedoeld in [artikel 115 van de wet][ref1], begripsomschrijving van «verzameling van inrichtingen»,
      onder b, zijn inrichtingen gelegen in concentratiegebieden voor horeca-inrichtingen of detailhandel en
      ambachtsbedrijven.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel115
