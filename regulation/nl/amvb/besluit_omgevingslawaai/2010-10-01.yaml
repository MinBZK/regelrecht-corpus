  - number: '24'
    text: |-
      1 In een actieplan wordt een plandrempel aangegeven, zijnde een daarbij aangegeven geluidsbelasting L en
      geluidsbelasting L, vanwege de betrokken geluidsbron of geluidsbronnen, van de gevel van woningen of andere
      geluidsgevoelige gebouwen dan wel aan de grens van geluidsgevoelige terreinen.

      2 De plandrempel kan voor verschillende categorieën van gevallen verschillend worden vastgesteld.

      3 In het actieplan wordt in elk geval aangegeven welke maatregelen worden overwogen of in uitvoering zijn om te
      voorkomen of ongedaan te maken dat de plandrempel wordt overschreden.

      4 Het actieplan geeft tevens de planning en de te verwachten effecten van de maatregelen aan.
    url: https://wetten.overheid.nl/BWBR0016989/2010-10-01#Artikel24
  - number: '25'
    text: |-
      Het percentage bewoners van woningen per geluidsbelastingklasse dat door een of meer geluidsbronnen wordt gehinderd
      of ernstig gehinderd dan wel van wie daardoor de slaap wordt verstoord, wordt bepaald aan de hand van de in een
      ministeriële regeling opgenomen dosis-effectrelaties.
    url: https://wetten.overheid.nl/BWBR0016989/2010-10-01#Artikel25
  - number: '26'
    text: |-
      Bij ministeriële regeling kunnen met betrekking tot actieplannen nadere regels worden gesteld ter uitvoering van
      door de Commissie van de Europese Gemeenschappen opgestelde richtsnoeren als bedoeld in bijlage V, onderdeel 4, bij
      de richtlijn omgevingslawaai.
    url: https://wetten.overheid.nl/BWBR0016989/2010-10-01#Artikel26
  - number: '27'
    text: |-
      Dit besluit en de Wet van 30 juni 2004 tot wijziging van de Wet geluidhinder, de Wet luchtvaart en de Spoorwegwet
      in verband met de implementatie van [richtlijn nr. 2002/49/EG](32002L0049) van het Europees Parlement en de
      Raad van de Europese Unie van 25 juni 2002 inzake de evaluatie en de beheersing van omgevingslawaai, PbEG L 189
      (geluidbelastingkaarten en actieplannen) treden in werking met ingang van 18 juli 2004.
    url: https://wetten.overheid.nl/BWBR0016989/2010-10-01#Artikel27
  - number: '28'
    text: 'Dit besluit wordt aangehaald als: Besluit omgevingslawaai.'
    url: https://wetten.overheid.nl/BWBR0016989/2010-10-01#Artikel28
