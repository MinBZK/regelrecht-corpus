preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op voordracht van de Staatssecretaris van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 23 december
    2003, kenmerk MJZ2003128216, mede namens de Staatssecretaris van Verkeer en Waterstaat;

    Gelet op richtlijn nr. 2002/49/EG van het Europees Parlement en de Raad van de Europese Unie van 25 juni 2002
    inzake de evaluatie en de beheersing van omgevingslawaai (PbEG L 189) en de artikelen 115, 118, vierde lid, 118a,
    derde lid, 122, vierde lid, en 123b, tweede lid, van de Wet geluidhinder en artikel 8.30a, eerste lid, van de Wet
    luchtvaart;

    De Raad van State gehoord (advies van 5 april 2004, no. W08.04.0002/V);

    Gezien het nader rapport van de Staatssecretaris van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 2
    juli 2004, kenmerk MJZ2004067160, uitgebracht mede namens de Staatssecretaris van Verkeer en Waterstaat;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0016989/2010-10-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. wet: [Wet geluidhinder][ref1];

      b. concentratiegebied voor horeca-inrichtingen: een gebied waarvoor een gemeentelijke verordening geldt met
      zodanige geluidsnormen voor horeca-inrichtingen dat de geluidsbelasting L op omliggende woningen 55 dB of meer kan
      bedragen of de geluidsbelasting L op omliggende woningen 50 dB of meer;

      c. concentratiegebied voor detailhandel en ambachtsbedrijven: een gebied waarvoor een gemeentelijke verordening
      geldt met zodanige geluidsnormen voor detailhandel en ambachtsbedrijven dat de geluidsbelasting L op omliggende
      woningen 55 dB of meer kan bedragen of de geluidsbelasting L op omliggende woningen 50 dB of meer;

      d. richtlijn omgevingslawaai: [richtlijn nr. 2002/49/EG](32002L0049) van het Europees Parlement en de Raad van de
      Europese Unie van 25 juni 2002 inzake de evaluatie en de beheersing van omgevingslawaai (PbEG L 189);

      e. belangrijke weg: krachtens [artikel 117, eerste of derde lid, van de wet][ref2] gepubliceerd deel van een
      rijksweg of een provinciale weg;

      f. belangrijke hoofdspoorweg: krachtens [artikel 117, tweede of vierde lid, van de wet][ref3] gepubliceerd deel van
      een hoofdspoorweg;

      g. agglomeratie: krachtens [artikel 117a van de wet][ref4] als zodanig aangewezen gebied;

      h. geluidsbelastingkaart: geluidsbelastingkaart als bedoeld in [artikel 118 van de wet][ref5];

      i. geluidsbelastingkaart voor een belangrijke weg of een belangrijke hoofdspoorweg: geluidsbelastingkaart als
      bedoeld in [artikel 118, eerste lid, van de wet][ref6];

      j. geluidsbelastingkaart voor een gemeente: geluidsbelastingkaart als bedoeld in
      [artikel 118, tweede lid, van de wet][ref7];

      k. actieplan: actieplan als bedoeld in [artikel 122 van de wet][ref8];

      l. actieplan voor een belangrijke weg of een belangrijke hoofdspoorweg: actieplan als bedoeld in
      [artikel 122, eerste lid, van de wet][ref9];

      m. actieplan voor een gemeente: actieplan als bedoeld in [artikel 122, tweede lid, van de wet][ref10].


