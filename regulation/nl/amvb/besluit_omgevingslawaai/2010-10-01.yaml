      - id: ref3
        bwb_id: BWBR0003245
  - number: '16'
    text: |-
      1 Op de geografische kaart of kaarten van een geluidsbelastingkaart voor een gemeente worden voorts aangegeven
      de industrieterreinen die zijn gezoneerd krachtens de [wet][ref1], voor zover de ten hoogste toelaatbare
      geluidsbelasting vanwege de gezamenlijke inrichtingen op het industrieterrein overeenkomt met 55 dB L of meer dan
      wel 50 dB L of meer.

      2 Ten aanzien van zodanige industrieterreinen worden aangegeven:

      a. de grenzen van het industrieterrein;

      b. de zone rond het industrieterrein, vastgesteld overeenkomstig de [wet][ref2];

      c. de ten hoogste toelaatbare geluidsbelasting vanwege de gezamenlijke inrichtingen op het industrieterrein,
      aangegeven door middel van:

      i. contouren die overeenkomen met een geluidsbelasting van 55, 60, 65, 70 en 75 dB L;

      ii. contouren die overeenkomen met een geluidsbelasting van 50, 55, 60, 65 en 70 dB L;

      voorzover deze contouren zijn gelegen buiten het industrieterrein;

      d. de woningen, andere geluidsgevoelige gebouwen en geluidsgevoelige terreinen die zijn gelegen binnen de onder c
      bedoelde contouren.


      [ref1]: https://wetten.overheid.nl/BWBR0003227
      [ref2]: https://wetten.overheid.nl/BWBR0003227
    url: https://wetten.overheid.nl/BWBR0016989/2010-10-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0003227
      - id: ref2
        bwb_id: BWBR0003227
  - number: '17'
    text: |-
      1 Op de geografische kaart of kaarten van een geluidsbelastingkaart voor een gemeente worden voorts aangegeven de
      concentratiegebieden voor horeca-inrichtingen onderscheidenlijk voor detailhandel en ambachtsbedrijven.

      2 Ten aanzien van zodanige concentratiegebieden worden aangegeven:

      a. de grenzen van het concentratiegebied;

      b. de ten hoogste toelaatbare geluidsbelasting vanwege de betrokken inrichtingen, uitgedrukt in L en L;

      c. de woningen, andere geluidsgevoelige gebouwen en geluidsgevoelige terreinen die zijn gelegen binnen het
      concentratiegebied.
    url: https://wetten.overheid.nl/BWBR0016989/2010-10-01#Artikel17
  - number: '18'
    text: |-
      Bij ministeriële regeling kan voor de toepassing van dit hoofdstuk worden bepaald dat het aantal bewoners van
      woningen wordt bepaald op basis van een bij die ministeriële regeling vastgesteld gemiddeld aantal bewoners per
      woning.
    url: https://wetten.overheid.nl/BWBR0016989/2010-10-01#Artikel18
  - number: '19'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de legenda bij de geografische
      kaarten.
    url: https://wetten.overheid.nl/BWBR0016989/2010-10-01#Artikel19
  - number: '20'
    text: |-
      Bij ministeriële regeling kunnen met betrekking tot de opstelling van geluidsbelastingkaarten nadere regels worden
      gesteld ter uitvoering van door de Commissie van de Europese Gemeenschappen opgestelde richtsnoeren als bedoeld in
      bijlage IV, onderdeel 9, bij de richtlijn omgevingslawaai.
    url: https://wetten.overheid.nl/BWBR0016989/2010-10-01#Artikel20
  - number: '21'
    text: |-
      1 Aan een verzoek om verstrekking van inlichtingen en gegevens als bedoeld in
      [artikel 118a, eerste of tweede lid][ref1], of [123b, eerste lid, van de wet][ref2] wordt voldaan binnen 3 maanden
      na de dag waarop het verzoek is ontvangen, dan wel, indien de inlichtingen en gegevens nog niet beschikbaar zijn,
      onverwijld nadat zij beschikbaar zijn gekomen.

      2 Bij ministeriële regeling wordt bepaald welke inlichtingen en gegevens desverzocht in elk geval worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel118a
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel123b
    url: https://wetten.overheid.nl/BWBR0016989/2010-10-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: 118a
      - id: ref2
        bwb_id: BWBR0003227
        artikel: 123b
  - number: '22'
    text: |-
      1 Een actieplan bevat ten minste:

      a. een beschrijving van de betrokken categorieën van geluidsbronnen;

      b. een vermelding van de bevoegde instantie;

      c. een beschrijving van het wettelijke kader met betrekking tot geluidsbelasting;

      d. een samenvatting van de gegevens die zijn vervat in de geluidsbelastingkaart of geluidsbelastingkaarten waarop
      het actieplan berust;

      e. een beschrijving van de wijze waarop aan eenieder de gelegenheid is geboden om zienswijzen over het ontwerp van
      het actieplan naar voren te brengen;

      f. een inhoudelijke reactie op de onder e bedoelde zienswijzen;

      g. een overzicht van belangrijke infrastructurele werken die zijn voorgenomen in de planperiode;

      h. een overzicht van bestaande en in voorbereiding of uitvoering zijnde bron- en overdrachtsmaatregelen met
      betrekking tot de betrokken geluidsbron of geluidsbronnen;

      i. een overzicht en een beoordeling van het aantal bewoners van woningen dat door geluid ten gevolge van de
      betrokken geluidsbron of geluidsbronnen wordt gehinderd of ernstig gehinderd dan wel van wie daardoor de slaap
      wordt verstoord;

      j. een schatting van het effect van de voorgenomen maatregelen op het aantal van de onder i bedoelde bewoners van
      woningen;

      k. voor zover beschikbaar en openbaar, financiële informatie met betrekking tot de voorgenomen maatregelen;

      l. een evaluatie van de uitvoering en de resultaten van het vorige actieplan.

      2 Een actieplan bevat voorts een beknopte samenvatting van de in het eerste lid bedoelde aspecten.

      3 Een actieplan voor een gemeente bevat voorts:

      a. een beschrijving van de gemeente;

      b. een inhoudelijke reactie op de wensen en zienswijze over het ontwerp van het actieplan die door de gemeenteraad
      ter kennis van burgemeester en wethouders zijn gebracht.
    url: https://wetten.overheid.nl/BWBR0016989/2010-10-01#Artikel22
  - number: '23'
    text: |-
      1 Een actieplan bevat een beschrijving van het beleid voor de eerstkomende vijf jaren en, voor zover dit
      redelijkerwijs is aan te geven, voor de vijf jaren daarna, om de geluidsbelasting vanwege de betrokken geluidsbron
      of geluidsbronnen te beperken.

      2 In de beschrijving van het beleid wordt in elk geval aandacht besteed aan de situaties waarin de ten
      hoogste toelaatbare geluidsbelasting ingevolge de [wet][ref1], de [Wet luchtvaart][ref2] dan wel de
      [Wet milieubeheer][ref3], vanwege de betrokken geluidsbron of geluidsbronnen, wordt overschreden.

      3 Afzonderlijk wordt aandacht besteed aan de situaties waarin tevens de waarde wordt overschreden die ingevolge de
      [wet][ref4] bij de vaststelling van de hogere waarde niet te boven mag worden gegaan.

      4 Voorts wordt in elk geval het beleid ter bescherming van stille gebieden beschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0003227
      [ref2]: https://wetten.overheid.nl/BWBR0005555
      [ref3]: https://wetten.overheid.nl/BWBR0003245
      [ref4]: https://wetten.overheid.nl/BWBR0003227
    url: https://wetten.overheid.nl/BWBR0016989/2010-10-01#Artikel23
