        bwb_id: BWBR0003227
      - id: ref2
        bwb_id: BWBR0005181
      - id: ref3
        bwb_id: BWBR0005555
  - number: '11'
    text: |-
      Op de geografische kaart of kaarten van een geluidsbelastingkaart voor een gemeente worden aangegeven:

      a. de grenzen van de gemeente;

      b. de grenzen van de stille gebieden binnen de gemeente.
    url: https://wetten.overheid.nl/BWBR0016989/2010-10-01#Artikel11
  - number: '12'
    text: |-
      1 Op de geografische kaart of kaarten van een geluidsbelastingkaart voor een gemeente worden voorts aangegeven:

      a. wegen;

      b. spoorwegen die niet deel uitmaken van een weg.

      2 Ten aanzien van de in het eerste lid bedoelde geluidsbronnen worden aangegeven:

      a. de ligging van de betrokken geluidsbronnen;

      b. de geluidsbelasting vanwege de betrokken categorie van geluidsbronnen, aangegeven door middel van:

      i. contouren van 55, 60, 65, 70 en 75 dB L;

      ii. contouren van 50, 55, 60, 65 en 70 dB L;

      voor zover deze contouren zijn gelegen binnen de gemeente;

      c. de woningen, andere geluidsgevoelige gebouwen en geluidsgevoelige terreinen die zijn gelegen binnen de onder b
      bedoelde contouren.
    url: https://wetten.overheid.nl/BWBR0016989/2010-10-01#Artikel12
  - number: '13'
    text: |-
      1 Op de geografische kaart of kaarten van een geluidsbelastingkaart voor een gemeente worden voorts aangegeven
      luchthavens, voor zover de geluidsbelasting vanwege de luchthaven binnen de gemeente overeenkomt met 55 dB L of
      meer dan wel 50 dB L of meer.

      2 Ten aanzien van een zodanige luchthaven wordt aangegeven:

      a. de ligging van de luchthaven;

      b. een met het oog op de geluidsbelasting vastgesteld beperkingengebied als bedoeld in [hoofdstuk 8][ref1] of
      [artikel 10.17 van de Wet luchtvaart][ref2];

      c. de ten hoogste toelaatbare geluidsbelasting vanwege de luchthaven, aangegeven door middel van:

      i. contouren die overeenkomen met een geluidsbelasting van 55, 60, 65, 70 en 75 dB L;

      ii. contouren die overeenkomen met een geluidsbelasting van 50, 55, 60, 65 en 70 dB L;

      voorzover deze contouren zijn gelegen buiten de luchthaven;

      d. de woningen, andere geluidsgevoelige gebouwen en geluidsgevoelige bestemmingen die zijn gelegen binnen de onder
      c bedoelde contouren.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Hoofdstuk8
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel10.17
    url: https://wetten.overheid.nl/BWBR0016989/2010-10-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0005555
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '10.17'
  - number: '14'
    text: |-
      1 Op de geografische kaart of kaarten van een geluidsbelastingkaart voor een gemeente wordt voorts aangegeven de
      luchthaven Schiphol, voor zover een of meer van de in het tweede lid, onder c, bedoelde punten zijn gelegen binnen
      de gemeente.

      2 Ten aanzien van de luchthaven Schiphol wordt aangegeven:

      a. de ligging van de luchthaven;

      b. de waarde of waarden van de ten hoogste toelaatbare geluidsbelasting;

      c. de punten buiten de luchthaven waar de ten hoogste toelaatbare geluidsbelasting vanwege de luchthaven is
      bepaald;

      d. de woningen, andere geluidsgevoelige gebouwen en geluidsgevoelige terreinen die de ten hoogste toelaatbare
      geluidsbelasting vanwege de luchthaven ondervinden.
    url: https://wetten.overheid.nl/BWBR0016989/2010-10-01#Artikel14
  - number: '15'
    text: |-
      1 Op de geografische kaart of kaarten van een geluidsbelastingkaart voor een gemeente worden voorts aangegeven
      de inrichtingen waarop de [artikelen 16][ref1] en [17][ref2] geen betrekking hebben en waarvoor ingevolge de
      [Wet milieubeheer][ref3] een ten hoogste toegelaten geluidsbelasting geldt die overeenkomt met 55 dB L of meer dan
      wel 50 dB L of meer.

      2 Ten aanzien van zodanige inrichtingen worden aangegeven:

      a. de ligging van de inrichting;

      b. de waarde van de ten hoogste toelaatbare geluidsbelasting;

      c. de punten buiten de inrichting waar de ten hoogste toelaatbare geluidsbelasting vanwege de inrichting is
      bepaald;

      d. de woningen, andere geluidsgevoelige gebouwen en geluidsgevoelige terreinen die de ten hoogste toelaatbare
      geluidsbelasting vanwege de inrichting ondervinden.


      [ref1]: https://wetten.overheid.nl/BWBR0016989#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0016989#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0016989/2010-10-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0016989
        artikel: '16'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
