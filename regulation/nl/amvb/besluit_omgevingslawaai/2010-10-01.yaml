  - number: '5'
    text: |-
      Stille gebieden als bedoeld in [artikel 115 van de wet][ref1] zijn:

      a. de krachtens [artikel 1.2, tweede lid, onder b, van de Wet milieubeheer][ref2] bij provinciale milieuverordening
      aangewezen gebieden;

      b. de krachtens [artikel 4.9, derde lid, onder c, van de Wet milieubeheer][ref3] in de provinciale
      milieubeleidsplannen aangeduide gebieden waarin de kwaliteit van het milieu in verband met geluid bijzondere
      bescherming behoeft;

      c. de door de tot een agglomeratie behorende gemeenten bij verordening als zodanig aangewezen gebieden.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel115
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel1.2
