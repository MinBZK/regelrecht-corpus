  - number: '6'
    text: |-
      1 Een geluidsbelastingkaart bestaat ten minste uit tabellen en uit een of meer geografische kaarten.

      2 De tabellen worden ingedeeld in de volgende geluidsbelastingklassen:

      a. voor geluidsbelasting L : 55–59, 60–64, 65–69, 70–74, en groter dan of gelijk aan 75 dB;

      b. voor geluidsbelasting L: 50–54, 55–59, 60–64, 65–69, en groter dan of gelijk aan 70 dB.
    url: https://wetten.overheid.nl/BWBR0016989/2010-10-01#Artikel6
  - number: '7'
    text: |-
      1 In de tabellen van een geluidsbelastingkaart voor een belangrijke weg of een belangrijke hoofdspoorweg worden per
      geluidsbelastingklasse en per gemeente ten minste aangegeven:

      a. het aantal woningen, andere geluidsgevoelige gebouwen en geluidsgevoelige terreinen dat is blootgesteld aan een
      geluidsbelasting die groter is dan of gelijk is aan:

      i. 55, 60, 65, 70 en 75 dB L;

      ii. 50, 55, 60, 65 en 70 dB L;

      b. het aantal bewoners van de onder a bedoelde woningen;

      c. indien beschikbaar, een opgave van het aantal woningen dat uit hoofde van de [wet][ref1], de [Woningwet][ref2]
      of de [Wet luchtvaart][ref3] is voorzien van extra geluidwering;

      d. een opgave van de totale oppervlakte in km² die is blootgesteld aan een geluidsbelasting L die hoger is dan 55,
      65, respectievelijk 75 dB.

      2 De aantallen, bedoeld in het eerste lid, onder a en b, zijn exclusief de aantallen binnen agglomeraties en worden
      afgerond op honderdtallen.

      3 Indien het betrokken bestuursorgaan een geluidsbelastingkaart vaststelt voor meer dan één belangrijke weg
      onderscheidenlijk voor meer dan één belangrijke hoofdspoorweg, mogen de in het eerste lid bedoelde gegevens worden
      aangegeven voor de gezamenlijke wegen onderscheidenlijk hoofdspoorwegen.


      [ref1]: https://wetten.overheid.nl/BWBR0003227
      [ref2]: https://wetten.overheid.nl/BWBR0005181
      [ref3]: https://wetten.overheid.nl/BWBR0005555
    url: https://wetten.overheid.nl/BWBR0016989/2010-10-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0003227
      - id: ref2
        bwb_id: BWBR0005181
      - id: ref3
        bwb_id: BWBR0005555
  - number: '8'
    text: |-
      1 Op de geografische kaart of kaarten van een geluidsbelastingkaart voor een belangrijke weg of een belangrijke
      hoofdspoorweg worden ten minste aangegeven:

      a. de ligging van de betrokken weg of hoofdspoorweg;

      b. de geluidsbelasting vanwege de betrokken weg of hoofdspoorweg, aangegeven door middel van:

      i. contouren van 55, 60, 65, 70 en 75 dB L;

      ii. contouren van 50, 55, 60, 65 en 70 dB L;

      c. de woningen, andere geluidsgevoelige gebouwen en geluidsgevoelige terreinen die zijn gelegen binnen de onder b
      bedoelde contouren;

      d. de grenzen van stille gebieden, voorzover gelegen binnen een afstand van 2,5 km tot de betrokken weg of
      hoofdspoorweg;

      e. de gemeentegrenzen binnen de onder b bedoelde contouren;

      f. de grenzen van agglomeraties binnen de onder b bedoelde contouren.

      2 De afstand, bedoeld in het eerste lid, onder d, wordt gemeten vanaf de buitenste begrenzing van de buitenste
      rijstrook onderscheidenlijk vanuit de buitenste spoorstaaf.
    url: https://wetten.overheid.nl/BWBR0016989/2010-10-01#Artikel8
  - number: '9'
    text: |-
      Burgemeester en wethouders van een tot een agglomeratie behorende gemeente stellen voor elk van de in
      [artikel 118, tweede lid, van de wet][ref1] genoemde categorieën van geluidsbronnen een of meer afzonderlijke
      geluidsbelastingkaarten vast.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel118
    url: https://wetten.overheid.nl/BWBR0016989/2010-10-01#Artikel9
