preamble:
  text: >-
    Wij Juliana, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.


    Op de voordracht van de Staatssecretaris van Volksgezondheid en Milieuhygiëne van 25 april 1977, DG Vgz/GMI, no.
    129830;


    Overwegende dat het noodzakelijk is de regelen inzake de registratie van geneesmiddelen aan te passen aan de
    richtlijnen van de Raad van de Europese Gemeenschappen van 26 januari 1965 (65/65/EEG), van 20 mei 1975 (75/318/
    EEG) en van 20 mei 1975 (75/319/EEG);


    Gelet op de artikelen 1, derde lid, 3, achtste lid, en 26, onder f, van de Wet op de Geneesmiddelenvoorziening
    (Stb. 1958, 408);


    Gezien het advies van de Geneesmiddelencommissie;


    De Raad van State gehoord (advies van 15 juni 1977, no. 19a);


    Gezien het nader rapport van de Staatssecretaris van Volksgezondheid en Milieuhygiëne van 25 augustus 1977, DG Vgz/
    GMI, Nr. 131384;


    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. wet: [Wet op de Geneesmiddelenvoorziening][ref1];

      b. farmaceutisch product: farmaceutische specialité of farmaceutisch preparaat;

      c. college: College ter beoordeling van geneesmiddelen, bedoeld in [artikel 29 van de wet][ref2];

      d. register: register van farmaceutische specialités of van farmaceutische preparaten, bedoeld in
      [artikel 3, eerste lid, van de wet][ref3];

      e. registratiehouder: degeen te wiens name een farmaceutisch product in het desbetreffende register staat
      ingeschreven;

      f. lid-staat: staat, welke lid is van de Europese Economische Gemeenschap;

      g. inschrijving, dan wel vergunning: een besluit betreffende de registratie van een farmaceutisch product op grond
      waarvan dat product in Nederland, dan wel in een andere lid-staat in de handel mag worden gebracht;

      h. Europese registratie-verordening: de [verordening (EEG) nr. 2309/93](31993R2309) van de Raad van de Europese
      Gemeenschappen van 22 juli 1993 tot vaststelling van communautaire procedures voor het verlenen van vergunningen
      voor en het toezicht op geneesmiddelen voor menselijk en diergeneeskundig gebruik en tot oprichting van een
      Europees bureau voor de geneesmiddelenbeoordeling (*PbEG* L 214);

      i. comité: het Comité voor farmaceutische specialiteiten, verbonden aan het Europees bureau voor de
      geneesmiddelenbeoordeling;

      j. commissie: de Commissie van de Europese Gemeenschappen;

      k. raad: de Raad van de Europese Gemeenschappen;

      l. procedure: een procedure van bezwaar, beroep of klacht met betrekking tot de registratie van een geneesmiddel
      waarin de commissie of de raad een bindende uitspraak doet als bedoeld in artikel 14 van [Richtlijn 75/319/EEG]
      (31975L0319) van de Raad van de Europese Gemeenschappen van 20 mei 1975 betreffende de aanpassing van de wettelijke
      en bestuursrechtelijke bepalingen inzake farmaceutische specialiteiten (*Pb EG* L 147), zoals deze laatstelijk is
      gewijzigd bij [Richtlijn 93/39/EEG](31993L0039) van de Raad van de Europese Gemeenschappen van 14 juni 1993 (*Pb
      EG* L 214);

      m. beroepsbeoefenaren: apothekers, apotheekhoudende artsen en apothekersassistenten, in de zin der wet, en artsen,
      tandartsen en verloskundigen.

      2 Met een lidstaat wordt gelijkgesteld een andere staat die partij is bij de Overeenkomst betreffende de Europese
      Economische Ruimte.


      [ref1]: https://wetten.overheid.nl/BWBR0002290
      [ref2]: https://wetten.overheid.nl/BWBR0002290#Artikel29
      [ref3]: https://wetten.overheid.nl/BWBR0002290#Artikel3
