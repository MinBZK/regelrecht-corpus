  - number: 12c
    text: |-
      1 Het college geeft het comité kennis van gevallen waarin, naar zijn oordeel, het wijzigen, schorsen of doorhalen
      van een inschrijving die hij krachtens een uitspraak van de commissie of de raad heeft verricht, nodig is met het
      oog op de bescherming van de volksgezondheid.

      2 [Artikel 12][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003114#Artikel12b
