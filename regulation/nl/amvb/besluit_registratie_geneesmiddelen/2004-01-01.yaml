  - number: '11'
    text: |-
      Het college haalt een inschrijving in een register door:

      a. indien op grond van na de inschrijving ter kennis van het college gekomen feiten alsnog blijkt dat het
      desbetreffende farmaceutische product niet voldoet aan hetgeen is bepaald in [artikel 3, eerste lid, onder ][ref1];

      b. indien na de inschrijving blijkt dat de aanvraag tot inschrijving in het desbetreffende register onjuiste
      gegevens of bescheiden bevat;

      c. indien na de inschrijving blijkt dat de in [artikel 2, eerste lid, onderdeel ][ref2], bedoelde
      controlemethodieken niet meer in overeenstemming zijn met de stand van wetenschap en techniek;

      d. indien na de inschrijving blijkt dat het onderzoek van het farmaceutische product en van de bestanddelen
      daarvan niet geschiedt met gebruikmaking van de desbetreffende in het register opgenomen analyse- en andere
      controlemethodieken;

      e. op een per aangetekende brief gedaan verzoek van de registratiehouder, zijnde de fabrikant van het
      farmaceutische product, onderscheidenlijk van de registratiehouder, niet zijnde de fabrikant van het farmaceutische
      product, indien zijn verzoek is vergezeld van een verklaring van de fabrikant van het product, dat deze akkoord
      gaat met de doorhaling;

      f. indien de krachtens [artikel 15][ref3] verschuldigde vergoeding niet binnen dertig dagen nadat deze verschuldigd
      is geworden, is voldaan en evenmin gevolg is gegeven aan de aanmaning van het college, gedaan na afloop van die
      termijn, om alsnog binnen acht dagen te betalen.


      [ref1]: https://wetten.overheid.nl/BWBR0002290#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003114#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0003114#Artikel15
