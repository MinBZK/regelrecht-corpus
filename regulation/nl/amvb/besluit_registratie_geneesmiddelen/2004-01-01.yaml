  - number: '26'
    text: |-
      [Artikel 16][ref1] is van overeenkomstige toepassing ten aanzien van een in [artikel 25, eerste lid][ref2],
      bedoelde persoon, met dien verstande dat in onderdeel *b*, aanhef, van eerstgenoemd artikel in plaats van "gegevens
      welke niet in het desbetreffende register zijn opgenomen" wordt gelezen: "gegevens welke niet bij de aanvraag tot
      inschrijving zijn verstrekt" en in dat onderdeel, onder 1°, in plaats van "in het desbetreffende register opgenomen
      indicaties" wordt gelezen: "de bij de aanvraag opgegeven indicaties".


      [ref1]: https://wetten.overheid.nl/BWBR0003114#Artikel16
