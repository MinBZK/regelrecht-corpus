$id: besluit_registratie_geneesmiddelen
regulatory_layer: AMVB
publication_date: '1995-11-07'
valid_from: '2004-01-01'
bwb_id: BWBR0003114
url: https://wetten.overheid.nl/BWBR0003114/2004-01-01
preamble:
  text: |-
    Wij Juliana, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Op de voordracht van de Staatssecretaris van Volksgezondheid en Milieuhygiëne van 25 april 1977, DG Vgz/GMI, no.
    129830;

    Overwegende dat het noodzakelijk is de regelen inzake de registratie van geneesmiddelen aan te passen aan de
    richtlijnen van de Raad van de Europese Gemeenschappen van 26 januari 1965 (65/65/EEG), van 20 mei 1975 (75/318/
    EEG) en van 20 mei 1975 (75/319/EEG);

    Gelet op de artikelen 1, derde lid, 3, achtste lid, en 26, onder f, van de Wet op de Geneesmiddelenvoorziening
    (Stb. 1958, 408);

    Gezien het advies van de Geneesmiddelencommissie;

    De Raad van State gehoord (advies van 15 juni 1977, no. 19a);

    Gezien het nader rapport van de Staatssecretaris van Volksgezondheid en Milieuhygiëne van 25 augustus 1977, DG Vgz/
    GMI, Nr. 131384;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel1
  - number: 1.1.a
    text: |-
      wet: [Wet op de Geneesmiddelenvoorziening][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002290
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002290
  - number: 1.1.b
    text: 'farmaceutisch product: farmaceutische specialité of farmaceutisch preparaat;'
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel1
  - number: 1.1.c
    text: |-
      college: College ter beoordeling van geneesmiddelen, bedoeld in [artikel 29 van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002290#Artikel29
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002290
        artikel: '29'
  - number: 1.1.d
    text: |-
      register: register van farmaceutische specialités of van farmaceutische preparaten, bedoeld in
      [artikel 3, eerste lid, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002290#Artikel3
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002290
        artikel: '3'
  - number: 1.1.e
    text: |-
      registratiehouder: degeen te wiens name een farmaceutisch product in het desbetreffende register staat
      ingeschreven;
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel1
  - number: 1.1.f
    text: 'lid-staat: staat, welke lid is van de Europese Economische Gemeenschap;'
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel1
  - number: 1.1.g
    text: |-
      inschrijving, dan wel vergunning: een besluit betreffende de registratie van een farmaceutisch product op grond
      waarvan dat product in Nederland, dan wel in een andere lid-staat in de handel mag worden gebracht;
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel1
  - number: 1.1.h
    text: |-
      Europese registratie-verordening: de [verordening (EEG) nr. 2309/93](31993R2309) van de Raad van de Europese
      Gemeenschappen van 22 juli 1993 tot vaststelling van communautaire procedures voor het verlenen van vergunningen
      voor en het toezicht op geneesmiddelen voor menselijk en diergeneeskundig gebruik en tot oprichting van een
      Europees bureau voor de geneesmiddelenbeoordeling (*PbEG* L 214);
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel1
  - number: 1.1.i
    text: |-
      comité: het Comité voor farmaceutische specialiteiten, verbonden aan het Europees bureau voor de
      geneesmiddelenbeoordeling;
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel1
  - number: 1.1.j
    text: 'commissie: de Commissie van de Europese Gemeenschappen;'
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel1
  - number: 1.1.k
    text: 'raad: de Raad van de Europese Gemeenschappen;'
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel1
  - number: 1.1.l
    text: |-
      procedure: een procedure van bezwaar, beroep of klacht met betrekking tot de registratie van een geneesmiddel
      waarin de commissie of de raad een bindende uitspraak doet als bedoeld in artikel 14 van [Richtlijn 75/319/EEG]
      (31975L0319) van de Raad van de Europese Gemeenschappen van 20 mei 1975 betreffende de aanpassing van de wettelijke
      en bestuursrechtelijke bepalingen inzake farmaceutische specialiteiten (*Pb EG* L 147), zoals deze laatstelijk is
      gewijzigd bij [Richtlijn 93/39/EEG](31993L0039) van de Raad van de Europese Gemeenschappen van 14 juni 1993 (*Pb
      EG* L 214);
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel1
  - number: 1.1.m
    text: |-
      beroepsbeoefenaren: apothekers, apotheekhoudende artsen en apothekersassistenten, in de zin der wet, en artsen,
      tandartsen en verloskundigen.
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel1
  - number: '1.2'
    text: |-
      Met een lidstaat wordt gelijkgesteld een andere staat die partij is bij de Overeenkomst betreffende de Europese
      Economische Ruimte.
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel1
  - number: '2.1'
    text: 'Een aanvraag tot inschrijving van een farmaceutisch product in een register moet de volgende gegevens bevatten:'
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel2
  - number: 2.1.a
    text: |-
      de naam en het adres van de aanvrager, alsmede, indien de aanvrager niet de fabrikant is van het farmaceutisch
      product, de naam en het adres van die fabrikant alsmede een document waaruit blijkt dat de fabrikant vergunning is
      verleend tot het bereiden van geneesmiddelen;
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel2
  - number: 2.1.b
    text: de benaming van het farmaceutische product;
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel2
  - number: 2.1.c
    text: de vermelding van de farmaceutische vorm;
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel2
  - number: 2.1.d
    text: |-
      een opgave van de kwalitatieve en kwantitatieve samenstelling van het farmaceutische product of, indien dit niet
      mogelijk is, een opgave van de gebruikte grondstoffen en de bewerkingen die deze hebben ondergaan, een en ander
      onder aanwijzing van de werkzame bestanddelen;
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel2
  - number: 2.1.e
    text: een korte beschrijving van de bereidingswijze van het farmaceutische product;
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel2
  - number: 2.1.f
    text: |-
      een omschrijving van de analyse- en andere controlemethodieken welke worden gebezigd voor het onderzoek van het
      farmaceutische product en voor het onderzoek van de bestanddelen van het farmaceutische product, vergezeld van een
      opgave van de uitkomsten van de analyses, verricht met de bedoelde analysemethodieken;
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel2
  - number: 2.1.g
    text: gegevens omtrent de houdbaarheid van het farmaceutische product;
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel2
  - number: 2.1.h
    text: |-
      een omschrijving van de werking van het farmaceutische product, een opgave van de indicaties, de contra-indicaties
      en de bijwerkingen, alsmede een opgave van de dosering, de wijze van gebruik en de wijze van toediening van het
      farmaceutische product indien van toepassing, worden de redenen vermeld voor voorzorgs- en veiligheidsmaatregelen
      die bij de bewaring van het product, de toediening ervan en de verwijdering van afvalproducten moeten worden
      genomen, alsmede een aanduiding omtrent mogelijke risico’s die het product voor het milieu kan inhouden;
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel2
  - number: 2.1.i
    text: |-
      een opgave van de resultaten van de met betrekking tot het farmaceutische product en van de met betrekking tot de
      bestanddelen van het farmaceutische product verrichte proeven van:
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel2
  - number: 2.1.i.1°
    text: fysisch-chemische, biologische of micro-biologische aard;
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel2
  - number: 2.1.i.2°
    text: farmacologische en toxicologische aard;
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel2
  - number: 2.1.i.3°
    text: klinische aard;
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel2
  - number: 2.1.j
    text: |-
      een of meer monsters of modellen van de buitenverpakking, van de primaire verpakking en van het ontwerp van de
      bijsluiter;
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel2
  - number: 2.1.k
    text: een opgave van de inhoud van elke handelsverpakking;
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel2
  - number: 2.1.l
    text: 'indien van toepassing:'
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel2
  - number: 2.1.l.1e
    text: |-
      afschriften van een in een andere lid-staat of in een derde land verkregen vergunning voor het in de handel brengen
      van het product, van de bijbehorende, goedgekeurde samenvatting van de productkenmerken en van de tekst van de
      bijsluiter, met inbegrip van latere wijzigingen;
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel2
  - number: 2.1.l.2e
    text: |-
      een mededeling omtrent aanvullingen of wijzigingen van de onder *a* tot en met *k* bedoelde gegevens ten opzichte
      van de verstrekte gegevens voor de vergunning, bedoeld onder 1e, dan wel een verklaring dat de gegevens niet
      gewijzigd zijn;
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel2
  - number: 2.1.l.3e
    text: |-
      vermelding van de namen van andere lid-staten waar een aanvraag betreffende het product in behandeling is,
      vergezeld van afschriften van de bij die aanvraag ingediende samenvatting van de productkenmerken en de tekst van
      de bijsluiter;
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel2
  - number: 2.1.l.4e
    text: |-
      de kennisgeving van een besluit van de bevoegde instantie van een andere lid-staat of derde land tot weigering van
      een vergunning, onder vermelding van bijzonderheden omtrent dat besluit en de motivering.
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel2
  - number: 2.1.m
    text: een samenvatting van de kenmerken van het farmaceutische product, bedoeld in het tiende lid;
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel2
  - number: 2.1.n
    text: |-
      een bewijs van betaling van de vergoeding, bedoeld in [artikel 4][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003114#Artikel4
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003114
        artikel: '4'
        paragraaf: '2'
  - number: '2.2'
    text: |-
      Degene die de inschrijving heeft aangevraagd, verstrekt desgevraagd aan het college monsters van het farmaceutisch
      product of van de werkzame bestanddelen van dat product in hoeveelheden die voldoende zijn om er onderzoek mee
      te doen.
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel2
  - number: '2.3'
    text: 'In geval een aanvraag tot inschrijving betrekking heeft op:'
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel2
  - number: 2.3.1°
    text: |-
      een farmaceutisch product dat reeds bij de mens wordt toegepast en waarvan de kennis omtrent de werking en de
      bijwerkingen in voldoende mate is verbreid,
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel2
  - number: 2.3.2°
    text: |-
      een farmaceutisch product waarvan de samenstelling voor wat betreft de werkzame bestanddelen kwalitatief en
      kwantitatief gelijk is aan die van een farmaceutisch product dat reeds bij de mens wordt toegepast en waarvan de
      kennis omtrent de werking en de bijwerkingen in voldoende mate is verbreid,
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel2
  - number: 2.3.3°
    text: |-
      een farmaceutisch product waarvan de bestanddelen reeds in een vergelijkbare verhouding zijn samengesteld in
      een farmaceutisch product dat reeds bij de mens wordt toegepast en waarvan de kennis omtrent de werking en de
      bijwerkingen in voldoende mate is verbreid,
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel2
  - number: '2.4'
    text: |-
      In geval een aanvraag tot inschrijving betrekking heeft op een farmaceutisch product, samengesteld uit bekende
      bestanddelen, dat in die samenstelling niet reeds als farmaceutisch product bij de mens wordt toegepast, kan voor
      wat betreft het overleggen van de resultaten van de proeven, bedoeld in het eerste lid, onder *i*, 2° en 3°, worden
      volstaan met die, verricht met betrekking tot het farmaceutische product.
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel2
  - number: '2.5'
    text: |-
      De ingevolge het eerste, derde en vierde lid, te verstrekken gegevens en bescheiden moeten zijn gesteld in het
      Nederlands, Frans, Duits of Engels. De in het eerste lid, onder *d*, genoemde gegevens moeten zijn gesteld in
      algemeen gebruikelijke termen en, indien door de Wereldgezondheidsorganisatie een benaming is aanbevolen, met
      gebruikmaking van die benaming.
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel2
  - number: '2.6'
    text: |-
      Onze Minister kan met betrekking tot het verstrekken van gegevens en bescheiden als bedoeld in het eerste, derde en
      vierde lid, alsmede de onderzoeken waarop deze gegevens zijn gebaseerd, regelen stellen.
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel2
  - number: '2.7'
    text: |-
      De in het eerste lid, onder *f*, bedoelde controlemethodieken dienen in overeenstemming te zijn met algemeen
      aanvaarde wetenschappelijke normen. De in het eerste lid, onder *f* en *i*, bedoelde gegevens moeten zijn opgesteld
      en ondertekend door deskundigen, die de vereiste technische capaciteiten of beroepskwalificaties bezitten.
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel2
  - number: '2.8'
    text: |-
      Het eerste lid, onder *i*, 2° en 3°, is niet van toepassing in geval een aanvraag tot inschrijving betrekking heeft
      op een farmaceutisch product waarvan de kwalitatieve en kwantitatieve samenstelling en de bereidingswijze gelijk
      zijn aan die van, en dat met dezelfde analyse- en andere controlemethodieken wordt onderzocht als
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel2
  - number: 2.8.a
    text: |-
      een farmaceutisch product dat reeds gedurende een termijn van tien jaren volgens de geldende communautaire
      bepalingen in een lid-staat in de handel is toegelaten en in een register is ingeschreven, of
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel2
  - number: 2.8.b
    text: |-
      een farmaceutisch product dat reeds in een register is ingeschreven, indien met schriftelijke toestemming van de
      registratiehouder daarvan wordt verwezen naar de desbetreffende gegevens van diens aanvraag,
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel2
  - number: '2.9'
    text: |-
      Het college kan met betrekking tot radioactieve farmaceutische specialités en preparaten bepalen welke van de
      ingevolge dit artikel bij de aanvraag te verstrekken gegevens niet behoeven te worden overgelegd, alsmede welke
      nadere gegevens moeten worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel2
  - number: '2.10'
    text: 'De in het eerste lid, onderdeel *m*, bedoelde samenvatting moet de volgende gegevens bevatten:'
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel2
  - number: 2.10.a
    text: de naam en het adres van de aanvrager;
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel2
  - number: 2.10.b
    text: de benaming van het farmaceutische product;
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel2
  - number: 2.10.c
    text: de vermelding van de farmaceutische vorm;
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel2
  - number: 2.10.d
    text: |-
      een opgave van de kwalitatieve en kwantitatieve samenstelling voor wat betreft de werkzame bestanddelen van
      het farmaceutische product, alsmede van de niet werkzame bestanddelen van het product indien de kennis daarvan
      onmisbaar is voor de juiste toepassing van het farmaceutische product;
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel2
  - number: 2.10.e
    text: |-
      een opgave van de farmacologische eigenschappen en, voor zover van belang voor de therapeutische toepassing, van de
      farmacokinetische gegevens;
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel2
  - number: 2.10.f
    text: 'een opgave van de klinische gegevens met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel2
  - number: 2.10.f.1°
    text: therapeutische indicaties;
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel2
  - number: 2.10.f.2°
    text: contra-indicaties;
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel2
  - number: 2.10.f.3°
    text: ongewenste bijwerkingen, waaronder begrepen gegevens betreffende frequentie en ernst;
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel2
  - number: 2.10.f.4°
    text: bijzondere voorzorgen bij gebruik;
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel2
  - number: 2.10.f.5°
    text: gebruik tijdens zwangerschap en lactatie;
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel2
  - number: 2.10.f.6°
    text: onverenigbaarheid met andere geneesmiddelen en stoffen;
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel2
  - number: 2.10.f.7°
    text: dosering en wijze van toediening voor volwassenen en, voor zover noodzakelijk, voor kinderen;
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel2
  - number: 2.10.f.8°
    text: symptomen in geval van overdosering en de eventuele behandelingsmogelijkheden;
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel2
  - number: 2.10.f.9°
    text: bijzondere waarschuwingen;
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel2
  - number: 2.10.f.10°
    text: invloed op de bekwaamheid om een voertuig te besturen en om machines te gebruiken;
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel2
  - number: 2.10.g
    text: 'een opgave van de volgende farmaceutische gegevens:'
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel2
  - number: 2.10.g.1°
    text: voornaamste gevallen van onverenigbaarheid;
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel2
  - number: 2.10.g.2°
    text: houdbaarheid, zo nodig na reconstitutie van het product of wanneer de verpakking voor de eerste maal wordt geopend;
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel2
  - number: 2.10.g.3°
    text: bijzondere maatregelen bij opslag;
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel2
  - number: 2.10.g.4°
    text: aard en inhoud van de verpakking;
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel2
  - number: 2.10.g.5°
    text: |-
      zo nodig, speciale voorzorgsmaatregelen voor het verwijderen van niet gebruikte farmaceutische producten of van die
      producten afgeleide afvalstoffen.
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel2
  - number: '3.1'
    text: |-
      In geval een farmaceutisch product onder dezelfde benaming in meer dan één farmaceutische vorm of in verschillende
      kwantitatieve samenstellingen in de handel zal worden gebracht, is voor elke farmaceutische vorm en voor elke
      kwantitatieve samenstelling van het product afzonderlijk een inschrijving in het desbetreffende register en een
      daartoe strekkende aanvraag tot inschrijving vereist.
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel3
  - number: '3.2'
    text: |-
      In geval een farmaceutisch product in de handel zal worden gebracht in een farmaceutische vorm welke moet worden
      samengevoegd met een vloeistof en op de verpakking van het product of in de bijsluiter voor aanwending of gebruik
      verschillende concentraties worden opgegeven en die concentraties kwalitatief verschillende werkingen hebben,
      is eveneens voor elke concentratie afzonderlijk een inschrijving in het desbetreffende register en een daarop
      betrekking hebbende aanvraag tot inschrijving vereist.
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel3
  - number: '4'
    text: |-
      Voor de behandeling van een aanvraag tot inschrijving van een farmaceutisch product in een register is de aanvrager
      een vergoeding verschuldigd. Een bewijs van betaling van de vergoeding wordt bij de aanvraag gevoegd.
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel4
  - number: '5'
    text: |-
      Het college bevestigt de aanvrager binnen een week, de zaterdagen en de zon- en erkende feestdagen niet
      meegerekend, de ontvangst van elke aanvraag tot inschrijving in een register of een aanvulling op de aanvraag als
      bedoeld in [artikel 4:5 van de Algemene wet bestuursrecht][ref1], onder vermelding van de datum van ontvangst en
      van het nummer waaronder het farmaceutische product in het desbetreffende register zal worden ingeschreven, indien
      op de aanvraag tot inschrijving gunstig wordt beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '6'
    text: |-
      Het college neemt bij de beoordeling van een aanvraag tot inschrijving in een register de door Onze Minister te
      stellen regelen met betrekking tot zodanige aanvragen in acht.
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel6
  - number: '7.1'
    text: |-
      Het college is bevoegd gedurende de behandeling van een aanvraag tot inschrijving van de aanvrager de toezending te
      verlangen van monsters van de niet-werkzame bestanddelen van het farmaceutische product, alsmede van meer monsters
      als bedoeld in [artikel 2, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003114#Artikel2
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0003114
        artikel: '2'
        paragraaf: '2'
  - number: '7.2'
    text: |-
      De ingevolge het eerste lid verlangde nadere inlichtingen onderscheidenlijk monsters worden aan het college
      toegezonden. Het college bevestigt de aanvrager de ontvangst, onder vermelding van de datum van ontvangst.
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel7
  - number: 7a.1
    text: |-
      Ingeval een aanvraag reeds bij de bevoegde instantie van een andere lid-staat in onderzoek is, kan het college
      besluiten het gedetailleerde onderzoek van de bij hem ingediende aanvraag op te schorten totdat door de
      desbetreffende instantie een beoordelingsrapport als bedoeld in [artikel 9, zevende lid][ref1], is opgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003114#Artikel9
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0003114
        artikel: '9'
        paragraaf: '2'
  - number: 7a.2
    text: |-
      Van zijn besluit tot opschorting van het onderzoek geeft het college kennis aan de aanvrager en de desbetreffende
      instantie van de andere lid-staat. De kennisgeving aan die instantie gaat vergezeld van een verzoek om toezending
      van het beoordelingsrapport, zodra een beslissing op die aanvraag is genomen.
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel7a
  - number: 7b.1
    text: |-
      Indien een aanvraag betrekking heeft op een farmaceutisch product waarvoor een andere lid-staat reeds een
      vergunning heeft verleend, verzoekt het college aan de betrokken instantie van die lid-staat onverwijld om
      toezending van het beoordelingsrapport.
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel7b
  - number: 7b.2
    text: |-
      Het college gaat na of de vergunninghouder het comité in kennis heeft gesteld van de aanvraag, overeenkomstig
      artikel 9, tweede lid, van [Richtlijn 75/319/EEG](31975L0319) van de Raad van de Europese Gemeenschappen van
      20 mei 1975 betreffende aanpassing van de wettelijke en bestuursrechtelijke bepalingen inzake farmaceutische
      specialiteiten (*PbEG* L 147), zoals deze laatstelijk is gewijzigd bij [Richtlijn 93/39/EEG](31993L0039) van de
      Raad van 14 juni 1993 (*PbEG* L 214).
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel7b
  - number: 7c.1
    text: |-
      Bij de toepassing van [artikel 7][ref1] of [artikel 7][ref2] neemt het college binnen negentig dagen na ontvangst
      van het beoordelingsrapport een besluit tot erkenning van de verleende vergunning en de bijbehorende, goedgekeurde
      samenvatting van de productkenmerken, onder inschrijving van het product in het register.


      [ref1]: https://wetten.overheid.nl/BWBR0003114#Artikel7a
      [ref2]: https://wetten.overheid.nl/BWBR0003114#Artikel7b
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel7c
    references:
      - id: ref1
        bwb_id: BWBR0003114
        artikel: 7a
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0003114
        artikel: 7b
        paragraaf: '2'
  - number: 7c.2
    text: |-
      Het college geeft van zijn besluit, bedoeld in het eerste lid, onverwijld kennis aan de instantie van de andere
      lid-staat die de vergunning heeft verleend, aan de instanties van andere lid-staten waar tezelfdertijd de aanvraag
      is ingediend, aan het comité en de aanvrager.
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel7c
  - number: 7d.1
    text: |-
      Het college kan alleen van erkenning afzien, indien hij van oordeel is dat er redenen zijn om aan te nemen dat het
      product waarvoor vergunning is verleend, vanuit het oogpunt van kwaliteit, veiligheid of werkzaamheid, een risico
      voor de volksgezondheid kan opleveren.
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel7d
  - number: 7d.2
    text: |-
      Indien het college, ingevolge het eerste lid, niet tot erkenning overgaat, doet hij daarvan onverwijld mededeling
      aan de personen en instanties, bedoeld in [artikel 7][ref1]. Deze mededeling gaat vergezeld van een advies
      omtrent te nemen maatregelen of te vinden oplossingen voor tekortkomingen in de bij hem ingediende aanvraag tot
      inschrijving.


      [ref1]: https://wetten.overheid.nl/BWBR0003114#Artikel7c
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel7d
    references:
      - id: ref1
        bwb_id: BWBR0003114
        artikel: 7c
        paragraaf: '2'
  - number: 7e.1
    text: |-
      Het college tracht, door overleg met de betrokken andere lid-staten, tot overeenstemming te komen over de
      beoordeling van de aanvraag. De aanvrager wordt in de gelegenheid gesteld zijn standpunt mondeling of schriftelijk
      toe te lichten.
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel7e
  - number: 7e.2
    text: |-
      Indien het college binnen de termijn van negentig dagen geen overeenstemming bereikt, is hij verplicht onverwijld
      een procedure aanhangig te maken bij het comité, onder vermelding van de diverse standpunten waarover geen
      overeenstemming is bereikt, en verstrekking van gegevens. Het college stelt de aanvrager in kennis van het
      aanhangig maken van de procedure, onder toezending van een afschrift van de aan het comité overgelegde standpunten
      en gegevens.
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel7e
  - number: 7e.3
    text: |-
      De aanvrager is verplicht om na ontvangst van de kennisgeving een afschrift te sturen aan het comité van de
      gegevens en bescheiden, behorende bij de aanvraag.
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel7e
  - number: 7e.4
    text: |-
      Alleen in specifieke gevallen, wanneer de belangen van de Europese Gemeenschap in het geding zijn, kan het college,
      alvorens een besluit wordt genomen, een aanvraag als bedoeld in [artikel 7][ref1], rechtstreeks bij het comité in
      procedure brengen, onder vermelding van feiten en omstandigheden en verstrekking van gegevens, waaronder gegevens
      over bijwerkingen, zo die in zijn bezit zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0003114#Artikel7a
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel7e
    references:
      - id: ref1
        bwb_id: BWBR0003114
        artikel: 7a
        paragraaf: '2'
  - number: 7e.5
    text: |-
      Het college stelt de aanvrager in kennis van het aanhangig maken van de procedure, onder toezending van afschriften
      van de aan het comité verstrekte informatie.
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel7e
  - number: 7e.6
    text: |-
      Een zelfde bevoegdheid als bedoeld in het vierde lid, komt toe aan de aanvrager indien het college voornemens is de
      inschrijving te weigeren.
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel7e
  - number: 7f
    text: Hangende de uitspraak in de procedure neemt het college geen besluit op de aanvraag tot inschrijving.
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel7f
  - number: '8'
    text: |-
      Behoudens [artikel 7][ref1], en [artikel 7][ref2], maakt het college binnen 210 dagen na de datum van ontvangst,
      bedoeld in [artikel 5][ref3], zijn besluit op de aanvraag bekend.


      [ref1]: https://wetten.overheid.nl/BWBR0003114#Artikel7c
      [ref2]: https://wetten.overheid.nl/BWBR0003114#Artikel7f
      [ref3]: https://wetten.overheid.nl/BWBR0003114#Artikel5
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003114
        artikel: 7c
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0003114
        artikel: 7f
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0003114
        artikel: '5'
        paragraaf: '2'
  - number: '9.1'
    text: |-
      Het college schrijft, behoudens in het geval van een daartoe strekkende uitspraak in een procedure of een
      administratiefrechtelijke beslissing op beroep, een farmaceutisch product slechts in het desbetreffende register
      in, indien:
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel9
  - number: 9.1.a
    text: |-
      is voldaan aan het bepaalde in [artikel 2][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003114#Artikel2
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003114
        artikel: '2'
        paragraaf: '2'
  - number: 9.1.b
    text: |-
      het product voldoet aan hetgeen is bepaald in [artikel 3, eerste lid, onder ][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002290#Artikel3
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002290
        artikel: '3'
  - number: 9.1.c
    text: |-
      de analyse- en controlemethodieken, genoemd in [artikel 2, eerste lid, onder ][ref1], geschikt zijn ter waarborging
      van de opgegeven kwalitatieve en kwantitatieve samenstelling van het product;


      [ref1]: https://wetten.overheid.nl/BWBR0003114#Artikel2
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003114
        artikel: '2'
        paragraaf: '2'
  - number: 9.1.d
    text: |-
      de benaming van het product, in geval het een farmaceutische specialité betreft, niet gelijkluidend is aan die
      van een reeds ingeschreven farmaceutische specialité, met een voor wat de werkzame bestanddelen betreft andere
      kwalitatieve samenstelling;
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel9
  - number: 9.1.e
    text: |-
      de benaming van het product, in geval het een farmaceutische specialité betreft, geen aanleiding tot misverstand
      kan geven ten aanzien van de werkzaamheid met betrekking tot de opgegeven indicaties of ten aanzien van de
      samenstelling, voor wat betreft de werkzame bestanddelen.
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel9
  - number: '9.2'
    text: |-
      Het college is bevoegd af te wijken van het bepaalde in het eerste lid, onder *d*, in geval het betreft een
      farmaceutische specialité met een gelijke werking als die van een reeds ingeschreven en door dezelfde fabrikant
      bereide farmaceutische specialité.
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel9
  - number: '9.3'
    text: |-
      Een inschrijving van een farmaceutisch product in een register geschiedt ten name van de aanvrager van de
      inschrijving.
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel9
  - number: '9.4'
    text: |-
      Een inschrijving in een register geldt uitsluitend voor het farmaceutische product afkomstig van de bij de aanvraag
      vermelde fabrikant van het product.
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel9
  - number: '9.5'
    text: |-
      Bij de bekendmaking van een besluit tot inschrijving, stuurt het college de aanvrager een afschrift van de in
      [artikel 2, eerste lid, onder ][ref1], bedoelde samenvatting, zoals deze door het college, eventueel na wijziging
      is goedgekeurd.


      [ref1]: https://wetten.overheid.nl/BWBR0003114#Artikel2
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003114
        artikel: '2'
        paragraaf: '2'
  - number: '9.6'
    text: |-
      Van het besluit tot inschrijving en de samenvatting worden afschriften gestuurd aan het Europees bureau voor de
      geneesmiddelenbeoordeling.
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel9
  - number: '9.7'
    text: |-
      Behoudens de toepassing van [artikel 7][ref1] of [artikel 7][ref2], stelt het college een rapport op van zijn
      beoordeling en bevindingen omtrent de gegevens en bescheiden betreffende de resultaten van de uitgevoerde
      analytische, toxicologische, farmacologische en klinische proeven. Dit beoordelingsrapport wordt bijgewerkt zodra
      nieuwe gegevens beschikbaar komen, die voor de beoordeling van de kwaliteit, de veiligheid of de werkzaamheid van
      het farmaceutische product van belang zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0003114#Artikel7a
      [ref2]: https://wetten.overheid.nl/BWBR0003114#Artikel7b
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003114
        artikel: 7a
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0003114
        artikel: 7b
        paragraaf: '2'
  - number: '9.8'
    text: |-
      Het college houdt het beoordelingsrapport ter beschikking van andere lid-staten. Indien de registratiehouder
      een aanvraag om een vergunning voor het desbetreffende farmaceutische product bij één of meer andere lid-staten
      indient, wordt het rapport toegezonden aan de instantie van de betrokken lid-staat of lid-staten, die bevoegd is te
      beslissen op de aanvraag.
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel9
  - number: '9.9'
    text: |-
      Tot het tijdstip waarop [artikel 7][ref1] van toepassing wordt, geeft de registratiehouder van het voornemen tot
      het indienen van een aanvraag als bedoeld in het achtste lid, kennis aan het college onder vermelding van eventuele
      toevoegingen aan de gegevens, bedoeld in [artikel 2, eerste lid][ref2]. Op verzoek van de registratiehouder stelt
      het college, met het oog op de in te dienen aanvraag, het beoordelingsrapport op of werkt het bestaande rapport bij
      binnen negentig dagen na ontvangst van het verzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0003114#Artikel7b
      [ref2]: https://wetten.overheid.nl/BWBR0003114#Artikel2
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003114
        artikel: 7b
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0003114
        artikel: '2'
        paragraaf: '2'
  - number: '10.1'
    text: 'Het college schorst een inschrijving in een register voor een tijdvak van ten hoogste twaalf maanden:'
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel10
  - number: 10.1.a
    text: |-
      indien op grond van na de inschrijving ter kennis van het college gekomen feiten het ernstige
      vermoeden bestaat dat het desbetreffende farmaceutische product niet voldoet aan hetgeen is bepaald in
      [artikel 3, eerste lid, onder ][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002290#Artikel3
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002290
        artikel: '3'
  - number: 10.1.b
    text: |-
      indien na de inschrijving het ernstige vermoeden bestaat dat de aanvraag tot inschrijving in het desbetreffende
      register onjuiste gegevens of bescheiden bevat;
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel10
  - number: 10.1.c
    text: |-
      indien na de inschrijving het ernstige vermoeden bestaat dat de in [artikel 2, eerste lid, onderdeel ][ref1],
      bedoelde controlemethodieken niet meer in overeenstemming zijn met de stand van wetenschap en techniek;


      [ref1]: https://wetten.overheid.nl/BWBR0003114#Artikel2
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003114
        artikel: '2'
        paragraaf: '2'
  - number: 10.1.d
    text: |-
      indien na de inschrijving het ernstige vermoeden bestaat dat het onderzoek van het farmaceutische product en van de
      bestanddelen daarvan niet geschiedt met gebruikmaking van de desbetreffende in het register opgenomen analyse- en
      andere controlemethodieken.
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel10
  - number: '10.2'
    text: |-
      Indien na de inschrijving van een farmaceutisch product in een register blijkt dat de etikettering of de bijsluiter
      van dat product niet voldoet aan het Besluit etikettering en bijsluiter farmaceutische producten of, in voorkomend
      geval aan andere van toepassing zijnde, krachtens [artikel 26, onder ][ref1] ter zake gegevens voorschriften,
      kan het college de inschrijving schorsen, totdat de etikettering of de bijsluiter met die voorschriften in
      overeenstemming is gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0002290#Artikel26
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002290
        artikel: '26'
  - number: '11'
    text: 'Het college haalt een inschrijving in een register door:'
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel11
  - number: 11.a
    text: |-
      indien op grond van na de inschrijving ter kennis van het college gekomen feiten alsnog blijkt dat het
      desbetreffende farmaceutische product niet voldoet aan hetgeen is bepaald in [artikel 3, eerste lid, onder ][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002290#Artikel3
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002290
        artikel: '3'
  - number: 11.b
    text: |-
      indien na de inschrijving blijkt dat de aanvraag tot inschrijving in het desbetreffende register onjuiste gegevens
      of bescheiden bevat;
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel11
  - number: 11.c
    text: |-
      indien na de inschrijving blijkt dat de in [artikel 2, eerste lid, onderdeel ][ref1], bedoelde controlemethodieken
      niet meer in overeenstemming zijn met de stand van wetenschap en techniek;


      [ref1]: https://wetten.overheid.nl/BWBR0003114#Artikel2
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0003114
        artikel: '2'
        paragraaf: '2'
  - number: 11.d
    text: |-
      indien na de inschrijving blijkt dat het onderzoek van het farmaceutische product en van de bestanddelen
      daarvan niet geschiedt met gebruikmaking van de desbetreffende in het register opgenomen analyse- en andere
      controlemethodieken;
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel11
  - number: 11.e
    text: |-
      op een per aangetekende brief gedaan verzoek van de registratiehouder, zijnde de fabrikant van het farmaceutische
      product, onderscheidenlijk van de registratiehouder, niet zijnde de fabrikant van het farmaceutische product,
      indien zijn verzoek is vergezeld van een verklaring van de fabrikant van het product, dat deze akkoord gaat met
      de doorhaling;
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel11
  - number: 11.f
    text: |-
      indien de krachtens [artikel 15][ref1] verschuldigde vergoeding niet binnen dertig dagen nadat deze verschuldigd
      is geworden, is voldaan en evenmin gevolg is gegeven aan de aanmaning van het college, gedaan na afloop van die
      termijn, om alsnog binnen acht dagen te betalen.


      [ref1]: https://wetten.overheid.nl/BWBR0003114#Artikel15
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0003114
        artikel: '15'
        paragraaf: '2'
  - number: '12.1'
    text: |-
      Indien blijkt dat degene die de inschrijving heeft aangevraagd of degene te wiens name de farmaceutische specialité
      of het farmaceutische preparaat in het desbetreffende register staat ingeschreven aan bij het college gerezen
      bedenkingen tegemoet kan komen, stelt het college hem daartoe, binnen een door het college te bepalen termijn, in
      de gelegenheid.
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel12
  - number: '12.2'
    text: |-
      In het geval bedoeld in het eerste lid, is [artikel 8][ref1] niet van toepassing en neemt het college zijn
      beslissing zo spoedig mogelijk, doch uiterlijk binnen 210 dagen na afloop van de in het eerste lid bedoelde
      termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0003114#Artikel8
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0003114
        artikel: '8'
        paragraaf: '2'
  - number: 12a.1
    text: |-
      Het college is bevoegd een procedure bij het comité aanhangig te maken, indien er naar zijn oordeel sprake is van
      onderling afwijkende besluiten van de bevoegde instanties in de lid-staten, Nederland inbegrepen, betreffende:
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel12a
  - number: 12a.1.a
    text: de inschrijving, dan wel de vergunning;
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel12a
  - number: 12a.1.b
    text: de schorsing of doorhaling van een inschrijving, dan wel de schorsing of intrekking van een vergunning,
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel12a
  - number: 12a.2
    text: |-
      Alleen in specifieke gevallen, wanneer de belangen van de Europese Gemeenschap in het geding zijn, kan het college
      bij het comité een procedure aanhangig maken ten aanzien van een voorgenomen besluit tot schorsing, intrekking of
      wijziging van de vergunning voor een farmaceutisch product, zulks onder vermelding van feiten en omstandigheden en
      verstrekking van gegevens.
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel12a
  - number: 12a.3
    text: |-
      Een zelfde bevoegdheid als bedoeld in het eerste en tweede lid, komt toe aan de registratiehouder van een in
      Nederland ingeschreven product.
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel12a
  - number: 12a.4
    text: |-
      Het college stelt de registratiehouder in kennis van het aanhangig maken van een procedure als bedoeld in het
      eerste en tweede lid, onder toezending van afschriften van de aan het comité verstrekte informatie.
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel12a
  - number: 12b.1
    text: |-
      In afwijking van [artikel 3, eerste lid, derde volzin, en tweede lid, van de wet ][ref1]gaat het college
      binnen dertig dagen na ontvangst van de kennisgeving van een uitspraak in een procedure als bedoeld in de
      [artikelen 7][ref2] en [12][ref3], over tot uitvoering van de beschikking van de commissie of de raad inzake een
      aanvraag tot inschrijving, de schorsing, doorhaling of wijziging van een inschrijving. Bestaande besluiten worden
      binnen de in de eerste volzin gestelde termijn, zo nodig, herzien overeenkomstig de beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0002290#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003114#Artikel7e
      [ref3]: https://wetten.overheid.nl/BWBR0003114#Artikel12a
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel12b
    references:
      - id: ref1
        bwb_id: BWBR0002290
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0003114
        artikel: 7e
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0003114
        artikel: 12a
        paragraaf: '2'
  - number: 12b.2
    text: |-
      Het college geeft van de uitvoering van de beschikking, bedoeld in het eerste lid, kennis aan de commissie en het
      comité.
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel12b
  - number: 12b.3
    text: |-
      Ten aanzien van een farmaceutisch product waarover een uitspraak in een procedure is gedaan, blijven de
      [artikelen 10][ref1] en [11][ref2] buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003114#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0003114#Artikel11
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel12b
    references:
      - id: ref1
        bwb_id: BWBR0003114
        artikel: '10'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0003114
        artikel: '11'
        paragraaf: '2'
  - number: 12b.4
    text: |-
      Het bepaalde in dit artikel geldt ook, indien een procedure aanhangig is gemaakt door de bevoegde instantie van een
      andere lid-staat, de commissie of een persoon, rechtspersoon inbegrepen, die voor het in de handel brengen van een
      farmaceutisch product verantwoordelijk zal zijn of is.
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel12b
  - number: 12c.1
    text: |-
      Het college geeft het comité kennis van gevallen waarin, naar zijn oordeel, het wijzigen, schorsen of doorhalen van
      een inschrijving die hij krachtens een uitspraak van de commissie of de raad heeft verricht, nodig is met het oog
      op de bescherming van de volksgezondheid.
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel12c
  - number: 12c.2
    text: |-
      [Artikel 12][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003114#Artikel12b
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel12c
    references:
      - id: ref1
        bwb_id: BWBR0003114
        artikel: 12b
        paragraaf: '2'
  - number: '14.1'
    text: |-
      Het college geeft van een beslissing terzake van een aanvraag tot inschrijving in een register, onderscheidenlijk
      terzake van een schorsing en van een doorhaling van een inschrijving in een register kennis aan de hoofdinspecteur.
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel14
  - number: '14.2'
    text: |-
      In gevallen van weigering, schorsing, opheffing van schorsing of doorhaling geschiedt de kennisgeving onverwijld.
      In gevallen van inschrijving geschiedt de kennisgeving zo spoedig mogelijk, onder vermelding van de datum en het
      nummer van de inschrijving, de naam van de registratiehouder, alsmede van de kwantitatieve samenstelling van de
      werkzame bestanddelen van het farmaceutische product, de wijze van gebruik en het indicatiegebied van het product.
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel14
  - number: '14.3'
    text: |-
      Van besluiten tot inschrijving, schorsing, opheffing van schorsing of doorhaling wordt door het college in ieder
      geval mededeling gedaan in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel14
  - number: '14.4'
    text: |-
      Het college doet op gelijke wijze als bedoeld in het derde lid mededeling van beslissingen tot weigering van een
      inschrijving van farmaceutische producten als bedoeld in artikel II, leden 4-6, van de wet van 29 augustus 1975
      (*Stb.* 519) tot nadere wijziging van de [Wet op de Geneesmiddelenvoorziening][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002290
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002290
  - number: '14.5'
    text: |-
      Indien geen verlenging van een inschrijving in een register als bedoeld in
      [artikel 3, tweede lid, van de wet][ref1] heeft plaatsgevonden, wordt het vervallen van die inschrijving door het
      college aan de hoofdinspecteur medegedeeld en volgt mededeling in de *Staatscourant*. Het college is bevoegd het
      vervallen van een inschrijving tevens op andere wijze mede te delen.


      [ref1]: https://wetten.overheid.nl/BWBR0002290#Artikel3
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002290
        artikel: '3'
  - number: '15.1'
    text: |-
      Voor de instandhouding van de inschrijving in een register van een farmaceutisch product is de registratiehouder
      een jaarlijkse vergoeding verschuldigd.
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel15
  - number: '15.2'
    text: |-
      Indien [artikel 19][ref1], toepassing heeft gevonden, komen de in dat artikellid bedoelde subsidies ten laste van
      de registratievergoeding, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0003114#Artikel19b
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0003114
        artikel: 19b
        paragraaf: '3'
  - number: '16.1'
    text: |-
      De registratiehouder is verplicht om de in [artikel 2, eerste lid, onderdeel ][ref1], bedoelde controlemethodieken
      in overeenstemming te houden met de vooruitgang van wetenschap en techniek en zo nodig daarin wijziging aan te
      brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0003114#Artikel2
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0003114
        artikel: '2'
        paragraaf: '2'
  - number: '16.2'
    text: |-
      De registratiehouder is verplicht, onverwijld nadat zulks te zijner kennis is gekomen, het college en de
      hoofdinspecteur mededeling te doen van:
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel16
  - number: 16.2.a
    text: |-
      een maatregel, inhoudende een verbod of een beperking van de aflevering van het farmaceutische product, welke door
      een overheidsinstantie in het buitenland is getroffen op grond van volksgezondheidsoverwegingen;
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel16
  - number: 16.2.b
    text: |-
      gegevens welke niet in het desbetreffende register zijn opgenomen en welke een nieuw element bevatten met
      betrekking tot de werking van het farmaceutisch product, waaronder begrepen de werkzaamheid ten aanzien van de in
      het desbetreffende register opgenomen indicaties, en de contra-indicaties van het farmaceutisch product.
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel16
  - number: '17.1'
    text: 'Het is verboden zonder voorafgaande toestemming van het college:'
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel17
  - number: 17.1.a
    text: |-
      met betrekking tot een geregistreerd farmaceutisch product een wijziging aan te brengen, welke tot wijziging van
      een gegeven als bedoeld in [artikel 2, eerste lid, onder ][ref1], zoals dat in het desbetreffende register is
      opgenomen, noopt;


      [ref1]: https://wetten.overheid.nl/BWBR0003114#Artikel2
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0003114
        artikel: '2'
        paragraaf: '2'
  - number: 17.1.b
    text: |-
      met betrekking tot een farmaceutisch product, behorende tot die bedoeld in artikel II, leden 4-6, van de wet van
      29 augustus 1975 (*Stb.* 519) een wijziging aan te brengen, welke tot wijziging van een gegeven als bedoeld in
      [artikel 2, eerste lid, onder ][ref1], noopt.


      [ref1]: https://wetten.overheid.nl/BWBR0003114#Artikel2
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0003114
        artikel: '2'
        paragraaf: '2'
  - number: '17.2'
    text: |-
      Een verzoek om toestemming wordt ingediend door de registratiehouder onderscheidenlijk, in geval het betreft een
      farmaceutisch product als bedoeld in het eerste lid, onder *b*, door degeen die de aanvraag tot inschrijving heeft
      ingediend.
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel17
  - number: '17.3'
    text: |-
      Het college maakt zijn besluit tot toestemming binnen 30 dagen na ontvangst van het verzoek tot toestemming bekend.
      Indien het besluit niet binnen deze termijn kan worden gegeven, stelt het college de aanvrager daarvan in kennis
      en noemt daarbij een redelijke termijn, die ten hoogste 120 dagen na ontvangst van het verzoek tot toestemming kan
      bedragen, waarbinnen het besluit wel tegemoet kan worden gezien.
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel17
  - number: '17.4'
    text: |-
      Door een persoon als bedoeld in het tweede lid moet onverwijld aan het college kennis worden gegeven voor zover
      het betreft:
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel17
  - number: 17.4.a
    text: |-
      een wijziging van de niet-werkzame bestanddelen van het farmaceutische product, welke naar redelijkerwijs mag
      worden aangenomen geen invloed heeft op de werking van het product;
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel17
  - number: 17.4.b
    text: |-
      een wijziging van de bereidingswijze, welke naar redelijkerwijs mag worden aangenomen geen invloed heeft op de
      werking van het farmaceutische product.
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel17
  - number: '17.5'
    text: |-
      Door een persoon als bedoeld in het tweede lid moet eveneens onverwijld aan het college kennis worden gegeven in
      geval het betreft een wijziging van de gegevens, genoemd in [artikel 2, eerste lid, onder ][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003114#Artikel2
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0003114
        artikel: '2'
        paragraaf: '2'
  - number: '17.6'
    text: |-
      In geval naar het oordeel van het college een wijziging als bedoeld in het vierde lid wèl invloed heeft op de
      werking van het farmaceutische product, maakt het college dat onverwijld bekend. In zodanig geval geldt het eerste
      lid en behandelt het college de in het vierde onderscheidenlijk vijfde lid bedoelde kennisgeving als een verzoek om
      toestemming als bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel17
  - number: '17.7'
    text: |-
      Door een persoon als bedoeld in het tweede lid moeten alle voorgestelde wijzigingen van de gegevens, genoemd in
      [artikel 2, eerste lid, onder ][ref1], worden voorgelegd aan het college. Indien het college binnen een termijn
      van negentig dagen na de indiening van de aanvraag tot wijziging zich niet tegen de voorgestelde wijzigingen heeft
      uitgesproken, mag bedoelde persoon de wijzigingen ten uitvoer brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0003114#Artikel2
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0003114
        artikel: '2'
        paragraaf: '2'
  - number: '17.8'
    text: |-
      Het college brengt het desbetreffende register, in geval het betreft een farmaceutisch product als bedoeld in
      het eerste lid, onder *a*, in overeenstemming met de wijzigingen waarvoor toestemming is verleend en met de
      wijzigingen, bedoeld in het vierde en vijfde lid. In geval het betreft een farmaceutisch product als bedoeld in het
      eerste lid, onder *b*, wordt de desbetreffende aanvraag tot inschrijving geacht te zijn gewijzigd overeenkomstig de
      wijzigingen waarvoor toestemming is verleend en de wijzigingen, bedoeld in het vierde en vijfde lid.
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel17
  - number: '17.9'
    text: Het college stelt de hoofdinspecteur in kennis van de in het zevende lid bedoelde wijzigingen.
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel17
  - number: '17.10'
    text: |-
      Bij ministeriële regeling kunnen voorschriften worden gegeven ten aanzien van wijzigingen als bedoeld in dit
      artikel.
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel17
  - number: '18'
    text: |-
      Voor de behandeling van een verzoek tot toestemming van een wijziging als bedoeld in
      [artikel 17, eerste lid][ref1], is de verzoeker een vergoeding verschuldigd. Een bewijs van betaling van de
      vergoeding wordt bij de aanvraag gevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0003114#Artikel17
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0003114
        artikel: '17'
        paragraaf: '2'
  - number: 19a
    text: 'In deze paragraaf wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel19a
  - number: 19a.a
    text: |-
      bijwerking: een reactie op een geneesmiddel die schadelijk en onbedoeld is en die optreedt bij doses die normaal
      voor het genezen, lenigen of voorkomen van een ziekte, wond of pijn bij de mens, het herstellen, verbeteren of
      anderszins wijzigen van organische functies van de mens of het stellen van een geneeskundige diagnose bij de mens
      worden gebruikt;
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel19a
  - number: 19a.b
    text: |-
      ernstige bijwerking: een bijwerking die tot de dood leidt, levensgevaar oplevert, opneming in een ziekenhuis
      of een verlenging van een verblijf in een ziekenhuis vereist, blijvende of significante invaliditeit of
      arbeidsongeschiktheid dan wel een aangeboren afwijking veroorzaakt;
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel19a
  - number: 19a.c
    text: |-
      onverwachte bijwerking: een bijwerking waarvan de aard, de ernst of het gevolg niet verenigbaar is met de
      samenvatting van de kenmerken van het product;
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel19a
  - number: 19a.d
    text: |-
      veiligheidsonderzoek na verlening van de handelsvergunning: een farmaco-epidemiologisch onderzoek of een klinisch
      onderzoek dat overeenkomstig de voorwaarden van de vergunning voor het in de handel brengen wordt uitgevoerd
      teneinde een gevaar voor de veiligheid in verband met een geneesmiddel waarvoor een handelsvergunning is verleend,
      te specificeren of te kwantificeren;
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel19a
  - number: 19a.e
    text: |-
      misbruik van geneesmiddelen: een aanhoudend of incidenteel opzettelijk overmatig gebruik van geneesmiddelen dat
      gepaard gaat met schadelijke lichamelijke of psychische effecten.
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel19a
  - number: 19b.1
    text: |-
      Onze Minister bevordert de totstandkoming en instandhouding van samenwerkingsorganen van beroepsbeoefenaren die tot
      doel hebben het verzamelen, registreren en analyseren van gegevens over bijwerkingen en het gebruik en misbruik van
      geneesmiddelen die in de handel zijn.
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel19b
  - number: 19b.2
    text: |-
      De organen, bedoeld in het eerste lid, aan welke door Onze Minister subsidie wordt verleend voor activiteiten
      betreffende of verband houdende met de verzameling en verstrekking van gegevens, verstrekken Onze Minister de
      informatie over bijwerkingen en het gebruik van geneesmiddelen die in verband met de uitvoering van de taken en
      bevoegdheden betreffende de registratie van geneesmiddelen wordt verlangd.
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel19b
  - number: 19b.3
    text: |-
      Onze Minister bevordert de coördinatie van de informatievoorziening door ervoor te zorgen dat, tezamen met de
      organen, bedoeld in het eerste lid, voorzieningen worden getroffen met betrekking tot de afstemming van taken
      en werkzaamheden, de aard van de te verzamelen gegevens ten behoeve van het toezicht en de wijze van opslag en
      verwerking daarvan, alsmede de wijze en regelmaat van verstrekking van de informatie aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel19b
  - number: 19b.4
    text: |-
      Onze Minister bevordert, door overleg, de samenwerking op het gebied van de informatievoorziening met andere
      organen, diensten en instellingen waarvan het werkterrein het verzamelen en onderzoek van gegevens over
      bijwerkingen en het gebruik van geneesmiddelen omvat.
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel19b
  - number: 19b.5
    text: |-
      Onze Minister en het college regelen in onderling overleg de wijze waarop en de regelmaat waarmee de informatie aan
      het college wordt toegezonden.
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel19b
  - number: 19b.6
    text: |-
      Onze Minister draagt ervoor zorg dat de in dit artikel bedoelde informatie ten behoeve van het college in zodanige
      vorm wordt opgevraagd en verstrekt dat de anonimiteit van degene te wiens naam gegevens zijn geregistreerd, wordt
      gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel19b
  - number: 19b.7
    text: |-
      Onze Minister draagt ervoor zorg dat persoonsgegevens, in aanvulling op verkregen anonieme informatie, alleen
      kunnen worden opgevraagd en verstrekt in spoedeisende gevallen en indien zij, naar het oordeel van het college,
      volstrekt onmisbaar zijn voor een zorgvuldige beoordeling van bijwerkingen.
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel19b
  - number: 19c.1
    text: |-
      De registratiehouder behartigt de goede zorg voor de bewaking van geneesmiddelen die door hem in de handel zijn
      gebracht, door:
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel19c
  - number: 19c.1.a
    text: |-
      het systematisch verzamelen en ordenen van gegevens over alle vermoedelijke bijwerkingen van een geneesmiddel die
      door beroepsbeoefenaren in de gezondheidszorg ter kennis worden gebracht of op een andere wijze ter kennis komen
      van degenen die in dienst van zijn onderneming werken;
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel19c
  - number: 19c.1.b
    text: |-
      het opstellen van verslagen op de wijze, bedoeld in de door de Europese Commissie opgestelde richtsnoeren voor de
      geneesmiddelenbewaking die zijn gepubliceerd in deel 9 van de Voorschriften inzake geneesmiddelen in de Europese
      Unie, over alle vermoedelijk ernstige bijwerkingen en alle andere vermoedelijke bijwerkingen, onder vermelding van
      de uitkomst van een wetenschappelijke beoordeling van de bijwerkingen;
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel19c
  - number: 19c.1.c
    text: |-
      ervoor te zorgen dat aan het college, binnen een door het college te stellen termijn, aanvullende gegevens worden
      verstrekt ten behoeve van de beoordeling van de aan een geneesmiddel verbonden voordelen en risicos, met inbegrip
      van gegevens over veiligheidsonderzoek na verlening van de handelsvergunning, het afzetvolume van of het aantal
      recepten voor dat geneesmiddel.
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel19c
  - number: 19c.2
    text: |-
      De registratiehouder heeft een persoon in dienst dan wel op grond van een andere overeenkomst dan een
      arbeidsovereenkomst tot zijn beschikking die is belast met de werkzaamheden, bedoeld in het eerste lid, en daarvoor
      is gekwalificeerd.
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel19c
  - number: 19d.1
    text: |-
      Tenzij als voorwaarde bij de registratie anderen eisen zijn gesteld dan wel de in
      [artikel 19c, eerste lid, onder b][ref1], bedoelde richtsnoeren anders bepalen, worden de verslagen, bedoeld in
      [artikel 19c, eerste lid, onder b][ref2], gedurende een periode van 2 jaar na de registratie van het geneesmiddel
      elk half jaar aan het college gezonden. Na het verstrijken van de in de vorige zin genoemde periode worden de
      verslagen gedurende een periode van 2 jaar ten minste een maal per jaar en bij het verzoek om verlenging van de
      registratie aan het college verzonden.


      [ref1]: https://wetten.overheid.nl/BWBR0003114#Artikel19c
      [ref2]: https://wetten.overheid.nl/BWBR0003114#Artikel19c
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel19d
    references:
      - id: ref1
        bwb_id: BWBR0003114
        artikel: 19c
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0003114
        artikel: 19c
        paragraaf: '3'
  - number: 19d.2
    text: |-
      De registratiehouder zendt het college desgevraagd ook tussentijds verslagen als bedoeld in
      [artikel 19c, eerste lid, onder b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003114#Artikel19c
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel19d
    references:
      - id: ref1
        bwb_id: BWBR0003114
        artikel: 19c
        paragraaf: '3'
  - number: 19e.1
    text: |-
      De registratiehouder doet van elke vermoedelijk ernstige bijwerking van een geneesmiddel die hem ter kennis
      is gebracht, of die overeenkomstig de in [artikel 19c, eerste lid, onder b][ref1], bedoelde richtsnoeren aan
      de rapportagecriteria voldoet en waarvan redelijkerwijs kan worden verwacht dat hij daarvan op de hoogte is,
      onverwijld en in elk geval binnen 15 dagen na ontvangst van die kennisgeving, mededeling aan het college of de
      bevoegde instantie van de lidstaat waar de ernstige bijwerking zich heeft voorgedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0003114#Artikel19c
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel19e
    references:
      - id: ref1
        bwb_id: BWBR0003114
        artikel: 19c
        paragraaf: '3'
  - number: 19e.2
    text: |-
      De registratiehouder zorgt ervoor van dat elke vermoedelijke ernstige onverwachte bijwerking die zich op het
      grondgebied van een land buiten de Europese Gemeenschap voordoet en die hem door een beroepsbeoefenaar in de
      gezondheidszorg wordt gemeld, onverwijld en in elk geval binnen 15 dagen na ontvangst van die melding kennis wordt
      gegeven op de wijze, bedoeld in de in [artikel 19c, eerste lid, onder b][ref1], bedoelde richtsnoeren.


      [ref1]: https://wetten.overheid.nl/BWBR0003114#Artikel19c
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel19e
    references:
      - id: ref1
        bwb_id: BWBR0003114
        artikel: 19c
        paragraaf: '3'
  - number: 19e.3
    text: |-
      Indien het gaat om geneesmiddelen die vallen binnen het toepassingsgebied van [richtlijn 87/22/EEG](31987L0022)
      van de Raad van Europese Gemeenschappen van 22 december 1986 tot onderlinge aanpassing van de nationale maatregelen
      inzake het in de handel brengen van met behulp van hoogwaardige technieken, met name biotechnieken, vervaardigde
      geneesmiddelen (Pb EG L 15) of van geneesmiddelen die zijn geregistreerd conform de procedure, genoemd in de
      [artikelen 7b tot en met 7e][ref1], zorgt de registratiehouder er voor dat elke vermoedelijke ernstige bijwerking
      wordt gemeld in de vorm en met de frequentie die worden overeengekomen met de lidstaat of de bevoegde autoriteit
      van de lidstaat die het geneesmiddel als eerste heeft geregistreerd op een zodanige wijze dat de informatie
      toegankelijk is voor die lidstaat of de bevoegde autoriteit daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0003114#Artikel7b
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel19e
    references:
      - id: ref1
        bwb_id: BWBR0003114
        artikel: 7b
        paragraaf: '2'
  - number: 19f.1
    text: |-
      Het college zorgt ervoor dat van een vermoedelijk ernstige bijwerking die hem wordt gemeld, onverwijld en in
      elk geval binnen 15 dagen na de ontvangst van die melding, kennis wordt gegeven aan het Europees Bureau voor
      de geneesmiddelenbeoordeling, de andere lidstaten en, indien de melding niet van hem afkomstig is, aan de
      registratiehouder.
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel19f
  - number: 19f.2
    text: |-
      Indien het college op grond van zijn beoordeling van de verslagen omtrent bijwerkingen voornemens is de
      registratie van een geneesmiddel, conform de in [artikel 19c, eerste lid, onder b][ref1], bedoelde richtsnoeren,
      te wijzigen, te schorsen of door te halen, geeft hij daarvan onverwijld kennis aan het Europees Bureau voor de
      geneesmiddelenbeoordeling, aan de andere lidstaten en aan de registratiehouder. In noodgevallen kan het college de
      registratie van een geneesmiddel schorsen, mits het Europees Bureau voor de geneesmiddelenbeoordeling, de Europese
      Commissie en de andere lidstaten hiervan uiterlijk op de volgende werkdag in kennis worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003114#Artikel19c
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel19f
    references:
      - id: ref1
        bwb_id: BWBR0003114
        artikel: 19c
        paragraaf: '3'
  - number: '20.1'
    text: 'Een register bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel20
  - number: 20.1.a
    text: registerbladen;
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel20
  - number: 20.1.b
    text: |-
      de bij een aanvraag tot inschrijving in een register verstrekte gegevens en bescheiden zoals deze voor de
      inschrijving zijn aanvaard, of zoals deze zijn gewijzigd ingevolge [artikel 17][ref1], dan wel de gegevens
      verstrekt ingevolge [artikel 23, derde of elfde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003114#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0003114#Artikel23
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0003114
        artikel: '17'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0003114
        artikel: '23'
        paragraaf: '5'
  - number: '20.2'
    text: 'Onze Minister geeft voorschriften met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel20
  - number: 20.2.a
    text: het model van de in het eerste lid bedoelde registerbladen;
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel20
  - number: 20.2.b
    text: |-
      de wijze van inschrijving in een register en van de doorhaling van een inschrijving, alsmede de wijze waarop de
      schorsing van een inschrijving en het in [artikel 14, vijfde lid][ref1], bedoelde vervallen van een inschrijving in
      het register wordt aangegeven;


      [ref1]: https://wetten.overheid.nl/BWBR0003114#Artikel14
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0003114
        artikel: '14'
        paragraaf: '2'
  - number: 20.2.c
    text: de bewaring van een register;
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel20
  - number: 20.2.d
    text: |-
      het verstrekken van inzage in het in het eerste lid, onder *a*, bedoelde deel van het register en het verstrekken
      van afschriften van op registerbladen vermelde gegevens;
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel20
  - number: 20.2.e
    text: de te betalen vergoeding voor het verstrekken van de onder *d* bedoelde afschriften.
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel20
  - number: '21.1'
    text: |-
      [Artikel 3, vierde lid, van de wet][ref1] is niet van toepassing ten aanzien van farmaceutische producten,
      behorende tot één der categorieën, vermeld op de bij dit besluit behorende bijlage.


      [ref1]: https://wetten.overheid.nl/BWBR0002290#Artikel3
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0002290
        artikel: '3'
  - number: '21.2'
    text: |-
      [Artikel 3, vierde lid, van de wet][ref1] is voor wat betreft het bereiden en invoeren eveneens niet van toepassing
      ten aanzien van farmaceutische producten welke uitsluitend in het buitenland in de handel zullen worden gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0002290#Artikel3
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0002290
        artikel: '3'
  - number: '22'
    text: |-
      Ingeval een inschrijving in een register is doorgehaald op grond van een verzoek van de registratiehouder of geen
      verlenging van een inschrijving in een register als bedoeld in [artikel 3, tweede lid, van de wet ][ref1]heeft
      plaatsgevonden, gelden met betrekking tot het desbetreffende farmaceutische product de verboden, vervat in
      [artikel 3, vierde lid, van de wet][ref2], met uitzondering van die welke betrekking hebben op het bereiden
      en invoeren, niet gedurende een termijn van 12 maanden na de datum waarop de inschrijving is doorgehaald
      onderscheidenlijk is vervallen.


      [ref1]: https://wetten.overheid.nl/BWBR0002290#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002290#Artikel3
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0002290
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0002290
        artikel: '3'
  - number: '23.1'
    text: |-
      Een farmaceutisch product mag ter aflevering in Nederland uitsluitend worden ingevoerd, dan wel uit een lid-staat
      worden betrokken door de houder van de registratie van dat product.
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel23
  - number: '23.2'
    text: |-
      Een persoon, die een farmaceutisch product zoals het in een andere lid-staat in de handel is gebracht vanuit
      die lid-staat wenst te betrekken kan op zijn verzoek overeenkomstig de volgende leden door het college als
      registratiehouder in het desbetreffende register worden opgenomen:
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel23
  - number: 23.2.a
    text: 'indien het een product betreft dat:'
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel23
  - number: 23.2.a.1°
    text: |-
      in kwalitatieve en kwantitatieve samenstelling gelijk is aan een farmaceutisch product, geregistreerd op grond
      van een in [artikel 3, eerste lid, van de wet][ref1] bedoelde aanvraag, hetzij nagenoeg gelijk is aan een zodanig
      geregistreerd farmaceutisch product en dezelfde werking heeft als dat product,


      [ref1]: https://wetten.overheid.nl/BWBR0002290#Artikel3
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0002290
        artikel: '3'
  - number: 23.2.a.2°
    text: |-
      is bereid door dezelfde fabrikant als die van het geregistreerde product, hetzij is bereid door een andere
      fabrikant, behorende tot hetzelfde concern als de fabrikant van het geregistreerde product, dan wel door een
      licentiehouder van de fabrikant van het geregistreerde product,
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel23
  - number: 23.2.a.3°
    text: dezelfde farmaceutische vorm heeft als het onder 1° bedoelde geregistreerde product;
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel23
  - number: 23.2.b
    text: |-
      indien het een farmaceutische specialité betreft welke zowel in Nederland als in de desbetreffende lid-staat is
      geregistreerd.
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel23
  - number: '23.3'
    text: |-
      Een in het tweede lid bedoeld verzoek met betrekking tot een in dat lid, onder *a*, bedoeld product moet de
      volgende gegevens bevatten:
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel23
  - number: 23.3.a
    text: de naam en het adres van de verzoeker;
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel23
  - number: 23.3.b
    text: de naam van de lid-staat van waaruit het farmaceutische product zal worden betrokken;
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel23
  - number: 23.3.c
    text: de benaming waaronder het product in de onder *b* bedoelde lid-staat in de handel wordt gebracht;
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel23
  - number: 23.3.d
    text: |-
      de naam en het adres van degeen die voor het in de handel brengen van het product in de onder *b* bedoelde lid-
      staat verantwoordelijk is;
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel23
  - number: 23.3.e
    text: de vermelding van de farmaceutische vorm van het product;
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel23
  - number: 23.3.f
    text: |-
      de benaming van het in het tweede lid, onder *a*, bedoelde geregistreerde farmaceutische product en het nummer
      waaronder dat product in het register is ingeschreven;
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel23
  - number: 23.3.g
    text: de benaming waaronder het product in de handel zal worden gebracht.
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel23
  - number: '23.4'
    text: |-
      Een in het derde lid bedoeld verzoek wordt vergezeld van een voor onderzoek van het farmaceutische product
      voldoende aantal handelsverpakkingen waarin het in de desbetreffende lid-staat in de handel wordt gebracht.
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel23
  - number: '23.5'
    text: |-
      Aan een in het derde lid bedoeld verzoek wordt door het college, zo nodig na onderzoek van het farmaceutische
      product, gevolg gegeven, indien naar het oordeel van het college redelijkerwijs mag worden aangenomen dat het
      product voldoet aan hetgeen in het tweede lid, onder *a*, is gesteld.
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel23
  - number: '23.6'
    text: |-
      Indien het college ter vaststelling van hetgeen in het tweede lid, onder *a*, is gesteld, de beschikking over
      gegevens inzake de kwalitatieve en kwantitatieve samenstelling van het farmaceutische product, of in bijzondere
      gevallen inzake de bereidingswijze van dat product, noodzakelijk acht, verzoekt het college, zo nodig door
      tussenkomst van Onze Minister, aan de instantie die terzake van het in het derde lid bedoelde product vergunning
      heeft verleend voor het in de in dat lid, onder *b*, bedoelde lid-staat in de handel brengen om toezending van de
      desbetreffende gegevens.
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel23
  - number: '23.7'
    text: |-
      Indien het college gevolg geeft aan een in het derde lid bedoeld verzoek, wordt het farmaceutische product zoals
      het in de handel zal worden gebracht door het college in het desbetreffende register ingeschreven ten name van de
      in het derde lid, onder *a*, bedoelde verzoeker.
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel23
  - number: '23.8'
    text: |-
      Het college maakt zijn besluit zo spoedig mogelijk, doch behoudens overmacht, binnen 45 dagen na datum van
      ontvangst van het verzoek bekend. Bij toepassing van het zevende lid wordt bij die bekendmaking vermeldt de datum
      waarop en het nummer waaronder het product zoals het door de verzoeker in de handel zal worden gebracht in het
      desbetreffende register ingeschreven. Van het besluit wordt een afschrift gestuurd aan de hoofdinspecteur en
      mededeling gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel23
  - number: '23.9'
    text: |-
      In geval na toepassing van het zevende lid een ander dan een in dat lid bedoelde registratiehouder hetzelfde
      farmaceutische product uit dezelfde lid-staat wenst te betrekken, wordt het product zoals het door die andere
      persoon in de handel zal worden gebracht op zijn verzoek in het desbetreffende register ingeschreven te zijnen
      name. Een desbetreffend verzoek moet de in het derde lid bedoelde gegevens bevatten. Het college maakt de
      inschrijving binnen 15 dagen na de datum van ontvangst van het verzoek bekend onder vermelding van de datum
      waarop en het nummer waaronder het product zoals het door die persoon in de handel zal worden gebracht in het
      desbetreffende register is ingeschreven. De laatste volzin van het achtste lid is van toepassing.
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel23
  - number: '23.10'
    text: |-
      Een inschrijving ingevolge het zevende en negende lid geldt uitsluitend voor dezelfde indicaties, contra-
      indicaties, bijwerkingen, dosering, wijze van gebruik en wijze van toediening als die van het in het tweede lid,
      onder *a*, bedoelde geregistreerde farmaceutische product.
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel23
  - number: '23.11'
    text: |-
      Een in het tweede lid bedoeld verzoek met betrekking tot een in dat lid, onder *b*, bedoelde farmaceutische
      specialité moet de volgende gegevens bevatten:
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel23
  - number: 23.11.a
    text: de naam en het adres van de verzoeker;
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel23
  - number: 23.11.b
    text: |-
      de benaming van de farmaceutische specialité en het nummer waaronder die farmaceutische specialité in het register
      is ingeschreven;
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel23
  - number: 23.11.c
    text: de naam van de lid-staat van waaruit de farmaceutische specialité zal worden betrokken;
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel23
  - number: 23.11.d
    text: de benaming waaronder de farmaceutische specialité in de handel zal worden gebracht.
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel23
  - number: '23.12'
    text: |-
      Het college maakt de inschrijving binnen 15 dagen na de datum van ontvangst van het verzoek bekend onder vermelding
      van de datum waarop en het nummer waaronder de in het elfde lid, onder *b*, bedoelde farmaceutische specialité
      zoals deze door de verzoeker in de handel zal worden gebracht in het desbetreffende register te zijnen name is
      ingeschreven. De laatste volzin van het achtste lid is van toepassing.
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel23
  - number: '23.13'
    text: |-
      Een inschrijving ingevolge het twaalfde lid geldt uitsluitend voor dezelfde indicaties, contra-indicaties,
      bijwerkingen, dosering, wijze van gebruik en wijze van toediening als die van de in het tweede lid, onder *b*,
      bedoelde geregistreerde farmaceutische specialité.
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel23
  - number: '23.14'
    text: |-
      Voor de behandeling van een in het derde, negende en elfde lid bedoeld verzoek is de verzoeker een vergoeding
      verschuldigd.
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel23
  - number: '23.15'
    text: |-
      Het college schorst een inschrijving ingevolge het zevende en negende onderscheidenlijk het twaalfde lid, indien
      de inschrijving van het desbetreffende in het tweede lid bedoelde geregistreerde farmaceutische product wordt
      geschorst en wel voor hetzelfde tijdvak als dat waarvoor de inschrijving van laatstbedoeld product is geschorst.
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel23
  - number: '23.16'
    text: 'Het college haalt een inschrijving ingevolge het zevende, negende en twaalfde door:'
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel23
  - number: 23.16.a
    text: |-
      indien de inschrijving van het desbetreffende in het tweede lid bedoelde geregistreerde farmaceutische product
      wordt doorgehaald of vervalt;
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel23
  - number: 23.16.b
    text: op een gedaan verzoek van de registratiehouder.
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel23
  - number: 23a.1
    text: |-
      Elk van de in [artikel 23b][ref1] bedoelde vergoedingen kan jaarlijks vóór 1 januari bij ministeriële regeling
      worden verhoogd voor zover de index overheidsconsumptie lonen en salarissen, die door het Centraal Planbureau wordt
      opgesteld daartoe aanleiding geeft. Een vergoeding bedraagt maximaal het desbetreffende in [artikel 23b][ref2]
      genoemde tarief vermeerderd met 15 procent.


      [ref1]: https://wetten.overheid.nl/BWBR0003114#Artikel23b
      [ref2]: https://wetten.overheid.nl/BWBR0003114#Artikel23b
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel23a
    references:
      - id: ref1
        bwb_id: BWBR0003114
        artikel: 23b
        paragraaf: 5a
      - id: ref2
        bwb_id: BWBR0003114
        artikel: 23b
        paragraaf: 5a
  - number: 23a.2
    text: |-
      Bij ministeriële regeling wordt de wijze van betaling vastgesteld, alsmede het tijdstip waarop de vergoedingen
      verschuldigd zijn.
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel23a
  - number: 23a.3
    text: |-
      Bij ministeriële regeling kan een vergoeding op een lager bedrag dan het desbetreffende in [artikel 23][ref1]
      genoemde bedrag worden vastgesteld, indien de kosten die zijn gemoeid met de werkzaamheden van het college waarvoor
      die vergoeding wordt geheven lager zijn dan het desbetreffende in dat artikel genoemde bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0003114#Artikel23b
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel23a
    references:
      - id: ref1
        bwb_id: BWBR0003114
        artikel: 23b
        paragraaf: 5a
  - number: 23a.4
    text: |-
      Onze Minister kan desgevraagd, in het belang van de volksgezondheid, ontheffing verlenen van de verplichting tot
      betaling van een vergoeding.
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel23a
  - number: 23b.1
    text: |-
      De vergoeding, bedoeld in [artikel 4][ref1], bedraagt:


      [ref1]: https://wetten.overheid.nl/BWBR0003114#Artikel4
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel23b
    references:
      - id: ref1
        bwb_id: BWBR0003114
        artikel: '4'
        paragraaf: '2'
  - number: 23b.1.a
    text: |-
      € 43 900,= voor aanvragen tot inschrijving van een farmaceutisch product in één of meer sterkten of farmaceutische
      vormen, niet zijnde een homeopathisch farmaceutisch product, dat een nieuw werkzaam bestanddeel bevat, met dien
      verstande dat indien na de inschrijving een aanvraag voor een vergunning voor het in de handel brengen van dat
      product in een andere lidstaat is ingediend, de aanvrager alsdan tevens een vergoeding van € 19 750,= verschuldigd
      zal zijn;
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel23b
  - number: 23b.1.b
    text: |-
      € 19 780,= indien de aanvraag betrekking heeft op een farmaceutisch product in één of meer sterkten of
      farmaceutisch vormen, niet zijnde een homeopathisch farmaceutisch product, dat een nieuw werkzaam bestanddeel bevat
      en waarvoor in een andere lidstaat reeds een vergunning voor het in de handel brengen is verleend;
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel23b
  - number: 23b.1.c
    text: |-
      € 23 060,= voor aanvragen tot inschrijving van een farmaceutisch product in één of meer sterkten of farmaceutische
      vormen, niet zijnde een homeopathisch farmaceutisch product, dat een bekend werkzaam bestanddeel bevat, met dien
      verstande dat indien na de inschrijving een aanvraag voor een vergunning voor het in de handel brengen van dat
      product in een andere lidstaat is ingediend, de aanvrager alsdan tevens een vergoeding van € 13 810,= verschuldigd
      zal zijn;
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel23b
  - number: 23b.1.d
    text: |-
      € 7700,= indien de aanvraag betrekking heeft op een farmaceutisch product in één of meer sterkten of farmaceutische
      vormen, niet zijnde een homeopathisch farmaceutisch product, dat een bekend werkzaam bestanddeel bevat en waarvoor
      in een andere lidstaat reeds een vergunning voor het in de handel brengen is verleend;
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel23b
  - number: 23b.1.e
    text: |-
      € 14 980,= indien de aanvraag nieuwe sterkten of farmaceutische vormen betreft van een farmaceutisch product dat
      reeds is ingeschreven in het register, met dien verstande dat de vergoeding € 3 660,= bedraagt indien de aanvragen
      betrekking hebben op nieuwe sterkten of farmaceutische vormen van een farmaceutisch product waarvoor in een andere
      lidstaat reeds een vergunning voor het in de handel brengen is verleend;
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel23b
  - number: 23b.1.f
    text: |-
      € 1200,= indien het een aanvraag tot inschrijving betreft van een homeopathisch farmaceutisch product als bedoeld
      in [artikel 4, eerste lid, van het Besluit homeopathische farmaceutische producten][ref1] dan wel van een reeks
      van dergelijke homeopathische farmaceutische producten die uitsluitend van dezelfde homeopathische grondstof zijn
      afgeleid en eenzelfde toedieningsweg kennen;


      [ref1]: https://wetten.overheid.nl/BWBR0005371#Artikel4
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel23b
    references:
      - id: ref1
        bwb_id: BWBR0005371
        artikel: '4'
  - number: 23b.1.g
    text: |-
      €  2400,= indien het een aanvraag tot inschrijving betreft van een homeopathisch farmaceutisch product als bedoeld
      in [artikel 6, eerste lid, van het Besluit homeopathische farmaceutische producten][ref1] dan wel van een reeks
      van dergelijke homeopatische farmaceutische producten die uitsluitend van dezelfde homeopathische grondstof zijn
      afgeleid en eenzelfde toedieningsweg kennen;


      [ref1]: https://wetten.overheid.nl/BWBR0005371#Artikel6
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel23b
    references:
      - id: ref1
        bwb_id: BWBR0005371
        artikel: '6'
  - number: 23b.1.h
    text: |-
      € 1 200,= indien het een aanvraag betreft tot inschrijving van een homeopathisch farmaceutisch product als bedoeld
      in [artikel 6, eerste lid, van het Besluit homeopathische farmaceutische producten][ref1] dan wel van een reeks
      van dergelijke homeopathische farmaceutische producten die uitsluitend van dezelfde homeopathische grondstof
      zijn afgeleid en het product dan wel de reeks van producten bestemd is voor oraal of uitwendig gebruik en zonder
      indicatie op de markt wordt gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0005371#Artikel6
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel23b
    references:
      - id: ref1
        bwb_id: BWBR0005371
        artikel: '6'
  - number: 23b.2
    text: |-
      De vergoeding, bedoeld in [artikel 15][ref1], bedraagt:


      [ref1]: https://wetten.overheid.nl/BWBR0003114#Artikel15
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel23b
    references:
      - id: ref1
        bwb_id: BWBR0003114
        artikel: '15'
        paragraaf: '2'
  - number: 23b.2.a
    text: |-
      € 980,= indien het de instandhouding van de inschrijving van een farmaceutisch product betreft, niet zijnde een
      inschrijving als bedoeld onder b;
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel23b
  - number: 23b.2.b
    text: |-
      € 30,= indien het de instandhouding van de inschrijving van een homeopathisch farmaceutisch product dan wel van een
      reeks van homeopatisch farmaceutische producten als bedoeld in het eerste lid, onder f, g, of h, betreft.
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel23b
  - number: 23b.3
    text: |-
      De vergoeding, bedoeld in [artikel 18][ref1], bedraagt:


      [ref1]: https://wetten.overheid.nl/BWBR0003114#Artikel18
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel23b
    references:
      - id: ref1
        bwb_id: BWBR0003114
        artikel: '18'
        paragraaf: '2'
  - number: 23b.3.a
    text: € 3850,= indien het een ingrijpende wijziging betreft;
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel23b
  - number: 23b.3.b
    text: € 1380,= indien het een geringe wijziging betreft;
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel23b
  - number: 23b.3.c
    text: € 7000,= indien het twee of meer ingrijpende wijzigingen betreft;
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel23b
  - number: 23b.3.d
    text: |-
      € 600,= indien het een wijziging van de inschrijving betreft van een homeopathisch
      farmaceutisch product als bedoeld in de [artikelen 4, eerste lid][ref1], en
      [6, eerste lid, van het Besluit homeopathische farmaceutische producten][ref2] dan wel van een reeks van
      homeopathische farmaceutische producten als bedoeld in het eerste lid, onder f of g.


      [ref1]: https://wetten.overheid.nl/BWBR0005371#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005371#Artikel6
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel23b
    references:
      - id: ref1
        bwb_id: BWBR0005371
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0005371
        artikel: '6'
  - number: 23b.4
    text: |-
      De vergoeding, bedoeld in [artikel 23, veertiende lid][ref1], bedraagt € 1 361,34 .


      [ref1]: https://wetten.overheid.nl/BWBR0003114#Artikel23
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel23b
    references:
      - id: ref1
        bwb_id: BWBR0003114
        artikel: '23'
        paragraaf: '5'
  - number: 23c.1
    text: |-
      In afwijking van artikel 23b, eerste lid, onder a en c, bedraagt de vergoeding voor de behandeling van een aanvraag
      om inschrijving in het register van een farmaceutisch product in één of meer sterkten of farmaceutische vormen,
      niet zijnde een homeopathisch farmaceutisch product, € 5800,= indien daarbij gebruik wordt gemaakt van een dossier
      dat gelijk is aan het dossier betreffende het farmaceutische product dat reeds is ingeschreven in het register,
      hierna te noemen: het originele dossier.
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel23c
  - number: 23c.2
    text: |-
      Indien met gebruikmaking van het originele dossier een aanvraag voor een vergunning voor het in de handel brengen
      van een in Nederland geregistreerd farmaceutisch product in een andere lidstaat wordt ingediend, is de aanvrager
      alsdan tevens een vergoeding van € 14 900,= verschuldigd indien het bij het farmaceutische product waarop het
      originele dossier betrekking heeft, om een nieuw werkzaam bestanddeel ging, dan wel tevens een vergoeding van €
      10 000,= verschuldigd indien het farmaceutische product waarop het originele dossier betrekking heeft, een bekend
      werkzaam bestanddeel bevatte.
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel23c
  - number: '24.1'
    text: |-
      Bij een in [artikel 2][ref1] bedoelde aanvraag tot inschrijving van farmaceutische producten, bedoeld in artikel
      II, vierde en zesde lid, van de wet van 29 augustus 1975 (*Stb.* 519), in het desbetreffende register, behoeven de
      in [artikel 2, eerste lid, onder ][ref2], genoemde gegevens eerst te worden verstrekt nadat daarom door het college
      is verzocht.


      [ref1]: https://wetten.overheid.nl/BWBR0003114#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003114#Artikel2
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0003114
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0003114
        artikel: '2'
        paragraaf: '2'
  - number: '24.2'
    text: |-
      De in [artikel 4][ref1] bedoelde vergoeding voor de behandeling van een aanvraag tot inschrijving in het
      desbetreffende register is niet verschuldigd voor farmaceutische preparaten, voor de aflevering waarvan de
      hoofdinspecteur vóór het in werking treden van dit besluit krachtens artikel 3, eerste lid, van het Besluit
      farmaceutische preparaten, zoals dat luidde onmiddellijk vóór het in werking treden van dit besluit, toestemming
      heeft verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0003114#Artikel4
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0003114
        artikel: '4'
        paragraaf: '2'
  - number: '24.3'
    text: |-
      [Artikel 8][ref1] is voor wat betreft de daarin genoemde termijn niet van toepassing met betrekking tot de in het
      eerste lid bedoelde farmaceutische producten.


      [ref1]: https://wetten.overheid.nl/BWBR0003114#Artikel8
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0003114
        artikel: '8'
        paragraaf: '2'
  - number: '25.1'
    text: |-
      Degeen die verantwoordelijk is voor het in de handel brengen van een farmaceutisch product als bedoeld in
      artikel II, vierde, vijfde of zesde lid, van de wet van 29 augustus 1975 (*Stb.* 519) is, zolang het in
      [artikel 3, vierde lid, van de wet][ref1] vervatte verbod ten aanzien van dat product niet geldt, voor dat product
      een jaarlijkse vergoeding verschuldigd volgens een door Onze Minister vastgesteld tarief.


      [ref1]: https://wetten.overheid.nl/BWBR0002290#Artikel3
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0002290
        artikel: '3'
  - number: '25.2'
    text: |-
      De in het eerste lid bedoelde vergoeding is voor de eerste maal verschuldigd op 1 juli 1978 en vervolgens
      op 1 januari van elk daaropvolgend jaar zolang de beslissing op de aanvraag tot inschrijving in het
      desbetreffende register van een in het eerste lid bedoeld product nog niet onherroepelijk is geworden.
      [Artikel 15, leden 3 en 4][ref1], is van overeenkomstige toepassing, met dien verstande dat in het vierde lid in
      plaats van "een registratiehouder" wordt gelezen: "degeen die verantwoordelijk is voor het in de handel brengen".


      [ref1]: https://wetten.overheid.nl/BWBR0003114#Artikel15
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0003114
        artikel: '15'
        paragraaf: '2'
  - number: '26'
    text: |-
      [Artikel 16][ref1] is van overeenkomstige toepassing ten aanzien van een in [artikel 25, eerste lid][ref2],
      bedoelde persoon, met dien verstande dat in onderdeel *b*, aanhef, van eerstgenoemd artikel in plaats van "gegevens
      welke niet in het desbetreffende register zijn opgenomen" wordt gelezen: "gegevens welke niet bij de aanvraag tot
      inschrijving zijn verstrekt" en in dat onderdeel, onder 1°, in plaats van "in het desbetreffende register opgenomen
      indicaties" wordt gelezen: "de bij de aanvraag opgegeven indicaties".


      [ref1]: https://wetten.overheid.nl/BWBR0003114#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0003114#Artikel25
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0003114
        artikel: '16'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0003114
        artikel: '25'
        paragraaf: '6'
  - number: '27.1'
    text: |-
      Een farmaceutisch product als bedoeld in artikel II, vierde, vijfde of zesde lid, van de wet van 29 augustus
      1975 (*Stb.* 519) mag na verloop van de in het vierde lid van dat artikel genoemde termijn, zolang het in
      [artikel 3, vierde lid, van de wet][ref1] vervatte verbod ten aanzien van dat product niet geldt, ter aflevering in
      Nederland uitsluitend worden ingevoerd, dan wel uit een lid-staat worden betrokken door de persoon die een aanvraag
      tot inschrijving van dat product in het desbetreffende register heeft ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0002290#Artikel3
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0002290
        artikel: '3'
  - number: '27.2'
    text: |-
      Een persoon, niet zijnde een persoon als bedoeld in het eerste lid, die een farmaceutisch product zoals het in een
      andere lid-staat in de handel is gebracht vanuit die lid-staat wenst te betrekken kan een verzoek tot inschrijving
      van dat product in het desbetreffende register indienen indien het een farmaceutisch product betreft dat:
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel27
  - number: 27.2.a
    text: |-
      in kwalitatieve en kwantitatieve samenstelling gelijk is aan een in het eerste lid bedoeld product, waarvoor een in
      [artikel 3, eerste lid, van de wet][ref1] bedoelde aanvraag is ingediend, hetzij nagenoeg gelijk is aan een zodanig
      in het eerste lid bedoeld product en dezelfde werking heeft als dat product;


      [ref1]: https://wetten.overheid.nl/BWBR0002290#Artikel3
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0002290
        artikel: '3'
  - number: 27.2.b
    text: |-
      is bereid door dezelfde fabrikant als die van het onder *a* bedoelde product, hetzij is bereid door een andere
      fabrikant, behorende tot hetzelfde concern als de fabrikant van het onder *a* bedoelde product, dan wel door een
      licentiehouder van de fabrikant van het onder *a* bedoelde product;
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel27
  - number: 27.2.c
    text: dezelfde farmaceutische vorm heeft als het onder *a* bedoelde product.
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel27
  - number: '27.3'
    text: 'Een in het tweede lid bedoeld verzoek moet de volgende gegevens bevatten:'
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel27
  - number: 27.3.a
    text: |-
      de gegevens, genoemd in [artikel 23, derde lid, onder ][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003114#Artikel23
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0003114
        artikel: '23'
        paragraaf: '5'
  - number: 27.3.b
    text: |-
      de benaming van het in het tweede lid, onder *a*, bedoelde product en het in [artikel 5, eerste lid][ref1],
      bedoelde nummer.


      [ref1]: https://wetten.overheid.nl/BWBR0003114#Artikel5
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0003114
        artikel: '5'
        paragraaf: '2'
  - number: '27.4'
    text: |-
      Een in het tweede lid bedoeld verzoek, wordt vergezeld van een voor onderzoek van het farmaceutische product
      voldoende aantal handelsverpakkingen waarin het in de desbetreffende lid-staat in de handel wordt gebracht.
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel27
  - number: '27.5'
    text: |-
      Indien naar het oordeel van het college, zo nodig na onderzoek van het farmaceutische product, redelijkerwijs
      mag worden aangenomen dat dat product voldoet aan hetgeen in het tweede lid is gesteld, geldt ten aanzien van dat
      product en ten aanzien van degeen die met betrekking tot dat product een in dat lid bedoeld verzoek heeft ingediend
      het verbod, vervat in [artikel 3, vierde lid, van de wet][ref1] niet tot de eerste dag van de derde kalendermaand
      na de dag waarop de beslissing op de aanvraag tot inschrijving van het in het tweede lid, onder *a*, bedoelde
      product onherroepelijk is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0002290#Artikel3
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0002290
        artikel: '3'
  - number: '27.6'
    text: |-
      Indien het college ter vaststelling van hetgeen in het tweede lid is gesteld, de beschikking over gegevens inzake
      de kwalitatieve en kwantitatieve samenstelling van het farmaceutische product, of in bijzondere gevallen inzake
      de bereidingswijze van dat product, noodzakelijk acht, verzoekt het college, zo nodig door tussenkomst van Onze
      Minister, aan de instantie die terzake van het product vergunning heeft verleend voor het in de handel brengen in
      de lid-staat, vermeld in het in het tweede lid bedoelde verzoek, om toezending van de desbetreffende gegevens.
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel27
  - number: '27.7'
    text: |-
      Het college maakt zijn besluit zo spoedig mogelijk, doch, behoudens overmacht, binnen 45 dagen na de datum van
      ontvangst van het verzoek bekend. In geval naar het oordeel van het college wordt aangenomen dat het farmaceutische
      product voldoet aan hetgeen in het tweede lid is gesteld, wordt bij die bekendmaking vermeldt het nummer
      vermeld waaronder het farmaceutische product zoals het door de verzoeker in de handel zal worden gebracht in het
      desbetreffende register is ingeschreven, indien op de aanvraag tot inschrijving van het in het tweede lid, onder
      *a*, bedoelde product gunstig wordt beslist. Van het besluit wordt een afschrift gestuurd aan de hoofdinspecteur.
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel27
  - number: '27.8'
    text: |-
      In geval met betrekking tot een farmaceutisch product het vijfde lid van toepassing is en een ander dan de in
      dat lid bedoelde persoon hetzelfde farmaceutische product uit dezelfde lid-staat wenst te betrekken, geldt dat
      lid eveneens ten aanzien van die persoon, nadat deze op zijn verzoek tot inschrijving een kennisgeving als in het
      tiende lid bedoeld heeft ontvangen.
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel27
  - number: '27.9'
    text: Een in het achtste lid bedoeld verzoek moet de in het derde lid bedoelde gegevens bevatten.
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel27
  - number: '27.10'
    text: |-
      Het college maakt de inschrijving binnen 15 dagen na de datum van ontvangst van het verzoek bekend onder vermelding
      van het nummer waaronder het farmaceutische product zoals het door de verzoeker in de handel zal worden gebracht
      in het desbetreffende register is ingeschreven, indien op de aanvraag tot inschrijving van het in het tweede
      lid, onder *a*, bedoelde product gunstig wordt beslist. Van het besluit wordt een afschrift gestuurd aan de
      hoofdinspecteur.
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel27
  - number: '27.11'
    text: |-
      In de bijsluiter met betrekking tot een product als bedoeld in het vijfde lid mogen uitsluitend de indicaties,
      contra-indicaties, bijwerkingen, dosering, wijze van gebruik en wijze van toediening worden vermeld, welke bij de
      aanvraag tot inschrijving van het in het tweede lid, onder *a*, bedoelde product zijn opgegeven.
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel27
  - number: '27.12'
    text: |-
      Indien een in het tweede lid, onder *a*, bedoeld product door het college in het desbetreffende register wordt
      ingeschreven, schrijft het college op dezelfde datum het in het vijfde lid bedoelde farmaceutische product zoals
      het door de in dat lid bedoelde persoon en zoals het door de in het achtste lid bedoelde persoon in de handel
      wordt gebracht in het desbetreffende register in ten name van de desbetreffende persoon. De inschrijving van een
      in het vijfde lid bedoeld farmaceutisch product geldt uitsluitend voor dezelfde indicaties, contra-indicaties,
      bijwerkingen, dosering, wijze van toediening als die van het in het tweede lid, onder *a*, bedoelde product na
      inschrijving daarvan.
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel27
  - number: '27.13'
    text: |-
      Voor de behandeling van een in het tweede en achtste lid bedoeld verzoek is door de verzoeker een vergoeding
      verschuldigd volgens een door Onze Minister vastgesteld tarief. Onze Minister regelt de wijze van betaling van
      de vergoeding.
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel27
  - number: '27.14'
    text: |-
      [Artikel 25][ref1] is van overeenkomstige toepassing ten aanzien van de personen, bedoeld in het vijfde en achtste
      lid.


      [ref1]: https://wetten.overheid.nl/BWBR0003114#Artikel25
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0003114
        artikel: '25'
        paragraaf: '6'
  - number: '27.15'
    text: |-
      Het college schorst een inschrijving ingevolge het twaalfde lid, indien de inschrijving van het geregistreerde
      desbetreffende farmaceutische product als bedoeld in het tweede lid, onder *a*, wordt geschorst en wel voor
      hetzelfde tijdvak als dat waarvoor de inschrijing van laatstbedoeld product is geschorst.
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel27
  - number: '27.16'
    text: 'Het college haalt een inschrijving ingevolge het twaalfde lid door:'
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel27
  - number: 27.16.a
    text: |-
      indien de inschrijving van het geregistreerde desbetreffende farmaceutische product als bedoeld in het tweede lid,
      onder *a*, wordt doorgehaald of vervalt;
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel27
  - number: 27.16.b
    text: op een verzoek van de registratiehouder.
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel27
  - number: '28'
    text: 'Dit besluit kan worden aangehaald als: Besluit registratie geneesmiddelen.'
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel28
  - number: '29'
    text: Dit besluit treedt in werking op het tijdstip waarop de wet van 29 augustus 1975 (*Stb.* 519) in werking treedt.
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel29
