        artikel: '3'
  - number: '15'
    text: |-
      1 Voor de instandhouding van de inschrijving in een register van een farmaceutisch product is de registratiehouder
      een jaarlijkse vergoeding verschuldigd.

      2 Indien [artikel 19][ref1], toepassing heeft gevonden, komen de in dat artikellid bedoelde subsidies ten laste van
      de registratievergoeding, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0003114#Artikel19b
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0003114
        artikel: 19b
        paragraaf: '3'
  - number: '16'
    text: |-
      1 De registratiehouder is verplicht om de in [artikel 2, eerste lid, onderdeel ][ref1], bedoelde
      controlemethodieken in overeenstemming te houden met de vooruitgang van wetenschap en techniek en zo nodig daarin
      wijziging aan te brengen.

      2 De registratiehouder is verplicht, onverwijld nadat zulks te zijner kennis is gekomen, het college en de
      hoofdinspecteur mededeling te doen van:

      a. een maatregel, inhoudende een verbod of een beperking van de aflevering van het farmaceutische product, welke
      door een overheidsinstantie in het buitenland is getroffen op grond van volksgezondheidsoverwegingen;

      b. gegevens welke niet in het desbetreffende register zijn opgenomen en welke een nieuw element bevatten met
      betrekking tot de werking van het farmaceutisch product, waaronder begrepen de werkzaamheid ten aanzien van de in
      het desbetreffende register opgenomen indicaties, en de contra-indicaties van het farmaceutisch product.


      [ref1]: https://wetten.overheid.nl/BWBR0003114#Artikel2
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0003114
        artikel: '2'
        paragraaf: '2'
  - number: '17'
    text: |-
      1 Het is verboden zonder voorafgaande toestemming van het college:

      a. met betrekking tot een geregistreerd farmaceutisch product een wijziging aan te brengen, welke tot wijziging
      van een gegeven als bedoeld in [artikel 2, eerste lid, onder ][ref1], zoals dat in het desbetreffende register is
      opgenomen, noopt;

      b. met betrekking tot een farmaceutisch product, behorende tot die bedoeld in artikel II, leden 4-6, van de wet
      van 29 augustus 1975 (*Stb.* 519) een wijziging aan te brengen, welke tot wijziging van een gegeven als bedoeld in
      [artikel 2, eerste lid, onder ][ref2], noopt.

      2 Een verzoek om toestemming wordt ingediend door de registratiehouder onderscheidenlijk, in geval het betreft een
      farmaceutisch product als bedoeld in het eerste lid, onder *b*, door degeen die de aanvraag tot inschrijving heeft
      ingediend.

      3 Het college maakt zijn besluit tot toestemming binnen 30 dagen na ontvangst van het verzoek tot toestemming
      bekend. Indien het besluit niet binnen deze termijn kan worden gegeven, stelt het college de aanvrager daarvan
      in kennis en noemt daarbij een redelijke termijn, die ten hoogste 120 dagen na ontvangst van het verzoek tot
      toestemming kan bedragen, waarbinnen het besluit wel tegemoet kan worden gezien.

      4 Door een persoon als bedoeld in het tweede lid moet onverwijld aan het college kennis worden gegeven voor zover
      het betreft:

      a. een wijziging van de niet-werkzame bestanddelen van het farmaceutische product, welke naar redelijkerwijs mag
      worden aangenomen geen invloed heeft op de werking van het product;

      b. een wijziging van de bereidingswijze, welke naar redelijkerwijs mag worden aangenomen geen invloed heeft op de
      werking van het farmaceutische product.

      5 Door een persoon als bedoeld in het tweede lid moet eveneens onverwijld aan het college kennis worden gegeven in
      geval het betreft een wijziging van de gegevens, genoemd in [artikel 2, eerste lid, onder ][ref3].

      6 In geval naar het oordeel van het college een wijziging als bedoeld in het vierde lid wèl invloed heeft op de
      werking van het farmaceutische product, maakt het college dat onverwijld bekend. In zodanig geval geldt het eerste
      lid en behandelt het college de in het vierde onderscheidenlijk vijfde lid bedoelde kennisgeving als een verzoek om
      toestemming als bedoeld in het tweede lid.

      7 Door een persoon als bedoeld in het tweede lid moeten alle voorgestelde wijzigingen van de gegevens, genoemd in
      [artikel 2, eerste lid, onder ][ref4], worden voorgelegd aan het college. Indien het college binnen een termijn
      van negentig dagen na de indiening van de aanvraag tot wijziging zich niet tegen de voorgestelde wijzigingen heeft
      uitgesproken, mag bedoelde persoon de wijzigingen ten uitvoer brengen.

      8 Het college brengt het desbetreffende register, in geval het betreft een farmaceutisch product als bedoeld
      in het eerste lid, onder *a*, in overeenstemming met de wijzigingen waarvoor toestemming is verleend en met de
      wijzigingen, bedoeld in het vierde en vijfde lid. In geval het betreft een farmaceutisch product als bedoeld in het
      eerste lid, onder *b*, wordt de desbetreffende aanvraag tot inschrijving geacht te zijn gewijzigd overeenkomstig de
      wijzigingen waarvoor toestemming is verleend en de wijzigingen, bedoeld in het vierde en vijfde lid.

      9 Het college stelt de hoofdinspecteur in kennis van de in het zevende lid bedoelde wijzigingen.

      10 Bij ministeriële regeling kunnen voorschriften worden gegeven ten aanzien van wijzigingen als bedoeld in dit
      artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0003114#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003114#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0003114#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0003114#Artikel2
