  - number: '14'
    text: |-
      1 Het college geeft van een beslissing terzake van een aanvraag tot inschrijving in een register, onderscheidenlijk
      terzake van een schorsing en van een doorhaling van een inschrijving in een register kennis aan de hoofdinspecteur.

      2 In gevallen van weigering, schorsing, opheffing van schorsing of doorhaling geschiedt de kennisgeving onverwijld.
      In gevallen van inschrijving geschiedt de kennisgeving zo spoedig mogelijk, onder vermelding van de datum en het
      nummer van de inschrijving, de naam van de registratiehouder, alsmede van de kwantitatieve samenstelling van de
      werkzame bestanddelen van het farmaceutische product, de wijze van gebruik en het indicatiegebied van het product.

      3 Van besluiten tot inschrijving, schorsing, opheffing van schorsing of doorhaling wordt door het college in ieder
      geval mededeling gedaan in de *Staatscourant*.

      4 Het college doet op gelijke wijze als bedoeld in het derde lid mededeling van beslissingen tot weigering van een
      inschrijving van farmaceutische producten als bedoeld in artikel II, leden 4-6, van de wet van 29 augustus 1975
      (*Stb.* 519) tot nadere wijziging van de [Wet op de Geneesmiddelenvoorziening][ref1].

      5 Indien geen verlenging van een inschrijving in een register als bedoeld in
      [artikel 3, tweede lid, van de wet][ref2] heeft plaatsgevonden, wordt het vervallen van die inschrijving door het
      college aan de hoofdinspecteur medegedeeld en volgt mededeling in de *Staatscourant*. Het college is bevoegd het
      vervallen van een inschrijving tevens op andere wijze mede te delen.


      [ref1]: https://wetten.overheid.nl/BWBR0002290
      [ref2]: https://wetten.overheid.nl/BWBR0002290#Artikel3
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel14
