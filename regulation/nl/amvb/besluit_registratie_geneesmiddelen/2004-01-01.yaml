  - number: '10'
    text: |-
      1 Het college schorst een inschrijving in een register voor een tijdvak van ten hoogste twaalf maanden:

      a. indien op grond van na de inschrijving ter kennis van het college gekomen feiten het ernstige
      vermoeden bestaat dat het desbetreffende farmaceutische product niet voldoet aan hetgeen is bepaald in
      [artikel 3, eerste lid, onder ][ref1];

      b. indien na de inschrijving het ernstige vermoeden bestaat dat de aanvraag tot inschrijving in het desbetreffende
      register onjuiste gegevens of bescheiden bevat;

      c. indien na de inschrijving het ernstige vermoeden bestaat dat de in [artikel 2, eerste lid, onderdeel ][ref2],
      bedoelde controlemethodieken niet meer in overeenstemming zijn met de stand van wetenschap en techniek;

      d. indien na de inschrijving het ernstige vermoeden bestaat dat het onderzoek van het farmaceutische product en van
      de bestanddelen daarvan niet geschiedt met gebruikmaking van de desbetreffende in het register opgenomen analyse-
      en andere controlemethodieken.

      2 Indien na de inschrijving van een farmaceutisch product in een register blijkt dat de etikettering of de
      bijsluiter van dat product niet voldoet aan het Besluit etikettering en bijsluiter farmaceutische producten of,
      in voorkomend geval aan andere van toepassing zijnde, krachtens [artikel 26, onder ][ref3] ter zake gegevens
      voorschriften, kan het college de inschrijving schorsen, totdat de etikettering of de bijsluiter met die
      voorschriften in overeenstemming is gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0002290#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003114#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0002290#Artikel26
