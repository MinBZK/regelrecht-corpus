        artikel: '3'
      - id: ref2
        bwb_id: BWBR0002290
        artikel: '3'
  - number: '23'
    text: |-
      1 Een farmaceutisch product mag ter aflevering in Nederland uitsluitend worden ingevoerd, dan wel uit een lid-staat
      worden betrokken door de houder van de registratie van dat product.

      2 Een persoon, die een farmaceutisch product zoals het in een andere lid-staat in de handel is gebracht vanuit
      die lid-staat wenst te betrekken kan op zijn verzoek overeenkomstig de volgende leden door het college als
      registratiehouder in het desbetreffende register worden opgenomen:

      a. indien het een product betreft dat:

      1°. in kwalitatieve en kwantitatieve samenstelling gelijk is aan een farmaceutisch product, geregistreerd op grond
      van een in [artikel 3, eerste lid, van de wet][ref1] bedoelde aanvraag, hetzij nagenoeg gelijk is aan een zodanig
      geregistreerd farmaceutisch product en dezelfde werking heeft als dat product,

      2°. is bereid door dezelfde fabrikant als die van het geregistreerde product, hetzij is bereid door een andere
      fabrikant, behorende tot hetzelfde concern als de fabrikant van het geregistreerde product, dan wel door een
      licentiehouder van de fabrikant van het geregistreerde product,

      3°. dezelfde farmaceutische vorm heeft als het onder 1° bedoelde geregistreerde product;

      b. indien het een farmaceutische specialité betreft welke zowel in Nederland als in de desbetreffende lid-staat
      is geregistreerd.

      3 Een in het tweede lid bedoeld verzoek met betrekking tot een in dat lid, onder *a*, bedoeld product moet de
      volgende gegevens bevatten:

      a. de naam en het adres van de verzoeker;

      b. de naam van de lid-staat van waaruit het farmaceutische product zal worden betrokken;

      c. de benaming waaronder het product in de onder *b* bedoelde lid-staat in de handel wordt gebracht;

      d. de naam en het adres van degeen die voor het in de handel brengen van het product in de onder *b* bedoelde lid-
      staat verantwoordelijk is;

      e. de vermelding van de farmaceutische vorm van het product;

      f. de benaming van het in het tweede lid, onder *a*, bedoelde geregistreerde farmaceutische product en het nummer
      waaronder dat product in het register is ingeschreven;

      g. de benaming waaronder het product in de handel zal worden gebracht.

      4 Een in het derde lid bedoeld verzoek wordt vergezeld van een voor onderzoek van het farmaceutische product
      voldoende aantal handelsverpakkingen waarin het in de desbetreffende lid-staat in de handel wordt gebracht.

      5 Aan een in het derde lid bedoeld verzoek wordt door het college, zo nodig na onderzoek van het farmaceutische
      product, gevolg gegeven, indien naar het oordeel van het college redelijkerwijs mag worden aangenomen dat het
      product voldoet aan hetgeen in het tweede lid, onder *a*, is gesteld.

      6 Indien het college ter vaststelling van hetgeen in het tweede lid, onder *a*, is gesteld, de beschikking over
      gegevens inzake de kwalitatieve en kwantitatieve samenstelling van het farmaceutische product, of in bijzondere
      gevallen inzake de bereidingswijze van dat product, noodzakelijk acht, verzoekt het college, zo nodig door
      tussenkomst van Onze Minister, aan de instantie die terzake van het in het derde lid bedoelde product vergunning
      heeft verleend voor het in de in dat lid, onder *b*, bedoelde lid-staat in de handel brengen om toezending van de
      desbetreffende gegevens.

      7 Indien het college gevolg geeft aan een in het derde lid bedoeld verzoek, wordt het farmaceutische product zoals
      het in de handel zal worden gebracht door het college in het desbetreffende register ingeschreven ten name van de
      in het derde lid, onder *a*, bedoelde verzoeker.

      8 Het college maakt zijn besluit zo spoedig mogelijk, doch behoudens overmacht, binnen 45 dagen na datum van
      ontvangst van het verzoek bekend. Bij toepassing van het zevende lid wordt bij die bekendmaking vermeldt de datum
      waarop en het nummer waaronder het product zoals het door de verzoeker in de handel zal worden gebracht in het
      desbetreffende register ingeschreven. Van het besluit wordt een afschrift gestuurd aan de hoofdinspecteur en
      mededeling gedaan in de Staatscourant.

      9 In geval na toepassing van het zevende lid een ander dan een in dat lid bedoelde registratiehouder hetzelfde
      farmaceutische product uit dezelfde lid-staat wenst te betrekken, wordt het product zoals het door die andere
      persoon in de handel zal worden gebracht op zijn verzoek in het desbetreffende register ingeschreven te zijnen
      name. Een desbetreffend verzoek moet de in het derde lid bedoelde gegevens bevatten. Het college maakt de
      inschrijving binnen 15 dagen na de datum van ontvangst van het verzoek bekend onder vermelding van de datum
      waarop en het nummer waaronder het product zoals het door die persoon in de handel zal worden gebracht in het
      desbetreffende register is ingeschreven. De laatste volzin van het achtste lid is van toepassing.

      10 Een inschrijving ingevolge het zevende en negende lid geldt uitsluitend voor dezelfde indicaties, contra-
      indicaties, bijwerkingen, dosering, wijze van gebruik en wijze van toediening als die van het in het tweede lid,
      onder *a*, bedoelde geregistreerde farmaceutische product.

      11 Een in het tweede lid bedoeld verzoek met betrekking tot een in dat lid, onder *b*, bedoelde farmaceutische
      specialité moet de volgende gegevens bevatten:

      a. de naam en het adres van de verzoeker;

      b. de benaming van de farmaceutische specialité en het nummer waaronder die farmaceutische specialité in het
      register is ingeschreven;

      c. de naam van de lid-staat van waaruit de farmaceutische specialité zal worden betrokken;

      d. de benaming waaronder de farmaceutische specialité in de handel zal worden gebracht.

      12 Het college maakt de inschrijving binnen 15 dagen na de datum van ontvangst van het verzoek bekend onder
      vermelding van de datum waarop en het nummer waaronder de in het elfde lid, onder *b*, bedoelde farmaceutische
      specialité zoals deze door de verzoeker in de handel zal worden gebracht in het desbetreffende register te zijnen
      name is ingeschreven. De laatste volzin van het achtste lid is van toepassing.

      13 Een inschrijving ingevolge het twaalfde lid geldt uitsluitend voor dezelfde indicaties, contra-indicaties,
      bijwerkingen, dosering, wijze van gebruik en wijze van toediening als die van de in het tweede lid, onder *b*,
      bedoelde geregistreerde farmaceutische specialité.

      14 Voor de behandeling van een in het derde, negende en elfde lid bedoeld verzoek is de verzoeker een vergoeding
      verschuldigd.

      15 Het college schorst een inschrijving ingevolge het zevende en negende onderscheidenlijk het twaalfde lid, indien
      de inschrijving van het desbetreffende in het tweede lid bedoelde geregistreerde farmaceutische product wordt
      geschorst en wel voor hetzelfde tijdvak als dat waarvoor de inschrijving van laatstbedoeld product is geschorst.

      16 Het college haalt een inschrijving ingevolge het zevende, negende en twaalfde door:

      a. indien de inschrijving van het desbetreffende in het tweede lid bedoelde geregistreerde farmaceutische product
      wordt doorgehaald of vervalt;

      b. op een gedaan verzoek van de registratiehouder.


      [ref1]: https://wetten.overheid.nl/BWBR0002290#Artikel3
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel23
