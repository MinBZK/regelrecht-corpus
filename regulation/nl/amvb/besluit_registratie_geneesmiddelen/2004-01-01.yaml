  - number: '20'
    text: |-
      1 Een register bestaat uit:

      a. registerbladen;

      b. de bij een aanvraag tot inschrijving in een register verstrekte gegevens en bescheiden zoals deze voor de
      inschrijving zijn aanvaard, of zoals deze zijn gewijzigd ingevolge [artikel 17][ref1], dan wel de gegevens
      verstrekt ingevolge [artikel 23, derde of elfde lid][ref2].

      2 Onze Minister geeft voorschriften met betrekking tot:

      a. het model van de in het eerste lid bedoelde registerbladen;

      b. de wijze van inschrijving in een register en van de doorhaling van een inschrijving, alsmede de wijze waarop de
      schorsing van een inschrijving en het in [artikel 14, vijfde lid][ref3], bedoelde vervallen van een inschrijving in
      het register wordt aangegeven;

      c. de bewaring van een register;

      d. het verstrekken van inzage in het in het eerste lid, onder *a*, bedoelde deel van het register en het
      verstrekken van afschriften van op registerbladen vermelde gegevens;

      e. de te betalen vergoeding voor het verstrekken van de onder *d* bedoelde afschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0003114#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0003114#Artikel23
