  - number: 19e
    text: |-
      1 De registratiehouder doet van elke vermoedelijk ernstige bijwerking van een geneesmiddel die hem ter kennis
      is gebracht, of die overeenkomstig de in [artikel 19c, eerste lid, onder b][ref1], bedoelde richtsnoeren aan
      de rapportagecriteria voldoet en waarvan redelijkerwijs kan worden verwacht dat hij daarvan op de hoogte is,
      onverwijld en in elk geval binnen 15 dagen na ontvangst van die kennisgeving, mededeling aan het college of de
      bevoegde instantie van de lidstaat waar de ernstige bijwerking zich heeft voorgedaan.

      2 De registratiehouder zorgt ervoor van dat elke vermoedelijke ernstige onverwachte bijwerking die zich op het
      grondgebied van een land buiten de Europese Gemeenschap voordoet en die hem door een beroepsbeoefenaar in de
      gezondheidszorg wordt gemeld, onverwijld en in elk geval binnen 15 dagen na ontvangst van die melding kennis wordt
      gegeven op de wijze, bedoeld in de in [artikel 19c, eerste lid, onder b][ref2], bedoelde richtsnoeren.

      3 Indien het gaat om geneesmiddelen die vallen binnen het toepassingsgebied van [richtlijn 87/22/EEG](31987L0022)
      van de Raad van Europese Gemeenschappen van 22 december 1986 tot onderlinge aanpassing van de nationale maatregelen
      inzake het in de handel brengen van met behulp van hoogwaardige technieken, met name biotechnieken, vervaardigde
      geneesmiddelen (Pb EG L 15) of van geneesmiddelen die zijn geregistreerd conform de procedure, genoemd in de
      [artikelen 7b tot en met 7e][ref3], zorgt de registratiehouder er voor dat elke vermoedelijke ernstige bijwerking
      wordt gemeld in de vorm en met de frequentie die worden overeengekomen met de lidstaat of de bevoegde autoriteit
      van de lidstaat die het geneesmiddel als eerste heeft geregistreerd op een zodanige wijze dat de informatie
      toegankelijk is voor die lidstaat of de bevoegde autoriteit daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0003114#Artikel19c
      [ref2]: https://wetten.overheid.nl/BWBR0003114#Artikel19c
      [ref3]: https://wetten.overheid.nl/BWBR0003114#Artikel7b
