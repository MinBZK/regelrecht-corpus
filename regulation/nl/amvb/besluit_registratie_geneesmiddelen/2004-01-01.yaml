  - number: 23c
    text: >-
      1 In afwijking van artikel 23b, eerste lid, onder a en c, bedraagt de vergoeding voor de behandeling van een
      aanvraag om inschrijving in het register van een farmaceutisch product in één of meer sterkten of farmaceutische
      vormen, niet zijnde een homeopathisch farmaceutisch product, € 5800,= indien daarbij gebruik wordt gemaakt van
      een dossier dat gelijk is aan het dossier betreffende het farmaceutische product dat reeds is ingeschreven in het
      register, hierna te noemen: het originele dossier.


      2 Indien met gebruikmaking van het originele dossier een aanvraag voor een vergunning voor het in de handel brengen
      van een in Nederland geregistreerd farmaceutisch product in een andere lidstaat wordt ingediend, is de aanvrager
      alsdan tevens een vergoeding van € 14 900,= verschuldigd indien het bij het farmaceutische product waarop het
      originele dossier betrekking heeft, om een nieuw werkzaam bestanddeel ging, dan wel tevens een vergoeding van €
      10 000,= verschuldigd indien het farmaceutische product waarop het originele dossier betrekking heeft, een bekend
      werkzaam bestanddeel bevatte.
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel23c
  - number: '24'
    text: |-
      1 Bij een in [artikel 2][ref1] bedoelde aanvraag tot inschrijving van farmaceutische producten, bedoeld in artikel
      II, vierde en zesde lid, van de wet van 29 augustus 1975 (*Stb.* 519), in het desbetreffende register, behoeven de
      in [artikel 2, eerste lid, onder ][ref2], genoemde gegevens eerst te worden verstrekt nadat daarom door het college
      is verzocht.

      2 De in [artikel 4][ref3] bedoelde vergoeding voor de behandeling van een aanvraag tot inschrijving in het
      desbetreffende register is niet verschuldigd voor farmaceutische preparaten, voor de aflevering waarvan de
      hoofdinspecteur vóór het in werking treden van dit besluit krachtens artikel 3, eerste lid, van het Besluit
      farmaceutische preparaten, zoals dat luidde onmiddellijk vóór het in werking treden van dit besluit, toestemming
      heeft verleend.

      3 [Artikel 8][ref4] is voor wat betreft de daarin genoemde termijn niet van toepassing met betrekking tot de in het
      eerste lid bedoelde farmaceutische producten.


