  - number: 12a
    text: >-
      1 Het college is bevoegd een procedure bij het comité aanhangig te maken, indien er naar zijn oordeel sprake is van
      onderling afwijkende besluiten van de bevoegde instanties in de lid-staten, Nederland inbegrepen, betreffende:


      a. de inschrijving, dan wel de vergunning;


      b. de schorsing of doorhaling van een inschrijving, dan wel de schorsing of intrekking van een vergunning,


      zulks onder vermelding van feiten en omstandigheden en verstrekking van gegevens.


      2 Alleen in specifieke gevallen, wanneer de belangen van de Europese Gemeenschap in het geding zijn, kan het
      college bij het comité een procedure aanhangig maken ten aanzien van een voorgenomen besluit tot schorsing,
      intrekking of wijziging van de vergunning voor een farmaceutisch product, zulks onder vermelding van feiten en
      omstandigheden en verstrekking van gegevens.


      3 Een zelfde bevoegdheid als bedoeld in het eerste en tweede lid, komt toe aan de registratiehouder van een in
      Nederland ingeschreven product.


      4 Het college stelt de registratiehouder in kennis van het aanhangig maken van een procedure als bedoeld in het
      eerste en tweede lid, onder toezending van afschriften van de aan het comité verstrekte informatie.
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel12a
  - number: 12b
    text: |-
      1 In afwijking van [artikel 3, eerste lid, derde volzin, en tweede lid, van de wet ][ref1]gaat het college
      binnen dertig dagen na ontvangst van de kennisgeving van een uitspraak in een procedure als bedoeld in de
      [artikelen 7][ref2] en [12][ref3], over tot uitvoering van de beschikking van de commissie of de raad inzake een
      aanvraag tot inschrijving, de schorsing, doorhaling of wijziging van een inschrijving. Bestaande besluiten worden
      binnen de in de eerste volzin gestelde termijn, zo nodig, herzien overeenkomstig de beschikking.

      2 Het college geeft van de uitvoering van de beschikking, bedoeld in het eerste lid, kennis aan de commissie en
      het comité.

      3 Ten aanzien van een farmaceutisch product waarover een uitspraak in een procedure is gedaan, blijven de
      [artikelen 10][ref4] en [11][ref5] buiten toepassing.

      4 Het bepaalde in dit artikel geldt ook, indien een procedure aanhangig is gemaakt door de bevoegde instantie van
      een andere lid-staat, de commissie of een persoon, rechtspersoon inbegrepen, die voor het in de handel brengen van
      een farmaceutisch product verantwoordelijk zal zijn of is.


      [ref1]: https://wetten.overheid.nl/BWBR0002290#Artikel3
