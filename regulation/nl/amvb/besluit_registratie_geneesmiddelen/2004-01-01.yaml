  - number: '2'
    text: |-
      1 Een aanvraag tot inschrijving van een farmaceutisch product in een register moet de volgende gegevens bevatten:

      a. de naam en het adres van de aanvrager, alsmede, indien de aanvrager niet de fabrikant is van het farmaceutisch
      product, de naam en het adres van die fabrikant alsmede een document waaruit blijkt dat de fabrikant vergunning is
      verleend tot het bereiden van geneesmiddelen;

      b. de benaming van het farmaceutische product;

      c. de vermelding van de farmaceutische vorm;

      d. een opgave van de kwalitatieve en kwantitatieve samenstelling van het farmaceutische product of, indien dit niet
      mogelijk is, een opgave van de gebruikte grondstoffen en de bewerkingen die deze hebben ondergaan, een en ander
      onder aanwijzing van de werkzame bestanddelen;

      e. een korte beschrijving van de bereidingswijze van het farmaceutische product;

      f. een omschrijving van de analyse- en andere controlemethodieken welke worden gebezigd voor het onderzoek van het
      farmaceutische product en voor het onderzoek van de bestanddelen van het farmaceutische product, vergezeld van een
      opgave van de uitkomsten van de analyses, verricht met de bedoelde analysemethodieken;

      g. gegevens omtrent de houdbaarheid van het farmaceutische product;

      h. een omschrijving van de werking van het farmaceutische product, een opgave van de indicaties, de contra-
      indicaties en de bijwerkingen, alsmede een opgave van de dosering, de wijze van gebruik en de wijze van
      toediening van het farmaceutische product indien van toepassing, worden de redenen vermeld voor voorzorgs-
      en veiligheidsmaatregelen die bij de bewaring van het product, de toediening ervan en de verwijdering van
      afvalproducten moeten worden genomen, alsmede een aanduiding omtrent mogelijke risico’s die het product voor het
      milieu kan inhouden;

      i. een opgave van de resultaten van de met betrekking tot het farmaceutische product en van de met betrekking tot
      de bestanddelen van het farmaceutische product verrichte proeven van:

      1°. fysisch-chemische, biologische of micro-biologische aard;

      2°. farmacologische en toxicologische aard;

      3°. klinische aard;

      j. een of meer monsters of modellen van de buitenverpakking, van de primaire verpakking en van het ontwerp van
      de bijsluiter;

      k. een opgave van de inhoud van elke handelsverpakking;

      l. indien van toepassing:

      1e. afschriften van een in een andere lid-staat of in een derde land verkregen vergunning voor het in de handel
      brengen van het product, van de bijbehorende, goedgekeurde samenvatting van de productkenmerken en van de tekst van
      de bijsluiter, met inbegrip van latere wijzigingen;

      2e. een mededeling omtrent aanvullingen of wijzigingen van de onder *a* tot en met *k* bedoelde gegevens ten
      opzichte van de verstrekte gegevens voor de vergunning, bedoeld onder 1e, dan wel een verklaring dat de gegevens
      niet gewijzigd zijn;

      3e. vermelding van de namen van andere lid-staten waar een aanvraag betreffende het product in behandeling is,
      vergezeld van afschriften van de bij die aanvraag ingediende samenvatting van de productkenmerken en de tekst van
      de bijsluiter;

      4e. de kennisgeving van een besluit van de bevoegde instantie van een andere lid-staat of derde land tot weigering
      van een vergunning, onder vermelding van bijzonderheden omtrent dat besluit en de motivering.

      m. een samenvatting van de kenmerken van het farmaceutische product, bedoeld in het tiende lid;

      n. een bewijs van betaling van de vergoeding, bedoeld in [artikel 4][ref1].

      Lopende de aanvraag, verstrekt de aanvrager gegevens ter aanvulling of ter wijziging van de gegevens.

      2 Degene die de inschrijving heeft aangevraagd, verstrekt desgevraagd aan het college monsters van het
      farmaceutisch product of van de werkzame bestanddelen van dat product in hoeveelheden die voldoende zijn om er
      onderzoek mee te doen.

      3 In geval een aanvraag tot inschrijving betrekking heeft op:

      1°. een farmaceutisch product dat reeds bij de mens wordt toegepast en waarvan de kennis omtrent de werking en de
      bijwerkingen in voldoende mate is verbreid,

      2°. een farmaceutisch product waarvan de samenstelling voor wat betreft de werkzame bestanddelen kwalitatief en
      kwantitatief gelijk is aan die van een farmaceutisch product dat reeds bij de mens wordt toegepast en waarvan de
      kennis omtrent de werking en de bijwerkingen in voldoende mate is verbreid,

      3°. een farmaceutisch product waarvan de bestanddelen reeds in een vergelijkbare verhouding zijn samengesteld
      in een farmaceutisch product dat reeds bij de mens wordt toegepast en waarvan de kennis omtrent de werking en de
      bijwerkingen in voldoende mate is verbreid,

      mag in plaats van het doen van een opgave van de resultaten van de proeven, bedoeld in het eerste lid, onder
      *i*, 2° en 3°, gedetailleerd en overeenkomstig door Onze Minister te stellen regelen worden verwezen naar
      wetenschappelijke publikaties over die proeven, verricht met betrekking tot de reeds bij de mens toegepaste
      farmaceutische producten, waarin de in dit lid bedoelde werking en bijwerkingen zijn vermeld.

      4 In geval een aanvraag tot inschrijving betrekking heeft op een farmaceutisch product, samengesteld uit bekende
      bestanddelen, dat in die samenstelling niet reeds als farmaceutisch product bij de mens wordt toegepast, kan voor
      wat betreft het overleggen van de resultaten van de proeven, bedoeld in het eerste lid, onder *i*, 2° en 3°, worden
      volstaan met die, verricht met betrekking tot het farmaceutische product.

      5 De ingevolge het eerste, derde en vierde lid, te verstrekken gegevens en bescheiden moeten zijn gesteld in het
      Nederlands, Frans, Duits of Engels. De in het eerste lid, onder *d*, genoemde gegevens moeten zijn gesteld in
      algemeen gebruikelijke termen en, indien door de Wereldgezondheidsorganisatie een benaming is aanbevolen, met
      gebruikmaking van die benaming.

      6 Onze Minister kan met betrekking tot het verstrekken van gegevens en bescheiden als bedoeld in het eerste, derde
      en vierde lid, alsmede de onderzoeken waarop deze gegevens zijn gebaseerd, regelen stellen.

      7 De in het eerste lid, onder *f*, bedoelde controlemethodieken dienen in overeenstemming te zijn met algemeen
      aanvaarde wetenschappelijke normen. De in het eerste lid, onder *f* en *i*, bedoelde gegevens moeten zijn opgesteld
      en ondertekend door deskundigen, die de vereiste technische capaciteiten of beroepskwalificaties bezitten.

      8 Het eerste lid, onder *i*, 2° en 3°, is niet van toepassing in geval een aanvraag tot inschrijving betrekking
      heeft op een farmaceutisch product waarvan de kwalitatieve en kwantitatieve samenstelling en de bereidingswijze
      gelijk zijn aan die van, en dat met dezelfde analyse- en andere controlemethodieken wordt onderzocht als

      a. een farmaceutisch product dat reeds gedurende een termijn van tien jaren volgens de geldende communautaire
      bepalingen in een lid-staat in de handel is toegelaten en in een register is ingeschreven, of

      b. een farmaceutisch product dat reeds in een register is ingeschreven, indien met schriftelijke toestemming van de
      registratiehouder daarvan wordt verwezen naar de desbetreffende gegevens van diens aanvraag,

      een en ander uitsluitend in geval eveneens de in het eerste lid, onder *h*, bedoelde gegevens voor wat betreft de
      werking, de indicaties, de dosering, de wijze van gebruik en de wijze van toediening van beide producten gelijk
      zijn.

      9 Het college kan met betrekking tot radioactieve farmaceutische specialités en preparaten bepalen welke van de
      ingevolge dit artikel bij de aanvraag te verstrekken gegevens niet behoeven te worden overgelegd, alsmede welke
      nadere gegevens moeten worden verstrekt.

      10 De in het eerste lid, onderdeel *m*, bedoelde samenvatting moet de volgende gegevens bevatten:

      a. de naam en het adres van de aanvrager;

      b. de benaming van het farmaceutische product;

      c. de vermelding van de farmaceutische vorm;

      d. een opgave van de kwalitatieve en kwantitatieve samenstelling voor wat betreft de werkzame bestanddelen van
      het farmaceutische product, alsmede van de niet werkzame bestanddelen van het product indien de kennis daarvan
      onmisbaar is voor de juiste toepassing van het farmaceutische product;

      e. een opgave van de farmacologische eigenschappen en, voor zover van belang voor de therapeutische toepassing, van
      de farmacokinetische gegevens;

      f. een opgave van de klinische gegevens met betrekking tot:

      1°. therapeutische indicaties;

      2°. contra-indicaties;

      3°. ongewenste bijwerkingen, waaronder begrepen gegevens betreffende frequentie en ernst;

      4°. bijzondere voorzorgen bij gebruik;

      5°. gebruik tijdens zwangerschap en lactatie;

      6°. onverenigbaarheid met andere geneesmiddelen en stoffen;

      7°. dosering en wijze van toediening voor volwassenen en, voor zover noodzakelijk, voor kinderen;

      8°. symptomen in geval van overdosering en de eventuele behandelingsmogelijkheden;

      9°. bijzondere waarschuwingen;

      10°. invloed op de bekwaamheid om een voertuig te besturen en om machines te gebruiken;

      g. een opgave van de volgende farmaceutische gegevens:

      1°. voornaamste gevallen van onverenigbaarheid;

      2°. houdbaarheid, zo nodig na reconstitutie van het product of wanneer de verpakking voor de eerste maal wordt
      geopend;

      3°. bijzondere maatregelen bij opslag;

      4°. aard en inhoud van de verpakking;

      5°. zo nodig, speciale voorzorgsmaatregelen voor het verwijderen van niet gebruikte farmaceutische producten of van
      die producten afgeleide afvalstoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0003114#Artikel4
