  - number: 23b
    text: |-
      1 De vergoeding, bedoeld in [artikel 4][ref1], bedraagt:

      a. € 43 900,= voor aanvragen tot inschrijving van een farmaceutisch product in één of meer sterkten of
      farmaceutische vormen, niet zijnde een homeopathisch farmaceutisch product, dat een nieuw werkzaam bestanddeel
      bevat, met dien verstande dat indien na de inschrijving een aanvraag voor een vergunning voor het in de handel
      brengen van dat product in een andere lidstaat is ingediend, de aanvrager alsdan tevens een vergoeding van
      € 19 750,= verschuldigd zal zijn;

      b. € 19 780,= indien de aanvraag betrekking heeft op een farmaceutisch product in één of meer sterkten of
      farmaceutisch vormen, niet zijnde een homeopathisch farmaceutisch product, dat een nieuw werkzaam bestanddeel bevat
      en waarvoor in een andere lidstaat reeds een vergunning voor het in de handel brengen is verleend;

      c. € 23 060,= voor aanvragen tot inschrijving van een farmaceutisch product in één of meer sterkten of
      farmaceutische vormen, niet zijnde een homeopathisch farmaceutisch product, dat een bekend werkzaam bestanddeel
      bevat, met dien verstande dat indien na de inschrijving een aanvraag voor een vergunning voor het in de handel
      brengen van dat product in een andere lidstaat is ingediend, de aanvrager alsdan tevens een vergoeding van
      € 13 810,= verschuldigd zal zijn;

      d. € 7700,= indien de aanvraag betrekking heeft op een farmaceutisch product in één of meer sterkten of
      farmaceutische vormen, niet zijnde een homeopathisch farmaceutisch product, dat een bekend werkzaam bestanddeel
      bevat en waarvoor in een andere lidstaat reeds een vergunning voor het in de handel brengen is verleend;

      e. € 14 980,= indien de aanvraag nieuwe sterkten of farmaceutische vormen betreft van een farmaceutisch product dat
      reeds is ingeschreven in het register, met dien verstande dat de vergoeding € 3 660,= bedraagt indien de aanvragen
      betrekking hebben op nieuwe sterkten of farmaceutische vormen van een farmaceutisch product waarvoor in een andere
      lidstaat reeds een vergunning voor het in de handel brengen is verleend;

      f. € 1200,= indien het een aanvraag tot inschrijving betreft van een homeopathisch farmaceutisch product als
      bedoeld in [artikel 4, eerste lid, van het Besluit homeopathische farmaceutische producten][ref2] dan wel van een
      reeks van dergelijke homeopathische farmaceutische producten die uitsluitend van dezelfde homeopathische grondstof
      zijn afgeleid en eenzelfde toedieningsweg kennen;

      g. €  2400,= indien het een aanvraag tot inschrijving betreft van een homeopathisch farmaceutisch product als
      bedoeld in [artikel 6, eerste lid, van het Besluit homeopathische farmaceutische producten][ref3] dan wel van een
      reeks van dergelijke homeopatische farmaceutische producten die uitsluitend van dezelfde homeopathische grondstof
      zijn afgeleid en eenzelfde toedieningsweg kennen;

      h. € 1 200,= indien het een aanvraag betreft tot inschrijving van een homeopathisch farmaceutisch product als
      bedoeld in [artikel 6, eerste lid, van het Besluit homeopathische farmaceutische producten][ref4] dan wel van een
      reeks van dergelijke homeopathische farmaceutische producten die uitsluitend van dezelfde homeopathische grondstof
      zijn afgeleid en het product dan wel de reeks van producten bestemd is voor oraal of uitwendig gebruik en zonder
      indicatie op de markt wordt gebracht.

      2 De vergoeding, bedoeld in [artikel 15][ref5], bedraagt:

      a. € 980,= indien het de instandhouding van de inschrijving van een farmaceutisch product betreft, niet zijnde een
      inschrijving als bedoeld onder b;

      b. € 30,= indien het de instandhouding van de inschrijving van een homeopathisch farmaceutisch product dan wel van
      een reeks van homeopatisch farmaceutische producten als bedoeld in het eerste lid, onder f, g, of h, betreft.

      3 De vergoeding, bedoeld in [artikel 18][ref6], bedraagt:

      a. € 3850,= indien het een ingrijpende wijziging betreft;

      b. € 1380,= indien het een geringe wijziging betreft;

      c. € 7000,= indien het twee of meer ingrijpende wijzigingen betreft;

      d. € 600,= indien het een wijziging van de inschrijving betreft van een homeopathisch
      farmaceutisch product als bedoeld in de [artikelen 4, eerste lid][ref7], en
      [6, eerste lid, van het Besluit homeopathische farmaceutische producten][ref8] dan wel van een reeks van
      homeopathische farmaceutische producten als bedoeld in het eerste lid, onder f of g.

      4 De vergoeding, bedoeld in [artikel 23, veertiende lid][ref9], bedraagt € 1 361,34 .


