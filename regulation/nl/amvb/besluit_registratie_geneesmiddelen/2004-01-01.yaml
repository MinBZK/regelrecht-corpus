  - number: '21'
    text: |-
      1 [Artikel 3, vierde lid, van de wet][ref1] is niet van toepassing ten aanzien van farmaceutische producten,
      behorende tot één der categorieën, vermeld op de bij dit besluit behorende bijlage.

      2 [Artikel 3, vierde lid, van de wet][ref2] is voor wat betreft het bereiden en invoeren eveneens niet van
      toepassing ten aanzien van farmaceutische producten welke uitsluitend in het buitenland in de handel zullen worden
      gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0002290#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002290#Artikel3
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel21
