  - number: '9'
    text: |-
      1 Het college schrijft, behoudens in het geval van een daartoe strekkende uitspraak in een procedure of een
      administratiefrechtelijke beslissing op beroep, een farmaceutisch product slechts in het desbetreffende register
      in, indien:

      a. is voldaan aan het bepaalde in [artikel 2][ref1];

      b. het product voldoet aan hetgeen is bepaald in [artikel 3, eerste lid, onder ][ref2];

      c. de analyse- en controlemethodieken, genoemd in [artikel 2, eerste lid, onder ][ref3], geschikt zijn ter
      waarborging van de opgegeven kwalitatieve en kwantitatieve samenstelling van het product;

      d. de benaming van het product, in geval het een farmaceutische specialité betreft, niet gelijkluidend is aan die
      van een reeds ingeschreven farmaceutische specialité, met een voor wat de werkzame bestanddelen betreft andere
      kwalitatieve samenstelling;

      e. de benaming van het product, in geval het een farmaceutische specialité betreft, geen aanleiding tot misverstand
      kan geven ten aanzien van de werkzaamheid met betrekking tot de opgegeven indicaties of ten aanzien van de
      samenstelling, voor wat betreft de werkzame bestanddelen.

      Bij gebruik van een fantasienaam als de benaming, mag geen verwarring ontstaan met de algemene benaming in de zin
      van [artikel 1, eerste lid, onder ][ref4].

      2 Het college is bevoegd af te wijken van het bepaalde in het eerste lid, onder *d*, in geval het betreft een
      farmaceutische specialité met een gelijke werking als die van een reeds ingeschreven en door dezelfde fabrikant
      bereide farmaceutische specialité.

      3 Een inschrijving van een farmaceutisch product in een register geschiedt ten name van de aanvrager van de
      inschrijving.

      4 Een inschrijving in een register geldt uitsluitend voor het farmaceutische product afkomstig van de bij de
      aanvraag vermelde fabrikant van het product.

      5 Bij de bekendmaking van een besluit tot inschrijving, stuurt het college de aanvrager een afschrift van de in
      [artikel 2, eerste lid, onder ][ref5], bedoelde samenvatting, zoals deze door het college, eventueel na wijziging
      is goedgekeurd.

      6 Van het besluit tot inschrijving en de samenvatting worden afschriften gestuurd aan het Europees bureau voor
      de geneesmiddelenbeoordeling.

      7 Behoudens de toepassing van [artikel 7][ref6] of [artikel 7][ref7], stelt het college een rapport op van
      zijn beoordeling en bevindingen omtrent de gegevens en bescheiden betreffende de resultaten van de uitgevoerde
      analytische, toxicologische, farmacologische en klinische proeven. Dit beoordelingsrapport wordt bijgewerkt zodra
      nieuwe gegevens beschikbaar komen, die voor de beoordeling van de kwaliteit, de veiligheid of de werkzaamheid van
      het farmaceutische product van belang zijn.

      8 Het college houdt het beoordelingsrapport ter beschikking van andere lid-staten. Indien de registratiehouder
      een aanvraag om een vergunning voor het desbetreffende farmaceutische product bij één of meer andere lid-staten
      indient, wordt het rapport toegezonden aan de instantie van de betrokken lid-staat of lid-staten, die bevoegd is te
      beslissen op de aanvraag.

      9 Tot het tijdstip waarop [artikel 7][ref8] van toepassing wordt, geeft de registratiehouder van het voornemen tot
      het indienen van een aanvraag als bedoeld in het achtste lid, kennis aan het college onder vermelding van eventuele
      toevoegingen aan de gegevens, bedoeld in [artikel 2, eerste lid][ref9]. Op verzoek van de registratiehouder stelt
      het college, met het oog op de in te dienen aanvraag, het beoordelingsrapport op of werkt het bestaande rapport bij
      binnen negentig dagen na ontvangst van het verzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0003114#Artikel2
