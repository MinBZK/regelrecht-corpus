  - number: '18'
    text: |-
      Voor de behandeling van een verzoek tot toestemming van een wijziging als bedoeld in
      [artikel 17, eerste lid][ref1], is de verzoeker een vergoeding verschuldigd. Een bewijs van betaling van de
      vergoeding wordt bij de aanvraag gevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0003114#Artikel17
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0003114
        artikel: '17'
        paragraaf: '2'
  - number: 19a
    text: >-
      In deze paragraaf wordt verstaan onder:


      a. bijwerking: een reactie op een geneesmiddel die schadelijk en onbedoeld is en die optreedt bij doses die normaal
      voor het genezen, lenigen of voorkomen van een ziekte, wond of pijn bij de mens, het herstellen, verbeteren of
      anderszins wijzigen van organische functies van de mens of het stellen van een geneeskundige diagnose bij de mens
      worden gebruikt;


      b. ernstige bijwerking: een bijwerking die tot de dood leidt, levensgevaar oplevert, opneming in een ziekenhuis
      of een verlenging van een verblijf in een ziekenhuis vereist, blijvende of significante invaliditeit of
      arbeidsongeschiktheid dan wel een aangeboren afwijking veroorzaakt;


      c. onverwachte bijwerking: een bijwerking waarvan de aard, de ernst of het gevolg niet verenigbaar is met de
      samenvatting van de kenmerken van het product;


      d. veiligheidsonderzoek na verlening van de handelsvergunning: een farmaco-epidemiologisch onderzoek of een
      klinisch onderzoek dat overeenkomstig de voorwaarden van de vergunning voor het in de handel brengen wordt
      uitgevoerd teneinde een gevaar voor de veiligheid in verband met een geneesmiddel waarvoor een handelsvergunning is
      verleend, te specificeren of te kwantificeren;


      e. misbruik van geneesmiddelen: een aanhoudend of incidenteel opzettelijk overmatig gebruik van geneesmiddelen dat
      gepaard gaat met schadelijke lichamelijke of psychische effecten.
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel19a
  - number: 19b
    text: >-
      1 Onze Minister bevordert de totstandkoming en instandhouding van samenwerkingsorganen van beroepsbeoefenaren die
      tot doel hebben het verzamelen, registreren en analyseren van gegevens over bijwerkingen en het gebruik en misbruik
      van geneesmiddelen die in de handel zijn.


      2 De organen, bedoeld in het eerste lid, aan welke door Onze Minister subsidie wordt verleend voor activiteiten
      betreffende of verband houdende met de verzameling en verstrekking van gegevens, verstrekken Onze Minister de
      informatie over bijwerkingen en het gebruik van geneesmiddelen die in verband met de uitvoering van de taken en
      bevoegdheden betreffende de registratie van geneesmiddelen wordt verlangd.


      3 Onze Minister bevordert de coördinatie van de informatievoorziening door ervoor te zorgen dat, tezamen met de
      organen, bedoeld in het eerste lid, voorzieningen worden getroffen met betrekking tot de afstemming van taken
      en werkzaamheden, de aard van de te verzamelen gegevens ten behoeve van het toezicht en de wijze van opslag en
      verwerking daarvan, alsmede de wijze en regelmaat van verstrekking van de informatie aan Onze Minister.


      4 Onze Minister bevordert, door overleg, de samenwerking op het gebied van de informatievoorziening met
      andere organen, diensten en instellingen waarvan het werkterrein het verzamelen en onderzoek van gegevens over
      bijwerkingen en het gebruik van geneesmiddelen omvat.


      5 Onze Minister en het college regelen in onderling overleg de wijze waarop en de regelmaat waarmee de informatie
      aan het college wordt toegezonden.


      6 Onze Minister draagt ervoor zorg dat de in dit artikel bedoelde informatie ten behoeve van het college
      in zodanige vorm wordt opgevraagd en verstrekt dat de anonimiteit van degene te wiens naam gegevens zijn
      geregistreerd, wordt gewaarborgd.


      7 Onze Minister draagt ervoor zorg dat persoonsgegevens, in aanvulling op verkregen anonieme informatie, alleen
      kunnen worden opgevraagd en verstrekt in spoedeisende gevallen en indien zij, naar het oordeel van het college,
      volstrekt onmisbaar zijn voor een zorgvuldige beoordeling van bijwerkingen.
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel19b
  - number: 19c
    text: >-
      1 De registratiehouder behartigt de goede zorg voor de bewaking van geneesmiddelen die door hem in de handel zijn
      gebracht, door:


      a. het systematisch verzamelen en ordenen van gegevens over alle vermoedelijke bijwerkingen van een geneesmiddel
      die door beroepsbeoefenaren in de gezondheidszorg ter kennis worden gebracht of op een andere wijze ter kennis
      komen van degenen die in dienst van zijn onderneming werken;


      b. het opstellen van verslagen op de wijze, bedoeld in de door de Europese Commissie opgestelde richtsnoeren voor
      de geneesmiddelenbewaking die zijn gepubliceerd in deel 9 van de Voorschriften inzake geneesmiddelen in de Europese
      Unie, over alle vermoedelijk ernstige bijwerkingen en alle andere vermoedelijke bijwerkingen, onder vermelding van
      de uitkomst van een wetenschappelijke beoordeling van de bijwerkingen;


      c. ervoor te zorgen dat aan het college, binnen een door het college te stellen termijn, aanvullende gegevens
      worden verstrekt ten behoeve van de beoordeling van de aan een geneesmiddel verbonden voordelen en risicos, met
      inbegrip van gegevens over veiligheidsonderzoek na verlening van de handelsvergunning, het afzetvolume van of het
      aantal recepten voor dat geneesmiddel.


      2 De registratiehouder heeft een persoon in dienst dan wel op grond van een andere overeenkomst dan een
      arbeidsovereenkomst tot zijn beschikking die is belast met de werkzaamheden, bedoeld in het eerste lid, en daarvoor
      is gekwalificeerd.
    url: https://wetten.overheid.nl/BWBR0003114/2004-01-01#Artikel19c
  - number: 19d
    text: |-
      1 Tenzij als voorwaarde bij de registratie anderen eisen zijn gesteld dan wel de in
      [artikel 19c, eerste lid, onder b][ref1], bedoelde richtsnoeren anders bepalen, worden de verslagen, bedoeld in
      [artikel 19c, eerste lid, onder b][ref2], gedurende een periode van 2 jaar na de registratie van het geneesmiddel
      elk half jaar aan het college gezonden. Na het verstrijken van de in de vorige zin genoemde periode worden de
      verslagen gedurende een periode van 2 jaar ten minste een maal per jaar en bij het verzoek om verlenging van de
      registratie aan het college verzonden.

      2 De registratiehouder zendt het college desgevraagd ook tussentijds verslagen als bedoeld in
      [artikel 19c, eerste lid, onder b][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003114#Artikel19c
