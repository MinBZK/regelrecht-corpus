  - number: '27'
    text: |-
      1 Een farmaceutisch product als bedoeld in artikel II, vierde, vijfde of zesde lid, van de wet van 29 augustus
      1975 (*Stb.* 519) mag na verloop van de in het vierde lid van dat artikel genoemde termijn, zolang het in
      [artikel 3, vierde lid, van de wet][ref1] vervatte verbod ten aanzien van dat product niet geldt, ter aflevering in
      Nederland uitsluitend worden ingevoerd, dan wel uit een lid-staat worden betrokken door de persoon die een aanvraag
      tot inschrijving van dat product in het desbetreffende register heeft ingediend.

      2 Een persoon, niet zijnde een persoon als bedoeld in het eerste lid, die een farmaceutisch product zoals het
      in een andere lid-staat in de handel is gebracht vanuit die lid-staat wenst te betrekken kan een verzoek tot
      inschrijving van dat product in het desbetreffende register indienen indien het een farmaceutisch product betreft
      dat:

      a. in kwalitatieve en kwantitatieve samenstelling gelijk is aan een in het eerste lid bedoeld product, waarvoor
      een in [artikel 3, eerste lid, van de wet][ref2] bedoelde aanvraag is ingediend, hetzij nagenoeg gelijk is aan een
      zodanig in het eerste lid bedoeld product en dezelfde werking heeft als dat product;

      b. is bereid door dezelfde fabrikant als die van het onder *a* bedoelde product, hetzij is bereid door een andere
      fabrikant, behorende tot hetzelfde concern als de fabrikant van het onder *a* bedoelde product, dan wel door een
      licentiehouder van de fabrikant van het onder *a* bedoelde product;

      c. dezelfde farmaceutische vorm heeft als het onder *a* bedoelde product.

      3 Een in het tweede lid bedoeld verzoek moet de volgende gegevens bevatten:

      a. de gegevens, genoemd in [artikel 23, derde lid, onder ][ref3];

      b. de benaming van het in het tweede lid, onder *a*, bedoelde product en het in [artikel 5, eerste lid][ref4],
      bedoelde nummer.

      4 Een in het tweede lid bedoeld verzoek, wordt vergezeld van een voor onderzoek van het farmaceutische product
      voldoende aantal handelsverpakkingen waarin het in de desbetreffende lid-staat in de handel wordt gebracht.

      5 Indien naar het oordeel van het college, zo nodig na onderzoek van het farmaceutische product, redelijkerwijs
      mag worden aangenomen dat dat product voldoet aan hetgeen in het tweede lid is gesteld, geldt ten aanzien van dat
      product en ten aanzien van degeen die met betrekking tot dat product een in dat lid bedoeld verzoek heeft ingediend
      het verbod, vervat in [artikel 3, vierde lid, van de wet][ref5] niet tot de eerste dag van de derde kalendermaand
      na de dag waarop de beslissing op de aanvraag tot inschrijving van het in het tweede lid, onder *a*, bedoelde
      product onherroepelijk is geworden.

      6 Indien het college ter vaststelling van hetgeen in het tweede lid is gesteld, de beschikking over gegevens inzake
      de kwalitatieve en kwantitatieve samenstelling van het farmaceutische product, of in bijzondere gevallen inzake
      de bereidingswijze van dat product, noodzakelijk acht, verzoekt het college, zo nodig door tussenkomst van Onze
      Minister, aan de instantie die terzake van het product vergunning heeft verleend voor het in de handel brengen in
      de lid-staat, vermeld in het in het tweede lid bedoelde verzoek, om toezending van de desbetreffende gegevens.

      7 Het college maakt zijn besluit zo spoedig mogelijk, doch, behoudens overmacht, binnen 45 dagen na de datum van
      ontvangst van het verzoek bekend. In geval naar het oordeel van het college wordt aangenomen dat het farmaceutische
      product voldoet aan hetgeen in het tweede lid is gesteld, wordt bij die bekendmaking vermeldt het nummer
      vermeld waaronder het farmaceutische product zoals het door de verzoeker in de handel zal worden gebracht in het
      desbetreffende register is ingeschreven, indien op de aanvraag tot inschrijving van het in het tweede lid, onder
      *a*, bedoelde product gunstig wordt beslist. Van het besluit wordt een afschrift gestuurd aan de hoofdinspecteur.

      8 In geval met betrekking tot een farmaceutisch product het vijfde lid van toepassing is en een ander dan de in
      dat lid bedoelde persoon hetzelfde farmaceutische product uit dezelfde lid-staat wenst te betrekken, geldt dat
      lid eveneens ten aanzien van die persoon, nadat deze op zijn verzoek tot inschrijving een kennisgeving als in het
      tiende lid bedoeld heeft ontvangen.

      9 Een in het achtste lid bedoeld verzoek moet de in het derde lid bedoelde gegevens bevatten.

      10 Het college maakt de inschrijving binnen 15 dagen na de datum van ontvangst van het verzoek bekend onder
      vermelding van het nummer waaronder het farmaceutische product zoals het door de verzoeker in de handel zal worden
      gebracht in het desbetreffende register is ingeschreven, indien op de aanvraag tot inschrijving van het in het
      tweede lid, onder *a*, bedoelde product gunstig wordt beslist. Van het besluit wordt een afschrift gestuurd aan
      de hoofdinspecteur.

      11 In de bijsluiter met betrekking tot een product als bedoeld in het vijfde lid mogen uitsluitend de indicaties,
      contra-indicaties, bijwerkingen, dosering, wijze van gebruik en wijze van toediening worden vermeld, welke bij de
      aanvraag tot inschrijving van het in het tweede lid, onder *a*, bedoelde product zijn opgegeven.

      12 Indien een in het tweede lid, onder *a*, bedoeld product door het college in het desbetreffende register wordt
      ingeschreven, schrijft het college op dezelfde datum het in het vijfde lid bedoelde farmaceutische product zoals
      het door de in dat lid bedoelde persoon en zoals het door de in het achtste lid bedoelde persoon in de handel
      wordt gebracht in het desbetreffende register in ten name van de desbetreffende persoon. De inschrijving van een
      in het vijfde lid bedoeld farmaceutisch product geldt uitsluitend voor dezelfde indicaties, contra-indicaties,
      bijwerkingen, dosering, wijze van toediening als die van het in het tweede lid, onder *a*, bedoelde product na
      inschrijving daarvan.

      13 Voor de behandeling van een in het tweede en achtste lid bedoeld verzoek is door de verzoeker een vergoeding
      verschuldigd volgens een door Onze Minister vastgesteld tarief. Onze Minister regelt de wijze van betaling van
      de vergoeding.

      14 [Artikel 25][ref6] is van overeenkomstige toepassing ten aanzien van de personen, bedoeld in het vijfde en
      achtste lid.

      15 Het college schorst een inschrijving ingevolge het twaalfde lid, indien de inschrijving van het geregistreerde
      desbetreffende farmaceutische product als bedoeld in het tweede lid, onder *a*, wordt geschorst en wel voor
      hetzelfde tijdvak als dat waarvoor de inschrijing van laatstbedoeld product is geschorst.

      16 Het college haalt een inschrijving ingevolge het twaalfde lid door:

      a. indien de inschrijving van het geregistreerde desbetreffende farmaceutische product als bedoeld in het tweede
      lid, onder *a*, wordt doorgehaald of vervalt;

      b. op een verzoek van de registratiehouder.


