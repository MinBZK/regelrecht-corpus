  - number: '12'
    text: |-
      1 Indien blijkt dat degene die de inschrijving heeft aangevraagd of degene te wiens name de farmaceutische
      specialité of het farmaceutische preparaat in het desbetreffende register staat ingeschreven aan bij het college
      gerezen bedenkingen tegemoet kan komen, stelt het college hem daartoe, binnen een door het college te bepalen
      termijn, in de gelegenheid.

      2 In het geval bedoeld in het eerste lid, is [artikel 8][ref1] niet van toepassing en neemt het college zijn
      beslissing zo spoedig mogelijk, doch uiterlijk binnen 210 dagen na afloop van de in het eerste lid bedoelde
      termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0003114#Artikel8
