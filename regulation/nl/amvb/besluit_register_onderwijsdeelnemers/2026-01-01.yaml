  - number: 74a
    text: |-
      Op een onderwijsdeelnemer waar de Wet inburgering op van toepassing was op de dag voorafgaand aan de
      inwerkingtreding van de [Wet inburgering 2021][ref1], blijven de [artikelen 16, onderdeel r][ref2],
      [22, vierde lid][ref3], [39, eerste lid][ref4], en [49][ref5], en de bijlage, zoals deze luidden op de dag
      voorafgaand aan de inwerkingtreding van de Wet inburgering 2021, van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0044770
      [ref2]: https://wetten.overheid.nl/BWBR0042639#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0042639#Artikel22
      [ref4]: https://wetten.overheid.nl/BWBR0042639#Artikel39
      [ref5]: https://wetten.overheid.nl/BWBR0042639#Artikel49
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel74a
