preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Onderwijs, Cultuur en Wetenschap, van 10 juli 2019, nr. WJZ/9177124 (6732),
    directie Wetgeving en Juridische Zaken, gedaan mede namens Onze Minister voor Basis- en Voortgezet Onderwijs en
    Media;

    Gelet op de artikelen 8, vierde lid, 12, zesde en zevende lid, 15, zesde lid, 16, derde lid, 17, derde lid,
    18, vierde lid, 19, derde lid, 20, zevende lid, 21, vierde lid, 22, derde lid, en 24, tweede lid, van de Wet
    register onderwijsdeelnemers, de artikelen 42a, eerste lid, 43, eerste lid, en 70, tweede lid, van de Wet op de
    expertisecentra, de artikelen 40b, eerste lid, 42, eerste lid, 69, tweede lid, en 120, derde lid, van de Wet op het
    primair onderwijs, de artikelen 27b, eerste lid, en 106, derde lid, van de Wet op het voortgezet onderwijs, artikel
    46, eerste lid, van de Wet primair onderwijs BES en de artikelen 65, eerste lid, en 187, derde lid, van de Wet
    voortgezet onderwijs BES;

    De Afdeling advisering van de Raad van State gehoord (advies van 21 augustus 2019, nr. W05.19.0211/I);

    Gezien het nader rapport van Onze Minister van Onderwijs, Cultuur en Wetenschap van 23 september 2019,
    nr. WJZ/16522975 (6732), directie Wetgeving en Juridische Zaken, uitgebracht mede namens Onze Minister voor Basis-
    en Voortgezet Onderwijs en Media;

    Hebben goedgevonden en verstaan:
