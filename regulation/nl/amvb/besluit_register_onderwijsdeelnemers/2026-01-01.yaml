      Aan Onze Minister worden voor zijn taken met betrekking tot de verstrekking van studiefinanciering, vouchers en
      langstudeerderskrediet bij of krachtens de [Wet studiefinanciering 2000][ref1] het persoonsgebonden nummer en de
      diplomagegevens, bedoeld in de [artikelen 15][ref2] en [17, eerste lid en tweede lid, onderdelen a en b][ref3], van
      onderwijsdeelnemers verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0011453
      [ref2]: https://wetten.overheid.nl/BWBR0042639#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0042639#Artikel17
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel48
