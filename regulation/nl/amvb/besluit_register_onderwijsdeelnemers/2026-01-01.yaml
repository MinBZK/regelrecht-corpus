  - number: '48.3'
    text: |-
      Aan Onze Minister worden ten behoeve van de uitvoering van zijn taak met betrekking tot het legaliseren van
      waardedocumenten de diplomagegevens, bedoeld in de [artikelen 15][ref1] en [17][ref2], van onderwijsdeelnemers
      verstrekt.


