        artikel: '15'
        hoofdstuk: '2'
        paragraaf: '2.4'
      - id: ref2
        bwb_id: BWBR0042639
        artikel: '17'
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: '55.2'
    text: 'Verstrekking van deze gegevens vindt plaats ten behoeve van:'
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel55
  - number: 55.2.a
    text: de verstrekking van gegevens door het CBS aan Onze Minister voor de beleidsvoorbereiding door Onze Minister; of
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel55
  - number: 55.2.b
    text: |-
      de verstrekking van gegevens door het CBS aan het college van burgemeester en wethouders voor de begrotings- en
      beleidsvoorbereiding inzake de gemeentelijke taken op het gebied van onderwijs.
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel55
  - number: '56'
    text: |-
      Aan het Uitvoeringsinstituut werknemersverzekeringen worden voor de uitvoering van de taken, bedoeld
      in [artikel 30, eerste lid][ref1], [30a, eerste en tweede lid][ref2], [30b][ref3], [30d][ref4] en
      [31 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref5] het persoonsgebonden nummer en de
      diplomagegevens, bedoeld in de [artikelen 15][ref6] en [17][ref7], van onderwijsdeelnemers verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel30a
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Artikel30b
      [ref4]: https://wetten.overheid.nl/BWBR0013060#Artikel30d
      [ref5]: https://wetten.overheid.nl/BWBR0013060#Artikel31
      [ref6]: https://wetten.overheid.nl/BWBR0042639#Artikel15
      [ref7]: https://wetten.overheid.nl/BWBR0042639#Artikel17
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel56
