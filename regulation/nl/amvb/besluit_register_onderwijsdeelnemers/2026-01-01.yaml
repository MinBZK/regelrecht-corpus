  - number: '53.6'
    text: |-
      De verstrekking van de diplomagegevens, bedoeld in dit artikel gebeurt met het persoonsgebonden nummer van de
      onderwijsdeelnemer.
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel53
  - number: 53a.1
    text: |-
      Aan het college van burgemeester en wethouders worden voor de uitvoering van de taak, bedoeld in
      [artikel 9.2.5 WEB][ref1], van een onderwijsdeelnemer die woonachtig is in de desbetreffende gemeente of
      in een gemeente die behoort tot de regio waarvan de desbetreffende gemeente contactgemeente als bedoeld in
      [artikel 9.2.4 WEB][ref2] is, desgevraagd verstrekt:


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel9
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel53a
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '9'
  - number: 53a.1.a
    text: het persoonsgebonden nummer; en
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel53a
  - number: 53a.1.b
    text: het gegeven of de onderwijsdeelnemer in het bezit is van een startkwalificatie.
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel53a
  - number: 53a.2
    text: |-
      Indien de onderwijsdeelnemer niet in het bezit is van een startkwalificatie worden voor zover dat noodzakelijk is
      tevens de diplomagegevens, bedoeld in [artikel 17, eerste lid, onderdeel a][ref1], verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0042639#Artikel17
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel53a
    references:
      - id: ref1
        bwb_id: BWBR0042639
        artikel: '17'
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: '54.1'
    text: |-
      Aan het College voor toetsen en examens worden het persoonsgebonden nummer en de diplomagegevens verstrekt van een
      onderwijsdeelnemer die een waardedocument heeft behaald bij dat college, voor zover die diplomagegevens betrekking
      hebben op waardedocumenten afgegeven door dat college.
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel54
  - number: '54.2'
    text: |-
      Aan het College voor toetsen en examens worden ten behoeve van de aanmelding van onderwijsdeelnemers
      voor een staatsexamen of ten behoeve van de examinering van die onderwijsdeelnemers desgevraagd
      het persoonsgebonden nummer en de diplomagegevens, bedoeld in de [artikelen 15][ref1] en
      [17, eerste lid, en tweede lid, onderdelen c tot en met g][ref2], van door die onderwijsdeelnemer behaalde
      waardedocumenten verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0042639#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0042639#Artikel17
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0042639
        artikel: '15'
        hoofdstuk: '2'
        paragraaf: '2.4'
      - id: ref2
        bwb_id: BWBR0042639
        artikel: '17'
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: '55.1'
    text: |-
      Aan het CBS worden het persoonsgebonden nummer en de diplomagegevens, bedoeld in de [artikelen 15][ref1] en
      [17][ref2], van alle onderwijsdeelnemers verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0042639#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0042639#Artikel17
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel55
    references:
