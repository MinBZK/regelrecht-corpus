      Waterlelie» te Cruquius of de school voor speciaal en voortgezet speciaal onderwijs «De Berkenschutse» te Heeze de
      volgende gegevens:


      [ref1]: https://wetten.overheid.nl/BWBR0003420
      [ref2]: https://wetten.overheid.nl/BWBR0044212
      [ref3]: https://wetten.overheid.nl/BWBR0007625
      [ref4]: https://wetten.overheid.nl/BWBR0003549
