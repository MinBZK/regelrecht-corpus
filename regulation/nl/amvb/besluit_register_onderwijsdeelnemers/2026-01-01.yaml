  - number: '52'
    text: |-
      Aan het Zorginstituut, bedoeld in [artikel 1, onderdeel p, van de Zorgverzekeringswet][ref1], wordt voor de
      toekenning en vaststelling van de vereveningsbijdrage bij of krachtens de [Zorgverzekeringswet][ref2], het
      gegeven verstrekt of de onderwijsdeelnemer tussen 1 januari 1996 en de peildatum een waardedocument als bedoeld in
      [artikel 16, onderdelen a tot en met g][ref3], heeft behaald. Daarbij wordt het persoonsgebonden nummer vervangen
      door een ander nummer of een code op een zodanige wijze dat de onderwijsdeelnemer niet geïdentificeerd is.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0018450
      [ref3]: https://wetten.overheid.nl/BWBR0042639#Artikel16
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0018450
      - id: ref3
        bwb_id: BWBR0042639
        artikel: '16'
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: '53.1'
    text: |-
      Aan het hoofd en aan het bestuur van een onderwijsinstelling worden desgevraagd de diplomagegevens verstrekt van
      een onderwijsdeelnemer die aan die onderwijsinstelling is of was ingeschreven, voor zover die diplomagegevens
      betrekking hebben op aan die onderwijsinstelling gevolgd onderwijs.
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel53
  - number: '53.2'
    text: |-
      Aan het bestuur van een onderwijsinstelling worden desgevraagd de diplomagegevens verstrekt van een
      onderwijsdeelnemer die een waardedocument heeft behaald bij die onderwijsinstelling, voor zover die diplomagegevens
      betrekking hebben op door die onderwijsinstelling afgegeven waardedocumenten.
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel53
  - number: '53.3'
    text: |-
      Aan het bestuur van een onderwijsinstelling als bedoeld in [onderdeel a, b, c, g, h, of i van de
      bijlage bij de WHW](onbekend) en aan een rechtspersoon voor hoger onderwijs worden voor de aanmelding,
      inschrijving of examinering van onderwijsdeelnemers de diplomagegevens bedoeld in de [artikelen 15][ref1] en
      [17, eerste en tweede lid, onderdelen a tot en met g][ref2], verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0042639#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0042639#Artikel17
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0042639
        artikel: '15'
        hoofdstuk: '2'
        paragraaf: '2.4'
      - id: ref2
        bwb_id: BWBR0042639
        artikel: '17'
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: '53.4'
    text: |-
      Aan het bestuur van een onderwijsinstelling als bedoeld in [artikel 1.1.1][ref1] of [1.4.1 WEB, ][ref2]voor zover
      het betreft een beroepsopleiding, worden voor de aanmelding, inschrijving of examinering van onderwijsdeelnemers de
      diplomagegevens bedoeld in de [artikelen 15][ref3] en [17, eerste en tweede lid, onderdelen b tot en met f][ref4],
      verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0042639#Artikel15
      [ref4]: https://wetten.overheid.nl/BWBR0042639#Artikel17
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel53
    references:
