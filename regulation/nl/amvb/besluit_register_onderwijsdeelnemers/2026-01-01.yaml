    text: |-
      de begin- en de einddatum van de periode waarvoor een onderwijsdeelnemer geplaatst is op een orthopedagogisch-
      didactisch centrum en het registratienummer van het orthopedagogisch-didactisch centrum.
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel8
  - number: '8.6'
    text: |-
      De basisgegevens omvatten van de onderwijsdeelnemer die is of was ingeschreven aan een beroepsopleiding voor zover
      van toepassing de volgende gegevens:
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel8
  - number: 8.6.a
    text: |-
      de omvang van de beroepspraktijkvorming, de datum van begin en einde daarvan, de afsluitdatum van
      de beroepspraktijkvormingsovereenkomst, het betrokken bedrijf dat of de betrokken organisatie die de
      beroepspraktijkvorming verzorgt en het opleidingsdomein, het kwalificatiedossier, de kwalificatie of het keuzedeel
      waarop de beroepspraktijkvorming is gebaseerd;
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel8
  - number: 8.6.b
    text: |-
      het al dan niet hebben van een handicap of chronische ziekte die extra ondersteuning vraagt van de
      onderwijsinstelling;
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel8
  - number: 8.6.c
    text: het al dan niet voor bekostiging in aanmerking komen van de onderwijsdeelnemer of het diploma.
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel8
  - number: '8.7'
    text: |-
      De basisgegevens omvatten van de onderwijsdeelnemer die is of was ingeschreven aan een onderwijsinstelling als
      bedoeld in de [WHW][ref1] gegevens over het al dan niet vrijgesteld zijn van het betalen van collegegeld op grond
      van de [artikelen 7.47a][ref2] of [7.48, eerste en tweede lid, WHW][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005682
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel7
