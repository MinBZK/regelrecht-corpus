  - number: 48b.1
    text: |-
      Aan Onze Minister van Landbouw, Natuur en Voedselkwaliteit worden voor de registratie van personen in het register,
      bedoeld in [artikel 4.3 van de Wet dieren][ref1], het persoonsgebonden nummer en de diplomagegevens, bedoeld in de
      [artikelen 15][ref2] en [17, eerste lid en tweede lid, onderdelen a en b][ref3], van onderwijsdeelnemers verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel4
