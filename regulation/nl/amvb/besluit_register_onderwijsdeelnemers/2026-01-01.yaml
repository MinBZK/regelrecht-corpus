  - number: '51'
    text: |-
      Aan Onze Minister voor Medische Zorg wordt voor de vaststelling van de vereveningscriteria voor de
      vereveningsbijdrage en de statistische onderbouwing van de aan die criteria verbonden gewichten bij of krachtens de
      [Zorgverzekeringswet][ref1], het gegeven verstrekt of de onderwijsdeelnemer tussen 1 januari 1996 en de peildatum
      een waardedocument als bedoeld in [artikel 16, onderdelen a tot en met g][ref2], heeft behaald. Daarbij wordt het
      persoonsgebonden nummer vervangen door een ander nummer of een code op een zodanige wijze dat de onderwijsdeelnemer
      niet geïdentificeerd is.


      [ref1]: https://wetten.overheid.nl/BWBR0018450
      [ref2]: https://wetten.overheid.nl/BWBR0042639#Artikel16
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel51
