    text: |-
      de begin- en de einddatum van de periode waarvoor er voor de onderwijsdeelnemer, niet zijnde een onderwijsdeelnemer
      van een school voor praktijkonderwijs, een ontwikkelingsperspectief als bedoeld in [artikel 2.44 WVO 2020][ref1] is
      vastgesteld; en


