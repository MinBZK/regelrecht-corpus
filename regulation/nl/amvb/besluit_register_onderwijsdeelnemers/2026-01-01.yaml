  - number: 20.1.c
    text: |-
      de vrijstellingsgegevens, bedoeld in [artikel 10][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0042639#Artikel10
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0042639
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '20.2'
    text: |-
      Indien voor een onderwijsdeelnemer een beroep op vrijstelling wordt gedaan als bedoeld in
      [artikel 6, eerste lid, LPW][ref1], levert het college van burgemeester en wethouders aan Onze Minister:


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel6
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '6'
  - number: 20.2.a
    text: het persoonsgebonden nummer;
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel20
  - number: 20.2.b
    text: de postcode; en
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel20
  - number: 20.2.c
    text: |-
      de vrijstellingsgegevens, bedoeld in [artikel 11][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0042639#Artikel11
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0042639
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '20.3'
    text: |-
      Indien het college van burgemeester en wethouders vrijstelling verleent op grond van
      [artikel 15, eerste lid, LPW][ref1], levert het college van burgemeester en wethouders aan Onze Minister:


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel15
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '15'
  - number: 20.3.a
    text: het persoonsgebonden nummer;
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel20
  - number: 20.3.b
    text: de postcode; en
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel20
  - number: 20.3.c
    text: |-
      de vrijstellingsgegevens, bedoeld in [artikel 12][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0042639#Artikel12
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0042639
        artikel: '12'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '20.4'
    text: |-
      Indien de onderwijsdeelnemer, bedoeld in het eerste, tweede of derde lid, niet eerder onderwijs binnen Nederland
      heeft gevolgd, levert het college van burgemeester en wethouders aan Onze Minister tevens de identificerende
      gegevens, bedoeld in [artikel 9][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0042639#Artikel9
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0042639
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '21.1'
    text: |-
      Indien [artikel 21a LPW][ref1] van toepassing is, levert het hoofd aan Onze Minister de verzuimgegevens, bedoeld in
      [artikel 14, onderdelen b tot en met k][ref2], met het persoonsgebonden nummer van de onderwijsdeelnemer.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel21a
      [ref2]: https://wetten.overheid.nl/BWBR0042639#Artikel14
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: 21a
      - id: ref2
        bwb_id: BWBR0042639
        artikel: '14'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: '21.2'
    text: |-
      Indien [artikel 47b WEC][ref1], [artikel 8.20 WVO 2020][ref2] of [artikel 9.2.2 WEB][ref3] van toepassing is,
      levert het bestuur aan Onze Minister de verzuimgegevens, bedoeld in [artikel 14, onderdelen b tot en met k][ref4],
      met het persoonsgebonden nummer van de onderwijsdeelnemer.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel47b
      [ref2]: https://wetten.overheid.nl/BWBR0044212#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0042639#Artikel14
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 47b
      - id: ref2
        bwb_id: BWBR0044212
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '9'
      - id: ref4
        bwb_id: BWBR0042639
        artikel: '14'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: '21.3'
    text: |-
      Indien het verblijfadres van de onderwijsdeelnemer afwijkt van het adres dat van hem is opgenomen in de
      basisregistratie personen, of als de onderwijsdeelnemer niet is opgenomen in de basisregistratie personen, levert
      het hoofd of het bestuur aan Onze Minister het verblijfadres en de postcode daarvan.
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel21
  - number: '21.4'
    text: |-
      Indien uit het register onderwijsdeelnemers verzuimgegevens als bedoeld in [artikel 46][ref1] zijn verstrekt aan
      het college van burgemeester en wethouders, levert het college van burgemeester en wethouder aan Onze Minister
      de verzuimgegevens, bedoeld in [artikel 14, onderdelen l tot en met p][ref2], met het persoonsgebonden nummer van
      de onderwijsdeelnemer.


      [ref1]: https://wetten.overheid.nl/BWBR0042639#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0042639#Artikel14
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0042639
        artikel: '46'
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref2
        bwb_id: BWBR0042639
        artikel: '14'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: '22.1'
    text: |-
      De organisatie die een waardedocument heeft uitgereikt, levert aan Onze Minister de identificerende
      gegevens, bedoeld in [artikel 15, onderdelen a tot en met d][ref1], met het persoonsgebonden nummer van de
      onderwijsdeelnemer.


      [ref1]: https://wetten.overheid.nl/BWBR0042639#Artikel15
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0042639
        artikel: '15'
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: '22.2'
    text: |-
      Indien sprake is van een waardedocument als bedoeld in [artikel 16, onderdelen a tot en met o][ref1], levert het
      bestuur van de onderwijsinstelling die het waardedocument heeft uitgereikt aan Onze Minister de diplomagegevens,
      bedoeld in [artikel 17, eerste lid][ref2], met het persoonsgebonden nummer van de onderwijsdeelnemer.


      [ref1]: https://wetten.overheid.nl/BWBR0042639#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0042639#Artikel17
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0042639
        artikel: '16'
        hoofdstuk: '2'
        paragraaf: '2.4'
      - id: ref2
        bwb_id: BWBR0042639
        artikel: '17'
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: '22.3'
    text: |-
      Indien sprake is van een waardedocument als bedoeld in [artikel 16, onderdeel p of q][ref1],
      levert het College voor toetsen en examens aan Onze Minister de diplomagegevens, bedoeld in
      [artikel 17, eerste lid, en tweede lid, onderdelen f en g][ref2], met het persoonsgebonden nummer van de
      onderwijsdeelnemer.


      [ref1]: https://wetten.overheid.nl/BWBR0042639#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0042639#Artikel17
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0042639
        artikel: '16'
        hoofdstuk: '2'
        paragraaf: '2.4'
      - id: ref2
        bwb_id: BWBR0042639
        artikel: '17'
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: '22.4'
    text: |-
      Indien sprake is van een waardedocument als bedoeld in [artikel 16, onderdeel r of s][ref1],
      levert Onze Minister van Justitie en Veiligheid aan Onze Minister de diplomagegevens, bedoeld in
      [artikel 17, eerste lid en tweede lid, onderdelen h en i][ref2], met het persoonsgebonden nummer.


      [ref1]: https://wetten.overheid.nl/BWBR0042639#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0042639#Artikel17
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0042639
        artikel: '16'
        hoofdstuk: '2'
        paragraaf: '2.4'
      - id: ref2
        bwb_id: BWBR0042639
        artikel: '17'
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: '23.1'
    text: |-
      Voor de bekostiging van onderwijsinstellingen, de planning van onderwijsinstellingen voor hoger onderwijs, de
      begrotings- en beleidsvoorbereiding en het toezicht op de naleving van de [Wet normering topinkomens][ref1],
      bedoeld in [artikel 15, eerste lid, van de Wet register onderwijsdeelnemers][ref2], worden aan Onze Minister de
      basisgegevens, aangeduid in de bijlage verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0032249
      [ref2]: https://wetten.overheid.nl/BWBR0042012#Artikel15
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0032249
      - id: ref2
        bwb_id: BWBR0042012
        artikel: '15'
  - number: '23.2'
    text: |-
      Naast de gegevens, bedoeld in het eerste lid, wordt voor de bekostiging van onderwijsinstellingen aan Onze Minister
      de leeftijd van de onderwijsdeelnemer op de van belang zijnde peildata verstrekt.
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel23
  - number: '23.3'
    text: |-
      Naast de gegevens bedoeld in het eerste lid, kunnen gegevens over de geslachtsnaam, de voornamen en het adres van
      onderwijsdeelnemers aan Onze Minister worden verstrekt voor zover dit noodzakelijk is om onderwijsdeelnemers uit te
      nodigen voor deelname aan onderzoeken in het kader van de begrotings- en beleidsvoorbereiding.
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel23
  - number: '23.4'
    text: |-
      Bij de verstrekking, bedoeld in het eerste en tweede lid, wordt het persoonsgebonden nummer vervangen door een
      ander nummer of een code op een zodanige wijze dat de onderwijsdeelnemer niet geïdentificeerd is.
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel23
  - number: '24'
    text: |-
      Voor het verkeer met het bestuur over de vaststelling van de bekostiging, daaronder begrepen de motivering van
      beschikkingen en de behandeling van bezwaar- en beroepschriften, worden aan Onze Minister het persoonsgebonden
      nummer en de in de bijlage aangeduide basisgegevens van onderwijsdeelnemers verstrekt, met dien verstande dat de in
      de bijlage aangeduide identificerende gegevens alleen worden verstrekt ten aanzien van een onderwijsdeelnemer die
      is of was ingeschreven aan een onderwijsinstelling als bedoeld in de daarbij aangeduide wet of wetten.
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel24
  - number: '25.1'
    text: |-
      Aan Onze Minister worden ten behoeve van de uitvoering van taken met betrekking tot de verstrekking van
      studiefinanciering, vouchers en langstudeerderskrediet bij of krachtens de [Wet studiefinanciering 2000][ref1]
      het persoonsgebonden nummer, de leeftijd van de onderwijsdeelnemer op de peildatum en de in de bijlage aangeduide
      basisgegevens verstrekt van onderwijsdeelnemers.


      [ref1]: https://wetten.overheid.nl/BWBR0011453
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0011453
  - number: '25.2'
    text: |-
      Aan Onze Minister worden ten behoeve van de uitvoering van taken met betrekking tot de verstrekking van
      studiefinanciering BES en opstarttoelages bij of krachtens de [Wet studiefinanciering BES][ref1] het
      persoonsgebonden nummer, de leeftijd van de onderwijsdeelnemer op de peildatum en de in de bijlage aangeduide
      basisgegevens verstrekt van onderwijsdeelnemers.


      [ref1]: https://wetten.overheid.nl/BWBR0028393
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0028393
  - number: '25.3'
    text: |-
      Aan Onze Minister worden ten behoeve van de uitvoering van taken met betrekking tot de
      verstrekking van tegemoetkomingen in de onderwijsbijdrage en in de schoolkosten bij of krachtens de
      [Wet tegemoetkoming onderwijsbijdrage en schoolkosten][ref1] het persoonsgebonden nummer en de in de bijlage
      aangeduide basisgegevens verstrekt van onderwijsdeelnemers.


      [ref1]: https://wetten.overheid.nl/BWBR0012438
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0012438
  - number: '25.4'
    text: |-
      Aan Onze Minister worden ten behoeve van de uitvoering van taken met betrekking tot de heffing van les- en
      cursusgeld bij of krachtens de [Les- en cursusgeldwet][ref1] het persoonsgebonden nummer en de in de bijlage
      aangeduide basisgegevens verstrekt van onderwijsdeelnemers.


      [ref1]: https://wetten.overheid.nl/BWBR0004188
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0004188
  - number: '25.5'
    text: |-
      Aan Onze Minister worden ten behoeve van de uitvoering van taken met betrekking tot de verstrekking van subsidie
      bij of krachtens de [Wet overige OCW-subsidies][ref1] het persoonsgebonden nummer en de in de bijlage aangeduide
      basisgegevens verstrekt van onderwijsdeelnemers.


      [ref1]: https://wetten.overheid.nl/BWBR0009458
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0009458
  - number: '25.6'
    text: |-
      Aan Onze Minister worden ten behoeve van de uitvoering van de taak, bedoeld in de
      [artikelen 45a, tweede lid, WPO][ref1], [48a, tweede lid, WEC][ref2] en [2.96, tweede lid, WVO 2020][ref3] het
      persoonsgebonden nummer en de in de bijlage aangeduide basisgegevens verstrekt van de onderwijsdeelnemer die is
      ingeschreven aan een onderwijsinstelling als bedoeld in de [WPO][ref4], de [WEC][ref5] of de [WVO 2020][ref6]
      waaraan blijkens het inspectierapport, bedoeld in [artikel 20 WOT][ref7], naar het oordeel van de inspectie
      de kwaliteit van het onderwijs zeer zwak is, als bedoeld in [artikel 10a, eerste of vierde lid, WPO][ref8],
      [artikel 19a, WEC][ref9], respectievelijk [artikel 2.94, eerste of derde lid, WVO 2020][ref10].


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel45a
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel48a
      [ref3]: https://wetten.overheid.nl/BWBR0044212#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0003420
      [ref5]: https://wetten.overheid.nl/BWBR0003549
      [ref6]: https://wetten.overheid.nl/BWBR0044212
      [ref7]: https://wetten.overheid.nl/BWBR0013800#Artikel20
      [ref8]: https://wetten.overheid.nl/BWBR0003420#Artikel10a
      [ref9]: https://wetten.overheid.nl/BWBR0003549#Artikel19a
      [ref10]: https://wetten.overheid.nl/BWBR0044212#Artikel2
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 45a
      - id: ref2
        bwb_id: BWBR0003549
        artikel: 48a
      - id: ref3
        bwb_id: BWBR0044212
        artikel: '2'
      - id: ref4
        bwb_id: BWBR0003420
      - id: ref5
        bwb_id: BWBR0003549
      - id: ref6
        bwb_id: BWBR0044212
      - id: ref7
        bwb_id: BWBR0013800
        artikel: '20'
      - id: ref8
        bwb_id: BWBR0003420
        artikel: 10a
      - id: ref9
        bwb_id: BWBR0003549
        artikel: 19a
      - id: ref10
        bwb_id: BWBR0044212
        artikel: '2'
  - number: '25.7'
    text: |-
      Aan Onze Minister worden ten behoeve van de uitvoering van de taak, bedoeld in de [artikelen 51 WPO BES][ref1]
      en [2.96 WVO 2020][ref2] het persoonsgebonden nummer en de in de bijlage aangeduide basisgegevens verstrekt van
      de onderwijsdeelnemer die is ingeschreven aan een onderwijsinstelling als bedoeld in de [WPO BES][ref3] of de
      [WVO 2020][ref4] die blijkens het inspectierapport, bedoeld in [artikel 20 WOT][ref5], naar het oordeel van de
      inspectie een zeer zwakke school is.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel51
      [ref2]: https://wetten.overheid.nl/BWBR0044212#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0030280
      [ref4]: https://wetten.overheid.nl/BWBR0044212
      [ref5]: https://wetten.overheid.nl/BWBR0013800#Artikel20
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '51'
      - id: ref2
        bwb_id: BWBR0044212
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0030280
      - id: ref4
        bwb_id: BWBR0044212
      - id: ref5
        bwb_id: BWBR0013800
        artikel: '20'
  - number: '25.8'
    text: |-
      Aan Onze Minister worden ten behoeve van de uitvoering van zijn taak met betrekking tot het legaliseren
      van bewijzen van inschrijving van een onderwijsinstelling de in de bijlage aangeduide basisgegevens van
      onderwijsdeelnemers verstrekt.
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel25
  - number: '26.1'
    text: |-
      Aan de inspectie worden, voor zover dit noodzakelijk is voor het toezicht op het onderwijs door de inspectie, als
      bedoeld in [artikel 19, eerste lid, van de Wet register onderwijsdeelnemers][ref1], de in de bijlage aangeduide
      basisgegevens verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0042012#Artikel19
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0042012
        artikel: '19'
  - number: '26.2'
    text: |-
      Naast de gegevens, bedoeld in het eerste lid, wordt aan de inspectie de leeftijd van de onderwijsdeelnemer op
      de eerste dag van elk kwartaal verstrekt en, voor zover het een onderwijsdeelnemer aan een niet door het Rijk
      bekostigde onderwijsinstelling als bedoeld in [artikel 1, onderdeel b, subonderdeel 4, van de LPW][ref1] betreft,
      het gegeven of de onderwijsdeelnemer de Nederlandse nationaliteit heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel1
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '1'
  - number: '26.3'
    text: |-
      Naast de gegevens bedoeld in het eerste lid, kunnen gegevens over de geslachtsnaam, de voornamen en het adres van
      onderwijsdeelnemers aan de inspectie worden verstrekt voor zover dit noodzakelijk is om onderwijsdeelnemers uit te
      nodigen voor deelname aan onderzoeken in het kader van het toezicht op het onderwijs.
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel26
  - number: '26.4'
    text: |-
      Bij de verstrekking, bedoeld in het eerste en tweede lid, wordt het persoonsgebonden nummer vervangen door een
      ander nummer of een code op een zodanige wijze dat de onderwijsdeelnemer niet geïdentificeerd is.
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel26
  - number: 26a.1
    text: |-
      Aan het College voor toetsen en examens worden ten behoeve van de aanmelding van onderwijsdeelnemers voor een
      staatsexamen of ten behoeve van de examinering van die onderwijsdeelnemers het persoonsgebonden nummer en de in de
      bijlage aangeduide basisgegevens van die onderwijsdeelnemers verstrekt.
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel26a
  - number: 26a.2
    text: |-
      Aan het College voor toetsen en examens worden ten behoeve van het vaststellen van de procedure
      om te komen tot de beoordelingsnormen van de doorstroomtoetsen, als bedoeld in artikel
      [3a, eerste lid, onderdeel f, van de Wet College voor toetsen en examens][ref1] de in de bijlage aangeduide
      basisgegevens van die onderwijsdeelnemers verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0025364#Artikel3a
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel26a
    references:
      - id: ref1
        bwb_id: BWBR0025364
        artikel: 3a
  - number: '27'
    text: |-
      Aan het bestuur van een onderwijsinstelling worden desgevraagd met het persoonsgebonden nummer de in de bijlage
      aangeduide basisgegevens verstrekt van:
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel27
  - number: 27.a
    text: |-
      een onderwijsdeelnemer die is of was ingeschreven aan die onderwijsinstelling, voor zover de gegevens betrekking
      hebben op de periode waarin de onderwijsdeelnemer aan die onderwijsinstelling is of was ingeschreven, en
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel27
  - number: 27.b
    text: |-
      een onderwijsdeelnemer die is ingeschreven aan die onderwijsinstelling, voor zover de gegevens betrekking hebben op
      de periode waarin die onderwijsdeelnemer aan een andere onderwijsinstelling was ingeschreven.
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel27
  - number: '28.1'
    text: |-
      Aan het bestuur van een onderwijsinstelling als bedoeld in de [WPO][ref1], [WPO BES][ref2], [WEC][ref3] of
      [WVO 2020][ref4] kunnen voor de aanmelding, toelating, inschrijving en uitschrijving van onderwijsdeelnemers het
      persoonsgebonden nummer en de in de bijlage aangeduide basisgegevens worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0003420
      [ref2]: https://wetten.overheid.nl/BWBR0030280
      [ref3]: https://wetten.overheid.nl/BWBR0003549
      [ref4]: https://wetten.overheid.nl/BWBR0044212
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0003420
      - id: ref2
        bwb_id: BWBR0030280
      - id: ref3
        bwb_id: BWBR0003549
      - id: ref4
        bwb_id: BWBR0044212
  - number: '28.2'
    text: |-
      Aan het bestuur van een onderwijsinstelling als bedoeld in de [WEB][ref1], de [WEB BES][ref2] of de [WHW][ref3]
      kunnen, voor de aanmelding, toelating en inschrijving van onderwijsdeelnemers, het persoonsgebonden nummer en de in
      de bijlage aangeduide basisgegevens worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0007625
      [ref2]: https://wetten.overheid.nl/BWBR0028395
      [ref3]: https://wetten.overheid.nl/BWBR0005682
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0007625
      - id: ref2
        bwb_id: BWBR0028395
      - id: ref3
        bwb_id: BWBR0005682
  - number: '29.1'
    text: |-
      Aan het bestuur van de onderwijsinstelling, bedoeld in de [WPO][ref1], de [WEC][ref2] of de [WPO BES][ref3],
      waar de betrokkene als onderwijsdeelnemer was ingeschreven, kunnen ten behoeve van de evaluatie van door
      die onderwijsinstelling afgegeven schooladviezen het persoonsgebonden nummer en de in de bijlage aangeduide
      basisgegevens verstrekt worden.


      [ref1]: https://wetten.overheid.nl/BWBR0003420
      [ref2]: https://wetten.overheid.nl/BWBR0003549
      [ref3]: https://wetten.overheid.nl/BWBR0030280
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0003420
      - id: ref2
        bwb_id: BWBR0003549
      - id: ref3
        bwb_id: BWBR0030280
  - number: '29.2'
    text: |-
      Gegevens met betrekking tot het door de onderwijsdeelnemer gevolgde voortgezet onderwijs of voortgezet speciaal
      onderwijs worden slechts aan de in het eerste lid bedoelde onderwijsinstellingen verstrekt voor zover deze gegevens
      betrekking hebben op de periode waarin de onderwijsdeelnemer is of was ingeschreven in een van de eerste drie
      leerjaren aan een onderwijsinstelling als bedoeld in de [WVO 2020][ref1] of aan een onderwijsinstelling als bedoeld
      in de [WEC][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0044212
      [ref2]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0044212
      - id: ref2
        bwb_id: BWBR0003549
  - number: '29.3'
    text: |-
      Het bestuur bewaart de basisgegevens, bedoeld in het eerste lid, tot vijf jaar na uitschrijving van de
      onderwijsdeelnemer.
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel29
  - number: 29a.1
    text: |-
      Als organisaties als bedoeld in [artikel 23, eerste lid, van de Wet register onderwijsdeelnemers][ref1] worden
      aangewezen:


      [ref1]: https://wetten.overheid.nl/BWBR0042012#Artikel23
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel29a
    references:
      - id: ref1
        bwb_id: BWBR0042012
        artikel: '23'
  - number: 29a.1.a
    text: de vereniging Jongerenorganisatie Beroepsonderwijs te Utrecht;
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel29a
  - number: 29a.1.b
    text: de Vereniging PO-Raad te Utrecht;
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel29a
  - number: 29a.1.c
    text: de vereniging VO-raad te Utrecht;
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel29a
  - number: 29a.1.d
    text: de vereniging MBO Raad te Woerden;
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel29a
  - number: 29a.1.e
    text: de Vereniging Hogescholen te Den Haag, en
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel29a
  - number: 29a.1.f
    text: Vereniging Universiteiten van Nederland te Den Haag.
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel29a
  - number: 29a.2
    text: |-
      Bij verstrekkingen als bedoeld in [artikel 23, eerste en derde lid, van de Wet register onderwijsdeelnemers][ref1]
      wordt het persoonsgebonden nummer vervangen door een ander nummer of een code op een zodanige wijze dat de
      onderwijsdeelnemer niet geïdentificeerd is, dan wel worden de gegevens in geaggregeerde vorm verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0042012#Artikel23
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel29a
    references:
      - id: ref1
        bwb_id: BWBR0042012
        artikel: '23'
  - number: 29a.3
    text: |-
      Bij ministeriële regeling kan een aanvraagformulier worden vastgesteld waarvan gebruik
      moet worden gemaakt bij een verzoek tot het nemen van een besluit als bedoeld in
      [artikel 23, vijfde lid, van de Wet register onderwijsdeelnemers][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0042012#Artikel23
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel29a
    references:
      - id: ref1
        bwb_id: BWBR0042012
        artikel: '23'
  - number: '30.1'
    text: |-
      Aan een samenwerkingsverband worden ten behoeve van de uitvoering van de
      taak, bedoeld in [artikel 18a, zesde lid, onderdeel b, van de WPO][ref1], of
      [artikel 2.47, zevende lid, onderdeel b, van de WVO 2020][ref2], de leeftijd op de peildatum, het soort onderwijs
      waaraan de onderwijsdeelnemer stond ingeschreven direct voorafgaand aan de aanmelding of inschrijving bij een
      onderwijsinstelling die behoort tot dat samenwerkingsverband, en de in de bijlage aangeduide basisgegevens
      verstrekt van een onderwijsdeelnemer:


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel18a
      [ref2]: https://wetten.overheid.nl/BWBR0044212#Artikel2
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 18a
      - id: ref2
        bwb_id: BWBR0044212
        artikel: '2'
  - number: 30.1.a
    text: |-
      die is ingeschreven of ingeschreven is geweest aan een onderwijsinstelling die bij dat samenwerkingsverband is
      aangesloten; of
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel30
  - number: 30.1.b
    text: |-
      die door dat samenwerkingsverband toelaatbaar is verklaard tot het onderwijs aan een speciale school voor
      basisonderwijs of tot het speciaal dan wel voortgezet speciaal onderwijs.
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel30
  - number: '30.2'
    text: |-
      Bij de verstrekking wordt voor zover noodzakelijk het persoonsgebonden nummer van de onderwijsdeelnemer verstrekt.
      Indien verstrekking van het persoonsgebonden nummer niet noodzakelijk is, dan wordt dit vervangen door een ander
      nummer of een code op een zodanige wijze dat de onderwijsdeelnemer niet geïdentificeerd is, dan wel worden de
      gegevens in geaggregeerde vorm verstrekt.
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel30
  - number: '31.1'
    text: |-
      Aan het college van burgemeester en wethouders worden ten behoeve van de uitvoering van de taken, bedoeld in
      [artikel 16 LPW][ref1] en [artikel 9.2.5 WEB][ref2] basisgegevens verstrekt van de onderwijsdeelnemer die:


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel9
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '16'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '9'
  - number: 31.1.a
    text: |-
      woonachtig is in de desbetreffende gemeente of in een gemeente die behoort tot de regio waarvan de desbetreffende
      gemeente contactgemeente is als bedoeld in [artikel 9.2.4, tweede lid, WEB][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel9
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '9'
  - number: 31.1.b
    text: ouder dan vier jaar en jonger dan 27 jaar is; en
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel31
  - number: 31.1.c
    text: niet in het bezit is van een startkwalificatie.
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel31
  - number: '31.2'
    text: |-
      Van de in het eerste lid bedoelde onderwijsdeelnemers worden met het persoonsgebonden nummer de in de bijlage
      aangeduide basisgegevens verstrekt.
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel31
  - number: '31.3'
    text: |-
      Indien een onderwijsdeelnemer als bedoeld in het eerste lid een startkwalificatie heeft behaald, dan worden de
      gegevens, bedoeld in het tweede lid nog eenmaal aan burgemeester en wethouders verstrekt.
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel31
  - number: '31.4'
    text: |-
      Gegevens die op grond van dit artikel aan het college van burgemeester en wethouders worden verstrekt, kunnen door
      de Stichting Inlichtingenbureau worden verwerkt. In dat geval zijn de Stichting Inlichtingenbureau en het betrokken
      college van burgemeester en wethouders gezamenlijke verwerkingsverantwoordelijken als bedoeld in artikel 26 van de
      Algemene verordening gegevensbescherming voor de verwerking van persoonsgegevens, bedoeld in dit artikel.
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel31
  - number: '32'
    text: |-
      Aan het college van burgemeester en wethouders worden het persoonsgebonden nummer en de in de
      bijlage aangeduide basisgegevens van onderwijsdeelnemers verstrekt, voor zover dat noodzakelijk
      is voor de uitvoering van de taken, bedoeld in [artikel 64 van de Participatiewet][ref1],
      [artikel 45 van de Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref2] en
      [artikel 45 van de Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel64
      [ref2]: https://wetten.overheid.nl/BWBR0004044#Artikel45
      [ref3]: https://wetten.overheid.nl/BWBR0004163#Artikel45
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '64'
      - id: ref2
        bwb_id: BWBR0004044
        artikel: '45'
      - id: ref3
        bwb_id: BWBR0004163
        artikel: '45'
  - number: '33'
    text: |-
      Aan het college van burgemeester en wethouders worden ten behoeve van de uitvoering van de taak, bedoeld in
      [artikel 5 van de Wet publieke gezondheid][ref1], het persoonsgebonden nummer en de in de bijlage aangeduide
      basisgegevens verstrekt van alle onderwijsdeelnemers jonger dan 18 jaar die onderwijs volgen binnen de betreffende
      gemeente.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel5
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: '5'
  - number: '34.1'
    text: |-
      Aan het CBS worden het persoonsgebonden nummer en de in de bijlage aangeduide basisgegevens van alle
      onderwijsdeelnemers verstrekt.
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel34
  - number: '34.2'
    text: 'Verstrekking van deze gegevens vindt plaats ten behoeve van:'
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel34
  - number: 34.2.a
    text: de verstrekking van gegevens door het CBS aan Onze Minister voor de beleidsvoorbereiding door Onze Minister; of
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel34
  - number: 34.2.b
    text: |-
      de verstrekking van gegevens door het CBS aan het college van burgemeester en wethouders voor de begrotings- en
      beleidsvoorbereiding inzake de gemeentelijke taken op het gebied van onderwijs.
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel34
  - number: '35.1'
    text: |-
      Aan de Sociale verzekeringsbank worden, voor zover dat noodzakelijk is voor de uitvoering
      van de [Algemene Kinderbijslagwet][ref1], de [Algemene nabestaandenwet][ref2] en
      [artikel 47a van de Participatiewet][ref3] desgevraagd het persoonsgebonden nummer en de in de bijlage aangeduide
      basisgegevens van onderwijsdeelnemers verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0002368
      [ref2]: https://wetten.overheid.nl/BWBR0007795
      [ref3]: https://wetten.overheid.nl/BWBR0015703#Artikel47a
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0002368
      - id: ref2
        bwb_id: BWBR0007795
      - id: ref3
        bwb_id: BWBR0015703
        artikel: 47a
  - number: '35.2'
    text: |-
      Aan de Sociale verzekeringsbank worden voor zover dat noodzakelijk is voor de uitvoering van de taak, bedoeld in
      [artikel 34 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1], en de verwerking van gegevens in de
      verzekerdenadministratie, bedoeld in [artikel 35 van die wet][ref2], desgevraagd het persoonsgebonden nummer en de
      in de bijlage aangeduide basisgegevens verstrekt van onderwijsdeelnemers die tijdelijk onderwijs volgen of hebben
      gevolgd buiten Nederland, of die tijdelijk in Nederland verblijven om aan onderwijs deel te nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel35
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '34'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '35'
  - number: '36'
    text: |-
      Aan het Uitvoeringsinstituut werknemersverzekeringen worden, voor zover dat noodzakelijk is voor de uitvoering
      van de taken, bedoeld in [artikel 30, eerste lid][ref1], [30a, eerste en tweede lid][ref2], [30b][ref3],
      [30d, eerste lid][ref4], en [31 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref5], desgevraagd het
      persoonsgebonden nummer en de in de bijlage aangeduide basisgegevens van onderwijsdeelnemers verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel30a
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Artikel30b
      [ref4]: https://wetten.overheid.nl/BWBR0013060#Artikel30d
      [ref5]: https://wetten.overheid.nl/BWBR0013060#Artikel31
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '30'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: 30a
      - id: ref3
        bwb_id: BWBR0013060
        artikel: 30b
      - id: ref4
        bwb_id: BWBR0013060
        artikel: 30d
      - id: ref5
        bwb_id: BWBR0013060
        artikel: '31'
  - number: '37'
    text: |-
      Aan de rijksbelastingdienst worden, voor zover dat nodig is voor de uitvoering van de wetgeving op het gebied
      van rijksbelastingen zoals bedoeld in [artikel 1, tweede lid, van de Algemene wet inzake rijksbelastingen][ref1]
      desgevraagd het persoonsgebonden nummer en de in de bijlage aangeduide basisgegevens van onderwijsdeelnemers,
      alsmede de onderwijssector waarop deze gegevens betrekking hebben verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel1
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '1'
  - number: '38.1'
    text: |-
      Aan de Samenwerkingsorganisatie beroepsonderwijs bedrijfsleven, bedoeld in [artikel 1.5.1 WEB][ref1], worden
      voor de taken bedoeld in het eerste lid van dat artikel de in de bijlage aangeduide basisgegevens en de leeftijd
      van de onderwijsdeelnemer bij aanvang van de beroepspraktijkvorming verstrekt van onderwijsdeelnemers die zijn
      ingeschreven aan een beroepsopleiding als bedoeld in de [WEB][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007625
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0007625
  - number: '38.2'
    text: |-
      Bij de verstrekking wordt het persoonsgebonden nummer vervangen door een ander nummer of een code op een zodanige
      wijze dat de onderwijsdeelnemer niet geïdentificeerd is.
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel38
  - number: 38a
    text: |-
      Aan Onze Minister van Justitie en Veiligheid worden, voor zover dat noodzakelijk is voor de uitvoering van zijn
      taken op grond van de [Wet inburgering 2021][ref1], desgevraagd het persoonsgebonden nummer en de in de bijlage
      aangeduide basisgegevens verstrekt van onderwijsdeelnemers.


      [ref1]: https://wetten.overheid.nl/BWBR0044770
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel38a
    references:
      - id: ref1
        bwb_id: BWBR0044770
  - number: '39.1'
    text: |-
      Aan Onze Minister van Sociale Zaken en Werkgelegenheid worden voor de uitvoering van subsidieregelingen van het
      Europees Sociaal Fonds desgevraagd het persoonsgebonden nummer verstrekt en gegevens over:
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel39
  - number: 39.1.a
    text: |-
      de in- en uitschrijving van onderwijsdeelnemers aan een school voor voortgezet speciaal onderwijs of aan de
      afdeling voortgezet speciaal onderwijs van een school voor speciaal en voortgezet speciaal onderwijs als bedoeld in
      de [WEC][ref1], die het arbeidsmarktgerichte uitstroomprofiel volgen;


      [ref1]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0003549
  - number: 39.1.b
    text: |-
      de in- en uitschrijving van onderwijsdeelnemers aan een school voor praktijkonderwijs als bedoeld in de
      [WVO 2020][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0044212
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0044212
  - number: '39.2'
    text: |-
      Aan Onze Minister van Sociale Zaken en Werkgelegenheid worden voor de uitvoering van subsidieregelingen op grond
      van de [Kaderwet SZW-subsidies][ref1] in het kader van scholing en ondersteuning ten behoeve van de versterking
      van de arbeidsmarktpositie van personen, desgevraagd het persoonsgebonden nummer en de in de bijlage aangeduide
      basisgegevens verstrekt van onderwijsdeelnemers.


      [ref1]: https://wetten.overheid.nl/BWBR0008754
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0008754
  - number: 39a
    text: |-
      Aan Onze Minister van Volksgezondheid, Welzijn en Sport worden voor de uitvoering van subsidieregelingen op grond
      van de [Kaderwet VWS-subsidies][ref1] desgevraagd de in de bijlage aangeduide basisgegevens van onderwijsdeelnemers
      verstrekt. Daarbij wordt het persoonsgebonden nummer vervangen door een ander nummer of een code op een zodanige
      wijze dat de onderwijsdeelnemer niet geïdentificeerd is.


      [ref1]: https://wetten.overheid.nl/BWBR0009455
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel39a
    references:
      - id: ref1
        bwb_id: BWBR0009455
  - number: '40'
    text: |-
      Aan Onze Minister voor Medische Zorg wordt voor de vaststelling van de vereveningscriteria voor de
      vereveningsbijdrage en de statistische onderbouwing van de aan die criteria verbonden gewichten bij of krachtens
      de [Zorgverzekeringswet][ref1], het gegeven of de onderwijsdeelnemer op de peildatum was ingeschreven aan een
      onderwijsinstelling als bedoeld in de [WHW][ref2] verstrekt. Daarbij wordt het persoonsgebonden nummer vervangen
      door een ander nummer of een code op een zodanige wijze dat de onderwijsdeelnemer niet geïdentificeerd is.


      [ref1]: https://wetten.overheid.nl/BWBR0018450
      [ref2]: https://wetten.overheid.nl/BWBR0005682
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0018450
      - id: ref2
        bwb_id: BWBR0005682
  - number: '41'
    text: |-
      Aan het Zorginstituut, bedoeld in [artikel 1, onderdeel p, van de Zorgverzekeringswet][ref1], wordt voor de
      toekenning en vaststelling van de vereveningsbijdrage bij of krachtens de [Zorgverzekeringswet][ref2], het gegeven
      of de onderwijsdeelnemer op de peildatum was ingeschreven aan een onderwijsinstelling als bedoeld in de [WHW][ref3]
      verstrekt. Daarbij wordt het persoonsgebonden nummer vervangen door een ander nummer of een code op een zodanige
      wijze dat de onderwijsdeelnemer niet geïdentificeerd is.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0018450
      [ref3]: https://wetten.overheid.nl/BWBR0005682
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0018450
      - id: ref3
        bwb_id: BWBR0005682
  - number: 41a
    text: |-
      Aan een pensioenuitvoerder als bedoeld in [artikel 1 van de Pensioenwet][ref1] of
      [artikel 1, eerste lid, van de Wet verplichte beroepspensioenregeling][ref2] worden, voor zover dat noodzakelijk
      is voor het uitkeren van een wezenpensioen, van een onderwijsdeelnemer desgevraagd het persoonsgebonden nummer, het
      gegeven of de onderwijsdeelnemer op de peildatum was ingeschreven aan een onderwijsinstelling en de opleidingsvorm,
      bedoeld in [artikel 6, vierde lid, onderdeel a, vijfde lid, onderdeel a, en zesde lid, onderdeel a][ref3],
      verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0042639#Artikel6
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel41a
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0042639
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 41b
    text: |-
      Aan het Agentschap voor Onderwijsdiensten worden, voor zover dat noodzakelijk is voor het uitoefenen van toezicht
      op de naleving van de Belgische leerplichtwetgeving, desgevraagd van de onderwijsdeelnemer de geslachtsnaam, de
      voornamen, het adres, de postcode, het gegeven of de onderwijsdeelnemer op de peildatum was ingeschreven aan een
      onderwijsinstelling en het registratienummer van die onderwijsinstelling verstrekt.
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel41b
  - number: '42.1'
    text: |-
      Ten behoeve van de beleidsvoorbereiding over vrijstelling en vervangende leerplicht wordt aan Onze Minister een
      overzicht verstrekt van:
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel42
  - number: 42.1.a
    text: het aantal jongeren dat een beroep op vrijstelling heeft gedaan;
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel42
  - number: 42.1.b
    text: het aantal overige vrijgestelde jongeren;
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel42
  - number: 42.1.c
    text: het aantal jongeren waarbij eerder vervangende leerplicht is toegestaan; en
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel42
  - number: 42.1.d
    text: het aantal overige jongeren met een vervangende leerplicht.
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel42
  - number: '42.2'
    text: |-
      Het overzicht heeft zowel betrekking op de landelijke aantallen jongeren als op de aantallen jongeren per
      woongemeente.
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel42
  - number: '43'
    text: |-
      Aan het college van burgemeester en wethouders worden voor zover dit noodzakelijk is voor het toezicht op de
      naleving op grond van de [LPW][ref1] het persoonsgebonden nummer en de vrijstellingsgegevens, bedoeld in de
      [artikelen 9 tot en met 12][ref2], verstrekt van de onderwijsdeelnemers die woonachtig zijn in hun gemeente.


      [ref1]: https://wetten.overheid.nl/BWBR0002628
      [ref2]: https://wetten.overheid.nl/BWBR0042639#Artikel9
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0002628
      - id: ref2
        bwb_id: BWBR0042639
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '44'
    text: |-
      Uit het register onderwijsdeelnemers worden aan Onze Minister ten behoeve van de beleidsvoorbereiding over verzuim
      de verzuimgegevens, bedoeld in [artikel 14, onderdelen a tot en met i en l tot en met o][ref1], verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0042639#Artikel14
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0042639
        artikel: '14'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: '45'
    text: |-
      Aan het hoofd en het bestuur op wie de leveringsverplichting, bedoeld in
      [artikel 12, derde lid, van de Wet register onderwijsdeelnemers][ref1] van toepassing is, worden ten behoeve
      van de uitvoering van wettelijke taken inzake verzuim als bedoeld in [artikel 21][ref2] van dit besluit het
      persoonsgebonden nummer en de verzuimgegevens, bedoeld in de [artikelen 13][ref3] en [14][ref4], verstrekt van de
      betreffende onderwijsdeelnemers.


      [ref1]: https://wetten.overheid.nl/BWBR0042012#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0042639#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0042639#Artikel13
      [ref4]: https://wetten.overheid.nl/BWBR0042639#Artikel14
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0042012
        artikel: '12'
      - id: ref2
        bwb_id: BWBR0042639
        artikel: '21'
        hoofdstuk: '3'
        paragraaf: '3.3'
      - id: ref3
        bwb_id: BWBR0042639
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref4
        bwb_id: BWBR0042639
        artikel: '14'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: '46.1'
    text: |-
      Aan het college van burgemeester en wethouders van de gemeente waar een onderwijsdeelnemer als ingezetene in de
      basisregistratie personen is ingeschreven worden ten behoeve van de wettelijke taken inzake verzuim, bedoeld in
      [artikel 16 LPW][ref1], [artikel 9.2.5 WEB][ref2] en [artikel 21][ref3] van dit besluit het persoonsgebonden nummer
      en de verzuimgegevens, bedoeld in de [artikelen 13][ref4] en [14][ref5] van die onderwijsdeelnemer verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0042639#Artikel21
      [ref4]: https://wetten.overheid.nl/BWBR0042639#Artikel13
      [ref5]: https://wetten.overheid.nl/BWBR0042639#Artikel14
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '16'
