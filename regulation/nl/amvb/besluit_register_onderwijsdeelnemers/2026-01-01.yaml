        paragraaf: '2.3'
  - number: '46.2'
    text: |-
      De gegevens, bedoeld in het eerste lid worden aan het college van burgemeester en wethouders verstrekt uiterlijk
      binnen een werkdag nadat ze in het register onderwijsdeelnemers zijn opgenomen.
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel46
  - number: '46.3'
    text: |-
      Gegevens die op grond van dit artikel aan het college van burgemeester en wethouders worden verstrekt, kunnen door
      de Stichting Inlichtingenbureau worden verwerkt. In dat geval zijn de Stichting Inlichtingenbureau en het betrokken
      college van burgemeester en wethouders gezamenlijke verwerkingsverantwoordelijken als bedoeld in artikel 26 van de
      Algemene verordening gegevensbescherming voor de verwerking van persoonsgegevens, bedoeld in dit artikel.
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel46
  - number: '47'
    text: |-
      Aan Onze Minister worden voor de begrotings- en beleidsvoorbereiding door Onze Minister de diplomagegevens
      bedoeld in de [artikelen 15, onderdelen c en e][ref1], en [17][ref2] van alle onderwijsdeelnemers verstrekt.
      Daarbij wordt het persoonsgebonden nummer vervangen door een ander nummer of een code op een zodanige wijze dat de
      onderwijsdeelnemer niet geïdentificeerd is.


      [ref1]: https://wetten.overheid.nl/BWBR0042639#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0042639#Artikel17
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel47
