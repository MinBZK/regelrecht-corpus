      Aan Onze Minister worden voor zijn taken met betrekking tot de verstrekking van studiefinanciering BES en
      opstarttoelages bij of krachtens de [Wet studiefinanciering BES][ref1] het persoonsgebonden nummer en de
      diplomagegevens, bedoeld in de [artikelen 15][ref2] en [17, eerste lid en tweede lid, onderdelen a en b][ref3], van
      onderwijsdeelnemers verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0028393
      [ref2]: https://wetten.overheid.nl/BWBR0042639#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0042639#Artikel17
