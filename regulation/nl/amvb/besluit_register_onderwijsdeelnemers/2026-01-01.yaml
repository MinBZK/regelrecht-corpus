        artikel: '17'
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: '53.5'
    text: |-
      Aan het bestuur van een onderwijsinstelling als bedoeld in [artikel 1.1.1][ref1] of [1.4a.1 WEB][ref2], voor zover
      het betreft een opleiding vavo, of aan een onderwijsinstelling als bedoeld in de [WVO 2020][ref3] of de [WEC][ref4]
      worden voor de aanmelding, inschrijving of examinering van onderwijsdeelnemers de diplomagegevens bedoeld in de
      [artikelen 15][ref5] en [17, eerste en tweede lid, onderdelen c tot en met f][ref6], verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0044212
      [ref4]: https://wetten.overheid.nl/BWBR0003549
      [ref5]: https://wetten.overheid.nl/BWBR0042639#Artikel15
      [ref6]: https://wetten.overheid.nl/BWBR0042639#Artikel17
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel53
