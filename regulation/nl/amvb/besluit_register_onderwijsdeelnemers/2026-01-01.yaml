        paragraaf: '2.4'
  - number: '50'
    text: |-
      Aan Onze Minister van Volksgezondheid, Welzijn en Sport als beheerder van een register als bedoeld in
      [artikel 3 van de Wet op de beroepen in de individuele gezondheidszorg][ref1] worden ten behoeve van de beoordeling
      van aanvragen om inschrijving in dat register het persoonsgebonden nummer en de diplomagegevens, bedoeld in de
      [artikelen 15][ref2] en [17, eerste lid en tweede lid, onderdelen a en b][ref3], van onderwijsdeelnemers verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0042639#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0042639#Artikel17
