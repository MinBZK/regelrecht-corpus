  - number: '75'
    text: |-
      Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende
      artikelen of onderdelen daarvan, voor de verschillende onderwijssectoren en voor het Europese deel van Nederland en
      de openbare lichamen Bonaire, Sint Eustatius en Saba verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel75
  - number: '76'
    text: 'Dit besluit wordt aangehaald als: Besluit register onderwijsdeelnemers.'
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel76
