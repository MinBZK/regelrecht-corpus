        paragraaf: '2.4'
  - number: 48a
    text: |-
      Aan Onze Minister van Infrastructuur en Waterstaat worden voor zijn taken met betrekking tot de
      afgifte van vaarbevoegdheidsbewijzen als bedoeld in [artikel 23 van de Wet bemanning zeeschepen][ref1]
      het persoonsgebonden nummer en de diplomagegevens, bedoeld in de [artikelen 15][ref2] en
      [17, eerste lid en tweede lid, onderdelen a en b][ref3], van onderwijsdeelnemers verstrekt.


