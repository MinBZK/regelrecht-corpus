articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop gebaseerde bepalingen wordt verstaan onder: - *beroepspraktijkvorming:*
      het onderricht in de praktijk van het beroep, bedoeld in [artikel 7.2.8, eerste lid, WEB][ref1] of
      [artikel 7.2.7, eerste lid, WEB BES][ref2];
        - *leerweg:* a. aan een school voor voortgezet onderwijs of voortgezet speciaal onderwijs: basisberoepsgerichte,
      kaderberoepsgerichte, gemengde of theoretische leerweg als bedoeld in [artikel 2.22, eerste lid, WVO 2020][ref3];
      b. aan een beroepsopleiding: de beroepsopleidende leerweg of de beroepsbegeleidende leerweg, bedoeld in
      [artikel 7.2.2, tweede lid, WEB][ref4] of [artikel 7.2.2, tweede lid, WEB BES][ref5], of een andere leerweg als
      bedoeld in [artikel 1.4.1, lid 1a, WEB][ref6] of [artikel 1.4.1, negende lid, WEB BES][ref7];
        - *definitieve schooladvies:* definitieve schooladvies, bedoeld in [artikel 45d, derde lid, WPO][ref8],
      [artikel 48e, derde lid, WEC][ref9], of [artikel 51d, derde lid, WPO BES][ref10];
        - *doorstroomtoets:* doorstroomtoets als bedoeld in [artikel 45b, derde lid, WPO][ref11],
      [artikel 48c, derde lid, WEC][ref12], of [artikel 51b, eerste lid, WPO BES][ref13];
        - *onderwijsdeelnemer met een niet-Nederlandse culturele achtergrond:* onderwijsdeelnemer aan een
      onderwijsinstelling als bedoeld in de [WPO][ref14] of de [WEC][ref15]: a. die behoort tot de Molukse
      bevolkingsgroep; b. van wie ten minste een van de ouders of voogden afkomstig is uit Griekenland, Italië,
      het voormalige Joegoslavië, Kaapverdië, Marokko, Portugal, Spanje, Tunesië of Turkije; c. van wie ten minste
      een van de ouders of voogden afkomstig is uit Suriname of een van de Caribische delen van het Koninkrijk;
      d. van wie ten minste een van de ouders of voogden als vreemdeling rechtmatig verblijf heeft als bedoeld in
      [artikel 8, onder c of d, van de Vreemdelingenwet 2000][ref16], of e. van wie ten minste een van de ouders of
      voogden afkomstig is uit een ander niet-Engelstalig land buiten Europa, echter met uitzondering van Indonesië;
        - *opleiding vavo:* opleiding voortgezet algemeen volwassenenonderwijs als bedoeld in
      [artikel 7.3.1, eerste lid, onderdeel a, WEB][ref17] of [artikel 7.3.1, eerste lid, onderdeel a, WEB BES][ref18];
        - *opleidingsvorm:* aanduiding dat een opleiding vavo, beroepsopleiding of opleiding voor hoger onderwijs in
      voltijd, in deeltijd of, voor zover het een opleiding voor hoger onderwijs betreft, als duale opleiding wordt of
      is gevolgd;
        - *orthopedagogisch-didactisch centrum:* orthopedagogisch-didactisch centrum als bedoeld in
      [artikel 18a, lid 10a, WPO][ref19] of [artikel 2.47, twaalfde lid, WVO 2020][ref20];
        - *rechtspersoon voor hoger onderwijs:* rechtspersoon voor hoger onderwijs als bedoeld in
      [artikel 1.1, onderdeel aa, WHW][ref21];
        - *schooladvies:* schooladvies als bedoeld in [artikel 45d, eerste lid, WPO][ref22],
      [artikel 48e, eerste lid, WEC][ref23] of [artikel 51d, eerste lid WPO BES][ref24];
        - *startkwalificatie:* startkwalificatie als bedoeld in [artikel 1, onderdeel f, LPW][ref25].


