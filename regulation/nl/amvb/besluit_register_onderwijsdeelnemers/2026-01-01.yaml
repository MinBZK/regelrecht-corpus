    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel8
  - number: '8.5'
    text: |-
      De basisgegevens omvatten van de onderwijsdeelnemer die is of was ingeschreven aan een onderwijsinstelling als
      bedoeld in de [WVO 2020][ref1] voor zover van toepassing de volgende gegevens:


      [ref1]: https://wetten.overheid.nl/BWBR0044212
