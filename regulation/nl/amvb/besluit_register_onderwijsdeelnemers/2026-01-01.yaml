    text: |-
      de aanduiding van de minderheidsgroep en de verblijfsduur in Nederland, voorzover de desbetreffende
      minderheidsgroep of verblijfsduur als categorie is opgenomen in een ministeriële regeling waarin
      voorschriften zijn vastgesteld omtrent toekenning van aanvullende bekostiging als bedoeld in
      [artikel 5.9, eerste lid, WVO 2020][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel5
    url: https://wetten.overheid.nl/BWBR0042639/2026-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '5'
