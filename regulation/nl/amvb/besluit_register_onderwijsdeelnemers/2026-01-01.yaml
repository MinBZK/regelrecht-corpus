  - number: 48b.2
    text: |-
      Aan Onze Minister van Landbouw, Natuur en Voedselkwaliteit worden voor het toezicht op de naleving van
      [artikel 3.11 van het Besluit houders van dieren][ref1] het persoonsgebonden nummer en de diplomagegevens,
      bedoeld in de [artikelen 15][ref2] en [17, eerste lid, en tweede lid, onderdeel b][ref3], van onderwijsdeelnemers
      verstrekt.


