  - number: '49'
    text: |-
      Aan Onze Minister van Justitie en Veiligheid worden ten behoeve van de beoordeling of sprake is van een
      vrijstelling van de inburgeringsplicht, bedoeld in de [Wet inburgering 2021][ref1] het persoonsgebonden nummer en
      de diplomagegevens, bedoeld in de [artikelen 15][ref2] en [17][ref3] verstrekt van onderwijsdeelnemers.


      [ref1]: https://wetten.overheid.nl/BWBR0044770
      [ref2]: https://wetten.overheid.nl/BWBR0042639#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0042639#Artikel17
