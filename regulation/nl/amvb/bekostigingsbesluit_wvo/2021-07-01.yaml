  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Onderwijs en Wetenschappen, mede namens Onze Minister van Landbouw,
    Natuurbeheer en Visserij, van 29 juni 1990, nr. 90010741/3181A, centrale directie Wetgeving en Juridische Zaken;

    Gelet op de artikelen 80, zesde lid, 84a, tweede lid, 96b, tweede lid, 96c, eerste en tweede lid, 96p, derde
    lid, 96r, eerste lid, 98, eerste lid, 106, eerste en tweede lid, en 110a, derde lid, van de Wet op het voortgezet
    onderwijs (Stb. 1986, 552);

    Gehoord de Onderwijsraad (advies van 19 oktober 1989, nr. OR/719 Alg.);

    De Raad van State gehoord (advies van 6 november 1990, nr. W05.90.0288);

    Gezien het nader rapport van de Staatssecretaris van Onderwijs en Wetenschappen, mede namens Onze Minister van
    Landbouw, Natuurbeheer en Visserij, van 22 september 1992, nr. 92028386/3181A, directie Wetgeving en Juridische
    Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0005672/2021-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder: - **aanvullende bekostiging:** aanvullende bekostiging als bedoeld in
      [artikel 85a][ref1] of [artikel 89 van de wet][ref2];
        - **accountant:** accountant als bedoeld in [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref3];
        - **bevoegd gezag:** bevoegd gezag als bedoeld in [artikel 1 van de wet][ref4];
        - **bijzondere school:** bijzondere school als bedoeld in [artikel 1 van de wet][ref5];
        - **eerste schooldag:** 1°. bij opening van de school aan het begin van het schooljaar: 1 augustus, 2°. bij opening
      van de school tijdens het schooljaar: de dag waarop het onderwijs aan de school is aangevangen;
        - **formatieplaats:** een formatieplaats als bedoeld in [artikel 1 van het Formatiebesluit WVO][ref6];
        - **nieuwkomer:** leerling die vreemdeling als bedoeld in [artikel 1 van de Vreemdelingenwet 2000][ref7] is en op
      1 oktober korter dan één jaar in Nederland verblijft;
        - **Onze Minister:** Onze Minister van Onderwijs, Cultuur en Wetenschap;
        - **openbare school:** openbare school als bedoeld in [artikel 1 van de wet][ref8];
        - **ouders:** ouders, voogden of verzorgers;
        - **samenwerkingsverband:** samenwerkingsverband als bedoeld in [artikel 1 van de wet][ref9];
        - **school:** school voor voortgezet onderwijs;
        - **scholengemeenschap:** scholengemeenschap bestaande uit twee of meer scholen;
        - **schooljaar:** tijdvak van 1 augustus van enig kalenderjaar tot en met 31 juli daaraanvolgend;
        - **teldatum:** datum van 1 oktober, bedoeld in [artikel 8, tweede lid][ref10];
        - **uitkering:** een werkloosheidsuitkering, een suppletie inzake arbeidsongeschiktheid alsmede een uitkering
      wegens ziekte en arbeidsongeschiktheid van gewezen personeel anders dan op grond van de [Ziektewet][ref11], en
        - **wet:** [Wet op het voortgezet onderwijs][ref12].


