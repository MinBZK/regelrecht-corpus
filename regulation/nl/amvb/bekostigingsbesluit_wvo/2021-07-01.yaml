  - number: '2'
    text: |-
      Het bevoegd gezag doet binnen twee weken na een besluit tot opheffing van de school daarvan mededeling aan Onze
      Minister, gedeputeerde staten, de inspectie, bedoeld in de [Wet op het onderwijstoezicht][ref1], en indien het een
      bijzondere school betreft, eveneens aan burgemeester en wethouders van de gemeente waarin de school is gelegen.


      [ref1]: https://wetten.overheid.nl/BWBR0013800
    url: https://wetten.overheid.nl/BWBR0005672/2021-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0013800
  - number: '3.1'
    text: |-
      De directeur, rector of centrale directie van een school draagt er zorg voor dat een overzichtelijke administratie
      van de inschrijving, de uitschrijving en het verzuim van de leerlingen op de school beschikbaar is, alsmede van de
      gegevens van de leerlingen en hun ouders die noodzakelijk zijn voor de vaststelling van de bekostiging.
    url: https://wetten.overheid.nl/BWBR0005672/2021-07-01#Artikel3
  - number: '3.2'
    text: |-
      Bij ministeriële regeling kunnen voorschriften worden gegeven omtrent de wijze waarop de leerlingenadministratie
      wordt ingericht.
    url: https://wetten.overheid.nl/BWBR0005672/2021-07-01#Artikel3
  - number: '4.1'
    text: |-
      Onverminderd het bepaalde bij of krachtens de [Les- en cursusgeldwet][ref1] schrijft de directeur, rector
      of centrale directie van een school een leerling slechts in na een beslissing van het bevoegd gezag tot
      toelating van de leerling, of indien de leerling tijdelijk op de school wordt geplaatst op grond van
      [artikel 27, lid 2f, van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004188
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel27
    url: https://wetten.overheid.nl/BWBR0005672/2021-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0004188
      - id: ref2
        bwb_id: BWBR0002399
        artikel: '27'
  - number: '4.2'
    text: |-
      De directeur, rector of centrale directie schrijft de leerling in met ingang van de dag waarop de leerling de
      school voor het eerst bezoekt.
    url: https://wetten.overheid.nl/BWBR0005672/2021-07-01#Artikel4
  - number: '4.3'
    text: |-
      In afwijking van het tweede lid, schrijft de directeur, rector of centrale directie de leerling die de school voor
      het eerst bezoekt op de eerste schooldag van het schooljaar, in met ingang van 1 augustus van dat schooljaar.
    url: https://wetten.overheid.nl/BWBR0005672/2021-07-01#Artikel4
  - number: '5.1'
    text: |-
      De directeur, rector of centrale directie van een school waarop de leerling staat ingeschreven, schrijft de
      leerling, indien deze de school verlaat, uit met ingang van de dag waarop de leerling de school voor het laatst
      heeft bezocht. De directeur, rector of centrale directie schrijft de leerling die wordt uitgeschreven na de school
      op de laatste schooldag van het schooljaar te hebben bezocht, uit met ingang van 31 juli van dat schooljaar.
    url: https://wetten.overheid.nl/BWBR0005672/2021-07-01#Artikel5
  - number: '5.2'
    text: |-
      Indien de directeur, rector of centrale directie van een school waarop de leerling stond ingeschreven, binnen vier
      weken na de dag waarop de leerling de school voor het laatst heeft bezocht uit het register onderwijsdeelnemers,
      bedoeld in de [Wet register onderwijsdeelnemers][ref1], een melding ontvangt van de inschrijving van de leerling
      op een andere school of een school voor ander onderwijs, wijzigt de directeur, rector of centrale directie de
      datum van uitschrijving, bedoeld in het eerste lid, alsnog in de datum van de dag voorafgaande aan de dag van
      inschrijving op die andere school of die school voor ander onderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0042012
    url: https://wetten.overheid.nl/BWBR0005672/2021-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0042012
  - number: '6'
    text: |-
      De gegevens die in de leerlingenadministratie zijn opgenomen, blijven daarvan in ieder geval deel uitmaken
      gedurende 5 jaar nadat de desbetreffende leerling van de school is uitgeschreven.
    url: https://wetten.overheid.nl/BWBR0005672/2021-07-01#Artikel6
  - number: '7.1'
    text: |-
      Voor de toepassing van het bepaalde bij en krachtens de wet worden, onverminderd de [artikelen 5][ref1],
      [7a][ref2], [7c][ref3] en [7d][ref4], de leerlingen op een school meegeteld die:


      [ref1]: https://wetten.overheid.nl/BWBR0005672#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005672#Artikel7a
      [ref3]: https://wetten.overheid.nl/BWBR0005672#Artikel7c
      [ref4]: https://wetten.overheid.nl/BWBR0005672#Artikel7d
    url: https://wetten.overheid.nl/BWBR0005672/2021-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005672
        artikel: '5'
        hoofdstuk: '1'
        paragraaf: '1'
      - id: ref2
