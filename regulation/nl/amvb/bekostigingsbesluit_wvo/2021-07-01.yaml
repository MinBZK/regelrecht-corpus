  - number: '28.1'
    text: |-
      Het samenwerkingsverband is gehouden om, wanneer een bevoegd gezag of een personeelsorganisatie daarom verzoekt,
      met dat bevoegd gezag en de personeelsorganisaties een op overeenstemming gericht overleg te voeren over het
      personeel dat in het derde schooljaar waarin [artikel 77a van de wet][ref1] is vervallen, nog niet zal zijn
      herplaatst en dat niet als gevolg van natuurlijk verloop zal zijn uitgestroomd op of voor 1 augustus 2016.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel77a
    url: https://wetten.overheid.nl/BWBR0005672/2021-07-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 77a
  - number: '28.2'
    text: |-
      Een bevoegd gezag als bedoeld in het eerste lid is, het bevoegd gezag van een school als bedoeld in de
      [Wet op de expertisecentra][ref1], een centrale dienst of een school die het budget ten behoeve van aanvullende
      zorg voor leerlingen in het samenwerkingsverband ontving, bedoeld in [artikel 77, vierde lid, van de wet][ref2],
      waarbij het personeel in het schooljaar 2014–2015 in dienst is.


      [ref1]: https://wetten.overheid.nl/BWBR0003549
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel77
    url: https://wetten.overheid.nl/BWBR0005672/2021-07-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0003549
      - id: ref2
        bwb_id: BWBR0002399
        artikel: '77'
  - number: '28.3'
    text: |-
      Het personeel, bedoeld in het eerste lid, is het personeel dat op 1 mei 2012 als ambulant begeleider in dienst was
      bij een school als bedoeld in de [Wet op de expertisecentra][ref1], een regionaal expertisecentrum als bedoeld in
      de Wet op de expertisecentra of een centrale dienst.


      [ref1]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0005672/2021-07-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0003549
  - number: '28.4'
    text: |-
      Het eerste, tweede en derde lid zijn van overeenkomstige toepassing ten aanzien van personeel, niet zijnde
      ambulant begeleiders, dat op 1 mei 2012 is dienst was bij een samenwerkingsverband als bedoeld in de [wet][ref1],
      een school die het budget ten behoeve van aanvullende zorg voor leerlingen in het samenwerkingsverband ontving,
      bedoeld in [artikel 77, vierde lid, van de wet][ref2] of een regionaal expertisecentrum als bedoeld in de
      [Wet op de expertisecentra][ref3] en dat in het eerste schooljaar waarin [artikel 77a van de wet][ref4] is
      vervallen, niet zal zijn herplaatst.


