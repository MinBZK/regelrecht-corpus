        bwb_id: BWBR0002399
        artikel: '71'
      - id: ref2
        bwb_id: BWBR0002399
        artikel: '72'
  - number: 23.a
    text: |-
      de bekostiging van de personeelskosten op grond van de [artikelen 84][ref1] en [84b van de wet][ref2],


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel84
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel84b
