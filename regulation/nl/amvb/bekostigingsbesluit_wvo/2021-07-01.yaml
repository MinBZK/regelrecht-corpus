    text: |-
      de bekostiging van de exploitatiekosten op grond van [artikel 86 van de wet][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel86
    url: https://wetten.overheid.nl/BWBR0005672/2021-07-01#Artikel23
    references:
