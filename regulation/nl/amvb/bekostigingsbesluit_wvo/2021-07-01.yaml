        artikel: 7a
        hoofdstuk: '1'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0005672
        artikel: 7c
        hoofdstuk: '1'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0005672
        artikel: 7d
        hoofdstuk: '1'
        paragraaf: '2'
  - number: 7.1.a
    text: op de teldatum op die school als werkelijk schoolgaand staan ingeschreven, of
    url: https://wetten.overheid.nl/BWBR0005672/2021-07-01#Artikel7
  - number: 7.1.b
    text: |-
      in bij ministeriële regeling te bepalen gevallen tijdelijk buiten de school waar zij staan ingeschreven zijn
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0005672/2021-07-01#Artikel7
  - number: '7.2'
    text: |-
      Het eerste lid is niet van toepassing op leerlingen die vanaf het begin van het schooljaar tot de teldatum meer dan
      de helft van het aantal schooldagen zonder geldige reden hebben verzuimd.
    url: https://wetten.overheid.nl/BWBR0005672/2021-07-01#Artikel7
  - number: '7.3'
    text: |-
      Voor de toepassing van het tweede lid wordt ten aanzien van de leerplichtige leerling als geldige reden aangemerkt
      een vrijstelling van geregeld schoolbezoek als bedoeld in de [Leerplichtwet 1969][ref1]. Ten aanzien van de
      niet-leerplichtige leerling worden als geldige reden aangemerkt dezelfde gronden als die welke leiden tot een
      vrijstelling van geregeld schoolbezoek als bedoeld in de eerste volzin.


      [ref1]: https://wetten.overheid.nl/BWBR0002628
    url: https://wetten.overheid.nl/BWBR0005672/2021-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002628
  - number: '7.4'
    text: |-
      Indien de teldatum valt op een dag waarop geen onderwijs wordt gegeven, worden op de eerstvolgende schooldag de
      leerlingen geteld, die op de teldatum als werkelijk schoolgaand stonden ingeschreven.
    url: https://wetten.overheid.nl/BWBR0005672/2021-07-01#Artikel7
  - number: '7.5'
    text: Een leerling kan slechts op één school voor de bekostiging meetellen.
    url: https://wetten.overheid.nl/BWBR0005672/2021-07-01#Artikel7
  - number: 7a.1
    text: |-
      Onverminderd [artikel 7][ref1] wordt een leerling in het op grond van [artikel 69][ref2] en
      [artikel 17a1, tweede lid, van de wet][ref3] bekostigde leerwegondersteunend onderwijs in een schooljaar meegeteld


      [ref1]: https://wetten.overheid.nl/BWBR0005672#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel69
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel17a1
    url: https://wetten.overheid.nl/BWBR0005672/2021-07-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0005672
        artikel: '7'
        hoofdstuk: '1'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002399
        artikel: '69'
      - id: ref3
        bwb_id: BWBR0002399
        artikel: 17a1
  - number: 7a.1.a
    text: |-
      als leerling in dat onderwijs indien het samenwerkingsverband voor de teldatum bepaalt dat betrokkene is aangewezen
      op leerwegondersteunend onderwijs of toelaatbaar is tot het praktijkonderwijs of indien er sprake is van de
      situatie, bedoeld in [artikel 27, lid 2f, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel27
    url: https://wetten.overheid.nl/BWBR0005672/2021-07-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '27'
  - number: 7a.1.b
    text: als leerling van de school waaraan dat onderwijs is verbonden, in andere gevallen dan bedoeld onder a.
    url: https://wetten.overheid.nl/BWBR0005672/2021-07-01#Artikel7a
  - number: 7a.2
    text: |-
      Onverminderd de [artikelen 7][ref1] en [7b][ref2] wordt een leerling slechts meegeteld als leerling van een
      school voor praktijkonderwijs indien het samenwerkingsverband heeft bepaald dat betrokkene toelaatbaar is tot het
      praktijkonderwijs of indien er sprake is van de situatie, bedoeld in [artikel 27, lid 2f, van de wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005672#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005672#Artikel7b
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel27
    url: https://wetten.overheid.nl/BWBR0005672/2021-07-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0005672
        artikel: '7'
        hoofdstuk: '1'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005672
        artikel: 7b
        hoofdstuk: '1'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0002399
        artikel: '27'
  - number: 7b.1
    text: |-
      Leerlingen als bedoeld in de [artikelen 2][ref1] en [3 van het Besluit samenwerking VO-BVE][ref2] worden
      aangemerkt als leerlingen die op de teldatum als werkelijk schoolgaand zijn ingeschreven, als bedoeld in
      [artikel 7, eerste lid][ref3]. Het bepaalde in [artikel 7, eerste, tweede en derde lid][ref4], over verzuim is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0019143#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0019143#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0005672#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0005672#Artikel7
    url: https://wetten.overheid.nl/BWBR0005672/2021-07-01#Artikel7b
    references:
      - id: ref1
        bwb_id: BWBR0019143
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0019143
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0005672
        artikel: '7'
        hoofdstuk: '1'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0005672
        artikel: '7'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: 7b.2
    text: |-
      In afwijking van het eerste lid, eerste volzin, tellen leerlingen die zijn afgewezen voor een eindexamen als bedoeld
      in [artikel 29 van de wet][ref1] en aansluitend op grond van [artikel 3 van het Besluit samenwerking VO-BVE][ref2]
      voor een of meer vakken voortgezet algemeen volwassenenonderwijs volgen in plaats van voortgezet onderwijs, op
      de teldatum voor 50% mee, met dien verstande dat zij volledig meetellen voor de bepaling van de hoogte van de
      bekostiging indien het betreft lesmateriaal als bedoeld in [artikel 6e van de wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0019143#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel6e
    url: https://wetten.overheid.nl/BWBR0005672/2021-07-01#Artikel7b
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '29'
      - id: ref2
        bwb_id: BWBR0019143
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0002399
        artikel: 6e
  - number: 7c.1
    text: |-
      Voor de toepassing van [artikel 6h, eerste lid, van de wet][ref1] is vereist dat tussen het bevoegd gezag van een
      school of scholengemeenschap en het bevoegd gezag van een school voor voortgezet speciaal onderwijs, een school
      voor speciaal en voortgezet speciaal onderwijs, dan wel van een instelling voor speciaal en voortgezet speciaal
      onderwijs als bedoeld in de [Wet op de expertisecentra][ref2], een schriftelijke overeenkomst over de uitvoering
      daarvan wordt gesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel6h
      [ref2]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0005672/2021-07-01#Artikel7c
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 6h
      - id: ref2
        bwb_id: BWBR0003549
  - number: 7c.2
    text: 'De overeenkomst, bedoeld in het eerste lid, bevat in elk geval afspraken over:'
    url: https://wetten.overheid.nl/BWBR0005672/2021-07-01#Artikel7c
  - number: 7c.2.a
    text: de termijn waarvoor de overeenkomst is aangegaan;
    url: https://wetten.overheid.nl/BWBR0005672/2021-07-01#Artikel7c
  - number: 7c.2.b
    text: de vakken die de leerling zal ontvangen;
    url: https://wetten.overheid.nl/BWBR0005672/2021-07-01#Artikel7c
  - number: 7c.2.c
    text: het aantal lesuren per week per vak dat ten minste wordt aangeboden; en
    url: https://wetten.overheid.nl/BWBR0005672/2021-07-01#Artikel7c
  - number: 7c.2.d
    text: de aanwezigheid van leraren, onderwijsondersteunend personeel en andere begeleiding van de leerling.
    url: https://wetten.overheid.nl/BWBR0005672/2021-07-01#Artikel7c
  - number: 7c.3
    text: |-
      Een leerling kan gedurende een termijn van ten hoogste drie maanden aaneengesloten het volledige onderwijsprogramma
      volgen op een school of instelling als bedoeld in het eerste lid. De overeenkomst, bedoeld in het eerste lid, bevat
      dan in elk geval afspraken over:
    url: https://wetten.overheid.nl/BWBR0005672/2021-07-01#Artikel7c
  - number: 7c.3.a
    text: de termijn waarvoor de overeenkomst is aangegaan;
    url: https://wetten.overheid.nl/BWBR0005672/2021-07-01#Artikel7c
  - number: 7c.3.b
    text: de aanwezigheid van leraren, onderwijsondersteunend personeel en andere begeleiding van de leerling; en
    url: https://wetten.overheid.nl/BWBR0005672/2021-07-01#Artikel7c
  - number: 7c.3.c
    text: |-
      het bedrag voor de personele en materiële kosten dat het bevoegd gezag van de school of scholengemeenschap waar
      de leerling is ingeschreven betaalt aan het bevoegd gezag van de school dan wel van een instelling, bedoeld in het
      eerste lid, waarmee de overeenkomst wordt gesloten.
    url: https://wetten.overheid.nl/BWBR0005672/2021-07-01#Artikel7c
  - number: 7c.4
    text: |-
      Onderdeel c is niet van toepassing op een overeenkomst met een school waaraan onderwijs
      wordt gegeven aan leerlingen die zijn opgenomen in een inrichting als bedoeld in
      [artikel 1, onder b, van de Beginselenwet justitiële jeugdinrichtingen][ref1] of een gesloten accommodatie als
      bedoeld in [artikel 1.1 van de Jeugdwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel1
    url: https://wetten.overheid.nl/BWBR0005672/2021-07-01#Artikel7c
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0034925
        artikel: '1'
  - number: 7c.5
    text: |-
      Indien voor de toepassing van [artikel 6h, eerste lid, van de wet][ref1], scholen, scholengemeenschappen dan wel
      instellingen binnen hetzelfde bevoegd gezag zijn betrokken, maakt dit bevoegd gezag afspraken met deze betrokken
      scholen, scholengemeenschappen of instellingen over de onderdelen, genoemd in het tweede of derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel6h
    url: https://wetten.overheid.nl/BWBR0005672/2021-07-01#Artikel7c
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 6h
  - number: 7d.1
    text: |-
      In afwijking van [artikel 7, eerste lid][ref1], worden nieuwkomers niet meegeteld voor het vaststellen
      van de bekostiging, bedoeld in [artikel 96d, eerste en tweede lid][ref2], en voor de toepassing van de
      [artikelen 85a][ref3] en [89 van de wet][ref4] en de daarop berustende bepalingen met uitzondering van de
      bepalingen die betrekking hebben op de bekostiging van nieuwkomers.


      [ref1]: https://wetten.overheid.nl/BWBR0005672#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel96d
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel85a
      [ref4]: https://wetten.overheid.nl/BWBR0002399#Artikel89
    url: https://wetten.overheid.nl/BWBR0005672/2021-07-01#Artikel7d
    references:
      - id: ref1
        bwb_id: BWBR0005672
        artikel: '7'
        hoofdstuk: '1'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 96d
      - id: ref3
        bwb_id: BWBR0002399
        artikel: 85a
      - id: ref4
        bwb_id: BWBR0002399
        artikel: '89'
  - number: 7d.2
    text: |-
      Voor de toepassing van [artikel 8, zesde lid][ref1], worden de nieuwkomers meegeteld die op 1 januari, 1 april,
      1 juli of 1 oktober als werkelijk schoolgaand staan ingeschreven. [Artikel 7, tweede tot en met vijfde lid][ref2],
      is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005672#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005672#Artikel7
    url: https://wetten.overheid.nl/BWBR0005672/2021-07-01#Artikel7d
    references:
      - id: ref1
        bwb_id: BWBR0005672
        artikel: '8'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0005672
        artikel: '7'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: '8.1'
    text: |-
      Onze Minister stelt jaarlijks het bedrag, bedoeld in [artikel 96d, eerste lid][ref1], van de wet vast. Het bedrag
      heeft betrekking op een kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel96d
    url: https://wetten.overheid.nl/BWBR0005672/2021-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 96d
  - number: '8.2'
    text: |-
      Bij de vaststelling van het in [artikel 96d, eerste lid][ref1], van de wet bedoelde bedrag, neemt Onze Minister wat
      het aantal leerlingen betreft in aanmerking het aantal leerlingen dat op 1 oktober van het jaar, voorafgaand aan
      het jaar waarop het in de eerste volzin bedoeld bedrag betrekking heeft, als werkelijk schoolgaand aan de school
      stond ingeschreven, onverminderd [artikel 7][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel96d
      [ref2]: https://wetten.overheid.nl/BWBR0005672#Artikel7
    url: https://wetten.overheid.nl/BWBR0005672/2021-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 96d
      - id: ref2
        bwb_id: BWBR0005672
        artikel: '7'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: '8.3'
    text: |-
      Het Rijk betaalt elke maand van het kalenderjaar in verband met de kosten voor het personeel en voor de
      voorzieningen ten behoeve van de exploitatie aan het bevoegd gezag van een school een gedeelte van het bedrag,
      bedoeld in [artikel 96d, eerste lid][ref1], van de wet, waarop het over dat jaar recht heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel96d
    url: https://wetten.overheid.nl/BWBR0005672/2021-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 96d
  - number: '8.4'
    text: |-
      Onze Minister kan op het in het eerste lid bedoelde bedrag in mindering brengen, verwachte bedragen als bedoeld in
      [artikel 96m, tweede lid, onder a tot en met d][ref1], van de wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel96m
    url: https://wetten.overheid.nl/BWBR0005672/2021-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 96m
  - number: '8.5'
    text: |-
      In geval van oprichting, verplaatsing of splitsing van een school kan Onze Minister afwijken van de teldatum en de
      op die afwijkende datum getelde leerlingen toerekenen aan de nieuwe scholen. Hij kan daarbij nadere voorschriften
      geven.
    url: https://wetten.overheid.nl/BWBR0005672/2021-07-01#Artikel8
  - number: '8.6'
    text: |-
      Met inachtneming van [artikel 7d, tweede lid][ref1], stelt Onze Minister vier keer per jaar het bekostigingsbedrag
      vast dat het bevoegd gezag ontvangt voor het onderwijs aan nieuwkomers.


      [ref1]: https://wetten.overheid.nl/BWBR0005672#Artikel7d
    url: https://wetten.overheid.nl/BWBR0005672/2021-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0005672
        artikel: 7d
        hoofdstuk: '1'
        paragraaf: '2'
  - number: '8.7'
    text: De hoogte van het bedrag per nieuwkomer wordt bij ministeriële regeling vastgesteld.
    url: https://wetten.overheid.nl/BWBR0005672/2021-07-01#Artikel8
  - number: 8a
    text: |-
      De bekostiging voor regionale ondersteuning, bedoeld in [artikel 85b1, vierde lid][ref1], en
      [89a1, vierde lid, van de wet][ref2], wordt berekend door een jaarlijks bij ministeriële regeling te bepalen
      bedrag te vermenigvuldigen met het aantal leerlingen, bedoeld in [artikel 7 van het Bekostigingsbesluit WVO][ref3],
      dat staat ingeschreven op de vestigingen binnen het samenwerkingsverband. Bij ministeriële regeling kunnen tot
      1 januari 2017 regels worden gesteld voor de berekening van de bekostiging voor regionale ondersteuning, welke
      regels kunnen afwijken van het bepaalde in de eerste volzin. Een leerling telt slechts eenmaal mee voor de
      berekening van de bekostiging.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel85b1
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel89a1
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel7
    url: https://wetten.overheid.nl/BWBR0005672/2021-07-01#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 85b1
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 89a1
      - id: ref3
        bwb_id: BWBR0002399
        artikel: '7'
  - number: '9.1'
    text: |-
      Onze Minister stelt het bedrag, bedoeld in [artikel 96d, tweede lid][ref1], van de wet, vast.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel96d
    url: https://wetten.overheid.nl/BWBR0005672/2021-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 96d
  - number: '9.2'
    text: Het bedrag wordt in een keer betaald dan wel wordt betaald volgens een door Onze Minister te bepalen kasritme.
    url: https://wetten.overheid.nl/BWBR0005672/2021-07-01#Artikel9
  - number: '10'
    text: |-
      Het Rijk bekostigt de exploitatiekosten met ingang van de eerste schooldag van een school waarvan het bekostigd
      onderwijs op grond van [afdeling I van titel III van de wet][ref1] een aanvang neemt. Onze Minister kan op verzoek
      van het bevoegd gezag een door hem te bepalen deel van de exploitatiekosten gedurende een periode van ten hoogste
      vier maanden voor de eerste schooldag voor bekostiging in aanmerking brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#AfdelingI
    url: https://wetten.overheid.nl/BWBR0005672/2021-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002399
        afdeling: I
  - number: 14a.1
    text: |-
      Ten behoeve van de vaststelling van de bekostiging, bedoeld in [artikel 8][ref1], doet Onze
      Minister aan het bevoegd gezag jaarlijks voor 15 januari volgend op de teldatum overzichten
      toekomen van de gegevens, bedoeld in de [artikelen 5, eerste lid][ref2], [6, derde lid][ref3], en
      [8, vijfde lid, onderdeel a, van het Besluit register onderwijsdeelnemers][ref4], over het aantal leerlingen op
      de teldatum dat bij de vaststelling van de bekostiging voor het daarop volgende kalenderjaar in aanmerking wordt
      genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005672#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0042639#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0042639#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0042639#Artikel8
    url: https://wetten.overheid.nl/BWBR0005672/2021-07-01#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0005672
        artikel: '8'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0042639
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0042639
        artikel: '6'
      - id: ref4
        bwb_id: BWBR0042639
        artikel: '8'
  - number: 14a.2
    text: 'Het bevoegd gezag dient jaarlijks voor 1 juli bij Onze Minister voor het daaropvolgende schooljaar in:'
    url: https://wetten.overheid.nl/BWBR0005672/2021-07-01#Artikel14a
  - number: 14a.2.a
    text: |-
      een verklaring van het bevoegd gezag omtrent de juistheid van de gegevens,
      bedoeld in de [artikelen 5, eerste lid][ref1], [6, derde lid][ref2], en
      [8, vijfde lid, onderdeel a, van het Besluit register onderwijsdeelnemers][ref3], van de leerlingen op de teldatum
      die het aan Onze Minister heeft gemeld, of


      [ref1]: https://wetten.overheid.nl/BWBR0042639#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0042639#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0042639#Artikel8
    url: https://wetten.overheid.nl/BWBR0005672/2021-07-01#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0042639
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0042639
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0042639
        artikel: '8'
  - number: 14a.2.b
    text: |-
      indien de onder a bedoelde gegevens naar het oordeel van het bevoegd gezag onjuist zijn, de door het bevoegd gezag
      gecorrigeerde gegevens, alsmede
    url: https://wetten.overheid.nl/BWBR0005672/2021-07-01#Artikel14a
  - number: 14a.2.c
    text: een verklaring van een accountant omtrent de juistheid van de gegevens, bedoeld in onderdeel a of onderdeel b.
    url: https://wetten.overheid.nl/BWBR0005672/2021-07-01#Artikel14a
  - number: 14a.3
    text: |-
      Bij ministeriële regeling kan een model voor de in het tweede lid, onderdelen a en c, bedoelde verklaringen worden
      vastgesteld. Onze Minister kan een leidraad vaststellen ten behoeve van de controle door de accountant, bedoeld in
      het tweede lid, onderdeel c.
    url: https://wetten.overheid.nl/BWBR0005672/2021-07-01#Artikel14a
  - number: 14a.4
    text: |-
      Indien voor 1 juli in enig jaar aanvullende bekostiging is vastgesteld, dient het bevoegd gezag voor die datum bij
      Onze Minister een verklaring in omtrent de juistheid van de in voorkomende gevallen voor de vaststelling van de
      aanvullende bekostiging aan Onze Minister gemelde gegevens. Het tweede lid, onderdeel c, en het derde lid, zijn van
      overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0005672/2021-07-01#Artikel14a
  - number: '15.1'
    text: |-
      Onze Minister maakt de in [artikel 8][ref1] bedoelde bekostiging bekend voorafgaand aan het
      kalenderjaar, waarop deze betrekking heeft. Indien de verklaring van de accountant, bedoeld in de
      [artikelen 14a, tweede lid, onder c][ref2], daartoe aanleiding geeft, wijzigt Onze Minister de bekostiging of
      aanvullende bekostiging.


      [ref1]: https://wetten.overheid.nl/BWBR0005672#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005672#Artikel14a
    url: https://wetten.overheid.nl/BWBR0005672/2021-07-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005672
        artikel: '8'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0005672
        artikel: 14a
        hoofdstuk: '2'
  - number: '15.2'
    text: |-
      De in [artikel 8][ref1] bedoelde bekostiging kan door Onze Minister worden gewijzigd wegens algemene
      salarismaatregelen of wegens andere al dan niet uit de rijksbegroting voortvloeiende maatregelen.


      [ref1]: https://wetten.overheid.nl/BWBR0005672#Artikel8
    url: https://wetten.overheid.nl/BWBR0005672/2021-07-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005672
        artikel: '8'
        hoofdstuk: '2'
  - number: 15f.1
    text: |-
      Onze Minister brengt op de bekostiging, bedoeld in [artikel 96m, eerste lid, van de wet][ref1] voor
      een school voor een kalenderjaar een bedrag in mindering volgens de volgende formule: (PI/PL) x (A +
      B + C + D) In deze formule wordt verstaan onder: PI: de bekostiging voor personeelskosten, bedoeld in
      [Titel III, afdeling II, hoofdstuk II, paragraaf 2 van de wet][ref2], voor zover gebaseerd op de formatieplaatsen,
      van de desbetreffende school voor het desbetreffende kalenderjaar; PL: de bekostiging voor personeelskosten,
      bedoeld in [Titel III, afdeling II, hoofdstuk II, paragraaf 2 van de wet][ref3], voor zover gebaseerd op de
      formatieplaatsen, van de scholen voor het desbetreffende kalenderjaar; A: de kosten van de uitkeringen in
      het desbetreffende kalenderjaar voor gewezen personeel van de scholen voortvloeiend uit een ontslag dat is
      geëffectueerd voor 1 augustus 1995; B: de kosten van de uitkeringen in het desbetreffende kalenderjaar voor
      gewezen personeel van de scholen voortvloeiend uit een ontslag dat is geëffectueerd in de periode tussen 31 juli
      1995 en 1 januari 2007 en waarvoor de rechtspersoon, bedoeld in [artikel 98b van de wet][ref4], zoals luidend
      op 31 december 2006, heeft ingestemd op grond van [artikel 96o, derde lid, tweede volzin, van de wet][ref5],
      zoals luidend op 31 december 2006, met het ten laste van bedoelde rechtspersoon brengen van de kosten van deze
      uitkeringen; C: een bij ministeriële regeling vast te stellen percentage van de kosten van de uitkeringen in
      het desbetreffende kalenderjaar voor gewezen personeel van de scholen voortvloeiend uit een ontslag dat is
      geëffectueerd op of na 1 januari 2007, waarbij ten aanzien van de verschillende soorten uitkeringen verschillende
      percentages kunnen worden vastgesteld; D: de kosten van de uitkeringen in het desbetreffende kalenderjaar
      voor gewezen personeel van een school die de taken beëindigt, anders dan op grond van een samenvoeging, een
      bestuursoverdracht als bedoeld in [artikel 42c van de wet][ref6] indien het een openbare school betreft, en
      [artikel 50 van de wet][ref7] indien het een bijzondere school betreft, of een splitsing, indien het bevoegd gezag
      van deze school niet tevens een andere school onder zijn bestuur heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel96m
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Paragraaf2
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Paragraaf2
      [ref4]: https://wetten.overheid.nl/BWBR0002399#Artikel98b
      [ref5]: https://wetten.overheid.nl/BWBR0002399#Artikel96o
      [ref6]: https://wetten.overheid.nl/BWBR0002399#Artikel42c
      [ref7]: https://wetten.overheid.nl/BWBR0002399#Artikel50
    url: https://wetten.overheid.nl/BWBR0005672/2021-07-01#Artikel15f
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 96m
      - id: ref2
        bwb_id: BWBR0002399
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0002399
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0002399
        artikel: 98b
      - id: ref5
        bwb_id: BWBR0002399
        artikel: 96o
      - id: ref6
        bwb_id: BWBR0002399
        artikel: 42c
      - id: ref7
        bwb_id: BWBR0002399
        artikel: '50'
  - number: 15f.2
    text: |-
      Onze Minister brengt tevens op de bekostiging van een school of van een samenwerkingsverband voor het in het eerste
      lid bedoelde kalenderjaar in mindering:
    url: https://wetten.overheid.nl/BWBR0005672/2021-07-01#Artikel15f
  - number: 15f.2.a
    text: |-
      de kosten van de uitkeringen in het desbetreffende kalenderjaar voor gewezen personeel van de desbetreffende
      school voortvloeiend uit een ontslag dat is geëffectueerd in de periode tussen 31 juli 1995 en 1 januari 2007 en
      waarvoor de rechtspersoon, bedoeld in [artikel 98b van de wet][ref1], zoals luidend op 31 december 2006, niet heeft
      ingestemd op grond van [artikel 96o, derde lid, tweede volzin, van de wet][ref2], zoals luidend op 31 december
      2006, met het ten laste van bedoelde rechtspersoon brengen van de kosten van deze uitkeringen, en


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel98b
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel96o
    url: https://wetten.overheid.nl/BWBR0005672/2021-07-01#Artikel15f
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 98b
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 96o
  - number: 15f.2.b
    text: |-
      een bij ministeriële regeling vast te stellen percentage van de kosten van de uitkeringen in het desbetreffende
      kalenderjaar voor gewezen personeel van de desbetreffende school of van het desbetreffende samenwerkingsverband
      voortvloeiend uit een ontslag dat is geëffectueerd op of na 1 januari 2007, waarbij het percentage bedoeld in het
      eerste lid, onder C, en het in dit onderdeel bedoelde percentage samen 100 bedraagt.
    url: https://wetten.overheid.nl/BWBR0005672/2021-07-01#Artikel15f
  - number: 15f.3
    text: |-
      De uitkomsten van de in het eerste en tweede lid bedoelde berekeningen worden rekenkundig afgerond op hele
      eurocenten.
    url: https://wetten.overheid.nl/BWBR0005672/2021-07-01#Artikel15f
  - number: 15f.4
    text: |-
      Indien een school is opgeheven, wordt het desbetreffende bevoegd gezag belast indien deze nog ten minste één andere
      school onder zijn bestuur heeft.
    url: https://wetten.overheid.nl/BWBR0005672/2021-07-01#Artikel15f
  - number: 15f.5
    text: |-
      Over het moment en de wijze van in mindering brengen, bedoeld in het eerste en tweede lid, kunnen bij ministeriële
      regeling nadere voorschriften worden gegeven.
    url: https://wetten.overheid.nl/BWBR0005672/2021-07-01#Artikel15f
  - number: 15g.1
    text: |-
      Onze Minister gaat gedurende het kalenderjaar waarop de verminderingen op de bekostiging, bedoeld in
      [artikel 15f, eerste lid][ref1], betrekking hebben, per maand over tot een voorlopige inhouding op de bekostiging.


      [ref1]: https://wetten.overheid.nl/BWBR0005672#Artikel15f
    url: https://wetten.overheid.nl/BWBR0005672/2021-07-01#Artikel15g
    references:
      - id: ref1
        bwb_id: BWBR0005672
        artikel: 15f
        hoofdstuk: 2b
  - number: 15g.2
    text: |-
      De definitieve vaststelling van de verminderingen, bedoeld in het eerste lid, vindt plaats zo snel als mogelijk is
      na afloop van het desbetreffende jaar.
    url: https://wetten.overheid.nl/BWBR0005672/2021-07-01#Artikel15g
  - number: 15g.3
    text: |-
      Bij ministeriële regeling kunnen nadere voorschriften over de wijze van toepassing van het eerste en tweede lid
      worden gegeven.
    url: https://wetten.overheid.nl/BWBR0005672/2021-07-01#Artikel15g
  - number: '16.1'
    text: |-
      De boekhouding van een school is zodanig ingericht dat op doelmatige wijze informatie kan worden verkregen omtrent
      het gevoerde financiële beheer.
    url: https://wetten.overheid.nl/BWBR0005672/2021-07-01#Artikel16
  - number: '16.2'
    text: |-
      Het bevoegd gezag verstrekt op verzoek van Onze Minister nadere financiële informatie met betrekking tot de school.
      De wijze waarop deze informatie wordt verstrekt, kan bij ministeriële regeling worden geregeld.
    url: https://wetten.overheid.nl/BWBR0005672/2021-07-01#Artikel16
  - number: '16.3'
    text: Het boekjaar is gelijk aan het kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0005672/2021-07-01#Artikel16
  - number: '17.1'
    text: Het bevoegd gezag stelt jaarlijks tijdig voor het komende begrotingsjaar een begroting vast voor de school.
    url: https://wetten.overheid.nl/BWBR0005672/2021-07-01#Artikel17
  - number: '17.2'
    text: |-
      De begroting behelst een raming van de baten en lasten van de school en is sluitend. De in de begroting voorziene
      baten uit de van het Rijk te ontvangen bekostiging komen overeen met de voor het desbetreffende jaar door Onze
      Minister vastgestelde bekostiging.
    url: https://wetten.overheid.nl/BWBR0005672/2021-07-01#Artikel17
  - number: '17.3'
    text: Het bevoegd gezag doet de noodzakelijke uitgaven binnen de grenzen van de begroting.
    url: https://wetten.overheid.nl/BWBR0005672/2021-07-01#Artikel17
  - number: '17.4'
    text: |-
      Af- en overschrijving op de uitgavenposten van de begroting kunnen door het bevoegd gezag geschieden overeenkomstig
      door het bevoegd gezag vastgestelde regels.
    url: https://wetten.overheid.nl/BWBR0005672/2021-07-01#Artikel17
  - number: '17.5'
    text: |-
      Indien Onze Minister het bevoegd gezag daarom verzoekt, wordt de vastgestelde begroting aan Onze Minister
      overgelegd.
    url: https://wetten.overheid.nl/BWBR0005672/2021-07-01#Artikel17
  - number: '17.6'
    text: Bij ministeriële regeling kan een model voor de inrichting van de begroting worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0005672/2021-07-01#Artikel17
  - number: '18.1'
    text: Het bevoegd gezag stelt jaarlijks ten behoeve van de school een jaarrekening vast over het afgelopen jaar.
    url: https://wetten.overheid.nl/BWBR0005672/2021-07-01#Artikel18
  - number: '18.2'
    text: |-
      In de jaarrekening legt het bevoegd gezag verantwoording af over het financieel beheer. Uit de jaarrekening blijkt
      dat sprake is van een rechtmatige aanwending van de rijksbekostiging. De jaarrekening omvat mede de gegevens die
      van belang zijn voor de verantwoording met betrekking tot de besteding van toegekende aanvullende bekostiging.
    url: https://wetten.overheid.nl/BWBR0005672/2021-07-01#Artikel18
  - number: '18.3'
    text: |-
      Het bevoegd gezag dient de vastgestelde jaarrekening voor 1 juli van het jaar volgend op het boekjaar in bij Onze
      Minister. De jaarrekening gaat vergezeld van een verklaring omtrent de getrouwheid, afgegeven door een door het
      bevoegd gezag aangewezen accountant. Bij de aanwijzing van de accountant bedingt het bevoegd gezag dat aan Onze
      Minister op diens verzoek inzage wordt geboden in de controlerapporten en de controledossiers van de accountant.
    url: https://wetten.overheid.nl/BWBR0005672/2021-07-01#Artikel18
  - number: '18.4'
    text: |-
      Indien het bevoegd gezag meer dan één school in stand houdt, wordt voor deze scholen een gezamenlijke balans en een
      gezamenlijke exploitatierekening vastgesteld. Bij de jaarrekening is een bijlage gevoegd die inzicht biedt in het
      bestedingspatroon ten aanzien van de afzonderlijke scholen van het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0005672/2021-07-01#Artikel18
  - number: '18.5'
    text: Bij ministeriële regeling wordt een model voor de inrichting van de jaarrekening vastgesteld.
    url: https://wetten.overheid.nl/BWBR0005672/2021-07-01#Artikel18
  - number: '18.6'
    text: |-
      Onze Minister kan een leidraad vaststellen met betrekking tot de inrichting en de uitvoering van de controle door
      de accountant.
    url: https://wetten.overheid.nl/BWBR0005672/2021-07-01#Artikel18
  - number: '20.1'
    text: |-
      Indien aan het bevoegd gezag van een school een aanvullende bekostiging is verstrekt onder de voorwaarde dat deze
      bekostiging voor het bij de verstrekking aangegeven doel wordt besteed, blijkt uit de jaarrekening van de school in
      hoeverre deze bekostiging voor dat doel is besteed.
    url: https://wetten.overheid.nl/BWBR0005672/2021-07-01#Artikel20
  - number: '20.2'
    text: |-
      Indien verrekening plaatsvindt of zal plaatsvinden van het daadwerkelijk bestede bedrag met de vastgestelde
      aanvullende bekostiging, maakt het bevoegd gezag in de desbetreffende jaarrekening melding van het daadwerkelijk
      bestede bedrag.
    url: https://wetten.overheid.nl/BWBR0005672/2021-07-01#Artikel20
  - number: '21.1'
    text: |-
      Onverminderd de bevoegdheid van de Inspectie van het onderwijs op grond van de [Wet op het onderwijstoezicht][ref1]
      kan Onze Minister een onderzoek instellen of doen instellen naar de jaarverslaggeving, naar de gegevens die
      noodzakelijk zijn voor de vaststelling van de bekostiging, naar de rechtmatigheid van de bestedingen en naar de
      doelmatigheid van het beheer van de school.


      [ref1]: https://wetten.overheid.nl/BWBR0013800
    url: https://wetten.overheid.nl/BWBR0005672/2021-07-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0013800
  - number: '21.2'
    text: |-
      Indien uit een op grond van het eerste lid ingesteld onderzoek blijkt dat de bekostiging voor een school onjuist
      is vastgesteld, kan Onze Minister correcties aanbrengen op de bekostiging. Onze Minister doet het bevoegd gezag
      schriftelijk mededeling van een besluit tot het aanbrengen van een correctie op de bekostiging.
    url: https://wetten.overheid.nl/BWBR0005672/2021-07-01#Artikel21
  - number: '21.3'
    text: |-
      Indien uit de jaarverslaggeving, bedoeld in [artikel 103, eerste lid, van de wet][ref1], uit de verklaring
      van de accountant, bedoeld in artikel 103, vierde lid, van de wet of uit een op grond van het eerste lid
      ingesteld onderzoek blijkt dat de bekostiging voor een school onrechtmatig is besteed of ondoelmatig is
      aangewend, kan Onze Minister bepalen dat het desbetreffende gedeelte van de bekostiging niet ten laste komt
      van het Rijk of dat de daarmee gemoeide bedragen in mindering worden gebracht op de bekostiging, onverminderd
      [artikel 4:49 van de Algemene wet bestuursrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel103
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0005672/2021-07-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '103'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '22'
    text: |-
      Een in [artikel 21, tweede lid][ref1], bedoelde correctie wordt, indien de correctie strekt tot verhoging van de
      bekostiging, binnen acht weken na de mededeling, bedoeld in artikel 21, tweede lid, door Onze Minister betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0005672#Artikel21
    url: https://wetten.overheid.nl/BWBR0005672/2021-07-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0005672
        artikel: '21'
        hoofdstuk: '3'
  - number: '23'
    text: |-
      Bij samenvoeging van scholen als bedoeld in [artikel 71, tweede of derde lid, van de wet][ref1]
      of afsplitsing van een of meer scholen van een scholengemeenschap als bedoeld in
      [artikel 72, derde lid, onderdeel c, van de wet][ref2], op 1 augustus van enig kalenderjaar worden:


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel71
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel72
    url: https://wetten.overheid.nl/BWBR0005672/2021-07-01#Artikel23
    references:
