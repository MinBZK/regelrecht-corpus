    text: |-
      aanvullende bekostiging op grond van de [artikelen 85a][ref1] of [89 van de wet][ref2], van alle bij de
      samenvoeging betrokken scholen dan wel van de bij de afsplitsing betrokken scholengemeenschap gehandhaafd tot het
      einde van dat kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel85a
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel89
    url: https://wetten.overheid.nl/BWBR0005672/2021-07-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 85a
      - id: ref2
        bwb_id: BWBR0002399
        artikel: '89'
  - number: '24.1'
    text: |-
      Indien een school wordt opgeheven anders dan in verband met samenvoeging met een andere school of de aanspraak op
      bekostiging voor een school verloren gaat, stort het bevoegd gezag het exploitatie-overschot terug in ’s Rijks kas.
      Het neemt daarbij het derde lid in acht.
    url: https://wetten.overheid.nl/BWBR0005672/2021-07-01#Artikel24
  - number: '24.2'
    text: 'Voor de toepassing van dit artikel wordt onder exploitatie-overschot verstaan:'
    url: https://wetten.overheid.nl/BWBR0005672/2021-07-01#Artikel24
  - number: 24.2.a
    text: |-
      het bedrag van de bekostiging, bedoeld in [artikel 96m, eerste lid][ref1], van de wet, verminderd met de lasten
      over dat jaar voor zover deze als rechtmatig kunnen worden aangemerkt,


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel96m
    url: https://wetten.overheid.nl/BWBR0005672/2021-07-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 96m
  - number: 24.2.b
    text: de reserveringen voor zover afkomstig uit ’s Rijks kas, met inbegrip van de ontvangen rentebaten, en
    url: https://wetten.overheid.nl/BWBR0005672/2021-07-01#Artikel24
  - number: 24.2.c
    text: |-
      voor zover het een bijzondere school betreft, de niet bestede gedeelten van de uitkeringen op grond van de
      voorschriften inzake de gemeentelijke overschrijding.
    url: https://wetten.overheid.nl/BWBR0005672/2021-07-01#Artikel24
  - number: '24.3'
    text: |-
      Indien het exploitatie-overschot van een bijzondere school mede is opgebouwd uit uitkeringen als bedoeld in het
      tweede lid, onderdeel c, geldt als maatstaf voor de verdeling van dat deel van het exploitatie-overschot tussen
      Rijk en de desbetreffende gemeente de verhouding tussen het ontvangen bedrag aan bekostiging van het Rijk en het
      ontvangen bedrag aan overschrijdingsuitkeringen van de gemeente in een periode van vijf jaren, voorafgaand aan het
      jaar van de beëindiging van de bekostiging. De verdeling behoeft de goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0005672/2021-07-01#Artikel24
  - number: '25'
    text: |-
      Indien een of meer scholen voor voortgezet onderwijs deel uitmaken van een scholengemeenschap als bedoeld in
      [artikel 2.6 van de Wet educatie en beroepsonderwijs][ref1], geldt wat de grondslag en de wijze van bekostiging van
      de exploitatiekosten betreft dat in afwijking van [artikel 86, derde lid][ref2], van de wet niet worden verstrekt
      de bedragen, bedoeld onder a en b van dat lid.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel86
    url: https://wetten.overheid.nl/BWBR0005672/2021-07-01#Artikel25
