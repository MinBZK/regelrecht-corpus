  - number: '38'
    text: |-
      1 Het bevoegd gezag van een bijzondere school draagt zorg voor een overzichtelijke en deugdelijke administratie van
      de financiële gegevens van elk van de onder zijn beheer staande scholen.

      2 De administratie van elke bijzondere school omvat alle ontvangsten, gesplitst naar de ontvangsten ingevolge
      de[ artikelen 230][ref1], [242][ref2], [243][ref3], [244][ref4], [246][ref5], [248 tot en met 257][ref6] en
      [274, derde lid][ref7], van de wet en de overige ontvangsten, en alle uitgaven onderscheiden naar:

      a. personele uitgaven;

      b. de uitgaven voor materiële voorzieningen ten behoeve van de instandhouding onderverdeeld in de onderdelen van de
      programma’s van eisen genoemd in [artikel 229, eerste lid][ref8], van de wet;

      c. uitgaven ten behoeve van voorzieningen in de huisvesting;

      d. uitgaven voor nascholing ten behoeve van het personeel;

      e. uitgaven ten behoeve van onderwijs in allochtone levende talen.

      3 De administratie van elke bijzondere school omvat een overzicht van:

      a. vorderingen,

      b. schulden,

      c. reserveringen.

      4 Aan het einde van ieder kalenderjaar wordt voor elke bijzondere school een overzicht van de in de school
      aanwezige inventaris opgemaakt en in de administratie opgenomen waaruit in ieder geval blijkt in welk jaar de
      aanschaffing heeft plaatsgevonden en welke inventaris voor eigen rekening is aangeschaft.

      5 Aan het einde van ieder kalenderjaar wordt voor elke bijzondere school een overzicht opgesteld en in de
      administratie van de school opgenomen van alle uitgaven en ontvangsten die op het desbetreffende kalenderjaar
      betrekking hebben volgens de in het tweede lid aangegeven verdeling. In dit overzicht dient in elk geval aangegeven
      te worden tot welk bedrag uitgaven ten laste van onderscheidenlijk de rijksvergoeding, gemeentelijke vergoedingen
      of eigen middelen zijn gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel230
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel242
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel243
