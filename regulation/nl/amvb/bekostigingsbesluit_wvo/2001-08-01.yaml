        bwb_id: BWBR0002399
        artikel: '246'
      - id: ref2
        bwb_id: BWBR0002399
        artikel: '233'
  - number: '63'
    text: |-
      1 Indien het bedrag aan voorschotten als bedoeld in artikel 56 in een uitkeringsjaar hoger is dan de vergoeding,
      stort het bevoegd gezag onverwijld het verschil terug in ’s Rijks kas, tenzij Onze Minister bepaalt dat verrekening
      plaatsvindt met nog uit te keren vergoedingen.

      2 Indien het bedrag van de vergoedingen hoger is dan de dienaangaande verstrekte voorschotten, vergoedt het Rijk
      aan het bevoegd gezag onverwijld het verschil.

      3 Onze Minister kan voorafgaand aan het vaststellen van een vergoeding een vergoeding voorlopig vaststellen en op
      de voet van het eerste en het tweede lid tot voorlopige verrekening overgaan.
    url: https://wetten.overheid.nl/BWBR0005672/2001-08-01#Artikel63
  - number: '64'
    text: |-
      Ten aanzien van de wijze van uitkering van de vergoeding, bedoeld in [artikel 246, eerste lid][ref1], van de wet,
      is [artikel 57][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel246
      [ref2]: https://wetten.overheid.nl/BWBR0005672#Artikel57
