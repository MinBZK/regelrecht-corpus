  - number: '34'
    text: |-
      1 De directeur van een school op wiens school de leerling staat ingeschreven, schrijft de leerling, indien deze
      de school verlaat, uit met ingang van de dag volgende op de dag waarop de leerling de school voor het laatst heeft
      bezocht en verstrekt de leerling een bewijs van uitschrijving.

      2 Indien de directeur van een school op wiens school de leerling staat ingeschreven binnen 4 weken na de dag
      waarop de leerling de school voor het laatst heeft bezocht een mededeling ontvangt van de directeur, rector of
      centrale directie van een school of een school voor ander onderwijs, van de inschrijving van de leerling op diens
      school, wijzigt de directeur de datum van uitschrijving, bedoeld in het eerste lid, alsnog in de datum van de dag
      voorafgaande aan de inschrijving op de andere school of de school voor ander onderwijs.
    url: https://wetten.overheid.nl/BWBR0005672/2001-08-01#Artikel34
  - number: '35'
    text: |-
      1 Onverminderd het bepaalde in [artikel 161, tiende lid][ref1], van de wet, blijven de gegevens die in
      de leerlingenadministratie zijn opgenomen daarvan in ieder geval deel uitmaken gedurende 5 jaar nadat de
      desbetreffende leerling van de school is uitgeschreven.

      2 Het gemeenschappelijk rapport, bedoeld in [artikel 161, zevende lid][ref2], van de wet, wordt in elk geval binnen
      acht weken na het verstrijken van de termijn, bedoeld in het eerste lid, vernietigd.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel161
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel161
