      1 Het Rijk verstrekt elke maand van het uitkeringsjaar in verband met de materiële voorzieningen ten behoeve
      van de instandhouding aan het bevoegd gezag van een school een twaalfde gedeelte van de vergoeding, bedoeld in
      [artikel 243, eerste lid en derde lid][ref1], van de wet, waarop het over dat jaar recht heeft.

      2 Indien blijkt dat voor het uitkeringsjaar [artikel 243, zevende lid][ref2], van de wet van
      toepassing is, wordt het verschil tussen de vergoeding, bedoeld in het eerste lid, berekend op
      grond van [artikel 243, zevende lid][ref3], van de wet en de vergoeding berekend op grond van
      [artikel 243, vijfde lid][ref4], van de wet, verstrekt in de maanden mei tot en met december van het
      uitkeringsjaar.

      3 Indien [artikel 41, zesde lid][ref5], van toepassing is, vindt verrekening plaats van de vergoeding voor dat jaar
      met de vergoeding die wordt verstrekt in de maanden oktober tot en met december van het uitkeringsjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel243
