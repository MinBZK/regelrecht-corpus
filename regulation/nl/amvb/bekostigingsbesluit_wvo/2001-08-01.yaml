  - number: '59'
    text: |-
      1 Het bevoegd gezag van een school als bedoeld in [artikel 57 onderdeel b][ref1], verstrekt jaarlijks voor een
      bij ministeriële regeling te bepalen tijdstip, ten behoeve van de vaststelling van het voorschot op de vergoeding,
      bedoeld in [artikel 246, eerste lid][ref2], van de wet, aan Onze Minister de gegevens betreffende het personeel.

      2 Ingeval in de gegevens, bedoeld in het eerste lid, wijzigingen optreden, doet het bevoegd gezag binnen vier weken
      mededeling daarvan aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0005672#Artikel57
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel246
