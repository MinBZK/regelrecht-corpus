  - number: '23'
    text: |-
      Bij ministeriële regeling kunnen voorschriften worden gegeven met betrekking tot de bepaling van de omvang
      en inzake de wijze van vaststelling en uitkering van een vergoeding voor exploitatiekosten, personeelskosten,
      huisvestingskosten en inventariskosten ten behoeve van inrichtingen voor voortgezet onderwijs.
    url: https://wetten.overheid.nl/BWBR0005672/2001-08-01#Artikel23
  - number: '24'
    text: |-
      1 Indien een school wordt opgeheven anders dan in verband met samenvoeging met een andere school of de aanspraak op
      bekostiging voor een school verloren gaat, stort het bevoegd gezag het exploitatie-overschot terug in ’s Rijks kas.
      Het neemt daarbij het derde lid in acht.

      2 Voor de toepassing van dit artikel wordt onder exploitatie-overschot verstaan:

      a. het bedrag van de vergoedingen, bedoeld in [artikel 96m, eerste lid][ref1], van de wet, verminderd met de lasten
      over dat jaar voor zover deze als rechtmatig kunnen worden aangemerkt,

      b. de reserveringen voor zover afkomstig uit ’s Rijks kas, met inbegrip van de ontvangen rentebaten, en

      c. voor zover het een bijzondere school betreft, de niet bestede gedeelten van de uitkeringen op grond van de
      voorschriften inzake de gemeentelijke overschrijding.

      3 Indien het exploitatie-overschot van een bijzondere school mede is opgebouwd uit uitkeringen als bedoeld in het
      tweede lid, onderdeel c, geldt als maatstaf voor de verdeling van dat deel van het exploitatie-overschot tussen
      Rijk en de desbetreffende gemeente de verhouding tussen het ontvangen bedrag aan vergoedingen van het Rijk en het
      ontvangen bedrag aan overschrijdingsuitkeringen van de gemeente in een periode van vijf jaren, voorafgaand aan het
      jaar van de beëindiging van de bekostiging. De verdeling behoeft de goedkeuring van Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel96m
    url: https://wetten.overheid.nl/BWBR0005672/2001-08-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 96m
  - number: '25'
    text: |-
      Indien een of meer scholen voor voortgezet onderwijs deel uitmaken van een scholengemeenschap als bedoeld in
      [artikel 2.6 van de Wet educatie en beroepsonderwijs][ref1], geldt wat de grondslag en de wijze van bekostiging van
      de exploitatiekosten betreft dat in afwijking van [artikel 86, derde lid][ref2], van de wet niet worden verstrekt
      de bedragen, bedoeld onder a en b van dat lid.


