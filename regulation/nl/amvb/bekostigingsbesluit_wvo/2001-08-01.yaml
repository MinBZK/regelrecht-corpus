  - number: '67'
    text: |-
      1 De aanspraak op de vergoeding voor de uitgaven voor nascholing van het personeel, bedoeld in [artikel 240][ref1]
      van de wet, ontstaat met ingang van de eerste kalenderdag van het schooljaar waarin de bekostiging van een nieuw
      geopende school begint.

      2 Indien de situatie, bedoeld in [artikel 20 van het Formatiebesluit W.V.O.][ref2], zich voordoet, ontstaat in
      afwijking van het eerste lid de aanspraak op de vergoeding voor de uitgaven voor nascholing ten hoogste acht weken
      voor de eerste kalenderdag van het schooljaar waarin de bekostiging begint van een nieuw geopende school.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel240
      [ref2]: https://wetten.overheid.nl/BWBR0005446#Artikel20
    url: https://wetten.overheid.nl/BWBR0005672/2001-08-01#Artikel67
