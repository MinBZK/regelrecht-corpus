  - number: '16'
    text: |-
      1 De boekhouding van een school is zodanig ingericht dat op doelmatige wijze informatie kan worden verkregen
      omtrent het gevoerde financiële beheer.

      2 Het bevoegd gezag verstrekt op verzoek van Onze Minister nadere financiële informatie met betrekking tot de
      school. De wijze waarop deze informatie wordt verstrekt, kan bij ministeriële regeling worden geregeld.

      3 Het boekjaar is gelijk aan het kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0005672/2001-08-01#Artikel16
  - number: '17'
    text: |-
      1 Het bevoegd gezag stelt jaarlijks tijdig voor het komende begrotingsjaar een begroting vast voor de school.

      2 De begroting behelst een raming van de baten en lasten van de school en is sluitend. De in de begroting voorziene
      baten uit de van het Rijk te ontvangen vergoeding komen overeen met de voor het desbetreffende jaar door Onze
      Minister vastgestelde vergoeding.

      3 Het bevoegd gezag doet de noodzakelijke uitgaven binnen de grenzen van de begroting.

      4 Af- en overschrijving op de uitgavenposten van de begroting kunnen door het bevoegd gezag geschieden
      overeenkomstig door het bevoegd gezag vastgestelde regels.

      5 Indien Onze Minister het bevoegd gezag daarom verzoekt, wordt de vastgestelde begroting aan Onze Minister
      overgelegd.

      6 Bij ministeriële regeling kan een model voor de inrichting van de begroting worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0005672/2001-08-01#Artikel17
  - number: '18'
    text: |-
      1 Het bevoegd gezag stelt jaarlijks ten behoeve van de school een jaarrekening vast over het afgelopen jaar.

      2 In de jaarrekening legt het bevoegd gezag verantwoording af over het financieel beheer. Uit de jaarrekening
      blijkt dat sprake is van een rechtmatige aanwending van de rijksvergoeding. De jaarrekening omvat mede de gegevens
      die van belang zijn voor de verantwoording met betrekking tot de besteding van op grond van [artikel 85b][ref1] van
      de wet toegekende nascholingsgelden en van toegekende aanvullende vergoedingen.

      3 Het bevoegd gezag dient de vastgestelde jaarrekening voor 1 juli van het jaar volgend op het boekjaar in bij Onze
      Minister. De jaarrekening gaat vergezeld van een verklaring omtrent de getrouwheid, afgegeven door een door het
      bevoegd gezag aangewezen accountant. Bij de aanwijzing van de accountant bedingt het bevoegd gezag dat aan Onze
      Minister op diens verzoek inzage wordt geboden in de controlerapporten en de controledossiers van de accountant.

      4 Indien het bevoegd gezag meer dan één school in stand houdt, wordt voor deze scholen een gezamenlijke balans en
      een gezamenlijke exploitatierekening vastgesteld. Bij de jaarrekening is een bijlage gevoegd die inzicht biedt in
      het bestedingspatroon ten aanzien van de afzonderlijke scholen van het bevoegd gezag.

      5 Bij ministeriële regeling wordt een model voor de inrichting van de jaarrekening vastgesteld.

      6 Onze Minister kan een leidraad vaststellen met betrekking tot de inrichting en de uitvoering van de controle door
      de accountant.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel85b
    url: https://wetten.overheid.nl/BWBR0005672/2001-08-01#Artikel18
