  - number: '21'
    text: |-
      1 Indien uit een op grond van [artikel 19, eerste of tweede lid][ref1], ingesteld onderzoek blijkt dat de omvang
      van de vergoeding of aanvullende vergoeding voor een school onjuist is vastgesteld, kan Onze Minister tot uiterlijk
      één jaar na ontvangst van de bevindingen uit dat onderzoek correcties aanbrengen op de desbetreffende vergoeding of
      aanvullende vergoeding. Onze Minister deelt het bevoegd gezag uiterlijk één jaar na ontvangst van deze bevindingen
      schriftelijk mede of en zo ja welke correcties hij aanbrengt.

      2 Indien uit de jaarrekening, uit de in [artikel 18, derde lid][ref2], bedoelde verklaring van de accountant of
      uit op grond van [artikel 19][ref3] ingesteld onderzoek blijkt dat de vergoeding of aanvullende vergoeding voor
      een school waarop de jaarrekening betrekking heeft, onrechtmatig is besteed of ondoelmatig is aangewend, kan Onze
      Minister bepalen dat het desbetreffende gedeelte van de vergoeding of aanvullende vergoeding niet ten laste komt
      van het Rijk of dat de daarmee gemoeide bedragen in mindering worden gebracht op de vergoeding respectievelijk
      aanvullende vergoeding. Onze Minister doet hiervan binnen een jaar na de ontvangst van de jaarrekening,
      respectievelijk binnen een jaar na ontvangst van de bevindingen uit dat onderzoek, schriftelijk mededeling aan het
      bevoegd gezag.

      3 Indien daarvoor naar zijn oordeel aanleiding is, kan Onze Minister de in het eerste lid bedoelde termijn
      waarbinnen correcties kunnen worden aangebracht, alsmede de in het tweede lid bedoelde termijn, met ten hoogste een
      jaar verlengen.


      [ref1]: https://wetten.overheid.nl/BWBR0005672#Artikel19
