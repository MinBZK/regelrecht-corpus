    text: |-
      De vergoeding voor de materiële voorzieningen ten behoeve van de instandhouding wordt bepaald volgens de
      programma’s van eisen, bedoeld in [artikel 228, derde lid][ref1], van de wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel228
