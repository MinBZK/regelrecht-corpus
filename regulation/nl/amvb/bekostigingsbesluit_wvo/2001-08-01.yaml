        artikel: '67'
        hoofdstuk: V
  - number: '69'
    text: |-
      De vergoeding, bedoeld in [artikel 240][ref1] van de wet, wordt voor de school afzonderlijk vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel240
    url: https://wetten.overheid.nl/BWBR0005672/2001-08-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '240'
  - number: '70'
    text: |-
      1 Het bevoegd gezag verstrekt Onze Minister jaarlijks voor 1 juli in verband met de terugstorting van niet bestede
      gelden voor nascholing, bedoeld in [artikel 241][ref1] van de wet:

      a. een opgave van de in de laatste drie jaren ontvangen vergoedingen voor nascholing,

      b. een opgave van het bedrag dat het fonds, bedoeld in [artikel 241][ref2] van de wet, omvat,

      c. indien het bedrag, bedoeld onder onderdeel *b*, groter is dan het bedrag, bedoeld onder onderdeel *a*, een
      opgave van het verschil,

      d. een verklaring van het bevoegd gezag omtrent de juistheid van de opgaven, bedoeld onder de onderdelen *a*, *b*
      en *c*, en

      e. een verklaring van een accountant omtrent de juistheid van de opgaven, bedoeld onder de onderdelen *a*, *b*
      en *c*.

      2 Bij ministeriële regeling worden jaarlijks voor 1 januari in verband met de terugstorting van niet bestede gelden
      voor nascholing, bedoeld in [artikel 241][ref3] van de wet, vastgesteld:

      a. de leidraad ten behoeve van de controle door de accountant,

      b. de formulieren voor de verstrekking van de gegevens, bedoeld in het eerste lid onderdelen *a*, *b* en *c*, en

      c. de formulieren betreffende de verklaringen, bedoeld in het eerste lid onderdelen *d* en *e*.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel241
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel241
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel241
    url: https://wetten.overheid.nl/BWBR0005672/2001-08-01#Artikel70
    references:
      - id: ref1
