  - number: '8'
    text: |-
      1 Onze Minister stelt jaarlijks het bedrag, bedoeld in [artikel 96d, eerste lid][ref1], van de wet vast. Het bedrag
      heeft betrekking op een schooljaar.

      2 Bij de vaststelling van het in [artikel 96d, eerste lid][ref2], van de wet bedoelde bedrag, neemt Onze Minister
      wat het aantal leerlingen betreft in aanmerking het aantal leerlingen dat op 1 oktober van het jaar, voorafgaand
      aan het schooljaar waarop het in de eerste volzin bedoeld bedrag betrekking heeft, als werkelijk schoolgaand aan de
      school stond ingeschreven, onverminderd [artikel 7][ref3].

      3 Het Rijk betaalt elke maand van het schooljaar in verband met de kosten voor het personeel en voor de
      voorzieningen ten behoeve van de exploitatie aan het bevoegd gezag van een school een gedeelte van het bedrag,
      bedoeld in [artikel 96d, eerste lid][ref4], van de wet, waarop het over dat jaar recht heeft.

      4 Onze Minister kan op het in het eerste lid bedoelde bedrag in mindering brengen, verwachte bedragen als bedoeld
      in [artikel 96m, tweede lid, onder a tot en met f][ref5], van de wet.

      5 In geval van oprichting, verplaatsing of splitsing van een school kan Onze Minister afwijken van de teldatum
      en de op die afwijkende datum getelde leerlingen toerekenen aan de nieuwe scholen. Hij kan daarbij nadere
      voorschriften geven.


