    text: |-
      1 Onze Minister stelt de in [artikel 8][ref1] en [artikel 13][ref2] bedoelde vergoedingen vast zo mogelijk voor 1
      maart doch uiterlijk op 15 maart voorafgaand aan het schooljaar waarop zij betrekking hebben. Indien de verklaring
      van de accountant, bedoeld in [artikel 14, zesde lid, onder c][ref3], daartoe aanleiding geeft, wijzigt Onze
      Minister de vergoeding of aanvullende vergoeding.

      2 De in [artikel 8][ref4] bedoelde vergoedingen kunnen door Onze Minister worden gewijzigd wegens algemene
      salarismaatregelen of wegens andere al dan niet uit de rijksbegroting voortvloeiende maatregelen.


