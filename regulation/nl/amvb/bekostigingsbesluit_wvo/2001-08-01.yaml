  - number: '41'
    text: |-
      1 Het bevoegd gezag dient jaarlijks voor 1 juli bij Onze Minister ten behoeve van de vergoeding
      voor dat jaar voor de materiële voorzieningen ten behoeve van de instandhouding, bedoeld in
      [artikel 243, eerste lid en derde lid][ref1], van de wet, in:

      a. 1°. een verklaring van het bevoegd gezag omtrent de juistheid van de gegevens waarop de vergoeding is
      vastgesteld, of

      2°. indien de gegevens waarop de vergoeding voor dat jaar is vastgesteld naar het oordeel van het bevoegd gezag
      onjuist zijn, de door het bevoegd gezag gecorrigeerde gegevens,

      b. een verklaring van een accountant omtrent de juistheid van de gegevens, bedoeld in onderdeel *a* onder 1° en 2°.

      2 Het bevoegd gezag dient jaarlijks voor 1 juli een verklaring van een accountant omtrent de rechtmatigheid van de
      uitgaven van het voorafgaande jaar, in.

      3 Onze Minister stelt jaarlijks voor 1 januari een leidraad vast ten behoeve van de controle door de accountant,
      bedoeld in het eerste en tweede lid.

      4 Onze Minister stelt jaarlijks voor 1 februari de vergoeding voor dat jaar vast, gebaseerd op de grondslag,
      bedoeld in [artikel 243, vijfde lid][ref2], van de wet.

      5 Indien [artikel 243, zevende lid][ref3], van de wet van toepassing is, stelt Onze Minister jaarlijks voor 1 mei
      de vergoeding, bedoeld in het eerste lid, voor dat jaar nader vast.

      6 Indien de verklaring van de accountant, bedoeld in het eerste lid onderdeel *b*, aanleiding geeft tot wijziging
      van de vergoeding, bedoeld in het eerste lid, stelt Onze Minister voor 1 oktober de vergoeding voor dat jaar nader
      vast.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel243
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel243
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel243
