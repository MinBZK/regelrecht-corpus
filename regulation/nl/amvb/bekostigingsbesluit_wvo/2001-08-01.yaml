  - number: '71'
    text: |-
      1 De aanspraak op vergoeding voor de uitgaven voor de ambulante begeleiding, bedoeld in
      [artikel 21 van het Formatiebesluit W.V.O.][ref1], ontstaat met ingang van de eerste dag van het schooljaar.

      2 De aanspraak op de vergoeding voor uitgaven voor ambulante begeleiding, voorzover deze niet onder het eerste lid
      vallen, ontstaat met ingang van de eerste dag van de maand waarin de begeleiding aanvangt.


      [ref1]: https://wetten.overheid.nl/BWBR0005446#Artikel21
    url: https://wetten.overheid.nl/BWBR0005672/2001-08-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0005446
        artikel: '21'
  - number: '72'
    text: |-
      Het bevoegd gezag van een school die de ambulante begeleiding verzorgt, zendt binnen twee weken na de teldatum aan
      Onze Minister, de inspecteur en, indien het een bijzondere school betreft, eveneens aan burgemeester en wethouders,
      een overzicht van het aantal leerlingen dat op die teldatum werd begeleid.
    url: https://wetten.overheid.nl/BWBR0005672/2001-08-01#Artikel72
  - number: '73'
    text: |-
      Op verzoek van het bevoegd gezag van een school verstrekt Onze Minister een voorschot voor de salarisuitgaven voor
      ambulante begeleiding. De [artikelen 56 tot en met 61][ref1] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005672#Artikel56
    url: https://wetten.overheid.nl/BWBR0005672/2001-08-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0005672
        artikel: '56'
        hoofdstuk: IV
  - number: '74'
    text: |-
      Voor de vaststelling van de vergoeding voor de salarisuitgaven voor de ambulante begeleiding is [artikel 62][ref1]
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005672#Artikel62
    url: https://wetten.overheid.nl/BWBR0005672/2001-08-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0005672
        artikel: '62'
        hoofdstuk: IV
  - number: '75'
    text: |-
      Ten aanzien van de verrekening met de vergoeding is [artikel 63][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005672#Artikel63
    url: https://wetten.overheid.nl/BWBR0005672/2001-08-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0005672
        artikel: '63'
        hoofdstuk: IV
  - number: '76'
    text: |-
      1 Het bevoegd gezag verstrekt jaarlijks voor 1 juli aan Onze Minister ten behoeve van de vaststelling van de
      vergoeding voor de salarisuitgaven voor de ambulante begeleiding:

      a. over het voorafgaande jaar de gegevens betreffende het personeel;

      b. een verklaring van het bevoegd gezag omtrent de juistheid alsmede de tijdige aanmelding van de gegevens waarop
      de voorschotbedragen en de vergoedingsbedragen zijn of worden gebaseerd;

      c. een verklaring van een accountant van de juistheid van de gegevens, bedoeld in onderdeel *b*;

      d. het in het derde lid bedoelde overzicht vergezeld van een opgave van eventuele mutaties in de gegevens.

      2 Bij ministeriële regeling worden jaarlijks voor 1 januari ten behoeve van de vaststelling van de vergoeding,
      bedoeld in dit artikel, vastgesteld:

      a. de leidraad ten behoeve van de controle door de accountant;

      b. de formulieren betreffende de verklaringen bedoeld in het eerste lid onderdelen *b* en *c*;

      c. het formulier voor de verstrekking van de gegevens bedoeld in het eerste lid onderdeel *a*.

      3 Ten behoeve van de afrekening van de vergoeding verstrekt Onze Minister jaarlijks voor 1 februari overzichten per
      school betreffende formatierekeneenheden en verstrekte voorschotten.
    url: https://wetten.overheid.nl/BWBR0005672/2001-08-01#Artikel76
  - number: '77'
    text: 'Dit besluit wordt aangehaald als: Bekostigingsbesluit W.V.O.'
    url: https://wetten.overheid.nl/BWBR0005672/2001-08-01#Artikel77
