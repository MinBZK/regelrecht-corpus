    text: |-
      Een in [artikel 21, eerste lid][ref1], bedoelde correctie wordt verrekend met de vergoeding of aanvullende
      vergoeding waarop het bevoegd gezag aanspraak heeft of wordt, indien de correctie strekt tot verhoging
      van de vergoeding respectievelijk aanvullende vergoeding, binnen acht weken na de mededeling, bedoeld in
      [artikel 21, eerste lid][ref2], door Onze Minister betaald.


