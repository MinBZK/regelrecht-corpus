  - number: '37'
    text: |-
      1 Binnen 2 weken na een teldatum zendt het bevoegd gezag van een school aan Onze Minister, de inspecteur,
      gedeputeerde staten en, indien het een bijzondere school betreft, eveneens aan burgemeester en wethouders, een
      opgave van het aantal leerlingen overeenkomstig het bepaalde in [artikel 36][ref1]. De opgave, bedoeld in de eerste
      volzin, dient onderverdeeld te zijn in leerlingen, bedoeld in de begripsomschrijving van leerlingen met een niet-
      Nederlandse culturele achtergrond in [artikel 12 van het Formatiebesluit W.V.O.][ref2] en overige leerlingen.

      2 Indien op 16 januari de formatie opnieuw wordt berekend op grond van
      [artikel 19 van het Formatiebesluit W.V.O.][ref3], doet het bevoegd gezag binnen 2 weken nadat de formatie opnieuw
      is berekend mededeling van het aantal leerlingen waarop de opnieuw berekende formatie is gebaseerd, aan Onze
      Minister, de inspecteur, en indien het een bijzondere school betreft, eveneens aan burgemeester en wethouders.

      3 Indien de datum, genoemd in het tweede lid, valt op een dag waarop geen onderwijs wordt gegeven, worden op de
      eerstvolgende schooldag de leerlingen geteld die op die datum stonden ingeschreven.

      4 Bij ministeriële regeling wordt vastgesteld op welke wijze de opgave, bedoeld in het eerste lid, wordt gedaan.

      5 Indien als gevolg van de wijzigingen op grond van [artikel 34][ref4] een wijziging optreedt in de in het eerste
      lid bedoelde opgave, doet het bevoegd gezag van de school waarvan de leerling is respectievelijk leerlingen zijn
      uitgeschreven, binnen 6 weken na de teldatum daarvan mededeling aan Onze Minister, de inspecteur, gedeputeerde
      staten en, indien het een bijzondere school betreft, eveneens aan burgemeester en wethouders.


      [ref1]: https://wetten.overheid.nl/BWBR0005672#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0005446#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0005446#Artikel19
      [ref4]: https://wetten.overheid.nl/BWBR0005672#Artikel34
