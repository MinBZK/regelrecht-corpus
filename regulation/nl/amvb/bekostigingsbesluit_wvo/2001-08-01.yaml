  - number: '65'
    text: |-
      1 Het bevoegd gezag verstrekt jaarlijks voor 1 juli aan Onze Minister ten behoeve van de afrekening van de
      vergoeding voor uitgaven voor het personeel, bedoeld in [artikel 246, eerste lid][ref1], van de wet:

      a. over het voorafgaande jaar de gegevens betreffende het personeel dat is aangesteld ten laste van het
      formatiebudget;

      b. een verklaring van het bevoegd gezag omtrent de juistheid alsmede de tijdige aanmelding van de gegevens waarop
      de voorschotbedragen en de vergoedingsbedragen zijn of worden gebaseerd;

      c. een verklaring van een accountant van de juistheid van de gegevens, bedoeld in onderdeel *b*;

      d. het in het derde lid bedoelde overzicht vergezeld van een opgave van eventuele mutaties in de gegevens.

      2 Bij ministeriële regeling worden jaarlijks voor 1 januari ten behoeve van de afrekening, bedoeld in dit artikel,
      vastgesteld:

      a. de leidraad ten behoeve van de controle door de accountant;

      b. de formulieren betreffende de verklaringen bedoeld in het eerste lid onderdelen *b* en *c*;

      c. het formulier voor de verstrekking van de gegevens bedoeld in het eerste lid onderdeel *a*.

      3 Ten behoeve van de afrekening van de vergoeding verstrekt Onze Minister jaarlijks voor 1 februari overzichten per
      school betreffende formatierekeneenheden en verstrekte voorschotten.

      4 Onze Minister besluit binnen twee jaren na 1 juli van het jaar waarin de gegevens bedoeld in het eerste lid zijn
      ingediend, op de afrekening van de vergoeding.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel246
    url: https://wetten.overheid.nl/BWBR0005672/2001-08-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '246'
  - number: '66'
    text: |-
      1 Indien het verzoek, bedoeld in [artikel 233, vierde lid, van de wet][ref1], van het bevoegd gezag is ingewilligd,
      verstrekt dit bevoegd gezag een raming van de te verwachten uitgaven.

      2 Indien het bevoegd gezag verzoekt om een voorschot, zijn de[ artikelen 56 tot en met 63][ref2] van
      overeenkomstige toepassing. Voor de vaststelling van de vergoeding zijn de[ artikelen 62 tot en met 65][ref3] van
      overeenkomstige toepassing.

      3 In afwijking van het bepaalde in het tweede lid kan Onze Minister bepalen, dat wordt afgeweken van een
      maandelijkse bevoorschotting.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel233
      [ref2]: https://wetten.overheid.nl/BWBR0005672#Artikel56
      [ref3]: https://wetten.overheid.nl/BWBR0005672#Artikel62
