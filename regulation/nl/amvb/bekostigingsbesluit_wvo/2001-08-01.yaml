    text: |-
      1 Het normatief bepaalde aantal te huisvesten groepen leerlingen, bedoeld in
      [artikel 243, vijfde lid, onder a, en zesde lid, onder a][ref1], van de wet, wordt voor het jaar waarvoor
      de vergoeding voor de materiële voorzieningen ten behoeve van de instandhouding strekt, berekend door
      het aantal leerlingen van de desbetreffende school op 1 oktober van het voorafgaande jaar, dan wel indien
      [artikel 243, zevende lid][ref2], van de wet van toepassing is, het aantal leerlingen van de desbetreffende
      school op 16 januari van dat jaar, te delen door de voor het desbetreffende onderwijs geldende factor N van de
      onderstaande tabel.





                Factor N




      a.

                  moeilijk lerende kinderen

                    14




      b.

                  kinderen met leer- en opvoedingsmoeilijkheden

                    14




      2 Het normatief bepaalde aantal te huisvesten groepen leerlingen, bedoeld in het eerste lid, wordt naar boven
      afgerond op een geheel getal.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel243
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel243
