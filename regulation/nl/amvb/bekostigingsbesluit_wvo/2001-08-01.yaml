  - number: '30'
    text: |-
      1 Teneinde overeenkomstig de bepalingen van dit besluit enige bekostiging van het Rijk te verkrijgen, moet het
      bevoegd gezag van een bijzondere school zijn aangesloten bij een organisatie van bevoegde gezagsorganen die
      rechtspersoon met volledige rechtsbevoegdheid is en als zodanig door Onze Minister is erkend en zich te zijnen
      genoegen heeft borg gesteld voor terugbetaling van teveel ontvangen bedragen.

      2 De erkenning, bedoeld in het eerste lid, geschiedt op een daartoe door het bestuur der organisatie tot Onze
      Minister gericht verzoek waarbij moet worden overgelegd een opgave van elk bevoegd gezag waarvoor zekerheid wordt
      gesteld, vermeldende ten aanzien van elke school, de gemeente en nadere plaatsaanduiding in de gemeente waar de
      school is gevestigd, alsmede naam van de rechtspersoon onder wiens bestuur de school staat. Wijzigingen die daarin
      worden aangebracht, deelt het bestuur der organisatie binnen twee weken mede aan Onze Minister. Deze wijzigingen
      ontheffen de organisaties niet van de voor het lopende jaar aangegane borgstelling ten behoeve van een aangesloten
      bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0005672/2001-08-01#Artikel30
  - number: '31'
    text: |-
      Het bevoegd gezag geeft binnen twee weken na een beslissing tot opheffing van de school kennis daarvan aan
      Onze Minister, gedeputeerde staten, de inspecteur en, indien het een bijzondere school betreft, eveneens aan
      burgemeester en wethouders van de gemeente waarin de school is gelegen.
    url: https://wetten.overheid.nl/BWBR0005672/2001-08-01#Artikel31
  - number: '32'
    text: |-
      1 De directeur van een school draagt er zorg voor dat een overzichtelijke administratie van de gegevens van de
      leerlingen met inbegrip van het gemeenschappelijk rapport, bedoeld in [artikel 161, zevende lid][ref1], van de
      wet, en van hun ouders, alsmede van de inschrijving, de uitschrijving en het verzuim van de leerlingen op de school
      aanwezig is.

      2 Bij ministeriële regeling kunnen voorschriften worden gegeven omtrent de wijze waarop de leerlingenadministratie
      wordt ingericht.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel161
    url: https://wetten.overheid.nl/BWBR0005672/2001-08-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '161'
  - number: '33'
    text: |-
      1 Onverminderd het bepaalde bij of krachtens de [Les- en cursusgeldwet][ref1] schrijft de directeur van een school
      een leerling slechts in na overlegging van

      a. een bewijs van uitschrijving van de leerling van een andere school of een school voor ander onderwijs, welk
      bewijs op het moment van inschrijving niet ouder is dan 6 maanden,

      b. een schriftelijke verklaring van de ouders of de leerling die meerderjarig en handelingsbekwaam is, dat de
      leerling binnen een periode van 6 maanden voorafgaand aan de inschrijving niet eerder op een andere school, een
      school voor ander onderwijs of een instelling als bedoeld in [artikel 1, onderdeel ][ref2] was ingeschreven, of

      c. een schriftelijke verklaring van de ouders of de leerling die meerderjarig en handelingsbekwaam is, dat de
      leerling voorafgaand aan de inschrijving op een instelling als bedoeld in [artikel 1, onderdeel ][ref3] was
      ingeschreven en dat deze leerling daar is uitgeschreven.

      2 Het bewijs van uitschrijving dan wel de verklaring, bedoeld in het eerste lid, onderdeel *b* of *c*, wordt
      bewaard in de administratie van de school.

      3 De directeur doet in het geval, bedoeld in het eerste lid, onderdeel a, dan wel in het geval, bedoeld in het
      eerste lid, onderdeel *b*, indien hem bekend is op welke andere school, school voor ander onderwijs of instelling
      als bedoeld in [artikel 1, onderdeel ][ref4] de leerling was ingeschreven buiten de in het eerste lid, onderdeel
      *b*, bedoelde periode, dan wel in het geval, bedoeld in het eerste lid, onderdeel *c*, indien hem bekend is op
      welke instelling als bedoeld in [artikel 1, onderdeel ][ref5] de leerling was ingeschreven, onder vermelding
      van de datum van inschrijving op zijn school, binnen 1 week schriftelijk mededeling van de inschrijving aan de
      directeur, rector of centrale directie van de school, de school voor ander onderwijs of de instelling, bedoeld in
      [artikel 1, onderdeel ][ref6] waarop de leerling voordien was ingeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0004188
      [ref2]: https://wetten.overheid.nl/BWBR0002628#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0002628#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0002628#Artikel1
      [ref5]: https://wetten.overheid.nl/BWBR0002628#Artikel1
      [ref6]: https://wetten.overheid.nl/BWBR0002628#Artikel1
