        artikel: '240'
      - id: ref2
        bwb_id: BWBR0005446
        artikel: '20'
  - number: '68'
    text: |-
      1 Het Rijk verstrekt in de maanden januari en augustus van het uitkeringsjaar in verband met de kosten voor
      nascholing van het personeel aan het bevoegd gezag van een school onderscheidenlijk 7/12 gedeelte en 5/12 gedeelte
      van de vergoeding, bedoeld in [artikel 240][ref1] van de wet, waarop het bevoegd gezag over dat jaar recht heeft.

      2 Indien het eerste lid voor het eerst toepassing vindt op een school als bedoeld in [artikel 67][ref2] omvat het
      bedrag, bedoeld in het eerste lid, tevens de vergoeding voor het tijdvak vanaf de datum waarop de aanspraak op de
      vergoeding is ontstaan, tot de eerste dag van de maand waarin de verstrekking plaats vindt.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel240
      [ref2]: https://wetten.overheid.nl/BWBR0005672#Artikel67
    url: https://wetten.overheid.nl/BWBR0005672/2001-08-01#Artikel68
    references:
