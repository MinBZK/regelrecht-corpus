  - number: '47'
    text: |-
      1 De vergoeding, bedoeld in [artikel 46][ref1], bedraagt 5 procent van de geschatte waarde, onderscheidenlijk
      het in de tweede volzin van het eerste lid van dat artikel bedoelde bedrag waarover de vergoeding dient te worden
      berekend.

      2 Het gemeentebestuur kan, op verzoek van het bevoegd gezag van de bijzondere school, bepalen dat in verband met
      de op het bevoegd gezag rustende geldelijke verplichtingen, gedurende een door hem vast te stellen termijn de
      vergoeding naar een hoger percentage zal worden berekend.


      [ref1]: https://wetten.overheid.nl/BWBR0005672#Artikel46
