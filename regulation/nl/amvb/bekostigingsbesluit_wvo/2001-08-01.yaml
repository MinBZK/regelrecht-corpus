        artikel: '56'
        hoofdstuk: IV
  - number: '62'
    text: |-
      De vergoeding, bedoeld in [artikel 246, eerste lid][ref1], van de wet, wordt aan de hand van de totale omvang van
      de formatie, bedoeld in [artikel 233][ref2] van de wet, voor de school afzonderlijk vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel246
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel233
    url: https://wetten.overheid.nl/BWBR0005672/2001-08-01#Artikel62
