  - number: '28'
    text: |-
      In deel II van dit besluit wordt verstaan onder:

      Onze Minister: Onze Minister van Onderwijs, Cultuur en Wetenschappen;

      wet: deel II van de [Wet op het voortgezet onderwijs][ref1];

      school: een school voor voortgezet speciaal onderwijs als bedoeld in
      [artikel 125 van de Wet op het voortgezet onderwijs][ref2], tenzij het tegendeel blijkt;

      openbare school: door een of meer gemeenten, al dan niet te zamen met een of meer privaatrechtelijke rechtspersonen
      met volledige rechtsbevoegdheid, in stand gehouden school;

      bijzondere school: door een privaatrechtelijke rechtspersoon in stand gehouden school;

      bevoegd gezag van volgens de wet bekostigde scholen: voor wat betreft:

      a. een openbare school: het college van burgemeester en wethouders voor zover de raad niet anders bepaalt, en,
      indien de raad dit wenselijk oordeelt, met inachtneming van door hem te stellen regelen, dan wel het krachtens een
      gemeenschappelijke regeling bevoegde orgaan;

      b. een bijzondere school: de rechtspersoon bedoeld in [artikel 175][ref3] van de wet;

      inspecteur: lid van de inspectie voor zover belast met taken op het gebied van het speciaal onderwijs en voortgezet
      speciaal onderwijs, bedoeld in [artikel 128][ref4] van de wet;

      ouders: ouders, voogden of verzorgers;

      teldatum: een van de data, bedoeld in [artikel 234][ref5] van de wet;

      commissie: de commissie, bedoeld in [artikel 161, tweede lid][ref6], van de wet;

      leerling: een leerling die op grond van [artikel 161][ref7] van de wet tot een school is toegelaten;

      schooljaar: het tijdvak van 1 augustus tot en met 31 juli daaraanvolgend;

      ambulante begeleiding: de begeleiding door een aan een school verbonden leraar van een of meer leerlingen in het
      voortgezet onderwijs die zonder deze begeleiding zou onderscheidenlijk zouden zijn aangewezen op het onderwijs dat
      de school verzorgt, alsmede de ondersteuning van een school voor voortgezet onderwijs bij de opvang van zodanige
      leerlingen door een leraar, orthopedagoog, psycholoog of logopedist van de school;

      activiteitenplan: het activiteitenplan, bedoeld in [artikel 141][ref8] van de wet;

      lokaal voor motorische therapie: ruimte van 120 m2 of minder die is bedoeld voor onderwijs in lichamelijke oefening
      aan leerlingen van 6 jaar en ouder;

      formatiebudget: het formatiebudget, bedoeld in [artikel 235, eerste lid][ref9], van de wet;

      accountant: een accountant als bedoeld in [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref10].


