        artikel: '161'
  - number: '36'
    text: |-
      1 Voor de toepassing van het bepaalde in de wet worden, onverminderd het bepaalde in [artikel 34][ref1], en
      [artikel 37, zesde lid][ref2], de leerlingen op een school meegeteld die op een teldatum op die school staan
      ingeschreven, tenzij zij vanaf het begin van het schooljaar tot de teldatum meer dan de helft van het aantal
      schooldagen zonder geldige reden hebben verzuimd.

      2 Voor de toepassing van het eerste lid wordt ten aanzien van de leerplichtige leerling als geldige reden
      aangemerkt een vrijstelling van geregeld schoolbezoek als bedoeld in de [Leerplichtwet 1969][ref3] (*Stb.* 1971,
      406). Ten aanzien van de niet-leerplichtige leerling worden als geldige reden aangemerkt dezelfde gronden als die
      welke leiden tot een vrijstelling als bedoeld in de vorige volzin.

      3 Indien een teldatum valt op een dag waarop geen onderwijs wordt gegeven, worden op de eerstvolgende schooldag de
      leerlingen geteld, die op de teldatum stonden ingeschreven.

      4 Een leerling kan slechts op 1 school voor de bekostiging meetellen, behoudens het bepaalde in
      [artikel 47 van het Inrichtingsbesluit W.V.O.][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0005672#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0005672#Artikel37
      [ref3]: https://wetten.overheid.nl/BWBR0002628
      [ref4]: https://wetten.overheid.nl/BWBR0005946#Artikel47
