        artikel: 85b
  - number: '19'
    text: |-
      1 De accountant die door Onze Minister is belast met het onderzoek van de jaarrekening en met het onderzoek van de
      juistheid van de gegevens, bedoeld in [artikel 14, zesde en achtste lid][ref1], heeft met het oog op het verrichten
      van dat onderzoek toegang tot elke school. Aan de accountant wordt desgevraagd inzage in de boeken en bescheiden
      gegeven en worden alle inlichtingen verstrekt die deze voor de uitvoering van zijn taak nodig oordeelt.

      2 Onze Minister kan naast het accountantsonderzoek, bedoeld in het eerste lid, een onderzoek instellen of doen
      instellen naar de jaarrekening en naar de gegevens, bedoeld in [artikel 14, zesde en achtste lid][ref2], naar
      de rechtmatigheid van de bestedingen en naar de doelmatigheid van het beheer van de school. Het bevoegd gezag
      verstrekt aan degene die door Onze Minister met het onderzoek is belast, alle inlichtingen die deze voor de
      uitvoering van zijn taak nodig oordeelt en geeft desgevraagd inzage in de boeken en bescheiden.


      [ref1]: https://wetten.overheid.nl/BWBR0005672#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0005672#Artikel14
