  - number: '5'
    text: |-
      1 De directeur, rector of centrale directie van een school waarop de leerling staat ingeschreven, schrijft de
      leerling, indien deze de school verlaat, uit met ingang van de dag volgende op de dag waarop de leerling de school
      voor het laatst heeft bezocht en verstrekt de leerling een bewijs van uitschrijving.

      2 Indien de directeur, rector of centrale directie van een school waarop de leerling stond ingeschreven, binnen
      vier weken na de dag waarop de leerling de school voor het laatst heeft bezocht een mededeling ontvangt van de
      directeur, rector of centrale directie van een school of een school voor ander onderwijs, van de inschrijving
      van de leerling op laatstbedoelde scholen, wijzigt de directeur, rector of centrale directie de datum van
      uitschrijving, bedoeld in het eerste lid, alsnog in de datum van de dag voorafgaande aan de dag van inschrijving op
      de andere school of de school voor ander onderwijs.
    url: https://wetten.overheid.nl/BWBR0005672/2001-08-01#Artikel5
  - number: '6'
    text: |-
      De gegevens die in de leerlingenadministratie zijn opgenomen, blijven daarvan in ieder geval deel uitmaken
      gedurende 5 jaar nadat de desbetreffende leerling van de school is uitgeschreven.
    url: https://wetten.overheid.nl/BWBR0005672/2001-08-01#Artikel6
  - number: '7'
    text: |-
      1 Voor de toepassing van het bepaalde bij en krachtens de wet worden, onverminderd [artikel 5][ref1] en
      [artikel 14, vierde lid][ref2], de leerlingen op een school meegeteld die op de teldatum op die school als
      werkelijk schoolgaand staan ingeschreven, tenzij zij vanaf het begin van het schooljaar tot de teldatum meer dan de
      helft van het aantal schooldagen zonder geldige reden hebben verzuimd.

      2 Voor de toepassing van het eerste lid wordt ten aanzien van de leerplichtige leerling als geldige reden
      aangemerkt een vrijstelling van geregeld schoolbezoek als bedoeld in de [Leerplichtwet 1969][ref3]. Ten aanzien van
      de niet-leerplichtige leerling worden als geldige reden aangemerkt dezelfde gronden als die welke leiden tot een
      vrijstelling van geregeld schoolbezoek als bedoeld in de vorige volzin.

      3 Indien de teldatum valt op een dag waarop geen onderwijs wordt gegeven, worden op de eerstvolgende schooldag de
      leerlingen geteld, die op de teldatum als werkelijk schoolgaand stonden ingeschreven.

      4 Een leerling niet zijnde een cursist, kan slechts op één school voor de bekostiging meetellen.


      [ref1]: https://wetten.overheid.nl/BWBR0005672#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005672#Artikel14
