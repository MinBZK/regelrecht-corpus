      - id: ref2
        bwb_id: BWBR0002399
        artikel: '125'
  - number: '58'
    text: |-
      1 Het bevoegd gezag van een school als bedoeld in [artikel 57 onderdeel ][ref1], verstrekt bij benoeming
      van een personeelslid ten behoeve van de vaststelling van het voorschot op de vergoeding, bedoeld in
      [artikel 246, eerste lid onderdeel ][ref2], van de wet, de gegevens die nodig zijn voor het bepalen van het
      voorschot.

      2 Ingeval in de gegevens, bedoeld in het eerste lid, wijziging optreden, doet een bevoegd gezag binnen vier weken
      mededeling daarvan aan het systeem waaraan het deelneemt.


      [ref1]: https://wetten.overheid.nl/BWBR0005672#Artikel57
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel246
