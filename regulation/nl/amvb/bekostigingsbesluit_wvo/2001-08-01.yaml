  - number: '10'
    text: |-
      Het Rijk vergoedt de exploitatiekosten met ingang van de eerste schooldag van een school waarvan het bekostigd
      onderwijs op grond van [afdeling I van titel III van de wet](onbekend) een aanvang neemt. Onze Minister kan op
      verzoek van het bevoegd gezag een door hem te bepalen deel van de exploitatiekosten gedurende een periode van ten
      hoogste vier maanden voor de eerste schooldag voor vergoeding in aanmerking brengen.
    url: https://wetten.overheid.nl/BWBR0005672/2001-08-01#Artikel10
  - number: '11'
    text: |-
      1 Indien gebouwen ten gevolge van brand of een andere omstandigheid zodanige schade hebben opgelopen dat deze
      geheel of gedeeltelijk moeten worden vervangen, is met betrekking tot de uitkering ingevolge een terzake gesloten
      verzekeringsovereenkomst [artikel 99, tweede lid][ref1], van de wet van overeenkomstige toepassing.

      2 Indien een uitkering als bedoeld in het eerste lid is verstrekt, voorziet het bevoegd gezag op doelmatige wijze
      in de huisvesting of inventaris met inachtneming van de omstandigheden waarin de school verkeert.

      3 Indien het uitgekeerde bedrag ingevolge de verzekeringsovereenkomst minder bedraagt dat het bedrag aan schade,
      dient de rechtspersoon die de school in stand houdt, de schade voor eigen rekening te herstellen dan wel voor eigen
      rekening te voorzien in een nieuwe voorziening in de huisvesting, voor zover dat noodzakelijk is ter uitvoering van
      het tweede lid.

      4 De voorzieningen, gerealiseerd met toepassing van dit artikel, worden aangemerkt als met rijksmiddelen te zijn
      gerealiseerd.

      5 Het eerste tot en met vierde lid zijn slechts van toepassing op andere vormen van voortgezet onderwijs als
      bedoeld in [afdeling IV van titel II van de wet](onbekend).


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel99
    url: https://wetten.overheid.nl/BWBR0005672/2001-08-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '99'
  - number: '12'
    text: |-
      Het Rijk vergoedt de uitgaven voor nascholing van het personeel, bedoeld in [artikel 96d.2][ref1] van de wet, met
      ingang van de eerste schooldag van een school waarvan het bekostigd onderwijs op grond van [afdeling I van titel
      III van de wet](onbekend) een aanvang neemt.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel96d.2
    url: https://wetten.overheid.nl/BWBR0005672/2001-08-01#Artikel12
