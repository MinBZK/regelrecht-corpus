    text: |-
      De uitgaven voor de materiële voorzieningen ten behoeve van de instandhouding voor schoolgebouwen hebben betrekking
      op de programma’s van eisen, bedoeld in [artikel 229, eerste lid][ref1], van de wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel229
