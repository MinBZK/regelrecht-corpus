  - number: '20'
    text: |-
      1 Het bevoegd gezag van een school verstrekt Onze Minister jaarlijks in de jaarrekening in verband met de
      terugstorting van niet bestede gelden voor nascholing, bedoeld in [artikel 99, vierde lid][ref1], van de wet:

      a. een opgave van de in de laatste drie jaren ontvangen vergoedingen voor nascholing,

      b. een opgave van het bedrag dat het fonds, bedoeld in [artikel 99, vierde lid][ref2], van de wet, omvat,

      c. indien het bedrag, bedoeld in onderdeel b, groter is dan het bedrag, bedoeld in onderdeel a, een opgave van het
      verschil, en

      d. een verklaring van het bevoegd gezag omtrent de juistheid en volledigheid van de opgaven, bedoeld in de
      onderdelen a, b en c.

      2 Indien aan het bevoegd gezag van een school een aanvullende vergoeding is verstrekt onder de voorwaarde dat deze
      vergoeding voor het bij de verstrekking aangegeven doel wordt besteed, blijkt uit de jaarrekening van de school in
      hoeverre deze vergoeding voor dat doel is besteed.

      3 Indien bij de verstrekking van een aanvullende vergoeding is bepaald dat verrekening met een bij de toekenning
      aangegeven vergoeding zal plaatsvinden van het positieve verschil tussen het toegekende en het daadwerkelijk
      bestede bedrag, maakt het bevoegd gezag in de desbetreffende jaarrekening melding van het daadwerkelijk bestede
      bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel99
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel99
