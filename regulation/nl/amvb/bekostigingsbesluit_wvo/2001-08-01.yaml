  - number: '51'
    text: |-
      1 Voor de gebouwen en terreinen waarvoor voor 1 januari 1989 vergoeding werd genoten op grond van artikel 184
      van het Besluit buitengewoon onderwijs 1967, betaalt de gemeente jaarlijks aan het bevoegd gezag een vergoeding
      gelijk aan het bedrag dat voor huur van de gebouwen en terreinen, met inbegrip van de inrichting, het meubilair
      en het onderwijsleerpakket, redelijk is te achten, verminderd met de kosten van instandhouding van het gebouw. De
      vergoeding bedraagt niet meer dan het bedrag dat een redelijke vergoeding oplevert voor een overeenkomstige school,
      bestemd voor hetzelfde aantal leerlingen, die in normale omstandigheden verkeert. De vergoeding wordt in overleg
      tussen burgemeester en wethouders en het bevoegd gezag vastgesteld. Indien voor gebouw en terrein, met inbegrip van
      de inrichting, het meubilair en het onderwijsleerpakket, een vergoeding uit de openbare kassen is of wordt genoten,
      wordt de vergoeding dienovereenkomstig verminderd.

      2 Aan het bevoegd gezag van een school waarvoor de in het eerste lid bedoelde vergoeding wordt betaald, verstrekt
      het Rijk jaarlijks een bedrag ter bestrijding van de kosten van de school waarvoor de in het eerste lid bedoelde
      vergoeding niet is bestemd. De titels I tot en met III van dit hoofdstuk zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0005672/2001-08-01#Artikel51
  - number: '52'
    text: |-
      1 Indien het bevoegd gezag, bedoeld in [artikel 51][ref1], eigenaar is van het gebouw en terrein, en het gebouw
      en terrein niet meer voor het voortgezet speciaal onderwijs als bedoeld in [artikel 125 van de wet][ref2]
      worden gebruikt, dan wel het gebouw en terrein na 1 september 1987 zijn of worden vervreemd, betaalt het
      bevoegd gezag voor elk jaar dat de gemeente met betrekking tot het gebouw en terrein een vergoeding heeft
      verstrekt, doch voor ten hoogste 40 jaren, aan de gemeente 1/40 deel van de waarde van het gebouw en
      terrein in het economisch verkeer, met dien verstande dat de gemeenteraad kan besluiten in verband met eigen
      investeringen van het bevoegd gezag een lagere waarde vast te stellen. Indien toepassing is gegeven aan
      [artikel VI, vierde lid, van de wet van 2 april 1998, Stb. 228][ref3], wordt de gemeente geacht gedurende 40 jaren
      een vergoeding met betrekking tot het gebouw en terrein te hebben verstrekt.

      2 In afwijking van het bepaalde in het eerste lid kan het bevoegd gezag de eigendom van het gebouw overdragen aan
      de gemeente.


      [ref1]: https://wetten.overheid.nl/BWBR0005672#Artikel51
