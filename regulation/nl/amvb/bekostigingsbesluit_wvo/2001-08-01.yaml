  - number: '9'
    text: |-
      1 Onze Minister stelt het bedrag, bedoeld in [artikel 96d, tweede lid][ref1], van de wet, vast.

      2 Het bedrag wordt in een keer betaald dan wel wordt betaald volgens een door Onze Minister te bepalen kasritme.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel96d
