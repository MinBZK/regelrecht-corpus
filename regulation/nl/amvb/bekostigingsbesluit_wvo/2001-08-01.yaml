preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Onderwijs en Wetenschappen, mede namens Onze Minister van Landbouw,
    Natuurbeheer en Visserij, van 29 juni 1990, nr. 90010741/3181A, centrale directie Wetgeving en Juridische Zaken;

    Gelet op de artikelen 80, zesde lid, 84a, tweede lid, 96b, tweede lid, 96c, eerste en tweede lid, 96p, derde
    lid, 96r, eerste lid, 98, eerste lid, 106, eerste en tweede lid, en 110a, derde lid, van de Wet op het voortgezet
    onderwijs (Stb. 1986, 552);

    Gehoord de Onderwijsraad (advies van 19 oktober 1989, nr. OR/719 Alg.);

    De Raad van State gehoord (advies van 6 november 1990, nr. W05.90.0288);

    Gezien het nader rapport van de Staatssecretaris van Onderwijs en Wetenschappen, mede namens Onze Minister van
    Landbouw, Natuurbeheer en Visserij, van 22 september 1992, nr. 92028386/3181A, directie Wetgeving en Juridische
    Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0005672/2001-08-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deel I van dit besluit wordt verstaan onder:

      a. wet: [deel I van de Wet op het voortgezet onderwijs][ref1];

      b. Onze Minister: Onze Minister van Onderwijs, Cultuur en Wetenschappen en, voor zover het betreft het
      landbouwonderwijs, Onze Minister van Landbouw, Natuurbeheer en Visserij;

      c. inspectie: de inspectie, bedoeld in [artikel 113][ref2] of [artikel 114][ref3] van de wet;

      d. school: een school voor voorbereidend wetenschappelijk onderwijs, voor hoger algemeen voortgezet onderwijs, voor
      middelbaar algemeen voortgezet onderwijs, voor voorbereidend beroepsonderwijs, of een scholengemeenschap voor zover
      het betreft een of meer van deze scholen, tenzij het tegendeel blijkt;

      e. inrichting voor voortgezet onderwijs: een inrichting als bedoeld in [artikel 5, onderdeel e][ref4], van de wet;

      f. openbare school:

      1°. een school in stand gehouden door een gemeente, dan wel door een openbaar lichaam, ingesteld bij een
      gemeenschappelijke regeling als bedoeld in de [Wet gemeenschappelijke regelingen][ref5] waarin deelnemen
      een of meer gemeenten, al dan niet te zamen met een of meer privaatrechtelijke rechtspersonen met volledige
      rechtsbevoegdheid;

      2°. een door een openbare rechtspersoon als bedoeld in [artikel 42a][ref6] van de wet in stand gehouden school;

      3°. een door een stichting als bedoeld in [artikel 42b][ref7] van de wet in stand gehouden school;

      g. bijzondere school: een door een privaatrechtelijke rechtspersoon in stand gehouden school;

      h. openbare rechtspersoon: een rechtspersoon die krachtens publiekrecht is ingesteld als bedoeld in
      [artikel 42a][ref8] van de wet;

      i. bevoegd gezag: voor wat betreft:

      1°. een openbare school:

      a. het college van burgemeester en wethouders, voor zover de raad niet anders bepaalt, en, indien de raad dit
      besluit, met inachtneming van door hem te stellen regelen;

      b. het krachtens de desbetreffende gemeenschappelijke regeling bevoegde orgaan;

      c. de openbare rechtspersoon, bedoeld in [artikel 42a][ref9] van de wet, dan wel

      d. de stichting, bedoeld in [artikel 42b][ref10] van de wet;

      2°. een bijzondere school: het schoolbestuur;

      j. ouders: ouders, voogden of verzorgers;

      k. teldatum: de datum van 1 oktober, bedoeld in [artikel 8, tweede lid][ref11];

      l. leerling: een leerling of cursist die op grond van [artikel 27][ref12] van de wet tot een school is toegelaten;

      m. eerste schooldag: a. bij opening van de school aan het begin van het schooljaar: 1 augustus; b. bij opening van
      de school tijdens het schooljaar: de dag waarop het onderwijs aan de school is aangevangen;

      n. leerlingenadministratie: leerlingen- of cursistenadministratie;

      o. schooljaar: het tijdvak van 1 augustus tot en met 31 juli daaraanvolgend;

      p. aanvullende vergoeding: een aanvullende vergoeding als bedoeld in [artikel 85a][ref13] of [artikel 89][ref14]
      van de wet;

      q. accountant: een accountant als bedoeld in [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref15].


