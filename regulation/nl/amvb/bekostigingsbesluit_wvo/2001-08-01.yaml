  - number: '55'
    text: |-
      1 Onze Minister verstrekt jaarlijks in de maand maart aan het bevoegd gezag van een school ten behoeve van
      de berekening van een voorschot op de vergoeding, bedoeld in [artikel 246, eerste lid][ref1], van de wet, een
      overzicht van de voor die school beschikbare formatierekeneenheden met ingang van het schooljaar volgend op de
      maand waarin het overzicht is verstrekt. Het overzicht is gebaseerd op het door het bevoegd gezag van die school
      opgegeven aantal leerlingen op de teldatum.

      2 Onze Minister verstrekt jaarlijks voor 1 juli aan het bevoegd gezag van een school een overzicht van
      beschikbare formatierekeneenheden, waarin de beslissingen van het bevoegd gezag met betrekking tot overdracht van
      formatierekeneenheden en verzilvering van niet-verbruikte formatierekeneenheden, voor zover die voor 15 mei daaraan
      voorafgaand aan Onze Minister zijn gemeld, zijn verwerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel246
    url: https://wetten.overheid.nl/BWBR0005672/2001-08-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '246'
  - number: '56'
    text: |-
      Het Rijk verstrekt elke maand van het uitkeringsjaar in verband met de uitgaven voor het personeel aan het bevoegd
      gezag van een school een voorschot op de vergoeding, bedoeld in [artikel 246, eerste lid][ref1], van de wet,
      waarvan de hoogte afhankelijk is van de te verwachten vergoeding voor die maand.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel246
    url: https://wetten.overheid.nl/BWBR0005672/2001-08-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '246'
  - number: '57'
    text: |-
      Voor de wijze van uitkering van de voorschotten op de vergoeding voor de uitgaven voor het personeel, bedoeld in
      [artikel 246, eerste lid][ref1], van de wet, wordt onderscheid gemaakt in:

      a. een bevoegd gezag van een school dat deelneemt aan een bij ministeriële regeling toegestaan systeem van
      automatisering van de salarisadministratie inzake het voortgezet speciaal onderwijs, bedoeld in [artikel 125][ref2]
      van de wet;

      b. een bevoegd gezag van een school dat niet deelneemt aan een systeem als bedoeld in onderdeel *a*.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel246
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel125
    url: https://wetten.overheid.nl/BWBR0005672/2001-08-01#Artikel57
