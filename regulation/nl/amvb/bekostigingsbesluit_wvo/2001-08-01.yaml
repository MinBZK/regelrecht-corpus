  - number: '54'
    text: |-
      1 De aanspraak op vergoeding voor de uitgaven voor het personeel, bestaande uit:

      a. de uitgaven voor het personeel dat is aangesteld ten laste van het formatiebudget,

      b. de geldswaarde van niet verbruikte formatierekeneenheden, en

      c. de vergoedingen voor de kosten van vervanging van personeel en voor de kosten van werkloosheidsuitkeringen of
      herplaatsingswachtgelden, bedoeld in [artikel 246, eerste lid][ref1], van de wet, met uitzondering van de uitgaven
      voor het personeel, bedoeld in [artikel 71, tweede lid][ref2], ontstaat met ingang van de eerste kalenderdag van
      het schooljaar waarin de bekostiging van een nieuw geopende school begint.

      2 Indien het bevoegd gezag voor de opening van een nieuwe school op grond van
      [artikel 20 van het Formatiebesluit W.V.O.][ref3] aan die school een directeur heeft benoemd of aan die school de
      overige leden van de commissie, een administratief medewerker of een psychologisch assistent heeft verbonden en
      Onze Minister op grond van dat artikel niet anders heeft besloten, ontstaat, in afwijking van het eerste lid, de
      aanspraak op vergoeding voor de uitgaven voor die functionarissen ten hoogste acht weken voor de eerste kalenderdag
      van het schooljaar waarin de bekostiging begint van de nieuw geopende school.

      3 De in het tweede lid, eerste volzin, bedoelde aanspraak op vergoeding voor de uitgaven van de daarin genoemde
      functionarissen, met uitzondering van de directeur, wordt gebaseerd op het aantal leerlingen dat op de eerste
      teldatum is ingeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel246
      [ref2]: https://wetten.overheid.nl/BWBR0005672#Artikel71
      [ref3]: https://wetten.overheid.nl/BWBR0005446#Artikel20
