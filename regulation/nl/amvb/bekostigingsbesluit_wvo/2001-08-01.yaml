      - id: ref2
        bwb_id: BWBR0002399
        artikel: 96d.2
  - number: '14'
    text: |-
      1 In aanvulling op de voor de vaststelling van de vergoeding, bedoeld in [artikel 8][ref1] en [artikel 13][ref2],
      noodzakelijke gegevens, bedoeld in het [Besluit informatievoorziening WVO][ref3], doet het bevoegd gezag van een
      school Onze Minister jaarlijks voor 22 november mededeling van de in [artikel 85, vierde lid, tweede volzin][ref4],
      van de wet bedoelde gewogen gemiddelde leeftijd van de personeelscategorie van de leraren van die school op 1
      oktober van dat jaar.

      2 Met het oog op de vaststelling van de vergoeding, bedoeld in [artikel 8][ref5] en [artikel 13][ref6], doet Onze
      Minister aan het bevoegd gezag jaarlijks overzichten toekomen van de hem ter beschikking staande gegevens over het
      aantal leerlingen op de teldatum dat bij de vaststelling van de vergoeding voor het daarop volgende schooljaar in
      aanmerking moet worden genomen. Toezending van de overzichten aan het bevoegd gezag vindt plaats voor 15 november
      volgend op het tijdstip waarop het bevoegd gezag ingevolge het [Besluit informatievoorziening WVO][ref7] de
      gegevens over dat aantal leerlingen aan Onze Minister meldt.

      3 Indien de gegevens, bedoeld in het tweede lid, naar het oordeel van het bevoegd gezag onjuist zijn, kan het
      bevoegd gezag bij Onze Minister binnen 10 dagen na verzending van de in dat lid bedoelde overzichten de door het
      bevoegd gezag gecorrigeerde gegevens indienen.

      4 Indien als gevolg van de wijzigingen op grond van [artikel 5][ref8] een wijziging optreedt in de opgave van
      het aantal leerlingen, bedoeld in het tweede lid, doet het bevoegd gezag van de school waarvan de leerling is of
      waarvan leerlingen zijn uitgeschreven, binnen zes weken na de uitschrijving daarvan mededeling aan Onze Minister.

      5 Bij ministeriële regeling worden voorschriften gegeven voor de toepassing van het eerste tot en met derde lid.
      Bij deze regeling wordt in elk geval een model vastgesteld voor correctie als bedoeld in het derde lid.

      6 Het bevoegd gezag dient jaarlijks voor 1 juli bij Onze Minister voor het daaropvolgende schooljaar in:

      a. een verklaring van het bevoegd gezag omtrent de juistheid van de in het eerste en tweede lid bedoelde aan Onze
      Minister gemelde gegevens,

      b. indien de onder a bedoelde aan Onze Minister gemelde gegevens naar het oordeel van het bevoegd gezag onjuist
      zijn, de door het bevoegd gezag gecorrigeerde gegevens, alsmede

      c. een verklaring van een accountant omtrent de juistheid van de gegevens, bedoeld in onderdeel a of onderdeel b.

      7 Bij ministeriële regeling kan een model voor de in het zesde lid, onder a en c, bedoelde verklaringen worden
      vastgesteld. Onze Minister kan een leidraad vaststellen ten behoeve van de controle door de accountant, bedoeld in
      het zesde lid, onder c.

      8 Indien voor 1 juli in enig jaar aanvullende vergoedingen zijn vastgesteld, dient het bevoegd gezag voor die
      datum bij Onze Minister een verklaring in omtrent de juistheid van de in voorkomende gevallen met het oog op de
      vaststelling van de aanvullende vergoeding aan Onze Minister gemelde gegevens. Het zesde lid, onder b en c, en het
      zevende lid, zijn van overeenkomstige toepassing.


