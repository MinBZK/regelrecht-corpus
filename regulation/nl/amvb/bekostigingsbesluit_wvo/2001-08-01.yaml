        artikel: 96d.2
  - number: '13'
    text: |-
      Onze Minister stelt tegelijk met het bedrag, bedoeld in [artikel 96d, eerste lid][ref1], van de wet, het bedrag
      vast, bedoeld in [artikel 96d.2][ref2] van de wet. Het laatstbedoelde bedrag heeft betrekking op een schooljaar en
      wordt in dat schooljaar betaald volgens een door Onze Minister te bepalen kasritme.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel96d
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel96d.2
