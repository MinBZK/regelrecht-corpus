  - number: '60'
    text: |-
      1 Indien de voor de bekostiging benodigde gegevens niet tijdig aan Onze Minister zijn verstrekt, kan Onze Minister
      bepalen dat de verstrekking van het voorschot op de vergoeding, bedoeld in [artikel 246, eerste lid][ref1], van de
      wet geheel of gedeeltelijk wordt opgeschort.

      2 De verstrekking van het voorschot wordt zo spoedig mogelijk hervat, doch in ieder geval niet later dan in de
      tweede maand volgende op de maand, waarin de benodigde gegevens door het bevoegd gezag zijn verstrekt. Tevens
      wordt het gedeelte van het voorschot dat als gevolg van de toepassing van het eerste lid niet is verstrekt, ter
      beschikking gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel246
    url: https://wetten.overheid.nl/BWBR0005672/2001-08-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '246'
  - number: '61'
    text: |-
      Bij ministeriële regeling worden nadere voorschriften gegeven omtrent de wijze waarop het voorschot, bedoeld in
      [artikel 56][ref1], wordt aangevraagd, vastgesteld en verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0005672#Artikel56
    url: https://wetten.overheid.nl/BWBR0005672/2001-08-01#Artikel61
    references:
      - id: ref1
