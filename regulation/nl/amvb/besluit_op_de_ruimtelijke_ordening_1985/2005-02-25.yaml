  - number: '18'
    text: |-
      1 De aanvraag om vrijstelling als bedoeld in de [artikelen 17][ref1] of [19 van de wet][ref2] gaat vergezeld van
      tenminste een duidelijke situatieschets van het gebied waarop de aanvraag betrekking heeft.

      2 Een aanvraag om een aanlegvergunning die slechts kan worden ingewilligd na verlening van vrijstelling als
      bedoeld in de [artikelen 17][ref3] of [19 van de wet][ref4], wordt mede aangemerkt als een aanvraag om zodanige
      vrijstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0002375#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0002375#Artikel17
      [ref4]: https://wetten.overheid.nl/BWBR0002375#Artikel19
    url: https://wetten.overheid.nl/BWBR0003889/2005-02-25#Artikel18
