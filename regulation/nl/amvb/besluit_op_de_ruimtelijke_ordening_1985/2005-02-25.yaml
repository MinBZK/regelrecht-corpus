  - number: '21'
    text: |-
      Het dagelijks bestuur van het regionaal openbaar lichaam verricht ten behoeve van de toekomstige ruimtelijke
      ontwikkeling van het samenwerkingsgebied onderzoek naar de bestaande toestand in en naar de mogelijke en wenselijke
      ontwikkeling van dat gebied.
    url: https://wetten.overheid.nl/BWBR0003889/2005-02-25#Artikel21
  - number: 21a
    text: |-
      Bij de voorbereiding van een regionaal structuurplan pleegt het dagelijks bestuur overleg met de besturen van
      bij het plan betrokken waterschappen. Waar nodig pleegt het tevens overleg met de besturen van de gemeenten of
      samenwerkingsgebieden wier belangen rechtstreeks in het geding zijn, met die diensten van Rijk en provincie die
      betrokken zijn bij de zorg voor de ruimtelijke ordening alsmede met die diensten van Rijk en provincie die belast
      zijn met de behartiging van belangen die in het plan in geding zijn.
    url: https://wetten.overheid.nl/BWBR0003889/2005-02-25#Artikel21a
  - number: 21b
    text: |-
      1 Een regionaal structuurplan alsmede een ontwerp daarvoor worden vervat in:

      a. een beschrijving van de meest gewenste ontwikkeling in hoofdlijnen van het in het plan begrepen gebied en, voor
      zover nodig, van de fasen waarin die ontwikkeling zich zou moeten of kunnen voltrekken, alsmede van de relatie tot
      het omringende gebied;

      b. een of meer kaarten met bijbehorende verklaring, waarin deze ontwikkeling voor zover mogelijk in beeld is
      gebracht.

      2 Een regionaal structuurplan alsmede een ontwerp daarvoor gaan vergezeld van een toelichting, waarin zijn
      neergelegd:

      a. de aan het plan ten grondslag liggende gedachten en de uitkomsten van het in [artikel 21][ref1] bedoelde
      onderzoek, voor zover dit onderzoek op het plan betrekking heeft;

      b. de uitkomsten van het in [artikel 21a][ref2] bedoelde overleg;

      c. een beschrijving van de wijze waarop rekening is gehouden met de gevolgen van het plan voor de waterhuishouding.

      3 [Artikel 8][ref3] is van toepassing, met dien verstande, dat de schaal bij voorkeur 1 op 25 000 bedraagt.

      4 In een regionaal structuurplan wordt een concrete beleidsbeslissing als zodanig in de tekst of op de kaart
      benoemd en herkenbaar aangegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0003889#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0003889#Artikel21a
      [ref3]: https://wetten.overheid.nl/BWBR0003889#Artikel8
    url: https://wetten.overheid.nl/BWBR0003889/2005-02-25#Artikel21b
