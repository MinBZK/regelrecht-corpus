  - number: '15'
    text: |-
      1 Voor zover de uitvoering van de [Wet geluidhinder][ref1] zulks vereist, geeft het bestemmingsplan voorts aan:

      a. de ligging en de afmetingen van woningen en van gebouwen als bedoeld in
      [artikel 4 van het Besluit grenswaarden binnen zones langs wegen][ref2],
      [artikel 4 van het Besluit grenswaarden binnen zones rond industrieterreinen][ref3] en
      [artikel 2 van het Besluit geluidhinder spoorwegen][ref4], alsmede de ligging van terreinen
      als bedoeld in [artikel 7 van het Besluit grenswaarden binnen zones langs wegen][ref5],
      [artikel 4a van het Besluit grenswaarden binnen zones rond industrieterreinen][ref6] en
      [artikel 2 van het Besluit geluidhinder spoorwegen][ref7];

      b. de functie van de voornaamste wegen, alsmede het dwarsprofiel dan wel het aantal rijstroken daarvan.

      2 Voor zover een bestemmingsplan op grond van [artikel 11 van de wet][ref8] moet worden uitgewerkt dan wel kan
      worden gewijzigd, kan in afwijking van het bepaalde in het eerste lid worden volstaan met het aangeven van de
      voor woningen en gebouwen als bedoeld in het eerste lid ten hoogste toelaatbare geluidsbelasting, welke bij de
      uitwerking dan wel de wijziging van het plan in acht moet worden genomen.


