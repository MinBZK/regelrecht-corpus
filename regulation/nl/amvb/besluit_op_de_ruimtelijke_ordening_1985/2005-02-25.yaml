        artikel: 4a
      - id: ref2
        bwb_id: BWBR0003889
        artikel: '6'
        hoofdstuk: III
  - number: '8'
    text: |-
      De kaarten worden ingericht met inachtneming van de volgende voorschriften:

      a. de kaarten worden getekend op een duidelijke ondergrond;

      b. de begrenzing van het gebied waarop het plan betrekking heeft, wordt met een duidelijke lijn op de kaarten
      aangegeven;

      c. de kaarten worden vervaardigd op een schaal van bij voorkeur 1 op 50 000;

      d. indien het plan wordt vervat in meerdere kaartbladen wordt een overzichtskaart op kleinere schaal daaraan
      toegevoegd;

      e. op de kaarten worden schaal en noordpijl aangegeven.
    url: https://wetten.overheid.nl/BWBR0003889/2005-02-25#Artikel8
  - number: '9'
    text: |-
      1 Burgemeester en wethouders verrichten ten behoeve van de toekomstige ruimtelijke ontwikkeling van het gebied der
      gemeente onderzoek naar de bestaande toestand in en naar de mogelijke en wenselijke ontwikkeling van de gemeente.

      2 Bij de voorbereiding van een ontwerp voor een bestemmingsplan heeft het in het eerste lid bedoelde onderzoek van
      stonde af aan mede betrekking op de uitvoerbaarheid van het plan.
    url: https://wetten.overheid.nl/BWBR0003889/2005-02-25#Artikel9
  - number: '10'
    text: |-
      Bij de voorbereiding van een structuurplan, een bestemmingsplan of een vrijstelling als bedoeld in
      [artikel 19, eerste lid, van de wet][ref1] plegen burgemeester en wethouders overleg met de besturen van bij
      het plan of de vrijstelling betrokken waterschappen. Waar nodig plegen zij tevens overleg met de besturen van de
      gemeenten wier belangen rechtstreeks in het geding zijn, met die diensten van Rijk en provincie die betrokken zijn
      bij de zorg voor de ruimtelijke ordening alsmede met die diensten van Rijk en provincie die belast zijn met de
      behartiging van belangen welke in het plan of de vrijstelling in het geding zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel19
    url: https://wetten.overheid.nl/BWBR0003889/2005-02-25#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002375
        artikel: '19'
  - number: '11'
    text: |-
      1 Een structuurplan alsmede een ontwerp daarvoor worden vervat in:

      a. een beschrijving van de meest gewenste ontwikkeling in hoofdlijnen van het in het plan begrepen gebied en, voor
      zover nodig, van de fasen, waarin die ontwikkeling zich zou moeten of kunnen voltrekken, alsmede van de relatie tot
      het omringende gebied;

      b. een of meer kaarten met bijbehorende verklaring, waarin deze ontwikkeling voorzover mogelijk in beeld is
      gebracht.

      2 Een structuurplan alsmede een ontwerp daarvoor gaan vergezeld van een toelichting, waarin zijn neergelegd:

      a. de aan het plan ten grondslag liggende gedachten en de uitkomsten van het in [artikel 9][ref1] bedoelde
      onderzoek, voor zover dit onderzoek op het plan betrekking heeft;

      b. de uitkomsten van het in [artikel 10][ref2] bedoelde overleg;

      c. een beschrijving van de wijze waarop rekening is gehouden met de gevolgen van het plan voor de waterhuishouding;

      d. een rapportering als bedoeld in [artikel 6a van de wet][ref3] juncto
      [artikel 150, tweede lid, onder c, van de Gemeentewet][ref4].

      3 [Artikel 8][ref5] is van toepassing, met dien verstande, dat de schaal bij voorkeur 1 op 25 000 bedraagt.


