  - number: '16'
    text: |-
      1 De kaarten, bedoeld in [artikel 12][ref1], worden ingericht met inachtneming van de volgende voorschriften:

      a. de kaarten worden getekend op een duidelijke ondergrond;

      b. de begrenzing van het gebied waarop het plan betrekking heeft, wordt met een duidelijke lijn op de kaarten
      aangegeven;

      c. de kaarten worden vervaardigd op een schaal van ten minste 1 op 10 000, tenzij de omvang van het gebied of de
      aard van het plan een andere schaal noodzakelijk maakt;

      d. uit de kaarten moet blijken de aansluiting van het in het plan begrepen gebied aan het daaromheen gelegen
      gebied;

      e. voor zover in het plan gronden zijn begrepen waarvan de bestemming in de naaste toekomst voor verwerkelijking
      in aanmerking komt, worden deze gedeelten vervat in één of meer kaarten op een schaal van ten minste 1 op 2500,
      waarop voorts de kadastrale grenzen, sectie en nummers van de in deze gedeelten van het plan begrepen percelen
      zijn aangegeven;

      f. indien een bestemmingsplan uit meerdere kaarten bestaat, moet uit een overzichtskaart de aansluiting van de
      kaarten onderling en de aansluiting aan het daaromheen gelegen gebied blijken;

      g. op de kaarten worden de schaal en de noordpijl aangegeven;

      h. op de kaarten worden de bestaande gebouwen en de namen van de belangrijkste wegen, straten en waterwegen
      aangegeven.

      2 De kaarten moeten op duidelijke en overzichtelijke wijze worden uitgevoerd. Zij moeten voorts van duurzaam
      materiaal vervaardigd worden en goed vermenigvuldigbaar zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0003889#Artikel12
