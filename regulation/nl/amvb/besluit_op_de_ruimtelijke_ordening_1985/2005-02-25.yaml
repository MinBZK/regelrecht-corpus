preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 25 januari 1985,
    no. MJZ 2515023, Centrale Directie Juridische Zaken, afdeling Wetgeving;

    Gelet op de artikelen 2a, eerste en tweede lid, 2c, 3, tweede lid, 4a, negende lid, 17, tiende lid, 18, eerste en
    derde lid, 18a, eerste en tweede lid, 19, vierde lid, 36, 51, tweede, vierde en vijfde lid, 52, eerste en derde
    lid, 53, derde lid,55, tweede lid, en 57 van de Wet op de Ruimtelijke Ordening alsmede de artikelen 45 en 76, derde
    lid, van de Wet geluidhinder;

    De Raad van State gehoord (advies van 23 september 1985, no. W08.85.0054/14.5.39);

    Gezien het nader rapport van Onze voornoemde Minister van 25 november 1985, no. MJZ 25N5055, Centrale Directie
    Juridische Zaken, afdeling Wetgeving;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0003889/2005-02-25#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      Onze Minister: Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer;

      de wet: de [Wet op de Ruimtelijke Ordening][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002375
    url: https://wetten.overheid.nl/BWBR0003889/2005-02-25#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002375
  - number: '3'
    text: |-
      1 In een planologische kernbeslissing wordt een concrete beleidsbeslissing als zodanig in de tekst of op de kaart
      benoemd en herkenbaar aangegeven.

      2 In een planologische kernbeslissing wordt tevens herkenbaar aangegeven welke van de daarin opgenomen beslissingen
      van zodanig belang zijn dat afwijking daarvan slechts mogelijk is met toepassing van [artikel 2b van de wet][ref1].

      3 In het plan kan worden aangegeven in hoeverre bij de herziening of intrekking van
      het plan of onderdelen daarvan toepassing zal worden gegeven aan het bepaalde in
      [artikel 2a, tweede, derde, vierde of vijfde lid, van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel2b
      [ref2]: https://wetten.overheid.nl/BWBR0002375#Artikel2a
    url: https://wetten.overheid.nl/BWBR0003889/2005-02-25#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002375
        artikel: 2b
      - id: ref2
        bwb_id: BWBR0002375
        artikel: 2a
  - number: '4'
    text: |-
      1 Een structuurschets geeft inzicht in mogelijke ontwikkelingen die van belang kunnen zijn voor het nationaal
      ruimtelijk beleid op de lange termijn, de middellange termijn daarbij tevens in beschouwing genomen, en bevat de
      hoofdlijnen en beginselen voor één of meer aspecten van dit beleid. Een structuurschets gaat vergezeld van één of
      meer kaarten waarop de hoofdlijnen en beginselen voor zover mogelijk in beeld zijn gebracht.

      2 Een structuurschema bevat met betrekking tot een bepaalde sector van het rijksbeleid hoofdlijnen en beginselen
      van algemeen belang voor het nationaal ruimtelijk beleid en geeft in het bijzonder inzicht in de ruimtelijke
      aspecten van die sector op de lange termijn, de middellange termijn daarbij tevens in beschouwing genomen. Een
      structuurschema gaat vergezeld van één of meer kaarten waarop de ruimtelijke aspecten van het beleid in die sector
      voor zover mogelijk in beeld zijn gebracht.

      3 Een ontwerp voor een structuurschets of voor een structuurschema bevat de elementen genoemd in het eerste of
      tweede lid.
    url: https://wetten.overheid.nl/BWBR0003889/2005-02-25#Artikel4
  - number: '6'
    text: |-
      Gedeputeerde Staten verrichten ten behoeve van de toekomstige ruimtelijke ontwikkeling van het gebied van de
      provincie onderzoek naar de bestaande toestand in en naar de mogelijke en wenselijke ontwikkeling van de provincie.
    url: https://wetten.overheid.nl/BWBR0003889/2005-02-25#Artikel6
  - number: '7'
    text: |-
      1 Een streekplan, een plan tot uitwerking daarvan, als bedoeld in [artikel 4a, tiende lid, van de wet][ref1]
      alsmede ontwerpen daarvoor worden vervat in:

      a. een beschrijving van de meest gewenste ontwikkeling in hoofdlijnen van het in het plan begrepen gebied en, voor
      zover nodig, van de fasen, waarin die ontwikkeling zich zou moeten of kunnen voltrekken;

      b. een of meer kaarten met bijbehorende verklaring waarin deze hoofdlijnen voor zover mogelijk in beeld zijn
      gebracht.

      2 Een streekplan, een plan tot uitwerking daarvan alsmede ontwerpen daarvoor gaan vergezeld van een toelichting,
      waarin zijn neergelegd:

      a. de aan het plan ten grondslag liggende gedachten en de uitkomsten van het in [artikel 6][ref2] bedoelde
      onderzoek, voorzover dit onderzoek het in het plan begrepen gebied betreft;

      b. de rapportering over het bij de voorbereiding van het streekplan gevoerde overleg en over de uitkomsten daarvan;

      c. een beschrijving van de wijze waarop rekening is gehouden met de gevolgen van het plan voor de waterhuishouding;

      d. een beschrijving van de mate waarin of de wijze waarop de onder *a* bedoelde ontwikkeling in hoofdlijnen
      is afgestemd op, dan wel leidt tot aanpassing van het provinciale milieubeleid, zoals dat is vastgelegd in het
      geldende provinciale milieubeleidsplan, of het provinciale waterhuishoudingsbeleid, zoals dat is vastgelegd in het
      geldende provinciale waterhuishoudingsplan;

      e. voor zover nodig een beschrijving van de wijze waarop en de termijn waarbinnen het geldende provinciale
      milieubeleidsplan of waterhuishoudingsplan zal worden herzien.

      3 In een streekplan wordt een concrete beleidsbeslissing als zodanig in de tekst of op de kaart benoemd en
      herkenbaar aangegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel4a
      [ref2]: https://wetten.overheid.nl/BWBR0003889#Artikel6
    url: https://wetten.overheid.nl/BWBR0003889/2005-02-25#Artikel7
    references:
      - id: ref1
