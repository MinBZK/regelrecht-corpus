  - number: '14'
    text: |-
      1 Op een besluit, bedoeld in [artikel 11, tweede lid, van de wet][ref1] alsmede een ontwerp daarvoor is
      [artikel 12, eerste lid][ref2], van overeenkomstige toepassing, met dien verstande dat het bepaalde onder *d* wordt
      vervangen door: *d.* voor zover nodig, regelen als bedoeld in [artikel 15 van de wet][ref3].

      2 Een besluit, bedoeld in [artikel 11, tweede lid, van de wet][ref4], alsmede een ontwerp daarvoor, gaan vergezeld
      van een toelichting, waarin is neergelegd:

      a. de aan het besluit ten grondslag liggende gedachten en, in voorkomend geval, de uitkomsten van nader, het in het
      besluit begrepen gebied betreffend, onderzoek als bedoeld in [artikel 9][ref5];

      b. in voorkomend geval, de uitkomsten van nader overleg als bedoeld in [artikel 10][ref6];

      c. in voorkomend geval, vermelding van het ontbreken van overeenstemming over verdeling van de hogere kosten als
      bedoeld in [artikel 31a, eerste lid van de wet][ref7].


