  - number: '22'
    text: |-
      1 De leden van de Rijksplanologische Commissie worden benoemd door Onze Ministers van Algemene Zaken, van
      Buitenlandse Zaken, van Justitie, van Binnenlandse Zaken en Koninkrijksrelaties, van Onderwijs, Cultuur en
      Wetenschappen, van Financiën, van Defensie, en van Sociale Zaken en Werkgelegenheid die ieder één lid benoemen,
      Onze Ministers van Verkeer en Waterstaat, van Landbouw, Natuurbeheer en Visserij en van Volksgezondheid, Welzijn
      en Sport, die ieder twee leden benoemen en door Onze Ministers van Economische Zaken en van Volkshuisvesting,
      Ruimtelijke Ordening en Milieubeheer, die ieder drie leden benoemen.

      2 Onze Minister kan één of meer deskundigen tot lid van de Rijksplanologische Commissie benoemen.
    url: https://wetten.overheid.nl/BWBR0003889/2005-02-25#Artikel22
  - number: '23'
    text: |-
      1 De voorzitter van de Rijksplanologische Commissie kan zich bij ontstentenis of ziekte doen vervangen door een
      door hem aan te wijzen lid.

      2 Bij ontstentenis of ziekte van een lid van de Commissie kan de betrokken Minister voor een bepaalde termijn een
      ander tot lid benoemen.
    url: https://wetten.overheid.nl/BWBR0003889/2005-02-25#Artikel23
  - number: '24'
    text: |-
      1 De Rijksplanologische Commissie heeft naast hetgeen de wet daaromtrent bepaalt tot taak:

      a. het uitbrengen van adviezen en het doen van voorstellen aan Onze Minister omtrent het Regeringsbeleid inzake de
      ruimtelijke ordening;

      b. het uitbrengen van adviezen en het doen van voorstellen betreffende streekplannen, en voorts voor zover
      van algemene aard of strekking ten aanzien van structuurplannen, bestemmingsplannen en andere maatregelen op
      planologisch gebied;

      c. het ontwerpen van richtlijnen voor het planologische werk.

      2 Van het bepaalde in [artikel 3, eerste lid][ref1], van de wet wordt afgeweken voor wat betreft
      de maatregelen en plannen die worden behandeld in de Centrale Landinrichtingscommissie, ingevolge
      [artikel 7 van de Landinrichtingswet][ref2], behoudens in die gevallen waarin van de zijde van een Onzer Ministers
      die in de Rijksplanologische Commissie vertegenwoordigd is, tegen de maatregel of het plan bezwaar wordt gemaakt op
      grond van het regeringsbeleid inzake de ruimtelijke ordening.


      [ref1]: https://wetten.overheid.nl/BWBR0003889#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003793#Artikel7
    url: https://wetten.overheid.nl/BWBR0003889/2005-02-25#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0003889
        artikel: '3'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0003793
        artikel: '7'
  - number: '25'
    text: |-
      1 De voorzitter van de Rijksplanologische Commissie roept de Commissie in vergadering bijeen zo dikwijls hij dit
      nodig oordeelt of indien één lid dit verzoekt. De oproep vermeldt de agenda van de vergadering.

      2 De Commissie kan uit haar midden werkcommissies vormen. De voorzitter kan deskundigen uitnodigen tot het
      deelnemen aan beraadslagingen van de Commissie of van een werkcommissie.

      3 Op verzoek van een lid schorst de voorzitter de behandeling van een zaak tot de volgende vergadering teneinde het
      lid gelegenheid te geven met de Minister die hem heeft benoemd, ruggespraak te houden.
    url: https://wetten.overheid.nl/BWBR0003889/2005-02-25#Artikel25
  - number: '26'
    text: |-
      1 Er is in de Rijksplanologische Commissie een subcommissie voor algemene zaken.

      2 Onze Minister bepaalt, de Rijksplanologische Commissie gehoord, welke leden van deze Commissie zitting hebben in
      de in het eerste lid bedoelde subcommissie. De voorzitter van de Rijksplanologische Commissie is voorzitter van de
      subcommissie. Het hoofd van de Rijksplanologische Dienst heeft zitting in de subcommissie.

      3 Onze Minister kan, de Rijksplanologische Commissie gehoord, niet-leden van deze Commissie als lid van de in het
      eerste lid bedoelde subcommissie benoemen.

      4 Het advies van de in dit artikel bedoelde subcommissie treedt in de plaats van dat der Rijksplanologische
      Commissie, tenzij de voorzitter of een lid behandeling in de Rijksplanologische Commissie verlangt.
    url: https://wetten.overheid.nl/BWBR0003889/2005-02-25#Artikel26
  - number: '27'
    text: |-
      1 In de adviezen van de Rijksplanologische Commissie of van de subcommissie wordt desverlangd van gevoelens, van
      die der meerderheid afwijkende, melding gemaakt.

      2 De leden die in een vergadering van de Commissie of van de subcommissie een mening kenbaar hebben gemaakt, van
      die der meerderheid afwijkende, kunnen zich in deze vergadering de bevoegdheid voorbehouden tot het uitbrengen van
      een afzonderlijk advies, dat bij het advies van de Commissie of van de subcommissie wordt gevoegd.
    url: https://wetten.overheid.nl/BWBR0003889/2005-02-25#Artikel27
  - number: '28'
    text: |-
      1 De standplaats van het hoofd van de Rijksplanologische Dienst is 's-Gravenhage.

      2 Ten behoeve van de vervulling van de taak van de dienst worden ten hoogste vijf directies ingesteld.

      3 Onze Minister stelt het aantal alsmede de omvang van de werkzaamheden der directies vast.

      4 Onze Minister kan ten behoeve van het verrichten van bepaalde onderzoekingen van algemene of bijzondere aard ter
      voorbereiding van de taakvervulling van de dienst commissies instellen, waarin uitsluitend of voor het merendeel
      personen die niet tot de dienst behoren, zitting hebben.

      5 De in het vierde lid bedoelde commissies brengen advies uit aan het hoofd van de dienst.

      6 Het hoofd van de dienst legt op verzoek van Onze Minister bij zijn advies dat van een overeenkomstig het vierde
      lid ingestelde commissie over.
    url: https://wetten.overheid.nl/BWBR0003889/2005-02-25#Artikel28
  - number: '38'
    text: |-
      1 De provinciale planologische commissies worden zodanig samengesteld, dat de verschillende aspecten die bij de
      ruimtelijke ordening zijn betrokken, daarin tot hun recht komen.

      2 In de provinciale planologische commissies hebben in elk geval zitting de hoofdingenieur-directeur van de
      Rijkswaterstaat in de provincie, de inspecteur, de eerstaanwezend ingenieur directeur van de betrokken directie
      van de Dienst Gebouwen, Werken en Terreinen van het departement van Defensie, het regiohoofd van de Rijksdienst
      voor de Monumentenzorg, de regio-coördinator van de Rijksdienst voor het Oudheidkundig Bodemonderzoek, het hoofd
      van de betrokken regio van het ministerie van Economische Zaken, de betrokken regiodirecteur van het ministerie van
      Landbouw, Natuurbeheer en Visserij en de regionaal-directeur voor de arbeidsvoorziening.
    url: https://wetten.overheid.nl/BWBR0003889/2005-02-25#Artikel38
  - number: 38a
    text: |-
      Onze Minister maakt vóór 1 november in de *Staatscourant* het door hem vastgestelde subsidieplafond voor het
      daaropvolgende kalenderjaar bekend.
    url: https://wetten.overheid.nl/BWBR0003889/2005-02-25#Artikel38a
  - number: 38b
    text: |-
      1 Voor de in [artikel 50a, eerste lid, onderdeel a, van de wet][ref1] genoemde activiteiten wordt geen subsidie
      verleend voor zover het reguliere kosten voor het opstellen en herzien van ruimtelijke plannen betreft.

      2 Voor de in [artikel 50a, eerste lid, onderdeel b, van de wet][ref2] genoemde activiteiten wordt geen subsidie
      verleend voor zover de kosten uit hoofde van een andere regeling voor vergoeding in aanmerking kunnen komen.

      3 Voor de in [artikel 50a, eerste lid, onderdeel c, van de wet][ref3] genoemde activiteiten wordt geen subsidie
      verleend voor zover niet is aangetoond dat de activiteiten in financiële en in bestuurlijke zin haalbaar zijn of
      voor zover de kosten uit hoofde van een andere regeling voor vergoeding in aanmerking kunnen komen.


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel50a
      [ref2]: https://wetten.overheid.nl/BWBR0002375#Artikel50a
      [ref3]: https://wetten.overheid.nl/BWBR0002375#Artikel50a
    url: https://wetten.overheid.nl/BWBR0003889/2005-02-25#Artikel38b
    references:
      - id: ref1
        bwb_id: BWBR0002375
        artikel: 50a
      - id: ref2
        bwb_id: BWBR0002375
        artikel: 50a
      - id: ref3
        bwb_id: BWBR0002375
        artikel: 50a
  - number: 38c
    text: |-
      Onze Minister kan ter uitvoering van de planologische kernbeslissing over de Waddenzee subsidie verstrekken ten
      behoeve van het bestuurlijk overleg over het Waddengebied.
    url: https://wetten.overheid.nl/BWBR0003889/2005-02-25#Artikel38c
  - number: 38d
    text: |-
      1 De subsidie-aanvraag wordt voorafgaand aan de activiteit bij Onze Minister ingediend.

      2 De activiteit vangt aan in het jaar waarop de subsidie-aanvraag betrekking heeft.

      3 De subsidie-aanvraag gaat in elk geval vergezeld van:

      a. een sluitende begroting van de kosten of de wijze van financiering van de activiteit, en

      b. een beschrijving van de activiteit en een tijdsplanning.

      4 Onze Minister kan nadere regels geven omtrent de gegevens die bij de subsidie-aanvraag dienen te worden
      verstrekt.

      5 Aan de aanvrager wordt onverwijld een bericht van ontvangst gezonden, waarin de datum van ontvangst wordt
      vermeld.
    url: https://wetten.overheid.nl/BWBR0003889/2005-02-25#Artikel38d
  - number: 38e
    text: |-
      Onze Minister neemt bij de verdeling van het beschikbare bedrag in aanmerking:

      a. het belang van de activiteit waarvoor een subsidie-aanvraag is ingediend voor de uitvoering van het nationaal
      ruimtelijk beleid, en

      b. de bijdrage van die activiteit aan de verwezenlijking van het doel van de subsidie.
    url: https://wetten.overheid.nl/BWBR0003889/2005-02-25#Artikel38e
  - number: 38f
    text: |-
      1 Onze Minister beslist binnen acht weken na ontvangst van de subsidie-aanvraag.

      2 Onze Minister kan de beslissing voor ten hoogste acht weken verdagen. Van de verdaging wordt schriftelijk
      mededeling gedaan.
    url: https://wetten.overheid.nl/BWBR0003889/2005-02-25#Artikel38f
  - number: 38g
    text: |-
      De subsidieverlening wordt geweigerd indien de subsidie-aanvrager niet heeft voldaan aan het bepaalde in
      [artikel 38d, eerste tot en met vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003889#Artikel38d
    url: https://wetten.overheid.nl/BWBR0003889/2005-02-25#Artikel38g
    references:
      - id: ref1
        bwb_id: BWBR0003889
        artikel: 38d
        hoofdstuk: VI
        paragraaf: '2'
  - number: 38h
    text: |-
      1 De subsidie-ontvanger voert de activiteit uit overeenkomstig de door hem verstrekte gegevens, tenzij Onze
      Minister voorafgaand toestemming heeft gegeven daarvan af te wijken.

      2 De subsidie-ontvanger voert een administratie die zodanig is ingericht dat daaruit te allen tijde op eenvoudige
      wijze de kosten en de financieringswijze van de activiteit waarvoor een subsidie is verleend, kan worden afgelezen.

      3 Voor zover de activiteit zich over meer dan één kalenderjaar uitstrekt legt de subsidie-ontvanger tevens éénmaal
      per kalenderjaar een verslag omtrent de voortgang van de activiteit over aan Onze Minister.

      4 Onze Minister kan de subsidie-ontvanger bij de subsidieverlening ook andere verplichtingen opleggen die strekken
      tot verwezenlijking van het doel van de subsidie.
    url: https://wetten.overheid.nl/BWBR0003889/2005-02-25#Artikel38h
  - number: 38i
    text: |-
      1 De subsidie-ontvanger dient binnen 13 weken na voltooiing van de activiteit bij Onze Minister een aanvraag tot
      subsidievaststelling in.

      2 De aanvraag tot subsidievaststelling gaat vergezeld van een activiteitenverslag, waarbij de subsidie-ontvanger
      aantoont dat de activiteit overeenkomstig de aan de subsidie verbonden verplichtingen heeft plaatsgevonden, en een
      financieel verslag.

      3 Indien de subsidie meer bedraagt dan € 50 000, gaat het financiële verslag
      vergezeld van een verklaring van getrouwheid van een accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1], die wordt afgegeven na toetsing van de
      wijze van besteding van de subsidie aan de wet en dit besluit.

      4 Het derde lid is niet van toepassing op subsidieverstrekking aan gemeenten of provincies.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0003889/2005-02-25#Artikel38i
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: 38j
    text: |-
      1 Onze Minister kan op aanvraag voorschotten verlenen, met dien verstande dat het totale bedrag aan verleende
      voorschotten niet meer kan bedragen dan 80 procent van het bedrag van de verleende subsidie.

      2 In afwijking van het eerste lid, kan in naar het oordeel van Onze Minister in aanmerking komende gevallen het
      totale bedrag van de verleende voorschotten 100 procent bedragen van de verleende subsidie.

      3 Een beschikking tot voorschotverlening vermeldt de termijnen waarbinnen de voorschotten worden uitbetaald. Aan de
      beschikking kunnen verplichtingen worden verbonden.
    url: https://wetten.overheid.nl/BWBR0003889/2005-02-25#Artikel38j
  - number: '42'
    text: |-
      1 Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor verschillende artikelen
      of onderdelen daarvan verschillend kan worden gesteld.

      2 Het kan worden aangehaald als "Besluit op de ruimtelijke ordening 1985".
    url: https://wetten.overheid.nl/BWBR0003889/2005-02-25#Artikel42
