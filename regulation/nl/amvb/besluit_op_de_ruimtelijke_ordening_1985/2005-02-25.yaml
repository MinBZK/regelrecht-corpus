  - number: '19'
    text: |-
      Vrijstelling als bedoeld in [artikel 17 van de wet][ref1] wordt slechts verleend, indien aannemelijk is, dat het
      beoogde bouwwerk, werk, geen bouwwerk zijnde, of werkzaamheid dan wel gebruik niet langer dan vijf jaren in stand
      zal blijven respectievelijk voortduren.


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel17
    url: https://wetten.overheid.nl/BWBR0003889/2005-02-25#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0002375
        artikel: '17'
  - number: 19a
    text: |-
      De ruimtelijke onderbouwing, bedoeld in [artikel 19, eerste lid, van de wet][ref1], gaat vergezeld van een
      beschrijving van de wijze waarop rekening is gehouden met de gevolgen van het besluit voor de waterhuishouding.


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel19
    url: https://wetten.overheid.nl/BWBR0003889/2005-02-25#Artikel19a
    references:
      - id: ref1
        bwb_id: BWBR0002375
        artikel: '19'
  - number: '20'
    text: |-
      1 Voor de toepassing van [artikel 19, derde lid, van de wet][ref1] komen in aanmerking:

      a. een uitbreiding van of een bijgebouw bij:

      1°. een woongebouw in de bebouwde kom, mits het aantal woningen gelijk blijft;

      2°. een woongebouw buiten de bebouwde kom, mits het aantal woningen gelijk blijft en

      a. het bruto-vloeroppervlak van de uitbreiding of het bijgebouw niet groter is dan 25 m2,

      b. de uitbreiding of het bijgebouw bestaat uit één bouwlaag en gemeten vanaf het aansluitende terrein niet hoger is
      dan 5 meter, en

      c. de uitbreiding niet tot gevolg heeft dat het aansluitende terrein voor meer dan 50% bebouwd is, dan wel dat de
      oppervlakte die op grond van het geldende bestemmingsplan voor bebouwing in aanmerking komt met meer dan 50% wordt
      overschreden;

      3°. een ander gebouw in de bebouwde kom, alsmede een ander gebouw buiten de bebouwde kom met een agrarische
      bestemming, mits de uitbreiding niet tot gevolg heeft dat:

      a. het aansluitende terrein voor meer dan 50% bebouwd is, en

      b. de oppervlakte die op grond van het geldende bestemmingsplan voor bebouwing in aanmerking komt met meer dan 50%
      wordt overschreden;

      b. een gebouw ten behoeve van een openbare nutsvoorziening, het openbaar vervoer of het wegverkeer:

      1°. waarvan het bruto-vloeroppervlak niet groter is dan 25 m2, en

      2°. dat bestaat uit één bouwlaag en dat gemeten vanaf het aansluitende terrein niet hoger is dan 5m;

      c. een bouwwerk, geen gebouw zijnde:

      1°. waarvan het bruto-vloeroppervlak niet groter is dan 25 m2, en

      2°. dat gemeten vanaf het aansluitende terrein niet hoger is dan 5m;

      d. een kas of een bedrijfsgebouw van lichte constructie:

      1°. ten dienste van een agrarische bestemming, en

      2°. waarvan het bruto-vloeroppervlak niet groter is dan 100 m2;

      e. een wijziging in het gebruik van opstallen in de bebouwde kom, mits het aantal woningen gelijk blijft en het
      gebruik niet meer omvat dan een bruto-vloeroppervlak van 1500 m2;

      f. een antenne-installatie als bedoeld in het
      [Besluit bouwvergunningsvrije en licht-bouwvergunningplichtige bouwwerken][ref2], in de bebouwde kom, mits de
      hoogte van de antenne, of indien de antenne is geplaatst op een antennedrager als bedoeld in dat besluit, de hoogte
      van de antennedrager en de antenne tezamen, gemeten vanaf de voet van de antenne, respectievelijk de antennedrager,
      niet meer is dan 40 m.

      2 Onder een gebouw als bedoeld in het eerste lid wordt verstaan een gebouw als bedoeld in
      [artikel 1, onder c, van de Woningwet][ref3].

      3 Onder een woongebouw als bedoeld in het eerste lid wordt mede verstaan een woonwagen als bedoeld in
      [artikel 1, eerste lid, onder f, van de Huisvestingswet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0013890
      [ref3]: https://wetten.overheid.nl/BWBR0005181#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0005674#Artikel1
    url: https://wetten.overheid.nl/BWBR0003889/2005-02-25#Artikel20
