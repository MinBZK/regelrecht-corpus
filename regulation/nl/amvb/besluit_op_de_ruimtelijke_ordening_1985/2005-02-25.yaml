  - number: '12'
    text: |-
      1 Een bestemmingsplan alsmede een ontwerp daarvoor worden vervat in:

      a. een omschrijving van de in het plan vervatte bestemmingen, waarbij per bestemming het doel of de doeleinden
      worden aangegeven, die met het oog op een goede ruimtelijke ordening aan de in het plan begrepen gronden worden
      toegekend, alsmede in voorkomend geval, een beschrijving in hoofdlijnen van de wijze waarop met het plan dat doel
      of die doeleinden worden nagestreefd;

      b. een of meer kaarten met bijbehorende verklaring, waarop de bestemmingen van de in het plan begrepen gronden
      worden aangewezen;

      c. voor zover nodig, voorschriften omtrent het gebruik van de in het plan begrepen grond en van de zich daarop
      bevindende opstallen;

      d. voor zover nodig, regelen dan wel grenzen als bedoeld in de [artikelen 11, eerste lid][ref1], en
      [15 van de wet][ref2].

      2 Een bestemmingsplan alsmede een ontwerp daarvoor gaan vergezeld van een toelichting, waarin zijn neergelegd:

      a. de aan het plan ten grondslag liggende gedachten en de uitkomsten van het in [artikel 9][ref3] bedoelde
      onderzoek voor zover dit onderzoek het in het plan begrepen gebied betreft;

      b. de uitkomsten van het in [artikel 10][ref4] bedoelde overleg;

      c. een beschrijving van de wijze waarop rekening is gehouden met de gevolgen van het plan voor de waterhuishouding;

      d. een rapportering als bedoeld in [artikel 6a van de wet][ref5] juncto
      [artikel 150, tweede lid, onder c, van de Gemeentewet][ref6];

      e. in voorkomend geval, vermelding van het ontbreken van overeenstemming over verdeling van de hogere kosten als
      bedoeld in [artikel 31a, eerste lid, van de wet][ref7].


