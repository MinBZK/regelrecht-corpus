  - number: '13'
    text: |-
      1 Een bestemmingsplan dat op grond van [artikel 11 van de wet][ref1] geheel of gedeeltelijk moet worden uitgewerkt,
      geeft aan waarop de uitwerkingsverplichting betrekking heeft.

      2 Een bestemmingsplan als bedoeld in het eerste lid geeft bovendien op zodanige wijze de doelstellingen voor het
      uit te werken plan aan, dat voldoende inzicht wordt verkregen in de hoofdlijnen van de toekomstige ontwikkeling van
      dat plangebied.


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel11
