preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Economische Zaken, Landbouw en Innovatie van 11 juli 2011, nr. WJZ /
    11099592;

    Gelet op richtlijn nr. 2006/32/EG van het Europees Parlement en de Raad van de Europese Unie van 5 april 2006
    betreffende energie-efficiëntie bij het eindgebruik en energiediensten en houdende intrekking van Richtlijn 93/76/
    EEG van de Raad (PbEU L 114), de artikelen 26ad, tweede lid, 95la, eerste en derde lid, van de Elektriciteitswet
    1998 en de artikelen 13d, tweede lid, 42a, eerste en derde lid, van de Gaswet;

    De Afdeling advisering van de Raad van State gehoord (advies van 7 september 2011, nr. WI5.11.0277/IV);

    Gezien het nader rapport van Onze Minister van Economische Zaken, Landbouw en Innovatie van 20 oktober 2011,
    nr. WJZ / 11144506;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0030605/2026-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0030605/2026-01-01#Artikel1
  - number: 1.a
    text: |-
      *richtlijn meetinstrumenten:* [richtlijn 2014/32/EU](32014L0032) van het Europees Parlement en de Raad van
      26 februari 2014 betreffende de harmonisatie van de wetgevingen van de lidstaten inzake het op de markt aanbieden
      van meetinstrumenten;
    url: https://wetten.overheid.nl/BWBR0030605/2026-01-01#Artikel1
  - number: 1.b
    text: '*warmtemeter:* een warmtemeter als bedoeld in bijlage VI van de richtlijn meetinstrumenten;'
    url: https://wetten.overheid.nl/BWBR0030605/2026-01-01#Artikel1
  - number: 1.c
    text: |-
      *een op afstand uitleesbare meetinrichting voor warmte:* het gehele samenstel van apparatuur als bedoeld in
      [artikel 5a][ref1] dat ten minste bestaat uit een warmtemeter;


      [ref1]: https://wetten.overheid.nl/BWBR0030605#Artikel5a
    url: https://wetten.overheid.nl/BWBR0030605/2026-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0030605
        artikel: 5a
        hoofdstuk: '3'
  - number: 1.d
    text: '*meterdienstleverancier:* een persoon die zich bezighoudt met de levering van meterdiensten.'
    url: https://wetten.overheid.nl/BWBR0030605/2026-01-01#Artikel1
  - number: '3'
    text: Dit hoofdstuk is van toepassing op meetinrichtingen voor warmte.
    url: https://wetten.overheid.nl/BWBR0030605/2026-01-01#Artikel3
  - number: 5a.1
    text: 'Een op afstand uitleesbare meetinrichting voor warmte is geschikt om:'
    url: https://wetten.overheid.nl/BWBR0030605/2026-01-01#Artikel5a
  - number: 5a.1.a
    text: de actuele meterstand te registreren en weer te geven;
    url: https://wetten.overheid.nl/BWBR0030605/2026-01-01#Artikel5a
  - number: 5a.1.b
    text: |-
      op afstand de gegevens, bedoeld in onderdeel a, te versturen naar de warmteleverancier of meterdienstleverancier op
      zodanige wijze dat de warmteleverancier of meterdienstleverancier de verstuurde gegevens kan lezen en gebruiken.
    url: https://wetten.overheid.nl/BWBR0030605/2026-01-01#Artikel5a
  - number: 5a.2
    text: |-
      Het registreren en versturen van gegevens geschiedt volgens internationale open standaarden voor zowel het
      gegevensverkeer als de fysieke aansluitingen.
    url: https://wetten.overheid.nl/BWBR0030605/2026-01-01#Artikel5a
  - number: '6.1'
    text: |-
      Een meetinrichting is zodanig beveiligd tegen fraude met, misbruik van of inbreuk op de meetinrichting dat een
      passend beveiligingsniveau is gegarandeerd, rekening houdend met de internationale stand van de techniek en de
      kosten van de tenuitvoerlegging, mede gelet op de risico’s die de aanwezigheid van de functionaliteiten bestaande
      uit het op afstand onderbreken, beperken en hervatten van de levering van warmte met zich mee brengt.
    url: https://wetten.overheid.nl/BWBR0030605/2026-01-01#Artikel6
  - number: '6.2'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de beveiliging van een
      meetinrichting als bedoeld in het eerste lid. Deze regels kunnen betrekking hebben op het nemen van technische en
      organisatorische beveiligingsmaatregelen als bedoeld in artikel 32 van de Algemene verordening gegevensbescherming.
    url: https://wetten.overheid.nl/BWBR0030605/2026-01-01#Artikel6
  - number: '7'
    text: Bij ministeriële regeling kunnen eisen worden gesteld aan de kwaliteit van meetinrichtingen.
    url: https://wetten.overheid.nl/BWBR0030605/2026-01-01#Artikel7
  - number: 8a
    text: |-
      In aanvulling op [artikel 2, negende lid][ref1], en
      [artikel 6a, tiende lid, van de Wet implementatie EU-richtlijnen energie-efficiëntie][ref2] en
      [artikel 8, veertiende lid, van de Warmtewet][ref3] bepaalt de netbeheerder voor koude of de leverancier van
      warmte, rekening houdend met de functie en specifieke kenmerken van het gebouw, of de installatie van een
      individuele meter om het energieverbruik te meten technisch haalbaar of kostenefficiënt is, onderscheidenlijk
      installatie van individuele kostenverdelers kostenefficiënt is, aan de hand van:


      [ref1]: https://wetten.overheid.nl/BWBR0029672#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0029672#Artikel6a
      [ref3]: https://wetten.overheid.nl/BWBR0033729#Artikel8
    url: https://wetten.overheid.nl/BWBR0030605/2026-01-01#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0029672
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0029672
        artikel: 6a
      - id: ref3
        bwb_id: BWBR0033729
        artikel: '8'
  - number: 8a.a
    text: de complexiteit van het leidingstelsel;
    url: https://wetten.overheid.nl/BWBR0030605/2026-01-01#Artikel8a
  - number: 8a.b
    text: in hoeverre de meting een goede weergave geeft van het eigen verbruik;
    url: https://wetten.overheid.nl/BWBR0030605/2026-01-01#Artikel8a
  - number: 8a.c
    text: in hoeverre de eindgebruiker invloed kan uitoefenen op het warmte- koudegebruik;
    url: https://wetten.overheid.nl/BWBR0030605/2026-01-01#Artikel8a
  - number: 8a.d
    text: |-
      in hoeverre de besparing opweegt tegen de kosten van de meting aan de hand van de volgende formule: 0,15 * E * P >
      K + M
    url: https://wetten.overheid.nl/BWBR0030605/2026-01-01#Artikel8a
  - number: '9.1'
    text: |-
      Met op afstand uitleesbare meetinrichtingen voor warmte worden gelijkgesteld meetinrichtingen die rechtmatig zijn
      vervaardigd of in de handel zijn gebracht in een andere lidstaat van de Europese Unie dan wel rechtmatig zijn
      vervaardigd in een staat, niet zijnde een lidstaat van de Europese Unie, die partij is bij een daartoe strekkend
      of mede daartoe strekkend Verdrag dat Nederland bindt, en die voldoen aan eisen die een beschermingsniveau bieden
      dat ten minste gelijkwaardig is aan het niveau dat met de nationale eisen wordt nagestreefd, met name op het
      gebied van de beveiliging tegen fraude met, misbruik van of inbreuk op de meetinrichting, en in wezen dezelfde
      functionaliteiten voorschrijven, waaronder in ieder geval de functionaliteit bestaande uit het op afstand kunnen
      uitwisselen van de actuele meterstanden.
    url: https://wetten.overheid.nl/BWBR0030605/2026-01-01#Artikel9
  - number: '9.2'
    text: |-
      De bij of krachtens dit besluit gestelde eisen gelden voor de meetinrichting met uitzondering van de tot de
      meetinrichting behorende warmtemeter.
    url: https://wetten.overheid.nl/BWBR0030605/2026-01-01#Artikel9
  - number: '13.1'
    text: |-
      De [artikelen 1 tot en met 3][ref1],
      [artikel 4, eerste lid, aanhef en onderdelen b tot en met k, vierde, vijfde en zevende lid][ref2],
      [artikel 5, eerste lid, aanhef en onderdelen a, b, d tot en met g, en vierde tot en met zesde lid][ref3], en de
      [artikelen 6 tot en met 12][ref4] treden in werking met ingang van 1 januari 2012.


      [ref1]: https://wetten.overheid.nl/BWBR0030605#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0030605#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0030605#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0030605#Artikel6
    url: https://wetten.overheid.nl/BWBR0030605/2026-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0030605
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
