  - number: '13.2'
    text: |-
      De overige artikelen van dit besluit treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor
      de verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0030605/2026-01-01#Artikel13
  - number: '14'
    text: 'Dit besluit wordt aangehaald als: Besluit op afstand uitleesbare meetinrichtingen.'
    url: https://wetten.overheid.nl/BWBR0030605/2026-01-01#Artikel14
