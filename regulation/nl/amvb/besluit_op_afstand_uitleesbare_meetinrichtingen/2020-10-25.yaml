  - number: '3'
    text: |-
      Dit hoofdstuk is van toepassing op meetinrichtingen voor warmte, op meetinrichtingen voor elektriciteit als bedoeld
      in [artikel 95la, eerste lid, van de Elektriciteitswet 1998][ref1] en op meetinrichtingen voor gas als bedoeld in
      [artikel 42a van de Gaswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95la
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel42a
