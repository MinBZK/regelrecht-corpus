  - number: '12'
    text: |-
      1 Een meetinrichting voor gas die is geplaatst na inwerkingtreding van
      [artikel 5, eerste lid, onderdelen a, b en d tot en met f][ref1], en voor inwerkingtreding van artikel 5, eerste
      lid, onderdeel c, behoeft niet te voldoen aan artikel 5, eerste lid, onderdeel c.

