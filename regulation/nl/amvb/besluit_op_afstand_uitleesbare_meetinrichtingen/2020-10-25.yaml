  - number: '2'
    text: |-
      Netbeheerders dragen er zorg voor dat op 31 december 2020 aan alle afnemers als bedoeld in
      [artikel 95a, eerste lid, Elektriciteitswet 1998][ref1] en [artikel 43, eerste lid, Gaswet][ref2]
      een meetinrichting ter beschikking is gesteld die ten minste voldoet aan de
      krachtens [artikel 95la, eerste lid, van de Elektriciteitswet 1998][ref3] en
      [artikel 42a, eerste lid, Gaswet][ref4] gestelde eisen, tenzij een afnemer blijkens voorwaarden,
      bedoeld in [artikel 31, eerste lid, onderdelen a of b, van de Elektriciteitswet 1998][ref5] of
      [artikel 12b, eerste lid, onderdelen a of b, van de Gaswet][ref6] beschikt over een onbemeten aansluiting.


