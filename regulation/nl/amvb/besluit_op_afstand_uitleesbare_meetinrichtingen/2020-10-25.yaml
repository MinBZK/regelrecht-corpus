  - number: 8a
    text: |-
      In aanvulling op [artikel 2, negende lid][ref1], en
      [artikel 6a, tiende lid, van de Wet implementatie EU-richtlijnen energie-efficiëntie][ref2] en
      [artikel 8, veertiende lid, van de Warmtewet][ref3] bepaalt de netbeheerder voor koude of de leverancier van
      warmte, rekening houdend met de functie en specifieke kenmerken van het gebouw, of de installatie van een
      individuele meter om het energieverbruik te meten technisch haalbaar of kostenefficiënt is, onderscheidenlijk
      installatie van individuele kostenverdelers kostenefficiënt is, aan de hand van:

      a. de complexiteit van het leidingstelsel;

      b. in hoeverre de meting een goede weergave geeft van het eigen verbruik;

      c. in hoeverre de eindgebruiker invloed kan uitoefenen op het warmte- koudegebruik;

      d. in hoeverre de besparing opweegt tegen de kosten van de meting aan de hand van de volgende formule: 0,15 * E * P
      > K + M

      waarbij:

      E = het gemiddelde energieverbruik van de laatste drie jaren naar rato verdeeld over het aantal eindgebruikers
      gecorrigeerd voor de graaddagen;

      P = maximumprijs warmtelevering;

      K = de gemiddelde jaarlijkse kapitaalkosten berekend op basis van een afschrijvingstermijn van 10 jaar en de
      discontorente;

      M = jaarlijkse kosten van het uitlezen van de meetinrichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0029672#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0029672#Artikel6a
