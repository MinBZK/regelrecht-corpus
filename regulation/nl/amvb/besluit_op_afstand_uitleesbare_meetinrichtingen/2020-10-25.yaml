      g, behoeft niet te voldoen aan artikel 5, onderdeel g.

      3 Een meetinrichting voor gas die is geplaatst in de periode na inwerkingtreding van
      [artikel 5, eerste lid, onderdelen a, b en d tot en met f][ref3] en voor inwerkingtreding van artikel 5, tweede
      lid, behoeft na inwerkingtreding van artikel 5, tweede lid, niet te voldoen aan artikel 5, tweede lid. Indien
      de meetinrichting op grond van de eerste volzin niet voldoet aan artikel 5, tweede lid, wordt aan de afnemer
      duidelijk, tijdig en controleerbaar gecommuniceerd of de functionaliteit genoemd in artikel 5, eerste lid,
      onderdeel b, is ingeschakeld of uitgeschakeld.

