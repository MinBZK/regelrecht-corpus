    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Economische Zaken, Landbouw en Innovatie van 11 juli 2011, nr. WJZ /
    11099592;

    Gelet op richtlijn nr. 2006/32/EG van het Europees Parlement en de Raad van de Europese Unie van 5 april 2006
    betreffende energie-efficiëntie bij het eindgebruik en energiediensten en houdende intrekking van Richtlijn 93/76/
    EEG van de Raad (PbEU L 114), de artikelen 26ad, tweede lid, 95la, eerste en derde lid, van de Elektriciteitswet
    1998 en de artikelen 13d, tweede lid, 42a, eerste en derde lid, van de Gaswet;

    De Afdeling advisering van de Raad van State gehoord (advies van 7 september 2011, nr. WI5.11.0277/IV);

    Gezien het nader rapport van Onze Minister van Economische Zaken, Landbouw en Innovatie van 20 oktober 2011,
    nr. WJZ / 11144506;

    Hebben goedgevonden en verstaan:
