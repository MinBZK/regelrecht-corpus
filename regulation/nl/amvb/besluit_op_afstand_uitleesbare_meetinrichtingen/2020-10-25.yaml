  - number: 5a
    text: |-
      1 Een op afstand uitleesbare meetinrichting voor warmte is geschikt om:

      a. de actuele meterstand te registreren en weer te geven;

      b. op afstand de gegevens, bedoeld in onderdeel a, te versturen naar de warmteleverancier of meterdienstleverancier
      op zodanige wijze dat de warmteleverancier of meterdienstleverancier de verstuurde gegevens kan lezen en gebruiken.

      2 Het registreren en versturen van gegevens geschiedt volgens internationale open standaarden voor zowel het
      gegevensverkeer als de fysieke aansluitingen.
    url: https://wetten.overheid.nl/BWBR0030605/2020-10-25#Artikel5a
  - number: '6'
    text: |-
      1 Een meetinrichting is zodanig beveiligd tegen fraude met, misbruik van of inbreuk op de meetinrichting dat
      een passend beveiligingsniveau is gegarandeerd, rekening houdend met de internationale stand van de techniek
      en de kosten van de tenuitvoerlegging, mede gelet op de risico’s die de aanwezigheid van de functionaliteiten
      bestaande uit het op afstand onderbreken, beperken en hervatten van de levering van elektriciteit of het op afstand
      onderbreken en hervatten van de levering van gas met zich mee brengt.

      2 Een meetinrichting voor gas is beveiligd tegen veiligheidsrisico’s als gevolg van het opnieuw opbouwen van
      gasdruk bij het op afstand hervatten van de gaslevering na een onderbreking. De eerste volzin is niet van
      toepassing op een meetinrichting voor gas die niet beschikt over de functionaliteit bestaande uit het op afstand
      onderbreken en hervatten van de gaslevering.

      3 Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de beveiliging van een
      meetinrichting als bedoeld in het eerste lid. Deze regels kunnen betrekking hebben op het nemen van technische en
      organisatorische beveiligingsmaatregelen als bedoeld in artikel 32 van de Algemene verordening gegevensbescherming.
    url: https://wetten.overheid.nl/BWBR0030605/2020-10-25#Artikel6
  - number: '7'
    text: Bij ministeriële regeling kunnen eisen worden gesteld aan de kwaliteit van meetinrichtingen.
    url: https://wetten.overheid.nl/BWBR0030605/2020-10-25#Artikel7
  - number: '8'
    text: |-
      1 Indien een ander dan een netbeheerder een meetinrichting installeert in een geval als bedoeld in
      [artikel 26ad, zesde lid][ref1], of [26ae, zevende lid, Elektriciteitswet 1998][ref2] onderscheidenlijk
      [artikel 13d, zesde lid][ref3], of [13e, zevende lid, Gaswet][ref4], draagt die ander er zorg voor dat de
      meetinrichting die wordt geïnstalleerd aansluit bij het communicatiesysteem dat door de desbetreffende netbeheerder
      wordt gehanteerd, zodat de netbeheerder geen aanpassingen hoeft te verrichten om met de meetinrichting informatie
      te kunnen uitwisselen.

      2 Een meetinrichting wordt zodanig geïnstalleerd dat het functioneren ervan veilig is voor de afnemer, de
      aangesloten applicaties en de met de meetinrichting in verbinding staande apparaten.

      3 Bij ministeriële regeling kunnen nadere regels worden gesteld over de installatie en verzegeling van
      meetinrichtingen en de administratie in verband met het vervangen, installeren of verwijderen van meetinrichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel26ad
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel26ae
      [ref3]: https://wetten.overheid.nl/BWBR0011440#Artikel13d
      [ref4]: https://wetten.overheid.nl/BWBR0011440#Artikel13e
