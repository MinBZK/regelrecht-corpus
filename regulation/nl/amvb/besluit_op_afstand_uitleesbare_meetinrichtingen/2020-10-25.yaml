        bwb_id: BWBR0011440
        artikel: 42a
  - number: '4'
    text: |-
      1 Een meetinrichting voor elektriciteit is geschikt om:

      a. het actuele vermogen in Watt te registreren, weer te geven en uit te wisselen met een applicatie als bedoeld in
      het vierde lid,

      b. de actuele meterstand in kWh voor de van het net afgenomen en verbruikte elektriciteit en voor de op het net
      ingevoede elektriciteit voor de verschillende tariefperioden te registreren, weer te geven en uit te wisselen met
      een applicatie als bedoeld in het vierde lid,

      c. ten minste elk kwartier de gegevens, bedoeld in onderdeel b, te registreren en deze gegevens ten minste
      dagelijks op afstand met de netbeheerder uit te wisselen, op zodanige wijze dat de netbeheerder de uitgewisselde
      gegevens kan lezen en gebruiken,

      d. het geldende leveringstarief voor de verschillende tariefperioden uit te wisselen met een applicatie als bedoeld
      in het vierde lid,

      e. op afstand besturings- en toepassingsprogrammatuur van de meetinrichting aan te passen,

      f. de kwaliteit van de levering van elektriciteit te registreren en uit te wisselen met een applicatie als bedoeld
      in het vierde lid,

      g. de status van de meetinrichting te registreren, weer te geven en uit te wisselen met een applicatie als bedoeld
      in het vierde lid,

      h. op afstand de gegevens, bedoeld in de onderdelen h en i, met de netbeheerder uit te wisselen, op zodanige wijze
      dat de netbeheerder de uitgewisselde gegevens kan lezen en gebruiken en

      i. fraude met, misbruik van of inbreuk op de meetinrichting of pogingen daartoe te registreren en informatie
      daarover op afstand uit te wisselen met de netbeheerder.

      2 Op het leesvenster van de meetinrichting staat duidelijk weergegeven of de functionaliteit genoemd in het eerste
      lid, onderdeel c, is ingeschakeld of uitgeschakeld.

      3 Een meetinrichting voor elektriciteit registreert bij elke uitwisseling op afstand van gegevens met de
      netbeheerder het tijdstip van de gegevensuitwisseling en of en hoeveel meterstanden daarbij zijn uitgewisseld. De
      op grond van de eerste volzin geregistreerde gegevens worden gedurende een jaar bewaard in de meetinrichting voor
      elektriciteit en zijn lokaal uitleesbaar.

      4 Een meetinrichting voor elektriciteit is geschikt om daarop applicaties aan te sluiten bij de afnemer en met die
      applicaties informatie op zodanige wijze uit te wisselen, dat die uitgewisselde informatie leesbaar en bruikbaar is
      voor degene die gerechtigd is tot het verwerken van die informatie.

      5 Een meetinrichting voor elektriciteit is in staat om informatie van een andere meetinrichting als separate
      gegevensstroom te ontvangen, te registreren, weer te geven en door te sturen op zodanige wijze dat die informatie
      leesbaar en bruikbaar is voor degene die gerechtigd is tot het verwerken van die informatie.

      6

      7 De registratie van de informatie en de uitwisseling van gegevens:

      a. tussen de elektriciteitsmeter en het communicatieonderdeel binnen een meetinrichting voor elektriciteit,

      b. tussen een meetinrichting voor elektriciteit en de applicaties, bedoeld in het vierde lid en

      c. tussen een meetinrichting voor elektriciteit en een andere meetinrichting, bedoeld in het vijfde lid,

      geschiedt volgens internationale open standaarden voor zowel het gegevensverkeer als de fysieke aansluitingen.

      8 Indien een meetinrichting voor elektriciteit beschikt over een functionaliteit waarbij op afstand de levering van
      elektriciteit kan worden onderbroken, beperkt of hervat, wordt aan de afnemers duidelijk, tijdig en controleerbaar
      gecommuniceerd of deze functionaliteit is ingeschakeld of uitgeschakeld. Indien de meetinrichting beschikt over
      een functionaliteit waarbij op het leesvenster van de meetinrichting wordt weergegeven of de in de eerste volzin
      bedoelde functionaliteit is ingeschakeld of uitgeschakeld vindt deze communicatie via het leesvenster plaats.
    url: https://wetten.overheid.nl/BWBR0030605/2020-10-25#Artikel4
  - number: '5'
    text: |-
      1 Een meetinrichting voor gas is geschikt om:

      a. de actuele meterstand in m3 per telwerk te registreren, weer te geven en uit te wisselen met een applicatie als
      bedoeld in [artikel 4, vierde lid][ref1],

      b. ten minste elk uur de gegevens, bedoeld in onderdeel a, te registreren en deze gegevens ten minste dagelijks op
      afstand met de netbeheerder uit te wisselen, op zodanige wijze dat de netbeheerder de uitgewisselde gegevens kan
      lezen en gebruiken,

      c. op afstand besturings- en toepassingsprogrammatuur van de meetinrichting aan te passen,

      d. de status van de meetinrichting te registreren en weer te geven,

      e. op afstand de gegevens als bedoeld in onderdeel e met de netbeheerder uit te wisselen, op zodanige wijze dat de
      netbeheerder de uitgewisselde gegevens kan lezen en gebruiken,

      f. inbreuk op de meetinrichting of pogingen daartoe te registreren en informatie daarover op afstand uit te
      wisselen met de netbeheerder en

      g. een lokale temperatuurcorrectie toe te passen op de geleverde hoeveelheid gas.

      2 Op het leesvenster van de meetinrichting staat duidelijk weergegeven of de functionaliteit genoemd in het eerste
      lid, onderdeel b, is ingeschakeld of uitgeschakeld.

      3 Een meetinrichting voor gas registreert bij elke uitwisseling op afstand van gegevens met de netbeheerder het
      tijdstip van de gegevensuitwisseling en of en hoeveel meterstanden daarbij zijn uitgewisseld. De op grond van
      de eerste volzin geregistreerde gegevens worden gedurende een jaar bewaard in de meetinrichting voor gas en zijn
      lokaal uitleesbaar.

      4 Het eerste lid, onderdeel d, is niet van toepassing bij een meetinrichting voor gas die wordt gebruikt bij een
      aansluiting op een net met een totale maximale capaciteit van meer dan 10 m3(n) per uur.

      5 De registratie van de informatie en de uitwisseling van gegevens:

      a. tussen de gasmeter en het communicatieonderdeel binnen een meetinrichting voor gas en

      b. tussen een meetinrichting voor gas en een meetinrichting voor elektriciteit,

      geschiedt volgens internationale open standaarden voor zowel het gegevensverkeer als de fysieke aansluitingen.

      6 Indien een meetinrichting voor gas beschikt over een functionaliteit waarbij op afstand de levering van gas
      kan worden onderbroken en hervat, wordt aan de afnemers duidelijk, tijdig en controleerbaar gecommuniceerd of
      deze functionaliteit is ingeschakeld of uitgeschakeld. Indien de meetinrichting beschikt over een functionaliteit
      waarbij op het leesvenster van de meetinrichting wordt weergegeven of de in de eerste volzin bedoelde
      functionaliteit is ingeschakeld of uitgeschakeld vindt deze communicatie via het leesvenster plaats.

      7 Een meetinrichting voor gas die is aangesloten op een meetinrichting voor elektriciteit kan voor de
      informatieverplichtingen gebruik maken van de meetinrichting voor elektriciteit.


      [ref1]: https://wetten.overheid.nl/BWBR0030605#Artikel4
