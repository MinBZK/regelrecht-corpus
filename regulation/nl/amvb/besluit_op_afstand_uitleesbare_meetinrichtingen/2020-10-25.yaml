articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. *richtlijn meetinstrumenten:* [richtlijn nr. 2004/22/EG](32004L0022) van het Europees Parlement en de Raad van
      31 maart 2004, betreffende meetinstrumenten (PbEU 2004, L 135);

      b. *elektriciteitsmeter:* een kilowattuurmeter als bedoeld in bijlage MI-003 van de richtlijn meetinstrumenten;

      c. *gasmeter:* een gasmeter als bedoeld in bijlage MI-002 van de richtlijn meetinstrumenten;

      d. *communicatieonderdeel:* onderdeel van de meetinrichting dat de uitwisseling van gegevens tussen de
      meetinrichting en de netbeheerder verzorgt;

      e. *warmtemeter:* een warmtemeter als bedoeld in bijlage MI-004 van de richtlijn meetinstrumenten;

      f. *een op afstand uitleesbare meetinrichting voor warmte:* het gehele samenstel van apparatuur als bedoeld in
      [artikel 5a][ref1] dat ten minste bestaat uit een warmtemeter;

      g. *meterdienstleverancier:* een persoon die zich bezighoudt met de levering van meterdiensten.


      [ref1]: https://wetten.overheid.nl/BWBR0030605#Artikel5a
    url: https://wetten.overheid.nl/BWBR0030605/2020-10-25#Artikel1
