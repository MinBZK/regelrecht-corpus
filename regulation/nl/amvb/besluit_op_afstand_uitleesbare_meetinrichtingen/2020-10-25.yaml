  - number: '9'
    text: |-
      1 Met meetinrichtingen voor elektriciteit als bedoeld in
      [artikel 95la, eerste lid, van de Elektriciteitswet 1998][ref1], meetinrichtingen voor gas als bedoeld in
      [artikel 42a van de Gaswet][ref2] en op afstand uitleesbare meetinrichtingen voor warmte worden gelijkgesteld
      meetinrichtingen die rechtmatig zijn vervaardigd of in de handel zijn gebracht in een andere lidstaat van de
      Europese Unie dan wel rechtmatig zijn vervaardigd in een staat, niet zijnde een lidstaat van de Europese Unie,
      die partij is bij een daartoe strekkend of mede daartoe strekkend Verdrag dat Nederland bindt, en die voldoen
      aan eisen die een beschermingsniveau bieden dat ten minste gelijkwaardig is aan het niveau dat met de nationale
      eisen wordt nagestreefd, met name op het gebied van de beveiliging tegen fraude met, misbruik van of inbreuk op de
      meetinrichting, en in wezen dezelfde functionaliteiten voorschrijven, waaronder in ieder geval de functionaliteit
      bestaande uit het op afstand kunnen uitwisselen van de actuele meterstanden.

      2 De bij of krachtens dit besluit gestelde eisen gelden voor de meetinrichting met uitzondering van de tot de
      meetinrichting behorende elektriciteitsmeter, gasmeter of warmtemeter.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95la
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel42a
