  - number: '11'
    text: |-
      1 Een meetinrichting voor elektriciteit die is geplaatst in de periode na inwerkingtreding van
      [artikel 4, eerste lid, onderdelen b tot en met i][ref1], en voor inwerkingtreding van artikel 4, eerste lid,
      onderdeel a, behoeft na inwerkingtreding van artikel 4, eerste lid, onderdeel a, niet te voldoen aan artikel 4,
      eerste lid, onderdeel a. Indien de meetinrichting op grond van de eerste volzin niet voldoet aan artikel 4, eerste
      lid, onderdeel a, is deze geschikt om:

      a. het actuele verbruik weer te geven en informatie te geven over de tijd waarin sprake was van daadwerkelijk
      verbruik en

      b. het actuele vermogen in Watt te registreren en uit te wisselen met een applicatie als bedoeld in
      [artikel 4, vierde lid][ref2],

      2 Een meetinrichting voor elektriciteit die is geplaatst in de periode na inwerkingtreding van
      [artikel 4, eerste lid, onderdelen b tot en met i][ref3], en voor inwerkingtreding van artikel 4, tweede lid,
      behoeft na inwerkingtreding van artikel 4, tweede lid, niet te voldoen aan artikel 4, tweede lid. Indien de
      meetinrichting op grond van de eerste volzin niet voldoet aan artikel 4, tweede lid, wordt aan de afnemer
      duidelijk, tijdig en controleerbaar gecommuniceerd of de functionaliteit genoemd in artikel 4, eerste lid,
      onderdeel c, is ingeschakeld of uitgeschakeld.

      3 Een meetinrichting voor elektriciteit die is geplaatst na inwerkingtreding van
      [artikel 4, eerste lid, onderdelen b tot en met i][ref4], en voor inwerkingtreding van artikel 4, derde lid,
      behoeft niet te voldoen aan artikel 4, derde lid.

      4 Een meetinrichting voor elektriciteit die is geplaatst na inwerkingtreding van
      [artikel 4, eerste lid, onderdelen b tot en met i][ref5], en voor de inwerkingtreding van artikel 4, zesde lid,
      behoeft niet te voldoen aan artikel 4, zesde lid.


