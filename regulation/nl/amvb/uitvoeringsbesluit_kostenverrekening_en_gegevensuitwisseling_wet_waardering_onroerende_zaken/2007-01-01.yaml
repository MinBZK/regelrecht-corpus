  - number: '2'
    text: |-
      1 De kosten van de Waarderingskamer komen ten laste van de afnemers. Het Rijk betaalt 25 percent, de gemeenten 50
      percent en de waterschappen 25 percent.

      2 De kosten van de waardering komen ten laste van de afnemers. Deze door de gemeenten te maken kosten worden geacht
      € 135 033 635  per jaar te bedragen, waarvan het Rijk 40 procent (€ 54 013 454 ) vergoedt, de waterschappen 15
      procent (€ 20 255 045 ) en waarbij het restant voor rekening van de gemeenten komt. De betaling van de vergoeding
      van de waterschappen aan de gemeenten loopt via het Rijk.

      3 Bij regeling van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties worden regels gesteld omtrent de
      verdeling over de individuele waterschappen van hetgeen de waterschappen ingevolge het tweede lid samen vergoeden,
      alsmede omtrent het tijdstip van de betaling aan het Rijk. Daarbij wordt de in het tweede lid bedoelde vergoeding
      van de waterschappen aan de gemeenten gedeeld door het totale aantal objecten in alle waterschappen samen en over
      de individuele waterschappen verdeeld naar rato van het aantal objecten in die individuele waterschappen. Jaarlijks
      doet de Unie van Waterschappen aan Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties een opgave van het
      aantal objecten per individueel waterschap. Daarbij kan de Unie van Waterschappen uitgaan van het aantal objecten
      in een voorgaand jaar, gecorrigeerd met een volume-opslag.

      4 De bedragen, genoemd in het tweede lid, worden bij het begin van een kalenderjaar bij regeling van Onze Minister
      aangepast vanwege een verwachte prijsmutatie met een volume-opslag. De verwachte prijsmutatie is daarbij het
      percentage zoals dat door het Centraal planbureau in het Centraal Economisch Plan is gepubliceerd als «prijsmutatie
      netto materiële overheidsconsumptie» voor het kalenderjaar. De volume-opslag wordt gesteld op 0,75 procent.
    url: https://wetten.overheid.nl/BWBR0007230/2007-01-01#Artikel2
  - number: 2a
    text: |-
      1 De in [artikel 2, tweede lid][ref1], vermelde jaarlijkse vergoeding van het Rijk en de waterschappen ter zake
      van de kosten van de waardering wordt aan de individuele gemeenten uitbetaald. Bij regeling van Onze Minister van
      Binnenlandse Zaken en Koninkrijksrelaties worden regels gesteld omtrent de wijze van verdeling over de individuele
      gemeenten van deze vergoeding en omtrent de tijdstippen van uitbetaling van deze vergoeding aan een individuele
      gemeente.

      2 Bij de verdeling van de vergoeding over de individuele gemeenten wordt rekening gehouden met:

      a. een basisbedrag voor elke gemeente;

      b. een vergoeding per object, waarbij onderscheid wordt gemaakt naar woningen, niet-woningen en adressen in
      buitengebieden;

      c. een inhouding van een bedrag voor de Vereniging van Nederlandse Gemeenten ter vergoeding van kosten die
      samenhangen met verbeteringen op het gebied van kwaliteit en kostenbeheersing bij de uitvoering van de wet.

      3 Bij de bepaling van de tijdstippen van uitbetaling van de vergoeding aan een individuele gemeente wordt rekening
      gehouden met de mate waarin door de desbetreffende gemeente is voldaan aan de verplichting tot het leveren van
      verwerkbare gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0007230#Artikel2
    url: https://wetten.overheid.nl/BWBR0007230/2007-01-01#Artikel2a
