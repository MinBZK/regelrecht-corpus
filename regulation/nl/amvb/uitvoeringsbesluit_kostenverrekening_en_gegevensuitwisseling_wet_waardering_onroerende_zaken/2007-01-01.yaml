    Gelet op de artikelen 3 en 39 van de Wet waardering onroerende zaken;

    De Raad van State gehoord (advies van 16 januari 1995, nr. W 06.94.0709);

    Gezien het nader rapport van de Staatssecretaris van Financiën van 2 februari 1995, nr. WV 95/40U, Directoraat-
    Generaal voor Fiscale Zaken, Directie Wetgeving Verbruiksbelastingen, uitgebracht mede namens de Staatssecretaris
