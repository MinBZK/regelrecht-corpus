  - number: '4'
    text: |-
      Onder de kosten van de waardering, bedoeld in [artikel 2, tweede lid][ref1], worden verstaan de kosten verbonden
      aan:

      1°. het verrichten van algemene werkzaamheden ten behoeve van de waardebepaling;

      2°. het verzamelen van gegevens ten behoeve van de waardebepaling alsmede aan het bijhouden daarvan;

      3°. het uitvoeren van de waardebepaling;

      4°. het opmaken en verzenden van de beschikkingen, bedoeld in de [artikelen 22][ref2], [26][ref3], [27][ref4],
      [28][ref5] en [29 van de wet][ref6];

      5°. het behandelen van bezwaar- en beroepschriften tegen de beschikkingen, bedoeld in de [artikelen 22][ref7],
      [26][ref8], [27][ref9] en [28 van de wet][ref10].


