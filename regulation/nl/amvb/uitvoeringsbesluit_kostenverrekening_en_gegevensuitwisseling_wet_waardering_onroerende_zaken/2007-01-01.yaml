  - number: '3'
    text: |-
      Onder de kosten van de Waarderingskamer, bedoeld in [artikel 2, eerste lid][ref1], worden verstaan de kosten
      verbonden aan de uitoefening van toezicht op de waardering, de kosten verbonden aan de geschillenbeslechting,
      bedoeld in [artikel 11][ref2] van de wet, de kosten verbonden aan advisering van de Waarderingskamer door derden,
      alsmede de huisvestings- en personele kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0007230#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007230#Artikel11
    url: https://wetten.overheid.nl/BWBR0007230/2007-01-01#Artikel3
