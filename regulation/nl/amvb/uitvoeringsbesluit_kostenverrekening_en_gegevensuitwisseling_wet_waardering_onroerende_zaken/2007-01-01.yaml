articles:
  - number: '1'
    text: |-
      1 Dit besluit geeft uitvoering aan de [artikelen 3][ref1] en [39 van de Wet waardering onroerende zaken][ref2].

      2 In dit besluit wordt verstaan onder:

      a. wet: [Wet waardering onroerende zaken][ref3];

      b. waardering: waardebepaling en waardevaststelling van onroerende zaken op de voet van de wet;

      c. afnemers: de overheden die gebruik maken van de ingevolge de wet vastgestelde waarden ten behoeve van de heffing
      van belastingen;

      d. Onze Minister: de Minister van Financiën;

      e. verwerkbare gegevens: gegevens voor de afnemers die voldoen aan de door de Waarderingskamer vastgestelde
      kwaliteitseisen.


      [ref1]: https://wetten.overheid.nl/BWBR0007119#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0007119#Artikel39
      [ref3]: https://wetten.overheid.nl/BWBR0007119
