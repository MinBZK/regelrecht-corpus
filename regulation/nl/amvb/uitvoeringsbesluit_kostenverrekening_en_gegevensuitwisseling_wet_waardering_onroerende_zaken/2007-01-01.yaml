  - number: '5'
    text: |-
      1 De kosten van de Waarderingskamer worden aan de hand van de door haar vastgestelde begroting als bedoeld in
      [artikel 12][ref1] van de wet, in januari van het jaar waarop zij betrekking hebben, in voorlopige rekening
      gebracht aan de afnemers.

      2 De afnemers voldoen hun aandeel in de begrote kosten binnen vier weken.

      3 Na de goedkeuring door Onze Minister van het verslag van de Waarderingskamer als bedoeld in [artikel 13][ref2]
      van de wet, vindt de definitieve kostenverrekening plaats.


      [ref1]: https://wetten.overheid.nl/BWBR0007230#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0007230#Artikel13
