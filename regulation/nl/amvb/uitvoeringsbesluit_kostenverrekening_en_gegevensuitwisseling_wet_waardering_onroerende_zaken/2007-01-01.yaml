  - number: '7'
    text: |-
      Ten behoeve van de heffing van belastingen door de afnemers worden door het college van burgemeester en wethouders
      ten minste de in de bijlage vermelde gegevens geregistreerd met betrekking tot:

      a. onroerende zaken die bij de waardebepaling op grond van de wet in aanmerking worden genomen;

      b. onroerende zaken waarvan de waarde op grond van [artikel 120, derde lid, van de Waterschapswet][ref1] bij de
      bepaling van de heffingsmaatstaf voor de omslagen ter zake van gebouwde onroerende zaken buiten aanmerking worden
      gelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel120
    url: https://wetten.overheid.nl/BWBR0007230/2007-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '120'
  - number: '8'
    text: |-
      1 Het college van burgemeester en wethouders of de in [artikel 1, tweede lid, van de wet][ref1] bedoelde
      gemeenteambtenaar levert de in [artikel 7][ref2] bedoelde gegevens aan de afnemers.

      2 De levering van gegevens aan de afnemers vindt plaats:

      a. ter zake van een beschikking als bedoeld in de [artikelen 22][ref3] en [26 van de wet][ref4]: binnen acht weken
      na de aanvang van het eerste kalenderjaar waarvoor die beschikking geldt;

      b. ter zake van een beschikking als bedoeld in de [artikelen 27][ref5], [28][ref6] en [29 van de wet][ref7]: binnen
      vier weken na de vaststelling van de beschikking, met dien verstande dat gegevens betreffende een beschikking die
      is verminderd krachtens een beslissing op een bezwaarschrift of een rechterlijke uitspraak, worden geleverd binnen
      twee weken nadat die uitspraak onherroepelijk is komen vast te staan.

      3 Het college van burgemeester en wethouders of de in [artikel 1, tweede lid, van de wet][ref8] bedoelde
      gemeenteambtenaar stelt de afnemers binnen vier weken op de hoogte van feiten of omstandigheden met betrekking
      tot een beschikking, die voor de afnemers van belang zijn in het kader van de heffing en de invordering van hun
      belastingen.


