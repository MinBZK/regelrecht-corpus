    url: https://wetten.overheid.nl/BWBR0007230/2026-01-01#Artikel1
  - number: 1.2.c
    text: 'afnemers: bestuursorganen die de waardegegevens gebruiken ten behoeve van de heffing van belastingen;'
    url: https://wetten.overheid.nl/BWBR0007230/2026-01-01#Artikel1
  - number: 1.2.d
    text: 'Onze Minister: de Minister van Financiën;'
    url: https://wetten.overheid.nl/BWBR0007230/2026-01-01#Artikel1
  - number: 1.2.e
    text: 'belastingen: belastingen geheven door het Rijk, de gemeenten en de waterschappen;'
    url: https://wetten.overheid.nl/BWBR0007230/2026-01-01#Artikel1
  - number: 1.2.f
    text: |-
      Dienst: Dienst voor het kadaster en de openbare registers als genoemd in
      [artikel 2 van de Organisatiewet Kadaster][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006463#Artikel2
    url: https://wetten.overheid.nl/BWBR0007230/2026-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006463
        artikel: '2'
  - number: 1.2.g
    text: |-
      landelijke voorziening WOZ: een geautomatiseerde voorziening die gehouden wordt door de Dienst, waarin de gegevens
      uit de door de gemeenten gehouden basisregistratie WOZ zijn opgenomen.
    url: https://wetten.overheid.nl/BWBR0007230/2026-01-01#Artikel1
  - number: '2.1'
    text: |-
      De kosten van de Waarderingskamer komen ten laste van de afnemers. Het Rijk betaalt 25 percent, de gemeenten 50
      percent en de waterschappen 25 percent.
    url: https://wetten.overheid.nl/BWBR0007230/2026-01-01#Artikel2
  - number: '2.2'
    text: De kosten van de waardering komen ten laste van de afnemers.
    url: https://wetten.overheid.nl/BWBR0007230/2026-01-01#Artikel2
  - number: '2.3'
    text: |-
      De waterschappen betalen aan het Rijk een vergoeding van € 21.810.013 voor het aandeel van de waterschappen in de
      kosten van de waardering.
    url: https://wetten.overheid.nl/BWBR0007230/2026-01-01#Artikel2
  - number: '2.4'
    text: |-
      Bij regeling van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties worden regels gesteld omtrent de
      verdeling over de individuele waterschappen van hetgeen de waterschappen samen aan het Rijk vergoeden voor het
      aandeel van de waterschappen in de kosten van de waardering, alsmede omtrent het tijdstip van de betaling aan
      het Rijk. Daarbij wordt de in het derde lid bedoelde vergoeding van de waterschappen gedeeld door het totale
      aantal objecten in alle waterschappen samen en over de individuele waterschappen verdeeld naar rato van het
      aantal objecten in die individuele waterschappen. Jaarlijks doet de Unie van Waterschappen aan Onze Minister
      van Binnenlandse Zaken en Koninkrijksrelaties een opgave van het aantal objecten per individueel waterschap.
      Daarbij kan de Unie van Waterschappen uitgaan van het aantal objecten in een voorgaand jaar, gecorrigeerd met een
      volumeopslag.
    url: https://wetten.overheid.nl/BWBR0007230/2026-01-01#Artikel2
  - number: '2.5'
    text: |-
      De gemeenten betalen aan de Waarderingskamer een vergoeding voor het aandeel van de gemeenten in de kosten van
      de Waarderingskamer.
    url: https://wetten.overheid.nl/BWBR0007230/2026-01-01#Artikel2
  - number: '2.6'
    text: |-
      De Waarderingskamer stelt regels omtrent de verdeling over de gemeenten van de vergoeding voor het aandeel van de
      gemeenten in de kosten van de Waarderingskamer.
    url: https://wetten.overheid.nl/BWBR0007230/2026-01-01#Artikel2
  - number: '3'
    text: |-
      Onder de kosten van de Waarderingskamer, bedoeld in [artikel 2, eerste lid][ref1], worden verstaan de kosten
      verbonden aan de uitoefening van toezicht op de waardering, de kosten verbonden aan de uitoefening van toezicht
      op de uitvoering van de basisregistratie waarde onroerende zaken (basisregistratie WOZ), de kosten verbonden aan
      de geschillenbeslechting, bedoeld in [artikel 11][ref2] van de wet, de kosten verbonden aan advisering van de
      Waarderingskamer door derden, alsmede de huisvestings- en personele kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0007230#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007230#Artikel11
    url: https://wetten.overheid.nl/BWBR0007230/2026-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0007230
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
