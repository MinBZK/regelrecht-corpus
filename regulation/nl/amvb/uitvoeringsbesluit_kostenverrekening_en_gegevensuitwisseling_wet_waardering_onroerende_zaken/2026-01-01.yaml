  - number: '11.3'
    text: |-
      Als derden als bedoeld in [artikel 40a van de wet][ref1], waaraan het waardegegeven en
      de daarbij behorende temporele en meta-kenmerken van een onroerende zaak die in hoofdzaak
      tot woning dient, kan worden verstrekt, worden mede aangewezen instellingen als bedoeld in
      [artikel 1, eerste lid, van de Wet ter voorkoming van witwassen en financieren van terrorisme][ref2], indien
      deze om het waardegegeven en de daarbij behorende temporele en meta-kenmerken verzoeken ten behoeve van het
      verrichten van cliëntenonderzoek of melden van verrichte of voorgenomen ongebruikelijke transacties, bedoeld in
      [artikel 2a, eerste lid, van die wet][ref3].


