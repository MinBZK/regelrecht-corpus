        artikel: '11'
        hoofdstuk: '4'
  - number: '4'
    text: |-
      Onder de kosten van de waardering, bedoeld in [artikel 2, tweede lid][ref1], worden verstaan de kosten verbonden
      aan:


      [ref1]: https://wetten.overheid.nl/BWBR0007230#Artikel2
    url: https://wetten.overheid.nl/BWBR0007230/2026-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0007230
        artikel: '2'
        hoofdstuk: '2'
  - number: 4.1°
    text: het verrichten van algemene werkzaamheden ten behoeve van de waardebepaling;
    url: https://wetten.overheid.nl/BWBR0007230/2026-01-01#Artikel4
  - number: 4.2°
    text: het verzamelen van gegevens ten behoeve van de waardebepaling alsmede aan het bijhouden daarvan;
    url: https://wetten.overheid.nl/BWBR0007230/2026-01-01#Artikel4
  - number: 4.3°
    text: het uitvoeren van de waardebepaling;
    url: https://wetten.overheid.nl/BWBR0007230/2026-01-01#Artikel4
  - number: 4.4°
    text: |-
      het opmaken en verzenden van de beschikkingen, bedoeld in de [artikelen 22][ref1], [26][ref2], [27][ref3],
      [28][ref4] en [29 van de wet][ref5];


      [ref1]: https://wetten.overheid.nl/BWBR0007119#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0007119#Artikel26
      [ref3]: https://wetten.overheid.nl/BWBR0007119#Artikel27
      [ref4]: https://wetten.overheid.nl/BWBR0007119#Artikel28
      [ref5]: https://wetten.overheid.nl/BWBR0007119#Artikel29
    url: https://wetten.overheid.nl/BWBR0007230/2026-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0007119
        artikel: '22'
      - id: ref2
        bwb_id: BWBR0007119
        artikel: '26'
      - id: ref3
        bwb_id: BWBR0007119
        artikel: '27'
      - id: ref4
        bwb_id: BWBR0007119
        artikel: '28'
      - id: ref5
        bwb_id: BWBR0007119
        artikel: '29'
  - number: 4.5°
    text: |-
      het behandelen van bezwaar- en beroepschriften tegen de beschikkingen, bedoeld in de [artikelen 22][ref1],
      [26][ref2], [27][ref3] en [28 van de wet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0007119#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0007119#Artikel26
      [ref3]: https://wetten.overheid.nl/BWBR0007119#Artikel27
      [ref4]: https://wetten.overheid.nl/BWBR0007119#Artikel28
    url: https://wetten.overheid.nl/BWBR0007230/2026-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0007119
        artikel: '22'
      - id: ref2
        bwb_id: BWBR0007119
        artikel: '26'
      - id: ref3
        bwb_id: BWBR0007119
        artikel: '27'
      - id: ref4
        bwb_id: BWBR0007119
        artikel: '28'
  - number: '5.1'
    text: |-
      De kosten van de Waarderingskamer worden aan de hand van de door haar vastgestelde begroting als bedoeld in
      [artikel 26 van de Kaderwet zelfstandige bestuursorganen][ref1], in januari van het jaar waarop zij betrekking
      hebben, in voorlopige rekening gebracht aan de afnemers.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel26
    url: https://wetten.overheid.nl/BWBR0007230/2026-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '26'
  - number: '5.2'
    text: De afnemers voldoen hun aandeel in de begrote kosten binnen vier weken.
    url: https://wetten.overheid.nl/BWBR0007230/2026-01-01#Artikel5
  - number: '5.3'
    text: |-
      Na de goedkeuring door Onze Minister van het verslag van de Waarderingskamer als bedoeld in
      [artikel 18 van de Kaderwet zelfstandige bestuursorganen][ref1], vindt de definitieve kostenverrekening plaats met
      de kosten van het jaar volgend op het jaar waarover dat verslag is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel18
    url: https://wetten.overheid.nl/BWBR0007230/2026-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '18'
  - number: '6.1'
    text: |-
      De kosten van de landelijke voorziening WOZ komen ten laste van de afnemers. Het Rijk betaalt 40 percent, de
      gemeenten 45 percent en de waterschappen 15 percent.
    url: https://wetten.overheid.nl/BWBR0007230/2026-01-01#Artikel6
  - number: '6.2'
    text: |-
      De Waarderingskamer draagt zorg voor de verrekening van de vergoeding van de kosten van de landelijke voorziening
      WOZ door de afnemers met de Dienst.
    url: https://wetten.overheid.nl/BWBR0007230/2026-01-01#Artikel6
  - number: '6.3'
    text: |-
      De begroting voor de kosten van de landelijke voorziening WOZ wordt vastgesteld overeenkomstig de begroting van
      de Waarderingskamer.
    url: https://wetten.overheid.nl/BWBR0007230/2026-01-01#Artikel6
  - number: '6.4'
    text: |-
      De waterschappen betalen aan het Rijk jaarlijks een vergoeding voor het aandeel van de waterschappen in
      de kosten van de landelijke voorziening WOZ. Het Rijk zorgt voor de betaling aan de Waarderingskamer.
      [Artikel 2, vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007230#Artikel2
    url: https://wetten.overheid.nl/BWBR0007230/2026-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0007230
        artikel: '2'
        hoofdstuk: '2'
  - number: '6.5'
    text: |-
      Het Rijk voldoet zijn aandeel in de begrote kosten binnen vier weken na vaststelling van de begroting aan de
      Waarderingskamer.
    url: https://wetten.overheid.nl/BWBR0007230/2026-01-01#Artikel6
  - number: '6.6'
    text: |-
      Na de goedkeuring door Onze Minister van de jaarrekening van de landelijke voorziening vindt de definitieve
      kostenverrekening plaats met de kosten van het jaar volgend op het jaar waarover die jaarrekening is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0007230/2026-01-01#Artikel6
  - number: '6.7'
    text: |-
      De gemeenten betalen aan de Waarderingskamer een vergoeding voor het aandeel van de gemeenten in de kosten van de
      landelijke voorziening WOZ. De [artikelen 2, zesde lid][ref1], en [5, tweede lid][ref2], zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007230#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007230#Artikel5
    url: https://wetten.overheid.nl/BWBR0007230/2026-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0007230
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0007230
        artikel: '5'
        hoofdstuk: '2'
  - number: '7.1'
    text: |-
      Ten behoeve van de heffing van belastingen door de afnemers worden door het college van burgemeester en wethouders
      ten minste de in de bijlage vermelde gegevens geregistreerd met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0007230/2026-01-01#Artikel7
  - number: 7.1.a
    text: onroerende zaken die bij de waardebepaling op grond van de wet in aanmerking worden genomen;
    url: https://wetten.overheid.nl/BWBR0007230/2026-01-01#Artikel7
  - number: 7.1.b
    text: |-
      onroerende zaken waarvan de waarde op grond van [artikel 121, derde lid, van de Waterschapswet][ref1] bij de
      bepaling van de heffingsmaatstaf buiten aanmerking wordt gelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel121
    url: https://wetten.overheid.nl/BWBR0007230/2026-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '121'
  - number: '7.2'
    text: |-
      De authentieke gegevens uit andere basisregistraties die worden opgenomen in de basisregistratie WOZ, bedoeld in
      [artikel 37a, tweede lid, van de wet][ref1], zijn de in de bijlage genoemde gegevens met de codenummers 10.20,
      11.10, 11.20, 11.30, 11.40, 11.70, 51.10, 51.20, 51.30, 51.40, 51.50, 41.20, 01.10, 02.30, 04.05, 03.10, 02.31,
      02.41, 08.10 en 08.11.


      [ref1]: https://wetten.overheid.nl/BWBR0007119#Artikel37a
    url: https://wetten.overheid.nl/BWBR0007230/2026-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0007119
        artikel: 37a
  - number: '8.1'
    text: |-
      Het college van burgemeester en wethouders levert de in [artikel 7][ref1] bedoelde gegevens aan de Dienst ten
      behoeve van de opname in de landelijke voorziening WOZ.


      [ref1]: https://wetten.overheid.nl/BWBR0007230#Artikel7
    url: https://wetten.overheid.nl/BWBR0007230/2026-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0007230
        artikel: '7'
        hoofdstuk: '3'
  - number: '8.2'
    text: 'De levering van gegevens aan de Dienst vindt plaats:'
    url: https://wetten.overheid.nl/BWBR0007230/2026-01-01#Artikel8
  - number: 8.2.a
    text: |-
      ter zake van een beschikking als bedoeld in de [artikelen 22][ref1] en [26 van de wet][ref2]: binnen acht weken na
      de aanvang van het eerste kalenderjaar waarvoor die beschikking geldt;


      [ref1]: https://wetten.overheid.nl/BWBR0007119#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0007119#Artikel26
    url: https://wetten.overheid.nl/BWBR0007230/2026-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0007119
        artikel: '22'
      - id: ref2
        bwb_id: BWBR0007119
        artikel: '26'
  - number: 8.2.b
    text: |-
      ter zake van een beschikking als bedoeld in de [artikelen 27][ref1], [28][ref2] en [29 van de wet][ref3]: binnen
      vier weken na de vaststelling van de beschikking, met dien verstande dat gegevens betreffende een beschikking die
      is verminderd krachtens een beslissing op een bezwaarschrift of een rechterlijke uitspraak, worden geleverd binnen
      twee weken nadat die uitspraak onherroepelijk is komen vast te staan.


      [ref1]: https://wetten.overheid.nl/BWBR0007119#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0007119#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0007119#Artikel29
    url: https://wetten.overheid.nl/BWBR0007230/2026-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0007119
        artikel: '27'
      - id: ref2
        bwb_id: BWBR0007119
        artikel: '28'
      - id: ref3
        bwb_id: BWBR0007119
        artikel: '29'
  - number: '8.3'
    text: |-
      Het college van burgemeester en wethouders stelt de Dienst onverwijld op de hoogte van feiten of omstandigheden met
      betrekking tot een beschikking die voor de afnemers van belang zijn in het kader van de heffing en invordering van
      hun belastingen.
    url: https://wetten.overheid.nl/BWBR0007230/2026-01-01#Artikel8
  - number: '8.4'
    text: |-
      De Dienst draagt onverwijld zorg voor de levering van de gegevens, feiten en omstandigheden, bedoeld in dit
      artikel, aan de afnemers.
    url: https://wetten.overheid.nl/BWBR0007230/2026-01-01#Artikel8
  - number: '9'
    text: |-
      De specificaties voor de aanlevering van gegevens door het college van burgemeester en wethouders aan de Dienst
      worden door de Waarderingskamer vastgesteld in overleg met de afnemers en de Dienst en gepubliceerd door de
      Waarderingskamer.
    url: https://wetten.overheid.nl/BWBR0007230/2026-01-01#Artikel9
  - number: 9a.1
    text: De Dienst beheert de landelijke voorziening WOZ in overleg met de afnemers.
    url: https://wetten.overheid.nl/BWBR0007230/2026-01-01#Artikel9a
  - number: 9a.2
    text: Het overleg met de afnemers vindt plaats in de Waarderingskamer.
    url: https://wetten.overheid.nl/BWBR0007230/2026-01-01#Artikel9a
  - number: '10.1'
    text: |-
      Als bestuursorgaan dat bevoegd is tot het gebruik van het waardegegeven en de daarbij behorende temporele en meta-
      kenmerken op grond van [artikel 37h van de wet][ref1] worden aangewezen:


      [ref1]: https://wetten.overheid.nl/BWBR0007119#Artikel37h
    url: https://wetten.overheid.nl/BWBR0007230/2026-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0007119
        artikel: 37h
  - number: 10.1.a
    text: |-
      de notaris in het kader van de bestrijding van vastgoedcriminaliteit ten behoeve van het vergelijken met een
      taxatiewaarde, dan wel het vergelijken met een aan- of verkoopprijs;
    url: https://wetten.overheid.nl/BWBR0007230/2026-01-01#Artikel10
  - number: 10.1.b
    text: |-
      het Centraal bureau voor de statistiek ten behoeve van statistische doeleinden als bedoeld in
      [artikel 37 van de Wet op het Centraal bureau voor de statistiek][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0015926#Artikel37
    url: https://wetten.overheid.nl/BWBR0007230/2026-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0015926
        artikel: '37'
  - number: 10.1.c
    text: |-
      het Bureau Ontnemingswetgeving van het Openbaar Ministerie ten behoeve van het zicht krijgen op waarden van
      inbeslaggenomen onroerende zaken;
    url: https://wetten.overheid.nl/BWBR0007230/2026-01-01#Artikel10
  - number: 10.1.d
    text: |-
      de Minister van Volkshuisvesting en Ruimtelijke Ordening ten behoeve van de
