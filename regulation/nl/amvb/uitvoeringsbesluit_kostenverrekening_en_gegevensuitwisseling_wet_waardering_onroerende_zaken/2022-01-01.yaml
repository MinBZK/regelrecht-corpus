  - number: '7'
    text: |-
      1 Ten behoeve van de heffing van belastingen door de afnemers worden door het college van burgemeester en
      wethouders ten minste de in de bijlage vermelde gegevens geregistreerd met betrekking tot:

      a. onroerende zaken die bij de waardebepaling op grond van de wet in aanmerking worden genomen;

      b. onroerende zaken waarvan de waarde op grond van [artikel 121, tweede lid, van de Waterschapswet][ref1] bij de
      bepaling van de heffingsmaatstaf buiten aanmerking wordt gelaten.

      2 De authentieke gegevens uit andere basisregistraties die worden opgenomen in de basisregistratie WOZ, bedoeld
      in [artikel 37a, tweede lid, van de wet][ref2], zijn de in de bijlage genoemde gegevens met de codenummers 10.20,
      11.10, 11.20, 11.30, 11.40, 11.70, 51.10, 51.20, 51.30, 51.40, 51.50, 41.20, 01.10, 02.30, 04.05, 03.10, 02.31,
      02.41, 08.10 en 08.11.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel121
      [ref2]: https://wetten.overheid.nl/BWBR0007119#Artikel37a
    url: https://wetten.overheid.nl/BWBR0007230/2022-01-01#Artikel7
