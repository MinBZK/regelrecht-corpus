articles:
  - number: '1'
    text: |-
      1 Dit besluit geeft uitvoering aan de [artikelen 3][ref1], [37a][ref2], [37h][ref3], [39][ref4] en
      [40a van de Wet waardering onroerende zaken][ref5].

      2 In dit besluit wordt verstaan onder:

      a. wet: [Wet waardering onroerende zaken][ref6];

      b. waardering: waardebepaling en waardevaststelling van onroerende zaken op de voet van de wet;

      c. afnemers: bestuursorganen die de waardegegevens gebruiken ten behoeve van de heffing van belastingen;

      d. Onze Minister: de Minister van Financiën;

      e. belastingen: belastingen geheven door het Rijk, de gemeenten en de waterschappen;

      f. Dienst: Dienst voor het kadaster en de openbare registers als genoemd in
      [artikel 2 van de Organisatiewet Kadaster][ref7];

      g. landelijke voorziening WOZ: een geautomatiseerde voorziening die gehouden wordt door de Dienst, waarin de
      gegevens uit de door de gemeenten gehouden basisregistratie WOZ zijn opgenomen.


