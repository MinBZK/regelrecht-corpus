  - number: '8'
    text: |-
      1 Het college van burgemeester en wethouders levert de in [artikel 7][ref1] bedoelde gegevens aan de Dienst ten
      behoeve van de opname in de landelijke voorziening WOZ.

      2 De levering van gegevens aan de Dienst vindt plaats:

      a. ter zake van een beschikking als bedoeld in de [artikelen 22][ref2] en [26 van de wet][ref3]: binnen acht weken
      na de aanvang van het eerste kalenderjaar waarvoor die beschikking geldt;

      b. ter zake van een beschikking als bedoeld in de [artikelen 27][ref4], [28][ref5] en [29 van de wet][ref6]: binnen
      vier weken na de vaststelling van de beschikking, met dien verstande dat gegevens betreffende een beschikking die
      is verminderd krachtens een beslissing op een bezwaarschrift of een rechterlijke uitspraak, worden geleverd binnen
      twee weken nadat die uitspraak onherroepelijk is komen vast te staan.

      3 Het college van burgemeester en wethouders stelt de Dienst onverwijld op de hoogte van feiten of omstandigheden
      met betrekking tot een beschikking die voor de afnemers van belang zijn in het kader van de heffing en invordering
      van hun belastingen.

      4 De Dienst draagt onverwijld zorg voor de levering van de gegevens, feiten en omstandigheden, bedoeld in dit
      artikel, aan de afnemers.


      [ref1]: https://wetten.overheid.nl/BWBR0007230#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007119#Artikel22
