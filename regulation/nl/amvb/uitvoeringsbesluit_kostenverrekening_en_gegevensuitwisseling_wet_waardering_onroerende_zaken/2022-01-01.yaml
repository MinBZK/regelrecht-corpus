      De specificaties voor de aanlevering van gegevens door het college van burgemeester en wethouders aan de Dienst
      worden door de Waarderingskamer vastgesteld in overleg met de afnemers en de Dienst en gepubliceerd door de
      Waarderingskamer.
    url: https://wetten.overheid.nl/BWBR0007230/2022-01-01#Artikel9
  - number: 9a
    text: |-
      1 De Dienst beheert de landelijke voorziening WOZ in overleg met de afnemers.

      2 Het overleg met de afnemers vindt plaats in de Waarderingskamer.
    url: https://wetten.overheid.nl/BWBR0007230/2022-01-01#Artikel9a
  - number: '10'
    text: |-
      1 Als bestuursorgaan dat bevoegd is tot het gebruik van het waardegegeven en de daarbij behorende temporele en
      meta-kenmerken op grond van [artikel 37h van de wet][ref1] worden aangewezen:

      a. de notaris in het kader van de bestrijding van vastgoedcriminaliteit ten behoeve van het vergelijken met een
      taxatiewaarde, dan wel het vergelijken met een aan- of verkoopprijs;

      b. het Centraal bureau voor de statistiek ten behoeve van statistische doeleinden als bedoeld in
      [artikel 37 van de Wet op het Centraal bureau voor de statistiek][ref2];

      c. het Bureau Ontnemingswetgeving van het Openbaar Ministerie ten behoeve van het zicht krijgen op waarden van
      inbeslaggenomen onroerende zaken;

      d. de Minister voor Wonen en Rijksdienst ten behoeve van de uitoefening van zijn wettelijke taken, bedoeld in het
      bepaalde bij en krachtens de [artikelen 27, eerste lid, aanhef en onderdeel a, en tweede, derde en vijfde lid][ref3],
      [49, zesde lid][ref4], en [58, tweede lid, van de Woningwet][ref5], en
      [artikel II, twaalfde lid, van de Herzieningswet toegelaten instellingen volkshuisvesting][ref6];

      e. Staatsbosbeheer ten behoeve van de vaststelling van de waarde van onroerende zaken die in erfpacht of opstal
      zijn of worden uitgegeven;

      f. de huurcommissie ten behoeve van het vaststellen van het aantal woningwaarderingspunten van een woning;

      g. de Rijksdienst voor Ondernemend Nederland ten behoeve van een statistische analyse van de variabelen die het
      energielabel van huurwoningen voorspellen;

      h. het Instituut Mijnbouwschade Groningen ten behoeve van de vaststelling van de waarde van onroerende zaken in de
      provincies Groningen, Drenthe en Friesland voor zover noodzakelijk voor de uitoefening van zijn wettelijke taken,
      bedoeld in [artikel 2 van de Tijdelijke wet Groningen][ref7];

      i. de Gedeputeerde Staten van de provincie Zuid-Holland ten behoeve van de vaststelling van de waarde van
      woningen in die provincie voor zover noodzakelijk voor de uitoefening van de Subsidieregeling lokale initiatieven
      energietransitie Zuid-Holland 2017;

      j. de Minister van Binnenlandse Zaken en Koninkrijksrelaties ten behoeve van de behandeling en betaling van de
      zakelijke lasten en gebruikerslasten met betrekking tot onroerende zaken waarvan de Staat eigenaar of gebruiker is.

      2 Als bestuursorgaan dat bevoegd is tot het gebruik van de temporele en meta-
      kenmerken behorend bij het waardegegeven op grond van [artikel 37h van de wet][ref8]
      wordt aangewezen de Autoriteit Consument en Markt ten behoeve van het vaststellen van een
      aansluiting als bedoeld in [artikel 1, eerste lid, onderdeel m, van de Gaswet][ref9] en
      [artikel 1, eerste lid, onderdeel b, van de Elektriciteitswet 1998][ref10].


