  - number: '6'
    text: |-
      1 De kosten van de landelijke voorziening WOZ komen ten laste van de afnemers. Het Rijk betaalt 40 percent, de
      gemeenten 45 percent en de waterschappen 15 percent.

      2 De Waarderingskamer draagt zorg voor de verrekening van de vergoeding van de kosten van de landelijke voorziening
      WOZ door de afnemers met de Dienst.

      3 De begroting voor de kosten van de landelijke voorziening WOZ wordt vastgesteld overeenkomstig de begroting van
      de Waarderingskamer.

      4 De waterschappen betalen aan het Rijk jaarlijks een vergoeding voor het aandeel van de waterschappen
      in de kosten van de landelijke voorziening WOZ. Het Rijk zorgt voor de betaling aan de Waarderingskamer.
      [Artikel 2, vierde lid][ref1], is van overeenkomstige toepassing.

      5 Het Rijk voldoet zijn aandeel in de begrote kosten binnen vier weken na vaststelling van de begroting aan de
      Waarderingskamer.

      6 Na de goedkeuring door Onze Minister van de jaarrekening van de landelijke voorziening vindt de definitieve
      kostenverrekening plaats met de kosten van het jaar volgend op het jaar waarover die jaarrekening is vastgesteld.

      7 De gemeenten betalen aan de Waarderingskamer een vergoeding voor het aandeel van de gemeenten in de kosten van de
      landelijke voorziening WOZ. De [artikelen 2, zesde lid][ref2], en [5, tweede lid][ref3], zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007230#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007230#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0007230#Artikel5
