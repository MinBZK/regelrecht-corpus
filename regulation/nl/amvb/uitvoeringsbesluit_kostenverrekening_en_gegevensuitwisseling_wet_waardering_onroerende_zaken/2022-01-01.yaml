  - number: '2'
    text: |-
      1 De kosten van de Waarderingskamer komen ten laste van de afnemers. Het Rijk betaalt 25 percent, de gemeenten 50
      percent en de waterschappen 25 percent.

      2 De kosten van de waardering komen ten laste van de afnemers.

      3 De waterschappen betalen aan het Rijk een vergoeding van € 21.810.013 voor het aandeel van de waterschappen in de
      kosten van de waardering.

      4 Bij regeling van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties worden regels gesteld omtrent de
      verdeling over de individuele waterschappen van hetgeen de waterschappen samen aan het Rijk vergoeden voor het
      aandeel van de waterschappen in de kosten van de waardering, alsmede omtrent het tijdstip van de betaling aan
      het Rijk. Daarbij wordt de in het derde lid bedoelde vergoeding van de waterschappen gedeeld door het totale
      aantal objecten in alle waterschappen samen en over de individuele waterschappen verdeeld naar rato van het
      aantal objecten in die individuele waterschappen. Jaarlijks doet de Unie van Waterschappen aan Onze Minister
      van Binnenlandse Zaken en Koninkrijksrelaties een opgave van het aantal objecten per individueel waterschap.
      Daarbij kan de Unie van Waterschappen uitgaan van het aantal objecten in een voorgaand jaar, gecorrigeerd met een
      volumeopslag.

      5 De gemeenten betalen aan de Waarderingskamer een vergoeding voor het aandeel van de gemeenten in de kosten van
      de Waarderingskamer.

      6 De Waarderingskamer stelt regels omtrent de verdeling over de gemeenten van de vergoeding voor het aandeel van de
      gemeenten in de kosten van de Waarderingskamer.
    url: https://wetten.overheid.nl/BWBR0007230/2022-01-01#Artikel2
  - number: '3'
    text: |-
      Onder de kosten van de Waarderingskamer, bedoeld in [artikel 2, eerste lid][ref1], worden verstaan de kosten
      verbonden aan de uitoefening van toezicht op de waardering, de kosten verbonden aan de uitoefening van toezicht
      op de uitvoering van de basisregistratie waarde onroerende zaken (basisregistratie WOZ), de kosten verbonden aan
      de geschillenbeslechting, bedoeld in [artikel 11][ref2] van de wet, de kosten verbonden aan advisering van de
      Waarderingskamer door derden, alsmede de huisvestings- en personele kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0007230#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007230#Artikel11
    url: https://wetten.overheid.nl/BWBR0007230/2022-01-01#Artikel3
