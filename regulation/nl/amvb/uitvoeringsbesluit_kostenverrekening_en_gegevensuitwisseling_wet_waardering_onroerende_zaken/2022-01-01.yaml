  - number: '11'
    text: |-
      1 Als derden als bedoeld in [artikel 40a van de wet][ref1], waaraan het waardegegeven en de daarbij behorende
      temporele en meta-kenmerken van een onroerende zaak die in hoofdzaak tot woning dient, kan worden verstrekt, worden
      aangewezen:

      a. verzekeraars die ingevolge [artikel 1:1 van de Wet op het financieel toezicht][ref2] in Nederland mogen optreden
      als verzekeraar;

      b. aanbieders van hypothecair krediet die ingevolge [hoofdstuk 2.2 van de Wet op het financieel toezicht][ref3]
      in Nederland hypothecair krediet mogen aanbieden of die een verklaring van ondertoezichtstelling als bedoeld in
      [artikel 3:110 van die wet][ref4] hebben en hebben voldaan aan artikel 3:110, vierde of vijfde lid, van die wet,

      indien deze om het waardegegeven en de daarbij behorende temporele en meta-kenmerken verzoeken ten behoeve van het
      vergelijken met de veronderstelde waarde van een aan een financieringsaanvraag ten grondslag liggend waardeobject.

      2 Als derden als bedoeld in [artikel 40a van de wet][ref5], waaraan het waardegegeven en de daarbij behorende
      temporele en meta-kenmerken van een onroerende zaak die in hoofdzaak tot woning dient, kan worden verstrekt, worden
      mede aangewezen de door de Stichting Nederlands Register Vastgoed Taxateurs gecertificeerde validatie-instituten,
      indien deze om het waardegegeven en de daarbij behorende temporele en meta-kenmerken verzoeken ten behoeve van de
      validatie van een woningtaxatierapport van een aangesloten taxateur in het kader van een financieringsaanvraag.

      3 Als derden als bedoeld in [artikel 40a van de wet][ref6], waaraan het waardegegeven en
      de daarbij behorende temporele en meta-kenmerken van een onroerende zaak die in hoofdzaak
      tot woning dient, kan worden verstrekt, worden mede aangewezen instellingen als bedoeld in
      [artikel 1, eerste lid, van de Wet ter voorkoming van witwassen en financieren van terrorisme][ref7], indien
      deze om het waardegegeven en de daarbij behorende temporele en meta-kenmerken verzoeken ten behoeve van het
      verrichten van cliëntenonderzoek of melden van verrichte of voorgenomen ongebruikelijke transacties, bedoeld in
      [artikel 2a, eerste lid, van die wet][ref8].


