  - number: '5'
    text: |-
      1 De kosten van de Waarderingskamer worden aan de hand van de door haar vastgestelde begroting als bedoeld in
      [artikel 26 van de Kaderwet zelfstandige bestuursorganen][ref1], in januari van het jaar waarop zij betrekking
      hebben, in voorlopige rekening gebracht aan de afnemers.

      2 De afnemers voldoen hun aandeel in de begrote kosten binnen vier weken.

      3 Na de goedkeuring door Onze Minister van het verslag van de Waarderingskamer als bedoeld in
      [artikel 18 van de Kaderwet zelfstandige bestuursorganen][ref2], vindt de definitieve kostenverrekening plaats met
      de kosten van het jaar volgend op het jaar waarover dat verslag is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0020495#Artikel18
