preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Defensie van 1 februari 1993, nr. PAV2210/93002671;

    Gelet op de artikelen 125, eerste lid, en 134, eerste lid, van de Ambtenarenwet 1929;

    De Raad van State gehoord (advies van 29 maart 1993, nr. W07.93.0067);

    Gezien het nader rapport van Onze Minister van Defensie van 16 juni 1993, nr. PAV2210/93008951;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0006034/2003-12-10#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0006034/2003-12-10#Artikel1
  - number: 1.a
    text: 'Onze Minister: Onze Minister van Defensie;'
    url: https://wetten.overheid.nl/BWBR0006034/2003-12-10#Artikel1
  - number: 1.b
    text: 'ambtenaar:'
    url: https://wetten.overheid.nl/BWBR0006034/2003-12-10#Artikel1
  - number: 1.b.1°
    text: |-
      de ambtenaar als genoemd in [artikel 1 van het Burgerlijk ambtenarenreglement defensie][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel1
    url: https://wetten.overheid.nl/BWBR0006034/2003-12-10#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: '1'
  - number: 1.b.2°
    text: |-
      degene die krachtens arbeidsovereenkomst naar burgerlijk recht een of meer betrekkingen bekleedt waarvan de
      bezoldiging is vastgesteld door Onze Minister;
    url: https://wetten.overheid.nl/BWBR0006034/2003-12-10#Artikel1
  - number: 1.c.1°
    text: |-
      de echtgenote van de ambtenaar, die behoort tot het huishouden van de ambtenaar en aan dit besluit niet zelfstandig
      aanspraken ontleent en van wie de inkomsten lager zijn dan die van de ambtenaar;
    url: https://wetten.overheid.nl/BWBR0006034/2003-12-10#Artikel1
  - number: 1.2°
    text: |-
      het kind jonger dan 16 jaar, bedoeld in [artikel 7 van de Algemene Kinderbijslagwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel7
    url: https://wetten.overheid.nl/BWBR0006034/2003-12-10#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '7'
  - number: 1.3°
    text: |-
      het kind van 16 tot 18 jaar en van 16 tot 25 jaar, bedoeld in [artikel 7][ref1] respectievelijk
      [artikel 26 van de Algemene Kinderbijslagwet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0006034#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002368#Artikel26
    url: https://wetten.overheid.nl/BWBR0006034/2003-12-10#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006034
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0002368
        artikel: '26'
  - number: 1.4°
    text: |-
      het kind van 25 of 26 jaar dat behoudens de leeftijdseis voldoet aan het bepaalde in artikel 26, eerste lid onder
      *a*, respectievelijk tweede lid, van de [Algemene Kinderbijslagwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002368
    url: https://wetten.overheid.nl/BWBR0006034/2003-12-10#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002368
  - number: 1.5°
    text: |-
      het kind van 18 tot 27 jaar dat in aanmerking komt voor studiefinanciering ingevolge de
      [Wet studiefinanciering 2000][ref1], met dien verstande dat wat betreft de gezinsleden vermeld onder 2° tot en met
      4° de ter uitvoering van de [artikelen 7][ref2] en [26 van de Algemene Kinderbijslagwet][ref3] gestelde regels van
      overeenkomstige toepassing zijn;


      [ref1]: https://wetten.overheid.nl/BWBR0011453
      [ref2]: https://wetten.overheid.nl/BWBR0002368#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0002368#Artikel26
    url: https://wetten.overheid.nl/BWBR0006034/2003-12-10#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0011453
      - id: ref2
        bwb_id: BWBR0002368
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0002368
        artikel: '26'
  - number: 1.d
    text: 'uitvoeringsorgaan: het orgaan belast met de uitbetaling van de bezoldiging van de ambtenaar;'
    url: https://wetten.overheid.nl/BWBR0006034/2003-12-10#Artikel1
  - number: 1.e
    text: 'bevoegd gezag:'
    url: https://wetten.overheid.nl/BWBR0006034/2003-12-10#Artikel1
  - number: 1.e.1º
    text: de secretaris-generaal, voor zover het betreft de centrale organisatie;
    url: https://wetten.overheid.nl/BWBR0006034/2003-12-10#Artikel1
  - number: 1.e.2º
    text: de bevelhebber, voor zover het betreft het desbetreffende krijgsmachtdeel;
    url: https://wetten.overheid.nl/BWBR0006034/2003-12-10#Artikel1
  - number: 1.e.3º
    text: de commandant Defensie Interservice Commando, zover het betreft het Defensie Interservice Commando.
    url: https://wetten.overheid.nl/BWBR0006034/2003-12-10#Artikel1
  - number: '2'
    text: |-
      Met inachtneming van [artikel 4 van het Burgerlijk ambtenarenreglement defensie][ref1] wordt in dit besluit en de
      daarop berustende bepalingen mede verstaan onder echtgenote of echtgenoot:


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel4
    url: https://wetten.overheid.nl/BWBR0006034/2003-12-10#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: '4'
  - number: 2.1°
    text: de geregistreerde partner;
    url: https://wetten.overheid.nl/BWBR0006034/2003-12-10#Artikel2
  - number: 2.2°
    text: |-
      degene die door de ambtenaar als partner is aangemeld bij de Stichting Pensioenfonds ABP en door het bestuur van
      dat fonds als zodanig is aangemerkt, op voorwaarde dat de ambtenaar een bewijs van die aanmelding heeft overgelegd
      aan de minister.
    url: https://wetten.overheid.nl/BWBR0006034/2003-12-10#Artikel2
  - number: '3.1'
    text: De ambtenaar ontvangt over elke kalendermaand een tegemoetkoming in ziektekosten.
    url: https://wetten.overheid.nl/BWBR0006034/2003-12-10#Artikel3
  - number: '3.2'
    text: |-
      De ambtenaar ontvangt voorts een tegemoetkoming voor het gezinslid, bedoeld in [artikel 1, onderdeel ][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006034#Artikel1
    url: https://wetten.overheid.nl/BWBR0006034/2003-12-10#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006034
        artikel: '1'
  - number: '3.3'
    text: |-
      De ambtenaar ontvangt een extra tegemoetkoming voor ten hoogste één gezinslid, bedoeld in
      [artikel 1, onderdeel ][ref1]. Indien de ambtenaar en diens echtgenote beiden aanspraak op deze tegemoetkoming
      hebben, wordt deze toegekend aan de ambtenaar met het oudste kind jonger dan 16 jaar dat deel uitmaakt van het
      gemeenschappelijke huishouden.


      [ref1]: https://wetten.overheid.nl/BWBR0006034#Artikel1
    url: https://wetten.overheid.nl/BWBR0006034/2003-12-10#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006034
        artikel: '1'
  - number: '3.4'
    text: |-
      De ambtenaar ontvangt een extra tegemoetkoming voor elk gezinslid, bedoeld in [artikel 1, onderdeel ][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006034#Artikel1
    url: https://wetten.overheid.nl/BWBR0006034/2003-12-10#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006034
        artikel: '1'
  - number: '3.5'
    text: |-
      De tegemoetkomingen worden over een kalendermaand slechts verleend, indien de ambtenaar gedurende meer dan de
      helft van het aantal dagen als zodanig in dienst is geweest. De tegemoetkomingen voor gezinsleden worden over een
      kalendermaand slechts verleend, indien zij gedurende meer dan de helft van het aantal dagen als gezinslid kunnen
      worden aangemerkt.
    url: https://wetten.overheid.nl/BWBR0006034/2003-12-10#Artikel3
  - number: '4.1'
    text: |-
      De ambtenaar ontvangt voor zichzelf geen tegemoetkoming over een kalendermaand, waarin hij gedurende meer dan de
      helft van het aantal dagen behoort tot een van de volgende categorieën:
    url: https://wetten.overheid.nl/BWBR0006034/2003-12-10#Artikel4
  - number: 4.1.a
    text: |-
      degenen die zelfstandig verplicht verzekerd zijn krachtens de [Ziekenfondswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002460
    url: https://wetten.overheid.nl/BWBR0006034/2003-12-10#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002460
  - number: 4.1.b
    text: |-
      degenen die medeverzekerd zijn ingevolge het bepaalde in [artikel 4 van de Ziekenfondswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel4
    url: https://wetten.overheid.nl/BWBR0006034/2003-12-10#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: '4'
  - number: 4.1.c
    text: |-
      degenen die uit hoofde van hun (voormalige) dienstbetrekking aanspraak hebben op gehele of gedeeltelijke
      geneeskundige verzorging of op gehele of gedeeltelijke vergoeding van de kosten daarvan;
    url: https://wetten.overheid.nl/BWBR0006034/2003-12-10#Artikel4
  - number: 4.1.d
    text: degenen die uit hun dienstbetrekking geen bezoldiging genieten.
    url: https://wetten.overheid.nl/BWBR0006034/2003-12-10#Artikel4
  - number: '4.2'
    text: |-
      De ambtenaar ontvangt over een kalendermaand waarin hij gedurende meer dan de helft van het aantal dagen behoort
      tot de in het eerste lid, onderdeel d, genoemde categorie, geen tegemoetkoming voor een gezinslid.
    url: https://wetten.overheid.nl/BWBR0006034/2003-12-10#Artikel4
  - number: '4.3'
    text: |-
      De ambtenaar ontvangt evenmin een tegemoetkoming voor het gezinslid dat tot een van de in het eerste lid
      genoemde categorieën behoort, dan wel uit anderen hoofde aanspraak heeft op gehele of gedeeltelijke geneeskundige
      verzorging, of op gehele of gedeeltelijke vergoeding van de kosten daarvan.
    url: https://wetten.overheid.nl/BWBR0006034/2003-12-10#Artikel4
  - number: '4.4'
    text: |-
      In afwijking van het eerste lid, aanhef en onderdeel d, en het tweede lid behoudt de ambtenaar die zich in
      werkelijke militaire dienst bevindt zijn aanspraken voor hem en zijn gezinsleden bedoeld in [artikel 3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006034#Artikel3
    url: https://wetten.overheid.nl/BWBR0006034/2003-12-10#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0006034
        artikel: '3'
  - number: '5.1'
    text: |-
      Het bedrag van de tegemoetkomingen is zodanig dat na aftrek van de verschuldigde loonbelasting en premies
      volksverzekeringen wordt uitbetaald:
    url: https://wetten.overheid.nl/BWBR0006034/2003-12-10#Artikel5
  - number: 5.1.a
    text: |-
      ten aanzien van de ambtenaar en het gezinslid, bedoeld in [artikel 1, onderdeel ][ref1]: de helft
      van het per 1 april 1988 geldende maximumbijdragedeel van de premie voor een standaardpakket als
      bedoeld in artikel 2, vierde lid, van de Wet op de toegang tot ziektekostenverzekering voor een
      persoon die de dag vóór 1 april 1986 verzekerd of medeverzekerd was in de vrijwillige verzekering
      ingevolge de [Ziekenfondswet][ref2], de helft van de verschuldigde omslagbijdrage ingevolge
      [artikel 5 van de Wet medefinanciering oververtegenwoordiging oudere ziekenfondsverzekerden][ref3] en de helft van
      de verschuldigde omslagbijdrage ingevolge [artikel 6][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0006034#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002460
      [ref3]: https://wetten.overheid.nl/BWBR0003933#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0003934#Artikel6h
    url: https://wetten.overheid.nl/BWBR0006034/2003-12-10#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0006034
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002460
      - id: ref3
        bwb_id: BWBR0003933
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0003934
        artikel: 6h
  - number: 5.1.b
    text: |-
      ten aanzien van het gezinslid, bedoeld in [artikel 1, onderdeel ][ref1]: de helft van het per 1 april 1988
      geldende maximumbijdragedeel van de premie voor een standaardpakket als bedoeld in artikel 2, vierde lid,
      van de Wet op de toegang tot de ziektekostenverzekeringen voor eigen, aangehuwde en pleegkinderen tot 27
      jaar van de hierboven onder *a* bedoelde persoon, de helft van de verschuldigde omslagbijdrage ingevolge
      [artikel 5 van de Wet medefinanciering oververtegenwoordiging oudere ziekenfondsverzekerden][ref2] en de helft van
      de verschuldigde omslagbijdrage ingevolge [artikel 6][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0006034#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0003933#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0003934#Artikel6h
    url: https://wetten.overheid.nl/BWBR0006034/2003-12-10#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0006034
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0003933
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0003934
        artikel: 6h
  - number: 5.1.c
    text: |-
      ten aanzien van de gezinsleden, bedoeld in [artikel 1, onderdeel ][ref1]: de helft van het per
      1 april 1988 geldende maximumbijdragedeel van de premie voor een standaardpakket als bedoeld in
      [artikel 2, vierde lid, van de Wet op de toegang tot ziektekostenverzekeringen][ref2] voor eigen, aangehuwde en
      pleegkinderen tot 27 jaar van de hierboven onder *a* bedoelde persoon, de helft van de verschuldigde omslagbijdrage
      ingevolge [artikel 5 van de Wet medefinanciering oververtegenwoordiging oudere ziekenfondsverzekerden][ref3] en de
      helft van de verschuldigde omslagbijdrage ingevolge [artikel 6][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0006034#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0003934#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0003933#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0003934#Artikel6h
    url: https://wetten.overheid.nl/BWBR0006034/2003-12-10#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0006034
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0003934
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0003933
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0003934
        artikel: 6h
  - number: 5.1.d
    text: een toeslag;
    url: https://wetten.overheid.nl/BWBR0006034/2003-12-10#Artikel5
  - number: 5.1.e
    text: |-
      een aanvullende toeslag indien de ambtenaar geen tegemoetkoming ontvangt voor een gezinslid, en indien hij bij
      een volledige werktijd een salaris heeft gelijk aan dan wel lager dan het maximumsalaris van salarisschaal 7 van
      bijlage B van het [Bezoldigingsbesluit burgerlijke ambtenaren defensie][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006038
    url: https://wetten.overheid.nl/BWBR0006034/2003-12-10#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0006038
  - number: '5.2'
    text: |-
      Onze Minister stelt nadere regels vast ten aanzien van de vaststelling van de bedragen, bedoeld in het eerste lid,
      onder a tot en met e. Daarbij geldt dat de bedragen, met ingang van 1 januari 2002, jaarlijks per 1 januari worden
      aangepast aan de gemiddelde procentuele ontwikkeling van de premies die door een aantal niet op winst gerichte
      ziektekostenverzekeraars worden berekend voor een verzekering tegen ziektekosten.
    url: https://wetten.overheid.nl/BWBR0006034/2003-12-10#Artikel5
  - number: '5.3'
    text: |-
      Voor de toepassing van het eerste lid, onderdelen *a* en *c*, worden de ambtenaar
      en gezinsleden in de leeftijdscategorie van 16 tot en met 19 jaar en ouder dan 64
      jaar wat betreft de tegemoetkoming in de verschuldigde omslagbijdragen ingevolge
      [artikel 5 van de Wet medefinanciering oververtegenwoordiging oudere ziekenfondsverzekerden][ref1] en ingevolge
      [artikel 6][ref2] gelijkgesteld met degenen in de leeftijdscategrorie van 20 tot en met 64 jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0003933#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0003934#Artikel6h
    url: https://wetten.overheid.nl/BWBR0006034/2003-12-10#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003933
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0003934
        artikel: 6h
  - number: '7.1'
    text: |-
      Met inachtneming van [artikel 4][ref1] ontvangt de ambtenaar met een onvolledige werktijd, als bedoeld in
      [artikel 9, eerste lid, van het Bezoldigingsbesluit burgerlijke ambtenaren defensie (BBAD)][ref2], van meer dan
      twaalf uur per week, de tegemoetkoming, bedoeld in [artikel 3][ref3], behorende bij een volledige werktijd.


      [ref1]: https://wetten.overheid.nl/BWBR0006034#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0006038#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0006034#Artikel3
    url: https://wetten.overheid.nl/BWBR0006034/2003-12-10#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0006034
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0006038
        artikel: '9'
      - id: ref3
        bwb_id: BWBR0006034
        artikel: '3'
  - number: '7.2'
    text: |-
      Met inachtneming van [artikel 4][ref1] ontvangt de ambtenaar met een onvolledige werktijd, als bedoeld in
      [artikel 9, eerste lid, van het BBAD][ref2], van twaalf uur of minder per week, een evenredig deel van de
      tegemoetkoming, bedoeld in [artikel 3][ref3], behorende bij een volledige werktijd.


      [ref1]: https://wetten.overheid.nl/BWBR0006034#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0006038#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0006034#Artikel3
    url: https://wetten.overheid.nl/BWBR0006034/2003-12-10#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0006034
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0006038
        artikel: '9'
      - id: ref3
        bwb_id: BWBR0006034
        artikel: '3'
  - number: '7.3'
    text: |-
      De ambtenaar, bedoeld in het eerste lid, die op grond van een van de in
      [artikel 4, eerste lid, onder a, b of c][ref1], genoemde redenen of uit anderen hoofde aanspraak heeft op gehele
      of gedeeltelijke geneeskundige verzorging of op gehele of gedeeltelijke vergoeding van de kosten daarvan, maar
      echter slechts gedurende de helft of minder dan de helft van het aantal dagen van een kalendermaand aanspraak
      heeft, ontvangt slechts een evenredig deel van de tegemoetkoming, bedoeld in [artikel 3][ref2], behorende bij een
      volledige werktijd.


      [ref1]: https://wetten.overheid.nl/BWBR0006034#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0006034#Artikel3
    url: https://wetten.overheid.nl/BWBR0006034/2003-12-10#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0006034
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0006034
        artikel: '3'
  - number: '7.4'
    text: |-
      Indien de ambtenaar, bedoeld in het eerste en tweede lid, een echtgenoot of echtgenote heeft, ontvangt de ambtenaar
      alleen een tegemoetkoming als bedoeld in [artikel 3, derde en vierde lid][ref1], indien de inkomsten van deze
      echtgenoot of echtgenote lager zijn dan die van de ambtenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0006034#Artikel3
    url: https://wetten.overheid.nl/BWBR0006034/2003-12-10#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0006034
        artikel: '3'
  - number: '8.1'
    text: |-
      Het uitvoeringsorgaan betaalt de tegemoetkomingen uit in de maanden juni en december over de twee voorafgaande
      kwartalen eindigend met de maand maart respectievelijk september, dan wel op verzoek van de ambtenaar hetzij in
      de maand december over de vier voorafgaande kwartalen eindigend met de maand september, hetzij per maand, over de
      maand gelegen drie maanden daarvoor. Zo nodig vindt uitbetaling eerder plaats in geval van ontslag of overlijden.
      Indien op verzoek van de ambtenaar uitbetaling in de maand december plaatsvindt, vindt in dat geval uitbetaling
      plaats over de resterende maanden, liggende tussen de vastgestelde betalingsmomenten, waarin overeenkomstig
      [artikel 3][ref1] aanspraak op de tegemoetkoming bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0006034#Artikel3
    url: https://wetten.overheid.nl/BWBR0006034/2003-12-10#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0006034
        artikel: '3'
  - number: '8.2'
    text: |-
      De eerste uitbetaling van de tegemoetkoming vindt slechts op aanvraag plaats. Indien wijzigingen optreden in
      de voor de bepaling van de tegemoetkoming relevante gegevens is de ambtenaar verplicht deze wijzigingen aan het
      uitvoeringsorgaan te melden. De eerste aanvraag alsmede de melding van wijzigingen geschiedt op formulieren,
      waarvan het model wordt vastgesteld door Onze Minister van Defensie.
    url: https://wetten.overheid.nl/BWBR0006034/2003-12-10#Artikel8
  - number: '8.3'
    text: |-
      Indien niet binnen een periode van een jaar nadat het recht op respectievelijk nadat verhoging van het recht op
      een tegemoetkoming is ontstaan een aanvraag- respectievelijk een wijzigingsformulier is ingediend, vindt de eerste
      uitbetaling respectievelijk verhoging van de uitbetaling van de tegemoetkoming plaats met terugwerkende kracht tot
      en met een jaar gerekend vanaf de eerste dag van de maand van indiening.
    url: https://wetten.overheid.nl/BWBR0006034/2003-12-10#Artikel8
  - number: '9.1'
    text: De toekenning van de tegemoetkomingen geschiedt door het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0006034/2003-12-10#Artikel9
  - number: '9.2'
    text: |-
      De uitbetaling van de tegemoetkomingen geschiedt door het uitvoeringsorgaan over de maand of maanden waarvoor
      de ambtenaar een tegemoetkoming heeft aangevraagd dan wel, in geval van ontslag of overlijden, over de maand van
      ontslag of overlijden.
    url: https://wetten.overheid.nl/BWBR0006034/2003-12-10#Artikel9
  - number: '10.1'
    text: |-
      Het uitvoeringsorgaan kan verlangen dat de ambtenaar voor de toekenning van een tegemoetkoming relevante bescheiden
      overlegt.
    url: https://wetten.overheid.nl/BWBR0006034/2003-12-10#Artikel10
  - number: '10.2'
    text: |-
      Indien de ambtenaar niet voldoet aan het verzoek om bescheiden over te leggen, kan de uitbetaling van de
      tegemoetkoming door het uitvoeringsorgaan worden opgeschort.
    url: https://wetten.overheid.nl/BWBR0006034/2003-12-10#Artikel10
  - number: '11'
    text: Onze Minister kan voor de uitvoering van dit besluit nadere regels geven.
    url: https://wetten.overheid.nl/BWBR0006034/2003-12-10#Artikel11
  - number: '12.1'
    text: |-
      Het bedrag van de tegemoetkomingen wordt, voor zover betrekking hebbende op de tegemoetkomingen waarvan de
      uitbetaling is genoemd in [artikel 5, eerste lid, onder ][ref1], voor de ambtenaar en het gezinslid bedoeld in
      [artikel 1, onderdeel ][ref2], die verzekerd of medeverzekerd zijn voor een standaardpakket als bedoeld in artikel
      2, eerste lid, van de Wet op de toegang tot de ziektekostenverzekeringen voor een persoon die de dag voor 1 april
      1986 verzekerd of medeverzekerd was in de vrijwillige verzekering ingevolge de [Ziekenfondswet][ref3], verhoogd
      met de helft van de per 1 januari 1989 optredende mutatie in het maximum bijdrage deel van de premie van genoemd
      standaardpakket met dien verstande dat de mutatie als gevolg van de uitbreiding van het verstrekkingenpakket van de
      [Algemene Wet Bijzondere Ziektekosten][ref4] per 1 januari 1989 buiten beschouwing blijft; voor gezinsleden bedoeld
      in [artikel 1, onderdeel ][ref5] die medeverzekerd zijn voor het hiervoor bedoelde standaardpakket voorzover
      daarvoor voor hen een maximumbijdragedeel in de premie verschuldigd is wordt het bedrag van de tegemoetkomingen
      verhoogd met de helft van de voor hen op 1 januari 1989 optredende mutatie van het bedoelde maximumbijdragedeel
      van de premie met dien verstande dat de mutatie als gevolg van de uitbreiding van het verstrekkingenpakket van de
      [Algemene Wet Bijzondere Ziektekosten][ref6] per 1 januari 1989 buiten beschouwing blijft.


      [ref1]: https://wetten.overheid.nl/BWBR0006034#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0006034#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0002460
      [ref4]: https://wetten.overheid.nl/BWBR0002614
      [ref5]: https://wetten.overheid.nl/BWBR0006034#Artikel1
      [ref6]: https://wetten.overheid.nl/BWBR0002614
    url: https://wetten.overheid.nl/BWBR0006034/2003-12-10#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0006034
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0006034
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0002460
      - id: ref4
        bwb_id: BWBR0002614
      - id: ref5
        bwb_id: BWBR0006034
        artikel: '1'
      - id: ref6
        bwb_id: BWBR0002614
  - number: '12.2'
    text: |-
      Het bepaalde in het eerste lid is slechts van toepassing op degene die voor 1 januari 1989 de in het eerste lid
      bedoelde standaardpolis hadden afgesloten.
    url: https://wetten.overheid.nl/BWBR0006034/2003-12-10#Artikel12
  - number: 12a.1
    text: |-
      De tegemoetkomingen krachtens of overeenkomstig dit besluit worden niet gerekend tot het ambtelijk inkomen in de
      zin van de Algemeen burgerlijke pensioenwet.
    url: https://wetten.overheid.nl/BWBR0006034/2003-12-10#Artikel12a
  - number: 12a.2
    text: |-
      De tegemoetkomingen krachtens of overeenkomstig dit besluit worden niet gerekend tot de inkomsten als bedoeld in
      artikel 7, eerste lid van de Regeling ziektekostenvoorziening overheidspersoneel.
    url: https://wetten.overheid.nl/BWBR0006034/2003-12-10#Artikel12a
  - number: '13'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het *Staatsblad* waarin het wordt
      geplaatst en werkt terug tot en met 1 april 1993.
    url: https://wetten.overheid.nl/BWBR0006034/2003-12-10#Artikel13
  - number: '14'
    text: Dit besluit wordt aangehaald als Interimbesluit ziektekosten burgerlijke ambtenaren defensie.
    url: https://wetten.overheid.nl/BWBR0006034/2003-12-10#Artikel14
