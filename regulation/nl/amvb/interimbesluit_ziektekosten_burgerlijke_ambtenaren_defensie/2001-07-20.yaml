  - number: '2'
    text: |-
      Met inachtneming van [artikel 4 van het Burgerlijk ambtenarenreglement defensie][ref1] wordt in dit besluit en de
      daarop berustende bepalingen mede verstaan onder echtgenote of echtgenoot:

      1°. de geregistreerde partner;

      2°. degene die door de ambtenaar als partner is aangemeld bij de Stichting Pensioenfonds ABP en door het bestuur
      van dat fonds als zodanig is aangemerkt, op voorwaarde dat de ambtenaar een bewijs van die aanmelding heeft
      overgelegd aan de minister.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel4
    url: https://wetten.overheid.nl/BWBR0006034/2001-07-20#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: '4'
  - number: '3'
    text: |-
      1 De ambtenaar ontvangt over elke kalendermaand een tegemoetkoming in ziektekosten.

      2 De ambtenaar ontvangt voorts een tegemoetkoming voor het gezinslid, bedoeld in [artikel 1, onderdeel ][ref1].

      3 De ambtenaar ontvangt een extra tegemoetkoming voor ten hoogste één gezinslid, bedoeld in
      [artikel 1, onderdeel ][ref2]. Indien de ambtenaar en diens echtgenote beiden aanspraak op deze tegemoetkoming
      hebben, wordt deze toegekend aan de ambtenaar met het oudste kind jonger dan 16 jaar dat deel uitmaakt van het
      gemeenschappelijke huishouden.

      4 De ambtenaar ontvangt een extra tegemoetkoming voor elk gezinslid, bedoeld in [artikel 1, onderdeel ][ref3].

      5 De tegemoetkomingen worden over een kalendermaand slechts verleend, indien de ambtenaar gedurende meer dan de
      helft van het aantal dagen als zodanig in dienst is geweest. De tegemoetkomingen voor gezinsleden worden over een
      kalendermaand slechts verleend, indien zij gedurende meer dan de helft van het aantal dagen als gezinslid kunnen
      worden aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0006034#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0006034#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0006034#Artikel1
