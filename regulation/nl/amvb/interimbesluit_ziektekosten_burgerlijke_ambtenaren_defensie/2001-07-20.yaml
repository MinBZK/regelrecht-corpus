  - number: '7'
    text: |-
      1 Ten aanzien van de ambtenaar die als zodanig een of meer betrekkingen bekleedt, bedragen de tegemoetkomingen een
      evenredig deel van de tegemoetkomingen bij een volledige werktijd, met dien verstande, dat de door eenzelfde orgaan
      als bedoeld in [artikel 9][ref1] uit te betalen tegemoetkomingen te zamen het bedrag van de tegemoetkomingen bij
      een volledige werktijd niet overschrijden.

      2 Een teruggebrachte werktijd als bedoeld in [artikel 31 van het Burgerlijk ambtenarenreglement defensie][ref2] of
      een daarmee overeenkomende bepaling in een ander rechtspositieregelement is geen onvolledige werktijd in de zin van
      het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0006034#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0006040#Artikel31
    url: https://wetten.overheid.nl/BWBR0006034/2001-07-20#Artikel7
