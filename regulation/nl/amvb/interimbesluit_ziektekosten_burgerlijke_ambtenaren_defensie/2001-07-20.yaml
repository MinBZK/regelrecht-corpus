  - number: '5'
    text: |-
      1 Het bedrag van de tegemoetkomingen is zodanig dat na aftrek van de verschuldigde loonbelasting en premies
      volksverzekeringen wordt uitbetaald:

      a. ten aanzien van de ambtenaar en het gezinslid, bedoeld in [artikel 1, onderdeel ][ref1]: de
      helft van het per 1 april 1988 geldende maximumbijdragedeel van de premie voor een standaardpakket
      als bedoeld in artikel 2, vierde lid, van de Wet op de toegang tot ziektekostenverzekering voor een
      persoon die de dag vóór 1 april 1986 verzekerd of medeverzekerd was in de vrijwillige verzekering
      ingevolge de [Ziekenfondswet][ref2], de helft van de verschuldigde omslagbijdrage ingevolge
      [artikel 5 van de Wet medefinanciering oververtegenwoordiging oudere ziekenfondsverzekerden][ref3] en de helft van
      de verschuldigde omslagbijdrage ingevolge [artikel 6][ref4];

      b. ten aanzien van het gezinslid, bedoeld in [artikel 1, onderdeel ][ref5]: de helft van het per 1 april
      1988 geldende maximumbijdragedeel van de premie voor een standaardpakket als bedoeld in artikel 2, vierde
      lid, van de Wet op de toegang tot de ziektekostenverzekeringen voor eigen, aangehuwde en pleegkinderen tot
      27 jaar van de hierboven onder *a* bedoelde persoon, de helft van de verschuldigde omslagbijdrage ingevolge
      [artikel 5 van de Wet medefinanciering oververtegenwoordiging oudere ziekenfondsverzekerden][ref6] en de helft van
      de verschuldigde omslagbijdrage ingevolge [artikel 6][ref7];

      c. ten aanzien van de gezinsleden, bedoeld in [artikel 1, onderdeel ][ref8]: de helft van het per
      1 april 1988 geldende maximumbijdragedeel van de premie voor een standaardpakket als bedoeld in
      [artikel 2, vierde lid, van de Wet op de toegang tot ziektekostenverzekeringen][ref9] voor eigen, aangehuwde en
      pleegkinderen tot 27 jaar van de hierboven onder *a* bedoelde persoon, de helft van de verschuldigde omslagbijdrage
      ingevolge [artikel 5 van de Wet medefinanciering oververtegenwoordiging oudere ziekenfondsverzekerden][ref10] en de
      helft van de verschuldigde omslagbijdrage ingevolge [artikel 6][ref11];

      d. een toeslag;

      e. een aanvullende toeslag indien de ambtenaar geen tegemoetkoming ontvangt voor een gezinslid, en indien hij bij
      een volledige werktijd een salaris heeft gelijk aan dan wel lager dan het maximumsalaris van salarisschaal 7 van
      bijlage B van het [Bezoldigingsbesluit burgerlijke ambtenaren defensie][ref12].

      2 Onze Minister stelt nadere regels vast ten aanzien van de vaststelling van de bedragen, bedoeld in het eerste
      lid, onder a tot en met e. Daarbij geldt dat de bedragen, met ingang van 1 januari 2002, jaarlijks per 1 januari
      worden aangepast aan de gemiddelde procentuele ontwikkeling van de premies die door een aantal niet op winst
      gerichte ziektekostenverzekeraars worden berekend voor een verzekering tegen ziektekosten.

      3 Voor de toepassing van het eerste lid, onderdelen *a* en *c*, worden de ambtenaar
      en gezinsleden in de leeftijdscategorie van 16 tot en met 19 jaar en ouder dan 64
      jaar wat betreft de tegemoetkoming in de verschuldigde omslagbijdragen ingevolge
      [artikel 5 van de Wet medefinanciering oververtegenwoordiging oudere ziekenfondsverzekerden][ref13] en ingevolge
      [artikel 6][ref14] gelijkgesteld met degenen in de leeftijdscategrorie van 20 tot en met 64 jaar.


