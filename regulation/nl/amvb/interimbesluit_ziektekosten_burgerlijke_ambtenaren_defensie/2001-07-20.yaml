  - number: 12a
    text: >-
      1 De tegemoetkomingen krachtens of overeenkomstig dit besluit worden niet gerekend tot het ambtelijk inkomen in de
      zin van de Algemeen burgerlijke pensioenwet.


      2 De tegemoetkomingen krachtens of overeenkomstig dit besluit worden niet gerekend tot de inkomsten als bedoeld in
      artikel 7, eerste lid van de Regeling ziektekostenvoorziening overheidspersoneel.
    url: https://wetten.overheid.nl/BWBR0006034/2001-07-20#Artikel12a
  - number: '13'
    text: >-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het *Staatsblad* waarin het wordt
      geplaatst en werkt terug tot en met 1 april 1993.
    url: https://wetten.overheid.nl/BWBR0006034/2001-07-20#Artikel13
  - number: '14'
    text: Dit besluit wordt aangehaald als Interimbesluit ziektekosten burgerlijke ambtenaren defensie.
    url: https://wetten.overheid.nl/BWBR0006034/2001-07-20#Artikel14
