  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Op de voordracht van Onze Minister van Defensie van 1 februari 1993, nr. PAV2210/93002671;


    Gelet op de artikelen 125, eerste lid, en 134, eerste lid, van de Ambtenarenwet 1929;


    De Raad van State gehoord (advies van 29 maart 1993, nr. W07.93.0067);


    Gezien het nader rapport van Onze Minister van Defensie van 16 juni 1993, nr. PAV2210/93008951;


    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0006034/2001-07-20#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. Onze Minister:

      Onze Minister van Defensie;

      b. ambtenaar:

      1°. de ambtenaar als genoemd in [artikel 1 van het Burgerlijk ambtenarenreglement defensie][ref1];

      2°. degene die krachtens arbeidsovereenkomst naar burgerlijk recht een of meer betrekkingen bekleedt waarvan de
      bezoldiging is vastgesteld door Onze Minister;

      c. 1°. de echtgenote van de ambtenaar, die behoort tot het huishouden van de ambtenaar en aan dit besluit niet
      zelfstandig aanspraken ontleent en van wie de inkomsten lager zijn dan die van de ambtenaar;

      alsmede, de hierna genoemde kinderen, indien de ambtenaar voor hen de premie voor een ziektekostenverzekering heeft
      betaald,

      2°. het kind jonger dan 16 jaar, bedoeld in [artikel 7 van de Algemene Kinderbijslagwet][ref2];

      3°. het kind van 16 tot 18 jaar en van 16 tot 25 jaar, bedoeld in [artikel 7][ref3] respectievelijk
      [artikel 26 van de Algemene Kinderbijslagwet][ref4];

      4°. het kind van 25 of 26 jaar dat behoudens de leeftijdseis voldoet aan het bepaalde in artikel 26, eerste lid
      onder *a*, respectievelijk tweede lid, van de [Algemene Kinderbijslagwet][ref5];

      5°. het kind van 18 tot 27 jaar dat in aanmerking komt voor studiefinanciering ingevolge de
      [Wet studiefinanciering 2000][ref6], met dien verstande dat wat betreft de gezinsleden vermeld onder 2° tot en met
      4° de ter uitvoering van de [artikelen 7][ref7] en [26 van de Algemene Kinderbijslagwet][ref8] gestelde regels van
      overeenkomstige toepassing zijn.


