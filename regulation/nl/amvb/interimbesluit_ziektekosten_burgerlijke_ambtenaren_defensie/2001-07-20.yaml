  - number: '8'
    text: |-
      1 Uitbetaling van de tegemoetkomingen vindt plaats in de maanden juni en december over de twee voorafgaande
      kwartalen eindigend met de maand maart respectievelijk september, dan wel op verzoek van de ambtenaar hetzij in
      de maand december over de vier voorafgaande kwartalen eindigend met de maand september, hetzij per maand, over de
      maand gelegen drie maanden daarvoor.

      Zo nodig vindt uitbetaling eerder plaats in geval van ontslag of overlijden. Indien op verzoek van de ambtenaar
      uitbetaling in de maand december plaatsvindt, vindt in dat geval uitbetaling plaats over de resterende maanden,
      liggende tussen de vastgestelde betalingsmomenten, waarin overeenkomstig [artikel 3][ref1] aanspraak op de
      tegemoetkoming bestaat.

      2 De eerste uitbetaling van de tegemoetkoming vindt slechts op aanvraag plaats.

      Indien wijzigingen optreden in de voor de bepaling van de tegemoetkoming relevante gegevens is de ambtenaar
      verplicht deze wijzigingen te melden. De eerste aanvraag alsmede de melding van wijzigingen geschiedt op
      formulieren, waarvan het model wordt vastgesteld door Onze Minister van Defensie.

      3 Indien niet binnen een periode van een jaar nadat het recht op respectievelijk nadat verhoging van het recht op
      een tegemoetkoming is ontstaan een aanvraag- respectievelijk een wijzigingsformulier is ingediend, vindt de eerste
      uitbetaling respectievelijk verhoging van de uitbetaling van de tegemoetkoming plaats met terugwerkende kracht tot
      en met een jaar gerekend vanaf de eerste dag van de maand van indiening.


      [ref1]: https://wetten.overheid.nl/BWBR0006034#Artikel3
    url: https://wetten.overheid.nl/BWBR0006034/2001-07-20#Artikel8
    references:
      - id: ref1
