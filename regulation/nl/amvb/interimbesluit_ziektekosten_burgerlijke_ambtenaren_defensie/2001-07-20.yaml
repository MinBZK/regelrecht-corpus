        artikel: '3'
  - number: '9'
    text: >-
      De uitbetaling van de tegemoetkomingen geschiedt door het orgaan dat belast is met de uitbetaling van de
      bezoldiging aan de ambtenaar over de desbetreffende maand juni onderscheidenlijk december, danwel in het geval
      van ontslag of overlijden over de maand van ontslag of overlijden, en wel voor rekening van het hoofdstuk van de
      rijksbegroting ten laste waarvan evenbedoelde bezoldiging komt.
    url: https://wetten.overheid.nl/BWBR0006034/2001-07-20#Artikel9
  - number: '10'
    text: |-
      1 Het orgaan, bedoeld in [artikel 9][ref1], kan verlangen dat de ambtenaar voor de toekenning van een
      tegemoetkoming relevante bescheiden overlegt.

      2 Indien de ambtenaar niet voldoet aan het verzoek om bescheiden over te leggen, kan de uitbetaling van de
      tegemoetkoming worden opgeschort.


      [ref1]: https://wetten.overheid.nl/BWBR0006034#Artikel9
    url: https://wetten.overheid.nl/BWBR0006034/2001-07-20#Artikel10
    references:
