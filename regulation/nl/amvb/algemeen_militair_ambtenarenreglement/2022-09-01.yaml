preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Defensie, C. L. J. van Lent van 25 mei 1981, nr. PP81/091/1244;

    Overwegende, dat het wenselijk is de bepalingen inzake de rechtstoestand van de militaire ambtenaren van de
    krijgsmacht aan te passen aan de thans dienaangaande bestaande inzichten en opvattingen;

    Gelet op artikel 68 van de Grondwet (Stb. 1972, 193), artikel 125 van de Ambtenarenwet 1929 (Stb. 530), artikel 12
    van de Militaire Ambtenarenwet 1931 (Stb. 519) en artikel 2 van de Wet voor het reserve-personeel der krijgsmacht
    (Stb. 1954, 576);

    De Raad van State gehoord (advies van 5 oktober 1981, nr. 810923/16);

    Gezien het nader rapport van de Staatssecretaris van Defensie, J. van Houwelingen van 18 februari 1982, nr.
    PP81/094/403;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In dit besluit en de daarop rustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel1
  - number: 1.1.a
    text: '*Onze Minister* Onze Minister van Defensie;'
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel1
  - number: 1.1.b
    text: |-
      *militair* de militaire ambtenaar in de zin van
      [artikel 1, eerste en tweede lid, van de Militaire Ambtenarenwet 1931][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001952#Artikel1
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001952
        artikel: '1'
  - number: 1.1.c
    text: '*militair in werkelijke dienst* – tenzij uitdrukkelijk anders is bepaald – de militair die:'
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel1
  - number: 1.1.c.1
    text: |-
      is aangesteld bij het beroepspersoneel, tenzij hij op non-activiteit is gesteld of hem buitengewoon verlof van
      lange duur is verleend;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel1
  - number: 1.1.c.2
    text: behoort tot het reservepersoneel en als zodanig feitelijk onder de wapenen is;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel1
  - number: 1.1.d
    text: '*officiersrang* de rang van luitenant ter zee der 3e klasse of van tweede-luitenant of een hogere rang;'
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel1
  - number: 1.1.e
    text: |-
      *operationeel commando:* de Koninklijke marine, de Koninklijke landmacht, de Koninklijke luchtmacht en de
      Koninklijke marechaussee;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel1
  - number: 1.1.f
    text: |-
      *militaire inkomsten* alle beloningen in geld waarop de militair aanspraak kan maken krachtens de voor hem geldende
      bezoldigingsregeling of bezoldigingsregelingen, en krachtens de ter uitvoering van deze regeling of regelingen
      gegeven voorschriften;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel1
  - number: 1.1.g
    text: |-
      *initiële opleiding* de opleiding als genoemd in [artikel 13, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel13
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '13'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 1.1.h
    text: |-
      *de commandant operationeel commando* de Commandant Zeestrijdkrachten, de Commandant Landstrijdkrachten, de
      Commandant Luchtstrijdkrachten, de Commandant Koninklijke Marechaussee, voor het desbetreffende commando;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel1
  - number: 1.1.i
    text: '*hoofd defensieonderdeel*'
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel1
  - number: 1.1.i.1°
    text: de Secretaris-Generaal, voor zover het betreft de Bestuursstaf;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel1
  - number: 1.1.i.2°
    text: de commandant operationeel commando voor het desbetreffende commando;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel1
  - number: 1.1.i.3°
    text: |-
      de directeur van de Defensie Materieel Organisatie, voor zover het betreft de Defensie Materieel Organisatie, met
      uitzondering van het deel ondergebracht in de Bestuursstaf;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel1
  - number: 1.1.i.4°
    text: de commandant van het Commando Dienstencentra, voor zover het betreft het Commando Dienstencentra.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel1
  - number: 1.1.j
    text: '*de commandant* een bij ministeriële regeling aan te wijzen functionaris;'
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel1
  - number: 1.1.k
    text: |-
      *doorstroombesluit*: een besluit, als bedoeld in [artikel 31][ref1], waarmee de militair wordt medegedeeld dat de
      loopbaan bij Defensie al dan niet wordt voortgezet;


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel31
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '31'
        hoofdstuk: '4'
  - number: 1.1.l
    text: |-
      *fase één:* de periode waarin de aan de aanstelling verbonden verplichting als bedoeld in
      [artikel 12k, eerste en tweede lid, van de Militaire ambtenarenwet 1931][ref1], juncto [artikel 7][ref2] van dit
      besluit, van toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0001952#Artikel12k
      [ref2]: https://wetten.overheid.nl/BWBR0003482#Artikel7
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001952
        artikel: 12k
      - id: ref2
        bwb_id: BWBR0003482
        artikel: '7'
        hoofdstuk: '2'
  - number: 1.1.m
    text: |-
      *fase twee:* de periode van de datum waarop fase één eindigt tot en met de datum waarop het doorstroombesluit
      in werking treedt, respectievelijk de periode na inwerkingtreding van een doorstroombesluit indien hierin wordt
      bepaald dat de loopbaan bij Defensie niet wordt voortgezet;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel1
  - number: 1.1.n
    text: |-
      *fase drie:* de periode na inwerkingtreding van een doorstroombesluit waarin wordt bepaald dat de loopbaan bij
      Defensie wordt voortgezet;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel1
  - number: 1.1.o
    text: '*effectieve rang:* het bekleden van een rang anders dan titulair of tijdelijk;'
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel1
  - number: 1.1.p
    text: |-
      *onderofficier:* de militair ingedeeld bij de Koninklijke marine met de rang van korporaal, sergeant, sergeant-
      majoor of adjudant-onderofficier, de militair ingedeeld bij de Koninklijke landmacht, luchtmacht en marechaussee
      met de rang van sergeant, sergeant der eerste klasse, wachtmeester, wachtmeester der eerste klasse, sergeant-
      majoor, opperwachtmeester of adjudant-onderofficier;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel1
  - number: 1.1.q
    text: '*maximum looptijd:* het aantal jaren dat een militair maximaal in een bepaalde rang of stand mag doorbrengen;'
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel1
  - number: 1.1.r
    text: '*functie:* een samenstel van taken, bevoegdheden en verantwoordelijkheden.'
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel1
  - number: 1.1.s
    text: '*functietoewijzing:* de aanwijzing van een militair voor het vervullen van een functie;'
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel1
  - number: 1.1.t
    text: '*rang:* een militaire rang en stand of klasse, voor zover niet titulair toegekend;'
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel1
  - number: 1.1.u
    text: |-
      *functionele chef:* de functionaris onder wiens directe toezicht en rechtstreekse leiding de toegewezen functie
      wordt vervuld, dan wel die als zodanig door het hoofd defensieonderdeel is aangewezen;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel1
  - number: 1.1.v
    text: |-
      *passende functie* een functie als bedoeld in [artikel 53b][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel53b
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: 53b
        hoofdstuk: 6a
        paragraaf: '1'
  - number: 1.1.w
    text: |-
      *pensioengerechtigde leeftijd:* tenzij in dit besluit anders wordt vermeld, de pensioengerechtigde leeftijd die
      voor de militair geldt op grond van [artikel 7a van de Algemene Ouderdomswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: 7a
  - number: '1.2'
    text: |-
      Voor de toepassing van dit besluit wordt mede begrepen onder «rang», «stand» of «klasse»: de bij het
      [koninklijk besluit van 20 juni 1956][ref1] (Stb. 361) met die rang, stand of klasse gelijkgestelde rang, stand
      of klasse.


      [ref1]: https://wetten.overheid.nl/BWBR0002224
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002224
  - number: '1.3'
    text: 'In dit besluit en de daarop berustende bepalingen wordt mede verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel1
  - number: 1.3.a
    text: echtgenote of echtgenoot
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel1
  - number: 1.3.a.1°
    text: de geregistreerde partner;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel1
  - number: 1.3.a.2°
    text: |-
      degene die door de militair als partner is aangemeld bij de Stichting pensioenfonds ABP en door het bestuur van
      dat fonds als zodanig is aangemerkt, op voorwaarde dat de militair een bewijs van die aanmelding heeft overlegd aan
      de commandant;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel1
  - number: 1.3.b
    text: '*huwelijk*'
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel1
  - number: 1.3.b.1°
    text: geregistreerd partnerschap;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel1
  - number: 1.3.b.2°
    text: |-
      het samenleven met de partner die door de militair als zodanig is aangemeld bij de Stichting pensioenfonds ABP en
      door het bestuur van dat fonds als zodanig is aangemerkt.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel1
  - number: '1.4'
    text: |-
      De gelijkstellingen, bedoeld in het derde lid, onderdeel a, onder 2° en onderdeel b, onder 2° eindigen op de dag
      waarop de aanmelding van het partnerpensioen door het Stichting Pensioenfonds ABP wordt doorgehaald. De militair
      meldt die doorhaling aan de commandant, waarbij hij een afschrift van de mededeling van die doorhaling verstrekt.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel1
  - number: '1.5'
    text: |-
      Voor de toepassing van de [hoofdstukken 5][ref1], [7][ref2], [8][ref3], [9][ref4] en [10][ref5],
      alsmede de [artikelen 39, tweede lid, onderdelen a, f en g][ref6], [39a, aanhef en onderdeel e][ref7],
      [44][ref8], [49][ref9], [126b][ref10], [126d tot en met 126f][ref11], [130][ref12], [134][ref13]
      en [144 tot en met 148][ref14], wordt onder «militair» mede begrepen hij die bij het Ministerie van
      Defensie op grond van [artikel 6 van het Burgerlijk ambtenarenreglement defensie][ref15] is aangesteld
      in burgerlijke openbare dienst om bij de krijgsmacht als geestelijk verzorger doorlopend werkzaam te
      zijn. Deze geestelijk verzorger wordt, in voorkomend geval, mede begrepen onder het beroepspersoneel.
      De [hoofdstukken 4][ref16], [5][ref17], [6][ref18] en [8][ref19], alsmede de [artikelen 70b][ref20],
      [70d tot en met 70f][ref21], [76][ref22], [85][ref23], [87a][ref24], [88][ref25], [93][ref26],
      [109 tot en met 111][ref27], [114][ref28], [121, eerste lid, onderdelen f en h, derde lid][ref29], [127][ref30] en
      [127a van het Burgerlijk ambtenarenreglement defensie][ref31] zijn op hem niet van toepassing.


