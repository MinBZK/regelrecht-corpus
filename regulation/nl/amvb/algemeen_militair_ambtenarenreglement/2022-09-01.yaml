  - number: '102'
    text: |-
      De militair in werkelijke dienst is verplicht medewerking te verlenen aan de onderzoeken, bedoeld in de
      [artikelen 93, tweede lid][ref1], [95][ref2], [97][ref3], [98][ref4] en [99][ref5].


