  - number: '104.1'
    text: |-
      De militair die zich niet kan verenigen met de in [artikel 103][ref1] bedoelde uitslag, kan, indien het een
      onderzoek als bedoeld in [artikel 93, tweede lid][ref2], of [artikel 95][ref3], betreft, binnen drie maal
      vierentwintig uren en, zo het een onderzoek als bedoeld in de [artikelen 97][ref4], [98][ref5] en [99][ref6]
      betreft, binnen zes weken, nadat de uitslag te zijner kennis is gebracht, schriftelijk onder opgave van de redenen
      daartegen zijn bedenkingen kenbaar maken bij de commandant operationeel commando. Het indienen van de bedenkingen
      heeft geen schorsende werking.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel103
