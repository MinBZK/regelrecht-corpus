  - number: '104.2'
    text: |-
      Behalve indien de commandant operationeel commando, na overleg met de betrokken militair geneeskundige dienst,
      de bedenkingen van de militair reeds aanstonds voldoende gegrond acht, wordt zo spoedig mogelijk, doch uiterlijk
      binnen zes weken na ontvangst van het bezwaarschrift, een hernieuwd geneeskundig of tandheelkundig onderzoek
      ingesteld.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel104
  - number: '104.3'
    text: |-
      Het hernieuwd onderzoek geschiedt door een (of meer) daartoe door de inspecteur van de betrokken militair
      geneeskundige dienst aangewezen deskundige(n) die niet aan het voorafgaande onderzoek heeft (hebben) deelgenomen.
      De uitslag van het hernieuwd onderzoek wordt de militair zo spoedig mogelijk schriftelijk ter kennis gebracht.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel104
  - number: '105.1'
    text: |-
      De militair in werkelijke dienst, van wie op goede gronden wordt verondersteld dat
      hij blijvend ongeschikt is voor het vervullen van de dienst, kan, in opdracht van Onze
      Minister, worden onderworpen aan een geneeskundig onderzoek naar de regelen, gesteld in het
      [Besluit procedure geneeskundig onderzoek blijvende dienstongeschiktheid en pensioenkeuring militairen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008475
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel105
    references:
      - id: ref1
        bwb_id: BWBR0008475
  - number: '105.2'
    text: |-
      In het geval, bedoeld in het eerste lid, zijn de [artikelen 101][ref1] en [102][ref2] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel101
      [ref2]: https://wetten.overheid.nl/BWBR0003482#Artikel102
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel105
