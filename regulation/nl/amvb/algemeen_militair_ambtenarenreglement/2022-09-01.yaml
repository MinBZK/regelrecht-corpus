                    48 uren
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel73
  - number: '74.1'
    text: |-
      De militair ingedeeld bij de Koninklijke landmacht, Koninklijke luchtmacht of Koninklijke marechaussee die niet
      gedurende een vol kalenderjaar als zodanig in werkelijke dienst is, heeft - behalve indien hij in dienst is
      gekomen voor een periode van minder dan 85 dagen - over dat jaar aanspraak op het in het vorige artikel bedoelde
      vakantieverlof, vastgesteld naar evenredigheid van de tijd gedurende welke hij in dat jaar in werkelijke dienst is.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel74
  - number: '74.2'
    text: 'Voor de toepassing van het vorige lid is bepalend:'
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel74
  - number: 74.2.a
    text: |-
      indien de militair in de loop van het kalenderjaar als zodanig in werkelijke dienst komt: de rang of stand die hij
      op het tijdstip van indiensttreding bekleedt;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel74
  - number: 74.2.b
    text: |-
      indien de militair in de loop van het kalenderjaar de werkelijke dienst verlaat: de rang of stand die hij op 1
      januari van dat kalenderjaar bekleedt.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel74
  - number: '75.1'
    text: |-
      Over kalendermaanden gedurende de welke de militair ingedeeld bij de Koninklijke landmacht, Koninklijke luchtmacht
      of Koninklijke marechaussee in het geheel geen arbeid verricht, heeft hij geen aanspraak op vakantieverlof. Over
      kalendermaanden gedurende de welke de militair ingedeeld bij de Koninklijke landmacht, Koninklijke luchtmacht
      of Koninklijke marechaussee gedeeltelijk arbeid verricht, heeft hij slechts aanspraak op vakantieverlof naar
      evenredigheid van het gedeelte van de werktijd waarop hij feitelijk arbeid verricht.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel75
  - number: '75.2'
    text: 'Het eerste lid is niet van toepassing:'
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel75
  - number: 75.2.a
    text: in geval geen arbeid is verricht wegens verleend verlof, niet zijnde buitengewoon verlof;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel75
  - number: 75.2.b
    text: |-
      in geval geen arbeid is verricht wegens zwangerschaps- en bevallingsverlof, als bedoeld in
      [artikel 3:1 van de Wet arbeid en zorg][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '3'
  - number: 75.2.c
    text: in geval geen arbeid is verricht wegens ziekte;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel75
  - number: 75.2.d
    text: in andere gevallen, indien degene die tot het verlenen van het verlof bevoegd is, daartoe aanleiding aanwezig acht.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel75
  - number: '75.3'
    text: |-
      Het vakantieverlof waarop een militair ingedeeld bij de Koninklijke landmacht, Koninklijke luchtmacht of
      Koninklijke marechaussee ingevolge [artikel 73][ref1] of [74][ref2] aanspraak maakt:


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel73
      [ref2]: https://wetten.overheid.nl/BWBR0003482#Artikel74
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '73'
        hoofdstuk: '8'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0003482
        artikel: '74'
        hoofdstuk: '8'
        paragraaf: '3'
  - number: 75.3.a
    text: |-
      wordt verminderd naar evenredigheid van de tijd gedurende welke hem langer durend zorgverlof als bedoeld in
      [artikel 87c][ref1], of ouderschapsverlof als bedoeld in [artikel 87d][ref2], is verleend;


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel87c
      [ref2]: https://wetten.overheid.nl/BWBR0003482#Artikel87d
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: 87c
        hoofdstuk: '8'
        paragraaf: 4b
      - id: ref2
        bwb_id: BWBR0003482
        artikel: 87d
        hoofdstuk: '8'
        paragraaf: 4b
  - number: 75.3.b
    text: |-
      kan, naar regels bij ministeriële regeling te stellen, worden verminderd naar evenredigheid van de tijd gedurende
      welke hem buitengewoon verlof als bedoeld in [artikel 12c, tweede lid, van de Militaire Ambtenarenwet 1931][ref1]
      of [artikel 86, aanhef en onder b][ref2], is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0001952#Artikel12c
      [ref2]: https://wetten.overheid.nl/BWBR0003482#Artikel86
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0001952
        artikel: 12c
      - id: ref2
        bwb_id: BWBR0003482
        artikel: '86'
        hoofdstuk: '8'
        paragraaf: 4a
  - number: '75.4'
    text: |-
      Het vakantieverlof waarop een militair ingedeeld bij de Koninklijke landmacht, Koninklijke luchtmacht of
      Koninklijke marechaussee ingevolge [artikel 73][ref1] of [74][ref2] aanspraak maakt, wordt naar evenredigheid
      verminderd indien hem op grond van het [Besluit aanpassing arbeidsduur militairen][ref3] buitengewoon verlof
      in verband met deeltijdarbeid wordt verleend. In geval van vermeerdering van de arbeidsduur op grond van het
      [Besluit aanpassing arbeidsduur militairen][ref4] wordt de in de vorige volzin genoemde verminderde aanspraak op
      vakantieverlof naar evenredigheid vermeerderd.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel73
      [ref2]: https://wetten.overheid.nl/BWBR0003482#Artikel74
      [ref3]: https://wetten.overheid.nl/BWBR0011531
      [ref4]: https://wetten.overheid.nl/BWBR0011531
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '73'
        hoofdstuk: '8'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0003482
        artikel: '74'
        hoofdstuk: '8'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0011531
      - id: ref4
        bwb_id: BWBR0011531
  - number: '75.5'
    text: |-
      Voor de militair ingedeeld bij de Koninklijke landmacht, Koninklijke luchtmacht of Koninklijke marechaussee aan
      wie ten hoogste veertien dagen voor het tijdstip waarop hij in werkelijke dienst komt, ontslag is verleend uit een
      andere overheidsbetrekking, wordt het aantal uren vakantieverlof waarop ingevolge [artikel 73][ref1] of [74][ref2]
      aanspraak bestaat vermeerderd met zoveel uren vakantieverlof als hij uit hoofde van die vorige betrekking over het
      lopende kalenderjaar nog tegoed had.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel73
      [ref2]: https://wetten.overheid.nl/BWBR0003482#Artikel74
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '73'
        hoofdstuk: '8'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0003482
        artikel: '74'
        hoofdstuk: '8'
        paragraaf: '3'
  - number: '75.6'
    text: |-
      De militair heeft geen aanspraak op vakantieverlof indien
      [artikel 17, vijfde lid, onderdeel j van het Inkomstenbesluit militairen][ref1] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0007816#Artikel17
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0007816
        artikel: '17'
  - number: '76.1'
    text: |-
      Vakantieverlof wordt aan een militair ingedeeld bij de Koninklijke landmacht, Koninklijke luchtmacht of Koninklijke
      marechaussee verleend:
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel76
  - number: 76.1.a
    text: op zijn aanvraag;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel76
  - number: 76.1.b
    text: |-
      niet op zijn aanvraag, voor zover naar het oordeel van degene die het verlof verleent, de belangen van de dienst
      dat vorderen.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel76
  - number: '76.2'
    text: |-
      Aan de militair dient in elk kalenderjaar ten minste 152 uren vakantieverlof te worden verleend, waarvan ten minste
      76 uren aaneengesloten of tot in evenredigheid lagere getallen indien de militair buitengewoon verlof in verband
      met deeltijdarbeid is verleend op grond van het [Besluit aanpassing arbeidsduur militairen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011531
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0011531
  - number: '77.1'
    text: Vakantieverlof wordt zoveel mogelijk opgenomen in aaneengesloten perioden van ten minste 4 uren.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel77
  - number: '77.2'
    text: |-
      Indien voor een militair ingedeeld bij de Koninklijke landmacht, Koninklijke luchtmacht of Koninklijke marechaussee
      een periode of perioden is of zijn vastgesteld, gedurende welke hem vakantieverlof niet-op-aanvraag wordt verleend,
      wordt hem vakantieverlof op aanvraag zoveel mogelijk verleend voorafgaand aan of in aansluiting op die periode
      of perioden.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel77
  - number: '77.3'
    text: |-
      Onverminderd het bepaalde in het [tweede lid van artikel 79][ref1], wordt aan de militair ingedeeld bij de
      Koninklijke landmacht, Koninklijke luchtmacht of Koninklijke marechaussee op zijn aanvraag zoveel mogelijk een
      vakantieverlof in een door hem gekozen periode verleend van tenminste twee aaneengesloten weken.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel79
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '79'
        hoofdstuk: '8'
        paragraaf: '3'
  - number: '78.1'
    text: |-
      Gedurende een bepaalde tijd, doch ten hoogste gedurende de eerste zes maanden nadat hij als zodanig in werkelijke
      dienst is gekomen, wordt aan een militair ingedeeld bij de Koninklijke landmacht, Koninklijke luchtmacht
      of Koninklijke marechaussee op zijn aanvraag slechts zoveel maal een twaalfde deel van het hem ingevolge
      [artikel 73][ref1] of [74][ref2] toekomende vakantieverlof verleend als hij volle maanden in werkelijke dienst is.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel73
      [ref2]: https://wetten.overheid.nl/BWBR0003482#Artikel74
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '73'
        hoofdstuk: '8'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0003482
        artikel: '74'
        hoofdstuk: '8'
        paragraaf: '3'
  - number: '78.2'
    text: |-
      Het vorige lid blijft buiten toepassing, indien de militair onmiddellijk voorafgaand aan het tijdstip waarop hij
      als zodanig in werkelijke dienst kwam - een onderbreking van veertien dagen of minder buiten beschouwing gelaten -:
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel78
  - number: 78.2.a
    text: reeds uit anderen hoofde in werkelijke dienst verbleef, dan wel
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel78
  - number: 78.2.b
    text: reeds gedurende ten minste zes maanden een andere overheidsbetrekking vervulde.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel78
  - number: '78.3'
    text: |-
      Het eerste lid blijft eveneens buiten toepassing, indien aan de militair vakantieverlof niet-op-aanvraag wordt
      verleend.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel78
  - number: '79.1'
    text: |-
      Bij het verlenen van vakantieverlof niet-op-aanvraag, dat altijd ten minste 2 aaneengesloten werkdagen bedraagt,
      wordt zoveel mogelijk rekening gehouden met de belangen van de militair.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel79
  - number: '79.2'
    text: |-
      Van het aantal uren vakantieverlof dat een militair ingedeeld bij de Koninklijke landmacht, Koninklijke luchtmacht
      of Koninklijke marechaussee in enig kalenderjaar toekomt, kunnen, in overleg met de medezeggenschapscommissie:
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel79
  - number: 79.2.a
    text: |-
      ten hoogste 120 uren als vakantieverlof niet-op-aanvraag worden verleend, in een periode van ten hoogste drie
      weken, dan wel
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel79
  - number: 79.2.b
    text: ten hoogste 40 uren als vakantieverlof niet-op-aanvraag worden verleend.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel79
  - number: '79.3'
    text: |-
      De in het tweede lid, onder *a*, bedoelde periode dient zoveel mogelijk te zijn gelegen in de periode van de
      zomervakanties in het onderwijs.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel79
  - number: '80.1'
    text: Niet verleend vakantieverlof wordt overgeboekt naar het volgende kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel80
  - number: '80.2'
    text: |-
      Het overgeboekte vakantieverlof, als bedoeld in het eerste lid, vervalt op 31 december van dat volgende
      kalenderjaar. Deze vervaldatum wordt met een kalenderjaar uitgesteld indien operationele omstandigheden de
      commandant hebben verhinderd vakantieverlof te verlenen, of naar het oordeel van de commandant gewichtige
      persoonlijke omstandigheden of medische redenen de militair hebben verhinderd het vakantieverlof te genieten.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel80
  - number: '80.3'
    text: |-
      Indien medische redenen de militair hebben verhinderd om vakantieverlof op te nemen, legt de militair een
      schriftelijke verklaring van de behandelend arts van de militair geneeskundige dienst, of een andere arts indien
      geen arts van de militaire geneeskundige dienst voorhanden is, over aan de commandant.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel80
  - number: '80.4'
    text: Het tweede lid is niet van toepassing ten aanzien van op 31 december 1996 nog niet verleend vakantieverlof.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel80
  - number: '80.5'
    text: |-
      Het niet genoten vakantieverlof toegekend voor 1 januari 2019, wordt uiterlijk voor of op 31 december 2023 genoten.
      Op 1 januari 2024 vervalt de aanspraak op het niet genoten verlof van voor 1 januari 2019.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel80
  - number: 80a.1
    text: |-
      Vakantieverlof op aanvraag dat in enig kalenderjaar teveel is verleend, wordt in mindering gebracht op het
      vakantieverlof over het volgende kalenderjaar of over de volgende twee of drie kalenderjaren, indien het teveel
      meer beloopt dan één derde onderscheidenlijk twee derde gedeelte van het de militair ingevolge artikel 73
      toekomende vakantieverlof.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel80a
  - number: 80a.2
    text: |-
      Het in enig kalenderjaar verleende vakantieverlof niet-op-aanvraag dat, uitsluitend omdat de militair reeds
      vakantieverlof op aanvraag is verleend, leidt tot overschrijding van het aan de militair toekomende aantal uren
      vakantieverlof in dat jaar, wordt niet in mindering gebracht op het vakantieverlof over het volgend kalenderjaar of
      de volgende kalenderjaren.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel80a
  - number: 80b.1
    text: |-
      Indien de militair op de datum waarop hij de werkelijke dienst verlaat nog aanspraak heeft op vakantieverlof, wordt
      hem voor ieder uur vakantieverlof dat hem niet is verleend een vergoeding toegekend ten bedrage van 1/165 deel van
      de verhoogde bezoldiging per maand als bedoeld in [artikel 1, van het Inkomstenbesluit militairen][ref1], waarop de
      militair direct voorafgaand aan zijn verlaten van de werkelijke dienst aanspraak had. De vergoeding wordt berekend
      over ten hoogste twee maal de aanspraak op vakantieverlof over een vol kalenderjaar, zoals die direct voorafgaand
      aan het verlaten van de werkelijke dienst van de militair voor hem gold.


      [ref1]: https://wetten.overheid.nl/BWBR0007816#Artikel1
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel80b
    references:
      - id: ref1
        bwb_id: BWBR0007816
        artikel: '1'
  - number: 80b.2
    text: |-
      Indien op de dag, waarop de militair de werkelijke dienst verlaat, blijkt dat de militair teveel vakantieverlof
      heeft genoten, is hij voor ieder uur teveel genoten vakantieverlof, tenzij dit niet aan zijn schuld of toedoen te
      wijten is, een bedrag verschuldigd ten bedrage van 1/165 deel van de verhoogde bezoldiging per maand als bedoeld in
      [artikel 1, van het Inkomstenbesluit militairen][ref1], waarop de militair direct voorafgaand aan zijn verlaten van
      de werkelijke dienst aanspraak had.


      [ref1]: https://wetten.overheid.nl/BWBR0007816#Artikel1
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel80b
    references:
      - id: ref1
        bwb_id: BWBR0007816
        artikel: '1'
  - number: 80b.3
    text: |-
      Indien de militair uiterlijk veertien dagen na het tijdstip waarop hij in de loop van een kalenderjaar
      de werkelijke dienst verlaat weer in werkelijke dienst komt of wordt aangesteld als burgerlijk ambtenaar
      bij het Ministerie van Defensie, kan de militair, in afwijking van het eerste lid, ervoor kiezen de
      vakantieverlofaanspraken van het lopende kalenderjaar die niet zijn genoten, te behouden. Daarbij wordt
      vakantieverlof dat in het lopende kalenderjaar is verleend in mindering gebracht op de aanspraken in dat jaar.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel80b
  - number: 80b.4
    text: |-
      Het eerste en derde lid zijn niet van toepassing ten aanzien van op 31 december 1996 nog niet verleend
      vakantieverlof, dat, wanneer het nog niet is genoten op de datum waarop de militair de werkelijke dienst verlaat,
      vervalt.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel80b
  - number: '81.1'
    text: |-
      Bij ministeriële regeling kunnen regels worden vastgesteld die afwijken van de artikelen 68 tot en met 71 en 73 tot
      en met 80, indien de belangen van de dienst een zodanige afwijking vorderen.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel81
  - number: '81.2'
    text: |-
      Indien op een militair een afwijkende verlofregeling als bedoeld in het eerste lid van toepassing is, zijn de
      artikelen 68 tot en met 71 en 73 tot en met 80 niet van toepassing en worden vakantieverloftegoeden, opgebouwd op
      grond van die artikelen voor dat de afwijkende verlofregeling op de militair van toepassing werd, bevroren. Verlof,
      opgebouwd op grond van de afwijkende verlofregeling, vervalt op het moment dat de afwijkende verlofregeling niet
      meer van toepassing is.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel81
  - number: '81.3'
    text: |-
      Indien een militair kan aantonen dat hij gedurende de tijd dat op hem een afwijkende verlofregeling van toepassing
      is geweest, minder uren vakantieverlof heeft kunnen opnemen dan het aantal uren vakantieverlof waarop hij aanspraak
      had kunnen maken op grond van de artikelen 68 tot en met 71 en 73 tot en met 80, indien op hem de afwijkende
      verlofregeling niet van toepassing zou zijn geweest, heeft hij aanspraak op het resterende verschil in uren
      vakantieverlof.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel81
  - number: '81.4'
    text: |-
      De militair, op wie over een gedeelte van een kalenderjaar een afwijkende verlofregeling als bedoeld in het
      eerste lid van toepassing is, heeft over het overblijvende gedeelte van dat jaar aanspraak op vakantieverlof naar
      evenredigheid van de tijd gedurende welke hij in dat gedeelte in werkelijke dienst is.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel81
  - number: '83.1'
    text: |-
      Aan de militair die is aangewezen voor het verrichten van dienst buiten Europa dan wel aan boord van een
      varend schip buiten Nederland en om die reden naar verwachting ten minste 6 maanden achtereen buiten Europa
      onderscheidenlijk buiten Nederland zal verblijven, wordt uiterlijk vóór de dag van vertrek inschepingsverlof
      verleend voor:
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel83
  - number: 83.1.a
    text: |-
      5 werkdagen, indien het verblijf buiten Europa dan wel aan boord van een varend schip buiten Nederland naar
      verwachting minder dan 9 maanden achtereen zal duren;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel83
  - number: 83.1.b
    text: |-
      10 werkdagen, indien het verblijf buiten Europa dan wel aan boord van een varend schip buiten Nederland naar
      verwachting 9 maanden of meer zal duren.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel83
  - number: '83.2'
    text: |-
      Aan de militair die is aangewezen voor het verrichten van dienst buiten Nederland in Europa, anders dan aan
      boord van een varend schip en om die reden naar verwachting ten minste 6 maanden achtereen buiten Nederland zal
      verblijven, wordt uiterlijk vóór de dag van vertrek inschepingsverlof verleend voor ten hoogste 5 werkdagen.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel83
  - number: '83.3'
    text: |-
      Ten aanzien van de militair die inschepingsverlof heeft genoten en die zijn bestemming niet volgt ten gevolge
      van omstandigheden afhankelijk van zijn wil of toedoen, kan het hoofd defensieonderdeel dat verlof aanmerken als
      verleend vakantieverlof.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel83
  - number: '84.1'
    text: |-
      De militair heeft na een verblijf voor dienst buiten Europa dan wel aan boord van een varend schip buiten Nederland
      gedurende één maand of langer achtereen, aanspraak op ontschepingsverlof van één werkdag voor elke maand dat het
      verblijf voor dienst buiten Europa dan wel aan boord van een varend schip buiten Nederland heeft geduurd, zulks met
      een maximum van 20 werkdagen.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel84
  - number: '84.2'
    text: |-
      Het ontschepingsverlof, bedoeld in het eerste lid, wordt aaneengesloten of in gedeelten aan de militair verleend zo
      spoedig mogelijk nadat hij in Nederland is teruggekeerd.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel84
  - number: '84.3'
    text: |-
      Aan de militair wordt na een verblijf voor dienst buiten Nederland in Europa, anders dan aan boord van een varend
      schip, van ten minste 6 maanden achtereen, ten hoogste 5 werkdagen ontschepingsverlof verleend.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel84
  - number: '84.4'
    text: |-
      De aanspraak op ontschepingsverlof dat binnen 12 maanden na terugkeer niet is genoten, vervalt. Het hoofd
      defensieonderdeel kan bepalen dat het ontschepingsverlof alsnog na het verstrijken van dat tijdvak wordt
      verleend, indien naar zijn oordeel bijzondere omstandigheden, verband houdende met de dienst, het verlenen van
      ontschepingsverlof aan de betrokken militair binnen dat tijdvak hebben belet.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel84
  - number: '85.1'
    text: 'Aan de militair wordt op zijn aanvraag buitengewoon verlof met behoud van militaire inkomsten verleend:'
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel85
  - number: 85.1.a
    text: tot het bijwonen van vergaderingen van organen van het georganiseerd overleg militairen;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel85
  - number: 85.1.b
    text: |-
      voor het verrichten van werkzaamheden ten behoeve van verenigingen van militairen, die
      aangesloten zijn bij een tot het overleg toegelaten centrale van overheidspersoneel als bedoeld in
      [artikel 4 van het Besluit georganiseerd overleg sector Defensie][ref1], zulks volgens bij ministeriële regeling te
      stellen regels.


      [ref1]: https://wetten.overheid.nl/BWBR0006042#Artikel4
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0006042
        artikel: '4'
  - number: 85.1.c
    text: |-
      tot het verkrijgen van woonruimte, indien de plaats waar hij in de regel zijn dienst verricht, verandert: voor ten
      hoogste twee werkdagen ingeval het land van plaatsing niet verandert, en voor ten hoogste vier werkdagen indien het
      land van plaatsing wel verandert, welke dagen desgewenst in halve dagen kunnen worden verleend;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel85
  - number: 85.1.d
    text: |-
      bij verhuizing, indien de plaats waar hij in de regel zijn dienst verricht, verandert: voor ten hoogste vier
      werkdagen, indien de militair een eigen huishouding voert, of voor ten hoogste twee werkdagen, indien zulks niet
      het geval is;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel85
  - number: 85.1.e
    text: 'bij zijn ondertrouw: voor één werkdag, indien de ondertrouw op zulk een dag valt;'
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel85
  - number: 85.1.f
    text: |-
      bij zijn huwelijk: voor vier werkdagen, met dien verstande dat de militair dat verlof desgewenst kan opnemen
      gedeeltelijk ten tijde van de voltrekking van het huwelijk en gedeeltelijk ten tijde van de godsdienstige
      plechtigheden die verband houden met het huwelijk;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel85
  - number: 85.1.g
    text: |-
      bij het huwelijk van bloed- of aanverwanten in de eerste graad, van stief- of pleegouders, dan wel van stief- of
      pleegkinderen: voor één werkdag, indien het huwelijk wordt voltrokken in de woonplaats van de militair, en voor ten
      hoogste twee werkdagen, indien het huwelijk buiten die plaats wordt voltrokken;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel85
  - number: 85.1.h
    text: |-
      bij de toekenning van een diensttijdgratificatie wegens het volbrengen van een diensttijd van 25 of 35 jaren, en
      bij zijn vijfentwintig- en veertigjarig huwelijksjubilieum: voor één werkdag, indien de datum van de gebeurtenis op
      zulk een dag valt of op zulk een dag wordt gevierd;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel85
  - number: 85.1.i
    text: |-
      tot het bijwonen van het vijfentwintig-, het veertig-, het vijftig- en het zestigjarig huwelijksjubileum van zijn
      ouders, stief-, pleeg-, schoon- of grootouders: voor één werkdag, indien het jubileum op zulk een dag valt of op
      zulk een dag wordt gevierd;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel85
  - number: 85.1.j
    text: |-
      tot het deelnemen aan een bezinningsbijeenkomst, georganiseerd door of met medewerking van een dienst van de
      geestelijke verzorging bij de krijgsmacht: eenmaal per kalenderjaar voor ten hoogste twee werkdagen;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel85
  - number: 85.1.k
    text: |-
      voor het afleggen van bezoeken of het voldoen aan oproepingen, verband houdende met het zoeken van een werkkring:
      gedurende de laatste zes maanden van zijn verblijf in werkelijke dienst voor in totaal ten hoogste vier werkdagen;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel85
  - number: '85.2'
    text: |-
      Buitengewoon verlof als bedoeld in het eerste lid wordt niet verleend en verleend verlof wordt ingetrokken, indien
      het niet zal of kan worden gebruikt voor het doel waarvoor het is bestemd.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel85
  - number: '86'
    text: |-
      In andere gevallen dan die, genoemd in [artikel 85][ref1], kan aan de militair op zijn aanvraag buitengewoon
      verlof worden verleend, indien naar het oordeel van degene die bevoegd is het verlof te verlenen bijzondere redenen
      daartoe aanleiding geven, met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel85
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '85'
        hoofdstuk: '8'
        paragraaf: 4a
  - number: 86.a
    text: de commandant dit verlof slechts kan verlenen voor ten hoogste 10 werkdagen per kalenderjaar en
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel86
  - number: 86.b
    text: |-
      het hoofd defensieonderdeel dit – zonder de onder a bedoelde beperking van het aantal werkdagen per kalenderjaar
      –, eveneens kan verlenen al of niet met behoud van militaire inkomsten of een gedeelte daarvan naar nader bij
      ministeriële regeling te stellen regels.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel86
  - number: '87.1'
    text: |-
      Het hoofd defensieonderdeel kan, indien daartoe naar zijn oordeel aanleiding bestaat, aan de militair op diens
      aanvraag buitengewoon verlof van lange duur verlenen, al of niet met behoud van militaire inkomsten en volgens
      nader bij ministeriële regeling te stellen regels.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel87
  - number: '87.2'
    text: |-
      Indien het verlof, bedoeld in het vorige lid, uitsluitend het persoonlijk belang van de militair dient, kan hem dat
      verlof slechts worden verleend zonder behoud van militaire inkomsten.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel87
  - number: '87.3'
    text: |-
      Indien het verlof, bedoeld in het eerste lid, ten doel heeft de militair in de gelegenheid te stellen een
      functie buiten de krijgsmacht te vervullen en met de verlening van het verlof naar het oordeel van het hoofd
      defensieonderdeel niet alleen het persoonlijke belang van de militair, maar mede het algemeen belang wordt gediend,
      kan het verlof - onverminderd het bepaalde in het vierde lid - in beginsel worden verleend voor ten hoogste een
      jaar en zonder behoud van militaire inkomsten.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel87
  - number: '87.4'
    text: |-
      Indien het verlof, bedoeld in het eerste lid, ten doel heeft de militair in de gelegenheid te stellen anders dan
      in vaste dienst, hetzij een functie te vervullen in dienst van een volkenrechtelijke organisatie, hetzij tijdelijk
      werkzaam te zijn ten behoeve van de Nederlandse Antillen dan wel als deskundige ten behoeve van een vreemde
      mogendheid, en naar het oordeel van het hoofd defensieonderdeel met de verlening van het verlof in overwegende mate
      het algemeen belang wordt gediend, kan het verlof in beginsel worden verleend voor ten hoogste drie jaren en zonder
      behoud van militaire inkomsten.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel87
  - number: '87.5'
    text: |-
      Het verlof, bedoeld in de vorige leden, gaat niet eerder in dan na aanvaarding van dat verlof met de daaraan
      verbonden voorwaarden door de militair.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel87
  - number: 87a.1
    text: |-
      Onverminderd [artikel 4:1 van de Wet arbeid en zorg][ref1] wordt aan de militair buitengewoon verlof met behoud van
      militaire inkomsten verleend: - bij plotselinge ziekte van de echtgenote of echtgenoot van de militair, de persoon
      met wie de militair ongehuwd samenwoont of een van zijn bloed- of aanverwanten in de eerste graad of wanneer
      een andere noodsituatie, waarvoor de militair onverwijld een voorziening moet treffen, ontstaat: voor de duur
      benodigd voor de eerste opvang en het treffen van verdere voorzieningen, maar voor ten hoogste één werkdag per zich
      voordoende situatie;
        - bij de bevalling van zijn echtgenote of de persoon met wie de militair ongehuwd samenwoont;
        - bij overlijden en lijkbezorging van de echtgenote of echtgenoot van de militair, de persoon met wie de militair
      ongehuwd samenwoont of een van zijn bloed- en aanverwanten in de eerste graad: vanaf het overlijden tot en met
      de dag van de begrafenis of de crematie en indien sprake is van bijzondere godsdienstige plechtigheden zoveel
      werkdagen als benodigd om overeenkomstig de bepalingen van die godsdienst rouwceremoniën te verrichten;
        - bij overlijden van: bloed- of aanverwanten in de 2e graad, dan wel van pleegbroers of -zusters: voor ten hoogste
      2 werkdagen; bloed- of aanverwanten in de 3e of 4e graad of een van zijn huisgenoten: voor 1 werkdag, met dien
      verstande dat indien de militair is belast met de regeling van de begrafenis, de crematie of van de nalatenschap
      dan wel van beide, het verlof voor ten hoogste 4 werkdagen kan worden verleend en indien sprake is van bijzondere
      godsdienstige plechtigheden zoveel werkdagen als benodigd om overeenkomstig de bepalingen van die godsdienst
      rouwceremoniën te verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel4
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel87a
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '4'
  - number: 87a.2
    text: |-
      De militair meldt vooraf aan de commandant dat hij het verlof, bedoeld in het eerste lid, opneemt onder opgave
      van de reden. Indien dit niet mogelijk is, meldt de militair het opnemen van het verlof zo spoedig mogelijk aan de
      commandant onder opgave van de reden.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel87a
  - number: 87a.3
    text: |-
      Het verlof, bedoeld in het eerste lid, vangt niet aan of eindigt in ieder geval zodra de commandant aan hem kenbaar
      maakt dat tegen het opnemen van het verlof onderscheidenlijk de voortzetting daarvan een zodanig zwaarwegend
      dienstbelang bestaat, dat het belang van de militair daarvoor naar maatstaven van redelijkheid en billijkheid moet
      wijken.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel87a
  - number: 87a.4
    text: |-
      Van een zwaarwegend dienstbelang als bedoeld in het derde lid, is in ieder geval sprake bij het varen, het vliegen
      en oefeningen en de direct daarmee samenhangende werkzaamheden als mede de daadwerkelijke inzet van de krijgsmacht
      en de voorbereiding daarop.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel87a
  - number: 87a.5
    text: |-
      De commandant kan achteraf van de militair verlangen dat hij aannemelijk maakt dat hij geen dienst heeft kunnen
      verrichten wegens een van de redenen, genoemd in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel87a
  - number: 87b
    text: |-
      Het kort durend zorgverlof, bedoeld in [hoofdstuk 5 van de Wet arbeid en zorg][ref1], wordt verleend met behoud van
      militaire inkomsten.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel87b
    references:
      - id: ref1
        bwb_id: BWBR0013008
        hoofdstuk: '5'
  - number: 87c.1
    text: |-
      Aan de militair wordt langer durend zorgverlof met behoud van militaire inkomsten verleend voor hulpverlening aan
      een tijdelijk ernstig hulpbehoevende of stervende echtgenote, echtgenoot of persoon met wie de militair ongehuwd
      samenwoont, ouders, stief-, pleeg- of schoonouders, eigen of aangehuwde kinderen, stief- of pleegkinderen.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel87c
  - number: 87c.2
    text: |-
      Voor de toepassing van dit artikel is [artikel 87a][ref1], tweede tot en met vijfde lid, van overeenkomstige
      toepassing, waarbij de militair bij de melding, bedoeld in [artikel 87a, tweede lid][ref2], ook de omvang, de wijze
      van opneming en zo mogelijk de vermoedelijke duur van het verlof aangeeft.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel87a
      [ref2]: https://wetten.overheid.nl/BWBR0003482#Artikel87a
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel87c
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: 87a
        hoofdstuk: '8'
        paragraaf: 4b
      - id: ref2
        bwb_id: BWBR0003482
        artikel: 87a
        hoofdstuk: '8'
        paragraaf: 4b
  - number: 87d.1
    text: |-
      Wanneer aan de militair door de commandant ouderschapsverlof, als bedoeld in
      [hoofdstuk 6 van de Wet arbeid en zorg][ref1], wordt verleend, behoudt hij over de eerste periode van het
      ouderschapsverlof, die overeenkomt met dertien maal de voor de militair geldende arbeidsduur per week, 75% van
      zijn bezoldiging. Over de resterende periode van het verleende ouderschapsverlof, ontvangt de militair over de
      ouderschapsverlofuren geen bezoldiging.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel87d
    references:
      - id: ref1
        bwb_id: BWBR0013008
        hoofdstuk: '6'
  - number: 87d.2
    text: |-
      De militair kan door de commandant worden verplicht tot terugbetaling van de tijdens het ouderschapsverlof genoten
      inkomsten wanneer hem tijdens de verlofperiode of binnen één jaar na afloop van het ouderschapsverlof ontslag wordt
      verleend op zijn aanvraag dan wel op grond van aan de militair te wijten omstandigheden. Indien binnen één jaar na
      afloop van het ouderschapsverlof ontslag wordt verleend, wordt de verplichting tot terugbetaling naar evenredigheid
      beperkt. Indien het ontslag verband houdt met een aanstelling als burgerlijk ambtenaar bij het Ministerie van
      Defensie of indiensttreding bij een andere overheidssector bestaat geen verplichting tot terugbetaling.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel87d
  - number: 87d.3
    text: |-
      De militair meldt het voornemen om ouderschapsverlof op te nemen ten minste zes maanden voor het tijdstip van
      ingang van het verlof schriftelijk aan de commandant.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel87d
  - number: 87d.4
    text: |-
      De commandant kan bepalen dat de aanspraak op ouderschapsverlof op grond van zwaarwegend dienstbelang
      wordt opgeschort tot een later tijdstip, waarbij kan worden afgeweken van de datum, waarop op grond van
      [artikel 6:4 van de Wet arbeid en zorg][ref1] geen recht bestaat op ouderschapsverlof.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel6
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel87d
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '6'
  - number: 87e
    text: |-
      Wanneer aan de militair door de commandant aanvullend geboorteverlof als bedoeld in
      [hoofdstuk 4 van de Wet arbeid en zorg][ref1] wordt verleend, behoudt hij over de periode van het aanvullend
      geboorteverlof dat ten hoogste vijf gehele weken bedraagt gebaseerd op de voor de militair geldende arbeidsduur per
      week, 75% van zijn bezoldiging.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel87e
    references:
      - id: ref1
        bwb_id: BWBR0013008
        hoofdstuk: '4'
  - number: '88.1'
    text: |-
      Voor de toepassing van dit hoofdstuk wordt, ingeval het betreft buitengewoon verlof anders dan van lange duur of
      buitengewoon verlof in het kader van arbeid en zorg, toekomend aan een militair die werkzaamheden en/of diensten
      in continu- of ploegendienst verricht, onder werkdag verstaan elke tijdseenheid van ten hoogste vierentwintig
      uur gedurende welke de militair volgens het voor hem geldende rooster zodanige werkzaamheden en/of diensten moet
      verrichten.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel88
  - number: '88.2'
    text: |-
      Indien aan de in het eerste lid bedoelde militair met toepassing van [artikel 85][ref1], [86][ref2] of
      [paragraaf 4b][ref3] buitengewoon verlof onderscheidenlijk buitengewoon verlof in het kader van arbeid en zorg
      wordt verleend kan daarbij:


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel85
      [ref2]: https://wetten.overheid.nl/BWBR0003482#Artikel86
      [ref3]: https://wetten.overheid.nl/BWBR0003482#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel88
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '85'
