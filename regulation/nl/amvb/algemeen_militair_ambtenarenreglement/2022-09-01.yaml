  - number: '108.1'
    text: |-
      Aan de militair kan gedurende zijn verblijf in werkelijke dienst, naar regels bij ministeriële regeling te stellen,
      door de commandant van rijkswege huisvesting worden verleend.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel108
  - number: '108.2'
    text: |-
      De huisvesting van rijkswege wordt zoveel mogelijk verleend bij de eenheid of het onderdeel waar de militair is
      tewerkgesteld.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel108
  - number: '108.3'
    text: |-
      Bij ministeriële regeling kunnen omstandigheden worden aangegeven waarin de militair verplicht is gebruik te maken
      van de gelegenheid tot nachtverblijf die hem van rijkswege is geboden.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel108
  - number: '109.1'
    text: |-
      Aan de militair kan gedurende zijn verblijf in werkelijke dienst, naar regels bij ministeriële regeling te stellen,
      door de commandant van rijkswege voeding worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel109
  - number: '109.2'
    text: |-
      Bij ministeriële regeling kan worden bepaald dat de verstrekking van huisvesting van rijkswege geschiedt in
      combinatie met de verstrekking van voeding van rijkswege.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel109
  - number: '110'
    text: |-
      De militair die buiten zijn woonplaats is tewerkgesteld en uitsluitend om redenen van dienst gewoonlijk niet
      dagelijks heen en weer kan reizen tussen die woonplaats en de plaats waar hij in de regel zijn dienst verricht,
      kan, naar regels bij ministeriële regeling te stellen, een vergoeding worden toegekend ter zake van de kosten
      wegens het zelf voorzien in huisvesting of voeding.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel110
  - number: '111.1'
    text: |-
      De niet in werkelijke dienst verblijvende militair en de gewezen militair die in bij ministeriële regeling te
      bepalen gevallen moeten reizen teneinde te voldoen van een oproep van het bevoegde gezag, dan wel in verband met
      het verwezenlijken van aanspraken op grond van artikel 104, hebben volgens bij ministeriële regeling te stellen
      regels aanspraak op vervoer voor rekening van het Rijk alsmede op een tegemoetkoming in de noodzakelijk gemaakte
      verblijfkosten, voor zover zij hierop niet uit anderen hoofde aanspraak kunnen doen gelden.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel111
  - number: '111.2'
    text: |-
      Indien een militair of een gewezen militair, als bedoeld in het eerste lid, naar het oordeel van de functionaris,
      bij wie hij zich moet vervoegen, niet alleen kan reizen, is het eerste lid van overeenkomstige toepassing op degene
      die hem begeleidt.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel111
  - number: '112.1'
    text: |-
      De niet in werkelijke dienst verblijvende militair en de gewezen militair die inkomsten derven wegens het voldoen
      aan een oproep van het bevoegde gezag, danwel in verband met het verwezenlijken van aanspraken op grond van artikel
      104, hebben in bij ministeriële regeling te bepalen gevallen aanspraak op een uitkering ter zake van gederfde
      inkomsten over de tijd die zij als gevolg daarvan noodzakelijk hebben verlet, voorzover zij hierop niet uit anderen
      hoofde recht kunnen doen gelden.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel112
  - number: '112.2'
    text: |-
      Het bedrag van de uitkering, bedoeld in het vorige lid, is gelijk aan dat van de
      gederfde netto-inkomsten, maar beloopt per dag ten hoogste het bedrag, genoemd in
      [artikel 17, eerste lid, van de Wet financiering sociale verzekeringen][ref1] met betrekking tot een loontijdvak
      van een dag, eventueel gewijzigd krachtens [artikel 18 van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel18
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '17'
      - id: ref2
        bwb_id: BWBR0017745
        artikel: '18'
  - number: '112.3'
    text: |-
      Indien een militair of een gewezen militair, als bedoeld in het eerste lid, naar het oordeel van de functionaris,
      bij wie hij zich moet vervoegen, niet alleen kan reizen, zijn het eerste en het tweede lid van overeenkomstige
      toepassing op degene die hem begeleidt.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel112
  - number: '113.1'
    text: |-
      In geval van verpleging in een zieken- of verplegingsinrichting van een militair in werkelijke dienst kan aan diens
      naaste betrekkingen een tegemoetkoming worden verleend in de kosten van vervoer en van verblijf ter zake van reizen
      die zij tot het bezoeken van de militair hebben gemaakt.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel113
  - number: '113.2'
    text: |-
      In geval van overlijden van een militair in werkelijke dienst kan aan diens naaste betrekkingen een tegemoetkoming
      als bedoeld in het eerste lid worden verleend ter zake van reizen die zij tot het bezoeken van het stoffelijk
      overschot hebben gemaakt.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel113
  - number: '113.3'
    text: |-
      Een tegemoetkoming als bedoeld in het eerste en tweede lid kan in de aldaar bedoelde gevallen eveneens worden
      verleend aan de naaste betrekkingen van de niet in werkelijke dienst verblijvende militair of van de gewezen
      militair die wordt of - ten tijde van zijn overlijden - werd verpleegd in een zieken- of verplegingsinrichting.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel113
  - number: '113.4'
    text: |-
      Indien de betrekkingen van de militair of de gewezen militair, in dit artikel, naar het oordeel van het hoofd
      defensieonderdeel niet alleen kunnen reizen, zijn de vorige leden van overeenkomstige toepassing op degene die
      hen begeleidt.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel113
  - number: '113.5'
    text: Bij ministeriële regeling worden regels gesteld omtrent het verlenen van de tegemoetkoming bedoeld in dit artikel.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel113
  - number: 113a.1
    text: |-
      Voor de toepassing van dit artikel worden onder belanghebbenden begrepen de echtgenote, ouders, pleeg-, stief-
      of schoonouders, grootouders, zwagers en schoonzusters, eigen kinderen, stief- of pleegkinderen, kleinkinderen,
      voogden, verloofde, broers en zusters.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel113a
  - number: 113a.2
    text: |-
      Aan de militair in werkelijke dienst die ingevolge een dienstopdracht in het buitenland verblijft, kunnen door het
      hoofd defensieonderdeel voor rekening van het rijk berichten worden verzonden in geval van:
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel113a
  - number: 113a.2.a
    text: overlijden van belanghebbenden;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel113a
  - number: 113a.2.b
    text: ziekte of ongeval van belanghebbenden;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel113a
  - number: 113a.2.c
    text: bevalling van de echtgenote;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel113a
  - number: 113a.2.d
    text: |-
      bijzondere gevallen, die naar het oordeel van de met berichtgeving belaste ambtenaar onmiddellijk aan de militair
      moeten worden bericht.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel113a
  - number: '114'
    text: |-
      Aan de militair die om redenen van dienst verblijft buiten het land, waar zijn gezin woonachtig is, kan door het
      hoofd defensieonderdeel worden toegestaan voor rekening van het rijk voortijdig naar dat land terug te keren of
      over te komen, indien naar het oordeel van het hoofd defensieonderdeel omstandigheden in het gezin die terugkeer of
      die overkomst noodzakelijk maken.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel114
  - number: 114a.1
    text: |-
      Voor de toepassing van dit artikel wordt onder kinderopvang en gastouderopvang verstaan hetgeen daaronder wordt
      verstaan in [artikel 1.1, eerste lid, van de Wet kinderopvang][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel114a
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '1'
  - number: 114a.2
    text: |-
      Door het hoofd defensieonderdeel kan naar bij ministeriële regeling te stellen regels, financieel worden
      bijgedragen in de kosten van de militair voor kinderopvang of gastouderopvang van een of meerdere kinderen.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel114a
  - number: 114a.3
    text: |-
      De bijdrage, als bedoeld in het tweede lid, eindigt met ingang van de dag waarop de militair ontslag wordt
      verleend.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel114a
  - number: 114a.4
    text: |-
      Wanneer sprake is van een ontslag op grond van [artikel 39, tweede lid, onder d][ref1], van dit besluit, eindigt de
      bijdrage, als bedoeld in het tweede lid, in afwijking van het vierde lid, 6 maanden na de datum waarop dat ontslag
      is ingegaan, of op het moment dat uit andere hoofde aanspraak bestaat op een bijdrage, als bedoeld in het tweede
      lid. Gedurende deze periode van 6 maanden blijft de situatie van voor het ontslag ongewijzigd gehandhaafd.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel39
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel114a
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '39'
        hoofdstuk: '6'
  - number: '115'
    text: |-
      Onze Minister kan de militair naar billijkheid schadeloos stellen voor schaden anders dan bedoeld in
      [artikel 26 van het Inkomstenbesluit militairen][ref1] en is bevoegd hieromtrent voor groepen van militairen regels
      te geven.


      [ref1]: https://wetten.overheid.nl/BWBR0007816#Artikel26
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel115
    references:
      - id: ref1
        bwb_id: BWBR0007816
        artikel: '26'
  - number: '117.1'
    text: |-
      De militair heeft met betrekking tot de uniformkleding en andere goederen, behorende tot zijn persoonlijke
      standaarduitrusting, aanspraak hetzij op een verstrekking van rijkswege en voor rekening van het rijk in natura,
      hetzij op een tegemoetkoming in de kosten van aanschaffing.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel117
  - number: '117.2'
    text: |-
      Met betrekking tot de uniformkleding en andere goederen, bedoeld in het vorige lid, die de militair in eigendom
      moet hebben, kan hem een tegemoetkoming worden verleend in de kosten van onderhoud en vernieuwing en in de kosten
      van voorgeschreven veranderingen van die kleding en goederen.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel117
  - number: '117.3'
    text: |-
      Aan de militair kan in bij ministeriële regeling aan te wijzen gevallen een tegemoetkoming in de kosten van
      aanschaffing of van onderhoud en vernieuwing worden verleend ter zake van uniformkleding en andere goederen die
      niet tot zijn persoonlijke standaarduitrusting behoren, maar die hij niettemin in eigendom moet hebben, alsmede
      ter zake van burgerkleding van hemzelf en - in geval van uitzending van de militair met zijn gezin naar bij
      ministeriële regeling aan te wijzen gebieden - van kleding van leden van zijn gezin.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel117
  - number: '117.4'
    text: |-
      De verstrekking in natura en die van de tegemoetkomingen, bedoeld in het eerste tot en met derde lid, geschieden
      naar regels bij ministeriële regeling te stellen.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel117
  - number: '118.1'
    text: |-
      Indien een militair in Nederland overlijdt terwijl hij om redenen van dienst buiten zijn woonplaats verbleef,
      worden aan de nabestaanden de kosten vergoed van het doen overbrengen van het stoffelijk overschot naar een plaats
      van keuze in Nederland.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel118
  - number: '118.2'
    text: |-
      Indien een militair in werkelijke dienst overlijdt en het overlijden verband houdt met de uitoefening van de
      militaire dienst, wordt aan de nabestaanden een tegemoetkoming in de kosten van lijkbezorging verleend tot maximaal
      € 5 000.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel118
  - number: '118.3'
    text: |-
      Indien een militair in werkelijke dienst overlijdt ten gevolge van een vliegongeval tijdens een dienstreis als
      bedoeld in [artikel 1, onder d, van het Besluit dienstreizen defensie][ref1], wordt aan de nabestaanden een som
      ineens ten bedrage van € 15.000 toegekend. Deze aanspraak vervalt indien aanspraak bestaat op een uitkering op
      grond van [artikel 20 van het Inkomstenbesluit militairen][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007956#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007816#Artikel20
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel118
    references:
      - id: ref1
        bwb_id: BWBR0007956
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0007816
        artikel: '20'
  - number: '118.4'
    text: |-
      Tenzij Onze Minister anders bepaalt, is dit artikel niet van toepassing in buitengewone omstandigheden en ten
      aanzien van militairen die zijn overleden in de tijd waarin zij waren ingedeeld bij een eenheid of onderdeel van
      de krijgsmacht, waaraan de bekendmaking, bedoeld in [artikel 71 van het Wetboek van Militair Strafrecht][ref1],
      is gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0001869#Artikel71
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel118
    references:
      - id: ref1
        bwb_id: BWBR0001869
        artikel: '71'
  - number: 118a.1
    text: 'In geval van overlijden van de militair wordt een uitkering verstrekt:'
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel118a
  - number: 118a.1.a
    text: aan de echtgenoot van de militair, dan wel
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel118a
  - number: 118a.1.b
    text: |-
      indien de militair geen echtgenoot heeft nagelaten, aan of ten behoeve van het kind of de kinderen waarvoor
      aanspraak op kinderbijslag bestaat, dan wel
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel118a
  - number: 118a.1.c
    text: |-
      indien de militair geen echtgenoot of kinderen als bedoeld onder b heeft nagelaten, aan zijn ouders, broers,
      zusters of kinderen waarvoor geen aanspraak op kinderbijslag bestaat, indien hij naar het oordeel van het hoofd
      defensieonderdeel in de noodzakelijke kosten van hun levensonderhoud grotendeels bijdroeg.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel118a
  - number: 118a.2
    text: |-
      Indien het eerste lid geen toepassing kan vinden, kan het hoofd defensieonderdeel de uitkering geheel of
      gedeeltelijk doen aanwenden ter bestrijding van de kosten van de laatste ziekte en de begrafenis of crematie van
      de militair.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel118a
  - number: 118a.3
    text: |-
      De uitkering is gelijk aan driemaal het bedrag van de bezoldiging waarop de militair op de dag van zijn overlijden
      aanspraak had, vermeerderd met het bedrag per maand van de andere inkomsten die in aanmerking worden genomen bij de
      vaststelling van de pensioengrondslag, ongeacht of hij daarover pensioenbijdrage was verschuldigd.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel118a
  - number: 118a.4
    text: |-
      In voorkomend geval wordt de bezoldiging, bedoeld in het derde lid, verhoogd met de toelage-buitenland, bedoeld in
      het Voorzieningenstelsel buitenland defensiepersoneel.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel118a
  - number: 118a.5
    text: |-
      Op de uitkering worden de aan de militair reeds vóór zijn overlijden betaalde inkomsten met betrekking tot een na
      zijn overlijden gelegen tijdvak, in mindering gebracht.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel118a
  - number: 118a.6
    text: |-
      De [artikelen 54g][ref1], [71a, eerste lid][ref2], en [80b, eerste lid][ref3], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel54g
      [ref2]: https://wetten.overheid.nl/BWBR0003482#Artikel71a
      [ref3]: https://wetten.overheid.nl/BWBR0003482#Artikel80b
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel118a
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: 54g
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0003482
        artikel: 71a
        hoofdstuk: '8'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0003482
        artikel: 80b
        hoofdstuk: '8'
        paragraaf: '3'
  - number: 118b
    text: |-
      Het hoofd defensieonderdeel kan [artikel 118a][ref1] van overeenkomstige toepassing verklaren in geval van
      vermissing van de militair.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel118a
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel118b
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: 118a
        hoofdstuk: '10'
  - number: '119.1'
    text: |-
      Naar regels bij ministeriële regeling te stellen, kunnen de naaste betrekkingen van een militair die vermist
      is geraakt bij de uitoefening van de dienst dan wel ten gevolge van bijzondere omstandigheden die zich bij de
      uitoefening van de dienst hebben voorgedaan, in aanmerking komen voor bemiddeling van Onze Minister bij het voeren
      van de procedure tot het verkrijgen van een verklaring, dat rechtsvermoeden van overlijden van de vermiste militair
      bestaat.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel119
  - number: '119.2'
    text: |-
      De naaste betrekkingen van een militair als bedoeld in het vorige lid hebben, indien de procedure, bedoeld in
      dat lid, niet kosteloos kan worden gevoerd, naar regels bij ministeriële regeling te stellen, aanspraak op een
      vergoeding van de kosten die ter zake voor hun rekening zijn gekomen.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel119
  - number: '119.3'
    text: |-
      Het hoofd defensieonderdeel kan, indien een gezinslid van een militair vermist is geraakt ten gevolge van
      omstandigheden die naar zijn oordeel verband houden met de dienst van de militair, ten aanzien van die militair
      overeenkomstige voorzieningen treffen.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel119
  - number: '120.1'
    text: 'Voor de toepassing van dit artikel wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel120
  - number: 120.1.a
    text: '*gewezen militair:* de militair die is ontslagen uit de dienst bij het beroepspersoneel;'
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel120
  - number: 120.1.b
    text: |-
      *laatstelijk genoten bezoldiging:* de som van de geldelijke inkomsten per maand, die in aanmerking worden genomen
      bij de vaststelling van de pensioengrondslag van de militair, zulks naar de toestand op de dag voorafgaande aan
      het ontslag.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel120
  - number: '120.2'
    text: |-
      De gewezen militair die wegens ziekte of een gebrek, ontstaan voor het tijdstip van ingang van zijn ontslag,
      nadien nog ongeschikt is voor het verrichten van naar aard en omvang soortgelijke arbeid als die welke als militair
      werd verricht, heeft gedurende een termijn van twaalf maanden na zijn ontslag aanspraak op zijn laatstelijk
      genoten bezoldiging. Vervolgens heeft hij aanspraak op 70% van zijn laatstelijk genoten bezoldiging. Het in de
      vorige volzin bepaalde geldt slechts voor zover de termijn van achttien kalendermaanden, gerekend vanaf de eerste
      ziektedag, nog niet is verstreken.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel120
  - number: '120.3'
    text: |-
      De gewezen militair die binnen een maand na het tijdstip van ingang van zijn ontslag wegens ziekte of een gebrek
      ongeschikt wordt voor het verrichten van naar aard en omvang soortgelijke arbeid als die welke als militair werd
      verricht, heeft, mits hij gedurende twee maanden onmiddellijk aan evenbedoeld tijdstip voorafgaande in werkelijke
      dienst is geweest, naar regels bij ministeriële regeling te stellen, gedurende die ongeschiktheid, doch uiterlijk
      tot een jaar na de aanvang daarvan, aanspraak op de laatstelijk genoten bezoldiging.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel120
  - number: '120.4'
    text: |-
      Indien de gewezen militair binnen een tijdvak van vier weken, nadat de volgens het tweede en derde lid geregelde
      doorbetaling van zijn laatstelijk genoten bezoldiging in verband met zijn herstel is gestaakt, wederom wegens
      ziekte of een gebrek ongeschikt wordt voor het verrichten van naar aard en omvang soortgelijke arbeid als die
      welke als militair werd verricht, wordt de nieuw opgetreden ongeschiktheid als een voortzetting van de vorige
      ongeschiktheid beschouwd en wordt de doorbetaling van de laatstelijk genoten bezoldiging hervat. Voor het bepalen
      van het tijdstip, waarop de in het tweede en derde lid bedoelde termijnen zijn verstreken, worden perioden van
      in die leden bedoelde ongeschiktheid welke elkaar met een onderbreking van minder dan vier weken zijn opgevolgd,
      samengeteld.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel120
  - number: 120.5.a
    text: |-
      Het tweede, derde en vierde lid zijn eveneens van toepassing op de gewezen vrouwelijke militair die na afloop van
      de periode gedurende welke zij in verband met zwangerschap of bevalling aanspraak heeft op een uitkering op basis
      van [hoofdstuk 3 van de Wet arbeid en zorg][ref1] nog wegens ziekte arbeidsongeschikt is voor het verrichten van
      naar aard en omvang soortgelijke arbeid als die welke als militair werd verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel120
    references:
      - id: ref1
        bwb_id: BWBR0013008
        hoofdstuk: '3'
  - number: 120.5.b
    text: De in het derde lid bedoelde termijn van een jaar vangt aan op de dag na die van de bevalling.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel120
  - number: '120.6'
    text: |-
      De voorgaande leden vinden geen toepassing op de gewezen militair die op het tijdstip van ingang van zijn ontslag
      ongeschikt is dan wel binnen een maand daarna ongeschikt wordt, en op de gewezen vrouwelijke militair wier
      ongeschiktheid na het tijdstip, bedoeld in het vorige lid onder b, voortduurt, vanaf de dag met ingang waarvan zij
      na evenbedoelde tijdstippen in verband met de aanvaarding van een volledige betrekking aanspraak kunnen maken op
      loon of bezoldiging, dan wel op een uitkering krachtens de [Ziektewet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel120
    references:
      - id: ref1
        bwb_id: BWBR0001888
  - number: '120.7'
    text: 'De aanspraak op de laatstelijk genoten bezoldiging bestaat niet indien de betrokkene:'
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel120
  - number: 120.7.a
    text: |-
      de ziekte of het gebrek heeft voorgewend, althans zodanig overdreven voorgesteld, dat ongeschiktheid tot het
      verrichten van naar aard en omvang soortgelijke arbeid als die welke als militair werd verricht, niet kan worden
      aangenomen; of
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel120
  - number: 120.7.b
    text: |-
      de ongeschiktheid tot het verrichten van naar aard en omvang soortgelijke arbeid als die welke als militair werd
      verricht, opzettelijk heeft veroorzaakt, tenzij hem daarvan op grond van zijn psychische toestand geen verwijt kan
      worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel120
  - number: '120.8'
    text: |-
      De uitbetaling van de laatstelijk genoten bezoldiging wordt gestaakt, indien en voor zolang de betrokkene de door
      Onze Minister krachtens het tweede of derde lid vastgestelde voorschriften niet nakomt.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel120
  - number: '120.9'
    text: 'Het bedrag van de laatstgenoten bezoldiging, bedoeld in dit artikel, wordt in voorkomende gevallen:'
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel120
  - number: 120.9.a
    text: |-
      gewijzigd overeenkomstig een algemene herziening die voor de betrokkene zou hebben gegolden, ware hij niet
      ontslagen;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel120
  - number: 120.9.b
    text: |-
      verminderd na toepassing van [artikel 120a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel120a
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel120
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: 120a
        hoofdstuk: '10'
  - number: 120.9.c
    text: 'verminderd met:'
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel120
  - number: 120.9.c.1
    text: |-
      de periodieke inkomsten waarop hij uit hoofde van het laatstelijk door hem beklede ambt na het ontslag aanspraak
      kan maken;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel120
  - number: 120.9.c.2
    text: |-
      inkomsten die hij inmiddels mocht zijn gaan genieten uit of in verband met arbeid of bedrijf. Bij deze vermindering
      wordt uitgegaan van de volledige laatstgenoten bezoldiging.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel120
  - number: 120a.1
    text: |-
      Indien de gewezen militair, bedoeld in [artikel 120][ref1], recht heeft op een uitkering op grond van een
      werknemersverzekering, dan wel een bovenwettelijke WW-uitkering berustend op de dienstbetrekking waaraan de
      laatstgenoten bezoldiging is verbonden, wordt die uitkering daarop in mindering gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel120
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel120a
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '120'
        hoofdstuk: '10'
  - number: 120a.2
    text: |-
      Indien als gevolg van handelingen of het nalaten van handelingen door die gewezen militair geen uitkering op grond
      van de [WAO][ref1] wordt toegekend, wordt voor de toepassing van het eerste lid uitgegaan van een uitkering op
      grond van [die wet][ref2], zoals die zou zijn toegekend bij een arbeidsongeschiktheid van 80% of meer.


      [ref1]: https://wetten.overheid.nl/BWBR0002524
      [ref2]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel120a
    references:
      - id: ref1
        bwb_id: BWBR0002524
      - id: ref2
        bwb_id: BWBR0002524
  - number: 120a.3
    text: |-
      Indien als gevolg van handelingen of het nalaten van handelingen door die gewezen militair het bedrag van de
      uitkering op grond van de in het eerste lid bedoelde werknemersverzekering of een bovenwettelijke WW-uitkering
      een vermindering ondergaat, dan wel de aanspraak daarop geheel of gedeeltelijk niet wordt toegekend, wordt deze
      uitkering voor de toepassing van het eerste lid steeds aangemerkt als een uitkering die onverminderd is genoten.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel120a
  - number: 120a.4
    text: |-
      Indien die gewezen militair over een periode ter zake van de dienstbetrekking waaraan de laatstgenoten bezoldiging
      is verbonden aanspraak heeft of had kunnen hebben op een uitkering op grond van de [ZW][ref1] of de [WAO][ref2], is
      het verplichtingen- en sanctieregime van [die wet][ref3] over die periode van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0002524
      [ref3]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel120a
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0002524
      - id: ref3
        bwb_id: BWBR0002524
  - number: 120a.5
    text: |-
      Indien ten aanzien van die wettelijke uitkering een verplichting wordt opgelegd of een sanctie wordt toegepast,
      wordt door de commandant operationeel commando zoveel mogelijk dezelfde verplichting opgelegd dan wel een
      overeenkomstige sanctie toegepast op het verminderde bedrag van de laatstgenoten bezoldiging.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel120a
  - number: 120a.6
    text: |-
      De aanspraak op doorbetaling van bezoldiging ingevolge [artikel 120][ref1] vervalt, indien de gewezen militair
      zonder deugdelijke grond weigert de hem door de commandant operationeel commando aangeboden gangbare arbeid,
      waartoe de militair geneeskundige dienst hem in staat acht, te aanvaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel120
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel120a
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '120'
        hoofdstuk: '10'
  - number: '124.1'
    text: |-
      De niet in werkelijke dienst verblijvende militair en de gewezen militair, die verplicht tot het reserve-personeel
      behoort onderscheidenlijk laatstelijk heeft behoord, hebben, indien zij ten gevolge van een ziekte of een gebrek,
      verband houdende met de uitoefening van de dienst, tijdelijk niet in staat zijn:
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel124
  - number: 124.1.a
    text: |-
      de inkomsten te verwerven die zij uit hoofde van hun beroep of bedrijf gemiddeld verdienden of zouden kunnen
      verdienen, dan wel
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel124
  - number: 124.1.b
    text: |-
      de inkomsten te verwerven die zij - zo de inkomsten, bedoeld onder *a*, niet kunnen worden vastgesteld - zouden
      kunnen verdienen met arbeid die voor hun krachten en bekwaamheid is berekend
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel124
  - number: '124.2'
    text: |-
      Het bedrag van de uitkering is gelijk aan het verschil tussen de inkomsten, bedoeld in het vorige lid onder *a*
      of *b*, en de inkomsten waarop de belanghebbende uit anderen hoofde aanspraak heeft of aanspraak had kunnen maken
      gedurende de tijd waarin hij verkeert in de omstandigheid, bedoeld in dat lid. De uitkering wordt uitbetaald in
      maandelijkse termijnen.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel124
  - number: '124.3'
    text: |-
      Voor de toepassing van de vorige leden worden als inkomsten waarop de belanghebbende uit anderen hoofde aanspraak
      kan maken, aangemerkt:
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel124
  - number: 124.3.a
    text: uitkeringen op grond van artikel 123;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel124
  - number: 124.3.b
    text: inkomsten uit of in verband met arbeid of bedrijf;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel124
  - number: 124.3.c
    text: |-
      uitkeringen krachtens de [Wet arbeidsongeschiktheidsvoorziening militairen][ref1] (*Stb.* 1972, 313) of krachtens
      enige sociale verzekeringswet;


      [ref1]: https://wetten.overheid.nl/BWBR0002822
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel124
    references:
      - id: ref1
        bwb_id: BWBR0002822
  - number: 124.3.d
    text: uitkeringen wegens een particuliere verzekering ter zake van de geldelijke gevolgen van arbeidsongeschiktheid;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel124
  - number: 124.3.e
    text: |-
      inkomsten ingevolge de bij of krachtens de [Kaderwet militaire pensioenen][ref1] vastgestelde bepalingen
      met uitzondering van een bedrag, gelijk aan dat van het invaliditeitspensioen, alsmede van de bijzondere
      invaliditeitsverhoging ingevolge die bepalingen.


      [ref1]: https://wetten.overheid.nl/BWBR0011955
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel124
    references:
      - id: ref1
        bwb_id: BWBR0011955
  - number: '124.4'
    text: 'Onze Minister kan in naar zijn oordeel bijzondere gevallen:'
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel124
  - number: 124.4.a
    text: de termijn van twee jaren, genoemd in het eerste lid, verlengen;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel124
  - number: 124.4.b
    text: op de uitkering een suppletie verlenen.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel124
  - number: '125.1'
    text: |-
      Na het overlijden van: a. de gewezen militair die op de dag van het overlijden in het genot was van een uitkering
      ingevolge [artikel 120][ref1]; b. de gewezen militair die op de dag van het overlijden in het genot was van een
      uitkering ingevolge [artikel 124][ref2]; wordt een bedrag uitgekeerd aan de volgende nagelaten betrekkingen: 1°.
      aan de langstlevende der echtgenoten, tenzij zij duurzaam gescheiden leefden; 2°. bij ontstentenis van de onder 1°
      bedoelde echtgenote, ten behoeve van het kind of de kinderen voor wie de overledene aanspraak op kinderbijslag had;
      3°. bij ontstentenis van de onder 1° en 2° bedoelde betrekkingen, aan of ten behoeve van de ouders, broers, zusters
      of kinderen van de overledene, voor wie hij naar het oordeel van de commandant operationeel commando grotendeels in
      de noodzakelijke kosten van levensonderhoud bijdroeg.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel120
      [ref2]: https://wetten.overheid.nl/BWBR0003482#Artikel124
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel125
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '120'
        hoofdstuk: '10'
      - id: ref2
        bwb_id: BWBR0003482
        artikel: '124'
        hoofdstuk: '10'
  - number: '125.2'
    text: |-
      Indien de overledene geen betrekkingen als bedoeld in het vorige lid nalaat, kan de commandant operationeel
      commando het in dat lid bedoelde bedrag geheel of gedeeltelijk doen aanwenden ter bestrijding van de kosten van de
      laatste ziekte en de begrafenis of crematie.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel125
  - number: '125.3'
    text: 'Het uit te keren bedrag is indien het een overledene betreft als bedoeld in het eerste lid:'
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel125
  - number: 125.3.a
    text: |-
      onderdeel a: gelijk aan het bedrag van de laatstgenoten bezoldiging, bedoeld in [artikel 120 eerste lid][ref1],
      zonder vermindering ingevolge [artikel 120a][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel120
      [ref2]: https://wetten.overheid.nl/BWBR0003482#Artikel120a
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel125
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '120'
        hoofdstuk: '10'
      - id: ref2
        bwb_id: BWBR0003482
        artikel: 120a
        hoofdstuk: '10'
  - number: 125.3.b
    text: 'onderdeel b: gelijk aan de uitkering welke belanghebbende op de dag van zijn overlijden genoot;'
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel125
  - number: '125.4'
    text: |-
      Op dat bedrag worden in mindering gebracht de uitkering ingevolge [artikel 35 van de Ziektewet][ref1], dan wel
      [artikel 53 van de Wet op de arbeidsongeschiktheidsverzekering][ref2] waarop de overledene aanspraak had dan wel
      zou kunnen hebben gehad, alsmede naar aard en strekking daarmee overeenkomende uitkeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel53
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel125
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '35'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '53'
  - number: 126a.1
    text: |-
      Zo spoedig mogelijk na aanstelling legt de militair de volgende eed of belofte af: «Ik zweer (beloof) trouw aan de
      Koning, gehoorzaamheid aan de wetten en onderwerping aan de krijgstucht. Zo waarlijk helpe mij God Almachtig (Dat
      beloof ik)».
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel126a
  - number: 126a.2
    text: |-
      In afwijking van het eerste lid legt de militair die bij zijn aanstelling is aangewezen voor het volgen van een
      initiële opleiding, de eed of belofte af zo spoedig mogelijk na het voltooien van die opleiding.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel126a
  - number: 126a.3
    text: |-
      Indien de militair ingevolge een eerdere aanstelling reeds de eed of belofte heeft afgelegd, wordt deze niet
      opnieuw afgelegd.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel126a
  - number: 126b.1
    text: |-
      De militair meldt aan Onze Minister, op een door Onze Minister te bepalen wijze, de nevenwerkzaamheden die de
      militair verricht of voornemens is te gaan verrichten, die de belangen van de dienst, voor zover deze in verband
      staan met zijn functievervulling, kunnen raken.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel126b
  - number: 126b.2
    text: Onze Minister voert een registratie van de op grond van het eerste lid gedane meldingen.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel126b
  - number: 126b.3
    text: |-
      De door militairen met de rang van vice-admiraal/luitenant-generaal of een hogere rang gemelde nevenwerkzaamheden
      worden openbaar gemaakt met vermelding van eventueel door Onze Minister aan het verrichten van de
      nevenwerkzaamheden gestelde beperkingen.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel126b
  - number: 126b.4
    text: |-
      De militair verricht geen nevenwerkzaamheden waardoor de goede vervulling van de functie of het goed functioneren
      van de openbare dienst, voor zover dit in verband staat met de functievervulling, niet in redelijkheid zou zijn
      verzekerd.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel126b
  - number: 126b.5
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent de melding, bedoeld in het eerste lid, de
      registratie, bedoeld in het tweede lid, en het verbod, bedoeld in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel126b
  - number: 126c.1
    text: |-
      Onze Minister wijst de militairen aan die werkzaamheden verrichten waaraan in het bijzonder het risico van
      financiële belangenverstrengeling of het risico van oneigenlijk gebruik van koersgevoelige informatie verbonden is.
      De aangewezen militair meldt financiële belangen, alsmede het bezit van en transacties met effecten die de belangen
      van de dienst voor zover deze in verband staan met zijn functievervulling kunnen raken, aan een daartoe aangewezen
      functionaris.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel126c
  - number: 126c.2
    text: Onze Minister voert een registratie van de op grond van het eerste lid gedane meldingen.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel126c
  - number: 126c.3
    text: |-
      De militair verstrekt nadere informatie of bescheiden met betrekking tot de financiële belangen of het bezit van of
      de transacties met effecten, indien daarvoor naar het oordeel van Onze Minister of de door Onze Minister aangewezen
      functionaris, bedoeld in het eerste lid, aanleiding bestaat op grond van de melding of na de melding gebleken
      feiten of omstandigheden.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel126c
  - number: 126c.4
    text: |-
      Het is de militair verboden financiële belangen te hebben, effecten te bezitten of effectentransacties te
      verrichten waardoor de goede vervulling van de functie of het goed functioneren van de openbare dienst, voorzover
      dit in verband staat met de functievervulling, niet in redelijkheid zou zijn verzekerd.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel126c
  - number: 126c.5
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent de melding, bedoeld in het eerste lid, de
      registratie, bedoeld in het tweede lid, en het verbod, bedoeld in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel126c
  - number: 126d.1
    text: |-
      Vergoedingen, beloningen, giften of beloften worden door de militair in zijn ambt niet van derden gevorderd of
      verzocht of, anders dan met goedvinden van Onze Minister, aangenomen.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel126d
  - number: 126d.2
    text: De militair neemt geen steekpenningen aan.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel126d
  - number: 126e.1
    text: |-
      De militair neemt geen deel, direct of indirect, aan aannemingen en leveringen ten behoeve van openbare diensten,
      tenzij daarvoor toestemming is verleend.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel126e
  - number: 126e.2
    text: |-
      De militair gedraagt zich naar hetgeen voor de militair is bepaald ten aanzien van het deelnemen, direct of
      indirect, aan aannemingen en leveringen ten behoeve van anderen.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel126e
  - number: 126f
    text: |-
      Aan de militair die is aangesteld bij het beroepspersoneel kan door Onze Minister worden verboden commissaris,
      bestuurder of vennoot te zijn van een vennootschap, stichting of vereniging, die geregeld in aanraking komt, of
      krachtens haar opzet kan komen met de krijgsmacht.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel126f
  - number: '130.1'
    text: |-
      Aan de militair kan ter zake van bijzondere dienstverrichtingen, dan wel langdurige en eervolle dienst, naar
      regelen bij koninklijk besluit te stellen, een onderscheiding worden toegekend.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel130
  - number: '130.2'
    text: |-
      De militair kan, in afwijking van de bepalingen van [hoofdstuk 3][ref1], buitengewoon worden bevorderd ter beloning
      van een zeer belangrijk wapenfeit of een andere daad of verrichting, waardoor hij zich zeer bijzonder heeft
      onderscheiden.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel130
    references:
      - id: ref1
        bwb_id: BWBR0003482
        hoofdstuk: '3'
  - number: '130.3'
    text: |-
      Aan de militair kan ter zake van het op een bijzondere wijze hebben bijgedragen tot de behartiging van de belangen
      van de krijgsmacht een titulaire rang worden toegekend.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel130
  - number: '133'
    text: |-
      In geval van buitengewone omstandigheden kan Onze Minister de militair die in verband met een functie in een
      publiekrechtelijk college ingevolge [artikel 12c, eerste lid, van de Militaire ambtenarenwet 1931][ref1] op non-
      activiteit is gesteld, in werkelijke dienst terugroepen.


      [ref1]: https://wetten.overheid.nl/BWBR0001952#Artikel12c
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel133
    references:
      - id: ref1
        bwb_id: BWBR0001952
        artikel: 12c
  - number: '134.1'
    text: |-
      De militair in werkelijke dienst is verplicht tijdens de voor hem vastgestelde werktijden het voor hem vastgestelde
      uniform te dragen. De vaststelling van het uniform geschiedt, voor zover Wij Ons dat niet hebben voorbehouden, door
      de commandant operationeel commando.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel134
  - number: '134.2'
    text: |-
      Het kan de militair die al dan niet in werkelijke dienst verblijft door de commandant operationeel commando worden
      toegestaan onder bepaalde omstandigheden het uniform al dan niet te dragen.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel134
  - number: '138.1'
    text: De militair in werkelijke dienst kan door Onze Minister worden verplicht tot sportbeoefening in dienstverband.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel138
  - number: '138.2'
    text: Bij ministeriële regeling worden nadere regels gesteld ter uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel138
  - number: '139'
    text: |-
      De militair in werkelijke dienst kan door Onze Minister worden verplicht zodanige maatregelen te treffen, dat hij
      aan per radio, televisie of andere wijze gedane oproepingen om zich te melden onverwijld gevolg kan geven.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel139
  - number: '142'
    text: |-
      De commandant is bevoegd tot het gelasten van een onderzoek aan kleding dan wel lichaam, als bedoeld in
      [artikel 12d van de Militaire ambtenarenwet 1931][ref1] en met inachtneming van dat artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0001952#Artikel12d
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel142
    references:
      - id: ref1
        bwb_id: BWBR0001952
        artikel: 12d
  - number: '143'
    text: |-
      De militair kan worden verplicht te wonen op een bepaalde afstand van de plaats, waar hij in de regel dienst
      verricht, of in een ambts- of dienstwoning, indien dit naar het oordeel van het hoofd defensieonderdeel in het
      belang van de dienst nodig of gewenst is.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel143
  - number: '144.1'
    text: |-
      De militair die een ambts- of dienstwoning bewoont, draagt de kosten van het onderhoud, dat volgens de wet en het
      plaatselijk gebruik voor rekening van de huurder komt, tenzij bij ministeriële regeling afwijkende regels worden
      gesteld.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel144
  - number: '144.2'
    text: |-
      Ingeval de militair overlijdt behouden de achtergebleven gezinsleden gedurende de maand van het overlijden en
      de volgende drie maanden het gebruik van de ambts- of dienstwoning waarin zij met de militair woonden. Het hoofd
      defensieonderdeel kan die termijn bekorten indien het belang van de dienst dit noodzakelijk maakt. Alsdan wordt
      door het hoofd defensieonderdeel naar billijkheid een schadevergoeding gegeven.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel144
  - number: '144.3'
    text: |-
      Bij vrijwillig verlaten van de ambts- of dienstwoning binnen de termijn gedurende welke de woning nog mag worden
      gebruikt, kan het hoofd defensieonderdeel een uitkering geven.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel144
  - number: '145.1'
    text: |-
      Onze Minister kan de militair verplichten tot geheel of gedeeltelijke vergoeding van de door de dienst geleden
      schade:
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel145
  - number: 145.1.a
    text: |-
      indien deze schade in het kader van de vervulling van aan de militair opgedragen diensten en werkzaamheden is
      ontstaan door opzet of bewuste roekeloosheid van de militair, dan wel
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel145
  - number: 145.1.b
    text: |-
      indien deze schade buiten het kader van aan de militair opgedragen diensten en werkzaamheden is ontstaan door
      verwijtbaar handelen van de militair.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel145
  - number: '145.2'
    text: Wanneer de schade is veroorzaakt door meerdere personen gezamenlijk is in beginsel ieder hoofdelijk aansprakelijk.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel145
  - number: '146'
    text: |-
      De militair die uit hoofde van zijn functie is belast met het beheer over of de bewaring van aan het rijk
      toebehorende of toevertrouwde gelden of geldswaardige papieren kan, bij constatering van een tekort, worden
      verplicht dat tekort geheel of gedeeltelijk aan te zuiveren, indien en voor zover hij niet aannemelijk maakt dat
      het ontstaan van dat tekort hem redelijkerwijs niet kan worden verweten.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel146
  - number: '147.1'
    text: |-
      Naar regels bij ministeriële regeling te stellen, wordt van elk ongeval dat aan een militair in werkelijke dienst
      tijdens de uitoefening van de dienst is overkomen, zo spoedig mogelijk een proces-verbaal opgemaakt. De militair
      is verplicht, zodra hij daartoe redelijkerwijs in staat is, kennis te geven van een hem overkomen ongeval als
      vorenbedoeld aan zijn commandant.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel147
  - number: '147.2'
    text: |-
      Naar regels bij ministeriële regeling te stellen, wordt van elk ongeval dat aan een militair in werkelijke dienst
      is overkomen en waarvan niet reeds op grond van het vorige lid een proces-verbaal is opgemaakt, op aanvraag van de
      militair zo spoedig mogelijk een proces-verbaal opgemaakt. Bedoelde aanvraag kan, indien de militair hiertoe niet
      in staat is, ook worden gedaan door zijn naaste betrekkingen. Een proces-verbaal als in dit lid bedoeld kan ook
      ambtshalve worden opgemaakt.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel147
  - number: '147.3'
    text: |-
      Onze Minister beslist of het ongeval waarop een proces-verbaal betrekking heeft, wordt geacht wel of niet in
      verband te staan met de uitoefening van de dienst, van welke beslissing de militair schriftelijk in kennis wordt
      gesteld.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel147
  - number: '147.4'
    text: |-
      Voor de toepassing van dit artikel wordt onder militair in werkelijke dienst mede begrepen de militair, aan wie
      buitengewoon verlof van lange duur met behoud van militaire inkomsten is verleend.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel147
  - number: '148.1'
    text: |-
      Onverminderd artikel 147, tweede lid, is de militair in werkelijke dienst verplicht Onze Minister onverwijld kennis
      te geven van elk ongeval dat hem is overkomen, indien:
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel148
  - number: 148.1.a
    text: bij dat ongeval een derde is betrokken en
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel148
  - number: 148.1.b
    text: |-
      hij tengevolge van dat ongeval verhinderd is zijn normale werkzaamheden uit te oefenen of geneeskundige hulp heeft
      moeten inroepen.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel148
  - number: '148.2'
    text: |-
      Voor de toepassing van dit artikel wordt onder militair in werkelijke dienst mede begrepen de militair, aan wie
      buitengewoon verlof van lange duur met behoud van militaire inkomsten is verleend.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel148
  - number: '148.3'
    text: Bij ministeriële regeling worden nadere regels ter uitvoering van dit artikel vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel148
  - number: 153a
    text: |-
      Ten aanzien van militairen die deelnemen aan een initiële opleiding kunnen bij ministeriële regeling met betrekking
      tot de aangelegenheden geregeld in dit hoofdstuk bijzondere afwijkende regels worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel153a
  - number: 153b.1
    text: In dit hoofdstuk wordt onder militair mede verstaan de gewezen militair.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel153b
  - number: 153b.2
    text: 'in dit hoofdstuk wordt voorts verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel153b
  - number: 153b.2.a
    text: 'COID: de Centrale Organisatie Integriteit Defensie;'
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel153b
  - number: 153b.2.c
    text: 'melder: degene die een vermoeden van een misstand meldt overeenkomstig dit hoofdstuk;'
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel153b
  - number: 153b.2.d
    text: 'melding: de melding van een vermoeden van een misstand.'
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel153b
  - number: 153c
    text: |-
      Ten aanzien van een vertrouwenspersoon integriteit of een gewezen vertrouwenspersoon integriteit wordt vanwege de
      uitoefening van diens taken op basis van dit besluit geen beslissing genomen of handeling verricht met nadelige
      gevolgen voor zijn rechtspositie.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel153c
  - number: 153d.1
    text: Het hoofd defensieonderdeel wijst een of meer vertrouwenspersonen integriteit aan bij zijn defensieonderdeel.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel153d
  - number: 153d.2
    text: 'De vertrouwenspersoon integriteit heeft in elk geval tot taak:'
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel153d
  - number: 153d.2.a
    text: een militair op diens verzoek te adviseren over het omgaan met een vermoeden van een misstand; en
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel153d
  - number: 153d.2.b
    text: het hoofd defensieonderdeel, de Secretaris-Generaal en de COID te informeren over een melding.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel153d
  - number: 153e.1
    text: |-
      Een militair doet een melding bij zijn direct leidinggevende, bij een hogere leidinggevende, bij het Meldpunt van
      de COID of bij een vertrouwenspersoon integriteit. Indien dit niet in redelijkheid van hem kan worden gevraagd, kan
      hij rechtstreeks een melding doen bij de afdeling onderzoek van het Huis voor klokkenluiders of een andere daartoe
      bevoegde instantie.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel153e
  - number: 153e.2
    text: |-
      Een melding over een andere organisatie dan het defensieonderdeel waar hij tewerkgesteld is doet een militair bij
      een leidinggevende of bij een vertrouwenspersoon van die organisatie of, indien dit in redelijkheid niet van hem
      kan worden gevraagd, rechtstreeks bij de afdeling onderzoek van het Huis voor klokkenluiders of een andere daartoe
      bevoegde instantie.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel153e
  - number: 153f
    text: |-
      Een militair kan een krachtens [artikel 153d, eerste lid][ref1], aangewezen vertrouwenspersoon integriteit in
      vertrouwen raadplegen over een vermoeden van een misstand.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel153d
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel153f
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: 153d
        hoofdstuk: 11c
        paragraaf: '2'
  - number: 153g
    text: |-
      De vertrouwenspersoon integriteit maakt de identiteit van de melder niet bekend zonder schriftelijke instemming van
      de melder.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel153g
  - number: 153h
    text: |-
      Degene bij wie een melding is gedaan, stelt het hoofd defensieonderdeel, de Secretaris-Generaal en de COID
      onverwijld in kennis van de melding en de datum waarop deze is ontvangen.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel153h
  - number: 153i
    text: |-
      Diegenen die betrokken zijn bij de behandeling van de melding gaan vertrouwelijk met de melding en de identiteit
      van de melder om.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel153i
  - number: 153j
    text: |-
      Het hoofd defensieonderdeel bevestigt de ontvangst van de melding schriftelijk aan de melder, al dan niet via
      de vertrouwenspersoon integriteit, en informeert de persoon of personen op wie de melding betrekking heeft over
      de melding, tenzij daardoor een onderzoeksbelang of een belang van de melder onnodig of onevenredig kan worden
      geschaad.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel153j
  - number: 153k.1
    text: 'De commandant stelt onverwijld een onderzoek in naar het vermoeden van een misstand, tenzij:'
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel153k
  - number: 153k.1.a
    text: het vermoeden van een misstand kennelijk ongegrond is;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel153k
  - number: 153k.1.b
    text: de melding kennelijk onredelijk laat is gedaan.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel153k
  - number: 153k.2
    text: |-
      De commandant meldt het achterwege laten van een onderzoek en van de verdere behandeling van de melding zo spoedig
      mogelijk schriftelijk en gemotiveerd aan de melder, al dan niet via de vertrouwenspersoon integriteit, alsmede aan
      de persoon of personen op wie de melding betrekking heeft, indien deze op de hoogte zijn gebracht van de melding en
      aan de COID.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel153k
  - number: 153k.3
    text: |-
      Bij de kennisgeving, bedoeld in het tweede lid, wordt mededeling gedaan van de mogelijkheid het vermoeden van
      een misstand te melden bij de afdeling onderzoek van het Huis voor klokkenluiders of een andere daartoe bevoegde
      instantie.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel153k
  - number: 153k.4
    text: |-
      Het onderzoek wordt niet verricht door een persoon die mogelijk betrokken is of is geweest bij de vermoedelijke
      misstand of op onvoldoende afstand staat van de te onderzoeken kwestie of personen.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel153k
  - number: 153l.1
    text: |-
      De commandant stelt de melder, al dan niet via de vertrouwenspersoon integriteit, binnen twaalf weken na de melding
      schriftelijk en gemotiveerd in kennis van de bevindingen van het onderzoek, het oordeel daarover en de eventuele
      consequenties die daaraan worden verbonden. Een afschrift wordt gezonden aan de COID.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel153l
  - number: 153l.2
    text: |-
      Als niet binnen twaalf weken toepassing kan worden gegeven aan het eerste lid, wordt de melder, al dan niet via
      de vertrouwenspersoon integriteit, voordat deze termijn verlopen is daarvan schriftelijk en gemotiveerd op de
      hoogte gesteld. Daarbij wordt de termijn aangegeven waarbinnen de melder, al dan niet via de vertrouwenspersoon
      integriteit, een kennisgeving als bedoeld in het eerste lid ontvangt.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel153l
  - number: 153l.3
    text: |-
      Het eerste en tweede lid zijn van overeenkomstige toepassing op de persoon of personen op wie de melding betrekking
      heeft, tenzij daardoor een onderzoeksbelang kan worden geschaad.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel153l
  - number: 153l.4
    text: |-
      Bij de kennisgeving, bedoeld in het eerste lid, wordt mededeling gedaan van de mogelijkheid het vermoeden van
      een misstand te melden bij de afdeling onderzoek van het Huis voor klokkenluiders of een andere daartoe bevoegde
      instantie.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel153l
  - number: 153m.1
    text: |-
      Indien de afdeling onderzoek van het Huis voor klokkenluiders aan het bevoegd gezag in haar rapport een aanbeveling
      doet als bedoeld in [artikel 17, tweede lid, onder c, van de Wet Huis voor klokkenluiders][ref1], stelt het bevoegd
      gezag de melder, al dan niet via de vertrouwenspersoon integriteit, en de persoon of personen op wie de melding
      betrekking heeft, uiterlijk binnen twaalf weken na openbaarmaking van het rapport schriftelijk in kennis van zijn
      standpunt dienaangaande en de eventuele consequenties die het daaraan verbindt.


      [ref1]: https://wetten.overheid.nl/BWBR0037852#Artikel17
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel153m
    references:
      - id: ref1
        bwb_id: BWBR0037852
        artikel: '17'
  - number: 153m.2
    text: |-
      Als het standpunt en de consequenties afwijken van de aanbeveling, vermeldt de commandant de reden voor de
      afwijking.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel153m
  - number: 153n.1
    text: |-
      De melder of de vertrouwenspersoon integriteit of de gewezen vertrouwenspersoon integriteit, die bezwaar maakt of
      een gerechtelijke procedure instelt, kan aanspraak maken op een tegemoetkoming in de kosten van die procedure, op
      voorwaarde dat:
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel153n
  - number: 153n.1.a
    text: |-
      de procedure is gericht tegen een gestelde benadeling als gevolg van een melding dan wel de procedure is gericht
      tegen een gestelde benadeling van de vertrouwenspersoon integriteit of de gewezen vertrouwenspersoon integriteit
      als gevolg van de uitoefening van zijn functie als vertrouwenspersoon integriteit;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel153n
  - number: 153n.1.b
    text: |-
      de benadeling, bedoeld in onderdeel a, heeft plaatsgevonden binnen vijf jaar nadat de commandant kennis heeft
      gegeven van de bevindingen en het oordeel, bedoeld in [artikel 153k, eerste lid][ref1], of binnen vijf jaar na
      openbaarmaking van een rapport als bedoeld in [artikel 17 van de Wet Huis voor klokkenluiders][ref2] door de
      afdeling onderzoek van het Huis voor klokkenluiders, dan wel binnen vijf jaar nadat de melding anderszins is
      afgehandeld.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel153k
      [ref2]: https://wetten.overheid.nl/BWBR0037852#Artikel17
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel153n
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: 153k
        hoofdstuk: 11c
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0037852
        artikel: '17'
  - number: 153n.2
    text: |-
      De melder of de vertrouwenspersoon integriteit of de gewezen vertrouwenspersoon integriteit die zijn zienswijze
      naar voren brengt met betrekking tot een voorgenomen beslissing of handeling die naar zijn oordeel een benadeling
      inhoudt als gevolg van een melding of van de uitoefening van zijn functie als vertrouwenspersoon integriteit, kan
      aanspraak maken op een tegemoetkoming in de kosten, indien:
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel153n
  - number: 153n.2.a
    text: het voornemen is kenbaar gemaakt binnen de in het eerste lid, onder b, genoemde termijn, en
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel153n
  - number: 153n.2.b
    text: |-
      in de zienswijze naar voren wordt gebracht dat de voorgenomen beslissing of handeling het gevolg is van de melding
      of van de uitoefening van zijn functie als vertrouwenspersoon integriteit.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel153n
  - number: 153n.3
    text: |-
      De melder, de vertrouwenspersoon integriteit, of de gewezen vertrouwenspersoon integriteit richt een verzoek om een
      tegemoetkoming aan het hoofd defensieonderdeel.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel153n
  - number: 153n.4
    text: |-
      Aanspraak op een tegemoetkoming bestaat alleen voor zover in verband met de in het eerste en tweede lid bedoelde
      procedures daadwerkelijk kosten worden of zijn gemaakt met betrekking tot door een derde beroepsmatig verleende
      rechtsbijstand.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel153n
  - number: 153o.1
    text: |-
      De tegemoetkoming voor iedere afzonderlijke procedure, bedoeld in [artikel 153n, eerste en tweede lid][ref1], is
      gelijk aan tweemaal het bedrag, genoemd in onderdeel B1 van de [bijlage bij het Besluit proceskosten bestuursrecht]
      (onbekend).


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel153n
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel153o
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: 153n
        hoofdstuk: 11c
        paragraaf: '3'
  - number: 153o.2
    text: |-
      [Artikel 3 van het Besluit proceskosten bestuursrecht][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006358#Artikel3
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel153o
    references:
      - id: ref1
        bwb_id: BWBR0006358
        artikel: '3'
  - number: 153p.1
    text: Het hoofd defensieonderdeel beslist binnen zes weken op het verzoek.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel153p
  - number: 153p.2
    text: |-
      Het hoofd defensieonderdeel kan de beslissing voor ten hoogste vier weken verdagen. Van de verdaging wordt
      schriftelijk mededeling gedaan.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel153p
  - number: 153q
    text: |-
      Degene aan wie een tegemoetkoming is toegekend, kan worden verplicht tot terugbetaling, indien hij de procedure
      waarop de tegemoetkoming betrekking heeft voortijdig staakt. Deze verplichting geldt niet, indien het staken
      van de procedure direct voortvloeit uit de intrekking door de commandant van de beslissing of het herzien van de
      handeling, waartegen de procedure is gericht.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel153q
  - number: 153r.1
    text: |-
      Als een beslissing of handeling of een voorgenomen beslissing of handeling waarvoor op grond van
      [artikel 153n][ref1] aanspraak bestaat op een tegemoetkoming in de kosten van de procedures, in de bezwaarprocedure
      of zienswijzeprocedure wordt herroepen wegens een aan de commandant of het hoofd defensieonderdeel te wijten
      onrechtmatigheid of de bestreden beslissing of handeling als gevolg van een uitspraak van de rechter die
      onherroepelijk is geworden wordt vernietigd, waarbij de rechtsgevolgen niet in stand worden gelaten, vergoedt het
      hoofd defensieonderdeel voor iedere afzonderlijke procedure aan de melder, de vertrouwenspersoon integriteit of de
      gewezen vertrouwenspersoon integriteit alle daadwerkelijk en in redelijkheid door hem gemaakte kosten als bedoeld
      in [artikel 1 van het Besluit proceskosten bestuursrecht][ref2], met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel153n
      [ref2]: https://wetten.overheid.nl/BWBR0006358#Artikel1
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel153r
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: 153n
        hoofdstuk: 11c
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0006358
        artikel: '1'
  - number: 153r.1.a
    text: de vergoeding wordt toegekend zonder toepassing van het tariefsysteem in voornoemd besluit;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel153r
  - number: 153r.1.b
    text: |-
      de kosten van door een derde beroepsmatig verleende rechtsbijstand worden vergoed voor een bedrag van ten hoogste €
      258,57 per uur tot een bedrag van ten hoogste € 6.205,71, beide bedragen exclusief BTW en kantoorkosten;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel153r
  - number: 153r.1.c
    text: |-
      aan de betrokkene toegekende bedragen waarop hij op grond van een ander wettelijk voorschrift of een uitspraak van
      een gerechtelijke instantie aanspraak heeft in verband met de vergoeding van kosten als bedoeld in dit artikel, in
      aftrek worden gebracht op de vergoeding.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel153r
  - number: 153r.2
    text: |-
      De in het eerste lid genoemde bedragen worden per 1 januari van elk jaar bij ministeriële regeling gewijzigd aan de
      hand van de consumentenprijsindex, geldend voor de maand september van het voorafgaande jaar.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel153r
  - number: 153s
    text: |-
      Op meldingen van militairen die zijn gedaan voor het tijdstip van inwerkingtreding van artikel 2.10, onderdeel
      i, van het Besluit van […] houdende aanpassing van besluiten in verband met de invoering van de normalisering
      van de rechtspositie van ambtenaren (Stb. […]) in de zin van de Interne klokkenluidersregeling Rijk, Politie en
      Defensie, zoals die luidde voorafgaand aan het bedoelde tijdstip, is met ingang van dat tijdstip dit hoofdstuk
      van toepassing.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel153s
  - number: '154.1'
    text: |-
      De militair die voor onbepaalde tijd is aangesteld bij het beroepspersoneel is vanaf 1 januari 2008 aangesteld bij
      de krijgsmacht en ingedeeld bij het krijgsmachtdeel waarbij hij vóór deze datum was aangesteld.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel154
  - number: '154.2'
    text: Een bestaande verplichting om deel uit te maken van het beroepspersoneel wordt gehandhaafd.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel154
  - number: '154.3'
    text: |-
      Voor de toepassing van dit besluit wordt de in het eerste lid bedoelde militair gelijk gesteld met de militair die
      zich in fase drie bevindt.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel154
  - number: 154a.1
    text: |-
      De militair die voor een bepaalde tijd is aangesteld bij het beroepspersoneel blijft voor een bepaalde tijd bij het
      beroepspersoneel aangesteld.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel154a
  - number: 154a.2
    text: Hieraan is de verplichting verbonden gedurende die tijd deel uit te maken van het beroepspersoneel.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel154a
  - number: 154a.3
    text: |-
      Voor de toepassing van dit besluit wordt de in het eerste lid bedoelde militair gelijk gesteld met de militair
      die zich in fase één bevindt, met dien verstande dat de militair die op de dag voorafgaande aan de datum van
      inwerkingtreding van dit artikel aanspraak had op deelname aan flexibilisering arbeidsduur als bedoeld in de
      [artikelen 54d][ref1] en [54e][ref2], deze aanspraak behoudt.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel54d
      [ref2]: https://wetten.overheid.nl/BWBR0003482#Artikel54e
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel154a
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: 54d
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0003482
        artikel: 54e
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 154a.4
    text: |-
      De aanstelling van de militair bedoeld in het eerste lid aan wie vóór 31 december 2007 schriftelijk een
      aanstelling voor onbepaalde tijd bij het beroepspersoneel in het vooruitzicht is gesteld wordt aan het einde van
      de aanstellingsduur omgezet naar een aanstelling bij de krijgsmacht, waarbij de militair gaat functioneren in fase
      drie.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel154a
  - number: 154b.1
    text: |-
      De in [artikel 154a, eerste lid][ref1], bedoelde militair wordt eervol ontslag verleend vanwege het eindigen van de
      tijd waarvoor de aanstelling is geschied.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel154a
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel154b
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: 154a
        hoofdstuk: '12'
        paragraaf: '1'
  - number: 154b.2
    text: |-
      In afwijking van het eerste lid kan de aanstelling van de in [artikel 154a, eerste lid][ref1], bedoelde militair
      met diens instemming en onder bij ministeriële regeling te stellen voorwaarden:


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel154a
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel154b
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: 154a
        hoofdstuk: '12'
        paragraaf: '1'
  - number: 154b.2.a
    text: |-
      aan het einde van de initiële of verlengde aanstellingsduur worden omgezet naar een aanstelling bij de krijgsmacht,
      waarbij de militair gaat functioneren in fase twee;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel154b
  - number: 154b.2.b
    text: |-
      tijdens de initiële of verlengde aanstellingsduur worden omgezet naar een aanstelling bij de krijgsmacht, waarbij
      de militair gaat functioneren in fase één respectievelijk fase twee.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel154b
  - number: 154b.3
    text: |-
      In het geval, bedoeld in het tweede lid, onderdeel b, wordt de verplichting om deel uit te maken van het
      beroepspersoneel als bedoeld in [artikel 154a, tweede lid][ref1], gehandhaafd.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel154a
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel154b
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: 154a
        hoofdstuk: '12'
        paragraaf: '1'
  - number: 154c.1
    text: |-
      Aan de in [artikel 154a][ref1] bedoelde militair wordt een premie toegekend:


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel154a
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel154c
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: 154a
        hoofdstuk: '12'
        paragraaf: '1'
  - number: 154c.1.a
    text: nadat hij de bij zijn aanstelling op hem gelegde verplichting heeft volbracht;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel154c
  - number: 154c.1.b
    text: nadat hij in voorkomend geval een verlengde verplichting heeft volbracht; of
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel154c
  - number: 154c.1.b
    text: |-
      nadat hij zijn opleiding met gunstig resultaat heeft volbracht, en hij niet heeft kunnen voldoen aan de uit de
      aanstelling voortvloeiende of in voorkomend geval verlengde verplichting, door een naar het oordeel van Onze
      Minister niet aan hem zelf te wijten oorzaak.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel154c
  - number: 154c.2
    text: |-
      De premie is ten minste een bedrag gelijk aan 5% van het bij de aanstelling geldende laagste salarisbedrag
      verbonden aan de rang behorende bij de functie waarvoor hij is bestemd, berekend naar het aantal maanden van de
      voor de militair geldende verplichting.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel154c
  - number: 154c.3
    text: |-
      De premie is ten hoogste een bedrag dat gelijk is aan het onder a tot en met d genoemde percentage van de
      bezoldiging behorende bij ten hoogste salarisnummer 19 van het salaris van de rang die één rang hoger is dan de
      rang die verbonden is aan de functie waarvoor hij bij aanstelling is bestemd, berekend naar het aantal maanden van
      de voor de militair geldende verplichting, te weten:
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel154c
  - number: 154c.3.a
    text: 'bij een verplichting van vier jaar of langer: 25%;'
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel154c
  - number: 154c.3.b
    text: 'bij een verplichting van drie tot vier jaar: 23%;'
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel154c
  - number: 154c.3.c
    text: 'bij een verplichting van twee tot drie jaar: 21%;'
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel154c
  - number: 154c.3.d
    text: 'bij een verplichting van minder dan twee jaar: 20%.'
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel154c
  - number: 154c.4
    text: |-
      Het eerste lid is van overeenkomstige toepassing indien [artikel 154b, tweede lid][ref1], wordt toegepast met dien
      verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel154b
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel154c
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: 154b
        hoofdstuk: '12'
        paragraaf: '1'
  - number: 154c.4.a
    text: |-
      de premie van de militair, waarvan de aanstelling tijdens de initiële aanstellingsduur wordt omgezet naar een
      aanstelling bij de krijgsmacht, wordt berekend over de duur van de aan de aanstelling verbonden verplichting;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel154c
  - number: 154c.4.b
    text: |-
      de premie van de militair, waarvan de aanstelling tijdens de verlengde aanstellingsduur wordt omgezet naar een
      aanstelling bij de krijgsmacht, wordt naar rato berekend over de periode tot de omzetting.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel154c
  - number: 154c.5
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent het toekennen van de premie.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel154c
  - number: 154d
    text: |-
      Door Onze Minister kunnen uitsluitend ten aanzien van bepaalde doelgroepen van militairen andere percentages dan
      de percentages genoemd in [artikel 154c, derde lid onder a tot en met d][ref1], worden vastgesteld indien vaststaat
      dat met toepassing van laatstgenoemde percentages onvoldoende in de werving van tot deze doelgroepen behorende
      militairen kan worden voorzien.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel154c
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel154d
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: 154c
        hoofdstuk: '12'
        paragraaf: '1'
  - number: 154e
    text: |-
      Een premie als bedoeld in [artikel 154c][ref1] wordt uitbetaald binnen twee maanden nadat daarop aanspraak
      is ontstaan. Een voorschot op deze premie kan worden uitgekeerd aan de militair die zijn initiële opleiding
      als bedoeld in [artikel 13][ref2] met goed gevolg heeft afgerond: voor ten hoogste een kwart van de bij zijn
      aanstelling toegekende premie.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel154c
      [ref2]: https://wetten.overheid.nl/BWBR0003482#Artikel13
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel154e
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: 154c
        hoofdstuk: '12'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0003482
        artikel: '13'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 154f.1
    text: |-
      De in [artikel 154a][ref1] bedoelde militair kan, met het oog op het na zijn verblijf in werkelijke dienst
      uitoefenen van een beroep in de burgermaatschappij, naar bij ministeriële regeling te stellen regels, in de
      gelegenheid worden gesteld een bij zijn aanstelling vastgestelde burgerberoepsopleiding te volgen.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel154a
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel154f
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: 154a
        hoofdstuk: '12'
        paragraaf: '1'
  - number: 154f.2
    text: |-
      Deze opleiding vindt plaats tijdens het verblijf in werkelijke dienst en geschiedt voor rekening van en, indien en
      voorzover dat naar het oordeel van Onze minister wenselijk en mogelijk is, door de zorg van het Rijk.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel154f
  - number: 154f.3
    text: |-
      Bij de regeling bedoeld in het eerste lid worden voor de onderscheiden opleidingen maximum tijdsduren vastgesteld,
      gedurende welke die opleidingen op rijkskosten kunnen worden gevolgd, met dien verstande dat deze tijdsduur nimmer
      meer kan bedragen dan vierentwintig maanden.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel154f
  - number: 154f.4
    text: |-
      Gedurende zes maanden na de datum van aanstelling kan, in overeenstemming tussen Onze minister en de betrokken
      militair, eenmaal wijziging in de burgerberoepsopleiding worden gebracht. Indien het dienstbelang zulks vordert kan
      ook na vorenbedoelde termijn Onze minister de burgerberoepsopleiding met instemming van de militair wijzigen. De
      voorgaande leden zijn in dat geval van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel154f
  - number: 154f.5
    text: |-
      Indien de militair de burgerberoepsopleiding, als gevolg van een naar het oordeel van Onze minister niet aan
      hemzelf te wijten oorzaak, niet binnen de voor hem op grond van het derde lid vastgestelde maximum tijdsduur met
      gunstig resultaat heeft voltooid, kan Onze minister bepalen, dat bij een verlengde verplichting een gedeelte van
      die verlenging wordt bestemd voor het voltooien van de opleiding.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel154f
  - number: 154f.6
    text: |-
      De militair die door een naar het oordeel van Onze minister niet aan hemzelf te wijten oorzaak wordt ontslagen
      nadat de aan de aanstelling verbonden proeftijd is verstreken, maar voordat de – eventueel verlengde – verplichting
      is volbracht, kan op zijn aanvraag in aanmerking worden gebracht voor een tegemoetkoming ten einde de in dit
      artikel bedoelde burgerberoepsopleiding te voltooien.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel154f
  - number: 154g.1
    text: |-
      De in [artikel 154a][ref1] bedoelde militair die, met het oog op het na zijn verblijf in werkelijke dienst
      uitoefenen van een beroep in de burgermaatschappij, tijdens zijn verblijf in werkelijke dienst algemeen vormend of
      vak onderricht volgt, kan op zijn aanvraag, naar bij ministeriële regeling te stellen regels, in het genot worden
      gesteld van faciliteiten, verband houdende met het volgen van het onderricht.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel154a
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel154g
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: 154a
        hoofdstuk: '12'
        paragraaf: '1'
  - number: 154g.2
    text: |-
      De in het eerste lid bedoelde militair, die de uit zijn aanstelling voortvloeiende verplichting en eventueel
      verlengde verplichting heeft volbracht, kan op zijn aanvraag gedurende ten hoogste één jaar na de datum van ingang
      van zijn ontslag in het genot van de in het eerste lid bedoelde faciliteiten worden gesteld, in geval deze verband
      houden met het volgen van onderwijs.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel154g
  - number: 154h
    text: |-
      De in [artikel 154a][ref1] bedoelde militair die de uit zijn aanstelling voortvloeiende verplichting heeft
      volbracht, of daaraan – nadat hij met gunstig resultaat zijn opleiding heeft voltooid – niet heeft kunnen voldoen
      door een naar het oordeel van Onze minister niet aan hemzelf te wijten oorzaak, kan op zijn aanvraag na de datum
      van ingang van zijn ontslag, naar bij ministeriële regeling te stellen regels, in het genot worden gesteld van
      een studietoelage, indien hij met het oog op het uitoefenen van een beroep in de burgermaatschappij aan een in
      Nederland gevestigde en erkende onderwijsinstelling niet-schriftelijk wetenschappelijk, algemeen vormend of vak
      onderricht volgt.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel154a
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel154h
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: 154a
        hoofdstuk: '12'
        paragraaf: '1'
  - number: 154i.1
    text: |-
      De in [artikel 154a][ref1] genoemde militair die geen aanspraak maakt op een tegemoetkoming in het dagelijks
      reizen, heeft, indien zijn plaats van tewerkstelling in Nederland, België of Duitsland is gelegen, eenmaal
      in de twee weken aanspraak op een tegemoetkoming in de kosten van het reizen ten behoeve van familiebezoek
      over een enkele reis afstand van ten hoogste 460 kilometer, met inachtneming van het bepaalde krachtens
      [artikel 25 van het Verplaatsingskostenbesluit militairen][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel154a
      [ref2]: https://wetten.overheid.nl/BWBR0005137#Artikel25
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel154i
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: 154a
        hoofdstuk: '12'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005137
        artikel: '25'
  - number: 154i.2
    text: |-
      Indien de in het eerste lid bedoelde militair tevens aanspraak heeft op een tegemoetkoming in de reiskosten op
      grond van het [Verplaatsingskostenbesluit militairen][ref1], bestaat slechts aanspraak op de hoogste vergoeding
      per maand.


      [ref1]: https://wetten.overheid.nl/BWBR0005137
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel154i
    references:
      - id: ref1
        bwb_id: BWBR0005137
  - number: 154i.3
    text: |-
      De in dit artikel bedoelde aanspraak is niet van toepassing voor de militair die voorzieningen geniet ingevolge het
      Dienst Buitenlandse Zaken Voorzieningenstelsel (DBZV).
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel154i
  - number: 154j.1
    text: |-
      De militair die voor onbepaalde tijd is aangesteld bij het reservepersoneel is vanaf 1 januari 2008 aangesteld bij
      het reservepersoneel en ingedeeld bij het krijgsmachtdeel waarbij hij vóór deze datum was aangesteld.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel154j
  - number: 154j.2
    text: |-
      [Artikel 154][ref1] is op de in het eerste lid bedoelde militair van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel154
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel154j
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '154'
        hoofdstuk: '12'
        paragraaf: '1'
  - number: 154k.1
    text: |-
      De militair die voor een bepaalde tijd is aangesteld bij het reservepersoneel blijft voor een bepaalde tijd bij het
      reservepersoneel aangesteld.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel154k
  - number: 154k.2
    text: |-
      [Artikel 154a][ref1] is op de in het eerste lid bedoelde militair van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel154a
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel154k
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: 154a
        hoofdstuk: '12'
        paragraaf: '1'
  - number: '161'
    text: |-
      De [Algemene termijnenwet][ref1] (*Stb.* 1964, 314) is niet van toepassing op de termijnen in dit besluit gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002448
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel161
    references:
      - id: ref1
        bwb_id: BWBR0002448
  - number: 161a
    text: |-
      Na inwerkingtreding van de [Wet normalisering rechtspositie ambtenaren][ref1] berust dit besluit op de
      [artikelen 12][ref2] en [12o van de Wet ambtenaren defensie][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0039393
      [ref2]: https://wetten.overheid.nl/BWBR0001952#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0001952#Artikel12o
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel161a
    references:
      - id: ref1
        bwb_id: BWBR0039393
      - id: ref2
        bwb_id: BWBR0001952
        artikel: '12'
      - id: ref3
        bwb_id: BWBR0001952
        artikel: 12o
  - number: '163'
    text: Dit besluit wordt aangehaald als "Algemeen militair ambtenarenreglement", afgekort AMAR.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel163
  - number: '164'
    text: |-
      De artikelen van dit besluit treden in werking op een door Ons te bepalen tijdstip dat voor de verschillende
      artikelen of onderdelen daarvan, alsook per krijgsmachtdeel, verschillend kan worden gesteld.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel164
