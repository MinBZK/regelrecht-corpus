  - number: '103'
    text: |-
      De uitslag van een onderzoek als bedoeld in [artikel 18 van de Arbeidsomstandighedenwet][ref1], alsmede in de
      [artikelen 93, tweede lid][ref2], [95][ref3], [97][ref4], [98][ref5] en [99][ref6], wordt zo spoedig mogelijk
      schriftelijk aan de militair medegedeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel18
