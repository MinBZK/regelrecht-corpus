  - number: 88.2.a
    text: |-
      overschrijding plaatsvinden van het met toepassing van het vorige lid vastgestelde aantal tijdseenheden
      buitengewoon verlof, indien zulks nodig is ter verwezenlijking van het met het buitengewoon verlof beoogde doel;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel88
  - number: 88.2.b
    text: |-
      vermindering plaatsvinden van het met toepassing van het vorige lid vastgestelde aantal tijdseenheden buitengewoon
      verlof, indien met minder tijdseenheden kan worden volstaan voor de verwezenlijking van het met het buitengewoon
      verlof beoogde doel.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel88
  - number: '90.1'
    text: |-
      De militair in werkelijke dienst als bedoeld in [artikel 1, eerste lid, onderdeel c, subonderdeel 1°][ref1],
      met inbegrip van de militair aan wie buitengewoon verlof met behoud van militaire inkomsten is verleend, is
      verzekerd voor geneeskundige verzorging aan de militair verleend door of vanwege de voor hem aangewezen militair
      geneeskundige dienst.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel1
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '1'
        hoofdstuk: '1'
  - number: '90.2'
    text: Bij ministeriële regeling wordt de omvang van de geneeskundige zorg vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel90
  - number: '90.3'
    text: |-
      Bij ministeriële regeling wordt de in verband met de verzekering verschuldigde premie vastgesteld na ontvangst van
      een daartoe strekkend voorstel van de in [artikel 90a][ref1] bedoelde rechtspersoon. De premie wordt ingehouden op
      de bezoldiging, voor zover door Onze Minister niet in de premie wordt bijgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel90a
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: 90a
        hoofdstuk: '9'
        paragraaf: '1'
  - number: '90.4'
    text: Onze Minister draagt op bij ministeriële regeling te bepalen wijze bij in de in het derde lid bedoelde premie.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel90
  - number: '90.5'
    text: |-
      De in het derde lid bedoelde ministeriële regeling vormt geen onderwerp van overleg als bedoeld in
      [artikel 3 van het Besluit georganiseerd overleg sector Defensie][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006042#Artikel3
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0006042
        artikel: '3'
  - number: '90.6'
    text: 'Aan de verzekering kunnen geen aanspraken worden ontleend door of ten behoeve van:'
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel90
  - number: 90.6.a
    text: |-
      degene die tijdens een vredes- of humanitaire operatie in het buitenland plaatselijk is geworven en met toepassing
      van [artikel 11][ref1] tijdelijk is aangesteld als militair;


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel11
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '11'
        hoofdstuk: '2'
  - number: 90.6.b
    text: |-
      de ambtenaar bedoeld in [artikel 1 van het Burgerlijk ambtenarenreglement defensie][ref1] die met toepassing van
      [artikel 11][ref2] tijdelijk is aangesteld als militair.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0003482#Artikel11
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0003482
        artikel: '11'
        hoofdstuk: '2'
  - number: 90a.1
    text: |-
      Een door Onze Minister aan te wijzen rechtspersoon is belast met de uitvoering van de in [artikel 90][ref1]
      bedoelde verzekering.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel90
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel90a
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '90'
        hoofdstuk: '9'
        paragraaf: '1'
  - number: 90a.2
    text: |-
      De voorzitter en de overige leden van het bestuur van de rechtspersoon worden benoemd en ontslagen door Onze
      Minister.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel90a
  - number: 90a.3
    text: Wijzigingen in de statuten van de rechtspersoon worden ter goedkeuring voorgelegd aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel90a
  - number: 90a.4
    text: |-
      De rechtspersoon verstrekt Onze Minister informatie met betrekking tot de uitvoering van de verzekering, waaronder
      jaarlijks een jaarrekening die is voorzien van een verklaring omtrent de getrouwheid en rechtmatigheid afgegeven
      door een accountant als bedoeld in [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel90a
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: 90a.5
    text: |-
      Onze Minister kan de in het eerste lid bedoelde aanwijzing intrekken, wanneer de rechtspersoon tekortschiet in de
      uitvoering van de verzekering dan wel de verplichtingen genoemd in dit artikel niet nakomt.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel90a
  - number: 90b
    text: 'De militair bedoeld in:'
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel90b
  - number: 90b.a
    text: |-
      [artikel 1, eerste lid, onderdeel c, subonderdeel 2º][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel1
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel90b
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '1'
        hoofdstuk: '1'
  - number: 90b.b
    text: |-
      [artikel 90, zesde lid][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel90
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel90b
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '90'
        hoofdstuk: '9'
        paragraaf: '1'
  - number: '91'
    text: |-
      De geneeskundige verzorging verleend door of vanwege de militair geneeskundige dienst omvat al de maatregelen,
      voorzieningen en geneeskundige verstrekkingen in het belang van de bescherming, het behoud, het herstel en de
      bevordering van de gezondheid van de militair alsmede in het belang van het behoud, het herstel en de bevordering
      van de geschiktheid van de militair voor de dienst.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel91
  - number: 91a
    text: |-
      De niet in werkelijke dienst verblijvende militair en de gewezen militair die lijden aan een ziekte of een gebrek,
      verband houdende met de uitoefening van de dienst, hebben ten aanzien van die ziekte of dat gebrek naar bij
      ministeriële regeling te stellen regels en voorwaarden aanspraak op geneeskundige verzorging tot het op grond van
      [artikel 90a, derde lid][ref1] vastgestelde maximum.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel90a
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel91a
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: 90a
        hoofdstuk: '9'
        paragraaf: '1'
  - number: '92'
    text: |-
      De militair in werkelijke dienst is verplicht de maatregelen in acht te nemen die door de minister worden
      voorgeschreven ter bescherming van de gezondheid van de militair of die van anderen, zulks onverminderd de
      wettelijke mogelijkheden ten aanzien van bepaalde maatregelen van die verplichting te worden ontheven.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel92
  - number: '93.1'
    text: |-
      De militair in werkelijke dienst die wegens ziekte geheel of gedeeltelijk verhinderd is dienst te verrichten, is
      verplicht, naar regels bij ministeriële regeling te stellen, daarvan kennis te geven aan zijn commandant en een
      (tand)arts te consulteren.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel93
  - number: '93.2'
    text: |-
      De in het vorige lid bedoelde militair kan op verzoek van zijn commandant door of vanwege de militair geneeskundige
      dienst aan een onderzoek worden onderworpen ter beantwoording van de vragen:
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel93
  - number: 93.2.a
    text: of, in welke mate en tot welk tijdstip er van die verhindering tot dienstverrichting sprake is;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel93
  - number: 93.2.b
    text: |-
      of verdere maatregelen of voorzieningen nodig zijn in het belang van het herstel van zijn gezondheid, dan wel in
      het belang van het behoud, het herstel of de bevordering van zijn geschiktheid voor de dienst.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel93
  - number: '93.3'
    text: |-
      De militair in werkelijke dienst is in geval van ziekte verplicht zich te houden aan de voorschriften, hem door de
      behandelend (tand)arts gegeven, met dien verstande dat hij niet verplicht is zich te onderwerpen aan een ingreep
      van heelkundige aard of een andere kunstbewerking.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel93
  - number: '93.4'
    text: |-
      De militair in werkelijke dienst die zich onder behandeling heeft gesteld van een (tand)arts, niet behorende tot de
      voor hem aangewezen militair geneeskundige dienst, is verplicht hiervan kennis te geven aan deze dienst.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel93
  - number: '94.1'
    text: |-
      De commandant is verplicht zo tijdig mogelijk zodanige maatregelen te treffen en voorschriften te geven als
      redelijkerwijs mogelijk is, opdat de militair die in verband met ongeschiktheid als gevolg van ziekte verhinderd
      is dienst te verrichten, in staat wordt gesteld de eigen of andere passende arbeid te verrichten. Indien vaststaat,
      dat de eigen arbeid niet meer kan worden verricht en binnen het gezagsbereik van Onze Minister geen andere passende
      arbeid voorhanden is, bevordert de commandant, naar regels bij ministeriële regeling te stellen, de inschakeling
      van de militair in voor hem passende arbeid buiten het gezagsbereik van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel94
  - number: '94.2'
    text: |-
      Uit hoofde van de verplichting, bedoeld in het eerste lid, stelt de commandant in
      overeenstemming met de militair of de gewezen militair een plan van aanpak op als bedoeld in
      [artikel 71a, tweede lid van de Wet op de arbeidsongeschiktheidsverzekering][ref1]. Het plan van aanpak wordt met
      medewerking van de militair of de gewezen militair regelmatig geëvalueerd en zo nodig bijgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel71a
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 71a
  - number: '94.3'
    text: |-
      Om te beoordelen of de militair gevolg geeft aan de verplichtingen, bedoeld in [artikel 94a][ref1] wint de
      commandant een hierop betrekking hebbend advies in van het Uitvoeringsinstituut werknemersverzekeringen en neemt
      dit advies mede in beschouwing.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel94a
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: 94a
        hoofdstuk: '9'
        paragraaf: '2'
  - number: 94a.1
    text: 'De militair die als gevolg van ziekte ongeschikt is dienst te verrichten, is verplicht tot:'
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel94a
  - number: 94a.1.a
    text: |-
      gedurende het eerste jaar van zijn ziekte, het verrichten van hem opgedragen passende arbeid. Onder passende arbeid
      wordt verstaan alle arbeid die voor de krachten en bekwaamheden van de militair is berekend, tenzij deze om redenen
      van lichamelijke, geestelijke of sociale aard niet van hem kan worden gevergd;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel94a
  - number: 94a.1.b
    text: |-
      gedurende het tweede jaar van zijn ziekte en daarna, het verrichten van hem opgedragen gangbare arbeid als bedoeld
      in [artikel 18, vijfde lid van de Wet op de arbeidsongeschiktheidsverzekering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel18
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel94a
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '18'
  - number: 94a.2
    text: |-
      De militair, bedoeld in het eerste lid, is verplicht tot het opvolgen van door de commandant of door een door
      deze aangewezen deskundige gegeven redelijke voorschriften en is verplicht mee te werken aan door hen getroffen
      maatregelen om hem in staat te stellen de arbeid als bedoeld in het eerste lid te verrichten.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel94a
  - number: 94a.3
    text: |-
      De militair, bedoeld in het eerste lid, is verplicht zijn medewerking te verlenen
      aan het opstellen, evalueren en bijstellen van een plan van aanpak als bedoeld in
      [artikel 71a van de Wet op de arbeidsongeschiktheidsverzekering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel71a
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel94a
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 71a
  - number: 94a.4
    text: |-
      Dit artikel is van overeenkomstige toepassing wanneer de militair onder andere voorwaarden wordt verplicht tot het
      verrichten van dienst.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel94a
  - number: '95'
    text: |-
      Zodra de verhindering tot dienstverrichting heeft opgehouden te bestaan, is de in werkelijke dienst verblijvende
      militair verplicht zich te wenden tot de voor hem aangewezen militair geneeskundige dienst teneinde zo nodig een
      onderzoek te ondergaan ter beantwoording van de vraag of hij weer volledig geschikt kan worden geacht voor de
      uitoefening van de dienst. De commandant kan in afwijking hiervan de aanwijzing geven dat betrokkene zich meldt
      bij de bedrijfsgeneeskundige dienst. Betrokkene is verplicht de dienst te hervatten, behoudens indien en voor zover
      door of vanwege vorenbedoelde geneeskundige dienst anders wordt bepaald.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel95
  - number: '96.1'
    text: |-
      De militair in werkelijke dienst die in contact staat of kort geleden heeft gestaan met een persoon die een ziekte
      heeft waarvoor ingevolge het krachtens de [Infectieziektenwet][ref1] bepaalde een nominatieve aangifteplicht geldt,
      is verplicht daarvan ten spoedigste kennis te geven aan de voor hem aangewezen militair geneeskundige dienst.


      [ref1]: https://wetten.overheid.nl/BWBR0009684
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0009684
  - number: '96.2'
    text: |-
      In het geval, bedoeld in het eerste lid, mag de militair geen dienst verrichten en heeft hij geen toegang tot
      de plaats van zijn tewerkstelling dan met toestemming gegeven door of vanwege de voor hem aangewezen militair
      geneeskundige dienst. Hij is gehouden zich te gedragen naar de door of vanwege deze dienst gegeven aanwijzingen,
      welke mede kunnen bestaan in een verbod om zich naar een eenheid of onderdeel van de krijgsmacht te begeven.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel96
  - number: '96.3'
    text: |-
      Indien een militair krachtens het tweede lid geen dienst mag verrichten, wordt hij voor de toepassing van dit
      hoofdstuk geacht wegens ziekte verhinderd te zijn tot dienstverrichting.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel96
  - number: '97.1'
    text: |-
      De militair in werkelijke dienst kan worden verplicht zich periodiek te onderwerpen aan een geneeskundig of
      tandheelkundig onderzoek door of vanwege de voor hem aangewezen militair geneeskundige dienst.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel97
  - number: '97.2'
    text: |-
      Aan een geneeskundig of tandheelkundig onderzoek als bedoeld in het eerste lid zal in ieder geval worden
      onderworpen de militair die in verband met de uitoefening van zijn werkzaamheden aan bijzonder gevaar voor zijn
      gezondheid blootstaat, dan wel voor een goede vervulling van die werkzaamheden aan bijzondere gezondheidseisen
      moet voldoen.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel97
  - number: '98'
    text: |-
      De militair in werkelijke dienst kan worden verplicht zich te onderwerpen aan een geneeskundig of tandheelkundig
      onderzoek door of vanwege de voor hem aangewezen militair geneeskundige dienst, wanneer de commandant operationeel
      commando dit noodzakelijk acht in verband met toelating tot een opleiding, plaatsing in een andere functie,
      plaatsing bij bepaalde onderdelen of in bepaalde gebieden, dan wel beëindiging van het verblijf in werkelijke
      dienst.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel98
  - number: '99'
    text: |-
      De militair in werkelijke dienst, van wie door zijn commandant op goede gronden wordt verondersteld dat zijn
      lichamelijke of geestelijke gesteldheid een beletsel vormt om naar behoren dienst te verrichten, kan, op verzoek
      van zijn commandant, worden onderworpen aan een geneeskundig of tandheelkundig onderzoek door of vanwege de voor
      hem aangewezen militair geneeskundige dienst.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel99
  - number: '100.1'
    text: |-
      Indien bij een onderzoek als bedoeld in de [artikelen 97][ref1], [98][ref2], en [99][ref3] blijkt van een zodanige
      lichamelijke of geestelijke gesteldheid van de militair, dat zijn belangen of het dienstbelang zich tegen gehele of
      gedeeltelijke voortzetting van zijn werkzaamheden of diensten verzetten, wordt hij door zijn commandant geheel of
      gedeeltelijk van die werkzaamheden of diensten vrijgesteld. Alsdan kunnen hem door zijn commandant – in overleg met
      de betrokken militair geneeskundige dienst – passende andere werkzaamheden of diensten worden opgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel97
      [ref2]: https://wetten.overheid.nl/BWBR0003482#Artikel98
      [ref3]: https://wetten.overheid.nl/BWBR0003482#Artikel99
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel100
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '97'
        hoofdstuk: '9'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0003482
        artikel: '98'
        hoofdstuk: '9'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0003482
        artikel: '99'
        hoofdstuk: '9'
        paragraaf: '3'
  - number: '100.2'
    text: |-
      Indien en voor zover een militair krachtens het vorige lid van de dienst is vrijgesteld van zijn normaliter te
      verrichten werkzaamheden of diensten en hem geen passende andere werkzaamheden of diensten zijn opgedragen, wordt
      hij voor de toepassing van dit hoofdstuk geacht wegens ziekte verhinderd te zijn tot dienstverrichting.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel100
  - number: '101'
    text: |-
      Van het voornemen tot het instellen van een geneeskundig of tandheelkundig onderzoek als bedoeld in de
      [artikelen 97, tweede lid][ref1], [98][ref2] en [99][ref3], wordt de militair door zijn commandant, onder
      vermelding van de redenen en van de desbetreffende bepaling van dit besluit, schriftelijk in kennis gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel97
      [ref2]: https://wetten.overheid.nl/BWBR0003482#Artikel98
      [ref3]: https://wetten.overheid.nl/BWBR0003482#Artikel99
