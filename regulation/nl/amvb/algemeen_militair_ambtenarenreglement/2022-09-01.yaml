  - number: '1.6'
    text: |-
      Voor de toepassing van de hoofdstukken en artikelen, genoemd in het vijfde lid, wordt voor de geestelijk verzorger
      als genoemd in het vijfde lid in voorkomend geval onder hoofd defensieonderdeel verstaan: de commandant van het
      Commando Dienstencentra.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel1
  - number: '1.7'
    text: |-
      Op degene die is aangesteld in burgerlijke openbare dienst om bij de krijgsmacht als geestelijk verzorger niet
      doorlopend werkzaam te zijn, is het vijfde lid van overeenkomstige toepassing met dien verstande dat hij in
      voorkomend geval wordt mede begrepen onder het reservepersoneel.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel1
  - number: '2'
    text: |-
      Onze Minister kan voorts bijzondere regelen, die afwijken van dit besluit, vaststellen ten aanzien van militairen
      die tewerkgesteld zijn:
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel2
  - number: 2.a
    text: onder leiding of toezicht van een orgaan van de Verenigde Naties;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel2
  - number: 2.b
    text: bij of ten behoeve van een bondgenootschappelijk orgaan of bondgenootschappelijke strijdkrachten;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel2
  - number: 2.c
    text: |-
      ten behoeve van operaties in het kader van internationale overeenkomsten of andere verplichtingen door Nederland
      aangegaan.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel2
  - number: 2.d
    text: buiten het Ministerie van Defensie, anders dan in de gevallen, bedoeld onder a, b en c,
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel2
  - number: '3'
    text: |-
      De commandant draagt er zorg voor dat een of meer exemplaren van dit besluit en van alle overige voorschriften
      betreffende de rechtstoestand van de militair steeds bij de eenheid of het onderdeel, waartoe de militair behoort,
      ter inzage aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel3
  - number: 3a
    text: |-
      De bevoegdheid tot het vaststellen van ministeriële regelingen als bedoeld in de
      [hoofdstukken 2 tot en met 12][ref1] kan door Onze Minister worden gemandateerd aan de hoofddirecteur personeel van
      het Ministerie van Defensie.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0003482
        hoofdstuk: '2'
  - number: '4.1'
    text: 'Aanstelling kan plaatsvinden:'
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel4
  - number: 4.1.a
    text: bij het beroepspersoneel;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel4
  - number: 4.1.b
    text: bij het reservepersoneel.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel4
  - number: '4.2'
    text: De aanstelling waarbij een officiersrang wordt toegekend, geschiedt bij koninklijk besluit.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel4
  - number: '4.3'
    text: |-
      De aanstelling waarbij een rang of stand en klasse wordt toegekend beneden de rang van luitenant ter zee der 3e
      klasse/tweede-luitenant, geschiedt door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel4
  - number: '4.4'
    text: De aanstelling van een lid van het Koninklijk Huis geschiedt bij koninklijk besluit.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel4
  - number: 4a.1
    text: 'De Onze Minister maakt bij de werving bekend en verschaft informatie over:'
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel4a
  - number: 4a.1.a
    text: |-
      de voorwaarden voor aanstelling als bedoeld in [artikel 5][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel5
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '5'
        hoofdstuk: '2'
  - number: 4a.1.b
    text: de uiterlijke datum van inzending van de sollicitatieformulieren;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel4a
  - number: 4a.1.c
    text: bijzondere selectie-onderzoeken;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel4a
  - number: 4a.1.d
    text: de arbeidsvoorwaarden;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel4a
  - number: 4a.1.e
    text: de inhoud van de opleiding;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel4a
  - number: 4a.1.f
    text: de inhoud van de in de regel te vervullen functies;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel4a
  - number: 4a.1.g
    text: de loopbaanmogelijkheden die de militair heeft.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel4a
  - number: 4a.2
    text: |-
      Tijdens de selectie worden de gestelde voorwaarden, bedoeld in het eerste lid onder a, niet ten nadele van de
      gegadigde gewijzigd.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel4a
  - number: 4a.3
    text: |-
      Het inwinnen van inlichtingen – anders dan in het kader van het veiligheidsonderzoek – bij personen en instanties
      buiten het Ministerie van Defensie staat in direct verband met het functioneren binnen de organisatie en vindt
      uitsluitend plaats onder opgave van redenen aan de gegadigde en nadat met hem is overeengekomen bij wie en in welke
      fase van het selectieonderzoek dat kan geschieden.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel4a
  - number: 4a.4
    text: |-
      De gegadigde wordt – op diens verzoek – geïnformeerd omtrent de inhoud van de inlichtingen, bedoeld in het derde
      lid en welke betekenis hieraan voor de selectie is toegekend. De informant wordt vooraf van dit recht van de
      gegadigde in kennis gesteld.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel4a
  - number: 4a.5
    text: |-
      De gegadigde heeft het recht kennis te nemen van de uitslag van het psychologisch onderzoek en om, desgewenst,
      hierop een toelichting te ontvangen van respectievelijk de psycholoog die het onderzoek heeft verricht of de
      psycholoog onder wiens verantwoordelijkheid het psychologisch onderzoek heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel4a
  - number: 4a.6
    text: |-
      De gegadigde heeft het recht om kennis te nemen van de uitslag van het geneeskundig onderzoek binnen twee weken na
      vaststelling en om, desgewenst, hierop een toelichting te ontvangen van respectievelijk de arts die het onderzoek
      heeft verricht of de arts onder wiens verantwoordelijkheid het geneeskundig onderzoek heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel4a
  - number: 4a.7
    text: |-
      De gegadigde heeft het recht zijn bedenkingen tegen de uitslag van een geneeskundig of psychologisch onderzoek
      kenbaar te maken. Indien deze bedenkingen door een door Onze Minister aan te wijzen arts respectievelijk psycholoog
      gegrond zijn verklaard, kan hij desgewenst aan een hernieuwd onderzoek worden onderworpen.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel4a
  - number: 4a.8
    text: |-
      Aan de gegadigde die deelneemt aan de selectie of onderdelen daarvan wordt een tegemoetkoming wegens ondergane
      inkomstenderving en gemaakte reiskosten verleend. De kosten die de gegadigde maakt teneinde resultaten van
      onderdelen van de selectie te verkrijgen worden niet vergoed.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel4a
  - number: '5.1'
    text: 'Om in aanmerking te komen voor een aanstelling dient de gegadigde:'
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel5
  - number: 5.1.a
    text: het Nederlanderschap te bezitten;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel5
  - number: 5.1.b
    text: |-
      te voldoen aan de eisen van lichamelijke en geestelijke geschiktheid die ter zake zijn gesteld bij of krachtens het
      [Militair Keuringsreglement][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002346
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002346
  - number: 5.1.c
    text: zich schriftelijk bereid te verklaren tot het afleggen van de eed of belofte;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel5
  - number: 5.1.d
    text: |-
      afhankelijk van de functie dan wel de groepen van functies waarvoor hij is bestemd te voldoen aan, voor zover niet
      bij of krachtens wet anders is bepaald, door de commandant operationeel commando vastgestelde bijzondere eisen
      inzake:
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel5
  - number: 5.1.d.1°
    text: vooropleiding;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel5
  - number: 5.1.d.2°
    text: geschiktheid, anders dan bedoeld onder b, en bekwaamheid.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel5
  - number: '5.2'
    text: |-
      Wanneer aan de aanstelling een proeftijd is verbonden, kan in bijzondere gevallen worden afgeweken van de bij en
      krachtens het eerste lid, onder a, b en d, gestelde voorwaarden, indien in redelijkheid mag worden verwacht dat
      vóór het einde van de proeftijd wel aan de voorwaarden is voldaan. Indien op de laatste dag van de proeftijd niet
      is voldaan aan alle voorwaarden voor aanstelling, eindigt met ingang van die dag de aanstelling van rechtswege.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel5
  - number: '5.3'
    text: |-
      De gegadigde kan alleen worden aangesteld als ten diens aanzien in verband met de voorgenomen aanstelling een
      verklaring als bedoeld in [artikel 1, eerste lid, onder b, van de Wet veiligheidsonderzoeken][ref1] is afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0008277#Artikel1
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0008277
        artikel: '1'
  - number: 5a.1
    text: |-
      Om in aanmerking te kunnen komen voor een aanstelling als militair moet de gegadigde een zodanige leeftijd
      bezitten, dat:
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel5a
  - number: 5a.1.a
    text: |-
      hem voldoende loopbaanmogelijkheden kunnen worden geboden gelet op de ambities van de gegadigde en de aan de
      aanstelling verbonden verplichting; en
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel5a
  - number: 5a.1.b
    text: |-
      er uit oogpunt van het waarborgen van de operationele inzetbaarheid een evenwicht bestaat tussen de leeftijd van de
      gegadigde en de functie of groep van functies waarvoor de gegadige wordt bestemd.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel5a
  - number: 5a.2
    text: |-
      Bij ministeriële regeling kunnen voor specifieke categorieën personeel, met inachtneming van het eerste lid,
      concrete leeftijdsgrenzen worden gesteld.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel5a
  - number: 5a.3
    text: |-
      De gegadigde die bij aanstelling is bestemd voor functievervulling in fase drie is op de datum van
      aanstelling niet minder dan twaalf jaar verwijderd van zijn datum van leeftijdsontslag, bedoeld in
      [artikel 39, tweede lid, onderdeel a][ref1]. Indien de gegadigde reeds eerder gedurende een periode van ten minste
      twee jaar was aangesteld als militair bij het beroepspersoneel wordt de periode van twaalf jaar beperkt tot een
      periode van tien jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel39
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '39'
        hoofdstuk: '6'
  - number: '7.1'
    text: |-
      Aan een aanstelling bij het beroepspersoneel is de verplichting verbonden deel uit te maken van het
      beroepspersoneel gedurende de initiële opleiding en aansluitend een periode van vier jaar.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel7
  - number: '7.2'
    text: |-
      Bij ministeriële regeling kan voor specifieke categorieën personeel worden bepaald dat de duur van de in het eerste
      lid genoemde verplichting wordt verminderd.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel7
  - number: '8'
    text: |-
      Aan de militair wordt door het op grond van artikel 4 bevoegde gezag bij aanstelling een rang of stand en klasse
      toegekend.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel8
  - number: '9.1'
    text: Aan een aanstelling is een proeftijd van zes kalendermaanden verbonden.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel9
  - number: '9.2'
    text: |-
      Wanneer sprake is van een hernieuwde aanstelling van een gewezen militair, kan door Onze Minister worden afgeweken
      van het eerste lid, waarbij de proeftijd maximaal drie kalender maanden bedraagt.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel9
  - number: '10'
    text: |-
      Aan de militair, aangesteld bij het beroepspersoneel, wordt bij aanstelling inzicht gegeven in de functie dan wel
      groepen van functies waarvoor hij is bestemd.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel10
  - number: '11.1'
    text: |-
      Wegens en voor de duur van de vervulling van een functie die niet door reeds in werkelijke dienst verblijvende
      militairen kan worden vervuld, kan in bijzondere gevallen tijdelijke aanstelling als militair bij het
      beroepspersoneel plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel11
  - number: '11.2'
    text: |-
      Bij de in het eerste lid bedoelde tijdelijke aanstelling kan worden afgeweken van de bij en krachtens artikel 5,
      eerste lid, gestelde voorwaarden.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel11
  - number: '11.3'
    text: |-
      Indien een als zodanig tijdelijk aangestelde militair wordt ontheven van zijn functie, eindigt de aanstelling met
      ingang van de dag van die ontheffing van rechtswege.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel11
  - number: '12'
    text: |-
      Aan de militair wordt zo spoedig mogelijk na aanstelling een akte van aanstelling uitgereikt. Deze moet in ieder
      geval inhouden:
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel12
  - number: 12.a
    text: naam en voornamen, alsmede de plaats en datum van geboorte van de militair;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel12
  - number: 12.b
    text: het operationeel commando waarbij de militair wordt ingedeeld;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel12
  - number: 12.c
    text: |-
      de categorie als bedoeld in [artikel 4, eerste lid][ref1], waartoe de militair behoort;


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel4
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '4'
        hoofdstuk: '2'
  - number: 12.d
    text: de rang of stand en klasse die de militair is toegekend;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel12
  - number: 12.e
    text: de functie dan wel groepen van functies waarvoor de militair is bestemd;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel12
  - number: 12.f
    text: de datum van ingang van de aanstelling;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel12
  - number: 12.g
    text: de aan de aanstelling verbonden verplichting.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel12
  - number: 12a.1
    text: |-
      De militair kan door Onze Minister worden bestemd voor een andere functie of groep van functies dan waarvoor hij
      tot dan toe was bestemd:
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel12a
  - number: 12a.1.a
    text: op zijn aanvraag, binnen het operationeel commando waarbij hij is ingedeeld;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel12a
  - number: 12a.1.b
    text: |-
      op zijn aanvraag, bij een ander operationeel commando, waarbij ook indeling bij dat operationeel commando kan
      plaatsvinden;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel12a
  - number: 12a.1.c
    text: |-
      bij gebleken noodzaak en met de instemming van de militair in het belang van de dienst binnen het operationeel
      commando waar hij is ingedeeld;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel12a
  - number: 12a.1.d
    text: |-
      bij gebleken noodzaak en met de instemming van de militair in het belang van de dienst bij een ander operationeel
      commando, waarbij ook indeling bij dat operationeel commando kan plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel12a
  - number: 12a.2
    text: |-
      Bij toepassing van het eerste lid wordt gewijzigd hetgeen ingevolge
      [artikel 12, onderdelen b en e en in voorkomend geval onderdeel g][ref1], in de aanstellingsbeschikking is
      opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel12
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '12'
        hoofdstuk: '2'
  - number: '13'
    text: |-
      De militair wordt door Onze Minister bij aanstelling in beginsel aangewezen voor het volgen van een initiële
      opleiding. Deze opleiding is ten minste gericht op het verkrijgen van de benodigde kennis en vaardigheid voor de
      eerste functie(s) waarvoor hij is bestemd.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel13
  - number: '14.1'
    text: 'De militair wordt voor het verkrijgen van benodigde kennis en vaardigheden door Onze Minister aangewezen voor:'
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel14
  - number: 14.1.a
    text: |-
      een opleiding benodigd voor de vervulling van zijn huidige functie of voor een vervolgfunctie die past binnen de
      groep van functies waarbinnen hij zijn loopbaan vervult;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel14
  - number: 14.1.b
    text: |-
      een opleiding benodigd voor de vervulling van functies in een andere groep van functies dan waarvoor hij is
      bestemd.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel14
  - number: '14.2'
    text: Onze Minister vergoedt de aan een functieopleiding verbonden kosten.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel14
  - number: '15.1'
    text: |-
      De militair kan met inachtneming van [artikel 28a][ref1] door Onze Minister worden aangewezen voor een opleiding
      gericht op het verwerven van kennis en vaardigheden die nodig zijn voor het vervullen van functies waaraan een
      hogere rang is verbonden dan de militair bekleedt.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel28a
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: 28a
        hoofdstuk: '3'
        paragraaf: '4'
  - number: '15.2'
    text: Onze Minister vergoedt de aan een loopbaanopleiding verbonden kosten.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel15
  - number: '16.1'
    text: |-
      De militair wordt op zijn aanvraag door Onze Minister aangewezen voor een opleiding die ziet op zijn persoonlijke
      ontwikkeling ten behoeve van de verbreding van zijn loopbaanmogelijkheden binnen Defensie. De aanvraag gaat
      vergezeld van een advies van de employabilitybegeleider.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel16
  - number: '16.2'
    text: |-
      Onze Minister vergoedt de aan een opleiding in het kader van de persoonlijke ontwikkeling verbonden noodzakelijke
      kosten, die voor rekening van de militair komen.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel16
  - number: '16.3'
    text: |-
      Wanneer de opleiding dan wel de noodzakelijke voorbereiding daarop plaatsvindt tijdens de arbeidstijd van
      de militair, wordt hij door Onze Minister hiervoor vrijgesteld van arbeid. Indien zwaarwegende redenen van
      dienstbelang dit noodzakelijk maken, kan de vrijstelling van arbeid door Onze Minister tijdelijk worden opgeheven.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel16
  - number: 16a.1
    text: |-
      De militair kan een aanvraag indienen bij Onze Minister om te worden aangewezen voor een opleiding,
      gericht op een loopbaan buiten het ministerie van Defensie. De aanvraag gaat vergezeld van een advies
      van de employabilitybegeleider of, wanneer sprake is van een extern bemiddelingstraject, als bedoeld
      in [artikel 31a][ref1], van een advies van de organisatie-eenheid belast met de externe bemiddeling van
      defensiepersoneel.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel31a
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel16a
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: 31a
        hoofdstuk: '4'
  - number: 16a.2
    text: 'Bij een besluit van Onze Minister tot aanwijzing, bedoeld in het eerste lid, wordt rekening gehouden met:'
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel16a
  - number: 16a.2.a
    text: |-
      het bij de aanvraag gevoegde advies van de employabilitybegeleider of van de organisatie-eenheid belast met de
      externe bemiddeling van defensiepersoneel;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel16a
  - number: 16a.2.b
    text: de beroepswensen van de militair;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel16a
  - number: 16a.2.c
    text: |-
      de arbeidsmarkt relevantie van de gewenste opleiding en de verhouding tot het werkervarings- en opleidingsniveau
      van de militair.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel16a
  - number: 16a.3
    text: |-
      Wanneer de opleiding is gericht op het voortzetten van de loopbaan buiten Defensie binnen het functiegebied,
      waarin de militair bij Defensie werkzaam is, en op een minimaal vergelijkbaar werkniveau worden de kosten voor de
      opleiding volledig vergoed.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel16a
  - number: 16a.4
    text: |-
      Wanneer de opleiding niet kan worden afgerond voordat ontslag plaatsvindt op grond van
      [artikel 39, tweede lid, onder i][ref1], kan de opleiding na het ontslag worden afgerond met vergoeding van de
      daarmee samenhangende opleidingskosten.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel39
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel16a
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '39'
        hoofdstuk: '6'
  - number: 16a.5
    text: |-
      Wanneer de opleiding plaatsvindt tijdens de arbeidstijd van de militair, wordt hij door Onze Minister hiervoor
      vrijgesteld van arbeid, tenzij dit op grond van zwaarwegende redenen van dienstbelang niet mogelijk is.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel16a
  - number: 16a.6
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ten aanzien van dit artikel.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel16a
  - number: 16bis.1
    text: |-
      De militair wordt op zijn aanvraag door Onze Minister aangewezen voor een opleiding indien de militair de
      beschikking heeft over een individuele opleidingsaanspraak. Over de periode van het volgen van de opleiding worden
      vooraf afspraken gemaakt tussen de militair, de commandant en de employabilitybegeleider.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel16bis
  - number: 16bis.2
    text: |-
      De kosten verbonden aan de opleiding worden vergoed tot bij ministeriële regeling vast te stellen maximum bedragen.
      De kosten kunnen tot vijf jaar voor de datum van het leeftijdsontslag worden vergoed met inachtneming van de
      hiervoor bedoelde maximum bedragen.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel16bis
  - number: 16bis.3
    text: |-
      Indien bij de eerste of tweede eerstvolgende functietoewijzing blijkt dat de gevolgde opleiding onderdeel uitmaakt
      van de functie-eisen, wordt het bedrag van de daarvoor vergoede opleidingskosten weer toegevoegd aan de bedragen,
      bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel16bis
  - number: 16bis.4
    text: |-
      Wanneer de opleiding dan wel de noodzakelijke voorbereiding daarop plaatsvindt tijdens de arbeidstijd van
      de militair, wordt hij door Onze Minister hiervoor vrijgesteld van arbeid. Indien zwaarwegende redenen van
      dienstbelang dit noodzakelijk maken, kan de vrijstelling van arbeid door Onze Minister tijdelijk worden opgeheven.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel16bis
  - number: 16bis.5
    text: |-
      Indien de opleiding niet kan worden afgerond voordat ontslag plaats vindt op grond van
      [artikel 39, tweede lid onder i][ref1], kan de opleiding na het ontslag worden afgerond met vergoeding van de
      daarmee samenhangende opleidingskosten met inachtneming van de in het tweede lid bedoelde maximum bedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel39
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel16bis
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '39'
        hoofdstuk: '6'
  - number: 16bis.6
    text: Bij ministeriële regeling worden nadere regels gesteld ten aanzien van dit artikel.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel16bis
  - number: 16b.1
    text: |-
      Onze Minister kan de militair vrijstelling verlenen van een opleiding, bedoeld in [artikel 13 tot en met 16][ref1],
      of delen daarvan, indien blijkt dat reeds over de benodigde kennis en vaardigheid wordt beschikt.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel13
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel16b
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '13'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 16b.2
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ten aanzien van de uitvoering van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel16b
  - number: 16c.1
    text: |-
      Aan de militair kan op diens aanvraag een voorschot worden verstrekt voor de door hem te maken kosten voor een
      opleiding, als bedoeld in [artikel 16][ref1] en [16a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0003482#Artikel16a
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel16c
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0003482
        artikel: 16a
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 16c.2
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ten aanzien van de uitvoering van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel16c
  - number: 16d
    text: |-
      De militair, die is aangewezen voor het volgen van een opleiding, als bedoeld in [artikel 13 tot en met 16][ref1],
      kan daarvan door Onze Minister worden ontheven, indien hij niet voldoet aan de voor de opleiding gestelde eisen of
      indien ontheffing in het belang van de dienst of van de militair noodzakelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel13
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel16d
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '13'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 16e.1
    text: |-
      Aan de aanwijzing voor een opleiding, als bedoeld in [artikel 13 tot en met 16a][ref1], kan door Onze Minister de
      verplichting worden verbonden tot gehele of gedeeltelijke terugbetaling van de kosten van de opleiding, indien de
      militair na het verstrijken van de voor hem geldende proeftijd:


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel13
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel16e
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '13'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 16e.1.a
    text: in verband met aan hem te verwijten omstandigheden wordt ontheven van de opleiding;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel16e
  - number: 16e.1.b
    text: in verband met aan hem te verwijten omstandigheden wordt ontheven van de functie waarvoor hij is opgeleid;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel16e
  - number: 16e.1.c
    text: |-
      uit de dienst wordt ontslagen, op grond van [artikel 39, eerste lid of tweede lid, onder e, ten 1][ref1], of
      [artikel 45][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0003482#Artikel45
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel16e
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '39'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0003482
        artikel: '45'
        hoofdstuk: '6'
  - number: 16e.2
    text: |-
      Bij de berekening van het terug te betalen bedrag wordt uitgegaan van een evenwichtige verdeling van risico's
      tussen werkgever en werknemer.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel16e
  - number: 16e.3
    text: |-
      Het bedrag van de terugbetalingsverplichting in geval van een initiële opleiding, als bedoeld in
      [artikel 13][ref1], wordt naar evenredigheid verminderd naarmate de termijn van de hem op basis van
      [artikel 12k van de Militaire Ambtenarenwet 1931][ref2] opgelegde verplichting is verstreken met dien verstande dat
      de periode van de proeftijd hierbij meetelt.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0001952#Artikel12k
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel16e
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '13'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0001952
        artikel: 12k
  - number: 16e.4
    text: 'Het door de militair terug te betalen bedrag wordt als volgt vastgesteld:'
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel16e
  - number: 16e.4.a
    text: |-
      voor het deel van de opleiding dat is gevolgd binnen het Ministerie van Defensie: overeenkomstig de door Onze
      Minister vastgestelde kosten van die opleiding per cursist;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel16e
  - number: 16e.4.b
    text: |-
      voor het deel van de opleiding dat is gevolgd buiten het Ministerie van Defensie: de opleidingskosten die
      rechtstreeks door het Ministerie van Defensie aan die onderwijsinstelling zijn betaald;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel16e
  - number: 16e.4.c
    text: 'de militaire inkomsten die volgens het Inkomstenbesluit militairen zijn ontvangen tijdens een:'
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel16e
  - number: 16e.4.c.(1)
    text: |-
      opleiding, die is gevolgd bij een externe onderwijsinstelling, met volledige vrijstelling van het verrichten van
      arbeid: over de werkdagen voor de volle duur van die opleiding waarop de militair is vrijgesteld van werkzaamheden
      en diensten als militair,
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel16e
  - number: 16e.4.c.(2)
    text: |-
      opleiding, die is gevolgd bij een externe onderwijsinstelling, met gedeeltelijke vrijstelling van het verrichten
      van arbeid: over de werkdagen van die opleiding waarop de militair is vrijgesteld van werkzaamheden en diensten
      als militair,
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel16e
  - number: 16e.5
    text: |-
      De militair op wie een terugbetalingsverplichting rust, wordt ontslagen van die verplichting, indien hij bij
      ontslag op aanvraag, als bedoeld in [artikel 39, eerste lid][ref1], binnen zes maanden na dat ontslag wordt
      aangesteld als ambtenaar bij het Ministerie van Defensie.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel39
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel16e
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '39'
        hoofdstuk: '6'
  - number: 16e.6
    text: |-
      Het door de militair terug te betalen bedrag is direct opeisbaar, wanneer een omstandigheid, als bedoeld in het
      eerste lid, zich voordoet, en wordt in beginsel in één termijn voldaan. Onze Minister kan een afbetalingsregeling
      treffen.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel16e
  - number: 16e.7
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ten aanzien van de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel16e
  - number: '17.1'
    text: Functietoewijzing en ontheffing uit een functie geschiedt door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel17
  - number: '17.2'
    text: |-
      De functie wordt voor drie jaar toegewezen. De duur van de functievervulling kan met instemming van de militair
      worden verlengd tot een maximum van vijf jaar.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel17
  - number: '17.3'
    text: De militair is gehouden de hem toegewezen functie te vervullen.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel17
  - number: '17.4'
    text: |-
      In het laatste jaar van de functievervulling bedoeld in het tweede lid is de militair beschikbaar voor
      functietoewijzing.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel17
  - number: '17.5'
    text: Na ontheffing uit de functie volgt in beginsel functietoewijzing of bestemming voor een functieopleiding.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel17
  - number: '17.6'
    text: |-
      Indien de militair buiten staat is de hem toegewezen functie te vervullen, kunnen daaraan door Onze Minister
      consequenties worden verbonden.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel17
  - number: '17.7'
    text: |-
      In afwijking van het tweede lid kan voor bij ministeriële regeling aan te wijzen specifieke functiegroepen
      de functievervullingsduur worden vastgesteld tot een maximum van zeven jaar. In geval van een afwijkende
      functievervullingsduur van meer dan vijf jaar, kan tevens een van het vierde lid afwijkende termijn worden
      vastgesteld tot een maximum van vier jaar.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel17
  - number: '17.8'
    text: |-
      In afwijking van het vierde en het zevende lid is een militair gedurende de gehele duur van de functievervulling
      beschikbaar voor een functietoewijzing indien er sprake is van een bevordering als bedoeld in de
      [artikel 24][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel24
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '24'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: '18.1'
    text: |-
      De militair wordt in de gelegenheid gesteld zijn voorkeur kenbaar te maken voor te vervullen functies. Hiertoe
      worden in ieder geval de beschikbare functies bekend gesteld.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel18
  - number: '18.2'
    text: 'Bij de bekendstelling van functies worden in ieder geval vermeld:'
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel18
  - number: 18.2.a
    text: de functie-eisen;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel18
  - number: 18.2.b
    text: een indicatie van de datum waarop de functie voor toewijzing in aanmerking komt.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel18
  - number: '19.1'
    text: |-
      Om voor een functie in aanmerking te komen voldoet de militair aan de gestelde eisen over de opbouw van kennis,
      ervaring en vaardigheden.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel19
  - number: '19.2'
    text: 'Tot de in het eerste lid bedoelde eisen worden in ieder geval gerekend:'
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel19
  - number: 19.2.a
    text: de voor de functievervulling en het functieniveau vereiste bekwaamheden en vooropleidingen;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel19
  - number: 19.2.b
    text: de voor de functievervulling en het functieniveau vereiste ervaring;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel19
  - number: 19.2.c
    text: de eventuele voor de functievervulling en voor bepaalde functiegroepen vereiste competenties;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel19
  - number: 19.2.d
    text: de eventuele functionele eisen ten aanzien van de lichamelijke geoefendheid.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel19
  - number: '20.1'
    text: |-
      Bij het nemen van een beslissing tot functietoewijzing wordt in ieder geval rekening gehouden met de volgende
      factoren:
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel20
  - number: 20.1.a
    text: |-
      de noodzaak van een voortdurende taakvervulling door de krijgsmacht en in samenhang daarmee van een zo goed en
      tijdig mogelijke bezetting van alle functies;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel20
  - number: 20.1.b
    text: |-
      de door de militair kenbaar gemaakte voorkeur; met inachtneming van [artikel 28a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel28a
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: 28a
        hoofdstuk: '3'
        paragraaf: '4'
  - number: 20.1.c
    text: de beschikbaarheid van de militair;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel20
  - number: 20.1.d
    text: |-
      de uit een oogpunt van opbouw van kennis en ervaring wenselijke spreiding van de loopbaan van de militair over
      verschillende functies;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel20
  - number: 20.1.e
    text: de bekwaamheid en de geschiktheid van de militair voor de functie.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel20
  - number: '20.2'
    text: |-
      Bij het nemen van een beslissing tot functietoewijzing worden in ieder geval de volgende kandidaten in ogenschouw
      genomen:
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel20
  - number: 20.2.a
    text: |-
      de militairen, voor wie een voorkeurspositie geldt, omdat zij in aanmerking komen voor ontslag op grond van
      [artikel 39, tweede lid, onder f][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel39
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '39'
        hoofdstuk: '6'
  - number: 20.2.b
    text: andere bepaalde categorieën militairen aan wie een voorkeurspositie is toegekend;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel20
  - number: 20.2.c
    text: de militair die zijn voorkeur voor de functie heeft kenbaar gemaakt;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel20
  - number: 20.2.d
    text: |-
      militairen die in het kader van een reorganisatie zijn aangemerkt als herplaatsingkandidaat en die voor de
      vervulling van de vacante functie zijn voorgedragen;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel20
  - number: 20.2.e
    text: |-
      militairen die op grond van organisatiebelang geschikt worden geacht voor de functie, met inbegrip van de militair
      die op grond van het gevoerde loopbaanbeleid voor toewijzing van de functie in aanmerking komt.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel20
  - number: '20.3'
    text: |-
      Bij de bekwaamheid en geschiktheid van de militair, genoemd in het eerste lid onder e worden in beginsel in
      beschouwing genomen:
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel20
  - number: 20.3.a
    text: de mate waarin de militair voldoet aan de functie-eisen als bedoeld in artikel 19;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel20
  - number: 20.3.b
    text: |-
      de uitkomst van functioneringsgesprekken, als bedoeld in [artikel 28][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel28
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: 20.3.c
    text: |-
      de uitkomst van loopbaangesprekken, als bedoeld in [artikel 28a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel28a
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: 28a
        hoofdstuk: '3'
        paragraaf: '4'
  - number: 20.3.d
    text: |-
      de voor het besluit tot functietoewijzing relevante beoordelingen, als bedoeld in [artikel 28b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel28b
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: 28b
        hoofdstuk: '3'
        paragraaf: '4'
  - number: '21.1'
    text: |-
      Onze Minister stelt de betrokken militair indien mogelijk zes maanden voor de datum van ingang van de
      functievervulling, in kennis van het besluit tot functietoewijzing onder vermelding van:
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel21
  - number: 21.1.a
    text: de functie;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel21
  - number: 21.1.b
    text: de standplaats;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel21
  - number: 21.1.c
    text: de datum van ingang;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel21
  - number: 21.1.d
    text: een indicatie van de duur van functievervulling.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel21
  - number: '21.2'
    text: |-
      Van de termijn, genoemd in het eerste lid, kan door Onze Minister worden afgeweken tot een termijn van ten minste
      twee maanden, indien naar zijn oordeel het dienstbelang hiertoe noodzaakt.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel21
  - number: '21.3'
    text: |-
      In afwijking van het eerste lid wordt voor in het buitenland geplaatste militairen in beginsel een termijn van 12
      maanden maar ten minste 9 maanden gehanteerd, indien zij na hun buitenlandse plaatsing een functie in Nederland
      gaan vervullen.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel21
  - number: '22.1'
    text: |-
      De militair kan door Onze Minister eenmaal tijdens een functievervulling voor een periode van maximaal 12 maanden
      worden belast met de volledige waarneming van een functie. Onder volledige waarneming van een functie wordt
      verstaan: het op aanwijzing van Onze Minister in de plaats van de eigen functie uitoefenen van het volledige
      samenstel van werkzaamheden van een andere functie.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel22
  - number: '22.2'
    text: |-
      Voorts kan de militair eenmaal tijdens een functievervulling door Onze Minister voor een periode van maximaal 12
      maanden, naast het blijven vervullen van zijn eigen functie, worden belast met de waarneming van een deel van het
      samenstel van werkzaamheden, verbonden aan een andere functie dan die aan hem is toegewezen.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel22
  - number: '22.3'
    text: |-
      Een militair kan alleen worden belast met de waarneming van een functie waaraan zijn eigen rangsniveau of het
      naasthogere rangsniveau is verbonden.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel22
  - number: '22.4'
    text: |-
      De militair wordt zo spoedig mogelijk in kennis gesteld van het besluit hem te belasten met de waarneming van een
      functie indien de waarneming voorzienbaar langer dan 30 dagen zal duren. Hierbij wordt vermeld:
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel22
  - number: 22.4.a
    text: de functie die wordt waargenomen;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel22
  - number: 22.4.b
    text: of er sprake is van volledige of gedeeltelijke waarneming;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel22
  - number: 22.4.c
    text: indien het een gedeeltelijke waarneming betreft, welk gedeelte van de functie niet wordt waargenomen;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel22
  - number: 22.4.d
    text: de datum van aanvang en de vermoedelijke einddatum van de waarneming;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel22
  - number: 22.4.e
    text: de mogelijkheid dat de waarneming eerder kan eindigen dan de aangegeven vermoedelijke einddatum.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel22
  - number: 22.4.f
    text: |-
      het feit of een toelage wordt toegekend als bedoeld in [artikel 11 van het Inkomstenbesluit militairen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007816#Artikel11
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0007816
        artikel: '11'
  - number: '22.5'
    text: |-
      De commandant van de in het tweede lid bedoelde militair draagt er zorg voor dat de combinatie van de waar te nemen
      werkzaamheden en de eigen werkzaamheden de belasting van één functie niet overschrijdt.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel22
  - number: '23.1'
    text: |-
      Onze Minister kan de militair ontheffen van de eisen die aan de hem toe te wijzen functie zijn verbonden wanneer
      het onder bijzondere omstandigheden onmogelijk is gebleken de militair tijdig aan te wijzen voor een opleiding als
      bedoeld in [artikel 14, eerste lid][ref1] en [artikel 15 eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0003482#Artikel15
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '14'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0003482
        artikel: '15'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '23.2'
    text: De in het eerste lid genoemde ontheffing geldt voor de duur dat de militair de opleiding nog niet heeft voltooid.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel23
  - number: '23.3'
    text: |-
      Onze Minister stelt de militair met voorrang in de gelegenheid de voor de vervulling van de hem toegewezen functie
      noodzakelijke opleidingen te volgen.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel23
  - number: '24.1'
    text: 'Bij koninklijk besluit geschiedt de bevordering van:'
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel24
  - number: 24.1.a
    text: |-
      een militair met een rang beneden de rang van luitenant ter zee der derde klasse/tweede luitenant tot een
      officiersrang;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel24
  - number: 24.1.b
    text: een militair die een officiersrang bekleedt;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel24
  - number: 24.1.c
    text: een lid van het Koninklijk Huis;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel24
  - number: 24.1.d
    text: een militair die behoort tot het Militaire huis van Zijne Majesteit de Koning;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel24
  - number: 24.1.e
    text: een militair tot de rang van commandeur/brigadegeneraal/commodore of tot een hogere rang.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel24
  - number: '24.2'
    text: |-
      De bevoegdheid tot de in het eerste lid, onderdeel b, bedoelde bevordering kan bij koninklijk besluit aan Onze
      Minister worden toegekend.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel24
  - number: '24.3'
    text: De overige bevorderingen geschieden door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel24
  - number: '24.4'
    text: |-
      Aan de militair die een functie is toegewezen waaraan een hogere rang is verbonden dan de rang die hij bekleedt,
      wordt met ingang van de datum van ingang van functievervulling die hogere rang toegekend. Het toekennen van die
      rang kan tevens, voor een korte periode van voorbereiding, daaraan voorafgaand geschieden.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel24
  - number: '24.5'
    text: |-
      In afwijking van het vierde lid kan aan de militair in bijzondere gevallen tijdelijk een hogere rang worden
      toegekend dan die welke hij bekleedt indien:
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel24
  - number: 24.5.a
    text: |-
      het gewenste optreden van de militair daartoe noodzaakt en het optreden een wezenlijk onderdeel uitmaakt van de
      functie
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel24
  - number: 24.5.b
    text: |-
      de militair wordt ingezet in het kader van een vredesoperatie als bedoeld in [artikel 2, onderdeel c][ref1], en hij
      niet voldoet aan de eisen, genoemd in [artikel 19][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003482#Artikel19
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '2'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0003482
        artikel: '19'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '24.6'
    text: |-
      De in het vijfde lid bedoelde militair keert van rechtswege terug tot de rang of klasse die hij daarvoor bekleedde
      indien de reden tot het toekennen van de hogere rang vervalt.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel24
  - number: '24.7'
    text: 'De navolgende bevorderingen kunnen geschieden in afwijking van het vierde lid:'
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel24
  - number: 24.7.a
    text: |-
      bij de Koninklijke marine: de bevorderingen in de stand van matroos en de bevordering van de luitenant ter zee der
      derde klasse tot luitenant ter zee der tweede klasse;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel24
  - number: 24.7.b
    text: |-
      bij de Koninklijke landmacht: de bevorderingen in de stand van soldaat, de bevordering van korporaal tot korporaal
      der eerste klasse, de bevordering van sergeant/wachtmeester tot sergeant/wachtmeester der eerste klasse en de
      bevordering van tweede luitenant tot eerste luitenant;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel24
  - number: 24.7.c
    text: |-
      bij de Koninklijke luchtmacht: de bevorderingen in de stand van soldaat, de bevorderingen van korporaal tot
      korporaal der eerste klasse, de bevordering van sergeant tot sergeant der eerste klasse en de bevordering van
      tweede luitenant tot eerste luitenant;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel24
  - number: 24.7.d
    text: |-
      bij de Koninklijke marechaussee: de bevorderingen in de stand van marechaussee der vierde en derde klasse;
      de bevordering van marechaussee der tweede klasse tot marechaussee der eerste klasse, de bevordering van de
      wachtmeester tot wachtmeester der eerste klasse en de bevordering van tweede luitenant tot eerste luitenant.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel24
  - number: '24.8'
    text: |-
      Indien een militair die een rang tijdelijk bekleedt, overlijdt, wordt hij geacht de tijdelijke rang effectief te
      hebben bekleed op het tijdstip van zijn overlijden.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel24
  - number: 24a.1
    text: |-
      Indien naar aanleiding van de uitkomst van een functiewaarderingsonderzoek bij een bestaande functie sprake is
      van een verhoging van de rang die wordt verbonden aan de functie, wordt de militair, die deze functie vervult,
      bevorderd tot deze hogere rang.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel24a
  - number: 24a.2
    text: |-
      De bevordering gaat in op de datum waarop de aanvraag tot het houden van een functiewaarderingsonderzoek is
      aangeboden aan het hoofd van het defensieonderdeel.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel24a
  - number: 24b.1
    text: |-
      De militair kan tijdens een initiële opleiding door Onze Minister worden bevorderd wegens het afsluiten van de
      opleiding of een gedeelte daarvan.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel24b
  - number: 24b.2
    text: Onze Minister kan aan de militair tijdens een opleiding een titulaire rang of een rang tijdelijk toekennen.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel24b
  - number: 24b.3
    text: |-
      De militair, ingedeeld bij de Koninklijke landmacht, de Koninklijke luchtmacht of de Koninklijke marechaussee wordt
      in verband met opgedane ervaring of de gevolgde opleiding bevorderd tot:
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel24b
  - number: 24b.3.a
    text: eerste luitenant wanneer hij de effectieve rang van tweede luitenant gedurende twee jaren heeft bekleed;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel24b
  - number: 24b.3.b
    text: |-
      sergeant/wachtmeester der eerste klasse wanneer hij de effectieve rang van sergeant/wachtmeester gedurende vier
      jaren heeft bekleed;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel24b
  - number: 24b.3.c
    text: |-
      korporaal/marechaussee der eerste klasse wanneer hij de effectieve rang van korporaal dan wel marechaussee der
      tweede klasse gedurende twee jaren heeft bekleed;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel24b
  - number: 24b.3.d
    text: |-
      soldaat der eerste klasse wanneer hij de effectieve stand van soldaat der tweede klasse gedurende één jaar heeft
      bekleed en zijn initiële opleiding met goed gevolg heeft afgerond dan wel zijn initiële opleiding niet heeft kunnen
      afronden in verband met een niet voor zijn rekening of risico komende omstandigheid;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel24b
  - number: 24b.3.e
    text: marechaussee der tweede klasse wanneer hij zijn initiële opleiding met goed gevolg heeft afgerond.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel24b
  - number: 24b.4
    text: |-
      De militair voldoet aan de in het derde lid genoemde ervaringseis indien de militair gedurende de in dat
      lid genoemde en voor zijn aanstellingscategorie en functieniveau geldende periode op voldoende wijze heeft
      gefunctioneerd. Daarbij wordt rekening gehouden met de bekwaamheid en geschiktheid, als bedoeld in artikel 20,
      derde lid. De duur van de genoemde periode kan in geval van onvoldoende functioneren worden verlengd met ten
      hoogste een jaar.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel24b
  - number: 24b.5
    text: |-
      De militair, ingedeeld bij de Koninklijke marine, wordt in verband met opgedane ervaring bevorderd tot korporaal
      wanneer hij is aangewezen voor een loopbaanopleiding tot onderofficier en deze met goed gevolg heeft afgerond.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel24b
  - number: 24b.6
    text: |-
      De militair, ingedeeld bij de Koninklijke marine, die is aangewezen voor een loopbaanopleiding tot officier wordt
      bevorderd tot:
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel24b
  - number: 24b.6.a
    text: |-
      tijdelijk luitenant ter zee der 3e klasse/tweede luitenant wanneer hij het theoretische deel van die functie- of
      loopbaanopleiding met goed gevolg heeft afgerond;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel24b
  - number: 24b.6.b
    text: |-
      luitenant ter zee der 2e klasse/eerste luitenant wanneer hij de gehele functie- of loopbaanopleiding met goed
      gevolg heeft afgerond.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel24b
  - number: 24b.7
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld voor bevordering tijdens of aansluitend op een
      opleiding dan wel op grond van ervaringsopbouw.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel24b
  - number: 24c
    text: |-
      Aan de militair die is bevorderd, wordt als akte van bevordering een afschrift van of uittreksel uit het
      betreffende besluit tot bevordering uitgereikt. In een akte inzake een tijdelijke bevordering als bedoeld in
      [artikel 24, vijfde lid][ref1], en [artikel 24b, tweede lid][ref2], worden de reden en het tijdelijke karakter van
      die bevordering uitdrukkelijk vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0003482#Artikel24b
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel24c
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '24'
        hoofdstuk: '3'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0003482
        artikel: 24b
        hoofdstuk: '3'
        paragraaf: '3'
  - number: '25.1'
    text: |-
      De militair ingedeeld bij Koninklijke marine die op 9 december 2003 de rang van korporaal bekleedde zal,
      indien hij 12 jaren die rang heeft bekleed, bij voorrang een functie worden toegewezen waaraan de rang van
      sergeant is verbonden, voor zover een dergelijke functie beschikbaar is, met dien verstande dat een dergelijke
      functietoewijzing niet kan geschieden binnen een termijn van twee jaar voor de dag waarop hem ontslag als bedoeld
      in [artikel 39a, onder a][ref1], zal worden verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel39a
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: 39a
        hoofdstuk: '6'
  - number: '25.2'
    text: |-
      Indien het niet mogelijk is om de militair, bedoeld in het eerste lid, een functie toe te wijzen waaraan de rang
      van sergeant is verbonden, wordt hij, op het moment dat hij de rang van korporaal 15 jaar heeft bekleed, bevorderd
      tot sergeant.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel25
  - number: '25.3'
    text: |-
      De militair ingedeeld bij de Koninklijke marine, die op 9 december 2003 de rang van korporaal bekleedde en aan
      wie twee jaar voor de dag waarop hem ontslag als bedoeld in [artikel 39a onder a][ref1], zal worden verleend, nog
      geen functie is of kan worden toegewezen waaraan de rang van sergeant is verbonden, wordt niettemin bevorderd tot
      sergeant.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel39a
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: 39a
        hoofdstuk: '6'
  - number: '25.4'
    text: |-
      Om voor toewijzing van een functie waaraan de rang van sergeant is verbonden, als bedoeld in het eerste lid, dan
      wel voor bevordering tot sergeant, als bedoeld in het tweede en derde lid, in aanmerking te komen dient de militair
      te voldoen aan de gestelde eisen als bedoeld in [artikel 19][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel19
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '19'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '26.1'
    text: |-
      In bijzondere gevallen en voor ten hoogste achttien maanden kan aan de militair een functie worden toegewezen
      waaraan een lagere rang is verbonden dan de effectieve rang die hij bekleedt.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel26
  - number: '26.2'
    text: |-
      De in het eerste lid bedoelde militair, alsmede de militair die is aangewezen voor het volgen van een opleiding,
      behoudt zijn rang.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel26
  - number: '27'
    text: 'De militair wordt tijdens zijn loopbaan geïnformeerd over:'
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel27
  - number: 27.a
    text: de inhoud van de door de militair te vervullen functie, aan de hand van een functie-introductiegesprek;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel27
  - number: 27.b
    text: de wijze van functioneren, aan de hand van een functioneringsgesprek en in voorkomend geval een beoordeling;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel27
  - number: 27.c
    text: de loopbaanmogelijkheden, aan de hand van een loopbaangesprek;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel27
  - number: 27.d
    text: de wijze waarop de selectie voor doorstroom naar fase drie plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel27
  - number: '28.1'
    text: |-
      Aan de wijze waarop de militair – aangesteld bij het beroepspersoneel – functioneert wordt ten minste eenmaal per
      jaar aandacht besteed in een functioneringsgesprek. Met de militair, aangesteld bij het reservepersoneel, wordt
      door de commandant, in beginsel ten minste eenmaal per drie jaar een functioneringsgesprek gehouden.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel28
  - number: '28.2'
    text: |-
      Indien een militair naast de uit zijn functie voortvloeiende arbeid andere opgedragen arbeid heeft verricht, wordt
      tevens aan de wijze waarop hij die arbeid heeft verricht, aandacht besteed.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel28
  - number: '28.3'
    text: |-
      Onverminderd het eerste lid wordt een functioneringsgesprek gehouden indien daartoe de behoefte wordt aangegeven
      door de militair of door de functionele chef. Hierbij geldt dat sprake is van een dienstverhouding van ten minste
      twee maanden.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel28
  - number: '28.4'
    text: Aan het functioneringsgesprek wordt deelgenomen door de militair en diens functionele chef.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel28
  - number: '28.5'
    text: |-
      Op initiatief van een van de deelnemers aan het functioneringsgesprek kunnen een of meer andere personen
      deelnemen aan het gesprek, mits dit uiterlijk een week voordat het gesprek plaatsvindt, wordt gemeld aan de andere
      deelnemer(s) aan het gesprek.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel28
  - number: '28.6'
    text: 'Het functioneringsgesprek is ten minste gericht op de navolgende onderdelen:'
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel28
  - number: 28.6.a
    text: |-
      het functioneren en de werkomstandigheden van de militair in de omgeving waarin hij zijn functie vervult, waarbij
      aandacht wordt besteed aan de functionele, wederzijdse relatie tussen de militair en zijn functionele chef, de
      verhouding tussen de getoonde kennis en vaardigheden en de functie-eisen;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel28
  - number: 28.6.b
    text: de toetsing in hoeverre eerder gemaakte afspraken zijn nagekomen;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel28
  - number: 28.6.c
    text: de persoonlijke ontwikkeling van de militair in zijn huidige functie;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel28
  - number: 28.6.d
    text: andere onderwerpen, waaronder in ieder geval sociale aspecten van leiderschap en het levensfasebeleid.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel28
  - number: '28.7'
    text: |-
      De functionele chef legt een samenvatting van de inhoud van het gesprek alsmede de gemaakte afspraken en besproken
      aandachtspunten vast in het bij ministeriële regeling vast te stellen functioneringsgesprekformulier. Het formulier
      wordt voor een correcte weergave daarvan door de militair en de functionele chef ondertekend, waarna de militair
      een afschrift van het formulier ontvangt. De samenvatting van de inhoud van het gesprek, de gemaakte afspraken en
      de besproken aandachtspunten worden in het personeelsdossier opgelegd.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel28
  - number: '28.8'
    text: Bij ministeriële regeling worden nadere regels gesteld ten aanzien van het houden van functioneringsgesprekken.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel28
  - number: 28a.1
    text: 'Met de militair die zich in loopbaanfase één bevindt:'
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel28a
  - number: 28a.1.a
    text: |-
      wordt in ieder geval een jaar voor het einde van loopbaanfase één een loopbaangesprek gevoerd door de
      employabilitybegeleider;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel28a
  - number: 28a.1.b
    text: wordt daarnaast op zijn aanvraag een loopbaangesprek gevoerd door de employabilitybegeleider.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel28a
  - number: 28a.2
    text: |-
      Met de militair die zich in loopbaanfase twee of drie bevindt wordt tijdens elke functievervulling, maar ten minste
      eenmaal per drie jaar, minimaal één loopbaangesprek gevoerd door de employabilitybegeleider.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel28a
  - number: 28a.3
    text: |-
      Op verzoek van de militair kan een derde persoon deelnemen aan het loopbaangesprek, mits dit uiterlijk een week
      voordat het gesprek plaats vindt, wordt gemeld aan de andere deelnemer(s) aan het gesprek.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel28a
  - number: 28a.4
    text: 'In het loopbaangesprek wordt ten minste aan de volgende aspecten aandacht besteed:'
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel28a
  - number: 28a.4.a
    text: de loopbaanwensen van de militair;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel28a
  - number: 28a.4.b
    text: de kansen en mogelijkheden binnen het door hem gevolgde loopbaanpad;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel28a
  - number: 28a.4.c
    text: de kansen en mogelijkheden bij het mogelijk wijzigen van het loopbaanpad;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel28a
  - number: 28a.4.d
    text: de ontwikkelpunten inzake kennis, ervaring en competenties, gericht op het vervolg van de loopbaan.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel28a
  - number: 28a.5
    text: |-
      Indien het een militair betreft die een functie in fase twee vervult, wordt daarnaast aandacht besteed aan de
      kansen en mogelijkheden voor het vervolgen van de loopbaan in fase drie in afwachting van het doorstroombesluit.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel28a
  - number: 28a.6
    text: |-
      Afspraken die in het loopbaangesprek worden gemaakt, worden vastgelegd in het bij ministeriële regeling
      vast te stellen persoonlijk ontwikkelplanformulier. Het formulier wordt ondertekend door de militair, de
      employabilitybegeleider en de commandant operationeel commando.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel28a
  - number: 28a.7
    text: |-
      De afspraken uit het persoonlijk ontwikkelplan, vastgelegd in het formulier, genoemd in het zesde lid, zijn
      bindend, tenzij een zwaarwegend dienstbelang zich verzet tegen uitvoering van de gemaakte afspraken.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel28a
  - number: 28a.8
    text: |-
      Indien de in het zesde lid genoemde afspraken niet kunnen worden uitgevoerd om zwaarwegende redenen van
      dienstbelang, biedt de commandant van het operationeel commando, waarbij de militair is ingedeeld, binnen één
      jaar, vanaf het moment dat duidelijk wordt dat de oorspronkelijke afspraak niet wordt uitgevoerd, een gelijkwaardig
      alternatief aan.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel28a
  - number: 28a.9
    text: |-
      Wanneer de afspraken niet zijn nagekomen en de militair van mening is dat geen gelijkwaardig alternatief, bedoeld
      in het achtste lid, is aangeboden kan hij zich binnen vier weken wenden tot een door Onze Minister in te stellen
      commissie van advies voor een mogelijke oplossing.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel28a
  - number: 28a.10
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld ten aanzien van het houden van loopbaangesprekken en het
      opstellen, vaststellen en nakomen van de afspraken, vastgelegd in het persoonlijk ontwikkelplanformulier alsmede
      ten aanzien van de commissie van advies, genoemd in het negende lid.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel28a
  - number: 28b.1
    text: 'In dit artikel wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel28b
  - number: 28b.1.a
    text: '*eerste beoordelaar:* de functionele chef van de militair;'
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel28b
  - number: 28b.1.b
    text: |-
      *tweede beoordelaar:* de commandant van de militair. In het geval de commandant de eerste beoordelaar is, treedt in
      beginsel de functionele chef van de commandant op als tweede beoordelaar.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel28b
  - number: 28b.2
    text: |-
      Indien de militair of zijn commandant dit wenselijk vindt wordt een beoordeling over het functioneren van de
      militair opgemaakt. De militair kan hiertoe een aanvraag indienen bij zijn commandant.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel28b
  - number: 28b.3
    text: Onze Minister kan opdracht geven tot het opmaken van een beoordeling.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel28b
  - number: 28b.4
    text: |-
      In de beoordeling wordt een oordeel gegeven over de wijze waarop de militair zijn functie, inclusief eventueel
      andere opgedragen werkzaamheden, heeft vervuld gedurende het beoordelingstijdvak. De beoordeling wordt gebaseerd
      op concrete handelingen, resultaten en gedragingen van de te beoordelen militair. Daarbij kunnen ook omstandigheden
      worden meegewogen buiten de dienst die van invloed zijn geweest op het vervullen van de functie.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel28b
  - number: 28b.5
    text: |-
      Het beoordelingstijdvak, waarin ten minste één functioneringsgesprek heeft plaatsgevonden, bedraagt ten minste zes
      maanden en maximaal 2 jaren. Per kalenderjaar kan slechts één beoordeling worden opgemaakt.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel28b
  - number: 28b.6
    text: |-
      De beoordeling wordt opgemaakt door de eerste beoordelaar en vastgelegd in het bij ministeriële regeling vast te
      stellen beoordelingsformulier.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel28b
  - number: 28b.7
    text: |-
      Na het opstellen van de beoordeling wordt deze besproken met de militair. De militair ontvangt een afschrift van
      de beoordeling waarna hij twee weken de tijd heeft om bedenkingen kenbaar te maken bij de tweede beoordelaar. Deze
      termijn kan op verzoek van de militair met twee weken worden verlengd.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel28b
  - number: 28b.8
    text: |-
      De tweede beoordelaar neemt de beoordeling en de eventueel daartegen ingediende bedenkingen in beschouwing en stelt
      de beoordeling vast. De militair ontvangt een afschrift van de vastgestelde beoordeling.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel28b
  - number: 28b.9
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld ten aanzien van het opmaken en vaststellen van
      beoordelingen.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel28b
  - number: 28c.1
    text: |-
      Gegevens betreffende gedragingen of omstandigheden van een militair kunnen schriftelijk worden vastgelegd in een
      ambtsbericht.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel28c
  - number: 28c.2
    text: |-
      De militair wordt schriftelijk in kennis gesteld van een voorgenomen ambtsbericht, waarna hij vier weken de tijd
      heeft om eventuele schrifelijke bedenkingen kenbaar te maken. Deze termijn kan op verzoek van de militair met twee
      weken worden verlengd.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel28c
  - number: 28c.3
    text: |-
      Onze Minister houdt bij de vaststelling van een ambtsbericht rekening met de door de militair ingediende
      bedenkingen en stelt vervolgens het ambtsbericht vast. Onze Minister kan besluiten af te zien van het vaststellen
      van het ambtsbericht.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel28c
  - number: 28c.4
    text: |-
      De militair ontvangt een afschrift van het ambtsbericht. Indien Onze Minister besluit af te zien van het
      vaststellen van een ambtsbericht ontvangt de militair een afschrift hiervan.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel28c
  - number: 28c.5
    text: |-
      Een ambtsbericht kan gedurende een periode van ten hoogste zes jaar na de vaststelling worden meegewogen bij een te
      nemen rechtspositioneel besluit.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel28c
  - number: 28c.6
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de vorm en de wijze van indiening
      van ambtsberichten.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel28c
  - number: '29'
    text: Onze Minister stelt het aantal militairen vast dat een bepaalde rang mag bekleden.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel29
  - number: 29a.1
    text: |-
      Voor de toepassing van dit artikel wordt verstaan onder soldaten: bij de Koninklijke landmacht en luchtmacht:
      soldaten der 1e, 2e en 3e klasse.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel29a
  - number: 29a.2
    text: Voor soldaten bedraagt de maximum looptijd in rang in totaal acht jaren.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel29a
  - number: 29a.3
    text: |-
      Ten aanzien van soldaten wordt uiterlijk twee jaar voor het verstrijken van de periode van de maximum looptijd in
      rang, door Onze Minister besloten of hij tijdens de resterende periode kan worden bevorderd naar een hogere rang,
      als bedoeld in [artikel 29b][ref1] en [29c][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel29b
      [ref2]: https://wetten.overheid.nl/BWBR0003482#Artikel29c
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel29a
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: 29b
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0003482
        artikel: 29c
        hoofdstuk: '4'
  - number: 29a.4
    text: 'Onze Minister besluit over de bevordering naar een hogere rang, genoemd in het derde lid, op basis van:'
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel29a
  - number: 29a.4.a
    text: de beschikbare functies;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel29a
  - number: 29a.4.b
    text: |-
      het aantal militairen dat de hogere rang mag bekleden, genoemd in [artikel 29][ref1] en


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel29
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel29a
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '29'
        hoofdstuk: '4'
  - number: 29a.4.c
    text: de geschiktheid van de militair voor functievervulling in de hogere rang.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel29a
  - number: 29a.5
    text: Soldaten komen niet in aanmerking voor doorstroom naar functievervulling in fase drie.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel29a
  - number: 29a.6
    text: |-
      Bij ministeriële regeling kunnen voor specifieke functiegroepen nadere regels worden gesteld over een afwijkende
      maximale looptijd in rang. Daarbij wordt rekening gehouden met de noodzaak van een zo goed en tijdig mogelijke
      bezetting van alle functies binnen die functiegroep in samenhang met de arbeidsmarktpositie van de militairen,
      behorende tot de aan te wijzen functiegroep.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel29a
  - number: 29b.1
    text: 'Voor de toepassing van dit artikel wordt verstaan onder korporaals en overeenkomstige rangen:'
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel29b
  - number: 29b.1.a
    text: 'bij de Koninklijke marine: matrozen der 1e klasse en mariniers der 1e klasse;'
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel29b
  - number: 29b.1.b
    text: 'bij de Koninklijke landmacht en luchtmacht: korporaals en korporaals der 1e klasse;'
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel29b
  - number: 29b.1.c
    text: 'bij de Koninklijke marechaussee: marechaussees der 1e en 2e klasse.'
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel29b
  - number: 29b.2
    text: Voor korporaals en overeenkomstige rangen bedraagt de maximum looptijd in rang in totaal acht jaren.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel29b
  - number: 29b.3
    text: |-
      Ten aanzien van korporaals en overeenkomstige rangen wordt uiterlijk twee jaar voor het verstrijken van de periode
      van de maximum looptijd in rang, door Onze Minister besloten of hij tijdens de resterende periode kan worden
      bevorderd naar een hogere rang, als bedoeld in [artikel 29c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel29c
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel29b
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: 29c
        hoofdstuk: '4'
  - number: 29b.4
    text: 'Onze Minister besluit over de bevordering naar een hogere rang, genoemd in het derde lid, op basis van:'
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel29b
  - number: 29b.4.a
    text: de beschikbare functies;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel29b
  - number: 29b.4.b
    text: |-
      het aantal militairen dat de hogere rang mag bekleden, genoemd in [artikel 29][ref1] en


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel29
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel29b
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '29'
        hoofdstuk: '4'
  - number: 29b.4.c
    text: de geschiktheid van de militair voor functievervulling in de hogere rang.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel29b
  - number: 29b.5
    text: |-
      Korporaals of militairen met een overeenkomstige rang komen niet in aanmerking voor doorstroom naar
      functievervulling in fase drie.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel29b
  - number: 29b.6
    text: |-
      Bij ministeriële regeling kunnen voor specifieke functiegroepen nadere regels worden gesteld over een afwijkende
      maximale looptijd in rang. Daarbij wordt rekening gehouden met de noodzaak van een zo goed en tijdig mogelijke
      bezetting van alle functies binnen die functiegroep in samenhang met de arbeidsmarktpositie van de militairen,
      behorende tot de aan te wijzen functiegroep.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel29b
  - number: 29c.1
    text: |-
      Voor korporaals bij de Koninklijke marine, sergeanten, wachtmeesters alsmede sergeanten/wachtmeesters der 1e klasse
      bij de Koninklijke landmacht, luchtmacht en marechaussee bedraagt de maximum looptijd in rang in fase een en twee
      in totaal tien jaren.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel29c
  - number: 29c.2
    text: |-
      Voor officieren in de rang van luitenant ter zee der 2e klasse oudste categorie, kapitein der mariniers of kapitein
      bij de Koninklijke landmacht, luchtmacht of marechaussee bedraagt de maximum looptijd in rang in fase een en twee
      negen jaren.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel29c
  - number: 29c.3
    text: |-
      Voor een onderofficier bedoeld in het eerste lid en een officier bedoeld in het tweede lid, wordt uiterlijk
      drie jaar voor het verstrijken van de periode van de maximum looptijd in rang, een besluit genomen over zijn
      mogelijkheden tot doorstroom naar fase drie.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel29c
  - number: 29c.4
    text: |-
      Bij ministeriële regeling kunnen voor specifieke functiegroepen nadere regels worden gesteld over een afwijkende
      maximale looptijd in rang. Daarbij wordt rekening gehouden met de noodzaak van een zo goed en tijdig mogelijke
      bezetting van alle functies binnen die functiegroep in samenhang met de arbeidsmarktpositie van de militairen,
      behorende tot de aan te wijzen functiegroep.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel29c
  - number: '30.1'
    text: |-
      Met inachtneming van [artikel 29a, derde lid][ref1], [29b, derde lid][ref2], en [29c][ref3], kan Onze Minister een
      militair voordragen voor doorstroom naar fase drie.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel29a
      [ref2]: https://wetten.overheid.nl/BWBR0003482#Artikel29b
      [ref3]: https://wetten.overheid.nl/BWBR0003482#Artikel29c
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: 29a
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0003482
        artikel: 29b
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0003482
        artikel: 29c
        hoofdstuk: '4'
  - number: '30.2'
    text: |-
      Wanneer een militair op verzoek van de commandant van het operationeel commando zijn voorkeur kenbaar maakt
      voor een of meerdere, door de commandant van het operationeel commando bepaalde functies en dit leidt tot een
      functietoewijzing, die gepaard gaat met een doorstroom naar fase drie, wordt dit aangemerkt als een voordracht,
      bedoeld in het eerste lid. Wanneer geen functietoewijzing plaatsvindt, wordt het kenbaar maken van de voorkeur door
      de militair niet aangemerkt als een aanvraag, bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel30
  - number: '30.3'
    text: |-
      Onverminderd het eerste en tweede lid, kan de militair in fase een of twee zelf maximaal drie maal een aanvraag
      voor doorstroom naar fase drie bij Onze Minister indienen.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel30
  - number: '30.4'
    text: Onze Minister informeert de militair tijdig over de mogelijkheid, bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel30
  - number: '30.5'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ter uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel30
  - number: '31.1'
    text: |-
      Onze Minister besluit in beginsel binnen uiterlijk zes weken na ontvangst van de voordracht, genoemd in
      [artikel 30, eerste lid][ref1], of de aanvraag, genoemd in artikel 30, derde lid, op basis van:


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel30
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '30'
        hoofdstuk: '4'
  - number: 31.1.a
    text: de beschikbare functies;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel31
  - number: 31.1.b
    text: |-
      het aantal militairen dat een bepaalde rang mag bekleden, genoemd in [artikel 29][ref1] en


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel29
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '29'
        hoofdstuk: '4'
  - number: 31.1.c
    text: de geschiktheid van de militair voor functievervulling in fase drie.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel31
  - number: '31.2'
    text: |-
      Bij de bepaling van de geschiktheid van de militair, bedoeld in het eerste lid, onder c worden ten minste in
      beschouwing genomen:
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel31
  - number: 31.2.a
    text: het verloop van het gevolgde loopbaanpad;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel31
  - number: 31.2.b
    text: de uitkomst van functioneringsgesprekken en beoordelingen;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel31
  - number: 31.2.c
    text: de gevolgde opleidingen;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel31
  - number: 31.2.d
    text: de uitkomst van loopbaangesprekken;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel31
  - number: 31.2.e
    text: de mate waarin de militair voldoet aan de eisen voor functievervulling in fase 3.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel31
  - number: '31.3'
    text: |-
      In bij ministeriële regeling aan te wijzen gevallen kan worden afgeweken van de in het eerste lid genoemde termijn
      van zes weken tot een maximum van tien weken.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel31
  - number: '31.4'
    text: 'In het in het eerste lid genoemde besluit wordt de militair meegedeeld dat hij:'
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel31
  - number: 31.4.a
    text: doorstroomt naar fase 3;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel31
  - number: 31.4.b
    text: nog niet doorstroomt naar fase drie;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel31
  - number: 31.4.c
    text: niet doorstroomt naar fase drie.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel31
  - number: '31.5'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ter uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel31
  - number: 31a.1
    text: |-
      De soldaat, genoemd in artikel 29a, de korporaal of de militair met een overeenkomstige
      rang, genoemd in [artikel 29b][ref1], of de militair aan wie een besluit, als bedoeld in
      [artikel 31, vierde lid onder b of c][ref2], is meegedeeld en aan wie ontslag zal worden verleend op grond van
      [artikel 39, tweede lid, onder i][ref3], wordt door de commandant van het operationeel commando, waarbij hij
      is ingedeeld, uiterlijk één jaar voor het beoogde ontslagmoment aangemeld bij de employabilitybegeleider, voor
      begeleiding bij de overgang naar een betrekking op de civiele arbeidsmarkt.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel29b
      [ref2]: https://wetten.overheid.nl/BWBR0003482#Artikel31
      [ref3]: https://wetten.overheid.nl/BWBR0003482#Artikel39
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel31a
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: 29b
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0003482
        artikel: '31'
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0003482
        artikel: '39'
        hoofdstuk: '6'
  - number: 31a.2
    text: |-
      De militair die om ontslag verzoekt, kan op zijn aanvraag, onder regie van de employabilitybegeleider, gedurende
      ten hoogste een periode van een jaar, voorafgaand aan de datum van ontslag, worden begeleid bij de overgang naar
      een betrekking op de civiele arbeidsmarkt.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel31a
  - number: 31a.3
    text: |-
      Afspraken, gemaakt in het kader van de bemiddeling, worden vastgelegd in het persoonlijk ontwikkelplanformulier,
      genoemd in [artikel 28a, zesde lid][ref1]. Artikel 28a, zevende tot en met tiende lid, zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel28a
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel31a
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: 28a
        hoofdstuk: '3'
        paragraaf: '4'
  - number: '34.1'
    text: |-
      De militair is van rechtswege in zijn ambt geschorst, wanneer hij krachtens wettelijke maatregel van zijn vrijheid
      is beroofd, tenzij die vrijheidsbeneming het gevolg is van:
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel34
  - number: 34.1.a
    text: |-
      een maatregel, anders dan op grond van de
      [Wet zorg en dwang psychogeriatrische en verstandelijk gehandicapte cliënten][ref1] of de
      [Wet verplichte geestelijke gezondheidszorg][ref2], genomen in het belang van de volksgezondheid of;


      [ref1]: https://wetten.overheid.nl/BWBR0040632
      [ref2]: https://wetten.overheid.nl/BWBR0040635
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0040632
      - id: ref2
        bwb_id: BWBR0040635
  - number: 34.1.b
    text: |-
      een straf op grond van de [Wet militair tuchtrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004788
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0004788
  - number: '34.2'
    text: 'De militair kan voorts in zijn ambt worden geschorst:'
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel34
  - number: 34.2.a
    text: indien een strafrechtelijke vervolging ter zake van misdrijf tegen hem is ingesteld;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel34
  - number: 34.2.b
    text: |-
      wanneer hem is medegedeeld dat hij in aanmerking zal worden gebracht voor ontslag als
      bedoeld in [artikel 39, tweede lid, onderdeel k, l, m of n][ref1], dan wel als bedoeld in
      [artikel 12g, tweede lid, van de Militaire Ambtenarenwet 1931][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0001952#Artikel12g
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '39'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0001952
        artikel: 12g
  - number: 34.2.c
    text: wanneer het belang van de dienst zulks vordert.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel34
  - number: '35.1'
    text: |-
      Schorsing als bedoeld in [artikel 34, tweede lid][ref1], geschiedt door de commandant.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel34
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '34'
        hoofdstuk: '5'
  - number: '35.2'
    text: |-
      In afwijking van het eerste lid geschiedt de schorsing van een geestelijk verzorger en van een militair als bedoeld
      in [artikel 27, eerste lid, onderdeel c, d en e][ref1], door Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel27
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '27'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: '35.3'
    text: |-
      Een schorsing als bedoeld in [artikel 34, tweede lid][ref1], gaat in op het tijdstip, waarop deze de betrokken
      militair bekend wordt gemaakt. Indien het gedurende zes dagen feitelijk niet mogelijk is de militair het
      schorsingsbesluit ter kennis te brengen, gaat de schorsing in op de zevende dag na de dagtekening van het
      schorsingsbesluit.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel34
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '34'
        hoofdstuk: '5'
  - number: '36.1'
    text: |-
      Een schorsing als bedoeld in [artikel 34, tweede lid, onderdeel a en b][ref1], eindigt wanneer hij wordt opgeheven
      door de bevoegde autoriteit, bedoeld in [artikel 35][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0003482#Artikel35
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '34'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0003482
        artikel: '35'
        hoofdstuk: '5'
  - number: '36.2'
    text: |-
      Een schorsing als bedoeld in [artikel 34, tweede lid, onderdeel c][ref1], wordt opgeheven wanneer de belangen van
      de dienst de schorsing niet meer vorderen, doch uiterlijk na drie maanden, tenzij de omstandigheid die aanleiding
      gaf voor die schorsing zich nog immer voordoet.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel34
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '34'
        hoofdstuk: '5'
  - number: '38.1'
    text: Het verlenen van ontslag aan de militair met een officiersrang geschiedt bij koninklijk besluit.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel38
  - number: '38.2'
    text: |-
      Het verlenen van ontslag aan de militair met een rang beneden de rang van luitenant ter zee der 3e klasse/tweede-
      luitenant, of een stand, geschiedt door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel38
  - number: '39.1'
    text: |-
      Aan de militair kan ontslag op aanvraag worden verleend, indien hij daartoe aan het ingevolge [artikel 38][ref1]
      bevoegde gezag schriftelijk de wens te kennen geeft. Indien de ontslagaanvraag wordt ingediend tijdens de proeftijd
      vindt [artikel 12m, onder b, c of d, van de Militaire ambtenarenwet 1931][ref2], geen toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0001952#Artikel12m
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '38'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0001952
        artikel: 12m
  - number: '39.2'
    text: 'Aan de militair kan verder uitsluitend ontslag worden verleend:'
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel39
  - number: 39.2.a
    text: wegens leeftijdsontslag op de datum gelegen vijf jaar vóórdat de militair de pensioengerechtigde leeftijd bereikt;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel39
  - number: 39.2.b
    text: wegens het bereiken van de pensioengerechtigde leeftijd;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel39
  - number: 39.2.c
    text: |-
      wanneer zijn diensten door het ingevolge [artikel 38][ref1] bevoegde gezag niet langer nodig worden geoordeeld,
      nadat hij ingevolge [artikel 8 van de Uitkeringswet gewezen militairen][ref2] weder is aangesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0002540#Artikel8
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '38'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0002540
        artikel: '8'
  - number: 39.2.d
    text: |-
      wegens overtolligheid indien er voor hem geen functie beschikbaar is, onverminderd het bepaalde in
      [artikel 42][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel42
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '42'
        hoofdstuk: '6'
  - number: 39.2.e
    text: 'wanneer hij, bij ontslag uit een ambt, voor het bekleden waarvan hij op non-activiteit was gesteld:'
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel39
  - number: 39.2.e.1°
    text: |-
      het ingevolge [artikel 38][ref1] bevoegde gezag niet doet blijken van zijn verlangen om in werkelijke dienst te
      worden gehandhaafd; dan wel


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel38
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '38'
        hoofdstuk: '6'
  - number: 39.2.e.2°
    text: |-
      ofschoon hij dat verlangen te kennen heeft gegeven, naar verwachting niet binnen twee jaren bij het krijgsmachtdeel
      waartoe hij behoort, of indien dat niet mogelijk is bij een ander krijgsmachtdeel, kan worden geplaatst;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel39
  - number: 39.2.f
    text: ter zake van blijvende ongeschiktheid voor het vervullen van de dienst uit hoofde van een ziekte of een gebrek;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel39
  - number: 39.2.g
    text: |-
      ter zake van het bereiken of overschrijden van de leeftijd van vijftig jaar, wanneer hij naar het oordeel van het
      ingevolge [artikel 38][ref1] bevoegde gezag - in verband met zijn leeftijd voor het vervullen van de dienst niet
      meer ten volle geschikt is;


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel38
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '38'
        hoofdstuk: '6'
  - number: 39.2.h
    text: |-
      wegens ontheffing van de initiële opleiding tot het volgen waarvan hij bij zijn aanstelling is aangewezen, om reden
      dat hij niet voldoet aan de bij die opleiding gestelde eisen;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel39
  - number: 39.2.i
    text: |-
      voor soldaten en korporaals wegens het niet kunnen worden bevorderd op basis van een besluit als bedoeld in
      [artikel 29a, derde lid][ref1], respectievelijk [29b, derde lid][ref2], uiterlijk twee jaar na dat besluit dan wel
      voor onderofficieren en officieren wegens het niet kunnen doorstromen naar fase drie op basis van een besluit als
      bedoeld in [artikel 31 vierde lid onder c][ref3], uiterlijk drie jaar na dat besluit;


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel29a
      [ref2]: https://wetten.overheid.nl/BWBR0003482#Artikel29b
      [ref3]: https://wetten.overheid.nl/BWBR0003482#Artikel31
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: 29a
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0003482
        artikel: 29b
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0003482
        artikel: '31'
        hoofdstuk: '4'
  - number: 39.2.j
    text: |-
      wegens onbekwaamheid of ongeschiktheid voor de vervulling van zijn functie of voor de vervulling van functies
      binnen de groepen van functies, waarvoor hij is bestemd, wat de ongeschiktheid betreft, voor zover het bepaalde
      onder f of g niet toepasselijk is; een en ander onverminderd het bepaalde in [artikel 43][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel43
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '43'
        hoofdstuk: '6'
  - number: 39.2.k
    text: wegens verregaande nalatigheid in de vervulling van zijn plichten;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel39
  - number: 39.2.l
    text: |-
      wegens wangedrag in de dienst, dan wel buiten de dienst voor zover dit gedrag schadelijk is of kan zijn voor zijn
      dienstvervulling of niet in overeenstemming is met het aanzien van zijn ambt;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel39
  - number: 39.2.m
    text: |-
      wegens een vonnis dat in kracht van gewijsde is gegaan en is gewezen in verband met een feit van zodanige aard,
      dat, mede gelet op het algemeen gedrag van de militair, diens ontslag in het belang van de dienst noodzakelijk is;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel39
  - number: 39.2.n
    text: |-
      ter zake van misleiding bij zijn indiensttreding indien blijkt dat hij bij zijn aanmelding onjuiste gegevens heeft
      verstrekt of omstandigheden heeft verzwegen en de juiste gegevens of de verzwegen omstandigheden de aanstelling
      zouden hebben belet, tenzij de militair aannemelijk maakt dat hij te goeder trouw heeft gehandeld.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel39
  - number: '39.3'
    text: |-
      Aan de militair die behoort tot het reserve-personeel kan voorts ontslag worden verleend ter zake van een
      aanstelling in een betrekking, die krachtens enig wettelijk voorschrift onverenigbaar is met de militaire dienst.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel39
  - number: '39.4'
    text: |-
      Aan de militair die is aangesteld bij het reserve-personeel op grond van zijn burgerlijke betrekking kan voorts nog
      ontslag worden verleend ter zake van beëindiging van die burgerlijke betrekking.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel39
  - number: '39.5'
    text: |-
      Aan de militair die behoort tot het reservepersoneel kan voorts nog ontslag worden verleend indien het op grond van
      [artikel 38][ref1] bevoegde gezag handhaving van die dienstverhouding niet langer nodig oordeelt.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel38
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '38'
        hoofdstuk: '6'
  - number: 39.6.a
    text: |-
      Aan de militair behorend tot het beroepspersoneel die de rang van commandeur, brigade-generaal of commodore
      bekleedt, of die een hogere rang bekleedt, kan voorts ontslag worden verleend.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel39
  - number: 39.6.a.1°
    text: |-
      op voordracht van Onze minister-president en Onze Minister, wanneer het belang van de dienst dit noodzakelijk
      maakt;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel39
  - number: 39.6.a.2°
    text: op andere gronden;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel39
  - number: 39.6.b
    text: |-
      In deze gevallen wordt bij koninklijk besluit - in het geval bedoeld onder a, ten eerste, op de gezamenlijke
      voordracht van Onze minister-president en van Onze Minister - een regeling getroffen waarbij aan de betrokkene een
      uitkering wordt toegekend welke met het oog op de omstandigheden redelijk is te achten. Die regeling zal in geen
      geval nadeliger mogen zijn dan die volgens welke de uitkering ingevolge de [Uitkeringswet gewezen militairen][ref1]
      zou zijn toegekend, waarop de betrokken militair aanspraak zou hebben kunnen maken, indien hem, in plaats van
      vorenbedoeld ontslag, op grond van het tweede lid onder a, ontslag zou zijn verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0002540
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0002540
  - number: '39.7'
    text: |-
      Aan de militair voor wie na de aanstelling een proeftijd geldt, kan tijdens die proeftijd ontslag worden verleend
      zonder toepassing van één van de in het tweede lid genoemde ontslaggronden.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel39
  - number: '39.8'
    text: |-
      Wanneer een ontslag op aanvraag, bedoeld in het eerste lid, wordt verleend in verband met het aanvaarden van een
      betrekking op de civiele arbeidsmarkt binnen drie maanden voor het bereiken van het moment van ontslag, genoemd in
      artikel 39, tweede lid, onder i, wordt dit ontslag aangemerkt als een ontslag op grond van het tweede lid, onder i.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel39
  - number: 39a.1
    text: |-
      In afwijking van [artikel 39, tweede lid, onderdeel a][ref1], wordt op aanvraag leeftijdsontslag verleend aan de
      militair die vóór 1 januari 2002 voor onbepaalde tijd is aangesteld bij het beroepspersoneel, bij het bereiken van
      de volgende ontslagleeftijd:


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel39
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel39a
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '39'
        hoofdstuk: '6'
  - number: 39a.1.a
    text: |-
      Voor de militair ingedeeld bij de Koninklijke marine zonder rang, of die een rang bekleedt lager dan luitenant ter
      zee der derde klasse, die de leeftijd van vijftig jaar bereikt:
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel39a
  - number: 39a.1.a.1°
    text: 'in het jaar 2013: tweeënvijftig jaar en zes maanden;'
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel39a
  - number: 39a.1.a.2°
    text: 'in het jaar 2014: drieënvijftig jaar;'
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel39a
  - number: 39a.1.a.3°
    text: 'in het jaar 2015: drieënvijftig jaar en zes maanden;'
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel39a
  - number: 39a.1.a.4°
    text: 'in het jaar 2016: vierenvijftig jaar;'
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel39a
  - number: 39a.1.a.5°
    text: 'in het jaar 2017: vierenvijftig jaar en zes maanden;'
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel39a
  - number: 39a.1.a.6°
    text: 'in het jaar 2018 tot en met het jaar 2024: vijfenvijftig jaar.'
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel39a
  - number: 39a.1.b
    text: |-
      Voor de militair ingedeeld bij de Koninklijke marine, die de rang bekleedt van luitenant ter zee der derde klasse,
      luitenant ter zee der tweede klasse of luitenant ter zee der tweede klasse oudste categorie, die de leeftijd van
      tweeënvijftig jaar bereikt:
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel39a
  - number: 39a.1.b.1°
    text: 'in het jaar 2013: vierenvijftig jaar en zes maanden;'
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel39a
  - number: 39a.1.b.2°
    text: 'in het jaar 2014: vijfenvijftig jaar;'
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel39a
  - number: 39a.1.b.3°
    text: 'in het jaar 2015: vijfenvijftig jaar en zes maanden;'
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel39a
  - number: 39a.1.b.4°
    text: 'in het jaar 2016: zesenvijftig jaar;'
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel39a
  - number: 39a.1.b.5°
    text: 'in het jaar 2017: zesenvijftig jaar en zes maanden;'
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel39a
  - number: 39a.1.b.6°
    text: 'in het jaar 2018 tot en met het jaar 2026: zevenenvijftig jaar.'
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel39a
  - number: 39a.1.c
    text: |-
      Voor de militair ingedeeld bij de Koninklijke marine die de rang bekleedt van luitenant ter zee der eerste klasse,
      of een hogere rang, die de leeftijd van vijfenvijftig jaar bereikt:
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel39a
  - number: 39a.1.c.1°
    text: 'in het jaar 2014: zesenvijftig jaar en zes maanden;'
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel39a
  - number: 39a.1.c.2°
    text: 'in het jaar 2015: zevenenvijftig jaar;'
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel39a
  - number: 39a.1.c.3°
    text: 'in het jaar 2016: zevenenvijftig jaar en zes maanden;'
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel39a
  - number: 39a.1.c.4°
    text: 'in het jaar 2017: achtenvijftig jaar;'
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel39a
  - number: 39a.1.c.5°
    text: 'in het jaar 2018: achtenvijftig jaar en zes maanden;'
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel39a
  - number: 39a.1.c.6°
    text: 'in het jaar 2019: negenenvijftig jaar;'
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel39a
  - number: 39a.1.c.7°
    text: 'in het jaar 2020: negenenvijftig jaar en zes maanden.'
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel39a
  - number: 39a.1.d
    text: |-
      Voor de militairen ingedeeld bij de Koninklijke landmacht, de Koninklijke luchtmacht en de Koninklijke
      marechaussee, die de leeftijd van vijfenvijftig jaar bereiken:
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel39a
  - number: 39a.1.d.1°
    text: 'in het jaar 2013: zevenenvijftig jaar en zes maanden;'
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel39a
  - number: 39a.1.d.2°
    text: 'in het jaar 2014: achtenvijftig jaar;'
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel39a
  - number: 39a.1.d.3°
    text: 'in het jaar 2015: achtenvijftig jaar en zes maanden;'
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel39a
  - number: 39a.1.d.4°
    text: 'in het jaar 2016: negenenvijftig jaar;'
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel39a
  - number: 39a.1.d.5°
    text: 'in het jaar 2017: negenenvijftig jaar en zes maanden.'
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel39a
  - number: 39a.2
    text: |-
      Aan de militair die vóór 1 januari 2017 is aangesteld en die de leeftijd van zestig jaar bereikt in het jaar 2023
      tot en met het jaar 2029 en op wie het eerste of het vierde lid, niet van toepassing is, wordt in afwijking van
      [artikel 39, tweede lid onder a][ref1], op aanvraag ontslag verleend bij het bereiken van de leeftijd van zestig
      jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel39
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel39a
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '39'
        hoofdstuk: '6'
  - number: 39a.3
    text: |-
      Aan de militair ingedeeld bij de Koninklijke marine, zonder rang of die een rang bekleedt lager dan
      luitenant ter zee der eerste klasse, die vóór 1 januari 2017 was aangesteld bij het beroepspersoneel
      en die de leeftijd van zestig jaar bereikt in het jaar 2030 tot en met 2036 wordt in afwijking van
      [artikel 39, tweede lid, onder a][ref1], op aanvraag ontslag verleend bij het bereiken van de leeftijd van zestig
      jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel39
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel39a
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '39'
        hoofdstuk: '6'
  - number: 39a.4
    text: |-
      In afwijking van [artikel 39, tweede lid, onderdeel a][ref1], wordt, onverminderd het eerste lid, aan de militair
      met de rang van kapitein ter zee, kolonel of een hogere rang en aan de militair met de rang van kapitein-luitenant
      ter zee, of luitenant-kolonel, die een universitaire master graad heeft behaald en als zodanig werkzaam is in het
      veld van diens academische deskundigheid, die de leeftijd van zestig jaar bereikt in het jaar 2023 tot en met 2029,
      op aanvraag ontslag verleend op een datum gelegen tussen de leeftijd van zestig en vijfenzestig jaar. Voor hen
      geldt een pensioenleeftijd van 65 jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel39
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel39a
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '39'
        hoofdstuk: '6'
  - number: 39a.5
    text: |-
      Aan de militair, bedoeld in het eerste lid, voor wie de datum van het leeftijdsontslag, bedoeld in
      [artikel 39, tweede lid, onder a][ref1], vier jaar of langer is gelegen na de voor hem op grond van het eerste lid
      geldende ontslagdatum, wordt op aanvraag ontslag verleend vier jaar na die ontslagdatum. Daarbij wordt uitgegaan
      van de ontslagdatum zoals die geldt op de datum van de aanvraag, ook al komt de militair naderhand te behoren
      tot een andere categorie, bedoeld in het eerste lid, onder a, b, c of d, of tot een van de categorieën bedoeld in
      [artikel 39b, onder a of b][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0003482#Artikel39b
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel39a
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '39'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0003482
        artikel: 39b
        hoofdstuk: '6'
  - number: 39a.6
    text: |-
      Bij ministeriële regeling wordt de datum vastgesteld waarop een aanvraag als bedoeld in dit artikel uiterlijk kan
      worden ingediend.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel39a
  - number: 39b
    text: |-
      In afwijking van [artikel 39, tweede lid, onderdeel a][ref1], wordt, onverminderd [artikel 39a, eerste lid][ref2],
      leeftijdsontslag verleend met ingang van een individueel te bepalen datum gelegen tussen de datum waarop de
      militair nog vijf jaar is verwijderd van de pensioengerechtigde leeftijd en het bereiken van de pensioengerechtigde
      leeftijd:


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0003482#Artikel39a
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel39b
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '39'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0003482
        artikel: 39a
        hoofdstuk: '6'
  - number: 39b.a
    text: aan een militair met de rang van kapitein ter zee, kolonel of een hogere rang;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel39b
  - number: 39b.b
    text: |-
      met zijn instemming, aan een militair met de rang van kapitein-luitenant ter zee, of luitenant-kolonel die een
      universitaire master graad heeft behaald en als zodanig werkzaam is in het veld van zijn academische deskundigheid.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel39b
  - number: 39c.1
    text: |-
      De voor een militair met toepassing van [artikel 39, tweede lid onderdeel a][ref1], of
      [artikel 39a, eerste tot en met vierde lid][ref2], vastgestelde datum van leeftijdsontslag wordt op aanvraag van
      deze militair vervroegd in verband met de buiten Nederland doorgebrachte inzet in het kader van een vredes- of
      humanitaire operatie, of het anderszins hebben verricht van arbeid onder omstandigheden waarbij de bepalingen van
      de [Arbeidstijdenwet][ref3] of van [hoofdstuk 7][ref4] van dit besluit niet van toepassing waren.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0003482#Artikel39a
      [ref3]: https://wetten.overheid.nl/BWBR0007671
      [ref4]: https://wetten.overheid.nl/BWBR0003482#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel39c
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '39'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0003482
        artikel: 39a
        hoofdstuk: '6'
      - id: ref3
        bwb_id: BWBR0007671
      - id: ref4
        bwb_id: BWBR0003482
        hoofdstuk: '7'
  - number: 39c.2
    text: 'De in het eerste lid bedoelde vervroeging bedraagt ten hoogste:'
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel39c
  - number: 39c.2.a
    text: |-
      één derde van de tijd die vanaf 1 januari 1990 tot en met 31 december 2007 in het kader van een vredes- of
      humanitaire operatie buiten Nederland is doorgebracht;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel39c
  - number: 39c.2.b
    text: |-
      de helft van de tijd die vanaf 1 januari 2008 in het kader van een vredes- of humanitaire operatie buiten Nederland
      is doorgebracht; en
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel39c
  - number: 39c.2.c
    text: |-
      de helft van de tijd vanaf 1 januari 2017 waarbij de militair voor ten minste zeven aaneengesloten dagen
      arbeid heeft verricht onder omstandigheden waarbij de bepalingen van de [Arbeidstijdenwet][ref1] of van
      [hoofdstuk 7][ref2] van dit besluit niet van toepassing waren.


      [ref1]: https://wetten.overheid.nl/BWBR0007671
      [ref2]: https://wetten.overheid.nl/BWBR0003482#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel39c
    references:
      - id: ref1
        bwb_id: BWBR0007671
      - id: ref2
        bwb_id: BWBR0003482
        hoofdstuk: '7'
  - number: 39c.3
    text: |-
      Een aanvraag als bedoeld in het eerste lid wordt door de militair ten minste achttien maanden vóór de door de
      militair beoogde datum van leeftijdsontslag bij het bevoegde gezag ingediend.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel39c
  - number: 39c.4
    text: |-
      Op militairen aan wie op aanvraag leeftijdsontslag wordt verleend als bedoeld in
      [artikel 39a, is het tweede lid, onderdeel c][ref1], niet van toepassing. De verlaging van de ontslagleeftijd voor
      deze militairen bedraagt maximaal twee jaren terwijl de ontslagleeftijd niet lager kan zijn dan achtenvijftig jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel39a
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel39c
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: 39a
        hoofdstuk: '6'
  - number: 39d.1
    text: |-
      Onze Minister kan op aanvraag van een militair van de [artikelen 39a][ref1], [39b][ref2] of [39c][ref3] afwijken
      voor zover toepassing leidt tot een onbillijkheid van overwegende aard.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel39a
      [ref2]: https://wetten.overheid.nl/BWBR0003482#Artikel39b
      [ref3]: https://wetten.overheid.nl/BWBR0003482#Artikel39c
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel39d
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: 39a
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0003482
        artikel: 39b
        hoofdstuk: '6'
      - id: ref3
        bwb_id: BWBR0003482
        artikel: 39c
        hoofdstuk: '6'
  - number: 39d.2
    text: |-
      Bij ministeriële regeling wordt de datum vastgesteld waarop een aanvraag als bedoeld in dit artikel uiterlijk kan
      worden ingediend
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel39d
  - number: '40'
    text: Aan de militair die een benoeming tot minister of staatssecretaris aanvaardt, wordt om die reden ontslag verleend.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel40
  - number: '41'
    text: |-
      Het ontslag wordt "eervol" verleend, behoudens in de gevallen, genoemd in artikel 39, tweede lid, aanhef en onder
      k, l, m en n, in welke gevallen het ontslag zonder die aanduiding wordt verleend.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel41
  - number: '42'
    text: |-
      Ontslag op grond van [artikel 39, tweede lid, aanhef en onder d][ref1], kan slechts plaatsvinden indien het naar
      het oordeel van Onze Minister na een zorgvuldig onderzoek bedoeld in [artikel 53c, eerste en tweede lid][ref2],
      niet mogelijk is gebleken de militair binnen het gezagsbereik van Onze Minister een andere passende functie toe te
      wijzen. Het ontslag zal worden verleend na ommekomst van het volledige herplaatsingsonderzoek bedoeld in artikel
      53c of eerder indien zulks met de militair wordt overeengekomen dan wel sprake is van een situatie bedoeld in
      [artikel 53e, derde lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0003482#Artikel53c
      [ref3]: https://wetten.overheid.nl/BWBR0003482#Artikel53e
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '39'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0003482
        artikel: 53c
        hoofdstuk: 6a
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0003482
        artikel: 53e
        hoofdstuk: 6a
        paragraaf: '1'
  - number: '43'
    text: |-
      Ontslag op grond van [artikel 39, tweede lid, aanhef en onder j][ref1], kan slechts plaatsvinden indien het
      naar het oordeel van Onze Minister na een zorgvuldig onderzoek niet mogelijk is gebleken de militair binnen het
      gezagsbereik van Onze Minister een andere, mede in verband met zijn persoonlijkheid en omstandigheden passende,
      functie toe te wijzen, dan wel indien hij een zodanige functie weigert te aanvaarden. In het onderzoek wordt de
      mogelijkheid tot bij- of omscholing van de militair betrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel39
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '39'
        hoofdstuk: '6'
  - number: '44'
    text: |-
      Ontslag om de reden, genoemd in artikel 39, tweede lid onder *f*, wordt pas verleend,
      nadat de militair ter zake van het ontstaan, de aard en de gevolgen van zijn ziekte of
      gebrek is onderworpen aan een geneeskundig onderzoek naar de regelen, gesteld bij het
      [Besluit procedure geneeskundig onderzoek blijvende dienstongeschiktheid en pensioenkeuring militairen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008475
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0008475
  - number: '45.1'
    text: |-
      Ontslag om de reden als bedoeld in [artikel 12g, tweede lid, van de Militaire ambtenarenwet 1931][ref1],
      kan slechts plaatsvinden met medewerking van Onze Minister-President dan wel, indien het de militair met een
      officiersrang betreft, op voordracht van Onze Minister-President en Onze Minister. Daaraan voorafgaand wordt het
      advies ingewonnen van een commissie, bestaande uit vijf leden en vijf plaatsvervangende leden.


      [ref1]: https://wetten.overheid.nl/BWBR0001952#Artikel12g
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0001952
        artikel: 12g
  - number: '45.2'
    text: |-
      De leden en de plaatsvervangende leden van de commissie, bedoeld in het eerste lid worden bij koninklijk besluit
      benoemd op voordracht van Onze Minister-President en van Onze Minister. De taak, samenstelling en werkwijze van de
      commissie worden bij de instelling geregeld.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel45
  - number: '47.1'
    text: Ontslag wordt in het algemeen verleend met ingang van de eerste dag van een kalendermaand.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel47
  - number: '47.2'
    text: |-
      Een ontslag op aanvraag anders dan tijdens de proeftijd en een ontslag om een van de redenen, genoemd in
      [artikel 39, tweede lid, aanhef en onder c, d, e, f, g, i en j][ref1], gaan niet eerder in dan nadat ten minste
      drie maanden zijn verstreken sedert het tijdstip waarop het aanvraag om ontslag is ingediend onderscheidenlijk de
      militair van de beslissing tot ontslagverlening schriftelijk in kennis is gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel39
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '39'
        hoofdstuk: '6'
  - number: '47.3'
    text: |-
      Een ontslag op aanvraag tijdens de proeftijd en de ontslagen, bedoeld in
      [artikel 39, tweede lid onder h, en zevende lid][ref1], gaan niet eerder in dan nadat ten minste een maand is
      verstreken sedert het tijdstip waarop het aanvraag om ontslag is ingediend of de militair van de beslissing
      onderscheidenlijk het voorstel tot ontslagverlening schriftelijk in kennis is gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel39
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '39'
        hoofdstuk: '6'
  - number: '47.4'
    text: De in het tweede en derde lid genoemde termijnen kunnen op verzoek van de militair worden bekort.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel47
  - number: '47.5'
    text: |-
      Een ontslag ten gevolge van het aanvaarden van het ambt van minister of staatssecretaris, als bedoeld in
      [artikel 40][ref1], gaat in op de dag van aanvaarding van dit ambt.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel40
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '40'
        hoofdstuk: '6'
  - number: '48'
    text: |-
      Ontslag dat is verleend om een andere reden dan genoemd in artikel 39, tweede lid onder k, l, m of n, en dat nog
      niet is ingegaan, wordt ingetrokken, indien zich inmiddels een omstandigheid heeft voorgedaan die het ingevolge
      artikel 38 bevoegde gezag aanleiding geeft de militair te ontslaan om één van de redenen, genoemd in artikel 39,
      tweede lid onder k, l, m of n.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel48
  - number: '49.1'
    text: |-
      In afwijking van artikel 47, tweede lid, kan het tijdstip van ingang van een ontslag-op-aanvraag van de militair
      die om redenen van dienst buiten Nederland verblijft, worden uitgesteld voor de tijd die onvermijdelijk nodig is om
      hem aldaar te vervangen, maar voor ten hoogste drie maanden.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel49
  - number: '49.2'
    text: |-
      Het ontslag van de militair die om redenen van dienst buiten Nederland verblijft, gaat eerst in op een datum
      gelegen na het tijdstip van zijn terugkeer in Nederland.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel49
  - number: '49.3'
    text: |-
      Van het tweede lid kan worden afgeweken, indien de militair zulks aanvraagt en het dienstbelang zich naar het
      oordeel van het ingevolge artikel 38 bevoegde gezag niet verzet tegen inwilliging van het aanvraag, of indien de
      terugkeer niet tijdig plaatsvindt ten gevolge van omstandigheden die zijn te wijten aan de schuld of het toedoen
      van de militair.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel49
  - number: '51.1'
    text: |-
      Aan de militair aan wie ontslag wordt verleend nadat hij ten minste één jaar in werkelijke dienst is geweest, wordt
      op zijn verzoek de commandant operationeel commando een getuigschrift uitgereikt.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel51
  - number: '51.2'
    text: 'Het getuigschrift vermeldt:'
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel51
  - number: 51.2.a
    text: de begindatum en einddatum van de dienstverhouding, alsmede de arbeidsduur per week;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel51
  - number: 51.2.b
    text: de aard van de verrichte werkzaamheden;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel51
  - number: 51.2.c
    text: de wijze waarop de militair zijn werkzaamheden heeft verricht;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel51
  - number: 51.2.d
    text: de grond waarop aan de militair ontslag is verleend.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel51
  - number: '51.3'
    text: |-
      De in lid 2, onderdelen c en d, genoemde gegevens worden slechts op verzoek van de militair in het getuigschrift
      vermeld.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel51
  - number: '53'
    text: 'De militair is van rechtswege ontslagen:'
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel53
  - number: 53.a
    text: zodra hij het Nederlanderschap verliest;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel53
  - number: 53.b
    text: |-
      zodra een tegen hem gewezen vonnis waarbij de bijkomende straf van ontzetting van het recht om bij de gewapende
      macht te dienen is opgelegd zonder dat daarbij is bepaald dat deze straf geheel of gedeeltelijk niet ten uitvoer
      zal worden gelegd, in kracht van gewijsde is gegaan.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel53
  - number: 53a
    text: |-
      Voor de toepassing van dit hoofdstuk wordt verstaan onder: - *militair* de militair die is aangesteld bij het
      beroepspersoneel;
        - *boventalligheid* de situatie dat een militair zijn functie verliest omdat binnen de te reorganiseren organisatie
      of een onderdeel daarvan, meerdere militairen een vergelijkbare of uitwisselbare functie vervullen en het totale
      aantal van die functies zodanig wordt verminderd dat onvoldoende van die functies resteren;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel53a
  - number: 53b.1
    text: |-
      Een functie is in beginsel passend wanneer de daaraan verbonden werkzaamheden op de capaciteiten en ervaring van
      de militair zijn berekend, tenzij aanvaarding om redenen van lichamelijke, geestelijke of sociale aard niet van de
      militair kan worden gevergd.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel53b
  - number: 53b.2
    text: Bij ministeriële regeling worden nadere regels gesteld ter uitvoering van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel53b
  - number: 53c.1
    text: 'De militair wordt door de commandant operationeel commando aangewezen als herplaatsingskandidaat indien:'
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel53c
  - number: 53c.1.a
    text: |-
      hem met toepassing van [artikel 17][ref1] binnen drie maanden na het vervallen van zijn functie of de vaststelling
      van zijn boventalligheid geen functie is of kan worden toegewezen;


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel17
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel53c
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '17'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 53c.1.b
    text: |-
      hem met toepassing van [artikel 17][ref1] binnen drie maanden na afloop van de duur van een functievervulling of na
      het afronden van een opleiding geen functie is of kan worden toegewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel17
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel53c
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '17'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 53c.2
    text: |-
      De militair wordt over zijn aanwijzing als herplaatsingskandidaat bedoeld in het eerste lid, schriftelijk
      geïnformeerd.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel53c
  - number: 53c.3
    text: |-
      In afwijking van het eerste lid kan Onze Minister in een ministeriële regeling bepalen dat specifieke categorieën
      militairen, aan wie geen functie is of kan worden toegewezen bedoeld in het eerste lid, niet worden aangewezen
      als herplaatsingskandidaat.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel53c
  - number: 53d.1
    text: |-
      Onze Minister onderzoekt gedurende drie maanden, te rekenen vanaf het moment dat de militair is aangewezen als
      herplaatsingskandidaat, of herplaatsing van de militair op een passende functie binnen het gezagsbereik van Onze
      Minister mogelijk is.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel53d
  - number: 53d.2
    text: |-
      Indien het onderzoek bedoeld in het eerste lid niet heeft geleid tot herplaatsing, onderzoekt Onze Minister,
      aansluitend aan de periode bedoeld in het eerste lid, gedurende drie maanden of herplaatsing van de militair op een
      passende functie binnen of buiten het gezagsbereik van Onze Minister mogelijk is.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel53d
  - number: 53d.3
    text: |-
      Indien het onderzoek bedoeld in het tweede lid niet heeft geleid tot herplaatsing, onderzoekt Onze Minister,
      aansluitend aan de periode bedoeld in het tweede lid, gedurende zes maanden of herplaatsing van de militair op een
      passende functie buiten het gezagsbereik van Onze Minister mogelijk is.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel53d
  - number: 53d.4
    text: |-
      De periode van zes maanden bedoeld in het derde lid, wordt voor elk volledig jaar dat de militair is aangesteld bij
      het Ministerie van Defensie, verlengd met een halve maand tot maximaal twaalf maanden.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel53d
  - number: 53d.5
    text: |-
      Onze Minister kan op verzoek van de militair die is aangewezen als herplaatsingskandidaat de duur van de
      herplaatsingsperiode, zoals vastgesteld op grond van het eerste tot en met het vierde lid, verlengen indien de
      omstandigheden naar zijn oordeel daartoe aanleiding geven.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel53d
  - number: 53d.6
    text: Bij ministeriële regeling worden nadere regels gesteld ter uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel53d
  - number: 53e.1
    text: |-
      De herplaatsingskandidaat is verplicht al het mogelijke te doen om een passende functie te vinden en mee te werken
      aan het herplaatsingsonderzoek bedoeld in [artikel 53d][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel53d
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel53e
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: 53d
        hoofdstuk: 6a
        paragraaf: '1'
  - number: 53e.2
    text: |-
      De herplaatsingskandidaat is verplicht een passende functie te aanvaarden tijdens het herplaatsingsonderzoek
      bedoeld in [artikel 53d, derde en vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel53d
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel53e
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: 53d
        hoofdstuk: 6a
        paragraaf: '1'
  - number: 53e.3
    text: |-
      De herplaatsingskandidaat die zonder deugdelijke grond weigert of heeft geweigerd te voldoen aan een
      hem op grond van dit artikel opgelegde verplichting, kan in verband daarmee een ontslag bedoeld in
      [artikel 39, tweede lid, aanhef en onder d][ref1], worden verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel39
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel53e
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '39'
        hoofdstuk: '6'
  - number: 53f.1
    text: 'Onze Minister kan voorzieningen treffen:'
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel53f
  - number: 53f.1.a
    text: om dreigende overtolligheid te voorkomen door ontslag op aanvraag te stimuleren;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel53f
  - number: 53f.1.b
    text: |-
      ten behoeve van militairen die zijn aangewezen als herplaatsingskandidaat bedoeld in [artikel 53c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel53c
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel53f
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: 53c
        hoofdstuk: 6a
        paragraaf: '1'
  - number: 53f.2
    text: Bij ministeriële regeling worden nadere regels gesteld ter uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel53f
  - number: 53g.1
    text: |-
      Ten behoeve van het reguleren van de instroom, doorstroom en uitstroom worden door Onze Minister ten aanzien
      van een of meer militairen die behoren tot een bij ministeriële regeling vastgestelde categorie personeel,
      voorzieningen getroffen.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel53g
  - number: 53g.2
    text: Bij ministeriële regeling worden nadere regels gesteld ter uitvoering van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel53g
  - number: 54a
    text: 'In dit hoofdstuk wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel54a
  - number: 54a.a
    text: 'militair: de militair in werkelijke dienst;'
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel54a
  - number: 54a.b
    text: |-
      diensten: activiteiten die zijn vereist voor het functioneren van de militaire organisatie, voor zover deze zijn
      ingesteld door het hoofd defensieonderdeel;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel54a
  - number: 54a.c
    text: |-
      werkzaamheden: activiteiten die voortvloeien uit de door de militair vervulde functie, alsmede andere opgedragen
      activiteiten die om redenen van dienst of in het algemeen belang noodzakelijk zijn, doch die niet kunnen worden
      aangemerkt als diensten;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel54a
  - number: 54a.d
    text: |-
      werktijd: het totaal van de in kloktijden aangegeven perioden gedurende welke een militair de hem opgedragen
      werkzaamheden of diensten moet verrichten;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel54a
  - number: 54a.e
    text: |-
      rooster: een voor een periode van tenminste een week opgesteld en van tevoren schriftelijk bekendgemaakt schema van
      aanvang en einde van de dagelijkse werk- en rusttijden, eventueel afzonderlijk vastgesteld voor werkzaamheden en
      voor diensten;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel54a
  - number: 54a.f
    text: |-
      arbeidsduur: de tijdsduur, uitgedrukt in een aantal uren per dag of per week, gedurende welke een militair
      werkzaamheden of diensten verricht;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel54a
  - number: 54a.g
    text: 'nachtdienst: een werkdag waarin de uren tussen 00.00 uur en 06.00 uur geheel of gedeeltelijk zijn begrepen;'
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel54a
  - number: 54a.h
    text: |-
      werkdag: een aaneengesloten tijdruimte waarin werkzaamheden of diensten worden verricht en die is gelegen tussen
      twee voorgeschreven opeenvolgende onafgebroken rusttijden;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel54a
  - number: 54a.i
    text: |-
      pauze: een tijdruimte van ten minste 15 achtereenvolgende minuten, waarmee de werkzaamheden of diensten tijdens de
      werkdag worden onderbroken en de militair geen enkele verplichting heeft ten aanzien van de bedongen werkzaamheden
      of diensten;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel54a
  - number: 54a.j
    text: |-
      consignatie: een tijdruimte tussen twee elkaar opeenvolgende werkdagen of tijdens een pauze, waarin die militair
      uitsluitend verplicht is bereikbaar te zijn om in geval van onvoorziene omstandigheden op oproep zo spoedig
      mogelijk de bedongen werkzaamheden of diensten te verrichten;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel54a
  - number: 54a.k
    text: |-
      aanwezigheidsdienst: een aaneengesloten tijdruimte van ten hoogste 24 uren, waarin de militair, zo nodig naast het
      verrichten van de bedongen werkzaamheden of diensten, consignatie wordt opgelegd waarbij die militair verplicht
      is op de werkplek aanwezig te zijn om op oproep zo spoedig mogelijk de bedongen werkzaamheden of diensten te
      verrichten;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel54a
  - number: 54a.l
    text: |-
      piket: een periode waarin de militair, zo nodig naast het verrichten van de bedongen werkzaamheden of diensten,
      consignatie wordt opgelegd waarbij de militair verplicht is om in verband met zijn bereikbaarheid op de werkplek
      aanwezig te zijn;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel54a
  - number: 54a.m
    text: |-
      oefening: elk door defensiepersoneel in de praktijk brengen van onderwezen bekwaamheden teneinde aldus de
      bedrevenheid in het uitvoeren van aan de krijgsmacht opgedragen operationele taken te verwerven, te vergroten of
      te onderhouden.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel54a
  - number: 54b.1
    text: De militair verricht de hem opgedragen werkzaamheden of diensten in beginsel gedurende vastgestelde werktijden.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel54b
  - number: 54b.2
    text: |-
      De werk- en rusttijden van de militair worden met inachtneming van de bepalingen in dit hoofdstuk, en nadat
      hierover overeenkomstig het [Besluit medezeggenschap defensie][ref1] overeenstemming is bereikt met de betrokken
      medezeggenschapscommissie, vastgesteld door de commandant en schriftelijk vastgelegd in roosters.


      [ref1]: https://wetten.overheid.nl/BWBR0010617
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel54b
    references:
      - id: ref1
        bwb_id: BWBR0010617
  - number: 54b.3
    text: De werktijd dient zoveel mogelijk te zijn gelegen tussen 07.00 en 18.00 uur.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel54b
  - number: 54b.4
    text: |-
      De arbeidsduur bedraagt gerekend over de periode waarvoor het rooster is vastgesteld ten hoogste gemiddeld 38 uren
      per week. Hiervan kan worden afgeweken ter zake van het verrichten van diensten.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel54b
  - number: 54b.5
    text: |-
      Door Onze Minister kunnen functies worden aangewezen waarbij het reizen, naar en vanaf de plaats waar de militair
      werkzaamheden of diensten moet verrichten, een wezenlijk bestanddeel uitmaakt van de functie. Bij die functies
      wordt de reisduur buiten de voor de militair geldende werktijd als arbeidsduur aangemerkt.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel54b
  - number: 54c.1
    text: |-
      De commandant die een rooster vaststelt of opnieuw vaststelt, maakt het rooster ten minste 28 dagen vóór de datum
      van inwerkingtreding bekend aan de militair.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel54c
  - number: 54c.2
    text: |-
      Indien de aard van de werkzaamheden of diensten toepassing van het eerste lid onmogelijk maakt, stelt de commandant
      ten minste 28 dagen van tevoren aan de militair bekend op welke dag de rusttijd, bedoeld in de artikelen 56e en
      57a, eerste lid, aanvangt. Tevens maakt hij aan de militair ten minste 4 dagen van tevoren de tijdstippen bekend
      waarop hij werkzaamheden of diensten moet verrichten.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel54c
  - number: 54c.3
    text: |-
      De commandant dient overeenstemming te bereiken met de betrokken medezeggenschapscommissie, indien het dienstbelang
      het noodzakelijk maakt af te wijken van het eerste of tweede lid.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel54c
  - number: 54d.1
    text: |-
      De militair kan bij de commandant eenmaal per kalenderjaar een aanvraag indienen om zijn arbeidsduur gedurende het
      resterende deel van dat kalenderjaar met 2 uren per week te verlengen wanneer:
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel54d
  - number: 54d.1.a
    text: de militair is aangesteld bij het beroepspersoneel; en
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel54d
  - number: 54d.1.b
    text: de militair een functie vervult in fase twee of fase drie; en
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel54d
  - number: 54d.1.c
    text: |-
      het rooster van de militair in het resterende deel van dat kalenderjaar zal zijn gebaseerd op een arbeidsduur van
      gemiddeld 38 uur per week.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel54d
  - number: 54d.2
    text: |-
      De commandant wijst een aanvraag als bedoeld in het eerste lid toe, tenzij het dienstbelang zich daartegen verzet.
      In ieder geval wordt de aanvraag afgewezen indien de tijdelijke verlenging van de arbeidsduur geen effect heeft op
      de formatie, onder door Onze Minister bij ministeriële regeling nader vast te stellen voorwaarden.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel54d
  - number: 54d.3
    text: |-
      Een toegestane verlenging van de arbeidsduur gaat in op de eerste dag van de maand, volgend op de maand waarin de
      verlenging is toegestaan.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel54d
  - number: 54d.4
    text: 'Een toegestane verlenging van de arbeidsduur wordt jaarlijks stilzwijgend voortgezet tenzij:'
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel54d
  - number: 54d.4.a
    text: de militair een aanvraag indient om de tijdelijke verlenging van de arbeidsduur te beëindigen; of
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel54d
  - number: 54d.4.b
    text: |-
      de militair een aanvraag indient als bedoeld in [artikel 54e, eerste lid][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel54e
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel54d
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: 54e
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 54d.4.c
    text: |-
      de commandant de verlenging van de arbeidsduur beëindigt omdat hij van oordeel is dat het dienstbelang zich tegen
      een voortgezette verlenging daarvan verzet.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel54d
  - number: 54d.5
    text: |-
      Indien de militair een andere functie wordt toegewezen vervalt met ingang van de datum waarop hij de nieuwe functie
      gaat vervullen de verlenging van de arbeidsduur. In dat geval kan de militair bij zijn nieuwe commandant een
      aanvraag als bedoeld in het eerste lid indienen.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel54d
  - number: 54d.6
    text: |-
      Voor het deel dat de arbeidsduur wordt verlengd ontvangt de militair een maandelijkse toeslag. Deze toeslag
      bedraagt acht maal 1/165 deel van het voor de betrokken militair geldende maandsalaris, of een evenredig deel
      daarvan voor de militair die in verband met deeltijdverlof een arbeidsduur heeft van gemiddeld minder dan 38 uur
      per week.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel54d
  - number: 54e.1
    text: |-
      De militair kan bij de commandant eenmaal per kalenderjaar een aanvraag indienen om zijn arbeidsduur gedurende het
      resterende deel van dat kalenderjaar met 2 uren per week te verkorten wanneer:
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel54e
  - number: 54e.1.a
    text: de militair is aangesteld bij het beroepspersoneel; en
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel54e
  - number: 54e.1.b
    text: de militair een functie vervult in fase twee of fase drie; en
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel54e
  - number: 54e.1.c
    text: |-
      het rooster van de militair in het resterende deel van dat kalenderjaar zal zijn gebaseerd op een arbeidsduur van
      gemiddeld 38 uur per week.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel54e
  - number: 54e.2
    text: |-
      De in het eerste lid bedoelde verkorting van de arbeidsduur wordt verwerkt in het voor de betrokken militair
      geldende rooster dan wel wordt toegekend in de vorm van acht spaaruren per maand wanneer het een militair betreft
      van wie het rooster is gebaseerd op een arbeidsduur van gemiddeld 38 uur per week. Voor de militair die in verband
      met deeltijdverlof een arbeidsduur heeft van gemiddeld minder dan 38 uur per week wordt de ingevolge de vorige
      volzin geldende aanspraak vastgesteld op een evenredig deel van de aanspraak bij een arbeidsduur van gemiddeld 38
      uur per week.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel54e
  - number: 54e.3
    text: De commandant wijst een aanvraag indien het gaat om een militair als bedoeld in het eerste lid toe.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel54e
  - number: 54e.4
    text: |-
      Een toegestane verkorting van de arbeidsduur gaat in op de eerste dag van de maand, volgend op de maand waarin de
      verkorting is toegestaan.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel54e
  - number: 54e.5
    text: 'Een toegestane verkorting van de arbeidsduur wordt jaarlijks stilzwijgend voortgezet tenzij:'
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel54e
  - number: 54e.5.a
    text: de militair een aanvraag indient om de tijdelijke verkorting van de arbeidsduur te beëindigen; of
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel54e
  - number: 54e.5.b
    text: |-
      de militair een aanvraag indient als bedoeld in [artikel 54d, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel54d
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel54e
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: 54d
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 54e.6
    text: |-
      Indien de militair een andere functie wordt toegewezen vervalt met ingang van de datum waarop hij de nieuwe functie
      gaat vervullen de verkorting van de arbeidsduur. In dat geval kan de militair bij zijn nieuwe commandant een
      aanvraag als bedoeld in het eerste lid indienen.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel54e
  - number: 54e.7
    text: |-
      Voor het deel dat de arbeidsduur wordt verkort, wordt maandelijks een inhouding op de inkomsten van de militair
      toegepast. Deze inhouding bedraagt 2 maal 1/165 deel van het voor de betrokken militair geldende maandsalaris, of
      een evenredig deel daarvan voor de militair die in verband met deeltijdverlof een arbeidsduur heeft van gemiddeld
      minder dan 38 uur per week.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel54e
  - number: 54f.1
    text: |-
      De spaaruren, bedoeld in [artikel 54e, tweede lid][ref1], worden geheel of gedeeltelijk in een aaneengesloten
      periode van ten minste 288 spaaruren en ten hoogste 960 spaaruren opgenomen. Voor de militair die in verband met
      deeltijdverlof een arbeidsduur heeft van gemiddeld minder dan 38 uur per week wordt de in de vorige volzin genoemde
      verplichting vastgesteld op een aaneengesloten periode van een evenredig aantal spaaruren van het aantal dat geldt
      voor een militair met een arbeidsduur van gemiddeld 38 uur per week.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel54e
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel54f
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: 54e
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 54f.2
    text: |-
      De spaaruren worden in beginsel opgenomen bij functiewisseling, voorafgaand aan de datum van plaatsing op de nieuwe
      functie.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel54f
  - number: 54f.3
    text: |-
      In afwijking van het tweede lid kan de opname van spaaruren gedurende de functievervulling worden toegestaan,
      tenzij het dienstbelang zich hiertegen verzet.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel54f
  - number: 54f.4
    text: |-
      Indien de militair van functie wisselt kan het hoofd defensieonderdeel op aanvraag van de militair afwijken van
      het minimum aantal op te nemen spaaruren. Indien de militair wordt verplaatst kan het hoofd defensieonderdeel op
      aanvraag van de militair afwijken van het gestelde in het eerste lid dat de spaaruren in een aaneengesloten periode
      van ten minste 288 spaaruren worden opgenomen. Indien met een dergelijke aanvraag wordt ingestemd, dan wordt het
      gehele tegoed aan spaaruren opgenomen bij functiewisseling, voorafgaand aan de datum van plaatsing op de nieuwe
      functie.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel54f
  - number: 54f.5
    text: |-
      Een aanvraag voor de opname van spaaruren wordt ten minste 6 maanden voorafgaande aan de gewenste datum van aanvang
      van de opnameperiode, ingediend bij het hoofd defensieonderdeel.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel54f
  - number: 54f.6
    text: |-
      De in een kalenderjaar opgebouwde spaaruren vervallen na een periode van 10 kalenderjaren, te rekenen vanaf de dag
      van aanvang van het daarop volgende kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel54f
  - number: 54f.7
    text: |-
      Indien vanwege dienstbelang dan wel persoonlijke omstandigheden de militair gedurende de periode van 10
      jaar bedoeld in het zesde lid niet in de gelegenheid is gesteld de spaaruren op te nemen, maakt het hoofd
      defensieonderdeel in afwijking van het zesde lid met de militair afspraken over de opname van de spaaruren binnen
      de 2 daaropvolgende kalenderjaren.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel54f
  - number: 54f.8
    text: |-
      Ten aanzien van de opname van spaaruren zijn de [artikelen 64][ref1], [65][ref2], [66][ref3] en [67][ref4] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel64
      [ref2]: https://wetten.overheid.nl/BWBR0003482#Artikel65
      [ref3]: https://wetten.overheid.nl/BWBR0003482#Artikel66
      [ref4]: https://wetten.overheid.nl/BWBR0003482#Artikel67
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel54f
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '64'
        hoofdstuk: '8'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0003482
        artikel: '65'
        hoofdstuk: '8'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0003482
        artikel: '66'
        hoofdstuk: '8'
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0003482
        artikel: '67'
        hoofdstuk: '8'
        paragraaf: '1'
  - number: 54fa
    text: |-
      In afwijking van het bepaalde in de [artikelen 54d][ref1], [54e][ref2], [54f][ref3] berust de bevoegdheid tot
      het toekennen van een aanvraag van militairen met de rang van kapitein ter zee/kolonel en hoger op grond van deze
      artikelen, bij de Secretaris-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel54d
      [ref2]: https://wetten.overheid.nl/BWBR0003482#Artikel54e
      [ref3]: https://wetten.overheid.nl/BWBR0003482#Artikel54f
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel54fa
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: 54d
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0003482
        artikel: 54e
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0003482
        artikel: 54f
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 54g
    text: |-
      Indien de militair op de datum dat hij de werkelijke dienst verlaat nog een tegoed aan spaaruren heeft, dan wordt
      voor elk spaaruur een vergoeding toegekend van 1/165 deel van het voor de betrokken militair geldende maandsalaris,
      zoals dit gold direct voorafgaande aan het verlaten van de werkelijke dienst.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel54g
  - number: 54h.1
    text: |-
      De commandant voert een deugdelijke registratie ter zake van de werk- en rusttijden en de realisatie daarvan, welke
      het toezicht op de naleving van de bepalingen in dit hoofdstuk mogelijk maakt.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel54h
  - number: 54h.2
    text: |-
      De in het eerste lid bedoelde gegevens en bescheiden worden ten minste 52 weken, gerekend vanaf de datum waarop de
      desbetreffende gegevens en bescheiden betrekking hebben, bewaard.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel54h
  - number: 54i
    text: |-
      Voor de toepassing van de bepalingen in dit hoofdstuk, ten aanzien van de arbeidsduur, wordt voor het bepalen
      van het aantal uren dat werkzaamheden of diensten worden verricht, meegeteld de uren waarop de militair de
      werkzaamheden of diensten zou hebben verricht, maar deze uren in het kader van de medezeggenschap als bedoeld in
      [artikel 17 van het Besluit medezeggenschap defensie][ref1], ziekte, verlof als bedoeld in artikel 61, tweede lid,
      met uitzondering van buitengewoon verlof in verband met deeltijdarbeid, of de vervulling van door wet of overheid
      opgelegde verplichting welke niet in zijn vrije tijd kon geschieden, niet heeft verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0010617#Artikel17
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel54i
    references:
      - id: ref1
        bwb_id: BWBR0010617
        artikel: '17'
  - number: 54j
    text: |-
      Voor de toepassing van de bepalingen in dit hoofdstuk ten aanzien van de zondag, vindt voor de militair, die in
      verband met zijn godsdienstige of levensbeschouwelijke opvatting, de wekelijkse rustdag op een andere dag dan de
      zondag viert, overeenkomstige toepassing ten aanzien van die dag in plaats van ten aanzien van de zondag, indien
      die militair dit schriftelijk verzoekt.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel54j
  - number: 54k.1
    text: |-
      Indien uit arbeidsgezondheidskundig onderzoek blijkt, dat de gezondheidsproblemen van een militair voortvloeien uit
      het verrichten van nachtdiensten, dan worden de werkzaamheden of diensten van die militair binnen redelijke termijn
      zodanig ingericht, dat hij werkzaamheden of diensten verricht anders dan in nachtdienst.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel54k
  - number: 54k.2
    text: |-
      De commandant voldoet aan de voor hem uit het eerste lid voortvloeiende verplichting, tenzij hij aannemelijk maakt
      dat dit redelijkerwijs niet van hem kan worden gevergd.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel54k
  - number: 55a.1
    text: |-
      Dit hoofdstuk en de daarop berustende bepalingen zijn, met uitzondering van paragraaf 12, niet van toepassing op
      werkzaamheden of diensten verricht:
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel55a
  - number: 55a.1.a
    text: |-
      ten tijde van buitengewone omstandigheden, alsmede ten aanzien van een onderdeel van de krijgsmacht, waaraan de
      mededeling bedoeld in [artikel 71 van het Wetboek van Militair Strafrecht][ref1] is gedaan;


      [ref1]: https://wetten.overheid.nl/BWBR0001869#Artikel71
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel55a
    references:
      - id: ref1
        bwb_id: BWBR0001869
        artikel: '71'
  - number: 55a.1.b
    text: |-
      ter uitvoering van bij wet of daarop berustende bepalingen opgedragen taken, voor zover de toepassing van dit
      hoofdstuk en de daarop berustende bepalingen een goede taakuitoefening belemmert;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel55a
  - number: 55a.1.c
    text: in door Onze Minister te bepalen andere gevallen waarin onderdelen van de krijgsmacht worden ingezet;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel55a
  - number: 55a.1.d
    text: inzake aangelegenheden die rechtstreeks betrekking hebben op de omstandigheden, bedoeld onder a, b, en c.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel55a
  - number: 55a.2
    text: |-
      Dit hoofdstuk en de daarop berustende bepalingen zijn, met uitzondering van de paragrafen 11 en 12, niet van
      toepassing op werkzaamheden of diensten verricht:
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel55a
  - number: 55a.2.a
    text: tijdens varen, vliegen en oefeningen;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel55a
  - number: 55a.2.b
    text: inzake aangelegenheden die rechtstreeks betrekking hebben op het varen, het vliegen en het houden van oefeningen.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel55a
  - number: 55b
    text: |-
      Dit hoofdstuk en de daarop berustende bepalingen zijn, met uitzondering van de paragrafen 2 en 12, niet van
      toepassing op verrichtingen van de militair die een opleiding volgt als bedoeld in de artikelen 13, 14 en 15.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel55b
  - number: 55c
    text: |-
      Dit hoofdstuk en de daarop berustende bepalingen zijn van toepassing op werkzaamheden of diensten verricht door
      militair brandweerpersoneel, tenzij dit personeel repressief optreedt bij brand en ongevallen.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel55c
  - number: 55d
    text: |-
      Dit hoofdstuk en de daarop berustende bepalingen zijn, met uitzondering van de paragrafen 2, 11 en 12, en
      de artikelen 54a, 54b, derde tot en met vijfde lid, 54d, 54e, 54f, 54g, 54k en 57a, niet van toepassing op
      werkzaamheden of diensten verricht door:
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel55d
  - number: 55d.a
    text: |-
      de militair van 18 jaar en ouder met de rang van luitenant ter zee der 1e klasse dan wel majoor of een hogere rang
      die uitsluitend of in hoofdzaak leiding geeft;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel55d
  - number: 55d.b
    text: |-
      de militair van 18 jaar en ouder met de rang van kapitein-luitenant ter zee dan wel luitenant-kolonel of met een
      hogere rang, tenzij hij werkzaamheden of diensten pleegt te verrichten in nachtdienst dan wel werkzaamheden of
      diensten verricht waaraan of in rechtstreeks verband waarmee ernstige gevaren voor de veiligheid of de gezondheid
      van personen zijn verbonden.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel55d
  - number: 55e
    text: |-
      Dit hoofdstuk en de daarop berustende bepalingen zijn, met uitzondering van de paragrafen 2, 11 en 12, en
      de artikelen 54a, 54b, vierde lid, 54d, 54e, 54f, 54g, 54k en 57a, eerste en tweede lid, niet van toepassing
      op werkzaamheden of diensten verricht door de militair, bedoeld in artikel 2, tweede lid, voor zover hij is
      tewerkgesteld buiten Nederland.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel55e
  - number: 55f
    text: |-
      Dit hoofdstuk en de daarop berustende bepalingen zijn, met uitzondering van de paragrafen 2, 11 en 12, en
      de artikelen 54a, 54b, derde tot en met vijfde lid, 54d, 54e, 54f, 54g, 54k en 57a, niet van toepassing op
      werkzaamheden of diensten verricht door de militair van 18 jaar en ouder die werkzaam is als medisch specialist,
      als huisarts of als sociaal geneeskundige en als zodanig staat geregistreerd in één van de registers van de
      Koninklijke Nederlandsche Maatschappij tot bevordering der Geneeskunst, dan wel als tandheelkundig specialist en
      als zodanig staat ingeschreven in het specialistenregister van de Nederlandse Maatschappij tot bevordering der
      Tandheelkunde.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel55f
  - number: 56a.1
    text: |-
      De arbeidsduur van de militair bedraagt ten hoogste 10 uren per werkdag, in elke periode van 4 achtereenvolgende
      weken ten hoogste gemiddeld 50 uren per week en in elke periode van 13 achtereenvolgende weken ten hoogste
      gemiddeld 45 uren per week.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel56a
  - number: 56a.2
    text: |-
      De commandant dient over de toepassing van het eerste lid overeenstemming te bereiken met de betrokken
      medezeggenschapscommissie, indien het dienstbelang het noodzakelijk maakt dat de militair meer dan 9 uren per
      werkdag of meer dan 45 uren per week werkzaamheden of diensten verricht.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel56a
  - number: 56a.3
    text: |-
      Indien het eerste en tweede lid niet wordt toegepast, dan bedraagt de arbeidsduur ten hoogste 9 uren per werkdag,
      ten hoogste 45 uren per week en ten hoogste gemiddeld 40 uren per week in elke periode van 13 achtereenvolgende
      weken.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel56a
  - number: 56b.1
    text: |-
      Van de in artikel 56a genoemde arbeidsduur kan worden afgeweken indien zich een onvoorziene wijziging van
      omstandigheden, incidenteel en niet periodiek, voordoet, of de aard van de werkzaamheden of diensten, incidenteel
      en voor korte tijd, dergelijke afwijkingen noodzakelijk maakt.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel56b
  - number: 56b.2
    text: |-
      De arbeidsduur bedraagt in situaties als bedoeld in het eerste lid ten hoogste 12 uren per werkdag, ten hoogste 60
      uren per week en in elke periode van 13 achtereenvolgende weken ten hoogste gemiddeld 48 uren per week.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel56b
  - number: 56b.3
    text: |-
      Op de afwijking, bedoeld in het eerste lid, is artikel 56p, vierde lid, onderdelen b en c, en het zesde lid, niet
      van toepassing.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel56b
  - number: 56b.4
    text: |-
      Indien als gevolg van de toepassing van het eerste lid werkzaamheden of diensten worden verricht in nachtdienst,
      welke werkzaamheden of diensten eindigen vóór of op 02.00 uur, dan zijn hierop de in paragraaf 5 opgenomen
      bepalingen ten aanzien van het verrichten van werkzaamheden of diensten in nachtdienst niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel56b
  - number: 56c
    text: |-
      In afwijking van artikel 56a, eerste lid, artikel 56b, tweede lid, artikel 58b, vijfde lid, artikel 58c, derde lid,
      onderdeel b, en artikel 58d, vierde lid, bedraagt de arbeidsduur van de militair die de leeftijd van 18 jaar nog
      niet heeft bereikt ten hoogste gemiddeld 40 uren per week in elke periode van 13 achtereenvolgende weken.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel56c
  - number: 56d.1
    text: |-
      De militair heeft in elke aaneengesloten tijdruimte van 24 uren recht op een onafgebroken rusttijd van ten minste
      11 uren, welke rusttijd éénmaal in elke aaneengesloten tijdruimte van 7 maal 24 uren mag worden ingekort tot ten
      minste 8 uren.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel56d
  - number: 56d.2
    text: |-
      De in het voorgaande lid bedoelde tijdruimte vangt aan op het eerste tijdstip van de dag, waarop de militair
      werkzaamheden of diensten verricht.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel56d
  - number: 56e.1
    text: |-
      De militair heeft recht op een onafgebroken rusttijd van hetzij ten minste 36 uren in elke aaneengesloten
      tijdruimte van 7 maal 24 uren, hetzij ten minste 60 uren in elke aaneengesloten tijdruimte van 9 maal 24 uren. De
      voorgeschreven rusttijd van 60 uren mag éénmaal in elke periode van 5 achtereenvolgende weken worden bekort tot
      32 uren.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel56e
  - number: 56e.2
    text: |-
      De in het voorgaande lid bedoelde tijdruimte vangt aan op het eerste tijdstip van de dag, waarop de militair
      werkzaamheden of diensten verricht.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel56e
  - number: 56f.1
    text: |-
      Voor de militair die werkzaamheden of diensten in nachtdienst verricht, bedraagt de arbeidsduur ten hoogste 9 uren
      per nachtdienst, in elke periode van 4 achtereenvolgende weken ten hoogste gemiddeld 50 uren per week en in elke
      periode van 13 achtereenvolgende weken ten hoogste gemiddeld 40 uren per week.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel56f
  - number: 56f.2
    text: |-
      De commandant dient over de toepassing van het eerste lid overeenstemming te bereiken met de betrokken
      medezeggenschapscommissie, indien het dienstbelang het noodzakelijk maakt dat de militair meer dan 8 uren per
      nachtdienst of meer dan 45 uren per week werkzaamheden of diensten verricht.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel56f
  - number: 56f.3
    text: |-
      Indien het eerste en tweede lid niet wordt toegepast, dan bedraagt de arbeidsduur ten hoogste 8 uren per
      nachtdienst, ten hoogste 45 uren per week en ten hoogste gemiddeld 40 uren per week in elke periode van 13
      achtereenvolgende weken.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel56f
  - number: 56g.1
    text: |-
      Van de in artikel 56f genoemde arbeidsduur kan worden afgeweken indien zich een onvoorziene wijziging van
      omstandigheden, incidenteel en niet periodiek, voordoet, of de aard van de werkzaamheden of diensten, incidenteel
      en voor korte tijd, dergelijke afwijkingen noodzakelijk maakt.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel56g
  - number: 56g.2
    text: |-
      De arbeidsduur bedraagt in situaties als bedoeld in het eerste lid ten hoogste 10 uren per nachtdienst, ten hoogste
      60 uren per week en in elke periode van 13 achtereenvolgende weken ten hoogste gemiddeld 40 uren per week.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel56g
  - number: 56g.3
    text: |-
      Op de afwijking, bedoeld in het eerste lid, is artikel 56p, vierde lid, onderdelen b en c, en het zesde lid, niet
      van toepassing.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel56g
  - number: 56h.1
    text: |-
      De militair heeft na het verrichten van werkzaamheden of diensten in nachtdienst, welke eindigen ná 02.00 uur,
      recht op een onafgebroken rusttijd van tenminste 14 uren, welke éénmaal in elke aaneengesloten tijdruimte van 7
      maal 24 uren mag worden bekort tot ten minste 8 uren.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel56h
  - number: 56h.2
    text: |-
      De commandant dient over de toepassing van de in het eerste lid bedoelde bekorting van de onafgebroken rusttijd tot
      ten minste 8 uren overeenstemming te bereiken met de betrokken medezeggenschapscommissie, indien het dienstbelang
      toepassing noodzakelijk maakt.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel56h
  - number: 56h.3
    text: |-
      De in het eerste lid bedoelde tijdruimte vangt aan op het eerste tijdstip van de dag, waarop de militair
      werkzaamheden of diensten verricht.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel56h
  - number: 56i.1
    text: |-
      De militair verricht in elke periode van 13 achtereenvolgende weken niet meer dan ten hoogste 52 maal werkzaamheden
      of diensten in nachtdienst, indien de werkzaamheden of diensten eindigen vóór of op 02.00 uur.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel56i
  - number: 56i.2
    text: |-
      De commandant dient over de toepassing van het eerste lid overeenstemming te bereiken met de betrokken
      medezeggenschapscommissie, indien het dienstbelang het noodzakelijk maakt dat de militair in een periode
      van 4 achtereenvolgende weken meer dan 16 maal werkzaamheden of diensten in nachtdienst verricht, indien die
      werkzaamheden of diensten eindigen vóór of op 02.00 uur.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel56i
  - number: 56j.1
    text: |-
      De militair verricht in elke periode van 13 achtereenvolgende weken niet meer dan ten hoogste 28 maal werkzaamheden
      of diensten in nachtdienst, indien de werkzaamheden of diensten eindigen ná 02.00 uur.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel56j
  - number: 56j.2
    text: |-
      De commandant dient over de toepassing van het eerste lid overeenstemming te bereiken met de betrokken
      medezeggenschapscommissie, indien het dienstbelang het noodzakelijk maakt dat de militair in elke periode van
      4 achtereenvolgende weken meer dan 10 maal en in elke periode van 13 achtereenvolgende weken meer dan 25 maal
      werkzaamheden of diensten in nachtdienst verricht, indien die werkzaamheden of diensten eindigen ná 02.00 uur.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel56j
  - number: 56k.1
    text: In afwijking van artikel 56j, eerste lid, kan de commandant dit artikel toepassen.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel56k
  - number: 56k.2
    text: |-
      Indien de aard van de werkzaamheden of diensten met zich brengt dat werkzaamheden of diensten in nachtdienst worden
      verricht, en dit door het op een andere wijze organiseren van die werkzaamheden of diensten redelijkerwijs niet is
      te voorkomen, verricht de militair:
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel56k
  - number: 56k.2.a
    text: hetzij ten hoogste 35 maal in elke periode van 13 achtereenvolgende weken werkzaamheden of diensten in nachtdienst;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel56k
  - number: 56k.2.b
    text: |-
      hetzij ten hoogste 20 uren in elke periode van 2 achtereenvolgende weken werkzaamheden of diensten tussen 00.00 uur
      en 06.00 uur.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel56k
  - number: 56k.3
    text: |-
      De commandant dient over de toepassing van het eerste en tweede lid overeenstemming te bereiken met de betrokken
      medezeggenschapscommissie, indien het dienstbelang toepassing noodzakelijk maakt.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel56k
  - number: 56l.1
    text: |-
      Na een reeks van ten minste 3 en ten hoogste 7 maal achtereen werkzaamheden of diensten in nachtdienst te hebben
      verricht, heeft de militair recht op een onafgebroken rusttijd van ten minste 48 uren.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel56l
  - number: 56l.2
    text: |-
      De commandant dient over de toepassing van het eerste lid overeenstemming te bereiken met de betrokken
      medezeggenschapscommissie, indien het dienstbelang noodzakelijk maakt dat de militair 7 maal achtereen
      werkzaamheden of diensten in nachtdienst verricht die eindigen vóór of op 02.00 uur, hetzij 6 of 7 maal achtereen
      werkzaamheden of diensten in nachtdienst verricht die eindigen ná 02.00 uur.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel56l
  - number: 56l.3
    text: 'Indien het eerste lid niet wordt toegepast, dan heeft de militair,:'
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel56l
  - number: 56l.3.a
    text: |-
      na een reeks van ten minste 3 en ten hoogste 6 maal achtereen werkzaamheden of diensten in nachtdienst te hebben
      verricht, die eindigen vóór of op 02.00 uur;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel56l
  - number: 56l.3.b
    text: |-
      hetzij na een reeks van ten minste 3 en ten hoogste 5 maal achtereen werkzaamheden of diensten in nachtdienst te
      hebben verricht, die eindigen ná 02.00 uur,
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel56l
  - number: 56m.1
    text: |-
      In afwijking van artikel 56f, eerste lid, en artikel 56g, tweede lid, ten aanzien van het gemiddeld aantal uren per
      week in elke periode van 13 achtereenvolgende weken dat werkzaamheden of diensten in nachtdienst wordt verricht,
      kan de commandant dit artikel toepassen.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel56m
  - number: 56m.2
    text: |-
      Indien zich een onvoorziene wijziging van omstandigheden voordoet of de aard van de werkzaamheden of diensten het
      noodzakelijk maakt dat de militair slechts incidenteel of voor korte tijd werkzaamheden of diensten in nachtdienst
      verricht en dit door het op een andere wijze organiseren van de werkzaamheden of diensten redelijkerwijs niet
      is te voorkomen, verricht de militair in elke periode van 52 achtereenvolgende weken gemiddeld 40 uren per week
      werkzaamheden of diensten.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel56m
  - number: 56m.3
    text: |-
      De commandant dient over de toepassing van het eerste en tweede lid overeenstemming te bereiken met de betrokken
      medezeggenschapscommissie, indien het dienstbelang toepassing noodzakelijk maakt.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel56m
  - number: 56n.1
    text: |-
      In afwijking van de artikelen 56a, 56b, 56f en 56g, ten aanzien van de arbeidsduur per werkdag of nachtdienst, kan
      de commandant dit artikel toepassen.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel56n
  - number: 56n.2
    text: |-
      Indien de werkzaamheden of diensten geen uitstel gedogen, en door het nemen van andere maatregelen redelijkerwijs
      niet is te voorkomen, verricht de militair ten hoogste éénmaal in elke periode van 2 achtereenvolgende weken 14
      uren werkzaamheden of diensten per werkdag onderscheidenlijk per nachtdienst.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel56n
  - number: 56n.3
    text: |-
      Het tweede lid is eveneens van toepassing, indien de werkzaamheden of diensten worden verstoord door een zich
      plotseling voordoende situatie:
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel56n
  - number: 56n.3.a
    text: waarbij personen ernstig letsel oplopen, dan wel daartoe de onmiddellijke dreiging bestaat;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel56n
  - number: 56n.3.b
    text: waarbij buitengewoon ernstige schade aan goederen ontstaat, dan wel dreigt te ontstaan.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel56n
  - number: 56o.1
    text: |-
      De commandant kan, in afwijking van de in dit hoofdstuk opgenomen bepalingen ten aanzien van de arbeidsduur per
      werkdag onderscheidenlijk per nachtdienst en de onafgebroken rusttijd, dit artikel toepassen.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel56o
  - number: 56o.2
    text: |-
      De arbeidsduur per werkdag of per nachtdienst onderscheidenlijk de onafgebroken rusttijd wordt met ten hoogste 15
      achtereenvolgende minuten verlengd onderscheidenlijk ingekort, indien de werkzaamheden of diensten van de militair
      aan het eind van de werkdag worden overgenomen en direct daaropvolgend worden voortgezet door een andere militair
      en de goede voortgang van die werkzaamheden of diensten overdracht noodzakelijk maakt.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel56o
  - number: 56o.3
    text: |-
      Op de afwijking bedoeld in het tweede lid zijn de artikelen 56i, 56j en 56k, ten aanzien van het aantal malen dat
      werkzaamheden of diensten in nachtdienst worden verricht, niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel56o
  - number: 56p.1
    text: |-
      Indien de arbeidsduur van de militair meer dan 5½ uur per werkdag of nachtdienst bedraagt, dan worden de
      werkzaamheden of diensten afgewisseld door een pauze.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel56p
  - number: 56p.2
    text: |-
      De in het eerste lid bedoelde pauze bedraagt ten minste een half uur aaneengesloten, welke mag worden gesplitst in
      twee pauzes van ten minste 15 achtereenvolgende minuten.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel56p
  - number: 56p.3
    text: |-
      De commandant dient over de toepassing van het tweede lid overeenstemming te bereiken met de betrokken
      medezeggenschapscommissie, indien het dienstbelang toepassing noodzakelijk maakt.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel56p
  - number: 56p.4
    text: |-
      Indien het tweede lid niet wordt toegepast, dan worden, met inachtneming van het eerste lid, de werkzaamheden of
      diensten van de militair:
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel56p
  - number: 56p.4.a
    text: |-
      indien hij niet meer dan 8 uren werkzaamheden of diensten per werkdag of nachtdienst verricht, afgewisseld door
      pauzes van tezamen ten minste een half uur;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel56p
  - number: 56p.4.b
    text: |-
      indien hij meer dan 8 uren, doch niet meer dan 10 uren werkzaamheden of diensten per werkdag of nachtdienst
      verricht, afgewisseld door pauzes van tezamen ten minste 45 minuten;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel56p
  - number: 56p.4.c
    text: |-
      indien hij meer dan 10 uren werkzaamheden of diensten per werkdag of nachtdienst verricht, afgewisseld door pauzes
      van tezamen ten minste 1 uur.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel56p
  - number: 56p.5
    text: Eén van de pauzes, bedoeld in het vierde lid, bedraagt ten minste een half uur aaneengesloten.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel56p
  - number: 56p.6
    text: |-
      De pauzes, bedoeld in het vierde lid, vangen aan en eindigen in de periode, gelegen tussen 2 uren na de aanvang en
      2 uren voor het einde van de werkzaamheden of diensten.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel56p
  - number: 56q.1
    text: |-
      De commandant kan van het bepaalde in artikel 54a, onderdeel j, en artikel 58a, tweede lid, afwijken, indien de
      aard van de werkzaamheden of diensten van de militair het noodzakelijk maakt dat hij tijdens de pauze bereikbaar
      is onderscheidenlijk op de werkplek aanwezig is om op oproep zo spoedig mogelijk die werkzaamheden of diensten te
      verrichten, en dit door het op een andere wijze organiseren van de werkzaamheden of diensten redelijkerwijs niet is
      te voorkomen.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel56q
  - number: 56q.2
    text: |-
      De commandant dient over de toepassing van het eerste lid overeenstemming te bereiken met de betrokken
      medezeggenschapscommissie, indien het dienstbelang toepassing noodzakelijk maakt.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel56q
  - number: 56q.3
    text: |-
      Voor de toepassing van het eerste lid geldt de tijd tijdens de werkplekgebonden pauze waarop de werkzaamheden of
      diensten van de militair zich uitsluitend beperken tot de verplichte aanwezigheid op de werkplek, als pauze.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel56q
  - number: 56r.1
    text: 'De commandant kan van het bepaalde in artikel 56p, eerste lid, afwijken, indien de militair:'
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel56r
  - number: 56r.1.a
    text: |-
      werkzaamheden of diensten verricht zonder enig direct contact met een andere militair of ambtenaar die
      vergelijkbare werkzaamheden of diensten verricht, of
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel56r
  - number: 56r.1.b
    text: |-
      indien de aard van de werkzaamheden of diensten met zich brengt dat de afwisseling van de werkzaamheden of diensten
      per werkdag onderscheidenlijk per nachtdienst door een pauze onmogelijk is en dit door het op een andere wijze
      organiseren van de werkzaamheden of diensten redelijkerwijs niet is te voorkomen.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel56r
  - number: 56r.2
    text: |-
      De commandant dient over de toepassing van het eerste lid overeenstemming te bereiken met de betrokken
      medezeggenschapscommissie, indien het dienstbelang toepassing noodzakelijk maakt.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel56r
  - number: 56r.3
    text: |-
      Indien het eerste lid wordt toegepast, verricht de militair in elke periode van 52 achtereenvolgende weken ten
      hoogste gemiddeld 40 uren per week werkzaamheden of diensten.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel56r
  - number: 56r.4
    text: |-
      Indien het eerste lid wordt toegepast, verricht de militair in afwijking van artikel 57c, tweede lid, en artikel
      59b, tweede lid, ten hoogste 12 uren per werkdag onderscheidenlijk per nachtdienst werkzaamheden of diensten.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel56r
  - number: 57a.1
    text: |-
      Op zaterdag en zondag worden aan de militair geen werkzaamheden of diensten opgedragen. Hiervan kan slechts worden
      afgeweken indien naar het oordeel van de commandant het dienstbelang zulks onvermijdelijk maakt.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel57a
  - number: 57a.2
    text: |-
      Het eerste lid geldt mede voor Nieuwjaarsdag, Eerste en Tweede Paasdag, Hemelvaartsdag, Eerste en Tweede
      Pinksterdag, Eerste en Tweede Kerstdag, Koninginnedag, 5 mei en de door Onze Minister aan te wijzen feest- of
      gedenkdagen.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel57a
  - number: 57a.3
    text: |-
      Er dient naar te worden gestreefd dat de militair geen werkzaamheden of diensten verricht op de dagen, bedoeld in
      het eerste en tweede lid, die voorafgaan aan, vallen in of aansluiten op een aan hem verleend verlof van meer dan 3
      dagen, doch minder dan 10 dagen. De militair verricht in beginsel geen werkzaamheden of diensten op de in de eerste
      volzin bedoelde dagen, die voorafgaan aan, vallen in of aansluiten op een hem verleend verlof van 10 dagen of meer.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel57a
  - number: 57a.4
    text: De militair verricht geen werkzaamheden of diensten op ten minste 26 zondagen per periode van 52 weken.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel57a
  - number: 57a.5
    text: |-
      De voor de militair, die volgens rooster werkzaamheden of diensten in continu- of ploegendienst verricht,
      geldende arbeidsduur, bedoeld in artikel 54b, vierde lid, wordt tijdens de desbetreffende roosterperiode evenredig
      verminderd indien hij op dagen als bedoeld in het tweede lid, die niet op zaterdag of zondag vallen:
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel57a
  - number: 57a.5.a
    text: daadwerkelijk werkzaamheden of diensten heeft verricht, of;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel57a
  - number: 57a.5.b
    text: volgens rooster niet was aangewezen voor het verrichten van werkzaamheden of diensten.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel57a
  - number: 57a.6
    text: |-
      Ten aanzien van militairen die zijn ingedeeld bij eenheden die onmiddellijk in actie moeten kunnen komen of
      bij eenheden die dienst verrichten buiten Nederland, kan bij het opstellen van het rooster door de commandant
      worden afgeweken van het eerste, het tweede en het derde lid met betrekking tot de zaterdagmorgen en de feest-
      of gedenkdagen.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel57a
  - number: 57a.7
    text: |-
      Indien naar het oordeel van de commandant de belangen van de dienst zich hiertegen niet verzetten, wordt de
      militair, aan wie op een zondag of een dag als bedoeld in het tweede lid of het zesde lid, werkzaamheden of
      diensten zijn opgedragen, tijdens de werktijd in de gelegenheid gesteld de godsdienstuitoefening van de gezindte
      waartoe hij behoort bij te wonen.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel57a
  - number: 57a.8
    text: Onze Minister kan ter uitvoering van dit artikel bij ministeriële regeling nadere regels stellen.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel57a
  - number: 57b.1
    text: |-
      In afwijking van de artikelen 56b en 56g ten aanzien van de arbeidsduur per werkdag onderscheidenlijk per
      nachtdienst kan de commandant dit artikel toepassen.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel57b
  - number: 57b.2
    text: |-
      Indien de aard van de werkzaamheden of diensten, of de bedrijfsomstandigheden, in verband met de Nieuwjaarsdag,
      Eerste en Tweede Paasdag, Hemelvaartsdag, Eerste en Tweede Pinksterdag, Eerste en Tweede Kerstdag, Koninginnedag
      of 5 december dit noodzakelijk maakt, verricht de militair in de aaneengesloten periode van 7 dagen voorafgaand aan
      die dag ten hoogste tweemaal 14 uren per werkdag onderscheidenlijk per nachtdienst werkzaamheden of diensten.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel57b
  - number: 57b.3
    text: |-
      De commandant dient over de toepassing van het eerste en tweede lid overeenstemming te bereiken met de betrokken
      medezeggenschapscommissie, indien het dienstbelang toepassing noodzakelijk maakt.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel57b
  - number: 57b.4
    text: Artikel 56n is niet van toepassing indien het eerste en tweede lid wordt toegepast.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel57b
  - number: 57c.1
    text: |-
      In afwijking van artikel 56a, eerste lid, en artikel 56f, eerste lid, ten aanzien van de arbeidsduur per werkdag
      onderscheidenlijk per nachtdienst, en artikel 56h, eerste lid, ten aanzien van de onafgebroken rusttijd na een
      nachtdienst, kan de commandant dit artikel toepassen.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel57c
  - number: 57c.2
    text: |-
      De militair verricht, in verband met de Nieuwjaarsdag, Eerste en Tweede Paasdag, Hemelvaartsdag, Eerste en Tweede
      Pinksterdag en Eerste en Tweede Kerstdag, in de tijdruimte tussen de dag voorafgaand aan bedoelde dagen 18.00
      uur en de op deze dagen volgende dag 08.00 uur ten hoogste 11 uren per werkdag onderscheidenlijk per nachtdienst
      werkzaamheden of diensten. De militair heeft na het verrichten van die werkzaamheden of diensten een onafgebroken
      rusttijd van ten minste 12 uren.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel57c
  - number: 57c.3
    text: |-
      Indien het eerste en tweede lid wordt toegepast, dan organiseert de commandant de werkzaamheden of diensten
      zodanig, dat zoveel mogelijk militairen op de in het tweede lid bedoelde dagen geen werkzaamheden of diensten
      verrichten in de tijdruimte gelegen tussen 00.00 uur en de daarop volgende dag 06.00 uur.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel57c
  - number: 57c.4
    text: |-
      De commandant dient over de toepassing van het eerste en tweede lid overeenstemming te bereiken met de betrokken
      medezeggenschapscommissie, indien het dienstbelang toepassing noodzakelijk maakt.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel57c
  - number: 58a.1
    text: De commandant kan de militair consignatie opleggen.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel58a
  - number: 58a.2
    text: |-
      Ten minste gedurende 2 maal een aaneengesloten tijdruimte van 7 maal 24 uren in elke periode van 4
      achtereenvolgende weken wordt geen consignatie opgelegd.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel58a
  - number: 58a.3
    text: |-
      Tijdens de onafgebroken rusttijd direct voorafgaand aan en direct volgend op een nachtdienst wordt geen consignatie
      opgelegd.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel58a
  - number: 58a.4
    text: |-
      Als consignatie wordt opgelegd bedraagt de arbeidsduur ten hoogste 13 uren in elke periode van 24 achtereenvolgende
      uren, ten hoogste 60 uren per week en ten hoogste gemiddeld 45 uren per week in elke periode van 13
      achtereenvolgende weken.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel58a
  - number: 58a.5
    text: |-
      Indien de consignatie geheel of gedeeltelijk de periode van 00.00 uur tot 06.00 uur bestrijkt, bedraagt de
      arbeidsduur, in afwijking van het vorige lid ten hoogste 13 uren in elke periode van 24 achtereenvolgende uren, ten
      hoogste 60 uren per week en ten hoogste gemiddeld 40 uren per week in elke periode van 13 achtereenvolgende weken.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel58a
  - number: 58a.6
    text: |-
      Voor de toepassing van het vierde en vijfde lid vangt de arbeidsduur aan op het moment van de oproep. Indien
      binnen een half uur na beëindiging van de werkzaamheden die voortvloeien uit een oproep opnieuw een oproep wordt
      gedaan, wordt de tussenliggende tijd gerekend tot de arbeidsduur. Indien binnen een half uur één of meer keren
      werkzaamheden voortvloeiend uit een oproep worden verricht, wordt de arbeidsduur geacht ten minste een half uur
      te bedragen.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel58a
  - number: 58a.7
    text: |-
      De werkzaamheden die voortvloeien uit een oproep worden voor de toepassing van de in dit hoofdstuk opgenomen
      bepalingen ten aanzien van rusttijd en pauze buiten beschouwing gelaten.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel58a
  - number: 58a.8
    text: |-
      Op de werkzaamheden die voortvloeien uit een oproep zijn de bepalingen in paragraaf 5 ten aanzien van het aantal
      malen dat werkzaamheden of diensten in nachtdienst wordt verricht niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel58a
  - number: 58b.1
    text: |-
      In afwijking van artikel 58a, tweede lid, kan de commandant de militair ten hoogste 3 maal in elke aaneengesloten
      tijdruimte van 7 maal 24 uren en ten hoogste 26 maal in elke periode van 13 achtereenvolgende weken een
      aanwezigheidsdienst opleggen.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel58b
  - number: 58b.2
    text: |-
      In afwijking van het eerste lid kan de commandant de militair gedurende ten hoogste 6 weken in elke periode van 52
      achtereenvolgende weken ten hoogste 4 maal in elke aaneengesloten tijdruimte van 7 maal 24 uren en ten hoogste 26
      maal in elke periode van 13 achtereenvolgende weken een aanwezigheidsdienst opleggen.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel58b
  - number: 58b.3
    text: |-
      Als het tweede lid wordt toegepast heeft de militair na de aanwezigheidsdienst of reeks van aaneengesloten
      aanwezigheidsdiensten een onafgebroken rusttijd die ten minste even lang is als de voorafgaande aanwezigheidsdienst
      onderscheidenlijk reeks van aaneengesloten aanwezigheidsdiensten.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel58b
  - number: 58b.4
    text: |-
      Tijdens de onafgebroken rusttijd direct voorafgaand aan en direct volgend op een nachtdienst wordt geen
      aanwezigheidsdienst opgelegd.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel58b
  - number: 58b.5
    text: |-
      Als een aanwezigheidsdienst wordt opgelegd bedraagt de arbeidsduur ten hoogste 13 uren in elke periode van 24
      achtereenvolgende uren, ten hoogste 60 uren per week en ten hoogste gemiddeld 45 uren per week in elke periode van
      13 achtereenvolgende weken.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel58b
  - number: 58b.6
    text: |-
      Indien de aanwezigheidsdienst geheel of gedeeltelijk de periode van 00.00 uur tot 06.00 uur bestrijkt, bedraagt de
      arbeidsduur, in afwijking van het vorige lid ten hoogste 13 uren in elke periode van 24 achtereenvolgende uren, ten
      hoogste 60 uren per week en ten hoogste gemiddeld 40 uren per week in elke periode van 13 achtereenvolgende weken.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel58b
  - number: 58b.7
    text: |-
      Voor de toepassing van dit artikel geldt de tijd tijdens een aanwezigheidsdienst, waarbij de dienst van de militair
      zich uitsluitend beperkt tot de verplichte aanwezigheid op de werkplek, als rusttijd.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel58b
  - number: 58b.8
    text: |-
      Voor de toepassing van het vijfde en zesde lid vangt de arbeidsduur aan op het moment van de oproep. Indien
      binnen een half uur na beëindiging van de werkzaamheden die voortvloeien uit een oproep opnieuw een oproep wordt
      gedaan, wordt de tussenliggende tijd gerekend tot de arbeidsduur. Indien binnen een half uur één of meer keren
      werkzaamheden voortvloeiend uit een oproep worden verricht, wordt de arbeidsduur geacht ten minste een half uur
      te bedragen.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel58b
  - number: 58b.9
    text: |-
      De werkzaamheden die voortvloeien uit een oproep worden voor de toepassing van de in dit hoofdstuk opgenomen
      bepalingen ten aanzien van rusttijd en pauze buiten beschouwing gelaten.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel58b
  - number: 58b.10
    text: |-
      Op de werkzaamheden die voortvloeien uit een oproep zijn de bepalingen in paragraaf 5, ten aanzien van het aantal
      malen dat werkzaamheden of diensten in nachtdienst wordt verricht, niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel58b
  - number: 58c.1
    text: |-
      Dit artikel is uitsluitend van toepassing op de militair die met goed gevolg een brandweeropleiding heeft
      afgesloten en die als zodanig werkzaam is, alsmede de militair die in directe samenhang met voornoemde militair
      werkzaamheden of diensten verricht.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel58c
  - number: 58c.2
    text: |-
      In afwijking van artikel 58a, tweede lid, kan de commandant de militair ten hoogste 4 maal in elke aaneengesloten
      tijdruimte van 7 maal 24 uren, ten hoogste 46 maal in elke periode van 13 achtereenvolgende weken en ten hoogste
      124 maal in elke periode van 52 achtereenvolgende weken een aanwezigheidsdienst opleggen.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel58c
  - number: 58c.3
    text: 'Indien het tweede lid wordt toegepast, dan:'
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel58c
  - number: 58c.3.a
    text: |-
      heeft de militair vóór en ná een aanwezigheidsdienst een onafgebroken rusttijd van ten minste 11 uren, welke
      rusttijd éénmaal in elke aaneengesloten tijdruimte van 7 maal 24 uren mag worden ingekort tot ten minste 8 uren;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel58c
  - number: 58c.3.b
    text: |-
      bedraagt de arbeidsduur ten hoogste 10 uren in elke periode van 24 achtereenvolgende uren en in elke periode van 13
      achtereenvolgende weken ten hoogste gemiddeld 45 uren per week.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel58c
  - number: 58c.4
    text: |-
      Het derde lid, onderdeel a, blijft buiten toepassing, indien zich incidentele en onvoorziene omstandigheden
      voordoen waardoor het aantal militairen dat nodig is onder het vereiste minimum komt, die een dergelijke afwijking
      noodzakelijk maakt.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel58c
  - number: 58c.5
    text: |-
      Voor de toepassing van dit artikel geldt de tijd tijdens een aanwezigheidsdienst, waarbij de dienst van de militair
      zich uitsluitend beperkt tot de verplichte aanwezigheid op de werkplek, als rusttijd.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel58c
  - number: 58c.6
    text: |-
      Voor de toepassing van het derde lid, onderdeel b, vangt de arbeidsduur aan op het moment van de oproep. Indien
      binnen een half uur na beëindiging van de werkzaamheden die voortvloeien uit een oproep opnieuw een oproep wordt
      gedaan, wordt de tussenliggende tijd gerekend tot de arbeidsduur. Indien binnen een half uur één of meer keren
      werkzaamheden voortvloeiend uit een oproep worden verricht, wordt de arbeidsduur geacht ten minste een half uur
      te bedragen.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel58c
  - number: 58c.7
    text: |-
      De werkzaamheden die voortvloeien uit een oproep worden voor de toepassing van de in dit hoofdstuk opgenomen
      bepalingen ten aanzien van rusttijd en pauze buiten beschouwing gelaten.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel58c
  - number: 58c.8
    text: |-
      Op de werkzaamheden die voortvloeien uit een oproep zijn de bepalingen in paragraaf 5, ten aanzien van het aantal
      malen dat werkzaamheden of diensten in nachtdienst wordt verricht, niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel58c
  - number: 58d.1
    text: |-
      In afwijking van artikel 58a, tweede lid, kan de commandant de militair ten hoogste een aaneengesloten tijdruimte
      van 7 maal 24 uren piket opleggen.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel58d
  - number: 58d.2
    text: |-
      Als piket wordt opgelegd, dan wordt de militair ten minste gedurende 8 maal een aaneengesloten tijdruimte van
      7 maal 24 uren in elke periode van 13 achtereenvolgende weken geen piket, aanwezigheidsdienst of consignatie
      opgelegd.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel58d
  - number: 58d.3
    text: |-
      Tijdens de onafgebroken rusttijd direct voorafgaand aan en direct volgend op een nachtdienst wordt geen piket
      opgelegd.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel58d
  - number: 58d.4
    text: |-
      Als piket wordt opgelegd bedraagt de arbeidsduur ten hoogste 13 uren in elke periode van 24 achtereenvolgende uren,
      ten hoogste 60 uren per week en ten hoogste gemiddeld 45 uren per week in elke periode van 13 achtereenvolgende
      weken.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel58d
  - number: 58d.5
    text: |-
      Indien het piket geheel of gedeeltelijk de periode van 00.00 uur tot 06.00 uur bestrijkt, bedraagt de arbeidsduur,
      in afwijking van het vorige lid ten hoogste 13 uren in elke periode van 24 achtereenvolgende uren, ten hoogste 60
      uren per week en ten hoogste gemiddeld 40 uren per week in elke periode van 13 achtereenvolgende weken.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel58d
  - number: 58d.6
    text: |-
      Voor de toepassing van dit artikel geldt de tijd tijdens het piket, waarbij de dienst van de militair zich
      uitsluitend beperkt tot de verplichte aanwezigheid op de werkplek, als rusttijd.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel58d
  - number: 58d.7
    text: |-
      Voor de toepassing van het vierde en vijfde lid vangt de arbeidsduur aan op het moment van de oproep. Indien
      binnen een half uur na beëindiging van de werkzaamheden die voortvloeien uit een oproep opnieuw een oproep wordt
      gedaan, wordt de tussenliggende tijd gerekend tot de arbeidsduur. Indien binnen een half uur één of meer keren
      werkzaamheden voortvloeiend uit een oproep worden verricht, wordt de arbeidsduur geacht ten minste een half uur
      te bedragen.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel58d
  - number: 58d.8
    text: |-
      De werkzaamheden die voortvloeien uit een oproep worden voor de toepassing van de in dit hoofdstuk opgenomen
      bepalingen ten aanzien van rusttijd en pauze buiten beschouwing gelaten.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel58d
  - number: 58d.9
    text: |-
      Op de werkzaamheden die voortvloeien uit een oproep zijn de bepalingen in paragraaf 5, ten aanzien van het aantal
      malen dat werkzaamheden of diensten in nachtdienst wordt verricht, niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel58d
  - number: 59a
    text: |-
      Deze paragraaf is uitsluitend van toepassing op werkzaamheden of diensten die door de militair in continu- of
      ploegendienst worden verricht.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel59a
  - number: 59b.1
    text: |-
      In afwijking van artikel 56a, eerste lid, en artikel 56f, eerste lid, ten aanzien van de arbeidsduur per werkdag
      onderscheidenlijk per nachtdienst, en artikel 56h, eerste lid, ten aanzien van de onafgebroken rusttijd na een
      nachtdienst, kan de commandant dit artikel toepassen.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel59b
  - number: 59b.2
    text: |-
      De militair verricht in de tijdruimte gelegen tussen vrijdag 18.00 uur en de daaropvolgende maandag 08.00 uur ten
      hoogste 11 uren per werkdag onderscheidenlijk per nachtdienst werkzaamheden of diensten.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel59b
  - number: 59b.3
    text: |-
      Indien het eerste en tweede lid wordt toegepast heeft de militair na het verrichten van die werkzaamheden of
      diensten een onafgebroken rusttijd van ten minste 12 uren, en verricht hijten minste 2 maal in elke periode van
      4 achtereenvolgende weken geen werkzaamheden of diensten in de tijdruimte gelegen tussen zaterdag 00.00 uur en de
      daaropvolgende maandag 06.00 uur.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel59b
  - number: 59b.4
    text: |-
      De commandant dient over de toepassing van het eerste en tweede lid overeenstemming te bereiken met de betrokken
      medezeggenschapscommissie, indien het dienstbelang toepassing noodzakelijk maakt.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel59b
  - number: 59c.1
    text: In afwijking van artikel 56e, eerste lid, kan de commandant dit artikel toepassen.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel59c
  - number: 59c.2
    text: |-
      De militair heeft recht op een onafgebroken rusttijd van ten minste 92 uren in elke aaneengesloten tijdruimte
      van 11 maal 24 uren, welke rusttijd éénmaal in elke periode van 5 achtereenvolgende weken mag worden bekort tot
      72 uren.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel59c
  - number: 59c.3
    text: |-
      De commandant dient over de toepassing van het eerste en tweede lid overeenstemming te bereiken met de betrokken
      medezeggenschapscommissie, indien het dienstbelang toepassing noodzakelijk maakt.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel59c
  - number: 59c.4
    text: |-
      Indien het eerste en tweede lid niet wordt toegepast, dan heeft de militair recht op een onafgebroken rusttijd van
      hetzij ten minste 36 uren in elke aaneengesloten tijdruimte van 7 maal 24 uren, hetzij ten minste 92 uren in elke
      aaneengesloten tijdruimte van 11 maal 24 uren.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel59c
  - number: 59c.5
    text: |-
      De in het tweede en vierde lid bedoelde tijdruimte vangt aan op het eerste tijdstip van de dag, waarop de militair
      werkzaamheden of diensten verricht.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel59c
  - number: 59d.1
    text: In afwijking van artikel 56p, tweede lid, kan de commandant dit artikel toepassen.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel59d
  - number: 59d.2
    text: |-
      Indien de arbeidsduur meer dan 5½ uur per werkdag of nachtdienst bedraagt, dan worden de werkzaamheden of diensten
      van de militair afgewisseld door een pauze.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel59d
  - number: 59d.3
    text: |-
      De commandant dient over de toepassing van het eerste en tweede lid overeenstemming te bereiken met de betrokken
      medezeggenschapscommissie, indien het dienstbelang toepassing noodzakelijk maakt.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel59d
  - number: 59e.1
    text: |-
      Indien zich incidentele en onvoorziene omstandigheden voordoen, waardoor het aantal militairen in een ploeg onder
      het vereiste minimum komt, kan de commandant afwijken van artikel 56f, eerste lid, ten aanzien van de arbeidsduur
      per nachtdienst, en artikel 56h, eerste lid.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel59e
  - number: 59e.2
    text: 'Onverminderd het gestelde in artikel 57c, en artikel 59b ten aanzien van de zondag,:'
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel59e
  - number: 59e.2.a
    text: |-
      verricht de militair bij toepassing van het eerste lid gedurende ten hoogste 2 maal in elke periode van 4
      achtereenvolgende weken en 8 maal in elke periode van 52 achtereenvolgende weken, ten hoogste 11 uur per
      nachtdienst werkzaamheden of diensten;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel59e
  - number: 59e.2.b
    text: |-
      heeft de militair na het verrichten van die werkzaamheden of diensten recht op een onafgebroken rusttijd van ten
      minste 12 uren.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel59e
  - number: 59e.3
    text: |-
      De commandant dient over de toepassing van het eerste en tweede lid overeenstemming te bereiken met de betrokken
      medezeggenschapscommissie, indien het dienstbelang toepassing noodzakelijk maakt.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel59e
  - number: 59f.1
    text: |-
      De werkzaamheden of diensten van een zwangere militair worden zodanig ingericht, dat rekening wordt gehouden met
      haar specifieke omstandigheden. De commandant voldoet, met inachtneming van het tweede tot en met vijfde lid,
      aan de voor hem uit de eerste volzin voortvloeiende verplichting binnen een redelijke termijn nadat een aanvraag
      daartoe door de zwangere militair is gedaan. Bij deze aanvraag wordt desgevraagd een schriftelijke verklaring
      overgelegd van een geneeskundige of een verloskundige waaruit blijkt, dat de betrokken militair zwanger is.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel59f
  - number: 59f.2
    text: |-
      De zwangere militair heeft het recht de werkzaamheden of diensten af te wisselen met één of meer pauzes buiten die
      bedoeld in artikel 56p. Deze extra pauze onderscheidenlijk pauzes bedragen tezamen ten minste 15 minuten en ten
      hoogste één achtste deel van de voor haar geldende arbeidsduur per werkdag of nachtdienst. De in de vorige volzin
      bedoelde pauzes gelden voor de toepassing van dit hoofdstuk als arbeidsduur.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel59f
  - number: 59f.3
    text: |-
      De zwangere militair heeft het recht werkzaamheden of diensten te verrichten in een bestendig en regelmatig werk-
      en rusttijdenpatroon.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel59f
  - number: 59f.4
    text: |-
      De zwangere militair kan niet worden verplicht werkzaamheden of diensten te verrichten anders dan op grond van
      artikel 56a is toegestaan.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel59f
  - number: 59f.5
    text: |-
      De zwangere militair kan niet worden verplicht werkzaamheden of diensten te verrichten in nachtdienst, tenzij de
      commandant aannemelijk maakt dat dit redelijkerwijs niet van hem kan worden gevergd.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel59f
  - number: 59f.6
    text: |-
      De commandant stelt de zwangere militair in de gelegenheid de noodzakelijke zwangerschapsonderzoeken te ondergaan.
      De tijd van de in de vorige volzin bedoelde onderzoeken geldt voor de toepassing van dit hoofdstuk als arbeidsduur.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel59f
  - number: 59g
    text: 'De commandant organiseert de werkzaamheden of diensten zodanig, dat een vrouwelijke militair:'
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel59g
  - number: 59g.a
    text: |-
      geen werkzaamheden of diensten verricht binnen 28 dagen voor de vermoedelijke datum van de bevalling, zoals die
      is aangegeven in een door de vrouwelijke militair aan de commandant overgelegde schriftelijke verklaring van
      een geneeskundige of verloskundige waaruit de vermoedelijke datum van bevalling blijkt. Het in de eerste volzin
      bedoelde tijdvak wordt verlengd met het tijdvak dat verloopt tussen de vermoedelijke datum van de bevalling en de
      werkelijke datum van de bevalling;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel59g
  - number: 59g.b
    text: geen werkzaamheden of diensten verricht binnen 42 dagen na haar bevalling.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel59g
  - number: 59h
    text: |-
      Artikel 59f is, met uitzondering van het zesde lid, van overeenkomstige toepassing gedurende een periode van 6
      maanden na de bevalling.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel59h
  - number: 59i.1
    text: |-
      Een vrouwelijke militair, die een borstkind voedt, heeft, indien zij de commandant hiervan in kennis heeft
      gesteld, gedurende ten minste de eerste 9 levensmaanden van dat kind het recht de werkzaamheden of diensten te
      onderbreken ten einde in de nodige rust en afzondering haar kind te zogen dan wel de borstvoeding te kolven. De
      commandant biedt haar daartoe de gelegenheid en stelt, waar nodig, een geschikte af te sluiten besloten ruimte
      ter beschikking.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel59i
  - number: 59i.2
    text: |-
      De onderbrekingen, bedoeld in het eerste lid, vinden plaats zo vaak en zo lang als nodig is doch bedragen
      gezamenlijk ten hoogste een vierde van de arbeidsduur per werkdag of nachtdienst. De vaststelling van het tijdstip
      en de duur van de onderbrekingen vindt plaats door de betrokken vrouwelijke militair na overleg met de commandant.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel59i
  - number: 59i.3
    text: De duur van de onderbrekingen, bedoeld in dit artikel, gelden voor de toepassing van dit hoofdstuk als arbeidsduur.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel59i
  - number: 60a
    text: |-
      Indien de aard van de te verrichten diensten daartoe aanleiding geeft, kan Onze Minister bij ministeriële regeling
      bepalen dat de tijd, gedurende welke deze diensten worden verricht slechts voor een deel tot de arbeidsduur wordt
      gerekend.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel60a
  - number: 60b
    text: |-
      Door het hoofd defensieonderdeel kan aan de militair de verplichting worden opgelegd buiten de voor hem
      vastgestelde werktijden met het oog op eventuele dienstverrichting:
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel60b
  - number: 60b.a
    text: zich op een bepaalde plaats ter beschikking te houden;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel60b
  - number: 60b.b
    text: binnen een bepaald gebied te verblijven of zich op bepaalde tijdstippen te melden.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel60b
  - number: 60c
    text: 'Aan de militair kan naar bij ministeriële regeling te stellen regels worden toegekend:'
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel60c
  - number: 60c.a
    text: |-
      een toelage voor het volgens een rooster regelmatig of vrij regelmatig verrichten van werkzaamheden of diensten op
      ongebruikelijke tijdstippen, of;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel60c
  - number: 60c.b
    text: |-
      een vergoeding over de tijd gedurende welke op hem een verplichting rust als bedoeld in de [artikelen 56q][ref1],
      [58a][ref2], [58b][ref3], [58c][ref4], [58d][ref5] en [60b][ref6], of;


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel56q
      [ref2]: https://wetten.overheid.nl/BWBR0003482#Artikel58a
      [ref3]: https://wetten.overheid.nl/BWBR0003482#Artikel58b
      [ref4]: https://wetten.overheid.nl/BWBR0003482#Artikel58c
      [ref5]: https://wetten.overheid.nl/BWBR0003482#Artikel58d
      [ref6]: https://wetten.overheid.nl/BWBR0003482#Artikel60b
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel60c
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: 56q
        hoofdstuk: '7'
        paragraaf: '7'
      - id: ref2
        bwb_id: BWBR0003482
        artikel: 58a
        hoofdstuk: '7'
        paragraaf: '9'
      - id: ref3
        bwb_id: BWBR0003482
        artikel: 58b
        hoofdstuk: '7'
        paragraaf: '9'
      - id: ref4
        bwb_id: BWBR0003482
        artikel: 58c
        hoofdstuk: '7'
        paragraaf: '9'
      - id: ref5
        bwb_id: BWBR0003482
        artikel: 58d
        hoofdstuk: '7'
        paragraaf: '9'
      - id: ref6
        bwb_id: BWBR0003482
        artikel: 60b
        hoofdstuk: '7'
        paragraaf: '12'
  - number: 60c.c
    text: |-
      een vergoeding voor de overschrijding van de arbeidsduur, bedoeld in [artikel 54b, vierde lid][ref1], of;


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel54b
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel60c
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: 54b
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 60c.d
    text: een vergoeding voor meerdaagse activiteiten, met een duur van ten minste een etmaal, of;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel60c
  - number: 60c.e
    text: |-
      een vergoeding voor het verrichten van diensten, of werkzaamheden, of meerdaagse activiteiten, op een dag als
      bedoeld in [artikel 57a, eerste en tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel57a
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel60c
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: 57a
        hoofdstuk: '7'
        paragraaf: '8'
  - number: 60d
    text: |-
      Indien de overschrijding van de arbeidsduur, bedoeld in artikel 54b, vierde lid, wordt vergoed in tijd, zijn op
      deze tijd de artikelen 63 tot en met 67 van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel60d
  - number: '61.1'
    text: 'Voor de toepassing van dit hoofdstuk wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel61
  - number: 61.1.a
    text: «verlof» elke vorm van verlof genoemd in het tweede lid;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel61
  - number: 61.1.b
    text: «militair» de militair in werkelijke dienst;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel61
  - number: 61.1.c
    text: |-
      «maand» de periode tussen een datum van een kalendermaand en de overeenkomstige datum van de volgende
      kalendermaand, waarbij een resterend aantal van zestien of meer dagen voor een maand wordt gerekend.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel61
  - number: '61.2'
    text: 'De verloven die aan de militair kunnen worden verleend worden onderscheiden in:'
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel61
  - number: 61.2.a
    text: vakantieverlof;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel61
  - number: 61.2.b
    text: inschepings- en ontschepingsverlof;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel61
  - number: 61.2.c
    text: buitengewoon verlof;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel61
  - number: 61.2.d
    text: buitengewoon verlof in het kader van arbeid en zorg.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel61
  - number: '62'
    text: Verlof wordt verleend door de commandant van de militair tenzij in dit hoofdstuk anders wordt bepaald.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel62
  - number: '63.1'
    text: |-
      Het verlof, bedoeld in [artikel 61, tweede lid, onderdelen a tot en met c][ref1], waarop de militair ingevolge dit
      hoofdstuk aanspraak heeft, wordt hem al dan niet op zijn aanvraag verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel61
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '61'
        hoofdstuk: '8'
        paragraaf: '1'
  - number: '63.2'
    text: |-
      Verlof op aanvraag als bedoeld in het eerste lid, wordt, onder vermelding van de redenen, niet verleend voor zover
      de belangen van de dienst dit, naar het oordeel van degene die bevoegd is het verlof te verlenen, vorderen.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel63
  - number: '63.3'
    text: |-
      Het verlof, bedoeld in [artikel 61, tweede lid, onderdeel d][ref1], wordt na melding door de militair verleend met
      inachtneming van de Wet arbeid en zorg en de bepalingen in paragraaf 4b van dit hoofdstuk.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel61
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '61'
        hoofdstuk: '8'
        paragraaf: '1'
  - number: '64.1'
    text: |-
      De dagen gedurende welke een militair, ware hij niet met verlof geweest, verhinderd zou zijn geweest arbeid
      te verrichten wegens ziekte of een ongeval, worden niet aangemerkt als verlof indien hij aan de commandant een
      schriftelijke verklaring van de behandelend arts van de militaire geneeskundige dienst, of een andere arts indien
      geen arts van de militaire geneeskundige dienst voorhanden is, heeft overgelegd, waaruit blijkt dat hij niet in
      staat was om verlof te genieten.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel64
  - number: '64.2'
    text: |-
      Het eerste lid vindt geen toepassing voor de dagen waarop buitengewoon verlof als bedoeld in
      [artikel 12c, tweede lid, van de Militaire ambtenarenwet 1931][ref1] of [artikel 86, aanhef en onder b][ref2] van
      dit besluit wordt genoten.


      [ref1]: https://wetten.overheid.nl/BWBR0001952#Artikel12c
      [ref2]: https://wetten.overheid.nl/BWBR0003482#Artikel86
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0001952
        artikel: 12c
      - id: ref2
        bwb_id: BWBR0003482
        artikel: '86'
        hoofdstuk: '8'
        paragraaf: 4a
  - number: '64.3'
    text: |-
      Wanneer een militair tijdens een hem verleend vakantieverlof, inschepings- of ontschepingsverlof aanspraak kan
      maken op buitengewoon verlof als bedoeld in [artikel 85][ref1] of buitengewoon verlof in het kader van arbeid
      en zorg als bedoeld in [paragraaf 4b][ref2], wordt het vakantieverlof, inschepings- of ontschepingsverlof als
      niet verleend verlof aangemerkt, maar, met inachtneming van [artikel 85, tweede lid][ref3], onderscheidenlijk
      [paragraaf 4b][ref4] als buitengewoon verlof dan wel buitengewoon verlof in het kader van arbeid en zorg
      aangemerkt, mits hij de commandant, tijdig van de reden voor dat buitengewoon verlof in kennis heeft gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel85
      [ref2]: https://wetten.overheid.nl/BWBR0003482#Hoofdstuk8
      [ref3]: https://wetten.overheid.nl/BWBR0003482#Artikel85
      [ref4]: https://wetten.overheid.nl/BWBR0003482#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '85'
        hoofdstuk: '8'
        paragraaf: 4a
      - id: ref2
        bwb_id: BWBR0003482
        hoofdstuk: '8'
        paragraaf: 4b
      - id: ref3
        bwb_id: BWBR0003482
        artikel: '85'
        hoofdstuk: '8'
        paragraaf: 4a
      - id: ref4
        bwb_id: BWBR0003482
        hoofdstuk: '8'
        paragraaf: 4b
  - number: '65.1'
    text: |-
      Verleend verlof als bedoeld in [artikel 61, tweede lid, onderdelen a tot en met c][ref1], kan geheel of
      gedeeltelijk worden ingetrokken, indien de belangen van de dienst zulks naar het oordeel van degene die het verlof
      heeft verleend, uitdrukkelijk vorderen.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel61
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '61'
        hoofdstuk: '8'
        paragraaf: '1'
  - number: '65.2'
    text: |-
      Een dag waarop een militair door een maatregel als bedoeld in het eerste lid slechts voor een gedeelte verlof heeft
      genoten, wordt niet aangemerkt als een verlofdag.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel65
  - number: '65.3'
    text: |-
      Voorts kan verleend verlof als bedoeld in [artikel 61, tweede lid, onderdelen a tot en met c][ref1], geheel of
      gedeeltelijk worden ingetrokken op aanvraag van de betrokken militair, indien naar het oordeel van degene die het
      verlof heeft verleend, de belangen van de dienst zich daartegen niet verzetten.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel61
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '61'
        hoofdstuk: '8'
        paragraaf: '1'
  - number: '65.4'
    text: |-
      Buitengewoon verlof in het kader van arbeid en zorg eindigt met inachtneming van [paragraaf 4b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0003482
        hoofdstuk: '8'
        paragraaf: 4b
  - number: '66'
    text: |-
      De militair die voornemens is een verlof door te brengen buiten het land waar hij is geplaatst kan om redenen
      van operationele aard door degene die tot het verlenen van het verlof bevoegd is, worden verplicht hem van dat
      voornemen tijdig schriftelijk mededeling te doen onder vermelding van het land of de landen die hij tijdens zijn
      verlof zal bezoeken.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel66
  - number: '67.1'
    text: |-
      De militair aan wie een verlof is verleend en die geldelijke schade lijdt als gevolg van het geheel of gedeeltelijk
      intrekken van dat verlof krachtens [artikel 65, eerste lid][ref1], als gevolg van het geheel of gedeeltelijk
      beëindigen van dat verlof krachtens [artikel 65, vierde lid][ref2], of als gevolg van een verbod als bedoeld in
      [artikel 12e van de Militaire Ambtenarenwet 1931][ref3], heeft aanspraak op vergoeding van die schade, voor zover
      hij die redelijkerwijs niet heeft kunnen voorkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel65
      [ref2]: https://wetten.overheid.nl/BWBR0003482#Artikel65
      [ref3]: https://wetten.overheid.nl/BWBR0001952#Artikel12e
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '65'
        hoofdstuk: '8'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0003482
        artikel: '65'
        hoofdstuk: '8'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0001952
        artikel: 12e
  - number: '67.2'
    text: |-
      Aan de militair die met het oog op de besteding van een verlof waarop hij aanspraak kan doen gelden maar dat hem
      nog niet is verleend, met schriftelijke instemming van degene die tot het verlenen van het verlof bevoegd is,
      bepaalde voorzieningen heeft getroffen en:
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel67
  - number: 67.2.a
    text: |-
      aan wie het verlof wordt geweigerd om redenen die op het tijdstip waarop de instemming werd verleend niet konden
      worden voorzien, of
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel67
  - number: 67.2.b
    text: |-
      wiens voorgenomen besteding van het verlof als gevolg van een verbod als bedoeld in het eerste lid geen doorgang
      kan vinden, kan door het hoofd defensieonderdeel een gehele of gedeeltelijke vergoeding worden toegekend van de
      geldelijke schade die hij als gevolg van die weigering of dat verbod heeft geleden.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel67
  - number: 67a
    text: |-
      Indien een berekening van een vakantieverlof ingevolge de artikelen 69, 70, 71, 71a, 74, 75, 80, 80a, 80b of 81
      niet uitmondt in een afgerond aantal uren, wordt een gedeelte van een uur naar boven afgerond tot een heel uur.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel67a
  - number: '68.1'
    text: |-
      De militair ingedeeld bij de Koninklijke marine die gedurende een vol kalenderjaar als zodanig in werkelijke dienst
      is, heeft over dat jaar aanspraak op het navolgende vakantieverlof:
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel68
  - number: 68.1.a
    text: 'in het tijdvak van 1 juni tot 15 september: een aaneengesloten zomerverlof, omvattende 120 uren;'
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel68
  - number: 68.1.b
    text: |-
      in het tijdvak van 1 december van het lopende kalenderjaar tot 1 februari van het daarop volgende jaar: een
      aaneengesloten winterverlof, omvattende 80 uren;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel68
  - number: 68.1.c
    text: |-
      In het tijdvak van 1 januari tot en met 31 december op een tijdstip naar eigen keuze: 32 uren, zoveel mogelijk op
      te nemen in aaneengesloten perioden van ten minste 4 uren.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel68
  - number: '68.2'
    text: |-
      Het hoofd defensieonderdeel kan voor bijzondere gevallen van het eerste lid afwijkende vakantieverloftijdstippen
      vaststellen.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel68
  - number: '68.3'
    text: 'De commandant kan een militair in bijzondere gevallen toestaan:'
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel68
  - number: 68.3.a
    text: |-
      het hem toekomende zomer- of winterverlof op te nemen buiten de tijdvakken, genoemd in het eerste lid, onder a en
      b, of
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel68
  - number: 68.3.b
    text: die verloven aaneengesloten op te nemen.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel68
  - number: '69.1'
    text: |-
      De militair ingedeeld bij de Koninklijke marine die niet gedurende een vol kalenderjaar als zodanig in werkelijke
      dienst is, heeft - behalve indien hij in dienst is gekomen voor een periode van minder dan 85 dagen - over dat jaar
      aanspraak op het navolgende vakantieverlof:
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel69
  - number: 69.1.a
    text: 'indien hij in dienst is getreden:'
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel69
  - number: 69.1.a.(1)
    text: 'vóór 1 juni: op het in het vorige artikel bedoelde zomer- en winterverlof;'
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel69
  - number: 69.1.a.(2)
    text: 'op of na 1 juni doch vóór 1 november: op het in het vorige artikel bedoelde winterverlof;'
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel69
  - number: 69.1.b
    text: 'indien hij de dienst zal verlaten:'
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel69
  - number: 69.1.b.(1)
    text: |-
      vóór 1 juni: op een vijfde deel van het in het vorige artikel bedoelde aantal uren zomerverlof voor elke
      kalendermaand dat hij in werkelijke dienst zal zijn;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel69
  - number: 69.1.b.(2)
    text: 'in het tijdvak van 1 juni tot en met 31 augustus: op het in het vorige artikel bedoelde zomerverlof;'
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel69
  - number: 69.1.b.(3)
    text: |-
      in het tijdvak van 1 september tot en met 30 november: op het in het vorige artikel bedoelde zomerverlof alsmede op
      een derde deel van het in het vorige artikel bedoelde aantal uren winterverlof voor elke kalendermaand dat hij na
      31 augustus in werkelijke dienst zal zijn;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel69
  - number: 69.1.b.(4)
    text: 'op of na 1 december: op het in het vorige artikel bedoelde zomer- en winterverlof;'
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel69
  - number: 69.1.c
    text: |-
      op een twaalfde deel van het in het vorige artikel, eerste lid onder *c*, bedoelde vakantieverlof, voor elke maand
      dat hij in werkelijke dienst zal zijn.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel69
  - number: '69.2'
    text: |-
      In afwijking van het eerste lid kan aan de militair niettemin het in artikel 68 bedoelde zomer- en winterverlof
      worden verleend, indien de eenheid waar hij metterdaad dienst verricht gedurende de verlofperiode wordt gesloten.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel69
  - number: '69.3'
    text: Het tweede en derde lid van artikel 68 zijn van toepassing.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel69
  - number: '70.1'
    text: |-
      Over kalendermaanden gedurende de welke de militair ingedeeld bij de Koninklijke marine in het geheel geen arbeid
      verricht, heeft hij geen aanspraak op vakantieverlof. Over kalendermaanden gedurende de welke de militair ingedeeld
      bij de Koninklijke marine gedeeltelijk arbeid verricht, heeft hij slechts aanspraak op vakantieverlof naar
      evenredigheid van het gedeelte van de werktijd waarop hij feitelijk arbeid verricht.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel70
  - number: '70.2'
    text: 'Het eerste lid is niet van toepassing:'
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel70
  - number: 70.2.a
    text: in geval geen arbeid is verricht wegens verleend verlof, niet zijnde buitengewoon verlof;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel70
  - number: 70.2.b
    text: |-
      in geval geen arbeid is verricht wegens zwangerschaps- en bevallingsverlof, als bedoeld in
      [artikel 3:1 van de Wet arbeid en zorg][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '3'
  - number: 70.2.c
    text: in geval geen arbeid is verricht wegens ziekte;
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel70
  - number: 70.2.d
    text: in andere gevallen, indien degene die tot het verlenen van het verlof bevoegd is, daartoe aanleiding aanwezig acht.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel70
  - number: '70.3'
    text: |-
      Het vakantieverlof waarop een militair ingedeeld bij de Koninklijke marine ingevolge [artikel 68][ref1] of
      [69][ref2] aanspraak maakt:


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel68
      [ref2]: https://wetten.overheid.nl/BWBR0003482#Artikel69
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '68'
        hoofdstuk: '8'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0003482
        artikel: '69'
        hoofdstuk: '8'
        paragraaf: '2'
  - number: 70.3.a
    text: |-
      wordt verminderd naar evenredigheid van de tijd gedurende welke hem langer durend zorgverlof als bedoeld in
      [artikel 87c][ref1], of ouderschapsverlof als bedoeld in [artikel 87d][ref2], is verleend;


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel87c
      [ref2]: https://wetten.overheid.nl/BWBR0003482#Artikel87b
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: 87c
        hoofdstuk: '8'
        paragraaf: 4b
      - id: ref2
        bwb_id: BWBR0003482
        artikel: 87b
        hoofdstuk: '8'
        paragraaf: 4b
  - number: 70.3.b
    text: |-
      kan, naar regels bij ministeriële regeling te stellen, worden verminderd naar evenredigheid van de tijd gedurende
      welke hem buitengewoon verlof als bedoeld in [artikel 12c, tweede lid, van de Militaire Ambtenarenwet 1931][ref1]
      of [artikel 86, aanhef en onder b][ref2], is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0001952#Artikel12c
      [ref2]: https://wetten.overheid.nl/BWBR0003482#Artikel86
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0001952
        artikel: 12c
      - id: ref2
        bwb_id: BWBR0003482
        artikel: '86'
        hoofdstuk: '8'
        paragraaf: 4a
  - number: '70.4'
    text: |-
      Het vakantieverlof waarop een militair ingedeeld bij de Koninklijke marine ingevolge [artikel 68][ref1]
      of [69][ref2] aanspraak maakt wordt naar evenredigheid verminderd indien hem op grond van het
      [Besluit aanpassing arbeidsduur militairen][ref3] buitengewoon verlof in verband met deeltijdarbeid wordt verleend.
      In geval van vermeerdering van de arbeidsduur op grond van het [Besluit aanpassing arbeidsduur militairen][ref4]
      wordt de in de vorige volzin genoemde verminderde aanspraak op vakantieverlof naar evenredigheid vermeerderd.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel68
      [ref2]: https://wetten.overheid.nl/BWBR0003482#Artikel69
      [ref3]: https://wetten.overheid.nl/BWBR0011531
      [ref4]: https://wetten.overheid.nl/BWBR0011531
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '68'
        hoofdstuk: '8'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0003482
        artikel: '69'
        hoofdstuk: '8'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0011531
      - id: ref4
        bwb_id: BWBR0011531
  - number: '71.1'
    text: |-
      Niet verleend vakantieverlof van de militair ingedeeld bij de Koninklijke marine, wordt overgeboekt naar het
      volgende kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel71
  - number: '71.2'
    text: |-
      Het overgeboekte vakantieverlof, als bedoeld in het eerste lid, vervalt op 31 december van dat volgende
      kalenderjaar. Deze vervaldatum wordt met een kalenderjaar uitgesteld indien operationele omstandigheden de
      commandant hebben verhinderd vakantieverlof te verlenen, of naar het oordeel van de commandant gewichtige
      persoonlijke omstandigheden, of medische redenen, de militair hebben verhinderd vakantieverlof te genieten.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel71
  - number: '71.3'
    text: |-
      Indien medische redenen de militair hebben verhinderd om vakantieverlof op te nemen legt de militair een
      schriftelijke verklaring van de behandelend arts van de militair geneeskundige dienst, of een andere arts indien
      geen arts van de militaire geneeskundige dienst voorhanden is, over aan de commandant.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel71
  - number: '71.4'
    text: Het tweede lid is niet van toepassing ten aanzien van op 31 december 1996 nog niet verleend vakantieverlof.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel71
  - number: '71.5'
    text: |-
      Het niet genoten vakantieverlof toegekend voor 1 januari 2019, wordt uiterlijk voor of op 31 december 2023 genoten.
      Op 1 januari 2024 vervalt de aanspraak op het niet genoten verlof van voor 1 januari 2019.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel71
  - number: 71a.1
    text: |-
      Indien de militair op de datum waarop hij de werkelijke dienst verlaat nog aanspraak heeft op vakantieverlof, wordt
      hem voor ieder uur vakantieverlof dat hem niet is verleend een vergoeding toegekend ten bedrage van 1/165 deel
      van de verhoogde bezoldiging per maand als bedoeld in artikel 1, van het Inkomstenbesluit militairen, waarop de
      militair direct voorafgaand aan zijn verlaten van de werkelijke dienst aanspraak had. De vergoeding wordt berekend
      over ten hoogste twee maal de aanspraak op vakantieverlof over een vol kalenderjaar, zoals die direct voorafgaand
      aan het verlaten van de werkelijke dienst van de militair voor hem gold.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel71a
  - number: 71a.2
    text: |-
      Indien op de dag, waarop de militair de werkelijke dienst verlaat, blijkt dat de militair teveel vakantieverlof
      heeft genoten, is hij voor ieder uur teveel genoten vakantieverlof, tenzij dit niet aan zijn schuld of toedoen te
      wijten is, een bedrag verschuldigd ten bedrage van 1/165 deel van de verhoogde bezoldiging per maand als bedoeld
      in artikel 1, van het Inkomstenbesluit militairen, waarop de militair direct voorafgaand aan zijn verlaten van de
      werkelijke dienst aanspraak had.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel71a
  - number: 71a.3
    text: |-
      Indien de militair uiterlijk veertien dagen na het tijdstip waarop hij in de loop van een kalenderjaar
      de werkelijke dienst verlaat weer in werkelijke dienst komt of wordt aangesteld als burgerlijk ambtenaar
      bij het Ministerie van Defensie, kan de militair, in afwijking van het eerste lid, ervoor kiezen de
      vakantieverlofaanspraken van het lopende kalenderjaar die niet zijn genoten, te behouden. Daarbij wordt
      vakantieverlof dat in het lopende kalenderjaar is verleend in mindering gebracht op de aanspraken in dat jaar.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel71a
  - number: 71a.4
    text: |-
      Het eerste en derde lid zijn niet van toepassing ten aanzien van op 31 december 1996 nog niet verleend
      vakantieverlof, dat, wanneer het nog niet is genoten op de datum waarop de militair de werkelijke dienst verlaat,
      vervalt.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel71a
  - number: '73.1'
    text: |-
      De militair ingedeeld bij de Koninklijke landmacht, Koninklijke luchtmacht of Koninklijke marechaussee, die
      gedurende een vol kalenderjaar als zodanig in werkelijke dienst is, heeft over dat jaar aanspraak op het navolgende
      vakantieverlof:
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel73
  - number: 73.1.a
    text: 'een militair beneden de rang van majoor: 184 uren;'
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel73
  - number: 73.1.b
    text: 'een militair met de rang van majoor of een hogere rang: 192 uren.'
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel73
  - number: '73.2'
    text: |-
      Voor de toepassing van het vorige lid is bepalend de rang of de stand die de militair op 1 januari van het
      kalenderjaar bekleedt.
    url: https://wetten.overheid.nl/BWBR0003482/2022-09-01#Artikel73
  - number: '73.3'
    text: |-
      De volgens het eerste lid vastgestelde aantallen uren vakantieverlof worden verhoogd volgens onderstaande tabel,
      afhankelijk van de leeftijd die de militair in het desbetreffende kalenderjaar bereikt:






                    leeftijd


                    verhoging






                    18 jaar en jonger


                    24 uren




                    19 jaar


                    16 uren




