---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: algemeen_militair_ambtenarenreglement
regulatory_layer: AMVB
publication_date: '2006-08-01'
valid_from: '2004-01-01'
bwb_id: BWBR0003482
url: https://wetten.overheid.nl/BWBR0003482/2004-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Defensie, C. L. J. van Lent van 25 mei 1981, nr. PP81/091/1244;

    Overwegende, dat het wenselijk is de bepalingen inzake de rechtstoestand van de militaire ambtenaren van de
    krijgsmacht aan te passen aan de thans dienaangaande bestaande inzichten en opvattingen;

    Gelet op artikel 68 van de Grondwet (Stb. 1972, 193), artikel 125 van de Ambtenarenwet 1929 (Stb. 530), artikel 12
    van de Militaire Ambtenarenwet 1931 (Stb. 519) en artikel 2 van de Wet voor het reserve-personeel der krijgsmacht
    (Stb. 1954, 576);

    De Raad van State gehoord (advies van 5 oktober 1981, nr. 810923/16);

    Gezien het nader rapport van de Staatssecretaris van Defensie, J. van Houwelingen van 18 februari 1982, nr.
    PP81/094/403;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'Voor de toepassing van dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel1
  - number: 1.1.a
    text: 'Onze Minister: Onze Minister van Defensie;'
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel1
  - number: 1.1.b
    text: |-
      militair: de militaire ambtenaar in de zin van
      [artikel 1, eerste en tweede lid, van de Militaire Ambtenarenwet 1931][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001952#Artikel1
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001952
        artikel: '1'
  - number: 1.1.c
    text: 'militair in werkelijke dienst (tenzij uitdrukkelijk anders is bepaald): de militair die:'
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel1
  - number: 1.1.c.1e
    text: |-
      is aangesteld bij het beroepspersoneel, tenzij hij op non-aktiviteit is gesteld of hem buitengewoon verlof van
      lange duur is verleend;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel1
  - number: 1.1.c.2e
    text: behoort tot het reserve-personeel en als zodanig feitelijk onder de wapenen is;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel1
  - number: 1.1.d
    text: 'officiersrang: de rang van luitenant ter zee der 3e klasse of van tweede-luitenant of een hogere rang;'
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel1
  - number: 1.1.e
    text: |-
      «zeemacht, landmacht, luchtmacht en marechaussee»: de Koninklijke marine, de Koninklijke landmacht, de Koninklijke
      luchtmacht en de Koninklijke marechaussee;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel1
  - number: 1.1.f
    text: |-
      militaire inkomsten: alle beloningen in geld waarop de militair aanspraak kan maken krachtens de voor hem geldende
      bezoldigingsregeling of bezoldigingsregelingen, en krachtens de ter uitvoering van deze regeling of regelingen
      gegeven voorschriften;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel1
  - number: 1.1.g
    text: 'initiële opleiding: de opleiding als bedoeld in artikel 13, eerste lid.'
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel1
  - number: 1.1.h
    text: |-
      «de bevelhebber» de bevelhebber van het desbetreffende krijgsmachtdeel of de commandant van het wapen der
      Koninklijke marechaussee;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel1
  - number: 1.1.i
    text: «de commandant» een bij ministeriële regeling aan te wijzen functionaris.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel1
  - number: 1.1.j
    text: |-
      marechaussee: de militaire ambtenaar aangesteld bij de Koninklijke landmacht en ingedeeld bij het Wapen der
      Koninklijke marechaussee.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel1
  - number: '1.2'
    text: |-
      Voor de toepassing van dit besluit wordt mede begrepen onder rang, stand of klasse: de bij het koninklijk besluit
      van 20 juni 1956 (*Stb.* 361) met die rang, stand of klasse gelijkgestelde rang, stand of klasse.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel1
  - number: '1.3'
    text: 'In dit besluit en de daarop berustende bepalingen wordt mede verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel1
  - number: 1.3.a
    text: 'echtgenote of echtgenoot:'
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel1
  - number: 1.3.a.1°
    text: de geregistreerde partner;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel1
  - number: 1.3.a.2°
    text: |-
      degene die door de militair als partner is aangemeld bij de Stichting Pensioenfonds ABP en door het bestuur van dat
      fonds als zodanig is aangemerkt, op voorwaarde dat de militair een bewijs van die aanmelding heeft overgelegd aan
      de commandant;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel1
  - number: 1.3.b
    text: 'huwelijk:'
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel1
  - number: 1.3.b.1°
    text: het geregistreerd partnerschap;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel1
  - number: 1.3.b.2°
    text: |-
      de samenleving met de partner die door de militair als zodanig is aangemeld bij de Stichting Pensioenfonds ABP en
      door het bestuur van dat fonds als zodanig is aangemerkt.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel1
  - number: '1.4'
    text: |-
      De gelijkstellingen, bedoeld in het derde lid, onderdeel a, onder 2° en onderdeel b, onder 2°, eindigen op de dag
      waarop de aanmelding van het partnerpensioen door de Stichting Pensioenfonds ABP wordt doorgehaald. De militair
      is verplicht die doorhaling aan de commandant te melden, waarbij hij een afschrift van de mededeling van die
      doorhaling verstrekt.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel1
  - number: '1.5'
    text: |-
      Voor de toepassing van de hoofdstukken 5, 7, 8, 9 en 10, alsmede de artikelen 129, 130, 130*a*, 132, 134, 135 en
      144 tot en met 153 van hoofdstuk 11, wordt onder "militair" mede begrepen hij die is aangesteld in burgerlijke
      openbare dienst om bij de krijgsmacht als geestelijk verzorger doorlopend werkzaam te zijn; deze geestelijk
      verzorger wordt, in voorkomend geval, mede begrepen onder het beroepspersoneel. De overeenkomstige bepalingen van
      het [Burgerlijk ambtenarenreglement defensie][ref1]zijn op hem niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006040
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006040
  - number: '1.6'
    text: |-
      Op degene die is aangesteld in burgerlijke openbare dienst om bij de krijgsmacht als geestelijk verzorger niet
      doorlopend werkzaam te zijn, is het derde lid van overeenkomstige toepassing met dien verstande dat hij in
      voorkomend geval wordt medebegrepen onder het reserve-personeel.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel1
  - number: '2.1'
    text: |-
      Onze Minister kan in geval van buitengewone omstandigheden tijdelijk afwijken van hetgeen bij of krachtens dit
      besluit is bepaald, indien en voor zolang dit met het oog op de goede uitvoering van de operationele taken van de
      krijgsmacht noodzakelijk wordt geacht.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel2
  - number: '2.2'
    text: |-
      Onze Minister kan voorts bijzondere regelen, die afwijken van dit besluit, vaststellen ten aanzien van militairen
      die tewerkgesteld zijn:
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel2
  - number: 2.2.a
    text: onder leiding of toezicht van een orgaan van de Verenigde Naties;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel2
  - number: 2.2.b
    text: bij of ten behoeve van een bondgenootschappelijk orgaan of bondgenootschappelijke strijdkrachten;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel2
  - number: 2.2.c
    text: |-
      ten behoeve van operaties in het kader van internationale overeenkomsten of andere verplichtingen door Nederland
      aangegaan.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel2
  - number: 2.2.d
    text: buiten het Ministerie van Defensie, anders dan in de gevallen, bedoeld onder a, b en c,
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel2
  - number: '3'
    text: |-
      De commandant draagt er zorg voor dat een of meer exemplaren van dit besluit en van alle overige voorschriften
      betreffende de rechtstoestand van de militair steeds bij de eenheid of het onderdeel, waartoe de militair behoort,
      ter inzage aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel3
  - number: 3a
    text: |-
      De bevoegdheid tot het vaststellen van ministeriële regelingen als bedoeld in de [hoofdstukken 7][ref1],
      [8][ref2], [10][ref3] en [11][ref4], kan door Onze Minister worden gemandateerd aan de directeur-generaal
      personeel en materieel van het ministerie van Defensie.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Hoofdstuk7
      [ref2]: https://wetten.overheid.nl/BWBR0003482#Hoofdstuk8
      [ref3]: https://wetten.overheid.nl/BWBR0003482#Hoofdstuk10
      [ref4]: https://wetten.overheid.nl/BWBR0003482#Hoofdstuk11
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0003482
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0003482
        hoofdstuk: '8'
      - id: ref3
        bwb_id: BWBR0003482
        hoofdstuk: '10'
      - id: ref4
        bwb_id: BWBR0003482
        hoofdstuk: '11'
  - number: '4.1'
    text: 'Aanstelling als militair kan plaatsvinden bij:'
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel4
  - number: 4.1.a
    text: het beroepspersoneel, voor onbepaalde tijd;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel4
  - number: 4.1.b
    text: het beroepspersoneel, voor een bepaalde tijd;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel4
  - number: 4.1.c
    text: het reserve-personeel, voor onbepaalde tijd;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel4
  - number: 4.1.d
    text: het reserve-personeel, voor een bepaalde tijd.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel4
  - number: '4.2'
    text: De aanstelling waarbij een officiersrang wordt toegekend, geschiedt bij koninklijk besluit.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel4
  - number: '4.3'
    text: |-
      De aanstelling waarbij een rang of stand en klasse wordt toegekend beneden de rang van luitenant ter zee der 3e
      klasse/tweede-luitenant, geschiedt door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel4
  - number: '4.4'
    text: De aanstelling van een lid van het Koninklijk Huis geschiedt bij koninklijk besluit.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel4
  - number: 4a.1
    text: 'De bevelhebber maakt bij de werving bekend en verschaft informatie over:'
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel4a
  - number: 4a.1.a
    text: de voorwaarden voor aanstelling als bedoeld in artikel 5;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel4a
  - number: 4a.1.b
    text: de uiterlijke datum van inzending van de sollicitatieformulieren;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel4a
  - number: 4a.1.c
    text: bijzondere selectie-onderzoeken;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel4a
  - number: 4a.1.d
    text: de arbeidsvoorwaarden;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel4a
  - number: 4a.1.e
    text: de inhoud van de opleiding;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel4a
  - number: 4a.1.f
    text: de inhoud van de in de regel te vervullen functies;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel4a
  - number: 4a.1.g
    text: de informatie verschaffende instanties.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel4a
  - number: 4a.2
    text: |-
      Tijdens de selectie worden de gestelde voorwaarden, bedoeld in het eerste lid onder a, niet ten nadele van de
      gegadigde gewijzigd.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel4a
  - number: 4a.3
    text: |-
      Het inwinnen van inlichtingen – anders dan in het kader van het veiligheidsonderzoek – bij personen en instanties
      buiten het Ministerie van Defensie staat in direct verband met het functioneren binnen de organisatie en vindt
      uitsluitend plaats onder opgave van redenen aan de gegadigde en nadat met hem is overeengekomen bij wie en in welke
      fase van het selectieonderzoek dat kan geschieden.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel4a
  - number: 4a.4
    text: |-
      De gegadigde wordt – op diens verzoek – geïnformeerd omtrent de inhoud van de inlichtingen, bedoeld in het derde
      lid en welke betekenis hieraan voor de selectie is toegekend. De informant wordt vooraf van dit recht van de
      gegadigde in kennis gesteld.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel4a
  - number: 4a.5
    text: |-
      De gegadigde heeft het recht kennis te nemen van de uitslag van het psychologisch onderzoek en om, desgewenst,
      hierop een toelichting te ontvangen van respectievelijk de psycholoog die het onderzoek heeft verricht of de
      psycholoog onder wiens verantwoordelijkheid het psychologisch onderzoek heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel4a
  - number: 4a.6
    text: |-
      De gegadigde heeft het recht om kennis te nemen van de uitslag van het geneeskundig onderzoek binnen twee weken na
      vaststelling en om, desgewenst, hierop een toelichting te ontvangen van respectievelijk de arts die het onderzoek
      heeft verricht of de arts onder wiens verantwoordelijkheid het geneeskundig onderzoek heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel4a
  - number: 4a.7
    text: |-
      De gegadigde heeft het recht zijn bedenkingen tegen de uitslag van een geneeskundig of psychologisch onderzoek
      kenbaar te maken. Indien deze bedenkingen door een door Onze Minister aan te wijzen arts respectievelijk psycholoog
      gegrond zijn verklaard, kan hij desgewenst aan een hernieuwd onderzoek worden onderworpen.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel4a
  - number: 4a.8
    text: |-
      Aan de gegadigde die deelneemt aan de selectie of onderdelen daarvan wordt een tegemoetkoming wegens ondergane
      inkomstenderving en gemaakte reiskosten verleend. De kosten die de gegadigde maakt teneinde resultaten van
      onderdelen van de selectie te verkrijgen worden niet vergoed.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel4a
  - number: '5.1'
    text: 'Om in aanmerking te komen voor een aanstelling dient de gegadigde:'
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel5
  - number: 5.1.a
    text: het Nederlanderschap te bezitten;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel5
  - number: 5.1.b
    text: |-
      te voldoen aan de eisen van lichamelijke en geestelijke geschiktheid die ter zake zijn gesteld bij of krachtens het
      Militair Keuringsreglement;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel5
  - number: 5.1.c
    text: zich schriftelijk bereid te verklaren tot het afleggen van de eed of belofte;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel5
  - number: 5.1.d
    text: |-
      afhankelijk van de functie dan wel de groepen van functies waarvoor hij is bestemd te voldoen aan, voor zover niet
      bij of krachtens wet anders is bepaald, door de bevelhebber vastgestelde bijzondere eisen inzake:
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel5
  - number: 5.1.d.1
    text: leeftijd;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel5
  - number: 5.1.d.2
    text: vooropleiding;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel5
  - number: 5.1.d.3
    text: geschiktheid, anders dan bedoeld onder b, en bekwaamheid.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel5
  - number: '5.2'
    text: |-
      Wanneer aan de aanstelling een proeftijd is verbonden, kan in bijzondere gevallen worden afgeweken van de bij en
      krachtens het eerste lid, onder a, b en d, gestelde voorwaarden, indien in redelijkheid mag worden verwacht dat
      vóór het einde van de proeftijd wel aan de voorwaarden is voldaan. Indien op de laatste dag van de proeftijd niet
      is voldaan aan alle voorwaarden voor aanstelling, eindigt met ingang van die dag de aanstelling van rechtswege.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel5
  - number: '5.3'
    text: |-
      De gegadigde kan alleen worden aangesteld als ten diens aanzien in verband met de voorgenomen aanstelling een
      verklaring als bedoeld in [artikel 1, eerste lid, onder b, van de Wet veiligheidsonderzoeken][ref1] is afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0008277#Artikel1
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0008277
        artikel: '1'
  - number: '6.1'
    text: |-
      Een aanstelling voor een bepaalde tijd kan door het op grond van artikel 4 bevoegde gezag worden verlengd indien de
      militair zulks wenst, of worden bekort indien de militair daarmee instemt.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel6
  - number: '6.2'
    text: |-
      Onze Minister kan een aanstelling voor een bepaalde tijd verlengen, indien op het tijdstip van beëindiging één van
      de in artikel 42, eerste lid, onder a, b, c, e of f, genoemde omstandigheden zich voordoet. Ontslagaanvragen van
      militairen kunnen worden afgewezen en wel tot het tijdstip waarop de hiervoor genoemde desbetreffende omstandigheid
      zich niet meer voordoet.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel6
  - number: '7.1'
    text: |-
      Aan een aanstelling voor onbepaalde tijd bij het beroepspersoneel is de verplichting verbonden gedurende
      een door Onze Minister te bepalen tijd deel uit te maken van het beroepspersoneel. Tevens kan aan deze
      aanstelling, naar bij ministeriële regeling te stellen regels, de verplichting worden verbonden gedurende een
      door Onze Minister te bepalen tijd deel uit te maken van het reserve-personeel. Daarbij kunnen uitsluitend de
      verplichtingen tot het verrichten van werkelijke dienst worden opgelegd die rechtstreeks voortvloeien uit de
      [Wet voor het reserve-personeel der krijgsmacht 1985][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003883
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0003883
  - number: '7.2'
    text: |-
      Aan een aanstelling voor een bepaalde tijd bij het beroepspersoneel is de verplichting verbonden gedurende
      die tijd deel uit te maken van het beroepspersoneel. Tevens kan aan deze aanstelling, naar bij ministeriële
      regeling te stellen regels, de verplichting worden verbonden gedurende een door Onze Minister te bepalen
      tijd deel uit te maken van het reserve-personeel. In dit geval, kunnen tevens, naar bij ministeriële
      regeling te stellen regels, verplichtingen tot het verrichten van werkelijke dienst bij het reserve-
      personeel worden opgelegd welke uitgaan boven de verplichtingen die rechtstreeks voortvloeien uit de
      [Wet voor het reserve-personeel der krijgsmacht 1985][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003883
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0003883
  - number: '7.3'
    text: |-
      Aan een aanstelling bij het reserve-personeel, anders dan voortvloeiend uit de in de eerste volzin van het eerste
      lid of de eerste volzin van het tweede lid bedoelde aanstellingen is de verplichting verbonden gedurende ten
      minste een door Onze Minister te bepalen tijd deel uit te maken van het reserve-personeel. Daarbij kunnen tevens,
      naar bij ministeriële regeling te stellen regels, verplichtingen tot het verrichten van werkelijke dienst bij
      het reserve-personeel worden opgelegd welke uitgaan boven de verplichtingen die rechtstreeks voortvloeien uit de
      [Wet voor het reserve-personeel der krijgsmacht 1985][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003883
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0003883
  - number: '8'
    text: |-
      Aan de militair wordt door het op grond van artikel 4 bevoegde gezag bij aanstelling een rang of stand en klasse
      toegekend.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel8
  - number: '9'
    text: |-
      Aan een aanstelling kan door het op grond van artikel 4 bevoegde gezag een proeftijd van ten hoogste twaalf
      kalendermaanden worden verbonden.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel9
  - number: '10.1'
    text: |-
      Aan de militair aangesteld voor onbepaalde tijd wordt bij aanstelling inzicht gegeven in de groepen van functies
      waarvoor hij is bestemd.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel10
  - number: '10.2'
    text: |-
      Aan de militair aangesteld voor onbepaalde tijd wordt voorts bij afronding van de initiële opleiding de aard en het
      niveau bekendgemaakt van de eerste functies die hem zullen worden toegewezen.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel10
  - number: '11.1'
    text: |-
      Wegens en voor de duur van de vervulling van een functie die niet door reeds in werkelijke dienst verblijvende
      militairen kan worden vervuld, kan in bijzondere gevallen tijdelijke aanstelling als militair bij het
      beroepspersoneel plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel11
  - number: '11.2'
    text: |-
      Bij de in het eerste lid bedoelde tijdelijke aanstelling kan worden afgeweken van de bij en krachtens artikel 5,
      eerste lid, gestelde voorwaarden.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel11
  - number: '11.3'
    text: |-
      Indien een als zodanig tijdelijk aangestelde militair wordt ontheven van zijn functie, eindigt de aanstelling met
      ingang van de dag van die ontheffing van rechtswege.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel11
  - number: '12'
    text: |-
      Aan de militair wordt zo spoedig mogelijk na aanstelling een akte van aanstelling uitgereikt. Deze moet in ieder
      geval inhouden:
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel12
  - number: 12.a
    text: naam en voornamen, alsmede de plaats en datum van geboorte;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel12
  - number: 12.b
    text: het krijgsmachtdeel waarbij de militair is aangesteld;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel12
  - number: 12.c
    text: de categorie als bedoeld in artikel 4, eerste lid, waartoe de militair behoort;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel12
  - number: 12.d
    text: de rang of stand en klasse die de militair is toegekend;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel12
  - number: 12.e
    text: de functie dan wel groepen van functies waarvoor de militair is bestemd;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel12
  - number: 12.f
    text: de datum van ingang van de aanstelling;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel12
  - number: 12.g
    text: voor zover toepasselijk, de aan de aanstelling verbonden verplichtingen als bedoeld in artikel 7.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel12
  - number: 12a.1
    text: |-
      Zo spoedig mogelijk na aanstelling legt de militair de volgende eed of belofte af: "Ik zweer (beloof) trouw aan de
      Koning(in), gehoorzaamheid aan de wetten en onderwerping aan de krijgstucht. Zo waarlijk helpe mij God Almachtig
      (Dat beloof ik)".
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel12a
  - number: 12a.2
    text: |-
      In afwijking van het eerste lid legt de militair die bij zijn aanstelling is aangewezen voor het volgen van een
      initiële opleiding, de eed of belofte af zo spoedig mogelijk na het voltooien van die opleiding.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel12a
  - number: 12a.3
    text: |-
      Indien de militair ingevolge een eerdere aanstelling reeds de eed of belofte heeft afgelegd, wordt deze niet
      opnieuw afgelegd.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel12a
  - number: '13.1'
    text: |-
      De militair wordt door de bevelhebber bij aanstelling in beginsel aangewezen voor het volgen van een initiële
      opleiding. Deze opleiding is ten minste gericht op het verkrijgen van de benodigde kennis en vaardigheid voor de
      eerste functie(s) waarvoor hij is bestemd.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel13
  - number: '13.2'
    text: |-
      Aan de aanwijzing voor een initiële opleiding kan de verplichting worden verbonden tot gehele of gedeeltelijke
      terugbetaling van de kosten van de opleiding, indien de militair na het verstrijken van de voor hem geldende
      proeftijd:
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel13
  - number: 13.2.a
    text: wordt ontheven van de opleiding;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel13
  - number: 13.2.b
    text: |-
      voordat de tijd, bedoeld in de eerste volzin van het eerste of tweede lid van artikel 7 is verstreken, wordt
      ontheven van de functie waarvoor hij is opgeleid dan wel uit de dienst wordt ontslagen.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel13
  - number: '13.3'
    text: |-
      Onder de kosten van de opleiding vallen niet de tijdens de opleiding genoten militaire inkomsten. De bevelhebber
      kan ten aanzien van bepaalde opleidingen, gelet op de aard en duur daarvan, voor wat betreft de bezoldiging anders
      bepalen; in deze gevallen is artikel 14, vierde lid, van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel13
  - number: '13.4'
    text: |-
      Bij de berekening van het terug te betalen bedrag wordt uitgegaan van een evenwichtige verdeling van risico's
      tussen werkgever en werknemer.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel13
  - number: '13.5'
    text: |-
      Het bedrag van de terugbetalingsverplichting wordt naar evenredigheid verminderd naarmate de termijn als bedoeld
      in het tweede lid onder b, van artikel 14 is verstreken, met dien verstande dat, behoudens in bij ministeriële
      regeling te bepalen gevallen, de termijn ten hoogste 5 jaren bedraagt.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel13
  - number: '14.1'
    text: |-
      De militair kan, al dan niet op eigen aanvraag, door de bevelhebber worden aangewezen voor het volgen van een
      opleiding om de benodigde kennis en vaardigheid te behouden voor de vervulling van zijn functie, dan wel te
      verkrijgen voor de vervulling van functies binnen de groepen van functies waarvoor hij is bestemd. Hij wordt tijdig
      in de gelegenheid gesteld tot het volgen van die opleiding.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel14
  - number: '14.2'
    text: |-
      Aan de aanwijzing op aanvraag voor het volgen van een bijscholingsopleiding kan de verplichting worden verbonden
      dat de militair nog gedurende een door de bevelhebber te bepalen tijd deel zal blijven uitmaken van het
      beroepspersoneel.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel14
  - number: '14.3'
    text: |-
      De bevelhebber kan, overeenkomstig het vierde en vijfde lid van artikel 13, aan de aanwijzing op aanvraag voor
      het volgen van een bijscholingsopleiding, afhankelijk van de aard of de duur van de opleiding, de verplichting
      verbinden tot gehele of gedeeltelijke terugbetaling van hetgeen voor rekening van het rijk aan of ten behoeve van
      de militair tijdens of in verband met de opleiding is betaald, indien de militair:
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel14
  - number: 14.3.a
    text: wordt ontheven van de opleiding;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel14
  - number: 14.3.b
    text: |-
      voordat aan de in het tweede lid bedoelde verplichting is voldaan, wordt ontheven van de functie waarvoor hij is
      opgeleid, dan wel uit de dienst wordt ontslagen.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel14
  - number: '14.4'
    text: |-
      Op de volgens het derde lid vastgestelde terugbetalingsverplichting wordt, gerelateerd aan het aantal maanden
      dat de opleiding is gevolgd, in mindering gebracht het minimumloon, vastgesteld naar analogie van hetgeen bij en
      krachtens de [Wet minimumloon en minimum-vakantiebijslag][ref1] is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0002638
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002638
  - number: '15.1'
    text: |-
      De militair kan, al dan niet op eigen aanvraag – in voorkomend geval bij toepassing van artikel 20, dan wel artikel
      43, eerste lid – door de bevelhebber worden aangewezen voor het volgen van een opleiding ter verkrijging van de
      benodigde kennis en vaardigheid voor de vervulling van functies binnen andere groepen van functies dan waarvoor hij
      tot dan toe was bestemd.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel15
  - number: '15.2'
    text: Artikel 14 is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel15
  - number: '16'
    text: |-
      De bevelhebber kent de militair een vergoeding toe voor de aan een bijscholings- of omscholingsopleiding verbonden
      noodzakelijke en te zijnen laste komende kosten.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel16
  - number: '17'
    text: |-
      De militair die is aangewezen voor het volgen van een opleiding, kan daarvan door de bevelhebber worden ontheven,
      indien hij niet voldoet aan de bij de opleiding gestelde eisen of indien ontheffing in het belang van de dienst of
      van de militair om andere redenen noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel17
  - number: 17a
    text: |-
      De bevelhebber kan, indien de billijkheid dit vordert, een militair op wie een verplichting rust als bedoeld in de
      artikelen 13, 14 en 15 geheel of gedeeltelijk van die verplichting ontheffen.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel17a
  - number: 17b.1
    text: |-
      De militair die is aangesteld voor onbepaalde tijd die, zonder daarvoor ingevolge de overige bepalingen van dit
      hoofdstuk te zijn aangewezen, voor eigen rekening een studie of opleiding volgt of heeft voltooid die naar het
      oordeel van de bevelhebber mede dan wel volledig in het belang van de dienst is, kan in aanmerking komen voor een
      tegemoetkoming van respectievelijk 50% of 100% in gemaakte studie- en opleidingskosten.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel17b
  - number: 17b.2
    text: |-
      De in het kader van de opleiding noodzakelijk gemaakte excursie-, reis- en verblijfkosten komen in aanmerking voor
      een tegemoetkoming van 50%, in geval van een studie of opleiding mede in het belang van de dienst, dan wel 100% in
      geval van een studie of opleiding volledig in het belang van de dienst, berekend op de voet van de bepalingen van
      het [Besluit dienstreizen defensie][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007956
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel17b
    references:
      - id: ref1
        bwb_id: BWBR0007956
  - number: 17b.3
    text: |-
      De bevelhebber kan, bij een studie of opleiding mede in het belang van de dienst, in bijzondere gevallen bepalen
      dat de excursie- en verblijfkosten in aanmerking komen voor een tegemoetkoming van maximaal 75% en de reiskosten in
      aanmerking komen voor een tegemoetkoming van maximaal 100%.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel17b
  - number: 17b.4
    text: |-
      Tenzij de bevelhebber om redenen van billijkheid anders bepaalt, is de militair verplicht tot terugbetaling van 50%
      van de aan hem verleende tegemoetkoming van 100% als bedoeld in het eerste en tweede lid in geval:
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel17b
  - number: 17b.4.a
    text: |-
      hem – zonder de aanduiding eervol – ontslag wordt verleend voordat de studie of opleiding met goed gevolg is
      afgesloten;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel17b
  - number: 17b.4.b
    text: |-
      is vastgesteld dat de studie of opleiding niet met goed gevolg is afgesloten op grond van omstandigheden die aan
      hem te wijten zijn.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel17b
  - number: 17b.5
    text: |-
      Aan de militair worden geen werkzaamheden of diensten opgedragen op de dag waarop de militair tentamens of examens
      aflegt of op de dag die daaraan voorafgaat, tenzij het dienstbelang zulks naar het oordeel van de commandant
      onvermijdelijk maakt.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel17b
  - number: 17b.6
    text: |-
      De commandant kan met het oog op de voortgang van de studie of opleiding in aanvulling op het vijfde lid bepaalde
      verloffaciliteiten verlenen.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel17b
  - number: 17c.1
    text: |-
      De militair die is aangesteld voor onbepaalde tijd die, zonder daarvoor ingevolge de overige bepalingen van dit
      hoofdstuk te zijn aangewezen, voor eigen rekening een studie of opleiding volgt of heeft voltooid die naar het
      oordeel van de bevelhebber in het belang van de bevordering van de externe werkzekerheid van de militair is, kan in
      aanmerking komen voor een tegemoetkoming van 100% in gemaakte studie- en opleidingskosten. De militair komt alleen
      voor tegemoetkoming in aanmerking als de studie of opleiding is gericht op het wegnemen van opgelopen lacunes in
      de (beroeps)opleiding of het slechten van scholingsachterstand voor de arbeidsmarkt en niet indien zij louter is
      gericht op positieverbetering.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel17c
  - number: 17c.2
    text: |-
      De in het kader van de opleiding noodzakelijk gemaakte excursie-, reis- en verblijfkosten komen in aanmerking voor
      een tegemoetkoming van 100%, in geval van een studie of opleiding in het belang van de bevordering van de externe
      werkzekerheid van de militair, berekend op de voet van de bepalingen van het [Besluit dienstreizen defensie][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007956
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel17c
    references:
      - id: ref1
        bwb_id: BWBR0007956
  - number: 17c.3
    text: |-
      Tenzij de bevelhebber om redenen van billijkheid anders bepaalt, betaalt de militair 50% van de aan hem verleende
      tegemoetkoming als bedoeld in het eerste en tweede lid terug in geval:
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel17c
  - number: 17c.3.a
    text: |-
      hem – zonder de aanduiding eervol – ontslag wordt verleend voordat de studie of opleiding met goed gevolg is
      afgesloten;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel17c
  - number: 17c.3.b
    text: |-
      is vastgesteld dat de studie of opleiding niet met goed gevolg is afgesloten op grond van omstandigheden die aan
      hem te wijten zijn.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel17c
  - number: 17c.4
    text: |-
      Aan de militair worden geen werkzaamheden of diensten opgedragen op de dag waarop de militair tentamens of examens
      aflegt of op de dag die daaraan voorafgaat, tenzij het dienstbelang zulks naar het oordeel van de commandant
      onvermijdelijk maakt.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel17c
  - number: 17c.5
    text: |-
      De commandant kan met het oog op de voortgang van de studie of opleiding in aanvulling op het vierde lid bepaalde
      verloffaciliteiten verlenen.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel17c
  - number: '18'
    text: 'Voor de toepassing van dit hoofdstuk wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel18
  - number: 18.a
    text: 'functietoewijzing: de aanwijzing van de militair voor het vervullen van een functie;'
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel18
  - number: 18.b
    text: 'bevordering: het toekennen aan de militair van een hogere rang, waaronder mede wordt verstaan stand en klasse.'
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel18
  - number: '19.1'
    text: |-
      Functietoewijzing, waarbij aan de duur van de functievervulling een maximum termijn kan worden verbonden, en
      ontheffing uit de functie geschieden:
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel19
  - number: 19.1.a
    text: |-
      door Onze Minister, indien aan de functie de rang van commandeur/brigade-generaal/commodore of een hogere rang
      is verbonden;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel19
  - number: 19.1.b
    text: door de bevelhebber, indien aan de functie een lagere rang is verbonden dan commandeur/brigade-generaal/commodore.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel19
  - number: '19.2'
    text: De militair is gehouden de hem toegewezen functie te vervullen.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel19
  - number: '19.3'
    text: |-
      Na ontheffing uit de functie volgt in beginsel functietoewijzing, bestemming voor een bijscholingsopleiding of
      bestemming voor een omscholingsopleiding.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel19
  - number: '19.4'
    text: |-
      Indien de militair buiten staat is de hem toegewezen functie te vervullen, kunnen daaraan door de
      functietoewijzingsautoriteit, als bedoeld in het eerste lid, consequenties worden verbonden met betrekking tot de
      toekomstige functietoewijzing.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel19
  - number: '20.1'
    text: 'De militair kan worden bestemd voor andere groepen van functies dan waarvoor hij tot dan toe was bestemd:'
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel20
  - number: 20.1.a
    text: op zijn aanvraag, al dan niet binnen het krijgsmachtdeel waartoe hij behoort;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel20
  - number: 20.1.b
    text: bij gebleken noodzaak in het belang van de dienst binnen zijn krijgsmachtdeel, bij voorkeur met zijn instemming;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel20
  - number: 20.1.c
    text: bij gebleken noodzaak in het belang van de dienst bij een ander krijgsmachtdeel, uitsluitend met zijn instemming.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel20
  - number: '20.2'
    text: |-
      Bij toepassing van het eerste lid wordt gewijzigd hetgeen ingevolge artikel 12, onder b, e en/of g, in de akte van
      aanstelling is opgenomen.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel20
  - number: '21'
    text: |-
      Voor bepaling van de functies die voor functietoewijzing beschikbaar zijn en voor de bepaling van welke militair
      deze functie kan vervullen:
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel21
  - number: 21.a
    text: maakt de bevelhebber periodiek de voor het krijgsmachtdeel van belang zijnde beschikbare functies bekend;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel21
  - number: 21.b
    text: |-
      wordt de militair door de bevelhebber periodiek in de gelegenheid gesteld zijn voorkeur kenbaar te maken voor
      toekomstige te vervullen functies.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel21
  - number: '22'
    text: |-
      Om voor een functie in aanmerking te komen moet de militair voldoen aan de gestelde eisen omtrent de opbouw van
      kennis en ervaring voor de vervulling van die functie.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel22
  - number: '23'
    text: 'Bij het nemen van een beslissing tot functietoewijzing wordt rekening gehouden met de volgende factoren:'
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel23
  - number: 23.a
    text: |-
      de noodzaak van een voortdurende taakvervulling door de krijgsmacht en in samen-hang daarmee van een zo goed en
      tijdig mogelijke bezetting van alle functies;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel23
  - number: 23.b
    text: |-
      de wenselijkheid van een spreiding van de totale loopbaan van de militair over functies en van een daarmee gepaard
      gaande opbouw van kennis en ervaring;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel23
  - number: 23.c
    text: de bekwaamheid en geschiktheid van de militair voor de functie;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel23
  - number: 23.d
    text: de door de militair kenbaar gemaakte voorkeur.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel23
  - number: '24'
    text: |-
      De bevelhebber stelt de betrokken militair indien mogelijk zes maanden, doch in ieder geval - tenzij het
      dienstbelang naar zijn oordeel noodzaakt tot afwijking - twee maanden vóór de vermoedelijke datum van ingang van
      functievervulling, in kennis van het voornemen tot functietoewijzing, onder vermelding van:
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel24
  - number: 24.a
    text: de functie;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel24
  - number: 24.b
    text: de standplaats;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel24
  - number: 24.c
    text: de datum van ingang;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel24
  - number: 24.d
    text: een indicatie van de duur van de functievervulling.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel24
  - number: '25.1'
    text: |-
      In afwijking van artikel 19, eerste lid, kan de militair voor een periode van maximaal 12 maanden worden belast
      met de volledige waarneming van een functie. Onder volledige waarneming van een functie wordt verstaan het op
      aanwijzing van de bevelhebber verrichten van het volledige samenstel van werkzaamheden verbonden aan een andere
      functie dan die aan hem is toegewezen, met de daarmee gepaard gaande bevoegdheden en verantwoordelijkheden.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel25
  - number: '25.2'
    text: |-
      Voorts kan de militair door de bevelhebber tijdelijk worden belast met de waarneming van een deel van het samenstel
      van werkzaamheden verbonden aan een andere functie dan die aan hem is toegewezen.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel25
  - number: '26'
    text: |-
      Indien het onder bijzondere omstandigheden onmogelijk is gebleken de militair tijdig aan te wijzen voor een
      opleiding als bedoeld in de artikelen 14 en 15 kan hij voor de tijd dat hij de opleiding nog niet heeft voltooid
      het op grond van artikel 19 bevoegde gezag worden ontheven van bepaalde eisen die aan de aan hem toegewezen functie
      zijn verbonden.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel26
  - number: '27.1'
    text: 'Bij koninklijk besluit geschiedt de bevordering van:'
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel27
  - number: 27.1.a
    text: |-
      een militair met een rang beneden de rang van luitenant ter zee der derde klasse/tweede luitenant tot een
      officiersrang;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel27
  - number: 27.1.b
    text: een militair die een officiersrang bekleedt;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel27
  - number: 27.1.c
    text: een lid van het Koninklijk Huis;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel27
  - number: 27.1.d
    text: een militair die behoort tot het Militaire Huis van Hare Majesteit de Koningin;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel27
  - number: 27.1.e
    text: een militair tot de rang van commandeur/brigade-generaal/commodore of tot een hogere rang.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel27
  - number: '27.2'
    text: |-
      De bevoegdheid tot de in het eerste lid, onderdeel *b*, bedoelde bevordering kan bij koninklijk besluit aan Onze
      Minister worden toegekend.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel27
  - number: '27.3'
    text: Bevordering van de overige militairen geschiedt door de bevelhebber.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel27
  - number: '27.4'
    text: |-
      Aan de militair die een functie is toegewezen waaraan een hogere rang is verbonden dan de rang die hij bekleedt,
      wordt op de datum van ingang van functievervulling die hogere rang toegekend. Het toekennen van die rang kan
      tevens, voor een korte periode van voorbereiding, daaraan voorafgaand geschieden.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel27
  - number: '27.5'
    text: |-
      In afwijking van het vierde lid kan aan de militair in bijzondere gevallen tijdelijk een hogere rang worden
      toegekend dan die welke hij bekleedt, indien het gewenste optreden van de betrokken militair daartoe noodzaakt en
      het optreden een wezenlijk onderdeel vormt van zijn functie. Wanneer de reden tot het toekennen van deze hogere
      rang vervalt, keert hij van rechtswege terug tot de rang of klasse die hij daarvoor bekleedde.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel27
  - number: '27.6'
    text: |-
      In afwijking van het vierde lid kan, indien de militair een functie wordt toegewezen in het kader van een
      vredesoperatie als bedoeld in [artikel 2, tweede lid, onderdeel c][ref1], de bij de functie behorende rang
      tijdelijk, voor de duur van de functievervulling, worden toegekend indien de militair niet voldoet aan de in
      [artikel 22][ref2] bedoelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003482#Artikel22
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '2'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0003482
        artikel: '22'
        hoofdstuk: '4'
  - number: '27.7'
    text: 'De navolgende bevorderingen kunnen geschieden in afwijking van het gestelde in het vierde lid:'
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel27
  - number: 27.7.a
    text: |-
      bij de zeemacht: de bevorderingen in de stand van matroos, en de bevordering van luitenant ter zee der 3e klasse
      tot luitenant ter zee der 2e klasse;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel27
  - number: 27.7.b
    text: |-
      bij de landmacht, de luchtmacht en de marechaussee: de bevordering van korporaal tot korporaal der 1e klasse,
      de bevordering van marechaussee tot marechaussee der 1e klasse, de bevordering van sergeant tot sergeant der 1e
      klasse, alsmede de bevordering van tweede-luitenant tot eerste-luitenant.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel27
  - number: '27.8'
    text: |-
      Indien een militair die een rang tijdelijk bekleedt, overlijdt, wordt hij geacht die tijdelijke rang effectief
      bekleed te hebben op het tijdstip van zijn overlijden.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel27
  - number: '28.1'
    text: |-
      In afwijking van artikel 27, derde en vierde lid, kan de militair die een initiële opleiding volgt en aan de eisen
      voldoet, bij afronding van delen van de opleiding door de bevelhebber worden bevorderd.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel28
  - number: '28.2'
    text: De bevelhebber kan aan de militair tijdens een opleiding een titulaire rang of tijdelijk een rang toekennen.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel28
  - number: '29'
    text: |-
      De militair bij de zeemacht die, anders dan bij wijze van initiële opleiding, een onderofficiersopleiding volgt,
      kan na afronding van die opleiding door de bevelhebber worden bevorderd tot korporaal.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel29
  - number: 29a.1
    text: |-
      Aan de militair bij de zeemacht, die op de dag voorafgaande aan de datum van inwerkingtreding van dit artikel
      de rang van korporaal bekleedt, zal, indien hij 12 jaar die rang heeft bekleed, bij voorrang een functie worden
      toegewezen waaraan de rang van sergeant is verbonden, voor zover een dergelijke functie beschikbaar is, met dien
      verstande dat een dergelijke functietoewijzing niet kan geschieden binnen een termijn van twee jaar voor de dag
      waarop hem ontslag als bedoeld in artikel 39a, onder a, zal worden verleend.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel29a
  - number: 29a.2
    text: |-
      Indien het niet mogelijk is om de militair, bedoeld in het eerste lid, een functie toe te wijzen waaraan de rang
      van sergeant is verbonden, wordt hij, op het moment dat hij de rang van korporaal 15 jaar heeft bekleed, bevorderd
      tot sergeant.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel29a
  - number: 29a.3
    text: |-
      De militair bij de zeemacht, die op de dag voorafgaande aan de inwerkingtreding van dit artikel de rang van
      korporaal bekleedt en aan wie twee jaar voor de dag waarop hem ontslag als bedoeld in artikel 39a, onder a, zal
      worden verleend, nog geen functie is of kan worden toegewezen waaraan de rang van sergeant is verbonden, wordt
      niettemin bevorderd tot sergeant.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel29a
  - number: 29a.4
    text: |-
      Om voor toewijzing van een functie waaraan de rang van sergeant is verbonden, als bedoeld in het eerste lid, dan
      wel voor een bevordering tot sergeant, als bedoeld in het tweede en derde lid, in aanmerking te komen dient de
      militair te voldoen aan de gestelde eisen, bedoeld in artikel 22.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel29a
  - number: '30.1'
    text: |-
      In bijzondere gevallen kan aan de militair een functie worden toegewezen waaraan een lagere rang is verbonden dan
      de rang die hij bekleedt.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel30
  - number: '30.2'
    text: |-
      De militair aan wie een functie wordt toegewezen waaraan een lagere dan de door hem beklede rang is verbonden,
      alsmede de militair die is aangewezen voor het volgen van een opleiding, behoudt zijn rang.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel30
  - number: '31'
    text: |-
      Aan de militair die is bevorderd, wordt als akte van bevordering een afschrift van of uittreksel uit het
      betreffende besluit uitgereikt. In de akte van een tijdelijke bevordering, als bedoeld in artikel 27, vijfde lid,
      worden de reden en het tijdelijk karakter van die bevordering uitdrukkelijk vermeld.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel31
  - number: '34.1'
    text: De schorsing van een militair in zijn ambt geschiedt door de commandant.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel34
  - number: '34.2'
    text: |-
      In afwijking van het eerste lid geschiedt de schorsing van een geestelijk verzorger en van een militair met de rang
      van commandeur/brigade-generaal/commodore of een hogere rang door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel34
  - number: '35.1'
    text: |-
      Een militair kan, onverminderd de overige tegen hem te nemen maatregelen, als maatregel van orde worden geschorst
      in zijn ambt, indien het belang van de dienst zulks nadrukkelijk vordert.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel35
  - number: '35.2'
    text: |-
      De schorsing wordt aan de militair onverwijld schriftelijk of mondeling bekend gemaakt. Een mondelinge bekendmaking
      wordt onverwijld schriftelijk bevestigd.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel35
  - number: '35.3'
    text: |-
      De schorsing gaat in op het tijdstip, waarop deze de betrokken militair bekend wordt gemaakt. Indien de militair
      zich gedurende een periode van zes dagen aan de mogelijkheid tot het ter kennis brengen van de schorsing heeft
      onttrokken, gaat de schorsing van rechtswege in op de zevende dag na die van dagtekening van het schorsingsbesluit.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel35
  - number: '37.1'
    text: |-
      De schorsing wordt opgeheven zodra het belang van de dienst zich niet langer verzet tegen het uitoefenen door de
      militair van zijn ambt. Indien de schorsing was bevolen door de commandant geschiedt de opheffing in elk geval na
      drie maanden tenzij de minister anders bepaalt.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel37
  - number: '37.2'
    text: |-
      De opheffing van de schorsing wordt de militair onverwijld schriftelijk of mondeling bekend gemaakt. Een mondelinge
      bekendmaking wordt onverwijld schriftelijk bevestigd.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel37
  - number: '38.1'
    text: Het verlenen van ontslag aan de militair met een officiersrang geschiedt bij koninklijk besluit.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel38
  - number: '38.2'
    text: |-
      Het verlenen van ontslag aan de militair met een rang beneden de rang van luitenant ter zee der 3e klasse/tweede-
      luitenant, of een stand, geschiedt door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel38
  - number: '39.1'
    text: |-
      Aan de militair kan ontslag op aanvraag worden verleend, indien hij daartoe aan het ingevolge artikel 38 bevoegde
      gezag schriftelijk de wens te kennen heeft gegeven.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel39
  - number: '39.2'
    text: 'Aan de militair kan verder uitsluitend ontslag worden verleend:'
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel39
  - number: 39.2.a
    text: ter zake van het bereiken of overschrijden van de leeftijd van 58 jaar;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel39
  - number: 39.2.b
    text: |-
      wanneer hij is aangesteld voor een bepaalde tijd, ter zake van het eindigen van de tijd waarvoor de aanstelling
      is geschied;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel39
  - number: 39.2.c
    text: |-
      wanneer zijn diensten door het ingevolge artikel 38 bevoegde gezag niet langer nodig worden geoordeeld, nadat hij
      ingevolge [artikel 8 van de Uitkeringswet gewezen militairen][ref1] weder is aangesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0002540#Artikel8
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0002540
        artikel: '8'
  - number: 39.2.d
    text: wegens overtolligheid indien er voor hem geen functie beschikbaar is, onverminderd het bepaalde in artikel 43;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel39
  - number: 39.2.e
    text: 'wanneer hij, bij ontslag uit een ambt, voor het bekleden waarvan hij op non-activiteit was gesteld:'
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel39
  - number: 39.2.e.1°
    text: |-
      het ingevolge artikel 38 bevoegde gezag niet doet blijken van zijn verlangen om in werkelijke dienst te worden
      gehandhaafd; dan wel
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel39
  - number: 39.2.e.2°
    text: |-
      ofschoon hij dat verlangen te kennen heeft gegeven, naar verwachting niet binnen twee jaren bij het krijgsmachtdeel
      waartoe hij behoort, of indien dat niet mogelijk is bij een ander krijgsmachtdeel, kan worden geplaatst;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel39
  - number: 39.2.f
    text: ter zake van blijvende ongeschiktheid voor het vervullen van de dienst uit hoofde van een ziekte of een gebrek;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel39
  - number: 39.2.g
    text: |-
      wanneer hij behoort tot de zeemacht en een officiersrang heeft, dan wel wanneer hij behoort tot de landmacht,
      luchtmacht of marechaussee - ongeacht welke rang hij heeft -, ter zake van het bereiken of overschrijden van de
      leeftijd van vijftig jaar, wanneer hij naar het oordeel van het ingevolge artikel 38 bevoegde gezag - in verband
      met zijn leeftijd voor het vervullen van de dienst niet meer ten volle geschikt is;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel39
  - number: 39.2.h
    text: |-
      wegens ontheffing van de initiële opleiding tot het volgen waarvan hij bij zijn aanstelling is aangewezen, om reden
      dat hij niet voldoet aan de bij die opleiding gestelde eisen;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel39
  - number: 39.2.j
    text: |-
      wegens onbekwaamheid of ongeschiktheid voor de vervulling van zijn functie of voor de vervulling van functies
      binnen de groepen van functies, waarvoor hij is bestemd, wat de ongeschiktheid betreft, voor zover het bepaalde
      onder *f* of *g* niet toepasselijk is; een en ander onverminderd het bepaalde in artikel 43, eerste lid;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel39
  - number: 39.2.k
    text: wegens verregaande nalatigheid in de vervulling van zijn plichten;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel39
  - number: 39.2.l
    text: |-
      wegens wangedrag in de dienst, dan wel buiten de dienst voor zover dit gedrag schadelijk is of kan zijn voor zijn
      dienstvervulling of niet in overeenstemming is met het aanzien van zijn ambt;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel39
  - number: 39.2.m
    text: |-
      wegens een vonnis dat in kracht van gewijsde is gegaan en is gewezen in verband met een feit van zodanige aard,
      dat, mede gelet op het algemeen gedrag van de militair, diens ontslag in het belang van de dienst noodzakelijk is;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel39
  - number: 39.2.n
    text: |-
      ter zake van misleiding bij zijn indiensttreding indien blijkt dat hij bij zijn aanmelding onjuiste gegevens heeft
      verstrekt of omstandigheden heeft verzwegen en de juiste gegevens of de verzwegen omstandigheden de aanstelling
      zouden hebben belet, tenzij de militair aannemelijk maakt dat hij te goeder trouw heeft gehandeld.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel39
  - number: '39.3'
    text: |-
      Aan de militair die behoort tot het reserve-personeel kan voorts ontslag worden verleend ter zake van een
      aanstelling in een betrekking, die krachtens enig wettelijk voorschrift onverenigbaar is met de militaire dienst.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel39
  - number: '39.4'
    text: |-
      Aan de militair die is aangesteld bij het reserve-personeel op grond van zijn burgerlijke betrekking kan voorts nog
      ontslag worden verleend ter zake van beëindiging van die burgerlijke betrekking.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel39
  - number: '39.5'
    text: |-
      Aan de militair die behoort tot het reserve-personeel op grond van [artikel 67 van de Kaderwet dienstplicht][ref1]
      kan voorts nog ontslag worden verleend:


      [ref1]: https://wetten.overheid.nl/BWBR0008589#Artikel67
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0008589
        artikel: '67'
  - number: 39.5.a
    text: ter zake van het eindigen van zijn dienstplicht;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel39
  - number: 39.5.b
    text: |-
      ter zake van het eindigen van zijn dienstverhouding bij het reserve-personeel, indien het ingevolge artikel 38
      bevoegde gezag handhaving van die dienstverhouding niet langer nodig oordeelt.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel39
  - number: 39.6.a
    text: |-
      Aan de militair behorend tot het beroepspersoneel die de rang van commandeur, brigade-generaal of commodore
      bekleedt, of die een hogere rang bekleedt, kan voorts ontslag worden verleend.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel39
  - number: 39.6.a.1°
    text: |-
      op voordracht van Onze minister-president en Onze Minister, wanneer het belang van de dienst dit noodzakelijk
      maakt;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel39
  - number: 39.6.a.2°
    text: op andere gronden;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel39
  - number: 39.6.b
    text: |-
      In deze gevallen wordt bij koninklijk besluit - in het geval bedoeld onder *a*, ten eerste, op de gezamenlijke
      voordracht van Onze minister-president en van Onze Minister - een regeling getroffen waarbij aan de betrokkene een
      uitkering wordt toegekend welke met het oog op de omstandigheden redelijk is te achten. Die regeling zal in geen
      geval nadeliger mogen zijn dan die volgens welke de uitkering ingevolge de [Uitkeringswet gewezen militairen][ref1]
      zou zijn toegekend, waarop de betrokken militair aanspraak zou hebben kunnen maken, indien hem, in plaats van
      vorenbedoeld ontslag, op grond van het tweede lid onder *a*, ontslag zou zijn verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0002540
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0002540
  - number: '39.7'
    text: |-
      Aan de militair voor wie na de aanstelling een proeftijd geldt, kan tijdens die proeftijd ontslag worden verleend
      zonder toepassing van één van de in het tweede lid genoemde ontslaggronden.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel39
  - number: 39a
    text: |-
      In afwijking van artikel 39, tweede lid, onder a, kan aan de militair die vóór 1 januari 2002 voor onbepaalde
      tijd is aangesteld bij het beroepspersoneel, ontslag worden verleend wegens het bereiken of overschrijden van de
      volgende ontslagleeftijd:
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel39a
  - number: 39a.a
    text: |-
      Voor de militair van de zeemacht zonder rang, of die een rang bekleedt lager dan luitenant ter zee der derde
      klasse, die de leeftijd van vijftig jaar bereikt:
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel39a
  - number: 39a.a.1°
    text: 'in het jaar 2002, 2003, 2004, of 2005: vijftig jaar;'
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel39a
  - number: 39a.a.2°
    text: 'in het jaar 2006: vijftig jaar en drie maanden;'
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel39a
  - number: 39a.a.3°
    text: 'in het jaar 2007: vijftig jaar en zes maanden;'
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel39a
  - number: 39a.a.4°
    text: 'in het jaar 2008: vijftig jaar en negen maanden;'
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel39a
  - number: 39a.a.5°
    text: 'in het jaar 2009: eenenvijftig jaar;'
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel39a
  - number: 39a.a.6°
    text: 'in het jaar 2010: eenenvijftig jaar en drie maanden;'
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel39a
  - number: 39a.a.7°
    text: 'in het jaar 2011: eenenvijftig jaar en zes maanden;'
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel39a
  - number: 39a.a.8°
    text: 'in het jaar 2012: tweeënvijftig jaar;'
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel39a
  - number: 39a.a.9°
    text: 'in het jaar 2013: tweeënvijftig jaar en zes maanden;'
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel39a
  - number: 39a.a.10°
    text: 'na 1 januari 2014: drieënvijftig jaar;'
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel39a
  - number: 39a.b
    text: |-
      Voor de militair van de zeemacht, die de rang bekleedt van luitenant ter zee der derde klasse, luitenant ter zee
      der tweede klasse of luitenant ter zee der tweede klasse oudste categorie, die de leeftijd van tweeënvijftig jaar
      bereikt:
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel39a
  - number: 39a.b.1°
    text: 'in het jaar 2002, 2003, 2004 of 2005: tweeënvijftig jaar;'
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel39a
  - number: 39a.b.2°
    text: 'in het jaar 2006 : tweeënvijftig jaar en drie maanden;'
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel39a
  - number: 39a.b.3°
    text: 'in het jaar 2007: tweeënvijftig jaar en zes maanden;'
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel39a
  - number: 39a.b.4°
    text: 'in het jaar 2008: tweeënvijftig jaar en negen maanden;'
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel39a
  - number: 39a.b.5°
    text: 'in het jaar 2009: drieënvijftig jaar;'
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel39a
  - number: 39a.b.6°
    text: 'in het jaar 2010: drieënvijftig jaar en drie maanden;'
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel39a
  - number: 39a.b.7°
    text: 'in het jaar 2011: drieënvijftig jaar en zes maanden;'
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel39a
  - number: 39a.b.8°
    text: 'in het jaar 2012: vierenvijftig jaar;'
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel39a
  - number: 39a.b.9°
    text: 'in het jaar 2013: vierenvijftig jaar en zes maanden;'
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel39a
  - number: 39a.b.10°
    text: 'na 1 januari 2014: vijfenvijftig jaar;'
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel39a
  - number: 39a.c
    text: 'Voor de militair van de zeemacht die de rang bekleedt van luitenant ter zee der eerste klasse, of een hogere rang:'
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel39a
  - number: 39a.c.1°
    text: 'van 1 januari 2002 tot en met 30 juni 2002: drieënvijftig jaar en zes maanden;'
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel39a
  - number: 39a.c.2°
    text: 'van 1 juli 2002 tot en met 30 juni 2003: drieënvijftig jaar en negen maanden;'
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel39a
  - number: 39a.c.3°
    text: 'van 1 juli 2003 tot en met 30 juni 2005: vierenvijftig jaar;'
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel39a
  - number: 39a.c.4°
    text: 'van 1 juli 2005 tot en met 30 juni 2006: vierenvijftig jaar en drie maanden;'
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel39a
  - number: 39a.c.5°
    text: 'van 1 juli 2006 tot en met 30 juni 2007: vierenvijftig jaar en zes maanden;'
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel39a
  - number: 39a.c.6°
    text: 'van 1 juli 2007 tot en met 30 juni 2008: vierenvijftig jaar en negen maanden;'
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel39a
  - number: 39a.c.7°
    text: 'van 1 juli 2008 tot en met 31 december 2008: vijfenvijftig jaar;'
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel39a
  - number: 39a.d
    text: |-
      Voor de militair van de zeemacht die de rang bekleedt van luitenant ter zee der eerste klasse, of een hogere rang,
      die de leeftijd van vijfenvijftig jaar bereikt:
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel39a
  - number: 39a.d.1°
    text: 'in het jaar 2009: vijfenvijftig jaar en drie maanden;'
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel39a
  - number: 39a.d.2°
    text: 'in het jaar 2010: vijfenvijftig jaar en zes maanden;'
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel39a
  - number: 39a.d.3°
    text: 'in het jaar 2011: vijfenvijftig jaar en negen maanden;'
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel39a
  - number: 39a.d.4°
    text: 'in het jaar 2012: zesenvijftig jaar;'
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel39a
  - number: 39a.d.5°
    text: 'in het jaar 2013: zesenvijftig jaar en drie maanden;'
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel39a
  - number: 39a.d.6°
    text: 'in het jaar 2014: zesenvijftig jaar en zes maanden;'
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel39a
  - number: 39a.d.7°
    text: 'in het jaar 2015: zevenenvijftig jaar;'
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel39a
  - number: 39a.d.8°
    text: 'in het jaar 2016: zevenenvijftig jaar en zes maanden;'
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel39a
  - number: 39a.e
    text: 'Voor de overige militairen, die de leeftijd van vijfenvijftig jaar bereiken:'
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel39a
  - number: 39a.e.1°
    text: 'in het jaar 2002, 2003, 2004, of 2005: vijfenvijftig jaar;'
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel39a
  - number: 39a.e.2°
    text: 'in het jaar 2006: vijfenvijftig jaar en drie maanden;'
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel39a
  - number: 39a.e.3°
    text: 'in het jaar 2007: vijfenvijftig jaar en zes maanden;'
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel39a
  - number: 39a.e.4°
    text: 'in het jaar 2008: vijfenvijftig jaar en negen maanden;'
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel39a
  - number: 39a.e.5°
    text: 'in het jaar 2009: zesenvijftig jaar;'
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel39a
  - number: 39a.e.6°
    text: 'in het jaar 2010: zesenvijftig jaar en drie maanden;'
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel39a
  - number: 39a.e.7°
    text: 'in het jaar 2011: zesenvijftig jaar en zes maanden;'
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel39a
  - number: 39a.e.8°
    text: 'in het jaar 2012: zevenenvijftig jaar;'
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel39a
  - number: 39a.e.9°
    text: 'in het jaar 2013: zevenenvijftig jaar en zes maanden.'
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel39a
  - number: '40'
    text: |-
      Aan de militair die behoort tot het beroepspersoneel en die een benoeming tot minister of staatssecretaris
      aanvaardt, wordt ontslag verleend.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel40
  - number: '41'
    text: |-
      Het ontslag wordt "eervol" verleend, behoudens in de gevallen, genoemd in artikel 39, tweede lid, aanhef en onder
      k, l, m en n, in welke gevallen het ontslag zonder die aanduiding wordt verleend.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel41
  - number: '42.1'
    text: 'Een aanvraag van de militair om ontslag uit de dienst kan uitsluitend worden afgewezen:'
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel42
  - number: 42.1.a
    text: in geval van buitengewone omstandigheden;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel42
  - number: 42.1.b
    text: |-
      gedurende de tijd dat hij is ingedeeld bij een gedeelte van de krijgsmacht, waaraan de bekendmaking, bedoeld in
      [artikel 71 van het Wetboek van Militair Strafrecht][ref1] is gedaan;


      [ref1]: https://wetten.overheid.nl/BWBR0001869#Artikel71
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0001869
        artikel: '71'
  - number: 42.1.c
    text: |-
      gedurende de tijd waarin naar het oordeel van Onze Minister, in overeenstemming met het gevoelen van de Raad van
      Ministers, het landsbelang wegens bijzondere omstandigheden vordert dat het ontslag niet wordt verleend;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel42
  - number: 42.1.d
    text: indien op hem nog de verplichting rust om deel uit te maken van het beroeps- of het reserve-personeel;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel42
  - number: 42.1.e
    text: |-
      indien dit nodig is voor het onderzoek omtrent een strafbaar feit waarvan hij wordt verdacht, dan wel indien
      hij strafrechtelijk wordt vervolgd of een naar aanleiding van zodanige vervolging tegen hem gewezen rechterlijke
      uitspraak nog niet in kracht van gewijsde is gegaan;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel42
  - number: 42.1.f
    text: |-
      indien Onze Minister besloten heeft hem in aanmerking te brengen voor ontslag om een van de redenen, genoemd in
      artikel 39, tweede lid, aanhef en onder *k*, *l*, *m* en *n*, of het nemen van zodanig besluit overweegt.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel42
  - number: '42.2'
    text: |-
      Het eerste lid is niet van toepassing op de militair voor wie na de datum van ingang van de aanstelling een
      proeftijd geldt, gedurende die proeftijd.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel42
  - number: '43.1'
    text: |-
      Ontslag van een voor onbepaalde tijd aangestelde militair om de reden, genoemd in artikel 39, tweede lid, aanhef en
      onder *d* of *j* kan slechts plaatsvinden indien het naar het oordeel van de minister na een zorgvuldig onderzoek
      niet mogelijk is gebleken de militair binnen zijn krijgsmachtdeel, of indien dit niet mogelijk is bij een ander
      krijgsmachtdeel, een andere, mede in verband met zijn persoonlijkheid en omstandigheden passende, functie toe te
      wijzen, dan wel indien hij een zodanige functie weigert te aanvaarden. In het onderzoek wordt de mogelijkheid tot
      bij- of omscholing van de militair betrokken.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel43
  - number: '43.2'
    text: |-
      Indien meerdere functies worden opgeheven in verband met een reorganisatie of een wijziging van de
      personeelssamenstelling van een krijgsmachtdeel, vindt ontslag wegens overtolligheid plaats naar een vooraf
      vastgesteld en bekendgemaakt plan.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel43
  - number: '44'
    text: |-
      Ontslag om de reden, genoemd in artikel 39, tweede lid onder *f*, wordt pas verleend,
      nadat de militair ter zake van het ontstaan, de aard en de gevolgen van zijn ziekte of
      gebrek is onderworpen aan een geneeskundig onderzoek naar de regelen, gesteld bij het
      [Besluit procedure geneeskundig onderzoek blijvende dienstongeschiktheid en pensioenkeuring militairen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008475
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0008475
  - number: '45.1'
    text: |-
      Ontslag om de reden als bedoeld in [artikel 12g, tweede lid, van de Militaire ambtenarenwet 1931][ref1],
      kan slechts plaatsvinden met medewerking van Onze Minister-President dan wel, indien het de militair met een
      officiersrang betreft, op voordracht van Onze Minister-President en Onze Minister. Daaraan voorafgaand wordt het
      advies ingewonnen van een commissie, bestaande uit vijf leden en vijf plaatsvervangende leden.


      [ref1]: https://wetten.overheid.nl/BWBR0001952#Artikel12g
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0001952
        artikel: 12g
  - number: '45.2'
    text: |-
      De leden en de plaatsvervangende leden van de commissie, bedoeld in het eerste lid worden bij koninklijk besluit
      benoemd op voordracht van Onze Minister-President en van Onze Minister. De taak, samenstelling en werkwijze van de
      commissie worden bij de instelling geregeld.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel45
  - number: '47.1'
    text: Ontslag wordt in het algemeen verleend met ingang van de eerste dag van een kalendermaand.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel47
  - number: '47.2'
    text: |-
      Een ontslag op aanvraag anders dan tijdens de proeftijd en een ontslag om een van de redenen, genoemd in artikel
      39, tweede lid onder c, d, e, f, g, en j, gaan niet eerder in dan nadat ten minste drie maanden zijn verstreken
      sedert het tijdstip waarop het aanvraag om ontslag is ingediend onderscheidenlijk de militair van de beslissing tot
      ontslagverlening schriftelijk in kennis is gesteld.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel47
  - number: '47.3'
    text: |-
      Een ontslag op aanvraag tijdens de proeftijd en de ontslagen, bedoeld in artikel 39, tweede lid onder *h*,
      en zevende lid, gaan niet eerder in dan nadat ten minste een maand is verstreken sedert het tijdstip waarop
      het aanvraag om ontslag is ingediend of de militair van de beslissing onderscheidenlijk het voorstel tot
      ontslagverlening schriftelijk in kennis is gesteld.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel47
  - number: '47.4'
    text: De in het tweede en derde lid genoemde termijnen kunnen op verzoek van de militair worden bekort.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel47
  - number: '47.5'
    text: |-
      De ingangsdatum van reeds verleend ontslag kan worden opgeschort indien en voor zolang zich één van de
      omstandigheden voordoet, bedoeld in artikel 42, eerste lid, onder a, b, c en e, alsmede indien zich een
      omstandigheid voordoet die naar het oordeel van het ingevolge artikel 38 bevoegde gezag grond oplevert voor ontslag
      om één van de redenen, genoemd in artikel 39, tweede lid onder k, l, m of n.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel47
  - number: '47.6'
    text: |-
      Een ontslag ten gevolge van het aanvaarden van het ambt van minister of staatssecretaris, als bedoeld in artikel
      40, gaat in op de dag van aanvaarding van dit ambt.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel47
  - number: '48'
    text: |-
      Ontslag dat is verleend om een andere reden dan genoemd in artikel 39, tweede lid onder k, l, m of n, en dat nog
      niet is ingegaan, wordt ingetrokken, indien zich inmiddels een omstandigheid heeft voorgedaan die het ingevolge
      artikel 38 bevoegde gezag aanleiding geeft de militair te ontslaan om één van de redenen, genoemd in artikel 39,
      tweede lid onder k, l, m of n.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel48
  - number: '49.1'
    text: |-
      In afwijking van artikel 47, tweede lid, kan het tijdstip van ingang van een ontslag-op-aanvraag van de militair
      die om redenen van dienst buiten Nederland verblijft, worden uitgesteld voor de tijd die onvermijdelijk nodig is om
      hem aldaar te vervangen, maar voor ten hoogste drie maanden.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel49
  - number: '49.2'
    text: |-
      Het ontslag van de militair die om redenen van dienst buiten Nederland verblijft, gaat eerst in op een datum
      gelegen na het tijdstip van zijn terugkeer in Nederland.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel49
  - number: '49.3'
    text: |-
      Van het tweede lid kan worden afgeweken, indien de militair zulks aanvraagt en het dienstbelang zich naar het
      oordeel van het ingevolge artikel 38 bevoegde gezag niet verzet tegen inwilliging van het aanvraag, of indien de
      terugkeer niet tijdig plaatsvindt ten gevolge van omstandigheden die zijn te wijten aan de schuld of het toedoen
      van de militair.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel49
  - number: '51.1'
    text: |-
      Aan de militair aan wie ontslag wordt verleend nadat hij ten minste één jaar in werkelijke dienst is geweest, wordt
      op zijn verzoek de bevelhebber een getuigschrift uitgereikt.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel51
  - number: '51.2'
    text: 'Het getuigschrift vermeldt:'
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel51
  - number: 51.2.a
    text: de begindatum en einddatum van de dienstverhouding, alsmede de arbeidsduur per week;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel51
  - number: 51.2.b
    text: de aard van de verrichte werkzaamheden;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel51
  - number: 51.2.c
    text: de wijze waarop de militair zijn werkzaamheden heeft verricht;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel51
  - number: 51.2.d
    text: de grond waarop aan de militair ontslag is verleend.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel51
  - number: '51.3'
    text: |-
      De in lid 2, onderdelen c en d, genoemde gegevens worden slechts op verzoek van de militair in het getuigschrift
      vermeld.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel51
  - number: '53'
    text: 'De militair is van rechtswege ontslagen:'
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel53
  - number: 53.a
    text: zodra hij het Nederlanderschap verliest;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel53
  - number: 53.b
    text: |-
      zodra een tegen hem gewezen vonnis waarbij de bijkomende straf van ontzetting van het recht om bij de gewapende
      macht te dienen is opgelegd zonder dat daarbij is bepaald dat deze straf geheel of gedeeltelijk niet ten uitvoer
      zal worden gelegd, in kracht van gewijsde is gegaan.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel53
  - number: 54a
    text: 'In dit hoofdstuk wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel54a
  - number: 54a.a
    text: 'militair: de militair in werkelijke dienst;'
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel54a
  - number: 54a.b
    text: |-
      diensten: activiteiten die zijn vereist voor het functioneren van de militaire organisatie, voor zover deze zijn
      ingesteld door de bevelhebber, de secretaris-generaal of de commandant van het Defensie Interservice Commando;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel54a
  - number: 54a.c
    text: |-
      werkzaamheden: activiteiten die voortvloeien uit de door de militair vervulde functie, alsmede andere opgedragen
      activiteiten die om redenen van dienst of in het algemeen belang noodzakelijk zijn, doch die niet kunnen worden
      aangemerkt als diensten;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel54a
  - number: 54a.d
    text: |-
      werktijd: het totaal van de in kloktijden aangegeven perioden gedurende welke een militair de hem opgedragen
      werkzaamheden of diensten moet verrichten;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel54a
  - number: 54a.e
    text: |-
      rooster: een voor een periode van tenminste een week opgesteld en van tevoren schriftelijk bekendgemaakt schema van
      aanvang en einde van de dagelijkse werk- en rusttijden, eventueel afzonderlijk vastgesteld voor werkzaamheden en
      voor diensten;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel54a
  - number: 54a.f
    text: |-
      arbeidsduur: de tijdsduur, uitgedrukt in een aantal uren per dag of per week, gedurende welke een militair
      werkzaamheden of diensten verricht;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel54a
  - number: 54a.g
    text: 'nachtdienst: een werkdag waarin de uren tussen 00.00 uur en 06.00 uur geheel of gedeeltelijk zijn begrepen;'
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel54a
  - number: 54a.h
    text: |-
      werkdag: een aaneengesloten tijdruimte waarin werkzaamheden of diensten worden verricht en die is gelegen tussen
      twee voorgeschreven opeenvolgende onafgebroken rusttijden;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel54a
  - number: 54a.i
    text: |-
      pauze: een tijdruimte van ten minste 15 achtereenvolgende minuten, waarmee de werkzaamheden of diensten tijdens de
      werkdag worden onderbroken en de militair geen enkele verplichting heeft ten aanzien van de bedongen werkzaamheden
      of diensten;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel54a
  - number: 54a.j
    text: |-
      consignatie: een tijdruimte tussen twee elkaar opeenvolgende werkdagen of tijdens een pauze, waarin die militair
      uitsluitend verplicht is bereikbaar te zijn om in geval van onvoorziene omstandigheden op oproep zo spoedig
      mogelijk de bedongen werkzaamheden of diensten te verrichten;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel54a
  - number: 54a.k
    text: |-
      aanwezigheidsdienst: een aaneengesloten tijdruimte van ten hoogste 24 uren, waarin de militair, zo nodig naast het
      verrichten van de bedongen werkzaamheden of diensten, consignatie wordt opgelegd waarbij die militair verplicht
      is op de werkplek aanwezig te zijn om op oproep zo spoedig mogelijk de bedongen werkzaamheden of diensten te
      verrichten;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel54a
  - number: 54a.l
    text: |-
      piket: een periode waarin de militair, zo nodig naast het verrichten van de bedongen werkzaamheden of diensten,
      consignatie wordt opgelegd waarbij de militair verplicht is om in verband met zijn bereikbaarheid op de werkplek
      aanwezig te zijn;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel54a
  - number: 54a.m
    text: |-
      oefening: elk door defensiepersoneel in de praktijk brengen van onderwezen bekwaamheden teneinde aldus de
      bedrevenheid in het uitvoeren van aan de krijgsmacht opgedragen operationele taken te verwerven, te vergroten of
      te onderhouden.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel54a
  - number: 54b.1
    text: De militair verricht de hem opgedragen werkzaamheden of diensten in beginsel gedurende vastgestelde werktijden.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel54b
  - number: 54b.2
    text: |-
      De werk- en rusttijden van de militair worden met inachtneming van de bepalingen in dit hoofdstuk, en nadat
      hierover overeenkomstig het [Besluit medezeggenschap defensie][ref1] overeenstemming is bereikt met de betrokken
      medezeggenschapscommissie, vastgesteld door de commandant en schriftelijk vastgelegd in roosters.


      [ref1]: https://wetten.overheid.nl/BWBR0010617
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel54b
    references:
      - id: ref1
        bwb_id: BWBR0010617
  - number: 54b.3
    text: De werktijd dient zoveel mogelijk te zijn gelegen tussen 07.00 en 18.00 uur.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel54b
  - number: 54b.4
    text: |-
      De arbeidsduur bedraagt gerekend over de periode waarvoor het rooster is vastgesteld ten hoogste gemiddeld 38 uren
      per week. Hiervan kan worden afgeweken ter zake van het verrichten van diensten.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel54b
  - number: 54b.5
    text: |-
      Door Onze Minister kunnen functies worden aangewezen waarbij het reizen, naar en vanaf de plaats waar de militair
      werkzaamheden of diensten moet verrichten, een wezenlijk bestanddeel uitmaakt van de functie. Bij die functies
      wordt de reisduur buiten de voor de militair geldende werktijd als arbeidsduur aangemerkt.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel54b
  - number: 54c.1
    text: |-
      De commandant die een rooster vaststelt of opnieuw vaststelt, maakt het rooster ten minste 28 dagen vóór de datum
      van inwerkingtreding bekend aan de militair.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel54c
  - number: 54c.2
    text: |-
      Indien de aard van de werkzaamheden of diensten toepassing van het eerste lid onmogelijk maakt, stelt de commandant
      ten minste 28 dagen van tevoren aan de militair bekend op welke dag de rusttijd, bedoeld in de artikelen 56e en
      57a, eerste lid, aanvangt. Tevens maakt hij aan de militair ten minste 4 dagen van tevoren de tijdstippen bekend
      waarop hij werkzaamheden of diensten moet verrichten.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel54c
  - number: 54c.3
    text: |-
      De commandant dient overeenstemming te bereiken met de betrokken medezeggenschapscommissie, indien het dienstbelang
      het noodzakelijk maakt af te wijken van het eerste of tweede lid.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel54c
  - number: 54d.1
    text: |-
      De militair die voor onbepaalde tijd is aangesteld bij het beroepspersoneel, alsmede de militair die voor bepaalde
      tijd is aangesteld bij het beroepspersoneel en de leeftijd van dertig jaar heeft bereikt, en van wie het rooster
      is gebaseerd op een arbeidsduur van gemiddeld 38 uur per week, kan bij de commandant een aanvraag indienen om zijn
      arbeidsduur tijdelijk gedurende een kalenderjaar met 2 uren per week te verlengen.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel54d
  - number: 54d.2
    text: |-
      Een aanvraag als bedoeld in het eerste lid wordt vóór 1 oktober voorafgaande aan het desbetreffende kalenderjaar
      ingediend bij de commandant.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel54d
  - number: 54d.3
    text: |-
      De commandant wijst een aanvraag als bedoeld in het eerste en het vierde lid toe, tenzij het dienstbelang zich
      daartegen verzet. In ieder geval wordt de aanvraag afgewezen indien de tijdelijke verlenging van de arbeidsduur
      geen effect heeft op de formatie, onder door de bevelhebber, de commandant Defensie Interservice Commando of de
      secretaris-generaal voor hun ressort nader vast te stellen voorwaarden.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel54d
  - number: 54d.4
    text: |-
      Indien de militair een andere functie wordt toegewezen vervalt met ingang van de datum waarop hij de nieuwe functie
      gaat vervullen de toewijzing bedoeld in het derde lid. In afwijking van de datum genoemd in het tweede lid kan de
      militair bij zijn nieuwe commandant een aanvraag als bedoeld in het eerste lid indienen. Bij toewijzing geldt de
      verlenging van de arbeidsduur voor het resterende gedeelte van het lopende kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel54d
  - number: 54d.5
    text: |-
      Voor het deel dat de arbeidsduur wordt verlengd ontvangt de militair een maandelijkse toeslag. Deze toeslag
      bedraagt 12 maal 1/165 deel van het voor de betrokken militair geldende maandsalaris.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel54d
  - number: 54e.1
    text: |-
      De militair die voor onbepaalde tijd is aangesteld bij het beroepspersoneel, alsmede de militair die voor bepaalde
      tijd is aangesteld bij het beroepspersoneel en de leeftijd van dertig jaar heeft bereikt, en van wie het rooster
      is gebaseerd op een arbeidsduur van gemiddeld 38 uur per week, kan bij de commandant een aanvraag indienen om zijn
      arbeidsduur tijdelijk gedurende een kalenderjaar met 2 uren per week te verkorten.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel54e
  - number: 54e.2
    text: De in het eerste lid bedoelde verkorting van de arbeidsduur wordt toegekend in de vorm van 8 spaaruren per maand.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel54e
  - number: 54e.3
    text: |-
      Een aanvraag als bedoeld in het eerste lid wordt vóór 1 oktober voorafgaande aan het desbetreffende kalenderjaar
      ingediend bij de commandant.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel54e
  - number: 54e.4
    text: De commandant wijst een aanvraag als bedoeld in het eerste en zesde lid toe.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel54e
  - number: 54e.5
    text: |-
      In afwijking van het tweede en vierde lid kan de commandant in uitzonderlijke gevallen op aanvraag van de militair
      de in het eerste lid bedoelde verkorting van de arbeidsduur verwerken in het voor de betrokken militair geldende
      rooster, tenzij het dienstbelang zich daartegen verzet.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel54e
  - number: 54e.6
    text: |-
      Indien de militair een andere functie wordt toegewezen vervalt met ingang van de datum van plaatsing de toewijzing
      bedoeld in het vierde dan wel het vijfde lid. In afwijking van de datum genoemd in het derde lid kan de militair
      bij zijn nieuwe commandant voor het resterende gedeelte van het lopende kalenderjaar een aanvraag als bedoeld in
      het eerste lid indienen.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel54e
  - number: 54e.7
    text: |-
      Voor het deel dat de arbeidsduur wordt verkort, wordt maandelijks een inhouding op de inkomsten van de militair
      toegepast. Deze inhouding bedraagt 2 maal 1/165 deel van het voor de betrokken militair geldende maandsalaris.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel54e
  - number: 54f.1
    text: |-
      De spaaruren, bedoeld in artikel 54e, tweede lid, worden geheel of gedeeltelijk in een aaneengesloten periode van
      ten minste 288 spaaruren en ten hoogste 960 spaaruren opgenomen.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel54f
  - number: 54f.2
    text: |-
      De spaaruren worden in beginsel opgenomen bij functiewisseling, voorafgaand aan de datum van plaatsing op de nieuwe
      functie.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel54f
  - number: 54f.3
    text: |-
      In afwijking van het tweede lid kan de opname van spaaruren gedurende de functievervulling worden toegestaan,
      tenzij het dienstbelang zich hiertegen verzet.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel54f
  - number: 54f.4
    text: |-
      Indien de militair wordt verplaatst kan de bevelhebber op aanvraag van de militair afwijken van het gestelde in het
      eerste lid dat de spaaruren in een aaneengesloten periode van ten minste 288 spaaruren worden opgenomen. Indien met
      een dergelijke aanvraag wordt ingestemd, dan wordt het gehele tegoed aan spaaruren opgenomen bij functiewisseling,
      voorafgaand aan de datum van plaatsing op de nieuwe functie.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel54f
  - number: 54f.5
    text: |-
      Een aanvraag voor de opname van spaaruren wordt ten minste 6 maanden voorafgaande aan de gewenste datum van aanvang
      van de opnameperiode, ingediend bij de bevelhebber.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel54f
  - number: 54f.6
    text: |-
      De in een kalenderjaar opgebouwde spaaruren vervallen na een periode van 10 kalenderjaren, te rekenen vanaf de dag
      van aanvang van het daarop volgende kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel54f
  - number: 54f.7
    text: |-
      Indien vanwege dienstbelang dan wel persoonlijke omstandigheden de militair gedurende de periode van 10 jaar
      bedoeld in het zesde lid niet in de gelegenheid is gesteld de spaaruren op te nemen, maakt de bevelhebber in
      afwijking van het zesde lid met de militair afspraken over de opname van de spaaruren binnen de 2 daaropvolgende
      kalenderjaren.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel54f
  - number: 54f.8
    text: Ten aanzien van de opname van spaaruren zijn de artikelen 64, 65, 66 en 67 van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel54f
  - number: 54g
    text: |-
      Indien de militair op de datum dat hij de werkelijke dienst verlaat nog een tegoed aan spaaruren heeft, dan wordt
      voor elk spaaruur een vergoeding toegekend van 1/165 deel van het voor de betrokken militair geldende maandsalaris,
      zoals dit gold direct voorafgaande aan het verlaten van de werkelijke dienst.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel54g
  - number: 54h.1
    text: |-
      De commandant voert een deugdelijke registratie ter zake van de werk- en rusttijden en de realisatie daarvan, welke
      het toezicht op de naleving van de bepalingen in dit hoofdstuk mogelijk maakt.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel54h
  - number: 54h.2
    text: |-
      De in het eerste lid bedoelde gegevens en bescheiden worden ten minste 52 weken, gerekend vanaf de datum waarop de
      desbetreffende gegevens en bescheiden betrekking hebben, bewaard.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel54h
  - number: 54i
    text: |-
      Voor de toepassing van de bepalingen in dit hoofdstuk, ten aanzien van de arbeidsduur, wordt voor het bepalen
      van het aantal uren dat werkzaamheden of diensten worden verricht, meegeteld de uren waarop de militair de
      werkzaamheden of diensten zou hebben verricht, maar deze uren in het kader van de medezeggenschap als bedoeld in
      [artikel 17 van het Besluit medezeggenschap defensie][ref1], ziekte, verlof als bedoeld in artikel 61, tweede lid,
      met uitzondering van buitengewoon verlof in verband met deeltijdarbeid, of de vervulling van door wet of overheid
      opgelegde verplichting welke niet in zijn vrije tijd kon geschieden, niet heeft verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0010617#Artikel17
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel54i
    references:
      - id: ref1
        bwb_id: BWBR0010617
        artikel: '17'
  - number: 54j
    text: |-
      Voor de toepassing van de bepalingen in dit hoofdstuk ten aanzien van de zondag, vindt voor de militair, die in
      verband met zijn godsdienstige of levensbeschouwelijke opvatting, de wekelijkse rustdag op een andere dag dan de
      zondag viert, overeenkomstige toepassing ten aanzien van die dag in plaats van ten aanzien van de zondag, indien
      die militair dit schriftelijk verzoekt.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel54j
  - number: 54k.1
    text: |-
      Indien uit arbeidsgezondheidskundig onderzoek blijkt, dat de gezondheidsproblemen van een militair voortvloeien uit
      het verrichten van nachtdiensten, dan worden de werkzaamheden of diensten van die militair binnen redelijke termijn
      zodanig ingericht, dat hij werkzaamheden of diensten verricht anders dan in nachtdienst.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel54k
  - number: 54k.2
    text: |-
      De commandant voldoet aan de voor hem uit het eerste lid voortvloeiende verplichting, tenzij hij aannemelijk maakt
      dat dit redelijkerwijs niet van hem kan worden gevergd.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel54k
  - number: 55a.1
    text: |-
      Dit hoofdstuk en de daarop berustende bepalingen zijn, met uitzondering van paragraaf 12, niet van toepassing op
      werkzaamheden of diensten verricht:
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel55a
  - number: 55a.1.a
    text: |-
      ten tijde van buitengewone omstandigheden, alsmede ten aanzien van een onderdeel van de krijgsmacht, waaraan de
      mededeling bedoeld in [artikel 71 van het Wetboek van Militair Strafrecht][ref1] is gedaan;


      [ref1]: https://wetten.overheid.nl/BWBR0001869#Artikel71
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel55a
    references:
      - id: ref1
        bwb_id: BWBR0001869
        artikel: '71'
  - number: 55a.1.b
    text: |-
      ter uitvoering van bij wet of daarop berustende bepalingen opgedragen taken, voor zover de toepassing van dit
      hoofdstuk en de daarop berustende bepalingen een goede taakuitoefening belemmert;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel55a
  - number: 55a.1.c
    text: in door Onze Minister te bepalen andere gevallen waarin onderdelen van de krijgsmacht worden ingezet;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel55a
  - number: 55a.1.d
    text: inzake aangelegenheden die rechtstreeks betrekking hebben op de omstandigheden, bedoeld onder a, b, en c.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel55a
  - number: 55a.2
    text: |-
      Dit hoofdstuk en de daarop berustende bepalingen zijn, met uitzondering van de paragrafen 11 en 12, niet van
      toepassing op werkzaamheden of diensten verricht:
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel55a
  - number: 55a.2.a
    text: tijdens varen, vliegen en oefeningen;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel55a
  - number: 55a.2.b
    text: inzake aangelegenheden die rechtstreeks betrekking hebben op het varen, het vliegen en het houden van oefeningen.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel55a
  - number: 55b
    text: |-
      Dit hoofdstuk en de daarop berustende bepalingen zijn, met uitzondering van de paragrafen 2 en 12, niet van
      toepassing op verrichtingen van de militair die een opleiding volgt als bedoeld in de artikelen 13, 14 en 15.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel55b
  - number: 55c
    text: |-
      Dit hoofdstuk en de daarop berustende bepalingen zijn van toepassing op werkzaamheden of diensten verricht door
      militair brandweerpersoneel, tenzij dit personeel repressief optreedt bij brand en ongevallen.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel55c
  - number: 55d
    text: |-
      Dit hoofdstuk en de daarop berustende bepalingen zijn, met uitzondering van de paragrafen 2, 11 en 12, en
      de artikelen 54a, 54b, derde tot en met vijfde lid, 54d, 54e, 54f, 54g, 54k en 57a, niet van toepassing op
      werkzaamheden of diensten verricht door:
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel55d
  - number: 55d.a
    text: |-
      de militair van 18 jaar en ouder met de rang van luitenant ter zee der 1e klasse dan wel majoor of een hogere rang
      die uitsluitend of in hoofdzaak leiding geeft;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel55d
  - number: 55d.b
    text: |-
      de militair van 18 jaar en ouder met de rang van kapitein-luitenant ter zee dan wel luitenant-kolonel of met een
      hogere rang, tenzij hij werkzaamheden of diensten pleegt te verrichten in nachtdienst dan wel werkzaamheden of
      diensten verricht waaraan of in rechtstreeks verband waarmee ernstige gevaren voor de veiligheid of de gezondheid
      van personen zijn verbonden.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel55d
  - number: 55e
    text: |-
      Dit hoofdstuk en de daarop berustende bepalingen zijn, met uitzondering van de paragrafen 2, 11 en 12, en
      de artikelen 54a, 54b, vierde lid, 54d, 54e, 54f, 54g, 54k en 57a, eerste en tweede lid, niet van toepassing
      op werkzaamheden of diensten verricht door de militair, bedoeld in artikel 2, tweede lid, voor zover hij is
      tewerkgesteld buiten Nederland.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel55e
  - number: 55f
    text: |-
      Dit hoofdstuk en de daarop berustende bepalingen zijn, met uitzondering van de paragrafen 2, 11 en 12, en
      de artikelen 54a, 54b, derde tot en met vijfde lid, 54d, 54e, 54f, 54g, 54k en 57a, niet van toepassing op
      werkzaamheden of diensten verricht door de militair van 18 jaar en ouder die werkzaam is als medisch specialist,
      als huisarts of als sociaal geneeskundige en als zodanig staat geregistreerd in één van de registers van de
      Koninklijke Nederlandsche Maatschappij tot bevordering der Geneeskunst, dan wel als tandheelkundig specialist en
      als zodanig staat ingeschreven in het specialistenregister van de Nederlandse Maatschappij tot bevordering der
      Tandheelkunde.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel55f
  - number: 56a.1
    text: |-
      De arbeidsduur van de militair bedraagt ten hoogste 10 uren per werkdag, in elke periode van 4 achtereenvolgende
      weken ten hoogste gemiddeld 50 uren per week en in elke periode van 13 achtereenvolgende weken ten hoogste
      gemiddeld 45 uren per week.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel56a
  - number: 56a.2
    text: |-
      De commandant dient over de toepassing van het eerste lid overeenstemming te bereiken met de betrokken
      medezeggenschapscommissie, indien het dienstbelang het noodzakelijk maakt dat de militair meer dan 9 uren per
      werkdag of meer dan 45 uren per week werkzaamheden of diensten verricht.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel56a
  - number: 56a.3
    text: |-
      Indien het eerste en tweede lid niet wordt toegepast, dan bedraagt de arbeidsduur ten hoogste 9 uren per werkdag,
      ten hoogste 45 uren per week en ten hoogste gemiddeld 40 uren per week in elke periode van 13 achtereenvolgende
      weken.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel56a
  - number: 56b.1
    text: |-
      Van de in artikel 56a genoemde arbeidsduur kan worden afgeweken indien zich een onvoorziene wijziging van
      omstandigheden, incidenteel en niet periodiek, voordoet, of de aard van de werkzaamheden of diensten, incidenteel
      en voor korte tijd, dergelijke afwijkingen noodzakelijk maakt.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel56b
  - number: 56b.2
    text: |-
      De arbeidsduur bedraagt in situaties als bedoeld in het eerste lid ten hoogste 12 uren per werkdag, ten hoogste 60
      uren per week en in elke periode van 13 achtereenvolgende weken ten hoogste gemiddeld 48 uren per week.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel56b
  - number: 56b.3
    text: |-
      Op de afwijking, bedoeld in het eerste lid, is artikel 56p, vierde lid, onderdelen b en c, en het zesde lid, niet
      van toepassing.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel56b
  - number: 56b.4
    text: |-
      Indien als gevolg van de toepassing van het eerste lid werkzaamheden of diensten worden verricht in nachtdienst,
      welke werkzaamheden of diensten eindigen vóór of op 02.00 uur, dan zijn hierop de in paragraaf 5 opgenomen
      bepalingen ten aanzien van het verrichten van werkzaamheden of diensten in nachtdienst niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel56b
  - number: 56c
    text: |-
      In afwijking van artikel 56a, eerste lid, artikel 56b, tweede lid, artikel 58b, vijfde lid, artikel 58c, derde lid,
      onderdeel b, en artikel 58d, vierde lid, bedraagt de arbeidsduur van de militair die de leeftijd van 18 jaar nog
      niet heeft bereikt ten hoogste gemiddeld 40 uren per week in elke periode van 13 achtereenvolgende weken.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel56c
  - number: 56d.1
    text: |-
      De militair heeft in elke aaneengesloten tijdruimte van 24 uren recht op een onafgebroken rusttijd van ten minste
      11 uren, welke rusttijd éénmaal in elke aaneengesloten tijdruimte van 7 maal 24 uren mag worden ingekort tot ten
      minste 8 uren.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel56d
  - number: 56d.2
    text: |-
      De in het voorgaande lid bedoelde tijdruimte vangt aan op het eerste tijdstip van de dag, waarop de militair
      werkzaamheden of diensten verricht.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel56d
  - number: 56e.1
    text: |-
      De militair heeft recht op een onafgebroken rusttijd van hetzij ten minste 36 uren in elke aaneengesloten
      tijdruimte van 7 maal 24 uren, hetzij ten minste 60 uren in elke aaneengesloten tijdruimte van 9 maal 24 uren. De
      voorgeschreven rusttijd van 60 uren mag éénmaal in elke periode van 5 achtereenvolgende weken worden bekort tot
      32 uren.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel56e
  - number: 56e.2
    text: |-
      De in het voorgaande lid bedoelde tijdruimte vangt aan op het eerste tijdstip van de dag, waarop de militair
      werkzaamheden of diensten verricht.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel56e
  - number: 56f.1
    text: |-
      Voor de militair die werkzaamheden of diensten in nachtdienst verricht, bedraagt de arbeidsduur ten hoogste 9 uren
      per nachtdienst, in elke periode van 4 achtereenvolgende weken ten hoogste gemiddeld 50 uren per week en in elke
      periode van 13 achtereenvolgende weken ten hoogste gemiddeld 40 uren per week.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel56f
  - number: 56f.2
    text: |-
      De commandant dient over de toepassing van het eerste lid overeenstemming te bereiken met de betrokken
      medezeggenschapscommissie, indien het dienstbelang het noodzakelijk maakt dat de militair meer dan 8 uren per
      nachtdienst of meer dan 45 uren per week werkzaamheden of diensten verricht.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel56f
  - number: 56f.3
    text: |-
      Indien het eerste en tweede lid niet wordt toegepast, dan bedraagt de arbeidsduur ten hoogste 8 uren per
      nachtdienst, ten hoogste 45 uren per week en ten hoogste gemiddeld 40 uren per week in elke periode van 13
      achtereenvolgende weken.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel56f
  - number: 56g.1
    text: |-
      Van de in artikel 56f genoemde arbeidsduur kan worden afgeweken indien zich een onvoorziene wijziging van
      omstandigheden, incidenteel en niet periodiek, voordoet, of de aard van de werkzaamheden of diensten, incidenteel
      en voor korte tijd, dergelijke afwijkingen noodzakelijk maakt.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel56g
  - number: 56g.2
    text: |-
      De arbeidsduur bedraagt in situaties als bedoeld in het eerste lid ten hoogste 10 uren per nachtdienst, ten hoogste
      60 uren per week en in elke periode van 13 achtereenvolgende weken ten hoogste gemiddeld 40 uren per week.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel56g
  - number: 56g.3
    text: |-
      Op de afwijking, bedoeld in het eerste lid, is artikel 56p, vierde lid, onderdelen b en c, en het zesde lid, niet
      van toepassing.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel56g
  - number: 56h.1
    text: |-
      De militair heeft na het verrichten van werkzaamheden of diensten in nachtdienst, welke eindigen ná 02.00 uur,
      recht op een onafgebroken rusttijd van tenminste 14 uren, welke éénmaal in elke aaneengesloten tijdruimte van 7
      maal 24 uren mag worden bekort tot ten minste 8 uren.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel56h
  - number: 56h.2
    text: |-
      De commandant dient over de toepassing van de in het eerste lid bedoelde bekorting van de onafgebroken rusttijd tot
      ten minste 8 uren overeenstemming te bereiken met de betrokken medezeggenschapscommissie, indien het dienstbelang
      toepassing noodzakelijk maakt.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel56h
  - number: 56h.3
    text: |-
      De in het eerste lid bedoelde tijdruimte vangt aan op het eerste tijdstip van de dag, waarop de militair
      werkzaamheden of diensten verricht.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel56h
  - number: 56i.1
    text: |-
      De militair verricht in elke periode van 13 achtereenvolgende weken niet meer dan ten hoogste 52 maal werkzaamheden
      of diensten in nachtdienst, indien de werkzaamheden of diensten eindigen vóór of op 02.00 uur.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel56i
  - number: 56i.2
    text: |-
      De commandant dient over de toepassing van het eerste lid overeenstemming te bereiken met de betrokken
      medezeggenschapscommissie, indien het dienstbelang het noodzakelijk maakt dat de militair in een periode
      van 4 achtereenvolgende weken meer dan 16 maal werkzaamheden of diensten in nachtdienst verricht, indien die
      werkzaamheden of diensten eindigen vóór of op 02.00 uur.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel56i
  - number: 56j.1
    text: |-
      De militair verricht in elke periode van 13 achtereenvolgende weken niet meer dan ten hoogste 28 maal werkzaamheden
      of diensten in nachtdienst, indien de werkzaamheden of diensten eindigen ná 02.00 uur.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel56j
  - number: 56j.2
    text: |-
      De commandant dient over de toepassing van het eerste lid overeenstemming te bereiken met de betrokken
      medezeggenschapscommissie, indien het dienstbelang het noodzakelijk maakt dat de militair in elke periode van
      4 achtereenvolgende weken meer dan 10 maal en in elke periode van 13 achtereenvolgende weken meer dan 25 maal
      werkzaamheden of diensten in nachtdienst verricht, indien die werkzaamheden of diensten eindigen ná 02.00 uur.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel56j
  - number: 56k.1
    text: In afwijking van artikel 56j, eerste lid, kan de commandant dit artikel toepassen.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel56k
  - number: 56k.2
    text: |-
      Indien de aard van de werkzaamheden of diensten met zich brengt dat werkzaamheden of diensten in nachtdienst worden
      verricht, en dit door het op een andere wijze organiseren van die werkzaamheden of diensten redelijkerwijs niet is
      te voorkomen, verricht de militair:
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel56k
  - number: 56k.2.a
    text: hetzij ten hoogste 35 maal in elke periode van 13 achtereenvolgende weken werkzaamheden of diensten in nachtdienst;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel56k
  - number: 56k.2.b
    text: |-
      hetzij ten hoogste 20 uren in elke periode van 2 achtereenvolgende weken werkzaamheden of diensten tussen 00.00 uur
      en 06.00 uur.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel56k
  - number: 56k.3
    text: |-
      De commandant dient over de toepassing van het eerste en tweede lid overeenstemming te bereiken met de betrokken
      medezeggenschapscommissie, indien het dienstbelang toepassing noodzakelijk maakt.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel56k
  - number: 56l.1
    text: |-
      Na een reeks van ten minste 3 en ten hoogste 7 maal achtereen werkzaamheden of diensten in nachtdienst te hebben
      verricht, heeft de militair recht op een onafgebroken rusttijd van ten minste 48 uren.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel56l
  - number: 56l.2
    text: |-
      De commandant dient over de toepassing van het eerste lid overeenstemming te bereiken met de betrokken
      medezeggenschapscommissie, indien het dienstbelang noodzakelijk maakt dat de militair 7 maal achtereen
      werkzaamheden of diensten in nachtdienst verricht die eindigen vóór of op 02.00 uur, hetzij 6 of 7 maal achtereen
      werkzaamheden of diensten in nachtdienst verricht die eindigen ná 02.00 uur.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel56l
  - number: 56l.3
    text: 'Indien het eerste lid niet wordt toegepast, dan heeft de militair,:'
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel56l
  - number: 56l.3.a
    text: |-
      na een reeks van ten minste 3 en ten hoogste 6 maal achtereen werkzaamheden of diensten in nachtdienst te hebben
      verricht, die eindigen vóór of op 02.00 uur;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel56l
  - number: 56l.3.b
    text: |-
      hetzij na een reeks van ten minste 3 en ten hoogste 5 maal achtereen werkzaamheden of diensten in nachtdienst te
      hebben verricht, die eindigen ná 02.00 uur,
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel56l
  - number: 56m.1
    text: |-
      In afwijking van artikel 56f, eerste lid, en artikel 56g, tweede lid, ten aanzien van het gemiddeld aantal uren per
      week in elke periode van 13 achtereenvolgende weken dat werkzaamheden of diensten in nachtdienst wordt verricht,
      kan de commandant dit artikel toepassen.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel56m
  - number: 56m.2
    text: |-
      Indien zich een onvoorziene wijziging van omstandigheden voordoet of de aard van de werkzaamheden of diensten het
      noodzakelijk maakt dat de militair slechts incidenteel of voor korte tijd werkzaamheden of diensten in nachtdienst
      verricht en dit door het op een andere wijze organiseren van de werkzaamheden of diensten redelijkerwijs niet
      is te voorkomen, verricht de militair in elke periode van 52 achtereenvolgende weken gemiddeld 40 uren per week
      werkzaamheden of diensten.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel56m
  - number: 56m.3
    text: |-
      De commandant dient over de toepassing van het eerste en tweede lid overeenstemming te bereiken met de betrokken
      medezeggenschapscommissie, indien het dienstbelang toepassing noodzakelijk maakt.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel56m
  - number: 56n.1
    text: |-
      In afwijking van de artikelen 56a, 56b, 56f en 56g, ten aanzien van de arbeidsduur per werkdag of nachtdienst, kan
      de commandant dit artikel toepassen.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel56n
  - number: 56n.2
    text: |-
      Indien de werkzaamheden of diensten geen uitstel gedogen, en door het nemen van andere maatregelen redelijkerwijs
      niet is te voorkomen, verricht de militair ten hoogste éénmaal in elke periode van 2 achtereenvolgende weken 14
      uren werkzaamheden of diensten per werkdag onderscheidenlijk per nachtdienst.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel56n
  - number: 56n.3
    text: |-
      Het tweede lid is eveneens van toepassing, indien de werkzaamheden of diensten worden verstoord door een zich
      plotseling voordoende situatie:
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel56n
  - number: 56n.3.a
    text: waarbij personen ernstig letsel oplopen, dan wel daartoe de onmiddellijke dreiging bestaat;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel56n
  - number: 56n.3.b
    text: waarbij buitengewoon ernstige schade aan goederen ontstaat, dan wel dreigt te ontstaan.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel56n
  - number: 56o.1
    text: |-
      De commandant kan, in afwijking van de in dit hoofdstuk opgenomen bepalingen ten aanzien van de arbeidsduur per
      werkdag onderscheidenlijk per nachtdienst en de onafgebroken rusttijd, dit artikel toepassen.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel56o
  - number: 56o.2
    text: |-
      De arbeidsduur per werkdag of per nachtdienst onderscheidenlijk de onafgebroken rusttijd wordt met ten hoogste 15
      achtereenvolgende minuten verlengd onderscheidenlijk ingekort, indien de werkzaamheden of diensten van de militair
      aan het eind van de werkdag worden overgenomen en direct daaropvolgend worden voortgezet door een andere militair
      en de goede voortgang van die werkzaamheden of diensten overdracht noodzakelijk maakt.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel56o
  - number: 56o.3
    text: |-
      Op de afwijking bedoeld in het tweede lid zijn de artikelen 56i, 56j en 56k, ten aanzien van het aantal malen dat
      werkzaamheden of diensten in nachtdienst worden verricht, niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel56o
  - number: 56p.1
    text: |-
      Indien de arbeidsduur van de militair meer dan 5½ uur per werkdag of nachtdienst bedraagt, dan worden de
      werkzaamheden of diensten afgewisseld door een pauze.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel56p
  - number: 56p.2
    text: |-
      De in het eerste lid bedoelde pauze bedraagt ten minste een half uur aaneengesloten, welke mag worden gesplitst in
      twee pauzes van ten minste 15 achtereenvolgende minuten.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel56p
  - number: 56p.3
    text: |-
      De commandant dient over de toepassing van het tweede lid overeenstemming te bereiken met de betrokken
      medezeggenschapscommissie, indien het dienstbelang toepassing noodzakelijk maakt.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel56p
  - number: 56p.4
    text: |-
      Indien het tweede lid niet wordt toegepast, dan worden, met inachtneming van het eerste lid, de werkzaamheden of
      diensten van de militair:
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel56p
  - number: 56p.4.a
    text: |-
      indien hij niet meer dan 8 uren werkzaamheden of diensten per werkdag of nachtdienst verricht, afgewisseld door
      pauzes van tezamen ten minste een half uur;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel56p
  - number: 56p.4.b
    text: |-
      indien hij meer dan 8 uren, doch niet meer dan 10 uren werkzaamheden of diensten per werkdag of nachtdienst
      verricht, afgewisseld door pauzes van tezamen ten minste 45 minuten;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel56p
  - number: 56p.4.c
    text: |-
      indien hij meer dan 10 uren werkzaamheden of diensten per werkdag of nachtdienst verricht, afgewisseld door pauzes
      van tezamen ten minste 1 uur.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel56p
  - number: 56p.5
    text: Eén van de pauzes, bedoeld in het vierde lid, bedraagt ten minste een half uur aaneengesloten.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel56p
  - number: 56p.6
    text: |-
      De pauzes, bedoeld in het vierde lid, vangen aan en eindigen in de periode, gelegen tussen 2 uren na de aanvang en
      2 uren voor het einde van de werkzaamheden of diensten.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel56p
  - number: 56q.1
    text: |-
      De commandant kan van het bepaalde in artikel 54a, onderdeel j, en artikel 58a, tweede lid, afwijken, indien de
      aard van de werkzaamheden of diensten van de militair het noodzakelijk maakt dat hij tijdens de pauze bereikbaar
      is onderscheidenlijk op de werkplek aanwezig is om op oproep zo spoedig mogelijk die werkzaamheden of diensten te
      verrichten, en dit door het op een andere wijze organiseren van de werkzaamheden of diensten redelijkerwijs niet is
      te voorkomen.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel56q
  - number: 56q.2
    text: |-
      De commandant dient over de toepassing van het eerste lid overeenstemming te bereiken met de betrokken
      medezeggenschapscommissie, indien het dienstbelang toepassing noodzakelijk maakt.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel56q
  - number: 56q.3
    text: |-
      Voor de toepassing van het eerste lid geldt de tijd tijdens de werkplekgebonden pauze waarop de werkzaamheden of
      diensten van de militair zich uitsluitend beperken tot de verplichte aanwezigheid op de werkplek, als pauze.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel56q
  - number: 56r.1
    text: 'De commandant kan van het bepaalde in artikel 56p, eerste lid, afwijken, indien de militair:'
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel56r
  - number: 56r.1.a
    text: |-
      werkzaamheden of diensten verricht zonder enig direct contact met een andere militair of ambtenaar die
      vergelijkbare werkzaamheden of diensten verricht, of
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel56r
  - number: 56r.1.b
    text: |-
      indien de aard van de werkzaamheden of diensten met zich brengt dat de afwisseling van de werkzaamheden of diensten
      per werkdag onderscheidenlijk per nachtdienst door een pauze onmogelijk is en dit door het op een andere wijze
      organiseren van de werkzaamheden of diensten redelijkerwijs niet is te voorkomen.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel56r
  - number: 56r.2
    text: |-
      De commandant dient over de toepassing van het eerste lid overeenstemming te bereiken met de betrokken
      medezeggenschapscommissie, indien het dienstbelang toepassing noodzakelijk maakt.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel56r
  - number: 56r.3
    text: |-
      Indien het eerste lid wordt toegepast, verricht de militair in elke periode van 52 achtereenvolgende weken ten
      hoogste gemiddeld 40 uren per week werkzaamheden of diensten.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel56r
  - number: 56r.4
    text: |-
      Indien het eerste lid wordt toegepast, verricht de militair in afwijking van artikel 57c, tweede lid, en artikel
      59b, tweede lid, ten hoogste 12 uren per werkdag onderscheidenlijk per nachtdienst werkzaamheden of diensten.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel56r
  - number: 57a.1
    text: |-
      Op zaterdag en zondag worden aan de militair geen werkzaamheden of diensten opgedragen. Hiervan kan slechts worden
      afgeweken indien naar het oordeel van de commandant het dienstbelang zulks onvermijdelijk maakt.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel57a
  - number: 57a.2
    text: |-
      Het eerste lid geldt mede voor Nieuwjaarsdag, Eerste en Tweede Paasdag, Hemelvaartsdag, Eerste en Tweede
      Pinksterdag, Eerste en Tweede Kerstdag, Koninginnedag, 5 mei en de door Onze Minister aan te wijzen feest- of
      gedenkdagen.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel57a
  - number: 57a.3
    text: |-
      Er dient naar te worden gestreefd dat de militair geen werkzaamheden of diensten verricht op de dagen, bedoeld in
      het eerste en tweede lid, die voorafgaan aan, vallen in of aansluiten op een aan hem verleend verlof van meer dan 3
      dagen, doch minder dan 10 dagen. De militair verricht in beginsel geen werkzaamheden of diensten op de in de eerste
      volzin bedoelde dagen, die voorafgaan aan, vallen in of aansluiten op een hem verleend verlof van 10 dagen of meer.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel57a
  - number: 57a.4
    text: De militair verricht geen werkzaamheden of diensten op ten minste 26 zondagen per periode van 52 weken.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel57a
  - number: 57a.5
    text: |-
      De voor de militair, die volgens rooster werkzaamheden of diensten in continu- of ploegendienst verricht,
      geldende arbeidsduur, bedoeld in artikel 54b, vierde lid, wordt tijdens de desbetreffende roosterperiode evenredig
      verminderd indien hij op dagen als bedoeld in het tweede lid, die niet op zaterdag of zondag vallen:
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel57a
  - number: 57a.5.a
    text: daadwerkelijk werkzaamheden of diensten heeft verricht, of;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel57a
  - number: 57a.5.b
    text: volgens rooster niet was aangewezen voor het verrichten van werkzaamheden of diensten.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel57a
  - number: 57a.6
    text: |-
      Ten aanzien van militairen die zijn ingedeeld bij eenheden die onmiddellijk in actie moeten kunnen komen of
      bij eenheden die dienst verrichten buiten Nederland, kan bij het opstellen van het rooster door de commandant
      worden afgeweken van het eerste, het tweede en het derde lid met betrekking tot de zaterdagmorgen en de feest-
      of gedenkdagen.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel57a
  - number: 57a.7
    text: |-
      Indien naar het oordeel van de commandant de belangen van de dienst zich hiertegen niet verzetten, wordt de
      militair, aan wie op een zondag of een dag als bedoeld in het tweede lid of het zesde lid, werkzaamheden of
      diensten zijn opgedragen, tijdens de werktijd in de gelegenheid gesteld de godsdienstuitoefening van de gezindte
      waartoe hij behoort bij te wonen.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel57a
  - number: 57a.8
    text: Onze Minister kan ter uitvoering van dit artikel bij ministeriële regeling nadere regels stellen.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel57a
  - number: 57b.1
    text: |-
      In afwijking van de artikelen 56b en 56g ten aanzien van de arbeidsduur per werkdag onderscheidenlijk per
      nachtdienst kan de commandant dit artikel toepassen.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel57b
  - number: 57b.2
    text: |-
      Indien de aard van de werkzaamheden of diensten, of de bedrijfsomstandigheden, in verband met de Nieuwjaarsdag,
      Eerste en Tweede Paasdag, Hemelvaartsdag, Eerste en Tweede Pinksterdag, Eerste en Tweede Kerstdag, Koninginnedag
      of 5 december dit noodzakelijk maakt, verricht de militair in de aaneengesloten periode van 7 dagen voorafgaand aan
      die dag ten hoogste tweemaal 14 uren per werkdag onderscheidenlijk per nachtdienst werkzaamheden of diensten.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel57b
  - number: 57b.3
    text: |-
      De commandant dient over de toepassing van het eerste en tweede lid overeenstemming te bereiken met de betrokken
      medezeggenschapscommissie, indien het dienstbelang toepassing noodzakelijk maakt.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel57b
  - number: 57b.4
    text: Artikel 56n is niet van toepassing indien het eerste en tweede lid wordt toegepast.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel57b
  - number: 57c.1
    text: |-
      In afwijking van artikel 56a, eerste lid, en artikel 56f, eerste lid, ten aanzien van de arbeidsduur per werkdag
      onderscheidenlijk per nachtdienst, en artikel 56h, eerste lid, ten aanzien van de onafgebroken rusttijd na een
      nachtdienst, kan de commandant dit artikel toepassen.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel57c
  - number: 57c.2
    text: |-
      De militair verricht, in verband met de Nieuwjaarsdag, Eerste en Tweede Paasdag, Hemelvaartsdag, Eerste en Tweede
      Pinksterdag en Eerste en Tweede Kerstdag, in de tijdruimte tussen de dag voorafgaand aan bedoelde dagen 18.00
      uur en de op deze dagen volgende dag 08.00 uur ten hoogste 11 uren per werkdag onderscheidenlijk per nachtdienst
      werkzaamheden of diensten. De militair heeft na het verrichten van die werkzaamheden of diensten een onafgebroken
      rusttijd van ten minste 12 uren.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel57c
  - number: 57c.3
    text: |-
      Indien het eerste en tweede lid wordt toegepast, dan organiseert de commandant de werkzaamheden of diensten
      zodanig, dat zoveel mogelijk militairen op de in het tweede lid bedoelde dagen geen werkzaamheden of diensten
      verrichten in de tijdruimte gelegen tussen 00.00 uur en de daarop volgende dag 06.00 uur.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel57c
  - number: 57c.4
    text: |-
      De commandant dient over de toepassing van het eerste en tweede lid overeenstemming te bereiken met de betrokken
      medezeggenschapscommissie, indien het dienstbelang toepassing noodzakelijk maakt.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel57c
  - number: 58a.1
    text: De commandant kan de militair consignatie opleggen.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel58a
  - number: 58a.2
    text: |-
      Ten minste gedurende 2 maal een aaneengesloten tijdruimte van 7 maal 24 uren in elke periode van 4
      achtereenvolgende weken wordt geen consignatie opgelegd.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel58a
  - number: 58a.3
    text: |-
      Tijdens de onafgebroken rusttijd direct voorafgaand aan en direct volgend op een nachtdienst wordt geen consignatie
      opgelegd.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel58a
  - number: 58a.4
    text: |-
      Als consignatie wordt opgelegd bedraagt de arbeidsduur ten hoogste 13 uren in elke periode van 24 achtereenvolgende
      uren, ten hoogste 60 uren per week en ten hoogste gemiddeld 45 uren per week in elke periode van 13
      achtereenvolgende weken.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel58a
  - number: 58a.5
    text: |-
      Indien de consignatie geheel of gedeeltelijk de periode van 00.00 uur tot 06.00 uur bestrijkt, bedraagt de
      arbeidsduur, in afwijking van het vorige lid ten hoogste 13 uren in elke periode van 24 achtereenvolgende uren, ten
      hoogste 60 uren per week en ten hoogste gemiddeld 40 uren per week in elke periode van 13 achtereenvolgende weken.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel58a
  - number: 58a.6
    text: |-
      Voor de toepassing van het vierde en vijfde lid vangt de arbeidsduur aan op het moment van de oproep. Indien
      binnen een half uur na beëindiging van de werkzaamheden die voortvloeien uit een oproep opnieuw een oproep wordt
      gedaan, wordt de tussenliggende tijd gerekend tot de arbeidsduur. Indien binnen een half uur één of meer keren
      werkzaamheden voortvloeiend uit een oproep worden verricht, wordt de arbeidsduur geacht ten minste een half uur
      te bedragen.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel58a
  - number: 58a.7
    text: |-
      De werkzaamheden die voortvloeien uit een oproep worden voor de toepassing van de in dit hoofdstuk opgenomen
      bepalingen ten aanzien van rusttijd en pauze buiten beschouwing gelaten.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel58a
  - number: 58a.8
    text: |-
      Op de werkzaamheden die voortvloeien uit een oproep zijn de bepalingen in paragraaf 5 ten aanzien van het aantal
      malen dat werkzaamheden of diensten in nachtdienst wordt verricht niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel58a
  - number: 58b.1
    text: |-
      In afwijking van artikel 58a, tweede lid, kan de commandant de militair ten hoogste 3 maal in elke aaneengesloten
      tijdruimte van 7 maal 24 uren en ten hoogste 26 maal in elke periode van 13 achtereenvolgende weken een
      aanwezigheidsdienst opleggen.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel58b
  - number: 58b.2
    text: |-
      In afwijking van het eerste lid kan de commandant de militair gedurende ten hoogste 6 weken in elke periode van 52
      achtereenvolgende weken ten hoogste 4 maal in elke aaneengesloten tijdruimte van 7 maal 24 uren en ten hoogste 26
      maal in elke periode van 13 achtereenvolgende weken een aanwezigheidsdienst opleggen.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel58b
  - number: 58b.3
    text: |-
      Als het tweede lid wordt toegepast heeft de militair na de aanwezigheidsdienst of reeks van aaneengesloten
      aanwezigheidsdiensten een onafgebroken rusttijd die ten minste even lang is als de voorafgaande aanwezigheidsdienst
      onderscheidenlijk reeks van aaneengesloten aanwezigheidsdiensten.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel58b
  - number: 58b.4
    text: |-
      Tijdens de onafgebroken rusttijd direct voorafgaand aan en direct volgend op een nachtdienst wordt geen
      aanwezigheidsdienst opgelegd.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel58b
  - number: 58b.5
    text: |-
      Als een aanwezigheidsdienst wordt opgelegd bedraagt de arbeidsduur ten hoogste 13 uren in elke periode van 24
      achtereenvolgende uren, ten hoogste 60 uren per week en ten hoogste gemiddeld 45 uren per week in elke periode van
      13 achtereenvolgende weken.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel58b
  - number: 58b.6
    text: |-
      Indien de aanwezigheidsdienst geheel of gedeeltelijk de periode van 00.00 uur tot 06.00 uur bestrijkt, bedraagt de
      arbeidsduur, in afwijking van het vorige lid ten hoogste 13 uren in elke periode van 24 achtereenvolgende uren, ten
      hoogste 60 uren per week en ten hoogste gemiddeld 40 uren per week in elke periode van 13 achtereenvolgende weken.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel58b
  - number: 58b.7
    text: |-
      Voor de toepassing van dit artikel geldt de tijd tijdens een aanwezigheidsdienst, waarbij de dienst van de militair
      zich uitsluitend beperkt tot de verplichte aanwezigheid op de werkplek, als rusttijd.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel58b
  - number: 58b.8
    text: |-
      Voor de toepassing van het vijfde en zesde lid vangt de arbeidsduur aan op het moment van de oproep. Indien
      binnen een half uur na beëindiging van de werkzaamheden die voortvloeien uit een oproep opnieuw een oproep wordt
      gedaan, wordt de tussenliggende tijd gerekend tot de arbeidsduur. Indien binnen een half uur één of meer keren
      werkzaamheden voortvloeiend uit een oproep worden verricht, wordt de arbeidsduur geacht ten minste een half uur
      te bedragen.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel58b
  - number: 58b.9
    text: |-
      De werkzaamheden die voortvloeien uit een oproep worden voor de toepassing van de in dit hoofdstuk opgenomen
      bepalingen ten aanzien van rusttijd en pauze buiten beschouwing gelaten.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel58b
  - number: 58b.10
    text: |-
      Op de werkzaamheden die voortvloeien uit een oproep zijn de bepalingen in paragraaf 5, ten aanzien van het aantal
      malen dat werkzaamheden of diensten in nachtdienst wordt verricht, niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel58b
  - number: 58c.1
    text: |-
      Dit artikel is uitsluitend van toepassing op de militair die met goed gevolg een brandweeropleiding heeft
      afgesloten en die als zodanig werkzaam is, alsmede de militair die in directe samenhang met voornoemde militair
      werkzaamheden of diensten verricht.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel58c
  - number: 58c.2
    text: |-
      In afwijking van artikel 58a, tweede lid, kan de commandant de militair ten hoogste 4 maal in elke aaneengesloten
      tijdruimte van 7 maal 24 uren, ten hoogste 46 maal in elke periode van 13 achtereenvolgende weken en ten hoogste
      124 maal in elke periode van 52 achtereenvolgende weken een aanwezigheidsdienst opleggen.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel58c
  - number: 58c.3
    text: 'Indien het tweede lid wordt toegepast, dan:'
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel58c
  - number: 58c.3.a
    text: |-
      heeft de militair vóór en ná een aanwezigheidsdienst een onafgebroken rusttijd van ten minste 11 uren, welke
      rusttijd éénmaal in elke aaneengesloten tijdruimte van 7 maal 24 uren mag worden ingekort tot ten minste 8 uren;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel58c
  - number: 58c.3.b
    text: |-
      bedraagt de arbeidsduur ten hoogste 10 uren in elke periode van 24 achtereenvolgende uren en in elke periode van 13
      achtereenvolgende weken ten hoogste gemiddeld 45 uren per week.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel58c
  - number: 58c.4
    text: |-
      Het derde lid, onderdeel a, blijft buiten toepassing, indien zich incidentele en onvoorziene omstandigheden
      voordoen waardoor het aantal militairen dat nodig is onder het vereiste minimum komt, die een dergelijke afwijking
      noodzakelijk maakt.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel58c
  - number: 58c.5
    text: |-
      Voor de toepassing van dit artikel geldt de tijd tijdens een aanwezigheidsdienst, waarbij de dienst van de militair
      zich uitsluitend beperkt tot de verplichte aanwezigheid op de werkplek, als rusttijd.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel58c
  - number: 58c.6
    text: |-
      Voor de toepassing van het derde lid, onderdeel b, vangt de arbeidsduur aan op het moment van de oproep. Indien
      binnen een half uur na beëindiging van de werkzaamheden die voortvloeien uit een oproep opnieuw een oproep wordt
      gedaan, wordt de tussenliggende tijd gerekend tot de arbeidsduur. Indien binnen een half uur één of meer keren
      werkzaamheden voortvloeiend uit een oproep worden verricht, wordt de arbeidsduur geacht ten minste een half uur
      te bedragen.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel58c
  - number: 58c.7
    text: |-
      De werkzaamheden die voortvloeien uit een oproep worden voor de toepassing van de in dit hoofdstuk opgenomen
      bepalingen ten aanzien van rusttijd en pauze buiten beschouwing gelaten.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel58c
  - number: 58c.8
    text: |-
      Op de werkzaamheden die voortvloeien uit een oproep zijn de bepalingen in paragraaf 5, ten aanzien van het aantal
      malen dat werkzaamheden of diensten in nachtdienst wordt verricht, niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel58c
  - number: 58d.1
    text: |-
      In afwijking van artikel 58a, tweede lid, kan de commandant de militair ten hoogste een aaneengesloten tijdruimte
      van 7 maal 24 uren piket opleggen.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel58d
  - number: 58d.2
    text: |-
      Als piket wordt opgelegd, dan wordt de militair ten minste gedurende 8 maal een aaneengesloten tijdruimte van
      7 maal 24 uren in elke periode van 13 achtereenvolgende weken geen piket, aanwezigheidsdienst of consignatie
      opgelegd.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel58d
  - number: 58d.3
    text: |-
      Tijdens de onafgebroken rusttijd direct voorafgaand aan en direct volgend op een nachtdienst wordt geen piket
      opgelegd.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel58d
  - number: 58d.4
    text: |-
      Als piket wordt opgelegd bedraagt de arbeidsduur ten hoogste 13 uren in elke periode van 24 achtereenvolgende uren,
      ten hoogste 60 uren per week en ten hoogste gemiddeld 45 uren per week in elke periode van 13 achtereenvolgende
      weken.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel58d
  - number: 58d.5
    text: |-
      Indien het piket geheel of gedeeltelijk de periode van 00.00 uur tot 06.00 uur bestrijkt, bedraagt de arbeidsduur,
      in afwijking van het vorige lid ten hoogste 13 uren in elke periode van 24 achtereenvolgende uren, ten hoogste 60
      uren per week en ten hoogste gemiddeld 40 uren per week in elke periode van 13 achtereenvolgende weken.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel58d
  - number: 58d.6
    text: |-
      Voor de toepassing van dit artikel geldt de tijd tijdens het piket, waarbij de dienst van de militair zich
      uitsluitend beperkt tot de verplichte aanwezigheid op de werkplek, als rusttijd.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel58d
  - number: 58d.7
    text: |-
      Voor de toepassing van het vierde en vijfde lid vangt de arbeidsduur aan op het moment van de oproep. Indien
      binnen een half uur na beëindiging van de werkzaamheden die voortvloeien uit een oproep opnieuw een oproep wordt
      gedaan, wordt de tussenliggende tijd gerekend tot de arbeidsduur. Indien binnen een half uur één of meer keren
      werkzaamheden voortvloeiend uit een oproep worden verricht, wordt de arbeidsduur geacht ten minste een half uur
      te bedragen.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel58d
  - number: 58d.8
    text: |-
      De werkzaamheden die voortvloeien uit een oproep worden voor de toepassing van de in dit hoofdstuk opgenomen
      bepalingen ten aanzien van rusttijd en pauze buiten beschouwing gelaten.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel58d
  - number: 58d.9
    text: |-
      Op de werkzaamheden die voortvloeien uit een oproep zijn de bepalingen in paragraaf 5, ten aanzien van het aantal
      malen dat werkzaamheden of diensten in nachtdienst wordt verricht, niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel58d
  - number: 59a
    text: |-
      Deze paragraaf is uitsluitend van toepassing op werkzaamheden of diensten die door de militair in continu- of
      ploegendienst worden verricht.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel59a
  - number: 59b.1
    text: |-
      In afwijking van artikel 56a, eerste lid, en artikel 56f, eerste lid, ten aanzien van de arbeidsduur per werkdag
      onderscheidenlijk per nachtdienst, en artikel 56h, eerste lid, ten aanzien van de onafgebroken rusttijd na een
      nachtdienst, kan de commandant dit artikel toepassen.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel59b
  - number: 59b.2
    text: |-
      De militair verricht in de tijdruimte gelegen tussen vrijdag 18.00 uur en de daaropvolgende maandag 08.00 uur ten
      hoogste 11 uren per werkdag onderscheidenlijk per nachtdienst werkzaamheden of diensten.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel59b
  - number: 59b.3
    text: |-
      Indien het eerste en tweede lid wordt toegepast heeft de militair na het verrichten van die werkzaamheden of
      diensten een onafgebroken rusttijd van ten minste 12 uren, en verricht hijten minste 2 maal in elke periode van
      4 achtereenvolgende weken geen werkzaamheden of diensten in de tijdruimte gelegen tussen zaterdag 00.00 uur en de
      daaropvolgende maandag 06.00 uur.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel59b
  - number: 59b.4
    text: |-
      De commandant dient over de toepassing van het eerste en tweede lid overeenstemming te bereiken met de betrokken
      medezeggenschapscommissie, indien het dienstbelang toepassing noodzakelijk maakt.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel59b
  - number: 59c.1
    text: In afwijking van artikel 56e, eerste lid, kan de commandant dit artikel toepassen.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel59c
  - number: 59c.2
    text: |-
      De militair heeft recht op een onafgebroken rusttijd van ten minste 92 uren in elke aaneengesloten tijdruimte
      van 11 maal 24 uren, welke rusttijd éénmaal in elke periode van 5 achtereenvolgende weken mag worden bekort tot
      72 uren.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel59c
  - number: 59c.3
    text: |-
      De commandant dient over de toepassing van het eerste en tweede lid overeenstemming te bereiken met de betrokken
      medezeggenschapscommissie, indien het dienstbelang toepassing noodzakelijk maakt.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel59c
  - number: 59c.4
    text: |-
      Indien het eerste en tweede lid niet wordt toegepast, dan heeft de militair recht op een onafgebroken rusttijd van
      hetzij ten minste 36 uren in elke aaneengesloten tijdruimte van 7 maal 24 uren, hetzij ten minste 92 uren in elke
      aaneengesloten tijdruimte van 11 maal 24 uren.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel59c
  - number: 59c.5
    text: |-
      De in het tweede en vierde lid bedoelde tijdruimte vangt aan op het eerste tijdstip van de dag, waarop de militair
      werkzaamheden of diensten verricht.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel59c
  - number: 59d.1
    text: In afwijking van artikel 56p, tweede lid, kan de commandant dit artikel toepassen.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel59d
  - number: 59d.2
    text: |-
      Indien de arbeidsduur meer dan 5½ uur per werkdag of nachtdienst bedraagt, dan worden de werkzaamheden of diensten
      van de militair afgewisseld door een pauze.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel59d
  - number: 59d.3
    text: |-
      De commandant dient over de toepassing van het eerste en tweede lid overeenstemming te bereiken met de betrokken
      medezeggenschapscommissie, indien het dienstbelang toepassing noodzakelijk maakt.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel59d
  - number: 59e.1
    text: |-
      Indien zich incidentele en onvoorziene omstandigheden voordoen, waardoor het aantal militairen in een ploeg onder
      het vereiste minimum komt, kan de commandant afwijken van artikel 56f, eerste lid, ten aanzien van de arbeidsduur
      per nachtdienst, en artikel 56h, eerste lid.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel59e
  - number: 59e.2
    text: 'Onverminderd het gestelde in artikel 57c, en artikel 59b ten aanzien van de zondag,:'
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel59e
  - number: 59e.2.a
    text: |-
      verricht de militair bij toepassing van het eerste lid gedurende ten hoogste 2 maal in elke periode van 4
      achtereenvolgende weken en 8 maal in elke periode van 52 achtereenvolgende weken, ten hoogste 11 uur per
      nachtdienst werkzaamheden of diensten;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel59e
  - number: 59e.2.b
    text: |-
      heeft de militair na het verrichten van die werkzaamheden of diensten recht op een onafgebroken rusttijd van ten
      minste 12 uren.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel59e
  - number: 59e.3
    text: |-
      De commandant dient over de toepassing van het eerste en tweede lid overeenstemming te bereiken met de betrokken
      medezeggenschapscommissie, indien het dienstbelang toepassing noodzakelijk maakt.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel59e
  - number: 59f.1
    text: |-
      De werkzaamheden of diensten van een zwangere militair worden zodanig ingericht, dat rekening wordt gehouden met
      haar specifieke omstandigheden. De commandant voldoet, met inachtneming van het tweede tot en met vijfde lid,
      aan de voor hem uit de eerste volzin voortvloeiende verplichting binnen een redelijke termijn nadat een aanvraag
      daartoe door de zwangere militair is gedaan. Bij deze aanvraag wordt desgevraagd een schriftelijke verklaring
      overgelegd van een geneeskundige of een verloskundige waaruit blijkt, dat de betrokken militair zwanger is.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel59f
  - number: 59f.2
    text: |-
      De zwangere militair heeft het recht de werkzaamheden of diensten af te wisselen met één of meer pauzes buiten die
      bedoeld in artikel 56p. Deze extra pauze onderscheidenlijk pauzes bedragen tezamen ten minste 15 minuten en ten
      hoogste één achtste deel van de voor haar geldende arbeidsduur per werkdag of nachtdienst. De in de vorige volzin
      bedoelde pauzes gelden voor de toepassing van dit hoofdstuk als arbeidsduur.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel59f
  - number: 59f.3
    text: |-
      De zwangere militair heeft het recht werkzaamheden of diensten te verrichten in een bestendig en regelmatig werk-
      en rusttijdenpatroon.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel59f
  - number: 59f.4
    text: |-
      De zwangere militair kan niet worden verplicht werkzaamheden of diensten te verrichten anders dan op grond van
      artikel 56a is toegestaan.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel59f
  - number: 59f.5
    text: |-
      De zwangere militair kan niet worden verplicht werkzaamheden of diensten te verrichten in nachtdienst, tenzij de
      commandant aannemelijk maakt dat dit redelijkerwijs niet van hem kan worden gevergd.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel59f
  - number: 59f.6
    text: |-
      De commandant stelt de zwangere militair in de gelegenheid de noodzakelijke zwangerschapsonderzoeken te ondergaan.
      De tijd van de in de vorige volzin bedoelde onderzoeken geldt voor de toepassing van dit hoofdstuk als arbeidsduur.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel59f
  - number: 59g
    text: 'De commandant organiseert de werkzaamheden of diensten zodanig, dat een vrouwelijke militair:'
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel59g
  - number: 59g.a
    text: |-
      geen werkzaamheden of diensten verricht binnen 28 dagen voor de vermoedelijke datum van de bevalling, zoals die
      is aangegeven in een door de vrouwelijke militair aan de commandant overgelegde schriftelijke verklaring van
      een geneeskundige of verloskundige waaruit de vermoedelijke datum van bevalling blijkt. Het in de eerste volzin
      bedoelde tijdvak wordt verlengd met het tijdvak dat verloopt tussen de vermoedelijke datum van de bevalling en de
      werkelijke datum van de bevalling;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel59g
  - number: 59g.b
    text: geen werkzaamheden of diensten verricht binnen 42 dagen na haar bevalling.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel59g
  - number: 59h
    text: |-
      Artikel 59f is, met uitzondering van het zesde lid, van overeenkomstige toepassing gedurende een periode van 6
      maanden na de bevalling.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel59h
  - number: 59i.1
    text: |-
      Een vrouwelijke militair, die een borstkind voedt, heeft, indien zij de commandant hiervan in kennis heeft
      gesteld, gedurende ten minste de eerste 9 levensmaanden van dat kind het recht de werkzaamheden of diensten te
      onderbreken ten einde in de nodige rust en afzondering haar kind te zogen dan wel de borstvoeding te kolven. De
      commandant biedt haar daartoe de gelegenheid en stelt, waar nodig, een geschikte af te sluiten besloten ruimte
      ter beschikking.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel59i
  - number: 59i.2
    text: |-
      De onderbrekingen, bedoeld in het eerste lid, vinden plaats zo vaak en zo lang als nodig is doch bedragen
      gezamenlijk ten hoogste een vierde van de arbeidsduur per werkdag of nachtdienst. De vaststelling van het tijdstip
      en de duur van de onderbrekingen vindt plaats door de betrokken vrouwelijke militair na overleg met de commandant.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel59i
  - number: 59i.3
    text: De duur van de onderbrekingen, bedoeld in dit artikel, gelden voor de toepassing van dit hoofdstuk als arbeidsduur.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel59i
  - number: 60a
    text: |-
      Indien de aard van de te verrichten diensten daartoe aanleiding geeft, kan Onze Minister bij ministeriële regeling
      bepalen dat de tijd, gedurende welke deze diensten worden verricht slechts voor een deel tot de arbeidsduur wordt
      gerekend.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel60a
  - number: 60b
    text: |-
      Door de bevelhebber kan aan de militair de verplichting worden opgelegd buiten de voor hem vastgestelde werktijden
      met het oog op eventuele dienstverrichting:
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel60b
  - number: 60b.a
    text: zich op een bepaalde plaats ter beschikking te houden;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel60b
  - number: 60b.b
    text: binnen een bepaald gebied te verblijven of zich op bepaalde tijdstippen te melden.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel60b
  - number: 60c.1
    text: |-
      Ter zake van extra beslaglegging heeft de militair naar bij ministeriële regeling te stellen regels aanspraak op
      een maandelijkse toelage, bestaande uit een percentage van de voor hem geldende bezoldiging per maand.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel60c
  - number: 60c.2
    text: 'Aan de militair kan voorts naar bij ministeriële regeling te stellen regels worden toegekend:'
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel60c
  - number: 60c.2.a
    text: |-
      een toelage voor het volgens een rooster regelmatig of vrij regelmatig verrichten van werkzaamheden of diensten op
      ongebruikelijke tijdstippen, of;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel60c
  - number: 60c.2.b
    text: |-
      een vergoeding over de tijd gedurende welke op hem een verplichting rust als bedoeld in de artikelen 56q, 58a, 58b,
      58c, 58d en 60b, of;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel60c
  - number: 60c.2.c
    text: een vergoeding voor de overschrijding van de arbeidsduur, bedoeld in artikel 54b, vierde lid, of;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel60c
  - number: 60c.2.d
    text: een vergoeding voor meerdaagse activiteiten, met een duur van ten minste een etmaal, of;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel60c
  - number: 60c.2.e
    text: |-
      een vergoeding voor het verrichten van diensten, of werkzaamheden, of meerdaagse activiteiten, op een dag als
      bedoeld in artikel 57a, eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel60c
  - number: 60d
    text: |-
      Indien de overschrijding van de arbeidsduur, bedoeld in artikel 54b, vierde lid, wordt vergoed in tijd, zijn op
      deze tijd de artikelen 63 tot en met 67 van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel60d
  - number: '61.1'
    text: 'Voor de toepassing van dit hoofdstuk wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel61
  - number: 61.1.a
    text: «verlof» elke vorm van verlof genoemd in het tweede lid;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel61
  - number: 61.1.b
    text: «militair» de militair in werkelijke dienst;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel61
  - number: 61.1.c
    text: |-
      «maand» de periode tussen een datum van een kalendermaand en de overeenkomstige datum van de volgende
      kalendermaand, waarbij een resterend aantal van zestien of meer dagen voor een maand wordt gerekend.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel61
  - number: '61.2'
    text: 'De verloven die aan de militair kunnen worden verleend worden onderscheiden in:'
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel61
  - number: 61.2.a
    text: vakantieverlof;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel61
  - number: 61.2.b
    text: inschepings- en ontschepingsverlof;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel61
  - number: 61.2.c
    text: buitengewoon verlof;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel61
  - number: 61.2.d
    text: buitengewoon verlof in het kader van arbeid en zorg.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel61
  - number: '62'
    text: Verlof wordt verleend door de commandant van de militair tenzij in dit hoofdstuk anders wordt bepaald.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel62
  - number: '63.1'
    text: |-
      Het verlof, bedoeld in [artikel 61, tweede lid, onderdelen a tot en met c][ref1], waarop de militair ingevolge dit
      hoofdstuk aanspraak heeft, wordt hem al dan niet op zijn aanvraag verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel61
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '61'
        hoofdstuk: '8'
        paragraaf: '1'
  - number: '63.2'
    text: |-
      Verlof op aanvraag als bedoeld in het eerste lid, wordt, onder vermelding van de redenen, niet verleend voor zover
      de belangen van de dienst dit, naar het oordeel van degene die bevoegd is het verlof te verlenen, vorderen.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel63
  - number: '63.3'
    text: |-
      Het verlof, bedoeld in [artikel 61, tweede lid, onderdeel d][ref1], wordt na melding door de militair verleend met
      inachtneming van de Wet arbeid en zorg en de bepalingen in paragraaf 4b van dit hoofdstuk.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel61
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '61'
        hoofdstuk: '8'
        paragraaf: '1'
  - number: '64.1'
    text: |-
      De dagen gedurende welke een militair, ware hij niet met verlof geweest, verhinderd zou zijn geweest
      dienst te verrichten wegens ziekte of een ongeval, worden niet aangemerkt als verlof mits hij degene die
      het verlof heeft verleend, naar regels bij ministeriële regeling te stellen, zo spoedig mogelijk van die
      ziekte of dat ongeval in kennis heeft gesteld. Het voorgaande vindt geen toepassing voor de dagen waarop
      buitengewoon verlof als bedoeld in [artikel 12c, tweede lid, van de Militaire ambtenarenwet 1931][ref1] of
      [artikel 86, aanhef en onder b van dit besluit][ref2] wordt genoten.


      [ref1]: https://wetten.overheid.nl/BWBR0001952#Artikel12c
      [ref2]: https://wetten.overheid.nl/BWBR0003482#Artikel86
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0001952
        artikel: 12c
      - id: ref2
        bwb_id: BWBR0003482
        artikel: '86'
        hoofdstuk: '8'
        paragraaf: 4a
  - number: '64.2'
    text: |-
      Wanneer een militair tijdens een hem verleend vakantieverlof, inschepings- of ontschepingsverlof aanspraak kan
      maken op buitengewoon verlof als bedoeld in [artikel 85][ref1] of buitengewoon verlof in het kader van arbeid
      en zorg als bedoeld in [paragraaf 4b][ref2], wordt het vakantieverlof, inschepings- of ontschepingsverlof
      als niet verleend aangemerkt, maar, met inachtneming van [artikel 85, tweede lid][ref3], onderscheidenlijk
      [paragraaf 4b][ref4] als buitengewoon verlof dan wel buitengewoon verlof in het kader van arbeid en zorg
      aangemerkt, mits hij degene die het verlof heeft verleend, tijdig van de reden voor dat buitengewoon verlof in
      kennis heeft gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel85
      [ref2]: https://wetten.overheid.nl/BWBR0003482#Hoofdstuk8
      [ref3]: https://wetten.overheid.nl/BWBR0003482#Artikel85
      [ref4]: https://wetten.overheid.nl/BWBR0003482#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '85'
        hoofdstuk: '8'
        paragraaf: 4a
      - id: ref2
        bwb_id: BWBR0003482
        hoofdstuk: '8'
        paragraaf: 4b
      - id: ref3
        bwb_id: BWBR0003482
        artikel: '85'
        hoofdstuk: '8'
        paragraaf: 4a
      - id: ref4
        bwb_id: BWBR0003482
        hoofdstuk: '8'
        paragraaf: 4b
  - number: '65.1'
    text: |-
      Verleend verlof als bedoeld in [artikel 61, tweede lid, onderdelen a tot en met c][ref1], kan geheel of
      gedeeltelijk worden ingetrokken, indien de belangen van de dienst zulks naar het oordeel van degene die het verlof
      heeft verleend, uitdrukkelijk vorderen.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel61
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '61'
        hoofdstuk: '8'
        paragraaf: '1'
  - number: '65.2'
    text: |-
      Een dag waarop een militair door een maatregel als bedoeld in het eerste lid slechts voor een gedeelte verlof heeft
      genoten, wordt niet aangemerkt als een verlofdag.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel65
  - number: '65.3'
    text: |-
      Voorts kan verleend verlof als bedoeld in [artikel 61, tweede lid, onderdelen a tot en met c][ref1], geheel of
      gedeeltelijk worden ingetrokken op aanvraag van de betrokken militair, indien naar het oordeel van degene die het
      verlof heeft verleend, de belangen van de dienst zich daartegen niet verzetten.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel61
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '61'
        hoofdstuk: '8'
        paragraaf: '1'
  - number: '65.4'
    text: |-
      Buitengewoon verlof in het kader van arbeid en zorg eindigt met inachtneming van [paragraaf 4b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0003482
        hoofdstuk: '8'
        paragraaf: 4b
  - number: '66'
    text: |-
      De militair die voornemens is een verlof door te brengen buiten het land waar hij is geplaatst kan om redenen
      van operationele aard door degene die tot het verlenen van het verlof bevoegd is, worden verplicht hem van dat
      voornemen tijdig schriftelijk mededeling te doen onder vermelding van het land of de landen die hij tijdens zijn
      verlof zal bezoeken.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel66
  - number: '67.1'
    text: |-
      De militair aan wie een verlof is verleend en die geldelijke schade lijdt als gevolg van het geheel of gedeeltelijk
      intrekken van dat verlof krachtens [artikel 65, eerste lid][ref1], als gevolg van het geheel of gedeeltelijk
      beëindigen van dat verlof krachtens [artikel 65, vierde lid][ref2], of als gevolg van een verbod als bedoeld in
      [artikel 12e van de Militaire Ambtenarenwet 1931][ref3], heeft aanspraak op vergoeding van die schade, voor zover
      hij die redelijkerwijs niet heeft kunnen voorkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel65
      [ref2]: https://wetten.overheid.nl/BWBR0003482#Artikel65
      [ref3]: https://wetten.overheid.nl/BWBR0001952#Artikel12e
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '65'
        hoofdstuk: '8'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0003482
        artikel: '65'
        hoofdstuk: '8'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0001952
        artikel: 12e
  - number: '67.2'
    text: |-
      Aan de militair die met het oog op de besteding van een verlof waarop hij aanspraak kan doen gelden maar dat hem
      nog niet is verleend, met schriftelijke instemming van degene die tot het verlenen van het verlof bevoegd is,
      bepaalde voorzieningen heeft getroffen en:
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel67
  - number: 67.2.a
    text: |-
      aan wie het verlof wordt geweigerd om redenen die op het tijdstip waarop de instemming werd verleend niet konden
      worden voorzien, of
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel67
  - number: 67.2.b
    text: |-
      wiens voorgenomen besteding van het verlof als gevolg van een verbod als bedoeld in het eerste lid geen doorgang
      kan vinden, kan door de bevelhebber een gehele of gedeeltelijke vergoeding worden toegekend van de geldelijke
      schade die hij als gevolg van die weigering of dat verbod heeft geleden.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel67
  - number: 67a
    text: |-
      Indien een berekening van een vakantieverlof ingevolge de artikelen 69, 70, 71, 71a, 74, 75, 80, 80a, 80b of 81
      niet uitmondt in een afgerond aantal uren, wordt een gedeelte van een uur naar boven afgerond tot een heel uur.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel67a
  - number: '68.1'
    text: |-
      De militair der zeemacht die gedurende een vol kalenderjaar als zodanig in werkelijke dienst is, heeft over dat
      jaar aanspraak op het navolgende vakantieverlof:
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel68
  - number: 68.1.a
    text: 'in het tijdvak van 1 juni tot 15 september: een aaneengesloten zomerverlof, omvattende 120 uren;'
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel68
  - number: 68.1.b
    text: |-
      in het tijdvak van 1 december van het lopende kalenderjaar tot 1 februari van het daarop volgende jaar: een
      aaneengesloten winterverlof, omvattende 80 uren;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel68
  - number: 68.1.c
    text: |-
      In het tijdvak van 1 januari tot en met 31 december op een tijdstip naar eigen keuze: 32 uren, zoveel mogelijk op
      te nemen in aaneengesloten perioden van ten minste 4 uren.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel68
  - number: '68.2'
    text: De bevelhebber kan voor bijzondere gevallen van het eerste lid afwijkende vakantieverloftijdstippen vaststellen.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel68
  - number: '68.3'
    text: 'De commandant kan een militair in bijzondere gevallen toestaan:'
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel68
  - number: 68.3.a
    text: |-
      het hem toekomende zomer- of winterverlof op te nemen buiten de tijdvakken, genoemd in het eerste lid, onder a en
      b, of
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel68
  - number: 68.3.b
    text: die verloven aaneengesloten op te nemen.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel68
  - number: '69.1'
    text: |-
      De militair der zeemacht die niet gedurende een vol kalenderjaar als zodanig in werkelijke dienst is, heeft -
      behalve indien hij in dienst is gekomen voor een periode van minder dan 85 dagen - over dat jaar aanspraak op het
      navolgende vakantieverlof:
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel69
  - number: 69.1.a
    text: 'indien hij in dienst is getreden:'
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel69
  - number: 69.1.a.(1)
    text: 'vóór 1 juni: op het in het vorige artikel bedoelde zomer- en winterverlof;'
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel69
  - number: 69.1.a.(2)
    text: 'op of na 1 juni doch vóór 1 november: op het in het vorige artikel bedoelde winterverlof;'
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel69
  - number: 69.1.b
    text: 'indien hij de dienst zal verlaten:'
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel69
  - number: 69.1.b.(1)
    text: |-
      vóór 1 juni: op een vijfde deel van het in het vorige artikel bedoelde aantal uren zomerverlof voor elke
      kalendermaand dat hij in werkelijke dienst zal zijn;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel69
  - number: 69.1.b.(2)
    text: 'in het tijdvak van 1 juni tot en met 31 augustus: op het in het vorige artikel bedoelde zomerverlof;'
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel69
  - number: 69.1.b.(3)
    text: |-
      in het tijdvak van 1 september tot en met 30 november: op het in het vorige artikel bedoelde zomerverlof alsmede op
      een derde deel van het in het vorige artikel bedoelde aantal uren winterverlof voor elke kalendermaand dat hij na
      31 augustus in werkelijke dienst zal zijn;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel69
  - number: 69.1.b.(4)
    text: 'op of na 1 december: op het in het vorige artikel bedoelde zomer- en winterverlof;'
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel69
  - number: 69.1.c
    text: |-
      op een twaalfde deel van het in het vorige artikel, eerste lid onder *c*, bedoelde vakantieverlof, voor elke maand
      dat hij in werkelijke dienst zal zijn.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel69
  - number: '69.2'
    text: |-
      In afwijking van het eerste lid kan aan de militair niettemin het in artikel 68 bedoelde zomer- en winterverlof
      worden verleend, indien de eenheid waar hij metterdaad dienst verricht gedurende de verlofperiode wordt gesloten.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel69
  - number: '69.3'
    text: Het tweede en derde lid van artikel 68 zijn van toepassing.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel69
  - number: '70.1'
    text: |-
      Over kalendermaanden gedurende de welke de militair der zeemacht in het geheel geen dienst verricht, heeft hij geen
      aanspraak op vakantieverlof. Over kalendermaanden gedurende de welke de militair der zeemacht gedeeltelijk dienst
      verricht, heeft hij slechts aanspraak op vakantieverlof naar evenredigheid van het gedeelte van de werktijd waarop
      hij feitelijk dienst verricht.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel70
  - number: '70.2'
    text: 'Het eerste lid is niet van toepassing:'
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel70
  - number: 70.2.a
    text: in geval geen dienst is verricht wegens verleend verlof, niet zijnde buitengewoon verlof;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel70
  - number: 70.2.b
    text: |-
      in geval geen dienst is verricht wegens zwangerschaps- en bevallingsverlof, als bedoeld in
      [artikel 3:1 van de Wet arbeid en zorg][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '3'
  - number: 70.2.c
    text: |-
      in geval gedurende een periode, korter dan 52 weken geen dienst is verricht wegens ziekte die niet aan schuld of
      nalatigheid van de militair is te wijten, waarbij een hervatting gedurende dertig kalenderdagen of minder geen
      nieuwe periode van 52 weken inluidt;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel70
  - number: 70.2.d
    text: in andere gevallen, indien degene die tot het verlenen van het verlof bevoegd is, daartoe aanleiding aanwezig acht.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel70
  - number: '70.3'
    text: |-
      Het vakantieverlof waarop een militair der zeemacht ingevolge [artikel 68][ref1] of [69][ref2] aanspraak maakt:


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel68
      [ref2]: https://wetten.overheid.nl/BWBR0003482#Artikel69
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '68'
        hoofdstuk: '8'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0003482
        artikel: '69'
        hoofdstuk: '8'
        paragraaf: '2'
  - number: 70.3.a
    text: |-
      wordt verminderd naar evenredigheid van de tijd gedurende welke hem langer durend zorgverlof als bedoeld in
      [artikel 87c][ref1], of ouderschapsverlof als bedoeld in [artikel 87d][ref2], is verleend;


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel87c
      [ref2]: https://wetten.overheid.nl/BWBR0003482#Artikel87b
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: 87c
        hoofdstuk: '8'
        paragraaf: 4b
      - id: ref2
        bwb_id: BWBR0003482
        artikel: 87b
        hoofdstuk: '8'
        paragraaf: 4b
  - number: 70.3.b
    text: |-
      kan, naar regels bij ministeriële regeling te stellen, worden verminderd naar evenredigheid van de tijd gedurende
      welke hem buitengewoon verlof als bedoeld in [artikel 12c, tweede lid, van de Militaire Ambtenarenwet 1931][ref1]
      of [artikel 86, aanhef en onder b][ref2], is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0001952#Artikel12c
      [ref2]: https://wetten.overheid.nl/BWBR0003482#Artikel86
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0001952
        artikel: 12c
      - id: ref2
        bwb_id: BWBR0003482
        artikel: '86'
        hoofdstuk: '8'
        paragraaf: 4a
  - number: '70.4'
    text: |-
      Het vakantieverlof waarop een militair der zeemacht ingevolge [artikel 68][ref1] of [69][ref2] aanspraak maakt
      wordt naar evenredigheid verminderd indien hem op grond van het [Besluit aanpassing arbeidsduur militairen][ref3]
      buitengewoon verlof in verband met deeltijdarbeid wordt verleend. In geval van vermeerdering van de arbeidsduur op
      grond van het [Besluit aanpassing arbeidsduur militairen][ref4] wordt de in de vorige volzin genoemde verminderde
      aanspraak op vakantieverlof naar evenredigheid vermeerderd.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel68
      [ref2]: https://wetten.overheid.nl/BWBR0003482#Artikel69
      [ref3]: https://wetten.overheid.nl/BWBR0011531
      [ref4]: https://wetten.overheid.nl/BWBR0011531
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '68'
        hoofdstuk: '8'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0003482
        artikel: '69'
        hoofdstuk: '8'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0011531
      - id: ref4
        bwb_id: BWBR0011531
  - number: '71.1'
    text: |-
      Aan een militair der zeemacht die naar het oordeel van de commandant. buiten zijn wil of toedoen het hem ingevolge
      artikel 68 of 69 toekomende zomer- en/of winterverlof geheel of gedeeltelijk niet heeft kunnen genieten gedurende
      het lopende kalenderjaar of in de maand januari van het volgende kalenderjaar, kan het niet genoten vakantieverlof
      alsnog worden verleend zodra dat mogelijk is, doch uiterlijk op een zodanig tijdstip dat het zal zijn genoten voor
      het einde van dat volgende kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel71
  - number: '71.2'
    text: |-
      Het vakantieverlof, bedoeld in artikel 68, eerste lid onder c, en 69, eerste lid onder c, dat in enig kalenderjaar
      niet is genoten, wordt in het volgende kalenderjaar verleend, echter tot ten hoogste de helft van het aantal in die
      leden onder c genoemde onderscheidenlijk bedoelde aantal uren.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel71
  - number: 71a.1
    text: |-
      Indien de militair op de datum waarop hij de werkelijke dienst verlaat nog aanspraak heeft op vakantieverlof, wordt
      hem voor ieder uur vakantieverlof dat hem niet is verleend een vergoeding toegekend ten bedrage van 1/165 deel
      van de bezoldiging per maand als bedoeld in artikel 1, eerste lid, onder k, van het Inkomstenbesluit militairen,
      waarop de militair direct voorafgaand aan zijn verlaten van de werkelijke dienst aanspraak had. De vergoeding wordt
      berekend over ten hoogste twee maal de aanspraak op vakantieverlof over een vol kalenderjaar, zoals die direct
      voorafgaand aan het verlaten van de werkelijke dienst van de militair voor hem gold.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel71a
  - number: 71a.2
    text: |-
      Indien op de dag, waarop de militair de werkelijke dienst verlaat, blijkt dat de militair teveel vakantieverlof
      heeft genoten, is hij voor ieder uur teveel genoten vakantieverlof, tenzij dit niet aan zijn schuld of toedoen te
      wijten is, een bedrag verschuldigd ten bedrage van 1/165 deel van de bezoldiging per maand als bedoeld in artikel
      1, eerste lid, onder k, van het Inkomstenbesluit militairen, waarop de militair direct voorafgaand aan zijn
      verlaten van de werkelijke dienst aanspraak had.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel71a
  - number: 71a.3
    text: |-
      Indien de militair uiterlijk veertien dagen na het tijdstip waarop hij in de loop van een kalenderjaar
      de werkelijke dienst verlaat weer in werkelijke dienst komt of wordt aangesteld als burgerlijk ambtenaar
      bij het Ministerie van Defensie, kan de militair, in afwijking van het eerste lid, ervoor kiezen de
      vakantieverlofaanspraken van het lopende kalenderjaar die niet zijn genoten, te behouden. Daarbij wordt
      vakantieverlof dat in het lopende kalenderjaar is verleend in mindering gebracht op de aanspraken in dat jaar.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel71a
  - number: 71a.4
    text: |-
      Het eerste en derde lid zijn niet van toepassing ten aanzien van op 31 december 1996 nog niet verleend
      vakantieverlof, dat, wanneer het nog niet is genoten op de datum waarop de militair de werkelijke dienst verlaat,
      vervalt.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel71a
  - number: '73.1'
    text: |-
      De militair van de landmacht, de luchtmacht of de marechaussee, die gedurende een vol kalenderjaar als zodanig in
      werkelijke dienst is, heeft over dat jaar aanspraak op het navolgende vakantieverlof:
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel73
  - number: 73.1.a
    text: 'een militair beneden de rang van majoor: 184 uren;'
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel73
  - number: 73.1.b
    text: 'een militair met de rang van majoor of een hogere rang: 192 uren.'
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel73
  - number: '73.2'
    text: |-
      Voor de toepassing van het vorige lid is bepalend de rang of de stand die de militair op 1 januari van het
      kalenderjaar bekleedt.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel73
  - number: '73.3'
    text: |-
      De volgens het eerste lid vastgestelde aantallen uren vakantieverlof worden verhoogd volgens onderstaande tabel,
      afhankelijk van de leeftijd die de militair in het desbetreffende kalenderjaar bereikt:






                    leeftijd


                    verhoging






                    18 jaar en jonger


                    24 uren




                    19 jaar


                    16 uren




                    20 jaar


                    8 uren




                    van 30 tot en met 39 jaar


                    8 uren




                    van 40 tot en met 44 jaar


                    16 uren




                    van 45 tot en met 49 jaar


                    24 uren




                    van 50 tot en met 54 jaar


                    32 uren




                    van 55 tot en met 59 jaar


                    40 uren




                    60 jaar en ouder


                    48 uren
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel73
  - number: '74.1'
    text: |-
      De militair van de landmacht, de luchtmacht of de marechaussee die niet gedurende een vol kalenderjaar als zodanig
      in werkelijke dienst is, heeft - behalve indien hij in dienst is gekomen voor een periode van minder dan 85 dagen -
      over dat jaar aanspraak op het in het vorige artikel bedoelde vakantieverlof, vastgesteld naar evenredigheid van de
      tijd gedurende welke hij in dat jaar in werkelijke dienst is.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel74
  - number: '74.2'
    text: 'Voor de toepassing van het vorige lid is bepalend:'
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel74
  - number: 74.2.a
    text: |-
      indien de militair in de loop van het kalenderjaar als zodanig in werkelijke dienst komt: de rang of stand die hij
      op het tijdstip van indiensttreding bekleedt;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel74
  - number: 74.2.b
    text: |-
      indien de militair in de loop van het kalenderjaar de werkelijke dienst verlaat: de rang of stand die hij op 1
      januari van dat kalenderjaar bekleedt.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel74
  - number: '75.1'
    text: |-
      Over kalendermaanden gedurende de welke de militair van de landmacht, de luchtmacht of de marechaussee in het
      geheel geen dienst verricht, heeft hij geen aanspraak op vakantieverlof. Over kalendermaanden gedurende de welke
      de militair van de landmacht, de luchtmacht of de marechaussee gedeeltelijk dienst verricht, heeft hij slechts
      aanspraak op vakantieverlof naar evenredigheid van het gedeelte van de werktijd waarop hij feitelijk dienst
      verricht.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel75
  - number: '75.2'
    text: 'Het eerste lid is niet van toepassing:'
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel75
  - number: 75.2.a
    text: in geval geen dienst is verricht wegens verleend verlof, niet zijnde buitengewoon verlof;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel75
  - number: 75.2.b
    text: |-
      in geval geen dienst is verricht wegens zwangerschaps- en bevallingsverlof, als bedoeld in
      [artikel 3:1 van de Wet arbeid en zorg][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '3'
  - number: 75.2.c
    text: |-
      in geval gedurende een periode, korter dan 52 weken geen dienst is verricht wegens ziekte die niet aan schuld of
      nalatigheid van de militair is te wijten, waarbij een hervatting gedurende dertig kalenderdagen of minder geen
      nieuwe periode van 52 weken inluidt;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel75
  - number: 75.2.d
    text: in andere gevallen, indien degene die tot het verlenen van het verlof bevoegd is, daartoe aanleiding aanwezig acht.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel75
  - number: '75.3'
    text: |-
      Het vakantieverlof waarop een militair van de landmacht, de luchtmacht of de marechaussee ingevolge
      [artikel 73][ref1] of [74][ref2] aanspraak maakt:


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel73
      [ref2]: https://wetten.overheid.nl/BWBR0003482#Artikel74
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '73'
        hoofdstuk: '8'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0003482
        artikel: '74'
        hoofdstuk: '8'
        paragraaf: '3'
  - number: 75.3.a
    text: |-
      wordt verminderd naar evenredigheid van de tijd gedurende welke hem langer durend zorgverlof als bedoeld in
      [artikel 87c][ref1], of ouderschapsverlof als bedoeld in [artikel 87d][ref2], is verleend;


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel87c
      [ref2]: https://wetten.overheid.nl/BWBR0003482#Artikel87d
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: 87c
        hoofdstuk: '8'
        paragraaf: 4b
      - id: ref2
        bwb_id: BWBR0003482
        artikel: 87d
        hoofdstuk: '8'
        paragraaf: 4b
  - number: 75.3.b
    text: |-
      kan, naar regels bij ministeriële regeling te stellen, worden verminderd naar evenredigheid van de tijd gedurende
      welke hem buitengewoon verlof als bedoeld in [artikel 12c, tweede lid, van de Militaire Ambtenarenwet 1931][ref1]
      of [artikel 86, aanhef en onder b][ref2], is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0001952#Artikel12c
      [ref2]: https://wetten.overheid.nl/BWBR0003482#Artikel86
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0001952
        artikel: 12c
      - id: ref2
        bwb_id: BWBR0003482
        artikel: '86'
        hoofdstuk: '8'
        paragraaf: 4a
  - number: '75.4'
    text: |-
      Het vakantieverlof waarop een militair van de landmacht, de luchtmacht of de marechaussee ingevolge
      [artikel 73][ref1] of [74][ref2] aanspraak maakt, wordt naar evenredigheid verminderd indien hem op grond van het
      [Besluit aanpassing arbeidsduur militairen][ref3] buitengewoon verlof in verband met deeltijdarbeid wordt verleend.
      In geval van vermeerdering van de arbeidsduur op grond van het [Besluit aanpassing arbeidsduur militairen][ref4]
      wordt de in de vorige volzin genoemde verminderde aanspraak op vakantieverlof naar evenredigheid vermeerderd.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel73
      [ref2]: https://wetten.overheid.nl/BWBR0003482#Artikel74
      [ref3]: https://wetten.overheid.nl/BWBR0011531
      [ref4]: https://wetten.overheid.nl/BWBR0011531
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '73'
        hoofdstuk: '8'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0003482
        artikel: '74'
        hoofdstuk: '8'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0011531
      - id: ref4
        bwb_id: BWBR0011531
  - number: '75.5'
    text: |-
      Voor de militair van de landmacht, de luchtmacht of de marechaussee aan wie ten hoogste veertien dagen voor het
      tijdstip waarop hij in werkelijke dienst komt, ontslag is verleend uit een andere overheidsbetrekking, wordt het
      aantal uren vakantieverlof waarop ingevolge [artikel 73][ref1] of [74][ref2] aanspraak bestaat vermeerderd met
      zoveel uren vakantieverlof als hij uit hoofde van die vorige betrekking over het lopende kalenderjaar nog tegoed
      had.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel73
      [ref2]: https://wetten.overheid.nl/BWBR0003482#Artikel74
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '73'
        hoofdstuk: '8'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0003482
        artikel: '74'
        hoofdstuk: '8'
        paragraaf: '3'
  - number: '76.1'
    text: 'Vakantieverlof wordt aan een militair van de landmacht, de luchtmacht of de marechaussee verleend:'
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel76
  - number: 76.1.a
    text: op zijn aanvraag;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel76
  - number: 76.1.b
    text: |-
      niet op zijn aanvraag, voor zover naar het oordeel van degene die het verlof verleent, de belangen van de dienst
      dat vorderen.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel76
  - number: '76.2'
    text: |-
      Aan de militair dient in elk kalenderjaar ten minste 120 uren vakantieverlof te worden verleend, waarvan ten minste
      80 uren aaneengesloten of tot in evenredigheid lagere getallen indien de militair buitengewoon verlof in verband
      met deeltijdarbeid is verleend op grond van het [Besluit aanpassing arbeidsduur militairen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011531
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0011531
  - number: '77.1'
    text: Vakantieverlof wordt zoveel mogelijk opgenomen in aaneengesloten perioden van ten minste 4 uren.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel77
  - number: '77.2'
    text: |-
      Indien voor een militair van de landmacht, de luchtmacht of de marechaussee een periode of perioden is of zijn
      vastgesteld, gedurende welke hem vakantieverlof niet-op-aanvraag wordt verleend, wordt hem vakantieverlof op
      aanvraag zoveel mogelijk verleend voorafgaand aan of in aansluiting op die periode of perioden.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel77
  - number: '77.3'
    text: |-
      Onverminderd het bepaalde in het tweede lid van artikel 79, wordt aan de militair van de landmacht, de luchtmacht
      of de marechaussee op zijn aanvraag zoveel mogelijk een vakantieverlof in een door hem gekozen periode verleend van
      tenminste twee aaneengesloten weken.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel77
  - number: '78.1'
    text: |-
      Gedurende een bepaalde tijd, doch ten hoogste gedurende de eerste zes maanden nadat hij als zodanig in werkelijke
      dienst is gekomen, wordt aan een militair van de landmacht, de luchtmacht of de marechaussee op zijn aanvraag
      slechts zoveel maal een twaalfde deel van het hem ingevolge artikel 73 of 74 toekomende vakantieverlof verleend als
      hij volle maanden in werkelijke dienst is.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel78
  - number: '78.2'
    text: |-
      Het vorige lid blijft buiten toepassing, indien de militair onmiddellijk voorafgaand aan het tijdstip waarop hij
      als zodanig in werkelijke dienst kwam - een onderbreking van veertien dagen of minder buiten beschouwing gelaten -:
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel78
  - number: 78.2.a
    text: reeds uit anderen hoofde in werkelijke dienst verbleef, dan wel
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel78
  - number: 78.2.b
    text: reeds gedurende ten minste zes maanden een andere overheidsbetrekking vervulde.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel78
  - number: '78.3'
    text: |-
      Het eerste lid blijft eveneens buiten toepassing, indien aan de militair vakantieverlof niet-op-aanvraag wordt
      verleend.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel78
  - number: '79.1'
    text: |-
      Bij het verlenen van vakantieverlof niet-op-aanvraag, dat altijd ten minste 2 aaneengesloten werkdagen bedraagt,
      wordt zoveel mogelijk rekening gehouden met de belangen van de militair.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel79
  - number: '79.2'
    text: |-
      Van het aantal uren vakantieverlof dat een militair van de landmacht, de luchtmacht of de marechaussee in enig
      kalenderjaar toekomt, kunnen, in overleg met de medezeggenschapscommissie:
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel79
  - number: 79.2.a
    text: |-
      ten hoogste 120 uren als vakantieverlof niet-op-aanvraag worden verleend, in een periode van ten hoogste drie
      weken, dan wel
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel79
  - number: 79.2.b
    text: ten hoogste 40 uren als vakantieverlof niet-op-aanvraag worden verleend.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel79
  - number: '79.3'
    text: |-
      De in het tweede lid, onder *a*, bedoelde periode dient zoveel mogelijk te zijn gelegen in de periode van de
      zomervakanties in het onderwijs.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel79
  - number: '80.1'
    text: |-
      Niet verleend vakantieverlof, waaronder eventueel van vorige jaren overgeboekt vakantieverlof, wordt
      overgeboekt naar het volgende kalenderjaar tot een maximum van 80 uren of tot een evenredig lager
      getal indien de militair buitengewoon verlof in verband met deeltijdarbeid is verleend op grond van het
      [Besluit aanpassing arbeidsduur militairen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011531
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0011531
  - number: '80.2'
    text: |-
      Uitsluitend indien operationele omstandigheden het tot het verlof verlenen bevoegd gezag hebben verhinderd
      vakantieverlof te verlenen of, naar het oordeel van het tot het verlof verlenen bevoegd gezag, gewichtige
      persoonlijke omstandigheden de militair hebben verhinderd het vakantieverlof te genieten, kan worden afgeweken van
      het overeenkomstig het eerste lid maximaal naar het volgend kalenderjaar over te boeken vakantieverlof.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel80
  - number: '80.3'
    text: Het eerste lid is niet van toepassing ten aanzien van op 31 december 1996 nog niet verleend vakantieverlof.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel80
  - number: 80a.1
    text: |-
      Vakantieverlof op aanvraag dat in enig kalenderjaar teveel is verleend, wordt in mindering gebracht op het
      vakantieverlof over het volgende kalenderjaar of over de volgende twee of drie kalenderjaren, indien het teveel
      meer beloopt dan één derde onderscheidenlijk twee derde gedeelte van het de militair ingevolge artikel 73
      toekomende vakantieverlof.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel80a
  - number: 80a.2
    text: |-
      Het in enig kalenderjaar verleende vakantieverlof niet-op-aanvraag dat, uitsluitend omdat de militair reeds
      vakantieverlof op aanvraag is verleend, leidt tot overschrijding van het aan de militair toekomende aantal uren
      vakantieverlof in dat jaar, wordt niet in mindering gebracht op het vakantieverlof over het volgend kalenderjaar of
      de volgende kalenderjaren.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel80a
  - number: 80b.1
    text: |-
      Indien de militair op de datum waarop hij de werkelijke dienst verlaat nog aanspraak heeft op vakantieverlof, wordt
      hem voor ieder uur vakantieverlof dat hem niet is verleend een vergoeding toegekend ten bedrage van 1/165 deel van
      de bezoldiging per maand als bedoeld in [artikel 1, eerste lid, onder k, van het Inkomstenbesluit militairen][ref1],
      waarop de militair direct voorafgaand aan zijn verlaten van de werkelijke dienst aanspraak had. De vergoeding wordt
      berekend over ten hoogste twee maal de aanspraak op vakantieverlof over een vol kalenderjaar, zoals die direct
      voorafgaand aan het verlaten van de werkelijke dienst van de militair voor hem gold.


      [ref1]: https://wetten.overheid.nl/BWBR0007816#Artikel1
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel80b
    references:
      - id: ref1
        bwb_id: BWBR0007816
        artikel: '1'
  - number: 80b.2
    text: |-
      Indien op de dag, waarop de militair de werkelijke dienst verlaat, blijkt dat de militair teveel vakantieverlof
      heeft genoten, is hij voor ieder uur teveel genoten vakantieverlof, tenzij dit niet aan zijn schuld of toedoen
      te wijten is, een bedrag verschuldigd ten bedrage van 1/165 deel van de bezoldiging per maand als bedoeld in
      [artikel 1, eerste lid, onder k, van het Inkomstenbesluit militairen][ref1], waarop de militair direct voorafgaand
      aan zijn verlaten van de werkelijke dienst aanspraak had.


      [ref1]: https://wetten.overheid.nl/BWBR0007816#Artikel1
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel80b
    references:
      - id: ref1
        bwb_id: BWBR0007816
        artikel: '1'
  - number: 80b.3
    text: |-
      Indien de militair uiterlijk veertien dagen na het tijdstip waarop hij in de loop van een kalenderjaar
      de werkelijke dienst verlaat weer in werkelijke dienst komt of wordt aangesteld als burgerlijk ambtenaar
      bij het Ministerie van Defensie, kan de militair, in afwijking van het eerste lid, ervoor kiezen de
      vakantieverlofaanspraken van het lopende kalenderjaar die niet zijn genoten, te behouden. Daarbij wordt
      vakantieverlof dat in het lopende kalenderjaar is verleend in mindering gebracht op de aanspraken in dat jaar.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel80b
  - number: 80b.4
    text: |-
      Het eerste en derde lid zijn niet van toepassing ten aanzien van op 31 december 1996 nog niet verleend
      vakantieverlof, dat, wanneer het nog niet is genoten op de datum waarop de militair de werkelijke dienst verlaat,
      vervalt.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel80b
  - number: '81.1'
    text: |-
      Bij ministeriële regeling kunnen regels worden vastgesteld die afwijken van de artikelen 68 tot en met 71 en 73 tot
      en met 80, indien de belangen van de dienst een zodanige afwijking vorderen.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel81
  - number: '81.2'
    text: |-
      Indien op een militair een afwijkende verlofregeling als bedoeld in het eerste lid van toepassing is, zijn de
      artikelen 68 tot en met 71 en 73 tot en met 80 niet van toepassing en worden vakantieverloftegoeden, opgebouwd op
      grond van die artikelen voor dat de afwijkende verlofregeling op de militair van toepassing werd, bevroren. Verlof,
      opgebouwd op grond van de afwijkende verlofregeling, vervalt op het moment dat de afwijkende verlofregeling niet
      meer van toepassing is.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel81
  - number: '81.3'
    text: |-
      Indien een militair kan aantonen dat hij gedurende de tijd dat op hem een afwijkende verlofregeling van toepassing
      is geweest, minder uren vakantieverlof heeft kunnen opnemen dan het aantal uren vakantieverlof waarop hij aanspraak
      had kunnen maken op grond van de artikelen 68 tot en met 71 en 73 tot en met 80, indien op hem de afwijkende
      verlofregeling niet van toepassing zou zijn geweest, heeft hij aanspraak op het resterende verschil in uren
      vakantieverlof.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel81
  - number: '81.4'
    text: |-
      De militair, op wie over een gedeelte van een kalenderjaar een afwijkende verlofregeling als bedoeld in het
      eerste lid van toepassing is, heeft over het overblijvende gedeelte van dat jaar aanspraak op vakantieverlof naar
      evenredigheid van de tijd gedurende welke hij in dat gedeelte in werkelijke dienst is.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel81
  - number: '83.1'
    text: |-
      Aan de militair die is aangewezen voor het verrichten van dienst buiten Europa dan wel aan boord van een
      varend schip buiten Nederland en om die reden naar verwachting ten minste 6 maanden achtereen buiten Europa
      onderscheidenlijk buiten Nederland zal verblijven, wordt uiterlijk vóór de dag van vertrek inschepingsverlof
      verleend voor:
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel83
  - number: 83.1.a
    text: |-
      5 werkdagen, indien het verblijf buiten Europa dan wel aan boord van een varend schip buiten Nederland naar
      verwachting minder dan 9 maanden achtereen zal duren;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel83
  - number: 83.1.b
    text: |-
      10 werkdagen, indien het verblijf buiten Europa dan wel aan boord van een varend schip buiten Nederland naar
      verwachting 9 maanden of meer zal duren.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel83
  - number: '83.2'
    text: |-
      Aan de militair die is aangewezen voor het verrichten van dienst buiten Nederland in Europa, anders dan aan
      boord van een varend schip en om die reden naar verwachting ten minste 6 maanden achtereen buiten Nederland zal
      verblijven, wordt uiterlijk vóór de dag van vertrek inschepingsverlof verleend voor ten hoogste 5 werkdagen.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel83
  - number: '83.3'
    text: |-
      Ten aanzien van de militair die inschepingsverlof heeft genoten en die zijn bestemming niet volgt ten gevolge
      van omstandigheden afhankelijk van zijn wil of toedoen, kan de bevelhebber dat verlof aanmerken als verleend
      vakantieverlof.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel83
  - number: '84.1'
    text: |-
      De militair heeft na een verblijf voor dienst buiten Europa dan wel aan boord van een varend schip buiten Nederland
      gedurende één maand of langer achtereen, aanspraak op ontschepingsverlof van één werkdag voor elke maand dat het
      verblijf voor dienst buiten Europa dan wel aan boord van een varend schip buiten Nederland heeft geduurd, zulks met
      een maximum van 20 werkdagen.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel84
  - number: '84.2'
    text: |-
      Het ontschepingsverlof, bedoeld in het eerste lid, wordt aaneengesloten of in gedeelten aan de militair verleend zo
      spoedig mogelijk nadat hij in Nederland is teruggekeerd.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel84
  - number: '84.3'
    text: |-
      Aan de militair wordt na een verblijf voor dienst buiten Nederland in Europa, anders dan aan boord van een varend
      schip, van ten minste 6 maanden achtereen, ten hoogste 5 werkdagen ontschepingsverlof verleend.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel84
  - number: '84.4'
    text: |-
      De aanspraak op ontschepingsverlof dat binnen 12 maanden na terugkeer niet is genoten, vervalt. De bevelhebber
      kan bepalen dat het ontschepingsverlof alsnog na het verstrijken van dat tijdvak wordt verleend, indien naar zijn
      oordeel bijzondere omstandigheden, verband houdende met de dienst, het verlenen van ontschepingsverlof aan de
      betrokken militair binnen dat tijdvak hebben belet.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel84
  - number: '85.1'
    text: 'Aan de militair wordt op zijn aanvraag buitengewoon verlof met behoud van militaire inkomsten verleend:'
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel85
  - number: 85.1.a
    text: tot het bijwonen van vergaderingen van organen van het georganiseerd overleg militairen;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel85
  - number: 85.1.b
    text: |-
      voor het verrichten van werkzaamheden ten behoeve van verenigingen van militairen, die
      aangesloten zijn bij een tot het overleg toegelaten centrale van overheidspersoneel als bedoeld in
      [artikel 4 van het Besluit georganiseerd overleg sector Defensie][ref1], zulks volgens bij ministeriële regeling te
      stellen regels.


      [ref1]: https://wetten.overheid.nl/BWBR0006042#Artikel4
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0006042
        artikel: '4'
  - number: 85.1.c
    text: |-
      tot het verkrijgen van woonruimte, indien de plaats waar hij in de regel zijn dienst verricht, verandert: voor ten
      hoogste twee werkdagen ingeval het land van plaatsing niet verandert, en voor ten hoogste vier werkdagen indien het
      land van plaatsing wel verandert, welke dagen desgewenst in halve dagen kunnen worden verleend;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel85
  - number: 85.1.d
    text: |-
      bij verhuizing, indien de plaats waar hij in de regel zijn dienst verricht, verandert: voor ten hoogste vier
      werkdagen, indien de militair een eigen huishouding voert, of voor ten hoogste twee werkdagen, indien zulks niet
      het geval is;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel85
  - number: 85.1.e
    text: 'bij zijn ondertrouw: voor één werkdag, indien de ondertrouw op zulk een dag valt;'
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel85
  - number: 85.1.f
    text: |-
      bij zijn huwelijk: voor vier werkdagen, met dien verstande dat de militair dat verlof desgewenst kan opnemen
      gedeeltelijk ten tijde van de voltrekking van het huwelijk en gedeeltelijk ten tijde van de godsdienstige
      plechtigheden die verband houden met het huwelijk;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel85
  - number: 85.1.g
    text: |-
      bij het huwelijk van bloed- of aanverwanten in de eerste graad, van stief- of pleegouders, dan wel van stief- of
      pleegkinderen: voor één werkdag, indien het huwelijk wordt voltrokken in de woonplaats van de militair, en voor ten
      hoogste twee werkdagen, indien het huwelijk buiten die plaats wordt voltrokken;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel85
  - number: 85.1.h
    text: |-
      bij de toekenning van een diensttijdgratificatie wegens het volbrengen van een diensttijd van 25 of 35 jaren, en
      bij zijn vijfentwintig- en veertigjarig huwelijksjubilieum: voor één werkdag, indien de datum van de gebeurtenis op
      zulk een dag valt of op zulk een dag wordt gevierd;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel85
  - number: 85.1.i
    text: |-
      tot het bijwonen van het vijfentwintig-, het veertig-, het vijftig- en het zestigjarig huwelijksjubileum van zijn
      ouders, stief-, pleeg-, schoon- of grootouders: voor één werkdag, indien het jubileum op zulk een dag valt of op
      zulk een dag wordt gevierd;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel85
  - number: 85.1.j
    text: |-
      tot het deelnemen aan een bezinningsbijeenkomst, georganiseerd door of met medewerking van een dienst van de
      geestelijke verzorging bij de krijgsmacht: eenmaal per kalenderjaar voor ten hoogste twee werkdagen;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel85
  - number: 85.1.k
    text: |-
      voor het afleggen van bezoeken of het voldoen aan oproepingen, verband houdende met het zoeken van een werkkring:
      gedurende de laatste zes maanden van zijn verblijf in werkelijke dienst voor in totaal ten hoogste vier werkdagen;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel85
  - number: '85.2'
    text: |-
      Buitengewoon verlof als bedoeld in het eerste lid wordt niet verleend en verleend verlof wordt ingetrokken, indien
      het niet zal of kan worden gebruikt voor het doel waarvoor het is bestemd.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel85
  - number: '86'
    text: |-
      In andere gevallen dan die, genoemd in artikel 85, kan aan de militair op zijn aanvraag buitengewoon verlof worden
      verleend, indien naar het oordeel van degene die bevoegd is het verlof te verlenen bijzondere redenen daartoe
      aanleiding geven, met dien verstande dat:
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel86
  - number: 86.a
    text: de commandant dit verlof slechts kan verlenen voor ten hoogste 10 werkdagen per kalenderjaar en
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel86
  - number: 86.b
    text: |-
      de bevelhebber dit – zonder de onder a bedoelde beperking van het aantal werkdagen per kalenderjaar –, eveneens kan
      verlenen al of niet met behoud van militaire inkomsten of een gedeelte daarvan naar nader bij ministeriële regeling
      te stellen regels.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel86
  - number: '87.1'
    text: |-
      De bevelhebber kan, indien daartoe naar zijn oordeel aanleiding bestaat, aan de militair op diens aanvraag
      buitengewoon verlof van lange duur verlenen, al of niet met behoud van militaire inkomsten en volgens nader bij
      ministeriële regeling te stellen regels.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel87
  - number: '87.2'
    text: |-
      Indien het verlof, bedoeld in het vorige lid, uitsluitend het persoonlijk belang van de militair dient, kan hem dat
      verlof slechts worden verleend zonder behoud van militaire inkomsten en voor ten hoogste zes maanden.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel87
  - number: '87.3'
    text: |-
      Indien het verlof, bedoeld in het eerste lid, ten doel heeft de militair in de gelegenheid te stellen een functie
      buiten de krijgsmacht te vervullen en met de verlening van het verlof naar het oordeel van de bevelhebber niet
      alleen het persoonlijke belang van de militair, maar mede het algemeen belang wordt gediend, kan het verlof -
      onverminderd het bepaalde in het vierde lid - in beginsel worden verleend voor ten hoogste een jaar en zonder
      behoud van militaire inkomsten.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel87
  - number: '87.4'
    text: |-
      Indien het verlof, bedoeld in het eerste lid, ten doel heeft de militair in de gelegenheid te stellen anders dan
      in vaste dienst, hetzij een functie te vervullen in dienst van een volkenrechtelijke organisatie, hetzij tijdelijk
      werkzaam te zijn ten behoeve van de Nederlandse Antillen dan wel als deskundige ten behoeve van een vreemde
      mogendheid, en naar het oordeel van de bevelhebber met de verlening van het verlof in overwegende mate het algemeen
      belang wordt gediend, kan het verlof in beginsel worden verleend voor ten hoogste drie jaren en zonder behoud van
      militaire inkomsten.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel87
  - number: '87.5'
    text: |-
      Het verlof, bedoeld in de vorige leden, gaat niet eerder in dan na aanvaarding van dat verlof met de daaraan
      verbonden voorwaarden door de militair.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel87
  - number: 87a.1
    text: |-
      Onverminderd [artikel 4:1 van de Wet arbeid en zorg][ref1] wordt aan de militair buitengewoon verlof met behoud van
      militaire inkomsten verleend: - bij plotselinge ziekte van de echtgenote of echtgenoot van de militair, de persoon
      met wie de militair ongehuwd samenwoont of een van zijn bloed- of aanverwanten in de eerste graad of wanneer
      een andere noodsituatie, waarvoor de militair onverwijld een voorziening moet treffen, ontstaat: voor de duur
      benodigd voor de eerste opvang en het treffen van verdere voorzieningen, maar voor ten hoogste één werkdag per zich
      voordoende situatie;
        - bij de bevalling van zijn echtgenote of de persoon met wie de militair ongehuwd samenwoont;
        - bij overlijden en lijkbezorging van de echtgenote of echtgenoot van de militair, de persoon met wie de militair
      ongehuwd samenwoont of een van zijn bloed- en aanverwanten in de eerste graad: vanaf het overlijden tot en met
      de dag van de begrafenis of de crematie en indien sprake is van bijzondere godsdienstige plechtigheden zoveel
      werkdagen als benodigd om overeenkomstig de bepalingen van die godsdienst rouwceremoniën te verrichten;
        - bij overlijden van: bloed- of aanverwanten in de 2e graad, dan wel van pleegbroers of -zusters: voor ten hoogste
      2 werkdagen; bloed- of aanverwanten in de 3e of 4e graad of een van zijn huisgenoten: voor 1 werkdag, met dien
      verstande dat indien de militair is belast met de regeling van de begrafenis, de crematie of van de nalatenschap
      dan wel van beide, het verlof voor ten hoogste 4 werkdagen kan worden verleend en indien sprake is van bijzondere
      godsdienstige plechtigheden zoveel werkdagen als benodigd om overeenkomstig de bepalingen van die godsdienst
      rouwceremoniën te verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel4
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel87a
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '4'
  - number: 87a.2
    text: |-
      De militair meldt vooraf aan de commandant dat hij het verlof, bedoeld in het eerste lid, opneemt onder opgave
      van de reden. Indien dit niet mogelijk is, meldt de militair het opnemen van het verlof zo spoedig mogelijk aan de
      commandant onder opgave van de reden.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel87a
  - number: 87a.3
    text: |-
      Het verlof, bedoeld in het eerste lid, vangt niet aan of eindigt in ieder geval zodra de commandant aan hem kenbaar
      maakt dat tegen het opnemen van het verlof onderscheidenlijk de voortzetting daarvan een zodanig zwaarwegend
      dienstbelang bestaat, dat het belang van de militair daarvoor naar maatstaven van redelijkheid en billijkheid moet
      wijken.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel87a
  - number: 87a.4
    text: |-
      Van een zwaarwegend dienstbelang als bedoeld in het derde lid, is in ieder geval sprake bij het varen, het vliegen
      en oefeningen en de direct daarmee samenhangende werkzaamheden als mede de daadwerkelijke inzet van de krijgsmacht
      en de voorbereiding daarop.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel87a
  - number: 87a.5
    text: |-
      De commandant kan achteraf van de militair verlangen dat hij aannemelijk maakt dat hij geen dienst heeft kunnen
      verrichten wegens een van de redenen, genoemd in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel87a
  - number: 87b
    text: |-
      Het kort durend zorgverlof, bedoeld in [hoofdstuk 5 van de Wet arbeid en zorg][ref1], wordt verleend met behoud van
      militaire inkomsten.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel87b
    references:
      - id: ref1
        bwb_id: BWBR0013008
        hoofdstuk: '5'
  - number: 87c.1
    text: |-
      Aan de militair wordt langer durend zorgverlof met behoud van militaire inkomsten verleend voor hulpverlening aan
      een tijdelijk ernstig hulpbehoevende of stervende echtgenote, echtgenoot of persoon met wie de militair ongehuwd
      samenwoont, ouders, stief-, pleeg- of schoonouders, eigen of aangehuwde kinderen, stief- of pleegkinderen.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel87c
  - number: 87c.2
    text: |-
      Voor de toepassing van dit artikel is [artikel 87a][ref1], tweede tot en met vijfde lid, van overeenkomstige
      toepassing, waarbij de militair bij de melding, bedoeld in [artikel 87a, tweede lid][ref2], ook de omvang, de wijze
      van opneming en zo mogelijk de vermoedelijke duur van het verlof aangeeft.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel87a
      [ref2]: https://wetten.overheid.nl/BWBR0003482#Artikel87a
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel87c
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: 87a
        hoofdstuk: '8'
        paragraaf: 4b
      - id: ref2
        bwb_id: BWBR0003482
        artikel: 87a
        hoofdstuk: '8'
        paragraaf: 4b
  - number: 87d.1
    text: |-
      De in Nederland werkzame militair die als ouder in een familierechtelijke betrekking staat tot een kind heeft,
      indien hij ten minste één jaar in werkelijke dienst is, aanspraak op ouderschapsverlof. Indien de in Nederland
      werkzame militair met ingang van hetzelfde tijdstip tot meer dan één kind in familierechtelijke betrekking komt te
      staan, bestaat, indien hij ten minste één jaar in werkelijke dienst is, er ten aanzien van ieder van die kinderen
      aanspraak op ouderschapsverlof.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel87d
  - number: 87d.2
    text: |-
      De in Nederland werkzame militair die blijkens verklaringen uit de gemeentelijke basisadministratie op hetzelfde
      adres woont als een kind en duurzaam de verzorging en opvoeding van dat kind als eigen kind op zich heeft genomen,
      heeft, indien hij ten minste één jaar in werkelijke dienst is, eveneens aanspraak op ouderschapsverlof. Indien de
      in Nederland werkzame militair met het oog op adoptie met ingang van hetzelfde tijdstip de verzorging en opvoeding
      van meer dan één kind op zich heeft genomen, bestaat, indien hij ten minste één jaar in werkelijke dienst is,
      er ten aanzien van ieder van die kinderen aanspraak op ouderschapsverlof. In alle andere gevallen waarin de in
      de eerste volzin gestelde voorwaarden ten aanzien van meer dan één kind met ingang van hetzelfde tijdstip worden
      vervuld, bestaat slechts aanspraak op één keer ouderschapsverlof.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel87d
  - number: 87d.3
    text: |-
      Geen aanspraak op ouderschapsverlof bestaat over tijdvakken gelegen na de datum waarop het kind de leeftijd van
      acht jaren heeft bereikt.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel87d
  - number: 87d.4
    text: |-
      Het ouderschapsverlof wordt per week opgenomen gedurende een aaneengesloten periode van ten hoogste zes maanden en
      bedraagt per week ten hoogste de helft van de arbeidsduur per week.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel87d
  - number: 87d.5
    text: Het ouderschapsverlof wordt aan de militair verleend met behoud van 75% van zijn inkomsten.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel87d
  - number: 87d.6
    text: |-
      De militair kan door de bevelhebber worden verplicht tot terugbetaling van de tijdens het ouderschapsverlof
      genoten inkomsten wanneer hem tijdens de verlofperiode of binnen één jaar na afloop van het ouderschapsverlof
      ontslag wordt verleend op zijn aanvraag dan wel niet op zijn aanvraag op grond van aan de militair te wijten
      omstandigheden of, wanneer hij is aangesteld voor bepaalde tijd, ter zake van het eindigen van de tijd waarvoor de
      aanstelling is geschied. De verplichting tot terugbetaling wordt beperkt tot een bedrag dat evenredig is aan het
      aantal maanden dat ontbreekt aan de periode van één jaar. Indien het ontslag verband houdt met een aanstelling als
      burgerlijk ambtenaar bij het Ministerie van Defensie of indiensttreding bij een andere overheidssector bestaat geen
      verplichting tot terugbetaling.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel87d
  - number: 87d.7
    text: |-
      In afwijking van het vierde lid kan de militair de commandant verzoeken om: - ouderschapsverlof voor een langere
      periode dan zes maanden, of
        - het ouderschapsverlof op te delen in ten hoogste drie perioden, waarbij iedere periode ten minste een maand
      bedraagt, of
        - meer uren ouderschapsverlof per week dan de helft van de arbeidsduur per week, mits daardoor het maximale aantal
      ouderschapsverlofuren dat op grond van het vierde lid kan worden verleend niet wordt overschreden.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel87d
  - number: 87d.8
    text: |-
      De militair meldt het voornemen om ouderschapsverlof te nemen ten minste zes maanden voor het tijdstip van ingang
      van het ouderschapsverlof schriftelijk aan de commandant onder opgave van:
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel87d
  - number: 87d.8.a
    text: de aaneengesloten periode van het ouderschapsverlof;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel87d
  - number: 87d.8.b
    text: het aantal uren ouderschapsverlof per week;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel87d
  - number: 87d.8.c
    text: de spreiding van deze verlofuren over de week.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel87d
  - number: 87d.9
    text: |-
      De commandant kan na overleg met de militair, de spreiding van de uren over de week op grond van gewichtige redenen
      van dienstbelang wijzigen en wel tot vier weken vóór het door de militair opgegeven tijdstip van ingang van het
      ouderschapsverlof.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel87d
  - number: 87d.10
    text: |-
      De commandant is gehouden in te stemmen met een verzoek van de militair het ouderschapsverlof niet op te nemen
      of niet voort te zetten op grond van onvoorziene omstandigheden, tenzij gewichtige redenen van dienstbelang zich
      hiertegen verzetten. De commandant behoeft aan dat aanvraag niet met ingang van een vroeger tijdstip gevolg te
      geven dan vier weken na indiening van het aanvraag. In het geval dat het ouderschapsverlof met toepassing van de
      eerste volzin, na het tijdstip van ingang daarvan niet wordt voortgezet, vervalt de aanspraak op het overige deel
      van dat ouderschapsverlof.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel87d
  - number: 87d.11
    text: |-
      De commandant kan bepalen dat de aanspraak op ouderschapsverlof op grond van gewichtige redenen van dienstbelang
      wordt opgeschort.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel87d
  - number: 87d.12
    text: |-
      Het gestelde in de [artikelen 63][ref1], [64][ref2], [65][ref3] en [67][ref4] is niet van toepassing op de militair
      die ouderschapsverlof geniet.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel63
      [ref2]: https://wetten.overheid.nl/BWBR0003482#Artikel64
      [ref3]: https://wetten.overheid.nl/BWBR0003482#Artikel65
      [ref4]: https://wetten.overheid.nl/BWBR0003482#Artikel67
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel87d
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '63'
        hoofdstuk: '8'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0003482
        artikel: '64'
        hoofdstuk: '8'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0003482
        artikel: '65'
        hoofdstuk: '8'
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0003482
        artikel: '67'
        hoofdstuk: '8'
        paragraaf: '1'
  - number: '88.1'
    text: |-
      Voor de toepassing van dit hoofdstuk wordt, ingeval het betreft buitengewoon verlof anders dan van lange duur of
      buitengewoon verlof in het kader van arbeid en zorg, toekomend aan een militair die werkzaamheden en/of diensten
      in continu- of ploegendienst verricht, onder werkdag verstaan elke tijdseenheid van ten hoogste vierentwintig
      uur gedurende welke de militair volgens het voor hem geldende rooster zodanige werkzaamheden en/of diensten moet
      verrichten.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel88
  - number: '88.2'
    text: |-
      Indien aan de in het eerste lid bedoelde militair met toepassing van [artikel 85][ref1], [86][ref2] of
      [paragraaf 4b][ref3] buitengewoon verlof onderscheidenlijk buitengewoon verlof in het kader van arbeid en zorg
      wordt verleend kan daarbij:


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel85
      [ref2]: https://wetten.overheid.nl/BWBR0003482#Artikel86
      [ref3]: https://wetten.overheid.nl/BWBR0003482#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel88
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '85'
        hoofdstuk: '8'
        paragraaf: 4a
      - id: ref2
        bwb_id: BWBR0003482
        artikel: '86'
        hoofdstuk: '8'
        paragraaf: 4a
      - id: ref3
        bwb_id: BWBR0003482
        hoofdstuk: '8'
        paragraaf: 4b
  - number: 88.2.a
    text: |-
      overschrijding plaatsvinden van het met toepassing van het vorige lid vastgestelde aantal tijdseenheden
      buitengewoon verlof, indien zulks nodig is ter verwezenlijking van het met het buitengewoon verlof beoogde doel;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel88
  - number: 88.2.b
    text: |-
      vermindering plaatsvinden van het met toepassing van het vorige lid vastgestelde aantal tijdseenheden buitengewoon
      verlof, indien met minder tijdseenheden kan worden volstaan voor de verwezenlijking van het met het buitengewoon
      verlof beoogde doel.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel88
  - number: '90'
    text: 'Voor de toepassing van de artikelen 90a en 90b wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel90
  - number: 90.a
    text: |-
      *militair in werkelijke dienst:* de militair in werkelijke dienst genoemd in artikel 1, eerste lid, onder c, met
      inbegrip van de militair aan wie buitengewoon verlof met behoud van militaire inkomsten is verleend;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel90
  - number: 90.b
    text: |-
      *gewezen militair:* de gewezen militair, bedoeld in
      [artikel 1, derde lid, van de Militaire ambtenarenwet 1931][ref1], aan wie:


      [ref1]: https://wetten.overheid.nl/BWBR0001952#Artikel1
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0001952
        artikel: '1'
  - number: 90.b.1
    text: |-
      op of na de datum van inwerkingtreding van deze bepaling ontslag is verleend als bedoeld in
      [artikel 1, eerste lid, onder b, van de Uitkeringswet gewezen militairen][ref1] dan wel met
      toepassing van artikel 39, tweede lid onder d, is ontslagen en ingevolge artikel 1 van de Wet van 1
      oktober 1992, houdende bijzondere regels met betrekking tot het recht op uitkering als bedoeld in de
      [Uitkeringswet gewezen militairen][ref2] alsmede wijziging van die wet (Stb. 573) een uitkering geniet ingevolge
      [artikel 2 van de Uitkeringswet gewezen militairen][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0002540#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002540
      [ref3]: https://wetten.overheid.nl/BWBR0002540#Artikel2
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0002540
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002540
      - id: ref3
        bwb_id: BWBR0002540
        artikel: '2'
  - number: 90.b.2
    text: |-
      vóór de datum van inwerkingtreding van deze bepaling ontslag is verleend als bedoeld in
      [artikel 1, eerste lid, onder b, van de Uitkeringswet gewezen militairen][ref1] dan wel met
      toepassing van artikel 39, tweede lid onder d, is ontslagen en ingevolge artikel 1 van de Wet van 1
      oktober 1992, houdende bijzondere regels met betrekking tot het recht op uitkering als bedoeld in de
      [Uitkeringswet gewezen militairen][ref2] alsmede wijziging van die wet (Stb. 573) een uitkering geniet
      ingevolge [artikel 2 van de Uitkeringswet gewezen militairen][ref3], voorzover hij zich binnen twee jaar na de
      inwerkingtreding van deze bepaling vrijwillig voor verzekering heeft aangemeld.


      [ref1]: https://wetten.overheid.nl/BWBR0002540#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002540
      [ref3]: https://wetten.overheid.nl/BWBR0002540#Artikel2
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0002540
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002540
      - id: ref3
        bwb_id: BWBR0002540
        artikel: '2'
  - number: 90.c
    text: '*militair:*'
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel90
  - number: 90.c.1
    text: de militair in werkelijke dienst;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel90
  - number: 90.c.2
    text: de gewezen militair.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel90
  - number: 90.d
    text: '*gezinslid:*'
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel90
  - number: 90.d.1
    text: de echtgenote van de militair, die niet van tafel en bed is gescheiden;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel90
  - number: 90.d.2
    text: de tot het gezin van de militair behorende kinderen die de leeftijd van 21 jaar nog niet hebben bereikt;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel90
  - number: 90.d.3°
    text: |-
      de door de in artikel 90b genoemde rechtspersoon nader aan te wijzen tot het gezin van de militair behorende
      kinderen die de leeftijd van 27 jaar nog niet hebben bereikt, waarbij de nadere aanwijzing goedkeuring behoeft van
      Onze Minister.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel90
  - number: 90a.1
    text: |-
      De militair in werkelijke dienst is verzekerd voor geneeskundige verzorging aan de militair verleend door of
      vanwege de voor hem aangewezen militair geneeskundige dienst.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel90a
  - number: 90a.2
    text: |-
      De gewezen militair is verzekerd voor de door hem gemaakte kosten van geneeskundige verzorging, tenzij hij na
      dienstverlating schriftelijk aan de rechtspersoon als genoemd in artikel 90b te kennen heeft gegeven dat hij
      blijvend niet aan de verzekering wenst deel te nemen.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel90a
  - number: 90a.3
    text: Bij ministeriële regeling wordt de omvang van de geneeskundige zorg vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel90a
  - number: 90a.4
    text: |-
      Bij ministeriële regeling wordt de in verband met de verzekering verschuldigde premie vastgesteld overeenkomstig
      een daartoe strekkend voorstel van de in artikel 90b bedoelde rechtspersoon. De premie wordt ingehouden op de
      bezoldiging of uitkering van de militair, voor zover door Onze Minister niet in de premie wordt bijgedragen.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel90a
  - number: 90a.5
    text: |-
      De militair heeft op grond van de in het eerste en tweede lid bedoelde verzekering op zijn verzoek aanspraak op
      vergoeding van door hem ten behoeve van zijn gezinsleden gemaakte kosten van geneeskundige verzorging bij de in
      artikel 90b bedoelde rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel90a
  - number: 90a.6
    text: |-
      Onze Minister draagt op bij ministeriële regeling te bepalen wijze bij in de in het vierde lid bedoelde premie.
      Onze Minister kan tevens bijdragen in de door de militair voor zijn gezinsleden verschuldigde wettelijke heffingen
      ter zake van ziektekostenverzekeringen.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel90a
  - number: 90a.7
    text: 'Aan de verzekering kunnen geen aanspraken worden ontleend door of ten behoeve van:'
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel90a
  - number: 90a.7.a
    text: |-
      de militair die niet doorlopend in werkelijke dienst is, dan wel de met toepassing van artikel 11 tijdelijk
      aangestelde militair, indien hij naar verwachting voor een periode van minder dan 100 dagen aaneengesloten in
      werkelijke dienst zal verblijven en diens gezinsleden, alsmede degene die tijdens een vredes- of humanitaire
      operatie in het buitenland plaatselijk is geworven en met toepassing van artikel 11 tijdelijk is aangesteld als
      militair, en diens gezinsleden;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel90a
  - number: 90a.7.b
    text: |-
      het gezinslid van een militair dat uit eigen hoofde aanspraak heeft of geldend had kunnen maken op gehele of
      gedeeltelijke tegemoetkoming in de kosten van geneeskundige verzorging.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel90a
  - number: 90a.7.c
    text: |-
      het gezinslid van een in werkelijke dienst verblijvende militair dat op grond van
      [artikel 3d, eerste lid, van de Ziekenfondswet][ref1], verplicht verzekerd is.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel3d
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel90a
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: 3d
  - number: 90a.8
    text: |-
      De minister vergoedt, op bij ministeriële regeling vast te stellen wijze, de ten laste van de in het zevende
      lid, onder a genoemde militairen blijvende kosten van de ziektekostenverzekering die zij als burger verplicht
      of vrijwillig voor zichzelf hebben afgesloten, voor de duur van de periode waarin zij als militair in werkelijke
      dienst verblijven.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel90a
  - number: 90a.9
    text: |-
      De in het vierde lid bedoelde ministeriële regeling vormt geen onderwerp van overleg als bedoeld in
      [artikel 3 van het Besluit georganiseerd overleg sector Defensie][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006042#Artikel3
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel90a
    references:
      - id: ref1
        bwb_id: BWBR0006042
        artikel: '3'
  - number: 90b.1
    text: |-
      Een door Onze Minister aan te wijzen rechtspersoon is belast met de uitvoering van de in artikel 90*a* bedoelde
      verzekering.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel90b
  - number: 90b.2
    text: |-
      De voorzitter en de overige leden van het bestuur van de rechtspersoon worden benoemd en ontslagen door Onze
      Minister.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel90b
  - number: 90b.3
    text: Wijzigingen in de statuten van de rechtspersoon worden ter goedkeuring voorgelegd aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel90b
  - number: 90b.4
    text: |-
      De vaststelling van de omvang van de in artikel 90*a*, vijfde lid, bedoelde vergoedingen geschiedt door de
      rechtspersoon en behoeft goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel90b
  - number: 90b.5
    text: |-
      De rechtspersoon verstrekt Onze Minister informatie met betrekking tot de uitvoering van de verzekering, waaronder
      jaarlijks een jaarrekening die is voorzien van een verklaring omtrent de getrouwheid en de rechtmatigheid afgegeven
      door een accountant als bedoeld in [artikel 393 van Boek 2 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel90b
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: 90b.6
    text: |-
      Onze Minister kan de in het eerste lid bedoelde aanwijzing intrekken, wanneer de rechtspersoon tekortschiet in de
      uitvoering van de verzekering dan wel de verplichtingen genoemd in dit artikel niet nakomt.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel90b
  - number: '91.1'
    text: |-
      De militair in werkelijke dienst die wegens ziekte geheel of gedeeltelijk verhinderd is dienst te verrichten, is
      verplicht, naar regels bij ministeriële regeling te stellen, daarvan kennis te geven aan zijn commandant en een
      (tand)arts te consulteren.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel91
  - number: '91.2'
    text: |-
      De in het vorige lid bedoelde militair kan op verzoek van zijn commandant door of vanwege de militair geneeskundige
      dienst aan een onderzoek worden onderworpen ter beantwoording van de vragen:
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel91
  - number: 91.2.a
    text: óf, in welke mate en tot welk tijdstip er van die verhindering tot dienstverrichting sprake is;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel91
  - number: 91.2.b
    text: |-
      of verdere maatregelen of voorzieningen nodig zijn in het belang van het herstel van zijn gezondheid, dan wel in
      het belang van het behoud, het herstel of de bevordering van zijn geschiktheid voor de dienst.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel91
  - number: '91.3'
    text: |-
      De militair in werkelijke dienst is in geval van ziekte verplicht zich te houden aan de voorschriften, hem door de
      behandelend (tand)arts gegeven, met dien verstande dat hij niet verplicht is zich te onderwerpen aan een ingreep
      van heelkundige aard of een andere kunstbewerking.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel91
  - number: '91.4'
    text: |-
      De militair in werkelijke dienst die zich onder behandeling heeft gesteld van een (tand)arts, niet behorende tot de
      voor hem aangewezen militair geneeskundige dienst, is verplicht hiervan kennis te geven aan deze dienst.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel91
  - number: 91a.1
    text: |-
      De commandant van de militair die verhinderd is dienst te verrichten wegens ziekte stelt na overleg met
      die militair en de militair geneeskundige dienst uiterlijk 13 weken na het ontstaan van de verhindering een
      reïntegratieplan op.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel91a
  - number: 91a.2
    text: Het reïntegratieplan wordt schriftelijk ter kennis gebracht van de militair en de militair geneeskundige dienst.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel91a
  - number: 91a.3
    text: |-
      De commandant draagt er zorg voor dat de ziekte van de militair uiterlijk op de eerste dag nadat die verhindering
      tot dienstverrichting 13 weken heeft geduurd wordt gemeld aan de met de uitvoering van de WAO belaste instelling.
      Deze melding gaat vergezeld van het reïntegratieplan en de resultaten van de uitvoering van dit plan.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel91a
  - number: 91a.4
    text: |-
      In geval van eigen risicodragerschap als bedoeld in artikel 75, eerste lid, van de WAO geschiedt de in het derde
      lid bedoelde melding uiterlijk op de eerste dag nadat de verhindering tot dienstverrichting zeven maanden heeft
      geduurd.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel91a
  - number: '92'
    text: |-
      Zodra de verhindering tot dienstverrichting heeft opgehouden te bestaan, is de in werkelijke dienst verblijvende
      militair verplicht zich te wenden tot de voor hem aangewezen militair geneeskundige dienst teneinde zo nodig een
      onderzoek te ondergaan ter beantwoording van de vraag of hij weer volledig geschikt kan worden geacht voor de
      uitoefening van de dienst. Hij is verplicht de dienst te hervatten, behoudens indien en voor zover door of vanwege
      vorenbedoelde geneeskundige dienst anders wordt bepaald.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel92
  - number: '93.1'
    text: |-
      De geneeskundige verzorging verleend door of vanwege de militair geneeskundige dienst omvat al de maatregelen,
      voorzieningen en geneeskundige verstrekkingen in het belang van de bescherming, het behoud, het herstel en de
      bevordering van de gezondheid van de militair alsmede in het belang van het behoud, het herstel en de bevordering
      van de geschiktheid van de militair voor de dienst.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel93
  - number: '93.2'
    text: |-
      De militair in werkelijke dienst is verplicht de maatregelen in acht te nemen die door de minister worden
      voorgeschreven ter bescherming van de gezondheid van de militair of die van anderen, zulks onverminderd de
      wettelijke mogelijkheden ten aanzien van bepaalde maatregelen van die verplichting te worden ontheven.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel93
  - number: '94.1'
    text: |-
      De militair in werkelijke dienst die in contact staat of kort geleden heeft gestaan met een persoon die een ziekte
      heeft waarvoor ingevolge het krachtens de Wet bestrijding infectieziekten en opsporing ziekteoorzaken (*Stb.* 1928,
      265) bepaalde een nominatieve aangifteplicht geldt, is verplicht daarvan ten spoedigste kennis te geven aan de voor
      hem aangewezen militair geneeskundige dienst.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel94
  - number: '94.2'
    text: |-
      In het geval, bedoeld in het eerste lid, mag de militair geen dienst verrichten en heeft hij geen toegang tot
      de plaats van zijn tewerkstelling dan met toestemming gegeven door of vanwege de voor hem aangewezen militair
      geneeskundige dienst. Hij is gehouden zich te gedragen naar de door of vanwege deze dienst gegeven aanwijzingen,
      welke mede kunnen bestaan in een verbod om zich naar een eenheid of onderdeel van de krijgsmacht te begeven.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel94
  - number: '94.3'
    text: |-
      Indien een militair krachtens het tweede lid geen dienst mag verrichten, wordt hij voor de toepassing van dit
      hoofdstuk geacht wegens ziekte verhinderd te zijn tot dienstverrichting.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel94
  - number: '95.1'
    text: |-
      De militair in werkelijke dienst kan worden verplicht zich periodiek te onderwerpen aan een geneeskundig en/of
      tandheelkundig onderzoek door of vanwege de voor hem aangewezen militair geneeskundige dienst.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel95
  - number: '95.2'
    text: |-
      Aan een geneeskundig en/of tandheelkundig onderzoek als bedoeld in het vorige lid zal in ieder geval worden
      onderworpen de militair die in verband met de uitoefening van zijn werkzaamheden aan bijzonder gevaar voor zijn
      gezondheid blootstaat, dan wel voor een goede vervulling van die werkzaamheden aan bijzondere gezondheidseisen
      moet voldoen.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel95
  - number: '96'
    text: |-
      De militair in werkelijke dienst kan worden verplicht zich te onderwerpen aan een geneeskundig en/of tandheelkundig
      onderzoek door of vanwege de voor hem aangewezen militair geneeskundige dienst, wanneer de bevelhebber dit
      noodzakelijk acht in verband met toelating tot een opleiding, plaatsing in een andere functie, plaatsing bij
      bepaalde onderdelen of in bepaalde gebieden, dan wel beëindiging van het verblijf in werkelijke dienst.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel96
  - number: '97'
    text: |-
      De militair in werkelijke dienst, van wie door zijn commandant op goede gronden wordt verondersteld dat zijn
      lichamelijke en/of geestelijke gesteldheid een beletsel vormt om naar behoren dienst te verrichten, kan, op verzoek
      van zijn commandant, worden onderworpen aan een geneeskundig en/of tandheelkundig onderzoek door of vanwege de voor
      hem aangewezen militair geneeskundige dienst.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel97
  - number: '98.1'
    text: |-
      Indien bij een onderzoek als bedoeld in de artikelen 95, 96, en 97 blijkt van een zodanige lichamelijke en/of
      geestelijke gesteldheid van de militair, dat zijn belangen of het dienstbelang zich tegen gehele of gedeeltelijke
      voortzetting van zijn werkzaamheden en/of diensten verzetten, wordt hij door zijn commandant geheel of gedeeltelijk
      van die werkzaamheden en/of diensten vrijgesteld. Alsdan kunnen hem door zijn commandant - in overleg met de
      betrokken militair geneeskundige dienst - passende andere werkzaamheden en/of diensten worden opgedragen.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel98
  - number: '98.2'
    text: |-
      Indien en voor zover een militair krachtens het vorige lid van de dienst is vrijgesteld van zijn normaliter te
      verrichten werkzaamheden en/of diensten en hem geen passende andere werkzaamheden en/of diensten zijn opgedragen,
      wordt hij voor de toepassing van dit hoofdstuk geacht wegens ziekte verhinderd te zijn tot dienstverrichting.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel98
  - number: '99'
    text: |-
      Van het voornemen tot het instellen van een geneeskundig en/of tandheelkundig onderzoek als bedoeld in de artikelen
      95, tweede lid, 96 en 97, wordt de militair door zijn commandant, onder vermelding van de redenen en van de
      desbetreffende bepaling van dit besluit, schriftelijk in kennis gesteld.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel99
  - number: '100'
    text: |-
      De militair in werkelijke dienst is verplicht medewerking te verlenen aan de onderzoeken, bedoeld in de artikelen
      91, tweede lid, 92, 95, 96 en 97.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel100
  - number: '101'
    text: |-
      De uitslag van een onderzoek als bedoeld in [artikel 18 van de Arbeidsomstandighedenwet 1998][ref1], alsmede in de
      artikelen 91, tweede lid, 92, 95 96 en 97, wordt zo spoedig mogelijk schriftelijk aan de militair medegedeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel18
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel101
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '18'
  - number: '102.1'
    text: |-
      De militair die zich niet kan verenigen met de in artikel 101 bedoelde uitslag, kan, indien het een onderzoek
      als bedoeld in artikel 91, tweede lid, of artikel 92, betreft, binnen drie maal vierentwintig uren en, zo het een
      onderzoek als bedoeld in de artikelen 95, 96 en 97 betreft, binnen zes weken, nadat de uitslag te zijner kennis is
      gebracht, schriftelijk onder opgave van de redenen daartegen zijn bedenkingen kenbaar maken bij de bevelhebber. Het
      indienen van de bedenkingen heeft geen schorsende werking.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel102
  - number: '102.2'
    text: |-
      Behalve indien de bevelhebber, na overleg met de betrokken militair geneeskundige dienst, de bedenkingen van de
      militair reeds aanstonds voldoende gegrond acht, wordt zo spoedig mogelijk, doch uiterlijk binnen zes weken na
      ontvangst van het bezwaarschrift, een hernieuwd geneeskundig en/of tandheelkundig onderzoek ingesteld.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel102
  - number: '102.3'
    text: |-
      Het hernieuwd onderzoek geschiedt door een (of meer) daartoe door de inspecteur van de betrokken militair
      geneeskundige dienst aangewezen deskundige(n) die niet aan het voorafgaande onderzoek heeft (hebben) deelgenomen.
      De uitslag van het hernieuwd onderzoek wordt de militair zo spoedig mogelijk schriftelijk ter kennis gebracht.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel102
  - number: '103.1'
    text: |-
      De militair in werkelijke dienst, van wie op goede gronden wordt verondersteld dat
      hij blijvend ongeschikt is voor het vervullen van de dienst, kan, in opdracht van Onze
      Minister, worden onderworpen aan een geneeskundig onderzoek naar de regelen, gesteld in het
      [Besluit procedure geneeskundig onderzoek blijvende dienstongeschiktheid en pensioenkeuring militairen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008475
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel103
    references:
      - id: ref1
        bwb_id: BWBR0008475
  - number: '103.2'
    text: In het geval, bedoeld in het eerste lid, zijn de artikelen 99 en 100 van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel103
  - number: '104'
    text: |-
      De niet in werkelijke dienst verblijvende militair en de gewezen militair die lijden aan een ziekte of een gebrek,
      verband houdende met de uitoefening van de dienst, hebben ten aanzien van die ziekte of dat gebrek naar bij
      ministeriële regeling te stellen regelen aanspraak op geneeskundige verzorging tot het op grond van artikel 90*a*,
      tweede lid vastgestelde maximum.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel104
  - number: '106.1'
    text: 'Voor de toepassing van dit hoofdstuk wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel106
  - number: 106.1.a
    text: |-
      [WAO: Wet op de arbeidsongeschiktheidsverzekering][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel106
    references:
      - id: ref1
        bwb_id: BWBR0002524
  - number: 106.1.b
    text: |-
      [ZW: Ziektewet][ref1];

      [ref1]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel106
    references:
      - id: ref1
        bwb_id: BWBR0001888
  - number: 106.1.c
    text: |-
      [WW: Werkloosheidswet][ref1];

      [ref1]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel106
    references:
      - id: ref1
        bwb_id: BWBR0004045
  - number: 106.1.d
    text: |-
      Werknemersverzekering: [WAO][ref1], [ZW][ref2], dan wel [WW][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0002524
      [ref2]: https://wetten.overheid.nl/BWBR0001888
      [ref3]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel106
    references:
      - id: ref1
        bwb_id: BWBR0002524
      - id: ref2
        bwb_id: BWBR0001888
      - id: ref3
        bwb_id: BWBR0004045
  - number: 106.1.e
    text: |-
      arbeidsongeschiktheid: arbeidsongeschiktheid in de zin van [artikel 18, eerste lid, van de WAO][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel18
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel106
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '18'
  - number: 106.1.f
    text: |-
      bedrijfsgeneeskundige dienst: een door of vanwege Onze Minister aangewezen uitvoeringsorgaan
      bedrijfsgezondheidszorg;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel106
  - number: 106.1.g
    text: |-
      Bovenwettelijke WW-uitkering: de uitkering bedoeld in
      __REF000___________________________________________________________________________________________________________
      _________.


      [ref1]: https://wetten.overheid.nl/BWBR0010510#Artikel1
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel106
    references:
      - id: ref1
        bwb_id: BWBR0010510
        artikel: '1'
  - number: '107'
    text: |-
      Hij, die ingevolge de bepalingen van dit besluit aanspraak kan doen gelden op een vergoeding van of tegemoetkoming
      in kosten, dan wel op een uitkering, kan in aanmerking komen voor een geldelijk voorschot op die vergoeding,
      tegemoetkoming of uitkering
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel107
  - number: '108.1'
    text: |-
      Aan de militair kan gedurende zijn verblijf in werkelijke dienst, naar regels bij ministeriële regeling te stellen,
      door de commandant van rijkswege huisvesting worden verleend.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel108
  - number: '108.2'
    text: |-
      De huisvesting van rijkswege wordt zoveel mogelijk verleend bij de eenheid of het onderdeel waar de militair is
      tewerkgesteld.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel108
  - number: '108.3'
    text: |-
      Bij ministeriële regeling kunnen omstandigheden worden aangegeven waarin de militair verplicht is gebruik te maken
      van de gelegenheid tot nachtverblijf die hem van rijkswege is geboden.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel108
  - number: '109.1'
    text: |-
      Aan de militair kan gedurende zijn verblijf in werkelijke dienst, naar regels bij ministeriële regeling te stellen,
      door de commandant van rijkswege voeding worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel109
  - number: '109.2'
    text: |-
      Bij ministeriële regeling kan worden bepaald dat de verstrekking van huisvesting van rijkswege geschiedt in
      combinatie met de verstrekking van voeding van rijkswege.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel109
  - number: '110'
    text: |-
      De militair die buiten zijn woonplaats is tewerkgesteld en uitsluitend om redenen van dienst gewoonlijk niet
      dagelijks heen en weer kan reizen tussen die woonplaats en de plaats waar hij in de regel zijn dienst verricht,
      kan, naar regels bij ministeriële regeling te stellen, een vergoeding worden toegekend ter zake van de kosten
      wegens het zelf voorzien in huisvesting of voeding.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel110
  - number: '111.1'
    text: |-
      De niet in werkelijke dienst verblijvende militair en de gewezen militair die in bij ministeriële regeling te
      bepalen gevallen moeten reizen teneinde te voldoen van een oproep van het bevoegde gezag, dan wel in verband met
      het verwezenlijken van aanspraken op grond van artikel 104, hebben volgens bij ministeriële regeling te stellen
      regels aanspraak op vervoer voor rekening van het Rijk alsmede op een tegemoetkoming in de noodzakelijk gemaakte
      verblijfkosten, voor zover zij hierop niet uit anderen hoofde aanspraak kunnen doen gelden.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel111
  - number: '111.2'
    text: |-
      Indien een militair of een gewezen militair, als bedoeld in het eerste lid, naar het oordeel van de functionaris,
      bij wie hij zich moet vervoegen, niet alleen kan reizen, is het eerste lid van overeenkomstige toepassing op degene
      die hem begeleidt.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel111
  - number: '112.1'
    text: |-
      De niet in werkelijke dienst verblijvende militair en de gewezen militair die inkomsten derven wegens het voldoen
      aan een oproep van het bevoegde gezag, danwel in verband met het verwezenlijken van aanspraken op grond van artikel
      104, hebben in bij ministeriële regeling te bepalen gevallen aanspraak op een uitkering ter zake van gederfde
      inkomsten over de tijd die zij als gevolg daarvan noodzakelijk hebben verlet, voorzover zij hierop niet uit anderen
      hoofde recht kunnen doen gelden.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel112
  - number: '112.2'
    text: |-
      Het bedrag van de uitkering, bedoeld in het vorige lid, is gelijk aan dat van de
      gederfde netto-inkomsten, maar beloopt per dag ten hoogste het bedrag, genoemd in
      [artikel 9, eerste lid, van de Coördinatiewet Sociale Verzekering][ref1], eventueel gewijzigd krachtens artikel
      9*a* van die wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002126#Artikel9
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0002126
        artikel: '9'
  - number: '112.3'
    text: |-
      Indien een militair of een gewezen militair, als bedoeld in het eerste lid, naar het oordeel van de functionaris,
      bij wie hij zich moet vervoegen, niet alleen kan reizen, zijn het eerste en het tweede lid van overeenkomstige
      toepassing op degene die hem begeleidt.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel112
  - number: '113.1'
    text: |-
      In geval van verpleging in een zieken- of verplegingsinrichting van een militair in werkelijke dienst kan aan diens
      naaste betrekkingen een tegemoetkoming worden verleend in de kosten van vervoer en van verblijf ter zake van reizen
      die zij tot het bezoeken van de militair hebben gemaakt.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel113
  - number: '113.2'
    text: |-
      In geval van overlijden van een militair in werkelijke dienst kan aan diens naaste betrekkingen een tegemoetkoming
      als bedoeld in het eerste lid worden verleend ter zake van reizen die zij tot het bezoeken van het stoffelijk
      overschot hebben gemaakt.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel113
  - number: '113.3'
    text: |-
      Een tegemoetkoming als bedoeld in het eerste en tweede lid kan in de aldaar bedoelde gevallen eveneens worden
      verleend aan de naaste betrekkingen van de niet in werkelijke dienst verblijvende militair of van de gewezen
      militair die wordt of - ten tijde van zijn overlijden - werd verpleegd in een zieken- of verplegingsinrichting.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel113
  - number: '113.4'
    text: |-
      Indien de betrekkingen van de militair of de gewezen militair, in dit artikel, naar het oordeel van de bevelhebber
      niet alleen kunnen reizen, zijn de vorige leden van overeenkomstige toepassing op degene die hen begeleidt.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel113
  - number: '113.5'
    text: Bij ministeriële regeling worden regels gesteld omtrent het verlenen van de tegemoetkoming bedoeld in dit artikel.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel113
  - number: 113a.1
    text: |-
      Voor de toepassing van dit artikel worden onder belanghebbenden begrepen de echtgenote, ouders, pleeg-, stief-
      of schoonouders, grootouders, zwagers en schoonzusters, eigen kinderen, stief- of pleegkinderen, kleinkinderen,
      voogden, verloofde, broers en zusters.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel113a
  - number: 113a.2
    text: |-
      Aan de militair in werkelijke dienst die ingevolge een dienstopdracht in het buitenland verblijft, kunnen door de
      bevelhebber voor rekening van het rijk berichten worden verzonden in geval van:
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel113a
  - number: 113a.2.a
    text: overlijden van belanghebbenden;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel113a
  - number: 113a.2.b
    text: ziekte of ongeval van belanghebbenden;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel113a
  - number: 113a.2.c
    text: bevalling van de echtgenote;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel113a
  - number: 113a.2.d
    text: |-
      bijzondere gevallen, die naar het oordeel van de met berichtgeving belaste ambtenaar onmiddellijk aan de militair
      moeten worden bericht.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel113a
  - number: '114'
    text: |-
      Aan de militair die om redenen van dienst verblijft buiten het land, waar zijn gezin woonachtig is, kan door de
      bevelhebber worden toegestaan voor rekening van het rijk voortijdig naar dat land terug te keren of over te komen,
      indien naar het oordeel van de bevelhebber omstandigheden in het gezin die terugkeer of die overkomst noodzakelijk
      maken.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel114
  - number: 114a.1
    text: |-
      Voor de toepassing van dit artikel wordt verstaan onder kinderopvang: het bedrijfsmatig of anders dan om niet
      verzorgen en opvoeden van kinderen tot het tijdstip waarop het basisonderwijs voor die kinderen eindigt.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel114a
  - number: 114a.2
    text: |-
      Door de bevelhebber kan naar bij ministeriële regeling te stellen regels, financieel worden bijgedragen in
      de kosten van de militair voor kinderopvang van een of meerdere kinderen, dat of die blijkens een gewaarmerkt
      afschrift van de benodigde gegevens uit de basisadministratie persoonsgegevens op hetzelfde adres woont dan wel
      wonen als de militair en waarvan de militair duurzaam de verzorging en opvoeding als eigen kind of kinderen op zich
      heeft genomen.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel114a
  - number: 114a.3
    text: |-
      De bijdrage, als bedoeld in het tweede lid, eindigt met ingang van de dag waarop de militair ontslag wordt
      verleend.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel114a
  - number: 114a.4
    text: |-
      Wanneer sprake is van een ontslag op grond van artikel 39, tweede lid, onder d, van dit besluit, eindigt de
      bijdrage, als bedoeld in het tweede lid, in afwijking van het vierde lid, 6 maanden na de datum waarop dat ontslag
      is ingegaan, of op het moment dat uit andere hoofde aanspraak bestaat op een bijdrage, als bedoeld in het tweede
      lid. Gedurende deze periode van 6 maanden blijft de situatie van voor het ontslag ongewijzigd gehandhaafd.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel114a
  - number: '115.1'
    text: |-
      Onze Minister kan de militair naar billijkheid schadeloos stellen, kosten vergoeden of overigens een geldelijke
      tegemoetkoming verlenen, voor zover daar niet uit anderen hoofde aanspraak op bestaat.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel115
  - number: '115.2'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent de schadeloosstelling, kostenvergoedingen en
      overige geldelijke tegemoetkomingen aan de militair dan wel groepen van militairen.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel115
  - number: '117.1'
    text: |-
      De militair heeft met betrekking tot de uniformkleding en andere goederen, behorende tot zijn persoonlijke
      standaarduitrusting, aanspraak hetzij op een verstrekking van rijkswege en voor rekening van het rijk in natura,
      hetzij op een tegemoetkoming in de kosten van aanschaffing.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel117
  - number: '117.2'
    text: |-
      Met betrekking tot de uniformkleding en andere goederen, bedoeld in het vorige lid, die de militair in eigendom
      moet hebben, kan hem een tegemoetkoming worden verleend in de kosten van onderhoud en vernieuwing en in de kosten
      van voorgeschreven veranderingen van die kleding en goederen.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel117
  - number: '117.3'
    text: |-
      Aan de militair kan in bij ministeriële regeling aan te wijzen gevallen een tegemoetkoming in de kosten van
      aanschaffing of van onderhoud en vernieuwing worden verleend ter zake van uniformkleding en andere goederen die
      niet tot zijn persoonlijke standaarduitrusting behoren, maar die hij niettemin in eigendom moet hebben, alsmede
      ter zake van burgerkleding van hemzelf en - in geval van uitzending van de militair met zijn gezin naar bij
      ministeriële regeling aan te wijzen gebieden - van kleding van leden van zijn gezin.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel117
  - number: '117.4'
    text: |-
      De verstrekking in natura en die van de tegemoetkomingen, bedoeld in het eerste tot en met derde lid, geschieden
      naar regels bij ministeriële regeling te stellen.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel117
  - number: '118.1'
    text: |-
      Indien een militair in Nederland overlijdt terwijl hij om redenen van dienst buiten zijn woonplaats verbleef,
      worden aan de nabestaanden de kosten vergoed van het doen overbrengen van het stoffelijk overschot naar een plaats
      van keuze in Nederland.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel118
  - number: '118.2'
    text: |-
      Indien een militair in werkelijke dienst overlijdt en het overlijden verband houdt met de uitoefening van de
      militaire dienst, wordt aan de nabestaanden een tegemoetkoming in de kosten van lijkbezorging verleend tot maximaal
      € 5 000.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel118
  - number: '118.3'
    text: |-
      Indien een militair in werkelijke dienst overlijdt ten gevolge van een vliegongeval tijdens een
      dienstreis als bedoeld in [artikel 1, onder d, van het Besluit dienstreizen defensie](onbekend), wordt
      aan de nabestaanden een som ineens ten bedrage van € 15 000 toegekend. Deze aanspraak vervalt wanneer de
      [Regeling uitkering vliegongeval][ref1] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0002355
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel118
    references:
      - id: ref1
        bwb_id: BWBR0002355
  - number: '118.4'
    text: |-
      Voor zover Onze Minister niet anders bepaalt, is dit artikel niet van toepassing in buitengewone omstandigheden en
      ten aanzien van militairen die zijn overleden in de tijd waarin zij waren ingedeeld bij een eenheid of onderdeel
      van de krijgsmacht, waaraan de bekendmaking, bedoeld in [artikel 71 van het Wetboek van Militair Strafrecht][ref1],
      is gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0001869#Artikel71
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel118
    references:
      - id: ref1
        bwb_id: BWBR0001869
        artikel: '71'
  - number: '119.1'
    text: |-
      Naar regels bij ministeriële regeling te stellen, kunnen de naaste betrekkingen van een militair die vermist
      is geraakt bij de uitoefening van de dienst dan wel ten gevolge van bijzondere omstandigheden die zich bij de
      uitoefening van de dienst hebben voorgedaan, in aanmerking komen voor bemiddeling van Onze Minister bij het voeren
      van de procedure tot het verkrijgen van een verklaring, dat rechtsvermoeden van overlijden van de vermiste militair
      bestaat.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel119
  - number: '119.2'
    text: |-
      De naaste betrekkingen van een militair als bedoeld in het vorige lid hebben, indien de procedure, bedoeld in
      dat lid, niet kosteloos kan worden gevoerd, naar regels bij ministeriële regeling te stellen, aanspraak op een
      vergoeding van de kosten die ter zake voor hun rekening zijn gekomen.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel119
  - number: '119.3'
    text: |-
      De bevelhebber kan, indien een gezinslid van een militair vermist is geraakt ten gevolge van omstandigheden die
      naar zijn oordeel verband houden met de dienst van de militair, ten aanzien van die militair overeenkomstige
      voorzieningen treffen.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel119
  - number: '120.1'
    text: 'Voor de toepassing van dit artikel wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel120
  - number: 120.1.a
    text: '*gewezen militair:* de militair die is ontslagen uit de dienst bij het beroepspersoneel;'
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel120
  - number: 120.1.b
    text: |-
      *laatstelijk genoten bezoldiging:* de som van de geldelijke inkomsten per maand, die in aanmerking worden genomen
      bij de vaststelling van de pensioengrondslag van de militair, zulks naar de toestand op de dag voorafgaande aan
      het ontslag.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel120
  - number: '120.2'
    text: |-
      De gewezen militair die wegens ziekte of een gebrek, ontstaan voor het tijdstip van ingang van zijn ontslag,
      nadien nog ongeschikt is voor het verrichten van naar aard en omvang soortgelijke arbeid als die welke als militair
      werd verricht, heeft, naar regels bij ministeriële regeling te stellen, gedurende die ongeschiktheid aanspraak
      op de laatstelijk genoten bezoldiging. Het in de vorige volzin bepaalde geldt slechts voor zover de termijn van
      achttien kalendermaanden, bedoeld in [artikel 17, eerste lid, van het Inkomstenbesluit militairen][ref1], nog niet
      is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0007816#Artikel17
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel120
    references:
      - id: ref1
        bwb_id: BWBR0007816
        artikel: '17'
  - number: '120.3'
    text: |-
      De gewezen militair die binnen een maand na het tijdstip van ingang van zijn ontslag wegens ziekte of een gebrek
      ongeschikt wordt voor het verrichten van naar aard en omvang soortgelijke arbeid als die welke als militair werd
      verricht, heeft, mits hij gedurende twee maanden onmiddellijk aan evenbedoeld tijdstip voorafgaande in werkelijke
      dienst is geweest, naar regels bij ministeriële regeling te stellen, gedurende die ongeschiktheid, doch uiterlijk
      tot een jaar na de aanvang daarvan, aanspraak op de laatstelijk genoten bezoldiging.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel120
  - number: '120.4'
    text: |-
      Indien de gewezen militair binnen een tijdvak van vier weken, nadat de volgens het tweede en derde lid geregelde
      doorbetaling van zijn laatstelijk genoten bezoldiging in verband met zijn herstel is gestaakt, wederom wegens
      ziekte of een gebrek ongeschikt wordt voor het verrichten van naar aard en omvang soortgelijke arbeid als die
      welke als militair werd verricht, wordt de nieuw opgetreden ongeschiktheid als een voortzetting van de vorige
      ongeschiktheid beschouwd en wordt de doorbetaling van de laatstelijk genoten bezoldiging hervat. Voor het bepalen
      van het tijdstip, waarop de in het tweede en derde lid bedoelde termijnen zijn verstreken, worden perioden van
      in die leden bedoelde ongeschiktheid welke elkaar met een onderbreking van minder dan vier weken zijn opgevolgd,
      samengeteld.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel120
  - number: 120.5.a
    text: |-
      Het tweede, derde en vierde lid zijn eveneens van toepassing op de gewezen vrouwelijke militair die na afloop van
      de periode gedurende welke zij in verband met zwangerschap of bevalling aanspraak heeft op een uitkering op basis
      van [hoofdstuk 3 van de Wet arbeid en zorg][ref1] nog wegens ziekte arbeidsongeschikt is voor het verrichten van
      naar aard en omvang soortgelijke arbeid als die welke als militair werd verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel120
    references:
      - id: ref1
        bwb_id: BWBR0013008
        hoofdstuk: '3'
  - number: 120.5.b
    text: De in het derde lid bedoelde termijn van een jaar vangt aan op de dag na die van de bevalling.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel120
  - number: '120.6'
    text: |-
      De voorgaande leden vinden geen toepassing op de gewezen militair die op het tijdstip van ingang van zijn ontslag
      ongeschikt is dan wel binnen een maand daarna ongeschikt wordt, en op de gewezen vrouwelijke militair wier
      ongeschiktheid na het tijdstip, bedoeld in het vorige lid onder b, voortduurt, vanaf de dag met ingang waarvan zij
      na evenbedoelde tijdstippen in verband met de aanvaarding van een volledige betrekking aanspraak kunnen maken op
      loon of bezoldiging, dan wel op een uitkering krachtens de [Ziektewet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel120
    references:
      - id: ref1
        bwb_id: BWBR0001888
  - number: '120.7'
    text: 'De aanspraak op de laatstelijk genoten bezoldiging bestaat niet indien de betrokkene:'
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel120
  - number: 120.7.a
    text: |-
      de ziekte of het gebrek heeft voorgewend, althans zodanig overdreven voorgesteld, dat ongeschiktheid tot het
      verrichten van naar aard en omvang soortgelijke arbeid als die welke als militair werd verricht, niet kan worden
      aangenomen; of
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel120
  - number: 120.7.b
    text: |-
      de ongeschiktheid tot het verrichten van naar aard en omvang soortgelijke arbeid als die welke als militair werd
      verricht, opzettelijk heeft veroorzaakt, tenzij hem daarvan op grond van zijn psychische toestand geen verwijt kan
      worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel120
  - number: '120.8'
    text: |-
      De uitbetaling van de laatstelijk genoten bezoldiging wordt gestaakt, indien en voor zolang de betrokkene de door
      Onze Minister krachtens het tweede of derde lid vastgestelde voorschriften niet nakomt.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel120
  - number: '120.9'
    text: 'Het bedrag van de laatstgenoten bezoldiging, bedoeld in dit artikel, wordt in voorkomende gevallen:'
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel120
  - number: 120.9.a
    text: |-
      gewijzigd overeenkomstig een algemene herziening die voor de betrokkene zou hebben gegolden, ware hij niet
      ontslagen;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel120
  - number: 120.9.b
    text: verminderd na toepassing van artikel 120a;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel120
  - number: 120.9.c
    text: 'verminderd met:'
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel120
  - number: 120.9.c.1
    text: |-
      de periodieke inkomsten waarop hij uit hoofde van het laatstelijk door hem beklede ambt na het ontslag aanspraak
      kan maken;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel120
  - number: 120.9.c.2
    text: inkomsten die hij inmiddels mocht zijn gaan genieten uit of in verband met arbeid of bedrijf.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel120
  - number: 120a.1
    text: |-
      Indien de gewezen militair, bedoeld in artikel 120, recht heeft op een uitkering op grond van een
      werknemersverzekering, dan wel een bovenwettelijke WW-uitkering berustend op de dienstbetrekking waaraan de
      laatstgenoten bezoldiging is verbonden, wordt die uitkering daarop in mindering gebracht.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel120a
  - number: 120a.2
    text: |-
      Indien als gevolg van handelingen of het nalaten van handelingen door die gewezen militair geen uitkering op grond
      van de [WAO][ref1] wordt toegekend, wordt voor de toepassing van het eerste lid uitgegaan van een uitkering op
      grond van die wet, zoals die zou zijn toegekend bij een arbeidsongeschiktheid van 80% of meer.


      [ref1]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel120a
    references:
      - id: ref1
        bwb_id: BWBR0002524
  - number: 120a.3
    text: |-
      Indien als gevolg van handelingen of het nalaten van handelingen door die gewezen militair het bedrag van de
      uitkering op grond van de in het eerste lid bedoelde werknemersverzekering of een bovenwettelijke WW-uitkering
      een vermindering ondergaat, dan wel de aanspraak daarop geheel of gedeeltelijk niet wordt toegekend, wordt deze
      uitkering voor de toepassing van het eerste lid steeds aangemerkt als een uitkering die onverminderd is genoten.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel120a
  - number: 120a.4
    text: |-
      Indien die gewezen militair over een periode ter zake van de dienstbetrekking waaraan de laatstgenoten bezoldiging
      is verbonden aanspraak heeft of had kunnen hebben op een uitkering op grond van de [ZW][ref1] of de [WAO][ref2], is
      het verplichtingen- en sanctieregime van die wet over die periode van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel120a
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0002524
  - number: 120a.5
    text: |-
      Indien ten aanzien van die wettelijke uitkering een verplichting wordt opgelegd of een sanctie wordt toegepast,
      wordt door de bevelhebber zoveel mogelijk dezelfde verplichting opgelegd dan wel een overeenkomstige sanctie
      toegepast op het verminderde bedrag van de laatstgenoten bezoldiging.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel120a
  - number: 120a.6
    text: |-
      De aanspraak op doorbetaling van bezoldiging ingevolge artikel 120 vervalt, indien de gewezen militair zonder
      deugdelijke grond weigert de hem door de bevelhebber aangeboden gangbare arbeid, waartoe de militair geneeskundige
      dienst hem in staat acht, te aanvaarden.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel120a
  - number: '124.1'
    text: |-
      De niet in werkelijke dienst verblijvende militair en de gewezen militair, die verplicht tot het reserve-personeel
      behoort onderscheidenlijk laatstelijk heeft behoord, hebben, indien zij ten gevolge van een ziekte of een gebrek,
      verband houdende met de uitoefening van de dienst, tijdelijk niet in staat zijn:
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel124
  - number: 124.1.a
    text: |-
      de inkomsten te verwerven die zij uit hoofde van hun beroep of bedrijf gemiddeld verdienden of zouden kunnen
      verdienen, dan wel
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel124
  - number: 124.1.b
    text: |-
      de inkomsten te verwerven die zij - zo de inkomsten, bedoeld onder *a*, niet kunnen worden vastgesteld - zouden
      kunnen verdienen met arbeid die voor hun krachten en bekwaamheid is berekend
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel124
  - number: '124.2'
    text: |-
      Het bedrag van de uitkering is gelijk aan het verschil tussen de inkomsten, bedoeld in het vorige lid onder *a*
      of *b*, en de inkomsten waarop de belanghebbende uit anderen hoofde aanspraak heeft of aanspraak had kunnen maken
      gedurende de tijd waarin hij verkeert in de omstandigheid, bedoeld in dat lid. De uitkering wordt uitbetaald in
      maandelijkse termijnen.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel124
  - number: '124.3'
    text: |-
      Voor de toepassing van de vorige leden worden als inkomsten waarop de belanghebbende uit anderen hoofde aanspraak
      kan maken, aangemerkt:
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel124
  - number: 124.3.a
    text: uitkeringen op grond van artikel 123;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel124
  - number: 124.3.b
    text: inkomsten uit of in verband met arbeid of bedrijf;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel124
  - number: 124.3.c
    text: |-
      uitkeringen krachtens de [Wet arbeidsongeschiktheidsvoorziening militairen][ref1] (*Stb.* 1972, 313) of krachtens
      enige sociale verzekeringswet;


      [ref1]: https://wetten.overheid.nl/BWBR0002822
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel124
    references:
      - id: ref1
        bwb_id: BWBR0002822
  - number: 124.3.d
    text: uitkeringen wegens een particuliere verzekering ter zake van de geldelijke gevolgen van arbeidsongeschiktheid;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel124
  - number: 124.3.e
    text: |-
      inkomsten ingevolge de bij of krachtens de [Kaderwet militaire pensioenen][ref1] vastgestelde bepalingen
      met uitzondering van een bedrag, gelijk aan dat van het invaliditeitspensioen, alsmede van de bijzondere
      invaliditeitsverhoging ingevolge die bepalingen.


      [ref1]: https://wetten.overheid.nl/BWBR0011955
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel124
    references:
      - id: ref1
        bwb_id: BWBR0011955
  - number: '124.4'
    text: 'Onze Minister kan in naar zijn oordeel bijzondere gevallen:'
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel124
  - number: 124.4.a
    text: de termijn van twee jaren, genoemd in het eerste lid, verlengen;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel124
  - number: 124.4.b
    text: op de uitkering een suppletie verlenen.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel124
  - number: '125.1'
    text: |-
      Na het overlijden van: a. de gewezen militair die op de dag van het overlijden in het genot was van een uitkering
      ingevolge artikel 120; b. de gewezen militair die op de dag van het overlijden in het genot was van een uitkering
      ingevolge artikel 124; wordt een bedrag uitgekeerd aan de volgende nagelaten betrekkingen: 1°. aan de langstlevende
      der echtgenoten, tenzij zij duurzaam gescheiden leefden; 2°. bij ontstentenis van de onder 1° bedoelde echtgenote,
      ten behoeve van het kind of de kinderen voor wie de overledene aanspraak op kinderbijslag had; 3°. bij ontstentenis
      van de onder 1° en 2° bedoelde betrekkingen, aan of ten behoeve van de ouders, broers, zusters of kinderen
      van de overledene, voor wie hij naar het oordeel van de bevelhebber grotendeels in de noodzakelijke kosten van
      levensonderhoud bijdroeg.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel125
  - number: '125.2'
    text: |-
      Indien de overledene geen betrekkingen als bedoeld in het vorige lid nalaat, kan de bevelhebber het in dat lid
      bedoelde bedrag geheel of gedeeltelijk doen aanwenden ter bestrijding van de kosten van de laatste ziekte en de
      begrafenis of crematie.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel125
  - number: '125.3'
    text: 'Het uit te keren bedrag is indien het een overledene betreft als bedoeld in het eerste lid:'
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel125
  - number: 125.3.a
    text: |-
      onderdeel a: gelijk aan het bedrag van de laatstgenoten bezoldiging, bedoeld in artikel 120 eerste lid, zonder
      vermindering ingevolge artikel 120a;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel125
  - number: 125.3.b
    text: 'onderdeel b: gelijk aan de uitkering welke belanghebbende op de dag van zijn overlijden genoot;'
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel125
  - number: '125.4'
    text: |-
      Op dat bedrag worden in mindering gebracht de uitkering ingevolge [artikel 35 van de Ziektewet][ref1], dan wel
      [artikel 53 van de Wet op de arbeidsongeschiktheidsverzekering][ref2] waarop de overledene aanspraak had dan wel
      zou kunnen hebben gehad, alsmede naar aard en strekking daarmee overeenkomende uitkeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel53
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel125
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '35'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '53'
  - number: '130.1'
    text: |-
      Aan de militair kan ter zake van bijzondere dienstverrichtingen, dan wel langdurige en eervolle dienst, naar
      regelen bij koninklijk besluit te stellen, een onderscheiding worden toegekend.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel130
  - number: '130.2'
    text: |-
      De militair kan, in afwijking van de bepalingen van hoofdstuk 4, buitengewoon worden bevorderd ter beloning van een
      zeer belangrijk wapenfeit of een andere daad of verrichting, waardoor hij zich zeer bijzonder heeft onderscheiden.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel130
  - number: '130.3'
    text: |-
      Aan de militair kan ter zake van het op een bijzondere wijze hebben bijgedragen tot de behartiging van de belangen
      van de krijgsmacht een titulaire rang worden toegekend.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel130
  - number: '131.1'
    text: |-
      Aan de wijze van functievervulling van de militair in werkelijke dienst en aan zijn gedrag in relatie
      tot zijn functie wordt ten minste een keer per jaar aandacht besteed door middel van het houden van een
      functioneringsgesprek. Indien een militair naast de uit zijn functie voortvloeiende werkzaamheden andere opgedragen
      werkzaamheden of diensten heeft verricht, wordt tevens aan de wijze waarop hij die werkzaamheden of diensten heeft
      verricht en aan zijn gedrag in relatie tot die werkzaamheden of diensten aandacht besteed.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel131
  - number: '131.2'
    text: Aan het functioneringsgesprek wordt deelgenomen door de militair en diens functionele chef.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel131
  - number: '131.3'
    text: |-
      Op verzoek van een van de deelnemers aan het functioneringsgesprek en met instemming van beide deelnemers kunnen
      een of meer andere personen aan het gesprek deelnemen.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel131
  - number: '131.4'
    text: 'Het functioneringsgesprek is ten minste gericht op de navolgende onderdelen:'
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel131
  - number: 131.4.a
    text: |-
      het functioneren van de militair in de omgeving waarin hij zijn functie vervult, alsmede de functionele relatie
      tussen de militair en de functionele chef met betrekking tot de functie-uitoefening van de militair over de
      achterliggende periode. Hierbij komen in elk geval de volgende aspecten aan de orde: - de verhouding tussen de
      getoonde kennis en de vaardigheden, en de gestelde functie-eisen;
        - de vorderingen en de gedragingen;
        - de toetsing of en in hoeverre is voldaan aan eerder gemaakte afspraken;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel131
  - number: 131.4.b
    text: afspraken en aandachtspunten met betrekking tot de toekomstige functievervulling;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel131
  - number: 131.4.c
    text: |-
      de persoonlijke ontwikkeling in relatie tot de mogelijke loopbaanwensen van de militair en de algemene
      loopbaanpatronen;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel131
  - number: 131.4.d
    text: |-
      indien de militair de leeftijd van 50 jaar heeft bereikt: de relatie tussen leeftijd en belastbaarheid en
      functievervulling.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel131
  - number: '131.5'
    text: |-
      a. De functionele chef legt een samenvatting van de inhoud van het gesprek alsmede de gemaakte afspraken en
      besproken aandachtspunten in het functioneringsgesprekformulier vast. Het formulier wordt voor een correcte
      weergave daarvan door de functionele chef en de militair ondertekend. De functionele chef verstrekt de militair
      een afschrift van het functioneringsgesprekformulier. b. De afspraken en aandachtspunten worden opgelegd in het
      personeelsdossier van de betrokkene.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel131
  - number: '131.6'
    text: |-
      Onze Minister stelt beleidsregels ten aanzien van het houden van functioneringsgesprekken alsmede het
      functioneringsgesprekformulier, waarin ten minste de in het vierde lid genoemde onderdelen zijn opgenomen.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel131
  - number: 131a.1
    text: |-
      Indien de commandant of de militair in werkelijke dienst dit wenselijk vindt, wordt een beoordeling opgemaakt. De
      militair dient daartoe een aanvraag in bij de commandant.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel131a
  - number: 131a.2
    text: De bevelhebber kan opdracht geven tot het opmaken van een beoordeling.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel131a
  - number: 131a.3
    text: |-
      De militair wordt beoordeeld omtrent de wijze waarop hij zijn functie heeft vervuld en omtrent zijn gedrag
      in relatie tot die functie, gedurende het beoordelingstijdvak. Indien een militair naast de uit zijn functie
      voortvloeiende werkzaamheden andere opgedragen werkzaamheden of diensten heeft verricht, wordt hij tevens
      omtrent de wijze waarop hij die werkzaamheden of diensten heeft verricht en omtrent zijn gedrag in relatie tot
      die werkzaamheden of diensten beoordeeld. De beoordeling is gebaseerd op concrete handelingen, resultaten en
      gedragingen van de te beoordelen militair.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel131a
  - number: 131a.4
    text: Bij het opmaken van een beoordeling kan een toekomstverwachting worden opgemaakt.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel131a
  - number: 131a.5
    text: |-
      Het beoordelingstijdvak omvat een periode van ten minste zes maanden en ten hoogste twee jaren. Per kalenderjaar
      kan maximaal één beoordeling worden opgemaakt.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel131a
  - number: 131a.6
    text: |-
      De beoordeling wordt opgemaakt door een eerste en in beginsel een tweede beoordelaar. Als eerste beoordelaar treedt
      op de functionele chef van de militair. De tweede beoordelaar is de commandant van de militair dan wel een door
      de commandant aangewezen functionaris. In het geval de commandant is opgetreden als eerste beoordelaar, treedt in
      beginsel als tweede beoordelaar op de functionele chef van de commandant.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel131a
  - number: 131a.7
    text: |-
      Gelet op de vereiste deskundigheid kan bij het uitbrengen van een beoordeling een personeelsbeoordelingsadviseur
      aan de beoordelaar worden toegevoegd.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel131a
  - number: 131a.8
    text: 'Na het opmaken van de beoordeling van de militair:'
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel131a
  - number: 131a.8.a
    text: wordt met de militair zijn beoordeling besproken;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel131a
  - number: 131a.8.b
    text: krijgt de militair een afschrift van zijn beoordeling uitgereikt;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel131a
  - number: 131a.8.c
    text: |-
      krijgt hij de gelegenheid zijn bedenkingen tegen de omtrent hem opgemaakte beoordeling binnen 2 weken schriftelijk
      bij de tweede beoordelaar kenbaar te maken, tenzij er geen tweede beoordelaar is; indien er geen tweede beoordelaar
      is, worden de bedenkingen kenbaar gemaakt bij de eerste beoordelaar.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel131a
  - number: 131a.9
    text: |-
      Nadat de beoordeling door de tweede beoordelaar is vastgesteld, wordt aan de militair een afschrift verstrekt. Deze
      bepaling is van overeenkomstige toepassing indien er sprake is van één beoordelaar.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel131a
  - number: 131a.10
    text: |-
      Onze Minister stelt beleidsregels ten aanzien van het opmaken en vaststellen van beoordelingen alsmede het
      beoordelingsformulier volgens welke de militair wordt beoordeeld.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel131a
  - number: '133'
    text: |-
      In geval van buitengewone omstandigheden kan Onze Minister de militair die in verband met een functie in een
      publiekrechtelijk college ingevolge [artikel 12c, eerste lid, van de Militaire ambtenarenwet 1931][ref1] op non-
      activiteit is gesteld, in werkelijke dienst terugroepen.


      [ref1]: https://wetten.overheid.nl/BWBR0001952#Artikel12c
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel133
    references:
      - id: ref1
        bwb_id: BWBR0001952
        artikel: 12c
  - number: '134.1'
    text: |-
      De militair in werkelijke dienst is verplicht tijdens de voor hem vastgestelde werktijden het voor hem vastgestelde
      uniform te dragen. De vaststelling van het uniform geschiedt, voor zover Wij Ons dat niet hebben voorbehouden, door
      de bevelhebber.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel134
  - number: '134.2'
    text: |-
      Het kan de militair die al dan niet in werkelijke dienst verblijft door de bevelhebber worden toegestaan onder
      bepaalde omstandigheden het uniform al dan niet te dragen.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel134
  - number: '135.1'
    text: |-
      De bevelhebber kan de militair die voor ten minste de periode van een jaar is aangesteld bij het beroepspersoneel,
      aanspraak verlenen op een vergoeding van de kosten, verbonden aan het gebruik van een privé telefoonaansluiting
      voor dienstdoeleinden.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel135
  - number: '135.2'
    text: 'De vergoeding, bedoeld in het eerste lid, bedraagt:'
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel135
  - number: 135.2.a
    text: |-
      10%, 25% of 50% van de gesprekskosten indien van de privé telefoonaansluiting meer dan in incidentele
      gevallen gebruik wordt gemaakt voor het voeren van uitgaande dienstgesprekken; in bijzondere gevallen kan een
      hogere vergoeding worden toegekend, een en ander te bepalen aan de hand van de frequentie van de uitgaande
      dienstgesprekken;
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel135
  - number: 135.2.b
    text: 100% van de gevoerde internationale dienstgesprekken.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel135
  - number: '137'
    text: |-
      De militair in werkelijke dienst is verplicht de hem opgedragen werkzaamheden en/of diensten naar beste vermogen te
      vervullen, en de uit dien hoofde voor hem geldende voorschriften en orders te kennen.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel137
  - number: '138'
    text: De militair in werkelijke dienst kan door de bevelhebber worden verplicht tot sportbeoefening in dienstverband.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel138
  - number: '139'
    text: |-
      De militair in werkelijke dienst kan door Onze Minister worden verplicht zodanige maatregelen te treffen, dat hij
      aan per radio, televisie of andere wijze gedane oproepingen om zich te melden onverwijld gevolg kan geven.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel139
  - number: '140.1'
    text: |-
      De militair in werkelijke dienst kan worden verplicht, wanneer naar het oordeel van Onze Minister het algemeen
      belang dit vordert, tijdelijk andere werkzaamheden te verrichten dan die welke uit de militaire hoedanigheid
      voortvloeien.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel140
  - number: '140.2'
    text: |-
      Hij kan echter niet worden verplicht werkzaamheden te verrichten in plaats van stakers of uitgeslotenen, tenzij het
      werkzaamheden betreft die naar het oordeel van Onze Minister, in overeenstemming met het gevoelen van de Raad van
      Ministers, geen uitstel gedogen.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel140
  - number: '140.3'
    text: P.M.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel140
  - number: '142'
    text: |-
      De commandant is bevoegd tot het gelasten van een onderzoek aan kleding dan wel lichaam, als bedoeld in
      [artikel 12d van de Militaire ambtenarenwet 1931][ref1] en met inachtneming van dat artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0001952#Artikel12d
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel142
    references:
      - id: ref1
        bwb_id: BWBR0001952
        artikel: 12d
  - number: '143'
    text: |-
      De militair kan worden verplicht te wonen op een bepaalde afstand van de plaats, waar hij in de regel dienst
      verricht, of in een ambts- of dienstwoning, indien dit naar het oordeel van de bevelhebber in het belang van de
      dienst nodig of gewenst is.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel143
  - number: '144.1'
    text: |-
      De militair die een ambts- of dienstwoning bewoont, draagt de kosten van het onderhoud, dat volgens de wet en het
      plaatselijk gebruik voor rekening van de huurder komt, tenzij bij ministeriële regeling afwijkende regels worden
      gesteld.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel144
  - number: '144.2'
    text: |-
      Ingeval de militair overlijdt behouden de achtergebleven gezinsleden gedurende de maand van het overlijden en de
      volgende drie maanden het gebruik van de ambts- of dienstwoning waarin zij met de militair woonden. De bevelhebber
      kan die termijn bekorten indien het belang van de dienst dit noodzakelijk maakt. Alsdan wordt door de bevelhebber
      naar billijkheid een schadevergoeding gegeven.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel144
  - number: '144.3'
    text: |-
      Bij vrijwillig verlaten van de ambts- of dienstwoning binnen de termijn gedurende welke de woning nog mag worden
      gebruikt, kan de bevelhebber een uitkering geven.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel144
  - number: '145.1'
    text: |-
      Onze Minister kan de militair verplichten tot geheel of gedeeltelijke vergoeding van de door de dienst geleden
      schade:
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel145
  - number: 145.1.a
    text: |-
      indien deze schade in het kader van de vervulling van aan de militair opgedragen diensten en werkzaamheden is
      ontstaan door opzet of bewuste roekeloosheid van de militair, dan wel
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel145
  - number: 145.1.b
    text: |-
      indien deze schade buiten het kader van aan de militair opgedragen diensten en werkzaamheden is ontstaan door
      verwijtbaar handelen van de militair.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel145
  - number: '145.2'
    text: Wanneer de schade is veroorzaakt door meerdere personen gezamenlijk is in beginsel ieder hoofdelijk aansprakelijk.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel145
  - number: '146'
    text: |-
      De militair die uit hoofde van zijn functie is belast met het beheer over of de bewaring van aan het rijk
      toebehorende of toevertrouwde gelden of geldswaardige papieren kan, bij constatering van een tekort, worden
      verplicht dat tekort geheel of gedeeltelijk aan te zuiveren, indien en voor zover hij niet aannemelijk maakt dat
      het ontstaan van dat tekort hem redelijkerwijs niet kan worden verweten.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel146
  - number: '147.1'
    text: |-
      Naar regels bij ministeriële regeling te stellen, wordt van elk ongeval dat aan een militair in werkelijke dienst
      tijdens de uitoefening van de dienst is overkomen, zo spoedig mogelijk een proces-verbaal opgemaakt. De militair
      is verplicht, zodra hij daartoe redelijkerwijs in staat is, kennis te geven van een hem overkomen ongeval als
      vorenbedoeld aan zijn commandant.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel147
  - number: '147.2'
    text: |-
      Naar regels bij ministeriële regeling te stellen, wordt van elk ongeval dat aan een militair in werkelijke dienst
      is overkomen en waarvan niet reeds op grond van het vorige lid een proces-verbaal is opgemaakt, op aanvraag van de
      militair zo spoedig mogelijk een proces-verbaal opgemaakt. Bedoelde aanvraag kan, indien de militair hiertoe niet
      in staat is, ook worden gedaan door zijn naaste betrekkingen. Een proces-verbaal als in dit lid bedoeld kan ook
      ambtshalve worden opgemaakt.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel147
  - number: '147.3'
    text: |-
      Onze Minister beslist of het ongeval waarop een proces-verbaal betrekking heeft, wordt geacht wel of niet in
      verband te staan met de uitoefening van de dienst, van welke beslissing de militair schriftelijk in kennis wordt
      gesteld.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel147
  - number: '147.4'
    text: |-
      Voor de toepassing van dit artikel wordt onder militair in werkelijke dienst mede begrepen de militair, aan wie
      buitengewoon verlof van lange duur met behoud van militaire inkomsten is verleend.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel147
  - number: '148.1'
    text: |-
      Onverminderd artikel 147, tweede lid, is de militair in werkelijke dienst verplicht Onze Minister onverwijld kennis
      te geven van elk ongeval dat hem is overkomen, indien:
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel148
  - number: 148.1.a
    text: bij dat ongeval een derde is betrokken en
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel148
  - number: 148.1.b
    text: |-
      hij tengevolge van dat ongeval verhinderd is zijn normale werkzaamheden uit te oefenen of geneeskundige hulp heeft
      moeten inroepen.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel148
  - number: '148.2'
    text: |-
      Voor de toepassing van dit artikel wordt onder militair in werkelijke dienst mede begrepen de militair, aan wie
      buitengewoon verlof van lange duur met behoud van militaire inkomsten is verleend.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel148
  - number: '148.3'
    text: Bij ministeriële regeling worden nadere regels ter uitvoering van dit artikel vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel148
  - number: '150.1'
    text: |-
      Het is de militair in zijn dienstbetrekking als zodanig verboden, anders dan met goedvinden van Onze Minister,
      vergoedingen, beloningen, giften of beloften van derden te vorderen, te verzoeken of aan te nemen.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel150
  - number: '150.2'
    text: Het aannemen van steekpenningen is onvoorwaardelijk verboden.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel150
  - number: '151.1'
    text: |-
      De militair in werkelijke dienst die nevenwerkzaamheden verricht of dit voornemens is, is verplicht dit aan Onze
      Minister te melden indien die nevenwerkzaamheden de belangen van de dienst, voor zover deze in verband staan met de
      functievervulling, kunnen raken.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel151
  - number: '151.2'
    text: |-
      Het is de militair in werkelijke dienst verboden nevenwerkzaamheden te verrichten waardoor naar het oordeel van
      Onze Minister de goede vervulling van de functie of het goede functioneren van de openbare dienst, voor zover dit
      in verband staat met de functievervulling, niet in redelijkheid zou zijn verzekerd.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel151
  - number: '151.3'
    text: Onze Minister voert een registratie op basis van de ingevolge het eerste lid gedane opgaven.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel151
  - number: '151.4'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent het in het tweede lid genoemde verbod en de
      in het derde lid bedoeld registratie.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel151
  - number: '152'
    text: |-
      Het is de militair die is aangesteld bij het beroepspersoneel verboden middellijk of onmiddellijk deel te nemen
      aan aannemingen of leveranties ten behoeve van openbare diensten, tenzij hem daartoe vergunning is verleend door
      Onze Minister.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel152
  - number: '153'
    text: |-
      Aan de militair die is aangesteld bij het beroepspersoneel kan door Onze Minister worden verboden commissaris,
      bestuurder of vennoot te zijn van een vennootschap, stichting of vereniging, die geregeld in aanraking komt of
      krachtens haar opzet kan komen met de krijgsmacht.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel153
  - number: 153a
    text: |-
      Ten aanzien van militairen die deelnemen aan een initiële opleiding kunnen bij ministeriële regeling met betrekking
      tot de aangelegenheden geregeld in dit hoofdstuk bijzondere afwijkende regels worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel153a
  - number: '156.1'
    text: |-
      Voor de militair beneden de rang van luitenant ter zee der 3e klasse/tweede-luitenant die als zodanig is aangesteld
      vóór het tijdstip van inwerkingtreding van dit besluit, wordt - ter beantwoording van de vraag of aanspraak bestaat
      op uitreiking van een getuigschrift als bedoeld in artikel 51 - de tijd als zodanig doorgebracht vóór het hiervoren
      genoemde tijdstip mede gerekend.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel156
  - number: '161'
    text: |-
      De [Algemene termijnenwet][ref1] (*Stb.* 1964, 314) is niet van toepassing op de termijnen in dit besluit gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002448
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel161
    references:
      - id: ref1
        bwb_id: BWBR0002448
  - number: '163'
    text: Dit besluit wordt aangehaald als "Algemeen militair ambtenarenreglement", afgekort AMAR.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel163
  - number: '164'
    text: |-
      De artikelen van dit besluit treden in werking op een door Ons te bepalen tijdstip dat voor de verschillende
      artikelen of onderdelen daarvan, alsook per krijgsmachtdeel, verschillend kan worden gesteld.
    url: https://wetten.overheid.nl/BWBR0003482/2004-01-01#Artikel164
