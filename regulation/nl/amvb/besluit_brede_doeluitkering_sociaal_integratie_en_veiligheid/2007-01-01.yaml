        artikel: '6'
      - id: ref4
        bwb_id: BWBR0009544
        artikel: '15'
  - number: '4.1'
    text: |-
      De uitkering wordt berekend volgens de formule: A x I + B x J + C x K + D x L + E x M + F x N + G x O + H x P
      + Q in welke formule voorstelt: A: het procentuele aandeel van de gemeente in de middelen voor leefbaarheid en
      veiligheid, die gedurende de GSB III periode vanuit hoofdstuk VII van de Rijksbegroting voor de uitkering ter
      beschikking worden gesteld; B: het procentuele aandeel van de gemeente in de middelen voor het terugdringen
      van voortijdig schoolverlaten, die gedurende de GSB III periode vanuit hoofdstuk VIII van de Rijksbegroting
      voor de uitkering ter beschikking worden gesteld; C: het procentuele aandeel van de gemeente in de middelen
      voor de bestrijding van gezondheidsachterstanden, die gedurende de GSB III periode vanuit hoofdstuk XVI van
      de Rijksbegroting voor de uitkering ter beschikking worden gesteld; D: het procentuele aandeel van de gemeente
      die behoort tot de centrumgemeenten voor maatschappelijke opvang en verslavingsbeleid in de middelen voor
      maatschappelijke opvang en verslavingsbeleid, die gedurende de GSB III periode vanuit hoofdstuk XVI van de
      Rijksbegroting voor de uitkering ter beschikking worden gesteld; E: het procentuele aandeel van de gemeente
      die behoort tot de centrumgemeenten voor vrouwenopvang in de middelen voor vrouwenopvang, die gedurende de GSB
      III periode vanuit hoofdstuk XVI van de Rijksbegroting voor de uitkering ter beschikking worden gesteld; F: het
      procentuele aandeel van de gemeente in de middelen voor de inburgering van nieuwkomers, die in 2005 en in 2006
      vanuit hoofdstuk VI van de Rijksbegroting voor de uitkering ter beschikking worden gesteld; G: het procentuele
      aandeel van de gemeente in de middelen voor de inburgering van oudkomers, die in 2005 en in 2006 vanuit hoofdstuk
      VI van de Rijksbegroting voor de uitkering ter beschikking worden gesteld; H: het procentuele aandeel van de
      gemeente in de extra middelen voor veiligheid, die gedurende de GSB III periode vanuit hoofdstuk VII van de
      Rijksbegroting voor de uitkering ter beschikking worden gesteld; I: de middelen voor leefbaarheid en veiligheid
      die gedurende de GSB III periode vanuit hoofdstuk VII van de Rijksbegroting voor de uitkering ter beschikking
      worden gesteld; J: de middelen voor het terugdringen van voortijdig schoolverlaten die gedurende de GSB III periode
      vanuit hoofdstuk VIII van de Rijksbegroting voor de uitkering ter beschikking worden gesteld; K: de middelen
      voor de bestrijding van gezondheidsachterstanden die gedurende de GSB III periode vanuit hoofdstuk XVI van de
      Rijksbegroting voor de uitkering ter beschikking worden gesteld; L: de middelen voor maatschappelijke opvang en
      verslavingsbeleid die gedurende de GSB III periode vanuit hoofdstuk XVI van de Rijksbegroting voor de uitkering
      ter beschikking worden gesteld; M: de middelen voor vrouwenopvang die gedurende de GSB III periode vanuit hoofdstuk
      XVI van de Rijksbegroting voor de uitkering ter beschikking worden gesteld; N: de middelen voor de inburgering
      van nieuwkomers die in 2005 en in 2006 vanuit hoofdstuk VI van de Rijksbegroting voor de uitkering ter beschikking
      worden gesteld; O: de middelen voor de inburgering van oudkomers die in 2005 en in 2006 vanuit hoofdstuk VI van de
      Rijksbegroting voor de uitkering ter beschikking worden gesteld; P: de extra middelen voor veiligheid die gedurende
      de GSB III periode vanuit hoofdstuk VII van de Rijksbegroting voor de uitkering ter beschikking worden gesteld; Q:
      het aandeel van de gemeente in de middelen voor inburgering die gedurende 2007, 2008 en 2009 vanuit hoofdstuk VI
      van de Rijksbegroting voor de uitkering ter beschikking worden gesteld.
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel4
  - number: '4.2'
    text: 'Bij of krachtens regeling van Onze Minister wordt de berekeningswijze vastgesteld volgens welke:'
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel4
  - number: 4.2.a
    text: |-
      de procentuele aandelen van de gemeenten, bedoeld in het eerste lid, onder de letters A tot en met H, worden
      bepaald;
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel4
  - number: 4.2.b
    text: |-
      het aandeel van de gemeenten, bedoeld in het eerste lid, onder letter Q, wordt bepaald, met dien verstande dat dit
      aandeel zal bestaan uit:
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel4
  - number: 4.2.b.1°
    text: een vast deel, en
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel4
  - number: 4.2.b.2°
    text: |-
      een deel dat wordt berekend op de grondslag van door de gemeente gerealiseerde prestaties, vermenigvuldigd met de
      bijbehorende bijdragevergoedingen, waarvan de hoogte per kalenderjaar kan verschillen.
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel4
  - number: '4.3'
    text: |-
      In afwijking van het eerste en tweede lid wordt het bedrag van de aan de gemeente Sittard-Geleen te verstrekken
      uitkering bij regeling van Onze Minister afzonderlijk vastgesteld.
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel4
  - number: '5.1'
    text: |-
      Het college van burgemeester en wethouders van een gemeente dient binnen acht weken na inwerkingtreding van dit
      besluit een aanvraag tot verlening van de uitkering in.
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel5
  - number: '5.2'
    text: |-
      De aanvraag gaat vergezeld van het meerjaren ontwikkelingsprogramma waarin de gemeenteraad de in de GSB III periode
      te bereiken resultaten heeft vastgelegd.
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel5
  - number: '5.3'
    text: |-
      Een aanvraag tot verlening van de drie brede doeluitkeringen van het Grotestedenbeleid die door het college van
      burgemeester en wethouders voor de inwerkingtreding van dit besluit is ingediend, wordt mede als een aanvraag tot
      verlening van de uitkering aangemerkt.
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel5
  - number: '5.4'
    text: |-
      Het college van burgemeester en wethouders dient voor 15 april 2007 een aanvraag in tot verlening van het aandeel,
      bedoeld in [artikel 4, eerste lid, onderdeel Q][ref1]. Het tweede lid is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018238#Artikel4
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0018238
        artikel: '4'
  - number: '6.1'
    text: |-
      Het college van burgemeester en wethouders verstrekt aan Onze Minister voor Vreemdelingenzaken en Integratie een
      prognose van het aantal oudkomers dat in 2005 en 2006 een inburgeringsprogramma voor oudkomers zal starten.
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel6
  - number: '6.2'
    text: |-
      Onze Minister voor Vreemdelingenzaken en Integratie geeft bij ministeriële regeling nadere regels voor de prognose
      en voor het tijdstip waarop deze moet worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel6
  - number: '7.1'
    text: |-
      Het ontwikkelingsprogramma bevat in ieder geval een gemotiveerde keuze van de resultaten die het gemeentebestuur in
      de GSB III periode wil bereiken ten aanzien van:
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel7
  - number: 7.1.a
    text: de bestrijding van criminaliteit, gepleegd door volwassen en jeugdige veelplegers;
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel7
  - number: 7.1.b
    text: de aanpak van overlast op straat, veroorzaakt door personen;
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel7
  - number: 7.1.c
    text: de aanpak van huiselijk geweld;
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel7
  - number: 7.1.d
    text: de bestrijding van criminaliteit in de woonomgeving en in risicogebieden buiten de woonomgeving;
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel7
  - number: 7.1.e
    text: het verbeteren van de veiligheid anders dan bedoeld onder a tot en met d;
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel7
  - number: 7.1.f
    text: de aanpak van onderwijsachterstanden;
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel7
  - number: 7.1.g
    text: |-
      het aantal personen onder de drieëntwintig jaar dat een startkwalificatie
      behaalt van tenminste het niveau van de basisberoepsopleiding, bedoeld in
      [artikel 7.2.2., eerste lid, onder b, van de Wet educatie en beroepsonderwijs][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
  - number: 7.1.h
    text: |-
      het aantal deelnemers aan een traject voor volwasseneneducatie, uitgesplitst naar activiteit als bedoeld in
      [artikel 7.3.1, eerste lid, van de Wet educatie en beroepsonderwijs][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
  - number: 7.1.i
    text: de aanpak van overgewicht onder personen van 0 tot 19 jaar;
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel7
  - number: 7.1.j
    text: de aanpak van gezondheidsachterstanden anders dan bedoeld onder i;
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel7
  - number: 7.1.k
    text: |-
      de doorstroming in de maatschappelijke opvang, indien de gemeente behoort tot de centrumgemeenten voor
      maatschappelijke opvang en verslavingsbeleid;
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel7
  - number: 7.1.l
    text: de capaciteit in de vrouwenopvang, indien de gemeente behoort tot de centrumgemeenten voor vrouwenopvang;
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel7
  - number: 7.1.m
    text: |-
      het bereik van de ambulante verslavingszorg, indien de gemeente behoort tot de centrumgemeenten voor
      maatschappelijke opvang en verslavingsbeleid;
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel7
  - number: 7.1.n
    text: |-
      de maatschappelijke opvang anders dan bedoeld onder k tot en met m, indien de gemeente behoort tot de
      centrumgemeenten voor maatschappelijke opvang en verslavingsbeleid;
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel7
  - number: 7.1.o
    text: 'inburgering van inburgeringsplichtigen en inburgeraars, te weten:'
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel7
  - number: 7.1.o.1°
    text: |-
      het aantal inburgeringsplichtigen en inburgeraars ten behoeve van wie voor de eerste keer een
      inburgeringsvoorziening of een gecombineerde inburgeringsvoorziening zal worden vastgesteld;
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel7
  - number: 7.1.o.2°
    text: |-
      het aantal inburgeringsplichtigen aan wie een handhavingsbeschikking zal worden bekendgemaakt dan wel een
      kennisgeving zal worden verstrekt;
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel7
  - number: 7.1.o.3°
    text: |-
      het aantal inburgeringsplichtigen en inburgeraars, tevens zijnde geestelijke bedienaar, ten behoeve van wie voor de
      eerste keer een inburgeringsvoorziening zal worden vastgesteld;
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel7
  - number: 7.1.o.4°
    text: |-
      het aantal inburgeringsplichtigen en inburgeraars dat op 1 januari 2007 deelneemt aan opleidingen educatie, bedoeld
      in [artikel 7.3.1, eerste lid, onderdeel d, van de Wet educatie en beroepsonderwijs][ref1], alsmede de omvang van
      het bedrag dat benodigd is om deze opleidingen educatie gedurende het jaar 2007 te bekostigen.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
  - number: '7.2'
    text: |-
      De resultaten ten aanzien van de onderwerpen, genoemd in het eerste lid, onder a tot en met o, worden geformuleerd
      met inachtneming van de bij regeling van Onze Minister vast te stellen indicatoren. Bij de regeling van Onze
      Minister worden de categorieën van middelen van het programmadeel, percentsgewijs toegedeeld aan één of meer
      indicatoren.
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel7
  - number: '7.3'
    text: |-
      Indien ten aanzien van een of meer onderdelen geen resultaten worden vastgesteld, bevat het ontwikkelingsprogramma
      daarvoor een motivering en worden de krachtens het tweede lid aan de desbetreffende indicatoren toegedeelde
      percentages naar rato toegedeeld aan de overige indicatoren.
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel7
  - number: '7.4'
    text: |-
      Bij regeling van Onze Minister worden indicatoren vastgesteld voor de maatschappelijke effecten die zijn bereikt
      met de uitvoering van het ontwikkelingsprogramma en voor het periodiek verschaffen van gegevens daarover aan Onze
      Minister. Deze indicatoren hebben betrekking op:
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel7
  - number: 7.4.a
    text: slachtofferschap;
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel7
  - number: 7.4.b
    text: onveiligheidsgevoelens in de buurt;
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel7
  - number: 7.4.c
    text: verloedering, en
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel7
  - number: 7.4.d
    text: sociale kwaliteit.
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel7
  - number: '8.1'
    text: |-
      De resultaten, bedoeld in [artikel 7, eerste lid, onderdelen a tot en met e][ref1], worden afgestemd met het
      driehoeksoverleg, bedoeld in [artikel 14 van de Politiewet 1993][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0018238#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0006299#Artikel14
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0018238
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0006299
        artikel: '14'
  - number: '8.2'
    text: In het ontwikkelingsprogramma worden de uitkomsten van de afstemming vermeld.
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel8
  - number: '9.1'
    text: |-
      Onze Minister neemt een beschikking tot verlening van de uitkering binnen acht weken na het tijdstip waarop de
      aanvraag door hem is ontvangen.
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel9
  - number: '9.2'
    text: |-
      In een geval als bedoeld in [artikel 5, derde lid][ref1], wordt de datum van inwerkingtreding van dit besluit
      aangemerkt als het tijdstip van de ontvangst van de aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0018238#Artikel5
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0018238
        artikel: '5'
  - number: '9.3'
    text: |-
      Onze Minister neemt een beschikking tot verlening van onderdeel Q, bedoeld in [artikel 4, eerste lid][ref1], van de
      uitkering binnen acht weken na het tijdstip waarop de aanvraag door hem is ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0018238#Artikel4
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0018238
        artikel: '4'
  - number: '9.4'
    text: |-
      De beschikking tot verlening van de uitkering vermeldt de wijze waarop het bedrag van de uitkering wordt bepaald.
      Voor het bepalen van de hoogte van onderdeel Q, bedoeld in [artikel 4, eerste lid][ref1], van de uitkering wordt
      met betrekking tot:


      [ref1]: https://wetten.overheid.nl/BWBR0018238#Artikel4
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0018238
        artikel: '4'
  - number: 9.4.a
    text: |-
      het deel, bedoeld in [artikel 4, tweede lid, onderdeel b, onder 1°][ref1], een vast bedrag vermeld, bestaande uit:


      [ref1]: https://wetten.overheid.nl/BWBR0018238#Artikel4
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0018238
        artikel: '4'
  - number: 9.4.a.1°
    text: |-
      het bedrag, bedoeld in [artikel 7, eerste lid, onderdeel o, onder 4°][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018238#Artikel7
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0018238
        artikel: '7'
  - number: 9.4.a.2°
    text: |-
      een door Onze Minister te bepalen bedrag ten behoeve van de door de gemeente te verstrekken informatie aan
      (potentiële) inburgeringsplichtigen omtrent het inburgeringsstelsel van de [Wet inburgering][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020611
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0020611
  - number: 9.4.b
    text: |-
      het deel, bedoeld in [artikel 4, tweede lid, onderdeel b, onder 2°][ref1], in plaats van de bijdragevergoedingen,
      bedoeld in [artikel 4, tweede lid, onderdeel b, onder 2°][ref2], uitgegaan van voorschotvergoedingen, waarvan de
      hoogte wordt bepaald volgens bij regeling van Onze Minister te stellen regels.


      [ref1]: https://wetten.overheid.nl/BWBR0018238#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0018238#Artikel4
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0018238
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0018238
        artikel: '4'
  - number: '9.5'
    text: |-
      De uitkering wordt verleend onder de voorwaarde dat door de begrotingswetgever voldoende middelen ter beschikking
      worden gesteld.
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel9
  - number: '10'
    text: |-
      Onze Minister verleent de gemeente slechts haar aandeel in de middelen voor de inburgering van oudkomers, indien
      zij een prognose als bedoeld in [artikel 6, eerste lid][ref1], aan Onze Minister voor Vreemdelingenzaken en
      Integratie heeft verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0018238#Artikel6
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0018238
        artikel: '6'
  - number: '11.1'
    text: |-
      Onze Minister kan een lager programmadeel verlenen dan het met toepassing van [artikel 4][ref1] bepaalde
      programmadeel, indien de in het ontwikkelingsprogramma opgenomen resultaten naar zijn oordeel daartoe aanleiding
      geven.


      [ref1]: https://wetten.overheid.nl/BWBR0018238#Artikel4
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0018238
        artikel: '4'
  - number: '11.2'
    text: |-
      Onze Minister geeft niet eerder toepassing aan het eerste lid dan nadat hij het college van burgemeester en
      wethouders heeft geïnformeerd waarom hij voornemens is daartoe over te gaan en hij het college binnen een door hem
      te bepalen termijn in de gelegenheid heeft gesteld een gewijzigd ontwikkelingsprogramma in te zenden.
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel11
  - number: '12'
    text: 'Onze Minister verbindt aan de verlening van de uitkering verplichtingen met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel12
  - number: 12.a
    text: |-
      de beschikbaarheid van een gemeentelijk systeem voor de registratie van de uitvoering van het
      ontwikkelingsprogramma;
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel12
  - number: 12.b
    text: |-
      de verstrekking van gegevens aan Onze Minister over de uitvoering van het ontwikkelingsprogramma die zijn ontleend
      aan het gemeentelijk systeem, bedoeld in onderdeel a.
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel12
  - number: '13.1'
    text: |-
      [Artikel 20, vierde lid, van de Wet maatschappelijke ondersteuning][ref1], en de krachtens dat artikellid
      vastgestelde ministeriële regelingen zijn van toepassing met dien verstande dat in dat artikellid voor «Een
      gemeente waaraan een uitkering als bedoeld in het eerste en tweede lid wordt verstrekt» wordt gelezen: Een gemeente
      die behoort tot de centrumgemeenten voor maatschappelijke opvang en verslavingsbeleid of voor vrouwenopvang,
      bedoeld in [artikel 1, onderdelen f en g][ref2], van het Besluit brede doeluitkering sociaal, integratie en
      veiligheid.


      [ref1]: https://wetten.overheid.nl/BWBR0020031#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0018238#Artikel1
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0020031
        artikel: '20'
      - id: ref2
        bwb_id: BWBR0018238
        artikel: '1'
  - number: '13.2'
    text: |-
      Het college van burgemeester en wethouders van een gemeente die behoort tot de centrumgemeenten voor
      maatschappelijke opvang en verslavingsbeleid of tot de centrumgemeenten voor vrouwenopvang overlegt over de
      aanwending van de uitkering met de colleges van burgemeester en wethouders van de omringende gemeenten.
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel13
  - number: '13.3'
    text: |-
      De door de gemeente uit de uitkering bekostigde voorzieningen op het terrein van maatschappelijke opvang en
      verslavingsbeleid en van vrouwenopvang zijn toegankelijk voor iedereen die in Nederland woont.
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel13
  - number: '14'
    text: 'Bij regeling van Onze Minister voor Vreemdelingenzaken en Integratie worden regels gegeven met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel14
  - number: 14.a
    text: het sluiten van een overeenkomst met de oudkomer die start met een inburgeringsprogramma voor oudkomers;
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel14
  - number: 14.b
    text: de inburgeringsprogramma’s voor oudkomers en
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel14
  - number: 14.c
    text: de van de oudkomer af te nemen toetsen.
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel14
  - number: '15.1'
    text: |-
      Het college van burgemeester en wethouders zendt tot en met 2009 voor 1 april van elk jaar aan Onze Minister voor
      Vreemdelingenzaken en Integratie een verslag over de uitvoering van de [Wet inburgering nieuwkomers][ref1] en over
      de door het gemeentebestuur aangeboden inburgeringsprogramma’s voor oudkomers in 2005 en 2006.


      [ref1]: https://wetten.overheid.nl/BWBR0009544
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0009544
  - number: '15.2'
    text: |-
      Het verslag bevat de bij regeling van Onze Minister voor Vreemdelingenzaken en Integratie vastgestelde gegevens
      waartoe in ieder geval behoren:
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel15
  - number: 15.2.a
    text: |-
      het aantal beschikkingen omtrent een inburgeringsprogramma, bedoeld in
      [artikel 1, onderdeel e, van het Bekostigingsbesluit inburgering nieuwkomers][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009768#Artikel1
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0009768
        artikel: '1'
  - number: 15.2.b
    text: |-
      het aantal door het bevoegd gezag van een instelling uitgereikte verklaringen als bedoeld in
      [artikel 7.4.15., eerste lid, van de Wet educatie en beroepsonderwijs][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
  - number: 15.2.c
    text: |-
      het aantal oudkomers dat een inburgeringsprogramma voor oudkomers is gestart, en met wie het gemeentebestuur een
      overeenkomst heeft gesloten, en
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel15
  - number: 15.2.d
    text: het aantal oudkomers dat een inburgeringsprogramma voor oudkomers heeft afgerond.
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel15
  - number: '15.3'
    text: |-
      Het college van burgemeester en wethouders zendt voor 1 april 2007 en voor 1 april 2008 aan Onze Minister voor
      Vreemdelingenzaken en Integratie de gegevens over het aantal oudkomers dat in 2006 respectievelijk 2007 een
      inburgeringsprogramma voor oudkomers heeft afgerond.
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel15
  - number: '15.4'
    text: |-
      Onze Minister voor Vreemdelingenzaken en Integratie stelt nadere regels vast voor de inrichting van het verslag,
      bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel15
  - number: '15.5'
    text: |-
      De gegevens, bedoeld in het tweede en derde lid, zijn voorzien van een verklaring omtrent de getrouwheid, afgegeven
      door een accountant als bedoeld in [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '15.6'
    text: |-
      Ten behoeve van de verklaring omtrent de getrouwheid, bedoeld in het vijfde lid, stelt Onze Minister van
      Vreemdelingenzaken en Integratie een controleprotocol vast.
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel15
  - number: '15.7'
    text: |-
      Aan Onze Minister voor Vreemdelingenzaken en Integratie wordt op diens verzoek inzicht gegeven in de gegevens die
      bij de controle op enigerlei wijze een rol spelen, en in de controlerapporten van de accountant.
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel15
  - number: '16.1'
    text: |-
      Indien gedurende de GSB III periode andere middelen dan bedoeld in [artikel 4, eerste lid][ref1], voor de uitkering
      beschikbaar komen, verhoogt Onze Minister de verleende uitkering volgens bij regeling van Onze Minister te stellen
      regels.


      [ref1]: https://wetten.overheid.nl/BWBR0018238#Artikel4
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0018238
        artikel: '4'
  - number: '16.2'
    text: |-
      Bij de regeling, bedoeld in het eerste lid, kan worden bepaald dat het gemeentebestuur binnen een bij of krachtens
      die regeling te bepalen termijn met inachtneming van de bij of krachtens die regeling vast te stellen indicatoren
      een wijziging van het ontwikkelingsprogramma bij Onze Minister indient.
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel16
  - number: '16.3'
    text: |-
      Indien in het kader van een wijziging van het ontwikkelingsprogramma, bedoeld in het tweede lid, indicatoren worden
      vastgesteld, is [artikel 7, tweede en derde lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018238#Artikel7
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0018238
        artikel: '7'
  - number: '16.4'
    text: De verhoging werkt terug tot en met het tijdstip waarop de uitkering is verleend.
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel16
  - number: '17.1'
    text: |-
      Onze Minister kan de regeling, bedoeld in [artikel 4, tweede lid][ref1], ten aanzien van de procentuele aandelen
      van de gemeenten in de middelen voor maatschappelijke opvang en verslavingsbeleid en voor vrouwenopvang éénmaal
      wijzigen.


      [ref1]: https://wetten.overheid.nl/BWBR0018238#Artikel4
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0018238
        artikel: '4'
  - number: '17.2'
    text: De wijziging geschiedt niet dan nadat
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel17
  - number: 17.2.a
    text: |-
      een onderzoek van Onze Minister van Volksgezondheid, Welzijn en Sport naar de verdeling van de middelen voor
      maatschappelijke opvang en verslavingsbeleid en voor vrouwenopvang heeft plaatsgevonden, en
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel17
  - number: 17.2.b
    text: |-
      het college van burgemeester en wethouders van de centrumgemeenten voor maatschappelijke opvang en
      verslavingsbeleid en het college van burgemeester en wethouders van de centrumgemeenten voor vrouwenopvang zijn
      gehoord over de resultaten van het onder a bedoeld onderzoek.
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel17
  - number: '17.3'
    text: |-
      Onze Minister brengt ambtshalve de verlening van de uitkering in overeenstemming met het gewijzigde procentuele
      aandeel van de gemeente in de middelen voor maatschappelijke opvang en verslavingsbeleid en voor vrouwenopvang.
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel17
  - number: '17.4'
    text: De wijziging werkt terug tot en met het tijdstip waarop de uitkering is verleend.
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel17
  - number: '18.1'
    text: De gemeenteraad kan de in het ontwikkelingsprogramma opgenomen te bereiken resultaten wijzigen.
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel18
  - number: '18.2'
    text: |-
      Het college van burgemeester en wethouders zendt een wijziging binnen vier weken na vaststelling, toe aan Onze
      Minister.
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel18
  - number: '18.3'
    text: |-
      Binnen tien weken na de ontvangst ervan besluit Onze Minister of de wijziging van het ontwikkelingsprogramma
      kan worden bekrachtigd. Indien het gewijzigde ontwikkelingsprogramma wordt bekrachtigd, kan Onze Minister tevens
      besluiten het verleende programmadeel te verlagen.
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel18
  - number: '18.4'
    text: |-
      De verlaging geschiedt naar evenredigheid van de krachtens [artikel 7, tweede lid en derde lid][ref1], en
      [artikel 16, derde lid][ref2], vastgestelde verdeling over de indicatoren.


      [ref1]: https://wetten.overheid.nl/BWBR0018238#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0018238#Artikel16
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0018238
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0018238
        artikel: '16'
  - number: '18.5'
    text: |-
      Onze Minister geeft geen toepassing aan het derde lid dan nadat hij het college van burgemeester en wethouders
      heeft geïnformeerd waarom hij voornemens is daartoe over te gaan en hij het college binnen een door hem te bepalen
      termijn in de gelegenheid heeft gesteld een aangepaste wijziging op het ontwikkelingsprogramma in te zenden.
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel18
  - number: '18.6'
    text: De verlaging werkt terug tot en met het tijdstip waarop de uitkering is verleend.
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel18
  - number: '19'
    text: |-
      Onze Minister kan ingeval van majeure wijzigingen van de financieel-economische omstandigheden het verleende
      programmadeel verlagen.
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel19
  - number: '20.1'
    text: Onze Minister verleent jaarlijks aan de gemeente één of meer voorschotten op het programmadeel.
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel20
  - number: '20.2'
    text: Onze Minister verleent in 2005 en in 2006 aan de gemeente één of meer voorschotten op het inburgeringsdeel.
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel20
  - number: '20.3'
    text: De verlening van de voorschotten geschiedt volgens bij regeling van Onze Minister te stellen regels.
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel20
  - number: '20.4'
    text: Voorschotten worden overeenkomstig de voorschotverlening betaald.
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel20
  - number: '20.5'
    text: Voorschotten worden binnen een bij de voorschotverlening te bepalen termijn betaald.
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel20
  - number: '20.6'
    text: |-
      De gemeente besteedt de ontvangen voorschotten uitsluitend aan activiteiten ten behoeve van de doeleinden als
      bedoeld in [artikel 3][ref1] die in de GSB III periode worden verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0018238#Artikel3
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0018238
        artikel: '3'
  - number: '20.7'
    text: |-
      De gemeente kan de betaalde voorschotten mede besteden aan omzetbelasting ter zake van de in het zesde lid bedoelde
      activiteiten die ingevolge de [Wet op het BTW-compensatiefonds][ref1] recht geeft op een bijdrage uit het fonds.


      [ref1]: https://wetten.overheid.nl/BWBR0013817
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0013817
  - number: '21'
    text: |-
      Het college van burgemeester en wethouders dient voor 1 april 2009 bij Onze Minister een aanvraag in tot
      vaststelling van het inburgeringsdeel.
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel21
  - number: '22.1'
    text: |-
      Indien Onze Minister op 1 april 2009 geen aanvraag tot vaststelling van het inburgeringsdeel heeft ontvangen, stelt
      hij dat deel ambtshalve vast.
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel22
  - number: '22.2'
    text: |-
      Onze Minister gaat niet over tot toepassing van het eerste lid dan nadat hij het college van burgemeester en
      wethouders in de gelegenheid heeft gesteld binnen een door hem te bepalen termijn alsnog een aanvraag in te dienen.
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel22
  - number: '23.1'
    text: Onze Minister stelt het inburgeringsdeel overeenkomstig de verlening vast.
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel23
  - number: '23.2'
    text: |-
      Onze Minister kan het inburgeringsdeel in afwijking van het eerste lid lager vaststellen, indien het
      gemeentebestuur na verlening van de uitkering niet heeft voldaan aan het bij of krachtens de [artikelen 14][ref1]
      en [15][ref2] bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0018238#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0018238#Artikel15
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0018238
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0018238
        artikel: '15'
  - number: '23.3'
    text: De vaststelling geeft aanspraak op betaling van het vastgestelde bedrag van het inburgeringsdeel.
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel23
  - number: '23.4'
    text: |-
      Het bedrag van het inburgeringsdeel wordt overeenkomstig de vaststelling betaald onder verrekening van betaalde
      voorschotten op het inburgeringsdeel.
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel23
  - number: '23.5'
    text: Het bedrag van het vastgestelde inburgeringsdeel wordt binnen twaalf maanden na de vaststelling betaald.
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel23
  - number: '23.6'
    text: |-
      Onverschuldigd betaalde voorschotten op het inburgeringsdeel kunnen worden teruggevorderd zolang nog geen vijf
      jaren zijn verstreken na de dag waarop het inburgeringsdeel is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel23
  - number: '23.7'
    text: |-
      Onverschuldigd betaalde voorschotten op het inburgeringsdeel kunnen tevens worden verrekend met nog door Onze
      Minister voor Vreemdelingenzaken en Integratie aan de gemeente te betalen bedragen.
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel23
  - number: '24.1'
    text: |-
      Het college van burgemeester en wethouders dient voor 15 juli 2010 bij Onze Minister een aanvraag in tot
      vaststelling van het programmadeel.
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel24
  - number: '24.2'
    text: |-
      Bij de beoordeling van de aanvraag wordt gebruik gemaakt van de verantwoordingsinformatie, bedoeld in
      [artikel 58a van het Besluit begroting en verantwoording provincies en gemeenten][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014606#Artikel58a
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0014606
        artikel: 58a
  - number: '24.3'
    text: |-
      Indien de in het ontwikkelingsprogramma opgenomen resultaten niet volledig zijn behaald en het gemeentebestuur
      een verzoek doet als bedoeld in [artikel 27, vijfde lid][ref1], neemt zij in het verslag over de besteding van de
      verleende voorschotten, bedoeld in het vierde lid, de verdeling van die besteding over die resultaten op.


      [ref1]: https://wetten.overheid.nl/BWBR0018238#Artikel27
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0018238
        artikel: '27'
  - number: '24.4'
    text: Onze Minister stelt binnen vier maanden na ontvangst van de aanvraag het bedrag van het programmadeel vast.
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel24
  - number: '24.5'
    text: |-
      De termijn, bedoeld in het tiende lid, wordt opgeschort met ingang van de dag waarop Onze Minister de gemeente
      mededeelt dat hij voornemens is om toepassing te geven aan [artikel 26, eerste lid][ref1], tot de dag waarop hij
      het verslag, bedoeld in [artikel 26, tweede lid][ref2], heeft ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0018238#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0018238#Artikel26
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0018238
        artikel: '26'
      - id: ref2
        bwb_id: BWBR0018238
        artikel: '26'
  - number: '25.1'
    text: |-
      Indien Onze Minister op 15 juli 2010 geen aanvraag tot vaststelling van het programmadeel heeft ontvangen, stelt
      hij dat deel ambtshalve vast.
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel25
  - number: '25.2'
    text: |-
      Onze Minister gaat niet over tot toepassing van het eerste lid dan nadat hij de gemeente in de gelegenheid heeft
      gesteld binnen een door hem te bepalen termijn alsnog een aanvraag in te dienen.
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel25
  - number: '26.1'
    text: |-
      Indien uit de verantwoordingsinformatie, bedoeld in [artikel 24, tweede lid][ref1], blijkt dat de in het
      ontwikkelingsprogramma opgenomen resultaten niet volledig zijn bereikt, kan Onze Minister een periode voor het
      gemeentebestuur vaststellen om de ontbrekende resultaten alsnog te realiseren.


      [ref1]: https://wetten.overheid.nl/BWBR0018238#Artikel24
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0018238
        artikel: '24'
  - number: '26.2'
    text: |-
      Het college van burgemeester en wethouders zendt aan Onze Minister na afloop van de periode, bedoeld in het eerste
      lid, binnen een door hem te bepalen termijn een verantwoordingsverslag over de realisatie van de ontbrekende
      resultaten, bedoeld in het eerste lid. Dat verantwoordingsverslag wordt vormgegeven volgens het model, bedoeld in
      [artikel 58a van het Besluit begroting en verantwoording provincies en gemeenten][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014606#Artikel58a
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0014606
        artikel: 58a
  - number: '26.3'
    text: |-
      Indien een deel van de verleende voorschotten niet is besteed aan de bestedingsdoeleinden, bedoeld in
      [artikel 3, eerste lid][ref1], wordt bij de verantwoordingsinformatie, bedoeld in [artikel 24, tweede lid][ref2],
      tevens verantwoordingsinformatie gevoegd over de besteding van dat deel.


      [ref1]: https://wetten.overheid.nl/BWBR0018238#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0018238#Artikel24
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0018238
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0018238
        artikel: '24'
  - number: '27.1'
    text: |-
      Onze Minister stelt het programmadeel overeenkomstig de verlening vast, met dien verstande dat bij het
      vaststellen van onderdeel Q, bedoeld in [artikel 4, eerste lid][ref1], de door de gemeente behaalde resultaten
      worden betrokken met inachtneming van de bij regeling van Onze Minister vast te stellen berekeningswijze en de
      voorschotvergoedingen, bedoeld in [artikel 9, vierde lid][ref2], worden vervangen door de bijdragevergoedingen,
      bedoeld in [artikel 4, tweede lid, onderdeel b, onder 2°][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0018238#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0018238#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0018238#Artikel4
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0018238
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0018238
        artikel: '9'
      - id: ref3
        bwb_id: BWBR0018238
        artikel: '4'
  - number: '27.2'
    text: 'Onze Minister stelt het programmadeel in afwijking van het eerste lid lager vast, indien:'
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel27
  - number: 27.2.a
    text: |-
      uit de verantwoordingsinformatie, bedoeld in [artikel 24, tweede lid][ref1], of uit het verslag, bedoeld in
      [artikel 26, tweede lid][ref2], blijkt dat de in het ontwikkelingsprogramma opgenomen resultaten niet volledig
      zijn bereikt;


      [ref1]: https://wetten.overheid.nl/BWBR0018238#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0018238#Artikel26
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0018238
        artikel: '24'
      - id: ref2
        bwb_id: BWBR0018238
        artikel: '26'
  - number: 27.2.b
    text: |-
      het gemeentebestuur niet heeft voldaan aan de ingevolge [artikel 12][ref1] aan de verlening van de uitkering
      verbonden verplichtingen, of


      [ref1]: https://wetten.overheid.nl/BWBR0018238#Artikel12
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0018238
        artikel: '12'
  - number: 27.2.c
    text: |-
      de gemeente verleende voorschotten voor een ander doel heeft aangewend dan voor de activiteiten, bedoeld in
      [artikel 20, zesde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018238#Artikel20
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0018238
        artikel: '20'
  - number: 27.2.d
    text: |-
      de door de gemeente gerealiseerde resultaten en de uitkomst van de berekeningswijze, bedoeld in het eerste lid,
      daartoe aanleiding geven.
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel27
  - number: '27.3'
    text: |-
      Onze Minister geeft geen toepassing aan het tweede lid, onderdeel a, indien de gemeente in de
      verantwoordingsinformatie, bedoeld in [artikel 24, tweede lid][ref1], dan wel in het verslag, bedoeld in
      [artikel 26, derde lid][ref2], naar zijn oordeel genoegzaam heeft aangetoond dat het niet volledig bereiken van de
      in het ontwikkelingsprogramma opgenomen resultaten haar niet kan worden toegerekend.


      [ref1]: https://wetten.overheid.nl/BWBR0018238#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0018238#Artikel26
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0018238
        artikel: '24'
      - id: ref2
        bwb_id: BWBR0018238
        artikel: '26'
  - number: '27.4'
    text: |-
      De lagere vaststelling van het programmadeel ingevolge het tweede lid, onderdeel a, geschiedt naar evenredigheid
      van de krachtens [artikel 7, tweede lid en derde lid][ref1], en [artikel 16, derde lid][ref2], vastgestelde
      verdeling over de indicatoren.


      [ref1]: https://wetten.overheid.nl/BWBR0018238#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0018238#Artikel16
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0018238
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0018238
        artikel: '16'
  - number: '27.5'
    text: |-
      Behalve ten aanzien van onderdeel Q, bedoeld in [artikel 4, eerste lid][ref1], kan Onze Minister in afwijking
      van het vierde lid de lagere vaststelling van het programmadeel ingevolge het tweede lid, onderdeel a, op
      verzoek van het gemeentebestuur, bepalen aan de hand van de relatieve verdeling van de besteding van de verleende
      voorschotten over de in het ontwikkelingsprogramma opgenomen resultaten ten aanzien van de indicatoren, zoals die
      de verantwoordingsinformatie, bedoeld in [artikel 24, tweede lid][ref2], en in [artikel 26, derde lid][ref3], is
      opgenomen. Ten behoeve van de lagere vaststelling past hij de hierbedoelde relatieve verdeling toe op het totaal
      van de verleende rijksbijdrage.


      [ref1]: https://wetten.overheid.nl/BWBR0018238#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0018238#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0018238#Artikel26
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0018238
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0018238
        artikel: '24'
      - id: ref3
        bwb_id: BWBR0018238
        artikel: '26'
  - number: '27.6'
    text: |-
      Het programmadeel kan in afwijking van het eerste lid, volgens bij regeling van Onze Minister vast te stellen
      regels, hoger worden vastgesteld, indien het gemeentebestuur de in het ontwikkelingsprogramma opgenomen resultaten
      heeft overtroffen en dit naar zijn oordeel aan het gemeentebestuur kan worden toegerekend.
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel27
  - number: '27.7'
    text: |-
      In afwijking van het zesde lid wordt onderdeel Q, bedoeld in [artikel 4, eerste lid][ref1], van het programmadeel
      hoger vastgesteld indien de door de gemeente gerealiseerde resultaten en de uitkomst van de berekeningswijze,
      bedoeld in het eerste lid, daartoe aanleiding geven.


      [ref1]: https://wetten.overheid.nl/BWBR0018238#Artikel4
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0018238
        artikel: '4'
  - number: '27.8'
    text: De vaststelling geeft aanspraak op betaling van het vastgestelde bedrag van het programmadeel.
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel27
  - number: '27.9'
    text: |-
      Het bedrag van het programmadeel wordt overeenkomstig de vaststelling betaald onder verrekening van betaalde
      voorschotten op het programmadeel.
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel27
  - number: '27.10'
    text: Het bedrag van het programmadeel wordt binnen vier weken na de vaststelling betaald.
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel27
  - number: '27.11'
    text: |-
      Onze Minister neemt geen beslissing als bedoeld in het derde lid, geen toepassing te geven aan het tweede lid,
      onderdeel a, dan nadat hij het oordeel van een deskundige heeft gevraagd ten aanzien van de in het verslag
      opgenomen redengeving voor het niet volledig bereiken van de in het ontwikkelingsprogramma opgenomen resultaten.
      Onze Minister wijst niet eerder een deskundige aan dan nadat hij het college van burgemeester en wethouders in de
      gelegenheid heeft gesteld te worden gehoord.
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel27
  - number: '27.12'
    text: |-
      Het elfde lid vindt geen toepassing indien het college van burgemeester en wethouders een daartoe strekkend verzoek
      aan Onze Minister heeft gedaan.
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel27
  - number: '28'
    text: |-
      Onverschuldigd betaalde voorschotten op het programmadeel kunnen worden teruggevorderd zolang nog geen vijf jaren
      zijn verstreken na de dag waarop het programmadeel is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel28
  - number: '29.1'
    text: |-
      Het college van burgemeester en wethouders van een gemeente verstrekt desgevraagd inlichtingen omtrent de besteding
      van de verleende voorschotten en de realisatie van de in het ontwikkelingsplan opgenomen doelstellingen aan de door
      Onze Minister aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel29
  - number: '29.2'
    text: |-
      De ambtenaren, bedoeld in het eerste lid, kunnen ten aanzien van de verantwoordingsinformatie, bedoeld
      in [artikel 24, tweede lid][ref1], en [artikel 26, derde lid][ref2], tevens informatie inwinnen bij de in
      [artikel 213, tweede lid, van de Gemeentewet][ref3] bedoelde accountants.


      [ref1]: https://wetten.overheid.nl/BWBR0018238#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0018238#Artikel26
      [ref3]: https://wetten.overheid.nl/BWBR0005416#Artikel213
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0018238
        artikel: '24'
      - id: ref2
        bwb_id: BWBR0018238
        artikel: '26'
      - id: ref3
        bwb_id: BWBR0005416
        artikel: '213'
  - number: '33.1'
    text: |-
      De specifieke uitkeringen die krachtens het
      [Besluit specifieke uitkeringen maatschappelijke opvang, vrouwenopvang en verslavingsbeleid][ref1] door Onze
      Minister van Volksgezondheid, Welzijn en Sport voor 2005 aan een gemeente worden verleend. bedragen nihil.


      [ref1]: https://wetten.overheid.nl/BWBR0009936
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0009936
  - number: '33.2'
    text: |-
      De door Onze Minister van Volksgezondheid, Welzijn en Sport in 2005 aan een gemeente onverschuldigde ingevolge
      __REF000___________________________________________________________________________________________________________
      ______________ betaalde voorschotten, worden verrekend met in 2005 door Onze Minister verleende voorschotten op
      het programmadeel.


      [ref1]: https://wetten.overheid.nl/BWBR0009936#Artikel5
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0009936
        artikel: '5'
  - number: '34.1'
    text: |-
      Onze Minister kan aan één of meer rechtspersonen subsidies verstrekken voor activiteiten die passen in het
      Grotestedenbeleid.
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel34
  - number: '34.2'
    text: |-
      Bij regeling van Onze Minister worden regels gegeven voor de verstrekking van de subsidies, bedoeld in het eerste
      lid.
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel34
  - number: 34a
    text: |-
      De aanvraag tot verlening van de uitkering, bedoeld in [artikel 5][ref1], zoals die door de colleges van
      burgemeester en wethouders is gedaan, wordt voor het inburgeringsdeel geacht mede betrekking te hebben op het jaar
      2006.


      [ref1]: https://wetten.overheid.nl/BWBR0018238#Artikel5
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel34a
    references:
      - id: ref1
        bwb_id: BWBR0018238
        artikel: '5'
  - number: '35.1'
    text: |-
      Dit besluit treedt in werking met ingang van de eerste dag na de datum van uitgifte van het Staatsblad waarin het
      wordt geplaatst en werkt voor wat betreft [artikel 6][ref1] terug tot en met 1 november 2004, voor wat betreft
      [artikel 31][ref2] terug tot en met 1 september 2004 en voor wat betreft de [artikelen 32][ref3] en [34][ref4] tot
      en met 1 januari 2005.


      [ref1]: https://wetten.overheid.nl/BWBR0018238#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0018238#Artikel31
      [ref3]: https://wetten.overheid.nl/BWBR0018238#Artikel32
      [ref4]: https://wetten.overheid.nl/BWBR0018238#Artikel34
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0018238
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0018238
        artikel: '31'
      - id: ref3
        bwb_id: BWBR0018238
        artikel: '32'
      - id: ref4
        bwb_id: BWBR0018238
        artikel: '34'
  - number: '35.2'
    text: |-
      [Artikel 31][ref1] vervalt met ingang van het tijdstip dat het bij koninklijke boodschap van 10 juni 2004
      ingediende voorstel van wet tot wijziging van de Wet inburgering nieuwkomers en de Wet educatie en beroepsonderwijs
      (vrijgeven cursusaanbod WIN) (29 646) tot wet is verheven en in werking is getreden.


      [ref1]: https://wetten.overheid.nl/BWBR0018238#Artikel31
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0018238
        artikel: '31'
  - number: '36'
    text: 'Dit besluit wordt aangehaald als: Besluit brede doeluitkering sociaal, integratie en veiligheid.'
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel36
