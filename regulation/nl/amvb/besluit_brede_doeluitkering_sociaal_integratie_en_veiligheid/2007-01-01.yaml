  - number: '1.2'
    text: |-
      In afwijking van het eerste lid, aanhef en onderdeel d, loopt de GSB III periode voor de gemeente Sittard-Geleen
      van 1 januari 2006 tot en met 31 december 2009.
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel1
  - number: '2'
    text: |-
      Onze Minister oefent de hem bij of krachtens dit besluit toegekende bevoegdheden uit in overeenstemming met Onze
      Minister of Onze Ministers wie het mede aangaat.
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel2
  - number: '3'
    text: 'Onze Minister verstrekt voor de GSB III periode aan een gemeente een brede doeluitkering ten behoeve van:'
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel3
  - number: 3.a
    text: de uitvoering van het ontwikkelingsprogramma, en
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel3
  - number: 3.b
    text: |-
      de uitvoering van de [artikelen 4][ref1], [5][ref2], [6, eerste lid][ref3], en
      [15 van de Wet inburgering nieuwkomers][ref4] en het aanbieden van inburgeringsprogramma’s voor oudkomers in 2005
      en 2006.


      [ref1]: https://wetten.overheid.nl/BWBR0009544#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0009544#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0009544#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0009544#Artikel15
    url: https://wetten.overheid.nl/BWBR0018238/2007-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0009544
        artikel: '4'
