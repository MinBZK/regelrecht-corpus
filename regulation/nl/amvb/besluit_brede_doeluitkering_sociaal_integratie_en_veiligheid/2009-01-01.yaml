        artikel: '4'
  - number: '6'
    text: |-
      1 Het college van burgemeester en wethouders verstrekt aan Onze Minister een prognose van het aantal oudkomers dat
      in 2005 en 2006 een inburgeringsprogramma voor oudkomers zal starten.

      2 Onze Minister geeft bij ministeriële regeling nadere regels voor de prognose en voor het tijdstip waarop deze
      moet worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0018238/2009-01-01#Artikel6
  - number: '7'
    text: |-
      1 Het ontwikkelingsprogramma bevat in ieder geval een gemotiveerde keuze van de resultaten die het gemeentebestuur
      in de GSB III periode wil bereiken ten aanzien van:

      a. de bestrijding van criminaliteit, gepleegd door volwassen en jeugdige veelplegers;

      b. de aanpak van overlast op straat, veroorzaakt door personen;

      c. de aanpak van huiselijk geweld;

      d. de bestrijding van criminaliteit in de woonomgeving en in risicogebieden buiten de woonomgeving;

      e. het verbeteren van de veiligheid anders dan bedoeld onder a tot en met d;

      f. de aanpak van onderwijsachterstanden;

      g. het aantal personen onder de drieëntwintig jaar dat een startkwalificatie
      behaalt van tenminste het niveau van de basisberoepsopleiding, bedoeld in
      [artikel 7.2.2., eerste lid, onder b, van de Wet educatie en beroepsonderwijs][ref1];

      h. het aantal deelnemers aan een traject voor volwasseneneducatie, uitgesplitst naar activiteit als bedoeld in
      [artikel 7.3.1, eerste lid, van de Wet educatie en beroepsonderwijs][ref2];

      i. de aanpak van overgewicht onder personen van 0 tot 19 jaar;

      j. de aanpak van gezondheidsachterstanden anders dan bedoeld onder i;

      k. de doorstroming in de maatschappelijke opvang, indien de gemeente behoort tot de centrumgemeenten voor
      maatschappelijke opvang en verslavingsbeleid;

      l. de capaciteit in de vrouwenopvang, indien de gemeente behoort tot de centrumgemeenten voor vrouwenopvang;

      m. het bereik van de ambulante verslavingszorg, indien de gemeente behoort tot de centrumgemeenten voor
      maatschappelijke opvang en verslavingsbeleid;

      n. de maatschappelijke opvang anders dan bedoeld onder k tot en met m, indien de gemeente behoort tot de
      centrumgemeenten voor maatschappelijke opvang en verslavingsbeleid;

      o. inburgering van inburgeringsplichtigen en inburgeraars, te weten:

      1°. het aantal inburgeringsplichtigen en inburgeraars ten behoeve van wie voor de eerste keer een
      inburgeringsvoorziening of een gecombineerde inburgeringsvoorziening zal worden vastgesteld;

      2°. het aantal inburgeringsplichtigen aan wie een handhavingsbeschikking zal worden bekendgemaakt dan wel een
      kennisgeving zal worden verstrekt;

      3°. het aantal inburgeringsplichtigen en inburgeraars, tevens zijnde geestelijke bedienaar, ten behoeve van wie
      voor de eerste keer een inburgeringsvoorziening zal worden vastgesteld;

      4°. het aantal inburgeringsplichtigen en inburgeraars dat op 1 januari 2007 deelneemt aan opleidingen educatie,
      bedoeld in [artikel 7.3.1, eerste lid, onderdeel d, van de Wet educatie en beroepsonderwijs][ref3], alsmede de
      omvang van het bedrag dat benodigd is om deze opleidingen educatie gedurende het jaar 2007 te bekostigen;

      5º. het aantal inburgeringsplichtigen, bedoeld in het besluit van de Staatssecretaris van Justitie van 12 juni
      2007, nr. 2007/11, houdende wijziging van de Vreemdelingencirculaire 2000, aan wie geen persoonsvolgend budget
      is verstrekt, ten behoeve van wie voor de eerste keer een inburgeringsvoorziening zal worden vastgesteld in het
      komende kalenderjaar, als bedoeld in [artikel 5, vijfde lid][ref4];

      6°. het aantal inburgeringsplichtigen, inburgeringsplichtigen, bedoeld in het besluit van de Staatssecretaris
      van Justitie van 12 juni 2007, nr. 2007/11, houdende wijziging van de Vreemdelingencirculaire 2000, aan wie
      geen persoonsvolgend budget is verstrekt en inburgeraars ten behoeve van wie voor de eerste keer een duale
      inburgeringsvoorziening als bedoeld in [artikel 1.1, onderdeel r, van het Besluit inburgering][ref5] zal worden
      vastgesteld en aan wie geen lening als bedoeld in [artikel 16 van de Wet inburgering][ref6] is verstrekt, hetzij
      ten behoeve van wie die lening in zijn geheel is terugbetaald;

      7°. het aantal inburgeringsplichtigen, inburgeringsplichtigen, bedoeld in het besluit van de Staatssecretaris
      van Justitie van 12 juni 2007, nr. 2007/11, houdende wijziging van de Vreemdelingencirculaire 2000, aan
      wie geen persoonsvolgend budget is verstrekt en inburgeraars ten behoeve van wie voor de eerste keer een
      taalkennisvoorziening als bedoeld in [artikel 19, tweede lid, van de Wet inburgering][ref7] zal worden vastgesteld
      en aan wie geen lening als bedoeld in [artikel 16 van de Wet inburgering][ref8] is verstrekt, hetzij ten behoeve
      van wie die lening in zijn geheel is terugbetaald.

      2 De resultaten ten aanzien van de onderwerpen, genoemd in het eerste lid, onder a tot en met o, worden
      geformuleerd met inachtneming van de bij regeling van Onze Minister vast te stellen indicatoren. Bij de regeling
      van Onze Minister worden de categorieën van middelen van het programmadeel, percentsgewijs toegedeeld aan één of
      meer indicatoren.

      3 Indien ten aanzien van een of meer onderdelen geen resultaten worden vastgesteld, bevat het
      ontwikkelingsprogramma daarvoor een motivering en worden de krachtens het tweede lid aan de desbetreffende
      indicatoren toegedeelde percentages naar rato toegedeeld aan de overige indicatoren.

      4 Bij regeling van Onze Minister worden indicatoren vastgesteld voor de maatschappelijke effecten die zijn bereikt
      met de uitvoering van het ontwikkelingsprogramma en voor het periodiek verschaffen van gegevens daarover aan Onze
      Minister. Deze indicatoren hebben betrekking op:

      a. slachtofferschap;

      b. onveiligheidsgevoelens in de buurt;

      c. verloedering, en

      d. sociale kwaliteit.


