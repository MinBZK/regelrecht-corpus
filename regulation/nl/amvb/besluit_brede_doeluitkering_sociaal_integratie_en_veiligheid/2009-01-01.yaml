        artikel: '7'
      - id: ref2
        bwb_id: BWBR0018238
        artikel: '16'
  - number: '19'
    text: |-
      Onze Minister kan ingeval van majeure wijzigingen van de financieel-economische omstandigheden het verleende
      programmadeel verlagen.
    url: https://wetten.overheid.nl/BWBR0018238/2009-01-01#Artikel19
  - number: '20'
    text: |-
      1 Onze Minister verleent jaarlijks aan de gemeente één of meer voorschotten op het programmadeel.

      2 Onze Minister verleent in 2005 en in 2006 aan de gemeente één of meer voorschotten op het inburgeringsdeel.

      3 De verlening van de voorschotten geschiedt volgens bij regeling van Onze Minister te stellen regels.

      4 Voorschotten worden overeenkomstig de voorschotverlening betaald.

      5 Voorschotten worden binnen een bij de voorschotverlening te bepalen termijn betaald.

      6 De gemeente besteedt de ontvangen voorschotten uitsluitend aan activiteiten ten behoeve van de doeleinden als
      bedoeld in [artikel 3][ref1] die in de GSB III periode worden verricht.

      7 De gemeente kan de betaalde voorschotten in de jaren 2005 tot en met 2007 mede besteden aan omzetbelasting ter
      zake van de in het zesde lid bedoelde activiteiten die ingevolge de [Wet op het BTW-compensatiefonds][ref2] recht
      geeft op een bijdrage uit het fonds.


      [ref1]: https://wetten.overheid.nl/BWBR0018238#Artikel3
