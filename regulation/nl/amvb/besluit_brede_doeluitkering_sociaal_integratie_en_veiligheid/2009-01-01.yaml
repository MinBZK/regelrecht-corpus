  - number: '25'
    text: |-
      1 Indien Onze Minister op 15 juli 2010 geen aanvraag tot vaststelling van het programmadeel heeft ontvangen, stelt
      hij dat deel ambtshalve vast.

      2 Onze Minister gaat niet over tot toepassing van het eerste lid dan nadat hij de gemeente in de gelegenheid heeft
      gesteld binnen een door hem te bepalen termijn alsnog een aanvraag in te dienen.
    url: https://wetten.overheid.nl/BWBR0018238/2009-01-01#Artikel25
  - number: '26'
    text: |-
      1 Indien uit de verantwoordingsinformatie, bedoeld in [artikel 24, tweede lid][ref1], blijkt dat de in het
      ontwikkelingsprogramma opgenomen resultaten niet volledig zijn bereikt, kan Onze Minister een periode voor het
      gemeentebestuur vaststellen om de ontbrekende resultaten alsnog te realiseren.

      2 Het college van burgemeester en wethouders zendt aan Onze Minister na afloop van de periode, bedoeld in
      het eerste lid, binnen een door hem te bepalen termijn de verantwoordingsinformatie over de realisatie van de
      ontbrekende resultaten, bedoeld in het eerste lid. Die verantwoordingsinformatie wordt vormgegeven volgens het
      model, bedoeld in [artikel 58a van het Besluit begroting en verantwoording provincies en gemeenten][ref2].

      3 Indien een deel van de verleende voorschotten niet is besteed aan de bestedingsdoeleinden, bedoeld in
      [artikel 3][ref3], wordt bij de verantwoordingsinformatie, bedoeld in [artikel 24, tweede lid][ref4], tevens
      verantwoordingsinformatie gevoegd over de besteding van dat deel.

      4 Indien Onze Minister toepassing heeft gegeven aan het eerste lid stelt hij, in afwijking van
      [artikel 24, vierde lid][ref5], binnen de termijn, genoemd in dat lid, het deel van het bedrag van het
      programmadeel vast dat overeenkomt met de resultaten die volledig zijn bereikt. Voor het deel van het bedrag van
      het programmadeel dat overeenkomt met de niet volledig bereikte resultaten, bedoeld in het eerste lid, wordt de
      termijn, bedoeld in [artikel 24, vierde lid][ref6], opgeschort met ingang van de dag waarop Onze Minister het
      college van burgemeester en wethouders mededeelt dat hij voornemens is om toepassing te geven aan het eerste lid
      tot de dag waarop hij het verslag, bedoeld in het tweede lid, heeft ontvangen.


