preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister voor Bestuurlijke Vernieuwing en Koninkrijksrelaties van 15 december 2004, nr.
    2004-0000041290, Directie Grotestedenbeleid en Interbestuurlijke Betrekkingen, gedaan mede namens Onze Ministers
    van Justitie, voor Vreemdelingenzaken en Integratie, van Binnenlandse Zaken en Koninkrijksrelaties en van
    Onderwijs, Cultuur en Wetenschap, alsmede de Staatssecretaris van Onderwijs, Cultuur en Wetenschap, drs. M. Rutte,
    en de Staatssecretaris van Volksgezondheid, Welzijn en Sport;

    Gelet op artikel 89 van de Grondwet, artikel 17, derde lid, van de Financiële-verhoudingswet, artikel 10a, eerste
    en tweede lid, van de Welzijnswet 1994, artikel 16 van de Wet inburgering nieuwkomers en artikel 2.3.1, tweede lid,
    van de Wet educatie en beroepsonderwijs;

    De Raad van State gehoord (advies van 21 februari 2005, nr. W04.04.0608/I);

    Gezien het nader rapport van Onze Minister voor Bestuurlijke Vernieuwing en Koninkrijksrelaties van 12 april 2005,
    nr. 2005-0000045459, Directie Grotestedenbeleid en Interbestuurlijke Betrekkingen, uitgebracht mede namens Onze
    Ministers van Justitie, voor Vreemdelingenzaken en Integratie, van Binnenlandse Zaken en Koninkrijksrelaties,
    van Onderwijs, Cultuur en Wetenschap en van Volksgezondheid, Welzijn en Sport, alsmede de Staatssecretaris van
    Onderwijs, Cultuur en Wetenschap, drs. M. Rutte, en de Staatssecretaris van Volksgezondheid, Welzijn en Sport;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0018238/2009-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. Onze Minister: Onze Minister belast met de coördinatie van het Grotestedenbeleid;

      b. G31: de gemeenten Alkmaar, Almelo, Amersfoort, Amsterdam, Arnhem, Breda, Den Haag, Deventer, Dordrecht,
      Eindhoven, Emmen, Enschede, Groningen, Haarlem, Heerlen, Helmond, Hengelo (Overijssel), ´s-Hertogenbosch,
      Leeuwarden, Leiden, Lelystad, Maastricht, Nijmegen, Rotterdam, Schiedam, Sittard-Geleen, Tilburg, Utrecht, Venlo,
      Zaanstad en Zwolle;

      c. gemeente: een tot de G31 behorende gemeente;

      d. GSB III periode: de periode van 1 januari 2005 tot en met 31 december 2009;

      e. uitkering: de brede doeluitkering, bedoeld in [artikel 3][ref1];

      f. centrumgemeenten voor maatschappelijke opvang en verslavingsbeleid: de G31 met uitzondering van de gemeenten
      Hengelo (Overijssel), Lelystad, Schiedam en Sittard-Geleen;

      g. centrumgemeenten voor vrouwenopvang: de G31 met uitzondering van de gemeenten Almelo, Deventer, Hengelo
      (Overijssel), Lelystad, Schiedam en Sittard-Geleen;

      h. nieuwkomer: de vreemdeling, bedoeld in [artikel 1, eerste lid, onderdeel a, ten eerste][ref2], en de
      Nederlander, bedoeld in [artikel 1, eerste lid, onderdeel a, ten tweede van de Wet inburgering nieuwkomers][ref3];

      i. oudkomer:

      1. persoon die 18 jaar of ouder is, die buiten Nederland is geboren en behoort tot een etnische
      minderheidsgroep, die rechtmatig in Nederland verblijft anders dan voor een tijdelijk doel als bepaald
      bij of krachtens de [Wet inburgering nieuwkomers][ref4], en die niet verplicht is om op grond van de
      [Wet inburgering nieuwkomers][ref5] een inburgeringsprogramma te volgen;

      2. geestelijke bedienaar als bedoeld in de
      [Regeling aanwijzing bijzondere categorieën vreemdelingen ten behoeve van inburgering][ref6], die niet verplicht
      is om op grond van de [Wet inburgering nieuwkomers][ref7] een inburgerings-programma te volgen;

      j. inburgeringsprogramma voor oudkomers: een inburgeringsprogramma dat oudkomers volgen en waarin het onderdeel
      Nederlands als tweede taal kan worden gekoppeld aan onderdelen voor het bereiken van werk, toegang tot
      beroepsonderwijs, opvoedingsondersteuning of sociale activering;

      k. volwasseneneducatie: onderwijs als bedoeld in
      [artikel 7.3.1., eerste lid, van de Wet educatie en beroepsonderwijs][ref8];

      l. ontwikkelingsprogramma: het meerjaren ontwikkelingsprogramma, bedoeld in [artikel 5, tweede lid][ref9];

      m. volwassen veelpleger: een persoon van 18 jaar of ouder tegen wie meer dan tien processen-verbaal wegens een
      misdrijf zijn opgemaakt;

      n. jeugdige veelpleger: een persoon van 12 tot en met 17 jaar tegen wie meer dan vijf processen-verbaal wegens een
      misdrijf zijn opgemaakt;

      o. inburgeringsdeel: het deel van de uitkering dat afkomstig is uit de middelen voor de inburgering van nieuwkomers
      en voor de inburgering van oudkomers, gedurende 2005 en 2006;

      p. programmadeel: het andere deel van de uitkering dan het inburgeringsdeel;

      q. inburgeringsplichtige: de inburgeringsplichtige, bedoeld in de [artikelen 1, eerste lid, onderdeel b][ref10],
      en [20 van de Wet inburgering][ref11], aan wie geen lening als bedoeld in [artikel 16 van die wet][ref12]
      is verstrekt, hetzij ten behoeve van wie die lening is terugbetaald, en die niet behoort tot de
      inburgeringsplichtigen, bedoeld in het besluit van de Staatssecretaris van Justitie van 12 juni 2007, nr. 2007/11,
      houdende wijziging van de Vreemdelingencirculaire 2000, aan wie een persoonsvolgend budget is verstrekt;

      r. inburgeraar: de Nederlander of de rechtmatig in Nederland verblijvende vreemdeling, bedoeld in
      [artikel 5, tweede lid, onderdeel a, van de Wet inburgering][ref13], het rechtmatig in Nederland verblijvende
      familielid van voornoemde vreemdeling of de rechtmatig in Nederland verblijvende vreemdeling die onderdaan is van
      een staat wiens onderdanen op grond van bepalingen van verdragen of besluiten van volkenrechtelijke organisaties
      geen inburgeringsplicht als bedoeld van [artikel 7 van de Wet inburgering][ref14] kan worden opgelegd, en die

      1°. ouder is dan 15 jaar;

      2°. minder dan acht jaren tijdens de leerplichtige leeftijd in Nederland heeft verbleven, en;

      3°. niet beschikt over een diploma, certificaat of document als bedoeld in
      [artikel 2.3 van het Besluit inburgering][ref15];

      4°. niet leerplichtig of kwalificatieplichtig is, dan wel een opleiding volgt waarvan de afronding leidt tot
      uitreiking van een diploma, certificaat of document als bedoeld in [artikel 2.3 van het Besluit inburgering][ref16];

      5°. geen overeenkomst heeft afgesloten op grond van de [Regeling inburgering allochtone vrouwen niet-G31][ref17],
      de [Regeling inburgering allochtone vrouwen G31][ref18], dan wel het extensieve deel van de Pilot inburgering
      allochtone vrouwen Taal Totaal;

      s. geestelijke bedienaar: de persoon, bedoeld in [artikel 1, eerste lid, onderdeel g, van de Wet inburgering][ref19];

      t. inburgeringsvoorziening: hetgeen daaronder wordt verstaan in
      [artikel 1.1, onderdeel j, van het Besluit inburgering][ref20];

      u. gecombineerde inburgeringsvoorziening: hetgeen daaronder wordt verstaan in
      [artikel 1.1, onderdeel k, van het Besluit inburgering][ref21];

      v. handhavingsbeschikking: de beschikking, bedoeld in [artikel 26 van de Wet inburgering][ref22], die niet tevens
      is gegeven op grond van [artikel 22, tweede lid, van die wet][ref23];

      w. kennisgeving: de schriftelijke informatieverstrekking op grond van
      [artikel 5.3, derde lid, van het Besluit inburgering][ref24];

      x. [Wet inburgering nieuwkomers][ref25]: [Wet inburgering nieuwkomers][ref26] zoals die luidde op 31 december 2006;

      y. persoonsvolgend budget: budget dat ter beschikking wordt gesteld ten behoeve van de inburgering van een
      persoon als bedoeld in het besluit van de Staatssecretaris van Justitie van 12 juni 2007, nr. 2007/11, houdende
      wijziging van de Vreemdelingencirculaire 2000 (Stcrt. 2007, 111), die inburgeringsplichtig is op grond van de
      [artikelen 3 tot en met 6 van de Wet inburgering][ref27] en die op 1 januari 2008 in een opvangvoorziening als
      bedoeld in [artikel 1, onderdeel d, van de Wet Centraal Orgaan opvang asielzoekers][ref28] verblijft.

      2 In afwijking van het eerste lid, aanhef en onderdeel d, loopt de GSB III periode voor de gemeente Sittard-Geleen
      van 1 januari 2006 tot en met 31 december 2009.


