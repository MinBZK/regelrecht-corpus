  - number: '14'
    text: |-
      Bij regeling van Onze Minister worden regels gegeven met betrekking tot:

      a. het sluiten van een overeenkomst met de oudkomer die start met een inburgeringsprogramma voor oudkomers;

      b. de inburgeringsprogramma’s voor oudkomers en

      c. de van de oudkomer af te nemen toetsen.
    url: https://wetten.overheid.nl/BWBR0018238/2009-01-01#Artikel14
  - number: '15'
    text: |-
      1 Het college van burgemeester en wethouders zendt tot en met 2009 voor 1 april van elk jaar aan Onze Minister
      een verslag over de uitvoering van de [Wet inburgering nieuwkomers][ref1] en over de door het gemeentebestuur
      aangeboden inburgeringsprogramma’s voor oudkomers in 2005 en 2006.

      2 Het verslag bevat de bij regeling van Onze Minister vastgestelde gegevens waartoe in ieder geval behoren:

      a. het aantal beschikkingen omtrent een inburgeringsprogramma, bedoeld in
      [artikel 1, onderdeel e, van het Bekostigingsbesluit inburgering nieuwkomers][ref2], zoals dat artikel luidde op
      31 december 2006;

      b. het aantal door het bevoegd gezag van een instelling uitgereikte verklaringen als bedoeld in
      [artikel 7.4.15., eerste lid, van de Wet educatie en beroepsonderwijs][ref3], zoals dat artikel luidde op
      31 december 2006;

      c. het aantal oudkomers dat een inburgeringsprogramma voor oudkomers is gestart, en met wie het gemeentebestuur een
      overeenkomst heeft gesloten, en

      d. het aantal oudkomers dat een inburgeringsprogramma voor oudkomers heeft afgerond.

      3 Het college van burgemeester en wethouders zendt voor 1 april 2007 en voor 1 april 2008 aan Onze Minister de
      gegevens over het aantal oudkomers dat in 2006 respectievelijk 2007 een inburgeringsprogramma voor oudkomers heeft
      afgerond.

      4 Onze Minister stelt nadere regels vast voor de inrichting van het verslag, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0009544
      [ref2]: https://wetten.overheid.nl/BWBR0009768#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel7.4.15
