  - number: '4'
    text: |-
      1 De uitkering wordt berekend volgens de formule:

      A x I + B x J + C x K + D x L + E x M + F x N + G x O + H x P + Q + R

      in welke formule voorstelt:

      A: het procentuele aandeel van de gemeente in de middelen voor leefbaarheid en veiligheid, die gedurende de GSB III
      periode vanuit hoofdstuk VII van de Rijksbegroting voor de uitkering ter beschikking worden gesteld;

      B: het procentuele aandeel van de gemeente in de middelen voor het terugdringen van voortijdig schoolverlaten, die
      gedurende de GSB III periode vanuit hoofdstuk VIII van de Rijksbegroting voor de uitkering ter beschikking worden
      gesteld;

      C: het procentuele aandeel van de gemeente in de middelen voor de bestrijding van gezondheidsachterstanden, die
      gedurende de GSB III periode vanuit hoofdstuk XVI van de Rijksbegroting voor de uitkering ter beschikking worden
      gesteld;

      D: het procentuele aandeel van de gemeente die behoort tot de centrumgemeenten voor maatschappelijke opvang en
      verslavingsbeleid in de middelen voor maatschappelijke opvang en verslavingsbeleid, die gedurende de GSB III
      periode vanuit hoofdstuk XVI van de Rijksbegroting voor de uitkering ter beschikking worden gesteld;

      E: het procentuele aandeel van de gemeente die behoort tot de centrumgemeenten voor vrouwenopvang in de middelen
      voor vrouwenopvang, die gedurende de GSB III periode vanuit hoofdstuk XVI van de Rijksbegroting voor de uitkering
      ter beschikking worden gesteld;

      F: het procentuele aandeel van de gemeente in de middelen voor de inburgering van nieuwkomers, die in 2005 en in
      2006 vanuit hoofdstuk VI van de Rijksbegroting voor de uitkering ter beschikking worden gesteld;

      G: het procentuele aandeel van de gemeente in de middelen voor de inburgering van oudkomers, die in 2005 en in 2006
      vanuit hoofdstuk VI van de Rijksbegroting voor de uitkering ter beschikking worden gesteld;

      H: het procentuele aandeel van de gemeente in de extra middelen voor veiligheid, die gedurende de GSB III periode
      vanuit hoofdstuk VII van de Rijksbegroting voor de uitkering ter beschikking worden gesteld;

      I: de middelen voor leefbaarheid en veiligheid die gedurende de GSB III periode vanuit hoofdstuk VII van de
      Rijksbegroting voor de uitkering ter beschikking worden gesteld;

      J: de middelen voor het terugdringen van voortijdig schoolverlaten die gedurende de GSB III periode vanuit
      hoofdstuk VIII van de Rijksbegroting voor de uitkering ter beschikking worden gesteld;

      K: de middelen voor de bestrijding van gezondheidsachterstanden die gedurende de GSB III periode vanuit hoofdstuk
      XVI van de Rijksbegroting voor de uitkering ter beschikking worden gesteld;

      L: de middelen voor maatschappelijke opvang en verslavingsbeleid die gedurende de GSB III periode vanuit hoofdstuk
      XVI van de Rijksbegroting voor de uitkering ter beschikking worden gesteld;

      M: de middelen voor vrouwenopvang die gedurende de GSB III periode vanuit hoofdstuk XVI van de Rijksbegroting voor
      de uitkering ter beschikking worden gesteld;

      N: de middelen voor de inburgering van nieuwkomers die in 2005 en in 2006 vanuit hoofdstuk VI van de Rijksbegroting
      voor de uitkering ter beschikking worden gesteld;

      O: de middelen voor de inburgering van oudkomers die in 2005 en in 2006 vanuit hoofdstuk VI van de Rijksbegroting
      voor de uitkering ter beschikking worden gesteld;

      P: de extra middelen voor veiligheid die gedurende de GSB III periode vanuit hoofdstuk VII van de Rijksbegroting
      voor de uitkering ter beschikking worden gesteld;

      Q: het aandeel van de gemeente in de middelen voor inburgering ten behoeve van inburgeringsplichtigen, niet bedoeld
      in [artikel 7.1a van het Besluit inburgering][ref1], en die gedurende 2007, 2008 en 2009 vanuit hoofdstuk XI,
      respectievelijk hoofdstuk XVIII van de Rijksbegroting voor de uitkering ter beschikking worden gesteld;

      R: het aandeel van de gemeente in de middelen voor inburgering ten behoeve van inburgeringsplichtigen als bedoeld
      in [artikel 7.1a van het Besluit inburgering][ref2], aan wie geen persoonsvolgend budget is verstrekt, en die
      gedurende 2008 en 2009 vanuit hoofdstuk XVIII van de Rijksbegroting voor de uitkering ter beschikking worden
      gesteld.

      2 Bij of krachtens regeling van Onze Minister wordt de berekeningswijze vastgesteld volgens welke:

      a. de procentuele aandelen van de gemeenten, bedoeld in het eerste lid, onder de letters A tot en met H, worden
      bepaald;

      b. het aandeel van de gemeenten, bedoeld in het eerste lid, onder letter Q, wordt bepaald, met dien verstande dat
      dit aandeel zal bestaan uit:

      1°. een vast deel, en

      2°. een deel dat wordt berekend op de grondslag van door de gemeente gerealiseerde prestaties, vermenigvuldigd met
      de bijbehorende bijdragevergoedingen, waarvan de hoogte per kalenderjaar kan verschillen;

      c. het aandeel van de gemeenten, bedoeld in het eerste lid, onder letter R, wordt bepaald, met dien verstande dat
      dit aandeel wordt berekend op de grondslag van door de gemeente gerealiseerde prestaties, vermenigvuldigd met de
      bijbehorende bijdragevergoedingen, waarvan de hoogte per kalenderjaar kan verschillen.

      3 In afwijking van het eerste en tweede lid wordt het bedrag van de aan de gemeente Sittard-Geleen te verstrekken
      uitkering bij regeling van Onze Minister afzonderlijk vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel7.1a
      [ref2]: https://wetten.overheid.nl/BWBR0020674#Artikel7.1a
