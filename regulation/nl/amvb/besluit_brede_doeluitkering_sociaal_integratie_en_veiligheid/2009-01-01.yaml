  - number: '2'
    text: |-
      Onze Minister oefent de hem bij of krachtens dit besluit toegekende bevoegdheden uit in overeenstemming met Onze
      Minister of Onze Ministers wie het mede aangaat.
    url: https://wetten.overheid.nl/BWBR0018238/2009-01-01#Artikel2
  - number: '3'
    text: |-
      Onze Minister verstrekt voor de GSB III periode aan een gemeente een brede doeluitkering ten behoeve van:

      a. de uitvoering van het ontwikkelingsprogramma;

      b. de uitvoering van de [artikelen 4][ref1], [5][ref2], [6, eerste lid][ref3], en
      [15 van de Wet inburgering nieuwkomers][ref4] en het aanbieden van inburgeringsprogramma’s voor oudkomers in 2005
      en 2006, en

      c. het in 2009 aanbieden aan de doelgroep, bedoeld in [artikel 1 van de Wet participatiebudget][ref5], van re-
      integratievoorzieningen als bedoeld in [dat artikel][ref6], overeenkomstig [artikel 3 van die wet][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0009544#Artikel4
