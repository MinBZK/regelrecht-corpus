  - number: '17'
    text: |-
      1 Onze Minister kan de regeling, bedoeld in [artikel 4, tweede lid][ref1], ten aanzien van de procentuele aandelen
      van de gemeenten in de middelen voor maatschappelijke opvang en verslavingsbeleid en voor vrouwenopvang éénmaal
      wijzigen.

      2 De wijziging geschiedt niet dan nadat:

      a. een onderzoek van Onze Minister van Volksgezondheid, Welzijn en Sport naar de verdeling van de middelen voor
      maatschappelijke opvang en verslavingsbeleid en voor vrouwenopvang heeft plaatsgevonden, en

      b. het college van burgemeester en wethouders van de centrumgemeenten voor maatschappelijke opvang en
      verslavingsbeleid en het college van burgemeester en wethouders van de centrumgemeenten voor vrouwenopvang zijn
      gehoord over de resultaten van het onder a bedoelde onderzoek.

      3 Onze Minister brengt ambtshalve de verlening van de uitkering in overeenstemming met het gewijzigde procentuele
      aandeel van de gemeente in de middelen voor maatschappelijke opvang en verslavingsbeleid en voor vrouwenopvang.

      4 De wijziging werkt terug tot en met het tijdstip waarop de uitkering is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0018238#Artikel4
    url: https://wetten.overheid.nl/BWBR0018238/2009-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0018238
        artikel: '4'
  - number: '18'
    text: |-
      1 De gemeenteraad kan de in het ontwikkelingsprogramma opgenomen te bereiken resultaten wijzigen.

      2 Het college van burgemeester en wethouders zendt een wijziging binnen vier weken na vaststelling, toe aan Onze
      Minister.

      3 Binnen tien weken na de ontvangst ervan besluit Onze Minister of de wijziging van het ontwikkelingsprogramma
      kan worden bekrachtigd. Indien het gewijzigde ontwikkelingsprogramma wordt bekrachtigd, kan Onze Minister tevens
      besluiten het verleende programmadeel te verlagen.

      4 De verlaging geschiedt naar evenredigheid van de krachtens [artikel 7, tweede lid en derde lid][ref1], en
      [artikel 16, derde lid][ref2], vastgestelde verdeling over de indicatoren.

      5 Onze Minister geeft geen toepassing aan het derde lid dan nadat hij het college van burgemeester en wethouders
      heeft geïnformeerd waarom hij voornemens is daartoe over te gaan en hij het college binnen een door hem te bepalen
      termijn in de gelegenheid heeft gesteld een aangepaste wijziging op het ontwikkelingsprogramma in te zenden.

      6 De verlaging werkt terug tot en met het tijdstip waarop de uitkering is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0018238#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0018238#Artikel16
    url: https://wetten.overheid.nl/BWBR0018238/2009-01-01#Artikel18
    references:
      - id: ref1
