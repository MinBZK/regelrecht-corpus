  - number: '11'
    text: |-
      1 Onze Minister kan een lager programmadeel verlenen dan het met toepassing van [artikel 4][ref1] bepaalde
      programmadeel, indien de in het ontwikkelingsprogramma opgenomen resultaten naar zijn oordeel daartoe aanleiding
      geven.

      2 Onze Minister geeft niet eerder toepassing aan het eerste lid dan nadat hij het college van burgemeester en
      wethouders heeft geïnformeerd waarom hij voornemens is daartoe over te gaan en hij het college binnen een door hem
      te bepalen termijn in de gelegenheid heeft gesteld een gewijzigd ontwikkelingsprogramma in te zenden.


      [ref1]: https://wetten.overheid.nl/BWBR0018238#Artikel4
