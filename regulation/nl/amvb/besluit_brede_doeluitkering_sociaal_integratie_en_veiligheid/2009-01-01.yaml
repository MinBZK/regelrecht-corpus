  - number: '16'
    text: |-
      1 Indien gedurende de GSB III periode andere middelen dan bedoeld in [artikel 4, eerste lid][ref1], voor de
      uitkering beschikbaar komen, verhoogt Onze Minister de verleende uitkering volgens bij regeling van Onze Minister
      te stellen regels.

      2 Bij de regeling, bedoeld in het eerste lid, kan worden bepaald dat het gemeentebestuur binnen een bij of
      krachtens die regeling te bepalen termijn met inachtneming van de bij of krachtens die regeling vast te stellen
      indicatoren een wijziging van het ontwikkelingsprogramma bij Onze Minister indient.

      3 Indien in het kader van een wijziging van het ontwikkelingsprogramma, bedoeld in het tweede lid, indicatoren
      worden vastgesteld, is [artikel 7, tweede en derde lid][ref2], van overeenkomstige toepassing.

      4 De verhoging werkt terug tot en met het tijdstip waarop de uitkering is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0018238#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0018238#Artikel7
