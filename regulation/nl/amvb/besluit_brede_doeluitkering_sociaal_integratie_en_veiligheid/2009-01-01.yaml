  - number: '27'
    text: |-
      1 Onze Minister stelt het programmadeel overeenkomstig de verlening vast, met dien verstande dat:

      a. bij het vaststellen van onderdeel Q, bedoeld in [artikel 4, eerste lid][ref1], de door de gemeente
      behaalde resultaten worden betrokken met inachtneming van de bij regeling van Onze Minister vast te stellen
      berekeningswijze en de voorschotvergoedingen, bedoeld in [artikel 9, vijfde lid][ref2], worden vervangen door de
      bijdragevergoedingen, bedoeld in [artikel 4, tweede lid, onderdeel b, onder 2º][ref3];

      b. bij het vaststellen van onderdeel R, bedoeld in [artikel 4, eerste lid][ref4], de door de gemeente
      behaalde resultaten worden betrokken met inachtneming van de bij regeling van Onze Minister vast te stellen
      berekeningwijze en de voorschotvergoedingen, bedoeld in [artikel 9, zesde lid][ref5], worden vervangen door de
      bijdragevergoedingen, bedoeld in [artikel 4, tweede lid, onderdeel c][ref6].

      2 Onze Minister stelt het programmadeel in afwijking van het eerste lid lager vast, indien:

      a. uit de verantwoordingsinformatie, bedoeld in [artikel 24, tweede lid][ref7], of [artikel 26, tweede lid][ref8],
      blijkt dat de in het ontwikkelingsprogramma opgenomen resultaten niet volledig zijn bereikt;

      b. het gemeentebestuur niet heeft voldaan aan de ingevolge [artikel 12][ref9] aan de verlening van de uitkering
      verbonden verplichtingen;

      c. de gemeente verleende voorschotten voor een ander doel heeft aangewend dan voor de activiteiten, bedoeld in
      [artikel 20, zesde lid][ref10];

      d. de door de gemeente gerealiseerde resultaten en de uitkomst van de berekeningswijze, bedoeld in het eerste lid,
      daartoe aanleiding geven.

      3 Onze Minister geeft geen toepassing aan het tweede lid, onderdeel a, indien de gemeente in de
      verantwoordingsinformatie, bedoeld in [artikel 24, tweede lid][ref11], dan wel [artikel 26, tweede lid][ref12],
      naar zijn oordeel genoegzaam heeft aangetoond dat het niet volledig bereiken van de in het ontwikkelingsprogramma
      opgenomen resultaten haar niet kan worden toegerekend.

      4 De lagere vaststelling van het programmadeel ingevolge het tweede lid, onderdeel a, geschiedt naar evenredigheid
      van de krachtens [artikel 7, tweede lid en derde lid][ref13], en [artikel 16, derde lid][ref14], vastgestelde
      verdeling over de indicatoren.

      5 Behalve ten aanzien van de onderdelen Q en R, bedoeld in [artikel 4, eerste lid][ref15], kan Onze Minister in
      afwijking van het vierde lid de lagere vaststelling van het programmadeel ingevolge het tweede lid, onderdeel a, op
      verzoek van het gemeentebestuur, bepalen aan de hand van de relatieve verdeling van de besteding van de verleende
      voorschotten over de in het ontwikkelingsprogramma opgenomen resultaten ten aanzien van de indicatoren, zoals die
      in de verantwoordingsinformatie, bedoeld in [artikel 26, tweede lid][ref16], en in [artikel 26, derde lid][ref17],
      is opgenomen. Ten behoeve van de lagere vaststelling past hij de hierbedoelde relatieve verdeling toe op het totaal
      van de verleende rijksbijdrage.

      6 Het programmadeel kan in afwijking van het eerste lid, volgens bij regeling van Onze Minister vast te stellen
      regels, hoger worden vastgesteld, indien het gemeentebestuur de in het ontwikkelingsprogramma opgenomen resultaten
      heeft overtroffen en dit naar zijn oordeel aan het gemeentebestuur kan worden toegerekend.

      7 In afwijking van het zesde lid worden de onderdelen Q en R, bedoeld in [artikel 4, eerste lid][ref18], van
      het programmadeel hoger vastgesteld indien de door de gemeente gerealiseerde resultaten en de uitkomst van de
      berekeningswijze, bedoeld in het eerste lid, daartoe aanleiding geven.

      8 De vaststelling geeft aanspraak op betaling van het vastgestelde bedrag van het programmadeel.

      9 Het bedrag van het programmadeel wordt overeenkomstig de vaststelling betaald onder verrekening van betaalde
      voorschotten op het programmadeel.

      10 Het bedrag van het programmadeel wordt binnen vier weken na de vaststelling betaald.

      11 Onze Minister neemt geen beslissing als bedoeld in het derde lid, geen toepassing te geven aan het
      tweede lid, onderdeel a, dan nadat hij het oordeel van een deskundige heeft gevraagd ten aanzien van
      de in de verantwoordingsinformatie opgenomen redengeving voor het niet volledig bereiken van de in het
      ontwikkelingsprogramma opgenomen resultaten. Onze Minister wijst niet eerder een deskundige aan dan nadat hij het
      college van burgemeester en wethouders in de gelegenheid heeft gesteld te worden gehoord.

      12 Het elfde lid vindt geen toepassing indien het college van burgemeester en wethouders een daartoe strekkend
      verzoek aan Onze Minister heeft gedaan.


