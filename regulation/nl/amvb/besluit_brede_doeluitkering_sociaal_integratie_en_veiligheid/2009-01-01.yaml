  - number: '21'
    text: |-
      1 Het college van burgemeester en wethouders dient voor 15 juli 2010 bij Onze Minister een aanvraag in tot
      vaststelling van het inburgeringsdeel.

      2 Bij de beoordeling van de aanvraag wordt gebruik gemaakt van de verantwoordingsinformatie, bedoeld in
      [artikel 58a van het Besluit begroting en verantwoording provincies en gemeenten][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014606#Artikel58a
    url: https://wetten.overheid.nl/BWBR0018238/2009-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0014606
        artikel: 58a
  - number: '22'
    text: |-
      1 Indien Onze Minister op 15 juli 2010 geen aanvraag tot vaststelling van het inburgeringsdeel heeft ontvangen,
      stelt hij dat deel ambtshalve vast.

      2 Onze Minister gaat niet over tot toepassing van het eerste lid dan nadat hij het college van burgemeester en
      wethouders in de gelegenheid heeft gesteld binnen een door hem te bepalen termijn alsnog een aanvraag in te dienen.
    url: https://wetten.overheid.nl/BWBR0018238/2009-01-01#Artikel22
  - number: '23'
    text: |-
      1 Onze Minister stelt het inburgeringsdeel overeenkomstig de verlening vast.

      2 Onze Minister kan het inburgeringsdeel in afwijking van het eerste lid lager vaststellen, indien het
      gemeentebestuur na verlening van de uitkering niet heeft voldaan aan het bij of krachtens de [artikelen 14][ref1]
      en [15][ref2] bepaalde.

      3 De vaststelling geeft aanspraak op betaling van het vastgestelde bedrag van het inburgeringsdeel.

      4 Het bedrag van het inburgeringsdeel wordt overeenkomstig de vaststelling betaald onder verrekening van betaalde
      voorschotten op het inburgeringsdeel.

      5 Het bedrag van het vastgestelde inburgeringsdeel wordt binnen twaalf maanden na de vaststelling betaald.

      6 Onverschuldigd betaalde voorschotten op het inburgeringsdeel kunnen worden teruggevorderd zolang nog geen vijf
      jaren zijn verstreken na de dag waarop het inburgeringsdeel is vastgesteld.

      7 Onverschuldigd betaalde voorschotten op het inburgeringsdeel kunnen tevens worden verrekend met nog door Onze
      Minister aan de gemeente te betalen bedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0018238#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0018238#Artikel15
