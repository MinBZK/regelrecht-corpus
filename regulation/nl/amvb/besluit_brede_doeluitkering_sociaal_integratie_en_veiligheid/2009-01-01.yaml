  - number: '9'
    text: |-
      1 Onze Minister neemt een beschikking tot verlening van de uitkering binnen acht weken na het tijdstip waarop de
      aanvraag door hem is ontvangen.

      2 In een geval als bedoeld in [artikel 5, derde lid][ref1], wordt de datum van inwerkingtreding van dit besluit
      aangemerkt als het tijdstip van de ontvangst van de aanvraag.

      3 Onze Minister neemt een beschikking tot verlening van de onderdelen Q respectievelijk R, bedoeld in
      [artikel 4, eerste lid][ref2], van de uitkering binnen acht weken na het tijdstip waarop de aanvraag door hem is
      ontvangen.

      4 De beschikking tot verlening van de uitkering vermeldt de wijze waarop het bedrag van de uitkering wordt bepaald.

      5 Voor het bepalen van de hoogte van onderdeel Q, bedoeld in [artikel 4, eerste lid][ref3], van de uitkering wordt
      met betrekking tot:

      a. het deel, bedoeld in [artikel 4, tweede lid, onderdeel b, onder 1°][ref4], een vast bedrag vermeld, bestaande
      uit:

      1°. het bedrag, bedoeld in [artikel 7, eerste lid, onderdeel o, onder 4°][ref5];

      2°. een door Onze Minister te bepalen bedrag ten behoeve van de door de gemeente te verstrekken informatie aan
      (potentiële) inburgeringsplichtigen omtrent het inburgeringsstelsel van de [Wet inburgering][ref6];

      b. het deel, bedoeld in [artikel 4, tweede lid, onderdeel b, onder 2°][ref7], voor zover betrekking hebbende
      op prestaties op grond van de [Wet inburgering][ref8], in plaats van van de bijdragevergoedingen, bedoeld in
      [artikel 4, tweede lid, onderdeel b, onder 2°][ref9], uitgegaan van voorschotvergoedingen, waarvan de hoogte wordt
      bepaald volgens bij regeling van Onze Minister te stellen regels.

      6 Voor het bepalen van de hoogte van onderdeel R, bedoeld in [artikel 4, eerste lid][ref10], van de uitkering wordt
      uitgegaan van voorschotvergoedingen, waarvan de hoogte wordt bepaald volgens bij regeling van Onze Minister te
      stellen regels.

      7 De uitkering wordt verleend onder de voorwaarde dat door de begrotingswetgever voldoende middelen ter beschikking
      worden gesteld.


