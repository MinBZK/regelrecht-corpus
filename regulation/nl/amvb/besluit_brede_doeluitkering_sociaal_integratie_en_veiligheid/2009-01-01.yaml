  - number: '5'
    text: |-
      1 Het college van burgemeester en wethouders van een gemeente dient binnen acht weken na inwerkingtreding van dit
      besluit een aanvraag tot verlening van de uitkering in.

      2 De aanvraag gaat vergezeld van het meerjaren ontwikkelingsprogramma waarin de gemeenteraad de in de GSB III
      periode te bereiken resultaten heeft vastgelegd.

      3 Een aanvraag tot verlening van de drie brede doeluitkeringen van het Grotestedenbeleid die door het college van
      burgemeester en wethouders voor de inwerkingtreding van dit besluit is ingediend, wordt mede als een aanvraag tot
      verlening van de uitkering aangemerkt.

      4 Het college van burgemeester en wethouders dient voor 15 april 2007 een aanvraag in tot verlening van het
      aandeel, bedoeld in [artikel 4, eerste lid, onderdeel Q][ref1]. Het tweede lid is van overeenkomstige toepassing.

      5 Het college van burgemeester en wethouders dient voor 15 december van het komende kalenderjaar een aanvraag
      in tot verlening van het aandeel, bedoeld in [artikel 4, eerste lid, onderdeel R][ref2]. Het tweede lid is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018238#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0018238#Artikel4
    url: https://wetten.overheid.nl/BWBR0018238/2009-01-01#Artikel5
