  - number: '29'
    text: |-
      1 Het college van burgemeester en wethouders van een gemeente verstrekt desgevraagd inlichtingen omtrent de
      besteding van de verleende voorschotten en de realisatie van de in het ontwikkelingsplan opgenomen doelstellingen
      aan de door Onze Minister aangewezen ambtenaren.

      2 De ambtenaren, bedoeld in het eerste lid, kunnen ten aanzien van de verantwoordingsinformatie, bedoeld
      in [artikel 24, tweede lid][ref1], en [artikel 26, tweede lid][ref2], tevens informatie inwinnen bij de in
      [artikel 213, tweede lid, van de Gemeentewet][ref3] bedoelde accountants.


