  - number: '24'
    text: |-
      1 Het college van burgemeester en wethouders dient voor 15 juli 2010 bij Onze Minister een aanvraag in tot
      vaststelling van het programmadeel.

      2 Bij de beoordeling van de aanvraag wordt gebruik gemaakt van de verantwoordingsinformatie, bedoeld in
      [artikel 58a van het Besluit begroting en verantwoording provincies en gemeenten][ref1].

      3 Indien de in het ontwikkelingsprogramma opgenomen resultaten niet volledig zijn behaald en het gemeentebestuur
      een verzoek doet als bedoeld in [artikel 27, vijfde lid][ref2], neemt zij in de verantwoordingsinformatie, bedoeld
      in het tweede lid, de verdeling van de besteding van de verleende voorschotten over die resultaten op.

      4 Onze Minister stelt binnen vier maanden na ontvangst van de aanvraag het bedrag van het programmadeel vast.


      [ref1]: https://wetten.overheid.nl/BWBR0014606#Artikel58a
      [ref2]: https://wetten.overheid.nl/BWBR0018238#Artikel27
