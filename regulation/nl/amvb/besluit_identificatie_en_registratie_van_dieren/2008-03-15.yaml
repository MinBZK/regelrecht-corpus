  - number: '2'
    text: |-
      1 Ter uitvoering van titel I van [verordening 1760/2000](32000R1760), [richtlijn 92/102/EEG](31992L0102), artikel
      4, vierde lid, van [richtlijn 90/426/EEG](31990L0426), en artikel 8, eerste lid van [richtlijn 90/427/EEG]
      (31990L0427) wordt medewerking gevorderd van het bestuur van het Productschap Vee en Vlees.

      2 De in het eerste lid bedoelde medewerking bestaat uit het verrichten van de noodzakelijke werkzaamheden en het
      overeenkomstig het krachtens [artikel 3][ref1] bepaalde bij verordening stellen van regels, inzake:

      a. de identificatie en registratie van runderen ter uitvoering van de artikelen 1, 3, 4, 5, 6 en 7 van [verordening
      1760/2000](32000R1760) en van de door de Commissie van de Europese Gemeenschappen op grond van artikel 10 van deze
      verordening vastgestelde uitvoeringsbepalingen, alsmede voor zover van toepassing ter uitvoering van de artikelen
      4, 5, 6, eerste lid, 7 en 8 van [richtlijn 92/102/EEG](31992L0102) en van de door de Commissie van de Europese
      Gemeenschappen op grond van deze richtlijn vastgestelde uitvoeringsbepalingen;

      b. de identificatie en registratie van varkens, schapen en geiten ter uitvoering van de artikelen 4, 5, 6, eerste
      lid, 7 en 8 van [richtlijn 92/102/EEG](31992L0102) en van de door de Commissie van de Europese Gemeenschappen op
      grond van deze richtlijn vastgestelde uitvoeringsbepalingen;

      c. de registratie van bedrijven ter uitvoering van artikel 3, eerste lid, van [richtlijn 92/102/EEG](31992L0102);

      d. de identificatie en registratie van eenhoevige dieren ter uitvoering van artikel 4, vierde lid, van [richtlijn
      90/426/EEG](31990L0426), van artikel 8, eerste lid van [richtlijn 90/427/EEG](31990L0427) en van de door de
      Commissie van de Europese Gemeenschappen op grond van deze richtlijnen vastgestelde uitvoeringsbepalingen, voor
      zover deze betrekking hebben op het vaststellen van een identificatiemethode;

      e. de registratie van houders van eenhoevige dieren met het oog op het toezicht op de naleving van de in onderdeel
      d bedoelde bepalingen.

      3 De in het eerste lid bedoelde medewerking kan mede bestaan uit het verrichten van de noodzakelijke werkzaamheden
      en het bij verordening stellen van regels, inzake het voorzien zijn van eenhoevige dieren van merken of kentekenen.

      4 De in het tweede en derde lid bedoelde regels zijn verbindend voor alle daarbij te onderscheiden categorieën van
      houders van dieren.

      5 De in het tweede en derde lid bedoelde regels kunnen een verbod inhouden om dieren te houden, te verhandelen, te
      vervoeren, aan te voeren of af te voeren, tenzij is voldaan aan titel I van [verordening 1760/2000](32000R1760) en
      aan het bij of krachtens dit besluit bepaalde.

      6 Bij verordening als bedoeld in het tweede en derde lid, kan de bevoegdheid tot het vaststellen van nadere
      voorschriften omtrent bij deze verordening daartoe uitdrukkelijk aangewezen onderwerpen worden overgedragen aan een
      ander orgaan van het Productschap Vee en Vlees. De krachtens de verordening vastgestelde nadere voorschriften en
      genomen besluiten, behoeven de goedkeuring van Onze Minister.

      7 Onze Minister kan met betrekking tot het verlenen van de in het eerste lid bedoelde medewerking beleidsregels
      stellen.


