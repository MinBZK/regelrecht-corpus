preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Landbouw, Natuurbeheer en Visserij van 15 juli 1997, nr J. 977375, Directie
    Juridische Zaken, gedaan in overeenstemming met de Staatssecretaris van Volksgezondheid, Welzijn en Sport;

    Gelet op richtlijn nr. 92/102/EEG van de Raad van Europese Gemeenschappen van 27 november 1992 met betrekking tot
    de identificatie en de registratie van dieren (PbEG L 355), richtlijn nr. 97/12/EG van de Raad van de Europese Unie
    van 17 maart 1997 tot wijziging en bijwerking van richtlijn 64/432/EEG inzake veterinairrechtelijke vraagstukken op
    het gebied het intracommunautaire handelsverkeer in runderen en varkens (PbEG L109) en Verordening (EG) nr. 820/97
    van de Raad van de Europese Unie van 21 april 1997 tot vaststelling van een identificatie- en registratieregeling
    voor runderen en inzake de etikettering van rundvlees en rundvleesproducten (PbEG L 117);

    Gelet op de artikelen 4, 96, 108, en 111 van de Gezondheids- en welzijnswet voor dieren:

    De Raad van State gehoord (advies van 7 oktober 1997, nr. W11.97.0478);

    Gezien het nader rapport van Onze Minister van Landbouw, Natuurbeheer en Visserij van 10 november 1997, nr. J.
    9711727, Directie Juridische Zaken, uitgebracht in overeenstemming met de Staatssecretaris van Volksgezondheid,
    Welzijn en Sport;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0009019/2008-03-15#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. wet: [Gezondheids- en welzijnswet voor dieren][ref1];

      b. [richtlijn 92/102/EEG](31992L0102): [richtlijn nr. 92/102/EEG](31992L0102) van de Raad van Europese
      Gemeenschappen van 27 november 1992 met betrekking tot de identificatie en de registratie van dieren (PbEG L 355);

      c. [verordening 1760/2000](32000R1760): [verordening (EG) nr.1760/2000](32000R1760) van het Europees Parlement
      en de Raad van de Europese Unie van 17 juli 2000 (PbEG L 204) tot vaststelling van een identificatie- en
      registratieregeling voor runderen en inzake de etikettering van rundvlees en rundvleesproducten en tot intrekking
      van [Verordening (EG) nr. 820/97](31997R0820) van de Raad van de Europese Unie;

      d. [richtlijn 90/426/EEG](31990L0426): [richtlijn nr. 90/426/EEG](31990L0426) van de Raad van Europese
      Gemeenschappen van 26 juni 1990 tot vaststelling van veterinairrechtelijke voorschriften voor het verkeer van
      paardachtigen en de invoer van paardachtigen uit derde landen (PbEG L 224);

      e. [richtlijn 90/427/EEG](31990L0427): [richtlijn nr. 90/427/EEG](31990L0427) van de Raad van Europese
      Gemeenschappen van 26 juni 1990 tot vaststelling van zoötechnische en genealogische voorschriften voor het
      intracommunautaire handelsverkeer in paardachtigen (PbEG L 224);

      f. eenhoevige dieren: paardachtigen als bedoeld in artikel 2, onderdeel b, van [richtlijn 90/426/EEG](31990L0426);

      g. dieren: eenhoevige dieren en dieren van de in artikel 1 van [richtlijn nr. 64/432/EEG](31964L0432) van de Raad
      van Europese Gemeenschappen van 26 juni 1964, inzake veterinairrechtelijke vraagstukken op het gebied van het
      intracommunautair handelsverkeer in runderen en varkens (PbEG L 121) en in artikel 1 van [richtlijn nr. 91/68/
      EEG](31991L0068) van de Raad van Europese Gemeenschappen van 28 januari 1991, inzake veterinairrechtelijke
      voorschriften op het gebied van het intracommunautaire handelsverkeer in schapen en geiten (PbEG L 46) bedoelde
      soorten.

      2 In zoverre in afwijking van [artikel 1, eerste lid, van de wet][ref2] wordt voor de toepassing dit besluit en de
      daarop berustende bepalingen onder houder verstaan:

      a. houder als bedoeld in artikel 2, derde gedachtenstreepje, van [verordening 1760/2000](32000R1760), voor zover
      dit begrip betrekking heeft op diersoorten waarop deze verordeningen van toepassing zijn;

      b. houder als bedoeld in artikel 2, onderdeel c van [richtlijn 92/102/EEG](31992L0102), voorzover dit begrip
      betrekking heeft op andere diersoorten dan eenhoevige dieren en de in onderdeel a bedoelde diersoorten.

      3 Dit besluit berust mede op de [artikelen 34][ref3] en [37 van de Meststoffenwet][ref4] en op
      [artikel 12.29, aanhef en onder e, van de Wet milieubeheer][ref5].


