  - number: '3'
    text: |-
      1 Onze Minister kan ter uitvoering van titel I van [verordening 1760/2000](32000R1760), [richtlijn 92/102/
      EEG](31992L0102), artikel 4, vierde lid, van [richtlijn 90/426/EEG](31990L0426), en artikel 8, eerste lid van
      [richtlijn 90/427/EEG](31990L0427), alsmede met het oog op het toezicht op de naleving hiervan, regels stellen.

      2 Onverminderd het eerste lid kan Onze Minister ter uitvoering van krachtens het Verdrag tot oprichting van de
      Europese Gemeenschap vastgestelde verplichtingen inzake de algemene gezondheidstoestand of van het welzijn van
      dieren, ter voorkoming van de verspreiding van smetstof of van de aanwezigheid van schadelijke stoffen in dieren
      en producten van dierlijke oorsprong dan wel ter bescherming van de veiligheid van mens of dier, regels stellen
      omtrent de identificatie en registratie van dieren alsmede van levende dierlijke producten.

      3 De in het eerste en tweede lid bedoelde regels kunnen voor de hierin te onderscheiden categorieën van houders
      van dieren of levende dierlijke producten en voor dieren behorend tot of levende dierlijke producten afkomstig
      van de hierin te onderscheiden diersoorten verschillend vastgesteld worden en kunnen een verbod inhouden om dieren
      of levende dierlijke producten te houden, te verhandelen, te vervoeren, aan te voeren of af te voeren, tenzij is
      voldaan aan titel I van [verordening 1760/2000](32000R1760) en aan het bij of krachtens dit besluit bepaalde.
    url: https://wetten.overheid.nl/BWBR0009019/2008-03-15#Artikel3
  - number: '4'
    text: |-
      Een wijziging van een of meer onderdelen van [richtlijn 92/102/EEG](31992L0102), [richtlijn 90/426/EEG](31990L0426)
      en [richtlijn 90/427/EEG](31990L0427) gaat voor de toepassing van de artikelen van dit besluit, waarin naar die
      onderdelen wordt verwezen, gelden met ingang van de dag waarop aan de betrokken wijzigingsrichtlijn uitvoering moet
      zijn gegeven, tenzij bij ministerieel besluit, dat in de Staatscourant wordt bekend gemaakt, een ander tijdstip
      wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0009019/2008-03-15#Artikel4
  - number: '5'
    text: |-
      Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip. Laatstbedoeld besluit wordt niet
      genomen voordat 30 dagen zijn verstreken nadat het onderhavige besluit is overgelegd aan beide Kamers der Staten-
      Generaal, en evenmin indien binnen die termijn door of namens een der Kamers of door tenminste een vijfde van het
      grondwettelijk aantal leden van een der Kamers de wens te kennen wordt gegeven dat de inwerkingtreding van dit
      besluit bij wet wordt geregeld.
    url: https://wetten.overheid.nl/BWBR0009019/2008-03-15#Artikel5
  - number: '6'
    text: 'Dit besluit wordt aangehaald als: Besluit identificatie en registratie van dieren.'
    url: https://wetten.overheid.nl/BWBR0009019/2008-03-15#Artikel6
