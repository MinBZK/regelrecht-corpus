preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Landbouw, Natuurbeheer en Visserij van 15 juli 1997, nr J. 977375, Directie
    Juridische Zaken, gedaan in overeenstemming met de Staatssecretaris van Volksgezondheid, Welzijn en Sport;

    Gelet op richtlijn nr. 92/102/EEG van de Raad van Europese Gemeenschappen van 27 november 1992 met betrekking tot
    de identificatie en de registratie van dieren (PbEG L 355), richtlijn nr. 97/12/EG van de Raad van de Europese Unie
    van 17 maart 1997 tot wijziging en bijwerking van richtlijn 64/432/EEG inzake veterinairrechtelijke vraagstukken op
    het gebied het intracommunautaire handelsverkeer in runderen en varkens (PbEG L109) en Verordening (EG) nr. 820/97
    van de Raad van de Europese Unie van 21 april 1997 tot vaststelling van een identificatie- en registratieregeling
    voor runderen en inzake de etikettering van rundvlees en rundvleesproducten (PbEG L 117);

    Gelet op de artikelen 4, 96, 108, en 111 van de Gezondheids- en welzijnswet voor dieren:

    De Raad van State gehoord (advies van 7 oktober 1997, nr. W11.97.0478);

    Gezien het nader rapport van Onze Minister van Landbouw, Natuurbeheer en Visserij van 10 november 1997, nr. J.
    9711727, Directie Juridische Zaken, uitgebracht in overeenstemming met de Staatssecretaris van Volksgezondheid,
    Welzijn en Sport;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel1
  - number: 1.1.a
    text: |-
      wet: [Gezondheids- en welzijnswet voor dieren][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005662
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005662
  - number: 1.1.b
    text: |-
      richtlijn 2008/71/EG: richtlijn 2008/71/EG van de Raad van 15 juli 2008 met betrekking tot de identificatie en de
      registratie van varkens (PbEU 2008, L 213);
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel1
  - number: 1.1.c
    text: |-
      [verordening 1760/2000](32000R1760): [verordening (EG) nr.1760/2000](32000R1760) van het Europees Parlement
      en de Raad van de Europese Unie van 17 juli 2000 (PbEG L 204) tot vaststelling van een identificatie- en
      registratieregeling voor runderen en inzake de etikettering van rundvlees en rundvleesproducten en tot intrekking
      van [Verordening (EG) nr. 820/97](31997R0820) van de Raad van de Europese Unie;
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel1
  - number: 1.1.d
    text: |-
      richtlijn 2009/156/EG: richtlijn 2009/156/EG van de Raad van 30 november 2009 tot vaststelling van
      veterinairrechtelĳke voorschriften voor het verkeer van paardachtigen en de invoer van paardachtigen uit derde
      landen (PbEU 2010, L 192);
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel1
  - number: 1.1.e
    text: |-
      [richtlijn 90/427/EEG](31990L0427): [richtlijn nr. 90/427/EEG](31990L0427) van de Raad van Europese Gemeenschappen
      van 26 juni 1990 tot vaststelling van zoötechnische en genealogische voorschriften voor het intracommunautaire
      handelsverkeer in paardachtigen (PbEG L 224);
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel1
  - number: 1.1.f
    text: 'eenhoevige dieren: paardachtigen als bedoeld in artikel 2, onderdeel b, van [richtlijn 90/426/EEG](31990L0426);'
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel1
  - number: 1.1.g
    text: |-
      verordening 21/2004: verordening (EG) nr. 21/2004 van de Raad van 17 december 2003 tot vaststelling van een
      identificatie- en registratieregeling voor schapen en geiten en tot wijziging van Verordening (EG) nr. 1782/2003 en
      de Richtlijnen 92/102/EEG en 64/432/EEG (PbEU 2004, L 5).
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel1
  - number: '1.2'
    text: 'Dit hoofdstuk is van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel1
  - number: 1.2.a
    text: eenhoevige dieren;
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel1
  - number: 1.2.b
    text: |-
      dieren van de in artikel 1 van richtlijn 64/432/EEG van de Raad van 26 juni 1964, inzake veterinairrechtelijke
      vraagstukken op het gebied van het intracommunautaire handelsverkeer in runderen en varkens (PbEG 1964, L 121)
      bedoelde soorten;
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel1
  - number: 1.2.c
    text: |-
      dieren van de in artikel 1 van richtlijn 91/68/EEG van de Raad van 28 januari 1991 inzake veterinairrechtelĳke
      voorschriften voor het intracommunautaire handelsverkeer in schapen en geiten (PbEG 1991, L 46) bedoelde soorten;
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel1
  - number: 1.2.d
    text: kippen, kalkoenen, parelhoenders, eenden, ganzen, kwartels, duiven, fazanten, patrijzen en loopvogels.
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel1
  - number: '1.3'
    text: |-
      Dit besluit berust mede op de [artikelen 34][ref1] en [37 van de Meststoffenwet][ref2] en op
      [artikel 12.29, aanhef en onder e en f, van de Wet milieubeheer][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel37
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel12
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '34'
      - id: ref2
        bwb_id: BWBR0004054
        artikel: '37'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '12'
  - number: '3.1'
    text: |-
      Onze Minister kan ter uitvoering van titel I van [verordening 1760/2000](32000R1760), verordening 21/2004,
      richtlijn 2008/71/EG, artikel 4, vierde lid, van richtlijn 2009/156/EG, en artikel 8, eerste lid van [richtlijn
      90/427/EEG](31990L0427), alsmede met het oog op het toezicht op de naleving hiervan, regels stellen.
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel3
  - number: '3.2'
    text: |-
      Onverminderd het eerste lid kan Onze Minister ter uitvoering van krachtens het Verdrag tot oprichting van de
      Europese Gemeenschap vastgestelde verplichtingen inzake de algemene gezondheidstoestand of van het welzijn van
      dieren, ter voorkoming van de verspreiding van smetstof of van de aanwezigheid van schadelijke stoffen in dieren
      en producten van dierlijke oorsprong dan wel ter bescherming van de veiligheid van mens of dier, regels stellen
      omtrent de identificatie en registratie van dieren alsmede van levende dierlijke producten.
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel3
  - number: '3.3'
    text: |-
      Onze Minister stelt ten behoeve van de algehele gezondheidstoestand of van het welzijn van dieren als bedoeld in
      [artikel 1, tweede lid, onderdeel d][ref1], ter voorkoming van de verspreiding van smetstof of van de aanwezigheid
      van schadelijke stoffen in dieren als bedoeld in artikel 1, tweede lid, onderdeel d, en producten daarvan, en ter
      bescherming van de veiligheid van mens of dier, regels over:


      [ref1]: https://wetten.overheid.nl/BWBR0009019#Artikel1
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0009019
        artikel: '1'
        hoofdstuk: '1'
  - number: 3.3.a
    text: |-
      de registratie van degene die de dieren, bedoeld in [artikel 1, tweede lid, onderdeel d][ref1], alsmede levende
      producten daarvan onder zich heeft, waaronder in ieder geval over het moment van registratie en de wijze waarop
      registratie plaatsvindt;


      [ref1]: https://wetten.overheid.nl/BWBR0009019#Artikel1
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0009019
        artikel: '1'
        hoofdstuk: '1'
  - number: 3.3.b
    text: |-
      de identificatie van de dieren, bedoeld in [artikel 1, tweede lid, onderdeel d][ref1], alsmede levende producten
      daarvan, waaronder in ieder geval over de wijze waarop identificatie plaatsvindt;


      [ref1]: https://wetten.overheid.nl/BWBR0009019#Artikel1
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0009019
        artikel: '1'
        hoofdstuk: '1'
  - number: 3.3.c
    text: |-
      de registratie van de dieren, bedoeld in [artikel 1, tweede lid, onderdeel d][ref1], alsmede levende producten
      daarvan, waaronder in ieder geval over de aanwezigheid van op een locatie aanwezige dieren en producten daarvan,
      de toevoeging en afvoer van dieren en producten daarvan, het moment van registratie en de wijze waarop registratie
      plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0009019#Artikel1
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0009019
        artikel: '1'
        hoofdstuk: '1'
  - number: '3.4'
    text: |-
      De in het eerste tot en met derde lid bedoelde regels kunnen voor de hierin te onderscheiden categorieën van
      houders van dieren of levende dierlijke producten en voor dieren behorend tot of levende dierlijke producten
      afkomstig van de hierin te onderscheiden diersoorten verschillend vastgesteld worden en kunnen een verbod inhouden
      om dieren of levende dierlijke producten te houden, te verhandelen, te vervoeren, aan te voeren of af te voeren,
      tenzij is voldaan aan titel I van [verordening 1760/2000](32000R1760), verordening 21/2004 en aan het bij of
      krachtens dit besluit bepaalde.
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel3
  - number: '4'
    text: |-
      Een wijziging van een of meer onderdelen van richtlijn 2008/71/EG, richtlijn 2009/156/EG en [richtlijn 90/427/EEG]
      (31990L0427) gaat voor de toepassing van de artikelen van dit besluit, waarin naar die onderdelen wordt verwezen,
      gelden met ingang van de dag waarop aan de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven, tenzij bij
      ministerieel besluit, dat in de Staatscourant wordt bekend gemaakt, een ander tijdstip wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel4
  - number: '5'
    text: |-
      In dit hoofdstuk en de op de artikelen van dit hoofdstuk berustende bepalingen wordt verstaan onder: - *chip:*
      transponder, subcutaan of intramusculair aangebracht;
        - *databank:* geautomatiseerde gegevensbank als bedoeld in [artikel 10, eerste lid][ref1], waarin de gegevens
      worden verwerkt, bedoeld in artikel 10, derde lid;
        - *persoonsgegevens, verwerking van persoonsgegevens, verantwoordelijke, betrokkene onderscheidenlijk bewerker:*
      hetgeen daaronder wordt verstaan in [artikel 1 van de Wet bescherming persoonsgegevens][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009019#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0011468#Artikel1
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0009019
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0011468
        artikel: '1'
  - number: '6.1'
    text: |-
      Degene die een hond houdt, verhandelt, vervoert, aanvoert, afvoert of overdraagt, is verplicht de hond te
      identificeren en registreren overeenkomstig dit hoofdstuk en de op dit hoofdstuk berustende bepalingen.
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel6
  - number: '6.2'
    text: |-
      Een hond wordt slechts verhandeld, geschonken of anderszins overgedragen aan een opvolgende houder, nadat de hond
      is geïdentificeerd en geregistreerd overeenkomstig dit hoofdstuk en de op dit hoofdstuk berustende bepalingen.
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel6
  - number: '6.3'
    text: 'De verplichting, bedoeld in het eerste lid, is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel6
  - number: 6.3.a
    text: |-
      de houder van een hond in een inrichting als bedoeld in [artikel 3.7 van het Besluit houders van dieren][ref1],
      waarin gezelschapsdieren worden gehouden ten behoeve van opvang, mits de hond twee weken na de binnenkomst in deze
      inrichting wordt geïdentificeerd en na vier weken is geregistreerd;


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel3
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '3'
  - number: 6.3.b
    text: |-
      de houder die afkomstig is uit een Europese lidstaat of een derde land, en voornemens is met zijn hond in Nederland
      te verblijven voor een periode korter dan drie maanden;
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel6
  - number: 6.3.c
    text: |-
      de houder van een hond als bedoeld in [artikel 13 van het Dierproevenbesluit][ref1], mits de hond overeenkomstig
      dat artikel is of wordt voorzien van een permanent individueel merkteken en totdat de hond is vrijgegeven voor
      adoptie als bedoeld in [artikel 13d van de Wet op de dierproeven][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003802#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0003081#Artikel13d
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0003802
        artikel: '13'
      - id: ref2
        bwb_id: BWBR0003081
        artikel: 13d
  - number: 6a
    text: |-
      Indien een hond op grond van [artikel 13d van de Wet op de dierproeven][ref1] voor adoptie is vrijgegeven:


      [ref1]: https://wetten.overheid.nl/BWBR0003081#Artikel13d
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0003081
        artikel: 13d
  - number: 6a.a
    text: |-
      wordt de hond geïdentificeerd met een chip overeenkomstig [artikel 14][ref1], indien de hond nog niet gechipt is,
      en


      [ref1]: https://wetten.overheid.nl/BWBR0009019#Artikel14
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0009019
        artikel: '14'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 6a.b
    text: |-
      registreert de houder binnen veertien dagen de hond in een databank overeenkomstig
      [artikel 7, derde of vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009019#Artikel7
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0009019
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '7.1'
    text: Een houder laat zijn hond identificeren binnen zeven weken na de geboorte.
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel7
  - number: '7.2'
    text: Een houder registreert zijn hond binnen acht weken na de geboorte in een databank.
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel7
  - number: '7.3'
    text: |-
      Indien de houder een natuurlijk persoon is, geeft de houder bij de registratie, bedoeld in het tweede lid, in ieder
      geval de volgende gegevens door:
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel7
  - number: 7.3.a
    text: naam, adres en woonplaats;
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel7
  - number: 7.3.b
    text: het nummer van de chip;
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel7
  - number: 7.3.c
    text: de geboortedatum van de hond;
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel7
  - number: 7.3.d
    text: de datum van identificatie;
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel7
  - number: 7.3.e
    text: de naam, adres en woonplaats van de persoon die de chip inbrengt;
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel7
  - number: 7.3.f
    text: |-
      indien de houder daarover beschikt, het registratienummer dat op grond van
      [artikel 3.8, eerste lid, van het Besluit houders van dieren][ref1] is toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel3
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '3'
  - number: '7.4'
    text: |-
      Indien de houder een onderneming heeft als bedoeld in [artikel 5 van de Handelsregisterwet 2007][ref1], geeft de
      houder bij de registratie, bedoeld in het tweede lid, in ieder geval de volgende gegevens door:


      [ref1]: https://wetten.overheid.nl/BWBR0021777#Artikel5
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0021777
        artikel: '5'
  - number: 7.4.a
    text: vestigingsadres van de onderneming waarop de hond wordt gehouden;
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel7
  - number: 7.4.b
    text: naam van de onderneming en de beheerder van de onderneming;
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel7
  - number: 7.4.c
    text: het nummer van de inschrijving in het handelsregister;
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel7
  - number: 7.4.d
    text: |-
      het registratienummer dat op basis van [artikel 3.8, eerste lid, van het Besluit houders van dieren][ref1] is
      toegekend, en


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel3
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '3'
  - number: 7.4.e
    text: de gegevens, bedoeld in het derde lid, onderdelen b tot en met e.
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel7
  - number: '7.5'
    text: 'De houder meldt in een databank:'
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel7
  - number: 7.5.a
    text: een wijziging van de gegevens, bedoeld in het derde lid, onderdeel a, of vierde lid, onderdelen a tot en met c;
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel7
  - number: 7.5.b
    text: het overlijden of de blijvende vermissing van de hond.
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel7
  - number: '7.6'
    text: 'Bij ministeriële regeling worden nadere regels gesteld over:'
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel7
  - number: 7.6.a
    text: de wijze van registratie van de gegevens, bedoeld in het derde en vierde lid;
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel7
  - number: 7.6.b
    text: de bewaartermijn van de gegevens, bedoeld in het derde en vierde lid, en
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel7
  - number: 7.6.c
    text: de termijn waarbinnen de houder de melding, bedoeld in het vijfde lid, doet.
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel7
  - number: '8.1'
    text: Indien een hond wordt overgedragen, meldt de houder zich af in een databank.
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel8
  - number: '8.2'
    text: 'De opvolgende houder registreert de volgende gegevens in een databank:'
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel8
  - number: 8.2.a
    text: naam, adres en woonplaats;
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel8
  - number: 8.2.b
    text: het nummer van de chip, en
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel8
  - number: 8.2.c
    text: de datum van overdracht.
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel8
  - number: '8.3'
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld over de wijze en termijn van registratie bedoeld in het
      eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel8
  - number: '9.1'
    text: |-
      Indien een natuurlijk persoon die woonachtig is in Nederland of een onderneming als bedoeld in
      [artikel 5 van de Handelsregisterwet 2007][ref1], een hond in Nederland brengt, registreert hij de hond in een
      databank.


      [ref1]: https://wetten.overheid.nl/BWBR0021777#Artikel5
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0021777
        artikel: '5'
  - number: '9.2'
    text: |-
      Indien de houder een natuurlijk persoon is, geeft de houder bij de registratie, bedoeld in het eerste en tweede
      lid, in ieder geval de volgende gegevens door:
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel9
  - number: 9.2.a
    text: naam, adres en woonplaats;
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel9
  - number: 9.2.b
    text: het nummer van de chip;
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel9
  - number: 9.2.c
    text: de geboortedatum van de hond;
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel9
  - number: 9.2.d
    text: de datum van identificatie;
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel9
  - number: 9.2.e
    text: datum van het in Nederland brengen van de hond, en
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel9
  - number: 9.2.f
    text: land van herkomst van de hond;
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel9
  - number: 9.2.g
    text: |-
      indien de houder daarover beschikt, het registratienummer dat op grond van
      [artikel 3.8, eerste lid, van het Besluit houders van dieren][ref1] is toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel3
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '3'
  - number: '9.3'
    text: |-
      Indien de houder een onderneming heeft als bedoeld in [artikel 5 van de Handelsregisterwet 2007][ref1], geeft de
      houder bij de registratie, bedoeld in het tweede lid, de volgende gegevens door:


      [ref1]: https://wetten.overheid.nl/BWBR0021777#Artikel5
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0021777
        artikel: '5'
  - number: 9.3.a
    text: vestigingsadres van de onderneming waarop de hond wordt gehouden;
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel9
  - number: 9.3.b
    text: naam van de onderneming en de beheerder van de onderneming;
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel9
  - number: 9.3.c
    text: het nummer van de inschrijving in het handelsregister;
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel9
  - number: 9.3.d
    text: |-
      het registratienummer dat op basis van [artikel 3.8, eerste lid, van het Besluit houders van dieren][ref1] is
      toegekend, en


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel3
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '3'
  - number: 9.3.e
    text: de gegevens, bedoeld in het tweede lid, onderdelen b tot en met f.
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel9
  - number: '9.4'
    text: 'Bij ministeriële regeling worden regels gesteld over:'
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel9
  - number: 9.4.a
    text: de termijn waarbinnen de registratie bedoeld in het tweede of derde lid plaatsvindt, en
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel9
  - number: 9.4.b
    text: de wijze van registratie, bedoeld in het eerste tot en met derde lid.
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel9
  - number: '10.1'
    text: De registratie vindt plaats in een door Onze Minister aangewezen databank.
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel10
  - number: '10.2'
    text: Ingeval Onze Minister verschillende databanken aanwijst, volstaat registratie bij een van de databanken.
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel10
  - number: '10.3'
    text: |-
      Een beheerder van een databank verwerkt de gegevens, bedoeld in [artikel 7, derde tot en met vijfde lid][ref1],
      [8, eerste en tweede lid][ref2], en [9, tweede en derde lid][ref3], en stelt deze gegevens beschikbaar aan Onze
      Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0009019#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0009019#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0009019#Artikel9
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0009019
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009019
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0009019
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '10.4'
    text: 'Onze Minister wijst een databank aan indien:'
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel10
  - number: 10.4.a
    text: |-
      de beheerder van de databank een onderneming heeft als bedoeld in [artikel 5 van de Handelsregisterwet 2007][ref1]
      of een rechtspersoon is in de zin van artikel 54 van het Verdrag betreffende de Werking van de Europese Unie, die
      in een lidstaat van de Europese Unie of van de Europese Economische Ruimte is gevestigd;


      [ref1]: https://wetten.overheid.nl/BWBR0021777#Artikel5
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0021777
        artikel: '5'
  - number: 10.4.b
    text: de databank schriftelijk of elektronisch voldoende bereikbaar is voor houders;
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel10
  - number: 10.4.c
    text: de beheerder van de databank de geregistreerde gegevens elektronisch en tijdig kan aanleveren aan Onze Minister;
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel10
  - number: 10.4.d
    text: |-
      de beheerder van de databank aantoont passende technische en organisatorische maatregelen te nemen om de
      geregistreerde gegevens afdoende te beveiligen teneinde verlies, onrechtmatige of onnodige verwerking hiervan te
      voorkomen;
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel10
  - number: 10.4.e
    text: 'de beheerder van de databank de geregistreerde gegevens:'
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel10
  - number: 10.4.e.1°
    text: overeenkomstig dit besluit verwerkt;
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel10
  - number: 10.4.e.2°
    text: |-
      slechts voor andere doelen dan bedoeld in [artikel 12, derde lid][ref1], gebruikt, nadat toestemming is verkregen
      van de betrokkene;


      [ref1]: https://wetten.overheid.nl/BWBR0009019#Artikel12
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0009019
        artikel: '12'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 10.4.f
    text: |-
      de beheerder van de databank informatie verstrekt aan de houder van een hond en ook overigens maatregelen treft
      om hem zijn rechten te kunnen laten uitoefenen en de plichten na te leven als bedoeld in [hoofdstuk 5][ref1] en
      [6 van de Wet bescherming persoonsgegevens][ref2], en


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0011468#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0011468
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0011468
        hoofdstuk: '6'
  - number: 10.4.g
    text: |-
      de beheerder zorg draagt voor de kwaliteit van de gegevens en deze slechts bewaart gedurende een bij ministeriële
      regeling bepaalde termijn.
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel10
  - number: '10.5'
    text: |-
      Met toepassing van [artikel 28, eerste lid, laatste zinsnede, van de Dienstenwet][ref1] is
      [paragraaf 4.1.3.3 van de Algemene wet bestuursrecht][ref2] niet van toepassing op de aanwijzing door Onze
      Minister, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: '10.6'
    text: 'Bij ministeriële regeling worden nadere regels gesteld over:'
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel10
  - number: 10.6.a
    text: de voorwaarden, bedoeld in het vierde lid, onderdelen b, c, d, en f;
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel10
  - number: 10.6.b
    text: de wijze waarop de databank aantoont dat voldaan wordt aan de voorwaarden, bedoeld in het vierde lid;
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel10
  - number: 10.6.c
    text: de termijn waarop de databank de geregistreerde gegevens bewaart;
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel10
  - number: 10.6.d
    text: de wijze van indienen van een aanvraag tot aanwijzing;
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel10
  - number: 10.6.e
    text: de procedure voor aanwijzing van een databank.
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel10
  - number: '11.1'
    text: |-
      Onze Minister kan de aanwijzing van een databank intrekken, indien deze niet voldoet aan de voorwaarden, bedoeld in
      [artikel 10, vierde en zesde lid][ref1], of de verplichtingen uit [artikel 13][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009019#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0009019#Artikel13
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0009019
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0009019
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '11.2'
    text: |-
      Indien Onze Minister de aanwijzing van een databank intrekt of indien de beheerder van een databank de aanwijzing
      beëindigt:
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel11
  - number: 11.2.a
    text: |-
      verstrekt de beheerder van de databank de geregistreerde gegevens aan Onze Minister of geeft Onze Minister de
      opdracht aan de beheerder van een databank de gegevens te vernietigen, en
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel11
  - number: 11.2.b
    text: |-
      verleent de beheerder van de databank alle medewerking ter zake van de overdracht van de werkzaamheden inzake de
      verwerking van de gegevens aan Onze Minister of de beheerder van een andere databank.
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel11
  - number: '11.3'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld over de overdracht of vernietiging van gegevens,
      bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel11
  - number: '12.1'
    text: Onze Minister is verantwoordelijke voor de verwerking van persoonsgegevens in de databank.
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel12
  - number: '12.2'
    text: Een beheerder van een databank is bewerker van de persoonsgegevens.
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel12
  - number: '12.3'
    text: |-
      De gegevens worden verwerkt met als doel het welzijn van honden te verbeteren door het bevorderen van een
      effectieve handhaving van de toepasselijke regelgeving over het welzijn van honden.
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel12
  - number: '13.1'
    text: |-
      Onze Minister en de beheerder van een databank verstrekken elkaar over en weer alle benodigde informatie teneinde
      een goede naleving van de [Wet bescherming persoonsgegevens][ref1] en andere privacywetgeving mogelijk te maken. Op
      verzoek van Onze Minister toont de beheerder aan dat de noodzakelijke maatregelen zijn genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0011468
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0011468
  - number: '13.2'
    text: |-
      De beheerder van de databank stelt Onze Minister te allen tijde kosteloos in de gelegenheid alle
      benodigde controles, gericht op de uitvoering van dit besluit en de naleving van privacywetgeving zoals de
      [Wet bescherming persoonsgegevens][ref1], uit te voeren of uit te doen voeren.


      [ref1]: https://wetten.overheid.nl/BWBR0011468
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0011468
  - number: '13.3'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld over het tweede lid.
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel13
  - number: '14.1'
    text: Een hond wordt geïdentificeerd door middel van het inbrengen van een chip met een uniek nummer.
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel14
  - number: '14.2'
    text: Voor de identificatie wordt een chip gebruikt die voldoet aan bij ministeriële regeling gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel14
  - number: '14.3'
    text: Het is verboden een chip te hergebruiken.
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel14
  - number: '14.4'
    text: |-
      Het is verboden een chip te verwijderen, tenzij de verwijdering noodzakelijk is vanwege een diergeneeskundige
      oorzaak, die door een dierenarts in de databank wordt geregistreerd.
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel14
  - number: '14.5'
    text: 'Bij ministeriële regeling kunnen:'
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel14
  - number: 14.5.a
    text: nadere regels worden gesteld over het vierde lid;
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel14
  - number: 14.5.b
    text: regels worden gesteld over de plichten van de houder met betrekking tot de afleesbaarheid van de chip.
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel14
  - number: '15.1'
    text: |-
      Degene die gerechtigd is op grond van [artikel 4.1 van de Wet dieren][ref1] of
      [artikel 2.8, onderdeel a, van het Besluit diergeneeskundigen][ref2], een chip in te brengen, houdt een
      administratie bij van:


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0035091#Artikel2
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0035091
        artikel: '2'
  - number: 15.1.a
    text: de datum van inbrengen van de chip, en
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel15
  - number: 15.1.b
    text: het nummer van de chip.
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel15
  - number: '15.2'
    text: 'Bij ministeriële regeling worden nadere regels gesteld over:'
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel15
  - number: 15.2.a
    text: de plaats van inbrengen van de chip, en
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel15
  - number: 15.2.b
    text: de gegevens die worden bijgehouden in de administratie, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel15
  - number: '16.1'
    text: |-
      Degene die chips vervaardigt of laat vervaardigen, maakt gebruik van unieke nummers die zijn verstrekt door Onze
      Minister.
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel16
  - number: '16.2'
    text: |-
      Indien degene, bedoeld in het eerste lid, de chips levert aan een andere persoon of onderneming, houdt diegene een
      administratie bij van:
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel16
  - number: 16.2.a
    text: de gegevens van de persoon aan wie of de onderneming waaraan de chips worden geleverd, en
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel16
  - number: 16.2.b
    text: de nummers van de chips.
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel16
  - number: '16.3'
    text: |-
      Indien de persoon of de onderneming, bedoeld in het tweede lid, onderdeel a, chips levert aan een andere persoon
      of onderneming, houdt die persoon of die onderneming, bedoeld in het tweede lid, onderdeel a, een administratie bij
      met de gegevens bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel16
  - number: '16.4'
    text: 'Bij ministeriële regeling worden nadere regels gesteld over:'
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel16
  - number: 16.4.a
    text: de verstrekking, bedoeld in het eerste lid, en
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel16
  - number: 16.4.b
    text: de gegevens die worden bijgehouden in de administratie, bedoeld in het tweede en derde lid.
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel16
  - number: '17'
    text: |-
      De bepalingen van dit hoofdstuk gelden niet met betrekking tot honden, geboren in Nederland voor de datum van
      inwerkingtreding van dit hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel17
  - number: '19'
    text: 'Dit besluit wordt aangehaald als: Besluit identificatie en registratie van dieren.'
    url: https://wetten.overheid.nl/BWBR0009019/2015-01-01#Artikel19
