  - number: '4'
    text: |-
      Onverminderd [artikel 3 van het Besluit rijkssubsidiëring restauratie monumenten 1997][ref1] wordt subsidie in
      ieder geval niet verstrekt, indien:

      a. de financiering van het gedeelte van de kosten van de voorgenomen restauratie, dat niet door subsidie wordt
      gedekt, naar het oordeel van Onze minister onvoldoende is gewaarborgd,

      b. het huidige of het beoogde gebruik van het te restaureren monument naar het oordeel van Onze minister een
      belemmering vormt voor de instandhouding van het monument, of

      c. de voorgenomen restauratie niet kan worden beëindigd vóór 1 oktober 2007.


      [ref1]: https://wetten.overheid.nl/BWBR0008615#Artikel3
    url: https://wetten.overheid.nl/BWBR0018387/2006-06-17#Artikel4
    references:
