        artikel: '3'
  - number: '5'
    text: |-
      Een aanvraag voor subsidie als bedoeld in [artikel 2][ref1] wordt vóór 15 oktober 2005 ingediend en wordt vóór
      15 november 2005 naar Onze minister doorgezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0018387#Artikel2
    url: https://wetten.overheid.nl/BWBR0018387/2006-06-17#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0018387
        artikel: '2'
  - number: '6'
    text: |-
      1 Het subsidieplafond is € 19.400.000 .

      2 Vóór 1 januari 2006 voorziet Onze minister in een gelijktijdige beslissing op de ingediende aanvragen.

      3 Indien het totaal van de aanvragen het vastgestelde subsidieplafond overschrijdt, wordt de beschikbare subsidie
      naar rato van de subsidiabele restauratiekosten over de aanvragers verdeeld.
    url: https://wetten.overheid.nl/BWBR0018387/2006-06-17#Artikel6
  - number: '7'
    text: |-
      Onverminderd [artikel 19, eerste lid, van het Besluit rijkssubsidiëring restauratie monumenten 1997][ref1],
      vermeldt Onze minister in de beschikking tot subsidieverlening tevens het jaar waarin de verleende subsidie wordt
      betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0008615#Artikel19
    url: https://wetten.overheid.nl/BWBR0018387/2006-06-17#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0008615
        artikel: '19'
  - number: '8'
    text: |-
      Indien de begrotingswetgever middelen beschikbaar stelt ten behoeve van subsidie voor de restauratie van beschermde
      monumenten als bedoeld in [artikel 2][ref1], in aanvulling op de in [artikel 6, eerste lid][ref2], bedoelde
      middelen, zijn de [artikelen 1 tot en met 7][ref3] van overeenkomstige toepassing met dien verstande dat dan:

      a. een aanvraag vóór een door Onze minister te bepalen tijdstip wordt ingediend en deze vóór een door Onze minister
      te bepalen tijdstip naar Onze minister wordt doorgezonden,

      b. Onze minister voorziet in een gelijktijdige beslissing op de ingediende aanvragen vóór een door Onze minister te
      bepalen tijdstip,

      c. in de plaats van de datum, bedoeld in [artikel 4, onderdeel c][ref4], een door Onze minister te bepalen datum
      geldt, en

      d. in de plaats van het subsidieplafond, bedoeld in [artikel 6, eerste lid][ref5], een door Onze minister vast te
      stellen subsidieplafond geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0018387#Artikel2
