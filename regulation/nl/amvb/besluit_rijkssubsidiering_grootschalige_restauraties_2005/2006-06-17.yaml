articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. eigenaar: een natuurlijke persoon of rechtspersoon die het recht van eigendom of een ander zakelijk recht heeft
      op een beschermd monument,

      b. restauratie: werkzaamheden aan een beschermd monument, het normale onderhoud te boven gaand, die voor het
      herstel van het beschermde monument noodzakelijk zijn, en

      c. subsidiabele restauratiekosten: kosten als bedoeld in
      [artikel 16 van het Besluit rijkssubsidiëring restauratie monumenten 1997][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008615#Artikel16
    url: https://wetten.overheid.nl/BWBR0018387/2006-06-17#Artikel1
