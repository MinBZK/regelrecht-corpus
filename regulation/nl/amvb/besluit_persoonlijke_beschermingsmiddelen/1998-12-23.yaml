preamble:
  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Op de voordracht van Onze Minister van Sociale Zaken en Werkgelegenheid, nr. DGA/AIB/WJZ/V/92/11522 gedaan in
    overeenstemming met de Staatssecretaris van Welzijn, Volksgezondheid en Cultuur;


    Overwegende, dat het, gelet op richtlijn 89/686/EEG van de Raad van de Europese Gemeenschappen van 21 december 1989
    betreffende de onderlinge aanpassing van de wetgevingen van de Lid-Staten inzake persoonlijke beschermingsmiddelen
    (PbEG L 399) noodzakelijk is regels te stellen ten aanzien van de veiligheid van persoonlijke beschermingsmiddelen;


    Gelet op de artikelen 1, eerste lid, onder b, 2, 3, eerste en tweede lid, 6, 12, derde lid, en 25a van de Wet op de
    gevaarlijke werktuigen;


    De Arboraad gehoord (adviezen van 29 oktober 1992, kenmerk R-2698/vZ/lm, en van 7 april 1993, kenmerk R-2775/WL/
    lm);


    De Raad van State gehoord (advies van 21 april 1993, nr. W12.93.0083);


    Gezien het nader rapport van Onze Minister voornoemd, nr. DGA/AIB/WJZ/9304627, uitgebracht in overeenstemming met
    de Staatssecretaris van Welzijn, Volksgezondheid en Cultuur;


    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0006095/1998-12-23#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In dit besluit wordt verstaan onder:

      a. persoonlijk beschermingsmiddel:

      1°. een uitrustingsstuk of -middel dat bestemd is om door een persoon te worden gedragen of vastgehouden als
      bescherming tegen één of meer gevaren die een bedreiging voor zijn gezondheid of zijn veiligheid kunnen vormen;

      2°. een geheel dat is samengesteld uit verscheidene uitrustingsstukken of -middelen die door de fabrikant onderling
      zijn verbonden om een persoon te beschermen tegen één of meer, mogelijk gelijktijdig optredende gevaren;

      3°. een uitrustingsstuk of beschermingsmiddel dat al of niet onlosmakelijk verbonden is met een niet-beschermende
      persoonlijke uitrusting die door een persoon wordt gedragen of vastgehouden voor het bedrijven van een bepaalde
      activiteit;

      4°. verwisselbare onderdelen van een persoonlijk beschermingsmiddel die voor een goede werking ervan onontbeerlijk
      zijn en die uitsluitend voor dat beschermingsmiddel worden gebruikt;

      b. de Gemeenschap: de gebieden waarop het Verdrag betreffende de Europese Unie van toepassing is;

      c. Europese Economische Ruimte: de gebieden waarop het Verdrag betreffende de Europese Unie van toepassing is
      en voorts het grondgebied van de Staten die partij zijn bij de Overeenkomst betreffende de Europese Economische
      Ruimte;

      d. richtlijn: [richtlijn 89/686/EEG](31989L0686) van de Raad van de Europese Gemeenschappen van 21 december 1989
      inzake de onderlinge aanpassing van de wetgevingen van de Lid-Staten betreffende persoonlijke beschermingsmiddelen;

      e. keuringsinstantie: een ingevolge artikel 5, eerste lid van de wet, in het kader van de richtlijn aangewezen
      dienst, instelling, onderzoekingsbureau of ondernemng dan wel een door een andere Lid-Staat bij de Europese
      Commissie aangemelde instantie, die als zodanig bevoegd is de taken te verrichten, bedoeld in de artikelen 10 en 11
      van de richtlijn;

      f wet: [Wet op de gevaarlijke werktuigen][ref1].

      2 Als integrerend onderdeel van een persoonlijk beschermingsmiddel wordt beschouwd ieder samen met het
      beschermingsmiddel in de handel gebracht verbindingssysteem dat het beschermingsmiddel aan een andere, externe
      voorziening verbindt, zelfs wanneer het verbindingssysteem voor de tijdsduur dat de gebruiker aan het risico c.q.
      de risico’s is blootgesteld, niet ononderbroken behoeft te worden gedragen of meegevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0002087
    url: https://wetten.overheid.nl/BWBR0006095/1998-12-23#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002087
  - number: '2'
    text: >-
      Als beveiligingsmiddelen, bedoeld in artikel 1, eerste lid, onderdeel *b* van de wet, worden aangewezen
      persoonlijke beschermingsmiddelen.
    url: https://wetten.overheid.nl/BWBR0006095/1998-12-23#Artikel2
  - number: '3'
    text: >-
      Dit besluit is niet van toepassing op:


      a. persoonlijke beschermingsmiddelen bestemd voor uitsluitend niet-beroepsmatige toepassing;


      b. categorieën persoonlijke beschermingsmiddelen waarvoor bij of krachtens de wet specifieke voorschriften op het
      gebied van produktveiligheid zijn gegeven, die uitvoering geven aan andere communautaire richtlijnen dan de in
      artikel 1, eerste lid onderdeel d, bedoelde richtlijn, die dezelfde doelstellingen hebben ten aanzien van het in de
      handel brengen, het vrije verkeer en de veiligheid;


      c. de categorieën persoonlijke beschermingsmiddelen genoemd in bijlage I van de richtlijn.
    url: https://wetten.overheid.nl/BWBR0006095/1998-12-23#Artikel3
  - number: '4'
    text: >-
      Persoonlijke beschermingsmiddelen dienen zodanig te zijn ontworpen en vervaardigd en zodanige eigenschappen
      te hebben alsmede van zodanige vermeldingen te zijn voorzien, dat de veiligheid van de gebruiker met deze
      beschermingsmiddelen - zonder gevaar voor de veiligheid of gezondheid van andere personen, voor huisdieren of
      goederen - gewaarborgd en zijn gezondheid beschermd worden, wanneer zij overeenkomstig hun bestemming gebruikt
      worden en indien zij behoorlijk worden onderhouden. Zij dienen daartoe te voldoen aan de in bijlage II van de
      richtlijn opgenomen fundamentele veiligheidseisen.
    url: https://wetten.overheid.nl/BWBR0006095/1998-12-23#Artikel4
  - number: '5'
    text: >-
      Persoonlijke beschermingsmiddelen die voldoen aan de door Onze Minister in overeenstemming met Onze Minister van
      Volksgezondheid, Welzijn en Sport aangewezen geharmoniseerde normen, worden in zoverre vermoed te voldoen aan het
      in artikel 4, tweede volzin, bepaalde.
    url: https://wetten.overheid.nl/BWBR0006095/1998-12-23#Artikel5
  - number: '6'
    text: >-
      1 Persoonlijke beschermingsmiddelen dienen te zijn onderworpen aan een certificeringsprocedure overeenkomstig het
      in dit artikel bepaalde, en te zijn voorzien van de in bijlage IV van de richtlijn bedoelde CE-markering. Indien
      een certificeringsprocedure de afgifte van een verklaring van EG-typeonderzoek voorschrijft, dient het persoonlijke
      beschermingsmiddel of het model van de persoonlijke beschermingsmiddelen waarop dat voorschrift betrekking heeft,
      te zijn gekeurd.


      2 Het in het eerste lid bedoelde merkteken mag uitsluitend worden aangebracht indien:


      a. voor het persoonlijke beschermingsmiddel


      1°. een EG-verklaring van overeenstemming als bedoeld in bijlage VI van de richtlijn voorhanden is bij de in de
      Gemeenschap of in een andere Staat, die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte
      gevestigde fabrikant of diens gemachtigde dan wel, in het geval zij geen van beide in de Gemeenschap of in één
      van de andere hiervoor bedoelde Staten zijn gevestigd, degene die de persoonlijke beschermingsmiddelen in de
      Gemeenschap of in één van de andere hiervoor bedoelde Staten in de handel brengt, en


      2°. een technisch dossier als bedoeld in bijlage III van de Richtlijn bij één van de personen, bedoeld onder 1°,
      voorhanden is, en


      b. behoudens voor beschermingsmiddelen bedoeld in artikel 8, derde lid van de richtlijn, een EG-
      typeonderzoekverklaring als bedoeld in artikel 10 van de Richtlijn van een keuringsinstantie is verkregen, en


      c. de vervaardiging van het persoonlijk beschermingsmiddel is geschied met inachtneming van één van de produktie-
      controleprocedures, bedoeld in artikel 11 van de richtlijn, wanneer het een persoonlijk beschermingsmiddel betreft
      dat wordt genoemd in artikel 8, vierde lid, onderdeel *a*, van de richtlijn.


      3 Het eerste lid is niet van toepassing op onderdelen van persoonlijke beschermingsmiddelen die bestemd zijn om
      te worden ingebouwd in persoonlijke beschermingsmiddelen of met andere onderdelen te worden samengebouwd tot één
      persoonlijk beschermingsmiddel, mits zij geen wezenlijk onderdeel van persoonlijke beschermingsmiddelen zijn die
      voor de goede werking ervan onmisbaar zijn, en op de samenstellingen dit besluit van toepassing is.


      4 Persoonlijke beschermingsmiddelen die met inachtneming van de procedures genoemd in dit artikel zijn voorzien van
      de CE-markering en waarvan de EG-verklaring van overeenstemming alsmede, indien van toepassing, de verklaring van
      EG-typeonderzoek voorhanden is bij één van de in het tweede lid genoemde personen, worden vermoed te voldoen aan
      het in artikel 4, tweede volzin, bepaalde.


      5 Indien bij de vervaardiging geharmoniseerde normen niet of slechts gedeeltelijk zijn toegepast, of wanneer die
      normen ontbreken, dient in de verklaring van de keuringsinstantie de overeenstemming met de fundamentele eisen
      met inachtneming van de procedure van artikel 10, vierde lid, onder *a*), tweede gedachtenstreepje en *b*), tweede
      gedachtenstreepje, van de richtlijn, te worden vermeld.


      6 a. Indien de fabrikant, diens in Nederland gevestigde gevolmachtigde, dan wel, indien geen van beiden in
      Nederland zijn gevestigd, de importeur die het persoonlijke beschermingsmiddel in Nederland op de markt brengt,
      voornemens is aan het model van een persoonlijk beschermingsmiddel of aan te vervaardigen en in de handel te
      brengen persoonlijke beschermingsmiddelen waarvoor een verklaring van typeonderzoek is afgegeven, wijzigingen
      aan te brengen, stelt hij de keuringsinstantie die de verklaring van EG-typeonderzoek heeft afgegeven hiervan
      onverwijld in kennis.


      b. De in onderdeel *a* bedoelde keuringsinstantie beoordeelt de wijzigingen en deelt de genoemde persoon mede of de
      typeonderzoekverklaring voor het aldus gewijzigde persoonlijke beschermingsmiddel geldig is.


      c. Indien de in onderdeel *a* bedoelde keuringsinstantie van oordeel is dat de verklaring van EG-typeonderzoek voor
      het gewijzigde persoonlijke beschermingsmiddel niet geldig is, moet dit persoonlijke beschermingsmiddel aan een EG-
      typeonderzoek worden onderworpen.


      7 Een gedraging in strijd met het bepaalde in het eerste en het tweede lid is verboden.
    url: https://wetten.overheid.nl/BWBR0006095/1998-12-23#Artikel6
  - number: '7'
    text: >-
      1 De CE-markering is overeenkomstig bijlage IV van de richtlijn duidelijk leesbaar en voor de te verwachten
      levensduur onuitwisbaar op het persoonlijke beschermingsmiddel, dan wel, indien dat onmogelijk is, op de verpakking
      aangebracht. Indien een keuringsinstantie optreedt in de produktiecontrolefase wordt het onderscheidingsnummer
      daarvan toegevoegd.


      2 Op persoonlijke beschermingsmiddelen worden geen markeringen gebezigd, die derden kunnen misleiden omtrent de
      betekenis of grafische vorm van de CE-markering. Op de persoonlijk beschermingsmiddelen mogen andere markeringen
      worden aangebracht op voorwaarde dat de zichtbaarheid en de leesbaarheid van de CE-markering niet worden
      verminderd.
    url: https://wetten.overheid.nl/BWBR0006095/1998-12-23#Artikel7
  - number: '8'
    text: >-
      Een EG-typeonderzoekverklaring wordt door de krachtens artikel 5 van de wet aangewezen keuringsinstantie die haar
      heeft afgegeven ingetrokken indien de fundamentele eisen van bijlage II van de richtlijn zodanig zijn gewijzigd dat
      het model niet aan de gewijzigde eisen voldoet.
    url: https://wetten.overheid.nl/BWBR0006095/1998-12-23#Artikel8
  - number: '9'
    text: >-
      1 Degene die een persoonlijk beschermingsmiddel voorhanden heeft, aflevert, tentoontstelt of gebruikt is verplicht
      ervoor te zorgen dat het beschermingsmiddel in goede staat van onderhoud verkeert.


      2 Het eerste lid is niet van toepassing op degene die een persoonlijk beschermingsmiddel voorhanden heeft dat
      hetzij is afgekeurd, hetzij onklaar gemaakt, hetzij anderszins kennelijk niet meer voor gebruik bestemd is.
    url: https://wetten.overheid.nl/BWBR0006095/1998-12-23#Artikel9
  - number: '10'
    text: >-
      Persoonlijke beschermingsmiddelen, die niet in overeenstemming zijn met de bepalingen van dit besluit, mogen op
      (jaar)beurzen, exposities en bij demonstraties worden tentoongesteld en gedemonstreerd, mits op een zichtbaar bord
      is aangegeven dat zij niet in overeenstemming met die bepalingen zijn, en dat zij niet te koop zijn voordat zij
      door de fabrikant of zijn in de Gemeenschap, of in een andere Staat, die partij is bij de Overeenkomst betreffende
      de Europese Economische Ruimte, gevestigde gevolmachtigde in overeenstemming met die bepalingen zijn gebracht.
      Bij demonstraties moeten alle passende veiligheidsmaatregelen zijn genomen om de bescherming van personen te
      waarborgen.
    url: https://wetten.overheid.nl/BWBR0006095/1998-12-23#Artikel10
  - number: '11'
    text: >-
      1 Het is verboden een op een persoonlijk beschermingsmiddel aangebracht merk van afkeuring te verwijderen, te
      beschadigen of onleesbaar te maken.


      2 Het eerste lid is niet van toepassing ten aanzien van de ambtenaren die ingevolge artikel 12, eerste lid, eerste
      zin van de wet ten aanzien van persoonlijke beschermingsmiddelen aangewezen zijn.


      3 Onze Minister kan ten aanzien van merken van afkeuring nadere bepalingen vaststellen.
    url: https://wetten.overheid.nl/BWBR0006095/1998-12-23#Artikel11
  - number: '12'
    text: >-
      1 Indien naar het oordeel van Onze Minister het gebruik van bepaalde persoonlijke beschermingsmiddelen, die
      voorzien zijn van de CE-markering, waarvan een verklaring van overeenstemming voorhanden is, die overeenkomstig
      hun bestemming worden gebruikt en onderhouden worden, gevaar oplevert voor de veiligheid of de gezondheid van de
      gebruikers of van andere personen, voor huisdieren of goederen, kan hij de fabrikant, diens in de Gemeenschap of in
      een andere Staat, die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte, gevestigde fabrkant
      of diens gemachtigde of, in het geval zij geen van beide in de Gemeenschap of in één van de andere hiervoor
      bedoelde Staten zijn gevestigd, aan degene die de persoonlijke beschermingsmiddelen in de Gemeenschap of in één van
      de andere hiervoor bedoelde Staten op de markt brengt gelasten om de bezitters, dan wel de vermoedelijke bezitters
      van die persoonlijke beschermingsmiddelen onverwijld en op doeltreffende wijze op de hoogte te stellen van het
      gevaar.


      2 Indien de fabrikant of één van de andere in het eerste lid genoemde personen de krachtens het eerste lid gelaste
      maatregelen niet onverwijld of niet op doeltreffende wijze uitvoert, kan Onze Minister die maatregelen op kosten
      van de fabrikant treffen.


      3 Onze Minister geeft van een krachtens dit artikel genomen maatregel en van de intrekking daarvan onverwijld
      kennis aan betrokkenen, aan de Europese Commissie en in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0006095/1998-12-23#Artikel12
  - number: '13'
    text: >-
      1 Indien naar het oordeel van Onze Minister het gebruik van bepaalde persoonlijke beschermingsmiddelen, die
      voorzien zijn van een CE-markering, waarvan een verklaring van overeenstemming voorhanden is, die overeenkomstig
      hun bestemming worden gebruikt en op passende wijze onderhouden worden, gevaar oplevert voor de veiligheid of de
      gezondheid van de gebruikers of van andere personen, huisdieren of goederen, kan hij


      a. een verbod uitvaardigen tot het vervaardigen, het in Nederland invoeren en het verhandelen van die persoonlijke
      beschermingsmiddelen;


      b. de fabrikant of de andere, in het eerste lid van artikel 12 genoemde personen verplichten om overeenkomstig de
      daarbij gegeven aanwijzingen passende maatregelen te nemen om die persoonlijke beschermingsmiddelen zoveel mogelijk
      uit de handel te nemen.


      2 Onze Minister neemt een maatregel krachtens het eerste lid in overeenstemming met Onze Ministers wie het mede
      aangaat.


      3 Artikel 12, derde lid, is van overeenkomstige toepassing.


      4 Een gedraging in strijd met een krachtens het eerste lid genomen maatregel is verboden.
    url: https://wetten.overheid.nl/BWBR0006095/1998-12-23#Artikel13
  - number: '14'
    text: >-
      Voor een aanwijzing als keuringsinstantie komen in aanmerking instanties die tenminste voldoen aan de in
      bijlage V van de richtlijn neergelegde voorwaarden. Onze Minister kan, in overeenstemming met Onze Minister van
      Volksgezondheid, Welzijn en Sport, nadere voorwaarden stellen.
    url: https://wetten.overheid.nl/BWBR0006095/1998-12-23#Artikel14
  - number: '15'
    text: >-
      Indien één van de bijlagen van de richtlijn, waarnaar in dit besluit wordt verwezen, wordt gewijzigd, dan wel
      indien een specifieke communautaire richtlijn als bedoeld in artikel 4, eerste streepje, van de richtlijn wordt
      vastgesteld of gewijzigd, maakt Onze Minister, in overeenstemming met Onze Minister van Volksgezondheid, Welzijn en
      Sport, dit bekend in de *Staatscourant*; hij vermeldt daarbij met ingang van welke datum en zonodig met betrekking
      tot welke persoonlijke beschermingsmiddelen de wijziging moet worden toegepast.
    url: https://wetten.overheid.nl/BWBR0006095/1998-12-23#Artikel15
  - number: '16'
    text: >-
      1 De artikelen 4 en 6 zijn niet van toepassing op persoonlijke beschermingsmiddelen die voldoen aan de wettelijke
      voorschriften zoals die luidden op de dag voor de inwerkingtreding van dit besluit en die voor 1 juli 1995 in de
      handel zijn gebracht en in gebruik genomen en voor die datum niet worden voorzien van de CE-markering.


      2 Met betrekking tot persoonlijke beschermingsmiddelen als bedoeld in het eerste lid, waarop dit besluit niet
      wordt toegepast en waarop ingevolge een of meer andere wettelijke regelingen de CE-markering wordt aangebracht,
      worden op de bij die beschermingsmiddelen gevoegde documenten, handleidingen of gebruiksaanwijzingen de in het
      *Publikatieblad van de Europese Gemeenschappen* bekendgemaakte referenties van de aan die wettelijke regelingen ten
      grondslag liggende richtlijnen vermeld.
    url: https://wetten.overheid.nl/BWBR0006095/1998-12-23#Artikel16
  - number: '17'
    text: >-
      Dit besluit treedt in werking met ingang van de eerste dag na de datum van uitgifte van het *Staatsblad* waarin het
      zal worden geplaatst.
    url: https://wetten.overheid.nl/BWBR0006095/1998-12-23#Artikel17
  - number: '18'
    text: 'Dit besluit wordt aangehaald als: Besluit persoonlijke beschermingsmiddelen.'
    url: https://wetten.overheid.nl/BWBR0006095/1998-12-23#Artikel18
