---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_archiefoverdrachten_rijksadministratie
regulatory_layer: AMVB
publication_date: '1988-12-15'
valid_from: '1988-12-15'
bwb_id: BWBR0004427
url: https://wetten.overheid.nl/BWBR0004427/1988-12-15
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Binnenlandse Zaken van 21 oktober 1988, nr. IBI88/48/U19-B, directoraat-
    generaal Openbaar Bestuur;

    Gedaan in overeenstemming met het gevoelen van de Ministerraad en overeenkomstig het bepaalde in artikel 3 van het
    Besluit algemene secretarie-aangelegenheden rijksadministratie;

    Overwegende dat het wenselijk is voorschriften vast te stellen met betrekking tot het beheer van archiefbescheiden
    in geval van reorganisatie of opheffing van een ministerie of archiefvormend onderdeel daarvan, dan wel in geval
    van privatisering van rijkstaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0004427/1988-12-15#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0004427/1988-12-15#Artikel1
  - number: 1.a
    text: |-
      ministerie: een ministerie als bedoeld in [artikel 44 van de Grondwet][ref1] en als departement aangeduid in
      [artikel 1, eerste lid](onbekend), van het Besluit algemene secretarie-aangelegenheden rijksadministratie (*Stb.*
      1980, 182);


      [ref1]: https://wetten.overheid.nl/BWBR0001840#Artikel44
    url: https://wetten.overheid.nl/BWBR0004427/1988-12-15#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001840
        artikel: '44'
  - number: 1.b
    text: 'archiefvormend onderdeel: een organisatie-onderdeel van een ministerie waarvoor afzonderlijk wordt gearchiveerd;'
    url: https://wetten.overheid.nl/BWBR0004427/1988-12-15#Artikel1
  - number: 1.c
    text: |-
      overheidsorgaan: een overheidsorgaan als bedoeld in de [Archiefwet][ref1] 1962 (*Stb.* 1962, 313);


      [ref1]: https://wetten.overheid.nl/BWBR0007376
    url: https://wetten.overheid.nl/BWBR0004427/1988-12-15#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007376
  - number: 1.d
    text: |-
      reorganisatie: de situatie, waarbij een deel van de taken van een archiefvormend onderdeel aan een ander
      archiefvormend onderdeel binnen hetzelfde ministerie dan wel van een ministerie of een archiefvormend onderdeel
      daarvan aan een ander overheidsorgaan worden overgedragen;
    url: https://wetten.overheid.nl/BWBR0004427/1988-12-15#Artikel1
  - number: 1.e
    text: |-
      opheffing: de situatie, waarbij de taken van een ministerie of archiefvormend onderdeel worden beëindigd of
      overgedragen aan een ander overheidsorgaan;
    url: https://wetten.overheid.nl/BWBR0004427/1988-12-15#Artikel1
  - number: 1.f
    text: |-
      privatisering: de situatie, waarbij de taken van een archiefvormend onderdeel geheel of gedeeltelijk worden
      overgedragen aan een andere rechtspersoon dan bedoeld in [artikel 1, boek 2, Burgerlijk Wetboek][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel1
    url: https://wetten.overheid.nl/BWBR0004427/1988-12-15#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '1'
  - number: 1.g
    text: |-
      uitlening: de handeling, bedoeld in [artikel 19 van het Besluit algemene secretarie-aangelegenheden
      rijksadministratie](onbekend);
    url: https://wetten.overheid.nl/BWBR0004427/1988-12-15#Artikel1
  - number: 1.h
    text: |-
      terbeschikkingstelling: de handeling, bedoeld in [artikel 23 van het Besluit algemene secretarie-aangelegenheden
      rijksadministratie](onbekend), alsmede, in geval van privatisering, een overeenkomstige handeling ten opzichte van
      een rechtspersoon;
    url: https://wetten.overheid.nl/BWBR0004427/1988-12-15#Artikel1
  - number: 1.i
    text: |-
      vervreemding: de handeling, bedoeld in [artikel 8 van het Archiefbesluit][ref1] (*Stb.* 1968, 200);


      [ref1]: https://wetten.overheid.nl/BWBR0007748#Artikel8
    url: https://wetten.overheid.nl/BWBR0004427/1988-12-15#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007748
        artikel: '8'
  - number: '2.1'
    text: |-
      De archiefbescheiden betreffende zaken welke op het moment van reorganisatie nog niet zijn afgedaan, worden
      overgedragen aan het archiefvormende onderdeel binnen hetzelfde ministerie of het andere overheidsorgaan, dat
      deze zaken zal afdoen. Van een overdracht binnen hetzelfde ministerie wordt een proces-verbaal opgemaakt. Van een
      overdracht aan een ander overheidsorgaan wordt een verklaring van vervreemding opgemaakt.
    url: https://wetten.overheid.nl/BWBR0004427/1988-12-15#Artikel2
  - number: '2.2'
    text: |-
      De archiefbescheiden betreffende zaken welke op het moment van reorganisatie reeds zijn afgedaan blijven, tot hun
      overbrenging naar een rijksarchiefbewaarplaats, berusten onder het archiefvormend onderdeel van het ministerie, dat
      deze zaken heeft afgedaan.
    url: https://wetten.overheid.nl/BWBR0004427/1988-12-15#Artikel2
  - number: '2.3'
    text: |-
      Ingeval van overdracht van taken aan een ander archiefvormend onderdeel binnen hetzelfde ministerie kunnen de, in
      het tweede lid bedoelde archiefbescheiden tijdelijk aan dat onderdeel worden uitgeleend. Ingeval van overdracht van
      taken aan een ander overheidsorgaan kunnen deze archiefbescheiden tijdelijk ter beschikking worden gesteld. Zowel
      een uitlening als een terbeschikkingstelling wordt geadministreerd.
    url: https://wetten.overheid.nl/BWBR0004427/1988-12-15#Artikel2
  - number: '2.4'
    text: |-
      Indien de ordening van de in het tweede lid bedoelde archiefbescheiden zich verzet tegen uitlening of
      terbeschikkingstelling, zijn het in het derde lid bedoelde archiefvormende onderdeel of andere overheidsorgaan te
      allen tijde bevoegd inzage te nemen van die archiefbescheiden dan wel daarvan of daaruit reprodukties, afschriften
      of uittreksels te vorderen.
    url: https://wetten.overheid.nl/BWBR0004427/1988-12-15#Artikel2
  - number: '3.1'
    text: |-
      Op de archiefbescheiden betreffende zaken welke op het moment van opheffing nog niet zijn afgedaan, is het bepaalde
      in [artikel 2, eerste lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004427#Artikel2
    url: https://wetten.overheid.nl/BWBR0004427/1988-12-15#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0004427
        artikel: '2'
        paragraaf: '2'
  - number: '3.2'
    text: |-
      De archiefbescheiden betreffende zaken, die op het moment van opheffing reeds zijn afgedaan, worden, tot hun
      overbrenging naar een rijksarchiefbewaarplaats, overgedragen aan het archiefvormende onderdeel van hetzelfde
      ministerie of het andere overheidsorgaan, dat het grotere deel van de taken wordt toegewezen dan wel met de
      afwikkeling van de opheffing wordt belast. De in de vorige volzin bedoelde overbrenging geschiedt als had geen
      opheffing plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0004427/1988-12-15#Artikel3
  - number: '3.3'
    text: |-
      Aan een archiefvormend onderdeel binnen hetzelfde ministerie of een ander overheidsorgaan, dat het overige deel
      van de taken wordt toegewezen, kunnen de op die taken betrekking hebbende archiefbescheiden tijdelijk worden
      uitgeleend onderscheidenlijk ter beschikking gesteld. Zowel een uitlening als een terbeschikkingstelling wordt
      geadministreerd.
    url: https://wetten.overheid.nl/BWBR0004427/1988-12-15#Artikel3
  - number: '3.4'
    text: |-
      Indien de ordening van de in het tweede lid bedoelde archiefbescheiden zich verzet tegen uitlening of
      terbeschikkingstelling, zijn het in het derde lid bedoelde archiefvormende onderdeel of andere overheidsorgaan te
      allen tijde bevoegd inzage te nemen van die archiefbescheiden dan wel daarvan of daaruit reprodukties, afschriften
      of uittreksels te vorderen.
    url: https://wetten.overheid.nl/BWBR0004427/1988-12-15#Artikel3
  - number: '4.1'
    text: |-
      De archiefbescheiden betreffende zaken welke op het moment van privatisering nog niet zijn afgedaan, worden
      tijdelijk ter beschikking gesteld aan de rechtspersoon waaraan die taken worden overgedragen.
    url: https://wetten.overheid.nl/BWBR0004427/1988-12-15#Artikel4
  - number: '4.2'
    text: |-
      De archiefbescheiden betreffende zaken welke op het moment van privatisering reeds zijn afgedaan kunnen, voor zover
      zij niet zijn overgebracht naar een rijksarchiefbewaarplaats, tijdelijk ter beschikking worden gesteld aan de in
      het eerste lid bedoelde rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0004427/1988-12-15#Artikel4
  - number: '4.3'
    text: |-
      Een regeling waarbij taken van een archiefvormend onderdeel geheel of gedeeltelijk aan een rechtspersoon worden
      overgedragen, dient tevens te bepalen voor welk tijdvak van ten hoogste twintig jaar de in het eerste en tweede lid
      bedoelde archiefbescheiden ter beschikking worden gesteld.
    url: https://wetten.overheid.nl/BWBR0004427/1988-12-15#Artikel4
  - number: '4.4'
    text: |-
      Van de krachtens het eerste en tweede lid ter beschikking gestelde archiefbescheiden dient een verklaring te
      worden opgemaakt, die tenminste inhoudt een specificatie van de desbetreffende archiefbescheiden. Een exemplaar
      van deze verklaring wordt bewaard door de desbetreffende minister, de algemene rijksarchivaris en de betrokken
      rechtspersoon. De overbrenging van de in de eerste volzin van dit lid bedoelde archiefbescheiden naar een
      rijksarchiefbewaarplaats geschiedt als had geen privatisering plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0004427/1988-12-15#Artikel4
  - number: '4.5'
    text: |-
      Het in [artikel 19 van de Archiefwet][ref1] 1962 bedoelde toezicht van de algemene rijksarchivaris blijft op de
      krachtens het eerste en tweede lid ter beschikking gestelde archiefbescheiden van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007376#Artikel19
    url: https://wetten.overheid.nl/BWBR0004427/1988-12-15#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0007376
        artikel: '19'
  - number: '4.6'
    text: |-
      De kosten van het beheer van de krachtens het eerste en tweede lid ter beschikking gestelde archiefbescheiden komen
      ten laste van de rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0004427/1988-12-15#Artikel4
  - number: '4.7'
    text: |-
      Indien de ordening van de in het tweede lid bedoelde archiefbescheiden zich verzet tegen terbeschikkingstelling,
      is de in het eerste lid bedoelde rechtspersoon te allen tijde bevoegd inzage te nemen van die archiefbescheiden dan
      wel daarvan of daaruit reprodukties, afschriften of uittreksels te vorderen.
    url: https://wetten.overheid.nl/BWBR0004427/1988-12-15#Artikel4
  - number: '5.1'
    text: |-
      De voor de inwerkingtreding van dit besluit getroffen voorzieningen met betrekking tot het beheer van
      archiefbescheiden in geval van reorganisatie, opheffing of privatisering blijven gehandhaafd, totdat zij, voor
      zover nodig, met de bepalingen van dit besluit in overeenstemming zijn gebracht.
    url: https://wetten.overheid.nl/BWBR0004427/1988-12-15#Artikel5
  - number: '5.2'
    text: |-
      Het bepaalde in het eerste lid is niet van toepassing, indien een zodanige voorziening bij of krachtens
      enige wet is getroffen dan wel indien de desbetreffende archiefbescheiden reeds zijn overgebracht naar een
      archiefbewaarplaats in de zin van de [Archiefwet][ref1] 1962.


      [ref1]: https://wetten.overheid.nl/BWBR0007376
    url: https://wetten.overheid.nl/BWBR0004427/1988-12-15#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007376
  - number: '6'
    text: Dit besluit kan worden aangehaald als Besluit archiefoverdrachten rijksadministratie.
    url: https://wetten.overheid.nl/BWBR0004427/1988-12-15#Artikel6
  - number: '7'
    text: |-
      Dit besluit treedt in werking met ingang van de tweede dag na de datum van uitgifte van het *Staatsblad* waarin het
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0004427/1988-12-15#Artikel7
