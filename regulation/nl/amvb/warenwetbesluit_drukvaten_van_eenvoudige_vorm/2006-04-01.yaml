---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: warenwetbesluit_drukvaten_van_eenvoudige_vorm
regulatory_layer: AMVB
publication_date: '2009-10-01'
valid_from: '2006-04-01'
bwb_id: BWBR0005627
url: https://wetten.overheid.nl/BWBR0005627/2006-04-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Sociale Zaken en Werkgelegenheid van 9 april 1992, Directoraat-Generaal van
    de Arbeid, Afdeling Wetgeving en Juridische Zaken, nr. DGA/AIB/WJZ/92/4989;

    Overwegende dat regels dienen te worden gesteld ter uitvoering van de Richtlijn van de Raad van de Europese
    Gemeenschappen van 25 juni 1987 betreffende de onderlinge aanpassing van de wetgevingen van de Lid-Staten inzake
    drukvaten van eenvoudige vorm (87/404/EEG, PbEG 1987, L220/48);

    Gelet op de artikelen 1, eerste lid, onder a, 2, 3, eerste en tweede lid, 4, derde lid, 6, 12, derde lid, 24 en 25a
    van de Wet op de gevaarlijke werktuigen (Stb. 1952, 104);

    De Raad van State gehoord (advies van 24 juni 1992, No. W12.92.0157);

    Gezien het nader rapport van Onze Minister van Sociale Zaken en Werkgelegenheid van 12 augustus 1992, Directoraat-
    Generaal van de Arbeid, Afdeling Wetgeving en Juridische Zaken, nr. DGA/AIB/WJZ/92/10728;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0005627/2006-04-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0005627/2006-04-01#Artikel1
  - number: 1.a
    text: |-
      drukvat: een in serie vervaardigd gelast drukvat van eenvoudige vorm met een inwendige overdruk van meer dan 0,5
      bar,
    url: https://wetten.overheid.nl/BWBR0005627/2006-04-01#Artikel1
  - number: 1.a.1e
    text: dat ertoe bestemd is lucht, dan wel stikstof te bevatten en
    url: https://wetten.overheid.nl/BWBR0005627/2006-04-01#Artikel1
  - number: 1.a.2e
    text: dat niet bestemd is om aan vlambelasting te worden onderworpen en
    url: https://wetten.overheid.nl/BWBR0005627/2006-04-01#Artikel1
  - number: 1.a.3e
    text: |-
      waarvan de delen en verbindingen die van belang zijn voor de sterkte van het drukvat zijn vervaardigd uit
      niet-gelegeerd kwaliteitsstaal dan wel uit niet-gelegeerd aluminium of geen dispersieharding vertonende
      aluminiumlegeringen en
    url: https://wetten.overheid.nl/BWBR0005627/2006-04-01#Artikel1
  - number: 1.a.4e
    text: |-
      dat bestaat uit: - een cilindrisch gedeelte met een cirkelvormige dwarsdoorsnede, afgesloten door gewelfde bodems
      met de holle zijde naar binnen of door platte bodems, welke bodems een zelfde omwentelingsas hebben als het
      cilindrisch gedeelte, of
        - twee gewelfde bodems met een zelfde omwentelingsas en
    url: https://wetten.overheid.nl/BWBR0005627/2006-04-01#Artikel1
  - number: 1.a.5e
    text: |-
      waarvan de maximale bedrijfsdruk ten hoogste gelijk is aan 30 bar en het produkt van deze druk en de inhoud van het
      vat (PS.V) niet groter is dan 10.000 bar.l en
    url: https://wetten.overheid.nl/BWBR0005627/2006-04-01#Artikel1
  - number: 1.a.6e
    text: |-
      waarvan de minimale bedrijfstemperatuur niet lager is dan -50°C en de maximale bedrijfstemperatuur niet hoger is
      dan 300° C bij een drukvat van staal en 100° C bij een drukvat van aluminium of aluminiumlegeringen;
    url: https://wetten.overheid.nl/BWBR0005627/2006-04-01#Artikel1
  - number: 1.b
    text: 'de Gemeenschap: het grondgebied waarop het Verdrag betreffende de Europese Unie van toepassing is;'
    url: https://wetten.overheid.nl/BWBR0005627/2006-04-01#Artikel1
  - number: 1.c
    text: |-
      richtlijn: de Richtlijn van de Raad van de Europese Gemeenschappen van 25 juni 1987 betreffende de onderlinge
      aanpassing van de wetgevingen van de Lid-Staten inzake drukvaten van eenvoudige vorm (87/404/EEG, *PbEG* 1987,
      L 220/48);
    url: https://wetten.overheid.nl/BWBR0005627/2006-04-01#Artikel1
  - number: 1.d
    text: |-
      aangewezen aangemelde instelling: een krachtens [artikel 7a van de wet][ref1] in het kader van de richtlijn
      aangewezen en bij de Commissie van de Europese Gemeenschappen aangemelde instelling, dan wel een door een andere
      staat die partij is bij Overeenkomst betreffende de Europese Economische Ruimte in het kader van de richtlijn
      aangewezen en bij de Commissie van de Europese Gemeenschappen aangemelde instelling;


      [ref1]: https://wetten.overheid.nl/BWBR0001969#Artikel7a
    url: https://wetten.overheid.nl/BWBR0005627/2006-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001969
        artikel: 7a
  - number: 1.e
    text: |-
      wet: [Warenwet][ref1].

      [ref1]: https://wetten.overheid.nl/BWBR0001969
    url: https://wetten.overheid.nl/BWBR0005627/2006-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001969
  - number: '2'
    text: |-
      Dit besluit en de daarop berustende bepalingen zijn eveneens van toepassing op drukvaten indien deze onroerend
      zijn.
    url: https://wetten.overheid.nl/BWBR0005627/2006-04-01#Artikel2
  - number: '3'
    text: 'Dit besluit is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0005627/2006-04-01#Artikel3
  - number: 3.a
    text: |-
      drukvaten speciaal ontworpen voor nucleair gebruik, die bij defecten het verspreiden van radioactiviteit kunnen
      veroorzaken;
    url: https://wetten.overheid.nl/BWBR0005627/2006-04-01#Artikel3
  - number: 3.b
    text: drukvaten die speciaal bestemd zijn voor installatie in of voor voortstuwing van schepen en luchtvaartuigen;
    url: https://wetten.overheid.nl/BWBR0005627/2006-04-01#Artikel3
  - number: 3.c
    text: brandblusapparaten.
    url: https://wetten.overheid.nl/BWBR0005627/2006-04-01#Artikel3
  - number: 3a.1
    text: |-
      Het is verboden drukvaten te verhandelen, in bedrijf te stellen of te gebruiken, die niet voldoen aan de
      vervaardigingsvoorschriften gesteld bij of krachtens dit besluit.
    url: https://wetten.overheid.nl/BWBR0005627/2006-04-01#Artikel3a
  - number: 3a.2
    text: |-
      Het is verboden drukvaten te verhandelen of te gebruiken anders dan met inachtneming van de voorschriften bij of
      krachtens dit besluit gesteld met betrekking tot de aanduiding en het bezigen van vermeldingen.
    url: https://wetten.overheid.nl/BWBR0005627/2006-04-01#Artikel3a
  - number: 3a.3
    text: |-
      Het is verboden drukvaten te verhandelen of te gebruiken, indien de bij of krachtens dit besluit voorgeschreven
      keuringsprocedures niet in acht zijn genomen.
    url: https://wetten.overheid.nl/BWBR0005627/2006-04-01#Artikel3a
  - number: 3a.4
    text: |-
      Het is verboden drukapparatuur, samenstellen en druksystemen te gebruiken anders dan met inachtneming van de
      voorschriften bij of krachtens dit besluit gesteld met betrekking tot het voorhanden zijn van documenten.
    url: https://wetten.overheid.nl/BWBR0005627/2006-04-01#Artikel3a
  - number: '4.1'
    text: |-
      Een drukvat is zodanig ontworpen en vervaardigd, heeft zodanige eigenschappen en is van zodanige vermeldingen
      voorzien dat het geen gevaar oplevert voor de veiligheid of gezondheid van de mens of voor de veiligheid van zaken,
      wanneer het op passende wijze wordt geïnstalleerd en onderhouden en wordt gebruikt voor het doel waarvoor het is
      bestemd.
    url: https://wetten.overheid.nl/BWBR0005627/2006-04-01#Artikel4
  - number: '4.2'
    text: |-
      Een drukvat, waarvan het produkt PS.V groter is dan 50 bar.1, voldoet aan de in bijlage I van de richtlijn vermelde
      essentiële veiligheidsvoorschriften en is voorzien van de in artikel 16 van de richtlijn bedoelde CE-markering en
      van de in punt 1, onderdeel B van bijlage II van de richtlijn bedoelde opschriften.
    url: https://wetten.overheid.nl/BWBR0005627/2006-04-01#Artikel4
  - number: '4.3'
    text: |-
      Een drukvat waarvan het product PS.V ten hoogste 50 bar.l is, wordt vervaardigd volgens de ter zake in een van
      de staten die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte geldende regelen van goed
      vakmanschap en is voorzien van de in punt 1 van bijlage II van de richtlijn bedoelde opschriften, met uitzondering
      van de in artikel 16 van de richtlijn bedoelde CE-markering.
    url: https://wetten.overheid.nl/BWBR0005627/2006-04-01#Artikel4
  - number: '4.4'
    text: |-
      Een drukvat dat met inachtneming van de procedures, genoemd in dit artikel, is voorzien van de CE-markering, wordt
      vermoed te voldoen aan het tweede lid.
    url: https://wetten.overheid.nl/BWBR0005627/2006-04-01#Artikel4
  - number: 4a
    text: |-
      Met betrekking tot drukvaten worden geen markeringen gebezigd, die derden kunnen misleiden omtrent de betekenis
      of grafische vorm van de CE-markering. Op de drukvaten worden slechts andere markeringen aangebracht als de
      zichtbaarheid en de leesbaarheid van de CE-markering niet worden verminderd.
    url: https://wetten.overheid.nl/BWBR0005627/2006-04-01#Artikel4a
  - number: '5'
    text: |-
      Een drukvat dat in overeenstemming is met de door Onze Minister aangewezen, geharmoniseerde normen, wordt in
      zoverre vermoed te voldoen aan [artikel 4, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005627#Artikel4
    url: https://wetten.overheid.nl/BWBR0005627/2006-04-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005627
        artikel: '4'
        hoofdstuk: II
  - number: '6'
    text: |-
      Alvorens over te gaan tot de vervaardiging van een drukvat waarvan het product PS.V groter is dan 50 bar.l, zal
      de fabrikant of diens in een van de staten, die partij is bij de Overeenkomst betreffende de Europese Economische
      Ruimte, gevestigde gevolmachtigde:
    url: https://wetten.overheid.nl/BWBR0005627/2006-04-01#Artikel6
  - number: 6.a
    text: |-
      wanneer wordt vervaardigd overeenkomstig de in [artikel 5][ref1] bedoelde normen,


      [ref1]: https://wetten.overheid.nl/BWBR0005627#Artikel5
    url: https://wetten.overheid.nl/BWBR0005627/2006-04-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005627
        artikel: '5'
        hoofdstuk: II
  - number: 6.a.1e
    text: |-
      van het voornemen om tot vervaardiging over te gaan mededeling doen en het technisch constructiedossier, bedoeld in
      punt 3 van bijlage II van de richtlijn, verschaffen aan een aangewezen aangemelde instelling die een verklaring van
      geschiktheid van dit dossier opstelt, of
    url: https://wetten.overheid.nl/BWBR0005627/2006-04-01#Artikel6
  - number: 6.a.2e
    text: een model van het drukvat laten onderwerpen aan het in artikel 10 van de richtlijn bedoelde EG-typeonderzoek;
    url: https://wetten.overheid.nl/BWBR0005627/2006-04-01#Artikel6
  - number: 6.b
    text: |-
      wanneer de in [artikel 5][ref1] bedoelde normen niet of slechts ten dele in acht worden genomen, een model van het
      drukvat laten onderwerpen aan het in artikel 10 van de richtlijn bedoelde EG-typeonderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0005627#Artikel5
    url: https://wetten.overheid.nl/BWBR0005627/2006-04-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005627
        artikel: '5'
        hoofdstuk: II
  - number: '7.1'
    text: |-
      Een drukvat, dat overeenkomstig de in [artikel 5][ref1], bedoelde normen of overeenkomstig het goedgekeurde model
      is vervaardigd, ondergaat een keuring als genoemd in het tweede of derde lid, tenzij het produkt PS.V kleiner is
      dan, of gelijk is aan 50 bar.l.


      [ref1]: https://wetten.overheid.nl/BWBR0005627#Artikel5
    url: https://wetten.overheid.nl/BWBR0005627/2006-04-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005627
        artikel: '5'
        hoofdstuk: II
  - number: '7.2'
    text: |-
      Een drukvat waarvan het produkt PS.V groter is dan 3000 bar.l wordt onderworpen aan de EG-keuring, bedoeld in
      artikel 11 van de richtlijn.
    url: https://wetten.overheid.nl/BWBR0005627/2006-04-01#Artikel7
  - number: '7.3'
    text: |-
      Een drukvat waarvan het produkt PS.V ten hoogste gelijk is aan 3000 bar.l en groter dan 50 bar.l wordt naar keuze
      van de fabrikant onderworpen aan:
    url: https://wetten.overheid.nl/BWBR0005627/2006-04-01#Artikel7
  - number: 7.3.a
    text: de procedure van de EG-verklaring van overeenstemming, bedoeld in artikel 12, eerste lid, van de richtlijn, of
    url: https://wetten.overheid.nl/BWBR0005627/2006-04-01#Artikel7
  - number: 7.3.b
    text: de EG-keuring, bedoeld in artikel 11 van de richtlijn.
    url: https://wetten.overheid.nl/BWBR0005627/2006-04-01#Artikel7
  - number: '8'
    text: |-
      Een EG-typeverklaring kan door de door Onze Minister aangewezen aangemelde instelling, die haar heeft afgegeven,
      worden ingetrokken, indien is vastgesteld dat de CE-markering ten onrechte op de betrokken drukvaten is
      aangebracht.
    url: https://wetten.overheid.nl/BWBR0005627/2006-04-01#Artikel8
  - number: '9.1'
    text: |-
      De fabrikant, die gebruik maakt van de in [artikel 7, derde lid, onder ][ref1], genoemde procedure van de EG-
      verklaring van overeenstemming zal:


      [ref1]: https://wetten.overheid.nl/BWBR0005627#Artikel7
    url: https://wetten.overheid.nl/BWBR0005627/2006-04-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005627
        artikel: '7'
        hoofdstuk: III
  - number: 9.1.a
    text: |-
      alvorens over te gaan tot fabricage aan de aangewezen aangemelde instelling die de EG-typeverklaring of de
      verklaring van geschiktheid heeft afgegeven, een document met betrekking tot de produktielijnbewaking verstrekken,
      dat voldoet aan de eisen die artikel 13, eerste lid, van de richtlijn daaraan stelt en
    url: https://wetten.overheid.nl/BWBR0005627/2006-04-01#Artikel9
  - number: 9.1.b
    text: vervolgens conform dit document handelen en hiervan verslag uit te brengen aan voornoemde instelling.
    url: https://wetten.overheid.nl/BWBR0005627/2006-04-01#Artikel9
  - number: '9.2'
    text: |-
      Ingeval drukvaten worden vervaardigd, waarvan het produkt PS.V groter is dan 200 bar.l, zal de in het eerste lid
      genoemde fabrikant aan de aangewezen aangemelde instelling:
    url: https://wetten.overheid.nl/BWBR0005627/2006-04-01#Artikel9
  - number: 9.2.a
    text: |-
      toegang verschaffen tot de plaatsen van fabricage en opslag opdat deze kan controleren of de fabrikant het bepaalde
      in artikel 13, eerste lid, van de richtlijn inachtneemt;
    url: https://wetten.overheid.nl/BWBR0005627/2006-04-01#Artikel9
  - number: 9.2.b
    text: de gelegenheid bieden drukvaten te bemonsteren;
    url: https://wetten.overheid.nl/BWBR0005627/2006-04-01#Artikel9
  - number: 9.2.c
    text: |-
      alle noodzakelijke inlichtingen, alsmede de documenten en dossiers, bedoeld in artikel 13, tweede lid, van de
      richtlijn, verstrekken.
    url: https://wetten.overheid.nl/BWBR0005627/2006-04-01#Artikel9
  - number: '10.1'
    text: |-
      Een drukvat gaat vergezeld van de in punt 2 van bijlage II van de richtlijn genoemde, door de fabrikant opgestelde
      handleiding.
    url: https://wetten.overheid.nl/BWBR0005627/2006-04-01#Artikel10
  - number: '10.2'
    text: Degene die een drukvat verhandelt of gebruikt zorgt ervoor dat dit in goede staat van onderhoud verkeert.
    url: https://wetten.overheid.nl/BWBR0005627/2006-04-01#Artikel10
  - number: '10.3'
    text: |-
      Een drukvat wordt op passende wijze geïnstalleerd en wordt niet voor een ander doel gebruikt dan waarvoor het
      bestemd is.
    url: https://wetten.overheid.nl/BWBR0005627/2006-04-01#Artikel10
  - number: '11.1'
    text: 'Als aangewezen aangemelde instelling kan worden aangewezen een instelling die:'
    url: https://wetten.overheid.nl/BWBR0005627/2006-04-01#Artikel11
  - number: 11.1.a
    text: rechtspersoonlijkheid heeft;
    url: https://wetten.overheid.nl/BWBR0005627/2006-04-01#Artikel11
  - number: 11.1.b
    text: haar zetel of een vestiging in Nederland heeft;
    url: https://wetten.overheid.nl/BWBR0005627/2006-04-01#Artikel11
  - number: 11.1.c
    text: |-
      onafhankelijk is van degenen die bij het resultaat van de uitvoering van de taken waarvoor zij is aangewezen belang
      hebben;
    url: https://wetten.overheid.nl/BWBR0005627/2006-04-01#Artikel11
  - number: 11.1.d
    text: |-
      beschikt over voldoende deskundigheid en outillage om de uitvoering van de taken waarvoor zij is aangewezen, naar
      behoren te kunnen vervullen;
    url: https://wetten.overheid.nl/BWBR0005627/2006-04-01#Artikel11
  - number: 11.1.e
    text: |-
      beschikt over een behoorlijke administratie waarin de gegevens die samenhangen met en betrekking hebben op de
      uitvoering van haar taken, op een systematische wijze zijn vastgelegd. Aan de hand van deze gegevens zijn de
      gekeurde drukvaten afdoende te identificeren;
    url: https://wetten.overheid.nl/BWBR0005627/2006-04-01#Artikel11
  - number: 11.1.f
    text: naar behoren functioneert.
    url: https://wetten.overheid.nl/BWBR0005627/2006-04-01#Artikel11
  - number: '11.2'
    text: |-
      In aanvulling op het eerste lid komen voor een aanwijzing als aangewezen aangemelde instelling slechts in
      aanmerking instellingen die ten minste voldoen aan de in bijlage III van de richtlijn neergelegde voorwaarden.
    url: https://wetten.overheid.nl/BWBR0005627/2006-04-01#Artikel11
  - number: '11.3'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0005627/2006-04-01#Artikel11
  - number: '12'
    text: |-
      De instelling verstrekt jaarlijks aan Onze Minister een afschrift van de polis van de afgesloten verzekering tegen
      wettelijke aansprakelijkheid tegen alle risico's die voortvloeien uit de uitoefening van de taken waarvoor zij
      is aangewezen.
    url: https://wetten.overheid.nl/BWBR0005627/2006-04-01#Artikel12
  - number: '13.1'
    text: |-
      Indien een wijziging plaatsvindt in de gegevens op grond waarvan de instelling is aangewezen, doet de instelling
      hiervan terstond mededeling aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0005627/2006-04-01#Artikel13
  - number: '13.2'
    text: |-
      Indien een instelling voornemens is een of meer van de taken waarvoor zij is aangewezen, te beëindigen, doet de
      instelling hiervan terstond mededeling aan Onze Minister en de certificaathouders. In dat geval worden door de
      instelling de gegevens, bedoeld in [artikel 11, eerste lid, onder e][ref1], overgedragen aan Onze Minister dan
      wel, na toestemming van Onze Minister en de certificaathouders, een andere instelling die voor dezelfde taken is
      aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0005627#Artikel11
    url: https://wetten.overheid.nl/BWBR0005627/2006-04-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0005627
        artikel: '11'
        hoofdstuk: V
  - number: 13a.1
    text: |-
      Een aanvraag om aanwijzing gaat vergezeld van het bewijs dat is voldaan aan de criteria, bedoeld in
      [artikel 11, eerste lid][ref1], dan wel in geval van [artikel 11, tweede lid][ref2], tevens van bewijs dat is
      voldaan aan de voorwaarden, bedoeld in dat lid, dan wel van een verklaring waaruit de bereidheid blijkt om voor
      eigen rekening een onderzoek naar het voldoen aan deze criteria dan wel voorwaarden te ondergaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005627#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0005627#Artikel11
    url: https://wetten.overheid.nl/BWBR0005627/2006-04-01#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0005627
        artikel: '11'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0005627
        artikel: '11'
        hoofdstuk: V
  - number: 13a.2
    text: |-
      Een aanwijzing kan worden geweigerd, dan wel worden gewijzigd of ingetrokken, indien niet of niet volledig is
      voldaan aan de bij de wet of bij of krachtens dit besluit gestelde voorschriften. Een aanwijzing kan worden
      ingetrokken indien de instelling gedurende een aaneengesloten periode van twee jaar geen werkzaamheden, waarvoor
      zij is aangewezen, heeft uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0005627/2006-04-01#Artikel13a
  - number: 13a.3
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0005627/2006-04-01#Artikel13a
  - number: '14'
    text: |-
      Een wijziging van één van de artikelen of bijlagen van de richtlijn waarnaar in dit besluit wordt verwezen, treedt
      voor de toepassing van de bij of krachtens dit besluit gestelde regels in werking met ingang van de dag waarop aan
      de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven.
    url: https://wetten.overheid.nl/BWBR0005627/2006-04-01#Artikel14
  - number: '16.1'
    text: |-
      De verboden, gesteld in [artikel 3a][ref1], gelden tot 1 juli 2017 niet voor het voorhanden hebben of gebruiken van
      drukvaten die voldoen aan de wettelijke voorschriften zoals die luidden op de dag voor de inwerkingtreding van dit
      besluit en voor de dag van inwerkingtreding van dit besluit in bedrijf zijn gesteld of in de handel zijn gebracht,
      behoudens:


      [ref1]: https://wetten.overheid.nl/BWBR0005627#Artikel3a
    url: https://wetten.overheid.nl/BWBR0005627/2006-04-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0005627
        artikel: 3a
        hoofdstuk: IA
  - number: 16.1.a
    text: indien zij na dat tijdstip een ingrijpende wijziging of reparatie hebben ondergaan;
    url: https://wetten.overheid.nl/BWBR0005627/2006-04-01#Artikel16
  - number: 16.1.b
    text: indien zij zijn voorzien van een merk van afkeuring;
    url: https://wetten.overheid.nl/BWBR0005627/2006-04-01#Artikel16
  - number: 16.1.c
    text: indien zij niet ouder zijn dan 25 jaar.
    url: https://wetten.overheid.nl/BWBR0005627/2006-04-01#Artikel16
  - number: '16.2'
    text: De in het eerste lid genoemde termijn kan door Onze Minister worden verlengd.
    url: https://wetten.overheid.nl/BWBR0005627/2006-04-01#Artikel16
  - number: 16a
    text: |-
      Dit besluit berust op de [artikelen 1][ref1], [3 tot en met 11][ref2], [11a][ref3], [13][ref4], [14][ref5],
      [16][ref6] en [32b, eerste lid, van de wet][ref7].


