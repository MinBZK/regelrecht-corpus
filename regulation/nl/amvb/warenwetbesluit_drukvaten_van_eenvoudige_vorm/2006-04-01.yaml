  - number: '17'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het *Staatsblad* waarin het wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0005627/2006-04-01#Artikel17
  - number: '18'
    text: Dit besluit kan worden aangehaald als Warenwetbesluit drukvaten van eenvoudige vorm.
    url: https://wetten.overheid.nl/BWBR0005627/2006-04-01#Artikel18
