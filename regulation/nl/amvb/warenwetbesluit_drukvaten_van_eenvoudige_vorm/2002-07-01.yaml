        artikel: '5'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0002087
  - number: '2'
    text: |-
      Als gevaarlijke werktuigen, bedoeld in [artikel 1, eerste lid, onderdeel ][ref1], van de wet worden aangewezen
      drukvaten.


      [ref1]: https://wetten.overheid.nl/BWBR0002087#Artikel1
    url: https://wetten.overheid.nl/BWBR0005627/2002-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002087
        artikel: '1'
  - number: '3'
    text: >-
      Dit besluit is niet van toepassing op:


      a. drukvaten speciaal ontworpen voor nucleair gebruik, die bij defecten het verspreiden van radioactiviteit kunnen
      veroorzaken;


      b. drukvaten die speciaal bestemd zijn voor installatie in of voor voortstuwing van schepen en luchtvaartuigen;


      c. brandblusapparaten.
    url: https://wetten.overheid.nl/BWBR0005627/2002-07-01#Artikel3
  - number: '4'
    text: >-
      1 Een drukvat dient zodanig te zijn vervaardigd en zodanige eigenschappen te hebben alsmede van zodanige kentekenen
      te zijn voorzien, dat het bij gebruik overeenkomstig zijn bestemming geen gevaar oplevert voor de veiligheid of de
      gezondheid van personen, huisdieren of goederen.


      2 Een drukvat, waarvan het produkt PS.V groter is dan 50 bar.1, voldoet aan de in bijlage I van de richtlijn
      vermelde essentiële veiligheidsvoorschriften en is voorzien van de in artikel 16 van de richtlijn bedoelde CE-
      markering en van de in punt 1, onderdeel B van bijlage II van de richtlijn bedoelde opschriften.


      3 Een drukvat waarvan het produkt PS.V ten hoogste 50 bar.l is, moet vervaardigd zijn volgens de ter zake in een
      van de lidstaten van de Europese Unie of in een andere Staat, die partij is bij de Overeenkomst betreffende de
      Europese Economische Ruimte geldende regelen van goed vakmanschap en voorzien zijn van de in punt 1 van bijlage
      II van de richtlijn bedoelde opschriften, met uitzondering van de in artikel 16 van de richtlijn bedoelde CE-
      markering.


      4 Een drukvat dat met inachtneming van de procedures, genoemd in dit artikel, is voorzien van de CE-markering,
      wordt vermoed te voldoen aan het tweede lid.
    url: https://wetten.overheid.nl/BWBR0005627/2002-07-01#Artikel4
  - number: 4a
    text: >-
      Met betrekking tot drukvaten worden geen markeringen gebezigd, die derden kunnen misleiden omtrent de betekenis of
      grafische vorm van de CE-markering. Op de drukvaten mogen andere markeringen worden aangebracht op voorwaarde dat
      de zichtbaarheid en de leesbaarheid van de CE-markering niet worden verminderd.
    url: https://wetten.overheid.nl/BWBR0005627/2002-07-01#Artikel4a
  - number: '5'
    text: |-
      Een drukvat dat in overeenstemming is met de door Onze Minister aangewezen, geharmoniseerde normen, wordt in
      zoverre vermoed te voldoen aan [artikel 4, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005627#Artikel4
    url: https://wetten.overheid.nl/BWBR0005627/2002-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005627
        artikel: '4'
        hoofdstuk: II
  - number: '6'
    text: |-
      Alvorens over te gaan tot de vervaardiging van een drukvat waarvan het produkt PS.V groter is dan 50 bar.l, dient
      de fabrikant of diens in de Gemeenschap of in een van de Staten, die partij zijn bij de Overeenkomst betreffende de
      Europese Economische Ruimte gevestigde gevolmachtigde:

      a. wanneer wordt vervaardigd overeenkomstig de in [artikel 5][ref1], bedoelde normen,

      1e. van het voornemen om tot vervaardiging over te gaan mededeling te doen en het technisch constructiedossier,
      bedoeld in punt 3 van bijlage II van de richtlijn, te verschaffen aan een keuringsinstantie, die een verklaring van
      geschiktheid van dit dossier opstelt, of

      2e. een model van het drukvat te laten onderwerpen aan het in artikel 10 van de richtlijn bedoelde EG-
      typeonderzoek.

      b. wanneer de in [artikel 5][ref2], bedoelde normen, niet of slechts ten dele in acht worden genomen, een model van
      het drukvat te laten onderwerpen aan het in artikel 10 van de richtlijn bedoelde EG-typeonderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0005627#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005627#Artikel5
    url: https://wetten.overheid.nl/BWBR0005627/2002-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005627
        artikel: '5'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0005627
        artikel: '5'
        hoofdstuk: II
  - number: '7'
    text: |-
      1 Een drukvat, dat overeenkomstig de in [artikel 5][ref1], bedoelde normen of overeenkomstig het goedgekeurde model
      is vervaardigd, moet een keuring ondergaan als genoemd in het tweede of derde lid, tenzij het produkt PS.V kleiner
      is dan, of gelijk is aan 50 bar.l.

      2 Een drukvat waarvan het produkt PS.V groter is dan 3000 bar.l dient te worden onderworpen aan de EG-keuring,
      bedoeld in artikel 11 van de richtlijn.

      3 Een drukvat waarvan het produkt PS.V ten hoogste gelijk is aan 3000 bar.l en groter dan 50 bar.l dient naar keuze
      van de fabrikant te worden onderworpen aan:

      a. de procedure van de EG-verklaring van overeenstemming, bedoeld in artikel 12, eerste lid, van de richtlijn, of

      b. de EG-keuring, bedoeld in artikel 11 van de richtlijn.


      [ref1]: https://wetten.overheid.nl/BWBR0005627#Artikel5
    url: https://wetten.overheid.nl/BWBR0005627/2002-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005627
        artikel: '5'
        hoofdstuk: II
  - number: '8'
    text: >-
      Een EG-typeverklaring kan door de door Onze Minister aangewezen keuringsinstantie, die haar heeft afgegeven, worden
      ingetrokken, indien is vastgesteld dat de CE-markering ten onrechte op de betrokken drukvaten is aangebracht.
    url: https://wetten.overheid.nl/BWBR0005627/2002-07-01#Artikel8
  - number: '9'
    text: |-
      1 De fabrikant, die gebruik maakt van de in [artikel 7, derde lid, onder ][ref1], genoemde procedure van de EG-
      verklaring van overeenstemming dient:

      a. alvorens over te gaan tot fabricage aan de keuringsinstantie die de EG-typeverklaring of de verklaring van
      geschiktheid heeft afgegeven, een document met betrekking tot de produktielijnbewaking te verstrekken, dat voldoet
      aan de eisen die artikel 13, eerste lid, van de richtlijn daaraan stelt en

      b. vervolgens conform dit document te handelen en hiervan verslag uit te brengen aan voornoemde instantie.

      2 Ingeval drukvaten worden vervaardigd, waarvan het produkt PS.V groter is dan 200 bar.l, moet de in het eerste lid
      genoemde fabrikant aan de keuringsinstantie:

      a. toegang verschaffen tot de plaatsen van fabricage en opslag opdat deze kan controleren of de fabrikant het
      bepaalde in artikel 13, eerste lid, van de richtlijn inachtneemt;

      b. de gelegenheid bieden drukvaten te bemonsteren;

      c. alle noodzakelijke inlichtingen, alsmede de documenten en dossiers, bedoeld in artikel 13, tweede lid, van de
      richtlijn, verstrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0005627#Artikel7
    url: https://wetten.overheid.nl/BWBR0005627/2002-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005627
        artikel: '7'
        hoofdstuk: III
  - number: '10'
    text: >-
      1 Een drukvat moet vergezeld gaan van de in punt 2 van bijlage II van de richtlijn genoemde, door de fabrikant
      opgestelde handleiding.


      2 Degene die een drukvat voorhanden heeft, aflevert, tentoonstelt of gebruikt is verplicht ervoor te zorgen dat dit
      in goede staat van onderhoud verkeert.


      3 Een drukvat dient op passende wijze te zijn geïnstalleerd en mag niet voor een ander doel worden gebruikt dan
      waarvoor het bestemd is.
    url: https://wetten.overheid.nl/BWBR0005627/2002-07-01#Artikel10
  - number: '11'
    text: |-
      1 Het is verboden een op een drukvat aangebracht merk van afkeuring te verwijderen, te beschadigen of onleesbaar
      te maken.

      2 Het in het eerste lid gestelde verbod geldt niet ten aanzien van ambtenaren die ingevolge
      [artikel 12, eerste lid, eerste zin][ref1], van de wet ten aanzien van drukvaten een eenvoudige vorm aangewezen
      zijn.

      3 Onze Minister kan ten aanzien van merken van afkeuring nadere bepalingen vaststellen.


      [ref1]: https://wetten.overheid.nl/BWBR0005627#Artikel12
    url: https://wetten.overheid.nl/BWBR0005627/2002-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0005627
        artikel: '12'
        hoofdstuk: V
  - number: '12'
    text: >-
      1 Indien bepaalde van een CE-markering voorziene en overeenkomstig hun bestemming gebruikte drukvaten naar
      het oordeel van Onze Minister gevaar opleveren voor de veiligheid of de gezondheid van personen, huisdieren
      of goederen, kan hij de fabrikant of diens in de Gemeenschap of in een van de Staten, die partij zijn bij de
      Overeenkomst betreffende de Europese Economische Ruimte gevestigde gevolmachtigde gelasten om de bezitters dan
      wel de vermoedelijke bezitters van die drukvaten onverwijld en op doeltreffende wijze op de hoogte te stellen van
      het gevaar.


      2 Indien de fabrikant of de gevolmachtigde de krachtens het eerste lid gelaste maatregelen niet onverwijld of
      niet op doeltreffende wijze uitvoert, kan Onze Minister bedoelde maatregelen op kosten van de fabrikant of de
      gevolmachtigde treffen.


      3 Onze Minister geeft van een krachtens dit artikel genomen maatregel en van de intrekking daarvan onverwijld
      kennis aan de betrokkenen, aan de Europese Commissie en in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0005627/2002-07-01#Artikel12
  - number: '13'
    text: |-
      1 Indien Onze Minister constateert dat bepaalde drukvaten, die voorzien zijn van een CE-markering en overeenkomstig
      hun bestemming worden gebruikt, gevaar opleveren voor de veiligheid of gezondheid van personen, huisdieren, of
      goederen, kan hij:

      a. een verbod uitvaardigen tot het vervaardigen, het in Nederland invoeren, het verhandelen en het afleveren van
      die drukvaten;

      b. de fabrikant of diens in de Gemeenschap of in een van de Staten, die partij zijn bij de Overeenkomst betreffende
      de Europese Economische Ruimte gevestigde gevolmachtigde verplichten om overeenkomstig de daarbij gegeven
      aanwijzingen passende maatregelen te nemen om die drukvaten zoveel mogelijk uit de handel te nemen.

      2 Onze Minister neemt een maatregel krachtens het eerste lid in overeenstemming met Onze Ministers wie het mede
      aangaat.

      3 [Artikel 12, derde lid][ref1], is van overeenkomstige toepassing.

      4 Een gedraging in strijd met een krachtens het eerste lid genomen maatregel is verboden.


      [ref1]: https://wetten.overheid.nl/BWBR0005627#Artikel12
    url: https://wetten.overheid.nl/BWBR0005627/2002-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0005627
        artikel: '12'
        hoofdstuk: V
  - number: '14'
    text: >-
      Indien één van de artikelen of de bijlagen van de richtlijn, waarnaar in dit besluit wordt verwezen, wordt
      gewijzigd, maakt Onze Minister dit bekend in de *Staatscourant*; hij vermeldt daarbij met ingang van welke datum en
      met betrekking tot welke drukvaten de wijziging moet worden toegepast.
    url: https://wetten.overheid.nl/BWBR0005627/2002-07-01#Artikel14
  - number: '15'
    text: |-
      Voor aanwijzing als keuringsinstantie krachtens [artikel 5][ref1] van de wet komen slechts in aanmerking die
      instanties die in elk geval voldoen aan de in bijlage III van de richtlijn neergelegde voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0005627#Artikel5
    url: https://wetten.overheid.nl/BWBR0005627/2002-07-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005627
        artikel: '5'
        hoofdstuk: II
  - number: '16'
    text: |-
      1 Het verbod, gesteld in [artikel 10, derde lid][ref1], van de wet, geldt tot 1 juli 2002 niet voor het voorhanden
      hebben of gebruiken van drukvaten, welke vóór het tijdstip van inwerkingtreding van dit besluit in bedrijf zijn
      gesteld of in de handel zijn gebracht, behoudens,

      a. indien zij na dat tijdstip een ingrijpende wijziging of reparatie hebben ondergaan,

      b. indien zij zijn voorzien van een merk van afkeuring.

      2 De in het eerste lid genoemde termijn kan door Onze Minister worden verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0005627#Artikel10
    url: https://wetten.overheid.nl/BWBR0005627/2002-07-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0005627
        artikel: '10'
        hoofdstuk: IV
  - number: '17'
    text: >-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het *Staatsblad* waarin het wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0005627/2002-07-01#Artikel17
  - number: '18'
    text: Dit besluit kan worden aangehaald als Besluit drukvaten van eenvoudige vorm.
    url: https://wetten.overheid.nl/BWBR0005627/2002-07-01#Artikel18
