preamble:
  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Op de voordracht van Onze Minister van Sociale Zaken en Werkgelegenheid van 9 april 1992, Directoraat-Generaal van
    de Arbeid, Afdeling Wetgeving en Juridische Zaken, nr. DGA/AIB/WJZ/92/4989;


    Overwegende dat regels dienen te worden gesteld ter uitvoering van de Richtlijn van de Raad van de Europese
    Gemeenschappen van 25 juni 1987 betreffende de onderlinge aanpassing van de wetgevingen van de Lid-Staten inzake
    drukvaten van eenvoudige vorm (87/404/EEG, PbEG 1987, L220/48);


    Gelet op de artikelen 1, eerste lid, onder a, 2, 3, eerste en tweede lid, 4, derde lid, 6, 12, derde lid, 24 en 25a
    van de Wet op de gevaarlijke werktuigen (Stb. 1952, 104);


    De Raad van State gehoord (advies van 24 juni 1992, No. W12.92.0157);


    Gezien het nader rapport van Onze Minister van Sociale Zaken en Werkgelegenheid van 12 augustus 1992, Directoraat-
    Generaal van de Arbeid, Afdeling Wetgeving en Juridische Zaken, nr. DGA/AIB/WJZ/92/10728;


    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0005627/2002-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. drukvat: een in serie vervaardigd gelast drukvat van eenvoudige vorm met een inwendige overdruk van meer dan
      0,5 bar,

      1e. dat ertoe bestemd is lucht, dan wel stikstof te bevatten en

      2e. dat niet bestemd is om aan vlambelasting te worden onderworpen en

      3e. waarvan de delen en verbindingen die van belang zijn voor de sterkte van het drukvat zijn vervaardigd
      uit niet-gelegeerd kwaliteitsstaal dan wel uit niet-gelegeerd aluminium of geen dispersieharding vertonende
      aluminiumlegeringen en

      4e. dat bestaat uit:

      - een cilindrisch gedeelte met een cirkelvormige dwarsdoorsnede, afgesloten door gewelfde bodems met de holle zijde
      naar binnen of door platte bodems, welke bodems een zelfde omwentelingsas hebben als het cilindrisch gedeelte, of
      - twee gewelfde bodems met een zelfde omwentelingsas en

      5e. waarvan de maximale bedrijfsdruk ten hoogste gelijk is aan 30 bar en het produkt van deze druk en de inhoud van
      het vat (PS.V) niet groter is dan 10.000 bar.l en

      6e. waarvan de minimale bedrijfstemperatuur niet lager is dan -50°C en de maximale bedrijfstemperatuur niet hoger
      is dan 300° C bij een drukvat van staal en 100° C bij een drukvat van aluminium of aluminiumlegeringen;

      b. de Gemeenschap: de gebieden waarop het Verdrag betreffende de Europese Unie van toepassing is;

      c. richtlijn: de Richtlijn van de Raad van de Europese Gemeenschappen van 25 juni 1987 betreffende de onderlinge
      aanpassing van de wetgevingen van de Lid-Staten inzake drukvaten van eenvoudige vorm (87/404/EEG, *PbEG* 1987,
      L 220/48);

      d. keuringsinstantie: een ingevolge [artikel 5, eerste lid][ref1], van de wet, met betrekking tot drukvaten
      van eenvoudige vorm aangewezen dienst, instelling, onderneming of onderzoeksbureau, dan wel een door de andere
      lidstaten van de Europese Unie in het kader van de richtlijn aangemelde instantie;

      e. wet: [Wet op de gevaarlijke werktuigen][ref2] (*Stb.* 1952, 104);

      f. Onze Minister: Onze Minister van Sociale Zaken en Werkgelegenheid.


      [ref1]: https://wetten.overheid.nl/BWBR0005627#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0002087
    url: https://wetten.overheid.nl/BWBR0005627/2002-07-01#Artikel1
    references:
      - id: ref1
