  - number: '237'
    text: >-
      Een commissie wordt ingesteld door de besturen van de bijzondere instellingen waarover zij haar werkkring zal
      uitstrekken. De commissie deelt Onze Minister mee, welke instellingen bij haar zijn aangesloten.
    url: https://wetten.overheid.nl/BWBR0015136/2014-01-01#Artikel237
  - number: '238'
    text: >-
      1 Met inachtneming van de in het tweede tot en met het zesde lid van dit artikel neergelegde voorschriften
      geschiedt de verkiezing van de commissie aan de hand van een door de besturen van de instellingen op te stellen
      verkiezingsregeling.


      2 De commissie bestaat uit 5 leden en 5 plaatsvervangende leden, waarvan 2 leden en 2 plaatsvervangende leden
      worden gekozen door de instellingsbesturen, en 2 leden en 2 plaatsvervangende leden door het personeel van de bij
      de commissie aangesloten instellingen. De 2 leden gekozen door de instellingsbesturen en de 2 leden gekozen door
      het personeel van de instelling kiezen gezamenlijk het vijfde lid, tevens voorzitter, en zijn plaatsvervanger.


      Bij staking van stemmen beslist het lot, desgewenst na herstemming, tenzij partijen een arbitraire oplossing
      aanvaarden.


      3 Om de 3 jaar treedt één van de door de instellingsbesturen en één van de door het personeel gekozen leden en
      plaatsvervangende leden af volgens een door de commissie op te stellen rooster.


      4 De voorzitter en de plaatsvervangend voorzitter worden gekozen voor de tijd van 3 jaar.


      5 De voorzitter en de plaatsvervangend voorzitter en de overige leden en plaatsvervangende leden zijn bij aftreden
      onmiddellijk herkiesbaar.


      6 In een opengevallen plaats wordt binnen 6 weken voorzien.
    url: https://wetten.overheid.nl/BWBR0015136/2014-01-01#Artikel238
  - number: '239'
    text: |-
      1 Voorzitter, plaatsvervangend voorzitter, lid en plaatsvervangend lid van een commissie kan niet zijn hij die:

      a. zitting heeft in of in dienst is van het instellingsbestuur of het bestuur van een vereniging van
      instellingsbesturen, of deel uitmaakt van het personeel van een instelling waarover de commissie waarvan hij deel
      uitmaakt, haar werkkring uitstrekt;

      b. in dienst is van een vereniging van onderwijzend personeel dan wel zitting heeft in een bestuur
      van een vereniging als bedoeld in [ artikel 64 van de Wet op het primair onderwijs][ref1] of
      [artikel 66 van de Wet op de expertisecentra][ref2], waarvan het lidmaatschap open staat voor personeel van
      instellingen waarvoor de commissie waarvan hij deel uitmaakt, is ingesteld;

      c. deel uitmaakt van de rijksinspectie.

      2 Voorzitter en plaatsvervangend voorzitter kan slechts zijn hij die de hoedanigheid van meester in de rechten
      heeft verkregen op grond van een met goed gevolg afgelegd doctoraal examen in het Nederlands recht aan een
      Nederlandse universiteit of hogeschool.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel64
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel66
    url: https://wetten.overheid.nl/BWBR0015136/2014-01-01#Artikel239
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '64'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '66'
  - number: '240'
    text: >-
      1 Zodra hij verkozen is, geeft de voorzitter aan Onze Minister en aan de bij de commissie aangesloten
      instellingsbesturen onverwijld kennis van de samenstelling van de commissie, onder vermelding van zijn adres en
      eventuele andere gegevens die hij van belang acht.


      2 Wijziging van deze gegevens deelt de voorzitter onverwijld eveneens mee.
    url: https://wetten.overheid.nl/BWBR0015136/2014-01-01#Artikel240
  - number: '241'
    text: >-
      1 De commissie legt binnen 6 maanden na haar verkiezing de regeling van haar werkzaamheden vast in een
      huishoudelijk reglement en voorziet daarin in haar secretariaat.


      2 De voorzitter brengt dit reglement, alsmede wijzigingen daarvan, ter kennis van Onze Minister en van de bij de
      commissie aangesloten instellingsbesturen.
    url: https://wetten.overheid.nl/BWBR0015136/2014-01-01#Artikel241
  - number: '242'
    text: |-
      1 Het instellingsbestuur draagt er zorg voor, dat een kennisgeving van de samenstelling van de commissie waarbij de
      instelling is aangesloten en van het adres van de voorzitter, alsmede een exemplaar van het huishoudelijk reglement
      van de commissie steeds op een voor de betrokkene toegankelijke plaats in de instelling ter inzage beschikbaar
      zijn.

      2 Deze kennisgeving en dit huishoudelijk reglement worden steeds onverwijld aangepast aan de wijzigingen, bedoeld
      in [artikel 240, tweede lid][ref1], en [artikel 241, tweede lid][ref2].

      3 Stukken die moeten worden ingediend bij de voorzitter of de commissie, kunnen worden toegezonden aan het bekend
      gemaakte kantooradres van de secretaris.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel240
      [ref2]: https://wetten.overheid.nl/BWBR0015136#Artikel241
    url: https://wetten.overheid.nl/BWBR0015136/2014-01-01#Artikel242
