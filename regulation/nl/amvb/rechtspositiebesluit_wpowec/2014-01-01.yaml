preamble:
  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Op de voordracht van Onze Minister van Onderwijs, Cultuur en Wetenschappen van 12 februari 2002, nr. WJZ 2002/5881
    (2908), directie Wetgeving en Juridische Zaken, gedaan na overleg met Onze Minister van Volksgezondheid, Welzijn en
    Sport en Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties;


    Gelet op de artikelen 33, tweede lid,64, 120, 123 en 185 van de Wet op het primair onderwijs, de artikelen 33,
    tweede lid, 66, 117 en 120 van de Wet op de expertisecentra, de artikelen 38a, tweede lid, 153, tweede lid, 184,
    233 en 235 van de Wet op het voortgezet onderwijs, de artikelen 3, eerste en negende lid, 5, derde lid, en 18 van
    de Ziekenfondswet en de artikelen 125, eerste lid, en 134 van de Ambtenarenwet;


    De Raad van State gehoord (advies van 29 maart 2002, nr. WO5.02.0075/III);


    Gezien het nader rapport van Onze Minister van Onderwijs, Cultuur en Wetenschappen van 21 mei 2003, nr.
    WJZ/2003/10861 (2908);


    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0015136/2014-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. Onze Minister: Onze Minister van Onderwijs, Cultuur en Wetenschappen;

      b. tijdelijke dienst: het dienstverband van bepaalde duur;

      c. vaste dienst: het dienstverband van onbepaalde duur;

      d. instelling:

      1°. een openbare of uit de openbare kas bekostigde bijzondere basisschool of speciale school voor basisonderwijs in
      de zin van de [Wet op het primair onderwijs][ref1];

      2°. een openbare of uit de openbare kas bekostigde bijzondere instelling voor speciaal onderwijs, zijnde een school
      voor speciaal onderwijs, voortgezet speciaal onderwijs dan wel speciaal en voortgezet speciaal onderwijs in de zin
      van de [Wet op de expertisecentra][ref2];

      3°. een centrale dienst als bedoeld in [artikel 68 van de Wet op het primair onderwijs][ref3] of
      [artikel 69 van de Wet op de expertisecentra][ref4];

      e. betrokkene:

      1°. een lid van het personeel dat door een bevoegd gezag is benoemd ten behoeve van het verrichten van
      werkzaamheden aan door het bevoegd gezag in stand gehouden instellingen als bedoeld in onderdeel d, onder 1°;

      2°. een lid van het personeel dat door een bevoegd gezag is benoemd ten behoeve van het verrichten van
      werkzaamheden aan door het bevoegd gezag in stand gehouden instellingen als bedoeld in onderdeel d, onder 2°;

      3°. een lid van het personeel dat door een bevoegd gezag is benoemd ten behoeve van het verrichten van
      werkzaamheden aan door het bevoegd gezag in stand gehouden instellingen als bedoeld in onderdeel d, onder 3°;

      f. bevoegd gezag:

      1°. ten aanzien van de instellingen genoemd in onderdeel d, onder 1° of 2° voor wat betreft:

      - een openbare of uit de openbare kas bekostigde school: a. het college van burgemeester en wethouders, voor zover
      de raad niet anders bepaalt, en, indien de raad dit besluit, met inachtneming van door hem te stellen regelen,
      b. het krachtens de desbetreffende gemeenschappelijke regeling bevoegde orgaan, c. de openbare rechtspersoon, bij
      verordening door een of meer gemeenteraden ingesteld, d. de stichting, opgericht tot instandhouding van een of meer
      openbare en een of meer bijzondere scholen,
      - een bijzondere school: het schoolbestuur;

      2°. ten aanzien van de instellingen genoemd in onderdeel d, onder 3°: het bestuur;

      g. werktijdfactor: het gedeelte van de normbetrekking waarvoor een personeelslid is benoemd, waarbij de uitkomst
      rekenkundig wordt afgerond op vier cijfers achter de komma;

      h. inspectie: de inspectie van het onderwijs, belast met het toezicht op de desbetreffende instelling;

      i. normbetrekking: de betrekking of de betrekkingen waarvan de omvang op jaarbasis na aftrek van het verlof op
      grond van [artikel 12][ref5] respectievelijk [artikel 17, tweede lid, eerste volzin][ref6] en na aftrek van het
      verlof op grond van [artikel 33][ref7], gelijk is aan 1659 uren en waarbij de gemiddelde weektaak op jaarbasis
      gelijk is aan 36,86 uren;

      j. bezoldiging: de som van het salaris en de toelagen, genoemd in de [artikelen 98][ref8], [115][ref9],
      [180][ref10], [181][ref11] en [273, tweede en derde lid][ref12], waarop de betrokkene ingevolge dit besluit
      aanspraak heeft;

      k. pensioenreglement: het pensioenreglement van de Stichting Pensioenfonds ABP;

      l. pensioen: een pensioen als bedoeld in en vastgesteld bij of krachtens de [Wet privatisering ABP][ref13];

      m. schooljaar: het administratieve schooljaar, zijnde het tijdvak van 1 augustus tot en met 31 juli;

      n. benoeming of aanstelling: de benoeming in algemene dienst van een bevoegd gezag,
      bedoeld in [artikel 34, eerste lid, van de Wet op het primair onderwijs][ref14] dan wel
      [artikel 34, eerste lid, van de Wet op de expertisecentra][ref15];

      o. akte van benoeming: de akte van benoeming bij het bijzonder onderwijs dan wel de akte van aanstelling bij het
      openbaar onderwijs, [bedoeld in titel 2 van hoofdstuk 1][ref16];

      p. echtgeno(o)t(e): voor de toepassing van dit besluit wordt onder echtgenote of echtgenoot mede begrepen
      de levenspartner met wie de betrokkene samenwoont en – met het oogmerk duurzaam samen te leven – een
      gemeenschappelijke huishouding voert op basis van een notarieel verleden samenlevingscontract bevattende de
      wederzijdse rechten en verplichtingen ter zake van die samenwoning en gemeenschappelijke huishouding, dan wel
      de persoon met wie een geregistreerd partnerschap is aangegaan, waarbij geldt dat tegelijkertijd slechts één
      persoon als levenspartner of geregistreerde partner kan worden aangemerkt en waarbij tevens geldt dat Onze
      Minister kan verlangen dat een schriftelijke verklaring van een notaris wordt overgelegd waaruit blijkt dat een
      samenlevingscontract als bedoeld in de eerste volzin is gesloten;

      q. salarisschaal: de bij een functie horende schaal.


