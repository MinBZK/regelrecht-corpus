  - number: '243'
    text: >-
      1 De betrokkene kan in beroep komen tegen een door het instellingsbestuur genomen besluit inhoudende:


      a. ontzegging van de toegang tot de instelling;


      b. oplegging van een straf;


      c. ontslag anders dan op eigen verzoek, voordat hij de pensioengerechtigde leeftijd heeft bereikt, of het tijdvak
      waarvoor hij is benoemd, is verstreken;


      d. schorsing;


      e. het direct of indirect onthouden van promotie;


      f. de beslissing van het instellingsbestuur ten aanzien van een personeelslid op basis waarvan op termijn opheffing
      van zijn betrekking kan plaatsvinden;


      g. de beëindiging van een verlengd tijdelijk dienstverband;


      h. de aanwijzing als personeelslid boven de reguliere formatie voortvloeiend uit een algemeen verbindend
      voorschrift, die op termijn kan leiden tot ontslag of beëindiging van een verlengd tijdelijk dienstverband;


      i. de aanwijzing van een andere school of andere scholen waaraan een betrokkene werkzaamheden zal verrichten.


      2 Indien in de gevallen, bedoeld in het eerste lid, de betrokkene voor het verstrijken van de beroepstermijn is
      overleden, kunnen in beroep komen zijn nagelaten betrekkingen die recht hebben op een uitkering bij overlijden.


      3 De appellant dient bij de voorzitter van de commissie een door hem of door zijn raadsman ondertekend
      beroepschrift in, waarbij wordt gevoegd:


      a. een afschrift van het bestuursbesluit waartegen het beroep wordt ingesteld;


      b. een afschrift van de akte van benoeming;


      c. afschriften van de voornaamste op de zaak betrekking hebbende stukken.


      4 Het beroepschrift bevat:


      a. een opgave van de naam, de voornamen en het adres van de appellant en zo nodig de gekozen woonplaats ten aanzien
      van de procedure;


      b. een zo volledig mogelijke aanduiding van de naam en het adres van de tegenpartij;


      c. een mededeling van de vordering en de gronden waarop deze berust.


      5 Het beroepschrift moet worden ingediend bij de voorzitter van de commissie binnen 6 weken, gerekend vanaf de dag
      na die waarop het bestuursbesluit waartegen het beroep wordt ingesteld, aan appellant is verzonden.


      6 Indien het beroepschrift niet voldoet aan de eisen gesteld in het tweede en derde lid van dit artikel, wijst de
      voorzitter de appellant op het gepleegde verzuim en nodigt hem uit binnen 2 weken een hersteld beroepschrift in
      te zenden.
    url: https://wetten.overheid.nl/BWBR0015136/2014-01-01#Artikel243
  - number: '244'
    text: |-
      1 Indien het geschil kennelijk bij een andere commissie moet worden aangebracht, deelt de voorzitter dit onverwijld
      bij aangetekende brief aan de appellant mee. Over andere gevallen van onbevoegdheid beslist de commissie.

      2 Indien het beroepschrift na de daarvoor gestelde termijn is ingediend, laat de commissie niet-ontvankelijk
      verklaring op die grond achterwege, indien de appellant aantoont dat hij de voorziening in beroep heeft gevraagd zo
      spoedig als dit redelijkerwijs verlangd kon worden.

      3 Tenzij de behandeling in het eerste en tweede lid er toe leidt het beroepschrift niet in behandeling te
      nemen, zendt de voorzitter onmiddellijk na ontvangst van het beroepschrift of hersteld beroepschrift een
      exemplaar daarvan, vergezeld van de in [ artikel 243, derde lid][ref1], genoemde afschriften, aan het betrokken
      instellingsbestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel243
    url: https://wetten.overheid.nl/BWBR0015136/2014-01-01#Artikel244
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '243'
        hoofdstuk: '3'
  - number: '245'
    text: >-
      1 Binnen twee weken na ontvangst van het door de voorzitter van de commissie toegezonden beroepschrift en de
      daarbij behorende afschriften doet het instellingsbestuur de voorzitter een verweerschrift in drievoud toekomen.
      Bij elk exemplaar voegt het instellingsbestuur afschriften van de voornaamste op de zaak betrekking hebbende
      stukken. De voorzitter kan op tijdig verzoek van het instellingsbestuur de termijn voor verweer in uitzonderlijke
      gevallen verlengen tot een door hem te bepalen datum.


      2 Na ontvangst van het verweerschrift zendt de voorzitter onverwijld een exemplaar daarvan, vergezeld van de
      daarbij behorende afschriften, aan de appellant.
    url: https://wetten.overheid.nl/BWBR0015136/2014-01-01#Artikel245
  - number: '246'
    text: >-
      1 De voorzitter bepaalt de dag en het uur waarop de zaak zal worden behandeld.


      2 Die dag zal niet later mogen worden gesteld dan zes weken na ontvangst van het beroepschrift of het hersteld
      beroepschrift, tenzij de betrokkene zulks verzoekt wegens niet tijdige ontvangst. Overschrijding van deze termijn
      wordt alleen in uitzonderlijke gevallen toegestaan en dient te worden gemotiveerd.


      3 De voorzitter geeft binnen twee weken na ontvangst van het beroepschrift of van het hersteld beroepschrift aan
      beide partijen per aangetekende brief kennis van de plaats, de dag en het uur, waarop de zaak zal worden behandeld.
      Overschrijding van deze termijn is slechts in uitzonderlijke gevallen toegestaan en dient te worden gemotiveerd.
    url: https://wetten.overheid.nl/BWBR0015136/2014-01-01#Artikel246
  - number: '247'
    text: >-
      Met eenstemmig goedvinden van de commissie en partijen kan de behandeling van het geschil ook schriftelijk
      geschieden.
    url: https://wetten.overheid.nl/BWBR0015136/2014-01-01#Artikel247
  - number: '248'
    text: >-
      1 Voor de aanvang van de behandeling van de zaak op de zitting kan op verzoek van een partij een lid van de
      commissie worden gewraakt:


      a. indien hij persoonlijk belang bij het geschil heeft;


      b. indien hij aan de appellant, dan wel aan een van de leden van het bij de zaak betrokken instellingsbestuur in
      bloed- of aanverwantschap bestaat tot in de vierde graad ingesloten;


      c. indien hij een advies in de zaak heeft gegeven of met een van de partijen een bespreking erover heeft gevoerd;


      d. indien er een hoge graad van vijandschap of vriendschap bestaat tussen hem en een van de partijen;


      e. indien hij binnen een tijdvak van vijf jaren, voorafgaande aan de datum van ontvangst van het beroepschrift door
      de voorzitter, lid is geweest van het instellingsbestuur of in dienst van het bestuur is geweest;


      f. in andere gevallen waarin daartoe een ernstige reden aanwezig is.


      2 In dezelfde gevallen kan een lid van de commissie zich verschonen.


      3 Over de wraking of de verschoning wordt zo spoedig mogelijk beslist door de overige leden der commissie.


      4 Bij staking van stemmen wordt de wraking geacht te zijn toegewezen.
    url: https://wetten.overheid.nl/BWBR0015136/2014-01-01#Artikel248
  - number: '249'
    text: >-
      Indien de commissie zulks ter beslissing van de zaak nodig acht, kan zij al dan niet op grond van een daartoe
      strekkend verzoek van een partij getuigen en deskundigen ter zitting horen. Indien zij van deze bevoegdheid gebruik
      maakt, doet de voorzitter hiervan vooraf mededeling aan partijen.
    url: https://wetten.overheid.nl/BWBR0015136/2014-01-01#Artikel249
  - number: '250'
    text: >-
      1 De zittingen van de commissie zijn openbaar.


      2 Indien een partij daarom verzoekt, vindt de zitting geheel of gedeeltelijk achter gesloten deuren plaats.


      3 In het belang van de openbare orde of zedelijkheid of om gewichtige in het proces-verbaal van de zitting te
      vermelden redenen, kan de commissie bepalen, dat de zitting geheel of gedeeltelijk achter gesloten deuren zal
      plaatshebben.


      4 Tijdens de zitting wordt aan partijen de gelegenheid gegeven:


      a. haar belangen voor te dragen of te doen voordragen;


      b. getuigen en deskundigen te doen horen;


      c. kennis te nemen van alle op het geschil betrekking hebbende stukken, waarvan, voor zover mogelijk, ten minste 1
      week voor de zitting aan partijen inzage wordt gegeven.
    url: https://wetten.overheid.nl/BWBR0015136/2014-01-01#Artikel250
  - number: '251'
    text: >-
      1 Binnen 2 weken na de laatste zitting waarop de zaak is behandeld, beslist de commissie op het beroepschrift.


      2 Deze dag zal niet later mogen worden gesteld dan 16 weken na de indiening van het beroepschrift of het hersteld
      beroepschrift. Overschrijding van deze termijn is slechts in uitzonderlijke gevallen toegestaan en wordt in de
      beslissing gemotiveerd.


      3 De beslissing, bedoeld in het eerste lid, wordt zoveel mogelijk genomen in een voltallige vergadering. Het is
      de leden van de commissie niet toegestaan de gevoelens die tijdens deze vergadering over het geschil zijn geuit,
      te openbaren.


      4 Een beslissing is slechts van kracht, indien genomen door ten minste 3 leden die de zaak hebben behandeld,
      waaronder de voorzitter of plaatsvervangend voorzitter, met dien verstande dat van de leden of plaatsvervangende
      leden, gekozen door de besturen en door het personeel, een gelijk getal van beide zijden aan de beslissing zal
      deelnemen en dat bij ongelijk getal het jongste lid in leeftijd van de zijde die het sterkst is vertegenwoordigd,
      zich van de stemming zal onthouden. De overige leden onthouden zich niet van stemmen, noch stemmen zij blanco.


      5 De beslissing wordt met redenen omkleed en door de voorzitter binnen 2 weken, nadat zij is genomen, bij
      aangetekend schrijven aan de partij toegezonden.


      6 De voorzitter zendt een afschrift van de beslissing naar Onze Minister.


      7 Het instellingsbestuur onderwerpt zich aan de uitspraak van de commissie.
    url: https://wetten.overheid.nl/BWBR0015136/2014-01-01#Artikel251
  - number: '252'
    text: De kosten van de commissie komen ten laste van de bij haar aangesloten instellingsbesturen.
    url: https://wetten.overheid.nl/BWBR0015136/2014-01-01#Artikel252
