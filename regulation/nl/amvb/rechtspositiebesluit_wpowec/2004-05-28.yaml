        hoofdstuk: '1'
  - number: '202.2'
    text: |-
      Voor de toepassing van
      __REF000___________________________________________________________________________________________________________
      ___________________________________________________ wordt na een termijn van 18 maanden van verhindering volgend op
      de kalendermaand waarin de verhindering is ontstaan, uitgegaan van de bezoldiging die voor de betrokkene zou gelden
      indien hem geen verlof op grond van deze titel zou zijn verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0007800#Artikel4
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel202
    references:
      - id: ref1
        bwb_id: BWBR0007800
        artikel: '4'
  - number: '202.3'
    text: |-
      Voor de toepassing van de [titels 5][ref1], [8][ref2] en [9 van dit hoofdstuk][ref3] wordt uitgegaan van de
      bezoldiging die voor de betrokkene op grond van de [titels 12][ref4], [13][ref5] en [14 van dit hoofdstuk][ref6],
      en op grond van de [titels 2][ref7], [3][ref8] en [4 van hoofdstuk 5][ref9] zou gelden indien hem dat verlof niet
      zou zijn verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Hoofdstuk1
