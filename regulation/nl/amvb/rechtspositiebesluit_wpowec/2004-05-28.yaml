  - number: '275.1'
    text: |-
      De betrokkene voor wie als leraar met toepassing van
      [artikel C1 v an het Besluit overgangsmaatregelen b.o. 1985][ref1] een uitzicht is vastgesteld, behoudt aanspraak
      op vaststelling van zijn salaris overeenkomstig dat uitzicht, zolang hij zonder wezenlijke onderbreking in het
      basisonderwijs werkzaam blijft in een functie als bedoeld in [titel 12][ref2] of [13 van hoofdstuk 1][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003807#ArtikelC1
      [ref2]: https://wetten.overheid.nl/BWBR0015136#Hoofdstuk1
      [ref3]: https://wetten.overheid.nl/BWBR0015136#Hoofdstuk1
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel275
    references:
      - id: ref1
        bwb_id: BWBR0003807
        artikel: C1
      - id: ref2
        bwb_id: BWBR0015136
        hoofdstuk: '1'
      - id: ref3
        bwb_id: BWBR0015136
        hoofdstuk: '1'
  - number: '275.2'
    text: |-
      Met een wezenlijke onderbreking als aangegeven in het eerste lid, wordt een periode van langer dan twee
      maanden bedoeld. De tijd waarin een ontslaguitkering als bedoeld in [hoofdstuk I-H van het Rechtspositiebesluit
      onderwijspersoneel](onbekend) zoals [dat hoofdstuk](onbekend) op 28 februari 1994 luidde, dan wel een uitkering
      als bedoeld in het [Besluit Werkloosheid onderwijs- en onderzoekpersoneel][ref1] wordt genoten, wordt niet als
      onderbreking aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0006445
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel275
    references:
      - id: ref1
        bwb_id: BWBR0006445
  - number: '275.3'
    text: |-
      Ten aanzien van de leraar die op 1 augustus 1985 in het genot is van een ontslaguitkering en voor wie met
      toepassing van [artikel C5 van het Besluit overgangsmaatregelen b.o. 1985][ref1] een uitzicht is vastgesteld, is
      het eerste en tweede lid van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003807#ArtikelC5
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel275
    references:
      - id: ref1
        bwb_id: BWBR0003807
        artikel: C5
  - number: '275.4'
    text: |-
      Zolang de betrokkene, bedoeld in het eerste tot en met het derde lid, is benoemd
      in een functie waarvan het maximumsalaris lager is dan het voor hem ingevolge
      [artikel C1 van het Besluit overgangsmaatregelen b.o. 1985][ref1] vastgestelde uitzicht, is hij ontheven van de
      verplichting te voldoen aan de promotiecriteria, bedoeld in [artikel 152][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003807#ArtikelC1
      [ref2]: https://wetten.overheid.nl/BWBR0015136#Artikel152
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel275
    references:
      - id: ref1
