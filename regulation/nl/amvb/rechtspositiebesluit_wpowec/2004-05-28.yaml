        artikel: '34'
  - number: 1.o
    text: |-
      akte van benoeming: de akte van benoeming bij het bijzonder onderwijs dan wel de akte van aanstelling bij het
      openbaar onderwijs, [bedoeld in titel 2 van hoofdstuk 1][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Hoofdstuk1
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0015136
        hoofdstuk: '1'
  - number: 1.p
    text: |-
      echtgeno(o)t(e): voor de toepassing van dit besluit wordt onder echtgenote of echtgenoot mede begrepen
      de levenspartner met wie de betrokkene samenwoont en – met het oogmerk duurzaam samen te leven – een
      gemeenschappelijke huishouding voert op basis van een notarieel verleden samenlevingscontract bevattende de
      wederzijdse rechten en verplichtingen ter zake van die samenwoning en gemeenschappelijke huishouding, dan wel
      de persoon met wie een geregistreerd partnerschap is aangegaan, waarbij geldt dat tegelijkertijd slechts één
      persoon als levenspartner of geregistreerde partner kan worden aangemerkt en waarbij tevens geldt dat Onze
      Minister kan verlangen dat een schriftelijke verklaring van een notaris wordt overgelegd waaruit blijkt dat een
      samenlevingscontract als bedoeld in de eerste volzin is gesloten.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel1
  - number: '2'
    text: |-
      Het bevoegd gezag draagt er zorg voor dat een bijgewerkt exemplaar van dit besluit en de overige van toepassing
      zijnde rechtspositionele regelingen op een voor de betrokkene steeds toegankelijke plaats in de instelling ter
      inzage beschikbaar is.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel2
  - number: '3'
    text: |-
      Indien de betrokkene ten genoegen van de bevoegde instantie aannemelijk maakt dat de aanvang van een in dit besluit
      gestelde termijn waarin een aanspraak kan worden geldend gemaakt, hem niet tijdig bekend kon zijn en hij hierdoor
      in zijn belangen is geschaad, wordt de termijn geacht te zijn aangevangen op het tijdstip waarop de betrokkene
      naar het oordeel van de bevoegde instantie redelijkerwijs heeft kunnen kennis dragen van het ontstaan van zijn
      aanspraken.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel3
  - number: '4'
    text: |-
      De Algemene termijnenwet is niet van toepassing op de termijnen in dit besluit gesteld, met uitzondering
      van die, genoemd in de [artikelen 214, eerste lid][ref1], [223, eerste en derde lid][ref2], en
      [235, eerste en derde lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel214
      [ref2]: https://wetten.overheid.nl/BWBR0015136#Artikel223
      [ref3]: https://wetten.overheid.nl/BWBR0015136#Artikel235
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '214'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0015136
        artikel: '223'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0015136
        artikel: '235'
        hoofdstuk: '2'
  - number: '5.1'
    text: |-
      De salarisbedragen, toelagen en tegemoetkomingen, genoemd in de bijlagen bij dit besluit, kunnen worden gewijzigd
      bij ministeriële regeling.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel5
  - number: '5.2'
    text: |-
      De salaristabellen, toelagen en tegemoetkomingen, opgenomen in de bijlagen bij dit besluit, bevatten de bedragen
      naar de stand van 31 december 2001, omgerekend in euro's.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel5
  - number: '6'
    text: |-
      Indien personeel is benoemd voor wie de salaris- en andere kosten niet voor vergoeding van rijkswege in aanmerking
      komen, is ten aanzien van dit personeel dit besluit van toepassing tenzij uitdrukkelijk anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel6
  - number: '7.1'
    text: In gevallen waarin dit besluit niet of niet naar billijkheid voorziet, beslist Onze Minister.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel7
  - number: '7.2'
    text: |-
      Onze Minister geeft nadere voorschriften omtrent de toepassing van dit besluit in geval van samenvoeging of
      splitsing van instellingen.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel7
  - number: '7.3'
    text: Onze Minister kan nadere regelen geven voor de uitvoering van dit besluit.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel7
  - number: '8.1'
    text: 'Bij zijn indiensttreding ontvangt de betrokkene een akte van benoeming waarin tenminste is vermeld:'
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel8
  - number: 8.1.a
    text: de naam en het adres van het bevoegd gezag;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel8
  - number: 8.1.b
    text: de naam, de voornamen en de geboortedatum van de betrokkene;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel8
  - number: 8.1.c
    text: de datum van ingang van de benoeming;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel8
  - number: 8.1.d
    text: de functie waarin de betrokkene wordt benoemd;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel8
  - number: 8.1.e
    text: de omvang van de betrekking, uitgedrukt in een werktijdfactor;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel8
  - number: 8.1.f
    text: |-
      de bepaling of de benoeming in vaste of in tijdelijke dienst geschiedt en in het laatste geval de gronden voor de
      tijdelijkheid en de duur van de benoeming;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel8
  - number: 8.1.g
    text: de op de dag van zijn benoeming van toepassing zijnde schaal en het salarisnummer;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel8
  - number: 8.1.h
    text: de bepaling dat de betrokkene werkzaam zal zijn in algemene dienst van het bevoegd gezag;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel8
  - number: 8.1.i
    text: |-
      voor personeelsleden die bij de uitoefening van hun functie kennis nemen van persoonlijke gegevens van leerlingen,
      voorschriften omtrent geheimhouding daarvan, voor zover een geheimhoudingsplicht niet uit anderen hoofde is
      verzekerd;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel8
  - number: 8.1.j
    text: |-
      de instelling of instellingen waaraan de betrokkene werkzaam zal zijn en de verdeling van de uren over die
      instellingen;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel8
  - number: 8.1.k
    text: de van toepassing zijnde afvloeiingsregeling;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel8
  - number: 8.1.l
    text: andere voor de rechtspositie van belang zijnde zaken.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel8
  - number: '8.2'
    text: 'Wijziging van:'
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel8
  - number: 8.2.a
    text: de aard van het dienstverband;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel8
  - number: 8.2.b
    text: de functie waarin hij is benoemd;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel8
  - number: 8.2.c
    text: de omvang van de betrekking, uitgedrukt in een werktijdfactor, of
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel8
  - number: 8.2.d
    text: |-
      de instelling of instellingen waaraan de betrokkene werkzaam zal zijn, wordt door het bevoegd gezag schriftelijk
      aan de betrokkene meegedeeld. Over de in dit lid bedoelde wijzigingen pleegt het bevoegd gezag overleg met de
      betrokkene.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel8
  - number: '8.3'
    text: |-
      Wanneer voor de betrokkene die nog niet volgens de bij zijn functie behorende maximumschaal, bedoeld
      in [artikel 83, onder c][ref1], wordt bezoldigd, een schaal met een hoger maximumsalaris, bedoeld in
      [artikel 83, onder f][ref2], gaat gelden, wordt hem schriftelijk medegedeeld:


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel83
      [ref2]: https://wetten.overheid.nl/BWBR0015136#Artikel83
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '83'
        hoofdstuk: '1'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0015136
        artikel: '83'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: 8.3.a
    text: de datum waarop voor hem een andere schaal gaat gelden;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel8
  - number: 8.3.b
    text: de schaal die vanaf de onder a bedoelde datum van toepassing zal zijn;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel8
  - number: 8.3.c
    text: |-
      het op de onder a bedoelde datum binnen de onder b bedoelde schaal van toepassing zijnde salarisnummer en het
      daarbij behorende bruto maandsalaris bij een normbetrekking.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel8
  - number: '8.4'
    text: |-
      Bij het einde van zijn dienstverband ontvangt de betrokkene van het bevoegd gezag een schriftelijke verklaring
      waarin is vermeld:
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel8
  - number: 8.4.a
    text: het begintraject, aanlooptraject of de schaal die op de dag direct voorafgaande aan het ontslag van toepassing was;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel8
  - number: 8.4.b
    text: |-
      het op de dag direct voorafgaande aan het ontslag van toepassing zijnde salarisnummer binnen het onder a bedoelde
      begintraject of aanlooptraject dan wel binnen de onder a bedoelde schaal;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel8
  - number: 8.4.c
    text: |-
      de datum vanaf welke voor de betrokkene het onder a bedoelde begintraject of aanlooptraject dan wel de onder a
      bedoelde aanloopschaal en het onder b bedoelde salarisnummer gold en de mate waarin de betrokkene aan de voor hem
      geldende promotiecriteria heeft voldaan.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel8
  - number: '9'
    text: |-
      De verklaring omtrent het gedrag, afgegeven volgens de [Wet justitiële gegevens][ref1], die vereist is voor
      benoeming, is bij overlegging aan het bevoegd gezag niet ouder dan zes maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0014194
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0014194
  - number: '10.1'
    text: Ter zake van werving en selectie van personeel neemt het bevoegd gezag een sollicitatiecode in acht.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel10
  - number: '10.2'
    text: |-
      De sollicitatiecode wordt niet vastgesteld dan nadat met de personeelsorganisaties, bedoeld in
      [artikel 64 van de Wet op het primair onderwijs][ref1] en [artikel 66 van de Wet op de expertisecentra][ref2] ,
      voor zover deze hun werkzaamheden uitstrekken over het aan zodanige instellingen verbonden personeel, overleg is
      gepleegd.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel64
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel66
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '64'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '66'
  - number: '10.3'
    text: |-
      Het bevoegd gezag draagt er zorg voor dat de sollicitatiecode op een toegankelijke plaats in de instelling steeds
      ter inzage beschikbaar is en dat op verzoek een exemplaar aan de sollicitant wordt verstrekt.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel10
  - number: '11'
    text: 'In deze paragraaf wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel11
  - number: 11.a
    text: 'betrokkene: de betrokkene voor zover het betreft:'
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel11
  - number: 11.a.1°
    text: |-
      de directeur, de leraar tevens adjunct-directeur of een lid van het onderwijsgevend personeel, bedoeld in
      [artikel 1, onderdeel e, onder 1° en 2°][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel1
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '1'
        hoofdstuk: '1'
  - number: 11.a.2°
    text: |-
      een lid van het onderwijsgevend personeel, bedoeld in [artikel 1, onderdeel e, onder 3°][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel1
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '1'
        hoofdstuk: '1'
  - number: 11.b
    text: 'vakanties: de voor de instelling van de betrokkene geldende vakanties;'
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel11
  - number: 11.c
    text: |-
      dag: elke dag die volgens het schema van werkzaamheden dan wel het normale lesrooster een werkdag is van de
      instelling; een dag kan worden verdeeld in 2 halve dagen.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel11
  - number: '12.1'
    text: |-
      Tenzij uitdrukkelijk anders is bepaald, geniet de betrokkene gedurende de schoolvakanties dan wel de periode waarin
      de instelling geen onderwijs verzorgt of examens afneemt, vakantieverlof met behoud van bezoldiging.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel12
  - number: '12.2'
    text: |-
      Het bevoegd gezag kan op verzoek na omzetting van de dienst verlof verlenen op andere tijdstippen aan de directeur,
      de adjunct-directeur en de leraar die is benoemd als adjunct-directeur.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel12
  - number: '12.3'
    text: |-
      De betrokkene houdt zich zo nodig gedurende enkele dagen van het verlof ter beschikking van het bevoegd gezag ten
      behoeve van werkzaamheden van onderwijskundige of schoolorganisatorische aard.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel12
  - number: '12.4'
    text: |-
      Het totale vakantieverlof van de betrokkene kan bij toepassing van het derde lid met niet meer dan twee dagen per
      schooljaar worden verminderd. Voor die vermindering komen slechts in aanmerking de eerste en de laatste twee dagen
      van de zomervakantie.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel12
  - number: '12.5'
    text: |-
      Het bevoegd gezag bepaalt tijdig na overleg met de betrokkene of, en zo ja, welke dagen voor de toepassing van het
      vierde lid van dit artikel in aanmerking komen.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel12
  - number: '12.6'
    text: |-
      Van het eerste tot en met vijfde lid kan met het oog op de invulling van de algemene arbeidsduur per jaar
      bedoeld in [artikel 85, tweede en derde lid][ref1], in het bijzonder onderwijs worden afgeweken op grond van een
      overeenkomst als bedoeld in de Wet op de collectieve arbeidsovereenkomst en in het openbaar onderwijs op grond van
      een overeenkomst die voldoet aan de voorwaarden zoals die zijn gesteld in genoemde wet.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel85
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '85'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: '13.1'
    text: |-
      De betrokkene, werkzaam in deelbetrekking aan meer dan één instelling, waarvan de zomervakanties ten gevolge van
      vakantiespreiding niet in dezelfde periode vallen, heeft aanspraak op een aaneengesloten lesvrije periode van ten
      minste drie weken. Het bevoegd gezag van de instelling of instellingen waar de zomervakantie het laatst aanvangt,
      verleent daartoe aan de betrokkene desgevraagd zoveel dagen bijzonder vakantieverlof dat genoemde termijn wordt
      bereikt. Dit bijzondere vakantieverlof wordt verleend in de periode die direct voorafgaat aan de aanvang van de
      zomervakantie van bedoelde instelling of instellingen.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel13
  - number: '13.2'
    text: |-
      Ten aanzien van de betrokkene, bedoeld in het eerste lid, is [artikel 12, derde tot en met vijfde lid][ref1], niet
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel12
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '12'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: '14.1'
    text: |-
      Voor de betrokkene, die een benoeming heeft aan een instelling voor korter dan één jaar, geldt
      [artikel 12, eerste lid][ref1], met dien verstande, dat alleen in aanmerking komen de vakanties, gelegen tussen de
      eerste en de laatste dag van zijn werkzaamheden, tenzij de betrokkene is benoemd vóór 1 maart en zijn werkzaamheden
      voortzet tot aan de zomervakantie, in welk geval in aanmerking komen de vakanties, gelegen tussen de eerste dag van
      zijn werkzaamheden en het einde van het schooljaar.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel12
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '12'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: '14.2'
    text: Het eerste lid laat onverlet de aanspraak op een evenredig gedeelte van vier weken vakantie per schooljaar.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel14
  - number: '15.1'
    text: |-
      Bij rampen en in andere zeer buitengewone omstandigheden kan het bevoegd gezag het vakantieverlof van de betrokkene
      intrekken. Het bevoegd gezag doet hiervan zo spoedig mogelijk mededeling aan de inspectie.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel15
  - number: '15.2'
    text: |-
      Indien de betrokkene als gevolg van de intrekking van het verlof materiële schade lijdt, wordt deze schade hem door
      het bevoegd gezag vergoed.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel15
  - number: '16'
    text: 'In deze paragraaf wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel16
  - number: 16.a
    text: 'betrokkene: de betrokkene, voor zover het betreft een lid van het onderwijsondersteunend personeel;'
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel16
  - number: 16.b
    text: 'vakanties: de voor de instelling van de betrokkene geldende vakanties;'
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel16
  - number: 16.c
    text: 'uur: klokuur.'
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel16
  - number: '17.1'
    text: |-
      Het bevoegd gezag verleent aan de betrokkene vakantieverlof met behoud van bezoldiging. Het verlof wordt bij
      voorkeur in de schoolvakanties verleend.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel17
  - number: '17.2'
    text: |-
      De duur van het vakantieverlof per kalenderjaar bedraagt 184 uren. De duur van het verlof wordt met 8 uren
      verlengd indien de bezoldiging of de som van de bezoldigingen in de desbetreffende betrekking bij de aanvang
      van het kalenderjaar, dan wel, in geval van indiensttreding in de loop van het kalenderjaar, op het tijdstip
      van indiensttreding, gelijk is aan of hoger is dan het maximum van schaal 8 vermeld in de [bijlagen 1A][ref1] en
      [1B][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0015136
      [ref2]: https://wetten.overheid.nl/BWBR0015136
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0015136
      - id: ref2
        bwb_id: BWBR0015136
  - number: '17.3'
    text: |-
      De ingevolge het tweede lid vastgestelde duur van het vakantieverlof wordt afhankelijk van de leeftijd, die de
      betrokkene in het desbetreffende kalenderjaar bereikt, verlengd overeenkomstig de hierna volgende tabel:






                    Leeftijd


                    Verlenging






                    18 jaar (en jonger)


                    24 uren




                    19 jaar


                    16 uren




                    20 jaar


                    8 uren




                    van 30 tot en met 39 jaar


                    8 uren




                    van 40 tot en met 44 jaar


                    16 uren




                    van 45 tot en met 49 jaar


                    24 uren




                    van 50 tot en met 54 jaar


                    32 uren




                    van 55 tot en met 59 jaar


                    40 uren




                    60 jaar en ouder


                    48 uren
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel17
  - number: '17.4'
    text: |-
      Met ingang van de dag waarop de betrokkene gebruik maakt van [titel 16 van dit hoofdstuk][ref1] wordt zijn
      aanspraak op uren vakantieverlof verminderd in verhouding tot de vermindering van zijn werktijd.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Hoofdstuk1
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0015136
        hoofdstuk: '1'
  - number: '17.5'
    text: |-
      Op verzoek van de betrokkene, en voor zover de werkzaamheden aan de instelling dit toelaten, wordt hem
      het vakantieverlof ononderbroken verleend. Bij splitsing wordt ten minste de helft van het vakantieverlof
      aaneengesloten verleend.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel17
  - number: '18.1'
    text: |-
      Op verzoek van de betrokkene trekt het bevoegd gezag in geval van samenloop met andere vormen van verlof en in
      andere daarvoor redelijkerwijs in aanmerking komende gevallen het verleende vakantieverlof in. Het niet genoten
      vakantieverlof wordt in overleg met de betrokkene opnieuw verleend.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel18
  - number: '18.2'
    text: |-
      Bij rampen en in andere zeer buitengewone omstandigheden kan het bevoegd gezag het vakantieverlof van de betrokkene
      intrekken.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel18
  - number: '18.3'
    text: |-
      Indien de betrokkene als gevolg van de intrekking van het verlof materiële schade lijdt, wordt deze schade hem door
      het bevoegd gezag vergoed.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel18
  - number: '18.4'
    text: |-
      Het geheel of gedeeltelijk ingetrokken aantal uren vakantieverlof komt niet in aanmerking bij de berekening van het
      aantal genoten verlofuren.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel18
  - number: '19'
    text: 'In deze paragraaf wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel19
  - number: 19.a
    text: 'jaar:'
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel19
  - number: 19.a.1°
    text: |-
      ten aanzien van de betrokkene voor zover het niet betreft een lid van het onderwijsondersteunend personeel: een
      schooljaar;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel19
  - number: 19.a.2°
    text: |-
      ten aanzien van de betrokkene voor zover het betreft een lid van het onderwijsondersteunend personeel: een
      kalenderjaar;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel19
  - number: 19.b
    text: |-
      dag: elke dag die volgens het schema van werkzaamheden dan wel het lesrooster een werkdag is van de instelling; een
      dag kan worden verdeeld in twee halve dagen, tenzij de verlofgrond zich daartegen verzet.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel19
  - number: '20.1'
    text: |-
      Het bevoegd gezag verleent de betrokkene kort buitengewoon verlof met behoud van bezoldiging, behoudens het derde
      lid, voor zover zijn werkzaamheden samenvallen met één of meer van de navolgende omstandigheden:
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel20
  - number: 20.1.a
    text: |-
      de uitoefening van het kiesrecht, indien en voor zover deze niet in vrije tijd kan geschieden en omzetting van
      dienst niet mogelijk is;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel20
  - number: 20.1.b
    text: |-
      het voldoen aan een wettelijke verplichting, indien en voor zover dit niet in vrije tijd kan geschieden en
      omzetting van dienst niet mogelijk is;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel20
  - number: 20.1.c
    text: |-
      het afleggen van een van rijkswege afgenomen of erkend examen of tentamen, voor zover die niet in vrije tijd kan
      geschieden en omzetting van dienst niet mogelijk is;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel20
  - number: 20.1.d
    text: |-
      het bijwonen van vergaderingen of zittingen van of het verrichten van werkzaamheden voor publiekrechtelijke
      colleges, waarin de betrokkene is benoemd of gekozen, voor zover dit niet in vrije tijd kan geschieden;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel20
  - number: 20.1.e
    text: |-
      het uitoefenen van het lidmaatschap van een van rijkswege ingestelde of erkende examencommissie of het optreden als
      rijksgecommitteerde bij een examen, voor in totaal ten hoogste 14 dagen per jaar in overleg met het bevoegd gezag
      vast te stellen;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel20
  - number: 20.1.f
    text: |-
      verhuizing in geval van verandering van standplaats: indien de betrokkene een eigen huishouding heeft, voor twee,
      in bijzondere gevallen ten hoogste vier dagen en indien de betrokkene geen eigen huishouding heeft, voor ten
      hoogste twee dagen;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel20
  - number: 20.1.g
    text: |-
      verhuizing anders dan in geval van verandering van standplaats: indien de betrokkene een eigen huishouding heeft,
      voor ten hoogste twee dagen per jaar;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel20
  - number: 20.1.h
    text: het zoeken van een woning in geval van verandering van standplaats, voor ten hoogste twee dagen;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel20
  - number: 20.1.i
    text: |-
      ondertrouw of de aangifte van het voornemen om een geregistreerd partnerschap aan te gaan, van de betrokkene, voor
      één dag;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel20
  - number: 20.1.j
    text: |-
      burgerlijk of kerkelijk huwelijk of registratie van het partnerschap van de betrokkene, voor in totaal vier dagen,
      voor zover de huwelijksdag of -dagen of de dag van registratie van het partnerschap hier binnen vallen;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel20
  - number: 20.1.k
    text: |-
      huwelijk of registratie van het partnerschap van bloed- of aanverwanten van de eerste of tweede graad, voor één dag
      of ten hoogste twee dagen, al naar gelang dit huwelijk of deze registratie van het partnerschap wordt gesloten in
      of buiten de woonplaats van de betrokkene;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel20
  - number: 20.1.l
    text: |-
      ernstige ziekte van echtgenoot, ouders of kinderen, stief-, schoon- of pleegfamilieleden daaronder begrepen, voor
      ten hoogste twee weken, tenzij blijkens een over te leggen geneeskundige verklaring gedurende een langere termijn
      de voortdurende aanwezigheid van de betrokkene bij de zieke, anders dan ter verpleging, noodzakelijk is;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel20
  - number: 20.1.m
    text: |-
      overlijden van de onder l bedoelde personen, voor vier dagen; van bloed- of aanverwanten in de tweede graad, voor
      twee dagen; van bloed- of aanverwanten in de derde of vierde graad, voor ten hoogste één dag; is de betrokkene in
      de twee laatstgenoemde gevallen belast met de regeling van de begrafenis of van de nalatenschap, dan wordt verlof
      verleend voor ten hoogste vier dagen;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel20
  - number: 20.1.n
    text: bevalling van de echtgenote, voor ten hoogste twee dagen;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel20
  - number: 20.1.o
    text: |-
      het 25-, 40- en 50-jarig ambts- of huwelijksjubileum dan wel jubileum van de registratie van het partnerschap
      van de betrokkene en het 25-, 40-, 50- en 60-jarig huwelijksjubileum dan wel jubileum van de registratie van het
      partnerschap van zijn ouders, stief-, schoon- of pleegouders daaronder begrepen, voor één dag;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel20
  - number: 20.1.p
    text: |-
      kerkelijke bevestiging of eerste communie van de betrokkene, zijn echtgenote en kinderen, stief-, schoon- of
      pleegkinderen daaronder begrepen, voor één dag;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel20
  - number: 20.1.q
    text: |-
      adoptie van een kind, voor ten hoogste vijf dagen; in geval van adoptie van een buitenlands kind wordt, indien
      verlof noodzakelijk is om de betrokkene in staat te stellen in het desbetreffende land het nodige te verrichten,
      éénmaal per geval van adoptie, verlof verleend voor de duur van de noodzakelijke reis- en verblijftijd tot ten
      hoogste zes weken;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel20
  - number: 20.1.r
    text: |-
      het voldoen aan een verzoek van een commissie van beroep als bedoeld in
      [artikel 60, eerste lid, van de Wet op het primair onderwijs][ref1] en
      [artikel 63, eerste lid, van de Wet op de expertisecentra][ref2], om als getuige of deskundige te worden gehoord,
      voor zover dit niet in vrije tijd kan geschieden en omzetting van dienst niet mogelijk is;


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel60
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel63
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '60'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '63'
  - number: 20.1.s
    text: |-
      jeugd- en jongerenwerk als bedoeld in de door Onze Minister getroffen regeling, voor telkens ten hoogste 5 dagen,
      met dien verstande dat per schooljaar in totaal niet meer dan 10 dagen verlof worden verleend;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel20
  - number: 20.1.t
    text: |-
      voor zover het betreft de betrokkene, bedoeld in [artikel 1, onderdeel e, onder 1°][ref1]: het vervullen van een
      stage in het kader van deelname aan een door Onze Minister aan te wijzen applicatiecursus basisonderwijs, voor twee
      dagen per schooljaar;


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel1
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '1'
        hoofdstuk: '1'
  - number: 20.1.u
    text: |-
      een calamiteit, waaronder wordt verstaan een plotseling optredende gebeurtenis die uit zijn aard niet te voorzien
      is en waarvoor zonder uitstel maatregelen door betrokkene moeten worden genomen, voor ten hoogste één werkdag en
      maximaal 3 calamiteiten per jaar.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel20
  - number: '20.2'
    text: |-
      Indien de in het eerste lid, onder d, genoemde omstandigheid zich voordoet en de betrokkene een vaste vergoeding
      ontvangt in verband met de activiteiten waarvoor hem verlof wordt verleend, wordt op zijn bezoldiging een inhouding
      toegepast over de tijd, dat hij het verlof geniet. Deze inhouding gaat hetgeen de betrokkene kan worden geacht te
      ontvangen als vaste vergoeding voor de activiteiten verricht gedurende de met het verlof overeenkomende tijd, niet
      te boven.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel20
  - number: '20.3'
    text: |-
      Indien de betrokkene er naar het oordeel van het bevoegd gezag niet in slaagt achteraf aannemelijk te maken dat er
      daadwerkelijk sprake is van een situatie als bedoeld in het eerste lid, onder u, kan het op het verlof betrekking
      hebbende salaris in mindering worden gebracht op het salaris, dan wel kan het verlof bij een betrokkene in de zin
      van [titel 14 van dit hoofdstuk][ref1] in mindering worden gebracht op het vakantieverlof.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Hoofdstuk1
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0015136
        hoofdstuk: '1'
  - number: '21'
    text: |-
      Het bevoegd gezag verleent de betrokkene gedurende een door Onze Minister te bepalen aantal dagen of uren kort
      buitengewoon verlof met behoud van bezoldiging indien deze met toestemming van het bevoegd gezag deelneemt aan een
      door Onze Minister aan te wijzen nascholingscursus en voor zover zijn werkzaamheden daarmee samenvallen.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel21
  - number: '22'
    text: |-
      In andere dan in [artikel 20, eerste en tweede lid][ref1], bedoelde gevallen kan het bevoegd gezag de betrokkene
      bovendien kort buitengewoon verlof verlenen voor ten hoogste vier dagen per jaar, al dan niet met behoud van
      bezoldiging. Ten aanzien van de instellingen, genoemd in [artikel 1, onderdeel d, onder 1°][ref2], is de
      bevoegdheid tot het verlenen van verlof, voor zover het betreft onderwijsondersteunend personeel, niet beperkt tot
      vier dagen per jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0015136#Artikel1
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '20'
        hoofdstuk: '1'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0015136
        artikel: '1'
        hoofdstuk: '1'
  - number: '23.1'
    text: |-
      Het bevoegd gezag kan aan een betrokkene op diens verzoek uit het geheel of een deel van zijn werkzaamheden lang
      buitengewoon verlof verlenen. Indien dit verlof wordt verleend is één van de [artikelen 24][ref1], [25][ref2]
      of [26][ref3] van toepassing, al naar gelang het betreft verlof uitsluitend in het persoonlijk belang, mede in het
      algemeen belang, dan wel overwegend in het algemeen belang.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0015136#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0015136#Artikel26
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '24'
        hoofdstuk: '1'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0015136
        artikel: '25'
        hoofdstuk: '1'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0015136
        artikel: '26'
        hoofdstuk: '1'
        paragraaf: '3'
  - number: '23.2'
    text: |-
      Het verlof gaat niet eerder in dan nadat de betrokkene zich schriftelijk akkoord heeft verklaard met de voorwaarden
      waaronder het verlof wordt verleend.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel23
  - number: '23.3'
    text: |-
      De voorwaarden bevatten in ieder geval een regeling met betrekking tot de betaling van door de betrokkene
      aan het bevoegd gezag verschuldigde premiebijdragen ter zake van pensioenen, vervroegde uittreding en sociale
      verzekeringen, volgens bij of krachtens dit besluit nader te stellen regels.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel23
  - number: '23.4'
    text: |-
      Het verlof strekt zich naar evenredigheid geheel of gedeeltelijk uit over de schoolvakantie dan wel wordt het
      vakantieverlof naar evenredigheid verminderd.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel23
  - number: '23.5'
    text: |-
      Op verzoek van de betrokkene kan het bevoegd gezag in geval van samenloop met andere vormen van verlof, niet
      zijnde vakantieverlof en in andere daarvoor in aanmerking komende gevallen het verleende verlof opschorten dan wel
      intrekken en op een ander tijdstip opnieuw verlenen.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel23
  - number: '23.6'
    text: |-
      De voorschriften in dit artikel zijn niet van toepassing, indien met medewerking van alle betrokkenen het beoogde
      doel door een omzetting van dienst is te bereiken.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel23
  - number: '24'
    text: |-
      Het verlof, bedoeld in [artikel 23][ref1], dat uitsluitend strekt in het persoonlijk belang van de betrokkene, kan
      voor ten hoogste 6 maanden worden verleend en kan ten hoogste tweemaal voor ten hoogste 6 maanden worden verlengd.
      Dit verlof wordt verleend zonder behoud van bezoldiging.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel23
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '23'
        hoofdstuk: '1'
        paragraaf: '3'
  - number: '25'
    text: |-
      Het verlof, bedoeld in [artikel 23][ref1], dat:


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel23
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '23'
        hoofdstuk: '1'
        paragraaf: '3'
  - number: 25.a
    text: is aan te merken als studieverlof, dan wel,
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel25
  - number: 25.b
    text: |-
      ten doel heeft de betrokkene in de gelegenheid te stellen een andere functie te vervullen, en dat naar het oordeel
      van Onze Minister mede het algemeen belang dient, kan, onverminderd de [artikelen 26][ref1] en [27][ref2], voor
      ten hoogste 1 jaar worden verleend en kan ten hoogste tweemaal voor ten hoogste 1 jaar worden verlengd. Dit verlof
      wordt in beginsel verleend zonder behoud van bezoldiging.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0015136#Artikel27
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '26'
        hoofdstuk: '1'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0015136
        artikel: '27'
        hoofdstuk: '1'
        paragraaf: '3'
  - number: '26.1'
    text: |-
      Het verlof, bedoeld in [artikel 23][ref1], dat ten doel heeft de betrokkene in de gelegenheid te stellen anders dan
      in vaste dienst een functie te vervullen:


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel23
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '23'
        hoofdstuk: '1'
        paragraaf: '3'
  - number: 26.1.a
    text: in dienst van een volkenrechtelijke organisatie,
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel26
  - number: 26.1.b
    text: ten behoeve van de Nederlandse Antillen of Aruba,
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel26
  - number: 26.1.c
    text: als deskundige ten behoeve van een vreemde mogendheid,
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel26
  - number: 26.1.d
    text: |-
      in het kader van internationale hulpverlening aan ontwikkelingslanden, kan, indien Onze Minister heeft verklaard
      dat met de verlofverlening het algemeen belang in overwegende mate wordt gediend, voor ten hoogste drie jaren
      worden verleend en kan ten hoogste tweemaal voor ten hoogste 1 jaar worden verlengd. Dit verlof wordt in beginsel
      verleend zonder behoud van bezoldiging.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel26
  - number: '26.2'
    text: |-
      Verlof verleend voor de vervulling van functies aan een instelling van onderwijs, door de regering van het
      ontvangende land in stand gehouden dan wel erkend, wordt in ieder geval geacht in overwegende mate het algemeen
      belang te dienen.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel26
  - number: '27.1'
    text: 'De betrokkene die:'
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel27
  - number: 27.1.a
    text: het lidmaatschap van de Tweede Kamer der Staten-Generaal,
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel27
  - number: 27.1.b
    text: de functie van lid van gedeputeerde staten van een provincie, dan wel
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel27
  - number: 27.1.c
    text: |-
      de functie van substituut-ombudsman, aanvaardt, geniet van rechtswege lang buitengewoon verlof, zonder behoud van
      bezoldiging.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel27
  - number: '27.2'
    text: |-
      Aan de betrokkene die de functie van wethouder van een gemeente aanvaardt, verleent het bevoegd gezag op
      zijn verzoek voor het geheel of een deel van zijn werkzaamheden lang buitengewoon verlof zonder behoud van
      bezoldiging. Voor zover de uitoefening van de taak bij de instelling wordt geschaad, kan dit verlof door het
      bevoegd gezag onder goedkeuring van Onze Minister ook eigener beweging worden verleend, mits de betrokkene
      tevoren is gehoord. Goedkeuring van Onze Minister is niet vereist ten aanzien van scholen, bedoeld in
      [artikel 1, onderdeel d, onder 1°][ref1], voor zover het betreft onderwijsondersteunend personeel.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel1
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '1'
        hoofdstuk: '1'
  - number: '27.3'
    text: |-
      Tijdens dit verlof heeft de betrokkene zo nodig aanspraak op een nonactiviteitswedde op de voet van het daaromtrent
      in de Wet Incompatibiliteiten Staten-Generaal en Europees Parlement ten aanzien van de leden van de Tweede Kamer
      der Staten-Generaal bepaalde.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel27
  - number: '28.1'
    text: |-
      Indien de betrokkene na afloop van hem verleend lang buitengewoon verlof, bedoeld in de
      [artikelen 23 tot en met 27][ref1], als gevolg van beperking van de formatieomvang van de instelling zijn
      werkzaamheden, mede gezien de afvloeiingsregeling, geheel of gedeeltelijk niet kan hervatten, vormt zulks een grond
      voor ontslag.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel23
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '23'
        hoofdstuk: '1'
        paragraaf: '3'
  - number: '28.2'
    text: |-
      De betrokkene die na afloop van een hem verleend lang buitengewoon verlof zijn werkzaamheden niet te bestemder tijd
      hervat, wordt voor de toepassing van dit besluit geacht te zijn ontslagen.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel28
  - number: '28.3'
    text: |-
      Het tweede lid is niet van toepassing indien de betrokkene binnen een redelijke termijn aannemelijk maakt dat hij
      geldige redenen had zijn dienst niet te hervatten, in welk geval het verlof geacht wordt te zijn verlengd tot het
      tijdstip, waarop bedoelde redenen hebben opgehouden te bestaan.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel28
  - number: '29'
    text: |-
      Het bevoegd gezag verleent aan de vrouwelijke betrokkene die een borstkind heeft en die hiervan aan hem kennis
      heeft gegeven behoorlijke gelegenheid haar kind te zogen.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel29
  - number: '30.1'
    text: |-
      Het bevoegd gezag verleent de betrokkene, indien daartoe volgens door Onze Minister te geven nadere regels
      aanleiding bestaat, desgevraagd kort of lang buitengewoon verlof uit het geheel of een deel van zijn werkzaamheden
      voor zover omzetting van de dienst niet mogelijk is, voor:
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel30
  - number: 30.1.a
    text: |-
      het verrichten van werkzaamheden van rechtspositionele aard in of ten behoeve van commissies voor georganiseerd
      overleg als bedoeld in titel 2 van hoofdstuk 4 van dit besluit en het [Overlegbesluit onderwijspersoneel][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006446
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0006446
  - number: 30.1.b
    text: |-
      het verrichten van werkzaamheden ten behoeve van een in de Raad voor het Overheidspersoneelsbeleid
      vertegenwoordigde centrale van verenigingen van ambtenaren of een bij zo'n centrale aangesloten vereniging waarvan
      hij lid is;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel30
  - number: 30.1.c
    text: |-
      het op uitnodiging van een centrale of vereniging als bedoeld onder b, als cursist deelnemen aan een cursus voor
      ten hoogste 6 dagen per twee schooljaren.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel30
  - number: '30.2'
    text: |-
      Het bevoegd gezag verleent de betrokkene, indien daartoe volgens door Onze Minister te geven nadere regels
      aanleiding bestaat, desgevraagd kort of lang buitengewoon verlof uit het geheel of een deel van zijn werkzaamheden
      voor:
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel30
  - number: 30.2.a
    text: |-
      het verrichten van werkzaamheden van onderwijskundige aard in of ten behoeve van het Onderwijsoverleg Primair en
      Voortgezet onderwijs;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel30
  - number: 30.2.b
    text: het verrichten van werkzaamheden ten behoeve van door Onze Minister aan te wijzen adviescommissies.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel30
  - number: '30.3'
    text: |-
      Het verlof, bedoeld in het eerste of het tweede lid, wordt verleend met behoud van bezoldiging. Omtrent de wijze
      waarop dit verlof wordt aangevraagd, de maximumduur en de omvang, alsmede de overige voorwaarden en gevolgen van
      dit verlof, geeft Onze Minister nadere regels.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel30
  - number: '30.4'
    text: |-
      In afwijking van het derde lid wordt het verlof, bedoeld in het eerste lid, dat met name ten doel heeft de
      betrokkene in staat te stellen de functie van bezoldigd bestuurder van een onder b van dat lid bedoelde Centrale of
      vereniging te vervullen, voor ten hoogste twee jaren en zonder behoud van bezoldiging verleend.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel30
  - number: '30.5'
    text: |-
      Indien op grond van het eerste of het tweede lid lang buitengewoon verlof wordt verleend, is ten aanzien van de
      afloop daarvan [artikel 28][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel28
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '28'
        hoofdstuk: '1'
        paragraaf: '3'
  - number: '31.1'
    text: |-
      Het bevoegd gezag verleent de betrokkene desgevraagd buitengewoon verlof in verband met ouderschap. Het
      ouderschapsverlof wordt zonder behoud van bezoldiging verleend en wordt uitsluitend verleend aan de betrokkene
      van wie het dienstverband in het onderwijs ten minste twaalf maanden heeft geduurd op de ingangsdatum van het
      verlof. De aanvraag gaat vergezeld van bewijsstukken waarmee het recht op verlof en de omvang van dat recht worden
      aangetoond en wordt afgehandeld uiterlijk 4 weken nadat deze door het bevoegd gezag is ontvangen.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel31
  - number: '31.2'
    text: |-
      Een betrokkene die als ouder in familierechtelijke betrekking staat totéé n kind heeft recht op 995 uur
      ouderschapsverlof. Indien een betrokkene als ouder tegelijkertijd tot meer dan één kind in een familierechtelijke
      betrekking staat, bestaat er ten aanzien van elk ander kind dan het eerste kind recht op 415 uur ouderschapsverlof.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel31
  - number: '31.3'
    text: |-
      Een betrokkene die blijkens een verklaring uit de gemeentelijke basisadministratie op hetzelfde adres woont als
      één kind en met het oog op adoptie de verzorging en opvoeding van dat kind op zich heeft genomen, heeft recht op
      995 uur ouderschapsverlof. Indien een betrokkene tegelijkertijd de verzorging en opvoeding van meer dan één kind op
      zich heeft genomen, bestaat er ten aanzien van elk ander kind recht op 415 uur ouderschapsverlof.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel31
  - number: '31.4'
    text: |-
      Een betrokkene die blijkens een verklaring uit de gemeentelijke basisadministratie op hetzelfde adres woont als één
      of meer kinderen en duurzaam de verzorging en opvoeding van dat kind of die kinderen als eigen kind of kinderen op
      zich heeft genomen, heeft recht op 995 uur ouderschapsverlof.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel31
  - number: '31.5'
    text: |-
      Voor de betrokkene die is benoemd in een betrekking met een omvang die afwijkt van een normbetrekking wordt het
      ouderschapsverlof naar evenredigheid van de werktijdfactor berekend en rekenkundig afgerond op hele uren.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel31
  - number: '31.6'
    text: Geen recht op ouderschapsverlof bestaat na de datum waarop een kind de leeftijd van acht jaren heeft bereikt.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel31
  - number: '31.7'
    text: |-
      Het ouderschapsverlof wordt opgenomen gedurende een aaneengesloten periode van ten hoogste één jaar. In afwijking
      van de vorige volzin kan een betrokkene het bevoegd gezag vragen het ouderschapsverlof te kunnen opnemen over een
      langere periode dan één jaar. Het bevoegd gezag stemt in met het verzoek tenzij gewichtige redenen zich daartegen
      verzetten.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel31
  - number: '31.8'
    text: Voor een betrokkene, bedoeld in het tweede dan wel derde lid, geldt het zevende lid telkens per kind.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel31
  - number: '31.9'
    text: |-
      Een betrokkene vraagt het ouderschapsverlof schriftelijk aan, ten minste acht weken voor het gewenste tijdstip
      van ingang van het verlof en onder opgave van de periode, het aantal verlofuren per week en de spreiding daarvan
      over de week. Zodra dat mogelijk is, deelt de betrokkene ook de naam en geboortedatum mee van het kind of de
      kinderen waarvoor ouderschapsverlof wordt gevraagd. De betrokkene kan de tijdstippen van ingang en einde van het
      ouderschapsverlof afhankelijk stellen van de datum van bevalling, van het einde van het bevallingsverlof of van de
      aanvang van de verzorging.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel31
  - number: '31.10'
    text: |-
      Het bevoegd gezag kan, na overleg met de betrokkene, de spreiding van de verlofuren over de week op grond van
      gewichtige redenen wijzigen, tot vier weken voor het beoogde tijdstip van ingang van het ouderschapsverlof.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel31
  - number: '31.11'
    text: |-
      Het bevoegd gezag stemt in met een verzoek van de betrokkene om het ouderschapsverlof niet op te nemen of niet
      voort te zetten op grond van onvoorziene omstandigheden, tenzij gewichtige redenen zich hiertegen verzetten. Het
      bevoegd gezag beslist uiterlijk vier weken nadat het verzoek is gedaan, in voorkomend geval onder opgave van de
      gewichtige redenen. In het geval dat het ouderschapsverlof met toepassing van de eerste volzin na het tijdstip van
      ingang daarvan niet wordt voortgezet, vervalt het recht op het overige deel van dat verlof tenzij het verlof wegens
      ziekte van de betrokkene op zijn verzoek wordt opgeschort.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel31
  - number: '32.1'
    text: |-
      Voor de betrokkene die is benoemd in een normbetrekking geldt op jaarbasis een arbeidsduur van 1710 uren
      respectievelijk 1790 uren, waarbij aanspraak bestaat op 51 uren respectievelijk 131 uren verlof.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel32
  - number: '32.2'
    text: |-
      Voor de betrokkene die is benoemd in een betrekking met een omvang van minder dan een normbetrekking wordt het
      verlof, bedoeld in het eerste lid, naar evenredigheid van de werktijdfactor berekend en rekenkundig afgerond op
      hele uren.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel32
  - number: '32.3'
    text: |-
      Het verlof, bedoeld in het eerste lid, wordt in gehele werkdagen opgenomen, met dien verstande dat een restant dat
      kleiner is dan een gehele werkdag voor een gedeelte van een werkdag wordt genoten. Tenzij het dienstbelang zich
      daartegen verzet, kan het verlof op verzoek van betrokkene anders dan in gehele werkdagen worden verleend.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel32
  - number: '32.4'
    text: |-
      Teneinde voor een betrokkene als bedoeld in de [titels 12][ref1] en [13 van dit hoofdstuk][ref2] en
      [artikel 186][ref3], het verbruik van het verlof, bedoeld in het eerste en tweede lid, te berekenen, wordt de
      in het eerste en het tweede lid bedoelde verlofaanspraak uitgedrukt in lesgevende taken, lesgebonden taken of
      behandeltaken en wel door de in het eerste lid bedoelde verlofaanspraak bij een arbeidsduur op jaarbasis van
      1710 uren vast te stellen op 31 uren en bij een arbeidsduur op jaarbasis van 1790 uren op 80 uren. Vervolgens
      wordt voor elk dagdeel dat een betrokkene als bedoeld in de [ titels 12][ref4] en [13 van dit hoofdstuk][ref5] en
      [artikel 186][ref6], verlof geniet op grond van dit artikel, de verlofaanspraak van betrokkene verminderd met het
      aantal uren dat op de betreffende dagdelen in de vier hoogste groepen wordt lesgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Hoofdstuk1
      [ref2]: https://wetten.overheid.nl/BWBR0015136#Hoofdstuk1
      [ref3]: https://wetten.overheid.nl/BWBR0015136#Artikel186
      [ref4]: https://wetten.overheid.nl/BWBR0015136#Hoofdstuk1
      [ref5]: https://wetten.overheid.nl/BWBR0015136#Hoofdstuk1
      [ref6]: https://wetten.overheid.nl/BWBR0015136#Artikel186
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0015136
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0015136
        hoofdstuk: '1'
      - id: ref3
        bwb_id: BWBR0015136
        artikel: '186'
        hoofdstuk: '1'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0015136
        hoofdstuk: '1'
      - id: ref5
        bwb_id: BWBR0015136
        hoofdstuk: '1'
      - id: ref6
        bwb_id: BWBR0015136
        artikel: '186'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: '32.5'
    text: |-
      Na verkregen instemming van het decentraal georganiseerd overleg kunnen van het vierde lid afwijkende afspraken
      worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel32
  - number: '32.6'
    text: |-
      Het bevoegd gezag en betrokkene maken afspraken over het tijdstip waarop het verlof, bedoeld in dit artikel, wordt
      opgenomen. Indien geen overeenstemming wordt bereikt over het tijdstip van opnemen van het verlof, beslist het
      bevoegd gezag. Voor de betrokkene die is benoemd in een functie als bedoeld in [titel 14 van dit hoofdstuk][ref1]
      met uitzondering van een functie als bedoeld in [artikel 186][ref2], geldt dat 51 uur van het verlof op grond
      van dit artikel op verzoek van betrokkene buiten de schoolvakanties wordt verleend en wordt vermeld in de
      werktijdenregeling, bedoeld in [artikel 178, tweede lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Hoofdstuk1
      [ref2]: https://wetten.overheid.nl/BWBR0015136#Artikel186
      [ref3]: https://wetten.overheid.nl/BWBR0015136#Artikel178
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0015136
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0015136
        artikel: '186'
        hoofdstuk: '1'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0015136
        artikel: '178'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: '32.7'
    text: |-
      Onder door Onze Minister te stellen voorwaarden kan het verlof, bedoeld in dit artikel, worden opgenomen in een
      later schooljaar.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel32
  - number: '33.1'
    text: |-
      Tot een nader door Onze Minister te bepalen datum kan aan de betrokkene behorend tot het onderwijsgevend personeel
      die op zijn verzoek geen gebruik maakt van de voor hem geldende arbeidsduurverkorting door een verlaging van de
      normbetrekking met ingang van 1 augustus 1991, na een periode van minimaal 4 jaar en maximaal 8 jaar verlof worden
      verleend, waarvan de tijdsduur overeenkomt met de tijd van de niet genoten arbeidsduurverkorting.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel33
  - number: '33.2'
    text: |-
      Het in het eerste lid bedoelde verlof wordt vermeerderd met extra verlof waarvan de tijdsduur overeenkomt met een
      percentage van de niet genoten arbeidsduurverkorting.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel33
  - number: '33.3'
    text: Onze Minister geeft nadere voorschriften voor de toepassing van het in dit artikel bedoelde verlof.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel33
  - number: '34'
    text: 'In deze titel wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel34
  - number: 34.a
    text: |-
      burgerlijke beloning: de bezoldiging, bedoeld in [artikel 1, onderdeel j][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel1
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '1'
        hoofdstuk: '1'
  - number: 34.b
    text: 'militaire beloning: hetgeen als zodanig door Onze Ministers van Defensie en Financiën is aangemerkt.'
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel34
  - number: '35.1'
    text: |-
      De betrokkene die ingevolge wettelijke verplichting op grond van de Kaderwet dienstplicht als militair in
      werkelijke dienst is, geniet van rechtswege verlof.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel35
  - number: '35.2'
    text: |-
      Hij behoudt tijdens dit verlof zijn burgerlijke beloning, voor zover de bepalingen van deze titel hem daarop
      aanspraak geven.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel35
  - number: '35.3'
    text: |-
      Op de betrokkene die is benoemd in tijdelijke dienst, zijn de bepalingen van deze titel slechts van toepassing,
      zolang hij aan de instelling is verbonden.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel35
  - number: '35.4'
    text: |-
      Op de betrokkene, die is benoemd in één of meer betrekkingen die elk voor zich kleiner zijn dan de omvang van een
      normbetrekking, zijn de voorschriften in de [artikelen 36][ref1] en [40][ref2] van toepassing naar evenredigheid
      van:


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0015136#Artikel40
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '36'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0015136
        artikel: '40'
        hoofdstuk: '1'
  - number: 35.4.a
    text: |-
      de omvang van de betrekking die kleiner is dan de omvang van een normbetrekking ten opzichte van de totale omvang
      van de betrekkingen;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel35
  - number: 35.4.b
    text: |-
      – in geval de totale omvang van de betrekkingen kleiner is dan een normbetrekking – die omvang van de betrekking
      die kleiner is dan de omvang van een normbetrekking ten opzichte van de normbetrekking.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel35
  - number: '36'
    text: |-
      De betrokkene die ingevolge wettelijke verplichting voor opleiding en oefening als militair in werkelijke dienst
      is, geniet de aan zijn betrekking verbonden burgerlijke beloning tot een bedrag, gelijk aan het op hem te verhalen
      gedeelte van de pensioenbijdrage en de VUT-bijdrage ingevolge de regels van het bestuur VUT-fonds met betrekking
      tot financiering VUT-aanspraken.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel36
  - number: '37.1'
    text: |-
      De betrokkene die voor een herhalingsoefening als militair in werkelijke dienst is, geniet de aan zijn betrekking
      verbonden burgerlijke beloning, voor zover deze meer bedraagt dan zijn militaire beloning.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel37
  - number: '37.2'
    text: |-
      Voor de toepassing van het eerste lid wordt de militaire beloning verminderd met een eventueel bedrag wegens genot
      van voeding en huisvesting.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel37
  - number: '37.3'
    text: 'Voor de toepassing van deze titel worden met herhalingsoefening gelijkgesteld:'
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel37
  - number: 37.3.a
    text: |-
      het in dienst komen dan wel het in aansluiting aan een herhalingsoefening langer in dienst blijven voor een
      onderzoek omtrent een strafbaar feit of een krijgstuchtelijk vergrijp, waarvan de militair wordt verdacht of
      beklaagd;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel37
  - number: 37.3.b
    text: |-
      het in dienst komen dan wel het in aansluiting aan een herhalingsoefening langer in dienst blijven teneinde
      rekening en verantwoording af te leggen van gevoerd beheer;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel37
  - number: 37.3.c
    text: |-
      het in dienst komen om gehoord te worden omtrent een bij de Kroon of bij Onze Minister van Defensie ingediend
      bezwaarschrift;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel37
  - number: 37.3.d
    text: 'het in aansluiting aan een herhalingsoefening langer in dienst blijven wegens:'
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel37
  - number: 37.3.d.1
    text: ziekte;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel37
  - number: 37.3.d.2
    text: het niet tijdig bereiken van de vereiste graad van geoefendheid als gevolg van ziekte;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel37
  - number: 37.3.d.3
    text: het heersen of geheerst hebben van een besmettelijke ziekte;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel37
  - number: 37.3.e
    text: hetgeen voorts door Onze Minister van Defensie als zodanig is aangemerkt.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel37
  - number: '38.1'
    text: |-
      Gedurende 2 weken na zijn opkomst in werkelijke dienst geniet de betrokkene de volle aan zijn betrekking verbonden
      burgerlijke beloning indien hij bij zijn opkomst in werkelijke dienst anders dan voor herhalingsoefening de eerste
      12 maanden van de opleiding en oefening of zoveel korter als deze opleiding en oefening duurt reeds in werkelijke
      dienst heeft doorgebracht.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel38
  - number: '38.2'
    text: |-
      Na afloop van de in het eerste lid bedoelde termijn is [artikel 36][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel36
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '36'
        hoofdstuk: '1'
  - number: '39'
    text: |-
      Voor zover de werkelijke dienst, niet zijnde de opleiding en oefening, wordt vervuld tijdens zijn vakantieverlof,
      geniet de betrokkene de volle aan zijn betrekking verbonden burgerlijke beloning.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel39
  - number: '40.1'
    text: 'Deze titel is van overeenkomstige toepassing ten aanzien van de betrokkene die:'
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel40
  - number: 40.1.a
    text: |-
      is te werk gesteld in de zin van [artikel 9 van de Wet gewetensbezwaren militaire dienst][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002386#Artikel9
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0002386
        artikel: '9'
  - number: 40.1.b
    text: op grond van een verbintenis bij het Korps Nationale Reserve in werkelijke dienst is;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel40
  - number: 40.1.c
    text: op grond van een verbintenis bij het reservepersoneel der krijgsmacht als militair in werkelijke dienst is;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel40
  - number: 40.1.d
    text: |-
      op grond van een verbintenis als vrijwilliger in de zin van artikel 2, eerste lid, onder a of b, van de
      Rechtstoestandregeling reservepolitie of van een overeenkomstige verbintenis als bedoeld in de artikelen 53 en 54
      van die regeling in werkelijke dienst is;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel40
  - number: 40.1.e
    text: |-
      op grond van een tijdelijke verbintenis als legeraalmoezenier, legerpredikant of anderszins als geestelijk
      verzorger in werkelijke dienst is;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel40
  - number: 40.1.f
    text: |-
      op grond van een verbintenis als monumentenwachter in de zin van het Besluit Monumentenwacht in werkelijke dienst
      is;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel40
  - number: 40.1.g
    text: |-
      op grond van een andere bijzondere verbintenis in werkelijke of daarmee gelijk te stellen dienst is, indien dit bij
      koninklijk besluit is bepaald.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel40
  - number: '40.2'
    text: |-
      De betrokkenen, bedoeld in het eerste lid, onder d en e, worden gelijkgesteld met de betrokkene, die voor een
      herhalingsoefening als militair in werkelijke dienst is.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel40
  - number: '41'
    text: 'In deze titel wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel41
  - number: 41.a
    text: 'overledene: hij die op de dag van zijn overlijden betrokkene was;'
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel41
  - number: 41.b
    text: |-
      uitkeringsbasis: de tot een maandbedrag herleide bezoldiging die voor de betrokkene gold op de dag van overlijden,
      vermeerderd met het bedrag van de vakantie-uitkering over de desbetreffende maand.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel41
  - number: '42.1'
    text: 'In aanmerking voor een uitkering bij overlijden komen in navolgende rangorde:'
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel42
  - number: 42.1.a
    text: |-
      de weduwe of weduwnaar, de achtergebleven levenspartner dan wel de achtergebleven geregistreerde partner van wie de
      overledene niet duurzaam gescheiden leefde;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel42
  - number: 42.1.b
    text: de minderjarige kinderen van de overledene;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel42
  - number: 42.1.c
    text: de meerderjarige kinderen, ouders, broers of zusters voor wie de overledene kostwinner was.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel42
  - number: '42.2'
    text: |-
      Onder kinderen in de zin van het eerste lid worden mede begrepen natuurlijke kinderen en kinderen voor wie de
      overledene de pleegouderlijke zorg droeg. Onder pleegouderlijke zorg wordt verstaan de zorg voor het onderhoud
      en de opvoeding van het kind als was het een eigen kind, onafhankelijk van enige verplichting daartoe of van het
      genieten van een vergoeding daarvoor.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel42
  - number: '43.1'
    text: |-
      De uitkering bij overlijden is gelijk aan het bedrag dat gevormd wordt door de uitkeringsbasis met 3 te
      vermenigvuldigen.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel43
  - number: '43.2'
    text: |-
      Het bedrag, bedoeld in het eerste lid, wordt zo spoedig mogelijk, in ieder geval binnen een maand na het
      overlijden, door het bevoegd gezag uitgekeerd.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel43
  - number: '44.1'
    text: |-
      Gedurende de maand van het overlijden en de volgende drie maanden behouden de achterblijvende gezinsleden waaronder
      begrepen de achtergebleven levenspartner, het recht op het gebruik van de dienstwoning waarin zij met de overledene
      woonden.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel44
  - number: '44.2'
    text: |-
      Indien door de overledene voor het gebruik van de dienstwoning of voor het verbruik van verwarming, gas,
      elektriciteit en water een vergoeding verschuldigd was, voldoen de achtergebleven gezinsleden, daaronder begrepen
      de achtergebleven levenspartner, deze vergoeding over de tijd waarin zij het gebruik van de dienstwoning behouden.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel44
  - number: '45.1'
    text: |-
      Indien de nabestaanden, bedoeld in [artikel 42][ref1], aanspraak hebben op een overlijdensuitkering als
      bedoeld in [artikel 674, tweede lid, van Boek 7 van het Burgerlijk Wetboek][ref2], dan wel als bedoeld in
      [artikel 35 van de Ziektewet][ref3] of [artikel 3:16 van de Wet Arbeid en Zorg][ref4] wordt de uitkering bij
      overlijden, bedoeld in deze titel, slechts uitbetaald voor zover deze de genoemde uitkeringen te boven gaat.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel674
      [ref3]: https://wetten.overheid.nl/BWBR0001888#Artikel35
      [ref4]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '42'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '674'
      - id: ref3
        bwb_id: BWBR0001888
        artikel: '35'
      - id: ref4
        bwb_id: BWBR0013008
        artikel: '3'
  - number: '45.2'
    text: |-
      In geval van overlijden als militair in werkelijke dienst wordt de uitkering bij overlijden verminderd met het
      bedrag van de overeenkomstige uitkering, die uit hoofde van militaire dienst ter zake wordt gedaan.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel45
  - number: '46'
    text: |-
      Op de ingevolge de voorgaande artikelen berekende uitkering bij overlijden wordt in mindering gebracht de reeds
      vóór zijn overlijden aan de betrokkene uitbetaalde bezoldiging over een na zijn overlijden gelegen tijdvak.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel46
  - number: '47'
    text: |-
      Indien de overledene geen nabestaanden als bedoeld in [artikel 42][ref1] nalaat, kan het bedrag, bedoeld in
      [artikel 43][ref2], door het bevoegd gezag geheel of gedeeltelijk worden uitgekeerd voor de betaling van de
      kosten van de laatste ziekte en van de lijkbezorging, voor zover de nalatenschap voor de betaling van die kosten
      ontoereikend is.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0015136#Artikel43
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '42'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0015136
        artikel: '43'
        hoofdstuk: '1'
  - number: '48'
    text: |-
      Ontslag op grond van opheffing van de instelling of de betrekking dan wel wegens zodanige verandering in de
      inrichting of de dienst van de instelling dat de werkzaamheden van een of meer betrokkenen overbodig worden,
      geschiedt aan de hand van een afvloeiingsregeling.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel48
  - number: '49.1'
    text: |-
      Het bevoegd gezag stelt zo spoedig mogelijk, doch in ieder geval binnen drie maanden na de datum waarop dit besluit
      voor de instelling van toepassing is geworden, een afvloeiingsregeling vast voor het personeel in vaste dienst,
      waarin de belangen van de instelling en van de betrokkenen zoveel mogelijk gelijkelijk in acht worden genomen.
      Het bevoegd gezag kan deze taak overdragen aan de vereniging van instellingsbesturen waarbij de instelling is
      aangesloten.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel49
  - number: '49.2'
    text: |-
      De regeling wordt niet vastgesteld dan nadat overleg is gepleegd met verenigingen als bedoeld in
      [artikel 64 van de Wet op het primair onderwijs][ref1] en [artikel 66 van de Wet op de expertisecentra][ref2], voor
      zover deze hun werkzaamheden uitstrekken over het aan zodanige instellingen verbonden personeel.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel64
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel66
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '64'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '66'
  - number: '49.3'
    text: |-
      Bij samenvoeging stelt het bevoegd gezag een afvloeiingsregeling vast met inachtneming van het eerste en tweede
      lid. Van de in de eerste volzin bedoelde afvloeiingsregeling dient een overgangsregeling deel uit te maken. In
      de overgangsregeling is vastgelegd op welke wijze op het moment van samenvoeging de afvloeiingsvolgorden, zoals
      vastgesteld aan de bij de samenvoeging betrokken scholen tot één volgorde worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel49
  - number: '49.4'
    text: |-
      Ter vermijding van kennelijke onbillijkheid en wanneer het belang van de instelling dit kennelijk vereist, kan
      bij de verlening van ontslag van de vastgestelde afvloeiingsregeling worden afgeweken, met dien verstande dat,
      indien de omvang van de voorgenomen afvloeiing daartoe aanleiding geeft, deze geschiedt naar een bepaald vooraf
      vastgesteld en aan de betrokkenen kenbaar gemaakt plan.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel49
  - number: '50'
    text: |-
      Het bevoegd gezag draagt er zorg voor dat de regeling steeds op een voor de betrokkenen toegankelijke plaats in de
      instelling ter inzage beschikbaar is.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel50
  - number: '51.1'
    text: 'In deze titel wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel51
  - number: 51.1.a
    text: |-
      hoofdinstelling: 'indien de betrokkene werkzaam is aan: - één instelling: de desbetreffende instelling;'
        - twee of meer instellingen: de instelling waaraan hij de meeste tijd werkzaam is;
        - twee of meer instellingen waaraan hij dezelfde tijd werkzaam is: de instelling met de kleinste afstand tot de
      woning van betrokkene;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel51
  - number: 51.1.b
    text: |-
      standplaats: de gemeente of het met name bekende afzonderlijk liggend deel van die gemeente waarin door betrokkene
      voor de hoofdinstelling de meeste werkzaamheden worden verricht, waarbij geldt dat indien door betrokkene voor
      de hoofdinstelling in verschillende gemeenten evenveel werkzaamheden worden verricht: de gemeente of het met name
      bekende afzonderlijk liggend deel van die gemeente met de kleinste afstand tot de woning van betrokkene;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel51
  - number: 51.1.c
    text: |-
      standplaatsbetrekking: de betrekking of een combinatie van betrekkingen met een omvang van tenminste het 6/10 deel
      van de normbetrekking;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel51
  - number: 51.1.d
    text: 'gebouw: de plaats waar de betrokkene zijn werkzaamheden verricht;'
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel51
  - number: 51.1.e
    text: 'plaats van tewerkstelling:'
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel51
  - number: 51.1.e.1°
    text: het gebouw van de hoofdinstelling in de standplaats waar betrokkene werkzaam is, dan wel
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel51
  - number: 51.1.e.2°
    text: |-
      indien in de standplaats binnen de hoofdinstelling sprake is van verschillende gebouwen: het gebouw waar betrokkene
      de meeste werkzaamheden verricht, dan wel
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel51
  - number: 51.1.e.3°
    text: |-
      indien in de standplaats binnen de hoofdinstelling sprake is van verschillende gebouwen waar door betrokkene
      evenveel werkzaamheden worden verricht: het gebouw met de kleinste afstand tot de woning van betrokkene, dan wel
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel51
  - number: 51.1.e.4°
    text: |-
      indien de uitoefening van de functie van betrokkene aan de hoofdinstelling zich uitstrekt over een meer of minder
      omvangrijk geografisch gebied (rayon of regio): de door het bevoegde gezag aangewezen plaats;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel51
  - number: 51.1.f
    text: |-
      woonplaats: de gemeente of het met name bekende afzonderlijk liggend deel van die gemeente, waar de betrokkene
      metterwoon is gevestigd;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel51
  - number: 51.1.g
    text: |-
      zone: de eenheid waarin het bus- en tramlijnennet is verdeeld en die de basis vormt van de strippenkaart in het
      stad- en streekvervoer;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel51
  - number: 51.1.h
    text: |-
      jaarbezoldiging: de bezoldiging of de som van de bezoldigingen in de maand van verhuizen, tot ten hoogste de
      bezoldiging die verbonden is aan een normbetrekking vermeerderd met het percentage van de vakantie-uitkering met
      inachtneming van het minimumbedrag, in voorkomende gevallen verhoogd met:
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel51
  - number: 51.1.h.1°
    text: |-
      een eventueel in die maand genoten uitkering als bedoeld in het Besluit werkloosheid onderwijs- en
      onderzoekpersoneel, alsmede de daarmede overeenkomende uitkeringsregelingen, als door Onze Minister aan te geven;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel51
  - number: 51.1.h.2°
    text: |-
      een eventueel in die maand genoten uitkering krachtens dan wel overeenkomstig de Regeling uitkering wegens
      functioneel leeftijdsontslag of de Uitkeringswet gewezen militairen, zoals deze uitkering is of zou zijn
      vastgesteld indien de leeftijd van 50 jaar nog niet is of zou zijn bereikt; een en ander herleid tot een
      jaarbedrag;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel51
  - number: 51.1.i
    text: |-
      gezamenlijke jaarbezoldiging: de jaarbezoldiging vermeerderd met de inkomsten onder welke benaming dan ook genoten,
      door de echtgenoot die geen betrokkene is;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel51
  - number: 51.1.j
    text: 'berekeningstijdstip:'
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel51
  - number: 51.1.j.1°
    text: de datum waarop de betrokkene verhuist;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel51
  - number: 51.1.j.2°
    text: |-
      indien de betrokkene verhuist voor de datum dat de functie feitelijk wordt vervuld, de datum van ingang van het
      werkzaam zijn in een standplaatsbetrekking;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel51
  - number: 51.1.k
    text: |-
      voor het eerst in dienst treden: in dienst treden bij een instelling anders dan in geval van een overgang binnen
      een maand:
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel51
  - number: 51.1.k.1°
    text: van de ene naar een andere instelling,
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel51
  - number: 51.1.k.2°
    text: |-
      van de overheid naar een instelling, terwijl de tijd waarin een ontslaguitkering wordt genoten niet als een
      onderbreking tussen beide benoemingen wordt beschouwd;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel51
  - number: 51.1.l
    text: 'verplaatsing: de verandering van de standplaats van de betrokkene in opdracht van het bevoegd gezag;'
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel51
  - number: 51.1.m
    text: |-
      gezinsleden: de echtgeno(o)t(e) van de betrokkene en de eigen kinderen, stief- en pleegkinderen die deel uitmaken
      van het gezin;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel51
  - number: 51.1.n
    text: |-
      dienstwoning: de door het bevoegd gezag aan de betrokkene in verband met de uitoefening van de functie ter bewoning
      aangewezen woning, waarvoor van rijkswege een tegemoetkoming in de stichtingskosten of onderhoudskosten aan het
      bevoegd gezag is verleend;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel51
  - number: 51.1.o
    text: |-
      dienstreis: de reis die, anders dan bedoeld in [artikel 59][ref1], in het belang van het onderwijs dan wel van de
      instelling en in opdracht van het bevoegd gezag in of buiten de standplaats wordt gemaakt;


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel59
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '59'
        hoofdstuk: '1'
  - number: '52'
    text: Voor het ontstaan van een standplaatsbetrekking blijven vervangingswerkzaamheden buiten beschouwing.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel52
  - number: '53.1'
    text: |-
      De betrokkene, die is verhuisd en een woning heeft betrokken die gelegen is op of binnen een afstand van 5 zones
      van de plaats van tewerkstelling, ontvangt een tegemoetkoming in de verhuiskosten verleend indien:
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel53
  - number: 53.1.a
    text: hij is benoemd in een standplaatsbetrekking;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel53
  - number: 53.1.b
    text: hij voor tenminste één jaar is benoemd;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel53
  - number: 53.1.c
    text: hij op een afstand van 6 of meer zones woonde van de plaats van tewerkstelling;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel53
  - number: 53.1.d
    text: |-
      de reisafstand tussen de woonplaats en de plaats van tewerkstelling als gevolg van de verhuizing met ten minste 5
      zones is bekort.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel53
  - number: '53.2'
    text: |-
      Een tegemoetkoming in de verhuiskosten wordt slechts éénmaal in de vijf jaar verleend, tenzij de verhuizing verband
      houdt met een verandering van betrekking die het gevolg is van een ontslag of van het vooruitzicht op ontslag, dat
      niet op eigen verzoek is verleend en niet aan schuld of toedoen van de betrokkene is te wijten.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel53
  - number: '53.3'
    text: |-
      De tegemoetkoming in verhuiskosten wordt verleend onder de voorwaarde dat de betrokkene vooraf schriftelijk heeft
      verklaard dat hij bekend is met de terugbetalingsverplichting, bedoeld in [artikel 58][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel58
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '58'
        hoofdstuk: '1'
  - number: '54.1'
    text: |-
      Aan de betrokkene die in opdracht van het bevoegd gezag een dienstwoning betrekt of verlaat, wordt een
      tegemoetkoming in verhuiskosten verleend, tenzij het verlaten van de dienstwoning het gevolg is van een ontslag dat
      op zijn verzoek, anders dan wegens het bereiken of bereikt hebben van de pensioengerechtigde leeftijd, of anders
      dan met recht op uitkering voor vervroegd uittreden is verleend, of aan schuld of toedoen van de betrokkene is
      te wijten.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel54
  - number: '54.2'
    text: |-
      Indien het verlaten van een dienstwoning verband houdt met het overlijden van de betrokkene, wordt een
      tegemoetkoming in de verhuiskosten verleend aan de nagelaten gezinsleden, daaronder begrepen de achtergebleven
      levenspartner.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel54
  - number: '55.1'
    text: 'De tegemoetkoming in verhuiskosten kan slechts bestaan uit:'
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel55
  - number: 55.1.a
    text: |-
      een tegemoetkoming in de kosten van transport van de bagage en van de inboedel van de betrokkene en zijn
      gezinsleden naar de nieuwe woning, waaronder begrepen de kosten van het in- en uitpakken van breekbare zaken, en
      in de te maken reiskosten ter bezichtiging van woonruimte en in de eventuele opknapkosten aan de nieuwe woning en
      dubbele woonkosten, van in totaal een bedrag als aangegeven in [bijlage 3, onder 1][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0015136
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0015136
  - number: 55.1.b
    text: een tegemoetkoming voor alle andere direct uit de verhuizing voortvloeiende kosten.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel55
  - number: '55.2'
    text: |-
      Indien de verhuizing door betrokkene in eigen beheer wordt uitgevoerd, ontvangt betrokkene slechts de helft van het
      in het eerste lid, onder a, bedoelde bedrag.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel55
  - number: '55.3'
    text: |-
      Het in het eerste lid, onder b, bedoelde bedrag wordt, afhankelijk van het aantal woon/slaapvertrekken dat de
      achter te laten woning telde, gesteld op een percentage van de jaarbezoldiging die de betrokkene genoot op de dag
      waarop de nieuwe woning kon worden betrokken zoals aangegeven in [bijlage 3, onder 2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015136
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0015136
  - number: '55.4'
    text: |-
      Voor de betrokkene die inwonend was bij de ouders is het laagst genoemde percentage zoals aangegeven in
      [bijlage 3, onder 2][ref1], van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0015136
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0015136
  - number: '55.5'
    text: |-
      De betrokkene die een woning heeft betrokken op een reisafstand van meer dan 2 zones van de plaats van
      tewerkstelling, ontvangt slechts 80% van het bedrag van de in het eerste lid, onder a en b, bedoelde
      tegemoetkomingen.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel55
  - number: '55.6'
    text: |-
      De tegemoetkoming in de verhuiskosten voor de betrokkene die voor het eerst bij een instelling in dienst treedt en
      op enig tijdstip wordt benoemd in een standplaatsbetrekking, bedraagt in afwijking van het eerste tot en met vijfde
      lid, de helft van de vergoeding waarop hij ingevolge die leden aanspraak zou hebben.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel55
  - number: '56.1'
    text: |-
      Bij een verhuizing van een gezin waarvan beide echtgenoten terzake van de verhuizing aanspraak kunnen
      maken op een tegemoetkoming in de verhuiskosten op grond van deze titel, ontvangt, met overeenkomstige
      toepassing van [artikel 55, tweede tot en met zesde lid][ref1], ieder van beiden de helft van de in
      [artikel 55, eerste lid, onder a en b][ref2], bedoelde vergoedingen. De volgens [artikel 55, derde lid][ref3], vast
      te stellen vergoeding wordt berekend over de gezamenlijke jaarbezoldiging.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel55
      [ref2]: https://wetten.overheid.nl/BWBR0015136#Artikel55
      [ref3]: https://wetten.overheid.nl/BWBR0015136#Artikel55
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '55'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0015136
        artikel: '55'
        hoofdstuk: '1'
      - id: ref3
        bwb_id: BWBR0015136
        artikel: '55'
        hoofdstuk: '1'
  - number: '56.2'
    text: |-
      Indien het betreft een verhuizing van een gezin waarvan een van de echtgenoten aanspraak kan maken op een
      tegemoetkoming in de verhuiskosten op grond van deze titel en de andere echtgenoot uit anderen hoofde terzake van
      deze verhuizing aanspraak maakt op een tegemoetkoming, wordt de tegemoetkoming in verhuiskosten aan de betrokkene
      slechts verleend voorzover deze de tegemoetkoming die uit anderen hoofde wordt ontvangen te boven gaat.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel56
  - number: '56.3'
    text: |-
      De berekening van de tegemoetkoming voor de in het tweede lid bedoelde betrokkene geschiedt door, met
      overeenkomstige toepassing van [artikel 55, tweede tot en met zesde lid][ref1], het totaal van de tegemoetkomingen,
      bedoeld in [artikel 55, eerste lid][ref2], te verminderen met de tegemoetkoming die de echtgenoot uit andere hoofde
      ontvangt. De volgens [artikel 55, derde lid][ref3], vast te stellen vergoeding wordt berekend over de gezamenlijke
      jaarbezoldiging.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel55
      [ref2]: https://wetten.overheid.nl/BWBR0015136#Artikel55
      [ref3]: https://wetten.overheid.nl/BWBR0015136#Artikel55
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '55'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0015136
        artikel: '55'
        hoofdstuk: '1'
      - id: ref3
        bwb_id: BWBR0015136
        artikel: '55'
        hoofdstuk: '1'
  - number: '57.1'
    text: |-
      Aan de betrokkene wordt geen tegemoetkoming in de verhuiskosten voor een verhuizing verleend, indien de verhuizing
      niet heeft plaatsgevonden binnen drie jaar na de datum waarop betrokkene is benoemd in een standplaatsbetrekking
      doch binnen twee jaar na benoeming in vaste dienst in een standplaatsbetrekking.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel57
  - number: '57.2'
    text: |-
      Aan de betrokkene wordt geen tegemoetkoming verleend in de verhuiskosten voor een verhuizing in verband met een
      verplaatsing, indien die verhuizing niet heeft plaatsgevonden binnen twee jaar na de datum van de verplaatsing.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel57
  - number: '58.1'
    text: |-
      De betrokkene aan wie een tegemoetkoming in de verhuiskosten wordt verleend, is, behoudens het tweede lid, gehouden
      de ontvangen tegemoetkoming terug te betalen indien zijn dienstverband op zijn verzoek of ten gevolge van aan
      hemzelf te wijten feiten of omstandigheden wordt beëindigd, tenzij deze beëindiging ingaat twee jaren of langer na
      de datum waarop de betrokkene in een standplaatsbetrekking is benoemd of is verplaatst en deze beëindiging heeft
      plaatsgevonden een jaar of langer na de datum van de verhuizing.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel58
  - number: '58.2'
    text: |-
      Geen terugbetalingsverplichting bestaat, indien de betrokkene, bedoeld in het eerste lid, ontslag neemt uit een
      standplaatsbetrekking teneinde aansluitend een zodanige betrekking aan een andere instelling te aanvaarden, mits de
      plaats van tewerkstelling binnen of op een afstand van 5 zones van zijn woonplaats is gelegen.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel58
  - number: '58.3'
    text: |-
      De betrokkene die binnen twee jaar na de verhuizing, anders dan in verband met het beëindigen van het dienstverband
      bij de instelling waarvoor hem deze tegemoetkoming werd toegekend of wegens een verplaatsing van deze instelling,
      verhuist naar een woonplaats die verder weg is gelegen van de plaats van tewerkstelling, is gehouden de ontvangen
      tegemoetkoming in de verhuiskosten terug te betalen:
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel58
  - number: 58.3.a
    text: |-
      gedeeltelijk, indien hij zich in een woonplaats binnen of op een afstand van 5 zones van zijn plaats van
      tewerkstelling gevestigd heeft en wel voor zover de tegemoetkoming meer bedraagt dan de tegemoetkoming die hem zou
      zijn toegekend indien hij zich direct in deze woonplaats zou hebben gevestigd;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel58
  - number: 58.3.b
    text: |-
      geheel, indien hij zich in een woonplaats op een afstand van meer dan 5 zones van zijn plaats van tewerkstelling
      gevestigd heeft.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel58
  - number: '59.1'
    text: |-
      Aan de betrokkene wordt door het bevoegd gezag maandelijks, onverminderd [artikel 61][ref1], een tegemoetkoming in
      de reiskosten tussen de woning en het gebouw of de gebouwen verleend, indien de te reizen afstand tussen de woning
      en het gebouw of de gebouwen meer dan twee zones bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel61
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '61'
        hoofdstuk: '1'
  - number: '59.2'
    text: |-
      De tegemoetkoming wordt per betrekking, en voor elk gebouw binnen de betrekking afzonderlijk, afhankelijk van
      de reisafstand in zones tussen de woning en het gebouw of de gebouwen en van het aantal dagen dat per week naar
      dit gebouw of deze gebouwen wordt gereisd, vastgesteld aan de hand van de in [bijlage 4][ref1] bij dit besluit
      opgenomen tabel.


      [ref1]: https://wetten.overheid.nl/BWBR0015136
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0015136
  - number: '59.3'
    text: |-
      De in het tweede lid bedoelde tabel is slechts van toepassing indien in een maand gemiddeld ten minste één keer
      per week wordt gereisd tussen de woning en hetzelfde gebouw. Voor de toepassing van de tabel in hiervan afwijkende
      gevallen zijn in [bijlage 4][ref1] richtlijnen gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0015136
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0015136
  - number: '60.1'
    text: |-
      Indien door een betrokkene over een aaneengesloten tijdvak van meer dan één week anders dan in verband met
      vakantieverlof niet is gereisd tussen de woning en het gebouw of de gebouwen, wordt de aan de betrokkene toe te
      kennen tegemoetkoming in de reiskosten vanaf de tweede week naar evenredigheid verlaagd.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel60
  - number: '60.2'
    text: |-
      Indien door een betrokkene in verband met de datum van indiensttreding of ontslag slechts een deel van een maand
      tenminste één keer per week wordt gereisd tussen de woning en hetzelfde gebouw, dient de tegemoetkoming in de
      reiskosten naar evenredigheid te worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel60
  - number: '61.1'
    text: |-
      De betrokkene, bedoeld in [titel 3, paragraaf 1, van dit hoofdstuk][ref1], die voor een heel schooljaar is
      benoemd, heeft per betrekking slechts aanspraak op een tegemoetkoming in de reiskosten over ten hoogste tien
      kalendermaanden per schooljaar. De tegemoetkoming wordt niet uitbetaald over de maanden juli en augustus.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Hoofdstuk1
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0015136
        hoofdstuk: '1'
        paragraaf: '1'
  - number: '61.2'
    text: |-
      De betrokkene, bedoeld in [titel 3, paragraaf 2, van dit hoofdstuk][ref1], die voor een geheel schooljaar is
      benoemd, heeft per betrekking slechts aanspraak op een tegemoetkoming in de reiskosten over ten hoogste elf
      kalendermaanden per schooljaar. De tegemoetkoming wordt niet uitbetaald over de maand juli.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Hoofdstuk1
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0015136
        hoofdstuk: '1'
        paragraaf: '2'
  - number: '61.3'
    text: |-
      Indien de betrokkene in een betrekking is benoemd voor een kortere periode dan een geheel schooljaar, vindt er,
      voor zover de in het eerste respectievelijk tweede lid, genoemde termijnen niet worden overschreden, geen inhouding
      plaats van de tegemoetkoming in de gemaakte reiskosten.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel61
  - number: '62.1'
    text: |-
      De aan een betrokkene toe te kennen tegemoetkoming in reiskosten bedraagt per schooljaar per betrekking of
      combinatie van betrekkingen niet meer dan het bedrag als aangegeven in [bijlage 3, onder 3][ref1], van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0015136
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0015136
  - number: '62.2'
    text: |-
      De tegemoetkoming in de reiskosten bedraagt per betrekking vanaf het tweede jaar na indiensttreding voor het totaal
      van het gebouw of de gebouwen binnen deze betrekking niet meer dan het volgens de tabel in [bijlage 4][ref1] vanaf
      het tweede jaar na indiensttreding geldende bedrag bij vier of meer reisdagen per week over een reisafstand van
      vijf zones.


      [ref1]: https://wetten.overheid.nl/BWBR0015136
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0015136
  - number: '63.1'
    text: |-
      De betrokkene die bij een verhuizing in aanmerking zou komen voor een tegemoetkoming in verhuiskosten, en die naar
      het oordeel van het bevoegd gezag niet in de gelegenheid is dagelijks heen en weer te reizen tussen zijn woning
      en de plaats van tewerkstelling, heeft gedurende het eerste jaar, gerekend vanaf de datum waarop betrokkene in een
      standplaatsbetrekking is benoemd, aanspraak op een tegemoetkoming in pensionkosten, indien hij een pension betrekt
      dat gelegen is op of binnen een afstand van 5 zones van de plaats van tewerkstelling.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel63
  - number: '63.2'
    text: |-
      De in het eerste lid bedoelde tegemoetkoming bedraagt 90% van de werkelijk gemaakte pensionkosten, met een maximum
      als aangegeven in [bijlage 3, onder 4][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015136
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0015136
  - number: '63.3'
    text: |-
      De betrokkene heeft slechts aanspraak op een tegemoetkoming in de te maken reiskosten binnen Nederland, voor zover
      hij die éénmaal per week maakt voor het bezoeken van zijn woonplaats.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel63
  - number: '64.1'
    text: |-
      Aan de betrokkene die een dienstreis maakt, wordt door het bevoegd gezag een tegemoetkoming toegekend in de
      gemaakte reis- en verblijfkosten volgens nader door Onze Minister te stellen regels.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel64
  - number: '64.2'
    text: |-
      De betrokkene ontvangt voor het gebruik van een eigen motorvoertuig, waarvoor door het bevoegd gezag een machtiging
      is verleend, een kilometervergoeding:
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel64
  - number: 64.2.a
    text: |-
      voor de eerste 10 000 kilometer het bedrag dat per gereisde kilometer in het desbetreffende kalenderjaar
      belastingvrij mag worden toegekend;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel64
  - number: 64.2.b
    text: voor de overige kilometers een bedrag dat wordt vastgesteld volgens nader door Onze Minister te stellen regels.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel64
  - number: '65.1'
    text: |-
      Het verzoek om toekenning van een tegemoetkoming in de verhuiskosten dient zo spoedig mogelijk doch uiterlijk
      binnen 6 maanden na de verhuizing door de betrokkene bij het bevoegd gezag te worden ingediend.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel65
  - number: '65.2'
    text: |-
      Het verzoek om toekenning van een tegemoetkoming in de reis- en pensionkosten dient voor 1 januari volgend op het
      betreffende schooljaar bij het bevoegd gezag te worden ingediend.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel65
  - number: '66'
    text: |-
      Degene die een geneeskundig onderzoek ondergaat in verband met benoeming of wijziging van het dienstverband,
      ontvangt van het bevoegd gezag een vergoeding van reis- en verblijfkosten volgens daartoe door het bevoegd gezag te
      stellen regels. De kosten van een geneeskundig onderzoek komen voor rekening van het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel66
  - number: '67'
    text: 'In deze titel wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel67
  - number: 67.a
    text: 'diensttijd: de tijd, doorgebracht:'
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel67
  - number: 67.a.1°
    text: |-
      in een betrekking bij een bevoegd gezag aan een instelling met dien verstande dat de tijd vóór 1 januari 1956
      doorgebracht aan scholen voor kleuteronderwijs slechts meetelt indien daartoe naar het oordeel van Onze Minister
      aanleiding bestaat;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel67
  - number: 67.a.2°
    text: in een burgerlijke dienstbetrekking bij de Nederlandse overheid;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel67
  - number: 67.a.3°
    text: |-
      in een betrekking waarbij betrokkene in dienst is van een lichaam als bedoeld in
      [artikel 2, eerste lid, onder b, c, d, e en f van de Wet privatisering ABP][ref1], dan wel als bedoeld in
      [artikel 2, derde lid, onderdeel b][ref2], juncto [artikel 3 van die wet][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0007791#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007791#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0007791#Artikel3
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0007791
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0007791
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0007791
        artikel: '3'
  - number: 67.a.4°
    text: |-
      in een betrekking bij een bevoegd gezag aan een B3-lichaam voordat deze werd aangewezen als lichaam,
      bedoeld in [artikel 1, eerste lid, onder g, van de Wet privatisering ABP][ref1], dan wel, bedoeld in
      [artikel 2, derde lid, onder b][ref2], juncto [artikel 3 van die wet][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0007791#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007791#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0007791#Artikel3
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0007791
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0007791
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0007791
        artikel: '3'
  - number: 67.a.5°
    text: vóór 1 januari 1966 in een betrekking als bedoeld in artikel 4, eerste lid, van de Pensioenwet 1922;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel67
  - number: 67.a.6°
    text: |-
      in een burgerlijke dienstbetrekking bij de overheid van de Nederlandse Antillen, Aruba en, vóór 25 november 1975,
      Suriname en bij de voormalige gouvernementen van Suriname, Curaçao en Nieuw-Guinea;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel67
  - number: 67.a.7°
    text: |-
      in een dienstbetrekking bij het niet-openbaar onderwijs in de onder a6 vermelde voormalige rijksdelen, voor zover
      zulks de betrokkene onder de werkingssfeer van een overheidspensioenregeling heeft gebracht of zou hebben gebracht,
      indien hij in vaste dienst zou zijn aangesteld;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel67
  - number: 67.a.8°
    text: |-
      vóór 1 januari 1955 in dienst van de Republiek Indonesië, voor zover die tijd door de Garantiewet Burgerlijk
      Overheidspersoneel Indonesië wordt bestreken;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel67
  - number: 67.a.9°
    text: |-
      in Nederlandse militaire dienst of daarmede voor de toepassing van de desbetreffende rechtspositieregelingen
      gelijkgestelde dienst, waaronder mede worden begrepen het voormalige KNIL en de troepen in de Nederlandse Antillen,
      Aruba en, vóór 25 november 1975, Suriname;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel67
  - number: 67.a.10°
    text: |-
      als volontair met een volledige dagtaak in een betrekking bij de Nederlandse overheid; een en ander met
      uitzondering van de tijd waarin de betrokkene geen inkomsten uit de dienstbetrekking heeft genoten, tenzij zulks
      het gevolg was van lang buitengewoon verlof dat naar het oordeel van Onze Minister overwegend dan wel mede in het
      algemeen belang was verleend;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel67
  - number: 67.b
    text: 'jubileumdatum: de datum waarop de betrokkene een diensttijd van 25, 40 dan wel 50 jaren volbrengt;'
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel67
  - number: 67.c
    text: |-
      bezoldiging: de tot een maandbedrag herleide bezoldiging of som der bezoldigingen die voor de betrokkene op de
      jubileumdatum bij één of meer bevoegde gezagsorganen geldt, tot ten hoogste de bezoldiging behorende bij een
      normbetrekking; een en ander vermeerderd met de vakantie-uitkering over de desbetreffende maand; en waarbij een
      eventuele toelage wegens onregelmatige dienst wordt betrokken over één maand, berekend naar hetgeen de betrokkene
      in de 3 aan de jubileumdatum voorafgaande kalendermaanden gemiddeld aan zodanige toelage heeft ontvangen.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel67
  - number: '68'
    text: |-
      De betrokkene heeft bij het bereiken van de jubileumdatum aanspraak op een door het bevoegd gezag uit te betalen
      jubileumgratificatie.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel68
  - number: '69'
    text: |-
      De jubileumgratificatie bedraagt bij een 25-jarig jubileum 50% en bij een 40- of 50-jarig jubileum 100% van de
      bezoldiging. De bedragen worden op een veelvoud van 5 euro naar boven afgerond.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel69
  - number: '70'
    text: |-
      Indien de betrokkene op de jubileumdatum een benoeming heeft bij meer dan een bevoegd gezag, wordt de
      jubileumgratificatie uitbetaald door ieder van de betrokken bevoegde gezagsorganen voor een evenredig deel.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel70
  - number: '71'
    text: |-
      De tijd waarin de betrokkene twee of meer betrekkingen naast elkaar vervulde, komt slechts eenmaal in aanmerking
      voor de berekening van de diensttijd voor de jubileumgratificatie.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel71
  - number: '72'
    text: |-
      De betrokkene die ter zake van zijn dienstvervulling voor een 25-, 40- of 50-jarig jubileum reeds krachtens een
      andere regeling een overeenkomstige gratificatie heeft ontvangen, heeft voor datzelfde jubileum geen aanspraak op
      een jubileumgratificatie als bedoeld in deze titel.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel72
  - number: '73.1'
    text: |-
      Indien de jubileumdatum valt in een periode waarin de betrokkene lang buitengewoon verlof geniet dat, naar
      het oordeel van Onze Minister, overwegend of mede in het algemeen belang is verleend, heeft hij, onverminderd
      [artikel 72][ref1], eerst aanspraak op een jubileumgratificatie zodra hij na afloop van het verlof zijn
      werkzaamheden bij een bevoegd gezag hervat.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel72
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '72'
        hoofdstuk: '1'
  - number: '73.2'
    text: |-
      Bij toepassing van het eerste lid wordt de jubileumgratificatie uitbetaald door het bevoegd gezag waarbij de
      betrokkene na afloop van het verlof werkzaam is. Daarbij geldt als bezoldiging de bezoldiging die de betrokkene
      gedurende de maand waarin de jubileumdatum valt zou hebben genoten indien hij in de functie en met het
      salarisnummer dat hij had op de dag voorafgaande aan het ingaan van het verlof, op de jubileumdatum in actieve
      dienst was geweest.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel73
  - number: '74.1'
    text: |-
      De betrokkene heeft aanspraak op een vakantie-uitkering voor de tijd waarin hij als zodanig bezoldiging heeft
      genoten.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel74
  - number: '74.2'
    text: |-
      Voor de toepassing van het eerste lid wordt onder tijd waarin bezoldiging is genoten, niet begrepen tijd waarin de
      betrokkene wegens verplichte militaire dienst, anders dan voor herhalingsoefeningen, niet verlof zijnde, slechts
      bezoldiging heeft genoten tot een bedrag van het op hem te verhalen gedeelte van de pensioenbijdrage.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel74
  - number: '75.1'
    text: |-
      Tenzij in de volgende leden anders is bepaald, bedraagt de vakantie-uitkering per kalendermaand 8% van het bedrag
      dat de betrokkene in die maand aan bezoldiging heeft genoten, met uitzondering van de vakantie-uitkering.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel75
  - number: '75.2'
    text: |-
      Voor de toepassing van het eerste lid wordt in de gevallen, bedoeld in de [artikelen 4][ref1] en
      __REF001___________________________________________________________________________________________________________
      ______________________________, steeds uitgegaan van de volledige bezoldiging die aan zijn betrekking is verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0007800#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0007800#Artikel5
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0007800
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0007800
        artikel: '5'
  - number: '75.3'
    text: |-
      Voor de betrokkene die in de van toepassing zijnde maand op grond van het eerste lid aanspraak heeft op een
      bedrag dat lager is dan het bedrag dat in [bijlage 2, onder 2][ref1], bij zijn leeftijd is vermeld, wordt de
      vakantie-uitkering vastgesteld op laatstbedoeld bedrag, met dien verstande dat dit bedrag naar evenredigheid wordt
      verminderd voor de betrokkene die is aangesteld in een betrekking met een omvang van minder dan een normbetrekking.


      [ref1]: https://wetten.overheid.nl/BWBR0015136
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0015136
  - number: '75.4'
    text: 'Het in het derde lid bedoelde bedrag wordt naar evenredigheid verminderd indien:'
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel75
  - number: 75.4.a
    text: de betrokkene in de desbetreffende maand of gedurende een deel daarvan een deelbetrekking heeft vervuld;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel75
  - number: 75.4.b
    text: |-
      de bezoldiging van de betrokkene op een andere dag dan de eerste dag van die maand is aangevangen dan wel indien
      hij in een deel van die maand geen bezoldiging heeft genoten;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel75
  - number: 75.4.c
    text: |-
      de betrokkene in de loop van die maand slechts een gedeelte van zijn bezoldiging heeft genoten wegens verleend
      verlof, in verband met non-activiteit, bij wijze van disciplinaire straf of uit hoofde van schorsing.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel75
  - number: '76.1'
    text: |-
      Deze titel is mede van toepassing op de gewezen betrokkene, die ingevolge
      __REF000___________________________________________________________________________________________________________
      ____________________________________________________________________________ nog bezoldiging geniet.


      [ref1]: https://wetten.overheid.nl/BWBR0007800#Artikel39
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0007800
        artikel: '39'
  - number: '76.2'
    text: |-
      Voor de betrokkene op wie artikel 36, tweede lid, van toepassing is, wordt de vakantie-uitkering berekend op basis
      van de volle aan zijn betrekking verbonden bezoldiging. Hij geniet deze uitkering slechts voor zoveel die uitgaat
      boven de vakantie-uitkering, waarop hij als militair aanspraak heeft.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel76
  - number: '77.1'
    text: |-
      De vakantie-uitkering wordt per instelling eenmaal per jaar in de maand mei uitbetaald over de periode van twaalf
      maanden die eindigt met de maand mei.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel77
  - number: '77.2'
    text: |-
      In afwijking van het eerste lid vindt bij ontslag van de betrokkene de uitbetaling plaats over het tijdvak, gelegen
      tussen het einde van de laatst verstreken periode waarover de vakantie-uitkering werd uitbetaald en de datum van
      ontslag.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel77
  - number: '77.3'
    text: |-
      Voor de toepassing van dit artikel wordt met ontslag van de betrokkene gelijkgesteld de beëindiging van de
      doorbetaling van de bezoldiging van de gewezen betrokkene, bedoeld in [artikel 76, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel76
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '76'
        hoofdstuk: '1'
  - number: '78'
    text: 'In deze titel wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel78
  - number: 78.a
    text: |-
      betrokkene: de betrokkene, bedoeld in [artikel 1, onderdeel e][ref1], voor zover het betreft een lid van het
      onderwijsondersteunend personeel;


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel1
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '1'
        hoofdstuk: '1'
  - number: 78.b
    text: |-
      studie: een opleiding die van belang is voor het persoonlijk welbevinden van de betrokkene in zijn arbeidssituatie
      en, naar het oordeel van het bevoegd gezag, tevens van belang is voor de uitoefening van zijn functie;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel78
  - number: 78.c
    text: 'studiefaciliteiten:'
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel78
  - number: 78.c.1°
    text: |-
      verlof als bedoeld in [artikel 80][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel80
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '80'
        hoofdstuk: '1'
  - number: 78.c.2°
    text: |-
      een tegemoetkoming in de studiekosten als bedoeld in [artikel 81][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel81
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '81'
        hoofdstuk: '1'
  - number: 78.d
    text: 'ontslag: elke beëindiging van het dienstverband.'
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel78
  - number: '79.1'
    text: |-
      De betrokkene die voor studiefaciliteiten in aanmerking wenst te komen, dient het verzoek daartoe in de regel in
      voor de aanvang van de studie. Hij laat dit verzoek vergezeld gaan van de voor de beoordeling door het bevoegd
      gezag noodzakelijke gegevens en van een schatting van de te maken studiekosten.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel79
  - number: '79.2'
    text: |-
      Het bevoegd gezag kan, alvorens studiefaciliteiten te verlenen, een studieadvies of in bijzondere gevallen
      na overleg met de betrokkene een psychologisch advies inwinnen. Tenzij deze adviezen worden ingewonnen op
      uitdrukkelijk verzoek van de betrokkene, komen de daaraan verbonden kosten voor rekening van het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel79
  - number: '79.3'
    text: |-
      Studiefaciliteiten worden verleend voor een bepaalde termijn die wordt afgeleid van de normaal te achten duur van
      de studie. Het bevoegd gezag kan deze termijn verlengen.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel79
  - number: '79.4'
    text: |-
      Verleende studiefaciliteiten kunnen, al dan niet tijdelijk, worden ingetrokken indien het bevoegd gezag op grond
      van verkregen inlichtingen van oordeel is, dat de betrokkene niet in die mate studeert of vorderingen maakt dat
      hij in staat kan worden geacht de studie binnen de in het derde lid bedoelde termijn te voltooien. De intrekking
      geschiedt niet indien de betrokkene aannemelijk maakt, dat deze omstandigheid niet aan hem te wijten is.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel79
  - number: '79.5'
    text: |-
      Aan de betrokkene, die krachtens een op hem van toepassing zijnde regeling aanspraak heeft op een verhoging
      van zijn bezoldiging uitsluitend op grond van het voltooien van een studie, worden ter zake van die studie geen
      studiefaciliteiten verleend.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel79
  - number: '80.1'
    text: |-
      Tenzij het belang van de instelling zich daartegen verzet, kan aan de betrokkene studieverlof met behoud van
      bezoldiging worden verleend voor ten hoogste een halve dag per week, met dien verstande dat indien lessen in de
      normale werktijd moeten worden gevolgd, het verlof tot maximaal één dag per week kan worden verleend.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel80
  - number: '80.2'
    text: |-
      Onverminderd het eerste lid kan studieverlof worden verleend op de dag waarop wordt deelgenomen aan een examen of
      een tentamen, en dat is gelegen aan het einde van de studie dan wel volgt op een duidelijk afgerond onderdeel van
      de studie.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel80
  - number: '80.3'
    text: |-
      Ter voorbereiding op een examen en tentamen als bovenbedoeld kan bovendien studieverlof worden verleend voor ten
      hoogste vijf halve dagen per kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel80
  - number: '81.1'
    text: 'Voor volledige tegemoetkoming komen in aanmerking:'
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel81
  - number: 81.1.a
    text: |-
      indien de studie in een andere plaats dan de woon- of standplaats moet worden gevolgd: de noodzakelijk gemaakte
      reiskosten voor interlokaal vervoer en het daarmee in samenhang optredende vervoer in de plaats waar de cursus of
      het examen wordt gehouden, op basis van het laagste tarief van het gebezigde middel van openbaar vervoer, waarvan
      redelijkerwijs gebruik kan worden gemaakt, voor zover de betrokkene voor deze kosten niet uit anderen hoofde een
      vergoeding geniet; kan van openbaar vervoer redelijkerwijs geen gebruik worden gemaakt, dan worden de noodzakelijk
      gemaakte kosten vergoed tegen het tarief genoemd in artikel 6, tweede lid, van de Regeling vergoeding reis- en
      verblijfkosten bij dienstreizen voor onderwijspersoneel;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel81
  - number: 81.1.b
    text: |-
      de werkelijk gemaakte kosten die in verband met het afleggen van een examen noodzakelijkerwijze worden gemaakt
      voor nachtverblijf en het gebruik van maaltijden, met dien verstande dat de daarvoor in artikel 17 van de Regeling
      vergoeding van reis- en verblijfkosten bij dienstreizen voor onderwijspersoneel geldende bedragen niet worden
      overschreden.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel81
  - number: '81.2'
    text: 'Voor een tegemoetkoming van maximaal 50% komen in aanmerking de noodzakelijk gemaakte:'
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel81
  - number: 81.2.a
    text: aanschaffingskosten van het verplicht gestelde studiemateriaal;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel81
  - number: 81.2.b
    text: cursus- of lesgelden;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel81
  - number: 81.2.c
    text: examen- of diplomakosten.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel81
  - number: '81.3'
    text: |-
      In bijzondere gevallen kan met toestemming van Onze Minister, het in het tweede lid genoemde percentage
      op 75 worden gesteld. Toestemming van Onze Minister is niet vereist ten aanzien van scholen, bedoeld in
      [artikel 1, onderdeel d, onder 1°][ref1], voor zover het betreft onderwijsondersteunend personeel.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel1
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '1'
        hoofdstuk: '1'
  - number: '81.4'
    text: |-
      Een tegemoetkoming in studiekosten wordt eerst verleend nadat de betrokkene schriftelijk heeft verklaard dat hij
      bekend is met de verplichting tot gehele of gedeeltelijke terugbetaling, bedoeld in [artikel 82][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel82
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '82'
        hoofdstuk: '1'
  - number: '82.1'
    text: 'De betrokkene is verplicht tot terugbetaling van de aan hem verleende tegemoetkoming in de studiekosten in geval:'
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel82
  - number: 82.1.a
    text: hem ontslag wordt verleend vóórdat de studie met goed gevolg is afgesloten;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel82
  - number: 82.1.b
    text: |-
      de studie niet met goed gevolg is afgesloten op grond van omstandigheden die naar het oordeel van het bevoegd gezag
      aan de betrokkene te wijten zijn;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel82
  - number: 82.1.c
    text: |-
      hem ontslag wordt verleend binnen een termijn van drie jaren sedert de datum, waarop de studie met goed gevolg
      is afgesloten.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel82
  - number: '82.2'
    text: 'De in het eerste lid bedoelde verplichting tot terugbetaling wordt beperkt:'
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel82
  - number: 82.2.a
    text: |-
      in de gevallen, bedoeld in het eerste lid, onder a en b, tot het bedrag dat de betrokkene is uitbetaald in het
      tijdvak van drie jaren, voorafgaande aan de datum, waarop de desbetreffende omstandigheid zich heeft voorgedaan;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel82
  - number: 82.2.b
    text: |-
      in het geval, bedoeld in het eerste lid, onder c, voor elke maand die ontbreekt aan de in die bepaling genoemde
      termijn, tot 1/36 gedeelte van het bedrag dat de betrokkene is uitbetaald in het tijdvak van drie jaren
      voorafgaande aan de datum waarop de studie is afgesloten.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel82
  - number: '82.3'
    text: 'De in het eerste lid bedoelde verplichting geldt niet indien:'
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel82
  - number: 82.3.a
    text: |-
      de betrokkene ter zake van het ontslag aanspraak heeft op een uitkering als bedoeld in het
      [Besluit werkloosheid onderwijs- en onderzoekpersoneel][ref1] of op een direct ingaand pensioen;


      [ref1]: https://wetten.overheid.nl/BWBR0006445
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0006445
  - number: 82.3.b
    text: |-
      de betrekking waaruit de betrokkene is ontslagen aansluitend wordt gevolgd door een nieuwe betrekking bij het
      onderwijs dan wel in overheidsdienst.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel82
  - number: '83'
    text: 'In deze titel wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel83
  - number: 83.a
    text: |-
      salaris: het bedrag dat met inachtneming van de bepalingen van dit besluit voor de betrokkene is vastgesteld aan de
      hand van de [bijlagen 1A tot en met 1D][ref1] en [1F van dit besluit][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0015136
      [ref2]: https://wetten.overheid.nl/BWBR0015136
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0015136
      - id: ref2
        bwb_id: BWBR0015136
  - number: 83.b
    text: |-
      schaal: een als zodanig in een der [bijlagen 1A][ref1] en [1B van dit besluit][ref2] vermelde reeks van genummerde
      salarissen, behorende bij een normbetrekking;


      [ref1]: https://wetten.overheid.nl/BWBR0015136
      [ref2]: https://wetten.overheid.nl/BWBR0015136
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0015136
      - id: ref2
        bwb_id: BWBR0015136
  - number: 83.c
    text: 'maximumschaal: de hoogste schaal die behoort bij een functie;'
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel83
  - number: 83.d
    text: 'aanloopschaal: een bij een functie behorende lagere schaal dan de maximumschaal;'
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel83
  - number: 83.e
    text: |-
      salarisnummer: een aanduiding, bestaande uit een getal of uit een letter en een getal, dat in een salarisschaal bij
      een salaris is vermeld;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel83
  - number: 83.f
    text: |-
      maximumsalaris: het hoogste bedrag dat in een schaal voorkomt, waarvan het salarisnummer uitsluitend uit een getal
      bestaat;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel83
  - number: 83.g
    text: |-
      functie: het samenstel van werkzaamheden aan één of meer instellingen door de betrokkene in dienst van hetzelfde
      bevoegd gezag te verrichten krachtens en overeenkomstig hetgeen hem uit hoofde van een benoeming als bedoeld in
      [artikel 1 onderdeel n][ref1], door het bevoegd gezag is opgedragen; een en ander conform de [titels 12][ref2],
      [13][ref3] of [14 van dit hoofdstuk][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0015136#Hoofdstuk1
      [ref3]: https://wetten.overheid.nl/BWBR0015136#Hoofdstuk1
      [ref4]: https://wetten.overheid.nl/BWBR0015136#Hoofdstuk1
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0015136
        hoofdstuk: '1'
      - id: ref3
        bwb_id: BWBR0015136
        hoofdstuk: '1'
      - id: ref4
        bwb_id: BWBR0015136
        hoofdstuk: '1'
  - number: 83.h
    text: |-
      normfunctie: een functie waarvan de inhoud en het niveau zijn omschreven in de
      [bijlagen 12-1, 12-2, 13-1, 13-2 en 14-1][ref1] bij dit besluit;


      [ref1]: https://wetten.overheid.nl/BWBR0015136
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0015136
  - number: 83.i
    text: |-
      carrièrepatroon: de wijze waarop de betrokkene op grond van de [titels 12][ref1], [13][ref2]
      of [14 van dit hoofdstuk][ref3] het maximumsalaris van de bij zijn functie behorende maximumschaal bereikt;


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Hoofdstuk1
      [ref2]: https://wetten.overheid.nl/BWBR0015136#Hoofdstuk1
      [ref3]: https://wetten.overheid.nl/BWBR0015136#Hoofdstuk1
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0015136
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0015136
        hoofdstuk: '1'
      - id: ref3
        bwb_id: BWBR0015136
        hoofdstuk: '1'
  - number: 83.j
    text: |-
      formatie: het samenstel van functies voor het gehele personeel in niveaus en aantallen, uitgedrukt in de omvang van
      een normbetrekking of een gedeelte daarvan;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel83
  - number: 83.k
    text: |-
      tijdelijke uitbreiding betrekkingsomvang: de tijdelijke uitbreiding van de betrekkingsomvang op grond van dit
      besluit van een reeds bij het bevoegd gezag benoemd personeelslid;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel83
  - number: 83.l
    text: |-
      begintraject: de reeks salarisbedragen die voorafgaat aan de aanloopschaal bij een functie als bedoeld in
      [titel 13 van dit hoofdstuk][ref1], zoals aangegeven in [bijlage 1D][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Hoofdstuk1
      [ref2]: https://wetten.overheid.nl/BWBR0015136
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0015136
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0015136
  - number: 83.m
    text: |-
      eindejaarsuitkering: de uitkering als bedoeld in [artikel 108][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel108
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '108'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: 83.n
    text: |-
      aanlooptraject: de reeks salarisbedragen die voorafgaat aan de maximumschaal bij een functie als bedoeld in
      [artikel 173][ref1], zoals aangegeven in [bijlage 1F][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel173
      [ref2]: https://wetten.overheid.nl/BWBR0015136
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '173'
        hoofdstuk: '1'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0015136
  - number: '84.1'
    text: De betrokkene wordt benoemd in één van de functies die door het bevoegd gezag beschikbaar zijn gesteld.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel84
  - number: '84.2'
    text: |-
      Het salaris van de betrokkene wordt vastgesteld aan de hand van de functie waarin hij is benoemd, een en ander met
      inachtneming van de bepalingen van deze titel en de [titels 12][ref1], [13][ref2] of [14 van dit hoofdstuk][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Hoofdstuk1
      [ref2]: https://wetten.overheid.nl/BWBR0015136#Hoofdstuk1
      [ref3]: https://wetten.overheid.nl/BWBR0015136#Hoofdstuk1
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0015136
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0015136
        hoofdstuk: '1'
      - id: ref3
        bwb_id: BWBR0015136
        hoofdstuk: '1'
  - number: '84.3'
    text: |-
      De betrokkene kan bij een bevoegd gezag aan de instelling of instellingen waaraan hij uit hoofde van zijn
      benoeming verbonden kan worden, slechts inéé n functie zijn benoemd, met dien verstande dat als één functie worden
      aangemerkt:
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel84
  - number: 84.3.a
    text: onderwijsgevende functies met dezelfde maximumschaal en hetzelfde carrièrepatroon;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel84
  - number: 84.3.b
    text: gelijksoortige onderwijsondersteunende functies met dezelfde maximumschaal en hetzelfde carrièrepatroon.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel84
  - number: '84.4'
    text: |-
      Het bevoegd gezag kan naast of in plaats van de normfuncties andere functies voor de instelling vaststellen waarbij
      taken behorend tot die normfunctie worden verzelfstandigd of andere taken dan wel taken behorende tot verschillende
      normfuncties worden samengevoegd tot één nieuwe functie. De maximumschaal van deze nieuwe functie kan ten hoogste
      schaal 13 zijn.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel84
  - number: '84.5'
    text: |-
      In de situaties, bedoeld in het vierde lid, stelt het bevoegd gezag een functiebeschrijving op en geeft daarbij
      de plaats in de organisatie aan voor de nieuwe functie. Tevens wordt de maximumschaal aangegeven op basis van
      de aard en het niveau van de werkzaamheden die in de functie zijn samengebracht rekening houdend met de voor het
      rijkspersoneel ter zake geldende normen en in samenhang met de formatie, en geeft het bevoegd gezag aan of titel
      [12][ref1], [13][ref2] of  [14 van dit hoofdstuk][ref3] op die functie van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Hoofdstuk1
      [ref2]: https://wetten.overheid.nl/BWBR0015136#Hoofdstuk1
      [ref3]: https://wetten.overheid.nl/BWBR0015136#Hoofdstuk1
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0015136
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0015136
        hoofdstuk: '1'
      - id: ref3
        bwb_id: BWBR0015136
        hoofdstuk: '1'
  - number: '84.6'
    text: |-
      De betrokkene die zich niet kan verenigen met de uitkomst van de waardering van zijn functie als bedoeld in het
      vijfde lid, kan het bevoegd gezag verzoeken die waarderingsuitkomst opnieuw in overweging te nemen. Onze Minister
      geeft nadere voorschriften voor de behandeling van verzoeken als bedoeld in de eerste volzin.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel84
  - number: '84.7'
    text: 'In afwijking van het derde lid kan een betrokkene in het in dat lid bedoelde geval worden benoemd:'
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel84
  - number: 84.7.a
    text: |-
      in twee functies als bedoeld in [titel 14][ref1] dan wel de [titels 13][ref2] en [14 van dit hoofdstuk][ref3],
      indien er een verschil van meer dan 3 schalen is tussen de bij die functies behorende maximumschalen, of


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Hoofdstuk1
      [ref2]: https://wetten.overheid.nl/BWBR0015136#Hoofdstuk1
      [ref3]: https://wetten.overheid.nl/BWBR0015136#Hoofdstuk1
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0015136
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0015136
        hoofdstuk: '1'
      - id: ref3
        bwb_id: BWBR0015136
        hoofdstuk: '1'
  - number: 84.7.b
    text: |-
      in twee functies als bedoeld in [titel 13 van dit hoofdstuk][ref1] indien die functies bestaan uit een normfunctie
      leraar voor basisscholen enerzijds en een normfunctie leraar voor speciale scholen voor basisonderwijs anderzijds.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Hoofdstuk1
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0015136
        hoofdstuk: '1'
  - number: '84.8'
    text: |-
      Over belangrijke facetten van de concrete taakinhoud en over wijziging daarvan pleegt het bevoegd gezag overleg met
      de betrokkene. De werkzaamheden moeten redelijkerwijs aan de betrokkene kunnen worden opgedragen.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel84
  - number: '85.1'
    text: De betrokkene wordt benoemd in een normbetrekking of een deel daarvan, onverminderd het vijfde lid.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel85
  - number: '85.2'
    text: |-
      De normbetrekking op jaarbasis wordt gerealiseerd door met inachtneming van het verlof op grond van
      [artikel 12][ref1] respectievelijk [artikel 17, tweede lid eerste volzin][ref2], op jaarbasis uit te gaan van een
      arbeidsduur van 1710 uren, waaruit verlof wordt verleend op grond van [artikel 32][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0015136#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0015136#Artikel32
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '12'
        hoofdstuk: '1'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0015136
        artikel: '17'
        hoofdstuk: '1'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0015136
        artikel: '32'
        hoofdstuk: '1'
        paragraaf: '4'
  - number: '85.3'
    text: |-
      In afwijking van het tweede lid wordt de normbetrekking door het bevoegd gezag op verzoek van de betrokkene
      gerealiseerd door middel van een arbeidsduur op jaarbasis die met inachtneming van het verlof op grond van
      [artikel 12][ref1] respectievelijk [artikel 17, tweede lid eerste volzin][ref2], wordt gelijkgesteld met 1790 uren,
      tenzij het dienstbelang zich daartegen verzet.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0015136#Artikel17
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '12'
        hoofdstuk: '1'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0015136
        artikel: '17'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: '85.4'
    text: |-
      Aan het derde lid kan geen toepassing worden gegeven indien dat op enigerlei wijze direct leidt tot een plaatsing
      in de formatie, bedoeld in [artikel 110, tweede lid, onder b][ref1], dan wel tot enige uitkering op grond van het
      [Besluit Werkloosheid onderwijs- en onderzoekpersoneel][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel110
      [ref2]: https://wetten.overheid.nl/BWBR0006445
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '110'
        hoofdstuk: '1'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0006445
  - number: '85.5'
    text: |-
      Voor de betrokkene geldt dat de omvang van zijn betrekking of betrekkingen, waaronder tevens zijn begrepen
      werkzaamheden al of niet in dienstverband buiten het onderwijs verricht en waarmee inkomen wordt verworven, de
      omvang van 120% van een normbetrekking niet te boven mag gaan.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel85
  - number: '86.1'
    text: |-
      Het salaris van de betrokkene die is benoemd in een betrekking met een omvang anders dan die van een
      normbetrekking, wordt naar evenredigheid van die betrekkingsomvang berekend. De aldus berekende uitkomst wordt op
      rekenkundige wijze afgerond op centen.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel86
  - number: '86.2'
    text: |-
      Waar in deze titel of in de [titels 12][ref1], [13][ref2] of [14 van dit hoofdstuk][ref3] sprake is van een
      vergelijking van salarisbedragen teneinde een schaalbedrag ten behoeve van inpassing te kunnen vaststellen, moet
      worden uitgegaan van het salarisbedrag behorende bij een normbetrekking. Zonodig wordt het voor een betrokkene
      feitelijk geldende salaris omgerekend naar een salarisbedrag behorende bij een normbetrekking.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Hoofdstuk1
      [ref2]: https://wetten.overheid.nl/BWBR0015136#Hoofdstuk1
      [ref3]: https://wetten.overheid.nl/BWBR0015136#Hoofdstuk1
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0015136
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0015136
        hoofdstuk: '1'
      - id: ref3
        bwb_id: BWBR0015136
        hoofdstuk: '1'
  - number: '87.1'
    text: |-
      Zonder voorafgaand ontslag kan voor een betrokkene geen andere functie gaan gelden dan de functie waarin hij reeds
      is benoemd, behoudens de [artikelen 127][ref1], [128][ref2], [138][ref3] en [183][ref4]. De eerste volzin is niet
      van toepassing indien het bevoegd gezag bij de bepaling van het functieniveau met de betrokkene is overeengekomen
      dat zijn functie een tijdelijk karakter heeft en de schaal in verband daarmee slechts tijdelijk zal gelden.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel127
      [ref2]: https://wetten.overheid.nl/BWBR0015136#Artikel128
      [ref3]: https://wetten.overheid.nl/BWBR0015136#Artikel138
      [ref4]: https://wetten.overheid.nl/BWBR0015136#Artikel183
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '127'
        hoofdstuk: '1'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0015136
        artikel: '128'
        hoofdstuk: '1'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0015136
        artikel: '138'
        hoofdstuk: '1'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0015136
        artikel: '183'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: '87.2'
    text: |-
      De omvang van de betrekking van een betrokkene die in vaste dienst is benoemd, wordt niet tegen zijn wil verkleind,
      behoudens de mogelijkheid van het verval van rechtswege op grond van [artikel 113][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel113
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '113'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: '88.1'
    text: |-
      Bij elke functie behoren één of meer schalen, een aantal schalen en een begintraject, of één schaal en een
      aanlooptraject. Het salaris van de in die functie benoemde betrokkene wordt vastgesteld aan de hand van één van de
      salarisbedragen die in het begintraject, het aanlooptraject of die schaal dan wel schalen voorkomen.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel88
  - number: '88.2'
    text: |-
      Indien [titel 12][ref1], [13][ref2] of [14 van dit hoofdstuk][ref3] dit voorschrijft, wordt het salaris van de
      betrokkene eerst vastgesteld op een der salarisbedragen in het begintraject, aanlooptraject, de aanloopschaal
      of aanloopschalen en, nadat hij die volgens het bepaalde in de desbetreffende titel heeft doorlopen, op een
      salarisbedrag in de maximumschaal.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Hoofdstuk1
      [ref2]: https://wetten.overheid.nl/BWBR0015136#Hoofdstuk1
      [ref3]: https://wetten.overheid.nl/BWBR0015136#Hoofdstuk1
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel88
    references:
      - id: ref1
        bwb_id: BWBR0015136
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0015136
        hoofdstuk: '1'
      - id: ref3
        bwb_id: BWBR0015136
        hoofdstuk: '1'
  - number: '88.3'
    text: |-
      De bij elke functie behorende maximumschaal, aanloopschaal of aanloopschalen, begintraject en aanlooptraject zijn
      aangegeven in [titel 12][ref1], [13][ref2] of [14 van dit hoofdstuk][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Hoofdstuk1
      [ref2]: https://wetten.overheid.nl/BWBR0015136#Hoofdstuk1
      [ref3]: https://wetten.overheid.nl/BWBR0015136#Hoofdstuk1
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel88
    references:
      - id: ref1
        bwb_id: BWBR0015136
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0015136
        hoofdstuk: '1'
      - id: ref3
        bwb_id: BWBR0015136
        hoofdstuk: '1'
  - number: '89'
    text: |-
      Behoudens de [artikelen 90 tot en met 93][ref1], [125][ref2] en [174][ref3] wordt het salaris van de betrokkene bij
      zijn benoeming vastgesteld op het laagste bedrag:


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel90
      [ref2]: https://wetten.overheid.nl/BWBR0015136#Artikel125
      [ref3]: https://wetten.overheid.nl/BWBR0015136#Artikel174
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '90'
        hoofdstuk: '1'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0015136
        artikel: '125'
        hoofdstuk: '1'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0015136
        artikel: '174'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: 89.a
    text: van het begintraject of aanlooptraject dan wel;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel89
  - number: 89.b
    text: |-
      indien bij de functie geen begintraject of aanlooptraject behoort, op het laagste bedrag in de laagste schaal
      behorend bij de functie waarin hij wordt benoemd dan wel;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel89
  - number: 89.c
    text: |-
      indien bij de functie, bedoeld in [titel 13 van dit hoofdstuk][ref1], schaal 12 als maximumschaal behoort, op het
      bedrag behorende bij salarisnummer 1 in schaal 10.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Hoofdstuk1
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0015136
        hoofdstuk: '1'
  - number: '90.1'
    text: |-
      Het salaris van de betrokkene die reeds eerder in een schooljaar gedurende ten minste 60 werkdagen in een
      onderwijsfunctie werkzaam en bezoldigd is geweest en die wordt benoemd in hetzij een functie met eenlagere
      maximumschaal hetzij een functie met eenzelfde maximumschaal en hetzelfde of een ongunstiger carrièrepatroon dan
      behoorde respectievelijk behoorden bij die vorige onderwijsfunctie, wordt vastgesteld in het begintraject dan wel,
      indien het bedrag hoger is of indien er bij de functie geen begintraject behoort in de laagst mogelijke schaal
      die bij zijn nieuwe functie behoort, op hetzelfde bedrag waarop hij in die vorige functie werd bezoldigd in dat
      schooljaar.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel90
  - number: '90.2'
    text: |-
      Indien de in het eerste lid bedoelde betrokkene in enig aan zijn benoeming voorafgaand schooljaar reeds gedurende
      ten minste 60 werkdagen in zijn vorige onderwijsfunctie werkzaam en bezoldigd is geweest, wordt, voor zover het bij
      die vorige functie behorende carrièrepatroon zulks mogelijk maakt, zijn salaris vastgesteld in het begintraject dan
      wel, indien het bedrag hoger is of indien er bij de functie geen begintraject behoort in de laagst mogelijke schaal
      die bij zijn nieuwe functie behoort, op een bedrag dat één periodieke verhoging hoger is dan het salaris dat hij in
      die vorige functie genoot in dat voorafgaande schooljaar.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel90
  - number: '90.3'
    text: |-
      Het salaris van de betrokkene die reeds eerder in een schooljaar gedurende ten minste 60 werkdagen in een
      onderwijsfunctie werkzaam en bezoldigd is geweest en die wordt benoemd in hetzij een functie met een hogere
      maximumschaal hetzij een functie met een gunstiger carrièrepatroon en ten minste eenzelfde maximumschaal dan
      behoorde respectievelijk behoorden bij die vorige onderwijsfunctie, wordt vastgesteld in het begintraject dan wel,
      indien het bedrag hoger is of indien er bij de functie geen begintraject behoort in de laagst mogelijke schaal die
      bij zijn nieuwe functie behoort op het salarisbedrag dat onmiddellijk gelegen is boven het bedrag waarop welk hij
      in die vorige functie werd bezoldigd in dat schooljaar.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel90
  - number: '90.4'
    text: |-
      Indien de in het derde lid bedoelde betrokkene in enig aan zijn benoeming voorafgaand schooljaar reeds gedurende
      ten minste 60 werkdagen in zijn vorige onderwijsfunctie werkzaam en bezoldigd is geweest, wordt, voor zover het
      bij die vorige functie behorende carrièrepatroon zulks mogelijk maakt, zijn salaris vastgesteld in het begintraject
      dan wel, indien het bedrag hoger is of indien er bij de functie geen begintraject behoort, in de laagst mogelijke
      schaal die bij zijn nieuwe functie behoort, op het salarisbedrag dat onmiddellijk gelegen is boven het bedrag dat
      volgens het bij die vorige functie behorende carrièrepatroon één periodieke verhoging hoger is dan het salaris dat
      hij in die vorige functie genoot in dat voorafgaande schooljaar.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel90
  - number: '90.5'
    text: |-
      Voor de toepassing van het eerste tot en met het vierde lid wordt met een schooljaar waarin de betrokkene gedurende
      ten minste 60 werkdagen werkzaam en bezoldigd is geweest in zijn vorige onderwijsfunctie, gelijkgesteld een
      schooljaar waarin de betrokkene gedurende alle schoolweken in die onderwijsfunctie benoemd is geweest.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel90
  - number: '90.6'
    text: |-
      Bij een benoeming in een onderwijsfunctie wordt het salaris van de betrokkene die reeds meer dan één
      onderwijsfunctie vervulde, vastgesteld op de in het eerste tot en met vierde lid aangegeven wijze, met dien
      verstande dat hierbij wordt uitgegaan van:
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel90
  - number: 90.6.a
    text: |-
      het schooljaar waarin de betrokkene voor het laatst in alle door hem vervulde onderwijsfuncties gezamenlijk
      gedurende alle schoolweken benoemd dan wel gedurende ten minste 60 werkdagen werkzaam en bezoldigd is geweest;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel90
  - number: 90.6.b
    text: |-
      de vorige onderwijsfunctie met de hoogst mogelijke maximumschaal waarin de betrokkene tezamen met andere vorige
      onderwijsfuncties met eenzelfde of een hogere maximumschaal in het onder a bedoelde schooljaar gedurende alle
      schoolweken benoemd dan wel gedurende ten minste 60 werkdagen werkzaam en bezoldigd is geweest.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel90
  - number: '90.7'
    text: 'Voor de toepassing van het zesde lid:'
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel90
  - number: 90.7.a
    text: |-
      worden dagen waarop de betrokkene gelijktijdig in meer dan één onderwijsfunctie werkzaam en bezoldigd was als één
      werkdag geteld; indien hierbij sprake was van twee of meer onderwijsfuncties met dezelfde maximumschaal waarin de
      betrokkene volgens verschillende salarisbedragen werd bezoldigd, worden de dagen waarop deze functies gelijktijdig
      zijn vervuld toegerekend aan de onderwijsfunctie waarin hij op die dagen volgens het hoogste salarisbedrag werd
      bezoldigd; dagen waarop de betrokkene gelijktijdig twee of meer onderwijsfuncties heeft vervuld met verschillende
      maximumschalen, worden toegerekend aan de onderwijsfunctie die hij op die dagen heeft vervuld met de hoogste
      maximumschaal;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel90
  - number: 90.7.b
    text: |-
      wordt bij de telling van het aantal werkdagen, bedoeld in het eerste tot en met het vierde lid, uitgegaan van het
      aantal werkdagen waarop de betrokkene in het schooljaar, bedoeld in het zesde lid, onder a, werkzaam en bezoldigd
      is geweest in alle door hem vervulde onderwijsfuncties gezamenlijk;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel90
  - number: 90.7.c
    text: |-
      wordt bij een benoeming in het schooljaar, bedoeld in het zesde lid, onder a, of in het onmiddellijk daarop
      volgende schooljaar, voor de betrokkene die op 1 augustus van het in het zesde lid, onder a, bedoelde schooljaar
      dezelfde onderwijsfuncties vervulde als op 31 juli van het onmiddellijk daaraan voorafgaande schooljaar, uitgegaan
      van het laatstbedoelde schooljaar indien dit leidt tot vaststelling van een hoger salaris en mits hij in dat
      schooljaar in alle door hem vervulde onderwijsfuncties gezamenlijk gedurende alle schoolweken benoemd dan wel
      gedurende ten minste 60 werkdagen werkzaam en bezoldigd is geweest;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel90
  - number: 90.7.d
    text: |-
      wordt bij een benoeming aan dezelfde instelling of bij hetzelfde bevoegd gezag, de vorige onderwijsfunctie met
      een hogere maximumschaal dan behoort bij de functie waarin de benoeming plaatsvindt, buiten beschouwing gelaten
      indien de betrokkene niet tenminste drie schooljaren in die vorige functie werkzaam is geweest en hij bij dezelfde
      instelling of bij hetzelfde bevoegd gezag eveneens werkzaam is geweest in een functie met een lagere maximumschaal
      dan behoorde bij die vorige functie. Voor de vaststelling van het salaris wordt uitgegaan van het salaris dat zou
      zijn genoten in de functie met de lagere maximumschaal. Het vijfde lid is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel90
  - number: '90.8'
    text: |-
      Vaststelling van het salaris bij een benoeming als bedoeld in het eerste tot en met het zevende lid mag er niet toe
      leiden dat het vastgestelde bedrag hoger is dan het hoogste bedrag in de bij de desbetreffende functie behorende
      maximumschaal noch lager dan het laagste bedrag van het bij de functie behorende begintraject dan wel van de
      laagste aanloopschaal indien bij de functie geen begintraject behoort. Indien het salarisbedrag dat de betrokkene
      in zijn vorige functie genoot niet voorkomt in het begintraject of de laagst mogelijke schaal behorende bij de
      functie waarin hij wordt benoemd, wordt het salaris vastgesteld op het naasthogere bedrag in dat begintraject of
      deze schaal. Indien het salaris dat de betrokkene in zijn vorige functie genoot hoger is dan het hoogste bedrag in
      de bij zijn functie behorende maximumschaal wordt zijn salaris vastgesteld op dat hoogste bedrag.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel90
  - number: '91.1'
    text: |-
      Ten aanzien van de vaststelling van het salaris van de betrokkene die reeds één of meer functies bij het onderwijs
      vervult en die daarnaast wordt benoemd in een andere onderwijsfunctie is [artikel 90][ref1] van overeenkomstige
      toepassing met dien verstande dat hierbij een aangehouden functie wordt gelijkgesteld met een vorige functie.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel90
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '90'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: '91.2'
    text: |-
      Het salaris van de in het eerste lid bedoelde betrokkene die wordt benoemd in een functie met een maximumschaal
      en een carrièrepatroon die gelijk zijn aan de maximumschaal en het carrièrepatroon die bij de aangehouden functie
      respectievelijk bij één van de aangehouden functies behoren, wordt, in afwijking van het eerste lid, vastgesteld
      op hetzelfde bedrag en in hetzelfde begintraject of in dezelfde schaal volgens welke hij wordt bezoldigd in de
      aangehouden functie met die gelijke maximumschaal en dat gelijke carrièrepatroon.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel91
  - number: '92.1'
    text: |-
      Het salaris van de betrokkene die een inkomen geniet of heeft genoten voor werkzaamheden die buiten het onderwijs
      al dan niet in dienstbetrekking zijn verricht en waarmee hij relevante ervaring heeft opgedaan, wordt vastgesteld
      op een bedrag dat ten hoogste één periodieke verhoging hoger is dan bedoeld inkomen per maand, in het begintraject
      of in een salarisschaal die voorkomt in het bij zijn functie behorende carrièrepatroon.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel92
  - number: '92.2'
    text: Onze Minister geeft nadere voorschriften voor de uitvoering van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel92
  - number: '93.1'
    text: |-
      Het salaris van de betrokkene die op het moment dat hij in een onderwijsfunctie wordt benoemd gedurende
      vier of meer achtereenvolgende schooljaren geen functie in het onderwijs heeft vervuld, wordt, onverminderd
      [artikel 92][ref1], vastgesteld op een bedrag dat hoger is dan het bedrag dat voor hem bij toepassing van
      [artikel 90][ref2] zou gelden en wel voor elke periode van vier schooljaren na het schooljaar waarin de betrokkene
      voor het laatst in alle door hem vervulde onderwijsfuncties gezamenlijk gedurende alle schoolweken benoemd dan wel
      gedurende ten minste 60 werkdagen werkzaam en bezoldigd is geweest, één periodieke verhoging in het begintraject of
      de laagst mogelijke schaal die behoort bij de functie waarin hij wordt benoemd een en ander voor zover dit binnen
      het bij zijn vorige functie behorende carrièrepatroon mogelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel92
      [ref2]: https://wetten.overheid.nl/BWBR0015136#Artikel90
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '92'
        hoofdstuk: '1'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0015136
        artikel: '90'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: '93.2'
    text: |-
      Het salaris van de betrokkene, niet zijnde de betrokkene, bedoeld in [artikel 91, tweede lid][ref1], wordt
      bij zijn benoeming in een onderwijsfunctie in afwijking van het eerste lid en de [artikelen 89][ref2],
      [90][ref3], [91, eerste lid][ref4], en [92][ref5], ten minste vastgesteld op een bedrag dat hoger is dan het in
      [artikel 89][ref6] bedoelde bedrag indien hij de voor zijn onderwijsfunctie vereiste kwalificaties of bevoegdheden
      reeds vier jaar of langer geleden heeft verworven. De verhoging bedraagt één periodieke verhoging in het
      begintraject dan wel de laagst mogelijk bij zijn functie behorende schaal voor elke periode van vier volledige
      jaren die sedert de verwerving van de voor zijn functie vereiste kwalificaties of bevoegdheden is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel91
      [ref2]: https://wetten.overheid.nl/BWBR0015136#Artikel89
      [ref3]: https://wetten.overheid.nl/BWBR0015136#Artikel90
      [ref4]: https://wetten.overheid.nl/BWBR0015136#Artikel91
      [ref5]: https://wetten.overheid.nl/BWBR0015136#Artikel92
      [ref6]: https://wetten.overheid.nl/BWBR0015136#Artikel89
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '91'
        hoofdstuk: '1'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0015136
        artikel: '89'
        hoofdstuk: '1'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0015136
        artikel: '90'
        hoofdstuk: '1'
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0015136
        artikel: '91'
        hoofdstuk: '1'
        paragraaf: '1'
      - id: ref5
        bwb_id: BWBR0015136
        artikel: '92'
        hoofdstuk: '1'
        paragraaf: '1'
      - id: ref6
        bwb_id: BWBR0015136
        artikel: '89'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: '93.3'
    text: |-
      Voor de betrokkene wordt voor de toepassing van het eerste lid, de in dat lid bedoelde periode van vier schooljaren
      verkort tot drie schooljaren voor de eerste periode van zes schooljaren na het schooljaar waarin de betrokkene
      voor het laatst in alle door hem vervulde onderwijsfuncties gezamenlijk gedurende alle schoolweken benoemd dan wel
      gedurende ten minste 60 werkdagen werkzaam en bezoldigd is geweest.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel93
  - number: '93.4'
    text: |-
      Voor de toepassing van het eerste tot en met het derde lid wordt een schooljaar waarin de betrokkene niet gedurende
      alle schoolweken benoemd en evenmin gedurende ten minste 60 werkdagen werkzaam en bezoldigd is geweest in één of
      meer onderwijsfuncties, gelijkgesteld aan een schooljaar waarin de betrokkene geen functie in het onderwijs heeft
      vervuld.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel93
  - number: '94.1'
    text: |-
      In afwijking van de [artikelen 89 tot en met 93][ref1] en de [artikelen 95][ref2] en [96][ref3] wordt het salaris
      van een betrokkene die de leeftijd van 22 jaar nog niet heeft bereikt, vastgesteld op het bedrag dat in de voor hem
      geldende schaal is opgenomen bij het salarisnummer bestaande uit de letter J en het getal dat overeenkomt met zijn
      leeftijd in jaren voor zover de schaal in [bijlage 1B][ref4] dit aangeeft.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel89
      [ref2]: https://wetten.overheid.nl/BWBR0015136#Artikel95
      [ref3]: https://wetten.overheid.nl/BWBR0015136#Artikel96
      [ref4]: https://wetten.overheid.nl/BWBR0015136
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '89'
        hoofdstuk: '1'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0015136
        artikel: '95'
        hoofdstuk: '1'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0015136
        artikel: '96'
        hoofdstuk: '1'
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0015136
  - number: '94.2'
    text: |-
      Het salaris van de betrokkene die de leeftijd van 22 jaar bereikt, wordt met ingang van de eerste dag van de maand
      waarin hij die leeftijd bereikt, vastgesteld op:
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel94
  - number: 94.2.a
    text: het laagste bedrag van het aanlooptraject;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel94
  - number: 94.2.b
    text: |-
      indien bij de functie geen aanlooptraject behoort, het bedrag dat in de voor hem van toepassing zijnde schaal is
      vermeld bij salarisnummer 0.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel94
  - number: '95.1'
    text: |-
      Het salaris van de betrokkene van wie het dienstverband niet wordt onderbroken, wordt binnen het begintraject,
      aanlooptraject of de schaal jaarlijks op 1 augustus verhoogd tot het naasthogere bedrag onverminderd
      [artikel 96][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel96
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '96'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: '95.2'
    text: |-
      In afwijking van het eerste lid wordt het salaris van de betrokkene wanneer het voorlaatste salarisnummer beginnend
      met de letter U van schaal 1, 2, 3 of 4 is bereikt, na twee jaar verhoogd tot het naasthogere bedrag.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel95
  - number: '96.1'
    text: |-
      Behoudens het tweede lid wordt het salaris van de betrokkene die reeds bij het bevoegd gezag benoemd is en
      die wordt benoemd in hetzij een functie met een hogere maximumschaal hetzij in een functie met een gunstiger
      carrièrepatroon en tenminste dezelfde maximumschaal dan behoorde bij zijn vorige functie, vastgesteld
      overeenkomstig de [artikelen 90][ref1] dan [wel 91, tweede lid][ref2], met ingang van de datum waarop hij zijn
      werkzaamheden in die functie aanvangt.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel90
      [ref2]: https://wetten.overheid.nl/BWBR0015136#Artikel91
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '90'
        hoofdstuk: '1'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0015136
        artikel: '91'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: '96.2'
    text: |-
      Het eerste lid is niet van toepassing op de betrokkene voor wie een hogere maximumschaal of gunstiger
      carrièrepatroon ter beschikking komt uitsluitend ten gevolge van de grootte van de instelling.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel96
  - number: '96.3'
    text: |-
      Indien op grond van het eerste lid een periodieke verhoging wordt toegekend aan een betrokkene wiens salaris werd
      vastgesteld volgens één der schalen 1 tot en met 6, wordt het salarisnummer in de nieuwe schaal zodanig vastgesteld
      dat het salaris in die schaal blijft uitgaan boven het salaris dat voor de betrokkene in de oude schaal zou hebben
      gegolden tot het hoogste bedrag in de bij de nieuwe functie behorende maximumschaal is bereikt.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel96
  - number: '97.1'
    text: |-
      Indien het salaris van een betrokkene als gevolg van enige bepaling in deze titel dan wel in de [titels 12][ref1],
      13 of [14 van dit hoofdstuk][ref2] moet worden vastgesteld over een periode die korter is dan een kalendermaand,
      wordt uitgegaan van de bezoldiging per dag berekend door het bedrag van de bezoldiging per maand te delen door het
      aantal dagen dat de desbetreffende maand telt.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Hoofdstuk1
      [ref2]: https://wetten.overheid.nl/BWBR0015136#Hoofdstuk1
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel97
    references:
      - id: ref1
        bwb_id: BWBR0015136
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0015136
        hoofdstuk: '1'
  - number: '97.2'
    text: |-
      Indien voor een betrokkene die wordt benoemd voor een periode van 6 maanden of korter het salaris als gevolg van
      enige bepaling in deze titel dan wel in de [titels 12][ref1], [13][ref2] of [14 van dit hoofdstuk][ref3] moet
      worden vastgesteld over een periode die korter is dan een kalendermaand geschiedt dit, in afwijking van het eerste
      lid, aan de hand van de formule: (w x q + r) x (3:13) x s, waarin: w = de werktijdfactor die voor betrokkene geldt;
      q = het aantal volledige kalenderweken waarin betrokkene in de desbetreffende maand werkzaam is; r = het aantal
      uren dat betrokkene feitelijk heeft gewerkt in de niet volledige kalenderweek of kalenderweken waarin hij in de
      desbetreffende maand is benoemd, gedeeld door 36,86; s = het salaris bij een normbetrekking. De uitkomst wordt
      rekenkundig afgerond op centen.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Hoofdstuk1
      [ref2]: https://wetten.overheid.nl/BWBR0015136#Hoofdstuk1
      [ref3]: https://wetten.overheid.nl/BWBR0015136#Hoofdstuk1
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel97
    references:
      - id: ref1
        bwb_id: BWBR0015136
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0015136
        hoofdstuk: '1'
      - id: ref3
        bwb_id: BWBR0015136
        hoofdstuk: '1'
  - number: '97.3'
    text: |-
      Het salaris van de betrokkene die reeds bij een bevoegd gezag is benoemd en van wie de betrekkingsomvang waarin hij
      is benoemd tijdelijk wordt uitgebreid, wordt voor de tijdelijke werkzaamheden, voor zover het de kalendermaanden
      betreft waarover die tijdelijke uitbreiding zich niet volledig uitstrekt, vastgesteld overeenkomstig het tweede
      lid.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel97
  - number: '98.1'
    text: |-
      Indien het salaris bij een normbetrekking minder is dan het maandbedrag van het minimumloon als vermeld in
      [bijlage 2, onder 1][ref1], bij de leeftijd die de betrokkene heeft, wordt aan hem een toelage toegekend ten
      bedrage van het verschil.


      [ref1]: https://wetten.overheid.nl/BWBR0015136
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel98
    references:
      - id: ref1
        bwb_id: BWBR0015136
  - number: '98.2'
    text: |-
      Voor de betrokkene, bedoeld in het eerste lid, met een betrekkingsomvang anders dan een normbetrekking, wordt het
      voor werknemers van dezelfde leeftijd geldende minimumloon geacht te zijn vastgesteld op een evenredig deel van het
      in het eerste lid bedoelde maandbedrag.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel98
  - number: '99.1'
    text: |-
      De betrokkene is voor door het bevoegd gezag verstrekt genot van woning, verstrekkingen in de woning dan wel kost
      en inwoning een bedrag verschuldigd overeenkomende met een percentage van de voor hem geldende berekeningsbasis tot
      ten hoogste de door Onze Minister vastgestelde maximumbedragen als aangegeven in [bijlage 5][ref1] bij dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0015136
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0015136
  - number: '99.2'
    text: |-
      De berekeningsbasis, bedoeld in het eerste lid, komt overeen met de som van het salaris bij normbetrekking en de
      toelagen op grond van dit besluit. Van de berekeningsbasis maakt geen deel uit de toelage onregelmatige dienst,
      bedoeld in [artikel 180][ref1] of de garantietoelage onregelmatige dienst, bedoeld in [artikel 181][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel180
      [ref2]: https://wetten.overheid.nl/BWBR0015136#Artikel181
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '180'
        hoofdstuk: '1'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0015136
        artikel: '181'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: '99.3'
    text: |-
      Indien de betrokkene aantoont dat de huurwaarde van de woning voor de heffing van de inkomsten- en loonbelasting
      minder bedraagt dan het op grond van het eerste lid geldende bedrag wegens genot van de woning, wordt het
      verschuldigde bedrag op dat van die huurwaarde gesteld.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel99
  - number: '99.4'
    text: |-
      Bij geoorloofde afwezigheid wordt het bedrag dat voor het genot van kost verschuldigd zou zijn voor elke dag dat
      dit emolument niet wordt genoten, verminderd met een bedrag als is aangegeven in [bijlage 5][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015136
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0015136
  - number: '99.5'
    text: |-
      De op grond van dit artikel door betrokkene verschuldigde bedragen worden verrekend bij de uitbetalingen van het
      salaris dan wel, indien dat niet mogelijk is, afzonderlijk in rekening gebracht.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel99
  - number: '99.6'
    text: In bijzondere gevallen kan een regeling worden getroffen die afwijkt van het eerste en het vierde lid.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel99
  - number: '99.7'
    text: |-
      Ingeval andere dan de in dit artikel en in [bijlage 5][ref1] genoemde voordelen worden genoten, kan een regeling
      worden getroffen waarbij de hiervoor door betrokkene verschuldigde bedragen worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0015136
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0015136
  - number: '99.8'
    text: |-
      Voor zover een verstrekking niet gedurende een hele maand wordt genoten, wordt het bedrag van de inhouding over het
      gedeelte van de maand berekend door het maandbedrag van de inhouding te vermenigvuldigen met q x 3/13, waarbij« q»
      gelijk is aan het aantal volledige kalenderweken waarin de desbetreffende verstrekking wordt genoten.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel99
  - number: '99.9'
    text: |-
      De maximumbedragen, bedoeld in het eerste en het vierde lid, worden door Onze Minister vastgesteld overeenkomstig
      de bedragen die gelden voor het rijkspersoneel.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel99
  - number: '100'
    text: (Vervallen.)
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel100
  - number: '101.1'
    text: |-
      Het salaris, de toelagen en de vergoedingen voor extra diensten, vastgesteld volgens de bepalingen van dit besluit,
      waaronder de vergoeding, bedoeld in [artikel 107, vierde lid][ref1], worden per maand uitbetaald.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel107
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel101
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '107'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: '101.2'
    text: |-
      Het bevoegd gezag verstrekt de betrokkene bij zijn indiensttreding en indien er een wijziging optreedt in het
      salaris, de toelagen of de vergoedingen voor extra diensten, een specificatie van de door hem genoten bezoldiging.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel101
  - number: '102.1'
    text: De betrokkene is verplicht de werkzaamheden op zich te nemen die behoren bij de functie waarin hij is benoemd.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel102
  - number: '102.2'
    text: |-
      De betrokkene ontvangt geen bezoldiging over de tijd, waarin hij in strijd met zijn verplichtingen opzettelijk
      nalaat zijn werkzaamheden te verrichten en evenmin over de tijd, waarin hij bij het einde van zijn dienstverband
      meer verlof op grond van [artikel 32][ref1] of [titel 16 van dit hoofdstuk][ref2] heeft genoten dan waarop hij
      aanspraak had.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0015136#Hoofdstuk1
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel102
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '32'
        hoofdstuk: '1'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0015136
        hoofdstuk: '1'
  - number: '102.3'
    text: Onze Minister geeft nadere voorschriften voor de toepassing van het tweede lid.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel102
  - number: '103.1'
    text: |-
      Het bevoegd gezag kan voor ten hoogste 1/3 gedeelte de bezoldiging inhouden van de betrokkene die bij wijze van
      straf is geschorst wegens het feit dat:
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel103
  - number: 103.1.a
    text: een strafrechtelijke vervolging wegens misdrijf tegen hem is ingesteld;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel103
  - number: 103.1.b
    text: hij krachtens een wettelijke maatregel van zijn vrijheid is beroofd;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel103
  - number: 103.1.c
    text: hij de bevoegdheid tot het geven van onderwijs door een nog niet onherroepelijk geworden vonnis heeft verloren.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel103
  - number: '103.2'
    text: |-
      De ingehouden bezoldiging wordt alsnog uitbetaald indien door de strafrechter geen straf wordt opgelegd of de
      beslissing van het bevoegd gezag tot inhouding van bezoldiging wordt vernietigd alsmede voor zover op andere
      gronden alsnog tot uitbetaling wordt besloten. Op de aldus uit te keren bezoldiging worden in mindering gebracht de
      inkomsten die de betrokkene sedert de schorsing heeft genoten uit arbeid die hij als gevolg van de schorsing heeft
      kunnen verrichten, tenzij zulks naar het oordeel van het bevoegd gezag onredelijk of onbillijk is.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel103
  - number: '103.3'
    text: |-
      Van de inhouding en de uitbetaling van de bezoldiging, bedoeld in dit artikel, doet het bevoegd gezag terstond
      mededeling aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel103
  - number: '104.1'
    text: |-
      De benoeming gaat in op de dag waarop de betrokkene zijn werkzaamheden aanvangt, onverminderd [artikel 156][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel156
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '156'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: '104.2'
    text: |-
      De betrokkene heeft in geval van ontslag aanspraak op bezoldiging tot de dag waarop het ontslag ingaat,
      onverminderd [artikel 156][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel156
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '156'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: '104.3'
    text: |-
      Het dienstverband van de betrokkene die overlijdt, is beëindigd met ingang van de dag volgende op die van het
      overlijden.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel104
  - number: '104.4'
    text: |-
      Het dienstverband van de betrokkene die krachtens rechterlijke uitspraak tot het geven van onderwijs is uitgesloten
      kan zich uitstrekken tot uiterlijk de dag waarop de rechterlijke uitspraak onherroepelijk is geworden.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel104
  - number: '105'
    text: |-
      De betrokkene kan op zijn verzoek of met zijn instemming voor bepaalde tijd worden belast met werkzaamheden bij het
      bevoegd gezag van een andere instelling of instellingen dan wel buiten het onderwijs.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel105
  - number: '106.1'
    text: |-
      Het bevoegd gezag kan met het oog op al dan niet schoolspecifieke knelpunten in de personeelsvoorziening
      uitsluitend ten laste van de eigen middelen aan een betrokkene een door het bevoegd gezag vast te stellen
      tegemoetkoming verstrekken.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel106
  - number: '106.2'
    text: |-
      De tegemoetkoming, bedoeld in het eerste lid, maakt geen deel uit van het inkomen, bedoeld in het
      pensioenreglement.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel106
  - number: '107.1'
    text: |-
      Het bevoegd gezag kan uitsluitend ten laste van eigen middelen met inachtneming van de in of krachtens de
      [Wet op de loonbelasting 1964][ref1] gegeven normering en beperkingen aan de betrokkene vergoedingen toekennen,
      verstrekkingen doen, uitkeringen verstrekken, geschenken geven en zaken ter beschikking stellen als bedoeld in
      [artikel 11, eerste lid, onder a, b, o, p en q][ref2], en [artikel 11a van de Wet op de loonbelasting 1964][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002471
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0002471#Artikel11a
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0002471
      - id: ref2
        bwb_id: BWBR0002471
        artikel: '11'
      - id: ref3
        bwb_id: BWBR0002471
        artikel: 11a
  - number: '107.2'
    text: |-
      Het bevoegd gezag kan met inachtneming van de in of krachtens de [Wet op de loonbelasting 1964][ref1]
      gegeven normering en beperkingen aan de betrokkene vergoedingen als bedoeld in
      [artikel 11, eerste lid, onder a, p en q, van de Wet op de loonbelasting 1964][ref2] toekennen voor meer werken als
      bedoeld in het derde lid, of voor het deel waarvoor de betrokkene afziet van een of meer aanspraken als bedoeld in
      het vijfde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002471
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel11
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0002471
      - id: ref2
        bwb_id: BWBR0002471
        artikel: '11'
  - number: '107.3'
    text: |-
      Onder meer werken als bedoeld in het tweede lid wordt verstaan: het aantal uren dat de betrokkene op zijn eigen
      verzoek en met instemming van het bevoegd gezag werkt buiten de voor hem geldende betrekkingsomvang.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel107
  - number: '107.4'
    text: |-
      De vergoeding voor meer werken wordt berekend volgens de volgende formule: (r:36,86) x (3:13) x s, waarbij «r»
      staat voor het totaal aantal uren meer werken en «s» staat voor het maandsalaris bij een normbetrekking. De
      uitkomst van de berekening wordt verhoogd met 8% en de uitkomst met inbegrip van die verhoging wordt rekenkundig
      afgerond op centen. De vergoeding voor meer werken, maakt geen deel uit van het inkomen, bedoeld in het
      pensioenreglement.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel107
  - number: '107.5'
    text: 'De aanspraken, bedoeld in het tweede lid, betreffen de aanspraken op:'
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel107
  - number: 107.5.a
    text: een salaris;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel107
  - number: 107.5.b
    text: |-
      een tegemoetkoming in de ziektekosten voor de betrokkene en iedere medebetrokkene,
      een inkomenstoeslag en een aanvullende inkomenstoeslag in de zin van het
      [Besluit tegemoetkoming ziektekosten en inkomenstoeslag onderwijs- en onderzoekpersoneel][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007326
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0007326
  - number: 107.5.c
    text: een vakantie-uitkering;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel107
  - number: 107.5.d
    text: |-
      een algemene eindejaarsuitkering als bedoeld in [artikel 108][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel108
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '108'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: 107.5.e
    text: |-
      een eindejaarsuitkering als bedoeld in [artikel 182][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel182
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '182'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: '108'
    text: |-
      Bij ministeriële regeling kan worden bepaald dat recht bestaat op een algemene eindejaarsuitkering en kan de wijze
      worden vastgesteld waarop deze uitkering wordt berekend.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel108
  - number: '109'
    text: 'In deze paragraaf wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel109
  - number: 109.a
    text: |-
      rekeneenheden: de eenheden die voor de instelling beschikbaar zijn op grond van het [Formatiebesluit WPO][ref1],
      het [Formatiebesluit WEC][ref2] of het [Besluit trekkende bevolking WPO][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0005441
      [ref2]: https://wetten.overheid.nl/BWBR0005442
      [ref3]: https://wetten.overheid.nl/BWBR0003833
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel109
    references:
      - id: ref1
        bwb_id: BWBR0005441
      - id: ref2
        bwb_id: BWBR0005442
      - id: ref3
        bwb_id: BWBR0003833
  - number: 109.b
    text: 'formatiebudget: het totaal aan rekeneenheden dat voor een instelling beschikbaar is.'
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel109
  - number: '110.1'
    text: |-
      Het bevoegd gezag stelt vóór 1 mei van ieder jaar de formatie van de instelling voor het daaropvolgend schooljaar
      vast.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel110
  - number: '110.2'
    text: 'De formatie, bedoeld in het eerste lid, wordt onderscheiden in de volgende categorieën:'
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel110
  - number: 110.2.a
    text: de door het bevoegd gezag structureel gewenste functies naar aard, niveau en omvang;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel110
  - number: 110.2.b
    text: functies die naar het oordeel van het bevoegd gezag nog slechts één schooljaar kunnen worden gehandhaafd;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel110
  - number: 110.2.c
    text: |-
      functies in verband met een project waarvoor door het bevoegd gezag dan wel door Onze Minister gedurende 3 of
      minder schooljaren uit additionele middelen formatie beschikbaar is gesteld en die door het bevoegd gezag niet in
      de onder a bedoelde formatie zijn opgenomen.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel110
  - number: '110.3'
    text: |-
      Het bevoegd gezag neemt in de vast te stellen formatie, bedoeld in het tweede lid, onder a, van de instelling in
      elk geval de functies op van de reeds in deze formatie opgenomen en in vaste dienst verbonden betrokkenen voor de
      omvang van de betrekking waarin zij zijn benoemd, tenzij dit in het licht van een goede en doelmatige uitvoering
      van de aan de instelling te verrichten werkzaamheden in redelijkheid niet van het bevoegd gezag kan worden gevergd.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel110
  - number: '110.4'
    text: |-
      Indien in de vast te stellen formatie, bedoeld in het tweede lid, onder a, daarvoor ruimte is ontstaan, neemt het
      bevoegd gezag onder gelijke voorwaarden als genoemd in het derde lid, hierin tevens op functies van in vaste dienst
      verbonden betrokkenen die deel uitmaken van de formatie, bedoeld in het tweede lid, onder b.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel110
  - number: '110.5'
    text: |-
      Indien Onze Minister voor korter dan een schooljaar formatierekeneenheden beschikbaar heeft gesteld, wordt in
      afwijking van het eerste lid, de formatie, bedoeld in het tweede lid, onder c, tijdens het schooljaar opnieuw
      vastgesteld voor zover de toekenning dan wel het vervallen van deze formatierekeneenheden geschiedt tijdens het
      schooljaar.
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel110
  - number: '111.1'
    text: |-
      Indien in de formatie, bedoeld in [artikel 110, tweede lid, onder a][ref1], een functie beschikbaar komt, wordt die
      functie door het bevoegd gezag toegedeeld aan de betrokkene wiens functie is opgenomen in de formatie, bedoeld in
      [artikel 110, tweede lid, onder b][ref2], tenzij dit in het licht van een goede en doelmatige uitvoering van de aan
      de instelling te verrichten werkzaamheden in redelijkheid niet van het bevoegd gezag kan worden gevergd.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel110
      [ref2]: https://wetten.overheid.nl/BWBR0015136#Artikel110
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel111
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '110'
        hoofdstuk: '1'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0015136
        artikel: '110'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: '111.2'
    text: |-
      Indien een bevoegd gezag voornemens is over te gaan tot herbenoeming van een betrokkene wiens dienstverband
      is beëindigd in verband met ziekte en arbeidsongeschiktheid, wordt de betrokkene benoemd voor ten hoogste de
      betrekkingsomvang die overeenkomt met zijn restvaliditeit en voor ten hoogste de betrekkingsomvang die vóór
      de beëindiging van het dienstverband voor hem in de formatie, bedoeld in [artikel 110, tweede lid][ref1], was
      opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0015136#Artikel110
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel111
    references:
      - id: ref1
        bwb_id: BWBR0015136
        artikel: '110'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: '112.1'
    text: |-
