  - number: 1.e
    text: 'betrokkene:'
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel1
  - number: 1.e.1°
    text: |-
      een lid van het personeel dat door een bevoegd gezag is benoemd ten behoeve van het verrichten van werkzaamheden
      aan door het bevoegd gezag in stand gehouden instellingen als bedoeld in onderdeel d, onder 1°;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel1
  - number: 1.e.2°
    text: |-
      een lid van het personeel dat door een bevoegd gezag is benoemd ten behoeve van het verrichten van werkzaamheden
      aan door het bevoegd gezag in stand gehouden instellingen als bedoeld in onderdeel d, onder 2°;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel1
  - number: 1.e.3°
    text: |-
      een lid van het personeel dat door een bevoegd gezag is benoemd ten behoeve van het verrichten van werkzaamheden
      aan door het bevoegd gezag in stand gehouden instellingen als bedoeld in onderdeel d, onder 3°;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel1
  - number: 1.f
    text: 'bevoegd gezag:'
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel1
  - number: 1.f.1°
    text: |-
      ten aanzien van de instellingen genoemd in onderdeel d, onder 1° of 2° voor wat betreft: - een openbare of uit
      de openbare kas bekostigde school: a. het college van burgemeester en wethouders, voor zover de raad niet anders
      bepaalt, en, indien de raad dit besluit, met inachtneming van door hem te stellen regelen, b. het krachtens de
      desbetreffende gemeenschappelijke regeling bevoegde orgaan, c. de openbare rechtspersoon, bij verordening door een
      of meer gemeenteraden ingesteld, d. de stichting, opgericht tot instandhouding van een of meer openbare en een of
      meer bijzondere scholen,
        - een bijzondere school: het schoolbestuur;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel1
  - number: 1.f.2°
    text: 'ten aanzien van de instellingen genoemd in onderdeel d, onder 3°: het bestuur;'
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel1
  - number: 1.g
    text: |-
      werktijdfactor: het gedeelte van de normbetrekking waarvoor een personeelslid is benoemd, waarbij de uitkomst
      rekenkundig wordt afgerond op vier cijfers achter de komma;
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel1
  - number: 1.h
    text: 'inspectie: de inspectie van het onderwijs, belast met het toezicht op de desbetreffende instelling;'
    url: https://wetten.overheid.nl/BWBR0015136/2004-05-28#Artikel1
  - number: 1.i
    text: |-
      normbetrekking: de betrekking of de betrekkingen waarvan de omvang op jaarbasis na aftrek van het verlof op grond
      van [artikel 12][ref1] respectievelijk [artikel 17, tweede lid, eerste volzin][ref2] en na aftrek van het verlof op
      grond van [artikel 33][ref3], gelijk is aan 1659 uren en waarbij de gemiddelde weektaak op jaarbasis gelijk is aan
      36,86 uren;


