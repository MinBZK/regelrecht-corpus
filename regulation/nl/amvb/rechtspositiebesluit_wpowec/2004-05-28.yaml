        artikel: C1
      - id: ref2
        bwb_id: BWBR0015136
        artikel: '152'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: '276.1'
    text: |-
      De betrokkene voor wie als leraar met toepassing van
      [artikel C1 van het Besluit overgangsmaatregelen s.o. 1985][ref1] een uitzicht is vastgesteld, behoudt aanspraak
      op vaststelling van zijn salaris overeenkomstig dat uitzicht, zolang hij zonder wezenlijke onderbreking werkzaam
      blijft in een functie als bedoeld in [titel 12][ref2] of [13 van hoofdstuk 1][ref3], in het onderwijs, genoemd
      in de tweede volzin. Onder onderwijs als bedoeld in de eerste volzin wordt verstaan: het speciaal onderwijs of
      het voortgezet speciaal onderwijs als bedoeld in de [Wet op de expertisecentra][ref4], het onderwijs aan speciale
      scholen voor basisonderwijs, al dan niet met een afdeling als bedoeld in de [Wet op het primair onderwijs][ref5]
      en het onderwijs aan scholen voor praktijkonderwijs als bedoeld in de [Wet op het voortgezet onderwijs][ref6]. Ten
      aanzien van de leraar aan een speciale school voor basisonderwijs wordt onder onderwijs als bedoeld in de eerste
      volzin mede verstaan het onderwijs aan basisscholen als bedoeld in de [Wet op het primair onderwijs][ref7] in een
      functie met een maximumschaal die ten minste gelijk is aan schaal 10.


      [ref1]: https://wetten.overheid.nl/BWBR0003808#ArtikelC1
      [ref2]: https://wetten.overheid.nl/BWBR0015136#Hoofdstuk1
      [ref3]: https://wetten.overheid.nl/BWBR0015136#Hoofdstuk1
