  - number: '274.6'
    text: |-
      De toelage, bedoeld in het tweede, het derde, het vierde en het vijfde lid, bedraagt een evenredig deel van het
      in [bijlage 2, onderdeel 6][ref1], bedoelde maandbedrag, rekenkundig afgerond op centen, indien de betrokkene een
      betrekkingsomvang anders dan een normbetrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0015136
